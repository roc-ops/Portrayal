<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portrayal demo — Edgecore AS7726-32X</title>
<style>
  body { font-family: system-ui, sans-serif; background: #16181b; color: #d7dbdf; margin: 0; }
  nav { display: flex; gap: 0.25rem; padding: 0.6rem 1rem 0; background: #101214; border-bottom: 1px solid #33373c; }
  nav button { background: #1c1f23; color: #9aa1a8; border: 1px solid #33373c; border-bottom: none;
               border-radius: 8px 8px 0 0; padding: 0.5rem 1.2rem; cursor: pointer; font-size: 0.95rem; }
  nav button.active { background: #16181b; color: #f0f2f4; border-color: #4a4f55; }
  iframe { width: 100%; border: none; display: block; height: calc(100vh - 46px); }
</style>
</head>
<body>
<nav>
  <select id="dev" style="background:#1c1f23;color:#d7dbdf;border:1px solid #33373c;border-radius:6px;margin-bottom:0.3rem"></select>
  <button data-src="explore.html" class="active">Explorer</button>
  <button data-src="interactive.html">Interactive</button>
  <button data-src="entities.html">Entity map</button>
  <button data-src="3d.html">3D</button>
  <button data-src="components.html">Components</button>
  <button data-src="callouts.html">Callouts</button>
  <button data-src="compare.html">Photo compare</button>
</nav>
<iframe id="frame" src="interactive.html"></iframe>
<script>
let DEV = 'as7726-32x';
// Build stamp appended to every iframe URL. A hard refresh bypasses the cache for
// the document it reloads, but this shell navigates the iframe from JS afterwards,
// and that is a fresh navigation which goes through the normal HTTP cache - so a
// stale 3d.html survived reload after reload. Versioning the URL makes each deploy
// a distinct cache key. Data fetches already use cache:'no-store'.
let VER = '';
function nav(src) {
  const q = `${src}?device=${DEV}` + (VER ? `&v=${VER}` : '');
  document.getElementById('frame').src = q;
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  nav(b.dataset.src);
});
(async () => {
  const sel = document.getElementById('dev');
  const res = await fetch('../dist/devices.json', {cache: 'no-store'});
  // Last-Modified changes on every deploy, so it works as a build stamp for free
  VER = (res.headers.get('Last-Modified') || '').replace(/\W/g, '');
  const d = await res.json();
  d.devices.forEach(x => {
    const o = document.createElement('option');
    o.value = x.name; o.textContent = x.model;
    sel.appendChild(o);
  });
  sel.onchange = () => { DEV = sel.value; nav(document.querySelector('nav button.active').dataset.src); };
  nav('interactive.html');
})();
</script>
</body>
</html>
