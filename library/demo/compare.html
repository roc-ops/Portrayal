<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portrayal — photo overlay comparison</title>
<style>
  body { font-family: system-ui, sans-serif; background: #16181b; color: #d7dbdf; margin: 1.5rem; }
  .controls { display: flex; gap: 1.2rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
  .controls label { font-size: 0.85rem; display: flex; gap: 0.4rem; align-items: center; }
  .stage { position: relative; border: 1px solid #33373c; }
  .stage svg { width: 100%; height: auto; display: block; }
  .stage img { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none;
               transform-origin: top left; }
  #cal { font-family: ui-monospace, monospace; font-size: 0.8rem; color: #9aa1a8; margin-top: 0.6rem; }
  select, input[type=number] { background: #2b2f33; color: #d7dbdf; border: 1px solid #4a4f55; border-radius: 4px; }
</style>
</head>
<body>

<h3>Photo ↔ SVG overlay</h3>
<div class="controls">
  <label>View <select id="view"></select></label>
  <label>Photo opacity <input id="op" type="range" min="0" max="100" value="55"></label>
  <label>Wipe (photo left | svg right) <input id="wipe" type="range" min="0" max="100" value="100"></label>
  <label>Scale% <input id="sc" type="number" step="0.2" value="100" style="width:4.5rem"></label>
  <label>dx% <input id="dx" type="number" step="0.05" value="0" style="width:4.5rem"></label>
  <label>dy% <input id="dy" type="number" step="0.1" value="0" style="width:4.5rem"></label>
</div>
<div class="stage" id="stage"><div id="svgbox"></div><img id="photo"></div>
<div id="cal"></div>
<script>
const DEV = new URLSearchParams(location.search).get('device') || 'as7726-32x';
const CAL = {};
const $ = id => document.getElementById(id);
async function load() {
  const v = $('view').value;
  if (!v) return;
  CAL[v] = CAL[v] || {sc: 100, dx: 0, dy: 0};
  const r = await fetch(`../dist/${DEV}.${v}.svg`, {cache: 'no-store'});
  $('svgbox').innerHTML = await r.text();
  $('photo').src = `reference/${DEV}/${v}.png`;
  $('sc').value = CAL[v].sc; $('dx').value = CAL[v].dx; $('dy').value = CAL[v].dy;
  apply();
}
async function initViews() {
  const idx = await (await fetch(`../dist/${DEV}.configs.json`, {cache: 'no-store'})).json();
  const sel = $('view');
  for (const v of idx.views || ['front', 'rear']) {
    const ok = await new Promise(res => {
      const im = new Image();
      im.onload = () => res(true); im.onerror = () => res(false);
      im.src = `reference/${DEV}/${v}.png`;
    });
    if (ok) { const o = document.createElement('option'); o.textContent = v; sel.appendChild(o); }
  }
  if (!sel.options.length) document.getElementById('cal').textContent =
    `no reference photos for ${DEV} — drop PNGs in demo/reference/${DEV}/<view>.png`;
}
function apply() {
  const v = $('view').value;
  CAL[v] = {sc: +$('sc').value, dx: +$('dx').value, dy: +$('dy').value};
  const p = $('photo');
  p.style.opacity = $('op').value / 100;
  p.style.transform = `translate(${CAL[v].dx}%, ${CAL[v].dy}%) scale(${CAL[v].sc / 100})`;
  const w = +$('wipe').value;
  p.style.clipPath = `inset(0 ${100 - w}% 0 0)`;
  $('cal').textContent = `calibration ${v}: scale ${CAL[v].sc}%  dx ${CAL[v].dx}%  dy ${CAL[v].dy}%`;
}
['op','wipe','sc','dx','dy'].forEach(id => $(id).addEventListener('input', apply));
$('view').addEventListener('change', load);
(async () => { await initViews(); load(); })();
</script>
</body>
</html>
