<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portrayal — part study</title>
<style>
  body { font-family: system-ui, sans-serif; background: #16181b; color: #d7dbdf; margin: 0;
         display: grid; grid-template-columns: 1fr 25rem; height: 100vh; overflow: hidden; }
  #view { position: relative; }
  #side { border-left: 1px solid #2b3035; padding: 1rem 1.1rem; overflow-y: auto; background: #131518; }
  h1 { font-size: 1rem; margin: 0 0 0.15rem; }
  h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: #8d939a;
       margin: 1.3rem 0 0.4rem; font-weight: 600; }
  .sub { color: #8d939a; font-size: 0.8rem; margin: 0 0 0.5rem; }
  table { border-collapse: collapse; width: 100%; font-size: 0.76rem; }
  th { text-align: left; color: #8d939a; font-weight: 600; padding: 0.25rem 0.3rem; }
  td { padding: 0.25rem 0.3rem; border-top: 1px solid #24272b; font-variant-numeric: tabular-nums; }
  td.n { text-align: right; font-family: ui-monospace, monospace; }
  .ok { color: #4ade80; } .warn { color: #f59e0b; }
  .note { font-size: 0.72rem; color: #767d84; line-height: 1.45; margin-top: 0.5rem; }
  #hud { position: absolute; bottom: 0.8rem; left: 0.9rem; background: #0c0e10cc;
         border: 1px solid #33373c; border-radius: 6px; padding: 0.35rem 0.65rem; font-size: 0.78rem; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"><div id="hud">loading…</div></div>
<div id="side">
  <h1 id="title">part study</h1>
  <p class="sub" id="subtitle"></p>
  <h2>Drawing vs model</h2>
  <table id="dims"><thead><tr><th>dimension</th><th class="n">drawing</th><th class="n">model</th><th></th></tr></thead><tbody></tbody></table>
  <p class="note" id="notes"></p>
  <h2>Provenance</h2>
  <div class="note" id="prov"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { configureRelief, buildFaceRelief, canvasTex, svgCanvas } from './relief.js';
import { mountShare } from './share.js';

const PARAMS = new URLSearchParams(location.search);
const REF = PARAMS.get('part') || 'common/qsfp-transceiver@1';
const PXMM = 16;                  // a single small part, so afford real density

// What the mechanical drawing calls out, transcribed once so the page can check
// the model against it rather than restating numbers that might drift.
const DRAWING = {
  'common/qsfp-transceiver@1': {
    title: 'QSFP transceiver',
    source: 'vendor mechanical drawing — QSFP module with white pull latch',
    dims: [
      ['module width',        18.35, m => m.size.w,                 '±0.10'],
      ['module height',        8.50, m => m.size.h,                 '±0.10'],
      ['bail width (max)',    19.00, (m, tab) => tab.size.w,  'MAX'],
      ['bail thickness (max)', 3.40, (m, tab) => tab.size.h,  'MAX'],
      ['bail reach (max)',    34.80, (m, tab) => tab.relief.features[0].out, 'MAX — from common/qsfp-pull-tab'],
      ['body depth',           83.2, m => m.body.depth,             '118 overall less the 34.80 tab reach'],
    ],
    notes: 'Body geometry is rebuilt from common/qsfp-drawing after those views '
         + 'were corrected against photographs - 83.2 deep, stepping down 0.85 at '
         + '17.2 back from the face, with the shell, PCB and guide plate nesting at '
         + 'the rear at their own lengths and widths. The optical face is a skin, '
         + 'MPO or LC duplex. The pull tab is a loft: rounded-rectangle sections '
         + 'swept along the plan outline from top.svg, so the 3.2 tip radius and '
         + 'the 2.4 finger-slot radius are modelled rather than approximated, and '
         + 'the flattened-M side profile is followed exactly instead of bent onto. '
         + 'Overall comes out 118, the reference length on the drawing. Remaining '
         + 'discrepancy: top.svg closes the slot 1.8 before the body and the 3D '
         + 'leaves it open to the body, which reads the same only because the body '
         + 'is immediately behind it.',
  },
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1e22);
const view = document.getElementById('view');
const camera = new THREE.PerspectiveCamera(38, 1, 1, 4000);
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
globalThis.__portrayalPart = {THREE, scene, camera, renderer, controls};

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(0.6, 1, 0.9); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-0.6, -0.3, -0.8); scene.add(fill);

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
addEventListener('resize', resize);
configureRelief({THREE, renderer, PXMM, FRU_PATHS: new Set()});
const hud = m => { document.getElementById('hud').textContent = m; };

(async () => {
  // The two-file index: this page is the one consumer that reads `provenance`
  // (the panel at the bottom) and `relief` (the bail-reach row in DRAWING), so
  // it is the one page that pays for components-detail.json. The device viewer
  // and the browser read neither and no longer download them. Merged back onto
  // the entries here, so everything below still reads one object.
  const [idx, det] = await Promise.all([
    fetch('../dist/components.json').then(r => r.json()),
    fetch('../dist/components-detail.json').then(r => r.json()),
  ]);
  for (const c of idx.components)
    Object.assign(c, det.components[`${c.ns}/${c.name}@${c.major.slice(1)}`] || {});
  const [ns, rest] = REF.split('/');
  const [name, major] = rest.split('@');
  const meta = idx.components.find(c => c.ns === ns && c.name === name && c.major === 'v' + major);
  if (!meta) { hud('part not in the index'); return; }
  const spec = DRAWING[REF];
  // a composed part's dimensions live on the part, not the parent
  const partOf = ref => {
    if (!ref) return null;
    const [pns, prest] = ref.split('/');
    const [pname, pmaj] = prest.split('@');
    return idx.components.find(c => c.ns === pns && c.name === pname && c.major === 'v' + pmaj);
  };

  const W = meta.size.w, H = meta.size.h, D = (meta.body && meta.body.depth) || 20;
  const face = PARAMS.get('face') || meta.skins[0];
  const f = v => `../dist/components/${ns}--${name}--v${major}--${v}.svg`;

  // the module face, with its relief, plus the five body sides
  const meshes = [], faceCv = {}, faceSvg = {}, facePunch = {};
  await buildFaceRelief(
    {view: 'face', fw: () => W, fh: () => H, pos: () => [0, 0, D / 2], rot: [0, 0, 0]},
    {src: f(face), faceCv, faceSvg, facePunch, meshes,
     FRU_GROUPS: {}, FRU_META: {}, BODY_META: {}, D, bodyBoxMesh: null});
  // buildFaceRelief fills `meshes` and does not parent them - 3d.html does this
  // at its reliefGroup. Without it the face texture gets its alpha punched and
  // nothing fills the recess, so you look straight through to the body inside.
  // The tab is skipped: the skin carries it as a 34.8 protrusion, and this page
  // builds the tab itself as a loft, so taking both would double it up.
  // Relief hands back a single group holding everything it built, and that
  // group carries the face-plane transform. Object3D.add() does NOT preserve
  // world transform, so lifting the children out of it silently drops that
  // offset - an earlier attempt did exactly that and put the cavities 41.6
  // behind where they belong. Prune inside the group instead, then add the
  // group itself.
  const facePlane = D / 2;
  const reliefAudit = [];
  for (const m of meshes) {
    // Compose the matrices first. Until something renders, matrixWorld is still
    // identity, so Box3.setFromObject reports LOCAL coordinates - and comparing
    // those against a world-space face plane silently keeps everything.
    m.updateWorldMatrix(true, true);
    const kids = m.isGroup ? [...m.children] : [m];
    let keptAny = false;
    for (const n of kids) {
      // measured while still parented, so this is world z
      const bb = new THREE.Box3().setFromObject(n);
      // A recess sits at or behind the face; anything reaching in front of it
      // is a protrusion, which here is the tab - and this page builds its own
      // tab as a loft, so keeping relief's too would double it up.
      const keep = bb.max.z <= facePlane + 0.01;
      reliefAudit.push({kept: keep,
                        z: [+bb.min.z.toFixed(2), +bb.max.z.toFixed(2)]});
      if (keep) keptAny = true;
      else if (m.isGroup) m.remove(n);
    }
    if (m.isGroup || keptAny) scene.add(m);
  }
  globalThis.__portrayalPart.relief = {audit: reliefAudit, all: meshes};

  const plain = () => new THREE.MeshLambertMaterial({color: meta.body?.color || 0x8d949c});
  const side = async (v, wmm, hmm, fx, fy) => {
    const cv = await svgCanvas(f('body-' + v), wmm, hmm, fx, fy);
    return cv ? new THREE.MeshLambertMaterial({map: canvasTex(cv)}) : plain();
  };
  const mats = [
    await side('right', D, H), await side('left', D, H),
    await side('top', W, D),   await side('bottom', W, D, true, true),
    faceCv.face ? new THREE.MeshLambertMaterial(
      {map: canvasTex(faceCv.face), transparent: true, alphaTest: 0.08}) : plain(),
    await side('rear', W, H),
  ];
  // The body is not a single box. It steps down behind the tab, and its rear
  // ends in three tongues of different length, width and height - shell, PCB
  // and guide plate. Painting that on a cuboid's sides was what made the 3D
  // disagree with the 2D, so it is built as real geometry.
  const FRONT_D = 17.2, SHORT_H = H - 0.85, DEND = 4.20;
  const MID_D = D - FRONT_D - DEND;
  const zf = D / 2;                              // face plane
  const box = new THREE.Group();
  const shellMat = new THREE.MeshLambertMaterial({color: 0xa9b0b7});

  // full-height section at the face, carrying the six-sided art
  const front = new THREE.Mesh(new THREE.BoxGeometry(W, H, FRONT_D), mats);
  front.position.z = zf - FRONT_D / 2;
  box.add(front);

  // stepped-down mid body
  const mid = new THREE.Mesh(new THREE.BoxGeometry(W, SHORT_H, MID_D), mats);
  mid.position.z = zf - FRONT_D - MID_D / 2;
  box.add(mid);

  // the three rear tongues, each stopping where the drawing stops it
  const TONGUE = [
    {w: W,     h: 2.94, top: 0.42, len: DEND - 0.00, col: 0x8d949c},
    {w: 14.60, h: 1.24, top: 5.01, len: DEND - 1.85, col: 0xc9b98a},
    {w: 12.40, h: 0.93, top: 7.14, len: DEND - 3.09, col: 0x6f767d},
  ];
  const zBack = zf - FRONT_D - MID_D;
  for (const t of TONGUE) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(t.w, t.h, t.len),
                             new THREE.MeshLambertMaterial({color: t.col}));
    // drawing y runs down from the top of the 8.50 envelope
    m.position.set(0, H / 2 - (t.top + t.h / 2), zBack - t.len / 2);
    box.add(m);
  }
  scene.add(box);

  // The pull tab, as the corrected 2D has it: a flat loop, not two rails and
  // not a round bail. Tip pad, two side rails, and a base where it meets the
  // body - the gap between the rails IS the finger opening, so it is modelled
  // rather than painted. Anchored at the top edge so a cable passes underneath.
  const TAB = {w: 19.0, t: 3.40, reach: 34.80, pad: 8.4, slotEnd: 33.0, rail: 2.3};
  const tabMat = new THREE.MeshLambertMaterial({color: 0xe8dcc0});
  const tabG = new THREE.Group();

  // side.svg has the tab as a flattened M - two crests with a valley between.
  // These are that path's control points, as an offset from the anchored line,
  // measured from the tip.
  const WAVE = [[0, 1.35], [7, 0.0], [14, 1.35], [21, 0.0], [TAB.reach, 0.35]];
  const waveAt = zTip => {
    for (let i = 0; i < WAVE.length - 1; i++) {
      const [z0, y0] = WAVE[i], [z1, y1] = WAVE[i + 1];
      if (zTip <= z1) {
        const k = (zTip - z0) / (z1 - z0);
        return y0 + (y1 - y0) * (1 - Math.cos(Math.PI * k)) / 2;
      }
    }
    return WAVE[WAVE.length - 1][1];
  };

  // The tab is moulded plastic, so it wants one smooth shape, not stacked
  // boxes. Two earlier attempts are recorded in docs/HANDOFF-qsfp.md and both
  // failed the same way: ExtrudeGeometry puts no vertices along the cap face,
  // so bending an extrusion onto the wave could only approximate it, and a
  // wider bevel rounds the section rather than the plan.
  //
  // This sweeps the section along the plan outline instead - a loft. Every
  // station carries a complete section, so the top and bottom faces have as
  // many vertices as there are stations and follow the wave exactly.

  // Plan outline read off skins/top.svg, the view measured against both the
  // drawing and the photographs: 19.0 across, 3.2 radius at the tip, finger
  // opening a 2.4-radius slot starting 8.4 back. Neither radius had reached
  // the 3D model - the tip was square in plan, and so was the slot.
  const PLAN = {tipR: 3.2, slotR: 2.4, slotHalf: TAB.w / 2 - TAB.rail};
  const outerHalf = z => {
    const r = PLAN.tipR, flat = TAB.w / 2 - r;
    return z >= r ? TAB.w / 2
                  : flat + Math.sqrt(Math.max(0, r * r - (r - z) * (r - z)));
  };
  const slotHalf = z => {
    const r = PLAN.slotR, cz = TAB.pad + r, flat = PLAN.slotHalf - r;
    if (z <= TAB.pad) return flat;
    return z >= cz ? PLAN.slotHalf
                   : flat + Math.sqrt(Math.max(0, r * r - (cz - z) * (cz - z)));
  };

  // A station is one rounded-rectangle section placed at one z. Sampling every
  // station at the same point count is what lets consecutive ones stitch into
  // quads. Local z is negated, as the badge does it, so the tip is +z.
  const NA = 5, M = 4 * (NA + 1);
  const sweep = stations => {
    const pos = [], idx = [];
    for (const s of stations) {
      const R = Math.max(0.02, Math.min(s.r, s.hw, s.hh));
      const cor = [[s.hw - R, s.hh - R], [R - s.hw, s.hh - R],
                   [R - s.hw, R - s.hh], [s.hw - R, R - s.hh]];
      for (let k = 0; k < 4; k++) for (let i = 0; i <= NA; i++) {
        const a = (k + i / NA) * Math.PI / 2;
        pos.push(s.xc + cor[k][0] + R * Math.cos(a),
                 s.yc + cor[k][1] + R * Math.sin(a), -s.z);
      }
    }
    for (let j = 0; j < stations.length - 1; j++) for (let i = 0; i < M; i++) {
      const v0 = j * M + i, v1 = j * M + (i + 1) % M;
      idx.push(v0, v0 + M, v1, v1, v0 + M, v1 + M);
    }
    // Caps are fanned from the section centre off their OWN copy of the ring.
    // Sharing the ring let computeVertexNormals average the cap's normal into
    // the side surface, which smeared the hard end edge into a shaded band a
    // millimetre wide - readable as a crease where the pad met the rails.
    const cap = (s, base, flip) => {
      const ring = pos.length / 3;
      for (let i = 0; i < M; i++) {
        const k = (base + i) * 3;
        pos.push(pos[k], pos[k + 1], pos[k + 2]);
      }
      const mid = pos.length / 3;
      pos.push(s.xc, s.yc, -s.z);
      for (let i = 0; i < M; i++) {
        const a = ring + i, b = ring + (i + 1) % M;
        if (flip) idx.push(mid, b, a); else idx.push(mid, a, b);
      }
    };
    cap(stations[0], 0, false);
    cap(stations[stations.length - 1], (stations.length - 1) * M, true);

    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  };

  // one bevel for the whole tab. Two different ones left a crease at the
  // pad/rail joint, because the rounded top edges met at the same y but with
  // different radii and the shading broke along the seam.
  const BEVT = 0.30;
  const yAt = z => -waveAt(z);

  // Tip pad. The leading stations roll the front edge over: at u ahead of the
  // tip the section insets by bev - sqrt(bev^2 - u^2), the profile a ball of
  // that radius leaves behind, so the nose rounds in section as well as plan.
  const padSt = [], NROLL = 5, NPAD = 64;
  for (let k = 0; k <= NROLL; k++) {
    const a = (Math.PI / 2) * (k / NROLL);
    const z = BEVT * (1 - Math.cos(a)), d = BEVT * (1 - Math.sin(a));
    padSt.push({z, xc: 0, yc: yAt(z),
                hw: outerHalf(z) - d, hh: TAB.t / 2 - d, r: BEVT - d});
  }
  for (let k = 1; k <= NPAD; k++) {
    const z = BEVT + (TAB.pad - BEVT) * (k / NPAD);
    padSt.push({z, xc: 0, yc: yAt(z), hw: outerHalf(z), hh: TAB.t / 2, r: BEVT});
  }

  // Rails. Their inner edge follows the slot, so they thicken towards the pad -
  // that rounded inner corner is the one you see through the finger opening.
  const railSt = side => {
    const st = [], N = 124, z0 = TAB.pad - BEVT;
    for (let k = 0; k <= N; k++) {
      const z = z0 + (TAB.reach - z0) * (k / N);
      // the leading BEVT is buried in the pad and tapered in, so the two meshes
      // never share a surface - butting them flush put a seam across the plan
      const sink = z < TAB.pad ? 0.06 * (TAB.pad - z) / BEVT : 0;
      const inner = slotHalf(z), outer = outerHalf(z);
      st.push({z, xc: side * (inner + outer) / 2, yc: yAt(z),
               hw: (outer - inner) / 2 - sink, hh: TAB.t / 2 - sink, r: BEVT});
    }
    return st;
  };

  for (const st of [padSt, railSt(-1), railSt(1)]) {
    const m = new THREE.Mesh(sweep(st), tabMat);
    m.position.set(0, H / 2 - 0.35 - TAB.t / 2, zf + TAB.reach);
    tabG.add(m);
  }

  // 100G, moulded into the tip pad
  const cv100 = document.createElement('canvas');
  cv100.width = 256; cv100.height = 128;
  const c1 = cv100.getContext('2d');
  c1.fillStyle = '#e8dcc0'; c1.fillRect(0, 0, 256, 128);
  c1.strokeStyle = '#c9bd9c'; c1.lineWidth = 7;
  c1.beginPath(); c1.roundRect(14, 20, 228, 88, 44); c1.stroke();
  c1.fillStyle = '#c9bd9c'; c1.font = 'bold 62px system-ui'; c1.textAlign = 'center';
  c1.textBaseline = 'middle'; c1.fillText('100G', 128, 66);
  // Built vertex by vertex in the tab's own frame rather than as a rotated
  // plane. Orientation and contour then follow from the coordinates instead of
  // from an Euler order, which is what kept coming out wrong.
  {
    const BW = 9.9, BL = 5.1, NX = 10, NZ = 6;   // across the tab, along it
    const z0 = TAB.pad / 2;
    const g = new THREE.BufferGeometry();
    const verts = [], uvs = [], idx = [];
    for (let j = 0; j <= NZ; j++) {
      for (let i = 0; i <= NX; i++) {
        const u = i / NX, v = j / NZ;
        const x = (u - 0.5) * BW;
        const zTip = z0 + (v - 0.5) * BL;
        verts.push(x, -waveAt(zTip) + TAB.t / 2 + 0.05, -zTip);
        // z is negated when building, which mirrors the texture unless u is too.
        // Both axes flipped again from that, to turn the badge 180.
        uvs.push(u, v);
      }
    }
    for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) {
      const a = j * (NX + 1) + i, b = a + 1, c = a + NX + 1, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
    g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    const badge = new THREE.Mesh(g, new THREE.MeshLambertMaterial(
      {map: canvasTex(cv100), side: THREE.DoubleSide}));
    badge.position.set(0, H / 2 - 0.35 - TAB.t / 2, zf + TAB.reach);
    tabG.add(badge);
  }
  scene.add(tabG);
  mountShare(scene, `portrayal-${name}-v${major}-${face}`,
             {note: 'GLB opens in Quick Look, PowerPoint, Blender'});
  // frame the part including the bail reach, so nothing sits off screen
  const reach = spec ? spec.dims.find(d => d[0].startsWith('bail reach'))?.[1] || 0 : 0;
  const span = D + reach;
  resize();
  controls.target.set(0, 0, reach / 2);
  camera.position.set(span * 0.75, span * 0.42, span * 0.95);
  controls.update();

  // report the model against the drawing
  document.getElementById('title').textContent = spec ? spec.title : `${ns}/${name}`;
  document.getElementById('subtitle').textContent = spec ? spec.source : REF;
  const tb = document.querySelector('#dims tbody');
  if (spec) {
    for (const [label, drawn, get, note] of spec.dims) {
      let got;
      try { got = get(meta, partOf(meta.parts && meta.parts[0])); } catch { got = undefined; }
      const same = typeof got === 'number' && Math.abs(got - drawn) < 0.005;
      tb.insertAdjacentHTML('beforeend',
        `<tr><td>${label}<div class="note">${note}</div></td>` +
        `<td class="n">${drawn.toFixed(2)}</td>` +
        `<td class="n">${got === undefined ? '—' : Number(got).toFixed(2)}</td>` +
        `<td class="${same ? 'ok' : 'warn'}">${same ? '✓' : '≠'}</td></tr>`);
    }
    document.getElementById('notes').textContent = spec.notes;
  }
  document.getElementById('prov').innerHTML = Object.entries(meta.provenance || {})
    .map(([k, v]) => `<b>${k}</b> — ${v}`).join('<br><br>');

  hud(`${W} × ${H} × ${D} mm — drag to orbit`);
  (function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
})();
</script>
</body>
</html>
