  RK1219WALLOH: 4-Post 12U Hinged Wall-Mount Network Rack, 19" Open Frame Server Rack with 19.8in Mounting Depth
description: >-
  The StarTech.com 12U hinged open frame wall rack, in black steel with L-shape
  rails that have square holes for cage nuts. The frame has two front vertical
  rails and two rear vertical rails, and ships fully assembled with 48 #10-32 cage
  nuts and screws.
  Four anchor points on the rear panel fix it to a wall, 16 in apart centre to
  centre. Two latches hold the front frame to the wall bracket. With the latches
  released the whole frame swings out toward its hinge for rear access. The wall
  fixing, the hinge and the swing are described here and are not data yet: the
  rack product has no key for them.
