provenance:
  ru:
    confidence: datasheet
    note: >-
      The U Height row of the RK1219WALLOH specification sheet, page 3, says 12U.
  form:
    confidence: datasheet
    note: >-
      The Wallmountable row on page 2 says Yes, and the Frame Type row on page 3
      says Open Frame. The Rack Type row says 4-Post, and the quick-start guide,
      page 1, lists two front and two rear vertical rails. The product is written
      as a wall frame with its front rail alone, the shape the library gives that
      form; the gap below asks about the rear rails.
  width:
    confidence: datasheet
    note: >-
      Page 1 says the rack mounts 19-inch wide equipment, and page 3 names the
      standard EIA/ECA-310-E. The sheet prints no rail width figure.
  holes:
    confidence: datasheet
    note: >-
      The Mounting Hole Types row on page 3 says Square (For Cage Nut). The
      quick-start guide, page 1, says the front and rear vertical rails have
      square cage nut holes, and page 2 says the nuts and screws are #10-32. The
      sheet prints no hole size, so none is written.
  rails:
    confidence: datasheet
    note: >-
      The quick-start guide, page 1, names Front Vertical Rails (x2) and Rear
      Vertical Rails (x2). Only the front rail is written, as the library lists
      for a wall frame. The sheet prints no distance between the front and rear
      rails.
  max-device-depth:
    confidence: datasheet
    note: >-
      Page 2 prints the Maximum Mounting Depth as 19.8 in [50.2 cm], and page 1
      says the same in its text. The metric print is finer and is written, 502
      mm, and the inch figure lies inside its rounding. It is read as the depth
      available to equipment, which is a reading; the gap below says so.
  outer:
    confidence: datasheet
    note: >-
      Page 2 labels its sizes Product Length 23.7 in [60.2 cm], Product Width 21.9
      in [55.5 cm] and Product Height 25.5 in [64.7 cm]. The sheet draws no axes.
      Length is read as front to back, wall to the front of the frame, because the
      Maximum Mounting Depth of 19.8 in is shorter than it and the other two are
      named width and height. Written in mm from the metric prints, d 602, w 555
      and h 647.
  weight-kg:
    confidence: datasheet
    note: >-
      Page 2 prints Weight of Product as 50.1 lb [22.7 kg]. The sheet prints
      inches and pounds first. The pounds figure converted, 22.73 kg, is the finer
      and is written.
  load:
    confidence: datasheet
    note: >-
      Page 2 prints Weight Capacity (No Casters) as 139.7 lb [63.4 kg], and the
      quick-start guide, page 1, says up to 139.7 lb [63.4 kg] for the 12U model.
      The pounds figure converted, 63.37 kg, is the finer. The sheet words the
      row as a rating without casters and the frame has none, so it is written as
      the static load.
  numbering:
    confidence: estimated
    note: >-
      A stand-in. Neither document says anything about unit numbering; bottom-up
      from 1 is the default of the rack file.
  hole-centres:
    confidence: estimated
    note: >-
      A stand-in for the EIA-310 figure, 465.1 mm between hole lines (18.312 in).
      The sheet names the standard as EIA/ECA-310-E and prints no hole spacing.
  opening:
    confidence: estimated
    note: >-
      A stand-in for the EIA-310 minimum clear opening between the rails, 450.85
      mm (17.75 in). Neither document prints a figure for it.
gaps:
  - what: numbering
