    wanted: A dimensioned front view, or a measurement between the rails.
  - what: hole-size
    reason: vendor-silent
    note: The sheet says the holes are square for a cage nut and prints no size.
    wanted: A dimensioned drawing of the rail, or a measurement of a square hole.
  - what: outer-axes
    reason: needs-drawing
    note: >-
      The sheet labels Product Length, Width and Height and draws no axes. Length
      is read as front to back.
    wanted: A dimensioned drawing with the three sizes marked.
  - what: max-device-depth
    reason: vendor-silent
    note: >-
      The sheet prints a Maximum Mounting Depth and not where it is measured from.
      It is written as the depth for equipment, from the front rail.
    wanted: A dimensioned side view, or the usable depth between the rails from the maker.
  - what: rear-rail
    reason: needs-drawing
    note: >-
      The guide lists two rear vertical rails with cage nut holes. A wall frame in
      this library lists the front rail alone and a rear rail with its depth range
      belongs to the four-post forms, so the rear rails and their distance from the
      front are not written.
    wanted: A decision on the form of a four-post wall frame, and a dimensioned side view with the rail spacing.
  - what: wall-fixing
    reason: needs-drawing
    note: >-
      The guide, page 2, says four anchor points on the rear panel, 16 in from
      centre to centre for wooden studs. It prints no hole size and no vertical
      spacing, and the rack product has no key for a wall fixing, so they are in
      the description only.
    wanted: A wall-fixing key in the rack product, and a dimensioned drawing of the rear panel.
  - what: hinge
    reason: needs-drawing
    note: >-
      The guide, page 2, says the frame swings outward toward the hinge and does
      not say which side the hinge is on. It prints no swing angle or clearance,
      and the rack product has no key for a hinge or a swing.
    wanted: A hinge key in the rack product, the hinge side, and the swing clearance from the maker.
