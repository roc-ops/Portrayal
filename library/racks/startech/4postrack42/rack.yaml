  4POSTRACK42: 42U 4-Post Server Rack, 19in Open Frame Rack with 40in (101cm) Mounting Depth and 1323lb (600kg) Weight Capacity, Mobile or Floor Mount IT Rack
description: >-
  The StarTech.com 42U open frame rack, four posts in black steel with L-shape
  rails that have square holes for cage nuts. The rails are adjustable from 22
  to 40 in of mounting depth. It ships flat pack with four casters and four
  leveling feet, and has a base plate with floor-anchoring holes and a
  grounding lug. It is not wall-mountable. The casters, feet and base plate
  are described here and are not data yet: the rack product has no key for a
  base.
