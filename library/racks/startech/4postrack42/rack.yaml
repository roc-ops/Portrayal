  rails:
    confidence: datasheet
    note: >-
      Page 1 prints the Minimum Mounting Depth as 22.0 in [56 cm], written as
      558.8 mm. The Maximum Mounting Depth row prints 3.3 ft [1.0 m], and the
      page title and the listing line on page 3 print 40 in. Not a conflict:
      40 in is 3.33 ft, which rounds to 3.3 ft, and 40 in is written, 1016.0 mm.
      That is a reading of the rounded row. The rear rail adjusts between the
      two; the page prints no step.
  outer:
    confidence: datasheet
    note: >-
      Page 1 prints the Product Length as 3.7 ft [1.1 m], the Product Width as
      23.6 in [60.0 cm], the Product Height as 6.5 ft [2.0 m] and Height with
      Casters as 6.7 ft [2.0 m]. The lengths and heights are in feet to one
      decimal, good to about 15 mm, so they are readings and are written to the
      nearest 10 mm: d 1130 and h 2040, the height with the casters fitted. The
      height without them is 6.5 ft, about 1980 mm. The width is 600 mm from
      the metric print. Length is read as front to back, as the sheet labels
      width and height beside it.
