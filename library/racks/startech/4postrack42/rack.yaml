provenance:
  ru:
    confidence: datasheet
    note: >-
      The U Height row of the data sheet (page 1) and of the manual's
      Specifications table (printed page 18) says 42U.
  form:
    confidence: datasheet
    note: >-
      The Rack Type row (4-Post) and the Frame Type row (Open Frame) of the data
      sheet and of the manual's Specifications table. The manual's Product
      Diagram (printed page 3) shows two left and two right vertical rails joined
      by corner and center beams, with top and base brackets.
  width:
    confidence: datasheet
    note: >-
      The data sheet's title says 19in Open Frame Rack, and its Industry
      Standards row says EIA/ECA-310-E.
  holes:
    confidence: datasheet
    note: >-
      The Mounting Hole Types row of the data sheet says Square (For Cage Nut),
      and the box holds 50 M6 cage nuts. The documents do not say those are the
      nuts for the rails, so no thread is written, and they print no hole size.
  rails:
    confidence: datasheet
    note: >-
      The manual's Mounting Depth Chart (printed page 17) lists every inch from
      22 in to 40 in, 19 settings, each with a pair of index numbers (0 and 0 up
      to 9 and 9) read off the centre beam. The range is 558.8 mm to 1016.0 mm in
      25.4 mm steps, each converted once at 25.4 mm to the inch. The
      Specifications table (printed page 18) prints the same two ends, 22 in
      (558.8 mm) and 40 in (1016 mm). The data sheet prints the ends as 22.0 in
      [56 cm] and 3.3 ft [1.0 m], its title and features as 40in (101cm), and its
      text as 56,0 - 101,7cm; 40 in is 3.33 ft and 101.6 cm, so these are
      roundings of the manual's figures, 1 mm apart at most, and the manual's
      are written. The manual's two index numbers are one for each of the two
      corner beams and are not stored. Two settings, 22 in and 40 in, use half of the
      beam bolts; the manual says the rack is still rated for its full weight.
      Neither document says which face of each rail the depth runs between.
  outer:
    confidence: datasheet
    note: >-
      Width 600 mm: the data sheet's 23.6 in [60.0 cm] and the manual's 600 mm.
      Height 2040 mm with the casters fitted: the data sheet's features give 80.3
      in (204 cm), 2039.6 mm, with casters and 78 in (198 cm), 1981 mm, without.
      Depth 1130 mm: the data sheet's Product Length, 3.7 ft [1.1 m], printed in
      feet to one decimal and good to about 15 mm, read as front to back at the
      40 in setting. The manual's Specifications table prints
      23.6x80.5x26 in (600x2045x662 mm); its 2045 mm height and 662 mm depth
      are not written and are named in the outer-size gap. Length is read as
      front to back, as the data sheet labels width and height beside it.
  weight-kg:
    confidence: datasheet
    note: >-
      The data sheet's Weight of Product and the manual's Weight both print 84.9
      lb (38.5 kg). The pounds figure converted, 38.51 kg, is the finer and is
      written.
  load:
    confidence: datasheet
    note: >-
      The data sheet's table prints Weight Capacity (Stationary) as 1323.0 lb
      [600 kg] and Weight Capacity (Rolling) as 793.8 lb [360 kg]; its text says
      1322lbs and its features 1320lb, each 600 kg. The table's pounds figures
      converted, 600.10 and 360.06 kg, are the finer and are written.
  numbering:
    confidence: estimated
    note: >-
      A stand-in. The data sheet lists U-Markings and does not say which way the
      labels run; bottom-up from 1 is the default of the rack file.
  hole-centres:
    confidence: estimated
    note: >-
      A stand-in for the EIA-310 figure, 465.1 mm between hole lines (18.312
      in). The data sheet names the standard as EIA/ECA-310-E and prints no hole
      spacing.
  opening:
    confidence: estimated
    note: >-
      A stand-in for the EIA-310 minimum clear opening between the rails, 450.85
      mm (17.75 in). The documents print no figure for it.
gaps:
  - what: numbering
    reason: vendor-silent
    note: The data sheet lists U-Markings and does not say which way they run.
    wanted: A photograph of the rail showing the unit labels, or a dimensioned drawing.
  - what: hole-centres
    reason: vendor-silent
    note: The documents print no spacing between the hole lines.
    wanted: A dimensioned front view of the vertical mounting rails.
  - what: opening
    reason: vendor-silent
    note: The documents print no clear opening between the rails.
    wanted: A dimensioned front view, or a measurement between the rails.
  - what: hole-size
    reason: vendor-silent
    note: The documents say the holes are square for a cage nut and print no size.
    wanted: A dimensioned drawing of the rail, or a measurement of a square hole.
  - what: outer-size
    reason: sources-disagree
    note: >-
      The manual's Specifications table prints 23.6x80.5x26 in (600x2045x662 mm)
      for width, height and depth. The data sheet prints a height of 80.3 in (204
      cm) with casters and 78 in (198 cm) without, written as 2040 mm with
      casters, and a Product Length of 3.7 ft [1.1 m], written as 1130 mm. The
      heights differ by 5 mm, and neither document says whether the manual's
      80.5 in has the casters fitted. The depths differ by 468 mm, which is
      about the 457.2 mm the rear rails travel: 662 mm is read as the frame at
      the 22 in setting, 103 mm more than the rail depth, and 1130 mm as the
      frame at the 40 in setting, 114 mm more. That is a reading, and the
      manual's 26 in and 662 mm differ by 1.6 mm between themselves. Each
      document's figure is stated here and nothing is averaged.
    wanted: StarTech's dimensioned drawing, or its statement of whether 80.5 in has the casters fitted and which rail setting 662 mm is.
  - what: max-device-depth
    reason: vendor-silent
    note: The documents print no usable depth for a device, so none is written.
    wanted: The usable depth between the rails, from the maker.
  - what: casters
    reason: needs-drawing
    note: >-
      The frame ships with four casters, mounted by four M6 bolts each at the
      caster mounting holes on the bottom of the rack (manual, printed page 13),
      and the rack product has no key for a base yet, so they are in the
      description only. The documents print no caster size.
    wanted: A base key in the rack product, and the caster size from the maker.
  - what: leveling-feet-and-base-plate
    reason: needs-drawing
    note: >-
      The documents list four leveling feet, which screw into the leveler
      mounting holes on the bottom of the rack (manual, printed page 14), and a
      base plate with floor-anchoring holes and a grounding lug. They are in the
      description only, for the same reason as the casters, and no document
      prints a position or size for them.
    wanted: A base key in the rack product, and a dimensioned drawing of the base plate.
  - what: cable-management
    reason: vendor-silent
    note: >-
      The data sheet lists Built-in Cable Management among its special features,
      and the box holds 24 cable management hooks with 24 screws that go into the
      cable management screw holes along the back of the rack (manual, printed
      page 15). The documents print no hook size and no hole positions, and the
      rack product has no key for cable management, so they are in the
      description only.
    wanted: A dimensioned drawing of the rear rails with the hook holes, and a key for cable management in the rack product.
