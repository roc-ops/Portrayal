  4POSTRACK42: 42U 4-Post Server Rack, 19in Open Frame Rack
description: >-
  The StarTech.com 42U open frame rack, four posts in black steel with L-shape
  rails that have square holes for cage nuts. The rear rails slide on centre
  beams and set in one-inch steps from 22 to 40 in of mounting depth. It ships
  flat pack with four casters and four leveling feet, and has a base plate with
  floor-anchoring holes, an M6 grounding hole inside the base with four
  grounding wires, and 24 cable management hooks that screw on along the back of
  the rack. It is not wall-mountable. The casters, feet, base plate and hooks
  are described here and are not data yet: the rack product has no key for a
  base or for cable management.
