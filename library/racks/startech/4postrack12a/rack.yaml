  4POSTRACK12A: 12U 4 Post Server Equipment Open Frame Rack Cabinet w/ Adjustable Posts & Casters
description: >-
  The StarTech.com 12U open frame rack, four posts in black steel with L-shape
  rails that have square holes for cage nuts. The rails are adjustable for a
  variable mounting depth. It ships flat pack with four swiveling casters, which
  raise the frame to 657 mm, and it is not wall-mountable. The casters are
  described here and are not data yet: the rack product has no key for a base.
