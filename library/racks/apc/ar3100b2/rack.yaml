description: >-
  The APC NetShelter SX second-generation cabinet, 42U, 600 mm wide and 1070 mm deep, in black.
  It has a perforated front door, a split pair of rear doors, two side panels a side, a removable roof
  and two zero-U accessory channels at the rear. Its rails adjust in 6 mm steps. It stands on four casters
  and four levelling feet.
