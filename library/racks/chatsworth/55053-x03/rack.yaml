part-numbers:
  55053-X03: Standard Rack, 7 ft (2.1 m) x 19 in, 45U
description: >-
  The Chatsworth Standard Rack, a 45U two-post frame of bolted aluminium
  extrusion with one pair of C-shaped channels carrying tapped #12-24 holes.
  It is sold in clear aluminium or painted black, gray or glacier white, and
  must be secured to the building structure. The X in the part number stands
  for the colour.
