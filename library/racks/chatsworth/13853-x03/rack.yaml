part-numbers:
  13853-X03: SeismicFrame Two-Post Rack, 7 ft (2.1 m) x 19 in, 44U, tapped #12-24 zinc rails
description: >-
  The Chatsworth SeismicFrame two-post rack, a welded steel 44U frame for 19 in
  equipment, with two pairs of tapped #12-24 zinc-plated rails that sit 6 in or
  3 in apart. The maker rates it for 1000 lb (453.6 kg) as a seismic Zone 4 load
  under GR-63-CORE; that is a seismic rating, not a static load, and is not
  written as one. It is secured to the structural floor with seismic-rated
  anchors and is painted black or gray, or glacier white.
