description: >-
  The FS GF4-Series four-post open frame rack sold as a customized listing in
  42U or 45U, with square-punched rails. The datasheet prints no height, so
  42 is a stand-in, and no rail depth range, so the range is the 45U frame's
  stated as a reading. The FS-OR4P-45U is the same frame at 45U with its own
  drawing.
