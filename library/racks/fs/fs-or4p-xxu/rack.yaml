provenance:
  ru:
    confidence: estimated
    note: >-
      A stand-in. The datasheet specification table (page 2) prints "No. of Rack
      Spaces 42U/45U" and no height, and the listing is customized, so the
      height is chosen when it is bought. 42 is the lower of the two printed
      figures.
  form:
    confidence: datasheet
    note: >-
      "Product Type 4-Post" in the specification table (page 2), with the
      photograph of a black open frame beside it.
  width:
    confidence: datasheet
    note: >-
      "Rack-Mount Width 19'' EIA" in the specification table (page 2).
  holes:
    confidence: datasheet
    note: >-
      "Mounting Rails Square-punched" (page 2). No document gives a hole size
      or what the supplied M6 screws and nuts fit into, so no `size` and no
      `fixing` is written.
  rails:
    confidence: estimated
    note: >-
      A stand-in. This datasheet prints no depth range; its specification table
      gives a depth of 40'' (1016 mm), the longest setting of the FS-OR4P-45U,
      and lists the same components. The range, 558.8 mm to 1016 mm in 25.4 mm
      steps, is that frame's, read from the quick start guide (page 4) of the
      FS-OR4P-45U, and is stated here as a reading of "same components", not
      as a printed fact.
  load:
    confidence: datasheet
    note: >-
      "Weight Capacity - Stationary 2000lbs (907.18kg)" in the specification
      table (page 2). No rolling rating is stated although casters are
      supplied.
  numbering:
    confidence: estimated
    note: >-
      The direction is printed, "Rail Number Direction Bottom Up" (page 2). The
      label of the first unit is a stand-in: 1 is the default of the rack file,
      and no document for this listing says what the first label is.
gaps:
  - what: ru
    reason: vendor-silent
    note: >-
      The datasheet lists 42U/45U and the height is chosen at purchase. The
      specification table prints a width and a depth, 600 x 1016 mm, and no
      height.
    wanted: FS's sales page for the listing, or FS's statement of which heights are sold.
  - what: rails
    reason: vendor-silent
    note: >-
      This datasheet has no drawing and no depth table. The range is the
      FS-OR4P-45U's, read across because the components are listed the same.
    wanted: A depth table or a drawing for this listing.
  - what: numbering
    reason: vendor-silent
    note: >-
      The direction is printed as bottom up; the number on the lowest unit is
      not.
    wanted: A photograph of the rail, or a drawing that shows the labels.
  - what: outer
    reason: needs-drawing
    note: >-
      Only a width and a depth are printed, 600 x 1016 mm, and the depth is the
      longest rail setting. There is no height, and no drawing, so no outside
      box is written.
    wanted: A dimensioned drawing of the listing, with its heights.
  - what: hole-centres
    reason: needs-drawing
    note: This datasheet has no drawing, so no hole centres are written.
    wanted: A dimensioned front view.
  - what: opening
    reason: needs-drawing
    note: This datasheet has no drawing, so no opening is written.
    wanted: A dimensioned front view.
  - what: holes
    reason: vendor-silent
    note: >-
      No document gives the size of the square holes or says what the supplied
      M6 screws and nuts fit into.
    wanted: A dimensioned drawing of the rail holes.
