part-numbers:
  FS-DR-8U: FS-DR-8U Free-Standing Desktop Rack
description: >-
  The FS 8U free-standing desktop rack, a two-post open frame in black powder-coated
  steel. Its G-shape posts have square holes and lean back from a base bracket,
  81 degrees to the base in the data sheet's side view. Equipment mounts on the
  front rail only and the data sheet gives its depth as open. It is rated for a
  static load only. The lean-back angle and the base are described here and are not
  data yet: the rack product has no key for either.
