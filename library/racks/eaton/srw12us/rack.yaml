  SRW12US: SmartRack 12U Low-Profile Switch-Depth Wall-Mount Small Rack Enclosure, Hinged Back
description: >-
  The Eaton (Tripp Lite) SmartRack SRW12US, a 12U steel wall cabinet in black
  with a perforated front door. The front door is lockable, removable and
  reversible. Two lockable, removable side panels close the sides. Four vertical
  mounting rails adjust, the front and rear sets independently, in 6 mm steps,
  and each rail has square holes on one face and tapped holes on the other. A
  cable entry with a removable cover is in the top, and another is in the back
  door. Four fan ports take the optional SRFANWM fan kit. A hinged wall bracket
  with keyhole slots holds the cabinet to the wall, with the keyholes 16 in
  apart, and the cabinet swings away from the wall on its hinge for rear access.
  The optional SRCASTER kit puts four casters under it. The door, the side
  panels, the fan ports, the swing, the wall fixing and the casters are
  described here and are not data yet: the rack product has no key for an
  enclosure or a base.
