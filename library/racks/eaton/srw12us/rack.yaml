provenance:
  ru:
    confidence: datasheet
    note: >-
      Page 2 of the specification sheet prints Rack Height 12U, and page 1 of the
      submittal drawing prints Rack Spaces 12U.
  form:
    confidence: datasheet
    note: >-
      The sheet's Mounting Level row, page 2, says Swing frame, and its
      highlights say the cabinet swings away from the wall on a hinge. The
      drawing is titled Wall-Mount Rack Enclosure Cabinets. The cabinet has four
      vertical mounting rails (sheet, page 2), and a wall cabinet in this library
      states its front rail alone, so the product does too; the rear rails are in
      the `rear-rail` gap.
  numbering:
    confidence: estimated
    note: >-
      A stand-in. The manual, page 6, says the square holes are numbered, and its
      figure of one rack unit shows 24, 23 and 22 stepping down the rail without
      saying which cabinet it is. Bottom-up from 1, the default of the rack file,
      is written.
  width:
    confidence: drawing
    note: >-
      Page 1 of the drawing's icon row says Standard 19 in. Rack Width, and the
      sheet says 12U of 19 in. rack equipment.
  holes:
    confidence: datasheet
    note: >-
      The drawing's icon row says Square Hole Mounting, the sheet's package
      contents list (20) M6 cage nuts, and the manual, page 5, says the rails
      have both square and tapped holes. A hole style is one value in the rack
      product, so the square holes are written and the tapped face is in the
      `hole-style` gap.
  hole-centres:
    confidence: estimated
    note: >-
      A stand-in for the EIA-310 figure, 465.1 mm between hole lines (18.312 in).
      The sheet names EIA-310-E and the drawing names EIA-310-D, and neither
      prints a hole spacing.
  opening:
    confidence: estimated
    note: >-
      A stand-in for the EIA-310 clear opening between the rails, 450.85 mm
      (17.75 in). No page of the three documents prints a figure for it.
  rails:
    confidence: drawing
    note: >-
      The sheet, page 2, prints Number of Vertical Mounting Rails 4, the drawing's
      page 1 lists Adjustable Mounting Rails (4), and its cross section, page 2,
      draws four rail profiles. The front rail alone is written.
  max-device-depth:
    confidence: drawing
    note: >-
      Page 1 of the drawing prints Equipment Mounting Depth Up to 20.5 in. (520.7
      mm), and the sheet prints Maximum Device Depth 20.5 Inch. The cross section
      on page 2, headed Usable Mounting Depth, dimensions the inside of the box
      as 545.30 mm (21.47 in); the equipment depth is written.
  outer:
    confidence: drawing
    note: >-
      Page 1 of the drawing prints Unit Dimensions [H x W x D] 25.08 x 24.53 x
      21.57 in. (637 x 623.07 x 548 mm). Height 637, width 623.07, depth 548. The
      front view on page 2 also dimensions the width as 611.77 and 600 mm.
  weight-kg:
    confidence: drawing
    note: >-
      Page 1 of the drawing prints Unit Weight 60 lb. (27.21 kg), and page 1 of
      the sheet prints Product Weight 60 lb.
  load:
    confidence: drawing
    note: >-
      Page 1 of the drawing prints Load Rating 200 lb. (90.7 kg) and says it
      includes the combined weight of the unit and installed equipment. The sheet
      prints Load capacity (static) 200 lb on page 2. It is written as the static
      load; the equipment alone is that less the cabinet's 27.21 kg, which this
      product does not state. No page prints a rolling rating.
gaps:
  - what: numbering
    reason: vendor-silent
    note: The documents say the holes are numbered and not which way the numbers run.
    wanted: A photograph of the cabinet's rail showing the unit labels.
  - what: hole-centres
    reason: vendor-silent
    note: No page prints a spacing between the hole lines.
    wanted: A dimensioned front view of the vertical mounting rails.
  - what: opening
    reason: vendor-silent
    note: No page prints a clear opening between the rails.
    wanted: A dimensioned front view, or a measurement between the rails.
  - what: hole-style
    reason: needs-drawing
    note: >-
      Each rail has square holes on one face and tapped holes on the other, and
      the rails are turned to put the tapped face to the door (manual, page 7).
      The rack product holds one hole style. The package holds (20) 12-24 screws
      (sheet, page 2), and no page names the thread of the tapped face.
    wanted: A rack-product key for a rail that carries both styles, and the thread of the tapped face.
  - what: hole-size
    reason: vendor-silent
    note: No page prints a size for the square hole.
    wanted: A dimensioned drawing of the rail.
  - what: rear-rail
    reason: vendor-silent
    note: >-
      The cabinet has two front and two rear rails, and the front and rear sets
      slide independently in 6 mm (1/4 in) steps (manual, page 5). The sheet
      prints a Factory Preset Rack Depth of 10.42 in, a Minimum Device Depth of 3
      in and a Maximum Device Depth of 20.5 in, and the drawing's cross section
      prints 10.20 in without a name. No page says between which faces the
      10.42 in is measured, or the lowest and highest rail position. A wall
      cabinet states its front rail alone, so no rear rail or depth range is
      written.
    wanted: A dimensioned side view with the front and rear rail positions and the range each set slides through.
  - what: outer-size
    reason: sources-disagree
    note: >-
      The sheet prints Product Height 24.625 in, Product Width 23.5 in and
      Product Length/Depth 21.625 in (625.5, 596.9 and 549.3 mm). The drawing
      prints 25.08 x 24.53 x 21.57 in (637 x 623.07 x 548 mm) in its table and
      600 mm for the width of the front view. The height differs by 11.5 mm and
      the width by 26 mm. The drawing's side view prints [448] beside 21.57 in,
      and 21.57 in is 548 mm, so the 448 is read as a misprint. The drawing is
      dimensioned and is written.
    wanted: The maker's statement of which print is current, and what the 623.07 mm width includes.
  - what: cable-entry
    reason: sources-disagree
    note: >-
      The sheet prints a Cable Entry/Exit of 9.812 x 2.35 in (l x w) and the
      drawing's top view dimensions the opening as 270 mm (10.63 in) by 65 mm
      (2.56 in). The product has no key for a cable entry, so neither is written
      as data.
    wanted: The maker's statement of the size of the opening.
  - what: enclosure
    reason: needs-drawing
    note: >-
      The perforated front door, locked with the two keys and reversed by turning
      the cabinet through 180 degrees before it is mounted, the two side panels
      that unlock from inside, the cable entries with their covers and the four
      fan ports are in the description only: the rack product has no key for an
      enclosure.
    wanted: An enclosure key in the rack product.
  - what: swing
    reason: needs-drawing
    note: >-
      Page 3 of the drawing draws the cabinet from above twice. Front Opening
      shows an arc of 225 degrees with 1181 mm (46.53 in), 583.94 mm (22.99 in)
      and 1132.08 mm (44.57 in) marked. Rear Opening shows an arc of 90 degrees
      with 703.83 mm (27.71 in) and 606.55 mm (23.88 in) marked. The drawing does
      not name what each arc belongs to, and the hinge side is not stated: the
      cabinet is reversed by turning it through 180 degrees. The product has no
      key for a hinge or a swing.
    wanted: A hinge key in the rack product, the hinge side, and the maker's name for each arc.
  - what: wall-fixing
    reason: needs-drawing
    note: >-
      The rear view on page 2 of the drawing shows four groups of four keyhole
      slots, one group at each corner. It marks 406.40 mm (16.00 in) from a slot
      of a left group to the same slot of a right group, 28.58 mm (1.13 in)
      between neighbouring slots, 492.13 mm (19.38 in) across the outer slots
      and 542.60 mm (21.36 in) between the upper and lower groups. The manual,
      page 5, says each keyhole takes an M8, M10, 5/16 in or 3/8 in bolt and that
      the holes are 16 in apart for wall studs. The 200 mm (7.87 in) figures on
      the top view are fan port spacings. The rack product has no key for a wall
      fixing.
    wanted: A wall-fixing key in the rack product.
  - what: casters
    reason: needs-drawing
    note: >-
      The drawing's page 1 shows the optional SRCASTER kit, four casters, and says
      it lets the cabinet roll under desks, tables or counters. The kit's own
      documents are not held, so its caster height, the cabinet's height on
      casters and a rolling load are not stated, and the product has no key for
      a base.
    wanted: The SRCASTER specification sheet, and a base key in the rack product.
