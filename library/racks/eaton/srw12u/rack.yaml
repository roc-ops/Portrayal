  SRW12U: SmartRack 12U Low-Profile Switch-Depth Wall-Mount Small Rack Enclosure Cabinet
description: >-
  The Eaton (Tripp Lite) SmartRack SRW12U, a 12U steel wall-mount cabinet in
  black powder coat, 600 mm wide and 450 mm deep. It has a lockable, removable,
  reversible vented front door and two lockable, removable vented side panels.
  The two vertical rails adjust in 7/8 in steps and take square holes or 12-24
  threaded holes. It has a cable access port with a removable cover in the top
  and in the bottom, four ventilation fan ports for the optional SRFANWM fan kit,
  and a removable mounting plate that hooks the cabinet to the wall. It can
  instead roll on the optional SRCASTER caster kit. The door, the panels, the
  fan ports, the casters and the wall fixing are described here and are not data
  yet: the rack product has no key for an enclosure or a base.
