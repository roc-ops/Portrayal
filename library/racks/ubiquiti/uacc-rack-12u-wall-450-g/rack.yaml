part-numbers:
  UACC-Rack-12U-Wall-450-G: 12U Rack Cabinet, tempered glass door
description: >-
  The Ubiquiti 12U wall-mount rack cabinet with a tempered glass front door,
  450 mm deep, in white powder-coated SPCC steel. The door swings out to the
  left and is reversible. It has two solid, removable, lockable side panels, a
  door lock, four side panel locks and two keys, two pre-installed 120 x 120 x
  38 mm AC fans, and grounding lugs. The cable openings are 350 x 100 mm in the
  rear wall and 336.5 x 52.5 mm in the top and in the bottom. The mounting
  depth of the square-holed posts is 283 mm as shipped and adjusts to 305 mm in
  a 22 mm pitch. The door, the panels, the fans and the cable openings are
  described here and are not data yet: the rack product has no key for an
  enclosure.
