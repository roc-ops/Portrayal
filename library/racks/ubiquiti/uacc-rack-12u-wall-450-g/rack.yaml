    wanted: A dimensioned front view of the posts.
  - what: opening
    reason: vendor-silent
    note: The page prints no clear opening between the posts.
    wanted: A dimensioned front view, or a measurement between the posts.
  - what: hole-size
    reason: vendor-silent
    note: The page says the holes are square and prints no size or fixing.
    wanted: A dimensioned drawing of the post, or the installation guide.
  - what: rail-depth
    reason: vendor-silent
    note: >-
      The posts are 283 mm from the front as shipped and adjust to 305 mm in a
      22 mm pitch, the page's "Adjustable Mounting Depth". A wall cabinet in the
      rack product states the front rail alone, so no rear rail range is
      written, and the page does not say what the lowest position is.
    wanted: The lowest position of the posts, and a rear rail depth range for a wall cabinet in the rack product.
  - what: outer-axes
    reason: needs-drawing
    note: >-
      The page prints the three sizes of the rack without naming the axes; the
      reading is in the `outer` provenance.
    wanted: A dimensioned drawing with the three sizes marked, or the installation guide.
  - what: load-basis
    reason: vendor-silent
    note: The page does not say whether the 50 kg is the equipment alone or with the cabinet.
    wanted: The maker's statement of what the weight capacity covers.
  - what: enclosure
    reason: needs-drawing
    note: >-
      The tempered glass door (left-hand outswing, reversible), the two solid
      side panels with their locks, the two pre-installed fans and the three
      cable openings are in the description only: the rack product has no key
      for an enclosure.
    wanted: An enclosure key in the rack product.
