provenance:
  ru:
    confidence: datasheet
    note: The techspecs page prints "U Height 12U".
  form:
    confidence: datasheet
    note: >-
      The page prints "Rack Type 4 post, enclosed cabinet" and "Mounting Wall
      mount". A wall cabinet states the front rail alone; the posts' depth is
      the `rail-depth` gap.
  numbering:
    confidence: estimated
    note: >-
      A stand-in. The page says nothing about unit numbering; bottom-up from 1
      is the default of the rack file.
  width:
    confidence: estimated
    note: >-
      A stand-in. The page prints the standard EIA/ECA-310-E and no rail width,
      so the 19 in of that standard is written.
  holes:
    confidence: datasheet
    note: The page prints "Mounting Hole Type Square". It prints no hole size and no fixing.
  hole-centres:
    confidence: estimated
    note: >-
      A stand-in for the EIA-310 figure, 465.1 mm between hole lines (18.312
      in). The page prints no hole spacing.
  opening:
    confidence: estimated
    note: >-
      A stand-in for the EIA-310 minimum clear opening between the rails, 450.85
      mm (17.75 in). The page prints no figure for it.
  rails:
    confidence: datasheet
    note: The posts' front rail is the only one stated; see the `rail-depth` gap.
  max-device-depth:
    confidence: datasheet
    note: >-
      The page prints "Compatible with Ubiquiti rack-mount devices up to 325 mm
      in depth", and a note that a 325 mm device fits at the 305 mm maximum
      mounting depth and then leaves no room for DC power backup. The 325 mm is
      the depth of a device, written as the usable depth; the posts' own
      mounting depth is 283 mm default, 305 mm maximum.
  outer:
    confidence: datasheet
    note: >-
      The page prints "Rack: 550 x 450 x 635 mm (21.7 x 17.7 x 25")" and labels
      no axes. 635 mm is 25 in, the height of 12U, and 450 mm is the shallow
      depth the product is named for, so the order is read as width, depth and
      height and written w 550, h 635, d 450.
  weight-kg:
    confidence: datasheet
    note: 'The page prints "Weight Rack: 19 kg (41.9 lb)". The packed weight is 23.2 kg.'
  load:
    confidence: datasheet
    note: >-
      The page prints "Max. Weight Capacity 50 kg (110 lb)" and does not say
      whether it includes the cabinet. A wall cabinet carries no rolling load,
      and the figure is written as the static load.
gaps:
  - what: numbering
