comments: 'Juniper EX-UM-4X4SFP, the four-port 1/10 Gbps SFP+ uplink module of the EX4300 24-port and
  48-port switches, except the EX4300-48MP. It slides into the uplink module slot on the front panel.
  It has four SFP+ cages in one row, numbered 0 to 3. Each cage takes an SFP+ transceiver at 10 Gbps or
  an SFP transceiver at 1 Gbps. Each cage has a link activity lamp and a status lamp below it. Two captive
  screws hold it and a handle at each end pulls it out. It ships with dust covers in the ports.


  Facts carried in the model that this schema has no field for:

  - ports-note: four SFP+ ports, each at 10 Gbps with SFP+ or 1 Gbps with SFP, and usable as Virtual Chassis
  ports

