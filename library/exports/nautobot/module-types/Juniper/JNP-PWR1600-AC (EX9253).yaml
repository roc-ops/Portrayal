comments: 'Juniper JNP-PWR1600-AC, the universal AC power supply of the EX9253. It delivers 800 W from
  a low line (90 to 140 VAC) and 1600 W from a high line (180 to 264 VAC) and has a C14 appliance inlet
  at the left, a fan behind a diagonal ejector handle at the right, a status lamp and an ejector tab.
  The EX9253 seats up to six, in slots PSM0 to PSM5; the base order ships three and the redundant order
  four. Each has its own fan and a dedicated AC feed. They are hot-removable and hot-insertable. Never
  mix them with DC supplies. The guide shows no back-to-front supply.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: 90 to 140 VAC (800 W) or 180 to 264 VAC (1600 W), 50 to 60 Hz; 10 A at 100 to 240 VAC (guide
  Table 10)

  - power-output-low-line-w: 800

  - power-output-w: 1600

  - role: ac-power-supply

  Contract version 1.0.0 (juniper/ex9253-jnp-pwr1600-ac).'
