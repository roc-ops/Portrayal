comments: 'The PSU blank of the Juniper EX4100-H-24MP and EX4100-H-24F: a plain sheet-metal panel that
  covers the empty second power supply slot, with a captive screw on a tab at each end - one low at the
  left, one high at the right - and a round dimple in the middle. The switch ships with one supply, and
  this panel covers the other slot. The guide names it only as a PSU blank, with no part number, and shows
  it in the rear panel figures of both models.


  Facts carried in the model that this schema has no field for:

  - covers: power supply slot

  Contract version 1.0.0 (juniper/ex4100-h-psu-blank).'
