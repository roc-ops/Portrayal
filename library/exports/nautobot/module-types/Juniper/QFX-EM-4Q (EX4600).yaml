comments: 'Juniper QFX-EM-4Q, the expansion module that adds four QSFP+ ports to an EX4600 switch. The
  EX4600 hardware guide lists it with the EX4600-EM-8F for the two module bays at the right of the port
  panel. The module has four QSFP+ cages in two columns and two rows, numbered 0 to 3 with 0 and 1 in
  the left column. Each port runs at 40 GbE or, with a breakout cable, as four 10 GbE ports. Each port
  has four lamps, and one ST lamp shows the module. It is hot-insertable and hot-removable. The same module
  is used in the QFX5100 switches. The guide says the EX4600 is configured for this module by default.


  Facts carried in the model that this schema has no field for:

  - ports-note: four QSFP+ ports at 40 Gbps, each channelizable as 4 x 10 Gbps

  - qsfp-plus: 4

  - weight-note: not published

  Contract version 1.0.0 (juniper/ex4600-em-4q).'
