comments: 'Juniper MX304 LMIC16 (MX304-LMIC16-BASE), a hot-swappable half-width line card MIC - 1.6 Tbps
  of forwarding on a single YT ASIC (two 800 Gbps PFE slices). Sixteen multi-rate cages in four 2x2 blocks:
  up to 16x100GbE, or 400GbE on the four cages silkscreened 400G (ports 0, 6, 8 and 14), or a mix; MACsec
  inline on all ports and IEEE 1588 Class-C PTP. Up to three per chassis - LMIC 0, LMIC 1, and the RE
  1/LMIC2 slot. Port numbering is column-major: the upper cage of each column is the even port, the lower
  the odd, silkscreened with up/down arrows, one lamp per port between them.


  Facts carried in the model that this schema has no field for:

  - cli-naming: Junos 24.4R1+: MIC 0/PIC 0 and MIC 1/PIC 1 (MRATE LC-MIC 16x100G/4x400G); earlier: PIC
  0/PIC 1

  - envelope: 203.5 x 40.1 x 332 mm (Table 22)

  - forwarding-capacity: 1.6 Tbps (single YT ASIC, 2x800 Gbps PFEs)

  - power-draw-max-w: 410

  - power-draw-typical-w: 386

  Contract version 1.1.0 (juniper/mx304-lmic16).'
