comments: 'Juniper EX4550-VC-128G, the 128 Gbps Virtual Chassis module of the EX4550 switches (the face
  prints EX4550-VC1-128G). It slides into the module slot on the front panel or the one on the rear panel.
  It has two dedicated Virtual Chassis ports, VCP-1 above VCP-0, that join the switch to an EX4200, EX4500
  or EX4550 switch with a Virtual Chassis cable. One ST lamp shows its state and two captive screws hold
  it. It is hot-insertable and hot-removable.


