comments: 'Juniper EX8200-PWR-AC3K, the 3000 W AC power supply of the EX8200 chassis. It delivers 3000
  W from a high-voltage line only (200 to 240 VAC), at 52 VDC; the low-voltage line is not supported.
  The face is the 2000 W supply''s: a C19 appliance inlet, an ENABLE switch, the INPUT OK, OUTPUT OK and
  FAIL lamps, a vent field, a handle and a captive screw. Up to six fit an EX8208 or EX8216, in slots
  PSU 0 to PSU 5. Each has its own fan and a dedicated AC feed, and is hot-insertable and hot-removable.
  Never mix them with DC supplies.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: 200 to 240 VAC (16 A), 50 to 60 Hz; output 52 VDC; low-voltage line not supported

  - power-output-w: 3000

  - role: ac-power-supply

