comments: 'QFX520048Y-APSU-AI, the 650 W AC power supply of the QFX5200-48Y, with back-to-front (FRU-to-port)
  airflow. It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares with its
  twin. The QFX5200 hardware guide says the QFX5200-48Y takes it, two to a switch, in the slots at the
  two ends of the FRU panel. The face is that of the front-to-back supply with a blue latch (the guide''s
  blue panel for airflow in): one bi-coloured lamp, a silver frame with square vents, a black bail handle
  and a C14 appliance inlet turned on its side. The front-to-back sibling is QFX520048Y-APSU-AO. AC and
  DC supplies of the same airflow may be mixed in the 48Y, but supplies of different airflow direction
  never are.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - input: 100 to 240 VAC, 50 to 60 Hz, 7.8 A at 100 to 120 VAC or 3.8 A at 200 to 240 VAC (QFX5200-48Y,
  guide Table 20)

  - power-output-w: 650

  - role: ac-power-supply

  Contract version 1.0.0 (juniper/qfx5200-48y-apsu-ai).'
