comments: 'QFX520048Y-DPSU-AI, the 650 W DC power supply of the QFX5200-48Y, with back-to-front (FRU-to-port)
  airflow. It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares with its
  twin. The QFX5200 hardware guide says the QFX5200-48Y takes it, two to a switch, in the slots at the
  two ends of the FRU panel, and that AC and DC supplies of the same airflow may be mixed in the 48Y.
  The face is that of the front-to-back DC supply with a blue latch: one bi-coloured lamp, a silver frame
  with square vents, a black bail handle and a three-pin DC power connector (pin 3 return, pin 2 -36 to
  -72 V, pin 1 grounding). The front-to-back sibling is QFX520048Y-DPSU-AO.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - inlet: dc-terminal

  - input: rated -48 to -60 VDC at 21 A; -36 to -72 VDC at 25 A to 11 A (QFX5200-48Y, guide Table 25)

  - power-output-w: 650

  - role: dc-power-supply

  Contract version 1.1.0 (juniper/qfx5200-48y-dpsu-ai).'
