comments: 'JPSU-1100W-DC-AFI, a 1100 W DC power supply with dual feeds and FRU-to-port (back-to-front)
  airflow (AIR IN). It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares
  with its twin. The QFX5210 hardware guide says the QFX5210-64C with DC supplies takes two, in slots
  0 and 1 at the two ends of the FRU panel. The face is that of the front-to-back DC supply with an azure
  blue handle. It has a three-terminal block (the V+ terminals are shunted internally, as are the V-),
  one round bi-colour lamp and a black ejector lever. The front-to-back sibling is JPSU-1100W-DC-AFO.
  AC and DC supplies, and supplies of different airflow direction, are never mixed in one chassis.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - inlet: dc-terminal

  - input: rated -48 to -60 VDC, operating range -40 to -72 VDC, 25 A maximum (guide Table 21)

  - power-output-w: 1100

  - role: dc-power-supply

  Contract version 1.1.0 (juniper/qfx5210-jpsu-1100w-dc-afi).'
