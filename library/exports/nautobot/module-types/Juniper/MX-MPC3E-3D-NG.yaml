comments: 'Juniper MPC3E NG carrier (MX-MPC3E-3D-NG) - two MIC slots taking MIC3 and the classic MICs
  of its own column (Table 12), 130 Gbps without hierarchical queuing. It is not the MPC3E (MX-MPC3E-3D):
  it draws more power and its MIC column differs. The queuing SKU MPC3E-3D-NG-Q has the same faceplate
  and its own wattage and is not this contract. Needs high-capacity power supplies, fan trays and filter
  trays, and an SCBE, SCBE2 or SCBE3. One card for the MX240, MX480 and MX960, drawn horizontal; the MX960
  seats it turned 90.


  Facts carried in the model that this schema has no field for:

  - model-variants: MPC3E-3D-NG

  - power-draw-max-w: 534

  Contract version 1.1.0 (juniper/mpc3e-3d-ng).


  Not given to Nautobot: module bay(s) mic0, mic1. Each accepts a module that also seats directly in a
  chassis bay, so that module''s port names cannot carry this bay''s parent, and Nautobot copies a bay''s
  position as written (position templating is nautobot/nautobot#5823).'
