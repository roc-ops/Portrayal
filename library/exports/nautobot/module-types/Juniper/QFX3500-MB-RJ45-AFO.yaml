comments: 'QFX3500-MB-RJ45-AFO, the RJ-45 management board with port-to-FRU airflow. It is the field-replaceable
  unit in the middle of the FRU side of a QFX3500, between the two fan trays. Its faceplate carries the
  LCD that shows the host name and the number of active alarms, the Power, Status and Fan lamps, a USB
  port, the RJ-45 console port and two 1000BASE-T RJ-45 management ports, C0 and C1. Two fan modules inside
  the board cool the chassis. Unlike the power supplies and the fan trays, the board is not hot-swappable:
  the switch must be powered off to replace it. The guide gives it to the QFX3500-48S4Q-AFO. Its FRU-to-port
  sibling is QFX3500-MB. A board only fits a chassis of its own airflow.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - power-absent: not-published

  Contract version 1.0.0 (juniper/qfx3500-mb-rj45-afo).'
