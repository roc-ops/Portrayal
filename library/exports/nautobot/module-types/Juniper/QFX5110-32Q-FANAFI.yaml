comments: 'QFX5110-32Q-FANAFI, the field-replaceable fan module of the QFX5110-32Q with back-to-front
  airflow. Air comes in at the fan end and leaves at the port side. It is marked AIR IN on a Juniper Azure
  Blue handle. The switch seats five, in slots 0 to 4 left to right. The front-to-back sibling is QFX5110-32Q-FANAFO.
  The QFX5110 hardware guide says to use only the fan module designed for the product number, so the QFX5110-48S
  has its own part. The two airflows are never mixed in one chassis, and never with power supplies of
  the other direction.


