comments: 'Juniper EX4100-H-24MP-DC-PSU, the 340 W DC field-replaceable power supply of the EX4100-H-24MP.
  The switch ships with one in a rear slot and takes a second, which the guide lists as N+1 redundant
  and hot swappable. The face is the AC supply''s - a finned fanless body with a green release handle,
  a retaining thumbscrew on a tab and the OUT_OK lamp over a hot-surface mark - with a DC INPUT label.
  The wires do not land here: the DC+, DC- and G terminals are on the front of the switch, under the terminal
  door, in the section for the slot the supply is in. The supply has no fan and cools by convection, so
  it has no airflow direction. The switch with a DC supply is a centimetre deeper than with an AC one.


  Facts carried in the model that this schema has no field for:

  - cooling: fanless, convection cooled

  - inlet: none

  - input: 20.4 through 72 VDC at the terminal block, nominal +24, -48 or -60 VDC

  - input-current: 5.5 A at +24 V, 5.75 A at -48 V and 2.2 A at -60 V, as printed on the label

  - power-output-w: 340

  - role: dc-power-supply

  - weight-kg: 1.45

  Contract version 1.1.0 (juniper/ex4100-h-24mp-dc-psu).'
