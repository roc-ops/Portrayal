comments: 'Juniper MPC2E NG carrier (MX-MPC2E-3D-NG) - two MIC slots, 80 Gbps without hierarchical queuing.
  It is not the MPC2E (MX-MPC2E-3D): it draws more power and its MIC column differs. The queuing SKU MPC2E-3D-NG-Q
  has the same faceplate and its own wattage and is not this contract. Needs high-capacity fan trays and
  filter trays, and an SCBE-MX or SCBE2-MX, not the legacy SCB. One card for the MX240, MX480 and MX960,
  drawn horizontal; the MX960 seats it turned 90.


  Facts carried in the model that this schema has no field for:

  - model-variants: MPC2E-3D-NG

  - power-draw-max-w: 474

  Contract version 1.1.0 (juniper/mpc2e-3d-ng).


  Not given to Nautobot: module bay(s) mic0, mic1. Each accepts a module that also seats directly in a
  chassis bay, so that module''s port names cannot carry this bay''s parent, and Nautobot copies a bay''s
  position as written (position templating is nautobot/nautobot#5823).'
