comments: 'The Virtual Chassis module of the Juniper EX4500 switches, printed EX4500-40F-VC1-128G. It
  sits in the same rear strip as the intraconnect module and replaces it. It has two dedicated Virtual
  Chassis ports, VCP-0 and VCP-1, that join the switch to an EX4200 or EX4500 switch. It is an offline
  field-replaceable unit. Two lamps, ST and VC MODE, show its state. Three of the eight models ship with
  it. The guide gives no Juniper part number for it.


