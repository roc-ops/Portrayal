comments: 'JPSU-850W-AC-AFI, an 850 W AC power supply with back-to-front airflow (AIR IN). It is a field-replaceable
  unit, hot-removable and hot-insertable, and load-shares with its twin. The QFX5120 hardware guide says
  the QFX5120-48YM takes it. It seats two, in slots 0 and 1 at the right of the rear. The face is that
  of its front-to-back sibling JPSU-850W-AC-AFO with a Juniper Azure Blue handle. AC and DC supplies,
  and supplies of different airflow direction, are never mixed in one chassis.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - input: 100 to 240 VAC, 50 to 60 Hz, 7.5 A at 100 VAC or 3 A at 240 VAC (QFX5120-48YM, guide Table
  30)

  - power-output-w: 850

  - role: ac-power-supply

