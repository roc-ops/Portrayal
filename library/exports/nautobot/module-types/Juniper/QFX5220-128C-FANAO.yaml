  airflow (AIR OUT, port-to-FRU). Cold air comes in at the port side and hot air leaves at the back. It
  is 2U high, holds two fans, and is marked AIR OUT on a Juniper gold handle. It is hot-removable and
  hot-insertable. The QFX5220-128C takes six, numbered 0 to 5 from the top left, three on each of two
  rows. It runs on eleven of its twelve fans, (5x2+1)+1. The 128C is not sold with back-to-front airflow,
  so no AIR IN sibling exists. The status lamp is on the chassis strip beside each module, not on the
  module.


