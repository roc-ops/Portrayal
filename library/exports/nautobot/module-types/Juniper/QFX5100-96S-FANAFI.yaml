comments: 'QFX5100-96S-FANAFI, the 2RU fan module with FRU-to-port airflow, which the guide also calls
  back-to-front. Cold air comes in at the fan end of the switch and hot air leaves at the port end. It
  is marked AIR IN and has a Juniper Azure Blue handle. It is hot-removable and hot-insertable. The QFX5100
  hardware guide says only the QFX5100-96S takes it, in three slots numbered 0 to 2 from left to right.
  The front-to-back sibling is QFX5100-96S-FANAFO. The two are never mixed in one chassis, and never with
  power supplies of the other direction. The 1RU models use QFX5100-FAN-AFI, a smaller part.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - power-absent: not-published

  Contract version 1.0.0 (juniper/qfx5100-96s-fanafi).'
