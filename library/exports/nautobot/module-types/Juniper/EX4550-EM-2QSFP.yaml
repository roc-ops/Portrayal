comments: 'Juniper EX4550-EM-2QSFP, the two-port 40 Gbps QSFP+ expansion module of the EX4550 switches.
  It slides into the module slot on the front panel or the one on the rear panel. It has two QSFP+ cages
  side by side, numbered 0 and 1, each taking a 40 Gbps QSFP+ transceiver. A Link lamp and a Status lamp
  for each port sit above the cages, and the module has one ST lamp. Two captive screws hold it. It ships
  with dust covers in the ports and is hot-insertable and hot-removable.


  Facts carried in the model that this schema has no field for:

  - ports-note: two QSFP+ ports at 40 Gbps, usable as Virtual Chassis ports from Junos OS 13.2X50-D15

  - power-absent: not-published

  - qsfp: 2

  - weight: 0.61 lb (0.28 kg)

