comments: 'Juniper JPSU-650W-DC-AFI, a 650 W DC power supply with FRU-to-port airflow (AFI), which the
  datasheet calls back-to-front. It is a field-replaceable unit, hot-removable and hot-insertable while
  the second supply runs. The EX4600 hardware guide lists it for the EX4600-40F-DC-AFI. The EX4600 seats
  two, in slots 0 and 1 at the right of the rear. The same supply is used in the QFX5100 switches. The
  face has a terminal block with four screw terminals, V-, V-, V+ and V+, on two feeds. It also has the
  lamps IN, OUT and !, an ESD grounding point, a blue handle and an ejector lever. Never mix it with AFO
  supplies, AC supplies or AIR OUT fan modules.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - input: rated -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum (guide Table 19)

  - power-output-w: 650

  - role: dc-power-supply

  Contract version 1.1.0 (juniper/ex4600-jpsu-650-dc-afi).'
