comments: 'QFX3500-FANAI, a field-replaceable fan tray with FRU-to-port airflow. Cold air comes in at
  the FRU end of the switch and hot air leaves at the port end. The tray holds two fan modules and has
  a single lamp, green when the tray is healthy and blinking amber on an error. It is hot-removable and
  hot-insertable, and one fan module cannot be replaced alone. The QFX3500 hardware guide gives it to
  the QFX3500-48S4Q-AFI and the QFX3500-48S4Q-ACR. The chassis seats two, in slots 0 and 1 on either side
  of the management board. The front-to-back and back-to-front trays are never mixed in one chassis. The
  front-to-back sibling is QFX3500-FAN-AFO. The guide prints this part number as QFX3500-FANAI, without
  the hyphen its sibling has.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - power-absent: not-published

  Contract version 1.0.0 (juniper/qfx3500-fanai).'
