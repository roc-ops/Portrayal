comments: 'QFX520048Y-DPSU-AO, the 650 W DC power supply of the QFX5200-48Y, with front-to-back (port-to-FRU)
  airflow. It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares with its
  twin. The QFX5200 hardware guide says the QFX5200-48Y takes it, two to a switch, in the slots at the
  two ends of the FRU panel, and that AC and DC supplies of the same airflow may be mixed in the 48Y.
  The face is that of the AC supply (one bi-coloured lamp, a silver frame with square vents, a black bail
  handle and a red latch) with a three-pin DC power connector in place of the inlet: pin 3 for the return
  (red), pin 2 for -36 to -72 V (black) and pin 1 for grounding (green). The back-to-front sibling is
  QFX520048Y-DPSU-AI.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - inlet: dc-terminal

  - input: rated -48 to -60 VDC at 21 A; -36 to -72 VDC at 25 A to 11 A (QFX5200-48Y, guide Table 25)

  - power-output-w: 650

  - role: dc-power-supply

  Contract version 1.1.0 (juniper/qfx5200-48y-dpsu-ao).'
