comments: 'Juniper EX6200-PWR-AC5000, the 5000 W AC power supply of the EX6200 line. It has two IEC C20
  appliance inlets, Input 1 and Input 2, each on its own AC feed. It delivers 5000 W from a high line
  (200 to 240 VAC) with both feeds, and half that with one feed; at a low line (100 to 120 VAC) it delivers
  2500 W with both. The faceplate has an Enable switch, the INPUT 1 OK, INPUT 2 OK, OUTPUT OK and FAIL
  lamps, a vent field with a handle and two captive screws. The supply is about 3 U high and replaces
  the power supply blank shelf. The airflow runs from front to back.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: 100 to 120 VAC (2500 W with both feeds) or 200 to 240 VAC (5000 W with both feeds, 2500 W with
  one), 50 to 60 Hz, 15 A per cord (guide Tables 20 and 25)

  - power-output-low-line-w: 2500

  - power-output-w: 5000

  - role: ac-power-supply

  Contract version 1.0.0 (juniper/ex6200-pwr-ac5000).'
