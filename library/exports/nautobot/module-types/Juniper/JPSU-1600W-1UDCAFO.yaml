comments: 'JPSU-1600W-1UDCAFO, a 1600 W DC power supply with front-to-back airflow (AIR OUT, port-to-FRU).
  It is a field-replaceable unit, hot-removable and hot-insertable, installed at the factory. The QFX5130
  hardware guide says the QFX5130-32CD, QFX5130-48C and QFX5130-48CM take it; the switch ships with two.
  It has a single feed, so source redundancy comes from two supplies on feeds A and B. The face carries
  two screw terminals, V+ at the left and V- beside it, under a clear terminal-block cover that is not
  drawn; a Juniper gold handle in the form of a rounded slot; three lamps (IN, OUT and !); an unused blanked
  position at the upper left; and a release latch. The AIR IN sibling is JPSU-1600W-1UDCAFI. AC and DC
  supplies, and supplies of different airflow direction, are never mixed in one chassis. The datasheet
  lists the part as the "QFX5220-32CD 1600W 1U DC PSU AFO".


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: rated -48 to -60 VDC, operating -40 to -72 VDC; 35 A maximum (QFX5130-32CD) or 40 A (QFX5130-48C
  and -48CM), guide Tables 26, 27

  - power-output-w: 1600

  - role: dc-power-supply

  Contract version 1.1.0 (juniper/qfx5130-jpsu-1600-dc-afo).'
