comments: 'Juniper EX-UM-2X4SFP, the SFP+ uplink module of the EX3200 and EX4200 switches. It slides into
  the front-panel uplink module slot behind the flip-up door. It has four SFP cages in one row, numbered
  0 to 3. In the default 10-gigabit mode only ports 0 and 2 are enabled, and they take SFP+ transceivers.
  In the 1-gigabit mode all four ports take SFP transceivers. Each cage has a link activity lamp and a
  status lamp. An operating mode lamp at the right is lit in the 10-gigabit mode.


  Facts carried in the model that this schema has no field for:

  - ports-note: default mode, SFP+ ports 0 and 2 at 10 Gbps; 1-gigabit mode, four SFP ports at 1 Gbps

  - sfp: 4

  - sfp-plus: 2

  Contract version 1.0.0 (juniper/ex-um-2x4sfp).'
