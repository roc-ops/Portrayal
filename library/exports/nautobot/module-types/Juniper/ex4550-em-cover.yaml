description: The module slot cover panel of the Juniper EX4550 switches
comments: 'The module slot cover panel of the Juniper EX4550 switches. The EX4550 has two module slots,
  one on the front panel and one on the rear panel, and ships each with a cover panel. The panel is a
  plain plate with a captive screw at each end. A slot takes an 8-port SFP+ module (EX4550-EM-8XSFP),
  an 8-port 10GBASE-T module (EX4550-EM-8XT), a 2-port QSFP+ module (EX4550-EM-2QSFP) or a Virtual Chassis
  module (EX4550-VC-128G). The guide gives no part number for the panel.


