description: The intraconnect module of the Juniper EX4500 switches, printed EX4500-LB
comments: 'The intraconnect module of the Juniper EX4500 switches, printed EX4500-LB. It sits horizontally
  in the strip above the fan tray at the rear. It helps the switch reach line rate on all its ports. It
  is an offline field-replaceable unit: the switch must be powered off to replace it. The switch cannot
  run without it or a Virtual Chassis module. It has a status lamp labelled ST and two captive screws.
  Five of the eight models ship with it. The guide gives no Juniper part number for it.


  Facts carried in the model that this schema has no field for:

  - power-absent: not-published

  - role: intraconnect

  Contract version 1.0.0 (juniper/ex4500-lb).'
