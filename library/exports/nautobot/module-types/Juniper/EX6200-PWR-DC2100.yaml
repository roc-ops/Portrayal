comments: 'Juniper EX6200-PWR-DC2100, the 2100 W DC power supply of the EX6200 line. It has a positive
  and a negative input terminal for the DC input lugs, an Enable switch (Standby or On), the INPUT OK,
  OUTPUT OK and FAIL lamps, a vent field with a handle and two captive screws. The nominal input is -48
  to -60 VDC. The airflow runs from front to back. The EX6210 seats up to four, in slots PSU 0 to PSU
  3; the DC order includes one. They are hot-removable and hot-insertable.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: nominal -48 to -60 VDC, operating -40 to -72 VDC; 50 A at -48 VDC and 60 A at -40 VDC for each
  input terminal (guide Table 30)

  - power-output-w: 2100

  - role: dc-power-supply

  Contract version 1.1.0 (juniper/ex6200-pwr-dc2100).'
