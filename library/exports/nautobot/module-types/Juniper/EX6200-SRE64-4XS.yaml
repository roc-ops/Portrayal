comments: 'Juniper EX6200-SRE64-4XS, the Switch Fabric and Routing Engine (SRE) module of the EX6210.
  It holds the Routing Engine, the switch fabric and the chassis control and management circuits. The
  faceplate has four SFP+ uplink ports (0 to 3), a Gigabit Ethernet SFP management port, a 10/100/1000BASE-T
  management port, an RJ-45 console port, a USB port, a recessed reset button, a two-line LCD panel with
  its Menu and Enter buttons and the ALM, SYS and MST lamps, with an ejector lever and a captive screw
  at each end. It seats in chassis slot 4 or 5 (a line card may take either slot instead). One module
  is the minimum; with two, one is the primary and the other the backup, and the uplink ports of the backup
  stay active.


