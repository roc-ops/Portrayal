comments: 'Juniper EX-UM-4SFPP-MR, the four-port 1/10 Gbps SFP+ uplink module of the EX4300-48MP switches.
  It slides into the uplink module slot below the status block at the right end of the front panel. It
  has four SFP+ cages in one row, numbered 0 to 3. Each cage takes an SFP+ transceiver at 10 Gbps or an
  SFP transceiver at 1 Gbps. Each port has a link activity lamp and a status lamp above its cage. Two
  captive screws hold it and a handle along the bottom pulls it out. It ships with dust covers in the
  ports.


  Facts carried in the model that this schema has no field for:

  - ports-note: four SFP+ ports, each at 10 Gbps with SFP+ or 1 Gbps with SFP; the ports cannot be Virtual
  Chassis ports

  - power-absent: not-published

  - sfp-plus: 4

  - weight: 0.57 lb (0.26 kg)

  Contract version 1.0.0 (juniper/ex-um-4sfpp-mr).'
