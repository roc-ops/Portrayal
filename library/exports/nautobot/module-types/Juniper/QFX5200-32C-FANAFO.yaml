comments: 'QFX5200-32C-FANAFO, a field-replaceable fan module with front-to-back (port-to-FRU) airflow:
  air comes in at the port side and leaves at the fan end. It is marked AIR OUT, has a Juniper Gold handle,
  and is hot-removable and hot-insertable. The QFX5200 hardware guide says the QFX5200-32C and the QFX5200-32C-L
  take it, five to a switch (fan modules 0 to 4, left to right), and that the same module serves the -AFO
  and -LAFO builds. The back-to-front sibling is QFX5200-32C-FANAFI. The two are never mixed in one chassis,
  and never with power supplies of the other direction. The status lamp is on the chassis strip beside
  each slot, not on the module.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - power-absent: not-published

  Contract version 1.0.0 (juniper/qfx5200-32c-fan-afo).'
