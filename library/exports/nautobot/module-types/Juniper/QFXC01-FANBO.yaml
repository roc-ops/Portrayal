comments: 'QFXC01-FANBO, a field-replaceable fan tray with port-side-to-FRU-side airflow. Cold air comes
  in at the port end of the switch and hot air leaves at the FRU end. The tray holds two fan modules and
  has a single lamp, green when the tray is healthy and blinking amber on an error. It is hot-removable
  and hot-insertable, and one fan module cannot be replaced alone. The QFX3600 hardware guide gives it
  to the QFX3600-16Q-AFO and the QFX3600-I-16Q-AFO. The chassis seats three, in slots 0 to 2 from left
  to right between the two power supplies. The front-to-back and back-to-front trays are never mixed in
  one chassis, and never with power supplies of the other direction. The back-to-front sibling is QFXC01-FANBI.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - power-absent: not-published

  Contract version 1.0.0 (juniper/qfx3600-qfxc01-fanbo).'
