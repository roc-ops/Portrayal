comments: 'Juniper JPSU-H-90W-AC, the 90 W AC field-replaceable power supply of the EX4100-H-24F. The
  switch ships with one in a rear slot and takes a second, which the guide lists as N+1 redundant and
  hot swappable. The face is a finned fanless body with a green release handle, a retaining thumbscrew
  on a tab at one end and, at the other, the OUT_OK lamp with its legend above and a hot-surface mark
  below. The AC cord does not land here: the input terminals are on the front of the switch, under the
  terminal door, in the section for the slot the supply is in. The supply has no fan and cools by convection,
  so it has no airflow direction.


  Facts carried in the model that this schema has no field for:

  - cooling: fanless, convection cooled

  - inlet: none

  - input: 100 through 240 VAC, 50 or 60 Hz

  - input-current: 1.5 to 0.6 A, as printed on the label

  - power-output-w: 90

  - role: ac-power-supply

