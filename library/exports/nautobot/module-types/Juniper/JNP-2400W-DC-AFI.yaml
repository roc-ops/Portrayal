comments: 'JNP-2400W-DC-AFI (product number 740-155850), a 2400 W DC power supply with back-to-front airflow
  (AIR IN, FRU-to-port). It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares
  with its twin; the QFX5230-64CD-D-AFI ships with two. The face carries a round fan guard with a green
  handle across it, a terminal block under a cover, an input current selector (a DIP switch, set to 60
  A for this unit), an ejector lever and one lamp. The front-to-back sibling is JNP-3000W-DC-AFO, a 3000
  W unit with a Juniper gold handle. AC and DC supplies, and supplies of different airflow direction,
  are never mixed in one chassis.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - input: -40 to -72 VDC, rated -48 to -60 VDC, 60 A maximum (guide Tables 18 and 21); output 12 V at
  200 A and 12 V standby at 1 A

