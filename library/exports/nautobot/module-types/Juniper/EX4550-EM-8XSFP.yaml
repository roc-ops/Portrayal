comments: 'Juniper EX4550-EM-8XSFP, the eight-port SFP+ expansion module of the EX4550 switches. It slides
  into the module slot on the front panel or the one on the rear panel. It has eight SFP+ cages in two
  rows of four, numbered 0 to 7, the even numbers on the upper row. Each cage takes an SFP+ transceiver
  at 10 Gbps or an SFP transceiver at 1 Gbps. Four arrow lamps between the rows show link activity and
  status for each pair of ports, and the module has one ST lamp. Two captive screws hold it. It ships
  with dust covers in the ports and is hot-insertable and hot-removable.


  Facts carried in the model that this schema has no field for:

  - ports-note: eight SFP+ ports, each at 10 Gbps with SFP+ or 1 Gbps with SFP, usable as Virtual Chassis
  ports

