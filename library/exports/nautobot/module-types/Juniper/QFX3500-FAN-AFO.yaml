comments: 'QFX3500-FAN-AFO, a field-replaceable fan tray with port-to-FRU airflow. Cold air comes in at
  the port end of the switch and hot air leaves at the FRU end. The tray holds two fan modules and has
  a single lamp, green when the tray is healthy and blinking amber on an error. It is hot-removable and
  hot-insertable, and one fan module cannot be replaced alone. The QFX3500 hardware guide gives it to
  the QFX3500-48S4Q-AFO. The chassis seats two, in slots 0 and 1 on either side of the management board.
  The front-to-back and back-to-front trays are never mixed in one chassis. The back-to-front sibling
  is QFX3500-FANAI.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - power-absent: not-published

