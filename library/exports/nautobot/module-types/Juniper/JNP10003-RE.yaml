---
manufacturer: Juniper
model: JNP10003-RE
description: Juniper MX10003 Routing and Control Board (JNP10003-RE) - two run side by side across the
  top of the chassis
console-ports:
  - name: '{module}/con'
    type: rj-45
  - name: '{module}/usb'
    type: usb-a
interfaces:
  - name: '{module}/bits'
    type: other
    label: BITS
  - name: '{module}/mgmt'
    type: 1000base-t
    mgmt_only: true
  - name: '{module}/mhz-in'
    type: other
    label: SMB
  - name: '{module}/mhz-out'
    type: other
    label: SMB
  - name: '{module}/pps-in'
    type: other
    label: SMB
  - name: '{module}/pps-out'
    type: other
    label: SMB
  - name: '{module}/tod'
    type: other
    label: TOD
comments: 'Juniper MX10003 Routing and Control Board (JNP10003-RE) - two run side by side across the top
  of the chassis. USB, MGMT and CON jacks, the blue SSD carrier (SSD 0 / SSD 1), MST/HA/ALM lamps, ToD
  and BITS jacks and the PPS / 10MHz OUT-IN SMB quad, with RESET, OK/FAIL and ONLINE on the bottom strip.


  Facts carried in the model that this schema has no field for:

  - power-draw-max-w: 58

  Contract version 1.2.0 (juniper/jnp10003-rcb).'
