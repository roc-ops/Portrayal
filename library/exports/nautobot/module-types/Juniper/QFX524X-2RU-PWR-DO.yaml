  connector, and the guide ships two six-wire DC power cords with the switch. The face carries a grille
  with a pull handle at its left, the six-pin connector, a release latch and one bicolour lamp. The AC
  builds take the QFX5240-PWR-AC-AO, which is a different part number.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: -48 to -60 VDC, 80 A maximum per supply for 3 kW output; output 12.2 V (guide Tables 6 and
  17)

  - power-output-w: 3000

  - role: dc-power-supply

