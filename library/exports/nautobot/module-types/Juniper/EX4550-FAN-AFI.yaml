comments: 'Juniper EX4550-FAN-AFI, the field-replaceable fan module with back-to-front airflow (AIR IN,
  AFI) that the EX4550 hardware guide lists for the EX4550 switches. Air enters at the rear and leaves
  at the port panel. The module has two hexagonal grilles and a handle band with the label AIR IN (AFI).
  The EX4550 seats three of them, in rear slots 1 to 3 from left to right. They are hot-removable and
  hot-insertable. Never mix it with AIR OUT fan modules or with power supplies that carry the AFO label.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - power-draw-max-w: 16.8

  - power-draw-typical-w: 4.8

  - role: chassis-fan

  Contract version 1.0.0 (juniper/ex4550-fan-afi).'
