comments: 'Juniper 2520 W AC power supply (PWR-MX480-2520-AC) of the EX9204 and EX9208. It is the high-capacity
  AC supply of the MX240 and MX480. The CLI calls it "PS 1.4-2.52kW; 90-264V AC in". It has one IEC C20
  appliance inlet, an input switch, an internal fan and a pull handle. Its three lamps are AC OK, DC OK
  and PS FAIL. It takes low-line (100 to 120 V) or high-line (200 to 240 V) input. It seats in PEM0 to
  PEM3. It cools from the chassis front to its own rear.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back (the supply draws air from the front of the chassis and exhausts at its own
  rear)

  - input-current-a: 16 (low line), 15.1 (high line)

  - input-voltage: 100-120 VAC (low line) or 200-240 VAC (high line), 50-60 Hz

  - power-output-low-line-w: 1167

  - power-output-w: 2400

  - redundancy: high-line 1+1; low-line 2+2

  Contract version 1.0.0 (juniper/ex9200-pwr-mx480-2520-ac).'
