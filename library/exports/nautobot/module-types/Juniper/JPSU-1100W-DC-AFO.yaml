comments: 'JPSU-1100W-DC-AFO, a 1100 W DC power supply with dual feeds and port-to-FRU (front-to-back)
  airflow (AIR OUT). It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares
  with its twin. The QFX5210 hardware guide says the QFX5210-64C with DC supplies takes two, in slots
  0 and 1 at the two ends of the FRU panel. The face carries a three-terminal block (terminals 1 to 3).
  The V+ terminals are shunted internally, as are the V-. It also has a tall gold handle, one round bi-colour
  lamp and a black ejector lever. The back-to-front sibling is JPSU-1100W-DC-AFI. AC and DC supplies,
  and supplies of different airflow direction, are never mixed in one chassis.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - inlet: dc-terminal

  - input: rated -48 to -60 VDC, operating range -40 to -72 VDC, 25 A maximum (guide Table 21)

  - power-output-w: 1100

  - role: dc-power-supply

  Contract version 1.1.0 (juniper/qfx5210-jpsu-1100w-dc-afo).'
