comments: 'Juniper JNP-FAN-3RU, the universal fan tray of the EX9253, labelled AIR OUT. Air enters at
  the front of the chassis and leaves at the rear. The tray stands upright in the rear panel and holds
  two counter-rotating fans behind two hexagonal grilles, one above and one below an AIR OUT chip. It
  has a captive screw at the top, a latch handle at the foot and a status lamp at the lower left. The
  EX9253 seats four, in slots FT0 to FT3 from the left. They are hot-removable and hot-insertable; a single
  fan cannot be replaced, only the tray. There is no back-to-front tray in the guide.


