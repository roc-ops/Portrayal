comments: 'QFX5220-32CD-FANAI, the field-replaceable fan module of the QFX5130-32CD with back-to-front
  airflow (AIR IN, FRU-to-port). Cold air comes in at the back and hot air leaves at the port side. It
  is marked AIR IN on a grey chip on its Juniper azure blue handle. It is hot-removable and hot-insertable.
  The QFX5130-32CD takes six, in slots 0 to 5 from left to right, and runs on five (5+1). The front-to-back
  sibling is QFX5220-32CD-FANAO. The two are never mixed in one chassis, and never with supplies of the
  other direction. The guide''s Table 3 and the datasheet name it QFX5220-32CD-FANAI; its Table 17 names
  the same module QFX5130-32CD-FANAI (and QFX5130E-32CD-FANAI for the E model, which is not modelled here).
  The status lamp is on the chassis strip beside each slot, not on the module.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - power-absent: not-published

  Contract version 1.0.0 (juniper/qfx5130-32cd-fan-afi).'
