comments: 'Juniper EX4400-EM-4Y, the 4x25GbE SFP28 extension module of the EX4400 switches. The guide
  lists it for every EX4400 model, and from Junos OS 24.2R1-S1 for the EX4400-48XP and -48MXP as well.
  It seats horizontally in the extension module slot at the front right. It has four SFP28 cages in one
  row, numbered 0 to 3. Each cage has a link activity lamp and a status lamp. Two captive screws hold
  the module. It takes up to four 1GbE SFP, four 10GbE SFP+ or four 25GbE SFP28 transceivers. Do not mix
  transceiver types in the module. It runs at 25 Gbps by default and supports MACsec with AES-256.


  Facts carried in the model that this schema has no field for:

  - first-junos-release: 21.1R1

  - macsec: AES-256

  - ports-note: four SFP28 ports at 25 Gbps by default, or all four at 10 Gbps or at 1 Gbps with a CLI
  setting

  - sfp28: 4

  - weight-kg: 0.13

  Contract version 1.0.0 (juniper/ex4400-em-4y).'
