comments: 'Juniper MPC3E NG Q carrier (MX-MPC3E-3D-NG-Q) - two MIC slots taking MIC3 and the classic MICs
  of its own column (Table 12). It gives 130 Gbps with hierarchical queuing. It is not the MPC3E NG (juniper/mpc3e-3d-ng):
  it draws more power and its MIC column differs. Needs high-capacity fan trays and filter trays, and
  an SCBE-MX or SCBE2-MX, not the legacy SCB. One card for the MX240, MX480 and MX960, drawn horizontal;
  the MX960 seats it turned 90.


  Facts carried in the model that this schema has no field for:

  - model-variants: MPC3E-3D-NG-Q

  - power-draw-max-w: 583

  Contract version 1.0.0 (juniper/mpc3e-3d-ng-q).


  Not given to Nautobot: module bay(s) mic0, mic1. Each accepts a module that also seats directly in a
  chassis bay, so that module''s port names cannot carry this bay''s parent, and Nautobot copies a bay''s
  position as written (position templating is nautobot/nautobot#5823).'
