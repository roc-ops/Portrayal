comments: 'QFX5220-32CD-FANAO, the field-replaceable fan module of the QFX5130-32CD with front-to-back
  airflow (AIR OUT, port-to-FRU). Cold air comes in at the port side and hot air leaves at the back. It
  is marked AIR OUT on a grey chip on its Juniper gold handle. It is hot-removable and hot-insertable.
  The QFX5130-32CD takes six, in slots 0 to 5 from left to right, and runs on five (5+1). The back-to-front
  sibling is QFX5220-32CD-FANAI. The two are never mixed in one chassis, and never with supplies of the
  other direction. The guide''s Table 3 and the datasheet name it QFX5220-32CD-FANAO; its Table 17 names
  the same module QFX5130-32CD-FANAO (and QFX5130E-32CD-FANAO for the E model, which is not modelled here).
  The status lamp is on the chassis strip beside each slot, not on the module.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - power-absent: not-published

  Contract version 1.0.0 (juniper/qfx5130-32cd-fan-afo).'
