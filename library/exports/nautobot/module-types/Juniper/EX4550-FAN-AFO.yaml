comments: 'Juniper EX4550-FAN-AFO, the field-replaceable fan module with front-to-back airflow (AIR OUT,
  AFO) that the EX4550 hardware guide lists for the EX4550 switches. Air enters at the port panel and
  leaves at the rear. The module has two hexagonal grilles and a handle band with the label AIR OUT (AFO).
  The EX4550 seats three of them, in rear slots 1 to 3 from left to right. They are hot-removable and
  hot-insertable. Never mix it with AIR IN fan modules or with power supplies that carry the AFI label.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - power-draw-max-w: 16.8

  - power-draw-typical-w: 4.8

  - role: chassis-fan

  Contract version 1.0.0 (juniper/ex4550-fan-afo).'
