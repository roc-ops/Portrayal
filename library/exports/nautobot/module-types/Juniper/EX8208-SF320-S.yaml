comments: 'Juniper EX8208-SF320, the Switch Fabric (SF) module of the EX8208: one third of the switch
  fabric on a horizontal card with two lamps (ST and SF) at the left, two ejector levers and a captive
  screw at each end. It goes in the slot labelled SF, between SRE0 and SRE1, and is keyed so that it fits
  nowhere else. Every shipping order includes one; in the base order it works with the single SRE module
  and in the redundant orders it provides the redundant switching plane. It is hot-insertable and hot-removable
  in a redundant chassis; in a base chassis it is taken offline first.


  Facts carried in the model that this schema has no field for:

