comments: 'QFX5110-32Q-FANAFO, the field-replaceable fan module of the QFX5110-32Q with front-to-back
  airflow. Air comes in through the vents at the port side and leaves at the fan end. It is marked AIR
  OUT on a Juniper Gold handle. The switch seats five, in slots 0 to 4 left to right. The back-to-front
  sibling is QFX5110-32Q-FANAFI. The QFX5110 hardware guide says to use only the fan module designed for
  the product number, so the QFX5110-48S has its own part. The two airflows are never mixed in one chassis,
  and never with power supplies of the other direction.


  Facts carried in the model that this schema has no field for:

