comments: 'The AC power supply of the Juniper EX4500 switches with front-to-back airflow. It gives 1000
  W at a low line voltage (100 to 120 VAC) and 1200 W at a high line voltage (200 to 240 VAC). It is a
  field-replaceable unit, hot-removable and hot-insertable. The face has a C19 appliance inlet, a fan,
  a diagonal handle, a bicolour status lamp and a green ejector lever. The lever colour shows the airflow.
  It must match the label visible through the fan tray. The guide gives no part number for it.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: 100 to 120 VAC or 200 to 240 VAC, 50 to 60 Hz; 12 A and 6 A (guide Table 40)

  - power-output-w: 1200

  - role: ac-power-supply

