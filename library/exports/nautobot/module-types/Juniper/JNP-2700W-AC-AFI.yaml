comments: 'JNP-2700W-AC-AFI, a 2700 W AC power supply with back-to-front airflow (AIR IN, FRU-to-port).
  It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares with its twin; the
  QFX5230-64CD-AFI ships with two. The face carries a round fan guard with a green handle across it, a
  C20 appliance inlet, a black release latch and one lamp marked PWR. The front-to-back sibling is JNP-3000W-AC-AFO,
  a 3000 W unit with a Juniper gold handle. AC and DC supplies, and supplies of different airflow direction,
  are never mixed in one chassis.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - input: 180 to 305 VAC, 50 to 60 Hz (guide Table 4); output 12 V at 225 A and 12 V standby at 1 A

  - power-output-w: 2700

  - role: ac-power-supply

  Contract version 1.0.0 (juniper/qfx5230-jnp-2700w-ac-afi).'
