comments: 'QFX5130-48C-FANAO, the field-replaceable fan module of the QFX5130-48C and QFX5130-48CM with
  front-to-back airflow (AIR OUT, port-to-FRU). Cold air comes in at the port side and hot air leaves
  at the back. It is marked AIR OUT on a grey chip on its Juniper gold handle band. It is hot-removable
  and hot-insertable. The chassis takes six, in slots 0 to 5 from the left, and, unlike the QFX5130-32CD,
  it cannot run on five: its redundancy is at the rotor level, so one rotor of a module may fail. The
  back-to-front sibling is QFX5130-48C-FANAI. The two are never mixed in one chassis, and never with supplies
  of the other direction. The datasheet orders it as QFX5130-48C-FANAO; the hardware guide''s Tables 4
  and 17 print the same module as QFX5130-48C-FANAFO. The status lamp is on the module, at the lower right
  of its face.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - hot-swap: yes

  - power-absent: not-published

  - role: chassis-fan

  Contract version 1.0.0 (juniper/qfx5130-48c-fan-afo).'
