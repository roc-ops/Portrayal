comments: 'Juniper QFX5100-FAN-AFO, the field-replaceable fan module with front-to-back airflow (AIR OUT)
  that the EX4600 hardware guide lists for the EX4600 switch. Air enters at the port panel and leaves
  at the rear. The module has an orange handle band, a grey AIR OUT chip and a captive screw at the top
  left. The EX4600 seats five of them, in rear slots 0 to 4 from left to right. They are hot-removable
  and hot-insertable. The same module is used in the QFX5100 switches. Never mix it with AIR IN fan modules
  or with power supplies that carry the AFI label.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - power-absent: not-published

  - role: chassis-fan

  Contract version 1.0.0 (juniper/ex4600-fan-afo).'
