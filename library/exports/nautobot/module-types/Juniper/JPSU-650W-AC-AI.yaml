  the QFX5120-48T and QFX5120-48Y take it. They seat two, in slots 0 and 1 at the right of the rear. No
  other line is named in the guide held here. The face is that of its front-to-back sibling JPSU-650W-AC-AO
  with a Juniper Azure Blue handle. AC and DC supplies, and supplies of different airflow direction, are
  never mixed in one chassis.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - input: 100 to 240 VAC, 50 to 60 Hz, 6 A (QFX5120-48Y, guide Table 29)

