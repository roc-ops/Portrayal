comments: 'QFXC01-FANBI, a field-replaceable fan tray with FRU-side-to-port-side airflow. Cold air comes
  in at the FRU end of the switch and hot air leaves at the port end. The tray holds two fan modules and
  has a single lamp, green when the tray is healthy and blinking amber on an error. It is hot-removable
  and hot-insertable, and one fan module cannot be replaced alone. The QFX3600 hardware guide gives it
  to the QFX3600-16Q-AFI and the QFX3600-I-16Q-AFI. The chassis seats three, in slots 0 to 2 from left
  to right between the two power supplies. The front-to-back and back-to-front trays are never mixed in
  one chassis, and never with power supplies of the other direction. The front-to-back sibling is QFXC01-FANBO.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - power-absent: not-published

  Contract version 1.0.0 (juniper/qfx3600-qfxc01-fanbi).'
