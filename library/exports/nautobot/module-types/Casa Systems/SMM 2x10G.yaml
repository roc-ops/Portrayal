comments: 'Casa standard SMM 2x10GE - the C100G/C40G Switch and Management Module in its original density.
  Eight GigE SFP (G0-G7) and two 10GigE SFP+ (XG2, XG1), a 10/100BASE-T management RJ45 at the top and
  an RS-232 console RJ45 at the bottom, plus STATUS, ACTIVE and ALARM lamps. The cage population is the
  inverse of the high-density SMM 8x10G, on the same eleven openings.


  Facts carried in the model that this schema has no field for:

  - console: RS-232

  - mgmt: 10/100BASE-T

  - power-draw-max-w: 110

  - role: supervisor

  - sfp: 8

  - sfp-plus: 2

  Contract version 1.8.0 (casa/smm-2x10g).'
