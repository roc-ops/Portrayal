comments: 'Casa 6+12 I/O module - the rear half of a BDM position, carrying six downstream (D0-D5) and
  twelve upstream (U0-U11) MCX jacks. Pairs with a BDM in the associated front slot. The IO2 variant is
  the same faceplate at 5-204 MHz instead of 5-85 MHz. (v2 = composed - the eighteen MCX openings are
  std/mcx@1 at the sourced 4.95 x 4.50 D-hole; v1 drew them inline at an ESTIMATED 3.87 x 3.14, so an
  aperture here is about 28 percent wider than it was at v1. Jack AXES are unchanged.)


  Facts carried in the model that this schema has no field for:

  - connector: mcx

  - downstream: 6

  - media: coax

  - power-absent: not-applicable

  - spectrum: 5-85MHz

  - upstream: 12

  Contract version 2.7.1 (casa/io-6p12).'
