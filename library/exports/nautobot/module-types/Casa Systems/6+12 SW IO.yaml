comments: 'Casa 6+12 SW I/O - the combined switch and I/O card. Same six downstream and twelve upstream
  MCX jacks as the plain 6+12, but it also carries the LC switch function, so it goes in the redundancy
  slot that a BDM scheme frees up: C100G rear 8, C40G rear 4. Its RF port section stands proud of the
  faceplate. (v2 = composed - the eighteen MCX openings are std/mcx@1 at the sourced 4.95 x 4.50 D-hole;
  v1 drew them inline at an ESTIMATED 3.88 x 3.88, so an aperture here is about 28 percent wider in x
  and 16 percent in y than it was at v1. Jack AXES are unchanged.)


  Facts carried in the model that this schema has no field for:

  - connector: mcx

  - downstream: 6

  - media: coax

  - power-absent: not-applicable

  - slot: C100G-rear-8 / C40G-rear-4

  - spectrum: 5-85MHz

  - switch: yes

  - upstream: 12

  Contract version 2.8.1 (casa/io-6p12-sw).'
