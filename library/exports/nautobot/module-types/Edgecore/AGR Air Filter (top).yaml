manufacturer: Edgecore
model: AGR Air Filter (top)
description: Removable top air filter for the Edgecore AGR400 (AS7946-30XB)
comments: 'Removable top air filter for the Edgecore AGR400 (AS7946-30XB). NOT the AGR420''s: that chassis
  measured this part and rejected it - 353.5 mm against the 417 its front needs, and stepped for the AGR400''s
  TWO QSFP-DD blocks where the AGR420 front has one. The AGR420 draws edgecore/agr420-filter-top@1 with
  agr420-filter-step@1 instead. A dark metal frame with open sections and reticulated foam behind them.
  It bolts onto the OUTSIDE of the faceplate with captive thumb screws - it does not slide into a bay
  - so it is placed, not seated. Its outline is not a plain rectangle - it drops deeper over each QSFP-DD
  block, which the maintainer describes as two nubs and the photographs confirm.


  Contract version 1.0.0.'
