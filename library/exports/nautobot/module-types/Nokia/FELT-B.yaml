comments: 'Nokia FELT-B (3FE 69486 AA and 3FE 69486 AB), the high-speed point-to-point Ethernet LT of
  the 7360 ISAM FX / Lightspan FX: eighteen SFP cages in nine ganged 1x2 blocks, grouped G1-G5, each taking
  a CSFP (two FE/GE ports), an SFP (FE/GE/2.5G) or an SFP+ (10G), so 36, 18 or 16 ports; a BITS OUT RJ45;
  the PWR(A/S) and ALM lamps and two link lamps per cage. Authored upright, as the card stands in the
  FX-16; the FX-4 and FX-8 bays turn it 90 degrees. The AA and AB variants share one face (the two UDS
  chapters embed the SAME image objects for their front and 3D views), so they are one component with
  the variant in attrs. FELT-B AC (3FE 69486 AC) has no data sheet in any staged document and is not modelled.


