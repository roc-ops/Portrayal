comments: 'Nokia LWLT-C (3FE 76353 AA, and 3FE 76353 BA, the US-made BEAD build), the 16-port Multi-PON
  line termination board of the Lightspan MF shelves: GPON, XGS-PON or Multi-PON (MPM, GPON + XGS-PON)
  on every port and 25GS-PON on the even ports, in sixteen SFP-DD cages marked 01 to 16. Authored lying
  flat, as the MF-8 seats it when the shelf is mounted horizontally: a slate plate with an ejector lever
  at each lower corner, the board name, the PWR and ALM lamps and a label at the left, and one row of
  sixteen cages on a 19.9 mm pitch, each on its own sawtooth step turned to face right, with four vent
  openings above it and, on the strip under the row, its numeral between two rectangular PON light pipes.
  The two part numbers share one face, so they are one component.


  Facts carried in the model that this schema has no field for:

  - part-number: 3FE 76353 AA / BA

  - power-draw-max-w: 104

  - power-draw-typical-w: 96

  - power-scope: full load, all lines active, in the highest use case the manual lists, 8 x 25GS-PON (96
  W typical at 48 Vdc and 25 C, 104 W maximum at worst-case voltage, temperature and component tolerances).
  2PM XGS/GPON is 93 / 104 W, XGS-PON 76 / 82, GPON 58 / 62

  - weight-kg: 1.6

  - xgs-pon: 16

  Contract version 1.0.1 (nokia/lwlt-c).'
