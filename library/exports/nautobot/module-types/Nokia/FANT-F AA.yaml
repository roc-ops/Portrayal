comments: 'Nokia FANT-F AA (3FE53701AA), the ETSI/MII network termination card version F of the 7360 ISAM
  FX, with a 480 Gbps switch. Four SFP+ ports in a sawtooth housing whose facets tip the cages up, set
  LOW on the face under a blank, the DC IN / DC OUT daisy-chain NTR clock RJ45 pair near the top, the
  front uplink 10/100/1000Base-T port and the LCRT craft port (RJ45) at the bottom, the ACO switch, and
  the ALM/PWR/ACO/A/S lamps plus one FSM lamp per SFP+. No SMA timing jacks, no ToD and no BITS on this
  build. Stands vertically in the FX-16 and is turned in the FX-8 and FX-4.


  Facts carried in the model that this schema has no field for:

