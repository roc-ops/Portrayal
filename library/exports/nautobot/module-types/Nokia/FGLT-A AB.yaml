comments: 'Nokia FGLT-A (3FE 66721 AB), the 16-port GPON line termination board with traffic manager (version
  A) of the 7360 ISAM FX; dropped from the Lightspan FX guides. Seats in any LT slot of the FX-4, FX-8
  and FX-16. Authored upright, as the Unit Data Sheet guides draw it: a thumbscrew and a grey ejector
  lever in a cap at each end, the PWR and ALM lamps and a hot-surface mark under the top cap, then eight
  windows in a flat faceplate, each showing two SFP cages angled on a sawtooth behind the plate (16 GPON
  ports), and the barcode and model labels above the bottom cap. One PON lamp per port sits in the side
  of its socket, on the port''s left. The face is the FGLT-B''s; only the model label differs.


