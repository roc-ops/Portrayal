  - power-draw-max-w: 127

  - power-draw-scope: module

  - power-draw-typical-w: 120

  - qsfp28: 2

  - sfp-plus: 2

  - switch-capacity: 2.0 Tbps

  - temperature-range: central-office

  - variants: AA 3FE79270AA - central office, -5 to +45 C with multiple subracks. AB 3FE79270AB - temperature
  hardened, -40 to +65 C in a central office or outdoor cabinet with multiple subracks. One face, one
  drawing; a bay seating the AB says so with attrs {part-number: 3FE79270AB, temperature-range: hardened}.

