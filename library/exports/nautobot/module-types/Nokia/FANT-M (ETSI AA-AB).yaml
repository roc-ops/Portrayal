comments: 'Nokia 7360 ISAM FX FANT-M network termination (NT) card, ETSI build - part 3FE79270AA and its
  temperature-hardened twin 3FE79270AB, which share this face. A 2.0 Tbps switch and the subrack''s management,
  alarm and timing controller, seated at NT-A and/or NT-B of an FX-16, FX-8 or FX-4 subrack. Authored
  upright; the FX-4 and FX-8 bays turn it with rotate 90. The ANSI face (nokia/fant-m@1) plus what the
  ETSI build adds - an alarm cut-off (ACO) switch and ACO lamp, and BITS_IN and BITS_OUT RJ-45s between
  the micro-USB and the ETH jack - fourteen lamps in all.


  Facts carried in the model that this schema has no field for:

  - input-voltage: -48 V DC and -60 V DC nominal

