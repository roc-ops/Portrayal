  ISAM FX, supported only with the FANT-H NT: sixteen SFP cages in eight ganged 1x2 blocks, grouped G1-G4,
  each taking a CSFP (two FE/GE ports), an SFP (FE/GE/2.5G) or an SFP+ (10G), so 32 or 16 ports; two QSFP
  cross-LT cages to a peer FELT-C; PWR(A/S), ALM, Q1 and Q2 lamps and two link lamps per SFP cage. Authored
  upright; the ETSI UDS draws it horizontal.


