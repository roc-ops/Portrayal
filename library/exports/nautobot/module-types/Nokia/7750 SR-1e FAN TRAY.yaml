comments: 'Nokia 7750 SR-1e fan tray (3HE10304AA, "FAN - 7750 SR-1e Fan Tray (with 10 axial fans)"), the
  single hot-swappable cooling unit of the 7750 SR-1e. It slides into the vertical slot at the right of
  the chassis rear and pulls air from the front intake through the card cage. Drawn is its rear face,
  upright as it sits: a label strip down the left edge carrying the PWR/STAT lamp at the top, the printed
  chassis name and FAN TRAY, and two ESD marks at the foot; to its right a honeycomb exhaust grille between
  two perforated handle panels, each with a U pull handle and a captive screw. Fan trays are chassis-specific
  (SR-e guide p66 Table 17): the 7750 SR-2e and 7750 SR-3e trays are separate parts of the same design.


