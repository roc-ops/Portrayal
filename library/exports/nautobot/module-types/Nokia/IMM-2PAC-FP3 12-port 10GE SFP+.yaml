comments: 'Nokia 12-port 10GE SFP+ Multi-Core IMM (3HE07158AA L3HQ, -BA L3BQ, -CA L2HQ - one face, three
  licences), the FP3 integrated media module of the 7750 SR-7 / SR-12 (7450 ESS-7 / ESS-12) and SR-12e
  card slots. CLI card-type imm-2pac-fp3 with two fixed MDAs of mda-type p6-10g-sfp. The printed label
  IMM-2PAC-FP3 is shared by seven different IMMs (IMM p25 Table 11), so this one is named card-type plus
  MDA-type. Authored horizontal, as IMM p68 Fig 20 draws it: a full-length dark plate with a silver captive
  screw and a black ejector lever at each end, Card Stat / Media Stat / Pwr at the left, a run of six
  SFP+ cages (ports 1/1-1/6) under a "P6-10G-SFP Port" legend with a Lnk and an Act lamp under each cage,
  then the second MDA''s Media Stat / Pwr and its six cages (2/1-2/6), the model label and the ESD mark
  at the right. In the SR-12 the whole card is turned 90 degrees clockwise by the bay, so Card Stat is
  at the top. Not the FP2 12-Port 10GE SFP+ IMM (IMM12-10GB-SFP+, 3HE05553AA), whose ports number 1-12.


