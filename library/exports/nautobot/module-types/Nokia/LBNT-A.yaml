comments: 'Nokia LBNT-A, the 2 Tbps Network Termination (NT) board of the Lightspan MF-8 and MF-14, in
  its two functional variants: LBNT-A AA (3FE 79417 AA) and LBNT-A AB (3FE 79417 AB, the same board with
  secure boot and a 10 Gb/s PTP port). One face serves both. Authored horizontal, as the Unit Data Sheet
  guide draws it and as the MF-8 seats it. Left to right: a white ejector lever, the model name and the
  PWR, ALM, A/S and PTP lamps (their legends read upright when the card stands in an MF-14), the ESD,
  hot-surface and laser marks, the PTP SFP+ cage in a recessed well, the two QSFP28 uplink cages PORT
  1 and PORT 2 in a second well with four lane lamps 1 2 3 4 above each, the DEBUG and USB Type-C sockets,
  the OOB, LEMI and CRAFT RJ-45s, an arrow label, and the second lever. The three optical cages stand
  at 45 degrees to the plate, looking toward the right-hand end.


