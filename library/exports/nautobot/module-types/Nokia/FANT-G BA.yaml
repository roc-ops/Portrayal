comments: 'Nokia FANT-G BA (3FE71256BA), the ANSI build of the 7360 ISAM FX / Lightspan FX network termination
  card with the 1.2 Tbps switch. Four SFP+ cages and one 100GE CFP4 cage, 1PPS and 10 MHz SMA timing inputs,
  the cages and SMAs set on a sawtooth housing whose 45 degree teeth tip the ports up, a micro-USB debug
  port, a 10/100/1000BASE-T port, the craft port and the ToD/1PPS port, all RJ45, and the ALM/PWR/A/S
  and X1-X5 lamps. No ACO switch and no BITS jacks on the face.


