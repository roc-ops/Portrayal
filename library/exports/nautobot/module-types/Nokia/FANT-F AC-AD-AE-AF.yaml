comments: 'Nokia FANT-F AC / AD / AE / AF (3FE53701AC, AD, AE, AF), the ETSI/MII network termination card
  version F of the 7360 ISAM FX, with a 480 Gbps switch. Four SFP+ ports in a sawtooth housing just under
  the lamps, whose facets tip the cages up, then the 1PPS and 10 MHz SMA timing jacks flat on the plate,
  the front uplink 10/100/1000Base-T port, the LCRT craft port, the ToD/1PPS port and BITS IN / BITS OUT
  (all RJ45), the ACO switch, and the ALM/PWR/ACO/A/S lamps plus one FSM lamp per SFP+. Stands vertically
  in the FX-16 and is turned in the FX-8 and FX-4.


  Facts carried in the model that this schema has no field for:

  - input-voltage: -48 V DC and -60 V DC nominal

  - part-number: 3FE53701AC

  - power-draw-max-w: 97

  - power-draw-scope: module

  - power-draw-typical-w: 82

  - sfp-plus: 4

  - standard: ETSI

  - switch-capacity: 480 Gbps

  - variants: AC 3FE53701AC, AD 3FE53701AD, AE 3FE53701AE, AF 3FE53701AF - one face. The AD, AE and AF
  add PTP IEEE 1588v2 and 1PPS/ToD support in their feature lists (ETSI UDS A18 19.3, 20.3, 21.3), which
  is firmware and timing hardware behind the same connectors

  - weight-kg: 2.0

  Contract version 1.0.0 (nokia/fant-f-ac).'
