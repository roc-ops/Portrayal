  or 100G. Authored upright, as the Unit Data Sheet guide draws it: ejector and thumbscrew at each end,
  eight QSFP28 cages on a sawtooth angled 45 degrees for fibre bend radius, a lamp per port, two marks,
  and the PWR and ALM lamps stacked near the bottom lever. Nokia sets the sawtooth into the plate: the
  teeth stand in one long pocket behind a flat front, their ridges just short of the plate.


