comments: 'Cisco ASR 9000 400-Gbps IPoDWDM Line Card. Two CFP2-DWDM ports at 100 Gigabit Ethernet and
  twenty SFP+ ports at 10 Gigabit Ethernet on one faceplate, the SFP+ in two double- stacked blocks of
  ten. Cisco names the optical ports CFP2-0 and CFP2-1 rather than numbering them alongside the SFP+,
  so the two port sets are numbered independently and the SFP+ run 0 to 19.


  Facts carried in the model that this schema has no field for:

  - capacity: 400 Gbps

