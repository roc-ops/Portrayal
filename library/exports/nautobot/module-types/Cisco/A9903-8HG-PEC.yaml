comments: 'Cisco ASR 9903 Series 800G (0.8T) Port Expansion Card. Forty-eight physical ports in two rows
  of twenty-four, grouped into slice 4 and slice 5. All forty-eight run 10GE SFP+ by default; thirty-two
  of them are multi-rate and can be switched to 25GE SFP28 a slice at a time, and the card supports line-rate
  MACsec on both rates. One of two optional PECs for the ASR 9903.


  Facts carried in the model that this schema has no field for:

  - eol: none-announced

  - power-absent: not-published

  - role: port-expansion-card

  - sfp-plus: 48

  - sfp28: 32

  - slices: 2 (slice 4 and slice 5)

  - throughput: 800 Gbps

  - weight-kg: 5.82

