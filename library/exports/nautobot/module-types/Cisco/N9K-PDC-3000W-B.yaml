comments: 'Cisco N9500 Series 3-kW (-48 V) DC power supply (N9K-PDC-3000W-B). Same envelope as the AC
  supply. It stands on end in a power-supply bay. The power switch and the FAIL/ID and OK lamps are at
  the top. A hexagon vent grille runs down the face and the release lever runs along the right edge. A
  terminal box with four posts in a column is down the lower left, under a three-screw safety cover. The
  posts are negative, positive, positive and negative from the top: two for each of the two inputs. The
  Nexus 9504, 9508 and 9516 take the same part.


  Facts carried in the model that this schema has no field for:

  - airflow: port-side intake

  - efficiency: 90% or greater (20 to 100% load)

  - eol: unknown

  - hot-swappable: True

  - input: dc

  - input-voltage: -48 to -60 VDC

  - power-output-w: 3000

  - role: power-module

  Contract version 2.0.0 (cisco/n9k-pdc-3000w-b).'
