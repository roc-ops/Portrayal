comments: 'Cisco A9K 400GE Combo Packet Transport Line Card, 5th generation. Forty-four ports on one faceplate:
  twenty-four SFP+ at 10GE, sixteen SFP28 at 10 or 25GE, and four QSFP+/QSFP28 at 40 or 100GE, for 400
  Gigabit of aggregate bandwidth. The ports are colour-coded into four groups of eleven and each group
  carries up to 100GE, so the supported combinations are a table rather than a sum.


