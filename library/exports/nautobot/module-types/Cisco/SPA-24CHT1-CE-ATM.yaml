comments: 'Cisco 24-Port Channelized T1/E1/J1 CEoP SPA, a single-height shared port adapter for the ASR
  9000 SIP-700. The 24-port channelized T1/E1/J1 CEoP SPA''s physical interface is one high-density connector
  that the customer installs, with thumbscrews to be tightened into the SPA once the cable is in place.
  The cable is CABLE-24T1E1J1: a 100-pin connector at one end plugs into the SPA''s front, and the other
  end carries two 50-pin Telco connectors. So all 24 circuits leave through ONE opening, which is why
  this SPA has 24 lamps and one connector. Seats in a SIP-700 SPA subslot; it is a module, not a device.


