comments: 'Cisco 8-Port Channelized T1/E1 SPA, a single-height shared port adapter for the ASR 9000 SIP-700.
  The 8-port channelized T1/E1 SPA''s E1 interface is RJ-48c receptacles taking E1 (120-ohm) cables with
  RJ-45 connectors; all ports can run at once, and each E1 connection supports interfaces meeting G.703.
  And the guide''s own note on the vocabulary: ''The terms RJ-45 and RJ-48c are sometimes used interchangeably.
  The RJ-48c is the jack or receptacle; the RJ-45 is the connector.'' Seats in a SIP-700 SPA subslot;
  it is a module, not a device.


  Facts carried in the model that this schema has no field for:

  - eol: none-announced

  - form-factor: single-width, single-height (one SIP-700 subslot)

  - media: RJ-48c, T1 or E1 (120-ohm), G.703

  - min-hardware-revision: 1.0

  - min-ios-xr: 4.1.0

  - ports: 8

  - power-absent: not-published

  - role: shared-port-adapter

