comments: 'Cisco 8-Port Channelized T1/E1 SPA, a single-height shared port adapter for the ASR 9000 SIP-700.
  ''The E1 interface on the 8-Port Channelized T1/E1 SPA uses RJ-48c receptacles for E1 (120-Ohm) cables
  with RJ-45 connectors. You can use all ports simultaneously. Each E1 connection supports interfaces
  that meet G.703 standards.'' And the guide''s own note on the vocabulary: ''The terms RJ-45 and RJ-48c
  are sometimes used interchangeably. The RJ-48c is the jack or receptacle; the RJ-45 is the connector.''
  Seats in a SIP-700 SPA subslot; it is a module, not a device.


  Facts carried in the model that this schema has no field for:

  - power-absent: not-published

  - role: shared-port-adapter

  - form-factor: single-width, single-height (one SIP-700 subslot)

  - ports: 8

  - media: RJ-48c, T1 or E1 (120-ohm), G.703

  - min-ios-xr: 4.1.0

