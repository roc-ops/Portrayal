comments: 'DriveNets lists Edgecore 7926-40XKFB-O-AC-F (NOS: dnos).

  DriveNets also calls it: NCP-40C.

  Listed per: DNOS CLI Reference Guide 26.2, `system ncp model`: AS7926-40XKFB is among the hardware models
  DNOS accepts for an NCP. Port names from the same reference: a service port is ge<speed>-<ncp>/<slot>/<port>
  and a fabric port fab-ncp400-<ncp>/0/<port>, the port being the id printed on the box (''as shown at
  the WB'') and counted from 0 on each NCP. Named here for a standalone box, NCP 0 and slot 0; in a cluster
  DNOS renames every port with the NCP id the deployment gives this box.


  40x 100G QSFP28 and 13x 400G QSFP-DD 2RU cell-based core router (vendor alias AS7926-40XKFB), Broadcom
  BCM88690 Jericho2 with a BCM16K external TCAM and an Intel Xeon D-1548, ONIE-preloaded. Every port is
  on the front, along with a carrier-grade air filter that covers most of the faceplate that is not a
  cage; two AC supplies stack in one column at the left of the rear and five 4+1 fan trays fill the rest
  of it, front-to-back only.


  Configuration `ac-f2b`: The only build either staged document draws: two AC supplies and five front-to-back
  fan trays. The datasheet''s ordering table sells it with and without a regional cord (below) and a DC
  build, which is dc-f2b. Its last row, 7926-40XKFB-O-AC-F Lite (FNPZZ7640001A), is not listed here: nothing
  held says what ''Lite'' leaves out.


  Also sold or listed as: AS7926-40XKFB


  Facts carried in the model that this schema has no field for:

  - compliance.emc: CE Mark, FCC Title 47 Part 15 Subpart B Class A, VCCI Class A

  - compliance.nebs: GR-63-CORE, GR-1089-CORE (NEBS Level 3). The datasheet footnotes this line ''* Pre-test.
  Certificate is by request with fees'', so it is a pre-test claim and not a certification.

  - compliance.rohs: RoHS-2.0 compliant; WEEE Directive 2002/96/EC

  - compliance.safety: UL (CAN/CSA 22.2 No 60950-1 & UL60950-1), IEC 62368-1:2014, CB (IEC/EN60950-1),
  CCC (GB4943.1-2011), BSMI (CNS14336-1)

  - environmental.altitude: 6000 ft

  - environmental.humidity-operating: 0% to 90%

  - environmental.temperature-operating: 0 C to 55 C

  - features.port-summary: 40 x 100G QSFP28, 13 x 400G QSFP-DD fabric

  - features.timing: Synchronous Ethernet, IEEE 1588v2 PTP, timing synchronization stack interfaces

  - lifecycle.eol: none-announced

  - management.mgmt-ports: 1x RJ-45 RS-232 console, 1x RJ-45 10/100/1000BASE-T management, 2x RJ-45 PPS/ToD,
  2x RJ-45 stacking-sync, 2x SFP+ 10G out-of-band, 1x USB 2.0 Type-A, 1x micro-USB console, 1x 1PPS/10MHz
  coaxial

  - performance.port-modes-qsfp-dd: 400GE fabric interconnect to a COR580 (Ramon) spine

  - performance.port-modes-qsfp28: 40GE, 50GE and 100GE; DAC breakout to 2 x 50GE, 4 x 25GE or 4 x 10GE

  - performance.throughput: 4.0 Tbps (non-blocking)

  - platform.asic: Broadcom BCM88690 (Jericho 2)

  - platform.bmc: ASPEED AST2600

  - platform.cpu: Intel Xeon D-1548, 8-core 2.0 GHz

  - platform.memory: DDR4 SO-DIMM 64 GB (32 GB x 2)

  - platform.software: ONIE installer pre-loaded; open-source and commercial NOS options

  - platform.storage: M.2 SSD 128 GB

  - platform.tcam: Broadcom BCM16K (OP2)

  - power.input-ac: 90 to 264 VAC, 50-60 Hz

  - power.input-dc: 40 to 72 VDC

  - power.power-envelope: unstated

  - power.power-max-w: 1400

  - power.power-redundancy: 1+1 redundant, load-sharing, hot-swappable

  - power.power-typical-w: 1100

  - thermal.airflow: front-to-back

  - thermal.cooling: 4+1 redundant hot-swappable fan modules, behind a carrier-grade air filter


