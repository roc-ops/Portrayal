comments: 'WTI CPM-800-1 console server and switched PDU hybrid, 1U. The front is the console server.
  It has eight RJ45 serial ports, two Ethernet jacks, a phone jack and a USB set-up port. It also has
  two antenna mounts, RESET and DEFAULT buttons and lamps. The rear is the PDU. It has two IEC C20 inlets,
  each feeding four of the eight NEMA 5-15R outlets, A1 to A8.


