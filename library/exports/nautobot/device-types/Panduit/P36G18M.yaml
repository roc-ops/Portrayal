comments: "Panduit P36G18M G5 intelligent rack PDU, monitored and switched per outlet, 0U full: a 1750\
  \ mm strip for a cabinet's vertical channel. It has a fixed 3 m cord ending in a NEMA L6-30P plug, single-phase,\
  \ 200-240 V, 30 A. It has 36 outlets, 30 IEC C13 and 6 IEC C19, in six blocks of six. Three blocks are\
  \ on each of two 20 A double-pole breakers. A controller with a display, indicators, five RJ45 jacks\
  \ and a USB-A port sits between the two halves.\n\nConfiguration `base`: The PDU as it ships, the controller\
  \ in its place.\n\nMounts on the side of a rack's upright, beside the rack; occupies no rack unit.\n\
  \nPDU class: managed (metering-scope outlet, outlet-switching true).\n\nInput rating: single-phase,\
  \ 24 A input (30 A plug).\n\nDatasheet: Panduit G5 Intelligent Power Distribution Units (iPDUs) specification\
  \ sheet FBSP28-WW-ENG 4/2024\n  https://www.panduit.com/PanProductResource/en/P36G18M/SpecificationSheets.pdf\n\
