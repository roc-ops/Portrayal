  \ in stacked pairs, the synchronisation block (GPS and two BITS SMA inputs, a ToD / E1-T1 RJ45 stack)\
  \ and the CLI / OOB management stack; a full-width expansion slot above it takes a 48 x SFP+ or a 4\
  \ x QSFP28 module, and two hot-swappable AC or DC supplies stack at the front left.\n\nConfiguration\
  \ `base`: The TM-8104 base: two AC supplies, the base board's 40 x SFP+ and the expansion slot empty.\n\
  \nAlso sold or listed as: T-Metro 8104\n\nDatasheet: Telco Systems TM-8104 Modular 1.2Tb Multi-Service\
