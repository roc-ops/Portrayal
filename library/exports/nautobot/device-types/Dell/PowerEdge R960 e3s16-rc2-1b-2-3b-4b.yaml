comments: '4U four-socket rack server, 16th generation - up to 32 x 2.5 inch front drive bays (or 24 NVMe,
  16, 8, 16 EDSFF E3.S, or 8 + 16 E3.S), four hot-swap power supplies in 2+2 redundancy at the left and
  right of the rear, up to twelve PCIe Gen5 slots on four risers, an OCP NIC 3.0 slot and a rear BOSS-N1
  boot module


  Configuration `e3s16-rc2-1b-2-3b-4b`: 16 x EDSFF E3.S Gen5 NVMe front; riser configuration 2 (maximum
  I/O), R1B + R2 + R3B + R4B: ten full-height and two low-profile Gen5 x16 slots. ISM table 88, technical
  guide table 16.


  Facts carried in the model that this schema has no field for:

  - lifecycle.eol: none-announced

  - physical.ru: 4

  - physical.weight-max-kg: 60.2


