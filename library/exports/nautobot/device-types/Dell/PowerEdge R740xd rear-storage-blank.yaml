comments: '2U two-socket rack server - 24 x 2.5 inch front drive bays


  Configuration `rear-storage-blank`: THE "WITHOUT" HALF OF "WITH OR WITHOUT REAR STORAGE". ISM table
  25 names riser configurations 0, 1 and 2 that way - one riser layout, two storage outcomes - and every
  other configuration on this device draws the "with". Here the one-slot low-profile riser 2 is fitted,
  no drives were ordered, and both rear bays carry a perforated blank. IT IS ORDERABLE WHERE rear-2-lff
  IS NOT. Table 28''s rows 1, 3 and 9 all pair a 24 x 2.5 inch front with no rear backplane at all, which
  is exactly this machine, so unlike the 2 x 3.5 inch illustration this is a build you can buy. WHAT IT
  DOES NOT SHOW is riser 3: configurations 1 and 2 fit none, and the bay it would occupy is the one blanked
  here. `no-rear-storage` is the other shape - a three-slot riser 2 and a riser 3 - and the two are not
  the same machine despite both having no rear drives.


  Drawing version 10.0.2. A major bump means a slot moved or an id was renamed, so anything cached from
  an earlier export may no longer line up.

  Model maturity: draft. Every dimension in the source records where it came from.'
