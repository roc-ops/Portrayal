comments: '2U two-socket rack server - 24 x 2.5 inch front drive bays


  Configuration `lff-12`: THE 12 x 3.5 INCH FRONT, which this device has had a REAR for since it was first
  modelled and never had a front. Table 28 lists "3.5 inch (x12) SAS/SATA backplane" on its own as a supported
  option, and this is it: twelve 3.5 inch carriers in 3 rows of 4, over the three-riser rear. ONLY THE
  BAYS DIFFER FROM THE 24-BAY FRONT. ISM table 2 lists the same four features on both fronts - left control
  panel, drive slots, right control panel, information tag - so the panels, the latches, the bezel and
  every port on the right are shared, and the drive field is the same backplane opening divided four ways
  instead of twenty-four.


