comments: 'The 8RU Nokia 7750 SR-7 service router (and the 7450 ESS-7, the same chassis booted as a switch),
  a DC-only midplane chassis whose seven module slots lie HORIZONTALLY across the front: IOM/IMM slots
  1-5 at the top, then the two SF/CPM slots A and B, with the slot numbers printed in black boxes down
  a strip at the left. Below slot B are two bays for the DC power supply filters (an optional safety panel
  covers both). Rear: the vertical air filter tray at the left, the single Enhanced Fan Tray beside it
  and two horizontal DC PEM-3 bays at the bottom. Air enters at the right side and leaves at the rear.
  Every card is authored horizontal and seated at rotate 0, MDA slot 1 at the left as the guide says.


  Configuration `base`: The chassis as it ships and powers on (SR-7 guide p93 note 8: shipped with the
  Enhanced Fan Tray, the air filter tray, impedance panels, two DC PEM-3s and the power supply filters
  installed): both PEM-3s and filters, the fan tray, the air filter, an SF/CPM4-7 in A and B, and every
  IOM/IMM slot closed by a slot impedance panel.


  Also sold or listed as: 7450 ESS-7


