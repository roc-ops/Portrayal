comments: 'The 5RU ANSI shelf of the Nokia 7360 ISAM FX (Lightspan Access Node FX) GPON/NGPON access node,
  part 3FE64991BB. The four line-termination (LT) cards, the two network-termination (NT) cards and the
  NT I/O card lie HORIZONTALLY, stacked from the bottom: the general facilities card (NGFC-G), NT A, NTIO,
  NT B, then LT1 to LT4. The BFAN-X fan unit stands at the right-hand end behind a fan cover that carries
  the shelf''s name and the slot legends. Cards are authored upright, as the Unit Data Sheet guides draw
  them, and every card bay seats its card with `rotate: 270`, which turns the card''s top end to the LEFT,
  toward the power terminals, as an installed FX-8 shows. The LT slots take only the LT blank until the
  line cards are modelled (roc-ops/Portrayal#538).


  Configuration `fant-h-simplex`: One FANT-H BB in NT A, the NT dummy in NT B and dummies in NTIO and
  every LT slot - the shelf as it is ordered before line cards are chosen.


