comments: "Raritan Dominion SX II DSX2-32, a 32-port serial console server with dual AC power, 1U. The\
  \ rear carries two AC inlets, each with a power switch, and a fan. It has a TERMINAL serial jack, a\
  \ mini-USB Admin jack, three USB ports, a reset hole and a DVI-D video jack. Two Gigabit LAN jacks sit\
  \ beside 32 RJ45 serial ports in two banks of two rows. The lower rows are numbered 1 to 8 and 17 to\
  \ 24, and the upper rows 9 to 16 and 25 to 32. The front carries a USB port and the port lamps 1 to\
  \ 32.\n\nConfiguration `base`: DSX2-32, the 32-port unit with dual AC power and no modem. The rackmount\
  \ kit, two AC cords and four rubber feet are in the box (Quick Setup Guide v2.6.0, page 1) and are not\
  \ drawn.\n\nRack mounting positions: flush (\"forward mount\"; as shipped), rear (\"rear mount\").\n\
  \nDatasheet: Dominion SX II data sheet, V1209R3 (2021), Raritan\n  https://www.raritan.com/assets/ram/resources/data_sheets/raritan-ds-sxii.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- environmental.non-operating-temp-c:\
  \ 0 to 55\n- environmental.operating-humidity: 20% to 85%\n- environmental.operating-temp-c: 0 to 50\n\
  - features.modem: none on this model; the M models add an internal telephone modem\n- features.serial-pinout:\
  \ DTE or DCE detected by the port; RJ45 pins in user guide Appendix A, printed pp. 54 and 55\n- features.usb-admin:\
  \ USB 2.0 mini-B Admin port for a laptop (data sheet and features sheet)\n- features.video: DVI-D local\
  \ video jack (data sheet)\n- physical.weight-note: 9.08 lb (4.12 kg) in the user guide, as one figure\
  \ for the whole SX II family\n- power.power-input: 100 to 240 VAC auto-switching, 50 to 60 Hz, 0.35\
  \ A, two C14 inlets (data sheet and user guide)\n- power.power-max-w: 23\n\nDrawing version 0.1.0. A\
  \ major bump means a slot moved or an id was renamed, so anything cached from an earlier export may\
  \ no longer line up.\nModel maturity: modelled. Every dimension in the source records where it came\
