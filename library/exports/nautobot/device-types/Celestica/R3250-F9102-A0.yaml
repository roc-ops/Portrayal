comments: 'Celestica DS3001 - 2RU 64 x 100G QSFP28 data-center switch (sixteen columns of 2-high stacked
  cages) with two SFP+, an RJ-45 management / USB / console stack and a reset button at the right, and
  two 1300 W CRPS supplies and four hot-swap fan trays on the rear; front-to-back, back-to-front and DC
  builds.


  Configuration `b2f`: R3250-F9102-A0: the same, back-to-front airflow. How its fans and supplies differ
  on the outside is not documented (airflow-finish gap).


  Facts carried in the model that this schema has no field for:

  - compliance.acoustic: EN300753

  - compliance.emc: Class A - USA, Canada, Europe, China, Japan

  - compliance.psu-approvals: CE, CCC, KC, TUV, UL/cUL, BIS and BSMI

  - compliance.reach: (EC) No. 1907/2006

  - compliance.rohs: 2011/65/EU & 2015/863

  - compliance.safety: UL/CSA/IEC/EN 60950-1/62368-1

  - compliance.weee: Directive 2012/19/E (as printed)

  - environmental.humidity: 5% to 90% non-condensing (datasheet); 40-65% long term, 10-90% short term
  (guide)

  - environmental.operating-temp: 0 to 45 C at 900 m (datasheet); 15-35 C long term, 0-45 C short term
  (guide)

  - features.breakout: each QSFP28 splits to 4x25G; system maximum 168 x 10/25GbE, physically 128 x 50GbE
  or 64 x 100GbE (datasheet)

  - features.optics-qsfp28: guide Port Description: 100GBASE-CR4/SR4/LR4 and 40GBASE-CR4/SR4/LR4, any
  QSFP28-compliant module up to 5 W; qualified list Avago AFBR-89CDDZ and Innolight TR-FC85S-N00 (100GBASE-SR4),
  Molex and TE DAC at 1, 3 and 5 m

  - features.optics-sfp-plus: 10GbE (guide Port Description); no module list

  - features.transceiver-power: QSFP28 modules up to 5 W; DAC to 5 m (guide) or 3 m (datasheet)

  - lifecycle.eol: none-announced

  - management.console: RJ-45 serial, 9600 and 115200 baud, 8-N-1; cable G400-10199-01 RJ45 to DB9

  - management.usb: USB 2.0 host, Type A, not for charging

  - performance.latency: low-latency cut-through mode support

  - performance.packet-buffer: 70 MB

  - performance.switching-capacity: 6.4 Tbps

  - platform.bmc: BMC with 1 GB DDR4, dual 32 MB flash, NC-SI shared management port, IPMI 2.0

  - platform.cpu: Intel Denverton / Hewitt Lake-DE, 4 or 8 core, on a COM-Express module

  - platform.memory: up to 32 GB ECC DDR4

  - platform.nos-installer: ONIE

  - platform.storage: up to 1 TB M.2 SSD

  - power.input-ac: AC 47-63 Hz, 100~127 V / 200~240 V nominal (datasheet); 100-240 VAC (guide)

  - power.input-hvdc: 240 VDC, China only (guide)

  - power.power-envelope: unstated

  - thermal.fans: 3+1 redundant hot-swap fan trays, front-to-back or back-to-front (four in the standard
  configuration)


