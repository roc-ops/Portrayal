comments: 'Celestica DS6001 - 2OU Open Rack v3, 64-port 1.6TbE OSFP224 hybrid liquid-cooled data centre
  switch on a Broadcom Tomahawk 6 (102.4 Tbps), fed from the rack''s 48 VDC bus bar. The front is a black
  bezel with two banks of eight OSFP224 columns, four rows each (two belly-to-belly pairs), the system
  lamps, USB-C console and reset in the gutter between the banks, 1PPS/10 MHz, MGMT, USB, CPU and BMC
  consoles and ToD at the left and two stacked SFP56 management ports (numbered 65 and 66) at the right.
  The rear carries a liquid quick-disconnect pair at each end, four fan modules (3+1) in two pairs, and
  the ORv3 bus-bar connector in the middle. No installation guide exists; this is a DRAFT from the datasheet
  and vendor renders whose only square-on images fail the aspect gate.


  Configuration `base`: R4116-F9002-A1 - DS6001, 2OU, 64 x 1.6TbE, COMe 8C / 64 GB DDR4 / 256 GB SSD.
  The only order code; the earlier STORDIS datasheet rev 100925 prints the same code with 32 GB.


