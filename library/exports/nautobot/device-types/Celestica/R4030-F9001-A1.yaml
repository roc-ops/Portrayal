comments: 'Celestica DS4101 - a 1RU 32-port 800G data-centre switch on a Broadcom Tomahawk 4-100 (25.6
  Tbps): thirty-two OSFP ports in four blocks of four stacked columns across a black front panel, with
  the system lamps and one silver housing stacking an RJ45 console, a USB 3.0 Type-A and an RJ45 1000BASE-T
  management port at the LEFT end, and a stacked pair of 10G SFP+ cages (M1/M2) at the right. The rear
  carries two 2000 W hot-swap AC supplies at the ends and seven hot-swap black fan modules between them
  (6+1). The mirror image of its sibling celestica/ds4100''s layout, which puts the management housing
  at the right.


  Configuration `ac-f2b`: Two 2000 W AC supplies and seven fan modules, front-to-back - the only airflow
  the DS4101 is sold in - with the COMe 4C / 32 GB DDR4 / 128 GB SSD control plane (R4030-F9001-A1).


