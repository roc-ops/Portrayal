comments: 'Celestica DS5000 - a 2RU 64 x 800G OSFP data centre and AI fabric switch on a Broadcom Tomahawk
  5 (51.2 Tbps) with an Intel Xeon D COM Express CPU and an optional BMC. All sixty-four OSFP cages are
  on the FRONT in TWO BANKS of sixteen stacked columns, the columns GANGED IN FOURS - four shells of four
  per bank - and numbered DOWN EACH COLUMN ACROSS BOTH BANKS: column 1 carries ports 1 and 2 in the upper
  bank and 3 and 4 in the lower. Each column has a legend row of four round lamps between `(up) N` and
  `N+1 (down)`, above the upper bank and below the lower. At the right of the wall sit a console and a
  management RJ-45 on their sides in one shell, a USB 3.0 Type-A, a reset button, two SFP28 ports numbered
  65 and 66 with four triangular lamps between them, and four system lamps (STAT, ALM, PSU, FAN). The
  rear carries FOUR 2000 W supplies, two stacked at each end, and THREE fan modules between them; the
  front panel is black and the rear and body bright metal.


  Configuration `ac-f2b`: The one ordering code the datasheet lists: 2U, 64 x 800GbE, COM Express 4-core
  CPU, 32 GB DDR, 128 GB SSD, front-to-back airflow. This is a fixed switch, so the base configuration
  is the box as it is bought - four 2000 W supplies and three fan modules in, as the rear elevation draws
  them, and the cages empty.


  Facts carried in the model that this schema has no field for:

  - compliance.emc: CE EMC, VCCI, FCC, ICES003

  - compliance.safety: UL, CB, CCC

  - environmental.humidity: 5% to 85% non-condensing

  - environmental.mtbf: in excess of 150,000 hours

  - environmental.operating-temp: 0 to 40 C (front-to-back airflow)

  - features.breakout: guide, System Breakout Capabilities: 1 x 800G, 2 x 400G, 4 x 200G, 2 x 200G, 8
  x 100G, 1 x 400G and 4 x 100G modes; odd-numbered front ports support up to 8x breakout and even-numbered
  up to 2x ("due to ASIC limitation").

  - features.optics-osfp: OSFP 800G optics and DAC: up to 20 W / 30 W transceivers, up to 4 m DAC, ZR/ZR+
  coherent modules supported; up to 16 ports of 30 W optics on ports 1, 5, 9, 13, 49, 53, 57, 61 (upper
  row) and 4, 8, 12, 16, 52, 56, 60, 64 (bottom row). Tested in the guide''s breakout table: OSFP 2x FR4
  (dual duplex LC), OSFP 2x VR4 and 2x DR4 (dual MPO-8), OSFP DR8 (MPO-16) and a 400G OSFP AOC.

  - features.optics-sfp28: SFP28 25G optics; the guide notes 1G transceivers are supported once speed
  and FEC are configured. No SFP28 module is listed in the tested table.

  - features.timing: IEEE 1588 1-step and 2-step time stamping; transparent and boundary clock; SyncE
  clock recovery (timing option)

  - lifecycle.eol: none-announced

  - performance.switching-capacity: 51.2 Tbps IO bandwidth

  - physical.weight-note: 30 kg (datasheet and guide spec table; configuration not stated)

  - platform.bmc: optional BMC system management - RunBMC, OpenBMC

  - platform.cpu: Intel Xeon D x86, 4-core (up to 8-core), 2.9 GHz, COM Express

  - platform.memory: 2 x 16 GB DDR4 with ECC

  - platform.software: SONiC; ONIE; ONL; Redfish

  - platform.storage: 128 GB / 256 GB M.2 SSD

  - platform.switch-silicon: Broadcom StrataXGS Tomahawk 5

  - power.power-draw-max-w: 4000

  - power.power-input: 100-240 VAC auto-ranging 47-63 Hz, or 180-300 VDC auto input


