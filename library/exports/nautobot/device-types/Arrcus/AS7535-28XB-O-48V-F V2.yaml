comments: 'Arrcus lists Edgecore AS7535-28XB-O-48V-F V2 (NOS: arcos).

  Listed per: Arrcus Hardware Compatibility List (External), June 2026, for ArcOS 8.5 - page 3, under
  Routing (DNX), the row ''CSR440 / AS7535-28XB''.


  24x 25G SFP28, 2x 100G QSFP28 and 2x 400G QSFP-DD cell site router, sold as the CSR440, Broadcom BCM88843
  Qumran-2A with an Intel Xeon D-1539. Ports and both supplies on the front, six hot-swappable fan modules
  on the REAR - the only device in this family with that split. An SMA GNSS input, SMB timing jacks, BITS
  and ToD RJ-45s, an alarm jack, a USB-C for storage and a micro-USB console. Ports number 1-28, the optics
  first.


  Configuration `dc`: Two hot-swappable DC supplies (-44 to -60 V, 15.5-9.6 A each) and the same six rear
  fan modules - the datasheet''s one DC ordering row. DRAWN WITH THE AC SUPPLY''S FACE, because neither
  document pictures the DC module; the build is declared so a tool filtering by feed finds it, and the
  wrong face is the dc-power-supply gap.


  Also sold or listed as: CSR440, AS7535-28XBE


