comments: "Arrcus lists UfiSpace S9321-64EO (NOS: arcos).\nListed per: Arrcus Hardware Compatibility List\
  \ (External), June 2026, for ArcOS 8.5 - page 2, under Switching (XGS), the row 'S9321-64EO'.\n\nUfiSpace\
  \ S9321-64EO 800G AI/ML data center switch - 2RU white box, 64x OSFP 200/400/800G in four rows of sixteen\
  \ plus a stacked SFP28 management pair, 1PPS and 10MHz SMB timing inputs and an RJ45/micro-USB console,\
  \ Broadcom Tomahawk 5 at 51.2 Tbps; four hot-swap fans (3+1) and dual 3000W PSUs (1+1) at the rear,\
  \ orderable in AC or DC, front-to-back airflow only. The OSFP faceplate is what separates this from\
  \ the S9321-64E, which is the same chassis with 64 QSFP-DD\n\nDatasheet: UfiSpace S9321-64EO 800G AI/ML\
  \ Data Center Switch Datasheet\n  https://www.ufispace.com/products/datacenter/800g/s9321-64eo\n\nFacts\
  \ carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15, Subpart B,\
  \ Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386; EN 55035; VCCI CISPR 32, Class A\n- compliance.environment:\
  \ WEEE\n- compliance.installation: restricted-access server or computer room only; suitable for Information\
  \ Technology Rooms per Article 645 of the National Electrical Code and NFPA 75\n- compliance.nebs: NOT\
  \ A CERTIFICATION - the HIG carries 'Cautions and regulatory compliance statements for NEBS': suitable\
  \ for installation as part of the Common Bonding Network (CBN); an external Surge Protection Device\
  \ must be used with AC powered equipment, installed at the AC power service entrance; can be installed\
  \ in Network Telecommunications Facilities where the National Electric Code applies; the DC input terminals\
  \ are DC-I (isolated DC return) and the RTN terminal should be isolated from the chassis or rack; the\
  \ intra-building OOB Ethernet port is suitable for connection to intra-building or unexposed wiring\
  \ only (Type 2, 4 or 4a per GR-1089). No NEBS level is claimed anywhere in the held documents\n- compliance.safety:\
  \ UL 62368-1; IEC 62368-1\n- environmental.operating-humidity: 5 to 95% RH non-condensing\n- environmental.operating-temp:\
  \ 0 to 40 C\n- environmental.storage-humidity: 5 to 95% RH non-condensing\n- environmental.storage-temp:\
  \ -40 to 70 C\n- features.optic-power-classes: sixteen ports take a 30 W optic and the other forty-eight\
  \ take 16 W (HIG Figure 9). The 30 W ports are 0, 6, 8, 14, 16, 22, 24, 30, 33, 39, 41, 47, 49, 55,\
  \ 57 and 63 - the first and fourth cage rows of columns 1, 4, 5, 8, 9, 12, 13 and 16 counting from the\
  \ left\n- features.optics-osfp: 800GE OSFP OpenZR+/ZR/2xLR4/2xFR4/DR8+/DR8/SR8 and 400GE OSFP OpenZR+/ZR/ER4/LR4/FR4/SR8/DR4/DR4+/PLR4\
  \ (datasheet compatible transceiver list); the HIG port table gives ports 0~63 as 400G/800G up to 2\
  \ km\n- features.optics-sfp28: 1G/10G/25G on the management pair, up to 40 km per the HIG Port Overview\
  \ table; the datasheet calls the same pair '2 x 10/25G SFP28 ports' and no module list is published\
  \ for it\n- features.timing: 1PPS and 10MHz SMB input/output (premium), 50 ohm, cable not to exceed\
  \ 3 m; Stratum 3E OCXO holdover and ITU-T Synchronous Ethernet (SyncE). The datasheet's compatible cable\
  \ row names 'SMB coaxial cable with 10-32UNF-2A connector for 1PPS and 10MHz', and the HIG offers a\
  \ converter where the far end is BNC\n- lifecycle.eol: none-announced\n- management.console: RJ45 RS-232\
  \ and micro-USB, both labelled IOIO, 115200 8N1 no flow control; the micro-USB needs a Silicon Labs\
  \ CP210x driver (HIG Initial System Setup)\n- management.oob: 1x RJ45 100/1000M plus the 2x SFP28 management\
  \ pair\n- performance.packet-buffer: 165.2 MB\n- performance.switching-capacity: 51.2 Tbps\n- platform.asic:\
  \ Broadcom Tomahawk 5 BCM78900\n- platform.bmc: Aspeed AST2620\n- platform.cpu: Intel Xeon-D 4-core\
  \ @ 1.9 GHz\n- platform.memory: 32 GB DDR4\n- platform.storage: 1x 128 GB M.2 SSD\n- power.input-ac:\
  \ 200 to 240 V, 16 A per feed\n- power.input-dc: -40 to -72 V, 80 A per feed\n- power.power-envelope:\
  \ bare\n- power.power-max-dc-w: 2279\n- power.power-max-scope: HIG Connecting Power - measured at 40\
  \ C ambient, optics fully populated and 100% traffic load; 2545 W is the AC figure and 2279 W the DC\
  \ one\n- power.power-max-w: 2545\n- power.power-typical-w: 925\n- power.psu-redundancy: 1+1 active-active\
  \ hot-swappable\n- thermal.airflow: front-to-back only\n- thermal.fan-redundancy: 3+1 hot-swappable\n\
  \nDrawing version 1.0.13. A major bump means a slot moved or an id was renamed, so anything cached from\
  \ an earlier export may no longer line up.\nModel maturity: modelled. Every dimension in the source\
  \ records where it came from."
