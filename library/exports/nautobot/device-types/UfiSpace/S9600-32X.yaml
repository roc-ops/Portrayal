comments: "UfiSpace S9600-32X open aggregation router - 2RU disaggregated white box on Broadcom Qumran2c\
  \ with 2.4 Tbps of switching and 4 GB of deep buffer, carrying 32x QSFP28 40/100G in eight two-high\
  \ stacked columns plus 4x SFP28 1/10/25G that break out from 100G port 0, and a full timing block (GNSS\
  \ on SMA, 1PPS and 10MHz on SMB, ToD on RJ45, Stratum 3E OCXO, SyncE, 1588v2 Class C and TSN); four\
  \ hot-swap fans (3+1) and dual 1600W supplies (1+1) at the rear\n\nConfiguration `base`: The router\
  \ as HIG Figure 7 draws it - four FAN-803816-HI exhaust fans and two PSU-162-AESR 1600 W AC supplies\
  \ at the rear, and the thirty-six traffic ports empty. No orderable chassis part number appears in any\
  \ held document; see the chassis-sku gap.\n\nDatasheet: UfiSpace S9600-32X Open Aggregation Router datasheet\n\
  \  https://www.ufispace.com/products/telco/aggregation/s9600-32x-25g-100g-aggregation-router\n\nFacts\
  \ carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15, Subpart B,\
  \ Class A; ICES-003, Class A; EN 55032, Class A; EN 55024; EN 55035; EN 62479; EN 50663; EN 300 386;\
  \ EN 301 489; EN 303 413; BSMI; VCCI CISPR 32, Class A\n- compliance.environment: ETSI 300 132-2; ETSI\
  \ 300 019; RoHS; WEEE\n- compliance.safety: UL 62368-1; IEC 62368-1; IEC 60950-1; BSMI\n- environmental.operating-humidity:\
  \ 5 to 85% RH non-condensing\n- environmental.operating-temp: 0 to 45 C\n- environmental.storage-humidity:\
  \ 5 to 93% RH non-condensing\n- environmental.storage-temp: -40 to 70 C\n- features.breakout: the four\
  \ SFP28 ports break out from 100G port 0; enabling them disables port 0\n- features.compliance-programme:\
  \ IEEE 802.1CM fronthaul; ITU-T G.8273.2 T-BC Class C\n- features.gnss: internal receiver for master\
  \ clock implementations, supporting GPS/QZSS L1 C/A, GLONASS L10F, BeiDou B1, SBAS L1 C/A (WAAS, EGNOS,\
  \ MSAS, GAGAN) and Galileo E1B/C at a minimum RF sensitivity of -166 dBm; passive and active antennas\
  \ are auto-detected and an active antenna is fed up to 5 V DC / 150 mA\n- features.optics-qsfp28: 100G\
  \ QSFP28 SR4/LR4/ER4/ZR4, up to 40 km\n- features.optics-sfp28: 25G SFP28 SR/LR/ER and 10G SFP+ SR/LR/ER,\
  \ up to 40 km\n- features.routing: full Segment Routing over IPv6 (SRv6)\n- features.timing: Stratum\
  \ 3E OCXO with optional holdover; ITU-T Synchronous Ethernet (SyncE); IEEE 1588v2 default, G.8265.1,\
  \ G.8275.1, G.8275.2, SMPTE ST 2059-2 (additional licence), T-GM, T-BC/OC, T-TC; Time Sensitive Networking\
  \ (TSN); Class C timing accuracy. NOS integration is required to activate the specific feature, which\
  \ the datasheet states with an asterisk against the whole block\n- features.timing-interfaces: GNSS\
  \ in on SMA; 1PPS in/out on SMB; 10MHz in/out on SMB; ToD in/out on RJ45. Cable types the datasheet\
  \ specifies: 50 ohm SMA coax with a 1/4-36UNS-2B connector for GNSS, 50 ohm SMB coax with a 10-32UNF-2A\
  \ connector for 1PPS and 10MHz, shielded RJ45 for ToD\n- lifecycle.eol: none-announced\n- management.console:\
  \ RJ45 RS-232 at 115200 8N1 plus a micro-USB serial console (CP210x)\n- management.oob: 1x RJ45 100/1000M\
  \ management port\n- management.service-port: 1x USB 3.0 Type-A maintenance port\n- performance.packet-buffer:\
  \ 4 GB deep buffer\n- performance.switching-capacity: 2.4 Tbps\n- platform.asic: Broadcom Qumran2c BCM88820\n\
  - platform.bmc: ASPEED AST2400\n- platform.cpu: Intel Skylake-D 8-core @ 1.9 GHz\n- platform.memory:\
  \ 32 GB DDR4\n- platform.storage: 128 GB SSD\n- power.input-ac: 100 to 240 V, 13 A\n- power.input-dc:\
  \ -40 to -72 V, 50 A\n- power.power-envelope: bare\n- power.power-max-scope: 45 C, optics fully populated,\
  \ 100% traffic load (HIG, both builds)\n- power.power-max-w: 621.3\n- power.power-typical-w: 335\n-\
  \ power.psu-redundancy: 1+1 hot-swappable\n- thermal.airflow: front-to-back (exhaust fans and supplies\
  \ at the rear)\n- thermal.fan-redundancy: 3+1 hot-swappable\n\nDrawing version 2.0.11. A major bump\
