  \ ports carry switching cells between S9700-series line-card boxes rather than customer traffic, and\
  \ the vendor prints their numerals in magenta to say so. Two 10G SFP+ management uplinks, an Intel Ice\
  \ Lake 4-core with an AST2620 BMC, 1+1 hot-swap 3000W AC or DC PSUs, 3+1 hot-swap fans, front-to-back\
  \ airflow. Sold by DriveNets as the NCF-64E fabric element of the DDC Network Cloud.\n\nConfiguration\
  \ `ac`: Dual 3000W AC PSUs (PSU-302-AESR) 1+1, four FAN-808012-HCE fan modules 3+1, front-to-back airflow\
  \ - the build HIG Figure 4's rear elevation, HIG Figure 5 and the vendor rear photograph all show\n\n\
