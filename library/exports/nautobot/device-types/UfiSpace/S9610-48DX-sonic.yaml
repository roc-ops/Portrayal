comments: "UfiSpace S9610-48DX 100G/400G open disaggregated aggregation router - 2RU white box on Broadcom\
  \ Qumran2c+ BCM88840 at 7.2 Tbps with an 8 GB deep buffer, 40x QSFP28 40/100G in four blocks of five\
  \ two-high columns, 8x QSFP-DD 100/400G with 400ZR/OpenZR+ in two 2x2 assemblies in the middle, 4x SFP28/SFP-DD\
  \ 1/10/25G that share in-band with 100GE port 0, and a separate quad of 10G SFP+ management ports; a\
  \ full timing block (GNSS on SMA, 10MHz and 1PPS on SMB, ToD on RJ45 and BITS on RJ48) with a Stratum\
  \ 3E OCXO and Class C 1588v2, MACsec on all ports and SRv6; four hot-swap fans (3+1) and dual 2000 W\
  \ PSUs (1+1) at the rear, orderable AC or DC, exhaust airflow\n\nConfiguration `ac`: The chassis as\
  \ the datasheet's own rear product photograph shows it - four FAN-808012-HCE exhaust fans and two PSU-202-AESR\
  \ 2000 W AC supplies with IEC C20 inlets and red latches, front-to-back airflow, and the fifty-six traffic\
  \ and management ports empty. The HIG rates the feed at 200-240 V and notes that on a single 110 VAC\
  \ source each supply delivers 1000 W. No orderable chassis part number appears in any held document;\
  \ see the chassis-variants gap.\n\nDatasheet: UfiSpace S9610-48DX 7.2T 100G/400G Open Aggregation Router\
  \ Datasheet\n  https://www.ufispace.com/products/telco/aggregation/s9610-48dx-100g-400g-open-aggregation-router\n\
  \nFacts carried in the model that this schema has no field for:\n- performance.switching-capacity: 7.2\
  \ Tbps\n- performance.packet-buffer: 8 GB\n- power.power-typical-w: 548\n- power.power-max-w: 1524\n\
  - power.power-envelope: bare\n- power.input-ac: 200 to 240 V, 12.5 A\n- power.input-dc: -40 to -72 V,\
  \ 60 A\n- power.psu-redundancy: 1+1 hot-swappable\n- thermal.fan-redundancy: 3+1 hot-swappable\n- thermal.airflow:\
  \ front-to-back (exhaust fans and exhaust PSUs)\n- environmental.operating-temp: 0 to 45 C\n- environmental.operating-humidity:\
  \ 5 to 85% RH non-condensing\n- environmental.storage-temp: -40 to 70 C\n- environmental.storage-humidity:\
  \ 5 to 93% RH non-condensing\n- platform.asic: Broadcom Qumran2c+ BCM88840\n- platform.cpu: Intel Icelake-D\
  \ 12-core @ 1.8 GHz\n- platform.memory: 64 GB DDR4\n- platform.storage: 2x 256 GB SSD\n- platform.bmc:\
  \ Aspeed AST2620\n- platform.oem-alias: DriveNets NCP-40C8CD (Network Cloud Packet forwarder, 4x1/10\
  \ + 40x100 + 8x400). NOT A UFISPACE CLAIM - no UfiSpace document mentions DriveNets. The mapping is\
  \ internal analysis: the okf `drivenets-ddc` bundle's 'DriveNets NCF/NCP to white-box hardware map (shipping\
  \ platforms)' matches the roadmap slide's NCP-40C8CD (Q2C+ 7.2T) to this chassis on published silicon\
  \ and port configuration. Recorded so a search for either name finds this box; no DriveNets figure or\
  \ artwork is transcribed anywhere in this file.\n- features.timing: Stratum 3E OCXO, ITU-T SyncE, IEEE\
  \ 1588v2 (default, G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2 with an additional licence), T-GM,\
  \ T-BC/OC, T-TC, Class C timing accuracy; NOS integration is required to activate any of it\n- features.gnss:\
  \ integrated receiver covering GPS/QZSS L1 C/A, GLONASS L1OF, BeiDou B1, SBAS L1 C/A (WAAS, EGNOS, MSAS,\
  \ GAGAN) and Galileo E1B/C, RF sensitivity -166 dBm; passive and active antennas are both supported\
  \ and auto-detected (HIG Installing an Antenna)\n- features.antenna: an active GNSS antenna needs 50\
  \ ohm impedance matching, 5 V DC, a noise figure of 1.5 dB maximum and an internal LNA gain of 35-42\
  \ dB; the port supplies up to 5 V DC / 150 mA and a surge protector is required (HIG Installing an Antenna)\n\
  - features.macsec: MACsec on all ports (datasheet feature list)\n- features.srv6: full Segment Routing\
  \ over IPv6 (datasheet feature list)\n- features.tcam: TCAM option available to meet diverse deployment\
  \ requirements (datasheet)\n- features.optics-qsfp-dd: 400G QSFP-DD SR/LR/ER/ZR/OpenZR+ (datasheet Compatible\
  \ Transceivers)\n- features.optics-qsfp28: 100G QSFP28 SR/LR/ER/ZR/OpenZR+, up to 80 km; 40G\n- features.optics-sfp28:\
  \ 25G SFP28 SR/LR; 10G SFP+ SR/LR, up to 40 km\n- features.optics-sfp-plus: the four SFP+ management\
  \ ports take 10G SFP+ SR/LR from the datasheet's Compatible Transceivers list; no separate reach or\
  \ media list is published for this block - the HIG's Port Overview table does not cover it at all (see\
  \ the sfp-plus-management-role gap)\n- features.sfp28-sharing: the four SFP28/SFP-DD ports are in-band\
  \ port share with 100GE port 0 (datasheet)\n- features.timing-cable: 50 ohm SMA coaxial with a 1/4-36UNS-2B\
  \ connector for GNSS, 50 ohm SMB coaxial with a 10-32UNF-2A connector for 1PPS and 10MHz, shielded RJ45\
  \ for ToD and shielded RJ48 for BITS, none longer than 3 m (datasheet Compatible Timing Cable Types;\
  \ HIG section 12)\n- management.console: RJ45 RS-232 plus a micro-USB serial console\n- management.oob:\
  \ 1x RJ45 100/1000M\n- management.sfp-plus-management: 4x 10G SFP+ management ports, numbered 0-3 in\
  \ their own space\n- management.timing-interfaces: GNSS in on SMA, 10MHz in/out on SMB, 1PPS in/out\
  \ on SMB, ToD in/out on RJ45, BITS in/out on RJ48\n- compliance.safety: UL 62368-1; IEC 62368-1\n- compliance.emc:\
  \ FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386; EN 301 489; EN\
  \ 303 413; EN 55035; EN 62479; EN 50663; VCCI CISPR 32, Class A; NEBS GR-1089\n- compliance.environment:\
  \ NEBS GR-63; WEEE\n- lifecycle.eol: none-announced\n\nDrawing version 1.0.0. A major bump means a slot\
