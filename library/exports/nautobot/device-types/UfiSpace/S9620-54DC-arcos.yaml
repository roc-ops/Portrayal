comments: "UfiSpace S9620-54DC 400G open aggregation router - a 1RU 440 x 480 mm white box on Broadcom\
  \ Qumran3u BCM88400 at 1.2 Tbps with 4 GB of deep buffer, carrying 54 ports on one face: forty 1/10/25G\
  \ SFP28 and eight 1/10/25/50G SFP56 in twenty-four belly-to-belly ganged columns, then four 100G and\
  \ two 400G QSFP-DD in three more. A timing block down the left edge takes a GNSS SMA, 1PPS and 10MHz\
  \ SMB and a ToD RJ45 against a Stratum 3E OCXO with SyncE, 1588v2 and an internal GNSS receiver; the\
  \ management RJ45, serial console and USB 3.0 the datasheet lists appear nowhere on this face. Five\
  \ hot-swap fans (4+1) and dual 750 W supplies (1+1) at the rear, orderable AC or DC, front-to-back\n\
  \nConfiguration `base`: Five FAN-405636-HD exhaust fans and two PSU-751-DESR-1C 750 W DC supplies, front-to-back,\
  \ with all fifty-four ports empty. WHICH SUPPLY SHIPS AS THE BASE IS NOT KNOWN: both are orderable and\
  \ no held image shows either one seated, because UfiSpace publishes no rear view of this model. The\
  \ DC unit is seated arbitrarily; see the base-configuration-supply gap. No orderable chassis part number\
  \ appears in any held document.\n\nDatasheet: UfiSpace S9620-54DC 400G Open Aggregation Router Datasheet\
  \ (rev 20260811V01)\n  https://www.ufispace.com/products/telco/aggregation/s9620-54dc-400g-open-aggregation-router\n\
  \nFacts carried in the model that this schema has no field for:\n- performance.switching-capacity: 1.2\
  \ Tb/s\n- performance.deep-buffer: 4 GB\n- power.power-typical-w: 125\n- power.power-envelope: bare\n\
  - power.input-ac: 100 to 240 V, 10 A\n- power.input-dc: -40 to -75 V, 28 A\n- power.psu-redundancy:\
  \ 1+1 hot-swappable\n- thermal.fan-redundancy: 4+1 hot-swappable\n- thermal.airflow: front-to-back\n\
  - environmental.operating-temp: -40 to 65 C\n- environmental.operating-humidity: 5 to 85% RH non-condensing\n\
  - environmental.storage-temp: -40 to 70 C\n- environmental.storage-humidity: 5 to 93% RH non-condensing\n\
  - platform.asic: Broadcom Qumran3u BCM88400\n- platform.cpu: Intel Xeon D 4-core @ 2.4 GHz (Standard)\
  \ or 8-core @ 1.9 GHz (Premium)\n- platform.memory: 2x 16 GB DDR4 SO-DIMM with ECC (Standard) or 2x\
  \ 32 GB (Premium)\n- platform.storage: 1x 160 GB SSD (Standard) or 2x 160 GB SSD with VROC RAID (Premium)\n\
  - platform.bmc: Aspeed AST2620\n- platform.oscillator: Stratum 3E OCXO\n- features.optics-sfp28: 25G\
  \ SFP28 SR/LR/ER; 10G SFP+ SR/LR/ER; 1G SFP SX/LX (datasheet compatible transceiver list)\n- features.transceivers-sfp56:\
  \ 50G SFP56 SR/LR/ER (datasheet compatible transceiver list). Recorded under this key rather than the\
  \ house `optics-sfp56` because `sfp56` is not yet one of the pluggable-cage media tokens the L40 harvest\
  \ recognises, and an `optics-` key that joins to no group is worse than one filed plainly\n- features.optics-qsfp-dd:\
  \ 400G QSFP-DD OpenZR+/ZR/ER4/LR4/FR4/SR8/DR4/DR4+; 100G QSFP-DD ZR+/DR4/LR4; 100G QSFP28 ZR4/ER4/LR4\
  \ (datasheet compatible transceiver list)\n- features.coherent: the platform is optimised for 400ZR\
  \ and OpenZR+ coherent optics for direct metro aggregation without external transponders (datasheet\
  \ Key Benefits); which of the six QSFP-DD ports accept them is not stated\n- features.macsec: hardware-based\
