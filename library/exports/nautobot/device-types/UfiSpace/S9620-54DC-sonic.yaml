  \ recognises, and an `optics-` key that joins to no group is worse than one filed plainly\n- features.tsn:\
  \ Time Sensitive Networking for low packet loss and low delay variation\n- lifecycle.eol: none-announced\n\
  - management.console: RJ45 serial console (datasheet port list; not on the front face)\n- management.oob:\
