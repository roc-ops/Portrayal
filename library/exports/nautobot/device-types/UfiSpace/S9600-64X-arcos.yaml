comments: "UfiSpace S9600-64X Open Aggregation Router - 2RU, 64x QSFP28 40/100G in eight 2x4 ganged blocks\
  \ plus a 4x SFP28 1/10/25G quad that breaks out of QSFP28 port 0, full timing (GNSS/1PPS/10MHz/ToD)\
  \ on a Stratum 3E OCXO, four hot-swap fans and two hot-swap 1600 W supplies at the rear, front-to-back\
  \ airflow\n\nConfiguration `base`: the chassis as it powers on - four fans and two 1600 W AC supplies,\
  \ no optics\n\nDatasheet: UfiSpace S9600-64X 25G/100G Aggregation Router Datasheet\n  https://www.ufispace.com/products/telco/aggregation/s9600-64x-25g-100g-aggregation-router\n\
  \nFacts carried in the model that this schema has no field for:\n- physical.weight-shipping-kg: 34.04\n\
  - performance.switching-capacity: 4.8 Tbps\n- performance.packet-buffer: 8 GB\n- performance.port-modes-qsfp28:\
  \ 40/100G\n- performance.port-modes-sfp28: 1/10/25G\n- performance.optics-qsfp28: 100G SR4/LR4/ER4/ZR4,\
  \ up to 40 km\n- performance.optics-sfp28: 25G SR/LR/ER, 10G SFP+ SR/LR/ER, up to 40 km\n- power.power-typical-w:\
  \ 565\n- power.power-max-dc-w: 1140\n- power.power-max-ac-w: 1160.2\n- power.power-envelope: as-tested\n\
  - power.power-typical-scope: no transceiver installed (datasheet's own qualifier)\n- power.power-max-scope:\
  \ 45 C, optics fully populated, 100% traffic load\n- power.power-reserve-per-circuit-w: 1600\n- power.input-ac:\
  \ 200 to 240 VAC, 10 A\n- power.input-dc: -40 to -72 VDC, 50 A\n- power.single-phase-110v-derating:\
  \ both PSUs run at 1000 W each, 2000 W total, on a single 110 VAC source\n- thermal.airflow: front-to-back\n\
  - thermal.fans: 4 modules, 3+1 redundant, hot-swappable\n- environmental.operating-temp: 0 to 45 C\n\
  - environmental.storage-temp: -40 to 70 C\n- environmental.operating-humidity: 5% to 85% RH, non-condensing\n\
  - environmental.storage-humidity: 5% to 93% RH, non-condensing\n- platform.asic: Broadcom Qumran2c BCM88820\n\
  - platform.cpu: Intel Skylake-D 8-core @ 1.9 GHz\n- platform.memory: 32 GB DDR4\n- platform.storage:\
  \ 128 GB SSD\n- platform.bmc: ASPEED AST2400\n- features.timing: Stratum 3E OCXO, SyncE, IEEE 1588v2\
  \ (G.8265.1, G.8275.1, G.8275.2, T-GM, T-BC/OC, T-TC)\n- features.timing-profiles-licensed: SMPTE ST\
  \ 2059-2 requires an additional license\n- features.timing-interfaces: GNSS SMA in, 1PPS SMB in/out,\
  \ 10MHz SMB in/out, ToD RJ45 in/out\n- features.gnss: internal receiver for master clock implementations\n\
  - features.timing-cables: 50 ohm SMA coax with 1/4-36UNS-2B for GNSS, 50 ohm SMB coax with 10-32UNF-2A\
  \ for 1PPS and 10MHz, shielded RJ45 for ToD\n- features.tsn: Time Sensitive Networking, Class C timing\
  \ accuracy\n- features.srv6: full Segment Routing over IPv6\n- features.breakout: SFP28 ports 0-3 break\
  \ out of QSFP28 port 0; enabling them disables port 0\n- features.nos-required: NOS integration is necessary\
  \ to activate the timing and sync features\n- management.console-serial: 115200 8N1, no parity, no flow\
  \ control\n- management.console-usb-driver: Silicon Labs CP210x USB-to-UART bridge\n- management.boot-time-s:\
  \ 100\n- management.oob-link-time-s: 40\n- compliance.emc: FCC Part 15 Subpart B Class A, ICES-003 Class\
  \ A, EN 55032 Class A, EN 55024, EN 55035, EN 62479, EN 50663, EN 300 386, EN 301 489, EN 303 413, BSMI,\
  \ VCCI CISPR 32 Class A\n- compliance.safety: UL 62368-1, IEC 60950-1, IEC 62368-1, BSMI\n- compliance.environment:\
  \ RoHS, WEEE\n- compliance.nebs: NEBS statements only - the guide carries the Common Bonding Network,\
  \ SPD, DC-I return and intra-building OOB wording, and states no Level. It is not a certification claim\n\
  - lifecycle.eol: none-announced\n\nDrawing version 1.0.0. A major bump means a slot moved or an id was\
  \ renamed, so anything cached from an earlier export may no longer line up.\nModel maturity: modelled.\
  \ Every dimension in the source records where it came from."
