comments: 'Perle IOLAN SCG50 R console server, 1U, with 48 RJ45 RS-232 serial ports in all three of its
  G16 module bays. It has dual AC power and two network pairs of RJ45 and SFP. The front carries the display,
  the keypad, the power button, the ready lamp and the card slot. It also has the RJ45 and micro-USB admin
  ports, two USB 3.0 ports and the reset hole. The rear carries the network pairs at the left, the module
  bays and the two inlets, each with a rocker switch. Modelled as the dual-AC build with no cellular parts,
  as the R/U product page lists none.


  Configuration `ac`: IOLAN SCG50 R, dual AC, with 3 RJ45 RS-232 modules. The six part numbers differ
  by power cord. In the page''s order and labels they are 04033074 USA, 04033071 UK, 04033072 EU, 04033075
  South Africa, 04033076 Australia, 04033078 none.


  Also sold or listed as: IOLAN SCG50 R Console Server


  Rack mounting positions: flush ("front"; as shipped).


  Facts carried in the model that this schema has no field for:

  - environmental.operating-temp-c: 0 to 55

  - features.optics-sfp: SERDES 100/1000Base-X SFP modules, provided by the user (guide page 11) and supplied
  by Perle, Cisco or other makers of MSA-compliant SFPs (guide page 27: "2 SFP slots supporting SERDES
  100/1000Base-X SFP modules")

  - physical.weight-note: R/U product page: 3.59 kg for the SCG50 dual AC chassis; the page weighs by
  chassis size and power type, not by model

  - power.input: ac

  - power.power-input-ac: 100-240 VAC, 50-60 Hz, 1.5 A max (guide page 27)


