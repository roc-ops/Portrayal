comments: 'Perle IOLAN SCG18 R console server, 1U, with 16 RJ45 RS-232 serial ports in the first of its
  three G16 module bays. It has dual AC power and two network pairs of RJ45 and SFP. The front carries
  the display, the keypad, the power button, the ready lamp and the card slot. It also has the RJ45 and
  micro-USB admin ports, two USB 3.0 ports and the reset hole. The rear carries the network pairs at the
  left, the module bays and the two inlets, each with a rocker switch. Modelled as the dual-AC build with
  no cellular parts, as the R/U product page lists none.


  Configuration `ac`: IOLAN SCG18 R, dual AC, with 1 RJ45 RS-232 module. The six part numbers differ by
  power cord. In the page''s order and labels they are 04032834 USA, 04032831 UK, 04032832 EU, 04032835
  South Africa, 04032836 Australia, 04032838 none.


  Also sold or listed as: IOLAN SCG18 R Console Server


  Rack mounting positions: flush ("front"; as shipped).


