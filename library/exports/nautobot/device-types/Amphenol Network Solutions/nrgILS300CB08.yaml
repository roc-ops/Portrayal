comments: "1RU dual-feed -48 V DC circuit breaker panel with nrgILS intelligent load shedding: the 300CB08\
  \ breaker layout with a controller that measures feed and per-circuit current and voltage and can switch\
  \ each output circuit off and on through a solid-state switch, on a schedule, on a failed ping or by\
  \ hand. Front display, web interface, REST API and SNMP over Ethernet; IN and OUT nrgNET jacks link\
  \ it to further panels. Vertical dual-stud inputs and screw terminal-block outputs. Two isolated sides,\
  \ each fed at up to 325 A and each distributing to eight plug-in breaker positions of up to 60 A.\n\n\
  Configuration `base`: The panel as it ships: no breakers, and a blanking cover over every position.\
  \ Breakers are sold separately.\n\nDatasheet: Amphenol Network Solutions nrgILS300CB08 nrgSMART Intelligent\
  \ Load Shedding data sheet, 08.10.26 v.5\n  https://amphenol-ns.com/Assets/P_DS_nrgILS300CB08.pdf\n\n\
  Facts carried in the model that this schema has no field for:\n- compliance.nebs: Level 3\n- compliance.safety:\
  \ UL Listed\n- environmental.operating-temp: to 70 C - 325 A per panel at 45 C, de-rated to 200 A at\
  \ 70 C; no lower limit is stated\n- features.ethernet: one Ethernet connection, 10/100/1000 with PoE,\
  \ in the datasheet (gap ethernet-ports)\n- features.load-shedding: per-circuit solid-state switching\
  \ under software control: scheduled on/off, power cycle after failed pings, manual override; a DIP switch\
  \ per circuit forces it on\n- features.monitoring: feed and per-circuit voltage and current; one analog\
  \ (nrgTEMP) and one digital I2C (nrgILSTEMP) temperature probe\n- lifecycle.eol: none-announced\n- management.alarm-contacts:\
  \ Form C relay per side, 2 A at 30 VDC and 0.6 A at 60 VDC, on wire-wrap terminals\n- management.interfaces:\
  \ HTTPS web interface, REST API, SNMP v1, v2c and v3, SNTP, syslog; IPv4 and IPv6\n- physical.mounting:\
  \ 19 inch brackets included; 23 inch brackets sold separately\n- physical.overall-mm: 431.8 x 44 x 387.9\
