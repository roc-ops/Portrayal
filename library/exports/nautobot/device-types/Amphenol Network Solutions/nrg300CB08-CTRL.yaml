comments: "1RU dual-feed DC circuit breaker panel with an integrated nrgSMART controller: the 300CB08\
  \ with a controller card that measures feed and per-circuit current and voltage, shows them on a front\
  \ display, serves a web interface and SNMP on its LAN port, and collects up to 30 sensor panels over\
  \ nrgNET. Vertical dual-stud inputs and screw terminal-block outputs. Two isolated sides, each fed at\
  \ up to 325 A and each distributing to eight plug-in breaker positions of up to 60 A.\n\nConfiguration\
  \ `base`: The panel as it ships: no breakers, and a blanking cover over every position. Breakers are\
  \ sold separately.\n\nDatasheet: Amphenol Network Solutions 300CB08/nrg300CB08 8/8 Position Circuit\
  \ Breaker Panel data sheet, 07.11.24 v.20\n  https://amphenol-ns.com/Assets/P_DS_300CB08.pdf\n\nFacts\
  \ carried in the model that this schema has no field for:\n- compliance.nebs: Level 3\n- compliance.safety:\
