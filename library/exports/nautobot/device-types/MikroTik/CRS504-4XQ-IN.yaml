comments: 'MikroTik CRS504-4XQ-IN is a fixed 1U indoor Cloud Router Switch, 320 mm wide with rack ears
  in the box, with four 100 Gigabit QSFP28 cages, a 100 Megabit management port that also takes PoE in,
  an RJ45 serial console, a DC jack and a two-pin DC terminal (both drawn as chassis art, see the gaps),
  and runs RouterOS v7. Everything but the fans is on the front: two hot-swap AC supply modules with their
  C14 inlets at the left, the four QSFP28 cages under a vent, the console over the management port, RESET,
  the two DC inputs and three status lamps. Two round fan guards and an earthing stud are on the rear.
  The brochure prints no part number for the supplies, so they are part of the chassis and there are no
  bays.


