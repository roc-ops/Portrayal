comments: 'MikroTik CRS326-24S+2Q+RM is a fixed 1U Cloud Router Switch. It has 24 SFP+ cages and two 40G
  QSFP+ cages. It also has a 10/100 management and boot port, an RJ45 serial console and a USB type A
  port. It runs RouterOS or SwOS. The front carries the 24 SFP+ cages in three blocks of four columns
  by two rows. They are numbered 1 to 24 as printed, with the odd number on the lower cage of a column.
  The two QSFP+ cages are 1 and 2, stacked with the odd number below. Right of them are the CONSOLE and
  MGMT/BOOT jacks, the RESET button, the USB port and the USER, FAULT, PWR 2 and PWR 1 lamps. The rear
  carries two AC inlets (POWER 1 and POWER 2, 100-240 V) and three fans. The power supplies and the fans
  are built into the chassis, so there are no bays.


  Configuration `base`: CRS326-24S+2Q+RM - 24 SFP+ cages, two QSFP+ cages, the management and boot jack,
  the RJ45 console and a USB type A port. The box holds two IEC cords, rack ears and the K10 screw and
  feet kit.


  Rack mounting positions: flush (ears level with the face; as shipped).


