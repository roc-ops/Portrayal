comments: 'MikroTik CRS309-1G-8S+IN is a compact Cloud Router Switch, 272 mm wide. It has eight SFP+ cages,
  one 10/100/1000 Ethernet port that takes PoE in, and a DE-9 serial console. It runs SwOS or RouterOS
  (dual boot). The front carries the eight cages with an ACT and a 10G lamp above each. Beside them are
  the POE/BOOT jack, the CONSOLE connector, the RESET button and the USER and PWR lamps. The rear carries
  the DC jack (DC 12-57 V as printed), a cable-restraint slot, an earthing stud and a finned heatsink
  that cools the unit. There is no fan and no built-in mains supply: a 24 V 1.2 A adapter ships in the
  box. It mounts in a rack on the ears supplied.


  Configuration `base`: CRS309-1G-8S+IN - eight SFP+ cages, one 10/100/1000 port with PoE in and the DE-9
