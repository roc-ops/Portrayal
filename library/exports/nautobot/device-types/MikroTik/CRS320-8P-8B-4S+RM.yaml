comments: 'MikroTik CRS320-8P-8B-4S+RM is a fixed 1U Cloud Router Switch with high-power PoE out. It has
  16 Gigabit Ethernet ports that supply PoE (Ether1-8 at 802.3af/at, Ether9-16 at 802.3bt), a Gigabit
  management port printed ETH / BOOT, four SFP+ cages and an RJ45 console, and runs RouterOS v7. The front
  carries the 16 jacks in two blocks of four columns by two rows, with a grey PoE bar printed over each
  column, then the console over the management port, four lamps, and the 2 by 2 SFP+ block with eight
  arrow lamps. The rear has two supply slots printed POWER 1 and POWER 2. The first holds the shipped
  600 W supply and the second is closed by a plain cover; either takes the hot-swap G1483-0600WNB, which
  raises the power to 1150 W. The fans draw through an opening in the right wall and a hex vent in the
  rear.


  Configuration `base`: CRS320-8P-8B-4S+RM - 16 Gigabit PoE-out ports (Ether1-8 at 802.3af/at, Ether9-16
  at 802.3bt), a Gigabit management port, four SFP+ cages and the RJ45 console, with two hot-swap supply
  slots and three fans. The box holds a power cord, a fastening set, rack ears, cable-management brackets
  and a K-57 kit. No part is seated in either slot: no held document names the supply that ships.


  Rack mounting positions: flush (ears level with the face; as shipped).


