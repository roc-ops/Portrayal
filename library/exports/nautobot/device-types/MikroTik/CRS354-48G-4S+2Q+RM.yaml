comments: 'MikroTik CRS354-48G-4S+2Q+RM is a fixed 1U Cloud Router Switch. It has 48 10/100/1000 Ethernet
  ports, four SFP+ cages, two 40G QSFP+ cages, a 10/100 management port and an RJ45 serial console, and
  runs RouterOS. The front carries the 48 jacks in four blocks of six columns by two rows. They are numbered
  1 to 48 as printed, with the odd number on the lower jack of a column. The four SFP+ cages are numbered
  1 to 4 and the two QSFP+ cages 1 and 2, each pair stacked, with the odd number below. The right-hand
  end carries the CONSOLE and MGMT jacks, the RESET button and the PWR 1, FAULT and PWR 2 lamps. The rear
  carries two AC inlets (POWER 1 and POWER 2, 100-240 V), three fans and two vent fields. The power supplies
  and the fans are built into the chassis, so there are no bays.


  Configuration `base`: CRS354-48G-4S+2Q+RM - 48 10/100/1000 ports, four SFP+ cages, two QSFP+ cages,
  the management jack and the RJ45 console. The box holds two IEC cords, rack ears, the K-48 screw kit
  and cable management brackets.


  Rack mounting positions: flush (ears level with the face; as shipped).


