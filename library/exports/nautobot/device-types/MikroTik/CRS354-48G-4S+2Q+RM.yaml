  - performance.port-modes-sfp-plus: 10G SFP+ (brochure); the product page''s feature badge reads SFP/SFP+,
  and no module list is printed

  - performance.throughput: non-blocking 168 Gbps, switching capacity 336 Gbps, forwarding rate 235 Mpps
  (brochure)

  - platform.cpu: QCA9531, 650 MHz

  - platform.os: RouterOS v7 / SwitchOS (licence level 5)

  - platform.ram: 128 MB

  - platform.storage: 32 MB flash

  - platform.switch-chip: 98DX3257

  - power.power-input: 100 - 240 V AC, two inputs (redundant supply), 50 - 60 Hz

  - power.power-max-w: 60

  - power.power-without-attachments-w: 50

  - thermal.cooling: 3 fans (product page)


