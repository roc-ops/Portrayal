comments: 'MikroTik CRS312-4C+8XG-RM is a fixed 1U Cloud Router Switch. It has eight 1G/2.5G/5G/10G RJ45
  ports and four combo ports. Each combo port is a 10G RJ45 jack (1T to 4T) and an SFP+ cage (1F to 4F),
  one in use at a time. It also has a 10/100 management jack (MGMT/BOOT), an RJ45 serial console and a
  USB type A port. It runs SwOS or RouterOS. The front carries the eight 10G jacks in two blocks of four.
  Beside them are the combo jacks under a blue bracket and the two by two SFP+ block. Then come the CONSOLE
  and MGMT/BOOT jacks, the RESET button and the USB port. The USER, FAULT, POWER 2 and POWER 1 lamps follow.
  The two AC supplies and the four fans are built into the chassis, so there are no bays. The air passes
  through a vent field in the right wall. No document held shows the rear, so the rear is not drawn and
  the AC inlets are not placed.


  Configuration `base`: CRS312-4C+8XG-RM - eight 10G RJ45 ports, four combo 10G RJ45 / SFP+ ports, one
  10/100 management port, the RJ45 console and a USB type A port. It has two built-in AC supplies and
  four fans. The box holds two IEC cords, a screw and feet kit (K57) and rack ears.


  Rack mounting positions: flush (ears level with the face; as shipped).


