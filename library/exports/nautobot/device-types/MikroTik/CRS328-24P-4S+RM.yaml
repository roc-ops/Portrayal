comments: 'MikroTik CRS328-24P-4S+RM is a fixed 1U Cloud Router Switch with PoE out. It has 24 10/100/1000
  Ethernet ports that supply PoE (802.3af/at, or 26 V or 53 V passive, chosen per port). It also has four
  SFP+ cages and an RJ45 serial console, and runs SwOS or RouterOS (dual boot). The front carries the
  24 jacks in three blocks of four columns by two rows under an orange PoE-out band. A pair of lamps sits
  above each column and another pair below it, each lamp numbered. The four SFP+ cages are a block of
  two by two with a numbered lamp under each. The front also has the CONSOLE jack, the RESET and MODE
  buttons and the PWR, USR, FAN and PoE lamps. The 500 W AC supply and the two fans are built into the
  chassis, so there are no bays. The fans draw through grilles in the right wall. No document held shows
  the rear, so the rear is not drawn and the AC inlet is not placed.


  Configuration `base`: CRS328-24P-4S+RM - 24 10/100/1000 PoE-out ports, four SFP+ cages and the RJ45
  console, with a built-in 500 W AC supply and two fans. The box holds rack ears, a K-54 kit and an IEC
  cord.


  Rack mounting positions: flush (ears level with the face; as shipped).


