  port that also takes PoE in, an RJ45 serial console, a DC jack and a two-pin DC terminal (both drawn
  as chassis art, see the gaps), and runs RouterOS v7. Everything is on the front: two hot-swap AC supply
  modules with their C14 inlets at the left, four stacks of two SFP28 cages, the QSFP28 stack, the console
  over the management port, RESET, the two DC inputs and three status lamps. Two fan openings and an earthing
  stud are on the rear. The brochure prints no part number for the supplies, so they are part of the chassis
  and there are no bays.


