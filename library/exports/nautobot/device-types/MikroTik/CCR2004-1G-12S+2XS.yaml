comments: 'MikroTik CCR2004-1G-12S+2XS is a fixed 1U Cloud Core Router with twelve 10 Gigabit SFP+ cages,
  two 25 Gigabit SFP28 cages, a gigabit management jack and an RJ45 serial console, and runs RouterOS
  v7. The front carries the stacked pair of SFP28 cages at the left with four arrow lamps, the twelve
  SFP+ cages each with an ACT and a 10G lamp above it, the console over the management jack, RESET and
  four status lamps. Two AC inlets, each with its supply built in, two fan openings and a finned heatsink
  block are on the rear. The brochure says the supply is dual redundant but prints no part number and
  the rear photograph shows no removable module, so the supplies are part of the chassis and there are
  no bays.


