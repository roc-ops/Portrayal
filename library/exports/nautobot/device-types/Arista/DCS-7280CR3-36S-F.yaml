comments: "Arista 7280CR3-36S - a fixed 1RU data-centre switch router with 36 QSFP ports (28 x QSFP100,\
  \ 6 x QSFP200 and 2 x QSFP-DD, the data sheet says), running EOS. The front carries the cages in two\
  \ stacked rows of eighteen columns, the odd number on top, in two-column blocks. Four system lamps (system,\
  \ fan, PS1, PS2) sit in a row at the right above the stacked RJ-45 Ethernet management port, the USB\
  \ port and the RJ-45 console port. The rear carries two hot-swap power supplies at the ends and two\
  \ hot-swap fan modules. The same panel is ordered with front-to-rear air (-F) or rear-to-front air (-R).\
  \ It is sold as the 7280CR3-36S, as the 7280CR3K-36S with more memory and routes, and as the 7280CR3K-36A\
  \ with an eight-core CPU and an SSD.\n\nConfiguration `f`: The 7280CR3-36S with two AC supplies and\
