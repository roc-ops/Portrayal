comments: 'Arista 7280DR3A-36 - a fixed 2RU data-centre router switch with 36 400G QSFP-DD ports in two
  stacked rows of eighteen columns (the odd number on the upper cage), numbered 1 to 36 in an orange strip
  between the rows, and two OSFP line-system ports (OSFP-LS, 37 and 38) for 400G-ZR optics at the upper
  right. Beside the line-system ports are four status lamps (system, fan, power supply 1, power supply
  2), an RJ-45 console, a USB port and an RJ-45 management port; at the far right stand a Time-of-Day
  connector (USB-C) and two clock connectors (1PPS and 10 MHz). The rear carries four hot-swap fan modules
  and two hot-swap 2400 W power supplies, AC or DC, one above the other at the right, with a grounding
  pad between fans 1 and 2. The same front panel is sold as the DR3A-36, the DR3AM-36 (TunnelSec) and
  the DR3AK-36 (large routes and TunnelSec), and the DR3AK-36S (the K with secure boot enabled); they
  differ in software licence, encryption and secure boot, not in the metal.


  Configuration `ac`: The base switch with two AC supplies and four fans, front-to-rear air: DCS-7280DR3A-36-F
  ("2 x AC"). Spares: PWR-2411-AC-RED, FAN-7012H-RED.


  Also sold or listed as: DCS-7280DR3A-36


  Rack mounting positions: flush ("flush with the front and rear panels"; 4-post only).


