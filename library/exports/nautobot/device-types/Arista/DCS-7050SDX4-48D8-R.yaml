  \ RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)\n- compliance.safety: EN 62368-1, IEC 62368-1,\
  \ CSA/UL 62368-1\n- environmental.altitude: 0 to 3,000 m (10,000 ft) operating\n- environmental.humidity:\
  \ 5 to 90 percent non-condensing\n- environmental.operating-temp: 0 to 40 C (32 to 104 F)\n- environmental.storage-temp:\
  \ -25 to 70 C (guide Table 2); the data sheet says -40 to 70 C\n- features.eos-license: license group\
