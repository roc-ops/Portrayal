comments: "Arista 7050SDX4-48D8 - a fixed 1RU data-centre switch with 48 x 100G SFP-DD ports and 8 x 400G\
  \ QSFP-DD ports, running EOS. The front carries the SFP-DD cages in two stacked rows, the odd number\
  \ on top, in four groups of six columns. The eight QSFP-DD cages are four stacked columns between the\
  \ second and third groups. A lavender strip between the rows carries each SFP-DD cage's number and lamp\
  \ and an orange one the QSFP-DD cages'. Four system lamps (system, fan, PS1, PS2) are at the top right.\
  \ The rear carries two hot-swap 1000 W power supplies at the ends and three hot-swap fan modules. It\
  \ also has the RJ-45 management port, the USB port and the RJ-45 console port. The same panel is ordered\
  \ with front-to-rear air (-F) or rear-to-front air (-R).\n\nConfiguration `r`: The 7050SDX4-48D8 with\
  \ two AC supplies and rear-to-front air: PWR-1011-AC-BLUE supplies and FAN-7011H-R fan modules, all\
  \ with blue handles. Ordered as DCS-7050SDX4-48D8-R.\n\nDatasheet: 7050X4 Series 100/200/400G Data Center\
  \ Switches Data Sheet (Arista Networks, 03-0057-27, Aug 27th, 2025)\n  https://www.arista.com/assets/data/pdf/Datasheets/7050X4-Datasheet.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.certifications: BSMI,\
