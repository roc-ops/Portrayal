comments: "Arista 7280CR3A-24D12 - a fixed 1RU data-centre router switch with 24 x 100G QSFP ports and\
  \ 12 x 400G QSFP-DD ports, running EOS. The front carries three blocks of six columns of two stacked\
  \ cages: the 100G ports in a block at each end and the 400G ports in the block between them, each cage\
  \ with status lamps. At the right are four system lamps (system, fan, PS1, PS2) above a block holding\
  \ the RJ-45 Ethernet management port, the USB port and the RJ-45 serial console, and, at the left of\
  \ that block, a Time-of-Day connector and two clock connectors. The rear carries two hot-swap 1500 W\
  \ power supplies at the ends and three hot-swap fan modules. The same panel is ordered with front-to-rear\
  \ air (-F) or rear-to-front air (-R), as the 7280CR3A, the 7280CR3AM with TunnelSec encryption, the\
  \ 7280CR3AK with large routes and TunnelSec, and the 7280CR3AK-24D12-S with secure boot.\n\nConfiguration\
  \ `m-f`: The 7280CR3AM-24D12 with TunnelSec encryption, the same face, supplies and fans as the base\
  \ switch, front-to-rear air. Ordered as DCS-7280CR3AM-24D12-F.\n\nAlso sold or listed as: DCS-7280CR3A-24D12\n\
  \nDatasheet: 7280R3A Series Data Center Switch Router - Data Sheet (04-0040-26, April 15th, 2025)\n\
