comments: "Arista 7050SX3-48YC12 - a fixed 1RU data-centre switch with 48 x 1/10/25G SFP ports and 12\
  \ x 100G QSFP ports, running EOS. The front carries the SFP cages in four groups of two columns at each\
  \ end, each group two stacked rows of cages (the odd number on top) with a third row of two cages under\
  \ it, and the twelve QSFP cages in two stacked rows of six columns in the middle. Four system lamps\
  \ (system, fan, PS1, PS2) are at the far right. The rear carries two hot-swap 500 W power supplies at\
  \ the ends and four hot-swap fan modules, with the RJ-45 management port, the USB port and the RJ-45\
  \ console port between the left supply and the first fan. The data sheet orders the panel with front-to-rear\
  \ air (-F).\n\nConfiguration `f`: The 7050SX3-48YC12 with two AC supplies and front-to-rear air: PWR-500AC-F\
  \ supplies and FAN-7000H-F fan modules, all with red handles. Ordered as DCS-7050SX3-48YC12-F.\n\nAlso\
  \ sold or listed as: DCS-7050SX3-48YC12\n\nDatasheet: 7050X3 Series 10/25/40/50/100G Data Center Switches\
  \ Data Sheet (Arista Networks, 03-0040-46)\n  https://www.arista.com/assets/data/pdf/Datasheets/7050X3-Datasheet.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.certifications: BSMI,\
