comments: "Arista 7050CX4M-48D8 - a fixed 2RU data-centre switch with 48 x 100G QSFP28 ports, 8 x 400G\
  \ QSFP-DD ports and 2 x SFP+ ports, with MACsec, running EOS. The front carries the QSFP28 cages in\
  \ four rows of twelve columns, in two halves of two rows with a grille between them, three blocks of\
  \ two columns (six columns) on each side. The eight QSFP-DD cages are four stacked columns between the\
  \ left and right QSFP28 blocks. The two SFP+ cages are stacked at the right, under the management block,\
  \ which holds the RJ-45 management port, the USB port and the RJ-45 console port, with the four system\
  \ lamps (system, fan, PS1, PS2) beside it. The rear carries two hot-swap power supplies stacked at the\
  \ right, four hot-swap fan modules, and an earth grounding pad. The same panel is ordered with front-to-rear\
  \ air (-F) or rear-to-front air (-R).\n\nConfiguration `r`: The 7050CX4M-48D8 with MACsec, two AC supplies\
  \ and rear-to-front air: PWR-1512-AC-BLUE supplies and FAN-7012H-BLUE fan modules, all with blue handles.\
  \ Ordered as DCS-7050CX4M-48D8-R.\n\nDatasheet: 7050X4 Series 100/200/400G Data Center Switches Data\
  \ Sheet (Arista Networks, 03-0057-27, Aug 27th, 2025)\n  https://www.arista.com/assets/data/pdf/Datasheets/7050X4-Datasheet.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.certifications: BSMI,\
  \ CE, KCC, NRTL, RCM, UKCA, VCCI, TEC, ANATEL, ICASA, NOM Equivalency (data sheet)\n- compliance.emc:\
  \ FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386\n- compliance.rohs:\
  \ RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)\n- compliance.safety: EN 62368-1, IEC 62368-1,\
  \ CSA/UL 62368-1\n- environmental.altitude: 0 to 3,000 m (10,000 ft) operating\n- environmental.humidity:\
  \ 5 to 90 percent non-condensing\n- environmental.operating-temp: 0 to 40 C (32 to 104 F)\n- environmental.storage-temp:\
  \ -25 to 70 C (guide Table 2); the data sheet says -40 to 70 C\n- features.eos-license: license group\
  \ LIC-FIX-3-MACSEC; minimum EOS 4.31.1\n- features.optics-qsfp-dd: 400G, 200G, 100G and 40G with breakout,\
  \ in the eight QSFP-DD cages (data sheet)\n- features.optics-qsfp28: 100G, 50G, 25G and 10G with breakout,\
  \ in the 48 QSFP28 cages (data sheet, \"QSFP-100\")\n- features.optics-sfp-plus: 10G, in the two SFP+\
  \ cages (data sheet)\n- lifecycle.eol: none-announced\n- management.console: RJ-45 RS-232 serial on\
