  \ supplies at the ends and three hot-swap fan modules, with the RJ-45 management port, the USB port\
  \ and the RJ-45 console port between the left supply and the first fan. Air flows front to rear. It\
  \ is sold as the 7280PR3-24 and, with more memory and routes, as the 7280PR3K-24.\n\nConfiguration `k-f`:\
