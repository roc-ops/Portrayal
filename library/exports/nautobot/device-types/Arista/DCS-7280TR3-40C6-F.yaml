comments: "Arista 7280TR3-40C6 - a fixed 1RU data-centre switch router with 40 x 1/10GBASE-T RJ-45 ports\
  \ and 6 x 100G QSFP ports, running EOS. The front carries the RJ-45 jacks in two stacked rows of twenty\
  \ columns in five blocks of four, the odd number on top. Then come the six QSFP cages in two stacked\
  \ rows of three columns. At the right are the stacked RJ-45 management port, USB port and RJ-45 console\
  \ port, with four system lamps (system, fan, PS1, PS2). The rear carries two hot-swap 500 W power supplies\
  \ at the ends and two hot-swap fan modules. The same panel is ordered with front-to-rear air (-F) or\
  \ rear-to-front air (-R).\n\nConfiguration `f`: The 7280TR3-40C6 with two AC supplies and front-to-rear\
