  \ EN 55035, EN 300 386\n- compliance.rohs: RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)\n\
  - compliance.safety: EN 62368-1:2014 + A11:2017, IEC 62368-1:2014\n- environmental.altitude: 0 to 3,000\
  \ m (10,000 ft) operating\n- environmental.humidity: 5 to 90 percent non-condensing (guide Table 2);\
