comments: "Arista 7050CX4-24D8 - a fixed 1RU data-centre switch with 24 x 200G QSFP56 ports, 8 x 400G\
  \ QSFP-DD ports and 2 x SFP+ ports, running EOS. The front carries the QSFP56 cages in two stacked rows,\
  \ the odd number on top, in twelve columns, with the four QSFP-DD columns after them and the two SFP+\
  \ cages stacked at the right. A blue strip between the rows runs under the 200G cages and an orange\
  \ one under the 400G cages. Four system lamps (system, fan, PS1, PS2) are at the top right. The rear\
  \ carries two hot-swap power supplies at the ends, three hot-swap fan modules, and the RJ-45 management\
  \ port, the USB port and the RJ-45 console port. The same panel is ordered with front-to-rear air (-F)\
  \ or rear-to-front air (-R).\n\nConfiguration `f`: The 7050CX4-24D8 with two AC supplies and front-to-rear\
