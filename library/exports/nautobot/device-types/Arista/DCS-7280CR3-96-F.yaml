comments: "Arista 7280CR3-96 - a fixed 2RU data-centre switch router with 96 x 100G QSFP ports, running\
  \ EOS. The front carries the cages in three rows: a top row of sixteen single cages numbered 81 to 96,\
  \ and below it two rows of stacked cages, each ten blocks of two columns, numbered 1 to 40 and 41 to\
  \ 80, the odd number on top in each block. Four system lamps (system, fan, PS1, PS2), the RJ-45 console\
  \ port, the USB port and the RJ-45 Ethernet management port are at the top right. The rear carries two\
  \ hot-swap 2400 W power supplies one above the other at the right, four hot-swap fan modules, and a\
  \ grounding strip between the first and second fan. Air flows front to rear. It is sold as the 7280CR3-96\
  \ and, with more memory and routes, as the 7280CR3K-96.\n\nConfiguration `f`: The 7280CR3-96 with two\
  \ AC supplies and front-to-rear air: PWR-2411-AC-RED supplies and FAN-7012H-RED fan modules, all with\
  \ red handles. Ordered as DCS-7280CR3-96-F.\n\nAlso sold or listed as: DCS-7280CR3-96\n\nDatasheet:\
  \ 7280R3 Series Data Center Switch Router Data Sheet (Arista Networks, 03-0045-59, August 11th, 2025)\n\
  \  https://www.arista.com/assets/data/pdf/Datasheets/7280R3-Data-Sheet.pdf\n\nFacts carried in the model\
  \ that this schema has no field for:\n- compliance.certifications: BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI,\
  \ TEC, ANATEL, ICASA (data sheet)\n- compliance.emc: FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019,\
  \ EN 61000-3-3, EN 55035, EN 300 386\n- compliance.rohs: RoHS 2011/65/EU and 2015/863/EU (data sheet,\
  \ Directives)\n- compliance.safety: EN 62368-1, IEC 62368-1, CSA/UL 62368-1\n- environmental.altitude:\
  \ 0 to 3,000 m (10,000 ft) operating\n- environmental.humidity: 5 to 90 percent non-condensing (guide\
  \ Table 2); the data sheet says 5 to 95 percent\n- environmental.operating-temp: 0 to 40 C (32 to 104\
  \ F)\n- environmental.storage-temp: -25 to 70 C (guide Table 2); the data sheet says -40 to 70 C\n-\
  \ features.eos-license: license group G4; minimum EOS 4.24.0\n- features.optics-qsfp28: 100G, 50G, 40G,\
  \ 25G and 10G with breakout, in the 96 QSFP cages (data sheet)\n- lifecycle.eol: none-announced\n- management.console:\
  \ RJ-45 RS-232 serial on the front, 9600 baud 8N1, no flow control\n- management.oob: one 10/100/1000\
  \ management port on the front\n- management.usb: one USB port on the front, for software or configuration\
  \ updates\n- performance.interfaces-max: 192\n- performance.latency: from 3.8 microseconds\n- performance.packet-buffer:\
  \ 16 GB\n- performance.packets-per-second: 4 Bpps\n- performance.ports-max-speed: 96 ports of 100 Gbps;\
  \ 192 of 50 Gbps; 96 of 40 Gbps; 192 of 25 or 10 Gbps\n- performance.throughput: 9.6 (19.2) Tbps\n-\
  \ physical.size-over-ears: 48.3 x 8.8 x 76.1 cm (19 x 3.50 x 30.0 in) with the mounting ears (guide\
  \ Table 1)\n- physical.weight: 23.6 kg (52.0 lbs) for the 7280CR3-96 and the 7280CR3K-96 (guide Table\
  \ 1, data sheet)\n- platform.cpu: Quad-Core x86\n- platform.memory: 64 GB\n- platform.storage: 8 GB\
  \ flash; 120 GB SSD\n- power.efficiency: 93 percent (Platinum) AC, 94 percent DC (data sheet)\n- power.input-ac:\
  \ 200 - 240 VAC (PWR-2411-AC), IEC 60320 C20\n- power.input-dc: -48 to -60 VDC (PWR-2411-DC)\n- power.power-envelope:\
  \ as-tested\n- power.power-max-w: 1803\n- power.power-measure: typical at 25 C ambient with 50 percent\
