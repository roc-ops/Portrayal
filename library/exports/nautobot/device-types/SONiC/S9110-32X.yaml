  \ the front-panel port its alias names and the breakout modes it allows. eth0 is SONiC's management\
  \ port (the SONiC command reference, Management VRF).\n\nUfiSpace S9110-32X open-networking 100G data-center\
  \ switch - 1RU, 32x QSFP28 40/100G in eight 2x2 ganged blocks, with an OOB RJ45, a 10G SFP+ management\
  \ port, RJ45 console and USB 3.0 on the faceplate; three hot-swap fan modules and two 750 W PSUs (1+1)\
  \ at the rear, orderable in front-to-back (red handles) or back-to-front (blue handles) airflow. Broadcom\
  \ Trident3-X7, Intel Denverton, BMC-managed white box (ToR / spine-leaf / DCI).\n\nConfiguration `dc-f2b`:\
  \ Dual 750 W DC PSUs (PSU-751-DESR) and FAN-405637-HD fans, front-to-back airflow, red handles\n\nDatasheet:\
  \ UfiSpace S9110-32X 100G Data Center Switch Datasheet\n  https://www.ufispace.com/products/datacenter/100g/s9110-32x-100g-data-center-switch\n\
