comments: "SONiC lists UfiSpace S9311-64D (NOS: sonic).\nListed per: SONiC Supported Devices and Platforms\
  \ (sonic-net.github.io/SONiC), the row for S9311-64D. Port names from the platform's own table in sonic-net/sonic-buildimage\
  \ at d5c2e3b32ffa, device/ufispace/x86_64-ufispace_s9311_64d-r0/platform.json: each SONiC name with\
  \ the front-panel port its alias names and the breakout modes it allows. eth0 is SONiC's management\
  \ port (the SONiC command reference, Management VRF).\n\nUfiSpace S9311-64D 400G data center spine switch\
  \ - 2RU white box, 64x QSFP-DD 400G in four rows of sixteen (two 2-high stacked cage banks) plus 2x\
  \ SFP+ 1/10G, an RJ45 out-of-band port, RJ45 and micro-USB consoles, USB 3.0 and a 1PPS/10MHz SMB timing\
  \ pair, on Broadcom Tomahawk 4 at 25.6 Tbps; four hot-swap fans (3+1) and dual 2400W PSUs (1+1) at the\
  \ rear, orderable in AC or DC and in front-to-back or back-to-front airflow\n\nConfiguration `base`:\
  \ The chassis as it ships and as every rear figure draws it - four FAN-805616-HCE fans and two PSU-242-AECRN\
  \ 2400W AC supplies, red handles and latches throughout, front-to-back airflow, and the sixty-six traffic\
  \ and management ports empty. No orderable chassis part number appears in any held document; see the\
  \ chassis-sku gap.\n\nDatasheet: UfiSpace S9311-64D 400GE Data Center Switch Datasheet\n  https://www.ufispace.com/products/datacenter/400g/s9311-64d\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15, Subpart\
  \ B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386; EN 55035; BSMI (CNS 13438), Class A;\
  \ VCCI CISPR 32, Class A\n- compliance.environment: RoHS; WEEE\n- compliance.safety: UL 62368-1; IEC\
  \ 62368-1\n- environmental.operating-humidity: 5 to 95% RH non-condensing\n- environmental.operating-temp:\
  \ 0 to 40 C\n- environmental.storage-humidity: 5 to 95% RH non-condensing\n- environmental.storage-temp:\
  \ -40 to 70 C\n- features.optics-qsfp-dd: 400GE QSFP-DD OpenZR+/ZR/ER4/LR4/SR8/FR4/DR4/DR4+/PLR4; 200GE\
  \ QSFP56 SR4/FR4; 100GE QSFP28 ZR4/ER4/LR4/SR4 (datasheet compatible transceiver list)\n- features.optics-sfp-plus:\
  \ 1/10G (datasheet port list)\n- features.timing: 1PPS and 10MHz SMB (Premium), each input/output\n\
  - features.timing-cable: SMB coaxial with a 10-32UNF-2A connector, for 1PPS and 10MHz\n- features.zr-capacity:\
  \ up to 32 QSFP-DD ZR+ modules; the HIG's Figure 12 shades one 32-port band to mark which ports they\
  \ are - see the zr-port-set gap\n- lifecycle.eol: none-announced\n- management.console: RJ45 RS-232\
  \ plus a micro-USB serial console\n- management.oob: 1x RJ45 100/1000M\n- performance.packet-throughput:\
  \ 10.6 Bpps\n- performance.switching-capacity: 25.6 Tbps\n- platform.asic: Broadcom Tomahawk 4\n- platform.bmc:\
  \ Aspeed AST2620\n- platform.cpu: Intel Icelake-D 4-core @ 2.4 GHz\n- platform.memory: 2x 16 GB DDR4\
  \ R-DIMM with ECC\n- platform.storage: 1x 128 GB SSD\n- power.input-ac: 200 to 240 V, 16 A\n- power.input-dc:\
  \ -48 to -60 V, 70 A\n- power.power-envelope: bare\n- power.power-max-w: 2097\n- power.power-typical-w:\
  \ 387.5\n- power.psu-redundancy: 1+1 hot-swappable\n- thermal.airflow: front-to-back or back-to-front,\
  \ selected by the fan and PSU build\n- thermal.fan-redundancy: 3+1 hot-swappable\n\nDrawing version\
  \ 4.1.2. A major bump means a slot moved or an id was renamed, so anything cached from an earlier export\
  \ may no longer line up.\nModel maturity: modelled. Every dimension in the source records where it came\
  \ from."
