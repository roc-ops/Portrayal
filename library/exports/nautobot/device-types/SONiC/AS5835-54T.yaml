comments: 'SONiC lists Edgecore AS5835-54T (NOS: sonic).

  Listed per: SONiC Supported Devices and Platforms (sonic-net.github.io/SONiC), the row for AS5835-54T.
  Port names from the platform''s own table in sonic-net/sonic-buildimage at d5c2e3b32ffa, device/accton/x86_64-accton_as5835_54t-r0/Accton-AS5835-54T/port_config.ini:
  each SONiC name with the front-panel port its alias names. eth0 is SONiC''s management port (the SONiC
  command reference, Management VRF).


  48x 1/10GBASE-T RJ-45 and 6x 100G QSFP28 data-centre leaf switch, sold as the DCS202 - the copper-access
  member of the DCS201''s shell. All fifty-four ports, both management jacks, the console and the USB
  are on the FRONT; two supplies and five fan trays are on the rear, and the rear is the DCS201''s, proven
  rather than assumed. Ports number 1-54 and run DOWN each column. Ships front-to-back and back-to-front.


  Configuration `ac-f2b`: Dual 400 W AC PSUs, front-to-back airflow - red handles and red release latches


  Also sold or listed as: DCS202


