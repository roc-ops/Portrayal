  - compliance.immunity: EN 55024/55035, IEC 61000-4-2/3/4/5/6/8/11

  - compliance.safety: UL (CSA 22.2 No 62368-1 & UL62368-1), CB (IEC/EN62368-1), BSMI CNS 15598-1

  - environmental.humidity: 5% to 95% non-condensing

  - environmental.operating-temp: 0 to 45 C

  - environmental.storage-temp: -40 to 70 C

