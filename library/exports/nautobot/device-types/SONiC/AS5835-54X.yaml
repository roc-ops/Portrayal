comments: 'SONiC lists Edgecore AS5835-54X (NOS: sonic).

  Listed per: SONiC Supported Devices and Platforms (sonic-net.github.io/SONiC), the row for AS5835-54X.
  Port names from the platform''s own table in sonic-net/sonic-buildimage at d5c2e3b32ffa, device/accton/x86_64-accton_as5835_54x-r0/Accton-AS5835-54X/port_config.ini:
  each SONiC name with the front-panel port its alias names. eth0 is SONiC''s management port (the SONiC
  command reference, Management VRF).


  48x 10G SFP+ and 6x 100G QSFP28 data-centre leaf switch, sold as the DCS201, Broadcom Trident 3 with
  an Intel Atom C3558. All fifty-four ports, both management jacks, the console and the USB are on the
  FRONT; two supplies and five fan trays are on the rear. Ports number 1-54 and run DOWN each column -
  odd on the top row, even beneath it. Ships front-to-back and back-to-front, and the two builds differ
  in the colour of every handle and latch.


  Configuration `ac-f2b`: Dual 400 W AC PSUs, front-to-back airflow - red handles and red release latches


  Also sold or listed as: DCS201


  Facts carried in the model that this schema has no field for:

  - compliance.emissions: EN 55032 Class A, EN 61000-3-2, EN 61000-3-3, AS/NZS Class A, ICES-003 Class
  A, FCC Class A, VCCI Class A, BSMI Class A, TEC Class A

  - environmental.humidity: 5% to 95% non-condensing

  - environmental.operating-temp: 0 to 45 C

  - environmental.storage-temp: -40 to 70 C

  - features.optics-qsfp28: datasheet: "6 x 100 GbE QSFP28 switch ports, each supporting 40/100 GbE (DAC,
  100GBASE SR4/LR4) or 4 x 10/25 GbE (DAC or fiber breakout cable)". Its Supported Transceivers and Cables
  list adds 40GBASE-SR4/LR4, 40G-DAC/AOC, 100GBASE-SR4/CWDM4/LR4 and 100G-DAC/AOC.

  - features.optics-sfp-plus: datasheet: "48 x SFP+ switch ports, supporting 1/10 GbE (DAC, 10GBASE-SR/LR)
  or 1 GbE (1000BASE-T/SX/LX)". Its Supported Transceivers and Cables list adds 10GBASE-RJ45 and 10G-DAC/AOC
  cable.

  - lifecycle.eol: none-announced

  - physical.weight-note: 8.815 kg (19.43 lb), with two installed PSUs

  - platform.onie: pre-loaded, no switch software image

  - platform.processor: Intel Atom C3558 2.2 GHz 4-core x86, 2 x 8 GB DDR4 SO-DIMM


