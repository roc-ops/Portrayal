comments: "SONiC lists Celestica R4041-F9007-A0 (NOS: sonic).\nListed per: sonic-net/sonic-buildimage\
  \ at d5c2e3b32ffa builds SONiC for this box: device/celestica/x86_64-cel_ds2000-r0. It is not on SONiC's\
  \ Supported Devices and Platforms page, which predates it; the build tree is taken as SONiC's list.\
  \ Port names from the platform's own table, device/celestica/x86_64-cel_ds2000-r0/platform.json: each\
  \ SONiC name with the front-panel port its alias names and the breakout modes it allows. eth0 is SONiC's\
  \ management port (the SONiC command reference, Management VRF).\n\nCelestica DS2000 - a 1U 2.0 Tbps\
  \ top-of-rack switch with 48 x 10/25G SFP28 in three ganged blocks of sixteen and 8 x 100G QSFP28 in\
  \ four stacked pairs, all on a black front bezel with a lamp above or below every port and nothing else.\
  \ Management is on the REAR: an RJ45 CPU/BMC management jack, a USB 2.0 port and an RJ45 console with\
  \ the four system lamps and a reset pinhole, between two pairs of hot-swap fan modules, with a 550 W\
  \ CRPS supply at each end. Ports number 1-48 down each column, odd on the top row, and 49-56 the same\
  \ way. Front-to-back and back-to-front builds.\n\nConfiguration `f2b`: DS2000, 1U, 48x 10/25GbE + 8x\
  \ 100GbE, COMe 4C/16GB-DDR/64GB-SSD, front-to-back airflow (R4041-F9007-A0)\n\nDatasheet: Celestica\
  \ DS2000 1U 48-port 10GbE/25GbE Data Center Switch datasheet (revision 091024)\n  https://www.celestica.com/hps/ds2500_ds2000\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: CN (GB9254-2008),\
  \ EU (EN55022, EN55024), FCC, VCCI, CCC\n- compliance.safety: IEC60950-1, GB4943, UL/CSA, CB, CCC\n\
  - environmental.humidity: 5% to 90% non-condensing\n- environmental.mtbf: in excess of 150,000 hours\n\
  - environmental.operating-temp: 0 to 45 C at 900 m\n- features.eee: 802.3az\n- features.optics-qsfp28:\
  \ datasheet 'QSFP28 upto 5.5W power, DAC (to 5m passive)'; guide Table 6: 100GBASE-SR4 over OM3/OM4,\
  \ 100GBASE-LR4 (10 km), 100GBASE-CR4 1/3/5 m, and 4 x 25G breakout by cable without a reboot.\n- features.optics-sfp28:\
  \ datasheet 'Transceivers: SFP28 upto 2W'; guide Table 6 lists 10GBASE SR/LR optics and copper DAC 1\
  \ m 30 AWG, 3 m 28 AWG, 5 m 26 AWG.\n- features.routing-tables: up to 48K MPLS labels, up to 324K L3\
  \ LPM, up to 18K ACLs\n- features.timing: IEEE 1588 1-step and 2-step, TC and BC mode, SyncE recovery\
  \ (option)\n- lifecycle.eol: none-announced\n- management.mgmt-ports: rear: 1 x RJ45 CPU/BMC shared\
  \ Ethernet management (10/100/1000), 1 x RJ45 serial console (9600-115200 8N1), 1 x USB 2.0 Type A host\
  \ (data only)\n- performance.latency: less than 500 ns port to port (cut-through)\n- performance.packet-buffer:\
  \ 32 MB\n- performance.switching-capacity: 2.0 Tbps\n- platform.bmc: DDR3 1-4 Gb, SPI flash 8-64 Mb\
  \ dual boot, NC-SI shared management port, IPMI 2.0, SOL\n- platform.cpu: Intel Denverton x86 (up to\
  \ 8-core), 8-32 GB ECC DDR4, configurable M.2 SSD\n- platform.onie: ONIE installer for third-party network\
  \ operating systems\n- power.input-ac: 100-240 VAC auto-ranging, 47-63 Hz\n- power.input-dc: 180-300\
  \ VDC auto input (datasheet; no DC SKU is listed)\n- power.power-envelope: unstated\n- power.power-max-w:\
  \ 500\n- power.power-typical-w: 350\n- power.psus: 2 x 550 W AC hot-swap CRPS, 1+1 redundant\n- thermal.fans:\
  \ 4 hot-swap fan modules, 3+1 redundant\n\nDrawing version 0.1.1. A major bump means a slot moved or\
  \ an id was renamed, so anything cached from an earlier export may no longer line up.\nModel maturity:\
  \ modelled. Every dimension in the source records where it came from."
