comments: 'SONiC lists Edgecore 7816-64X-OZ-AC-F-EU (NOS: sonic).

  Listed per: SONiC Supported Devices and Platforms (sonic-net.github.io/SONiC), the row for AS7816-64X.
  Port names from the platform''s own table in sonic-net/sonic-buildimage at d5c2e3b32ffa, device/accton/x86_64-accton_as7816_64x-r0/platform.json:
  each SONiC name with the front-panel port its alias names and the breakout modes it allows. eth0 is
  SONiC''s management port (the SONiC command reference, Management VRF). SONiC''s aliases count this
  faceplate from 1 and this model''s ids from 0; the two run over the same cages in the same order, so
  each is mapped to its counterpart by position.


  64 x 100G QSFP28 2RU top-of-rack or spine switch (vendor alias AS7816-64X, OZ series), Broadcom BCM56970
  Tomahawk 2 with an Intel Xeon D-1518, ONIE-preloaded. Every port is on the front, in sixteen 2x2 ganged
  cages; two 850 W AC supplies sit in the rear''s lower corners either side of four 3+1 fan trays, in
  either airflow direction. Port, fan and PSU numbering start at zero on this series.


  Configuration `ac-f2b`: Dual 850 W AC supplies, front-to-back airflow - the -F ordering codes.


  Also sold or listed as: AS7816-64X


  Facts carried in the model that this schema has no field for:

  - compliance.emc: CE Mark, EN 55032, AS/NZS CISPR 32, EN 55024, EN 61000-3-2, EN 61000-3-3, FCC Part
  15 Subpart B Class A, VCCI Class A

  - compliance.nebs: GR63-CORE (pre-test)

  - compliance.rohs: RoHS-6 compliant; WEEE Directive 2002/96/EC

  - compliance.safety: CB, UL (CSA 22.2 No 62368-1; UL 62368-1), CNS15598-1

  - environmental.humidity-operating: 5% to 95% non-condensing

  - environmental.temperature-operating: 0 C to 45 C (32 F to 113 F)

  - environmental.temperature-storage: -40 C to 70 C (-40 F to 158 F)

  - features.optics-qsfp28: 100GBASE-CR4/AOC/SR4/LR4/CWDM4/PSM4, 40GBASE-CR4/SR4/LR4, 100G DAC, 40G DAC/AOC

  - lifecycle.eol: none-announced

  - management.mgmt-ports: 1x RJ-45 serial console, 1x RJ-45 1000BASE-T management, 1x USB Type-A storage

  - performance.forwarding-rate: 4.2 bpps

  - performance.jumbo-frames: up to 9 KB

  - performance.packet-buffer: 42 MB integrated

  - performance.port-modes-qsfp28: 1x 100GbE or 1x 40GbE, or breakout 4x 25GbE / 4x 10GbE (128 logical
  ports max)

  - performance.switching-capacity: 6.4 Tbps (12.8 Tbps full duplex)

  - platform.asic: Broadcom BCM56970 Tomahawk 2

  - platform.boot-flash: 2x 16 MB SPI

  - platform.cpu: Intel Xeon D-1518, 4-core 2.2 GHz

  - platform.memory: 2x 8 GB DDR4-2133 ECC SO-DIMM

  - platform.software: ONIE installer pre-loaded; open-source and commercial NOS options

  - platform.storage: 32 GB M.2 MLC SSD (reserve mSATA connector)

  - power.input-ac: 100-240 VAC, 50-60 Hz, 12-6 A

  - power.power-envelope: unstated

  - power.power-max-w: 850

  - power.power-redundancy: 1+1 redundant, load-sharing, hot-swappable

  - thermal.airflow: front-to-back or back-to-front, by SKU


