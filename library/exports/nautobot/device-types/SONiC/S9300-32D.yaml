comments: "SONiC lists UfiSpace S9300-32D (NOS: sonic).\nListed per: SONiC Supported Devices and Platforms\
  \ (sonic-net.github.io/SONiC), the row for S9300-32D. Port names from the platform's own table in sonic-net/sonic-buildimage\
  \ at d5c2e3b32ffa, device/ufispace/x86_64-ufispace_s9300_32d-r0/platform.json: each SONiC name with\
  \ the front-panel port its alias names and the breakout modes it allows. eth0 is SONiC's management\
  \ port (the SONiC command reference, Management VRF).\n\nUfiSpace S9300-32D 400G data center spine switch\
  \ - 1RU white box, 32x QSFP-DD 400G in two rows plus 2x SFP+ 1/10G and a 2x SFP+ 10G / RJ45 out-of-band\
  \ management block, Broadcom Trident4-X11 at 12.8 Tbps; six hot-swap fans (5+1) and dual 1300W PSUs\
  \ (1+1) at the rear, orderable in AC or DC and in front-to-back or back-to-front airflow\n\nConfiguration\
  \ `ac`: Dual 1300W AC PSUs (PSU-132-AESR-3N, exhaust, red latch) with front-to-back airflow fans (FAN-405637-HD,\
  \ red handles) - the build the vendor renders show. The back-to-front build is ac-b2f; no chassis SKU\
  \ appears in any held document (see the chassis-sku gap)\n\nDatasheet: UfiSpace S9300-32D 400GE Data\
  \ Center Switch Datasheet\n  https://www.ufispace.com/products/datacenter/400g/s9300-32d-400g-data-center-spine-switch\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15, Subpart\
  \ B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386; EN 55024; EN 55035; BSMI; VCCI CISPR\
  \ 32, Class A; AS/NZS CISPR 32, Class A; MTCTE\n- compliance.environment: RoHS; WEEE\n- compliance.safety:\
  \ UL 62368-1; IEC 60950-1; IEC 62368-1; BSMI; MTCTE\n- environmental.operating-humidity: 5 to 95% RH\
  \ non-condensing\n- environmental.operating-temp: 0 to 40 C\n- environmental.storage-humidity: 5 to\
  \ 95% RH non-condensing\n- environmental.storage-temp: -40 to 70 C\n- features.optics-qsfp-dd: 400GE\
  \ ZR/ER4/LR4/SR8/FR4/DR4/DR4+/PLR4 and 400G ZR/ZR+ support; 200GE QSFP56 SR4/FR4; 100GE QSFP28 ZR4/ER4/LR4/SR4\
  \ (datasheet compatible transceiver list)\n- features.optics-sfp-plus: 1/10G on the data pair, 10G on\
  \ the OOB pair (datasheet port list)\n- features.programmability: NPL (open source) runtime programmability\n\
  - features.zr-capacity: up to 8x 400G ZR in ZR-only use, or up to 6 total if any OpenZR+ is mixed in;\
  \ ZR/OpenZR+ modules must not sit in adjacent ports (HIG port overview)\n- lifecycle.eol: none-announced\n\
  - management.console: RJ45 RS-232, 115200 8N1 (labelled IOIOI)\n- management.oob: 1x RJ45 100/1000M\
  \ plus 2x SFP+ 10G, both reaching the x86 (HIG)\n- performance.packet-buffer: 132 MB\n- performance.switching-capacity:\
  \ 12.8 Tbps\n- platform.asic: Broadcom Trident4-X11 BCM56880\n- platform.bmc: Aspeed AST2400\n- platform.cpu:\
  \ Intel Skylake-D 8-core @ 1.9 GHz\n- platform.memory: 32 GB DDR4\n- platform.storage: 1x 128 GB SSD\n\
  - power.input-ac: 200 to 240 V, 7.5 A per feed\n- power.input-dc: -40 to -75 V, 40 A per feed\n- power.power-envelope:\
  \ bare\n- power.power-max-w: 1246\n- power.power-typical-w: 403\n- power.psu-redundancy: 1+1 hot-swappable\n\
  - thermal.fan-redundancy: 5+1 hot-swappable\n\nDrawing version 3.1.0. A major bump means a slot moved\
  \ or an id was renamed, so anything cached from an earlier export may no longer line up.\nModel maturity:\
  \ modelled. Every dimension in the source records where it came from."
