comments: 'Juniper QFX5241-64OD, a 2RU 800G data-centre spine switch running Junos OS Evolved, the sibling
  of the QFX5240-64OD with its own AC and DC builds. It has 64 OSFP ports (800 GbE) in sixteen columns
  of four, in four groups of four columns, and two SFP ports (10 GbE), with a lamp beside each network
  port. The port side also carries the RJ-45 management, console and time-of-day ports, a USB port, the
  reset button, the three chassis lamps, the 1 PPS and 10 MHz connectors. The rear carries two 3000 W
  power supplies stacked at the left and four front-to-back fan modules. It ships as one front panel in
  an AC and a DC airflow-out build, and as a spare chassis with no supplies and no fan modules. Its sibling
  with QSFP-DD cages is the QFX5241-64QD.


  Configuration `chas`: QFX5241-64OD-CHAS, the spare chassis, shipped without power supplies or fan modules
  ("Spare chassis without PSUs and fans"). The supply and fan bays are shown open.


  Facts carried in the model that this schema has no field for:

  - compliance.acoustic: 86.02 dBA for the QFX5241-64OD-AO (guide Table 22)

  - compliance.nebs: designed to comply with Zone 4 earthquake requirements of NEBS GR-63-CORE, Issue
  3 (guide Table 22)

  - environmental.altitude: no performance degradation to 1828.8 m (6000 ft) at 0 to 40 C with DAC cables;
  sea level with optics (guide Table 22)

  - environmental.humidity: 5 to 90 percent noncondensing, operating

  - environmental.operating-temp: 0 to 40 C (32 to 104 F) (guide Table 22)

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container

  - features.optics-osfp: 800 GbE OSFP; ports 1, 2, 5, 6, 9, 10 and so on in the two middle rows take
  high power optics such as 800G-ZR and ZR+ (guide, Ports Panel note)

  - features.optics-sfp-plus: two SFP28 ports at 10 GbE

  - lifecycle.eol: none-announced

  - management.console: one RJ-45 console port

  - management.oob: one RJ-45 management port

  - management.timing-outputs: 1 PPS and 10 MHz clock connectors

  - management.tod: one RJ-45 time-of-day port

  - management.usb: one USB 3.0 port

  - performance.breakout-ports: 64 x 800 GbE (guide Table 3)

  - performance.osfp-speeds: 800 GbE (guide Table 3)

  - performance.throughput: 51.2 Tbps (guide Table 3)

  - physical.weight-note: 22 kg (48.50 lb) fully loaded without optics (guide Table 9)

  - platform.cpu: Intel Ice Lake D, 4 cores, 2.2 GHz

  - platform.software: Junos OS Evolved

  - platform.storage: two internal 480 GB NVMe SSDs

  - platform.switch-chip: Broadcom Tomahawk 5 (BCM78900)

  - power.power-envelope: as-tested

  - power.power-input-ac: 200 to 240 VAC, 50 to 60 Hz, 16 A (guide Table 6)

  - power.power-input-dc: -48 to -60 VDC, 80 A maximum a supply (guide Tables 6 and 17)

  - power.power-max-w: 2198

  - power.power-measurement-note: Typical and maximum power consumption of the QFX5241-64OD, guide Power
  System section; the guide gives no test conditions

  - power.power-typical-w: 613

  - power.redundancy-note: two supplies, 1+1, hot-removable and hot-insertable (guide, Component Redundancy)

  - thermal.airflow-note: AO is front-to-back (port-to-FRU, airflow out); the guide describes no back-to-front
  module

  - thermal.fans: four fan modules of two rotors, N+1 at rotor level; front-to-back only


