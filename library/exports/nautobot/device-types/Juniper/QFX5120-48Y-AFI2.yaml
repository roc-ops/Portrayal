comments: 'Juniper QFX5120-48Y, a 1RU data-centre leaf switch running Junos OS. It has 48 SFP28 ports
  (25, 10 or 1 GbE, set a quad at a time) and 8 QSFP28 ports (100 or 40 GbE, channelizable). The 56 ports
  and their lamps are on the port side. The rear carries two power supplies, five fan modules, the console,
  two RJ-45 management ports and a USB port. It also has the reset button and the four chassis lamps.
  It ships as one front panel in four power and airflow variants: AC or DC supplies, front-to-back (AIR
  OUT) or back-to-front (AIR IN).


  Configuration `ac-b2f`: QFX5120-48Y-AFI2: two 650 W AC supplies (JPSU-650W-AC-AI) and five back-to-front
  fan modules (QFX5110-FANAFI). All have a Juniper Azure Blue handle and the label AIR IN (guide Table
  7).


  Facts carried in the model that this schema has no field for:

  - environmental.altitude: no performance degradation to 1829 m (6000 ft)

  - environmental.humidity: 5 to 90 percent noncondensing

  - environmental.operating-temp: 0 to 40 C (32 to 104 F) normal operation

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container

  - features.optics-qsfp28: 100 GbE or 40 GbE; channelizes to 4 x 25 GbE, 4 x 10 GbE or 2 x 50 GbE (guide
  Table 5)

  - features.optics-sfp28: 25 GbE, 10 GbE or 1 GbE; the guide gives a restriction on 1GbE copper optics
  on older OEM part numbers

  - features.virtual-chassis: up to 2 switches; any non-channelized QSFP28 port (48 to 55) can be a virtual
  chassis port

  - lifecycle.eol: none-announced

  - management.console: RJ-45 console port (CON)

  - management.oob: two RJ-45 management ports (C0 and C1) with link and status lamps

  - management.usb: one USB port

  - performance.aggregate-throughput: 4 Tbps, bidirectional (Table 4)

  - performance.qsfp28-speeds: 100 or 40 GbE; channelizes to 4 x 25, 4 x 10 or 2 x 50 GbE

  - performance.sfp28-speeds: 25, 10 or 1 GbE, set a quad at a time; the default is 10 GbE

  - physical.depth-note: 20.48 in (52.02 cm) excluding the fan and power supply handles (Table 9)

  - physical.weight-note: 23.7 lb (10.75 kg) with two power supplies and five fan modules installed (Table
  9)

  - platform.cpu: 2.2 GHz quad-core Intel

  - platform.memory: 16 GB

  - platform.software: Junos OS, first release 18.3R1

  - platform.storage: 50 GB SSD

  - power.power-dc-max-w: 342

  - power.power-dc-typical-w: 319

  - power.power-envelope: unstated

  - power.power-input-ac: 100 to 240 VAC, 50 to 60 Hz, 6 A

  - power.power-input-dc: rated -48 to -60 VDC, operating range -40.8 to -72 VDC, 10.5 A

  - power.power-max-w: 283

  - power.power-typical-w: 155

  - power.redundancy-note: two supplies, load-sharing and fully redundant; both should be installed

  - thermal.fans: five fan modules, 4+1; the switch runs 30 seconds without thermal shutdown while one
  is replaced


