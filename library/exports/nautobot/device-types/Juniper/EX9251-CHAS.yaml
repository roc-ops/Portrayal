comments: "Juniper EX9251, a 1RU fixed-configuration core and aggregation switch that runs Junos OS, the\
  \ smaller of the two EX9250 chassis. The front has 8 SFP+ ports (10 GbE) in two rows of four, 4 rate-selectable\
  \ QSFP28 ports (100, 40 or 10 GbE), a GM/PTP SFP cage, a MGMT RJ-45, and the timing and service ports:\
  \ BITS, CON (console), ToD, a USB port, and 1PPS and 10MHz SMB connectors in and out. The rear carries\
  \ three fan trays, two power supply slots and the grounding points. The Routing Engine is built in.\
  \ One panel serves three orders: the AC model, the DC model and the spare chassis.\n\nConfiguration\
  \ `chas`: EX9251-CHAS, the spare chassis (guide Table 3). It is listed as a spare part; the guide does\
  \ not say what it ships with, so the bays are shown open, with no supplies and no fan trays. The blank\
  \ panel JNP-PWR-BLNK-1 is a separate spare.\n\nDatasheet: Juniper EX9250 Ethernet Switch Datasheet (1000632-006-EN,\
  \ Sep 2021)\n  https://web.archive.org/web/20240111201612/https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex9250-ethernet-switch-datasheet.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC 47 CFR Part 15\
  \ Class A, EN 55022, VCCI, BSMI CNS 13438, AS/NZS CISPR22 (datasheet)\n- compliance.materials: RoHS\
  \ 5/6 (datasheet)\n- compliance.nebs: SR-3580 NEBS Criteria Level 3, GR-63-Core, GR-1089-Core (as the\
  \ datasheet lists them)\n- compliance.safety: CAN/CSA-22.2 No. 60950-00/UL 1950, EN 60950, IEC 60950-1,\
  \ EN 60825-1 (datasheet)\n- compliance.seismic: Telcordia Technologies Zone 4 earthquake requirements\n\
  - environmental.altitude: up to 10,000 ft (3,048 m) with no performance degradation\n- environmental.humidity:\
  \ 5 to 90 percent noncondensing in operation; the datasheet gives 5 to 95 percent non-operating\n- environmental.operating-temp:\
  \ 0 to 40 C (32 to 104 F)\n- environmental.storage-temp: -40 to 70 C (-40 to 158 F) in the shipping\
  \ container\n- features.junos-fusion: Junos Fusion Enterprise\n- features.optics-qsfp28: QSFP28 and\
