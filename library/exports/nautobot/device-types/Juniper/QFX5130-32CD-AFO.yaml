comments: "Juniper QFX5130-32CD, a 1RU 400G data-centre leaf and spine switch running Junos OS Evolved.\
  \ It has 32 QSFP-DD ports (400, 200, 100, 50, 40, 25 or 10 GbE, channelizable) in two rows of sixteen\
  \ and two SFP+ ports (10 GbE only), all on the port side with a lamp beside each. The port side also\
  \ carries the RJ-45 console and management ports, a USB port, the reset button, the three chassis lamps,\
  \ the 10 MHz and 1 PPS output connectors and the ESD point. The rear carries two power supplies, one\
  \ at each end, and six fan modules between them. It ships as one front panel in four power and airflow\
  \ variants, AC or DC supplies with front-to-back (AIR OUT) or back-to-front (AIR IN) airflow, and as\
  \ a spare chassis with no supplies and no fan modules.\n\nConfiguration `ac-f2b`: QFX5130-32CD-AFO:\
  \ two 1600 W AC supplies (JPSU-1600W-1UACAFO) and six front-to-back fan modules (QFX5220-32CD-FANAO).\
  \ All have a Juniper gold handle and the label AIR OUT (guide Tables 3 and 17).\n\nDatasheet: QFX5130\
  \ Line of Switches Datasheet (Juniper Networks, 1000680-018-EN, July 2025)\n  https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/qfx5130-switch-datasheet.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: 47 CFR Part 15 (FCC)\
  \ Class A; ICES-003 Class A; EN 55022/EN 55032 Class A; CISPR 22/CISPR 32 Class A; EN 55024; CISPR 24;\
  \ EN 300 386; VCCI Class A; AS/NZS CISPR 32 Class A; KN32/KN35; BSMI CNS 13438 Class A; EN 61000-3-2;\
  \ EN 61000-3-3 (datasheet Table 5)\n- compliance.nebs: designed to comply with Zone 4 earthquake requirements\
  \ of NEBS GR-63-CORE, Issue 3 (guide Table 30)\n- compliance.safety: UL 60950-1:2007 R5.19; CAN/CSA-C22.2\
  \ No. 60950-1-07+A1:2011+A2:2014; IEC 62368-1:2014 and 2018; UL 62368-1:2019 R10.21; CSA C22.2 No. 62368-1:19;\
  \ IEC/EN 60825-1 (datasheet Table 5)\n- compliance.substances: RoHS; WEEE (datasheet Table 5)\n- environmental.altitude:\
  \ no performance degradation to 1829 m (6000 ft) at 0 to 40 C for AFO and 0 to 30 C for AFI (guide Table\
  \ 30; the datasheet's AFI row reads sea level at 30 C)\n- environmental.humidity: 5 to 90 percent noncondensing,\
  \ operating and non-operating\n- environmental.operating-temp: 0 to 40 C (32 to 104 F) for AFO; 0 to\
  \ 30 C for AFI (guide Table 30, datasheet Table 3)\n- environmental.storage-temp: -40 to 70 C (-40 to\
  \ 158 F) in the shipping container\n- features.optics-qsfp-dd: 400 GbE QSFP-DD optics and DAC, 400 GbE\
  \ AOC; QSFP28 100 GbE and QSFP+ 40 GbE with breakout (guide, Network Ports for QFX5130-32CD)\n- features.optics-sfp-plus:\
  \ ports 32 and 33 take 10 GbE modules only, not 1 GbE\n- features.ptp: IEEE 1588 PTP transparent and\
  \ boundary clock with hardware timestamping (datasheet)\n- lifecycle.eol: none-announced\n- management.console:\
  \ one RJ-45 console port\n- management.oob: one RJ-45 management port with link and status lamps\n-\
  \ management.timing-outputs: 10 MHz and 1 PPS output connectors\n- management.usb: one USB 2.0/3.0 port\n\
  - performance.breakout-ports: 64 x 200 GbE + 2 x 10 GbE, or 128 x 100/50/25/10 GbE + 2 x 10 GbE, or\
  \ 32 x 40 GbE + 2 x 10 GbE (datasheet Table 2)\n- performance.forwarding-capacity: 5.3 billion packets\
  \ per second (datasheet Table 2)\n- performance.packet-buffer: 132 MB shared (datasheet)\n- performance.qsfpdd-speeds:\
  \ 400 GbE default; 200, 100, 50, 40, 25 or 10 GbE with the matching optic or breakout cable (guide,\
  \ Setting Port Speed and Channelization)\n- performance.throughput: up to 12.8 Tbps unidirectional and\
  \ 25.6 Tbps bidirectional (datasheet Table 2)\n- physical.weight-note: 24.5 lb (11.11 kg) with power\
  \ supplies and fans installed (guide Table 31)\n- platform.cpu: Intel Xeon D-1500 (guide); Intel Broadwell\
  \ DE (datasheet)\n- platform.memory: 32 GB (16 GB x 2) DDR4\n- platform.software: Junos OS Evolved,\
  \ first release 20.3R1-EVO\n- platform.storage: two internal 50 GB SSDs\n- platform.switch-chip: Broadcom\
  \ Trident4\n- power.power-dc-max-w: 871\n- power.power-dc-typical-w: 341\n- power.power-envelope: as-tested\n\
  - power.power-input-ac: 100 to 240 VAC, 50 to 60 Hz; 12 A at 100 to 127 VAC, 8 A at 200 to 240 VAC (guide\
  \ Table 19)\n- power.power-input-dc: rated -48 to -60 VDC, operating -40 to -72 VDC, 35 A maximum (guide\
  \ Table 26)\n- power.power-max-w: 839\n- power.power-measurement-note: Maximum at 40 C ambient with\
  \ SR optics at 100 percent load with IMIX traffic; typical at 25 C with DACs at 50 percent load with\
  \ IMIX traffic, excluding transceivers (datasheet Table 4)\n- power.power-typical-w: 323\n- power.redundancy-note:\
  \ two supplies, 1+1, each able to carry the whole switch; both should be installed, on feeds A and B\n\
  - thermal.airflow-note: AFO is front-to-back (port-to-FRU); AFI is back-to-front (FRU-to-port); no mixing\
  \ of fans and supplies of different direction\n- thermal.fans: six fan modules, 5+1; the switch runs\
  \ three minutes without thermal shutdown while one is replaced\n\nDrawing version 0.2.0. A major bump\
  \ means a slot moved or an id was renamed, so anything cached from an earlier export may no longer line\
  \ up.\nModel maturity: modelled. Every dimension in the source records where it came from."
