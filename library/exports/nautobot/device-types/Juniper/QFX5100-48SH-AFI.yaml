comments: "Juniper QFX5100-48S, a 1RU data-centre access switch running Junos OS. It has 48 SFP+ ports\
  \ and 6 QSFP+ ports. An SFP+ port takes 10 GbE, 1 GbE or 100 Mbps optics. A QSFP+ port runs at 40 GbE\
  \ or as four 10 GbE ports. The ports and their lamps are on the port side. The rear carries two power\
  \ supplies, five fan modules, the console, two management ports, a USB port, the reset button and the\
  \ four chassis lamps. One front panel ships in four power and airflow variants. They have AC or DC supplies,\
  \ with airflow front-to-back (AIR OUT) or back-to-front (AIR IN).\n\nConfiguration `sh-ac-b2f`: QFX5100-48SH-AFI:\
  \ the 48S for Junos Fusion, which ships with the Satellite Network Operating System in place of Junos\
  \ OS. The front panel and the supplies are those of the 48S, AC only, with the three-port management\
  \ panel of Table 1. Airflow is back-to-front.\n\nDatasheet: QFX5100 Ethernet Switch Datasheet (1000480-022-EN,\
  \ July 2024)\n  https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/qfx5100-ethernet-switch-datasheet.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- environmental.altitude: no performance\
  \ degradation to 2000 m (6562 ft)\n- environmental.humidity: 5 to 90 percent noncondensing; 5 to 93\
  \ percent short term\n- environmental.operating-temp: 0 to 40 C (32 to 104 F) normal operation\n- environmental.storage-temp:\
  \ -40 to 70 C (-40 to 158 F) in the shipping container\n- features.optics-qsfp: 40 GbE QSFP+, QSFP+\
  \ direct attach and active optical cable, breakout cables to SFP+\n- features.optics-sfp-plus: 10 GbE\
  \ SFP+, 1 GbE and 100 Mbps SFP, SFP+ direct attach cable and active optical cable\n- features.virtual-chassis:\
  \ up to 10 switches in a ring; also a Virtual Chassis Fabric leaf or spine and a QFabric node\n- lifecycle.eol:\
  \ none-announced\n- management.console: RJ-45 console port (CON)\n- management.oob: management port\
  \ C0 (RJ-45, em0) and C1 (SFP, em1) with link and status lamps\n- management.usb: one USB port for image\
  \ updates\n- performance.qsfp-plus-speeds: 40 GbE; or four 10 GbE with a breakout cable\n- performance.sfp-plus-speeds:\
  \ 10 GbE with SFP+ optics; 1 GbE or 100 Mbps with SFP optics\n- performance.shared-packet-buffer: 12\
  \ MB shared packet buffer (datasheet)\n- performance.switching-capacity: 1.44 Tbps, 1.08 Bpps (datasheet)\n\
  - physical.depth-note: 20.48 in (52 cm) (Table 3)\n- physical.weight-note: 21.8 lb (9.8 kg per the guide,\
  \ 9.9 kg per the datasheet) with FRUs installed (Table 3)\n- platform.cpu: 1.5 GHz dual-core Intel\n\
  - platform.memory: 8 GB\n- platform.software: Junos OS\n- platform.storage: 32 GB SSD\n- power.power-dc-max-w:\
  \ 385\n- power.power-dc-typical-w: 300\n- power.power-envelope: unstated\n- power.power-input-ac: 110\
  \ to 240 VAC single phase (datasheet); the guide's table gives no value\n- power.power-input-dc: rated\
  \ -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum (guide Table 17)\n- power.power-max-w:\
  \ 365\n- power.power-typical-w: 230\n- power.redundancy-note: two supplies, load-sharing and fully redundant;\
  \ both should be installed\n- thermal.fans: five fan modules, hot-swappable; the switch runs 30 seconds\
  \ without thermal shutdown while one is replaced\n\nDrawing version 0.2.0. A major bump means a slot\
  \ moved or an id was renamed, so anything cached from an earlier export may no longer line up.\nModel\
  \ maturity: modelled. Every dimension in the source records where it came from."
