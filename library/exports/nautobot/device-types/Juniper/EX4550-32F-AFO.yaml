comments: 'Juniper EX4550-32F, a 1RU 10 GbE aggregation and data-centre top-of-rack switch that runs Junos
  OS. The port side has 32 SFP+ ports in two rows, each taking a 10 GbE SFP+ or a 1 GbE SFP. It also has
  a module slot with a cover panel. The LCD panel has two buttons and three lamps. There are a management
  port and two console ports. The other side carries a second module slot, three fan modules and two power
  supply slots. One panel serves five models. Four have an AC or DC supply, with air in or air out. The
  fifth is a spare chassis without supplies or fans.


  Configuration `ac-f2b`: EX4550-32F-AFO: one AC supply (JPSU-650W-AC-AFO) in slot 0, a cover panel in
  slot 1 and three front-to-back fan modules (EX4550-FAN-AFO). The labels are AFO and AIR OUT (guide Table
  4).


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: GR-63, Issue 4, Zone 4 (guide Table 28)

  - environmental.altitude: no loss of performance to 10,000 ft (3,048 m)

  - environmental.humidity: 10 to 85 percent noncondensing

  - environmental.operating-temp: 0 to 45 C (32 to 113 F)

  - features.expansion: two module slots (front and rear), EX4550-EM-8XSFP, EX4550-EM-8XT, EX4550-EM-2QSFP
  and EX4550-VC-128G

  - features.optics-sfp-plus: 10 GbE SFP+ and 1 GbE SFP in any port, in any combination

  - features.virtual-chassis: up to 10 switches, mixed with EX4200 and EX4500

  - lifecycle.end-of-life: 2024-06-30

  - lifecycle.end-of-sale: 2019-06-30

  - lifecycle.eol: announced

  - lifecycle.eol-announcement: https://www.nomios.com/news-blog/juniper-announces-end-of-life-of-popular-ex-switches/

  - management.console: mini-USB console port (active) and RJ-45 console port (passive)

  - management.oob: one RJ-45 management port with link and status lamps

  - management.usb: one USB port

  - performance.expansion-ports: up to 48 10 GbE ports with two 8-port modules, or 2 x 40 GbE with a QSFP+
  module

  - performance.sfp-plus-speeds: 10 GbE or 1 GbE on each fixed SFP+ port

  - physical.depth-note: 18.50 in (46.99 cm) (Table 6)

  - physical.weight-note: 19.4 lb (8.8 kg) with one power supply (Table 6)

  - platform.software: Junos OS, first release 12.2R1 for the 32F and 12.3R5 for the -S

  - power.power-envelope: fully-configured

  - power.power-input-ac: 100 to 120 VAC and 200 to 240 VAC, 50 to 60 Hz; 7.8 A and 3.8 A

  - power.power-input-dc: operating range -36 to -72 VDC, nominal -48 VDC, 7 A maximum

  - power.power-max-w: 336

  - power.redundancy-note: two supplies, load sharing; do not mix AC and DC, or AFI and AFO

  - thermal.fans: three fan modules and a fan in each supply; the switch runs 30 seconds while one fan
  module is replaced

  - thermal.heat-btu-h: 1146 BTU an hour at the maximum system power (Table 22)


