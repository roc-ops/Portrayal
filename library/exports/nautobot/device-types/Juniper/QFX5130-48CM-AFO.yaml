comments: "Juniper QFX5130-48C, a 1RU data-centre leaf switch running Junos OS Evolved, with 48 SFP56-DD\
  \ ports (100 GbE) for servers and 8 QSFP-DD uplink ports (400 GbE). The port side carries the 48 SFP56-DD\
  \ cages in two rows of 24, in three groups of eight columns, and the eight uplinks in two rows of four,\
  \ with a lamp for each. The fan and supply side carries the management panel at the left end: the RJ-45\
  \ management and console ports, a USB port, the reset button, the three chassis lamps, the 10 MHz and\
  \ 1 PPS output connectors, two SFP+ ports and the ESD point. Six fan modules and two power supplies\
  \ fill the rest of that side. The QFX5130-48CM has the same panel and is MACsec capable, so it is a\
  \ set of configurations of this device. Both ship in four power and airflow variants, AC or DC supplies\
  \ with front-to-back (AIR OUT) or back-to-front (AIR IN) airflow, and as a spare chassis with no supplies\
  \ and no fan modules.\n\nConfiguration `cm-ac-f2b`: QFX5130-48CM-AFO, the MACsec-capable model: two\
  \ 1600 W AC supplies (JPSU-1600W-1UACAFO) and six front-to-back fan modules (QFX5130-48C-FANAO). The\
  \ panel is the QFX5130-48C's. MACsec needs the S-QFX5KC3-MACSEC-X licence.\n\nDatasheet: QFX5130 Line\
  \ of Switches Datasheet (Juniper Networks, 1000680-018-EN, July 2025)\n  https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/qfx5130-switch-datasheet.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC 47 CFR Part 15;\
  \ ICES-003 / ICES-GEN; BS EN 55032; BS EN 55035; EN 300 386; CISPR 32; CISPR 35; IEC/EN 61000 series;\
  \ AS/NZS CISPR 32; VCCI-CISPR 32; BSMI CNS 15936; KS C 9835; KS C 9832 (datasheet Table 6)\n- compliance.safety:\
  \ UL 60950-1:2007 R5.19; CAN/CSA-C22.2 No. 60950-1-07+A1:2011+A2:2014; IEC 62368-1:2014 and 2018; UL\
  \ 62368-1:2019 R10.21; CSA C22.2 No. 62368-1:19; IEC/EN 60825-1 (datasheet Table 6)\n- compliance.substances:\
  \ RoHS; TSCA; POPs; WEEE; California Prop 65; REACH (datasheet Table 6)\n- environmental.altitude: no\
  \ performance degradation to 1829 m (6000 ft) at 0 to 40 C (guide, Environmental Specifications; datasheet\
  \ Table 3, AFI with 400G ZR optics is limited to sea level at 40 C)\n- environmental.humidity: 5 to\
  \ 90 percent noncondensing, operating and non-operating\n- environmental.operating-temp: 0 to 40 C (32\
  \ to 104 F), for AFO and for AFI (guide Table 30, datasheet Table 3)\n- environmental.storage-temp:\
  \ -40 to 70 C (-40 to 158 F) in the shipping container\n- features.macsec: QFX5130-48CM only, with the\
  \ S-QFX5KC3-MACSEC-X licence: 32 x 100G SFP56-DD and 4 x 400G QSFP-DD ports support MACsec, up to 9.6\
  \ Tbps bidirectional (guide, product overview)\n- features.optics-qsfp-dd: 400 GbE QSFP-DD optics on\
  \ ports 48 to 55; breakout cables for 100/25/10 GbE (datasheet)\n- features.optics-sfp-dd: 100 GbE SFP56-DD\
  \ cables and 400 GbE AOCs on ports 0 to 47 (guide, Network Ports for QFX5130-48C)\n- features.optics-sfp-plus:\
  \ ports 56 and 57 take 10 GbE modules only, on the rear management panel\n- lifecycle.eol: none-announced\n\
  - management.console: one RJ-45 console port\n- management.oob: one RJ-45 management port with link\
  \ and status lamps\n- management.timing-outputs: 10 MHz and 1 PPS output connectors\n- management.usb:\
  \ one USB port\n- performance.breakout-ports: 16 x 200 GbE + 48 x 100/50/25/10 GbE + 2 x 10 GbE, or\
  \ 72 x 100/50/25/10 GbE + 2 x 10 GbE, or 74 x 10 GbE (datasheet Table 2)\n- performance.forwarding-capacity:\
  \ 2.7 billion packets per second (datasheet Table 2)\n- performance.network-port-speeds: ports 0 to\
  \ 47 default to 100 GbE with SFP56-DD optics; ports 48 to 55 default to 400 GbE with QSFP-DD optics\
  \ (guide, Setting Port Speed and Channelization)\n- performance.packet-buffer: 82 MB shared (datasheet\
  \ Table 2)\n- performance.throughput: up to 8 Tbps unidirectional and 16 Tbps bidirectional (datasheet\
  \ Table 2)\n- physical.weight-note: 27 lb (12.24 kg) with power supplies and fans installed (guide Table\
  \ 31)\n- platform.cpu: Intel Ice Lake, 4 core (datasheet Table 2)\n- platform.memory: 32 GB (16 GB x\
  \ 2) DDR4\n- platform.software: Junos OS Evolved, first release 23.4R1-S1-EVO for the QFX5130-48C and\
  \ 23.4R2-S1-EVO for the QFX5130-48CM\n- platform.storage: two internal 100 GB SSDs (datasheet Table\
  \ 2); the guide's RMA procedure describes two SSDs\n- platform.switch-chip: Broadcom Trident4\n- power.power-dc-max-w:\
  \ 587\n- power.power-dc-typical-w: 238\n- power.power-envelope: as-tested\n- power.power-input-ac: 100\
  \ to 127 VAC and 200 to 240 VAC, 50 to 60 Hz; 12 A at 100 to 127 VAC, 9 A at 200 to 240 VAC (guide Table\
  \ 20)\n- power.power-input-dc: rated -48 to -60 VDC, operating -40 to -72 VDC, 40 A maximum (guide Table\
  \ 27)\n- power.power-max-w: 609\n- power.power-measurement-note: Maximum at 40 C ambient with SR optics\
  \ at 100 percent load with IMIX traffic; typical at 25 C with DACs at 50 percent load with IMIX traffic,\
  \ excluding transceivers (datasheet Table 4)\n- power.power-typical-w: 219\n- power.redundancy-note:\
  \ two supplies, 1+1, each able to carry the whole switch; both should be installed, on feeds A and B\n\
  - thermal.airflow-note: AFO is front-to-back (port-to-FRU); AFI is back-to-front (FRU-to-port); no mixing\
  \ of fans and supplies of different direction\n- thermal.fans: six fan modules, redundant at the rotor\
  \ level; the switch runs 240 seconds without thermal shutdown while one is replaced\n\nDrawing version\
  \ 0.1.0. A major bump means a slot moved or an id was renamed, so anything cached from an earlier export\
  \ may no longer line up.\nModel maturity: modelled. Every dimension in the source records where it came\
  \ from."
