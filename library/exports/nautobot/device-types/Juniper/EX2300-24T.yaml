  - environmental.humidity: 10 to 85 percent, noncondensing

  - environmental.operating-temp-c: 0 to 45

  - features.optics-sfp-plus: hardware guide, Uplink Ports: the four uplink ports take SFP and SFP+ transceivers.
  A Virtual Chassis can be formed with SFP+ and not with SFP

  - features.virtual-chassis: up to four switches; the -VC part number ships with the Virtual Chassis
  licence on paper, the other part numbers do not

