comments: 'Juniper EX2300-24T is a fixed 1RU Gigabit Ethernet access switch. It has 24 10/100/1000BASE-T
  ports without PoE and four built-in 10-Gigabit SFP+/SFP uplink ports. The front carries the 24 jacks
  in two stacked rows numbered 0 to 23, and the upper jack of a column takes the even number. It also
  carries the four uplinks numbered 0 to 3, three status lamps, three port-mode lamps, a Factory Reset/Mode
  button and a mini-USB console port. The rear carries the management Ethernet port with a USB port under
  it, the RJ-45 console port, a two-hole earthing terminal and an ESD point. It also carries one exhaust
  fan and the AC power cord inlet. The power supply and the fan are built into the chassis, so there are
  no bays. The -TAA and -VC part numbers are the same chassis. The -DC part number is the same front with
  a DC terminal block on the rear. The EX2300-24P is the same front with PoE.


  Configuration `ac`: EX2300-24T - 24 10/100/1000 ports without PoE and four SFP+/SFP uplinks, built-in
  AC supply and one built-in fan, front-to-back airflow. Table 1, no Virtual Chassis licence.


  Facts carried in the model that this schema has no field for:

