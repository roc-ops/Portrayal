comments: 'Juniper QFX5120-48T, a 1RU data-centre access switch running Junos OS. It has 48 10GBASE-T
  ports (10 or 1 GbE) and 6 QSFP28 ports (100 or 40 GbE, channelizable). The 54 ports and their lamps
  are on the port side. The rear carries two power supplies, five fan modules, the console and one RJ-45
  management port. It also has a USB port, the PPS OUT and 10M OUT timing ports, the reset button and
  the four chassis lamps. It ships as one front panel in four power and airflow variants. They have AC
  or DC supplies, with airflow front-to-back (AIR OUT) or back-to-front (AIR IN). An 850 W high-voltage
  supply is orderable separately and is not modelled.


  Configuration `dc-b2f`: QFX5120-48T-DC-AFI: two 650 W DC supplies (JPSU-650W-DC-AFI) and five back-to-front
  fan modules (QFX5110-FANAFI). The front panel is the same (guide Tables 7 and 36).


  Facts carried in the model that this schema has no field for:

  - environmental.altitude: no performance degradation to 1829 m (6000 ft)

  - environmental.humidity: 5 to 90 percent noncondensing

  - environmental.operating-temp: 0 to 40 C (32 to 104 F) normal operation

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container

  - features.optics-qsfp28: 100 GbE or 40 GbE; channelizes as in guide Table 5

  - features.timing: PPS OUT and 10M OUT measurement ports (DIN 1.0/2.3, TTL 5 V); PTP supported

  - features.virtual-chassis: up to 2 switches of the same model; any non-channelized QSFP28 port (48
  to 53) can be a virtual chassis port, from 20.2R1

  - lifecycle.eol: none-announced

  - management.console: RJ-45 console port (CON)

  - management.oob: one RJ-45 management port (MGMT) with link activity and status lamps

  - management.usb: one USB port

  - performance.aggregate-throughput: 2.16 Tbps, bidirectional (Table 4)

  - performance.qsfp28-speeds: 100 or 40 GbE. Ports 50 and 51 channelize to 4 x 25 or 4 x 10 GbE. Ports
  48 to 53 channelize to 2 x 50 GbE (Table 5)

  - performance.rj45-speeds: 10 or 1 GbE (guide Table 16)

  - physical.depth-note: 20.48 in (52.02 cm) excluding the fan and power supply handles (Table 9)

  - physical.weight-note: 24.25 lb (11 kg) with two power supplies and five fan modules installed (Table
  9)

  - platform.cpu: 2.2 GHz quad-core Intel

  - platform.memory: 16 GB

  - platform.software: Junos OS, first release 20.2R1

  - platform.storage: 100 GB SSD

  - power.power-dc-max-w: 227

  - power.power-dc-typical-w: 222

  - power.power-envelope: unstated

  - power.power-input-ac: 100 to 240 VAC, 50 to 60 Hz, 5 A

  - power.power-input-dc: rated -48 to -60 VDC, operating range -44 to -72 VDC, 10 A maximum

  - power.power-max-w: 251

  - power.power-typical-w: 202

  - power.redundancy-note: two supplies, load-sharing and fully redundant; both should be installed

  - thermal.fans: five fan modules, 4+1; the switch runs 30 seconds without thermal shutdown while one
  is replaced


