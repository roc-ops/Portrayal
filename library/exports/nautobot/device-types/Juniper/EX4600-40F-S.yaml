comments: "Juniper EX4600-40F, a 1RU 10 GbE campus aggregation and small data-centre switch that runs\
  \ Junos OS. The port side has 24 SFP+ ports (10 or 1 GbE) and 4 QSFP+ ports (40 GbE). It also has two\
  \ expansion module bays, which hold a QFX-EM-4Q or an EX4600-EM-8F or a cover panel. The other side\
  \ carries the management panel, five fan modules and two power supplies. One panel serves five models.\
  \ Four have AC or DC supplies, with air in or air out. The fifth is a spare chassis without supplies\
  \ or fans.\n\nConfiguration `s`: EX4600-40F-S, the spare chassis. It ships with no power supplies and\
  \ no fan modules, which are ordered separately (guide Table 3). The datasheet says front-to-back airflow.\
  \ The bays are open.\n\nDatasheet: Juniper EX4600 Ethernet Switch Datasheet (1000511-016-EN, Sep 2021)\n\
