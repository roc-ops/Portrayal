comments: 'Juniper MX240 Universal Routing Platform - a 5RU, 3 Tbps-class modular edge router with horizontal
  cards. Four slots under the craft interface: DPC/MPC slots 2 and 1, the shared SCB1/DPC0 slot, and SCB0;
  the Routing Engines seat inside the SCBs. Up to four power supplies (AC or DC) across the rear top,
  with the fan tray and air filter installing vertically at the rear sides.


  Configuration `base`: Chassis only - what you spec before deciding what goes in it. The 4 slot bays
  are EMPTY; cooling, craft, psus are populated. Enough to power on and reach the box, which is the question
  most people ask first and the one `default` used to answer with whatever the drawing happened to be
  populated with.


