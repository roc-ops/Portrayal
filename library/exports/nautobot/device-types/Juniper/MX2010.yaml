comments: 'Juniper MX2010 - the 34RU half-height member of the MX2000 family. Craft interface and EMI
  cover at the top; an upper cage with a CB-RE at each end and eight Switch Fabric Boards between them;
  a lower cage of ten vertical MPC slots (LC 0-9, each seated through an adapter card); and at the rear
  a nine-module PSM wall between the two power distribution modules, with fan trays behind the grilles
  at both ends.


  Configuration `base`: Chassis only - what you spec before deciding what goes in it. The 10 slot bays
  are EMPTY; psus, res, sfbs are populated. Enough to power on and reach the box, which is the question
  most people ask first and the one `default` used to answer with whatever the drawing happened to be
  populated with.


  Facts carried in the model that this schema has no field for:

  - power.note: -48 V telecom pool, 2.5 kW of it reserved for PSM redundancy

  - power.pool-w: 22500


  Drawing version 0.2.6. A major bump means a slot moved or an id was renamed, so anything cached from
  an earlier export may no longer line up.

  Model maturity: modelled. Every dimension in the source records where it came from.'
