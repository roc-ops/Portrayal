comments: 'Juniper EX4500-40F, a 2RU 10 GbE aggregation and data-centre top-of-rack switch that runs Junos
  OS. The port side has 40 SFP+ ports in two rows, each taking a 10 GbE SFP+ or a 1 GbE SFP. It also has
  two uplink module slots with cover panels. The LCD panel has two buttons and three lamps. There is an
  RJ-45 console port, a management port and a USB port. The other side carries two power supply slots,
  one fan tray and a rear module slot. The slot takes an intraconnect module or a Virtual Chassis module.
  One panel serves eight models. They differ in the supply (AC or DC), the airflow and the rear module.


  Configuration `bf-c`: EX4500-40F-BF-C: the -BF with hardware that supports Data Center Bridging. The
  panels are the same.


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: GR-63, Issue 4, Zone 4 (guide Table 35)

  - environmental.altitude: no loss of performance to 10,000 ft (3,048 m)

  - environmental.humidity: 10 to 85 percent noncondensing

  - environmental.operating-temp: 0 to 45 C (32 to 113 F)

  - features.expansion: two uplink module slots, each one 4-port SFP+ module; the rear slot takes the
  intraconnect or the Virtual Chassis module

  - features.optics-sfp-plus: 10 GbE SFP+ and 1 GbE SFP in any port

  - features.virtual-chassis: up to 10 switches mixed with EX4200 and EX4550; the Virtual Chassis module
  or SFP+ ports as VCPs

  - lifecycle.end-of-life: 2022-12-31

  - lifecycle.eol: announced

  - lifecycle.eol-announcement: https://endoflife.ai/juniper-ex/EX4500

  - management.console: one RJ-45 console port

  - management.oob: one RJ-45 management port with link and status lamps

  - management.usb: one USB port

  - performance.expansion-ports: up to 8 more SFP+ ports with two 4-port uplink modules

  - performance.sfp-plus-speeds: 10 GbE or 1 GbE on each fixed SFP+ port

  - physical.depth-note: 21.1 in (53.6 cm) (Table 5)

  - physical.weight-note: 37 lb (17 kg) with one AC power supply (Table 5)

  - platform.software: Junos OS, first release 10.2R1 for the -FB and -BF models

  - power.power-envelope: unstated

  - power.power-input-ac: 100 to 120 VAC and 200 to 240 VAC, 50 to 60 Hz; 12 A and 6 A

  - power.power-input-dc: operating range -42 to -60 VDC, nominal -48 VDC, 30 A maximum

  - power.power-supply-output: 1000 W at 100 to 120 VAC and 1200 W at 200 to 240 VAC; 1200 W on DC

  - power.redundancy-note: two supplies, load sharing; do not mix AC and DC, or front-to-back and back-to-front

  - thermal.fans: one fan tray with five fans; the switch runs 30 seconds while the tray is replaced


