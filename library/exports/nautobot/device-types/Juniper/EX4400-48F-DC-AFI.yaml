comments: 'Juniper EX4400-48F campus access switch with fibre ports, 1RU. It has 36 SFP ports for 100
  Mbps or 1GbE optics. It has 12 SFP/SFP+ ports for 1GbE or 10GbE optics. They sit in 24 columns of two
  cages. The front also holds a USB-C console port, the chassis and port mode lamps, a mode button and
  one extension module slot. The rear holds two 100GbE QSFP28 ports, console, management and USB-A ports,
  two fan modules and two power supply slots. A shipped switch carries one 550 W supply, two fan modules
  and covers on the empty slots. The configurations give the supply type and the airflow, and the -S spare
  ships with no supply and no fans.


  Configuration `dc-afi`: One 550 W DC supply and two fan modules with back-to-front airflow (AIR IN label,
  blue handle) and covers on the empty slots (EX4400-48F-DC-AFI).


  Rack mounting positions: flush ("flush with the front panel"), mid ("along the middle of the side panels"),
  recessed ("recessed inside a four-post rack"; 4-post only).


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: Tested for Zone 4 earthquake according to NEBS GR-63-CORE, Issue 5

  - environmental.acoustic-noise: 43.23 dB(A) typical with one 550 W AC supply and front-to-back airflow
  (Table 115)

  - environmental.altitude: no performance degradation up to 1828.8 m (6000 ft) at 40 C

  - environmental.humidity: 5 to 90 percent noncondensing

  - environmental.operating-temp: 0 C to 45 C (32 F to 113 F)

  - environmental.storage-temp: -40 C to 70 C (-40 F to 158 F) in the shipping container

  - features.extension-slot: one slot for the EX4400-EM-4S, EX4400-EM-4Y or EX4400-EM-1C module

  - features.macsec: AES-256 on all SFP and SFP+ network ports and the SFP28 and QSFP28 extension module
  ports

  - features.optics-qsfp28: The two rear ports take 100GbE QSFP28 or 40GbE QSFP+ transceivers (40G from
  Junos OS 22.1R1). Breakout cables give 4x25G and 4x10G. The exact list is in the Hardware Compatibility
  Tool

  - features.optics-sfp: 100 Mbps and 1 GbE SFP transceivers on ports 0 to 35; 1G SFP-T copper transceivers
  take 10, 100 and 1000 Mbps

  - features.optics-sfp-plus: 10 GbE SFP+ and 1 GbE SFP transceivers on ports 36 to 47; the exact list
  is in the Hardware Compatibility Tool

  - features.qsfp28-channelization: each QSFP28 port runs as 100G, as 40G from Junos OS 22.1R1, or channelized

  - features.virtual-chassis: up to 10 switches over the QSFP28 ports, which are Virtual Chassis ports
  by default

  - lifecycle.eol: none-announced

  - management.cloud: Juniper Mist Wired Assurance, and the Junos CLI and J-Web

  - management.console: USB-C on the front and RJ-45 (CON) on the rear

  - management.oob: MGMT RJ-45 on the rear, 10/100/1000, with link activity and status lamps

  - management.usb: USB-A on the rear

  - performance.throughput: 348 Gbps unidirectional, 696 Gbps bidirectional

  - physical.depth-with-modules: 430.0 mm with power supply and fan modules; 440.7 mm with an extension
  module as well

  - physical.mounting: two-post kit EX-RMK in the box; four-post kit EX-4PST-RMK and wall kit EX-WMK separate

  - physical.weight: 6.65 kg with no supply, fan or extension module (EX4400-48F); -AFI 6.94 kg, -DC and
  -DC-AFI 6.89 kg, -S 5.8 kg

  - platform.cpu: quad-core x86

  - platform.memory: 4 GB DDR4 with ECC

  - platform.storage: 20 GB eMMC

  - thermal.heat-dissipation: 388.74 BTU/hr idle and 412.61 at 100 percent traffic with a 550 W AC supply;
  429.66 and 453.53 with a 550 W DC supply


  Drawing version 0.1.3. A major bump means a slot moved or an id was renamed, so anything cached from
