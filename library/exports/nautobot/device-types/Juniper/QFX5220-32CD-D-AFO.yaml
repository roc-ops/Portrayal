comments: 'Juniper QFX5220-32CD, a 1RU 400G data-centre spine and leaf switch that runs Junos OS Evolved.
  It has 32 QSFP-DD ports (400, 100, 40, 25 or 10 GbE, channelizable) in two rows of sixteen and two SFP+
  ports (10 GbE only). All ports are on the port side, and each has a lamp beside it. The port side also
  carries an RJ-45 time-of-day port and four clock connectors (PPS and 10 MHz, in and out). It has an
  RJ-45 console port, an RJ-45 management port, a USB port, the reset button, three chassis lamps and
  the ESD point. The rear carries two power supplies, one at each end, and six fan modules between them.
  It ships as one front panel in four power and airflow variants, AC or DC supplies with front-to-back
  (AIR OUT) or back-to-front (AIR IN) airflow. A spare chassis has no supplies and no fan modules.


  Configuration `dc-f2b`: QFX5220-32CD-D-AFO: two 1600 W DC supplies (JPSU-1600W-1UDCAFO) and six front-to-back
  fan modules. Each supply has a single feed, so feeds A and B go one to each.


  Facts carried in the model that this schema has no field for:

  - compliance.emc: FCC 47 CFR Part 15 Class A. EN 55022 Class A. VCCI Class A. BSMI CNS 13438 Class A.
  AS/NZS CISPR 22 Class A. EN 55024. CISPR 24. EN 300 386. EN 61000-3-2. EN 61000-3-3. (guide, Agency
  Approvals for the QFX Series)

  - compliance.nebs: designed to comply with Zone 4 earthquake requirements of NEBS GR-63-CORE, Issue
  3 (guide Table 31)

  - compliance.safety: CAN/CSA-C22.2 No. 60950-1; UL 62368-1; IEC 62368-1:2014; IEC 60950-1:2005/A2:2013
  (CB scheme); EN 60825-1 (guide, Agency Approvals for the QFX Series)

  - environmental.altitude: no performance degradation to 1828.8 m (6000 ft) at 0 to 40 C for AFO and
  0 to 25 C for AFI (guide Table 31)

  - environmental.humidity: 5 to 90 percent noncondensing, operating

  - environmental.operating-temp: 0 to 40 C (32 to 104 F) for AFO; 0 to 25 C (32 to 77 F) for AFI (guide
  Table 31)

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container

  - features.optics-qsfp-dd: 400 GbE QSFP-DD DAC, 400 GbE AOC, QSFP28 100 GbE, QSFP+ 40 GbE with breakout
  (guide, Network Ports)

  - features.optics-sfp-plus: ports 32 and 33 take 10 GbE modules only, not 1 GbE

  - features.ptp: clock input and output connectors for 10 MHz and 1 PPS, and an RJ-45 time-of-day port

  - lifecycle.eol: none-announced

  - management.console: one RJ-45 console port

  - management.oob: one RJ-45 management port with link and status lamps

  - management.timing-outputs: PPS and 10 MHz clock connectors, in and out, and an RJ-45 time-of-day port

  - management.usb: one USB 2.0/3.0 port

  - performance.qsfpdd-speeds: 400 GbE default; 100, 40, 25 or 10 GbE with the matching optic or breakout
  cable (guide, Setting Port Speed and Channelization)

  - performance.throughput: 12.8 Tbps (guide, QFX5220-32CD Switch Description)

  - physical.weight-note: 24.5 lb (11.11 kg) with power supplies and fans installed (guide Table 32)

  - platform.cpu: Intel Xeon D-1500 (guide)

  - platform.software: Junos OS Evolved, first release 19.1R1 (the DC build 19.3R1)

  - platform.storage: two internal 50 GB SSDs

  - power.power-dc-max-w: 860

  - power.power-dc-typical-w: 328

  - power.power-envelope: as-tested

  - power.power-input-ac: 100 to 240 VAC, 50 to 60 Hz; 12.7 A at 100 to 127 VAC, 9.4 A at 200 to 240 VAC
  (guide Table 19)

  - power.power-input-dc: rated -48 to -60 VDC, operating -40 to -72 VDC, 40 A maximum (guide Table 26)

  - power.power-max-w: 834

  - power.power-measurement-note: Maximum at 40 C ambient with SR optics at 100 percent load with IMIX
  traffic. Typical at 25 C with DACs at 50 percent load with IMIX traffic, excluding transceivers (guide
  Table 19)

  - power.power-typical-w: 310

  - power.redundancy-note: two supplies, 1+1, each able to carry the whole switch; both should be installed,
  on feeds A and B

  - thermal.airflow-note: AFO is front-to-back (port-to-FRU); AFI is back-to-front (FRU-to-port); no mixing
  of fans and supplies of different direction

  - thermal.fans: six fan modules, 5+1; the switch runs three minutes without thermal alarm while one
  is replaced


  Drawing version 0.2.0. A major bump means a slot moved or an id was renamed, so anything cached from
