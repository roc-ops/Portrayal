comments: 'Juniper EX4000-24T, a fixed 1U access switch with 24 10/100/1000BASE-T ports and no PoE. The
  front also has two SFP+ Virtual Chassis ports and two SFP+ uplink ports, a USB 2.0 Type-A port, a reset
  pinhole and the SYS, MST and CLD status lamps. The rear has an RJ-45 management port, an RJ-45 console
  port, one exhaust fan, an earthing terminal and the AC inlet. The power supply and the fan are built
  into the chassis, so there are no bays. Airflow is front to back. The EX4000-24P has the same front
  with PoE+ legends.


  Configuration `ac`: The switch as shipped: 24 non-PoE ports, the built-in AC power supply and one built-in
  front-to-back fan. EX4000-24T is the only hardware SKU the datasheet lists for the model (Table 1 and
  the ordering information); there is no DC, back-to-front, -S or -TAA variant.


  Rack mounting positions: flush ("front-mount"; ears level with the face; as shipped), recessed ("2-in.
  recess"; ears 50.8 mm behind the face).


  Facts carried in the model that this schema has no field for:

  - compliance.acoustic: 23.1 dBA (guide Table 4, no PoE load applies)

  - compliance.seismic: tested for Zone 4 earthquake safety

  - environmental.altitude: 3000 m operating, 4500 m storage

  - environmental.humidity: 5 to 90 percent at 40 C, noncondensing

  - environmental.operating-temp: 0 to 50 C at sea level, 0 to 45 C up to 1500 m, 0 to 40 C up to 3000
  m

  - features.optics-sfp-plus: the two Virtual Chassis ports and the two uplink ports are 1GE or 10GE SFP+
  ports (Table 17 and Figure 11 callout 8). Virtual Chassis is supported only with 10GE SFP+, and not
  with a 10GBASE-T transceiver in a Virtual Chassis port

  - features.uplink-ports: two SFP+ ports take 1 GbE or 10 GbE transceivers

  - features.virtual-chassis: up to 6 EX4000 switches; the two Virtual Chassis ports are SFP+ and VC formation
  is not supported with a 10GBASE-T transceiver in them

  - lifecycle.eol: none-announced

  - management.console: RJ-45 console on the rear panel, labelled CON

  - management.oob: management Ethernet RJ-45 on the rear panel, with a link activity lamp and a status
  lamp

  - management.usb: one USB 2.0 Type-A port on the front panel

  - physical.depth-note: 8.43 in (21.40 cm), Table 17; 8.42 in in the datasheet

  - physical.weight-note: 6.3 lb (2.9 kg), Table 26; 2.89 kg in the datasheet

  - platform.first-junos-release: 24.4R1-S2 (Table 16)

  - power.power-envelope: bare

  - power.power-input: 100 to 240 VAC at 1.5 A, 50 to 60 Hz (Table 34)

  - power.power-max-w: 43

  - thermal.cooling: one inbuilt fan, front-to-back airflow, 9 CFM (datasheet)


