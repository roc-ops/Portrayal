comments: 'Juniper QFX5220-128C, a 4RU 100G data-centre spine switch that runs Junos OS Evolved. It has
  128 QSFP28 ports (100 or 40 GbE, 32 of them channelizable to 4 x 25 GbE) and two SFP+ ports (10 GbE
  only). The QSFP28 ports stand in four rows of 32, as stacked pairs, and each port has four lamps. The
  port side also carries an RJ-45 time-of-day port and four clock connectors (PPS and 10 MHz, in and out).
  It has an RJ-45 console port, an RJ-45 management port, a USB port, the reset button, three chassis
  lamps and the ESD point. The rear carries four power supplies and six two-fan modules. It ships in AC
  and DC builds with front-to-back (AIR OUT) airflow only. A spare chassis has no supplies and no fan
  modules.


  Configuration `ac-f2b`: QFX5220-128C-AFO: four 1600 W AC supplies (JPSU-1600W-AC-AFO) and six front-to-back
  fan modules (QFX5220-128C-FANAO). All have a Juniper gold handle and the label AIR OUT (guide Tables
  3, 16 and 18).


  Facts carried in the model that this schema has no field for:

  - compliance.emc: FCC 47 CFR Part 15 Class A. EN 55022 Class A. VCCI Class A. BSMI CNS 13438 Class A.
  AS/NZS CISPR 22 Class A. EN 55024. CISPR 24. EN 300 386. EN 61000-3-2. EN 61000-3-3. (guide, Agency
  Approvals for the QFX Series)

  - compliance.nebs: designed to comply with Zone 4 earthquake requirements of NEBS GR-63-CORE, Issue
  3 (guide Table 31)

  - compliance.safety: CAN/CSA-C22.2 No. 60950-1; UL 62368-1; IEC 62368-1:2014; IEC 60950-1:2005/A2:2013
  (CB scheme); EN 60825-1 (guide, Agency Approvals for the QFX Series)

  - environmental.altitude: no performance degradation to 1828.8 m (6000 ft) at 0 to 40 C (guide Table
  31)

  - environmental.humidity: 5 to 90 percent noncondensing, operating

  - environmental.operating-temp: 0 to 40 C (32 to 104 F) (guide Table 31)

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container

  - features.optics-qsfp28: 100 GbE QSFP28 and DAC, QSFP28 to SFP28 breakout DAC, 100 GbE AOC, 40 GbE
  QSFP+ and DAC (guide, Network Ports)

  - features.optics-sfp-plus: ports 128 and 129 take SFP+ modules at 10 GbE (the guide also says 1 GbE;
  see gaps)

  - features.ptp: clock input and output connectors for 10 MHz and 1 PPS, and an RJ-45 time-of-day port

  - lifecycle.eol: none-announced

  - management.console: one RJ-45 console port

  - management.oob: one RJ-45 management port (1000BASE-T)

  - management.timing-outputs: PPS and 10 MHz clock connectors, in and out, and an RJ-45 time-of-day port

  - management.usb: one USB 2.0 port

  - performance.qsfp28-speeds: 100 GbE and 40 GbE; 4 x 25 GbE on ports 0, 4, 8 to 124 (guide, Port Configurations)

  - performance.throughput: 12.8 Tbps (guide, QFX5220-128C Switch Description)

  - physical.weight-note: 98 lb (44.45 kg) with power supplies and fans installed, 76 lb (34.47 kg) chassis
  only (guide Table 32)

  - platform.cpu: Intel Xeon D-1518 (guide)

  - platform.software: Junos OS Evolved, first release 19.2R1 (the guide names it the QFX5200-128C at
  that point)

  - platform.storage: two internal 50 GB SSDs

  - power.power-dc-max-w: 1530

  - power.power-dc-typical-w: 955

  - power.power-envelope: as-tested

  - power.power-input-ac: 100 to 240 VAC, 50 to 60 Hz; 19.36 A at 100 to 127 VAC, 10.95 A at 200 to 240
  VAC (guide Table 19)

  - power.power-input-dc: rated -48 to -60 VDC, operating -40 to -72 VDC, 40 A maximum (guide Table 26)

  - power.power-max-w: 1506

  - power.power-measurement-note: Maximum at 40 C ambient with SR optics at 100 percent load with IMIX
  traffic. Typical at 25 C with DACs at 50 percent load with IMIX traffic (guide Table 19)

  - power.power-typical-w: 942

  - power.redundancy-note: four supplies, 2+2. The switch can run on two supplies if one is in slot 0
  or 1 and the other in slot 2 or 3

  - thermal.airflow-note: AFO only, front-to-back (port-to-FRU); the 128C is not sold with back-to-front
  airflow

  - thermal.fans: six fan modules of two fans each, (5x2+1)+1; the switch runs 30 seconds without thermal
  shutdown while one is replaced


  Drawing version 0.2.1. A major bump means a slot moved or an id was renamed, so anything cached from
  an earlier export may no longer line up.

  Model maturity: modelled. Every dimension in the source records where it came from.'
