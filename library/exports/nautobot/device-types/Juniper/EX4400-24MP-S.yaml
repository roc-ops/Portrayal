comments: 'Juniper EX4400-24MP campus access switch, 1RU. It has 24 multigigabit RJ-45 ports with IEEE
  802.3bt PoE of up to 90 W per port. Each port runs at 100 Mbps, 1, 2.5, 5 or 10 Gbps. The front also
  holds a USB-C console port, the chassis and port mode lamps, a mode button and one extension module
  slot. The rear holds two 100GbE QSFP28 ports, console, management and USB-A ports, two fan modules and
  two power supply slots. A shipped switch carries one 1050 W AC supply, two front-to-back fan modules
  and covers on the empty slots. The -S spare ships with no supply and no fans.


  Configuration `s`: The spare chassis EX4400-24MP-S. It ships with no power supply and no fan modules,
  and they are ordered separately. The guide lists 2000 W DC as its supply and the AFO fan module.


  Rack mounting positions: flush ("flush with the front panel"), mid ("along the middle of the side panels"),
  recessed ("recessed inside a four-post rack"; 4-post only).


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: Tested for Zone 4 earthquake according to NEBS GR-63-CORE, Issue 5

  - environmental.acoustic-noise: 46.11 dB(A) typical with one 1050 W AC supply and front-to-back airflow
  (Table 115)

  - environmental.altitude: no performance degradation up to 1828.8 m (6000 ft) at 40 C

  - environmental.humidity: 5 to 90 percent noncondensing

  - environmental.operating-temp: 0 C to 45 C (32 F to 113 F)

  - environmental.storage-temp: -40 C to 70 C (-40 F to 158 F) in the shipping container

  - features.extension-slot: one slot for the EX4400-EM-4S, EX4400-EM-4Y or EX4400-EM-1C module

  - features.macsec: AES-256 on all RJ-45, SFP and SFP+ network ports and the SFP28 and QSFP28 extension
  module ports

  - features.optics-qsfp28: The two rear ports take 100GbE QSFP28 or 40GbE QSFP+ transceivers (40G from
  Junos OS 22.1R1). Breakout cables give 4x25G and 4x10G. The exact list is in the Hardware Compatibility
  Tool

  - features.qsfp28-channelization: each QSFP28 port runs as 100G, as 40G from Junos OS 22.1R1, or channelized

  - features.virtual-chassis: up to 10 switches over the QSFP28 ports, which are Virtual Chassis ports
  by default

  - lifecycle.eol: none-announced

  - management.cloud: Juniper Mist Wired Assurance, and the Junos CLI and J-Web

  - management.console: USB-C on the front and RJ-45 (CON) on the rear

  - management.oob: MGMT RJ-45 on the rear, 10/100/1000, with link activity and status lamps

  - management.usb: USB-A on the rear

  - performance.throughput: 540 Gbps unidirectional, 1080 Gbps bidirectional

  - physical.depth-with-modules: 430.0 mm with power supply and fan modules; 440.7 mm with an extension
  module as well

  - physical.mounting: two-post kit EX-RMK in the box; four-post kit EX-4PST-RMK and wall kit EX-WMK separate

  - physical.weight: 7.07 kg with no power supply, fan module or extension module (EX4400-24MP); 6.06
  kg for the -S

  - platform.cpu: quad-core x86

  - platform.memory: 4 GB DDR4 with ECC

  - platform.storage: 20 GB eMMC

  - power.poe-budget-1050w: 753 W with one supply and 1776 W with two, at 110 V and at 230 V

  - power.poe-budget-1600w: 753 W at 110 V and 1290 W at 230 V with one supply, 1776 W and 2160 W with
  two

  - power.poe-budget-2000w-dc: 1680 W with one 2000 W DC supply and 2160 W with two, for the -S spare

  - power.poe-budget-earlier-junos: 780 W with one 1050 W supply and 1800 W with two (Junos OS 22.2R1
  and earlier)

  - power.poe-standard: IEEE 802.3bt (PoE-bt), fast PoE and perpetual PoE, up to 90 W per port on 24 ports

  - power.power-redundancy: 1+1 with two supplies of one rating

  - thermal.heat-dissipation: 467.17 BTU/hr idle and 477.4 at 100 percent traffic with a 1050 W AC supply;
  6339.19 and 6346.01 with PoE


  Drawing version 0.1.2. A major bump means a slot moved or an id was renamed, so anything cached from
