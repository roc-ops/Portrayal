comments: "Juniper EX4300-48T - a fixed 1RU Gigabit Ethernet access switch with 48 10/100/1000BASE-T ports\
  \ (no PoE) and four built-in 40-Gigabit QSFP+ ports on the rear panel that are Virtual Chassis ports\
  \ by default. The front carries the 48 jacks in two stacked rows, an LCD panel with Menu and Enter buttons,\
  \ three chassis status lamps, a mini-USB console port and a slot for an optional uplink module, which\
  \ ships covered. The rear carries the management and console jacks, a USB port, the four QSFP+ ports,\
  \ two fan modules and two power supply slots; as shipped it holds one 350 W AC power supply, front-to-back\
  \ (AIR OUT) fan modules and a cover panel over the second power supply slot. The same chassis is ordered\
  \ back-to-front (EX4300-48T-AFI), with a 550 W DC supply (EX4300-48T-DC, and back-to-front EX4300-48T-DC-AFI)\
  \ or as the spare chassis EX4300-48T-S with the supplies and fans ordered separately. The EX4300-48P\
  \ is the same front with PoE+.\n\nConfiguration `ac`: EX4300-48T as shipped - one 350 W AC power supply\
  \ (AIR OUT) in slot 0 with a cover panel over slot 1, two EX4300-FAN (AIR OUT) fan modules, and the\
  \ uplink slot covered. Front-to-back airflow.\n\nDatasheet: EX4300 Line of Ethernet Switches Datasheet\
  \ (Juniper Networks, PDF created 2022-07-25)\n  https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex4300-line-of-ethernet-switches-datasheet.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.rohs: RoHS 6/6 (datasheet)\n\
  - environmental.acoustic-noise: 37.8 dBA AC AFO, 38.9 dBA AC AFI, 39.7 dBA DC AFO and DC AFI (datasheet\
  \ Table 3, ISO 7779 at 23 C)\n- environmental.altitude: up to 3049 m operating (10,000 ft); 4877 m non-operating\n\
  - environmental.humidity: 10 to 85 percent noncondensing operating; 0 to 95 percent non-operating\n\
  - environmental.operating-temp: 0 to 45 C (32 to 113 F) for AFO models; 0 to 35 C for AFI models\n-\
  \ environmental.storage-temp: -40 to 70 C\n- features.macsec: IEEE 802.1AE on all Gigabit Ethernet and\
  \ 10 Gigabit Ethernet ports\n- features.optics-qsfp: 40GbE QSFP+ SR (multimode) and DAC direct-attach\
  \ copper (datasheet, Supported Optics)\n- features.uplink-module: one slot; 4-port 1/10 GbE SFP+ EX-UM-4X4SFP\
  \ (not part of the shipping configuration)\n- features.virtual-chassis: up to 10 members; the four rear\
  \ QSFP+ ports are Virtual Chassis ports by default\n- lifecycle.eol: none-announced\n- management.console:\
  \ mini-USB on the front, RJ-45 CON2 on the rear\n- management.lcd: 2 lines of 16 characters with Menu\
  \ and Enter buttons\n- management.oob: MGMT RJ-45 with link activity and status lamps (rear)\n- management.usb:\
  \ one USB port on the rear\n- performance.airflow-cfm: fan 22 CFM, each power supply 7.5 CFM; 59 CFM\
  \ total with two supplies (datasheet)\n- performance.mac-addresses-max: 64000\n- performance.switching-capacity:\
  \ 248 Gbps unidirectional, 496 Gbps bidirectional, 64-byte packets (datasheet)\n- performance.throughput:\
  \ 369 Mpps wire speed for the 48-port models (datasheet)\n- physical.depth-no-psu: 416.1 mm (16.38 in)\
  \ with no power supply or uplink module (Table 10)\n- physical.depth-with-uplink: 457.3 mm (18 in, 45.73\
  \ cm) with a power supply and an uplink module (Table 10)\n- physical.uplink-module-weight: 0.44 lb\
  \ (0.2 kg) for the 4-port EX-UM-4X4SFP\n- physical.weight: 13 lb (5.9 kg) with no power supply and no\
  \ fan module; 16.1 lb (7.3 kg) with one power supply and two fan modules\n- platform.cpu: 1.5 GHz dual-core\
  \ PowerPC\n- platform.memory: 2 GB DRAM with ECC\n- platform.storage: 2 GB\n- power.power-base-w: 175\n\
  - power.psu-redundancy: N+0 or N+N; up to two supplies, one is enough for the chassis\n\nDrawing version\
  \ 0.2.0. A major bump means a slot moved or an id was renamed, so anything cached from an earlier export\
  \ may no longer line up.\nModel maturity: modelled. Every dimension in the source records where it came\
