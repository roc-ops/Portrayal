comments: 'Juniper EX3300-48P, a 1U access switch with 48 10/100/1000BASE-T PoE+ ports. It has four SFP
  or SFP+ uplink ports, an LCD panel with Menu and Enter buttons and three chassis lamps on the front.
  The rear has a management port, a USB port, an RJ-45 console port and a redundant power system port.
  It also has an earthing terminal, a built-in fan and an AC power cord inlet. The power supply and the
  fan are built into the chassis. Its non-PoE sibling, the EX3300-48T, is a separate device.


  Configuration `ac`: The switch as shipped (Table 3) - AC powered, with front-to-back airflow. 740 W
  is available for PoE.


  Rack mounting positions: flush ("front-mount"; ears level with the face; as shipped), recessed ("2-in.
  recess"; ears 50.8 mm behind the face), rear ("rear-mount").


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: Complies with Zone 4 earthquake requirements as per GR-63, Issue 4 (Table 19)

  - environmental.altitude: no performance degradation up to 3048 m (10,000 ft) (Table 19)

  - environmental.humidity: 10 to 85 percent, noncondensing (Table 19)

  - environmental.operating-temp: 0 to 45 C (32 to 113 F) (Table 19)

  - features.optics-sfp-plus: the uplink ports take SFP and SFP+ transceivers, singly or mixed (Pluggable
  Transceivers Supported on EX3300 Switches, page 61)

  - features.uplink-ports: four SFP or SFP+ ports on the front

  - features.virtual-chassis: up to 10 switches. Uplink ports 2 and 3 are Virtual Chassis ports by default
  and ports 0 and 1 are network ports

  - lifecycle.end-of-sale: 2019-06-30

  - lifecycle.end-of-support: 2024-06-30

  - lifecycle.eol: announced

  - management.console: RJ-45 console on the rear panel

  - management.lcd: LCD panel with two lines of 16 characters and Menu and Enter buttons

  - management.oob: management Ethernet RJ-45 on the rear panel, with a Link/Activity lamp and a Status
  lamp

  - management.usb: one USB port on the rear panel

  - physical.weight: 5.8 kg (12.8 lb) (Table 5)

  - physical.width-with-brackets: 482 mm (19 in.) with the mounting brackets attached (Table 5)

  - platform.first-junos-release: 11.3R1 (Table 3)

  - power.poe-budget-w: 740 W available for PoE (Tables 3 and 14)

  - power.poe-standard: PoE+ (IEEE 802.3at) on all 48 ports, at most 30 W per port and 25.5 W guaranteed
  (Power Supply in EX3300 Switches)

  - power.power-current-max: 7 A at 100 VAC and 2.9 A at 230 VAC for a switch with PoE ports (Table 15)

  - power.power-envelope: bare

  - power.power-input-ac: 100 through 240 VAC, 50 or 60 Hz (Table 15)

  - power.power-max-w: 91

  - thermal.cooling: two fans, one along the rear and one along the left side of the chassis (Cooling
  System)


