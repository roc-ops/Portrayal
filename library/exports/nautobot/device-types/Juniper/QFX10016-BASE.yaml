comments: 'Juniper QFX10016 - the 21RU, sixteen-slot modular chassis of the QFX10000 family. Two QFX10000-RE
  Routing and Control Boards stack under the badge strip beside the status lamp panel. Sixteen full-width
  line-card slots (0 to 15, top to bottom) fill the front below them in four banks of four. The rear is
  a ten-high power supply stack (PSU 0 to 9) with the earthing terminal and ESD point below it. Two full-height
  fan trays stand beside it and cover the switch interface boards. Cooling is front-to-back (port-to-FRU,
  airflow out). Line cards are ordered separately and are not modelled here.


  Configuration `base`: QFX10016-BASE (guide Table 3, datasheet ordering information). One QFX10000-RE
  with its RCB cover over the second slot. Five QFX10000-PWR-AC supplies, with a cover over each of the
  other five supply slots. Two QFX10016-FAN trays and sixteen line card covers. Two fan tray controllers
  and five QFX10016-SF boards sit inside. Line cards and cable management are ordered separately.


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: Designed to meet GR-63 Zone 4 earthquake requirements

  - environmental.altitude: up to 3,048 m (10,000 ft)

  - environmental.humidity: 5 to 90 percent noncondensing operating, 5 to 95 percent nonoperating

  - environmental.operating-temp: 0 C to 40 C (32 F to 104 F)

  - environmental.storage-temp: -40 C to 70 C (-40 F to 158 F)

  - management.console: RJ-45 console (CON) on each RCB

  - management.oob: MGMT RJ-45 (em0), 10/100/1000BASE-T, and MGMT SFP (em1), on each RCB

  - management.usb: one USB 2.0 port on each RCB

  - performance.ports-max: 2,304 x 10GbE, 576 x 40GbE or 480 x 100GbE (datasheet Table 1, with sixteen
  30C cards)

  - performance.throughput: up to 96 Tbps (datasheet Table 1; the guide gives a net switching capacity
  of 96 Tbps with six SIBs); 7.2 Tbps per slot

  - physical.weight-base-kg: 236.78

  - physical.weight-empty-kg: 99.79

  - physical.weight-redundant-kg: 270.34

  - platform.cpu: Intel quad-core 2.5 GHz

  - platform.fabric: six switch interface boards, five required and the sixth for n+1; midplane-less

  - platform.memory: 32 GB SDRAM

  - platform.storage: 50 GB onboard SSD, plus an optional SATA SSD of 50 GB or 100 GB in the RCB

  - power.power-envelope: bare

  - power.power-max-w: 5815

  - power.power-typical-scope: datasheet - base system, line cards not included; redundant system 4,618
  W typical and 6,630 W reserved

  - power.power-typical-w: 3989

  - thermal.airflow: port-to-FRU (airflow out, front-to-back); two fan trays of 21 fans each

  - thermal.heat-dissipation: 91,729 BTU/hr (26,883 W) maximum thermal output, estimated and subject to
  change


