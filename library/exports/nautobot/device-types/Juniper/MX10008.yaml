comments: 'Juniper MX10008 - the 13RU, eight-slot MX10000 chassis. Two JNP10K-RE1 Routing and Control
  Boards stack under the badge strip beside the status lamp panel; eight full-width line-card slots (FPC
  0-7) fill the front in two banks of four. The rear is a six-high PSU stack beside two tall fan trays
  covering the Switch Interface Boards.


  Configuration `base`: Chassis only - what you spec before deciding what goes in it. The 8 slot bays
  are EMPTY; cooling, psus, res are populated. Enough to power on and reach the box, which is the question
  most people ask first and the one `default` used to answer with whatever the drawing happened to be
  populated with. The line-card slots are drawn EMPTY rather than blanked, which is not the intent: no
  MX10000-series line-card blank is modelled, and none is named in the staged guides - they document power-supply
  cover panels only. Every other chassis in the library seats a blank here.


