comments: 'Juniper QFX5200-48Y, a 1RU data-centre leaf switch running Junos OS. It has 48 SFP28 ports
  (10 GbE by default, 25 GbE in groups of four) numbered 0 to 47, and six QSFP28 ports (100 or 40 GbE)
  numbered 48 to 53. The port side also carries the RJ45 management port and console, a USB port, the
  reset button and the five chassis status lamps. The FRU side carries six fan modules between two power
  supplies. It ships as one front panel with AC or DC supplies, front-to-back (AIR OUT) or back-to-front
  (AIR IN).


  Configuration `ac-afo`: QFX5200-48Y: two 650 W AC supplies (QFX520048Y-APSU-AO) and six front-to-back
  fan modules (QFX520048Y-FAN-AO). All carry the guide''s red colour for airflow out (Tables 17 and 19).
  The guide names no chassis part number for the other builds, so they are examples.


  Rack mounting positions: flush (ears level with the face; as shipped).


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: Designed to comply with Zone 4 earthquake requirements per NEBS GR-63-CORE, Issue
  3 (Table 30 wording)

  - environmental.altitude: no performance degradation to 3962 m (13000 ft)

  - environmental.humidity: 5 to 93 percent noncondensing for airflow out, 10 to 93 percent for airflow
  in

  - environmental.operating-temp: 0 to 45 C for airflow-out models, 0 to 40 C for airflow-in models

  - environmental.storage-temp: -40 to 70 C in the shipping container

  - features.optics-qsfp28: 100 GbE QSFP28, 40 GbE QSFP+, AOC and DACBO (40 GbE to 4 x 10 GbE)

  - features.optics-sfp28: 25 GbE SFP28 and 10 GbE SFP+ transceivers and DAC cables; 25 GbE AOC on the
  QSFP28 side

  - features.virtual-chassis: not supported (standalone only)

  - lifecycle.eol: none-announced

  - management.console: RJ-45 console port

  - management.oob: one RJ-45 management port (Mgmt, 10/100/1000 BASE-T)

  - management.usb: one USB port

  - performance.aggregate-throughput: 3.6 Tbps, full duplex (guide)

  - performance.qsfp28-speeds: 100 or 40 GbE, auto-detected from the optic; channelizes to 4 x 10 GbE
  at 40 GbE

  - performance.sfp28-speeds: 10 GbE by default; 25 GbE in groups of four ports (12 groups)

  - physical.weight-note: 30.00 lb (13.60 kg) in Table 31; the installation safety text says 20.78 to
  21.16 lb (9.43 to 9.6 kg) with supplies and fans

  - platform.cpu: 2.2 GHz quad-core Intel

  - platform.memory: 16 GB

  - platform.software: Junos OS, first release 18.1R1

  - platform.storage: 32 GB SSD

  - power.power-dc-max-w: 470

  - power.power-dc-typical-w: 315

  - power.power-envelope: unstated

  - power.power-input-ac: 100 to 240 VAC, 50 to 60 Hz, 7.8 A at 100 to 120 VAC or 3.8 A at 200 to 240
  VAC

  - power.power-input-dc: rated -48 to -60 VDC, 21 A (25 A to 11 A across -36 to -72 VDC)

  - power.power-max-w: 430

  - power.power-typical-w: 382

  - power.redundancy-note: two supplies, load-sharing; AC and DC of one airflow may be mixed in the 48Y

  - thermal.fans: six fan modules; the switch runs 30 seconds without thermal shutdown while one is replaced


