comments: 'Juniper QFX10002-60C, a fixed 2RU deep-buffer spine and core switch with 60 QSFP28 ports in
  two bands of 30. Every port auto-senses a 100 GbE QSFP28 or a 40 GbE QSFP+ transceiver, and any 40 GbE
  port can be channelized to four 10 GbE interfaces with breakout cables. The management panel at the
  right of the front has an RJ-45 management port above an RJ-45 console, an SFP management port, an SFP
  PTP Ethernet port, 1PPS and 10 MHz timing connectors, a USB port and four status lamps. The rear has
  four 1600 W power supply bays numbered down the columns, all filled, three fan modules of the 60C''s
  own type and an ESD point. Cooling is port-to-FRU (front-to-back) only. The AC, the DC and the spare
  chassis builds are configurations.


  Configuration `dc`: The DC build QFX10002-60C-DC (Table 1): four 1600 W DC supplies. Mixing AC and DC
  supplies in one chassis is not supported.


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: Designed to comply with Zone 4 earthquake requirements per NEBS GR-63-CORE, Issue
  3

  - environmental.altitude: no performance degradation to 1828.8 m (6000 ft)

  - environmental.humidity: 5 to 90 percent noncondensing; short term 5 to 93 percent

  - environmental.operating-temp: 0 C to 40 C (32 F to 104 F)

  - environmental.storage-temp: -40 C to 70 C (-40 F to 158 F) in the shipping container

  - features.timing: 1PPS and 10 MHz SMB connectors and a PTP Ethernet SFP port

  - management.console: RJ-45 console (CON), RS-232

  - management.oob: MGMT RJ-45 (em0), 10/100/1000BASE-T, and MGMT SFP (em1), 1000BASE-X

  - management.usb: one USB port

  - performance.packet-buffer: deep buffer from hybrid memory cubes (HMC)

  - performance.throughput: 12 Tbps and 4 Bpps of forwarding capacity (Q5 ASICs); 192 x 10 GbE, 60 x 40
  GbE or 60 x 100 GbE ports (Tables 2 and 8)

  - physical.mounting: four-post rack kit in the box; spare kits EX4500-4PST-RMK

  - physical.weight: 41 kg (90.39 lb) with four supplies and three fan modules fitted, AC or DC (Table
  30; the rack-mounting topic gives 36.5 kg, 80.5 lb)

  - platform.asic: Q5 packet forwarding ASICs with hybrid memory cubes

  - platform.cpu: 2.5-GHz quad-core Intel

  - platform.memory: 32 GB SDRAM

  - platform.storage: two 64 GB SSDs

  - power.power-envelope: fully-configured

  - power.power-max-w: 2500

  - power.power-typical-w: 2000

  - power.psu-ac-input: 100 to 127 VAC and 200 to 240 VAC at 50 to 60 Hz, 11.5 A at 100-120 VAC (Table
  21); each supply has one input

  - power.psu-dc-input: -48 to -60 VDC rated, -40 to -72 VDC operating range, 57.5 A maximum (Table 25);
  a 40 A breaker is recommended

  - power.psu-redundancy: four bays, 2N recommended; one supply at 220 VAC or two at 110 VAC run the 60C

  - thermal.airflow: port-to-FRU (airflow out, front-to-back); three 80 W fan modules at 150 CFM each,
  and fans in the supplies

  - thermal.heat-dissipation: 6,825 BTU/hr typical and 8,530 BTU/hr maximum (Tables 21 and 25)


  Drawing version 0.1.0. A major bump means a slot moved or an id was renamed, so anything cached from
