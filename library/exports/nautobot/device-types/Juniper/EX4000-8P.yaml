comments: 'Juniper EX4000-8P, a compact fanless access switch with eight 10/100/1000BASE-T PoE+ ports
  (30 W per port, 120 W budget), two further 10/100/1000BASE-T ports without PoE and two SFP+ uplink ports
  that the CLI can turn into Virtual Chassis ports. The front also carries the RJ-45 management port over
  a USB 2.0 Type-A port, the RJ-45 console port, a reset pinhole and the SYS, MST and CLD status lamps.
  The rear has the AC inlet, a perforated vent field and the earthing terminal. The power supply is built
  into the chassis and the switch has no fan, so there are no bays. It stands on a desk by default; the
  optional two-post kit EX4000-2PST-RMK mounts it in a rack.


  Configuration `ac`: The switch as shipped: eight PoE+ ports, two non-PoE ports, two SFP+ uplinks, the
  built-in AC power supply and no fan. EX4000-8P is the only hardware SKU the datasheet lists for the
  model (Table 1 and the ordering information); there is no DC, -S or -TAA variant.


  Desktop unit; not rack-mounted.


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: tested for Zone 4 earthquake safety

  - environmental.altitude: 3000 m operating, 4500 m storage

  - environmental.humidity: 5 to 90 percent at 40 C, noncondensing

  - environmental.operating-temp: 0 to 50 C at sea level, 0 to 45 C up to 1500 m, 0 to 40 C up to 3000
  m

  - features.optics-sfp-plus: the two uplink ports are 1GE or 10GE SFP+ ports (Table 7 and Figure 1 callout
  10). Virtual Chassis is supported only with 10GE SFP+, and not with a 10GBASE-T transceiver in a Virtual
  Chassis port. Industrial-grade optics are required above 35 C for under-the-desk mounting and above
  40 C otherwise

  - features.uplink-ports: two SFP+ ports take 1 GbE or 10 GbE transceivers

  - features.virtual-chassis: up to 6 EX4000 switches; the SFP+ ports 2 and 3 can be turned into Virtual
  Chassis ports with the CLI, and the ports 0 and 1 do not support Virtual Chassis

  - lifecycle.eol: none-announced

  - management.console: RJ-45 console on the front panel, labelled CON

  - management.oob: management Ethernet RJ-45 on the front panel, with a link activity lamp and a status
  lamp

  - management.usb: one USB 2.0 Type-A port on the front panel

  - physical.depth-note: 9.64 in (24.5 cm), Table 7; 9.57 in in the datasheet

  - physical.weight-note: 5.73 lb (2.60 kg), Table 26; 2.55 kg in the datasheet

  - platform.first-junos-release: 24.4R1-S2 (Table 6)

  - power.poe-budget-w: 120

  - power.poe-standard: PoE+ (IEEE 802.3at) on the eight PoE+ ports, 30 W per port; the two ports 0 and
