comments: 'Juniper EX4100-F-48P is a fixed 1RU access switch with 48 10/100/1000BASE-T ports that all
  supply PoE+ (30 W by default), four 1/10GbE SFP+ Virtual Chassis ports and four 10GbE SFP+ uplink ports.
  The front carries the jacks in two stacked rows numbered 0 to 47, the two 2x2 cage groups, the chassis
  and port mode lamps, a Factory Reset/Mode button, a reset pinhole and a USB Type-C console port. The
  rear carries the management port with a USB port under it, the RJ-45 console port, the earthing terminal,
  an ESD point, two fans and the AC inlet. The 850 W supply and both fans are built into the chassis,
  so there are no bays.


  Configuration `ac`: EX4100-F-48P as shipped - 48 PoE+ jacks, four Virtual Chassis and four uplink SFP+
  cages, the built-in 850 W AC supply and two built-in front-to-back fans (Tables 14 and 26).


  Rack mounting positions: flush ("front-mount"; ears level with the face; as shipped), recessed ("2-in.
  recess"; ears 50.8 mm behind the face; 4-post only).


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: tested for Zone 4 earthquake safety

  - environmental.acoustic-noise: 46.2 dB typical and 46.5 dB maximum LpA with 850 W AC AFO (Table 21)

  - environmental.altitude: no performance degradation up to 1524 m (5000 ft)

  - environmental.humidity: 10 to 85 percent, noncondensing

  - environmental.operating-temp: 0 to 45 C (32 to 113 F); 40 C with a 10GBASE-T pluggable

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container

  - features.uplink-ports: four front SFP+ ports taking 1G SFP and 10G SFP+ singly or mixed

  - features.virtual-chassis: up to 10 EX4100 and EX4100-F switches; the four left cages are the Virtual
  Chassis ports. The uplink ports cannot be used as Virtual Chassis ports, and a 10GBASE-T transceiver
  cannot form a Virtual Chassis in a Virtual Chassis port

  - lifecycle.eol: none-announced

  - physical.weight: 5.2 kg (5200 g), Table 15

  - platform.first-junos-release: 22.2R1 (Table 14)

  - power.poe-budget-w: 740 W (system budget 87 W, total 827 W of the 850 W supply), Table 30

  - power.poe-standard: PoE+ on all 48 ports, 30 W by default (Table 15)

  - power.power-current-max: 12 A, as printed on the rear panel

  - power.power-envelope: bare

  - power.power-input-ac: 100 through 240 VAC, 50/60 Hz (Table 28)

  - power.power-max-w: 100

  - thermal.cooling: two built-in fans, front-to-back airflow (Table 26)

  - thermal.heat-dissipation: 341 BTU/hr at the 100 W maximum input without PoE (Table 27)


