comments: "Juniper EX9204, a 5 U modular Ethernet switch of the EX9200 family that runs Junos OS. It is\
  \ built on the MX240 chassis. Four horizontal slots sit under the craft interface. These are line card\
  \ slots 2 and 1, the shared slot 1|0 and slot 0 for the Switch Fabric. The shared slot takes a line\
  \ card or a Switch Fabric module. Each Switch Fabric module carries a Routing Engine. Four power supply\
  \ bays sit across the top of the rear. The air filter and the fan tray are at the rear sides. The EX9200\
  \ line cards are a family of their own and are not modelled: their slots show blank panels.\n\nConfiguration\
  \ `base3c-ac`: EX9204-BASE3C-AC: one EX9200-SF3 module with one EX9200-RE2, one fan tray and two 2520\
  \ W AC supplies in PEM0 and PEM1 for low line. Blank panels fill the line card slots and slot 1|0.\n\
  \nRack mounting positions: flush (as shipped), mid (\"center-mount\").\n\nDatasheet: EX9200 Ethernet\
  \ Switch Datasheet (1000432-022-EN, Aug 2022)\n  https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex9200-ethernet-switch-datasheet.pdf\n\
