comments: 'Juniper MX960 - the 16RU chassis that turns the MX240/MX480 family vertical: fourteen card
  slots stand side by side in the cage (six line slots, SCB0/SCB1, then six more, the first of which doubles
  as SCB2 in redundant fabric configurations). The craft interface spans the top with one status cluster
  per slot; fan trays sit horizontally above and below the cage behind bezels, and the standard cable
  manager hangs under it. Four tall AC supplies fill the rear under the inlet strip.


  Configuration `base`: Chassis only - what you spec before deciding what goes in it. The 12 slot bays
  are EMPTY; psus, scbs are populated. Enough to power on and reach the box, which is the question most
  people ask first and the one `default` used to answer with whatever the drawing happened to be populated
  with.


  Facts carried in the model that this schema has no field for:

  - physical.weight-max-kg: 169.64

  - power.base-system-w: 50

  - power.cooling-system-w: 640 W high-capacity at full speed (450 W typical at normal speed); normal-capacity
  600 W (400 W typical) - Table 95

  - power.power-envelope: unstated

  - power.power-typical-scope: AC typical power draw from the MX Series family datasheet, which names
  no configuration, ambient or side; DC 6670 W

  - power.power-typical-w: 6520

  - thermal.max-thermal-output: AC 27,007 BTU/h (7920 W); DC 18,987 BTU/h (5568 W) (Table 84; provisioning
  ceiling)


  Drawing version 5.0.1. A major bump means a slot moved or an id was renamed, so anything cached from
  an earlier export may no longer line up.

  Model maturity: modelled. Every dimension in the source records where it came from.'
