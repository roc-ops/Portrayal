comments: "Juniper EX4300-24P - a fixed 1RU Gigabit Ethernet access switch with 24 10/100/1000BASE-T ports,\
  \ every one Power over Ethernet (PoE+), and four built-in 40-Gigabit QSFP+ ports on the rear panel that\
  \ are Virtual Chassis ports by default. The front carries the 24 jacks in two stacked rows, an LCD panel\
  \ with Menu and Enter buttons, three chassis status lamps, a mini-USB console port and a slot for an\
  \ optional uplink module, which ships covered. The rear carries the management and console jacks, a\
  \ USB port, the four QSFP+ ports, two fan modules and two power supply slots; as shipped it holds one\
  \ 715 W AC power supply, front-to-back (AIR OUT) fan modules and a cover panel over the second power\
  \ supply slot. The EX4300-24P-S is the same chassis with the power supplies and fan modules ordered\
  \ separately. The EX4300-24T is the same front without PoE.\n\nConfiguration `s`: EX4300-24P-S - the\
  \ spare chassis, shipped with no power supply and no fan module; either AC or DC supplies and AIR OUT\
  \ or AIR IN fans are ordered separately, and the datasheet's spare-chassis matrix says which combinations\
  \ are supported. The supply and fan bays are shown open.\n\nDatasheet: EX4300 Line of Ethernet Switches\
  \ Datasheet (Juniper Networks, PDF created 2022-07-25)\n  https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex4300-line-of-ethernet-switches-datasheet.pdf\n\
