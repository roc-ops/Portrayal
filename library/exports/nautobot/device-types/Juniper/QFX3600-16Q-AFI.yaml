comments: 'Juniper QFX3600-16Q, an end-of-life 1RU data-centre switch running Junos OS as a standalone
  switch, a member of a QFX Virtual Chassis or a Node device in a QFabric system. It has 16 QSFP+ ports,
  Q0 to Q15, each running at 40 GbE or as four 10 GbE ports. The ports and their lamps are on the port
  side, with the LCD, the three chassis lamps, the console, a USB port and four management ports (C0 and
  C1 are 1000BASE-T RJ-45, C0S and C1S are 1 Gbps SFP). The other side carries two power supplies and
  three fan trays. One chassis ships in two airflow builds, port-to-FRU (AFO) or FRU-to-port (AFI), and
  takes AC or DC supplies.


  Configuration `ac-b2f`: QFX3600-16Q-AFI: two 650 W AC supplies (JPSU-650W-AC-AFI) and three fan trays
  (QFXC01-FANBI). All have FRU-to-port airflow, which the library calls back-to-front (guide Tables 11
  and 12). The supplies have blue handles lettered AFI.


  Facts carried in the model that this schema has no field for:

  - environmental.altitude: no performance degradation to 3048 m (10000 ft)

  - environmental.humidity: 5 to 85 percent noncondensing

  - environmental.operating-temp: 0 to 40 C (32 to 104 F) normal operation; -5 to 55 C short term

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container

  - features.optics-qsfp: QSFP+ transceivers, QSFP+ DAC and DAC breakout cables, fibre breakout to four
  10GBASE-SR SFP+

  - features.qfabric: a Node device, or an Interconnect device in a QFX3000-M system, connected by the
  first QSFP+ ports

  - features.virtual-chassis: up to 10 switches with QFX3500, QFX3600, QFX5100 and EX4300 members; a Virtual
  Chassis Fabric leaf

  - lifecycle.eol: announced

  - lifecycle.eol-announcement: https://support.juniper.net/support/?p=qfx3500

  - management.console: RJ-45 console port (CON)

  - management.lcd: an LCD showing the host name and the number of active alarms

  - management.oob: management ports C0 and C1 (1000BASE-T RJ-45) and C0S and C1S (1 Gbps SFP), with link-speed
  and activity lamps; an SFP in C0S or C1S disables the RJ-45 port beside it

  - management.usb: one USB port

  - performance.qsfp-plus-speeds: 40 GbE; or four 10 GbE with a breakout cable

  - physical.depth-note: 19.3 in (49 cm) excluding FRU handles and locking levers; 19.4 in (49.3 cm) including
