comments: 'Juniper EX2300-24MP is a fixed 1RU Multigigabit access switch. It has 24 PoE+ ports, all with
  380 W available: eight 100/1000/2500BASE-T ports and sixteen 10/100/1000BASE-T ports, and four built-in
  10-Gigabit SFP+/SFP uplink ports. The front carries the 24 jacks in three shells of two stacked rows,
  numbered 0 to 23 with the upper jack of a column taking the even number (the first shell, ports 0 to
  7, is the Multigigabit one), the four uplinks in two stacked pairs numbered 0 to 3, the three system
  lamps (MGT, FAN, PW), the management Ethernet port with the RJ-45 console port under it, and a USB port.
  The rear carries the earthing terminal and the AC power cord inlet. The power supply and the three fans
  are built into the chassis (the fans along the right side panel, moving air from side to side), so there
  are no bays. It has no mini-USB console port and no mode button. The -TAA and -VC part numbers are not
  listed for it in the guide.


  Configuration `ac`: EX2300-24MP - 24 PoE+ ports (eight Multigigabit) and four SFP+/SFP uplinks, built-in
  AC supply and three built-in fans, side-to-side airflow. Table 1, no Virtual Chassis licence.


