comments: 'Juniper EX2200-C-12P is the compact, fanless member of the EX2200 line: a 1RU-high Gigabit
  Ethernet access switch 269 mm wide with 12 10/100/1000BASE-T ports, all with PoE+ and 100 W available,
  and two dual-purpose uplink ports, each an RJ-45 port beside an SFP port of which only one is active
  at a time. The front carries the 12 jacks in two stacked rows numbered 0 to 11 (the upper jack of a
  column takes the even number), the two dual-purpose uplinks numbered 0 and 1, a USB port, the management
  Ethernet port with the RJ-45 console port above it, a mini-USB console port, two chassis status lamps,
  four port-mode lamps and a Factory Reset/Mode button. The rear carries the earthing terminal, an ESD
  point, a heatsink and the AC power cord inlet; there are no fans. The power supply is built into the
  chassis, so there are no bays. The EX2200-C-12T is the same front without PoE.


  Configuration `ac`: EX2200-C-12P-2G - 12 PoE+ ports and two dual-purpose uplinks, built-in AC supply,
