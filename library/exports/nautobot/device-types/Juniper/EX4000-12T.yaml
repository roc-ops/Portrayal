comments: 'Juniper EX4000-12T, a compact fanless access switch with 12 10/100/1000BASE-T ports and no
  PoE. The front carries the 12 jacks in two rows, four SFP+ cages (the first two are Virtual Chassis
  ports and the other two uplinks), the RJ-45 management port over a USB 2.0 Type-A port, the RJ-45 console
  port, a reset pinhole and the SYS, MST and CLD status lamps. The rear has the AC inlet and the earthing
  terminal and nothing else. The power supply is built into the chassis and the switch has no fan, so
  there are no bays. It stands on a desk by default; the optional two-post kit EX4000-2PST-RMK mounts
  it in a rack. The EX4000-12P has the same front with PoE+ legends.


  Configuration `ac`: The switch as shipped: 12 non-PoE ports, the built-in AC power supply and no fan.
  EX4000-12T is the only hardware SKU the datasheet lists for the model (Table 1 and the ordering information);
  there is no DC, -S or -TAA variant.


  Desktop unit; not rack-mounted.


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: tested for Zone 4 earthquake safety

  - environmental.altitude: 3000 m operating, 4500 m storage

  - environmental.humidity: 5 to 90 percent at 40 C, noncondensing

  - environmental.operating-temp: 0 to 50 C at sea level, 0 to 45 C up to 1500 m, 0 to 40 C up to 3000
  m

  - features.optics-sfp-plus: the two Virtual Chassis ports and the two uplink ports are 1GE or 10GE SFP+
  ports (Table 9 and Figure 3 callout 10). Virtual Chassis is supported only with 10GE SFP+, and not with
  a 10GBASE-T transceiver in a Virtual Chassis port. Industrial-grade optics are required above 35 C for
  under-the-desk mounting and above 40 C otherwise

  - features.uplink-ports: two SFP+ ports take 1 GbE or 10 GbE transceivers

  - features.virtual-chassis: up to 6 EX4000 switches; the two Virtual Chassis ports are SFP+ and VC formation
  is not supported with a 10GBASE-T transceiver in them

  - lifecycle.eol: none-announced

  - management.console: RJ-45 console on the front panel, labelled CON

  - management.oob: management Ethernet RJ-45 on the front panel, with a link activity lamp and a status
  lamp

  - management.usb: one USB 2.0 Type-A port on the front panel

  - physical.depth-note: 9.64 in (24.5 cm), Table 9; 9.57 in in the datasheet

  - physical.weight-note: 5.07 lb (2.30 kg), Table 26

  - platform.first-junos-release: 24.4R1-S2 (Table 8)

  - power.power-envelope: bare

