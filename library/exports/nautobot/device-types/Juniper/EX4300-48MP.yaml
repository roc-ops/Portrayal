comments: "Juniper EX4300-48MP - a fixed 1RU multigigabit access switch with 24 10/100/1000BASE-T ports\
  \ and 24 100/1000/2500/5000/10000BASE-T ports, every one a 95 W PoE++ port, and four dedicated 40-Gigabit\
  \ QSFP+ Virtual Chassis ports on the rear panel. The front carries the 48 jacks in two stacked rows,\
  \ the second half of them outlined in orange, a status block with three chassis lamps, four port mode\
  \ lamps, a mode button and a mini-USB console port, and a slot for an optional uplink module, which\
  \ ships covered. The rear carries the management, USB and console jacks, a reset pinhole, two fan modules\
  \ either side of the four QSFP+ ports and two power supply slots; as shipped it holds one 1400 W AC\
  \ power supply, front-to-back (AIR OUT) fan modules and a cover over the second power supply slot. The\
  \ EX4300-48MP-S is the same chassis with the power supplies and fan modules ordered separately. It takes\
  \ AC supplies only, front-to-back.\n\nConfiguration `ac`: EX4300-48MP as shipped - one 1400 W AC power\
  \ supply (AIR OUT) in slot 0 with a cover panel over slot 1, two EX4300-48MP-FAN (AIR OUT) fan modules,\
  \ and the uplink slot covered. Front-to-back airflow.\n\nDatasheet: EX4300 Line of Ethernet Switches\
  \ Datasheet (Juniper Networks, PDF created 2022-07-25)\n  https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex4300-line-of-ethernet-switches-datasheet.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC 47 CFR Part 15\
  \ Class A, EN 55022 Class A, ICES-003 Class A, VCCI Class A, AS/NZS CISPR 22 Class A, CISPR 22 Class\
  \ A, EN 55024, EN 300386, CE\n- compliance.nebs: GR-1089-CORE EMC and electrical safety for network\
  \ telecommunications equipment (listed by the datasheet; no level stated)\n- compliance.rohs: RoHS 6/6\
  \ (datasheet)\n- compliance.safety: UL 60950-1, UL 62368-1, CAN/CSA C22.2 No. 60950-1 and 62368-1, EN\
  \ 60950-1, IEC 60950-1 and IEC 62368-1\n- environmental.acoustic-noise: 53.7 dBA with a 1400 W AC AFO\
  \ supply (datasheet Table 3, ISO 7779 at 23 C)\n- environmental.altitude: up to 3049 m operating (10,000\
  \ ft); 4877 m non-operating\n- environmental.humidity: 10 to 85 percent noncondensing operating; 0 to\
  \ 95 percent non-operating\n- environmental.operating-temp: 0 to 45 C (32 to 113 F) for AFO models\n\
  - environmental.storage-temp: -40 to 70 C\n- features.macsec: IEEE 802.1AE MACsec AES256 on all access\
  \ and uplink ports\n- features.optics-qsfp: 40GbE QSFP+ SR4 (multimode) and DAC direct-attach copper\
  \ (datasheet, Supported Optics)\n- features.poe: all 48 ports up to 95 W, the datasheet's pre-standard\
  \ IEEE 802.3bt PoE++\n- features.uplink-module: one slot; 2-port 40-Gigabit QSFP+ / 100-Gigabit QSFP28\
  \ EX-UM-2QSFP-MR or 4-port 1/10-Gigabit SFP+ EX-UM-4SFPP-MR (neither is part of the shipping configuration)\n\
  - features.virtual-chassis: up to 10 members; the four rear QSFP+ ports are dedicated Virtual Chassis\
  \ ports and cannot be network ports; joins an EX4300 Virtual Chassis only through a 40-Gigabit port\
  \ of the other members, and must take the primary role there\n- lifecycle.end-of-life: 2031-12-29\n\
  - lifecycle.end-of-sale: 2026-12-29\n- lifecycle.eol: announced\n- lifecycle.eol-announcement: https://endoflife.ai/article-juniper-ex4300-48mp-ex4600-eol\n\
  - management.console: mini-USB on the front, RJ-45 CON on the rear\n- management.oob: MGMT RJ-45 with\
