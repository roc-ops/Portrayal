comments: 'Juniper EX4100-H-24F is a hardened (industrial), fanless 1RU fibre access switch with 24 1
  Gbps SFP ports, four 1/10 Gbps SFP/SFP+ Virtual Chassis or uplink ports and four 1/10 Gbps SFP/SFP+
  MACsec uplink ports. It has no PoE. The front carries the 24 SFP cages in two banks of six columns numbered
  0 to 23, a USB Type-C console port, a reset pinhole, a Mode button, a plug-in dry contact alarm connector,
  the management Ethernet port over a USB Type-A port over an RJ-45 console port, the chassis and port
  mode lamps, the two cage groups, the PSU lamps, and at the right a terminal door over the power input
  terminals of both power supply slots. The rear carries a two-hole earthing terminal, an ESD point, a
  physical security lock slot and two field-replaceable power supply slots, a 90 W AC or DC supply in
  the first and a blank over the second. There is no fan. The EX4100-H-24MP is the same box with 24 PoE++
  jacks in place of the SFP ports and a 340 W supply.


  Configuration `ac`: EX4100-H-24F as shipped with an AC supply (Tables 12 and 67): one 90 W AC supply
  in power supply slot 0, a blank over slot 1 and no fan. The guide''s redundant build has a second supply
  in slot 1.


  Rack mounting positions: flush ("front-mount"; ears level with the face; as shipped).


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: tested for Zone 4 earthquake safety

  - environmental.altitude: no performance degradation up to 15000 ft (4572 m)

  - environmental.humidity: 5 to 95 percent, noncondensing

  - environmental.operating-temp: -40 to 60 C in a sealed enclosure, -40 to 70 C in a ventilated enclosure
  (40 LFM) and -40 to 75 C in a blower-equipped enclosure (200 LFM), up to 15000 ft; safety certified
  at 60 C

  - environmental.storage-temp: -40 to 85 C in the shipping container

  - features.dry-contact-alarm: two alarm inputs (5 V threshold) and one alarm relay output (NO, COM,
  NC), Table 4

  - features.macsec: the four uplink ports are MACsec capable

  - features.optics-sfp: the 24 front cages take 1 Gbps SFP transceivers; Tables 49 and 50 list the industrial-grade
  1 G optics against the ambient they allow. The supported list is in Juniper''s Hardware Compatibility
  Tool, which the guide names and which is not held here

  - features.optics-sfp-plus: the eight group cages take 1 Gbps SFP and 10 Gbps SFP+ transceivers; Tables
  45 to 48 list the industrial-grade 10 G and 10GBASE-T optics against the ambient they allow. The supported
  list is in Juniper''s Hardware Compatibility Tool, which the guide names and which is not held here

  - features.virtual-chassis: up to 10 EX4100, EX4100-F and EX4100-H switches; the four VCP cages are
  the Virtual Chassis ports (HiGig or HGoE mode, or uplink ports) and the four uplink cages support HGoE
  only. A 10GBASE-T transceiver cannot form a Virtual Chassis in a VCP

  - lifecycle.eol: none-announced

  - physical.weight: 8.07 kg (17.79 lb) with no supply; 9.20 kg with one AC supply and 9.23 kg with one
  DC supply, Table 13

  - platform.first-junos-release: 24.4R1 (Table 12)

  - power.power-input-ac: 100 through 240 VAC, 50/60 Hz (Table 28)

  - power.power-input-dc: 20.4 through 72 VDC at the terminal block, nominal +24, -48 or -60 VDC (Table
  36)

  - thermal.cooling: fanless, convection cooled (Table 12); one rack unit clear above and below


