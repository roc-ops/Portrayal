comments: 'Juniper MX2020 - the 45RU, two-metre flagship of the MX2000 family: the MX2010 doubled. Craft
  interface and EMI cover at the top, an upper cage of ten MPC slots (LC 10-19), the fabric cage (CB-RE
  0, SFB 0-7, CB-RE 1) in the middle, a lower cage of ten more (LC 0-9), and the intake grille at the
  base. The rear carries two nine-module PSM walls between four power distribution modules, with fan trays
  behind the grilles.


  Configuration `base`: Chassis only - what you spec before deciding what goes in it. The 20 slot bays
  are EMPTY; psus, res, sfbs are populated. Enough to power on and reach the box, which is the question
  most people ask first and the one `default` used to answer with whatever the drawing happened to be
  populated with.


  Drawing version 0.2.19. A major bump means a slot moved or an id was renamed, so anything cached from
  an earlier export may no longer line up.

  Model maturity: modelled. Every dimension in the source records where it came from.'
