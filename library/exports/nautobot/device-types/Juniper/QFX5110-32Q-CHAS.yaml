comments: 'Juniper QFX5110-32Q, a 1RU data-centre spine and leaf switch running Junos OS. It has 28 QSFP+
  ports and 4 QSFP28 ports. A QSFP+ port runs at 40 GbE, or as four 10 GbE ports with a breakout cable.
  A QSFP28 port runs at 100 GbE or 40 GbE. The port side also carries the RJ-45 grandmaster clock port
  and the 10 MHz and 1 PPS outputs. The rear carries two power supplies, five fan modules, the console,
  two management ports, a USB port, the reset button and the four chassis lamps. One front panel ships
  in four power and airflow variants. They have AC or DC supplies, with airflow front-to-back (AIR OUT)
  or back-to-front (AIR IN). A spare chassis ships without supplies or fan modules.


  Configuration `chas`: QFX5110-32Q-CHAS, the spare chassis, shipped without power supplies or fan modules
  (guide Table 3: "Order PSUs separately. Fan modules are not shipped by default."). AC or DC supplies
  and AIR OUT or AIR IN fan modules are ordered separately. Supplies and fans of one airflow only go in.
  The supply and fan bays are shown open.


  Facts carried in the model that this schema has no field for:

  - environmental.altitude: no performance degradation to 2000 m (6562 ft)

  - environmental.humidity: 5 to 90 percent noncondensing; 5 to 93 percent short term

  - environmental.operating-temp: 0 to 40 C (32 to 104 F) normal operation

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container

  - features.optics-qsfp: 40 GbE QSFP+, direct attach and active optical cables, breakout cables to SFP+

  - features.optics-qsfp28: 100 GbE QSFP28, direct attach and active optical cables

  - features.timing: RJ-45 grandmaster clock port (GM), 10 MHz output, 1 PPS output

  - features.virtual-chassis: up to 10 switches in a ring with QFX5110 or QFX5100 members; also a Virtual
  Chassis Fabric spine or leaf

  - lifecycle.eol: none-announced

  - management.console: RJ-45 console port (CON)

  - management.oob: management port C0 (RJ-45, em0, with a second C0 SFP cage) and C1 (SFP, em1)

  - management.usb: one USB port for image updates

  - performance.latency: 550 ns (guide, Benefits of QFX5110, for the line)

  - performance.qsfp-plus-speeds: 40 GbE; or four 10 GbE with a breakout cable

  - performance.qsfp28-speeds: 100 GbE or 40 GbE

  - performance.switching-capacity: 2.56 Tbps aggregate throughput (guide, QFX5110-32Q Hardware)

  - performance.system-modes: default, and non-oversubscribed (ports 0 to 23 only, 960 Gbps). In default
  mode a 100 GbE optic in a QSFP28 port disables ports 20 to 27

  - physical.depth-note: 20.48 in (52.02 cm) excluding fan and power supply handles (Table 24)

  - physical.weight-note: 24.6 lb (11.16 kg) with two power supplies (Table 24)

  - platform.cpu: 1.8 GHz quad-core Intel

  - platform.memory: 16 GB

  - platform.software: Junos OS

  - platform.storage: 64 GB SSD

  - power.power-dc-max-w: 200

  - power.power-dc-typical-w: 132

  - power.power-envelope: unstated

  - power.power-input-ac: 90 to 264 VAC, 50 to 60 Hz, 3.6 A at 90 VAC (guide Table 14)

  - power.power-input-dc: rated -39 to -60 VDC, operating range -40 to -72 VDC, -8.2 A at 39 VDC (guide
  Table 19)

  - power.power-max-w: 200

  - power.power-typical-w: 132

  - power.redundancy-note: two supplies, load-sharing and fully redundant; one may be removed and replaced
  while the switch runs

  - thermal.fans: five fan modules, hot-swappable; the switch runs 30 seconds without thermal shutdown
  while one is replaced


