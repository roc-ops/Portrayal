comments: 'Juniper EX4100-48P, a 1U access switch with 48 10/100/1000BASE-T ports that all supply PoE+
  (30 W by default). The front also has four SFP28 Virtual Chassis ports, four SFP+ uplink ports and an
  RS232 to USB Type-C console port. The rear has an RJ-45 management port, an RJ-45 console port, a USB
  2.0 Type-A port, two fan modules and two power supply slots. It ships with one 920 W AC supply, and
  a cover panel closes the second slot. Airflow is front to back.


  Configuration `ac`: The switch as shipped: one 920 W AC supply in slot 0, a cover panel over slot 1
  and two front-to-back fan modules, all marked AIR OUT. A second supply raises the PoE budget from 740
  W to 1440 W.


  Rack mounting positions: flush ("front-mount"; ears level with the face; as shipped), recessed ("2-in.
  recess"; ears 50.8 mm behind the face).


  Facts carried in the model that this schema has no field for:

  - compliance.acoustic: 38.7 dB typical and 46.1 dB maximum with one supply, 39.3 and 48.2 with two (Table
  4)

  - compliance.seismic: tested for Zone 4 earthquake safety

  - environmental.altitude: no performance degradation up to 1524 m (5,000 ft)

  - environmental.humidity: 10 to 85 percent, noncondensing

  - environmental.operating-temp: 0 to 45 C (32 to 113 F), 40 C with 10GBASE-T transceivers (environmental
  requirements)

  - features.macsec: the SFP+ uplink ports are MACsec-enabled

  - features.optics-sfp-plus: the four uplink ports are 1GE or 10GE SFP+ ports (Table 8). With a 10GBASE-T
  transceiver the maximum ambient is 40 C

  - features.optics-sfp28: the four Virtual Chassis ports are 10GE or 25GE SFP28 ports (Table 8). VC formation
  is not supported with a 10GBASE-T transceiver in them

  - features.uplink-ports: four SFP+ ports take 1 GbE or 10 GbE transceivers, with MACsec

  - features.virtual-chassis: up to 10 EX4100 switches. The four SFP28 ports are dedicated Virtual Chassis
  ports

  - lifecycle.eol: none-announced

  - management.console: RJ-45 console on the rear panel and RS232 to USB Type-C console on the front,
  both labelled CON

  - management.oob: management Ethernet RJ-45 on the rear panel, with a link activity lamp and a status
  lamp

  - management.usb: one USB 2.0 Type-A port on the rear panel

  - physical.depth-with-modules: 382.4 mm (15.05 in., 38.24 cm) with the power supply and fan modules
  installed (Tables 12 and 19)

  - physical.weight: 5.51 kg (12.15 lb) with the power supply and fan modules, 6495 g in Table 12 (Table
  19)

  - physical.width-with-brackets: 482 mm (19 in.) with the mounting brackets attached (rack requirements)

  - platform.first-junos-release: 22.2R1 (Table 7)

  - power.poe-budget-w: 740 W with one supply, 1440 W with two (Table 32)

  - power.poe-standard: PoE+ on all 48 ports, 30 W per port by default (Table 12)

  - power.power-input-ac: 100 through 127 VAC or 200 through 240 VAC, 50 or 60 Hz (Table 30)

  - thermal.airflow: front to back, both fan modules and the supply marked AIR OUT (Table 27)


  Drawing version 1.0.1. A major bump means a slot moved or an id was renamed, so anything cached from
