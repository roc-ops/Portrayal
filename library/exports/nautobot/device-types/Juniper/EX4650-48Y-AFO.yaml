comments: 'Juniper EX4650-48Y, a 1RU 25 GbE campus core and aggregation switch running Junos OS. It has
  48 SFP28 ports (25, 10 or 1 GbE, set a quad at a time) and 8 QSFP28 ports (100 or 40 GbE, channelizable).
  The 56 ports and their lamps are on the port side. The rear carries two power supplies, five fan modules,
  the console, two RJ-45 management ports and a USB port. It also has the reset button and the four chassis
  lamps. It ships as one front panel in four power and airflow variants: AC or DC supplies, front-to-back
  (AIR OUT) or back-to-front (AIR IN).


  Configuration `ac-f2b`: EX4650-48Y-AFO: two 650 W AC supplies (JPSU-650W-AC-AO) and five front-to-back
  fan modules (QFX5110-FANAFO). All have an orange handle and the label AIR OUT (guide Tables 7, 8 and
  18).


  Facts carried in the model that this schema has no field for:

  - environmental.altitude: no performance degradation to 2000 m (6562 ft)

  - environmental.humidity: 5 to 90 percent noncondensing

  - environmental.operating-temp: 0 to 45 C (32 to 113 F) normal operation

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container

  - features.optics-qsfp28: 100 GbE or 40 GbE; channelizes to 4 x 25 GbE or 4 x 10 GbE (guide Table 6)

  - features.optics-sfp28: 25 GbE, 10 GbE or 1 GbE; the guide gives a restriction on 1GbE copper optics
  other than OEM part FCLF8521P2BTL-J1

  - features.virtual-chassis: up to 4 EX4650 switches, no other model. Two members before Junos OS 20.1R1.
  Any non-channelized QSFP28 port (48 to 55) can be a virtual chassis port

  - lifecycle.eol: none-announced

  - management.console: RJ-45 console port (CON)

  - management.oob: two RJ-45 management ports (C0 and C1) with link and status lamps

  - management.usb: one USB port

  - performance.qsfp28-speeds: 100 or 40 GbE; channelizes to 4 x 25 or 4 x 10 GbE (Table 4)

  - performance.sfp28-speeds: 25, 10 or 1 GbE, set a quad at a time; the default is 10 GbE (Table 4)

  - physical.depth-note: 20.48 in (52.02 cm) excluding the fan and power supply handles (Table 9)

  - physical.weight-note: 23.69 lb (10.75 kg) with two power supplies and five fan modules installed (Table
  9)

  - platform.cpu: 2.3 GHz quad-core Intel (datasheet)

  - platform.memory: 16 GB (datasheet)

  - platform.software: Junos OS

  - platform.storage: 64 GB SSD (datasheet)

  - power.power-envelope: unstated

  - power.power-input-ac: 100 to 240 VAC, 50 to 60 Hz, 7.8 A at 100 to 120 VAC, 3.8 A at 200 to 240 VAC

  - power.power-input-dc: rated -48 to -60 VDC, operating range -40.8 to -72 VDC, 20 A maximum

  - power.power-max-w: 450

  - power.power-typical-w: 260

  - power.redundancy-note: two supplies, load-sharing and fully redundant; both should be installed

  - thermal.fans: five fan modules, 4+1; the switch runs 30 seconds without thermal shutdown while one
  is replaced


  Drawing version 0.2.0. A major bump means a slot moved or an id was renamed, so anything cached from
  an earlier export may no longer line up.

  Model maturity: modelled. Every dimension in the source records where it came from.'
