comments: "Juniper EX9253, a 3RU modular core and aggregation switch that runs Junos OS, the larger of\
  \ the two EX9250 chassis. The front has two Routing Engine slots (RE0 and RE1) across the top and two\
  \ line card slots (MPC1 above MPC0) below, with the ESD point between the Routing Engines. The rear\
  \ has six power supply slots (PSM0 to PSM5), three each side, and four fan trays between them (FT0 to\
  \ FT3). The base order ships one Routing Engine, three supplies and the blank panels; the redundant\
  \ order two Routing Engines and four supplies. Line cards are ordered separately and are not modelled\
  \ here: both line card slots show their blank panels.\n\nConfiguration `red-ac`: EX9253-RED-AC: the\
