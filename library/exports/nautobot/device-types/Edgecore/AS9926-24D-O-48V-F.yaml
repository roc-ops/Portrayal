comments: '24x 400G QSFP-DD 1RU cell-based fabric switch for carrier core routers (vendor alias AS9926-24D,
  and AS9926-24DB with an ASPEED AST2600 BMC), Broadcom BCM88795 Ramon, ONIE-preloaded. All ports on the
  front, numbered from 0; two 1300 W AC or -48 VDC PSUs and six 5+1 fan trays from the rear, front-to-back
  airflow only.


  Configuration `dc48-f2b`: Dual -48 VDC PSUs (FRU FSJ033-610G, rated 48 VDC 1300 W, input -40 V to -75
  V at 40 A maximum) and the same six fan trays, front-to-back airflow. The DC SKUs ship four ring lugs
  that the AC SKUs do not (cor580-qsg package contents, item 4). The bay geometry is identical; the supply
  is drawn as the AC part because the library holds no 1300 W DC module yet, which is registered as a
  gap.


