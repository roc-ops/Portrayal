comments: '4x 10G SFP+, 8x 1G SFP and 4x 1G RJ-45 fanless cell site gateway, sold as the CSR180, Broadcom
  BCM88273 Qumran-UX with an Intel Atom C3308 and a Stratum 3E OCXO. The CSR200''s shell with no fans
  in it: passively cooled behind a honeycombed faceplate, needing at least 1 m/s of external airflow,
  with no FAN lamp and no BITS port. Ports number from 1; all timing, management and power connections
  are on the front, and the two DC supplies are fixed.


  Configuration `dc`: The only published configuration. Two fixed load-sharing -48 VDC supplies, no fans
  at all, filter slot blanked. The datasheet''s ordering section lists the base model and no variants,
  so there is one row and it carries no part number.


