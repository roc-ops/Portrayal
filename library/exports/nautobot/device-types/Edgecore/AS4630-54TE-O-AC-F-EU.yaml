comments: '54-port Gigabit access switch, 1RU, sold as the EPS201 and stamped AS4630-54TE. 48 x 10/100/1000BASE-T
  RJ-45 in twenty-four columns of two, ganged six and six and six and six, then four 10G/25G SFP28 uplinks
  and two 100G QSFP28 stacking ports numbered 49-52 and 53-54 into the same sequence. NO PoE - and the
  panel carries a PoE lamp anyway, which its own guide legends "PoE LED: Off". A stacked management/console
  RJ-45 pair, a Type-A USB storage port, STK M/S and Reset buttons and eight status lamps. TWO HOT-SWAPPABLE
  150 W AC SUPPLIES AND THREE HOT-SWAPPABLE FAN TRAYS on the rear, in either airflow. It shares its 438
  x 474 x 44 shell and its whole front face with edgecore/eps203.


  Configuration `ac-f2b`: Dual 150 W AC supplies, front-to-back airflow - red handles. The -F ordering
  codes, and the build this device''s own quick start guide draws in its fan-replacement figure.


  Also sold or listed as: EPS201


  Facts carried in the model that this schema has no field for:

  - environmental.humidity: Operating: 5% to 95% non-condensing

  - environmental.operating-temp: 0 to 45 C (32 to 113 F)

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F)

  - features.optics-qsfp28: Two 100G QSFP28 ports, 53-54, sold as stacking ports - "requires NOS to support
  hardware stacking feature, also can be used as data transmission ports". The datasheet adds a cabling
  note of its own: "When a DAC cable is used in a topology, a link issue may be encountered if the CR4
  Auto-Negotiation/Link Training does not turn on."

  - features.optics-sfp28: Four 10G/25G SFP28 uplinks, ports 49-52. The datasheet''s transceiver list
  gives 10GBASE-RJ-45, 10G DAC/AOC, 25GBASE-SR/LR, 25G DAC/AOC, 40GBASE-SR4/LR4, 40G DAC/AOC, 100GBASE-SR4/CWDM4/LR4
  and 100G DAC/AOC for the chassis as a whole; no per-cage breakout table is published, so none is stated
  here.

  - features.poe: NONE. The switch has no PoE and the datasheet lists none; the panel''s eighth status
  lamp is legended PoE and the guide says it is off. Recorded because the face looks like a PoE machine''s
  and its two shell-mates are.

  - lifecycle.eol: none-announced

  - physical.weight-note: 6.98 kg (15.39 lb), with two installed PSUs

  - power.input-ac: Low-line 3 A for 90-136 VAC; high-line 1.5 A for 180-264 VAC, 47-63 Hz

  - power.power-consumption: 150 W maximum


