comments: '16 x 800G OSFP programmable 1RU switch on Xsight Labs X2 silicon with an Intel Xeon D-1713NTE,
  sold as the EXP800-16O. Every port, both the console and the management jack, the USB and a 1PPS timing
  input are on the FRONT; two AC supplies and SIX fan trays are on the rear. THE PORTS ARE NUMBERED FROM
  ZERO - the panel prints `0 (up) (down) 1`, `2 (up) (down) 3` and so on to 15, which is this line''s
  only device that does not start at one.


  Configuration `ac-f2b`: Dual AC PSUs, front-to-back airflow - red handles and red release latches, which
  is the build both staged photographs show and whose fan bars are stamped F2B.


  Facts carried in the model that this schema has no field for:

