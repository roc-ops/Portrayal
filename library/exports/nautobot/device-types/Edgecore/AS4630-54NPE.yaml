comments: '54-port multi-gigabit PoE access switch, 1RU, sold as the EPS203 and stamped AS4630-54NPE.
  ITS COPPER ROW IS NOT ONE RATE: 36 ports run 100M/1G/2.5G and the last 12 run 1G/2.5G/5G/10GBASE-T,
  and the split falls exactly on a ganged-block boundary - three gangs of six columns and then a fourth.
  All forty-eight deliver up to 90 W of PoE. Four 10G/25G SFP28 uplinks and two 100G QSFP28 stacking ports
  finish the face, numbered 49-52 and 53-54 into the same sequence. A stacked management/console RJ-45
  pair, a Type-A USB storage port, STK M/S and Reset buttons and eight status lamps sit at the left and
  centre. TWO HOT-SWAPPABLE 1200 W AC SUPPLIES AND THREE HOT-SWAPPABLE FAN TRAYS on the rear, front-to-back
  only. It shares its 438 x 474 x 44 shell with edgecore/eps201.


  Configuration `base`: The chassis as it ships: two supplies and three fan trays in, every cage empty.
  All seven ordering codes are front-to-back, so there is no second airflow configuration to describe
  - unlike the EPS201 on the same shell, which has four of each.


  Also sold or listed as: EPS203


  Facts carried in the model that this schema has no field for:

  - environmental.humidity: Operating: 5% to 90% non-condensing

  - environmental.operating-temp: 0 to 45 C (32 to 113 F)

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F)

  - features.optics-qsfp28: Two 100G QSFP28 ports, 53-54, sold as stacking ports - "subject to NOS implementation,
  also can be used as data transmission ports". Whether stacking is available is a software question the
  hardware cannot answer, which is why it is here and not in a group''s role.

  - features.optics-sfp28: Four 10G/25G SFP28 uplinks, ports 49-52. The datasheet''s transceiver list
  gives 10GBASE-RJ-45, 10G DAC/AOC, 25GBASE-SR/LR, 25G DAC/AOC, 40GBASE-SR4/LR4, 40G DAC/AOC, 100GBASE-SR4/CWDM4/LR4
  and 100G DAC/AOC for the chassis as a whole; no per-cage breakout table is published, so none is stated
  here.

  - features.poe: All forty-eight RJ-45 ports deliver up to 90 W. The key-features list gives the standards
  per rate group: 36 x 1G/2.5G at IEEE 802.3af/at and bt Type 3/Type 4 90 W, and 12 x 1G/2.5G/5G/10G at
  the same. Cat 6 cabling, per the datasheet''s prose.

  - lifecycle.eol: none-announced

  - physical.weight-note: 8.5 kg (18.74 lb)

  - power.input-ac: Low-line 15 A for 90-136 VAC (1000 W); high-line 180-264 VAC (1200 W)

  - power.poe-budget: With a 30 W guard band - low-line 700 W with one PSU, 1700 W with two; high-line
  900 W with one, 2100 W with two

  - power.power-consumption: Low-line 2000 W max; high-line 2400 W max


