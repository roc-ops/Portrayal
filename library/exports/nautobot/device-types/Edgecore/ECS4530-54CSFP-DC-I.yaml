  - compliance.rohs: RoHS; WEEE

  - compliance.safety: CB, UL

  - environmental.humidity-operating: 10% to 90% non-condensing

  - environmental.humidity-storage: 10% to 90% non-condensing

  - environmental.temperature-operating: 0 C to 60 C

  - environmental.temperature-storage: -40 C to 70 C

  - features.marketing-name: ECS4530-54CSFP-DC-I

  - features.optics-sfp: 1G CSFP (two bidirectional fibre ports per module); 1000BASE-SX/LX/LHX/ZX; DDM

  - features.port-summary: 24 CSFP cages (48 x 1G BiDi fibre), 4 x RJ-45 combo, 4 x 10G SFP+, 2 x 20G
  QSFP+

  - lifecycle.eol: none-announced

  - management.mgmt-ports: 1x RJ-45 console, 1x RJ-45 GE out-of-band management

  - performance.forwarding-rate: 190.48 Mpps

  - performance.jumbo-frames: 10 KB

  - performance.mac-table: 16K

  - performance.port-modes-qsfp: 20G uplink - the datasheet says ''20G QSFP+ Uplink'' and nothing about
  the optics or modes behind it

  - performance.port-modes-sfp-plus: 1G / 10G; 10GBASE-SR/LR/ZR/ER, 1000BASE-SX/LX/LHX/ZX, 10G DAC/AOC

  - performance.switching-capacity: 256 Gbps

  - platform.dram: 2 GB

  - platform.flash: 2 GB

  - power.power-envelope: unstated

  - power.power-input-dc: -48 to -60 VDC, 6 A max

  - power.power-max-w: 75.4


