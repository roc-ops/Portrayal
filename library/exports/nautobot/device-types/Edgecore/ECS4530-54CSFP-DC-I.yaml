comments: '1RU half-depth L2+/L3-lite Gigabit fibre access switch, the DC and industrial-temperature member
  of the ECS4530 pair: the same 24 CSFP cages in 12 two-high stacks (48 BiDi fibre ports), four RJ-45
  combo ports, 4 x 10G SFP+ and 2 x 20G QSFP+ uplinks, console and out-of-band RJ-45 as the ECS4530-54CSFP
  - fed instead from a -48 to -60 V pluggable terminal block on the front, rated 0-60 C, with its three
  fixed rear fans in different places.


  Configuration `base`: The DC machine as the datasheet''s DC-I column describes it, every cage empty.
  No ordering table exists to name an orderable build.


