comments: '48 x 1G RJ-45 plus 6 x 1G/10G SFP+ 1RU access switch, no PoE, sold as the EPS121 and stamped
  AS4625-54T. All ports on the front in TWO ROWS OF TWENTY-FOUR COLUMNS ganged in three blocks of eight,
  numbered 1-48, with the SFP+ uplinks numbered 49-54 into the same sequence. An RJ-45 management jack
  over an RJ-45 console, a Micro-USB storage port, a Reset button and six status lamps. TWO HOT-SWAPPABLE
  SUPPLIES AND THREE FIXED FANS on the rear - the fans are not FRUs. Its sibling edgecore/eps122 is the
  same chassis with PoE, and they share one quick start guide; they are separate devices because the differences
  are device attrs, which a configuration cannot carry.


  Configuration `base`: The chassis as it ships: two supplies in, every cage empty. The guide''s package
  contents say the unit "includes 2 PSUs".


  Also sold or listed as: EPS121


  Facts carried in the model that this schema has no field for:

  - environmental.humidity: Operating: 5% to 95% non-condensing

  - environmental.operating-temp: 0 to 45 C (32 to 113 F)

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F)

  - features.optics-sfp-plus: Six 1G/10G SFP+ uplinks, ports 49-54, which both documents call uplinks.
  The guide''s lamp legend gives them two rates - "SFP+ Port LEDs: Green (10G), Amber (1G)" - and no breakout
  table is published, so none is stated here.

  - lifecycle.eol: none-announced

  - physical.weight-note: AS4625-54T: 5.8 kg, includes two PSUs (the guide gives both models in one line)

