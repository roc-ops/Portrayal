comments: '32 x 400G QSFP112 programmable 1RU switch on Xsight Labs X2 with an Intel Xeon D-1713NTE, sold
  as the EXP400-32X. All ports are on the FRONT with the console, the 1PPS jack, the management jack and
  the USB; two AC supplies and six fan trays are on the rear. It shares its 442 x 509 x 44 shell and its
  whole rear with edgecore/exp800-16o and seats that device''s fan and supply, and it shares its ENTIRE
  FRONT with edgecore/exp100-32x - the same thirty-two QSFP cages in the same eight blocks, the same console
  cluster, the same management stack. The two differ in what the cages take, not in where anything is.


  Configuration `ac-f2b`: Dual AC PSUs, front-to-back airflow - red handles and red release latches, which
  is the build both staged photographs and the rear elevation show. THE ONLY CONFIGURATION DECLARED: this
  datasheet says "Supports front-to-back airflow direction", singular, and names no DC supply and no back-to-front
  variant. See the dc-supply-and-b2f gap.


  Facts carried in the model that this schema has no field for:

  - environmental.altitude: 0 - 10,000 feet

  - environmental.humidity: Operating: 0% to 95% non-condensing

  - environmental.operating-temp: 0 to 40 C

  - environmental.storage-temp: -40 to 70 C

  - features.optics-qsfp112: datasheet: each 400G QSFP112 port takes 1 x 400 GbE or breaks out to "2 x
  200GbE, and 4 x 100GbE via breakout cables". The qualified list is named in full: 400G DAC, 400G AOC,
  400G QSFP112 SR4, 200G QSFP56-SR4, and at 100G DAC, AOC, SR4, LR4, DR1, FR1 and LR1. More are referred
  to the vendor''s site.

  - lifecycle.eol: none-announced

  - performance.packet-buffer: 64 MB integrated

  - performance.switching-capacity: 12.8 Tbps (full duplex)

  - physical.weight-note: 10.005 kg (20.05 lb), per the datasheet

  - platform.cpu: Intel Xeon D-1713NTE, 4-core 2.2 GHz

  - platform.memory: 32 GB DDR4 SO-DIMM with ECC

  - platform.storage: 1 TB M.2 2280 NVMe SSD

  - platform.switch-silicon: Xsight Labs X2


