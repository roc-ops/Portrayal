comments: '20x 25G SFP28 and 4x 100G QSFP28 cell site router, sold as the CSR430, Broadcom BCM88284 Qumran-2U
  with an Intel Atom C3508 and 2 GB of GDDR6 deep buffer. An SMA GNSS antenna input, SMB 1PPS and 10 MHz
  jacks, a ToD RJ-45, and a rotated USB-A. Everything is on the front - ports, both hot-swappable supplies
  and the fan tray - with side-to-side airflow. Ports number 0-23 in one range, the four QSFP28s first.


  Configuration `ac`: Two hot-swappable AC supplies and the fan tray. This is the variant the datasheet''s
  upper front elevation draws. No ordering matrix is published for this model in either staged document,
  so the configurations carry no part numbers.


