  - environmental.altitude: Operating: 1800 m

  - environmental.humidity: Operating: 5% to 95% non-condensing

  - environmental.operating-temp: 0 to 40 C (front-to-back); 0 to 35 C (back-to-front), subject to used
  optics

  - environmental.storage-temp: -40 to 70 C

  - features.optics-osfp: datasheet: each OSFP800 port takes 1 x 800G on 8 lanes of 100G PAM4, or breaks
  out to 2 x 400G, 4 x 200G or 8 x 100G; on 50G PAM4 it takes 1 x 400G or breaks out to 2 x 200G, 4 x
  100G or 8 x 50G; and it takes 1 x 100G on 4 lanes of 25G NRZ.

  - features.timing: 1PPS, 10 MHz and ToD ports, SyncE and IEEE 1588v2 PTP

  - lifecycle.eol: none-announced

  - performance.jumbo-frames: up to 9416 bytes

  - performance.switching-capacity: 51.2 Tbps (102.4 Tbps full duplex)

  - physical.weight-note: 20.5 kg (45.19 lb) with 2 PSUs and 4 fans installed (quick start guide); the
  datasheet says 21.5 kg (47.4 lb)

  - platform.bmc: AST2600 running OpenBMC, secured by an AST1060 root of trust

  - platform.boot-flash: 64 MB SPI flash x 2

  - platform.cpu: Intel Xeon D-1713NTE Ice Lake D, 4-core 2.2 GHz, COM Type 7

  - platform.memory: 32 GB DDR4 SO-DIMM with ECC

  - platform.software: ONIE preloaded; no NOS image ships on the device

