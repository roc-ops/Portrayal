comments: '64 x 800G OSFP800 AI and data centre 2RU switch on a Broadcom Tomahawk 5 with an Intel Xeon
  D-1713NTE and an OpenBMC service processor, sold as the AIS800-64O. All ports are on the FRONT in TWO
  BANKS of sixteen stacked columns, and the columns are GANGED IN FOURS - four shells of four columns
  per bank, with a 4.13 mm gutter between them. Two 25G SFP28 in-band management cages, an RJ-45 management
  jack, a USB 3.0 Type-A storage port, an RJ-45 console, a ToD jack, 1PPS and 10 MHz timing jacks, six
  system lamps and a reset button share the right of the wall; two 3000 W supplies and FOUR fan trays
  are on the rear. Its twin edgecore/ais800-64d is the same chassis with a QSFP-DD800 wall - and the two
  walls are laid out differently, which is the whole reason this one was fitted from scratch: the 64D
  spreads sixteen columns on a single 24.019 mm pitch and puts one lamp on the post beside each cage,
  and this one gangs its columns and puts two lamps in the legend row above them.


  Configuration `dc-b2f`: Dual 3000 W DC PSUs, back-to-front airflow - blue tray bars. The DC supply''s
  own release latch is green in both builds and is not recoloured; the airflow colour rule is established
  for the AC latch and the tray bars only, which is the 64D''s finding.


