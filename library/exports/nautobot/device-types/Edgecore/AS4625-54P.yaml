comments: '48 x 1G RJ-45 PoE plus 6 x 1G/10G SFP+ 1RU access switch, sold as the EPS122 and stamped AS4625-54P.
  All ports on the front in TWO ROWS OF TWENTY-FOUR COLUMNS ganged in three blocks of eight, numbered
  1-48, with the SFP+ uplinks numbered 49-54. THE RJ-45 ROW IS TWO PoE CLASSES AND THE PANEL SAYS WHICH:
  ports 1-40 at 30 W and ports 41-48 at 90 W, the latter marked with an orange band and legended "0.53A
  Max/Port1-40, 1.85A Max/Port41-48". An RJ-45 management jack over an RJ-45 console, a Micro-USB storage
  port, a Reset button and six status lamps. TWO HOT-SWAPPABLE SUPPLIES AND THREE FIXED FANS on the rear.
  Its sibling edgecore/eps121 is the same chassis without PoE.


  Configuration `base`: The chassis as it ships: two supplies in, every cage empty. The guide''s package
  contents say the unit "includes 2 PSUs".


  Also sold or listed as: EPS122


  Facts carried in the model that this schema has no field for:

  - environmental.humidity: Operating: 5% to 95% non-condensing

  - environmental.operating-temp: 0 to 45 C (32 to 113 F)

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F)

  - features.optics-sfp-plus: Six 1G/10G SFP+ uplinks, ports 49-54, which both documents call uplinks.
  The guide''s lamp legend gives them two rates - "SFP+ Port LEDs: Green (10G), Amber (1G)" - and no breakout
  table is published, so none is stated here.

  - lifecycle.eol: none-announced

  - physical.weight-note: AS4625-54P: 6.6 kg, includes two PSUs (the guide gives both models in one line)

  - power.input-ac: 100-120 VAC 12 A max; 200-240 VAC 8.5 A max

  - power.poe-budget: Low-line: 850 W for 1 PSU, 1850 W for 2 PSUs. High-line: 1050 W for 1 PSU, 1920
  W for 2 PSUs

  - power.power-consumption: AS4625-54P: 2000 W max low-line, 2400 W max high-line at 25 C


