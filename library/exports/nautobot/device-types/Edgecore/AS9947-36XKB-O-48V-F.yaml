comments: '12 x 400G QSFP-DD, 24 x 100G QSFP28 and 4 x 10G SFP+ 2RU aggregation router on a Broadcom Jericho2c+
  with an Intel Xeon D Ice Lake and an OpenBMC service processor, sold as the AGR560 and stamped AS9947-36XKB.
  ALL PORTS ARE ON THE FRONT, NUMBERED FROM ZERO, in stacked pairs legended `N (up) (down) N+1`: the SFP+
  quad at the left, three QSFP28 blocks of two columns by four rows, then three QSFP-DD blocks of two
  columns by two rows. THE SFP+ QUAD AND QSFP28 PORTS 0-3 ARE A COMBO PAIR and the panel says so with
  one continuous pink band across both. The out-of-band cluster carries MGMT, CONSOLE and ToD RJ-45s,
  1PPS and 10 MHz coaxial timing jacks, a vertical USB 3.0 Type-A, a reset pinhole and FIVE system lamps
  - five, not the AIS800 family''s six, because this machine has no ALRM. Two 2000 W Lite-On supplies
  and four fan trays are on the rear. It shares the AIS800-64D and AIS800-64O''s 440 x 649.2 x 87 shell
  and their fan tray, and NOTHING ELSE: its supplies are half the power on different connectors and its
  port wall is a different machine entirely.


  Configuration `dc-f2b`: Dual 2000 W -48 VDC PSUs, front-to-back airflow. This is the build the quick
  start guide''s rear elevation draws, and the only one it draws. The included cable is the ordering table''s
  "6AWG PSU to 2 x Ring Terminal, 2.5m", which is what settles the supply''s two studs.


  Also sold or listed as: AGR560


  Facts carried in the model that this schema has no field for:

  - compliance.emissions: EN 55032, EN 61000-3-2, EN 61000-3-3, FCC Title 47 Part 15 Subpart B Class A

  - compliance.immunity: EN 55024, EN 55035, IEC 61000-4-2/3/4/5/6/8/11

  - compliance.rohs: Taiwan RoHS CNS 15663

  - compliance.safety: UL/CUL (CAN/CSA 22.2 No 62368-1 & UL 62368-1), CB (IEC/EN 62368-1)

  - environmental.humidity: Operating: 5% to 85% non-condensing; Storage: 5% to 95% non-condensing

  - environmental.operating-temp: 0 to 45 C (32 to 113 F)

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F)

  - features.combo: quick start guide: the 10G SFP+ ports share a group with 100G QSFP28 ports 0 and 1;
  either the SFP+ ports or those QSFP28 ports can be used, and the two types cannot run at the same time.

  - features.optics-qsfp-dd: datasheet, power budget: "23 W on QSFP-DD ports", which is a 400G ZR-class
  envelope. THE LAMP LEGEND AGAIN GIVES THE RATES: "LED1 (top) - Magenta (400G), Blue (100G), Cyan (25G),
  Yellow (10G)". The ordering text calls the cage QSFP56-DD - eight lanes of 50G PAM4 - while the panel
  legends it QSFP-DD 400G; the panel''s wording is used.

  - features.optics-qsfp28: datasheet, power budget: "6.5 W on QSFP28 ports" - a 100G optic''s envelope,
  not a 400G one. THE RATES ARE STATED BY THE LAMP LEGEND rather than by an optics table: "LED1 (left)
  - Blue (100G), Green (40G), Cyan (25G), Yellow (10G)", so the cage runs 100G, 40G, 25G and 10G. Whether
  25G and 10G arrive by breakout or by a slower module is not said anywhere and is not guessed here.

  - features.optics-sfp-plus: datasheet, power budget: "1.5 W on SFP+ ports". THE CAGES ARE SFP+ AND RUN
  10G, which is what the panel legends them ("SFP+ 10G") and what the guide''s lamp legend says ("LED1
  (left) - Yellow (10G)"). No breakout or multi-rate table is published for this family and none is invented;
  what IS published is the combo restriction, below.

  - features.timing: 1PPS, 10 MHz and ToD ports, SyncE and IEEE 1588v2 PTP

  - lifecycle.eol: none-announced

  - performance.jumbo-frames: up to 9416 bytes

  - performance.packet-buffer: 8 GB

  - performance.switching-capacity: 14.4 Tbps (28.8 Tbps full duplex)

  - physical.weight-note: 20.5 kg (45.18 lb) with 2 PSUs and 4 fans installed - both documents agree

  - platform.bmc: AST2600 running OpenBMC

  - platform.cpu: Intel Xeon D Ice Lake, 8-core 3.1 GHz

  - platform.memory: 64 GB DDR4 SO-DIMM with ECC

  - platform.software: ONIE preloaded; no NOS image ships on the device

  - platform.storage: 480 GB NVMe SSD

  - platform.switch-silicon: Broadcom BCM88851 Jericho2c+ with a BCM16000 OP2 TCAM

  - platform.tpm: TPM 2.0

  - power.power-budget-per-port-w: SFP+ 1.5, QSFP28 6.5, QSFP-DD 23

  - power.power-draw-typical-w: 421.5

  - thermal.air-filter: quick start guide, "Optional Air Filter": a filter behind a cover held by captive
