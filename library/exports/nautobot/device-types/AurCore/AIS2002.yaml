comments: "AurCore AIS2002 industrial Layer 2+ switch - 8x GbE and 2x GbE SFP in the small AIS fanless\
  \ finned aluminium housing, which clips onto a 35 mm DIN rail or screws to a wall, -40 to 75 C. The\
  \ port face hangs vertically on the rail: a reset, two status lamps, the two SFP lamps and a two-way\
  \ DIP switch at the top, the RJ45 block in two columns and the two SFP cages turned on their side below\
  \ it. Unlike the large housing, the console RJ45 is on the TOP face, beside the dual 12-55 V DC power\
  \ header, the relay contact and the ground screw; the DIN clip and two wall plates are on the back.\n\
