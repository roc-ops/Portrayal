comments: "IP Infusion lists UfiSpace S9502-12SM (NOS: ocnos).\nListed per: OcNOS 7.0.1 MR Hardware Compatibility\
  \ List (IP Infusion, July 2026), the row for S9502-12SM, current supported 'SP 7.0.1'. The names follow\
  \ OcNOS's pattern rather than a table for this box: the port's speed class as prefix (ge 1G, xe 10G\
  \ and 25G, ce 40G and 100G, cd 400G) and one 0-based count across the whole front panel, with eth0 for\
  \ management. That is how the S9510-30XC's own configuration in the OcNOS SP 7.0 Segment Routing Guide\
  \ names its ports - ce0, ce1, xe2 to xe29 - and it is exactly the UfiSpace silkscreen numbering, which\
  \ this box shares. Not every platform counts this way: the AS7316-26XB example in the Layer 3 Guide\
  \ restarts at xe0 after ce0 and ce1, so the rule is applied to UfiSpace boxes whose ports are numbered\
  \ in one run from 0, and nowhere else.\n\nUfiSpace S9502-12SM - 1RU fanless disaggregated open access\
  \ router (cell site gateway) with 8x 100M/1G SFP and 4x 1/10G SFP+; Broadcom Qumran-UX BCM88273 at 32\
  \ Gbps with a 1 GB deep buffer, Intel Denverton-NS, Stratum 3E OCXO timing with 1PPS / 10MHz / ToD interfaces,\
  \ fixed 1+1 redundant 120W AC or DC supplies, -40 to 65 C hardened\n\nConfiguration `dc`: Fixed 1+1\
  \ 120W DC supplies (-36 to -75V, screw-terminal dual feed) - the build the vendor front render and HIG\
  \ Figures 5, 6 and 8 all show, and the only one this model draws; the AC build is a different front\
  \ panel, see gaps\n\nDatasheet: UfiSpace S9502-12SM Disaggregated Open Access Router Datasheet\n  https://www.ufispace.com/products/telco/cell-site-gateway/s9502-12sm\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15 Subpart\
