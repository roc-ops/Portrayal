  \ Class A; SANS 2335; BSMI\n- compliance.environment: RoHS, WEEE\n- compliance.safety: UL 62368-1, IEC\
  \ 60950-1, IEC 62368-1, NRCS, BSMI\n- environmental.operating-humidity: 5% to 85% RH non-condensing\n\
