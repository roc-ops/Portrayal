comments: "IP Infusion lists UfiSpace S9501-28SMT (NOS: ocnos).\nListed per: OcNOS 7.0.1 MR Hardware Compatibility\
  \ List (IP Infusion, July 2026), the row for S9501-28SMT, current supported 'SP 7.0.1'. The names follow\
  \ OcNOS's pattern rather than a table for this box: the port's speed class as prefix (ge 1G, xe 10G\
  \ and 25G, ce 40G and 100G, cd 400G) and one 0-based count across the whole front panel, with eth0 for\
  \ management. That is how the S9510-30XC's own configuration in the OcNOS SP 7.0 Segment Routing Guide\
  \ names its ports - ce0, ce1, xe2 to xe29 - and it is exactly the UfiSpace silkscreen numbering, which\
  \ this box shares. Not every platform counts this way: the AS7316-26XB example in the Layer 3 Guide\
  \ restarts at xe0 after ce0 and ce1, so the rule is applied to UfiSpace boxes whose ports are numbered\
  \ in one run from 0, and nowhere else.\n\nUfiSpace S9501-28SMT 10G Disaggregated Cell Site Gateway Router\
  \ - 1RU, 4x 1G RJ45 + 16x 1G SFP + 8x 10G SFP+ (the last two MACsec-capable), full timing (GNSS/1PPS/10MHz/ToD/BITS),\
  \ Stratum 3E OCXO, dual 200 W PSUs, three hot-swap fans, temperature hardened to -40/+65 C, front-to-back\
  \ airflow\n\nConfiguration `dc`: Dual 200 W DC PSUs (PSU-201-DISB), three FAN-402818-HC exhaust fan\
  \ modules, front-to-back airflow. This is the bare working chassis - the traffic cages ship empty.\n\
  \nDatasheet: UfiSpace S9501-28SMT Disaggregated Cell Site Gateway Router Datasheet\n  https://www.ufispace.com/products/telco/access/s9501-28smt-10g-dcsg\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15 Subpart\
  \ B Class A; ICES-003 Class A; EN 55032 Class A; EN 55035; EN 62479; EN 50663; EN 300 386; EN 301 489;\
  \ EN 303 413; BSMI; VCCI CISPR 32 Class A\n- compliance.environment: RoHS; WEEE\n- compliance.safety:\
  \ UL 62368-1; IEC 60950-1; IEC 62368-1; BSMI\n- environmental.altitude: rated for operation up to 5000\
  \ m (HIG, Connecting Power)\n- environmental.operating-humidity: 5% to 85% RH, non-condensing\n- environmental.operating-temp:\
  \ -40 to 65 C, temperature hardened\n- environmental.storage-humidity: 5% to 93% RH, non-condensing\n\
  - environmental.storage-temp: -40 to 70 C\n- features.cable-limits: ToD, BITS, 1PPS and 10MHz cables\
  \ must not exceed 3 m (HIG section 12)\n- features.gnss: internal receiver for master clock; GPS/QZSS\
  \ L1 C/A, GLONASS L1OF, BeiDou B1, SBAS L1 C/A (WAAS, EGNOS, MSAS, GAGAN), Galileo E1B/C; passive or\
  \ active antenna auto-detected, active supply 5 V DC / 150 mA, minimum RF sensitivity -166 dBm, 30 dB\
  \ minimum signal strength\n- features.macsec: supported; the two cyan-banded SFP+ ports 26-27 are the\
  \ MACsec pair\n- features.optics-sfp: 1G SFP SX, LX, EX, ZX (datasheet compatible transceiver types)\n\
  - features.optics-sfp-plus: 10G SFP+ SR, LR, ER, ZR (datasheet compatible transceiver types)\n- features.timing:\
  \ Stratum 3E OCXO with optional holdover, ITU-T SyncE, IEEE 1588v2 (G.8265.1 default, G.8275.1, G.8275.2,\
  \ SMPTE ST 2059-2 with an additional licence), T-GM, T-BC/OC, T-TC, T-TSC, Class C accuracy\n- features.timing-caveat:\
  \ NOS integration is necessary to activate the specific feature (datasheet footnote, and nine rows of\
