comments: "IP Infusion lists UfiSpace S9500-22XST (NOS: ocnos).\nListed per: OcNOS 7.0.1 MR Hardware Compatibility\
  \ List (IP Infusion, July 2026), the row for S9500-22XST, current supported 'SP 7.0.1'. The names follow\
  \ OcNOS's pattern rather than a table for this box: the port's speed class as prefix (ge 1G, xe 10G\
  \ and 25G, ce 40G and 100G, cd 400G) and one 0-based count across the whole front panel, with eth0 for\
  \ management. That is how the S9510-30XC's own configuration in the OcNOS SP 7.0 Segment Routing Guide\
  \ names its ports - ce0, ce1, xe2 to xe29 - and it is exactly the UfiSpace silkscreen numbering, which\
  \ this box shares. Not every platform counts this way: the AS7316-26XB example in the Layer 3 Guide\
  \ restarts at xe0 after ce0 and ce1, so the rule is applied to UfiSpace boxes whose ports are numbered\
  \ in one run from 0, and nowhere else.\n\nUfiSpace S9500-22XST disaggregated cell site gateway router\
  \ - 1RU temperature-hardened white box, 4x 100M/1G RJ45 plus 8x SFP+ 10G, 8x SFP28 25G and 2x QSFP28\
  \ 100G, a full timing block (GNSS, 1PPS and 10MHz on SMA, BITS on RJ48, ToD on RJ45) with a Stratum\
  \ 3E OCXO and an internal GNSS receiver, Broadcom Qumran-AX at 300 Gbps; two front-service 1+1 PSUs\
  \ and three rear 2+1 fans\n\nConfiguration `dc`: Dual 200W DC PSUs (PSU-201-DISB, screw-terminal input\
  \ marked RTN / -36~-75V, the build both vendor renders show) with three FAN-402825-HD exhaust fans.\
  \ No back-to-front airflow variant is offered in any held document - the datasheet lists one fan SKU\
  \ - and no chassis SKU is printed anywhere (see the chassis-sku gap)\n\nDatasheet: UfiSpace S9500-22XST\
  \ Disaggregated Cell Site Gateway Router Datasheet\n  https://www.ufispace.com/products/telco/access/s9500-22xst-rj45-disaggregated-cell-site-gateway\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15, Subpart\
  \ B, Class A; ICES-003, Class A; EN 55032, Class A; EN 55024; EN 55035; EN 62479; EN 50663; EN 300 386;\
  \ EN 301 489; EN 303 413; BSMI; VCCI CISPR 32, Class A\n- compliance.environment: RoHS; WEEE\n- compliance.safety:\
  \ UL 62368-1; IEC 60950-1; IEC 62368-1; BSMI\n- environmental.operating-humidity: 5 to 85% RH non-condensing\n\
  - environmental.operating-temp: -40 to 65 C (temperature hardened)\n- environmental.storage-humidity:\
  \ 5 to 93% RH non-condensing\n- environmental.storage-temp: -40 to 70 C\n- features.gnss: internal receiver\
  \ for master clock implementations\n- features.optics-qsfp28: 100G SR4/LR4/ER4 (datasheet compatible\
  \ transceiver list)\n- features.optics-sfp-plus: 10G SR/LR/ER/ZR, 1G SX/LX/EX/ZX\n- features.optics-sfp28:\
  \ 25G SR/LR/ER\n- features.timing: Stratum 3E OCXO with optional holdover; ITU-T SyncE; IEEE 1588v2\
  \ default, G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2 (extra licence), T-GM, T-BC/OC, T-TC; Class\
  \ C accuracy. NOS integration is required to activate the timing features\n- features.timing-cables:\
  \ 50 ohm SMA coaxial with 1/4-36UNS-2B for GNSS, 1PPS and 10MHz; shielded RJ45 for ToD; shielded RJ48\
  \ for BITS (datasheet Compatible Timing Cable Types)\n- features.timing-interfaces: GNSS in on SMA,\
  \ 1PPS in/out on SMA, 10MHz in/out on SMA, ToD in on RJ45, BITS in on RJ48 (datasheet Timing Interfaces)\n\
  - lifecycle.eol: none-announced\n- management.console: RJ45 RS-232 and micro-USB, one interface on two\
  \ connectors (labelled IOIO)\n- management.oob: 1x RJ45 100/1000M out-of-band management\n- performance.packet-buffer:\
  \ 2 GB deep buffer\n- performance.switching-capacity: 300 Gbps\n- platform.asic: Broadcom Qumran-AX\
  \ BCM88470\n- platform.bmc: Aspeed AST2400\n- platform.cpu: Intel Broadwell-DE 4-core @ 1.5 GHz\n- platform.memory:\
  \ 8 GB DDR4 (up to 32 GB)\n- platform.storage: 32 GB SSD (up to 128 GB)\n- power.input-ac: 100 to 240\
  \ V, 3 A per feed\n- power.input-dc: -36 to -75 V, 8 A per feed\n- power.power-envelope: bare\n- power.power-typical-w:\
  \ 111.8\n- power.psu-redundancy: 1+1 hot-swappable\n- thermal.fan-redundancy: 2+1 hot-swappable\n\n\
