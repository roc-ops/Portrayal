comments: "IP Infusion lists UfiSpace S8901-54XC (NOS: ocnos).\nListed per: OcNOS 7.0.1 MR Hardware Compatibility\
  \ List (IP Infusion, July 2026), the row for S8901-54XC, current supported 'DC 7.0.1'. The names follow\
  \ OcNOS's pattern rather than a table for this box: the port's speed class as prefix (ge 1G, xe 10G\
  \ and 25G, ce 40G and 100G, cd 400G) and one 0-based count across the whole front panel, with eth0 for\
  \ management. That is how the S9510-30XC's own configuration in the OcNOS SP 7.0 Segment Routing Guide\
  \ names its ports - ce0, ce1, xe2 to xe29 - and it is exactly the UfiSpace silkscreen numbering, which\
  \ this box shares. Not every platform counts this way: the AS7316-26XB example in the Layer 3 Guide\
  \ restarts at xe0 after ce0 and ce1, so the rule is applied to UfiSpace boxes whose ports are numbered\
  \ in one run from 0, and nowhere else.\n\nUfiSpace S8901-54XC data center ToR/leaf switch - 1RU, 48x\
  \ SFP28 25G + 6x QSFP28 100G, Broadcom Trident3-X5, rear 5x hot-swap fans (4+1) and 2x hot-swap 400W\
  \ PSUs (1+1), AC or DC, both airflow directions orderable\n\nConfiguration `base`: DC chassis as it\
  \ powers on - five fans and both 400W DC PSUs seated, every cage empty; front-to-back airflow (red-latch\
  \ FRUs)\n\nDatasheet: UfiSpace S8901-54XC Data Center ToR Switch Datasheet\n  https://www.ufispace.com/products/datacenter/25g/s8901-54xc-25g-100g-data-center-switch\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15 Subpart\
  \ B Class A; ICES-003 Class A; EN 55032 Class A; EN 300 386; EN 55035; VCCI CISPR 32 Class A; AS/NZS\
  \ CISPR 32 Class A\n- compliance.environment: WEEE\n- compliance.other-approvals: MTCTE; NOM\n- compliance.safety:\
  \ UL 62368-1; IEC 62368-1\n- environmental.humidity: 5 to 95% RH non-condensing\n- environmental.operating-temp:\
  \ 0 to 45 C\n- environmental.storage-temp: -40 to 70 C\n- features.optics-qsfp28: 100G SR/LR/ER\n- features.optics-sfp28:\
  \ 25G SR/LR/ER, per datasheet Compatible Transceivers\n- lifecycle.eol: none-announced\n- management.console:\
  \ RJ45 serial, 115200 8N1\n- performance.packet-buffer: 32 MB\n- performance.port-modes-qsfp28: 40/100G\n\
  - performance.port-modes-sfp28: 1/10/25G\n- performance.switching-capacity: 2.0 Tbps\n- platform.asic:\
  \ Broadcom Trident3-X5 BCM56770\n- platform.bmc: ASPEED AST2620\n- platform.cpu: Intel Denverton 4-core\
  \ @ 1.6 GHz\n- platform.memory: 8 GB DDR4 (up to 32 GB)\n- platform.storage: 32 GB SSD\n- power.input-ac:\
  \ 100 to 240V AC, 6A max per feed\n- power.input-dc: -36 to -75V DC, 16A max per feed\n- power.power-envelope:\
  \ bare\n- power.power-max-w: 396.5\n- power.power-typical-w: 120\n- power.psu-options: PSU-401-DESR\
  \ / PSU-401-DISB-1 (400W DC), PSU-401-AESR / PSU-401-AISB (400W AC); exhaust or intake airflow\n- thermal.fan-options:\
  \ FAN-402825-HD (exhaust) / FAN-402825-CD (intake)\n- thermal.fan-redundancy: 4+1 hot-swappable\n\n\
  Drawing version 4.0.3. A major bump means a slot moved or an id was renamed, so anything cached from\
