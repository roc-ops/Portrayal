comments: 'IP Infusion lists Edgecore AIS800-64D-AF (NOS: ocnos).

  Listed per: OcNOS 7.0.1 MR Hardware Compatibility List (IP Infusion, July 2026), the row for AIS800-64D,
  current supported ''DC 7.0.1''.


  64 x 800G QSFP-DD800 AI and data centre 2RU switch on a Broadcom Tomahawk 5 with an Intel Xeon D-1713NTE
  and an OpenBMC service processor, sold as the AIS800-64D. All ports are on the FRONT in TWO BANKS of
  sixteen stacked columns, with two 25G SFP28 in-band management cages, an RJ-45 management jack, a USB
  3.0 Type-A storage port, an RJ-45 console, a ToD jack, 1PPS and 10 MHz timing jacks, six system lamps
  and a reset button; two 3000 W supplies and FOUR fan trays are on the rear. Its twin edgecore/ais800-64o
  is the same chassis with an OSFP800 wall. This is NOT a taller AIS800-32D: the 32-port models are a
  438.4 x 589 x 44 shell with seven 1RU trays and 2400 W Saf-D-Grid supplies, and this is a 440 x 649.2
  x 87 shell with four 2RU trays and 3000 W C20 supplies. Nothing crosses over.


  Configuration `ac-f2b`: Dual 3000 W AC PSUs, front-to-back airflow - red tray bars and red PSU latches,
  which is the build the rear elevation and the datasheet''s first rear photograph show. Rated 0-40 C
  at 1800 m.


  Facts carried in the model that this schema has no field for:

  - environmental.altitude: Operating: 1800 m

  - environmental.humidity: Operating: 5% to 95% non-condensing

  - environmental.operating-temp: 0 to 40 C (front-to-back); 0 to 35 C (back-to-front), subject to used
  optics

  - environmental.storage-temp: -40 to 70 C

  - features.optics-qsfp-dd: datasheet: each port takes 1 x 800 GbE on 8 lanes of 100G PAM4, or breaks
  out to 2 x 400G, 4 x 200G or 8 x 100G. Maximum 320 logical ports.

  - lifecycle.eol: none-announced

  - performance.jumbo-frames: up to 9416 bytes

  - performance.logical-ports: up to 320

  - performance.switching-capacity: 51.2 Tbps (102.4 Tbps full duplex)

  - physical.weight-note: 21.2 kg (46.73 lb) with 2 PSUs and 4 fans installed (quick start guide); the
  datasheet says 21.5 kg (47.4 lb)

  - platform.bmc: AST2600 running OpenBMC, secured by an AST1060 root of trust

  - platform.cpu: Intel Xeon D-1713NTE Ice Lake D, 4-core 2.2 GHz, COM Type 7

  - platform.memory: 32 GB DDR4 SO-DIMM with ECC

  - platform.software: ONIE preloaded; no NOS image ships on the device

  - platform.storage: 240 GB M.2 2280 NVMe SSD

  - platform.switch-silicon: Broadcom BCM78900 Tomahawk 5

  - platform.tpm: TPM 2.0 SPI

  - power.power-budget-per-port-w: 30

  - power.power-draw-max-w: 2775


