  - environmental.temperature-operating: 0 C to 40 C (32 F to 104 F)

  - environmental.temperature-storage: -40 C to 70 C (-40 F to 158 F)

  - features.optics-qsfp28: 100GBASE-CR4/SR4/LR4/PSM4 and AOC, 40GBASE-CR4/SR4/LR4, 25GBASE-CR4 and AOC,
  10GBASE-CR/SR/LR

  - features.optics-sfp-plus: 10GBASE-SR/LR, 10G DAC/AOC, 1000BASE-T/SX/LX

  - features.port-leds-qsfp28: four per port, one per lane - 1 green 100 Gbps, 1 blue 40 Gbps, 1-4 amber
