comments: 'IP Infusion lists Edgecore 5916-54XL-O-AC-F (NOS: ocnos).

  Listed per: OcNOS 7.0.1 MR Hardware Compatibility List (IP Infusion, July 2026), the row for AS5916-54XL,
  current supported ''SP 7.0.1''.


  48x 10G SFP+ plus 6x 100G QSFP28 1RU aggregation router, sold as the AGR110, Broadcom BCM88370 Qumran-MX
  with a BCM15K TCAM, Intel Xeon D-1518, ONIE-preloaded. All ports on the front, numbered from 0 with
  even ports on the top row; two 650 W AC or -48 VDC PSUs and six 5+1 fan trays from the rear, front-to-back
  airflow in every ordering code published.


  Configuration `ac`: Two 650 W AC supplies and six fan trays, front-to-back. This is a fixed 1RU router,
  so the base configuration is the box as it is bought - supplies and fans populated, cages empty.


  Also sold or listed as: AGR110


  Facts carried in the model that this schema has no field for:

  - compliance.emissions: EN 55032:2015+AC:2016 Class A, EN 61000-3-2:2014 Class A, EN 61000-3-3:2013,
  FCC Class A, VCCI Class A, CE Mark, BSMI Class A CNS 13438

  - compliance.immunity: EN 55024:2010+A1:2015, IEC 61000-4-2/3/4/5/6/8/11

