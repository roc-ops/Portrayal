comments: "Eaton Tripp Lite series basic PDU, 1U horizontal: a black metal box about 434 mm wide and 108\
  \ mm deep. It hands a single-phase 100 to 240 V feed, 16 A, on to 14 unswitched outlets in one load\
  \ bank. On the front, four IEC C13 outlets. On the rear are an IEC C20 inlet for a cord the user supplies,\
  \ a grounding stud and two 16 A push-to-reset breakers. Also on the rear, two IEC C19 outlets and eight\
  \ IEC C13 outlets. No switch, no meter, no network interface. The housing is reversible and its two\
  \ mounting ears are separate brackets, which also turn for 0U, wall and under-counter mounting.\n\n\
  Configuration `base`: The PDU as it ships: no cord, nothing seated. The two mounting ears are on it\
  \ and are drawn only where a viewer asks for ears. The cable clamp and its screws are in the box and\
  \ are not drawn.\n\nRack mounting positions: flush (\"mounting ears flush with the four-outlet face\
