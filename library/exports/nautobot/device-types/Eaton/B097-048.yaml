comments: 'Eaton Tripp Lite series B097-048, a 48-port serial console server, 1U, for a desktop or a 19
  inch rack. The rear carries 48 RJ45 serial ports in two rows of 24 and three groups of eight columns,
  two RJ45 Ethernet ports (NET1 and NET2) and two IEC AC inlets, each with a rocker switch, for its two
  built-in supplies. The front carries an RJ45 console port, two USB-A ports, an erase pinhole and four
  status lamps. The rack-mount kit fits to the sides of the body.


  Configuration `base`: B097-048 as it ships: two C13 to NEMA 5-15P cords, two Cat5e patch cables, three
  serial adapters, the rack-mount kit and six rubber feet are in the box and are not drawn.


  Rack mounting positions: flush ("rack-mount kit on the sides, flush with the front (quick start guide
  p. 2)"; as shipped).


  Facts carried in the model that this schema has no field for:

  - environmental.operating-humidity: 5% to 90% non-condensing RH

  - environmental.operating-temp-c: 5 to 50

  - environmental.storage-temp-c: -30 to 60

  - features.serial-pinout: Cisco straight RJ45 (owner''s manual pp. 10 and 274): 1 CTS, 2 DSR, 3 RXD,
  4 GND, 5 GND, 6 TXD, 7 DTR, 8 RTS

  - physical.weight-note: 9 lb (4 kg) in the owner''s manual, p. 273; 7.6 lb on the product specifications
  page; no weight is stated for this model

  - platform.storage: 4 GB flash (owner''s manual p. 8; the specifications page title reads 4 Gb)

  - power.power-consumption: 25 W (specifications page); less than 30 W (owner''s manual)

  - power.power-input: 100 to 240 VAC, 50/60 Hz, two built-in supplies with automatic failover, two C14
  inlets (specifications page)


