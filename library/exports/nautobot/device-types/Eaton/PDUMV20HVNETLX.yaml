comments: "Eaton Tripp Lite series switched PDU, 0U: a 1776 mm black metal strip that hangs on two toolless\
  \ mounting buttons beside a rack and hands a single-phase 208/230 V feed (a C20 inlet on the face, with\
  \ a detachable 10 ft cord ending in a NEMA L6-20P, 16 A, 3.68 kW) on to 24 individually switched outlets\
  \ - 20 IEC C13 and 4 IEC C19 - in two separately breakered load banks of twelve, each with a lamp. Between\
  \ the banks, a two-digit load meter and the built-in LX Platform network interface (a 10/100 Ethernet\
  \ port, an RJ45 console port, a USB-A port for environmental sensors, a reset button and a status lamp).\n\
  \nConfiguration `base`: The PDU as it ships, with the LX Platform interface built in. The detachable\
  \ L6-20P cord, the rack-mounting brackets, the cord retention bracket, the PDUMVROTATEBRKT brackets\
  \ and the plug-lock inserts are in the box and are not drawn.\n\nMounts on the side of a rack's upright,\
  \ beside the rack; occupies no rack unit.\n\nPDU class: switched-metered-branch (metering-scope branch,\
  \ outlet-switching true).\n\nInput rating: 230 V single-phase, 16 A input (20 A plug).\n\nDatasheet:\
