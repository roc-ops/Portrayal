comments: "Eaton Rack PDU G4, managed, 0U: an 1829 mm black aluminium strip that hangs on two mounting\
  \ buttons in a rack's vertical channel and hands a three-phase 208 V delta feed (a fixed 10 ft cord\
  \ with a CS8365C plug, 40 A, 14.4 kW) on to 42 outlets - 24 IEC C13 and 18 Eaton C39 - in six colour-coded\
  \ sections of seven, A to F. Every section has its own 20 A two-pole breaker, line to line, and every\
  \ outlet is metered and switched, with a lamp at its end that shows green when it is on and red when\
  \ it is off. A hot-swappable network module with two gigabit Ethernet ports, a pixel LCD and four keys\
  \ sits between sections C and D.\n\nConfiguration `base`: The PDU as it ships, the network module in\
  \ its slot.\n\nMounts on the side of a rack's upright, beside the rack; occupies no rack unit.\n\nPDU\
  \ class: managed (metering-scope outlet, outlet-switching true).\n\nInput rating: 208 V three-phase\
  \ delta, 40 A input (50 A plug).\n\nDatasheet: Eaton EVMA8365X SKU specifications (skuPage.EVMA8365X.pdf)\n\
  \  https://www.eaton.com/us/en-us/skuPage.EVMA8365X.pdf\n\nFacts carried in the model that this schema\
  \ has no field for:\n- compliance.cybersecurity: UL 2900-1, IEC 62443-4-2\n- compliance.emc: FCC part\
  \ 15 class A, CAN ICES-003 class A\n- compliance.regulatory-model: EMAF-PHXJ-G28K\n- compliance.safety:\
  \ UL 62368-1; cTUVus on the drawing\n- environmental.operating-temp: 0 to 60 C (32 to 140 F)\n- lifecycle.eol:\
  \ none-announced\n- management.metering: current, power and energy for the input and each outlet; current\
  \ for each branch\n- management.metering-scope: outlet\n- management.network-module: G4 eNMC, dual gigabit\
  \ Ethernet with network cascading\n- management.outlet-switching: true\n- physical.construction: aluminium\
  \ chassis, black\n- physical.length-mm: 1829\n- physical.weight-kg: 12.8\n- power.breakers: six 20 A\
  \ two-pole, listed\n- power.capacity-kw: 14.4\n- power.capacity-scope: the load the PDU can hand on\
