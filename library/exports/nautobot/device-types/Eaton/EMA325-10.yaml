comments: "Eaton ePDU G3 managed rack PDU, 0U, three-phase. A 1689 mm black aluminium strip that hangs\
  \ on two mounting buttons beside a rack. It takes a 120/208 V three-phase feed through a fixed 10 ft\
  \ cord that ends in a NEMA L21-20P (16 A, 5.76 kW). It feeds 18 IEC C13 and 6 IEC C19 outlets in three\
  \ sections of eight. The sections are A (yellow), B (blue) and C (red), each on its own 20 A two-pole\
  \ breaker. Between sections A and B is the network module. It has a serial RJ-45, a network RJ-45, a\
  \ daisy chain RJ-45, a USB-A port, a display and four buttons. The PDU meters the input, each branch\
  \ and each outlet, and it switches the outlets.\n\nConfiguration `base`: The PDU as it ships. The installation\
  \ kit (SPK012) and the network kit (SPK013) are listed as included and are not drawn. The environmental\
  \ probe (EMP001) is optional and is not drawn.\n\nMounts on the side of a rack's upright, beside the\
  \ rack; occupies no rack unit.\n\nPDU class: managed (metering-scope outlet, outlet-switching true).\n\
  \nInput rating: 208 V three-phase wye, 16 A input (20 A plug).\n\nDatasheet: Eaton EMA325-10 product\
