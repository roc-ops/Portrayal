comments: "Eaton Tripp Lite series switched PDU, 1U horizontal, a 440 mm black metal box. It hands a single-phase\
  \ 208/230 V feed on to eight individually switched IEC C13 outlets, each with a lamp, all on the front.\
  \ The input is a C20 inlet at the right end of the front. It takes the detachable 8 ft cord in the box,\
  \ which comes with a C19-to-L6-20P adapter. Beside it are a pre-installed WEBCARDLX network card and\
  \ a two-digit meter of the total load in amps. The card has 10/100 Ethernet, a micro-USB console, USB-A\
  \ for sensors, a reset button and a status lamp. The rear has a ground screw and a DE-9 port reserved\
  \ for the factory.\n\nConfiguration `base`: The PDU as it ships, the WEBCARDLX in its slot. The mounting\
  \ brackets, the cord retainer, the 8 ft input cord, the C19 to L6-20P adapter and the configuration\
  \ cable are in the box. They are not drawn.\n\nRack mounting positions: flush (\"mounting brackets flush\
