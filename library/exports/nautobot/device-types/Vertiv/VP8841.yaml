comments: "Vertiv Geist unit-level monitored rack PDU, vertical, 208 V, 30 A, 4.9 kW. It has a fixed 10\
  \ ft input cord with a NEMA L6-30P plug. Thirty-six IEC C13 and six IEC C19 outlets sit on the front,\
  \ in two circuits of eighteen C13 and three C19. Each circuit has one 20 A double-pole magnetic breaker.\
  \ A monitoring module with two Ethernet ports and a four-digit display sits between the circuits.\n\n\
  Configuration `base`: The PDU as it ships, the monitoring module in its slot.\n\nMounts on the side\
  \ of a rack's upright, beside the rack; occupies no rack unit.\n\nPDU class: metered-branch (metering-scope\
  \ branch, outlet-switching false).\n\nInput rating: 208 V single-phase, 30 A input.\n\nDatasheet: Vertiv\
  \ Geist rPDU data sheet SL-26176, VP8841\n  https://www.vertiv.com/globalassets/shared/vp8841-vertiv-rack-pdu-data-sheet-sl-26176-north-america.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.certifications: FCC Part\
