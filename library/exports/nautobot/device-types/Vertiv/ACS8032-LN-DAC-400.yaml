comments: 'Vertiv Avocent ACS8000 advanced console server, the 32-port cellular unit with dual AC power
  (AT&T 4G/LTE), 1U. It has 32 RJ45 serial ports, an RJ45 console port, two 10/100/1000 RJ45 LAN ports
  and two SFP cages. The maker''s front carries two AC inlets, each with its own power switch. It also
  has a digital-in jack, a sensor jack, six USB ports, an SD card slot and two SMA antenna jacks printed
  AUX and CELL. On the rear it carries the serial ports, the console port, two more USB ports, the LAN
  ports and three lamps. The first two serial ports take RS-232, RS-422 or RS-485. The AC inlets are on
  the face the rack mounting guide fits the brackets to, so they are the front here. The antennas are
  not drawn.


  Configuration `base`: ACS8032-LN-DAC-400, the 32-port cellular unit (AT&T) with a dual AC power supply
  (two inlets). The rack mounting brackets and screws are supplied with the unit (Rack Mounting Guide
  590-1510-501C).


  Rack mounting positions: flush ("1U rack mount"; as shipped).


  Facts carried in the model that this schema has no field for:

  - compliance.certification: Emissions and immunity: FCC Class A, CE Class A, ICES-003, VCCI, RCM, KCC,
  BSMI, UKCA. Safety: UL, cUL, EN/IEC 62368-1, BSMI, BIS, NOM, UKCA. The cellular approvals are for cellular
  models (data sheet).

  - environmental.operating-humidity: 20% to 80% non-condensing RH

  - environmental.operating-temp-c: -10 to 60

  - environmental.storage-humidity: 5% to 95% non-condensing RH

  - environmental.storage-temp-c: -20 to 70

  - features.cellular: 4G/LTE Cat.4 with 3G fallback, AT&T (data sheet page 2). The SIM is a 2FF/mini
  card in a slot behind a screw cover on the top. The ACS80xx-LN models support bands B2, B4, B5, B12,
  B13. Two SMA antenna connectors (data sheet page 2; APAC edition page 2).

  - features.optics-sfp: 1 Gb SFP fibre modules (data sheet benefits, "Integrated support for 1Gb SFP
  fiber modules")

  - features.sensor-ports: environmental sensor port (RJ45, 1-wire) and four digital-in ports on the one
  DIGITAL IN jack (data sheet)

  - features.serial-pinout: automatic Cyclades and Cisco pin-out conversion (data sheet)

  - physical.weight-note: 6.4 to 7.2 lb for the line (data sheet); no weight is given for this model

  - platform.cpu: Dual-core ARM Cortex-A9 MPCore with CoreSight

  - platform.ram: 1 GB DDR3L

  - platform.storage: 16 GB eMMC flash

  - power.power-input: 100 to 240 VAC, 50/60 Hz, 1 A at each of two C14 inlets (inlet legend and data
  sheet)

  - power.power-max-w: 28

  - power.power-usage: typical 6.2 W (0.13 A) at 120 VAC and 7 W (0.10 A) at 240 VAC; maximum 28 W at
  both (data sheet)

  - power.psu-redundancy: two AC entries, redundant; both expected connected by default (data sheet; installer
  guide p.13). The power figures are the line''s; none is given per supply


