comments: "Vertiv Geist basic rack PDU, vertical, 230/400 V three-phase, 16 A, 11.0 kW. It has a fixed\
  \ 3 m input cord with an IEC 60309 3P+N+E plug. Thirty-six IEC C13 outlets in six banks of six and six\
  \ IEC C19 outlets sit on the front. Each phase feeds twelve C13 and two C19. The unit has no breaker\
  \ and no meter.\n\nConfiguration `base`: The PDU as it ships.\n\nMounts on the side of a rack's upright,\
