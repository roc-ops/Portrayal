comments: 'MaiaEdge Port Extender - a 1RU switch sold to expand a Path Border Controller''s physical port
  count. 48 SFP28 tenant ports in two rows and 8 QSFP28 fabric uplinks on a black face; a bare-steel chassis
  with 1+1 supplies, four fans and the management jacks behind. Its port roles are configured from the
  MaiaEdge portal rather than on the box, which is what distinguishes it from the third-party switches
  that can stand in for it.


  Facts carried in the model that this schema has no field for:

  - environmental.mtbf-hours: 150000

  - environmental.operating-humidity: 5% to 90% non-condensing

  - environmental.operating-temp-c: 0 to 45

  - lifecycle.eol: none-announced

  - performance.latency-overhead-ns: 500

  - performance.packet-buffer: 32 MB

  - performance.switching-capacity: 2.0 Tbps

  - platform.bmc: integrated BMC plane, IPMI 2.0 compliant

  - platform.cpu: Intel x86, up to 8 cores

  - platform.memory: 8-32 GB ECC DDR4

  - platform.storage: configurable M.2 SSD

  - power.input: ac-or-dc

  - power.power-max-w: 500

  - power.power-typical-w: 350

  - power.psu-redundancy: 1+1 hot-swappable

  - thermal.airflow: front-to-back or back-to-front

  - thermal.fan-redundancy: 3+1


