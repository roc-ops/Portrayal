comments: "Ubiquiti USW-Pro-24-PoE (UniFi Switch Pro 24 PoE) is a fixed 1RU Layer 2 switch. Its front\
  \ carries 24 Gigabit RJ45 ports in two stacked rows, 16 PoE/PoE+ and 8 60 W PoE++, two 1/10G SFP+ ports\
  \ in a column beside them, a 1.3 inch touchscreen on the left and a recessed factory-reset button. The\
  \ rear carries the AC power inlet and the USP RPS DC input for an external redundant supply. The 450\
  \ W supply is internal, so it is part of the chassis and not a bay.\n\nConfiguration `base`: USW-Pro-24-PoE\
