comments: 'Opengear OM2224-24E-L Operations Manager, a 1RU rack appliance with dual AC power. It has 24
  RJ45 RS-232 serial ports and a 24-port managed Ethernet switch on the front. Two 1G combination ports
  NET1 and NET2 take an RJ45 or an SFP. Two USB 3.0 ports, an RJ45 console and a micro-USB console are
  on the front. Eight USB 2.0 ports, two SIM slots, three antenna jacks and two IEC C14 power inlets are
  on the rear.


