comments: '48x 10/100/1000 PoE+ RJ-45 and 4 uplink cages - two 1G SFP and two that take 1G SFP or 10G
  SFP+ - on a stackable 1RU switch, the 48PD of the Catalyst 3650. The downlinks, the mode button and
  status lamps, the USB Type A port and the uplink module are on the front; the RJ-45 console port, the
  Ethernet management port, the ground connector, three fan modules, two StackWise ports and two power
  supply bays are on the rear. Ports number 1-48 and run DOWN each column - odd on the top row, even beneath
  it. It ships with one 640 W AC supply and a blank cover in the second bay. -L, -S and -E are the LAN
  Base, IP Base and IP Services software images of this one hardware and are not separate devices.


  Configuration `ac`: One PWR-C2-640WAC in bay 1 and the PWR-C2-BLANK cover in bay 2, three FAN-T1 fan
  modules and a StackWise adapter blank in each StackWise port - the switch as Table 1-1 sells it, with
  every port empty. The guide prints a SKU for each software image, WS-C3650-48PD-L, -S and -E, and none
  for the hardware alone, so this build carries no part number.


  Also sold or listed as: Catalyst 3650-48PD, WS-C3650-48PD-L, WS-C3650-48PD-S, WS-C3650-48PD-E


  Rack mounting positions: flush ("front-mounting position"; as shipped), rear ("rear-mounting position").


  Facts carried in the model that this schema has no field for:

  - environmental.altitude: storage up to 5000 m (16,400 ft)

  - environmental.humidity: 5 to 96%, noncondensing

  - environmental.operating-temp: -5 to +45 C up to 1500 m, -5 to +40 C up to 3000 m, -5 to +35 C up to
  4000 m, -5 to +30 C up to 5000 m with an AC supply (spec Table 1-1)

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F)

  - features.stacking: StackWise-160; a 3650 cannot stack with a 3850 (StackWise Ports)

  - features.uplink-optics: SFP on G1 and G2; SFP or SFP+ on G3/TE3 and G4/TE4; an SFP+ module in an SFP-only
  slot does not operate

  - features.usb-storage: USB Type A port for Cisco USB flash drives of 64 MB to 1 GB

  - physical.stackwise-adapter-weight: 0.25 lb (0.11 kg) for a StackWise stacking adapter, 0.1 lb (0.05
  kg) for an adapter blank (spec Table 1-1)

  - physical.weight-note: 16.75 lb (7.6 kg) for the 48-port PoE switch, as shipped with three fans, two
  StackWise adapter blanks, one power supply blank and the default power supply (spec Table 1-1)

  - power.poe-budget: 390 W with one PWR-C2-640WAC (Table 1-13); 780 W with two 640 W DC supplies (Table
  1-14)

  - power.poe-power-per-port: up to 15.4 W (IEEE 802.3af) and up to 30 W PoE+ (IEEE 802.3at) per port
  (PoE+ and Cisco UPOE Ports)

  - power.power-supply-options: PWR-C2-250WAC, PWR-C2-640WAC, PWR-C2-1025WAC, PWR-C2-640WDC (Power Supply
  for Catalyst 3650-24TS/PS/TD/PD and 3650-48TS/PS/FS/TD/PD/FD/FQ/PQ/TQ)

  - power.psu-redundancy: two supply slots; the switch operates on one or two supplies, and on two AC,
  two DC or one of each


