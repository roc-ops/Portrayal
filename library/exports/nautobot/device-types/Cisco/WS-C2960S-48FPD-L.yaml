comments: '48x 10/100/1000 PoE+ RJ-45 (740 W PoE budget) and 2x SFP+ uplink 1RU stackable access switch
  running LAN Base. The front carries the mode button and switch lamps at the left, four blocks of twelve
  jacks in two rows, then the USB Type A port, the USB mini-Type B and RJ-45 console ports, the Ethernet
  management port and the two SFP+ slots. The rear carries the FlexStack module slot with its blank cover,
  the fan exhaust, the RPS connector and the AC inlet of the built-in supply. Ports number 1-48 and run
  DOWN each column - odd on the top row, even beneath it. Slots 49 and 50 are the SFP+ pair.


  Configuration `ws-c2960s-48fpd-l`: WS-C2960S-48FPD-L, the model''s only SKU (Table 1-1, LAN Base, PoE
  budget 740 W). It seats the blank cover in the FlexStack slot: the stack kit is a separate, optional
  part (PDF p21, printed 1-19) and the cover is removed only to fit the module (PDF p31).


  Also sold or listed as: Catalyst 2960S-48FPD-L


  Rack mounting positions: flush ("front-mounting position (Figures 1-12 and 1-13)"; as shipped), mid
  ("mid-mounting position"), rear ("rear-mounting position").


  Facts carried in the model that this schema has no field for:

  - features.optics-sfp-plus: Table 1-3 Supported SFP+ Modules (PDF p12, printed 1-10), the row listing
  this model: SFP-10G-LR=, SFP-10G-SR=, SFP-10G-LRM=, and SFP-H10GB-CU1M=, -CU3M= and -CU5M= twinax cables.

  - features.sfp-plus-slots: 2 SFP+ module slots (49 and 50), 10 Gigabit; the SFP+ slots also take 1 Gigabit
  SFP modules

  - features.stacking: FlexStack, optional C2960S-STACK module in the rear slot

  - management.console: USB mini-Type B and RJ-45; the USB port has priority when both are connected (Table
  1-10)

  - physical.weight-note: 13 lb (5.89 kg), spec Table 1-2 row Catalyst 2960S-48FPD-L

  - power.heat-dissipation-btu-hr: 440

  - power.poe-budget-w: 740

