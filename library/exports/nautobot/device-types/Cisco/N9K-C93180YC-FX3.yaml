comments: '48x 100M/1/10/25G SFP28 and 6x 10/25/40/50/100G QSFP28 1RU data-centre leaf switch running
  NX-OS. The port side carries all fifty-four ports, two coaxial timing jacks, a GNSS antenna jack and
  six lamps. The other side carries two power supplies, four fan modules, the console, the management
  port, a ToD jack and the USB port. Ports number 1-54 and run DOWN each column, odd on the top row. Ships
  port-side intake (burgundy modules) or port-side exhaust (blue).


  Configuration `ac-650w-port-side-intake`: Dual NXA-PAC-650W-PI supplies and four NXA-FAN-35CFM-PI fan
  modules: port-side intake airflow, burgundy latches


  Also sold or listed as: Nexus 93180YC-FX3, Nexus 93180YC-FX3H


  Rack mounting positions: recessed ("port end to the front, set back for interface cables"), recessed
  ("module end to the front, set back for module handles").


  Rail kits: cisco/nxk-acc-kit-1ru@1 (sold separately).


