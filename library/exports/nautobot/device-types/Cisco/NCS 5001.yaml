  exhaust and with AC or DC supplies, four builds of one front panel. The guide says nothing about end-of-sale;
  the status is unknown.


  Configuration `ac-port-side-intake`: Two NC5K-PAC-650W-FR supplies and two NCS-5001-FN-FR fan modules:
  AC power, front-to-back airflow (port-side intake).


  Also sold or listed as: NCS-5001


  Rack mounting positions: flush ("front bracket"; as shipped).


