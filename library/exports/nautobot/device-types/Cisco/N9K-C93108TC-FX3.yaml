comments: '48x 100M/1G/10GBASE-T and 6x 40/100G QSFP28 1RU data-centre leaf switch running NX-OS. The
  port side carries all fifty-four ports and the BCN, STS and ENV lamps. The other side carries two power
  supplies, four fan modules, the console, an RJ-45 and an SFP management port and the USB port. Ports
  number 1-54 and run DOWN each column, odd on the top row. Ships port-side intake (burgundy modules)
  or port-side exhaust (blue).


  Configuration `ac-500w-port-side-intake`: Dual NXA-PAC-500W-PI supplies and four NXA-SFAN-35CFM-PI fan
  modules: port-side intake airflow, burgundy latches


  Also sold or listed as: Nexus 93108TC-FX3


  Rack mounting positions: recessed ("port end to the front, set back for interface cables"), recessed
  ("module end to the front, set back for module handles").


