comments: 'Cisco ASR 9904 Router - the smallest modular chassis of the ASR 9900 generation, four slots
  in 6 RU. Cards mount HORIZONTALLY and the redundant RSP pair sits in the MIDDLE, slots 1 and 2, with
  a line card above and below it. A single fan tray is fitted from the rear and a power shelf of four
  modules fills the bottom. Modelled as a BARE CAGE. The card openings are cutouts rather than bays for
  now - see gaps.


  Configuration `base`: Chassis only - what you spec before deciding what goes in it. The 4 slot bays
  are EMPTY; nothing else is fitted. Enough to power on and reach the box, which is the question most
  people ask first and the one `default` used to answer with whatever the drawing happened to be populated
  with.


