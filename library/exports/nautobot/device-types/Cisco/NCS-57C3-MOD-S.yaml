comments: 'Cisco Network Convergence System 57C3-MOD-S, a three-rack-unit fixed-port router with forty-eight
  25G SFP28 ports and eight 100G QSFP28 ports, three modular port adapter bays, two route processor bays
  and two 1600 W power supply bays, all at the front, and six fan trays at the rear. NCS-57C3-MOD-S is
  the perpetual-licensing product ID and NCS-57C3-MOD-SYS the flexible-consumption one: one hardware,
  two licensing IDs. The port adapter bays hold their blanks here; the adapters themselves are left to
  a later batch. The guide says nothing about end-of-sale; the status is unknown.


  Configuration `ac-port-side-intake`: Two NC57-1600W-ACFW supplies, six fan trays (two NC57-C3-FAN2-FW
  and four NC57-C3-FAN1-FW), two NC57-MOD-RP2-E route processors and three NC55-MPA-BLNK blanks: AC power,
  port-side intake.


  Also sold or listed as: NCS-57C3-MOD-SYS, NCS-57C3-MOD


  Rack mounting positions: flush ("bracket ears at the front"; as shipped).


  Facts carried in the model that this schema has no field for:

  - features.optics-qsfp28: guide Table 2 lists eight 100G QSFP28 ports

  - features.optics-sfp28: guide Table 2 lists forty-eight 25G SFP28 ports

  - features.redundancy: two 1+1 power supplies and two route processors, one active and one standby;
  the fan trays work with N+1 redundancy (guide, Fan Modules and Fan Trays)

  - power.power-supply-options: NC57-1600W-ACFW (AC) and NC57-1600W-DCFW (DC), 1600 W each, two, 1+1 redundant,
  installed from the front


  Drawing version 1.0.0. A major bump means a slot moved or an id was renamed, so anything cached from
  an earlier export may no longer line up.

  Model maturity: modelled. Every dimension in the source records where it came from.'
