comments: '24x 10/100/1000 RJ-45 and 2x SFP+ uplink 1RU stackable access switch running LAN Base, without
  PoE. The front carries the mode button and switch lamps at the left, two blocks of twelve jacks in two
  rows at the right of the face, then the USB Type A port, the USB mini-Type B and RJ-45 console ports,
  the Ethernet management port and the two SFP+ slots. The rear carries the FlexStack module slot with
  its blank cover, the fan exhaust, the RPS connector and the AC inlet of the built-in supply. Ports number
  1-24 and run DOWN each column - odd on the top row, even beneath it. The SFP+ pair follows the copper
  ports.


  Configuration `ws-c2960s-24td-l`: WS-C2960S-24TD-L, the model''s only SKU (Table 1-1, LAN Base, no PoE).
  It seats the blank cover in the FlexStack slot: the stack kit is a separate, optional part (PDF p21,
  printed 1-19) and the cover is removed only to fit the module (PDF p31).


  Also sold or listed as: Catalyst 2960S-24TD-L


  Rack mounting positions: flush ("front-mounting position (Figures 1-12 and 1-13)"; as shipped), mid
  ("mid-mounting position"), rear ("rear-mounting position").


