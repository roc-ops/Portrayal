comments: '48x 1/10/25G SFP28 and 6x 40/100G QSFP28 1RU data-centre leaf switch on Cisco''s Cloud Scale
  LSE ASIC, running NX-OS or ACI. All fifty-four ports and the BCN, STS and ENV lamps are on the port
  side; two power supplies, four fan modules, the console, both management ports and the USB are on the
  other. Ports number 1-54 and run DOWN each column - odd on the top row, even beneath it. Ships port-side
  intake (burgundy modules) or port-side exhaust (blue). End-of-sale was announced in August 2021.


  Configuration `ac-port-side-intake`: Dual NXA-PAC-650W-PI supplies and four NXA-FAN-30CFM-B fan modules
  - port-side intake airflow, burgundy latches


  Also sold or listed as: Nexus 93180YC-EX


