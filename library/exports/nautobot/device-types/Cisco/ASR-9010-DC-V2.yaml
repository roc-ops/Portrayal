comments: 'Cisco ASR 9010 Router - the 21RU, ten-slot member of the ASR 9000 Series Aggregation Services
  Routers. Cards mount VERTICALLY across the full width of the cage: the two CENTRE slots, 4 and 5, are
  reserved for a redundant RSP pair, with four line card slots either side of them. A cable management
  tray runs along the top, two stacked fan trays and a front air intake sit below the cage, and two power
  shelves fill the bottom. Modelled as a BARE CAGE: every slot is a bay a card component drops into, not
  a traced faceplate.


  Configuration `dc`: ASR 9010 DC Chassis with PEM Version 2 - the chassis ordered with a version 2 DC
  power feed. The difference is which modules seat in the power tray; the chassis is the same metal either
  way, which is why this is a configuration and not a separate device.


