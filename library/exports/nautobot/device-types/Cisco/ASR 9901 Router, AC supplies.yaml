comments: 'Cisco ASR 9000 Series ASR 9901 Router - a 2 RU fixed-port provider-edge router with an integrated
  route processor and 456 Gbps of fabric. Everything a user touches is on the front: forty-two ports across
  the top in five blocks - eight 1GE, twelve dual-rate 10/1GE, two 100GE, twelve more 10/1GE and eight
  more 1GE - and below them the timing, management and console jacks, nine alarm lamps, a four-character
  LED matrix display and the shelf power switch. The rear carries three fan trays and two 1.6 kW supplies.
  Airflow is front to back, and nothing seats on the front face at all.


  Configuration `ac`: The AC build: two A9K-1600W-AC modules, 1+1, on Saf-D-Grid cords - CAB-AC-16A-SG-*
  at 16 A 250 VAC worldwide, CAB-AC-20A-SG-US and -US1 at 20 A for North America. Named explicitly even
  though the base already seats them, so that asking for the AC variant does not mean knowing which flavour
  the base happens to carry.


  Facts carried in the model that this schema has no field for:

  - compliance.nebs: designed to meet SR-3580 NEBS Criteria Level 3 and GR-1089-CORE NEBS EMC and Safety

  - environmental.operating-altitude: 0 to 4000 m

  - environmental.operating-humidity: 10 to 85 percent nominal, 5 to 90 percent short-term

  - environmental.operating-temp: 5 to 40 C (41 to 104 F) nominal, -5 to 55 C short-term

  - environmental.storage-humidity: 5 to 95 percent

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F)

  - features.display: four-character LED matrix

  - features.timing: 2 x BITS/J.211 SYNC RJ-45, IEEE 1588 service LAN and ToD RJ-45, 10 MHz and 1 PPS
  SMB

  - lifecycle.eol: none-announced

  - management.auxiliary: RJ-45 serial

  - management.cmp-port: 1 x RJ-45 connectivity management processor

  - management.console: RJ-45 serial

  - management.mgmt-ethernet: 2 x RJ-45

  - management.usb: 1 x USB class A

  - performance.capacity: 456 Gbps nonblocking full-duplex

  - performance.integrated-interfaces: 16 x 1GE SFP, 24 x 1/10GE SFP/SFP+, 2 x 100GE QSFP28

  - performance.port-modes-qsfp28: 100GbE - data sheet Table 2, "2x100 GE". Figure 121 numbers them 20
  and 21

  - performance.port-modes-sfp: 1GbE only - data sheet Table 2, "16x1 GE", and the install guide, "16
  ports that support 1 GbE (using SFP)". Cisco publishes no per-optic list for this chassis

  - performance.port-modes-sfp-plus: 1GbE or 10GbE dual-rate - install guide, "24 ports that support 1
  GbE (using SFP) or 10 GbE (using SFP+)", with the note that 1 GE copper transceivers work from IOS-XR
  7.0.1 at 1 GE only, and that 10 and 100 Mbps are not supported

