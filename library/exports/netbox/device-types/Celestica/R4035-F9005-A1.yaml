comments: 'Celestica DS4100 - a 1RU 16-port 800G data-centre switch: sixteen OSFP ports in two blocks
  of four stacked columns across the middle of a black front panel, a stacked pair of 10G SFP+ management
  cages (M1/M2) to their left, and at the right four system lamps beside one silver housing that stacks
  an RJ45 console, a USB 3.0 Type-A and an RJ45 1000BASE-T management port. The rear carries two 1500
  W hot-swap AC supplies at the ends and seven hot-swap orange fan modules between them (6+1). A COM-E
  x86 control plane, an optional RunBMC and 12.8 Tbps of switching.


  Configuration `ac-b2f`: Two 1500 W AC supplies, back-to-front airflow. No document draws this build,
