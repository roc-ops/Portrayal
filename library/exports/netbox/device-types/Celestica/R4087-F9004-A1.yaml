comments: 'Celestica DS6000 - 3U, 64-port 1.6TbE OSFP224 data centre switch on a Broadcom Tomahawk 6 (102.4
  Tbps) with an Intel Xeon-D COM Express CPU and a RunBMC/OpenBMC service processor. The front is a black
  perforated bezel carrying sixteen columns of OSFP224 cages, each column two stacked pairs numbered top
  to bottom, with a management and timing cluster across the top right: two RJ45 consoles (CON0, CON1),
  two 50GbE SFP56 management ports, an RJ45 GbE MGMT port, an RJ45 ToD port, 1PPS and 10 MHz SMA jacks,
  a USB 3.0 Type-A, a USB-C console, a reset pinhole and four system lamps. The rear carries five fan
  modules (4+1, dual-rotor) across the top and four 3200 W supplies (2+2) across the bottom between two
  legend panels, the left one with the grounding point. No installation guide exists for this model; it
  is drawn from the datasheet and from vendor renders.


  Configuration `ac-f2b`: Four 3200 W AC supplies, front-to-back airflow, COMe 8C / 64 GB DDR4 / 256 GB
  SSD. The build both rear renders show: red fan bars, fan latches, supply bails and supply latches.


