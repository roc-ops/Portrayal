  are on the fan (rear) side. Ships port-side intake or port-side exhaust and with AC or DC supplies,
  four builds of one front panel. The guide also lists two 10GE SFP+ ports; no figure resolves them, so
  they are not drawn (see the gaps). The guide says nothing about end-of-sale; the status is unknown.


  Configuration `ac-port-side-intake`: Two NC5K-PAC-650W-FR supplies and four NCS-5011-FN-FR fan modules:
  AC power, front-to-back airflow (port-side intake).


  Also sold or listed as: NCS-5011


  Rack mounting positions: flush ("front bracket"; as shipped).


