comments: 'Cisco Nexus 9504 - the 7 RU, four-line-card modular chassis of the Nexus 9500 family, running
  NX-OS mode. The FRONT carries four line-card slots LC 1 to LC 4 from top to bottom, two supervisor slots
  SUP 1 and SUP 2 side by side below them, and below those four power-supply slots PS 1 to PS 4 lying
  flat in two rows of two either side of a centre panel with the chassis lamps. The REAR carries three
  fan trays FAN 1 to FAN 3, six fabric-module slots FM 1 to FM 6 behind the fan trays, and two system
  controllers SC 1 and SC 2 below them. Air enters at the front and leaves at the rear. This batch draws
  the chassis and its common equipment; the line cards are added in a later batch, so each line-card slot
  holds its blank.


  Configuration `base`: Chassis with the common equipment seated: both supervisors and system controllers,
  three fan trays, six fabric modules, four 3 kW AC supplies and four line-card blanks.


