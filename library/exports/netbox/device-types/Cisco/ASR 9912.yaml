comments: 'Cisco ASR 9912 Router - 30 RU, and the first chassis in this family with TWO card cages on
  one face. Ten vertical line card slots sit above a second cage of nine positions carrying two route
  processors flanking seven fabric cards, with three power shelves below. The two fan trays are fitted
  from the REAR, which the guide marks on the figure itself. Modelled as a bare cage with every card position
  a real bay.


  Configuration `base`: Chassis only - what you spec before deciding what goes in it. The 10 slot bays
  are EMPTY; fabric, rp are populated. Enough to power on and reach the box, which is the question most
  people ask first and the one `default` used to answer with whatever the drawing happened to be populated
  with.


