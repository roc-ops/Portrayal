comments: 'Cisco ASR 9006 Router - the 10RU, six-slot member of the ASR 9000 Series Aggregation Services
  Routers. Cards mount HORIZONTALLY: slots 0 and 1 at the bottom of the cage are reserved for a redundant
  RSP pair, slots 2 to 5 above them take line cards. Two fan trays sit above the cage behind a hinged
  door, and a single power shelf below it carries the AC or DC power modules, whose inlets are on the
  rear face. Modelled as a BARE CAGE: every slot is a bay that a card component drops into, not a traced
  faceplate.


  Configuration `ac`: ASR 9006 AC Chassis with PEM Version 2 - the chassis ordered with a version 3 AC
  power feed. The difference is which modules seat in the power tray; the chassis is the same metal either
  way, which is why this is a configuration and not a separate device.


