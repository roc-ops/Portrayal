comments: '64x 400G QSFP-DD and 2x 10G SFP+ 2RU data-centre switch running NX-OS. The port side carries
  the QSFP-DD cages in sixteen columns of stacked pairs in an upper and a lower group, the stacked SFP+
  pair, the console, an RJ-45 and an SFP management port, the USB port and the BCN, STS and ENV lamps.
  The other side carries four fan modules and two power supplies stacked at the right. Ports number 1-64
  in pairs down each column, odd on the upper cage. Ships port-side intake only (burgundy modules).


  Configuration `ac-3200w-port-side-intake`: Dual NXA-PAC-3200W-PI AC/HVDC supplies and four NXA-SFAN-160CFM2-PI
  fan modules: port-side intake airflow, burgundy latches


  Also sold or listed as: Nexus 9364D-GX2A


  Rail kits: cisco/nxk-acc-kit2-2ru@1 (sold separately).


