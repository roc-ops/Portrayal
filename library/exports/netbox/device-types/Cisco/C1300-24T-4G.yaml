comments: 'Fixed 1RU Catalyst 1300 switch with 24 10/100/1000 ports and four 1 Gigabit SFP uplink cages,
  no PoE. The AC supply is built in and the switch has no fan. The front carries the 24 jacks in two blocks
  of six columns by two rows with a row of arrow lamps under them numbered 1 to 12 and 13 to 24, the four
  SFP cages numbered 25 to 28, and at the left a RESET button, a USB Type-C port, a stacked USB Type-A
  over RJ-45 pair and a blue console strip. The rear carries the C14 AC inlet with its printed rating,
  a security-lock slot and four screws. The 19-inch brackets ship in the box.


  Configuration `base`: C1300-24T-4G - 24 10/100/1000 ports and four 1 Gigabit SFP uplink cages, a built-in
  AC supply and no fan. The box holds the 19-inch brackets, the power cord (unless the NO-POWER-CORD option
  is ordered) and a pointer card.


  Rack mounting positions: flush (as shipped).


