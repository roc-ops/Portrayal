comments: '48x 10/100/1000 RJ-45 and 4x 1/10G SFP+ 1RU top-of-rack switch running Cisco IOS, the front-to-back
  build of the Catalyst 4948E. All fifty-two ports, the console and management jacks, the status lamps
  and the recessed reset switch are on the front; two 300 W supplies and one four-fan tray between them
  are on the rear. Ports number 1-52 and run DOWN each column - odd on the top row, even beneath it. Its
  back-to-front sibling, the WS-C4948E-F, takes different supplies and a different fan tray and is not
  this device. End-of-sale was announced in October 2016.


  Configuration `ac`: Two PWR-C49E-300AC-R supplies and the WS-X4993 fan tray - the switch as it runs,
  with every port empty


  Also sold or listed as: Catalyst 4948E


