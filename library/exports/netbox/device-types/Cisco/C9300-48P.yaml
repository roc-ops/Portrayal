comments: '48x 10/100/1000 PoE+ RJ-45 1RU stackable access switch running Cisco IOS XE, the C9300-48P
  of the Catalyst 9300 family. The 48 ports, the mode button, the status lamps, the USB mini-Type B console
  port, the USB Type A storage port and the beacon button are on the front, with a bay for an uplink network
  module at the right, shipped with a blank in it. The rear holds three fan modules, two StackWise-480
  stacking ports, two StackPower connectors, two power supply bays, the RJ-45 console and management ports,
  a USB 3.0 SSD slot and the ground connectors. The default supply is the 715 W AC Platinum PWR-C1-715WAC-P
  in one bay with the power supply slot cover in the other. The -A and -E suffixes of the part number
  are software licences and not hardware, so there is one device.


  Configuration `c9300-48p`: The switch as shipped: one PWR-C1-715WAC-P in the first power supply slot
  with the slot cover in the second, three FAN-T2 fan modules and the network module bay blank. Table
  18 gives the 715 W Platinum supply as the default of the C9300-48P and the Power Supply Modules text
  says every switch ships with a blank in the second slot.


  Also sold or listed as: Catalyst 9300-48P


  Rack mounting positions: flush ("front-mounting"; as shipped), mid ("mid-mounting"), rear ("rear-mounting").


  Facts carried in the model that this schema has no field for:

  - environmental.altitude: operating up to 3000 m (10,000 ft); storage up to 4500 m (15,000 ft)

  - environmental.humidity: 5 to 90 percent, noncondensing

  - environmental.operating-temp: -5 to 45 C (23 to 113 F), Table 37

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F), Table 37

  - features.poe: 10/100/1000 PoE+ on all 48 ports

  - features.stacking: StackWise-480 data stacking, up to nine switches, and StackPower, up to four switches

  - features.uplink-modules: one network module slot; C9300-NM-2Q, -4G, -4M, -2Y, -8X and the 3850 uplink
  modules (Table 5); a blank when none is fitted

  - lifecycle.eol: none-announced

  - management.console: USB mini-Type B on the front and RJ-45 on the rear; the USB console takes precedence

  - management.oob: RJ-45 10/100/1000 management port on the rear

  - management.usb: USB Type A storage port on the front; USB 3.0 SSD slot on the rear

  - physical.weight-note: 16.73 lb (7.59 kg) with the fan modules and the default power supplies installed
  (Table 43); the community NetBox file gives 7.59 kg too

  - power.poe-budget-note: 437 W with the default PWR-C1-715WAC-P (Table 18); the guide lists 445 W for
  the C9300-24P

  - power.poe-budget-w: 437

  - power.power-supply-options: PWR-C1-350WAC, PWR-C1-350WAC-P, PWR-C1-715WAC, PWR-C1-715WAC-P, PWR-C1-1100WAC,
  PWR-C1-1100WAC-P, PWR-C1-1900WAC-P, PWR-C1-1900WHV-T, PWR-C1-715WDC (Tables 18 and 35)


