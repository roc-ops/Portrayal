comments: '48x 100M/1G/2.5G/5G/10GBASE-T (PoE) and 6x 40/100G QSFP28 1RU data-centre leaf switch running
  NX-OS. The port side carries all fifty-four ports and the BCN, STS, ENV and P lamps. The other side
  carries four fan modules, the console, an RJ-45 and an SFP management port, the USB port and two power
  supplies. Ports number 1-54 and run DOWN each column, odd on the top row. Ships port-side intake (burgundy
  modules) or port-side exhaust (blue). The N9K-C93108TC-FX3H is listed as configurations.


  Configuration `fx3h-ac-1100w-port-side-intake`: N9K-C93108TC-FX3H with dual NXA-PAC-1100W-PI supplies
  and four NXA-FAN-35CFM-PI fan modules: port-side intake airflow


  Also sold or listed as: Nexus 93108TC-FX3P, Nexus 93108TC-FX3H


  Rack mounting positions: recessed ("port end to the front, set back for interface cables"), recessed
  ("module end to the front, set back for module handles").


  Rail kits: cisco/nxk-acc-kit-1ru@1 (sold separately).


