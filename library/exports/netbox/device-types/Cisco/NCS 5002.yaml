comments: 'Cisco Network Convergence System 5002, a two-rack-unit router with eighty 1/10G SFP+ ports
  and four 100G QSFP28 ports, built as two stacked boards. The ports, the console, the management jack
  and the USB port are on the port (front) side; two power supplies and two fan modules are on the other.
  Ships port-side intake or port-side exhaust and with AC or DC supplies, four builds of one front panel.
  The guide says nothing about end-of-sale; the status is unknown.


  Configuration `ac-port-side-intake`: Two NC5K-PAC-650W-FR supplies and two NCS-5002-FN-FR fan modules:
  AC power, front-to-back airflow (port-side intake).


  Also sold or listed as: NCS-5002


  Rack mounting positions: flush ("front bracket"; as shipped).


  Facts carried in the model that this schema has no field for:

  - environmental.altitude: 0 to 10,000 ft (0 to 3000 m)

  - environmental.humidity: 5 to 95% (non condensing)

  - environmental.operating-temp: 32 to 104 F (0 to 40 C)

  - environmental.storage-temp: -40 to 158 F (-40 to 70 C)

  - features.optics-sfp-plus: guide Chapter 1: eighty one-GE/ten-GE SFP+ ports, 40 regular on the baseboard
  and 40 DWDM and ZR capable on the mezzanine (metallic grey); four 100G QSFP28 ports (light green)

  - features.redundancy: two 1+1 power supplies and two 1+1 fan modules, all hot-swappable; the system
  works with a single fan failure and more than one fan failure shuts it down

  - physical.weight-note: 46 lb (20.9 kg) with two 650 W power supplies and two fan modules

  - power.power-supply-options: NC5K-PAC-650W-FR/-BK (AC), NC5K-PDC-930W-FR/-BK (DC), two, 1+1 redundant


