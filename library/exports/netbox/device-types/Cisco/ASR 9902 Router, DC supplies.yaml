comments: 'Cisco ASR 9000 Series ASR 9902 Router - a 2 RU fixed-port aggregation services router delivering
  up to 800 Gbps. Two route processors across the top and the integrated fixed board below them, carrying
  forty-eight ports in two mirrored slices: eight SFP28, three QSFP28 and one QSFP-DD and twelve SFP+
  on each. The rear carries two 1.6 kW power modules at the ends and three fan trays between them, with
  the power switch on the left panel and the NEBS grounding lug on the right. Airflow is front to back.
  Nothing seats in the front: the board is part of the chassis and there is no Port Expansion Card bay,
  which is what separates this from its 3 RU ASR 9903 sibling.


  Configuration `dc`: The DC build: two PWR-1.6KW-DC modules at -48 VDC, 1+1. Mixing AC and DC modules
  in one chassis is not supported, which is why this is a configuration of the whole chassis rather than
  a choice per bay. The chassis PID is ASR-9902 either way; the supplies are separate line items.


  Facts carried in the model that this schema has no field for:

  - compliance.emc: FCC Class A, ICES 003 Class A, AS/NZS 3548 Class A, CISPR 22 (EN55022) Class A, VCCI
  Class A, BSMI Class A, IEC/EN 61000-3-2, IEC/EN 61000-3-3

  - compliance.etsi: EN300 386, ETSI 300 019 Storage 1.1, Transportation 2.3, Stationary 3.1, EN55022,
  EN55024, EN50082-1/EN-61000-6-1

  - compliance.railway: EN50121-4

  - environmental.operating-altitude: 0 to 4000 m

  - environmental.operating-humidity: 10 to 85 percent

  - environmental.operating-temp: 5 to 40 C (41 to 104 F)

  - environmental.storage-humidity: 5 to 95 percent

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F)

  - features.ethernet: 10-Gbps IEEE 802.3ae, 25-Gbps IEEE 802.3by and 802.3cc, 40/100-Gbps IEEE 802.3ba,
  100GE PHY monitoring, IEEE 802.x flow control, full duplex, per-port byte and packet counters

  - features.macsec: all forty-eight ports

  - features.timing: 2 x BITS RJ-45, ToD RJ-45, 10 MHz and 1 PPS SMB per RP, IEEE 1588 PTP telecom profiles
  and SyncE

  - lifecycle.eol: none-announced

  - management.auxiliary: RJ-45 serial on each RP

  - management.console: RJ-45 serial on each RP

  - management.mgmt-ethernet: 2 x RJ-45 per RP

  - management.usb: 1 x USB class A per RP

  - performance.capacity: 800 Gbps nonblocking full-duplex

  - performance.fixed-board-part: ASR-9902-LC

  - performance.integrated-interfaces: 2 x QSFP-DD, 6 x QSFP28, 16 x SFP28, 24 x SFP+

  - performance.port-modes-qsfp-dd: 10, 40 and 100 Gigabit Ethernet on the cage - data sheet Table 2,
  "2 QSFP-DD ports capable of 10Gb, 40Gb, and 100Gb Ethernet" - plus 1x100G transponder mode with a 400G
  digital coherent module, per Table 19 of the configuration guide, which lists ASR-9902 ports 11 and
  37 and marks the 400G and muxponder modes No

  - performance.port-modes-qsfp28: 10, 40 and 100 Gigabit Ethernet - data sheet Table 2, "6 QSFP28 ports
  capable of 10Gb, 40Gb, and 100Gb Ethernet". The 40G port mode needs IOS XR 7.8.x or higher

  - performance.port-modes-sfp-plus: 10GbE LAN and WAN (OTN) - data sheet Table 2, "24 SFP+ ports capable
  of 10Gb Ethernet (LAN) and WAN (OTN)". Configuration guide Table 41 adds 1GbE and 5x1GE_5x10GE slice
  modes from IOS XR 7.9.1

  - performance.port-modes-sfp28: 25GbE and 10GbE dual-rate - data sheet Table 2, "16 SFP28 dual-rate
  ports capable of 25Gb and 10Gb Ethernet". Cisco publishes no per-optic list for this chassis and points
  at the Cisco Optics Compatibility Matrix, so this is the rate list and not an optics list

  - performance.port-rates: 1, 10, 25, 40 and 100 Gigabit Ethernet

  - performance.slices: 2 (slice 0 colour-coded blue, slice 1 purple); port mode is set per slice

  - physical.rack-face-width-mm: 482.6

  - physical.rack-mounting: 2-post and 4-post, 19-in. and 23-in.

  - platform.route-processor: A99-RP-F, two, redundant

  - platform.rp-memory: SDRAM DDR4 32 GB

  - platform.software: Cisco IOS XR 64-bit

  - platform.switch-fabric: one integrated

  - power.fixed-board-allocation-w: 614 W allocated to 0/0 ASR-9902-LC in the install guide''s show environment
  example; not a chassis total

  - power.power-input-ac: 200-240 VAC high line, 90-130 VAC low line, 50-60 Hz

  - power.power-input-dc: -48 VDC nominal, -40.5 to -72 VDC, 40 A max per module

  - power.power-redundancy: 1+1

  - power.power-supply-pids: PWR-1.6KW-AC, PWR-1.6KW-DC

  - thermal.air-filter: ASR-9902-FILTER, one serviceable filter on the front

  - thermal.airflow: front to back


