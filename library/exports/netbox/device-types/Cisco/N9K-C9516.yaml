comments: 'Cisco Nexus 9516 - the 21 RU, sixteen-line-card modular chassis of the Nexus 9500 family, running
  NX-OS mode. The FRONT carries the chassis lamps across the top, sixteen line-card slots LC 1 to LC 16
  from top to bottom, two supervisor slots SUP 1 and SUP 2 side by side below them, and ten power-supply
  slots PS 1 to PS 10 standing on end along the bottom. The REAR carries three fan trays FAN 1 to FAN
  3, six fabric-module slots FM 1 to FM 6 behind the fan trays, and two system controllers SC 1 and SC
  2 below them. Air enters at the front and leaves at the rear. This batch draws the chassis and its common
  equipment; the line cards are added in a later batch, so each line-card slot holds its blank.


  Configuration `base`: Chassis with the common equipment seated: both supervisors and system controllers,
  three fan trays, six fabric modules, five 3 kW AC supplies with a blank over each of the other five
  slots, and sixteen line-card blanks.


  Also sold or listed as: Nexus 9516


  Rack mounting positions: flush ("vertical mounting brackets at the front of the chassis"; as shipped).


