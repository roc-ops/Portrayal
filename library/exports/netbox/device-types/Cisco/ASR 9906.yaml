comments: 'Cisco ASR 9906 Router - the 14 RU, six-slot member of the ASR 9900 generation. Cards mount
  VERTICALLY and the redundant RSP pair takes the OUTER slots, 0 and 5, with four line cards between them.
  The layout is unusual for the family: a vertical power shelf runs down the LEFT of the card cage and
  two fan trays sit behind a door on the RIGHT, with a full-width air intake along the bottom. Modelled
  as a BARE CAGE; the card openings are cutouts rather than bays - see gaps.


  Configuration `base`: Chassis only - what you spec before deciding what goes in it. The 6 slot bays
  are EMPTY; nothing else is fitted. Enough to power on and reach the box, which is the question most
  people ask first and the one `default` used to answer with whatever the drawing happened to be populated
  with.


