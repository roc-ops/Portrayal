comments: 'Cisco ASR 9000 Series ASR 9903 Router - a 3 RU fixed-port aggregation services router delivering
  up to 3.6 Tbps. Everything a user touches is on the front: two route processors across the top, the
  integrated fixed board in the middle with sixteen 100GE QSFP28 ports and twenty 10GE SFP+ ports, and
  one bay below it for an optional Port Expansion Card. The rear carries four 1.6 kW power modules in
  a row and four fan trays below them, with the NEBS grounding lug on a fixed panel between the middle
  pair. Airflow is front to back.


  Configuration `dc`: The DC build: four PWR-1.6KW-DC modules at -48 VDC, 2+2. The chassis PID is ASR-9903
  either way; the supplies are separate line items. Mixing AC and DC modules in one chassis is not supported,
  which is why this is a configuration of the whole chassis rather than a choice per bay.


  Facts carried in the model that this schema has no field for:

  - compliance.emc: FCC Class A, ICES 003 Class A, AS/NZS 3548 Class A, CISPR 22 (EN55022) Class A, VCCI
  Class A, BSMI Class A

  - compliance.etsi: EN300 386, ETSI 300 019 Storage 1.1, Transportation 2.3, Stationary 3.1

  - compliance.immunity: IEC/EN-61000-4-2 ESD (8 kV contact, 15 kV air), -4-3 radiated (10 V/m), -4-4
  EFT (2 kV power, 1 kV signal), -4-5 surge (AC 4 kV CM / 2 kV DM, signal 1 kV, DC 1 kV), -4-6 conducted
  (10 Vrms), -4-8 power-frequency magnetic field (30 A/m), -4-11 dips and interruptions

  - compliance.nebs: designed to meet SR-3580 NEBS Criteria Level 3, GR-1089-CORE and GR-63-CORE

  - compliance.railway: EN50121-4

  - compliance.safety: UL/CSA/IEC/EN 60950-1, IEC/EN 60825 laser safety, ACA TS001, AS/NZS 60950

  - environmental.operating-altitude: -60 to 1800 m

  - environmental.operating-humidity: 10 to 85 percent

  - environmental.operating-temp: 5 to 40 C (41 to 104 F)

  - environmental.storage-humidity: 5 to 95 percent

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F)

  - features.ethernet: 10-Gbps IEEE 802.3ae, 40/100-Gbps IEEE 802.3ba, 100GE PHY monitoring, IEEE 802.x
  flow control, full duplex, per-port byte and packet counters

  - features.timing: 2 x BITS RJ-45, ToD RJ-45, 10 MHz and 1 PPS SMB per RP, IEEE 1588 PTP telecom profiles
  G.8265.1/G.8275.1/G.8275.2 and SyncE

  - lifecycle.eol: none-announced

  - management.auxiliary: RJ-45 serial on each RP

  - management.console: RJ-45 serial on each RP

  - management.mgmt-ethernet: 2 x RJ-45 per RP

  - management.usb: 1 x USB class A per RP

  - performance.capacity: 3.6 Tbps nonblocking full-duplex

  - performance.fixed-board-capacity: 1.6 Tbps

  - performance.fixed-board-combinations: 16x100GE; 15x100GE + 10x10GE; 14x100GE + 20x10GE

  - performance.integrated-interfaces: 16 x 100GE QSFP28, 20 x 10GE SFP+

  - performance.port-expansion-cards: A9903-20HG-PEC (2T), A9903-8HG-PEC (800G)

  - performance.port-modes-qsfp28: 10, 40 and 100 Gigabit Ethernet - data sheet Table 2, "16 QSFP28 ports
  capable of 10Gb, 40Gb, and 100Gb Ethernet". Cisco publishes no per-optic list for this chassis and points
  at the Cisco Optics Compatibility Matrix instead, so this is the rate list and not an optics list

  - performance.port-modes-sfp-plus: 10 Gigabit Ethernet - data sheet Table 2, "20 SFP+ ports capable
  of 10Gb Ethernet", with no dual-rate note beside it. The chassis-wide sentence "10, 25, 40, 100, and
  400 Gigabit Ethernet interface types across the ASR 9903 chassis" covers the Port Expansion Cards as
  well and is not a claim about these twenty cages

  - performance.port-rates: 10, 25, 40, 100, 200 and 400 Gigabit Ethernet

  - physical.depth-over-ejectors-mm: 762

  - physical.rack-aperture-min-mm: 450.85

  - physical.rack-face-width-mm: 482.6

  - physical.rack-mounting: 19-in. four-post

  - platform.route-processor: A99-RP-F, two, redundant

  - platform.rp-memory: SDRAM DDR4 32 GB

  - platform.software: Cisco IOS XR 64-bit, from Release 7.1.25

  - platform.switch-fabric: two integrated

  - power.power-input-ac: 200-240 VAC high line, 90-130 VAC low line, 50-60 Hz

  - power.power-input-dc: -48 VDC nominal, -40.5 to -72 VDC, 40 A max per module

  - power.power-redundancy-ac: 2+2 at high line, 3+1 at low line

  - power.power-redundancy-dc: 2+2

  - power.power-supply-pids: PWR-1.6KW-AC, PWR-1.6KW-DC

  - thermal.air-filter: ASR-9903-FILTER, one serviceable filter on the front

