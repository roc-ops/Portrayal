comments: 'Cisco ASR 9922 Router - 44 RU and the largest of the family. TWENTY vertical line card slots
  in two cages, one above and one below a central cage of two route processors flanking seven fabric cards,
  with four fan trays between the cages and four power shelves across the top. The line cards in the LOWER
  cage, slots 10 to 19, are installed UPSIDE DOWN. Modelled as a bare cage.


  Configuration `base`: Chassis only - what you spec before deciding what goes in it. The 20 slot bays
  are EMPTY; fabric, power-modules, rp are populated. Enough to power on and reach the box, which is the
  question most people ask first and the one `default` used to answer with whatever the drawing happened
  to be populated with.


  Facts carried in the model that this schema has no field for:

  - compliance.nebs: SR-3580: NEBS Criteria Levels (Level 3)

  - compliance.nebs-emc-safety: GR-1089-CORE: NEBS EMC and Safety

  - compliance.nebs-physical: GR-63-CORE: NEBS Physical Protection

  - environmental.acoustic-noise: 78 dB at 80.6degF (27degC) maximum

  - environmental.altitude-operating: 0 to 13,000 ft (0 to 4,000 m)

  - environmental.humidity-operating: 10 to 85 percent noncondensing

  - environmental.operating-temp: 41 to 104degF (5 to 40degC)

  - environmental.operating-temp-short-term: 23 to 122degF (-5 to 50degC)

  - environmental.storage-temp: -40 to 158degF (-40 to 70degC)

  - lifecycle.eol: none-announced

  - physical.depth-with-cable-management-mm: 762.0

  - physical.depth-with-front-doors-mm: 777.7

  - physical.weight-configured-kg: 470.28

  - physical.weight-configured-scope: fully configured using all card slots and four power modules

  - platform.interface-path-id: rack/slot/module/port

  - platform.operating-system: Cisco IOS XR

  - power.power-ac-input-per-module-v2: 3290 VA (3000 W output module)

  - power.power-ac-input-per-module-v3: 6510 VA (6000 W output module)

  - power.power-ac-input-voltage: 200-240 VAC nominal (range 180 to 264 VAC); 220-240 VAC (UK)

  - power.power-ac-redundancy: AC power modules operate in N+N redundancy mode

  - power.power-modules-v2: Version 2 power system - up to sixteen AC power modules per system, four per
  tray

  - power.power-modules-v3: Version 3 power system - up to twelve AC power modules per system, three per
  tray

  - thermal.air-filter-location: three filters (left, center, right) on the front of the middle card cage

  - thermal.cooling-path: front-to-rear; inlet at the front of the middle cage, exhaust at the upper AND
  lower rear

  - thermal.fan-trays: four - FT0 and FT1 above the RP/FC cage, FT2 and FT3 below it


