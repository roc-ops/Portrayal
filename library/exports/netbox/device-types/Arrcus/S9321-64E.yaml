comments: "Arrcus lists UfiSpace S9321-64E (NOS: arcos).\nListed per: Arrcus Hardware Compatibility List\
  \ (External), June 2026, for ArcOS 8.5 - page 2, under Switching (XGS), the row 'S9321-64E'.\n\nUfiSpace\
  \ S9321-64E - 2RU 64-port 200/400/800G QSFP-DD AI/ML data-centre switch with 2x 10/25G SFP28 management\
  \ uplinks; Broadcom Tomahawk5 BCM78900 at 51.2 Tbps, Intel Ice Lake-D 4-core with an AST2620 BMC, 1+1\
  \ hot-swap 3000W AC or DC PSUs, 3+1 hot-swap fans, front-to-back airflow\n\nConfiguration `ac`: Dual\
  \ 3000W AC PSUs (PSU-302-AESR) 1+1, four FAN-808012-HCE fan modules 3+1, front-to-back airflow - the\
  \ build both vendor rear renders and HIG Figure 4 show\n\nDatasheet: UfiSpace S9321-64E Datasheet\n\
  \  https://www.ufispace.com/products/cloud-data-center\n\nFacts carried in the model that this schema\
  \ has no field for:\n- compliance.emc: FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class\
  \ A; EN 300 386; EN 55035; VCCI CISPR 32 Class A\n- compliance.environment: WEEE\n- compliance.nebs:\
  \ NEBS statements only (Common Bonding Network suitability, GR-1089 intra-building port restriction,\
  \ external SPD required on AC) - the HIG prints the compliance statements without claiming a NEBS level,\
  \ and none is claimed here\n- compliance.safety: UL 62368-1, IEC 62368-1\n- environmental.operating-humidity:\
  \ 5% to 95% RH non-condensing\n- environmental.operating-temp: 0 to 40 C\n- environmental.storage-humidity:\
  \ 5% to 95% RH non-condensing\n- environmental.storage-temp: -40 to 70 C\n- features.optics-qsfp-dd:\
  \ 800GE QSFP-DD OpenZR+/ZR/2xLR4/2xFR4/DR8+/DR8/SR8; 400GE QSFP-DD OpenZR+/ZR/ER4/LR4/FR4/SR8/DR4/DR4+/PLR4;\
  \ 200GE QSFP56 SR4/FR4; 100GE QSFP28 ZR4/ER4/SR4/LR4 (datasheet Compatible Transceivers). Per-port optical\
  \ power is budgeted 16 W on ports 0-31 and 23 W on ports 32-63 (HIG Figure 9 note)\n- features.optics-sfp28:\
  \ 1G/10G/25G SFP28 up to 40 km (HIG Port Overview table, ports 64-65; the datasheet's Compatible Transceivers\
  \ list covers only the QSFP-DD field)\n- features.timing: Stratum 3E OCXO; SyncE; IEEE 1588v2 (default,\
  \ G.8265.1, G.8275.1, G.8275.2); T-TC, T-BC/OC, T-GM\n- lifecycle.eol: none-announced\n- management.console:\
  \ RJ45 RS-232 and micro-USB, both labelled IOIO, 115200 8N1 (micro-USB needs the Silicon Labs CP210x\
  \ driver)\n- management.oob: 1x 100M/1G RJ45 OOB management port\n- management.timing-inputs: 1x 1PPS\
  \ in/out SMB and 1x 10MHz in/out SMB, both Premium-build only\n- management.usb: 1 x USB 3.0 Type-A\
  \ maintenance port\n- performance.packet-buffer: 165.2 MB\n- performance.switching-capacity: 51.2 Tbps\n\
  - platform.asic: Broadcom Tomahawk5 BCM78900\n- platform.bmc: ASPEED AST2620\n- platform.cpu: Intel\
  \ Ice Lake-D 4-core @ 1.9GHz\n- platform.memory: 32 GB DDR4\n- platform.storage: 128 GB M.2 SSD\n- power.input-ac:\
  \ 200 to 240V, 16A max x2\n- power.input-dc: -40 to -72V, 80A max x2\n- power.power-envelope: fully-configured\n\
  - power.power-max-dc-w: 2496\n- power.power-max-w: 2589\n- power.power-typical-w: 913\n\nDrawing version\
  \ 2.0.4. A major bump means a slot moved or an id was renamed, so anything cached from an earlier export\
  \ may no longer line up.\nModel maturity: modelled. Every dimension in the source records where it came\
  \ from."
