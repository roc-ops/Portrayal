  Edgecore AGR400 (AS7946-30XB) 100GbE aggregation router. 2RU, 30 fixed ports - 4 x 400G QSFP-DD, 18
  x 100G QSFP28, 4 x 100G QSFP-DD and 4 x 1/10/25G SFP28 - with a timing block, 1+1 redundant PSUs and
  4+1 redundant fans.


  Configuration `dc-psu`: Modular dual DC PSUs, front-to-back airflow. This is the unit we photographed.


  Also sold or listed as: AGR400


  Facts carried in the model that this schema has no field for:

  - environmental.humidity: operating 5-85 percent, storage 5-95 percent, non-condensing

  - environmental.operating-temp: 0 C to 45 C

  - environmental.storage-temp: -40 C to 70 C

