  - platform.cpu: Intel Xeon D-1548 8-core

  - platform.memory: DDR4 SO-DIMM 32 GB (2 x 16 GB)

  - platform.software: ONIE preinstalled; ONL and commercial NOS supported

  - platform.storage: M.2 SSD 128 GB

  - power.input-ac: 100-120 V 12 A or 200-240 V 7.5 A, 50-60 Hz per PSU

  - power.input-dc: -40 to -75 VDC, 40 A max per PSU

