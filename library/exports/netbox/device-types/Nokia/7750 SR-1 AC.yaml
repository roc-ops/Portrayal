comments: 'The 2RU, FP4-based Nokia 7750 SR-1 service router, AC chassis (3HE12299AA/BA/CA - the CR, ER
  and HE licences of one chassis, 1.5 Tb/s from revision RB). The control and switching (CCM, and the
  integrated CPM with an IOM5-e) are internal and fixed. The front carries the control and management
  row, the L-shaped honeycomb air intake and, at the bottom, two horizontal slots for MDA-e-XP or MDA2-e-XP
  cards. The rear carries two stacked slots for the SR-1 AC PSU (PSU 1 above PSU 2) beside a two-stud
  safety ground, and four fan trays, FAN 1 to FAN 4 from left to right as seen from behind. The sibling
  nokia/sr-1-dc differs only at the rear, where a fixed -48 VDC terminal block takes the PSU area.


  Configuration `dual-psu`: Two AC PSUs and four fan trays, as SR1 Figure 5 draws the AC rear - 1+1 redundant.


