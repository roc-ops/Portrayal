comments: 'The 2RU, FP4-based Nokia 7750 SR-1 service router, DC chassis (3HE12298AA/BA/CA - the CR, ER
  and HE licences of one chassis, 1.5 Tb/s from revision RD). The control and switching (CCM, and the
  integrated CPM with an IOM5-e and, on this variant, a power supply card) are internal and fixed. The
  front is the AC chassis''s, line for line: the control and management row, the L-shaped honeycomb air
  intake and two horizontal MDA-e-XP / MDA2-e-XP slots. The rear carries the factory-installed dual-feed
  -48 VDC terminal block with its On/Standby switch where the AC chassis has its PSU slots, a two-stud
  safety ground, and four fan trays, FAN 1 to FAN 4 from left to right as seen from behind.


