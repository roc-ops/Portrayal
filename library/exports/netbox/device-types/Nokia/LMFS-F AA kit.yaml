comments: 'The Nokia Lightspan MF-8 (LMFS-F), an 8RU fibre access node (OLT) shelf of the Lightspan MF
  family, drawn as it mounts horizontally in a 19-inch rack. Eight line-termination (LT) boards and two
  network-termination (NT) boards lie horizontally in the slot area, LT 8 at the top down to LT 1, then
  NT B, NT A, the alarm module and, at the bottom, two half-width power modules side by side. The fan
  module stands in an unlabelled slot at the left and exhausts the air drawn across the boards from the
  open right side. The front face is drawn with its two mounting flanges, because the left flange carries
  the dual-stud grounding point, the hook for the front cover and the ESD point. The shelf is cabled entirely
  from the front.


  Configuration `base`: The Lightspan MF-8 shelf kit as shipped: the fan module, the alarm module and
  two power modules fitted, and a dummy/filler board in each of the eight LT and two NT slots. This is
  the AA kit, with two 80 A power modules; the AB kit is the `kit-ab` configuration.


  Also sold or listed as: LMFS-F


