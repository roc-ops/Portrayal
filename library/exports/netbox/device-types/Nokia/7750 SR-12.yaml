comments: 'The 14RU Nokia 7750 SR-12 service router (and the 7450 ESS-12, the same chassis booted as a
  switch), a DC-only midplane chassis with twelve VERTICAL module slots across the front, printed 1 2
  3 4 5 A B 6 7 8 9 10: ten IOM/IMM slots with the two SF/CPM slots A and B in the middle. Cable-management
  trays with covers run above and below the card cage, each under a strip printing the slot numbers, and
  the filtered air-intake vent faceplate closes the bottom of the front. Rear: a grounding plate across
  the top carrying two studs, three vertical Enhanced Fan Trays and two horizontal DC PEM-3s at the bottom.
  Every card is authored horizontal and seated here at rotate 90 (clockwise), which puts MDA slot 1 at
  the top as the guide says.


  Configuration `base`: The chassis as it ships and powers on (SR-12 guide p90 note 8: shipped with the
  Enhanced Fan Trays, the air filter tray, impedance panels and the DC PEM-3s installed): both PEM-3s,
  three fan trays, the filter, an SF/CPM4-12 in A and B, and every IOM/IMM slot closed by a slot impedance
  panel.


  Also sold or listed as: 7450 ESS-12


