comments: 'The 14RU ANSI shelf of the Nokia 7360 ISAM FX (Lightspan Access Node FX) GPON/NGPON access
  node, part 3FE65209BA. Its line-termination (LT), network-termination (NT) and NT I/O cards stand VERTICALLY
  in one cage, left to right LT1 to LT8, NT A, NTIO, NT B, LT9 to LT16. Below the cage are three bands:
  the fixed PDBP-C power distribution front (two 70 A dual-pole breakers, the Energy Hazard label, the
  shelf name, the critical/major/minor and BAT A/BAT B/ACO lamps and the ACO push button, beside an ESD
  earth bonding point); the BFAN-H fan tray; and the connector band (remote craft port at the bottom left,
  the four -48 V dual-post terminals TB1-1 to TB1-4 on their angled shrouds, the BITS wire-wrap pins,
  the ToD/1 Hz RJ-45 and the 50-pin CO alarms connector). The PDBP-C is built into the ANSI shelf and
  has no part number of its own, so it is drawn as the shelf''s own panel, not as a bay. The LT slots
  take only the LT blank until the line cards are modelled (roc-ops/Portrayal#538).


  Configuration `fant-h-simplex`: One FANT-H BB in NT A, the NT dummy in NT B and dummies in NTIO and
  every LT slot - the shelf as it is ordered before line cards are chosen.


