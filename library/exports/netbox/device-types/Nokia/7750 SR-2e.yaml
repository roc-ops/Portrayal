comments: 'The 10RU Nokia 7750 SR-2e service router (800 Gb/s half-duplex, 2 forwarding complexes), one
  of the three 7750 SR-e chassis that share a midplane design, cards and power supplies. Front: a horizontal
  card cage at the left under the PSU-shelf air intake - two CCM-e slots (A, B) then 8 MDA-e slots numbered
  1/1 to 2/4 - with the integrated cable-management tray beside it and the hinged grill over the air filter
  at the right. Rear: the PSU shelf across the top (8 slots), the CPM-e slots A and B and 2 IOM-e slots
  at the left, and the chassis-specific fan tray standing in the vertical slot at the right. Every card
  lies horizontally, as the guide draws it, so no card bay rotates; the six vertical PSU slots seat the
  horizontally authored supplies at rotate 90.


  Configuration `base`: The chassis as the SR-e guide draws it - both control pairs, every IOM-e, a ME10-10GB-SFP+
  in every MDA-e slot, six -48/-60 VDC supplies and two PSU impedance panels, and the fan tray.


