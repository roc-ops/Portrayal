comments: 'Perle IOLAN SCG34 R-LA console server, 1U, with 32 RJ45 RS-232 serial ports in 2 of its three
  G16 module bays. It carries the 4G LTE radio for the Americas, with AT&T and Verizon named. It has dual
  AC power and two network pairs of RJ45 and SFP. The front carries the display, the keypad, the power
  button, the ready lamp and the card slot. It also has the RJ45 and micro-USB admin ports, two USB 3.0
  ports and the reset hole. The cellular parts on the front are the Micro-SIM slot and the two antenna
  jacks, WWAN 1 and WWAN 2. The rear carries the network pairs at the left, the module bays and the two
  inlets, each with a rocker switch. Modelled as the dual-AC build, as the page lists the DC build under
  its own names.


  Configuration `ac`: IOLAN SCG34 R-LA, dual AC, with 2 RJ45 RS-232 modules. It has the LA cellular radio:
  Penta Band LTE 700/700/850/AWS/1900 MHz, tri band UMTS and quad band GSM/GPRS/EDGE. The part numbers
  differ by power cord. In the page''s order and labels they are 04032874 USA, 04032878 None.


  Also sold or listed as: IOLAN SCG34 R-LA Console Server


  Rack mounting positions: flush ("front"; as shipped).


