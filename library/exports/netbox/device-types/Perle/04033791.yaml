comments: 'Perle IOLAN SCG50 RUU console server, 1U, with 16 RJ45 RS-232 ports and 32 USB 3.0 ports in
  all three of its bays. It has dual AC power and two network pairs of RJ45 and SFP. The front carries
  the display, the keypad, the power button, the ready lamp and the card slot. It also has the RJ45 and
  micro-USB admin ports, two USB 3.0 ports and the reset hole. The rear carries the network pairs at the
  left, the module bays and the two inlets, each with a rocker switch. Modelled as the dual-AC build with
  no cellular parts, as the R/U product page lists none.


  Configuration `ac`: IOLAN SCG50 RUU, dual AC, with 1 RJ45 RS-232 module in bay 1 and 2 USB modules in
  bays 2 and 3. The six part numbers differ by power cord. In the page''s order and labels they are 04033794
  USA, 04033791 UK, 04033792 EU, 04033795 South Africa, 04033796 Australia, 04033798 none.


  Also sold or listed as: IOLAN SCG50 RUU Console Server


  Rack mounting positions: flush ("front"; as shipped).


