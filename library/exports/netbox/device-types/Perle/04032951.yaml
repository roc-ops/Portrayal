comments: 'Perle IOLAN SCG34 R console server, 1U, with 32 RJ45 RS-232 serial ports in 2 of its three
  G16 module bays. It has dual AC power and two network pairs of RJ45 and SFP. The front carries the display,
  the keypad, the power button, the ready lamp and the card slot. It also has the RJ45 and micro-USB admin
  ports, two USB 3.0 ports and the reset hole. The rear carries the network pairs at the left, the module
  bays and the two inlets, each with a rocker switch. Modelled as the dual-AC build with no cellular parts,
  as the R/U product page lists none.


  Configuration `ac`: IOLAN SCG34 R, dual AC, with 2 RJ45 RS-232 modules. The six part numbers differ
  by power cord. In the page''s order and labels they are 04032954 USA, 04032951 UK, 04032952 EU, 04032955
  South Africa, 04032956 Australia, 04032958 none.


  Also sold or listed as: IOLAN SCG34 R Console Server


  Rack mounting positions: flush ("front"; as shipped).


