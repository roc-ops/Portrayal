comments: "HPE's 1U two-socket Intel Xeon Scalable rack server of the Gen10 generation, in its two front\
  \ builds - four 3.5 inch LFF bays (878972-B21) or eight 2.5 inch SFF bays with a media bay (878973-B21)\
  \ - over one rear: three PCIe 3.0 slots on two risers, two Flex Slot power supply bays, two embedded\
  \ 1GbE ports, the iLO 5 port, VGA, two USB 3.0 ports, and blanks for the media module and the optional\
  \ serial port. Retired by HPE; the QuickSpecs carries HPE's RETIRED notice.\n\nConfiguration `base`:\
  \ The 4 LFF chassis, 878972-B21, with every drive bay and the optical bay blanked, both riser cages\
  \ with their slots blanked, the media module and serial port blanked, one 500 W Flex Slot supply in\
  \ PS 1 and the blank in PS 2. THIS IS THE BUILD THE PHOTOGRAPHS SHOW, NOT WHAT THE PART NUMBER SHIPS\
  \ WITH: the QuickSpecs gives the configure-to-order chassis no riser as standard (a primary riser blank,\
  \ which is not drawn) and makes the supply a choice; one 500 W supply is what the pre-configured models\
  \ carry, and the secondary riser is an option that needs processor 2.\n\nDatasheet: QuickSpecs HPE ProLiant\
  \ DL160 Gen10 Server\n  https://support.hpe.com/hpesc/public/docDisplay?docId=a00021860enw\n\nFacts\
  \ carried in the model that this schema has no field for:\n- environmental.acoustic-lwad: 4.5 B idle,\
  \ 5.1 B operating\n- environmental.altitude-operating-m: 3050\n- environmental.operating-humidity: 8\
  \ to 90% non-condensing, 28 C maximum wet bulb\n- environmental.operating-temp-c: 10 to 35\n- environmental.operating-temp-extended-c:\
  \ 5 to 10 and 35 to 45, approved configurations only\n- environmental.storage-temp-c: -30 to 60\n- lifecycle.eol:\
  \ announced\n- lifecycle.eol-announcement: https://support.hpe.com/hpesc/public/docDisplay?docId=a00021860enw\n\
  - physical.ru: 1\n- physical.weight-max-kg: 15.74\n- physical.weight-min-kg: 10.97\n- platform.bmc:\
  \ HPE iLO 5\n- platform.cpu: up to two Intel Xeon Scalable processors, first or second generation\n\
  - platform.memory: 16 DDR4 DIMM slots, up to 1.0 TB with 64 GB DIMMs\n- platform.network: embedded 2-port\
  \ 1GbE\n- platform.storage-controller: HPE Smart Array S100i embedded (SATA only); Smart Array modular\
  \ and PCIe controllers optional\n- power.power-input: 100-240 VAC per Flex Slot supply (the 865434-B21\
