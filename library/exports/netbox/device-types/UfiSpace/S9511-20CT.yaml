comments: "UfiSpace S9511-20CT disaggregated cell site gateway router - 1RU temperature-hardened white\
  \ box, 20 interfaces in three colour-coded blocks: four 1G RJ45/SFP combo ports in brown, eight 1/10G\
  \ SFP+ in blue and eight 1/10/25G SFP28 in olive, behind a Broadcom Qumran2n at 100 Gbps with a Stratum\
  \ 3E OCXO, an internal GNSS receiver and GNSS, 1PPS, 10MHz, ToD and BITS timing interfaces. Both the\
  \ dual-feed DC supply and the 3+1 fans are FIXED, so the chassis has no bays at all\n\nConfiguration\
  \ `dc`: Dual-feed fixed DC supply, -36 to -72 V on the two three-post screw terminal blocks under INPUT0\
  \ and INPUT1, with four fixed 3+1 fans. THE ONLY BUILD: no AC variant appears in the datasheet, whose\
  \ Power Specs row gives a DC input only, nor in the HIG, whose Connecting Power section has a DC Version\
  \ subsection and no AC one\n\nDatasheet: UfiSpace S9511-20CT Disaggregated Cell Site Gateway Router\
  \ Datasheet\n  https://www.ufispace.com/products/telco/access/s9511-20ct\n\nFacts carried in the model\
  \ that this schema has no field for:\n- compliance.emc: FCC Part 15, Subpart B, Class A; ICES-003, Class\
  \ A; EN 55032, Class A; EN 300 386; EN 301 489; EN 303 413; EN 55035; EN 50663; EN 62479; BSMI\n- compliance.safety:\
  \ UL 62368-1; IEC 60950-1; IEC 62368-1; BSMI\n- environmental.operating-humidity: 5 to 95% RH non-condensing\n\
  - environmental.operating-temp: -40 to 70 C (temperature hardened)\n- environmental.storage-humidity:\
  \ 5 to 93% RH non-condensing\n- environmental.storage-temp: -40 to 70 C\n- features.combo-ports: ports\
  \ 0-3 are 1G RJ45/SFP combo, configurable to either connection type; the faceplate presents both an\
  \ RJ45 and an SFP aperture for each (HIG Port Overview)\n- features.gnss: internal receiver for master\
  \ clock implementations\n- features.optics-sfp: 1G SX/LX/EX/ZX\n- features.optics-sfp-plus: 10G SR/LR/ER/ZR\n\
  - features.optics-sfp28: 25G SR/LR/ER (datasheet compatible transceiver list)\n- features.routing: full\
  \ Segment Routing over IPv6 (SRv6)\n- features.timing: Stratum 3E OCXO with optional holdover; ITU-T\
  \ SyncE; IEEE 1588v2 default, G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2 (extra licence), T-GM, T-BC/OC,\
  \ T-TC; Class C accuracy. NOS integration is required to activate the timing features\n- features.timing-cables:\
  \ 50 ohm SMA coaxial with 1/4-36UNS-2B for GNSS; 50 ohm SMB coaxial with 10-32UNF-2A for 1PPS and 10MHz;\
  \ shielded RJ45 for ToD; shielded RJ48 for BITS\n- features.timing-interfaces: GNSS in on SMA, 10MHz\
  \ in/out on SMB, 1PPS in/out on SMB, ToD in/out on RJ45, BITS in on RJ48 (datasheet Timing Interfaces)\n\
  - lifecycle.eol: none-announced\n- management.console: RJ45 RS-232 (labelled IOIOI)\n- management.oob:\
  \ 1x RJ45 100/1000M out-of-band management\n- performance.packet-buffer: 1 GB deep buffer\n- performance.switching-capacity:\
  \ 100 Gbps\n- platform.asic: Broadcom Qumran2n BCM88295\n- platform.cpu: Intel Denverton-NS 4-core @\
  \ 1.6 GHz\n- platform.memory: 8 GB DDR4\n- platform.storage: 32 GB eMMC\n- power.input-dc: -36 to -72\
  \ V, 8 A per feed\n- power.power-envelope: bare\n- power.power-typical-w: 63\n- power.psu-redundancy:\
  \ dual-feed one power stage, fixed (not field-replaceable)\n- thermal.fan-redundancy: 3+1 fixed (not\
  \ field-replaceable)\n\nDrawing version 1.0.7. A major bump means a slot moved or an id was renamed,\
