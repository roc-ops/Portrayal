  \ 5% to 85% RH non-condensing\n- environmental.operating-temp: 0 to 45 C\n- environmental.storage-humidity:\
  \ 5% to 93% RH non-condensing\n- environmental.storage-temp: -40 to 70 C\n- features.fabric-cabling:\
  \ the 20 fabric ports take 800GE QSFP-DD AEC, DAC, ACC and AOC cable assemblies (datasheet Compatible\
  \ Fabric Cable Types); HIG Port Overview caps their link length at 300 m, which is why they are cabled\
