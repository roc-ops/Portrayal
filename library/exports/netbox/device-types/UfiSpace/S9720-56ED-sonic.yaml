comments: "UfiSpace S9720-56ED - 2RU 800G disaggregated core and edge router with 56 QSFP-DD cages in\
  \ two bands: 36 service ports numbered 00-35, configurable in pairs as 18 x 800G or 36 x 100/200/400G\
  \ with ZR/ZR+ support, and 20 x 800G fabric ports numbered 00-19 that make the box a line-card element\
  \ of a distributed disaggregated chassis scaling to 921.6 Tbps. Two 1/10/25G SFP28 uplinks (36-37) and\
  \ two 10G SFP+ management uplinks sit in one 2 x 2 shell beside the console cluster. Broadcom Jericho\
  \ 3 BCM88860 at 14.4 Tbps with a 16 GB deep buffer, Intel Ice Lake-D 8-core at 2.1 GHz with an AST2620\
  \ BMC, Stratum 3E OCXO with SyncE and 1588v2, 1+1 hot-swap 3000 W AC or DC PSUs, 3+1 hot-swap fans,\
  \ front-to-back airflow.\n\nConfiguration `ac`: Dual 3000W AC PSUs (PSU-302-AESR) 1+1 hot-swap with\
  \ IEC 60320 C20 inlets, four FAN-808012-HCE fan modules 3+1, front-to-back airflow - the build HIG Figure\
  \ 7's rear elevation and the vendor rear render both show. Maximum system power 2035 W with MSA optics\
  \ and 2280 W with Open ZR+\n\nDatasheet: UfiSpace Core Edge Router S9720-56ED Datasheet\n  https://www.ufispace.com/files/43/UfiSpace-Core-Edge-Router-S9720-56ED%20Datasheet.pdf\n\
