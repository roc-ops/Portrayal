comments: "UfiSpace S9600-56DX 100G/400G open disaggregated aggregation router - 2RU white box on Broadcom\
  \ Qumran2c at 4.8 Tbps with an 8 GB deep buffer, 48x QSFP28 40/100G in two blocks of six four-high columns,\
  \ 8x QSFP-DD 100/400G with 400ZR/OpenZR+ in the middle, and 4x SFP28 1/10/25G that share in-band with\
  \ QSFP28 port 0; a full timing block (GNSS on SMA, 10MHz and 1PPS on SMB, ToD on RJ45) with a Stratum\
  \ 3E OCXO, an internal GNSS receiver and Class C 1588v2; four hot-swap fans (3+1) and dual 2000 W PSUs\
  \ (1+1) at the rear, orderable AC or DC, exhaust airflow\n\nConfiguration `ac`: The chassis as HIG Figure\
  \ 7's rear elevation draws it - four FAN-803816-HI exhaust fans and two PSU-202-AESR 2000 W AC supplies\
  \ with portrait C20 inlets and red latches, front-to-back airflow, and the sixty traffic and management\
  \ ports empty. The HIG rates the feed at 200-240 V and notes that on a single 110 VAC source each supply\
  \ delivers 1000 W. No orderable chassis part number appears in any held document; see the chassis-sku\
  \ gap.\n\nDatasheet: UfiSpace S9600-56DX 100G/400G Open Aggregation Router Datasheet\n  https://www.ufispace.com/products/telco/aggregation/s9600-56dx-100g-400g-open-aggregation-router\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15, Subpart\
  \ B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386; EN 55035; EN 301 489; EN 303 413; EN\
  \ 62479; EN 50663\n- compliance.environment: RoHS; WEEE\n- compliance.safety: UL 62368-1; IEC 62368-1\n\
  - environmental.operating-humidity: 5 to 85% RH non-condensing\n- environmental.operating-temp: 0 to\
  \ 45 C\n- environmental.storage-humidity: 5 to 93% RH non-condensing\n- environmental.storage-temp:\
  \ -40 to 70 C\n- features.antenna: an active GNSS antenna is required - 50 ohm impedance match, 5 V\
  \ DC, noise figure 1.5 dB maximum, internal LNA gain 35-42 dB (HIG Installing an Antenna)\n- features.gnss:\
  \ internal GNSS receiver for master-clock implementations; edge Grandmaster with PRTC\n- features.optics-qsfp-dd:\
  \ 400G QSFP-DD SR/LR/ER/ZR/OpenZR+, up to 600 km (datasheet port table)\n- features.optics-qsfp28: 100G\
  \ QSFP28 SR/LR/ER/ZR, up to 80 km; 40G\n- features.optics-sfp28: 25G SFP28 SR/LR/ER up to 40 km; 10G\
  \ SFP+ SR/LR/ER; 1G SFP SX/LX/EX\n- features.sfp28-sharing: the four SFP28 ports are in-band port share\
  \ with 100GE port 0 (datasheet)\n- features.timing: Stratum 3E OCXO, ITU-T SyncE, IEEE 1588v2 (default,\
  \ G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2 with an additional licence), T-GM, T-BC/OC, T-TC, Time\
  \ Sensitive Networking; NOS integration is required to activate any of it\n- features.timing-cable:\
  \ 50 ohm SMA coaxial with a 1/4-36UNS-2B connector for GNSS, 50 ohm SMB coaxial with a 10-32UNF-2A connector\
  \ for 1PPS and 10MHz, shielded RJ45 for ToD (datasheet Compatible Timing Cable Types)\n- features.timing-interfaces:\
  \ GNSS in on SMA, 10MHz in/out on SMB, 1PPS in/out on SMB, ToD in/out on RJ45\n- lifecycle.eol: none-announced\n\
  - management.console: RJ45 RS-232 plus a micro-USB serial console\n- management.oob: 1x RJ45 100/1000M\n\
  - performance.packet-buffer: 8 GB\n- performance.switching-capacity: 4.8 Tbps\n- platform.asic: Broadcom\
  \ Qumran2c BCM88820\n- platform.bmc: Aspeed AST2620\n- platform.cpu: Intel Icelake-D 8-core @ 2.1 GHz\n\
  - platform.memory: 32 GB DDR4\n- platform.storage: 128 GB SSD\n- power.input-ac: 200 to 240 V, 12.5\
  \ A\n- power.input-dc: -40 to -72 V, 60 A\n- power.power-envelope: bare\n- power.power-max-w: 1497\n\
  - power.power-typical-w: 481\n- power.psu-redundancy: 1+1 hot-swappable\n- thermal.airflow: front-to-back\
  \ (exhaust fans and exhaust PSUs)\n- thermal.fan-redundancy: 3+1 hot-swappable\n\nDrawing version 4.0.3.\
  \ A major bump means a slot moved or an id was renamed, so anything cached from an earlier export may\
  \ no longer line up.\nModel maturity: modelled. Every dimension in the source records where it came\
  \ from."
