comments: "UfiSpace S9311-64D 400G data center spine switch - 2RU white box, 64x QSFP-DD 400G in four\
  \ rows of sixteen (two 2-high stacked cage banks) plus 2x SFP+ 1/10G, an RJ45 out-of-band port, RJ45\
  \ and micro-USB consoles, USB 3.0 and a 1PPS/10MHz SMB timing pair, on Broadcom Tomahawk 4 at 25.6 Tbps;\
  \ four hot-swap fans (3+1) and dual 2400W PSUs (1+1) at the rear, orderable in AC or DC and in front-to-back\
  \ or back-to-front airflow\n\nConfiguration `base`: The chassis as it ships and as every rear figure\
  \ draws it - four FAN-805616-HCE fans and two PSU-242-AECRN 2400W AC supplies, red handles and latches\
  \ throughout, front-to-back airflow, and the sixty-six traffic and management ports empty. No orderable\
  \ chassis part number appears in any held document; see the chassis-sku gap.\n\nDatasheet: UfiSpace\
  \ S9311-64D 400GE Data Center Switch Datasheet\n  https://www.ufispace.com/products/datacenter/400g/s9311-64d\n\
