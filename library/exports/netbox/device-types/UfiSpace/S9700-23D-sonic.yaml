  \ cluster of 2x SFP+ 10G, an RJ45 and a micro-USB console, an out-of-band RJ45 and a USB 2.0 Type-A;\
  \ four hot-swap fans (3+1) and dual 2000 W PSUs (1+1) at the rear, orderable AC or DC, exhaust airflow.\
