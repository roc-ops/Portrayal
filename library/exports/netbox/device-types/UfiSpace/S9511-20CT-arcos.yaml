comments: "UfiSpace S9511-20CT disaggregated cell site gateway router - 1RU temperature-hardened white\
  \ box, 20 interfaces in three colour-coded blocks: four 1G RJ45/SFP combo ports in brown, eight 1/10G\
  \ SFP+ in blue and eight 1/10/25G SFP28 in olive, behind a Broadcom Qumran2n at 100 Gbps with a Stratum\
  \ 3E OCXO, an internal GNSS receiver and GNSS, 1PPS, 10MHz, ToD and BITS timing interfaces. Both the\
  \ dual-feed DC supply and the 3+1 fans are FIXED, so the chassis has no bays at all\n\nConfiguration\
  \ `dc`: Dual-feed fixed DC supply, -36 to -72 V on the two three-post screw terminal blocks under INPUT0\
  \ and INPUT1, with four fixed 3+1 fans. THE ONLY BUILD: no AC variant appears in the datasheet, whose\
  \ Power Specs row gives a DC input only, nor in the HIG, whose Connecting Power section has a DC Version\
  \ subsection and no AC one\n\nDatasheet: UfiSpace S9511-20CT Disaggregated Cell Site Gateway Router\
  \ Datasheet\n  https://www.ufispace.com/products/telco/access/s9511-20ct\n\nFacts carried in the model\
  \ that this schema has no field for:\n- performance.switching-capacity: 100 Gbps\n- performance.packet-buffer:\
  \ 1 GB deep buffer\n- power.power-typical-w: 63\n- power.power-envelope: bare\n- power.input-dc: -36\
  \ to -72 V, 8 A per feed\n- power.psu-redundancy: dual-feed one power stage, fixed (not field-replaceable)\n\
  - thermal.fan-redundancy: 3+1 fixed (not field-replaceable)\n- environmental.operating-temp: -40 to\
  \ 70 C (temperature hardened)\n- environmental.operating-humidity: 5 to 95% RH non-condensing\n- environmental.storage-temp:\
  \ -40 to 70 C\n- environmental.storage-humidity: 5 to 93% RH non-condensing\n- platform.asic: Broadcom\
  \ Qumran2n BCM88295\n- platform.cpu: Intel Denverton-NS 4-core @ 1.6 GHz\n- platform.memory: 8 GB DDR4\n\
  - platform.storage: 32 GB eMMC\n- features.timing: Stratum 3E OCXO with optional holdover; ITU-T SyncE;\
  \ IEEE 1588v2 default, G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2 (extra licence), T-GM, T-BC/OC,\
  \ T-TC; Class C accuracy. NOS integration is required to activate the timing features\n- features.gnss:\
  \ internal receiver for master clock implementations\n- features.timing-interfaces: GNSS in on SMA,\
