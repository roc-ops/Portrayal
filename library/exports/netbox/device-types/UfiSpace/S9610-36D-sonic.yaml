comments: "UfiSpace S9610-36D 400G open core and aggregation router - 2RU white box, 36x QSFP-DD 40/100/200/400G\
  \ in two rows of eighteen (one 2-wide and four 4-wide belly-to-belly cage banks) with OpenZR+/ZR on\
  \ the whole upper row, plus a stacked 10G SFP+ management pair, an RJ45 out-of-band port over a USB\
  \ 3.0 over an RJ45 console, a micro-USB console, 1PPS and 10MHz SMB timing jacks and a two-digit status\
  \ display, on Broadcom Jericho2c+ at 14.4 Tbps with 16 GB of deep buffer, an OP2 external TCAM and a\
  \ Stratum 3E OCXO; four hot-swap fans (3+1) and dual 3000 W PSUs (1+1) at the rear, orderable AC or\
  \ DC\n\nConfiguration `base`: The chassis as both rear images draw it - four FAN-808012-HC fans and\
  \ two PSU-302-DESR 3000 W DC supplies with their two-stud terminal blocks, red handles and latches throughout,\
  \ front-to-back airflow, and the thirty-eight traffic and management ports empty. No orderable chassis\
  \ part number appears in any held document; see the chassis-sku gap.\n\nDatasheet: UfiSpace S9610-36D\
  \ 400G Open Aggregation Router Datasheet\n  https://www.ufispace.com/products/telco/aggregation/s9610-36d-400g-open-core-aggregation-router\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15, Subpart\
  \ B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386; EN 55035; VCCI CISPR 32, Class A\n-\
  \ compliance.environment: WEEE\n- compliance.safety: UL 62368-1; IEC 62368-1\n- environmental.operating-humidity:\
  \ 5 to 85% RH non-condensing\n- environmental.operating-temp: 0 to 45 C\n- environmental.storage-humidity:\
  \ 5 to 93% RH non-condensing\n- environmental.storage-temp: -40 to 70 C\n- features.macsec: point-to-point\
  \ MACsec\n- features.op2-disabled-ports: ports 1, 17, 19 and 35 lose their service-port function when\
  \ the OP2 statistics counter is enabled, leaving 32 service ports (HIG Figure 8b)\n- features.optics-qsfp-dd:\
  \ 400G QSFP-DD OpenZR+/ZR/SR8/FR4/LR4/ER4/DR4/DR4+/PLR4; 200G QSFP56 SR4/FR4; 100G QSFP28 SR4/LR4/ER4/ZR4\
  \ (datasheet compatible transceiver list); the HIG's port table gives a maximum supported distance of\
  \ 600 km\n- features.optics-sfp-plus: 10G SFP+ (datasheet port list, 2 x 10G SFP+ management ports)\n\
  - features.segment-routing: full Segment Routing over IPv6 (SRv6)\n- features.timing-cable: 50 ohm SMB\
  \ coaxial with a 10-32UNF-2A connector, for 1PPS and 10MHz\n- features.zr-ports: the eighteen EVEN-numbered\
  \ ports, 0 to 34, are the OpenZR+/ZR set - HIG Figure 9a shades exactly the upper row and captions it\
  \ 'The ports highlighted in brown support OpenZR+ and ZR'\n- lifecycle.eol: none-announced\n- management.console:\
  \ RJ45 RS-232 plus a micro-USB serial console, 115200 8N1\n- management.oob: 1x RJ45 100/1000M\n- management.timing:\
  \ 1PPS and 10MHz SMB, each input/output; SyncE and IEEE 1588v2 with the G.8265.1, G.8275.1, G.8275.2,\
  \ SMPTE ST 2059-2, T-BC/OC and T-TC profiles, Class C accuracy\n- performance.deep-buffer: 16 GB\n-\
  \ performance.switching-capacity: 14.4 Tbps\n- platform.asic: Broadcom Jericho2c+ BCM88850\n- platform.bmc:\
  \ Aspeed AST2620\n- platform.cpu: Intel Skylake-D 8-core @ 1.9 GHz\n- platform.memory: 64 GB DDR4, expandable\
  \ to 128 GB\n- platform.oem-alias: DriveNets NCP-36CD-S-SA (Network Cloud Packet forwarder, 36x400 NIF\
  \ standalone). NOT A UFISPACE CLAIM - no UfiSpace document mentions DriveNets. The mapping is internal\
  \ analysis: the okf `drivenets-ddc` bundle's 'DriveNets NCF/NCP to white-box hardware map (shipping\
  \ platforms)' matches the roadmap slide's NCP-36CD-S-SA (J2C+ 12.8T) to this chassis on published silicon\
  \ and port configuration. The map names this model OR the S9611-36D refresh for the same DriveNets name,\
