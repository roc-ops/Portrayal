comments: "UfiSpace S9700-53DX 100G open disaggregated core and edge router - 2RU white box on Broadcom\
  \ Jericho2 with an OP2 external TCAM and an 8 GB deep buffer, 4.8 Tbps, built to run standalone or as\
  \ a line node in a distributed disaggregated chassis behind an S9705-48D or S9725-64E fabric switch.\
  \ Forty 40/100G QSFP28 service ports in ten four-high columns, of which ports 0-19 break out to 4x25GE\
  \ or 4x10GE; thirteen 400G QSFP-DD fabric ports on a pink band at the right; two 10G SFP+ management\
  \ ports, an RJ45 and a micro-USB console, a USB 2.0 Type-A service port, a 100/1000M out-of-band RJ45,\
  \ a recessed reset and a two-digit beacon display. Four hot-swap fans (3+1) and dual 2000 W PSUs (1+1)\
  \ at the rear, orderable AC or DC, front-to-back airflow\n\nConfiguration `ac`: The chassis as HIG Figure\
  \ 7's rear elevation and the vendor's own rear product render both draw it - four FAN-803816-HC exhaust\
  \ fans and two PSU-202-AESR 2000 W AC supplies with C20 appliance inlets and red latches, front-to-back\
  \ airflow, and the fifty-five traffic, fabric and management ports empty. The HIG rates the feed at\
  \ 200-240 V and notes that on a single 110 VAC source each supply delivers only 1000 W, at which point\
  \ hot-swapping a supply is no longer supported. No orderable chassis part number appears in any held\
  \ document; see the chassis-sku gap.\n\nDatasheet: UfiSpace S9700-53DX 100G Disaggregated Core and Edge\
  \ Router Datasheet\n  https://www.ufispace.com/products/telco/core-edge/s9700-53dx-100g-core-router\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15, Subpart\
  \ B, Class A; ICES-003, Class A; EN 55032, Class A; EN 55024; EN 55035; EN 62479; EN 50663; EN 300 386;\
  \ EN 301 489; EN 303 413; BSMI; VCCI CISPR 32, Class A; AS/NZS CISPR 32, Class A; Anatel; NEBS GR-1089\n\
  - compliance.environment: RoHS; WEEE; NEBS GR-63\n- compliance.nebs: the Regulatory Compliance table\
  \ lists NEBS GR-1089 under EMC and NEBS GR-63 under Environment; separately the datasheet's Key Benefits\
  \ line reads 'Ideal for Core, Edge, and Central Office deployments (NEBS Level 3)'. Both wordings are\
  \ carried because they are different claims and neither document reconciles them\n- compliance.safety:\
  \ UL 62368-1; IEC 62368-1; BSMI; NOM\n- environmental.operating-humidity: 5 to 85% RH non-condensing\n\
  - environmental.operating-temp: 0 to 45 C\n- environmental.storage-humidity: 5 to 93% RH non-condensing\n\
  - environmental.storage-temp: -40 to 70 C\n- features.breakout: service ports 0-19 can individually\
  \ break out into 4x25GE or 4x10GE; if any of ports 0-19 is in breakout mode the corresponding lower-column\
  \ port is disabled (HIG Port Overview). Ports 20-39 are 40GE/100GE only\n- features.deployment: functions\
  \ standalone or as a node in a cluster from 4 Tbps up to 192 Tbps; interoperable with the rest of the\
  \ S9700 series using an S9705-48D or S9725-64E as the fabric (datasheet Key Features). Keyed `deployment`\
  \ rather than `role`, which is reserved for the structural role each GROUP carries\n- features.fabric-ports:\
  \ the thirteen 400G QSFP-DD ports are FABRIC ports and are for connecting to the fabric ports of an\
  \ S9705-48D fabric switch only, not for service traffic (HIG Port Overview)\n- features.optics-qsfp-dd:\
  \ 400GE QSFP-DD DAC, AEC and AOC up to 100 m - the fabric ports take cables, and the datasheet's Compatible\
  \ Fabric Cable Types list carries no optical transceiver\n- features.optics-qsfp28: 100GE QSFP28 SR4,\
  \ LR4, ER4 and ZR4, up to 80 km (datasheet Compatible Transceiver Types)\n- features.optics-sfp-plus:\
  \ NOT STATED. The datasheet's Compatible Transceiver Types block lists 100GE QSFP28 SR4/LR4/ER4/ZR4\
  \ only and its Compatible Fabric Cable Types block lists 400GE QSFP-DD DAC/AEC/AOC; neither names anything\
  \ for the two 10G SFP+ management ports, and the HIG's Connecting the Transceiver section names no part\
  \ either. The cage takes what an SFP+ cage takes; which optics UfiSpace qualifies in it is unrecorded\
  \ here rather than inferred - see the sfp-plus-optics gap\n- features.routing: full Segment Routing\
  \ over IPv6 (SRv6) support (datasheet Key Features)\n- lifecycle.eol: none-announced\n- management.console:\
  \ RJ45 RS-232 plus a micro-USB serial console, both lettered IOIOI\n- management.inband-mgmt: 2x 10G\
  \ SFP+ management ports numbered 0 and 1\n- management.oob: 1x RJ45 100/1000M out-of-band\n- management.service-port:\
  \ 1x USB 2.0 Type-A\n- performance.packet-buffer: 8 GB\n- performance.switching-capacity: 4.8 Tbps\n\
  - platform.asic: Broadcom Jericho2 BCM88690\n- platform.bmc: Aspeed AST2400\n- platform.cpu: Intel Broadwell-DE\
  \ 8-core @ 2.0 GHz\n- platform.memory: 64 GB DDR4\n- platform.oem-alias: DriveNets NCP-40C (Network\
  \ Cloud Packet forwarder, 40x100 NIF + 13x400 FIF). NOT A UFISPACE CLAIM - no UfiSpace document mentions\
  \ DriveNets. The mapping is internal analysis: the okf `drivenets-ddc` bundle's 'DriveNets NCF/NCP to\
  \ white-box hardware map (shipping platforms)' matches the roadmap slide's NCP-40C (J2 4T) to this chassis\
  \ on published silicon and port configuration. The slide's photo matches this chassis rather than the\
  \ Edgecore COR550, which publishes the identical 40x100 + 13x400 J2 configuration. Recorded so a search\
  \ for either name finds this box; no DriveNets figure or artwork is transcribed anywhere in this file.\n\
