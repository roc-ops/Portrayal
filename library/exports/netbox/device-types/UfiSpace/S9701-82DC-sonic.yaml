comments: "UfiSpace S9701-82DC high-density 25G open disaggregated core and edge router - a 2RU 436 x\
  \ 609.6 mm white box on Broadcom Jericho2c BCM88802 with an OP2 BCM16K external TCAM, 2.4 Tb/s and 4\
  \ GB of deep buffer, carrying eighty-two ports on one face: sixty-four 1/10/25G SFP28 service ports\
  \ in eight belly-to-belly ganged 2x4 shells, twelve 40/100G QSFP28 service ports in six stacked pairs,\
  \ and six 400G QSFP-DD FABRIC ports - numbered 0-5 in their own space - that connect only to an S9705-48D\
  \ or S9725-64E fabric to build a distributed disaggregated chassis. A timing block across the top left\
  \ takes a GNSS SMA, a 10MHz SMB, a 1PPS SMB and a ToD RJ45 against a Stratum 3E OCXO with SyncE and\
  \ 1588v2; below it sit two 10G SFP+ management ports, a 100/1000M RJ45, a USB 3.0 Type-A maintenance\
  \ port and the RJ45 and micro-USB console pair, both lettered IOIOI. Four hot-swap fans (3+1) and dual\
  \ 1300 W supplies (1+1) at the rear, orderable AC or DC, front-to-back\n\nConfiguration `base`: Four\
  \ FAN-803816-HI exhaust fans and two PSU-132-DESR 1300 W DC supplies, front-to-back, with all eighty-two\
  \ ports empty. The DC build is what the vendor's own rear render shows seated - the two-post screw terminal\
  \ block behind its hinged cover - so this is read rather than chosen. No orderable chassis part number\
  \ appears in any held document.\n\nDatasheet: UfiSpace S9701-82DC High Density 25G Open Edge/Core Router\
  \ Datasheet\n  https://www.ufispace.com/products/telco/core-edge/s9701-82dc-high-density-25g-open-edge-core-router\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15, Subpart\
  \ B, Class A; ICES-003, Class A; EN 55032, Class A; EN 55024; EN 55035; EN 62479; EN 50663; EN 300 386;\
  \ EN 301 489; EN 303 413; BSMI; VCCI CISPR 32, Class A; MTCTE; KC KS C 9832, Class A; KS C 9835; Anatel\n\
  - compliance.environment: WEEE; RoHS; BSMI\n- compliance.safety: UL 62368-1; IEC 62368-1; MTCTE\n- environmental.operating-humidity:\
  \ 5 to 85% RH non-condensing\n- environmental.operating-temp: 0 to 45 C\n- environmental.storage-humidity:\
  \ 5 to 93% RH non-condensing\n- environmental.storage-temp: -40 to 70 C\n- features.gnss: internal GNSS\
  \ receiver supporting GPS/QZSS L1 C/A, GLONASS L1OF, BeiDou B1, SBAS L1 C/A (WAAS, EGNOS, MSAS, GAGAN)\
  \ and Galileo E1B/C; RF sensitivity -166 dBm, and the GNSS port supplies up to 5 V DC at 150 mA to an\
  \ active antenna\n- features.optics-qsfp-dd: 400GE QSFP-DD DAC, AOC and AEC only - the datasheet lists\
  \ these six as Compatible FABRIC Cable Types, not as optics, because they carry the chassis fabric to\
  \ an S9705-48D or S9725-64E rather than user traffic\n- features.optics-qsfp28: 100GBASE QSFP28 ZR/ER/LR/SR\
  \ (datasheet compatible transceiver list)\n- features.optics-sfp-plus: the two 10G SFP+ management ports\
  \ take the same 10GBASE SFP+ ER/LR/SR and 1GBASE SFP EX/LX/SX modules the datasheet lists for the service\
  \ ports; it publishes no separate compatibility list for them\n- features.optics-sfp28: 25GBASE SFP28\
  \ ZR/ER/LR/SR; 10GBASE SFP+ ER/LR/SR; 1GBASE SFP EX/LX/SX (datasheet compatible transceiver list)\n\
  - features.segment-routing: full Segment Routing over IPv6 (SRv6)\n- features.timing-cable: 50 ohm SMA\
  \ coaxial with a 1/4-36UNS-2B connector for GNSS; 50 ohm SMB coaxial with a 10-32UNF-2A connector for\
  \ 1PPS and 10MHz, each limited to 3 m; shielded RJ45 for ToD, limited to 3 m\n- lifecycle.eol: none-announced\n\
  - management.console: RJ45 and micro-USB serial console, both lettered IOIOI on the faceplate, 115200\
  \ 8N1 no flow control; the micro-USB side needs a Silicon Labs CP210x driver\n- management.oob: 1x RJ45\
  \ 100/1000M out-of-band management port\n- management.service-port: 1x USB 3.0 Type-A, described by\
  \ the guide as a maintenance port\n- management.timing: GNSS SMA input, 1PPS and 10MHz SMB input/output\
  \ and a ToD input/output RJ45; SyncE and IEEE 1588v2 with the Default, G.8265.1, G.8275.1 and G.8275.2\
  \ profiles plus SMPTE ST 2059-2 (extra licence), T-GM, T-BC/OC and T-TC. NOS integration is required\
  \ to activate any of it\n- performance.cluster-scale: standalone or clustered from 2.4 Tb/s up to 134\
  \ Tb/s, interoperating with the rest of the S9700 series through an S9705-48D or S9725-64E fabric\n\
  - performance.packet-buffer: 4 GB\n- performance.switching-capacity: 2.4 Tb/s\n- platform.asic: Broadcom\
  \ Jericho2c BCM88802\n- platform.bmc: Aspeed AST2400\n- platform.cpu: Intel Skylake-D 8-core @ 1.9 GHz\n\
  - platform.memory: 64 GB DDR4\n- platform.oem-alias: DriveNets NCP-64X12C-S (Network Cloud Packet forwarder,\
  \ 64x1/10GE + 12x100 + 6x400). NOT A UFISPACE CLAIM - no UfiSpace document mentions DriveNets. The mapping\
  \ is internal analysis: the okf `drivenets-ddc` bundle's 'DriveNets NCF/NCP to white-box hardware map\
  \ (shipping platforms)' matches the roadmap slide's NCP-64X12C-S (J2C 2.4T) to this chassis on published\
  \ silicon and port configuration. Recorded so a search for either name finds this box; no DriveNets\
  \ figure or artwork is transcribed anywhere in this file.\n- platform.oscillator: Stratum 3E OCXO\n\
  - platform.storage: 128 GB SSD\n- platform.tcam: Broadcom OP2 BCM16K external TCAM\n- power.circuit-reserve:\
  \ at least 1300 W reserved on each of two independent power circuits (HIG Installation Environment Requirements)\n\
  - power.input-ac: 100 to 240 V, 12 A max per feed\n- power.input-dc: -40 to -75 V, 40 A max per feed\n\
  - power.power-envelope: bare\n- power.power-max-w: 904\n- power.power-typical-w: 311\n- power.psu-redundancy:\
  \ 1+1 hot-swappable, active-active\n- thermal.airflow: front-to-back\n- thermal.fan-redundancy: 3+1\
  \ hot-swappable\n\nDrawing version 1.0.1. A major bump means a slot moved or an id was renamed, so anything\
  \ cached from an earlier export may no longer line up.\nModel maturity: modelled. Every dimension in\
  \ the source records where it came from."
