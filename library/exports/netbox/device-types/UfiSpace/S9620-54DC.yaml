comments: "UfiSpace S9620-54DC 400G open aggregation router - a 1RU 440 x 480 mm white box on Broadcom\
  \ Qumran3u BCM88400 at 1.2 Tbps with 4 GB of deep buffer, carrying 54 ports on one face: forty 1/10/25G\
  \ SFP28 and eight 1/10/25/50G SFP56 in twenty-four belly-to-belly ganged columns, then four 100G and\
  \ two 400G QSFP-DD in three more. A timing block down the left edge takes a GNSS SMA, 1PPS and 10MHz\
  \ SMB and a ToD RJ45 against a Stratum 3E OCXO with SyncE, 1588v2 and an internal GNSS receiver; the\
  \ management RJ45, serial console and USB 3.0 the datasheet lists appear nowhere on this face. Five\
  \ hot-swap fans (4+1) and dual 750 W supplies (1+1) at the rear, orderable AC or DC, front-to-back\n\
  \nConfiguration `base`: Five FAN-405636-HD exhaust fans and two PSU-751-DESR-1C 750 W DC supplies, front-to-back,\
  \ with all fifty-four ports empty. WHICH SUPPLY SHIPS AS THE BASE IS NOT KNOWN: both are orderable and\
  \ no held image shows either one seated, because UfiSpace publishes no rear view of this model. The\
  \ DC unit is seated arbitrarily; see the base-configuration-supply gap. No orderable chassis part number\
  \ appears in any held document.\n\nDatasheet: UfiSpace S9620-54DC 400G Open Aggregation Router Datasheet\
  \ (rev 20260811V01)\n  https://www.ufispace.com/products/telco/aggregation/s9620-54dc-400g-open-aggregation-router\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15, Subpart\
  \ B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386; EN 55035; EN 301 489; EN 303 413; VCCI\
  \ CISPR 32, Class A\n- compliance.environment: WEEE\n- compliance.safety: UL 62368-1; IEC 62368-1\n\
  - environmental.operating-humidity: 5 to 85% RH non-condensing\n- environmental.operating-temp: -40\
  \ to 65 C\n- environmental.storage-humidity: 5 to 93% RH non-condensing\n- environmental.storage-temp:\
  \ -40 to 70 C\n- features.coherent: the platform is optimised for 400ZR and OpenZR+ coherent optics\
  \ for direct metro aggregation without external transponders (datasheet Key Benefits); which of the\
  \ six QSFP-DD ports accept them is not stated\n- features.gnss: internal GNSS receiver for master clock\
  \ implementations\n- features.macsec: hardware-based MACsec on all ports\n- features.optics-qsfp-dd:\
  \ 400G QSFP-DD OpenZR+/ZR/ER4/LR4/FR4/SR8/DR4/DR4+; 100G QSFP-DD ZR+/DR4/LR4; 100G QSFP28 ZR4/ER4/LR4\
  \ (datasheet compatible transceiver list)\n- features.optics-sfp28: 25G SFP28 SR/LR/ER; 10G SFP+ SR/LR/ER;\
  \ 1G SFP SX/LX (datasheet compatible transceiver list)\n- features.segment-routing: full Segment Routing\
  \ over IPv6 (SRv6)\n- features.timing: GNSS SMA, 1PPS and 10MHz SMB and a ToD RJ45, each input/output;\
  \ SyncE and IEEE 1588v2 with the Default, G.8265.1, G.8275.1 and G.8275.2 profiles, T-TC, T-BC/OC and\
  \ T-GM, Class C accuracy\n- features.timing-cable: 50 ohm SMA coaxial with a 1/4-36UNS-2B connector\
  \ for GNSS; 50 ohm SMB coaxial with a 10-32UNF-2A connector for 1PPS and 10MHz; shielded RJ45 for ToD\n\
  - features.transceivers-sfp56: 50G SFP56 SR/LR/ER (datasheet compatible transceiver list). Recorded\
  \ under this key rather than the house `optics-sfp56` because `sfp56` is not yet one of the pluggable-cage\
  \ media tokens the L40 harvest recognises, and an `optics-` key that joins to no group is worse than\
  \ one filed plainly\n- features.tsn: Time Sensitive Networking for low packet loss and low delay variation\n\
  - lifecycle.eol: none-announced\n- management.console: RJ45 serial console (datasheet port list; not\
  \ on the front face)\n- management.oob: 1x RJ45 100/1000M (datasheet port list; not on the front face)\n\
  - performance.deep-buffer: 4 GB\n- performance.switching-capacity: 1.2 Tb/s\n- platform.asic: Broadcom\
  \ Qumran3u BCM88400\n- platform.bmc: Aspeed AST2620\n- platform.cpu: Intel Xeon D 4-core @ 2.4 GHz (Standard)\
  \ or 8-core @ 1.9 GHz (Premium)\n- platform.memory: 2x 16 GB DDR4 SO-DIMM with ECC (Standard) or 2x\
  \ 32 GB (Premium)\n- platform.oscillator: Stratum 3E OCXO\n- platform.storage: 1x 160 GB SSD (Standard)\
  \ or 2x 160 GB SSD with VROC RAID (Premium)\n- power.input-ac: 100 to 240 V, 10 A\n- power.input-dc:\
  \ -40 to -75 V, 28 A\n- power.power-envelope: bare\n- power.power-typical-w: 125\n- power.psu-redundancy:\
  \ 1+1 hot-swappable\n- thermal.airflow: front-to-back\n- thermal.fan-redundancy: 4+1 hot-swappable\n\
  \nDrawing version 4.0.1. A major bump means a slot moved or an id was renamed, so anything cached from\
  \ an earlier export may no longer line up.\nModel maturity: modelled. Every dimension in the source\
  \ records where it came from."
