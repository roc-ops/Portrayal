comments: "UfiSpace S9620-40DG - 2RU 40-port open aggregation router on Broadcom Qumran3a BCM88490 with\
  \ a 16 GB external deep buffer; 24x 1/10/25/50G SFP56, 12x 40/100G QSFP28 and 4x 400G (or 2x 800G) QSFP-DD,\
  \ full timing (GNSS/1PPS/10MHz/ToD/BITS) with a Stratum 3E OCXO, MACsec on every port, two front-loading\
  \ 1000 W PSUs and five rear hot-swap fans. Its 250 mm depth is the point of the platform - it is built\
  \ for shallow street cabinets where a normal rack-mount router will not fit\n\nConfiguration `ac`: Two\
  \ 1000W AC supplies (PSU-102-AISB-1) and five FAN-40802825-HD fans, front-to-back airflow, no optics\
  \ fitted - which is also the scope of the datasheet's 268 W typical figure\n\nDatasheet: UfiSpace S9620-40DG\
  \ Open Aggregation Router Datasheet (20260810V01)\n  https://www.ufispace.com/products/telco/aggregation/s9620-40dg\n\
