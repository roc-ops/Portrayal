comments: "Juniper EX9214, a 16 U modular Ethernet switch of the EX9200 family that runs Junos OS. It\
  \ is built on the MX960 chassis. Fourteen vertical slots stand side by side in the card cage. These\
  \ are line cards 0 to 5, the Switch Fabric slots SF0 and SF1, the shared slot 2|6 and line cards 7 to\
  \ 11. The shared slot takes a line card or a third Switch Fabric module. Each Switch Fabric module carries\
  \ a Routing Engine. The craft interface spans the top. A fan tray sits above the cage and one below\
  \ it, and the air filter tray sits under the cage. Four tall power supplies fill the rear under the\
  \ inlet strip. The EX9200 line cards are a family of their own and are not modelled: their slots show\
  \ blank panels.\n\nConfiguration `redund3-ac`: EX9214-REDUND3-AC: three EX9200-SF modules with two EX9200-RE,\
  \ two fan trays, one air filter kit and four 4100 W AC supplies.\n\nRack mounting positions: flush (as\
  \ shipped), mid (\"center-mount\").\n\nDatasheet: EX9200 Ethernet Switch Datasheet (1000432-022-EN,\
  \ Aug 2022)\n  https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex9200-ethernet-switch-datasheet.pdf\n\
