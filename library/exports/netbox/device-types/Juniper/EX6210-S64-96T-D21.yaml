comments: "Juniper EX6210, a 14 U modular campus and data center access switch that runs Junos OS. The\
  \ front has ten horizontal slots: eight take line cards only, and slots 4 and 5 take a Switch Fabric\
  \ and Routing Engine (SRE) module or a line card. Four power supply slots, PSU 0 to PSU 3, sit under\
  \ them. A single fan tray at the rear cools the chassis from front to back. Every shipping order includes\
  \ one SRE module, one power supply and the cover panels. The line cards are a family of their own and\
  \ are not modelled: their slots show cover panels.\n\nConfiguration `dc-2100-t`: EX6210-S64-96T-D21:\
  \ the 96-port RJ-45 system with a 2100 W DC power supply and two DC lugs (Panduit LCD4-14A-L). It ships\
  \ with two 48-port RJ-45 line cards, which are not modelled.\n\nRack mounting positions: flush (ears\
  \ level with the face; as shipped).\n\nDatasheet: Juniper EX6200 Line of Ethernet Switches datasheet\
  \ (1000390-002-EN, Aug 2011)\n  https://cdn.blueally.com/networkscreen/datasheets/ex-series/ex6200_ethernet_switch_ds.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.acoustic: 52 dBA with\
  \ AC supplies, 54 dBA with DC supplies, at 27 C, ISO 7779 (datasheet, bystander position at the front)\n\
  - compliance.emc: FCC Part 15 Class A, EN 55022 Class A, VCCI Class A, CISPR 22 Class A, AS/NZS CISPR\
  \ 22 Class A (datasheet)\n- compliance.materials: RoHS 5/6 (datasheet)\n- compliance.nebs: GR-63-Core,\
  \ GR-1089-Core and SR-3580 NEBS Criteria Levels (Level 3) are listed under the customer-specific requirements\
