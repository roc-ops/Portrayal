comments: "Juniper EX4300-32F - a fixed 1RU Gigabit Ethernet fibre aggregation switch with 32 100/1000BASE-X\
  \ SFP ports in four gangs of eight, four 10-Gigabit SFP+ uplink ports and two 40-Gigabit QSFP+ ports\
  \ on the rear panel that are Virtual Chassis ports by default. The front carries the 32 SFP cages in\
  \ two stacked rows, an LCD panel with Menu and Enter buttons, three chassis status lamps, the four SFP+\
  \ ports, a mini-USB console port and a large slot at the left end for an optional uplink module, which\
  \ ships covered. The rear carries the two power supply slots at the left, the two QSFP+ ports, two fan\
  \ modules and the management, console and USB ports at the right; as shipped it holds one 350 W AC power\
  \ supply, front-to-back (AIR OUT) fan modules and a cover panel over the second power supply slot. The\
  \ EX4300-32F-DC ships with a 550 W DC supply, and the EX4300-32F-S is the same chassis with the power\
  \ supplies and fan modules ordered separately.\n\nConfiguration `s`: EX4300-32F-S - the spare chassis,\
  \ shipped with no power supply and no fan module; either AC or DC supplies and AIR OUT or AIR IN fans\
  \ are ordered separately, and the datasheet's spare-chassis matrix says which combinations are supported.\
  \ The supply and fan bays are shown open.\n\nDatasheet: EX4300 Line of Ethernet Switches Datasheet (Juniper\
  \ Networks, PDF created 2022-07-25)\n  https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex4300-line-of-ethernet-switches-datasheet.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC 47 CFR Part 15\
  \ Class A, EN 55022 Class A, ICES-003 Class A, VCCI Class A, AS/NZS CISPR 22 Class A, CISPR 22 Class\
  \ A, EN 55024, EN 300386, CE\n- compliance.nebs: GR-1089-CORE EMC and electrical safety for network\
  \ telecommunications equipment (listed by the datasheet; no level stated)\n- compliance.rohs: RoHS 6/6\
  \ (datasheet)\n- compliance.safety: UL 60950-1, UL 62368-1, CAN/CSA C22.2 No. 60950-1 and 62368-1, EN\
  \ 60950-1, IEC 60950-1 and IEC 62368-1\n- environmental.acoustic-noise: 39 dBA with a 350 W AC AFO supply;\
  \ 41.2 dBA with a 550 W DC AFO supply (datasheet Table 3, ISO 7779 at 23 C)\n- environmental.altitude:\
  \ up to 3049 m operating (10,000 ft); 4877 m non-operating\n- environmental.humidity: 10 to 85 percent\
  \ noncondensing operating; 0 to 95 percent non-operating\n- environmental.operating-temp: 0 to 45 C\
  \ (32 to 113 F) for AFO models; 0 to 35 C for AFI models\n- environmental.storage-temp: -40 to 70 C\n\
  - features.macsec: IEEE 802.1AE on all Gigabit Ethernet and 10 Gigabit Ethernet ports\n- features.optics-qsfp:\
  \ 40GbE QSFP+ SR4 (multimode) and DAC direct-attach copper (datasheet, Supported Optics)\n- features.optics-sfp:\
  \ LC SFP SX (multimode) and LX (single-mode), and 100BASE-FX and 1000BASE-T copper SFPs on the fixed\
  \ 100/1000BASE-X ports (datasheet, Supported Optics and Ordering Information)\n- features.optics-sfp-plus:\
  \ LC SFP+ SR, USR, LRM (multimode), LR, ER (single-mode) and DAC direct-attach copper (datasheet, Supported\
  \ Optics)\n- features.poe: none - the 32-port switches have no Power over Ethernet\n- features.uplink-module:\
  \ one slot; 2-port 40-Gigabit EX-UM-2QSFP or 8-port 1/10-Gigabit SFP+ EX-UM-8X8SFP (neither is part\
  \ of the shipping configuration)\n- features.virtual-chassis: up to 10 members; the two rear QSFP+ ports\
  \ are Virtual Chassis ports by default, and the four built-in SFP+ ports cannot be Virtual Chassis ports\n\
  - lifecycle.end-of-life: 2029-03-31\n- lifecycle.eol: announced\n- lifecycle.eol-announcement: https://eoltracking.com/eol/juniper-ex4300\n\
  - management.console: mini-USB on the front, RJ-45 console on the rear\n- management.lcd: 2 lines of\
