comments: "Juniper EX4200-24T - a fixed 1RU Gigabit Ethernet access switch with 24 10/100/1000BASE-T ports,\
  \ the first eight of them Power over Ethernet. The front carries the 24 jacks in two stacked rows, an\
  \ LCD panel with Menu and Enter buttons, three chassis status lamps and a slot for an optional uplink\
  \ module, which ships covered. The rear carries a fan tray, two Virtual Chassis ports, a USB port, a\
  \ temperature shutdown lamp, the management and console jacks, an ESD point and two power supply slots;\
  \ as shipped it holds one 320 W AC power supply and a cover panel over the second slot. Air moves side\
  \ to rear. The -DC build carries a 190 W DC supply and gives no PoE. The EX4200-48T is the same panel\
  \ with 48 ports.\n\nConfiguration `ac`: EX4200-24T as shipped - one 320 W AC power supply in slot 0\
  \ with a cover panel over slot 1, the fan tray, and the uplink slot covered. Side-to-rear airflow. The\
  \ datasheet also orders the Trade Agreements Act build EX4200-24T-TAA, the same hardware.\n\nDatasheet:\
  \ EX4200 Ethernet Switch with Virtual Chassis Technology Datasheet (Juniper Networks, 1000215-026-EN,\
  \ Feb 2019)\n  https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex4200-ethernet-switch-with-vitual-chassis-technology.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC 47 CFR Part 15\
