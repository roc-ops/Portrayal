comments: "Juniper QFX5100-96S, a 2RU high-density data-centre access switch running Junos OS. It has\
  \ 96 SFP+ ports and 8 QSFP+ ports. An SFP+ port takes 10 GbE, 1 GbE or 100 Mbps optics. A QSFP+ port\
  \ runs at 40 GbE or as four 10 GbE ports. The ports and their lamps are on the port side. The rear carries\
  \ two power supplies in two stacked slots and three fan modules. It also has the console, two management\
  \ ports, a USB port, the reset button and the four chassis lamps. One front panel ships in four variants.\
  \ They have AC or DC supplies, with airflow front-to-back (AIR OUT) or back-to-front (AIR IN).\n\nConfiguration\
  \ `ac-f2b`: QFX5100-96S-AFO: two 850 W AC supplies (JPSU-850W-AC-AFO) and three front-to-back fan modules\
  \ (QFX5100-96S-FANAFO). All have a Juniper Gold handle and the label AIR OUT or AFO (guide Tables 13\
  \ and 19).\n\nDatasheet: QFX5100 Ethernet Switch Datasheet (1000480-022-EN, July 2024)\n  https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/qfx5100-ethernet-switch-datasheet.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- environmental.altitude: no performance\
  \ degradation to 2000 m (6562 ft)\n- environmental.humidity: 5 to 90 percent noncondensing; 5 to 93\
  \ percent short term\n- environmental.operating-temp: 0 to 40 C (32 to 104 F) normal operation\n- environmental.storage-temp:\
  \ -40 to 70 C (-40 to 158 F) in the shipping container\n- features.channelization: up to 104 logical\
  \ 10 GbE ports with the QSFP+ ports broken out (guide, Port Panel of a QFX5100-96S Device)\n- features.optics-qsfp:\
  \ 40 GbE QSFP+, QSFP+ direct attach and active optical cable, breakout cables to SFP+\n- features.optics-sfp-plus:\
  \ 10 GbE SFP+, 1 GbE and 100 Mbps SFP, SFP+ direct attach cable and active optical cable\n- features.virtual-chassis:\
  \ up to 10 switches in a ring; also a Virtual Chassis Fabric leaf or spine\n- lifecycle.eol: none-announced\n\
  - management.console: RJ-45 console port (CON)\n- management.oob: management port C0 (RJ-45, em0) and\
  \ C1 (SFP, em1) with link and status lamps\n- management.usb: one USB port for image updates\n- performance.qsfp-plus-speeds:\
  \ 40 GbE; or four 10 GbE with a breakout cable\n- performance.sfp-plus-speeds: 10 GbE with SFP+ optics;\
  \ 1 GbE or 100 Mbps with SFP optics\n- performance.shared-packet-buffer: 12 MB shared packet buffer\
  \ (datasheet)\n- performance.switching-capacity: 2.56 Tbps, 1.44 Bpps (datasheet)\n- physical.depth-note:\
  \ 22.44 in (57 cm), not including the handles of the fans and supplies (Table 3)\n- physical.weight-note:\
  \ 32 lb (14.5 kg per the guide, 32.5 lb or 14.74 kg per the datasheet) with FRUs installed (Table 3)\n\
  - platform.cpu: 1.5 GHz dual-core Intel\n- platform.memory: 8 GB\n- platform.software: Junos OS\n- platform.storage:\
  \ 32 GB SSD\n- power.power-dc-max-w: 470\n- power.power-dc-typical-w: 315\n- power.power-envelope: unstated\n\
  - power.power-input-ac: 100 to 240 VAC single phase, 50 to 60 Hz (the legend in guide Figure 21 reads\
  \ 4.5 A, 2 A). The guide's table gives no value.\n- power.power-input-dc: rated -48 to -60 VDC, operating\
  \ range -40 to -72 VDC, 10 A maximum (guide Table 17)\n- power.power-max-w: 470\n- power.power-typical-w:\
  \ 315\n- power.redundancy-note: two 850 W supplies, load-sharing and fully redundant; both should be\
  \ installed\n- thermal.fans: three fan modules, hot-swappable; the switch runs 30 seconds without thermal\
  \ shutdown while one is replaced\n\nDrawing version 0.2.0. A major bump means a slot moved or an id\
  \ was renamed, so anything cached from an earlier export may no longer line up.\nModel maturity: modelled.\
  \ Every dimension in the source records where it came from."
