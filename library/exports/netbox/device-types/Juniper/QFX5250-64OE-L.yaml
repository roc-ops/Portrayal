comments: 'Juniper QFX5250-64OE-L, a 2OU liquid-cooled 1.6T data-centre leaf and spine switch for an Open
  Rack v3 (ORv3) rack, running Junos OS Evolved. The port side has 64 OSFP ports (1.6 TbE, for ORHS transceivers
  with a riding heat sink) in two banks of eight columns of four, with a lamp for every port. It also
  has two SFP28 ports (10 or 25 GbE), the RJ-45 management and console ports, a USB port, the 10 MHz and
  1 PPS connectors, the ON/OFF and reset buttons and the LEAKAGE, ID, SYS and ALM lamps. A switch handle
  stands at each end of the port bank. The rear has no power supplies and no fan modules. It carries a
  coolant outlet (hot) and inlet (cold) UQDB06 plug at the ends and the IT gear input connector in the
  middle, which blind-mates with the rack''s busbar. It is the only model the guide describes.


  Configuration `orv3-liquid`: QFX5250-64OE-L, the liquid-cooled 2OU switch for an ORv3 rack: 64 OSFP
  ports, two SFP28 ports, powered from the rack busbar (46 to 56 VDC, three built-in DC-to-DC bricks)
  and cooled by the rack''s coolant through two UQDB06 plugs. No power supply and no fan module is shipped
  or fits (guide Tables 9 and 10).


  Facts carried in the model that this schema has no field for:

  - compliance.class: Class A (guide, Compliance Statements)

  - compliance.emc: FCC 47 CFR Part 15; ICES-003 / ICES-GEN; EN 55032; EN 55035; CISPR 32; CISPR 35; EN
  300 386 V1.6.1 and V2.2.1; IEC/EN 61000-3-2 and 61000-3-3; AS/NZS CISPR 32; VCCI-CISPR 32; BSMI CNS
  15936; KS C 9835, 9832 and 9610 (guide, Agency Approvals)

  - compliance.safety: IEC 62368-1:2014, 2018 and 2023; EN 62368-1:2014+A11:2017; UL 60950-1:2007 R10.14;
  CAN/CSA-C22.2 No. 60950-1-07; UL/CSA 62368-1:2025; IEC/EN 60825-1 (guide, Agency Approvals)

  - compliance.seismic: tested for Zone 4 earthquake requirements to NEBS GR-63-CORE (guide Table 5)

  - environmental.altitude: operating 6000 ft (1830 m); storage 15000 ft (4500 m) (guide Table 5)

  - environmental.humidity: 10 to 90 percent noncondensing operating, 5 to 95 percent non-operating (guide
  Table 5)

  - environmental.operating-temp: 0 to 46 C (32 to 114.8 F) at sea level, 0 to 40 C up to 6000 ft (guide
  Table 5); recommended ambient 0 to 40 C with liquid cooling (Table 23)

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F) (guide Table 5)

  - features.leak-detection: leakage detection controller with the LEAKAGE lamp; the ON/OFF button restarts
  boot after a leak (guide, Leakage Detection)

  - features.optics-osfp: ORHS (OSFP with riding heat sink) transceivers, 1600G; see the Hardware Compatibility
  Tool (guide Table 19)

  - features.optics-sfp28: ports 64 and 65 take 25G and 10G SFP28 transceivers (guide Table 19)

  - lifecycle.eol: none-announced

  - management.console: one RJ-45 console port, shared between the CPU and the leakage detection controller
  board

  - management.oob: one RJ-45 management port, 10 M, 100 M and 1 G (guide Table 20)

  - management.timing-outputs: one 1 PPS and one 10 MHz port on 2x1 DIN 1.0/2.3 latching connectors. The
  guide says they can be inputs or outputs. It also says the switch does not currently support timing
  features (guide, Connect 1-PPS and 10-MHz Timing Devices)

  - management.usb: one Type-A USB 3.0 port

  - performance.breakout-ports: 1x1600G, 1x800G, 2x800G, 2x400G, 4x400G, 4x200G, 8x200G and 8x100G; up
  to 512 ports (guide, Channelization)

  - performance.osfp-speeds: 1600G, 800G, 400G, 200G and 100G, by transceiver (guide, Interface Naming;
  Table 19)

  - performance.port-count: 64 OSFP at up to 1600 Gbps and 2 SFP28 (guide Table 2)

  - performance.throughput: 102.4 Tbps (guide Table 2)

  - physical.rack-form: 2OU, Open Rack v3 (ORv3) tray; no four-post rack variant (guide Tables 2 and 6)

  - physical.weight-note: 105.82 lb (48.00 kg) (guide Table 4)

  - platform.cpu: Intel 6-core 2.8 GHz Ice Lake D, 32 GB DRAM (guide Table 2)

  - platform.software: Junos OS Evolved

  - platform.storage: two internal 200 GB NVMe SSDs (guide Table 2)

  - platform.switch-chip: Broadcom Tomahawk 6, BCM78914 (guide Table 2)

  - power.power-envelope: as-tested

  - power.power-input-dc: 46 to 56 VDC from the ORv3 busbar, 110 A (guide Table 21)

  - power.power-max-w: 3435

  - power.power-measurement-note: loaded with DR optics (guide Table 21)

  - power.power-output-max-w: 4300

  - power.power-typical-w: 3375

  - power.redundancy-note: three built-in 1600 W DC-to-DC bricks with no redundancy; a brick failure disables
  the optics (guide, DC-to-DC Power Bricks)

  - thermal.coolant-flow: 10 litres per minute, 25 to 40 PSI, coolant 7 to 45 C (guide Table 23)

  - thermal.cooling: 100 percent liquid-cooled; OAT PG 25 coolant through two UQDB06 plugs; no fans


