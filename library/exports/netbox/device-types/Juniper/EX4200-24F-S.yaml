comments: "Juniper EX4200-24F - a fixed 1RU Gigabit Ethernet access switch with 24 small form-factor pluggable\
  \ (SFP) ports for 100BASE-FX and 1000BASE-X optics, in one row. The front carries the 24 SFP cages,\
  \ an LCD panel with Menu and Enter buttons, three chassis status lamps and a slot for an optional uplink\
  \ module, which ships covered. The rear carries a fan tray, two Virtual Chassis ports, a USB port, a\
  \ temperature shutdown lamp, the management and console jacks, an ESD point and two power supply slots;\
  \ as shipped it holds one 320 W AC power supply and a cover panel over the second slot. Air moves side\
  \ to rear. The -DC build carries a 190 W DC supply, and the -S build is the spare chassis shipped without\
  \ a power supply or fan tray. The switch gives no PoE.\n\nConfiguration `s`: EX4200-24F-S - the spare\
  \ chassis, shipped with no power supply and no fan tray: \"Power supplies for this model are not shipped\
  \ by default; you must order them separately\", and so is the fan tray. The supply and fan bays are\
  \ shown open.\n\nDatasheet: EX4200 Ethernet Switch with Virtual Chassis Technology Datasheet (Juniper\
  \ Networks, 1000215-026-EN, Feb 2019)\n  https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex4200-ethernet-switch-with-vitual-chassis-technology.pdf\n\
