comments: 'Juniper QFX5200-32C, a 1RU data-centre spine and leaf switch with 32 QSFP28 ports (100 GbE
  by default; 50, 40, 25 or 10 GbE by configuration or breakout cable), numbered 0 to 31 in two rows.
  The port side also carries an RJ45 grand master clock jack and two clock outputs, PPS OUT and 10M OUT.
  The FRU side carries the management panel (four chassis lamps, two SFP management cages C0 and C1, an
  RJ45 console, an RJ45 management port, a USB port and a reset button), five fan modules and two power
  supplies. It ships as one front panel in several builds: AC or DC supplies, front-to-back (AIR OUT)
  or back-to-front (AIR IN), and the QFX5200-32C-L, which runs Junos OS Evolved on the same panel.


  Configuration `l-ac-afo`: QFX5200-32C-LAFO: the QFX5200-32C-L, the same port panel running Junos OS
  Evolved, with two 850 W AC supplies (JPSU-850W-AC-AFO) and five front-to-back fan modules (QFX5200-32C-FANAFO,
  shared with the -AFO build). The -32C-L takes AC supplies only and has no second management interface
  (C1).


  Rack mounting positions: flush (ears level with the face; as shipped), recessed ("recessed 2 in (5 cm)";
  ears 50.8 mm in front of the face).


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: Designed to comply with Zone 4 earthquake requirements per NEBS GR-63-CORE, Issue
  3 (Table 30 wording)

  - environmental.altitude: no performance degradation to 2000 m (6562 ft)

  - environmental.humidity: 5 to 90 percent noncondensing (up to 93 percent short term)

  - environmental.operating-temp: 0 to 40 C (32 to 104 F)

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container

  - features.optics: 100 GbE QSFP28, 40 GbE QSFP+, AOC, DAC and breakout cables; a QSFP+ to SFP+ adapter
  (QSA) from Junos OS 19.3R1

  - features.timing: RJ45 grand master clock jack (GM), 1 PPS output, 10 MHz output

  - features.virtual-chassis: up to three QFX5200-32C members (not the 32C-L)

  - lifecycle.eol: none-announced

  - management.console: RJ-45 console port (CON)

  - management.oob: SFP management cages C0 and C1 and an RJ45 C0 (10/100/1000 BASE-T); the 32C-L has
  no second management interface

  - management.usb: one USB port

  - performance.port-speeds: QSFP28 ports 0 to 31, 100 GbE by default; 50, 40, 25 or 10 GbE by configuration
  or with a breakout cable (up to 128 logical ports)

  - physical.weight-note: 23.5 lb (10.66 kg) fully loaded, QFX5200-32C and QFX5200-32C-L (Table 31)

  - platform.cpu: 1.8 GHz quad-core Intel

  - platform.memory: 16 GB

  - platform.software: Junos OS (32C); Junos OS Evolved (32C-L)

  - platform.storage: two 32 GB SSDs

  - power.power-32c-l-typical-w: 195

  - power.power-envelope: unstated

  - power.power-input-ac: 100 to 240 VAC, 50 to 60 Hz, 4.5 A at 100 to 120 VAC or 2.0 A at 200 to 240
  VAC

  - power.power-input-dc: rated -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum

  - power.power-max-w: 312

  - power.power-typical-w: 200

  - power.redundancy-note: two supplies, load-sharing; one may be removed at a time while the switch runs

  - thermal.fans: five fan modules; the switch runs 30 seconds without thermal shutdown while one is replaced


