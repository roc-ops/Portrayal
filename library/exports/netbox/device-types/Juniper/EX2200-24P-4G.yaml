comments: 'Juniper EX2200-24P is a fixed 1RU Gigabit Ethernet access switch. It has 24 10/100/1000BASE-T
  ports, all with PoE and PoE+ (405 W available), and four built-in 1-Gigabit SFP uplink ports. The front
  carries the 24 jacks in two stacked rows numbered 0 to 23 on the right half of the face (the upper jack
  of a column takes the even number), the four uplinks numbered 0 to 3, two chassis status lamps, four
  port-mode lamps and a Factory Reset/Mode button; the left half is blank. The rear carries the management
  Ethernet port with a USB port under it, the RJ-45 console port, the redundant power system (RPS) port,
  a two-hole earthing terminal, an ESD point, three open exhaust openings (two with fans, the third the
  outlet of the power supply''s own fan) and the AC power cord inlet. The power supply and the fans are
  built into the chassis, so there are no bays. The EX2200-24T is the same front without PoE.


  Configuration `ac`: EX2200-24P-4G - 24 10/100/1000 PoE+ ports and four SFP uplinks, built-in AC supply,
  two built-in fans and a third in the supply, side-to-rear airflow, 405 W for PoE (Table 3).


