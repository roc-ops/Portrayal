comments: 'Juniper EX2300-48MP is a fixed 1RU Multigigabit access switch. It has 48 PoE+ ports, all with
  740 W available: sixteen 100/1000/2500BASE-T ports and thirty-two 10/100/1000BASE-T ports, and six built-in
  10-Gigabit SFP+/SFP uplink ports. The front carries the 48 jacks in three shells of two stacked rows,
  numbered 0 to 47 with the upper jack of a column taking the even number (the middle shell, ports 16
  to 31, is the Multigigabit one), the six uplinks in three stacked pairs numbered 0 to 5, the three system
  lamps (MGT, FAN, PW), the management Ethernet port with the RJ-45 console port under it, and a USB port.
  The rear carries the earthing terminal and the AC power cord inlet. The power supply and the four fans
  are built into the chassis (the fans along the right side panel, moving air from side to side), so there
  are no bays. It has no mini-USB console port and no mode button.


  Configuration `ac`: EX2300-48MP - 48 PoE+ ports (sixteen Multigigabit) and six SFP+/SFP uplinks, built-in
  AC supply and four built-in fans, side-to-side airflow. Table 1, no Virtual Chassis licence.


