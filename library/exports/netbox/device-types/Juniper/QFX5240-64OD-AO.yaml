comments: "Juniper QFX5240-64OD, a 2RU 800G data-centre spine switch running Junos OS Evolved. It has\
  \ 64 OSFP ports (800 GbE) in sixteen columns of four, in four groups of four columns, and two SFP+ ports\
  \ (10 GbE), with a lamp beside each network port. The port side also carries the RJ-45 management, console\
  \ and time-of-day ports, a USB port, the reset button, the three chassis lamps, the 1 PPS and 10 MHz\
  \ connectors. The rear carries two 3000 W AC power supplies stacked at the left and four front-to-back\
  \ fan modules. It ships as one front panel in one AC airflow-out build, and as a spare chassis with\
  \ no supplies and no fan modules. Its sibling with QSFP-DD cages is the QFX5240-64QD.\n\nConfiguration\
  \ `ac-f2b`: QFX5240-64OD-AO: two 3000 W AC supplies (QFX5240-PWR-AC-AO) and four front-to-back fan modules\
  \ (QFX5240-2U-FANAO), airflow out (guide Tables 3 and 6).\n\nDatasheet: Juniper QFX5240 line of Switches\
  \ datasheet (a00150802ENW, Rev. 2, March 2026)\n  https://www.hpe.com/psnow/doc/a00150802enw\n\nFacts\
  \ carried in the model that this schema has no field for:\n- compliance.emc: FCC 47 CFR Part 15; ICES-003;\
  \ BS EN 55032; BS EN 55035; EN 300 386; CISPR 32; CISPR 35; IEC/EN 61000 series; VCCI-CISPR 32; BSMI\
  \ CNS 15936 (datasheet)\n- compliance.nebs: designed to comply with Zone 4 earthquake requirements of\
  \ NEBS GR-63-CORE, Issue 3 (guide Table 17)\n- compliance.safety: UL 60950-1:2007 R10.14; CAN/CSA-C22.2\
  \ No. 60950-1-07 Amd 1:2011 Amd 2:2014; IEC 62368-1:2014 and 2018; EN 62368-1:2014+A11:2017; UL/CSA\
  \ 62368-1:2019; IEC/EN 60825-1 (datasheet)\n- compliance.substances: RoHS; TSCA; POPs; WEEE; REACH;\
  \ SCIP (datasheet)\n- environmental.altitude: no performance degradation to 1828.8 m (6000 ft) at 0\
  \ to 40 C with DAC cables; sea level with optics (guide Table 17)\n- environmental.humidity: 5 to 90\
  \ percent noncondensing, operating\n- environmental.operating-temp: 0 to 40 C (32 to 104 F) (guide Table\
  \ 17)\n- environmental.storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container\n- features.optics-osfp:\
  \ 800 GbE OSFP; ports 1, 2, 5, 6, 9, 10 and so on in the two middle rows take high power optics such\
  \ as 800G-ZR and ZR+ (guide, Port Panel note)\n- features.optics-sfp-plus: two 10 GbE ports\n- lifecycle.eol:\
  \ none-announced\n- management.console: one RJ-45 console port\n- management.oob: one RJ-45 management\
  \ port\n- management.timing-outputs: 1 PPS and 10 MHz clock connectors\n- management.tod: one RJ-45\
  \ time-of-day port\n- management.usb: one USB port\n- performance.breakout-ports: 64 x 800 GbE, 128\
  \ x 400 GbE, 256 x 200 GbE or 256 x 100 GbE; up to 320 ports at mixed speeds (datasheet Table 2)\n-\
  \ performance.forwarding-capacity: 21.2 billion packets per second (datasheet Table 2)\n- performance.osfp-speeds:\
  \ 800 GbE; 400 GbE and lower with breakout (datasheet Table 2)\n- performance.packet-buffer: 165 MB\
  \ (datasheet Table 2)\n- performance.throughput: 51.2 Tbps unidirectional and 102.4 Tbps bidirectional\
  \ (datasheet Table 2)\n- physical.weight-note: 22 kg (48.50 lb) fully loaded without optics (guide Table\
  \ 7, datasheet Table 2)\n- platform.cpu: Intel Ice Lake, 4 cores, 2.2 GHz\n- platform.memory: 32 GB\
  \ (16 GB x 2) DDR4\n- platform.software: Junos OS Evolved\n- platform.storage: two internal 480 GB NVMe\
  \ SSDs\n- platform.switch-chip: Broadcom Tomahawk 5 (BCM78900)\n- power.power-envelope: as-tested\n\
  - power.power-input-ac: 200 to 240 VAC, 50 to 60 Hz, 16 A maximum (guide Table 4); 200 to 277 VAC (guide\
  \ Table 13); 180 to 264 VAC (datasheet)\n- power.power-max-w: 2198\n- power.power-measurement-note:\
  \ Maximum at 40 C ambient with SR optics (datasheet: DR optics) at 100 percent load with IMIX traffic;\
  \ typical at 25 C with DACs at 50 percent load with IMIX traffic, excluding transceivers (guide Table\
  \ 13, datasheet)\n- power.power-typical-w: 613\n- power.redundancy-note: two supplies, 1+1, hot-removable\
  \ and hot-insertable (guide, Component Redundancy)\n- thermal.airflow-note: AO is front-to-back (port-to-FRU,\
  \ airflow out); the guide describes no back-to-front module\n- thermal.fans: four fan modules of two\
  \ rotors, N+1 at rotor level; front-to-back only\n\nDrawing version 0.1.0. A major bump means a slot\
