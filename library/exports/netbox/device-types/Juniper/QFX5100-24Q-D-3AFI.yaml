comments: "Juniper QFX5100-24Q, a 1RU data-centre switch running Junos OS. It has 24 QSFP+ ports. Each\
  \ runs at 40 GbE or as four 10 GbE ports with a breakout cable. Two expansion module bays stand at the\
  \ right of the port panel. The bays hold a QFX-EM-4Q, an EX4600-EM-8F or a cover panel. The rear carries\
  \ two power supplies, five fan modules, the console, the management ports, a USB port, the reset button\
  \ and the four chassis lamps. One front panel ships in eight variants. They have AC or DC supplies,\
  \ airflow front-to-back (AIR OUT) or back-to-front (AIR IN), and two or three management ports.\n\n\
  Configuration `dc-3mgmt-b2f`: QFX5100-24Q-D-3AFI: the 24Q-DC-AFI with the three-port management panel\
  \ (a second SFP port, C0, above C1). Two 650 W DC supplies (JPSU-650W-DC-AFI) and five back-to-front\
  \ fan modules.\n\nDatasheet: QFX5100 Ethernet Switch Datasheet (1000480-022-EN, July 2024)\n  https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/qfx5100-ethernet-switch-datasheet.pdf\n\
