comments: 'Juniper QFX5700, a modular 5RU, 12.8 Tbps data-centre spine and leaf switch running Junos OS
  Evolved. The port side has two Routing and Control Board slots across the top (RCB 0 and RCB 1, one
  board fitted), and under them nine line-card slots, FPC 0 to FPC 7 and an eighth, numbered 8, that the
  guide calls unsupported and that holds a blank. The line cards (QFX5K-FPC-16C, QFX5K-FPC-20Y and QFX5K-FPC-4CD)
  are ordered separately and are not modelled here: every slot shows its blank. A model plate and the
  ESD point stand at the right of the port side. The rear has four 3000 W supplies in a row across the
  top, AC or DC, and two fan trays of four fans each below them. It ships as one front panel in AC and
  DC builds, as the QFX5700E build with its own forwarding engine board, and as a spare chassis.


  Configuration `e-ac`: QFX5700E-BASE-AC: the QFX5700E with AC/HVDC supplies. It has the same front and
  rear as the QFX5700 and differs in its internal forwarding engine board, QFX5700E-FEB in place of QFX5700-FEB,
  which is not drawn on either face (datasheet ordering information; guide Table 18). The datasheet''s
  software scale differs for the E (96,000 MAC addresses against 160,000).


  Facts carried in the model that this schema has no field for:

  - compliance.acoustic: less than 7.2 Bels (EN 300 753)

  - compliance.emc: FCC 47 CFR Part 15, ICES-003, BS EN 55032, BS EN 55035, EN 300 386, CISPR 32, CISPR
  35, IEC/EN 61000 series (datasheet)

  - compliance.materials: RoHS 6/6, China RoHS, REACH, WEEE; power supply efficiency 80 Plus Silver (datasheet)

  - compliance.safety: UL 60950-1, CAN/CSA-C22.2 No. 60950-1, EN 60950-1, IEC 60950-1, UL 62368-1, EN
  60825-1 (datasheet)

  - compliance.seismic: tested and meets GR-63 (guide Table 21); designed for GR-63 Zone 4 (datasheet)

  - compliance.telco: GR-1089-Core Issue 8; Deutsche Telekom 1TR9; BT GS7; CLEI code (datasheet)

  - environmental.altitude: 6000 ft (1828 m)

  - environmental.humidity: 55 to 70 percent non-condensing (guide Table 21; the datasheet prints 5 to
  90 percent)

  - environmental.operating-temp: 0 C to 40 C (datasheet; the guide''s Table 21 prints the same range
  as the non-operating temperature)

  - environmental.storage-temp: -40 C to 85 C shipping and storage (guide Table 21; the datasheet prints
  70 C)

  - features.timing: BITS RJ-45 jack, 10 MHz and PPS SMB connectors in and out, on each Routing and Control
  Board

  - lifecycle.eol: none-announced

  - management.console: CON RJ-45 serial on the Routing and Control Board

  - management.oob: MGMT RJ-45 on the Routing and Control Board, autosensing 10/100/1000 with link and
  activity lamps

  - management.usb: one USB 2.0/3.0 port on the Routing and Control Board

  - performance.forwarding-capacity: 5.3 Bpps

  - performance.latency: 900 ns

  - performance.line-cards: FPC 0 to 7 take QFX5K-FPC-4CD (4 x 400G), QFX5K-FPC-16C (16 x 100G) or QFX5K-FPC-20Y
  (20 x 10/25/50G); at most 144 logical ports

  - performance.packet-buffer: 132 MB shared

  - performance.throughput: up to 12.8 Tbps unidirectional, 25.6 Tbps bidirectional (datasheet Table 1)

  - physical.cable-manager: 6RU with the cable management system fitted (guide, QFX5700 Physical Specifications)

  - physical.enclosure: IP20 (IEC 60529)

  - physical.weight-full-kg: 69.8

  - physical.weight-note: with all FRUs installed (guide Table 5; datasheet Table 2)

  - platform.cpu: Intel Hewitt Lake 6-core x86 at 2.9 GHz in each Routing and Control Board

  - platform.memory: 32 GB DDR4 (two 16 GB DIMMs), expandable to 64 GB

  - platform.operating-system: Junos OS Evolved

  - platform.storage: two 100 GB M.2 SATA or NVMe SSDs per Routing and Control Board

  - platform.switching-silicon: Broadcom Trident 4

  - power.power-envelope: fully-configured

  - power.power-max-scope: eight QFX5K-FPC-16C cards, 40 C, SR optics, 100 percent IMIX load, MACsec on
  (guide Table 9); the 20Y and 4CD builds are 1622 W and 1762 W

  - power.power-max-w: 2271

  - power.power-typical-scope: eight QFX5K-FPC-16C cards, 25 C, 50 percent IMIX load, no MACsec, no transceivers
  (guide Table 9); the 20Y and 4CD builds are 751 W and 1095 W

  - power.power-typical-w: 1259

  - power.psu-input-ac: 200 to 277 VAC rated, 180 to 305 VAC, 47 to 63 Hz; the supplies detect HVDC (190
  to 400 VDC) as well (guide Table 8)

  - power.psu-input-dc: 40 to 72 VDC, rated 48 to 60 VDC; the input current selector sets 60 A (2700 W,
