comments: 'Juniper MX104 - a 3.5RU ETSI-depth modular edge router (EOL) for space- and temperature-constrained
  deployments. Fixed top panel with four 10GbE SFP+ ports, alarm connector, timing block (EXT REF CLOCK
  and ToD RJ45s, 1PPS and 10 MHz SMB in/out); four MIC slots in two rows (1/0, 1/1 above 0/0, 0/1); two
  slim Routing Engines stacked at the lower right and two DC power supplies at the lower left. The fan
  tray is side-mounted; the rear is a plain panel with the earthing plate.


  Configuration `base`: Chassis only - what you spec before deciding what goes in it. The 4 slot bays
  are EMPTY; psus, res are populated. Enough to power on and reach the box, which is the question most
  people ask first and the one `default` used to answer with whatever the drawing happened to be populated
  with.


