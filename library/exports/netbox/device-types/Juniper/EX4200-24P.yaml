comments: "Juniper EX4200-24P - a fixed 1RU Gigabit Ethernet access switch with 24 10/100/1000BASE-T ports,\
  \ all of them Power over Ethernet (IEEE 802.3af, 15.4 W a port). The front carries the 24 jacks in two\
  \ stacked rows, an LCD panel with Menu and Enter buttons, three chassis status lamps and a slot for\
  \ an optional uplink module, which ships covered. The rear carries a fan tray, two Virtual Chassis ports,\
  \ a USB port, a temperature shutdown lamp, the management and console jacks, an ESD point and two power\
  \ supply slots; as shipped it holds one 600 W AC power supply, which stands 2.25 in out of the chassis,\
  \ and a cover panel over the second slot. Air moves side to rear. The EX4200-24PX is the same panel\
  \ with PoE+.\n\nConfiguration `ac`: EX4200-24P as shipped - one 600 W AC power supply in slot 0 with\
  \ a cover panel over slot 1, the fan tray, and the uplink slot covered. Side-to-rear airflow. The datasheet\
  \ also orders the Trade Agreements Act build EX4200-24P-TAA, the same hardware.\n\nDatasheet: EX4200\
  \ Ethernet Switch with Virtual Chassis Technology Datasheet (Juniper Networks, 1000215-026-EN, Feb 2019)\n\
  \  https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex4200-ethernet-switch-with-vitual-chassis-technology.pdf\n\
