comments: "Juniper EX9208, an 8 U modular Ethernet switch of the EX9200 family that runs Junos OS. It\
  \ is built on the MX480 chassis. Eight horizontal slots sit under the craft interface: line card slots\
  \ 5 down to 0, then Switch Fabric slots SF1 and SF0. Each Switch Fabric module carries a Routing Engine.\
  \ Four power supply bays sit across the top of the rear, with the air filter and the fan tray at the\
  \ rear sides. The EX9200 line cards are a family of their own and are not modelled: their slots show\
  \ blank panels.\n\nConfiguration `base3a-ac`: EX9208-BASE3A-AC: one EX9200-SF2 module with one EX9200-RE,\
  \ one fan tray, one air filter kit and three 2520 W AC supplies. A cover panel fills the empty Switch\
  \ Fabric slot.\n\nRack mounting positions: flush (as shipped), mid (\"center-mount\").\n\nDatasheet:\
  \ EX9200 Ethernet Switch Datasheet (1000432-022-EN, Aug 2022)\n  https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex9200-ethernet-switch-datasheet.pdf\n\
