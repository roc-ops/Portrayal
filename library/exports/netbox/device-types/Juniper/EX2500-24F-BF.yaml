comments: 'Juniper EX2500-24F, a fixed 1RU 10 GbE top-of-rack switch with 24 SFP+ ports. The front carries
  the 24 ports in six gangs of four, four system lamps, two management jacks, a mini-USB serial console
  and a reset button. The rear carries two AC power inlets beside a vented panel. The two supplies and
  six fans are built in, so there are no bays. One panel serves both models: the -FB moves air front to
  back and the -BF back to front.


  Configuration `bf`: EX2500-24F-BF: the same panels with back-to-front airflow, so the ports face the
  hot aisle (guide Table 12 and Table 15).


  Facts carried in the model that this schema has no field for:

  - compliance.emc: FCC Part 15 Class A, EN 55022 Class A, VCCI Class A, ICES-003, AS/NZS CISPR 22 Class
  A

  - environmental.acoustic-noise: under 65 dB

  - environmental.altitude: 3,050 m operating, 4,573 m storage

  - environmental.humidity: 10 to 90 percent noncondensing operating, 10 to 95 percent storage

  - environmental.operating-temp: 0 to +40 C, +35 C maximum with a fan or supply failed

  - environmental.storage-temp: -20 to +70 C

  - features.optics-sfp-plus: SFP+ 10GBASE-SR and 10GBASE-LR transceivers and 1 m and 3 m direct access
  cables

  - management.console: one RS-232 serial console port, a mini-USB connector with an external cable to
  D9

  - management.oob: two 10/100/1000BASE-T RJ-45 management ports

  - performance.latency: about 700 ns (datasheet)

  - performance.sfp-plus-speeds: 10 GbE or 1 GbE on each SFP+ port (datasheet)

  - performance.throughput: 480 Gbps full duplex, non-blocking on all ports (datasheet)

  - performance.vlans-max: 1024

  - physical.depth-note: 38.1 cm (15.0 in) (Table 12)

  - physical.weight-note: 6.4 kg (14.1 lb) in the guide''s Table 12; 14.9 lb (6.8 kg) in the datasheet

  - power.power-current-max: 2.75 A at 100 VAC; 1.15 A at 240 VAC

  - power.power-envelope: unstated

  - power.power-input-ac: 100 to 240 VAC, 50 to 60 Hz

  - power.power-typical-w: 200

  - power.redundancy-note: two internal 275 W supplies in 1+1, load sharing at about half load each

  - thermal.cooling: six internal fans, not customer replaceable; front-to-back in the -FB and back-to-front
  in the -BF

  - thermal.thermal-output-btu-h: 1100


