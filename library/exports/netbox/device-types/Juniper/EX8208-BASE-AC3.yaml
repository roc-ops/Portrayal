comments: "Juniper EX8208, the 14 U end-of-life modular Ethernet switch of the EX8200 family. Everything\
  \ is on the front. Eight horizontal line card slots (0 to 7) are split around three control slots, SRE0,\
  \ SF and SRE1; the Switch Fabric and Routing Engine (SRE) modules and the Switch Fabric (SF) module\
  \ sit between line card slots 3 and 4. A vertical fan tray runs down the left of the front and carries\
  \ the slot numbers; six power supply slots (PSU 0 to PSU 5) run across the bottom, and the LCD panel,\
  \ its Menu and Enter buttons, the ALM, SYS and MST lamps and the ESD point are in a header plate across\
  \ the top. Cooling is side to side. The base order ships one SRE module, the SF module, two AC supplies\
  \ and the cover panels; the redundant orders two SRE modules and six AC supplies or four DC supplies.\
  \ Line cards are ordered separately and are not modelled here: every line card slot shows its cover\
  \ panel.\n\nConfiguration `base-ac3`: EX8208-BASE-AC3: the base order with two 3000 W AC power supplies\
  \ (EX8200-PWR-AC3K) in place of the 2000 W ones.\n\nDatasheet: Juniper EX8208 Ethernet Switch Datasheet\
  \ (1000261-022-EN, June 2015)\n  https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex8208-ethernet-switch.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- environmental.altitude-max: 10,000\
