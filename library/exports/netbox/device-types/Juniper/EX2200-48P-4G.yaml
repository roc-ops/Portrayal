comments: 'Juniper EX2200-48P is a fixed 1RU Gigabit Ethernet access switch. It has 48 10/100/1000BASE-T
  ports, all with PoE and PoE+ (405 W available), and four built-in 1-Gigabit SFP uplink ports. The front
  carries the 48 jacks in two stacked rows numbered 0 to 47 (the upper jack of a column takes the even
  number), the four uplinks numbered 0 to 3, two chassis status lamps, four port-mode lamps and a Factory
  Reset/Mode button. The rear carries the management Ethernet port with a USB port under it, the RJ-45
  console port, the redundant power system (RPS) port, a two-hole earthing terminal, an ESD point, three
  open exhaust openings (two with fans, the third the outlet of the power supply''s own fan) and the AC
  power cord inlet. The power supply and the fans are built into the chassis, so there are no bays. The
  EX2200-48T is the same front without PoE.


  Configuration `ac`: EX2200-48P-4G - 48 10/100/1000 PoE+ ports and four SFP uplinks, built-in AC supply,
  two built-in fans and a third in the supply, side-to-rear airflow, 405 W for PoE (Table 3).


