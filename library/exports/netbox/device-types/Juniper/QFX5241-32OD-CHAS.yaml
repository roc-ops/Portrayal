comments: 'Juniper QFX5241-32OD, a 1RU 800G data-centre switch running Junos OS Evolved. It has 32 OSFP
  ports (800 GbE) in sixteen columns of two, in four groups of four columns, and two SFP28 ports side
  by side, with a pair of lamps above each column. The port side also carries the RJ-45 management and
  console ports, a USB Type-C port, the reset button and the three chassis lamps. The rear carries two
  2400 W AC power supplies at its two ends and seven front-to-back fan modules between them. It ships
  as one front panel in one AC airflow-out build, and as a spare chassis with no supplies and no fan modules.
  Its 2RU relatives with 64 ports are the QFX5241-64OD and QFX5241-64QD.


  Configuration `chas`: QFX5241-32OD-CHAS, the spare chassis, shipped without power supplies or fan modules
  ("Spare chassis without PSUs and fans", Table 5). The supply and fan bays are shown open.


