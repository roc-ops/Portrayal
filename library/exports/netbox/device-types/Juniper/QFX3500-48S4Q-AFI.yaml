comments: 'Juniper QFX3500-48S4Q, an end-of-life 1RU data-centre switch running Junos OS as a standalone
  switch, a member of a QFX Virtual Chassis or a Node device in a QFabric system. It has 48 SFP+ access
  ports and 4 QSFP+ uplink ports. An access port takes 10 GbE; ports 6 to 41 also take 1 GbE SFP optics,
  and ports 0 to 5 and 42 to 47 also take 2, 4 or 8 Gbps Fibre Channel optics. A QSFP+ port runs at 40
  GbE or as four 10 GbE ports. The ports and their lamps are on the port side. The other side carries
  two power supplies, two fan trays and the management board, with the LCD, the console, a USB port and
  the management ports. One chassis ships in three airflow builds, port-to-FRU (AFO) or FRU-to-port (AFI
  and ACR), and takes AC or DC supplies.


  Configuration `ac-b2f`: QFX3500-48S4Q-AFI: two 650 W AC supplies (JPSU-650W-AC-AFI), two fan trays (QFX3500-FANAI)
  and the RJ-45 management board (QFX3500-MB). All have FRU-to-port airflow, which the library calls back-to-front
  (guide Tables 12 and 13). The supplies have blue handles lettered AFI.


  Facts carried in the model that this schema has no field for:

  - environmental.altitude: no performance degradation to 3048 m (10000 ft)

  - environmental.humidity: 5 to 85 percent noncondensing

  - environmental.operating-temp: 0 to 40 C (32 to 104 F) normal operation; -5 to 55 C short term

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container

  - features.fcoe: an FCoE-FC gateway or FCoE transit switch

  - features.optics-qsfp: QSFP+ transceivers, QSFP+ DAC and DAC breakout cables

  - features.optics-sfp-plus: SFP+ transceivers, SFP+ direct attach copper cable, SFP transceivers in
  ports 6 to 41, Fibre Channel SFP+ in ports 0 to 5 and 42 to 47

  - features.qfabric: a Node device, connected to a QFX3008-I or QFX3600-I Interconnect device by the
  uplink ports

  - features.virtual-chassis: up to 10 switches with QFX3500, QFX3600, QFX5100 and EX4300 members; a Virtual
  Chassis Fabric leaf

  - lifecycle.eol: announced

  - lifecycle.eol-announcement: https://support.juniper.net/support/?p=qfx3500

  - management.console: RJ-45 console port (CON)

  - management.lcd: an LCD showing the host name and the number of active alarms

  - management.oob: management ports C0 and C1, 1000BASE-T RJ-45 (RJ-45 board) or 1 Gbps SFP (SFP board),
  with link-speed and activity lamps

  - management.usb: one USB port

  - performance.qsfp-plus-speeds: 40 GbE; or four 10 GbE with a breakout cable (15 10 GbE interfaces by
  default)

  - performance.sfp-plus-speeds: 10 GbE with SFP+ optics; 1 GbE with SFP optics in ports 6 to 41; 2, 4
  or 8 Gbps Fibre Channel in ports 0 to 5 and 42 to 47

  - physical.depth-note: 28 in (71.1 cm) excluding FRU handles and locking levers; 29.2 in (74.2 cm) including
  them (Table 5)

  - physical.weight-note: 30.8 lb (14 kg) with FRUs installed; 23.8 lb (11 kg) without (Table 5)

  - platform.software: Junos OS

  - platform.storage: 8 GB internal flash

  - power.power-dc-max-w: 385

  - power.power-dc-typical-w: 250

  - power.power-envelope: unstated

  - power.power-input-ac: 100 to 127 VAC at 7.8 A or 200 to 240 VAC at 3.8 A, 50 to 60 Hz (Table 25)

  - power.power-input-dc: nominal -48 VDC, operating range -40 to -72 VDC, 7 A maximum (Table 27)

  - power.power-max-w: 365

  - power.power-typical-w: 230

  - power.redundancy-note: one or two supplies; with two installed they are load-sharing and fully redundant

  - thermal.fans: two fan trays of two fan modules, hot-swappable, and two fan modules on the management
  board; the supplies carry their own fans


