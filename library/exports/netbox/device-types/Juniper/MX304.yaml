comments: 'Juniper MX304 Universal Routing Platform - a modular 2RU, 4.8 Tbps Trio 6-based edge router.
  Four half-width front slots take one or two hot-swappable Routing Engines (slot RE 0, and slot RE 1/LMIC2
  which also accepts a third line card) and two or three LMIC16 multi-rate line cards (16x100GbE or 4x400GbE
  each). The rear carries two stacked 2200 W PSUs (AC, DC, or HVAC/DC), a fixed timing strip (1PPS and
  10 MHz SMB in/out, ToD, BITS, and a GM/PTP SFP), three fan modules and the earthing terminal.


  Configuration `base`: Chassis only - what you spec before deciding what goes in it. The 2 slot bays
  are EMPTY; fans, psus, res are populated. Enough to power on and reach the box, which is the question
  most people ask first and the one `default` used to answer with whatever the drawing happened to be
  populated with.


  Facts carried in the model that this schema has no field for:

  - environmental.altitude: no performance degradation to 1800 m

  - environmental.humidity: 5-90 percent noncondensing

  - environmental.operating-temp: 0 C to 40 C

  - environmental.storage-temp: -40 C to 70 C in shipping container

  - features.macsec: inline MACsec on all ports at all speeds

  - features.redundancy: full hardware redundancy - Routing Engines, power supplies and fans

  - features.timing: 1PPS and 10 MHz SMB input and output, ToD and BITS RJ45, GM/PTP SFP (1-GbE/10-GbE);
  BITS and GM/PTP currently reserved for future use per the guide

  - lifecycle.eol: none-announced

  - performance.throughput: 4.8 Tbps system capacity; up to 12x400 Gbps or 48x100 Gbps ports (three LMICs)

  - physical.depth-with-brackets: 782 mm over cable-management brackets, air filter and handles (Table
  22)

  - physical.weight: 32 kg fully loaded (two REs, two LMICs); 16 kg without FRUs (Table 22)

  - platform.asic: Juniper Trio 6 (one YT ASIC per LMIC)

  - power.power-envelope: fully-configured

  - power.power-max-w: 1436

  - power.power-typical-w: 1033


