comments: 'Juniper EX2300-24P is a fixed 1RU Gigabit Ethernet access switch. It has 24 10/100/1000BASE-T
  ports, all with PoE+ and 370 W available, and four built-in 10-Gigabit SFP+/SFP uplink ports. The front
  carries the 24 jacks in two stacked rows numbered 0 to 23, and the upper jack of a column takes the
  even number. It also carries the four uplinks numbered 0 to 3, three status lamps, four port-mode lamps,
  a Factory Reset/Mode button and a mini-USB console port. The rear carries the management Ethernet port
  with a USB port under it, the RJ-45 console port, a two-hole earthing terminal and an ESD point. It
  also carries two exhaust fans and the AC power cord inlet. The power supply and both fans are built
  into the chassis, so there are no bays. The -TAA and -VC part numbers are the same chassis. The EX2300-24T
  is the same front without PoE.


  Configuration `ac`: EX2300-24P - 24 PoE+ ports and four SFP+/SFP uplinks, built-in AC supply and two
  built-in fans, front-to-back airflow. Table 1, no Virtual Chassis licence.


