comments: 'Juniper QFX10002-72Q, a fixed 2RU deep-buffer spine and core switch with 72 QSFP+ ports in
  four rows of 18. Every port runs at 40 GbE by default, 24 of them (every second and sixth cage position
  of each six-port cage) take QSFP28 and run at 100 GbE, and any group of three can be channelized to
  twelve 10 GbE interfaces with breakout cables. The management panel at the right of the front has an
  RJ-45 management port, an RJ-45 console, an SFP management port, an SFP PTP Ethernet port, 1PPS and
  10 MHz timing connectors, a USB port and four status lamps. The rear has four 1600 W power supply bays,
  all filled, three fan modules and an ESD point. Cooling is port-to-FRU (front-to-back) only. The AC,
  the DC and the spare chassis builds are configurations.


  Configuration `ac`: The QFX10002-72Q as shipped (Table 1 and Table 30): four 1600 W AC supplies and
  three fan modules, all with port-to-FRU airflow.


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: Designed to comply with Zone 4 earthquake requirements per NEBS GR-63-CORE, Issue
  3

  - environmental.altitude: no performance degradation to 1828.8 m (6000 ft)

  - environmental.humidity: 5 to 90 percent noncondensing; short term 5 to 93 percent

  - environmental.operating-temp: 0 C to 40 C (32 F to 104 F)

  - environmental.storage-temp: -40 C to 70 C (-40 F to 158 F) in the shipping container

  - features.timing: 1PPS and 10 MHz SMB connectors and a PTP Ethernet SFP port

  - lifecycle.end-of-sale: 2026-01-15

  - lifecycle.end-of-support: 2031-01-15

  - lifecycle.eol: announced

  - lifecycle.eol-announcement: https://support.juniper.net/support/eol/product/qfx_series/

  - management.console: RJ-45 console (CON), RS-232

  - management.oob: MGMT RJ-45 (em0), 10/100/1000BASE-T, and MGMT SFP (em1), 1000BASE-X

  - management.usb: one USB port

  - performance.packet-buffer: deep buffer from hybrid memory cubes (HMC)

  - performance.throughput: 5.76 Tbps and 2 Bpps of forwarding capacity (Q5 ASICs); 288 x 10 GbE, 72 x
  40 GbE or 24 x 100 GbE ports (Table 2)

  - physical.mounting: four-post rack kit in the box; spare kits EX4500-4PST-RMK

  - physical.weight: 31.1 kg (68.6 lb) with four AC supplies and three fan modules fitted; 30.8 kg (67.8
  lb) for the DC build (Table 30)

  - platform.asic: Q5 packet forwarding ASICs with hybrid memory cubes

  - platform.cpu: 2.5-GHz quad-core Intel

  - platform.memory: 16 GB SDRAM

  - platform.storage: two 25 GB SSDs (the hardware inventory text also names a 25 GB NAND flash drive)

  - power.power-envelope: fully-configured

  - power.power-max-w: 1425

  - power.power-typical-w: 1050

  - power.psu-ac-input: 100 to 127 VAC and 200 to 240 VAC at 50 to 60 Hz, 12.9 A at 100-120 VAC (Table
  21); each supply has one input

  - power.psu-dc-input: -48 to -60 VDC rated, -40 to -72 VDC operating range, 40 A maximum; a 40 A breaker
  is recommended

  - power.psu-redundancy: four bays, 2N recommended; one supply at 220 VAC or two at 110 VAC run the 72Q

  - thermal.airflow: port-to-FRU (airflow out, front-to-back); three 80 W fan modules at 150 CFM each,
  and fans in the supplies

  - thermal.heat-dissipation: 3,583 BTU/hr typical and 4,862 BTU/hr maximum (Tables 21 and 25)


