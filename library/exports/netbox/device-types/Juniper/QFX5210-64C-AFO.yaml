comments: 'Juniper QFX5210-64C, a 2RU data-centre spine and leaf switch. It has 64 QSFP28 ports, numbered
  0 to 63 in sixteen columns of four, and two SFP+ ports. The QSFP28 ports run at 100 GbE by default,
  at 40 GbE by transceiver, and at 50, 25 or 10 GbE by channelization. The port side also carries an RJ45
  management port, an RJ45 console port, a USB port, a reset pinhole and four chassis lamps. The FRU side
  carries four fan modules, two power supplies and a two-hole protective earthing terminal. It ships as
  one front panel in several builds: AC or DC supplies, front-to-back (AIR OUT) or back-to-front (AIR
  IN).


  Configuration `ac-afo`: QFX5210-64C-AFO: two 1100 W AC supplies (JPSU-1100W-AC-AFO) and four front-to-back
  fan modules (QFX5210-64C-FANAFO). All carry the label AIR OUT and a Juniper Gold handle (guide Tables
  15 and 17).


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: Designed to comply with Zone 4 earthquake requirements per GR-63, Issue 4

  - environmental.altitude: AFO builds no performance degradation to 1828.8 m (6000 ft); AFI builds none
  at sea level

  - environmental.humidity: 5 to 90 percent noncondensing (up to 93 percent short term)

  - environmental.operating-temp: 0 to 40 C (32 to 104 F)

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container

  - features.channelization: ports 0 to 31 take 4 x 10, 4 x 25 and 2 x 50 GbE breakouts. Ports 32 to 63
  take 2 x 50 GbE before Junos OS 19.1R1. From 19.1R1 on, any port

  - features.optics-qsfp28: 100 GbE QSFP28 and 40 GbE QSFP+ transceivers. DAC and breakout cables (QSFP+
  to SFP+ DACBO, QSFP28 to QSFP+ DACBO). High-wattage optics (above 3.5 W) only in ports 32 to 63 on the
  AFI builds (guide, QFX5210-64C Port Panel Overview and Table 25)

  - features.optics-sfp-plus: 1 GbE or 10 GbE SFP+ transceivers (guide, QFX5210-64C Port Panel Overview)

  - management.console: RJ-45 console port (CON, RS-232)

  - management.oob: RJ45 1000BASE-T management port (em0, MGMT)

  - management.usb: one USB 2.0 port

  - performance.port-speeds: QSFP28 ports 0 to 63 run at 100 GbE by default and at 40 GbE with a QSFP+
  transceiver. They run at 50, 25 or 10 GbE by channelization or breakout cable (up to 128 logical ports).
  The SFP+ ports run at 1 or 10 GbE

  - physical.weight-note: 23.44 lb (10.63 kg) without power supplies and fans, 31.09 lb (14.1 kg) with
  them (Table 26)

  - platform.cpu: 2.2 GHz quad-core Intel Xeon

  - platform.memory: 16 GB

  - platform.software: Junos OS 18.1R1 and later

  - platform.storage: 100 GB SSD

  - power.power-envelope: as-tested

  - power.power-input-ac: 90 to 264 VAC, 50 to 60 Hz, 12 A at 100 VAC or 6 A at 240 VAC

  - power.power-input-dc: rated -48 to -60 VDC, operating range -40 to -72 VDC, 25 A maximum

  - power.power-max-dc-w: 696

  - power.power-max-w: 655

  - power.power-typical-dc-w: 383

  - power.power-typical-w: 357

  - power.redundancy-note: two supplies, 2N, each carrying the whole load; one may be removed at a time
  while the switch runs

  - thermal.fans: four fan modules and the fans in the two supplies; the switch runs 30 seconds without
  thermal shutdown while one fan module is replaced


  Drawing version 0.1.4. A major bump means a slot moved or an id was renamed, so anything cached from
  an earlier export may no longer line up.

  Model maturity: modelled. Every dimension in the source records where it came from.'
