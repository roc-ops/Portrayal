comments: 'Juniper EX2200-24T is a fixed 1RU Gigabit Ethernet access switch. It has 24 10/100/1000BASE-T
  ports without PoE and four built-in 1-Gigabit SFP uplink ports. The front carries the 24 jacks in two
  stacked rows numbered 0 to 23 on the right half of the face (the upper jack of a column takes the even
  number), the four uplinks numbered 0 to 3, two chassis status lamps, four port-mode lamps and a Factory
  Reset/Mode button; the left half is blank. The rear carries the management Ethernet port with a USB
  port under it, the RJ-45 console port, the redundant power system (RPS) port, a two-hole earthing terminal,
  an ESD point, two exhaust fans with a sealed third opening and the AC power cord inlet. The power supply
  and the fans are built into the chassis, so there are no bays. The EX2200-24T-DC is the same chassis
  with a DC supply, whose four-terminal block replaces the AC inlet; it is the dc configuration. The EX2200-24P
  is the same front with PoE.


  Configuration `dc`: EX2200-24T-4G-DC - the same front with a built-in DC supply (Table 3, Table 13,
  Figure 48): a block of four terminals (B-, A-, B+, A+) replaces the AC inlet on the rear. The guide
  gives the same weight (2.7 kg) and says a DC-powered switch provides no PoE, as this model has none.


  Facts carried in the model that this schema has no field for:

