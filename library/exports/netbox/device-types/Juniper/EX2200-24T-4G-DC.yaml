  - features.optics-sfp: hardware guide, Uplink Ports: the four uplink ports take 1-gigabit SFP transceivers,
  fibre or copper, and can be configured as Virtual Chassis ports

  - features.virtual-chassis: up to four EX2200 switches, including EX2200-C, from Junos OS 12.2

  - physical.weight-note: 6 lb (2.7 kg), the same for the EX2200-24T-DC, Table 5

