comments: 'Juniper EX3400-48T, a 1U access switch with 48 10/100/1000BASE-T ports and no PoE. It has four
  SFP or SFP+ uplink ports and a Mini-USB console port on the front. The rear has two QSFP+ uplink ports,
  a management port, an RJ-45 console port, a USB port, two fan modules and two power supply slots. It
  ships with one 150 W AC supply, and a blank panel covers the second slot. The back-to-front EX3400-48T-AFI
  and the DC-powered EX3400-48T-DC have the same front panel, so they are configurations of this device.


  Configuration `dc`: The DC-powered switch (Table 1) - one 150 W JPSU-150-DC-AFO supply in slot 0 and
  a blank panel over slot 1. Airflow is front to back. The front panel is the same.


  Rack mounting positions: flush ("front-mount"; ears level with the face; as shipped), recessed ("2-in.
  recess"; ears 50.8 mm behind the face), rear ("rear-mount").


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: Complies with Zone 4 earthquake requirements per GR-63, Issue 4 (Table 22)

  - environmental.altitude: no performance degradation up to 3048 m (10,000 ft) (Table 22)

  - environmental.humidity: 10 to 85 percent, noncondensing (Table 22)

  - environmental.operating-temp: 0 to 45 C (32 to 113 F) (Table 22)

  - features.macsec: IEEE 802.1AE MACsec on all Gigabit and 10 Gigabit Ethernet ports, 88 Gbps of encryption

  - features.optics-qsfp: the rear uplink ports take QSFP+ transceivers. The supported list is in Juniper''s
  Hardware Compatibility Tool, which the guide names and which is not held here

  - features.optics-sfp-plus: the front uplink ports take SFP and SFP+ transceivers, singly or mixed.
  The supported list is in Juniper''s Hardware Compatibility Tool, which the guide names and which is
  not held here

  - features.uplink-ports: four SFP or SFP+ ports on the front and two QSFP+ ports on the rear

  - features.virtual-chassis: up to 10 switches. The QSFP+ ports are Virtual Chassis ports by default

  - lifecycle.eol: none-announced

  - management.console: RJ-45 console on the rear panel and Mini-USB Type-B console on the front, both
  labelled CON

  - management.oob: management Ethernet RJ-45 on the rear panel, with a Link/Activity lamp and a Status
  lamp

  - management.usb: one USB port on the rear panel

  - physical.depth-with-power-supply: 382.4 mm (15.05 in.) with a power supply installed (Table 3)

  - physical.weight: 4.64 kg (10.23 lb) without power supplies or fan modules (Table 3)

  - physical.weight-fru: JPSU-150-AC-AFO 0.65 kg, fan module 0.72 kg (Table 3)

  - physical.width-with-brackets: 482 mm (19 in.) with the mounting brackets attached (Table 3)

  - platform.first-junos-release: 15.1X53-D50 (Table 1)

  - power.power-current-max: 3 A at 100 VAC and 1.5 A at 240 VAC (Table 19)

  - power.power-envelope: unstated

  - power.power-input-ac: 100 through 240 VAC, 50 or 60 Hz (Table 19)

  - power.power-max-w: 120


