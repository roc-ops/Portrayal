comments: 'Juniper EX2200-C-12T is the compact, fanless member of the EX2200 line without PoE: a 1RU-high
  Gigabit Ethernet access switch 269 mm wide with 12 10/100/1000BASE-T ports and two dual-purpose uplink
  ports, each an RJ-45 port beside an SFP port of which only one is active at a time. The front carries
  the 12 jacks in two stacked rows numbered 0 to 11 (the upper jack of a column takes the even number),
  the two dual-purpose uplinks numbered 0 and 1, a USB port, the management Ethernet port with the RJ-45
  console port above it, a mini-USB console port, two chassis status lamps, three port-mode lamps and
  a Factory Reset/Mode button. The rear carries the earthing terminal, an ESD point and the AC power cord
  inlet; there are no fans and no heatsink. The power supply is built into the chassis, so there are no
  bays. The EX2200-C-12P is the same front with PoE+.


  Configuration `ac`: EX2200-C-12T-2G - 12 10/100/1000 ports without PoE and two dual-purpose uplinks,
  built-in AC supply, fanless (Table 3).


