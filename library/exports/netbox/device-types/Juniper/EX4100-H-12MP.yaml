comments: 'Juniper EX4100-H-12MP is a hardened (industrial), fanless multigigabit PoE++ access switch
  in a small upright box, 111.7 mm wide and 152.4 mm high, with twelve RJ-45 ports (four 100M/1/2.5 Gbps
  and eight 10M/100M/1 Gbps, all PoE++ at 90 W by default), two 1/10 Gbps SFP/SFP+ MACsec uplink ports
  and two 1/10 Gbps SFP/SFP+ Virtual Chassis ports. Everything is on the front: the jacks in two blocks,
  the cages in a column, a management Ethernet port with a USB Type-A port and an RJ-45 console port in
  one housing, a USB Type-C console port, two plug-in PSU connectors, a plug-in dry contact alarm connector,
  the chassis and port mode lamps, a Mode button, a reset pinhole, an ESD point and a two-hole protective
  earthing terminal. It is powered by one or two external 340 W AC or DC supplies, which are separate
  boxes wired to the PSU connectors, so the chassis has no power supply bay and no fan. The rear is a
  vented plate between two plates with mounting holes. The guide''s default mounting is desktop or any
  flat surface in a certified cabinet; DIN rail, magnet, wall and two-post rack kits are orderable.


  Configuration `std`: EX4100-H-12MP as shipped (Table 8 and the packing list, Table 65): the switch with
  its two PSU connectors and alarm connector preassembled, one external 340 W AC or DC supply in the box
  (specific to the SKU) and no fan. The supplies are external and are not modelled.


  Desktop unit; not rack-mounted.


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: tested for Zone 4 earthquake safety

  - environmental.altitude: no performance degradation up to 15000 ft (4572 m)

  - environmental.humidity: 5 to 95 percent, noncondensing

  - environmental.operating-temp: -40 to 60 C in a sealed enclosure, -40 to 70 C in a ventilated enclosure
  (40 LFM) and -40 to 75 C in a blower-equipped enclosure (200 LFM), up to 15000 ft; safety certified
  at 60 C

  - environmental.storage-temp: -40 to 85 C in the shipping container

  - features.dry-contact-alarm: two alarm inputs (5 V threshold) and one alarm relay output (NO, COM,
  NC), Table 4

  - features.macsec: the four 2.5 Gbps ports and the two uplink ports are MACsec capable

  - features.optics-sfp-plus: the two uplink and two Virtual Chassis cages take 1 Gbps SFP and 10 Gbps
  SFP+ transceivers; Tables 44 to 53 list the industrial-grade optics against the ambient they allow.
  The supported list is in Juniper''s Hardware Compatibility Tool, which the guide names and which is
  not held here

  - features.virtual-chassis: up to 10 EX4100, EX4100-F and EX4100-H switches; the two VCP cages are the
  Virtual Chassis ports (HiGig or HGoE mode) and the two uplink cages support HGoE only. A 10GBASE-T transceiver
  cannot form a Virtual Chassis in a VCP

