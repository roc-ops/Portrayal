comments: 'Juniper QFX5230-64CD, a 2RU 400G data-centre leaf and spine switch running Junos OS Evolved.
  It has 64 QSFP-DD ports (400, 200, 100, 50, 40, 4x25 or 4x10 GbE) in two bands of sixteen stacked pairs
  and two SFP+ ports (10 GbE), all on the port side with a lamp beside each network port. The port side
  also carries the RJ-45 management and console ports, a USB port, the reset button, the three chassis
  lamps, the 10 MHz and 1 PPS output connectors and the ESD point. The rear carries four fan modules at
  the left and two power supplies stacked at the right. It ships as one front panel in four power and
  airflow variants, AC or DC supplies with front-to-back (AIR OUT) or back-to-front (AIR IN) airflow,
  and as a spare chassis with no supplies and no fan modules.


  Configuration `dc-b2f`: QFX5230-64CD-D-AFI: two 2400 W DC supplies (JNP-2400W-DC-AFI) and four back-to-front
  fan modules. Each supply has a single feed, so feeds A and B go one to each.


  Facts carried in the model that this schema has no field for:

  - compliance.emc: FCC 47 CFR Part 15; ICES-003; BS EN 55032; BS EN 55035; EN 300 386; CISPR 32; CISPR
  35; IEC/EN 61000 series (guide, Compliance Statements for EMC Requirements)

  - compliance.nebs: designed to comply with Zone 4 earthquake requirements of NEBS GR-63-CORE, Issue
  3 (guide Table 24)

  - compliance.safety: UL 60950-1:2007 R10.14; CAN/CSA-C22.2 No. 60950-1-07 Amd 1:2011 Amd 2:2014; IEC
  62368-1:2014 and 2018; EN 62368-1:2014+A11:2017; UL/CSA 62368-1:2019; IEC/EN 60825-1 (guide, Compliance
  Statements)

  - environmental.altitude: no performance degradation to 1828.8 m (6000 ft) at 0 to 40 C for AFO; for
  AFI the figure is 0 ft (guide Table 24)

  - environmental.humidity: 5 to 90 percent noncondensing, operating

  - environmental.operating-temp: 0 to 40 C (32 to 104 F) for AFO and AFI (guide Table 24)

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container

  - features.optics-qsfp-dd: 400 GbE QSFP-DD optics; 400G-ZR and 400G-ZRM only in ports 33 to 63 (the
  odd ones of the lower band)

  - features.optics-sfp-plus: two SFP+ ports at 10 GbE

  - features.ptp: 10 MHz and 1 PPS clock connectors

  - lifecycle.eol: none-announced

  - management.console: one RJ-45 console port

  - management.oob: one RJ-45 management port, 10/100/1000 Mbps

  - management.timing-outputs: 10 MHz and 1 PPS SMB connectors

  - management.usb: one USB 2.0 port

  - performance.breakout-ports: up to 64 x 400 GbE, 128 x 200 GbE, 256 x 100 GbE, 256 x 40 GbE, 256 x
  25 GbE or 256 x 10 GbE (guide, QFX5230-64CD Switch Description)

  - performance.qsfpdd-speeds: 400, 200, 100, 50, 40 GbE, 4 x 25 GbE or 4 x 10 GbE per port (guide, Port
  Panel overview)

  - performance.throughput: 25.6 Tbps (guide, QFX5230-64CD Switch Description)

  - physical.weight-note: 55 lb (25 kg) with power supplies and fans installed (guide Table 8)

  - platform.cpu: Intel Hewitt Lake D-1637, 6 cores

  - platform.software: Junos OS Evolved

  - platform.storage: two internal 100 GB SSDs

  - platform.switch-chip: Broadcom Tomahawk 4 (BCM56990)

  - power.power-dc-max-w: 1446

  - power.power-dc-typical-w: 487

  - power.power-envelope: as-tested

  - power.power-input-ac: 180 to 305 VAC, 50 to 60 Hz (guide Table 4)

  - power.power-input-dc: rated -48 to -60 VDC, operating -40 to -72 VDC (guide Table 18)

  - power.power-max-w: 1396

  - power.power-measurement-note: Maximum at 40 C ambient with SR optics at 100 percent load with IMIX
  traffic; typical at 25 C with DACs at 50 percent load with IMIX traffic, excluding transceivers (guide
  Table 13)

  - power.power-typical-w: 498

  - power.redundancy-note: two supplies, 1+1, hot-removable and hot-insertable while the second supply
  is installed

  - thermal.airflow-note: AFO is front-to-back (port-to-FRU); AFI is back-to-front (FRU-to-port); no mixing
  of fans and supplies of different direction

  - thermal.fans: four fan modules of two rotors, 7+1 at rotor level; the switch runs 120 seconds without
  thermal shutdown while one module is replaced


