comments: "Juniper EX8216, the 21 U end-of-life modular Ethernet switch of the EX8200 family. The front\
  \ has two Routing Engine slots (RE0, RE1) and sixteen horizontal line card slots (0 to 15) in two banks\
  \ of nine, each bank beside one of the two vertical fan trays on the left, which carry the slot labels;\
  \ six power supply slots (PSU 0 to PSU 5) run across the bottom and the LCD panel, its Menu and Enter\
  \ buttons, the ALM, SYS and MST lamps and the ESD point are in a header plate across the top. The rear\
  \ carries the eight Switch Fabric (SF) modules in slots SF7 to SF0 and exhausts the supplies' air at\
  \ the bottom. Cooling is side to side and front to side. The base order ships one RE module, the eight\
  \ SF modules, two 3000 W AC supplies and the cover panels; the redundant orders two RE modules and six\
  \ AC supplies or four DC supplies. Line cards are ordered separately and are not modelled here: every\
  \ line card slot shows its cover panel.\n\nConfiguration `chas`: EX8216-CHAS-S, the spare chassis with\
  \ midplane (datasheet ordering table). It ships without RE modules, SF modules, fan trays or supplies,\
  \ which are ordered separately and may be all AC or all DC; every bay is shown open.\n\nDatasheet: Juniper\
  \ EX8216 Ethernet Switch Datasheet (1000283-021-EN, June 2015)\n  https://www.juniper.net/assets/us/en/local/pdf/datasheets/1000283-en.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- environmental.altitude-max: 10,000\
  \ ft (3048 m)\n- environmental.humidity: 10-85 percent noncondensing\n- environmental.operating-temp:\
  \ 0 C to 40 C\n- lifecycle.eol: announced\n- lifecycle.eol-announcement: https://www.juniper.net/support/pdf/eol/lod-q22017.pdf\n\
  - physical.weight-base-kg: 123\n- physical.weight-chassis-kg: 73\n- physical.weight-max-kg: 220\n- physical.weight-note:\
