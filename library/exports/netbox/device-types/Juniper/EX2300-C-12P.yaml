comments: 'Juniper EX2300-C-12P is the compact, fanless member of the EX2300 line: a 1RU-high Gigabit
  Ethernet access switch 279 mm wide with 12 10/100/1000BASE-T ports, all with PoE+ and 124 W available,
  and two built-in 10-Gigabit SFP+/SFP uplink ports. The front carries the 12 jacks in two stacked rows
  numbered 0 to 11 (the upper jack of a column takes the even number), the two uplinks numbered 0 and
  1, a USB port, the management Ethernet port with the RJ-45 console port under it, a mini-USB console
  port, three status lamps, four port-mode lamps, a Factory Reset/Mode button and an ESD point. The rear
  carries the earthing terminal, a heatsink and the AC power cord inlet; there are no fans. The power
  supply is built into the chassis, so there are no bays. It ships standing on its rubber feet; it can
  also be fixed under a desk, to a wall or a ferrous surface, or on two posts of a rack with the separately
  orderable brackets. The -TAA and -VC part numbers are the same chassis. The EX2300-C-12T is the same
  front without PoE.


  Configuration `ac`: EX2300-C-12P - 12 PoE+ ports and two SFP+/SFP uplinks, built-in AC supply, fanless.
