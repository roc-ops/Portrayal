  - performance.throughput: 7.5 Tbps-class (datasheet family table)

  - physical.weight: up to 163.5 kg maximum configuration (guide rack text, five per 48U rack at 371 kg
  combined for two - transcribed loosely; see gaps)

  - power.base-system-w: 40

  - power.cooling-system-w: 160 W high-capacity (110 W normal); dedicated PSU tap


