comments: 'Juniper MX480 Universal Routing Platform - an 8RU, 7.5 Tbps-class modular edge router with
  horizontal cards. Eight slots under the craft interface: DPC/MPC slots 5 down to 0 and SCB slots 1 and
  0, with the Routing Engines seated inside the SCBs. Up to four power supplies across the rear top, fan
  tray and air filter vertical at the rear sides.


  Configuration `base`: Chassis only - what you spec before deciding what goes in it. The 8 slot bays
  are EMPTY; cooling, craft, psus are populated. Enough to power on and reach the box, which is the question
  most people ask first and the one `default` used to answer with whatever the drawing happened to be
  populated with.


  Facts carried in the model that this schema has no field for:

  - environmental.humidity: 5-90 percent noncondensing

  - environmental.operating-temp: 0 C to 40 C

  - environmental.storage-temp: -40 C to 70 C

