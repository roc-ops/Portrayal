comments: 'Juniper QFX5120-32C, a 1RU data-centre leaf switch running Junos OS. It has 32 QSFP28 ports
  (100 or 40 GbE, channelizable) and 2 SFP+ ports (10 GbE). The ports and their lamps are on the port
  side. So are the RJ-45 management and console ports, a USB port, the chassis ID lamp and the reset button.
  The rear carries two power supplies, one at each end, and six fan modules between them. It ships as
  one front panel in four power and airflow variants. They have AC or DC supplies, with airflow front-to-back
  (F2B) or back-to-front (B2F).


  Configuration `dc-b2f`: QFX5120-32C-DC-AFI: two 650 W DC supplies (QFX520048Y-DPSU-AI) and six back-to-front
  fan modules (QFX520048Y-FAN-AI). The front panel is the same (guide Tables 7 and 36).


  Facts carried in the model that this schema has no field for:

  - environmental.altitude: no performance degradation to 5000 m (16,404 ft)

  - environmental.humidity: 5 to 90 percent noncondensing

  - environmental.operating-temp: 0 to 40 C (32 to 104 F) normal operation

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container

  - features.optics-qsfp28: 100 GbE or 40 GbE; channelizes to 4 x 25 GbE, 4 x 10 GbE or 2 x 50 GbE (guide
  Table 5)

  - features.optics-sfp-plus: 10 GbE

  - features.virtual-chassis: up to 2 switches of the same model; any non-channelized QSFP28 port (0 to
  31) can be a virtual chassis port, from 20.3R1

  - lifecycle.eol: none-announced

  - management.console: RJ-45 console port (CON)

  - management.oob: one RJ-45 management port (MGMT) on the port side, with a link activity lamp

  - management.usb: one USB port

  - performance.aggregate-throughput: 6.4 Tbps, bidirectional (Table 4)

  - performance.qsfp28-port-31: 100, 40 or 2 x 50 GbE only, because its lanes are shared with the 10 GbE
  SFP+ port (Table 5)

  - performance.qsfp28-speeds: 100 or 40 GbE; ports 0 to 30 channelize to 4 x 25, 4 x 10 or 2 x 50 GbE

  - performance.sfp-plus-speeds: 10 GbE

  - physical.depth-note: 20.27 in (51.5 cm) excluding the fan and power supply handles (Table 9)

  - physical.weight-note: 21.12 lb (9.58 kg) with two power supplies and six fan modules installed (Table
  9)

  - platform.cpu: 2.2 GHz quad-core Intel

  - platform.memory: 16 GB

  - platform.software: Junos OS, first release 19.1R1

  - platform.storage: 64 GB SSD

  - power.power-dc-max-w: 493

  - power.power-dc-typical-w: 231

  - power.power-envelope: unstated

  - power.power-input-ac: 100 to 240 VAC, 50 to 60 Hz, 6 A at 100 VAC and 3.8 A at 240 VAC

  - power.power-input-dc: rated -48 to -60 VDC, operating range -40.8 to -72 VDC, 16 A maximum

  - power.power-max-w: 365

  - power.power-typical-w: 173

  - power.redundancy-note: two supplies, load-sharing and fully redundant; both should be installed

  - thermal.fans: six fan modules, 5+1; the switch runs 30 seconds without thermal shutdown while one
  is replaced


