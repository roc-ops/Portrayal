comments: 'Juniper QFX10008 - the 13RU, eight-slot modular chassis of the QFX10000 family. Two QFX10000-RE
  Routing and Control Boards stack under the badge strip beside the status lamp panel. Eight full-width
  line-card slots (0 to 7, top to bottom) fill the front below them. The rear is a six-high power supply
  stack (PSU 0 to 5) with the earthing terminal and ESD point below it. Two tall fan trays stand beside
  it and cover the switch interface boards. Cooling is front-to-back (port-to-FRU, airflow out). Line
  cards are ordered separately and are not modelled here.


  Configuration `redund-h`: QFX10008-REDUND-H (guide Table 2, datasheet): the redundant build with six
  JNP10K-PWR-AC2 supplies, which take AC, high-voltage AC or high-voltage DC. The guide''s table lists
  two RCB/SSD covers for it although two RCBs are fitted; no cover is drawn.


  Facts carried in the model that this schema has no field for:

  - compliance.seismic: Designed to meet GR-63 Zone 4 earthquake requirements

  - environmental.altitude: up to 3,048 m (10,000 ft)

  - environmental.humidity: 5 to 90 percent noncondensing operating, 5 to 95 percent nonoperating

  - environmental.operating-temp: 0 C to 40 C (32 F to 104 F)

  - environmental.storage-temp: -40 C to 70 C (-40 F to 158 F)

  - management.console: RJ-45 console (CON) on each RCB

  - management.oob: MGMT RJ-45 (em0), 10/100/1000BASE-T, and MGMT SFP (em1), on each RCB

  - management.usb: one USB 2.0 port on each RCB

  - performance.ports-max: 1,152 x 10GbE, 288 x 40GbE or 240 x 100GbE (datasheet Table 1, with eight 30C
  cards)

  - performance.throughput: up to 48 Tbps (datasheet Table 1; the guide gives a net switching capacity
  of 42 Tbps with six SIBs); 7.2 Tbps per slot

  - physical.weight-base-kg: 127

  - physical.weight-empty-kg: 65.86

  - physical.weight-redundant-kg: 146.06

  - platform.cpu: Intel quad-core 2.5 GHz

  - platform.fabric: six switch interface boards, five required and the sixth for n+1; midplane-less

  - platform.memory: 32 GB SDRAM

  - platform.storage: 50 GB onboard SSD, plus an optional SATA SSD of 50 GB or 100 GB in the RCB

  - power.power-envelope: bare

  - power.power-max-w: 2500

  - power.power-typical-scope: datasheet - base system, line cards not included; redundant system 1,765
  W typical and 2,877 W reserved

  - power.power-typical-w: 1517

  - thermal.airflow: port-to-FRU (airflow out, front-to-back); two fan trays of 1437 CFM each at full
