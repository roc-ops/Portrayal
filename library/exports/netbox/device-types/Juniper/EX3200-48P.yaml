comments: 'Juniper EX3200-48P - a fixed 1RU Gigabit Ethernet access switch with 48 10/100/1000BASE-T ports,
  all of them Power over Ethernet. The front carries the 48 jacks in two stacked rows, an LCD panel with
  Menu and Enter buttons, three chassis status lamps and a slot for an optional uplink module, which ships
  covered. The rear carries the management and console jacks, a USB port, a temperature shutdown lamp,
  an ESD point, the earthing terminal, a fan tray and one power supply slot holding a 930 W AC supply.
  Air moves side to rear.


  Configuration `ac`: EX3200-48P as shipped - one 930 W AC power supply (EX-PWR-930-AC) in the supply
  slot, the fan tray, and the uplink slot covered. Side-to-rear airflow.


  Facts carried in the model that this schema has no field for:

  - compliance.emc: FCC 47 CFR Part 15 Class A, EN 55022 Class A, ICES-003, VCCI Class A

  - compliance.nebs: NEBS certified except the EX3200-24P and EX3200-48P (datasheet compliance section)

  - compliance.safety: UL 60950-1, C-UL, TUV/GS EN 60950-1, CB IEC 60950-1

  - environmental.acoustic-noise: 55.0 dBA with the 930 W AC supply (datasheet, ISO 7779 at 23 C)

  - environmental.altitude: up to 3048 m operating (10,000 ft); 4877 m non-operating

  - environmental.humidity: 10 to 85 percent noncondensing operating; 0 to 95 percent non-operating

  - environmental.operating-temp: 0 to 45 C (32 to 113 F)

  - environmental.storage-temp: -40 to 70 C

  - features.poe: IEEE 802.3af on all 48 ports, 15.4 W each, up to 18.6 W with enhanced PoE

  - features.uplink-module: one slot; EX-UM-4SFP, EX-UM-2X4SFP or the XFP module (not part of the shipping
  configuration)

  - management.console: RJ-45 on the rear

  - management.lcd: 2 lines of 16 characters with Menu and Enter buttons

  - management.oob: RJ-45 management port on the rear, 100 Mbps full duplex, with link/activity and status
  lamps

  - management.usb: one USB port on the rear

  - performance.airflow-cfm: 23.5 (datasheet)

  - performance.mac-addresses-max: 32000

  - performance.switching-capacity: 136 Gbps packet switching, 64-byte packets (datasheet)

  - performance.throughput: 101 Mpps wire speed (datasheet)

  - performance.vlans-max: 4096

  - physical.datasheet-dimensions: 17.41 x 1.72 x 16.43 in (44.21 x 4.32 x 41.73 cm) W x H x D, and 18.8
  in (47.8 cm) deep with a 600 W or 930 W supply; the guide''s Table 5 is used for the envelope

  - physical.depth-no-psu: 431.8 mm (17 in, 43.18 cm) with no supply, with the 320 W AC or with the 190
  W DC supply (guide Table 5)

  - physical.weight: 16.8 lb (7.6 kg) with the 930 W AC supply (datasheet); 15-17 lb (6.8-7.7 kg) with
  one supply (guide Table 5)

  - physical.weight-chassis-parts: 320 W AC and 190 W DC supplies 2.5 lb (1.1 kg); 600 W and 930 W AC
  supplies 3.1 lb (1.4 kg) (guide Table 5)

  - physical.width-with-brackets: 482 mm (19 in, 48.2 cm) with the mounting brackets attached

  - platform.cpu: 600 MHz PowerPC

  - platform.memory: 512 MB DRAM

  - platform.storage: 1 GB flash

  - power.poe-budget-w: 740

  - power.poe-ports: 48

  - power.psu-redundancy: none; the guide says the supply "is not redundant"

  - thermal.airflow-direction: side to rear (guide, Figure 15)


