  \ and breakers\n- power.input-ac: three-phase delta, 200-240 V, 60 A (48 A derated), 17.3 kVA (drawing\
  \ note 1)\n- power.input-cord: fixed\n- power.input-current-a: 48\n- power.input-phase: three\n- power.input-plug:\
  \ other\n- power.input-wiring: delta\n- power.plug-rating-a: 60\n\nDrawing version 0.1.0. A major bump\
