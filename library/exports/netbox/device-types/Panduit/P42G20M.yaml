comments: "Panduit P42G20M G5 intelligent rack PDU, monitored and switched per outlet, 0U: a 1780 mm strip\
  \ for a cabinet's vertical channel. It has a fixed 3 m cord ending in an IEC 60309 3P+E 9h 60 A plug,\
  \ three-phase delta, 200-240 V. It has 42 outlets in two rows: 21 C13/C15 combination sockets and 21\
  \ C13/C15/C19 combination sockets, in six blocks. Each block is on a 20 A double-pole breaker across\
  \ two of the three lines. A controller with a display, indicators, five RJ45 jacks and a USB-A port\
  \ sits between the two halves.\n\nConfiguration `base`: The PDU as it ships, the controller in its place.\n\
  \nMounts on the side of a rack's upright, beside the rack; occupies no rack unit.\n\nPDU class: managed\
  \ (metering-scope outlet, outlet-switching true).\n\nInput rating: three-phase delta, 48 A input (60\
  \ A plug).\n\nDatasheet: Panduit G5 Intelligent Power Distribution Units (iPDUs) specification sheet\
  \ FBSP28-WW-ENG 4/2024\n  https://www.panduit.com/PanProductResource/en/P42G20M/SpecificationSheets.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- management.metering-scope: outlet\n\
  - management.network-module: G5 controller\n- management.outlet-switching: true\n- physical.length-mm:\
