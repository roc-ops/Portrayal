comments: "Rittal PDU basic, three-phase, 0U. A 1094 mm extruded aluminium strip, 44 mm wide and about\
  \ 72 mm deep, that hangs on two push-button attachments on its back. It hands a 400 V three-phase feed\
  \ (a 3 m fixed cord with a 16 A CEE plug, 11 kW) on to 27 unswitched outlets. They sit in three phase\
  \ groups of nine. Each group has six IEC C13, one IEC C19 and two CEE 7/3 earthing-pin sockets. No breaker,\
  \ no meter, no display, no network interface.\n\nConfiguration `base`: The PDU as it ships: the fixed\
  \ cord and the two push-button attachments on it. The universal mounting kit, the connector lock and\
  \ the mounting adaptor are not drawn.\n\nMounts on the side of a rack's upright, beside the rack; occupies\
  \ no rack unit.\n\nPDU class: basic (metering-scope none, outlet-switching false).\n\nInput rating:\
  \ 400 V three-phase wye, 16 A input.\n\nDatasheet: Rittal, Technical details, Power Distribution Unit\
