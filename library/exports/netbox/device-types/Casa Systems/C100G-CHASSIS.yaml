comments: 'Casa C100G CMTS/CCAP - 13RU, 14 paired front/rear slots. Front and rear slot N are two halves
  of one logical position: a DOCSIS line card in front N requires its I/O partner in rear N.


  Configuration `base`: Chassis only - what you spec before deciding what goes in it. The 28 slot bays
  are EMPTY; fans, power are populated. Enough to power on and reach the box, which is the question most
  people ask first and the one `default` used to answer with whatever the drawing happened to be populated
  with.


  Facts carried in the model that this schema has no field for:

  - physical.weight: 132 lb / 61.23 kg fully loaded

  - power.ac-input-provisioning: 3600 W across three 120 VAC inputs (4800 W over four recommended), or
  4000 W across two 240 VAC inputs. This is SUPPLY to be provisioned, not draw - the 4000 W is what two
  240 V feeds come to, and is not a consumption figure

  - power.power-envelope: fully-configured

  - power.power-max-w: 3600

  - power.psu-dc-input: -42 to -60 VDC, 20 A nominal per feed at -48 VDC


  Drawing version 0.5.2. A major bump means a slot moved or an id was renamed, so anything cached from
  an earlier export may no longer line up.

  Model maturity: modelled. Every dimension in the source records where it came from.'
