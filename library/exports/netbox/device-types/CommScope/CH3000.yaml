comments: 'The CH3000 headend optics platform - a 3RU, 19-inch mid-plane chassis for cable headend and
  hub optics, designed by Aurora Networks (2004), sold under the ARRIS name and now by CommScope / Vistance.
  Sixteen identical full-depth slots take transmitters, receivers, amplifiers and a power supply from
  the front; the rear of each slot takes the module''s dynamic back plate, which carries its optical and
  RF connections, or a half-depth passive. A mid-plane between the two carries the 12 VDC bus and the
  RS-485 management bus.


  Configuration `base`: One PS3006D power supply and controller in slots 1-2 with its BP-P1 back plate,
  and every other slot empty - the chassis powered and manageable before any optics are chosen. Empty
  slots are drawn open: no front blanking panel for a CH3000 slot is named in any document held (see gaps).


  Facts carried in the model that this schema has no field for:

  - environmental.humidity: 5% to 95% non-condensing

  - environmental.operating-temperature: -20 to +65 C

  - environmental.storage-temperature: -40 to +85 C

  - lifecycle.eol: none-announced

  - management.mid-plane-bus: RS-485, polled by the power-supply controller; SNMP through a CX3002 / CX3003C
  / CX3033N

  - physical.rack-face-width-mm: 482.6

  - physical.slots-full-depth: 16

  - physical.slots-half-depth: 32 (16 front, 16 rear)

  - physical.weight-kg: 7.0

  - physical.weight-note: CH3000C, with top and bottom covers; the CH3000N without covers is 4.5 kg

  - power.power-bus: 12 VDC mid-plane bus, fed by the PS3006 / PS3248 controller-supply


  Drawing version 0.1.0. A major bump means a slot moved or an id was renamed, so anything cached from
