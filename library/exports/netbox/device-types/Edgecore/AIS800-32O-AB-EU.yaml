comments: '32 x 800G OSFP800 AI and data centre 1RU switch on a Broadcom Tomahawk 5 with an Intel Xeon
  D-1713NTE and an OpenBMC service processor, sold as the AIS800-32O. All ports are on the FRONT with
  two 25G SFP28 in-band management cages, an RJ-45 management jack, an RJ-45 console, a USB-C storage
  port, six system lamps and a reset button; two 2400 W supplies and SEVEN fan trays are on the rear.
  Its twin edgecore/ais800-32d is the same chassis, the same rear and the same management cluster with
  a QSFP-DD800 wall in place of this one''s OSFP800 wall - and the two walls are laid out differently,
  which is the whole reason they are two models.


  Configuration `ac-b2f`: Dual 2400 W AC PSUs, back-to-front airflow - blue bails. The guide never writes
  the colour rule in words; its Airflow Reversal figures draw it. Derated to 0-35 C, "subject to used
  optics".


