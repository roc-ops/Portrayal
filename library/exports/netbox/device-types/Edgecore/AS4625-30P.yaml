comments: '24 x 1G RJ-45 PoE plus 6 x 1G/10G SFP+ 1RU access switch, sold as the EPS112 and stamped AS4625-30P.
  ALL TWENTY-FOUR COPPER PORTS ARE PoE and they are two classes, not one: ports 1-16 carry 802.3at/af
  up to 30 W and ports 17-24 carry 802.3bt Type 4 up to 90 W, with the 90 W eight marked out on the panel
  by an ORANGE BAND above and below them. The RJ-45s sit in twelve columns of two, ganged six and six;
  the SFP+ uplinks are three stacked pairs numbered 25-30 into the same sequence. A stacked management/console
  RJ-45 pair, a full-size Type A USB 3.0 storage port, a Reset button and six status lamps finish the
  face. TWO HOT-SWAPPABLE 600 W AC SUPPLIES AND THREE FIXED FANS on the rear - the fans are not FRUs.
  It is the third member of the 440 x 350.3 x 44 shell that edgecore/eps121 and edgecore/eps122 share,
  and the only one with its own quick start guide.


  Configuration `base`: The chassis as it ships: two supplies in, every cage empty. The guide''s package
  contents say the unit "includes 2 PSUs", and its Connect Power step says "Install one or two AC PSUs
  in the device, if they are not already installed in the factory".


  Also sold or listed as: EPS112


  Facts carried in the model that this schema has no field for:

  - environmental.humidity: Operating: 5% to 95% non-condensing

  - environmental.operating-temp: 0 to 45 C (32 to 113 F) at sea level

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F)

  - features.optics-sfp-plus: Six 1G/10G SFP+ uplinks, ports 25-30. The guide''s Install step lists what
  goes in them - "10GBASE-SR, LR, CR, T" and "1000BASE-SX, LX, T" - and the datasheet adds "1G BIDI up
  to 40 KM", "10G BIDI up to 10KM" and "10G tunable laser DWDM up to 80 KM". No breakout table is published,
  so none is stated here.

  - features.poe: Ports 1-16 support IEEE 802.3at and 802.3af up to 30 W per port; ports 17-24 support
  IEEE 802.3bt Type 4 up to 90 W per port. The panel prints the per-port current: 0.55 A max on ports
  1-16 and 1.65 A max on ports 17-24, at 57 V dc max. 90 W needs Cat 6A cabling, which the datasheet says
  in its own key-features list.

  - lifecycle.eol: none-announced

  - physical.weight-note: 6.42 kg (14.15 lb), includes two PSUs

  - power.input-ac: 100-240 VAC, 50/60 Hz, 8.5 A max

  - power.poe-budget: 450 W with one PSU, 1000 W with two PSUs

  - power.power-consumption: Low-line 1150 W max; high-line 1200 W max


