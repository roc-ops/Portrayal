comments: '32x 400G QSFP-DD 1RU data-centre spine switch (vendor alias AS9716-32D), Broadcom Tomahawk
  3 BCM56980, ONIE-preloaded. All ports on the front; two 1300 W AC PSUs and six 5+1 fan trays from the
  rear, in front-to-back and back-to-front airflow SKUs.


  Configuration `ac-b2f`: Dual 1300 W AC PSUs and six fan trays with back-to-front airflow. The quick-start
  guide distinguishes the two SKUs by latch and handle colour - ''Remove front-to-back (F2B) airflow fan
  trays (red handles) and PSUs (red release latches). Install back-to-front (B2F) airflow fan trays (blue
  handles) and PSUs (blue release latches)'' (dcs510-qsg/doc.md:116-120) - so this configuration is the
  same geometry in the blue skins.


