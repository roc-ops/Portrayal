comments: '20x 10G SFP+, 4x 25G SFP28 and 3x 100G QSFP28 cell site router, sold as the CSR310, Broadcom
  BCM88470 Qumran-AX with an Intel Atom C3508 and a Stratum 3E OCXO. An integrated GNSS receiver behind
  an SMA antenna input, six RJ-45s carrying stacking, timing and management, and two of the QSFP28s usable
  for stacking a second unit. Everything is on the front, including both hot-swappable supplies and the
  fan tray; side-to-side airflow.


  Configuration `dc`: Two hot-swappable -48 VDC supplies, otherwise the base box. This is the variant
  the datasheet''s front elevation draws, and the quick start ships four ring lugs with it.


  Also sold or listed as: CSR310


