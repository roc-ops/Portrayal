comments: '32x 400G QSFP56-DD data-centre leaf switch on an Intel Xeon D-1713NTE with an AST2600 OpenBMC,
  sold as the DCS511. Every port, both consoles, the USB and a 1PPS timing input are on the FRONT; two
  supplies, SIX fan trays and the grounding screws are on the rear. BOTH RIGHT-HAND CAGES ARE MANAGEMENT
  PORTS, which is not what the quick start''s callouts suggest. The datasheet lists them under "Management
  Ports on Port Side" - "1 x SFP+ 10G ASIC management" and "1 x SFP 1G CPU management" - and states "Switch
  Ports: 32 x QSFP56-DD 400 GbE", a count with no SFP in it. Neither cage carries traffic.


  Configuration `ac-b2f`: Dual AC PSUs, back-to-front airflow. The guide states the colour: "Install back-to-front
  (B2F) airflow fan trays (blue handles) and PSUs (blue release latches)." This build is derated to 0-30
  C where the F2B build runs to 45 C.


  Also sold or listed as: DCS511


  Facts carried in the model that this schema has no field for:

  - environmental.humidity: Operating: 5% to 95% (non-condensing)

  - environmental.operating-temp: 0 to 45 C (F2B) / 0 to 30 C (B2F)

  - environmental.storage-temp: -40 to 70 C

  - features.optics-qsfp-dd: datasheet: 32 x QSFP56-DD 400GbE. The guide''s own LED table enumerates the
  modes each port runs - 400G and 2 x 200G and 4 x 100G on 50G PAM4, 100G and 4 x 25G on 25G NRZ, and
  40G and 4 x 10G on 10G NRZ - which is a fuller statement of what works than the datasheet''s port line
  gives.

