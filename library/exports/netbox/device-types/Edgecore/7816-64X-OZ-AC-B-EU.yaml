comments: '64 x 100G QSFP28 2RU top-of-rack or spine switch (vendor alias AS7816-64X, OZ series), Broadcom
  BCM56970 Tomahawk 2 with an Intel Xeon D-1518, ONIE-preloaded. Every port is on the front, in sixteen
  2x2 ganged cages; two 850 W AC supplies sit in the rear''s lower corners either side of four 3+1 fan
  trays, in either airflow direction. Port, fan and PSU numbering start at zero on this series.


  Configuration `ac-b2f`: Dual 850 W AC supplies, back-to-front airflow - the -B ordering codes. BOTH
  faces'' airflow regions swap: the front becomes the exhaust and the rear the intake. No handle colour
  is overridden: every rear either document draws is red, and neither shows a -B unit; see the fan-handle-colour-by-airflow
  gap.


