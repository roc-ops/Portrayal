comments: 'SONiC lists Edgecore AS4630-54PE (NOS: sonic).

  Listed per: SONiC Supported Devices and Platforms (sonic-net.github.io/SONiC), the row for AS4630-54PE.
  Port names from the platform''s own table in sonic-net/sonic-buildimage at d5c2e3b32ffa, device/accton/x86_64-accton_as4630_54pe-r0/Accton-AS4630-54PE/port_config.ini:
  each SONiC name with the front-panel port its alias names. eth0 is SONiC''s management port (the SONiC
  command reference, Management VRF).


  54-port Gigabit PoE access switch, 1RU, sold as the EPS202 and stamped AS4630-54PE. 48 x 10/100/1000BASE-T
  RJ-45 in twenty-four columns of two, ganged six and six and six and six, ALL of them delivering up to
  90 W under IEEE 802.3at and 802.3bt - one rate and one PoE class, which is what separates it from both
  its shell-mates. Four 10G/25G SFP28 uplinks and two 100G QSFP28 stacking ports numbered 49-52 and 53-54
  into the same sequence. TWO HOT-SWAPPABLE 1200 W AC SUPPLIES AND THREE HOT-SWAPPABLE FAN TRAYS on the
  rear, front-to-back only. IT IS 32 mm SHALLOWER THAN ITS TWO SIBLINGS - 438 x 442 x 43.7 against 438
  x 474 x 44 - and its FACE is theirs.


  Configuration `base`: The chassis as it ships: two 1200 W supplies and three fan trays in, every cage
  empty. ONE AIRFLOW ONLY, which is the difference from edgecore/eps201 on the same face: this model''s
  datasheet reads "Front-to-back airflow only" and its rear elevation draws the red handles to match,
  counted at 2,547 pixels with a median of (238, 43, 40) and not one blue. The EPS201 ships four front-to-back
  codes and four back-to-front and needs two configurations; this one needs none.


  Also sold or listed as: EPS202


  Facts carried in the model that this schema has no field for:

  - environmental.humidity: Operating: 5% to 95% non-condensing

  - environmental.operating-temp: 0 to 45 C (32 to 113 F)

  - environmental.storage-temp: -40 to 70 C (-40 to 158 F)

  - features.optics-qsfp28: Two 100G QSFP28 ports, 53-54, sold as stacking ports and qualified by the
  datasheet itself - "stacking capability subject to NOS implementations".

  - features.optics-sfp28: Four 10G/25G SFP28 uplinks, ports 49-52. No per-cage breakout table is published,
  so none is stated here.

  - features.poe: All forty-eight RJ-45 ports support IEEE 802.3at and IEEE 802.3bt, up to 90 W per port
  depending on the budget. Cat 6 cabling, per the datasheet''s prose. ONE CLASS ACROSS ALL FORTY-EIGHT,
  unlike the EPS203 which splits the same sockets by rate.

  - lifecycle.eol: none-announced

  - physical.weight-note: 7.67 kg (16.91 lb), with two installed PSUs

  - power.poe-budget: With a 30 W guard band - 750 W with one PSU, 1500 W with two, at both low and high
  line

  - power.power-consumption: 1710 W maximum at both low and high line


