comments: "SONiC lists UfiSpace S9301-32DB (NOS: sonic).\nListed per: SONiC Supported Devices and Platforms\
  \ (sonic-net.github.io/SONiC), the row for S9301-32DB. Port names from the platform's own table in sonic-net/sonic-buildimage\
  \ at d5c2e3b32ffa, device/ufispace/x86_64-ufispace_s9301_32db-r0/platform.json: each SONiC name with\
  \ the front-panel port its alias names and the breakout modes it allows. eth0 is SONiC's management\
  \ port (the SONiC command reference, Management VRF).\n\nUfiSpace S9301-32DB 200/400G data center spine\
  \ and leaf switch - 1RU white box, 24x QSFP56 200G and 8x QSFP-DD 400G in two rows plus a 2x SFP+ 10G\
  \ out-of-band pair and an RJ45/USB/console management stack, Broadcom Trident4-X9 at 8 Tbps; six hot-swap\
  \ fans (5+1) and dual 1300W PSUs (1+1) at the rear, orderable in AC or DC and in front-to-back or back-to-front\
  \ airflow\n\nDatasheet: UfiSpace S9301-32DB 200/400G Data Center Spine & Leaf Switch Datasheet\n  https://www.ufispace.com/products/datacenter/200g/s9301-32db-200g-data-center-spine-leaf-switch\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15, Subpart\
  \ B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386; EN 55035; VCCI CISPR 32, Class A\n-\
  \ compliance.environment: RoHS; WEEE\n- compliance.safety: UL 62368-1; IEC 62368-1\n- environmental.operating-humidity:\
  \ 5 to 95% RH non-condensing\n- environmental.operating-temp: 0 to 40 C\n- environmental.storage-humidity:\
  \ 5 to 95% RH non-condensing\n- environmental.storage-temp: -40 to 70 C\n- features.optics-qsfp-dd:\
  \ 400GE ZR/ER4/LR4/SR8/FR4/DR4/DR4+/PLR4 with 400G ZR/ZR+ support (datasheet compatible transceiver\
  \ list); the eight QSFP-DD ports also take 200/100G\n- features.optics-qsfp56: 200GE QSFP56 SR4/FR4\
  \ and 100GE QSFP28 ZR4/ER4/LR4/SR4 (datasheet compatible transceiver list); the HIG port table gives\
  \ ports 0~23 as 200/100G\n- features.optics-sfp-plus: 10G on the out-of-band management pair (datasheet\
  \ '2 x 10G SFP+ management ports'); the HIG recommends Cat 5e for the RJ45 OOB port and names no SFP+\
  \ optic, so no specific module list is published for this pair\n- features.zr-capacity: up to 4 OpenZR+\
  \ transceivers in a front-to-back airflow build and up to 2 in a back-to-front build, and OpenZR+ modules\
  \ must not sit in adjacent ports (HIG Port Overview, Figures 12 and 13)\n- lifecycle.eol: none-announced\n\
  - management.console: RJ45 RS-232, 115200 8N1, no flow control (labelled IOIOI)\n- management.oob: 1x\
  \ RJ45 100/1000M plus 2x SFP+ 10G, both types reaching the x86 (HIG Connecting the OOB Management Cables)\n\
  - performance.packet-buffer: 82 MB\n- performance.switching-capacity: 8 Tbps\n- platform.asic: Broadcom\
  \ Trident4-X9 BCM56780\n- platform.bmc: Aspeed AST2620\n- platform.cpu: Intel Skylake-D 8-core @ 1.9\
  \ GHz\n- platform.memory: 32 GB DDR4\n- platform.storage: 1x 128 GB SSD\n- power.input-ac: 100 to 240\
  \ V, 12 A per feed\n- power.input-dc: -40 to -75 V, 40 A per feed\n- power.power-envelope: bare\n- power.power-max-w:\
  \ 892.9\n- power.power-typical-w: 291.6\n- power.psu-redundancy: 1+1 active-active hot-swappable\n-\
  \ thermal.airflow: front-to-back or back-to-front, selected by FRU (red or blue handles)\n- thermal.fan-redundancy:\
  \ 5+1 hot-swappable\n\nDrawing version 2.1.1. A major bump means a slot moved or an id was renamed,\
  \ so anything cached from an earlier export may no longer line up.\nModel maturity: modelled. Every\
  \ dimension in the source records where it came from."
