comments: 'SONiC lists Edgecore 9716-32D-O-AC-B-EU (NOS: sonic).

  Listed per: SONiC Supported Devices and Platforms (sonic-net.github.io/SONiC), the row for AS9716-32D.
  Port names from the platform''s own table in sonic-net/sonic-buildimage at d5c2e3b32ffa, device/accton/x86_64-accton_as9716_32d-r0/Accton-AS9716-32D/port_config.ini:
  each SONiC name with the front-panel port its alias names. eth0 is SONiC''s management port (the SONiC
  command reference, Management VRF).


  32x 400G QSFP-DD 1RU data-centre spine switch (vendor alias AS9716-32D), Broadcom Tomahawk 3 BCM56980,
  ONIE-preloaded. All ports on the front; two 1300 W AC PSUs and six 5+1 fan trays from the rear, in front-to-back
  and back-to-front airflow SKUs.


  Configuration `ac-b2f`: Dual 1300 W AC PSUs and six fan trays with back-to-front airflow. The quick-start
  guide distinguishes the two SKUs by latch and handle colour - front-to-back (F2B) fan trays have red
  handles and their PSUs red release latches, back-to-front (B2F) fan trays blue handles and their PSUs
  blue release latches, and a change of airflow replaces one set with the other (dcs510-qsg/doc.md:116-120)
  - so this configuration is the same geometry with the latch and handle colours set, which is what they
  are: a finish on one drawing rather than a second drawing of the same part.


  Also sold or listed as: AS9716-32D


