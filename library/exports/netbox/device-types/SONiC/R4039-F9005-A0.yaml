comments: 'SONiC lists Celestica R4039-F9005-A0 (NOS: sonic).

  Listed per: sonic-net/sonic-buildimage at d5c2e3b32ffa builds SONiC for this box: device/celestica/x86_64-cel_ds3000-r0.
