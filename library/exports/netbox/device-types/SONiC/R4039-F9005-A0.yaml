  as SONiC''s list. Port names from the platform''s own table, device/celestica/x86_64-cel_ds3000-r0/platform.json:
  each SONiC name with the front-panel port its alias names and the breakout modes it allows. eth0 is
  SONiC''s management port (the SONiC command reference, Management VRF).


  Celestica DS3000 - 1RU 32 x 100G QSFP28 data-center leaf/spine switch with one SFP+, an RJ-45 console,
  USB-A and RJ-45 management stack at the right, and two CRPS AC supplies and four hot-swap fans on the
  rear; front-to-back and back-to-front builds.


  Configuration `f2b`: R4039-F9005-A0: DS3000, 1U, 32x 100GbE, COMe 4C/16GB-DDR/64GB-SSD, front-to-back
  airflow.


  Facts carried in the model that this schema has no field for:

  - compliance.emc: CN (GB9254-2008), EU (EN55022, EN55024), FCC, VCCI

  - compliance.safety: IEC60950-1, GB4943, UL/CSA, CB

  - environmental.humidity: operating 5% to 90% non-condensing; storage 5% to 95%

  - environmental.mtbf: in excess of 150,000 hours

  - environmental.operating-temp: 0 to 45 C at 900 m

  - environmental.storage-temp: -40 to 70 C

  - features.breakout: each QSFP28 port breaks out to 4x25G or 4x10G; system maximums 128 x 10/25GbE or
  64 x 50GbE (datasheet)

  - features.optics-qsfp28: guide Table 1: 100GBASE-SR4 over OM3/OM4 parallel multimode, 100GBASE-LR4
  (10 km) over single-mode, 100GBASE-CR4 copper DAC at 1 m 30AWG, 3 m 28AWG and 5 m 26AWG; 4x25G breakout
  by cable without a reboot

  - features.optics-sfp-plus: guide Table 1 (as printed): 10GBASE-SR over OM3/OM4, 10GBASE-LR (10 km)
  single-mode, 10G copper DAC at 1, 3, 5 and 7 m; the table writes the SFP+ modules as SR4/LR4/CR4, which
  is the QSFP row''s wording copied

  - features.timing: IEEE 1588 and SyncE timing option (datasheet)

  - features.transceiver-power: QSFP28 up to 4.5 W / 5.5 W (partial) power; DAC to 5 m passive

  - lifecycle.eol: none-announced

  - management.console: RJ-45, asynchronous, 8-N-1, 115200 baud (guide)

  - performance.forwarding-tables: up to 48K MPLS labels, 324K LPM, up to 128K ACL

  - performance.latency: under 500 ns port to port (cut-through)

  - performance.packet-buffer: 32 MB

  - performance.switching-capacity: 3.2 Tbps

  - platform.bmc: BMC with IPMI 2.0, NC-SI shared management port, Serial over LAN

  - platform.cpu: Intel Atom C x86 (up to 8 core) on a COM-Express module

  - platform.memory: 8-32 GB ECC DDR4

  - platform.nos-installer: ONIE

  - platform.storage: configurable M.2 SSD

  - power.input-ac: 100-240 VAC auto-ranging, 47-63 Hz (datasheet); 90-264 VAC, 50-60 Hz, 3.4-7.1 A (guide)

  - power.input-hvdc: 180-300 VDC auto input (datasheet)

  - power.power-envelope: fully-configured

  - power.power-max-w: 500

  - thermal.fans: 3+1 redundant hot-swap fans, front-to-back or back-to-front


