comments: "Arista 7050TX3-48C8 - a fixed 1RU data-centre switch with 48 x 1/2.5/5/10GBASE-T RJ-45 ports\
  \ and 8 x 100G QSFP ports, running EOS. The front carries the RJ-45 jacks in two stacked rows of twelve\
  \ columns on each side, in four blocks of six columns, the odd number on top, with the eight QSFP cages\
  \ in two stacked rows of four columns between the two halves. Four system lamps (system, fan, PS1, PS2)\
  \ are at the top right. The rear carries two hot-swap 500 W power supplies at the ends and two hot-swap\
  \ fan modules, with the RJ-45 management port, the USB port and the RJ-45 console port between the left\
  \ supply and the first fan. The same panel is ordered with front-to-rear air (-F) or rear-to-front air\
  \ (-R).\n\nConfiguration `r`: The 7050TX3-48C8 with two AC supplies and rear-to-front air: PWR-511-AC-BLUE\
  \ supplies and FAN-7011M-R fan modules, all with blue handles. Ordered as DCS-7050TX3-48C8-R.\n\nAlso\
  \ sold or listed as: DCS-7050TX3-48C8\n\nDatasheet: 7050X3 Series 10/25/40/50/100G Data Center Switches\
  \ Data Sheet (Arista Networks, 03-0040-46)\n  https://www.arista.com/assets/data/pdf/Datasheets/7050X3-Datasheet.pdf\n\
