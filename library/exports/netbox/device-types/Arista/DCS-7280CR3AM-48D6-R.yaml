comments: "Arista 7280CR3A-48D6 - a fixed 2RU data-centre router switch with 48 x 100G QSFP ports, 6 x\
  \ 400G QSFP-DD ports and one OSFP line-system port, running EOS. The front carries the 100G cages in\
  \ six blocks of two columns and four rows (three blocks at each end, two stacked pairs of rows each),\
  \ with the six 400G cages in two rows of three between them. Each port has a status lamp. At the right\
  \ are a Time-of-Day connector and two clock connectors above a block holding the RJ-45 Ethernet management\
  \ port, the USB port and the RJ-45 serial console, four system lamps (system, fan, PS1, PS2) beside\
  \ it, and the OSFP line-system port below it. The rear carries two hot-swap 1500 W power supplies one\
  \ above the other at the right, four hot-swap fan modules, and a grounding strip between the first and\
  \ second fan. The same panel is ordered with front-to-rear air (-F) or rear-to-front air (-R), as the\
  \ 7280CR3A, the 7280CR3AM with TunnelSec encryption and the 7280CR3AK with large routes and TunnelSec.\n\
  \nConfiguration `m-r`: The 7280CR3AM-48D6 with rear-to-front air. Ordered as DCS-7280CR3AM-48D6-R.\n\
  \nAlso sold or listed as: DCS-7280CR3A-48D6\n\nDatasheet: 7280R3A Series Data Center Switch Router -\
  \ Data Sheet (04-0040-26, April 15th, 2025)\n  https://www.arista.com/assets/data/pdf/Datasheets/7280R3A-Datasheet.pdf\n\
