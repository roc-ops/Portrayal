comments: "Arista 7280CR3A-72 - a fixed 2RU data-centre router switch with 72 x 100G QSFP ports, running\
  \ EOS. The front carries the cages in nine blocks of two columns and four rows (two stacked pairs of\
  \ rows each), each port with a status lamp. At the top right are two clock connectors and a Time-of-Day\
  \ connector, then a row holding the RJ-45 Ethernet management port, the USB port and the RJ-45 serial\
  \ console, with four system lamps (system, fan, PS1, PS2) beside it. The rear carries two hot-swap 1500\
  \ W power supplies one above the other at the right, four hot-swap fan modules, and a grounding strip\
  \ between the first and second fan. The same panel is ordered with front-to-rear air (-F) or rear-to-front\
  \ air (-R), as the 7280CR3A, the 7280CR3AM with TunnelSec encryption and the 7280CR3AK with large routes\
  \ and TunnelSec.\n\nConfiguration `k-r`: The 7280CR3AK-72 with rear-to-front air. Ordered as DCS-7280CR3AK-72-R.\n\
  \nAlso sold or listed as: DCS-7280CR3A-72\n\nDatasheet: 7280R3A Series Data Center Switch Router - Data\
  \ Sheet (04-0040-26, April 15th, 2025)\n  https://www.arista.com/assets/data/pdf/Datasheets/7280R3A-Datasheet.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emissions: FCC Class A,\
  \ ICES-003 Issue 7, EN 55032:2015, VCCI-CISPR 32:2016, AS/NZS CISPR 32:2015\n- compliance.regulatory-model-number:\
  \ AN1788 (DCS-7280CR3A-72, DCS-7280CR3AM-72, DCS-7280CR3AK-72), guide Table 14\n- compliance.safety:\
  \ EN 62368-1:2020+A11:2020, IEC 62368-1:2018, CSA/UL 62368-1:2019, AS/NZS 62368.1:2022\n- environmental.altitude:\
  \ 0 to 3,000 m (0 to 10,000 ft)\n- environmental.humidity: 5 to 90 percent, non-condensing\n- environmental.operating-temp:\
  \ 0 to 40 C (32 to 104 F)\n- environmental.storage-temp: -25 to 70 C (-13 to 158 F)\n- environmental.storage-temp-datasheet:\
  \ -40 to 70 C (-40 to 158 F), per the data sheet\n- features.encryption: all ports (MACsec, IPsec and\
  \ VXLANsec, as TunnelSec)\n- features.optics-qsfp28: each of the 72 QSFP cages runs 100G, or 40G (QSFP+),\
