comments: "Arista 7050PX4-32S - a fixed 1RU data-centre switch with 32 x 400G OSFP ports and 2 x SFP+\
  \ ports, running EOS. The front carries the OSFP cages in two stacked rows, the odd number on top, in\
  \ four blocks of four columns separated by rails, with the two SFP+ cages stacked at the right. Four\
  \ system lamps (system, fan, PS1, PS2) are at the far right. The rear carries two hot-swap power supplies\
  \ at the ends, three hot-swap fan modules, and the RJ-45 management port, the USB port and the RJ-45\
  \ console port. The same panel is ordered with front-to-rear air (-F) or rear-to-front air (-R).\n\n\
