  \ groups of two, the odd number on top, with the two SFP+ cages stacked at the left. At the right are\
  \ the stacked RJ-45 management port, USB port and RJ-45 console port, with four system lamps (system,\
  \ fan, PS1, PS2). The rear carries two hot-swap 500 W power supplies at the ends and four hot-swap fan\
