comments: "Arista 7050X4-48Y-4DF - a fixed 1RU data-centre switch with 48 x 25G SFP25 ports and 4 x 400G\
  \ QSFP-DD ports, running EOS. The front carries the SFP25 cages in two stacked rows, the odd number\
  \ on top, in four groups of six columns, with the four QSFP-DD cages as two stacked columns between\
  \ the second and third groups. A teal strip between the rows carries each SFP25 cage's number and an\
  \ orange one the QSFP-DD cages'. A status lamp for each SFP25 port runs along the bottom edge. Four\
  \ system lamps (system, fan, PS1, PS2) are at the top right. The rear carries two hot-swap 500 W power\
  \ supplies at the ends, three hot-swap fan modules, and the RJ-45 management port, the USB port and\
  \ the RJ-45 console port. The same panel is ordered with front-to-rear air (-F) or rear-to-front air\
  \ (-R).\n\nConfiguration `f`: The 7050X4-48Y-4DF with two AC supplies and front-to-rear air: PWR-511-AC-RED\
  \ supplies and FAN-7011M-F fan modules, all with red handles. Ordered as DCS-7050X4-48Y-4DF-F.\n\nDatasheet:\
  \ 7050X4 Series 100/200/400G Data Center Switches Data Sheet (Arista Networks, 03-0057-27, Aug 27th,\
  \ 2025)\n  https://www.arista.com/assets/data/pdf/Datasheets/7050X4-Datasheet.pdf\n\nFacts carried in\
  \ the model that this schema has no field for:\n- compliance.certifications: BSMI, CE, KCC, NRTL, RCM,\
  \ UKCA, VCCI, TEC, ANATEL, ICASA, NOM Equivalency (data sheet)\n- compliance.emc: FCC Class A, ICES-003,\
  \ EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386\n- compliance.rohs: RoHS 2011/65/EU\
  \ and 2015/863/EU (data sheet, Directives)\n- compliance.safety: EN 62368-1, IEC 62368-1, CSA/UL 62368-1\n\
  - environmental.altitude: 0 to 3,000 m (10,000 ft) operating\n- environmental.humidity: 5 to 90 percent\
  \ non-condensing\n- environmental.operating-temp: 0 to 40 C (32 to 104 F)\n- environmental.storage-temp:\
  \ -25 to 70 C (guide Table 2); the data sheet says -40 to 70 C\n- features.eos-license: license group\
  \ LIC-FIX-2; minimum EOS 4.34.2\n- features.optics-qsfp-dd: 400G, 200G, 100G and 40G with breakout,\
