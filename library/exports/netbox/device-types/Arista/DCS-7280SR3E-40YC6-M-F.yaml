comments: "Arista 7280SR3-40YC6 - a fixed 1RU data-centre switch router with 40 x 1/10/25G SFP ports and\
  \ 6 x 100G QSFP ports, running EOS. The front carries the SFP cages in two stacked rows of twenty columns\
  \ in two-column blocks, the odd number on top, with a status lamp at each end of every block row, and\
  \ the six QSFP cages in two stacked rows of three columns at the right. Four system lamps (system, fan,\
  \ PS1, PS2) are in a column at the far right. The rear carries two hot-swap 500 W power supplies at\
  \ the ends and two hot-swap fan modules, with the RJ-45 management port, the USB port and the RJ-45\
  \ console port between the left supply and the first fan. The same panel is ordered with front-to-rear\
  \ air (-F) or rear-to-front air (-R). It is sold as the 7280SR3-40YC6 and, with SyncE and more memory,\
  \ as the 7280SR3E-40YC6-M.\n\nConfiguration `m-f`: The 7280SR3E-40YC6-M, the same face with 32 GB of\
  \ memory and inband SyncE, with front-to-rear air. Ordered as DCS-7280SR3E-40YC6-M-F. The guide gives\
  \ it 9.6 kg and the same power draw as the base switch.\n\nAlso sold or listed as: DCS-7280SR3-40YC6\n\
  \nDatasheet: 7280R3 Series Data Center Switch Router Data Sheet (Arista Networks, 03-0045-59, August\
  \ 11th, 2025)\n  https://www.arista.com/assets/data/pdf/Datasheets/7280R3-Data-Sheet.pdf\n\nFacts carried\
