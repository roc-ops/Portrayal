comments: 'Arista 7280DR3A-54 - a fixed 2RU data-centre router switch with 54 400G QSFP-DD ports. The
  ports stand upright in eighteen columns of three, numbered 1 to 54 down each column from the top left.
  Two OSFP line-system ports (OSFP-LS, 55 and 56) for 400G-ZR optics are stacked at the lower right. Above
  them at the right, one over another, are an RJ-45 Ethernet management port, a USB port and an RJ-45
  console. Four status lamps stand beside them: system, fan, power supply 1 and power supply 2. At the
  left edge are a Time-of-Day connector and two clock connectors (1PPS and 10 MHz). The rear carries four
  hot-swap fan modules and two hot-swap 3000 W power supplies, AC or DC, one above the other at the right.
  The same front panel is sold as the DR3A-54, the DR3AM-54 (TunnelSec) and the DR3AK-54 (large routes
  and TunnelSec). They differ in software licence and encryption, not in the metal.


  Configuration `ac-m`: The DR3AM-54 with TunnelSec: DCS-7280DR3AM-54-F, the same face, supplies and fans
  as the base switch. Table 4 gives it the base switch''s power draw.


  Also sold or listed as: DCS-7280DR3A-54


  Rack mounting positions: flush ("flush with the front and rear panels"; 4-post only).


