comments: "Arista 7280SR3-48YC8 - a fixed 1RU data-centre switch router with 48 x 1/10/25G SFP ports and\
  \ 8 x 100G QSFP ports, running EOS. The front carries the SFP cages in two stacked rows of twelve columns\
  \ on each side, the odd number on top, with the eight QSFP cages in two stacked rows of four columns\
  \ between the two halves. Each SFP port has a status lamp under the lower row and each QSFP port four\
  \ lamps above or below its cage. Four system lamps (system, fan, PS1, PS2) are at the top right. The\
  \ rear carries two hot-swap 500 W power supplies at the ends and two hot-swap fan modules, with the\
  \ RJ-45 management port, the USB port and the RJ-45 console port between the left supply and the first\
  \ fan. The same panel is ordered with front-to-rear air (-F) or rear-to-front air (-R). It is sold as\
  \ the 7280SR3-48YC8, as the 7280SR3K-48YC8 with more memory and routes, and as the 7280SR3K-48YC8A with\
  \ an eight-core CPU.\n\nConfiguration `r`: The 7280SR3-48YC8 with two AC supplies and rear-to-front\
  \ air: PWR-511-AC-BLUE supplies and FAN-7011M-R fan modules, all with blue handles. Ordered as DCS-7280SR3-48YC8-R.\n\
  \nAlso sold or listed as: DCS-7280SR3-48YC8\n\nDatasheet: 7280R3 Series Data Center Switch Router Data\
  \ Sheet (Arista Networks, 03-0045-59, August 11th, 2025)\n  https://www.arista.com/assets/data/pdf/Datasheets/7280R3-Data-Sheet.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.certifications: BSMI,\
