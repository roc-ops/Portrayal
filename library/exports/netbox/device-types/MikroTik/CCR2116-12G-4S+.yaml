comments: 'MikroTik CCR2116-12G-4S+ is a fixed 1U Cloud Core Router with twelve gigabit Ethernet jacks,
  four SFP+ cages, a thirteenth gigabit jack for management, an RJ45 serial console and a USB 3.0 type
  A port, and runs RouterOS v7. The front carries the four SFP+ cages in two stacks of two with eight
  arrow lamps, the twelve jacks in three blocks of four, the console over the management jack, USB, the
  MODE and RESET buttons and four status lamps. Two AC inlets, each with its supply built in, and five
  round openings, four of them fans, are on the rear. The brochure says the supply is dual redundant and
  the page counts two PSU slots, but no held document prints a part number and the rear photograph shows
  no removable module, so the supplies are part of the chassis and there are no bays.


  Configuration `base`: CCR2116-12G-4S+ - twelve gigabit Ethernet jacks, four SFP+ cages, a gigabit management
  jack, an RJ45 console and a USB 3.0 type A port, with two AC supplies and four fans (all part of the
  chassis in this model). The box holds two power cords, rack ears and a fastening set.


  Rack mounting positions: flush (as shipped).


