comments: 'MikroTik CRS317-1G-16S+RM is a fixed 1U Cloud Router Switch with 16 SFP+ cages, one 10/100/1000
  management port and an RJ45 serial console. It runs SwOS or RouterOS (dual boot). The front carries
  the 16 cages in four blocks of four. Each has an ACT lamp, a 10G lamp and its printed name, SFP+ 1 to
  SFP+ 16. Beside them sit the CONSOLE jack, the ETH/BOOT jack, the RESET button and the USR, FAULT, PWR
  2 and PWR 1 lamps. The rear carries two IEC C14 inlets (POWER 1 and POWER 2), two fans and a finned
  heatsink. Two supplies are built into the chassis, one active at a time, so there are no bays. The left
  and right walls are not drawn.


  Configuration `base`: CRS317-1G-16S+RM - 16 SFP+ cages, one 10/100/1000 management port and the RJ45
  console, with two built-in AC supplies and two fans. The box holds two IEC cords, rack ears and a K10
  screw kit.


  Rack mounting positions: flush (as shipped).


