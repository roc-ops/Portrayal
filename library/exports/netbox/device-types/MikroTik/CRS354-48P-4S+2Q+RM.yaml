comments: 'MikroTik CRS354-48P-4S+2Q+RM is a fixed 1U Cloud Router Switch with PoE out. It has 48 10/100/1000
  Ethernet ports that all supply PoE (IEEE 802.3af/at, or 26 V / 53 V passive). It also has four SFP+
  cages, two 40G QSFP+ cages, a 10/100 management port and an RJ45 serial console, and runs RouterOS.
  The front carries the 48 jacks in four blocks of six columns by two rows. They are numbered 1 to 48
  as printed, with the odd number on the lower jack of a column. The four SFP+ cages are numbered 1 to
  4 and the two QSFP+ cages 1 and 2, each pair stacked, with the odd number below. The right-hand end
  carries the CONSOLE and MGMT jacks, the RESET button and the POWER and FAULT lamps. The rear carries
  one AC inlet (100-240 V, 10 A) and a vent field; two fan openings are in the left wall. The power supply
  and the fans are built into the chassis, so there are no bays.


  Configuration `base`: CRS354-48P-4S+2Q+RM - 48 10/100/1000 PoE-out ports, four SFP+ cages, two QSFP+
  cages, the management jack and the RJ45 console. The box holds an IEC cord, rack ears, rear support
  ears, the K-68 screw kit and cable management brackets.


  Rack mounting positions: flush (ears level with the face; as shipped).


