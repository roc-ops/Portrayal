comments: 'MikroTik CRS326-4C+20G+2Q+RM is a fixed 1U Cloud Router Switch. It has 20 2.5G RJ45 ports and
  four combo ports. Each combo port is a 2.5G RJ45 jack (1T to 4T) and a 10G SFP+ cage (1F to 4F), one
  in use at a time. It also has two 40G QSFP+ cages, a 10/100 management jack (MGMT/BOOT) and an RJ45
  serial console, and runs RouterOS. The front carries the 24 RJ45 jacks in three blocks of four columns
  by two rows. They are numbered 1 to 20 and then 1T to 4T as printed, with the odd number on the lower
  jack. The 2 by 2 SFP+ block and the stacked QSFP+ pair follow. Then come the CONSOLE and MGMT/BOOT jacks,
  the RESET button and the USER, FAULT, POWER 2 and POWER 1 lamps. The rear carries two AC inlets (POWER
  1 and POWER 2, 100-240 V) and a vent field. The left wall carries a fan opening and a vent field. The
  two supplies are built into the chassis, so there are no bays.


  Configuration `base`: CRS326-4C+20G+2Q+RM - 20 2.5G RJ45 ports, four combo 2.5G RJ45 / SFP+ ports, two
  40G QSFP+ cages, the management jack and the RJ45 console. It has two built-in AC supplies. The box
  holds two power cords, rack ears and a fastening set.


  Rack mounting positions: flush (ears level with the face; as shipped).


