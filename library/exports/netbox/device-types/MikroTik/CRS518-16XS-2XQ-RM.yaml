comments: 'MikroTik CRS518-16XS-2XQ-RM is a fixed 1U Cloud Router Switch with sixteen 25 Gigabit SFP28
  cages and two 100 Gigabit QSFP28 cages, a 100 Megabit management port, an RJ45 serial console and a
  USB type A port, and runs RouterOS v7. The front carries the two QSFP28 cages, the eight stacked pairs
  of SFP28 cages with four arrow lamps each, the console over the management port, RESET, the USB port,
  four status lamps and a chevron vent along the top edge. Two AC inlets, each with its supply built in,
  and four fan openings are on the rear. The brochure calls the supplies and fans hot-swap but prints
  no part number for either, so they are part of the chassis and there are no bays.


  Configuration `base`: CRS518-16XS-2XQ-RM - sixteen 25G SFP28 cages, two 100G QSFP28 cages, a 100 Megabit
  management port, an RJ45 console and a USB type A port, with two hot-swap AC supplies and four hot-swap
  fans (all part of the chassis in this model). The box holds two power cords, rack ears and a fastening
  set.


  Rack mounting positions: flush (ears level with the face; as shipped).


