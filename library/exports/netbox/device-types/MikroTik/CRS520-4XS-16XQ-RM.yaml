comments: 'MikroTik CRS520-4XS-16XQ-RM is a fixed 1U Cloud Router Switch, 443 mm wide with rack ears in
  the box, with sixteen 100 Gigabit QSFP28 cages and four 25 Gigabit SFP28 cages, two 10 Gigabit Ethernet
  ports printed MGMT / BOOT and an RJ45 serial console, and runs RouterOS v7. The front carries the sixteen
  QSFP28 cages in eight stacked pairs with four lamps each, the four SFP28 cages in two stacked pairs,
  the console, RESET, four status lamps, the two Ethernet ports and a vent strip along each edge. The
  rear carries two hot-swap AC supply modules with their C14 inlets and four hot-swap fan modules. The
  brochure prints no part number for the supplies or the fans, so they are part of the chassis and there
  are no bays.


  Configuration `base`: CRS520-4XS-16XQ-RM - sixteen 100G QSFP28 cages, four 25G SFP28 cages, two 10G
  Ethernet ports and an RJ45 console, with two hot-swap AC supplies and four hot-swap fans (part of the
  chassis in this model). The box holds two power cords, rack ears, rear support ears, a cable management
  bracket and a fastening set.


  Rack mounting positions: flush (as shipped).


