comments: 'MikroTik CRS328-4C-20S-4S+RM is a fixed 1U Cloud Router Switch with 20 SFP cages, four SFP+
  cages and four combo ports. Each combo port is a gigabit RJ45 jack (1T to 4T) and an SFP cage (1F to
  4F), one in use at a time. It also has an RJ45 serial console and runs SwOS or RouterOS (dual boot).
  The front carries the 20 SFP cages in two rows of ten, with the odd numbers on the lower row. Next come
  the combo cages and jacks under a COMBO bracket and the four SFP+ cages. The CONSOLE jack, the RESET
  and MODE buttons and the USER, FAULT, PWR 2 and PWR 1 lamps follow. The rear carries two IEC C14 inlets
  (POWER 1 and POWER 2) and two fans. Two supplies are built into the chassis, so there are no bays.


  Configuration `base`: CRS328-4C-20S-4S+RM - 20 SFP cages, four SFP+ cages, four combo RJ45 / SFP ports
  and the RJ45 console, with two built-in AC supplies and two fans. The box holds two IEC power cords
  and rack ears.


  Rack mounting positions: flush (ears level with the face; as shipped).


