comments: 'MikroTik CSS326-24G-2S+RM is a fixed 1U Cloud Smart Switch. It has 24 10/100/1000 Ethernet
  ports and two SFP+ cages, and runs SwOS only. The front carries the 24 jacks in three blocks of four
  columns by two rows. They are numbered 1 to 24 as printed, with the odd number on the lower jack of
  a column. Port 1 is marked POE IN for passive PoE power. A lamp with the port number printed on it sits
  under each jack. The front also has the two SFP+ cages with their ACT/LINK and 10G lamps. It has the
  PWR and USR lamps and the RES reset button, and no console jack. The rear carries the DC jack (DC 8
  - 30V as printed), a cable-restraint slot, the earthing stud and the vents. There is no built-in mains
  supply: a 24 V 1.2 A adapter ships in the box, so there are no power bays. The round opening on the
  rear is a stamped fan-guard grille with four fan-mount holes and no fan fitted. The product page lists
  passive cooling, so no fan is drawn. The CRS326-24G-2S+RM is the sibling with RouterOS and a console
  jack and is its own device.


  Configuration `base`: CSS326-24G-2S+RM - 24 10/100/1000 ports and two SFP+ cages, SwOS only. The box
