comments: 'MikroTik CRS418-8P-8G-2S+RM is a fixed 1U Cloud Router Switch with PoE out and a quad-core
  ARM CPU. It has 16 Gigabit Ethernet ports in two blocks of eight, of which the second block (Ether9-16)
  supplies PoE out (802.3af/at, or 24 V passive), a Gigabit management port printed MGMT/BOOT, an RJ45
  serial console, two SFP+ cages and a USB type A port, and runs RouterOS v7. The front carries the two
  jack blocks, the two cages each with an ACT and a 10G lamp, the USB port, the console over the management
  port, the RESET and MODE buttons, four status lamps and a slanted vent. Two AC inlets, each with its
  own supply built in, and four fan openings are on the rear. The supplies are part of the chassis, so
  there are no bays.


  Configuration `base`: CRS418-8P-8G-2S+RM - 16 Gigabit Ethernet ports (Ether9-16 with PoE out), a Gigabit
  management port, two SFP+ cages, a USB type A port and the RJ45 console, with two built-in AC supplies
  and four fans. The box holds two power cords, rack ears and a K-54 fastening set.


  Rack mounting positions: flush (ears level with the face; as shipped).


