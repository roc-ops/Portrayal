comments: 'Digi Connect IT 16 is a 1U rack-mount serial server (console server) with sixteen RJ-45 RS-232
  serial ports and a console jack. It also has two 10/100/1000 Ethernet ports, two SFP+ cages and two
  USB 3.1 Gen 1 Type A ports. The front carries the console jack and the USB ports in one housing. The
  Ethernet jacks and the SFP+ cages are stacked in pairs. The sixteen serial jacks are in two rows. The
  rear carries two field-replaceable power supplies and a system fan. It also has the CORE module plate
  with two WWAN antenna openings, an SD slot, a reset pinhole and a column of status lamps. One power
  supply kit is mandatory, ITPS-PSEK (port-side exhaust) or ITPS-PSIK (port-side intake).


  Configuration `default`: The unit with one power supply kit fitted, as the rear photograph shows it.
  The page lists the kit as a mandatory accessory and the photograph does not say which of the two it
  is.


  Rack mounting positions: flush (as shipped).


