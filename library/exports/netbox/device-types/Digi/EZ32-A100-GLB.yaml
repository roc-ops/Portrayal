comments: 'Digi Connect EZ 32 is a 1U rack-mount serial server (console server) with thirty-two RJ45 10-pin
  serial ports and a console jack. It also has two 10/100/1000 Ethernet ports, two SFP+ cages and two
  USB 3.1 Gen 1 Type A ports. There is a micro-SD socket and a socket for a Digi CORE plug-in LTE modem.
  The front carries the console jack, the USB ports and the SFP+ and Ethernet jacks stacked in pairs.
  It also has the thirty-two serial jacks in two rows of four blocks of four and a lamp cluster. The rear
  carries two field-replaceable power supply bays, a system fan, the CORE module bay with its two SMA
  antenna jacks and an earth stud. The EZ32-A100-GLB and -C100-GLB carry one AC supply, the -A200-GLB
  and -C200-GLB two, and the -AD00 and -CD00 two DC supplies. The C models add software-selectable RS-232/422/485
  to the RS-232 of the A models. It ships with attachable 19-inch rack ears.


  Configuration `single-ac`: One AC supply in the first bay and a cover over the second, the CORE socket
  covered. This is the build the rear photograph shows apart from the modem. RS-232 on the A100 and RS-232/422/485
  on the C100.


  The ears are 43.5 mm tall, 0.25 mm above the bottom of the chassis. Rack mounting positions: flush (ears
  level with the face; as shipped).


