comments: "Eaton ePDU G3 metered input rack PDU, 1U horizontal, 120 V. A 19 in black metal box, 203.2\
  \ mm deep, that takes a single-phase 120 V feed (a fixed 10 ft cord ending in a NEMA L5-30P, 24 A) and\
  \ hands it on to 12 NEMA 5-20R outlets in two colour-coded sections of six, each on its own 20 A one-pole\
  \ breaker, A (yellow) and B (blue). The controls end carries the hot-swappable meter module (two RJ-45\
  \ ports (serial and daisy-chain), a network RJ-45, a USB-A port, a pixel display and four buttons),\
  \ the two breakers and outlets A1 and A2; the other end carries the cord gland and the remaining ten\
  \ outlets. The meter reads the input and each section.\n\nConfiguration `base`: The PDU as it ships.\
  \ The installation kit (SPK021) and the network kit (SPK013) are listed as included and are not drawn;\
