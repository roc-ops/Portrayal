comments: "Eaton Rack PDU G4, metered input, 0U: a 1730 mm black aluminium strip that hangs on two mounting\
  \ buttons in a rack's vertical channel and hands a three-phase 120/208 V wye feed (a fixed 10 ft cord\
  \ with a NEMA L21-30P plug, 24 A, 8.6 kW) on to 42 outlets - 24 IEC C13 and 18 Eaton C39 - in six colour-coded\
  \ sections of seven. Three 20 A two-pole breakers, A, B and C, each line to line, each feed two sections.\
  \ A hot-swappable network module with two gigabit Ethernet ports, a pixel LCD and four keys sits between\
  \ the two halves.\n\nConfiguration `base`: The PDU as it ships, the network module in its slot.\n\n\
  Mounts on the side of a rack's upright, beside the rack; occupies no rack unit.\n\nPDU class: metered-branch\
  \ (metering-scope branch, outlet-switching false).\n\nInput rating: 208 V three-phase wye, 24 A input\
