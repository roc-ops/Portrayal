comments: "Eaton Tripp Lite series three-phase local metered PDU, 0U. A 1776 mm metal strip that hangs\
  \ on two toolless mounting buttons beside a rack. It takes a 208 V three-phase feed through a fixed\
  \ 6 ft cord that ends in a NEMA L21-30P (24 A, 8.6 kW). It feeds 45 outlets, 36 IEC C13 and 9 IEC C19,\
  \ in three sections of fifteen, each through its own 20 A two-pole breaker. Between the second and third\
  \ sections is a meter with three rows, one for each phase pair. It has no switch and no network port.\n\
  \nConfiguration `base`: The PDU as it ships. The box also holds the removable mounting brackets, the\
  \ removable 90 degree rotation brackets, the cord retention sleeves, the spare buttons and the manual.\
  \ None is drawn loose. The plate the side view shows fitted at the top is drawn.\n\nMounts on the side\
  \ of a rack's upright, beside the rack; occupies no rack unit.\n\nPDU class: metered-branch (metering-scope\
  \ branch, outlet-switching false).\n\nInput rating: 208 V three-phase wye, 24 A input (30 A plug).\n\
  \nDatasheet: Eaton PDU3MV6L2130A product specification page (skuPage.PDU3MV6L2130A)\n  https://www.eaton.com/us/en-us/skuPage.PDU3MV6L2130A.pdf\n\
