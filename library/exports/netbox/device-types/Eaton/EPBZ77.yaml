comments: "Eaton ePDU G3 basic rack PDU, 0U. A 1524 mm metal strip with 24 NEMA 5-20R outlets in one row.\
  \ It takes a single-phase 120 V feed through a fixed 15 ft cord that ends in a NEMA L5-20P (16 A, 1.92\
  \ kW). At the cord end of the face are an inner ground stud, a 20 A push-to-reset circuit breaker and\
  \ a power lamp. It has no display, no switch and no network port.\n\nConfiguration `base`: The PDU as\
  \ it ships, with its fixed 15 ft cord. The 250 mm adapter from the L5-20P plug to a 5-20R is in the\
  \ box and is not drawn.\n\nMounts on the side of a rack's upright, beside the rack; occupies no rack\
