comments: 'Eaton Tripp Lite series B097-016, a 16-port serial console server, 1U, for a desktop or a 19
  inch rack. The rear carries 16 RJ45 serial ports in two rows of eight, two RJ45 Ethernet ports (NET1
  and NET2) and two IEC AC inlets for its two built-in supplies. The front carries an RJ45 console port,
  two USB-A ports and four status lamps. The rack-mount kit fits to the sides of the body.


  Configuration `base`: B097-016 as it ships: two C13 to NEMA 5-15P cords, two Cat5e patch cables, three
  serial adapters, the rack-mount kit and six rubber feet are in the box and are not drawn.


