comments: "Eaton ePDU G3 managed rack PDU, 2U horizontal, 200 to 240 V. A 19 in black metal box, 213.2\
  \ mm deep. It takes a single-phase feed through a fixed 10 ft cord ending in a NEMA L6-30P, 24 A. It\
  \ hands the feed on to 16 IEC C13 outlets in two colour-coded sections of eight. A is yellow on the\
  \ upper row and B blue on the lower, each on its own 20 A two-pole breaker. Every outlet is switched\
  \ and metered. The left of the front carries the cord gland and the network module. The module has two\
  \ stacked RJ-45 ports, a network RJ-45, a USB-A port, a reset button, a display and four buttons. Beside\
  \ it are the two breakers and a lamp tile for each section.\n\nConfiguration `base`: The PDU as it ships.\
  \ The installation kit (SPK021) and the network kit (SPK013) are listed as included. Neither is drawn,\
