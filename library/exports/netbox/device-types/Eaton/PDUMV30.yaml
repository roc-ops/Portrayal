comments: "Eaton Tripp Lite series local metered PDU, 0U. A 1617 mm aluminium strip that hangs on two\
  \ toolless mounting buttons beside a rack. It takes a single-phase 120 V feed through a fixed 10 ft\
  \ cord that ends in a NEMA L5-30P (24 A, 2.88 kW). It feeds 24 NEMA 5-15/20R outlets in two separately\
  \ breakered load banks of twelve. Between the banks are two two-digit meters, one for each bank. It\
  \ has no switch and no network port.\n\nConfiguration `base`: The PDU as it ships. The removable mounting\
  \ brackets, the cord retention brackets, the 14.17 mm spare buttons and the cable ties are in the box\
  \ and are not drawn.\n\nMounts on the side of a rack's upright, beside the rack; occupies no rack unit.\n\
