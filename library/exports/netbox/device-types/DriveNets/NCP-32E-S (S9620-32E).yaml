comments: "DriveNets lists UfiSpace S9620-32E (NOS: dnos).\nDriveNets also calls it: NCP-32E-S.\nListed\
  \ per: DNOS CLI Reference Guide 26.2, `system ncp model`: S9620-32E is among the hardware models DNOS\
  \ accepts for an NCP.\n\nUfiSpace S9620-32E - 2RU 32-port 100/200/400/800G QSFP-DD open aggregation\
  \ router with 4x 1/10/25G SFP28 ports and 2x 10G SFP+ management uplinks; Broadcom Qumran3D BCM88870\
  \ at 25.6 Tbps with a 32 GB deep buffer, Intel Ice Lake-D 8-core with an AST2620 BMC, 1+1 hot-swap 3200W\
  \ AC or DC PSUs, 3+1 hot-swap fans, front-to-back airflow\n\nConfiguration `ac`: Dual 3200W AC PSUs\
  \ (PSU-322-AECR-NN) 1+1, four FAN-805616-HCD fan modules 3+1, front-to-back airflow - the build both\
  \ embedded datasheet renders show. The DC build is dc\n\nAlso sold or listed as: NCP-32E-S\n\nDatasheet:\
  \ UfiSpace S9620-32E 800G Open Aggregation Router Datasheet (2025-06-30)\n  https://www.ufispace.com/files/5E/S9620-32E%20Aggregation%20Router%20Datasheet_2025_0630.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15 Subpart\
  \ B Class A; ICES-003 Class A; EN 55032 Class A; EN 300 386; EN 55035; VCCI CISPR 32 Class A\n- compliance.environment:\
  \ WEEE\n- compliance.safety: UL 62368-1, IEC 62368-1\n- environmental.operating-humidity: 5% to 85%\
  \ RH non-condensing\n- environmental.operating-temp: 0 to 45 C\n- environmental.storage-humidity: 5%\
  \ to 93% RH non-condensing\n- environmental.storage-temp: -40 to 70 C\n- features.forwarding: segment\
  \ routing, SRv6, MPLS, advanced QoS, MACsec point-to-point, a large built-in TCAM and hardware-based\
  \ forwarding with streaming telemetry (datasheet KEY BENEFITS and KEY FEATURES)\n- features.optics-qsfp-dd:\
  \ 800GE QSFP-DD OpenZR+/ZR/2xLR4/2xFR4/DR8+/DR8/SR8; 400GE QSFP-DD OpenZR+/ZR/ER4/LR4/FR4/SR8/DR4/DR4+/PLR4;\
  \ 200GE QSFP56 SR4/FR4; 100GE QSFP28 ZR4/ER4/SR4/LR4 (datasheet Compatible Transceiver Types). The datasheet\
  \ publishes no per-port optical power budget for this platform\n- features.optics-sfp-plus: the two\
  \ management uplinks are listed only as '2 x 10G SFP+ management ports'; the datasheet's Compatible\
  \ Transceiver Types block covers the QSFP-DD field alone, so no module list is published for them and\
  \ none is inferred\n- features.optics-sfp28: the datasheet lists the four ports as 1/10/25G SFP28 and\
  \ its Compatible Transceiver Types block covers only the QSFP-DD field, so no module list is carried\
  \ for them\n- features.timing: Stratum 3E OCXO; SyncE; IEEE 1588v2 (Default, G.8265.1, G.8275.1, G.8275.2,\
  \ SMPTE ST 2059-2), T-BC/OC, T-TC. The datasheet footnotes the whole row 'NOS integration is necessary\
  \ to activate the specific feature' and marks SMPTE ST 2059-2 'Additional license is required'\n- lifecycle.eol:\
  \ none-announced\n- management.console: 1x RJ45 RS-232 and 1x micro-USB, both labelled IOIOI\n- management.oob:\
  \ 1x 100/1000M RJ45 management port\n- management.oob-sfp: 2x 10G SFP+ management ports, numbered 0\
  \ and 1 under an Ethernet-icon bracket, separate from the 32-35 SFP28 traffic ports\n- management.timing-inputs:\
  \ 1x 1PPS input/output SMB and 1x 10MHz input/output SMB; the datasheet's Compatible Timing Cable Types\
  \ names '50 ohms SMB coaxial cable with 10-32UNF-2A connector' for both\n- management.usb: 1x USB 3.0\
  \ Type-A\n- performance.packet-buffer: 32 GB deep buffer\n- performance.switching-capacity: 25.6 Tbps\n\
  - platform.asic: Broadcom Qumran3D BCM88870\n- platform.bmc: ASPEED AST2620\n- platform.cpu: Intel Ice\
  \ Lake-D 8-core @ 1.9GHz with VROC support\n- platform.memory: 64 GB DDR4\n- platform.storage: 2 x 256\
  \ GB SSD\n- power.input-ac: 200 to 240V, 16A\n- power.input-dc: -48 to -60V, 80A\n- power.power-envelope:\
