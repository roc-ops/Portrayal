comments: "IP Infusion lists UfiSpace S9502-16SMT (NOS: ocnos).\nListed per: OcNOS 7.0.1 MR Hardware Compatibility\
  \ List (IP Infusion, July 2026), the row for S9502-16SMT, current supported 'SP 7.0.1'. The names follow\
  \ OcNOS's pattern rather than a table for this box: the port's speed class as prefix (ge 1G, xe 10G\
  \ and 25G, ce 40G and 100G, cd 400G) and one 0-based count across the whole front panel, with eth0 for\
  \ management. That is how the S9510-30XC's own configuration in the OcNOS SP 7.0 Segment Routing Guide\
  \ names its ports - ce0, ce1, xe2 to xe29 - and it is exactly the UfiSpace silkscreen numbering, which\
  \ this box shares. Not every platform counts this way: the AS7316-26XB example in the Layer 3 Guide\
  \ restarts at xe0 after ce0 and ce1, so the rule is applied to UfiSpace boxes whose ports are numbered\
  \ in one run from 0, and nowhere else.\n\nUfiSpace S9502-16SMT disaggregated cell site gateway router\
  \ - 1RU fanless temperature-hardened white box, 4x 100M/1G RJ45 plus 8x 100M/1G SFP and 4x 1/10G SFP+,\
  \ a timing block with 1PPS and 10MHz on SMB and ToD on RJ45 behind a Stratum 3E OCXO, Broadcom Qumran-UX\
  \ at 32 Gbps; power is a FIXED 1+1 supply, not a FRU, and the rear is six passive convection grilles\n\
  \nConfiguration `dc`: Fixed 1+1 120 W DC supply, dual feed, -36 to -75 V on the two three-post screw\
  \ terminal blocks the faceplate carries. This is the build every held elevation and photograph shows,\
  \ and the one the drawing is measured from\n\nDatasheet: UfiSpace S9502-16SMT Disaggregated Cell Site\
  \ Gateway Router Datasheet\n  https://www.ufispace.com/products/telco/access/s9502-16smt-disaggregated-cell-site-gateway\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15, Subpart\
  \ B, Class A; ICES-003, Class A; EN 55032, Class A; EN 55035; EN 300 386; VCCI CISPR 32, Class A; SANS\
  \ 2332, Class A; SANS 2335\n- compliance.environment: RoHS; WEEE\n- compliance.safety: UL 62368-1; IEC\
