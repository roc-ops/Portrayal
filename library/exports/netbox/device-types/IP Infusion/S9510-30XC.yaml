comments: "IP Infusion lists UfiSpace S9510-30XC (NOS: ocnos).\nListed per: OcNOS 7.0.1 MR Hardware Compatibility\
  \ List (IP Infusion, July 2026), the row for S9510-30XC, current supported 'SP 7.0.1'. The names are\
  \ the ones IP Infusion's own S9510-30XC running configuration uses in the OcNOS SP 7.0 Segment Routing\
  \ Guide (edge-node snapshot, software version UFI_S9510-30XC-OcNOS-SP-PLUS-6.6.0): ce0 and ce1, then\
  \ xe2 to xe29, and eth0 for management - which is this faceplate's own numbering, port for port.\n\n\
  UfiSpace S9510-30XC - 1RU FlexE/TSN disaggregated cell site gateway router with 28x 1/10/25G SFP28 and\
  \ 2x 40/100G QSFP28; Broadcom Qumran2u BCM88284 at 360 Gbps with a 2 GB deep buffer, Intel Denverton-NS,\
  \ full timing (GNSS/1PPS/10MHz/ToD/BITS) on a Stratum 3E OCXO, 1+1 hot-swap 400W PSUs, 4+1 hot-swap\
  \ fans, NEBS, -40 to 65 C hardened\n\nConfiguration `dc`: Dual 400W DC PSUs (PSU-401-DISB-1, intake\
  \ airflow) 1+1, five FAN-402825-HD fan modules 4+1 - the build both vendor renders and HIG Figures 5,\
  \ 6 and 8 show\n\nDatasheet: UfiSpace S9510-30XC Datasheet\n  https://www.ufispace.com/products/telco/access/s9510-30xc-flexe-tsn-disaggregated-cell-site-gateway\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15 Subpart\
  \ B Class A; ICES-003 Class A; EN 55032 Class A; EN 300 386; EN 55035; EN 301 489; EN 303 413; EN 62479;\
  \ EN 50663; VCCI CISPR 32 Class A\n- compliance.environment: WEEE\n- compliance.nebs: NEBS GR-63, GR-1089\
  \ and GR-3108 named in the datasheet's Regulatory Compliance section; no NEBS level is claimed there\
  \ and none is claimed here\n- compliance.safety: UL 62368-1, IEC 62368-1\n- environmental.operating-humidity:\
  \ 5% to 85% RH non-condensing\n- environmental.operating-temp: -40 to 65 C (temperature hardened)\n\
  - environmental.storage-humidity: 5% to 93% RH non-condensing\n- environmental.storage-temp: -40 to\
  \ 70 C\n- features.flexe: OIF FlexE 1.1 and 2.0, 200G total bandwidth\n- features.gnss: internal receiver\
  \ for master clock implementations\n- features.optics-qsfp28: 100G QSFP28 SR4/LR4/ER4 (datasheet Compatible\
  \ Transceiver Types; 40/100G with FlexE support)\n- features.optics-sfp28: 25G SFP28 SR/LR/ER, 10G SFP+\
  \ SR/LR/ER/ZR (datasheet Compatible Transceiver Types; HIG Port Overview gives 1/10/25G on these ports)\n\
  - features.srv6: full Segment Routing over IPv6\n- features.timing: Stratum 3E OCXO; SyncE; IEEE 1588v2\
  \ (default, G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2, T-GM, T-BC/OC, T-TC); TSN; Class C accuracy\
  \ - NOS integration required to activate, and SMPTE ST 2059-2 needs an additional licence (the vendor's\
  \ own footnotes)\n- lifecycle.eol: none-announced\n- management.console: RJ45 RS-232 serial, 115200\
