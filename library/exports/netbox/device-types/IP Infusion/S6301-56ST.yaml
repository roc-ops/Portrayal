comments: "IP Infusion lists UfiSpace S6301-56ST (NOS: ocnos).\nListed per: OcNOS 7.0.1 MR Hardware Compatibility\
  \ List (IP Infusion, July 2026), the row for S6301-56ST, current supported 'DC 7.0.1'. The names follow\
  \ OcNOS's pattern rather than a table for this box: the port's speed class as prefix (ge 1G, xe 10G\
  \ and 25G, ce 40G and 100G, cd 400G) and one 0-based count across the whole front panel, with eth0 for\
  \ management. That is how the S9510-30XC's own configuration in the OcNOS SP 7.0 Segment Routing Guide\
  \ names its ports - ce0, ce1, xe2 to xe29 - and it is exactly the UfiSpace silkscreen numbering, which\
  \ this box shares. Not every platform counts this way: the AS7316-26XB example in the Layer 3 Guide\
  \ restarts at xe0 after ce0 and ce1, so the rule is applied to UfiSpace boxes whose ports are numbered\
  \ in one run from 0, and nowhere else.\n\nUfiSpace S6301-56ST - 1RU 48-port 1G RJ45 L2/L3 OOB management\
  \ switch with 8x 1G/10G SFP+ uplinks; Broadcom Trident3-X2, Intel Denverton, 1+1 hot-swap 150W AC or\
  \ DC PSUs, 1+1 hot-swap fans, front-to-back or back-to-front airflow\n\nConfiguration `dc`: Dual 150W\
  \ DC PSUs (PSU-151-DESR) 1+1, dual FAN-402825-HDN fan modules 1+1, front-to-back airflow - the build\
  \ the vendor's rear render shows\n\nDatasheet: UfiSpace S6301-56ST Datasheet\n  https://www.ufispace.com/products/datacenter/1g/s6301-56st-l2-l3-management-switch\n\
  \nFacts carried in the model that this schema has no field for:\n- compliance.emc: FCC Part 15 Subpart\
