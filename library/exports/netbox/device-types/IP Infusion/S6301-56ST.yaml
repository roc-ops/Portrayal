  \ 5% to 95% RH non-condensing\n- environmental.storage-temp: -40 to 70 C\n- features.optics-sfp-plus:\
  \ 10G SFP+ SR/LR/ER/ZR (datasheet Compatible Transceivers; 80 km / 1G-10G per HIG Port Overview)\n-\
