comments: "Enlogic EN2 PDU, 0U: a 1826 mm dark strip, 56 mm wide and 75 mm deep, that hangs on two toolless\
  \ buttons beside a rack and hands a three-phase 208 V delta feed (a fixed 1.8 m cord with a CS8365 plug\
  \ (the data sheet writes CS8365L), 50 A (40 A derated)) on to 42 switched outlets - 21 C13/C15 and 21\
  \ C13/C15/C19 combination outlets - in six colour-coded banks, each behind its own 20 A double-pole\
  \ breaker, with a hot-swap network management module (display, two Ethernet ports, USB-C and two sensor\
  \ ports) between banks three and four.\n\nConfiguration `base`: The PDU as the drawing shows its default:\
  \ a black chassis, the default plug, a 1.8 m cord and top feed. The other plugs, colours, cord lengths\
  \ and bottom feed of the identification table are options and are not drawn.\n\nMounts on the side of\
  \ a rack's upright, beside the rack; occupies no rack unit.\n\nPDU class: switched-metered-branch (metering-scope\
  \ branch, outlet-switching true).\n\nInput rating: 208 V three-phase delta, 40 A input (50 A plug).\n\
