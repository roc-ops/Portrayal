comments: "Enlogic EB basic PDU, 0U: a 1780 mm dark strip, 56 mm wide and 75 mm deep. It hangs on two\
  \ toolless buttons beside a rack. It hands a three-phase 208 V delta feed on to 42 unswitched outlets,\
  \ 21 C13/C15 and 21 C13/C15/C19 combination outlets in 21 columns of two. The feed is a fixed 1.8 m\
  \ cord with an IEC 60309 3P+E 9h plug, 60 A derated to 48 A, 17.3 kVA. Six 20 A double-pole breakers\
  \ feed the columns. No meter, no display, no network interface.\n\nConfiguration `base`: The PDU as\
  \ the drawing shows its default: a black chassis, the IP44 plug, a 1.8 m cord and top feed. The other\
  \ plugs, colours, cord lengths and bottom feed of the identification table are options and are not drawn.\n\
  \nMounts on the side of a rack's upright, beside the rack; occupies no rack unit.\n\nPDU class: basic\
  \ (metering-scope none, outlet-switching false).\n\nInput rating: 208 V three-phase delta, 48 A input\
  \ (60 A plug).\n\nDatasheet: Enlogic EB0952, Basic PDU data sheet - EB series (2 pages read of 3)\n\
