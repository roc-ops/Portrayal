comments: "Enlogic EN2 PDU, 0U: a 1750 mm dark strip, 52 mm wide and 75 mm deep at the breakers. It hangs\
  \ on two toolless buttons beside a rack. It hands a single-phase 208 V feed on to 36 switched outlets.\
  \ They are 30 IEC C13 and 6 IEC C19, in two colour-coded banks of three groups. The feed is a fixed\
  \ 3 m cord with a NEMA L6-30P plug, 30 A derated to 24 A, 5.0 kVA. Each bank sits behind its own 20\
  \ A double-pole breaker. A hot-swap network management module between the banks carries a display, two\
  \ Ethernet ports, USB-C and two sensor ports. Input metered, outlet switched.\n\nConfiguration `base`:\
  \ The PDU as the drawing shows it: a black chassis, the L6-30P plug, a 3 m cord and top feed.\n\nMounts\
  \ on the side of a rack's upright, beside the rack; occupies no rack unit.\n\nPDU class: switched-metered-branch\
  \ (metering-scope branch, outlet-switching true).\n\nInput rating: 208 V single-phase, 24 A input (30\
  \ A plug).\n\nDatasheet: Enlogic EN2333, Input metered PDU - EN2 series data sheet (2 pages read of\
