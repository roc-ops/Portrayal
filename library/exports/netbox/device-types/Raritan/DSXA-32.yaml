comments: "Raritan Dominion SX DSXA-32, a 32-port serial console server with dual AC power, one Ethernet\
  \ port and a built-in modem, 1U. The rear carries two AC inlets, each with a power switch, and a modem\
  \ jack. It has a DB9 terminal port, a 10/100 Ethernet jack, three lamps and a reset hole. Thirty-two\
  \ RJ45 serial ports sit in four groups of two rows of four.\n\nConfiguration `base`: DSXA-32, the 32-port\
  \ unit with dual AC power, one Ethernet port and a built-in modem. The rack kit is not drawn.\n\nRack\
  \ mounting positions: flush (\"bracket mount\"; as shipped).\n\nDatasheet: Dominion SX data sheet, V1008R3\
  \ (2008), Raritan\n  https://www.raritan.com/assets/ram/resources/data_sheets/raritan-ds-DominionSX.pdf\n\
  \nFacts carried in the model that this schema has no field for:\n- environmental.operating-humidity:\
