comments: 'Raritan PX4-132AWA-E7M26V2 rack PDU, 0U: a black strip 56 mm wide, 65 mm deep and 1780 mm long
  for a rack''s vertical channel. It has 18 IEC C13 and 18 Cx locking outlets in six groups, six 20 A
  breakers and a replaceable controller in the middle. A keyed Legrand Universal Input connector takes
  the cord.


  Configuration `base`: The PDU as it ships, without a cord. A Legrand Universal Input Cord is a separate
  part number and is not drawn.


  Mounts on the side of a rack''s upright, beside the rack; occupies no rack unit.


  PDU class: metered-input (metering-scope input, outlet-switching false).


  Facts carried in the model that this schema has no field for:

  - management.metering-scope: input

  - management.outlet-switching: false

  - physical.construction: metal strip

  - physical.length-mm: 1780

  - power.breakers: six 20 A 2-pole breakers, 10 kAIC

  - power.input-cord: detachable


