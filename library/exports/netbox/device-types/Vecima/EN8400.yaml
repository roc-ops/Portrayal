comments: 'Entra EN8400 Remote PHY node, the DOCSIS 4.0 member of the family, in the same finned cast
  housing as the EN8100. It opens along its middle into a base half and a lid half and hangs from a strand
  on two clamps. It differs from the EN8100 in its six port entry modules, which have screwless stinger
  seizures and are rated to 1.8 GHz, and in an orange 1.8 GHz label on the front; its RF amplifier modules
  are the 1.2 GHz ones until a 1.8 GHz module is released. The base carries the power: two power entry
  covers over six port entry modules, two RF amplifier modules, one or two power supply modules and the
  power distribution module. The lid carries one or two access modules, an optional forward injection
  module, the lid distribution module with its two SFP+ Ethernet ports, and the fibre tray. Each end carries
  two RF/AC ports, one AC-only port, two RF test ports and a fibre entry port, closed by stainless plugs;
  the ports under the plugs are not modelled. The EN8100 is the same housing with the earlier port entry
  module and is a device of its own. The faces are drawn as installed, rotated 180 degrees from the guide''s
  lid-up photographs: the lid hangs below the base. The fibre plug is on the lower half of each end and
  the tall stepped fins are on the lower half of each long side.


  Configuration `2am-2x4`: Two 1x2 access modules and the forward injection module: two downstream and
  four upstream service groups (guide p38 and p52).


  Strand-mounted; not rack-mounted.


