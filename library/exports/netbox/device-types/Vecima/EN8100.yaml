comments: 'Entra EN8100 Remote PHY node, an outdoor hybrid fibre-coax node in a finned cast housing that
  opens along its middle into a base half and a lid half. It hangs from a strand on two clamps. The base
  carries the power: two power entry covers over six port entry modules, two RF amplifier modules, one
  or two power supply modules and the power distribution module. The lid carries one or two access modules,
  an optional forward injection module, the lid distribution module with its two SFP+ Ethernet ports,
  and the fibre tray. Each end carries two RF/AC ports, one AC-only port, two RF test ports and a fibre
  entry port, closed by stainless plugs; the ports under the plugs are not modelled. The EN8400 is the
  same housing with a different port entry module and is a device of its own. The faces are drawn as installed,
  rotated 180 degrees from the guide''s lid-up photographs: the lid hangs below the base. The fibre plug
  is on the lower half of each end and the tall stepped fins are on the lower half of each long side.


  Configuration `2am-2x4`: Two 1x2 access modules and the forward injection module: two downstream and
  four upstream service groups (guide p38 and p52).


  Strand-mounted; not rack-mounted.


