comments: 'UfiSpace N3100-4C 5G timing adapter - a full-height PCIe Gen4 x16 add-in card that offloads
  the PTP stack and servo from a COTS server for O-RAN fronthaul timing. Stratum 3E OCXO, Cyclone V SoC
  FPGA and an Intel E-810 controller behind 4x 10G/25G SFP28 ports, with GNSS in on SMA and 1PPS / 10MHz
  in/out on SMB. Class C timing accuracy (G.8273.2), T-GM / T-BC / OC roles, SyncE and G.8275.1. The face
  is its bracket, seen from outside the chassis.


  Facts carried in the model that this schema has no field for:

  - bus: PCIe Gen4 x16 (Gen3 compatible)

  - clock-specs: G.8271.1, G.8272 PRTC, G.8273.2 T-BC/T-TSC, G.8273.4 APTS (via firmware upgrade), G.8262
  EEC, G.8262.1 eEEC, G.8264 ESMC

  - controller: Intel E-810

  - cooling: host airflow, 500 LFM required (no onboard fans)

  - emc: FCC Part 15, Subpart B, Class A

  - eol: none-announced

  - fpga: Intel Cyclone V SoC

  - management-interface: managed from the host DU server - ufiCardMgmt CLI over the E-810 network interface
  to the card''s management IP; UFI PTP Timing Software

  - operating-humidity: 5 to 95 percent RH noncondensing

  - operating-temp-c: 0 to 55

  - optics-sfp28: 25G SFP28 SR/LR, 25G SFP28 CR DAC, 10G SFP+ SR/LR, SFP+ Twinax (datasheet supported-accessories
  list)

  - oran-sync: O-RAN LLS C1, C2, C3 synchronization topologies

  - os-support: CentOS, Ubuntu (ice driver 1.7.16+, NVM 3.20+)

  - oscillator: Stratum 3E OCXO

  - pcie-connector: x16

  - pcie-generation: 4

  - pcie-height: full

  - power-draw-max-w: 48

  - power-draw-typical-w: 34

  - power-input: host PCIe slot

  - role: timing-adapter

  - safety: UL 62368-1, IEC 62368-1

  - sfp28: 4

  - slot-compatibility: one open PCIe slot, x4, x8 or x16, Gen3 or Gen4

  - storage-humidity: 5 to 93 percent RH noncondensing

  - storage-temp-c: -40 to 70

  - timing-accuracy: ITU-T G.8273.2 Class C

  - timing-cables: SMA coax with 1/4-36UNS-2B connector for GNSS; SMB coax with 10-32UNF-2A connector
  for 1PPS and 10MHz

  - timing-roles: IEEE 1588v2 T-GM, T-BC/OC (G.8275.1 telecom profile); SyncE with ESMC; PTP offload and
