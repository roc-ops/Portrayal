comments: 'CommScope (ARRIS) BD31A8-100-H10F-0-AL - the quad-density "zero-slot" back plate behind a CA3008
  carrier of eight HT358xH transmitters, seated in the rear of the carrier''s two slots: eight LC/APC
  optical outputs, one per transmitter, a cooling fan, and nine F-type RF inputs - one common broadcast
  (BC) input split to all eight and eight narrowcast inputs, one per transmitter.


  Facts carried in the model that this schema has no field for:

  - optical-insertion-loss: 0.2 dB typical, 0.3 dB max

  - rf-inputs: 1 BC and 8 NC

  - slots: 2


  Optical ports not exported: optical-1-2, optical-3-4, optical-5-6, optical-7-8. Each is a fibre adapter
  with no fibre path modelled behind it: not an interface, because an interface type names a signal and
  a passive adapter carries whatever the fibre does, and not a front/rear port pair, because that needs
  a path to a trunk.

  Contract version 1.0.0 (commscope/bd31a8-h10f).'
