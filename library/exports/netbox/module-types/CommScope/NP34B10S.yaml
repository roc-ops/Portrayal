comments: 'CommScope (ARRIS) NP34B10S - single-fiber 10-channel CWDM filter for cellular backhaul on duplex
  LC/UPC: five CWDM wavelengths (1430-1510 nm) transmitted to the tower and five (1530-1610 nm) received,
  the common network port and a -20 dB test port. A passive half-depth module for the CH3000: it seats
  in the front or the rear half of a slot.


  Facts carried in the model that this schema has no field for:

  - role: passive


  Optical ports not exported: port-1, port-2, port-3, port-4, port-5, port-6. Each is a fibre adapter
  with no fibre path modelled behind it: not an interface, because an interface type names a signal and
  a passive adapter carries whatever the fibre does, and not a front/rear port pair, because that needs
  a path to a trunk.

  Contract version 1.0.0 (commscope/np34b10s).'
