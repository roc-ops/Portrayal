comments: 'Nokia FNIO-B (3FE 54057 AA), the FE/GE NT I/O applique of the 7360 ISAM FX and Lightspan FX,
  used with the FANT-F NT board. Seats in the NTIO slot between the two NT boards and gives the shelf
  up to eight GE uplinks: four SFP ports (1-4) and four combo ports (5-8), each either an SFP or an RJ45
  10/100/1000BASE-T. Authored upright, as the Unit Data Sheet guides draw it: ejector and thumbscrew at
  each end, a 2 x 5 lamp block (ALM, PWR, ports 1-8) under the top ejector, eight SFP cages on a sawtooth
  faceplate that angles each cage 45 degrees for fibre bend radius, two marks, then the four combo RJ45s
  stacked in one framed opening beside the bottom lever.


