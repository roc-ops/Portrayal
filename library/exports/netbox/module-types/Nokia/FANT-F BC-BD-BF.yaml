comments: 'Nokia FANT-F BC / BD / BF (3FE53701BC, BD, BF), the ANSI network termination card version F
  of the 7360 ISAM FX and Lightspan FX, with a 480 Gbps switch. Four SFP+ ports X1-X4 in a sawtooth housing
  just under the lamps, whose facets tip the cages up, then the 1PPS and 10 MHz SMA timing jacks flat
  on the plate and the front uplink 10/100/1000Base-T, CRAFT and ToD/1PPS ports (RJ45), and the ALM/PWR/A/S
  lamps plus one lamp per SFP+. No ACO switch and no BITS jacks. Stands vertically in the FX-16 and FX-12
  and is turned in the FX-8 and FX-4.


