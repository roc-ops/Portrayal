comments: 'Nokia (Alcatel-Lucent) 7750 SR / 7450 ESS 48-port 10/100/1000 copper MDA-XP, M48-1GB-XP-TX
  (3HE05160AA; ESS 3HE05159AA), a classic half-slot MDA for the IOM3-XP: eight mini-RJ21 (MRJ21) connectors
  on end across the face, each carrying six 10/100/1000 ports (connector 1 ports 1-6 through connector
  8 ports 43-48) to a breakout cable. It has no per-port lamps: six Port LEDs at the left show the six
  ports of whichever connector the Push to Scroll button has selected, and eight Connector LEDs at the
  right show which one that is. Stat and Pwr lamps at the left, the ESD mark and the model legend at the
  lower right, and a slotted captive screw on each lower end wing. The card is 2:1 oversubscribed. Authored
  horizontal; an SR-12 IOM3-XP seats it on end with the carrier.


