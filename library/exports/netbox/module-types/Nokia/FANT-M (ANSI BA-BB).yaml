comments: 'Nokia 7360 ISAM FX FANT-M network termination (NT) card, ANSI build - part 3FE79270BA and its
  temperature-hardened twin 3FE79270BB, which share this face. A 2.0 Tbps switch and the shelf''s management,
  alarm and timing controller, seated at NT-A and/or NT-B of an FX-16, FX-8 or FX-4 shelf. Authored upright,
  as the Unit Data Sheet draws it; the FX-4 and FX-8 bays turn it with rotate 90. Down the face - thirteen
  status lamps, 1 PPS and 10 MHz SMA jacks, two QSFP28 and two SFP+ cages in a raised housing, a micro-USB
  debug port, a 10/100/1000 Base-T jack, the LCRT craft jack and the ToD/PPS jack. The ETSI build (AA/AB)
  is a different face with BITS jacks and an ACO switch, and is nokia/fant-m-etsi@1.


