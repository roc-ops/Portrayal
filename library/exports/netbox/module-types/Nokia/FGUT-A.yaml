comments: 'Nokia FGUT-A (3FE 76986 AA, AD and CD), the 16-port Multi-PON line termination board of the
  7360 ISAM FX and Lightspan FX: GPON, XGS-PON or Multi-PON (MPM) on any port, 25GS-PON on the even ports,
  with a traffic manager. Authored upright, as the Unit Data Sheet guides draw it: thumbscrew and unit
  label at the top, sixteen optical cages down the face each with its PON lamp and printed numeral on
  the left, then an ESD and a hot-surface mark, the ALM and PWR lamps, a label and the bottom thumbscrew.
  AA, AD and CD are functional variants with one faceplate, so they are one component and the part number
  is a field.


