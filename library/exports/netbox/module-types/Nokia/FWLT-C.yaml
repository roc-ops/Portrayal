comments: 'Nokia FWLT-C (3FE 74981 AA, AD, BD and CD), the 16-port Multi-PON line termination card of
  the 7360 ISAM FX and Lightspan FX: GPON, XGS-PON or Multi-PON (MPM, GPON + XGS-PON) on every port and
  25GS-PON on the even ports, in sixteen SFP-DD cages numbered 1 to 16. Authored upright, as the guides
  draw it: thumbscrew and ejector at each end, a product label under the top screw, one long block of
  sixteen cages on a 20.6 mm pitch, each with two PON lamps on its left, then the ESD and hot-surface
  marks, the ALM / PWR lamps and a label at the bottom. The four part numbers share one face (AD and CD
  are software-linked component variants, BD the US-made BEAD build), so they are one component.


  Facts carried in the model that this schema has no field for:

  - part-number: 3FE 74981 AA / AD / BD / CD

  - power-draw-max-w: 98

  - power-draw-typical-w: 92

  - power-scope: the highest mode the Safety Manual lists, 8 x 25GS-PON; GPON mode is 71 W max (66 typ),
  XGS-PON 89 (84), MPM XGS/GPON 95 (90). Includes the optics, per the note that PON line-card figures
  include their optics

  - weight-kg: 2.76

  - xgs-pon: 16

  Contract version 1.2.0 (nokia/fwlt-c).'
