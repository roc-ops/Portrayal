comments: 'Nokia LPWR-F, the DC power module of the Lightspan MF-8 shelf, in its two builds: LPWR-F AA
  (3FE 79723 AA, maximum 80 A, a 2 x 40 A breaker) and LPWR-F AB (3FE 79723 AB, maximum 100 A, a 2 x 50
  A breaker). Two sit side by side in the PWR 1 and PWR 2 slots at the foot of the slot area and give
  the shelf power redundancy. Left to right: a module locking screw, the elevated connector block under
  its semi-transparent door (the two-stud BAT terminal showing through the left half, the energy hazard
  label covering the right half over the two-stud RET terminal, the door lock and the PWR lamp at its
  lower left), the circuit breaker with its ON/OFF rocker and the current marker beneath it, the handle,
  the second locking screw and the ESD mark. The two builds have one face and differ only in the printed
  marker, which is the `rating` field: "2 X 40A" on the AA, "2X 50A" on the AB.


