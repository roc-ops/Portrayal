comments: 'Nokia NGFC-G (3FE 65676 AA), the general facilities card of the ANSI 7360 ISAM FX-4 shelf (NFXS-F
  BB). It lies horizontally as the bottom row of the shelf, and it is the shelf''s -48 V DC power interface:
  a four-position barrier terminal block (two EBATRET, EBAT-A, EBAT-B, each for a single-hole M5 lug)
  at the left end, then the 50-pin micro D-sub for CO alarm I/O, the six-pin recessed BITS wire-wrap header,
  the DB-9 remote craft port, and the lamp field - BAT A and BAT B presence, six fuse-status lamps, critical,
  major and minor alarm lamps and the ACO lamp. Its six 10 A branch fuses are on the board and not user
  accessible, so nothing of them shows on the face but their lamps.


  Facts carried in the model that this schema has no field for:

  - branches: 2 (A and B), each split into three feeds, 2 x 26 A (redundant)

  - fuses: 6 x 125 V / 10 A quick-acting SMD, three per branch, on the board, not user accessible

  - hot-insertable: no

  - input-voltage: -48 V DC nominal (-40.5 to -60 V DC at the shelf connection point)

  - part-number: 3FE 65676 AA

  - role: general-facilities-card

  - shelf: NFXS-F BB (7360 ISAM FX-4, ANSI)

  Contract version 1.0.0 (nokia/ngfc-g).'
