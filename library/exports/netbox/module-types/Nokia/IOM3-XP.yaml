  amber fault. Authored horizontal, as the guide draws it; the SR-12''s vertical slots seat it at rotate
  90, which puts MDA slot 1 at the top. Takes classic MDAs and MDA-XPs, not MDA-e (SR12 p67 Table 11),
  and an FP2 card fails at fabric-speed-b and -c (SR12 p57, p63).


