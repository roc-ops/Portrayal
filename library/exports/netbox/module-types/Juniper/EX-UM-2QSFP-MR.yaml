comments: 'Juniper EX-UM-2QSFP-MR, the two-port 40/100 Gbps QSFP+/QSFP28 uplink module of the EX4300-48MP
  switches. It slides into the uplink module slot below the status block at the right end of the front
  panel. It has two QSFP28 cages side by side, numbered 0 and 1. Each takes a QSFP+ transceiver at 40
  Gbps or a QSFP28 transceiver at 100 Gbps. Each port has four link activity lamps above its cage, for
  the four 10 Gbps channels of a breakout cable. Two captive screws hold it and a handle along the bottom
  pulls it out. It ships with a dust cover in one port.


  Facts carried in the model that this schema has no field for:

