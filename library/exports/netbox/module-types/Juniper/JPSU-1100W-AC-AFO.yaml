comments: 'JPSU-1100W-AC-AFO, a 1100 W AC power supply with port-to-FRU (front-to-back) airflow (AIR OUT).
  It is a field-replaceable unit, hot-removable and hot-insertable, with a 12 V output and a 12 V standby,
  and it load-shares with its twin (2N). The QFX5210 hardware guide says the QFX5210-64C-AFO takes two,
  in slots 0 and 1 at the two ends of the FRU panel. The face carries an appliance inlet turned on its
  side with a cord retainer over it. The guide''s cords end in a C15 coupler, and the drawn opening is
  the registry''s closest shape. It also has a tall gold handle, one round bi-colour lamp and a black
  ejector lever. The power supply has its own fan. The back-to-front sibling is JPSU-1100W-AC-AFI. AC
  and DC supplies, and supplies of different airflow direction, are never mixed in one chassis.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: 90 to 264 VAC, 50 to 60 Hz, 12 A at 100 VAC or 6 A at 240 VAC (guide Table 18)

  - power-output-w: 1100

  - role: ac-power-supply

  Contract version 1.0.0 (juniper/qfx5210-jpsu-1100w-ac-afo).'
