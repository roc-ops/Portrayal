comments: 'JPSU-850W-DC-AFO, a DC power supply with front-to-back (port-to-FRU) airflow (AIR OUT). It
  is a field-replaceable unit, hot-removable and hot-insertable, and load-shares with its twin. The QFX5200
  hardware guide says the QFX5200-32C takes it (the -32C-L takes AC supplies only), two to a switch, in
  the slots at the right of the FRU panel. The face carries four terminal studs in a row labelled V-,
  V-, V+ and V+ (the two V+ are shunted internally, as are the two V-), a protective earthing screw beside
  them, three lamps labelled IN, OUT and !, a Juniper Gold latch and an ejector lever. The back-to-front
  sibling is JPSU-850W-DC-AFI. AC and DC supplies are never mixed in one 32C chassis, and supplies of
  different airflow direction are never mixed in any.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: rated -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum (QFX5200-32C, guide Table
  25)

  - power-output-w: 850

  - role: dc-power-supply

  Contract version 1.1.0 (juniper/qfx5200-jpsu-850w-dc-afo).'
