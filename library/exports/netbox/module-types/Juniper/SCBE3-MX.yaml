comments: 'Juniper MX Series Enhanced Switch Control Board 3 (SCBE3-MX) - the ZF-based fabric and control
  carrier for the MX240, MX480 and MX960 (CLI name SCBE3-MX-S, Junos 18.4R1 and later). It seats in the
  same SCB slots as the SCB-MX, SCBE and SCBE2-MX. The face carries the OK/FAIL, FABRIC ACTIVE and FABRIC
  ONLY lamps at the left end, a blank Routing Engine slot, two SFP+ XGE cages with LINK lamps, the GPS
  lamp, the RJ-45 EXT CLK jack and an ejector lever at each end. Its Routing Engine slot holds nothing
  in this library (RE-S-1800 and RE-S-X6 are not modelled).


  Facts carried in the model that this schema has no field for:

  - fabric-bandwidth: up to 1 Tbps per slot (four fabric planes), 1.5 Tbps per slot with all six planes
  (MPC10E line cards)

  - generation: 3rd

  - power-draw-max-w: 425

  - sfp-plus: 2

  Contract version 1.0.0 (juniper/scbe3-mx).'
