comments: 'JPSU-650W-DC-AFI, a 650 W DC power supply with FRU-to-port airflow, which the datasheet calls
  back-to-front. It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares with
  its twin. The datasheet says the QFX5100-48S, QFX5100-48T and QFX5100-24Q take it. The 1RU models seat
  two, in slots 0 and 1 at the right of the rear. The face carries four terminals labelled V-, V-, V+
  and V+, an ESD grounding point and three lamps labelled IN, OUT and !. It also has a handle at the left
  and a black ejector lever. The V- terminals are shunted together inside the supply, as are the V+ terminals.
  The front-to-back sibling is JPSU-650W-DC-AFO. AC and DC supplies, and supplies of different airflow
  direction, are never mixed in one chassis.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - input: rated -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum (guide, Table 17)

  - power-output-w: 650

  - role: dc-power-supply

  Contract version 1.1.0 (juniper/qfx5100-jpsu-650w-dc-afi).'
