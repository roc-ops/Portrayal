comments: 'Juniper JPSU-550-C-DC-AFI, the 550 W DC power supply of the EX4400 switches, back-to-front
  airflow (AFI). The guide ships it with the EX4400-24T-DC-AFI and EX4400-48T-DC-AFI, and takes the 550
  W DC units for the EX4400-24X and -48F as well. Up to two fit in the rear slots 0 and 1, and a second
  unit gives 1+1 redundancy. The face is that of the front-to-back unit with a blue (Juniper Azure Blue)
  handle across the fan. Like that unit it has a D-sub 3W3 DC input with two jackscrew standoffs, a DC
  OK lamp and an ejector lever. Do not mix AC and DC supplies, or supplies with different airflow, in
  one chassis.


  Facts carried in the model that this schema has no field for:

