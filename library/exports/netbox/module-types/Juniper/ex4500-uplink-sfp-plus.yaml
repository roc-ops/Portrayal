comments: 'The 4-port SFP+ uplink module of the Juniper EX4500 switches. It slides horizontally into either
  of the two uplink module slots on the front panel, PIC 1 at the left or PIC 2 at the right. It has four
  SFP+ cages side by side, numbered 0 to 3, each taking a 10 Gbps SFP+ transceiver or a 1 Gbps SFP transceiver.
  A link and activity lamp and a status lamp for each port, and one ST lamp, sit along the top edge. Two
  captive screws hold it. It ships with dust covers in the ports and is hot-insertable and hot-removable.
  The guide gives no Juniper part number for it.


  Facts carried in the model that this schema has no field for:

  - ports-note: four SFP+ ports, each at 10 Gbps with SFP+ or 1 Gbps with SFP, usable as Virtual Chassis
  ports

