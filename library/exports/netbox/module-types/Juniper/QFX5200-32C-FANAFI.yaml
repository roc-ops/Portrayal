comments: 'QFX5200-32C-FANAFI, a field-replaceable fan module with back-to-front (FRU-to-port) airflow:
  air comes in at the fan end and leaves at the port side. It is marked AIR IN, has a Juniper Azure Blue
  handle, and is hot-removable and hot-insertable. The QFX5200 hardware guide says the QFX5200-32C and
  the QFX5200-32C-L take it, five to a switch (fan modules 0 to 4, left to right), and that the same module
  serves the -AFI and -LAFI builds. The front-to-back sibling is QFX5200-32C-FANAFO. The two are never
  mixed in one chassis, and never with power supplies of the other direction. The status lamp is on the
  chassis strip beside each slot, not on the module.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - power-absent: not-published

  Contract version 1.0.0 (juniper/qfx5200-32c-fan-afi).'
