comments: 'Juniper JNP-FAN-1RU, the 1 U universal fan tray of the EX9251 (the guide calls it "Fan Tray,
  Front to Back Airflow - AFO" in the CLI table and shows it labelled AIR OUT). Air enters at the port
  panel and leaves at the rear. The face is a square with a hexagonal grille above and below a moulded
  handle band that carries the AIR OUT chip, a grip at each end of the band, and a captive screw at the
  top left. Each tray holds one counter-rotating fan. The EX9251 seats three, in rear slots 0 to 2 from
  the left. They are hot-removable and hot-insertable. The guide describes no back-to-front tray, so there
  is no AFI sibling.


