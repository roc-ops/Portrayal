comments: 'Juniper JPSU-650W-AC-AFI, a 650 W AC power supply with FRU-to-port airflow (AFI), which the
  guide also calls back-to-front. It is a field-replaceable unit, hot-removable and hot-insertable while
  the second supply runs. The EX4600 hardware guide lists it for the EX4600-40F-AFI. The EX4600 seats
  two, in slots 0 and 1 at the right of the rear. The same supply is used in the QFX5100 switches. The
  face has three lamps labelled AC, DC and !. It also has a blue handle with the label AFI, a C14 appliance
  inlet turned on its side and a black ejector lever. Never mix it with AFO supplies, DC supplies or AIR
  OUT fan modules. The older part number is QFXC01-PWRACI-650A.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - input: 100 to 240 VAC, 50 to 60 Hz (guide Table 16)

  - power-output-w: 650

  - role: ac-power-supply

  Contract version 1.0.0 (juniper/ex4600-jpsu-650-ac-afi).'
