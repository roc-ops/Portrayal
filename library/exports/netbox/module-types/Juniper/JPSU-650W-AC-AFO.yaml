comments: 'JPSU-650W-AC-AFO, a 650 W AC power supply with port-to-FRU airflow, which the guide also calls
  front-to-back. It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares with
  its twin. The QFX5100 hardware guide says the QFX5100-24Q, QFX5100-48S, QFX5100-48SH, QFX5100-48T and
  QFX5100-48TH take it. The 1RU models seat two, in slots 0 and 1 at the right of the rear. The older
  part number is QFXC01-PWRACO-650A. The face carries three lamps labelled AC, DC and !. It also has a
  handle lettered AFO in Juniper Gold, a C14 appliance inlet turned on its side and a black ejector lever.
  The back-to-front sibling is JPSU-650W-AC-AFI. AC and DC supplies, and supplies of different airflow
  direction, are never mixed in one chassis.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: 110 to 240 VAC single phase (datasheet); the 1RU rating table of the guide is empty

  - part-number-older: QFXC01-PWRACO-650A

  - power-output-w: 650

  - role: ac-power-supply

  Contract version 1.0.0 (juniper/qfx5100-jpsu-650w-ac-afo).'
