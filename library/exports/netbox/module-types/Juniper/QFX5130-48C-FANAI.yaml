comments: 'QFX5130-48C-FANAI, the field-replaceable fan module of the QFX5130-48C and QFX5130-48CM with
  back-to-front airflow (AIR IN, FRU-to-port). Air comes in at the fan end and leaves at the port side.
  It is marked AIR IN on a grey chip on its Juniper azure blue handle band. It is hot-removable and hot-insertable.
  The chassis takes six, in slots 0 to 5 from the left, and cannot run on five: its redundancy is at the
  rotor level. The front-to-back sibling is QFX5130-48C-FANAO. The two are never mixed in one chassis,
  and never with supplies of the other direction. The datasheet orders it as QFX5130-48C-FANAI; the hardware
  guide''s Tables 4 and 17 print the same module as QFX5130-48C-FANAFI. The status lamp is on the module,
  at the lower right of its face.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - hot-swap: yes

  - power-absent: not-published

  - role: chassis-fan

  Contract version 1.0.0 (juniper/qfx5130-48c-fan-afi).'
