comments: 'JPSU-850W-DC-AFI, a DC power supply with back-to-front (FRU-to-port) airflow (AIR IN). It is
  a field-replaceable unit, hot-removable and hot-insertable, and load-shares with its twin. The QFX5200
  hardware guide says the QFX5200-32C takes it (the -32C-L takes AC supplies only), two to a switch, in
  the slots at the right of the FRU panel. The face is that of the front-to-back supply with a Juniper
  Azure Blue latch: four terminal studs in a row labelled V-, V-, V+ and V+, a protective earthing screw,
  three lamps labelled IN, OUT and !, and an ejector lever. The front-to-back sibling is JPSU-850W-DC-AFO.
  AC and DC supplies are never mixed in one 32C chassis, and supplies of different airflow direction are
  never mixed in any.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - input: rated -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum (QFX5200-32C, guide Table
  25)

  - power-output-w: 850

  - role: dc-power-supply

  Contract version 1.1.0 (juniper/qfx5200-jpsu-850w-dc-afi).'
