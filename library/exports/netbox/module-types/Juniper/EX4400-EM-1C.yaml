comments: 'Juniper EX4400-EM-1C, the 1x100GbE QSFP28 extension module of the EX4400 switches. The guide
  lists it for every EX4400 model, and from Junos OS 24.2R1-S1 for the EX4400-48XP and -48MXP as well.
  It seats horizontally in the extension module slot at the front right. It has one QSFP28 cage, numbered
  0, with four lamps above it, and two captive screws. It takes one 100GbE QSFP28 or one 40GbE QSFP+ transceiver,
  and a breakout cable gives 4x25G or 4x10G channels. It supports MACsec with AES-256. The switch needs
  System CPLD Firmware 1.0 (0.6 on the EX4400-24X) or later to support it.


  Facts carried in the model that this schema has no field for:

  - first-junos-release: 23.1R1

  - macsec: AES-256

  - ports-note: one QSFP28 port at 100 Gbps by default, 40 Gbps with a QSFP+ transceiver, or channelized
  to 4x25G or 4x10G

  - weight-kg: 0.12

  Contract version 1.0.0 (juniper/ex4400-em-1c).'
