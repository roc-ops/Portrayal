comments: 'Juniper QFX10000-PWR-DC, the 2500 W DC power supply of the QFX10008 and QFX10016 modular chassis,
  shipped only in the redundant DC build. Two independent pairs of DC input lugs run down the left of
  the face, INPUT 1 and INPUT 2, each with a return and a -48/-60 V lug. A vertical column of INP1, INP2,
  PWR OK and FAULT lamps sits beside a two-way enable DIP switch. A grab handle, the captive screw and
  the power rocker complete the face. Airflow is port-to-FRU (front-to-back), from an internal fan.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - hot-swap: yes

  - input-current-a: 60

  - input-voltage: -40 to -72 VDC, -48 VDC nominal

  - output: 12 VDC

  - power-output-w: 2500

  - role: dc-power-supply

  Contract version 1.1.0 (juniper/qfx10000-pwr-dc).'
