comments: 'Juniper JNP-PWR1100-DC, the universal DC power supply of the EX9253. It outputs 1100 W from
  a single -48 VDC feed (operating range -40 to -72 VDC) and has a terminal block with two studs at the
  left, a fan behind a diagonal ejector handle at the right, a status lamp and an ejector tab. The EX9253
  seats up to six, in slots PSM0 to PSM5; the base order ships three and the redundant order four. Each
  has its own fan and a dedicated feed. They are hot-removable and hot-insertable. Never mix them with
  AC supplies.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: operating -40 to -72 VDC, nominal -48 and -60 VDC; 32 A at -48 VDC (guide Table 12)

  - power-output-w: 1100

  - role: dc-power-supply

