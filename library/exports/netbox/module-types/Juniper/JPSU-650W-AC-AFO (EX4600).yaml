comments: 'Juniper JPSU-650W-AC-AFO, a 650 W AC power supply with port-to-FRU airflow (AFO), which the
  guide also calls front-to-back. It is a field-replaceable unit, hot-removable and hot-insertable while
  the second supply runs. The EX4600 hardware guide lists it for the EX4600-40F-AFO. The EX4600 seats
  two, in slots 0 and 1 at the right of the rear. The same supply is used in the QFX5100 switches. The
  face has three lamps labelled AC, DC and !. It also has an orange handle with the label AFO, a C14 appliance
  inlet turned on its side and a black ejector lever. Never mix it with AFI supplies, DC supplies or AIR
  IN fan modules.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: 100 to 240 VAC, 50 to 60 Hz (guide Table 16)

  - power-output-w: 650

  - role: ac-power-supply

