comments: 'Craft interface (front panel display, FPM board) of the Juniper EX9208 switch. It spans the
  chassis above the card cage. It has the MASTER, ONLINE and OFFLINE lamps for RE0 and RE1. It has the
  fan tray lamps and the OK and FAIL lamps of PEM 0 to PEM 3. It has a minor (yellow) and a major (red)
  alarm lamp and the alarm cutoff and lamp test button (ACO/LT). It has the MINOR ALARM and MAJOR ALARM
  relay contacts (NC, C, NO). Each Switch Fabric slot (0, 1) and each line card slot (0 to 5) has an OK
  lamp, a FAIL lamp and a control button. The EX9208 model name is printed on it.


