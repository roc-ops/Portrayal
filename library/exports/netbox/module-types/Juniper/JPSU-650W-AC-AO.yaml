comments: 'JPSU-650W-AC-AO, a 650 W AC power supply with front-to-back airflow (AIR OUT). It is a field-replaceable
  unit, hot-removable and hot-insertable, and load-shares with its twin. The QFX5120 hardware guide says
  the QFX5120-48T and QFX5120-48Y take it. They seat two, in slots 0 and 1 at the right of the rear. The
  MX204 hardware guide names the same part number as the MX204''s AC spare. No other line is named in
  the guide held here. The face carries three lamps labelled AC, DC and !. It also has a Juniper Gold
  handle, a C14 appliance inlet turned on its side and a black ejector lever. The back-to-front sibling
  is JPSU-650W-AC-AI. AC and DC supplies, and supplies of different airflow direction, are never mixed
  in one chassis.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: 100 to 240 VAC, 50 to 60 Hz, 6 A (QFX5120-48Y, guide Table 29)

  - power-output-w: 650

  - role: ac-power-supply

