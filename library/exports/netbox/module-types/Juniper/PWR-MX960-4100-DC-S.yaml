comments: 'Juniper 4100 W DC power supply (PWR-MX960-4100-DC) of the EX9214. It is the high-capacity DC
  supply of the MX960. It stands upright in PEM0 to PEM3 at the rear. At the top are the power switch,
  a door over the input mode switch and four lamps. The lamps are INP0 OK, INP1 OK, DC OK and PS FAIL.
  A vertical handle is below them. Lower down, a terminal strip is printed INP0 and INP1 over four legends:
  -48V, RTN, RTN and -48V from left to right. A lower cover is below the strip. Each of the two DC inputs
  takes an RTN lug and a -48V lug. The supplies work in two zones. PEM0 and PEM2 feed one zone, and PEM1
  and PEM3 feed the other.


  Facts carried in the model that this schema has no field for:

  - input-voltage: -40 to -72 VDC

  - power-output-w: 4100

  - redundancy: 1+1 per zone

  Contract version 2.0.0 (juniper/ex9214-pwr-mx960-4100-dc).'
