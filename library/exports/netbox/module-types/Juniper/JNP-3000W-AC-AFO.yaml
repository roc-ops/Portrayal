comments: 'JNP-3000W-AC-AFO, a 3000 W AC power supply with front-to-back airflow (AIR OUT, port-to-FRU).
  It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares with its twin; the
  QFX5230-64CD-AFO ships with two. The face carries a round fan guard with a Juniper gold handle across
  it, a C20 appliance inlet, a black release latch and one lamp marked PWR. The guide''s AC power cords
  end in a C19 coupler (CBL-JNP-SG4C20-UCE and its country variants), so the inlet is the library''s C20.
  The AIR IN sibling is JNP-2700W-AC-AFI, a 2700 W unit with a green handle. AC and DC supplies, and supplies
  of different airflow direction, are never mixed in one chassis.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: 180 to 305 VAC, 50 to 60 Hz (guide Table 4); output 12 V at 250 A and 12 V standby at 1 A

  - power-output-w: 3000

  - role: ac-power-supply

  Contract version 1.0.0 (juniper/qfx5230-jnp-3000w-ac-afo).'
