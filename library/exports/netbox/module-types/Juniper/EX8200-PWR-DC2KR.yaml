comments: 'Juniper EX8200-PWR-DC2KR, the 2000 W DC power supply of the EX8208, with two redundant inputs
  (A and B) at -48 V. It delivers 2000 W at 52 VDC and works from one input alone. The face has two pairs
  of DC input terminals (studs for a lug), an ENABLE switch, the FAIL, OUT OK, A IN OK and B IN OK lamps,
  a vent field, a handle and a captive screw. Up to six fit an EX8208, in slots PSU 0 to PSU 5. Each has
  its own fan and is hot-insertable and hot-removable. Never mix them with AC supplies. Each input needs
  a dedicated 60 A circuit breaker.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: -40 to -72 VDC (nominal -48 VDC), 50 A maximum per input at nominal; output 52 VDC; 100 A internal
  fuse

  - power-output-w: 2000

  - role: dc-power-supply

