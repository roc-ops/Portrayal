comments: 'QFX5230-64CD-FANAO, the field-replaceable fan module of the QFX5230-64CD with front-to-back
  airflow (AIR OUT, port-to-FRU). Air comes in at the port side and leaves at the back. It is marked AIR
  OUT on a grey chip on its Juniper gold handle. It holds two counter-rotating 80 mm by 86 mm rotors and
  is hot-removable and hot-insertable. The switch takes four, in slots 0 to 3 from left to right, and
  tolerates the failure of one rotor. The back-to-front sibling is QFX5230-64CD-FANAI. The two are never
  mixed in one chassis, and never with power supplies of the other airflow direction.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

