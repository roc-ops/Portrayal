comments: 'Juniper 4100 W AC power supply (PWR-MX960-4100-AC) of the EX9214. It is the high-capacity AC
  supply of the MX960. It stands upright in PEM0 to PEM3 at the rear. Its appliance inlet and input switch
  are at the top. It has four lamps (AC-1 OK, AC-2 OK, DC OK, PS FAIL), an UP label, a vertical handle
  and an internal fan. It takes 200 to 240 V AC. The second feed, AC-2, enters at the chassis inlet strip
  above the supplies. The supplies work in two zones. PEM0 and PEM2 feed one zone, and PEM1 and PEM3 feed
  the other.


  Facts carried in the model that this schema has no field for:

  - input-voltage: 200-240 VAC

  - power-output-one-feed-w: 1700

  - power-output-w: 4100

  - redundancy: 1+1 per zone

  Contract version 1.0.0 (juniper/ex9214-pwr-mx960-4100-ac).'
