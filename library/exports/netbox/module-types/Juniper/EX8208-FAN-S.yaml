comments: 'Juniper EX8208 fan tray (EX8208-FAN-S as a spare, EX8208-FT in the CLI): one vertical tray
  of 12 fans down the left of the chassis front. Its face carries the slot numbers of the whole front
  - the line card slots 0 to 7 and the SRE0, SF and SRE1 slots between them - a handle, two screws and
  a spring-loaded latch, under the EX8208 FAN legend and a warning mark. It provides side-to-side cooling:
  air enters on the right side, crosses the card cage and leaves on the left. Hot-insertable and hot-removable,
  but it must be replaced within 2 minutes. One fan cannot be replaced alone.


  Facts carried in the model that this schema has no field for:

  - airflow: side-to-side

  - fans: 12

  - power-draw-max-w: 1100

  - power-draw-typical-w: 300

  - role: fan-tray

