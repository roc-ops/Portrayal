comments: 'Juniper EX6200-PWR-AC2500, the 2500 W AC power supply of the EX6200 line. It delivers 2500
  W from a high line (200 to 240 VAC) and 1250 W from a low line (100 to 120 VAC). The faceplate has one
  IEC C20 appliance inlet, an Enable switch (Standby or On), the INPUT OK, OUTPUT OK and FAIL lamps, a
  vent field with a diagonal handle and two captive screws. The airflow runs from front to back. The EX6210
  seats up to four, in slots PSU 0 to PSU 3; a shipping order includes one. They are hot-removable and
  hot-insertable.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: 100 to 120 VAC (1250 W) or 200 to 240 VAC (2500 W), 50 to 60 Hz, 15 A per cord (guide Tables
  20 and 25)

  - power-output-low-line-w: 1250

  - power-output-w: 2500

  - role: ac-power-supply

  Contract version 1.0.0 (juniper/ex6200-pwr-ac2500).'
