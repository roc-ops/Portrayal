comments: 'QFX5110-FANAFI, a field-replaceable fan module with back-to-front airflow. Cold air comes in
  at the switch''s rear and hot air leaves at the port side. It is marked AIR IN on a Juniper Azure Blue
  handle. It is hot-removable and hot-insertable, one at a time. The QFX5120 hardware guide says the QFX5120-48T,
  QFX5120-48Y and QFX5120-48YM take it. They seat five (4+1), in slots 0 to 4 left to right. The front-to-back
  sibling is QFX5110-FANAFO. The two are never mixed in one chassis, and never with power supplies of
  the other direction. The status lamp is on the chassis strip beside each slot, not on the module.


