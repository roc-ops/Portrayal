comments: 'Juniper EX8200-PWR-AC2K, the 2000 W AC power supply of the EX8200 chassis. It delivers 2000
  W from a high-voltage line (200 to 240 VAC) and 1200 W from a low-voltage line (100 to 120 VAC), at
  52 VDC. The face has a C19 appliance inlet at the upper left, an ENABLE switch, the INPUT OK, OUTPUT
  OK and FAIL lamps, a vent field, a handle and a captive screw. Up to six fit an EX8208 or EX8216, in
  slots PSU 0 to PSU 5, any slot in any order. Each has its own fan and a dedicated AC feed, and is hot-insertable
  and hot-removable. Never mix them with DC supplies.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: 100 to 120 VAC (13.8 A, 1200 W) or 200 to 240 VAC (12 A, 2000 W), 50 to 60 Hz; output 52 VDC

  - power-output-low-line-w: 1200

  - power-output-w: 2000

  - role: ac-power-supply

  Contract version 1.0.0 (juniper/ex8200-pwr-ac2k).'
