comments: 'QFX5100-96S-FANAFO, the 2RU fan module with port-to-FRU airflow, which the guide also calls
  front-to-back. Cold air comes in at the port end of the switch and hot air leaves at the fan end. It
  is marked AIR OUT and has a Juniper Gold handle. It is hot-removable and hot-insertable. The QFX5100
  hardware guide says only the QFX5100-96S takes it, in three slots numbered 0 to 2 from left to right.
  The back-to-front sibling is QFX5100-96S-FANAFI. The two are never mixed in one chassis, and never with
  power supplies of the other direction. The 1RU models use QFX5100-FAN-AFO, a smaller part.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - power-absent: not-published

  Contract version 1.0.0 (juniper/qfx5100-96s-fanafo).'
