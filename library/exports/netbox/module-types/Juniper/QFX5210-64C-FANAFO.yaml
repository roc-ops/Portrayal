comments: 'QFX5210-64C-FANAFO, a field-replaceable fan module with port-to-FRU (front-to-back) airflow:
  air comes in through the vents at the port end and leaves at the fan end. It is marked AIR OUT (AFO)
  and has a gold handle (the studio photograph shows it orange), and it is hot-removable and hot-insertable.
  The QFX5210 hardware guide says the QFX5210-64C takes four, numbered 0 to 3 from left to right. Each
  has a fan symbol and its number beside the slot. The back-to-front sibling is QFX5210-64C-FANAFI. Fan
  modules of the two directions are never mixed in one chassis, and never with power supplies of the other
  direction. The fan lamp the guide describes (Table 16) is not on the module in any figure held.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - power-absent: not-published

  Contract version 1.0.0 (juniper/qfx5210-fan-afo).'
