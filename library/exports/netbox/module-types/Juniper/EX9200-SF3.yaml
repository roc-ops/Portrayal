  fabric of the EX9200 line
interfaces:
  - name: '{module}/ext-clk'
    type: other
    label: CLK
  - name: '{module}/xge-0'
    type: 10gbase-x-sfpp
    mgmt_only: true
  - name: '{module}/xge-1'
    type: 10gbase-x-sfpp
