comments: 'Juniper EX9200-SF3 Switch Fabric module (from Junos OS Release 20.3R1), the third-generation
  fabric of the EX9200 line. It carries the Routing Engine in its own bay. The left end has the OK/FAIL,
  FABRIC ACTIVE and FABRIC ONLY lamps. The right end has two SFP+ XGE ports with LINK lamps, the GPS lamp
  and the RJ-45 external clock port. An ejector lever sits at each end. It seats in slot SF0 or SF1 of
  the EX9204 and EX9208 and in slots SF0 to SF2 of the EX9214. In the EX9204 it can also take the shared
  SF1/LC0 slot.


  Facts carried in the model that this schema has no field for:

  - fabric-bandwidth: up to 1 Tbps per slot (four fabric planes), 1.5 Tbps per slot with six planes

  - power-draw-max-w: 425

  - power-draw-typical-w: 245

  Contract version 1.0.0 (juniper/ex9200-sf3).'
