comments: 'The DC power supply of the Juniper EX4500 switches. It has front-to-back airflow only and gives
  1200 W at 12 VDC from a -48 VDC feed. It is a field-replaceable unit, hot-removable and hot-insertable.
  The face has a terminal block with two input lugs (-48 VDC and RTN) and a fan. It also has a diagonal
  handle, a bicolour status lamp labelled POK and a green ejector lever. A 1200 W supply needs a dedicated
  30 A breaker. The guide gives no part number for it.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: -42 to -60 VDC, nominal -48 VDC, 30 A maximum (guide Table 42)

  - power-output-w: 1200

  - role: dc-power-supply

  Contract version 1.1.0 (juniper/ex4500-psu-dc-fb).'
