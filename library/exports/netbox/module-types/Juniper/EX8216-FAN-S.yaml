comments: 'Juniper EX8216 fan tray (EX8216-FAN-S as a spare, EX8216-FT in the CLI): one vertical tray
  of nine fans and two fan tray controllers at the left of the front; the chassis takes two, one above
  the other, and they are identical and interchangeable. The face carries two columns of slot labels for
  the nine slots beside it - read the inner column (RE0, RE1, 0 to 6) on the top tray and the outer column
  (7 to 15) on the bottom tray - a handle, a screw and a spring-loaded latch, under the EX8216 FAN legend
  and a warning mark. Cooling is side to side and front to side; only the top tray cools the SF modules
  at the rear. Hot-insertable and hot-removable.


  Facts carried in the model that this schema has no field for:

  - airflow: side-to-side

  - fans: 9

  - power-draw-max-w: 800

  - power-draw-typical-w: 190

  - role: fan-tray

  Contract version 1.0.0 (juniper/ex8216-fan).'
