comments: 'QFX520048Y-FAN-AO (the guide''s fan table also spells it QFX5200-48Y-FAN-AFO), a field-replaceable
  fan module with front-to-back (port-to-FRU) airflow: air comes in at the port side and leaves at the
  fan end. It has a red handle, and is hot-removable and hot-insertable. The QFX5200 hardware guide says
  the QFX5200-48Y takes it, six to a switch (fan modules 0 to 5, left to right). The back-to-front sibling
  is QFX520048Y-FAN-AI. The two are never mixed in one chassis, and never with power supplies of the other
  direction. This module has no status lamp of its own (the guide says the 48Y fan modules have no LED
  indicators).


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - power-absent: not-published

  Contract version 1.0.0 (juniper/qfx5200-48y-fan-afo).'
