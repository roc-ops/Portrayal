comments: 'Juniper QFX10000-PWR-AC, the 2700 W AC power supply of the QFX10008 and QFX10016 modular chassis.
  Two independent 16 A C20 inlets stack on the left (INP2 above INP1). The FAULT, PWR OK, INP2 and INP1
  lamps run along the top, beside a two-way enable DIP switch. A grab handle crosses the middle, with
  the captive screw and the power rocker at the lower right. Airflow is port-to-FRU (front-to-back), from
  an internal fan. The JNP10K-PWR-AC2 fits the same bay and is a separate part.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - hot-swap: yes

  - input-current-a: 16

  - input-frequency: 50-60 Hz

  - input-voltage: 200-240 VAC

  - output: 12 VDC

  - power-output-w: 2700

  - role: ac-power-supply

  Contract version 1.0.0 (juniper/qfx10000-pwr-ac).'
