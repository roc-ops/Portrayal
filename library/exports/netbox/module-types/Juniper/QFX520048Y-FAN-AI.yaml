comments: 'QFX520048Y-FAN-AI (the guide''s fan table also spells it QFX5200-48Y-FAN-AFI), a field-replaceable
  fan module with back-to-front (FRU-to-port) airflow: air comes in at the fan end and leaves at the port
  side. It is marked AIR IN, has a blue handle, and is hot-removable and hot-insertable. The QFX5200 hardware
  guide says the QFX5200-48Y takes it, six to a switch (fan modules 0 to 5, left to right). The front-to-back
  sibling is QFX520048Y-FAN-AO. The two are never mixed in one chassis, and never with power supplies
  of the other direction. This module has no status lamp of its own (the guide says the 48Y fan modules
  have no LED indicators).


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - power-absent: not-published

  Contract version 1.0.0 (juniper/qfx5200-48y-fan-afi).'
