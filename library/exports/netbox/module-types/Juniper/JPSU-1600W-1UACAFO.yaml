comments: 'JPSU-1600W-1UACAFO, a 1600 W AC power supply with front-to-back airflow (AIR OUT, port-to-FRU).
  It is a field-replaceable unit, hot-removable and hot-insertable, installed at the factory, and load-shares
  with its twin. The QFX5130 hardware guide says the QFX5130-32CD, QFX5130-48C and QFX5130-48CM take it;
  the switch ships with two. The face carries three lamps labelled AC, DC and !, a Juniper gold handle,
  an appliance inlet and a black release latch. The inlet takes the C15 coupler of the guide''s power
  cords, so it is a C16 inlet; it is drawn with the library''s C14 inlet, which has the same pins and
  differs by a keying notch. The AIR IN sibling is JPSU-1600W-1UACAFI. AC and DC supplies, and supplies
  of different airflow direction, are never mixed in one chassis. The datasheet lists the part as the
  "QFX5220-32CD 1600W 1U AC PSU AFO".


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: 100 to 127 VAC 12 A, 200 to 240 VAC 8 A (QFX5130-32CD) or 9 A (QFX5130-48C and -48CM), 50 to
  60 Hz (guide Tables 19, 20)

  - power-output-w: 1600

  - role: ac-power-supply

  Contract version 1.0.0 (juniper/qfx5130-jpsu-1600-ac-afo).'
