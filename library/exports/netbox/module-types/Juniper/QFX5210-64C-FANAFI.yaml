comments: 'QFX5210-64C-FANAFI, a field-replaceable fan module with FRU-to-port (back-to-front) airflow:
  air comes in at the fan end and leaves through the vents at the port end. It is marked AIR IN (AFI)
  and has an azure blue handle, and it is hot-removable and hot-insertable. The QFX5210 hardware guide
  says the QFX5210-64C takes four, numbered 0 to 3 from left to right. The front-to-back sibling is QFX5210-64C-FANAFO.
  Fan modules of the two directions are never mixed in one chassis, and never with power supplies of the
  other direction. The fan lamp the guide describes (Table 16) is not on the module in any figure held.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - power-absent: not-published

  Contract version 1.0.0 (juniper/qfx5210-fan-afi).'
