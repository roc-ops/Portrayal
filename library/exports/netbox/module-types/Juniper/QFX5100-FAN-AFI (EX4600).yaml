comments: 'Juniper QFX5100-FAN-AFI, the field-replaceable fan module with back-to-front airflow (AIR IN)
  that the EX4600 hardware guide lists for the EX4600 switch. Air enters at the rear and leaves at the
  port panel. The module has a blue handle band, a grey AIR IN chip and a captive screw at the top left.
  The EX4600 seats five of them, in rear slots 0 to 4 from left to right. They are hot-removable and hot-insertable.
  The same module is used in the QFX5100 switches. Never mix it with AIR OUT fan modules or with power
  supplies that carry the AFO label.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - power-absent: not-published

  - role: chassis-fan

  Contract version 1.0.0 (juniper/ex4600-fan-afi).'
