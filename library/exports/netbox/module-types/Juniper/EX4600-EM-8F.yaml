comments: 'Juniper EX4600-EM-8F, the expansion module that adds eight SFP+ ports to an EX4600 switch.
  The EX4600 hardware guide lists it with the QFX-EM-4Q for the two module bays at the right of the port
  panel. The module has eight stacked SFP+ cages in four columns, numbered 0 to 7 with the even numbers
  on top. It takes 10 GbE SFP+ transceivers or 1 GbE SFP transceivers. Each port has two lamps, and one
  ST lamp shows the module. It is hot-insertable and hot-removable. The same module is used in the QFX5100
  switches. Copper SFP transceivers must sit in the top four or the bottom four ports.


  Facts carried in the model that this schema has no field for:

  - ports-note: eight SFP+ ports at 10 Gbps, or SFP ports at 1 Gbps

  - sfp-plus: 8

  - weight-note: not published

  Contract version 1.0.0 (juniper/ex4600-em-8f).'
