comments: 'JNP-3000W-DC-AFO (product number 740-073766), a 3000 W DC power supply with front-to-back airflow
  (AIR OUT, port-to-FRU). It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares
  with its twin; the QFX5230-64CD-D-AFO ships with two. The face carries a round fan guard with a Juniper
  gold handle across it, a terminal block under a cover, an input current selector (a DIP switch, set
  to 80 A for this unit), an ejector lever and one lamp. The AIR IN sibling is JNP-2400W-DC-AFI, a 2400
  W unit with a green handle. AC and DC supplies, and supplies of different airflow direction, are never
  mixed in one chassis.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: -40 to -72 VDC, rated -48 to -60 VDC, 90 A maximum (guide Tables 18 and 21); output 12 V at
  250 A and 12 V standby at 1 A

  - power-output-w: 3000

  - role: dc-power-supply

