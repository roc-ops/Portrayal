comments: 'Juniper 2400 W DC power supply (PWR-MX480-2400-DC) of the EX9204 and EX9208. The CLI calls
  it "DC 2.4kW Power Entry Module". It has one -48 VDC input with its return. It has a 70 A circuit breaker,
  an input mode switch, an internal fan and a pull handle. Its three lamps are POWER OK, BRKR ON and INPUT
  OK. It seats in PEM0 to PEM3. It cools from the chassis front to its own rear. The output is 2400 W
  with the switch at 0 (60 A input) and 2600 W at 1 (70 A input).


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back (the supply draws air from the front of the chassis and exhausts at its own
  rear)

  - input-current-a: 60 (switch at 0), 70 (switch at 1)

  - input-voltage: -40.5 to -72 VDC, nominal -48 VDC

  - power-output-70a-w: 2600

  - power-output-w: 2400

  - redundancy: 1+1

  Contract version 2.0.0 (juniper/ex9200-pwr-mx480-2400-dc).'
