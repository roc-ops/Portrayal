comments: 'Juniper JNP10K-PWR-DC2 as the QFX10008 and QFX10016 take it - the 5500 W dual-supply DC module
  with four DC feeds. Two columns of four input lug barrels run down the left, beside a tall grab slot.
  The fault, OK, 2 and 1 lamps sit by a three-way H/L, IP1 and IP0 DIP switch. The heat warning and the
  power rocker are at the top right, and the captive screw is at the foot. It is longer than the QFX10000-PWR-DC
  and protrudes from the bay. Airflow is port-to-FRU (front-to-back). The MX10000 guides list the same
  part number; no MX chassis models it yet.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - hot-swap: yes

  - input-feeds: 4

  - input-voltage: -40 to -72 VDC, -48 VDC nominal

  - power-output-w: 5500

  - role: dc-power-supply

  Contract version 1.0.0 (juniper/qfx10000-jnp10k-pwr-dc2).'
