comments: 'Juniper QFX10000-RE Routing and Control Board for the QFX10008 and QFX10016 - a slim full-width
  FRU, two stacked in the top slots (CB0 and CB1). PWR, STS and MST status lamps sit over the OFF button.
  Then come CON (console), the SMB quad and the MGMT pair (RJ-45 and SFP) with its lamp. The SMB quad
  is 1PPS in and out and 10 MHz in and out. A USB 2.0 port, the SATA SSD slot cover with its lamp and
  RESET follow. Four SFP+ cages numbered 0 to 3 are reserved by Juniper for future use.


  Facts carried in the model that this schema has no field for:

  - power-draw-max-w: 100

  - power-draw-typical-w: 50

  - sfp: 5

  Contract version 1.0.0 (juniper/qfx10000-re).'
