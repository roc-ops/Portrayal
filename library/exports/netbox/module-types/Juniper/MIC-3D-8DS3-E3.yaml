  is 75-ohm mini-SMB (the MX2020 and MX2010 3D Universal Edge Routers datasheet 1000417-010-EN and the
  MX104 3D Universal Edge Router datasheet 1000446-002-EN), which is not an interface the library models,
  so the SMB registry opening stands in - recorded. BNC is only the far end of the CBL-DS3-E3-M-S cable.
  MIC form (168 x 27 window; the earlier 31 mm reading was the bay opening with bezel - a MIC must seat
  inside the 29.5 mm MPC face, so the window is 27).


