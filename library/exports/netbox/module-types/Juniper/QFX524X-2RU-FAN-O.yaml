comments: 'QFX524X-2RU-FAN-O, the field-replaceable fan module of the DC builds of the QFX5241-64OD and
  QFX5241-64QD (QFX5241-64OD-DO and QFX5241-64QD-DO), with front-to-back airflow (AIR OUT, port-to-FRU,
  also written AFO). Air comes in at the port side and leaves at the back. It is marked AIR OUT on a grey
  chip on its orange handle. Each module holds two rotors, and the cooling system is N+1 at rotor level.
  It is hot-removable and hot-insertable. The switch takes four, in slots 0 to 3 from left to right. The
  AC builds take the QFX5240-2U-FANAO, which is a different part number.


