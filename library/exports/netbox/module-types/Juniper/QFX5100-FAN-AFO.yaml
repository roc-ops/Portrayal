comments: 'QFX5100-FAN-AFO, a field-replaceable fan module with port-to-FRU airflow, which the guide also
  calls front-to-back. Cold air comes in at the port end of the switch and hot air leaves at the fan end.
  It is marked AIR OUT and has a Juniper Gold handle. It is hot-removable and hot-insertable. The QFX5100
  hardware guide says the QFX5100-24Q, QFX5100-48S, QFX5100-48SH, QFX5100-48T and QFX5100-48TH take it.
  The 1RU models seat five, in slots 0 to 4 from left to right. The back-to-front sibling is QFX5100-FAN-AFI.
  The two are never mixed in one chassis, and never with power supplies of the other direction. The 2RU
  QFX5100-96S uses a different part.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - power-absent: not-published

  Contract version 1.0.0 (juniper/qfx5100-fan-afo).'
