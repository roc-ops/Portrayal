comments: 'Juniper EX-UM-8X8SFP, the eight-port 1/10 Gbps SFP+ uplink module of the EX4300-32F switches.
  It slides into the large uplink module slot at the left end of the front panel. It has eight SFP+ cages
  in two rows of four, numbered 0 to 7, the even numbers on the upper row. Each cage takes an SFP+ transceiver
  at 10 Gbps or an SFP transceiver at 1 Gbps. Arrow lamps between the rows show link activity and status
  for each port, and the module has one ST lamp. Two captive screws hold it. It ships with dust covers
  in the ports.


  Facts carried in the model that this schema has no field for:

