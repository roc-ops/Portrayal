comments: 'Juniper JPSU-H-340W-AC, the 340 W AC field-replaceable power supply of the EX4100-H-24MP. The
  switch ships with one in a rear slot and takes a second, which the guide lists as N+1 redundant and
  hot swappable. The face is a finned fanless body with a green release handle, a retaining thumbscrew
  on a tab at one end and, at the other, the OUT_OK lamp over a hot-surface mark. The AC cord does not
  land here: the input terminals are on the front of the switch, under the terminal door, in the section
  for the slot the supply is in. The supply has no fan and cools by convection, so it has no airflow direction.


  Facts carried in the model that this schema has no field for:

  - cooling: fanless, convection cooled

  - inlet: none

  - input: 100 through 240 VAC, 50 or 60 Hz

