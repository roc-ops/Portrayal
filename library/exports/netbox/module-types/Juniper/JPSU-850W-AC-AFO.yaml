comments: 'JPSU-850W-AC-AFO, an 850 W AC power supply with front-to-back airflow (AIR OUT). It is a field-replaceable
  unit, hot-removable and hot-insertable, and load-shares with its twin. The QFX5120 hardware guide says
  the QFX5120-48YM takes it. It seats two, in slots 0 and 1 at the right of the rear. The 48T takes 850
  W supplies only in a high-voltage form, which is a different part. The face carries three lamps labelled
  AC, DC and !. It also has a Juniper Gold handle and a black ejector lever. Its C14 appliance inlet is
  turned on its side, with a wire power cord retainer over it. The back-to-front sibling is JPSU-850W-AC-AFI.
  AC and DC supplies, and supplies of different airflow direction, are never mixed in one chassis.


  Facts carried in the model that this schema has no field for:

  - airflow: front-to-back

  - input: 100 to 240 VAC, 50 to 60 Hz, 7.5 A at 100 VAC or 3 A at 240 VAC (QFX5120-48YM, guide Table
  30)

  - power-output-w: 850

  - role: ac-power-supply

