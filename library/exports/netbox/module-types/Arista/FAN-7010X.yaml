comments: 'Arista FAN-7010X, the one hot-swappable dual-inline fan module of the 7010TX-48 switches, reversible:
  turned 180 degrees and pushed back in, it draws air the other way. It slides in a slot in the middle
  of the rear panel that is longer than the module, between a blue AIR INLET label band and a red AIR
  EXIT label band printed on the chassis; the module covers one band and shows the other. With the module
  at the end of the slot that covers the red band the blue AIR INLET shows and the switch runs back-to-front
  (the -R part numbers); with it at the other end the red AIR EXIT shows and it runs front-to-back (the
  -F part numbers). The `airflow` field says which, and a configuration sets it. The face is a pale grey
  plate with a handle window carrying a FAN 7010X tag, and a status lamp and a fan glyph at one end.


  Facts carried in the model that this schema has no field for:

  - hot-swap: yes

  - redundancy: dual inline fans in one module

  - role: chassis-fan

  Contract version 1.0.0 (arista/7010tx-fan).'
