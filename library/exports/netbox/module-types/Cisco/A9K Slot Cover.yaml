description: Line card and RSP/RP blank filler for a Cisco ASR 9000 modular chassis
comments: 'Line card and RSP/RP blank filler for a Cisco ASR 9000 modular chassis. A plain plate on the
  line-card envelope with a captive installation screw at each end and nothing else on it. It is a functional
  part, not trim: the installation guide is explicit that "unoccupied card slots must have a blank filler
  card installed for electromagnetic compatibility (EMC)", and the high-density 100GE cards additionally
  require the two-screen A9K-LC-FILR-V2 in the slots around them "for optimal cooling and EMI". An empty
  slot in a real chassis has one of these in it.


  Facts carried in the model that this schema has no field for:

  - role: airflow-blank

  - part-numbers: A9K-LC-FILR, A9K-LC-FILR-V2


  Contract version 1.0.0.'
