comments: 'Cisco N9500 Series 3-kW Universal AC/DC power supply (N9K-PUV-3000W-B). Same envelope as the
  3-kW AC supply, but the input is a Saf-D-Grid receptacle that takes either a high-voltage AC or a high-voltage
  DC cord, with a power switch beside it (set to 0 for standby, 1 for on). It stands on end in a power-supply
  bay, with the OK and FAIL lamps at the upper left. The Nexus 9504, 9508 and 9516 take the same part.


  Facts carried in the model that this schema has no field for:

  - airflow: port-side intake

  - efficiency: 90% or greater (20 to 100% load)

  - eol: unknown

  - hot-swappable: True

  - input: ac-dc

  - input-frequency: 47 to 63 Hz

  - input-voltage: 200 to 277 VAC or 240 to 380 VDC

  - power-output-w: 3000

  - role: power-module

  Contract version 1.0.0 (cisco/n9k-puv-3000w-b).'
