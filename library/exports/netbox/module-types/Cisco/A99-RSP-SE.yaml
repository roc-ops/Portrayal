comments: 'Cisco ASR 9910 and ASR 9906 Route Switch Processor, Service Edge optimised - the card Cisco''s
  guides call the RSP4-S. Four 10-GE SFP+ ports and control of up to seven switch fabrics, two of them
  on the RSP itself. Ten RJ-45 jacks - two SYNC timing ports configurable as BITS, J.211 or DTI, an IEEE
  1588 timestamp port, two inter-chassis sync ports of which ICS1 doubles as the RS232/422 GPS time-of-day
  input, two management LAN ports, a CMP port, a console and an auxiliary port - plus 10 MHz and 1 PPS
  SMB clock inputs, a nine-pin alarm output, a USB 2.0 type A port, nine discrete status lamps, a four-character
  LED dot-matrix display and a LAMP TEST push button.


  Facts carried in the model that this schema has no field for:

  - alarm: DB9, three dry-contact outputs

  - console: EIA/TIA-232 RJ-45

  - eol: none-announced

  - mgmt: 2 x 10/100/1000 RJ-45

  - power-draw-max-w: 370

  - role: route-switch-processor

  - sfp-plus: 4

  - timing: 2 x SYNC (BITS/J.211/DTI) RJ-45, IEEE 1588 RJ-45, 2 x inter-chassis sync RJ-45, 10 MHz and
  1 PPS SMB

  - usb: 1 x USB 2.0 type A

  - weight-kg: 8.09

  Contract version 2.0.0 (cisco/a99-rsp-se).'
