comments: 'The fan tray of the Cisco Catalyst 4948E-F, WS-X4993-F - four variable-speed 12 VDC fans behind
  one long perforated blue face, a captive installation screw at each end and a pull handle across the
  middle. It seats between the two power supplies and prints PS 1 and PS 2 at its two ends to name them.
  Back-to-front airflow; the Catalyst 4948E takes the WS-X4993 instead, and the two trays are not interchangeable.


  Facts carried in the model that this schema has no field for:

  - airflow: back-to-front

  - fans: 4

  - power-absent: not-published

