comments: 'Cisco Nexus 9500 36-port 40-Gigabit Ethernet line card (N9K-X9736Q-FX), which the guides call
  a QSFP28 card. Thirty-six QSFP28 cages in two rows of eighteen, run at 40 Gigabit Ethernet, a Beacon
  and a Status lamp at the left and one Link triangle per port between the rows, with an ejector lever
  at each end. The Nexus 9504, 9508 and 9516 take it, and it is one of the three cards that work in fabric
  slot FM 5.


