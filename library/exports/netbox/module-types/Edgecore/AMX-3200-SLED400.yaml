  - optics-qsfp28: 100GBASE-SR4, 100GBASE-LR4, 100GBASE-ER4; AOC/DAC

  - port-modes-cfp2: 100G / 200G / 300G / 400G coherent over DP-16QAM, DP-8QAM, DP-QPSK

  - port-modes-qsfp28: 1x 40GbE / 100GbE, OTU4

  - power-absent: not-published

  - qsfp28: 8

