comments: 'Casa 6+12 SW-IO2 - the 204 MHz-capable combined switch and I/O card. Same eighteen MCX jacks
  and the same LC switch function as the plain 6+12 SW- IO, at 5-204 MHz, so it is what a 204 MHz BDM
  build puts in the redundancy slot a BDM scheme frees up: C100G rear 8, C40G rear 4.


  Facts carried in the model that this schema has no field for:

  - connector: mcx

  - downstream: 6

  - media: coax

  - power-absent: not-applicable

  - slot: C100G-rear-8 / C40G-rear-4

  - spectrum: 5-204MHz

  - switch: yes

  - upstream: 12

  Contract version 1.8.1 (casa/io-6p12-sw-io2).'
