comments: 'Casa/CommScope SMM300G Switch and Management Module - the 300G supervisor for the C100G and
  C40G CCAP chassis. Ten 10GigE SFP+ (XG0-XG9) in ganged blocks of six and four, two 100GigE QSFP28 (CG0,
  CG1), a 10/100BASE-T management RJ45 and an RS-232 console RJ45, plus STATUS, ACTIVE and ALARM lamps.
  Up to two per chassis in the dedicated active and standby slots, for 600G aggregate.


  Facts carried in the model that this schema has no field for:

  - console: RS-232

  - mgmt: 10/100BASE-T

  - nebs: Designed to NEBS level 3 requirements

  - power-draw-max-w: 160

  - qsfp28: 2

  - role: supervisor

  - sfp-plus: 10

  - switching-throughput: 300G bidirectional per module

  - timing: IEEE 1588v2

  Contract version 1.6.1 (casa/smm-300g).'
