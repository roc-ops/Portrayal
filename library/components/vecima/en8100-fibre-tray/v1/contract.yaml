format: 1
kind: module
name: en8100-fibre-tray
version: 1.0.0
class: mechanical
behaviour: fills
profile: networking
description: >-
  Entra EN8100 fiber management tray, the clear-covered tray in the right-hand corner of the lid
  half that organises and secures the fibre from the end entry ports to the lid distribution module.
  It holds a fibre spool and an optional bulkhead adapter plate for up to twelve optical adapters.
  Four non-captive screws hold it.
size: {w: 200.0, h: 115.0}
size-confidence: {w: estimated, h: estimated}
attrs:
  model: EN8100 fiber management tray
provenance:
  identity: >-
    Entra Remote PHY Node EN8100 Installation and Operations Guide (Rev_15), section 3.2.9 and the
    tray figure on p40, and the replacement chapter p105 and p106 (four non-captive screws). No
    part number is printed.
  size: >-
    estimated - no EN8100 document states a size for any module. 200 x 115 is the tray's share of
    the 607 x 281 open half in a hand-drawn layout of the open node, at the 1.7 aspect of the tray
    figure on p40.
  elements: >-
    photo-measured - the tray figure on p40 shows a clear cover over a round spool at the right and
    a row of SC adapters, three green and two blue, at the left edge. The spool, the cover outline
    and the adapter row are drawn as art; the adapters are not parts, because the bulkhead plate
    is optional and the figure shows jumper ends in them rather than a bare plate.
elements: {}
connection-points:
