format: 1
kind: component
name: en8100-pec
version: 1.0.0
class: mechanical
profile: networking
description: >-
  Entra EN8100 power entry cover (PEC), the plate at each end of the base half of the node that
  covers the three port entry modules, helps stop cross-talk between channels and carries a mylar
  insulation band on its underside. Two per node, each held by two captive screws. It carries the
  printed legends for the stinger seizure screws and the AC shunts.
size: {w: 36.0, h: 232.0}
size-confidence: {w: estimated, h: estimated}
attrs:
  model: EN8100 power entry cover
provenance:
  identity: >-
    Entra Remote PHY Node EN8100 Installation and Operations Guide (Rev_15), section 3.2.3 and the
    PEC figure on p36, and the replacement chapter p121 and p122 (two PECs, two captive screws
    each). No part number is printed.
  size: >-
    estimated - no EN8100 document states a size for any module. The 36 mm width is what is left at
    each end of the 607 mm base once the RF amplifier modules and the centre column are placed, and
    the 232 mm length is the cavity's depth; the figure on p36 shows the cover flat, so it gives
    only its legends and screw positions.
  elements: >-
    photo-measured - the legends SEIZURE SCREW (three) and AC SHUNT (three) from the PEC figure on
    p36, set along the cover's length. The lamp-free cover has no elements of its own.
