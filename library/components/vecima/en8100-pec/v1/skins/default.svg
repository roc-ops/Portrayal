<svg xmlns="http://www.w3.org/2000/svg" width="36mm" height="232mm" viewBox="0 0 36 232">
  <!-- The power entry cover: a pale grey plate with two screws. The three seizure screw legends
       and three AC SHUNT legends of the cover are printed along its length. -->
  <rect id="plate" x="0" y="0" width="36" height="232" rx="1" fill="#b9bcc0" stroke="#7f8489" stroke-width="0.4"/>
  <circle cx="18" cy="8" r="2.4" fill="#d9dbde" stroke="#6f7479" stroke-width="0.3"/>
  <circle cx="18" cy="224" r="2.4" fill="#d9dbde" stroke="#6f7479" stroke-width="0.3"/>
  <g id="silkscreen" font-family="Helvetica, Arial, sans-serif" fill="#202326">
    <text x="9.4" y="38" font-size="2.6" transform="rotate(-90 9.4 38)" text-anchor="middle">SEIZURE SCREW</text>
    <text x="9.4" y="116" font-size="2.6" transform="rotate(-90 9.4 116)" text-anchor="middle">SEIZURE SCREW</text>
    <text x="9.4" y="194" font-size="2.6" transform="rotate(-90 9.4 194)" text-anchor="middle">SEIZURE SCREW</text>
    <text x="27.6" y="38" font-size="2.6" transform="rotate(-90 27.6 38)" text-anchor="middle">AC SHUNT</text>
    <text x="27.6" y="116" font-size="2.6" transform="rotate(-90 27.6 116)" text-anchor="middle">AC SHUNT</text>
    <text x="27.6" y="194" font-size="2.6" transform="rotate(-90 27.6 194)" text-anchor="middle">AC SHUNT</text>
  </g>
</svg>
