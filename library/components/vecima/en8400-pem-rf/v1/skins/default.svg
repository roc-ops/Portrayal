<svg xmlns="http://www.w3.org/2000/svg" width="36mm" height="75mm" viewBox="0 0 36 75">
  <!-- An EN8400 RF port entry module: a green board with a screened seizure block and a black
       connector block. The seizure is screwless, so no screw head is drawn on it. -->
  <rect id="plate" x="0" y="0" width="36" height="75" rx="1" fill="#3f7a4b" stroke="#2a5233" stroke-width="0.4"/>
  <rect x="8" y="22" width="24" height="30" fill="#b8bcc0" stroke="#7f8489" stroke-width="0.3"/>
  <rect x="12" y="56" width="14" height="9" fill="#1a1b1d"/>
  <circle cx="6" cy="6" r="1.6" fill="#d9dbde"/>
  <circle cx="30" cy="6" r="1.6" fill="#d9dbde"/>
  <circle cx="6" cy="69" r="1.6" fill="#d9dbde"/>
  <circle cx="30" cy="69" r="1.6" fill="#d9dbde"/>
</svg>
