<svg xmlns="http://www.w3.org/2000/svg" width="145mm" height="153mm" viewBox="0 0 145 153">
  <!-- The lid distribution module: a grey plate with a raised side rail at each edge. Ports and
       lamps are composed as parts; the plate, the rails, the screws and the printed legends are
       drawn here. -->
  <rect id="plate" x="0" y="0" width="145" height="153" rx="1.5" fill="#8f9296" stroke="#5c5f62" stroke-width="0.4"/>
  <rect x="0" y="0" width="9" height="153" fill="#a3a6aa"/>
  <rect x="136" y="0" width="9" height="153" fill="#a3a6aa"/>
  <circle cx="4.5" cy="4" r="2" fill="#c6c9cc" stroke="#6f7276" stroke-width="0.3"/>
  <circle cx="140.5" cy="4" r="2" fill="#c6c9cc" stroke="#6f7276" stroke-width="0.3"/>
  <circle cx="4.5" cy="149" r="2" fill="#c6c9cc" stroke="#6f7276" stroke-width="0.3"/>
  <circle cx="140.5" cy="149" r="2" fill="#c6c9cc" stroke="#6f7276" stroke-width="0.3"/>
  <rect x="46" y="90" width="32" height="63" rx="1" fill="#6d7074" stroke="#4d5053" stroke-width="0.3"/>
  <g id="silkscreen" font-family="Helvetica, Arial, sans-serif" fill="#1d1f21">
    <text x="14" y="10" font-size="2.6" font-weight="bold">AM 0</text>
    <text x="19" y="35" font-size="2.4" font-weight="bold">AM 0</text>
    <text x="26" y="38.2" font-size="2.2">D-RF0</text>
    <text x="26" y="42.4" font-size="2.2">U-RF0</text>
    <text x="26" y="46.1" font-size="2.2">U-RF1</text>
    <text x="108" y="109.5" font-size="2.4" font-weight="bold" text-anchor="end">AM 1</text>
    <text x="116" y="112.7" font-size="2.2" text-anchor="end">D-RF1</text>
    <text x="116" y="116.8" font-size="2.2" text-anchor="end">U-RF2</text>
    <text x="116" y="120.9" font-size="2.2" text-anchor="end">U-RF3</text>
    <text x="128" y="133" font-size="2.4" font-weight="bold" text-anchor="end">AM 1</text>
    <text x="40" y="132.5" font-size="2.2" text-anchor="end">SYS</text>
    <text x="40" y="136.6" font-size="2.2" text-anchor="end">ETH 0</text>
    <text x="40" y="140.4" font-size="2.2" text-anchor="end">ETH 1</text>
    <text x="53" y="94" font-size="2.2" fill="#f1f2f3">ETH 0</text>
    <text x="53" y="97" font-size="2.2" fill="#f1f2f3">PRIMARY</text>
    <text x="66" y="94" font-size="2.2" fill="#f1f2f3">ETH 1</text>
    <text x="55" y="14" font-size="2.4">LINK</text>
    <text x="75" y="14" font-size="2.4">POWER</text>
    <text x="118" y="75" font-size="2.4" font-weight="bold" text-anchor="end">LID DISTRIBUTION</text>
    <text x="118" y="78" font-size="2.4" font-weight="bold" text-anchor="end">MODULE</text>
  </g>
</svg>
