<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="70mm" viewBox="0 0 190 70">
  <!-- The AC power supply module: a silver plate with a black strap across it. The lamp is
       composed as a part; the plate, the AC test point, the strap, the label field and the
       printed legends are drawn here. -->
  <rect id="plate" x="0" y="0" width="190" height="70" rx="1.5" fill="#c4c7cb" stroke="#8d9196" stroke-width="0.4"/>
  <circle cx="28" cy="22" r="4" fill="#1d1f21"/>
  <rect x="20" y="46" width="118" height="9" rx="4.5" fill="#26282b"/>
  <rect x="62" y="8" width="62" height="28" fill="#e7e9ec" stroke="#9aa0a6" stroke-width="0.3"/>
  <rect x="150" y="6" width="24" height="12" fill="#d8562b"/>
  <g id="silkscreen" font-family="Helvetica, Arial, sans-serif" fill="#202326">
    <text x="19" y="35" font-size="3.2" font-weight="bold">AC TEST</text>
    <text x="19" y="38.6" font-size="3.2" font-weight="bold">POINT</text>
    <text x="160" y="36" font-size="3.2" font-weight="bold">DC OUT</text>
  </g>
</svg>
