<svg xmlns="http://www.w3.org/2000/svg" width="205mm" height="95mm" viewBox="0 0 205 95">
  <!-- The 1x2 access module: a brushed-aluminium plate. Jacks and lamps are composed as parts;
       only the plate, the handle slots, the screws and the printed legends are drawn here. -->
  <rect id="plate" x="0" y="0" width="205" height="95" rx="1.5" fill="#c9ccd0" stroke="#8d9196" stroke-width="0.4"/>
  <rect x="100" y="76" width="36" height="5" rx="2.5" fill="#9aa0a6" stroke="#6f7479" stroke-width="0.3"/>
  <rect x="124" y="12" width="40" height="5" rx="2.5" fill="#9aa0a6" stroke="#6f7479" stroke-width="0.3"/>
  <circle cx="5" cy="5" r="2.2" fill="#e3e5e8" stroke="#7f8489" stroke-width="0.3"/>
  <circle cx="197" cy="5" r="2.2" fill="#e3e5e8" stroke="#7f8489" stroke-width="0.3"/>
  <circle cx="87" cy="90" r="2.2" fill="#e3e5e8" stroke="#7f8489" stroke-width="0.3"/>
  <g id="silkscreen" font-family="Helvetica, Arial, sans-serif" fill="#202326">
    <text x="19.5" y="22" font-size="3.4">RTN 1</text>
    <text x="19.5" y="40.5" font-size="3.4">RTN 2</text>
    <text x="19.5" y="62.5" font-size="3.4">FWD 1A</text>
    <text x="19.5" y="81.5" font-size="3.4">FWD 1B</text>
    <text x="102" y="31" font-size="3.2" font-weight="bold" text-anchor="middle">1x2 R-PHY ACCESS MODULE</text>
    <text x="162" y="76.4" font-size="2.4" text-anchor="end">POWER</text>
    <text x="162" y="79.4" font-size="2.4" text-anchor="end">CONN</text>
    <text x="162" y="82.4" font-size="2.4" text-anchor="end">OPER</text>
    <text x="162" y="85.4" font-size="2.4" text-anchor="end">ALARM</text>
  </g>
</svg>
