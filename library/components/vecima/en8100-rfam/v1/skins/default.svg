<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="232mm" viewBox="0 0 150 232">
  <!-- The dual-port RF amplifier module: a grey plate. Jacks and lamps are composed as parts;
       only the plate, the handles' slots, the screws and the printed legends are drawn here. -->
  <rect id="plate" x="0" y="0" width="150" height="232" rx="1.5" fill="#8a8d90" stroke="#5c5f62" stroke-width="0.4"/>
  <rect x="4" y="96" width="5" height="40" rx="2.5" fill="#6f7276" stroke="#4d5053" stroke-width="0.3"/>
  <rect x="141" y="96" width="5" height="40" rx="2.5" fill="#6f7276" stroke="#4d5053" stroke-width="0.3"/>
  <circle cx="17" cy="6" r="2.6" fill="#b9bec3" stroke="#6f7276" stroke-width="0.3"/>
  <circle cx="75" cy="86" r="2.6" fill="#b9bec3" stroke="#6f7276" stroke-width="0.3"/>
  <circle cx="75" cy="156" r="2.6" fill="#b9bec3" stroke="#6f7276" stroke-width="0.3"/>
  <circle cx="17" cy="226" r="2.6" fill="#b9bec3" stroke="#6f7276" stroke-width="0.3"/>
  <circle cx="75" cy="6" r="2.6" fill="#b9bec3" stroke="#6f7276" stroke-width="0.3"/>
  <circle cx="75" cy="226" r="2.6" fill="#b9bec3" stroke="#6f7276" stroke-width="0.3"/>
  <!-- Orange AC shunt connectors with a black connector block beside each, down the edge that
       faces the power entry cover. -->
  <g id="shunts">
    <rect x="1" y="27" width="7" height="22" rx="0.6" fill="#e0782c" stroke="#9c4a15" stroke-width="0.25"/>
    <rect x="1" y="105" width="7" height="22" rx="0.6" fill="#e0782c" stroke="#9c4a15" stroke-width="0.25"/>
    <rect x="1" y="184" width="7" height="22" rx="0.6" fill="#e0782c" stroke="#9c4a15" stroke-width="0.25"/>
    <rect x="9" y="27" width="6" height="22" rx="0.6" fill="#1a1b1d"/>
    <rect x="9" y="105" width="6" height="22" rx="0.6" fill="#1a1b1d"/>
    <rect x="9" y="184" width="6" height="22" rx="0.6" fill="#1a1b1d"/>
  </g>
  <!-- The two test-port leads: a blue connector at each corner and a black cable looped to the jacks. -->
  <g id="test-leads" fill="none" stroke-linecap="round">
    <path d="M13 15 C44 15 44 66 22 84" stroke="#17181a" stroke-width="1.8"/>
    <path d="M13 217 C44 217 44 168 24 128" stroke="#17181a" stroke-width="1.8"/>
    <rect x="3" y="11" width="11" height="8" rx="1.6" fill="#2438c8" stroke="#16206f" stroke-width="0.3"/>
    <rect x="3" y="213" width="11" height="8" rx="1.6" fill="#2438c8" stroke="#16206f" stroke-width="0.3"/>
  </g>
  <!-- The printed RF circuit lines: a signal chain of an amplifier triangle and a filter box for
       each of the three port entry rows. Schematic, after the maker's drawing of the node. -->
  <g id="rf-circuit" fill="none" stroke="#3c3f43" stroke-width="0.45" stroke-linejoin="round">
    <path d="M24 40 H46 M46 34 L58 40 L46 46 Z M58 40 H82 M82 35 H92 V45 H82 Z M92 40 H120"/>
    <path d="M30 165 H50 M50 159 L62 165 L50 171 Z M62 165 H86 M86 160 H96 V170 H86 Z M96 165 H122"/>
    <path d="M30 200 H50 M50 194 L62 200 L50 206 Z M62 200 H86 M86 195 H96 V205 H86 Z M96 200 H122"/>
    <path d="M100 118 H128 M128 112 L140 118 L128 124 Z"/>
  </g>
  <g id="silkscreen" font-family="Helvetica, Arial, sans-serif" fill="#1d1f21">
    <text x="26" y="94" font-size="3.4">RTN A</text>
    <text x="26" y="126.8" font-size="3.4">RTN B</text>
    <text x="74" y="106" font-size="3.4">FWD</text>
    <text x="100" y="26" font-size="3.2" font-weight="bold">DUAL 1218MHz RF</text>
    <text x="100" y="30.4" font-size="3.2" font-weight="bold">AMPLIFIER MODULE</text>
    <text x="137.6" y="49.6" font-size="2.4">OPER A</text>
    <text x="137.6" y="60.6" font-size="2.4">POWER</text>
    <text x="137.6" y="66" font-size="2.4">CONN</text>
    <text x="137.6" y="71.4" font-size="2.4">ALARM</text>
    <text x="137.6" y="83" font-size="2.4">OPER B</text>
  </g>
</svg>
