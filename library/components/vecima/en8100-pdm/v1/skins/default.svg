<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="74mm" viewBox="0 0 190 74">
  <!-- The power distribution module: a silver plate. The lamps are composed as parts; the plate,
       the connector outlines' printed legends and the screws are drawn here. -->
  <rect id="plate" x="0" y="0" width="190" height="74" rx="1.5" fill="#c4c7cb" stroke="#8d9196" stroke-width="0.4"/>
  <circle cx="6" cy="6" r="2.2" fill="#e3e5e8" stroke="#7f8489" stroke-width="0.3"/>
  <circle cx="184" cy="6" r="2.2" fill="#e3e5e8" stroke="#7f8489" stroke-width="0.3"/>
  <circle cx="6" cy="68" r="2.2" fill="#e3e5e8" stroke="#7f8489" stroke-width="0.3"/>
  <circle cx="184" cy="68" r="2.2" fill="#e3e5e8" stroke="#7f8489" stroke-width="0.3"/>
  <g id="silkscreen" font-family="Helvetica, Arial, sans-serif" fill="#202326">
    <text x="20" y="10" font-size="2.6">PS 1</text>
    <text x="20" y="13" font-size="2.6">QSW AC (L)</text>
    <text x="20" y="62" font-size="2.6">PS 2</text>
    <text x="20" y="65" font-size="2.6">QSW AC (R)</text>
    <text x="95" y="10" font-size="2.6">PS 1 DC (L)</text>
    <text x="95" y="48" font-size="2.6">PS 2 DC (R)</text>
    <text x="150" y="10" font-size="2.6">LINK</text>
    <text x="150" y="48" font-size="2.6">POWER</text>
    <text x="113" y="62.6" font-size="2.2">POWER</text>
    <text x="113" y="65.2" font-size="2.2">CONN</text>
    <text x="113" y="67.8" font-size="2.2">OPER</text>
    <text x="113" y="70.4" font-size="2.2">ALARM</text>
    <text x="150" y="30" font-size="2.6" font-weight="bold">POWER DISTRIBUTION</text>
    <text x="150" y="33" font-size="2.6" font-weight="bold">MODULE</text>
  </g>
</svg>
