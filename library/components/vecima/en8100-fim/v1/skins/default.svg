<svg xmlns="http://www.w3.org/2000/svg" width="205mm" height="98mm" viewBox="0 0 205 98">
  <!-- The forward injection module: a brushed-aluminium plate. Jacks and the lamp are composed
       as parts; the plate, the handle slot, the screws and the printed legends are drawn here. -->
  <rect id="plate" x="0" y="0" width="205" height="98" rx="1.5" fill="#c9ccd0" stroke="#8d9196" stroke-width="0.4"/>
  <rect x="82" y="30" width="5" height="38" rx="2.5" fill="#9aa0a6" stroke="#6f7479" stroke-width="0.3"/>
  <circle cx="5" cy="5" r="2.2" fill="#e3e5e8" stroke="#7f8489" stroke-width="0.3"/>
  <circle cx="200" cy="5" r="2.2" fill="#e3e5e8" stroke="#7f8489" stroke-width="0.3"/>
  <circle cx="5" cy="93" r="2.2" fill="#e3e5e8" stroke="#7f8489" stroke-width="0.3"/>
  <circle cx="200" cy="93" r="2.2" fill="#e3e5e8" stroke="#7f8489" stroke-width="0.3"/>
  <g id="silkscreen" font-family="Helvetica, Arial, sans-serif" fill="#202326">
    <text x="24" y="17.2" font-size="2.6">LEFT</text>
    <text x="24" y="20" font-size="2.6">OUT</text>
    <text x="59" y="14.3" font-size="2.6">LEFT</text>
    <text x="59" y="17.1" font-size="2.6">IN</text>
    <text x="59" y="74.7" font-size="2.6">RIGHT</text>
    <text x="59" y="77.5" font-size="2.6">IN</text>
    <text x="24" y="82" font-size="2.6">RIGHT</text>
    <text x="24" y="84.8" font-size="2.6">OUT</text>
    <text x="152" y="38.6" font-size="2.6">LOCAL</text>
    <text x="152" y="41.4" font-size="2.6">RF IN</text>
    <text x="164" y="76.6" font-size="2.6">POWER</text>
    <text x="112" y="76" font-size="2.6">OPTICAL</text>
    <text x="112" y="78.8" font-size="2.6">TEST PT</text>
    <text x="38" y="90" font-size="2.6" font-weight="bold">FORWARD INJECTION MODULE</text>
  </g>
</svg>
