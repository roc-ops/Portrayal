format: 1
kind: component
name: earth-stud-disc
version: 1.0.0
class: ground
interface: terminal-stud
behaviour: mounts
profile: networking
description: >-
  The earthing stud of the MikroTik CRS309, CRS326 and CSS326, seen end on and drawn as a plain disc: a pale round base 8.0
  across with a darker round nut 4.0 across at its centre. The stud carries a wing nut, which is not drawn: this disc stands in
  for it until a wing-nut part is drawn. It presents the nominal `terminal-stud` interface on its axis, at the face of the
  panel, so a ring lug lies where it seats. No symbol: where the panel prints an earth mark beside it, that is
  common/ground-symbol@1 placed separately.
size: {w: 8.0, h: 8.0}
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  the two discs as the rear art of the three switches drew them; the wing nut, which the dimension drawing gives as 11 mm
  off the rear, is not drawn
provenance:
  size: >-
    estimated - the base disc (8.0 across, #b4b8bc) and the nut disc (4.0 across, #8d9298) that the CRS309, CRS326 and CSS326
    drew at the stud's place, read off the product studio photographs of their rears. The dimension drawing of the CRS326 and
    CSS326 gives the wing nut as 11 mm off the rear; its width is not read.
  stand-in: >-
    A STAND-IN, DECLARED. The stud has a wing nut and this part draws a disc. Each of the three devices carries a gap,
    `earth-stud-part`, that asks for a wing-nut part; when one is drawn the three move to it.
  seat: >-
    THE LUG SEATS ON THE FACE OF THE PANEL, AT THE DISC'S CENTRE. `mate` states no `seat-out` and no `on`: no height of the
    stud is built, so a lug lies on the face. The wing nut's own 11 mm is a depth the drawing gives and this part does not build.
elements: {}
connection-points:
  mate: {at: [4.0, 4.0], direction: front}
skins: [default]
