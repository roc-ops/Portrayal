<svg xmlns="http://www.w3.org/2000/svg" width="24mm" height="1.9mm" viewBox="0 0 24 1.9">
  <!-- one finger from the front, end-on: a flat tab the thickness of the sheet, in a mid steel
       with a dark outline and a highlight so it reads against the black plate -->
  <rect x="0" y="0" width="24" height="1.9" rx="0.5" fill="#3a3f45"/>
  <rect id="finger" x="0.3" y="0.3" width="23.4" height="1.3" rx="0.4" fill="#8b949e"/>
  <rect x="1.2" y="0.5" width="21.6" height="0.4" rx="0.2" fill="#c3cad1"/>
</svg>
