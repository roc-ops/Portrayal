format: 1
kind: component
name: hm-plate-2u
version: 1.0.0
class: mechanical
description: >-
  The centre plate of a Hubbell M-Series 2 RU horizontal cable manager, seen from the
  front. It is a steel plate as wide as the rack, with its ears in the same sheet. Four
  rounded windows let a cable cross it. It is drawn as the well that the wire rings
  stand in.
provenance:
  size: >-
    datasheet - HM24C spec sheet (hubbellcdn.com/specsheet/PREMISE_HM24C_spec.pdf),
    dimensions table: A 2 RU, 3.5 in (89 mm), B 19 in (483 mm). The figure marks A at the
    plate's own end, so A is the plate's height; B is taken as the 19 in, 482.6 mm, that
    the sheet's mm column rounds. The ears are the plate's ends, so the plate is drawn
    whole.
  depth: >-
    datasheet - 101.6, the sheet's C, 4 in (102 mm), the projection of the rings from the
    plate. The well is as deep as the rings stand out, so the floor lies C behind the
    front of the part; the rear side is the same part seen from behind, with D, the rear
    extension, estimated at the same 101.6 (see the device's `rear-extension`).
  windows: >-
    estimated - four rounded windows, read off the sheet's figure and photograph. The
    figure has no dimension on them; they are scaled against B along the plate (a pitch of
    112 mm between window centres read on the HM14C and HM24C figures, 117 on the HM34C,
    taken as 112) and against A across it (a window 0.75 of the plate's height, 66.7 mm,
    centred; 84 mm wide, the pitch less a 28 mm web; corner radius 15). Perspective in the
    figure makes each reading good to a few millimetres. The sheet's "Pass through holes:
    Standard" is these windows: the one opening in the plate a cable crosses by.
  mounting-holes: >-
    not drawn - the sheet lists "EIA/ECA-310-E Universal Mounting Pattern" and draws a
    slot pair in each ear, with no dimension. The hole positions are the standard's, not
    the sheet's, so no slot is drawn.
  thickness: >-
    estimated - 1.5 mm. No Hubbell sheet states a gauge for the M-Series plate; the S-Series
    sheet gives 14 gauge for its own steel, which is not this part.
  color: >-
    datasheet - "Finish: Black Powder Coated" on the sheet. Drawn as the library's black
    steel, '#1b1d20'.
size: {w: 482.6, h: 88.9, d: 101.6}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
relief: {wall: '#1b1d20'}
elements:
  plate: {at: [0.0, 0.0], size: [482.6, 88.9], class: bezel}
skins: [default]
