<svg xmlns="http://www.w3.org/2000/svg" width="5.715mm" height="44.45mm" viewBox="0 0 5.715 44.45">
  <!-- one wire ring end-on: the loop runs back from the viewer to the plate; the post at the
       free end stands in front, the two wires end in it as discs, and a highlight runs down
       the round wire so it reads against the black plate -->
  <rect id="root" x="0" y="0" width="5.715" height="44.45" rx="2.8575" fill="#4b525a"/>
  <rect id="post" x="0" y="0" width="5.715" height="44.45" rx="2.8575" fill="#59616a"/>
  <rect x="1.2" y="6" width="1.3" height="32.45" rx="0.65" fill="#9aa3ad"/>
  <rect id="top" x="0" y="0" width="5.715" height="5.715" rx="2.8575" fill="#7d8791"/>
  <rect id="bottom" x="0" y="38.735" width="5.715" height="5.715" rx="2.8575" fill="#7d8791"/>
</svg>
