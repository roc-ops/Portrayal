format: 1
kind: component
name: hs23c-tab
version: 1.0.1
class: mechanical
behaviour: mounts
description: >-
  One upright tab of the Hubbell S-Series HS23C horizontal cable manager, seen from the front.
  It is a 14 gauge steel tab that stands up from the front edge of the bottom flange, at a web
  between two windows. With the fingers it holds the cover in place.
provenance:
  size: >-
    estimated - 15 mm wide and 20 mm high, read off the sheet's figure against A (about
    a fifth of the plate's height) and B; the sheet dimensions no tab. Its 1.9 mm thickness is
    the sheet's "Gauge 14".
  relief: >-
    estimated - a flat plate 1.9 mm thick at the front of the flange, behind the cover, as
    the figure draws five of them, one below each finger. The notch the figure shows near
    the tip of each is not drawn.
  color: >-
    datasheet - "Finish: Black Powder Coated" on the sheet. Drawn in a mid steel tone, like
    the fingers, so it reads against the near-black flange (a stand-in: the sheet states no
    tone for a highlight).
size: {w: 15.0, h: 20.0}
size-confidence: {w: estimated, h: estimated}
