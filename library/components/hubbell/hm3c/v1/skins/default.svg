<svg xmlns="http://www.w3.org/2000/svg" width="482.6mm" height="116.84mm" viewBox="0 0 482.6 116.84">
  <!-- the cover from the front: one panel the width of the manager, a folded edge along the
       top and the foot, and the blank name plate at the middle (no mark on it) -->
  <rect id="plate" x="0" y="0" width="482.6" height="116.84" fill="#2a2d31"/>
  <rect id="fold-top" x="0" y="0" width="482.6" height="6" fill="#3a3f45"/>
  <rect x="0" y="6" width="482.6" height="0.5" fill="#4b525a"/>
  <rect id="fold-bottom" x="0" y="110.84" width="482.6" height="6" fill="#3a3f45"/>
  <rect x="0" y="110.34" width="482.6" height="0.5" fill="#1b1d20"/>
  <rect id="name-plate" x="212.3" y="52.42" width="58" height="12" rx="1" fill="#34383d" stroke="#4b525a" stroke-width="0.3"/>
  <rect id="logo-zone" x="212.3" y="52.42" width="58" height="12" fill="none"/>
</svg>
