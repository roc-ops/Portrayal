<svg xmlns="http://www.w3.org/2000/svg" width="482.6mm" height="88.9mm" viewBox="0 0 482.6 88.9">
  <!-- the cover from the front: one panel the width of the manager, a rolled edge along the
       top, a slot mark near each end and the blank name plate at the middle (no mark on it) -->
  <rect id="plate" x="0" y="0" width="482.6" height="88.9" fill="#2a2d31"/>
  <rect id="roll-top" x="0" y="0" width="482.6" height="6" fill="#3a3f45"/>
  <rect x="0" y="6" width="482.6" height="0.5" fill="#4b525a"/>
  <rect id="slot-left" x="12" y="42.45" width="14" height="4" rx="2" fill="#15171a"/>
  <rect id="slot-right" x="456.6" y="42.45" width="14" height="4" rx="2" fill="#15171a"/>
  <rect id="name-plate" x="218.8" y="31.95" width="45" height="25" rx="1" fill="#34383d" stroke="#4b525a" stroke-width="0.3"/>
  <rect id="logo-zone" x="218.8" y="31.95" width="45" height="25" fill="none"/>
</svg>
