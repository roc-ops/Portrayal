<svg xmlns="http://www.w3.org/2000/svg" width="108.97mm" height="35.05mm" viewBox="0 0 108.97 35.05">
  <!-- FHD-MTP2412LCDXOM3A (FS SKU 382897) wears fs/fhd-1mtp24-lc-os2-a@2's faceplate
       plus three printed marks of its own, drawn at the end of the
       silkscreen group; its OM3 adapter colour is set by the contract. What follows
       is the twin's own header.

       FHD-1MTP12LCDOS2A faceplate, 108.97 x 35.05, FS SKU 57023 - measured off
       FS's own face-on render 57023.B.jpg, see the contract's size-notes. The
       same front-panel mould as fhd-2mtp12-lc-os2-a@2 (SKU 57341); only the
       rear differs.

       THE TWELVE LC CUTOUTS ARE NOT DRAWN HERE, for the same reason
       fhd-2mtp12-lc-os2-a@2's twelve are not: each composed
       common/lc-duplex-v-adapter@4 draws its own bezel and its own two port
       openings at its `at` position, so a second rect here would duplicate
       geometry the composed parts already own and the two copies would
       drift the day one is edited and the other is not.

       THE TWO THUMB-KNOBS ARE DRAWN, NOT RECORDED AS A GAP, by the same eye
       reading fhd-1mtp6lcd-os2-a@2 and fhd-2mtp12-lc-os2-a@2 both make:
       57023.B.jpg shows one captive knurled knob at each end of the face,
       roughly level with its vertical centre. No dimensioned drawing gives
       their exact centre or radius, so the two circles below reuse the same
       by-eye figures the other two FHD faceplates already use - all three
       share the same knob design at the same 108.97 x 35.05 envelope. A
       caliper on a real panel settles the precise figures if that is ever
       needed. -->
  <defs>
    <linearGradient id="bez" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4248"/>
      <stop offset="1" stop-color="#23272c"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#4a5056"/>
      <stop offset="1" stop-color="#1c1f22"/>
    </radialGradient>
  </defs>
  <rect id="bezel" x="0" y="0" width="108.97" height="35.05" rx="1.5"
        fill="url(#bez)" stroke="#15181a" stroke-width="0.3"/>
  <circle id="thumb-knob-left" cx="7.9" cy="17.525" r="3.1"
          fill="url(#knob)" stroke="#0e1012" stroke-width="0.25"/>
  <circle id="thumb-knob-right" cx="101.07" cy="17.525" r="3.1"
          fill="url(#knob)" stroke="#0e1012" stroke-width="0.25"/>
  <!-- THE PORT NUMBERS, AND ONLY EIGHT OF THEM. FS prints a pair at each end of
       each row: the lower row is 1-12 and the upper is 13-24, so `2`/`1` and
       `12`/`11` below, `14`/`13` and `24`/`23` above (57341.B.jpg - which is
       byte-for-byte the render FS also serves for SKU 57023, so this is ONE
       reading covering both two-row cassettes, not two). Measured against the
       adapters rather than the plate box: right-aligned 1.49 left of the first
       adapter of a row, left-aligned 1.50 right of the last, cap height 2.61,
       drawn at a 3.5 font-size with the single-row plates. -->
    <!-- A LOGO MARK IS PRINTED HERE AND IS NOT REPRODUCED (vendor logos are
       never drawn - library/components/README.md); the zone is reserved and
       left as plate. -->
  <rect id="logo-zone" x="2.0" y="1.8" width="6.0" height="6.0" fill="none"/>
  <g id="silkscreen">
    <text id="port-14" x="14.24" y="7.55" font-size="2.57" text-anchor="end"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">14</text>
    <text id="port-13" x="14.24" y="14.95" font-size="2.57" text-anchor="end"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">13</text>
    <text id="port-24" x="91.30" y="7.55" font-size="2.57" text-anchor="start"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">24</text>
    <text id="port-23" x="91.30" y="14.95" font-size="2.57" text-anchor="start"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">23</text>
    <text id="port-2" x="14.24" y="23.18" font-size="2.57" text-anchor="end"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">2</text>
    <text id="port-1" x="14.24" y="30.51" font-size="2.57" text-anchor="end"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">1</text>
    <text id="port-12" x="91.30" y="23.18" font-size="2.57" text-anchor="start"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">12</text>
    <text id="port-11" x="91.30" y="30.51" font-size="2.57" text-anchor="start"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">11</text>
      <!-- MARKS THIS PLATE CARRIES AND ITS OS2 TWIN DOES NOT, measured on
         382897.g1.jpg and 382889.g1.jpg (both 1600 px, panel_measure-validated), which
         agree to 0.1 mm. x is in panel_measure's plate frame; y is taken from the
         nearest digit this skin already draws (see provenance.face-marks). Cap heights are set at the twin's own digits' ratio
         (2.61 cap on 3.5 type) and each word is fitted to its measured ink
         width. See the contract's provenance.face-marks. -->
    <rect id="mtp-tag" x="99.31" y="2.55" width="6.53" height="2.92" rx="0.35"
          fill="#fbda1f"/>
    <text id="mtp-tag-text" x="102.63" y="4.97" font-size="2.56" text-anchor="middle"
          textLength="5.55" lengthAdjust="spacingAndGlyphs"
          font-family="Helvetica, Arial, sans-serif" fill="#161214">MTP</text>
    <rect id="code-tag" x="95.07" y="27.85" width="10.76" height="2.84" rx="0.35"
          fill="#b8d9ec"/>
    <text id="code-tag-text" x="100.45" y="30.26" font-size="2.68" text-anchor="middle"
          textLength="9.83" lengthAdjust="spacingAndGlyphs"
          font-family="Helvetica, Arial, sans-serif" fill="#232323">DL1A3P</text>
    <text id="fhd-mark" x="1.82" y="30.77" font-size="2.68" text-anchor="start"
          textLength="4.96" lengthAdjust="spacingAndGlyphs"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">FHD</text>
  </g>
</svg>
