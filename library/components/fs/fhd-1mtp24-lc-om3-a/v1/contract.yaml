provenance:
  face-legends: >-
    THE PORT NUMBERS ARE THE TWIN'S NUMBERS AND BASELINES, NOT ITS TYPE.
    382897.g1.jpg shows the same end-of-row numbers (fs/fhd-1mtp24-lc-os2-a@3
    lists them) in the same rows, and nothing between them - but printed
    smaller and lighter than the twin's: cap height 1.92 against 2.50, regular
    against bold. They are drawn so, at 2.57 regular with anchors 15.73 and
    92.89, on the twin's baselines - see provenance.face-marks for the
    measurement.
  size: >-
    see size-notes - the plate and the parts are 57023's, re-read on 382897's
    own render; the depth is this SKU's product page.
  parts: >-
    the twin's positions, unchanged, and corroborated rather than assumed:
    `panel_measure.openings` on 382897.g1.jpg puts every adapter within 0.2 mm
    of where the same call puts it on the twin's render. What differs is the
    housing colour, passed to each adapter as `housing-finish`.
  colour: >-
    COUNTED, NOT TAKEN FROM THE OM3 CONVENTION. #4ecee4 is the median of the
    adapter-body pixels on 382897.g1.jpg, selected by the one rule
    common/lc-duplex-v-adapter@4's provenance.colour records - tuned until it
    reproduces that part's measured OS2 blue off 57016.main.jpg, then applied
    unchanged here. That entry lists every medium's count side by side.
  optical: >-
    the twin's paths, unchanged: fibre type and adapter colour do not change
    which LC port a fibre reaches. `media: om3` is FS's own naming of 382897
    (FHD-MTP2412LCDXOM3A) on its product page. See the twin's
    provenance.optical for how the paths were derived.
  twin: >-
    built from fs/fhd-1mtp24-lc-os2-a@3 (SKU 57023) - the same cassette FS
    builds in OM3. Everything but the model, SKU, fibre, adapter colour, depth
    source and three printed marks (see face-marks) is the twin's.

  face-marks: >-
    THIS PLATE PRINTS THREE MARKS ITS OS2 TWIN DOES NOT, and they are drawn:
    `FHD` at the lower left, a yellow `MTP` tag at the upper right and a pale
    blue `DL1A3P` tag at the lower right, level with port 11. the 2026 FS
    renders of the two OM3 cassettes (382889.g1.jpg, 382897.g1.jpg) are the
    only ones in the corpus that show them; no other FHD render carries them,
    so they are this plate's and not the family's. Measured on both renders,
    agreeing to 0.05 mm. ACROSS, in panel_measure's plate frame as #503 and
    #506 corrected it (median edges, median width) - the frame in which these
    plates' housings start at 17.20 and 17.16, where the twin's corrected row
    does. Until those corrections this entry read every x about 1.5 mm low, as
    every FHD figure measured with the tool did; the marks moved with them.
    DOWN, FROM THE NEAREST DIGIT THIS SKIN ALREADY DRAWS, not from the plate
    frame: its y scale runs 2.5-2.7% off 35.05 on these renders, and a fit on
    the four digit baselines disagrees with the x scale by 3.6%, so a mark 27
    mm down would carry up to 0.7 mm of frame error - enough to move the code
    tag visibly off its port number. Measured locally the error is under 0.1
    mm. The MTP tag spans 5.00 to 2.07 above the `24` baseline (7.55), so y
    2.55-5.48, its ink baseline 2.58 above; the code tag spans 2.66 above to
    0.17 below the `11` baseline (30.51), so y 27.85-30.68, its ink baseline
    0.25 above; the `FHD` baseline sits 0.25 below the `1` baseline, 30.77.
    Across: MTP tag 100.91-107.44, fill #fbda1f, ink 5.55 wide and 1.9 tall;
    code tag 96.67-107.44, fill #b8d9ec, ink 9.83 wide and 2.0 tall - the right
    edges of the two tags align at 107.44; `FHD` ink 3.01-8.28, white - an
    earlier reading of 1.82-6.78 was a mask clipped at x 1.8, not the ink. Type
    sizes are the cap heights over the 2.61/3.5 ratio the digits of the twin
    are set at, and each word is fitted to its measured width. The two SKUs
    print different codes - DL2A3P on the 2x MTP-12, DL1A3P on the MTP-24 -
    transcribed as printed; what the code means is not stated anywhere held.
    THE PORT DIGITS ARE SMALLER AND LIGHTER ON THIS PLATE, and drawn so. Their
    cap height is 1.92 mm on both OM3 renders against 2.50 on the OS2 and OM5
    prints (57341.B.jpg, 174248.g1.jpg) - the same size as the other marks on
    this plate, so a different print rather than a different measurement - and
    they are regular weight where the twin sets bold. Set at 2.57 (1.92 over
    the 2.61/3.5 ratio), regular. Their ink ends at 15.48 on the left and
    starts at 93.02 on the right, as the twin's nearly do; with the side
    bearing of the smaller type the anchors are 15.73 (end) and 92.89 (start).
    Baselines are the twin's, unchanged - they are what the tags above are
    measured from. At the twin's bold 3.5 the `11` ran into the code tag.
  logo-zone: >-
    photo-measured - a round logo mark sits at the upper left, 3.0-9.1 x
    2.25-8.25 on both OM3 renders. IT IS NOT DRAWN: vendor logos are not
    reproduced (library/components/README.md); the zone is reserved and left as
    plate.
elements:
  logo-zone: {at: [3.0, 2.25], size: [6.1, 6.0], class: label}
