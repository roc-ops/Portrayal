name: fhd-1mtp24-lc-om3-a
version: 1.0.0
class: cassette
behaviour: fills
description: >-
  FS FHD-MTP2412LCDXOM3A - MTP-24 (male) to twelve LC duplex, 24 fibres, OM3,
  Type A. FS SKU 382897. The same cassette as fs/fhd-1mtp24-lc-os2-a@3 (SKU
  57023) in OM3 fibre, with OM3-coloured adapters.
size: {w: 108.97, h: 35.05, d: 117.86}
size-confidence: {w: photo-measured, h: photo-measured, d: datasheet}
size-notes: >-
  THE FACEPLATE IS 57023's IN LAYOUT, PRINTED DIFFERENTLY - three marks of its
  own and smaller, lighter port digits (see provenance.face-marks) - the OS2
  twin this is built on, and so are its parts. FS's face-on render of 382897
  (382897.g1.jpg) was put through `spec/tools/intake/panel_measure.py` - scaled
  on the 108.97 mm module width and validated against the 35.05 mm height - and
  its adapter centres read within 0.2 mm of the same measurement taken on the
  twin's own render: the same two rows of six, on the same centres. See the
  twin's size-notes for how the plate was measured. The 117.86 depth is FS's
  own product page for 382897, which states 35 x 109 x 118 mm (1.38 x 4.29 x
  4.64 in).
attrs: {media: fiber, model: FHD-MTP2412LCDXOM3A, vendor-sku: '382897'}
