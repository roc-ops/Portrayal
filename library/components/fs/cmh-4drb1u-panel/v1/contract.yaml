format: 1
kind: component
name: cmh-4drb1u-panel
version: 1.0.0
class: mechanical
description: >-
  The steel panel of the FS CMH-4DRB1U recessed cable manager seen from the front -
  the plate between the ear folds, with five obround pass-through windows the
  brush strip behind it shows through - drawn as the well its rings stand in
provenance:
  size: >-
    drawing - the front view of the CMH-4DRB1U in FS's Horizontal Cable Managers with
    D-rings datasheet (fig. on the page after the specification table), at 2.199 px/mm
    across from its 482.6 dimension line (1061 px) and 2.227 px/mm down from its 44
    (98 px). Its 17.32 in [440 mm] dimension is the body between the ear folds, which
    is this part's width; the line pair the drawing puts at each fold reads 438.5,
    inside one pixel pair of it.
  size-windows: >-
    drawing - the same view. Five obround windows, 25.6 high from 9.4 to 35 mm down,
    symmetric about the centre: 40.5, 74.6, 79.6, 74.6 and 40.5 wide, their edges at
    21.1, 61.6, 88.9, 163.5, 182.7, 262.3, 282.4, 357, 378.4 and 418.9 mm from the
    left fold. The drawing dimensions the end window 1.6 in [40 mm] and the middle
    one 3.1 in [79 mm], which the pixel readings agree with; the other two are read,
    not dimensioned. Each is a hole in the plate, and the brush behind it is the
    device's.
  depth: >-
    drawing - 86. The side view of the same figure dimensions the ring's lower arm
    3.4 in [88 mm] from the back of the panel and the upper arm 3 in [76 mm], and the
    datasheet's 88 deep is that ring. A well is built 2 mm short of the far face, so
    the panel's face is 86 behind the rings' tips, with the 1.2 mm sheet (0.05 in,
    dimensioned) and the brush behind it.
  color: >-
    estimated - FS states "Steel, Powder-coated Black". Every image of the part is a
    render, so the value is FS's render material and not a photograph of a finish.
size: {w: 440, h: 44, d: 86}
size-confidence: {w: drawing, h: drawing, d: drawing}
relief: {wall: '#1b1d20'}
elements:
  plate: {at: [0.0, 0.0], size: [440, 44], class: bezel}
skins: [default]
