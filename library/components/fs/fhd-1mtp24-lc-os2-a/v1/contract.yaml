version: 1.3.0
class: cassette
behaviour: fills
description: >-
  FS FHD-1X24MTPLCOS2A - MTP-24 (male) to twelve LC duplex, 24 fibres, OS2,
  Type A polarity. FS SKU 57023. THE FIRST CASSETTE IN THIS LIBRARY WITH A
  SINGLE REAR CONNECTOR WIDER THAN TWELVE - common/mpo-adapter@1 is fixed at
  12 positions, so this rear needs common/mpo24-flange-adapter@1 instead, a sibling
  part rather than an edit to the twelve everything else already composes.
size: {w: 108.97, h: 35.05, d: 117.86}
size-confidence: {w: photo-measured, h: photo-measured, d: drawing}
size-notes: >-
  The faceplate is MEASURED off FS's own face-on render 57023.B.jpg, scaled
  on the 108.97 mm FHD module width and validated against the 35.05 mm
  height to 2.87% (`panel_measure.validate`, limit 3.0%) - the same
  tolerance fhd-2mtp12-lc-os2-a@1's own 57341.B.jpg reproduces to the tenth
  of a percent, which is expected: both SKUs share one FHD panel mould at
  twelve front adapters, twenty-four fibres, differing only in what the rear
  carries. The 117.86 depth is FS's own dimension line on 57023.C.jpg, which
  reads 4.29in x 1.38in x 4.64in - 108.97 x 35.05 x 117.86, identical to
  57341's own drawing - corroborating the width and height a second,
  independent way and supplying the one figure the face-on render cannot.
