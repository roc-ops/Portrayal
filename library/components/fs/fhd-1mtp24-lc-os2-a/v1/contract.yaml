provenance:
  size: >-
    Faceplate measured off FS's own face-on render 57023.B.jpg, scaled on
    the 108.97 mm FHD module width and validated against the 35.05 mm height
    to 2.87% - see size-notes for the corroborating dimension line that
    supplies the depth.
  parts: >-
    THE SIX COLUMN CENTRES AND TWO ROW CENTRES ARE THE MEASUREMENT, not a
    pitch multiplied out - MEASURED INDEPENDENTLY ON 57023.B.jpg, not copied
    from fhd-2mtp12-lc-os2-a@1, though the two agree to the third decimal
    because both renders share one FHD panel mould (see size-notes).

    `panel_measure.openings()` on 57023.B.jpg's plate finds six column
    centres per row, identical between the two rows to 0.00 spread: x =
    21.861, 34.710, 47.727, 60.743, 73.676, 86.775 (mm from the plate's left
    edge). Five gaps of 12.849, 13.017, 13.016, 12.933, 13.099 - mean 12.983,
    spread 0.25, kept rather than averaged away, the same treatment every
    other FHD cassette in this library gives its own uneven gaps.
    `at.x` for each column is centre - 9.28/2 (common/lc-duplex-v-adapter@3's
    own measured width): 17.22, 30.07, 43.09, 56.10, 69.04, 82.14.

    A vertical scan of each column (the pale opening band against the black
    plate) gives two row centres, independently of the horizontal scan and
    likewise with under 0.2 mm spread across all six columns: the row nearer
    the top of the render spans y = 4.673 to 16.854, centre 10.763; the row
    nearer the bottom spans y = 19.358 to 31.706, centre 25.532. `at.y` for
    each row is centre - 13.75/2 (the adapter's own measured height): 3.89
    for the row nearer the top, 18.66 for the row nearer the bottom -
    matching fhd-2mtp12-lc-os2-a@1's own two row centres exactly, which is
    the expected result of two SKUs sharing one front-panel mould rather
    than a coincidence or a copy.

    THE TWO ROWS ARE COLUMN-ALIGNED, sharing one set of six x centres -
    confirmed the same way fhd-2mtp12-lc-os2-a@1's own provenance confirms
    it, and why `ids` are zero-padded (`lc01`..`lc12`) so string sort never
    disagrees with numeric order.
  optical: >-
    THE FRONT ARRANGEMENT IS TWO ROWS OF SIX, NOT ONE ROW OF TWELVE - see
    provenance.parts. Twelve common/lc-duplex-v-adapter@3 parts (9.28 mm
    each) do not fit across a 108.97 mm face at any workable pitch, exactly
    as the task brief predicted before any image was opened, and the
    measurement above confirms it rather than assuming it.

    L88 THEREFORE REQUIRES `optical.front-order`, because a face with fibre
    parts at more than one `at.y` is exactly the shape `_front_parts`
    (spec/tools/portrayal/optical_ports.py) cannot number from `at.x` alone
    - whether the vendor prints row-then-row or column-then-column, and
    which row comes first, is a fact about the SILKSCREEN, not the geometry.
    57023.B.jpg PRINTS the port numbers directly on the plate: `1` through
    `12` along the row nearer the bottom of the render, `13` through `24`
    along the row nearer the top, both left to right - confirmed a second
    way by 57023.F.jpg, a close crop of the right end showing `24`/`23`
    above `12`/`11`, and by 57023.E.jpg's own rear legend, `1-24` on a
    single MTP-24 opening (see below). `optical.front-order` above -
    `[lc01..lc06, lc07..lc12]` - reads bottom row first (1-12), top row
    second (13-24), each left to right: the SAME order and the SAME id
    convention fhd-2mtp12-lc-os2-a@1 already uses for the same physical
    layout, adopted here because it is what the silkscreen prints, not
    because the two contracts should match. Confidence: SOURCED, read off
    57023.B.jpg and 57023.F.jpg directly, not derived from placement - the
    same standing fhd-2mtp12-lc-os2-a@1's own `front-order` provenance
    documents, including that contract's own two retracted derivations of
    why geometry alone cannot be trusted for this.

    THE REAR IS A SINGLE MTP-24, NOT TWO MTP-12s - the one respect in which
    this SKU differs from fhd-2mtp12-lc-os2-a@1 despite the identical front.
    57023.E.jpg is FS's own rear render: one MPO/MTP opening, captioned
    `1-24` to its left and `Type A` to its right, with a `MALE` warranty
    seal above it - a single port carrying every position, confirmed
    against the catalogue row itself ("FHD® MTP-24 (Male) to LC Cassette,
    OS2, 24 Fibers, Type A") and against 57023.D.jpg's three-quarter side
    view, which shows one MTP plug (with its pull tab) where
    fhd-2mtp12-lc-os2-a@1's own equivalent view shows two.

    THE MTP-TO-FIBRE PINOUT IS THE SAME ASSUMPTION EVERY OTHER FHD CASSETTE
    IN THIS LIBRARY MAKES, and for the same reason: no per-fibre diagram
    exists in the fhd-fiber-cabling-system-guide or
    modular-cabling-system-portfolio corpora for any FHD cassette, SKU 57023
    included - only the polarity TYPE is named. So the 24 paths above are
    the STANDARD TYPE A STRAIGHT-THROUGH arrangement: MTP position n to
    fibre n in order, rear:mtp.1 to lc01.1 through rear:mtp.24 to lc12.2,
    walking front-order exactly as fhd-1mtp6lcd-os2-a@1 and
    fhd-2mtp12-lc-os2-a@1 both do for their own twelve and twenty-four.
    Confidence: ESTIMATED - the same word carries this contract's pinout
    that it carries theirs.

    THE POLISH IS THE SAME KIND OF ASSUMPTION AND IS MARKED THE SAME WAY.
    The catalogue row for SKU 57023 - "FHD® MTP-24 (Male) to LC Cassette,
    OS2, 24 Fibers, Type A" (working/intake/fs/fhd/CATALOGUE.tsv) - names
    the polarity TYPE and stops, the identical silence SKU 57016's and
    57341's own rows leave, and does NOT name the polish. `polish: upc` is
    therefore the convention for an OS2 cassette with no APC stated, not a
    fact read off FS's own description of this part - the same wording
    fhd-1mtp6lcd-os2-a@1 and fhd-2mtp12-lc-os2-a@1 both use for their own
    identical gap, deliberately not copied verbatim: this note cites SKU
    57023's own catalogue row, not theirs. A catalogue row naming "LC UPC"
    or "LC APC" outright, a datasheet, or a green ferrule in a face-on
    photograph settles it.
  face-detail-gap: >-
    the FS logo, the `MALE` warranty seal, the two captive thumb-knobs and
    the port numbers 1 through 24 visible on 57023.B.jpg are not drawn - the
    numbering is recorded in provenance.optical and provenance.parts above
    rather than in the art, the same treatment fhd-1mtp6lcd-os2-a@1 and
    fhd-2mtp12-lc-os2-a@1 both give their own faces.
