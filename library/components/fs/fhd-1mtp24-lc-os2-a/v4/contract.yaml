provenance:
  major: >-
    Composes the duplex adapter at v5, whose bores are numbered 1 and 2
    instead of tx and rx, so every path under this part changes
    (`lc01/tx` -> `lc01/1`); nothing drawn moved.
  face-legends: >-
    THE PORT NUMBERS ARE DRAWN NOW, AND ONLY THE END PAIRS ARE - which is all
    FS prints. 57341.B.jpg shows `2`/`1` and `12`/`11` at the ends of the lower
    row and `14`/`13` and `24`/`23` at the ends of the upper one, and nothing
    between them, so a plate numbering every port would be a legend this part
    does not carry. Positions are measured on that render CALIBRATED ON THE
    ADAPTERS, not on the plate box: the plate's rounded corner and its shadow
    put a box scaled on the outline about 2% out, while the adapter row is
    geometry this contract already states exactly. The digits are 1.50 left of
    a row's first adapter and 1.53 right of its last, cap height 2.61.
    57023.B.jpg is byte-for-byte the file FS also serves for SKU 57341, so this
    is ONE reading covering both two-row plates rather than two independent
    ones. The odd number is the LOWER bore of its adapter, the same reading
    common/lc-duplex-v- adapter@4 composes its two bores in.

    THE DIGITS MOVED WITH THE ADAPTERS IN 2.0.0. They were placed 1.49 left of
    the first adapter and 1.50 right of the last, and until 2.0.0 the adapters
    sat about 1.4 mm too far right (see provenance.parts), so the digits did
    too: 15.73 and 92.92. Kept at those same offsets from the corrected
    adapters they are 14.36 and 91.38. Checked a second way: the digits' own
    ink on 57023.B.jpg (the same file as 57341.B.jpg) ends at 14.02 on the left
    and starts at 91.61 on the right, and the same ink measurement on
    57016.main.jpg sits 0.34 inside fs/fhd-1mtp6lcd-os2-a@4's left anchor and
    0.18 outside its right one - applied here, 14.36 and 91.43.

    AND THEY MOVED AGAIN IN 3.0.0, with the adapters, by the same frame
    correction (see provenance.parts): 14.36 and 91.38 became 15.74 and 93.00.
    The ink check above, restated in the corrected frame, reads 15.40 and
    93.23, so 15.74 and 93.05.
  size: >-
    Faceplate measured off FS's own face-on render 57023.B.jpg, scaled on the
    108.97 mm FHD module width and validated against the 35.05 mm height to
    2.87% - see size-notes for the corroborating dimension line that supplies
    the depth.
  parts: >-
    THE SIX COLUMN CENTRES AND TWO ROW CENTRES ARE THE MEASUREMENT, not a pitch
    multiplied out - measured on 57023.B.jpg. NOT AN INDEPENDENT READING of
    fhd-2mtp12-lc-os2-a@3's figures, as this note claimed until 2.0.0:
    57023.B.jpg and 57341.B.jpg are byte-for-byte the same file - FS renders
    the two SKUs' fronts once - so the two agreeing "to the third decimal" was
    one image measured twice.

    `panel_measure.openings()` on 57023.B.jpg's plate finds six column centres
    per row, identical between the two rows to 0.00 spread: x = 23.27, 36.16,
    49.21, 62.27, 75.24, 88.38 (mm from the plate's left edge, in the frame
    3.0.0 corrected - see below). Five gaps of 12.89, 13.06, 13.06, 12.97,
    13.14 - mean 13.023, spread 0.25, kept rather than averaged away, the same
    treatment every other FHD cassette in this library gives its own uneven
    gaps. These are the centres of the pale DUST CAPS, not of the adapters -
    see below.

    `at.x` WAS THE OPENING'S CENTRE LESS HALF THE ADAPTER UNTIL 2.0.0, AND THAT
    PUT EVERY ADAPTER 1.2 TO 1.4 mm TOO FAR RIGHT. What `openings()` finds is
    the pale DUST CAP, and the cap is not centred on the housing:
    common/lc-duplex-v-adapter@6 records it spanning 2.92-8.77 of the 9.28 mm
    body, so its centre is 1.205 right of the body's. Measured directly instead
    - the left edge of each coloured housing, the same `openings()` call with a
    saturation test in place of the pale one - the housings started at x =
    15.85, 28.70, 41.72, 54.74, 67.75, 80.60 on 57023.B.jpg in the frame the
    tool then used (see below). Cap centre less 5.845 gave 16.02-80.93, the
    same answer to within a pixel. The pitch figures above are the caps' and
    stand as caps' pitch.

    `at.x` MOVED IN 3.0.0, BY 1.39 mm AT THE FIRST ADAPTER AND 1.59 AT THE
    LAST, the same correction fs/fhd-2mtp12-lc-os2-a@4 takes off the same file:
    new = (old + 1.335) x 653/651, giving 17.24, 30.13, 43.19, 56.25, 69.30,
    82.19. `panel_measure.plate()` took the plate's left edge from the first
    row of its dark band, on the rounded top corner 1.335 mm inboard of the
    real edge, and scaled on the band's widest row, 0.31% wider than the
    plate's median one. The row sat 15.85 / 19.09 from the two edges and now
    sits 17.24 / 17.50; FS's own rows are symmetric on every face-on render
    held. See fs/fhd-2mtp12-lc-os2-a@4's provenance.parts for the corroboration
    on a render FS drew separately.

    A vertical scan of each column (the pale opening band against the black
    plate) gives two row centres, independently of the horizontal scan and
    likewise with under 0.2 mm spread across all six columns: the row nearer
    the top of the render spans y = 4.673 to 16.854, centre 10.763; the row
    nearer the bottom spans y = 19.358 to 31.706, centre 25.532. `at.y` for
    each row is centre - 13.75/2 (the adapter's own measured height): 3.89 for
    the row nearer the top, 18.66 for the row nearer the bottom - matching
    fhd-2mtp12-lc-os2-a@3's own two row centres exactly, which is the expected
    result of two SKUs sharing one front-panel mould rather than a coincidence
    or a copy.

    THE TWO ROWS ARE COLUMN-ALIGNED, sharing one set of six x centres -
    confirmed the same way fhd-2mtp12-lc-os2-a@3's own provenance confirms it,
    and why `ids` are zero-padded (`lc01`..`lc12`) so string sort never
    disagrees with numeric order.
  optical: >-
    THE FRONT ARRANGEMENT IS TWO ROWS OF SIX, NOT ONE ROW OF TWELVE - see
    provenance.parts. Twelve common/lc-duplex-v-adapter@6 parts (9.28 mm each)
    do not fit across a 108.97 mm face at any workable pitch, exactly as the
    task brief predicted before any image was opened, and the measurement above
    confirms it rather than assuming it.

    L88 THEREFORE REQUIRES `optical.front-order`, because a face with fibre
    parts at more than one `at.y` is exactly the shape `_front_parts`
    (spec/tools/portrayal/optical_ports.py) cannot number from `at.x` alone -
    whether the vendor prints row-then-row or column-then-column, and which row
    comes first, is a fact about the SILKSCREEN, not the geometry. 57023.B.jpg
    PRINTS the port numbers directly on the plate: `1` through `12` along the
    row nearer the bottom of the render, `13` through `24` along the row nearer
    the top, both left to right - confirmed a second way by 57023.F.jpg, a
    close crop of the right end showing `24`/`23` above `12`/`11`, and by
    57023.E.jpg's own rear legend, `1-24` on a single MTP-24 opening (see
    below). `optical.front-order` above - `[lc01..lc06, lc07..lc12]` - reads
    bottom row first (1-12), top row second (13-24), each left to right: the
    SAME order and the SAME id convention fhd-2mtp12-lc-os2-a@3 already uses
    for the same physical layout, adopted here because it is what the
    silkscreen prints, not because the two contracts should match. Confidence:
    SOURCED, read off 57023.B.jpg and 57023.F.jpg directly, not derived from
    placement - the same standing fhd-2mtp12-lc-os2-a@3's own `front-order`
    provenance documents, including that contract's own two retracted
    derivations of why geometry alone cannot be trusted for this.

    THE REAR IS A SINGLE MTP-24, NOT TWO MTP-12s - the one respect in which
    this SKU differs from fhd-2mtp12-lc-os2-a@3 despite the identical front.
    57023.E.jpg is FS's own rear render: one MPO/MTP opening, captioned `1-24`
    to its left and `Type A` to its right, with a `MALE` warranty seal above it
    - a single port carrying every position, confirmed against the catalogue
    row itself ("FHD® MTP-24 (Male) to LC Cassette, OS2, 24 Fibers, Type A")
    and against 57023.D.jpg's three-quarter side view, which shows one MTP plug
    (with its pull tab) where fhd-2mtp12-lc-os2-a@3's own equivalent view shows
    two.

    THE MTP-TO-FIBRE PINOUT IS THE SAME ASSUMPTION EVERY OTHER FHD CASSETTE IN
    THIS LIBRARY MAKES, and for the same reason: no per-fibre diagram exists in
    the fhd-fiber-cabling-system-guide or modular-cabling-system-portfolio
    corpora for any FHD cassette, SKU 57023 included - only the polarity TYPE
    is named. So the 24 paths above are the STANDARD TYPE A STRAIGHT-THROUGH
    arrangement: MTP position n to fibre n in order, rear:mtp.1 to lc01.1
    through rear:mtp.24 to lc12.2, walking front-order exactly as
    fhd-1mtp6lcd-os2-a@3 and fhd-2mtp12-lc-os2-a@3 both do for their own twelve
    and twenty-four. Confidence: ESTIMATED - the same word carries this
    contract's pinout that it carries theirs.

    THE POLISH IS THE SAME KIND OF ASSUMPTION AND IS MARKED THE SAME WAY. The
    catalogue row for SKU 57023 - "FHD® MTP-24 (Male) to LC Cassette, OS2, 24
    Fibers, Type A" (working/intake/fs/fhd/CATALOGUE.tsv) - names the polarity
    TYPE and stops, the identical silence SKU 57016's and 57341's own rows
    leave, and does NOT name the polish. `polish: upc` is therefore the
    convention for an OS2 cassette with no APC stated, not a fact read off FS's
    own description of this part - the same wording fhd-1mtp6lcd-os2-a@3 and
    fhd-2mtp12-lc-os2-a@3 both use for their own identical gap, deliberately
    not copied verbatim: this note cites SKU 57023's own catalogue row, not
    theirs. A catalogue row naming "LC UPC" or "LC APC" outright, a datasheet,
    or a green ferrule in a face-on photograph settles it.
  face-detail-gap: >-
    the FS logo and the `MALE` warranty seal on 57023.B.jpg are not drawn - the
    logo by the library's no-logo rule, the seal because it is a sticker over
    the lid join. The thumb-knobs and the eight end-of-row port numbers ARE
    drawn now; see provenance.face-legends.
skins: [default]
