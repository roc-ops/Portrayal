format: 1
kind: module
name: fhd-1mtp24-lc-os2-a
version: 4.1.1
class: cassette
behaviour: fills
description: >-
  FS FHD-1MTP12LCDOS2A - MTP-24 (male) to twelve LC duplex, 24 fibres, OS2,
  Type A polarity. FS SKU 57023. THE FIRST CASSETTE IN THIS LIBRARY WITH A
  SINGLE REAR CONNECTOR WIDER THAN TWELVE - common/mpo-adapter@2 is fixed at 12
  positions, so this rear needs common/mpo24-flange-adapter@2 instead, a
  sibling part rather than an edit to the twelve everything else already
  composes.
size: {w: 108.97, h: 35.05, d: 117.86}
size-confidence: {w: photo-measured, h: photo-measured, d: drawing}
size-notes: >-
  The faceplate is MEASURED off FS's own face-on render 57023.B.jpg, scaled on
  the 108.97 mm FHD module width and validated against the 35.05 mm height to
  2.87% (`panel_measure.validate`, limit 3.0%). That is the same figure
  fhd-2mtp12-lc-os2-a@3 gets from 57341.B.jpg, and not because two panels
  agree: the two files are byte-for-byte one render, which FS serves for both
  SKUs. Until 2.0.0 this note credited the match to a shared panel mould. The
  117.86 depth is FS's own dimension line on 57023.C.jpg, which reads 4.29in x
  1.38in x 4.64in - 108.97 x 35.05 x 117.86. 57023.C.jpg is also byte-for-byte
  57341.C.jpg, so it is ONE drawing for both SKUs, not a second, independent
  corroboration of the width and height as this note claimed until 2.0.0; it
  still supplies the one figure the face-on render cannot.
