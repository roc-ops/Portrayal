format: 1
kind: component
name: fhd-1mtp6lcd-u-rear
version: 2.2.0
class: cassette
description: >-
  The back of FS FHD-1MTP6LCDOS2U (SKU 182641): the universal-polarity
  cassette's body seen from behind - the MTP and its 1-12 legend, and no
  polarity label.
size: {w: 99.0, h: 31.0}
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  NOT MEASURED, AND NOT MEASURABLE FROM WHAT IS HELD. 57016.D.jpg is the only
  rear view and it is a top-rear three-quarter: the lid recedes and the face is
  foreshortened, so panel_measure refuses it at 3.77% off the second axis
  against a face-on figure of under 2%. It also cannot be scaled on the
  faceplate, because the faceplate OVERHANGS the body - the rear face is the
  body, and the body is narrower by an amount nobody has measured. 99.0 x 31.0
  is proportion read off that render against the known 108.97 x 35.05 front. A
  face-on photograph of the back settles it.

  NO DEPTH IS DECLARED, AND THAT IS THE READING. This contract is a FACE - the
  drawing of a back, not a part with a back of its own - and render.py turns a
  `size.d` on a fixed component into `data-depth`, an aperture as big as the
  whole face. The kit then builds THAT pit and drops the recesses inside it,
  because it takes only the innermost cavity of a nest: the estimated `d: 2.0`
  carried until now swallowed the recesses composed onto this face, so a
  bulkhead's mouth was not built at all and the whole back sat 2 mm below the
  cassette's edge in 3D. The depth of the body this face closes belongs to the
  cassette that carries it - `body.depth` there - and differs between them.
attrs: {media: fiber}
groups:
  adapters:
    term: Adapter
    role: traffic
    index-origin: 1
    attrs: {media: fiber}
    description: >-
      the 1 MTP-12 adapter on the rear face, the trunk ends of the front adapters, passive
parts:
  - {id: mtp, group: adapters, ref: common/mpo-flange-adapter@2, at: [3.0, 14.3]}
provenance:
  twin: >-
    photo - FS's top-rear render of SKU 182641 shows the same body, MTP, flange
    and "1-12" legend as SKU 57016's, and NO polarity label: where the Type A
    and AF backs carry a bordered "Type A"/"Type AF", this one carries only a
    round "please do not tear up" seal on the lid edge, which is not printing
    on this face and is not drawn. Geometry carried across from
    fs/fhd-1mtp6lcd-rear@3.
  size: >-
    see size-notes.
  parts: >-
    THE MTP SITS AT THE LEFT, NOT IN THE MIDDLE. v1 centred it and said so as a
    choice, not a reading. The rear render (57016.D.jpg) is a top-rear
    three-quarter, but the camera is ABOVE the cassette, not beside it, so the
    face is not foreshortened across its width: scaled on the 108.97 faceplate
    that overhangs it (627 px, 5.75 px/mm), the body is 98.2 wide - against
    this contract's 99 - and the adapter's centre is 18 mm from the body's left
    edge, its screw flange spanning about 4 to 32. `at.x` 3.0 puts the 30.0
    wide common/mpo-flange-adapter@2 - the flanged bulkhead the render shows, not
    the panel tile v1 composed - with its centre at 18.0. HEIGHT IS STILL AN ESTIMATE: the render does
    foreshorten vertically, so the centre's 0.64 of the way down the face is a
    proportion of an estimated 31, giving `at.y` 14.3 (centre 19.8), which is
    the same 'a little below the middle' v1 recorded and did not act on.
  face-detail-gap: >-
    Drawn now, by the same across-the-width reading: the `1-12` port-range
    legend above the adapter, centred on it, and the `Type A` polarity label,
    a bordered box spanning 37.5-60.6 of the width. Their heights are
    proportion on an estimated face, as the adapter's is. Still not drawn: the
    `MALE` warranty seal on the lid edge, which is a sticker over the join
    rather than printing on this face, and the two thumb-screws, which are on
    the faceplate that overhangs this body, not on it.
  groups: >-
    FS FHD MTP-12/24 Cassettes Datasheet, page 2 (section I: rear connector, MTP adapters with
    male ferrules) and page 12 (ordering table, which names a cassette by the MTP-12 adapters it
    carries). This face holds one of them, as the contract draws. The datasheet prints the
    connector and the polish and no data rate, and names no role for the adapters; the role
    follows the job, a through connection a trunk cable is plugged into, so it is traffic, and
    no speed is stated. The group's media is the adapters' own, fiber. The front face's LC
    adapters take their own group.
skins: [default]
