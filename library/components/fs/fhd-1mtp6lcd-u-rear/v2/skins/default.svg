<svg xmlns="http://www.w3.org/2000/svg" width="99.0mm" height="31.0mm" viewBox="0 0 99.0 31.0">
  <!-- FHD-1MTP6LCDOS2A rear face, 99.0 x 31.0, FS SKU 57016.

       EVERY DIMENSION IN THIS FILE IS AN ESTIMATE. 57016.D.jpg is the only
       rear view held and it is a top-rear three-quarter, not a face-on
       render: panel_measure refuses it at 3.77% off its second axis, and the
       faceplate cannot supply a scale either, because the faceplate
       OVERHANGS this body - see the contract's size-notes for both reasons.
       99.0 x 31.0 is proportion read off that render against the known
       108.97 x 35.05 front, not a measurement of this body.

       THE MTP APERTURE IS NOT DRAWN HERE: the composed adapter draws its
       own. It sits at the LEFT, centred 18 mm in, with its legend above it
       and the polarity label to its right - read across the width of the
       rear render, which the top-rear camera does not foreshorten. Heights
       are proportion on the estimated 31. See the contract's provenance. -->
  <rect id="bezel" x="0" y="0" width="99.0" height="31.0" rx="1.5"
        fill="#26292d" stroke="#15181a" stroke-width="0.3"/>
  <g id="silkscreen">
    <text id="legend" x="18.0" y="9.2" font-size="3.6" font-family="Helvetica, Arial, sans-serif"
          text-anchor="middle" fill="#e8ebee">1-12</text>
  </g>
</svg>
