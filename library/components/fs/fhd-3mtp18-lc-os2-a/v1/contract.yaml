provenance:
  size: >-
    see size-notes - the FHD module face, validated on 105333.main.jpg; the
    depth is FS's dimension line on 105333.B.jpg.
  face-legends: >-
    SIX NUMBERS, THE ENDS OF THE THREE ROWS: `25`, `13` and `1` down the left
    and `36`, `24` and `12` down the right, top to bottom - so the BOTTOM row
    is 1-12, the middle 13-24 and the top 25-36, as on the 12- and 24-fibre
    plates. One number per row end, not a pair: these adapters are side by
    side, so a row end is one port. Measured on 105333.main.jpg, the render
    that passes panel_measure's check (105335.main.jpg agrees to 0.2 mm and is
    not used). Across, in the plate frame: each side's digits centre on one
    column, x 10.98 and 97.44. Up, from the row seams, in units of the row
    pitch, so the frame's vertical shortfall cancels: the `25`/`36` baselines
    sit 0.333 pitch above the first seam, `13`/`24` 0.623 below it and `1`/`12`
    1.666 below it - 7.86, 18.96 and 31.05 on the 11.6 pitch. The middle pair
    sits half a millimetre higher in its row than the other two, and is drawn
    so; both renders show it. Cap height 2.35 (2.29 in the short frame), so
    3.15 type at the family's 2.61/3.5 ratio; regular weight, as FS prints
    them.
  parts: >-
    EIGHTEEN common/lc-duplex-shuttered-adapter@1, three rows of three abutting
    PAIRS. ACROSS, MEASURED on 105333.main.jpg: the pairs span 12.95-39.33,
    41.13-67.18 and 68.99-95.21, with 1.8 mm of plate between them; each pair's
    second adapter starts one width (13.11) on, at 26.06, 54.24 and 82.10, and
    the in-pair seams read 26.05 and 82.1 where that predicts them.
    105335.main.jpg agrees within 0.25 and is not used. UP, ESTIMATED: the rows
    abut on the adapter's 11.6 pitch (see its size-notes for why 11.6), and the
    three of them fill the plate's height - 34.8 of 35.05 - as the render
    shows, so they are centred: tops 0.125, 11.725 and 23.325. That centring is
    the estimate; the pitch rests on the foreshortening correction.
  knobs: >-
    the FHD family's measured pair, cx 5.1 and 103.87 at r 4.1 - the figure the
    thumb-knob correction on the 12- and 24-fibre plates reads off FS's face-on
    renders, and which test_every_fhd_cassette_draws_the_same_thumb_knobs holds
    every FHD skin to. On 105333.main.jpg the knobs sit at the plate ends the
    same way, clear of the row-end digits.
  colour: >-
    the adapter's own `housing-finish` default, #368ad4, which is this SKU's
    blue as counted on 105333.main.jpg - so no finish is set here.
  optical: >-
    TYPE A, STRAIGHT THROUGH, ROW BY ROW. The rear render prints `1-12`,
    `13-24` and `25-36` under the right, middle and left bulkheads, and the
    front numbers the bottom row 1-12, the middle 13-24 and the top 25-36 - so
    the bottom row runs to the right bulkhead (mtp3), the middle to the middle
    (mtp2), the top to the left (mtp1), each left to right, fibre k of the row
    to MTP position k. The LEFT bore of each adapter is the odd port. Type A is
    FS's own naming of 105333 and its rear label; `front-order` states FS's
    printed numbering, which position cannot (L88).
skins: [default]
