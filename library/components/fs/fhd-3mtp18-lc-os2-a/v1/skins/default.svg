<svg xmlns="http://www.w3.org/2000/svg" width="108.97mm" height="35.05mm" viewBox="0 0 108.97 35.05">
  <!-- FHD-3MTP18LCDOS2A faceplate, 108.97 x 35.05, FS SKU 105333 - read off 105333.main.jpg,
       see the contract's provenance.

       THE EIGHTEEN SHUTTERED ADAPTERS ARE NOT DRAWN HERE: each composed
       common/lc-duplex-shuttered-adapter@2 draws its own body, bores and
       shutters at its `at`, as every FHD plate leaves its adapters to them.
       The knobs are the family's measured pair, and the six row-end numbers are measured -
       see provenance.knobs and provenance.face-legends. -->
  <defs>
    <linearGradient id="bez" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4248"/>
      <stop offset="1" stop-color="#23272c"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#4a5056"/>
      <stop offset="1" stop-color="#1c1f22"/>
    </radialGradient>
  </defs>
  <rect id="bezel" x="0" y="0" width="108.97" height="35.05" rx="1.5"
        fill="url(#bez)" stroke="#15181a" stroke-width="0.3"/>
  <circle id="thumb-knob-left" cx="5.1" cy="17.525" r="4.1"
          fill="url(#knob)" stroke="#0e1012" stroke-width="0.25"/>
  <circle id="thumb-knob-right" cx="103.87" cy="17.525" r="4.1"
          fill="url(#knob)" stroke="#0e1012" stroke-width="0.25"/>
  <g id="silkscreen">
    <text id="port-25" x="11.32" y="7.86" font-size="3.15" text-anchor="middle"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">25</text>
    <text id="port-13" x="11.32" y="18.96" font-size="3.15" text-anchor="middle"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">13</text>
    <text id="port-1" x="11.32" y="31.05" font-size="3.15" text-anchor="middle"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">1</text>
    <text id="port-36" x="97.89" y="7.86" font-size="3.15" text-anchor="middle"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">36</text>
    <text id="port-24" x="97.89" y="18.96" font-size="3.15" text-anchor="middle"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">24</text>
    <text id="port-12" x="97.89" y="31.05" font-size="3.15" text-anchor="middle"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">12</text>
  </g>
</svg>
