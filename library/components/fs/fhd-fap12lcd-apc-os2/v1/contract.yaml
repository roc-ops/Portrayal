size-notes: >-
  THE FHD MODULE FACE, 4.29 x 1.38 in, which FS's adapter-panels datasheet
  dimensions on every panel drawing (pp5-9) as 109 x 35 mm; 108.97 x 35.05 is
  the same two inch figures unrounded, the face every FHD cassette in this
  library already declares. THE DEPTH IS THE PANEL's, NOT A CASSETTE's: FS's
  top views give the adapters' reach in front of and behind a plate about 1.7
  thick, and 29.5 is the plate plus what stands behind it - see
  provenance.depth. A panel is a plate of adapters, not a box, which is why it
  is not class cassette.
