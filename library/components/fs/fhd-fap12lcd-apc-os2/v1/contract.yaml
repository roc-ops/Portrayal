provenance:
  size: >-
    drawing - see size-notes.
  parts: >-
    THE TWELVE BODY CENTRES ARE READ OFF FS's OWN VECTOR DRAWING, not a render:
    fhd-fiber-adapter-panels-datasheet.pdf p5, 24F LC/12F SC Adapter Panel,
    front view, rendered at 1200 dpi and scaled on the plate's 109 mm (4.29in)
    width - 23.25 px/mm, and the plate then reads 35.01 mm tall against the 35
    printed, 0.1%, so the view is orthographic. Six body outlines per row at x
    14.80 ... 84.70, 9.51 wide, centres 19.55 33.53 47.51 61.49 75.49 89.47 - a
    13.98 pitch with 0.04 spread - in two rows centred at y 9.51 and 25.49. Each
    common/lc-duplex-v-adapter@6 (9.28 x 13.75, its own photo-measured box) is
    centred on a drawn body. The drawing draws the body 9.51 x 12.99 and the
    bores as squares 5.79 apart; FS's own adapter drawing (the LC UPC Duplex SC
    Footprint adapter datasheet, p3) dimensions the same part 9.3 wide, 14.8
    tall, bores 6.25 apart. The adapter keeps its own geometry; the panel
    supplies only where each one sits. THE PITCH IS NOT THE CASSETTE'S: FS lays
    these twelve 13.98 apart where the cassettes carry the same adapter about
    13.0 apart (standards.yaml fhd-lc-cassette); the drawing's bores sit 1.14
    right of each body centre, as the adapter's own bores sit 1.21 right of its
    centre, which is the cross-check that the body - not the bore - is what was
    centred.
  face-legends: >-
    read off the same drawing: FS prints only the end pairs - 2 over 1 and 14
    over 13 left of the first column, 12 over 11 and 24 over 23 right of the
    last - with 2.58 mm digits, drawn at a 3.5 font-size as the cassettes' 2.61
    are. The lower row is 1-12 and the upper 13-24, both left to right; the odd
    number is the lower bore of its adapter.
  knobs: >-
    THE THUMB-KNOBS ARE DRAWN, and not at the cassettes' positions. FS's panel
    drawings dimension the two knob centres 3.91in (99.4) apart on every panel,
    so each sits 4.785 in from its edge; the 36F drawing (p6) draws the knob
    face 8.47 across, r 4.24. The cassettes carry knobs at 5.10 from the edge, r
    4.10, read off renders of a different part.
  depth: >-
    drawing - the top view beside each front view gives the reach in front of
    the plate, the reach behind it and the total, in inches with millimetres:
    24F LC 0.27 [6.9] / 1.09 [27.8] / 1.43 [36.4], MTP 0.49 [12.5] / 1.20 [30.4]
    / 1.76 [44.6], 36F LC 0.65 [16.4] / 0.57 [14.6] / 1.27 [32.2]; the SC panel
    is noted as the 24F LC's size. The front and rear reaches leave about 1.7
    for the plate on the LC and MTP views, and `d` is the plate plus the rear
    reach. The adapters' own relief does not reproduce the front reach - common
    adapters stand 1.0 to 1.2 proud, estimated - and is not overridden here.
  optical: >-
    EVERY PATH IS ONE MATING SLEEVE, NOT A STRAND. An adapter panel holds no
    glass: a fibre entering bore n of a front adapter leaves through the same
    bore of the same adapter at the back, so front `lcNN.k` reaches rear
    `bNN.k`, the adapter seen from behind. The rear face composes each adapter
    at the mirrored column - seen from behind, the first column is on the right
    - and its bores are stacked, so the lower bore is lower from either side and
    position k is the same sleeve on both faces. The adapter is NOT mirrored,
    although seen from behind its latch notch is on the other hand: each bore
    ships holding a dust cap, and a mirrored host cannot seat an occupant
    (render.py refuses it). The notch is drawn on the wrong side of the rear, a
    stated art error, rather than the caps dropped.
  face: >-
    NO RENDER OF THIS VARIANT IS STAGED. It is fs/fhd-fap12lcd-os2@1 - FS's own
    variant selector on that SKU's page lists it as the same panel in another
    fibre or polish, and the adapter-panels datasheet draws them once - so the
    geometry, legends and knobs are that panel's. Colour: #56c75e, the APC green
    sampled off the SC APC panel (41986.p4, 336,717 pixels) - FS moulds its APC
    adapters in one green; borrowed, not sampled on this SKU.
  logo-zone: >-
    reserved, not drawn - FS prints its mark top left on every panel face
    (drawings p5-p9, the renders); the library reproduces no vendor logo. Box
    read off the drawings, to about half a millimetre.
