<svg xmlns="http://www.w3.org/2000/svg" width="44.34mm" height="9.8mm" viewBox="0 0 44.34 9.8">
  <!-- one finger end-on from the front, one pitch wide: the root block across
       the pitch, the stem, and the T head in front -->
