<svg xmlns="http://www.w3.org/2000/svg" width="26.645mm" height="7.3mm" viewBox="0 0 26.645 7.3">
  <!-- the end block end-on, left-hand end: the block from the end of the duct,
       and its tip flared toward the first slot -->
  <rect id="root" x="0" y="0" width="26.645" height="7.3" fill="#202224"/>
  <rect id="stem" x="0" y="0" width="20.7" height="7.3" fill="#26282a"/>
  <rect id="tip" x="0" y="0" width="24.4" height="7.3" fill="#2a2c2e"/>
</svg>
