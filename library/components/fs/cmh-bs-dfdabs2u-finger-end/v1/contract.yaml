  root: {at: [0.0, 0.0], size: [26.645, 7.3], class: bezel}
  stem: {at: [0.0, 0.0], size: [20.7, 7.3], class: bezel}
  tip: {at: [0.0, 0.0], size: [24.4, 7.3], class: bezel}
