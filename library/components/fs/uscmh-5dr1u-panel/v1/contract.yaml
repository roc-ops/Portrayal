format: 1
kind: component
name: uscmh-5dr1u-panel
version: 1.0.0
class: mechanical
description: >-
  The flat steel panel of the FS USCMH-5DR1U cable manager seen from the front - the
  plate between the ear zones with four obround pass-through windows between its ring
  positions - drawn as the well its five rings stand in
provenance:
  size: >-
    estimated - 430 wide, the width between the folded edges that FS dimensions on its
    other flat 1U D-ring panels (CMH-5DR1U, CMH-5DR1U-N, CMH-6DR1U). FS's drawing of
    this part (in the 0U/1U Horizontal Cable Manager datasheet) gives only 482 overall
    and 44 high, and is too coarse, 1.07 px/mm, to place the folds; the renders show
    them starting between the ear holes and the first ring. 44 high, drawing.
  size-windows: >-
    drawing - the same drawing, at 1.0726 px/mm across from its 482 (517 px) and 1.068
    down from its 44 (47 px): four obround windows, 76 px wide and 32 px high, so 71.1
    x 30, centred on the panel's height, at 51 and 153 mm either side of the middle.
    The renders (gallery images 1 to 3 and 6, feature image 3) show them open through
    to the back. FS's near face-on render (gallery image 6), at 3.162 px/mm across its
    482.6, puts the four centres at 153.9, 51.9, 50.4 and 152.9 mm from the middle and
    reads each window 72.4 wide at mid-height; the drawing's 71.1 is kept, and the 1.3
    mm between them is the difference between a coarse drawing and a lit render.
  depth: >-
    drawing - 80.8. FS's drawing dimensions the ring 80 from the plate, and the product
    page puts the part, cover included, at 3.23 in (82 mm); with a 1.2 mm plate behind
    the face and the cover taking the last 0.8, the plate's face is 80.8 behind the
    front of the envelope.
  slots: >-
    drawing - each ring position carries two small square slots and a round hole, which
    the ring's clips fill. They lie under the fitted ring and are not cut here.
  color: >-
    estimated - "Color: Black" in the 0U/1U datasheet's table, on SPCC steel. Every
    image of the part is a render.
size: {w: 430, h: 44, d: 80.8}
size-confidence: {w: estimated, h: drawing, d: drawing}
relief: {wall: '#1b1d20'}
elements:
  plate: {at: [0.0, 0.0], size: [430, 44], class: bezel}
skins: [default]
