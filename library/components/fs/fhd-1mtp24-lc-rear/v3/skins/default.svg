<svg xmlns="http://www.w3.org/2000/svg" width="99.0mm" height="31.0mm" viewBox="0 0 99.0 31.0">
  <!-- FHD-1MTP12LCDOS2A rear face, 99.0 x 31.0, FS SKU 57023.

       EVERY DIMENSION IN THIS FILE IS AN ESTIMATE. 57023.E.jpg is the
       closest thing to a face-on rear render held and panel_measure still
       refuses it (4.66% off on its second axis - see the contract's
       size-notes); 57023.D.jpg is a three-quarter side view with no scale
       at all. 99.0 x 31.0 is fhd-1mtp6lcd-rear@3's own already-estimated
       envelope, reused rather than measured a third time.

       THE MTP APERTURE IS NOT DRAWN HERE: the composed adapter draws its
       own. It sits at the LEFT, centred 18 mm in, with its legend above it
       and the polarity label to its right - read across the width of the
       rear render, which the top-rear camera does not foreshorten. Heights
       are proportion on the estimated 31. See the contract's provenance. -->
  <rect id="bezel" x="0" y="0" width="99.0" height="31.0" rx="1.5"
        fill="#26292d" stroke="#15181a" stroke-width="0.3"/>
  <rect id="polarity-label" x="37.5" y="17.1" width="23.1" height="8.9" rx="0.6"
        fill="#222529" stroke="#4a4f55" stroke-width="0.2"/>
  <g id="silkscreen">
    <text id="legend" x="18.0" y="9.2" font-size="3.6" font-family="Helvetica, Arial, sans-serif"
          text-anchor="middle" fill="#e8ebee">1-24</text>
    <text id="polarity-text" x="49.05" y="22.9" font-size="3.4" font-family="Helvetica, Arial, sans-serif"
          text-anchor="middle" fill="#e8ebee">Type A</text>
  </g>
</svg>
