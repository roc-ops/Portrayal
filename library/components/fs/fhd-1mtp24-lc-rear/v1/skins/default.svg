<svg xmlns="http://www.w3.org/2000/svg" width="99.0mm" height="31.0mm" viewBox="0 0 99.0 31.0">
  <!-- FHD-1X24MTPLCOS2A rear face, 99.0 x 31.0, FS SKU 57023.

       EVERY DIMENSION IN THIS FILE IS AN ESTIMATE. 57023.E.jpg is the
       closest thing to a face-on rear render held and panel_measure still
       refuses it (4.66% off on its second axis - see the contract's
       size-notes); 57023.D.jpg is a three-quarter side view with no scale
       at all. 99.0 x 31.0 is fhd-1mtp6lcd-rear@1's own already-estimated
       envelope, reused rather than measured a third time.

       THE MTP APERTURE IS NOT DRAWN HERE, for the same reason the front
       face's twelve LC cutouts are not drawn on its plate: the composed
       common/mpo24-adapter@1 part draws its own bezel and its own aperture
       at its `at` position, so a second rect here would be a duplicate that
       can drift from the part that actually owns that geometry.

       The `1-24` legend, the `Type A` label, the `MALE` warranty seal and
       the two captive thumb-screws visible on the render are not drawn -
       see the contract's `provenance.face-detail-gap`. -->
  <rect id="bezel" x="0" y="0" width="99.0" height="31.0" rx="1.5"
        fill="#26292d" stroke="#15181a" stroke-width="0.3"/>
</svg>
