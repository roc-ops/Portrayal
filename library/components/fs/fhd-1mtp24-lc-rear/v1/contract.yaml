format: 1
kind: component
name: fhd-1mtp24-lc-rear
version: 1.0.0
class: cassette
description: >-
  The back of FS FHD-1X24MTPLCOS2A (SKU 57023): the cassette body seen from
  behind, carrying its single MTP-24 trunk adapter.
size: {w: 99.0, h: 31.0, d: 2.0}
size-confidence: {w: estimated, h: estimated, d: estimated}
size-notes: >-
  NOT MEASURED, AND NOT MEASURABLE FROM WHAT IS HELD - the same finding
  fhd-1mtp6lcd-rear@1 and fhd-2mtp12-lc-rear@1 both record for their own rear
  faces. 57023.E.jpg is the closest thing to a face-on rear render in the
  corpus and it still fails `panel_measure.validate()`: `plate()` locks onto
  the connector's own mounting flange rather than the enclosure's full
  mounting ears, and that band scales to 4.66% off the known 35.05 mm height
  (limit 3.0%). 57023.D.jpg is a three-quarter side view with no scale at
  all, and 57023.F.jpg is a front-corner crop that shows no rear geometry.
  Nor can the faceplate supply one, for the same reason both sibling rears
  give: the faceplate OVERHANGS the body, so the rear face is narrower than
  108.97 x 35.05 by an amount nobody has measured. 99.0 x 31.0 x 2.0 REUSES
  fhd-1mtp6lcd-rear@1's own figures rather than a third proportional read -
  that source is itself `estimated`, not measured, so carrying it across is
  recorded as `estimated` here too, not `borrowed` (which this library
  reserves for a figure whose origin actually measured something), the same
  distinction fhd-2mtp12-lc-rear@1 already draws for its own reuse of the
  same number. A face-on photograph of the back, square to the mounting
  flange rather than the connector band, settles it.
attrs: {media: fiber}
parts:
  - {id: mtp, ref: common/mpo24-adapter@1, at: [42.6, 10.8]}
provenance:
  size: >-
    see size-notes.
  parts: >-
    ONE MTP-24, CENTRED, and centred is a choice rather than a reading - the
    same admission fhd-1mtp6lcd-rear@1 makes for its own single, centred
    adapter. `at: [42.6, 10.8]` places a 13.8 x 9.4 common/mpo24-adapter@1 at
    the same position fhd-1mtp6lcd-rear@1 places its own common/mpo-adapter@1
    (the two components share the same borrowed 13.8 x 9.4 body - see
    common/mpo24-adapter@1's own provenance), so its centre is (49.5, 15.5)
    against this body's own centre of (49.5, 15.5) - exact on both axes.
    57023.E.jpg shows the MTP-24 opening sitting slightly above the vertical
    middle of the face, beside a `1-24` legend - the same apparent offset
    fhd-1mtp6lcd-rear@1 records for its own MTP-12 on 57016.D.jpg - but
    57023.E.jpg is the render `size-notes` already refuses at 4.66%, so the
    offset can be seen and not measured. Centring is what the drawing can
    defend; the apparent shift is recorded here as the thing a face-on
    photograph of the back should settle, rather than turned into a number
    nobody measured. Nothing here is a measurement.
  face-detail-gap: >-
    The legends visible on 57023.E.jpg are not drawn: a `1-24` port-range
    label to the left of the adapter, a `Type A` polarity label to the
    right, a `MALE` warranty seal above it, and two captive thumb-screws at
    the outer edges. They are recorded here because they identify the part
    in a photograph and somebody will want them later, the same treatment
    fhd-1mtp6lcd-rear@1 and fhd-2mtp12-lc-rear@1 both give their own rear
    legends.
skins: [default]
