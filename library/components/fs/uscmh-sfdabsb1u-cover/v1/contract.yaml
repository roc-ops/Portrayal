      color: '#333639'
      confidence: drawing
      source: the FS Horizontal Single Sided Manager datasheet for USCMH-SFDABSB1U and -B2U, the cover over the first 10.5 mm in front of the finger tips
    - node: lip-bottom
      lift: 116.56
      out: 127.06
      color: '#333639'
      confidence: drawing
      source: the FS Horizontal Single Sided Manager datasheet for USCMH-SFDABSB1U and -B2U, the cover over the first 10.5 mm in front of the finger tips
