<svg xmlns="http://www.w3.org/2000/svg" width="13mm" height="30mm" viewBox="0 0 13 30">
  <!-- one T finger end-on from the front: the widened root, the stem, and the
       crossbar at its front end, which runs along the duct and leaves a neck
       to the next finger -->
  <rect id="root" x="0" y="3" width="13" height="24" fill="#202224"/>
  <rect id="stem" x="0" y="8.65" width="13" height="12.7" fill="#26282a"/>
  <rect id="tip" x="0" y="0" width="13" height="30" rx="2" fill="#2a2c2e"/>
</svg>
