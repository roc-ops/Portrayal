format: 1
kind: component
name: fs-cfs-1u-tray
version: 1.0.0
class: mechanical
description: >-
  The floor of the FS FS-CFS-1U cantilever shelf seen from above,
               with its vent slots - drawn as the well the shelf's walls stand in
provenance:
  size: >-
    drawing - the top view of the FS-CFS-1U datasheet's technical drawing (p3), rendered at 300
    dpi: the tray 731 px across its 17.45 in [443.2 mm] dimension (1.649 px/mm) and 412 px down
    its 9.85 in [250.2 mm] (1.647), so the view is orthographic. 443.2 x 250.2.
  size-slots: >-
    drawing - the same view: fifteen slots in three rows of five, each about 50 x 7 and turned
    45 degrees, the columns centred 76.8, 149.2, 221.6, 294.0 and 366.4 across (72.4 apart, centred
    on the tray) and the rows 51.4, 123.2 and 196.0 from the rear. Their width is read off thin
    outlines and is estimated.
  depth: >-
    drawing - 42: the floor is the bottom of the shelf, so the
                                well is as deep as the 44 mm envelope less the sheet; the sheet
                                body builds a well no deeper than 2 mm short of the far face
                                (docs/cable-managers-design.md section 4), so the floor is built
                                2 mm thick where the real sheet is about 1.2.
size: {w: 443.2, h: 250.2, d: 42}
size-confidence: {w: drawing, h: datasheet, d: drawing}
relief: {wall: '#1b1d20'}
elements:
  floor: {at: [0.0, 0.0], size: [443.2, 250.2], class: bezel}
skins: [default]
