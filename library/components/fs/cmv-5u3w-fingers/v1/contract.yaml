format: 1
kind: component
name: cmv-5u3w-fingers
version: 1.0.0
class: mechanical
description: >-
  The spine and the six fingers of the FS CMV-5U3W finger bracket, seen from the front -
  a moulded comb along one edge of the flange, its fingers standing forward from the rail
  with a cap on each that leaves a narrow neck a cable is pressed through
provenance:
  size: >-
    drawing - the side view of the FS Vertical Cable Managers with Finger Ducts datasheet, page 6, at 11.86 px/mm across the 84 and down the 222 (0.1
    per cent apart, orthographic): six fingers, the end two 17.1 and 18.3 high and the
    four between 21.5 to 22.7, with gaps of 16.0 (0.63 in [16mm]) at the ends and 22.8
    (0.9 in [22.8mm]) between, finger centres 44.4 apart, one rack unit. The caps at the
    front run 0 to 22.7, 28.4 to 63.6, 69.2 to 107.8, 113.5 to 152.3, 157.8 to 193.0 and
    198.7 to 222 from the top, leaving 5.7 between them. Across the width the top view
    puts the fingers 11 thick (0.43 in [11mm]), 3.6 to 14.6 from the flange's edge, with
    the spine the 3.6 outside them; the caps are drawn the fingers' 11, estimated.
  relief: >-
    drawing - the side view: the spine stands 12.9 from the rear, the fingers run to 80.3
    and the caps to the 84 overall. The renders (64186.g2) show each finger is a channel
    open at its back; it is drawn as a solid bar.
