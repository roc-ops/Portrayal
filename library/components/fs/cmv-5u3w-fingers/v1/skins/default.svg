  <rect id="bar-1" x="3.6" y="0" width="11" height="17.1" fill="#26282a"/>
  <rect id="bar-2" x="3.6" y="33.1" width="11" height="21.6" fill="#26282a"/>
  <rect id="bar-3" x="3.6" y="77.3" width="11" height="21.7" fill="#26282a"/>
  <rect id="bar-4" x="3.6" y="121.8" width="11" height="21.5" fill="#26282a"/>
  <rect id="bar-5" x="3.6" y="166.1" width="11" height="21.6" fill="#26282a"/>
  <rect id="bar-6" x="3.6" y="203.7" width="11" height="18.3" fill="#26282a"/>
  <rect id="tip-1" x="3.6" y="0" width="11" height="22.7" rx="1.5" fill="#2a2c2e"/>
  <rect id="tip-2" x="3.6" y="28.4" width="11" height="35.2" rx="1.5" fill="#2a2c2e"/>
