<svg xmlns="http://www.w3.org/2000/svg" width="26mm" height="222mm" viewBox="0 0 26 222">
  <!-- the spine and the six fingers end-on from the front: each finger's
       bar, and the cap on its front end that leaves a narrow neck to the
       next; the rest of the flange is the base behind -->
