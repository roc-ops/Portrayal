  <rect id="tip-5" x="3.6" y="157.8" width="11" height="35.2" rx="1.5" fill="#2a2c2e"/>
  <rect id="tip-6" x="3.6" y="198.7" width="11" height="23.3" rx="1.5" fill="#2a2c2e"/>
</svg>
