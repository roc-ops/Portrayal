<svg xmlns="http://www.w3.org/2000/svg" width="10mm" height="44mm" viewBox="0 0 10 44">
  <!-- one frame from the front: the base against the panel, the two arms
       end-on, and their turned-in ends with the slit between them at
       mid-height -->
  <rect id="base" x="0" y="0.25" width="10" height="43.5" fill="#16181b"/>
  <rect id="arm-top" x="0" y="0.25" width="10" height="2.5" fill="#0d0f10"/>
  <rect id="arm-bottom" x="0" y="41.25" width="10" height="2.5" fill="#0d0f10"/>
  <rect id="end-top" x="0" y="0.25" width="10" height="19.75" rx="1" fill="#111315"/>
  <rect id="end-bottom" x="0" y="24" width="10" height="19.75" rx="1" fill="#111315"/>
</svg>
