provenance:
  size: >-
    drawing - see size-notes.
  parts: >-
    NO DRAWING OF ITS OWN: the datasheet (p7) draws the 12-port MTP panel only.
    The rows are that drawing's (y 9.51 and 25.52) and the columns come off FS's
    face-on render 52022.p3: openings at 24.20 44.39 64.62 85.43 in the render's
    width-scaled frame, a 20.41 pitch. That frame is not true - on 35510.p3, the
    12-port panel FS also drew, the same tool reads a 13.33 pitch where the
    drawing has 13.99, and a plate 4.4% short, so every render in this gallery
    runs 1.0495 small - and corrected by that one factor the pitch is 21.42.
    Placed on 21.42, centred on the plate as every drawn FHD panel row is:
    22.355 43.775 65.195 86.615. PHOTO-MEASURED ACROSS, calibrated on a sibling
    drawing; the render's own centring (the row 1.1 left of centre) is not
    taken, because the same render of 35488 puts its row 1.3 left where that
    panel's drawing is centred.
  face-legends: >-
    5 over 1 left of the first column and 8 over 4 right of the last, as
    52022.p3 prints them, at the 12-port drawing's 1.44 gap from the adapter and
    its heights.
  knobs: >-
    THE THUMB-KNOBS ARE DRAWN, and not at the cassettes' positions. FS's panel
    drawings dimension the two knob centres 3.91in (99.4) apart on every panel,
    so each sits 4.785 in from its edge; the 36F drawing (p6) draws the knob
    face 8.47 across, r 4.24. The cassettes carry knobs at 5.10 from the edge, r
    4.10, read off renders of a different part.
  depth: >-
    drawing - the top view beside each front view gives the reach in front of
    the plate, the reach behind it and the total, in inches with millimetres:
    24F LC 0.27 [6.9] / 1.09 [27.8] / 1.43 [36.4], MTP 0.49 [12.5] / 1.20 [30.4]
    / 1.76 [44.6], 36F LC 0.65 [16.4] / 0.57 [14.6] / 1.27 [32.2]; the SC panel
    is noted as the 24F LC's size. The front and rear reaches leave about 1.7
    for the plate on the LC and MTP views, and `d` is the plate plus the rear
    reach. The adapters' own relief does not reproduce the front reach - common
    adapters stand 1.0 to 1.2 proud, estimated - and is not overridden here.
  optical: >-
    TYPE B, KEY UP TO KEY UP, IS FIBRE n TO FIBRE 13 - n. An MTP adapter panel
    holds no glass; the adapter aligns two plugs and its key arrangement decides
    which fibres meet. With the keys aligned (FS's Key Up to Key Up, Type B)
    fibre 1 of one plug meets fibre 12 of the other. The tiles number their
    fibres as seen from their own side with a key-up plug mated from the viewer,
    so the rear face turns each tile to where the rear plug's key sits: the same
    physical side as the front's, which seen from behind is the opposite hand -
    270 where the front is 90. That puts rear fibre 12 on the sleeve behind
    front fibre 1, and the paths are that geometry written down. The library's
    polarity check knows no pattern for `b`, so the claim is stated and not yet
    judged (roc-ops/Portrayal#524).
  face: >-
    52022.p3 is the reference: eight grey-capped portrait openings in two rows
    of four.
  logo-zone: >-
    reserved, not drawn - FS prints its mark top left on every panel face
    (drawings p5-p9, the renders); the library reproduces no vendor logo. Box
    read off the drawings, to about half a millimetre.
  fibre-count: >-
    TWELVE POSITIONS, AND A PANEL THAT TAKES THREE. FS sells these adapters as
    MTP-8/12/24 - one opening any of the three ferrules mates - and each is
    composed at the MPO tile's default, 12 positions, the count the FHD cassette
    trunks use. An MPO-24 trunk seated here carries 24 fibres the ports do not
    count and an MPO-8 leaves four positions dark; a configuration overriding
    `optical.positions` per adapter would say which. Not modelled.
  key-direction: >-
    WHICH WAY EACH TILE IS TURNED IS A CONVENTION, NOT A READING. FS's drawing
    and renders show portrait openings and do not show a key clearly enough to
    say whether it faces left or right; the tiles are turned 90 (key to the
    right on the front). Only the RELATIVE turn between the two faces carries
    information - it is what the adapter type fixes - and that is what the
    paths depend on.
