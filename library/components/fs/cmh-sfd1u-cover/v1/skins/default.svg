<svg xmlns="http://www.w3.org/2000/svg" width="433mm" height="42mm" viewBox="0 0 433 42">
  <!-- the cover from the front: one plain ABS face, the folds of its top and
       bottom lips catching the light along each edge -->
  <rect id="plate" x="0" y="0" width="433" height="42" rx="0.8" fill="#333639"/>
  <rect id="lip-top" x="0" y="0" width="433" height="1.2" fill="#3d4043"/>
  <rect id="lip-bottom" x="0" y="40.8" width="433" height="1.2" fill="#25272a"/>
</svg>
