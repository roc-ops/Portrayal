<svg xmlns="http://www.w3.org/2000/svg" width="433mm" height="42mm" viewBox="0 0 433 42">
  <!-- the cover from the front: one plain ABS face, and the edges of the two
       lips that clip over the finger tips -->
  <rect id="plate" x="0" y="0" width="433" height="42" rx="0.8" fill="#333639"/>
  <!-- LOGO ZONE, RESERVED AND EMPTY: FS prints a round mark here, near the left end; estimated from an angled render; the library does
       not reproduce vendor logos (components README). -->
  <rect id="logo-zone" x="25.0" y="14.0" width="14.0" height="14.0" fill="none"/>
  <rect id="lip-top" x="0" y="0" width="433" height="1.5" fill="#3d4043"/>
  <rect id="lip-bottom" x="0" y="40.5" width="433" height="1.5" fill="#25272a"/>
</svg>
