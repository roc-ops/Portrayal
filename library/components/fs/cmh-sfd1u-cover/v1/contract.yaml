format: 1
kind: component
name: cmh-sfd1u-cover
version: 1.0.0
class: mechanical
behaviour: mounts
description: >-
  The detachable cover of the FS CMH-SFD1U finger duct, seen from the front - an ABS
  channel that clips over the tips of the fingers and closes the duct
provenance:
  size: >-
    drawing - the top view of CMH-SFD1U in the FS Horizontal Cable Managers with Finger
    Duct datasheet, at 2.19 px/mm off the 482.6 between the ear ends: the cover runs
    950 px, 433.4 mm, the width of the duct body it closes, and is taken as that body's
    433.0. Its 42 is the height of the duct across the finger walls on the side view of the
    same page. The cover is drawn as tall as the duct; no view dimensions its lips.
  color: >-
    estimated - "Color: Black" in the datasheet table. Every image FS publishes of the
    part is a render; the cover there reads a median of 45 on each channel against 37 on
    the base, so it is drawn a shade lighter than the duct.
  mark: >-
    drawing - FS renders a round mark on the cover near its left end. A vendor mark is
    never drawn, and nothing is reserved for it.
size: {w: 433.0, h: 42.0}
size-confidence: {w: drawing, h: drawing}
attrs: {material: ABS}
elements:
  plate: {at: [0.0, 0.0], size: [433.0, 42.0], class: bezel}
skins: [default]
