provenance:
  face-legends: >-
    THE PORT NUMBERS ARE fs/fhd-2mtp12-lc-os2-a@3's, BORROWED WHOLE. FS
    stages no photograph of this SKU's face, and the numbering is a
    property of the faceplate rather than of the polarity: the twin's
    plate carries the same adapters in the same places, and a cassette's
    printed port numbers do not change when the fibres behind them are
    paired differently. Measured on 57341.B.jpg - see that contract's own
    face-legends for the method - and drawn here at the same coordinates:
    `2`/`1` and `12`/`11` at the ends of the lower row and `14`/`13` and
    `24`/`23` at the ends of the upper one, and nothing between them.
  size: >-
    see size-notes - the plate and the parts are 57341's (the Type A twin),
    the depth is 68540's own product page.
  parts: >-
    the twin's, unchanged: FS's front renders of 68540 and 57341 are the
    same plate with the same adapters on the same centres and the same printed
    numbering. See the twin's provenance for how each was read.
  optical: >-
    FS names this part Type AF on its product page for 68540 and in the FHD
    Fiber Cabling System Guide's cassette tables. THE PATHS ARE FS's OWN
    DIAGRAM, NOT A CONVENTION: the FHD universal-polarity blog draws each
    cassette with its fibres numbered at the LC ports -
    a Type AF cassette swaps each duplex pair: port 1 takes MTP fibre 2 and port 2 takes fibre 1, port 3 takes 4 and port 4 takes 3, and so on. The blog's own TEXT says AF reverses fibre 1 to 12; its diagram labels every fibre and shows the pair swap, and the diagram is the more specific of the two, so the diagram is what is modelled.
    Ports are FS's printed numbers, the lower bore of each adapter the odd one.
    Where a cassette has two MTPs, each carries its own twelve ports exactly as
    the twin's do (1-12 on one, 13-24 on the other). L109 checks these paths
    against `polarity`.
  twin: >-
    built from fs/fhd-2mtp12-lc-os2-a@3 (57341, Type A) - the same cassette FS builds in
    Type AF polarity. Everything but the model, SKU, depth, rear face,
    polarity and paths is the twin's.

