format: 1
kind: component
name: cmh-sfds1u-cover
version: 1.1.0
class: mechanical
behaviour: mounts
description: >-
  The detachable steel cover of the FS CMH-SFDS1U finger duct, seen from the front - a flat
  SPCC plate that hangs on four hinge clips over the finger heads and opens upward or
  downward
provenance:
  size: >-
    drawing - the front view of CMH-SFDS1U in the FS Horizontal Cable Managers with Finger
    Duct datasheet (steel, portal id 6867): 440.00 x 51.00, with four clips 22.7 wide and
    22.6 high over its edges, two on the top at 75.6 and 342.2 from the left end and two on
    the bottom at 120.3 and 298.1.
  relief: >-
    estimated - the cover face sits at the front of the duct, 109.5 to 110.7 above the floor
    of the well: a 1.2 sheet, estimated, with the clips standing 0.6 proud of it and
    reaching back over the finger heads. No view dimensions the cover section.
  color: >-
    estimated - Color: Black. The cover reads a median of 39 on each channel in gallery
    image 1 of the FS product page; it is drawn a shade lighter than the backbone.
  logo-zone: >-
    reserved, not drawn - FS prints its round mark and FS wordmark on the cover near
    the left end, about a fifth of the way down; the library reproduces no vendor
    logo. Box measured on gallery image 1 of the FS product page, a straight-on
    front render, at 3.39 px/mm off the 266.6 between the left edges of the two
    top clips (903 px), which puts the plate's left edge where the render draws
    it; to about 0.7 mm.
