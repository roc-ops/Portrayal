format: 1
kind: module
name: fhd-1mtp6lcd-os2-af
version: 1.0.0
class: cassette
behaviour: fills
description: >-
  FS FHD-1MTP6LCDOS2AF - MTP-12 (male) to six LC duplex, 12 fibres, OS2, Type AF
  polarity: the Type A cassette's pair, used at the far end of a Method A link.
  FS SKU 57037.
size: {w: 108.97, h: 35.05, d: 117.86}
size-confidence: {w: photo-measured, h: photo-measured, d: datasheet}
size-notes: >-
  THE FACEPLATE IS 57016's, the Type A twin this is built on, and so are its
  parts: FS's renders of SKU 57037 show the same plate, the same adapters in the
  same places and the same port numbering, and differ only in what the rear
  label says and how the fibres are wired inside. See the twin's size-notes
  for how that plate was measured. The 117.86 depth is FS's own product page
  for 57037, which states 35 x 109 x 118 mm (1.38 x 4.29 x 4.64 in).
attrs: {media: fiber, model: FHD-1MTP6LCDOS2AF, vendor-sku: '57037'}
body:
  depth: 117.86
  # THE BODY IS THE REAR FACE'S SIZE, NOT THE FACEPLATE'S. The faceplate
  # overhangs the cassette on every side (FS's rear renders show its edge
  # standing out round the body), and the back of the body is the rear face,
  # 99 x 31, centred behind the 108.97 x 35.05 plate. Estimated with that face
  # - see its own size-notes. It is what a pulled cassette's box is drawn as,
  # and what its rear face is painted on.
  footprint: {at: [4.985, 2.025], size: [99.0, 31.0]}
parts:
  - {id: lc1, ref: common/lc-duplex-v-adapter@4, at: [15.81, 10.66]}
  - {id: lc2, ref: common/lc-duplex-v-adapter@4, at: [28.70, 10.66]}
  - {id: lc3, ref: common/lc-duplex-v-adapter@4, at: [41.59, 10.66]}
  - {id: lc4, ref: common/lc-duplex-v-adapter@4, at: [54.66, 10.66]}
  - {id: lc5, ref: common/lc-duplex-v-adapter@4, at: [67.55, 10.66]}
  - {id: lc6, ref: common/lc-duplex-v-adapter@4, at: [80.44, 10.66]}
faces:
  rear: {ref: fs/fhd-1mtp6lcd-af-rear@1}
optical:
  media: os2
  polarity: af
  polish: upc
  paths:
    - {from: lc1.1, to: 'rear:mtp.2'}
    - {from: lc1.2, to: 'rear:mtp.1'}
    - {from: lc2.1, to: 'rear:mtp.4'}
    - {from: lc2.2, to: 'rear:mtp.3'}
    - {from: lc3.1, to: 'rear:mtp.6'}
    - {from: lc3.2, to: 'rear:mtp.5'}
    - {from: lc4.1, to: 'rear:mtp.8'}
    - {from: lc4.2, to: 'rear:mtp.7'}
    - {from: lc5.1, to: 'rear:mtp.10'}
    - {from: lc5.2, to: 'rear:mtp.9'}
    - {from: lc6.1, to: 'rear:mtp.12'}
    - {from: lc6.2, to: 'rear:mtp.11'}
provenance:
  size: >-
    see size-notes - the plate and the parts are 57016's (the Type A twin),
    the depth is 57037's own product page.
  parts: >-
    the twin's, unchanged: FS's front renders of 57037 and 57016 are the
    same plate with the same adapters on the same centres and the same printed
    numbering. See the twin's provenance for how each was read.
  optical: >-
    FS names this part Type AF on its product page for 57037 and in the FHD
    Fiber Cabling System Guide's cassette tables. THE PATHS ARE FS's OWN
    DIAGRAM, NOT A CONVENTION: the FHD universal-polarity blog draws each
    cassette with its fibres numbered at the LC ports -
    a Type AF cassette swaps each duplex pair: port 1 takes MTP fibre 2 and port 2 takes fibre 1, port 3 takes 4 and port 4 takes 3, and so on. The blog's own TEXT says AF reverses fibre 1 to 12; its diagram labels every fibre and shows the pair swap, and the diagram is the more specific of the two, so the diagram is what is modelled.
    Ports are FS's printed numbers, the lower bore of each adapter the odd one.
    Where a cassette has two MTPs, each carries its own twelve ports exactly as
    the twin's do (1-12 on one, 13-24 on the other). L109 checks these paths
    against `polarity`.
  twin: >-
    built from fs/fhd-1mtp6lcd-os2-a@1 (57016, Type A) - the same cassette FS builds in
    Type AF polarity. Everything but the model, SKU, depth, rear face,
    polarity and paths is the twin's.

skins: [default]
