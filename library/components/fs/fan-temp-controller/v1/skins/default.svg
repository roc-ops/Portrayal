<svg xmlns="http://www.w3.org/2000/svg" width="78mm" height="34.7mm" viewBox="0 0 78 34.7">
  <!-- the fan tray's temperature controller, seen from the front: a dark bezel, a red
       two-digit display window with the LOAD and SET lamps at its left end, SET and POWER
       keys at the left, UP and DOWN at the right. Drawn off: the window dark, no digits. -->
  <rect id="bezel" x="0" y="0" width="78" height="34.7" rx="1.2" fill="#2b2e31" stroke="#141618" stroke-width="0.4"/>
  <rect x="2.2" y="2.2" width="73.6" height="30.3" rx="0.8" fill="#34383c"/>
  <rect id="display" x="18.3" y="8.1" width="41.0" height="18.1" fill="#1a0b0c" stroke="#0b0c0d" stroke-width="0.4"/>
  <circle id="lamp-load" cx="25.0" cy="11.9" r="1.0" fill="var(--led-color, #3a1a1b)"/>
  <circle id="lamp-set" cx="25.0" cy="22.0" r="1.0" fill="var(--led-color, #3a1a1b)"/>
  <g id="key-set"><rect x="7.0" y="9.7" width="9.2" height="4.2" rx="0.8" fill="#8d9298"/></g>
  <g id="key-power"><rect x="7.0" y="20.6" width="9.2" height="4.2" rx="0.8" fill="#8d9298"/></g>
  <g id="key-up"><rect x="61.8" y="9.7" width="9.2" height="4.2" rx="0.8" fill="#8d9298"/></g>
  <g id="key-down"><rect x="61.8" y="20.6" width="9.2" height="4.2" rx="0.8" fill="#8d9298"/></g>
  <g id="silkscreen" fill="#d9dcdf" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="11.6" y="12.9" font-size="2.4" fill="#2b2e31">SET</text>
    <path d="M10.6,21.7 A1.4,1.4 0 1 0 12.6,21.7 M11.6,21.2 V22.6" fill="none" stroke="#2b2e31" stroke-width="0.35"/>
    <path d="M65.2,12.6 L66.4,11.0 L67.6,12.6" fill="none" stroke="#2b2e31" stroke-width="0.4"/>
    <path d="M65.2,21.9 L66.4,23.5 L67.6,21.9" fill="none" stroke="#2b2e31" stroke-width="0.4"/>
    <text x="38.8" y="6.8" font-size="1.8">WORK</text>
    <text x="38.8" y="29.4" font-size="1.8">SET</text>
    <text x="72.8" y="5.6" font-size="2.0">°C</text>
  </g>
</svg>
