format: 1
kind: component
name: cmh-sfd2u-base
version: 1.0.0
class: mechanical
description: >-
  The base plate of the FS CMH-SFD2U finger duct seen from the front, between the ear
  folds, with its two pass-through holes - drawn as the well the two rows of fingers
  stand in, its floor the front face of the plate
provenance:
  size: >-
    drawing - the front view of CMH-SFD2U in the FS Horizontal Cable Managers with Finger
    Duct datasheet, 5.91 px/mm across the 482.6 and 5.90 down the 88.5, so orthographic:
    the duct 433 wide between the ear folds, as CMH-SFD1U, whose top view this part shares
    line for line, and 86.5 high, the 3.4 in [86.5mm] across the two finger walls on the
    side view of the same page. The well is 75.5 deep, as CMH-SFD1U's: the top view puts
    the plate 11.3 deep behind the ear plane in an 87 mm overall.
  size-holes: >-
    drawing - the same view, the two pass-through holes: 75 wide (2.95 in [75mm]), 37.5
    high (1.48 in [37.5mm]), 172 apart (6.77 in [172mm]) and 322 over both (12.68 in
    [322mm]), symmetric about the middle and centred on the height (the hole's centre
    reads 43.6 below the top of the duct against 43.25); each is a hole in the floor. The
    corner radius, 3, is estimated, as on CMH-SFD1U.
size: {w: 433, h: 86.5, d: 75.5}
size-confidence: {w: drawing, h: drawing, d: drawing}
relief: {wall: '#232527'}
elements:
  floor: {at: [0.0, 0.0], size: [433, 86.5], class: bezel}
skins: [default]
