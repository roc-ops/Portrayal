format: 1
kind: component
name: cmv-sfd42u9w-cover
version: 1.0.0
class: mechanical
behaviour: mounts
description: >-
  The cover of one 21U section of the FS CMV-SFD42U9W vertical finger duct, seen from the
  front - a plain plate the width of the duct with a lip down each edge and six latch
  clips on its back that grip the finger crossbars, hinged to swing open or lift off
provenance:
  size: >-
    drawing - the cover back view of the FS 42U Vertical Cable Managers with Finger Ducts datasheet, page 5 draws two covers the width of the back view,
    meeting at the section joint; each is drawn half the 1866.9, 933.45 (the render x1
    dimensions a section 36.75 in [933mm]), and 88.9 wide, the stated width.
  clips: >-
    drawing - the same view draws a square at each edge three times a cover, centred
    178, 466 and 756 below its top (the same in both covers within 1.5), 26.4 high and
    about 13 wide where they overlap the edges; render x1 shows them at the edges of the
    closed cover. They are latches on the back of the cover, drawn behind the plate.
  hinge: >-
    drawing - the view also draws a three-hole tab off one edge and a small block off the
    other, twice a cover, at the rows where the side view puts the brackets; these are
    taken as the quick-release brackets and are not drawn. Renders x1, g6, g7 and g8 show
    the cover swung open on clips over the crossbars.
  relief: >-
    drawing - the side view, as fractions of its printed 152.6: the cover occupies the
    last 9.2, from 143.4 to 152.6 from the rear, drawn as a 1.5 plate at the front and a
    1.5 lip down each edge reaching back to the crossbars; the clips sit inside the lips.
  logo-zone: >-
    not reserved - the renders of the cover (x1, g2, g6, g8) show a plain face with no
    mark on it.
  color: >-
    estimated - "Color: Black" in the specification table; drawn a shade lighter than
    the duct, as the renders show it.
