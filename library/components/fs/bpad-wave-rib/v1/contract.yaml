name: bpad-wave-rib
version: 1.0.0
class: mechanical
description: >-
  The wave rib moulded across the back of each unit of an FS FHU-BPAD ABS blanking panel, seen
  from behind - a rib about 1.6 thick swinging 6.5 mm either side of the unit's middle, crossing
  the straight rib beside it.
provenance:
  size: >-
    photo-measured - the straight-on rear render of FHU-BPAD-2U (SKU 284589, g3, 2.73 px/mm):
    the rib runs from about 18 mm in from each end, its low runs centred near 86, 247 and 390
    from the left (161 and 143 apart) and swinging about 6.5 either side of the unit's middle.
    Drawn as a cosine of 152 mm period, whose lows fall at 86, 238 and 390 - the middle one 9
    mm off the render's. An estimate of the shape, not a measurement of it.
  relief: >-
    deliberately FLAT: the rib stands proud of the back, by an amount no document states.
