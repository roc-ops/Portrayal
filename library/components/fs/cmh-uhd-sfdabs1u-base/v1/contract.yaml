    and that is the body. Its 44 is the plate on the side view and the specification
    table. The well is 172.4 deep: the 175 of the datasheet less the plate, whose
    2.6 is estimated - the plan draws it as two lines 10 px apart.
  size-holes: >-
    drawing - the rear view: three obround windows 137.6 x 17.7 on a 150.0 pitch, 13.0 from the top edge: three rounded slots in the rear view, 506.5 px wide at 3.682 px/mm. The plate is symmetric, so the front view of
    it is the rear view as drawn. Each window is a hole in the floor.
