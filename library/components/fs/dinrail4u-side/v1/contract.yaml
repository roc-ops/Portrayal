format: 1
kind: component
name: dinrail4u-side
version: 1.0.1
class: bracket
behaviour: mounts
description: >-
  One side bracket of the FS DINRAIL4U, seen from outside the bracket - front at the left on the
  `right` skin, at the right on the mirrored `left` skin: a steel plate 360 mm deep with two long
  slots the rail panel's screws slide in and a window between them, its top and bottom edges lowered between its ends where the
  panel's tabs lie; its front end folds out into the mounting ear.
provenance:
  size: >-
    drawing - the datasheet's DINRAIL4U side view, dimensioned 360 deep, read on the vector page
    rendered at 600 dpi (3.258 px/mm along the 360): two long slots near the top and bottom edges
    running from 65.7 to 289.8 mm behind the ears, and a window between them, read as fractions
    of the view. Its top and bottom
    edges step down 5.9: the plate stands its full height only
    for the first 28.5 behind the ears and from 330.3 to the rear (the same side view,
    p3, an embedded 435 x 279 px raster at 1.237 mm a pixel along the 360:
    the step 4.5 to 5 px down at each edge), so the rail panel's tabs lie on the lowered edges
    inside the bracket's height. Gallery render g4 shows the steps, and the tabs lying on them.
  relief: >-
    estimated - the plate, 1.5 thick.
size: {w: 360.0, h: 165.1}
size-confidence: {w: datasheet, h: datasheet}
elements:
  plate: {at: [0.0, 0.0], size: [360.0, 165.1], class: bezel}
relief:
  features:
  - {node: plate, out: 1.5, color: '#1b1d20', confidence: estimated, source: 'the plate, 1.5,
      estimated'}
skins: [right, left]
