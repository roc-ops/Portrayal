<svg xmlns="http://www.w3.org/2000/svg" width="86mm" height="12mm" viewBox="0 0 86 12">
  <!-- one end ring from the front: the strip against the ear behind, its two legs
       end-on, and the split far side with its curled end nearest -->
  <rect id="back" x="0" y="0" width="86" height="12" fill="#16181b"/>
  <rect id="leg-left" x="0" y="0" width="1.2" height="12" fill="#0c0d0f"/>
  <rect id="leg-right" x="84.8" y="0" width="1.2" height="12" fill="#0c0d0f"/>
  <rect id="front-left" x="0" y="0" width="36.8" height="12" fill="#101214"/>
  <rect id="front-right" x="50" y="0" width="36" height="12" fill="#101214"/>
  <rect id="curl-root" x="48.8" y="0" width="1.2" height="12" fill="#0c0d0f"/>
  <rect id="curl-tip" x="40" y="0" width="10" height="12" rx="0.6" fill="#0c0d0f"/>
</svg>
