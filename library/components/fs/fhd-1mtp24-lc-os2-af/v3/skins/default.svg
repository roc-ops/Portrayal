<svg xmlns="http://www.w3.org/2000/svg" width="108.97mm" height="35.05mm" viewBox="0 0 108.97 35.05">
  <!-- FHD-1MTP12LCDOS2A faceplate, 108.97 x 35.05, FS SKU 57023 - measured off
       FS's own face-on render 57023.B.jpg, see the contract's size-notes. The
       same front-panel mould as fhd-2mtp12-lc-os2-a@3 (SKU 57341); only the
       rear differs.

       THE TWELVE LC CUTOUTS ARE NOT DRAWN HERE, for the same reason
       fhd-2mtp12-lc-os2-a@3's twelve are not: each composed
       common/lc-duplex-v-adapter@4 draws its own bezel and its own two port
       openings at its `at` position, so a second rect here would duplicate
       geometry the composed parts already own and the two copies would
       drift the day one is edited and the other is not.

       THE TWO THUMB-KNOBS ARE MEASURED, on six face-on renders FS drew
       separately - three 12-fibre (57016.main, 174246.g1, 182642.g1) and three
       24-fibre (57341.B, 174248.g1, 182644.g1). Each is framed on the plate's
       own left and right edges at its centre row and scaled on that width,
       108.97 mm; panel_measure.measure() supplied only the height check,
       because its x0 was then taken on the plate's rounded corner (fixed
       since, in this major). A circle fitted to the
       lower arc of each knob's front face gives r 4.04-4.13 across all twelve
       knobs. That face stands proud and the camera sits above the plate, so
       the renders draw it displaced outward and down; the knob's AXIS is read
       from its base instead - the lit barrel's inboard side and its top, one
       radius in - at 4.99-5.29 mm from the plate edge, the same at both ends
       and on both cassette widths, and 17.53-17.75 mm down, on the plate's
       centre line. Drawn at 5.10 from each edge, r 4.10, centred vertically.
       The circles this replaces (cx 7.9 / 101.07, r 3.1) were placed by eye
       and sat 2.8 mm inboard. -->
  <defs>
    <linearGradient id="bez" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4248"/>
      <stop offset="1" stop-color="#23272c"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#4a5056"/>
      <stop offset="1" stop-color="#1c1f22"/>
    </radialGradient>
  </defs>
  <rect id="bezel" x="0" y="0" width="108.97" height="35.05" rx="1.5"
        fill="url(#bez)" stroke="#15181a" stroke-width="0.3"/>
  <circle id="thumb-knob-left" cx="5.1" cy="17.525" r="4.1"
          fill="url(#knob)" stroke="#0e1012" stroke-width="0.25"/>
  <circle id="thumb-knob-right" cx="103.87" cy="17.525" r="4.1"
          fill="url(#knob)" stroke="#0e1012" stroke-width="0.25"/>
  <!-- THE PORT NUMBERS, AND ONLY EIGHT OF THEM. FS prints a pair at each end of
       each row: the lower row is 1-12 and the upper is 13-24, so `2`/`1` and
       `12`/`11` below, `14`/`13` and `24`/`23` above (57341.B.jpg - which is
       byte-for-byte the render FS also serves for SKU 57023, so this is ONE
       reading covering both two-row cassettes, not two). Measured against the
       adapters rather than the plate box: right-aligned 1.50 left of the first
       adapter of a row, left-aligned 1.53 right of the last, cap height 2.61,
       drawn at a 3.5 font-size with the single-row plates. -->
  <g id="silkscreen">
    <text id="port-14" x="15.74" y="7.55" font-size="3.5" text-anchor="end"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">14</text>
    <text id="port-13" x="15.74" y="14.95" font-size="3.5" text-anchor="end"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">13</text>
    <text id="port-24" x="93.00" y="7.55" font-size="3.5" text-anchor="start"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">24</text>
    <text id="port-23" x="93.00" y="14.95" font-size="3.5" text-anchor="start"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">23</text>
    <text id="port-2" x="15.74" y="23.18" font-size="3.5" text-anchor="end"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">2</text>
    <text id="port-1" x="15.74" y="30.51" font-size="3.5" text-anchor="end"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">1</text>
    <text id="port-12" x="93.00" y="23.18" font-size="3.5" text-anchor="start"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">12</text>
    <text id="port-11" x="93.00" y="30.51" font-size="3.5" text-anchor="start"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">11</text>
  </g>
</svg>
