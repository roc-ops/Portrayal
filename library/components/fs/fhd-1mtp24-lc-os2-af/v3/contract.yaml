provenance:
  face-legends: >-
    THE PORT NUMBERS ARE fs/fhd-1mtp24-lc-os2-a@3's, BORROWED WHOLE. FS
    stages no photograph of this SKU's face, and the numbering is a
    property of the faceplate rather than of the polarity: the twin's
    plate carries the same adapters in the same places, and a cassette's
    printed port numbers do not change when the fibres behind them are
    paired differently. Measured on 57341.B.jpg - see that contract's own
    face-legends for the method - and drawn here at the same coordinates:
    `2`/`1` and `12`/`11` at the ends of the lower row and `14`/`13` and
    `24`/`23` at the ends of the upper one, and nothing between them.
  size: >-
    see size-notes - the plate and the parts are 57023's (the Type A twin),
    the depth is 68549's own product page.
  parts: >-
    the twin's, unchanged: FS's front renders of 68549 and 57023 are the
    same plate with the same adapters on the same centres and the same printed
    numbering. See the twin's provenance for how each was read.
  optical: >-
    FS names this part Type AF on its product page for 68549 and in the FHD
    Fiber Cabling System Guide's cassette tables. THE PATHS ARE THE FHD
    MTP-12/24 CASSETTES DATASHEET, p. 6, section VIII (MTP-24 Cassette, Type
    AF): its Inner Sequence table and its wiring diagram agree fibre for
    fibre, and the fibre colours in the diagram agree with both. A 24-fibre
    AF cassette swaps each duplex pair AND exchanges the two twelve-fibre
    rows of the MTP: port 1 takes fibre 14 and port 2 takes 13, port 11
    takes 24 and port 12 takes 23; port 13 takes fibre 2 and port 14 takes
    1, port 23 takes 12 and port 24 takes 11. The same datasheet (p. 4,
    section II) draws the MTP-12 AF as the pair swap alone, so the row
    exchange belongs to the 24-fibre part only.
    UNTIL 3.0.1 THESE PATHS WERE THE PAIR SWAP ALONE, read off the FHD
    universal-polarity blog, which draws the twelve-fibre cassette and not
    this one. Ports are the printed numbers, the lower bore of each adapter
    the odd one. L109 checks these paths against `polarity`.
  twin: >-
    built from fs/fhd-1mtp24-lc-os2-a@3 (57023, Type A) - the same cassette FS builds in
    Type AF polarity. Everything but the model, SKU, depth, rear face,
    polarity and paths is the twin's.

