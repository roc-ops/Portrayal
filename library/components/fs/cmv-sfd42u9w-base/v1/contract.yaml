name: cmv-sfd42u9w-base
version: 1.0.0
class: mechanical
description: >-
  The back of the FS CMV-SFD42U9W vertical finger duct seen from the front - the web of
  its folded steel channel, both 21U sections as one length with the joint between them
  a seam, drawn as the well the two finger walls stand in, its floor open at the six
  rectangular windows
provenance:
  size: >-
    drawing - the envelope of the duct: 88.9 wide (3.5 in, the table and the dimensioned
    render x1) and 1866.9 high (73.5 in, the table and the note on the FS 42U Vertical Cable Managers with Finger Ducts datasheet, page 5), each section
    933.45. The well is 151.1 deep, from the front of the cover to the front of the web,
    1.5 from the rear: the side view puts the web at the back of the 152.6, and no
    document states the gauge.
  size-holes: >-
    drawing - the back view at the scale of its printed figures: keyholes 311 apart, the
    first 83.7 below the top (1555 between the first and the last, 228.2 from the last to
    the bottom), and below each a window 146.4 high and 47.3 wide on the centre line, its
    top 53.4 below the keyhole; each window is a hole in the floor. The back view prints
    no width, so the widths are fractions of its drawn width taken as the 88.9.
  keyholes: >-
    drawing - each keyhole is R11 over R6.78, the radii the steel sibling CMV-SFDS45U5W
    prints for the same punching (this view prints its 13.56 diameter); a smaller window
    26.8 by 31.6 sits 218.6 below each of the first five keyholes (below the sixth it
    would run off the end). Both are painted, not cut.
size: {w: 88.9, h: 1866.9, d: 151.1}
