format: 1
kind: component
name: cmh-sfd1u-finger
version: 1.0.0
class: mechanical
behaviour: mounts
description: >-
  One finger of the FS CMH-SFD1U finger duct, seen from the front - an ABS finger that
  stands from the base toward the cover, with a tip that flares under the cover to leave
  a narrow neck a cable is pressed through into the channel
provenance:
  size: >-
    drawing - the top view of CMH-SFD1U in the FS Horizontal Cable Managers with Finger Duct datasheet, at 2.192 px/mm. The gaps stand 34.1 mm
    apart, centre to centre, over eleven pitches; the dimension line prints 1.32 in
    [33.6mm], twelve pixels short over the row, and the front view agrees with the
    drawing at 34.2. A gap is 16.0 (0.63 in [16mm]), so a finger is 18.1 wide; its tip
    flares to leave a 4 mm neck under the cover, so the tip is 30.1. Its 7.3 is the wall
    on the side view at 2.45 px/mm.
  relief: >-
    drawing - the same top view: a finger stands from the floor of the well to the
    underside of the cover, 72 mm from the back of the base, so 60.5 out; the flared tip
    is the last 6, from 66. Its root, the wall between the base and the rounded roots of
    the gaps, is solid for 10.7 above the floor (22.2 mm from the back of the base) and
    is drawn as part of the finger, half a gap either side.
size: {w: 34.1, h: 7.3}
size-confidence: {w: drawing, h: drawing}
attrs: {material: ABS}
elements:
  root: {at: [0.0, 0.0], size: [34.1, 7.3], class: bezel}
  stem: {at: [8.0, 0.0], size: [18.1, 7.3], class: bezel}
  tip: {at: [2.0, 0.0], size: [30.1, 7.3], class: bezel}
relief:
  features:
    - node: root
      out: 10.7
      color: '#2a2c2e'
      confidence: drawing
      source: the top view of CMH-SFD1U in the FS Horizontal Cable Managers with Finger Duct datasheet, the gap roots 22.2 mm from the back of the base
    - node: stem
      out: 54.5
      color: '#2a2c2e'
      confidence: drawing
      source: the top view of CMH-SFD1U in the FS Horizontal Cable Managers with Finger Duct datasheet, the finger from the base to where its tip flares, 66 mm from the back
    - node: tip
      lift: 54.5
      out: 60.5
      color: '#2a2c2e'
      confidence: drawing
      source: the same view, the flared tip from 66 to 72 mm, under the cover
skins: [default]
