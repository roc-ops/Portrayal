<svg xmlns="http://www.w3.org/2000/svg" width="34.1mm" height="7.3mm" viewBox="0 0 34.1 7.3">
  <!-- one finger end-on from the front, one pitch wide: the root of the wall
       across half a gap either side, the stem, and the flared tip in front -->
  <rect id="root" x="0" y="0" width="34.1" height="7.3" fill="#202224"/>
  <rect id="stem" x="8" y="0" width="18.1" height="7.3" fill="#26282a"/>
  <rect id="tip" x="2" y="0" width="30.1" height="7.3" fill="#2a2c2e"/>
</svg>
