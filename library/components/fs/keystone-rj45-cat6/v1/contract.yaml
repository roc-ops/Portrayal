format: 1
kind: component
name: keystone-rj45-cat6
version: 1.2.0
class: mechanical
behaviour: occupies
mates: keystone
interface: rj45
interface-at: port
conforms: keystone-opening
profile: networking
description: >-
  FS Cat6 unshielded RJ45 keystone jack (FS #72818, the jack the FHD-FAPM6
  datasheet lists). It is a snap-in jack with an RJ45 on the front, where any
  patch-panel port takes a cable, and a punch-down (IDC) termination behind it.
  It seats in the clip of an FHD-FAPM6 opening. Its body turns on its side in
  the landscape opening; the housing is drawn unturned (estimated, below). It
  offers one port, `rj45`.
size: {w: 16.5, h: 14.9, d: 35.2}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: >-
  THE OPENING IT FILLS, as common/keystone-clip@3 takes it: 16.5 x 14.9
  landscape; the envelope is the opening. THE JACK'S OWN FIGURES, read from the
  dimensioned drawing on page 3 of FS's Cat6 punchdown keystone jack datasheet
  ("Product Specification", a drawing, read as an image): the main housing is
  16.4 +/-0.2 across and 19.6 +/-0.2 high, 22.25 +/-0.2 high with the latch
  tab; the punch-down cap behind it is 14.5 +/-0.1 across and 16.1 +/-0.1 high
  and 9.9 +/-0.1 deep; the whole jack is 35.2 +/-0.2 long, which is `d`. The
  drawing also dimensions 8.2 +/-0.1 along the length; which two features it
  spans cannot be told from the drawing, so it is not used. The 14.5 x 16.1 is
  therefore the REAR CAP, and not a body the drawing shows passing the panel.
  The 16.4 x 19.6 housing, turned on its side, is larger than the 16.5 x 14.9
  opening in both directions, and the datasheet does not say how the jack seats
  in a keystone clip, so what stands in the opening is left as the envelope.
attrs: {opening: keystone, media: rj45, model: KEYSTONE-RJ45-CAT6}
unplaced: >-
  seated by a configuration of a panel, or by a person choosing an insert for
  an opening; no device in this library composes it in a fixed place
groups:
  jack:
    term: Jack
    role: traffic
    index-origin: 1
    attrs: {media: rj45}
    description: >-
      the one Cat6 unshielded RJ45 port on the front of the keystone jack
parts:
  - {id: rj45, group: jack, ref: std/rj45@2, at: [0.35, 0.85]}
provenance:
  size: >-
    datasheet - see size-notes. `w` and `h` are the opening's; `d`, 35.2, is
    the jack's overall length (Cat6 punchdown keystone jack datasheet, p3).
  parts: >-
    ONE RJ45 PORT, `rj45`: std/rj45@2, the library's RJ45 housing (15.8 x
    13.2, TE 1734264), centred in the opening as fs/fhd-fapm6-rj45@1 centres
    each of its six, 0.35 from the left edge and 0.85 from the top. THE
    HOUSING IS THE LIBRARY's, NOT FS's: no held document draws the jack's front
    face-on. ESTIMATED: which way the aperture faces; it is drawn unturned,
    pins up, because a 15.8 x 13.2 housing turned a quarter does not fit a
    14.9 opening. A generic/rj45-plug@1 cable end lands on it as on any RJ45
    port. ESTIMATED: no lamps are drawn, as no held document shows any on a
    keystone jack.
  match: >-
    ESTIMATED: that FS #72818 is the jack the Cat6 punchdown keystone jack
    datasheet describes. The two documents are tied by what they print, not by
    an item number, which the jack datasheet does not give: the FAPM6 datasheet
    (p5, "Keystone Jacks") lists exactly one Cat6 unshielded RJ45 keystone jack,
    #72818 (the Cat5e unshielded one is #72817), and prints no description; the
    jack datasheet (p1) describes a "Cat6 UTP RJ45 Punchdown Keystone Jack
    Module", its specification column (p2) is headed C6M-U, and it is
    compatible with "modular patch panels". The match rests on the category,
    the unshielded build and the keystone form. It is the one
    fs/fhd-fapm6-rj45@1 already makes.
  rear: >-
    The punch-down (IDC) termination behind the jack is NOT MODELLED here: this
    contract composes no rear port. fs/fhd-fapm6-rj45-rear@1 draws it for the
    fixed panel; for a seated jack it is left for a later change. The datasheet
    prints it: the jack terminates 4-pair twisted pair of 23 to 26 AWG (p1), the
    contacts "accommodate 23 to 26 AWG solid", the IDC conductor is 0.5 mm
    tin-plated phosphor bronze, and 200 IDC mating cycles at least (p2); its
    rear view (p3) shows the cap with the slots marked A and B. The rear view
    is not drawn here because a component has no rear face of its own.
  face: >-
    ESTIMATED. The body is drawn as the blanking insert is: a plain plate
    16.1 x 14.6, centred, with the composed RJ45 housing over it. The jack
    datasheet's front view (p3) does show the face, upright: a "Cat.6" label
    panel above the RJ45 aperture, the contacts along the top of the aperture,
    the latch slot below it and a round feature at each lower corner. It is
    not drawn, because which way the jack turns in the landscape opening is not
    stated.
  colour: >-
    ESTIMATED. Off-white, #ece9e2, as common/keystone-clip@3 draws FS's white
    plastic. The datasheet drawing is line art with no colour, and no held
    photograph shows the jack (the FAPM6 photograph shows the loose clips).
  mate: >-
    `mate.at` is the centre of the opening, (8.25, 7.45), where the clip's own
    `mate` point stands.
  groups: >-
    FS FHD-FAPM6 Multimedia Modular Panel Datasheet, in the earlier revision held beside the
    later one, page 5 (Keystone Jacks, Cat6 RJ45, unshielded, #72818; the later revision lists
    other Cat6 jack numbers and not this one) and page 2 (copper insert style, keystone jack,
    UTP). The jack has one RJ45 port on its front, as the contract
    composes it; the match of #72818 to the jack the contract draws is the contract's own
    estimate (see match). The datasheet prints the cable category and no data rate, and names
    no role for the jack; the role follows the job, a through connection a patch cord is
    plugged into, so it is traffic, and no speed is stated. The group's media is the port's
    own, rj45.
connection-points:
  mate: {at: [8.25, 7.45], direction: front}
  port: {at: [8.25, 7.45], direction: front}
skins: [default]
