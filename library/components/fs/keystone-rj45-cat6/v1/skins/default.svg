<svg xmlns="http://www.w3.org/2000/svg" width="16.5mm" height="14.9mm" viewBox="0 0 16.5 14.9">
  <!-- FS Cat6 keystone jack, 16.5 x 14.9 - the opening it fills. The plate is
       the jack's drawn body, 16.1 x 14.6, centred; the RJ45 housing composed
       over it draws the port. Off-white plastic: the face is estimated (see the
       contract). -->
  <rect id="margin" x="0" y="0" width="16.5" height="14.9" fill="#0c0d0f"/>
  <rect id="plate" x="0.2" y="0.15" width="16.1" height="14.6" rx="0.4"
        fill="#ece9e2" stroke="#9f9d98" stroke-width="0.15"/>
</svg>
