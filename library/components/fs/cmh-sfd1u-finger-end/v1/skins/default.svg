<svg xmlns="http://www.w3.org/2000/svg" width="28.95mm" height="7.3mm" viewBox="0 0 28.95 7.3">
  <!-- the end finger end-on from the front, left-hand end: the stem from the end
       of the duct, and its tip flared toward the first gap -->
  <rect id="root" x="0" y="0" width="28.95" height="7.3" fill="#202224"/>
  <rect id="stem" x="0" y="0" width="20.95" height="7.3" fill="#26282a"/>
  <rect id="tip" x="0" y="0" width="26.95" height="7.3" fill="#2a2c2e"/>
</svg>
