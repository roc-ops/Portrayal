format: 1
kind: module
name: fhd-2mtp12-lc-om4-u
version: 1.0.0
class: cassette
behaviour: fills
description: >-
  FS FHD-2MTP12LCDOM4U - two MTP-12 (male) to twelve LC duplex, 24 fibres, OM4,
  universal polarity. FS SKU 182644. The same cassette as
  fs/fhd-2mtp12-lc-os2-u@2 (SKU 182643) in OM4 fibre, with OM4-coloured
  adapters.
size: {w: 108.97, h: 35.05, d: 117.86}
size-confidence: {w: photo-measured, h: photo-measured, d: datasheet}
size-notes: >-
  THE FACEPLATE IS 182643's, the OS2 twin this is built on, and so are its
  parts. FS's face-on render of 182644 (182644.g1.jpg) was put through
  `spec/tools/intake/panel_measure.py` - scaled on the 108.97 mm module width
  and validated against the 35.05 mm height - and its adapter centres read
  within 0.2 mm of the same measurement taken on the twin's own render: the
  same two rows of six, on the same centres. See the twin's size-notes for how
  the plate was measured. The 117.86 depth is FS's own product page for 182644,
  which states 35 x 109 x 118 mm (1.38 x 4.29 x 4.64 in).
attrs: {media: fiber, model: FHD-2MTP12LCDOM4U, vendor-sku: '182644'}
body:
  depth: 117.86
  # THE BODY IS THE REAR FACE'S SIZE, NOT THE FACEPLATE'S. The faceplate
  # overhangs the cassette on every side (FS's rear renders show its edge
  # standing out round the body), and the back of the body is the rear face,
  # 99 x 31, centred behind the 108.97 x 35.05 plate. Estimated with that face
  # - see its own size-notes. It is what a pulled cassette's box is drawn as,
  # and what its rear face is painted on.
  footprint: {at: [4.985, 2.025], size: [99.0, 31.0]}
