format: 1
kind: component
name: dinrail4u-panel
version: 2.0.0
class: bracket
description: >-
  The rail panel of the FS DINRAIL4U bracket, seen from the front: a steel plate 419.7 mm wide
  that meets both side brackets, with lightening cut-outs above and below the 400 mm DIN rail it
  carries. Its ends fold back along the brackets' inner faces and are screwed through the
  brackets' slots, which is how it slides to set the rail back; drawn as the well the open front
  looks into, whose floor is the plate at its setback.
provenance:
  size: >-
    drawing - the datasheet's DINRAIL4U front view (p3, an embedded 519 x 347 px raster, 483.70
    across the ears over 393.5 px). The 400.00 it dimensions is the rail, not the panel: its
    extension lines fall on the rail's ends (about 326 px apart), while the panel's top edge runs on
    to the side brackets (about 338 px between their inner faces), as in
    gallery render g1 of SKU 376695. So the panel is the 419.7 between the brackets' inner faces
    (the device's 422.7 less two 1.5 sheets), and 165.1 high. Eight lightening cut-outs, four
    above the rail and four below, read off the same view as fractions of the rail's 400 and the
    height, and placed 9.85 further in, where the rail's ends stand from the panel's (the view's
    vertical scale differs from its horizontal by several per cent).
  depth: >-
    drawing - 159.9: the panel face's default setback behind the ears (the device's provenance.setback).
    In a sheet body a well builds its floor and nothing round it, so the plate stands at that
    depth with its cut-outs open, and the rail placed in the well stands on it.
size: {w: 419.7, h: 165.1, d: 159.9}
size-confidence: {w: drawing, h: datasheet, d: drawing}
relief: {wall: '#1b1d20'}
elements:
  panel: {at: [0.0, 0.0], size: [419.7, 165.1], class: bezel}
skins: [default]
