format: 1
kind: component
name: dinrail4u-panel
version: 1.0.0
class: bracket
description: >-
  The rail panel of the FS DINRAIL4U bracket, seen from the front: a steel plate 400 mm wide between
  the two side brackets, with lightening cut-outs above and below the DIN rail it carries. It
  slides along the side brackets to set the rail back; drawn as the well the open front looks
  into, whose floor is the plate at its setback.
provenance:
  size: >-
    drawing - the datasheet's DINRAIL4U front view: the panel dimensioned 400.00 between the side
    brackets and 165.1 high; eight lightening cut-outs, four above the rail and four below, read
    off the same view as fractions of the 400 and the height (the view's vertical scale differs
    from its horizontal by several per cent).
  depth: >-
    drawing - 159.9: the panel face's default setback behind the ears (the device's provenance.setback).
    In a sheet body a well builds its floor and nothing round it, so the plate stands at that
    depth with its cut-outs open, and the rail placed in the well stands on it.
size: {w: 400.0, h: 165.1, d: 159.9}
size-confidence: {w: drawing, h: datasheet, d: drawing}
relief: {wall: '#1b1d20'}
elements:
  panel: {at: [0.0, 0.0], size: [400.0, 165.1], class: bezel}
skins: [default]
