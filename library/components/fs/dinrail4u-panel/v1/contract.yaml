format: 1
kind: component
name: dinrail4u-panel
version: 1.0.0
class: bracket
behaviour: mounts
description: >-
  The rail panel of the FS DINRAIL4U bracket, seen from the front: a steel plate 400 mm wide between
  the two side brackets, with lightening cut-outs above and below the DIN rail it carries. It
  slides along the side brackets to set the rail back.
provenance:
  size: >-
    drawing - the datasheet's DINRAIL4U front view: the panel dimensioned 400.00 between the side
    brackets and 165.1 high; eight lightening cut-outs, four above the rail and four below, read
    off the same view as fractions of the 400 and the height (the view's vertical scale differs
    from its horizontal by several per cent).
  relief: >-
    deliberately FLAT: the panel face-on in the front elevation. Its solid is fs/dinrail4u-panel-plan@1,
    built from the top view at its setback.
size: {w: 400.0, h: 165.1}
size-confidence: {w: drawing, h: datasheet}
elements:
  panel: {at: [0.0, 0.0], size: [400.0, 165.1], class: bezel}
skins: [default]
