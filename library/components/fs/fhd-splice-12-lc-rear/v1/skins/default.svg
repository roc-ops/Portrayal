<svg xmlns="http://www.w3.org/2000/svg" width="99.0mm" height="31.0mm" viewBox="0 0 99.0 31.0">
  <!-- FS FHD LC UPC OS2 12-fibre splice cassette (SKU 382907), rear face,
       99.0 x 31.0 - AN ESTIMATE, NOT A DRAWING OF THIS SKU. No photograph of
       382907 exists anywhere in the corpus, front or back; this reuses
       fhd-1mtp6lcd-rear@2's own (itself estimated) body proportions on the
       reasoning that every FHD cassette shares one rear envelope. See the
       contract's size-notes for the full chain.

       THE SPLICE TRAY IS NOT DRAWN HERE. The composed common/fibre-splice@1
       part draws its own lid at its `at` position, the same reason the front
       face's six LC cutouts and fhd-1mtp6lcd-rear@2's MTP aperture are not
       duplicated on their own plates. -->
  <rect id="bezel" x="0" y="0" width="99.0" height="31.0" rx="1.5"
        fill="#26292d" stroke="#15181a" stroke-width="0.3"/>
</svg>
