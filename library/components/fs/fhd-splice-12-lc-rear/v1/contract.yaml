format: 1
kind: component
name: fhd-splice-12-lc-rear
version: 1.0.1
class: cassette
description: >-
  The back of FS FHD's LC UPC OS2 12-fibre splice cassette (SKU 382907): the
  cassette body seen from behind, carrying its fusion-splice tray in place of
  the MTP trunk adapter fhd-1mtp6lcd-rear@2 carries.
size: {w: 99.0, h: 31.0, d: 2.0}
size-confidence: {w: estimated, h: estimated, d: estimated}
size-notes: >-
  NOT MEASURED, AND NOTHING TO MEASURE IT FROM. No photograph of SKU 382907,
  front or back, is held anywhere in working/intake/fs/fhd/photos - not a
  three-quarter render, not even a product thumbnail - and no per-SKU
  datasheet for it was staged (working/intake/fs/fhd/COVERAGE.md records
  that). 99.0 x 31.0 x 2.0 reuses fhd-1mtp6lcd-rear@2's own figures whole, on
  the reasoning that every FHD cassette shares one body envelope regardless of
  what its rear carries - but that source contract is itself marked ESTIMATED
  throughout (proportion read off a three-quarter render panel_measure
  refused), not measured, so reusing it here is an estimate built on an
  estimate and is recorded as `estimated`, not `borrowed`, which this
  library's vocabulary reserves for reuse of a MEASURED figure. A face-on
  photograph of this SKU's back, or of any splice cassette's back, settles
  it.
attrs: {media: fiber}
parts:
  - {id: splice, ref: common/fibre-splice@1, at: [19.5, 5.5]}
provenance:
  size: >-
    see size-notes. No image of this part exists.
  parts: >-
    ONE SPLICE TRAY, CENTRED, for the same reason fhd-1mtp6lcd-rear@2 centres
    its one MTP adapter: centring is what a drawing with no photograph to
    read can defend, not a coincidence. A 60.0 x 20.0 common/fibre-splice@1
    centred in the 99.0 x 31.0 face sits at ((99.0-60.0)/2, (31.0-20.0)/2) =
    (19.5, 5.5), giving it the same centre as the face: (49.5, 15.5) both
    ways. Nothing here is a measurement.
  face-detail-gap: >-
    no legend, label or fastener is drawn - there is no render or photograph
    of this SKU's rear to read one off, unlike fhd-1mtp6lcd-rear@2's
    three-quarter view of 57016.
skins: [default]
