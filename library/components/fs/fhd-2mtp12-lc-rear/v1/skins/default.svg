<svg xmlns="http://www.w3.org/2000/svg" width="99.0mm" height="31.0mm" viewBox="0 0 99.0 31.0">
  <!-- FHD-2X12MTPLCOS2A rear face, 99.0 x 31.0, FS SKU 57341.

       EVERY DIMENSION IN THIS FILE IS AN ESTIMATE. 57341.E.jpg is the closest
       thing to a face-on rear render held and panel_measure still refuses it
       (63.5% off on its second axis - see the contract's size-notes); 57341.D
       is a three-quarter side view with no scale at all. 99.0 x 31.0 is
       fhd-1mtp6lcd-rear@1's own already-estimated envelope, reused rather
       than measured a second time.

       NEITHER MTP APERTURE IS DRAWN HERE, for the same reason the front
