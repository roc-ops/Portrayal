format: 1
kind: component
name: fhd-2mtp12-lc-rear
version: 1.0.1
class: cassette
description: >-
  The back of FS FHD-2X12MTPLCOS2A (SKU 57341): the cassette body seen from
  behind, carrying its two MTP-12 trunk adapters side by side.
size: {w: 99.0, h: 31.0, d: 2.0}
size-confidence: {w: estimated, h: estimated, d: estimated}
size-notes: >-
  NOT MEASURED, AND NOT MEASURABLE FROM WHAT IS HELD. 57341.E.jpg is the
  closest thing to a face-on rear render in the corpus - it shows both MTP
  adapters, their `13-24`/`1-12` legends and the `Type A` label square-on -
  but panel_measure still refuses it: `plate()` locks onto the labelled
  connector band, not the full mounting flange, and that band scales to
  12.78 mm against the known 35.05 mm height, 63.5% out. 57341.D.jpg is a
  three-quarter side view and offers no scale at all. Nor can the faceplate
  supply one, for the same reason fhd-1mtp6lcd-rear@2 gives: the faceplate
  OVERHANGS the body, so the rear face is narrower than 108.97 x 35.05 by an
  amount nobody has measured. 99.0 x 31.0 x 2.0 REUSES fhd-1mtp6lcd-rear@2's
  own figures rather than a second proportional read - that source is itself
  `estimated`, not measured, so carrying it across is recorded as `estimated`
  here too, not `borrowed` (which this library reserves for a figure whose
  origin actually measured something). A face-on photograph of the back,
  square to the mounting flange rather than the connector band, settles it.
attrs: {media: fiber}
parts:
  - {id: mtp1, ref: common/mpo-adapter@1, at: [22.8, 10.8]}
  - {id: mtp2, ref: common/mpo-adapter@1, at: [62.4, 10.8]}
provenance:
  size: >-
    see size-notes.
  parts: >-
    TWO MTP-12s, SIDE BY SIDE, SYMMETRIC ABOUT THE BODY CENTRE - and symmetric
    is a choice rather than a reading, the same admission fhd-1mtp6lcd-rear@2
    makes for its own single, centred adapter. 57341.E.jpg shows the pair
    genuinely side by side (not the vertically-stacked impression
    57341.D.jpg's three-quarter side angle gives of the same two connectors,
    foreshortened along the row) with a `Type A` label plate between them, so
    side-by-side is sourced; the exact millimetre gap is not. `at: [22.8,
    10.8]` and `at: [62.4, 10.8]` place two 13.8 x 9.4 mpo-adapters with
    centres at (29.7, 15.5) and (69.3, 15.5) - symmetric about the body centre
    (49.5, 15.5) on both axes, `at.y` matching fhd-1mtp6lcd-rear@2's own 10.8
    exactly since nothing in either render argues for a different vertical
    placement. Nothing here is a measurement of this body.
  ids: >-
    `mtp1` IS THE LEFT ADAPTER AND `mtp2` IS THE RIGHT ONE, reading
    57341.E.jpg left to right - `mtp1` sits under the `13-24` legend, `mtp2`
    under `1-12`. THE TWO IDS ARE DISTINCT ON PURPOSE: `rear_port_names`
    (spec/tools/portrayal/optical_ports.py) numbers within one part id, so
    two rear MTPs sharing an id would collapse to one exported port name and
    the fibre map would bind 24 fibres onto 12 positions. Giving them `mtp1`
    and `mtp2` is what keeps the two ports - and the 24 fibres crossing
    them - distinct in the export; see fs/fhd-2mtp12-lc-os2-a@1's own
    provenance.optical for which fibres cross which id.
  face-detail-gap: >-
    the `13-24`/`1-12` port-range legends, the `Type A` polarity label, the
    `MALE` warranty seal above the connectors, and the four captive
    thumb-screws (two per adapter) visible on 57341.E.jpg are not drawn.
    Recorded here because they identify the part in a photograph and somebody
    will want them later, same as fhd-1mtp6lcd-rear@2's own gap.
