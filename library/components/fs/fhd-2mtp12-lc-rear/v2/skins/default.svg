<svg xmlns="http://www.w3.org/2000/svg" width="99mm" height="31mm" viewBox="0 0 99 31">
  <!-- FHD-2X12MTPLCOS2A rear (SKU 57341), 99.0 x 31.0.

       TWO MTP-12 BULKHEADS, and the LEFT one is 13-24: that is how FS prints
       it, seen from behind (SKU 68540's rear render, and 182643's). Their
       centres are 18.3 and 79.6 across the body, read at the 9.63 px/mm that
       render's 108.97 faceplate gives; the legends sit above them and the
       polarity label between them, at the same heights the single-MTP backs
       use. Heights are proportion on the estimated 31 - see the contract. -->
  <rect id="bezel" x="0" y="0" width="99.0" height="31.0" rx="1.5"
        fill="#26292d" stroke="#15181a" stroke-width="0.3"/>
  <rect id="polarity-label" x="37.5" y="17.1" width="23.1" height="8.9" rx="0.6"
        fill="#222529" stroke="#4a4f55" stroke-width="0.2"/>
  <g id="silkscreen">
    <text id="legend-left" x="18.3" y="9.2" font-size="3.6" font-family="Helvetica, Arial, sans-serif"
          font-weight="bold" text-anchor="middle" fill="#e8ebee">13-24</text>
    <text id="legend-right" x="79.6" y="9.2" font-size="3.6" font-family="Helvetica, Arial, sans-serif"
          font-weight="bold" text-anchor="middle" fill="#e8ebee">1-12</text>
    <text id="polarity-text" x="49.05" y="22.9" font-size="3.4" font-family="Helvetica, Arial, sans-serif"
          font-weight="bold" text-anchor="middle" fill="#e8ebee">Type A</text>
  </g>
</svg>
