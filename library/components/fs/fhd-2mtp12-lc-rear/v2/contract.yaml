format: 1
kind: component
name: fhd-2mtp12-lc-rear
version: 2.0.0
class: cassette
description: >-
  The back of FS FHD-2X12MTPLCOS2A (SKU 57341): the cassette body seen from
  behind, carrying its two MTP-12 trunk bulkheads - 13-24 on the left, 1-12 on
  the right - and a Type A polarity label.

size: {w: 99.0, h: 31.0}
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  THE BODY IS fs/fhd-1mtp6lcd-rear@3's, borrowed whole: 99.0 x 31.0, the
  proportion read off FS's rear render of SKU 57016 against the known
  108.97 x 35.05 front. FS's rear renders of the 2 x MTP cassettes show the
  same body, so nothing here is a second measurement of it.

  NO DEPTH IS DECLARED, AND THAT IS THE READING. This contract is a FACE - the
  drawing of a back, not a part with a back of its own - and render.py turns a
  `size.d` on a fixed component into `data-depth`, an aperture as big as the
  whole face. The kit then builds THAT pit and drops the recesses inside it,
  because it takes only the innermost cavity of a nest: the estimated `d: 2.0`
  carried until now swallowed the recesses composed onto this face, so a
  bulkhead's mouth was not built at all and the whole back sat 2 mm below the
  cassette's edge in 3D. The depth of the body this face closes belongs to the
  cassette that carries it - `body.depth` there - and differs between them.
attrs: {media: fiber}
parts:
  - {id: mtp1, ref: common/mpo-flange-adapter@1, at: [3.3, 14.3]}
  - {id: mtp2, ref: common/mpo-flange-adapter@1, at: [64.6, 14.3]}
provenance:
  size: >-
    borrowed - see size-notes.
  parts: >-
    PHOTO-MEASURED ACROSS, ESTIMATED UP, and the LEFT bulkhead is the 13-24
    half. FS's rear render of SKU 68540 (and 182643's, which matches it) is
    shot from above the cassette, so its widths are readings and its heights
    are not: scaled on the 108.97 faceplate at 9.63 px/mm, the body is 98.4
    wide against this contract's 99, the two flanges' centres are 18.3 and
    79.6, and the legends above them read "13-24" on the left and "1-12" on
    the right. `at.x` places a 30.0 wide common/mpo-flange-adapter@1 on each
    centre. `at.y` 14.3 is the single-MTP back's own height, carried across
    with the rest of the vertical layout rather than read again.
    v1 PUT THEM AT 29.7 AND 69.3 - symmetric about the body centre, and it
    said so: "symmetric is a choice rather than a reading". The render says
    otherwise, and it also says which half is which.
  polarity-label: >-
    INFERRED, NOT PHOTOGRAPHED. No rear render of SKU 57341 is held. Its AF and
    universal siblings (68540, 182643) both carry a bordered label in this
    position - "Type AF" on the AF, nothing at all on the universal - and every
    photographed Type A back in this family reads "Type A", so that is what is
    drawn. A rear photograph of 57341 settles it.
  face-detail-gap: >-
    The `MALE`/`SEALED` warranty seal between the two legends is a sticker over
    the lid join rather than printing on this face, and is not drawn - the same
    treatment the single-MTP backs give it.
