<svg xmlns="http://www.w3.org/2000/svg" width="99mm" height="31mm" viewBox="0 0 99 31">
  <!-- FHD-3MTP18LCDOS2A rear (SKU 105333, and 105335), 99.0 x 31.0. Three MTP
       bulkheads composed by the contract; their port ranges printed below
       them; a Type A label at the upper left. Across is read off 105333.D.jpg,
       up is estimated - see the contract's provenance. -->
  <rect id="bezel" x="0" y="0" width="99.0" height="31.0" rx="1.5"
        fill="#26292d" stroke="#15181a" stroke-width="0.3"/>
  <rect id="polarity-label" x="7.1" y="1.4" width="22.5" height="8.2" rx="0.6"
        fill="#222529" stroke="#4a4f55" stroke-width="0.2"/>
  <g id="silkscreen">
    <text id="polarity-text" x="18.35" y="6.85" font-size="3.4" font-family="Helvetica, Arial, sans-serif"
          text-anchor="middle" fill="#e8ebee">Type A</text>
    <text id="legend-left" x="18.3" y="29.4" font-size="3.4" font-family="Helvetica, Arial, sans-serif"
          text-anchor="middle" fill="#e8ebee">25-36</text>
    <text id="legend-middle" x="49.3" y="29.4" font-size="3.4" font-family="Helvetica, Arial, sans-serif"
          text-anchor="middle" fill="#e8ebee">13-24</text>
    <text id="legend-right" x="80.3" y="29.4" font-size="3.4" font-family="Helvetica, Arial, sans-serif"
          text-anchor="middle" fill="#e8ebee">1-12</text>
  </g>
</svg>
