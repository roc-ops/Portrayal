<svg xmlns="http://www.w3.org/2000/svg" width="108.97mm" height="35.05mm" viewBox="0 0 108.97 35.05">
  <!-- FHD-FAPM6 multimedia modular panel
       FS FHD-FAPM6 multimedia modular panel, SKU 143239. The six openings
       are punched through the plate; the white clips FS ships are composed
       parts. See the contract's provenance. -->
  <defs>
    <linearGradient id="bez" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4248"/>
      <stop offset="1" stop-color="#23272c"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#4a5056"/>
      <stop offset="1" stop-color="#1c1f22"/>
    </radialGradient>
  </defs>
  <rect id="bezel" x="0" y="0" width="108.97" height="35.05" rx="1.5"
        fill="url(#bez)" stroke="#15181a" stroke-width="0.3"/>
  <rect id="opening-1" x="20.125" y="18.5" width="16.54" height="14.94" fill="#0c0d0f"/>
  <rect id="opening-2" x="20.125" y="1.6" width="16.54" height="14.94" fill="#0c0d0f"/>
  <rect id="opening-3" x="46.215" y="18.5" width="16.54" height="14.94" fill="#0c0d0f"/>
  <rect id="opening-4" x="46.215" y="1.6" width="16.54" height="14.94" fill="#0c0d0f"/>
  <rect id="opening-5" x="72.305" y="18.5" width="16.54" height="14.94" fill="#0c0d0f"/>
  <rect id="opening-6" x="72.305" y="1.6" width="16.54" height="14.94" fill="#0c0d0f"/>
  <circle id="thumb-knob-left" cx="4.785" cy="17.525" r="4.24"
          fill="url(#knob)" stroke="#0e1012" stroke-width="0.25"/>
  <circle id="thumb-knob-right" cx="104.185" cy="17.525" r="4.24"
          fill="url(#knob)" stroke="#0e1012" stroke-width="0.25"/>
  <!-- LOGO ZONE, RESERVED AND EMPTY: FS prints its mark here; the library does
       not reproduce vendor logos (components README). -->
  <rect id="logo-zone" x="1.6" y="3.2" width="5.3" height="5.0" fill="none"/>
  <g id="silkscreen">
    <text id="port-2" x="17.2" y="10.37" font-size="3.5" text-anchor="middle"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">2</text>
    <text id="port-1" x="17.2" y="27.27" font-size="3.5" text-anchor="middle"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">1</text>
    <text id="port-6" x="91.77" y="10.37" font-size="3.5" text-anchor="middle"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">6</text>
    <text id="port-5" x="91.77" y="27.27" font-size="3.5" text-anchor="middle"
          font-family="Helvetica, Arial, sans-serif" fill="#e8ebee">5</text>
  </g>
</svg>
