<svg xmlns="http://www.w3.org/2000/svg" width="34.61mm" height="7.3mm" viewBox="0 0 34.61 7.3">
  <!-- one finger end-on, one pitch wide: the root across the pitch, the stem,
       and the flared tip in front -->
  <rect id="root" x="0" y="0" width="34.61" height="7.3" fill="#202224"/>
  <rect id="stem" x="9.155" y="0" width="16.3" height="7.3" fill="#26282a"/>
  <rect id="tip" x="2.255" y="0" width="30.1" height="7.3" fill="#2a2c2e"/>
</svg>
