    <rect x="3.5" y="3.7" width="17.4" height="14.1" fill="#08090a"/>
    <path d="M22.4,8.0 L26.0,10.55 L22.4,13.1 Z" fill="none" stroke="#5c6166" stroke-width="0.35"/>
  </g>
  <g id="slider">
