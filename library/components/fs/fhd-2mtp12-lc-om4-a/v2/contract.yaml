provenance:
  major: >-
    Composes the duplex adapter at v5, whose bores are numbered 1 and 2
    instead of tx and rx, so every path under this part changes
    (`lc01/tx` -> `lc01/1`); nothing drawn moved.
  face-legends: >-
    THE PORT NUMBERS ARE fs/fhd-2mtp12-lc-os2-a@4's, AND 57342.B.jpg SHOWS
    THEM: the same end-of-row numbers in the same places, and nothing between
    them. They are drawn at the twin's coordinates - see its face-legends for
    how they were measured.
  size: >-
    see size-notes - the plate and the parts are 57341's, re-read on 57342's
    own render; the depth is this SKU's own dimension line (57342.C.jpg).
  parts: >-
    the twin's positions, unchanged, and corroborated rather than assumed:
    `panel_measure.openings` on 57342.B.jpg puts every adapter within 0.2 mm of
    where the same call puts it on the twin's render. What differs is the
    housing colour, passed to each adapter as `housing-finish`.
  colour: >-
    COUNTED, NOT TAKEN FROM THE OM4 CONVENTION. #54ccde is the median of the
    adapter-body pixels on 57342.B.jpg (byte-identical to 57024.B.jpg - one
    render, one reading), selected by the one rule
    common/lc-duplex-v-adapter@5's provenance.colour records - tuned until it
    reproduces that part's measured OS2 blue off 57016.main.jpg, then applied
    unchanged here. That entry lists every medium's count side by side.
  optical: >-
    the twin's paths, unchanged: fibre type and adapter colour do not change
    which LC port a fibre reaches. `media: om4` is FS's own naming of 57342 (FHD-2MTP12LCDOM4A) in FS's modular-cabling-system portfolio PDF. See the twin's provenance.optical
    for how the paths were derived.
  twin: >-
    built from fs/fhd-2mtp12-lc-os2-a@4 (SKU 57341) - the same cassette FS
    builds in OM4. Everything but the model, SKU, fibre, adapter colour and
    depth source is the twin's.

skins: [default]
