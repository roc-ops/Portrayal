name: cmv-dfds45u5w-cover-upper
version: 1.0.0
class: mechanical
behaviour: mounts
description: >-
  The upper detachable steel cover of the FS CMV-DFDS45U5W vertical finger duct, seen from
  outside - a flat SPCC plate on six hinge clips over the finger heads of one section,
  wider than the finger rows; the front and rear channel each take one
provenance:
  size: >-
    drawing - the cover view of the FS Vertical Cable Managers with Finger Ducts datasheet for the steel managers (portal id 6868), page 4: 169 wide (dimensioned)
    and 976.95 high, the upper section of the two
    (the upper 976.95 and the lower 1021.4). The 2.4 left over from the 2000.25 is put at the joint between them.
  clips: >-
    drawing - the same view draws three clip squares a section on each long edge, about
    23 long and 19 across at 0.4247 px/mm, centred 177.8, 488.6, 799.4 below the
    top of this cover; the side view draws them over the finger heads, standing to the
    front of the duct.
  relief: >-
    estimated - the cover face sits at the front of the duct, 150.83 to
    152.03 above the floor of the well, a 1.2 sheet, with its clips to
    152.63; no view draws the cover section.
  color: >-
    estimated - Color: Black in the specification table; every render shows the covers
    black, drawn in the shades of the FS horizontal steel covers.
  logo-zone: >-
    reserved, not drawn, estimated - FS prints its mark near the top of the upper cover: the
    quick start guide draws it on both ducts (steps 1 and 4) and the renders of #220091
    (gallery images 2 and 5) show it on each cover, about 60 wide and 25 to 30 high, 85 to
    100 below the top of the cover and a little right of its middle. The render of #220089
    (gallery image 1) shows that cover plain; the box is reserved for the guide.
