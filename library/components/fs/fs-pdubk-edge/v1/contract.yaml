    height of the plate, from the FS-PDUBK product page's dimensioned drawing.
size: {w: 2, h: 88.4}
size-confidence: {w: estimated, h: drawing}
elements:
  edge: {at: [0.0, 0.0], size: [2, 88.4], class: bezel}
skins: [default]
