class: mechanical
description: >-
  The cut edge of a sheet of the FS FS-PDUBK PDU bracket seen end-on, 2 across and 88.4 high.
  It is the flange seen from the side, or the plate seen from the front or the rear.
  An elevation only.
provenance:
