provenance:
  size: >-
    drawing - see size-notes.
  parts: >-
    DRAWN POSITIONS, CARRIED BY THE LIBRARY's ADAPTER. FS's vector drawing
    (panels datasheet p6, 36F LC Adapter Panel, 1200 dpi, 23.39 px/mm on the 109
    plate, plate height 35.06 against 35) puts eighteen horizontal duplex
    adapters in three rows of three abutting PAIRS: bore centres 17.19/23.43,
    30.04/36.28 | 44.96/51.21, 57.79/64.06 | 72.74/78.98, 85.59/91.83 (the 6.24
    LC pitch inside each adapter), so pair centres 26.735, 54.51, 82.285, and
    bore rows at y 7.03, 18.54, 30.05 - an 11.51 row pitch, the block flush with
    the plate's top edge. common/lc-duplex-shuttered-adapter@2 is 13.1 x 11.6
    (photo-measured on the 36-fibre cassette 105333); the drawing's bodies read
    about 12.8 x 11.4. Each pair is centred where FS draws it and the two
    adapters abut at the part's own 13.1, so each adapter sits 0.125 outboard of
    its drawn centre; the rows abut at the part's 11.6 from the plate's top
    edge, so the lowest row lands 0.18 below the drawn one. Both differences are
    the adapter's size disagreeing with FS's drawing of it, recorded here and
    not split: the two 36-fibre cassettes compose the same @2, and a re-measured
    adapter moves all three together.
  face-legends: >-
    read off the same drawing: 25 / 13 / 1 left of the first column and 36 / 24
    / 12 right of the last, one number per row end - the lower row is 1-12, the
    middle 13-24, the upper 25-36, each left to right, the odd port the LEFT
    bore of its adapter.
  knobs: >-
    THE THUMB-KNOBS ARE DRAWN, and not at the cassettes' positions. FS's panel
    drawings dimension the two knob centres 3.91in (99.4) apart on every panel,
    so each sits 4.785 in from its edge; the 36F drawing (p6) draws the knob
    face 8.47 across, r 4.24. The cassettes carry knobs at 5.10 from the edge, r
    4.10, read off renders of a different part.
  depth: >-
    drawing - the top view beside each front view gives the reach in front of
    the plate, the reach behind it and the total, in inches with millimetres:
    24F LC 0.27 [6.9] / 1.09 [27.8] / 1.43 [36.4], MTP 0.49 [12.5] / 1.20 [30.4]
    / 1.76 [44.6], 36F LC 0.65 [16.4] / 0.57 [14.6] / 1.27 [32.2]; the SC panel
    is noted as the 24F LC's size. The front and rear reaches leave about 1.7
    for the plate on the LC and MTP views, and `d` is the plate plus the rear
    reach. The adapters' own relief does not reproduce the front reach - common
    adapters stand 1.0 to 1.2 proud, estimated - and is not overridden here.
  optical: >-
    EVERY PATH IS ONE MATING SLEEVE, NOT A STRAND. An adapter panel holds no
    glass: a fibre in a front bore leaves through the same sleeve at the back.
    These adapters put their bores side by side, so seen from behind the LEFT
    front bore is on the RIGHT: the rear face composes each adapter unmirrored
    at the mirrored column, where its position 1 (left as seen from behind) is
    the front's position 2 - and the paths say so, `lcNN.1` to `bNN.2`.
  face: >-
    the face-on render 133613.p3 agrees: three rows of blue shuttered adapters
    in pairs, no dust caps (the shutters are the dust protection).
  logo-zone: >-
    reserved, not drawn - FS prints its mark top left on every panel face
    (drawings p5-p9, the renders); the library reproduces no vendor logo. Box
    read off the drawings, to about half a millimetre.
