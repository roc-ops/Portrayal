format: 1
kind: component
name: cmh-dfds2u-cover
version: 1.1.0
class: mechanical
behaviour: mounts
description: >-
  A detachable steel cover of the FS CMH-DFDS2U finger duct, seen from outside - a flat SPCC
  plate that hangs on four hinge clips over the finger heads of one channel; the front and
  the rear channel each take one
provenance:
  size: >-
    drawing - the front view of CMH-DFDS2U in the FS Horizontal Cable Managers with Finger
    Duct datasheet (steel, portal id 6867): 440 x 84.1, with four clips 22.1 wide and 23
    high over its edges, at 75.4 and 342.5 from the left end, top and bottom.
  relief: >-
    estimated - the cover face sits at the outside of its channel, 113.6 to 114.8 above the
    floor of the well: a 1.2 sheet, estimated, with the clips 0.6 proud of it, reaching back
    over the finger heads.
  color: >-
    estimated - Color: Black in the specification table.
  logo-zone: >-
    reserved, not drawn - FS prints its round mark and FS wordmark on the cover near
    the left end; the library reproduces no vendor logo. Box measured on gallery
    image 4 of the FS product page, a straight-on front render, at 3.41 px/mm
    across off the 267.1 between the left edges of the two top clips (910 px) and
    3.28 px/mm down off the 84.1 of the plate, the render looking down a little; to
    about 0.7 mm across and 1 mm down. The mark is the same size as on the
    CMH-SFDS1U cover but sits 6.5 further right, so the two do not share a box.
    Both covers of the duct are this part; FS renders only the front one.
