version: 2.0.0
class: cassette
behaviour: fills
description: >-
  FS FHD-1MTP6LCDOS2A - MTP-12 (male) to six LC duplex, 12 fibres, OS2, Type A
  polarity. FS SKU 57016.
size: {w: 108.97, h: 35.05, d: 117.86}
size-confidence: {w: photo-measured, h: photo-measured, d: drawing}
size-notes: >-
  The faceplate is MEASURED off FS's face-on render of SKU 57016, scaled on the
  108.97 mm FHD module width and validated against the 35.05 mm height to 1.02%
  - and corroborated independently by FS's own dimension line on 57016.B.jpg,
  which reads 4.29in x 1.38in, exactly 108.97 x 35.05. The 117.86 depth is the
  4.64in on that same dimension line.
  THIS DEPTH WAS 110.24 UNTIL 2.0.0, A MISREADING OF THAT LINE AS 4.34in. Read
  at five times, 57016.B.jpg's depth figure is 4.64in, and nothing in the image
  supports a 3 in that place. The wrong figure made this cassette 7.62 mm
  shallower than fs/fhd-1mtp6lcd-os2-af@1 and fs/fhd-1mtp6lcd-os2-u@1, which
  are the same body with the fibres crossed differently behind it, and whose
  117.86 comes from a different source: FS's product pages for 57037 and
  182641, each stating 35 x 109 x 118 mm (1.38 x 4.29 x 4.64 in). Two readings
  that never refer to each other now agree. The misreading also travelled: it
  was borrowed whole by fs/fhd-splice-12-lc, and fs/fhd-1mtp12-sc-os2-a
  explained its own correct 4.64in as an SC cassette being genuinely deeper.
