  - {id: lc1, ref: common/lc-duplex-v-adapter@2, at: [15.81, 10.66]}
  - {id: lc2, ref: common/lc-duplex-v-adapter@2, at: [28.70, 10.66]}
  - {id: lc3, ref: common/lc-duplex-v-adapter@2, at: [41.59, 10.66]}
  - {id: lc4, ref: common/lc-duplex-v-adapter@2, at: [54.66, 10.66]}
  - {id: lc5, ref: common/lc-duplex-v-adapter@2, at: [67.55, 10.66]}
  - {id: lc6, ref: common/lc-duplex-v-adapter@2, at: [80.44, 10.66]}
