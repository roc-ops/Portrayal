format: 1
kind: module
name: fhd-1mtp6lcd-os2-a
version: 1.2.0
class: cassette
behaviour: fills
description: >-
  FS FHD-1MTP6LCDOS2A - MTP-12 (male) to six LC duplex, 12 fibres, OS2, Type A
  polarity. FS SKU 57016.
size: {w: 108.97, h: 35.05, d: 110.24}
size-confidence: {w: photo-measured, h: photo-measured, d: drawing}
size-notes: >-
  The faceplate is MEASURED off FS's face-on render of SKU 57016, scaled on the
  108.97 mm FHD module width and validated against the 35.05 mm height to 1.02%
  - and corroborated independently by FS's own dimension line on 57016.B.jpg,
  which reads 4.29in x 1.38in, exactly 108.97 x 35.05. The 110.24 depth is the
  4.34in on that same dimension line.
attrs: {media: fiber, model: FHD-1MTP6LCDOS2A, vendor-sku: '57016'}
body:
  depth: 110.24
  # THE BODY IS THE REAR FACE'S SIZE, NOT THE FACEPLATE'S. The faceplate
  # overhangs the cassette on every side (FS's rear renders show its edge
  # standing out round the body), and the back of the body is the rear face,
  # 99 x 31, centred behind the 108.97 x 35.05 plate. Estimated with that face
  # - see its own size-notes. It is what a pulled cassette's box is drawn as,
  # and what its rear face is painted on.
  footprint: {at: [4.985, 2.025], size: [99.0, 31.0]}
