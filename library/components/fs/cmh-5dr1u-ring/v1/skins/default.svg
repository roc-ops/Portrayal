<svg xmlns="http://www.w3.org/2000/svg" width="32.8mm" height="44mm" viewBox="0 0 32.8 44">
  <!-- one ring from the front: the round seat it twists into, and the loop
       end-on standing out of it. The loop is open: its bottom member stops
       short of the front leg's curled foot, and the gap between them is the
       slit a cable is laid in through. -->
  <circle id="seat" cx="16.4" cy="22" r="16.4" fill="#151719"/>
  <rect id="base" x="11.45" y="0.2" width="9.9" height="43.6" rx="1.5" fill="#111315"/>
  <rect id="top" x="11.45" y="0.2" width="9.9" height="8.3" rx="1.5" fill="#0d0f10"/>
  <rect id="bottom" x="11.45" y="35.3" width="9.9" height="8.5" rx="1.5" fill="#0d0f10"/>
  <rect id="front" x="11.45" y="0.2" width="9.9" height="43.6" rx="1.5" fill="#0d0f10"/>
  <rect id="foot" x="11.45" y="35.3" width="9.9" height="8.5" rx="1.5" fill="#101214"/>
</svg>
