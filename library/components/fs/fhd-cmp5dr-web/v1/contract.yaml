  plate: {at: [0.0, 0.0], size: [1.5, 66], class: bezel}
relief:
  features:
    - node: plate
      out: 41.0
      profile-y: [[0, 41], [8, 41], [11, 39], [31, 10.5], [50, 10.5], [64, 0], [66, 0]]
      color: '#1b1d20'
