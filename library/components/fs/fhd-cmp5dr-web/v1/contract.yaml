format: 1
kind: component
name: fhd-cmp5dr-web
version: 1.0.0
class: mechanical
behaviour: mounts
description: >-
  The web that carries the FS FHD-CMP5DR's tray off each ear, seen from above - the
  sheet swept up from the tray's arm into the upright ear, standing on the arm's
  outer edge
provenance:
  size: >-
    drawing - the ring-profile view of the three-view drawing in FS's 0U/1U Horizontal
    Cable Manager Datasheet (updated 2025-05-11), at 1.331 px/mm: the web runs 66 mm
    forward from the ear, to where the first ring stands. Its 1.5 is the sheet.
  relief: >-
    drawing - the same view, the web's top edge read every 2.3 mm: the ear's full height
    for 9 mm, a straight slope down to 13.5 mm at 31, level to 50, and down to the tray
    at 66. BUILT IN EIGHT STEPS, because a proud feature has one height: the slope is a
    staircase in 3D and a line in the side elevation. The first step is 42 and not 44,
    the height of the well it stands in.
size: {w: 1.5, h: 66}
size-confidence: {w: datasheet, h: drawing}
elements:
  step-1: {at: [0.0, 0.0], size: [1.5, 11.0], class: bezel}
  step-2: {at: [0.0, 11.0], size: [1.5, 5.0], class: bezel}
  step-3: {at: [0.0, 16.0], size: [1.5, 5.0], class: bezel}
