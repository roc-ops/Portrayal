format: 1
kind: component
name: cmh-dfds1u-finger
version: 1.0.0
class: mechanical
behaviour: mounts
description: >-
  One finger of the FS CMH-DFDS1U finger duct, seen end-on from the cover side, one pitch
  wide - the moulded block it stands on, its stem, and the T-shaped head that carries the
  hinge of the cover
provenance:
  size: >-
    drawing - the plan of CMH-DFDS1U in the FS High Capacity Horizontal Cable Managers
    datasheet (portal id 7671): stems 44.4 apart, taken as 44.0 so that ten fill the 440
    body; stem 10.2 and head 39.4 are the CMH-SFDS1U figures for the same moulding. The 9.0
    thickness is the CMH-SFDS1U finger wall.
  relief: >-
    drawing - the plan at 0.872 px/mm, from the floor of the well at the backbone: the block
    to 27.4 (28 from the middle of the backbone), the stem to 97.4 (98), and the head with
    its knuckle to the underside of the cover at 112.9. The fork of the stem is drawn as the
    stem.
size: {w: 44.0, h: 9.0}
size-confidence: {w: drawing, h: estimated}
attrs: {material: Plastic}
elements:
  root: {at: [0.0, 0.0], size: [44.0, 9.0], class: bezel}
  stem: {at: [16.9, 0.0], size: [10.2, 9.0], class: bezel}
  head: {at: [2.3, 0.0], size: [39.4, 9.0], class: bezel}
relief:
  features:
    - node: root
      out: 27.4
      color: '#2c2d30'
      confidence: drawing
      source: the plan of CMH-DFDS1U in the FS high capacity datasheet, the block 28 mm from the backbone
    - node: stem
      out: 97.4
      color: '#2c2d30'
      confidence: drawing
      source: the same plan, the stem to the head at 98 mm from the backbone
    - node: head
      lift: 97.4
      out: 112.9
      color: '#323437'
      confidence: drawing
      source: the same plan, the head and knuckle up to the cover
skins: [default]
