  stand in, its floor the front face of the plate
provenance:
  size: >-
    drawing - the front view of CMH-SFD1U in the FS Horizontal Cable Managers with Finger Duct datasheet, at 2.671 px/mm: the duct 433 wide
    between the ear folds and 42 high, the height of the base on the side view. The well
    is 75.5 deep, from the front of the cover to 0.2 mm in front of the base plate: the
    top view puts the plate 11.3 deep behind the ear plane in an 87 mm overall, and the
    0.2 keeps the floor off the face of the plate the rear view builds.
  size-holes: >-
    drawing - the same view, the two pass-through holes: 76.4 wide (3.03 in [77mm]),
    24.7 high, 171.2 apart (6.74 in) and 325.2 over both (12.8 in), symmetric about the
    middle; each is a hole in the floor. The corner radius, 3, is estimated.
size: {w: 433, h: 42, d: 75.5}
