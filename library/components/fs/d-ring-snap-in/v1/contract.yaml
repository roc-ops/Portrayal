format: 1
kind: component
name: d-ring-snap-in
version: 1.1.0
class: mechanical
behaviour: mounts
description: >-
  FS snap-in D-ring of the FHD-CMP5DR lacer panel, seen from above - a polycarbonate
  loop that twists into a round seat in the tray and stands across it, cables passing
  through along the tray
provenance:
  size: >-
    drawing - the plan view of the three-view drawing in FS's 0U/1U Horizontal Cable
    Manager Datasheet (updated 2025-05-11), at 1.331 px/mm. Each ring is a pair of lines
    6.8 mm apart and 43.6 mm long, crossing a seat whose chord gives a 32.3 mm circle;
    all five read the same to the pixel. The part's width is the seat's and its height
    the ring's.
  relief: >-
    drawing - the ring-profile view of the same drawing: the loop is 44.3 deep and stands
    about 41 mm above the tray, with a wall about 5.3 mm in the plane of the loop and 6.8
    across it. THE LOOP IS OPEN: the top bar turns down at the front into a hooked end 9 mm
    long, and the front leg stops 3.8 mm below it, which is the slit a cable is laid in
    through without being threaded. Built as round tube, legs 6.8 and bar 6, which is
    neither of the wall's two figures, and with square corners where the real ring's are
    radiused. The seat's 2 mm is estimated; no view dimensions it.
  relief-not-drawn: >-
    known-wrong - the plan and the front view both draw each leg flaring to a foot about
    18 mm wide where it meets the seat. The legs here are straight.
  color: >-
    estimated - black, darker than the tray so that it separates from it. Every image FS
    publishes of the part is a render.
  material: >-
    datasheet - "D-rings Material: PC, UL 94V-2" in the same datasheet's table.
  guide: >-
    drawing - the clear opening inside the loop on the ring-profile view of the same
    drawing, at 1.331 px/mm: 43 px between the inner lines of the two legs and 39 px
    from the underside of the top bar down to the seat, so 32.0 by 29.5 mm, to the
    drawing's 0.75 mm. Seen looking along the tray, which is the run: `w` lies along
    the plan's depth and `h` stands out of the tray. The slit is not counted as
    opening; a cable is laid in through it and then held.
size: {w: 32.3, h: 43.6}
size-confidence: {w: drawing, h: drawing}
attrs: {material: PC, flammability: UL 94V-2}
guide: {kind: ring, aperture: {w: 32.0, h: 29.5}, run: x}
elements:
  seat: {at: [0.0, 5.65], size: [32.3, 32.3], class: bezel}
  top: {at: [12.75, 0.0], size: [6.8, 43.6], class: bezel}
  leg-rear: {at: [12.75, 0.0], size: [6.8, 6.8], class: bezel}
  leg-front: {at: [12.75, 36.8], size: [6.8, 6.8], class: bezel}
  hook: {at: [12.75, 36.8], size: [6.8, 6.8], class: bezel}
relief:
  features:
    - node: seat
      cyl: 2.0
      color: '#131517'
      confidence: estimated
      source: no view of the FS drawing dimensions the seat's height
    - node: leg-rear
      cyl: 41.0
      color: '#0c0d0f'
      confidence: drawing
      source: the ring-profile view of FS's 0U/1U datasheet drawing, the loop about 41 mm above the tray
    - node: top
      bar: 6.0
      lift: 35.0
      color: '#0c0d0f'
      confidence: drawing
      source: the same view, the top bar's upper edge about 41 mm above the tray
    - node: hook
      cyl: 9.0
      lift: 32.0
      color: '#0c0d0f'
      confidence: drawing
      source: the same view, the hooked end coming 9 mm down from the top of the loop
    - node: leg-front
      cyl: 28.2
      color: '#0c0d0f'
      confidence: drawing
      source: the same view, the front leg ending 3.8 mm below the hooked end - the slit
skins: [default]
