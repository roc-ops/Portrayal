<svg xmlns="http://www.w3.org/2000/svg" width="32.3mm" height="43.6mm" viewBox="0 0 32.3 43.6">
  <!-- seen from above, rear at y=0: the round twist-lock seat on the tray, and
       the ring standing on it edge-on. The ring is four pieces because it is not
       a closed loop: a rear leg, the top bar, the hooked end the bar turns down
       into at the front, and a front leg that stops short of it. The gap between
       those last two is the slit a cable is laid in through. -->
  <circle id="seat" cx="16.15" cy="21.8" r="16.15" fill="#131517"/>
  <rect id="top" x="12.75" y="0" width="6.8" height="43.6" rx="2" fill="#0c0d0f"/>
  <rect id="leg-rear" x="12.75" y="0" width="6.8" height="6.8" rx="2" fill="#0c0d0f"/>
  <rect id="leg-front" x="12.75" y="36.8" width="6.8" height="6.8" rx="2" fill="#0c0d0f"/>
  <rect id="hook" x="12.75" y="36.8" width="6.8" height="6.8" rx="2" fill="#0c0d0f"/>
</svg>
