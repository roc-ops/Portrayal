format: 1
kind: component
name: fs-pdubk-plate-face
version: 1.0.0
class: mechanical
description: >-
  The plate of the FS FS-PDUBK PDU bracket seen from the side its flange does not stand on.
  An elevation only. The plate's solid is built from the other side, by fs/fs-pdubk-plate@1.
provenance:
  size: >-
    drawing - the same figures as fs/fs-pdubk-plate@1: 135 by 88.4 from the FS-PDUBK product page's
    dimensioned drawing, the holes scaled off it and estimated there. The skins are that plate's: a
    sheet is as far from its flange's end on one side as on the other, so the two sides of the
    plate carry the same holes at the same distances from the flange, and which skin a view takes
    follows only the end its flange is at.
size: {w: 135, h: 88.4}
size-confidence: {w: drawing, h: drawing}
elements:
  face: {at: [0.0, 0.0], size: [135, 88.4], class: bezel}
skins: [flange-left, flange-right]
