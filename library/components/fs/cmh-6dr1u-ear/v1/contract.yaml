name: cmh-6dr1u-ear
version: 1.0.0
class: ear
description: >-
  One ear of the FS CMH-6DR1U cable manager seen from the front - the flat end of the
  steel plate outside the fold, with an oval slot near its top and bottom for the rack
  screws, drawn as the well the end ring is bolted in; the right ear is this part turned
  half round
provenance:
  size: >-
    drawing - the front view of the CMH-6DR1U in FS's Horizontal Cable Managers with
    D-rings datasheet: 1.04 in [26.3mm] from the end of the 19 in [482.6mm] to the fold,
    44 high. The plate is flat across the whole 482.6, so the ear lies in the plane of
    the panel's face, 88 behind the front of the envelope, as the panel does.
  depth: >-
    drawing - 88, the panel's: the side view of the same figure dimensions the D-ring's
    longer arm 3.4 in [88mm] from the face of the plate, and the ear is that plate.
  size-holes: >-
    drawing - the same view at 1.861 px/mm across and 1.92 down (the plate's 84.5 px for
    its 44): each slot's outline reads 11 x 5.3 mm, centred 8.9 from the outer end, and
    6.3 and 37.8 down - 31.5 apart, the 1U hole spacing of 31.75 to the drawing's
    resolution. The slot is drawn 11 x 5.5.
  color: >-
    estimated - the panel's black; FS states "Panel Material: Steel, Powder-coated
    Black", and every image of the part is a render.
size: {w: 26.3, h: 44, d: 88}
size-confidence: {w: drawing, h: drawing, d: drawing}
