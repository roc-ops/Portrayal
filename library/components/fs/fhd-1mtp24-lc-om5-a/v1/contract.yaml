provenance:
  face-legends: >-
    THE PORT NUMBERS ARE fs/fhd-1mtp24-lc-os2-a@3's, AND 174250.g1.jpg SHOWS
    THEM: the same end-of-row numbers in the same places, and nothing between
    them. They are drawn at the twin's coordinates - see its face-legends for
    how they were measured.
  size: >-
    see size-notes - the plate and the parts are 57023's, re-read on 174250's
    own render; the depth is this SKU's product page.
  parts: >-
    the twin's positions, unchanged, and corroborated rather than assumed:
    `panel_measure.openings` on 174250.g1.jpg puts every adapter within 0.2 mm
    of where the same call puts it on the twin's render. What differs is the
    housing colour, passed to each adapter as `housing-finish`.
  colour: >-
    COUNTED, NOT TAKEN FROM THE OM5 CONVENTION. #a0ae61 is the median of the
    adapter-body pixels on 174250.g1.jpg (byte-identical to 174248.g1.jpg - one
    render, one reading), selected by the one rule
    common/lc-duplex-v-adapter@4's provenance.colour records - tuned until it
    reproduces that part's measured OS2 blue off 57016.main.jpg, then applied
    unchanged here. That entry lists every medium's count side by side.
  optical: >-
    the twin's paths, unchanged: fibre type and adapter colour do not change
    which LC port a fibre reaches. `media: om5` is FS's own naming of 174250
    (FHD-1MTP12LCDOM5A) on its product page. See the twin's provenance.optical
    for how the paths were derived.
  twin: >-
    built from fs/fhd-1mtp24-lc-os2-a@3 (SKU 57023) - the same cassette FS
    builds in OM5. Everything but the model, SKU, fibre, adapter colour and
    depth source is the twin's.

skins: [default]
