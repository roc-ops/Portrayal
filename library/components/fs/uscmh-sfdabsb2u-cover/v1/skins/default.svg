<svg xmlns="http://www.w3.org/2000/svg" width="482.6mm" height="88.81mm" viewBox="0 0 482.6 88.81">
  <!-- the cover from the front: one plain ABS face, its shoulders over the two
       finger rows, a hinge clip in each corner, and the two edges that hinge and
       clip on the fingers. FS prints a round mark near the left end; the zone is
       reserved and nothing is drawn in it - the library does not reproduce vendor
       logos (components README). -->
  <rect id="plate" x="0" y="0" width="482.6" height="88.81" rx="0.8" fill="#333639"/>
  <rect id="shoulder-top" x="0" y="0" width="482.6" height="11.5" fill="#2e3134"/>
  <rect id="shoulder-bottom" x="0" y="77.31" width="482.6" height="11.5" fill="#2e3134"/>
  <rect id="clip-1" x="24.2" y="5.5" width="18.4" height="3.1" fill="#1f2123"/>
  <rect id="clip-2" x="440.0" y="5.5" width="18.4" height="3.1" fill="#1f2123"/>
  <rect id="clip-3" x="24.2" y="80.21" width="18.4" height="3.1" fill="#1f2123"/>
  <rect id="clip-4" x="440.0" y="80.21" width="18.4" height="3.1" fill="#1f2123"/>
  <rect id="logo-zone" x="28.6" y="39.7" width="9.7" height="9.6" fill="none"/>
  <rect id="lip-top" x="0" y="0" width="482.6" height="1.5" fill="#3d4043"/>
  <rect id="lip-bottom" x="0" y="87.31" width="482.6" height="1.5" fill="#25272a"/>
</svg>
