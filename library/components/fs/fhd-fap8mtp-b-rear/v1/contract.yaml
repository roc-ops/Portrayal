provenance:
  size: >-
    drawing - see size-notes.
  parts: >-
    THE FRONT's ADAPTERS, SEEN FROM BEHIND. Each front part has one entry here,
    `bNN` behind `lcNN`/`scNN`/`mtpNN`, at the front column mirrored across the
    88 block (seen from behind, the first column is on the right) and at the
    same height less the block's 0.125 inset. How each is turned or mirrored is
    what makes a sleeve meet its own far end - the panel's provenance.optical
    says why, per adapter type.
  face-detail-gap: >-
    FS's renders of the panel backs (the three-quarter gallery shots) show the
    adapter bodies and their caps and no printing; nothing is printed here. The
    steel behind the adapters is painted as one dark field.
  groups: >-
    FS FHD Fiber Adapter Panels Datasheet, page 4 (section VI) prints 8/12 adapters, and the
    page 11 ordering table lists the FHD-FAP8MTPHB (FS SKU 52022) as an MTP panel, OM3/OM4, Type
    B, key up to key up. The count is eight: it is in the model name, in the section's 8/12, and
    in the legends 1 to 4 and 5 to 8 on FS's face-on render of the panel. The datasheet draws no
    8-opening panel (page 7 is the 12-opening one), and the group states a count, not a
    position. The datasheet prints the fibre mode and the key arrangement and no data rate, and
    names no role for the adapters; the role follows the job, a through connection a patch cord
    is plugged into, so it is traffic, and no speed is stated. The group's media is the
    adapters' own, fiber. The key arrangement stays in optical.polarity. The rear face holds the
    same sleeves as the front, so it takes the same group and the same count.
skins: [default]
