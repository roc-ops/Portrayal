format: 1
kind: component
name: fhd-fap8mtp-b-rear
version: 1.1.0
class: adapter-panel
description: >-
  The back of FS SKU 52022 (FHD-FAP8MTPHB): the adapter block seen from
  behind, the same adapters that face forward, whose far ends take the trunk
  or patch cords that reach this panel from the rear.
size: {w: 88.0, h: 34.8}
size-confidence: {w: drawing, h: drawing}
size-notes: >-
  FS's top views dimension the adapter block 3.46in (88) across and its side
  views 1.37in (34.8) tall; this face is that block seen from behind. NO DEPTH
  IS DECLARED: a face is a drawing of a back, and render.py turns a `size.d`
  on a fixed component into a pit as big as the face (the cassette rears
  record the same reading). The depth belongs to the panel, as `body.depth`.
attrs: {media: fiber}
groups:
  adapters:
    term: Adapter
    role: traffic
    index-origin: 1
    attrs: {media: fiber}
    description: >-
      the 8 MTP adapters on the rear face, each the far end of the front adapter of the same
      number, passive
parts:
