provenance:
  size: >-
    Faceplate measured off FS's own face-on render 57341.B.jpg, scaled on
    the 108.97 mm FHD module width and validated against the 35.05 mm height
    to 2.87% - see size-notes for the corroborating dimension line that
    supplies the depth.
  parts: >-
    THE SIX COLUMN CENTRES ARE THE MEASUREMENT, not a pitch multiplied out,
    and they are shared by both rows. Measured on 57341.B.jpg (the same
    validated scale as the faceplate) at x = 21.8608, 34.7102, 47.7265,
    60.7428, 73.6757, 86.7755, identical to four decimal places whether read
    from the top row's opening band or the bottom row's - the two rows are
    column-aligned with 0.00 spread. Five gaps of 12.8494, 13.0163, 13.0163,
    12.9329, 13.0998 - mean 12.9829, spread 0.2504, kept rather than
    averaged away, the same treatment fhd-1mtp6lcd-os2-a@1 gives its own
    uneven gap. `at.x` for each column is centre - 9.28/2 (the adapter's own
    measured width from common/lc-duplex-v-adapter@4): 17.22, 30.07, 43.09,
    56.10, 69.04, 82.14.

    THE TWO ROW CENTRES ARE ALSO MEASURED, independently for each row and
    likewise with 0.00 spread across all six columns: the row nearer the top
    of the render (the one labelled 13-24) has its pale opening spanning
    y = 4.6725 to 16.8545, centre 10.7635; the row nearer the bottom
    (labelled 1-12) spans y = 19.3576 to 31.7064, centre 25.5320. `at.y` for
    each row is centre - 13.75/2 (the adapter's own measured height): 3.89
    for the 13-24 row, 18.66 for the 1-12 row. This differs from
    fhd-1mtp6lcd-os2-a@1's own method, which measured the OPENING'S top edge
    directly and used it as `at.y` without a centre step - that one row's
    top edge happened to be usable directly; here, with two rows to place
    from one shared adapter height, deriving `at.y` from the measured centre
    is the reproducible version of the same idea. The two rows sit 1.02 mm
    apart (18.66 - (3.89 + 13.75) = 1.02) with margins of 3.89 mm above and
    2.64 mm below (35.05 - (18.66 + 13.75) = 2.64) - not symmetric, and kept
    as measured rather than adjusted to look symmetric.

    A NOTE ON `panel_measure` AND THE OTHER FOUR IMAGES: 57341.C.jpg (a
    three-quarter render with FS's own dimension lines), 57341.D.jpg (a
    three-quarter side view of the rear MTP plugs) and 57341.E.jpg (a
    near-face-on rear render) all FAIL `validate()` when run through
    `plate()` - 86.4%, 81.8% and 63.5% off the known 35.05 mm respectively -
    which is why only 57341.B.jpg is used for any measurement here, and why
    the rear geometry stays estimated (see fs/fhd-2mtp12-lc-rear@2's own
    provenance).

    ID ORDER, `optical.front-order`, AND TWO RETRACTIONS IN THE SAME
    PROVENANCE FIELD - both left here rather than deleted, because the
    mistakes are as much a record as the fact. `lc01`..`lc06` are the 1-12
    row and `lc07`..`lc12` are the 13-24 row, both left to right, zero-padded
    so an id never sorts as a string in the wrong order.

    RETRACTION ONE: an earlier draft of this note claimed the DCIM front-port
    numbering came out matching FS's panel because the ids were already in
    panel order. That was true only by accident of a bug in
    `components_index.py`, which was not yet publishing `at` on a part at
    all - `_front_parts`' sort fell through to comparing ids, and this
    module's ids happened to already be in panel order.

    RETRACTION TWO: once that bug was fixed and `_front_parts` genuinely
    read `at.x`, the numbering it produced was COLUMN-MAJOR, not the
    row-major order FS prints - `lc01`(1,2) `lc07`(3,4) `lc02`(5,6)...,
    because every column here holds one part from EACH row at the SAME
    `at.x` (the six measured column centres are shared by both rows - see
    above) and `_front_parts`' position-based sort has no notion of a row.
    THAT WAS ALSO WRONG TO SHIP, for a sharper reason than the first bug:
    GEOMETRY CANNOT DETERMINE A SILKSCREEN. Whether a two-row vendor panel is
    numbered row then row or column then column, and which row comes first,
    is a fact about the printing, not a fact `at.x`/`at.y` can be sorted
    into - inferring "column-major" from this module's OWN placement data
    was guessing a convention from the one multi-row sample this library
    happens to hold, the same shape of mistake `standards.yaml`'s
    `fhd-lc-cassette` note already names for the 12.90-vs-13.2 pitch
    confusion.

    THE FIX IS TO STATE IT, NOT DERIVE IT. `optical.front-order` above is
    read directly off the two SOURCED renders: 57341.B.jpg prints `1`
    through `12` along the bottom row and `13` through `24` along the top
    row (see the provenance.parts crops), and 57341.E.jpg's own `1-12`/
    `13-24` rear legend confirms which twelve-fibre half is which (see
    provenance.optical below) - so "the 1-12 row first, the 13-24 row
    second, each left to right" is FS's own printed order, not a rule
    inferred from placement. `[lc01..lc12]` in that exact order is what
    makes `_front_parts` (spec/tools/portrayal/optical_ports.py) use it
    instead of sorting on position - L88 requires `front-order` on exactly
    this shape of module, a fibre-bearing face at more than one `at.y`, and
    this is the first contract that triggers it. The OPTICAL PATHS above
    were never affected by any of this at any point - they bind real
    part/position pairs, not the derived DCIM index - and every one of the
    24 positions is still reached exactly once (see the two tests in
    spec/tests/test_fs_archetypes.py, plus the numbering test in
    spec/tests/test_optical_export.py added when `front-order` landed).
  optical: >-
    THE MTP-TO-FIBRE-RANGE ASSIGNMENT IS SOURCED; THE PER-FIBRE PINOUT WITHIN
    EACH RANGE IS NOT. 57341.E.jpg is FS's own rear render and it PRINTS the
    assignment directly on the part: `13-24` above the left MTP adapter,
    `1-12` above the right one, with a `Type A` label between them. This
    contract's rear component (fs/fhd-2mtp12-lc-rear@2) places the left
    adapter as `mtp1` and the right as `mtp2` reading that same image left
    to right, so `mtp1` carries fibres 13-24 and `mtp2` carries fibres 1-12
    - a fact read off the render, not assumed.

    Within each twelve-fibre half, though, there is no per-fibre diagram,
    the same gap fs/fhd-1mtp6lcd-os2-a@1 already documents for SKU 57016:
    the fhd-fiber-cabling-system-guide names the polarity TYPE (Table 3
    lists 57341's family as Type A) but holds no drawing that says which MTP
    position lands on which LC bore. So each half uses the same STANDARD
    TYPE A STRAIGHT-THROUGH arrangement fhd-1mtp6lcd-os2-a@1 assumes for its
    own twelve: MTP position n to fibre n in order, independently within
    each half - rear:mtp2.1 to lc01.1, rear:mtp2.2 to lc01.2, ...
    rear:mtp2.12 to lc06.2 for the 1-12 half, and rear:mtp1.1 to lc07.1
    through rear:mtp1.12 to lc12.2 for the 13-24 half. This is what "Type A"
    conventionally means (TIA-598/568 straight pinout, no crossing) applied
    twice, not a fact read off a per-fibre drawing of this SKU. Confidence:
    ESTIMATED for the within-half pinout; SOURCED for which half is which
    MTP.

    THE POLISH IS THE SAME KIND OF ASSUMPTION fhd-1mtp6lcd-os2-a@1 already
    makes, and for the same reason: FS's catalogue row for this SKU reads
    "FHD® 2x MTP-12 (Male) to LC Cassette, OS2, 24 Fibers, Type A" - it names
    the polarity type and stops, the same silence as SKU 57016's row.
    `polish: upc` is the convention for an OS2 cassette with no APC stated,
    not a fact read off FS's own description of 57341. A catalogue row, a
    datasheet, or a green ferrule in a face-on photograph settles it.

    `optical.front-order` IS READ OFF THE SILKSCREEN, NOT DERIVABLE FROM
    `parts`. 57341.B.jpg prints the port numbers directly on the faceplate -
    `1` through `12` along the row nearer the bottom, `13` through `24`
    along the row nearer the top, both left to right (see the two label
    crops discussed in provenance.parts) - and that is the entire source for
    `[lc01, lc02, ..., lc12]` above: the 1-12 row first, the 13-24 row
    second, each left to right, matching how `lc01`..`lc12` were already
    assigned to those rows and columns. No placement rule produced this
    order; `at.x`/`at.y` alone cannot tell a row-major panel from a
    column-major one, which is exactly what shipped wrong before this field
    existed (see provenance.parts's two retractions). Confidence: SOURCED,
    to the faceplate render, the same standing `polarity` and `polish` have
    for their own sourced halves above.
  face-detail-gap: >-
    the FS logo, the `MALE` warranty seal, the two captive thumb-knobs and
    the port numbers 1 through 24 visible on 57341.B.jpg are not drawn - the
    numbering is recorded in the optical paths and in provenance.parts
    above rather than in the art, the same treatment fhd-1mtp6lcd-os2-a@1
    gives its own six-adapter face.
