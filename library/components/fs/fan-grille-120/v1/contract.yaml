format: 1
kind: component
name: fan-grille-120
version: 1.0.0
class: mechanical
description: >-
  The guard stamped in the plate in front of a 120 mm fan on FS's rack fan panels and trays: four
  concentric rings and four diagonal spokes left in the metal, a hub with six round holes, and
  the fan grey behind the openings.
provenance:
  size: >-
    photo-measured - 114 across: the FANP3U3F's straight-on render (SKU 173817, g1, 2.888 px/mm)
    puts each grille's outer edge 57 from its centre. The fan behind is a 120 mm fan (the rear
    render g5 draws its square frame).
  size-pattern: >-
    photo-measured - the same render: four rings with the spokes at the diagonals and a hub with
    six holes on a ring; the ring radii are drawn on an even 9 mm pitch from the outer edge, an
    estimate of the render's spacing, not a measurement of each.
  size-hub: >-
    photo-measured - the hub carries six round holes on a ring: on g1 the left and right holes
    stand 29.4 apart, so the ring is 14.7 in radius, and each hole is about 7.4 across; the hub
    is drawn 41 across.
  relief: >-
    the openings are declared a vent 1.5 deep, the stamped plate's thickness: they are the air
    path to the fan, which shows through them in grey and is not built.
size: {w: 114.0, h: 114.0}
size-confidence: {w: photo-measured, h: photo-measured}
elements:
  guard: {at: [0.0, 0.0], size: [114.0, 114.0], class: bezel}
relief:
  features:
  - {node: guard, vent: 1.5, confidence: estimated, source: 'the stamped plate, about 1.5 thick;
      its openings are the air path to the fan'}
skins: [default]
