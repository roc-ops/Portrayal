format: 1
kind: component
name: fs-pdubk-gusset-plan
version: 1.0.0
class: mechanical
description: >-
  One of the three gussets of the FS FS-PDUBK PDU bracket seen from above or below. It is a right triangle
  that fills the inside corner between the flange and the plate. The skin says which end of the view the
  flange is at. An elevation only.
provenance:
  size: >-
    estimated - FS states no gusset size. The sizes are read off the product page's photographs: the plate seen
    face-on, and the bracket standing on its flange. Each gusset runs about 6 mm along the plate from the flange.
    It rises about half way up the flange, which is about 15 of the 30 mm the page gives the flange's reach.
    The 6 is scaled against the 135 mm of the dimensioned drawing, about 6 px/mm there. The 15 is half the 30,
    read off the photograph where the tip stands near half the flange's height. The three stand at the 31.5 mm
    pitch of the keyholes about the plate's middle. That puts them 12.7, 44.2 and 75.7 down the 88.4, which the
    drawing's own stubs agree with to within a millimetre.
size: {w: 15, h: 6}
size-confidence: {w: estimated, h: estimated}
elements:
  gusset: {at: [0.0, 0.0], size: [15, 6], class: bezel}
skins: [foot-first, foot-last]
