format: 1
kind: component
name: dinrail2u-panel
version: 2.0.0
class: bracket
description: >-
  The rail panel of the FS DINRAIL2U bracket, seen from the front: a steel plate 421.2 mm wide
  that meets both side brackets, with lightening cut-outs above and below the 400 mm DIN rail it
  carries. Its ends fold back along the brackets' inner faces and are screwed through the
  brackets' slots, which is how it slides to set the rail back; drawn as the well the open front
  looks into, whose floor is the plate at its setback.
provenance:
  size: >-
    drawing - the datasheet's DINRAIL2U front and top views. The 400.00 the front view dimensions
    is the rail, not the panel: its extension lines fall on the rail's ends, while the panel's
    top and bottom edges run on to the side brackets, and the top view draws the panel's plate
    from bracket to bracket with the rail stopping short of each (the rail's ends 362 px apart
    at 1.116 mm a pixel, the brackets' inner faces 376). So the panel is the 421.2 between the
    brackets' inner faces (the device's 424.2 less two 1.5 sheets), as gallery render g1 of SKU
    178163 shows it, and 87.5 high. Eight lightening cut-outs, four above the rail and four below,
    read off the front view as fractions of the rail's 400 and the height, and placed 10.6 further
    in, where the rail's ends stand from the panel's (the view's vertical scale differs from its horizontal by
    several per cent).
  depth: >-
    drawing - 161.2: the panel face's default setback behind the ears (the device's provenance.setback).
    In a sheet body a well builds its floor and nothing round it, so the plate stands at that
    depth with its cut-outs open, and the rail placed in the well stands on it.
size: {w: 421.2, h: 87.5, d: 161.2}
size-confidence: {w: drawing, h: datasheet, d: drawing}
relief: {wall: '#1b1d20'}
elements:
  panel: {at: [0.0, 0.0], size: [421.2, 87.5], class: bezel}
skins: [default]
