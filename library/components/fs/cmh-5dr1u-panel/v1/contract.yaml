format: 1
kind: component
name: cmh-5dr1u-panel
version: 1.0.0
class: mechanical
description: >-
  The flat steel panel of the FS CMH-5DR1U cable manager seen from the front - the
  plate between the ear zones, where its top and bottom edges fold back - drawn as the
  well its five rings stand in
provenance:
  size: >-
    drawing - the front view of the CMH-5DR1U in FS's Horizontal Cable Managers with
    D-rings datasheet: 16.93 in [430mm] between the ends of the folded edges, and 1.04
    in [26.3mm] from each end of the 19 in [482.6mm] to them. FS's 0U/1U datasheet draws
    the same part 482.4 overall. The plate is flat across the whole width and the ears
    are its two flat ends outside the folds; this part is the 430 between them. 44
    high, 1.73 in.
  depth: >-
    drawing - 85.5. The side view of the same figure dimensions the ring 3.37 in
    [85.5mm] from the face of the plate, so the plate's face is 85.5 behind the front
    of the envelope, and the folded edges reach 12.2 behind it (its 3.85 in [97.7mm]
    overall less the 85.5).
  holes: >-
    drawing - each ring twists into a round hole with two notches (FS's quick start
    guide; FS's renders show an empty one). With the rings fitted the holes are full,
    and they are not cut here.
  color: >-
    estimated - FS states "Panel Material: Steel, Powder-coated Black". Every image of
    the part is a render, so the value is FS's render material and not a photograph of
    a finish.
size: {w: 430, h: 44, d: 85.5}
size-confidence: {w: drawing, h: drawing, d: drawing}
relief: {wall: '#1b1d20'}
elements:
  plate: {at: [0.0, 0.0], size: [430, 44], class: bezel}
skins: [default]
