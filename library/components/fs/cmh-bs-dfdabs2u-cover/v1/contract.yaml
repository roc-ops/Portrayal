format: 1
kind: component
name: cmh-bs-dfdabs2u-cover
version: 1.0.0
class: mechanical
behaviour: mounts
description: >-
  One of the two detachable covers of the FS CMH-BS-DFDABS2U dual-sided finger duct, seen
  from its side - an ABS channel whose face closes that side of the duct and whose two lips
  clip over the finger tips; the front and the rear take the same cover
provenance:
  size: >-
    drawing - the front view of the FS CMH-BS-DFDABS2U datasheet: the cover runs the
    433.3 between the ear ends, taken as the 434.0 of the duct. It is 93.5 high over an
    87 ear (93.4 on the front view, 93.5 on the rear), standing 3.25 mm into the rack units
    above and below, and it is drawn that high.
  relief: >-
    drawing - the plan: the cover takes the outer 10.4 mm of each side, over the finger
    tips, so its lips stand 77.5 to 87.9 above the floor. The face is 1.5 thick and
    the lips 1.5 high, both estimated: no view dimensions the cover section.
  color: >-
    estimated - "Color: Black" in the specification table. FS publishes no photograph or
    render of the part; the shade is the one the CMH-SFD1U renders give the cover of the
    sibling ABS duct.
size: {w: 434, h: 93.5}
size-confidence: {w: drawing, h: drawing}
attrs: {material: ABS}
elements:
  plate: {at: [0.0, 0.0], size: [434, 93.5], class: bezel}
  lip-top: {at: [0.0, 0.0], size: [434, 1.5], class: bezel}
  lip-bottom: {at: [0.0, 92.0], size: [434, 1.5], class: bezel}
relief:
  features:
    - node: plate
      lift: 86.4
      out: 87.9
      color: '#333639'
      confidence: estimated
      source: no view dimensions the cover section
    - node: lip-top
      lift: 77.5
      out: 87.9
      color: '#333639'
      confidence: drawing
      source: the plan of the FS CMH-BS-DFDABS2U datasheet at 5.55 px/mm, the cover over the outer 10.4 mm of the side
    - node: lip-bottom
      lift: 77.5
      out: 87.9
      color: '#333639'
      confidence: drawing
      source: the plan of the FS CMH-BS-DFDABS2U datasheet at 5.55 px/mm, the cover over the outer 10.4 mm of the side
skins: [default]
