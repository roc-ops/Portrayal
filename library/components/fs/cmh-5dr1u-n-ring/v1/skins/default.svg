<svg xmlns="http://www.w3.org/2000/svg" width="12.7mm" height="44mm" viewBox="0 0 12.7 44">
  <!-- one ring from the front: the strip against the panel, the upper arm
       end-on with its hooked end, and the lower arm's curled end standing in
       front of it. The two ends stand 11 mm apart in depth: that gap is the
       slit a cable is laid in through. -->
  <rect id="back" x="0" y="1.3" width="12.7" height="41.4" fill="#16181b"/>
  <rect id="arm-top" x="0" y="1.3" width="12.7" height="1.2" fill="#0c0d0f"/>
  <rect id="hook" x="0" y="1.3" width="12.7" height="20" rx="1" fill="#0c0d0f"/>
  <rect id="arm-bottom" x="0" y="41.5" width="12.7" height="1.2" fill="#0c0d0f"/>
  <rect id="lip" x="0" y="22" width="12.7" height="20.7" rx="1" fill="#101214"/>
</svg>
