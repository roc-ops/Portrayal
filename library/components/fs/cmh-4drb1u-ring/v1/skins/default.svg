<svg xmlns="http://www.w3.org/2000/svg" width="12.5mm" height="44mm" viewBox="0 0 12.5 44">
  <!-- one ring from the front: the strip against the panel, the upper arm
       end-on with its hooked end, and the lower arm's curled end standing in
       front of it. The two ends overlap a little in height and stand 12 mm
       apart in depth: that gap is the slit a cable is laid in through. -->
  <rect id="back" x="0" y="3.1" width="12.5" height="39.6" fill="#16181b"/>
  <rect id="arm-top" x="0" y="3.1" width="12.5" height="1.2" fill="#0c0d0f"/>
  <rect id="hook" x="0" y="3.1" width="12.5" height="18.2" rx="1" fill="#0c0d0f"/>
  <rect id="arm-bottom" x="0" y="41.5" width="12.5" height="1.2" fill="#0c0d0f"/>
  <rect id="lip" x="0" y="20" width="12.5" height="22.7" rx="1" fill="#101214"/>
</svg>
