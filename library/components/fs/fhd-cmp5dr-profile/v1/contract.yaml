format: 1
kind: component
name: fhd-cmp5dr-profile
version: 1.0.0
class: mechanical
behaviour: mounts
description: >-
  The FS FHD-CMP5DR lacer panel seen from one side - the ear on edge, the web sloping
  down to the tray, and one ring's loop with its slit. An elevation: it draws the side
  view and builds nothing in 3D, where the tray, the webs and the rings are already
  built from the plan
provenance:
  size: >-
    drawing - the ring-profile view of the three-view drawing in FS's 0U/1U Horizontal
    Cable Manager Datasheet (updated 2025-05-11), at 1.331 px/mm: 110 deep and 44 high,
    both dimensioned on the other two views.
  size-outline: >-
    drawing - the same view. The web holds the ear's height for 9 mm, slopes to 13.5 at
    31 mm and is level to 50, then falls to the tray at 66. The ring is 44.3 deep and
    41 high with a 5.3 mm wall; its front leg stops 28.2 mm up and the hooked end of the
    top bar comes down to 32, leaving the 3.8 mm slit. Corner radii are estimated.
  skins: >-
    two skins, left and right, because one is the mirror image of the other and a
    placement can turn a part but not mirror it - as common/rack-ear@1 does.
size: {w: 110, h: 44}
size-confidence: {w: drawing, h: drawing}
elements:
  web: {at: [44.0, 0.0], size: [64.5, 42.5], class: bezel}
  ear: {at: [108.5, 0.0], size: [1.5, 44], class: bezel}
  tray: {at: [0.0, 42.5], size: [110, 1.5], class: bezel}
  ring: {at: [0.0, 1.5], size: [44.3, 41], class: bezel}
skins: [right, left]
