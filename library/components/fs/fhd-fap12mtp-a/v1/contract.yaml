provenance:
  size: >-
    drawing - see size-notes.
  parts: >-
    FS's vector drawing (panels datasheet p7, MTP Fiber Adapter Panel, 1200 dpi,
    23.55 px/mm on the 109 plate; the plate then reads 35.03 against 35) draws
    twelve PORTRAIT adapter bodies 9.77 wide and 13.25 tall, centres x 19.53
    33.50 47.51 61.49 75.50 89.47 (13.99 pitch, spread 0.04) in rows centred at
    y 9.51 and 25.52 (16.01 apart). The datasheet notes that Type A and Type B
    MTP panels share these dimensions. Each tile is the library's MPO panel
    tile, 13.8 x 9.4 drawn landscape, TURNED 90 so it stands portrait as FS
    mounts it - 9.4 x 13.8 against the drawn 9.77 x 13.25 - and centred on a
    drawn body (`at` is the unrotated box's corner, the turn about its centre).
  face-legends: >-
    read off the drawing: 7 over 1 left of the first column and 12 over 6 right
    of the last, 3.06 mm digits (drawn at 4.1). The lower row is 1-6 and the
    upper 7-12, each left to right.
  knobs: >-
    THE THUMB-KNOBS ARE DRAWN, and not at the cassettes' positions. FS's panel
    drawings dimension the two knob centres 3.91in (99.4) apart on every panel,
    so each sits 4.785 in from its edge; the 36F drawing (p6) draws the knob
    face 8.47 across, r 4.24. The cassettes carry knobs at 5.10 from the edge, r
    4.10, read off renders of a different part.
  depth: >-
    drawing - the top view beside each front view gives the reach in front of
    the plate, the reach behind it and the total, in inches with millimetres:
    24F LC 0.27 [6.9] / 1.09 [27.8] / 1.43 [36.4], MTP 0.49 [12.5] / 1.20 [30.4]
    / 1.76 [44.6], 36F LC 0.65 [16.4] / 0.57 [14.6] / 1.27 [32.2]; the SC panel
    is noted as the 24F LC's size. The front and rear reaches leave about 1.7
    for the plate on the LC and MTP views, and `d` is the plate plus the rear
    reach. The adapters' own relief does not reproduce the front reach - common
    adapters stand 1.0 to 1.2 proud, estimated - and is not overridden here.
  optical: >-
    TYPE A, KEY UP TO KEY DOWN, IS FIBRE 1 TO FIBRE 1. An MTP adapter panel
    holds no glass; the adapter aligns two plugs, and its key arrangement
    decides which fibres meet. With the keys opposed (FS's Key Up to Key Down,
    Type A) fibre n meets fibre n; with the keys aligned (Type B) fibre n meets
    fibre 13 - n. The tiles number their fibres as seen from their own side with
    a key-up plug mated from the viewer, so the rear face turns each tile to
    where the REAR plug's key sits: a key-down plug seen from behind is the
    front tile's turn, 90, which puts fibre 1 on the same physical sleeve as the
    front's fibre 1. The paths are that geometry written down.
  face: >-
    35510.p3, the face-on render, agrees: twelve grey-capped portrait openings
    in two rows of six, numbered 7/1 and 12/6.
  logo-zone: >-
    reserved, not drawn - FS prints its mark top left on every panel face
    (drawings p5-p9, the renders); the library reproduces no vendor logo. Box
    read off the drawings, to about half a millimetre.
  fibre-count: >-
    TWELVE POSITIONS, AND A PANEL THAT TAKES THREE. FS sells these adapters as
    MTP-8/12/24 - one opening any of the three ferrules mates - and each is
    composed at the MPO tile's default, 12 positions, the count the FHD cassette
    trunks use. An MPO-24 trunk seated here carries 24 fibres the ports do not
    count and an MPO-8 leaves four positions dark; a configuration overriding
    `optical.positions` per adapter would say which. Not modelled.
  key-direction: >-
    WHICH WAY EACH TILE IS TURNED IS A CONVENTION, NOT A READING. FS's drawing
    and renders show portrait openings and do not show a key clearly enough to
    say whether it faces left or right; the tiles are turned 90 (key to the
    right on the front). Only the RELATIVE turn between the two faces carries
    information - it is what the adapter type fixes - and that is what the
    paths depend on.
skins: [default]
