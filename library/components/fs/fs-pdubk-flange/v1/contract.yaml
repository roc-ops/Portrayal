format: 1
kind: component
name: fs-pdubk-flange
version: 1.0.1
class: mechanical
description: >-
  The flange of the FS FS-PDUBK PDU bracket seen face-on from the side its plate stands on. It is the foot
  that lies against a rack post, 30 across and 88.4 high. It has four bolt holes up its middle, two rounded
  outer corners and three gussets joining it to the plate. It is drawn as the well the plate stands out of,
  its floor the sheet itself.
provenance:
  size: >-
    datasheet and drawing - FS's product page gives the bracket 30 x 135 x 88.4 mm (H x W x D as it
    prints them, the part lying as its photographs lay it); the dimensioned drawing gives the plate
    135 and 88.4 and no view dimensions the third, so the 30 is the flange's reach from the
    plate, its width across the rack's face, and its 88.4 the plate's height.
  holes: >-
    estimated - four bolt holes for the M6 cup screws, two round between two slotted, in a column
    up the flange's middle. The product page's photographs draw them with the inner pair about
    one rack-hole gap apart and the outer ones one rack-hole pitch beyond; they are laid on the
    EIA-310 pattern (15.875, 12.7, 15.875 up the post, 44.45 from end to end), centred on the 88.4.
    Round holes 6.6 across and slots 6.6 by 10.5 are scaled off the photographs and the screw size. The slots
    run ACROSS the flange, at right angles to the column of holes. The photograph of the flange standing up
    shows them taller than wide, with the two round holes between them round. Each has a small tail at its end
    toward the plate, about 1.5 mm long, read off the same photograph. The column's position across the
    flange (its middle) is estimated.
  corners: >-
    estimated - the two corners of the free edge, away from the plate, are rounded to a radius of about 4.
    The photograph of the flange standing up gives about 6, and the dimensioned drawing about 3.3;
    4 is the middle. The edge at the plate and the bends are drawn square; the photographs show rounded bends of about 2 to 4 mm.
  gussets: >-
    estimated - three gussets stand on the plate at the flange's foot, seen here end-on as tapered strips
    from the plate toward the free edge. Each is 15 long, about half the flange's 30, read off the photograph
    of the flange standing up. Each is 6.5 thick at the plate and 3.5 at the tip. The thicknesses were
    counted in pixels on the dimensioned drawing, at 6.65 px per mm. The outline is 43 px wide 4 px from
    the plate and 23 px wide 5 px from the tip. Half way along it is about 5 mm.
    The three stand 12.7, 44.2 and 75.7 down the 88.4,
    between the holes. That is the 31.5 pitch of the keyholes about the middle, which the drawing's own
    stubs agree with to within a millimetre.
  depth: >-
    estimated - 133: the flange is sheet, and the sheet body builds a well no deeper than 2 mm
    short of the far face (docs/cable-managers-design.md section 4), so the 135 mm depth gives a
    floor 2 thick. FS states the material (SPCC) and not the gauge.
size: {w: 30, h: 88.4, d: 133}
size-confidence: {w: datasheet, h: drawing, d: estimated}
relief: {wall: '#1b1d20'}
elements:
  floor: {at: [0.0, 0.0], size: [30, 88.4], class: bezel}
skins: [default]
