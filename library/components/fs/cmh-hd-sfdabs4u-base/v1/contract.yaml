description: >-
  The back plate of the FS CMH-HD-SFDABS4U finger duct seen from the front, between the ear
  ends, with its pass-through windows - drawn as the well the two finger walls stand in,
  its floor the front face of the plate
provenance:
  size: >-
    drawing - the FS CMH-HD-SFDABS4U datasheet, 3.566 px/mm across the 482.6 of the rear and front views and 3.573 across the 178 of the side view. The plate is 482.6 over the
    ears; the five finger blocks it carries take 443.4 between them, 19.6 in from each end,
    and that is the body. Its 178 is the plate on the side view and the specification
    table. The well is 109.4 deep: the 112 of the datasheet less the plate, whose
    2.6 is estimated - the plan draws it as two lines 10 px apart.
  size-holes: >-
    drawing - the rear view: six windows in two rows of three, each 140.1 x 50.2 with 10 mm corners, 150.0 apart across and 20.1 apart down, 28.7 from the top and bottom edges. The plate is symmetric, so the front view of
    it is the rear view as drawn. Each window is a hole in the floor.
size: {w: 443.4, h: 178, d: 109.4}
