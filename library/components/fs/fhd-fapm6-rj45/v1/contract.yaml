version: 1.1.0
class: adapter-panel
behaviour: fills
description: >-
  FS FHD-FAPM6-RJ45 - FHD modular panel with six Cat6 UTP RJ45 keystone jacks
  (FS #72818). Six RJ45 ports on the front, numbered as FS numbers the panel;
  behind each is the jack's punch-down (IDC) termination, a cable end `b1` to
  `b6` on the rear view. A Portrayal configuration of the FAPM6 (SKU
  143239), not a separate FS SKU.
size: {w: 108.97, h: 35.05, d: 9.6}
size-confidence: {w: drawing, h: drawing, d: drawing}
size-notes: >-
  THE FAPM6's OWN FACE AND DEPTH, unchanged - see fs/fhd-fapm6@1. The jacks
  seat in the six openings the panel punches; a keystone jack's body is 14.5 x
  16.1 (the Cat6 punchdown keystone jack datasheet, p3), which is what the
  16.5 x 14.9 landscape opening is cut for.
