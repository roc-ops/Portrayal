provenance:
  size: >-
    drawing - the FAPM6's, see size-notes.
  parts: >-
    SIX CAT6 RJ45 JACKS IN THE FAPM6's SIX OPENINGS. The FAPM6 datasheet
    (fhd-fapm6-datasheet.pdf p2, p5) says the panel takes keystone jacks (UTP)
    and lists a Cat6 unshielded keystone jack, #72818; the Cat6 punchdown
    keystone jack datasheet describes a jack that terminates 4-pair 23-26 AWG
    cable. Each is
    drawn as std/rj45@2, the library's RJ45 housing (15.8 x 13.2, TE 1734264),
    centred in the opening the FAPM6's clip would fill (16.5 x 14.9), so each
    sits 0.35 from the opening's left edge and 0.85 from its top. THE HOUSING
    IS THE LIBRARY's, NOT FS's: the jack's own front is not dimensioned face-on
    (the datasheet draws plan and side views, body 14.5 x 16.1 through the
    opening), and the housing lies inside it. ESTIMATED: which way the aperture
    faces. FS's datasheet draws the jack's plug opening wider than tall with
    the latch slot below, in a body 14.5 wide and 16.1 tall; a landscape
    opening takes that body turned on its side, and the housing is drawn
    unturned, pins up, because a 15.8 x 13.2 housing turned a quarter does
    not fit a 14.9 opening. A port's position and its mate point are not
    affected.
  ports: >-
    `p1` to `p6`, numbered as FS prints the panel: column by column, the lower
    opening of a pair first - 1 and 2 are the left pair, 3 and 4 the middle,
    5 and 6 the right (see fs/fhd-fapm6@1, face-legends). A generic/rj45-plug@1
    cable end lands on each, as on any RJ45 port. No lamps: a keystone jack
    has none.
  rear: >-
    A PUNCH-DOWN (IDC) TERMINATION PER JACK, DECLARED AS THE REAR FACE
    (fs/fhd-fapm6-rj45-rear@1). `b1` to `b6` on the rear are
    common/idc-termination@1, `bN` behind `pN` (a rear id may not repeat a
    front id), so a cable on `b1` of the rear and a cable on the front of `p1`
    are the two ends of one pass through the panel. The jack datasheet says the jack terminates
    4-pair twisted pair by punch-down or crimping tool, with dual-colour-coded
    labelling for 568A/B (p1, "Fast installation with special punch tool or
    crimping tool"). ESTIMATED: that #72818 is that jack. The FAPM6 datasheet
    (p5) gives the number and no description, and the jack datasheet gives no
    item number, so the match is assumed, and no public page calls #72818
    toolless. FS's public product pages for the panel and the jack could not be
    read for this change (they do not render without a browser), so the rear
    rests on the two datasheets alone. If #72818 were a coupler with an RJ45
    on both faces, the rear parts would be std/rj45@2.
  face-legends: >-
    as the FAPM6: 2 over 1 left of the first column and 6 over 5 right of the
    last; the middle pair carries no printed number.
  knobs: >-
    the FAPM6's, see fs/fhd-fapm6@1.
  logo-zone: >-
    reserved, not drawn - FS prints its mark top left; the library reproduces
    no vendor logo.
  configuration: >-
    NOT AN FS SKU. FS sells the FAPM6 (143239) and the keystone jacks (#72818)
    as separate items; this part is the two assembled, as the panel is
    deployed. No FS document gives a loaded panel a number.
  groups: >-
    FS FHD-FAPM6 Multimedia Modular Panel Datasheet, page 2 (section I: "Number of Port 6"; copper
    insert style, inline coupler or keystone jack, UTP; section II: Cat5e/6/6a, 24 ports per 1U)
    and, in the earlier revision held beside it, page 5 (Keystone Jacks, Cat6 RJ45 unshielded,
    #72818, the jack this contract seats; the later revision lists other Cat6 jack numbers and
    not this one). The panel has six openings and the contract seats a jack in each, numbered as
    FS numbers the panel (see face-legends). The datasheet prints the cable category and no data
    rate, and names no role for the jacks; the role follows the job, a through connection a
    patch cord is plugged into, so it is traffic, and no speed is stated. The group's media is
    the jacks' own, rj45. The punch-down termination behind each jack is on the rear face, which
    takes no group in this change.
