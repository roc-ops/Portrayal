format: 1
kind: component
name: fhd-cmp5dr-tray
version: 1.1.0
class: mechanical
description: >-
  The steel tray of the FS FHD-CMP5DR lacer panel seen from above - a strip across
  the front that carries the rings and an arm at each end running back to an ear -
  drawn as the well its rings stand in
provenance:
  size: >-
    drawing - the plan view of the three-view drawing in FS's 0U/1U Horizontal Cable
    Manager Datasheet (updated 2025-05-11), a 1142 x 767 px raster at 1.331 px/mm. The
    scale is the drawing's own 483 dimension line (643 px) and is proven on its 465 (619
    px), 110 (146 px) and 31.5 (42 px) lines. The tray's body edges fall 17.3 mm in from
    each end of the 483, so it is 448.4 wide; the plan is 110 deep, dimensioned. Read to
    one pixel, 0.75 mm.
  size-outline: >-
    drawing - the same view. The strip is 61.2 mm deep from the front edge; each arm is
    10.5 mm wide (body edge to 27.8 mm from the end of the 483) and meets the strip in a
    fillet read as 14 mm; the front corners are drawn 3 mm, which is below what one pixel
    resolves and is estimated.
  size-slots: >-
    drawing - the same view. Between each pair of rings, centred on the gap: two slots
    22.5 x 3 across the tray, 12 to 15 and 17.3 to 20.3 mm back from the front edge, and
    two slots 3 x 23.3 along it, 31.5 to 54.8 mm back and 3.75 mm either side of the gap's
    centre. Three of the eight long slots did not resolve in the raster and are placed by
    the symmetry the other five show.
  size-arms: >-
    drawing - the same view: each arm's floor ends at a cross line 15.4 mm short of the
    rail face, and the ring-profile view starts the sheet's lower line at the same
    place. Between there and the ear the sheet is the web, not floor.
  depth: >-
    drawing - 41. The front and ring-profile views both put the tray's sheet two pixels
    above the ear's bottom edge, 1.5 mm, with the rings' seats projecting below it, and
    the ring's top on the same row as the ear's. So the top of the sheet is 41 mm below
    the top of the 44 mm envelope. A two-pixel reading, that two views agree on.
  size-not-drawn: >-
    known-wrong - the slots' ends are round in the drawing and FS's close-up render and
    square here; and the underside carries five round twist-lock bosses, in the drawing
    and in FS's render of the underside, that are not drawn.
  tray: >-
    drawing - the plan view, as `size-outline` and `size-slots` read it, stated as the
    surface cables lie on. The floor is the strip, 448.4 x 61.2 from the front edge
    (48.8 to 110 from the rail), and each arm, 10.5 wide from 15.4 to 48.8 from the
    rail; the fillets where an arm meets the strip are left out, a few square mm. Its
    `height`, 3.0, is the 44 mm envelope less the 41 of `depth`. `lip: 0`: the
    ring-profile view draws the front edge flat, with no upturn. The sixteen `ties`
    are the slots of `size-slots`, the same rectangles the skin cuts and the device's
    bottom view draws; they take a strap, never a cable. `slack: area` is the floor
    less the rings on it; nothing states how much it holds, which depends on the cable.
  color: >-
    estimated - FS states "Steel, Powder-coated Black". Every image of the part is a
    render, so the value is FS's render material and not a photograph of a finish.
size: {w: 448.4, h: 110, d: 41}
size-confidence: {w: drawing, h: drawing, d: drawing}
