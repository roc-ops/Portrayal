format: 1
kind: component
name: fhd-cmp5dr-tray
version: 1.0.0
class: mechanical
description: >-
  The steel tray of the FS FHD-CMP5DR lacer panel seen from above - a strip across
  the front that carries the rings and an arm at each end running back to an ear -
  drawn as the well its rings stand in
provenance:
  size: >-
    drawing - the plan view of the three-view drawing in FS's 0U/1U Horizontal Cable
    Manager Datasheet (updated 2025-05-11), a 1142 x 767 px raster at 1.331 px/mm. The
    scale is the drawing's own 483 dimension line (643 px) and is proven on its 465 (619
    px), 110 (146 px) and 31.5 (42 px) lines. The tray's body edges fall 17.3 mm in from
    each end of the 483, so it is 448.4 wide; the plan is 110 deep, dimensioned. Read to
    one pixel, 0.75 mm.
  size-outline: >-
    drawing - the same view. The strip is 61.2 mm deep from the front edge; each arm is
    10.5 mm wide (body edge to 27.8 mm from the end of the 483) and meets the strip in a
    fillet read as 14 mm; the front corners are drawn 3 mm, which is below what one pixel
    resolves and is estimated.
  size-slots: >-
    drawing - the same view. Between each pair of rings, centred on the gap: two slots
    22.5 x 3 across the tray, 12 to 15 and 17.3 to 20.3 mm back from the front edge, and
    two slots 3 x 23.3 along it, 31.5 to 54.8 mm back and 3.75 mm either side of the gap's
    centre. Three of the eight long slots did not resolve in the raster and are placed by
    the symmetry the other five show.
  depth: >-
    estimated - 42, where the drawing gives 44 less 1.5 mm of sheet, 42.5. The viewer
    stops a well 2 mm short of the far face of a 44 mm envelope, and a part standing in
    the well is sunk by this figure and not by the clamped one, so anything over 42 would
    stand the rings below the floor that is drawn. The floor is 0.5 mm high as a result.
  color: >-
    estimated - FS states "Steel, Powder-coated Black". Every image of the part is a
    render, so the value is FS's render material and not a photograph of a finish.
size: {w: 448.4, h: 110, d: 42}
size-confidence: {w: drawing, h: drawing, d: estimated}
relief: {wall: '#1b1d20'}
elements:
  floor: {at: [0.0, 0.0], size: [448.4, 110], class: bezel}
skins: [default]
