format: 1
kind: component
name: fs-pdubk-lip-plan
version: 1.0.0
class: mechanical
description: >-
  One of the two lips of the FS FS-PDUBK PDU bracket seen from above or below. It is the short return that a
  long edge of the plate turns into, away from the side the flange is on. It runs the plate's whole length.
  An elevation only.
provenance:
  size: >-
    estimated - FS states no lip size. The return stands about 5 mm clear of the plate. It is scaled against the
    135 mm of the product page's dimensioned drawing. The hook at its end is about 3.8 mm there, and 5.6 mm in
    the photograph of the plate lying down; 5 is the middle. Two perspective photographs, solved against the
    plate's known 135 by 88.4, put the lip's bottom 4.6 to 5.1 mm below the plate's underside. The photographs
    show the lip along the whole of each long edge, so its length is the plate's 135.
size: {w: 5, h: 135}
size-confidence: {w: estimated, h: estimated}
elements:
  lip: {at: [0.0, 0.0], size: [5, 135], class: bezel}
skins: [default]
