format: 1
kind: component
name: uscmh-sfdabsb2u-base
version: 1.0.0
class: mechanical
description: >-
  The base of the FS USCMH-SFDABSB2U finger duct seen from the front - the full rack
  width of the moulding, drawn as the well the two rows of fingers stand in. Its floor is
  the front of the two base rails behind the finger rows; between them the channel runs
  on back to the mounting plate at the rear
provenance:
  size: >-
    drawing - FS Horizontal Single Sided Manager datasheet (USCMH-SFDABSB1U and -B2U),
    the CMH-SFDABSB2U drawings: the duct is 482.59 wide in the top view and 88.81 high in
    the front view, and both views draw it that wide over its whole depth, in front of
    the mounting plate.
  depth: >-
    drawing - 138.0, from the front of the cover to the front of the base rails. The side
    view is dimensioned 168.5 overall, at 3.436 px/mm along the depth from that
    dimension; on it the cover takes the first 17.5 mm and the finger walls run on to
    138.0, where the rails begin. Its vertical scale is its own (5.24 px/mm, from the
    84.33 and the 74.33 alike), so heights are read with that and never across.
  size-floor: >-
    drawing - the rails stand behind the two finger rows, 2.24 to 11.74 and 77.07 to
    86.57 down the face: the side view's finger walls are 84.33 overall, centred on the
    88.81, and 9.5 thick. Between them the side view draws no line from the cover back
    to the 74.33 mounting plate, so the floor is open there; the plate closes the rear.
size: {w: 482.6, h: 88.81, d: 138.0}
size-confidence: {w: drawing, h: drawing, d: drawing}
relief: {wall: '#232527'}
elements:
  floor: {at: [0.0, 2.24], size: [482.6, 84.33], class: bezel}
skins: [default]
