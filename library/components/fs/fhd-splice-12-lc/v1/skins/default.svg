<svg xmlns="http://www.w3.org/2000/svg" width="108.97mm" height="35.05mm" viewBox="0 0 108.97 35.05">
  <!-- FS FHD Fiber Splice Cassette, LC UPC, OS2, 12 Fibers (SKU 382907),
       108.97 x 35.05 - THE FACEPLATE SIZE IS BORROWED, THE ART IS INVENTED.
       No photograph of any of the eleven splice cassettes in FS's FHD
       catalogue exists in this corpus - see the contract's size-notes -
       so unlike fs/fhd-1mtp6lcd-os2-a@1's skin, this one draws no
       thumb-knobs, no logo and no legend: there is no render of this SKU to
       read any of that off, and inventing them would be worse than leaving
       them out.

       THE SIX LC CUTOUTS ARE NOT DRAWN HERE, for the same reason
       fs/fhd-1mtp6lcd-os2-a@1's are not: each composed
       common/lc-duplex-v-adapter@2 draws its own bezel and its own two port
       openings at its `at` position. -->
  <defs>
    <linearGradient id="bez" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4248"/>
      <stop offset="1" stop-color="#23272c"/>
    </linearGradient>
  </defs>
  <rect id="bezel" x="0" y="0" width="108.97" height="35.05" rx="1.5"
        fill="url(#bez)" stroke="#15181a" stroke-width="0.3"/>
</svg>
