description: >-
  The detachable steel cover of the FS CMH-SFDS2U finger duct, seen from the front - a flat
  plate on four hinge clips over the finger heads, opening upward or downward
provenance:
  size: >-
    drawing - the front view of CMH-SFDS2U in the FS High Capacity Horizontal Cable Managers
    datasheet (portal id 7671): 440 x 88 (88.03), with four clips about 23 square over its
    edges, at 75.0 and 341.8 on the top and 119.4 and 297.0 on the bottom.
  relief: >-
    estimated - the cover face sits at the front of the duct, 112.2 to 113.4 above the floor
    of the well: a 1.2 sheet, estimated, with the clips 0.6 proud of it.
  color: >-
    estimated - every render of #315743 shows the cover black.
  mark: >-
    renders - none. Neither the FS product renders nor the datasheet drawings show a
    mark on this cover, so no logo-zone is reserved.
