name: cmh-uhd-sfdabs3u-base
version: 1.0.0
class: mechanical
description: >-
  The back plate of the FS CMH-UHD-SFDABS3U finger duct seen from the front, between the ear
  ends, with its pass-through windows - drawn as the well the two finger walls stand in,
  its floor the front face of the plate
provenance:
  size: >-
    drawing - the FS CMH-UHD-SFDABS3U datasheet, 3.639 px/mm across the 482.6 and 3.645 down the 132.5 of the side view. The plate is 482.6 over the
    ears; the five finger blocks it carries take 443.4 between them, 19.6 in from each end,
    and that is the body. Its 132.5 is the plate on the side view and the specification
    table. The well is 172.4 deep: the 175 of the datasheet less the plate, whose
    2.6 is estimated - the plan draws it as two lines 10 px apart.
  size-holes: >-
    drawing - the rear view: three windows 140.1 x 94.4 with 10 mm corners on a 150.0 pitch, 19.0 from the top edge; 140.0 x 94.1, the HD 3U figure, is taken, the same window in the same plate. The plate is symmetric, so the front view of
    it is the rear view as drawn. Each window is a hole in the floor.
size: {w: 443.4, h: 132.5, d: 172.4}
size-confidence: {w: drawing, h: drawing, d: drawing}
