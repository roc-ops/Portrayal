format: 1
kind: component
name: cmh-4drb1u-end
version: 1.0.0
class: mechanical
description: >-
  One end wall of the FS CMH-4DRB1U recessed cable manager seen from the side - the
  sheet that carries the panel back from the ear's fold to where it is recessed, with
  a large obround pass-through hole - drawn as the well that builds it one sheet in
  from the side of the envelope
provenance:
  size: >-
    estimated - no document dimensions it. 44 high, the panel's height. 42 deep: FS's
    front render (gallery image 2) is taken from above, so a point further back stands
    higher in the frame, and the panel's top and bottom edges stand 49 and 62 px above
    the ears' against 1.33 px per mm of depth, which the rings' own 76 and 88 mm arms
    set in the same frame. So the panel is about 42 mm behind the rail, and the wall
    runs from the rail to the panel.
  size-hole: >-
    estimated - the three-quarter renders (gallery images 1 and 4) show each end wall
    with an upright obround hole about 0.6 of the wall's depth and 0.7 of its height,
    open: 24 x 32 here, centred. The CMH-4DRB1U datasheet counts seven pass-through
    holes, which are these two and the panel's five windows.
  depth: >-
    datasheet - the CMH-4DRB1U is 0.05 in [1.2 mm] steel on its drawing, and the wall
    is built one sheet in from the side of the envelope.
  color: >-
    estimated - FS states "Steel, Powder-coated Black". Every image of the part is a
    render.
size: {w: 42, h: 44, d: 1.2}
size-confidence: {w: estimated, h: drawing, d: drawing}
relief: {wall: '#1b1d20'}
elements:
  wall: {at: [0.0, 0.0], size: [42, 44], class: bezel}
skins: [default]
