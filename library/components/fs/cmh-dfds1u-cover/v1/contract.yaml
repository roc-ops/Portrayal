class: mechanical
behaviour: mounts
description: >-
  A detachable steel cover of the FS CMH-DFDS1U finger duct, seen from outside - a flat
  plate on four hinge clips over the finger heads of one channel, taller than the rack unit;
  the front and rear channel each take one
provenance:
  size: >-
    drawing - the front view of CMH-DFDS1U in the FS High Capacity Horizontal Cable Managers
    datasheet (portal id 7671): 440 x 57.8 (57.81), with four clips about 23 square over its
    edges, at 77.9 and 343.6 on the top and 121.4 and 300.0 on the bottom.
  relief: >-
    estimated - the cover face sits at the outside of its channel, 112.9 to 114.1 above the
    floor of the well: a 1.2 sheet, estimated, with the clips 0.6 proud of it.
  color: >-
    estimated - every render of #315741 shows the covers black.
  mark: >-
    drawing - FS renders its round logo mark on the cover near the left end. A vendor
    mark is never drawn, and nothing is reserved for it.
