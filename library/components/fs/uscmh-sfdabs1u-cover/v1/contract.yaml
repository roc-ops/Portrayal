format: 1
kind: component
name: uscmh-sfdabs1u-cover
version: 1.0.0
class: mechanical
behaviour: mounts
description: >-
  The hinged cover of the FS USCMH-SFDABS1U finger duct, seen from the front - an ABS
  channel whose curved face closes the duct and whose two edges hinge and clip on the
  finger tips, so that it opens upward or downward or lifts off
provenance:
  size: >-
    drawing - the front view of USCMH-SFDABS1U in the FS 1&2RU Horizontal Single Sided Manager datasheet draws the cover over the duct
    between the ear folds, 436.3 wide, and 44.3 high.
  relief: >-
    drawing - the cover takes the first 12.37 mm of the 61.46 the duct stands in front
    of the plane of the ears; it is placed in the well, so its face stands 59.76 to
    61.26 above the floor and its edges 48.89 to 61.26. The face is 1.5 thick and the
    edges 1.5 high, both estimated. THE FACE IS CURVED, a few millimetres proud at the
    middle of the height in the side views and the renders; it is drawn flat.
  color: >-
    estimated - "Color: Black" in the datasheet table; every image FS publishes of the
    part is a render, and the cover is drawn a shade lighter than the duct.
  mark: >-
    drawing - FS renders a round mark on the cover near its left end. A vendor mark is
    never drawn, and nothing is reserved for it.
size: {w: 436.3, h: 44.3}
size-confidence: {w: drawing, h: drawing}
attrs: {material: ABS}
