  plate: {at: [0.0, 0.0], size: [436.3, 44.3], class: bezel}
  lip-top: {at: [0.0, 0.0], size: [436.3, 1.5], class: bezel}
  lip-bottom: {at: [0.0, 42.8], size: [436.3, 1.5], class: bezel}
