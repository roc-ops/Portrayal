format: 1
kind: component
name: vra1001-ring
version: 1.0.0
class: mechanical
description: >-
  A D ring of the Vertiv VRA1001 2U horizontal cable organizer seen from the front - a metal rod
  loop that stands out of the plate, 10 mm across and 80.9 mm high, closed here at its tip, held by
  two screws of its foot, with the opening a bundle runs through along the plate
provenance:
  size: >-
    estimated - no page states a ring dimension. Read off the guide's picture of VRA1001 (page 7) against the
    plate's 482.6 mm: four rings along the plate, the loop about as high as the plate less a margin
    (80.9 mm), 10 mm across with its foot; the rod is taken as 5 mm. Spaced evenly, 134.0 mm
    apart about the plate's middle (40.3, 174.3, 308.3 and 442.3 mm from the left end).
  relief: >-
    estimated - the loop stands 75 mm out of the plate's front face. Built as a frame of plates with
    square corners where the real loop is a rod bent to a D: a foot against the plate, a bar along the top
    and one along the bottom, and the closed end at the tip. The picture shows the end hooked and open; the
    format has no slit, so the loop is drawn closed and the opening is a named gap of the device.
    `out` is a distance from the plate, so a screw head that stands 1.5 mm proud of the 5 mm foot it sits on has an
    `out` of 6.5; the 1.5 mm head height is estimated, as the guide states none.
  guide: >-
    estimated - the clear opening inside the frame, seen looking along the plate, which is the run:
    70.9 mm high across the plate (the 80.9 less a rod each side) and 65 mm out of it.
  guide-depth: >-
    estimated - the loop is 10 mm across along the run.
  color: >-
    datasheet - "Color: Black" (VR Rack selection guide, publication SL-11367 (Vertiv), page 7). The picture is a render; the face is a lighter value
    than the plate so the ring reads against it, and the screw heads are the grey the picture shows.
