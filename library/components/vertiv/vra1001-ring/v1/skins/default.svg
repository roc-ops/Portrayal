<svg xmlns="http://www.w3.org/2000/svg" width="10mm" height="80.9mm" viewBox="0 0 10 80.9">
  <!-- one D ring from the front, end-on: the foot on the plate with its screws, the rod along its top
       and bottom, and the closed end at the tip, drawn lighter than the plate so it reads against it -->
  <rect id="back" x="0" y="0" width="10" height="80.9" fill="#40454c"/>
  <rect id="bar-top" x="0" y="0" width="10" height="5" fill="#40454c"/>
  <rect id="bar-bottom" x="0" y="75.9" width="10" height="5" fill="#40454c"/>
  <rect id="tip" x="0" y="0" width="5" height="80.9" fill="#40454c"/>
  <circle id="screw-1" cx="7.5" cy="22.225" r="1.5" fill="#9aa0a6"/>
  <circle id="screw-2" cx="7.5" cy="58.675" r="1.5" fill="#9aa0a6"/>
</svg>
