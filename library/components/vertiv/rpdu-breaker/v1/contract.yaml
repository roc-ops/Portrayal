format: 1
kind: component
name: rpdu-breaker
version: 1.0.0
class: breaker
profile: power
description: >-
  The branch breaker of a Vertiv PowerIT horizontal rack PDU.
  A rocker sits in a small recessed frame, with an arrow and an off mark printed beside it.
  The circuit's number is on a coloured tab above. Fixed to the PDU, not a plug-in part.
size: {w: 32.1, h: 34.5}
size-confidence: {w: photo-measured, h: photo-measured}
provenance:
  size: >-
    photo-measured - VP5N31A1 front photograph (vertiv-geist-switched-vp5n31a1_front.jpg, 1000 px), the body
    752 px across for the SKU page's 17 in (1.74 px per mm) and the face 71 px high for 1.72 in (1.65
    px per mm; the photograph looks slightly down on the face). The frame reads 56 px across and 32 px
    high, the rocker window 28 by 26 px, the tab 26 by 20 px. Good to about 1 mm.
  rating: >-
    NOT STATED. The two breakers' rating, poles and trip curve are in no held document, and the small
    print on the rocker cannot be read in the photograph. The contract carries no rating, so L27 and the
    power figures stand as the record.
  colour: >-
    photo-measured - the tab is the circuit's colour, a FIELD (`tab-color`), and its number a field
    (`number`). The rear photograph's green tab reads #177734 and the orange one #fb5311.
  print: >-
    photo - the rocker window carries ON and a bar; beside it a play-arrow mark and the off circle,
    printed in teal. They are drawn as marks, not as legible text.
fields:
  tab-color: {label: Tab colour, type: text, default: '#fb5311'}
  number: {label: Circuit number, type: text, default: '1'}
elements:
  rocker: {at: [2.3, 16.8], size: [16.0, 15.5], class: breaker, states: ['on', 'off']}
skins: [default]
