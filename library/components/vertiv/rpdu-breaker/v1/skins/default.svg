<svg xmlns="http://www.w3.org/2000/svg" width="32.1mm" height="34.5mm" viewBox="0 0 32.1 34.5">
  <!-- A Vertiv PowerIT PDU breaker: the numbered tab, the recessed frame, the rocker window with
       ON and a bar, and the arrow and off circle printed beside it. -->
  <rect id="frame" x="0" y="14.8" width="32.1" height="19.7" rx="0.6" fill="#232222" stroke="#3b3a3a" stroke-width="0.3"/>
  <rect id="rocker" x="2.3" y="16.8" width="16.0" height="15.5" rx="0.6" fill="#121212" stroke="#4a4a4a" stroke-width="0.3"/>
  <path id="tab" d="M 11.4 0 H 21.7 A 1.6 1.6 0 0 1 23.3 1.6 V 10.5 A 1.6 1.6 0 0 1 21.7 12.1 H 11.4 A 1.6 1.6 0 0 1 9.8 10.5 V 1.6 A 1.6 1.6 0 0 1 11.4 0 Z" fill="#fb5311" data-fill-from="tab-color"/>
  <g id="silkscreen" font-family="sans-serif" fill="#ffffff">
    <text x="16.55" y="9.4" font-size="8" font-weight="bold" text-anchor="middle" data-from="number">1</text>
    <text x="9.0" y="21.4" font-size="2.4" fill="#2fd6b4" text-anchor="middle">ON</text>
    <path d="M 9.0 22.6 V 26.6" stroke="#2fd6b4" stroke-width="0.4"/>
    <path d="M 21.0 22.8 L 21.0 26.0 L 23.4 24.4 Z" fill="#2fd6b4"/>
    <circle cx="28.2" cy="26.0" r="1.4" fill="none" stroke="#2fd6b4" stroke-width="0.4"/>
  </g>
</svg>
