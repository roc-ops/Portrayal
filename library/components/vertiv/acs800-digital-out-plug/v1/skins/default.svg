<svg xmlns="http://www.w3.org/2000/svg" width="16.0mm" height="5.6mm" viewBox="0 0 16.0 5.6">
  <!-- The conductor ends clamped in the DIGITAL OUT connector seen from the front, seated: four stripped ends at
       the connector's four pins. Shapes and colours are estimates. -->
  <rect id="body" x="0" y="0" width="16.0" height="5.6" rx="0.5" fill="#b9bec4" stroke="#5e656c" stroke-width="0.25"/>
  <g id="ends" fill="#d9dbdd" stroke="#5e656c" stroke-width="0.15">
    <rect x="1.4" y="1.0" width="2.2" height="3.6" rx="0.25"/>
    <rect x="5.2" y="1.0" width="2.2" height="3.6" rx="0.25"/>
    <rect x="9.0" y="1.0" width="2.2" height="3.6" rx="0.25"/>
    <rect x="12.8" y="1.0" width="2.2" height="3.6" rx="0.25"/>
  </g>
</svg>
