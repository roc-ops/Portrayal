format: 1
kind: component
name: acs8000-rocker
version: 1.0.0
class: button
profile: networking
description: >-
  Mains rocker switch of an Avocent ACS8000 console server, a small snap-in bezel set above each AC inlet on
  the front. The rocker is drawn as the front photographs show it, a ring at the left and a bar at the right.
size: {w: 15.6, h: 8.6}
size-confidence: {w: estimated, h: estimated}
provenance:
  size: >-
    estimated - read off the Vertiv Avocent ACS8000 dual-AC front photograph (800 x 600 pixels, 1.77 pixels per
    millimetre across the 438.2 mm body), where the bezel measures about 27.5 by 15 pixels. No document held
    dimensions the switch, so the figure is good to about 0.6 mm in width and rests on a photograph that looks
    slightly down on the face for its height. A dimensioned drawing of the front is wanted.
  rocker: >-
    estimated - the rocker fills the bezel less a 1 mm rim, as the photograph shows. The photograph is too small
    to say which end is raised, so the part is drawn flat and carries no `state` field and no relief.
  marks: >-
    photograph - the Vertiv Avocent ACS8000 front photographs print a ring at the left of the rocker and a bar
    at the right. Neither print is a position claim; the maker's documents state no switch convention.
elements:
  rocker: {at: [1.0, 1.0], size: [13.6, 6.6], class: button}
skins: [default]
