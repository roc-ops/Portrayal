<svg xmlns="http://www.w3.org/2000/svg" width="13.9mm" height="13.9mm" viewBox="0 0 13.9 13.9">
  <!-- A Vertiv Geist PDU thermal breaker: a dark ring, a grey push button and the rating, 15, printed on it. -->
  <circle id="ring" cx="6.95" cy="6.95" r="6.75" fill="#3d3c3a" stroke="#5a5955" stroke-width="0.3"/>
  <circle id="button" cx="6.95" cy="6.95" r="4.6" fill="#5c5b57" stroke="#2a2927" stroke-width="0.3"/>
  <g id="silkscreen" font-family="sans-serif" fill="#e6e5e0">
    <text id="rating" x="6.95" y="8.15" font-size="3.4" font-weight="bold" text-anchor="middle">15</text>
  </g>
</svg>
