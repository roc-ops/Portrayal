<svg xmlns="http://www.w3.org/2000/svg" width="27.5mm" height="26.4mm" viewBox="0 0 27.5 26.4">
  <!-- The cord bushing on the rear face of a Vertiv Geist basic horizontal PDU: a grey rounded plate with the cord's
       bore dark in it, and a small tab ring at the upper right. -->
  <rect id="bushing" x="0.2" y="0.2" width="27.1" height="26.0" rx="6.5" fill="#85847f" stroke="#9a9993" stroke-width="0.3"/>
  <rect id="cord" x="7.6" y="9.1" width="11.2" height="8.5" rx="1.2" fill="#0a0a09" stroke="#2a2a29" stroke-width="0.3"/>
  <circle id="tab" cx="24.6" cy="6.0" r="1.0" fill="none" stroke="#5f5e5a" stroke-width="0.4"/>
</svg>
