<svg xmlns="http://www.w3.org/2000/svg" width="16.0mm" height="5.6mm" viewBox="0 0 16.0 5.6">
  <!-- The four-pin DIGITAL OUT header, drawn along its length: a green housing and a dark opening over a clamp
       screw for each pin, about 3.8 mm apart. Shapes and colours are read off the maker's front photograph. -->
  <rect id="body" x="0" y="0" width="16.0" height="5.6" rx="0.5" fill="#9cc896" stroke="#5f8a5a" stroke-width="0.25"/>
  <g id="pins">
    <rect x="1.3" y="0.9" width="2.4" height="2.2" rx="0.2" fill="#1d2b1c"/>
    <rect x="5.1" y="0.9" width="2.4" height="2.2" rx="0.2" fill="#1d2b1c"/>
    <rect x="8.9" y="0.9" width="2.4" height="2.2" rx="0.2" fill="#1d2b1c"/>
    <rect x="12.7" y="0.9" width="2.4" height="2.2" rx="0.2" fill="#1d2b1c"/>
    <circle cx="2.5" cy="4.2" r="0.6" fill="#b9bec3" stroke="#6b7076" stroke-width="0.12"/>
    <circle cx="6.3" cy="4.2" r="0.6" fill="#b9bec3" stroke="#6b7076" stroke-width="0.12"/>
    <circle cx="10.1" cy="4.2" r="0.6" fill="#b9bec3" stroke="#6b7076" stroke-width="0.12"/>
    <circle cx="13.9" cy="4.2" r="0.6" fill="#b9bec3" stroke="#6b7076" stroke-width="0.12"/>
  </g>
</svg>
