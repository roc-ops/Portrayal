format: 1
kind: component
name: vra1000-panel
version: 1.0.0
class: mechanical
description: >-
  The steel plate of the Vertiv VRA1000 1U horizontal cable organizer seen from the front - one
  sheet the full width of the rack, its two ends the ears with two slots each, and three oval openings
  between the rings - drawn as the well the four D rings stand in, its floor the front face of the plate
provenance:
  size: >-
    estimated - the VR Rack selection guide, publication SL-11367 (Vertiv) gives the part as "1U horizontal cable organizer with metal D rings" and
    states no dimension. The width is the 19 in the guide names, 482.6 mm (EIA-310); the height is the unit
    pitch of EIA-310, 44.45 mm, for the "1U" of its name. Neither is a Vertiv figure.
  holes: >-
    estimated - the three oval openings are read off the guide's picture of VRA1000 (page 7),
    a raster of 198 x 117 px for the whole panel seen at an angle, against the 482.6 mm: 80 mm long
    and 24 mm high, centred midway between the rings (107.3, 241.3 and 375.3 mm from the left end) on
    the plate's middle line. The ear holes are two slots in each ear, 10.0 x 6.5 mm (the picture shows
    them wider than high; the size is estimated), 8.75 mm from the end (EIA-310, 465.1 mm between
    centres) and 6.35 mm from the plate's top and bottom edges (the outer holes of an EIA-310 unit), as the
    picture shows two in the ear it shows: one near its top and one near its bottom.
  depth: >-
    estimated - 75.0 from the ring tips to the plate's front face. No page states a depth for this part;
    the reach is scaled off the same picture and carries the error of the view angle. The sheet is taken
    as 1.5 mm.
  color: >-
    datasheet - "Color: Black" (VR Rack selection guide, publication SL-11367 (Vertiv), page 7). The picture is a render, so the shade is this
    library's render of black steel.
size: {w: 482.6, h: 44.45, d: 75.0}
size-confidence: {w: estimated, h: estimated, d: estimated}
relief: {wall: '#1b1d20'}
elements:
  floor: {at: [0.0, 0.0], size: [482.6, 44.45], class: bezel}
skins: [default]
