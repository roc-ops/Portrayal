    estimated - THE MECHANICAL DRAWING PLACES THE BLOCKS BUT DOES NOT SIZE THEM. Three blocks span about 178 mm along
    the strip (read to 10 mm), so 56.0 along is the pitch of 59.3 less a gap; 44.0 across is an estimate inside the 56
    mm strip.
  rating: >-
    datasheet - the technical specification lists (6) 20 A 2-pole J62-X0 breakers, 10 kAIC. Each block holds one
    breaker, read from the drawing.
  labels: >-
    drawing - each block carries two circuit labels, one for each mounting orientation. They are silkscreen of the
    device and not part of this contract.
  colour: >-
