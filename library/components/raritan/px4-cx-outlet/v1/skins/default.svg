<svg xmlns="http://www.w3.org/2000/svg" width="32.0mm" height="24.0mm" viewBox="0 0 32.0 24.0">
  <!-- A Raritan PX4 locking Cx outlet: a rounded recess, a C13-style nose and three contacts. Size and shape are estimates. -->
