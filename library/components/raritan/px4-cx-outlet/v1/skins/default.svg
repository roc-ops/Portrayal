  <rect id="recess" x="0" y="0" width="32.0" height="24.0" rx="4.5" fill="#0b0c0d" stroke="#3a3c3f" stroke-width="0.25"/>
  <g id="nose">
    <path d="M 5.85 19.5 L 5.85 9.5 L 10.63 9.5 L 10.63 5 L 21.37 5 L 21.37 9.5 L 26.15 9.5 L 26.15 19.5 Z" fill="#26282a" stroke="#45484c" stroke-width="0.2"/>
    <rect x="7.44" y="12" width="4" height="5" fill="#030303"/>
    <rect x="20.31" y="12" width="4" height="5" fill="#030303"/>
    <rect x="13.4" y="7" width="4.9" height="4" fill="#030303"/>
  </g>
