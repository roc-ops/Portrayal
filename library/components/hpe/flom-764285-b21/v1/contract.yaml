description: >-
  HPE InfiniBand FDR/Ethernet 10Gb/40Gb 2-port 544+FLR-QSFP FlexibleLOM
  adapter (544+FLR-QSFP; option 764285-B21, spare 764737-001) - the adapter
  the Gen10 ProLiant DL160's FlexibleLOM riser carries in place of slot 1
