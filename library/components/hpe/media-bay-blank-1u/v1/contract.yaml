format: 1
kind: module
name: media-bay-blank-1u
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  HPE media bay blank for the Gen10 ProLiant DL160 8 SFF front - the vented
  cover over the bay the optical drive cage or the two-bay SFF drive cage
  otherwise fills
provenance:
  sources: >-
    DL160 Gen10 User Guide a00066666en_us, 'Front panel components', Eight-bay
    SFF model: item 4 'Media bay blank', with the note that the media bay
    supports the optical drive cage or the 2 SFF drive cage option; the front
    elevation (native figure GUID-55DF0433) draws it.
  size: >-
    drawing - The 8 SFF elevations (native figures GUID-7FDCEC9A and
    GUID-55DF0433) put the media bay over drive columns 4 and 5: x 246.2..407.5
    of the 434.6 body (see hpe/sff-sc-carrier@1 for the 1.362 px/mm the body
    gives), and one drive row tall, 15.2. The drawing is 6% stretched
    vertically, so the height is a fraction of the body, not a measurement.
  face: >-
    drawing - Three rows of rectangular vents across almost the whole face, as
    the elevation draws them: 22 columns on a 7.0 pitch, each 5.6 x 2.8, rows on
    a 3.9 pitch from 2.4 down. The count is the drawing's at 1.36 px/mm and is
    an illustration rather than a measurement.
  depth: >-
    estimated - NOT KNOWN; drawn as a filler plate.
size: {w: 161.3, h: 15.2}
size-confidence: {w: drawing, h: drawing}
elements:
  vents: {at: [3.6, 2.4], size: [152.6, 10.6], class: vent}
skins: [default]
