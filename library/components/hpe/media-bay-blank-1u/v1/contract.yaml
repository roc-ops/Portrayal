format: 1
kind: module
name: media-bay-blank-1u
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  HPE media bay blank for the Gen10 ProLiant DL160 8 SFF front - the vented
  cover over the bay the optical drive cage or the two-bay SFF drive cage
  otherwise fills, running from the top of the face down to the drive row
  beneath it
provenance:
  sources: >-
    HPE's straight-on product image of the DL160 Gen10 8 SFF front, as hosted by
    Express Computer Systems (expresscomputersystems.com/cdn/shop/files/dl1
    60-gen10-drive-8sff_1835d8c9-1c70-466f-aed1-349e0d74a3b8.jpg, staged as
    photos/ecs-dl160g10-8sff-front-ORTHO-1080sq.jpg under
    working/intake/hpe/proliant/dl160-gen10); see hpe/sff-sc-carrier@1 for the
    panel gate on that image (2.177 x 2.168 px/mm, 0.4% apart). DL160 Gen10 User
    Guide a00066666en_us, 'Front panel components', Eight-bay SFF model: item 4
    'Media bay blank', with the note that the media bay supports the optical
    drive cage or the 2 SFF drive cage option.
  size: >-
    photo-measured - x 600..955 px and y 20..68 px on the image: 163.1 x 22.1,
    over drive columns 4 and 5. It is taller than a drive row - it takes in the
    top strip as well - which the User Guide's line elevation, the first source
    for this part, drew as one drive row (15.2).
  face: >-
    photo-measured - Four rows of rectangular vents, 5.5 x 2.8 on a 6.7 pitch
    across and 4.15 down, 22 columns from 9.2 along and 4.6 down. The first
    drawing of this part had three rows, from the elevation at 1.36 px/mm.
  depth: >-
    estimated - NOT KNOWN; drawn as a filler plate.
size: {w: 163.1, h: 22.1}
size-confidence: {w: photo-measured, h: photo-measured}
elements:
  vents: {at: [9.2, 4.6], size: [146.2, 15.3], class: vent}
skins: [default]
