format: 1
kind: component
name: info-pull-tab-slim
version: 1.0.0
class: tab
behaviour: fills
profile: server
description: >-
  The serial number / iLO information pull tab of the Gen10 ProLiant DL160 8
  SFF front - a slim black tab lying in the strip above the drives, printed
  with an information mark between two bars
provenance:
  sources: >-
    HPE's straight-on product image of the DL160 Gen10 8 SFF front, as hosted by
    Express Computer Systems (expresscomputersystems.com/cdn/shop/files/dl1
    60-gen10-drive-8sff_1835d8c9-1c70-466f-aed1-349e0d74a3b8.jpg, staged as
    photos/ecs-dl160g10-8sff-front-ORTHO-1080sq.jpg under
    working/intake/hpe/proliant/dl160-gen10); see hpe/sff-sc-carrier@1 for the
    panel gate on that image (2.177 x 2.168 px/mm, 0.4% apart). DL160 Gen10 User
    Guide a00066666en_us, 'Front panel components', Eight-bay SFF model, item 1,
    and its footnote: the tab is printed on both sides, the serial number and
    customer asset tag on one and the default iLO account on the other.
  size: >-
    photo-measured - x 475..548 px and y 19..31 px on the image: 33.5 x 5.4,
    above drive column 3. The printed bars are at 5.5..13.8 and 21.6..30.8 along
    it and the boxed 'i' at 16.1..19.3, 3.6 down. The 4 LFF front's tab
    (hpe/info-pull-tab@1) is the same label under a deeper finger grip and does
    not fit this strip.
size: {w: 33.5, h: 5.4}
size-confidence: {w: photo-measured, h: photo-measured}
elements:
  tab: {at: [0.0, 0.6], size: [33.5, 4.8], class: label}
skins: [default]
