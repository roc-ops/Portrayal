  - node: latch-left
    out: 12.0
    color: '#b3b9bf'
    confidence: estimated
    source: >-
      the latch housing a bracket's flange lands in. The User Guide's
      'Installing an expansion board' figures close a latch over the flange at
      the cage's outer end, PartSurfer's photograph of the cage (878538-001)
      shows a blue latch at each end of its rear edge, and a reseller's close-up
      of the rear (2beshop, staged) shows the housing standing proud of the rear
      wall beside slot 2. HOW FAR is not measured: 12 is drawn because a
      bracket's folded flange is 9.40 proud (PCIe CEM 5.0 figure 11-9) and is
      inside the housing, not sticking out of the rear wall as it did before
      this feature existed
