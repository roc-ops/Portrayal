description: >-
  HPE Ethernet 10/25Gb 2-port 631FLR-SFP28 FlexibleLOM adapter (631FLR-SFP28;
  option 817709-B21, spare 840133-001) - the adapter the Gen10 ProLiant
  DL160's FlexibleLOM riser carries in place of slot 1
attrs:
  ports: 2
  media: sfp28
  part-numbers: 817709-B21 840133-001
  spare-part: 840133-001
  hpe-model: 631FLR-SFP28
  controller: BCM57414
  sfp28: 2
groups:
  ports:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
provenance:
  sources: >-
    QuickSpecs a00021860enw, FlexibleLOM adapters: 817709-B21 ('FlexibleLOM
    Riser Kit (875748-B21) is required to install these adapters'; 'Only one
    FlexibleLOM can be added to the server'). The QuickSpecs names the adapter
    by its controller; the name 631FLR-SFP28 is the Product Information
    Reference's (a00077132en_us) and HPE PartSurfer's, which also gives the
    spare 840133-001 (partsurfer.hpe.com/Search.aspx?SearchText=817709-B21). A
    seller's photograph of a 631FLR-SFP28 from the port end, from a little below
    and to the left, the whole plate in frame
    (serverorbit.com/images/detailed/92/817709-B21-HPE-25-Gbps-Adapter.jpeg, 800
    x 800), and PartSurfer's of the spare from above.
  size: >-
    borrowed - 74.0 x 14.6, hpe/flom-629135-b22@1, the adapter whose photograph
    the faceplate's length is read from; this part's own image does not measure
    it.
  face: >-
    photo-measured - the plate is 1810 px on the enlarged photograph: the screw
    4.7 from the left end; a three-by-three field of vents at 9.3..18.5,
    COUNTED; two lamps STACKED one above the other at 21.9, left of the cage;
    one 1x2 SFP28 cage at 26.2..55.2; two more stacked lamps at 58.7 with LINK
    printed beside the upper and ACT beside the lower; PORT 2 under the left
    cage and PORT 1 under the right. No vent field right of the cage. The left
    pair of lamps carries no legend the photograph shows; LINK above ACT is the
    right pair's order carried across. The photograph is not square to the
    camera, so these are good to about a millimetre. Positions are read as
    fractions of the plate, whose whole length the photograph shows, at the 74.0
    this family draws; by the cage or jacks it carries this photograph would put
    the plate between 74 and 76, which is the family's open question and not
    this part's.
  lamps: >-
    photo-measured - round lamps about 1 mm across, drawn with the library's 2
    mm dot; which is link and which activity is read off the legends the
    photograph shows. WHAT THEIR COLOURS AND FLASHES MEAN is in no document
    held. Green for link and flashing green for activity is the convention, not
    a reading.
  way-up: >-
    The adapter lies component side up, its screw end at the left as the User
    Guide's figure fits it into the cage; the photographs are taken the same way
    up.
  power: >-
    NOT STATED for the adapter in any document held; lint's L27 stands as the
    record.
  depth: >-
    estimated - 110. No dimension of the adapter is in any document held; it is
    the board's reach behind the faceplate by proportion on the photographs.
size: {w: 74.0, h: 14.6, d: 110.0}
