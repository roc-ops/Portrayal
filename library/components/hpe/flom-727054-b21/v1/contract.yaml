  - {ref: std/sfp@1, id: port-1, group: ports, at: [42.35, 2.6], attrs: {media: sfp-plus, speed: 10g}}
  - {ref: common/led-dot@1, id: led-2-lnk, group: port-leds, at: [13.7, 9.4], states: {lamp: ['off', {name: link, color: '#22c55e'}]}}
  - {ref: common/led-dot@1, id: led-2-act, group: port-leds, at: [16.9, 9.4], states: {lamp: ['off', {name: activity, color: '#22c55e', behavior: blinking}]}}
  - {ref: common/led-dot@1, id: led-1-lnk, group: port-leds, at: [35.5, 9.4], states: {lamp: ['off', {name: link, color: '#22c55e'}]}}
  - {ref: common/led-dot@1, id: led-1-act, group: port-leds, at: [38.8, 9.4], states: {lamp: ['off', {name: activity, color: '#22c55e', behavior: blinking}]}}
