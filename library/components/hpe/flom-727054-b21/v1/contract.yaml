version: 1.0.0
class: nic
behaviour: fills
profile: server
description: >-
  HPE Ethernet 10Gb 2-port 562FLR-SFP+ FlexibleLOM adapter (562FLR-SFP+;
  option 727054-B21, spare 790317-001) - the adapter the Gen10 ProLiant
  DL160's FlexibleLOM riser carries in place of slot 1
attrs:
  ports: 2
  media: sfp-plus
  part-numbers: 727054-B21 790317-001
  spare-part: 790317-001
  hpe-model: 562FLR-SFP+
  controller: X710-DA2
  sfp-plus: 2
groups:
  ports:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
provenance:
  sources: >-
    Product Information Reference a00077132en_us, FlexibleLOM adapters:
    727054-B21, 562FLR-SFP+. THE QUICKSPECS DOES NOT LIST THIS ADAPTER for the
    DL160 Gen10; the reference does. QuickSpecs a00021860enw on any FlexibleLOM
    ('FlexibleLOM Riser Kit (875748-B21) is required to install these adapters';
    'Only one FlexibleLOM can be added to the server'). The QuickSpecs names the
    adapter by its controller; the name 562FLR-SFP+ is the Product Information
    Reference's (a00077132en_us) and HPE PartSurfer's, which also gives the
    spare 790317-001 (partsurfer.hpe.com/Search.aspx?SearchText=727054-B21). A
    reseller's photograph of a 562FLR-SFP+ from the port end, face-on, the whole
    plate in frame
    (serverorbit.com/images/detailed/300/HPE-727054-B21-10GB-2Ports-562FLR-SFP-
    Adapter.jpg, 800 x 800).
  size: >-
    borrowed - 74.0 x 14.6, hpe/flom-629135-b22@1, the adapter whose photograph
    the faceplate's length is read from; this part's own image does not measure
    it.
  face: >-
    photo-measured - the plate is 1830 px on the enlarged photograph: the screw
    4.7 from the left end; a three-by-two field of vents at 8.8..21.8, counted;
    lamps at 11.5 and 18.4; one 1x2 SFP+ cage at 22.6..52.0; a four-by-two field
    at 52.8..71.6 with lamps at 55.4 and 61.7. IT MEASURES AS THE 534FLR-SFP+
    DOES, each read from its own photograph, to within 0.2 mm. THE LEGENDS ARE
    NOT READ: on this photograph they are too pale to resolve, and ACT LINK, P2,
    P1, LINK ACT are hpe/flom-700751-b21@1's, drawn here because every other
    feature of the two plates agrees. Positions are read as fractions of the
    plate, whose whole length the photograph shows, at the 74.0 this family
    draws; by the cage or jacks it carries this photograph would put the plate
    between 74 and 76, which is the family's open question and not this part's.
  lamps: >-
    photo-measured - round lamps about 1 mm across, drawn with the library's 2
    mm dot; which is link and which activity is read off the legends the
    photograph shows. WHAT THEIR COLOURS AND FLASHES MEAN is in no document
    held. Green for link and flashing green for activity is the convention, not
    a reading.
  way-up: >-
    The adapter lies component side up, its screw end at the left as the User
    Guide's figure fits it into the cage; the photographs are taken the same way
    up.
  power: >-
    NOT STATED for the adapter in any document held; lint's L27 stands as the
    record.
  depth: >-
    estimated - 110. No dimension of the adapter is in any document held; it is
    the board's reach behind the faceplate by proportion on the photographs.
size: {w: 74.0, h: 14.6, d: 110.0}
