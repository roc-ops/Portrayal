  - {ref: common/rj45-ganged-eth@1, id: port-3, group: ports, at: [23.66, 2.9], rotate: 180, attrs: {media: rj45, speed: 1g}}
  - {ref: common/rj45-ganged-eth@1, id: port-2, group: ports, at: [37.62, 2.9], rotate: 180, attrs: {media: rj45, speed: 1g}}
  - {ref: common/rj45-ganged-eth@1, id: port-1, group: ports, at: [51.6, 2.9], rotate: 180, attrs: {media: rj45, speed: 1g}}
