format: 1
kind: module
name: sff-blank
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  HPE SFF drive blank for the Gen10 ProLiant DL160's 2.5 inch front bays,
  lying flat - a black moulding with a vented centre and no lamps
attrs:
  form-factor: 2.5in
provenance:
  size: >-
    photo-measured - the same 76.2 x 15.0 as hpe/sff-sc-carrier@1, whose
    provenance carries the measurement off HPE's straight-on 8 SFF product
    image: a blank fills the same opening.
  face: >-
    estimated - NOT MEASURED. No image held shows an HPE SFF blank straight on:
    the StorageReview front (photos/storagereview-dl160-front-8sff-angled-
    1500x420.jpg) shows four blanks in an 8 SFF unit from above, dark, with a
    vented centre panel, which is what this draws; positions are a reading of
    that angled image and are not measurements. The QuickSpecs sells the blank
    as "HPE Small Form Factor Hard Drive Blank Kit" 666987-B21.
  depth: >-
    estimated - NOT IN THE INTAKE; 25.0 is drawn as a filler, as common/drive-
    blank-25@2 does.
size: {w: 76.2, h: 15.0, d: 25.0}
size-confidence: {w: photo-measured, h: photo-measured, d: estimated}
body: {depth: 25.0, color: '#1e2124'}
elements:
  vent: {at: [21.1, 3.5], size: [34.0, 8.0], class: vent}
skins: [default]
