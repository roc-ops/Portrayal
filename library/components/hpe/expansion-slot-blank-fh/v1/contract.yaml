format: 1
kind: module
name: expansion-slot-blank-fh
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  HPE full-height expansion slot blank of the Gen10 ProLiant DL160's primary
  riser, lying flat - the part of it slot 1's window shows, a sixteen-by-three
  field of rectangular vents
provenance:
  sources: >-
    The straight-on rear photograph in newserverlife's DL160 Gen10 review
    (newserverlife.com/upload/iblock/386/8_opt.jpeg), 2.90 x 2.87 px/mm; see
    hpe/psu-865408-b21@1 for the panel gate on that image. User Guide
    a00066666en_us, 'Removing the expansion slot blank'.
  size: >-
    registry - 120.02 x 21.59, THE WHOLE BRACKET (std/pcie-bracket-fh@2, PCIe
    CEM 5.0), drawn tip-left as the standard part is, so a slot turned over
    seats it as it seats a card. It was first drawn at the size of the window
    the cage shows, and then no card fitted the slot; a photograph gives the
    opening, not the bracket.
  face: >-
    photo-measured - Sixteen columns of three vents, 4.2 x 2.4 on a 5.5 x 3.45
    pitch, COUNTED on three pixel rows of the photograph (16 dark runs on each,
    28.6..114.8 on the rear); a first drawing had seventeen. The plate runs from
    8.5 to the flange end, as far as the window shows it. The field is centred
    on the plate's height and placed along it so that it lands on the
    photograph's vents in the slot it was measured in.
  depth: >-
    estimated - NOT KNOWN; drawn as a plate.
size: {w: 120.02, h: 21.59}
size-confidence: {w: registry, h: registry}
elements:
  vents: {at: [11.5, 7.74], size: [88, 9.3], class: vent}
skins: [default]
