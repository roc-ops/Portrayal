format: 1
kind: module
name: expansion-slot-blank-fh
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  HPE full-height expansion slot blank in the Gen10 ProLiant DL160's primary
  riser, lying flat at the rear as slot 1 - a bright plate with a seventeen-
  by-three field of rectangular vents and a finer row of slots along its
  lower edge
provenance:
  sources: >-
    The straight-on rear photograph in newserverlife's DL160 Gen10 review
    (newserverlife.com/upload/iblock/386/8_opt.jpeg, staged as photos/nsl-
    dl160g10-rear-ORTHO-1280x145.jpg under
    working/intake/hpe/proliant/dl160-gen10); see hpe/psu-865408-b21@1 for the
    panel gate on that image (2.90 x 2.87 px/mm, 1.2% apart). User Guide
    a00066666en_us, 'Rear panel components' item 1 (PCIe slot 1 or FlexibleLOM
    adapter) and 'Removing the expansion slot blank'.
  size: >-
    photo-measured - The window of riser slot 1 as the rear photograph shows it,
    x 55..372 px and y 15..82 px: 109.3 x 23.3. That is the cage's opening, not
    the bracket: a full-height bracket is 120.02 long (std/pcie-bracket-fh@2)
    and its ends sit under the riser cage.
  face: >-
    photo-measured - Seventeen columns of three vents, 4.3 x 2.4 on a 5.5 x 3.45
    pitch, the field starting 12.8 from the window's left end and 5.6 from its
    top; a row of small slots, 1.8 wide on a 3.0 pitch, 20.9..23.0 down. Counts
    are the photograph's; the positions are read to about a millimetre.
  depth: >-
    estimated - NOT KNOWN; drawn as a plate.
size: {w: 109.3, h: 23.3}
size-confidence: {w: photo-measured, h: photo-measured}
elements:
  vents: {at: [12.8, 5.6], size: [92.3, 9.3], class: vent}
skins: [default]
