name: serial-port-blank
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  HPE serial port blank on the Gen10 ProLiant DL160's rear, covering the
  opening the optional serial port cable kit fills - a pale plate with two
  screw holes and two rows of seven slots
provenance:
  sources: >-
    The straight-on rear photograph in newserverlife's DL160 Gen10 review
    (newserverlife.com/upload/iblock/386/8_opt.jpeg, staged as photos/nsl-
    dl160g10-rear-ORTHO-1280x145.jpg under
    working/intake/hpe/proliant/dl160-gen10); see hpe/psu-865408-b21@1 for the
    panel gate on that image (2.90 x 2.87 px/mm, 1.2% apart). User Guide
    a00066666en_us, 'Rear panel components' item 6, 'Serial port (optional)',
    and 'Installing the serial port'.
  size: >-
    photo-measured - x 645..740 px and y 90..122 px on the rear photograph: 32.8
    x 11.2.
  face: >-
    photo-measured - Screw holes 2.4 across at (3.8, 4.9) and (28.6, 4.9); two
    rows of seven slots, 1.4 x 2.6 on a 2.6 x 4.2 pitch, between them. The IOIOI
    legend above the plate is chassis silkscreen and lives on the device.
  depth: >-
    estimated - NOT KNOWN; drawn as a plate.
size: {w: 32.8, h: 11.2}
