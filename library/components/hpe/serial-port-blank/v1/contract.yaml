format: 1
kind: module
name: serial-port-blank
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  HPE serial port blank on the Gen10 ProLiant DL160's rear, covering the
  opening the optional serial port fills - a pale plate with two screw holes
  and two rows of seven slots
provenance:
  sources: >-
    The straight-on rear photograph in newserverlife's DL160 Gen10 review
    (newserverlife.com/upload/iblock/386/8_opt.jpeg), 2.90 x 2.87 px/mm; see
    hpe/psu-865408-b21@1 for the panel gate on that image. User Guide
    a00066666en_us, 'Rear panel components' item 6, 'Serial port (optional)',
    and 'Installing the serial port'.
  size: >-
    photo-measured - 32.8 x 12.5: the plate measures 32.8 x 11.2 (x 645..740 px,
    y 90..122 px) and the opening takes a DE-9 with its jackscrews, 12.5 tall
    (common/db9-receptacle@1). The plate's two screw holes are 24.8 apart, a
    DE-9's jackscrew spacing (24.99), which is what says the opening is that
    connector's.
  face: >-
    photo-measured - screw holes 2.4 across at (3.8, 5.5) and (28.6, 5.5); two
    rows of seven slots, 1.4 x 2.6 on a 2.6 x 4.2 pitch, between them. The IOIOI
    legend above the plate is chassis silkscreen and lives on the device.
  depth: >-
    estimated - NOT KNOWN; drawn as a plate.
size: {w: 32.8, h: 12.5}
size-confidence: {w: photo-measured, h: photo-measured}
elements:
  vents: {at: [7.9, 3.2], size: [17.0, 6.8], class: vent}
skins: [default]
