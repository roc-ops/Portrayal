name: flom-817745-b21
version: 1.0.0
class: nic
behaviour: fills
profile: server
description: >-
  HPE Ethernet 10Gb 2-port 562FLR-T FlexibleLOM adapter (562FLR-T; option
  817745-B21, spare 840138-001) - the adapter the Gen10 ProLiant DL160's
  FlexibleLOM riser carries in place of slot 1
attrs:
  ports: 2
  media: rj45
  part-numbers: 817745-B21 840138-001
  spare-part: 840138-001
  hpe-model: 562FLR-T
  controller: X550-AT2
groups:
  ports:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 10g}
provenance:
  sources: >-
    QuickSpecs a00021860enw, FlexibleLOM adapters: 817745-B21 ('FlexibleLOM
    Riser Kit (875748-B21) is required to install these adapters'; 'Only one
    FlexibleLOM can be added to the server'). The QuickSpecs names the adapter
    by its controller. The name 562FLR-T is the Product Information Reference's
    (a00077132en_us) and HPE PartSurfer's, which also gives the spare 840138-001
    (partsurfer.hpe.com/Search.aspx?SearchText=817745-B21). A reseller's
    photograph of a 562FLR-T from the port end, face-on
    (serversupply.com/images/mproductimages/316774_2.jpg, 800 x 496), and
    PartSurfer's of the spare.
  size: >-
    borrowed - 74.0 x 14.6, hpe/flom-629135-b22@1, the adapter whose photograph
    the faceplate's length is read from; this part's own image does not measure
    it.
  face: >-
    photo-measured - on the face-on photograph the plate is 157..588, 432 px for
    the 74.0 (5.84 px/mm): the screw 4.5 from the left end; a three-by-three
    field of vents at 8.9..18.2, each 2.4 x 1.5 on a 3.4 x 2.6 pitch, COUNTED
    three columns and three rows; two separate shielded jacks centred 29.2 and
    50.8, their shields 19.0 wide and their latch notches down; P2 printed under
    the vents, left of the left jack; ONE column of three vents at 62.2..64.6,
    right of the right jack, with P1 under it. A first version wrote the plate
    as 388 px, drew the left field 2 mm short and the right field as two
    columns; all three were wrong against this photograph.
  lamps: >-
    photo-measured - a lamp window at each corner of each jack on the PIN side,
    away from the latch notch: counted, two per jack, on this adapter's
    photograph. The jack is common/rj45-eth-pinside@1, which carries its lamps
    there. A first version used common/rj45-eth@1, whose lamps are beside the
    notch, and drew them 9 mm low. WHICH LAMP IS LINK AND WHICH ACTIVITY IS NOT
    READ: the faceplate letters neither, and left link, right activity is the
    jack's convention. What the colours and flashes mean is in no document held.
  way-up: >-
    The adapter lies component side up, its screw end at the left as the User
    Guide's figure fits it into the cage; the photographs are taken the same way
    up.
  power: >-
    NOT STATED for the adapter in any document held; lint's L27 stands as the
    record.
  depth: >-
    estimated - 110. No dimension of the adapter is in any document held; it is
    the board's reach behind the faceplate by proportion on the photographs.
size: {w: 74.0, h: 14.6, d: 110.0}
size-confidence: {w: borrowed, h: borrowed, d: estimated}
