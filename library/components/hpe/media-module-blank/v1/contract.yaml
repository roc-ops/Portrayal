    working/intake/hpe/proliant/dl160-gen10); see hpe/psu-865408-b21@1 for the
    panel gate on that image (2.90 x 2.87 px/mm, 1.2% apart). User Guide
    a00066666en_us, 'Rear panel components' item 11, 'Media Module adapter
    (optional NIC ports 3-4)', and 'Installing the Media Module adapter'.
  size: >-
    photo-measured - x 50..178 px and y 93..127 px on the rear photograph: 44.1
    x 11.8.
  face: >-
    photo-measured - Eleven columns of three vents, 2.5 x 2.0 on a 3.5 x 3.15
    pitch, from 3.1 along and 2.8 down, across nearly the whole plate. The notch
    along the top edge is drawn; its outline is read off the photograph to about
    a millimetre.
  depth: >-
    estimated - NOT KNOWN; drawn as a plate.
