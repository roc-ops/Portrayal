format: 1
kind: module
name: media-module-blank
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  HPE Media Module adapter blank for the Gen10 ProLiant DL160's rear media
  module opening - a bright plate notched along its top edge with a three-row
  vent field
provenance:
  sources: >-
    The straight-on rear photograph in newserverlife's DL160 Gen10 review
    (newserverlife.com/upload/iblock/386/8_opt.jpeg), 2.90 x 2.87 px/mm; see
    hpe/psu-865408-b21@1 for the panel gate on that image. User Guide
    a00066666en_us, 'Rear panel components' item 11 and 'Installing the Media
    Module adapter' (native figure GUID-2A6F9DBD shows the blank coming out of
    the opening).
  size: >-
    photo-measured - 45.0 x 13.4 is the OPENING the blank sits in: the plate
    itself measures 44.1 x 11.8 (x 50..178 px, y 93..127 px), and the opening
    has to pass the adapter's RJ45 jacks, which stand as tall as the embedded
    NIC's beside it (26.5..39.7 on the rear). The first drawing made the bay the
    plate's size, and nothing but the plate fitted.
  face: >-
    photo-measured - the plate at 0.45, 1.3 in the opening; eleven columns of
    three vents, 2.5 x 2.0 on a 3.5 x 3.15 pitch, across nearly the whole plate.
    The notch along the top edge is drawn; its outline is read to about a
    millimetre.
  depth: >-
    estimated - NOT KNOWN; drawn as a plate.
size: {w: 45.0, h: 13.4}
size-confidence: {w: photo-measured, h: photo-measured}
elements:
  vents: {at: [3.55, 4.1], size: [37.5, 8.3], class: vent}
skins: [default]
