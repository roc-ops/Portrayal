<svg xmlns="http://www.w3.org/2000/svg" width="76.2mm" height="15.0mm" viewBox="0 0 76.2 15.0">
  <!-- HPE SmartCarrier, 2.5 inch, lying flat. Original art from positions measured on a straight-on product image. -->
  <rect id="body" x="0.15" y="0.15" width="75.9" height="14.7" rx="0.6" fill="#2b2f33" stroke="#16191c" stroke-width="0.3"/>
  <rect id="label" x="2.3" y="2.3" width="7.3" height="10.2" rx="1" fill="#3a3f44" stroke="#1e2124" stroke-width="0.25"/>
  <g id="silkscreen" font-family="sans-serif" fill="#e7ebee" text-anchor="middle"><text data-from="rpm" x="5.95" y="5.1" font-size="1.7" font-weight="bold">10K</text><text data-from="interface" x="5.95" y="7.2" font-size="1.3">SAS</text><text data-from="capacity" x="5.0" y="9.6" font-size="1.4" font-weight="bold">300</text><text data-from="capacity-unit" x="7.7" y="9.6" font-size="1.0">GB</text></g>
  <path d="M10.6 3.6 H38.6 L40.4 5.4 V10.4 L38.6 12.2 H10.6 Z" fill="#4a4f55" stroke="#1e2124" stroke-width="0.3"/>
  <rect x="12" y="12.6" width="27" height="1.3" rx="0.5" fill="#101214"/>
  <rect id="lamp-locate" x="14.0" y="1.0" width="24.0" height="1.3" rx="0.6" fill="var(--led-color, #101214)"/>
  <circle cx="46.4" cy="7.4" r="6.1" fill="#3a3f44" stroke="#1e2124" stroke-width="0.3"/>
  <circle id="lamp-activity" cx="46.4" cy="7.4" r="4.7" fill="none" stroke="var(--led-color, #2f8f3d)" stroke-width="1.2"/>
  <circle cx="46.4" cy="7.4" r="3.4" fill="#14171a"/>
  <circle id="lamp-status" cx="46.4" cy="7.4" r="1.85" fill="var(--led-color, #3fae4d)"/>
  <rect x="58.8" y="0.9" width="16.1" height="13.2" rx="0.6" fill="#3a3f44" stroke="#1e2124" stroke-width="0.3"/>
  <rect id="release" x="62.0" y="1.8" width="7.4" height="10.7" rx="0.5" fill="var(--led-color, #b8545a)" stroke="#5c2327" stroke-width="0.35"/>
</svg>
