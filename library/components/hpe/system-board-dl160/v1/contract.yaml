format: 1
kind: component
name: system-board-dl160
version: 1.0.0
class: mechanical
profile: server
description: >-
  The Gen10 ProLiant DL160 system board seen from above - the PCB the
  processors, memory, risers and supply connect to, drawn as the well its
  parts stand in, rear edge at the top
provenance:
  sources: >-
    The Internal View in HPE's QuickSpecs for the DL160 Gen10 (a00021860enw,
    page 3; the version 6 edition embeds it at 1171 x 728) - a photograph of the
    8 SFF server from above with its lid off, twenty-two callouts. Turned to the
    plan's orientation (rear at the top), the chassis is 576.5 px across for
    434.6 mm (1.3265 px/mm) and 845 px down for 614.9 (1.374 px/mm): 3.6% apart,
    so the photograph FAILS the panel gate - it is a camera above a box, not a
    drawing - and positions are taken as fractions on each axis separately. The
    User Guide's System board components figure (native figure GUID-944C6994)
    names what is on it.
  size: >-
    estimated - 426 x 393. On the photograph the board's copper runs from 2 mm
    inside the left wall to 4 mm inside the right, and from 3 mm behind the rear
    wall to the fan connectors along its front edge at 396 mm. Its outline is
    not a rectangle - the User Guide figure shows it stepped round the supply at
    the rear left and the I/O at the rear right - and the rectangle is the box
    round it.
  depth: >-
    estimated - 36, the height the parts on it may rise to under the lid: the
    chassis is 42.9 tall and the board stands on studs above the floor. No
    document held gives the stack.
  face: >-
    The processor sockets and the DIMM connectors are drawn as marks on the
    board where the photograph puts them; the two sockets carry P1 (right) and
    P2 (left) as the User Guide figure letters them.
size: {w: 426.0, h: 393.0, d: 36.0}
size-confidence: {w: estimated, h: estimated, d: estimated}
relief: {wall: '#1e2226', walls: inside}
elements:
  board: {at: [0.0, 0.0], size: [426.0, 393.0], class: bezel}
