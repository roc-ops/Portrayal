  - {ref: common/led-dot@1, id: led-2-lnk, group: port-leds, at: [17.4, 8.4], states: {lamp: ['off', {name: link, color: '#22c55e'}]}}
  - {ref: common/led-dot@1, id: led-1-lnk, group: port-leds, at: [54.4, 8.4], states: {lamp: ['off', {name: link, color: '#22c55e'}]}}
