provenance:
  sources: >-
    Product Information Reference a00077132en_us, FlexibleLOM adapters:
    867334-B21, 622FLR-SFP28. THE QUICKSPECS DOES NOT LIST THIS ADAPTER for the
    DL160 Gen10; the reference does. QuickSpecs a00021860enw on any FlexibleLOM
    ('FlexibleLOM Riser Kit (875748-B21) is required to install these adapters';
    'Only one FlexibleLOM can be added to the server'). The controller is
    PartSurfer's title for the option. The name 622FLR-SFP28 is the Product
    Information Reference's (a00077132en_us) and HPE PartSurfer's, which also
    gives the spare 869572-001
    (partsurfer.hpe.com/Search.aspx?SearchText=867334-B21). A reseller's
    photograph of a 622FLR-SFP28 from the port end, face-on, the whole plate in
    frame (cdn11.bigcommerce.com/s-
    b18w/images/stencil/1280x1280/products/57955/104143/869572-
    001_Front__20639.1711123584.jpg), and a second, closer one that shows the
    same legends (files.ekmcdn.com/itinstock/images/hpe-2-port-10-25gb-ethernet-
    flexiblelom-622flr-sfp28-cna-867334-b21-869572-001-2-80239-p.jpg).
  size: >-
    borrowed - 74.0 x 14.6, hpe/flom-629135-b22@1, the adapter whose photograph
    the faceplate's length is read from; this part's own image does not measure
    it.
  face: >-
    photo-measured - the plate is 94..1189, 1095 px: the screw 5.5 from the left
    end; a FOUR-by-two field of vents at 8.7..20.9, COUNTED; two lamps under it
    at 12.2 and 17.2, lettered ACT and LINK; one 1x2 SFP28 cage at 22.3..51.3,
    its latch slots along the bottom; a four-by-two field at 52.5..65.1 with
    lamps at 55.6 and 60.8 lettered LINK and ACT; a small square hole at
    67.3..69.3 near the top; PORT 2 under the left cage and PORT 1 under the
    right. Positions are read as fractions of the plate, whose whole length the
    photograph shows, at the 74.0 this family draws; by the cage or jacks it
    carries this photograph would put the plate between 74 and 76, which is the
    family's open question and not this part's.
  lamps: >-
    photo-measured - round lamps about 1 mm across, drawn with the library's 2
    mm dot; which is link and which activity is read off the legends the
    photograph shows. WHAT THEIR COLOURS AND FLASHES MEAN is in no document
    held. Green for link and flashing green for activity is the convention, not
    a reading.
  way-up: >-
    The adapter lies component side up, its screw end at the left as the User
    Guide's figure fits it into the cage; the photographs are taken the same way
    up.
  power: >-
    NOT STATED for the adapter in any document held; lint's L27 stands as the
    record.
  depth: >-
    estimated - 110. No dimension of the adapter is in any document held; it is
    the board's reach behind the faceplate by proportion on the photographs.
