format: 1
kind: module
name: fan-dl160
version: 1.0.0
class: fan
behaviour: fills
profile: server
description: >-
  A single-rotor hot-plug fan of the Gen10 ProLiant DL160 seen from above -
  the block that lifts out of its bay in the fan row, with its label on top
provenance:
  sources: >-
    The Internal View in HPE's QuickSpecs for the DL160 Gen10 (a00021860enw,
    page 3; the version 6 edition embeds it at 1171 x 728) - a photograph of the
    8 SFF server from above with its lid off, twenty-two callouts. Turned to the
    plan's orientation (rear at the top), the chassis is 576.5 px across for
    434.6 mm (1.3265 px/mm) and 845 px down for 614.9 (1.374 px/mm): 3.6% apart,
    so the photograph FAILS the panel gate - it is a camera above a box, not a
    drawing - and positions are taken as fractions on each axis separately. The
    User Guide's Fan locations figure (native figure GUID-4CD08C59) numbers the
    seven bays, and its Fan population guidelines table says which hold a fan.
    QuickSpecs: single rotor hot plug fans.
  size: >-
    estimated - 40 x 32 x 40. The fan bodies are about 55 px across and 45 px
    along the photograph (41 x 33 mm at its two scales), which is a 40 mm fan in
    its carrier; 40 tall as a 40 mm fan stands. Not a datasheet figure - no
    document held gives the fan's dimensions.
  power: >-
    NOT STATED in any document held (QuickSpecs, User Guide, Maintenance and
    Service Guide searched for the fan's rating); lint's L27 stands as the
    record of that.
size: {w: 40.0, h: 32.0, d: 40.0}
size-confidence: {w: estimated, h: estimated, d: estimated}
elements:
  body: {at: [0.0, 0.0], size: [40.0, 32.0], class: bezel}
