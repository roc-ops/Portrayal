description: >-
  HPE Ethernet 10Gb 2-port 535FLR-T FlexibleLOM adapter (535FLR-T; option
  817721-B21, spare 854177-001) - the adapter the Gen10 ProLiant DL160's
  FlexibleLOM riser carries in place of slot 1
attrs:
  ports: 2
  media: rj45
  part-numbers: 817721-B21 854177-001
  spare-part: 854177-001
  hpe-model: 535FLR-T
  controller: BCM57416
groups:
  ports:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 10g}
provenance:
  sources: >-
    QuickSpecs a00021860enw, FlexibleLOM adapters: 817721-B21 ('FlexibleLOM
    Riser Kit (875748-B21) is required to install these adapters'; 'Only one
    FlexibleLOM can be added to the server'). The QuickSpecs names the adapter
    by its controller. The name 535FLR-T is the Product Information Reference's
    (a00077132en_us) and HPE PartSurfer's, which also gives the spare 854177-001
    (partsurfer.hpe.com/Search.aspx?SearchText=817721-B21). A reseller's
    photograph of a 535FLR-T from the port end (cdn11.bigcommerce.com/s-
    b18w/images/stencil/1280x1280/products/59909/110875/854177-
    001_Front__82447.1746626872.jpg), close to face-on and a little from above
    and the left, and PartSurfer's of the spare.
  size: >-
    borrowed - 74.0 x 14.6, hpe/flom-629135-b22@1, the adapter whose photograph
    the faceplate's length is read from; this part's own image does not measure
    it.
  face: >-
    photo-measured - on its own photograph the plate is 75..1215, 1140 px for
    the 74.0: the screw 5.0 from the left end; a three-by-three field of vents
    at 9.3..18.5, counted; two shielded jacks at 23.4..40.9 and 45.1..62.7,
    latch notches down, the left one hard against the vents; P2 printed BETWEEN
    the jacks and P1 right of the right one; NO vent field at the right end. IT
    IS NOT THE 562FLR-T'S FACEPLATE, which a first version copied here: that one
    prints P2 left of its left jack, spaces its jacks 4 mm further left and has
    a column of vents at the right. The photograph is not square to the camera,
    so these are good to about a millimetre.
  lamps: >-
    photo-measured - a lamp window at each corner of each jack on the PIN side,
    away from the latch notch: counted, two per jack, on this adapter's
    photograph. The jack is common/rj45-eth-pinside@1, which carries its lamps
    there, in the side walls beside the opening. A first version used
    common/rj45-eth@1, whose lamps are beside the notch, and drew them 9 mm low.
    WHICH LAMP IS LINK AND WHICH ACTIVITY IS NOT READ: the faceplate letters
    neither, and left link, right activity is the jack's convention. What the
    colours and flashes mean is in no document held.
  way-up: >-
    The adapter lies component side up, its screw end at the left as the User
    Guide's figure fits it into the cage; the photographs are taken the same way
    up.
  power: >-
    NOT STATED for the adapter in any document held; lint's L27 stands as the
    record.
  depth: >-
    estimated - 110. No dimension of the adapter is in any document held; it is
    the board's reach behind the faceplate by proportion on the photographs.
size: {w: 74.0, h: 14.6, d: 110.0}
