profile: server
description: >-
  HPE Ethernet 10/25Gb 2-port 640FLR-SFP28 FlexibleLOM adapter (640FLR-SFP28;
  option 817749-B21, spare 840139-001) - the adapter the Gen10 ProLiant
  DL160's FlexibleLOM riser carries in place of slot 1
attrs:
  ports: 2
  media: sfp28
  part-numbers: 817749-B21 840139-001
  spare-part: 840139-001
  hpe-model: 640FLR-SFP28
  controller: Mellanox MCX4121A-ACFT
  sfp28: 2
