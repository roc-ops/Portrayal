provenance:
  sources: >-
    QuickSpecs a00021860enw, FlexibleLOM adapters: 817749-B21 ('FlexibleLOM
    Riser Kit (875748-B21) is required to install these adapters'; 'Only one
    FlexibleLOM can be added to the server'). The QuickSpecs names the adapter
    by its controller; the name 640FLR-SFP28 is the Product Information
    Reference's (a00077132en_us) and HPE PartSurfer's, which also gives the
    spare 840139-001 (partsurfer.hpe.com/Search.aspx?SearchText=817749-B21). A
    seller's photograph of a 640FLR-SFP28 from the port end, close and from a
    little above (i.ebayimg.com/images/g/7bEAAOSw7wxiERnD/s-l1600.jpg; read at
    1000 px), and the User Guide figure, which draws an SFP adapter going into
    the cage. THAT FIGURE PRINTS PORT 1 AT THE LEFT AND PORT 2 AT THE RIGHT, the
    opposite of this adapter's photograph; it draws a different or a generic SFP
    FlexibleLOM, and the photograph of the real part is what is followed.
  size: >-
    borrowed - 74.0 x 14.6, hpe/flom-629135-b22@1, the adapter whose photograph
    the faceplate's length is read from; this part's own image does not measure
    it.
  face: >-
    photo-measured - the plate runs off both edges of the photograph, so
    positions are read FROM THE CAGE and the cage is placed on the plate by an
    assumption: the 1x2 SFP28 cage is 413 px, 13.9 px/mm on the 29.8 that two
    ganged 14.25 ports and their walls make, the frame is 72 mm wide, and the 2
    mm of a 74.0 plate the frame does not show is split evenly between its ends.
    On that footing: the screw 6.3 from the left end; a three-by-two field of
    vents at 11.0..26.5, COUNTED; the cage at 27.1..56.9, its latch slots along
    the bottom; a two-by-two field at 57.3..67.1, counted; PORT 2 printed under
    the left cage and PORT 1 under the right; and four round lamps in a row
    under the vents, ACT and LNK at the left for port 2 and LNK and ACT at the
    right for port 1. Everything is good to a millimetre along the plate and no
    better.
  lamps: >-
    photo-measured - four round lamps about 1 mm across, drawn with the
    library's 2 mm dot; their legends ACT and LNK are read off the photograph.
    WHAT THEIR COLOURS AND FLASHES MEAN is in no document held: the QuickSpecs
    and the User Guide do not carry the adapter's LED table. Green for link and
    flashing green for activity is the convention, not a reading.
  way-up: >-
    The adapter lies component side up, its screw end at the left as the User
    Guide's figure fits it into the cage; the photographs are taken the same way
    up.
  power: >-
    NOT STATED for the adapter in any document held; lint's L27 stands as the
    record.
  depth: >-
    estimated - 110. No dimension of the adapter is in any document held; it is
    the board's reach behind the faceplate by proportion on the photographs.
size: {w: 74.0, h: 14.6, d: 110.0}
