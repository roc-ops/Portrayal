format: 1
kind: module
name: riser-flom-dl160
version: 1.0.0
class: riser
behaviour: fills
profile: server
description: >-
  The FlexibleLOM riser cage of the Gen10 ProLiant DL160 as the rear presents
  it (FlexibleLOM/NVMe riser kit 875748-B21, riser board 878539-001), which
  replaces the standard primary riser - a FlexibleLOM adapter lying flat low
  in the cage where slot 1 was, and PCIe 3.0 slot 2, low profile, beside it
attrs:
  riser-board: 878539-001
  part-numbers: 875748-B21 878539-001
provenance:
  sources: >-
    DL160 Gen10 User Guide a00066666en_us, 'Installing the FlexibleLOM adapter'
    (native figures GUID-181C89BB and GUID-7CC9C16D: the blank coming out of the
    FlexibleLOM riser cage and an adapter going in, both from the rear at an
    angle). QuickSpecs a00021860enw, 'FlexibleLOM Riser Slots': slot 1 PCIe 3.0
    x8, Flexible LOM, CPU1; slot 2 PCIe 3.0 x8, low profile, CPU1; 'This riser
    is mandatory for installing FlexibleLOMs' and 'FlexibleLOM riser will
    replace standard CPU1 X16/X8 riser'. Maintenance and Service Guide
    a00066664en_us: primary riser board x8/FlexibleLOM, 878539-001. Product
    Information Reference a00077132en_us names the kit 'HPE DL160 Gen10
    FlexibleLOM/NVMe riser kit' and the board 'CPU1 x8 Adaptive LAN on
    Motherboard (ALOM)/Non-Volatile Memory express (NVMe) riser'; the NVMe half
    is a connector on the board for the drive cage and shows nothing on the
    rear. HPE PartSurfer's photograph of the cage
    (partsurfer.hpe.com/media/photos/878539-001.jpg), from above and behind at
    an angle, its label reading 'Slot 2 PCIe x8 / Slot 1 ALOM x8'.
  size: >-
    borrowed - 203.0 x 24.2, hpe/riser-primary-dl160@1: this cage goes in the
    same place in the chassis and PartSurfer's two photographs show the same
    outline. Slot 2, its window and both end housings are that part's.
  flom-opening: >-
    estimated - NO IMAGE HELD SHOWS THIS CAGE'S REAR STRAIGHT ON. What the two
    User Guide figures show, and all that is drawn from them: the adapter sits
    low in the cage, its right end at the divider beside slot 2, one screw
    through the cage into the adapter's left end, and a row of vents above it.
    The opening is the adapter's faceplate less the screw end (hpe/flom-blank@1
    for the faceplate's 74.0 x 14.6), 64.5 x 14.0 at 52.0..116.5 by 9.4..23.4;
    it stops at 116.5, 1.0 short of where slot 2's bracket begins behind the
    plate. The figures are isometric and give no scale: every one of these
    positions is a placement by eye inside a cage whose outline is borrowed.
  vents: >-
    estimated - a row of slots above the adapter, as the figures draw the cage;
    their count and size are not read. The figures also draw a row along the
    cage's bottom edge, under the adapter, for which this face has no room below
    the opening as placed, and a column of small marks left of the screw;
    neither is drawn. A first version drew a four-by-three block of vents left
    of the screw that the figures do not show.
  slots: >-
    datasheet - QuickSpecs: slot 1 PCIe 3.0, x8, FlexibleLOM; slot 2 PCIe 3.0,
    x8 connector, low profile; both on processor 1. Only one FlexibleLOM can be
    added to the server.
  depth: >-
    borrowed - 150, hpe/riser-primary-dl160@1.
