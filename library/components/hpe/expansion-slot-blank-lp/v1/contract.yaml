format: 1
kind: module
name: expansion-slot-blank-lp
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  HPE low-profile expansion slot blank of the Gen10 ProLiant DL160's risers,
  lying flat - the part of it the windows of slots 2 and 3 show, a nine-by-
  three field of rectangular vents
provenance:
  sources: >-
    The straight-on rear photograph in newserverlife's DL160 Gen10 review
    (newserverlife.com/upload/iblock/386/8_opt.jpeg, staged as photos/nsl-
    dl160g10-rear-ORTHO-1280x145.jpg under
    working/intake/hpe/proliant/dl160-gen10), 2.90 x 2.87 px/mm; see
    hpe/psu-865408-b21@1 for the panel gate on that image. User Guide
    a00066666en_us, 'Removing the expansion slot blank'.
  size: >-
    registry - 79.2 x 18.42, THE WHOLE BRACKET (std/pcie-bracket-lp@1, PCIe CEM
    5.0), drawn tip-left as the standard part is, so a slot turned over seats it
    as it seats a card. It was first drawn at the size of the window the cage
    shows, and then no card fitted the slot; a photograph gives the opening, not
    the bracket.
  face: >-
    photo-measured - Nine columns of three vents, 4.2 x 2.4 on a 5.7 x 3.45
    pitch; slots 2 and 3 show the same nine by three, and the field is placed
    between the two readings (11.7 and 15.4 from the tip), 1.9 from each. The
    plate runs from 7.74 to the flange end, as far as the window shows it. The
    field is centred on the plate's height and placed along it so that it lands
    on the photograph's vents in the slot it was measured in.
  depth: >-
    estimated - NOT KNOWN; drawn as a plate.
size: {w: 79.2, h: 18.42}
size-confidence: {w: registry, h: registry}
elements:
  vents: {at: [13.6, 4.6], size: [51.3, 9.3], class: vent}
skins: [default]
