format: 1
kind: module
name: expansion-slot-blank-lp
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  HPE low-profile expansion slot blank in the Gen10 ProLiant DL160's riser
  cages, lying flat at the rear as slots 2 and 3 - a bright plate with a
  nine-by-three field of rectangular vents
provenance:
  sources: >-
    The straight-on rear photograph in newserverlife's DL160 Gen10 review
    (newserverlife.com/upload/iblock/386/8_opt.jpeg, staged as photos/nsl-
    dl160g10-rear-ORTHO-1280x145.jpg under
    working/intake/hpe/proliant/dl160-gen10); see hpe/psu-865408-b21@1 for the
    panel gate on that image (2.90 x 2.87 px/mm, 1.2% apart). User Guide
    a00066666en_us, 'Rear panel components' items 2 (PCIe slot 2) and 3 (PCIe
    slot 3, secondary riser for processor 2), and 'PCIe expansion slot
    definitions': both are half-height, half-length.
  size: >-
    photo-measured - The window of riser slot 2 on the rear photograph, x
    380..555 px and y 20..72 px: 60.3 x 18.2. The height agrees with a low-
    profile bracket's 18.42 (std/pcie-bracket-lp@1) to 0.2 mm; the length is the
    cage's opening, the bracket's 79.2 running under the cage at both ends. Slot
    3's window measures the same within a millimetre and seats this same part.
  face: >-
    photo-measured - Nine columns of three vents, 4.2 x 2.2 on a 5.7 x 3.5
    pitch, starting 3.4 from the window's left end and 5.9 from its top. Slot
    3's blank shows the same nine by three.
  depth: >-
    estimated - NOT KNOWN; drawn as a plate.
size: {w: 60.3, h: 18.2}
size-confidence: {w: photo-measured, h: photo-measured}
elements:
  vents: {at: [3.4, 5.9], size: [49.8, 9.2], class: vent}
skins: [default]
