format: 1
kind: module
name: riser-blank-primary-dl160
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  The primary PCI riser blank of the Gen10 ProLiant DL160 (spare 878532-001) -
  one perforated plate across the place of slots 1 and 2, which a server with
  no primary riser carries where the riser cage goes
attrs:
  spare-part: 878532-001
provenance:
  sources: >-
    HPE PartSurfer's photograph of the spare
    (partsurfer.hpe.com/media/photos/878532-001.jpg, 574 x 353), two views, each
    from a little above; the lower one, with the folded flange and its four
    keyhole slots going away at the top, is read as the outside face and is the
    one drawn. A reseller's close-up of the rear of a server that carries it
    (2beshop.com/images/products/HPE-ProLiant-DL160-Gen10/10.jpg), angled.
    Maintenance and Service Guide a00066664en_us, 'Primary riser blank
    878532-001'; User Guide a00066666en_us, 'Installing the primary PCI riser
    blank'. QuickSpecs a00021860enw gives the configure-to-order chassis 'PCIe:
    None standard. Risers need to be added', which is the server this part is
    in.
  size: >-
    borrowed - 203.0 x 24.2, hpe/riser-primary-dl160@1: the blank goes where
    that cage goes. NOT MEASURED, AND THE CLOSE-UP DOES NOT SHOW ITS LEFT END:
    an out-of-focus block in the foreground hides the first four or five
    columns. At the right it shows, in order, the grid, a plain ear with one low
    fastener, a block with a screw at mid-height and two-by-two square holes
    above and below, and then the slotted panel beside slot 3.
  face: >-
    photo-measured - A GRID OF RECTANGULAR VENTS, wider than tall, FIVE ROWS OF
    ABOUT THIRTY-ONE. The five rows are counted on both photographs. The columns
    are counted on PartSurfer's, whose two views give 31 to 33 at a 13.0..13.5
    px pitch across a field of about 418 px; 31 is drawn and is the low end of
    that. The close-up cannot count them - it shows 26 whole columns and part of
    another - but it gives their pitch on this server: 5.5 mm, by a scale fitted
    to the iLO, VGA and NIC edges under it, with the last vent ending about
    189.5. Drawn 4.0 x 2.5 on a 5.6 x 3.5 pitch, 16.4..188.4.
  ends: >-
    estimated - THE END BLOCKS ARE DRAWN AS THE RISER CAGE'S (hpe/riser-primary-
    dl160@1: a round fastener at mid-height, two-by-two square holes above and
    below), because the close-up shows a block of that description at each end
    of a server with NO riser. So they are not the cage's alone: they are the
    chassis', or this blank brings its own. Which, and so whether this part's
    face is really narrower than 203, the photograph cannot say - the scale
    fitted to it is extrapolated past 173. The blank's own ear, a plain strip
    with one low fastener between the grid and the right block, is not drawn: at
    the positions drawn there is no room for it.
  depth: >-
    estimated - NOT KNOWN; drawn as a plate. PartSurfer shows a folded top
    flange with four keyhole slots and a hanging tab, which the rear does not
    see.
size: {w: 203.0, h: 24.2}
size-confidence: {w: borrowed, h: borrowed}
elements:
  vents: {at: [16.4, 3.6], size: [172, 16.5], class: vent}
skins: [default]
