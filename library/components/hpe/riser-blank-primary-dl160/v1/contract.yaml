format: 1
kind: module
name: riser-blank-primary-dl160
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  The primary PCI riser blank of the Gen10 ProLiant DL160 (spare 878532-001) -
  one perforated plate across the place of slots 1 and 2, which a server with
  no primary riser carries where the riser cage goes
attrs:
  spare-part: 878532-001
provenance:
  sources: >-
    HPE PartSurfer's photograph of the spare
    (partsurfer.hpe.com/media/photos/878532-001.jpg, 574 x 353), both faces,
    each from a little above. A reseller's close-up of the rear of a server that
    carries it (2beshop.com/images/products/HPE-ProLiant-DL160-Gen10/10.jpg),
    angled. Maintenance and Service Guide a00066664en_us, 'Primary riser blank
    878532-001'; User Guide a00066666en_us, 'Installing the primary PCI riser
    blank'. QuickSpecs a00021860enw gives the configure-to-order chassis 'PCIe:
    None standard. Risers need to be added', which is the server this part is
    in.
  size: >-
    borrowed - 203.0 x 24.2, hpe/riser-primary-dl160@1: the blank goes where
    that cage goes, and the reseller's close-up shows it running from the
    chassis' left end block to the latch housing beside slot 3. Neither
    photograph is square enough to measure it.
  face: >-
    photo-measured - A GRID OF SQUARE VENTS, FIVE ROWS OF ABOUT THIRTY-ONE. The
    five rows are counted on both photographs. The columns are counted on
    PartSurfer's: 26 holes on one pixel row across 338 px of a field 418 px
    wide, a 13.3 px pitch, so 31 across the whole field; the photograph is 574
    px wide and a column is 13 of them, so 31 is good to one either way. Drawn
    4.0 x 2.5 on a 5.6 x 3.5 pitch between the two ends, 16.4..188.4 - the pitch
    the slot blanks' vents have. The ends are plain ears with a screw hole each,
    as PartSurfer shows; where they stop is not measured.
  depth: >-
    estimated - NOT KNOWN; drawn as a plate. PartSurfer shows a folded top
    flange with four keyhole slots and a hanging tab, which the rear does not
    see.
size: {w: 203.0, h: 24.2}
size-confidence: {w: borrowed, h: borrowed}
elements:
  vents: {at: [16.4, 3.6], size: [173.6, 17.5], class: vent}
skins: [default]
