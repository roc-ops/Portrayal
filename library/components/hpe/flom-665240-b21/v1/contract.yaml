profile: server
description: >-
  HPE Ethernet 1Gb 4-port 366FLR FlexibleLOM adapter (366FLR; option
  665240-B21, spare 669280-001) - the adapter the Gen10 ProLiant DL160's
  FlexibleLOM riser carries in place of slot 1
attrs:
  ports: 4
  media: rj45
  part-numbers: 665240-B21 669280-001
  spare-part: 669280-001
  hpe-model: 366FLR
  controller: I350-T4V2
groups:
  ports:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
provenance:
  sources: >-
    QuickSpecs a00021860enw, FlexibleLOM adapters: 665240-B21 ('FlexibleLOM
    Riser Kit (875748-B21) is required to install these adapters'; 'Only one
    FlexibleLOM can be added to the server'). The QuickSpecs names the adapter
    by its controller. The name 366FLR is the Product Information Reference's
    (a00077132en_us) and HPE PartSurfer's, which also gives the spare 669280-001
    (partsurfer.hpe.com/Search.aspx?SearchText=665240-B21). A reseller's
    photograph of a 366FLR from the port end at an angle
    (d68bu9da8k2nr.cloudfront.net/HP-669280-001-1.jpg), and PartSurfer's of the
    spare from above.
  size: >-
    borrowed - 74.0 x 14.6, hpe/flom-629135-b22@1, the adapter whose photograph
    the faceplate's length is read from; this part's own image does not measure
    it.
  face: >-
    borrowed - hpe/flom-629135-b22@1's layout, four ganged jacks in a shield
    with the screw hole at the left: the photograph held is angled and shows
    that layout without giving a position. Port order as that part, not read.
  way-up: >-
    The adapter lies component side up, its screw end at the left as the User
    Guide's figure fits it into the cage; the photographs are taken the same way
    up.
  power: >-
    NOT STATED for the adapter in any document held; lint's L27 stands as the
    record.
  depth: >-
    estimated - 110. No dimension of the adapter is in any document held; it is
    the board's reach behind the faceplate by proportion on the photographs.
size: {w: 74.0, h: 14.6, d: 110.0}
