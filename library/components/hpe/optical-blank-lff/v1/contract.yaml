format: 1
kind: module
name: optical-blank-lff
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  HPE optical drive blank over the Gen10 ProLiant DL160 4 LFF front's
  optical bay - the vented plate across the top of drive bays 1 and 2 that
  the optional 9.5 mm optical drive replaces
provenance:
  sources: >-
    The straight-on photograph of a DL160 Gen10 4 LFF front in newserverlife's
    review (newserverlife.com/upload/iblock/562/7_opt.jpeg); see hpe/lff-lp-carrier@1 for the
    panel gate on that image (2.605 x 2.615 px/mm, 0.4% apart). DL160 Gen10 User
    Guide a00066666en_us, 'Front panel components', Four-bay LFF model, item 1
    'Optical drive (optional)'; QuickSpecs a00021860enw page 2, 4 LFF front
    callout 2, 'DVD-RW or DVD-ROM (blank shown)'.
  size: >-
    photo-measured - x 73..455 px and y 10..34.5 px on the photograph: 146.0 x
    9.4. The plate is a separate panel from the vents to its right - its seam is
    visible at 455 px - which is how the blank is told from the chassis.
  face: >-
    photo-measured - Two rows of slots, 4.6 x 3.1 on a 6.37 pitch across and 4.0
    down, from 3.0 along and 1.5 down; 22 slots a row on the photograph.
  depth: >-
    estimated - NOT KNOWN; drawn as a plate.
size: {w: 146.0, h: 9.4}
size-confidence: {w: photo-measured, h: photo-measured}
elements:
  vents: {at: [3.0, 1.5], size: [138.4, 7.1], class: vent}
skins: [default]
