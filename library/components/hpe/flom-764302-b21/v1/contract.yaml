description: >-
  HPE FlexFabric 10Gb 4-port 536FLR-T FlexibleLOM adapter (536FLR-T; option
  764302-B21, spare 768082-001) - the adapter the Gen10 ProLiant DL160's
  FlexibleLOM riser carries in place of slot 1
attrs:
  ports: 4
  media: rj45
  part-numbers: 764302-B21 768082-001
  spare-part: 768082-001
  hpe-model: 536FLR-T
  controller: 57840S
groups:
  ports:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 10g}
provenance:
  sources: >-
    Product Information Reference a00077132en_us, FlexibleLOM adapters:
    764302-B21, 536FLR-T. THE QUICKSPECS DOES NOT LIST THIS ADAPTER for the
    DL160 Gen10; the reference does. QuickSpecs a00021860enw on any FlexibleLOM
    ('FlexibleLOM Riser Kit (875748-B21) is required to install these adapters';
    'Only one FlexibleLOM can be added to the server'). The controller is
    PartSurfer's title for the option. The name 536FLR-T is the Product
    Information Reference's (a00077132en_us) and HPE PartSurfer's, which also
    gives the spare 768082-001
    (partsurfer.hpe.com/Search.aspx?SearchText=764302-B21). A reseller's
    photograph of a 536FLR-T from the port end, face-on, the whole plate in
    frame (serverorbit.com/images/detailed/272/HPE-764302-B21-4Port-PCIE-
    Flexfabric536flr-Adapter.jpg, 800 x 800), and PartSurfer's of the spare from
    above.
  size: >-
    borrowed - 74.0 x 14.6, hpe/flom-629135-b22@1, the adapter whose photograph
    the faceplate's length is read from; this part's own image does not measure
    it.
  face: >-
    borrowed - hpe/flom-629135-b22@1's drawing: its screw at 3.6, its shield at
    8.6..65.4 and its jacks on a 13.97 pitch. THIS ADAPTER'S OWN PHOTOGRAPH WAS
    READ AND IS NOT WHAT IS DRAWN: on it the plate is 1810 px, the screw 4.7
    from the left end, the shield 8.4..65.4 and the four openings pitched 13.56
    at 74.0 - the same arrangement, a lamp at each upper corner of every jack
    and the contacts along the bottom, with the screw 1.1 mm further right and
    the jacks 0.4 closer. Those differences are inside what an 800 px photograph
    and an unsettled plate length can tell, so the measured adapter's drawing is
    kept. PORT ORDER IS NOT READ: the plate prints no numbers the photograph
    shows, and 4 to 1 left to right follows HPE's two-port FlexibleLOMs.
    Positions are read as fractions of the plate, whose whole length the
    photograph shows, at the 74.0 this family draws; by the cage or jacks it
    carries this photograph would put the plate between 74 and 76, which is the
    family's open question and not this part's.
  way-up: >-
    The adapter lies component side up, its screw end at the left as the User
    Guide's figure fits it into the cage; the photographs are taken the same way
    up.
  power: >-
    NOT STATED for the adapter in any document held; lint's L27 stands as the
    record.
  depth: >-
    estimated - 110. No dimension of the adapter is in any document held; it is
    the board's reach behind the faceplate by proportion on the photographs.
size: {w: 74.0, h: 14.6, d: 110.0}
