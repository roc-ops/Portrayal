format: 1
kind: module
name: psu-865408-b21
version: 1.0.0
class: psu
behaviour: fills
profile: server
description: >-
  HPE 500 W Flex Slot Platinum Hot Plug Low Halogen power supply (865408-B21),
  as fitted to the Gen10 ProLiant DL160 - a 40 mm fan behind a grille held by
  four screws, the status lamp and the terracotta release latch at the top
  right, and a C14 inlet standing portrait below them
attrs:
  power-output-w: 500
  form-factor: flex-slot
  inlet: c14
  input: 100-240 VAC
  efficiency: platinum
provenance:
  sources: >-
    (1) The straight-on rear photograph of a DL160 Gen10 in newserverlife's
    review (newserverlife.com/upload/iblock/386/8_opt.jpeg, 1280 x 145, staged
    as photos/nsl-dl160g10-rear-ORTHO-1280x145.jpg under
    working/intake/hpe/proliant/dl160-gen10), which carries this supply in bay 1
    and the Flex Slot blank in bay 2. (2) DL160 Gen10 User Guide a00066666en_us,
    "HPE 500 W Flex Slot Platinum Hot-plug Low Halogen Power Supply"
    specification table and "Rear panel LEDs". (3) QuickSpecs a00021860enw, the
    power supply option list.
  size: >-
    photo-measured - 68.2 x 40.6. The rear photograph passes the panel gate: the
    body is 1261 px for 434.6 mm (2.90 px/mm across) and 123 px for 42.9 (2.87
    down), 1.2% apart. The supply's face runs x 1060..1258 px and y 15..131 px.
    No document held states a Flex Slot supply's dimensions (QuickSpecs, User
    Guide, Maintenance and Service Guide and the -48 VDC sheet searched for
    "dimension", "mm", "width" and "depth").
  face: >-
    photo-measured - Supply-local: grille 1.0..38.9 across, drawn as a 36 mm
    round grille centred at (20.0, 20.6); screws at (5.5, 5.2), (37.2, 5.2),
    (4.8, 36.9) and (37.2, 36.9); status lamp at (48.3, 5.6); release latch
    53.1..62.1 x 4.5..11.1; inlet recess 43.1..68.2 x 11.1..40.4. The cord strap
    the photographed unit carries across its handle is cable management and is
    not drawn.
  inlet: >-
    photo-measured - COMPOSED, std/c14-inlet@1 at rotate 90. The library's C14
    is drawn earth pin up; on this supply the photograph puts the earth pin on
    the RIGHT with line and neutral stacked on the left, a quarter turn
    clockwise. It is centred on the recess at (55.6, 25.8).
  lamp: >-
    User Guide "Rear panel LEDs" item 4, Power supply: solid green - normal; off
    - power unavailable, power supply failure, power supply in standby, or power
    supply error.
  power: >-
    datasheet - power-output-w 500 is the rating: User Guide specification
    table, rated steady-state power 500 W at 100-127 VAC, 500 W at 100-240 VAC
    and 500 W at 240 VDC (China only); maximum peak power the same. Rated input
    current 5.8 A at 100 VAC, 2.8 A at 200 VAC; maximum rated input power 557 W
    at 100 VAC, 539 W at 200 VAC. A rating, not a draw.
  depth: >-
    estimated - NOT IN THE INTAKE; drawn as a plate. No document held gives a
    Flex Slot supply's depth.
size: {w: 68.2, h: 40.6}
size-confidence: {w: photo-measured, h: photo-measured}
