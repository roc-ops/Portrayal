format: 1
kind: component
name: info-pull-tab
version: 1.0.0
class: tab
behaviour: fills
profile: server
description: >-
  The serial number / iLO information pull tab of an HPE Gen10 ProLiant front
  - a black tab that slides out of the front bezel, printed with an
  information mark between two bars; one side carries the serial number and
  asset tag, the other the default iLO account
provenance:
  sources: >-
    DL160 Gen10 User Guide a00066666en_us, "Front panel components" and its
    footnote: the tab is printed on both sides, the serial number and customer
    asset tag on one and the default iLO account on the other. The straight-on
    4 LFF photograph in newserverlife's review (photos/nsl-dl160g10-4lff-front-
    ORTHO-1280x131.jpg under working/intake/hpe/proliant/dl160-gen10).
  size: >-
    photo-measured - 37.2 x 11.1: x 827..924 px and y 12..41 px at 2.605 x 2.615
    px/mm, taking in the curved finger grip along its top. The printed bars and
    the boxed "i" are at 5.8..15.6, 25.0..34.8 and 16.6..19.3 along it, 8.3
    down.
size: {w: 37.2, h: 11.1}
size-confidence: {w: photo-measured, h: photo-measured}
elements:
  tab: {at: [0.0, 6.6], size: [37.2, 4.5], class: label}
skins: [default]
