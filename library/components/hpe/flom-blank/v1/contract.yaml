format: 1
kind: module
name: flom-blank
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  FlexibleLOM adapter blank of the Gen10 ProLiant DL160's FlexibleLOM riser
  cage - a perforated plate where an adapter's faceplate goes
provenance:
  sources: >-
    DL160 Gen10 User Guide a00066666en_us, 'Installing the FlexibleLOM adapter'
    (native figures GUID-181C89BB and GUID-7CC9C16D: the blank coming out of the
    FlexibleLOM riser cage and an adapter going in, both from the rear at an
    angle), the first of which shows the blank leaving the cage.
  size: >-
    photo-measured - 74.0 x 14.6, the FlexibleLOM faceplate, from three sellers'
    photographs of three adapters taken near face-on, each scaled on a part of
    known size it carries: the 640FLR-SFP28's 1x2 SFP cage (29.8 across by
    SFF-8433) puts its plate at 73.5; the 331FLR's four ganged jacks span 0.755
    of its plate, which at 74.0 is 55.9 - four of the 13.97 a ganged modular
    jack is pitched at - and that agreement is what fixes the length; the
    562FLR-T's plate is 12.4 tall with its jacks standing 1.3 below it. 14.6 is
    the plate, its top fold and that overhang together. None of the three is a
    ruler on the part, and none is perfectly square to the camera.
  face: >-
    estimated - a plate with a field of square vents, as the figure draws it;
    nine columns of three are a reading of an isometric line drawing, not a
    count on a photograph. No photograph of the blank is held.
  depth: >-
    estimated - NOT KNOWN; drawn as a plate.
size: {w: 74.0, h: 14.6}
size-confidence: {w: photo-measured, h: photo-measured}
elements:
  vents: {at: [14.0, 2.6], size: [53.0, 9.6], class: vent}
skins: [default]
