profile: server
description: >-
  FlexibleLOM adapter blank of the Gen10 ProLiant DL160's FlexibleLOM riser
  cage - a perforated plate where an adapter's faceplate goes
provenance:
  sources: >-
    DL160 Gen10 User Guide a00066666en_us, 'Installing the FlexibleLOM adapter'
    (native figures GUID-181C89BB and GUID-7CC9C16D: the blank coming out of the
    FlexibleLOM riser cage and an adapter going in, both from the rear at an
    angle), the first of which shows the blank leaving the cage.
  size: >-
    borrowed - 74.0 x 14.6, hpe/flom-629135-b22@1, the adapter whose photograph
    the faceplate's length is read from; this part's own image does not measure
    it.
  face: >-
    estimated - a plate with a field of square vents, as the figure draws it:
    three rows of about thirteen, the figure's arrow hiding some, so thirteen is
    a reading of an isometric line drawing and not a count on a photograph. No
    photograph of the blank is held.
  depth: >-
    estimated - NOT KNOWN; drawn as a plate.
size: {w: 74.0, h: 14.6}
