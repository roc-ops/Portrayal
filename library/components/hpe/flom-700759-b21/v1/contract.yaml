  HPE FlexFabric 10Gb 2-port 533FLR-T FlexibleLOM adapter (533FLR-T; option
  700759-B21, spare 701534-001) - the adapter the Gen10 ProLiant DL160's
  FlexibleLOM riser carries in place of slot 1
