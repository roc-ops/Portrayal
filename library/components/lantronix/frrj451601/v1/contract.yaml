profile: networking
description: >-
  Lantronix FRRJ451601, the 16-port RS-232 RJ45 I/O module of the SLC 8000 console manager. The face has sixteen RJ45
  serial jacks in two rows of eight. A pale plate carries the legends SERIAL PORTS and DO NOT HOT SWAP, and two release
  slots. It seats in one of the three rear I/O bays, filled in order from bay 1.
size: {w: 112.5, h: 43.4, d: 128.6}
size-confidence: {w: estimated, h: estimated, d: borrowed}
attrs:
  model: FRRJ451601
provenance:
  identity: >-
    datasheet - Lantronix SLC 8000 Advanced Console Manager User Guide, 900-704-RBD-SLC-UG (July 2025), Figure 3-7
    (page 43): "16-Port RJ45 I/O Module (Part Number FRRJ451601)"; Chapter 2, "Device Port and Console Port Interfaces"
    (pages 30 to 32): sixteen device ports per module, RS-232, up to three modules. The SLC 8000 I/O Module
    Installation Guide, 900-722-R Rev C, step 3: each bay is filled in order from 1 to 3.
  size: >-
    estimated, and the depth borrowed - no document held gives an I/O module a size. The face takes the width and height of the rear bay it
    seats in, 112.5 by 43.4 mm, which the SLC 8000 device reads off User Guide Figure 2-2 (an estimate). The depth is
    the 128.6 mm of lantronix/lm83x-8sa@1, the same maker's 8-port serial expansion module of a 1U chassis (LM-Series
    Expansion Modules and Option Cards product brief); the SLC 8000 module may be deeper or shallower. Both are
    estimates, and the gap on the device names the document that would replace them.
  layout: >-
    photo-measured - User Guide Figure 2-2, lower view (page 28), body 438.15 mm across at about 4.4 px/mm after
    enlargement. Eight jacks across at a 13.6 mm pitch and two rows 13.6 mm apart; the cell is the 12.7 by 11.0 mm
    ganged jack part, which is narrower than the pitch, and the figure's jacks read about 11.4 mm wide. The pattern is set
    symmetric in the face, so each position is estimated to within about 1 mm.
  rows: >-
    photo-measured - port numbering is not printed on the module. The chassis prints 1 to 16 along its top edge, and the
    User Guide's dashboard (Figure 3-7) puts the odd ports on the upper row and the even ports on the lower row, so the
    upper row is 1, 3 ... 15 and the lower row is 2, 4 ... 16, left to right. The numbering within a module is
    relative: a module in bay 2 or 3 carries ports 17 to 32 or 33 to 48 on the chassis.
  plate: >-
    photo-measured - the plate reads pale grey (about #c6c9cc) in Figure 2-2, with a darker lower strip carrying the
    legends. No document gives a finish.
  printing: >-
    photo-measured - SERIAL PORTS and DO NOT HOT SWAP (with a warning triangle) on the lower strip, and two dark release
    slots. The chassis's numbering along the top edge belongs to the chassis plate and is not drawn here.
  power: >-
    not published - the User Guide gives the chassis a draw with 48 serial ports, none per module. The lint finding for a
    module with no draw stays and is recorded in the baseline.
