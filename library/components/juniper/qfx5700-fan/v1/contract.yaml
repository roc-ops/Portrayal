description: >-
  Juniper JNP5700-FAN, the fan tray of the QFX5700, with front-to-back airflow (air out, AFO). A tray holds four
  fans in a row behind four rounded-square grilles, a status panel at the left with a lamp for each fan and one for
  the forwarding engine board, a handle slot at each end and a heat warning. The chassis takes two, one above the
  other, and they are interchangeable. A tray is hot-insertable and hot-removable: replace a failed one within one minute,
  and the system shuts down 240 seconds after a tray is removed. The trays pull air in through the front panel around
  the optics; the supplies cool themselves with their own fans.
