<svg xmlns="http://www.w3.org/2000/svg" width="10.9mm" height="29.9mm" viewBox="0 0 10.9 29.9">
  <!-- The QFX5210 DC supply's power header seen from its mating face: the housing, its keyed shroud and three round cells in a
       column numbered 1, 2 and 3. Shapes and colours are those the supply's own skin drew before it composed this part. -->
  <rect id="body" x="0" y="0" width="10.9" height="29.9" rx="0.8" fill="#111316" stroke="#3a3e43" stroke-width="0.4"/>
  <path id="shroud" d="M 1.2 9.6 L 3.2 7.2 V 3.6 M 9.1 4.6 V 13.6 L 7.6 15.2 L 9.1 16.8 V 24.6" fill="none" stroke="#2b2e32" stroke-width="0.4"/>
  <g id="cells">
    <g id="cell-1"><circle cx="5.2" cy="9.7" r="1.5" fill="#4a4f55" stroke="#6d7379" stroke-width="0.3"/><circle cx="5.2" cy="9.7" r="0.8" fill="#33373c"/></g>
    <g id="cell-2"><circle cx="5.2" cy="15.2" r="1.5" fill="#4a4f55" stroke="#6d7379" stroke-width="0.3"/><circle cx="5.2" cy="15.2" r="0.8" fill="#33373c"/></g>
    <g id="cell-3"><circle cx="5.2" cy="20.4" r="1.5" fill="#4a4f55" stroke="#6d7379" stroke-width="0.3"/><circle cx="5.2" cy="20.4" r="0.8" fill="#33373c"/></g>
  </g>
  <g id="silkscreen" font-family="sans-serif" font-size="1.0" fill="#c7ccd1">
    <text x="7.0" y="9.0" transform="rotate(90 7.0 9.0)">1</text>
    <text x="7.0" y="14.5" transform="rotate(90 7.0 14.5)">2</text>
    <text x="7.0" y="19.7" transform="rotate(90 7.0 19.7)">3</text>
  </g>
</svg>
