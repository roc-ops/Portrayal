format: 1
kind: module
name: ex3400-jpsu-150-dc-afo
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper JPSU-150-DC-AFO, the 150 W DC power supply for the EX3400-24T-DC and EX3400-48T-DC. It
  seats in power supply slot 0 or 1 at the rear. It takes -48 through -60 VDC on a three-terminal
  connector, marked +, - and earth. The face has a fan, a release latch and two lamps, OUT OK and
  IN OK. Airflow is front to back, marked AIR OUT.
attrs:
  role: dc-power-supply
  inlet: dc-terminal
  power-output-w: 150
  input: -48 through -60 VDC, 4.7 A maximum at -48 VDC
  airflow: front-to-back
  weight-kg: 0.65
part-numbers:
  JPSU-150-DC-AFO: {part: JPSU-150-DC-AFO}
provenance:
  size: >-
    estimated - no photograph of the DC supply is held. Figure 15 draws it as a line drawing
    whose aspect, 1.83, equals that of the AC supply photographed in Juniper's EX3400-48P rear
    studio photograph (71.2 by 39.0 mm at 3.327 px/mm), so it is drawn at that size. The guide
    gives no supply dimension, only the weight, and no depth.
  power-output-w: >-
    datasheet - EX3400 Switch Hardware Guide (published 2026-01-09), Table 16 and Table 20: power supply
    output 150 W. An output, because a supply provides power.
  input: >-
    datasheet - Table 20: DC input voltage -48 through -60 VDC and input current 4.7 A maximum
    at -48 VDC, with the advice to provide 4.7 A at 48 VDC and a 10 A breaker. The connection topic
    says to terminate on a source that supplies at least 7.5 A at -48 VDC, and the label in
    Figure 15 reads 4.7-2.8 A. The 4.7 A is carried as the input rating and the 7.5 A is recorded in
    the device gaps.
  part-number: >-
    datasheet - Table 16 and Table 17 name the supply JPSU-150-DC-AFO, and so does Table 38. Table 1, the
    chassis weights in Table 3, and the CLI term in Table 2 print JPSU-150W-DC-AFO. Table 16 is the
    supply's own details table, so its spelling is used.
  airflow: 'datasheet - Table 16 and Table 17: front-to-back, indicated by label AIR OUT.'
  leds: >-
    datasheet - Figure 15 and Table 18: IN OK is green when the supply receives power, and unlit when it is
    disconnected or the input is out of range. OUT OK is green when the supply works, red when it has
    failed and unlit when IN OK is unlit or the supply does not deliver. Figure 15 puts OUT OK left of IN OK.
  face: >-
    drawing - positions are fractions of the 420 by 230 px supply in Figure 15 (5.9 px/mm at the assumed
    size): fan left, latch, the two lamps, a three-position terminal block (+, - and earth) and a
    grip at the right. The latch keeps the orange of the AC supply photographs, since the figure is
    line art and states no colour. The clear plastic cover over the terminals is not drawn.
  connector: >-
    the supply composes juniper/jpsu-150-dc-header@1 as `dc-header`, the pluggable three-terminal connector of the EX3400
    Switch Hardware Guide (Juniper Networks, published 2026-01-09), "Connecting DC Power to an EX3400 Switch" (PDF pages 142
    and 143) and its Figure 47 (the supply's socket, with the connector approaching). The guide calls it "the terminal
    connector" and names no maker or part number for it (it names "Molex 192120005" for the wire pins, not for the
    connector), so the part is a declared stand-in (its own provenance). Its place is an estimate: the guide gives no
    dimension, so it stands at the top left of the block the skin already draws (47.5, 7.6; 10.1 by 25.8), inside it. The
    three round screw heads the skin draws in that block are covered by the part, and the skin is unchanged. The cable
    connector of Figure 46, juniper/jpsu-150-dc-plug@1, mates it. The EX4100 supply of the same part number carries the same
    connector (the same drawing in its guide) and composes the same part.
  roles: >-
    guide - Figure 47 prints "+", "-" and an earth symbol beside the three cells, top to bottom. Step 1's note says the + terminal
    is referred to as +RTN and the - terminal as -48 V, so the roles are `rtn`, `batt` and `gnd`, in that order from the top.
    The guide prints no nominal beside the figure; Table 20 prints a range.
  no-dc-port: >-
    THE DC INPUT PORT IS NOT STATED HERE, ON PURPOSE. The three poles are the cells of one pluggable connector that has an earth
    cell in it, and a port whose poles are a connector's contacts is offered only where that path's part is itself the
    connector; on a supply in a bay it is the supply, not the connector it composes, so a port stated here would be published
    and then not offered. The roles above are recorded for the port a later change can state, a minor on the devices that seat
    this supply.
states:
- ok
- fault
- absent
elements:
  led-out:
    at: [42.3, 2.4]
    size: [2.6, 2.6]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: red, color: '#e03a2f'}
    - 'off'
  led-in:
    at: [61.8, 2.4]
    size: [2.6, 2.6]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  latch:
    at: [30.8, 1.0]
    size: [9.4, 36.8]
    class: latch
size:
  w: 71.2
  h: 39.0
size-confidence: {w: estimated, h: estimated}
relief:
  features:
  - node: latch
    out: 1.6
    color: '#ee6a1f'
    confidence: estimated
    source: photo - the latch of the AC supply stands proud; projection not measured
