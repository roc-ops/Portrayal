version: 1.2.1
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper DPCE 20GE+2XGE (EOL) - twenty SFP in two PIC groups of ten plus two XFP uplink PICs; the X and Q variants share the faceplate. Authored as the MX960 vertical form (jacks rotated 90).
attrs:
  sfp: 20
  model: DPCE-R-20GE-2XGE
  model-variants: DPCE-X-20GE-2XGE, DPCE-R-Q-20GE-2XGE
  power-draw-max-w: 333
provenance:
  sfp-rate: >-
    the cage RATE, transcribed from this contract's own description: 'DPCE 20GE+2XGE (EOL) -
    twenty SFP in two PIC groups of ten plus two XFP uplink PICs'. Without it `cage_type`
    finds no media attr for the sfp family and falls through to PART_IFACE's default, which
    is SFP+ at 10G - a rate this card does not run. Nothing new was measured.
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU table - MX240 guide Table 93 'FRU Power Requirements', Dense Port Concentrators
    section: '| Multi-Rate Ethernet Enhanced Ethernet Services DPC with SFP and XFP | DPCE-R-20GE-2XGE DPCE-X-20GE-2XGE | 333W |'.
    A maximum for the card alone, covering the -R and -X variants at one figure. No DPC row in
    that table prints a temperature ladder, so there is no ambient to name and none is claimed.
    mx240, mx480 and both halves of the mx960 guide print the identical row.
    Read the Part Number column and not the Component description: the neighbouring
    '| Multi-Rate Ethernet Enhanced Queuing IP Services DPC with SFP and XFP | DPCE-R-Q-20GE-2XGE | 335W |'
    is a different card.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
