  grille-bottom: {at: [8.8, 47.4], size: [65.0, 29.6], class: rotor}
  latch-left: {at: [0.5, 36.8], size: [11.7, 9.6], class: latch}
  latch-right: {at: [70.2, 36.8], size: [10.6, 9.6], class: latch}
