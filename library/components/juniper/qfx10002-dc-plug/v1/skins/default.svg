<svg xmlns="http://www.w3.org/2000/svg" width="12.0mm" height="36.6mm" viewBox="0 0 12.0 36.6">
  <!-- The cable connector of the QFX10002 DC supply seen from the wire side, seated: a pale hood at the connector's shell, a
       thumbscrew at each end and three ways drawn alike because the guide does not place a wire colour at a way. -->
  <rect id="hood" x="0" y="3.3" width="12.0" height="27.0" rx="1.2" fill="#c8cacc" stroke="#8d8f91" stroke-width="0.3"/>
  <g id="ways" fill="#6f7378" stroke="#4a4d52" stroke-width="0.12">
    <circle cx="6.0" cy="9.2" r="1.0"/>
    <circle cx="6.0" cy="16.8" r="2.0"/>
    <circle cx="6.0" cy="24.4" r="1.0"/>
  </g>
  <g id="thumbscrews" fill="#b9bbbe" stroke="#6b6e70" stroke-width="0.3">
    <circle cx="6.0" cy="1.8" r="1.6"/>
    <circle cx="6.0" cy="34.8" r="1.6"/>
  </g>
</svg>
