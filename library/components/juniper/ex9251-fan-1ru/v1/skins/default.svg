  </g>
  <g id="grille-bottom">
    <rect x="7.8" y="26.3" width="26.9" height="11.0" rx="3.0" fill="#1a1d20"/>
    <rect x="7.8" y="26.3" width="26.9" height="11.0" rx="3.0" fill="url(#hex)"/>
  </g>
  <g id="handle">
