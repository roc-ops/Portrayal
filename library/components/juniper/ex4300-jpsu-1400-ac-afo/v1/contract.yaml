format: 1
kind: module
name: ex4300-jpsu-1400-ac-afo
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper JPSU-1400-AC-AFO, the 1400 W AC power supply of the EX4300-48MP, labelled AIR OUT (AFO):
  front-to-back airflow. It ships in the EX4300-48MP and seats in its PSU 0 and PSU 1 slots; no
  other EX4300 model takes it. Hot-insertable and hot-removable; IN OK and OUT OK lamps, a honeycomb
  vent, a loop handle and an appliance inlet that the guide types C15. At low line the supply
  delivers 1100 W.
attrs:
  model: JPSU-1400-AC-AFO
  part-number: JPSU-1400-AC-AFO
  role: ac-power-supply
  power-output-w: 1400
  input-voltage: 100-140 VAC low line or 200-240 VAC high line, 50-60 Hz
  airflow: front-to-back
  airflow-label: AIR OUT (AFO)
  weight-kg: 1.39
provenance:
  part-number: >-
    datasheet - EX4300 Line of Ethernet Switches Datasheet (PDF created 2022-07-25), Ordering
    Information, Power Supplies: JPSU-1400-AC-AFO, "EX4300 1400 W AC power supply for EX4300-48MP",
    front-to-back airflow; the datasheet's spare-chassis matrix writes it JPSU-1400-AC-AFO. The
    EX4300 Switch Hardware Guide (published 2025-08-12) Table 30 spells the model JPSU-1400W-AC-AFO;
    the datasheet's ordering spelling is the one carried. The 48MP ships with it (guide Table 3 and
    Table 8)
  power-output-w: >-
    datasheet - guide Table 30 (1400 W AC power supply) and Table 35: the supply is 1400 W, and "when
    operating at low line configuration, the 1400 W power supply operates as 1100 W power supply".
    The guide has no 1400 W specification table beside Tables 40 to 42, so the input current rating
    is not carried
  input-voltage: >-
    datasheet - guide Table 30 operating range, printed as low line 100-140 VAC and high line
    200-240 VAC for this column. 140 V is as printed and reads high against the 100-120 V of the
    other ratings; no second table confirms it
  weight: >-
    datasheet - guide Table 10 and Table 30: 3.06 lb (1.39 kg)
  size: >-
    drawing - 84.0 x 42.0 mm, the aperture of the supplies of the other EX4300 models. The 48MP rear
    figure (Figure 15, g022450, 1501 px across, chassis 1404.5 px for 441.0 mm = 3.185 px per mm)
    shows slot 0 at 82.8 mm of module face between the fan and the slot rail, and its lamps, handle
    and inlet fall at the same offsets from the module's left edge as the 1100 W art (lamps 7.5 and
    18.6 mm, handle 31.6 to 38.0 mm), so the 1100 W module's size and face are used
  inlet: >-
    estimated - guide Table 30 types the appliance inlet IEC-320-C15, and Figure 15 draws a notched
    inlet. The registry has no C16 aperture (C15 is the cord side), so the drawn opening is the
    registry's C14 inlet, as on the 1100 W supply
  face: >-
    estimated - the art is the 1100 W AIR OUT art (juniper/ex4300-jpsu-1100-ac-afo), with the
    ratings changed, because the guide's single AC supply drawing (Figure 42) and the 48MP rear
    figure show the same arrangement of lamps, vent, handle and inlet
  leds: >-
    datasheet - guide Table 30 gives IN OK and OUT OK for the 1400 W supply, and Figure 15 prints both
    legends above two lamps at the top left of the face. The colours follow Table 46: IN OK green when
    the input is good; OUT OK green when delivering and red when the supply has failed
  power-draw: >-
    NOT APPLICABLE - a supply states its output
states:
- ok
- fault
- absent
parts:
- {ref: std/c14-inlet@1, id: inlet, at: [47.0, 10.5]}
