  led-in-ok:
    at: [6.8, 7.5]
    size: [2.2, 2.2]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  led-out-ok:
    at: [18.1, 7.5]
    size: [2.2, 2.2]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: red, color: '#ef4444'}
    - 'off'
  latch:
    at: [32.8, 3.4]
    size: [5.6, 35.0]
    class: latch
size:
  w: 84.0
  h: 42.0
size-confidence: {w: drawing, h: drawing}
relief:
  features:
  - node: latch
    out: 2.0
    color: '#2b2e35'
    confidence: estimated
    source: guide Figure 42 and Figure 100 - the loop handle stands proud of the face; projection not measured
