<svg xmlns="http://www.w3.org/2000/svg" width="32.2mm" height="7.7mm" viewBox="0 0 32.2 7.7">
  <!-- The conductor ends clamped in the alarm connector seen from the front, seated: six stripped ends at the connector's six
       positions, 3.5 mm apart. Shapes and colours are estimates; the guide's figures are line art. -->
  <rect id="body" x="0" y="0" width="32.2" height="7.7" rx="0.8" fill="#b9bec4" stroke="#5e656c" stroke-width="0.3"/>
  <g id="ends" fill="#d9dbdd" stroke="#5e656c" stroke-width="0.2">
    <rect x="6.0" y="1.2" width="2.7" height="5.3" rx="0.3"/>
    <rect x="9.5" y="1.2" width="2.7" height="5.3" rx="0.3"/>
    <rect x="13.0" y="1.2" width="2.7" height="5.3" rx="0.3"/>
    <rect x="16.5" y="1.2" width="2.7" height="5.3" rx="0.3"/>
    <rect x="20.0" y="1.2" width="2.7" height="5.3" rx="0.3"/>
    <rect x="23.5" y="1.2" width="2.7" height="5.3" rx="0.3"/>
  </g>
</svg>
