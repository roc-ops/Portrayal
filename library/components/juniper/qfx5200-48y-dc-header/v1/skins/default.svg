<svg xmlns="http://www.w3.org/2000/svg" width="10.9mm" height="28.4mm" viewBox="0 0 10.9 28.4">
  <!-- The QFX5200-48Y DC supply's power header seen from its mating face: the housing and three round cells in a column.
       Shapes and colours are those the supply's own skin drew before it composed this part. -->
  <rect id="body" x="0" y="0" width="10.9" height="28.4" rx="0.8" fill="#16181a" stroke="#2b2d31" stroke-width="0.3"/>
  <circle id="cell-3" cx="5.3" cy="9.5" r="1.25" fill="#7b8087" stroke="#3a3e43" stroke-width="0.25"/>
  <circle id="cell-2" cx="5.3" cy="14.3" r="1.25" fill="#7b8087" stroke="#3a3e43" stroke-width="0.25"/>
  <circle id="cell-1" cx="5.3" cy="19.1" r="1.25" fill="#7b8087" stroke="#3a3e43" stroke-width="0.25"/>
  <g id="silkscreen" font-family="sans-serif" font-size="1.3" fill="#d5d8db" text-anchor="middle">
    <text x="2.4" y="9.9">3</text>
    <text x="2.4" y="14.7">2</text>
    <text x="2.4" y="19.5">1</text>
  </g>
</svg>
