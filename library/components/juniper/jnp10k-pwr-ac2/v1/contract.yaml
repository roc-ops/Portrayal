format: 1
kind: module
name: jnp10k-pwr-ac2
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper JNP10K-PWR-AC2 power supply for the MX10004/MX10008 - 5.5 kW,
  dual C20 feeds (INP1/INP2) stacked beside the exhaust field, FAULT /
  PWR OK / INP lamps, the red feed-setting DIP and the power rocker.
  The AC3/DC2/DC3 variants are not modelled (needs-photo gap on the
  device).
attrs:
  model: JNP10K-PWR-AC2
  role: ac-power-supply
  power-output-w: 5500
provenance:
  positions: >-
    FIELDS, since 1.1.0 (docs/switch-positions-design.md, #808): `state`, each `off` or `on`. Each rocker is a SEE-SAW: one surface tipped about its centre, so the end it is set to presses in and the other end rises. I at the left and O at the right of the rocker, as the photograph prints them; OFF raises the I end and ON the O end, each a node shown for its position, shaded lighter toward its raised end and built in 3D as a sloped profile. The heights are estimated. The skin draws OFF; nothing held says how a unit ships.
  size: 'photo - the rear studio figure g101087 anchored to the 442 mm
    chassis width gives the PSU face ~84 x 97 mm; the vendor table states
    only assembly depths for this unit'
  power-output: 'datasheet-table - the guide capacity table: two supplies
    at high power deliver 11,000 W; 5,500 W each'
  face: 'photo - g101087: two inlets left of centre column, lamp strip,
    DIP, rocker'
states:
- ok
- fault
- absent
parts:
- {ref: std/c20-inlet@1, id: inp2, at: [42.0, 16.0], attrs: {function: feed INP2}}
- {ref: std/c20-inlet@1, id: inp1, at: [42.0, 64.0], attrs: {function: feed INP1}}
size:
  w: 84.0
  h: 97.0
fields:
  state: {label: State, type: choice, options: ['off', 'on'], default: 'off'}
relief:
  features:
  - {node: rocker-off, out: 2.5, profile: [[0, 2.5], [12.0, 1.1]], confidence: estimated, source: 'the tilt of a see-saw rocker: the raised end at the part''s own estimated rocker height, the low end at 0.45 of it, the ratio the GL-12xB GLB rocker shows (common/rocker-switch@1); no source gives this part''s; the rocker''s 2.5 is assumed'}
  - {node: rocker-on, out: 2.5, profile: [[0, 1.1], [12.0, 2.5]], confidence: estimated, source: 'the tilt of a see-saw rocker: the raised end at the part''s own estimated rocker height, the low end at 0.45 of it, the ratio the GL-12xB GLB rocker shows (common/rocker-switch@1); no source gives this part''s; the rocker''s 2.5 is assumed'}
