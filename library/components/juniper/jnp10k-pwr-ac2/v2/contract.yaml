  - {node: rocker-on, out: 2.5, profile: [[0, 1.1], [13.0, 2.5]], confidence: estimated, source: 'the tilt of a see-saw rocker: the raised end at the part''s own estimated rocker height, the low end at 0.45 of it, the ratio the GL-12xB GLB rocker shows (common/rocker-switch@1); no source gives this part''s; the rocker''s 2.5 is assumed'}
