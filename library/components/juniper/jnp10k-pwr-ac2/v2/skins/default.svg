<svg xmlns="http://www.w3.org/2000/svg" width="91.4mm" height="88.9mm" viewBox="0 0 91.4 88.9">
  <defs>
    <linearGradient id="rocker-g-off" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2d31"/><stop offset="1" stop-color="#0b0c0d"/></linearGradient>
    <linearGradient id="rocker-g-on" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b0c0d"/><stop offset="1" stop-color="#2a2d31"/></linearGradient>
    <pattern id="hex" x="0" y="0" width="4.6" height="3.98" patternUnits="userSpaceOnUse">
      <polygon points="2.0,0.995 1.575,1.73 0.725,1.73 0.3,0.995 0.725,0.26 1.575,0.26" fill="#3a3e43"/>
      <polygon points="4.3,0.995 3.875,1.73 3.025,1.73 2.6,0.995 3.025,0.26 3.875,0.26" fill="#3a3e43"/>
      <polygon points="0.85,2.985 0.425,3.72 -0.425,3.72 -0.85,2.985 -0.425,2.25 0.425,2.25" fill="#3a3e43"/>
      <polygon points="3.15,2.985 2.725,3.72 1.875,3.72 1.45,2.985 1.875,2.25 2.725,2.25" fill="#3a3e43"/>
      <polygon points="5.45,2.985 5.025,3.72 4.175,3.72 3.75,2.985 4.175,2.25 5.025,2.25" fill="#3a3e43"/>
    </pattern>
  </defs>
  <rect id="face" x="0" y="0" width="91.4" height="88.9" rx="0.8" fill="#565b61" stroke="#44484d" stroke-width="0.5"/>
  <g id="vents"><rect x="1.6" y="1.4" width="40.0" height="86.1" fill="url(#hex)"/></g>
  <g id="handle">
    <rect x="46.0" y="38.0" width="28.0" height="8.0" rx="3.6" fill="#33373c" stroke="#26292d" stroke-width="0.5"/>
