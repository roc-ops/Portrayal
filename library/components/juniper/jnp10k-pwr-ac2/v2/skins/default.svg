    <g id="t4-silkscreen"><text x="53.9" y="34.6" font-family="Arial" font-size="0.9" fill="{WSILK}" text-anchor="middle">PWR OK</text></g>
    <g id="t5-silkscreen"><text x="72.4" y="29.4" font-family="Arial" font-size="0.9" fill="{WSILK}" text-anchor="middle">INP2</text></g>
    <g id="t6-silkscreen"><text x="78.3" y="34.6" font-family="Arial" font-size="0.9" fill="{WSILK}" text-anchor="middle">INP1</text></g>
