  <g id="dip">
    <rect x="60.0" y="29.0" width="8.7" height="5.0" rx="0.6" fill="#c0392b" stroke="#7d2419" stroke-width="0.3"/>
  </g>
  <g id="lamps">
    <circle id="led-fault" cx="47.9" cy="31.5" r="0.8" fill="#0f1113" stroke="#33373c" stroke-width="0.25"/>
    <circle id="led-pwr-ok" cx="53.9" cy="31.5" r="0.8" fill="var(--led-color, #3a3f44)" stroke="#33373c" stroke-width="0.25"/>
    <circle id="led-inp2" cx="72.4" cy="31.5" r="0.8" fill="#0f1113" stroke="#33373c" stroke-width="0.25"/>
    <circle id="led-inp1" cx="78.3" cy="31.5" r="0.8" fill="#0f1113" stroke="#33373c" stroke-width="0.25"/>
  </g>
  <g id="switch">
    <g id="rocker-off" data-show-from="state" data-show="off"><rect x="56.0" y="76.0" width="13.0" height="8.0" rx="1.2" fill="url(#rocker-g-off)" stroke="#3a3e43" stroke-width="0.4"/><g id="rocker-off-silkscreen"><text x="59.8" y="81.2" font-family="Arial" font-size="2.0" fill="#c7ccd1" text-anchor="middle">I</text><text x="65.2" y="81.2" font-family="Arial" font-size="2.0" fill="#c7ccd1" text-anchor="middle">O</text></g></g>
    <g id="rocker-on" data-show-from="state" data-show="on" display="none"><rect x="56.0" y="76.0" width="13.0" height="8.0" rx="1.2" fill="url(#rocker-g-on)" stroke="#3a3e43" stroke-width="0.4"/><g id="rocker-on-silkscreen"><text x="59.8" y="81.2" font-family="Arial" font-size="2.0" fill="#c7ccd1" text-anchor="middle">I</text><text x="65.2" y="81.2" font-family="Arial" font-size="2.0" fill="#c7ccd1" text-anchor="middle">O</text></g></g>
