format: 1
kind: module
name: mic-3d-40ge-tx
version: 1.1.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper Tri-Rate 40-port RJ45 MIC, dual-wide: it seats across both MIC slots of its MPC, which the bay system cannot express, so it is here for reference and in no accepts list (roc-ops/Portrayal#34). MIC form (168 x 27 window; the earlier 31 mm reading was the bay opening with bezel - a MIC must seat inside the 29.5 mm MPC face, so the window is 27).
unplaced: >-
  no MPC in this library accepts it. It is DUAL-WIDE - it seats across both MIC slots of its
  MPC - and the MPC contracts model two separate single-width bays, so there is no bay shaped
  like this card to list it in. Seating it needs a way to say that one module fills two bays,
  which the format does not have.
attrs:
  model: MIC-3D-40GE-TX
  power-draw-max-w: 41
provenance:
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: 'datasheet-table - the module reference model section states the requirement; 41 W max'
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
