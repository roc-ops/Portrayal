description: >-
  Juniper Tri-Rate 40-port RJ45 MIC - DUAL-WIDE: it seats across both MIC slots of its MPC, which the bay system cannot express, so it exists for reference and is not in any accepts list (ndv#34). MIC form (168 x 27 window; the earlier 31 mm reading was the bay opening with bezel - a MIC must seat inside the 29.5 mm MPC face, so the window is 27).
