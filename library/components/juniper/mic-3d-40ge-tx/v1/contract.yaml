format: 1
kind: module
name: mic-3d-40ge-tx
version: 1.2.3
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper Tri-Rate 40-port RJ45 MIC, dual-wide: it seats across both MIC slots of its MPC, which the bay system cannot express, so it is here for reference and in no accepts list (roc-ops/Portrayal#34). MIC form (168 x 27 window; the earlier 31 mm reading was the bay opening with bezel - a MIC must seat inside the 29.5 mm MPC face, so the window is 27).
unplaced: >-
  SUPERSEDED by juniper/mic-3d-40ge-tx@2, the MIC plate re-measured at 168.8 x 29.2 and the
  carriers re-laid to match (#261, part 2). This major is kept and deprecated rather than
  deleted, so a manifest that pins it still resolves (#448); nothing in this library seats it.
  Before it was retired: no MPC in this library accepts it. It is DUAL-WIDE - it seats across
  both MIC slots of its MPC - and the MPC contracts model two separate single-width bays, so
  there is no bay shaped like this card to list it in. Seating it needs a way to say that one
  module fills two bays, which the format does not have.
superseded-by: juniper/mic-3d-40ge-tx@2
attrs:
  model: MIC-3D-40GE-TX
  power-draw-max-w: 41
provenance:
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU table - MX240 guide Table 93 'FRU Power Requirements', MIC section:
    '| Tri-Rate MIC | MIC-3D-40GE-TX | 41W |', in nine guides. A maximum for the MIC alone, without
    optics; the row prints no temperature ladder, so there is no ambient to name and none is
    claimed. The module reference reaches the same number by a second route - 'Power requirement:
    0.85 A @48 V (41 W)' - which corroborates the value without adding a rung, being an electrical
    figure at no stated ambient.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
  groups: >-
    Juniper MX Series 5G Universal Routing Platform Interface Module Reference, 'Tri-Rate MIC' (printed
    pages 353 to 357): '40 autonegotiating 10BASE-T, 100BASE-TX, or 1000BASE-T Megabit Ethernet ports'
    reached through RJ-45 connectors, at 'speeds of 10 Mbps, 100 Mbps, or 1000 Mbps'; port 0 through 9
    within each of four logical PICs. Carried as 1g, the top of the autonegotiating range, as the
    library states a tri-speed jack. The role is traffic.
states:
- ok
- fail
- absent
