format: 1
kind: module
name: mic-3d-40ge-tx
version: 2.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper Tri-Rate 40-port RJ45 MIC, dual-wide: it seats across both MIC slots of its MPC, which the bay system cannot express, so it is here for reference and in no accepts list (roc-ops/Portrayal#34). Dual-wide: one 338.1 x 29.2 plate across both MIC slots of its MPC, the span of the two photo-measured MIC windows (#261).
unplaced: >-
  no MPC in this library accepts it. It is DUAL-WIDE - it seats across both MIC slots of its
  MPC - and the MPC contracts model two separate single-width bays, so there is no bay shaped
  like this card to list it in. Seating it needs a way to say that one module fills two bays,
  which the format does not have.
attrs:
  model: MIC-3D-40GE-TX
  power-draw-max-w: 41
provenance:
  size: >-
    photo-measured - the MIC plate, 168.8 x 29.2, from the MX104 and MX80 front photographs as
    size-notes says: plates 520, 521 and 520.5 px at 3.090 px/mm on the MX104 (body 1350.5 px over 437.0
    mm; the ganged-SFP pitch reads 44.0 to 44.2 px, 3.091), 521.8 and 522.5 px at 3.088 on the MX80
    (ganged-SFP pitch 44.0 px; 1374 px between the ear wings over 445.0 mm agrees); heights 90 to 90.75
    px. The dual-wide width is the two windows and their seam, 168.8 + 0.5 + 168.8.
  power: >-
    guide FRU table - MX240 guide Table 93 'FRU Power Requirements', MIC section:
    '| Tri-Rate MIC | MIC-3D-40GE-TX | 41W |', in nine guides. A maximum for the MIC alone, without
    optics; the row prints no temperature ladder, so there is no ambient to name and none is
    claimed. The module reference reaches the same number by a second route - 'Power requirement:
    0.85 A @48 V (41 W)' - which corroborates the value without adding a rung, being an electrical
    figure at no stated ambient.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
  layout: >-
    estimated - RE-ENVELOPED, NOT REDRAWN, at 2.0.0 (#261): every part and printed mark of the 1.x art
    moved by (-2.45, +1.1) onto the measured plate (centring the old art where its width allows);
    positions along the plate stay as 1.x had them. What 1.x said of them: registry + layout - the face
    is the slot geometry of its chassis family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate drawing. No faceplate figure was
    usable for this model
