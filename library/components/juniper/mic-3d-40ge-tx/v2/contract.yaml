size-notes: >-
  w and h are the dual-wide plate (#261): one plate across both MIC slots of its MPC. The MX2010
  photograph seats a dual-wide MIC (40 RJ45s) whose plate runs the length of both windows with no seam
  between them, 325 px against 162.5 px for one single-wide MIC; the width is the span of the
  carrier's two photo-measured 168.8 mm windows and the 0.5 mm seam between them. The height is the
  single-wide MIC's 29.2.
