format: 1
kind: module
name: qfx5230-jnp-3000w-dc-afo
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  JNP-3000W-DC-AFO (product number 740-073766), a 3000 W DC power supply with front-to-back airflow (AIR OUT,
  port-to-FRU). It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares with its
  twin; the QFX5230-64CD-D-AFO ships with two. The face carries a round fan guard with a Juniper gold handle
  across it, a terminal block under a cover, an input current selector (a DIP switch, set to 80 A for this
  unit), an ejector lever and one lamp. The AIR IN sibling is JNP-2400W-DC-AFI, a 2400 W unit with a green
  handle. AC and DC supplies, and supplies of different airflow direction, are never mixed in one chassis.
attrs:
  model: JNP-3000W-DC-AFO
  role: dc-power-supply
  power-output-w: 3000
  airflow: front-to-back
  inlet: dc-terminal
  input: -40 to -72 VDC, rated -48 to -60 VDC, 90 A maximum (guide Tables 18 and 21); output 12 V at 250 A and 12 V standby at 1 A
provenance:
  size: >-
    borrowed - qfx5230-jnp-3000w-ac-afo, the AC supply that stands in the same bay: the guide's figures 20 and
    22 draw the AC and DC supplies as one outline with a different connector end, and no photograph of a DC
    supply is held. The 74.8 by 40.2 mm face is photo-measured on the AC supply.
  depth: >-
    not stated. Searched the QFX5230-64CD hardware guide (figure 22, the DC power supply description and the
    physical specifications) for the supply's depth or weight. Figure 22 is an isometric with no scale. No depth
    is written.
  face: >-
    estimated - no flat figure or photograph of the DC supply is held. Figure 22 is an isometric: it shows the
    ejector lever, the input current selector, a terminal block cover that is ridged, and a handle at the lower
    left. The face is drawn as the AC supply's, with the inlet replaced by a ridged cover of the same size and the
    fan guard, handle and latch as the AC supply has them. The ridges and the cover's size are drawn from the
    isometric and the AC supply's inlet block, and are estimated.
  power-output-w: >-
    datasheet - the part number and guide Tables 4 and 16 (DC AFO, 3000 W; output 12 V at 250 A, 12 V standby at
    1 A; Table 22). An OUTPUT, since a supply provides power.
  leds: >-
    datasheet - guide, QFX5230-64CD DC Power Supply LEDs (figure 23, Table 20): solid green is output on and OK;
    off is no DC power to any supply; a 1 Hz green blink is DC input present with only the 12 V standby on; amber
    is a DC cord unplugged while a second supply still has input, or a critical event; a 2 Hz green blink is
    firmware upload.
  seats: >-
    A DECLARED STAND-IN. Figure 39 of the QFX5230 guide shows threaded studs, a lug and nuts per supply in an unscaled
    isometric with the cover and nuts off; no held figure gives the studs' position on the face, which pair is which,
    any printed mark, or a flat view. Each polarity is juniper/mx240-dc-pole@1, a pair of studs on 5/8 in. (15.875) centres that one two-hole
    lug lands across, drawn side by side inside the footprint of the terminal block cover (x 42.2 to 66.6, y 3.7 to
    36.1), one pair above the other, centred on the cover. Every position is estimated. THE LUG'S PITCH IS PRINTED
    AND THE STUDS' IS NOT: the QFX5700 Hardware Guide, "QFX5700 DC Power Lugs" (printed page 49), says the cable
    lugs "are dual hole and sized to fit M6 at 15.86-mm (0.625-in.) center line", and its installation steps name
    "the four terminal studs", two for each lug. 15.86 mm is the registered 5/8 in. pitch. The QFX5230-64CD
    Hardware Guide, Figure 39 (printed page 99), draws a lug and a pair of nuts over the studs of each supply, with
    threads, and prints no spacing or size. The lug's size (M6) is read from the QFX5700 guide for the same part
    number; no document held gives the studs' size or height: the studs are common/terminal-screw-34@1 inside the
    pole, which claims no thread although Figure 39 draws one. Both guides draw the block under a ridged cover, so
    the studs stand where the cover is drawn, and no figure gives their position on the face.
  poles: >-
    datasheet - QFX5230-64CD Hardware Guide, installation step 7 (printed page 99): "two terminals labeled -48V/-60V
    (negative) and RTN (positive)". The roles are the text's: `batt` for -48V/-60V (spec/schemas/dc.yaml writes `batt`
    as negative (battery)) and `rtn` for RTN. NO FIGURE PRINTS A MARK AT THE BLOCK AND THE TEXT GIVES NO ORDER, so
    which pair is above the other is not read from any document: RTN is drawn upper and -48V/-60V lower, an
    estimate. One input, so one port, `input`, of two poles.
  voltage: >-
    NOT STATED AS ONE FIGURE. Table 18 gives -40 to -72 VDC with a rated range of -48 to -60 VDC. A nominal that is a
    range is not one figure, so the port states none; `attrs` keeps the range as it already carried it.
  rating: >-
    NOT STATED. Table 21 sets the input current selector to 80 A and gives 90 A as the maximum input current, two
    figures for one supply, and a port's `rating-a` is one figure, so the port states none.
  airflow: >-
    datasheet - guide Tables 3, 6 and 16: JNP-3000W-DC-AFO is port-to-FRU, front-to-back, and carries a Juniper
    gold handle.
  input: >-
    datasheet - guide Table 18 (AFO DC 3000 W: -40 to -72 VDC, rated -48 to -60 VDC; the rated cell of the AFO row
    is misprinted "50-60 Hz") and Table 21 (input switch setting 80 A, maximum input current 90 A DC).
states:
- ok
- fault
- absent
elements:
  led-pwr:
    at: [67.9, 31.1]
    size: [3.0, 3.0]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  latch:
    at: [1.9, 15.6]
    size: [41.3, 8.5]
    class: latch
  release-latch:
    at: [68.5, 13.6]
    size: [6.3, 13.6]
    class: latch
size:
  w: 74.8
  h: 40.2
size-confidence: {w: borrowed, h: borrowed}
relief:
  features:
  - node: latch
    out: 1.6
    color: '#e8731f'
    confidence: estimated
    source: photo of the AC sibling - the handle bar stands proud of the fan guard; its projection is not measured
parts:
  - {ref: juniper/mx240-dc-pole@1, id: pole-rtn, at: [44.7625, 11.3]}
  - {ref: juniper/mx240-dc-pole@1, id: pole-batt, at: [44.7625, 25.1]}
dc:
  ports:
    - id: input
      direction: input
      poles:
        - {role: rtn, slot: pole-rtn}
        - {role: batt, slot: pole-batt}
      source: {poles: poles}
