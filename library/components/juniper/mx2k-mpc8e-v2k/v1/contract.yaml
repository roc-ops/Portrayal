format: 1
kind: module
name: mx2k-mpc8e-v2k
version: 1.1.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MX2K-MPC8E carrier for the MX2010/MX2020 - two multirate MIC slots (Table 14). Vertical form for the MX2000 cage.
attrs:
  model: MX2K-MPC8E
  power-draw-max-w: 805
provenance:
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. carrier face; the MIC windows dominate it'
  power: >-
    guide FRU power table, MX chassis guides: '688 W(Typical) 805 Wat 55 C 720 Wat 40 C'. The max at 55 C is
    carried, because the worst rated case is what a chassis budget needs.
    Read off the row, with the part number alone in its own cell - the looser
    extraction that preceded this put the MPC7E's number on the MPC6E and took a
    25 C figure for a max, so a row only counts here when nothing else in it
    could be the subject.
    The note this replaces said the module reference does not carry it. True of
    the book it named; the chassis guides do.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
states:
- ok
- fail
- absent
bays:
  mic0:
    at: [7.0, 30.0]
    size: [27.0, 168.0]
    accepts:
    - juniper/mic-mrate@1
    - juniper/mic-macsec-mrate@1
    - juniper/mx-mic-blank-v@1
    default: juniper/mic-mrate@1
  mic1:
    at: [7.0, 214.0]
    size: [27.0, 168.0]
    accepts:
    - juniper/mic-mrate@1
    - juniper/mic-macsec-mrate@1
    - juniper/mx-mic-blank-v@1
    default: juniper/mx-mic-blank-v@1
size:
  w: 41.0
  h: 425.0
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  w and h are the MX2000 vertical card slot opening (the MX2010/MX2020 bays are 41.0 x 425.0),
  which an MPC reaches through its adapter card, not the part. Nothing measured the card:
  provenance/size says so in as many words, and #261 found the same model number drawn at two
  different sizes because two chassis have two openings. Juniper's hardware guides for the
  MX240, MX480 and MX960 all state an MPC/DPC/SCB as 17 x 22 x 1.25 in - the MX960's own book
  included, which is the vendor saying it is ONE card in both orientations - but those figures
  are rounded to the quarter inch, and 1.25 in is 31.75 mm against a modelled 30.45 mm slot
  pitch, so they cannot settle a drawing to 0.1 mm. Estimated until a mechanical drawing or a
  ruler on a real card turns up.
