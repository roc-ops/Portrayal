name: jnp-mic-blnk-3
version: 1.1.0
class: blank
behaviour: fills
profile: networking
description: >-
  Juniper JNP-MIC-BLNK-3 - the MX10003 MIC1 slot blank cover panel (guide FRU
  list).
attrs:
  model: JNP-MIC-BLNK-3
provenance:
  size: 'registry + layout - the MIC1 slot geometry; the guide names the
    part but does not dimension it separately'
states:
- ok
- absent
size:
  w: 197.3
  h: 41.9
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  w and h are a chassis slot opening, not the part. Nothing measured the card: provenance/size
  says so in as many words, and #261 found the same model number drawn at two different sizes
  because two chassis have two openings. Juniper's hardware guides for the MX240, MX480 and
  MX960 all state an MPC/DPC/SCB as 17 x 22 x 1.25 in - the MX960's own book included, which is
  the vendor saying it is ONE card in both orientations - but those figures are rounded to the
  quarter inch, and 1.25 in is 31.75 mm against a modelled 30.45 mm slot pitch, so they cannot
  settle a drawing to 0.1 mm. Estimated until a mechanical drawing or a ruler on a real card
  turns up.
