description: >-
  Juniper channelized SONET/SDH OC3/STM1 multirate MIC with SFP (four ports). Vertical author for the vertical carriers (MX960/MX2000 MPCs stand on end, and their MICs with them).
attrs:
  model: MIC-3D-4CHOC3-2CHOC12
  power-draw-max-w: 41
provenance:
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU power table, MX chassis guides: '| Channelized SONET/SDH OC3/ STM1 (Multi-Rate) MICs with SFP | 4-Port: MIC-3D-4CHOC3-2CHOC12 | 4-Port: 41 Wat 131° F ('. The 55 C rung is
    carried, being the worst rated case a chassis budget has to survive.
    Taken by matching the row's OWN LABEL: these tables pair parts with figures
    in one row - `4-Port: X 8-Port: Y` against `4-Port: 41 W 8-Port: 52 W` - and
    reading first-wins puts the small card's number on the big one. Aligning on
    the N-Port label instead is self-checking, and it checks out: 4-port 41 W
    against 8-port 52 W, 4-port 24 W against 8-port 29 W.
    Seen in 9 guide(s): mx2008, mx2010-p0001-0300, mx2010-p0301-0600, mx2020-p0001-0300.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
