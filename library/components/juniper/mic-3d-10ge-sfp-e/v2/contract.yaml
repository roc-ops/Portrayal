size:
  w: 168.8
  h: 29.2
size-confidence: {w: photo-measured, h: photo-measured}
size-notes: >-
  w and h are the MIC's own plate, photo-measured (#261). Square-on front photographs of the MX104 and
  the MX80 put four plates at 168.3 to 169.2 by 29.1 to 29.3 mm, each photograph scaled two
  independent ways - across its chassis body and on the SFF-8433 ganged-SFP pitch of 14.25 mm, which
  agree to 0.1% - and the MX2010 photograph's ratio of MIC to MPC plate (162.5 to 379.5 px) agrees.
  The guides' MIC rows (6.25 x 6.8 x 1.25 in, the axes assigned differently in different books) do not
  dimension the face and are not used. Until 2.0.0 this was the 168 x 27 'window', an estimate read
  off the carrier.
