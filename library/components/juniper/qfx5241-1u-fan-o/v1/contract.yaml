name: qfx5241-1u-fan-o
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  QFX5241-1U-FAN-O, the field-replaceable fan module of the QFX5241-32OD, with front-to-back airflow (AIR OUT,
  port-to-FRU, also written AFO). Air comes in at the port side and leaves at the back. It is marked AIR OUT on a
  black chip on its orange handle. Each module holds two rotors, and the cooling system is N+1. It is
  hot-removable and hot-insertable. The switch takes seven, in slots 0 to 6 from left to right, between the two
  power supplies. The guide describes no back-to-front module for the QFX5241-32OD.
attrs:
  model: QFX5241-1U-FAN-O
  airflow: front-to-back
  power-absent: not-published
provenance:
  size: >-
    photo-measured - the Juniper studio rear photograph of the QFX5241-32OD (2100 x 641 px; the body is 1842 px
    wide, which is the guide's Table 10 width of 17.26 in at 4.202 px/mm): the module's plate measures 40.5 mm wide
    and 40.2 mm high, on a 45.3 mm pitch. The guide's Table 8 states the module as "40 mm x 56 mm" and does not say
    which edge is which; the photograph's 40.2 mm height agrees with the 40 mm side.
  depth: >-
    not stated. Searched the QFX5241-32OD hardware guide (Tables 8 and 9, the cooling system section, the fan module
    figures) for the module's depth. No depth is written rather than a guessed one.
  face: >-
    photo - the studio rear photograph at 2.8 times zoom: a plate of hexagonal punched holes, a small captive screw
    at the upper left, and a sloping handle band across the plate, with two slots either side of a black AIR OUT
    chip carrying a fan symbol. Positions are read off the photograph and estimated to about 0.4 mm. The handle
    colour is the photograph's orange; the guide does not name it.
  airflow: >-
    datasheet - guide Tables 4 and 8 and the cooling system text: seven front-to-back (airflow out) fan modules,
    "AIR OUT" on the label.
  power: >-
    not published. Searched the QFX5241-32OD hardware guide (the cooling system, Tables 4, 8 and 9) for a figure
    per module: only whole-switch figures exist. The module declares power-absent so the missing figure is a
    statement and not a silence.
