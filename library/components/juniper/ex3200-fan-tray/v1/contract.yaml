format: 1
kind: module
name: ex3200-fan-tray
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  Fan tray of the Juniper EX3200 switches: one field-replaceable tray with a single fan, set in the
  rear panel between the console and USB ports and the power supply (seen from behind). A plate with
  a honeycomb grille over the fan and a captive thumbscrew at its left end. It cools the chassis side
  to rear and is hot-removable and hot-insertable. The guide gives it no part number.
attrs:
  model: EX3200 fan tray
  role: fan-tray
  fans: 1
  airflow: side-to-rear
  airflow-cfm: 23.5
provenance:
  existence: >-
    datasheet - EX3200 Switch Hardware Guide (Juniper Networks, published 2020-12-15), EX3200 Cooling
    System: "a field-replaceable unit (FRU) fan tray with one fan (see Figure 14)", and Fan Tray: "located
    at the rear of the chassis". "The fan tray located at the rear of the chassis provides side-to-rear
    chassis cooling" (Figure 15). No part number is given in the guide or the datasheet, so it is a part
    of its own and not the EX4200 tray, which the EX4200 guide describes with three fans
  airflow: >-
    datasheet - EX3200 Ethernet Switches datasheet (Juniper Networks, 1000216-013-EN, Nov 2011),
    Cooling: "Field-replaceable fan tray", "Airflow: 23.5 cfm"
  size: >-
    estimated - 140.8 x 39.9 mm, read off the rear panel figure (Figure 3, g020052, a vector drawing:
    the chassis outline 1407 px across for 438.2 mm, 3.211 px per mm, and its face 137 px high for
    44.45 mm, so 4 percent foreshortened vertically): the plate from the notch at the left of its
    thumbscrew to the power supply slot, and from the top of the rear face nearly to its foot. Good to
    about 2 mm
  face: >-
    drawing - guide Figure 3 and Figure 14 (Fan Tray Used in an EX3200 Switch): a plate with a honeycomb
    band over the left part of its face, a plain area to its right and one thumbscrew at the left. No
    photograph of the rear is held, so its colour is estimated
  power: >-
    The guide and the datasheet give no fan power figure; none is written, and the library's power
    warning for this module stands
states: [absent]
