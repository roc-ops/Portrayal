format: 1
kind: module
name: jnp10004-fan2
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  Juniper JNP10004-FAN2 fan tray - two fill the MX10004 rear beside the
  PSU stack, each a 176 x 293 mm door of six round fans behind rounded
  honeycomb cells, with FAN / FTC / SIB STATUS lamps and two grab bars.
  Removing one exposes the six SFBs. The FAN3 variant shares the door.
attrs:
  model: JNP10004-FAN2
  power-draw-max-w: 651
provenance:
  size: 'photo - the rear studio figure g101087 anchored to the 442 mm
    chassis width; ~176 x 293 mm per tray, approximate'
  power: >-
    guide FRU power table (Component | Model Number | Maximum Power Requirement), MX chassis
    guides: '| JNP10004-FAN2 | MX10004 fan tray | 651W | 651W | 651W |'. MX10004 guide,
    Table 55, whose header reads 'At 77 F (25 C) | At 104 F (40 C) | At 131 F (55 C)'. This
    tray is rated the same at all three ambients.
  face: 'photo - g101087: 2x3 rounded mesh cells, lamp strip, heat chips,
    two horizontal bars'
