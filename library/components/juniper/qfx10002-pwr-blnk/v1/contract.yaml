format: 1
kind: module
name: qfx10002-pwr-blnk
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Juniper QFX10002-PWR-BLNK, the power supply blank cover of the QFX10002 switches. It covers an
  unused power supply bay for safety, cooling and emissions control. The QFX10002-36Q ships with
  two of them in the upper bays, and a 72Q run on one or two supplies needs them in the rest. It
  is a plain plate with a finger hold at each end: squeeze the finger holds and pull straight out.
attrs:
  covers: power supply bay
part-numbers:
  QFX10002-PWR-BLNK: {part: QFX10002-PWR-BLNK}
provenance:
  sources: >-
    datasheet - QFX10002 Switch Hardware Guide (Juniper Networks, published 2026-02-11). Table 30
    ("3 fans and 2 AC power supplies installed, 2 blanks" for the 36Q), the caution under
    Component Redundancy ("install a power supply cover (QFX10002-PWR-BLNK) in any unused power
    bays"), Table 4, Removing a Power Supply (step 9) and Installing a Power Supply (step 2), with
    Figures 48, 49 and 50 (perspective; Figure 48 is g050643) and the flat Figure 5 (g050404), which
    draws the 36Q's two blanks in the upper bays.
  size: >-
    drawing - the plate fills the bay frame measured on Figure 5, 74.1 x 40.6 mm. The guide gives
    no dimension for the blank. Figure 5 draws each blank as a plain rectangle the size of the bay.
  depth: >-
    estimated - not stated. The blank has no body behind the plate in the model.
  face: >-
    estimated - Figure 5 (flat) draws a plain plate with no marking. The text names finger holds,
    and the perspective Figures 48 to 50 draw a D-shaped hold near each end. They are drawn as two
    shallow wells, 11 mm wide and 18 mm tall, read off the perspective and not measurable.
  colour: >-
    estimated - the guide's line drawings carry no colour and no photograph of a blank is held,
    so the plate is a neutral grey that reads against the silver supply and the dark chassis.
states: [absent]
elements:
  grip-left:
    at: [3.0, 11.3]
    size: [11.0, 18.0]
    class: latch
  grip-right:
    at: [60.1, 11.3]
    size: [11.0, 18.0]
    class: latch
size: {w: 74.1, h: 40.6}
size-confidence: {w: drawing, h: drawing}
skins: [default]
