format: 1
kind: module
name: mic-macsec-20ge
version: 1.3.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MACsec Gigabit Ethernet MIC - twenty SFP cages in two PIC groups of ten. MIC form (168 x 27 window; the earlier 31 mm reading was the bay opening with bezel - a MIC must seat inside the 29.5 mm MPC face, so the window is 27).
attrs:
  sfp: 20
  model: MIC-MACSEC-20GE
  power-draw-max-w: 60
provenance:
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is
    the upper cage upright (rotate 0) over the lower turned 180, so both cage lips face
    the band between the two cages and both bails face outward. Decided by the rule, not
    an observation, so a photograph of the stack overturns it: the 10 SFP pairs
    (port-0-0/port-0-1 to port-1-8/port-1-9). 10 of these were drawn with the upper cage
    turned before the std cage art moved its lip to the bottom of the opening; turning
    them keeps the lips in the middle band where they were drawn and seats every optic
    bail-outward. Turning a composed cage in place changes no box, id or anything a
    device places, so it is a minor bump (S6).
  sfp-rate: >-
    the cage RATE, transcribed from this contract's own description: 'MACsec Gigabit
    Ethernet MIC - twenty SFP cages in two PIC groups of ten'. Without it `cage_type` finds
    no media attr for the sfp family and falls through to PART_IFACE's default, which is
    SFP+ at 10G - a rate this card does not run. Nothing new was measured.
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    MX module reference, the MIC-MACSEC-20GE section: 'Typical power requirement: 1A @ 48V
    (48 W)  Maximum power requirement: 1.25A @ 48V (60 W)'. The maximum is carried. The
    vendor gives current and voltage beside each figure and its own arithmetic agrees: 1 x
    48 = 48 and 1.25 x 48 = 60. NO AMBIENT IS STATED here - the section gives typical and
    maximum rather than a temperature ladder - so none is recorded rather than invented.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
