format: 1
kind: module
name: mx104-re
version: 1.2.0
class: supervisor
behaviour: fills
profile: networking
description: >-
  Juniper MX104 Routing Engine (RE-MX-104) - a slim half-height FRU, two
  stacked at the front right (RE0 below RE1). MASTER / OK-FAIL / ONLINE
  lamps, RESET and ONLINE/OFFLINE buttons, USB 0/1, AUX and CONSOLE RJ45s
  and the ETHERNET management port.
attrs:
  model: RE-MX-104
  power-absent: not-published
provenance:
  speed: 'guide - MX104 hardware guide, RJ-45 pinout section: the ETHERNET port is an autosensing
    10/100/1000-Mbps Ethernet RJ-45 receptacle. Carried as 1g, the top of the autosensing range,
    which is how the library states a tri-speed jack'
  media: 'the RJ-45 jacks are typed by what runs through them rather than by the housing: console
    and auxiliary ports are rj45-serial (RS-232), a time-of-day port is rj45-tod and a BITS
    port is rj48, the media the library devices already use for the same jacks'
  size: 'photo - ~145 x 22.5 mm read off the reference photograph; the RJ45
    fit is what bounds the height (a first reading gave 13.9 mm rows, which
    cannot hold a 14 mm jack - the plausibility check moved the band
    boundary). No vendor RE dimension in the intake'
  power: >-
    NOT PUBLISHED. The chassis guide for this part is staged and converted, its FRU power
    requirements table is present, and THIS PART IS NOT IN IT - which is a stronger
    statement than the figure merely being absent: the vendor tabulated the components it
    budgets for and did not tabulate this one. Searched beyond that table as well - all 573 converted documents, for this part, with a twelve-line window either side and a
    thirty-line window against any line introducing a power requirement or consumption. No
    wattage falls near a mention anywhere.
    Weaker here than for the others in this group: the MX104 guide carries no FRU power
    requirements table at all, so this is an absence from a book that never made the list
    rather than an omission from one that did.
states:
- ok
- fail
- absent
groups:
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: the Routing Engine management cluster - the out-of-band Ethernet jack, the RJ-45
      serial ports and the USB service port. One job (reaching and disciplining the box),
      several media
parts:
- {ref: std/usb-a@1, id: usb0, group: mgmt, at: [39.0, 9.75], rotate: 90, attrs: {function: USB 0}}
- {ref: std/usb-a@1, id: usb1, group: mgmt, at: [47.0, 9.75], rotate: 90, attrs: {function: USB 1}}
- {ref: std/rj45@2, id: aux, group: mgmt, at: [62.1, 6.15], attrs: {media: rj45-serial, function: auxiliary console}}
- {ref: std/rj45@2, id: console, group: mgmt, at: [80.1, 6.15], attrs: {media: rj45-serial, function: serial console}}
- {ref: common/rj45-eth@1, id: ethernet, group: mgmt, at: [108.1, 6.15], attrs: {speed: 1g, media: rj45, function: out-of-band management}}
size:
  w: 145.0
  h: 22.5
