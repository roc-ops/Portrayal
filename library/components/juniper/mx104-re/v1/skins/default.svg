<svg xmlns="http://www.w3.org/2000/svg" width="145.0mm" height="22.5mm" viewBox="0 0 145.0 22.5">
  <rect id="face" x="0" y="0" width="145.0" height="22.5" rx="0.6" fill="#c9ccd0" stroke="#9ba0a6" stroke-width="0.4"/>
  <g id="lamps">
    <circle id="led-master" cx="12.0" cy="6.5" r="0.9" fill="#0f1113" stroke="#3a3e43" stroke-width="0.25"/>
    <circle id="led-ok-fail" cx="17.0" cy="6.5" r="0.9" fill="var(--led-color, #3a3f44)" stroke="#3a3e43" stroke-width="0.25"/>
    <circle id="led-online" cx="12.0" cy="12.0" r="0.9" fill="#0f1113" stroke="#3a3e43" stroke-width="0.25"/>
    <circle id="btn-reset" cx="24.0" cy="6.5" r="1.1" fill="#17191c"/>
    <circle id="btn-online" cx="24.0" cy="13.5" r="1.6" fill="#26292d" stroke="#565b60" stroke-width="0.35"/>
  </g>
  <g id="silkscreen">
    <g id="t11-silkscreen"><text x="14.5" y="3.4" font-family="Arial" font-size="1.2" fill="#3a3e43" text-anchor="middle">OK/FAIL</text></g>
    <g id="t12-silkscreen"><text x="8.0" y="7.2" font-family="Arial" font-size="1.2" fill="#3a3e43" text-anchor="end">MASTER</text></g>
    <g id="t13-silkscreen"><text x="8.0" y="12.7" font-family="Arial" font-size="1.2" fill="#3a3e43" text-anchor="end">ONLINE</text></g>
    <g id="t14-silkscreen"><text x="28.0" y="7.2" font-family="Arial" font-size="1.2" fill="#3a3e43" text-anchor="start">RESET</text></g>
    <g id="t15-silkscreen"><text x="28.0" y="12.7" font-family="Arial" font-size="1.1" fill="#3a3e43" text-anchor="start">ONLINE/</text></g>
    <g id="t16-silkscreen"><text x="28.0" y="14.5" font-family="Arial" font-size="1.1" fill="#3a3e43" text-anchor="start">OFFLINE</text></g>
    <g id="t17-silkscreen"><text x="45.0" y="4.2" font-family="Arial" font-size="1.2" fill="#3a3e43" text-anchor="middle">USB 0</text></g>
    <g id="t18-silkscreen"><text x="53.0" y="4.2" font-family="Arial" font-size="1.2" fill="#3a3e43" text-anchor="middle">USB 1</text></g>
    <g id="t19-silkscreen"><text x="70.0" y="4.2" font-family="Arial" font-size="1.2" fill="#3a3e43" text-anchor="middle">AUX</text></g>
    <g id="t20-silkscreen"><text x="88.0" y="4.2" font-family="Arial" font-size="1.2" fill="#3a3e43" text-anchor="middle">CONSOLE</text></g>
    <g id="t21-silkscreen"><text x="116.0" y="4.2" font-family="Arial" font-size="1.2" fill="#3a3e43" text-anchor="middle">ETHERNET</text></g>
  </g>
</svg>
