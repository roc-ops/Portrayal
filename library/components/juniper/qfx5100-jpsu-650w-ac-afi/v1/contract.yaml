format: 1
kind: module
name: qfx5100-jpsu-650w-ac-afi
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  JPSU-650W-AC-AFI, a 650 W AC power supply with FRU-to-port airflow, which the guide also calls
  back-to-front. It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares
  with its twin. The QFX5100 hardware guide says the QFX5100-24Q, QFX5100-48S, QFX5100-48SH,
  QFX5100-48T and QFX5100-48TH take it. The 1RU models seat two, in slots 0 and 1 at the right of
  the rear. The older part number is QFXC01-PWRACI-650A. The face carries three lamps labelled AC,
  DC and !. It also has a handle lettered AFI in Juniper Azure Blue, a C14 appliance inlet turned
  on its side and a black ejector lever. The front-to-back sibling is JPSU-650W-AC-AFO. AC and DC
  supplies, and supplies of different airflow direction, are never mixed in one chassis.
attrs:
  model: JPSU-650W-AC-AFI
  part-number-older: QFXC01-PWRACI-650A
  role: ac-power-supply
  power-output-w: 650
  airflow: back-to-front
  input: 110 to 240 VAC single phase (datasheet); the 1RU rating table of the guide is empty
provenance:
  size: >-
    photo-measured - the Juniper studio rear photograph of the QFX5100-48S, whose whole-face aspect
    agrees with Table 3's 440.9 x 43.7 mm to 0.8 percent (10.17 against 10.09), at 3.30 px/mm
    across and 3.28 down: the module's black recess measures 181 px, 54.8 mm, across and 130.5 px,
    39.8 mm, high. The 48T photograph gives the same width to 0.3 mm. No document gives the supply's
    size in millimetres. juniper/jpsu-650w-ac-ai@1, the QFX5120's 650 W supply, measures 54.6 x 40.2
    by the same method on a different chassis; the two are within the photographs' error.
  depth: >-
    not stated. Searched the QFX5100 hardware guide for the supply's depth: Figures 26 and 27 are
    isometric drawings with no scale and Table 13 gives only wattage, part number, airflow and
    handle colour. No depth is written.
  face: >-
    photo - the QFX5100-48S rear studio photograph at 3.3 px/mm, read at 3.2 times: a field of
    square vent holes at the upper left (three columns by two rows), three lamps in a column at x
    5.5 mm and y 21.9, 28.9 and 35.9 with the legends AC, DC and ! to their right, the blue handle
    strip at x 21.0 to 29.1 mm lettered AFI, the C14 inlet centred at x 42.4, y 21.4 mm, and the
    ejector lever below the inlet at the right edge. The lever overhangs the bay edge by about 4 mm
    in the photograph; only the part inside the face width is drawn. A cord retainer wire is not
    drawn: it is cable furniture. Positions are good to about 0.5 mm.
  drawing-vs-photo: >-
    The guide's Table 13 gives the handle of the AFI supply as Juniper Azure Blue. The 48S photograph
    shows it blue and lettered AFI, as drawn. The 48T photograph shows black handles lettered AFI,
    so the colour is not constant across photographs; the table and the 48S photograph agree and
    are used.
  power-output-w: >-
    datasheet - the part number and the datasheet's ordering table (JPSU-650W-AC-AFI, "AC 650W PSU,
    back-to-front airflow for QFX5100-48S, QFX5100-48T, QFX5100-24Q"); the guide says the 1RU supply
    is 650 W. An OUTPUT, since a supply provides power.
  input: >-
    datasheet - the datasheet's Power Supply and Fan Modules list gives 110-240 V single phase AC.
    The guide's Table 14 prints the rows for AC input voltage, line frequency and current rating with
    no value in the PDF held. The label on the chassis rear reads 100-240 V in the photograph.
  leds: >-
    datasheet - guide, AC Power Supply LEDs on a QFX5100 Device (Table 16): AC OK is green when power
    is coming into the supply, DC OK is green when the supply sends power out correctly, and Fault is
    amber when an error is detected; each is unlit otherwise.
  airflow: >-
    datasheet - guide, Table 13: JPSU-650W-AC-AFI is FRU-to-port with a Juniper Azure Blue handle;
    the datasheet calls it back-to-front. The older part number is QFXC01-PWRACI-650A.
states:
