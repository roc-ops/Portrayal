format: 1
kind: module
name: ex4100-jpsu-150-ac-afo
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper JPSU-150-AC-AFO, the 150 W AC power supply of the EX4100-24T and EX4100-48T, front-to-back
  airflow (AFO). The switch ships with one in power supply slot 0 or 1 and takes a second. It is hot-removable
  and hot-insertable once a second supply is installed and running. The face has a fan, an orange
  release latch, two lamps (DC OK and AC OK) and a C14 inlet turned portrait. Airflow is front to back,
  marked AIR OUT. Do not mix it with a supply or a fan module of the other direction, or with a DC supply.
attrs:
  role: ac-power-supply
  power-output-w: 150
  input: 100 through 127 VAC low line, 200 through 240 VAC high line, 50 or 60 Hz
  input-current: 3 A at low line, 1.5 A at high line
  airflow: front-to-back
  weight-kg: 0.65
part-numbers:
  JPSU-150-AC-AFO: {part: JPSU-150-AC-AFO}
provenance:
  sources: >-
    datasheet - EX4100 Switch Hardware Guide (Juniper Networks, PDF created 2026-10-01): Table 29 (the
    details of the 920 W and 150 W AC supplies), Table 31 (the 150 W specifications), Table 34 (airflow),
    Table 40 (the lamps), Figure 43 (the supply) and the Table 20 note (the supply's size and weight).
  size: >-
    datasheet - Table 20 note: power supply width 2.87 in. (7.3 cm), height 1.57 in. (4 cm), depth 8.86
    in. (22.5 cm), one set for every supply. Carried as 73.0 by 40.0 by 225.0 mm. The visible face in
    Figure 2, the rear render of the EX4100-24P, measures 72.4 by 40.1 mm at 2.957 px/mm, which agrees
    with the guide to 1 percent, and the guide's figures are used. A second supply of this part number
    exists in the library as juniper/ex3400-jpsu-150-ac-afo@1, drawn at 71.2 by 39.0 mm from a different
    chassis' photograph, so it is not reused.
  depth: datasheet - Table 20 note, 8.86 in. (22.5 cm), carried as 225.0 mm.
  power-output-w: >-
    datasheet - Table 31: output power 150 W. An output figure, because a supply provides power. The guide
    gives no draw or loss figure for the unit.
  input: >-
    datasheet - Table 31: low-voltage line 100 to 127 VAC at 3 A, high-voltage line 200 to 240 VAC at 1.5 A,
    50 to 60 Hz. Figure 43 prints 100 - 240V - 3 - 1.5A on the face.
  part-number: >-
    datasheet - Table 29 and Table 34 name the supply JPSU-150-AC-AFO. Table 64 prints the CLI name
    JPSU-150W-AC-AFO, and Table 29 is the supply's own table, so its spelling is used.
  airflow: >-
    datasheet - Table 34: front to back, label AIR OUT. Table 27 says the switches with this supply ship it
    with an orange handle.
  leds: >-
    datasheet - Table 40: AC OK is green when the supply receives proper input power, unlit when the input
    is out of range or the cord is out, red when the supply has failed and flashing red when this supply is
    not receiving power. DC OK is green when the supply delivers power correctly, unlit when AC OK is unlit
    or the supply does not deliver, red when it has failed and flashing red when it is not receiving power.
    Figure 43 lists the DC OK lamp first, then AC OK, left to right, and Figure 2 agrees.
  face: >-
    estimated - positions are read off Figure 2, the rear render of the EX4100-24P, at 2.957 px/mm with the
    supply's top left corner as origin: fan centre 13.0, 19.7, screws 5.6 across at 4.5 and 35.3 down,
    latch 31.0 to 41.4 across, lamps 44.2 and 64.5 across at 3.2 down with a small blind hole between them,
    and the inlet centre 54.9, 22.8. The cord retainer clip beside the inlet is a loose accessory (packing
    list, Table 53) and is not drawn. The rating legends that Figure 43 prints beside the inlet do not
    appear in the render and are not drawn; the 50-60 Hz legend above the AIR OUT chip does. The inlet
    is std/c14-inlet@1, turned portrait as the render shows.
  relief: >-
    estimated - the latch stands proud of the face in Figure 43. Its projection is not stated or measured.
  power: >-
    datasheet - see power-output-w. No source in the guide states a figure for what the unit itself draws.
states:
- ok
- fault
- absent
parts:
- {ref: std/c14-inlet@1, id: inlet, at: [40.85, 12.8], rotate: 90}
elements:
  led-dc:
    at: [43.0, 2.0]
    size: [2.4, 2.4]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: red, color: '#e03a2f'}
    - 'off'
  led-ac:
    at: [63.3, 2.0]
    size: [2.4, 2.4]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: red, color: '#e03a2f'}
    - 'off'
  latch:
    at: [31.0, 1.1]
    size: [10.4, 38.7]
    class: latch
size:
  w: 73.0
  h: 40.0
  d: 225.0
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
relief:
  features:
  - node: latch
    out: 1.6
    color: '#ee6a1f'
    confidence: estimated
    source: render - the orange latch stands proud; projection not measured
connection-points:
  power: {at: [54.85, 22.8], direction: rear}
body:
  depth: 225.0
  color: '#b9bec4'
skins: [default]
