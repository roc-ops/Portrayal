format: 1
kind: module
name: re-s-1300-v
version: 1.2.0
class: supervisor
behaviour: fills
profile: networking
description: >-
  Juniper RE-S-1300 Routing Engine as seated in the MX960's vertical
  SCB - the same FRU the MX240/MX480 carry horizontally, authored
  vertically with every jack rotated 90.
attrs:
  model: RE-S-1300-2048
  power-draw-max-w: 90
provenance:
  speed: SOURCES DISAGREE, so no speed is stated. The MX240, MX480 and MX960 guides list one
    10/100/1000-Mbps Ethernet port on each Routing Engine family they describe, but their RJ-45
    pinout section calls the port labeled ETHERNET an autosensing 10/100-Mbps receptacle, and
    neither passage is scoped to the RE-S-1300. The media is rj45; the rate waits for an RE-S-1300
    document
  media: 'the RJ-45 jacks are typed by what runs through them rather than by the housing: console
    and auxiliary ports are rj45-serial (RS-232), a time-of-day port is rj45-tod and a BITS
    port is rj48, the media the library devices already use for the same jacks'
  size: 'photo - the studio front photograph at ~2.07 px/mm: the card cage is ~405 mm tall and fourteen slots share the 441 mm width on a ~30.1 mm pitch; positions approximate to ~2 mm. No vendor card dimension in the extraction'
  power: >-
    guide FRU power table (Component | Model Number | Maximum Power Requirement), MX chassis
    guides: '| | RE-S-1300-2048 (EOL'd) RE-S-2000-4096 (EOL'd) RE-S-1800 (all variants) |
    ... | 90W |'. Table 93 'FRU Power Requirements'. One row covers three Routing Engines
    and states a single 90 W; it is the same in the MX480 and MX960 guides.
  orientation: 'the horizontal sibling juniper/re-s-1300@1 carries the
    measured face; same hardware, rotated author (bays cannot rotate)'
states:
- ok
- fail
- absent
groups:
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: the Routing Engine management cluster - the out-of-band Ethernet jack, the RJ-45
      serial ports and the USB service port. One job (reaching and disciplining the box),
      several media
parts:
- {ref: std/rj45@2, id: aux, group: mgmt, at: [6.6, 52.4], rotate: 90, attrs: {media: rj45-serial, function: auxiliary console}}
- {ref: std/rj45@2, id: console, group: mgmt, at: [6.6, 87.4], rotate: 90, attrs: {media: rj45-serial, function: serial console}}
- {ref: common/rj45-eth@1, id: ethernet, group: mgmt, at: [6.6, 125.4], rotate: 90, attrs: {media: rj45, function: out-of-band management}}
- {ref: std/usb-a@1, id: usb, group: mgmt, at: [11.25, 164.0], attrs: {function: USB service port}}
size:
  w: 27.0
  h: 262.0
