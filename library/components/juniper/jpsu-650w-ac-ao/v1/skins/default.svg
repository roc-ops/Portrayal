<svg xmlns="http://www.w3.org/2000/svg" width="54.6mm" height="40.2mm" viewBox="0 0 54.6 40.2">
  <defs>
    <pattern id="grid" width="3.6" height="3.6" patternUnits="userSpaceOnUse">
      <rect x="0.4" y="0.4" width="2.8" height="2.8" fill="#07080a"/>
    </pattern>
  </defs>
  <rect id="face" x="0" y="0" width="54.6" height="40.2" rx="0.8" fill="#1c1e21" stroke="#181b1f" stroke-width="0.4"/>
  <g id="vents">
    <rect x="2.4" y="2.6" width="15.8" height="28.0" rx="0.5" fill="#2b2e32"/>
    <rect x="2.4" y="2.6" width="15.8" height="28.0" rx="0.5" fill="url(#grid)"/>
  </g>
  <rect id="inlet-bay" x="28.0" y="3.4" width="21.0" height="31.0" rx="1.2" fill="#121416" stroke="#2b2e32" stroke-width="0.3"/>
  <g id="silkscreen" font-family="sans-serif" font-size="2.1" fill="#d9dde1">
    <text x="8.2" y="21.9">AC</text>
    <text x="8.2" y="28.3">DC</text>
    <text x="8.2" y="34.5">!</text>
  </g>
  <g id="lamps">
    <circle id="led-ac" cx="5.5" cy="21.2" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3"/>
    <circle id="led-dc" cx="5.5" cy="27.6" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3"/>
    <circle id="led-fault" cx="5.5" cy="33.8" r="1.1" fill="var(--led-color, #0f1113)" stroke="#3a3e43" stroke-width="0.3"/>
  </g>
  <g id="latch">
    <rect x="18.2" y="0.8" width="9.7" height="39.0" rx="1.4" fill="#e8731f" stroke="#b95812" stroke-width="0.4"/>
    <rect x="20.6" y="4.6" width="4.9" height="31.0" rx="1.2" fill="#d3661a"/>
  </g>
  <g id="lever">
    <rect x="48.8" y="19.9" width="5.8" height="20.3" rx="1.2" fill="#232528" stroke="#3a3e43" stroke-width="0.35"/>
    <rect x="50.8" y="24.4" width="1.6" height="9.0" rx="0.6" fill="#08090a"/>
  </g>
</svg>
