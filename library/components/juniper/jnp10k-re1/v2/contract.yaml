groups:
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: the Routing Engine management cluster - the out-of-band Ethernet jack, the RJ-45
      serial ports and the USB service port. One job (reaching and disciplining the box),
      several media
  timing:
    term: Port
    role: management
    index-origin: 0
    mixed: the timing block - BITS and ToD on RJ-45 beside the 1PPS and 10 MHz SMB jacks.
      One job (clock), several media
  xge:
    term: Port
    role: management
    index-origin: 0
    attrs:
      media: sfp-plus
      speed: 10g
    description: XGE-0 and XGE-1, which Juniper marks not used (reserved ports). They sit
      on the routing and control board and carry no user traffic, so they are filed with its
      management ports rather than as traffic
