size:
  w: 389.0
  h: 38.1
size-confidence: {w: borrowed, h: borrowed}
size-notes: >-
  Both are the RCB BAY these three chassis declare, not a measurement of the card: the
  MX10004, MX10008 and MX10016 all open a 389.0 x 38.1 mm slot and the board fills it.
  `rcb-vendor-width` on mx10004 records that the vendor FRU table covers chassis, cards and
  PSUs but never the RCB itself, so no vendor dimension for this face exists to check it
  against. The v2 rebuild took every position off Figure 46 and did not revisit the size,
  because the figure fails the panel gate at 8.8 percent and could not have settled it.
