format: 1
kind: module
name: jnp10k-re1
version: 1.1.0
class: supervisor
behaviour: fills
profile: networking
description: >-
  Juniper JNP10K-RE1 Routing and Control Board for the MX10004/MX10008 -
  a slim full-width FRU, two stacked in the top slots. MST/PWR/STS/OFF
  lamps, CON and MGMT jacks, PPS / 10MHZ SMB quad, an SFP management cage,
  USB, the SSD door and four SFP+ ports 0-3 at the right.
attrs:
  model: JNP10K-RE1
  power-draw-max-w: 175
provenance:
  size: 'photo - the RCB face spans 389 mm of the 442 mm chassis on the
    frontwtop photograph at 3.11 px/mm, and the guide FRU listing gives
    the 1.5 in (38.1 mm) slot height. Vendor width for the RCB itself is
    not in the extraction'
  power: >-
    guide FRU power table (Component | Model Number | Maximum Power Requirement), MX chassis
    guides: '| JNP10K-RE1 | MX10004 RCB | 100W | 175W | 175W |'. MX10004 guide, Table 55
    'Power Requirements for MX10004 Components', whose header reads 'At 77 F (25 C) | At 104
    F (40 C) | At 131 F (55 C)'. The 55 C column is carried; the 25 C figure for this part
    is 100 W, so reading the wrong end of the row would have been 43 percent low. Stated as
    being under typical voltage and optics.
  face: 'photo - lamp column, CON, SMB quad, MGMT, SFP, USB, SSD door,
    ports 0-3; positions approximate to ~2 mm'
states:
- ok
- fail
- absent
parts:
- {ref: std/rj45@2, id: con, at: [23.1, 12.4], attrs: {function: serial console}}
- {ref: std/smb@1, id: pps-in, at: [44.6, 8.0], attrs: {function: PPS in}}
- {ref: std/smb@1, id: pps-out, at: [57.1, 8.0], attrs: {function: PPS out}}
- {ref: std/smb@1, id: mhz-in, at: [67.6, 8.0], attrs: {function: 10MHz in}}
- {ref: std/smb@1, id: mhz-out, at: [80.1, 8.0], attrs: {function: 10MHz out}}
- {ref: common/rj45-eth@1, id: mgmt, at: [84.1, 12.4], attrs: {function: out-of-band management}}
- {ref: std/sfp@1, id: sfp-mgmt, at: [114.25, 15.0], attrs: {function: management SFP}}
- {ref: std/usb-a@1, id: usb, at: [138.75, 15.75], rotate: 90, attrs: {function: USB service port}}
- {ref: std/sfp@1, id: port-0, at: [297.75, 9.0], attrs: {media: sfp-plus}}
- {ref: std/sfp@1, id: port-1, at: [312.0, 9.0], attrs: {media: sfp-plus}}
- {ref: std/sfp@1, id: port-2, at: [326.25, 9.0], attrs: {media: sfp-plus}}
- {ref: std/sfp@1, id: port-3, at: [340.5, 9.0], attrs: {media: sfp-plus}}
size:
  w: 389.0
