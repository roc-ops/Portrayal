description: >-
  Blank cover panel (JNP304-BLNK) for an unoccupied MX304 RE or LMIC slot.
  The guide requires a failed Routing Engine to stay seated until a
  replacement or this blank is available, so an empty slot in a shipped
  chassis carries one. Plain plate with two captive screws.
