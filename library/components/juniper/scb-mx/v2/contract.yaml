format: 1
kind: module
name: scb-mx
version: 2.0.0
class: supervisor
behaviour: fills
profile: networking
description: >-
  Juniper MX Series Switch Control Board (SCB-MX) - the fabric/control
  carrier for the MX240/MX480. Seats in SCB slot 0 or the shared slot 1/0;
  the Routing Engine slides into the SCB's own horizontal bay. The face
  carries the OK/FAIL, FABRIC ONLY and FABRIC ACTIVE lamps at the left with
  rotated legends, and extraction levers at both ends.
attrs:
  model: SCB-MX
  power-draw-max-w: 185
  power-draw-typical-w: 155
provenance:
  size: >-
    photo-measured - the plate is 396.0 x 29.5 centred in a 413.5 lever envelope. Plate edges off the
    MX240 front photograph (body px 2.5-1496.5 = 443 mm, 3.372 px/mm; SFF-8433 ganged-SFP pitch cross-checks
    3.379): x px 127.5-1463.5 = 396.2 mm, the same edges on DPC 40xGE, DPC-R-4XGE and SCB-MX; corroborated
    by the MX480 (396.3 at 3.230 px/mm) and the MX960 (815 px, 393-397 depending on the axis's scale).
    RE-ENVELOPED, NOT REDRAWN, at 2.0.0: every part, bay, lamp and legend at 1.x card x >= 26.15 moved
    by x' = 8.75 + (x - 26.15) * 396.0 / 394.85, the old plate run 26.15-421.0 onto the new 8.75-404.75;
    y is unchanged. Only the levers, the model name and the status group were placed afresh (provenance
    below). 
  power: 'guide Table 92 (Maximum Power Consumption for SCB Models): SCB-MX 185 W at 55 C, 160 at 40 C,
    155 at 25 C. Max takes 55 C; typical carries the 25 C figure of the same table, not a vendor "typical"'
  re-bay: >-
    photo - the Routing Engine bay spans card x 91.6-354.2 (261.8 mm), measured off the seated RE-S-1300's
    plate edges and re-enveloped with the rest at 2.0.0 (1.x: 108.6-370.4 of the 420.9 face); the MX240
    photograph puts the RE plate's left edge at card x 92. "Each Routing Engine must be installed directly
    into an SCB" (guide RE description) - the bay is the SCB's, not the chassis's
  lamps: >-
    photo + guide SCB LED table - OK/FAIL, FABRIC ONLY, FABRIC ACTIVE in a row at the left with vertically-printed
    legends; re-enveloped to card x 34.0/41.2/48.4, where the MX240 photograph reads 33.0/40.4
  levers: >-
    photo-measured - the MX240 front photograph: each ejector lever is 97 px = 28.8 mm long and 25-27
    px = 7.4-8.0 mm tall, its tip 9.5 mm past the plate end; drawn 29.0 x 7.4 with the tip at the envelope
    edge (8.75 mm past the plate, which the 413.5 envelope fixes). Centred on the plate: the right-hand
    levers read centred; the left-hand ones read 2.4 mm low, which a lever standing proud of the face
    shows in a photograph taken from above centre. Until 2.0.0 they were drawn 16 x 9 at x 1.2, about
    16 mm left of the real lever and too high.
  model-name: >-
    photo-measured - DPC 40xGE, DPC-R-4XGE and SCB-MX each print the model name from card x 11.4 (the
    plate's left end plus 2.65), baseline 25.5 below the plate top, under the lever. The other cards take
    the same position as the family's.
states:
- ok
- fail
- absent
elements:
  lever-left:
    at: [0.0, 11.05]
    size: [29.0, 7.4]
    class: latch
  lever-right:
    at: [384.5, 11.05]
    size: [29.0, 7.4]
    class: latch
bays:
  re:
    at: [91.44, 1.0]
    size: [261.8, 27.5]
    accepts: [juniper/re-s-1300@1, juniper/re-s-2000@1]
    default: juniper/re-s-1300@1
size:
  w: 413.5
  h: 29.5
size-notes: >-
  w is the lever envelope and h the plate height, of ONE card that every MX240, MX480 and MX960 slot takes
  - the MX960 seats it turned 90, as its own hardware guide says by stating an MPC/DPC/SCB as one 17 x
  22 x 1.25 in part in all three books (#261). The 413.5 is Juniper's Visio stencil, whose every MPC/DPC/SCB
  master is the same 0.1156 x 1.6281 page-inch rectangle at an exactly 1:10 scale (29.36 x 413.54 mm),
  read as the lever-tip envelope because the three front photographs measure lever tip to lever tip at
  413.5-414.9 while the plate between them is 396.0. The 29.5 is the plate height, estimated: the MX240
  photograph reads it 28.6-29.0 at 3.37 px/mm and nothing dimensions it.
size-confidence: {w: drawing, h: estimated}
