<svg xmlns="http://www.w3.org/2000/svg" width="36.2mm" height="8.3mm" viewBox="0 0 36.2 8.3">
  <!-- Drawn from the cable end. Farthest from the viewer first. -->
  <rect id="shell" x="1.8" y="1.5" width="32.6" height="5.3" fill="#c9cdd1"/>
  <rect id="body" x="0" y="0" width="36.2" height="8.3" rx="1.0" fill="#26282b" stroke="#4a4d52" stroke-width="0.12"/>
  <g id="screw-left">
    <circle cx="3.2" cy="4.15" r="1.3" fill="#c9cdd1" stroke="#8d949c" stroke-width="0.15"/>
    <path d="M 2.3 4.15 H 4.1" stroke="#4a4f55" stroke-width="0.25" fill="none"/>
  </g>
  <g id="screw-right">
    <circle cx="33.0" cy="4.15" r="1.3" fill="#c9cdd1" stroke="#8d949c" stroke-width="0.15"/>
    <path d="M 32.1 4.15 H 33.9" stroke="#4a4f55" stroke-width="0.25" fill="none"/>
  </g>
  <rect id="relief-boot" x="6.0" y="0.8" width="24.2" height="6.7" rx="1.6" fill="#202225" stroke="#4a4d52" stroke-width="0.12"/>
  <circle id="stub" cx="18.1" cy="4.15" r="3.5" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
