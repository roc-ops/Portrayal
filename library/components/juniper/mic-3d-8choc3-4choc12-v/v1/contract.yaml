format: 1
kind: module
name: mic-3d-8choc3-4choc12-v
version: 1.3.2
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper channelized SONET/SDH OC3/STM1 multirate MIC with SFP (eight ports). Vertical author for the vertical carriers (MX960/MX2000 MPCs stand on end, and their MICs with them).
unplaced: >-
  SUPERSEDED by juniper/mic-3d-8choc3-4choc12@2: the MX2000 carriers that took this rotated
  twin are retired in favour of the horizontal MPC seated in juniper/mx2000-lc-adapter@1,
  which takes the horizontal MIC (#261, part 2). Kept and deprecated rather than deleted, so a
  manifest that pins it still resolves (#448); nothing in this library seats it. Before it was
  retired: no vertical carrier in this library takes it. Tables 10-12 list it under the
  queuing (Q, EQ) and NG SKUs only; the carriers in this library that could take it are the
  base MPC1E, MPC2E and MPC3E SKUs, and roc-ops/Portrayal#417 narrowed each to its own column
  of the Interface Module Reference MIC/MPC compatibility tables (Tables 10-12), none of which
  takes it. The horizontal form is still seated by the MX80 and MX104. Modelling a queuing or
  NG carrier as its own part would seat it.
superseded-by: juniper/mic-3d-8choc3-4choc12@2
attrs:
  oc3: 8
  model: MIC-3D-8CHOC3-4CHOC12
  power-draw-max-w: 52
provenance:
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): on a card
    drawn on its side a pair sits left and right, the left cage 270 beside the right 90,
    so both cage lips face the band between the two cages and both bails face outward.
    Decided by the rule, not an observation, so a photograph of the stack overturns it:
    the 4 SFP pairs (port-0-1/port-0-0 to port-0-7/port-0-6). Turning a composed cage in
    place changes no box, id or anything a device places, so it is a minor bump (S6).
  sonet-rate: >-
    the SONET rate, transcribed from this contract's own description: 'channelized SONET/SDH
    OC3/STM1 multirate MIC with SFP (eight ports)'. Without it the SFP cage has no rate to
    read and the export typed it Gigabit Ethernet, which an OC-3 port is not. Nothing new
    was measured.
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU power table, MX chassis guides: '| | 8-Port: MIC-3D-8CHOC3-4CHOC12 | 8-Port: 52 Wat 131° F (55° C) 50.5 Wat 40° C'. The 55 C rung is
    carried, being the worst rated case a chassis budget has to survive.
    Taken by matching the row's OWN LABEL: these tables pair parts with figures
    in one row - `4-Port: X 8-Port: Y` against `4-Port: 41 W 8-Port: 52 W` - and
    reading first-wins puts the small card's number on the big one. Aligning on
    the N-Port label instead is self-checking, and it checks out: 4-port 41 W
    against 8-port 52 W, 4-port 24 W against 8-port 29 W.
    Seen in 4 guide(s): mx240, mx480, mx960-p0001-0300, mx960-p0301-0600.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
