format: 1
kind: module
name: mpc3e-3d-v960
version: 1.1.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MPC3E carrier - two MIC slots taking MIC3 and selected classic MICs (Table 12); the NG variants share the faceplate. Vertical form for the MX960 cage.
attrs:
  model: MPC3E
  power-draw-max-w: 440
  model-variants: MPC3E-3D-NG, MPC3E-3D-NG-Q
provenance:
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. carrier face; the MIC windows dominate it'
  power: >-
    guide FRU power table (Component | Model Number | Maximum Power Requirement), MX chassis
    guides: '| MPC3E | MX-MPC3E-3D | 440W With MICs and optics: 500 Wat 55 C, two 40 W MICs
    ... |'. The cell LEADS with the card-alone figure and the 'With MICs and optics' figures
    follow it; the leading number is what composes, because the MICs seated in this carrier
    are separately modelled parts that answer for themselves. THE GUIDES DISAGREE ON THE
    WITH-MICs FIGURE - 500 W at 55 C in the MX2008 and MX2010 books, 520 W in others, both
    against 'two 40 W MICs' - which is a reason to carry the card-alone number rather than a
    composite. The 440 W itself is identical in every guide that prints the row.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
states:
- ok
- fail
- absent
bays:
  mic0:
    at: [1.55, 30.0]
    size: [27.0, 168.0]
    accepts:
    - juniper/mic-3d-20ge-sfp-v@1
    - juniper/mic-3d-2xge-xfp-v@1
    - juniper/mic-3d-4xge-xfp-v@1
    - juniper/mic-3d-10ge-sfp-e-v@1
    - juniper/mic-3d-8oc3-2oc12-atm-v@1
    - juniper/mic3-3d-10xge-sfpp-v@1
    - juniper/mic3-3d-2x40ge-qsfpp-v@1
    - juniper/mic3-3d-1x100ge-cfp-v@1
    - juniper/mic3-3d-1x100ge-cxp-v@1
    - juniper/mic3-100g-dwdm-v@1
    - juniper/mx-mic-blank-v@1
    default: juniper/mic3-3d-10xge-sfpp-v@1
  mic1:
    at: [1.55, 210.0]
    size: [27.0, 168.0]
    accepts:
    - juniper/mic-3d-20ge-sfp-v@1
    - juniper/mic-3d-2xge-xfp-v@1
    - juniper/mic-3d-4xge-xfp-v@1
    - juniper/mic-3d-10ge-sfp-e-v@1
    - juniper/mic-3d-8oc3-2oc12-atm-v@1
    - juniper/mic3-3d-10xge-sfpp-v@1
    - juniper/mic3-3d-2x40ge-qsfpp-v@1
    - juniper/mic3-3d-1x100ge-cfp-v@1
    - juniper/mic3-3d-1x100ge-cxp-v@1
    - juniper/mic3-100g-dwdm-v@1
    - juniper/mx-mic-blank-v@1
    default: juniper/mx-mic-blank-v@1
size:
  w: 30.1
  h: 405.0
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  w and h are the MX960 vertical card slot opening (that chassis's own bays are 30.1 x 405.0),
  not the part. Nothing measured the card: provenance/size says so in as many words, and #261
  found the same model number drawn at two different sizes because two chassis have two
  openings. Juniper's hardware guides for the MX240, MX480 and MX960 all state an MPC/DPC/SCB as
  17 x 22 x 1.25 in - the MX960's own book included, which is the vendor saying it is ONE card
  in both orientations - but those figures are rounded to the quarter inch, and 1.25 in is 31.75
  mm against a modelled 30.45 mm slot pitch, so they cannot settle a drawing to 0.1 mm.
  Estimated until a mechanical drawing or a ruler on a real card turns up.
