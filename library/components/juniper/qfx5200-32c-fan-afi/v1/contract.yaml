format: 1
kind: module
name: qfx5200-32c-fan-afi
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  QFX5200-32C-FANAFI, a field-replaceable fan module with back-to-front (FRU-to-port) airflow: air
  comes in at the fan end and leaves at the port side. It is marked AIR IN, has a Juniper Azure Blue
  handle, and is hot-removable and hot-insertable. The QFX5200 hardware guide says the QFX5200-32C
  and the QFX5200-32C-L take it, five to a switch (fan modules 0 to 4, left to right), and that the
  same module serves the -AFI and -LAFI builds. The front-to-back sibling is QFX5200-32C-FANAFO. The
  two are never mixed in one chassis, and never with power supplies of the other direction. The
  status lamp is on the chassis strip beside each slot, not on the module.
attrs:
  model: QFX5200-32C-FANAFI
  airflow: back-to-front
  power-absent: not-published
provenance:
  size: >-
    estimated - the same slot and the same module outline as qfx5200-32c-fan-afo@1: the guide's rear
    figure 19 gives the slot width (41.2 mm on a 49.2 mm pitch) and the 41.4 mm height is the QFX5120-48Y
    photograph's. The guide draws the AFI module only as an isometric (figure 27) with no scale, so
    nothing here is measured on it.
  depth: >-
    not stated. The guide's figure 27 is an isometric drawing with no scale and its tables give no
    depth, so none is written.
  face: >-
    drawing - the guide's figure 27 draws this module with a captive screw at the top left, a hex
    grille above and below a central band with a ribbed grip, and the label AIR IN with a fan symbol on
    the band. The layout is that of the AFO module, whose flat figure 19 is the one that can be
    measured; only the handle colour and the label differ.
  airflow: >-
    datasheet - guide Table 17: QFX5200-32C-FANAFI carries the label AIR IN, is Juniper Azure Blue,
    and is FRU-to-port airflow, also called back-to-front.
  colour: >-
    borrowed - the guide names the handle Juniper Azure Blue and no photograph of this module exists.
    The colour is the blue the library already carries for the same name on juniper/qfx5110-fanafi@1,
    which was read off a photograph of a module the QFX5120 guide calls Juniper Azure Blue.
  power: >-
    not published. Searched the QFX5200 hardware guide for a per-module wattage near its cooling
    sections and its power tables; only whole-switch figures exist. The module declares power-absent so
    the missing figure is a statement and not a silence.
states: [absent]
