format: 1
kind: module
name: mx240-craft
version: 1.1.0
class: display
behaviour: fills
profile: networking
description: >-
  Craft interface panel for the Juniper MX240 - a hot-insertable/removable
  FRU spanning the chassis above the card cage. Carries the host-subsystem
  lamp columns (RE0/RE1 MASTER-ONLINE-OFFLINE), the FAN and per-PEM lamp
  pairs, the yellow (minor) and red (major) alarm lamps, the ACO/LT
  alarm-cutoff button, the YELLOW/RED ALARM relay terminal blocks (NC-C-NO),
  the per-slot OK/FAIL lamps with numbered tabs (0, 1/0, 1, 2), the
  JUNIPER MX240 wordmark and the junos badge.
attrs:
  model: MX240 Craft Interface
  power-absent: not-published
provenance:
  lamp-states: >-
    THE LAMPS WERE DRAWN AND COULD NOT LIGHT. Every one of the 26 was a flat
    fill, so the panel declared a lamp state, the viewer offered it and clicking it
    changed no pixel - L47's first shape exactly. Each fills from the LED variable now,
    with its drawn colour as the unlit fallback, so an unlit panel is unchanged.
    THE VOCABULARIES ARE THE GUIDE'S, not a convention: MX240 Hardware Guide,
    Table 7 (alarm), Table 8 (host subsystem), Table 9 (power supply), Table 10 (DPC and MPC), Table 11 (FPC), Table 12 (SCB) and Table 13 (fan). Green for functioning and red for failed throughout;
    the OK lamp of a card slot also BLINKS while the card is transitioning online or
    offline, which is the one state that is not simply on or off, and the minor alarm
    is yellow against the major alarm's red. Figure 6 is the arrangement.
  power: >-
    NOT PUBLISHED. The chassis guide for this part is staged and converted, its FRU power
    requirements table is present, and THIS PART IS NOT IN IT - which is a stronger
    statement than the figure merely being absent: the vendor tabulated the components it
    budgets for and did not tabulate this one. Searched beyond that table as well - all 573 converted documents, for this part, with a twelve-line window either side and a
    thirty-line window against any line introducing a power requirement or consumption. No
    wattage falls near a mention anywhere.
  size: 'photo - the panel spans the 420.9 mm between the chassis flanges,
    42.5 mm tall (front photo rows 32.8-75.3), both off the orthographic
    mx240-front-high photograph (0.1% aspect gate). No vendor dimension for
    the craft panel exists in the intake - searched "craft" near dimension
    tables'
  features: 'photo + guide Figure 6 (craft interface) - every lamp, button,
    relay block and label placed off the photograph at 3.386 px/mm; the guide
    figure corroborates the arrangement and Table 8 (host subsystem), the fan
    LED table and the alarm tables give the state vocabularies, summarised on
    the device groups'
  slot-tabs: 'photo - the numbered oval tabs (0, 1/0, 1, 2) under the
    per-slot OK/FAIL lamp pairs are the slot identity legends; 1/0 is the
    shared SCB1/DPC0 slot'
