format: 1
kind: module
name: qfx5130-jpsu-1600-ac-afo
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  JPSU-1600W-1UACAFO, a 1600 W AC power supply with front-to-back airflow (AIR OUT, port-to-FRU). It is a
  field-replaceable unit, hot-removable and hot-insertable, installed at the factory, and load-shares with
  its twin. The QFX5130 hardware guide says the QFX5130-32CD, QFX5130-48C and QFX5130-48CM take it; the
  switch ships with two. The face carries three lamps labelled AC, DC and !, a Juniper gold handle, an
  appliance inlet and a black release latch. The inlet takes the C15 coupler of the guide's power cords, so
  it is a C16 inlet; it is drawn with the library's C14 inlet, which has the same pins and differs by a
  keying notch. The AIR IN sibling is JPSU-1600W-1UACAFI. AC and DC supplies, and supplies of different
  airflow direction, are never mixed in one chassis. The datasheet lists the part as the "QFX5220-32CD
  1600W 1U AC PSU AFO".
attrs:
  model: JPSU-1600W-1UACAFO
  role: ac-power-supply
  power-output-w: 1600
  airflow: front-to-back
  input: 100 to 127 VAC 12 A, 200 to 240 VAC 8 A (QFX5130-32CD) or 9 A (QFX5130-48C and -48CM), 50 to 60 Hz (guide Tables 19, 20)
provenance:
  size: >-
    photo-measured - the Juniper studio rear photograph of the QFX5130-32CD (2100 x 432 px, the body 1857
    px wide, which is the guide's 17.26 in at 4.236 px/mm): the black supply body measures 55.2 mm across
    and 41.1 mm high. The QFX5130-48CM photograph (4.233 px/mm) reads 54.7 mm across; the part number is
    the same on both chassis, so the two readings are one part and the figure used is 55.0 by 41.1. No
    document gives the supply's size in millimetres; the guide's figure 43 is an isometric drawing.
  depth: >-
    not stated. The guide's figure 43 is an isometric with no scale, and neither the guide nor the
    datasheet gives a depth or weight for the supply. No depth is written.
  face: >-
    photo - the QFX5130-32CD rear studio photograph at 4.24 px/mm, zoomed 5 times: a vent grid of square
    holes on a 3.8 mm pitch, three lamps in a column at x 7.1 mm and y 14.8, 20.2 and 26.4 with the
    legends AC, DC and ! to their right (the handle hides the ends of AC and DC), the handle a C of
    9.0 mm by 38.7 mm at x 12.0, the inlet block 23.2 by 30.6 mm at x 26.6, and the release latch at the
    lower right. Positions are estimated to about 0.3 mm. The photograph prints the three legends from
    x 10.4 mm in a larger type, so the handle hides most of AC and DC; they are drawn at x 9.2 mm in 1.9 mm
    type so that the words stay legible beside the handle. A cord retainer is cable furniture and is not
    drawn. The rating label printed on the chassis beside the right-hand supply is not part of the supply.
  power-output-w: >-
    datasheet - the part number and the guide's text call it a 1600-W supply ("All power supplies for
    QFX5130 are 1600 watt"). An OUTPUT, since a supply provides power.
  leds: >-
    datasheet - guide, QFX5130 AC Power Supply LEDs (Table 23, figure 44): Input OK is green when power
    comes in and amber when only one of the two supplies is powered; Output OK is green when the supply
    sends out power and blinks green when it is disabled; Fault is amber on an error and blinks when the
    supply is an invalid model. The photograph labels the three lamps AC, DC and !.
  airflow: >-
    datasheet - guide Tables 3 and 4 and Table 17: JPSU-1600W-1UACAFO is port-to-FRU, front-to-back, and
    carries a Juniper gold handle. The photograph shows the gold handle and no AIR OUT label on the supply.
  input: >-
    datasheet - guide Table 19 (QFX5130-32CD: 100 to 240 VAC, 12 A at 100 to 127 VAC and 8 A at 200 to 240
    VAC) and Table 20 (QFX5130-48C and -48CM: 12 A and 9 A). The datasheet's hardware table prints the
    32CD's lower range as 115 to 127 VAC; the guide's 100 to 127 is used.
states:
- ok
- fault
- absent
