<svg xmlns="http://www.w3.org/2000/svg" width="10.0mm" height="25.0mm" viewBox="0 0 10.0 25.0">
  <!-- The three-position DC power connector of the JPSU-150-DC-AFO seen from its mating face: a body with three cells in a column
       ("+", "-" and the earth symbol from the top down) and a mounting hole at each end. Shapes and colours are estimates; the
       guides' figures are line art. -->
  <rect id="body" x="0" y="0" width="10.0" height="25.0" rx="0.6" fill="#a9adb1" stroke="#5e656c" stroke-width="0.3"/>
  <g id="holes" fill="#5e656c">
    <circle cx="5.0" cy="2.2" r="0.9"/>
    <circle cx="5.0" cy="22.8" r="0.9"/>
  </g>
  <g id="cells" fill="#6f7378" stroke="#4a4f55" stroke-width="0.2">
    <rect x="1.6" y="4.0" width="6.8" height="4.6" rx="0.4"/>
    <rect x="1.6" y="9.6" width="6.8" height="4.6" rx="0.4"/>
    <rect x="1.6" y="15.2" width="6.8" height="4.6" rx="0.4"/>
  </g>
  <g id="contacts" fill="#d9dbdd">
    <rect x="4.4" y="5.4" width="1.2" height="1.8"/>
    <rect x="4.4" y="11.0" width="1.2" height="1.8"/>
    <rect x="4.4" y="16.6" width="1.2" height="1.8"/>
  </g>
</svg>
