<svg xmlns="http://www.w3.org/2000/svg" width="183.5mm" height="39.5mm" viewBox="0 0 183.5 39.5">
  <!-- JPSU-H-340W-AC seen from the rear: a retaining thumbscrew on a tab at the left, the AC INPUT label block,
       fins either side of a green release handle, and the OUT_OK lamp plate at the right. -->
  <rect id="flank" x="0" y="0" width="12.0" height="39.5" fill="#6a727f"/>
  <rect id="body" x="11.6" y="0" width="171.9" height="39.5" rx="0.8" fill="#5b626e" stroke="#2f343b" stroke-width="0.4"/>
  <rect x="12.6" y="32.6" width="169.9" height="5.8" fill="#4a505a"/>
  <rect id="tab" x="0" y="18.9" width="13.7" height="14.1" rx="0.8" fill="#5d6471" stroke="#2f343b" stroke-width="0.35"/>
  <g id="thumbscrew">
    <circle cx="5.4" cy="26.3" r="5.1" fill="#2b2f36" stroke="#8d949c" stroke-width="0.35"/>
    <circle cx="5.4" cy="26.3" r="3.6" fill="#4a505a" stroke="#8d949c" stroke-width="0.3"/>
    <path d="M 2.9 26.3 H 7.9 M 5.4 23.8 V 28.8" fill="none" stroke="#c9cdd2" stroke-width="0.6" stroke-linecap="round"/>
  </g>
  <rect id="label" x="13.6" y="4.4" width="24.6" height="27.3" fill="#6b7280" stroke="#2f343b" stroke-width="0.3"/>
  <g id="fins" fill="#363b44" stroke="#232730" stroke-width="0.2">
    <rect x="46.35" y="2.0" width="1.7" height="31.1"/>
    <rect x="53.35" y="2.0" width="1.7" height="31.1"/>
    <rect x="60.15" y="2.0" width="1.7" height="31.1"/>
    <rect x="66.95" y="2.0" width="1.7" height="31.1"/>
    <rect x="73.85" y="2.0" width="1.7" height="31.1"/>
    <rect x="121.65" y="2.0" width="1.7" height="31.1"/>
    <rect x="128.75" y="2.0" width="1.7" height="31.1"/>
    <rect x="135.75" y="2.0" width="1.7" height="31.1"/>
    <rect x="142.55" y="2.0" width="1.7" height="31.1"/>
    <rect x="149.15" y="2.0" width="1.7" height="31.1"/>
    <rect x="156.15" y="2.0" width="1.7" height="31.1"/>
  </g>
  <g id="handle">
    <rect x="80.6" y="0.9" width="36.9" height="27.5" rx="0.6" fill="#454b56" stroke="#232730" stroke-width="0.3"/>
    <path d="M 85.2 2.2 V 28.4 M 89.8 2.2 V 28.4 M 94.4 2.2 V 28.4 M 99.0 2.2 V 28.4 M 103.6 2.2 V 28.4 M 108.2 2.2 V 28.4 M 112.8 2.2 V 28.4"
          fill="none" stroke="#2b2f36" stroke-width="0.8"/>
    <path d="M 78.8 28.4 V 36.3 Q 78.8 38.6 81.1 38.6 H 116.7 Q 119.0 38.6 119.0 36.3 V 28.4"
          fill="none" stroke="#a2dd35" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 80.9 28.4 V 35.8 H 116.9 V 28.4" fill="none" stroke="#7fb82a" stroke-width="0.4"/>
  </g>
  <rect id="lamp-plate" x="162.9" y="3.9" width="19.0" height="30.4" fill="#6b7280" stroke="#2f343b" stroke-width="0.3"/>
  <circle cx="171.0" cy="8.6" r="3.0" fill="#2b2f36"/>
  <circle id="led-out-ok" cx="171.0" cy="8.6" r="2.5" fill="var(--led-color, #8a9099)" stroke="#2a2d30" stroke-width="0.3"/>
  <path id="hot" d="M 171.0 21.4 L 175.3 28.8 H 166.7 Z" fill="none" stroke="#2b2f36" stroke-width="0.4" stroke-linejoin="round"/>
  <path d="M 169.6 27.0 Q 170.4 25.8 169.6 24.9 M 171.0 27.0 Q 171.8 25.8 171.0 24.9 M 172.4 27.0 Q 173.2 25.8 172.4 24.9" fill="none" stroke="#2b2f36" stroke-width="0.3"/>
  <g id="silkscreen" font-family="Arial" fill="#dfe2e6">
    <g font-size="2.6">
      <text x="15.2" y="9.4" font-weight="bold">AC INPUT</text>
      <text x="15.2" y="13.7">100-240V~</text>
      <text x="15.2" y="18.0">2.5-5A</text>
      <text x="15.2" y="22.3">50-60Hz</text>
    </g>
    <text x="171.0" y="17.7" text-anchor="middle" font-size="2.3" fill="#dfe2e6">OUT_OK</text>
  </g>
