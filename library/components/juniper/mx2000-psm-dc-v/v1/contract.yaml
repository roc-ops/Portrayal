format: 1
kind: module
name: mx2000-psm-dc-v
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper MX2000 DC power supply module (PSM) - nine stand side by side
  in the rear power cage between the two power distribution modules,
  8+1 load-sharing. Input breaker at the top, THIS SIDE UP chip, pull
  handle, nameplate and the input/output/fault lamps at the bottom.
  The AC, 240V-China and HVAC/HVDC variants share the bay - see the
  device gaps.
attrs:
  model: MX2000 DC PSM (-48 V)
  power-output-w: 2500
  role: dc-power-supply
  redundancy: 8+1
provenance:
  power: >-
    MX2010 hardware guide, Table 82 'Calculating DC Power Budget'. THE RATING DEPENDS ON THE
    FEED: 'MX2010 DC PSM 60 A (feed to each input) | 2100' and 'MX2010 DC PSM 80 A or DC PSM
    (240 V China) | 2500'. The 2500 is carried because the column the numbers sit in is
    headed 'Maximum Output Power of Power Supply Module', and this key is that column. A
    budget for a 60 A-fed system must use 2100 and this figure will be wrong for it - which
    is a property of the hardware, not of the record.
  size: 'photo - the MX2010 rear photograph: nine PSMs share ~420 mm of
    width over a ~430 mm bay; ~44 mm each, approximate. No vendor PSM
    dimension in the extraction'
  power-output: 'datasheet-table - the guide power overview: the -48 V
    telecom pool is 22.5 kW with 2.5 kW held for redundancy; per-PSM
    2.5 kW follows from nine sharing it, and that division is ours'
  face: 'photo - breaker, THIS SIDE UP, handle, nameplate, bottom lamps'
states:
- ok
- fault
- absent
size:
  w: 44.0
  h: 430.0
