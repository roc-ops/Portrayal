format: 1
kind: component
name: ex4400-mode-button
version: 1.0.0
class: button
profile: networking
description: >-
  Factory reset and mode button of the Juniper EX4400 switches, at the right
  of the front status block. A flush round button with a list symbol. The
  guide says the button toggles the port mode lamps to show the speed, duplex,
  enable and PoE state of the network ports. The guide calls it the factory
  reset or mode button.
attrs:
  function: factory reset and port mode
provenance:
  sources: >-
    datasheet - EX4400 Switch Hardware Guide (Juniper Networks, PDF created 2026-07-22). Figure 6
    callout 5, Factory reset/mode button. LEDs on the RJ-45, SFP, and SFP+ Network Ports - use
    the mode button on the right-hand side of the front panel to toggle the status LEDs to show
    the different port parameters, the one that is lit being the one shown. The guide describes
    no reset action beyond the name.
  size: >-
    estimated - read off the front render of the EX4400-48P (Figure 25, g022647, 1500 x 199 px,
    the chassis 441.7 mm across at 2.94 px/mm). The button disc is about 16 px, 5.4 mm, across.
    No dimension is stated in any source.
  face: >-
    drawing - Figure 54 (g022614) draws a plain disc with a list symbol of three short bars and
    dots. The render shows the disc grey with the symbol in light blue. The colours are read off
    the render.
size:
  w: 5.4
  h: 5.4
size-confidence: {w: estimated, h: estimated}
skins: [default]
