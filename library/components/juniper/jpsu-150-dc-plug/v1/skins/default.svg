<svg xmlns="http://www.w3.org/2000/svg" width="10.0mm" height="25.0mm" viewBox="0 0 10.0 25.0">
  <!-- The cable connector of the JPSU-150-DC-AFO seen from the front, seated: the body at the connector's outline, a clamp screw at
       each of the three cells, a flange screw at each end, and one wire entering each cell from the right, "+", "-" and the earth
       from the top down. -->
  <rect id="body" x="0" y="0" width="10.0" height="25.0" rx="0.6" fill="#c9cccf" stroke="#5e656c" stroke-width="0.3"/>
  <g id="flange-screws" fill="#d9dbdd" stroke="#5e656c" stroke-width="0.2">
    <circle cx="5.0" cy="2.2" r="0.9"/>
    <circle cx="5.0" cy="22.8" r="0.9"/>
  </g>
  <g id="clamp-screws" fill="#d9dbdd" stroke="#5e656c" stroke-width="0.2">
    <circle cx="2.8" cy="6.3" r="1.3"/>
    <circle cx="2.8" cy="11.9" r="1.3"/>
    <circle cx="2.8" cy="17.5" r="1.3"/>
  </g>
  <rect id="wire-1" x="5.6" y="5.2" width="4.4" height="2.2" rx="0.5" fill="#e6e6e6" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-1-color"/>
  <rect id="wire-2" x="5.6" y="10.8" width="4.4" height="2.2" rx="0.5" fill="#5a5a5a" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-2-color"/>
  <rect id="wire-3" x="5.6" y="16.4" width="4.4" height="2.2" rx="0.5" fill="#9a9fa5" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-3-color"/>
</svg>
