format: 1
kind: module
name: jpsu-550-c-dc-afi
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper JPSU-550-C-DC-AFI, the 550 W DC power supply of the EX4400 switches,
  back-to-front airflow (AFI). The guide ships it with the EX4400-24T-DC-AFI
  and EX4400-48T-DC-AFI, and takes the 550 W DC units for the EX4400-24X and
  -48F as well. Up to two fit in the rear slots 0 and 1, and a second unit
  gives 1+1 redundancy. The face is that of the front-to-back unit with a blue
  (Juniper Azure Blue) handle across the fan. Like that unit it has a D-sub 3W3
  DC input with two jackscrew standoffs, a DC OK lamp and an ejector lever. Do
  not mix AC and DC supplies, or supplies with different airflow, in one
  chassis.
attrs:
  role: dc-power-supply
  power-output-w: 550
  airflow: back-to-front
  input-voltage: -48 VDC to -60 VDC rated operating voltage
  input-current: 13 A
  inlet: other
  input-connector: D-sub 3W3 - -48 VDC input (-), return (+) and ground
  weight-kg: 0.75
  hot-swap: 'yes'
part-numbers:
  JPSU-550-C-DC-AFI: {part: JPSU-550-C-DC-AFI}
provenance:
  sources: >-
    datasheet - EX4400 Switch Hardware Guide (Juniper Networks, PDF created 2026-07-22). Topic DC
    Power Supply in EX4400 Switches. Table 73 lists JPSU-550-C-DC-AFI beside the AFO unit under
    one set of figures. Table 76 gives the electrical specification, Table 79 the DC power
    cable, Table 82 the airflow (AIR IN label and Juniper Azure Blue handle) and Table 114 the
    CLI name. Tables 11 and 26 ship it in the -DC-AFI builds of the 24T and 48T. No figure in the
    guide draws this supply.
  size: >-
    datasheet - Table 40, Physical Specifications of the EX4400 PSUs - width 3.27 in (8.3 cm),
    height 1.59 in (4.04 cm), depth 8.88 in (22.56 cm) for the AC and DC units. The guide gives
    one set of figures and draws one 550 W DC unit, so the back-to-front unit takes the same
    size. Carried as 83.06 x 40.39 x 225.55 mm.
  depth: >-
    datasheet - Table 40, depth 8.88 in (22.56 cm), carried as 225.55 mm.
  power-output-w: >-
    datasheet - Table 76, 550-W DC power supplies - output power 550 W. An output figure, because
    a power supply provides power. The guide gives no draw or loss figure for the unit.
  input: >-
    datasheet - Table 76 gives the rated operating voltage -48 VDC through -60 VDC and the input
    current rating 13 A. The section on the DC power cable says the supplies need a D-sub 3W3
    type connector whose three pins carry the -48 VDC input (-), the return (+) and the
    ground. The connector is the part juniper/ex4400-dc-header@1, composed here as `dc-header`.
  elements: >-
    borrowed - from jpsu-550-c-dc-afo@1, which was read off the rear render of the DC build of the
    EX4400-24T (Figure 10, g022649). The guide shows no back-to-front supply, so only the handle
    colour differs. The estimated positions are those of the front-to-back unit; the connector
    part is placed at 58.9 across and 2.2 down, where that unit places it.
  connector: >-
    borrowed - from jpsu-550-c-dc-afo@1. The guide's text on the DC power cable (the supplies "require
    a D-Sub 3W3- type connector") covers both 550 W DC supplies, and its Table 73 lists JPSU-550-C-DC-AFI
    beside the AFO unit under one set of figures, but no figure draws the AFI unit, so the connector is
    drawn where and as the AFO unit has it. The guide names the cable CBL-JNP-PWR-DSUB (Table 79), a
    whole cable and not a connector part, and no maker or part number for the connector, so
    juniper/ex4400-dc-header@1 is a declared stand-in (its own provenance). It presents the registered
    key dc-connector-3w3, and juniper/qfx10002-dc-plug@1 mates it.
  roles: >-
    guide - EX4400 DC Power Cable Specification: the three pins carry the "-48 VDC input (-)", the
    "return (+)" and the ground. WHICH CONTACT OF THE SHELL IS WHICH IS NOT STATED: no figure of this
    guide prints a mark beside the contacts, so no contact is given a role. Table 76 gives a range, -48
    to -60 VDC rated, and no nominal.
  no-dc-port: >-
    THE DC INPUT PORT IS NOT STATED HERE, ON PURPOSE, for the reason jpsu-550-c-dc-afo@1 gives: a port
    whose poles are a connector's contacts is offered only where that path's part is itself the
    connector, and on a supply in a bay it is the supply. The roles above are recorded for the port a
    later change can state for both 550 W DC supplies together.
  colour: >-
    estimated - the guide names the handle Juniper Azure Blue and shows no picture of it. The
    blue is the one used for the back-to-front fan module, ex4400-fan-afi@1.
  airflow: >-
    datasheet - Table 82. JPSU-550-C-DC-AFI is back-to-front. Cold air enters through the vents
    on the rear panel and hot air leaves through the vents on the front panel, indicated by the
    AIR IN label and the Juniper Azure Blue handle.
  led: >-
    datasheet - Table 73 names the lamp DC.OK. Table 89 and Figure 92 give its states. Steady
    green means the supply receives input and gives proper output. Blinking green means the
    supply fan failed or its internal communication failed. Unlit means the cable is loose, the
    input is wrong, the supply is in standby, the ambient is too hot or the supply failed.
  relief: >-
    estimated - the handle stands proud of the fan in the front-to-back unit's Figure 84. Its
    projection is not measured in any source. The value only makes it read as a handle in 3D.
  power: >-
    datasheet - see power-output-w. No source in the guide states a figure for what the unit
    itself draws.
states:
- ok
- fault
- absent
