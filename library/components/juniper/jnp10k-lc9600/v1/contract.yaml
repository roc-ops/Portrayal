format: 1
kind: module
name: jnp10k-lc9600
version: 1.1.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MX10K-LC9600 line card - 9.6 Tbps, 24 QSFP56-DD cages in two
  rows of twelve, for the MX10004/MX10008.
attrs:
  model: MX10K-LC9600
  power-draw-typical-w: 1655
  power-draw-max-w: 1770
provenance:
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is
    the upper cage upright (rotate 0) over the lower turned 180, so both cage lips face
    the band between the two cages and both bails face outward. Decided by the rule, not
    an observation, so a photograph of the stack overturns it: the 12 QSFP-DD pairs
    (port-0/port-1 to port-22/port-23). 12 of these were drawn with the upper cage
    turned before the std cage art moved its lip to the bottom of the opening; turning
    them keeps the lips in the middle band where they were drawn and seats every optic
    bail-outward. Turning a composed cage in place changes no box, id or anything a
    device places, so it is a minor bump (S6).
  size: 'datasheet-table - the guide FRU table: 1.89 x 17.2 x 19.05 in;
    face drawn 437 x 48 mm'
  power: 'datasheet-table - guide power table, all ports at 400G: 1655 W
    at 25 C, 1770 W at 40 C'
  face: 'photo - two rows of twelve on a ~28.4 mm pitch read off the
    frontwtop photograph at 3.11 px/mm, approximate to ~2 mm'
states:
- ok
- fail
- absent
