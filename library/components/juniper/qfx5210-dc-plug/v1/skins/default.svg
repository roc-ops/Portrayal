<svg xmlns="http://www.w3.org/2000/svg" width="10.9mm" height="29.9mm" viewBox="0 0 10.9 29.9">
  <!-- The cable connector of the QFX5210 DC supply seen from the wire side, seated: a grey body at the header's outline and one
       wire entering each of the three ways. Shapes and colours are estimates; no document held draws a cable connector. -->
  <rect id="body" x="0" y="0" width="10.9" height="29.9" rx="0.8" fill="#9aa0a6" stroke="#5b6066" stroke-width="0.3"/>
  <circle id="wire-1" cx="5.2" cy="9.7" r="1.7" fill="#8a8d91" stroke="#4a4d52" stroke-width="0.12"/>
  <circle id="wire-2" cx="5.2" cy="15.2" r="1.7" fill="#8a8d91" stroke="#4a4d52" stroke-width="0.12"/>
  <circle id="wire-3" cx="5.2" cy="20.4" r="1.7" fill="#8a8d91" stroke="#4a4d52" stroke-width="0.12"/>
</svg>
