format: 1
kind: module
name: mpc5e-100g10g-v2k
version: 1.1.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MPC5E-100G10G fixed MPC - two 100GbE CFP2 ports and four SFP+; the Q variant shares the faceplate. Authored as the MX2000 vertical form, seated through its adapter card (jacks rotated 90).
attrs:
  model: MPC5E-100G10G
  power-draw-max-w: 607
  model-variants: MPC5EQ-100G10G
provenance:
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU power table, MX chassis guides: '| 2x100GE + 4x10GE MPC5E 2x100GE + 4x10GE MPC5EQ | MPC5E-100G10G MPC5EQ-100G10G | With optics: 607 Wat 55° C 541 Wat 4'. The 55 C rung is
    carried, being the worst rated case a chassis budget has to survive.
    The row says WITH OPTICS, so the transceivers are already in this figure.
    Nothing double counts: the `common/` generic optics L27 exempts carry no
    wattage of their own.
    Taken by matching the row's OWN LABEL: these tables pair parts with figures
    in one row - `4-Port: X 8-Port: Y` against `4-Port: 41 W 8-Port: 52 W` - and
    reading first-wins puts the small card's number on the big one. Aligning on
    the N-Port label instead is self-checking, and it checks out: 4-port 41 W
    against 8-port 52 W, 4-port 24 W against 8-port 29 W.
    Seen in 9 guide(s): mx2008, mx2010-p0001-0300, mx2010-p0301-0600, mx2020-p0001-0300.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
states:
- ok
- fail
- absent
parts:
- {ref: std/sfp-ganged@1, id: port-0-1, at: [5.38, 26.73], rotate: 90, attrs: {media: sfp-plus}}
- {ref: std/sfp-ganged@1, id: port-0-0, at: [21.38, 26.73], rotate: 90, attrs: {media: sfp-plus}}
- {ref: std/sfp-ganged@1, id: port-0-3, at: [5.38, 42.57], rotate: 90, attrs: {media: sfp-plus}}
- {ref: std/sfp-ganged@1, id: port-0-2, at: [21.38, 42.57], rotate: 90, attrs: {media: sfp-plus}}
- {ref: std/cfp2@1, id: port-1-0, at: [-0.25, 80.05], rotate: 90, attrs: {media: cfp2}}
- {ref: std/cfp2@1, id: port-2-0, at: [-0.25, 132.15], rotate: 90, attrs: {media: cfp2}}
size:
  w: 41.0
  h: 425.0
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  w and h are the MX2000 vertical card slot opening (the MX2010/MX2020 bays are 41.0 x 425.0),
  which an MPC reaches through its adapter card, not the part. Nothing measured the card:
  provenance/size says so in as many words, and #261 found the same model number drawn at two
  different sizes because two chassis have two openings. Juniper's hardware guides for the
  MX240, MX480 and MX960 all state an MPC/DPC/SCB as 17 x 22 x 1.25 in - the MX960's own book
  included, which is the vendor saying it is ONE card in both orientations - but those figures
  are rounded to the quarter inch, and 1.25 in is 31.75 mm against a modelled 30.45 mm slot
  pitch, so they cannot settle a drawing to 0.1 mm. Estimated until a mechanical drawing or a
  ruler on a real card turns up.
