format: 1
kind: module
name: ex4100-jpsu-920-ac-afo
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper JPSU-920-AC-AFO, the 920 W AC power supply of the EX4100-24P, EX4100-48P, EX4100-24MP and
  EX4100-48MP, front-to-back airflow (AFO). The switch ships with one in power supply slot 0 or 1 and takes
  a second, which raises the PoE+ budget from 740 W to 1440 W. It is hot-removable and hot-insertable once
  a second supply is installed and running. The face has a fan, an orange release latch, two lamps (DC OK and
  AC OK) and a C14 inlet turned portrait. Airflow is front to back, marked AIR OUT.
attrs:
  role: ac-power-supply
  power-output-w: 920
  input: 100 through 127 VAC low line, 200 through 240 VAC high line, 50 or 60 Hz
  input-current: 12 A at low line, 6.5 A at high line
  airflow: front-to-back
  weight-kg: 0.85
part-numbers:
  JPSU-920-AC-AFO: {part: JPSU-920-AC-AFO}
provenance:
  sources: >-
    datasheet - EX4100 Switch Hardware Guide (Juniper Networks, PDF created 2026-10-01): Table 29, Table 30
    (the 920 W specifications), Table 32 (the PoE budget), Table 34 (airflow), Table 40 (the lamps), Figure 42
    (the supply) and the Table 20 note (size and weight).
  size: >-
    datasheet - Table 20 note: power supply width 2.87 in. (7.3 cm), height 1.57 in. (4 cm), depth 8.86
    in. (22.5 cm), one set for every supply. Carried as 73.0 by 40.0 by 225.0 mm. The supply in Figure 2, the
    rear render of the EX4100-24P, is this unit and measures 72.4 by 40.1 mm at 2.957 px/mm. The library holds
    a unit of this part number from the EX3400 line (juniper/ex3400-jpsu-920-ac-afo@1) drawn at another
    size, so it is not reused.
  depth: datasheet - Table 20 note, 8.86 in. (22.5 cm), carried as 225.0 mm.
  power-output-w: >-
    datasheet - Table 30: output power 920 W. An output figure, because a supply provides power. The guide
    gives no draw or loss figure for the unit. Table 32 gives the PoE budget it supports: 740 W with one
    supply and 1440 W with two on the EX4100-24P and EX4100-48P.
  input: >-
    datasheet - Table 30: low-voltage line 100 to 127 VAC at 12 A, high-voltage line 200 to 240 VAC at 6.5 A,
    50 to 60 Hz. Figure 42 prints 100-240Vac 12-6.5A beside the inlet, which the render does not show.
  part-number: >-
    datasheet - Table 29 and Table 34 name the supply JPSU-920-AC-AFO. Table 64 prints the CLI name
    JPSU-920W-AC-AFO and the show chassis output in the guide prints FRU model number JPSU-920-AC-AFO.
  airflow: >-
    datasheet - Table 34: front to back, label AIR OUT. Table 27 says the switch ships with an orange handle.
  leds: >-
    datasheet - Table 40: AC OK and DC OK, green when good, red when failed, flashing red when this supply is
    not receiving power. Figure 42 lists DC OK first, then AC OK, left to right, and the render agrees.
  face: >-
    estimated - the face of the 150 W AC supply (juniper/ex4100-jpsu-150-ac-afo@1), because Figures 42 and 43 and
    the rear render draw the 920 W and 150 W units alike. The positions were read off Figure 2 on the 920 W unit.
  power: >-
    datasheet - see power-output-w. No source in the guide states a figure for what the unit itself draws.
states:
- ok
- fault
- absent
parts:
- {ref: std/c14-inlet@1, id: inlet, at: [40.85, 12.8], rotate: 90}
