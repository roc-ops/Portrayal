format: 1
kind: module
name: mx960-blank
version: 1.1.0
class: blank
behaviour: fills
profile: networking
description: >-
  Juniper MX960 slot blank cover - a plain silver plate with a short slotted knob at each
  end, drawn horizontal like the cards it stands in for; the MX960 seats it turned 90.
  A different part from juniper/mx-dpc-blank, whose knob carries a printed 0/1 rotary mark.
attrs:
  model: DPC-SCB-BLANK
provenance:
  model: >-
    the MX960 hardware guide, Table 5 (hardware components and CLI terminology): 'DPC or SCB blank
    panel | DPC-SCB-BLANK'. The MX480 guide's own Table 5 lists the same number for its interface
    module blank, which juniper/mx-dpc-blank@2 does not yet carry; the two parts are drawn
    differently because the two photographs show different knobs (#899).
  states: >-
    NO LAMP AND NO HEALTH ON A FILLER PANEL. A slot cover is a piece of sheet metal
    that fills an opening: it has no indicator to light and no condition to report,
    so `ok` was a state the viewer generated CSS for, offered as a control, and could
    never show - this part draws no elements at all. `absent` stays, because an empty
    slot is a real thing to draw. See roc-ops/Portrayal#269.
  size: >-
    photo-measured plate, estimated envelope - the plate is 396.0 x 29.5 centred in the 413.5
    slot envelope every MX960 card slot reserves (L123: one bay, one size; the cards' lever
    envelope, #261). Off the MX960 front photograph, the blanks in slots 2, 4, 5 and 8-11:
    plate y px 322-1136.5 = 814.5 px, 396.6 mm at the photograph's 2.054 px/mm down the
    chassis's 704.9 mm height. Authored horizontally as juniper/mx960-blank-v@1's successor,
    which drew it vertical at 30.1 x 405.0 off the old slot geometry.
  knobs: >-
    photo-measured - the MX960 front photograph at about 2.05-2.09 px/mm: a short knob at each
    end of the plate, 39 px = 19.0 mm long and about 17.5 px = 8.4 mm across, overhanging the
    plate end by 3.4 mm (card x 5.35-24.35 and 389.15-408.15), with a slot across it about
    8 mm in from its tip. No printed mark beside it, unlike the MX480's blank. To about 1 mm.
  stiffener: >-
    photo - mx960-blank-v@1 drew a 6 mm rib down the middle of the plate; the photograph shows
    plain plates between the knobs, so the rib is not drawn.
states: [absent]
size:
  w: 413.5
  h: 29.5
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  w is the slot envelope every MX960 card reserves (the 413.5 lever envelope of the cards,
  #261), so a blank seats like a card; the plate inside it is photo-measured and the knobs do
  not reach the envelope's ends. h is the plate height, estimated as the cards'.
