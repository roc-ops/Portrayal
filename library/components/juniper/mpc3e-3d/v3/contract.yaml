format: 1
kind: module
name: mpc3e-3d
version: 3.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MPC3E carrier (MX-MPC3E-3D) - two MIC slots taking MIC3 and selected classic MICs (Table 12).
  The base SKU only; MPC3E-3D-NG and MPC3E-3D-NG-Q share the faceplate but not its wattage or its MIC
  column, and are not this contract. One card for the MX240, MX480 and MX960, drawn horizontal; the MX960
  seats it turned 90.
attrs:
  model: MX-MPC3E-3D
  power-draw-max-w: 440
provenance:
  size: >-
    estimated from the family - not photographed. The plate is 396.0 x 29.5 centred in a 413.5 lever envelope,
    the figures measured off the three photographed cards of this form factor (DPC 40xGE, DPC-R-4XGE,
    SCB-MX: plate x px 127.5-1463.5 = 396.2 mm on the MX240 front at 3.372 px/mm). RE-ENVELOPED, NOT REDRAWN,
    at 2.0.0: every part, bay, lamp and legend at 1.x card x >= 26.15 moved by x' = 8.75 + (x - 26.15)
    * 396.0 / 394.85, the old plate run 26.15-421.0 onto the new 8.75-404.75; y is unchanged. Only the
    levers, the model name and the status group were placed afresh (provenance below). Positions along
    the plate stay layout-derived, as 1.x had them.
  power: >-
    guide FRU power table (Component | Model Number | Maximum Power Requirement), MX chassis
    guides: '| MPC3E | MX-MPC3E-3D | 440W With MICs and optics: 500 Wat 55 C, two 40 W MICs
    ... |'. The cell LEADS with the card-alone figure and the 'With MICs and optics' figures
    follow it; the leading number is what composes, because the MICs seated in this carrier
    are separately modelled parts that answer for themselves. THE GUIDES DISAGREE ON THE
    WITH-MICs FIGURE - 500 W at 55 C in the MX2008 and MX2010 books, 520 W in others, both
    against 'two 40 W MICs' - which is a reason to carry the card-alone number rather than a
    composite. The 440 W itself is identical in every guide that prints the row.
    attrs.model was 'MPC3E' until roc-ops/Portrayal#417 - the table's Component column, where every
    other MPC contract carries the Model Number column; it is MX-MPC3E-3D now. The NG SKUs print their
    own rows ('| MPC3E-3D-NG | MPC3E-3D-NG | 534W ... |', '| MPC3E-3D-NG-Q | MPC3E-3D-NG-Q | 583W ...
    |')
    and their own columns in Table 12, so they are not this contract and will be their own parts.
  accepts: >-
    MX Series Interface Module Reference, 'MIC/MPC Compatibility', Table 12 'MIC/MPC3 Compatibility' (PDF
    pp. 63-66): the
    accepts lists are exactly the MPC3E column, restricted to the MICs this library models.
    REMOVED by roc-ops/Portrayal#417, each an en dash in the MPC3E column and a release only under
    MPC3E-3D-NG and -NG-Q: mic-3d-4xge-xfp (row MIC-3D-4XGE-XFP), mic-3d-10ge-sfp-e (row
    MIC-3D-10GE-SFP-E, 24.2) and mic-3d-8oc3-2oc12-atm (row MIC-3D-8OC3-2OC12-ATM).
    ADDED by roc-ops/Portrayal#417, each a release in the MPC3E column: mic-3d-1oc192-xfp (row
    MIC-3D-1OC192-XFP, 13.3); mic-3d-4oc3oc12-1oc48 and mic-3d-8oc3oc12-4oc48 (the table prints the
    row MIC-3D-4OC3OC12-1OC48, MIC-3D-8OC3OC12-4OC48 twice, at 13.3 and at 12.1 - supported either
    way); mic-3d-8ds3-e3 (row MIC-3D-8DS3-E3, MIC-3D-8CHDS3-E3-B, 12.1); ms-mic-16g (row MS-MIC-16G,
    13.2R2); mic-macsec-20ge (row MIC-MACSEC-20GE, 18.3R1). The MS-MIC-16G row carries two notes the
    bays cannot express: only one MS-MIC-16G per MPC, and beside MIC3-3D-2X40GE-QSFPP,
    MIC3-3D-10XGE-SFPP or MIC3-3D-1X100GE-CFP the pair does not meet NEBS. In the column but not
    listed: MIC-3D-20GE-SFP-E and MIC-3D-8CHDS3-E3-B (not modelled in this library).
    REMOVED by roc-ops/Portrayal#261: mic3-100g-dwdm. The module reference calls it a
    'Dual-wide MIC that installs into two MIC slots', so neither single-wide bay can take it;
    it is unplaced beside MIC-3D-40GE-TX until a module can say it fills two bays.
  numbering: 'guide - ports number within each PIC group with an n/ group legend, per the module reference
    port-numbering figures (g000930, g100786); the exact print positions are layout-derived'
  levers: >-
    photo-measured - the MX240 front photograph: each ejector lever is 97 px = 28.8 mm long and 25-27
    px = 7.4-8.0 mm tall, its tip 9.5 mm past the plate end; drawn 29.0 x 7.4 with the tip at the envelope
    edge (8.75 mm past the plate, which the 413.5 envelope fixes). Centred on the plate: the right-hand
    levers read centred; the left-hand ones read 2.4 mm low, which a lever standing proud of the face
    shows in a photograph taken from above centre. Until 2.0.0 they were drawn 16 x 9 at x 1.2, about
    16 mm left of the real lever and too high.
  model-name: >-
    photo-measured - DPC 40xGE, DPC-R-4XGE and SCB-MX each print the model name from card x 11.4 (the
    plate's left end plus 2.65), baseline 25.5 below the plate top, under the lever. The other cards take
    the same position as the family's.
  status-group: >-
    estimated - the photographed DPCs' status-group position, not photographed on this card: the OK/FAIL
    legend vertical at card x 32.3 centred on y 12.7 and its lamp below it at (32.3, 21.5), as DPC-R-4XGE
    prints them. 1.x drew both at old x 31.0, which the re-envelope would have put under the new lever.
  mic-windows: >-
    photo-measured - the MIC windows are the MICs' own measured plates, 168.8 x 29.2, abutting at the
    card plate's centre. On the MX2010 front photograph, every seated carrier's MIC0/MIC1 seam lies at y
    944.0 px against a plate centre of 943.75 (plate 754.0 to 1133.5 px), MIC0 starting 27 px into the
    plate; the MX104 and MX80 bays, placed off their photographs, leave 0.5 and 0.8 mm between abutting MIC
    plates, so the seam is drawn 0.5. mic0 runs 37.7 to 206.5 and mic1 207.0 to 375.8 in card x, which is
    28.95 to 367.05 measured from the plate's left edge (the plate runs 8.75 to 404.75, centre 206.75),
    each window 8.7 mm clear of its lever; y 0.15 centres the 29.2 plate on the 29.5 card. Until 3.0.0
    (juniper/mpc3e-3d@2, kept as a deprecated major superseded by this one) the bays were the estimated 168 x 27 window at 37.75 and 206.15.
