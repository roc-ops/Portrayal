name: qfx5200-48y-fan-afi
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  QFX520048Y-FAN-AI (the guide's fan table also spells it QFX5200-48Y-FAN-AFI), a field-replaceable
  fan module with back-to-front (FRU-to-port) airflow: air comes in at the fan end and leaves at the
  port side. It is marked AIR IN, has a blue handle, and is hot-removable and hot-insertable. The
  QFX5200 hardware guide says the QFX5200-48Y takes it, six to a switch (fan modules 0 to 5, left to
  right). The front-to-back sibling is QFX520048Y-FAN-AO. The two are never mixed in one chassis, and
  never with power supplies of the other direction. This module has no status lamp of its own (the
  guide says the 48Y fan modules have no LED indicators).
attrs:
  model: QFX520048Y-FAN-AI
  airflow: back-to-front
  power-absent: not-published
provenance:
  size: >-
    photo-measured, for the sibling - the same slot and module outline as qfx5200-48y-fan-afo@1
    (39.9 mm face and 8.3 mm flange on a 48.6 mm pitch, 40.6 mm high, from the QFX5200-48Y rear
    photograph and the guide's figure 26). No photograph of this back-to-front module exists, so
    nothing here is measured on it.
  depth: >-
    not stated. The guide's figure 28 is an isometric drawing with no scale and its tables give no
    depth, so none is written.
  face: >-
    drawing and photo of the sibling - the layout is that of the photographed front-to-back module:
    a hexagonal grille over the face, a handle bar across the lower third, a captive screw on the
    flange. The guide's table 17 labels this module AIR IN; there is no photograph, so the chip is
    lettered with the guide's AIR IN and not with a guess at what the real chip prints (the
    photographed front-to-back module prints F2B where the guide says AIR OUT).
  airflow: >-
    datasheet - guide Table 17: QFX5200-48Y-FAN-AFI (Table 3 spells it QFX520048Y-FAN-AI) carries the
    label AIR IN, is blue, and is FRU-to-port airflow, also called back-to-front.
  colour: >-
    borrowed - the guide says only "Blue", and no photograph of this module exists. The blue is the
    one the library already carries for Juniper Azure Blue on juniper/qfx5110-fanafi@1, estimated.
  power: >-
    not published. Searched the QFX5200 hardware guide for a per-module wattage near its cooling
    sections and its power tables; only whole-switch figures exist. The module declares power-absent so
    the missing figure is a statement and not a silence.
