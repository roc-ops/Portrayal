format: 1
kind: module
name: re-s-1300
version: 1.0.0
class: supervisor
behaviour: fills
profile: networking
description: >-
  Juniper RE-S-1300 Routing Engine (RE-S-1300-2048, EOL) as photographed in
  the MX240's SCB-MX bays. 1.3 GHz processor, 2 GB memory. The face carries
  the HDD/MASTER and OK-FAIL/ONLINE lamp block, the recessed ONLINE/OFFLINE
  button and RESET pinhole, and the USB, AUX, CONSOLE and ETHERNET ports;
  the ETHERNET jack is the fxp0 out-of-band management port.
attrs:
  model: RE-S-1300-2048
  power-draw-max-w: 90
  cpu: 1.3 GHz
  memory: 2 GB
  lifecycle-note: EOL per TSB16556; modelled because it is the RE the
    reference photograph carries
provenance:
  size: 'photo - 261.8 x 27.5 mm, the plate between the SCB bay edges off the
    orthographic front photograph. No vendor RE dimension exists in the
    intake - searched the physical-specification tables'
  power: >-
    guide FRU power table (Component | Model Number | Maximum Power Requirement), MX chassis
    guides: '| | RE-S-1300-2048 (EOL'd) RE-S-2000-4096 (EOL'd) RE-S-1800 (all variants) |
    ... | 90W |'. Table 93 'FRU Power Requirements'. One row covers three Routing Engines
    and states a single 90 W; it is the same in the MX480 and MX960 guides.
  face: 'photo - lamps, buttons and the four ports placed off the photograph
    at 3.386 px/mm: lamp block at x 42.7/47.6, ONLINE/OFFLINE button 87.4,
    RESET 97.0, USB 170.0, AUX 187.9, CONSOLE 205.3, ETHERNET 222.8 (all
    centres). AUX/CONSOLE/ETHERNET are RJ45 (registry), USB vertical'
  leds: 'guide RE LED table (RE-S-1300 family): HDD green blinking =
    disk activity; MASTER green = primary; OK/FAIL green ok / red fault;
    ONLINE green = online'
states:
- ok
- fail
- absent
parts:
- {ref: std/usb-a@1, id: usb, at: [164.0, 11.5], rotate: 90, attrs: {function: USB service port}}
- {ref: std/rj45@1, id: aux, at: [179.9, 6.75], attrs: {function: auxiliary console}}
- {ref: std/rj45@1, id: console, at: [197.3, 6.75], attrs: {function: serial console}}
- {ref: std/rj45@1, id: ethernet, at: [214.8, 6.75], attrs: {function: fxp0 out-of-band management}}
elements:
  latch:
    at: [1.0, 6.0]
    size: [5.0, 16.0]
    class: latch
size:
  w: 261.8
  h: 27.5
