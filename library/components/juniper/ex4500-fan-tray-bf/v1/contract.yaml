format: 1
kind: module
name: ex4500-fan-tray-bf
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  The fan tray of the Juniper EX4500 switches with back-to-front airflow. It is one field-replaceable
  unit with five fans, installed horizontally in the rear of the chassis, with a handle at each end.
  It is hot-removable and hot-insertable, and the switch runs 30 seconds while it is replaced. An
  orange INTAKE label shows through the vents. Its colour must match the orange ejector lever of the
  power supplies. A single fan cannot be replaced. The guide gives no part number for it.
attrs:
  role: chassis-fan
  airflow: back-to-front
  power-absent: not-published
provenance:
  sources: >-
    datasheet - EX4500 Switch Hardware Guide (modified 2017-10-18): Cooling System and Airflow in an EX4500
    Switch (Figure 18, the tray, an isometric drawing; Tables 3 and 15; Figures 19 and 20) and Figure 6, the
    flat rear panel, which draws the front-to-back tray. The guide's own copyright and the Juniper EULA
    govern it; it is read for facts only and nothing of it is copied. The guide prints no part number for
    the tray; the CLI calls it "Fan tray, back-to-front airflow" (Table 4).
  size: >-
    drawing - Figure 6, as juniper/ex4500-fan-tray-fb@1: 352.5 x 63.1 mm, estimated to 1.5 mm. This unit
    is not drawn; it takes the size of the front-to-back tray, since both fit one bay.
  depth: >-
    estimated - not stated. Searched the guide for the tray's dimensions and weight: no figure is given.
    No depth is written.
  face: >-
    drawing - Figure 6, drawn as for the front-to-back tray: a perforated field between two end handles
    and the numerals 1 and 0 at the left. The label colour is the only mark that differs.
  label: >-
    datasheet - "The INTAKE label is orange. The EXHAUST label is green." Where it sits behind the
    perforation is not drawn in any figure held, so the label strip is placed at the middle of the tray
    and is estimated.
  power: >-
    estimated - not published. The guide's power tables leave "Power required by fans" blank. The module
    declares power-absent so that the missing figure is a statement.
states: [absent]
elements:
  handle-left:
    at: [7.0, 0.8]
    size: [12.0, 61.5]
    class: latch
  handle-right:
    at: [333.5, 0.8]
    size: [12.0, 61.5]
    class: latch
size:
  w: 352.5
  h: 63.1
size-confidence: {w: estimated, h: estimated}
relief:
  features:
  - node: handle-left
    out: 3.0
    confidence: estimated
    source: figure - the handles stand proud of the perforated field; the projection is not measured
  - node: handle-right
    out: 3.0
    confidence: estimated
    source: figure - the handles stand proud of the perforated field; the projection is not measured
skins: [default]
