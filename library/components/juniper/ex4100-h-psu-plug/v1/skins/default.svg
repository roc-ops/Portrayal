<svg xmlns="http://www.w3.org/2000/svg" width="8.5mm" height="30.5mm" viewBox="0 0 8.5 30.5">
  <!-- The conductor ends clamped in a PSU connector seen from the front, seated: five stripped ends at the connector's five
       positions, 3.81 mm apart. Shapes and colours are estimates; the guide's figures are line art. -->
  <rect id="body" x="0" y="0" width="8.5" height="30.5" rx="0.7" fill="#b9bec4" stroke="#5e656c" stroke-width="0.3"/>
  <g id="ends" fill="#d9dbdd" stroke="#5e656c" stroke-width="0.2">
    <rect x="1.2" y="5.9" width="6.1" height="3.2" rx="0.4"/>
    <rect x="1.2" y="9.7" width="6.1" height="3.2" rx="0.4"/>
    <rect x="1.2" y="13.5" width="6.1" height="3.2" rx="0.4"/>
    <rect x="1.2" y="17.3" width="6.1" height="3.2" rx="0.4"/>
    <rect x="1.2" y="21.1" width="6.1" height="3.2" rx="0.4"/>
  </g>
</svg>
