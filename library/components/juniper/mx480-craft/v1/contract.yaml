format: 1
kind: module
name: mx480-craft
version: 1.0.0
class: display
behaviour: fills
profile: networking
description: >-
  Craft interface panel for the Juniper MX480 - hot-insertable FRU above the
  card cage. RE0/RE1 host lamp columns, FAN and PEM 0-3 lamp pairs, yellow/
  red alarm lamps, ACO/LT button, YELLOW/RED ALARM relay blocks (NC-C-NO),
  and per-slot OK/FAIL lamp pairs with numbered tabs - blue 0/1 for the SCBs
  and white 0-5 for the DPC slots.
attrs:
  model: MX480 Craft Interface
  power-absent: not-published
provenance:
  power: >-
    NOT PUBLISHED. The chassis guide for this part is staged and converted, its FRU power
    requirements table is present, and THIS PART IS NOT IN IT - which is a stronger
    statement than the figure merely being absent: the vendor tabulated the components it
    budgets for and did not tabulate this one. Searched beyond that table as well - all 573 converted documents, for this part, with a twelve-line window either side and a
    thirty-line window against any line introducing a power requirement or consumption. No
    wattage falls near a mention anywhere.
  size: 'photo - spans the 420.9 mm between flanges, 42.0 mm tall (front
    photo rows 38.6-80.6). The front photograph is 5% anisotropic in y and
    was anchored per axis. No vendor craft dimension exists in the intake'
  features: 'photo + guide Figure 6 - lamps, alarm cluster, relay blocks and
    the eight slot tab groups placed off the photograph; positions are
    approximate at panel scale. Vocabularies from the craft LED tables'
