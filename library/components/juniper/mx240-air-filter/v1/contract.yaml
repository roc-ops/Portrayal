format: 1
kind: module
name: mx240-air-filter
version: 1.0.0
class: filter
behaviour: fills
profile: networking
description: >-
  Juniper MX240 air filter - installs vertically at the rear left beside the
  air intake; only its narrow door face shows on the rear (the AIR FILTER
  legend prints on the chassis plate beside it). A replaceable maintenance
  item per the guide's routine-maintenance chapter.
attrs:
  model: MX240 Air Filter
provenance:
  states: >-
    NO LAMP AND NO HEALTH ON AN AIR FILTER. The part is a frame of filter media; it
    has no indicator and reports nothing, so `ok` was a control the viewer offered
    and nothing could show - this part draws no elements at all. `absent` stays,
    because a chassis running without its filter is a real thing to draw. See
    roc-ops/Portrayal#269.
  size: 'photo - the visible rear door face is ~12 x 110 mm at the rear left
    (door outline off the orthographic rear photograph, approximate); no
    vendor filter dimension exists in the intake'
  face: 'estimated - a plain door strip with two screws; guide Figure 10
    shows the filter element itself, not its installed rear face'
states: [absent]
size:
  w: 12.0
  h: 110.0
