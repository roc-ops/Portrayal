name: mx240-air-filter
version: 1.0.0
class: filter
behaviour: fills
profile: networking
description: >-
  Juniper MX240 air filter - installs vertically at the rear left beside the
  air intake; only its narrow door face shows on the rear (the AIR FILTER
  legend prints on the chassis plate beside it). A replaceable maintenance
  item per the guide's routine-maintenance chapter.
attrs:
  model: MX240 Air Filter
