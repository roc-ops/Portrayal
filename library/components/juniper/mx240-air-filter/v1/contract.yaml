  size: 'photo - the visible rear door face is ~12 x 110 mm at the rear left
    (door outline off the orthographic rear photograph, approximate); no
    vendor filter dimension exists in the intake'
  face: 'estimated - a plain door strip with two screws; guide Figure 10
    shows the filter element itself, not its installed rear face'
states:
- ok
- absent
size:
  w: 12.0
  h: 110.0
