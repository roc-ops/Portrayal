size-notes: >-
  w and h are the MIC form's plate, borrowed from juniper/mx-mic-blank@2 and the horizontal MICs that
  state it (#261): 168.8 x 29.2, photo-measured off square-on MX104 and MX80 front photographs, drawn
  here turned. This model was not photographed. The guides call every MIC one 1.25 x 6.25 x 6.8 in
  part, but their rows do not dimension the face (the axes are assigned differently in different
  books and the figures are rounded to a tenth of an inch), so the figure is the MIC form's and not
  The MX2010 front photograph, scaled at 0.981 px/mm off the chassis (473.5 px over the guide's 19 in,
  1482.7 px over its 59.50 in), reads four seated MIC faces 27.1 mm across (+/- 1.2) and 166.9 mm long
  (+/- 2.1): the length agrees with the plate and the width reads 2.1 mm short of it. It has a third of
  the resolution of the MX104 and MX80 photographs, so it is declared here and not used for the figure.
  this model's own. Until 2.0.0 this was the 27.0 x 168.0 'window', an estimate read off the carrier.
