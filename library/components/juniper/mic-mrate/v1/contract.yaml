format: 1
kind: module
name: mic-mrate
version: 1.3.2
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper 12-port multirate QSFP28 MIC for the MX2000 MPC8E/MPC9E; only the vertical author exists.
unplaced: >-
  SUPERSEDED by juniper/mic-mrate@2, the plate the MX2000 multirate MICs and their carriers now draw at
  (#261). This major is kept and deprecated rather than deleted, so a manifest that pins it still
  resolves; nothing in this library seats it.
superseded-by: juniper/mic-mrate@2
attrs:
  model: MIC-MRATE
  power-draw-max-w: 85
  qsfp: 12
provenance:
  qsfp-rate: >-
    module reference, 'MIC MRATE' (Table 39, p360): 'Twelve Gigabit Ethernet ports that support quad small
    form-factor pluggable plus (QSFP+) transceivers', each 'configured as a 40- Gigabit Ethernet port or as
    four 10-Gigabit Ethernet ports'. THE 100G RATE DEPENDS ON THE CARRIER, so every port is counted at the
    40G it always runs: 'Port numbers 0 through 3, and 6 through 9 are the eight 100-Gigabit Ethernet
    ports' (Table 39: ports 4, 5, 10 and 11 'no'), and 'When used in MX2K-MPC8E: 4 ports out of the total
    12 support 100-Gigabit Ethernet speed' (four ports the book does not name), so the eight 100G ports
    are those of an MPC9E. The placements are left as they were.
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): on a card
    drawn on its side a pair sits left and right, the left cage 270 beside the right 90,
    so both cage lips face the band between the two cages and both bails face outward.
    Decided by the rule, not an observation, so a photograph of the stack overturns it:
    the 6 QSFP pairs (port-0-1/port-0-0 to port-1-5/port-1-4). Turning a composed cage
    in place changes no box, id or anything a device places, so it is a minor bump (S6).
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU power table, MX chassis guides: MIC MRATE, MIC-MRATE = 1.250 A @48 V (60 W)
    in an MPC8E; 1.771 A @48 V (85 W) in an MPC9E.
    THIS PART'S DRAW DEPENDS ON ITS CARRIER and the vendor states both cases. The 85 W is
    carried because this key is the worst rated case; in an MPC8E the same MIC draws 60 W,
    so a budget for that carrier may take this figure as 25 W pessimistic. The vendor gives
    current and voltage alongside and its own product agrees with both: 1.250 x 48 = 60.0
    and 1.771 x 48 = 85.0.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
  groups: >-
    Juniper MX Series 5G Universal Routing Platform Interface Module Reference, 'MIC MRATE' and
    'Multi-Rate Ethernet MIC' (printed pages 358 to 361 and 370 to 379): twelve ports 'numbered 0
    through 11', each configurable as 40 or as four 10-Gigabit Ethernet ports, and eight of them (0 to 3
    and 6 to 9) as 100-Gigabit Ethernet ports on the MPC9E, four on the MPC8E. The rate of a port
    depends on its carrier, and the book calls the cage QSFP+ here and QSFP28 for the JNP-MIC1, so the
    group states neither a speed nor a media: each port keeps the media it already states. Port ids
    port-P-N are faceplate port 6P+N. The role is traffic.
states:
- ok
- fail
- absent
