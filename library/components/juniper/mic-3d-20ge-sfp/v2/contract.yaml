format: 1
kind: module
name: mic-3d-20ge-sfp
version: 2.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper Gigabit Ethernet MIC with SFP - twenty cages in two PIC groups of ten; the E and EH revisions share the faceplate. MIC form: the MIC's own 168.8 x 29.2 plate, photo-measured (#261).
attrs:
  sfp: 20
  model: MIC-3D-20GE-SFP
  model-variants: MIC-3D-20GE-SFP-E, MIC-3D-20GE-SFP-EH
  power-draw-max-w: 37
provenance:
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is
    the upper cage upright (rotate 0) over the lower turned 180, so both cage lips face
    the band between the two cages and both bails face outward. Decided by the rule, not
    an observation, so a photograph of the stack overturns it: the 10 SFP pairs
    (port-0-0/port-0-1 to port-1-8/port-1-9). 10 of these were drawn with the upper cage
    turned before the std cage art moved its lip to the bottom of the opening; turning
    them keeps the lips in the middle band where they were drawn and seats every optic
    bail-outward. Turning a composed cage in place changes no box, id or anything a
    device places, so it is a minor bump (S6).
  sfp-rate: >-
    the cage RATE, transcribed from this contract's own description: 'Gigabit Ethernet MIC
    with SFP - twenty cages in two PIC groups of ten'. Without it `cage_type` finds no media
    attr for the sfp family and falls through to PART_IFACE's default, which is SFP+ at 10G
    - a rate this card does not run. Nothing new was measured.
  size: >-
    photo-measured - the MIC plate, 168.8 x 29.2, from the MX104 and MX80 front photographs as
    size-notes says: plates 520, 521 and 520.5 px at 3.090 px/mm on the MX104 (body 1350.5 px over 437.0
    mm; the ganged-SFP pitch reads 44.0 to 44.2 px, 3.091), 521.8 and 522.5 px at 3.088 on the MX80
    (ganged-SFP pitch 44.0 px; 1374 px between the ear wings over 445.0 mm agrees); heights 90 to 90.75
    px.
  power: >-
    guide FRU table - MX240 guide Table 93 'FRU Power Requirements', MIC section:
    '| Gigabit Ethernet MIC with SFP | MIC-3D-20-GE-SFP | 37W |', in nine guides. A maximum for the
    MIC alone, without optics; the row prints no temperature ladder, so there is no ambient to name
    and none is claimed. Note the vendor prints the part number with an extra hyphen in every copy
    of that row - MIC-3D-20-GE-SFP - which is why a whole-token search for the real part number
    misses it. The module reference's '0.77 A @48 V (37 W)' agrees on the value but is stated for
    the -E and -EH extended-temperature variants, not for this part.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
  layout: >-
    estimated - RE-ENVELOPED, NOT REDRAWN, at 2.0.0 (#261): every part and printed mark of the 1.x art
    moved by (+0.4, +1.1) onto the measured plate (centring the old art where its width allows);
    positions along the plate stay as 1.x had them. What 1.x said of them: registry + layout - the face
    is the slot geometry of its chassis family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate drawing. The MIC-3D-20GE-SFP-E
    port-numbering figure g000930 shows the two-column PIC layout this follows
