format: 1
kind: module
name: mic-3d-20ge-sfp
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MIC-3D-20GE-SFP - 20x1GbE SFP Modular Interface Card, two rows of
  ten ganged cages, as photographed twice in the MX104 reference unit.
attrs:
  model: MIC-3D-20GE-SFP
  power-draw-max-w: 26
provenance:
  size: 'photo - the MX104 front photograph is isotropic at 3.087 px/mm once the mounting brackets are excluded; MIC-slot geometry is a single-pass reading approximate to ~2 mm, and no vendor MIC face dimension is usable (the physical table scrambles w/d/h axes - recorded on the device)'
  power: 'MX104 guide power table lists the 20x1GE MIC at 26 W maximum
    (ambient unqualified - max is our reading, recorded)'
  cages: 'photo - two rows of ten on the registry 14.25 pitch, upper row
    rotate 180, read off the reference photograph'
states:
- ok
- fail
- absent
