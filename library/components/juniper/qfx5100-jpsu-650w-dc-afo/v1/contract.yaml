format: 1
kind: module
name: qfx5100-jpsu-650w-dc-afo
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  JPSU-650W-DC-AFO, a 650 W DC power supply with port-to-FRU airflow, which the datasheet calls
  front-to-back. It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares
  with its twin. The datasheet says the QFX5100-48S, QFX5100-48T and QFX5100-24Q take it. The 1RU
  models seat two, in slots 0 and 1 at the right of the rear. The face carries four terminals
  labelled V-, V-, V+ and V+, an ESD grounding point and three lamps labelled IN, OUT and !. It
  also has a handle at the left and a black ejector lever. The V- terminals are shunted together
  inside the supply, as are the V+ terminals. The back-to-front sibling is JPSU-650W-DC-AFI. AC and
  DC supplies, and supplies of different airflow direction, are never mixed in one chassis.
attrs:
  model: JPSU-650W-DC-AFO
  role: dc-power-supply
  power-output-w: 650
  airflow: front-to-back
  inlet: dc-terminal
  input: rated -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum (guide, Table 17)
provenance:
  size: >-
    drawing - the guide's flat DC faceplate drawing (Figure 33, g050297) spans 397 by 299 px, an
    aspect of 1.328 against 1.377 for the AC supply's measured bay, 3.6 percent out. No document or
    photograph gives the DC supply's size in millimetres, so it takes the size of the AC supply's
    bay (54.8 x 39.8 mm, photo-measured on the QFX5100-48S rear), which the DC supply fits as the
    guide says both go in the same 1RU slots. The size is estimated.
  depth: >-
    not stated. Searched the QFX5100 hardware guide for the supply's depth: Figures 31 and 32 are
    isometric drawings with no scale and the DC power tables give only voltage, current and power.
    No depth is written.
  face: >-
    drawing - measured from Figure 33, scaled to the face by fractions of each axis (7.21 px/mm
    across, 7.51 down, as the aspect is 3.6 percent out): the handle at the left edge, a block of
    four terminals at 8.3 mm pitch with V-, V-, V+ and V+ printed above them, a fifth small screw at
    the block's end, the IN, OUT and ! lamps below the block, the ESD grounding point and its
    symbol at the lower right, the ejector lever at the right edge and a field of vent squares. The
    lever extends 2 mm past the face edge in the drawing; only the part inside the face is drawn.
    Positions are good to about 0.5 mm. Figure 34 shows the same lamps and terminals.
  colour: >-
    estimated - no figure of the DC supply is in colour. The guide's text on mixing components
    says supplies are Juniper Azure Blue for airflow in and Juniper Gold for airflow out where they
    are colour-coded, and Table 13 gives the AC supplies those colours; the DC supply's handle is
    drawn in the same colours on that reading. The gold is the orange of juniper/qfx5110-fanafo@1,
    sampled from a Juniper photograph. The drawing prints no label on the DC handle, so none is
    drawn.
  power-output-w: >-
    datasheet - the datasheet's ordering table (JPSU-650W-DC-AFO, "DC 650W PSU, front-to-back
    airflow for QFX5100-48S, QFX5100-48T, QFX5100-24Q"); the guide says the 1RU DC supply is 650 W.
    An OUTPUT, since a supply provides power.
  input: >-
    datasheet - guide, Table 17: rated operating voltage -48 to -60 VDC, operating range -40
    through -72 VDC, 10 A maximum input current; the 1RU supply needs a source of at least 7 A at -48
    VDC. The datasheet's list says -36 to -72 V DC; the guide's range is used.
  leds: >-
    datasheet - guide, DC Power Supply LEDs on a QFX5100 Device (Table 18): Input is green when power
    is coming into the supply, Output is green when the supply sends power out correctly, and Fault
    is amber when an error is detected; each is unlit otherwise.
  airflow: >-
    datasheet - the datasheet's ordering table: JPSU-650W-DC-AFO is front-to-back airflow. The guide
    gives no DC table of airflow and colour.
  seats: >-
    estimated - each of the four terminal screws is the library's common/terminal-screw-34@1, a screw
    head 3.4 across (that part's own size is an estimate), standing at the centre of the screw this skin
    already draws (14.8, 23.2, 31.5 and 39.8 across, 11.7 down). It is not lifted: no document gives the
    projection of the screws and this contract draws no relief for them. The QFX5100 Switch Hardware
    Guide asks for ring-lug power cables, "Molex 190700069 or equivalent" (PDF page 147) and gives no
    screw head, thread or pitch; the screw part claims no thread, so none is written. Each screw is a
    seat a ring lug lands on (`terminal-stud`, which generic/ring-lug@1 mates).
  shunts: >-
    THE SECOND SCREW OF EACH PAIR IS A SEAT OUTSIDE THE PORT. The guide's caution says the V+ terminals
    are shunted internally together, as are the V- terminals, that the same polarity may be wired twice
    from the same source and that the terminals must never go to different sources. A feed therefore has
    two conductors and the supply has one input, however many screws carry them. Each pole of the port
    is the first screw of its pair, counted from the left: `pole-batt` is the left V- screw and
    `pole-rtn` the left V+ screw. `shunt-batt` (the second V- screw) and `shunt-rtn` (the second V+
    screw) are seats a lug lands on, as an earth seat is, and are in no pole (decided 2026-11-03). WHICH
    SCREW OF A PAIR CARRIES THE POLE IS A CHOICE AND NOT A READING: the guide joins the two inside the
    supply and ranks neither. A later change that gave the port four poles would be a major.
  poles: >-
    QFX5100 Switch Hardware Guide, Figure 33 "DC Power Supply Faceplate in QFX5100 Devices" (PDF page
    71, printed page 62) prints V-, V-, V+ and V+ from the left over four screws, with callout 1 "Shunt
    negative input terminals (-48V)" on the two V- screws and callout 2 "Shunt positive input terminals
    (+RTN)" on the two V+ screws, and the caution under Figure 34 (PDF page 73) says the V+ terminals
    are shunted internally together, as are the V- terminals. The connection steps (PDF page 147) put
    the positive (+) cable on "the V+ (return) DC power input terminal" and the negative (-) cable on
    "the V- (input) DC power input terminal", and the guide says the device takes "a single,
    non-redundant," feed per supply (PDF page 149). The roles are the guide's words, not the printed
    signs: `rtn` for the "(return)" terminal and `batt` for the "(input)" terminal, which the guide
    pairs with the negative cable (spec/schemas/dc.yaml writes `batt` as negative (battery)). The supply
    has one DC port, `input`, of two poles, `batt` on the left V- screw and `rtn` on the left V+ screw,
    in the order the figure prints them from the left. The second screw of each pair is a seat outside
    the port (see `shunts`).
  voltage: >-
    NOT STATED. Table 17 (PDF page 72) prints "Rated operating voltage: -48 VDC to -60 VDC" and an
    operating range of -40 VDC through -72 VDC: ranges with no nominal. A port states one nominal and no
    document gives this supply's, so the port states none and a later change can state one once a source
    says so. `attrs` keeps the range as printed.
  rating: >-
    NOT STATED. Table 17 (PDF page 72) gives "DC input current rating: 10 A maximum" for the QFX5100
    models, a chassis figure, and the same part number is the supply of other chassis whose guides print
    other figures: 7 A for the QFX3500 (PDF page 86), 8 A for the QFX3600 (PDF page 80), 20 A for the
    EX4650 (PDF page 61), 7 A for the EX4550 (PDF page 71) and 20 A at -44 VDC for the EX9251 (PDF page
    43). One figure on the part would be wrong for some of them, so the port states none. `attrs` keeps
    the QFX5100's words as printed.
  awg: >-
    QFX5100 guide, the list of parts and tools for connecting DC power (PDF page 147): "DC power source
    cables (14-16 AWG) with ring lug (Molex 190700069 or equivalent) (not provided)": a range of two
    sizes, so the port states both, 14 and 16. The QFX3500 (PDF page 117), QFX3600 (PDF page 113),
    QFX5110 (PDF page 138) and QFX5120-48T (PDF page 205) guides print the same list for the chassis
    that seat this part; the EX4650 guide gives no wire size. The "(not provided)" cables are the
    site's.
