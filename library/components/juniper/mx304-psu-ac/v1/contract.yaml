format: 1
kind: module
name: mx304-psu-ac
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper MX304 AC power supply module. Two stack at the rear left (PSU 0
  over PSU 1), 1+1 redundant and hot-swappable. Dual-rated - 1100 W output on
  100-120 VAC input, 2200 W on 200-240 VAC - with a C20 appliance inlet, a
  fan behind the round grille at the left of the face, an orange pull handle
  and a single STATUS lamp. Nameplate 100V-240V, 50/60 Hz, 13 A.
attrs:
  envelope: 73.5 x 40.1 x 198.5 mm (Table 22)
  model: MX304 AC PSU
  role: ac-power-supply
  power-output-w: 2200
  power-output-low-line-w: 1100
  input: 100-240 VAC nominal (operating 90-264 VAC), 47-63 Hz, 13 A
  redundancy: 1+1
provenance:
  size: 'datasheet-table + photo - Table 22: AC power supply 2.89 x 1.57 x
    7.81 in (73.5 x 40.1 x 198.5 mm). The drawn face is the 66.0 mm visible
    aperture measured off the rear photograph; the 73.5 envelope is carried
    in attrs'
  power-output-w: 'guide Table (AC power specifications): "Maximum output
    power | 100V-120V: 1100W  200V-240V: 2200W". The number carried is the
    HIGH-LINE 2200 W rating; the low-line 1100 W is beside it in attrs. An
    OUTPUT because a psu PROVIDES power'
  face: 'photo - mx304-rear-ac-high.jpg: round fan grille left with the
    orange pull handle below-left, C20 inlet right (composed from
    std/c20-inlet@1), STATUS lamp above the inlet. The black cord-retainer
    bail over the inlet is deliberately not drawn (cable furniture). Lamp
    position is approximate'
  leds: 'guide Table 13 (Power Supply Module LEDs), one STATUS lamp: green
    blinking 1 Hz = standby, 2 Hz = firmware updating, steady = output on and
    ok; amber steady = faulty (failure, overcurrent, short, overvoltage, fan
    failure or overtemperature); amber blinking 1 Hz = warning or AC lost;
    off = no AC power'
states:
- ok
- fault
- absent
parts:
- {ref: std/c20-inlet@1, id: inlet, at: [32.6, 7.8]}
elements:
  handle:
    at: [1.2, 24.4]
    size: [10.5, 13.0]
    class: latch
size:
  w: 66.0
  h: 40.1
  d: 198.5
relief:
  features:
  - node: handle
    out: 2.0
    color: '#e8731f'
    confidence: estimated
    source: photo - the orange pull handle stands proud; projection not measured
