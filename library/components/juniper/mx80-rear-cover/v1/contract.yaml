format: 1
kind: module
name: mx80-rear-cover
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Juniper MX80 rear service cover - the silver plate over the rear
  aperture labelled MPC 0 / MIC 1 on the chassis (the modular chassis
  services the forwarding hardware through it).
attrs:
  model: MX80 rear cover
provenance:
  states: >-
    NO LAMP AND NO HEALTH ON A FILLER PANEL. A slot cover is a piece of sheet metal
    that fills an opening: it has no indicator to light and no condition to report,
    so `ok` was a state the viewer generated CSS for, offered as a control, and could
    never show - this part draws no elements at all. `absent` stays, because an empty
    slot is a real thing to draw. See roc-ops/Portrayal#269.
  size: 'photo - the rear photograph reads the plate at ~170 x 32 mm on
    the per-axis anchoring; approximate. No vendor dimension exists'
states: [absent]
size:
  w: 170.0
  h: 32.0
