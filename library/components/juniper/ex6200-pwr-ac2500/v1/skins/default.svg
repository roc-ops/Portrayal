<svg xmlns="http://www.w3.org/2000/svg" width="100.7mm" height="101.8mm" viewBox="0 0 100.7 101.8">
  <defs>
    <pattern id="cells" width="3.8" height="3.8" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="2.6" height="2.6" fill="#101214"/>
    </pattern>
  </defs>
  <rect id="face" x="0" y="0" width="100.7" height="101.8" rx="1.2" fill="#c9ccd0" stroke="#7d8186" stroke-width="0.4"/>
  <g id="vents">
    <rect x="6.3" y="14.2" width="60.3" height="85.0" fill="url(#cells)"/>
  </g>
  <g id="screws">
    <circle cx="11.0" cy="5.2" r="1.8" fill="#aeb2b7" stroke="#6b6f75" stroke-width="0.35"/>
    <path d="M 9.6 5.2 H 12.4 M 11.0 3.8 V 6.6" stroke="#6b6f75" stroke-width="0.4"/>
    <circle cx="87.6" cy="5.2" r="1.8" fill="#aeb2b7" stroke="#6b6f75" stroke-width="0.35"/>
    <path d="M 86.2 5.2 H 89.0 M 87.6 3.8 V 6.6" stroke="#6b6f75" stroke-width="0.4"/>
  </g>
  <g id="handle">
    <path d="M 7.8 72.0 L 59.8 15.8" stroke="#6b6f75" stroke-width="3.6" stroke-linecap="round" fill="none"/>
    <path d="M 7.8 72.0 L 59.8 15.8" stroke="#aeb2b7" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>
  <g id="enable-switch">
    <rect x="76.0" y="62.0" width="17.0" height="11.0" rx="1.0" fill="#2b2e32" stroke="#14161a" stroke-width="0.4"/>
    <rect x="79.0" y="64.2" width="11.0" height="6.6" rx="0.6" fill="#8e9298" stroke="#5d6167" stroke-width="0.3"/>
  </g>
  <circle id="led-input-ok" cx="73.5" cy="98.1" r="0.9" fill="var(--led-color, #5a5f65)" stroke="#3a3e43" stroke-width="0.3"/>
  <circle id="led-output-ok" cx="82.5" cy="98.1" r="0.9" fill="var(--led-color, #5a5f65)" stroke="#3a3e43" stroke-width="0.3"/>
  <circle id="led-fail" cx="90.0" cy="98.1" r="0.9" fill="var(--led-color, #5a5f65)" stroke="#3a3e43" stroke-width="0.3"/>
  <g id="silkscreen" font-family="sans-serif" fill="#2b2e32" text-anchor="middle">
    <text x="84.5" y="59.6" font-size="1.5">ENABLE</text>
    <text x="84.5" y="76.4" font-size="1.4">STANDBY / ON</text>
    <text x="73.5" y="94.2" font-size="1.3">INPUT</text>
    <text x="73.5" y="95.8" font-size="1.3">OK</text>
    <text x="82.5" y="94.2" font-size="1.3">OUTPUT</text>
    <text x="82.5" y="95.8" font-size="1.3">OK</text>
    <text x="90.0" y="95.8" font-size="1.3">FAIL</text>
  </g>
