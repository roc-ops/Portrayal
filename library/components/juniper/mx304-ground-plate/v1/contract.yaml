format: 1
kind: component
name: mx304-ground-plate
version: 1.0.0
class: ground
behaviour: mounts
profile: networking
description: >-
  Protective-earthing landing on the MX304 rear right - a vertical bright
  plate with two threaded holes on 16 mm centres for M6 pan-head screws,
  under the panel's earth symbol. The guide requires the two-holed earthing
  terminal bracket attached here and the chassis permanently earthed.
attrs:
  model: MX304 grounding terminal
provenance:
  holes: 'guide grounding specifications, verbatim facts: "grounding points
    are studs sized for M6 hex screws ... spaced at 0.63-in. (16-mm)
    centers" and "two threaded holes on the rear side ... fit M6 pan head
    screws". The photograph shows the two screws seated vertically'
  plate: 'photo - mx304-rear-ac-high.jpg: bright vertical plate at the rear
    right, screws at 16 mm vertical pitch; the 16 x 36 mm plate outline was
    NOT measured against anything of known size and is approximate'
size:
  w: 16.0
  h: 36.0
