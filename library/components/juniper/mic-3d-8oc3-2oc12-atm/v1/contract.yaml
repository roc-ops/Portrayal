format: 1
kind: module
name: mic-3d-8oc3-2oc12-atm
version: 1.3.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper ATM MIC with SFP (eight ports). MIC form (168 x 27 window; the earlier 31 mm reading was the bay opening with bezel - a MIC must seat inside the 29.5 mm MPC face, so the window is 27).
attrs:
  oc3: 8
  model: MIC-3D-8OC3-2OC12-ATM
  power-draw-max-w: 35
provenance:
  stack-orientation: >-
    The belly-to-belly cage pairs on this card follow the library's stack convention
    (docs/pluggables-3d-design.md, S1-S4): a row pair is the upper cage upright (rotate
    0) over the lower turned 180, so both cage lips face the band between the two cages
    and both bails face outward, where a thumb reaches them. Where this provenance
    records a reading of a stack the orientation is that reading; otherwise it is the
    rule, not an observation. A photograph of the stack that shows otherwise overturns
    it. 4 pairs were drawn with the UPPER cage turned before the std cage art moved its
    lip to the bottom of the opening; turning them to the convention keeps the lips in
    the middle band where they were drawn, and seats every optic bail-outward. Turning a
    composed cage in place changes no box, id or anything a device places, so it is a
    minor bump (S6).
  sonet-rate: >-
    the SONET rate, transcribed from this contract's own description: 'ATM MIC with SFP
    (eight ports)'. Without it the SFP cage has no rate to read and the export typed it
    Gigabit Ethernet, which an OC-3 port is not. Nothing new was measured.
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU table - MX2008 guide FRU power table: '| ATM MIC with SFP | MIC-3D-8OC3-2OC12-ATM | 35W |',
    repeated in both halves of the mx2010 and mx2020 guides. A maximum for the MIC alone, without
    optics; the row prints no temperature ladder, so there is no ambient to name and none is claimed.
    IT IS TAKEN FROM THE MX2000-FAMILY GUIDES BECAUSE THE MX240 GUIDE HAS NO ROW FOR THIS MIC. Table
    93's row headed 'ATM MIC with SFP' carries the part number MPC4E-3D-2CGE-8XGE and that card's
    610 W - a Juniper error present in mx240, mx480 and both halves of mx960, which displaces the
    real ATM MIC entry from all four.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
states:
- ok
- fail
- absent
parts:
- {ref: std/sfp-ganged@1, id: port-0-0, at: [16.00, 3.60], attrs: {media: sfp}}
- {ref: std/sfp-ganged@1, id: port-0-1, at: [16.00, 15.20], rotate: 180, attrs: {media: sfp}}
- {ref: std/sfp-ganged@1, id: port-0-2, at: [30.25, 3.60], attrs: {media: sfp}}
- {ref: std/sfp-ganged@1, id: port-0-3, at: [30.25, 15.20], rotate: 180, attrs: {media: sfp}}
- {ref: std/sfp-ganged@1, id: port-0-4, at: [44.50, 3.60], attrs: {media: sfp}}
- {ref: std/sfp-ganged@1, id: port-0-5, at: [44.50, 15.20], rotate: 180, attrs: {media: sfp}}
- {ref: std/sfp-ganged@1, id: port-0-6, at: [58.75, 3.60], attrs: {media: sfp}}
- {ref: std/sfp-ganged@1, id: port-0-7, at: [58.75, 15.20], rotate: 180, attrs: {media: sfp}}
size:
  w: 168.0
  h: 27.0
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  w and h are the MIC window in an MPC face, not the part. Nothing measured the card:
  provenance/size says so in as many words, and #261 found the same model number drawn at two
  different sizes because two chassis have two openings. Juniper's hardware guides for the
  MX240, MX480 and MX960 all state an MPC/DPC/SCB as 17 x 22 x 1.25 in - the MX960's own book
  included, which is the vendor saying it is ONE card in both orientations - but those figures
  are rounded to the quarter inch, and 1.25 in is 31.75 mm against a modelled 30.45 mm slot
  pitch, so they cannot settle a drawing to 0.1 mm. Estimated until a mechanical drawing or a
  ruler on a real card turns up.
