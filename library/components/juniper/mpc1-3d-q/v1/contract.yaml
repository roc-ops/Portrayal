format: 1
kind: module
name: mpc1-3d-q
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MPC1 Q carrier (MX-MPC1-3D-Q) - two MIC slots. It stands for MX-MPC1E-3D-Q too: the two share wattage
  and MIC column. The non-queuing MPC1 and MPC1E (juniper/mpc1e-3d) draw less and take fewer MICs. One card for
  the MX240, MX480 and MX960, drawn horizontal; the MX960 seats it turned 90.
attrs:
  model: MX-MPC1-3D-Q
  model-variants: MX-MPC1E-3D-Q
  power-draw-max-w: 175
provenance:
  model: >-
    datasheet - MX Series Interface Module Reference, Table 4 'MPCs Supported by MX240, MX480, MX960, MX10003, MX10004, MX10016, MX2008, MX2010, and MX2020 Routers' (PDF pp. 33-34): rows 'MPC1 Q' (MPC Model
    Number MX-MPC1-3D-Q) and 'MPC1E Q' (MX-MPC1E-3D-Q). The two cards' own pages (printed pp. 146 and 148) print
    the same wattage, weight and MIC slots, and the MX240 guide's FRU power table gives them one row.
  size: >-
    estimated from the family - not photographed. The plate is 396.0 x 29.5 centred in a 413.5 lever envelope, the
    figures the library draws every MPC, DPC and SCB at (mpc1e-3d@3, mpc2e-3d@3; plate x px 127.5-1463.5 = 396.2 mm on the
    MX240 front photograph at 3.372 px/mm). The reference prints this card as a three-quarter view with a magnified inset of the left ejector lever, its lamp and its model label (printed p. 146); it has no front elevation and no dimension. Nothing here is resized.
  power: >-
    datasheet - MX240 Universal Routing Platform Hardware Guide, Table 93 'FRU Power Requirements' (printed p. 222, PDF
    p. 238): '| MPC1 Q MPC1E Q | MX-MPC1-3D-Q MX-MPC1E-3D-Q | 175 W With MICs and optics: 249 W at 131 F (55 C) ...
    |'. 175 W is the leading, card-alone figure of the row; the ladder under it is with MICs and optics, a different
    scope. The module page (printed p. 146) states 3.65 A @ 48 V (175 W).
  accepts: >-
    datasheet - MX Series Interface Module Reference, 'MIC/MPC Compatibility', Table 10 'MIC/MPC1 Compatibility'
    (printed pp. 46-49), the 'MPC1Q' column (identical to 'MPC1EQ' but for the first release), restricted to the MICs
    this library models. Each listed MIC prints a release in that column: MIC-3D-20GE-SFP, MIC-3D-20GE-SFP-E,
    MIC-3D-2XGE-XFP, MIC-3D-40GE-TX, MIC-3D-4OC3OC12-1OC48 and MIC-3D-8OC3OC12-4OC48, MIC-3D-1OC192-XFP,
    MIC-3D-8OC3-2OC12-ATM (12.1), MIC-3D-4COC3-1COC12-CE (12.2), MIC-3D-4CHOC3-2CHOC12 and MIC-3D-8CHOC3-4CHOC12
    (11.4), MIC-3D-16CHE1-T1-CE (12.3), MIC-3D-8DS3-E3, MIC-MACSEC-20GE (18.3R1) and MS-MIC-16G. MIC-3D-4XGE-XFP is an en
    dash in every MPC1 column, and MIC-3D-10GE-SFP-E has no row in that table. MIC-3D-40GE-TX is a 'Dual-wide MIC that
    installs into 2 slots', so it is in mic0's list only, and mic0 states `span: [mic1]`. In the column but not listed:
    MIC-3D-20GE-SFP-E and MIC-3D-8CHDS3-E3-B (variants of listed MICs). Only one MS-MIC-16G can be installed into any
    MPC (Table 11's note).
  numbering: >-
    guide - the reference prints small numerals beside every cage, numbered within each PIC segment with a group
    legend, never flat across the card. The MICs seated in this carrier's two bays draw those numerals; the carrier
    draws none of its own, as its figure shows none.
  levers: >-
    estimated - the inset (printed p. 146) shows an ejector lever at the card's left end with a round screw head, the model label beside it and a lamp below it. Drawn as the library draws every MPC lever, 29.0 x 7.4 centred on the plate with
    the tip at the envelope edge, measured off the MX240 front photograph for the DPC 40xGE, DPC-R-4XGE and SCB-MX
    (97 px = 28.8 mm long, 25-27 px = 7.4-8.0 mm tall). Not remeasured on this card.
  model-name: >-
    estimated - the inset prints the model number MX-MPC1-3D-Q in small type beside the lever. Placed at card x 11.4, baseline 25.5 below the plate top, where the photographed
    DPC 40xGE, DPC-R-4XGE and SCB-MX print theirs.
  status-group: >-
    estimated - the inset shows one round lamp under the lever, matching the module page's 'OK/FAIL LED, one bicolor'. Placed as the photographed DPCs place theirs: the OK/FAIL legend vertical at card x
    32.3 centred on y 12.7 and the lamp below it at (32.3, 21.5).
  mic-windows: >-
    estimated - the module page states 'Two slots for MICs labeled PIC 0/1 and PIC 2/3'; the three-quarter view shows the card's board rather than its faceplate, so no window is seen or dimensioned. Drawn at the MICs' own plate, 168.8 x 29.2, as mpc1e-3d@3 draws
    them (mic0 37.7 to 206.5, mic1 207.0 to 375.8 in card x; y 0.15), the window the MX2010 front photograph measures
    on every seated carrier. The latches and tabs are not drawn.
