size-confidence: {w: drawing, h: estimated}
size-notes: >-
  w is the lever envelope and h the plate height, of ONE card that every MX240, MX480 and MX960 slot takes - the
  MX960 seats it turned 90, as its own hardware guide says by stating an MPC/DPC/SCB as one 17 x 22 x 1.25 in part
  in all three books. The 413.5 is Juniper's Visio stencil, whose every MPC/DPC/SCB master is the same 0.1156 x
  1.6281 page-inch rectangle at an exactly 1:10 scale (29.36 x 413.54 mm), read as the lever-tip envelope; the
  plate between the levers is 396.0. The 29.5 is the plate height, estimated: the MX240 photograph reads it
  28.6-29.0 at 3.37 px/mm and nothing dimensions it.
