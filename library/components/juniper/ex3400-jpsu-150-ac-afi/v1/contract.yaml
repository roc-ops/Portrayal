format: 1
kind: module
name: ex3400-jpsu-150-ac-afi
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper JPSU-150-AC-AFI, the 150 W back-to-front AC power supply for the EX3400-48T-AFI. It
  seats in power supply slot 0 or 1 at the rear. It is hot-insertable and hot-removable, but a
  switch with only one supply must be powered off before the supply is removed. The face has a fan,
  a release latch, a C14 inlet and two lamps, DC OK and AC OK. Airflow is back to front, marked AIR IN.
attrs:
  role: ac-power-supply
  power-output-w: 150
  input: 100 through 240 VAC, 50 or 60 Hz
  airflow: back-to-front
  weight-kg: 0.65
part-numbers:
  JPSU-150-AC-AFI: {part: JPSU-150-AC-AFI}
provenance:
  size: >-
    estimated - no photograph of the back-to-front supply is held. Its face is drawn at the size and
    art of the 150 W AFO supply, with the AIR IN label, itself taken from the 920 W supply in
    Juniper's EX3400-48P rear studio photograph (71.2 by 39.0 mm at 3.327 px/mm). The guide gives no
    supply dimension, only the weight (Table 12), and no depth.
  power-output-w: >-
    datasheet - EX3400 Switch Hardware Guide (published 2026-01-09), Characteristics of a AC Power
    Supply, "EX3400 switches support 150 W, 600 W, 920 W AC power supply", and Table 12 names this
    unit JPSU-150-AC-AFI. Table 1 ships it with the EX3400-48T-AFI. An output, because a supply
    provides power.
  airflow: >-
    datasheet - Table 12: back-to-front, indicated by label AIR IN. The label is drawn on the face.
  handle-colour: >-
    estimated - the guide states no handle colour for either airflow direction and no photograph of
    a back-to-front unit is held, so the latch keeps the orange of the front-to-back supply
    photographs. A different colour on the real unit is not ruled out.
  leds: >-
    datasheet - Table 13 and Figure 13: AC OK is green when the supply receives proper input power;
    DC OK is green when the supply delivers power and red when it has failed.
  face: >-
    estimated - the art is the AFO supply's with the legend changed. The cord retainer clip is a
    loose accessory and is not drawn. The inlet is std/c14-inlet@1.
states:
- ok
- fault
- absent
parts:
- {ref: std/c14-inlet@1, id: inlet, at: [38.0, 12.5]}
elements:
  led-dc:
    at: [41.9, 3.4]
    size: [2.2, 2.2]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: red, color: '#e03a2f'}
    - 'off'
  led-ac:
    at: [59.8, 3.4]
    size: [2.2, 2.2]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  latch:
    at: [29.5, 1.2]
    size: [9.8, 36.6]
    class: latch
size:
  w: 71.2
  h: 39.0
size-confidence: {w: estimated, h: estimated}
relief:
  features:
  - node: latch
    out: 1.6
    color: '#ee6a1f'
    confidence: estimated
    source: photo - the latch of the front-to-back supply stands proud; projection not measured
skins: [default]
