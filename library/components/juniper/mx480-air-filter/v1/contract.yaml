format: 1
kind: module
name: mx480-air-filter
version: 1.0.0
class: filter
behaviour: fills
profile: networking
description: >-
  Juniper MX480 air filter - vertical at the rear left beside the intake;
  only its narrow door face shows on the rear.
attrs:
  model: MX480 Air Filter
provenance:
  states: >-
    NO LAMP AND NO HEALTH ON AN AIR FILTER. The part is a frame of filter media; it
    has no indicator and reports nothing, so `ok` was a control the viewer offered
    and nothing could show - this part draws no elements at all. `absent` stays,
    because a chassis running without its filter is a real thing to draw. See
    roc-ops/Portrayal#269.
  size: 'photo - vertical door strip ~12 x 240 mm at the rear left,
    approximate; no vendor filter dimension exists in the intake'
states: [absent]
size:
  w: 12.0
  h: 240.0
