name: mx2000-cb-re-1800-v
version: 2.1.0
class: supervisor
behaviour: fills
profile: networking
description: >-
  Juniper MX2000 Control Board and Routing Engine (CB-RE) - a combined
  vertical FRU, one at each end of the upper cage. Console, management
  and timing jacks run down the faceplate with the routing-engine lamps
  at the top.
attrs:
  model: 'RE-MX2000-1800X4'
  power-draw-typical-w: 150
  power-draw-max-w: 250
provenance:
  size: >-
    guide + photo (#902). The MX2010 and MX2020 hardware guides' physical-specification tables give the
    SFB, the SFB2 and both CB-REs (RE-MX2000-1800X4-S, REMX2K-X8-64G) as 1.7 in (4.31 cm) wide and 16.225
    in (41.21 cm) high: 43.18 x 412.1. The MX2010 front photograph (about 0.96 px/mm) puts the ten
    upper-cage slots on the line-card pitch, every SFB's left rail (x px 120, 162, 204, 246, 288, 328, 370,
    412) over a line-card gap (122, 162, 204, 244, 286, 328, 368, 410), so a CB-RE is as wide as an SFB;
    its upper cage reads 0.893 of the line-card cage's height against the guides' 0.916, which at that
    resolution does not overrule a vendor dimension. Until 2.0.0 this was 55 x 405, read off that photograph
    at ~3 mm. Everything on the face moved -5.91 mm across to stay centred; nothing moved down.
  power: >-
    MX2020 hardware guide, Table 80 'FRU DC Power Requirements': '| CB-RE | RE-MX2000-1800X4
    | 150 W(Typical) 250 Wat 55 C 250 Wat 40 C |'. The 55 C figure is carried. Corroborated
    by a budget row that states the per-board figure with its own arithmetic, 'CB-RE |
    RE-MX2000-1800X4-S | 250W*2=500W'. THE MX2010 GUIDE'S ROW FOR THIS PART READS 400W AND
    IS NOT TAKEN. That table is visibly damaged by the PDF conversion - the fan-tray ladder
    immediately above it is split across two rows ('Fan trays, upper | 200 W(Typical) 1700
    Wat 55 C' then 'Fan trays, lower | 350 Wat 25 C'), and the RE-MX2000-1800X4 row in the
    same table is truncated to its typical with the ladder missing. The MX2020's rows are
    complete and internally consistent, and both CB-REs there agree at 250 W. A reader
    taking the MX2010 row would be 150 W high.
    THIS CONTRACT WAS ONE OF THREE CB-REs SHARING A DRAWING, under a model field reading
    'MX2K-MPC-CB-RE' - which is not a Juniper part number, and is why every search for it
    came back empty. The real numbers are REMX2K-X8-64G, REMX2K-X8-128G and RE-MX2000-1800X4.
  face: 'photo - the jack stack resolves as RJ45 pairs, a USB and an SFP
    cage on the studio photograph; per-jack legends are below its
    resolution and are summarised - see the device gaps'
  groups: >-
    Juniper Networks, MX2010 Universal Routing Platform Hardware Guide (published 2025-11-17),
    'RE-MX2000-1800x4 CB-RE Front Panel' (printed pages 88 to 90, Figure 41, Table 20): the
    front-panel tables and figures name the 'AUX', 'CONSOLE' and 'MGMT' ports, a USB port, the
    external-clock ports and 'XGE-0' and 'XGE-1', and the text says each CB-RE has 'one
    10/100/1000-Mbps Ethernet port' for the management network; the pinout section prints the
    same of 'MGMT' (printed page 236). So the MGMT jack carries `speed: 1g` (the highest native
    rate of a 10/100/1000 jack) and the two serial jacks are typed rj45-serial, the BITS jack
    rj48, as the sibling CB-RE states them. Table 20 lists AUX, CONSOLE, MGMT, USB, ExtClk-1 and
    ExtClk-2 and XGE-0 and XGE-1. The guide calls the XGE ports 'hardware diagnostics' ports for
    'Juniper-internal use only': the management SFP joins the management group as the sibling
    board's does and states no rate. The role follows the job: the page names no role for the
    ports, and the role is management because a board's console, auxiliary, management Ethernet,
    USB and external-clock jacks are how the box is reached and disciplined.
states:
- ok
- fail
- absent
