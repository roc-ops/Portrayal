format: 1
kind: module
name: ms-mpc
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper Multiservices MPC (MS-MPC) - a services card with no network ports; the face is a vent field (module reference Figure 9).
attrs:
  model: MS-MPC
  power-draw-max-w: 585
provenance:
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. service card - a plain vented face'
  power: >-
    datasheet-table - the module reference model section states the requirement;
    585 W max.
    A SECOND SOURCE SAYS 590 AND BOTH ARE JUNIPER. The MX960 chassis guide's
    power table gives 'Multiservices MPC | MS-MPC-128G | 590W', no ambient
    stated. 585 is kept: the module reference is the card's own book where the
    chassis guide's number appears in a budgeting context, and the two differ by
    under one percent. Recorded rather than reconciled - a figure moved to match
    another source without a reason to prefer it loses the disagreement and
    gains nothing.
    THE GUIDE ROW NAMES A CAPACITY AND THIS CONTRACT NAMES A FAMILY. MS-MPC-128G
    is the only Multiservices MPC capacity anywhere in the corpus - 8 mentions of
    it, 3 of MS-MPC-128, no other number - so the two are the same card here. If
    a second capacity turns up, this contract is modelling two things and wants
    splitting. See roc-ops/Portrayal#36 for the wider question of a model attr that is not an
    orderable SKU.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
states:
- ok
- fail
- absent
size:
  w: 420.9
  h: 29.5
