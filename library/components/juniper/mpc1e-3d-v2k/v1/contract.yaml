    - juniper/mic-3d-8choc3-4choc12-v@1
    - juniper/mic-3d-4oc3oc12-1oc48-v@1
    - juniper/mic-3d-8oc3oc12-4oc48-v@1
    - juniper/mic-3d-8oc3-2oc12-atm-v@1
    - juniper/mic-3d-8ds3-e3-v@1
    - juniper/mic-3d-16che1-t1-ce-v@1
    - juniper/ms-mic-16g-v@1
    - juniper/mx-mic-blank-v@1
    default: juniper/mic-3d-20ge-sfp-v@1
  mic1:
    at: [7.0, 214.0]
