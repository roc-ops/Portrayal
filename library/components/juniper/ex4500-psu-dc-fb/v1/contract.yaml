format: 1
kind: module
name: ex4500-psu-dc-fb
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  The DC power supply of the Juniper EX4500 switches. It has front-to-back airflow only and gives
  1200 W at 12 VDC from a -48 VDC feed. It is a field-replaceable unit, hot-removable and
  hot-insertable. The face has a terminal block with two input lugs (-48 VDC and RTN) and a fan. It also
  has a diagonal handle, a bicolour status lamp labelled POK and a green ejector lever. A 1200 W supply
  needs a dedicated 30 A breaker. The guide gives no part number for it.
attrs:
  role: dc-power-supply
  inlet: dc-terminal
  power-output-w: 1200
  airflow: front-to-back
  input: -42 to -60 VDC, nominal -48 VDC, 30 A maximum (guide Table 42)
provenance:
  sources: >-
    datasheet - EX4500 Switch Hardware Guide (modified 2017-10-18): DC Power Supply in EX4500 Switches
    (Figures 24 and 25), Table 42 (the DC figures) and Table 3 (which models ship it). The guide's own
    copyright and the Juniper EULA govern it; it is read for facts only and nothing of it is copied. The
    guide prints no Juniper part number for the supply. The CLI calls it "PS 1000W /1200W DC
    Front-to-back airflow" (Table 4).
  size: >-
    estimated - Figure 24 is an isometric drawing with no scale. The supply fills the same slot as the AC
    supply, so it takes that size: 76.0 x 39.8 mm. See juniper/ex4500-psu-ac-fb@1.
  depth: >-
    estimated - not stated. The guide gives the weight, 3 lb (1.3 kg), and no size. No depth is written.
  face: >-
    estimated - Figure 24 is isometric. It shows a terminal block at the left, a handle and a lamp. The
    block, the two lugs, the fan and the handle are drawn in the places the AC supply uses, which is
    an assumption: a later flat drawing would settle it.
  lever: >-
    datasheet - DC Power Supply in EX4500 Switches: the lever is green for front-to-back airflow, and
    the guide names no other colour for the DC supply.
  airflow: >-
    datasheet - Table 3 and Table 15: the DC supply is front-to-back only, in EX4500-40F-DC-C and
    EX4500-40F-VC1-DC.
  power: >-
    datasheet - Table 42: output 1200 W, 12 VDC output, 30 A maximum input at -48 VDC.
  led: >-
    datasheet - Table 17: one bicolour lamp labelled POK. Unlit: no input. Green: working. Green blinking
    or amber: failed.
  seats: >-
    estimated - each terminal is the library's common/terminal-screw-34@1, a slotted head 3.4 across
    (that part's own size is an estimate), standing at the centre of the terminal this skin already
    draws (`term-neg` and `term-pos`: centres 8.4 across, 12.6 and 27.4 down, themselves estimated
    from the isometric Figure 24, as `face` says). The seats are not lifted: no document says how far
    the terminals stand off the block, and this contract draws no relief for them. The guide's step
    for connecting DC power (printed pages 144 and 145) has the cable lug secured to the input
    terminal with "the locking screw" and gives a torque, and Figure 40 (printed page 145) draws a
    one-hole lug with its screw going through the hole; no page gives the screw's thread or head, and
    the screw part claims no thread, so none is written. The lug in the figure is a lug on a screw
    terminal, so the seat is the ring lug's. The guide names a Molex 190410014 cable lug "or
    equivalent" and no size for the hole
  poles: >-
    Juniper EX4500 Switch Hardware Guide (modified 2017-10-18), "DC Power Supply in EX4500 Switches"
    (printed page 42): "a pair of DC input lugs (-48 VDC and RTN) on the front of the power
    supply", and step 5 of "Connecting DC Power to an EX4500 Switch" (printed page 145), which says
    the negative cable is installed on "the -48V (input) DC power input terminal" and the positive
    cable on "the RTN (return) DC power input terminal"; Figure 40 (printed page 145) labels the two
    terminals -48V and RTN. The roles are the legend's words: `batt` for -48V and `rtn` for RTN
    (spec/schemas/dc.yaml writes `batt` as "-48V"). The figure is isometric and shows which
    terminal carries which word, not which of this skin's two terminals it is, so the contract
    follows the skin's own names: `term-neg`, the upper terminal, is the -48V terminal and
    `term-pos`, the lower, is RTN. The port's poles are in the order the guide names them
  voltage: >-
    Juniper EX4500 Switch Hardware Guide, Table 42 "Power Specifications for the DC Power Supply Used
    in an EX4500 Switch" (printed page 84): "Nominal operating voltage: -48 VDC" and an operating
    voltage range of -42 VDC through -60 VDC. A held table gives a nominal, so the port states it,
    with its minus, and the range in the order the table gives it
  rating: >-
    datasheet - Table 42 (printed page 84): "30 A maximum at nominal operating voltage (-48 VDC)",
    the supply's DC input current rating, which is the figure `attrs` already carries; the note
    beside Figure 24 (printed page 43) asks a dedicated 30 A circuit breaker, which is the
    circuit's
  awg: >-
    NOT STATED. The guide's list of parts for "Connecting DC Power to an EX4500 Switch" (printed
    page 144) asks for "DC power source cables (not provided) with the cable lugs (Molex 190410014 or
    equivalent)" and gives no wire size, and no table of the guide does, so the port states none
states:
- ok
- fault
- absent
elements:
  term-neg:
    at: [6.0, 10.2]
    size: [4.8, 4.8]
    class: screw
  term-pos:
    at: [6.0, 25.0]
    size: [4.8, 4.8]
    class: screw
  led-status:
    at: [32.4, 32.7]
    size: [2.4, 2.4]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  lever:
    at: [0.4, 12.0]
    size: [3.6, 16.0]
    class: latch
fields:
  handle-finish: {label: Ejector lever colour, type: text, default: '#3fa34d'}
size:
  w: 76.0
  h: 39.8
size-confidence: {w: estimated, h: estimated}
relief:
  features:
  - node: lever
    out: 1.2
    confidence: estimated
    source: figure - the lever stands proud of the face; its projection is not measured
parts:
  - {ref: common/terminal-screw-34@1, id: pole-batt, at: [6.7, 10.9]}
  - {ref: common/terminal-screw-34@1, id: pole-rtn, at: [6.7, 25.7]}
dc:
  ports:
    - id: input
      direction: input
      voltage: {nominal: -48, range: [-42, -60]}
      rating-a: 30
      poles:
        - {role: batt, slot: pole-batt}
        - {role: rtn, slot: pole-rtn}
      source: {poles: poles, voltage: voltage, rating-a: rating}
skins: [default]
