format: 1
kind: module
name: mic-3d-4xge-xfp-v
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper 4-port 10GbE MIC with XFP (one PIC of four). Vertical author for the vertical carriers (MX960/MX2000 MPCs stand on end, and their MICs with them).
attrs:
  model: MIC-3D-4XGE-XFP
  power-draw-max-w: 37
provenance:
  pitch-note: >-
    L81 flags this composing 4 x std/xfp@1 at 21.1mm, tighter than the
    registry's 23.5mm floor. This module's own `size` provenance already says
    positions are "laid out from the module reference port description and
    registry cage sizes, NOT measured from a faceplate drawing" - so 21.1mm is
    a layout guess, not a sourced figure, and it undercuts the very registry
    it claims to be derived from. Recorded rather than silently moved: nothing
    here has been checked against a real faceplate. Flagged 2026-09-13 for
    follow-up with a photo or drawing of this MIC.
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU power table, MX chassis guides: '| 10-Gigabit Ethernet MIC with XFP | 2-Port:
    MIC-3D-2XGE-XFP 4-Port: MIC-3D-4XGE-XFP | 2-Port:29W 4-Port:37W |'. Read by matching the
    row's own N-Port label rather than by position, because one row carries both cards and
    both figures; the alignment self-checks, 2-port 29 W against 4-port 37 W. NO AMBIENT IS
    STATED for this row - unlike most of the tables around it, which give a 25/40/55 C
    ladder - so none is recorded rather than invented.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
states:
- ok
- fail
- absent
parts:
- {ref: std/xfp@1, id: port-0-0, at: [3.75, 17.70], rotate: 90, attrs: {media: xfp}}
- {ref: std/xfp@1, id: port-0-1, at: [3.75, 38.80], rotate: 90, attrs: {media: xfp}}
- {ref: std/xfp@1, id: port-0-2, at: [3.75, 59.90], rotate: 90, attrs: {media: xfp}}
- {ref: std/xfp@1, id: port-0-3, at: [3.75, 81.00], rotate: 90, attrs: {media: xfp}}
size:
  w: 27.0
  h: 168.0
