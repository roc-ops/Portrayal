format: 1
kind: module
name: mic-3d-4xge-xfp-v
version: 2.0.1
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper 4-port 10GbE MIC with XFP (one PIC of four). Vertical author for the vertical carriers (MX960/MX2000 MPCs stand on end, and their MICs with them).
attrs:
  xfp-10g: 4
  model: MIC-3D-4XGE-XFP
  power-draw-max-w: 37
provenance:
  ethernet-rate: >-
    the Ethernet rate, from the MX Series Interface Module Reference, which files
    MIC-3D-4XGE-XFP under 10-Gigabit Ethernet MICs with XFP. The XFP cage cannot say: it
    takes a 10GbE optic and an OC-192 one, and the framing is what differs. The export
    already typed it 10gbase-x-xfp by default; this makes that a statement. Nothing new was
    measured.
  size: 'the face is the 168 x 27 MIC window of its carriers, not the part (size-notes);
    the cage positions are measured from a vendor figure - see layout'
  layout: >-
    estimated - THE FIGURE'S SCALE IS IN QUESTION. Square-on photos of the MX104 and MX80, each
    scaled two independent ways (the chassis, and the ganged-SFP pitch of 14.25), put the MIC plate
    at 168.6 x 28.9 mm and the XFP bezel at 20.9-21.1 mm outside, 18.3-18.6 mm dark opening. Read on
    a 21 mm bezel, Figure 31 gives a ~170 mm plate and a ~35 mm cage pitch, not the 158.2 and 32.69
    below; read on 19.5 it gives these. The cages below are the 19.5 reading, far closer than the
    22.0 drawn before, and stay estimated until roc-ops/Portrayal#261 re-measures this MIC from the
    MX104 photo directly. THE READING: MX Series Interface Module Reference, Figure 31 'Port Numbering for 4-Port 10-Gigabit
    Ethernet MIC with XFP' (g100580, PDF p. 297), measured on the EMBEDDED image (1462 x 466 px at
    300 ppi, pdfimages), not a page render. SCALE: the XFP bezel opening, 19.5 mm (INF-8077i Figs
    37-38), drawn 174.0 px outer edge to outer edge on all four ports alike, = 8.923 px/mm. TWO
    PROOFS the scale did not use: the plate, 1412 px outer edge to outer edge, comes to 158.2 mm
    against the 6.25 in (158.75 mm) MIC width of MX240 guide Table 88 (-0.3%); and the opening's
    height, 85.25 px, comes to 9.55 mm against the MSA's 9.7 +/-0.2 (inside tolerance). PORT CENTRES
    from the plate's left edge: 32.44, 65.60, 97.82, 130.50 mm (pitch 33.16, 32.22, 32.68 - wider
    than INF-8077i 6.8's 23.5 mm nominal, so L81 is satisfied by measurement rather than annotated);
    from the plate's centre: -46.68, -13.52, +18.70, +51.38 mm, so the row sits about 2.5 mm right
    of centre, the OK/FAIL lamp taking the left end. FRAME: the contract's face is the 168 mm MIC
    window, not the 158 mm plate - which of the two the card is belongs to roc-ops/Portrayal#261 and
    is not settled here - so the plate is taken as centred in the window and the cages sit at window
    position 84 + the measured offset from the plate's centre: centres 37.32, 70.48, 102.70, 135.38
    (y, the vertical form carrying the horizontal x down its length). The figure resolves to 0.11 mm
    a pixel; the hundredths are what the arithmetic gives, not what the drawing holds. ACROSS THE
    FACE the cages stay centred on the 27 mm window. The figure puts the opening centres 18.8 mm
    below the top of a 30.0 mm plate (3.8 mm below its mid-height); that offset is recorded and not
    applied, because how the 27 mm window maps onto the drawn plate is the same #261 question. The
    figure numbers the ports [0/2]0, [0/2]1, [1/3]0, [1/3]1 - two per PIC - and draws a LINK lamp
    right of each cage; neither is changed here (ids and elements are not this change).
  power: >-
    guide FRU power table, MX chassis guides: '| 10-Gigabit Ethernet MIC with XFP | 2-Port:
    MIC-3D-2XGE-XFP 4-Port: MIC-3D-4XGE-XFP | 2-Port:29W 4-Port:37W |'. Read by matching the
    row's own N-Port label rather than by position, because one row carries both cards and
    both figures; the alignment self-checks, 2-port 29 W against 4-port 37 W. NO AMBIENT IS
    STATED for this row - unlike most of the tables around it, which give a 25/40/55 C
    ladder - so none is recorded rather than invented.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the legend print positions follow the measured cages'
states:
- ok
- fail
- absent
parts:
- {ref: std/xfp@1, id: port-0-0, at: [3.75, 32.47], rotate: 90, attrs: {media: xfp}}
- {ref: std/xfp@1, id: port-0-1, at: [3.75, 65.63], rotate: 90, attrs: {media: xfp}}
- {ref: std/xfp@1, id: port-0-2, at: [3.75, 97.85], rotate: 90, attrs: {media: xfp}}
- {ref: std/xfp@1, id: port-0-3, at: [3.75, 130.53], rotate: 90, attrs: {media: xfp}}
size:
  w: 27.0
  h: 168.0
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  w and h are the MIC window in an MPC face, rotated, not the part. Nothing measured the card:
  provenance/size says so in as many words, and #261 found the same model number drawn at two
  different sizes because two chassis have two openings. Juniper's hardware guides for the
  MX240, MX480 and MX960 all state an MPC/DPC/SCB as 17 x 22 x 1.25 in - the MX960's own book
  included, which is the vendor saying it is ONE card in both orientations - but those figures
  are rounded to the quarter inch, and 1.25 in is 31.75 mm against a modelled 30.45 mm slot
  pitch, so they cannot settle a drawing to 0.1 mm. Estimated until a mechanical drawing or a
  ruler on a real card turns up.
