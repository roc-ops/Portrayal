format: 1
kind: module
name: qfx5200-48y-dpsu-ao
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  QFX520048Y-DPSU-AO, the 650 W DC power supply of the QFX5200-48Y, with front-to-back (port-to-FRU)
  airflow. It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares with its twin. The
  QFX5200 hardware guide says the QFX5200-48Y takes it, two to a switch, in the slots at the two ends of the FRU
  panel, and that AC and DC supplies of the same airflow may be mixed in the 48Y. The face is that of the AC
  supply (one bi-coloured lamp, a silver frame with square vents, a black bail handle and a red latch) with a
  three-pin DC power connector in place of the inlet: pin 3 for the return (red), pin 2 for -36 to -72 V (black)
  and pin 1 for grounding (green). The back-to-front sibling is QFX520048Y-DPSU-AI.
attrs:
  model: QFX520048Y-DPSU-AO
  role: dc-power-supply
  inlet: dc-terminal
  power-output-w: 650
  airflow: front-to-back
  input: rated -48 to -60 VDC at 21 A; -36 to -72 VDC at 25 A to 11 A (QFX5200-48Y, guide Table 25)
provenance:
  size: >-
    photo-measured, as qfx5200-48y-apsu-ao@1 - the same frame and latch (54.4 x 39.7 mm) from the QFX5200-48Y rear
    photograph and the guide's flat figure 26. No photograph of the DC supply exists; the guide's figure 42 draws the same
    outline, whose aspect (600 x 468 px) agrees with the frame's 50.4 x 39.7 mm to 1 percent.
  depth: >-
    not stated. The guide's figure 40 is an isometric drawing with no scale and its tables give no depth.
  face: >-
    drawing - the guide's figures 42 and 44 (flat, to scale): the frame, the lamp ring at the top left, the bail, the
    latch, and a three-pin connector housing 10.9 mm wide and 28.4 mm tall with pins 2.5 mm across on a 4.8 mm pitch,
    beside a 2 by 6 field of square vents. THE PHOTOGRAPH IS OF THE AC SUPPLY and the bail and latch positions are
    carried from it. The connector's colours in the figure are the cable's (red RTN, black -36 to -72 V, green grounding),
    not the housing's, and the pins are drawn plain.
  power-output-w: >-
    datasheet - the guide's table of hardware components gives the CLI names DC AFO 650W PSU and DC AFI 650W PSU for the
    48Y; there is no separate output rating. An OUTPUT, since a supply provides power.
  leds: >-
    datasheet - guide Table 27 (DC Power Supply LED on a QFX5200-48Y): one bi-coloured lamp. Off: disconnected or no power in;
    green blinking: standby; green steady: output good; red and green alternating: a warning; red steady: an error; red
    blinking: the supply's internal fan has failed.
  airflow: >-
    datasheet - guide Table 3: QFX520048Y-DPSU-AO is ports-to-FRUs airflow (front-to-back). The guide's Table 19 gives the
    AC supply's panel as red for airflow out; the DC supply's colour is carried from it by the same direction.
  colour: >-
    borrowed - the AC sibling's latch red; estimated.
  connector: >-
    the supply composes juniper/qfx5200-48y-dc-header@1 as `dc-header`, the three-position DC power header of
    the QFX5200 Hardware Guide (Juniper Networks), Figure 42 (flat faceplate) and Figure 85 (the cable connector
    going in), at the box of the `connector` element. The guide names no maker or part number for it, so the
    part is a declared stand-in (its own provenance). juniper/qfx5200-48y-dc-plug@1, the cable connector of
    Figure 85, mates it. The supply's own skin no longer draws the block, its cells or the pin numbers 3, 2 and 1
    printed beside them; the part does, because a part is drawn over the supply's face and would hide them.
  roles: >-
    guide - Figure 42, top to bottom as the supply numbers the cells 3, 2 and 1: pin 3 "Red: RTN" (the library's
    `rtn`), pin 2 "Black: -36 -72V" (`batt`) and pin 1 "Green: Grounding" (`gnd`). Step 5 of the DC connection
    topic wires the red cable to the positive source and the black one to the negative source. Table 25 gives
    a rated range and no nominal.
  no-dc-port: >-
    THE DC INPUT PORT IS NOT STATED HERE, ON PURPOSE. A port whose poles are a connector's contacts is
    offered only where that path's part is itself the connector; on a supply in a bay it is the supply, not
    the connector it composes, so a port stated here would be published and then not offered. The roles above
    are recorded for the port a later change can state, a minor on the devices that seat this supply.
