format: 1
kind: module
name: mic-3d-20ge-sfp-v
version: 1.3.2
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper Gigabit Ethernet MIC with SFP - twenty cages in two PIC groups of ten; the E and EH revisions share the faceplate. Vertical author for the vertical carriers (MX960/MX2000 MPCs stand on end, and their MICs with them).
unplaced: >-
  SUPERSEDED by juniper/mic-3d-20ge-sfp@2: the MX2000 carriers that took this rotated twin are
  retired in favour of the horizontal MPC seated in juniper/mx2000-lc-adapter@1, which takes
  the horizontal MIC (#261, part 2). Kept and deprecated rather than deleted, so a manifest
  that pins it still resolves (#448); nothing in this library seats it.
superseded-by: juniper/mic-3d-20ge-sfp@2
attrs:
  sfp: 20
  model: MIC-3D-20GE-SFP
  model-variants: MIC-3D-20GE-SFP-E, MIC-3D-20GE-SFP-EH
  power-draw-max-w: 37
provenance:
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): on a card
    drawn on its side a pair sits left and right, the left cage 270 beside the right 90,
    so both cage lips face the band between the two cages and both bails face outward.
    Decided by the rule, not an observation, so a photograph of the stack overturns it:
    the 10 SFP pairs (port-0-1/port-0-0 to port-1-9/port-1-8). Turning a composed cage
    in place changes no box, id or anything a device places, so it is a minor bump (S6).
  sfp-rate: >-
    the cage RATE, transcribed from this contract's own description: 'Gigabit Ethernet MIC
    with SFP - twenty cages in two PIC groups of ten'. Without it `cage_type` finds no media
    attr for the sfp family and falls through to PART_IFACE's default, which is SFP+ at 10G
    - a rate this card does not run. Nothing new was measured.
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. The MIC-3D-20GE-SFP-E port-numbering figure g000930 shows the two-column PIC layout this follows'
  power: >-
    guide FRU table - MX240 guide Table 93 'FRU Power Requirements', MIC section:
    '| Gigabit Ethernet MIC with SFP | MIC-3D-20-GE-SFP | 37W |', in nine guides. A maximum for the
    MIC alone, without optics; the row prints no temperature ladder, so there is no ambient to name
    and none is claimed. Note the vendor prints the part number with an extra hyphen in every copy
    of that row - MIC-3D-20-GE-SFP - which is why a whole-token search for the real part number
    misses it. The module reference's '0.77 A @48 V (37 W)' agrees on the value but is stated for
    the -E and -EH extended-temperature variants, not for this part.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
  groups: >-
    Juniper MX Series 5G Universal Routing Platform Interface Module Reference, 'Gigabit Ethernet MIC
    with SFP' (printed pages 267 to 272): '20 Gigabit Ethernet ports' and 'speeds up to 1 Gbps' on each
    port; port numbers 0 to 9 within each PIC, as the interface syntax ge-fpc/pic/port prints them, so
    the group's numbering starts at 0. The role is traffic: the ports carry the MIC's Ethernet traffic.
    The media stays the cage family, sfp, as each port states it.
states:
- ok
- fail
- absent
