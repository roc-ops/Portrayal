format: 1
kind: module
name: scb-mx960-v
version: 1.0.0
class: fabric
behaviour: fills
profile: networking
description: >-
  Juniper SCB-MX Switch Control Board as mounted vertically in the
  MX960. A carrier: the Routing Engine seats into its bay (RE-S-1300 by
  default). OK/FAIL and fabric lamps at the top.
attrs:
  model: SCB-MX
  power-draw-max-w: 185
provenance:
  size: 'photo - the studio front photograph at ~2.07 px/mm: the card cage is ~405 mm tall and fourteen slots share the 441 mm width on a ~30.1 mm pitch; positions approximate to ~2 mm. No vendor card dimension in the extraction'
  power: >-
    guide FRU power table, MX chassis guides: '185 Wat 55 C 160 Wat 40 C 155 Wat 25 C'. The max at 55 C is
    carried, because the worst rated case is what a chassis budget needs.
    Read off the row, with the part number alone in its own cell - the looser
    extraction that preceded this put the MPC7E's number on the MPC6E and took a
    25 C figure for a max, so a row only counts here when nothing else in it
    could be the subject.
    The note this replaces said the module reference does not carry it. True of
    the book it named; the chassis guides do.
  orientation: 'the horizontal sibling juniper/scb-mx@1 carries the
    measured face; same hardware, rotated author (bays cannot rotate)'
states:
- ok
- fail
- absent
bays:
  re:
    at: [1.5, 70.0]
    size: [27.0, 262.0]
    accepts:
    - juniper/re-s-1300-v@1
    default: juniper/re-s-1300-v@1
size:
  w: 30.1
  h: 405.0
