- {ref: common/rj45-eth@1, id: mgmt, group: mgmt, at: [9.19, 118.4], rotate: 90, attrs: {speed: 1g, media: rj45, function: out-of-band management}}
- {ref: std/rj45@2, id: bits, group: timing, at: [9.19, 141.4], rotate: 90, attrs: {media: rj48, function: BITS timing}}
- {ref: std/usb-a@1, id: usb, group: mgmt, at: [14.84, 230.0], attrs: {function: USB service port}}
