name: mpc5e-40g10g-v2k
version: 1.2.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MPC5E-40G10G fixed MPC - 24 SFP+ and six QSFP+ (6x40GE + 24x10GE); the Q variant shares the faceplate. Authored as the MX2000 vertical form, seated through its adapter card (jacks turned on their side - rotate 90, and 270 for the left cage of each belly-to-belly pair).
attrs:
  model: MPC5E-40G10G
  power-draw-max-w: 607
  model-variants: MPC5EQ-40G10G
provenance:
  stack-orientation: >-
    The belly-to-belly cage pairs on this card follow the library's stack convention
    (docs/pluggables-3d-design.md, S1-S4): on a card drawn on its side a pair sits left
    and right, the left cage 270 beside the right 90, so both cage lips face the band
    between the two cages and both bails face outward, where a thumb reaches them. Where
    this provenance records a reading of a stack the orientation is that reading;
    otherwise it is the rule, not an observation. A photograph of the stack that shows
    otherwise overturns it. Turning a composed cage in place changes no box, id or
    anything a device places, so it is a minor bump (S6).
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU power table, MX chassis guides: '| 6x40GE + 24x10GE MPC5E 6x40GE + 24x10GE MPC5EQ | MPC5E-40G10G MPC5EQ-40G10G | With optics: 607 Wat 55° C 541 Wat 40°'. The 55 C rung is
    carried, being the worst rated case a chassis budget has to survive.
    The row says WITH OPTICS, so the transceivers are already in this figure.
    Nothing double counts: the `common/` generic optics L27 exempts carry no
    wattage of their own.
    Taken by matching the row's OWN LABEL: these tables pair parts with figures
    in one row - `4-Port: X 8-Port: Y` against `4-Port: 41 W 8-Port: 52 W` - and
    reading first-wins puts the small card's number on the big one. Aligning on
    the N-Port label instead is self-checking, and it checks out: 4-port 41 W
    against 8-port 52 W, 4-port 24 W against 8-port 29 W.
    Seen in 6 guide(s): mx2008, mx2010-p0001-0300, mx240, mx480.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
