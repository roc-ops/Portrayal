- {ref: std/sfp-ganged@1, id: port-0-4, at: [44.50, 3.60], attrs: {media: sfp-plus}}
- {ref: std/sfp-ganged@1, id: port-0-5, at: [44.50, 15.20], rotate: 180, attrs: {media: sfp-plus}}
