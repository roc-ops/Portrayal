format: 1
kind: module
name: mic3-3d-10xge-sfpp
version: 1.1.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper 10GbE MIC3 with SFP+ (10 ports, one PIC). MIC form (168 x 27 window; the earlier 31 mm reading was the bay opening with bezel - a MIC must seat inside the 29.5 mm MPC face, so the window is 27).
attrs:
  model: MIC3-3D-10XGE-SFPP
  power-draw-max-w: 29
provenance:
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: 'datasheet-table - the module reference model section states the requirement; 29 W max'
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
states:
- ok
- fail
- absent
parts:
- {ref: std/sfp-ganged@1, id: port-0-0, at: [16.00, 3.60], rotate: 180, attrs: {media: sfp-plus}}
- {ref: std/sfp-ganged@1, id: port-0-1, at: [16.00, 15.20], attrs: {media: sfp-plus}}
- {ref: std/sfp-ganged@1, id: port-0-2, at: [30.25, 3.60], rotate: 180, attrs: {media: sfp-plus}}
- {ref: std/sfp-ganged@1, id: port-0-3, at: [30.25, 15.20], attrs: {media: sfp-plus}}
- {ref: std/sfp-ganged@1, id: port-0-4, at: [44.50, 3.60], rotate: 180, attrs: {media: sfp-plus}}
- {ref: std/sfp-ganged@1, id: port-0-5, at: [44.50, 15.20], attrs: {media: sfp-plus}}
- {ref: std/sfp-ganged@1, id: port-0-6, at: [58.75, 3.60], rotate: 180, attrs: {media: sfp-plus}}
- {ref: std/sfp-ganged@1, id: port-0-7, at: [58.75, 15.20], attrs: {media: sfp-plus}}
- {ref: std/sfp-ganged@1, id: port-0-8, at: [73.00, 3.60], rotate: 180, attrs: {media: sfp-plus}}
- {ref: std/sfp-ganged@1, id: port-0-9, at: [73.00, 15.20], attrs: {media: sfp-plus}}
size:
  w: 168.0
  h: 27.0
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  w and h are the MIC window in an MPC face, not the part. Nothing measured the card:
  provenance/size says so in as many words, and #261 found the same model number drawn at two
  different sizes because two chassis have two openings. Juniper's hardware guides for the
  MX240, MX480 and MX960 all state an MPC/DPC/SCB as 17 x 22 x 1.25 in - the MX960's own book
  included, which is the vendor saying it is ONE card in both orientations - but those figures
  are rounded to the quarter inch, and 1.25 in is 31.75 mm against a modelled 30.45 mm slot
  pitch, so they cannot settle a drawing to 0.1 mm. Estimated until a mechanical drawing or a
  ruler on a real card turns up.
