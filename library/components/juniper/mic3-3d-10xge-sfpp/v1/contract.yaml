format: 1
kind: module
name: mic3-3d-10xge-sfpp
version: 1.2.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper 10GbE MIC3 with SFP+ (10 ports, one PIC). MIC form (168 x 27 window; the earlier 31 mm reading was the bay opening with bezel - a MIC must seat inside the 29.5 mm MPC face, so the window is 27).
attrs:
  model: MIC3-3D-10XGE-SFPP
  power-draw-max-w: 29.8
provenance:
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is
    the upper cage upright (rotate 0) over the lower turned 180, so both cage lips face
    the band between the two cages and both bails face outward. Decided by the rule, not
    an observation, so a photograph of the stack overturns it: the 5 SFP pairs
    (port-0-0/port-0-1 to port-0-8/port-0-9). 5 of these were drawn with the upper cage
    turned before the std cage art moved its lip to the bottom of the opening; turning
    them keeps the lips in the middle band where they were drawn and seats every optic
    bail-outward. Turning a composed cage in place changes no box, id or anything a
    device places, so it is a minor bump (S6).
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    module reference model section - 'Ten 10-Gigabit Ethernet ports - Power requirement:
    0.62 A @ 48 V (29.8 W) ... Model number: MIC3-3D-10XGE-SFPP' (mx-module-reference-p0301-0600).
    An electrical figure, amps times volts, at no stated ambient; this MIC has no row in any chassis
    guide's Table 93, so there is no ladder to take a rung from and none is claimed.
    CORRECTED FROM 29 W. The vendor prints 29.8 and this contract had rounded it DOWN, which is the
    wrong direction for a maximum. Do not read Table 93's '| 10-Gigabit Ethernet MICs with XFP | 2-Port: MIC-3D-2XGE-XFP 4-Port: MIC-3D-4XGE-XFP | 2-Port:29W 4-Port:37W |'
    as this part: the 29 W there belongs to the two-port XFP MIC.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
states:
- ok
- fail
- absent
