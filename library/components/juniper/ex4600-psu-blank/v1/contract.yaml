format: 1
kind: module
name: ex4600-psu-blank
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  The blank cover panel for an empty power supply slot of the EX4600 switch. The EX4600 hardware
  guide says to fit a blank cover panel over the second power supply when only one supply is
  installed. It also says to replace a failed supply with a panel or a new supply within one minute. The
  panel is a dark grey plate with two D-shaped finger recesses that face each other. The guide
  gives no part number for it.
attrs:
  weight-note: not published
provenance:
  sources: >-
    datasheet - EX4600 Switch Hardware Guide (published 2025-08-12): Connecting AC Power to an EX4600
    Switch and Removing a Power Supply from an EX4600 Switch ("ensure that a blank cover panel is
    installed over the second power supply"). The guide draws no panel and gives no part number, size
    or weight. The datasheet's ordering table lists no panel for the supplies.
  size: >-
    estimated - the panel is drawn at the size of the power supply it replaces, 54.7 x 40.5 mm,
    because it fills the same bay. In Juniper's EX4600 rear studio photograph (ex4600-rear-high.jpg)
    the panel in slot 1 measures about 57.3 mm across and 42.7 mm high, wider than the slot opening by
    the frame it overlaps; the bay is not drawn wider than the supply.
  face: >-
    photo-measured - the same photograph, read at 19.8 px/mm: a plain dark grey plate with two
    D-shaped recesses, the left one curved on its right side and the right one curved on its left,
    each with a darker well inside and a black latch notch on its flat side. The latch notches are
    not drawn.
  depth: >-
    estimated - not stated. Searched the EX4600 guide for the panel's dimensions: nothing is given.
    No depth is written.
states: [absent]
elements:
  recess-left:
    at: [1.6, 6.0]
    size: [19.0, 28.4]
    class: pocket
  recess-right:
    at: [34.1, 6.0]
    size: [19.0, 28.4]
    class: pocket
size:
  w: 54.7
  h: 40.5
size-confidence: {w: estimated, h: estimated}
skins: [default]
