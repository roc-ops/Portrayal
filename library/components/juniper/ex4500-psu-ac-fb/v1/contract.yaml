format: 1
kind: module
name: ex4500-psu-ac-fb
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The AC power supply of the Juniper EX4500 switches with front-to-back airflow. It gives 1000 W at a
  low line voltage (100 to 120 VAC) and 1200 W at a high line voltage (200 to 240 VAC). It is a
  field-replaceable unit, hot-removable and hot-insertable. The face has a C19 appliance inlet, a
  fan, a diagonal handle, a bicolour status lamp and a green ejector lever. The lever colour shows
  the airflow. It must match the label visible through the fan tray. The guide gives no part number
  for it.
attrs:
  role: ac-power-supply
  power-output-w: 1200
  airflow: front-to-back
  input: 100 to 120 VAC or 200 to 240 VAC, 50 to 60 Hz; 12 A and 6 A (guide Table 40)
provenance:
  sources: >-
    datasheet - EX4500 Switch Hardware Guide (modified 2017-10-18): AC Power Supply in EX4500 Switches
    (Figures 21 to 23: the supply, its cord retainer and its lamp), Table 40 (the AC figures) and Table
    3 (which models ship it). The guide's own copyright and the Juniper EULA govern it; it is read for
    facts only and nothing of it is copied. The guide prints no Juniper part number for the supply. The
    CLI calls it "PS 1000W /1200W AC Front-to-back airflow" (Table 4).
  size: >-
    drawing - Figure 6, the flat rear panel, rendered at 1200 dpi. The chassis face measures 438.2 mm
    wide against Table 5's 17.25 in and the supply bays are read at 0.227 mm per display pixel across
    and 0.234 down, an aspect error of 3 percent. The two supplies are stacked: each is about 79 mm
    wide and 40 mm high, and the fan tray starts 3 mm inside the right edge, so 76.0 x 39.8 mm is
    written. It is estimated to 1 mm.
  depth: >-
    estimated - not stated. Searched the guide for the supply's dimensions: the table gives its weight,
    3 lb (1.3 kg), and no size. No depth is written.
  face: >-
    drawing - Figure 6, read as fractions of one supply: the C19 inlet at the left, a round fan grille
    with a diagonal handle at the right, four corner screws and a status lamp between them. Positions
    are estimated.
  lever: >-
    datasheet - AC Power Supply in EX4500 Switches: "Green - Front-to-back airflow; Orange -
    Back-to-front airflow". The lever colour is the field handle-finish. The figure is a line drawing in
    grey.
  airflow: >-
    datasheet - Table 3 and Table 15: the supply of EX4500-40F-FB, -FB-C and -VC1-FB is the front-to-back
    one. Its lever is green and matches the EXHAUST label of the fan tray.
  power: >-
    datasheet - Table 40: output 1000 W at the low line and 1200 W at the high line. The higher figure is
    carried as the output; the guide's own statement of the pair is in the description. The fans' own
    power draw is not given (the table row is empty).
  led: >-
    datasheet - Table 16: one bicolour lamp on the faceplate. Unlit: no input. Green: working, blinking
    green or amber means the supply has failed.
states:
- ok
- fault
- absent
parts:
- {ref: std/c20-inlet@1, id: inlet, at: [0.5, 8.0], rotate: 270}
elements:
  led-status:
    at: [32.4, 32.7]
    size: [2.4, 2.4]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  lever:
    at: [0.4, 12.0]
    size: [3.6, 16.0]
    class: latch
fields:
  handle-finish: {label: Ejector lever colour, type: text, default: '#3fa34d'}
size:
  w: 76.0
  h: 39.8
size-confidence: {w: estimated, h: estimated}
relief:
  features:
  - node: lever
    out: 1.2
    confidence: estimated
    source: figure - the lever stands proud of the face; its projection is not measured
skins: [default]
