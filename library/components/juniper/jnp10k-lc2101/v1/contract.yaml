format: 1
kind: module
name: jnp10k-lc2101
version: 1.3.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper JNP10K-LC2101 line card - 2.4 Tbps, 24 QSFP28 cages in six 2x2
  blocks (ports n/0 over n/1), with the 96-lamp per-channel status matrix
  at the right, for the MX10008/MX10016.
attrs:
  model: JNP10K-LC2101
  power-draw-typical-w: 1335
  power-draw-max-w: 1425
  qsfp28: 24
provenance:
  qsfp28-rate: >-
    MX10008 hardware guide, 'MX10K-LC2101' (p137) and the line-card overview (p18): the card 'can support 24
    100-Gigabit Ethernet ports with a 28-Gbps quad smallform-factor pluggable (QSFP28) transceiver' (or 24
    40-Gigabit Ethernet ports with a QSFP transceiver), and 'All the ports are Multi-Rate ports. Each port
    is capable of supporting either 100 Gbps or 40 Gbps or 10 G' (4x10-Gbps with a breakout cable). Counted
    at the rate every port can run, 100G. Nothing new was measured.
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is
    the upper cage upright (rotate 0) over the lower turned 180, so both cage lips face
    the band between the two cages and both bails face outward. Decided by the rule, not
    an observation, so a photograph of the stack overturns it: the 12 QSFP pairs
    (port-0/port-1 to port-22/port-23). 12 of these were drawn with the upper cage
    turned before the std cage art moved its lip to the bottom of the opening; turning
    them keeps the lips in the middle band where they were drawn and seats every optic
    bail-outward. Turning a composed cage in place changes no box, id or anything a
    device places, so it is a minor bump (S6).
  size: 'datasheet-table - the family FRU table: 1.89 x 17.2 x 19.05 in;
    face drawn 437 x 48 mm'
  power: 'datasheet-table - guide power table: 1335 W at 25 C, 1425 W at
    40 C'
  face: 'photo - six 2x2 QSFP28 blocks on a ~39.4 mm block pitch read off
    the MX10008 front photograph at ~2.99 px/mm, approximate to ~2 mm;
    the lamp matrix is drawn as its 12x8 grid without per-lamp ids'
  groups: >-
    Juniper Networks MX10008 Universal Routing Platform Hardware Guide, 'MX10K-LC2101' (printed
    pages 19, 137 and 138): 'All the ports are Multi-Rate ports'; each port is capable of
    supporting 'either 100 Gbps or 40 Gbps or 10 G' (the 10 Gbps by breakout cable, which is a
    logical interface and is not written). The elevation prints no port number legibly, so the
    ids number the drawn cages. The role is traffic: the page names no role for the ports, and
    the role follows the job, a network interface a transceiver is plugged into.
states:
- ok
- fail
- absent
groups:
  qsfp28-100g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g, speeds: [40g, 100g]}
    description: >-
      the twenty-four QSFP28 ports, each at 40 or 100 Gbps
