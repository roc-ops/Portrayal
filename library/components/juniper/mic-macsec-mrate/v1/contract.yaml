format: 1
kind: module
name: mic-macsec-mrate
version: 1.2.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MACsec multirate QSFP28 MIC for the MX2000 MPC8E/MPC9E; only the vertical author exists.
attrs:
  model: MIC-MACSEC-MRATE
  power-draw-max-w: 110
provenance:
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): on a card
    drawn on its side a pair sits left and right, the left cage 270 beside the right 90,
    so both cage lips face the band between the two cages and both bails face outward.
    Decided by the rule, not an observation, so a photograph of the stack overturns it:
    the 6 QSFP pairs (port-0-1/port-0-0 to port-1-5/port-1-4). Turning a composed cage
    in place changes no box, id or anything a device places, so it is a minor bump (S6).
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    module reference - 'MIC-MACSEC-MRATE: 110 W at 45 C, 105 W at 25 C'
    (mx-module-reference-p0301-0600). THE 45 C RUNG IS CARRIED, for the MIC alone without optics.
    This ladder has two rungs and stops at 45 C rather than the 55 C the MPC and DPC tables use, so
    110 W is this part's worst PUBLISHED figure and not a 55 C figure; reading the 25 C end would
    have been 5 percent low. The part has no row in any chassis guide's Table 93.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
