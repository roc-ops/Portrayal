format: 1
kind: component
name: ex2200-rps-port
version: 1.1.0
class: inlet
interface: ex3300-rps
behaviour: mounts
profile: networking
description: >-
  Redundant power system (RPS) port on the rear panel of the Juniper EX2200 switches (all but the
  EX2200-C): a long connector opening on a screwed plate, beside the console port. The Juniper EX
  Series Redundant Power System guide gives each EX2200 and EX3300 a built-in RPS connector and one
  RPS cable. So this port presents the same key as the EX3300's. No guide names the connector type.
size: {w: 67.9, h: 14.6, d: 20.0}
size-confidence: {w: estimated, h: estimated, d: estimated}
attrs: {media: rps}
provenance:
  existence: >-
    datasheet - EX2200 and EX2200-C Switches Hardware Guide (published 2022-02-02), Rear Panel of an
    EX2200 Switch: "Redundant power system (RPS) port" in the list of rear panel components, and the
    "RPS port" label of Figure 5 (page 24).
  size: >-
    estimated - the plate and its opening are read off the flat rear elevation of Figure 5, 6.124 px per
    mm along its 445 mm width: a 67.9 by 14.6 plate with a 44.5 by 8.9 opening. This is the plate and
    opening these devices drew as panel art before the port became a part, with the same figures. The
    guide gives no dimension for the port; the figure's aspect is off by 2.2 percent, so the figures
    are good to about a millimetre.
  depth: >-
    estimated. The drawing is a front view; 20.0 is what the relief builds, not a figure from any source
  screws: >-
    the four screws of the plate are not in this part: the devices place them as their own parts
    (`rps-screw-0` to `rps-screw-3`), as they did when the plate was panel art.
  interface: >-
    A READING FROM ONE CABLE, NOT A STATEMENT OF THE CONNECTOR'S NAME - registry `ex3300-rps`. EX Series
    Redundant Power System Hardware Guide (Juniper Networks, PDF dated 2020-12-17): "Each EX2200 switch
    and EX3300 switch has a built-in connector for the RPS" (page 52, step 1). Figure
    16 (page 51) draws the one RPS cable, with the same shell at both ends, and Figure 17 (page 52) seats
    it in the RPS port of an EX2200-24-4G rear panel. The guide names no connector type, contact count
    or cable part number, and the EX2200 Switch Hardware Guide (published 2022-02-02) names none either.
    So the key is taken from the one cable the guide pairs with both switches, and this is not
    juniper/ex3300-rps-port@1, which is drawn from another elevation. The cable end that mates it is
    juniper/ex3300-rps-plug@1, drawn estimated.
  mate: >-
    derived - the centre of the connector opening, (33.95, 7.35), on the panel face. The guide gives no
    seating depth, so the mate stands at the face.
elements:
  opening: {at: [11.7, 2.9], size: [44.5, 8.9], class: slot}
connection-points:
  mate: {at: [33.95, 7.35], direction: front}
skins: [default]
