version: 1.2.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MPC4E-3D-32XGE-SFPP fixed MPC - 32 SFP+ in four PIC groups of eight. Authored as the MX960 vertical form (jacks turned on their side - rotate 90, and 270 for the left cage of each belly-to-belly pair).
attrs:
  model: MPC4E-3D-32XGE-SFPP
  power-draw-max-w: 610
provenance:
  stack-orientation: >-
    The belly-to-belly cage pairs on this card follow the library's stack convention
    (docs/pluggables-3d-design.md, S1-S4): on a card drawn on its side a pair sits left
    and right, the left cage 270 beside the right 90, so both cage lips face the band
    between the two cages and both bails face outward, where a thumb reaches them. Where
    this provenance records a reading of a stack the orientation is that reading;
    otherwise it is the rule, not an observation. A photograph of the stack that shows
    otherwise overturns it. Turning a composed cage in place changes no box, id or
    anything a device places, so it is a minor bump (S6).
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU table - MX240 guide Table 93 'FRU Power Requirements', fixed-configuration MPC section:
    32x10GE MPC4E, MPC4E-3D-32XGE-SFPP = 610W; with optics, 607 W at 131 F (55 C), with SFPP ZR optics 584 W at 40 C, 565 W at 77 F (25 C).
    THE BARE FIGURE IS CARRIED - the card alone, without optics - and it is unqualified by ambient,
    because no guide ladders the bare figure.
    The corpus disagrees about the WITH-OPTICS ladder and agrees about the bare one: mx240, mx480 and
    mx960 print 607/584/565 W at 55/40/25 C; mx2020-p0001 prints 607/590/585; mx2010-p0301 and
    mx2020-p0301 print 610/560/550; mx2008 and mx2010-p0001 give a with-MICs-and-optics reading under
    the part number MX-MPC4E-3D-32XGE-SFPP, which is this card spelled with an MX- prefix. All of
    them state 610 W bare, which is why that is the figure carried and why no rung is named.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
