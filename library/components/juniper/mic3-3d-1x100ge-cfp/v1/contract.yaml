format: 1
kind: module
name: mic3-3d-1x100ge-cfp
version: 1.2.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper 100GbE MIC3 with CFP (one port). MIC form (168 x 27 window; the earlier 31 mm reading was the bay opening with bezel - a MIC must seat inside the 29.5 mm MPC face, so the window is 27).
unplaced: >-
  SUPERSEDED by juniper/mic3-3d-1x100ge-cfp@2, the MIC plate re-measured at 168.8 x 29.2 and
  the carriers re-laid to match (#261, part 2). This major is kept and deprecated rather than
  deleted, so a manifest that pins it still resolves (#448); nothing in this library seats it.
superseded-by: juniper/mic3-3d-1x100ge-cfp@2
attrs:
  model: MIC3-3D-1X100GE-CFP
  power-draw-max-w: 40
provenance:
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU table - MX240 guide Table 93 'FRU Power Requirements', MIC section:
    '| 100-Gigabit Ethernet MIC with CFP | MIC3-3D-1X100GE-CFP | 40W |', in nine guides. A maximum
    for the MIC alone, without optics; the row prints no temperature ladder, so there is no ambient
    to name and none is claimed. The module reference agrees by a second route - '0.83 A @48 V
    (40 W)'. Distinct from MIC3-100G-DWDM, whose row in the same table is with-optics only and
    laddered - 'With optics: 91 W at 55 C, 83 W at 25 C' - a different scope, not a better figure.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
  groups: >-
    Juniper MX Series 5G Universal Routing Platform Interface Module Reference, '100-Gigabit
    Ethernet MIC with CFP' (printed page 304): 'One 100-Gigabit Ethernet port' and 'speeds up to 100
    Gbps' on the port; the port is labeled 'PORT0'. The role is traffic.
states:
- ok
- fail
- absent
groups:
  cfp-100g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: cfp, speed: 100g}
    description: the 100-Gigabit Ethernet CFP cage, running at up to 100 Gbps
parts:
- {ref: std/cfp@2, id: port-0-0, group: cfp-100g, at: [15.60, 6.10], attrs: {media: cfp}}
size:
  w: 168.0
  h: 27.0
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  w and h are the MIC window in an MPC face, not the part. Nothing measured the card:
  provenance/size says so in as many words, and #261 found the same model number drawn at two
  different sizes because two chassis have two openings. Juniper's hardware guides for the
  MX240, MX480 and MX960 all state an MPC/DPC/SCB as 17 x 22 x 1.25 in - the MX960's own book
  included, which is the vendor saying it is ONE card in both orientations - but those figures
  are rounded to the quarter inch, and 1.25 in is 31.75 mm against a modelled 30.45 mm slot
  pitch, so they cannot settle a drawing to 0.1 mm. Estimated until a mechanical drawing or a
  ruler on a real card turns up.
