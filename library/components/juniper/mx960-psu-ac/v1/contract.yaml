format: 1
kind: module
name: mx960-psu-ac
version: 1.0.1
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper MX960 AC power supply - four tall units fill the rear card
  cage below the inlet strip (the C20 inlets and their switches sit on
  the chassis, one above each supply). Nameplate labels mid-body, PS
  FAIL / DC OK / AC OK lamps and the exhaust fan at the bottom.
attrs:
  inlet: none
  model: MX960 AC PSU
  power-output-w: 1700
  role: ac-power-supply
  redundancy: 2+2
provenance:
  inlet: >-
    THIS SUPPLY HAS NO INLET AND THAT IS THE CLAIM. Its own description says 'the C20 inlets
    and their switches sit on the chassis, one above each supply', and the MX960 places four
    std/c20-inlet in an `inlets` group whose note records that the inlet stays with the
    chassis while a PEM comes out. `none` keeps the DCIM export from counting the chassis's
    four a second time here - see roc-ops/Portrayal#286.
  power: >-
    MX960 hardware guide, Table 91 'AC Power Supply Electrical Specifications', Normal-Capacity
    block: 'Maximum output power | 1700W', at 200-240 VAC operating range with no separate
    low-line rating stated. THIS CONTRACT'S MODEL SAYS ONLY 'MX960 AC PSU' and the guide
    describes four AC supplies for this chassis - normal-capacity, high-capacity, high-capacity
    second-generation and high-voltage second-generation. The figure carried is the
    NORMAL-CAPACITY one; the high-capacity supply in the same table is 4100 W and is a
    different part that is not modelled here.
  size: 'photo - the rear studio photograph at ~1.55 px/mm: four supplies
    share the 441 mm width (~103 mm each) over a ~480 mm bay; approximate.
    No vendor PSU dimension in the extraction'
  power-output: 'NOT STATED per module in the extraction - L27 stands'
  face: 'photo - UP arrow chip, pull handle, nameplates, bottom lamp
    triple and fan'
states:
- ok
- fault
- absent
size:
  w: 103.0
  h: 480.0
