name: qfx5700-fpc-blnk
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Juniper JNP5K-FPC-BLNK, the blank panel for an empty FPC (line card) slot of the QFX5700: a vented plate the size of
  a line card, with a latch at the top and bottom of its left edge and a captive screw at the right of each. The base
  configuration ships nine of them, one for each of the nine slots, and the guide requires a blank over any slot
  that holds no card.
part-numbers:
  JNP5K-FPC-BLNK: {part: JNP5K-FPC-BLNK}
provenance:
  part-number: >-
    datasheet - the QFX5700 datasheet (1000719-009, September 2024), additional SKUs: JNP5K-FPC-BLNK, a blank cover for an
    empty FPC slot; the hardware guide's Table 27 lists nine in the base configuration, and its unpacking tools list
    "blank panels to cover any slots not occupied by a component".
  size: >-
    drawing and datasheet - the width is the line card's 4.43 cm (1.74 in, Tables 15 to 17) and the height is read off
    the flat chassis figure (figure 16, g101401) at 2.99 px/mm: the slot opening is 503 px, 168.2 mm. Tables 15 to 17 give
    the card 17 cm, which is 1.8 mm more than the opening and is carried only here. The depth of the card, 20 cm, is not
    a face figure and is not written.
  face: >-
    drawing - figure 16's slot 8 (the unsupported slot) is drawn with this blank over it: a latch at the top left and at
    the bottom left, a round screw at the top right and the bottom right, and an oval field of round vents between
    them. The positions are read off that figure to about 0.7 mm and are estimated. The photograph (figure 8) shows the
    same blank in slot 8 as a plain silver plate with a field of round vents; no legend is printed on it.
states: [absent]
