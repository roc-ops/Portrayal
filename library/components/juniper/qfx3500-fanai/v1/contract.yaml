format: 1
kind: module
name: qfx3500-fanai
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  QFX3500-FANAI, a field-replaceable fan tray with FRU-to-port airflow. Cold air comes in at the FRU
  end of the switch and hot air leaves at the port end. The tray holds two fan modules and has a
  single lamp, green when the tray is healthy and blinking amber on an error. It is hot-removable
  and hot-insertable, and one fan module cannot be replaced alone. The QFX3500 hardware guide gives
  it to the QFX3500-48S4Q-AFI and the QFX3500-48S4Q-ACR. The chassis seats two, in slots 0 and 1 on
  either side of the management board. The front-to-back and back-to-front trays are never mixed in
  one chassis. The front-to-back sibling is QFX3500-FAN-AFO. The guide prints this part number as
  QFX3500-FANAI, without the hyphen its sibling has.
attrs:
  model: QFX3500-FANAI
  airflow: back-to-front
  power-absent: not-published
provenance:
  size: >-
    drawing - the same tray as juniper/qfx3500-fan-afo@1 with the airflow turned, so the size is the
    same: QFX3500 Device Hardware Documentation (modified 2018-07-03), figure 5 (page 27, drawing
    g050012), scaled to the table's 17.4 x 1.74 in at 1.427 mm/pt across and 1.396 down, 87.3 x 40.6 mm.
    The guide does not say the two trays differ in outline, and its figure 13 draws one tray.
  depth: >-
    estimated - not stated. The guide's figure 13 is an isometric drawing with no scale and no table
    gives a depth, so none is written.
  face: >-
    drawing - figure 5 and figure 13 draw one tray and do not say which airflow it is. The art is the
    same as the front-to-back tray's. The guide's Table 13 lists the two trays under two part numbers
    and states no difference in appearance, so none is drawn.
  colour: >-
    estimated - the guide prints no colour for the fan tray (it gives gold and blue handles to the power
    supplies only). A neutral grey is drawn. No photograph of this tray is held.
  airflow: >-
    datasheet - guide, Table 13 (page 40): QFX3500-FANAI is FRU-to-port. In the guide's words AFI is
    airflow in, which is FRU-to-port.
  power: >-
    not published. Searched the QFX3500 hardware guide near its fan sections, Table 5 (weights) and the
    power tables 25 and 27: only whole-switch figures exist. The module declares power-absent so the
    missing figure is a statement and not a silence.
states: [absent]
elements:
  led-fan:
    at: [4.2, 26.5]
    size: [2.0, 2.0]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  handle:
    at: [2.0, 33.0]
    size: [34.0, 4.5]
    class: latch
size:
  w: 87.3
  h: 40.6
size-confidence: {w: drawing, h: drawing}
skins: [default]
