format: 1
kind: component
name: mx204-ground-plate
version: 1.0.0
class: ground
behaviour: mounts
profile: networking
description: >-
  Protective-earthing landing on the MX204 rear left panel - a bright recessed
  metal plate with two threaded lug holes on a 16 mm pitch, sized for 10-32
  screws, under the panel's earth symbol. The guide requires this terminal
  permanently connected to earth in addition to the power-cord ground pin.
attrs:
  model: MX204 grounding terminal
provenance:
  holes: 'drawing - the two lug circles measure at x 38.6 and 54.6 mm on the
    600 dpi g009862 render, a 16.0 mm pitch, outer ring ~9.5 mm. The 10-32
    screw size is the guide''s own sentence ("sized for 10-32 screws")'
  plate: 'estimated - the bright plate outline is read off mx204-rear-high.jpg
    (recessed rectangle around both holes); its 36 x 15 mm extent was NOT
    measured against anything of known size and is approximate'
size:
  w: 36.0
  h: 15.0
