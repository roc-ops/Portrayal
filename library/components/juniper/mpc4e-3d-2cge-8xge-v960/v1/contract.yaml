description: >-
  Juniper MPC4E-3D-2CGE-8XGE fixed MPC - two 100GbE CFP ports and eight SFP+ in interleaved PICs. Authored as the MX960 vertical form (jacks rotated 90).
attrs:
  model: MPC4E-3D-2CGE-8XGE
  power-draw-max-w: 610
provenance:
  pitch-note: >-
    L81 flags this composing 2 x std/cfp@1 133.3mm apart against cfp's
    registry pitch of 86mm. standards.yaml's cfp entry documents its 86.0mm
    pitch as "a layout floor read from vendor faceplates, not an MSA figure" -
    a minimum, not a fixed spacing. This device sits 133.3mm, wider than the
    floor rather than off it, so the gap here is a deliberate layout choice,
    not drift.
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: 'datasheet-table - the module reference model section states the requirement; 610 W max'
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
