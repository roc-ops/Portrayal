format: 1
kind: module
name: ex9214-craft
version: 1.0.0
class: display
behaviour: fills
profile: networking
description: >-
  Craft interface (front panel display, FPM board) of the Juniper EX9214 switch. It spans the chassis above the upper
  fan tray. It has the OK and FAIL lamps of PEM 0 to PEM 3 and of the upper and lower fan trays. It has the MASTER, ONLINE
  and OFFLINE lamps for RE0 and RE1. It has a minor (yellow) and a major (red) alarm lamp and the alarm cutoff and lamp test
  button (ACO/LT). It has the MINOR ALARM and MAJOR ALARM relay contacts (NC, C, NO). Each of the fourteen slots has an OK
  lamp, a FAIL lamp and an ONLINE control button. The slots are line cards 0 to 5, Switch Fabric slots 0 and 1, the shared
  slot 2|6 and line cards 7 to 11. The EX9214 model name is printed on it.
attrs:
  model: EX9214 Craft Interface
  power-absent: not-published
provenance:
  sources: >-
    EX9214 Switch Hardware Guide (published 2025-07-28), "Craft Interface in an EX9200 Switch": Figure 12 (the craft interface of
    the EX9214, drawn flat, with ten callouts), the alarm relay contacts figure, Tables 9 to 14 (the lamps), and the EX9214 studio front
    photograph (about 1.38 px/mm), which shows the panel with its lamps unlit.
  lamp-states: >-
    The vocabularies are the guide's: Table 9 (host subsystem: MASTER green, ONLINE green, OFFLINE red), Table 10 (fan: OK green, FAIL
    red), Table 11 (power supply: OK green, FAIL red), Table 12 (Switch Fabric module: OK green or blinking, FAIL red), Table 13 (line card:
    OK green or blinking, FAIL red), Table 14 (alarm: major red, minor yellow). Each lamp fills from the LED variable, with its drawn colour
    as the unlit fallback.
  power: >-
    NOT PUBLISHED. The guide's FRU power table lists the Routing Engine, the Switch Fabric modules and the line cards and does not list the
    craft interface; the EX9200 datasheet (Aug 2022) Table 3 lists none either.
  size: >-
    estimated - the panel spans 423.4 x 52.3 mm on the EX9214 front photograph, read on a millimetre grid from 8.0 to 431.4 mm across the body
    and from 6.2 to 58.5 mm down. The photograph resolves about 0.7 mm to the pixel. The guide gives no dimension for it. The MX960's craft panel is
    441 x 48 mm (juniper/mx960-craft); the EX9214 panel is a different part.
  features: >-
    photo-measured - every lamp, button, tab and relay block is placed from the EX9214 studio front photograph, read on a millimetre grid, from the
    panel's own origin at 8.0 mm across and 6.2 mm down. The PEM lamp columns read at 128.6, 135.1, 141.5 and 148.0 mm across the body, the fan
    lamps at 175.6 and 182.0, the RE lamp columns at 203.4 and 234.0, the minor alarm triangle at 264.6, the major circle at 283.6, the ACO/LT
    button at 305.9 and the relay blocks 331.0 to 356.8 and 358.0 to 383.3. The fourteen slot tabs read 30.72 mm apart from 19.5 mm. The
    photograph's two scales differ by about 3 percent, so a reading is estimated to about 1.5 mm.
  slot-tabs: >-
    photo and guide Figure 12 - fourteen oval tabs under the slot lamp pairs, each with the word ONLINE under it: line cards 0 to 5, the two Switch
    Fabric slots 0 and 1 (blue), the shared slot 2|6 (half blue), and line cards 7 to 11. Callouts 8, 9 and 10 of the figure name the groups.
  logo-zone: >-
    estimated - reserved, not drawn. The maker's wordmark sits at the left, about 30 x 11 mm, and the "running junos" badge at the right, about 27 x
    11.5 mm. The library reproduces no vendor logo.
