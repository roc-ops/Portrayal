    - juniper/mic-3d-20ge-sfp@1
    - juniper/mic-macsec-20ge@1
    - juniper/mic-3d-2xge-xfp@1
    - juniper/mic-3d-1oc192-xfp@1
    - juniper/mic-3d-4oc3oc12-1oc48@1
    - juniper/mic-3d-8oc3oc12-4oc48@1
    - juniper/mic-3d-8ds3-e3@1
