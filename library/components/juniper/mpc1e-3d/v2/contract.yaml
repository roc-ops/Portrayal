format: 1
kind: module
name: mpc1e-3d
version: 2.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MPC1E carrier (MX-MPC1E-3D) - two MIC slots. The base SKU and MX-MPC1-3D, which share its wattage
  and its MIC column; the queuing SKUs share the faceplate but not those, and are not this contract. One
  card for the MX240, MX480 and MX960, drawn horizontal; the MX960 seats it turned 90.
attrs:
  model: MX-MPC1E-3D
  model-variants: MX-MPC1-3D
  power-draw-max-w: 165
provenance:
  size: >-
    estimated from the family - not photographed. The plate is 396.0 x 29.5 centred in a 413.5 lever envelope,
    the figures measured off the three photographed cards of this form factor (DPC 40xGE, DPC-R-4XGE,
    SCB-MX: plate x px 127.5-1463.5 = 396.2 mm on the MX240 front at 3.372 px/mm). RE-ENVELOPED, NOT REDRAWN,
    at 2.0.0: every part, bay, lamp and legend at 1.x card x >= 26.15 moved by x' = 8.75 + (x - 26.15)
    * 396.0 / 394.85, the old plate run 26.15-421.0 onto the new 8.75-404.75; y is unchanged. Only the
    levers, the model name and the status group were placed afresh (provenance below). Positions along
    the plate stay layout-derived, as 1.x had them.
  power: >-
    guide FRU table - MX240 Hardware Guide Table 93 'FRU Power Requirements' (p. 219), modular MPC section:
    '| MPC1 MPC1E | MX-MPC1-3D MX-MPC1E-3D | 165W With MICs and optics: 239 W at 55 C, 227 at 40, 219
    at 25 |'.
    165 W is the leading, card-alone figure of the base SKU's own row, and attrs.model names that
    SKU. Bare means the carrier alone: the ladder is with MICs and optics, a different scope, and the
    MICs seated here are separately modelled parts that answer for themselves. Until roc-ops/Portrayal#417
    this contract carried 175 W, the queuing row ('| MPC1Q MPC1EQ | MX-MPC1-3D-Q MX-MPC1E-3D-Q | 175W
    ... |'), because its description claimed the queuing SKUs too. They are not this contract: they
    differ in wattage and in the MICs they take (Table 10), and will be their own parts.
    model-variants keeps MX-MPC1-3D only, the one SKU that shares both this row and this column.
  accepts: >-
    MX Series Interface Module Reference, 'MIC/MPC Compatibility', Table 10 'MIC/MPC1 Compatibility' (PDF
    pp. 55-58): the
    accepts lists are exactly the MPC1E column, restricted to the MICs this library models.
    REMOVED by roc-ops/Portrayal#417, each an en dash in the MPC1E column:
    mic-3d-4xge-xfp (row MIC-3D-4XGE-XFP, a dash in every MPC1 column);
    mic-3d-8oc3-2oc12-atm (row MIC-3D-8OC3-2OC12-ATM; 12.1 and 12.1R4 under MPC1Q and MPC1EQ only);
    mic-3d-4choc3-1oc12 (row MIC-3D-4COC3-1COC12-CE; 12.2 under the queuing SKUs only);
    mic-3d-4choc3-2choc12 and mic-3d-8choc3-4choc12 (row MIC-3D-4CHOC3-2CHOC12, MIC-3D-8CHOC3-4CHOC12;
    11.4 under the queuing SKUs only); and mic-3d-10ge-sfp-e, which has NO ROW in Table 10 at all.
    ADDED: none. In the column but not listed: MIC-3D-20GE-SFP-E and MIC-3D-8CHDS3-E3-B (not modelled
    in this library) and MIC-3D-40GE-TX (11.2R4; dual-wide, so no single bay can take it -
    roc-ops/Portrayal#34). MIC-3D-16CHE1-T1-CE is listed with the table's own note: 'Support for
    Non-Channelized MIC only'. The MPC1 column takes the same set, differing only in first release.
  numbering: 'guide - ports number within each PIC group with an n/ group legend, per the module reference
    port-numbering figures (g000930, g100786); the exact print positions are layout-derived'
  levers: >-
    photo-measured - the MX240 front photograph: each ejector lever is 97 px = 28.8 mm long and 25-27
    px = 7.4-8.0 mm tall, its tip 9.5 mm past the plate end; drawn 29.0 x 7.4 with the tip at the envelope
    edge (8.75 mm past the plate, which the 413.5 envelope fixes). Centred on the plate: the right-hand
    levers read centred; the left-hand ones read 2.4 mm low, which a lever standing proud of the face
    shows in a photograph taken from above centre. Until 2.0.0 they were drawn 16 x 9 at x 1.2, about
    16 mm left of the real lever and too high.
  model-name: >-
    photo-measured - DPC 40xGE, DPC-R-4XGE and SCB-MX each print the model name from card x 11.4 (the
    plate's left end plus 2.65), baseline 25.5 below the plate top, under the lever. The other cards take
    the same position as the family's.
  status-group: >-
    estimated - the photographed DPCs' status-group position, not photographed on this card: the OK/FAIL
    legend vertical at card x 32.3 centred on y 12.7 and its lamp below it at (32.3, 21.5), as DPC-R-4XGE
    prints them. 1.x drew both at old x 31.0, which the re-envelope would have put under the new lever.
  mic-windows: >-
    estimated - MX2010 photo ratios via the #261 MIC research; card not photographed on MX240/480/960;
    bay size awaits the MIC resize. On that photograph the two MICs abut at the plate's centre and start
    29.0 and 197.4 mm along the plate from its left end (+/-1 mm), so the windows start at card x 37.75
    and 206.15; each keeps its 168 x 27 bay until the MIC plate resize re-places them. 1.x started MIC
    0 at old x 40.0, which the re-envelope would have put at 22.64, under the new left lever.
states:
- ok
- fail
- absent
