    - juniper/mic-3d-2xge-xfp@2
    - juniper/mic-3d-4xge-xfp@3
    - juniper/mic-3d-1oc192-xfp@2
    - juniper/mic-3d-4oc3oc12-1oc48@2
    - juniper/mic-3d-8oc3oc12-4oc48@2
    - juniper/mic-3d-8ds3-e3@2
