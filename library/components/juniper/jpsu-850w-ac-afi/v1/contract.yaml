format: 1
kind: module
name: jpsu-850w-ac-afi
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  JPSU-850W-AC-AFI, an 850 W AC power supply with back-to-front airflow (AIR IN). It is a
  field-replaceable unit, hot-removable and hot-insertable, and load-shares with its twin. The QFX5120
  hardware guide says the QFX5120-48YM takes it. It seats two, in slots 0 and 1 at the right of the
  rear. The face is that of its front-to-back sibling JPSU-850W-AC-AFO with a Juniper Azure Blue
  handle. AC and DC supplies, and supplies of different airflow direction, are never mixed in one
  chassis.
attrs:
  model: JPSU-850W-AC-AFI
  role: ac-power-supply
  power-output-w: 850
  airflow: back-to-front
  input: 100 to 240 VAC, 50 to 60 Hz, 7.5 A at 100 VAC or 3 A at 240 VAC (QFX5120-48YM, guide Table 30)
provenance:
  size: >-
    borrowed - the body is juniper/jpsu-850w-ac-afo@1, whose own size is the bay's (see that part):
    the guide gives the two supplies one figure and one slot and differs only in the handle colour
    and label, and no photograph of either AC unit was found.
  depth: >-
    not stated; the guide's figure is an isometric drawing with no scale.
  face: >-
    borrowed - juniper/jpsu-850w-ac-afo@1 with the handle recoloured; the guide lists the two
    airflow variants side by side under one figure.
  handle-colour: >-
    estimated - the guide names the colour (Juniper Azure Blue) and prints no value, and no
    photograph of the blue supply was found; the shade is chosen to read as blue.
  power-output-w: >-
    datasheet - the part number and the guide's text call it an 850-W supply; the guide gives no
    separate output rating. An OUTPUT, since a supply provides power.
  leds: >-
    datasheet - guide, LEDs on the AC Power Supplies (Table 34), which covers the 48YM supply: AC
    green when the supply receives power, DC green when it sends power out correctly, the fault
    lamp amber on an error.
  airflow: >-
    datasheet - guide, airflow direction in AC power supplies (Table 26): JPSU-850W-AC-AFI is
    back-to-front and carries the label AIR IN and a Juniper Azure Blue handle.
states:
- ok
- fault
- absent
