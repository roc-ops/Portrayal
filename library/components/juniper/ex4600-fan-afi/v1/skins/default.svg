<svg xmlns="http://www.w3.org/2000/svg" width="40.9mm" height="41.5mm" viewBox="0 0 40.9 41.5">
  <defs>
    <pattern id="hex" width="2.6" height="4.5" patternUnits="userSpaceOnUse">
      <polygon points="1.3,0.1 2.25,0.65 2.25,1.75 1.3,2.3 0.35,1.75 0.35,0.65" fill="#050607"/>
      <polygon points="0,2.35 0.95,2.9 0.95,4.0 0,4.55 -0.95,4.0 -0.95,2.9" fill="#050607"/>
      <polygon points="2.6,2.35 3.55,2.9 3.55,4.0 2.6,4.55 1.65,4.0 1.65,2.9" fill="#050607"/>
    </pattern>
  </defs>
  <rect id="face" x="0.2" y="0.2" width="40.5" height="41.1" rx="2.0" fill="#88bcda" stroke="#537385" stroke-width="0.4"
        data-fill-from="handle-finish" data-stroke-derive="handle-finish"/>
  <g id="grille-top">
    <rect x="7.4" y="4.3" width="27.4" height="11.2" rx="3.0" fill="#1a1d20"/>
    <rect x="7.4" y="4.3" width="27.4" height="11.2" rx="3.0" fill="url(#hex)"/>
  </g>
  <g id="grille-bottom">
    <rect x="7.2" y="26.7" width="27.5" height="10.3" rx="3.0" fill="#1a1d20"/>
    <rect x="7.2" y="26.7" width="27.5" height="10.3" rx="3.0" fill="url(#hex)"/>
  </g>
  <g id="handle">
    <rect x="4.8" y="14.8" width="31.3" height="12.0" rx="3.0" fill="#88bcda" stroke="#537385" stroke-width="0.35"
          data-fill-from="handle-finish" data-stroke-derive="handle-finish"/>
    <rect x="4.8" y="14.8" width="31.3" height="12.0" rx="3.0" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="0.6" y="19.0" width="5.2" height="4.6" rx="0.6" fill="#000000" fill-opacity="0.2"/>
    <rect x="35.1" y="19.0" width="5.2" height="4.6" rx="0.6" fill="#000000" fill-opacity="0.2"/>
    <rect id="airflow-chip" x="12.5" y="17.4" width="12.9" height="6.8" rx="0.7" fill="#6f7377"/>
    <g id="fan-symbol">
      <circle cx="15.9" cy="20.8" r="0.45" fill="#88bcda" data-fill-from="handle-finish"/>
      <ellipse cx="15.9" cy="19.6" rx="0.65" ry="1.0" fill="#88bcda" data-fill-from="handle-finish"/>
      <ellipse cx="15.9" cy="19.6" rx="0.65" ry="1.0" fill="#88bcda" data-fill-from="handle-finish" transform="rotate(90 15.9 20.8)"/>
      <ellipse cx="15.9" cy="19.6" rx="0.65" ry="1.0" fill="#88bcda" data-fill-from="handle-finish" transform="rotate(180 15.9 20.8)"/>
      <ellipse cx="15.9" cy="19.6" rx="0.65" ry="1.0" fill="#88bcda" data-fill-from="handle-finish" transform="rotate(270 15.9 20.8)"/>
    </g>
    <g id="silkscreen">
      <text x="21.6" y="20.4" font-family="sans-serif" font-size="2.2" fill="#e8eaec" text-anchor="middle">AIR</text>
      <text x="21.6" y="23.2" font-family="sans-serif" font-size="2.2" fill="#e8eaec" text-anchor="middle">IN</text>
