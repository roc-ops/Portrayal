format: 1
kind: module
name: ex8200-psu-cover
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Power supply cover panel of the Juniper EX8200 chassis (EX8208 and EX8216): a plain plate that fills one of the
  six power supply slots when no supply is fitted. The base orders ship four of them over the empty slots.
states: [absent]
size:
  w: 70.1
  h: 104.0
size-confidence: {w: estimated, h: estimated}
provenance:
  sources: >-
    datasheet - EX8208 and EX8216 Switch Hardware Guides (PDFs dated 2020-12-16), Table 5: the base orders list
    "Four power supply cover panels", and "Cover panels are installed over the remaining four power supply
    slots" (AC Power Supply Description). The guides name no part number for it and draw none. The EX8208 and
    EX8216 draw their supply row in one figure (g020641, Figure 4 of the EX8208 guide and Figure 6 of the
    EX8216's), so one cover serves both.
  size: >-
    estimated - the bay's own size, a supply slot read off Figure 3 of the EX8208 guide (flat, 3.479 px/mm
    anchored on the 17.25 in body): 70.1 mm wide on a 71.0 mm pitch and 104.0 mm high.
  face: >-
    estimated - no drawing or photograph of the cover is held; a plain plate with a pull and the supply's
    captive screw position.
