      - {name: ok, color: '#22c55e'}
      - {name: standby, color: '#22c55e', behavior: blinking}
      - {name: warning, color: '#f59e0b', behavior: blinking}
      - {name: fault, color: '#f59e0b'}
  handle: {at: [2.5, 28.7], size: [39.9, 10.6], class: handle}
  latch: {at: [62.6, 12.2], size: [10.1, 17.9], class: latch}
