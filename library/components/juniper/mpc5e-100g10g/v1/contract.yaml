format: 1
kind: module
name: mpc5e-100g10g
version: 1.2.1
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MPC5E-100G10G fixed MPC - two 100GbE CFP2 ports and four SFP+; the Q variant shares the faceplate. Authored as the MX240/MX480 horizontal form.
attrs:
  model: MPC5E-100G10G
  power-draw-max-w: 607
  model-variants: MPC5EQ-100G10G
provenance:
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is
    the upper cage upright (rotate 0) over the lower turned 180, so both cage lips face
    the band between the two cages and both bails face outward. Decided by the rule, not
    an observation, so a photograph of the stack overturns it: the 2 SFP pairs
    (port-0-0/port-0-1 and port-0-2/port-0-3). 2 of these were drawn with the upper cage
    turned before the std cage art moved its lip to the bottom of the opening; turning
    them keeps the lips in the middle band where they were drawn and seats every optic
    bail-outward. Turning a composed cage in place changes no box, id or anything a
    device places, so it is a minor bump (S6).
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU power table, MX chassis guides: '| 2x100GE + 4x10GE MPC5E 2x100GE + 4x10GE MPC5EQ | MPC5E-100G10G MPC5EQ-100G10G | With optics: 607 Wat 55° C 541 Wat 4'. The 55 C rung is
    carried, being the worst rated case a chassis budget has to survive.
    The row says WITH OPTICS, so the transceivers are already in this figure.
    Nothing double counts: the `common/` generic optics L27 exempts carry no
    wattage of their own.
    Taken by matching the row's OWN LABEL: these tables pair parts with figures
    in one row - `4-Port: X 8-Port: Y` against `4-Port: 41 W 8-Port: 52 W` - and
    reading first-wins puts the small card's number on the big one. Aligning on
    the N-Port label instead is self-checking, and it checks out: 4-port 41 W
    against 8-port 52 W, 4-port 24 W against 8-port 29 W.
    Seen in 9 guide(s): mx2008, mx2010-p0001-0300, mx2010-p0301-0600, mx2020-p0001-0300.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
states:
- ok
- fail
- absent
parts:
- {ref: std/sfp-ganged@1, id: port-0-0, at: [44.00, 3.60], attrs: {media: sfp-plus}}
- {ref: std/sfp-ganged@1, id: port-0-1, at: [44.00, 15.20], rotate: 180, attrs: {media: sfp-plus}}
- {ref: std/sfp-ganged@1, id: port-0-2, at: [58.25, 3.60], attrs: {media: sfp-plus}}
- {ref: std/sfp-ganged@1, id: port-0-3, at: [58.25, 15.20], rotate: 180, attrs: {media: sfp-plus}}
- {ref: std/cfp2@2, id: port-1-0, at: [79.50, 7.60], attrs: {media: cfp2}}
- {ref: std/cfp2@2, id: port-2-0, at: [131.50, 7.60], attrs: {media: cfp2}}
size:
  w: 420.9
  h: 29.5
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  w and h are the MX240/MX480 horizontal card slot opening (that chassis's own bays are 420.9 x
  29.5 on a 30.45 mm pitch), not the part. Nothing measured the card: provenance/size says so in
  as many words, and #261 found the same model number drawn at two different sizes because two
  chassis have two openings. Juniper's hardware guides for the MX240, MX480 and MX960 all state
  an MPC/DPC/SCB as 17 x 22 x 1.25 in - the MX960's own book included, which is the vendor
  saying it is ONE card in both orientations - but those figures are rounded to the quarter
  inch, and 1.25 in is 31.75 mm against a modelled 30.45 mm slot pitch, so they cannot settle a
  drawing to 0.1 mm. Estimated until a mechanical drawing or a ruler on a real card turns up.
