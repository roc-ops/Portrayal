format: 1
kind: module
name: mic-3d-16che1-t1-ce-v
version: 1.2.1
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper channelized E1/T1 circuit-emulation MIC - sixteen RJ48 jacks in two rows. Vertical author for the vertical carriers (MX960/MX2000 MPCs stand on end, and their MICs with them).
unplaced: >-
  SUPERSEDED by juniper/mic-3d-16che1-t1-ce@2: the MX2000 carriers that took this rotated twin
  are retired in favour of the horizontal MPC seated in juniper/mx2000-lc-adapter@1, which
  takes the horizontal MIC (#261, part 2). Kept and deprecated rather than deleted, so a
  manifest that pins it still resolves (#448); nothing in this library seats it.
superseded-by: juniper/mic-3d-16che1-t1-ce@2
attrs:
  model: MIC-3D-16CHE1-T1-CE
  power-draw-max-w: 29.08
  model-variants: MIC-3D-16CHE1-T1-CE-H
provenance:
  port-jacks-are-bare: >-
    THE PORT JACKS ARE BARE. port-0-0..15 are RJ48 receptacles carrying channelized E1/T1,
    not Ethernet, so they take the RJ45 family's bare cell rather than its lamped one
    (docs/rj45-family-design.md decision 3: the lamped member is for what carries Ethernet).
    The module reference tables no per-port link or activity lamp for this MIC, and this
    contract draws none: a lamped jack here would assert two indicators the hardware is not
    documented to have.
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU power table, MX chassis guides: '29.08 Wat 131 F (55 C) 27.84 Wat 40 C 26.55 Wat 77 F (25 C)'. The max at 55 C is
    carried, because the worst rated case is what a chassis budget needs.
    Read off the row, with the part number alone in its own cell - the looser
    extraction that preceded this put the MPC7E's number on the MPC6E and took a
    25 C figure for a max, so a row only counts here when nothing else in it
    could be the subject.
    The note this replaces said the module reference does not carry it. True of
    the book it named; the chassis guides do.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
