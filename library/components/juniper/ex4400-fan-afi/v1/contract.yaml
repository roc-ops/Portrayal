    size: [6.4, 6.4]
    class: screw
  handle:
    at: [0.6, 21.5]
    size: [40.6, 9.9]
    class: latch
  led:
    at: [34.9, 36.1]
    size: [3.0, 3.0]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
size:
  w: 41.8
  h: 41.8
  d: 115.7
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
