name: qfx5110-32q-fanafi
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  QFX5110-32Q-FANAFI, the field-replaceable fan module of the QFX5110-32Q with back-to-front airflow.
  Air comes in at the fan end and leaves at the port side. It is marked AIR IN on a Juniper Azure
  Blue handle. The switch seats five, in slots 0 to 4 left to right. The front-to-back sibling is
  QFX5110-32Q-FANAFO. The QFX5110 hardware guide says to use only the fan module designed for the
  product number, so the QFX5110-48S has its own part. The two airflows are never mixed in one
  chassis, and never with power supplies of the other direction.
attrs:
  model: QFX5110-32Q-FANAFI
  airflow: back-to-front
  power-absent: not-published
provenance:
  size: >-
    borrowed - the body, drawing and colours are those of juniper/qfx5110-fanafi@1, the module the
    QFX5120 devices seat. The QFX5110 guide gives this model's module its own part number and no
    size, and its Figure 23 is an unscaled drawing. No measurement of this part exists.
  depth: >-
    not stated. The guide's module figure is an isometric drawing with no scale.
  face: >-
    borrowed - the drawing is that of juniper/qfx5110-fanafi@1, the front-to-back face with the
    label changed to AIR IN.
  airflow: >-
    datasheet - QFX5110 Switch Hardware Guide, Table 11 (pp. 40-41), QFX5110-32Q-FANAFI: label AIR
    IN, colour Juniper Azure Blue, FRU-to-port airflow (back-to-front).
  handle-colour: >-
    estimated - the guide names the colour (Juniper Azure Blue) and prints no value. The shade is
    that of juniper/qfx5110-fanafi@1, chosen to read as blue beside the gold module.
  part-number: >-
    datasheet - QFX5110 Switch Hardware Guide, Table 11 (pp. 40-41), and p. 44: "Only use the
    replacement fan modules that are designed for use with your product number."
  power: >-
    not published. Table 11 and the fan module section of the guide print no per-module wattage.
