format: 1
kind: module
name: ex4100-jpsu-150-dc-afo
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper JPSU-150-DC-AFO, the 150 W DC power supply of the EX4100-24T-DC and EX4100-48T-DC, front-to-back
  airflow (AFO). The switch ships with one in power supply slot 0 or 1 and takes a second. It takes -48
  through -60 VDC on a three-terminal connector, and the DC PSU terminal connector ships with the DC models. The
  face has a fan, an orange release latch and two lamps, OUT OK and IN OK. Airflow is front to back,
  marked AIR OUT. Do not mix it with an AC supply, or with a supply or fan module of the other direction.
attrs:
  role: dc-power-supply
  inlet: dc-terminal
  power-output-w: 150
  input: -48 through -60 VDC rated operating voltage
  input-current: 4.7 A to 2.8 A
  airflow: front-to-back
  weight-kg: 0.65
part-numbers:
  JPSU-150-DC-AFO: {part: JPSU-150-DC-AFO}
provenance:
  sources: >-
    datasheet - EX4100 Switch Hardware Guide (Juniper Networks, PDF created 2026-10-01): Table 37 (the details of
    the DC supply), Table 38 (the specifications), Table 39 (airflow), Figure 45 (the supply), Figure 9 and
    Figure 18 (the DC rear panels, as line drawings) and the Table 20 note (size and weight).
  size: >-
    datasheet - Table 20 note: power supply width 2.87 in. (7.3 cm), height 1.57 in. (4 cm), depth 8.86 in.
    (22.5 cm), one set for every supply. Carried as 73.0 by 40.0 by 225.0 mm. The guide's DC figures are line
    drawings of the same envelope as the AC unit.
  depth: datasheet - Table 20 note, 8.86 in. (22.5 cm), carried as 225.0 mm.
  power-output-w: >-
    datasheet - Table 38: output power 150 W. An output figure, because a supply provides power. The guide gives
    no draw or loss figure for the unit.
  input: >-
    datasheet - Table 38: rated operating voltage -48 VDC to -60 VDC, input current rating 4.7 A - 2.8 A. Figure 45
    prints -48 - -60V and 4.7 - 2.8A on the face.
  part-number: >-
    datasheet - Table 37 and Table 39 name the supply JPSU-150-DC-AFO. Table 64 prints the CLI name
    JPSU-150W-DC-AFO; Table 37 is the supply's own table, so its spelling is used.
  airflow: >-
    datasheet - Table 39: front to back, label AIR OUT. Table 27 says the DC switches ship with an orange handle.
  leds: >-
    datasheet - Table 37 names the lamps IN OK and OUT OK. The guide's Table 40 describes only the AC supply's lamps,
    and Figure 47 shows the one lamp of the DC supply, so no colour code is stated for these two. They are drawn
    green, red and off by analogy with the AC unit, and flagged here as not stated. Figure 45 puts the OUT OK lamp
    left of the IN OK lamp.
  face: >-
    estimated - the fan, latch and lamp positions are those of juniper/ex4100-jpsu-150-ac-afo@1. The three-terminal
    connector, its grip and the housing around it are read off the line drawings in Figures 9 and 18 and the
    isometric Figure 45, at about 3.1 px/mm, with no render of the DC supply held. The clear plastic cover over the
    terminals is not drawn. The 50-60 Hz legend is as printed in Figure 45.
  relief: >-
    estimated - the latch stands proud of the face in Figure 45. Its projection is not stated or measured.
  connector: >-
    the supply composes juniper/jpsu-150-dc-header@1 as `dc-header`, the pluggable three-terminal connector of the EX4100
    Switch Hardware Guide (Juniper Networks), "Connect DC Power to an EX4100 Switch" (PDF pages 139 and 140) and its Figure 75
    (the supply's socket, with the connector approaching). The guide calls it "the terminal connector" and names no maker or
    part number for it, so the part is a declared stand-in (its own provenance). Its place is an estimate: the guide gives no
    dimension, so it stands at the centre of the block the skin already draws (48.2, 9.4; 12.6 by 27.5), inside it. The three
    round screw heads the skin draws in that block are covered by the part, and the skin is unchanged. The cable connector of
    Figure 74, juniper/jpsu-150-dc-plug@1, mates it. The EX3400 supply of the same part number carries the same connector (the
    same drawing in its guide) and composes the same part.
  roles: >-
    guide - Figure 75 prints "+", "-" and an earth symbol beside the three cells, top to bottom. Step 1's note says the + terminal
    is referred to as +RTN and the - terminal as -48 V, so the roles are `rtn`, `batt` and `gnd`, in that order from the top.
    The guide prints no nominal beside the figure; Table 38 prints a range.
  no-dc-port: >-
    THE DC INPUT PORT IS NOT STATED HERE, ON PURPOSE. The three poles are the cells of one pluggable connector that has an earth
    cell in it, and a port whose poles are a connector's contacts is offered only where that path's part is itself the
    connector; on a supply in a bay it is the supply, not the connector it composes, so a port stated here would be published
    and then not offered. The roles above are recorded for the port a later change can state, a minor on the devices that seat
    this supply.
states:
- ok
- fault
- absent
