<svg xmlns="http://www.w3.org/2000/svg" width="10.1mm" height="36.0mm" viewBox="0 0 10.1 36.0">
  <!-- The EX4400 DC supply's D-sub 3W3 connector seen from its mating face: the shell, three contacts and a hex standoff above
       and below. Shapes and colours are those the supply's own skin drew before it composed this part. -->
  <polygon id="standoff-top" points="3.3,0 6.7,0 8.4,2.8 6.7,4.8 3.3,4.8 1.6,2.8" fill="#cfd0d2" stroke="#9a9b9d" stroke-width="0.3"/>
  <polygon id="standoff-bottom" points="3.3,30.4 6.7,30.4 8.4,33.2 6.7,36.0 3.3,36.0 1.6,33.2" fill="#cfd0d2" stroke="#9a9b9d" stroke-width="0.3"/>
  <path id="shell" d="M 0.9 4.9 H 9.2 Q 10.1 4.9 10.1 5.8 V 29.3 Q 10.1 30.2 9.2 30.2 H 0.9 Q 0 30.2 0 29.3 V 5.8 Q 0 4.9 0.9 4.9 Z" fill="#17181a" stroke="#b9babc" stroke-width="0.5"/>
  <circle id="contact-top" cx="5.0" cy="10.6" r="1.6" fill="#d9b13a"/>
  <circle id="contact-middle" cx="5.0" cy="17.4" r="2.3" fill="#d9b13a"/>
  <circle id="contact-middle-bore" cx="5.0" cy="17.4" r="1.4" fill="#2a2415"/>
  <circle id="contact-bottom" cx="5.0" cy="24.0" r="1.6" fill="#d9b13a"/>
</svg>
