format: 1
kind: module
name: mic-macsec-20ge-v
version: 1.3.1
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MACsec Gigabit Ethernet MIC - twenty SFP cages in two PIC groups of ten. Vertical author for the vertical carriers (MX960/MX2000 MPCs stand on end, and their MICs with them).
unplaced: >-
  SUPERSEDED by juniper/mic-macsec-20ge@2: the MX2000 carriers that took this rotated twin are
  retired in favour of the horizontal MPC seated in juniper/mx2000-lc-adapter@1, which takes
  the horizontal MIC (#261, part 2). Kept and deprecated rather than deleted, so a manifest
  that pins it still resolves (#448); nothing in this library seats it.
superseded-by: juniper/mic-macsec-20ge@2
attrs:
  sfp: 20
  model: MIC-MACSEC-20GE
  power-draw-max-w: 60
provenance:
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): on a card
    drawn on its side a pair sits left and right, the left cage 270 beside the right 90,
    so both cage lips face the band between the two cages and both bails face outward.
    Decided by the rule, not an observation, so a photograph of the stack overturns it:
    the 10 SFP pairs (port-0-1/port-0-0 to port-1-9/port-1-8). Turning a composed cage
    in place changes no box, id or anything a device places, so it is a minor bump (S6).
  sfp-rate: >-
    the cage RATE, transcribed from this contract's own description: 'MACsec Gigabit
    Ethernet MIC - twenty SFP cages in two PIC groups of ten'. Without it `cage_type` finds
    no media attr for the sfp family and falls through to PART_IFACE's default, which is
    SFP+ at 10G - a rate this card does not run. Nothing new was measured.
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    MX module reference, the MIC-MACSEC-20GE section: 'Typical power requirement: 1A @ 48V
    (48 W)  Maximum power requirement: 1.25A @ 48V (60 W)'. The maximum is carried. The
    vendor gives current and voltage beside each figure and its own arithmetic agrees: 1 x
    48 = 48 and 1.25 x 48 = 60. NO AMBIENT IS STATED here - the section gives typical and
    maximum rather than a temperature ladder - so none is recorded rather than invented.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
