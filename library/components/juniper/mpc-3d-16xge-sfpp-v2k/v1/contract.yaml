size-confidence: {w: estimated, h: estimated}
size-notes: >-
  w and h are the MX2000 vertical card slot opening (the MX2010/MX2020 bays are 41.0 x 425.0),
  which an MPC reaches through its adapter card, not the part. Nothing measured the card:
  provenance/size says so in as many words, and #261 found the same model number drawn at two
  different sizes because two chassis have two openings. Juniper's hardware guides for the
  MX240, MX480 and MX960 all state an MPC/DPC/SCB as 17 x 22 x 1.25 in - the MX960's own book
  included, which is the vendor saying it is ONE card in both orientations - but those figures
  are rounded to the quarter inch, and 1.25 in is 31.75 mm against a modelled 30.45 mm slot
  pitch, so they cannot settle a drawing to 0.1 mm. Estimated until a mechanical drawing or a
  ruler on a real card turns up.
