format: 1
kind: module
name: jnp10k-lc480
version: 1.3.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MX10K-LC480 line card - 480 Gbps, 48 SFP+ cages in two ganged
  rows split into two 24-port blocks, for the MX10004/MX10008.
attrs:
  model: MX10K-LC480
  power-draw-typical-w: 430
  power-draw-max-w: 480
  sfp-plus: 48
provenance:
  sfp-plus-rate: >-
    MX10008 hardware guide, 'MX10K-LC480' (p140): 'The MX10K-LC480 (Model number: JNP10K-LC480) is a
    fixed-configuration line card with 48 SFP/SFP+ ports. Each port supports a speed of 10 Gbps or 1 Gbps'.
    Nothing new was measured.
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is
    the upper cage upright (rotate 0) over the lower turned 180, so both cage lips face
    the band between the two cages and both bails face outward. Decided by the rule, not
    an observation, so a photograph of the stack overturns it: the 24 SFP pairs
    (port-0/port-1 to port-46/port-47). 24 of these were drawn with the upper cage
    turned before the std cage art moved its lip to the bottom of the opening; turning
    them keeps the lips in the middle band where they were drawn and seats every optic
    bail-outward. Turning a composed cage in place changes no box, id or anything a
    device places, so it is a minor bump (S6).
  size: 'datasheet-table - the guide FRU table: 1.89 x 17.2 x 19.05 in;
    face drawn 437 x 48 mm'
  power: 'datasheet-table - guide power table at 10G: 430 W at 25 C,
    480 W at 55 C (1G: 370/420)'
  face: 'photo - two 2x12 ganged blocks on the registry 14.25 pitch read
    off the frontwtop photograph, approximate to ~2 mm'
  groups: >-
    Juniper Networks MX10008 Universal Routing Platform Hardware Guide, 'MX10K-LC480' (printed
    pages 20 and 140): a fixed-configuration line card with '48 SFP/SFP+ ports' and 'Each port
    supports a speed of 10 Gbps or 1 Gbps'. The guide's elevation shows the cages in two blocks
    of twelve pairs and prints no port number legibly, so the ids number the drawn cages. The
    role is traffic: the page names no role for the ports, and the role follows the job, a
    network interface a transceiver is plugged into.
states:
- ok
- fail
- absent
groups:
  sfp-plus-10g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g, speeds: [1g, 10g]}
    description: >-
      the forty-eight SFP+ ports, each at 1 Gbps or 10 Gbps
