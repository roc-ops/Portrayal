format: 1
kind: module
name: jnp10k-lc480
version: 1.1.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MX10K-LC480 line card - 480 Gbps, 48 SFP+ cages in two ganged
  rows split into two 24-port blocks, for the MX10004/MX10008.
attrs:
  model: MX10K-LC480
  power-draw-typical-w: 430
  power-draw-max-w: 480
provenance:
  stack-orientation: >-
    The belly-to-belly cage pairs on this card follow the library's stack convention
    (docs/pluggables-3d-design.md, S1-S4): a row pair is the upper cage upright (rotate
    0) over the lower turned 180, so both cage lips face the band between the two cages
    and both bails face outward, where a thumb reaches them. Where this provenance
    records a reading of a stack the orientation is that reading; otherwise it is the
    rule, not an observation. A photograph of the stack that shows otherwise overturns
    it. 24 pairs were drawn with the UPPER cage turned before the std cage art moved its
    lip to the bottom of the opening; turning them to the convention keeps the lips in
    the middle band where they were drawn, and seats every optic bail-outward. Turning a
    composed cage in place changes no box, id or anything a device places, so it is a
    minor bump (S6).
  size: 'datasheet-table - the guide FRU table: 1.89 x 17.2 x 19.05 in;
    face drawn 437 x 48 mm'
  power: 'datasheet-table - guide power table at 10G: 430 W at 25 C,
    480 W at 55 C (1G: 370/420)'
  face: 'photo - two 2x12 ganged blocks on the registry 14.25 pitch read
    off the frontwtop photograph, approximate to ~2 mm'
states:
- ok
- fail
- absent
