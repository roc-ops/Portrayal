format: 1
kind: module
name: ex3400-jpsu-150-ac-afo
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper JPSU-150-AC-AFO, the 150 W AC power supply for the EX3400 non-PoE models. It seats in
  power supply slot 0 or 1 at the rear. It is hot-insertable and hot-removable, but a switch with
  only one supply must be powered off before the supply is removed. The face has a fan, an orange
  release latch, a C14 inlet and two lamps, DC OK and AC OK. Airflow is front to back, marked AIR OUT.
attrs:
  role: ac-power-supply
  power-output-w: 150
  input: 100 through 240 VAC, 50 or 60 Hz
  airflow: front-to-back
  weight-kg: 0.65
part-numbers:
  JPSU-150-AC-AFO: {part: JPSU-150-AC-AFO}
provenance:
  size: >-
    photo-measured - Juniper image-library EX3400-48P rear studio photograph (ex3400-48p-rear-high),
    body width 441.0 mm over 1467 px (3.327 px/mm): the supply face measures 237 by 130 px, 71.2 by
    39.0 mm. That photograph shows the 920 W supply that the EX3400-48P ships with. The community
    NetBox rear elevation of the EX3400-48T shows the same face on the 150 W supply, so the
    150 W face is drawn the same. The guide gives no supply dimension, only the weight, and no depth.
  power-output-w: >-
    datasheet - EX3400 Switch Hardware Guide (published 2026-01-09), Characteristics of a AC Power
    Supply, "EX3400 switches support 150 W, 600 W, 920 W AC power supply", and Table 12 names this
    unit JPSU-150-AC-AFO. An output, because a supply provides power.
  airflow: >-
    datasheet - Table 12: front-to-back, indicated by label AIR OUT. Table 12 lists a back-to-front
    twin, JPSU-150-AC-AFI, which this component does not model.
  leds: >-
    datasheet - Table 13 and Figure 13: AC OK is green when the supply receives proper input power;
    DC OK is green when the supply delivers power and red when it has failed. Figure 13 lists DC OK
    first, then AC OK, left to right, and the photograph agrees.
  face: >-
    photo-measured - the fan, orange latch, label strip, lamps and inlet sit at fractions of the
    237 by 130 px face in the EX3400-48P rear photograph. The cord retainer clip beside the inlet
    is a loose accessory (packing list, Table 36) and is not drawn. The inlet is std/c14-inlet@1.
states:
- ok
- fault
- absent
parts:
- {ref: std/c14-inlet@1, id: inlet, at: [38.0, 12.5]}
elements:
  led-dc:
    at: [41.9, 3.4]
    size: [2.2, 2.2]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: red, color: '#e03a2f'}
    - 'off'
  led-ac:
    at: [59.8, 3.4]
    size: [2.2, 2.2]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  latch:
    at: [29.5, 1.2]
    size: [9.8, 36.6]
    class: latch
size:
  w: 71.2
  h: 39.0
relief:
  features:
  - node: latch
    out: 1.6
    color: '#ee6a1f'
    confidence: estimated
    source: photo - the orange latch stands proud; projection not measured
size-confidence: {w: photo-measured, h: photo-measured}
skins: [default]
