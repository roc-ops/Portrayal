format: 1
kind: module
name: dpc-r-4xge-xfp
version: 1.1.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper DPC-R-4XGE-XFP (10-Gigabit Ethernet DPC, EOL) - four 10GbE XFP
  ports, each with rotated PORT n/0 / TUNNEL / LINK legends and lamp pair,
  photographed in MX240 slot 1 with the XFP dust covers seated.
attrs:
  xfp-10g: 4
  model: DPC-R-4XGE-XFP
  power-draw-max-w: 310
  lifecycle-note: EOL per PSN-TSB14931; modelled because it is the card the
    reference photograph carries
provenance:
  ethernet-rate: >-
    the Ethernet rate, from the MX Series Interface Module Reference, which files
    DPC-R-4XGE-XFP under 10-Gigabit Ethernet DPC with XFP. The XFP cage cannot say: it takes
    a 10GbE optic and an OC-192 one, and the framing is what differs. The export already
    typed it 10gbase-x-xfp by default; this makes that a statement. Nothing new was
    measured.
  size: 'photo - 420.9 x 29.5 mm slot face (see scb-mx). XFP port centres at
    card-local x 112.7/166.1/217.4/270.8, y 13.9 - measured off the metal
    dust covers, which the skin draws seated; the cage aperture underneath is
    the registry xfp'
  power: 'guide Table 93 DPC section: DPC-R-4XGE-XFP 310 W maximum; ambient
    unqualified by the vendor - max is our reading, recorded here'
  covers: 'photo - the reference unit ships with bright XFP dust covers
    seated; they are DELIBERATELY NOT DRAWN because composed cages paint
    above skin art, so a drawn cover would sit under the open cage it is
    meant to hide. Ports render open'
states:
- ok
- fail
- absent
parts:
- {ref: std/xfp@1, id: port-0, at: [102.95, 9.05]}
- {ref: std/xfp@1, id: port-1, at: [156.35, 9.05]}
- {ref: std/xfp@1, id: port-2, at: [207.65, 9.05]}
- {ref: std/xfp@1, id: port-3, at: [261.05, 9.05]}
elements:
  lever-left:
    at: [1.2, 2.2]
    size: [16.0, 9.0]
    class: latch
  lever-right:
    at: [403.7, 2.2]
    size: [16.0, 9.0]
    class: latch
size:
  w: 420.9
  h: 29.5
