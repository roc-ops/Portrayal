format: 1
kind: module
name: dpc-r-4xge-xfp
version: 3.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper DPC-R-4XGE-XFP (10-Gigabit Ethernet DPC, EOL) - four 10GbE XFP
  ports, each with rotated PORT n/0 / TUNNEL / LINK legends and lamp pair,
  photographed in MX240 slot 1 with the XFP dust covers seated.
attrs:
  xfp-10g: 4
  model: DPC-R-4XGE-XFP
  power-draw-max-w: 310
  lifecycle-note: EOL per PSN-TSB14931; modelled because it is the card the reference photograph 
    carries
provenance:
  ethernet-rate: >-
    the Ethernet rate, from the MX Series Interface Module Reference, which files
    DPC-R-4XGE-XFP under 10-Gigabit Ethernet DPC with XFP. The XFP cage cannot say: it takes
    a 10GbE optic and an OC-192 one, and the framing is what differs. The export already
    typed it 10gbase-x-xfp by default; this makes that a statement. Nothing new was
    measured.
  size: >-
    photo-measured - the plate is 396.0 x 29.5 centred in a 413.5 lever envelope. Plate edges off the
    MX240 front photograph (body px 2.5-1496.5 = 443 mm, 3.372 px/mm; SFF-8433 ganged-SFP pitch cross-checks
    3.379): x px 127.5-1463.5 = 396.2 mm, the same edges on DPC 40xGE, DPC-R-4XGE and SCB-MX; corroborated
    by the MX480 (396.3 at 3.230 px/mm) and the MX960 (815 px, 393-397 depending on the axis's scale).
    RE-ENVELOPED, NOT REDRAWN, at 2.0.0: every part, bay, lamp and legend at 1.x card x >= 26.15 moved
    by x' = 8.75 + (x - 26.15) * 396.0 / 394.85, the old plate run 26.15-421.0 onto the new 8.75-404.75;
    y is unchanged. Only the levers, the model name and the status group were placed afresh (provenance
    below). 
  power: 'guide Table 93 DPC section: DPC-R-4XGE-XFP 310 W maximum; ambient unqualified by the vendor
    - max is our reading, recorded here'
  covers: 'photo - the reference unit ships with bright XFP dust covers seated; they are DELIBERATELY
    NOT DRAWN because composed cages paint above skin art, so a drawn cover would sit under the open cage
    it is meant to hide. Ports render open'
  levers: >-
    photo-measured - the MX240 front photograph: each ejector lever is 97 px = 28.8 mm long and 25-27
    px = 7.4-8.0 mm tall, its tip 9.5 mm past the plate end; drawn 29.0 x 7.4 with the tip at the envelope
    edge (8.75 mm past the plate, which the 413.5 envelope fixes). Centred on the plate: the right-hand
    levers read centred; the left-hand ones read 2.4 mm low, which a lever standing proud of the face
    shows in a photograph taken from above centre. Until 2.0.0 they were drawn 16 x 9 at x 1.2, about
    16 mm left of the real lever and too high.
  model-name: >-
    photo-measured - DPC 40xGE, DPC-R-4XGE and SCB-MX each print the model name from card x 11.4 (the
    plate's left end plus 2.65), baseline 25.5 below the plate top, under the lever. The other cards take
    the same position as the family's.
  status-group: >-
    photo-measured - the MX240 front photograph, slot 1: the OK/FAIL legend runs vertically at card x
    32.3, y 7.9-17.5, just right of the lever's end, with its lamp BELOW it at (32.3, 21.5). 1.x drew
    the lamp above the legend at old x 31.0, which the re-envelope would have put under the new lever.
  size-ports: >-
    photo-measured, two photographs (#891). The XFP cages centre at card x 105.55, 181.7, 257.8 and
    333.8, a 76.1 mm pitch, y 18.85. The MX480 front photograph seats this card bare in slot 4 (card x =
    8.75 + (px - 155) / 3.230, plate top at y px 399.5, 3.206 down): the four dark openings run x
    96.4-114.9, 172.5-191.1, 248.4-267.3 and 324.5-343.1, centres 105.65/181.82/257.82/333.83, y
    13.6-24.0. The MX240 photograph seats it with dust covers (card x = px / 3.372 from the envelope's
    left end at px 98): covers 95.0-116.0 wide by 13.4-24.4, centres 105.45/181.6/257.8/333.8. Drawn at
    the mean, the registry xfp opening centred there. Until 3.0.0 the ports sat at x 95.5-263.8 on a
    53.4 pitch, y 13.9, carried from 1.x's dust-cover reading, which neither photograph bears out.
  port-lamps: >-
    photo-measured - each port's TUNNEL and LINK lamps sit side by side LEFT of its cage, not stacked
    as 2.x drew them. MX240 lamp centres (dark discs about 3.3 mm across): 83.66/88.77,
    159.85/164.89, 236.03/241.08, 312.14/317.26, y 20.3 - each pair 21.8 and 16.75 left of its cage
    centre. The MX480 photograph puts the last two pairs at 236.73/241.56 and 311.90/316.81, y 20.2-20.4,
    which agrees to 0.7 mm. Drawn at the MX240 values, r 1.5.
  port-legends: >-
    photo-measured - the MX240 photograph prints the legends vertically, reading upward: PORT n/0 at
    25.05 left of its cage centre from y 22.6 up to about 10.2, and TUNNEL and LINK each directly above
    its lamp from y 17.9 up (to about 7.1 and 12.0). Set at 2.6 mm, the size the printed lengths give
    (PORT 0/0 12.4 mm, TUNNEL 10.8, LINK 5.9). The MX480's later DPC 4x10GE prints 0/0 rather than
    PORT 0/0 on the same layout; this card is the MX240's.
