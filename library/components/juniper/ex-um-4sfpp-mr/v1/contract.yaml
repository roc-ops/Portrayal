format: 1
kind: module
name: ex-um-4sfpp-mr
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper EX-UM-4SFPP-MR, the four-port 1/10 Gbps SFP+ uplink module of the EX4300-48MP switches. It slides
  into the uplink module slot below the status block at the right end of the front panel. It has four SFP+
  cages in one row, numbered 0 to 3. Each cage takes an SFP+ transceiver at 10 Gbps or an SFP transceiver at
  1 Gbps. Each port has a link activity lamp and a status lamp above its cage. Two captive screws hold it
  and a handle along the bottom pulls it out.
attrs:
  model: EX-UM-4SFPP-MR
  sfp-plus: 4
  weight: 0.57 lb (0.26 kg)
  power-absent: not-published
  ports-note: four SFP+ ports, each at 10 Gbps with SFP+ or 1 Gbps with SFP; the ports cannot be Virtual Chassis ports
provenance:
  sources: >-
    datasheet - EX4300 Switch Hardware Guide (Juniper Networks, published 2025-08-12), Uplink Modules in
    EX4300 Switches, Table 14 (PDF pages 75 to 76): four SFP+ transceivers, four SFP transceivers or a mix,
    and the ports "cannot" be configured as Virtual Chassis ports. Table 17 (PDF page 81) holds Figure 25
    (g022454, the face drawn flat with the lamps, screws and handle numbered; the guide draws no
    three-quarter view of this module). Figure 37 (PDF page 90) shows the lamps. The datasheet ordering table
    (PDF page 16) lists EX-UM-4SFPP-MR for the EX4300-48MP.
  size: >-
    photo-measured - it fills the EX4300-48MP's uplink slot, 66.6 x 24.5 mm, which Juniper's straight-on studio
    photograph of the EX4300-48MP front shows covered (juniper/ex4300-48mp-uplink-blank@1 carries the method).
    Figure 25's outline is 743 x 280 px at 400 dpi, an aspect of 2.65 against the slot's 2.72. The guide gives
    no module size. The depth is not stated.
  elements: >-
    drawing - Figure 25 is a flat elevation, read as fractions of its outline at 11.16 px per mm and applied to
    66.6 x 24.5 mm. Four cages at the SFF-8433 pitch of 14.25 mm, a block centred on the plate (4.8 mm in), 7.4
    mm down. Two round lamps above each cage, 4.5 mm down, at 4.0 and 10.5 mm from its left edge (link
    activity at the left, status at the right, callouts 2 and 3). The numbers 0 to 3 print under the cages. A
    slotted captive screw at each upper end, placed as juniper/ex4300-48mp-uplink-blank@1 places them. A handle
    bar along the bottom, 10.6 to 56.1 mm across, 2.3 mm high. The row of hexagonal vents along the top edge
    and the two side notches are not drawn.
  colour: >-
    estimated - no photograph of this module is held. The plate takes the grey of the fitted EX-UM-4X4SFP in
    the EX4300-24T photograph (#888c92), the nearest held evidence of this family's faceplate; the handle is
    drawn light grey because no held document shows its colour.
  led: >-
    datasheet - guide Figure 25 callouts 2 and 3 and Figure 37: a link activity lamp and a status lamp for each
    port.
  weight: >-
    datasheet - guide, Chassis Physical Specifications, PDF page 64: "4-port 1-Gigabit Ethernet SFP/10-Gigabit
    Ethernet SFP+ uplink module ... 0.57 lb (0.26 kg)".
  power: >-
    not published - searched the guide's power budget tables (Tables 32 to 36) and the datasheet for a
    figure for any uplink module and found none, so the module declares power-absent.
states:
- ok
- fail
- absent
