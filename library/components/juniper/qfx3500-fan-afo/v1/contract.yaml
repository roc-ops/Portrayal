    - {name: amber, color: '#f5a623'}
    - 'off'
  handle:
    at: [2.0, 33.0]
    size: [34.0, 4.5]
    class: latch
size:
  w: 87.3
  h: 40.6
size-confidence: {w: drawing, h: drawing}
