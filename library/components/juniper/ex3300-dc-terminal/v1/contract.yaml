format: 1
kind: component
name: ex3300-dc-terminal
version: 1.0.0
class: inlet
behaviour: mounts
profile: networking
description: >-
  Four-pole DC barrier terminal block on the rear panel of the Juniper EX3300-24T-DC, the built-in DC
  power supply's input. The four terminals are labelled A+, B+, A- and B- and take ring lugs on 14 AWG
  wire. A clear plastic cover over them is lifted off to land the lugs. A+ and A- take one DC source
  and B+ and B- a second.
size: {w: 30.5, h: 17.8, d: 12.0}
size-confidence: {w: estimated, h: estimated, d: estimated}
attrs: {media: dc-terminal}
provenance:
  size: >-
    estimated - read off the vector drawing of the guide's Figure 4 (rear panel with a DC power supply,
    page 27), which is flat. The rear figure is scaled so that its face is 444.5 mm wide, 0.735 pt/mm,
    and then the terminal block measures 30.5 mm across and 17.8 mm from the top edge of its screws
    to the foot of the cover. The face height reads 43.4 mm against the table's 44.5, so the vertical
    figures are good to about 3 percent. The guide gives no dimension for the block.
  poles: >-
    drawing - Figure 4 shows four screwed terminals on an even pitch, read as 7.1 mm. The guide's DC
    power connection topic says the four terminals are labelled A+, B+, A- and B- and that a clear
    plastic cover protects them (Figure 36). The legends are not legible in Figure 4 and the order in
    which they run is not stated, so none is printed here
  depth: >-
    estimated. The drawing is a front view; 12.0 is what the relief builds, not a figure from any source
