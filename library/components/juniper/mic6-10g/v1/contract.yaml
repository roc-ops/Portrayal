name: mic6-10g
version: 1.1.2
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MIC6 24-port SFP+ (10GbE; the OTN variant shares the faceplate). MIC6 seats only in the MX2000 MPC6E, so only the vertical author exists.
attrs:
  model: MIC6-10G
  model-variants: MIC6-10G-OTN
  power-draw-max-w: 74
provenance:
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU table - MX2008 guide FRU power table: 10-Gigabit Ethernet MIC with SFP+, MIC6-10G = 74W; with optics, 53 W at 55 C, 40 C and 25 C with 10GBASE-SR or 10GBASE-LR, 66 W with 10GBASE-ER, 74 W with 10GBASE-ZR.
    THE BARE FIGURE IS CARRIED - the MIC alone - and it is unqualified by ambient. The with-optics
    figures do not ladder by temperature at all: each optic type is flat across 55 C, 40 C and 25 C,
    and the worst of them, ZR at 74 W, equals the bare figure.
    NOT MIC6-10G-OTN, which is 84 W in the same table. That part number EXTENDS this one, so a
    prefix match takes the wrong row and reads 13 percent high.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
