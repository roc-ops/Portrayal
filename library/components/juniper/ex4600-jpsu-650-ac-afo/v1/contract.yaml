format: 1
kind: module
name: ex4600-jpsu-650-ac-afo
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper JPSU-650W-AC-AFO, a 650 W AC power supply with port-to-FRU airflow (AFO), which the guide
  also calls front-to-back. It is a field-replaceable unit, hot-removable and hot-insertable while
  the second supply runs. The EX4600 hardware guide lists it for the EX4600-40F-AFO. The EX4600 seats
  two, in slots 0 and 1 at the right of the rear. The same supply is used in the QFX5100 switches.
  The face has three lamps labelled AC, DC and !. It also has an orange handle with the label AFO, a
  C14 appliance inlet turned on its side and a black ejector lever. Never mix it with AFI supplies,
  DC supplies or AIR IN fan modules.
attrs:
  role: ac-power-supply
  power-output-w: 650
  airflow: front-to-back
  input: 100 to 240 VAC, 50 to 60 Hz (guide Table 16)
part-numbers:
  JPSU-650W-AC-AFO (EX4600): {part: JPSU-650W-AC-AFO}
provenance:
  sources: >-
    datasheet - EX4600 Switch Hardware Guide (published 2025-08-12): AC Power Supply in an EX4600
    Switch, Table 14 (JPSU-650W-AC-AFO, port-to-FRU airflow, orange handle), Figure 21 (an isometric
    drawing), Figure 23 and Table 15 (the lamps) and Table 16 (the AC power figures). EX4600 Ethernet
    Switch Datasheet (1000511-016-EN, Sep 2021), ordering table: JPSU-650W-AC-AFO, AC 650 W PSU,
    front-to-back airflow. The key of part-numbers carries the suffix (EX4600) so that its DCIM
    module type does not share a file with the same part number in another line's slice.
  size: >-
    photo-measured - the back-to-front AC supply in Juniper's EX4600 rear studio photograph
    (ex4600-rear-high.jpg, 1500 x 151 px), whose whole body measures 1454 x 145 px, an aspect of
    10.03 against 10.09 (0.6 percent out), read at 3.298 px/mm across and 3.318 down. The supply's
    dark face runs from 1062.5 to 1243 px: 54.7 mm. The slot opening is 5.5 to 144 px, 41.7 mm, and
    the face fills it less a frame; 40.5 mm is written, which is the height Figure 25 (the DC
    faceplate drawn flat, aspect 1.35 at 54.7 mm wide) gives for the same slot. This unit is not
    photographed: it takes the size of the AFI supply, since the guide draws one supply and both fit
    one slot. juniper/jpsu-650w-ac-ao@1 measures 54.6 x 40.2 on a QFX5120 photograph.
  depth: >-
    estimated - not stated. Searched the EX4600 guide for the supply's dimensions and weight: Figure
    21 is an isometric drawing with no scale and no table gives a size. No depth is written.
  face: >-
    photo-measured - the AFI supply in the rear photograph, read at 23.1 px/mm: a vent field of three
    columns of two black cells at the left, three lamps in a column with the legends AC, DC and ! to
    their right, a vertical handle strip carrying the label AFI, the C14 inlet turned on its side,
    and the ejector lever at the lower right. The unit is drawn with the label AFO. The sticker with
    the serial number and its bar code, and the cord retainer wire, are not drawn: the first is a
    label and the second is cable furniture. The inlet placement is that of the QFX5100 supply (32.4,
    7.4, turned 270) moved left 5.9 mm and down 4.2 mm, to centre it at 40.5 mm across and 21.6 mm
    down as the photograph shows; the QFX5100 placement overran this 54.7 mm face.
  drawing-vs-photo: >-
    photo-measured - the guide's Table 14 gives the handle of this supply as orange, and of the AFI
    supply as blue ("either a power supply has the label AFI or a blue handle"). The photograph shows
    the AFI supply with a dark handle strip carrying the white label AFI and no blue. The table is
    followed and the label is drawn too; a dark handle with a label is also a shipped build. The
    colour is the field handle-finish.
  handle: >-
    estimated - the orange is that of juniper/qfx5110-fanafo@1, sampled from a Juniper photograph of a
    different switch, because no photograph of an orange EX4600 supply is held.
  power-output-w: >-
    datasheet - guide, AC Power Supply in an EX4600 Switch: the AC power supply is 650 W. An OUTPUT,
    since a supply provides power.
  leds: >-
    datasheet - guide, Table 15: AC OK is green when power comes into the supply, DC OK is green when
    it sends power out correctly, and the Fault lamp is amber on an error; each is unlit otherwise.
  airflow: >-
    datasheet - guide, Table 14: JPSU-650W-AC-AFO is port-to-FRU airflow with an orange handle. The
    datasheet calls it front-to-back.
states:
- ok
- fault
- absent
