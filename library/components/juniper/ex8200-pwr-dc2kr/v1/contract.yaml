format: 1
kind: module
name: ex8200-pwr-dc2kr
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper EX8200-PWR-DC2KR, the 2000 W DC power supply of the EX8208, with two redundant inputs (A and B) at -48 V.
  It delivers 2000 W at 52 VDC and works from one input alone. The face has two pairs of DC input terminals
  (studs for a lug), an ENABLE switch, the FAIL, OUT OK, A IN OK and B IN OK lamps, a vent field, a handle and a
  captive screw. Up to six fit an EX8208, in slots PSU 0 to PSU 5. Each has its own fan and is hot-insertable and
  hot-removable. Never mix them with AC supplies. Each input needs a dedicated 60 A circuit breaker.
attrs:
  role: dc-power-supply
  power-output-w: 2000
  airflow: front-to-back
  inlet: dc-terminal
  input: -40 to -72 VDC (nominal -48 VDC), 50 A maximum per input at nominal; output 52 VDC; 100 A internal fuse
part-numbers:
  EX8200-PWR-DC2KR: {part: EX8200-PWR-DC2KR}
provenance:
  sources: >-
    datasheet - EX8208 Switch Hardware Guide (PDF dated 2020-12-16): DC Power Supply Description and Figures 13 and
    14 (isometric), Table 31 (the lamps) and Table 33 (the electrical figures). EX8208 Ethernet Switch Datasheet
    (1000261-022-EN, June 2015): "EX8200-PWR-DC2KR, DC power supply with dual redundant inputs, 2000 W at -48V,
    redundant". The guide's CLI name is EX8200-DC2K; the datasheet's is carried.
  size: >-
    estimated - the supply slot, 70.1 x 104.0 mm (Figure 3 of the EX8208 guide); the same slot as the AC supplies,
    which share the bay. The guide dimensions no supply.
  face: >-
    estimated - the guide draws the DC supply only in two isometric figures (13 and 14) and no flat face, and
    Figure 3 shows only the AC supplies installed, so every position here is a fraction read off an angled view and
    is good to about 3 mm. The vent field, switch, handle and captive screw follow the AC supply's flat face, since
    the isometric shows the same arrangement; the four lamps are put in the order the guide lists them (FAIL, OUT
    OK, A IN OK, B IN OK), which no figure resolves; the two terminal pairs are drawn at the right edge as in
    Figure 13, without polarity (the guide's text names no polarity legend).
  power-output-w: >-
    datasheet - guide Tables 4 and 33: 2000 W output at 52 VDC. An OUTPUT, since a supply provides power.
  leds: >-
    datasheet - guide Table 31: A IN OK and B IN OK are green with the input in range (-40 to -72 VDC), yellow when
    the input is present but the fuse has tripped or the ORing diode is open, red when the polarity is reversed,
    unlit with no input; OUT OK is green in range and yellow when the system has disabled the supply; FAIL is yellow
    on steadily for a failed supply and blinking when demand exceeds the supply.
states:
- ok
- fault
- absent
elements:
  switch:
    at: [27.0, 8.0]
    size: [10.9, 15.0]
    class: switch
  led-fail:
    at: [16.0, 30.0]
    size: [2.0, 2.0]
    class: led
    states: ['off', {name: failed, color: '#eab308'}, {name: overloaded, color: '#eab308', behavior: blinking}]
  led-out-ok:
    at: [22.5, 30.0]
    size: [2.0, 2.0]
    class: led
    states: ['off', {name: ok, color: '#22c55e'}, {name: disabled, color: '#eab308'}]
  led-a-in-ok:
    at: [29.0, 30.0]
    size: [2.0, 2.0]
    class: led
    states: ['off', {name: ok, color: '#22c55e'}, {name: fuse, color: '#eab308'}, {name: reversed, color: '#ef4444'}]
  led-b-in-ok:
    at: [35.5, 30.0]
    size: [2.0, 2.0]
    class: led
    states: ['off', {name: ok, color: '#22c55e'}, {name: fuse, color: '#eab308'}, {name: reversed, color: '#ef4444'}]
  handle:
    at: [8.0, 94.5]
    size: [22.0, 6.0]
    class: latch
  screw:
    at: [44.0, 89.7]
    size: [5.2, 5.2]
    class: screw
size:
  w: 70.1
  h: 104.0
size-confidence: {w: estimated, h: estimated}
skins: [default]
