    - {name: blinking-green, color: '#39b54a', behavior: blinking}
    - 'off'
  handle:
    at: [0.3, 17.9]
    size: [43.3, 5.4]
    class: handle
  latch:
    at: [73.1, 10.4]
    size: [3.6, 18.1]
    class: latch
size:
  w: 83.06
