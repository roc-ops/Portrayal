format: 1
kind: module
name: jpsu-550-c-ac-afo
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper JPSU-550-C-AC-AFO, the 550 W AC power supply of the EX4400 switches,
  front-to-back airflow (AFO). The guide takes it for the EX4400-24T, -24X,
  -48T and -48F. Up to two fit in the rear slots 0 and 1, and a second unit
  gives 1+1 redundancy. The face has the supply fan with a gold handle across
  it, an OUT.OK lamp, a C13-type AC inlet and an ejector lever. Do not mix AC
  and DC supplies, or supplies with different airflow, in one chassis.
attrs:
  role: ac-power-supply
  power-output-w: 550
  airflow: front-to-back
  input-voltage: 100-127 VAC low line, 200-240 VAC high line
  input-frequency: 47-63 Hz
  input-current: 7.1 A at low line, 3.4 A at high line
  efficiency: 80 Plus Platinum
  weight-kg: 0.8
  hot-swap: 'yes'
part-numbers:
  JPSU-550-C-AC-AFO: {part: JPSU-550-C-AC-AFO}
provenance:
  sources: >-
    datasheet - EX4400 Switch Hardware Guide (Juniper Networks, PDF created 2026-07-22). Topic AC
    Power Supply in EX4400 Switches. Figure 80 (g022574) draws this unit. Table 53 gives the
    model numbers and the inlet, Table 54 the electrical specification, Table 58 the airflow and
    Table 114 the CLI name. The EX4400-24T, -24X, -48T and -48F take the 550 W unit. The guide
    says the 24P, 24MP, 48P and 48MP take the 1050 and 1600 W units and the 48XP and 48MXP the
    2000 W unit.
  size: >-
    datasheet - Table 40, Physical Specifications of the EX4400 PSUs - width 3.27 in (8.3 cm),
    height 1.59 in (4.04 cm), depth 8.88 in (22.56 cm) for the AC and DC units. The 550 W VDC
    unit is 9.48 in (24 cm) deep. Carried as 83.06 x 40.39 x 225.55 mm. The rear render of Figure
    9 shows the face 83.3 wide by 41.2 tall at 3.92 and 3.86 px/mm, within the stretch between
    the figure's axes.
  depth: >-
    datasheet - Table 40, depth 8.88 in (22.56 cm), carried as 225.55 mm.
  power-output-w: >-
    datasheet - Table 54, 550-W AC power supplies - output power 550 W. An output figure,
    because a power supply provides power. The guide gives no draw or loss figure for the unit.
  inlet: >-
    datasheet - Table 53 prints the inlet type of the 550 W unit as IEC-320-C13, and Table 59
    lists C13 cords for it. The coupler named is the cord's. The panel part is the appliance
    inlet that takes a C13 cord, std/c14-inlet@1, turned portrait as the render shows.
  elements: >-
    estimated - read off the rear render of the EX4400-24T (Figure 9, g022646, 2000 x 265 px,
    the chassis 441.7 mm across at 3.92 px/mm and 43.7 mm tall at 3.86 px/mm), as an offset from
    the left and top of the first supply. Fan centre 22.5, 20.7. Handle bar 17.9 to 23.3 down and
    0.3 to 43.6 across. Corner screws at 5.4 and 37.8 across and 4.2 and 37.3 down. Lamp at 45.6,
    8.4. Inlet centre 61.8, 17.1. Ejector lever 73.1 to 76.7 across. The community NetBox
    elevation of the EX4400-48F prints OUT on the fan hub; no maker figure shows it, so it is
    not drawn.
  airflow: >-
    datasheet - Table 58. JPSU-550-C-AC-AFO is front-to-back. Cold air enters through the vents
    on the front panel and hot air leaves through the vents on the rear panel.
  led: >-
    datasheet - Table 89 and Figure 87. One lamp, OUT.OK. Steady green means the supply receives
    input and gives proper output. Blinking green means the supply fan failed or its internal
    communication failed. Unlit means the cord is loose, the input is wrong, the supply is in
    standby, the ambient is too hot or the supply failed.
  relief: >-
    estimated - the handle stands proud of the fan in Figure 80. Its projection is not measured
    in any source. The value only makes it read as a handle in 3D.
  power: >-
    datasheet - see power-output-w. No source in the guide states a figure for what the unit
    itself draws.
states:
- ok
- fault
- absent
parts:
- {ref: std/c14-inlet@1, id: inlet, at: [47.8, 7.1], rotate: 90}
