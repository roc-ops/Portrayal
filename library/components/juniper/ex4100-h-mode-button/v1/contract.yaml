format: 1
kind: component
name: ex4100-h-mode-button
version: 1.0.0
class: button
profile: networking
description: >-
  The Factory Reset/Mode button of the Juniper EX4100-H switches, among the port mode lamps on the front panel: a round
  lime-green button in a dark ring. The guide says the button toggles the port mode lamps (SPD, DX, EN and POE) to show the
  speed, duplex, administrative status and PoE state of the network ports, and calls it the Factory Reset/Mode button (the
  EX4100-H-12MP's figure calls it the Mode button). The list symbol printed beside it is chassis silkscreen and is drawn on the
  device.
attrs:
  function: factory reset and port mode
provenance:
  sources: >-
    datasheet and photo-measured - EX4100-H Switch Hardware Guide (Juniper Networks, published 2026-10-01): Figures 1, 3 and 5
    (callouts 7, 15 and 14), Figures 19 and 20 and Table 20; Juniper's studio photographs of the three models, front.
  size: >-
    estimated - read off the guide's flat figures after Gate 1: the button's ring is 6.3 mm across on the EX4100-H-24MP
    (Figure 3, 6.568 px/mm against the 439.0 mm body) and 6.6 mm on the EX4100-H-12MP (Figure 1, 15.085 px/mm against
    111.7 mm). 6.4 is carried. No dimension is stated in any source.
  face: >-
    photo-measured - a flat disc, #98b639 in the photograph of the EX4100-H-12MP, in a darker ring. The disc stands a little
    proud of the face in the photographs; its projection is not measured.
size:
  w: 6.4
  h: 6.4
size-confidence: {w: estimated, h: estimated}
skins: [default]
