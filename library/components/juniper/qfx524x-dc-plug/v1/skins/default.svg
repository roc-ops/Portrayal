<svg xmlns="http://www.w3.org/2000/svg" width="32.6mm" height="27.7mm" viewBox="0 0 32.6 27.7">
  <!-- The cord connector of the QFX524X DC supply seen from the wire side, seated: the body at the connector's outline and
       one way for each of the six wires, drawn alike because the guide does not place a colour at a way. -->
  <rect id="body" x="0" y="0" width="32.6" height="27.7" rx="1.4" fill="#9aa0a6" stroke="#5b6066" stroke-width="0.3"/>
  <g id="ways" fill="#6f7378" stroke="#4a4d52" stroke-width="0.12">
    <circle cx="9.6" cy="7.2" r="2.4"/>
    <circle cx="18.1" cy="7.2" r="2.4"/>
    <circle cx="27.0" cy="7.2" r="2.4"/>
    <circle cx="9.6" cy="20.5" r="2.4"/>
    <circle cx="18.1" cy="20.5" r="2.4"/>
    <circle cx="27.0" cy="20.5" r="2.4"/>
  </g>
</svg>
