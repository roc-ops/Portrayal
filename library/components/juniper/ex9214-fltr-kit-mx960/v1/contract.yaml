format: 1
kind: module
name: ex9214-fltr-kit-mx960
version: 1.0.0
class: filter
behaviour: fills
profile: networking
description: >-
  Juniper air filter tray of the EX9214 (FLTR-KIT-MX960, printed FFILTER TRAY-MX960-HC on the tray). It slides in horizontally at
  the front, between the card cage and the lower fan tray. It filters the air that the lower fan tray draws in. The tray face is a
  dark bezel with a handle slot and the part name at its right.
part-numbers:
  FLTR-KIT-MX960-S: {part: FLTR-KIT-MX960-S}
attrs:
  airflow: front-to-back
provenance:
  part-numbers: >-
    datasheet - EX9200 Ethernet Switch Datasheet (1000432-022-EN, Aug 2022), ordering information: "FLTR-KIT-MX960-S EX9214 Air Filter, spare". The MX960 guide
    names FLTR-KIT-MX960 in its component table, and the EX9214 studio front photograph prints FFILTER TRAY-MX960-HC on the tray. The MX960 device on
    main draws no air filter, so none is reused.
  size: >-
    estimated - 423.4 x 31.8 mm, read off the EX9214 front photograph on a millimetre grid: the tray face runs from about 8 to 431 mm across and 554.5 to
    586.3 mm down. Table 7 gives the air filter 0.43 x 16.7 x 19.7 in, whose 16.7 in is its width.
  face: >-
    photo - EX9214 front photograph: a dark bezel with a long handle slot across the upper part, a pull latch at each end, a small grille mark at the left
    and the part name at the right in dim letters. Every place is estimated to 1.5 mm.
states: [absent]
size:
  w: 423.4
  h: 31.8
size-confidence: {w: estimated, h: estimated}
