format: 1
kind: module
name: mic-3d-8oc3oc12-4oc48-v
version: 1.3.1
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper SONET/SDH OC3/OC12 MIC with SFP (eight ports, four OC48-capable). Vertical author for the vertical carriers (MX960/MX2000 MPCs stand on end, and their MICs with them).
unplaced: >-
  SUPERSEDED by juniper/mic-3d-8oc3oc12-4oc48@2: the MX2000 carriers that took this rotated
  twin are retired in favour of the horizontal MPC seated in juniper/mx2000-lc-adapter@1,
  which takes the horizontal MIC (#261, part 2). Kept and deprecated rather than deleted, so a
  manifest that pins it still resolves (#448); nothing in this library seats it.
superseded-by: juniper/mic-3d-8oc3oc12-4oc48@2
attrs:
  oc12: 8
  model: MIC-3D-8OC3OC12-4OC48
  power-draw-max-w: 29
provenance:
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): on a card
    drawn on its side a pair sits left and right, the left cage 270 beside the right 90,
    so both cage lips face the band between the two cages and both bails face outward.
    Decided by the rule, not an observation, so a photograph of the stack overturns it:
    the 4 SFP pairs (port-0-1/port-0-0 to port-0-7/port-0-6). Turning a composed cage in
    place changes no box, id or anything a device places, so it is a minor bump (S6).
  sonet-rate: >-
    the SONET rate, transcribed from this contract's own description: 'SONET/SDH OC3/OC12
    MIC with SFP (eight ports, four OC48-capable)'. Without it the SFP cage has no rate to
    read and the export typed it Gigabit Ethernet, which an OC-12 port is not. Nothing new
    was measured. THE PORT'S RATED CAPABILITY, not the lowest mode it will run. This card
    does OC-3 too, and the model number says so - but an SFP+ cage that takes a 1G optic is
    typed 10G here for the same reason: `type` is what the port IS rated for. Where the
    model offers FEWER ports at a HIGHER rate ("N OC48-capable"), that is an alternative
    mode of the whole card and not a property of one cage, and the faceplate this draws is
    the other mode - so every cage on it carries the same rate.
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU power table, MX chassis guides: '| | 8-Port: MIC-3D-8OC3OC12-4OC48 | 8-Port: 29 Wat 131° F (55° C) 27.75 Wat 40° C 26.5 Wat'. The 55 C rung is
    carried, being the worst rated case a chassis budget has to survive.
    Taken by matching the row's OWN LABEL: these tables pair parts with figures
    in one row - `4-Port: X 8-Port: Y` against `4-Port: 41 W 8-Port: 52 W` - and
    reading first-wins puts the small card's number on the big one. Aligning on
    the N-Port label instead is self-checking, and it checks out: 4-port 41 W
    against 8-port 52 W, 4-port 24 W against 8-port 29 W.
    Seen in 8 guide(s): mx2008, mx2010-p0001-0300, mx2010-p0301-0600, mx2020-p0301-0600.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
