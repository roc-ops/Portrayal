  - {ref: common/terminal-screw-34@1, id: pole-a-neg, at: [38.6, 24.7]}
  - {ref: common/ground-screw@1, id: earth, at: [46.0, 23.6]}
  - {ref: common/terminal-screw-34@1, id: pole-b-neg, at: [55.5, 24.7]}
  - {ref: common/terminal-screw-34@1, id: pole-b-pos, at: [63.9, 24.7]}
dc:
  ports:
    - id: feed-a
      direction: input
      voltage: {nominal: -48, range: [-40.8, -60]}
      awg: [14, 16]
      poles:
        - {role: pos, slot: pole-a-pos}
        - {role: neg, slot: pole-a-neg}
      source: {poles: poles, voltage: voltage, awg: awg}
    - id: feed-b
      direction: input
      voltage: {nominal: -48, range: [-40.8, -60]}
      awg: [14, 16]
      poles:
        - {role: neg, slot: pole-b-neg}
        - {role: pos, slot: pole-b-pos}
      source: {poles: poles, voltage: voltage, awg: awg}
