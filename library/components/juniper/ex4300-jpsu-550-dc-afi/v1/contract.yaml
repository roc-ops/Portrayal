    - {name: red, color: '#ef4444'}
    - 'off'
  latch:
    at: [12.6, 2.0]
    size: [6.5, 38.0]
    class: latch
  terminal-block:
    at: [26.1, 19.6]
    size: [44.0, 17.2]
    class: terminal
size:
  w: 84.0
  h: 42.0
