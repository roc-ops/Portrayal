name: qfx5130-32cd-fan-afo
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  QFX5220-32CD-FANAO, the field-replaceable fan module of the QFX5130-32CD with front-to-back airflow (AIR
  OUT, port-to-FRU). Cold air comes in at the port side and hot air leaves at the back. It is marked AIR OUT
  on a grey chip on its Juniper gold handle. It is hot-removable and hot-insertable. The QFX5130-32CD takes
  six, in slots 0 to 5 from left to right, and runs on five (5+1). The back-to-front sibling is
  QFX5220-32CD-FANAI. The two are never mixed in one chassis, and never with supplies of the other
  direction. The guide's Table 3 and the datasheet name it QFX5220-32CD-FANAO; its Table 17 names the same
  module QFX5130-32CD-FANAO (and QFX5130E-32CD-FANAO for the E model, which is not modelled here).
  The status lamp is on the chassis strip beside each slot, not on the module.
attrs:
  model: QFX5220-32CD-FANAO
  airflow: front-to-back
  power-absent: not-published
provenance:
  size: >-
    photo-measured - the Juniper studio rear photograph of the QFX5130-32CD (2100 x 432 px; the body is
    1857 px wide, which is the guide's 17.26 in at 4.236 px/mm): the orange face measures 174 px by 176 px,
    41.1 by 41.5 mm, on a 207.4 px pitch, 48.96 mm. No document states the module's size in millimetres:
    the guide's figure 33 is an isometric drawing with no scale and its tables give no dimensions.
  depth: >-
    not stated. Searched the QFX5130 hardware guide (figure 33, the fan sections and the physical
    specifications) and the datasheet for the module's depth: the figure is an isometric with no scale. No
    depth is written rather than a guessed one.
  face: >-
    photo and drawing - the guide's figure 33 and the studio photograph agree on what is on it: a captive
    screw at the top left, a hex grille above and another below an hourglass handle band, a grey AIR OUT
    chip with a fan symbol on the band, and a ribbon clip at each end of the band. Positions are read off
    the photograph at 6 x zoom and are estimated to about 0.3 mm; the colour is the photograph's orange,
    sampled.
  airflow: >-
    datasheet - guide Table 17 and the cooling-system text: the AIR OUT fan is front-to-back with a Juniper
    gold handle, the AIR IN fan back-to-front with a Juniper azure blue handle. The photograph shows the
    AIR OUT module. No photograph of the AIR IN module is held: its blue is the colour the QFX5110 fan
    component uses and is estimated.
  power: >-
    not published. Searched the QFX5130 hardware guide and datasheet near the cooling sections and the
    power tables: only whole-switch figures exist (Tables 19, 26). The module declares power-absent so the
    missing figure is a statement and not a silence.
