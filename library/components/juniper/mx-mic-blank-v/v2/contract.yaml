format: 1
kind: module
name: mx-mic-blank-v
version: 2.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Juniper MIC slot blank cover (vertical window).
provenance:
  states: >-
    NO LAMP AND NO HEALTH ON A FILLER PANEL. A slot cover is a piece of sheet metal
    that fills an opening: it has no indicator to light and no condition to report,
    so `ok` was a state the viewer generated CSS for, offered as a control, and could
    never show - this part draws no elements at all. `absent` stays, because an empty
    slot is a real thing to draw. See roc-ops/Portrayal#269.
  size: >-
    borrowed - the MIC plate, 168.8 x 29.2, drawn turned: the figure juniper/mx-mic-blank@2 states for
    the same blank, photo-measured off the MX104 and MX80 front photographs.
  layout: >-
    estimated - RE-ENVELOPED, NOT REDRAWN, at 2.0.0 (#261): the stiffener moved by (+1.1, +0.4) onto
    the plate. What 1.x said of it: registry + layout - the MIC window geometry.
states: [absent]
size:
  w: 29.2
  h: 168.8
size-confidence: {w: borrowed, h: borrowed}
size-notes: >-
  w and h are the MIC form's plate, borrowed from the same blank's horizontal major, juniper/mx-mic-blank@2,
  which states it (#261): 168.8 x 29.2, photo-measured off square-on MX104 and MX80 front photographs, drawn
  here turned. This model was not photographed. The guides call every MIC one 1.25 x 6.25 x 6.8 in
  part, but their rows do not dimension the face (the axes are assigned differently in different
  books and the figures are rounded to a tenth of an inch), so the figure is the MIC form's and not
  this model's own. Until 2.0.0 this was the 27.0 x 168.0 'window', an estimate read off the carrier.
