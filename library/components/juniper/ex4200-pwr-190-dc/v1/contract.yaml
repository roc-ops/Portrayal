format: 1
kind: module
name: ex4200-pwr-190-dc
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper EX-PWR-190-DC, the 190 W DC power supply of the EX4200-24T-DC, -48T-DC and -24F-DC. It
  seats in power supply slot 0 or 1 at the rear and sits flush with the chassis. It has dual input
  feeds on a four-terminal block labelled A+, B+, A- and B-, shipped with a jumper from A+ to B+
  and another from A- to B-, two lamps (LED A and LED B), a locking lever at the left, a
  honeycomb fan exhaust and a handle running across the faceplate. It gives no PoE power.
attrs:
  part-number: EX-PWR-190-DC
  role: dc-power-supply
  inlet: dc-terminal
  power-output-w: 190
  input-voltage: 36-72 VDC, dual feed
  input-current: 7 A maximum
  weight-kg: 1.1
  depth-beyond-chassis-mm: 0
part-numbers:
  EX-PWR-190-DC: {part: EX-PWR-190-DC}
provenance:
  part-number: >-
    datasheet - EX4200 Ethernet Switch datasheet (Juniper Networks, 1000215-026-EN, Feb 2019),
    ordering information, Power Supplies: EX-PWR-190-DC, "190 W DC Power Supply Unit (PSU)"
  power-output-w: >-
    datasheet - EX4200 Switch Hardware Guide (published 2022-01-16), Table 13: power supply output
    190 W, DC input voltage 36 through 72 VDC, DC input current 7 A maximum, holdup 1 ms minimum.
    An output, because a supply provides power
  weight: >-
    datasheet - guide Table 3: the 190 W DC supply weighs 2.5 lb (1.1 kg)
  depth: >-
    datasheet - guide Table 3: with a 190 W DC supply installed the chassis is 17 in (43.18 cm)
    deep, and the guide says the supply is flush with the chassis
  size: >-
    estimated - 90.0 x 41.5 mm, the slot width and height read off the rear callout figure
    (Figure 4, g020084; 1.271 px per mm across, 5 percent foreshortened vertically). The guide
    gives no supply dimension
  terminals: >-
    datasheet - guide, DC Power Supplies and Figure 19 (g020202): four terminals labelled A+, B+,
    A- and B-; "The A+ and B+ terminals are referred to as +RTN and A- and B- terminals are
    referred to as -48 V". Drawn as four screw terminals on a block, A+ at the top, then B+, A-
    and B-; each is also a seat a lug lands on (see `seats`), and the drawing stays as it was
  face: >-
    drawing - guide Figure 19 (DC Power Supply, g020202): locking lever at the top left, two round
    lamps labelled LED-A and LED-B below it, a honeycomb exhaust, a diagonal handle and the terminal
    block at the right. The installation text says "The handle on the 190 W DC power supply runs
    across the faceplate", which the figure agrees with. No photograph is held, so its colour is
    estimated
  leds: >-
    datasheet - guide Table 11: both lamps green when inputs A and B are normal and the output is
    normal; both red when the inputs are normal and there is no output; a lamp flashes red when
    its input has failed; both off when there is no input
  power-draw: >-
    NOT APPLICABLE - a supply states its output
  seats: >-
    estimated - each of the four terminal screws is the library's common/terminal-screw-34@1, a
    slotted head 3.4 across (that part's own size is an estimate), standing at the centre of the
    terminal this skin already draws in its `terminals` group (the circles at 80.0 across and 8.0,
    17.0, 26.0 and 35.0 down, read off the guide's Figure 19, so good to about 1 mm). The seats are
    not lifted: no document says how far the screws stand off the block, and this contract draws no
    relief for them. The guide's wiring steps (printed page 148 onward) have the ring lug secured
    with "the screw from the terminals" and give a torque; no page gives the screw's thread or
    head, and the screw part claims no thread, so none is written. The drawn terminals stay as
    they are, and the screw marks where a lug lands, not the screw
  poles: >-
    Juniper EX4200 Switch Hardware Guide (published 2022-01-16), the note on the DC power supply
    (printed page 39) and Figure 19 "DC Power Supply" (printed page 40): four terminals labelled A+,
    B+, A- and B- from the top of the block, "for connecting DC power source cables labeled positive
    (+) and negative (-)"; and the wiring steps (printed pages 148 to 150) and Figure 45, which land
    the ring lug of a positive cable on a + terminal and of a negative cable on a - terminal. The
    supply ships with a jumper from A+ to B+ and another from A- to B-; the steps leave them in
    place for one power source and have them removed for two. The block carries two feeds, so it
    has one DC port per feed: `feed-a` on the A+ and A- screws and `feed-b` on the B+ and B-
    screws, the poles of each in the order the face prints them from the top. The jumpers are
    fitted at the factory and are not modelled: with them in place the two ports are one source,
    and a plant that wants two sources removes them. The roles are what the supply prints: `pos`
    for + and `neg` for -. The guide's note says the + terminals are "referred to as +RTN" and the
    - terminals "as -48 V" in its safety sections, but the face prints A+, B+, A- and B-, never
    RTN or -48 V, so the roles are not `rtn` and `batt`
  side: >-
    The face prints A and B on the two feeds' terminals (Figure 19, printed page 40), and the EX 3200
    and EX 4200 Switch Quick Start (Part 3, "To connect DC power to the switch") lands the first
    power source on A+ and A- and the second on B+ and B-. So `feed-a` is side a and `feed-b` is
    side b. The hardware guide's own two-source steps (printed page 149) name "the A+ terminal on
    the second DC power supply" for the second source's cables, which reads as a slip, and the
    quick start is followed
  voltage: >-
    NOT STATED. The guide's Table 13 (printed page 44) prints "36 through 72 VDC" and no nominal.
    A port states a nominal with any voltage, and a nominal is stated only where a held table
    prints one, so the ports state none. `attrs` keeps the range as printed
  rating: >-
    Juniper EX4200 Switch Hardware Guide, Table 13 "DC Power Supply Electrical Specifications"
    (printed page 44): "DC input current: 7 A maximum". One figure for the supply, so each port
    states it. The notes that recommend 7.5 A and a 10 A breaker (printed page 44) and a facility
    source of at least 8 A at -48 VDC (printed page 148) are advice for the source, not the
    supply's rating, and are not stated
  awg: >-
    Juniper EX4200 Switch Hardware Guide, the list of parts for "Connecting DC Power to an EX4200
    Switch" (printed page 146), and the EX 3200 and EX 4200 Switch Quick Start (Part 3): "DC power
    source cables (12-14 AWG) with ring lug (Molex 190700067 or equivalent)", not provided. One
    range of sizes for the cables that land on the block, so each port states both, 12 and 14
states:
- ok
- fault
- absent
