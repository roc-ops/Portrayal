format: 1
kind: component
name: ex4500-vc-legend
version: 1.0.0
class: marking
behaviour: mounts
profile: networking
description: >-
  The words VIRTUAL CHASSIS, printed under the model name on the front panel of three Juniper EX4500
  models: EX4500-40F-VC1-FB, -VC1-BF and -VC1-DC. These models support Data Center Bridging. The legend
  is part of the printed panel and not a separate part. It is a component only so that a configuration
  can show it where another does not.
size: {w: 19.5, h: 2.4}
size-confidence: {w: estimated, h: estimated}
provenance:
  existence: >-
    datasheet - EX4500 Switch Hardware Guide (modified 2017-10-18): "EX4500 switches that have the label
    VIRTUAL CHASSIS on the front panel support Data Center Bridging", Figure 5 (an enlarged view of the
    legend). The guide's own copyright and the Juniper EULA govern it; it is read for facts only and
    nothing of it is copied.
  size: >-
    estimated - Figure 5 shows the legend enlarged in a circle, at an unstated scale. Its width is read as
    1.75 times the width of the model name EX4500, which Figure 4 measures at 11.1 mm on the face, so 19.5
    mm; the height is the cap height of the lettering.
skins: [default]
