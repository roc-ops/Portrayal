    class: led
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  led-fault:
    at: [47.15, 16.65]
    size: [2.3, 2.3]
    class: led
    states:
    - {name: amber, color: '#f5a623'}
    - 'off'
  terminal-pos:
    at: [5.2, 21.6]
