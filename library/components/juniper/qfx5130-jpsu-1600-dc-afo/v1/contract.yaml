  terminal-neg:
    at: [19.7, 21.6]
    size: [8.8, 8.8]
    class: screw
  latch:
    at: [32.8, 1.6]
    size: [6.2, 37.2]
    class: latch
  release-latch:
    at: [47.6, 20.9]
    size: [7.3, 20.2]
    class: latch
