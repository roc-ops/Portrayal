format: 1
kind: module
name: ex3400-jpsu-600-ac-afo
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper JPSU-600-AC-AFO, the 600 W AC power supply for the EX3400-24P. It seats in power supply
  slot 0 or 1 at the rear. With one supply the switch offers 370 W for PoE, and with two supplies
  720 W. The face has a fan, an orange release latch, a C14 inlet and two lamps, DC OK and AC OK.
  Airflow is front to back, marked AIR OUT.
attrs:
  role: ac-power-supply
  power-output-w: 600
  input: 100 through 240 VAC, 50 or 60 Hz
  airflow: front-to-back
  weight-kg: 0.83
part-numbers:
  JPSU-600-AC-AFO: {part: JPSU-600-AC-AFO}
provenance:
  size: >-
    estimated - no photograph of the 600 W supply is held. Its face is drawn at the size and
    art of the 920 W supply that Juniper's EX3400-48P rear studio photograph shows (71.2 by
    39.0 mm at 3.327 px/mm). The guide gives no supply dimension, only the weight (Table 12), and no
    depth.
  power-output-w: >-
    datasheet - EX3400 Switch Hardware Guide (published 2026-01-09), Characteristics of a AC Power
    Supply, "EX3400 switches support 150 W, 600 W, 920 W AC power supply", and Table 12 names this
    unit JPSU-600-AC-AFO. Table 1 ships it with the EX3400-24P. An output, because a supply
    provides power.
  airflow: 'datasheet - Table 12: front-to-back, indicated by label AIR OUT.'
  leds: >-
    datasheet - Table 13 and Figure 13: AC OK is green when the supply receives proper input power;
    DC OK is green when the supply delivers power and red when it has failed.
  face: >-
    estimated - the art is the 920 W supply's, from the EX3400-48P rear photograph. Whether the
    600 W unit differs in print is not known. The cord retainer clip is a loose accessory and is
    not drawn. The inlet is std/c14-inlet@1.
states:
- ok
- fault
- absent
parts:
- {ref: std/c14-inlet@1, id: inlet, at: [38.0, 12.5]}
elements:
  led-dc:
    at: [41.9, 3.4]
    size: [2.2, 2.2]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: red, color: '#e03a2f'}
    - 'off'
  led-ac:
    at: [59.8, 3.4]
    size: [2.2, 2.2]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  latch:
    at: [29.5, 1.2]
    size: [9.8, 36.6]
    class: latch
size:
  w: 71.2
  h: 39.0
relief:
  features:
  - node: latch
    out: 1.6
    color: '#ee6a1f'
    confidence: estimated
    source: photo - the orange latch stands proud; projection not measured
size-confidence: {w: estimated, h: estimated}
skins: [default]
