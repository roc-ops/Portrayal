<svg xmlns="http://www.w3.org/2000/svg" width="12.0mm" height="36.6mm" viewBox="0 0 12.0 36.6">
  <!-- The QFX10002 DC supply's D-sub 3W3 connector seen from its mating face: the shell, three contacts and a hex standoff above
       and below. Shapes and colours are those the supply's own skin drew before it composed this part. -->
  <rect id="shell" x="0" y="3.3" width="12.0" height="27.0" rx="1.2" fill="#9ea1a4" stroke="#6b6e70" stroke-width="0.3"/>
  <path id="face" d="M 1.5 5.8 H 10.5 Q 11.1 5.8 11.1 6.4 V 27.2 Q 11.1 27.8 10.5 27.8 H 1.5 Q 0.9 27.8 0.9 27.2 V 6.4 Q 0.9 5.8 1.5 5.8 Z" fill="#2a2523"/>
  <circle id="contact-top" cx="6.0" cy="9.2" r="1.1" fill="#d4d6d8"/>
  <circle id="contact-middle" cx="6.0" cy="16.8" r="2.2" fill="#d4d6d8" stroke="#6b6e70" stroke-width="0.3"/>
  <circle id="contact-bottom" cx="6.0" cy="24.4" r="1.1" fill="#d4d6d8"/>
  <path id="standoff-top" d="M 6.0 0 l 1.6 0.9 v 1.8 l -1.6 0.9 l -1.6 -0.9 v -1.8 Z" fill="#b9bbbe" stroke="#6b6e70" stroke-width="0.3"/>
  <path id="standoff-bottom" d="M 6.0 33.0 l 1.6 0.9 v 1.8 l -1.6 0.9 l -1.6 -0.9 v -1.8 Z" fill="#b9bbbe" stroke="#6b6e70" stroke-width="0.3"/>
</svg>
