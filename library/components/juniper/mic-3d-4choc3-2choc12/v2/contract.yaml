format: 1
kind: module
name: mic-3d-4choc3-2choc12
version: 2.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper channelized SONET/SDH OC3/STM1 multirate MIC with SFP (four ports). MIC form: the MIC's own 168.8 x 29.2 plate, photo-measured (#261).
attrs:
  oc3: 4
  model: MIC-3D-4CHOC3-2CHOC12
  power-draw-max-w: 41
provenance:
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is
    the upper cage upright (rotate 0) over the lower turned 180, so both cage lips face
    the band between the two cages and both bails face outward. Decided by the rule, not
    an observation, so a photograph of the stack overturns it: the 2 SFP pairs
    (port-0-0/port-0-1 and port-0-2/port-0-3). 2 of these were drawn with the upper cage
    turned before the std cage art moved its lip to the bottom of the opening; turning
    them keeps the lips in the middle band where they were drawn and seats every optic
    bail-outward. Turning a composed cage in place changes no box, id or anything a
    device places, so it is a minor bump (S6).
  sonet-rate: >-
    the SONET rate, transcribed from this contract's own description: 'channelized SONET/SDH
    OC3/STM1 multirate MIC with SFP (four ports)'. Without it the SFP cage has no rate to
    read and the export typed it Gigabit Ethernet, which an OC-3 port is not. Nothing new
    was measured.
  size: >-
    photo-measured - the MIC plate, 168.8 x 29.2, from the MX104 and MX80 front photographs as
    size-notes says: plates 520, 521 and 520.5 px at 3.090 px/mm on the MX104 (body 1350.5 px over 437.0
    mm; the ganged-SFP pitch reads 44.0 to 44.2 px, 3.091), 521.8 and 522.5 px at 3.088 on the MX80
    (ganged-SFP pitch 44.0 px; 1374 px between the ear wings over 445.0 mm agrees); heights 90 to 90.75
    px.
  power: >-
    guide FRU power table, MX chassis guides: '| Channelized SONET/SDH OC3/ STM1 (Multi-Rate) MICs with SFP | 4-Port: MIC-3D-4CHOC3-2CHOC12 | 4-Port: 41 Wat 131° F ('. The 55 C rung is
    carried, being the worst rated case a chassis budget has to survive.
    Taken by matching the row's OWN LABEL: these tables pair parts with figures
    in one row - `4-Port: X 8-Port: Y` against `4-Port: 41 W 8-Port: 52 W` - and
    reading first-wins puts the small card's number on the big one. Aligning on
    the N-Port label instead is self-checking, and it checks out: 4-port 41 W
    against 8-port 52 W, 4-port 24 W against 8-port 29 W.
    Seen in 9 guide(s): mx2008, mx2010-p0001-0300, mx2010-p0301-0600, mx2020-p0001-0300.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
  layout: >-
    estimated - RE-ENVELOPED, NOT REDRAWN, at 2.0.0 (#261): every part and printed mark of the 1.x art
    moved by (+0.4, +1.1) onto the measured plate (centring the old art where its width allows);
    positions along the plate stay as 1.x had them. What 1.x said of them: registry + layout - the face
    is the slot geometry of its chassis family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate drawing. No faceplate figure was
    usable for this model
states:
- ok
- fail
- absent
parts:
- {ref: std/sfp-ganged@1, id: port-0-0, at: [16.40, 4.70], attrs: {media: sfp}}
- {ref: std/sfp-ganged@1, id: port-0-1, at: [16.40, 16.30], rotate: 180, attrs: {media: sfp}}
- {ref: std/sfp-ganged@1, id: port-0-2, at: [30.65, 4.70], attrs: {media: sfp}}
- {ref: std/sfp-ganged@1, id: port-0-3, at: [30.65, 16.30], rotate: 180, attrs: {media: sfp}}
size:
  w: 168.8
  h: 29.2
size-confidence: {w: photo-measured, h: photo-measured}
size-notes: >-
  w and h are the MIC's own plate, photo-measured (#261). Square-on front photographs of the MX104 and
  the MX80 put four plates at 168.3 to 169.2 by 29.1 to 29.3 mm, each photograph scaled two
  independent ways - across its chassis body and on the SFF-8433 ganged-SFP pitch of 14.25 mm, which
  agree to 0.1% - and the MX2010 photograph's ratio of MIC to MPC plate (162.5 to 379.5 px) agrees.
  The guides' MIC rows (6.25 x 6.8 x 1.25 in, the axes assigned differently in different books) do not
  dimension the face and are not used. Until 2.0.0 (juniper/mic-3d-4choc3-2choc12@1, kept as a deprecated major superseded by this one) this was the 168 x 27 'window', an estimate read
  off the carrier.
