    role: indicator
    index-origin: 0
    description: >-
      Four lamps for each port, above the upper cage and below the lower cage. The first shows a 40
      GbE link and all four show the links of a 4 x 10 GbE breakout (guide Table 7).
  status:
    term: LED
    role: indicator
    index-origin: 0
    description: the ST lamp of the module (guide Table 10)
