format: 1
kind: module
name: ex4600-em-4q
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper QFX-EM-4Q, the expansion module that adds four QSFP+ ports to an EX4600 switch. The EX4600
  hardware guide lists it with the EX4600-EM-8F for the two module bays at the right of the port
  panel. The module has four QSFP+ cages in two columns and two rows, numbered 0 to 3 with 0 and 1 in
  the left column. Each port runs at 40 GbE or, with a breakout cable, as four 10 GbE ports. Each
  port has four lamps, and one ST lamp shows the module. It is hot-insertable and hot-removable. The
  same module is used in the QFX5100 switches. The guide says the EX4600 is configured for this
  module by default.
attrs:
  weight-note: not published
  qsfp-plus: 4
  ports-note: four QSFP+ ports at 40 Gbps, each channelizable as 4 x 10 Gbps
part-numbers:
  QFX-EM-4Q (EX4600): {part: QFX-EM-4Q}
provenance:
  sources: >-
    datasheet - EX4600 Switch Hardware Guide (published 2025-08-12): Expansion Modules for the
    EX4600, the QFX-EM-4Q topic with Figure 16 (the faceplate, drawn flat) and Table 10 (the ST
    lamp); Figure 7 (the module). EX4600 Ethernet Switch Datasheet (1000511-016-EN, Sep 2021),
    ordering table: QFX-EM-4Q, 4-port QSFP+ expansion module for the EX4600. The guide gives no size
    and no weight for the module. The key of part-numbers carries the suffix (EX4600) so that its
    DCIM module type does not share a file with the same part number in another line's slice, such
    as the QFX5100-24Q.
  size: >-
    photo-measured - the module bays are the EX4600-EM-8F's: 86.7 x 43.2 mm, measured on Juniper's
    EX4600 front studio photograph (ex4600-front-high.jpg, 1500 x 163 px) with two EX4600-EM-8F
    modules in the bays. This module is not photographed; the two modules fill the same bay, so it
    takes the same size. Figure 16's outline is 342 x 177 px, an aspect of 1.93 against the bay's
    2.01 (3.9 percent out), so the figure gives fractions only.
  depth: >-
    estimated - not stated. Searched the EX4600 guide for the module's dimensions and weight: Figures
    7 and 16 carry no scale and no table gives a size. No depth is written.
  elements: >-
    estimated - Figure 16 read as fractions of its outline and applied to 86.7 x 43.2 mm: the left
    column of cages centred at 0.335 of the width and the right column at 0.665, the rows centred at
    0.35 and 0.65 of the height, a row of four lamps above the upper cages and another below the lower
    ones, and the numerals 0 to 3 left of each row of lamps. The cage rows are then the chassis
    QSFP+ rows (14.9 and 29.2 mm) taken from the photograph. The two top thumbscrews, the two lower
    latch screws, the pull bar along the top and the ST lamp at the left are those of the
    EX4600-EM-8F in the photograph. The lamp pitch of 4.2 mm is the chassis QSFP+ lamp pitch.
  legend: >-
    drawing - Figure 16 prints QFX-EM-4Q at the lower right. The baseline is moved 2.7 mm down from
    the figure's, to 42.2 mm, to clear the lamps of port 3; the photograph of the EX4600-EM-8F
    prints its legend at that position.
  led: >-
    datasheet - guide, Table 10: the ST lamp is unlit when the module is offline or the chassis is
    off, and green when the module is online and normal. Each QSFP+ port has four lamps, as on the
    chassis (Table 7): the first is used for a 40 GbE link and all four for 10 GbE breakout links.
  power: >-
    estimated - not published. Searched the EX4600 guide and the datasheet for a per-module wattage:
    only whole-switch figures exist, so the missing-power warning stands.
states:
- ok
- fail
- absent
