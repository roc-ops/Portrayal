format: 1
kind: module
name: qfx5230-jnp-3000w-ac-afo
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  JNP-3000W-AC-AFO, a 3000 W AC power supply with front-to-back airflow (AIR OUT, port-to-FRU). It is a
  field-replaceable unit, hot-removable and hot-insertable, and load-shares with its twin; the QFX5230-64CD-AFO
  ships with two. The face carries a round fan guard with a Juniper gold handle across it, a C20 appliance
  inlet, a black release latch and one lamp marked PWR. The guide's AC power cords end in a C19 coupler
  (CBL-JNP-SG4C20-UCE and its country variants), so the inlet is the library's C20. The AIR IN sibling is
  JNP-2700W-AC-AFI, a 2700 W unit with a green handle. AC and DC supplies, and supplies of different airflow
  direction, are never mixed in one chassis.
attrs:
  model: JNP-3000W-AC-AFO
  role: ac-power-supply
  power-output-w: 3000
  airflow: front-to-back
  input: 180 to 305 VAC, 50 to 60 Hz (guide Table 4); output 12 V at 250 A and 12 V standby at 1 A
provenance:
  size: >-
    photo-measured - the Juniper studio rear photograph of the QFX5230-64CD (2100 x 765 px, the body 1829 px
    wide, which is the guide's 17.4 in at 4.138 px/mm): the first supply measures 74.8 mm across and 40.2 mm
    high, the second 74.8 by 40.5; the pitch is 41.7 mm. No document gives the supply's size in millimetres; the
    guide's figures 20 and 21 carry no scale.
  depth: >-
    not stated. Searched the QFX5230-64CD hardware guide (figures 20 and 21, the AC power supply description and
    the physical specifications) for the supply's depth or weight. Figure 20 is an isometric with no scale. No
    depth is written.
  face: >-
    photo and drawing - the studio rear photograph at 2.6 times zoom and the guide's figure 21, which is a flat
    view of the same face and agrees with it: a round fan guard with a cross of wires and a screw at each corner
    of its plate, a handle bar across the guard, the inlet block, a release latch at the right edge, one lamp
    and the legend PWR. Positions are read off the photograph and estimated to about 0.4 mm. The rating label
    printed under the inlet in the photograph is not drawn.
  power-output-w: >-
    datasheet - the part number and guide Table 4 (AC AFO, 3000 W; output 12 V at 250 A, 12 V standby at 1 A) and
    Table 6. An OUTPUT, since a supply provides power.
  leds: >-
    datasheet - guide, QFX5230-64CD AC Power Supply LED (figure 21): the single lamp on the face shows the
    supply's state. The photograph labels it PWR.
  airflow: >-
    datasheet - guide Tables 3, 6 and 12: JNP-3000W-AC-AFO is port-to-FRU, front-to-back, and carries a Juniper
    gold handle. The photograph shows this supply in the AIR OUT chassis.
  input: >-
    datasheet - guide Table 4: 180 to 305 VAC at 50 or 60 Hz. The rating label in the photograph reads 200 to
    277 V and 20 A; the guide's range is used.
