format: 1
kind: module
name: mpc2e-3d-p
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MPC2E P carrier (MX-MPC2E-3D-P) - two MIC slots. It draws the same 294 W as the MPC2E Q family
  (juniper/mpc2e-3d-q). It has a MIC column of its own in the compatibility table and takes fewer MICs. One card for
  the MX240, MX480 and MX960, drawn horizontal; the MX960 seats it turned 90.
attrs:
  model: MX-MPC2E-3D-P
  power-draw-max-w: 294
provenance:
  model: >-
    datasheet - Juniper Networks, MX Series 5G Universal Routing Platform Interface Module Reference, Table 4 'MPCs Supported by MX240, MX480, MX960, MX10003, MX10004, MX10016, MX2008, MX2010, and MX2020 Routers' (PDF pp. 33-34): row 'MPC2E P', MPC Model Number
    MX-MPC2E-3D-P. The card's own page (printed p. 163) prints the number, 6.13 A @ 48 V (294 W) and the two MIC slots.
  size: >-
    estimated from the family - not photographed. The plate is 396.0 x 29.5 centred in a 413.5 lever envelope, the
    figures the library draws every MPC, DPC and SCB at (mpc2e-3d@3, mpc3e-3d@3; plate x px 127.5-1463.5 = 396.2 mm on the
    MX240 front photograph at 3.372 px/mm). The reference prints this card as a three-quarter view with a magnified inset of the left ejector lever, its lamp and its model label (printed p. 162); it has no front elevation and no dimension. Nothing here is resized.
  power: >-
    datasheet - Juniper Networks, MX240 Universal Routing Platform Hardware Guide, Table 93 'FRU Power Requirements' (printed p. 223, PDF
    p. 239): '| MPC2E P | MX-MPC2E-3D-P | 294 W With MICs and optics: 368 W at 131 F (55 C) ... |'. 294 W is the leading,
    card-alone figure of the row; the ladder under it is with MICs and optics, a different scope.
  accepts: >-
    datasheet - Juniper Networks, MX Series 5G Universal Routing Platform Interface Module Reference, 'MIC/MPC Compatibility', Table 11 'MIC/MPC2 Compatibility'
    (printed pp. 49-54, PDF pp. 58-63), the 'MPC2E P' column, restricted to the MICs this library models. Each listed
    MIC prints a release in that column: MIC-3D-20GE-SFP, MIC-3D-2XGE-XFP, MIC-3D-4XGE-XFP, MIC-3D-40GE-TX,
    MIC-3D-1OC192-XFP, MIC-3D-4COC3-1COC12-CE and MIC-3D-8DS3-E3 (all 12.2), MIC-3D-20GE-SFP-E (13.2R2), MIC-MACSEC-20GE
    (18.3R1) and MS-MIC-16G (13.2). An en dash stands in that column for MIC-3D-8OC3-2OC12-ATM, MIC-3D-10GE-SFP-E,
    MIC-3D-4OC3OC12-1OC48, MIC-3D-8OC3OC12-4OC48, MIC-3D-4CHOC3-2CHOC12, MIC-3D-8CHOC3-4CHOC12 and MIC-3D-16CHE1-T1-CE, so
    none is listed. MIC-3D-40GE-TX is a 'Dual-wide MIC that installs into 2 slots', so it is in mic0's list only, and
    mic0 states `span: [mic1]`. In the column but not listed: MIC-3D-8CHDS3-E3-B (a variant of the listed
    mic-3d-8ds3-e3). Only one MS-MIC-16G can be installed into any MPC.
  numbering: >-
    guide - the reference prints small numerals beside every cage, numbered within each PIC segment with a group
    legend, never flat across the card. The MICs seated in this carrier's two bays draw those numerals; the carrier
    draws none of its own, as its figure shows none.
  levers: >-
    estimated - the inset (printed p. 162) shows an ejector lever at the card's left end with a round screw head, the model label beside it and a lamp below it. Drawn as the library draws every MPC lever, 29.0 x 7.4 centred on the plate with
    the tip at the envelope edge, measured off the MX240 front photograph for the DPC 40xGE, DPC-R-4XGE and SCB-MX
    (97 px = 28.8 mm long, 25-27 px = 7.4-8.0 mm tall). Not remeasured on this card.
  model-name: >-
    estimated - the inset prints the model number MX-MPC2E-3D-P in small type beside the lever. Placed at card x 11.4, baseline 25.5 below the plate top, where the photographed
    DPC 40xGE, DPC-R-4XGE and SCB-MX print theirs.
  status-group: >-
    estimated - the inset shows one round lamp under the lever, matching the module page's 'OK/FAIL LED, one bicolor'. Placed as the photographed DPCs place theirs: the OK/FAIL legend vertical at card x
    32.3 centred on y 12.7 and the lamp below it at (32.3, 21.5).
  mic-windows: >-
    estimated - the module page states 'Two slots for MICs labeled PIC 0/1 and PIC 2/3'; the three-quarter view shows the card's board rather than its faceplate, so no window is seen or dimensioned. Drawn at the MICs' own plate, 168.8 x 29.2, as mpc2e-3d@3 draws
    them (mic0 37.7 to 206.5, mic1 207.0 to 375.8 in card x; y 0.15), the window the MX2010 front photograph measures
    on every seated carrier. The latches and tabs are not drawn.
states:
- ok
- fail
- absent
