format: 1
kind: module
name: qfx5200-48y-apsu-ai
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  QFX520048Y-APSU-AI, the 650 W AC power supply of the QFX5200-48Y, with back-to-front (FRU-to-port)
  airflow. It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares with its
  twin. The QFX5200 hardware guide says the QFX5200-48Y takes it, two to a switch, in the slots at
  the two ends of the FRU panel. The face is that of the front-to-back supply with a blue latch (the
  guide's blue panel for airflow in): one bi-coloured lamp, a silver frame with square vents, a black
  bail handle and a C14 appliance inlet turned on its side. The front-to-back sibling is
  QFX520048Y-APSU-AO. AC and DC supplies of the same airflow may be mixed in the 48Y, but supplies of
  different airflow direction never are.
attrs:
  model: QFX520048Y-APSU-AI
  role: ac-power-supply
  power-output-w: 650
  airflow: back-to-front
  input: 100 to 240 VAC, 50 to 60 Hz, 7.8 A at 100 to 120 VAC or 3.8 A at 200 to 240 VAC (QFX5200-48Y, guide Table 20)
provenance:
  size: >-
    photo-measured, for the sibling - the same frame and latch as qfx5200-48y-apsu-ao@1 (50.1 mm
    frame, 54.4 mm with the latch, 39.7 mm high), from the QFX5200-48Y rear photograph and the guide's
    flat figure 26. No photograph of this back-to-front supply exists, so nothing here is measured on
    it. No document gives the supply's size in millimetres.
  depth: >-
    not stated. The guide's figures 35 and 40 are isometric drawings with no scale and its table gives
    only weight, so no depth is written.
  face: >-
    drawing and photo of the sibling - the guide's table 19 says the AI supply differs from the AO
    supply by its panel colour, blue and not red, and its figure 35 draws one face for the AC supply.
    The layout is that of the photographed front-to-back supply.
  power-output-w: >-
    datasheet - the guide's text says the AC power supply in QFX5200-48Y switches is 650 W (QFX5200
    AC Power Supply Description); it gives no separate output rating. An OUTPUT, since a supply
    provides power.
  leds: >-
    datasheet - guide Table 24 (AC Power Supply LED on a QFX5200-48Y): one bi-coloured lamp. Off:
    disconnected or no power in; green blinking: standby, power comes in at +5 V; green steady: the supply
    sends out power correctly; red and green alternating: a warning, check the logs; red steady: an
    error, replace it and leave it seated for airflow; red blinking: the supply's internal fan has
    failed.
  airflow: >-
    datasheet - guide Table 19 (color indicators for airflow direction): QFX520048Y-APSU-AI is Airflow
    In, FRU-to-port, with a blue panel.
  colour: >-
    borrowed - the guide says only "Blue" panel and no photograph of this supply exists. The blue is the
    one the library already carries for Juniper Azure Blue on juniper/jpsu-650w-ac-ai@1, estimated.
states:
- ok
