format: 1
kind: module
name: ex4200-pwr-320-ac
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper EX-PWR-320-AC, the 320 W AC power supply of the EX4200-24T, -48T and -24F switches. It
  seats in power supply slot 0 or 1 at the rear and sits flush with the chassis. Hot-insertable
  and hot-removable; AC OK and DC OK lamps, a locking lever at the left, a honeycomb fan exhaust,
  a loop handle across the top and an appliance inlet that takes a C13 cord. Airflow is
  side-to-rear through the chassis; the supply has a fan of its own.
attrs:
  part-number: EX-PWR-320-AC
  role: ac-power-supply
  power-output-w: 320
  input-voltage: 100-240 VAC, 50-60 Hz
  input-current: 4 A (guide Table 12, switches with 8 PoE ports or 24 SFP ports)
  weight-kg: 1.1
  depth-beyond-chassis-mm: 0
part-numbers:
  EX-PWR-320-AC: {part: EX-PWR-320-AC}
provenance:
  part-number: >-
    datasheet - EX4200 Ethernet Switch datasheet (Juniper Networks, 1000215-026-EN, Feb 2019),
    ordering information, Power Supplies: EX-PWR-320-AC, "320 W AC Power Supply Unit (PSU)"
  power-output-w: >-
    datasheet - EX4200 Switch Hardware Guide (published 2022-01-16), Table 1 (320 W minimum supply
    of the EX4200-24T, -48T and -24F), Table 9 (320 W rating, 130 W PoE budget for 8 PoE ports) and
    Table 12 (100 through 240 VAC, 50 through 60 Hz). An output, because a supply provides power
  weight: >-
    datasheet - guide Table 3: the 320 W AC supply weighs 2.5 lb (1.1 kg)
  depth: >-
    datasheet - guide Table 3 and Rear Panel of an EX4200 Switch: with this supply installed the
    chassis is 17 in (43.18 cm) deep, and the supply is flush with the chassis
  size: >-
    estimated - 90.0 x 41.5 mm, read as the slot width and height off the rear callout figure
    (Figure 4, g020084; 609 x 252 px, whose chassis outline is 557 px for 438.2 mm, 1.271 px per
    mm, and 5 percent foreshortened vertically, so heights are read on the chassis height). The
    guide gives no supply dimension. Good to about 2 mm
  inlet: >-
    datasheet - guide, AC Power Cord Specifications: the coupler is type C13 (IEC 60320), so the
    supply carries the registry's C14 appliance inlet
  face: >-
    drawing - guide Figure 17 (320 W AC Power Supply, g020066) and the supply as drawn in Figure 4:
    locking lever at the left, AC OK and DC OK lamps above the inlet, the inlet, and a honeycomb
    fan exhaust at the right. Figure 17 draws the loop handle across the TOP, and this skin
    follows it. The text of the supply installation procedure says the 320 W handle is at the
    BOTTOM and the 600 W and 930 W handle at the top, which is the reverse of the two figures
    (Figures 17 and 18); the figures are the maker's drawings of each unit and are followed. No
    photograph of the supply is held, so its colour is estimated
  leds: >-
    datasheet - guide Table 10: AC OK is on when power is coming into the supply; DC OK is on when
    the supply is sending out power correctly; each is off otherwise
  power-draw: >-
    NOT APPLICABLE - a supply states its output
states:
- ok
- fault
- absent
