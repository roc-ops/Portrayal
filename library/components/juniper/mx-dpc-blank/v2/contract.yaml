format: 1
kind: module
name: mx-dpc-blank
version: 2.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Blank cover panel for an unoccupied MX240/MX480 DPC/MPC slot, as the MX480 reference photograph shows
  in slots 5, 2 and 1 - a plain silver plate with a short slotted knob at each end and a printed 0/1 rotary
  mark beside the left one.
attrs:
  model: MX Series DPC slot blank
provenance:
  states: >-
    NO LAMP AND NO HEALTH ON A FILLER PANEL. A slot cover is a piece of sheet metal
    that fills an opening: it has no indicator to light and no condition to report,
    so `ok` was a state the viewer generated CSS for, offered as a control, and could
    never show - this part draws no elements at all. `absent` stays, because an empty
    slot is a real thing to draw. See roc-ops/Portrayal#269.
  size: >-
    photo-measured plate, estimated envelope - the plate is 396.0 x 29.5 centred in the 413.5 slot envelope
    every card of the MX240/MX480 cage reserves (L123: one bay, one size). Off the MX480 front photograph
    (body px 35-1466 = 443 mm, 3.230 px/mm), slots 5, 2 and 1: plate px 155-1435 = 396.3 mm.
  knobs: >-
    photo-measured - the MX480 front photograph's blanks (slots 5, 2, 1), 3.230 px/mm: NOT the cards'
    29 mm ejector lever but a short knob at each end, 63.5 px = 19.6 mm long and about 9 mm tall with
    a slot across it, overhanging the plate end by about 4 mm (card x 4.7-24.3 and 389.2-408.8). The left
    one carries a printed rotary mark: a 0 above, a 1 level with the knob, and an arc between, each placed
    off the photograph to about 0.5 mm. 1.x drew card levers and a round latch boss here instead.
states: [absent]
size:
  w: 413.5
  h: 29.5
size-notes: >-
  w is the slot envelope every MX240/MX480 card reserves (the 413.5 lever envelope of the cards, #261),
  so a blank seats like a card; the plate inside it is photo-measured and the knobs do not reach the envelope's
  ends. h is the plate height, estimated as the cards'.
size-confidence: {w: estimated, h: estimated}
