format: 1
kind: module
name: mx-dpc-blank
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Blank cover panel for an unoccupied MX240/MX480 DPC/MPC slot, as the MX480
  reference photograph shows in slots 5, 2 and 1 - a plain silver card face
  with lever pockets and the small rotary latch art at the left.
attrs:
  model: MX Series DPC slot blank
provenance:
  states: >-
    NO LAMP AND NO HEALTH ON A FILLER PANEL. A slot cover is a piece of sheet metal
    that fills an opening: it has no indicator to light and no condition to report,
    so `ok` was a state the viewer generated CSS for, offered as a control, and could
    never show - this part draws no elements at all. `absent` stays, because an empty
    slot is a real thing to draw. See roc-ops/Portrayal#269.
  size: 'photo - fills the 420.9 x 29.5 mm slot aperture like the cards it
    blanks; drawn from the MX480 front photograph''s empty slots. No vendor
    part number for the blank appears in the intake - searched "blank" in
    both guides'
states: [absent]
size:
  w: 420.9
  h: 29.5
