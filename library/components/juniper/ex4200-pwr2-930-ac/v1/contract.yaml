format: 1
kind: module
name: ex4200-pwr2-930-ac
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper EX-PWR2-930-AC, a 930 W PoE+ AC power supply of the EX4200 switches. The EX4200-24PX
  and -48PX work only with this supply or the EX-PWR3-930-AC, and every other EX4200 accepts it.
  It seats in power supply slot 0 or 1 at the rear and extends 2.25 in (57.2 mm) out of the
  chassis. Hot-insertable and hot-removable; AC OK and DC OK lamps, a locking lever at the left, a
  round fan exhaust, a loop handle along the bottom and an appliance inlet that takes a C13 cord.
  The label naming it is on the top of the supply.
attrs:
  part-number: EX-PWR2-930-AC
  role: ac-power-supply
  power-output-w: 930
  input-voltage: 100-240 VAC, 50-60 Hz
  input-current: 12 A (guide Table 12, switches with 48 PoE ports)
  weight-kg: 1.4
  depth-beyond-chassis-mm: 57.15
part-numbers:
  EX-PWR2-930-AC: {part: EX-PWR2-930-AC}
provenance:
  part-number: >-
    datasheet - EX4200 Switch Hardware Guide (published 2022-01-16), Power Supply in EX4200
    Switches: the EX4200-24PX and EX4200-48PX work only with supplies labelled EX-PWR2-930-AC or
    EX-PWR3-930-AC, all EX4200 switches support both, and the label is on the top of the supply
  power-output-w: >-
    datasheet - guide Table 9 (930 W rating, 740 W PoE budget for the -24PX and -48PX) and Table 12
    (100 through 240 VAC, 50 through 60 Hz; 12 A for 48 PoE ports). An output, because a supply
    provides power
  weight: >-
    estimated - guide Table 3 gives 3.1 lb (1.4 kg) for "600 W and 930 W AC power supplies"; it does
    not name this code, so the figure is the 930 W class's
  depth: >-
    estimated - guide Table 3 and Rear Panel of an EX4200 Switch give 19.25 in for a 600 W or 930
    W supply and a 2.25 in extension; they do not name this code, so the figure is the 930 W
    class's
  size: >-
    estimated - 90.0 x 41.5 mm, the slot width and height read off the rear callout figure
    (Figure 4, g020084). The guide gives no supply dimension
  inlet: >-
    datasheet - guide, AC Power Cord Specifications: the coupler is type C13 (IEC 60320), so the
    supply carries the registry's C14 appliance inlet
  face: >-
    estimated - no figure draws this code; guide Figure 18 draws the 600 W and 930 W supplies and
    the art is that figure's. No photograph is held, so its colour is estimated
  leds: >-
    datasheet - guide Table 10: AC OK is on when power is coming into the supply; DC OK is on when
    the supply is sending out power correctly; each is off otherwise
  power-draw: >-
    NOT APPLICABLE - a supply states its output
states:
- ok
- fault
- absent
