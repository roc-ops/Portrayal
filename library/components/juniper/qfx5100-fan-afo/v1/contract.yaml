format: 1
kind: module
name: qfx5100-fan-afo
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  QFX5100-FAN-AFO, a field-replaceable fan module with port-to-FRU airflow, which the guide also
  calls front-to-back. Cold air comes in at the port end of the switch and hot air leaves at the
  fan end. It is marked AIR OUT and has a Juniper Gold handle. It is hot-removable and
  hot-insertable. The QFX5100 hardware guide says the QFX5100-24Q, QFX5100-48S, QFX5100-48SH,
  QFX5100-48T and QFX5100-48TH take it. The 1RU models seat five, in slots 0 to 4 from left to
  right. The back-to-front sibling is QFX5100-FAN-AFI. The two are never mixed in one chassis, and
  never with power supplies of the other direction. The 2RU QFX5100-96S uses a different part.
attrs:
  model: QFX5100-FAN-AFO
  airflow: front-to-back
  power-absent: not-published
provenance:
  size: >-
    photo-measured - the Juniper studio rear photograph of the QFX5100-48S (aspect of the whole face
    checked against Table 3's 440.9 x 43.7 mm: 10.17 against 10.09, 0.8 percent out), scaled at
    3.30 px/mm across and 3.28 down: the blue face of five modules measures 137 px, 41.5 mm, across
    on a 48.95 mm pitch, and 41.3 mm high. The QFX5100-48T photograph reads 43.1 mm on a 48.65 mm
    pitch at 3.27 px/mm, a different pose of the same part, and is not used for the size. No
    document states the module's size in millimetres.
  depth: >-
    not stated. Searched the QFX5100 hardware guide (published 2023-02-26) and the datasheet
    (July 2024) for the module's depth: the guide's Figure 35 is an isometric drawing with no
    scale and the tables give no depth. No depth is written rather than a guessed one.
  face: >-
    photo and drawing - the guide's isometric Figure 35 and the studio photographs agree on what is
    on it: a hex grille above and another below a handle band, and a grey chip on the band with a
    fan symbol, AIR IN and (AFI). Positions are fractions of the photograph. The drawn module is
    the back-to-front unit; this front-to-back one is the same shape with the chip lettered AIR
    OUT and (AFO), which the guide's Table 19 states and no photograph shows. The grille and
    chip positions are estimated for that reason.
  colour: >-
    estimated - the guide's Table 19 names the colour, Juniper Gold, and prints no value. The
    gold is the orange sampled from the studio photograph of the QFX5120-48Y rear
    (juniper/qfx5110-fanafo@1), another Juniper switch's gold fan; no photograph of an AFO
    QFX5100 module is held.
  airflow: >-
    datasheet - guide, Table 19 and Cooling System and Airflow: QFX5100-FAN-AFO is port-to-FRU,
    label AIR OUT, colour Juniper Gold, "also known as front-to-back airflow". The datasheet's
    ordering table lists it as the front-to-back fan module for QFX5100.
  power: >-
    not published. Searched the QFX5100 hardware guide near its fan sections and its power tables:
    only whole-switch figures exist. The module declares power-absent so the missing figure is a
    statement and not a silence.
