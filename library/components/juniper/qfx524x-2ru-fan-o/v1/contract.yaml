name: qfx524x-2ru-fan-o
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  QFX524X-2RU-FAN-O, the field-replaceable fan module of the DC builds of the QFX5241-64OD and QFX5241-64QD
  (QFX5241-64OD-DO and QFX5241-64QD-DO), with front-to-back airflow (AIR OUT, port-to-FRU, also written AFO). Air
  comes in at the port side and leaves at the back. It is marked AIR OUT on a grey chip on its orange handle. Each
  module holds two rotors, and the cooling system is N+1 at rotor level. It is hot-removable and hot-insertable.
  The switch takes four, in slots 0 to 3 from left to right. The AC builds take the QFX5240-2U-FANAO, which is a
  different part number.
attrs:
  model: QFX524X-2RU-FAN-O
  airflow: front-to-back
  power-absent: not-published
provenance:
  size: >-
    photo-measured - the Juniper studio rear photograph of the QFX5241-64OD AC build (2100 x 692 px; the body is
    1895 px wide, which is 17.26 in at 4.323 px/mm): the AC module's plate measures 80.3 mm wide and 80.0 mm high,
    on an 85.7 mm pitch. The guide's Table 7 gives the DC module the same "80 mm x 80 mm x 80 mm" as the AC one, and
    its DC FRU panel (figure 22) draws the same four plates on the same pitch, so the AC photograph's size is
    carried. No photograph of a DC build is held.
  depth: >-
    not stated. Searched the QFX5241-64OD and QFX5241-64QD hardware guide (Tables 7 and 8, figures 27 and 28, the
    physical specifications) for the module's depth. No depth is written rather than a guessed one.
  face: >-
    drawing - the guide's figure 22 (DC FRU panel, flat) shows four plates of hexagonal holes, each with a captive
    screw at the upper left and a sloping handle band carrying the AIR OUT chip, drawn as the AC module's face is,
    which the studio photograph of the AC build shows in colour. The handle colour is the photograph's orange of
    the AC module; the guide does not name it and no DC photograph is held. Positions are those of the AC module
    and estimated to about 0.4 mm.
  airflow: >-
    datasheet - guide Tables 4, 7 and 8 and the cooling system text: QFX524X-2RU-FAN-O for DC and DC-with-ORv3
    models, airflow out, ports-to-FRUs, front-to-back.
  power: >-
    not published. Searched the guide (the cooling system, Tables 7 and 8 and the DC power supply sections) for a
    figure per module: only whole-switch figures exist. The module declares power-absent so the missing figure is
    a statement and not a silence.
