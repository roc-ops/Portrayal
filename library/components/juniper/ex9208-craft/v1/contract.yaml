format: 1
kind: module
name: ex9208-craft
version: 1.0.0
class: display
behaviour: fills
profile: networking
description: >-
  Craft interface (front panel display, FPM board) of the Juniper EX9208 switch. It spans the chassis above the card
  cage. It has the MASTER, ONLINE and OFFLINE lamps for RE0 and RE1. It has the fan tray lamps and the OK and FAIL lamps of
  PEM 0 to PEM 3. It has a minor (yellow) and a major (red) alarm lamp and the alarm cutoff and lamp test button (ACO/LT).
  It has the MINOR ALARM and MAJOR ALARM relay contacts (NC, C, NO). Each Switch Fabric slot (0, 1) and each line card
  slot (0 to 5) has an OK lamp, a FAIL lamp and a control button. The EX9208 model name is printed on it.
attrs:
  model: EX9208 Craft Interface
  power-absent: not-published
provenance:
  sources: >-
    EX9208 Switch Hardware Guide (published 2025-07-28), "Craft Interface in an EX9200 Switch": Figure 12 (the craft
    interface of the EX9208, drawn flat, with nine callouts), the alarm relay contacts figure, Tables 9 to 14 (the lamps),
    and the EX9208 studio front photograph (1.314 px/mm), which shows the panel with its lamps unlit.
  lamp-states: >-
    The vocabularies are the guide's: Table 9 (host subsystem: MASTER green, ONLINE green, OFFLINE red), Table 10 (fan:
    OK green, FAIL red), Table 11 (power supply: OK green, FAIL red), Table 12 (Switch Fabric module: OK green or blinking,
    FAIL red), Table 13 (line card: OK green or blinking, FAIL red), Table 14 (alarm: major red, minor yellow). Each lamp
    fills from the LED variable, with its drawn colour as the unlit fallback.
  power: >-
    NOT PUBLISHED. The guide's FRU power table (Table 24) lists the Routing Engine, the Switch Fabric modules and the line
    cards and does not list the craft interface; the EX9200 datasheet (Aug 2022) Table 3 lists none either.
  size: >-
    estimated - the panel spans 420.9 x 42.0 mm, the size the MX480 photograph measures for the craft panel of the same sheet
    metal (juniper/mx480 craft bay). The EX9208 photograph (1.31 px/mm) reads the panel from 10.5 to 433.3 mm across the body.
    The guide gives no dimension for it.
  features: >-
    photo-measured - every lamp, button, tab and relay block is placed from the EX9208 studio front photograph, read on a
    millimetre grid at 1.314 px/mm across, from the panel's own origin at 11.0 mm across the body and 38.8 mm down. The photograph
    resolves 0.8 mm, so every place is read to about 1 mm across and 1.5 mm down. The two RE lamp columns read at 110.2 and
    141.9 mm across the body, the fan lamp column at 189.2, the four PEM lamp columns at 243.2, 249.6, 255.9 and 262.2, the
    minor alarm triangle at 306.5, the major circle at 324.3, the ACO/LT button at 343.4, the relay blocks 357.4 to 384.0 and 384.6
    to 410.3, and the eight slot tabs at 110.2, 141.9, 173.8, 205.4, 237.1, 268.7, 300.3 and 331.9, 31.7 mm apart. The panel
    is the EX9204's panel with eight slot tabs and the model name EX9208.
  slot-tabs: >-
    photo and guide Figure 12 - eight oval tabs under the slot lamp pairs: the two Switch Fabric slots SF0 and SF1 at the left,
    drawn blue in the photograph, and the six line card slots 0 to 5, grey. Callouts 8 and 9 of the figure name the two groups.
  logo-zone: >-
    estimated - reserved, not drawn. The maker's wordmark sits at the left, about 28 x 13 mm, and the "running junos" badge at
    the lower right, about 28 x 9 mm. The library reproduces no vendor logo.
