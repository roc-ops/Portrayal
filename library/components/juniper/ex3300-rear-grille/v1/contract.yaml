description: >-
  Round honeycomb grille over the built-in rear fan of the Juniper EX3300 switches, the "air exhaust
  with fan" of the rear panel. The fan is built into the chassis and is not a field-replaceable unit.
  It exhausts air on the front-to-back models and draws it in on the back-to-front EX3300-48T-BF.
size: {w: 27.7, h: 30.6, d: 6.0}
