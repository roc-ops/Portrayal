provenance:
  existence: >-
    datasheet - EX3300 Switch Hardware Guide (published 2020-12-15), EX3300 Cooling System: two fans,
    one along the rear of the chassis and another along the left side; Power Supply and Fan Tray rows
    of Table 4 call the fan tray built in. Figures 3 and 4 draw the rear grille as "Air exhaust with
    fan"
  size: >-
    estimated - read off the vector drawing of Figure 3, which is flat. The rear figure is scaled so
    that its face is 444.5 mm wide, 0.735 pt/mm; the grille is 27.7 mm across and 30.6 mm high. The face
    height reads 43.4 mm against the table's 44.5, so the vertical figure is good to about 3 percent,
    and the drawing clips the honeycomb at the left and right, so the true grille is probably round
    at about 30 mm. The guide gives no dimension for it
  depth: >-
    estimated. The drawing is a front view; 6.0 is what the relief builds, not a figure from any source
