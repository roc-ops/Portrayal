<svg xmlns="http://www.w3.org/2000/svg" width="10.9mm" height="28.4mm" viewBox="0 0 10.9 28.4">
  <!-- The cable connector of the QFX5200-48Y DC supply seen from the wire side, seated: the body at the header's outline and one
       wire entering each of the three ways, red, black and green top to bottom. -->
  <rect id="body" x="0" y="0" width="10.9" height="28.4" rx="0.8" fill="#9aa0a6" stroke="#5b6066" stroke-width="0.3"/>
  <circle id="wire-1" cx="5.3" cy="9.5" r="1.7" fill="#d32f2f" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-1-color"/>
  <circle id="wire-2" cx="5.3" cy="14.3" r="1.7" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-2-color"/>
  <circle id="wire-3" cx="5.3" cy="19.1" r="1.7" fill="#5a9e3c" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-3-color"/>
</svg>
