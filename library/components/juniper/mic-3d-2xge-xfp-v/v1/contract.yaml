format: 1
kind: module
name: mic-3d-2xge-xfp-v
version: 1.0.1
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper 2-port 10GbE MIC with XFP. Vertical author for the vertical carriers (MX960/MX2000 MPCs stand on end, and their MICs with them).
attrs:
  model: MIC-3D-2XGE-XFP
  power-draw-max-w: 29
provenance:
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU power table, MX chassis guides: '| 10-Gigabit Ethernet MIC with XFP | 2-Port:
    MIC-3D-2XGE-XFP 4-Port: MIC-3D-4XGE-XFP | 2-Port:29W 4-Port:37W |'. Read by matching the
    row's own N-Port label rather than by position, because one row carries both cards and
    both figures; the alignment self-checks, 2-port 29 W against 4-port 37 W. NO AMBIENT IS
    STATED for this row - unlike most of the tables around it, which give a 25/40/55 C
    ladder - so none is recorded rather than invented.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
states:
- ok
- fail
- absent
parts:
- {ref: std/xfp@1, id: port-0-0, at: [3.75, 17.70], rotate: 90, attrs: {media: xfp}}
- {ref: std/xfp@1, id: port-1-0, at: [3.75, 47.80], rotate: 90, attrs: {media: xfp}}
size:
  w: 27.0
