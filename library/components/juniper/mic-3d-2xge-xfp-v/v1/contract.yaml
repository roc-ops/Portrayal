format: 1
kind: module
name: mic-3d-2xge-xfp-v
version: 1.2.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper 2-port 10GbE MIC with XFP. Vertical author for the vertical carriers (MX960/MX2000 MPCs stand on end, and their MICs with them).
attrs:
  xfp-10g: 2
  model: MIC-3D-2XGE-XFP
  power-draw-max-w: 29
provenance:
  ethernet-rate: >-
    the Ethernet rate, from the MX Series Interface Module Reference, which files
    MIC-3D-2XGE-XFP under 10-Gigabit Ethernet MICs with XFP. The XFP cage cannot say: it
    takes a 10GbE optic and an OC-192 one, and the framing is what differs. The export
    already typed it 10gbase-x-xfp by default; this makes that a statement. Nothing new was
    measured.
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU power table, MX chassis guides: '| 10-Gigabit Ethernet MIC with XFP | 2-Port:
    MIC-3D-2XGE-XFP 4-Port: MIC-3D-4XGE-XFP | 2-Port:29W 4-Port:37W |'. Read by matching the
    row's own N-Port label rather than by position, because one row carries both cards and
    both figures; the alignment self-checks, 2-port 29 W against 4-port 37 W. NO AMBIENT IS
    STATED for this row - unlike most of the tables around it, which give a 25/40/55 C
    ladder - so none is recorded rather than invented.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
states:
- ok
- fail
- absent
parts:
- {ref: std/xfp@1, id: port-0-0, at: [3.75, 17.70], rotate: 90, attrs: {media: xfp}}
- {ref: std/xfp@1, id: port-1-0, at: [3.75, 47.80], rotate: 90, attrs: {media: xfp}}
size:
  w: 27.0
  h: 168.0
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  w and h are the MIC window in an MPC face, rotated, not the part. Nothing measured the card:
  provenance/size says so in as many words, and #261 found the same model number drawn at two
  different sizes because two chassis have two openings. Juniper's hardware guides for the
  MX240, MX480 and MX960 all state an MPC/DPC/SCB as 17 x 22 x 1.25 in - the MX960's own book
  included, which is the vendor saying it is ONE card in both orientations - but those figures
  are rounded to the quarter inch, and 1.25 in is 31.75 mm against a modelled 30.45 mm slot
  pitch, so they cannot settle a drawing to 0.1 mm. Estimated until a mechanical drawing or a
  ruler on a real card turns up.
