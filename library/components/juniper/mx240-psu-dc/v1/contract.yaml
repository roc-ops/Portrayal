format: 1
kind: module
name: mx240-psu-dc
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper MX240 normal-capacity DC power supply (PEM). Up to four across the
  rear top in slots PEM0-PEM3; the DC system requires two (nonredundant) or
  four (redundant). One -48 VDC input with RTN/-48V terminal studs behind the
  block, a 40 A rotary input breaker, PWR OK / BKR ON / INPUT OK lamps, an
  exhaust vent field and a pull handle. Weighs 1.7 kg.
attrs:
  inlet: dc-terminal
  model: MX240 DC PSU (normal capacity)
  power-output-w: 1600
  role: dc-power-supply
  input: -48 VDC and return; dedicated 40 A customer breaker per PEM
  redundancy: 2 required, 4 for redundancy
provenance:
  inlet: >-
    transcribed from this contract's own description: 'One -48 VDC input with RTN/-48V
    terminal studs behind the block'. Nothing new was measured.
  power: >-
    MX240 hardware guide, Table 23 'Power Supply Electrical Specifications', Normal-Capacity
    block: 'Maximum output power | 1600W' at -48 VDC nominal. Table 24 repeats it as output
    per supply. The section is headed 'DC Power Supply Electrical Specifications for MX240
    AND MX480', so it is one supply serving both chassis. High-Capacity beneath is 2240 W
    (DIP=0) / 2440 W (DIP=1), a different part.
  size: 'photo - 101.5 x 79.7 mm face measured off the orthographic
    mx240-rear-high photograph (0.7% aspect gate): four equal PEMs across
    x 11-418 on a 101.9 mm pitch, rows 8.9-88.6. No vendor PEM dimension
    exists in the intake - searched the physical-specification tables'
  power-output: 'NOT STATED PER MODULE - the guide''s Table 95 gives
    "MX240 DC Normal-capacity 1600W" as MAXIMUM SYSTEM output power for the
    required PSU set, and the electrical-specification table speaks per
    input feed; no per-module nameplate output appears anywhere in the
    intake (searched "output power" through the power chapters). L27 stands
    as the record rather than dividing the system figure'
  face: 'photo - vents upper left, RTN/-48V terminal block lower left (four
    studs behind the clear cover, drawn uncovered), 40 A rotary breaker with
    white lever, three lamps with legends, pull handle, "Breaker Rating 40A"
    and "Use Copper Conductors" legends - all placed off the photograph'
  leds: 'guide DC PSU LED table: PWR OK green = output ok, BKR ON green =
    breaker on, INPUT OK green = input present; summarised, full rows in the
    guide'
  seats: >-
    estimated - each pole is juniper/mx240-dc-pole@1, a pair of studs on 5/8 in. centres that
    one two-hole lug lands across, turned a quarter so the pair runs down the face the way the
    guide's Figure 19 (printed page 57) and Figure 79 (printed page 285) draw the lug, one lug
    on two studs one above the other. Each stands so that the pair's midpoint is the midpoint
    of the two studs the skin draws in its column (13.0 and 28.0 across, 53.5 down). The skin
    draws the two studs of a column 13.0 apart and the part composes its studs 15.875 apart,
    the pitch of the lug the guide dimensions (Figure 22, printed page 59), so each stud of a
    seat stands 1.44 from the stud the skin draws and the skin is not redrawn. THE LUG'S
    PITCH IS PRINTED AND THE STUDS' IS NOT: no document held dimensions the studs, and the
    skin's own 13.0 is read off a photograph. The studs are common/terminal-screw-34@1, a
    stand-in that claims no thread, lifted to the height the stud relief below gives.
  poles: >-
    MX240 Universal Routing Platform Hardware Guide (Juniper Networks, 2026), "Connecting Power to
    a DC-Powered MX240 Router with Normal-Capacity Power Supplies" (printed page 284, step 8):
    "Secure each positive (+) DC source power cable lug to the RTN(return) terminal" and each
    negative (-) lug "to the 48V (input) terminal"; "Powering On a DC-Powered MX240 Router with
    Normal Capacity Power Supplies" (printed page 286, step 4) reads "the return terminal
    (labeled RTN)" and "the input terminal (labeled -48V)". The skin prints RTN over the left
    column of studs and -48V over the right.
    The roles are the supply's printed words: `rtn` for RTN and `batt` for -48V
    (spec/schemas/dc.yaml writes `batt` as -48V and negative (battery)). The supply has one DC
    input, so one port, `input`, of two poles, left to right as the skin prints them. The same
    two terminals serve the MX480, whose guide prints the same figure and steps.
  voltage: >-
    MX240 Universal Routing Platform Hardware Guide, Table 23 "Power Supply Electrical Specifications" (printed
    page 52), the Normal-Capacity block: "DC input voltage: Operating Range: -40.5 VDC to -72
    VDC Nominal: -48 VDC". A held table prints a nominal, so the port states it, with its minus,
    and the range in the order the table gives it. The MX480 guide's table for the same supply
    prints the same words.
  rating: >-
    NOT STATED. The guide's Table 23 (printed page 52) gives two figures for this supply's DC
    input current: "DC input current rating" of 33.3 A at -48 V nominal and "Maximum Input
    Current" of 40 A, and the supply carries a 40 A breaker. They differ, and a port's
    `rating-a` is one figure, so the port states none and a later change can state one once a
    source says which is meant. `attrs` keeps the 40 A breaker as it already carried it.
  awg: >-
    MX240 Universal Routing Platform Hardware Guide, "DC Power Cable Specifications for the MX240 Router" (printed
    page 60): "6-AWG (13.3 mm 2), minimum 60 C wire", and the MX480 guide's DC cable
    specifications, row "Power", print "Eight 6-AWG" for the same supply. One size in every guide
    held for the supply, so the port states it.
states:
- ok
- fault
- absent
