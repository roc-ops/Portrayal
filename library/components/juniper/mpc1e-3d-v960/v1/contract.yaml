    - juniper/mic-3d-2xge-xfp-v@1
    - juniper/mic-3d-1oc192-xfp-v@1
    - juniper/mic-3d-4oc3oc12-1oc48-v@1
    - juniper/mic-3d-8oc3oc12-4oc48-v@1
    - juniper/mic-3d-8ds3-e3-v@1
    - juniper/mic-3d-16che1-t1-ce-v@1
