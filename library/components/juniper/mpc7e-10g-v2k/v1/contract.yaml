format: 1
kind: module
name: mpc7e-10g-v2k
version: 1.3.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MPC7E-10G fixed MPC - forty SFP+ in four PIC groups of ten. Authored as the MX2000 vertical form, seated through its adapter card (jacks turned on their side - rotate 90, and 270 for the left cage of each belly-to-belly pair).
unplaced: >-
  SUPERSEDED by juniper/mpc7e-10g@2, which the MX2000 line-card slots now seat turned 90
  inside juniper/mx2000-lc-adapter@1, the adapter card the chassis takes (#261, part 2). This
  vertical drawing of the same card is kept and deprecated rather than deleted, so a manifest
  that pins it still resolves (#448); nothing in this library seats it.
superseded-by: juniper/mpc7e-10g@2
attrs:
  model: MPC7E-10G
  power-draw-max-w: 500
provenance:
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): on a card
    drawn on its side a pair sits left and right, the left cage 270 beside the right 90,
    so both cage lips face the band between the two cages and both bails face outward.
    Decided by the rule, not an observation, so a photograph of the stack overturns it:
    the 20 SFP pairs (port-0-1/port-0-0 to port-3-9/port-3-8). Turning a composed cage
    in place changes no box, id or anything a device places, so it is a minor bump (S6).
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    MX module reference, the MPC7E-10G section (headed 'Model number: MPC7E-10G', 'Name in
    the CLI: MPC7E 3D 40XGE'): '| Power requirements | - Typical: 405W - At different
    temperatures: 55 C: 500W 40 C: 465W 25 C: 430W |'. The 55 C rung is carried as the worst
    rated case; the typical is 405 W. Found only after widening the search from table ROWS
    to per-model SECTIONS - this figure is not in a row keyed by part number, it is a spec
    line eight lines below the section heading, which is why three earlier passes over the
    same corpus missed it. Distinct from MPC7E-MRATE, the sibling card, which is 545
    W.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
  groups: >-
    Juniper MX Series 5G Universal Routing Platform Interface Module Reference, 'MPC7E-10G'
    (printed pages 202 to 204): 'Forty 10-Gigabit Ethernet ports', labelled 0/0 to 0/19 and 1/0
    to 1/19, and 'Each port supports 10 Gbps or 1 Gbps speed.' The book names no role for the
    ports; the role follows the job, a network interface a transceiver is plugged into, so it is
    traffic. Ids port-P-N number the drawn
    cages (port-0-0 to port-3-9), not the faceplate labels, which the book prints as 0/0 through
    0/19 and 1/0 through 1/19.
states:
- ok
- fail
- absent
