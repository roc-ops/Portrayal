format: 1
kind: module
name: mic-3d-1oc192-xfp-v
version: 1.2.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper SONET/SDH OC192/STM64 MIC with XFP (one port). Vertical author for the vertical carriers (MX960/MX2000 MPCs stand on end, and their MICs with them).
attrs:
  oc192: 1
  model: MIC-3D-1OC192-XFP
  power-draw-max-w: 38
provenance:
  sonet-rate: >-
    the SONET rate, transcribed from this contract's own description - an OC-192/STM-64
    port. The XFP cage cannot say: an XFP takes a 10GbE optic and an OC-192 one, both at ~10
    Gb/s, and the framing is what differs. Without this the export typed it 10gbase-x-xfp.
    Nothing new was measured.
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: 'datasheet-table - the module reference model section states the requirement; 38 W max'
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
states:
- ok
- fail
- absent
parts:
- {ref: std/xfp@1, id: port-0-0, at: [3.75, 17.70], rotate: 90, attrs: {media: xfp}}
size:
  w: 27.0
  h: 168.0
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  w and h are the MIC window in an MPC face, rotated, not the part. Nothing measured the card:
  provenance/size says so in as many words, and #261 found the same model number drawn at two
  different sizes because two chassis have two openings. Juniper's hardware guides for the
  MX240, MX480 and MX960 all state an MPC/DPC/SCB as 17 x 22 x 1.25 in - the MX960's own book
  included, which is the vendor saying it is ONE card in both orientations - but those figures
  are rounded to the quarter inch, and 1.25 in is 31.75 mm against a modelled 30.45 mm slot
  pitch, so they cannot settle a drawing to 0.1 mm. Estimated until a mechanical drawing or a
  ruler on a real card turns up.
