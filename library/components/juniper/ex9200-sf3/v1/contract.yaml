format: 1
kind: module
name: ex9200-sf3
version: 1.0.0
class: supervisor
behaviour: fills
profile: networking
description: >-
  Juniper EX9200-SF3 Switch Fabric module (from Junos OS Release 20.3R1), the third-generation fabric of the EX9200
  line. It carries the Routing Engine in its own bay. The left end has the OK/FAIL, FABRIC ACTIVE and FABRIC ONLY lamps.
  The right end has two SFP+ XGE ports with LINK lamps, the GPS lamp and the RJ-45 external clock port. An ejector lever
  sits at each end. It seats in slot SF0 or SF1 of the EX9204 and EX9208 and in slots SF0 to SF2 of the EX9214. In the
  EX9204 it can also take the shared SF1/LC0 slot.
attrs:
  model: EX9200-SF3
  power-draw-max-w: 425
  power-draw-typical-w: 245
  fabric-bandwidth: up to 1 Tbps per slot (four fabric planes), 1.5 Tbps per slot with six planes
provenance:
  sources: >-
    EX9204 Switch Hardware Guide (published 2025-08-12), "EX9200-SF3 Module in an EX9200 Switch": Figure 26 (an
    isometric drawing in three views, with two circled close-ups of the two ends), the components table, Tables 29 and
    30 and the per-ambient power table; the same text is in the EX9208 and EX9214 guides (published 2025-07-28).
    No photograph of an EX9200-SF3 is held; the EX9204, EX9208 and EX9214 studio photographs show the EX9200-SF.
  size: >-
    estimated - the plate is 396.0 x 29.5 mm in the 413.5 envelope, the cage's card size (see juniper/ex9200-lc-sf-blank).
    Table 7 gives the EX9200-SF3 1.2 x 15.7 x 21.2 in (30.5 x 398.8 x 538.5 mm) and the older cards 1.25 x 17 x 22 in. The
    SF3 board is narrower than the older modules by 1.3 in, and no figure shows whether its plate is. The plate is drawn
    at the cage's size; the 15.7 against 17 in is recorded as a gap.
  face: >-
    drawing - Figure 26 shows the two ends as circled close-ups of a module stood on end, not a flat elevation, so every
    place here is a fraction of an isometric and is estimated. The left end has the model name printed up the plate
    (EX9200-SF3), a screw, the OK/FAIL lamp and the FABRIC bracket over ACTIVE and ONLY. The right end has XGE with two
    SFP+ cages, a LINK lamp beside each, a GPS lamp, the RJ-45 EXT CLK port and the lever. The layout is mapped onto the
    EX9200-SF's measured plate (the EX9208 front photograph), whose Routing Engine bay is the SF3's.
  re-bay: >-
    estimated - the Routing Engine bay spans card x 51.4 to 323.3, 271.9 mm, as the EX9200-SF's bay on the EX9208
    photograph (juniper/ex9200-sf re-bay). "Each Routing Engine must be installed directly into an SF module" (guide).
  leds: >-
    guide Table 29: OK/FAIL green (online), red (failed); FABRIC ACTIVE green; FABRIC ONLY green; XGE port LINK green;
    GPS EXT CLK green (link) or amber blinking (activity).
  power: >-
    guide, "EX9200-SF3 Maximum Power Consumption per Ambient Temperature and CB Slot": 425 W at 55 C, 400 W at 40 C and
    385 W at 25 C in an EX9214 slot (EX9208 295, 280, 265 W; EX9204 SF0 275, 260, 245 W and SF1 295, 280, 265 W). The
    highest figure, 425 W, is carried as the maximum. Table 24 (component power requirements) gives 245 W typical and 270 W
    reserved, and the EX9200 datasheet (Aug 2022), Table 3, gives 385 W typical and 400 W maximum. The three are different
    measures and scopes, not one conflict; 245 W is the typical figure of the guide's own table.
  interop: >-
    guide Table 30: the EX9200-SF3 supports the EX9200-RE and the EX9200-RE2, and does not interoperate with the
    EX9200-SF or EX9200-SF2.
states:
- ok
- fail
- absent
elements:
  lever-left:
    at: [0.0, 11.05]
    size: [29.0, 7.4]
    class: latch
  lever-right:
    at: [384.5, 11.05]
    size: [29.0, 7.4]
    class: latch
bays:
  re:
    at: [51.4, 1.0]
    size: [271.9, 27.5]
    accepts: [juniper/ex9200-re2@1, juniper/ex9200-re@1]
    default: juniper/ex9200-re2@1
groups:
