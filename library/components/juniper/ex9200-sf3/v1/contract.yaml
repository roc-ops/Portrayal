    term: Port
    role: management
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: the two SFP+ XGE ports, 10GbE and 1GbE, which connect to the chassis Ethernet control switch and not to the switching fabric
  clock:
    term: Port
    role: management
    index-origin: 0
    description: the RJ-45 external clock (GPS and PPS) interface
parts:
- {ref: std/sfp@1, id: xge-0, group: xge, at: [334.0, 9.2], attrs: {function: XGE port 0}}
- {ref: std/sfp@1, id: xge-1, group: xge, at: [350.6, 9.2], attrs: {function: XGE port 1}}
- {ref: std/rj45@2, id: ext-clk, group: clock, at: [368.2, 8.15], attrs: {media: rj45, function: GPS external clock}}
size:
  w: 413.5
  h: 29.5
