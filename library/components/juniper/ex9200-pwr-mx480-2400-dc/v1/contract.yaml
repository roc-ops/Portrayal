format: 1
kind: module
name: ex9200-pwr-mx480-2400-dc
version: 1.0.1
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper 2400 W DC power supply (PWR-MX480-2400-DC) of the EX9204 and EX9208. The CLI calls it "DC 2.4kW Power Entry Module".
  It has one -48 VDC input with its return. It has a 70 A circuit breaker, an input mode switch, an internal fan and a
  pull handle. Its three lamps are POWER OK, BRKR ON and INPUT OK. It seats in PEM0 to PEM3. It cools from the chassis
  front to its own rear. The output is 2400 W with the switch at 0 (60 A input) and 2600 W at 1 (70 A input).
superseded-by: juniper/ex9200-pwr-mx480-2400-dc@2
part-numbers:
  PWR-MX480-2400-DC-S: {part: PWR-MX480-2400-DC-S}
attrs:
  power-output-w: 2400
  power-output-70a-w: 2600
  input-voltage: -40.5 to -72 VDC, nominal -48 VDC
  input-current-a: 60 (switch at 0), 70 (switch at 1)
  airflow: front-to-back (the supply draws air from the front of the chassis and exhausts at its own rear)
  redundancy: 1+1
  inlet: dc-terminal
provenance:
  part-numbers: >-
    datasheet - EX9200 Ethernet Switch Datasheet (1000432-022-EN, Aug 2022), ordering information: "PWR-MX480-2400-DC-S 2400 W
    DC Power Supply for EX9208, spare". The MX240 and MX480 guides list PWR-MX480-2400-DC as "DC 2.4kW Power Entry Module". The
    datasheet names no spare for the EX9204 supply, whose guide describes the same 2400 W output and the same 14.5 x 4 in module.
  power: >-
    guide - EX9204 Switch Hardware Guide (2025-08-12), Table 21 and Table 22: maximum output 2400 W with the input mode switch at
    DIP 0 (60 A) and 2600 W at DIP 1 (70 A). The supply is named 2400 W, and the EX9200 datasheet says 2,400 W; 2400 is carried and
    2600 W beside it. The DC chapter's example says "the output power provided by each power supply is at least 2400 W".
  size: >-
    estimated - the face is 101.6 mm wide (the guide's 4 in) and 89.7 mm tall, as the AC supply (juniper/ex9200-pwr-mx480-2520-ac
    size). Table 7 gives the DC supply 1.75 in high, 14.5 in wide and 4 in deep.
  face: >-
    estimated - the guide's Figure 21 is one small isometric drawing of the supply, seen from the left-front: a field of vertical
    vent slots at the left, the circuit breaker, a terminal block with a hinged cover at the lower left, the lamps, and a screw
    at the foot. No flat drawing and no photograph of the DC supply is held; the EX9204 DC rear view, Figure 8, is isometric too
    and shows four supplies the same way. Every place is a fraction of an isometric drawing, drawn on the AC supply's outline
    (101.6 x 89.7), and is estimated to about 5 mm. See the gap dc-supply-face.
  leds: >-
    guide Table 23: POWER OK green (normal), yellow (main output out of range), off; BRKR ON green (breaker on, input present),
    off; INPUT OK green (input present, correct polarity), yellow (input present but out of range or reversed), off.
states:
- ok
- fault
- absent
elements:
  led-power-ok:
    at: [90.7, 20.3]
    size: [2.2, 2.2]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: yellow, color: '#f5a623'}
    - 'off'
  led-brkr-on:
    at: [90.7, 26.0]
    size: [2.2, 2.2]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  led-input-ok:
    at: [90.7, 31.7]
    size: [2.2, 2.2]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: yellow, color: '#f5a623'}
    - 'off'
  breaker:
    at: [30.0, 8.0]
    size: [14.0, 22.0]
    class: switch
  handle:
    at: [52.3, 63.0]
    size: [42.0, 6.4]
    class: latch
size:
  w: 101.6
  h: 89.7
size-confidence: {w: estimated, h: estimated}
relief:
  features:
  - node: handle
    out: 2.2
    color: '#26292d'
    confidence: estimated
    source: guide Figure 21 - the pull handle stands proud of the face
  - node: breaker
    out: 2.4
    color: '#26292d'
    confidence: estimated
    source: guide Figure 21 - the circuit breaker projects
skins: [default]
