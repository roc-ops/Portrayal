format: 1
kind: module
name: qfx10000-re
version: 1.0.0
class: supervisor
behaviour: fills
profile: networking
description: >-
  Juniper QFX10000-RE Routing and Control Board for the QFX10008 and QFX10016 - a slim full-width FRU,
  two stacked in the top slots (CB0 and CB1). PWR, STS and MST status lamps sit over the OFF button.
  Then come CON (console), the SMB quad and the MGMT pair (RJ-45 and SFP) with its lamp. The SMB
  quad is 1PPS in and out and 10 MHz in and out. A USB 2.0 port, the SATA SSD slot cover with
  its lamp and RESET follow. Four SFP+ cages numbered 0 to 3 are reserved by Juniper for future use.
attrs:
  sfp: 5
  model: QFX10000-RE
  power-draw-max-w: 100
  power-draw-typical-w: 50
provenance:
  sources: >-
    datasheet - QFX10008 Switch Hardware Guide (Juniper Networks, published 2025-12-11): QFX10000
    Routing and Control Board Description, Figure 4 (g050579, the isometric), Figure 42 (g050576, the
    flat faceplate with eight callouts), Figures 43 to 45, Tables 33 to 36, and Table 64. The QFX10016
    guide (published 2025-12-11) carries the same board as Figure 5 and the same topics.
  size: >-
    borrowed - the RCB aperture of juniper/mx10008 and juniper/mx10016, 389.0 by 38.1 mm, which the
    MX guides' juniper/jnp10k-re1@2 fills. Neither QFX guide gives a dimension for the RCB or its
    slot (Table 63 lists the chassis, the line cards, nothing for the RCB). Figure 42 measures 872 by
    74 px at the face, an aspect of 11.8 against 389.0 / 38.1 = 10.2, 15 percent out, so the figure
    fails the panel gate and no single px per mm may be taken from it.
  face-scale: >-
    FRACTIONS PER AXIS, NOT ABSOLUTE SCALE. Positions are fractions of the face along each axis
    independently: x at 872 px per 389.0 mm (2.241 px per mm) and y at 74 px per 38.1 mm (1.94 px per
    mm). Part sizes are the registry's, never the drawing's.
  face: >-
    drawing - read off Figure 42 (g050576) at 200 dpi. Status lamps at x 29.5 and y 14.4, 20.1 and 26.3
    (PWR, STS, MST) with the OFF button at y 33.0; the console jack centred 44.6, 21.6; the SMB quad at
    x 61.1, 69.2, 77.7 and 85.7 on y 22.7; the MGMT RJ-45 centred 101.7, 22.2 and the MGMT SFP centred
    123.2, 23.2 with its lamp at 123.2, 12.9; the USB port centred 145.9, 24.7; the SSD slot cover
    x 161.5 to 259.7 and y 7.7 to 36.1 with a screw at each end; the SSD lamp at 269.0, 25.8; RESET at
    286.9, 32.5; four SFP+ cages on a 15.0 mm pitch from x 303.4 centred on y 24.2, numbered 0 to 3
    with a lamp beside each numeral at y 12.9; the handles at each end. The jack and cage heights are
    modelled on one centreline each and the few-millimetre scatter of a schematic is not carried.
  which-board: >-
    drawing - this faceplate matches the board that the MX10008 and MX10016 photographs show and
    juniper/jnp10k-re1@2 does not: a PWR, STS, MST and OFF lamp column, CON, the SMB quad right of it,
    one MGMT RJ-45 and one SFP, USB, an SSD door and lamp and FOUR SFP cages numbered 0 to 3, with no
    BITS, ToD or Online/Offline hardware. Nothing here edits the MX parts; the finding is recorded for
    whoever next revisits the MX gap.
  lamp-states: >-
    datasheet - Table 33: PWR green on = adequate power, yellow blinking = error, dark = not powered;
    STS green on = online, green blinking = beacon, yellow on = booting, yellow blinking = error; MST
    green on = primary, dark = backup, so its unlit state is a reading and not an absence. Table 34 and
    Table 35 give the management port lamps and Table 36 the SSD lamp (green present, yellow active,
    dark = no drive). Blinking is not in the state vocabulary of the lamps here, so a blinking state is
    named with `behavior: blinking`.
  speed: >-
    datasheet - the management RJ-45 is 10/100/1000BASE-T (em0) and the SFP is a 1-Gigabit fibre port
    (em1), both carried as 1g. The four numbered cages are SFP+ cages at 10g that the guide marks
    "reserved for future use"; the datasheet's control board row calls them four SFP/SFP+
    MACsec-capable ports.
  media: >-
    the console is an RJ-45 serial port (media rj45-serial), as juniper/jnp10k-re1@2 types it. The SMB
    jacks are PTP connections.
  power: >-
    datasheet - Table 64 of both guides: "QFX10000-RE, QFX10000 Routing and Control Board, 50 W typical,
    100 W maximum". Carried as typical and maximum for the board alone.
  vent-field: >-
    estimated - Figure 42 and Figure 4 show a perforated field between the hardware and under the
    handles. It is drawn as a hexagon field over the whole plate behind the hardware, not hole for
    hole, and its boundary is not read from the figure.
