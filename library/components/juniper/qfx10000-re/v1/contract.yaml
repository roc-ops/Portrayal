groups:
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: the Routing Engine management cluster - the out-of-band Ethernet jack and SFP, the RJ-45
      serial console and the USB service port. One job (reaching and disciplining the box), several media
  timing:
    term: Port
    role: management
    index-origin: 0
    description: the timing block - the 1PPS and 10 MHz SMB jacks, in and out
  xge:
    term: Port
    role: management
    index-origin: 0
    attrs:
      media: sfp-plus
      speed: 10g
    description: the four numbered SFP+ cages, which the guide reserves for future use. They sit on the
      routing and control board and carry no user traffic, so they are filed with its management ports
      rather than as traffic
