    empty RCB slot; the hardware guide's Table 27 lists one in the base configuration.
  size: >-
    borrowed - juniper/qfx5700-rcb@1: a cover is the shape of the opening it covers, and the board's face (198.8 by
    30.8 mm, Tables 5 and 13) is the opening.
  face: >-
    estimated - no figure and no photograph of this blank is held (the guide's figures 8, 15 and 16 show both slots
