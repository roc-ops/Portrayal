format: 1
kind: module
name: mic6-100g-cxp
version: 1.1.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MIC6 4-port 100GbE CXP. MIC6 seats only in the MX2000 MPC6E, so only the vertical author exists.
attrs:
  model: MIC6-100G-CXP
  power-draw-max-w: 57
provenance:
  pitch-note: >-
    L81 flags this composing 4 x std/cxp@1 at 28.6mm, tighter than the
    registry's 30mm floor. This module's own `size` provenance already says
    positions are "laid out from the module reference port description and
    registry cage sizes, NOT measured from a faceplate drawing" - so 28.6mm is
    a layout guess, not a sourced figure, and it undercuts the very registry
    it claims to be derived from. Recorded rather than silently moved: nothing
    here has been checked against a real faceplate. Flagged 2026-09-13 for
    follow-up with a photo or drawing of this MIC.
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: 'datasheet-table - the module reference model section states the requirement; 57 W max'
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
states:
- ok
- fail
- absent
parts:
- {ref: std/cxp@1, id: port-0-0, at: [0.00, 21.30], rotate: 90, attrs: {media: cxp}}
- {ref: std/cxp@1, id: port-0-1, at: [0.00, 49.90], rotate: 90, attrs: {media: cxp}}
- {ref: std/cxp@1, id: port-0-2, at: [0.00, 78.50], rotate: 90, attrs: {media: cxp}}
- {ref: std/cxp@1, id: port-0-3, at: [0.00, 107.10], rotate: 90, attrs: {media: cxp}}
size:
  w: 27.0
  h: 200.0
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  w and h are a MIC-class window, not the part. Nothing measured the card: provenance/size says
  so in as many words, and #261 found the same model number drawn at two different sizes because
  two chassis have two openings. Juniper's hardware guides for the MX240, MX480 and MX960 all
  state an MPC/DPC/SCB as 17 x 22 x 1.25 in - the MX960's own book included, which is the vendor
  saying it is ONE card in both orientations - but those figures are rounded to the quarter
  inch, and 1.25 in is 31.75 mm against a modelled 30.45 mm slot pitch, so they cannot settle a
  drawing to 0.1 mm. Estimated until a mechanical drawing or a ruler on a real card turns up.
