<svg xmlns="http://www.w3.org/2000/svg" width="44.4mm" height="8.8mm" viewBox="0 0 44.4 8.8">
  <!-- Drawn from the cable end, as a front elevation sees a seated plug: a body as wide as the
       port's connector opening, then the cable. Farthest from the viewer first. Each node is
       the whole art of its relief feature. Every figure is estimated. -->
  <rect id="body" x="0" y="0" width="44.4" height="8.8" rx="4.4" fill="#26282b" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The cable. Its drawn radius is half the default cable-od (6.0); a wrapper's or a
       placement's cable-od resizes it. -->
  <circle id="stub" cx="22.2" cy="4.4" r="3.0"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
