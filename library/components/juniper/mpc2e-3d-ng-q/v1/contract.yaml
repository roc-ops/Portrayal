format: 1
kind: module
name: mpc2e-3d-ng-q
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MPC2E NG Q carrier (MX-MPC2E-3D-NG-Q) - two MIC slots, 80 Gbps with hierarchical queuing. It is not the
  MPC2E NG (juniper/mpc2e-3d-ng): it draws more power and its MIC column differs. Needs high-capacity fan trays and
  filter trays, and an SCBE-MX or SCBE2-MX, not the legacy SCB. One card for the MX240, MX480 and MX960, drawn
  horizontal; the MX960 seats it turned 90.
attrs:
  model: MX-MPC2E-3D-NG-Q
  model-variants: MPC2E-3D-NG-Q
  power-draw-max-w: 529
provenance:
  model: >-
    datasheet - MX Series Interface Module Reference, Table 4 'MPCs Supported by MX240, MX480, MX960, MX10003, MX10004, MX10016, MX2008, MX2010, and MX2020 Routers' (PDF pp. 33-34): row 'MPC2E NGQ', MPC Model Number
    MX-MPC2E-3D-NG-Q. The card's own page (printed p. 166) and the MX240 guide's FRU power table print the number
    without the MX- prefix, MPC2E-3D-NG-Q, which model-variants keeps.
  size: >-
    estimated from the family - not photographed. The plate is 396.0 x 29.5 centred in a 413.5 lever envelope, the
    figures the library draws every MPC, DPC and SCB at (mpc2e-3d-ng@1, mpc2e-3d@3; plate x px 127.5-1463.5 = 396.2 mm on the
    MX240 front photograph at 3.372 px/mm). The reference's front view of this card (printed p. 166) has no dimensions, so the envelope is the family's. Nothing here is resized.
  power: >-
    datasheet - MX240 Universal Routing Platform Hardware Guide, Table 93 'FRU Power Requirements' (printed p. 223, PDF
    p. 239): '| MPC2E NG Q | MPC2E-3D-NG-Q | 529 W With MICs and optics: 529 W at 131 F (55 C) ... |'. 529 W is the leading,
    card-alone figure of the row; the ladder under it is with MICs and optics, a different scope. The module page
    (printed p. 166) states the same 529 W as its maximum with the highest-power MICs at 55 C.
  accepts: >-
    datasheet - MX Series Interface Module Reference, 'MIC/MPC Compatibility', Table 11 'MIC/MPC2 Compatibility'
    (printed pp. 49-54, PDF pp. 58-63), the 'MPC2E -3D- NG-Q' column, restricted to the MICs this library models. Each
    listed MIC prints a release in that column: MIC-3D-20GE-SFP, MIC-3D-20GE-SFP-E, MIC-3D-2XGE-XFP, MIC-3D-4XGE-XFP,
    MIC-3D-40GE-TX, MIC-3D-4OC3OC12-1OC48 and MIC-3D-8OC3OC12-4OC48, MIC-3D-1OC192-XFP, MIC-3D-8OC3-2OC12-ATM,
    MIC-3D-4COC3-1COC12-CE, MIC-3D-4CHOC3-2CHOC12, MIC-3D-8CHOC3-4CHOC12, MIC-3D-16CHE1-T1-CE, MIC-3D-8DS3-E3 and
    MS-MIC-16G (all '14.1R4, 14.2R3 with Junos Continuity 15.1'), MIC-3D-10GE-SFP-E (24.2) and MIC-MACSEC-20GE (18.3R1).
    The MIC3 family is excluded by the card's page: 'MPC2E-3D-NG-Q does not support MIC3-3D-10XGE-SFPP,
    MIC3-3D-1X100GE-CFP, MIC3-3D-1X100GE-CXP, and MIC3-3D-2X40GE-QSFPP'. MIC-3D-40GE-TX is a 'Dual-wide MIC that installs
    into 2 slots', so it is in mic0's list only, and mic0 states `span: [mic1]`. In the column but not listed:
    MIC-3D-8CHDS3-E3-B (a variant of the listed mic-3d-8ds3-e3). Only one MS-MIC-16G can be installed into any MPC.
  numbering: >-
    guide - the reference prints small numerals beside every cage, numbered within each PIC segment with a group
    legend, never flat across the card. The MICs seated in this carrier's two bays draw those numerals; the carrier
    draws none of its own, as its figure shows none.
  levers: >-
    estimated - the figure (printed p. 166) shows one ejector lever at each end of the plate, a rounded body with a round screw head near its tip. Drawn as the library draws every MPC lever, 29.0 x 7.4 centred on the plate with
    the tip at the envelope edge, measured off the MX240 front photograph for the DPC 40xGE, DPC-R-4XGE and SCB-MX
    (97 px = 28.8 mm long, 25-27 px = 7.4-8.0 mm tall). Not remeasured on this card.
  model-name: >-
    estimated - the figure prints the model name in small type under the left lever, its callout reading MPC2E-3D-NG-Q. Placed at card x 11.4, baseline 25.5 below the plate top, where the photographed
    DPC 40xGE, DPC-R-4XGE and SCB-MX print theirs.
  status-group: >-
    estimated - the figure shows one round lamp under the left lever, right of the model name, matching the module page's 'OK/FAIL LED, one bicolor'. Placed as the photographed DPCs place theirs: the OK/FAIL legend vertical at card x
    32.3 centred on y 12.7 and the lamp below it at (32.3, 21.5).
  mic-windows: >-
    estimated - the figure shows two equal windows abutting at the plate's centre, each with a small latch at both ends and a raised tab above its outer end. Drawn at the MICs' own plate, 168.8 x 29.2, as mpc2e-3d-ng@1 draws
    them (mic0 37.7 to 206.5, mic1 207.0 to 375.8 in card x; y 0.15), the window the MX2010 front photograph measures
    on every seated carrier. The latches and tabs are not drawn.
