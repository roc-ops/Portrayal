format: 1
kind: module
name: dpce-r-40ge-sfp
version: 1.3.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper DPCE-R-40GE-SFP (Gigabit Ethernet Enhanced DPC, EOL) - 40x1GbE SFP
  in four 2x5 blocks with per-port lamp matrices between the block pairs,
  as photographed in MX240 slot 2 ("DPC 40xGE"). Ports are numbered per PIC
  (x/0..x/9, four PICs).
attrs:
  model: DPCE-R-40GE-SFP
  # FORTY 1GbE, WHICH THIS CARD'S OWN DESCRIPTION AND MODEL NUMBER BOTH SAY.
  # Without it `cage_type` finds no media attr for the `sfp` family and falls
  # through to PART_IFACE's std/sfp-ganged default, which is SFP+ - so the
  # export said forty 10G ports. Exactly the shape of roc-ops/Portrayal#23, where
  # A9K-40GE-B kept exporting 10G until its contract said `sfp: 40`.
  sfp: 40
  power-draw-max-w: 335
  lifecycle-note: EOL per PSN-TSB16810; modelled because it is the card the
    reference photograph carries
provenance:
  stack-orientation: >-
    The belly-to-belly cage pairs on this card follow the library's stack convention
    (docs/pluggables-3d-design.md, S1-S4): a row pair is the upper cage upright (rotate
    0) over the lower turned 180, so both cage lips face the band between the two cages
    and both bails face outward, where a thumb reaches them. Where this provenance
    records a reading of a stack the orientation is that reading; otherwise it is the
    rule, not an observation. A photograph of the stack that shows otherwise overturns
    it. 20 pairs were drawn with the UPPER cage turned before the std cage art moved its
    lip to the bottom of the opening; turning them to the convention keeps the lips in
    the middle band where they were drawn, and seats every optic bail-outward. Turning a
    composed cage in place changes no box, id or anything a device places, so it is a
    minor bump (S6).
  states: >-
    NO HEALTH LAMP ON THIS CARD - IT IS ON THE CRAFT INTERFACE, which is the same
    answer #212 found for the MX240's fans. MX240 hardware guide, "DPC and MPC LEDs
    on the Craft Interface": every DPC or MPC shows its status on LEDs on the craft
    interface, labelled 1/0, 1, 2 and onward, in a row along the bottom of the craft
    interface. Table 10 gives them OK green and FAIL red, and juniper/mx240-craft@1 now
    draws and lights them.
    WHAT THIS CARD DOES DRAW IS PER-PORT, NOT PER-CARD. The `indicator-panels` group
    is the dot-matrix link clusters between the block pairs - eighty of them - and
    `indicator-panels` above records why they carry no individual ids: the
    lamp-to-port mapping is not legible at photo resolution. They are link lamps for
    forty ports, not a health lamp for the card, so they were never what `ok` and
    `fail` were about.
  size: 'photo - 420.9 x 29.5 mm slot face (see scb-mx). Cage blocks measured
    at card-local x 76.8/151.2/249.6/323.7, each five sfp-ganged columns
    (registry 14.25 pitch; photo reads 14.3), two rows belly-to-belly at y
    4.5 and 16.5 (rotate 180)'
  power: 'guide Table 93 DPC section: DPCE-R-40GE-SFP 335 W maximum. The
    vendor does not qualify an ambient for the DPC rows - filed as max per
    the project rule, and this sentence is the record that max is our
    reading'
  indicator-panels: 'photo - the dot-matrix lamp clusters between block
    pairs carry the per-port link lamps; individual lamp-to-port mapping is
    not legible at photo resolution and the guide DPC LED table describes
    one link lamp per port. Drawn as the matrix panels without per-lamp ids'
states: [absent]
