behaviour: fills
profile: networking
description: >-
  QFX5220-128C-FANAO, the field-replaceable fan module of the QFX5220-128C with front-to-back airflow (AIR
  OUT, port-to-FRU). Cold air comes in at the port side and hot air leaves at the back. It is 2U high, holds
  two fans, and is marked AIR OUT on a Juniper gold handle. It is hot-removable and hot-insertable. The
  QFX5220-128C takes six, numbered 0 to 5 from the top left, three on each of two rows. It runs on eleven
  of its twelve fans, (5x2+1)+1. The 128C is not sold with back-to-front airflow, so no AIR IN sibling
  exists. The status lamp is on the chassis strip beside each module, not on the module.
attrs:
  model: QFX5220-128C-FANAO
  airflow: front-to-back
  power-draw-max-w: 80
provenance:
  size: >-
    drawing - the guide's figure 32 (g051151, the flat FRU panel of the QFX5220-128C): the body is 1415
    px wide and 565 px high against the table's 439.9 x 174.8 mm, an aspect of 2.504 against 2.517, so the
    figure carries geometry. At 3.217 px/mm across and 3.233 down the orange outline of the module
    measures 80.0 mm by 81.5 mm (256 and 263 px), on a 90.0 mm pitch across and an 85.4 mm pitch down.
    The ribbon clips stand a little past the outline at each end, and are inside this size. The guide
    states no dimension for the module.
  depth: >-
    not stated. Searched the QFX5220 hardware guide (figures 25 to 27 and 32 are a photograph, a flat face
    and an airflow drawing with no scale) and its physical specifications. No depth is written rather than
    a guessed one.
  face: >-
    drawing - figure 32 and the photograph of figure 13 agree on what is on it: a captive screw at the top
    left, a hex grille above and another below a bow-tie handle band, a grey AIR OUT chip with a fan symbol
    in the middle of the band, and a ribbon clip at each end of the band. Positions are read off figure 32
    at 4 times zoom and are estimated to about 0.4 mm. The colour is the QFX5130-32CD fan module's orange,
    which the photograph agrees with; it is a colour read and not sampled here.
  airflow: >-
    datasheet - guide Tables 3 and 16 and the cooling-system text: the 128C is available with ports-to-FRU
    airflow (AIR OUT) only, marked AIR OUT on the orange (Juniper gold) handle.
  power: >-
    datasheet - the guide's QFX5220-128C Cooling System Description calls them "six 80-W fan modules". The
    guide gives no measured draw. 80 W is therefore a rating, filed as the module's maximum draw and not
    as a measured one. The 32CD fan modules carry no figure in the guide.
