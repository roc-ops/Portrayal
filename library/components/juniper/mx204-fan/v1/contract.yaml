format: 1
kind: module
name: mx204-fan
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  Hot-swappable fan module for the Juniper MX204. Three sit across the rear,
  numbered 0 to 2 left to right (rear aspect); the guide requires all three
  operational on a fully configured router. Orange handle bar across the
  middle with a grey AIR OUT chip, honeycomb grilles above and below, black
  captive thumbscrew at the top left. Airflow is front-to-back (air out at
  this face). The fan status LED is on the CHASSIS strip beside each bay, not
  on the module.
attrs:
  model: MX204 Fan Module
  power-absent: not-published
  airflow: front-to-back
provenance:
  power: >-
    NOT PUBLISHED. The chassis guide for this part is staged and converted, its FRU power
    requirements table is present, and THIS PART IS NOT IN IT - which is a stronger
    statement than the figure merely being absent: the vendor tabulated the components it
    budgets for and did not tabulate this one. Searched beyond that table as well - all 573 converted documents, for this part, with a twelve-line window either side and a
    thirty-line window against any line introducing a power requirement or consumption. No
    wattage falls near a mention anywhere.
  face: 'drawing + photo - the visible face is the drawing aperture, 42.0 x 38.5 mm:
    guide fig g009862 measured at 6.0 px/mm (x anchored to the 482.3 mm chassis)
    gives three apertures of ~40-42 mm on a 49.1 mm pitch, and the DAM rear
    photograph shows the orange module face filling that aperture. NOTE Table 19
    states the fan module envelope as 1.89 x 1.64 x 5.78 in (48.0 x 41.7 x 146.8
    mm) - 6 mm wider than the visible face. The 48.0 must include body rails or
    flange behind the panel; recorded as a gap on the device rather than forcing
    either number onto the other'
  depth: 'datasheet-table - 146.8 mm (Table 19, 5.78 in). This is the envelope
    depth; no drawing of the body exists in the intake'
  elements: 'photo - mx204-rear-high.jpg: grille positions are x-fractions off the
    600 dpi render of g009862 (top grille rel x 7.7 w 25.0, bottom rel x 5.9
    w 28.2, both h 10.6); the orange handle band, AIR OUT chip, side tabs and
    the top-left thumbscrew are placed from the photograph. Colour is the
    photograph''s Juniper orange (#e8731f) and charcoal'
  power-draw: 'NOT STATED - the guide''s power planning chapter (Tables 28, 31-33)
    gives only whole-chassis figures. Searched the MX204 guide doc.md for
    "Power Requirement", "fan" near watt figures, and the family datasheet;
    no per-module figure exists in the intake. L27 stands deliberately'
states:
