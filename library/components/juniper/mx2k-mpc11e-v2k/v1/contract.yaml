format: 1
kind: module
name: mx2k-mpc11e-v2k
version: 1.4.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MX2K-MPC11E fixed MPC for the MX2010/MX2020 - forty QSFP28 cages in four five-row PIC segments. Authored as the MX2000 vertical form, seated through its adapter card (jacks turned on their side - rotate 90, and 270 for the left cage of each belly-to-belly pair).
attrs:
  model: MX2K-MPC11E
  power-draw-max-w: 1980
  qsfp28: 40
provenance:
  qsfp28-rate: >-
    module reference, 'MX2K-MPC11E Port Panel' (p226) and 'QSFP Transceivers and Port Speeds' (p227):
    'The MX2K-MPC11E port panel has 40 rate-selectable (multi-rate) ports that support quad small
    formfactor pluggable plus (QSFP28) transceivers', 'You can plug 100-GbE optics into any of the 40
    ports', and Table 30 gives port 0 of each of the eight PICs 40, 4x10, 100, 4x100 and 400 Gbps and
    ports 1-4 100 Gbps. The book states 400-Gbps for port 0 but does not name any port QSFP56-DD (its
    hardware-features list says '400-Gbps with multi-rate QSFP56-DD interfaces' without naming ports), so
    all forty are counted as QSFP28 and none is split.
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): on a card
    drawn on its side a pair sits left and right, the left cage 270 beside the right 90,
    so both cage lips face the band between the two cages and both bails face outward.
    Decided by the rule, not an observation, so a photograph of the stack overturns it:
    the 20 QSFP pairs (port-0-1/port-0-0 to port-3-9/port-3-8). Turning a composed cage
    in place changes no box, id or anything a device places, so it is a minor bump (S6).
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. The MX2K-MPC11E figure g100786 shows the four five-port PIC segments this layout follows'
  power: >-
    guide FRU power table (Component | Model Number | Maximum Power Requirement), MX chassis
    guides: '| MPC | MX2K-MPC11E | 1980W * 10 = 19800W |'. The row carries its own
    arithmetic and it checks twice: 1980x10=19800 in the MX2010 guide (ten slots) and
    1980x20=39600 in the MX2020 guide (twenty). The typical figure of 1800 W is printed
    beside it and is explicitly labelled '(Typical)', which is the number this key is
    not.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
  groups: >-
    Juniper MX Series 5G Universal Routing Platform Interface Module Reference, 'MX2K-MPC11E
    Modular Port Concentrator' (printed pages 221 to 231): 'The MX2K-MPC11E port panel has 40
    rate-selectable (multi-rate) ports'. Table 30 gives port 0 of each of eight five-port PICs
    40, 4x10, 100, 4x100 and 400 Gbps and ports 1 to 4 100 Gbps. The contract's port ids number
    four rows of ten and do not say which cage is port 0 of its PIC, so no rate is stated for
    the group: a rate on all forty would be wrong for eight of them. The book names no role for
    the ports; the role follows the job, a network interface a transceiver is plugged into, so
    it is traffic. Ids port-P-N number the drawn
    cages (port-0-0 to port-3-9), not the faceplate labels, which the book gives as the PIC and the
    port in it (0/0 to 7/4).
states:
- ok
- fail
- absent
