format: 1
kind: module
name: qfx3500-mb
version: 1.0.0
class: control-panel
behaviour: fills
profile: networking
description: >-
  QFX3500-MB, the RJ-45 management board with FRU-to-port airflow. It is the field-replaceable unit in
  the middle of the FRU side of a QFX3500, between the two fan trays. Its faceplate carries the LCD
  that shows the host name and the number of active alarms, the Power, Status and Fan lamps, a USB
  port, the RJ-45 console port and two 1000BASE-T RJ-45 management ports, C0 and C1. Two fan modules
  inside the board cool the chassis. Unlike the power supplies and the fan trays, the board is not
  hot-swappable: the switch must be powered off to replace it. The three sibling boards are
  QFX3500-MB-RJ45-AFO (the same board with port-to-FRU airflow), QFX3500-MB-SFP-AFI and
  QFX3500-MB-SFP-AFO (two 1 Gbps SFP management ports in place of the two RJ-45 ones). A board only
  fits a chassis of its own airflow, so this one fits the QFX3500-48S4Q-AFI and -ACR.
attrs:
  model: QFX3500-MB
  airflow: back-to-front
  power-absent: not-published
provenance:
  size: >-
    drawing - QFX3500 Device Hardware Documentation (modified 2018-07-03), figure 5, the flat drawing of
    the FRU side (page 27, drawing g050012). The body of that drawing measures 309.72 x 31.66 pt for the
    table's 17.4 x 1.74 in (aspect 9.78 against 10.0, 2.2 percent out), so each axis is scaled to its
    table figure, 1.427 mm/pt across and 1.396 down. The board is the part between the two divider
    strips, 93.7 pt across and 29.1 pt high, 133.7 x 40.6 mm, drawn here 133.4 mm so that it abuts the
    right-hand fan tray. Good to about 1 mm. No document gives the board's size in millimetres.
  depth: >-
    estimated - not stated. The guide's figures 11 and 14 are isometric drawings with no scale and no
    table gives a depth, so none is written.
  face: >-
    drawing - figure 5 (flat) for the arrangement and the positions, read at the same scale as the size:
    the USB port at the left, the LCD window and the model name above it, C0 and C1 side by side below
    the window, three lamps (Power, Status, Fan) in a column at the right of the window with their icons
    and the legend OK/!, the console jack at the right of the lamps with the letters CON beside it,
    hexagonal grilles at both ends and a long slot at the lower left and another at the lower right. The
    lamp centres were read from the drawing's lamp circles, 3.35 pt apart, 4.7 mm. Figure 11
    (isometric, no scale) agrees on what is there. The two slots are drawn as plain slots: the guide does
    not name them. The Junos mark beside the lamps is a logo and is not drawn.
  logo-zone: >-
    estimated - reserved, not drawn. Figure 5 draws the maker's wordmark at the upper left of the board,
    about 25 x 11 mm. The library reproduces no vendor logo.
  airflow: >-
    datasheet - guide, Table 10 (page 34) and Table 13 (page 40): QFX3500-MB, the RJ-45 management
    board, is FRU-to-port. The guide gives the other three boards port-to-FRU or FRU-to-port airflow the
    same way, and says a board can only be inserted into the model that supports the same airflow type.
  power: >-
    not published. Searched the QFX3500 hardware guide near its management board, Table 5 (weights) and
    the power tables 25 and 27: only whole-switch figures exist. The module declares power-absent so
    the missing figure is a statement and not a silence.
  speed: >-
    datasheet - guide, Management Board for a QFX3500 Device (page 32): the RJ-45 board provides two
    1000BASE-T RJ-45 management ports. The lamps follow the guide's Table 11: link speed green at 1 Gbps
    and amber at 10 or 100 Mbps, activity flickering green.
states: [absent]
groups:
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band cluster of the management board: two RJ-45 management ports, an RJ-45 console
      port and a USB port. Three kinds, one purpose: reaching and recovering the switch when the data
      plane cannot.
