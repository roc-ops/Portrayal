- {ref: common/rj45-ganged-eth@1, id: c1, group: mgmt, at: [68.6, 27.1], attrs: {speed: 1g, media: rj45, function: out-of-band management C1}}
- {ref: std/rj45-ganged@2, id: console, group: mgmt, at: [104.65, 11.6], attrs: {media: rj45-serial, function: serial console}}
