format: 1
kind: module
name: mic-3d-2xge-xfp
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper 2-port 10GbE MIC with XFP. MIC form (168 x 27 window; the earlier 31 mm reading was the bay opening with bezel - a MIC must seat inside the 29.5 mm MPC face, so the window is 27).
attrs:
  model: MIC-3D-2XGE-XFP
  power-draw-max-w: 29
provenance:
  pitch-note: >-
    L81 flags this composing 2 x std/xfp@1 29mm apart against xfp's registry
    pitch of 23.5mm. standards.yaml's xfp entry documents its 23.5mm pitch as
    a floor: INF-8077i section 6.8 calls it "sufficient for most systems" and
    both bezel figures label it "minimum pitch illustrated" - a device may sit
    its ports wider. This device sits 29mm, wider than the floor rather than
    off it, so the gap here is a deliberate layout choice, not drift.
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. No faceplate figure was usable for this model'
  power: >-
    guide FRU power table, MX chassis guides: '| 10-Gigabit Ethernet MIC with XFP | 2-Port:
    MIC-3D-2XGE-XFP 4-Port: MIC-3D-4XGE-XFP | 2-Port:29W 4-Port:37W |'. Read by matching the
    row's own N-Port label rather than by position, because one row carries both cards and
    both figures; the alignment self-checks, 2-port 29 W against 4-port 37 W. NO AMBIENT IS
    STATED for this row - unlike most of the tables around it, which give a 25/40/55 C
    ladder - so none is recorded rather than invented.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
states:
- ok
- fail
- absent
parts:
- {ref: std/xfp@1, id: port-0-0, at: [16.00, 8.65], attrs: {media: xfp}}
- {ref: std/xfp@1, id: port-1-0, at: [45.00, 8.65], attrs: {media: xfp}}
size:
  w: 168.0
  h: 27.0
