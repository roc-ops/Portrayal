format: 1
kind: module
name: ms-dpc-v960
version: 1.1.1
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper Multiservices DPC (MS-DPC, EOL) - a services card with no network ports.
attrs:
  model: MS-DPC
  power-draw-max-w: 265
provenance:
  size: 'registry + layout - the face is the slot geometry of its chassis
    family; positions are laid out from the module reference port
    description and registry cage sizes, NOT measured from a faceplate
    drawing. service card - a plain vented face'
  power: >-
    guide FRU table - MX240 guide Table 93 'FRU Power Requirements', Dense Port Concentrators
    section: '| Multiservices DPC | MS-DPC | 265W |'. A maximum for the card alone. No DPC row in
    that table prints a temperature ladder, so there is no ambient to name and none is claimed.
    mx240, mx480 and both halves of the mx960 guide print the identical row.
  numbering: 'guide - ports number within each PIC group with an n/ group
    legend, per the module reference port-numbering figures (g000930,
    g100786); the exact print positions are layout-derived'
states:
- ok
- fail
- absent
size:
  w: 30.1
  h: 405.0
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  w and h are the MX960 vertical card slot opening (that chassis's own bays are 30.1 x 405.0),
  not the part. Nothing measured the card: provenance/size says so in as many words, and #261
  found the same model number drawn at two different sizes because two chassis have two
  openings. Juniper's hardware guides for the MX240, MX480 and MX960 all state an MPC/DPC/SCB as
  17 x 22 x 1.25 in - the MX960's own book included, which is the vendor saying it is ONE card
  in both orientations - but those figures are rounded to the quarter inch, and 1.25 in is 31.75
  mm against a modelled 30.45 mm slot pitch, so they cannot settle a drawing to 0.1 mm.
  Estimated until a mechanical drawing or a ruler on a real card turns up.
