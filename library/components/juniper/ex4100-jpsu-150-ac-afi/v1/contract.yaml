format: 1
kind: module
name: ex4100-jpsu-150-ac-afi
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper JPSU-150-AC-AFI, the 150 W AC power supply of the EX4100-48T-AFI, back-to-front airflow (AFI).
  It is the airflow-in twin of JPSU-150-AC-AFO. The switch ships with one in power supply slot 0 or 1 and
  takes a second. The face has a fan, a blue release latch, two lamps (DC OK and AC OK) and a C14 inlet
  turned portrait. Airflow is back to front, marked AIR IN. Do not mix it with a supply or a fan module
  of the other direction, or with a DC supply.
attrs:
  role: ac-power-supply
  power-output-w: 150
  input: 100 through 127 VAC low line, 200 through 240 VAC high line, 50 or 60 Hz
  input-current: 3 A at low line, 1.5 A at high line
  airflow: back-to-front
  weight-kg: 0.65
part-numbers:
  JPSU-150-AC-AFI: {part: JPSU-150-AC-AFI}
provenance:
  sources: >-
    datasheet - EX4100 Switch Hardware Guide (Juniper Networks, PDF created 2026-10-01): Table 29, Table 31,
    Table 34 (airflow), Table 40 (the lamps), Figure 43 (the 150 W supply, listed for the EX4100-48T,
    EX4100-24T and EX4100-48T-AFI alike) and the Table 20 note (size and weight).
  size: >-
    datasheet - Table 20 note: power supply width 2.87 in. (7.3 cm), height 1.57 in. (4 cm), depth 8.86
    in. (22.5 cm), one set for every supply. Carried as 73.0 by 40.0 by 225.0 mm, as for
    juniper/ex4100-jpsu-150-ac-afo@1. No photograph or render of the AFI unit is held.
  depth: datasheet - Table 20 note, 8.86 in. (22.5 cm), carried as 225.0 mm.
  power-output-w: >-
    datasheet - Table 31: output power 150 W. An output figure, because a supply provides power. The guide
    gives no draw or loss figure for the unit.
  input: >-
    datasheet - Table 31: low-voltage line 100 to 127 VAC at 3 A, high-voltage line 200 to 240 VAC at 1.5 A.
  part-number: >-
    datasheet - Table 29 and Table 34 name the supply JPSU-150-AC-AFI. Table 64 prints the CLI name
    JPSU-150W-AC-AFI. Table 29 is the supply's own table, so its spelling is used. It is also named
    JPSU-150-AC-AFI in the EX3400 line (juniper/ex3400-jpsu-150-ac-afi@1).
  airflow: >-
    datasheet - Table 34: back to front, label AIR IN. Table 27 says the EX4100-48T-AFI ships its fan modules
    and its supply with the label AIR IN and a blue handle.
  leds: >-
    datasheet - Table 40, as for the AFO unit: AC OK and DC OK, green when good, red when failed.
  face: >-
    estimated - drawn as juniper/ex4100-jpsu-150-ac-afo@1, whose positions were read off the rear render of
    the EX4100-24P, with the label AIR IN and the blue latch that Table 27 names. The guide states no
    shade; the blue is the library's own (#3d7bd6). Figure 43 is one drawing for the AFO and AFI units.
  power: >-
    datasheet - see power-output-w. No source in the guide states a figure for what the unit itself draws.
states:
- ok
- fault
- absent
parts:
- {ref: std/c14-inlet@1, id: inlet, at: [40.85, 12.8], rotate: 90}
elements:
  led-dc:
    at: [43.0, 2.0]
    size: [2.4, 2.4]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: red, color: '#e03a2f'}
    - 'off'
  led-ac:
    at: [63.3, 2.0]
    size: [2.4, 2.4]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: red, color: '#e03a2f'}
    - 'off'
  latch:
    at: [31.0, 1.1]
    size: [10.4, 38.7]
    class: latch
size:
  w: 73.0
  h: 40.0
  d: 225.0
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
relief:
  features:
  - node: latch
    out: 1.6
    color: '#3d7bd6'
    confidence: estimated
    source: figure - the latch stands proud; projection not measured
connection-points:
  power: {at: [54.85, 22.8], direction: rear}
body:
  depth: 225.0
  color: '#b9bec4'
skins: [default]
