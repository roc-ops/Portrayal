format: 1
kind: module
name: dpce-r-40ge-sfp-v
version: 2.1.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper DPCE-R-40GE-SFP as mounted in the MX960 - the same 40x1GbE DPC
  the MX240/MX480 seat horizontally, authored vertically for the MX960's
  card cage: four banks of ten SFP cages in two columns of five, every
  cage a single std/sfp rotated 90 (270 for the left cage of each belly-to-belly pair). Ports are numbered per PIC
  (x/0..x/9, four PICs), the same scheme the horizontal author uses.
attrs:
  sfp: 40
  model: DPCE-R-40GE-SFP
  power-draw-max-w: 333
provenance:
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): on a card
    drawn on its side a pair sits left and right, the left cage 270 beside the right 90,
    so both cage lips face the band between the two cages and both bails face outward.
    Decided by the rule, not an observation, so a photograph of the stack overturns it:
    the 20 SFP pairs (port-0-0/port-0-1 to port-3-8/port-3-9). Turning a composed cage
    in place changes no box, id or anything a device places, so it is a minor bump (S6).
  sfp-rate: >-
    the cage RATE, transcribed from this contract's own description: 'the same 40x1GbE DPC
    the MX240/MX480 seat horizontally'. Without it `cage_type` finds no media attr for the
    sfp family and falls through to PART_IFACE's default, which is SFP+ at 10G - a rate this
    card does not run. Nothing new was measured.
  size: 'photo - the studio front photograph at ~2.07 px/mm: the card cage is ~405 mm tall and fourteen slots share the 441 mm width on a ~30.1 mm pitch; positions approximate to ~2 mm. No vendor card dimension in the extraction'
  power: 'datasheet-table - the MX240 extraction gives the 40x1GE DPC
    333 W maximum; the module is the same FRU'
  orientation: 'the horizontal sibling juniper/dpce-r-40ge-sfp@1 carries
    the measured faceplate; this vertical author is the same hardware
    rotated, kept separate because bays cannot rotate their occupants'
states:
- ok
- fail
- absent
