format: 1
kind: module
name: qfx3600-qfxc01-fanbo
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  QFXC01-FANBO, a field-replaceable fan tray with port-side-to-FRU-side airflow. Cold air comes in at the
  port end of the switch and hot air leaves at the FRU end. The tray holds two fan modules and has a
  single lamp, green when the tray is healthy and blinking amber on an error. It is hot-removable and
  hot-insertable, and one fan module cannot be replaced alone. The QFX3600 hardware guide gives it
  to the QFX3600-16Q-AFO and the QFX3600-I-16Q-AFO. The chassis seats three, in slots 0 to 2 from left
  to right between the two power supplies. The front-to-back and back-to-front trays are never mixed
  in one chassis, and never with power supplies of the other direction. The back-to-front sibling is
  QFXC01-FANBI.
attrs:
  model: QFXC01-FANBO
  airflow: front-to-back
  power-absent: not-published
provenance:
  size: >-
    drawing - QFX3600 Device Hardware Documentation (modified 2018-07-03), figure 4, the flat drawing of the
    FRU side (page 27, drawing g050203). The body of that drawing measures 304.13 x 30.48 pt for the table's
    16.9 x 1.74 in (aspect 9.98 against 9.71, 2.8 percent out), so each axis is scaled to its table
    figure, 1.4106 mm/pt across and 1.450 down. The tray is the frame of 56.7 x 28.7 pt, 80.0 x 41.6
    mm, three of them on a 61.2 pt, 86.3 mm pitch. Good to about 1.5 mm, because of the disagreeing
    aspect. No document gives the tray's size in millimetres.
  depth: >-
    estimated - not stated. The guide's figure 8 is an isometric drawing with no scale and no table gives a
    depth, so none is written.
  face: >-
    drawing - figure 4 (flat) draws a hexagonal grille across the upper two thirds of the tray and a band
    along its foot carrying two small squares. Figure 12 (isometric) names a lamp and a handle on the
    tray (callouts 1 and 2) and does not say which square is which. The left square is drawn as the
    lamp and the band as the handle, which is estimated.
  colour: >-
    estimated - the guide prints no colour for the fan tray (it gives gold and blue handles to the power
    supplies only). A neutral grey is drawn. No photograph of this tray is held.
  airflow: >-
    datasheet - guide, Table 12 (page 36): QFXC01-FANBO is port-side-to-FRU-side. In the guide's words AFO is
    airflow out, which is port-to-FRU, and AFI is FRU-to-port.
  power: >-
    not published. Searched the QFX3600 hardware guide near its fan sections, Table 5 (weights) and the
    power tables 23 and 25: only whole-switch figures exist. The module declares power-absent so the
    missing figure is a statement and not a silence.
states: [absent]
