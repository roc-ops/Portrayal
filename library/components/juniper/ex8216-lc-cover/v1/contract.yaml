description: >-
  Line card cover panel of the Juniper EX8216: a plain horizontal plate that fills one of the sixteen line card
  slots (0 to 15) when no line card is fitted. Every shipping order carries sixteen of them and no line cards.
states: [absent]
size:
  w: 386.9
  h: 35.0
size-confidence: {w: estimated, h: estimated}
provenance:
  sources: >-
    datasheet - EX8216 Switch Hardware Guide (PDF dated 2020-12-16), Table 5: the base order lists "16 line card
    cover panels" and each redundant order the same, and the note says line cards must be ordered separately.
    The guide names no part number for the cover and draws none.
  size: >-
    estimated - the bay's own size: the slot opening runs from the fan tray's right edge to the body's right
    edge, 386.9 mm, and 35.0 mm of the 38.2 mm slot pitch, read off Figure 5 (flat, 2.753 px/mm anchored on the
    17.3 in body). No document dimensions the cover.
  face: >-
    estimated - no drawing or photograph of the cover is held; a plain plate with a pull at each end, as the
    EX8208's. The outline is sourced and the detail is not.
