format: 1
kind: module
name: mx2000-craft
version: 1.1.0
class: display
behaviour: fills
profile: networking
description: >-
  Juniper MX2000 craft interface - the status panel at the top of the
  MX2010/MX2020 front: SFB 0-7 and CB-RE lamp rows, RE master/online/
  offline column, alarm lamps with the relay block and ACO button, and
  an OK/FAIL pair per line-card slot along the bottom strip.
attrs:
  model: MX2000 Craft Interface
  power-absent: not-published
provenance:
  lamp-states: >-
    THIRTY-FIVE LAMPS WERE DRAWN AND COULD NOT LIGHT - L47's first shape, the same
    one the MX240, MX480 and MX960 panels had. Each fills from the LED variable now
    with its drawn colour as the unlit fallback, so an unlit panel is unchanged.
    THE VOCABULARIES ARE THE MX2010 GUIDE'S, which is the book this face was
    measured against: Table 12 (host subsystem), Table 14 (line-card), Table 15
    (SFB) and Table 18 (alarm). Green for functioning, red for failed, and both the
    line-card and SFB lamps BLINK while the card transitions, in identical words.
    THE RE COLUMN IS ORDERED BY ITS OWN SILKSCREEN, not by the index: led-re-0 at
    cy 25.8 sits under MASTER at y 26.5, -1 under ONLINE, -2 under OFFLINE. So -0
    and -1 are green and -2 is red, which is Table 12.
    ONE LAMP PER SFB, NOT A PAIR. The guide calls it "one tricolor LED" and then
    tabulates two labels for it, OK and FAIL, so the single drawn lamp carries
    green, blinking and red rather than the ok/fail pairs the line cards have.
  yellow-alarm-had-no-id: >-
    THE PANEL DREW A WARNING ALARM AND NEVER NAMED IT - the same omission the MX960
    had. The triangle was there in #f2c93c as a path with no id, so it was not a
    lamp and could not light, while the red alarm beside it had been named. Table 11
    lists MINOR ALARM and MAJOR ALARM as separate functions and Table 18 gives the
    yellow one its behaviour. It is `led-yellow-alarm` now.
  cb-re-lamps-have-no-published-vocabulary: >-
    DRAWN, CONTRACTED, AND DELIBERATELY SILENT. led-cbre0 and led-cbre1 sit under
    the CB-RE 0 and CB-RE 1 silkscreen and the guide names them - Table 11 function
    9, "Status LEDs for the two CB-REs cards" - and then tabulates no colours for
    them anywhere in the craft-interface section, whose contents list runs host
    subsystem, power supply module, line-card, SFB and fan tray and stops.
    TABLE 22 IS NOT THEIR TABLE. It is headed CB-RE LEDs and gives ONLINE green,
    MASTER blue and OK/FAIL red - but it sits in the CB-RE card's own section and
    includes a LINK lamp for the card's SFP+ ports, which the craft interface does
    not have. Reading it as the craft lamp's vocabulary would be citing the card's
    faceplate for the panel above it. They carry no states until something states
    them; two lamps that cannot light is the honest report, and inventing green and
    red for them would be a convention wearing a citation.
  drawn-rows-are-a-summary: >-
    WHAT THIS PANEL OMITS, said plainly because the lamp list now makes it
    countable. Table 11 gives the real craft interface PSM lamps 0-8, fan-tray lamps
    0-3 and TWO host-subsystem columns (RE0 and RE1, three lamps each). This face
    draws none of the first two and one column of the second - `face` above already
    called the rows "summarised" - because it was measured from studio photographs
    at ~1.1 px/mm where those rows are not resolvable. Adding them would be
    inventing positions. It is one component shared by the MX2008, MX2010 and
    MX2020, and the ten line-card lamps are the MX2010's ten slots.
  size: 'photo - the MX2010 studio photographs at ~1.1 px/mm; positions approximate to ~3 mm, and no vendor module dimension is in the extraction'
  power: >-
    NOT PUBLISHED. This contract's model field reads 'MX2000 Craft Interface', which is a
    description rather than a part number, and that is why earlier searches found the part
    in no document at all. Juniper's own numbers for it are MX2010-CRAFT-S and MX2020-CRAFT-S,
    both of which DO appear in the corpus - and neither carries a wattage anywhere. The
    craft interface is named only inside base-system bundles: 'Base system (not including
    MPCs, ADCs, and MICs) includes seven SFBs, one host subsystem (CB-RE), two fan trays,
    and craft interface, three PSMs, and two PDMs' against a single combined figure. So the
    vendor budgets it as part of a bundle and never on its own. Searched all 573 converted
    documents across every corpus - not only the image sets - for all three names, with a
    twelve-line window either side. The same result for the MX240, MX480 and MX960 craft
    interfaces, whose guides tabulate FRU power and omit them.
  face: 'photo - lamp rows summarised; the alarm relay wiring block is
    drawn as its green block. The model legend beside the brand differs
    per chassis (MX2008/MX2010/MX2020) and is OMITTED rather than
    printed wrong on two of the three'
