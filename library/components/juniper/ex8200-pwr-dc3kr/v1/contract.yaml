    states: ['off', {name: ok, color: '#22c55e'}, {name: fuse, color: '#eab308'}, {name: reversed, color: '#ef4444'}]
  led-b-in-ok:
    at: [35.5, 30.0]
    size: [2.0, 2.0]
    class: led
    states: ['off', {name: ok, color: '#22c55e'}, {name: fuse, color: '#eab308'}, {name: reversed, color: '#ef4444'}]
  handle:
    at: [8.0, 94.5]
    size: [22.0, 6.0]
    class: latch
  screw:
    at: [44.0, 89.7]
    size: [5.2, 5.2]
    class: screw
size:
  w: 70.1
  h: 104.0
size-confidence: {w: estimated, h: estimated}
