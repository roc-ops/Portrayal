format: 1
kind: component
name: ex4100-mode-button
version: 1.0.0
class: button
profile: networking
description: >-
  Factory Reset/Mode button of the Juniper EX4100 switches, below the port mode lamps at the right of the front
  panel. A round light-blue button. The guide says the button toggles the port mode lamps (SPD, DX, EN and PoE) to
  show the speed, duplex, administrative status and PoE state of the network ports, and calls it the
  Factory Reset/Mode button.
attrs:
  function: factory reset and port mode
provenance:
  sources: >-
    datasheet - EX4100 Switch Hardware Guide (Juniper Networks, PDF created 2026-10-01). Figures 3, 12 and 16, callout 5,
    Factory Reset/Mode button; Figure 32 and Table 25: use the mode button on the right side of the front panel to toggle
    the status lamps, the one lit being the parameter shown. The guide describes no reset action beyond the name.
  size: >-
    estimated - read off Figure 1, the front render of the EX4100-24P (1500 px across for 440.9 mm of body, 2.957 px/mm).
    The disc is about 16 px, 5.4 mm, across. No dimension is stated in any source.
  face: >-
    estimated - a flat disc, #a2e7fc as the render shows it. The list symbol printed to its right in Figure 32 is chassis
    silkscreen and is drawn on the device, not here.
size:
  w: 5.4
  h: 5.4
size-confidence: {w: estimated, h: estimated}
skins: [default]
