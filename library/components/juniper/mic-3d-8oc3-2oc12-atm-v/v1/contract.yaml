- {ref: std/sfp-ganged@1, id: port-0-4, at: [12.07, 46.42], rotate: 90, attrs: {media: sfp}}
- {ref: std/sfp-ganged@1, id: port-0-7, at: [1.07, 62.27], rotate: 270, attrs: {media: sfp}}
