<svg xmlns="http://www.w3.org/2000/svg" width="32.6mm" height="27.7mm" viewBox="0 0 32.6 27.7">
  <!-- The QFX524X DC supply's power connector seen from its mating face: the housing and six round cells in two rows of three.
       Shapes and colours are those the supply's own skin drew before it composed this part. -->
  <rect id="body" x="0" y="0" width="32.6" height="27.7" rx="1.4" fill="#2b2e32" stroke="#0e0f11" stroke-width="0.4"/>
  <g id="cells" fill="#15161a" stroke="#b8bbc0" stroke-width="0.35">
    <circle id="cell-t1" cx="9.6" cy="7.2" r="2.9"/>
    <circle id="cell-t2" cx="18.1" cy="7.2" r="2.9"/>
    <circle id="cell-t3" cx="27.0" cy="7.2" r="2.9"/>
    <circle id="cell-b1" cx="9.6" cy="20.5" r="2.9"/>
    <circle id="cell-b2" cx="18.1" cy="20.5" r="2.9"/>
    <circle id="cell-b3" cx="27.0" cy="20.5" r="2.9"/>
  </g>
  <g id="contacts" fill="#8a8d93">
    <circle cx="9.6" cy="7.2" r="1.3"/>
    <circle cx="18.1" cy="7.2" r="1.3"/>
    <circle cx="27.0" cy="7.2" r="1.3"/>
    <circle cx="9.6" cy="20.5" r="1.3"/>
    <circle cx="18.1" cy="20.5" r="1.3"/>
    <circle cx="27.0" cy="20.5" r="1.3"/>
  </g>
</svg>
