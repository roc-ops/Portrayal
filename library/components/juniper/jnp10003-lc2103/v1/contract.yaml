format: 1
kind: module
name: jnp10003-lc2103
version: 1.4.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Juniper MX10003 MPC (JNP10003-LC2103) - the full-width line card: MIC1
  slot at the left (JNP-MIC1 by default), six fixed QSFP+ ports 0-5 with
  the GM/PTP timing jack at the right, blue ejector levers both ends. The
  -V2 model shares the faceplate.
attrs:
  qsfp: 6
  model: JNP10003-LC2103
  model-variants: JNP10003-LC2103-V2
  power-draw-max-w: 715
provenance:
  lamp-states: >-
    TWO LAMPS AND A BUTTON, which is not how they were named. All three were flat
    fills under the OK/FAIL, ONLINE and OFFLINE silkscreen, and `led-offline` is not
    a lamp at all: the guide describes taking a card offline as "Press its OFFLINE
    button. Use a narrow-ended tool that fits inside the opening that leads to the
    button." It is a recessed button, and it is contracted as one. The id keeps its
    `led-` spelling because renaming an id is a major and nothing is wrong with the
    geometry - the class now says what it is.
    THE TWO REAL LAMPS ARE THE GUIDE'S OWN: Table 17 (MX10003 MPC (Multi-Rate) LEDs)
    and the identical LEDs row in this card's specification table - OK/FAIL, one bicolor
    LED: steady green = MPC functioning normally, link up; off = MPC plugged in but not
    powered on; red = MPC failed. ONLINE is green for online. Bicolor is why OK/FAIL
    carries green and red on one lamp rather than the ok/fail pairs other cards draw.
  qsfp-rate: >-
    the cage RATE, transcribed from this contract's own description: 'six fixed QSFP+ ports
    0-5'. Without it `cage_type` finds no media attr for the qsfp family and falls through
    to PART_IFACE's default, which is QSFP28 at 100G - a rate this card does not run.
    Nothing new was measured.
  size: 'datasheet-table - the guide FRU table gives the MPC 16.5 x 22.37 x
    1.65 in; 419.1 mm face width, 41.9 mm face height'
  power: 'datasheet-table - the guide power table: 660 W typical, 715 W max
    (the -V2 665/725)'
  face: 'photo - positions read off the frontwtop photograph at ~2.95 px/mm, approximate to ~2 mm; the module size itself is the vendor FRU dimension table in the MX10003 hardware guide - fixed QSFP+ on a ~23.6 mm pitch; the fixed cages are
    drawn with the QSFP28 registry opening (QSFP+ and QSFP28 share the
    SFF-8663 bezel)'
  groups: >-
    Juniper Networks MX10003 Universal Routing Platform Hardware Guide, 'MX10003 MPC
    (Multi-Rate)' (printed pages 39 to 41): 'six built-in QSFP+ optics ports', and Table 15
    ('Port Speed') prints for PIC 0, ports 0 to 5, '40 Gigabit Ethernet' and '4X10-Gigabit
    Ethernet' (the 10 Gbps by breakout cable, which is a logical interface and is not written).
    The ids port-0 to port-5 are the PIC 0 ports 0 to 5. The role is traffic: the page names no
    role for the ports, and the role follows the job, a network interface a transceiver is
    plugged into. The figure 'MX10003 MPC' (printed page 39) labels one jack 'GM/PTP' to the
    right of port 5; the text prints no rate, media, number or role for it, so its group
    `timing` states none of them. Its role is management because the component schema files the
    timing and sync interfaces there, not because the page says so.
states: [absent]
bays:
  mic1:
    at: [18.0, 0.0]
    size: [197.3, 41.9]
    accepts:
    - juniper/jnp-mic1@1
    - juniper/jnp-mic-blnk-3@1
    default: juniper/jnp-mic1@1
groups:
  qsfp-plus-40g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-plus, speed: 40g}
    description: >-
      the six fixed QSFP+ ports, PIC 0 ports 0 to 5, each at 40 Gbps
  timing:
    term: Port
    role: management
    index-origin: 0
    description: >-
      the GM/PTP timing jack at the right of port 5
parts:
- {ref: std/qsfp28@1, id: port-0, group: qsfp-plus-40g, at: [216.00, 24.0], attrs: {media: qsfp-plus}}
- {ref: std/qsfp28@1, id: port-1, group: qsfp-plus-40g, at: [239.60, 24.0], attrs: {media: qsfp-plus}}
- {ref: std/qsfp28@1, id: port-2, group: qsfp-plus-40g, at: [263.20, 24.0], attrs: {media: qsfp-plus}}
- {ref: std/qsfp28@1, id: port-3, group: qsfp-plus-40g, at: [286.80, 24.0], attrs: {media: qsfp-plus}}
- {ref: std/qsfp28@1, id: port-4, group: qsfp-plus-40g, at: [310.40, 24.0], attrs: {media: qsfp-plus}}
- {ref: std/qsfp28@1, id: port-5, group: qsfp-plus-40g, at: [334.00, 24.0], attrs: {media: qsfp-plus}}
- {ref: std/rj45@2, id: gm-ptp, group: timing, at: [363.1, 22.3], attrs: {function: GM/PTP timing}}
elements:
  led-ok-fail:
    at: [391.2, 7.2]
    size: [1.6, 1.6]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: red, color: '#d0021b'}
    - 'off'
  led-online:
    at: [391.2, 19.2]
    size: [1.6, 1.6]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  led-offline:
    at: [391.2, 31.2]
    size: [1.6, 1.6]
    class: button
size:
  w: 419.1
  h: 41.9
