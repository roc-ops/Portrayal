format: 1
kind: module
name: mx960-craft
version: 2.0.0
class: display
behaviour: fills
profile: networking
description: >-
  Juniper MX960 craft interface - the full-width status panel above the
  card cage. PEM and fan lamps, RE0/RE1 MASTER/ONLINE/OFFLINE columns,
  alarm lamps with the ACO/LT button and the yellow/red alarm relay
  blocks, and one OK/FAIL/ONLINE cluster above each of the fourteen
  slots (SCB positions print blue).
attrs:
  model: MX960 Craft Interface
  power-absent: not-published
provenance:
  lamp-states: >-
    FORTY-ONE LAMPS WERE DRAWN AND COULD NOT LIGHT. Every one was a flat fill, so
    the panel declared a lamp state, the viewer offered it and clicking it changed
    no pixel - L47's first shape. Each fills from the LED variable now with its
    drawn colour as the unlit fallback, so an unlit panel is unchanged.
    THE VOCABULARIES ARE THE MX960 GUIDE'S OWN: Table 6 (alarm), Table 7 (host
    subsystem), Table 8 (power supply), Table 9 (DPC and MPC), Table 10 (FPC),
    Table 11 (SCB) and Table 12 (fan). Green for functioning, red for failed; a
    slot's OK lamp also BLINKS while the card transitions online or offline, which
    Tables 9, 10 and 11 all state in the same words.
    THE RE COLUMNS ARE ORDERED BY THEIR OWN SILKSCREEN, not by the index in the id:
    led-reN-0 sits at cy 4.6 under MASTER at y 5.0, -1 at 9.1 under ONLINE, -2 at
    13.6 under OFFLINE. So -0 and -1 are green and -2 is red, which is Table 7.
  yellow-alarm-had-no-id: >-
    THE PANEL DREW A YELLOW ALARM AND NEVER NAMED IT. The triangle was there, in
    #f2c93c, as a path with no id - so it was not a lamp, could not light, and did
    not appear in any census of what this part shows. Table 6 gives the MX960 a
    warning alarm beside its critical one ("a serious but nonfatal error condition")
    and the relay block beside it is already labelled YELLOW ALARM. It is
    `led-yellow-alarm` now, beside the `led-red-alarm` that was named all along.
  pem-lamp-count-disagrees-with-the-guide: >-
    THE GUIDE SAYS TWO AND THE PHOTOGRAPH SHOWS ONE. MX960 guide, Table 8's
    introduction: "Each power supply has two LEDs on the craft interface that
    indicate its status." This panel draws ONE lamp per supply, four in a row at
    cy 9.5, because that is what the studio photograph this face was measured from
    shows at 2.07 px/mm. The single lamp carries both colours, which is what
    Table 8 tabulates - PEM green for normal and red for failed - so nothing is
    lost in what it can report. NOT RECONCILED BY ADDING FOUR LAMPS: the positions
    would be invented, and a drawn lamp nobody measured is worse than a documented
    disagreement. Settled by a straight-on photograph of the panel's upper left.
  guide-figure-is-the-MX240S: >-
    Figure g004306 in the MX960 guide's own Craft Interface Overview is the MX240's
    craft interface - four slot clusters with tabs 0, 1/0, 1 and 2, where an MX960
    has fourteen. Juniper reused the drawing. So this panel's LAYOUT comes from the
    photograph and only its BEHAVIOUR from the guide; the fourteen clusters are six
    line cards, the two SCBs (indices 6 and 7, the blue buttons) and six more line
    cards, which is the arrangement the slot silkscreen prints: 0-5, 0-1, 6-11.
  size: 'photo - full chassis width; ~48 mm tall at 2.07 px/mm'
  slot-clusters: >-
    photo-measured (#899) - the fourteen OK/FAIL/ONLINE clusters sit on their own pitch, not the
    slots'. On the MX960 front photograph the white ONLINE buttons centre at x px 77.4, 143.0, 207.9,
    ... 923.7, a 65.10 px pitch, while the card plates below them repeat every 64.28 px (gaps at 307,
    372, 436, 500, 565, 629, 692, 757, 822, 886, 950 at y 700); the buttons sit over slots 4-7 and
    drift outward to 2.8 mm past the outer slot centres at either end, symmetric on the panel (26.4 px
    in from its left edge, 25.0 from its right). Mapped through the slots (slot 4's centre, px 339.5,
    is chassis x 143.05; 31.0 mm per 64.28 px) the clusters centre at 16.65 + 31.40 k, k = 0-13. Until
    2.0.0 they sat at 25.05 + 30.1 k, the old 30.1 slot pitch, 6 mm right of slot 0 and 5.7 mm left of
    slot 11. Each cluster keeps its own layout, OK and FAIL lamps 5.0 either side of the button.
  power: >-
    NOT PUBLISHED. The chassis guide for this part is staged and converted, its FRU power
    requirements table is present, and THIS PART IS NOT IN IT - which is a stronger
    statement than the figure merely being absent: the vendor tabulated the components it
    budgets for and did not tabulate this one. Searched beyond that table as well - all 573 converted documents, for this part, with a twelve-line window either side and a
    thirty-line window against any line introducing a power requirement or consumption. No
    wattage falls near a mention anywhere.
  face: 'photo - the studio front photograph at ~2.07 px/mm: the card cage is ~405 mm tall and fourteen slots share the 441 mm width (the slot clusters: slot-clusters); positions approximate to ~2 mm. No vendor card dimension in the extraction'
