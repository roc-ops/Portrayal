format: 1
kind: module
name: re-s-2000
version: 2.1.0
class: supervisor
behaviour: fills
profile: networking
description: >-
  Juniper RE-S-2000 Routing Engine (RE-S-2000-4096, EOL) - 2.0 GHz, 4 GB.
  Face layout is the RE-S-1300 family faceplate: HDD/MASTER and
  OK-FAIL/ONLINE lamps, ONLINE/OFFLINE button, RESET, USB, AUX, CONSOLE and
  ETHERNET (fxp0). Photographed in the MX480's SCB 1.
attrs:
  model: RE-S-2000-4096
  power-draw-max-w: 90
  cpu: 2.0 GHz
  memory: 4 GB
  lifecycle-note: EOL per TSB16735; modelled because the MX480 reference
    photograph carries it
provenance:
  width: >-
    photo-measured (#891) - the plate runs card x 91.0-362.7 on the MX240 front photograph (3.372
    px/mm) and 91.4-363.9 on the MX480's (3.230), both seated in SCB-MX; it is drawn from the SCB bay's
    left edge, card x 91.44, to the mean right edge, 363.3: 271.9 wide. The right captive screw centres
    at card x 357.9 and 357.7 in the two photographs, y 11.5 on the MX240 (10.5 below the bay top), about
    7 mm across: drawn at plate x 266.4, y 10.5. Until 2.0.0 the plate stopped at card x 353.2, 9.5 mm
    short, and drew no right screw. Everything placed from the left edge is unchanged.
  size: 'photo - same 271.9 x 27.5 mm SCB-bay plate as re-s-1300 (width - see width); the two
    faces are identical at photo resolution except the model legend, so the
    geometry is re-s-1300''s (an echo of that measurement, not a second one)'
  power: >-
    guide FRU power table, MX chassis guides, Table 93 'FRU Power Requirements': '| |
    RE-S-1300-2048 (EOL'd) RE-S-2000-4096 (EOL'd) RE-S-1800 (all variants) | ... | 90W |'.
    One row covers three Routing Engines and states a single 90 W for all of them; it is the
    same in the MX480 and MX960 guides.
  groups: >-
    Juniper Networks, MX240 Universal Routing Platform Hardware Guide (published 2026-05-27),
    'Figure 24: RE-S-2000 Routing Engine' (printed page 65): the figure labels 'USB port',
    'Auxiliary port', 'Console port' and 'Ethernet port'; the pinout section (printed page 240)
    calls the port labelled ETHERNET an autosensing 10/100-Mbps jack for 'out-of-band
    management' and the routing-engine description a 10/100/1000-Mbps one for the families it
    covers, and neither passage is scoped to this board by name, so the Ethernet jack states a
    media and no speed, as the RE-S-1300 on the same faceplate does. The two serial jacks are
    typed rj45-serial as the sibling boards state them. The role follows the job: the page names
    no role for the ports, and the role is management because the console, auxiliary, Ethernet
    and USB jacks are how the box is reached and disciplined.
states:
- ok
- fail
- absent
groups:
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the Routing Engine management cluster - the out-of-band Ethernet jack, the RJ-45 serial
      ports and the USB service port. One job (reaching and disciplining the box), several media
parts:
- {ref: std/usb-a@1, id: usb, group: mgmt, at: [164.0, 11.5], rotate: 90, attrs: {function: USB service port}}
- {ref: std/rj45@2, id: aux, group: mgmt, at: [180, 7.15], attrs: {media: rj45-serial, function: auxiliary console}}
- {ref: std/rj45@2, id: console, group: mgmt, at: [197.4, 7.15], attrs: {media: rj45-serial, function: serial console}}
- {ref: common/rj45-eth@1, id: ethernet, group: mgmt, at: [214.9, 7.15], attrs: {media: rj45, function: fxp0 out-of-band management}}
elements:
  latch:
    at: [1.0, 6.0]
    size: [5.0, 16.0]
    class: latch
size:
  w: 271.9
  h: 27.5
size-confidence: {w: photo-measured, h: photo-measured}
