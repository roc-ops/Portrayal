format: 1
kind: module
name: ex9253-re
version: 1.0.0
class: supervisor
behaviour: fills
profile: networking
description: >-
  Juniper EX9253-RE, the Routing Engine of the EX9253, an integrated board that carries the Routing
  Engine and the Control Board functions. The faceplate has a USB port, the MGMT, CON, ToD and BITS RJ-45
  jacks, two front-pluggable SSD carriers (SSD0 and SSD1) with their lamps, the MST and ALM lamps, the
  10MHz and PPS SMB connectors in and out, and below them the RESET pinhole, the OK/FAIL and ONLINE lamps and
  the OFFLINE button. One Routing Engine is required, in slot RE0 or RE1; a redundant switch has two, one
  primary and one backup. It is hot-removable and hot-insertable.
attrs:
  role: routing-engine
  power-draw-typical-w: 58
  power-draw-max-w: 65
part-numbers:
  EX9253-RE (EX9253): {part: EX9253-RE}
provenance:
  sources: >-
    datasheet - EX9253 Switch Hardware Guide (published 2022-11-30): Host Subsystem in an EX9253 Switch,
    Figure 6 (the faceplate, drawn flat, g100174) and Figure 7 (the management port lamps), Table 6 (the
    lamps), Table 5 (size and weight), Table 4 (the CLI name) and Table 13 (power). EX9250 Ethernet Switch
    Datasheet (1000632-006-EN, Sep 2021): the integrated RE, "1.6 GHz, 8-core Intel Xeon", up to 64 GB DRAM and
    two front-pluggable SSDs of up to 100 GB each. The key of part-numbers carries the suffix (EX9253) so
    that its DCIM module type does not share a file with the same part number in another line's slice.
  size: >-
    drawing - Figure 6's faceplate outline is 1303 x 290 px, an aspect of 4.49; Table 5 gives the board
    7.98 in (20.27 cm) wide and 1.66 in (4.21 cm) high, an aspect of 4.81. The height is the table's, 42.2
    mm, and the figure then gives 189.5 mm across (6.88 px/mm). Figure 1 of the chassis agrees: each RE
    opening is 569 px, 188 mm, at 3.03 px/mm. The table's 202.7 mm is the board, which is wider than the
    faceplate. The same board size is listed for the MX10003's Routing and Control Board.
  depth: >-
    datasheet - Table 5: 22.12 in (56.18 cm). No depth is written, because the component schema has no
    depth key the explorer reads here; the figure is kept in this note.
  face: >-
    drawing - Figure 6 read at 6.88 px/mm and the position of each part in mm: USB (callout 1) 9.2 across
    and 16.7 down; MGMT 24.1 and 10.9; CON 44.3; the SSD carriers (callout 5) 57 to 88 and 90 to 121 mm
    across; the lamps SSD0, SSD1, MST and ALM at 63.3, 73.1, 93.8 and 112.3 mm across and 6.5 down; ToD 136.3
    and BITS 155.8 across; the SMB connectors (callout 10) at 169.4 and 179.6 mm across, the upper row OUT
    at 11.6 mm down and the lower row IN at 21.8; RESET (79.3, 36.1), OK/FAIL (94.5, 32.7), ONLINE (104.7,
    32.7) and OFFLINE (127.0, 30.5). Every position is estimated to about 0.7 mm. The Routing Engine's
    handle strips along the bottom edge, which extend past the faceplate in the figure, are not drawn.
  jacks: >-
    drawing - the four RJ-45 jacks are drawn with the contact comb at the bottom, so each is turned 180. MGMT is
    an autosensing 10/100/1000 jack with a speed lamp and a link/activity lamp (Figure 7). The guide says the
    ToD port is "reserved for future use" and "with LEDs", and that BITS has an activity lamp and a link lamp
    (Table 6); the figure draws the two lamp windows in the BITS jack's top corners and none for ToD.
  bits-jack: >-
    drawing - the BITS jack is common/rj45-ganged-lamped@1, the library's lamped timing jack, whose two lamps sit
    in the corners where Figure 6 draws the windows; its 12.7 x 11.0 cell is smaller than the 15.8 x 13.2
    housing of the other jacks, as Figure 6's BITS box is not. It is centred on the figure's box.
  media: >-
    the jacks are typed by what runs through them: the console is rj45-serial (RS-232), the ToD port rj45-tod
    and the BITS port rj48, as the library types every BITS jack. The guide does not give BITS a rate or framing,
    so it takes no speed (see the device's gap named bits-media).
  power: >-
    datasheet - guide Table 13: Routing Engine 58 W typical at 25 C and 65 W maximum at 55 C. A draw, since a
    board consumes power.
  leds: >-
    datasheet - guide Table 6: ONLINE green steady, green blinking, red steady or red blinking; OK/FAIL green
    steady or red blinking; ALM red steady, red blinking or yellow steady; SSD0 and SSD1 green blinking;
    BITS activity green steady and link amber steady; each is unlit otherwise. The guide gives no table for
    the MST lamp (the Master lamp, Figure 6 callout 6) beyond its name.
states:
- ok
- fail
- absent
groups:
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the Routing Engine's management cluster: an out-of-band Ethernet jack, an RJ-45 serial console and a USB
      port. Three kinds, one job: reaching and disciplining the switch.
  timing:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the timing block: the BITS and ToD RJ-45 jacks beside the 10MHz and PPS SMB connectors, in and out. One
      job: taking a clock in and giving one out.
