format: 1
kind: component
name: cmduct-fingers
version: 1.0.0
class: mechanical
description: >-
  One finger wall of a StarTech.com CMDUCT1UX or CMDUCT2U horizontal finger duct seen end-on
  from the front - the steel wall along the top or the bottom of the duct, sixteen fingers with
  a slot between each pair, fifteen slots a cable is laid in through, the wall solid across its
  root so the fingers stand out of it and not apart from it
provenance:
  size: >-
    drawing - CMDUCT1UX_Diagram.pdf and CMDUCT2U_Diagram.pdf (StarTech.com, third angle
    projection), the view of the duct from its side: the duct body is 435.00 long and each slot
    is 11.00 wide, the dimension the drawing gives. The two drawings draw the same wall, fifteen
    slots in the same places, so one part serves both ducts.
  pitch: >-
    estimated - the drawing dimensions no pitch. Counted and measured off the 1U drawing's side
    view at 2.607 px/mm against its 435.00: fifteen slots whose edges are 28.5 px (10.9 mm)
    apart, centred 72.4 px (27.77 mm) from each other, the first 22.6 mm from the end of the
    duct and the last 22.6 from the other, symmetric. The 2U drawing's fifteen slots measure the
    same. Taken as 27.84, so that fifteen slots fill the 435 evenly from 22.6 to 412.4; the
    fingers between them are 16.84 wide and the two end ones 17.1.
  relief: >-
    estimated - the slots are drawn from 19.1 to 58.1 mm in front of the plate: each is round
    at its root, 19.1 mm from the plate, and runs out under the cover, whose lips cover the
    front 21.7 mm of the duct (49.9 to 71.6). The root of the wall is solid up to the slot
    roots and the fingers stand from there to 58.1. The relief builds plates and cannot curve,
    so a slot's root is square. The wall is a 1.0 mm sheet: the drawing states no gauge.
  open-ends: >-
    estimated - whether a slot is open at the front edge of the wall is not drawn: the drawing
    ends each slot 8 mm under the cover's lip. The datasheet says the removable cover "makes
    it easy to add or remove bundled cables", so the slots are open at the front here.
  color: >-
    datasheet - "Color: Black", "Material: Steel" (cmduct1ux_datasheet.pdf). The drawing is
    line work, so the shade is this library's render of black steel.
size: {w: 435.0, h: 1.0}
size-confidence: {w: drawing, h: estimated}
