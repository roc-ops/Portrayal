    M5.55,3 H12.05 A3.25,3.25 0 0 1 12.05,9.5 H5.55 A3.25,3.25 0 0 1 5.55,3 Z
    M5.55,34.5 H12.05 A3.25,3.25 0 0 1 12.05,41 H5.55 A3.25,3.25 0 0 1 5.55,34.5 Z
    M470.55,3 H477.05 A3.25,3.25 0 0 1 477.05,9.5 H470.55 A3.25,3.25 0 0 1 470.55,3 Z
    M470.55,34.5 H477.05 A3.25,3.25 0 0 1 477.05,41 H470.55 A3.25,3.25 0 0 1 470.55,34.5 Z"/>
