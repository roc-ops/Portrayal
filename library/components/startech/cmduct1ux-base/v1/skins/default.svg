    M5.55,3 H12.05 A3.25,3.25 0 0 1 12.05,9.5 H5.55 A3.25,3.25 0 0 1 5.55,3 Z
    M5.55,34.5 H12.05 A3.25,3.25 0 0 1 12.05,41 H5.55 A3.25,3.25 0 0 1 5.55,34.5 Z
