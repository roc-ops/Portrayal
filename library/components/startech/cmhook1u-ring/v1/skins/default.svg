  <rect id="wall-right" x="53.8" y="0" width="3.2" height="10" rx="1.2" fill="#40454c"/>
  <rect id="near" x="3.2" y="0" width="50.6" height="10" fill="#2a2e33"/>
  <rect id="far-left" x="3.2" y="0" width="21.3" height="10" rx="1.2" fill="#40454c"/>
  <rect id="far-right" x="32.5" y="0" width="21.3" height="10" rx="1.2" fill="#40454c"/>
</svg>
