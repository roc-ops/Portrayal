<svg xmlns="http://www.w3.org/2000/svg" width="10.4mm" height="40mm" viewBox="0 0 10.4 40">
  <!-- one middle ring from the front, end-on: the loop's bars along its top and bottom, the base
       on its seat and the closed end at the tip. The face is a lighter value than the panel so
       the ring reads against it -->
  <rect id="back" x="0" y="0" width="10.4" height="40" rx="1.2" fill="#40454c"/>
  <rect id="bar-top" x="0" y="0" width="10.4" height="3" rx="1.2" fill="#40454c"/>
  <rect id="bar-bottom" x="0" y="37" width="10.4" height="3" rx="1.2" fill="#40454c"/>
  <rect id="tip" x="0" y="0" width="10.4" height="40" rx="1.2" fill="#40454c"/>
  <rect id="edge-left" x="0" y="1.2" width="1.2" height="37.6" fill="#2a2e33"/>
  <rect id="edge-right" x="9.2" y="1.2" width="1.2" height="37.6" fill="#2a2e33"/>
  <rect id="seam-top" x="1.2" y="3.5" width="8" height="0.4" fill="#23262a"/>
  <rect id="seam-bottom" x="1.2" y="36.1" width="8" height="0.4" fill="#23262a"/>
</svg>
