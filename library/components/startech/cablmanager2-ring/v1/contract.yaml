    - {node: bar-bottom, out: 75.4, color: '#0d0f10', confidence: drawing, source: 'the same view'}
    - {node: tip, lift: 72.4, out: 75.4, color: '#101214', confidence: estimated, source: 'the same view, the closed end of the loop; the thickness is estimated'}
