  bar-top: {at: [0.0, 0.0], size: [10.4, 3.0], class: bezel}
  bar-bottom: {at: [0.0, 37.0], size: [10.4, 3.0], class: bezel}
  tip: {at: [0.0, 0.0], size: [10.4, 40.0], class: bezel}
