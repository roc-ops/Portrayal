format: 1
kind: component
name: cablmanager2-panel
version: 1.0.0
class: mechanical
description: >-
  The steel panel of the StarTech.com CABLMANAGER2 1U five-ring manager seen from the front -
  one sheet the full width of the rack, its two ends the ears with a pair of slots each, and a
  seat for each of the five removable rings - drawn as the well the rings stand in, its floor the
  front face of the panel
provenance:
  size: >-
    drawing - CABLMANAGER2_Diagram.pdf (StarTech.com, uploaded 12/01/2021; a raster of
    967 x 681 px): the panel is 482.6 +/-0.3 over the ears, 43.5 +/-0.2 high, the ear holes
    465.3 +/-0.3 apart and 31.7 between a pair, and the body between the folds 434 +/-0.3. The
    plate is the whole width of the rack, so the ears are the ends of the sheet.
  seats: >-
    estimated - the five ring seats, scaled off the front view at 2.586 px/mm against its
    482.6: three rectangles 10.4 by 41.4 mm for the middle rings, centred 105.2 apart from the
    middle of the panel, and a slot 40 by 10 mm for each end ring, centred 184.0 either side of
    the middle. The drawing dimensions no seat. The 105.2 is the "4in (105mm)" the datasheet
    gives for the rings' spacing; the end rings are 78.9 from their neighbours by the drawing,
    not 105 (see the device's gap).
  ear-slots: >-
    estimated - the ear holes read 9.3 by 6.2 mm off the raster (24 by 16 px): too coarse to
    say more. Their places, 465.3 apart and 31.7 between a pair, are the drawing's.
  depth: >-
    drawing - 75.4. The end view dimensions 76.6 +/-0.2 from the ring tip to the plate's back
    face, where the ears bolt; with a 1.2 mm sheet (estimated: the maker's CMBRUSH1U section
    gives t=1.2, and no CABLMANAGER2 document states a gauge) the well is 75.4.
  color: >-
    datasheet - "Color: Black", "Material: Steel" (cablmanager2_datasheet.pdf). The drawing is
    line work, so the shade is this library's render of black steel.
size: {w: 482.6, h: 43.5, d: 75.4}
size-confidence: {w: drawing, h: drawing, d: drawing}
attrs: {material: steel}
relief: {wall: '#1b1d20'}
elements:
  floor: {at: [0.0, 0.0], size: [482.6, 43.5], class: bezel}
skins: [default]
