    each in the side view, scaled at 2.58 px/mm against the 482.60, and are estimated.
  depth: >-
    estimated - 1.2 mm, the sheet. No CABLMANAGERH document states a gauge; the maker's
    CMBRUSH1U section states t=1.2 for its panel.
  color: >-
    datasheet - "Color: Black", "Steel construction". The drawing is line work, so the shade is
    this library's render of black steel.
