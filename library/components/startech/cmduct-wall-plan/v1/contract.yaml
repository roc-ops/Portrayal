format: 1
kind: component
name: cmduct-wall-plan
version: 1.0.0
class: mechanical
description: >-
  A finger wall of a StarTech.com CMDUCT1UX or CMDUCT2U horizontal finger duct seen from above or
  below - the steel wall along the top or the bottom of the duct from the plate to where the
  cover begins, with the fifteen slots, each round at its root and running on to the front edge
  of this part. Nothing is built from it: the wall's solid is the fingers part, seen from the
  front
provenance:
  size: >-
    drawing - CMDUCT1UX_Diagram.pdf and CMDUCT2U_Diagram.pdf (StarTech.com, third angle
    projection), the view of the duct from its side: 435.00 long, 11.00 wide a slot. This part
    runs from the 1.0 mm plate to 49.9 mm in front of the plate's rear face, 48.9 deep, where the
    cover's lower edge is; the wall's last 8.2 mm, under the cover, is `cmduct-wall-tips`.
  slots: >-
    estimated - fifteen slots counted and measured off the drawing at 2.607 px/mm against its
    435.00, centred 27.84 apart from 22.6 to 412.4 (see `cmduct-fingers`); each from 19.1 mm in
    front of the plate's rear face. The root is a half circle of the slot's 11.0 width. The
    slot continues to the front edge of the wall, under the cover: the drawing ends each slot
    8 mm under the cover's lip, and the datasheet says the cover makes it easy to add or
    remove bundled cables, so the slots are open at the front.
  color: >-
    datasheet - "Color: Black", "Material: Steel" (cmduct1ux_datasheet.pdf). The drawing is line
    work, so the shades are this library's render of black steel.
size: {w: 435.0, h: 48.9}
