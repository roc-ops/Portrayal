  <rect x="9" y="0.6" width="6" height="2.2" rx="0.6" fill="#a8a8aa"/>
  <rect x="5.6" y="6.8" width="12.8" height="23" rx="0.8" fill="#8d8d90"/>
  <rect id="lamp" x="7.3" y="8.5" width="9.4" height="19" rx="0.6" fill="var(--led-color, #6b3b36)"/>
</svg>
