format: 1
kind: component
name: outlet-switch-cover
version: 1.0.0
class: button
profile: power
description: >-
  The per-outlet power switch of the StarTech 8NS8-RACK-MOUNT-PDU. It is an illuminated rocker that lights red while its outlet is
  on. A clear-grey cover is removed to reach it (the guide says "Remove Cover to Access Switch"). One part per outlet, numbered 1 to 8 on the panel.
size: {w: 24.0, h: 38.8}
size-confidence: {w: estimated, h: estimated}
provenance:
  existence: >-
    datasheet - StarTech 8NS8-RACK-MOUNT-PDU data sheet, page 1 and page 2: "Each outlet ... features an individual
    illuminated rocker switch", "Safety covers on the switches prevent accidental power cycling", "8 - Power Switch LEDs:
    Illuminates Red When the Corresponding Outlet is Turned On". Quick-Start Guide (Manual Revision September 5, 2024),
    page 1, component 2: "Power Switches with LEDs & Switch Covers (x8)", "Remove Cover to Access Switch", "Illuminates Red
    When the Corresponding Outlet is Turned On".
  size: >-
    ESTIMATED. The only dimensioned reading is the Quick-Start Guide's front diagram (page 1, "Product Diagram, Front"),
    which prints no scale. It is read as a fraction of the 482.6 mm rack face the diagram spans ear to ear (4103 px at 400 dpi,
    8.50 px per mm; the body between the ears reads 440 mm and 44 mm high): each cover is 204 px across (24.0 mm) and runs
    from 4.9 mm below the top edge to 43.7 mm (38.8 mm). The rocker inside reads 9.4 x 19.0 mm.
  colour: >-
    photo - the product photograph on page 1 of the data sheet shows light grey covers, read by eye as #c4c4c6 (a STAND-IN: no pixel count was taken); the guide's diagram
    draws them dark grey, and the photograph is the product. The rocker is red when lit (the guide's diagram and the data
    sheet text). The unlit colour is not shown by any held document and is a declared stand-in, #6b3b36.
  states: >-
    datasheet - the lamp is red while the outlet is on, so `on` is red and `off` is unlit.
elements:
  cover: {at: [0, 0], size: [24.0, 38.8], class: button}
  lamp: {at: [7.3, 8.5], size: [9.4, 19.0], class: led, states: ['off', 'on']}
skins: [default]
