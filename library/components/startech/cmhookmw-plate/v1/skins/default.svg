<svg xmlns="http://www.w3.org/2000/svg" width="55mm" height="70.1mm" viewBox="0 0 55 70.1">
  <!-- the plate from the front: its outer corners cut at 45 degrees down to the ring's tab, and
       the two slots holes in the path, so the floor of the well is open where they are -->
  <path id="floor" fill="#232527" fill-rule="evenodd" d="
    M0,0 H32.7 L55,22.3 V47.8 L32.7,70.1 H0 Z
    M8.2,10.8 A3,3 0 0 1 14.2,10.8 V14.8 A3,3 0 0 1 8.2,14.8 Z
    M8.2,55.3 A3,3 0 0 1 14.2,55.3 V59.3 A3,3 0 0 1 8.2,59.3 Z"/>
  <!-- the light on the steel, so the plate reads as a plate on a dark stage as on a light one -->
  <path id="floor-lit" fill="#fff" fill-opacity="0.12" fill-rule="evenodd" d="
    M0,0 H32.7 L55,22.3 V47.8 L32.7,70.1 H0 Z
    M8.2,10.8 A3,3 0 0 1 14.2,10.8 V14.8 A3,3 0 0 1 8.2,14.8 Z
    M8.2,55.3 A3,3 0 0 1 14.2,55.3 V59.3 A3,3 0 0 1 8.2,59.3 Z"/>
</svg>
