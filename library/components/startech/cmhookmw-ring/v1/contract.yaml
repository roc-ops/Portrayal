  near: {at: [0.0, 0.0], size: [64.0, 25.5], class: bezel}
  wall-left: {at: [0.0, 0.0], size: [3.2, 25.5], class: bezel}
  wall-right: {at: [60.8, 0.0], size: [3.2, 25.5], class: bezel}
  far: {at: [0.0, 0.0], size: [64.0, 25.5], class: bezel}
relief:
  features:
    - {node: neck, out: 12.7, color: '#111315', confidence: estimated, source: 'the plan view of the CMHOOKMW drawing: the loop 15.0 from the plate, the plate 2.3 thick (estimated)'}
    - {node: near, lift: 12.7, out: 15.9, color: '#111315', confidence: drawing, source: 'the plan view, the loop closed at the plate end, a wall 3.2 thick (estimated)'}
    - {node: wall-left, lift: 27.2, out: 114.7, color: '#0d0f10', confidence: drawing, source: 'the same view, the side wall beside the plate, open for the first 14.5 mm'}
    - {node: wall-right, lift: 12.7, out: 114.7, color: '#0d0f10', confidence: drawing, source: 'the same view, the side wall away from the plate, solid for its 85.5 and the corner'}
    - {node: far, lift: 111.5, out: 114.7, color: '#101214', confidence: drawing, source: 'the same view, the far end'}
