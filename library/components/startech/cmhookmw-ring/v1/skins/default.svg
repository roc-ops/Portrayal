<svg xmlns="http://www.w3.org/2000/svg" width="64mm" height="25.5mm" viewBox="0 0 64 25.5">
  <!-- the ring from the front, end-on: the far end of the loop with the side walls at its
       edges. The face is a lighter value than the plate so the ring reads against it -->
  <rect id="neck" x="0" y="0" width="8.5" height="25.5" fill="#2a2e33"/>
  <rect id="near" x="0" y="0" width="64" height="25.5" rx="1.2" fill="#2a2e33"/>
  <rect id="wall-left" x="0" y="0" width="3.2" height="25.5" rx="1.2" fill="#40454c"/>
  <rect id="wall-right" x="60.8" y="0" width="3.2" height="25.5" rx="1.2" fill="#40454c"/>
  <rect id="far" x="0" y="0" width="64" height="25.5" rx="1.2" fill="#40454c"/>
  <rect id="edge-top" x="1.2" y="0" width="61.6" height="1.2" fill="#2a2e33"/>
  <rect id="edge-bottom" x="1.2" y="24.3" width="61.6" height="1.2" fill="#2a2e33"/>
</svg>
