version: 1.0.0
class: mechanical
description: >-
  The top flange of the StarTech.com CMBRUSH1U 1U brush panel seen from above - the plate's top
  edge folded back behind the rack rails between the ears, which carries the brush - drawn as the
  well that builds it one sheet in from the top of the envelope
provenance:
  size: >-
    drawing - CMBRUSH1U_Diagram.pdf (StarTech.com, REV A, 06/02/2020): the panel is "17.2" deep
    in its side elevation, "Product Width 0.7 in [17.2 mm]" on the datasheet, so the flange is
    17.2 deep from the plate's front face. The section draws the top flange as the longer of
    the two, 16.5 behind the sheet, and the brush holder's head beyond it, 20.2 in all (the
    datasheet's "Internal Depth 0.8 in [20.2 mm]"); 17.2 is the stated depth and is used.
  extent: >-
    estimated - 416.0 long, between the ears: the top view draws an ear at each end 32 mm
    across, scaled at 0.78 px/mm against the 482.0, with the body between them.
  depth: >-
    drawing - 1.2 mm, the sheet: the section's "Panel spcc/hc, t=1.2mm".
  color: >-
    datasheet - "Color: Black", "Material: Steel". The drawing is line work, so the shade is this
    library's render of black steel.
size: {w: 416.0, h: 17.2, d: 1.2}
