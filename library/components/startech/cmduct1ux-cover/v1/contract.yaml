  lip-top: {at: [0.0, 1.0], size: [435.0, 1.0], class: bezel}
  lip-bottom: {at: [0.0, 42.0], size: [435.0, 1.0], class: bezel}
  plate: {at: [0.0, 0.0], size: [435.0, 44.0], class: bezel}
