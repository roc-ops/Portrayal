  features:
    - {node: lip-top, out: 21.7, color: '#303336', confidence: estimated, source: 'the side view of the CMDUCT1UX drawing, the cover over the front 21.7 mm; the lip gauge is not stated'}
    - {node: lip-bottom, out: 21.7, color: '#303336', confidence: estimated, source: 'the same'}
    - {node: plate, lift: 20.7, out: 21.7, color: '#303336', confidence: estimated, source: 'the same view, the face of the cover at the front of the duct; its gauge is not stated'}
