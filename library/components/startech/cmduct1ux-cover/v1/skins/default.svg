<svg xmlns="http://www.w3.org/2000/svg" width="435mm" height="44mm" viewBox="0 0 435 44">
  <!-- the cover from the front: one plate across the duct; its lips fold back over the finger
       tips and are not seen from here -->
  <rect id="plate" x="0" y="0" width="435" height="44" rx="1" fill="#303336"/>
  <rect id="lip-top" x="0" y="1" width="435" height="1" fill="#3a3d40"/>
  <rect id="lip-bottom" x="0" y="42" width="435" height="1" fill="#26282b"/>
</svg>
