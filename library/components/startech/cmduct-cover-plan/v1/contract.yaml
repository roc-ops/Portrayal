format: 1
kind: component
name: cmduct-cover-plan
version: 1.0.0
class: mechanical
description: >-
  The removable cover of a StarTech.com CMDUCT1UX or CMDUCT2U finger duct seen from above or
  below - the strip across the front 21.7 mm of the duct, over the finger tips and the
  front end of the slots. Nothing is built from it: the cover is the front-view part
provenance:
  size: >-
    drawing - CMDUCT1UX_Diagram.pdf and CMDUCT2U_Diagram.pdf (StarTech.com, third angle
    projection), the view of the duct from its side: the cover is the strip from 49.9 mm in front
    of the plate to the duct's 71.60 front, 435.00 wide between the ears. Scaled at 2.264 px/mm
    on the 1U and 2.61 on the 2U against the 71.60; the two agree.
  color: >-
    datasheet - "Color: Black". The drawing is line work, so the shade is this library's
    render, a little lighter than the wall so the two read apart.
size: {w: 435.0, h: 21.7}
size-confidence: {w: drawing, h: estimated}
elements:
  strip: {at: [0.0, 0.0], size: [435.0, 21.7], class: bezel}
  edge: {at: [0.0, 0.0], size: [435.0, 1.0], class: bezel}
skins: [default]
