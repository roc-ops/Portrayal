<svg xmlns="http://www.w3.org/2000/svg" width="40mm" height="10mm" viewBox="0 0 40 10">
  <!-- one end ring from the front, end-on: the loop face-on across the panel, a bar down each
       side, the base on its seat and the closed end at the tip. The face is a lighter value than
       the panel so the ring reads against it -->
  <rect id="back" x="0" y="0" width="40" height="10" rx="1.2" fill="#40454c"/>
  <rect id="bar-left" x="0" y="0" width="3" height="10" rx="1.2" fill="#40454c"/>
  <rect id="bar-right" x="37" y="0" width="3" height="10" rx="1.2" fill="#40454c"/>
  <rect id="tip" x="0" y="0" width="40" height="10" rx="1.2" fill="#40454c"/>
  <rect id="edge-top" x="1.2" y="0" width="37.6" height="1.2" fill="#2a2e33"/>
  <rect id="edge-bottom" x="1.2" y="8.8" width="37.6" height="1.2" fill="#2a2e33"/>
  <rect id="seam-left" x="3.5" y="1.2" width="0.4" height="7.6" fill="#23262a"/>
  <rect id="seam-right" x="36.1" y="1.2" width="0.4" height="7.6" fill="#23262a"/>
</svg>
