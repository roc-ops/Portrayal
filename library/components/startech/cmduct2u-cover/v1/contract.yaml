format: 1
kind: component
name: cmduct2u-cover
version: 1.0.0
class: mechanical
behaviour: mounts
lid: true
description: >-
  The removable cover of the StarTech.com CMDUCT2U 2U finger duct seen from the front - a plate
  across the open side of the duct with a lip along its top and bottom that fits over the
  finger tips. It ships fitted and comes off to lay a cable in
provenance:
  size: >-
    drawing - CMDUCT2U_Diagram.pdf (StarTech.com, third angle projection): the cover closes the
    435.00 duct body, between the two ears, and the end profile is 88.45 across. The cover is
    the 435.0 wide and 88.45 high of that body.
  relief: >-
    drawing - the view of the duct from its side: the cover is the strip across the front end
    of the duct, its lower edge 49.8 mm in front of the plate (scaled at 2.61 px/mm against the
    71.60 depth) and its face the 71.6. It is 21.7 deep over the finger tips, as on the 1U. The
    lips and the face are 1.0 mm: estimated, the drawing states no gauge. The reference of this
    part is the cover's rear edge, so a placement lifts it by the well's depth less 21.7.
  lid: >-
    datasheet - "The 2U cable organizer features a removable top cover that makes it easy to add
    or remove bundled cables quickly" (cmduct2u_datasheet.pdf), and the quick-start guide
    (CMDUCT2U_QSG.pdf, revision February 15, 2023) says it "can be removed for installation or
    upgrades" and is latched on with four latches, one in each corner. It is drawn fitted, as
    the datasheet and the guide picture it. It lifts off and opens the duct, so it is a lid
    (`lid: true`) and a pass-through in the plate beneath it may be declared. The latches are
    not drawn.
  color: >-
    datasheet - "Color: Black", "Material: Steel and Plastic": which of the two the cover is
    is not said, so no material is stated. The drawing is line work, so the shade is this
    library's render, a little lighter than the duct so the two read apart.
size: {w: 435.0, h: 88.45}
size-confidence: {w: drawing, h: drawing}
