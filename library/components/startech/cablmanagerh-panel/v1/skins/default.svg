    <g id="bracket-2"><rect x="121.3" y="0.845" width="40" height="42" rx="3" fill="#23262a"/><rect x="121.3" y="17.695" width="40" height="8.3" fill="#2b2f34"/><circle cx="141.3" cy="21.845" r="1.5" fill="#40454c"/></g>
