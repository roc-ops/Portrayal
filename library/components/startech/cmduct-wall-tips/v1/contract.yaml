name: cmduct-wall-tips
version: 1.0.0
class: mechanical
description: >-
  The tips of the fingers of a StarTech.com CMDUCT1UX or CMDUCT2U finger wall seen from above or
  below with the cover taken off - the wall's last 8.2 mm, which the cover hides, with the
  fifteen slots running out through its front edge. Nothing is built from it
provenance:
  size: >-
    drawing - CMDUCT1UX_Diagram.pdf and CMDUCT2U_Diagram.pdf (StarTech.com, third angle
    projection), the view of the duct from its side: the slots end 58.1 mm in front of the plate's
    rear face (scaled at 2.264 px/mm on the 1U and 2.61 on the 2U against the 71.60), 8.2 mm
    past the cover's lower edge at 49.9. 435.00 long, 11.00 a slot.
  slots: >-
    estimated - the same fifteen slots as `cmduct-wall-plan`, centred 27.84 apart from 22.6 to
    412.4, open at the front edge of the wall.
  color: >-
    datasheet - "Color: Black", "Material: Steel". The drawing is line work, so the shades are
    this library's render of black steel.
size: {w: 435.0, h: 8.2}
