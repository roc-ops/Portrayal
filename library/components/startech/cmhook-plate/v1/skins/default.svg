<svg xmlns="http://www.w3.org/2000/svg" width="19mm" height="44.6mm" viewBox="0 0 19 44.6">
  <!-- the plate from the front: the two slots are holes in the path, so the floor of the well
       is open where they are -->
  <path id="floor" fill="#232527" fill-rule="evenodd" d="
    M0,0 H19 V44.6 H0 Z
    M6.5,3.3 A3,3 0 0 1 12.5,3.3 V9.3 A3,3 0 0 1 6.5,9.3 Z
    M6.5,35.3 A3,3 0 0 1 12.5,35.3 V41.3 A3,3 0 0 1 6.5,41.3 Z"/>
  <!-- the light on the steel, so the plate reads as a plate on a dark stage as on a light one -->
  <path id="floor-lit" fill="#fff" fill-opacity="0.12" fill-rule="evenodd" d="
    M0,0 H19 V44.6 H0 Z
    M6.5,3.3 A3,3 0 0 1 12.5,3.3 V9.3 A3,3 0 0 1 6.5,9.3 Z
    M6.5,35.3 A3,3 0 0 1 12.5,35.3 V41.3 A3,3 0 0 1 6.5,41.3 Z"/>
</svg>
