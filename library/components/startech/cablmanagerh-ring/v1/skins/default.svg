<svg xmlns="http://www.w3.org/2000/svg" width="9.1mm" height="30.6mm" viewBox="0 0 9.1 30.6">
  <!-- one ring from the front, end-on: the loop's bars along its top and bottom, the base on
       the panel and the closed end at the tip. The face is a lighter value than the panel so the
       ring reads against it; the edges and the two seams are drawn over it -->
  <rect id="back" x="0" y="0" width="9.1" height="30.6" rx="1.1" fill="#40454c"/>
  <rect id="bar-top" x="0" y="0" width="9.1" height="4" rx="1.1" fill="#40454c"/>
  <rect id="bar-bottom" x="0" y="26.6" width="9.1" height="4" rx="1.1" fill="#40454c"/>
  <rect id="tip" x="0" y="0" width="9.1" height="30.6" rx="1.1" fill="#40454c"/>
  <rect id="edge-left" x="0" y="1.1" width="1.1" height="28.4" fill="#2a2e33"/>
  <rect id="edge-right" x="8" y="1.1" width="1.1" height="28.4" fill="#2a2e33"/>
  <rect id="seam-top" x="1.1" y="4.5" width="6.9" height="0.4" fill="#23262a"/>
  <rect id="seam-bottom" x="1.1" y="25.7" width="6.9" height="0.4" fill="#23262a"/>
</svg>
