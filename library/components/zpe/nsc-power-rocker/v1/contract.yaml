format: 1
kind: component
name: nsc-power-rocker
version: 1.0.0
class: button
profile: networking
description: >-
  The small black rocker power switch above each AC inlet on the rear of the Nodegrid Serial
  Console S. It has a ring at its left end and a bar at its right. Drawn from one photograph.
size: {w: 15.5, h: 6.0}
size-confidence: {w: estimated, h: estimated}
provenance:
  size: >-
    estimated - read off the ZPE Systems T48S dual-AC rear photograph (T48S-DAC-SFP-2.jpg) at
    about 1.93 px per mm, the bezel 30 px by 11 px. No document dimensions it, and the common
    21 x 15 snap-in rocker is much larger than this one, so that part is not used.
  marks: >-
    photograph - a ring at the left end and a bar at the right. Which end is on is not stated
    by any document held, so the part draws the rocker at rest and no state.
elements:
  rocker: {at: [0.8, 0.8], size: [13.9, 4.4], class: button}
skins: [default]
