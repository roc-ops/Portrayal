format: 1
kind: component
name: nsc-hdmi
version: 1.0.0
class: port
profile: networking
unmated: an HDMI output jack for a monitor; the registry holds no HDMI interface and no HDMI plug part, so none is offered, and no cable of the rack lands on it
description: >-
  The HDMI output on the HDMI and USB face of the Nodegrid Serial Console S. It is a Type A
  receptacle in a bright metal shell with a black insulator. Drawn from one photograph.
attrs:
  media: hdmi
size: {w: 16.4, h: 7.4}
size-confidence: {w: estimated, h: estimated}
provenance:
  size: >-
    estimated - the shell as it shows in the ZPE Systems T48S front photograph (T48S-4.jpg), 32
    px by 14 px at about 1.93 px per mm. The shell is wider than a bare Type A opening. No
    document held gives the HDMI standard's dimensions, so this is not registry-checked, and
    the part claims no HDMI standard entry.
  interface: >-
    NOT REGISTERED. spec/schemas/connectors.yaml holds no HDMI key and standards.yaml no HDMI
    entry, so the part presents no interface and says so in `unmated`.
skins: [default]
