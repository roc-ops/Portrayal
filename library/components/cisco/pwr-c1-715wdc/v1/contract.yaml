format: 1
kind: module
name: pwr-c1-715wdc
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 715 W DC power supply of the Cisco Catalyst 9300 family, PWR-C1-715WDC. A dark rear
  face with a DC OK and a PS OK lamp, three terminal screws for positive, negative and the
  grounding terminal under a safety cover, a release latch and an extraction handle. Airflow
  is front-to-back.
size: {w: 82.55, h: 40.1}
size-confidence: {w: datasheet, h: datasheet}
attrs:
  model: 'PWR-C1-715WDC'
  power-output-w: 715
  input: dc
  inlet: dc-terminal
  input-voltage: '-36 VDC minimum, -48 VDC nominal, -72 VDC maximum'
  input-current-max: '24 to 12 A'
  output: '-56 V at 12.8 A'
  weight-kg: 1.3
  airflow: front-to-back
provenance:
  model: >-
    datasheet - Cisco Catalyst 9300 Series Switches Hardware Installation Guide (first
    published 2017-06-20, last modified 2026-05-15), Table 35 lists PWR-C1-715WDC for the
    C9300, C9300L and C9300X series and Figure 49 draws it, isometrically, with callouts for
    the DC OK LED, the PS OK LED, the release latch, the extraction handle, the input
    terminals (positive and negative), the grounding terminal and the terminal block safety
    cover.
  power: >-
    datasheet - Table 47, Power Specifications for DC Power Supplies: maximum output power 715
    W, input current 24-12 A, output -56 V at 12.8 A, input -36 VDC minimum, -48 VDC nominal,
    -72 VDC maximum, 20 A branch circuit protection. An OUTPUT rating, so power-output-w.
  size: >-
    datasheet - Physical Specifications of Power Supplies, 1.58 x 3.25 x 12.20 in (40.1 x
    82.55 x 309.9 mm), read height, width, depth as cisco/pwr-c1-715wac-p@1 reads it.
  weight: >-
    datasheet - 2.8 lb (1.3 kg).
  depth: >-
    datasheet - 309.9 mm.
  elements: >-
    estimated - Figure 49 is isometric. The community NetBox rear elevations draw only AC
    supplies, so the places of the lamps, the terminal screws, the latch and the handle are a
    reading of the figure's proportions: the lamps at the upper left, the three terminals in
    a row beneath them from the left (positive, negative, ground), the handle at the right.
    Good to a few millimetres at best.
  terminals: >-
    datasheet - Figure 49 callouts 6, 7 and 8, with the glyphs + and - and an earth symbol
    printed above them. Ground wire gauge 12 AWG or 8 AWG (Table 47). They are drawn as
    elements and not as seated parts, because the library holds no terminal block of this
    pitch.
  lamps: >-
    datasheet - Table 36, Switch Power Supply Module LEDs: DC OK green with input present, off
    without; PS OK as the AC supplies.
  colour: >-
    estimated - as the AC supplies.
states: [absent]
elements:
  dc-ok: {at: [10.2, 7.6], size: [3.0, 3.0], class: led, states: ['off', {name: ok, color: '#22c55e'}]}
  ps-ok: {at: [28.0, 7.6], size: [3.0, 3.0], class: led, states: ['off', {name: ok, color: '#22c55e'}, {name: fault, color: '#ef4444'}]}
  latch: {at: [4.0, 26.5], size: [11.0, 11.9], class: handle}
  handle: {at: [64.0, 24.0], size: [14.0, 12.0], class: handle}
  terminal-positive: {at: [20.0, 17.0], size: [10.0, 14.0], class: screw}
  terminal-negative: {at: [32.0, 17.0], size: [10.0, 14.0], class: screw}
  terminal-ground: {at: [44.0, 17.0], size: [10.0, 14.0], class: screw}
  terminal-cover: {at: [18.0, 15.0], size: [38.0, 22.0], class: cover}
relief:
  wall: '#15171a'
skins: [default]
body:
  depth: 309.9
  color: '#2a2c30'
  footprint: {at: [0, 0], size: [82.55, 40.1]}
