format: 1
kind: module
name: a9k-rsp880-lt-se
version: 1.0.0
class: supervisor
profile: networking
description: >-
  Cisco ASR 9000 Route Switch Processor 880-LT, Service Edge optimised - four cores at
  2.4 GHz and two 128 GB SSDs, against the RSP-880's eight cores and two 32 GB SSDs. Ten
  RJ-45 jacks - two SYNC timing ports configurable as BITS, J.211 or DTI, an IEEE 1588
  timestamp port, two inter-chassis sync ports of which ICS1 doubles as the RS232/422
  GPS time-of-day input, two management LAN ports, a CMP port, a console and an
  auxiliary port - plus 10 MHz and 1 PPS SMB clock inputs, a nine-pin alarm output, a
  USB 2.0 type A port, nine discrete status lamps, a four-character LED dot-matrix
  display and a LAMP TEST push button.
size: {w: 46.0, h: 428.5, d: 628.9}
attrs:
  model: 'A9K-RSP880-LT-SE'
  role: 'route-switch-processor'
  mgmt: '2 x 10/100/1000 RJ-45'
  console: 'EIA/TIA-232 RJ-45'
  timing: '2 x SYNC (BITS/J.211/DTI) RJ-45, IEEE 1588 RJ-45, 2 x inter-chassis sync RJ-45, 10 MHz and 1 PPS SMB'
  alarm: 'DB9, three dry-contact outputs'
  usb: '1 x USB 2.0 type A'
  power-draw-max-w: 315
  eol: 'none-announced'
  weight-kg: 8.07
provenance:
  relief: >-
    NO RELIEF FEATURE IS DECLARED AND THIS IS THE RECORD OF WHY. What should stand proud of
    this face: the ejector brackets, their levers and the captive screws. Each needs a depth
    in millimetres, and no document in the intake states one for any Cisco part. The
    searches, recorded so this can be overturned rather than repeated: every doc.md in the
    112-document intake for 'protrud', 'extends outward', 'stands proud' and 'clearance in
    front' - the ONLY vendor in the whole intake that publishes a projection is UfiSpace,
    whose S9510-28DC datasheet gives its fan and PSU handle travel, and no Cisco document
    does; the per-card dimension tables, Table A-10 of the older Ethernet Line Card
    Installation Guide and every data sheet's 'Physical dimensions (includes ejector
    bracket/lever)' row, which carry H, W, D and weight only - and where the ejector IS
    included it is included in the card's LONG axis, which this model already draws in 2D,
    not in its depth; and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR
    elevations with no side, top or isometric view, so it carries no depth axis to measure
    at all. The figures that DO show this hardware in three dimensions - Figure 48 of the
    Ethernet Line Card Installation Guide, 'Ejector Levers and Captive Screws', and Figure
    1-8 of the ISM guide - are perspective drawings with a vanishing point and no scale, so
    they are authoritative for WHAT IS THERE and for nothing about size. Figure 48 does
    settle the ARRANGEMENT: the bracket stands off the plate, the lever lies along it and
    the captive-screw head is proud of both. WHAT WOULD CLOSE IT: a Cisco mechanical drawing
    of a line-card faceplate, or a photograph of the part with a rule in frame. THIS
    PARAGRAPH IS ONE STATEMENT, WRITTEN ONCE BY THE CISCO RELIEF PASS AND INSERTED INTO THE
    15 SIBLING CONTRACTS that share this hardware - it is a single search, not 15 agreeing
    readings. SEPARATELY: this face carries 1 DRAWN aperture (alarm-out) that compile to no
    3D cavity at all, because they are contract elements rather than composed std/ parts and
    so carry no depth - in 3D this card currently has no ports in it. That is the same
    withheld figure the `aperture` key records at length; read it there, it is not a second
    finding.
  one-drawing: >-
    READ THIS BEFORE TRUSTING A FEATURE POSITION TO THE MILLIMETRE. Nine RSP and RP
    masters in this stencil are ONE DRAWING: extracted jack, SMB, USB, DB9, LED-matrix
    and lamp coordinates agree to 0.00 mm across a9k-rsp5-se and -tr, a9k-rsp880-se and
    -tr, a9k-rsp880-lt-se and -tr, a99-rp3-se and -tr, and a99-rsp-se. The DATASHEETS do
    not agree: these cards are 402.8, 428.5, 428.2 and 403.4 mm wide and 41.0 to 46.0 mm
    high. So the drawing is generic across the family and cannot be all four sizes. Each
    card here is scaled to its OWN stated envelope - long axis to its width, short axis
    to its height, two factors, exactly as the line cards were - which makes the OUTLINE
    right for every one and makes the interior positions proportional rather than
    measured. A jack centre is therefore good to a few millimetres, not to a tenth, and
    anyone needing better needs a mechanical drawing Cisco has not published.
  size: >-
    datasheet - Cisco ASR 9000 Route Switch Processor 880 Data Sheet, 'Physical
    specifications': Height 1.81 in. (4.60 cm), Width 16.87 in. (42.85 cm), Depth 24.74
    in. (62.89 cm), Weight 17.8 lb (8.07 kg). That data sheet covers all four part
    numbers - A9K-RSP880-SE, -TR, A9K-RSP880-LT-SE and -LT-TR - with ONE physical block,
    so the LT variants take the same envelope from Cisco's own scoping rather than by
    inference. Note this card is 46.0 mm high where the RSP5 is 41.0: it is a thicker
    card, and a bay sized for one is not sized for the other.
  ports: >-
    install guide - the Overview and Reference Guide's per-card 'Front Panel and Access
    Ports' section, corroborated feature by feature by the artwork. For the RSP5: 'Two
    RJ-45 Sync timing ports with Link and Fault LEDs built into the RJ-45. IEEE1588
    RJ-45 Timestamp port. Two Inter-Chassis Sync ports - nVSync1 is shared with
    RS232/422 GPS TOD RJ-45 port. RS232/422 GPS TOD RJ-45 port for system timing input.
    10 MHz and 1 PPS clock input SMB ports. Alarm Output DB9 port with three alarm
    outputs. External USB2, class-A port. Two dual-speed 100/1000 Mbit Ethernet
    Management ports. One Connectivity Management Processor (CMP) port. Two EIA/TIA-232
    RJ232 serial RJ-45 ports - one each for Console and Auxiliary modem ports.' That is
    ten RJ-45s, and the master draws ten.
  jack-orientation: >-
    the ICS and MGT LAN jacks are STACKED PAIRS in one bezel, not two singles side by
    side, and the pair MIRRORS: read at high zoom the upper jack's keyway points up and
    the lower one's points down, so both release tabs stay reachable. The upper of each
    pair is therefore placed at rotate 270 and everything else at 90. This is the
    failure that was caught by eye on the AGR400's RJ-45s and would have linted clean
    here too. Which jack is 0: the artwork prints '0' beside the upper of each pair and
    '1' beside the lower, and ICS0 sits above ICS1/TOD under the GPS bracket.
  cages: >-
    composed from std/, never drawn. The RJ-45s go in as std/rj45-ganged (12.7 x 11.0)
    rather than std/rj45 (16.0 x 14.0): the IEC 60603-7 single-port cutout is the wrong
    part for a stacked pair whose ports share walls, and 16.0 will not fit twice across
    a 41 mm card. The drawn jack measures 10.83 x 12.81, which rotated is 12.81 x 10.83
    against the ganged registry's 12.7 x 11.0 - agreement to one percent, which is the
    check. Timing coax is std/smb, sourced from the same 10-32 UNF figure the registry
    carries; the USB is std/usb-a.
  alarm-out: >-
    install guide - 'Each RSP/RP card drives a set of three alarm output contacts. Alarm
    circuitry on the RSP/RP activates dry contact closures that are accessible through
    the nine-pin Alarm Out connector on the RSP/RP front panel... Both normally-open and
    normally-closed contacts are available. Only the active RSP/RP drives the alarm
    outputs.'
  db9: >-
    the ALARM OUT connector is DRAWN, not composed, and it IS declared `class: cutout` -
    which is a reversal of what these components said until now and the reversal is the
    point. There is no std/ part for a D-subminiature DE-9, no `db9` key in
    spec/schemas/standards.yaml, and no document in this intake dimensions the panel
    opening; the geometry here is transcribed from the master. The earlier version
    withheld `class: cutout` on the reasoning that a cutout conforming to nothing would
    corrupt the aperture census L26 keeps. THAT WAS BACKWARDS. L26's own message ends
    'if the dimension cannot be sourced yet, this warning is the record of that', and
    its docstring calls the rule a to-do list for std/ rather than an accusation.
    Withholding the declaration did not keep the census clean, it kept a real gap OUT of
    the one rule built to hold it - a count kept tidy by routing around the detector. So
    the cutout is declared, the L26 warning stands, and the register is one entry more
    honest. WHAT WOULD CLOSE IT: a `db9` key in standards.yaml carrying the D-sub panel
    cutout from MIL-DTL-24308 or its commercial equivalent, plus a std/db9 part. That is
    a real errand somebody can run, unlike the CFP family's, and nobody has run it.
    CONTRAST cisco/a9k-750w-dc, whose DC terminal block is correctly NOT a cutout: that
    is hardware bolted to the face rather than a hole punched in it, and the distinction
    is between a thing that needs an opening and a thing that does not.
  lamps: >-
    install guide - Table 4, 'RSP, RSP-440, RSP-440 Lite, RSP-880, RSP880-LT, RSP4-S,
    RSP5 Discrete LED Display Definitions', and Table 5 for the RP, transcribed per lamp
    with Cisco's own sentence kept beside the state tokens. WHICH lamp is where was read
    off the artwork at high zoom, not guessed: three columns of three, SSD/CRIT/FAIL, FC
    FAULT/MAJ/ACO and GPS/MIN/SYNC, and the same nine names appear on the rsp5, rsp880,
    rsp880-lt, rp3 and a99-rsp masters. FC FAULT is in none of Cisco's tables - see its
    own description.
  buttons: >-
    install guide - 'Alarm Cut Off (ACO) and Lamp Test momentary push buttons', and on
    the RSP5 the guide adds that they 'can be used to eject the RSP5 card'. Both are
    drawn on the master as stroked circles with their legends beside them. Worth
    recording how nearly they were missed: the first extraction pass reported one
    button, because a circle is a curve and the outline reader skips curves - the second
    was found by looking at the artwork at 8 px/mm rather than by trusting the count.
  power: >-
    install guide - Table 23, row 'RSP880-LT Card': 285 W at 27 C, 295 W at 40 C, 315 W
    at 55 C. max is the highest rated ambient. This is a separate row from the RSP-880's
    425/430/450, which is the difference between four cores at 2.4 GHz and eight at 1.9.
    Table 23 names the CARD, not the part number: its rows are 'RSP5 Card', 'RSP-880
    Card', 'RP3 Card' and so on, with no -SE/-TR distinction anywhere in the table. So
    the figure below is carried on both variants of a card, which is transcription of
    Cisco's own scope rather than an inference across it. Contrast Table 35 for the line
    cards, which DOES split by variant and where the 16-port -TR and -SE differ by two
    thirds - that is why the scope of each table is worth stating.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
elements:
  alarm-out:
    at: [10.89, 194.06]
    size: [11.86, 35.65]
    class: cutout
  led-matrix:
    at: [15.96, 376.86]
    size: [19.43, 8.23]
    class: display
    description: >-
      the four-character 5x7 LED dot-matrix display. The Overview and Reference Guide
      devotes two sections to what it shows - 'LED Matrix Boot Stage and Runtime Display'
      and 'LED Matrix CAN Bus Controller Error Display' - which is a message vocabulary
      rather than a lamp state list, so it is modelled as a display and not as an
      indicator with states.
  aco-button:
    at: [10.39, 329.2]
    size: [3.97, 3.9]
    class: button
    description: >-
      the Alarm Cut Off momentary push button. Pressing it after an alarm lights the ACO
      lamp: 'Alarm Cutoff has been enabled. The ACO push button was pressed after at least
      one alarm has occurred.'
  lamp-test:
    at: [10.39, 339.61]
    size: [3.97, 3.9]
    class: button
    description: >-
      the LAMP TEST momentary push button. On the RSP5 the guide adds that these two
      buttons 'can be used to eject the RSP5 card', which is why they are modelled as
      buttons and not as decoration.
  ssd:
    at: [22.92, 352.47]
    size: [2.11, 2.11]
    class: led
    description: >-
      Internal Solid State Hard Disk Drive (SSD). Green: SSD0 is busy/active, driven by
      the SSD controller. Off (default after reset): not busy/active.
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  fc-fault:
    at: [22.92, 360.9]
    size: [2.11, 2.11]
    class: led
    description: >-
      FC FAULT, printed on the faceplate between SSD and GPS. THIS CARD'S OWN TABLE HAS NO
      ROW FOR IT. Table 4 of the Overview and Reference Guide - headed 'RSP, RSP-440,
      RSP-440 Lite, RSP-880, RSP880-LT, RSP4-S, RSP5', which is this card - describes
      FAIL, CRIT, MAJ, MIN, SYNC, ACO, HDD, CF, SSD, GPS and the three USB lamps, and
      stops. TABLE 5 DOES HAVE AN FC FAULT ROW, at amber and off with Cisco's own
      sentence, but Table 5 is headed 'RP and RP2/RP3' and is a different scope - the same
      book gives the RSP and RP families different vocabularies for SYNC in those two
      tables, so they cannot be treated as one. The amber is therefore NOT borrowed across
      and this lamp carries off/on. An earlier version of this sentence said no row
      existed in either table, which was simply wrong about Table 5.
    states:
    - 'off'
    - 'on'
  gps:
    at: [22.92, 369.32]
    size: [2.11, 2.11]
    class: led
    description: >-
      GPS. Green: 'GPS interface provisioned and ports are turned on. ToD, 1 PPS, 10 Mhz
      are all valid.' Off (default after reset): either the interface is not provisioned
      or the ports are not turned on.
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  crit:
    at: [18.06, 352.47]
    size: [2.11, 2.11]
    class: led
    description: >-
      Critical Alarm (CRIT). Red: a critical alarm has occurred. Off (default after
      reset): no critical alarm has occurred.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  maj:
    at: [18.06, 360.9]
    size: [2.11, 2.11]
    class: led
    description: >-
      Major Alarm (MAJ). Red: a major alarm has occurred. Off (default after reset): no
      major alarm has occurred.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  min:
    at: [18.06, 369.32]
    size: [2.11, 2.11]
    class: led
    description: >-
      Minor Alarm (MIN). Amber: a minor alarm has occurred. Off (default after reset): no
      minor alarm has occurred.
    states:
    - {name: amber, color: '#f5a623'}
    - 'off'
  fail:
    at: [12.76, 352.47]
    size: [2.11, 2.11]
    class: led
    description: >-
      Power Fail (FAIL). Red: 'Standby Power Fail LED. The LED is turned off by the CAN
      bus controller after it is up and running.' Off: standby power is normal.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  aco:
    at: [12.76, 360.9]
    size: [2.11, 2.11]
    class: led
    description: >-
      Alarm Cutoff (ACO). Amber: 'Alarm Cutoff has been enabled. The ACO push button was
      pressed after at least one alarm has occurred.' Off (default after reset): alarm
      cutoff is not enabled.
    states:
    - {name: amber, color: '#f5a623'}
    - 'off'
  sync:
    at: [12.76, 369.32]
    size: [2.11, 2.11]
    class: led
    description: >-
      Synchronization (SYNC). Green: system timing is synchronized to an external timing
      source. Amber: system timing is free running. Off: no system timing is configured.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
