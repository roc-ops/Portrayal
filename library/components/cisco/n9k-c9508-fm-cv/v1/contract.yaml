name: n9k-c9508-fm-cv
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9508 fabric-module blank card (N9K-C9508-FM-CV). A plain cover that fills a fabric-module slot
  holding no fabric module. The guide says to fill empty fabric slots with it when the fabric modules are
  any type other than the N9K-C9508-FM-G, and it is the blank for an empty odd slot (FM 1, FM 3, FM 5). It is
  a different part number from the N9K-C9508-FM-Z, which goes in an empty even slot (FM 2, FM 4, FM 6)
  because it also passes power to the fan tray.
