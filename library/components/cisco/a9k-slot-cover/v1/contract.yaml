format: 1
kind: module
name: a9k-slot-cover
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Line card and RSP/RP blank filler for a Cisco ASR 9000 modular chassis. A plain
  plate on the line-card envelope with a captive installation screw at each end and
  nothing else on it. It is a functional part, not trim: the installation guide is
  explicit that "unoccupied card slots must have a blank filler card installed for
  electromagnetic compatibility (EMC)", and the high-density 100GE cards additionally
  require the two-screen A9K-LC-FILR-V2 in the slots around them "for optimal cooling
  and EMI". An empty slot in a real chassis has one of these in it.
size: {w: 41.4, h: 395.7, d: 25.0}
attrs:
  model: 'A9K Slot Cover'
  role: 'airflow-blank'
  part-numbers: 'A9K-LC-FILR, A9K-LC-FILR-V2'
provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 2 captive screw heads at cyl 1.6 (one number,
    carried by 63 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A
    DELIBERATE READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind
    of interpolated anyway... It's just to give it a realistic view instead of just being a
    flat 2d... All of the 3d stuff is going to be mostly conjecture unless the vendor
    provides that data.' So a proudness here is an interpolation for a realistic view, NOT a
    claim about the hardware, and the confidence token on every feature says so rather than
    leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE
    DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED
    figure reused for the same class of hardware, and these origins are not measured - they
    are the library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size.
  purpose: >-
    install guide - the Ethernet Line Card Installation Guide's removal procedure ends
    "If the line card slot is to remain empty, install a line card blank (Product
    Number A9K-LC-FILR) to keep the chassis dust free and to maintain proper airflow",
    and the Hardware Installation Guide carries the EMC caution. The Overview and
    Reference Guide lists "Line card and RSP blank fillers" among the chassis's own
    field-replaceable units, which is what makes this a bay occupant rather than
    decoration.
  variants: >-
    TWO part numbers exist and they are NOT modelled separately, because no document
    here draws the difference. A9K-LC-FILR is the original; A9K-LC-FILR-V2 is
    described only as the one "that ha[s] two screens", required beside the 4-port and
    12-port 100GE cards. Nothing states where those screens sit, how big they are, or
    what the plate looks like around them, so drawing them would be invention. The
    plain plate here is the A9K-LC-FILR as the stencil draws it, and the V2's screens
    are an open gap - a photograph would close it.
  size: >-
    drawing - the stencil's "A9K Slot Cover" master, read the way the line cards were:
    its own shape box is the same padded 1.72 x 14.75 in every card master carries and
    is not the part, while the art measures a plate of 42.05 x 362.24 mm inside a
    395.7 mm envelope. The envelope is Cisco's stated line-card W - "includes ejector
    bracket/lever" - and w is normalised to the cards' 41.4 so that one bay accepts a
    card or a blank without two sizes for one opening. The 0.65 mm the art gives the
    blank over a card is the clearance a plate needs to sit in front of the rails, and
    it is below the drawing's own accuracy.
  depth: >-
    ESTIMATED, and deliberately shallow. A blank has no body behind its face - it is a
    plate with a stiffening flange - so 25 mm is plate-plus-flange and NOT the 604.5 mm
    a line card occupies. No document states it. This is the one number here that a
    source would improve.
  screws: >-
    drawing - one captive installation screw at each end, at the same positions the
    line cards carry theirs (centres 24.5 and 387.4 mm down the envelope), which is
    what lets a blank and a card share a slot's screw holes. The stencil draws no
    ejector levers on the blank, and none are drawn here: a filler is pulled out by
    its screws, not levered.
  cutouts: >-
    NONE. A blank is unpunched by definition, which is the entire point of the part.
elements:
