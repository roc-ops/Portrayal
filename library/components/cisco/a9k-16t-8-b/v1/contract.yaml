provenance:
  relief: >-
    NO RELIEF FEATURE IS DECLARED AND THIS IS THE RECORD OF WHY. What should stand proud of
    this face: the ejector brackets, their levers and the captive screws; and the status
    lamp, a domed lens on the real card. Each needs a depth in millimetres, and no document
    in the intake states one for any Cisco part. The searches, recorded so this can be
    overturned rather than repeated: every doc.md in the 112-document intake for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the ONLY vendor in the
    whole intake that publishes a projection is UfiSpace, whose S9510-28DC datasheet gives
    its fan and PSU handle travel, and no Cisco document does; the per-card dimension
    tables, Table A-10 of the older Ethernet Line Card Installation Guide and every data
    sheet's 'Physical dimensions (includes ejector bracket/lever)' row, which carry H, W, D
    and weight only - and where the ejector IS included it is included in the card's LONG
    axis, which this model already draws in 2D, not in its depth; and the ASR 9000 Visio
    stencil, whose 119 masters are FRONT and REAR elevations with no side, top or isometric
    view, so it carries no depth axis to measure at all. The figures that DO show this
    hardware in three dimensions - Figure 48 of the Ethernet Line Card Installation Guide,
    'Ejector Levers and Captive Screws', and Figure 1-8 of the ISM guide - are perspective
    drawings with a vanishing point and no scale, so they are authoritative for WHAT IS
    THERE and for nothing about size. Figure 48 does settle the ARRANGEMENT: the bracket
    stands off the plate, the lever lies along it and the captive-screw head is proud of
    both. A lamp measured off a drawing whose aspect is wrong reads two different diameters
    and neither is the lens, so the drawing cannot supply this either. WHAT WOULD CLOSE IT:
    a Cisco mechanical drawing of a line-card faceplate, the lamp's part number, or a
    photograph of the part with a rule in frame. THIS PARAGRAPH IS ONE STATEMENT, WRITTEN
    ONCE BY THE CISCO RELIEF PASS AND INSERTED INTO THE 37 SIBLING CONTRACTS that share this
    hardware - it is a single search, not 37 agreeing readings.
  size: >-
    datasheet - Cisco ASR 9000 Series Ethernet Line Cards data sheet, 'Physical
    dimensions (H x W x D); weight: 14 x 1.72 x 20.5 in. (35.56 x 4.37 x 52.07 cm)'. The
    24-port and 36-port sheets repeat it verbatim, so one envelope covers the whole
    original generation. NOTE THE AXIS ORDER IS THE OTHER WAY ROUND from the 4th and 5th
    generation sheets: here H is the LONG dimension and W the thickness, where the newer
    sheets give H as the thickness. THE THICKNESS IS THE FINDING: 1.72 in = 43.7 mm
    against the 4th generation's 1.63 in = 41.4. These are physically thicker cards. And
    43.7 is exactly the shape-box width that had to be DISCARDED as padding for the
    newer masters - for this generation it is the real number, which is a good reminder
    that the shape box is not wrong so much as it is not always the same thing.
  anchor: >-
    the long axis is anchored at 395.7 mm, which is the 4th generation's stated ejector-
    inclusive width and NOT this generation's stated 355.6 - so here is the reasoning,
    because it looks like the wrong number. These masters are a SECOND SHELL: they share
    zero shell features with the 4th/5th generation masters, different ejector blocks,
    different screws, the PID band at the other end. But both shells are DRAWN at the
    same scale, and the standard part inside the art proves it: the SFP cages here
    measure 14.39 mm against SFF-8433's 14.25, one percent, at the 395.7 anchor. Anchor
    at 355.6 instead and they come out 12.93, nine percent under, which no SFP cage is.
    The datasheet's 355.6 is the PLATE - the drawn plate is 358.13, agreeing to 0.7
    percent - where the newer sheets quote plate plus ejectors. Same card length, two
    measuring conventions, and the 43.7 thickness is carried from the datasheet because
    that IS this generation's own number.
  leds: >-
    install guide - 'All Ethernet line cards have port Status LEDs on their front
    panels. Each SFP or XFP port has an adjacent LED to indicate the status of the
    associated port. In addition, each line card has a single tristate Status LED to
    display card status.' The card lamp's four states are Table 32, transcribed. The
    per-port A/L lamps ARE drawn on these masters but as a shared strip between each
    pair of rows rather than one lamp per port, so which part belongs to which port is
    not resolvable and they are not modelled - the same gap the newer SFP cards carry.
  power: >-
    install guide - Table 35, row '16-Port 10-Gigabit Ethernet Oversubscribed Line
    Card': 565 W at 25 C, 575 W at 40 C, 630 W at 55 C. The part number says the same
    thing the row does - 16T/8 is sixteen ports on eight ports' worth of fabric, which
    is the 2:1 oversubscription.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
  weight: >-
    install guide - Table A-10, 'Ethernet Line Card Physical Dimensions', of the
    OL-17500-09 revision of the Ethernet Line Card Installation Guide, row
    'A9K-16/8T-B': 18.0 pounds +/- .5. The kilogram figure is Cisco's own column and not
    my conversion of the pounds one. NOTE WHERE THIS COMES FROM: the CURRENT revision of
    the same guide has no such table - its 'Ethernet Line Card Physical Dimensions'
    section is one sentence pointing at a URL - so the older revision in the intake is
    the only per-part weight source there is for this generation. ONE MORE THING ABOUT
    THAT ROW: it is headed A9K-16/8T-B and this card is A9K-16T/8-B. The table
    transposes the T. Cisco's own documents settle which is the real part number -
    A9K-16T/8-B appears thirty times across the intake and A9K-16/8T-B exactly twice,
    both of them in this one table - so the row is this card's and the heading is a
    typo. The weight is carried; the misspelling is not.
