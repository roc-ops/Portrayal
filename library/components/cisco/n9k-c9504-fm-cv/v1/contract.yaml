version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9504 fabric-module blank card (N9K-C9504-FM-CV). A plain cover that fills a fabric-module slot
  holding no fabric module. The guide says to fill empty fabric slots with it when the fabric modules are
  the N9K-C9504-FM or N9K-C9504-FM-E, and it is the blank for an empty odd slot (FM 1, FM 3, FM 5). The
  guide names no blank for an empty even slot with these fabric modules: it says only to fill FM 2, FM 4 and
  FM 6 with fabric modules to power the fan trays.
