format: 1
kind: module
name: a9k-power-shelf-cover
version: 1.0.0
class: blank
profile: networking
description: >-
  Cover panel for an ASR 9000 power shelf. Twelve module positions in three rows of
  four, legended PM0 to PM11, each with a pair of fixings beside it. Modelled as a
  blank: it closes the shelf face rather than carrying any electrical function.
size: {w: 475.12, h: 193.7}
attrs:
  model: 'Power Shelf Cover'
  role: 'cover'
  positions: '12 (PM0-PM11)'
  eol: 'none-announced'
provenance:
  size: >-
    drawing - the stencil master 'Power Shelf Cover' at 1:10, 475.12 x 193.7 mm. Shape-
    box aspect 2.4529 against the art's own 2.4529 - they agree exactly, so the box is
    the art box for this master, as it is for the trays and is not for the line cards.
  positions: >-
    drawing - twelve openings on a 105.05 mm column pitch and a 48.7 mm row pitch, each
    legended, read off the master. The legends are PM0 through PM11 in reading order.
  identity: >-
    NO PART NUMBER. The stencil master is named 'Power Shelf Cover' and no document in
    the 78-document intake uses that phrase or gives an order code for it. Which
    chassis's shelf it covers is not stated either, though twelve positions points at
    the largest of the family. Nothing is invented here: the component carries the
    stencil's own name and this sentence.
  lifecycle: >-
    searched - no end-of-life notice is in the intake, and with no part number there is
    nothing to search for.
relief:
  wall: '#4a4f55'
skins: [default]
