format: 1
kind: module
name: a9k-power-shelf-cover
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Cover panel for an ASR 9000 power shelf. Four louvred columns of seven bands each,
  sixteen module positions legended PM0 to PM15 on the strips between them, and PS0 to
  PS3 down both edges for the four shelves. Modelled as a blank: it closes the shelf
  face and passes air, and carries no electrical function.
unplaced: >-
  no ASR 9000 chassis in this library seats this cover, because the power shelf it covers is
  not modelled as a bay. Tracked in roc-ops/Portrayal#262.
size: {w: 475.06, h: 193.67}
attrs:
  model: 'Power Shelf Cover'
  role: 'cover'
  positions: '16 (PM0-PM15)'
  shelves: '4 (PS0-PS3)'
  eol: 'none-announced'
provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 4 vent fields at vent 26 (one number, carried by
    9 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE READING
    OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind of interpolated
    anyway... It's just to give it a realistic view instead of just being a flat 2d... All
    of the 3d stuff is going to be mostly conjecture unless the vendor provides that data.'
    So a proudness here is an interpolation for a realistic view, NOT a claim about the
    hardware, and the confidence token on every feature says so rather than leaving it to be
    inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE DOES COME FROM
    ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED figure reused
    for the same class of hardware, and these origins are not measured - they are the
    library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size.
  size: >-
    drawing - the stencil master 'Power Shelf Cover' at 1:10, 475.12 x 193.7 mm. Shape-
    box aspect 2.4529 against the art's own 2.4529 - they agree exactly, so the box is
    the art box for this master, as it is for the trays and is not for the line cards.
  positions: >-
    SIXTEEN, and the first pass said twelve. The legends are PM0 through PM15 on a
    105.05 mm column pitch and a 48.7 mm row pitch - four columns by four rows - with
    PS0 to PS3 printed down BOTH edges, so the panel covers four shelves of four
    modules. What the first pass counted was three rows, because the extraction window
    stopped short of the fourth; rendering the model beside the master at matched scale
    is what showed the missing row. The louvres are a separate grid again, seven bands
    per column, and do NOT map one to one onto the module positions.
  identity: >-
    NO PART NUMBER. The stencil master is named 'Power Shelf Cover' and no document in
    the 78-document intake uses that phrase or gives an order code for it. Which
    chassis's shelf it covers is not stated either, though sixteen positions across four
    shelves points at the largest of the family. Nothing is invented here: the component
    carries the stencil's own name and this sentence.
  lifecycle: >-
    searched - no end-of-life notice is in the intake, and with no part number there is
    nothing to search for.
