format: 1
kind: module
name: pwr-c1-1900wac-p
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 1900 W AC Platinum-certified power supply of the Cisco Catalyst 9300 family,
  PWR-C1-1900WAC-P. The same dark, honeycomb-vented rear face as the 1100 W supply but
  with a larger inlet, an AC OK and a PS OK lamp, two release latches and a power cord
  retainer. It delivers 1900 W at a 230 V input and is limited to 1500 W at 115 V.
  Airflow is front-to-back.
size: {w: 82.55, h: 40.1}
size-confidence: {w: datasheet, h: datasheet}
attrs:
  model: 'PWR-C1-1900WAC-P'
  power-output-w: 1900
  input: ac
  inlet: c20
  input-voltage: '200 to 240 VAC for 1900 W, 115 to 127 VAC for 1500 W (autoranging)'
  input-current-max: '12 A at 200 to 240 VAC, 16 A at 115 to 127 VAC'
  input-frequency: '47 to 63 Hz'
  output: '-56 V at 33.92 A (230 V input), -56 V at 26.78 A (115 V input)'
  weight-kg: 1.5
  airflow: front-to-back
  efficiency: platinum
provenance:
  model: >-
    datasheet - Cisco Catalyst 9300 Series Switches Hardware Installation Guide (first
    published 2017-06-20, last modified 2026-05-15), Table 35 lists PWR-C1-1900WAC-P for the
    C9300, C9300L and C9300X series and Figure 47 draws it, isometrically.
  power: >-
    datasheet - Table 44: maximum output power 1900 W at 230 V and 1500 W at 115 V, input
    200 to 240 VAC (1900 W) or 115 to 127 VAC (1500 W) at 47-63 Hz, input current maximum 12
    A and 16 A, output -56 V at 33.92 A and 26.78 A. The 1900 W is carried, as the
    supply's rating at its nominal 230 V input; the 1500 W figure is in the attrs. An
    OUTPUT rating, so power-output-w.
  size: >-
    datasheet - Physical Specifications of Power Supplies, 1.58 x 3.25 x 13.7 in (40.1 x
    82.55 x 348.2 mm), read height, width, depth as cisco/pwr-c1-715wac-p@1 reads it.
  weight: >-
    datasheet - 3.4 lb (1.5 kg).
  depth: >-
    datasheet - 348.2 mm.
  elements: >-
    estimated - Figure 47 is isometric; positions are those of the other AC supplies, see
    cisco/pwr-c1-715wac-p@1, with a larger inlet.
  lamps: >-
    datasheet - Table 36, Switch Power Supply Module LEDs.
  inlet: >-
    estimated - THE GUIDE DOES NOT NAME THE INLET. Its Table 50 lists the cords for this supply
    at 16 A and 20 A with no connector type, and the figure is isometric. A C20 is chosen
    because that is the 16 to 20 A appliance inlet of IEC 60320; no document held names it.
  colour: >-
    estimated - as the other AC supplies.
states: [absent]
elements:
  ac-ok: {at: [10.2, 7.6], size: [3.0, 3.0], class: led, states: ['off', {name: ok, color: '#22c55e'}]}
  ps-ok: {at: [31.4, 7.6], size: [3.0, 3.0], class: led, states: ['off', {name: ok, color: '#22c55e'}, {name: fault, color: '#ef4444'}]}
  latch: {at: [28.2, 29.5], size: [11.0, 9.0], class: handle}
  retainer: {at: [60.0, 31.5], size: [12.7, 7.0], class: handle}
parts:
  - {ref: std/c20-inlet@1, id: inlet, at: [39.0, 5.0]}
relief:
  wall: '#15171a'
skins: [default]
body:
  depth: 348.2
  color: '#2a2c30'
  footprint: {at: [0, 0], size: [82.55, 40.1]}
