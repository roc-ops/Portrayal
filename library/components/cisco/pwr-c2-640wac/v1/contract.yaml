format: 1
kind: module
name: pwr-c2-640wac
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 640 W AC-input power supply of the Cisco Catalyst 3650 and 2960-X/XR families, PWR-C2-640WAC - the
  default supply of every 24- and 48-port PoE+ Catalyst 3650. A light grey face, 1.58 x 3.75 in, with the
  AC OK and PS OK lamps at the upper left over a honeycomb vent, the part number printed at the top, an
  AC power cord receptacle with a cord retainer clip below it and a release latch at the right.
size: {w: 95.25, h: 40.13}
size-confidence: {w: datasheet, h: datasheet}
attrs:
  model: 'PWR-C2-640WAC'
  power-output-w: 640
  input: ac
  inlet: c14
  input-voltage: '100 to 240 VAC, autoranging'
  input-current-max: '8 to 4 A'
  input-frequency: '50 to 60 Hz'
  output: '+12 V at 20.83 A and -54 V at 7.36 A'
  weight-kg: 1.41
  airflow: front-to-back
provenance:
  model: >-
    datasheet - Cisco Catalyst 3650 Switches Hardware Installation Guide, September 2016, OL-29734-01,
    Table 4-1 "Power Supply Module Part Numbers and Descriptions": "PWR-C2-640WAC, 640-W AC power supply
    module". Table 1-13 (chapter 1) makes it the default supply of the 24-port and 48-port PoE switches,
    with 390 W of PoE power available.
  power: >-
    datasheet - the guide's Technical Specifications appendix, spec Table 1-3: "Maximum output power
    PWR-C2-640WAC: 640W", input range 100 to 240 VAC (autoranging) 50 to 60 Hz, input current 8-4 A,
    output ratings "+12 V @20.83 A, -54 V@7.36 A", total input 2371 BTUs per hour (695 W) and total output
    2183 BTUs per hour (640 W). An OUTPUT rating, so `power-output-w`.
  size: >-
    datasheet - spec Table 1-2: "PWR-C2-640WAC 1.58 x 3.75 x 11.75 in. (4.0 x 9.5 x 29.8 cm)", H x W x D,
    weight 3.1 lb (1.41 kg). The face is the 1.58 x 3.75 in end the guide draws; 40.13 and 95.25 mm are
    those inches converted. At the rear of the chassis two of them stand side by side (Figure 1-13), and
    their drawn width, about 95 mm at the figure's scale, agrees with 3.75 in.
  elements: >-
    estimated - read off the guide's Figure 1-13 (the rear, with a PWR-C2-640WAC in the second bay) and
    the sibling supply's Figure 4-5, isometric line drawings, as fractions of the face. Figure 4-4, which is
    captioned "640-W AC Power Supply Module", is the same artwork as Figure 4-5 and prints PWR-C2-250WAC on
    its face, so it is not used for the legend; the 640 W legend is Figure 1-13's. The callouts, from Figure
    4-4's table: AC OK LED, PS OK LED, AC power cord retainer, AC power cord connector, release latch.
  lamps: >-
    datasheet - the guide's Table 1-21 (chapter 1) and Table 4-2: AC OK is off with no AC input power and
    green with AC input present; PS OK is off when the output is disabled or the input is out of range,
    green when power output to the switch is active and red when the output has failed.
  inlet: >-
    estimated - the figure draws an IEC receptacle and the guide's "Installing or Replacing an AC Power
    Supply" step plugs in a power cord with a retainer; the receptacle is drawn as std/c14-inlet@1, the
    form the 250 W to 1025 W supplies share. The guide does not name the receptacle's IEC type.
  colour: >-
    estimated - the guide says its illustrations are "not intended to depict any particular color scheme"
    (Front Panel, PDF p21). A neutral light grey is drawn.
  depth: >-
    datasheet - 11.75 in, 298.45 mm, from spec Table 1-2.
states: [absent]
elements:
  ac-ok: {at: [8.4, 7.0], size: [2.4, 2.4], class: led, states: ['off', {name: ok, color: '#22c55e'}]}
  ps-ok: {at: [21.4, 7.0], size: [2.4, 2.4], class: led, states: ['off', {name: ok, color: '#22c55e'}, {name: fault, color: '#ef4444'}]}
  retainer: {at: [3.0, 34.4], size: [42.0, 4.6], class: handle}
  latch: {at: [75.0, 15.0], size: [9.0, 12.0], class: handle}
parts:
  - {ref: std/c14-inlet@1, id: inlet, at: [42.0, 10.5]}
skins: [default]
body:
  depth: 298.45
  color: '#c4c7ca'
  footprint: {at: [0, 0], size: [95.25, 40.13]}
