format: 1
kind: module
name: a9k-4x100ge-se
version: 1.0.1
class: line-card
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9000 Series 4-Port 100 Gigabit Ethernet Line Card with CPAK. 4 CPAK cages
  down the faceplate, numbered 0 to 3, with a single card Status lamp. Cisco: 'Based on
  Cisco CPAK technology, this line card has flexible interfaces that support 100 Gigabit
  Ethernet, 40 Gigabit Ethernet and 10 Gigabit Ethernet modes, so it gives customers the
  flexibility to mix and match interface types on the same line card.' The -TR sibling
  shares this drawing and has no master of its own.
unplaced: >-
  no ASR 9000 chassis in this library accepts this card: their slot bays name a different card
  generation. The card itself is sourced; what is missing is the datasheet's Chassis
  compatibility row, which says exactly which chassis take it. Tracked in
  roc-ops/Portrayal#262.
size: {w: 41.4, h: 395.7, d: 559.3}
attrs:
  model: 'A9K-4X100GE-SE'
  power-absent: not-published
  role: 'line-card'
  cpak: 4
  media: 'CPAK, 100/40/10 Gigabit Ethernet'
  weight-kg: 12.7
  operating-temp: '5 to 40 C'
  chassis: 'ASR 9006, ASR 9010, ASR 9904, ASR 9912, ASR 9922'
  eol: 'none-announced'
provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 1 panel lamps at dome 0.3 (one number, carried by
    120 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE
    READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind of
    interpolated anyway... It's just to give it a realistic view instead of just being a
    flat 2d... All of the 3d stuff is going to be mostly conjecture unless the vendor
    provides that data.' So a proudness here is an interpolation for a realistic view, NOT a
    claim about the hardware, and the confidence token on every feature says so rather than
    leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE
    DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED
    figure reused for the same class of hardware, and these origins are not measured - they
    are the library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size. STILL REFUSED ON THIS FACE, and these
    are NOT the same kind of gap: the 4 drawn aperture(s) cpak-0, cpak-1, cpak-2, cpak-3 -
    an optical or connector aperture that conforms to no published standard, so no depth
    exists to interpolate from. The ruling sanctions interpolating a PROUDNESS for a
    realistic view. It does not sanction inventing an APERTURE, which is a dimension a
    specification is withholding rather than one nobody has measured.
  size: >-
    datasheet - Cisco ASR 9000 Series 4-Port and 8-Port 100 Gigabit Ethernet Line Cards
    Data Sheet (c78-733790), 'Physical dimensions (H x W x D); weight': '4-port 100
    Gigabit Ethernet Line Card: 14.5 x 1.63 x 22.02 in.; 28 lb (est.) (368.3 mm x 41.4
    mm x 559.3 mm; 12.7 kg)'. H is the LONG dimension in this sheet's axis order and
    368.3 is the PLATE; the card is modelled at the family's ejector-inclusive 395.7,
    the same step and the same reasoning as every other 4th-generation card here, and
    Cisco's own sheets give both figures for cards of this family - 368.3 unqualified
    and 15.58 in = 395.7 where they say '(includes ejector bracket/lever)'. Depth 559.3
    is the sheet's.
  shell: >-
    drawing - the plate, ejector blocks, captive screws and Status lamp are measured off
    this master and scaled to the datasheet's own dimensions on both axes. NOTE THE ART
    BOX IS NOT A SIZE: this master is drawn on the 46.55 x 413.95 template that the
    ORIGINAL generation uses, and the datasheet says 41.4 mm, which is the 4th
    generation's thickness and not that template's 43.7. The A9K-MOD200 is the standing
    proof that a template does not settle a thickness - it sits on the 4th generation's
    template and is an original-generation 43.7 mm card - so the datasheet is the
    authority here and the template is only a fact about which drawing Cisco copied.
  aperture: >-
    DRAWN, NOT COMPOSED, AND DECLARED `class: cutout` ANYWAY - which takes an L26
    warning, and the warning is the point. CPAK IS CISCO-PROPRIETARY AND HAS NO MSA AT
    ALL. There is no multi-source agreement, no public mechanical specification and no
    bezel-opening figure anywhere in the 78-document intake. The cages here are
    transcribed from the master at 13.92 x 37.01 mm and conform to nothing, because
    there is nothing to conform to. The earlier instinct on cards like this was to
    withhold `class: cutout` so the aperture census stayed clean; that is backwards.
    L26's own message ends 'if the dimension cannot be sourced yet, this warning is the
    record of that'. A census kept tidy by not declaring a cutout has been routed
    around, not satisfied. WHAT WOULD CLOSE THIS, stated so a contributor is not sent on
    an errand that cannot be run: CFP MSA membership and the baseline drawing it gives
    access to, or a Cisco mechanical drawing of this faceplate. NOT 'look harder' - this
    is not a search that failed, it is a specification that withholds the figure.
    Contrast the XFP on the 4-port and 2-port 10GE MPAs in this library, where INF-8077i
    gives the bezel opening outright in two figures and the only thing missing had been
    anyone looking outside the vendor's own guide.
  ports: >-
    drawing - the master draws 4 cages at x 18.10 on a pitch that alternates 42.25 and
    44.93 mm, and NUMBERS EVERY ONE ITSELF as text at x 34.21. The numerals are read,
    not inferred: '0' at y 41.04 through '3' at 171.87, each beside its own cage.
  chassis: >-
    datasheet - c78-733790: 'Both the ASR 9000 Series 4-port and 8-port 100 Gigabit
    Ethernet line cards are fully compatible with Cisco ASR 9006 Router, ASR 9010
    Router, ASR 9904 Router, ASR 9912 Router, and ASR 9922 Router. However, their
    chassis may require a hardware update for the cooling and power systems, because the
    line cards offer industry-leading, high-density 100 Gigabit Ethernet throughput.'
    Five chassis, and the caveat is Cisco's own and worth carrying - it is the only
    place in this family where a compatibility statement comes with a condition
    attached.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
  power: >-
    NOT PUBLISHED. Cisco does not state per-card power for this generation in any document
    that could be found, and the search was thorough enough to say so.
    WHAT WAS SEARCHED. All 573 converted documents, for this part number, with a
    twelve-line window either side and again with a thirty-line window against any line
    introducing a power requirement or consumption - no hit. The CANONICAL DATASHEETS are
    staged and converted (datasheet-c78-743580 for the 5th-generation high-density
    multi-rate cards, c78-743579, c78-744662 for the 400 GbE multi-rate card, c78-744663)
    and their product-specification tables run chassis compatibility, port density,
    performance, dimensions, weight, operating and storage temperature, humidity, EMC,
    immunity, safety and NEBS - and then stop. There is no power row.
    Cisco's own per-card power appendix EXISTS and does not cover this card: the ASR
    9000 Ethernet Line Card Installation Guide, Table 35 'Ethernet Line Card Power
    Consumption Values', gives 25/40/55 C figures for the previous generation and has no row
    for a 200 Gigabyte modular card, a 400G combo card or any FLEX part. That was checked
    against the guide's own part-number-to-description mapping table rather than by reading
    the prose.
    A web search in August 2026 returned only reseller listings, which are not a source
    for this library.
    THIS IS A VENDOR DISCLOSURE GAP, NOT AN INTAKE GAP - staging more documents will not
    close it. The remaining routes are the Cisco Power Calculator or asking Cisco directly,
    and if either produces a figure it belongs here.
  identity: >-
    TWO DIFFERENT CARDS SHARE THIS PART NUMBER'S ROOT. cisco/a9k-4x100ge is the QSFP28
    'LAN line card' with its own data sheet c78-740092 at 8.9 kg; this is the CPAK card
    from c78-733790 at 12.7 kg. The masters settle it too - this one's cages are 13.92 x
    37.01 mm against the QSFP28 card's 8.45 x 19.16, nearly twice the length.
