groups:
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: the route processor management cluster - the two management Ethernet ports, the
      console and auxiliary serial ports and the USB port. One job, several media
  timing:
    term: Port
    role: management
    index-origin: 0
    mixed: the GPS and BITS timing block - two SYNC (BITS) jacks and the ToD jack on RJ-45
      beside the 10 MHz and 1 PPS SMB inputs. One job (clock), several media
parts:
  - {ref: std/rj45-ganged@2, id: sync-0, group: timing, at: [55.93, 6.45], attrs: {media: rj48}}
  - {ref: std/rj45-ganged@2, id: sync-1, group: timing, at: [75.83, 6.45], attrs: {media: rj48}}
  - {ref: std/rj45-ganged@2, id: tod, group: timing, at: [96.35, 6.45], attrs: {media: rj45-tod}}
  - {ref: common/rj45-ganged-eth@1, id: mgt-lan-0, group: mgmt, at: [123.07, 6.85], attrs: {speed: 1g, media: rj45}}
  - {ref: std/rj45-ganged@2, id: aux, group: mgmt, at: [144.48, 6.85], attrs: {media: rj45-serial}}
  - {ref: common/rj45-ganged-eth@1, id: mgt-lan-1, group: mgmt, at: [123.07, 22.3], attrs: {speed: 1g, media: rj45}}
  - {ref: std/rj45-ganged@2, id: console, group: mgmt, at: [144.48, 22.3], attrs: {media: rj45-serial}}
