format: 1
kind: module
name: a99-rp-f
version: 2.1.0
class: supervisor
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9900 Fixed Chassis Route Processor. The RP for the ASR 9902 and ASR 9903,
  two per chassis. A compact landscape module: two BITS timing ports, a time-of-day
  port, two management Ethernet ports, console and auxiliary serial ports, a Class A USB
  port, 10 MHz and 1 PPS GPS clock inputs, and nine status lamps in a hex-vented
  faceplate.
size: {w: 221.84, h: 39.52}
attrs:
  model: 'A99-RP-F'
  role: 'route-processor'
  cpu: '64-bit Intel'
  memory: '32 GB'
  mgmt: '2 x RJ-45 management Ethernet'
  console: 'RJ-45 serial'
  timing: '2 x BITS RJ-45, ToD RJ-45, 10 MHz and 1 PPS SMB'
  usb: '1 x USB class A'
  power-draw-max-w: 102
  eol: 'none-announced'
provenance:
  speed: 'guide - Cisco ASR 9000 Series Fixed-Port Routers Hardware Installation Guide, Ethernet
    Ports and Status LEDs: the RP has two RJ-45 Management LAN ports (MGT LAN 0 and MGT LAN
    1) for 10, 100 and 1000 Mbps Ethernet, speed set by autonegotiation. Carried as 1g, the
    top of that range'
  media: 'the RJ-45 jacks are typed by what runs through them rather than by the housing: console
    and auxiliary ports are rj45-serial (RS-232), a time-of-day port is rj45-tod and a BITS
    port is rj48, the media the library devices already use for the same jacks. The two SYNC
    jacks are BITS or DTI inputs/outputs per the same guide, typed rj48 for BITS, their datasheet
    name'
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 9 panel lamps at dome 0.3 (one number, carried by
    120 Cisco contracts); 2 ejector brackets, their levers and the grip flanges at out 4.2
    (one number, carried by 61 Cisco contracts); 2 vent fields at vent 26 (one number,
    carried by 9 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A
    DELIBERATE READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind
    of interpolated anyway... It's just to give it a realistic view instead of just being a
    flat 2d... All of the 3d stuff is going to be mostly conjecture unless the vendor
    provides that data.' So a proudness here is an interpolation for a realistic view, NOT a
    claim about the hardware, and the confidence token on every feature says so rather than
    leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE
    DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED
    figure reused for the same class of hardware, and these origins are not measured - they
    are the library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size.
  ports: >-
    datasheet - Cisco ASR 9903 Compact High-Performance Router Data Sheet: the front
    panel's external interfaces are console and auxiliary serial ports, two management
    Ethernet interfaces, one Class A USB port, a GPS interface (10 MHz, 1PPS and ToD
    ports) and two BITS interfaces. That is seven RJ-45s, two SMBs and a USB, and
    the master draws exactly that: seven jacks at 12.69 x 10.73 mm (std/rj45-ganged's
    12.7 x 11.0 to a tenth), two 7.55 mm SMB bodies and a USB whose 4.59 x 12.21 mouth
    is std/usb-a's 12.0 x 4.5 on its side.
  size: >-
    drawing - the stencil master at 1:10, 221.84 x 39.52 mm. Shape-box aspect 5.6131
    against the art's own 5.6195, agreeing to 0.1 percent, so the box is the art box for
    this master. NO document in the intake gives this card's dimensions: the ASR 9903
    and ASR 9902 data sheets give the CHASSIS envelope including its RPs and stop. Depth
    is therefore absent.
  orientation: >-
    modelled LANDSCAPE, as the master draws it and as the card installs - the ASR 9902
    is 2RU and the ASR 9903 3RU, and the RPs lie flat.
  lamps: >-
    MEASURED, AND THEY USED TO BE ON THE WRONG SIDE. The nine legends - ACTIVE, FAIL,
    BOOT, SYNC, CRIT on one line and PWR, SSD, GPS, MAJ/MIN below - are extracted text
    and their positions are exact. The LAMPS were not: they were placed 3.4 mm LEFT of
    and 1.5 mm above their legends, by eye, and that put every one of them a whole
    legend's width away from where the hardware has it - 12.08 mm out on ACTIVE.
    THE MASTER CONTAINED ITS OWN CORRECTION THE WHOLE TIME. Eight of the nine lenses are
    strokes the extractor cannot separate from the hex field around them, which is why
    the offset was taken by eye. The ninth, ACTIVE's, is drawn as an outlined white
    capsule and resolves cleanly, and it sits to the RIGHT of its legend.
    HOW IT WAS CALIBRATED. The nine legend positions above are known exactly in this
    contract's own frame, so they are the ruler: fitting them against the rendered master
    gives 13.4845 px/mm in x with every legend landing inside 0.05 mm, and the two
    baselines give 13.2143 px/mm in y. In that frame ACTIVE's capsule measures 3.34 x
    1.82 mm, starts 0.30 mm after the legend's right edge, and its centre sits at 32.46
    against a cap-height centre of 32.45 - centred on the text's own band to a hundredth
    of a millimetre, which is not something a wrong calibration produces by accident.
    SO THE RULE IS: centre = (the legend's right edge + 1.97, the centre of its cap
    height), and all nine are placed on it.
    THE SIZE IS ONE LENS MEASURED AND EIGHT INFERRED. Only ACTIVE's is resolvable, so its
    3.34 x 1.82 is carried by all nine on the evidence of a photograph - an ASR 9902 with
    two of these cards seated shows all nine as identical capsules, wider than tall, each
    hard against the right of its legend. That is a photograph read for SHAPE AND
    ARRANGEMENT, never for millimetres: it is a phone picture with keystone in it.
    THE Y SCALE IS THE WEAK ONE and is flagged rather than left to be discovered. It rests
    on two baselines 3.5 mm apart, where x rests on nine legends spread over 58 mm. It is
    good enough to put a lens on a text line and no more is claimed from it.
    AND ONE LEGEND HAD TO BE UNFLATTENED. The skin drew MAJ/MIN as a single line; the
    master draws it as two, "MAJ/" on a baseline at 35.86 and "MIN" at 38.21, and the
    photograph shows the same stack. Left as one line the corrected lamp landed on top of
    its own legend, which is how the flattening was noticed at all. The lamp sits level
    with PWR, SSD and GPS rather than centred on the stack - the photograph shows all four
    of that row in line - and to the right of "MAJ/", the wider of the two.
    The state vocabularies are Table 5 of the Overview and Reference Guide where a name
    matches (FAIL, CRIT, SYNC, SSD and the MAJ/MIN pair); ACTIVE, BOOT, PWR and GPS have
    no row on that table for this card, so PWR, GPS and ACTIVE take the green/off form
    their names imply and BOOT carries off/on.
  power: >-
    install guide - and this figure is NOT from a specification table, so read what it
    is. The fixed-port Hardware Installation Guide's troubleshooting chapter prints a
    `show environment` example from an ASR 9902 with two of these cards installed:
    '0/RP0 A99-RP-F 102 43 ON' under the headings 'Power Allocated Watts' and 'Power
    Used Watts'. 102 W is the budget the system RESERVES for the card, which is the
    number a chassis budget wants and is carried as power-draw-max-w. 43 W was one live
    reading on one router at one moment and is NOT carried as a typical - a single
    sample is not a distribution. The same output gives ASR-9902-LC 614/283 and
    ASR-9902-FAN 72/7, so the allocation figures are systematic rather than incidental.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake. Cisco's
    ordering table also lists A99-RP-F-FC, the flexible-consumption variant of the same
    hardware; it is not modelled separately.
  led-matrix: >-
    SEARCHED AND ABSENT. THIS CARD HAS NO LED MATRIX, and the search is recorded here so
    it is not run again: the ASR 9902 and ASR 9903 both seat this RP, both are asked for
    a four-character matrix because their siblings have one, and the answer is no four
    times over.
    CISCO'S OWN CALLOUTS SCOPE IT TO THE ASR 9901. The fixed-port Hardware Installation
    Guide's RP Front Panel Indicators section prints three chassis figures in a row.
    Figure 165, "Cisco ASR 9902 Router Chassis Front Panel", runs to eight callouts and
    stops at "Nine discrete LED indicators". Figure 166, "Cisco ASR 9901 Router Chassis
    Front Panel", runs to nine, and callout 9 is "LED matrix display". Same section, same
    page, one chassis has it and the next does not. Figure 10 (ASR 9902 front panel
    ports, fourteen callouts) and Figure 11 (ASR 9903, twelve) name no matrix either.
    THE STENCIL AGREES, AND IT HAS A CONVENTION FOR SAYING SO. Cisco's masters draw an
    LED matrix as a rectangle filled with a diamond lattice - the A99-RP3-SE draws its
    matrix landscape that way, the ASR 9901 chassis draws its own portrait the same way.
    The "A99-RP-F" master carries no lattice-filled rectangle anywhere on the face.
    AND SO DOES A PHOTOGRAPH OF THE REAL CARD. An ASR 9902 with two of these seated shows
    both faceplates end to end: 10MHz and 1PPS, SYNC 0 and 1, ToD, the nine lamps, MGT
    LAN, AUX and CONSOLE, the USB, five small apertures in an L and a round LAMP TEST
    button. No window, no bezel, no lattice.
    WHY THE TABLES DO NOT OVERRULE THIS. Tables 25 and 26 of the same guide are headed
    "RSP Boot Stages and Runtime Displays" and "RSP LED Matrix CAN Bus Controller Status
    Display", and a reader could take "RSP" to reach every route processor in the family.
    Cisco's scoping is the per-chassis figure, not the table's title: cisco/led-matrix-4@1
    carries those tables because the ASR 9901's figure calls a matrix out, and this card
    does not carry them because its chassis' figure does not.
  lamp-test: >-
    NOT MODELLED, AND DRAWN BY CISCO. The master and the photograph both show a round
    LAMP TEST push button at the right of the face, with five small square apertures in an
    L beside it, and neither is in `elements`. Found while establishing that the matrix is
    absent; recorded here rather than added, because what the five apertures ARE is not
    stated anywhere in the intake and a button placed beside four unknowns is half a
    reading. cisco/a9k-rsp@1 models its own lamp-test button and is the shape this would
    take.
