format: 1
kind: module
name: a99-rp-f
version: 1.0.1
class: supervisor
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9900 Fixed Chassis Route Processor. The RP for the ASR 9902 and ASR 9903,
  two per chassis. A compact landscape module: two BITS timing ports, a time-of-day
  port, two management Ethernet ports, console and auxiliary serial ports, a Class A USB
  port, 10 MHz and 1 PPS GPS clock inputs, and nine status lamps in a hex-vented
  faceplate.
size: {w: 221.84, h: 39.52}
attrs:
  model: 'A99-RP-F'
  role: 'route-processor'
  cpu: '64-bit Intel'
  memory: '32 GB'
  mgmt: '2 x RJ-45 management Ethernet'
  console: 'RJ-45 serial'
  timing: '2 x BITS RJ-45, ToD RJ-45, 10 MHz and 1 PPS SMB'
  usb: '1 x USB class A'
  power-draw-max-w: 102
  eol: 'none-announced'
provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 9 panel lamps at dome 0.3 (one number, carried by
    120 Cisco contracts); 2 ejector brackets, their levers and the grip flanges at out 4.2
    (one number, carried by 61 Cisco contracts); 2 vent fields at vent 26 (one number,
    carried by 9 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A
    DELIBERATE READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind
    of interpolated anyway... It's just to give it a realistic view instead of just being a
    flat 2d... All of the 3d stuff is going to be mostly conjecture unless the vendor
    provides that data.' So a proudness here is an interpolation for a realistic view, NOT a
    claim about the hardware, and the confidence token on every feature says so rather than
    leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE
    DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED
    figure reused for the same class of hardware, and these origins are not measured - they
    are the library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size.
  ports: >-
    datasheet - Cisco ASR 9903 Compact High-Performance Router Data Sheet: 'A set of
    external interfaces on the front panel includes: console and auxiliary serial ports,
    two management Ethernet interfaces, a Class A USB port, GPS interface (10Mhz, 1PPS,
    ToD ports), and two BITS interfaces.' That is seven RJ-45s, two SMBs and a USB, and
    the master draws exactly that: seven jacks at 12.69 x 10.73 mm (std/rj45-ganged's
    12.7 x 11.0 to a tenth), two 7.55 mm SMB bodies and a USB whose 4.59 x 12.21 mouth
    is std/usb-a's 12.0 x 4.5 on its side.
  size: >-
    drawing - the stencil master at 1:10, 221.84 x 39.52 mm. Shape-box aspect 5.6131
    against the art's own 5.6195, agreeing to 0.1 percent, so the box is the art box for
    this master. NO document in the intake gives this card's dimensions: the ASR 9903
    and ASR 9902 data sheets give the CHASSIS envelope including its RPs and stop. Depth
    is therefore absent.
  orientation: >-
    modelled LANDSCAPE, as the master draws it and as the card installs - the ASR 9902
    is 2RU and the ASR 9903 3RU, and the RPs lie flat.
  lamps: >-
    READ THIS BEFORE TRUSTING A LAMP POSITION. The nine legends - ACTIVE, FAIL, BOOT,
    SYNC, CRIT on one line and PWR, SSD, GPS, MAJ/MIN below - are extracted text and
    their positions are exact. The LAMPS THEMSELVES ARE NOT: they are drawn as small
    strokes that the extractor cannot separate from the hex vent field around them, so
    each lamp is placed 3.4 mm left and 1.5 mm above its own legend, which is where the
    rendered artwork puts them by eye. The names and the count are sourced; the
    coordinates are a consistent offset, and anyone needing better should re-measure
    from the master. The state vocabularies are Table 5 of the Overview and Reference
    Guide where a name matches (FAIL, CRIT, SYNC, SSD and the MAJ/MIN pair); ACTIVE,
    BOOT, PWR and GPS have no row on that table for this card, so PWR, GPS and ACTIVE
    take the green/off form their names imply and BOOT carries off/on.
  power: >-
    install guide - and this figure is NOT from a specification table, so read what it
    is. The fixed-port Hardware Installation Guide's troubleshooting chapter prints a
    `show environment` example from an ASR 9902 with two of these cards installed:
    '0/RP0 A99-RP-F 102 43 ON' under the headings 'Power Allocated Watts' and 'Power
    Used Watts'. 102 W is the budget the system RESERVES for the card, which is the
    number a chassis budget wants and is carried as power-draw-max-w. 43 W was one live
    reading on one router at one moment and is NOT carried as a typical - a single
    sample is not a distribution. The same output gives ASR-9902-LC 614/283 and
    ASR-9902-FAN 72/7, so the allocation figures are systematic rather than incidental.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake. Cisco's
    ordering table also lists A99-RP-F-FC, the flexible-consumption variant of the same
    hardware; it is not modelled separately.
