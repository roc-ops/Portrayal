  - {ref: std/rj45-ganged@1, id: console, at: [5.98, 84.54], rotate: 90}
  - {ref: std/rj45-ganged@1, id: aux, at: [5.98, 105.71], rotate: 90}
  - {ref: std/rj45-ganged@1, id: sync-0, at: [5.98, 126.89], rotate: 90}
  - {ref: std/rj45-ganged@1, id: sync-1, at: [5.98, 148.08], rotate: 90}
body:
  depth: 673.8
  color: '#b9bec4'
