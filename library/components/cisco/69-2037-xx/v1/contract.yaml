format: 1
kind: kit
name: 69-2037-xx
version: 1.0.0
description: >-
  Cisco's standard rack-mount kit for the Catalyst 4948E and 4948E-F: two L brackets, eight
  M4 screws for the chassis and eight rack screws, shipped in the accessory kit of the switch.
motion: fixed
parts:
  - {ref: cisco/69-2037-xx-bracket@1, id: bracket, count: 2}
configurations:
  - id: four-post
    racks: [4-post]
    parts: [bracket]
    depth: [488.95, 825.5]
provenance:
  depth: >-
    Catalyst 4948E and Catalyst 4948E-F Switch Installation Guide OL-21561-02, chapter 2:
    the rack depth "between the front- and rear-mounting strips" is at least 19.25 inches
    (48.9 cm) and at most 32.5 inches (82.5 cm), which is 488.95 and 825.5 mm.
    The guide's 4900 sibling (Catalyst 4900 Series Switch Installation Guide, August 2008) gives
    the same minimum and 32 inches for its own kit; that kit has no part number there.
  parts: >-
    Table 3-1 of the same guide lists the kit as "Standard rack-mount kit for both chassis.
    Kit includes brackets and screws". Screws are not parts here.
