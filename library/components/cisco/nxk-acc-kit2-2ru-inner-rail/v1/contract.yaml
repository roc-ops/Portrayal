format: 1
kind: component
name: nxk-acc-kit2-2ru-inner-rail
version: 1.0.0
class: mount
behaviour: mounts
profile: networking
description: >-
  The inner rail of the Cisco NXK-ACC-KIT2-2RU rack-mount kit, two to a kit. It screws to the
  side of the chassis and slides into the outer rail. Drawn as a plain plate: no guide
  dimensions it.
size: {w: 8.0, h: 20.0}
size-confidence: {w: estimated, h: estimated}
provenance:
  model: >-
    datasheet - the Cisco N93180YC-FX3S NX-OS Mode Switch Hardware Installation Guide (First
    Published 2020-07-22, Last Modified 2026-07-27), "Installing the Switch using the
    NXK-ACC-KIT2-2RU Rack-Mount Kit": "Verify that the switch rack-mount kit includes these
    parts: Rack-mount inner rails (2), Rack-mount outer rails (2), Flat head screws (12)", and
    "Install the two inner rails to the sides of the chassis using flat-head screws". The Cisco
    N93108TC-FX3 guide (Last Modified 2026-07-16) says the same.
  size: >-
    estimated - NO GUIDE DIMENSIONS THIS PART. 8.0 by 20.0 mm is a placeholder envelope for the
    rail seen end on; nothing measures it, and the length of the rail is not stated.
skins: [default]
