format: 1
kind: module
name: asr-9922-fan-v3
version: 1.1.1
class: fan
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9922 Router fan tray, version 3. Twelve axial 120 mm (4.72 in) fans behind a
  full-width plate, with a pull handle across the middle, a grip at each end, a FAN
  STATUS lamp and two hazard labels. The ASR 9922 carries four of these and the ASR 9912
  three; the V3 is the wider tray - Cisco raised it from 16.3 to 17.3 inches and lifted
  each fan's current rating to 2 A - and it is the tray the 16-port, 20-port and 32-port
  100GE line cards require in a 9922.
size: {w: 475.95, h: 38.1, d: 584.2}
attrs:
  model: 'ASR-9922-FAN-V3'
  role: 'fan-tray'
  fans: '12 x 120 mm axial'
  weight-kg: 8.16
  power-draw-max-w: 2800
  eol: 'none-announced'
provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 2 ejector brackets, their levers and the grip
    flanges at out 4.2 (one number, carried by 61 Cisco contracts); 1 pull handles at
    uhandle 8.0 (one number, carried by 10 Cisco contracts); 1 panel lamps at dome 0.3 (one
    number, carried by 120 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS
    A DELIBERATE READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is
    kind of interpolated anyway... It's just to give it a realistic view instead of just
    being a flat 2d... All of the 3d stuff is going to be mostly conjecture unless the
    vendor provides that data.' So a proudness here is an interpolation for a realistic
    view, NOT a claim about the hardware, and the confidence token on every feature says so
    rather than leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY
    NUMBER HERE DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another
    part's MEASURED figure reused for the same class of hardware, and these origins are not
    measured - they are the library's first guess at that hardware, and the contracts say so
    themselves: agr-panel-screw's provenance reads 'estimated - it stands proud but was not
    measured', agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its
    proudness, agr-fan describes its handle and grille by appearance only, and
    common/led-dot's entire provenance is 'size: estimated'. Spelling that chain `borrowed`
    would convert a guess into an apparent measurement at one remove, a thousand times over.
    `source` still names the origin, so the coordinating benefit is kept and only the claim
    that is not true is dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried
    by sixty-odd contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings
    that happened to agree. One caliper on any one Cisco captive screw, any one ejector
    lever or any one panel lamp corrects every part in the library that shares it, which is
    the whole reason the numbers are pooled instead of chosen per card. THE SEARCH FOR A
    REAL FIGURE WAS RUN FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts
    for 'protrud', 'extends outward', 'stands proud' and 'clearance in front' - the only
    vendor in the intake that publishes a projection is UfiSpace, on the S9510-28DC; the
    per-card dimension tables, including Table A-10 of the older Ethernet Line Card
    Installation Guide which the current revision dropped, all of which carry H, W, D and
    weight only; and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR
    elevations with no side, top or isometric view, so it holds no depth axis at all and is
    closed as a source. Figure 48 of the Ethernet Line Card Installation Guide and Figure
    1-8 of the ISM guide DO show this hardware in three dimensions and are perspective
    drawings with a vanishing point, so they settle the ARRANGEMENT - bracket off the plate,
    lever along it, domed screw head proud of both - and nothing about size.
  size: >-
    install guide AND drawing, and they agree, which is the point. The Overview and
    Reference Guide states the V3 change directly: 'The fan tray width is increased from
    16.3 inches to 17.3 inches. The overall fan tray depth remains the same at 23
    inches.' 17.3 in is 439.4 mm; the master's plate measures 434.98 mm inside the
    475.95 mm envelope the shapesheet gives, which includes the grip at each end. Those
    agree to one percent from two independent directions. BOTH AXES from index.json's
    shapesheet at the stencil's 1:10 inches, which is the rule this component was
    CORRECTED to follow. The first version took its height from the shapesheet and its
    width from the art bounding box - the mixed-source error that made a power module
    3.66 mm too wide and stopped three of them fitting a shelf built for three. Here the
    gap was 1.89 mm on a 447 mm part, which is the dangerous size: small enough to look
    right, systematic enough to be wrong everywhere.
  depth: >-
    install guide - 23 inches, 584.2 mm, and it is THE SAME SENTENCE the width above is
    read from: 'The fan tray width is increased from 16.3 inches to 17.3 inches. The
    overall fan tray depth remains the same at 23 inches.' (Overview and Reference Guide,
    'Cisco ASR 9922 Router and Cisco ASR 9912 Router Fan Trays', item 6). SAY THAT PLAINLY
    RATHER THAN LET IT LOOK LIKE A SECOND SOURCE: the width and the depth stand or fall
    together, so if the reading that item 6 describes the V3 tray is wrong, both numbers
    are wrong, and there is no independent check on either. `body.depth` below RESTATES
    this number for the 3D body box; it is one measurement written in two places because
    the renderer reads one and the exporter the other, not two agreeing readings. Note
    also what this figure is: the tray's OVERALL depth, which is what a body box wants -
    Cisco does not qualify it further and does not say whether the grips are inside it.
    THIS IS THE ONLY CISCO FAN TRAY OR POWER MODULE IN THE INTAKE WITH A PUBLISHED DEPTH.
    The other four trays' sections (ASR 9001, 9006, 9010, 9910) give fan count, fan
    diameter, captive-screw count, finger guard and weight and NO dimension at all, and
    no PEM or power tray anywhere in the 112 documents carries one - searched for the part
    numbers and for 'power entry module' with a dimension on the line, in the current and
    the older revision of the Overview and Reference Guide both.
  lamp: >-
    install guide - the Overview and Reference Guide's 'Fan Tray Status Indicators'
    section, transcribed: 'After fan tray insertion into the chassis, the LED lights up
    temporarily appearing yellow. During normal operation: The LED lights green to
    indicate that all fans in the module are operating normally. The LED lights red to
    indicate a fan failure or another fault in the fan tray module. Possible faults are:
    Fan stopped. Fans running below required speed to maintain sufficient cooling.
    Controller card has a fault.' Four states - yellow is a real one and is the
    insertion state, not an omission.
  fans: >-
    install guide - 'Cisco ASR 9922 Router and Cisco ASR 9912 Router Fan Trays': 'The
    Cisco ASR 9922 Router contains four fan trays, and the Cisco ASR 9912 Router
    contains three fan trays for redundancy... The fan tray contains 12 axial 120-mm
    (4.72-in) fans... secured by two captive screws... The maximum weight of the fan
    tray is 18.00 lb (8.16 kg).' Cisco's warning is worth carrying with the part: 'Do
    not operate the chassis with any of the fan trays completely missing. Replace any
    missing fan tray within five minutes.'
  power: >-
    install guide - Table 24 of the Overview and Reference Guide, row 'ASR 9922 Fan Tray
    V3': 500 W at 25 C, 1200 W at 40 C, 2800 W at 55 C. max is the worst rated ambient;
    the spread is five to one, so the 25 C figure is not a number to budget a chassis
    with. The V2 row exists separately at 200/870/1000 W and is a different tray, not a
    different reading of this one. Cisco does not qualify these as typical or maximum.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
