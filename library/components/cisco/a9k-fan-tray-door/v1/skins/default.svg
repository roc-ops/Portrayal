<svg xmlns="http://www.w3.org/2000/svg" width="444.5mm" height="70.97mm" viewBox="0 0 444.5 70.97">
  <rect id="door" x="0" y="0" width="444.5" height="70.97" rx="1.2"
        fill="#e6e7e9" stroke="#9aa0a6" stroke-width="0.3"/>
  <!-- the stiffening return the front master draws along the top and bottom -->
  <rect x="0" y="0" width="444.5" height="1.8" fill="#dcdee0"/>
  <rect x="0" y="69.17" width="444.5" height="1.8" fill="#dcdee0"/>
  <g id="silkscreen">
    <!-- The Cisco bridge and wordmark, and the family legend, lifted at their
         measured positions from the ASR 9006 front master. Nine teal bars in the
         5.4 / 9.0 / 16.5 / 9.0 / 5.4 mm pattern, then the wordmark as its five
         glyph shapes and the two dots of the registered mark. The wordmark is SET
         AS TEXT rather than traced: the extractor gives each glyph's bounding box
         and not its letterform, and five red boxes on the door would be a worse
         likeness of the mark than five letters at the measured metrics. Origin,
         x-height and overall span are the master's; the letterforms are a font. -->
    <rect x="48.96" y="32.23" width="2.61" height="5.37" fill="#005568"/>
    <rect x="56.11" y="28.62" width="2.61" height="8.97" fill="#005568"/>
    <rect x="63.28" y="23.69" width="2.59" height="16.52" fill="#005568"/>
    <rect x="70.43" y="28.62" width="2.61" height="8.97" fill="#005568"/>
    <rect x="77.59" y="32.23" width="2.59" height="5.37" fill="#005568"/>
    <rect x="84.74" y="28.62" width="2.61" height="8.97" fill="#005568"/>
    <rect x="91.92" y="23.69" width="2.59" height="16.52" fill="#005568"/>
    <rect x="99.05" y="28.62" width="2.62" height="8.97" fill="#005568"/>
    <rect x="106.23" y="32.23" width="2.59" height="5.37" fill="#005568"/>
    <text x="54.36" y="55.46" font-family="sans-serif" font-size="18.0"
          font-weight="bold" letter-spacing="-0.6" fill="#c41230">cisco</text>
    <text x="106.2" y="55.27" font-family="sans-serif" font-size="3.4"
          fill="#c41230">&#174;</text>
    <text x="289.73" y="53.28" font-family="sans-serif" font-size="7.66" fill="#231f20">Cisco ASR 9000 Series</text>
  </g>
  <g id="screw">
    <circle cx="432.5" cy="35.48" r="3.4" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3"/>
    <circle cx="432.5" cy="35.48" r="1.5" fill="#6d7379"/>
    <path d="M 430.1 35.48 H 434.9 M 432.5 33.09 V 37.88" stroke="#3a4046" stroke-width="0.35" fill="none"/>
  </g>
</svg>
