<svg xmlns="http://www.w3.org/2000/svg" width="444.5mm" height="70.97mm" viewBox="0 0 444.5 70.97">
  <rect id="door" x="0" y="0" width="444.5" height="70.97" rx="1.2"
        fill="#e6e7e9" stroke="#9aa0a6" stroke-width="0.3"/>
  <!-- the stiffening return the front master draws along the top and bottom -->
  <rect x="0" y="0" width="444.5" height="1.8" fill="#dcdee0"/>
  <rect x="0" y="69.17" width="444.5" height="1.8" fill="#dcdee0"/>
  <g id="silkscreen">
    <!-- The wordmark and the family legend at their measured positions from the
         ASR 9006 front master. The cisco bridge above the wordmark is NOT drawn:
         vendor logos are not reproduced, so its measured box is reserved as the
         logo-zone and left empty. The wordmark is set as plain text - origin,
         x-height and overall span are the master's; the letterforms are a font. -->
    <rect id="logo-zone" x="48.96" y="23.69" width="59.86" height="16.52" fill="none"/>
    <text x="54.36" y="55.46" font-family="sans-serif" font-size="18.0"
          font-weight="bold" letter-spacing="-0.6" fill="#c41230">cisco</text>
    <text x="106.2" y="55.27" font-family="sans-serif" font-size="3.4"
          fill="#c41230">&#174;</text>
    <text x="289.73" y="53.28" font-family="sans-serif" font-size="7.66" fill="#231f20">Cisco ASR 9000 Series</text>
  </g>
  <g id="screw">
    <circle cx="432.5" cy="35.48" r="3.4" fill="#b8bdc2" stroke="#9aa0a6" stroke-width="0.3"/>
    <circle cx="432.5" cy="35.48" r="1.5" fill="#6d7379"/>
    <path d="M 430.1 35.48 H 434.9 M 432.5 33.09 V 37.88" stroke="#3a4046" stroke-width="0.35" fill="none"/>
  </g>
</svg>
