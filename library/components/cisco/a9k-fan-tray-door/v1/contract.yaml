format: 1
kind: module
name: a9k-fan-tray-door
version: 1.0.1
class: blank
behaviour: fills
profile: networking
description: >-
  Hinged fan tray door for the Cisco ASR 9006 Router. A cosmetic and EMC door across
  the top of the chassis front, covering both fan trays FT0 and FT1, hinged at one
  side and held by a single captive screw. THIS IS THE PART THAT CARRIES THE CHASSIS
  BRANDING: the cisco bridge, the wordmark and the "Cisco ASR 9000 Series" legend are
  printed on the door face (the bridge is a logo and is not drawn - see logo-zone), not on the chassis, which is why they belong here and are
  deliberately absent from the ASR 9006 device manifest. Open the door and the
  branding swings away with it.
size: {w: 444.5, h: 70.97, d: 20.0}
attrs:
  model: 'ASR 9006 fan tray door'
  role: 'access-door'
provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 1 captive screw heads at cyl 1.6 (one number,
    carried by 63 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A
    DELIBERATE READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind
    of interpolated anyway... It's just to give it a realistic view instead of just being a
    flat 2d... All of the 3d stuff is going to be mostly conjecture unless the vendor
    provides that data.' So a proudness here is an interpolation for a realistic view, NOT a
    claim about the hardware, and the confidence token on every feature says so rather than
    leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE
    DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED
    figure reused for the same class of hardware, and these origins are not measured - they
    are the library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size.
  existence: >-
    install guide - b-asr9k-hardware-installation-guide.pdf, "Removing a Fan Tray from
    the Cisco ASR 9006 Router", step 1: "Loosen the captive screw that secures the fan
    tray door to the chassis and open the door". So the door exists, it is hinged, and
    it is secured by ONE captive screw. That sentence is the whole of what any document
    in the intake says about this part.
  size: >-
    DERIVED FROM THE CHASSIS, which is the right way round for a rack-face part: this
    is trim on the chassis front, so it is sized to the opening it covers and not to a
    body of its own. Height 70.97 mm is the door face measured by asr9k-chassis in the
    ASR 9006 front master and committed in that chassis manifest - the fan band there
    runs 0 to 104.63 mm of which the top 33.66 mm is a shroud, and the two fan tray
    openings ft-0 and ft-1 are placed at y 33.66 with height 70.97, so the door face
    and the openings it covers are coincident to the millimetre. Width 444.5 mm is the
    chassis body width, 17.5 in, which is the only width available: the door must span
    both openings, and those run from x 60.94 to 413.53 mm, comfortably inside it.
  width-is-not-measured: >-
    A LIMIT WORTH STATING PLAINLY. The front master does not delineate this door. It
    draws the whole chassis front as one gradient running ear to ear and prints the
    branding on top of it, so there is no outline in the artwork whose width could be
    read. 444.5 is therefore the body width rather than a measurement of the part, and
    the door could in truth be inset a few millimetres at each end. Nothing in the
    intake settles it. What IS certain from the drawing is that the door is at least as
    wide as the branding plus both openings, and 444.5 is the smallest width consistent
    with that which is also a real dimension of this chassis.
  branding: >-
    drawing - lifted from the ASR 9006 front master at its measured positions. The
    calibration is the ear-inclusive chassis face, 482.6 x 444.5 mm against an art box
    of 616.16 x 563.86, which gives 0.78324 mm per unit across and 0.78832 along - two
    independently derived scales agreeing to 0.64 percent, which is the cross-check
    that the art box really is the chassis face. Coordinates are then shifted by the
    19.05 mm ear at the left and the 33.66 mm shroud at the top to land in the door's
    own frame. The master's bridge spans x 48.96 to 108.82 and y 23.69 to 40.21; it is
    NOT DRAWN, because vendor logos are not reproduced in this library, and that box is
    reserved as `logo-zone` and left empty. 1.0.0 traced it as nine teal bars, which was
    a mistake. The wordmark is its five red (#c41230) glyph shapes at y 44.60 plus the
    two dots of the registered mark, and the legend "Cisco ASR 9000 Series" is live
    text in the master at 7.66 mm.
    The wordmark is SET AS TEXT and not traced, which is the one place this drawing
    departs from the master: the extractor yields each glyph's bounding box, so
    carrying it verbatim would put five red blocks on the door, and five blocks are a
    worse likeness of the mark than five letters standing at the measured origin,
    x-height and span. That the whole of that artwork falls inside y 0 to 70.97 - the door face computed
    from a completely different measurement, asr9k-chassis's fan band - is a second
    cross-check, and it is the one that says the branding really is on the door.
  screw: >-
    POSITION IS A DRAWING DECISION, not a measurement. The install guide gives the
    screw's existence and its count, one, and nothing about where it is. A hinged door
    latches on the side away from its hinge, so it is drawn at the right-hand end on
    the centreline. Same standing as the fan arrangement on cisco/asr-9006-fan: the
    inventory is sourced and the placement is mine.
  power: >-
    NOT APPLICABLE and deliberately absent. A door consumes nothing, and class blank
    is outside the lint's DRAW_CLASSES, so no power figure is expected or given. The
    fan power for this chassis belongs to cisco/asr-9006-fan, which is the FRU behind
    this door and states 375 W.
elements:
  logo-zone: {at: [48.96, 23.69], size: [59.86, 16.52], class: logo-zone}
  screw:
    at: [428.5, 32.09]
    size: [8.0, 8.0]
    description: >-
      the single captive screw that secures the fan tray door to the chassis
