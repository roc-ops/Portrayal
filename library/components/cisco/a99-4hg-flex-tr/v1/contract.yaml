format: 1
kind: module
name: a99-4hg-flex-tr
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Cisco A99 400GE Combo Packet Transport Line Card, 5th generation. Forty-four ports on
  one faceplate: twenty-four SFP+ at 10GE, sixteen SFP28 at 10 or 25GE, and four
  QSFP+/QSFP28 at 40 or 100GE, for 400 Gigabit of aggregate bandwidth. The ports are
  colour-coded into four groups of eleven and each group carries up to 100GE, so the
  supported combinations are a table rather than a sum.
size: {w: 42.67, h: 403.1, d: 609.6}
