class: line-card
profile: networking
description: >-
  Cisco ASR 9000 Series 48-Port Dual-Rate 10GE/1GE Line Card, Service Edge optimised.
  Forty-eight SFP+ cages in two rows of twenty-four, each taking a 1 Gigabit SFP or a 10
  Gigabit SFP+ optic. Even-numbered ports are the upper row, odd the lower.
size: {w: 41.4, h: 395.7, d: 559.3}
