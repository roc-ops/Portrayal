  model: 'A9K-48X10GE-1G-SE'
  role: 'line-card'
  generation: '4th'
  sfp-plus: 48
  media: 'SFP (1GE) or SFP+ (10GE), per port'
  weight-kg: 9.1
  power-draw-max-w: 850
  operating-temp: '5 to 40 C'
  eol: 'none-announced'
provenance:
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): on a card
    drawn on its side a pair sits left and right, the left cage 270 beside the right 90,
    so both cage lips face the band between the two cages and both bails face outward.
    Decided by the rule, not an observation, so a photograph of the stack overturns it:
    the 24 SFP pairs (p0/p1 to p40/p47). Turning a composed cage in place changes no
    box, id or anything a device places, so it is a minor bump (S6).
  chassis-compatibility: >-
    datasheet c78-738704, the Chassis compatibility row, which names the chassis this
    card is supported in. That row is why the slot bays accept it; geometry is not a
    compatibility source. See roc-ops/Portrayal#262.
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 4 ejector brackets, their levers and the grip
    flanges at out 4.2 (one number, carried by 61 Cisco contracts); 2 captive screw heads at
    cyl 1.6 (one number, carried by 63 Cisco contracts); 1 asset labels at out 0.2 (one
    number, carried by 22 Cisco contracts); 1 panel lamps at dome 0.3 (one number, carried
    by 120 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE
    READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind of
    interpolated anyway... It's just to give it a realistic view instead of just being a
    flat 2d... All of the 3d stuff is going to be mostly conjecture unless the vendor
    provides that data.' So a proudness here is an interpolation for a realistic view, NOT a
    claim about the hardware, and the confidence token on every feature says so rather than
    leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE
    DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED
    figure reused for the same class of hardware, and these origins are not measured - they
    are the library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size. STILL REFUSED ON THIS FACE, and these
    are NOT the same kind of gap: pivot-top - each would need an EIGHTH family number for
    one or two nodes, which buys a little realism at the cost of another invented figure;
    left flat deliberately. The ruling sanctions interpolating a PROUDNESS for a realistic
    view. It does not sanction inventing an APERTURE, which is a dimension a specification
    is withholding rather than one nobody has measured.
  size: >-
    READ THIS ONE. The 24-port and 48-port dual-rate data sheet gives 'Physical
    dimensions (H x W x D)' as '14.5 x 1.63 x 22.02 in.; (368.3 mm x 41.4 mm x 559.3
    mm)' - and unlike every other line-card sheet in this intake its heading does NOT
    carry the '(includes ejector bracket/lever)' qualifier. Its 41.4 mm agrees exactly
    with the family's card thickness; its 368.3 mm is 27.4 mm short of the 395.7 the
    qualified sheets give. The card is modelled at 395.7 rather than 368.3, and the
    reason is positive rather than a preference: the shell in this master - plate, both
    ejector assemblies, both captive screws - is the SAME DRAWING as the 16-port and
    32-port masters, sixteen of eighteen features agreeing to 0.00 mm when all are
    anchored at 395.7. One shell cannot be two lengths. So 368.3 is read as the plate
    without its ejector brackets, which is what the missing qualifier implies, and BOTH
    numbers are recorded here. Depth is the sheet's own 559.3, which really is shorter
    than the 100GE cards' 604.5.
  layout: >-
    drawing - the Cisco Visio master, scaled to the datasheet's own overall dimensions.
    index.json's shape box is NOT the card: it reads 1.72 x 14.75 in for every card
    master against the datasheets' 1.63 x 15.58, five percent out in both axes. The ART
    is orthographic: taking Cisco's stated W - the spec table says it 'includes ejector
    bracket/lever' - as the full long extent of the drawing puts the faceplate rectangle
    at 41.6 mm against a stated H of 41.4, inside half a percent.
  frame: >-
    the card is modelled PORTRAIT - x across the card's thickness, y along its width -
    which is the stencil's own frame and casa's. WHICH WAY A CHASSIS CARRIES IT is the
    Overview and Reference Guide's 'Chassis Slots' section, set out here because an
    earlier version of this note had it wrong for three chassis out of seven: on the ASR
    9010 every line card and RSP card faces the front and stands VERTICALLY, its ejector
    levers and captive screws at the card's top and bottom; on the ASR 9006 and the ASR
    9904 every line card and RSP card faces the front and lies HORIZONTALLY, its levers
    and screws at the card's left and right ends; and the ASR 9906, ASR 9910, ASR 9922
    and ASR 9912 are each given as vertical. So only the ASR 9006 and the ASR 9904 lay
    their cards flat and rotate the bay; the other five place this component unrotated.
    The ejector-lever wording is the tell and it is why the guide's own terms are kept -
    'top and bottom' means vertical, 'left and right ends' means
    horizontal, and the RU height of a chassis does not decide it.
  cages: >-
    composed from std/, not drawn. These masters draw a cage as a STROKED grey rectangle
    with no fill, so the dark-bore reader that finds the QSFP cards' apertures finds
    nothing on them - the cages here come from the outline layer instead. Measured 9.17
    x 14.2 mm, which rotated is 14.2 x 9.17 against std/sfp-ganged's SFF-8433 aperture
    of 14.25 x 10.40: the PITCH dimension agrees to 0.05 mm and the height is 12 percent
    under, which is the drawn opening sitting inside the bezel cutout. The registry
    figure is what is placed.
  numbering: >-
    the port numerals are transcribed from the master, and the way they were matched to
    cages is worth recording because two simpler rules each failed on a real card.
    Nearest-numeral-per-cage put three cages of the 48-port card on one number, because
    a numeral printed outboard of one row can be nearer a cage in the other row than the
    one it labels. Pairing whole ROWS and zipping by y works for the dual-rate pair and
    breaks on the 400G combo, whose two rows of 22 cages carry 24 and 20 numerals - its
    four QSFP ports are numbered 40 to 43 and printed on the opposite side from the SFP
    ports they sit beside. What is used is closest-pair-first over every numeral and
    every cage, with an assertion that the result is a permutation of 0..n-1; on all six
    masters it is, first time.
  leds: >-
    install guide - every Ethernet line card has port Status LEDs on its front panel,
    one beside each SFP or XFP port showing that port's status, plus a single tristate
    Status LED per card for card status. The card lamp's four states are Table 32 of
    the Ethernet Line Card Installation Guide, transcribed - note its amber is TWO
    states, steady during boot and blinking for a software configuration error.
    PER-PORT lamps are NOT modelled on these three cards: the masters draw a narrow 5.4
    mm strip between each pair of rows rather than a discrete lamp per port, and which
    part of that strip belongs to which port is not resolvable from the drawing. That
    is a gap, and it is different from the QSFP cards, where each port's lamp is drawn
    separately and IS modelled.
  ports: >-
    datasheet - Cisco ASR 9000 Series 24-Port and 48-Port Dual-Rate 10GE/1GE Line Card
    Data Sheet: 'Port density: 24 ports and 48 ports of 10 Gigabit/1 Gigabit Ethernet
    ports per line card', and 'The physical interfaces on these line cards support both
    Small Form-Factor Pluggable (SFP) and Enhanced SFP (SFP+) optics'. The master draws
    the count the part number claims.
  power: >-
    install guide - Table 35 of the Ethernet Line Card Installation Guide, row '48-Port
    10-Gigabit Ethernet/1-Gigabit Ethernet Line Card (-TR, -SE, -CM)': 700 W at 27 C,
    810 W at 40 C, 850 W at 50 C. max is the highest rated ambient. This row's heading
    names THREE part numbers - -TR, -SE and -CM - so unlike the 16-port and 32-port rows
    it covers this part number explicitly, and the figure is transcription rather than
    attribution.
  variants: >-
    only the -SE has a stencil master. A9K-24X10GE-1G-TR, -1G-FC and the 48-port
    equivalents are real part numbers - the data sheet's ordering table lists them - and
    are not modelled, because there is no artwork for them and I will not assume they
    share this faceplate. On this platform that assumption is sometimes right and
    sometimes wrong: the 16-port -SE and -TR masters ARE the same drawing to 0.00 mm,
    and the -X- generation's master is 5.64 mm away from the non-X one.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
elements:
  status:
    at: [18.61, 371.11]
    size: [3.72, 3.72]
    class: led
    description: >-
      the single tristate card Status LED (Ethernet Line Card Installation Guide, Table
      32).
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - {name: amber-blinking, behavior: blinking, color: '#f5a623'}
    - {name: red, color: '#d0021b'}
    - 'off'
