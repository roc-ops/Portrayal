format: 1
kind: module
name: a9k-cable-manager
version: 1.0.0
class: mechanical
behaviour: mounts
profile: networking
description: >-
  Horizontal cable management bracket for an ASR 9000 rack. A full-width plate with a
  chevron of angled cable channels and a mounting hole at each corner. It bolts to the
  rack face rather than seating in a chassis opening.
unplaced: >-
  no chassis in this library seats the cable manager: no document in the intake names it,
  gives it a part number or says which chassis it bolts to. It is drawn from a stencil master
  alone. Tracked in roc-ops/Portrayal#262.
size: {w: 444.5, h: 149.63}
attrs:
  model: 'Cable Manager'
  role: 'cable-management'
  eol: 'none-announced'
provenance:
  relief: >-
    NO RELIEF FEATURE, AND THIS IS THE ONE CISCO PART IN 128 THAT NOW PRODUCES NOTHING AT
    ALL IN 3D - said plainly because a single flat part in a set that is otherwise modelled
    looks like an oversight rather than a decision. The skin is a `plate` rect with eight
    `channel-N` slots as SIBLINGS of it, not children, and that is what blocks every option.
    `out` on the plate would strand the eight channels behind it - the skill's documented
    failure, a raised bare rect coming out as a blank slab with its detail missing - and
    `sink` on the channels needs a cavity floor this part does not have. What the bracket
    really is, per the `mounting` key above, is a plate BOLTED TO THE RACK FACE with open
    slots through it, so the honest primitive is a plate with holes and neither `out` nor
    `sink` is that. A DIMENSION FOR IT DOES EXIST and is deliberately not used: Figure 8 of
    the Overview and Reference Guide dimensions the ASR 9010 footprint's front band at 5.04
    in (12.80 cm) ahead of the chassis face. That is the CABLE MANAGEMENT SPACE, not this
    bracket's own depth - the guide's own words are that the rails are 'set back 5.00
    inches, INCLUDING front cable management space' - so taking 128 mm as the bracket would
    be a scope error dressed as a citation, which is worse than the blank. WHAT WOULD CLOSE
    IT: group the channels inside the plate in the skin, which is a drawing change rather
    than a measurement, and then one `out` carries the whole bracket.
  size: >-
    drawing - the stencil master 'Cable Manager' at 1:10, 443.01 x 149.6 mm. Shape-box
    aspect 2.9706 against the art's 2.9613, agreeing to 0.3 percent.
  channels: >-
    drawing - EIGHT angled channels, four leaning each way about the centre line. The
    master gives each one's 60.03 mm bounding square directly, and a rectangle L x W set
    at 45 degrees has a bounding square of (L + W) / root 2 a side, so 60.03 resolves to
    a 63 x 22 slot. That step matters: the first pass drew the bounding squares
    themselves, rounded, and the eight channels merged into one dark blob spread across
    the plate. Positions are measured; the slot shape is reconstructed from the bounding
    box rather than traced.
  identity: >-
    NO PART NUMBER. The master is named 'Cable Manager' and no document in the intake
    gives an order code for it, so the component carries the stencil's own name.
  mounting: >-
    it BOLTS ON rather than seating in an opening, so a device places it rather than
    accepting it into a bay - the distinction the modelling skill draws between a bay
    occupant and a placement.
  lifecycle: >-
    searched - nothing to search for without a part number.
relief:
  wall: '#4a4f55'
skins: [default]
