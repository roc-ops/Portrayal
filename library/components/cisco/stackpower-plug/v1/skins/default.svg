<svg xmlns="http://www.w3.org/2000/svg" width="23.6mm" height="18.5mm" viewBox="0 0 23.6 18.5">
  <!-- Drawn from the cable end. Farthest from the viewer first. The body is keyed by one cut
       corner, at the top right; the two captive screws stand at its sides. -->
  <rect id="shell" x="1.0" y="1.0" width="21.6" height="16.5" fill="#c9cdd1"/>
  <path id="body" fill="#26282b" stroke="#4a4d52" stroke-width="0.12"
        d="M 0.8 0 H 20.6 L 23.6 3.0 V 17.7 A 0.8 0.8 0 0 1 22.8 18.5 H 0.8 A 0.8 0.8 0 0 1 0 17.7 V 0.8 A 0.8 0.8 0 0 1 0.8 0 Z"/>
  <g id="screw-left">
    <circle cx="3.0" cy="9.25" r="1.6" fill="#c9cdd1" stroke="#8d949c" stroke-width="0.15"/>
    <path d="M 2.0 9.25 H 4.0" stroke="#4a4f55" stroke-width="0.3" fill="none"/>
  </g>
  <g id="screw-right">
    <circle cx="20.6" cy="9.25" r="1.6" fill="#c9cdd1" stroke="#8d949c" stroke-width="0.15"/>
    <path d="M 19.6 9.25 H 21.6" stroke="#4a4f55" stroke-width="0.3" fill="none"/>
  </g>
  <circle id="band" cx="11.8" cy="9.25" r="5.2" fill="#3f9b4b" data-fill-from="band-color"/>
  <circle id="relief-boot" cx="11.8" cy="9.25" r="4.2" fill="#202225" stroke="#4a4d52" stroke-width="0.12"/>
  <circle id="stub" cx="11.8" cy="9.25" r="3.0" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
