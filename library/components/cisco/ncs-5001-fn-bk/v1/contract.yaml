format: 1
kind: module
name: ncs-5001-fn-bk
version: 1.0.1
class: fan
behaviour: fills
profile: networking
description: >-
  The one-rack-unit fan module of the Cisco NCS 5001, ordered as NCS-5001-FN-BK: back-to-front airflow, which
  the guide calls port-side exhaust. The same face as the front-to-back NCS-5001-FN-FR: a dark honeycomb grille
  filling the face with a pull-handle loop across its middle. Hot-swappable.
size: {w: 88.0, h: 40.0}
size-confidence: {w: estimated, h: estimated}
part-numbers:
  NCS-5001-FN-BK: {part: NCS-5001-FN-BK}
attrs:
  airflow: back-to-front
  hot-swappable: 'yes'
  power-absent: not-published
provenance:
  model: >-
    datasheet - Hardware Installation Guide for Cisco NCS 5000 Series Routers (first published 2015-12-23, last
    modified 2019-01-31), Table 3: NCS-5001-FN-BK "Cisco NCS 5001 Router Fan Back to Front Airflow", with a spare
    NCS-5001-FN-BK= that is the same part. The guide does not say the two airflow parts look different, so the
    face is the front-to-back part's face.
  power: >-
    NOT STATED. Searched the guide for the fan module's watts, amps and CFM: Appendix C gives power-supply figures
    only. No power figure is written, and lint's missing-power warning stands.
  size: >-
    estimated - as for NCS-5001-FN-FR: a fraction of the rear face in Figure 1, one-rack-unit height.
  elements: >-
    estimated - as for NCS-5001-FN-FR; Figures 1 and 17, three-quarter views. No fan-module lamp is named, so none
    is drawn.
  handle: >-
    estimated - as for NCS-5001-FN-FR: Figure 1 (printed page 2) draws the handle as an open loop spanning nearly
    the module's width, drawn 72 mm wide and 20 mm tall with a 3.5 mm band, not as a flat bar.
  latch-colour: >-
    NOT STATED for either airflow; the guide's fan figures are greyscale.
  depth: >-
    estimated - not stated in any held document; 100 mm is a round figure for a fan module of this class.
states: [absent]
elements:
  grille: {at: [3.0, 2.0], size: [82.0, 36.0], class: rotor}
  handle: {at: [8.0, 10.0], size: [72.0, 20.0], class: handle}
relief:
  wall: '#15181b'
  features:
    - node: grille
      vent: 24
      confidence: estimated
      source: the grille's extent is read off Figure 1; the cavity behind it is not stated.
    - node: handle
      uhandle: 12.0
      color: '#4a4f55'
      confidence: estimated
      source: Figure 17 shows the handle as a loop standing clear of the face; 12 mm is a reading of its proportions.
skins: [default]
body:
  depth: 100
  color: '#26292d'
  footprint: {at: [0, 0], size: [88.0, 40.0]}
