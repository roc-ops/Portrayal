<svg xmlns="http://www.w3.org/2000/svg" width="16.5mm" height="9mm" viewBox="0 0 16.5 9">
  <!-- Drawn from the cable end, tab up as at STACK 1. Farthest from the viewer first. -->
  <rect id="shell" x="0.8" y="0.9" width="14.9" height="7.2" fill="#c9cdd1"/>
  <rect id="body" x="0" y="0" width="16.5" height="9.0" rx="0.8" fill="#26282b" stroke="#4a4d52" stroke-width="0.12"/>
  <rect id="tab" x="4.6" y="0.6" width="7.3" height="2.4" rx="0.4" fill="#c9cdd1" stroke="#8d949c" stroke-width="0.12"/>
  <circle id="relief-boot" cx="8.25" cy="4.5" r="3.4" fill="#202225" stroke="#4a4d52" stroke-width="0.12"/>
  <circle id="stub" cx="8.25" cy="4.5" r="2.5" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
