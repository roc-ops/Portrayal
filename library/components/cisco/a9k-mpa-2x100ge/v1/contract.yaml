  model: 'A9K-MPA-2X100GE'
  role: 'modular-port-adapter'
  cfp2: 2
  media: 'CFP2, 100 Gigabit Ethernet'
  weight-kg: 1.09
  eol: 'none-announced'
provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 3 panel lamps at dome 0.3 (one number, carried by
    120 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE
    READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind of
    interpolated anyway... It's just to give it a realistic view instead of just being a
    flat 2d... All of the 3d stuff is going to be mostly conjecture unless the vendor
    provides that data.' So a proudness here is an interpolation for a realistic view, NOT a
    claim about the hardware, and the confidence token on every feature says so rather than
    leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE
    DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED
    figure reused for the same class of hardware, and these origins are not measured - they
    are the library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size. STILL REFUSED ON THIS FACE, and these
    are NOT the same kind of gap: the 2 drawn aperture(s) cfp2-0, cfp2-1 - an optical or
    connector aperture that conforms to no published standard, so no depth exists to
    interpolate from. The ruling sanctions interpolating a PROUDNESS for a realistic view.
    It does not sanction inventing an APERTURE, which is a dimension a specification is
    withholding rather than one nobody has measured.
  size: >-
    datasheet - Cisco ASR 9000 Series data sheet c78-735809, Table 3, 'Physical
    dimensions', row 'A9K-MPA-2X100GE': 6.37 W x 1.36 H x 6.70 L, and a second line 6.37
    W x 1.36 H x 8.30 L (including jackscrew); weight 38.4 oz (1.09 kg). In millimetres
    161.80 long by 34.54 thick by 170.18 deep, or 210.82 with the jackscrew, which
    protrudes and is not part of the body. Every MPA in that table carries the same
    envelope and a different weight.
  aperture: >-
    DRAWN, NOT COMPOSED, AND DECLARED `class: cutout` ANYWAY - which takes an L26
    warning, and the warning is the point. THE CFP2 SPECIFICATION EXCLUDES THE NUMBER
    EXPLICITLY. Revision 1.0 was fetched and read: section 5.3 states 'All mechanical
    hardware dimensions in this document are for reference only. Normative dimensions
    are found in the latest published CFP2 baseline drawing', and section 5.4, Host
    System Dimensions, is one sentence pointing at the same members-only document. The
    cages here are transcribed from the master at 15.23 x 37.13 mm and conform to
    nothing, because there is nothing to conform to. The earlier instinct on cards like
    this was to withhold `class: cutout` so the aperture census stayed clean; that is
    backwards. L26's own message ends 'if the dimension cannot be sourced yet, this
    warning is the record of that'. A census kept tidy by not declaring a cutout has
    been routed around, not satisfied. WHAT WOULD CLOSE THIS, stated so a contributor is
    not sent on an errand that cannot be run: CFP MSA membership and the baseline
    drawing it gives access to, or a Cisco mechanical drawing of this faceplate. NOT
    'look harder' - this is not a search that failed, it is a specification that
    withholds the figure. Contrast the XFP on the 4-port and 2-port 10GE MPAs in this
    library, where INF-8077i gives the bezel opening outright in two figures and the
    only thing missing had been anyone looking outside the vendor's own guide. AND TWO
    CISCO MASTERS DRAW THIS SAME APERTURE DIFFERENTLY, which is worth knowing before
    anyone is tempted to register a key from either. This master draws its CFP2 opening
    at 15.23 x 37.13 mm; the A9K-400G-DWDM-TR master draws its CFP2 openings at 13.61 x
    42.63. Same form factor, same vendor, same stencil, 12 percent apart across and 13
    percent along. Neither can be the standard's opening and at most one is this card's,
    so the drawing is a poor witness here even setting aside that there is no registry
    entry to compare it against.
  outlined-glyphs: >-
    READ THIS BEFORE BELIEVING ANY 'NOTHING IS PRINTED' CLAIM ABOUT THIS MASTER. Its
    port numeral, its A/L legend and its STATUS legend are ALL OUTLINED GLYPHS, not text
    - the text extractor returns only the PID (twice), CLASS 1 LASER and a stray CM-1,
    and on that basis a first draft of this component asserted the card 'PRINTS NO PORT
    NUMERALS AT ALL'. Rendering the master at 8 px/mm shows the numeral in Cisco blue
    above the cage, an A/L triangle beside it and a STATUS lamp with its legend. The
    numerals are recoverable as #054467 ink boxes, the A/L indicators as #737373
    triangles and the STATUS lamp as a stroked circle - all three found by looking at
    the artwork rather than at the text runs. THE SAME TRAP CAUGHT THE A99-12X100GE
    EARLIER in this library and it is the same shape as every false claim of vendor
    silence in this vendor's set: 'not in the thing I searched' written down as 'not
    there'.
  screws: >-
    drawing - three captive screws, all stroked circles found by scanning fill:none
    paths: 8.11 mm at (4.21, 76.90), 5.38 at (27.45, 78.25) and 5.38 at (2.18, 88.11).
    Two sizes and an asymmetric arrangement, which is what the master draws. ONE
    ARTEFACT REPRODUCED RATHER THAN CORRECTED: the smallest screw's circle extends about
    0.5 mm past the plate's own edge in the master. That is the drawing's, not a
    modelling error, and nudging it inward would have made the component disagree with
    the artwork it is transcribed from without making it agree with the hardware.
  ports: >-
    install guide + drawing. The guide's contents name '2-Port 100-Gigabit Ethernet
    Modular Port Adapter with CFP2', and the A9K-MOD400's supported list names it again
    with the media spelled 'CFP2-DCO and CPAK'. THE MASTER NUMBERS ITS PORTS, as
    outlined glyphs in Cisco blue rather than as text: a #054467 ink box beside each
    cage, at (26.71, 39.0) for '0', (26.91, 123.9) for '1'.
  power: >-
    NOT STATED. No MPA in this family has a power figure anywhere in the intake: Table
    35 of the Ethernet Line Card Installation Guide gives per-card power for the
    modular-chassis line cards including the A9K-MOD carriers and nothing for the
    adapters inside them, and c78-735809's Table 3 gives dimensions and weights only. An
    MPA's draw is inside its carrier's, and the carriers say so.
  lamps: >-
    drawing - an A/L triangle per port and one STATUS lamp for the adapter, which is the
    same complement every other MPA in this library carries. The A/L indicators are
    #737373 triangles at (21.63, 11.37), (21.63, 100.71), and the STATUS lamp is a
    stroked circle 3.18 mm across found by scanning fill:none paths, because it appears
    in no filled-shape list. NO PER-CARD LED TABLE EXISTS for this MPA - the guide has
    one for six of the others and none for this - so the vocabularies are the family's
    and are BORROWINGS, flagged as such.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
elements:
  cfp2-0:
    at: [10.45, 20.81]
    size: [15.23, 37.13]
    class: cutout
    description: >-
      CFP2 port 0. A drawn opening, not a composed aperture - see provenance.aperture.
  cfp2-1:
    at: [10.45, 105.54]
    size: [15.23, 37.13]
    class: cutout
    description: >-
      CFP2 port 1. A drawn opening, not a composed aperture - see provenance.aperture.
  led-p0:
    at: [21.63, 11.37]
    size: [3.48, 2.94]
    class: led
    description: >-
      the port's A/L (Active/Link) indicator. The master draws it as a TRIANGLE rather
      than a rectangle or a circle, with its 'A/L' legend beside it as outlined glyphs -
      see provenance.outlined-glyphs. No per-card LED table exists for this MPA, so the
      three states are the family's and are a BORROWING, flagged as one.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  led-p1:
    at: [21.63, 100.71]
    size: [3.48, 2.94]
    class: led
    description: >-
      the port's A/L (Active/Link) indicator. The master draws it as a TRIANGLE rather
      than a rectangle or a circle, with its 'A/L' legend beside it as outlined glyphs -
      see provenance.outlined-glyphs. No per-card LED table exists for this MPA, so the
      three states are the family's and are a BORROWING, flagged as one.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  status:
    at: [14.01, 146.83]
    size: [3.18, 3.18]
    class: led
    description: >-
      the card's Status LED. Table 32, 'Port Status and Line Card Status LEDs', of the
      Ethernet Line Card Installation Guide, section 'Card Status LED (one per card)'.
      Green: line card has booted properly and is ready to pass or is passing traffic.
      Steady amber: boot process underway. Blinking amber: software configuration error
      that prevents the card passing traffic - it may still be passing traffic with some
      degradation. Red: hardware error, not passing traffic. Off: powered off. Steady and
      blinking amber share one colour and are not two states; the distinction is recorded
      because it is the difference between a card booting and a card misconfigured.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - {name: red, color: '#d0021b'}
    - 'off'
