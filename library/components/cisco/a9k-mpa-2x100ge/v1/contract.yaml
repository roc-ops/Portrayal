name: a9k-mpa-2x100ge
version: 1.0.0
class: line-card
profile: networking
description: >-
  Cisco 2-Port 100 Gigabit Ethernet Modular Port Adapter with CFP2. Two CFP2 cages on
  the MPA envelope, each with a triangular A/L indicator and a numeral beside it, plus a
  STATUS lamp - all of them drawn as outlined glyphs rather than as text, which is why a
  text scan of this master finds only the PID. Seats in an A9K-MOD carrier; it is on the
  400 Gigabyte carrier's explicit supported list, which names it as the '2-Port
  100-Gigabit Ethernet Modular Port Adapter with CFP2-DCO and CPAK'.
size: {w: 34.54, h: 161.8, d: 170.18}
