format: 1
kind: module
name: pwr-1p6kw-ac
version: 2.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9900 fixed-chassis 1.6 kW AC power module. A single axial fan
  behind a finger guard on the left half, a U-shaped release handle across
  it, an IEC C14 inlet turned on its side, a release latch down the right
  edge and one STATUS lamp. The ASR 9903 takes four of these and the ASR
  9902 two; AC and DC modules may not be mixed in one chassis.
size: {w: 74.94, h: 40.2}
size-confidence: {w: estimated, h: drawing}
size-notes: >-
  THE TWO AXES ARE FROM TWO READINGS, and that is stated rather than hidden.
  The width, 74.94 mm, is what the ASR 9902's own rear master reads for the
  supply in its pm-0 and pm-1 bays, marked estimated because no document
  dimensions the module and a search online found none (see provenance.size).
  The height, 40.2 mm, is the "ASR-9903 Rear" master's. The ASR 9902's master
  reads the height 40.91, which this part does not carry; the two chassis
  disagree on it and it is open. Taking one axis from each of two sources is the
  error that made a Cisco power module 3.66 mm too wide, so the width is the
  figure to replace first when a source turns up.
attrs:
  model: 'PWR-1.6KW-AC'
  power-output-w: 1600
  role: 'power-module'
  input: 'ac'
  inlet: 'c14'
  fans: '1'
  eol: 'none-announced'
provenance:
  input: >-
    install guide - "AC power modules operate within the following input range:
    High line rate: 200 V to 240 V. Low line rate: 90 V to 130 V", with the note
    that the ASR 9903's AC power supply handles both 120 V low line and 220 V
    high line, and changing from one to the other means first removing the
    supply from the chassis and then applying the new source. The same section
    gives 50 to 60 Hz operation and a minimum service of 15 A in North America
    and Japan, 10 A internationally and 13 A in the UK.
  inlet: >-
    drawing AND registry. The master draws the inlet body 17.43 x 26.61 mm with
    an earth pin above two flat pins - a C14 appliance inlet rotated a quarter
    turn - so it is COMPOSED from std/c14-inlet@1 with rotate: 90 rather than
    redrawn, and the standard supplies the aperture. `at` is the UNROTATED top
    left that puts the landed 20.0 x 28.0 box centred on the drawn body at
    (54.61, 17.00), because rotate pivots a placement on its own pre-rotation
    centre. The centre moved from 54.43 with the width (see size).
  switch: >-
    THERE IS NONE ON THIS MODULE, and the guide says so rather than leaving it
    to be inferred: the AC PSUs for ASR 9903 routers have no power switch, being
    plug-and-play devices that go straight into the router's PSU slots and need
    no configuration to work, and the power LED (PWR) is on the router's front.
    The ASR 9902's own rear DOES carry a switch under an ATTENTION ON-OFF tag -
    Figure 158 of the same guide draws it, labelled POWER - which is why the
    absence here is worth stating.
  size: >-
    ESTIMATED WIDTH, DRAWN HEIGHT (roc-ops/Portrayal#374). The module is 74.94 mm
    wide here: the ASR 9902's own rear master, Cisco's Visio stencil
    Routers-Cisco_ASR_9000, "ASR-9902 Rear", reads the plate 74.94 mm in its pm-0
    and pm-1 bays, and the ASR 9902 device carries that figure on a body
    calibrated on the data sheet's 439.74 mm. The "ASR-9903 Rear" master read the
    same part 74.69 mm at the old 443.86 mm scale (the four plates identical to
    0.01 mm at x 6.37, 124.28, 242.19 and 360.11), and 74.02 once that chassis
    is rescaled to the installation guide's 439.9 mm, so the two chassis'
    drawings differ by 0.92 mm on one part. A search online and in the document
    set on 2026-10-18 found no source that settles the width to 0.5 mm: the
    data sheets dimension the chassis and the two PECs only, the installation
    guide's power chapters give no envelope, and the reseller listings found
    are unlabelled and not credible. So the 9902's reading is carried, marked
    estimated, and what would settle it is a Cisco power-module table or a
    straight-on rear photograph of a chassis with the supplies seated. The
    height, 40.2 mm, is the 9903 master's; the 9902 master reads 40.91. The
    artwork's x was scaled by 74.94 / 74.69 from the version 1 drawing.
    DEPTH IS ABSENT rather than estimated: no document in the intake dimensions
    this module.
  power: >-
    install guide - the part number states 1.6 kW and the troubleshooting
    chapter's `show environment` confirms it as the module's rating rather than
    a marketing round number: "Total output power capacity (N + 1) : 1600W +
    1600W" on a chassis with two of these, above a per-module table reading
    "0/PT0-PM0 1.6KW-AC 213.5 1.1 12.1 15.2 OK". The 12.1 V column is the
    module's output rail; 1600 W is its capacity, not its draw.
  lamp: >-
    install guide - the AC-input troubleshooting table, whose LED column reads
    "OK (Cisco ASR 9901) / STATUS (Cisco ASR 9903 and Cisco ASR 9902)" and
    gives five states for it: solid green = on and outputting power; flashing
    green = connected to input power, or an FPD upgrade in progress; amber =
    power supply failure from over-voltage, over-current, over-temperature or
    fan failure; flashing amber = operating, but under a warning condition (high
    temperature, high power, slow fan); off = not receiving power. All five are
    carried. ITS POSITION IS READ OFF THE MASTER BY EYE,
    not extracted: the lamp is drawn as a stroked circle with no fill, which
    the shape parser does not carry, so it was located on a 4x render of the
    master at the bottom right of the inlet block. The names and the states are
    sourced; the two coordinates are a reading of a picture.
  redundancy: >-
    data sheet - Table 2 of c78-744035: "1.6 kW DC power module (up to 4
    modules), redundancy: 2+2" and "1.6 kW AC power module (up to 4 modules),
    redundancy: AC high line (200-240V): 2+2; AC low line (90-130V): 3+1". The
    install guide adds the constraint that decides a chassis build: "A total of
    four AC or DC power supplies are allowed in the Cisco ASR 9903 chassis" and
    "Mixing of AC and DC modules is not supported".
  shared-with-the-9902: >-
    THIS IS ONE PART ACROSS TWO CHASSIS and the guide says so in a table rather
    than in prose. Table 2 of the fixed-port Hardware Installation Guide, "Cisco
    ASR 9902 Router Components", lists "Power Supply Modules (AC or DC) |
    PWR-1.6KW-AC / PWR-1.6KW-DC | 2", and the ASR 9903 data sheet's ordering
    tables list the same two PIDs at up to four. Both the ASR 9902 and the ASR
    9903 seat this contract rather than a copy of it, at the one width above.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
parts:
  - {ref: std/c14-inlet@1, id: inlet, at: [40.61, 7.00], rotate: 90}
elements:
  status:
    at: [67.33, 32.70]
    size: [3.0, 3.0]
    class: led
    description: >-
      the module's STATUS lamp, one per module, at the bottom right of the
      inlet block.
    states:
    - {name: green, color: '#39b54a'}
    - {name: green-blink, behavior: blinking, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - {name: amber-blink, behavior: blinking, color: '#f5a623'}
    - 'off'
relief:
  wall: '#4a4f55'
  features:
    - node: handle
      uhandle: 8.0
      confidence: estimated
      source: >-
        edgecore/agr-fan@1 handle - the library's one pull-handle figure. Its
        provenance describes the handle's appearance from a photograph, not its
        proudness
    - node: latch
      out: 4.2
      confidence: estimated
      source: >-
        edgecore/agr-psu-dc@1 latch - the library's one release-hardware figure.
        That contract sources the latch's ARRANGEMENT from photographs, never
        its proudness
    - node: status
      dome: 0.3
      confidence: estimated
      source: >-
        common/led-dot@1 - the library's one panel-lamp figure. Its own
        provenance is 'size: estimated' and the dome carries none
skins: [default]
