description: >-
  Cisco ASR 9900 Series 4T Service Edge Line Card, 5th generation. Ten QSFP-DD ports,
  each capable of 10, 40, 100, 200 or 400 Gigabit Ethernet, for 4 Tbps of aggregate
  bandwidth.
