format: 1
kind: module
name: n9k-c9500-lc-cv
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9500 line card blank (N9K-C9500-LC-CV). A plain plate on the line-card envelope that fills a
  line-card slot nobody uses, so that the chassis meets its EMI limits and air flows across the cards in
  use. Two latches on its sides lock it onto brackets on the chassis; there are no ports and no lamps.
  The Nexus 9504, 9508 and 9516 each take one in every empty line-card slot.
size: {w: 431.8, h: 44.45, d: 25.0}
size-confidence: {w: datasheet, h: datasheet, d: estimated}
attrs:
  model: 'N9K-C9500-LC-CV'
  role: 'airflow-blank'
  eol: 'unknown'
provenance:
  size: >-
    datasheet - Cisco N9508 NX-OS Mode Switch Hardware Installation Guide, Appendix A "Switch Dimensions"
    (printed p113, PDF p119), "Line cards": 17.0 in (43.18 cm) wide by 1.75 in (4.4 cm) high. The guide
    gives no dimension for the blank itself; it fills a line-card slot, so it takes the line card's face.
  depth: >-
    estimated - 25 mm, a plate and its latches. The guide gives no depth for the blank and a line card's
    16.5 in is not its depth.
  purpose: >-
    install guide - "Installing and Removing a Blank Line Card" (printed p83): an unused line-card slot must
    be filled with a blank line card so that the switch meets its EMI emission limits and air flows properly
    across the line cards. The part number N9K-C9500-LC-CV is given in the "Migrating the Switch ..."
    sections, which say that empty line-card slots are filled with blank modules of that number.
  skin: >-
    estimated - two latches on the sides ("two latches on the sides of the blank line card"), unpunched
    plate; the guide's figures (PDF pp88-89) show no more.
  lifecycle: >-
    unknown - Cisco's support page gives no sale status for this part number.
skins: [default]
