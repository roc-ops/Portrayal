format: 1
kind: module
name: pwr-c1-715wac
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 715 W AC power supply of the Cisco Catalyst 9300 family, PWR-C1-715WAC - not
  Platinum-certified. The same dark, honeycomb-vented rear face as its Platinum sibling,
  with an AC OK and a PS OK lamp, an IEC C14 inlet, two release latches and a power cord
  retainer. Airflow is front-to-back.
size: {w: 82.55, h: 40.1}
size-confidence: {w: datasheet, h: datasheet}
attrs:
  model: 'PWR-C1-715WAC'
  power-output-w: 715
  input: ac
  inlet: c14
  input-voltage: '100 to 240 VAC (autoranging)'
  input-current-max: '10 to 5 A'
  input-frequency: '50 to 60 Hz'
  output: '-56 V at 12.8 A'
  weight-kg: 1.3
  airflow: front-to-back
provenance:
  model: >-
    datasheet - Cisco Catalyst 9300 Series Switches Hardware Installation Guide (first
    published 2017-06-20, last modified 2026-05-15), Table 35 lists PWR-C1-715WAC for the
    C9300 and C9300L series.
  power: >-
    datasheet - Table 45, Power Specifications for AC Power Supplies: maximum output power
    715 W, 100 to 240 VAC autoranging at 50-60 Hz, input current 10-5 A, output -56 V at
    12.8 A. An OUTPUT rating, so power-output-w.
  size: >-
    datasheet - Physical Specifications of Power Supplies, 1.58 x 3.25 x 12.20 in (40.1 x
    82.55 x 309.9 mm), read height, width, depth as cisco/pwr-c1-715wac-p@1 reads it.
  weight: >-
    datasheet - 2.8 lb (1.3 kg).
  depth: >-
    datasheet - 309.9 mm.
  elements: >-
    estimated - the guide has no figure of the 715 W AC supply. Drawn from the community
    NetBox rear elevation of the C9300-48T; see cisco/pwr-c1-715wac-p@1.
  lamps: >-
    datasheet - Table 36, Switch Power Supply Module LEDs.
  inlet: >-
    datasheet - C15 cords (Table 49) mate a C14 inlet.
  colour: >-
    estimated - read off the NetBox elevation.
states: [absent]
elements:
  ac-ok: {at: [10.2, 7.6], size: [3.0, 3.0], class: led, states: ['off', {name: ok, color: '#22c55e'}]}
  ps-ok: {at: [31.4, 7.6], size: [3.0, 3.0], class: led, states: ['off', {name: ok, color: '#22c55e'}, {name: fault, color: '#ef4444'}]}
  latch: {at: [28.2, 26.5], size: [11.0, 11.9], class: handle}
  retainer: {at: [56.0, 28.5], size: [12.7, 9.9], class: handle}
parts:
  - {ref: std/c14-inlet@1, id: inlet, at: [41.2, 7.3]}
relief:
  wall: '#15171a'
skins: [default]
body:
  depth: 309.9
  color: '#2a2c30'
  footprint: {at: [0, 0], size: [82.55, 40.1]}
