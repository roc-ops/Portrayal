format: 1
kind: module
name: ws-x4994-f
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  The blank power supply cover of the Cisco Catalyst 4948E-F, WS-X4994-F - a plain blue plate
  on the power supply's envelope that covers the bay of a supply that is not fitted. It is a
  documented part and not tidiness: the guide says an empty power supply bay "should be
  covered using the blank power supply cover". The Catalyst 4948E's own cover is WS-X4994.
size: {w: 115.7, h: 39.5}
size-confidence: {w: estimated, h: estimated}
attrs:
  model: 'WS-X4994-F'
  role: 'airflow-blank'
provenance:
  model: >-
    datasheet - the Catalyst 4948E and Catalyst 4948E-F Switch Installation Guide
    OL-21561-02, Table 1-1: when the redundant supply is not installed the empty bay "should
    be covered using the blank power supply cover (p/n WS-X4994-F)", which is "color-coded
    blue". The 4948E's cover is the same note's WS-X4994, "color-coded dark grey". An empty
    bay takes this cover in place of the second supply, which the data sheet's Table 5
    sells separately as PWR-C49E-300AC-F/2.
  size: >-
    estimated - the supply bay's footprint, since the cover fills that bay. No document
    states the cover's dimensions.
  elements: >-
    NOT PICTURED. Neither the guide nor the data sheet draws or photographs the cover, so
    it is a plain plate with nothing on it. The guide says it is held by captive
    installation screws, but not how many: chapter 4, "Removing the AC-Input Power Supply"
    step 5 (p. 4-8) says to install the blank faceplate (WS-X4994-F= for the Catalyst
    4948E-F) "and secure it in place with the captive installation screw", one, while
    "Installing the AC-Input Power Supply" step 2 (p. 4-9) says "Loosen the two captive
    installation screws and remove the blank faceplate". Figure 4-3 (p. 4-9) draws the
    supply being slid in, not the blank, and shows no screw count. The conflict stands, so
    no screw is drawn.
  colour: >-
    estimated - the guide says "blue"; the supply and fan tray of the same build measure
    #4e5e65 and #506b73 in the data sheet's photograph, and the plate takes the supply's.
  depth: >-
    estimated - 2 mm, a plate; no document gives one.
body:
  depth: 2
  color: '#4e5e65'
skins: [default]
