format: 1
kind: module
name: n9k-c9508-fm-r2
version: 1.0.0
class: fabric
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9508 fabric module, second -R generation (N9K-C9508-FM-R2), for the 400-Gigabit N9K-X9624D-R2
  and the other -R series line cards. A vertical module with a vented face, ejector levers, a BCN lamp and a
  status lamp; it sits in the rear of the chassis behind a fan tray. No fabric slot may be left empty when
  this module is used.
size: {w: 62.48, h: 416.56, d: 297.18}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
attrs:
  model: 'N9K-C9508-FM-R2'
  role: 'fabric-module'
  power-draw-typical-w: 280
  power-draw-max-w: 320
  hot-swappable: true
  eol: 'unknown'
provenance:
  size: >-
    datasheet - Cisco N9508 NX-OS Mode Switch Hardware Installation Guide, Appendix A "Switch Dimensions"
    (printed p113, PDF p119), "Fabric modules": 2.46 in (6.25 cm) wide, 11.7 in (29.72 cm) deep, 16.4 in
    (41.66 cm) high. One row serves every fabric type.
  power: >-
    datasheet - "Planning for Power Requirements" table (printed p12, PDF p18), the row "Line cards that are
    supported by N9K-C9508-FM-R2 fabric modules": 280 W typical, 320 W maximum, read as the module's own
    draw.
  compatibility: >-
    install guide - "Overview" note: "When using N9K-C9508-FM-R2, do not leave any fabric module slots
    empty." Table 1 does not list this module, so its fan pairing is not stated by the guide; Table 2 does
    not list it either. The power table lists the N9K-X9624D-R2, X9636C-RX, X9636C-R, X9636Q-R and
    X96136YC-R line cards under it.
  lamps: >-
    install guide - "Fabric Module LEDs": a BCN lamp (blue) and a status lamp. Positions estimated.
  skin: >-
    estimated - a vented face and two ejector levers, read from the rear figure of the overview (PDF p12);
    no figure dimensions them.
  lifecycle: >-
    unknown - Cisco's support page gives no sale status for this part number.
elements:
  bcn:
    at: [10.0, 386.0]
    size: [3.0, 3.0]
    class: led
    description: BCN lamp. The BCN lamp on the fan tray that covers the module also lights.
    states:
    - {name: blue, color: '#2a7de1'}
    - 'off'
  status:
    at: [48.0, 386.0]
    size: [3.0, 3.0]
    class: led
    description: Status lamp.
    states:
    - {name: green, color: '#39b54a'}
    - {name: flashing-green, color: '#39b54a', behavior: blinking}
    - {name: flashing-yellow, color: '#f5c518', behavior: blinking}
    - {name: flashing-red, color: '#d0021b', behavior: blinking}
    - {name: flashing-amber, color: '#f5a623', behavior: blinking}
    - 'off'
skins: [default]
