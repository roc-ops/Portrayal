format: 1
kind: module
name: n9k-c9508-fm-g
version: 1.0.0
class: fabric
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9508 fabric module for the 400-Gigabit -GX line cards (N9K-C9508-FM-G). A vertical module
  with a vented face, ejector levers, a BCN lamp and a status lamp; it sits in the rear of the chassis
  behind a fan tray and pairs with the N9K-C9508-FAN2 tray. Four fabric modules give full bandwidth for
  the line cards the guide lists for it; empty fabric slots take the N9K-C9508-FAN-PWR card.
size: {w: 62.48, h: 416.56, d: 297.18}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
attrs:
  model: 'N9K-C9508-FM-G'
  role: 'fabric-module'
  power-draw-typical-w: 685
  power-draw-max-w: 936
  hot-swappable: true
  eol: 'unknown'
provenance:
  size: >-
    datasheet - Cisco N9508 NX-OS Mode Switch Hardware Installation Guide, Appendix A "Switch Dimensions"
    (printed p113, PDF p119), "Fabric modules": width 2.46 in (6.25 cm), depth 11.7 in (29.72 cm), height
    16.4 in (41.66 cm). One row serves every fabric type.
  power: >-
    datasheet - "Planning for Power Requirements" table (printed p12, PDF p18), the row "Line cards that are
    supported by N9K-C9508-FM-G fabric module": 685 W typical, 936 W maximum. The row's label is read as the
    module's own draw, as the guide's worked example does for the FM-E2 (its Step 2 table lists
    N9K-C9508-FM-E2 at 420 W maximum, the figure on the FM-E/E2 row).
  compatibility: >-
    install guide - "Overview" Table 1: N9K-C9508-FM-G with N9K-C9508-FAN2 and N9K-C9508-FAN-PWR. Table 2
    lists four fabric modules for the N9K-X9732C-EX, X9736C-EX, X97160YC-EX, X9732C-FX, X9736C-FX,
    X9736C-FX3, X9788TC-FX and X9716D-GX line cards (some five). Fabric modules must sit in the slots the
    guide names: three in FM 2, 4, 6; four in FM 2, 3, 4, 6; five in FM 2 to 6; six in FM 1 to 6.
  lamps: >-
    install guide - "Fabric Module LEDs": a BCN lamp (blue) and a status lamp (green, flashing green,
    flashing yellow, flashing red, flashing amber, off). Positions estimated.
  skin: >-
    estimated - a vented face and two ejector levers, read from the rear figure of the guide's overview (PDF
    p12), which shows the fabric modules only behind a removed fan tray; no figure dimensions them.
  lifecycle: >-
    unknown - Cisco's support page gives no sale status for this part number.
elements:
  bcn:
    at: [10.0, 386.0]
    size: [3.0, 3.0]
    class: led
    description: BCN lamp. The BCN lamp on the fan tray that covers the module also lights.
    states:
    - {name: blue, color: '#2a7de1'}
    - 'off'
  status:
    at: [48.0, 386.0]
    size: [3.0, 3.0]
    class: led
    description: Status lamp.
    states:
    - {name: green, color: '#39b54a'}
    - {name: flashing-green, color: '#39b54a', behavior: blinking}
    - {name: flashing-yellow, color: '#f5c518', behavior: blinking}
    - {name: flashing-red, color: '#d0021b', behavior: blinking}
    - {name: flashing-amber, color: '#f5a623', behavior: blinking}
    - 'off'
skins: [default]
