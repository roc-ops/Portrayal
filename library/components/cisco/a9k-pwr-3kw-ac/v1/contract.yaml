format: 1
kind: module
name: a9k-pwr-3kw-ac
version: 1.0.1
class: psu
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9000 version 1 power module for a modular-chassis power tray. Three axial
  fans behind finger guards across the face, an ejector door with a latch on the right,
  and Input, Output and Fault lamps. Three of these fill a version 1 tray.
size: {w: 139.12, h: 44.45}
attrs:
  model: 'A9K-3KW-AC'
  power-output-w: 3000
  role: 'power-module'
  generation: '1'
  fans: '3'
  eol: 'none-announced'
provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 3 panel lamps at dome 0.3 (one number, carried by
    120 Cisco contracts); 1 pull handles at uhandle 8.0 (one number, carried by 10 Cisco
    contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE READING OF WHAT
    RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind of interpolated anyway...
    It's just to give it a realistic view instead of just being a flat 2d... All of the 3d
    stuff is going to be mostly conjecture unless the vendor provides that data.' So a
    proudness here is an interpolation for a realistic view, NOT a claim about the hardware,
    and the confidence token on every feature says so rather than leaving it to be inferred.
    WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE DOES COME FROM ANOTHER
    PORTRAYAL PART. `borrowed` is defined as another part's MEASURED figure reused for the
    same class of hardware, and these origins are not measured - they are the library's
    first guess at that hardware, and the contracts say so themselves: agr-panel-screw's
    provenance reads 'estimated - it stands proud but was not measured', agr-psu-dc sources
    its latch's ARRANGEMENT from a photograph and never its proudness, agr-fan describes its
    handle and grille by appearance only, and common/led-dot's entire provenance is 'size:
    estimated'. Spelling that chain `borrowed` would convert a guess into an apparent
    measurement at one remove, a thousand times over. `source` still names the origin, so
    the coordinating benefit is kept and only the claim that is not true is dropped. READ
    THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd contracts is ONE
    ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened to agree. One
    caliper on any one Cisco captive screw, any one ejector lever or any one panel lamp
    corrects every part in the library that shares it, which is the whole reason the numbers
    are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN FIRST AND IS
    RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud', 'extends
    outward', 'stands proud' and 'clearance in front' - the only vendor in the intake that
    publishes a projection is UfiSpace, on the S9510-28DC; the per-card dimension tables,
    including Table A-10 of the older Ethernet Line Card Installation Guide which the
    current revision dropped, all of which carry H, W, D and weight only; and the ASR 9000
    Visio stencil, whose 119 masters are FRONT and REAR elevations with no side, top or
    isometric view, so it holds no depth axis at all and is closed as a source. Figure 48 of
    the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide DO show this
    hardware in three dimensions and are perspective drawings with a vanishing point, so
    they settle the ARRANGEMENT - bracket off the plate, lever along it, domed screw head
    proud of both - and nothing about size.
  size: >-
    drawing - the stencil master 'A9K Power Module', BOTH AXES from index.json's
    shapesheet at the stencil's 1:10 inches: 0.5477 x 0.175 in, so 139.12 x 44.45 mm.
    CORRECTED, and the correction is the reason this note is long. The first version of
    this component read 142.78 x 44.40 - the height from the shapesheet and the width
    from the ART BOUNDING BOX, which includes the handle standing proud of the module's
    right-hand edge. It was caught by arithmetic rather than by eye: three modules at
    142.78 need 428.34 mm and the ASR 9006's shelf interior measures 416.50, so three of
    them would not fit a shelf that holds exactly three, and lint L13 reported the bays
    overlapping the moment they were placed at their measured centres. At 139.12 the
    arithmetic comes right - three make 417.36 against a 416.50 shelf, filling it with
    under a millimetre spare. A component right in one dimension and wrong in the other
    is the kind of wrong that survives review; take both axes from the same source. No
    document in the intake gives a power module's dimensions.
  generation: >-
    the version is read off the WIDTH, not off the name. This master is 139.12 mm wide
    and the version 2 tray's four module positions are on a 107.3 mm pitch; the 'A9K
    Power Module V2' master is 99.62 mm and fits one, while this one cannot. The
    Overview and Reference Guide's own arithmetic agrees: the version 1 tray holds THREE
    modules ('three 2100 W power modules in a single tray, 6300 W') and the version 2
    tray holds four ('four 2100 W DC power modules or 3000 W AC power modules in a
    single tray'). A 139.12 mm module fits three across a 429 mm tray and not four.
  lamps: >-
    install guide - the Overview and Reference Guide's 'Power Module Status Indicators',
    which gives one table for the version 1 module and a second for version 2 and says
    'The status indicators for the version 3 power module are similar'. Both tables read
    the same and are transcribed here: Input LED - 'ON continuously when the input
    voltage is present and within the correct range. BLINKING when the input voltage is
    out of acceptable range. OFF when no input voltage is present.' Output LED - 'ON
    when the power module output voltage is present. BLINKING when the power module is
    in a power limit or overcurrent condition.' Fault LED - 'ON indicates that a power
    supply failure has occurred.' Note what Cisco does NOT give: a colour for any of the
    three. So the states are on/blinking/off and no colour is asserted.
  power: >-
    ASR 9000 version 1 AC power module, rated from its own part number: Cisco names these by
    output and the generation's siblings follow the same rule (PWR-3KW-AC-V2 is 3000 W,
    PWR-6KW-AC-V3 is 6000 W).
    WHICH GENERATION THIS IS, since the old contract could not say. The Overview and
    Reference Guide names version 2 explicitly - 'Version 2 power which uses ASR9K-AC-PEM-V2
    power entry modules and PWR-3KW-AC-V2 single-phase 220-V 20-A power supplies' and the
    same for ASR9K-DC-PEM-V2 with PWR-2KW-DC-V2 - so the part numbers carrying no -V2 or -V3
    suffix are the version 1 modules: A9K-3KW-AC, A9K-2KW-DC and A9K-1.5KW-DC. A `show
    platform` transcript in the interfaces guide confirms the shape, listing PID A9K-3KW-AC
    in slots 0/PM0, 0/PM1 and 0/PM2 - THREE modules in a tray, which is what this drawing
    depicts and what distinguishes it from the four-wide version 2 module.
    THE DRAWING IS SHARED BY ALL THREE. On these trays the AC receptacles and DC lugs
    are on the TRAY, not on the module, so an AC and a DC module of one version present the
    same face; the stencil master carries no part number and no legend. That is why this was
    one contract standing for three products, and why splitting it is the fix rather than
    choosing one rating for a drawing.
  lifecycle: >-
    searched - no end-of-life notice for this part is in the intake.
elements:
  input:
    at: [126.18, 8.01]
    size: [2.6, 2.6]
    class: led
    description: >-
      Input LED. ON continuously when the input voltage is present and within the correct
      range; BLINKING when the input voltage is out of acceptable range; OFF when no input
      voltage is present. Cisco states no colour for it.
    states:
    - 'off'
    - 'on'
    - {name: blinking, behavior: blinking}
  output:
    at: [126.18, 14.62]
    size: [2.6, 2.6]
    class: led
    description: >-
      Output LED. ON when the power module output voltage is present; BLINKING when the
      power module is in a power limit or overcurrent condition. Cisco states no colour
      for it.
    states:
    - 'off'
    - 'on'
    - {name: blinking, behavior: blinking}
  fault:
    at: [126.18, 21.23]
    size: [2.6, 2.6]
    class: led
    description: >-
      Fault LED. ON indicates that a power supply failure has occurred. Cisco states no
      colour for it, and gives no off-state sentence.
    states:
    - 'off'
    - 'on'
