format: 1
kind: module
name: a9k-rsp440-tr
version: 1.0.0
class: supervisor
profile: networking
description: >-
  Cisco ASR 9000 Series Route Switch Processor 440, Packet Transport optimised. Two SYNC
  timing ports, an IEEE 1588 timestamp port, ICS0 and ICS1/TOD inter-chassis sync ports,
  two management LAN ports, a console and an auxiliary port, and two 10-GE SFP+
  virtualization cluster ports. Nine RJ-45 jacks, 10 MHz and 1 PPS SMB clock inputs
  under a GPS INTERFACE bracket, a nine-pin alarm output, a USB port, ACO and LAMP TEST
  push buttons, a discrete lamp cluster and a four-character LED dot-matrix display.
size: {w: 42.0, h: 406.0, d: 674.0}
attrs:
  model: 'A9K-RSP440-TR'
  role: 'route-switch-processor'
  mgmt: '2 x 100/1000 RJ-45'
  console: 'EIA/TIA-232 RJ-45'
  timing: '2 x SYNC (BITS/J.211/DTI) RJ-45, IEEE 1588 RJ-45, 2 x inter-chassis sync RJ-45, 10 MHz and 1 PPS SMB'
  alarm: 'DB9, three dry-contact outputs'
  usb: '1 x USB 2.0 type A'
  sfp-plus: 2
  weight-kg: 9.0
  power-draw-max-w: 370
  eol: 'none-announced'
provenance:
  size: >-
    datasheet - Cisco ASR 9000 Series Route Switch Processor 440 Data Sheet, 'Physical
    specifications': Height 1.65 inches (4.2 cm), Width 16 inches (40.6 cm), Depth 26.53
    inches (67.4 cm), Weight 20 lb (9 kg). Note the DEPTH: 674 mm, the deepest control
    card in this family and 49 mm deeper than the RSP5.
  layout: >-
    drawing - the Cisco Visio master, scaled to the datasheet's own overall dimensions.
    index.json's shape box is the Visio drawing box, not the card - it reads 1.73 x
    14.75 in for every control-card master - so the ART is the ruler and the box is not,
    the same correction the line cards needed. Long axis scaled to the card's stated
    width, short axis to its stated height, two factors.
  family: >-
    these masters are NOT the one-drawing family the RSP5, RSP-880, RP3 and RSP4-S
    masters are. Each has its own jack column, its own lamp cluster and its own legends
    - the RSP-440's five upper jacks sit at 42.6, 60.6, 102.6, 121.0 and 139.4 mm where
    the RSP5's sit at 42.5, 60.4, 117.7 and a stacked pair at 139.3 - so every feature
    here is read off the master it belongs to. The port IDS come from the legends that
    master prints, matched by proximity and asserted unique, not from a table of mine:
    that is how ICS0/ICS1/TOD on the RSP-440 and nV Sync0/nV Sync1/TOD on the
    ASR-9922-RP came out different without anyone deciding they should.
  cages: >-
    composed from std/. RJ-45s are std/rj45-ganged (12.7 x 11.0) rather than std/rj45
    (16.0 x 14.0): the IEC single-port cutout will not fit twice across a 41 mm card and
    the drawn jack measures 12.81 x 10.83. Timing coax is std/smb; the USB is std/usb-a;
    SFP+ is std/sfp-ganged.
  lamps: >-
    install guide - Table 4 for the RSP cards and Table 5 for the RP, transcribed per
    lamp with Cisco's own sentence kept beside the state tokens. WHICH lamp is where is
    read off this master's own printed legends and matched by position - the RSP-440 has
    six lamps in two columns and the ASR-9922-RP has eight in three, and neither was
    assumed from the other. Where a master draws a lamp with NO legend beside it that
    lamp is not modelled: the ASR-9922-RP has three such, almost certainly the External
    and two Internal USB lamps Table 4 describes - but almost certainly is not a source,
    so they are left out and this sentence is the record of them.
  db9: >-
    the ALARM OUT connector is drawn, not composed, and deliberately not declared
    `class: cutout`: there is no std/ part for a D-subminiature DE-9, no `db9` key in
    spec/schemas/standards.yaml, and no document in this intake dimensions the panel
    opening. A cutout conforming to nothing would corrupt the aperture census L26 keeps.
  sfp-plus: >-
    install guide - 'The RSP-440 and RSP-440 Lite support two 10-GE Small Form-Factor
    Pluggable Plus (SFP+) virtualization cluster ports.' The master draws two 13.32 x
    14.39 mm cages under an 'SFP+ 0' legend, which is the count the guide gives.
  power: >-
    install guide - Table 23 of the Overview and Reference Guide, row 'RSP-440 Card':
    285 W at 25 C, 350 W at 40 C, 370 W at 55 C. max is the highest rated ambient. The
    table has a SEPARATE 'RSP-440 Lite Card' row at 240/270/300 W; the Lite is part
    number A9K-RSP440-LT and has no stencil master, so it is not modelled and its figure
    is not borrowed onto this one. Table 23 names the CARD and not the part number - its
    rows are 'RSP-440 Card', 'RP Card' and so on, with no -SE/-TR split anywhere - so
    one figure serves both variants by Cisco's own scoping rather than by an inference
    across it.
  power-datasheet-disagrees: >-
    A THIRD FIGURE EXISTS AND IS NOT CARRIED. datasheet-c78-674143, the RSP-440 data
    sheet, has a 'Power consumption' row reading 'Typical: 170 W. Maximum: 450 W'.
    Neither number is used, and the reason is that the row looks like an un-updated copy
    rather than a measurement of this card. Its typical, 170 W, is the SAME NUMBER
    data_sheet_c78-500699 gives for the ORIGINAL RSP - a card Table 23 rates 110 W lower
    at every ambient - and the two sheets share that whole table verbatim down to the
    mains input rows and the 26.53 in depth. The tell is what happens on the older
    sheet: there the maximum, 205 W, matches Table 23's 'RSP Card' row at 40 C exactly,
    which is independent corroboration that the block belongs to the card. Here 450 W
    matches nothing in Table 23's RSP-440 row - not 285, not 350, not 370 - so the block
    has no such corroboration. The same document also states its operating temperature
    twice with different floors, 0 C in one table and 5 C in another, which is what a
    partly-updated copy looks like. Recorded rather than reconciled: if someone later
    finds 450 W corroborated, this is the note to overturn.
  variants: >-
    the data sheet's ordering table also lists A9K-RSP440-LT and A9K-RSP440-LTU. Neither
    has artwork in the stencil and neither is modelled.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
elements:
  alarm-out:
    at: [11.01, 185.04]
    size: [8.65, 32.35]
    class: connector
    description: >-
      the nine-pin Alarm Out connector, drawn rather than composed: there is no std/ part
      for a DE-9 and no registry key for its panel opening, and no document in the intake
      dimensions it. Not declared `class: cutout` for that reason.
  fail:
    at: [11.64, 333.84]
    size: [2.11, 2.11]
    class: led
    description: >-
      Power Fail (FAIL). Red: standby power fail; the LED is turned off by the CAN bus
      controller once it is up and running. Off: standby power is normal.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  aco:
    at: [11.64, 341.8]
    size: [2.11, 2.11]
    class: led
    description: >-
      Alarm Cutoff (ACO). Amber: alarm cutoff has been enabled - the ACO push button was
      pressed after at least one alarm occurred.
    states:
    - {name: amber, color: '#f5a623'}
    - 'off'
  sync:
    at: [11.64, 349.78]
    size: [2.11, 2.11]
    class: led
    description: >-
      Synchronization (SYNC). Green: system timing is synchronized to an external source.
      Amber: system timing is free running. Off: no system timing is configured.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  crit:
    at: [16.47, 333.84]
    size: [2.11, 2.11]
    class: led
    description: >-
      Critical Alarm (CRIT). Red: a critical alarm has occurred.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  maj:
    at: [16.47, 341.8]
    size: [2.11, 2.11]
    class: led
    description: >-
      Major Alarm (MAJ). Red: a major alarm has occurred.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  min:
    at: [16.47, 349.78]
    size: [2.11, 2.11]
    class: led
    description: >-
      Minor Alarm (MIN). Amber: a minor alarm has occurred.
    states:
    - {name: amber, color: '#f5a623'}
    - 'off'
  led-matrix:
    at: [14.56, 356.79]
    size: [17.72, 7.93]
    class: display
    description: >-
      the four-character 5x7 LED dot-matrix display. What it shows is a message vocabulary
      - the guide gives it two sections, boot-stage/runtime and CAN bus controller errors
      - not a lamp state list, so it is a display and not an indicator.
  aco-button:
    at: [9.49, 309.86]
    size: [3.63, 3.69]
    class: button
    description: >-
      the ACO momentary push button.
  lamp-test:
    at: [9.49, 319.71]
    size: [3.63, 3.69]
    class: button
    description: >-
      the LAMP TEST momentary push button.
