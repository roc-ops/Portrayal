  status: {at: [3.1, 3.1], size: [2.2, 2.2], class: led, states: ['off', {name: ok, color: '#22c55e'}, {name: fault, color: '#ef4444'}]}
  grille: {at: [2.5, 1.5], size: [35.9, 37.8], class: rotor}
  latch-left: {at: [0.4, 13.2], size: [13.0, 14.1], class: latch}
  latch-right: {at: [27.4, 13.2], size: [13.0, 14.1], class: latch}
  pull-left: {at: [9.4, 13.2], size: [4.6, 14.1], class: latch}
  pull-right: {at: [27.0, 13.2], size: [4.6, 14.1], class: latch}
