  features:
    - node: grille
      vent: 26
      confidence: estimated
      source: >-
        cisco/nxa-sfan-35cfm@1's own elements key - the honeycomb's extent is read off the
        guide's rear figure and the depth behind it is not stated.
    - node: latch-left
      out: 6.0
      confidence: estimated
      source: >-
        cisco/nxa-sfan-35cfm@1's own elements key - the latches stand proud in every picture
        of the family and how far is not stated; 6 mm is the sibling's figure.
    - node: latch-right
      out: 6.0
      confidence: estimated
      source: >-
        cisco/nxa-sfan-35cfm@1's own elements key - as latch-left.
    - node: pull-left
      out: 7.0
      confidence: estimated
      source: >-
        cisco/nxa-sfan-35cfm@1's own elements key - the squeeze bar stands proud of its pad by
        an unstated amount; one millimetre more than the pad is assumed.
    - node: pull-right
      out: 7.0
      confidence: estimated
      source: >-
        cisco/nxa-sfan-35cfm@1's own elements key - as pull-left.
