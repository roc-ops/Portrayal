format: 1
kind: module
name: a9k-4hg-flex-se
version: 1.0.0
class: line-card
profile: networking
description: >-
  Cisco A9K 400GE Combo Service Edge Line Card, 5th generation. Forty-four ports on one
  faceplate: twenty-four SFP+ at 10GE, sixteen SFP28 at 10 or 25GE, and four
  QSFP+/QSFP28 at 40 or 100GE, for 400 Gigabit of aggregate bandwidth. The ports are
  colour-coded into four groups of eleven and each group carries up to 100GE, so the
  supported combinations are a table rather than a sum.
size: {w: 42.67, h: 403.1, d: 609.6}
attrs:
  model: 'A9K-4HG-FLEX-SE'
  role: 'line-card'
  generation: '5th'
  sfp-plus: 24
  sfp28: 16
  qsfp28: 4
  throughput: '400 Gbps'
  weight-kg: 8.5
  operating-temp: '5 to 40 C'
  chassis: 'ASR 9922, ASR 9912, ASR 9910, ASR 9906, ASR 9904, ASR 9010 and ASR 9006'
  eol: 'none-announced'
provenance:
  size: >-
    datasheet - Cisco ASR 9000 Series 5th Generation 400 Gigabit Ethernet Multi-Rate
    Line Card Data Sheet, 'Physical dimensions (includes ejector bracket/lever); (H x W
    x D); weight': 1.68 x 15.87 x 24.00 in.; 18.74 lb (42.67 x 403.10 x 609.60 mm; 8.50
    kg). This is the LONGER 5th-generation envelope, not the 395.7 the 4th generation
    uses.
  layout: >-
    drawing - the Cisco Visio master, scaled to the datasheet's own overall dimensions.
    index.json's shape box is NOT the card: it reads 1.72 x 14.75 in for every card
    master against the datasheets' 1.63 x 15.58, five percent out in both axes. The ART
    is orthographic: taking Cisco's stated W - the spec table says it 'includes ejector
    bracket/lever' - as the full long extent of the drawing puts the faceplate rectangle
    at 41.6 mm against a stated H of 41.4, inside half a percent.
  cages: >-
    composed from std/, not drawn. These masters draw a cage as a STROKED grey rectangle
    with no fill, so the dark-bore reader that finds the QSFP cards' apertures finds
    nothing on them - the cages here come from the outline layer instead. Measured 9.17
    x 14.2 mm, which rotated is 14.2 x 9.17 against std/sfp-ganged's SFF-8433 aperture
    of 14.25 x 10.40: the PITCH dimension agrees to 0.05 mm and the height is 12 percent
    under, which is the drawn opening sitting inside the bezel cutout. The registry
    figure is what is placed.
  numbering: >-
    the port numerals are transcribed from the master, and the way they were matched to
    cages is worth recording because two simpler rules each failed on a real card.
    Nearest-numeral-per-cage put three cages of the 48-port card on one number, because
    a numeral printed outboard of one row can be nearer a cage in the other row than the
    one it labels. Pairing whole ROWS and zipping by y works for the dual-rate pair and
    breaks on the 400G combo, whose two rows of 22 cages carry 24 and 20 numerals - its
    four QSFP ports are numbered 40 to 43 and printed on the opposite side from the SFP
    ports they sit beside. What is used is closest-pair-first over every numeral and
    every cage, with an assertion that the result is a permutation of 0..n-1; on all six
    masters it is, first time.
  leds: >-
    install guide - 'All Ethernet line cards have port Status LEDs on their front
    panels. Each SFP or XFP port has an adjacent LED to indicate the status of the
    associated port. In addition, each line card has a single tristate Status LED to
    display card status.' The card lamp's four states are Table 32 of the Ethernet Line
    Card Installation Guide, transcribed - note its amber is TWO states, steady during
    boot and blinking for a software configuration error. PER-PORT lamps are NOT
    modelled on these three cards: the masters draw a narrow 5.4 mm strip between each
    pair of rows rather than a discrete lamp per port, and which part of that strip
    belongs to which port is not resolvable from the drawing. That is a gap, and it is
    different from the QSFP cards, where each port's lamp is drawn separately and IS
    modelled.
  ports: >-
    install guide and datasheet, and they agree. The guide's '400G Combo Multi-Rate Line
    Card' section: 'The 400G combo multi-rate line card has 44 ports: 24 SFP+ ports
    capable of 10GE; 16 SPF28 ports capable of 10GE or 25GE; 4 QSFP+ or QSFP28 ports
    capable of 40GE or 100GE', with Figure 25 callouts '24 SFP+ ports (2 groups of 12)',
    '16 SFP28 ports (2 groups of 8)' and '4 QSFP28/QSFP+ ports (2 groups of 2)'. The
    datasheet says the same from the other side: '4 QSFP28 ports capable of 40Gb and
    100Gb Ethernet traffic support. 16 SFP28 ports capable of 10Gb and 25Gb Ethernet
    traffic support. 24 SFP+ ports capable of 10Gb Ethernet traffic support.'
  which-ports: >-
    WHICH four are the QSFPs was derived from the artwork and then found to match the
    guide exactly, which is the strongest check here. The master draws four cages at
    8.97 x 19.51 mm among forty at 9.17 x 14.20, and the numeral matcher - which knows
    nothing about port types - assigns those four the numbers 40, 41, 42 and 43. The
    guide, independently: 'Ports 40 (blue), 41 (red), 42 (magenta), 43 (orange) support
    40GE QSFP+ or 100GE QSFP28 modules.' Two sources, one answer, neither fitted to the
    other.
  colour-groups: >-
    the guide gives the colour scheme in full - 'Ports 0-5 (blue), 10-15 (red), 20-25
    (magenta), 30-35 (orange) support 10GE SFP+ modules; Ports 6-9 (blue), 16-19 (red),
    26-29 (magenta), 36-39 (orange) support 10GE/25GE SFP28 modules' - and it is NOT
    drawn here, for the reason the QSFP cards' group boxes are not: the stencil builds
    those outlines from many short stroked segments rather than closed rectangles, and a
    box drawn to look right is a line no measurement supports. The grouping is a fact
    about the ports, and it is in this sentence and in the port ids rather than in the
    paint.
  power: >-
    NOT STATED. Table 35 of the Ethernet Line Card Installation Guide is the only per-
    card power table in the 78-document intake and it stops at the 4th generation -
    there is no row for any 5th Generation card, and its 400G rows are the '400 Gigabyte
    Modular Line Card (-TR or -SE)' at 520/560/600 W and the 'Modular 4-NPU Line Card'
    at 520/590/620 W, which are the A9K-MOD400 carriers and a different product. The
    datasheet carries no power row either. So the figure is absent and the L27 warning
    stands.
  lifecycle: >-
    searched - this part number is not in bulletin EOL15321, which covers the 4th
    generation Ethernet line card family. No other notice for it is in the intake.
elements:
  status:
    at: [19.59, 378.05]
    size: [3.79, 3.79]
    class: led
    description: >-
      the single tristate card Status LED (Ethernet Line Card Installation Guide, Table
      32).
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - {name: amber-blinking, behavior: blinking, color: '#f5a623'}
    - {name: red, color: '#d0021b'}
    - 'off'
