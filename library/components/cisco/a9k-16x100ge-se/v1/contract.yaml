format: 1
kind: module
name: a9k-16x100ge-se
version: 1.0.0
class: line-card
profile: networking
description: >-
  Cisco ASR 9000 Series 16-Port 100 Gigabit Ethernet Service Edge Line Card, 4th
  generation. Sixteen QSFP28/QSFP+ ports at 100 Gigabit Ethernet, on the same faceplate
  as the A9K-16X100GE-TR. Cisco published no data sheet for this part number; it is
  modelled from the stencil artwork and its end-of-life bulletin. Superseded by the
  A9K-20HG-FLEX-SE.
size: {w: 41.4, h: 395.7, d: 604.5}
attrs:
  model: 'A9K-16X100GE-SE'
  role: 'line-card'
  generation: '4th'
  qsfp28: 16
  eol: 'announced'
  eol-announcement: 'https://www.cisco.com/c/en/us/products/collateral/routers/asr-9000-series-aggregation-services-routers/asr-9000-4th-gen-ethernet-lc-fam-eol.html'
  eol-announced: '2024-03-15'
  end-of-sale: '2024-06-15'
  end-of-life: '2029-06-15'
provenance:
  sources: >-
    READ THIS FIRST. This is one of three part numbers that have artwork in Cisco's own
    Visio stencil and NO specification anywhere in the 78-document intake. It is real -
    the Secure Boot Product List prints 'ASR 9000 16-port 100GE QSFP SE line card'
    against it, IOS XR 7.10.2, 24.2.1 and 24.3.2 firmware tables carry it, and bulletin
    EOL15321 gives it an end-of-sale date and a replacement. What does not exist is a
    data sheet: no port arrangement, no LED table, no power draw, no dimensions, and no
    entry on Cisco's own scraped datasheet-listing index. So GEOMETRY here is
    stencil-derived and the card carries no invented figure.
  size: >-
    INFERRED, and here is the whole of the inference. The -SE and -TR masters are the
    same drawing - extracted port centres agree to 0.00 mm at all sixteen ports - and
    the -TR's 41.4 x 395.7 x 604.5 mm is a datasheet fact. Two part numbers drawn on one
    faceplate share that faceplate's size. This is not the 'scale one card from its
    neighbour' move the intake warns against: that warning is about the -X- generation,
    whose master genuinely differs from the non-X one by 5.64 mm, and the same check is
    what shows these two do not differ at all. Weight is NOT inferred and is absent -
    the two variants differ in buffer memory, which has mass.
  se-tr: >-
    the -SE and -TR masters of this card are the SAME DRAWING: extracted port centres
    agree to 0.00 mm across every port, which is what one expects of two part numbers
    that differ in buffering and table scale rather than in sheet metal. Checked, not
    assumed - and the -X- master of the same port count does NOT agree with the non-X
    one (5.64 mm apart at worst), so the check distinguishes real variants from cosmetic
    ones.
  layout: >-
    drawing - the Cisco Visio master, scaled to the datasheet's own overall dimensions.
    CAUTION for anyone re-deriving this: index.json's props.height_in and width_in are
    the Visio SHAPE box, not the card. They read 1.72 x 14.75 in for EVERY card master,
    against the datasheet's 1.63 x 15.58 in, and are 5 percent out in both axes. The ART
    is orthographic and does carry geometry: taking Cisco's stated W - which the spec
    table says 'includes ejector bracket/lever' - as the full long extent of the art
    puts the faceplate rectangle at 41.6 mm against a stated H of 41.4, inside half a
    percent, which is the gate-1 check. So the drawing is the ruler and the shape box is
    not.
  frame: >-
    the card is modelled PORTRAIT - x across the 41.4 mm thickness, y along the 395.7 mm
    width - which is the stencil's own frame and the frame casa/ uses. The ASR 9006,
    9010, 9906 and 9910 carry their cards flat and the ASR 9912 and 9922 carry them
    upright; a chassis of the first kind rotates the bay rather than the card carrying
    two orientations.
  cages: >-
    composed from std/, not drawn. Ganged QSFP pitch measures 18.73 mm off the art
    against the registry's TE-measured 19.0, so Cisco's shared-wall block is about 1.4
    percent tighter; the measured PITCH is carried and the registry's APERTURE is
    carried, which leaves a nominal 0.23 mm wall. Aperture size is a governed dimension
    and a drawing is not the place to take it from.
  leds: >-
    install guide - 'Each line card has a single tristate Status LED to display card
    status. Each ... port on the line card has a port status LED visible on the front
    panel.' The state vocabulary on both is Table 32, 'Port Status and Line Card Status
    LEDs', of the Ethernet Line Card Installation Guide, transcribed rather than
    summarised: the card lamp's amber is TWO states, steady during boot and blinking for
    a software configuration error.
  not-drawn: >-
    one thing on the real faceplate is deliberately NOT modelled: the coloured outlines
    that box each port group. They are real printing - the install guide spells the
    scheme out for the 400G combo card, 'Ports 0-5 (blue), 10-15 (red), 20-25 (magenta),
    30-35 (orange)' - and the stencil draws them per group in solid and dashed strokes.
    They are omitted because the stencil builds them from many short stroked segments
    rather than closed rectangles, and guessing at a box that reads as a group boundary
    would put a line on the drawing that no measurement supports. Port grouping is
    carried structurally instead, by the port ids and by the lamp clusters that sit at
    each group's end.
  ports: >-
    install guide - the '16-Port 100-Gigabit Ethernet Line Card with QSFP28/QSFP+'
    section describes the faceplate for the port count without naming part numbers, and
    the master draws sixteen.
  power: >-
    NOT STATED for this part number, and the near miss is worth writing down. Table 35
    of the Ethernet Line Card Installation Guide has a row '16-port 100-Gigabit Ethernet
    Line Card (-SE)' at 1125/1150/1225 W. It is NOT carried here, because that heading
    identifies a variant and not a part number, and there are two 16-port -SE part
    numbers in this family: this one and the A99-16X100GE-X-SE, which is the one with a
    data sheet (Cisco ASR 9900 Series 16-Port 100 Gigabit Ethernet Service Edge Line
    Card). Nothing in the guide says which of the two the row means. A figure that is
    probably right is still a guess about which product it describes, and it would be
    summed as fact.
  lifecycle: >-
    bulletin EOL15321, 'End-of-Sale and End-of-Life Announcement for the Cisco ASR 9000
    Series 4th Generation Ethernet Line Card Family', updated 15 March 2024. Table 2
    lists this part number as affected. Last order 15 June 2024; last date of hardware
    support 15 June 2029.
