format: 1
kind: module
name: c2960s-flexstack-blank
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  The blank cover over the FlexStack module slot on the rear of a stacking-capable Catalyst 2960-S. A
  plain plate with a captive screw at two opposite corners, removed only to fit the FlexStack module
  (C2960S-STACK).
size: {w: 96.8, h: 39.4, d: 3.0}
size-confidence: {w: estimated, h: estimated, d: estimated}
attrs:
  model: 'FlexStack slot blank cover'
  role: 'slot-blank'
provenance:
  part-number: >-
    NONE PRINTED. The Catalyst 2960-S Switch Hardware Installation Guide (OL-19732-04) names it only as the
    "FlexStack module slot and cover" (Figures 1-10 and 1-11, PDF p19-20, printed 1-17 and 1-18) and
    shows it removed in "Removing the Blank Cover" (PDF p31, printed 1-7). No part number is held for it,
    so it carries none.
  size: >-
    estimated. The plate fills the slot the FlexStack module sits in. The slot's outline is read off the
    community NetBox rear elevation of the WS-C2960S-48LPD-L (a photograph with a C2960S-STACK module
    fitted, 1516 x 150 px, 3.41 px per mm from the 444.5 mm width): 96.8 x 39.4 mm, left edge 4.4 mm
    from the chassis side. The guide's Figure 1-10 shows the cover over the same opening but gives no
    dimension. The thickness is a guess for the 3D view.
relief:
  wall: '#6b7077'
body:
  depth: 3.0
  color: '#b9bec4'
skins: [default]
