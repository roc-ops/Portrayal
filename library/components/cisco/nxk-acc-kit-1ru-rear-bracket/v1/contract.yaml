format: 1
kind: component
name: nxk-acc-kit-1ru-rear-bracket
version: 1.0.0
class: bracket
behaviour: mounts
profile: networking
description: >-
  The rear rack-mount bracket of the Cisco NXK-ACC-KIT-1RU rack-mount kit, two to a kit. It
  screws to the side of a Nexus 9300 fixed switch and slides onto the slider rails. Drawn as a
  plain plate: no guide dimensions it.
size: {w: 12.0, h: 43.5}
size-confidence: {w: estimated, h: estimated}
provenance:
  model: >-
    datasheet - the Cisco N93180YC-FX3 NX-OS Mode Switch Hardware Installation Guide,
    appendix D, "Rack Mount Kit NXK-ACC-KIT-1RU": "Rear brackets (2)". The installation
    procedure adds: "Depending on the chassis depth, the back rack-mount bracket may not fit.
    In that case, you do not need the back rack-mount bracket."
  size: >-
    estimated - NO GUIDE DIMENSIONS THIS PART. 12.0 by 43.5 mm is a placeholder envelope, the
    height being the 1 RU the bracket serves; nothing measures the width.
skins: [default]
