name: a9k-40ge-b
version: 1.0.0
class: line-card
profile: networking
description: >-
  Cisco ASR 9000 Series 40-Port Gigabit Ethernet Line Card with SFP, original
  generation. Forty SFP cages in four blocks of ten, two rows of five, numbered even on
  the low row and odd on the high one.
size: {w: 43.7, h: 395.7, d: 520.7}
attrs:
  model: 'A9K-40GE-B'
  role: 'line-card'
  generation: '1st'
  sfp-plus: 40
  power-draw-max-w: 350
  weight-kg: 6.124
  eol: 'none-announced'
provenance:
  size: >-
    datasheet - Cisco ASR 9000 Series Ethernet Line Cards data sheet, 'Physical
    dimensions (H x W x D); weight: 14 x 1.72 x 20.5 in. (35.56 x 4.37 x 52.07 cm)'. The
    24-port and 36-port sheets repeat it verbatim, so one envelope covers the whole
    original generation. NOTE THE AXIS ORDER IS THE OTHER WAY ROUND from the 4th and 5th
    generation sheets: here H is the LONG dimension and W the thickness, where the newer
    sheets give H as the thickness. THE THICKNESS IS THE FINDING: 1.72 in = 43.7 mm
    against the 4th generation's 1.63 in = 41.4. These are physically thicker cards. And
    43.7 is exactly the shape-box width that had to be DISCARDED as padding for the
    newer masters - for this generation it is the real number, which is a good reminder
    that the shape box is not wrong so much as it is not always the same thing.
  anchor: >-
    the long axis is anchored at 395.7 mm, which is the 4th generation's stated ejector-
    inclusive width and NOT this generation's stated 355.6 - so here is the reasoning,
    because it looks like the wrong number. These masters are a SECOND SHELL: they share
    zero shell features with the 4th/5th generation masters, different ejector blocks,
    different screws, the PID band at the other end. But both shells are DRAWN at the
    same scale, and the standard part inside the art proves it: the SFP cages here
    measure 14.39 mm against SFF-8433's 14.25, one percent, at the 395.7 anchor. Anchor
    at 355.6 instead and they come out 12.93, nine percent under, which no SFP cage is.
    The datasheet's 355.6 is the PLATE - the drawn plate is 358.13, agreeing to 0.7
    percent - where the newer sheets quote plate plus ejectors. Same card length, two
    measuring conventions, and the 43.7 thickness is carried from the datasheet because
    that IS this generation's own number.
  leds: >-
    install guide - 'All Ethernet line cards have port Status LEDs on their front
    panels. Each SFP or XFP port has an adjacent LED to indicate the status of the
    associated port. In addition, each line card has a single tristate Status LED to
    display card status.' The card lamp's four states are Table 32, transcribed. The
    per-port A/L lamps ARE drawn on these masters but as a shared strip between each
    pair of rows rather than one lamp per port, so which part belongs to which port is
    not resolvable and they are not modelled - the same gap the newer SFP cards carry.
  power: >-
    install guide - Table 35, row '40-Port Gigabit Ethernet Line Card': 310 W at 25 C,
    320 W at 40 C, 350 W at 55 C.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
  weight: >-
    install guide - Table A-10, 'Ethernet Line Card Physical Dimensions', of the
    OL-17500-09 revision of the Ethernet Line Card Installation Guide, row 'A9K-40GE-B':
    13.5 pounds +/- .5. The kilogram figure is Cisco's own column and not my conversion
    of the pounds one. NOTE WHERE THIS COMES FROM: the CURRENT revision of the same
    guide has no such table - its 'Ethernet Line Card Physical Dimensions' section is
    one sentence pointing at a URL - so the older revision in the intake is the only
    per-part weight source there is for this generation.
  variants: >-
    the -B, -E and -L masters of this card are the SAME DRAWING - extracted cage centres
    agree at every port - which is what the data sheet says they should be: 'available
    in base, extended, and low-queue versions. All versions are functionally equivalent,
    but vary in configuration scale and buffer capacity.' Table 35 gives one power row
    for the card and does not split by variant, so all three carry the same figure by
    Cisco's own scoping.
