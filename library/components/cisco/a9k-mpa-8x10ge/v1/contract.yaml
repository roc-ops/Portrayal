format: 1
kind: module
name: a9k-mpa-8x10ge
version: 1.0.0
class: line-card
profile: networking
description: >-
  Cisco 8-Port 10 Gigabit Ethernet Modular Port Adapter with SFP+. Eight SFP+ cages in
  two blocks of four down the faceplate, each with its own A/L lamp, plus a STATUS lamp
  and a captive screw at each end. The densest of the single-row MPAs. One of the
  adapters the ASR 9001 takes; it also seats in the A9K-MOD carrier line cards.
size: {w: 33.81, h: 160.02}
attrs:
  model: 'A9K-MPA-8X10GE'
  role: 'modular-port-adapter'
  sfp-plus: 8
  media: 'SFP+, 10 Gigabit Ethernet'
  eol: 'none-announced'
provenance:
  size: >-
    drawing - and READ THE ORIENTATION FIRST, because this master is drawn on its side.
    index.json gives its shapesheet as 160.02 x 33.81 mm where the 4-port and 20-port
    MPA masters give 33.81 x 160.02: the same envelope, drawn landscape. Every
    coordinate below is therefore the master's transposed - the master's y becomes this
    component's x and its x becomes the y - so that all seven MPAs in this library share
    one frame and a chassis can rotate a bay once for all of them. The transposition is
    a relabelling of axes and not a scale, so it cannot introduce the mixed-source error
    that a stretch would.
  orientation: >-
    THE CONVERSION IS A ROTATION AND NOT A TRANSPOSE, and the difference is a mirrored
    faceplate. Swapping the axes - master y to component x, master x to component y - is
    a reflection, and it puts every A/L lamp on the wrong side of its cage. The rotation
    is fixed by one requirement: port 0 must sit at the TOP, which is where the
    portrait-drawn 4-port and 20-port masters put theirs and what lets a chassis rotate
    one bay for all seven MPAs. THE CHECK THAT SETTLES IT is the 4-port MPA, which is
    drawn portrait and needs no conversion at all: its cages sit at across-card x 15.29
    and its port numerals at 26.89. Rotate the 1-port 40GE master and its cage lands at
    15.35 and its numeral at 26.91 - both inside 0.06 mm of a card that was never
    converted. Transpose it instead and they land at 8.68 and 6.90, on the other side of
    the plate. Two masters drawn in different orientations agreeing to a twentieth of a
    millimetre is not something the wrong conversion produces.
  frame: >-
    modelled PORTRAIT - x across the module's 33.8 mm thickness, y along its 160.0 mm
    length - which is how most of these masters are drawn and how every other card in
    this library is modelled. The ASR 9001 lays its two MPAs FLAT, so its bays rotate
    the component rather than the component carrying two orientations. Note the stencil
    is not consistent about this: A9K-MPA-1X40GE, -2X40GE and -8x10GE are drawn
    landscape and the rest portrait, for one physical form factor - which the intake
    notes flag as a reason to read the artwork rather than assume an orientation from
    index.json's axis order.
  leds: >-
    install guide - Table 33, 'Modular Port Adapter LEDs', of the Ethernet Line Card
    Installation Guide gives the family vocabulary: 'The modular port adapters have two
    types of LEDs: an A/L LED for each individual port and a STATUS LED for the modular
    port adapter.' EACH MPA ALSO HAS ITS OWN TABLE and where the two differ the card's
    own table wins - Table 33 says the A/L is RED when the link is down, while this
    card's table says AMBER, and it is this card's table that is transcribed below. That
    divergence is the reason to cite the specific table rather than the general one.
  ports: >-
    install guide + drawing. The guide gives the count and the media - '8-port 10GE
    Modular Port Adapter (MPA) with SFP+' - and notes that 'Each SFP+ cage on the 8-Port
    10GE MPA has an adjacent A/L (Active/Link) LED of the card'. THE MASTER NUMBERS
    EVERY PORT ITSELF and the numerals are text, not outlined glyphs, so they are read
    rather than inferred: '0' through '7' at transposed y 24.8, 39.1, 53.1, 67.4, 92.6,
    106.6, 120.9 and 134.9, each landing on the cage beside it. Note the gap in the
    middle - the cages run 17.71, 31.82, 45.94, 60.06 and then jump to 85.33 - so the
    card is two blocks of four and not eight evenly spaced, and the numbering runs
    straight through the gap.
  power: >-
    NOT STATED. Table 35 of the Ethernet Line Card Installation Guide gives per-card
    power for the modular-chassis line cards including the A9K-MOD carriers, but nothing
    for the MPAs that go inside them, and the ASR 9001 data sheet gives a chassis figure
    only (425 W typical, 525 W maximum). An MPA's draw is inside its carrier's.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
  cages: >-
    std/sfp is the SFP+ aperture. SFP, SFP+ and SFP28 share one bezel opening and differ
    in signalling; the drawn cage measures 14.12 x 8.96 mm against the registry's 14.5 x
    10.0, the same slight under-height the 20-port GE MPA's cages show in this stencil,
    and well inside what would distinguish it from any other aperture on this faceplate.
  compatibility: >-
    install guide - a Note beside this MPA's figure: 'This MPA is not compatible with
    MOD400 consumption-model line card.' Cisco adds that 'The consumption-model MPAs can
    only be used only with consumption-model line cards', so the A9K-MOD400-CM carrier
    takes the -CM MPAs and not this one.
elements:
  led-p0:
    at: [26.38, 23.06]
    size: [1.74, 4.04]
    class: led
    description: >-
      the port's A/L (Active/Link) lamp. Table 23, '8-Port 10-Gigabit Ethernet MPA LEDs':
      off - port is not enabled; green on - port is enabled and the link is up; amber on -
      port is enabled and the link is down. Cisco adds, on the sibling tables for the XFP
      and 20-port MPAs, that the A/L 'will blink green and amber when there is traffic
      activity'; this card's own table omits that row, so blink is not carried as a state
      here. This one is port 0's.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
