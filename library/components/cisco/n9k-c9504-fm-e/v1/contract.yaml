format: 1
kind: module
name: n9k-c9504-fm-e
version: 1.0.0
class: fabric
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9504 fabric module for the 100-Gigabit -EX and -FX line cards (N9K-C9504-FM-E). A vertical
  module with a vented face, ejector levers, a BCN lamp and a status lamp; it sits in the rear of the chassis
  behind a fan tray and pairs with the N9K-C9504-FAN tray. With five of them the slots are FM 2 to FM 6 and
  an empty slot takes the N9K-C9504-FM-CV blank.
size: {w: 62.48, h: 238.76, d: 297.18}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
attrs:
  model: 'N9K-C9504-FM-E'
  role: 'fabric-module'
  power-draw-typical-w: 234
  power-draw-max-w: 313
  weight-kg: 2.98
  hot-swappable: true
  eol: 'unknown'
provenance:
  size: >-
    datasheet - Cisco N9504 NX-OS Mode Switch Hardware Installation Guide, Appendix A "Switch Dimensions"
    (printed p114, PDF p120), "Fabric modules": 2.46 in (6.25 cm) wide, 11.7 in (29.72 cm) deep, 9.4 in
    (23.88 cm) high. One row serves every fabric type.
  power: >-
    datasheet - the chassis's own "Planning for Power Requirements" table (PDF p17, printed p11), the row
    "Line cards that are supported by N9K-C9504-FM-E and N9K-C9504-FM-E2 fabric modules": 234 W typical, 313
    W maximum. The row's note says "For the N9K-N9504 switch, there is no FM-E2 fabric module support", and
    the row is a single line of figures, so nothing is read by line order here (the 9508's FM-E row is).
    The guide's first table is a copy of the 9508's and is not used.
  slots: >-
    install guide - "Overview" slot rules (PDF p9, printed p3): "For five FM-E modules, they must be in
    Slots FM2, FM3, FM4, FM5, and FM6"; "When using N9K-C9504-FM or N9K-C9504-FM-E fabric modules, any empty
    slots should be filled with N9K-C9504-FM-CV". Table 1 (PDF p8, printed p2) lists this module for the
    -EX and -FX line cards.
  weight: >-
    datasheet - Appendix A weights table (PDF p122, printed p116): 6.6 lb (2.98 kg).
  lamps: >-
    install guide - "Fabric Module LEDs" (PDF p136, printed p130): a BCN lamp (blue) and a status lamp.
    Positions estimated.
  skin: >-
    estimated - a vented face and two ejector levers, read from the rear figure of the overview (PDF p11,
    printed p5), which is isometric; no figure dimensions them.
  lifecycle: >-
    unknown - Cisco's support page gives no sale status for this part number, and no end-of-sale notice for
    it is held.
elements:
  bcn:
    at: [10.0, 208.2]
    size: [3.0, 3.0]
    class: led
    description: BCN lamp. The BCN lamp on the fan tray that covers the module also lights.
    states:
    - {name: blue, color: '#2a7de1'}
    - 'off'
  status:
    at: [48.0, 208.2]
    size: [3.0, 3.0]
    class: led
    description: Status lamp.
    states:
    - {name: green, color: '#39b54a'}
    - {name: flashing-green, color: '#39b54a', behavior: blinking}
    - {name: flashing-yellow, color: '#f5c518', behavior: blinking}
    - {name: flashing-red, color: '#d0021b', behavior: blinking}
    - {name: flashing-amber, color: '#f5a623', behavior: blinking}
    - 'off'
skins: [default]
