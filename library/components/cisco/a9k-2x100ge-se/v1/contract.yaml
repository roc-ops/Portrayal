format: 1
kind: module
name: a9k-2x100ge-se
version: 1.0.0
class: line-card
profile: networking
description: >-
  Cisco ASR 9000 Series 2-Port 100 Gigabit Ethernet DX Line Card with CFP. Two very
  large CFP cages - 75.68 mm long, the biggest aperture on any card in this library -
  each with four jackscrews at its corners and an A/L lamp beneath it. An original-
  generation card at 43.7 mm thick, not a 4th-generation one.
size: {w: 43.7, h: 395.7, d: 520.7}
attrs:
  model: 'A9K-2X100GE-SE'
  role: 'line-card'
  cfp: 2
  media: 'CFP, 100 Gigabit Ethernet'
  weight-kg: 6.35
  power-draw-max-w: 920
  eol: 'none-announced'
provenance:
  size: >-
    datasheet - Cisco ASR 9000 Series 2-Port 100 Gigabit Ethernet Line Card data sheet
    (C78-662709), 'Physical dimensions (H x W x D); weight': '14 x 1.72 x 20.5 in.; 14
    lb (35.56 x 4.37 x 52.07 cm; 6.35 kg)'. That is the ORIGINAL generation's envelope -
    1.72 in = 43.7 mm thick, not the 4th generation's 41.4 - and 355.6 is the plate, so
    the card is modelled at the family's ejector-inclusive 395.7 and 520.7 deep.
  shell: >-
    drawing - the plate, ejector blocks, captive screws and Status lamp are measured off
    this master and scaled to the datasheet's own dimensions on both axes. NOTE THE ART
    BOX IS NOT A SIZE: this master is drawn on the 46.55 x 413.95 template that the
    ORIGINAL generation uses, and the datasheet says 1.72 in = 43.7 mm, which happens to
    agree with that template - but it agrees because this really is an original-
    generation card, not because the template said so. The A9K-MOD200 is the standing
    proof that a template does not settle a thickness - it sits on the 4th generation's
    template and is an original-generation 43.7 mm card - so the datasheet is the
    authority here and the template is only a fact about which drawing Cisco copied.
  aperture: >-
    DRAWN, NOT COMPOSED, AND DECLARED `class: cutout` ANYWAY - which takes an L26
    warning, and the warning is the point. THE CFP MSA HARDWARE SPECIFICATION DOES NOT
    CARRY A BEZEL OPENING, and that is by design rather than by omission. Revision 1.4
    of 7 June 2010 was fetched and read in full: section 5.3 says 'The detailed CFP
    module dimensions are located in a separate document hosted on the CFP MSA Website',
    and it says the same thing again for the railing system and again for the electrical
    connector. Its only mechanical table, Table 5-1, is weight, flatness and roughness.
    The separate document is members-only. The cages here are transcribed from the
    master at 11.51 x 75.68 mm and conform to nothing, because there is nothing to
    conform to. The earlier instinct on cards like this was to withhold `class: cutout`
    so the aperture census stayed clean; that is backwards. L26's own message ends 'if
    the dimension cannot be sourced yet, this warning is the record of that'. A census
    kept tidy by not declaring a cutout has been routed around, not satisfied. WHAT
    WOULD CLOSE THIS, stated so a contributor is not sent on an errand that cannot be
    run: CFP MSA membership and the baseline drawing it gives access to, or a Cisco
    mechanical drawing of this faceplate. NOT 'look harder' - this is not a search that
    failed, it is a specification that withholds the figure. Contrast the XFP on the
    4-port and 2-port 10GE MPAs in this library, where INF-8077i gives the bezel opening
    outright in two figures and the only thing missing had been anyone looking outside
    the vendor's own guide.
  ports: >-
    datasheet - C78-662709, Table 1: 'Port density: 2 ports of 100 Gigabit Ethernet per
    line card', and 'C Form-Factor Pluggable (CFP) interfaces provide the capacity to
    mix and match 100 Gigabit Ethernet interface types across a single line card'. The
    master draws two cages and NAMES THEM BY THEIR LAMPS rather than by port numerals -
    it prints 'A/L0' and 'A/L1' and no bare digits - so the numbering comes from those
    legends.
  power: >-
    install guide - Table 35 of the Ethernet Line Card Installation Guide, row '2-Port
    100-Gigabit Ethernet Line Card': 800 W at 25 C, 875 W at 40 C, 920 W at 55 C. max is
    the highest rated ambient. Unambiguous here in a way the 4-port and 8-port rows are
    not: there is exactly one 2-port 100GE row and exactly one 2-port 100GE card family.
  lamps: >-
    drawing - the master prints 'A/L0' and 'A/L1' as text and draws the indicator itself
    as a small triangle rather than a rectangle or a circle, which is why the lamp-shape
    detectors used elsewhere in this library find nothing on it. The lamp is placed at
    its legend. NO PER-CARD LED TABLE EXISTS, so the three A/L states are the family's
    shape and are a BORROWING, flagged as one. The eight 2.88 mm circles at the cage
    corners are JACKSCREWS, not lamps - a CFP module is retained by four of them - and
    are not modelled as indicators.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
elements:
  cfp-0:
    at: [19.89, 51.69]
    size: [11.51, 75.68]
    class: cutout
    description: >-
      CFP port 0. A drawn opening, not a composed aperture - see provenance.aperture.
  cfp-1:
    at: [19.89, 147.62]
    size: [11.51, 75.68]
    class: cutout
    description: >-
      CFP port 1. A drawn opening, not a composed aperture - see provenance.aperture.
  led-p0:
    at: [26.69, 133.5]
    size: [2.6, 2.6]
    class: led
    description: >-
      port 0's A/L (Active/Link) lamp, printed 'A/L0' on the faceplate.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  led-p1:
    at: [26.69, 231.1]
    size: [2.6, 2.6]
    class: led
    description: >-
      port 1's A/L (Active/Link) lamp, printed 'A/L1' on the faceplate.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  status:
    at: [23.48, 368.62]
    size: [3.54, 3.54]
    class: led
    description: >-
      the card's Status LED. Table 32, 'Port Status and Line Card Status LEDs', of the
      Ethernet Line Card Installation Guide, section 'Card Status LED (one per card)'.
      Green: line card has booted properly and is ready to pass or is passing traffic.
      Steady amber: boot process underway. Blinking amber: software configuration error
      that prevents the card passing traffic - it may still be passing traffic with some
      degradation. Red: hardware error, not passing traffic. Off: powered off. Steady and
      blinking amber share one colour and are not two states; the distinction is recorded
      because it is the difference between a card booting and a card misconfigured.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - {name: red, color: '#d0021b'}
    - 'off'
relief:
  wall: '#4a4f55'
body:
  depth: 520.7
  color: '#b9bec4'
skins: [default]
