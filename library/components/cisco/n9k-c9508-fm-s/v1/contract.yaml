format: 1
kind: module
name: n9k-c9508-fm-s
version: 1.0.0
class: fabric
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9508 fabric module for the 100-Gigabit N9K-X9432C-S line card (N9K-C9508-FM-S). A vertical
  module with a vented face, ejector levers, a BCN lamp and a status lamp; it sits in the rear of the chassis
  behind a fan tray. Four give full bandwidth for the N9K-X9432C-S. Cisco has announced its end of sale.
size: {w: 62.48, h: 416.56, d: 297.18}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
attrs:
  model: 'N9K-C9508-FM-S'
  role: 'fabric-module'
  power-draw-typical-w: 340
  power-draw-max-w: 400
  hot-swappable: true
  eol: 'end-of-sale'
provenance:
  size: >-
    datasheet - Cisco N9508 NX-OS Mode Switch Hardware Installation Guide, Appendix A "Switch Dimensions"
    (printed p113, PDF p119), "Fabric modules": 2.46 in (6.25 cm) wide, 11.7 in (29.72 cm) deep, 16.4 in
    (41.66 cm) high. One row serves every fabric type.
  power: >-
    datasheet - "Planning for Power Requirements" table (printed p13, PDF p19), the row "Line cards that are
    supported by N9K-C9508-FM-S fabric modules": 340 W typical, 400 W maximum, read as the module's own draw.
  compatibility: >-
    install guide - Table 2: four fabric modules for the N9K-X9432C-S. Table 1 does not list this module, so
    the guide does not pair it with a fan tray; the "Fan Tray LEDs" text names it as a module that can power
    the tray behind it.
  lamps: >-
    install guide - "Fabric Module LEDs": a BCN lamp (blue) and a status lamp. Positions estimated.
  skin: >-
    estimated - a vented face and two ejector levers, read from the rear figure of the overview (PDF p12);
    no figure dimensions them.
  lifecycle: >-
    end-of-sale - Cisco's end-of-sale notice for the N9K-C9508-FM-S, per the intake's end-of-life index.
elements:
  bcn:
    at: [10.0, 386.0]
    size: [3.0, 3.0]
    class: led
    description: BCN lamp. The BCN lamp on the fan tray that covers the module also lights.
    states:
    - {name: blue, color: '#2a7de1'}
    - 'off'
  status:
    at: [48.0, 386.0]
    size: [3.0, 3.0]
    class: led
    description: Status lamp.
    states:
    - {name: green, color: '#39b54a'}
    - {name: flashing-green, color: '#39b54a', behavior: blinking}
    - {name: flashing-yellow, color: '#f5c518', behavior: blinking}
    - {name: flashing-red, color: '#d0021b', behavior: blinking}
    - {name: flashing-amber, color: '#f5a623', behavior: blinking}
    - 'off'
skins: [default]
