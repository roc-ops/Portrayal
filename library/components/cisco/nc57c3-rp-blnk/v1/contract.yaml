format: 1
kind: module
name: nc57c3-rp-blnk
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Blank filler for an unpopulated route processor bay of the Cisco NCS-57C3-MOD, with the part number its label prints,
  NC57C3-RP-BLNK. A plain grey landscape plate with a vent strip, an ejector at each end and its name printed at the upper left.
size: {w: 196.0, h: 18.5}
size-confidence: {w: photo-measured, h: photo-measured}
part-numbers:
  NC57C3-RP-BLNK: {part: NC57C3-RP-BLNK}
attrs:
  role: airflow-blank
provenance:
  model: >-
    photo-measured - the part number is read off the label printed on the blank in Figure 1 of the Hardware Installation Guide
    for Cisco NCS 5700 Series Fixed-Port Routers (first published 2021-06-23, last modified 2026-05-15), upper front view, which
    shows two route processor blanks stacked at the top right; the label is small and reads "NC57C3-RP-BLNK". NO TEXT IN THE
    GUIDE NAMES THE PART.
  size: >-
    photo-measured - Figure 1's front view at 1.225 px/mm taken from the 438.4 mm chassis width: each blank reads about 196 mm
    wide and 18.5 mm high, the size of the route processor it stands in for. The guide prints no dimension of the blank.
  depth: >-
    estimated - not stated in any held document; 15 mm is a round figure for a blank plate.
states: [absent]
elements:
  vent: {at: [46.0, 3.0], size: [100.0, 8.0], class: bezel}
skins: [default]
body:
  depth: 15
  color: '#b9bec4'
  footprint: {at: [0, 0], size: [196.0, 18.5]}
