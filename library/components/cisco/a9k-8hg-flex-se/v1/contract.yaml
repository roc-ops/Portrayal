description: >-
  Cisco ASR 9000 Series 800G Service Edge Combo Line Card, 5th generation. Eight 100
  Gigabit Ethernet ports - six QSFP28 and two QSFP-DD - for 8x100G, or 2x200G, or
  2x400G, or any mix up to 800 Gbps. The two QSFP-DD ports are ports 0 and 7.
