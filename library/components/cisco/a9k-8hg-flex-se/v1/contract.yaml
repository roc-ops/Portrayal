provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 9 panel lamps at dome 0.3 (one number, carried by
    120 Cisco contracts); 4 ejector brackets, their levers and the grip flanges at out 4.2
    (one number, carried by 61 Cisco contracts); 2 captive screw heads at cyl 1.6 (one
    number, carried by 63 Cisco contracts); 1 asset labels at out 0.2 (one number, carried
    by 22 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE
    READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind of
    interpolated anyway... It's just to give it a realistic view instead of just being a
    flat 2d... All of the 3d stuff is going to be mostly conjecture unless the vendor
    provides that data.' So a proudness here is an interpolation for a realistic view, NOT a
    claim about the hardware, and the confidence token on every feature says so rather than
    leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE
    DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED
    figure reused for the same class of hardware, and these origins are not measured - they
    are the library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size. STILL REFUSED ON THIS FACE, and these
    are NOT the same kind of gap: pivot-top - each would need an EIGHTH family number for
    one or two nodes, which buys a little realism at the cost of another invented figure;
    left flat deliberately. The ruling sanctions interpolating a PROUDNESS for a realistic
    view. It does not sanction inventing an APERTURE, which is a dimension a specification
    is withholding rather than one nobody has measured.
  size: >-
    datasheet - Cisco ASR 9000 Series 5th Generation High-Density Multi-Rate Line Cards:
    2 Terabit and 0.8 Terabit Cards, '800G Service Edge Combo Line Card - 5th
    Generation: 1.63 x 15.58 x 23.80 in.; 21.70 lb (41.4 x 395.7 x 604.5 mm; 9.84 kg)'.
  layout: >-
    drawing - the Cisco Visio master, scaled to the datasheet's own overall dimensions.
    CAUTION for anyone re-deriving this: index.json's props.height_in and width_in are
    the Visio SHAPE box, not the card. They read 1.72 x 14.75 in for EVERY card master,
    against the datasheet's 1.63 x 15.58 in, and are 5 percent out in both axes. The ART
    is orthographic and does carry geometry: taking Cisco's stated W - which the spec
    table says 'includes ejector bracket/lever' - as the full long extent of the art
    puts the faceplate rectangle at 41.6 mm against a stated H of 41.4, inside half a
    percent, which is the gate-1 check. So the drawing is the ruler and the shape box is
    not.
  frame: >-
    the card is modelled PORTRAIT - x across the card's thickness, y along its width -
    which is the stencil's own frame and casa's. WHICH WAY A CHASSIS CARRIES IT is the
    Overview and Reference Guide's 'Chassis Slots' section, set out here because an
    earlier version of this note had it wrong for three chassis out of seven: on the ASR
    9010 every line card and RSP card faces the front and stands VERTICALLY, its ejector
    levers and captive screws at the card's top and bottom; on the ASR 9006 and the ASR
    9904 every line card and RSP card faces the front and lies HORIZONTALLY, its levers
    and screws at the card's left and right ends; and the ASR 9906, ASR 9910, ASR 9922
    and ASR 9912 are each given as vertical. So only the ASR 9006 and the ASR 9904 lay
    their cards flat and rotate the bay; the other five place this component unrotated.
    The ejector-lever wording is the tell and it is why the guide's own terms are
    kept - 'top and bottom' means vertical, 'left and right ends'
    means horizontal, and the RU height of a chassis does not decide it.
  cages: >-
    composed from std/, not drawn. Ganged QSFP pitch measures 18.73 mm off the art
    against the registry's TE-measured 19.0, so Cisco's shared-wall block is about 1.4
    percent tighter; the measured PITCH is carried and the registry's APERTURE is
    carried, which leaves a nominal 0.23 mm wall. Aperture size is a governed dimension
    and a drawing is not the place to take it from.
  leds: >-
    install guide - each line card carries one tristate Status LED showing card status,
    and each port on the card has its own port status LED visible on the front panel.
    The state vocabulary on both is Table 32, 'Port Status and Line Card Status
    LEDs', of the Ethernet Line Card Installation Guide, transcribed rather than
    summarised: the card lamp's amber is TWO states, steady during boot and blinking for
    a software configuration error.
  not-drawn: >-
    one thing on the real faceplate is deliberately NOT modelled: the coloured outlines
    that box each port group. They are real printing - the install guide spells the
    scheme out for the 400G combo card, 'Ports 0-5 (blue), 10-15 (red), 20-25 (magenta),
    30-35 (orange)' - and the stencil draws them per group in solid and dashed strokes.
    They are omitted because the stencil builds them from many short stroked segments
    rather than closed rectangles, and guessing at a box that reads as a group boundary
    would put a line on the drawing that no measurement supports. Port grouping is
    carried structurally instead, by the port ids and by the lamp clusters that sit at
    each group's end.
  ports: >-
    install guide - '8-Port 100-Gigabit Ethernet Line Card with QSFP28/QSFPDD': 'Six
    QSFP28 ports' and 'Two QSFP-DD ports', with Figure 22 callout 2 'Two 400GE QSFP-DD
    connectors'. The art marks the same two by cage size - 9.30 x 19.04 against 8.67 x
    18.56 - and they are ports 0 and 7.
  power: >-
    NOT PUBLISHED. Cisco does not state per-card power for this generation in any document
    that could be found, and the search was thorough enough to say so.
    WHAT WAS SEARCHED. All 573 converted documents, for this part number, with a
    twelve-line window either side and again with a thirty-line window against any line
    introducing a power requirement or consumption - no hit. The CANONICAL DATASHEETS are
    staged and converted (datasheet-c78-743580 for the 5th-generation high-density
    multi-rate cards, c78-743579, c78-744662 for the 400 GbE multi-rate card, c78-744663)
    and their product-specification tables run chassis compatibility, port density,
    performance, dimensions, weight, operating and storage temperature, humidity, EMC,
    immunity, safety and NEBS - and then stop. There is no power row.
    Cisco's own per-card power appendix EXISTS and does not cover this card: the ASR
    9000 Ethernet Line Card Installation Guide, Table 35 'Ethernet Line Card Power
    Consumption Values', gives 25/40/55 C figures for the previous generation and has no row
    for a 200 Gigabyte modular card, a 400G combo card or any FLEX part. That was checked
    against the guide's own part-number-to-description mapping table rather than by reading
    the prose.
    A web search in August 2026 returned only reseller listings, which are not a source
    for this library.
    THIS IS A VENDOR DISCLOSURE GAP, NOT AN INTAKE GAP - staging more documents will not
    close it. The remaining routes are the Cisco Power Calculator or asking Cisco directly,
    and if either produces a figure it belongs here.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake, and it is
    not named in bulletin EOL15321.
