format: 1
kind: module
name: nxa-sfan-30cfm
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  The fan module of the Cisco Nexus 9348GC-FX3 fixed switch, ordered as NXA-SFAN-30CFM-PI
  (port-side intake, burgundy) or NXA-SFAN-30CFM-PE (port-side exhaust, blue). It has two
  rotors behind a honeycomb grille. A grey handle runs across its middle, with a coloured
  squeeze bar at each side of the hub. A ringed mark sits in the upper left corner.
size: {w: 40.8, h: 40.7}
size-confidence: {w: estimated, h: estimated}
attrs:
  model: 'NXA-SFAN-30CFM'
  power-absent: not-published
  rotors: 2
  weight-kg: 0.12
  airflow: front-to-back
provenance:
  model: >-
    datasheet - the Cisco N9348GC-FX3 NX-OS Mode Switch Hardware Installation Guide (First
    Published 2023-08-18, Last Modified 2026-09-18), Overview: "Port-side intake airflow with
    burgundy coloring (NXA-SFAN-30CFM-PI)" and "Port-side exhaust airflow with blue coloring
    (NXA-SFAN-30CFM-PE)", "Each fan module has two rotors", and the weights table, 0.26 lb
    (0.12 kg). THE AIRFLOW SUFFIX IS DROPPED from the model, as on cisco/nxa-fan-30cfm@1. THE
    PART NUMBER HAS AN S in it, as cisco/nxa-sfan-35cfm@1's does, and is a different part from
    cisco/nxa-fan-30cfm@1 (NXA-FAN-30CFM-B and -F); whether they differ on the face is not
    said.
  power: >-
    NOT PUBLISHED. Searched the guide's appendix B for a per-module fan figure; it gives the
    whole switch only (226 W typical, 242 W maximum). L29 stands on it at the chassis.
  size: >-
    estimated - the guide states no fan module dimension. The rear figure (art number 504861,
    1820 x 412 px, the switch body 1773 px across for 439.4 mm, 4.03 px per mm) draws a frame
    about 168 px, 41.6 mm, across and 41 mm down at a pitch of 46.1 mm. The size here is
    cisco/nxa-sfan-35cfm@1's, 40.8 by 40.7, which the same drawing style gave for a
    comparable frame; the 0.8 mm difference is inside the reading error of the figure's heavy
    bezel.
  elements: >-
    estimated - the figure draws a honeycomb disc above and another below a middle band, a
    handle with an arrow marking at each end of the band and a square hub between them, and
    a ringed mark in the upper left corner. The arrangement and artwork are
    cisco/nxa-sfan-35cfm@1's: the two figures draw the same module.
  lamp: >-
    datasheet for the states - the guide's appendix, "Fan Module LEDs": Status green
    (operational), red (not operational), off (no power). THE LAMP IS PLACED AT THE FIGURE'S
    UPPER LEFT RING, the only round mark on the face; the guide does not say where the lamp
    is.
  latch-colour: >-
    datasheet for the convention - the guide's Overview: burgundy for port-side intake, blue
    for port-side exhaust. The values are cisco/nxa-fan-30cfm@1's.
  depth: >-
    estimated - not stated. 100 mm is cisco/nxa-fan-30cfm@1's figure for a module of this
    class and nothing here measures it.
states: [absent]
elements:
  status: {at: [3.1, 3.1], size: [2.2, 2.2], class: led, states: ['off', {name: ok, color: '#22c55e'}, {name: fault, color: '#ef4444'}]}
  grille: {at: [2.5, 1.5], size: [35.9, 37.8], class: rotor}
  latch-left: {at: [0.4, 13.2], size: [13.0, 14.1], class: latch}
  latch-right: {at: [27.4, 13.2], size: [13.0, 14.1], class: latch}
  pull-left: {at: [9.4, 13.2], size: [4.6, 14.1], class: latch}
  pull-right: {at: [27.0, 13.2], size: [4.6, 14.1], class: latch}
fields:
  latch-finish:
    label: Latch colour
    type: text
    default: '#ac2f54'
  latch-edge:
    label: Latch edge colour
    type: text
    default: '#6e1c2c'
relief:
  wall: '#15181b'
  features:
    - node: grille
      vent: 26
      confidence: estimated
      source: >-
        cisco/nxa-sfan-30cfm@1's own elements key - the honeycomb's extent is read off the
        guide's rear figure and the depth behind it is not stated.
    - node: latch-left
      out: 6.0
      confidence: estimated
      source: >-
        cisco/nxa-sfan-30cfm@1's own elements key - the latches stand proud in every picture
        of the family and how far is not stated; 6 mm is the sibling's figure.
    - node: latch-right
      out: 6.0
      confidence: estimated
      source: >-
        cisco/nxa-sfan-30cfm@1's own elements key - as latch-left.
    - node: pull-left
      out: 7.0
      confidence: estimated
      source: >-
        cisco/nxa-sfan-30cfm@1's own elements key - the squeeze bar stands proud of its pad by
        an unstated amount; one millimetre more than the pad is assumed.
    - node: pull-right
      out: 7.0
      confidence: estimated
      source: >-
        cisco/nxa-sfan-30cfm@1's own elements key - as pull-left.
skins: [default]
body:
  depth: 100
  color: '#26292d'
  footprint: {at: [0, 0], size: [40.8, 40.7]}
