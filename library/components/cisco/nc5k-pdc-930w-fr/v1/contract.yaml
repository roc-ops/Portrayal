  ok: {at: [2.6, 29.2], size: [2.8, 2.8], class: led, states: ['off', {name: ok, color: '#22c55e'}]}
  fan: {at: [15.2, 2.5], size: [30.0, 30.0], class: rotor}
  handle: {at: [9.6, 32.8], size: [41.4, 6.4], class: handle}
  latch: {at: [90.4, 10.8], size: [6.0, 12.6], class: latch}
