format: 1
kind: module
name: a9k-400g-dwdm-tr
version: 1.1.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9000 400-Gbps IPoDWDM Line Card. Two CFP2-DWDM ports at 100 Gigabit Ethernet
  and twenty SFP+ ports at 10 Gigabit Ethernet on one faceplate, the SFP+ in two double-
  stacked blocks of ten. Cisco names the optical ports CFP2-0 and CFP2-1 rather than
  numbering them alongside the SFP+, so the two port sets are numbered independently and
  the SFP+ run 0 to 19.
size: {w: 43.7, h: 395.7, d: 569.0}
attrs:
  model: 'A9K-400G-DWDM-TR'
  role: 'line-card'
  cfp2: 2
  sfp-plus: 20
  media: 'CFP2-DWDM 100GE and SFP+ 10GE'
  capacity: '400 Gbps'
  weight-kg: 10.4
  operating-temp: '5 to 40 C'
  power-draw-max-w: 600
  eol: 'none-announced'
provenance:
  stack-orientation: >-
    The belly-to-belly cage pairs on this card follow the library's stack convention
    (docs/pluggables-3d-design.md, S1-S4): on a card drawn on its side a pair sits left
    and right, the left cage 270 beside the right 90, so both cage lips face the band
    between the two cages and both bails face outward, where a thumb reaches them. Where
    this provenance records a reading of a stack the orientation is that reading;
    otherwise it is the rule, not an observation. A photograph of the stack that shows
    otherwise overturns it. Turning a composed cage in place changes no box, id or
    anything a device places, so it is a minor bump (S6).
  chassis-compatibility: >-
    datasheet c78-736456, the Chassis compatibility row, which names the chassis this
    card is supported in. That row is why the slot bays accept it; geometry is not a
    compatibility source. See roc-ops/Portrayal#262.
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 3 panel lamps at dome 0.3 (one number, carried by
    120 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE
    READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind of
    interpolated anyway... It's just to give it a realistic view instead of just being a
    flat 2d... All of the 3d stuff is going to be mostly conjecture unless the vendor
    provides that data.' So a proudness here is an interpolation for a realistic view, NOT a
    claim about the hardware, and the confidence token on every feature says so rather than
    leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE
    DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED
    figure reused for the same class of hardware, and these origins are not measured - they
    are the library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size. STILL REFUSED ON THIS FACE, and these
    are NOT the same kind of gap: the 2 drawn aperture(s) cfp2-0, cfp2-1 - an optical or
    connector aperture that conforms to no published standard, so no depth exists to
    interpolate from. The ruling sanctions interpolating a PROUDNESS for a realistic view.
    It does not sanction inventing an APERTURE, which is a dimension a specification is
    withholding rather than one nobody has measured.
  size: >-
    datasheet - Cisco ASR 9000 400-Gbps IPoDWDM Line Card data sheet (c78-736456):
    'Physical dimensions: 14.5" W x 1.72" H x 22.40" L (368.3mm W, 43.7mm H, 569mm).
    Weight = 22.9lbs (10.4kgs)'. Note the axis labels - W is the long faceplate
    dimension and H the thickness - and note the THICKNESS: 1.72 in = 43.7 mm, the
    original generation's, not the 4th generation's 41.4. 368.3 is the plate; the card
    is modelled at the family's ejector-inclusive 395.7. The 569 mm is the sheet's own
    and is carried as the depth.
  shell: >-
    drawing - the plate, ejector blocks, captive screws and Status lamp are measured off
    this master and scaled to the datasheet's own dimensions on both axes. NOTE THE ART
    BOX IS NOT A SIZE: this master is drawn on the 46.55 x 413.95 template that the
    ORIGINAL generation uses, and the datasheet says 1.72 in = 43.7 mm, which agrees
    with that template - by coincidence of generation, not because the template
    established it. The A9K-MOD200 is the standing proof that a template does not settle
    a thickness - it sits on the 4th generation's template and is an original-generation
    43.7 mm card - so the datasheet is the authority here and the template is only a
    fact about which drawing Cisco copied.
  aperture: >-
    DRAWN, NOT COMPOSED, AND DECLARED `class: cutout` ANYWAY - which takes an L26
    warning, and the warning is the point. THE CFP2 SPECIFICATION EXCLUDES THE NUMBER
    EXPLICITLY. Revision 1.0 was fetched and read: section 5.3 states 'All mechanical
    hardware dimensions in this document are for reference only. Normative dimensions
    are found in the latest published CFP2 baseline drawing', and section 5.4, Host
    System Dimensions, is one sentence pointing at the same members-only document. The
    cages here are transcribed from the master at 13.61 x 42.63 mm and conform to
    nothing, because there is nothing to conform to. The earlier instinct on cards like
    this was to withhold `class: cutout` so the aperture census stayed clean; that is
    backwards. L26's own message ends 'if the dimension cannot be sourced yet, this
    warning is the record of that'. A census kept tidy by not declaring a cutout has
    been routed around, not satisfied. WHAT WOULD CLOSE THIS, stated so a contributor is
    not sent on an errand that cannot be run: CFP MSA membership and the baseline
    drawing it gives access to, or a Cisco mechanical drawing of this faceplate. NOT
    'look harder' - this is not a search that failed, it is a specification that
    withholds the figure. Contrast the XFP on the 4-port and 2-port 10GE MPAs in this
    library, where INF-8077i gives the bezel opening outright in two figures and the
    only thing missing had been anyone looking outside the vendor's own guide. NOTE WHAT
    IS NOT IN THIS WARNING: the twenty SFP+ ports on the same faceplate ARE composed,
    from std/sfp, and are not part of the L26 count. One card, two apertures, one
    registerable and one not - which is the clearest demonstration in this library that
    composed-versus-drawn is a property of the OPENING and not of the card that carries
    it.
  ports: >-
    datasheet - c78-736456, Table 2: 'Port density: Two 100G CFP2-DWM ports and 20 ports
    10G SFP+ ports'. The master prints all twenty-two legends as text and they are read
    rather than inferred: 'CFP2-0' and 'CFP2-1' beside the two large cages, and '0'
    through '19' beside the SFP+. THE SFP+ NUMBERING ALTERNATES ACROSS THE CARD - even
    ports in the low-x column at 10.20 and odd in the high-x column at 22.24, ascending
    together down the length - which is the same scheme the A9K-MPA-20X1GE and
    A9K-MPA-20X10GE print, and here every one of the twenty numerals is on the drawing
    rather than only the four at the ends.
  power: >-
    install guide - Table 35, row '2-Port 100G + 20-Port 10 GE Combination IPoDWDM Line
    Card with CFP2 and SFP+ (-TR)': 520 W at 25 C, 560 W at 40 C, 600 W at 55 C. max is
    the highest rated ambient. That heading names the port complement AND the media AND
    the -TR suffix, which makes it the least ambiguous row in Table 35 - there is
    exactly one card it can mean and this is it.
  lamps: >-
    drawing - two 2.51 mm circles at x 26.56, one above each CFP2 cage, found by
    scanning stroked fill:none paths because they are drawn as outlines and appear in no
    filled-shape list. NO PER-CARD LED TABLE EXISTS for this card, so the three A/L
    states are the family's shape and are a BORROWING, flagged as one. THE TWENTY SFP+
    PORTS HAVE NO LAMPS ON THIS MASTER - unlike the 20-port MPAs, which draw a triangle
    pair per position in a centre strip, this card's SFP+ blocks carry none, and none
    are modelled.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
elements:
  cfp2-0:
    at: [20.67, 67.15]
    size: [13.61, 42.63]
    class: cutout
    description: >-
      CFP2-DWDM port 0. A drawn opening, not a composed aperture - see
      provenance.aperture. The twenty SFP+ ports on the same faceplate ARE composed, from
      std/sfp.
  cfp2-1:
    at: [20.67, 143.09]
    size: [13.61, 42.63]
    class: cutout
    description: >-
      CFP2-DWDM port 1. A drawn opening, not a composed aperture - see
      provenance.aperture. The twenty SFP+ ports on the same faceplate ARE composed, from
      std/sfp.
  led-cfp2-0:
    at: [25.3, 56.89]
    size: [2.51, 2.51]
    class: led
    description: >-
      the CFP2-0 port's A/L lamp, drawn as a 2.51 mm circle above its cage.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  led-cfp2-1:
    at: [25.3, 132.88]
    size: [2.51, 2.51]
    class: led
    description: >-
      the CFP2-1 port's A/L lamp, drawn as a 2.51 mm circle above its cage.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  status:
    at: [23.48, 368.62]
    size: [3.54, 3.54]
    class: led
    description: >-
      the card's Status LED. Table 32, 'Port Status and Line Card Status LEDs', of the
      Ethernet Line Card Installation Guide, section 'Card Status LED (one per card)'.
      Green: line card has booted properly and is ready to pass or is passing traffic.
      Steady amber: boot process underway. Blinking amber: software configuration error
      that prevents the card passing traffic - it may still be passing traffic with some
      degradation. Red: hardware error, not passing traffic. Off: powered off. Steady and
      blinking amber share one colour and are not two states; the distinction is recorded
      because it is the difference between a card booting and a card misconfigured.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - {name: red, color: '#d0021b'}
    - 'off'
relief:
  wall: '#4a4f55'
  features:
    - node: led-cfp2-0
      dome: 0.3
      confidence: estimated
      source: >-
        common/led-dot@1 - the library's one panel-lamp figure. Its own provenance is 'size:
        estimated' and the dome carries none
    - node: led-cfp2-1
      dome: 0.3
      confidence: estimated
      source: >-
        common/led-dot@1 - the library's one panel-lamp figure. Its own provenance is 'size:
        estimated' and the dome carries none
    - node: status
      dome: 0.3
      confidence: estimated
      source: >-
        common/led-dot@1 - the library's one panel-lamp figure. Its own provenance is 'size:
        estimated' and the dome carries none
