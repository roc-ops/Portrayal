format: 1
kind: module
name: a99-sfc3
version: 1.0.0
class: fabric
profile: networking
description: >-
  Cisco ASR 9900 Series Third Generation Switch Fabric Card. One switch fabric plane for
  an ASR 9912 or an ASR 9922 - the data sheet's specifications table gives the same part
  number for both. A plain faceplate: a hex-perforated vent field over most of its
  length, two ejector levers, two captive installation screws and a single tri-colour
  Status LED.
size: {w: 41.4, h: 395.7}
attrs:
  model: 'A99-SFC3'
  role: 'switch-fabric'
  generation: '3rd'
  chassis: 'ASR 9912, ASR 9922'
  power-draw-max-w: 340
  eol: 'none-announced'
provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 1 vent fields at vent 26 (one number, carried by
    9 Cisco contracts); 1 panel lamps at dome 0.3 (one number, carried by 120 Cisco
    contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE READING OF WHAT
    RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind of interpolated anyway...
    It's just to give it a realistic view instead of just being a flat 2d... All of the 3d
    stuff is going to be mostly conjecture unless the vendor provides that data.' So a
    proudness here is an interpolation for a realistic view, NOT a claim about the hardware,
    and the confidence token on every feature says so rather than leaving it to be inferred.
    WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE DOES COME FROM ANOTHER
    PORTRAYAL PART. `borrowed` is defined as another part's MEASURED figure reused for the
    same class of hardware, and these origins are not measured - they are the library's
    first guess at that hardware, and the contracts say so themselves: agr-panel-screw's
    provenance reads 'estimated - it stands proud but was not measured', agr-psu-dc sources
    its latch's ARRANGEMENT from a photograph and never its proudness, agr-fan describes its
    handle and grille by appearance only, and common/led-dot's entire provenance is 'size:
    estimated'. Spelling that chain `borrowed` would convert a guess into an apparent
    measurement at one remove, a thousand times over. `source` still names the origin, so
    the coordinating benefit is kept and only the claim that is not true is dropped. READ
    THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd contracts is ONE
    ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened to agree. One
    caliper on any one Cisco captive screw, any one ejector lever or any one panel lamp
    corrects every part in the library that shares it, which is the whole reason the numbers
    are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN FIRST AND IS
    RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud', 'extends
    outward', 'stands proud' and 'clearance in front' - the only vendor in the intake that
    publishes a projection is UfiSpace, on the S9510-28DC; the per-card dimension tables,
    including Table A-10 of the older Ethernet Line Card Installation Guide which the
    current revision dropped, all of which carry H, W, D and weight only; and the ASR 9000
    Visio stencil, whose 119 masters are FRONT and REAR elevations with no side, top or
    isometric view, so it holds no depth axis at all and is closed as a source. Figure 48 of
    the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide DO show this
    hardware in three dimensions and are perspective drawings with a vanishing point, so
    they settle the ARRANGEMENT - bracket off the plate, lever along it, domed screw head
    proud of both - and nothing about size.
  size: >-
    drawing - the stencil master, read the way the line cards were. Its shape box is the
    padded 1.72 x 14.75 in that every card-envelope master in this stencil carries and
    is not the part; the art measures a plate of 44.06 x 358.8 mm inside a 395.7 mm
    envelope, and 395.7 is Cisco's own stated line-card W, the one the spec table says
    'includes ejector bracket/lever'. w is normalised to the line cards' 41.4 so that a
    fabric slot and a line-card slot are the same opening where a chassis shares them.
    NO datasheet states a fabric card's dimensions - the SFC3 and SFC2 data sheets carry
    a specifications table with no physical row at all - so this is stencil-derived, and
    the corroboration is that the art is the same drawing, at the same scale, as the
    cards whose dimensions ARE stated.
  depth: >-
    NOT MODELLED. No document in the intake gives a fabric card's depth, and unlike the
    line cards there is no datasheet row to take it from. Rather than inherit the line
    cards' 604.5 - which would be a guess dressed as a measurement, and these cards do
    not even share the line cards' length - the component declares a faceplate and no
    body. It will render as a face rather than a box in 3D, and that is the honest
    depiction of what is known.
  lamp: >-
    install guide - Table 9, 'FC Card LED Display Definitions', of the Overview and
    Reference Guide. Four states, transcribed rather than reduced: green, red, amber and
    off, each with the sentence Cisco prints beside it. This is a sourced vocabulary,
    not the RSP's borrowed.
  chassis: >-
    datasheet - Cisco ASR 9900 Series Third Generation Switch Fabric Card 3 Data Sheet,
    Table 3: 'A99-SFC3 (supports both ASR 9912 and ASR 9922 chassis)', 'A99-SFC3-S
    (supports ASR 9910 chassis)', 'A99-SFC3-T (supports ASR 9906 chassis)'. One family,
    three chassis, three part numbers.
  power: >-
    install guide - Table 23, 'RSP Cards, RP Cards, Fabric Cards Power Consumption
    Specifications', of the Overview and Reference Guide. READ THE SCOPE: this one part
    number has TWO rows, because its draw depends on which chassis it is in. 'A99-SFC3
    Card (ASR 9922)' is 320 W at 27 C, 330 at 40 and 340 at 55; 'A99-SFC3 Card (ASR
    9912)' is 165 W at 27 C, 175 at 40 and 185 at 55. That is not a contradiction, it is
    two scopes - an ASR 9922 carries seven fabric planes against the 9912's five and
    drives them harder - so both are recorded and the HIGHEST is what power-draw-max-w
    carries, which is what max means. A 9912 budget built from this number is
    conservative by up to 155 W per card, and that is the right direction to be wrong
    in. Cisco states no typical for any card in this table.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake. It is itself
    the migration target: the Hardware Installation Guide carries a 'Migrating from
    A99-SFC2 to A99-SFC3 Card' section.
elements:
  status:
    at: [34.4, 353.4]
    size: [3.2, 3.2]
    class: led
    description: >-
      the single tri-colour Status LED. Table 9, 'FC Card LED Display Definitions', of
      the Overview and Reference Guide: green - FC card powered on and FPGA is
      programmed; red - fault or malfunction in FC card power up or FPGA programming;
      amber - FC card powered on but fabric not active; off - FC card powered off via
      CLI. Cisco's own note on the green state is worth carrying: 'Fabric Data Link
      failure is not detected so LED remains green'.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - {name: red, color: '#d0021b'}
    - 'off'
relief:
  wall: '#4a4f55'
  features:
    - node: vent-field
      vent: 26
      confidence: estimated
      source: >-
        edgecore/agr-fan@1 grille - the library's one vent-cavity figure, described in that
        contract by appearance and not by depth
    - node: status
      dome: 0.3
      confidence: estimated
      source: >-
        common/led-dot@1 - the library's one panel-lamp figure. Its own provenance is 'size:
        estimated' and the dome carries none
skins: [default]
