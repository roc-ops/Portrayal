<svg xmlns="http://www.w3.org/2000/svg" width="9.0mm" height="16.0mm" viewBox="0 0 9.0 16.0">
  <!-- The cable connector of the NXA-PDC-930W seen from the wire side, seated: the body at the connector's outline, the clip tab on
       its left side, and one wire entering each of the three ways, "- DC", "+ DC" and the earth from the top down. -->
  <rect id="tab" x="0" y="6.0" width="2.0" height="4.0" rx="0.4" fill="#3b3f44"/>
  <rect id="body" x="1.6" y="0" width="7.4" height="16.0" rx="0.5" fill="#2a2d31" stroke="#15171a" stroke-width="0.2"/>
  <circle id="wire-1" cx="5.3" cy="3.4" r="1.3" fill="#c8262c" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-1-color"/>
  <circle id="wire-2" cx="5.3" cy="8.0" r="1.3" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-2-color"/>
  <circle id="wire-3" cx="5.3" cy="12.6" r="1.3" fill="#3a9a4a" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-3-color"/>
</svg>
