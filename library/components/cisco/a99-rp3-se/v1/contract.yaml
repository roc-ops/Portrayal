format: 1
kind: module
name: a99-rp3-se
version: 1.0.0
class: supervisor
profile: networking
description: >-
  Cisco ASR 9900 Series Route Processor 3, Service Edge optimised, for the ASR 9912 and
  ASR 9922. Ten RJ-45 jacks - two SYNC timing ports configurable as BITS, J.211 or DTI,
  an IEEE 1588 timestamp port, two inter-chassis sync ports of which ICS1 doubles as the
  RS232/422 GPS time-of-day input, two management LAN ports, a CMP port, a console and
  an auxiliary port - plus 10 MHz and 1 PPS SMB clock inputs, a nine-pin alarm output, a
  USB 2.0 type A port, nine discrete status lamps, a four-character LED dot-matrix
  display and a LAMP TEST push button.
size: {w: 41.4, h: 428.2, d: 626.6}
attrs:
  model: 'A99-RP3-SE'
  role: 'route-processor'
  mgmt: '2 x 10/100/1000 RJ-45'
  console: 'EIA/TIA-232 RJ-45'
  timing: '2 x SYNC (BITS/J.211/DTI) RJ-45, IEEE 1588 RJ-45, 2 x inter-chassis sync RJ-45, 10 MHz and 1 PPS SMB'
  alarm: 'DB9, three dry-contact outputs'
  usb: '1 x USB 2.0 type A'
  power-draw-max-w: 285
  eol: 'none-announced'
  weight-kg: 8.89
provenance:
  one-drawing: >-
    READ THIS BEFORE TRUSTING A FEATURE POSITION TO THE MILLIMETRE. Nine RSP and RP
    masters in this stencil are ONE DRAWING: extracted jack, SMB, USB, DB9, LED-matrix
    and lamp coordinates agree to 0.00 mm across a9k-rsp5-se and -tr, a9k-rsp880-se and
    -tr, a9k-rsp880-lt-se and -tr, a99-rp3-se and -tr, and a99-rsp-se. The DATASHEETS do
    not agree: these cards are 402.8, 428.5, 428.2 and 403.4 mm wide and 41.0 to 46.0 mm
    high. So the drawing is generic across the family and cannot be all four sizes. Each
    card here is scaled to its OWN stated envelope - long axis to its width, short axis
    to its height, two factors, exactly as the line cards were - which makes the OUTLINE
    right for every one and makes the interior positions proportional rather than
    measured. A jack centre is therefore good to a few millimetres, not to a tenth, and
    anyone needing better needs a mechanical drawing Cisco has not published.
  size: >-
    datasheet - Cisco ASR 9900 Series Route Processor 3 Data Sheet, 'Physical
    specifications (includes ejector bracket/lever)': Height 1.63 in. (4.14 cm), Width
    16.86 in. (42.82 cm), Depth 24.67 in. (62.66 cm), Weight 19.59 lb (8.89 kg). Cisco
    prints 1.63 in as 4.14 cm here and as 4.10 cm on the RSP5 sheet; the millimetre
    figure each sheet gives is what is carried.
  ports: >-
    install guide - the Overview and Reference Guide's per-card 'Front Panel and Access
    Ports' section, corroborated feature by feature by the artwork. For the RSP5: 'Two
    RJ-45 Sync timing ports with Link and Fault LEDs built into the RJ-45. IEEE1588
    RJ-45 Timestamp port. Two Inter-Chassis Sync ports - nVSync1 is shared with
    RS232/422 GPS TOD RJ-45 port. RS232/422 GPS TOD RJ-45 port for system timing input.
    10 MHz and 1 PPS clock input SMB ports. Alarm Output DB9 port with three alarm
    outputs. External USB2, class-A port. Two dual-speed 100/1000 Mbit Ethernet
    Management ports. One Connectivity Management Processor (CMP) port. Two EIA/TIA-232
    RJ232 serial RJ-45 ports - one each for Console and Auxiliary modem ports.' That is
    ten RJ-45s, and the master draws ten.
  jack-orientation: >-
    the ICS and MGT LAN jacks are STACKED PAIRS in one bezel, not two singles side by
    side, and the pair MIRRORS: read at high zoom the upper jack's keyway points up and
    the lower one's points down, so both release tabs stay reachable. The upper of each
    pair is therefore placed at rotate 270 and everything else at 90. This is the
    failure that was caught by eye on the AGR400's RJ-45s and would have linted clean
    here too. Which jack is 0: the artwork prints '0' beside the upper of each pair and
    '1' beside the lower, and ICS0 sits above ICS1/TOD under the GPS bracket.
  cages: >-
    composed from std/, never drawn. The RJ-45s go in as std/rj45-ganged (12.7 x 11.0)
    rather than std/rj45 (16.0 x 14.0): the IEC 60603-7 single-port cutout is the wrong
    part for a stacked pair whose ports share walls, and 16.0 will not fit twice across
    a 41 mm card. The drawn jack measures 10.83 x 12.81, which rotated is 12.81 x 10.83
    against the ganged registry's 12.7 x 11.0 - agreement to one percent, which is the
    check. Timing coax is std/smb, sourced from the same 10-32 UNF figure the registry
    carries; the USB is std/usb-a.
  alarm-out: >-
    install guide - 'Each RSP/RP card drives a set of three alarm output contacts. Alarm
    circuitry on the RSP/RP activates dry contact closures that are accessible through
    the nine-pin Alarm Out connector on the RSP/RP front panel... Both normally-open and
    normally-closed contacts are available. Only the active RSP/RP drives the alarm
    outputs.'
  db9: >-
    the ALARM OUT connector is DRAWN, not composed, and it is deliberately NOT declared
    `class: cutout`. There is no std/ part for a D-subminiature DE-9 and no `db9` key in
    spec/schemas/standards.yaml, and no document in this intake dimensions the panel
    opening - the guides say 'Alarm Output DB9 port with three alarm outputs' and 'the
    nine-pin Alarm Out connector' and give no geometry. Declaring a cutout that conforms
    to nothing would put a false entry in the aperture census L26 keeps, and inventing a
    MIL-DTL-24308 figure from memory would be worse. It is `class: connector` and this
    sentence is the record of the missing registry key.
  lamps: >-
    install guide - Table 4, 'RSP, RSP-440, RSP-440 Lite, RSP-880, RSP880-LT, RSP4-S,
    RSP5 Discrete LED Display Definitions', and Table 5 for the RP, transcribed per lamp
    with Cisco's own sentence kept beside the state tokens. WHICH lamp is where was read
    off the artwork at high zoom, not guessed: three columns of three, SSD/CRIT/FAIL, FC
    FAULT/MAJ/ACO and GPS/MIN/SYNC, and the same nine names appear on the rsp5, rsp880,
    rsp880-lt, rp3 and a99-rsp masters. FC FAULT is in none of Cisco's tables - see its
    own description.
  buttons: >-
    install guide - 'Alarm Cut Off (ACO) and Lamp Test momentary push buttons', and on
    the RSP5 the guide adds that they 'can be used to eject the RSP5 card'. Both are
    drawn on the master as stroked circles with their legends beside them. Worth
    recording how nearly they were missed: the first extraction pass reported one
    button, because a circle is a curve and the outline reader skips curves - the second
    was found by looking at the artwork at 8 px/mm rather than by trusting the count.
  power: >-
    install guide - Table 23, row 'RP3 Card': 260 W at 27 C, 275 W at 40 C, 285 W at 55
    C. max is the highest rated ambient. Table 23 names the CARD, not the part number:
    its rows are 'RSP5 Card', 'RSP-880 Card', 'RP3 Card' and so on, with no -SE/-TR
    distinction anywhere in the table. So the figure below is carried on both variants
    of a card, which is transcription of Cisco's own scope rather than an inference
    across it. Contrast Table 35 for the line cards, which DOES split by variant and
    where the 16-port -TR and -SE differ by two thirds - that is why the scope of each
    table is worth stating.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
elements:
  alarm-out:
    at: [9.8, 193.93]
    size: [10.67, 35.62]
    class: connector
  led-matrix:
    at: [14.37, 376.59]
    size: [17.48, 8.22]
    class: display
    description: >-
      the four-character 5x7 LED dot-matrix display. The Overview and Reference Guide
      devotes two sections to what it shows - 'LED Matrix Boot Stage and Runtime Display'
      and 'LED Matrix CAN Bus Controller Error Display' - which is a message vocabulary
      rather than a lamp state list, so it is modelled as a display and not as an
      indicator with states.
  aco:
    at: [9.35, 328.97]
    size: [3.57, 3.9]
    class: button
    description: >-
      the Alarm Cut Off momentary push button. Pressing it after an alarm lights the ACO
      lamp: 'Alarm Cutoff has been enabled. The ACO push button was pressed after at least
      one alarm has occurred.'
  lamp-test:
    at: [9.35, 339.37]
    size: [3.57, 3.9]
    class: button
    description: >-
      the LAMP TEST momentary push button. On the RSP5 the guide adds that these two
      buttons 'can be used to eject the RSP5 card', which is why they are modelled as
      buttons and not as decoration.
  ssd:
    at: [20.63, 352.22]
    size: [2.11, 2.11]
    class: led
    description: >-
      Internal Solid State Hard Disk Drive (SSD). Green: SSD0 is busy/active, driven by
      the SSD controller. Off (default after reset): not busy/active.
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  fc-fault:
    at: [20.63, 360.64]
    size: [2.11, 2.11]
    class: led
    description: >-
      FC Fault. Table 5, 'RP and RP2/RP3 Discrete LED Display Definitions' - amber: 'A
      fault has occurred on any or all of the FC cards installed. This LED will be on
      during the boot phase of the FC.' Off (default after reset): 'FC cards are booted up
      and ready.' A real vocabulary, from this card's own table.
    states:
    - {name: amber, color: '#f5a623'}
    - 'off'
  gps:
    at: [20.63, 369.06]
    size: [2.11, 2.11]
    class: led
    description: >-
      GPS. Green: 'GPS interface provisioned and ports are turned on. ToD, 1 PPS, 10 Mhz
      are all valid.' Off (default after reset): either the interface is not provisioned
      or the ports are not turned on.
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  crit:
    at: [16.25, 352.22]
    size: [2.11, 2.11]
    class: led
    description: >-
      Critical Alarm (CRIT). Red: a critical alarm has occurred. Off (default after
      reset): no critical alarm has occurred.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  maj:
    at: [16.25, 360.64]
    size: [2.11, 2.11]
    class: led
    description: >-
      Major Alarm (MAJ). Red: a major alarm has occurred. Off (default after reset): no
      major alarm has occurred.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  min:
    at: [16.25, 369.06]
    size: [2.11, 2.11]
    class: led
    description: >-
      Minor Alarm (MIN). Amber: a minor alarm has occurred. Off (default after reset): no
      minor alarm has occurred.
    states:
    - {name: amber, color: '#f5a623'}
    - 'off'
  fail:
    at: [11.49, 352.22]
    size: [2.11, 2.11]
    class: led
    description: >-
      Power Fail (FAIL). Red: 'Standby Power Fail LED. The LED is turned off by the CAN
      bus controller after it is up and running.' Off: standby power is normal.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  aco:
    at: [11.49, 360.64]
    size: [2.11, 2.11]
    class: led
    description: >-
      Alarm Cutoff (ACO). Amber: 'Alarm Cutoff has been enabled. The ACO push button was
      pressed after at least one alarm has occurred.' Off (default after reset): alarm
      cutoff is not enabled.
    states:
    - {name: amber, color: '#f5a623'}
    - 'off'
  sync:
    at: [11.49, 369.06]
    size: [2.11, 2.11]
    class: led
    description: >-
      Synchronization (SYNC). Table 5, 'RP and RP2/RP3 Discrete LED Display Definitions' -
      this card's own table, not the RSP family's Table 4, and the two differ here. Green:
      'System timing is synchronized to an external timing source INCLUDING IEEE 1588' -
      Table 4 omits the 1588 clause. Amber: system timing is free running. Off (default
      after reset): Cisco writes 'LED never turns off', which contradicts listing Off as a
      colour at all; off is kept as a declared state because the drawing needs an unlit
      appearance, and Cisco's sentence is recorded here rather than tidied away. Table 4
      says 'No system timing is configured' for the same row, which is the RSP family's
      answer and is not this card's.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
