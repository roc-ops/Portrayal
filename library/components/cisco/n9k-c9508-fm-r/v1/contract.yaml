format: 1
kind: module
name: n9k-c9508-fm-r
version: 1.0.0
class: fabric
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9508 fabric module for the -R series line cards (N9K-C9508-FM-R). A vertical module with a
  vented face, ejector levers, a BCN lamp and a status lamp; it sits in the rear of the chassis behind a fan
  tray and pairs with the N9K-C9508-FAN tray. The -R line cards need the Supervisor B or B+. Empty fabric
  slots take the N9K-C9508-FM-Z (or -FM-CV) blank.
size: {w: 62.48, h: 416.56, d: 297.18}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
attrs:
  model: 'N9K-C9508-FM-R'
  role: 'fabric-module'
  power-draw-typical-w: 240
  power-draw-max-w: 250
  hot-swappable: true
  eol: 'unknown'
provenance:
  size: >-
    datasheet - Cisco N9508 NX-OS Mode Switch Hardware Installation Guide, Appendix A "Switch Dimensions"
    (printed p113, PDF p119), "Fabric modules": 2.46 in (6.25 cm) wide, 11.7 in (29.72 cm) deep, 16.4 in
    (41.66 cm) high. One row serves every fabric type.
  power: >-
    datasheet - "Planning for Power Requirements" table (printed p12, PDF p18), the row "Line cards that are
    supported by N9K-C9508-FM-R fabric modules": 240 W typical, 250 W maximum, read as the module's own draw.
  compatibility: >-
    install guide - "Overview" Table 1: N9K-C9508-FM-R with N9K-C9508-FAN and N9K-C9508-FM-Z. Table 2: six
    (or five plus one for redundancy) fabric modules for the N9K-X9636C-RX and X9636C-R, five plus one for the
    N9K-X9636Q-R.
  lamps: >-
    install guide - "Fabric Module LEDs": a BCN lamp (blue) and a status lamp. Positions estimated.
  skin: >-
    estimated - a vented face and two ejector levers, read from the rear figure of the overview (PDF p12);
    no figure dimensions them.
  lifecycle: >-
    unknown - Cisco's support page gives no sale status for this part number.
elements:
  bcn:
    at: [10.0, 386.0]
    size: [3.0, 3.0]
    class: led
    description: BCN lamp. The BCN lamp on the fan tray that covers the module also lights.
    states:
    - {name: blue, color: '#2a7de1'}
    - 'off'
  status:
    at: [48.0, 386.0]
    size: [3.0, 3.0]
    class: led
    description: Status lamp.
    states:
    - {name: green, color: '#39b54a'}
    - {name: flashing-green, color: '#39b54a', behavior: blinking}
    - {name: flashing-yellow, color: '#f5c518', behavior: blinking}
    - {name: flashing-red, color: '#d0021b', behavior: blinking}
    - {name: flashing-amber, color: '#f5a623', behavior: blinking}
    - 'off'
skins: [default]
