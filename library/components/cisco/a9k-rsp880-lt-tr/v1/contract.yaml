format: 1
kind: module
name: a9k-rsp880-lt-tr
version: 1.3.0
class: supervisor
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9000 Route Switch Processor 880-LT, Packet Transport optimised - four cores
  at 2.4 GHz and two 128 GB SSDs, against the RSP-880's eight cores and two 32 GB SSDs.
  Ten RJ-45 jacks - two SYNC timing ports configurable as BITS, J.211 or DTI, an IEEE
  1588 timestamp port, two inter-chassis sync ports of which ICS1 doubles as the
  RS232/422 GPS time-of-day input, two management LAN ports, a CMP port, a console and
  an auxiliary port - plus 10 MHz and 1 PPS SMB clock inputs, a nine-pin alarm output, a
  USB 2.0 type A port, nine discrete status lamps, a four-character LED dot-matrix
  display and a LAMP TEST push button.
size: {w: 46.0, h: 428.5, d: 628.9}
attrs:
  model: 'A9K-RSP880-LT-TR'
  role: 'route-switch-processor'
  mgmt: '2 x 10/100/1000 RJ-45'
  console: 'EIA/TIA-232 RJ-45'
  timing: '2 x SYNC (BITS/J.211/DTI) RJ-45, IEEE 1588 RJ-45, 2 x inter-chassis sync RJ-45, 10 MHz and 1 PPS SMB'
  alarm: 'DB9, three dry-contact outputs'
  usb: '1 x USB 2.0 type A'
  power-draw-max-w: 315
  eol: 'none-announced'
  weight-kg: 8.07
provenance:
  usb-orientation: >-
    CORRECTED at 1.1.0 - the USB-A carried `rotate: 90`, which stands a 12.0 x
    4.5 receptacle on end as 4.5 x 12.0 and makes it 1.60 mm taller than the
    21.19 x 10.40 `usb-bezel` it sits in. The placement's own anchor is what
    refutes the rotation: `at` is a top-left, so centred against that bezel the
    UNROTATED part lands on its centre to 0.005 mm where the rotated one is
    7.49 mm out. The coordinate was computed for a horizontal port and the
    rotation was applied over the top of it. No photograph was needed and none
    was used - the two numbers already in the file disagree, and only one of
    them can be right.
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 9 panel lamps at dome 0.3 (one number, carried by
    120 Cisco contracts); 4 ejector brackets, their levers and the grip flanges at out 4.2
    (one number, carried by 61 Cisco contracts); 2 captive screw heads at cyl 1.6 (one
    number, carried by 63 Cisco contracts); 2 pushbuttons at cyl 1.2 (one number, carried by
    15 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE
    READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind of
    interpolated anyway... It's just to give it a realistic view instead of just being a
    flat 2d... All of the 3d stuff is going to be mostly conjecture unless the vendor
    provides that data.' So a proudness here is an interpolation for a realistic view, NOT a
    claim about the hardware, and the confidence token on every feature says so rather than
    leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE
    DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED
    figure reused for the same class of hardware, and these origins are not measured - they
    are the library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size. STILL REFUSED ON THIS FACE, and these
    are NOT the same kind of gap: the 1 drawn aperture(s) alarm-out - an optical or
    connector aperture that conforms to no published standard, so no depth exists to
    interpolate from; led-matrix - an alphanumeric display whose glass may be flush or
    recessed and no figure says; usb-bezel - each would need an EIGHTH family number for one
    or two nodes, which buys a little realism at the cost of another invented figure; left
    flat deliberately. The ruling sanctions interpolating a PROUDNESS for a realistic view.
    It does not sanction inventing an APERTURE, which is a dimension a specification is
    withholding rather than one nobody has measured.
  one-drawing: >-
    READ THIS BEFORE TRUSTING A FEATURE POSITION TO THE MILLIMETRE. Nine RSP and RP
    masters in this stencil are ONE DRAWING: extracted jack, SMB, USB, DB9, LED-matrix
    and lamp coordinates agree to 0.00 mm across a9k-rsp5-se and -tr, a9k-rsp880-se and
    -tr, a9k-rsp880-lt-se and -tr, a99-rp3-se and -tr, and a99-rsp-se. The DATASHEETS do
    not agree: these cards are 402.8, 428.5, 428.2 and 403.4 mm wide and 41.0 to 46.0 mm
    high. So the drawing is generic across the family and cannot be all four sizes. Each
    card here is scaled to its OWN stated envelope - long axis to its width, short axis
    to its height, two factors, exactly as the line cards were - which makes the OUTLINE
    right for every one and makes the interior positions proportional rather than
    measured. A jack centre is therefore good to a few millimetres, not to a tenth, and
    anyone needing better needs a mechanical drawing Cisco has not published.
  size: >-
    REFUTED BY MEASUREMENT AND NOT YET CORRECTED - read this before trusting 428.5. A
    physical A9K-RSP880 pulled from the ASR 9904 in the lab was photographed against a
    rule laid along its faceplate. The card ends in the FIFTEEN-inch band, about 15 1/2
    in, with the 16-inch mark falling clear past the end of it. 428.5 mm is 16 14/16 in,
    excluded by more than a whole inch, which is far outside the error in reading a
    photograph - only the whole inch was read, because that is all that was needed.
    THREE LINES OF EVIDENCE AGREE and they were independent before the tape. (1) The ASR
    9904's own cage reserves 395.7 mm for this card, and that reservation is the card
    INCLUDING its ejector brackets - Cisco's fourth-generation envelope, their own
    figure, and 15 9/16 in, agreeing with the photograph to about 2 mm. (2) The
    neighbour constraint recorded on three chassis excludes a 428 mm card outright: the
    ASR 9010 has 399.96 mm of clear vertical space between the cable tray and the card
    guide bar, the ASR 9910 421.79, the ASR 9922 420.30, and a card cannot be installed
    where something else already is. (3) The card measured.
    WHY THE NUMBER BELOW STILL SAYS 428.5. Correcting it is not an edit to one field.
    This part's skin is drawn to a 428.5 envelope and lint L4 ties a viewBox to its
    contract size, so the artwork has to come with it - and rescaling it mechanically
    would be inventing geometry. A y-only scale turns 24 round LEDs into ellipses; a
    uniform scale shrinks features that did not shrink, because a card being 8 percent
    shorter than modelled does not make its lamps smaller. Which of the two is right is
    a question about the source figure the art was derived from, not about arithmetic.
    The correction is therefore a re-derivation of the faceplate, tracked in ndv#16.
    NOR IS IT SETTLED WHICH FIGURE REPLACES IT. The 9006 and 9904 reserve 395.7, the
    9906 and 9910 403.4, the 9010 406.4 - an 11 mm spread, under half an inch, inside
    the photograph's precision. 395.7 is the leading candidate: smallest, Cisco's own
    ejector-inclusive envelope rather than a reconciliation, and the chassis the
    measured card came out of.
    THE OTHER AXIS IS UNTOUCHED BY THIS. The same data sheet gives Height 1.81 in (46.0
    mm), and 46.0 still exceeds every pitch that holds this card - 41.4 on the 9006 and
    9904, 42.67 on the 9906 and 9910. A photograph does not measure thickness.
    THE REFUTED SOURCE, kept because a source that turned out wrong is still evidence:
    datasheet - Cisco ASR 9000 Route Switch Processor 880 Data Sheet, 'Physical
    specifications': Height 1.81 in. (4.60 cm), Width 16.87 in. (42.85 cm), Depth 24.74
    in. (62.89 cm), Weight 17.8 lb (8.07 kg). That data sheet covers all four part
    numbers - A9K-RSP880-SE, -TR, A9K-RSP880-LT-SE and -LT-TR - with ONE physical block,
    so the LT variants take the same envelope from Cisco's own scoping rather than by
    inference. Note this card is 46.0 mm high where the RSP5 is 41.0: it is a thicker
    card, and a bay sized for one is not sized for the other.
  ports: >-
    install guide - the Overview and Reference Guide's per-card 'Front Panel and Access
    Ports' section, corroborated feature by feature by the artwork. For the RSP5: 'Two
    RJ-45 Sync timing ports with Link and Fault LEDs built into the RJ-45. IEEE1588
    RJ-45 Timestamp port. Two Inter-Chassis Sync ports - nVSync1 is shared with
    RS232/422 GPS TOD RJ-45 port. RS232/422 GPS TOD RJ-45 port for system timing input.
    10 MHz and 1 PPS clock input SMB ports. Alarm Output DB9 port with three alarm
    outputs. External USB2, class-A port. Two dual-speed 100/1000 Mbit Ethernet
    Management ports. One Connectivity Management Processor (CMP) port. Two EIA/TIA-232
    RJ232 serial RJ-45 ports - one each for Console and Auxiliary modem ports.' That is
    ten RJ-45s, and the master draws ten.
  jack-orientation: >-
    the ICS and MGT LAN jacks are STACKED PAIRS in one bezel, not two singles side by
    side, and the pair MIRRORS: read at high zoom the upper jack's keyway points up and
    the lower one's points down, so both release tabs stay reachable. The upper of each
    pair is therefore placed at rotate 270 and everything else at 90. This is the
    failure that was caught by eye on the AGR400's RJ-45s and would have linted clean
    here too. Which jack is 0: the artwork prints '0' beside the upper of each pair and
    '1' beside the lower, and ICS0 sits above ICS1/TOD under the GPS bracket.
  cages: >-
    composed from std/, never drawn. The RJ-45s go in as std/rj45-ganged (12.7 x 11.0)
    rather than std/rj45 (16.0 x 14.0): the IEC 60603-7 single-port cutout is the wrong
    part for a stacked pair whose ports share walls, and 16.0 will not fit twice across
    a 41 mm card. The drawn jack measures 10.83 x 12.81, which rotated is 12.81 x 10.83
    against the ganged registry's 12.7 x 11.0 - agreement to one percent, which is the
    check. Timing coax is std/smb, sourced from the same 10-32 UNF figure the registry
    carries; the USB is std/usb-a.
  alarm-out: >-
    install guide - 'Each RSP/RP card drives a set of three alarm output contacts. Alarm
    circuitry on the RSP/RP activates dry contact closures that are accessible through
    the nine-pin Alarm Out connector on the RSP/RP front panel... Both normally-open and
    normally-closed contacts are available. Only the active RSP/RP drives the alarm
    outputs.'
  db9: >-
    CLOSED. The ALARM OUT is composed from common/db9-receptacle@1, which frames
    std/db9@1 and its sourced size E aperture, so this card no longer draws a
    connector nobody had dimensioned. What closed it: TE application
    specification 114-40010 Rev G Figure 3 for the panel cutout - 20.47 x 11.40
    with 10 degrees of taper a side and a 3.35 radius in four places - and
    customer drawing C-747905 Rev AB1 for the flange, shell and the 24.99
    mounting centres the standoffs sit on. Both are now carried by the `db9` key
    in spec/schemas/standards.yaml.
    WHAT THE DRAWN ONE HAD BEEN: 11.86 x 35.65, which is not any DE-9. The
    master this family traces is scaled to each card's envelope by two separate
    factors, so the connector came out stretched along the card's long axis and
    differently on every card - 18.46 to 35.65 mm long across the fifteen for a
    part that is one size in reality. The centre was kept; only the size moved.
  lamps: >-
    install guide - Table 4, 'RSP, RSP-440, RSP-440 Lite, RSP-880, RSP880-LT, RSP4-S,
    RSP5 Discrete LED Display Definitions', and Table 5 for the RP, transcribed per lamp
    with Cisco's own sentence kept beside the state tokens. WHICH lamp is where was read
    off the artwork at high zoom, not guessed: three columns of three, SSD/CRIT/FAIL, FC
    FAULT/MAJ/ACO and GPS/MIN/SYNC, and the same nine names appear on the rsp5, rsp880,
    rsp880-lt, rp3 and a99-rsp masters. FC FAULT is in none of Cisco's tables - see its
    own description.
  buttons: >-
    install guide - 'Alarm Cut Off (ACO) and Lamp Test momentary push buttons', and on
    the RSP5 the guide adds that they 'can be used to eject the RSP5 card'. Both are
    drawn on the master as stroked circles with their legends beside them. Worth
    recording how nearly they were missed: the first extraction pass reported one
    button, because a circle is a curve and the outline reader skips curves - the second
    was found by looking at the artwork at 8 px/mm rather than by trusting the count.
  power: >-
    install guide - Table 23, row 'RSP880-LT Card': 285 W at 27 C, 295 W at 40 C, 315 W
    at 55 C. max is the highest rated ambient. This is a separate row from the RSP-880's
    425/430/450, which is the difference between four cores at 2.4 GHz and eight at 1.9.
    Table 23 names the CARD, not the part number: its rows are 'RSP5 Card', 'RSP-880
    Card', 'RP3 Card' and so on, with no -SE/-TR distinction anywhere in the table. So
    the figure below is carried on both variants of a card, which is transcription of
    Cisco's own scope rather than an inference across it. Contrast Table 35 for the line
    cards, which DOES split by variant and where the 16-port -TR and -SE differ by two
    thirds - that is why the scope of each table is worth stating.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
elements:
  led-matrix:
    at: [15.96, 376.86]
    size: [19.43, 8.23]
    class: display
    description: >-
      the four-character 5x7 LED dot-matrix display. The Overview and Reference Guide
      devotes two sections to what it shows - 'LED Matrix Boot Stage and Runtime Display'
      and 'LED Matrix CAN Bus Controller Error Display' - which is a message vocabulary
      rather than a lamp state list, so it is modelled as a display and not as an
      indicator with states.
  aco-button:
    at: [10.39, 329.2]
    size: [3.97, 3.9]
    class: button
    description: >-
      the Alarm Cut Off momentary push button. Pressing it after an alarm lights the ACO
      lamp: 'Alarm Cutoff has been enabled. The ACO push button was pressed after at least
      one alarm has occurred.'
  lamp-test:
    at: [10.39, 339.61]
    size: [3.97, 3.9]
    class: button
    description: >-
      the LAMP TEST momentary push button. On the RSP5 the guide adds that these two
      buttons 'can be used to eject the RSP5 card', which is why they are modelled as
      buttons and not as decoration.
  ssd:
    at: [22.92, 352.47]
    size: [2.11, 2.11]
    class: led
    description: >-
      Internal Solid State Hard Disk Drive (SSD). Green: SSD0 is busy/active, driven by
      the SSD controller. Off (default after reset): not busy/active.
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  fc-fault:
    at: [22.92, 360.9]
    size: [2.11, 2.11]
    class: led
    description: >-
      FC FAULT, printed on the faceplate between SSD and GPS. THIS CARD'S OWN TABLE HAS NO
      ROW FOR IT. Table 4 of the Overview and Reference Guide - headed 'RSP, RSP-440,
      RSP-440 Lite, RSP-880, RSP880-LT, RSP4-S, RSP5', which is this card - describes
      FAIL, CRIT, MAJ, MIN, SYNC, ACO, HDD, CF, SSD, GPS and the three USB lamps, and
      stops. TABLE 5 DOES HAVE AN FC FAULT ROW, at amber and off with Cisco's own
      sentence, but Table 5 is headed 'RP and RP2/RP3' and is a different scope - the same
      book gives the RSP and RP families different vocabularies for SYNC in those two
      tables, so they cannot be treated as one. The amber is therefore NOT borrowed across
      and this lamp carries off/on. An earlier version of this sentence said no row
      existed in either table, which was simply wrong about Table 5.
    states:
    - 'off'
    - 'on'
  gps:
    at: [22.92, 369.32]
    size: [2.11, 2.11]
    class: led
    description: >-
      GPS. Green: 'GPS interface provisioned and ports are turned on. ToD, 1 PPS, 10 Mhz
      are all valid.' Off (default after reset): either the interface is not provisioned
      or the ports are not turned on.
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  crit:
    at: [18.06, 352.47]
    size: [2.11, 2.11]
    class: led
    description: >-
      Critical Alarm (CRIT). Red: a critical alarm has occurred. Off (default after
      reset): no critical alarm has occurred.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  maj:
    at: [18.06, 360.9]
    size: [2.11, 2.11]
    class: led
    description: >-
      Major Alarm (MAJ). Red: a major alarm has occurred. Off (default after reset): no
      major alarm has occurred.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  min:
    at: [18.06, 369.32]
    size: [2.11, 2.11]
    class: led
    description: >-
      Minor Alarm (MIN). Amber: a minor alarm has occurred. Off (default after reset): no
      minor alarm has occurred.
    states:
    - {name: amber, color: '#f5a623'}
    - 'off'
  fail:
    at: [12.76, 352.47]
    size: [2.11, 2.11]
    class: led
    description: >-
      Power Fail (FAIL). Red: 'Standby Power Fail LED. The LED is turned off by the CAN
      bus controller after it is up and running.' Off: standby power is normal.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  aco:
    at: [12.76, 360.9]
    size: [2.11, 2.11]
    class: led
    description: >-
      Alarm Cutoff (ACO). Amber: 'Alarm Cutoff has been enabled. The ACO push button was
      pressed after at least one alarm has occurred.' Off (default after reset): alarm
      cutoff is not enabled.
    states:
    - {name: amber, color: '#f5a623'}
    - 'off'
  sync:
    at: [12.76, 369.32]
    size: [2.11, 2.11]
    class: led
    description: >-
      Synchronization (SYNC). Green: system timing is synchronized to an external timing
      source. Amber: system timing is free running. Off: no system timing is configured.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
