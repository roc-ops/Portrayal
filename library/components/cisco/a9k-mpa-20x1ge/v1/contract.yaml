format: 1
kind: module
name: a9k-mpa-20x1ge
version: 1.0.0
class: line-card
profile: networking
description: >-
  Cisco 20-Port Gigabit Ethernet Modular Port Adapter. Twenty SFP cages in two columns
  of ten - even-numbered ports in one column, odd in the other - with a STATUS lamp and
  a captive screw at each end. One of the four MPAs the ASR 9001 takes; it also seats in
  the A9K-MOD carrier line cards.
size: {w: 34.54, h: 161.8, d: 170.18}
attrs:
  model: 'A9K-MPA-20X1GE'
  role: 'modular-port-adapter'
  sfp: 20
  media: 'SFP, 1 Gigabit Ethernet'
  eol: 'none-announced'
  weight-kg: 0.96
provenance:
  size: >-
    datasheet - Cisco ASR 9000 Series data sheet c78-735809, Table 3, 'Physical
    dimensions', which lists EVERY MPA by part number and gives them all the same three
    figures: '6.37 W x 1.36 H x 6.70 L', and a second line '6.37 W x 1.36 H x 8.30 L
    (including jackscrew)'. In millimetres, 161.80 long by 34.54 thick by 170.18 deep,
    or 210.82 deep with the jackscrew, which protrudes and is not part of the body. AN
    EARLIER VERSION OF THIS COMPONENT SAID 'NO document in the intake gives an MPA's
    dimensions' and used index.json's shapesheet instead, 33.81 x 160.02 (33.66 for the
    two 20-port masters). That claim was false. The shapesheet was a good proxy - 1.1
    percent short on the length and 2.1 to 2.6 on the thickness - and every measured
    coordinate on this faceplate is now scaled by the ratio of the two, which is exactly
    equivalent to having read the master at the stated anchor to begin with. THE
    CORROBORATION IS WORTH KEEPING: the A9K-MOD400-SE master draws its two MPA bays as
    outlines and, at that carrier's own 43.7 x 395.7 anchor, they measure 161.21 and
    160.94 mm long - 0.4 percent from Cisco's stated 161.80. Two Cisco documents, a
    drawing and a table, agreeing through a third part.
  frame: >-
    modelled PORTRAIT - x across the module's 33.8 mm thickness, y along its 160.0 mm
    length - which is how most of these masters are drawn and how every other card in
    this library is modelled. The ASR 9001 lays its two MPAs FLAT, so its bays rotate
    the component rather than the component carrying two orientations. Note the stencil
    is not consistent about this: A9K-MPA-1X40GE, -2X40GE and -8x10GE are drawn
    landscape and the rest portrait, for one physical form factor - which the intake
    notes flag as a reason to read the artwork rather than assume an orientation from
    index.json's axis order.
  inset: >-
    READ THIS BEFORE RESCALING ANYTHING ON THIS MASTER, AND READ THE CORRECTION AT THE
    END. Its art measures 29.07 mm across where the shapesheet says 33.66, a 16 percent
    difference - far larger than the sub-millimetre gaps elsewhere in this stencil. The
    art is modelled as NOT stretched to fill the envelope: the plate is drawn INSET in
    its shape box and centred, and the cages keep the art's own scale. THE ARITHMETIC
    THIS CONCLUSION WAS FIRST ARGUED FROM WAS WRONG. It said 'stretching x by 1.158
    would have made the cage 16.7 mm wide, which no SFP cage is' - but 16.7 is 14.4 x
    1.158, and 14.4 is the cage's ALONG-CARD dimension, which a stretch of the across
    axis does not touch. Done correctly the comparison is much closer: the drawn cage is
    9.24 mm across, so inset it reads 9.24 against SFF-8433's 10.40 opening height (11
    percent under) and stretched to Cisco's stated 34.54 it reads 10.98 (5.6 percent
    over). Neither is absurd and the standard-part ruler does not settle it. THE
    QUESTION IS THEREFORE OPEN and is recorded as open rather than quietly kept or
    quietly flipped. What is NOT in doubt: the ENVELOPE, which Cisco states outright at
    34.54 x 161.80, and the along-card scale, which the A9K-MOD400 bay measurement
    corroborates to 0.4 percent. What is in doubt is only where the twenty cages sit
    across a 34.54 mm face, by at most 2.7 mm. A photograph, or any drawing of this MPA
    that is not this master, would settle it. NOTE FOR THE METROLOGY RULE: the counter-
    case clause this card was originally used to justify - that where the art contains a
    standard part of known size, that part is the authority for the internal scale - is
    unaffected and was independently confirmed tonight on the A9K-MOD200, where the
    ruler gave 1.2 percent against 6.4 and settled the question outright. Only this
    card's particular arithmetic was wrong, not the rule drawn from it.
  ports: >-
    drawing - twenty cages in two columns at x 4.35 and 19.29 and ten rows on a 14.4 to
    14.67 mm pitch with a gap in the middle where the captive screws sit. Numbering is
    read off the four numerals the master leaves as text rather than as outlined glyphs:
    '0' and '1' at the top of the two columns, '18' and '19' at the bottom. So even
    ports run down the left column and odd down the right, 0 to 19. ONLY THOSE FOUR ARE
    PRINTED, and only those four are drawn here: an earlier version put a numeral beside
    all twenty, which is eighteen legends the real faceplate does not carry and which
    needed a 1.9 mm edge strip to hold them. The other sixteen ports are identified by
    their ids. The ASR 9001 data sheet names the family '20 x 1 Gigabit Ethernet, 2 x 10
    Gigabit Ethernet, 4 x 10 Gigabit Ethernet, and 1 x 40 Gigabit Ethernet', which is
    the port count confirmed from the other side.
  cages: >-
    composed from std/sfp-ganged, whose SFF-8433 aperture is 14.25 x 10.40 against the
    14.4 x 9.24 drawn. The ganged part rather than std/sfp because these ports share
    walls in two continuous columns - std/sfp is 14.5 wide and explicitly cannot gang.
  power: >-
    NOT STATED. Table 35 of the Ethernet Line Card Installation Guide gives per-card
    power for the modular-chassis line cards including the A9K-MOD carriers, but nothing
    for the MPAs that go inside them, and the ASR 9001 data sheet gives a chassis figure
    only (425 W typical, 525 W maximum). So an MPA's own draw is unpublished and the L27
    warning stands.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
  weight: >-
    datasheet - c78-735809 Table 3, same row: 34 oz (0.96 kg). Cisco gives every MPA the
    same envelope and a different weight, so the weight is the only physical figure that
    distinguishes them.
elements:
  status:
    at: [15.97, 68.76]
    size: [2.6, 2.6]
    class: led
    description: >-
      the MPA's STATUS lamp. Table 20, '20-Port Gigabit Ethernet MPA LEDs': off - modular
      port adapter power is off; green on - modular port adapter is ready and operational.
      THE TABLE STOPS THERE - this is the only MPA in the family whose STATUS row has no
      amber, and the two states are carried as printed rather than filled out from a
      sibling card.
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
