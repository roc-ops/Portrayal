format: 1
kind: module
name: a9k-dc-pem-v3
version: 1.0.0
class: power
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9000 version 3 DC power entry module - a power TRAY, not a supply. Four
  module openings labelled M0 to M3, holding four 4400 W DC power modules. Like the AC
  tray it is the unit IOS XR inventories, as 0/PT0.
size: {w: 468.12, h: 48.03}
attrs:
  model: 'A9K-DC-PEM-V3'
  role: 'power-tray'
  generation: '3'
  module-bays: 4
  eol: 'none-announced'
provenance:
  body: >-
    NO `body:` BLOCK, AND THIS IS THE RECORD OF WHY. The renderer now admits class `power`
    to the set that draws a solid body and ejects (relief.js, commit 9e3d0cb), so this part
    is ELIGIBLE for one. It does not get one because a body needs a DEPTH and no document in
    the 112-document intake states this module's: no section of the Overview and Reference
    Guide, in either revision, gives this part a dimension of any kind. Both searches were
    run - the part number across every doc.md, and the field name ('depth', 'Physical
    specifications', 'Dimensions') across every doc.md, in the current Overview and
    Reference Guide AND in the older asr9kOVRGbk revision, since vendors delete tables
    between revisions. Exactly ONE Cisco fan tray or power module in the whole intake has a
    published depth - the ASR 9922/9912 tray, 23 inches, and it is stated in passing inside
    a sentence about a width change. WHAT WOULD CLOSE IT: a Cisco mechanical drawing, or the
    chassis interior measured from a photograph with a rule in frame. A body depth invented
    to make the part eject would be a solid-looking number in the one field a 3D viewer
    trusts absolutely, and `size.d` is deliberately absent for the same reason.
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 2 ejector brackets, their levers and the grip
    flanges at out 4.2 (one number, carried by 61 Cisco contracts). EVERY MAGNITUDE BELOW IS
    ESTIMATED, AND THAT IS A DELIBERATE READING OF WHAT RELIEF IS FOR. The owner's ruling:
    'the whole 3d part is kind of interpolated anyway... It's just to give it a realistic
    view instead of just being a flat 2d... All of the 3d stuff is going to be mostly
    conjecture unless the vendor provides that data.' So a proudness here is an
    interpolation for a realistic view, NOT a claim about the hardware, and the confidence
    token on every feature says so rather than leaving it to be inferred. WHY `estimated`
    AND NOT `borrowed`, SINCE EVERY NUMBER HERE DOES COME FROM ANOTHER PORTRAYAL PART.
    `borrowed` is defined as another part's MEASURED figure reused for the same class of
    hardware, and these origins are not measured - they are the library's first guess at
    that hardware, and the contracts say so themselves: agr-panel-screw's provenance reads
    'estimated - it stands proud but was not measured', agr-psu-dc sources its latch's
    ARRANGEMENT from a photograph and never its proudness, agr-fan describes its handle and
    grille by appearance only, and common/led-dot's entire provenance is 'size: estimated'.
    Spelling that chain `borrowed` would convert a guess into an apparent measurement at one
    remove, a thousand times over. `source` still names the origin, so the coordinating
    benefit is kept and only the claim that is not true is dropped. READ THE COUNTS ABOVE AS
    THEY ARE MEANT: a figure carried by sixty-odd contracts is ONE ESTIMATE WRITTEN
    SIXTY-ODD TIMES, not sixty-odd readings that happened to agree. One caliper on any one
    Cisco captive screw, any one ejector lever or any one panel lamp corrects every part in
    the library that shares it, which is the whole reason the numbers are pooled instead of
    chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN FIRST AND IS RECORDED SO IT IS NOT
    REPEATED: all 112 doc.md extracts for 'protrud', 'extends outward', 'stands proud' and
    'clearance in front' - the only vendor in the intake that publishes a projection is
    UfiSpace, on the S9510-28DC; the per-card dimension tables, including Table A-10 of the
    older Ethernet Line Card Installation Guide which the current revision dropped, all of
    which carry H, W, D and weight only; and the ASR 9000 Visio stencil, whose 119 masters
    are FRONT and REAR elevations with no side, top or isometric view, so it holds no depth
    axis at all and is closed as a source. Figure 48 of the Ethernet Line Card Installation
    Guide and Figure 1-8 of the ISM guide DO show this hardware in three dimensions and are
    perspective drawings with a vanishing point, so they settle the ARRANGEMENT - bracket
    off the plate, lever along it, domed screw head proud of both - and nothing about size.
  size: >-
    drawing - the stencil master, BOTH AXES from index.json's shapesheet at the
    stencil's 1:10 inches, 468.12 x 48.03 mm. CORRECTED: the first version took the
    height from the shapesheet and the width from the art bounding box, which is the
    mixed-source error that made the version 1 power module 3.66 mm too wide. Here it
    was smaller - 463.59 against 468.12, 1 percent - but small and systematic is worse
    than large and obvious. No document in the intake gives a power tray's dimensions.
  bays: >-
    drawing - the module openings and their M0.. legends are measured off the master and
    counted off it. The count is corroborated by the guide's own arithmetic for this
    power system version, quoted under `generation`.
  nesting: >-
    the modules that seat in this tray are separate components and the schema cannot yet
    nest them: `bays` on a component is marked 'v0: unused' and nothing in the library
    uses it. So the tray draws its module openings as faceplate features and the modules
    are modelled alongside. When component-level bays land, this is the contract to
    revisit; until then a device that wants a populated tray places the tray.
  power: >-
    NOT STATED, and for a tray it may not be a meaningful figure at all. A power tray
    provides what the modules seated in it provide, and Cisco's tables give the tray
    only as a product of the two - 'Maximum (four 4400 W power modules or three 6000 W
    AC power modules per tray)'. So the tray's own power-output-w is left absent and the
    L27 warning stands, rather than baking a full-house assumption into the contract.
    The module count IS modelled, as the bay openings the faceplate draws.
  lifecycle: >-
    searched - no end-of-life notice is in the intake.
  generation: >-
    the Overview and Reference Guide's version 3 table is 'four 4400 W DC power modules
    or three 6000 W AC power modules per tray', and this master draws four openings
    against the AC master's three - the two masters are otherwise the same 466.12 x 48.0
    tray.
  modules: >-
    the modules are the 4400 W DC version 3 units, PWR-4.4KW-DC-V3, named in the same
    FPD-upgrade caution as the AC part. Not modelled: no version 3 module master exists,
    and this tray's module pitch is 104.5 mm against the two drawn modules' 142.78 and
    95.85.
