format: 1
kind: module
name: a9k-dc-pem-v3
version: 1.0.0
class: power
profile: networking
description: >-
  Cisco ASR 9000 version 3 DC power entry module - a power TRAY, not a supply. Four
  module openings labelled M0 to M3, holding four 4400 W DC power modules. Like the AC
  tray it is the unit IOS XR inventories, as 0/PT0.
size: {w: 468.12, h: 48.03}
attrs:
  model: 'A9K-DC-PEM-V3'
  role: 'power-tray'
  generation: '3'
  module-bays: 4
  eol: 'none-announced'
provenance:
  size: >-
    drawing - the stencil master, BOTH AXES from index.json's shapesheet at the
    stencil's 1:10 inches, 468.12 x 48.03 mm. CORRECTED: the first version took the
    height from the shapesheet and the width from the art bounding box, which is the
    mixed-source error that made the version 1 power module 3.66 mm too wide. Here it
    was smaller - 463.59 against 468.12, 1 percent - but small and systematic is worse
    than large and obvious. No document in the intake gives a power tray's dimensions.
  bays: >-
    drawing - the module openings and their M0.. legends are measured off the master and
    counted off it. The count is corroborated by the guide's own arithmetic for this
    power system version, quoted under `generation`.
  nesting: >-
    the modules that seat in this tray are separate components and the schema cannot yet
    nest them: `bays` on a component is marked 'v0: unused' and nothing in the library
    uses it. So the tray draws its module openings as faceplate features and the modules
    are modelled alongside. When component-level bays land, this is the contract to
    revisit; until then a device that wants a populated tray places the tray.
  power: >-
    NOT STATED, and for a tray it may not be a meaningful figure at all. A power tray
    provides what the modules seated in it provide, and Cisco's tables give the tray
    only as a product of the two - 'Maximum (four 4400 W power modules or three 6000 W
    AC power modules per tray)'. So the tray's own power-output-w is left absent and the
    L27 warning stands, rather than baking a full-house assumption into the contract.
    The module count IS modelled, as the bay openings the faceplate draws.
  lifecycle: >-
    searched - no end-of-life notice is in the intake.
  generation: >-
    the Overview and Reference Guide's version 3 table is 'four 4400 W DC power modules
    or three 6000 W AC power modules per tray', and this master draws four openings
    against the AC master's three - the two masters are otherwise the same 466.12 x 48.0
    tray.
  modules: >-
    the modules are the 4400 W DC version 3 units, PWR-4.4KW-DC-V3, named in the same
    FPD-upgrade caution as the AC part. Not modelled: no version 3 module master exists,
    and this tray's module pitch is 104.5 mm against the two drawn modules' 142.78 and
    95.85.
relief:
  wall: '#4a4f55'
skins: [default]
