format: 1
kind: module
name: asr-9006-fan
version: 1.1.1
class: fan
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9006 Router fan tray. Six axial 92 mm (3.62 in) fans behind a perforated
  face, secured by a single captive screw and aligned on two guide pins. The ASR 9006
  carries two of these for redundancy, side by side above the card cage and BEHIND A
  HINGED DOOR - which is why, uniquely in this family, no drawing of this tray exists
  anywhere: on the chassis master you see the door, not the tray.
size: {w: 175.65, h: 70.97}
attrs:
  model: 'ASR-9006-FAN'
  role: 'fan-tray'
  fans: '6 x 92 mm axial'
  power-draw-max-w: 375
  eol: 'none-announced'
provenance:
  seated: >-
    SEATED IN THE OPENING ITS OWN SIZE CAME FROM. `size` above says the envelope here
    is the OPENING that asr9k-chassis measured in the ASR 9006 front master, 175.65 x
    70.97 mm, sound for the bay but not a measurement of the part - so FT0 and FT1 on
    the chassis were cutouts carrying exactly that figure, and they are bays now. The
    chassis' own `openings-awaiting-components` gap asked for this part by name and
    recorded Cisco's numbering, FT0/FT1 per Figure 19. THE TWO OPENINGS WERE DRAWN
    0.21 mm APART - 175.65 and 175.44 - which is one opening measured twice in one
    master rather than two different holes, and the gap that catalogued them already
    normalised both to 175.65. Both bays reserve that.
  body: >-
    NO `body:` BLOCK, AND THIS IS THE RECORD OF WHY. The renderer now admits class `cooling`
    to the set that draws a solid body and ejects (relief.js, commit 9e3d0cb), so this part
    is ELIGIBLE for one. It does not get one because a body needs a DEPTH and no document in
    the 112-document intake states this fan tray's: 'Cisco ASR 9006 Router Fan Trays' gives
    six 92-mm fans, one captive screw, two guide pins, a finger guard and a weight. Both
    searches were run - the part number across every doc.md, and the field name ('depth',
    'Physical specifications', 'Dimensions') across every doc.md, in the current Overview
    and Reference Guide AND in the older asr9kOVRGbk revision, since vendors delete tables
    between revisions. Exactly ONE Cisco fan tray or power module in the whole intake has a
    published depth - the ASR 9922/9912 tray, 23 inches, and it is stated in passing inside
    a sentence about a width change. WHAT WOULD CLOSE IT: a Cisco mechanical drawing, or the
    chassis interior measured from a photograph with a rule in frame. A body depth invented
    to make the part eject would be a solid-looking number in the one field a 3D viewer
    trusts absolutely, and `size.d` is deliberately absent for the same reason.
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 1 vent fields at vent 26 (one number, carried by
    9 Cisco contracts); 1 pull handles at uhandle 8.0 (one number, carried by 10 Cisco
    contracts); 1 captive screw heads at cyl 1.6 (one number, carried by 63 Cisco
    contracts); 1 panel lamps at dome 0.3 (one number, carried by 120 Cisco contracts).
    EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE READING OF WHAT RELIEF IS
    FOR. The owner's ruling: 'the whole 3d part is kind of interpolated anyway... It's just
    to give it a realistic view instead of just being a flat 2d... All of the 3d stuff is
    going to be mostly conjecture unless the vendor provides that data.' So a proudness here
    is an interpolation for a realistic view, NOT a claim about the hardware, and the
    confidence token on every feature says so rather than leaving it to be inferred. WHY
    `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE DOES COME FROM ANOTHER PORTRAYAL
    PART. `borrowed` is defined as another part's MEASURED figure reused for the same class
    of hardware, and these origins are not measured - they are the library's first guess at
    that hardware, and the contracts say so themselves: agr-panel-screw's provenance reads
    'estimated - it stands proud but was not measured', agr-psu-dc sources its latch's
    ARRANGEMENT from a photograph and never its proudness, agr-fan describes its handle and
    grille by appearance only, and common/led-dot's entire provenance is 'size: estimated'.
    Spelling that chain `borrowed` would convert a guess into an apparent measurement at one
    remove, a thousand times over. `source` still names the origin, so the coordinating
    benefit is kept and only the claim that is not true is dropped. READ THE COUNTS ABOVE AS
    THEY ARE MEANT: a figure carried by sixty-odd contracts is ONE ESTIMATE WRITTEN
    SIXTY-ODD TIMES, not sixty-odd readings that happened to agree. One caliper on any one
    Cisco captive screw, any one ejector lever or any one panel lamp corrects every part in
    the library that shares it, which is the whole reason the numbers are pooled instead of
    chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN FIRST AND IS RECORDED SO IT IS NOT
    REPEATED: all 112 doc.md extracts for 'protrud', 'extends outward', 'stands proud' and
    'clearance in front' - the only vendor in the intake that publishes a projection is
    UfiSpace, on the S9510-28DC; the per-card dimension tables, including Table A-10 of the
    older Ethernet Line Card Installation Guide which the current revision dropped, all of
    which carry H, W, D and weight only; and the ASR 9000 Visio stencil, whose 119 masters
    are FRONT and REAR elevations with no side, top or isometric view, so it holds no depth
    axis at all and is closed as a source. Figure 48 of the Ethernet Line Card Installation
    Guide and Figure 1-8 of the ISM guide DO show this hardware in three dimensions and are
    perspective drawings with a vanishing point, so they settle the ARRANGEMENT - bracket
    off the plate, lever along it, domed screw head proud of both - and nothing about size.
  size: >-
    MEASURED, but not by me and not from a drawing of this part. There is NO stencil
    master for the ASR 9006 fan tray and the chassis master does not draw one, because
    the 9006's trays sit behind a hinged door and the master draws the door - the Cisco
    logo and 'Cisco ASR 9000 Series' legend at the top of that chassis are printed on
    it. So the envelope here is asr9k-chassis's measurement of the OPENING in the ASR
    9006 front master, 175.65 x 70.97 mm, taken at a scale calibrated against Table 13
    of the Overview and Reference Guide. That is a sound number for the bay; it is not a
    measurement of the part.
  arrangement: >-
    NOT SOURCED, and this is the weakest thing in the component. No document in the
    intake and no master in the stencil shows this faceplate. What IS sourced is the
    inventory: the fan tray holds six 92-mm (3.62-in) axial fans, locates on two guide
    pins inside the chassis, is held by ONE captive screw, and has a finger guard next
    to the front of most of its fans (Overview and Reference Guide, 'Cisco ASR 9006
    Router Fan Trays'), plus the Run/Fail status LED every tray in the family carries.
    Where each of those sits on the face is a drawing decision of mine, not a
    measurement. Note one thing that rules out the obvious
    layout: six 92 mm fans CANNOT be laid out on a 175.65 x 70.97 face - two across is
    already 184 mm - so the fans sit behind the plate in depth and the face is a vent,
    which is what is drawn. Anyone with a photograph of an ASR 9006 with its fan door
    open can replace this face outright.
  lamp: >-
    install guide - the Overview and Reference Guide's 'Fan Tray Status Indicators':
    yellow, briefly = just inserted into the chassis; then, in normal operation, green
    = all fans in the module running normally; red = a fan failure or another fault in
    the fan tray module. Four states; yellow is the insertion state
    and is real.
  power: >-
    install guide - Table 24 of the Overview and Reference Guide, row 'ASR 9006 Fan Tray
    V2': 100 W at 25 C, 275 W at 40 C, 375 W at 55 C. max is the worst rated ambient.
    Note the row names the V2 and Table 24 has NO V1 row for this chassis, although
    ASR-9006-FAN and ASR-9006-FAN-V2 are both real part numbers in the IOS XR 24.3.2
    firmware table. So this figure is the V2's and the V1's is simply not published.
  weight: >-
    NOT CARRIED, and the reason is a figure I do not believe. The guide says 'The
    maximum weight of the fan tray is 39.7 lb (18.0 kg)' for the ASR 9006's six-fan
    tray, while the ASR 9010's TWELVE-fan tray is 13.82 lb (6.29 kg) and the ASR 9904's
    twelve-fan tray is 11.0 lb (4.99 kg) in the same series of sections. A six-fan tray
    weighing three times a twelve-fan one is not credible, and the pound and kilogram
    figures are consistent with each other, so it is not a unit slip in one column - it
    looks like the wrong number against that heading. Rather than carry a figure I would
    not defend or silently substitute a plausible one, the attribute is absent and this
    is the record of why.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
elements:
  status:
    at: [10.2, 54.7]
    size: [3.6, 3.6]
    class: led
    description: >-
      the fan tray's Run/Fail status LED, one per tray.
    states:
    - {name: green, color: '#39b54a'}
    - {name: yellow, color: '#f5c518'}
    - {name: red, color: '#d0021b'}
    - 'off'
relief:
  wall: '#4a4f55'
  features:
    - node: vent-field
      vent: 26
      confidence: estimated
      source: >-
        edgecore/agr-fan@1 grille - the library's one vent-cavity figure, described in that
        contract by appearance and not by depth
    - node: handle
      uhandle: 8.0
      confidence: estimated
      source: >-
        edgecore/agr-fan@1 handle - the library's one pull-handle figure. Its provenance
        describes the handle's appearance from a photograph, not its proudness
    - node: screw
      cyl: 1.6
      confidence: estimated
      source: >-
        edgecore/agr-panel-screw@1 - the library's one captive-screw-head figure, whose own
        provenance reads 'estimated - it stands proud but was not measured'
    - node: status
      dome: 0.3
      confidence: estimated
      source: >-
        common/led-dot@1 - the library's one panel-lamp figure. Its own provenance is 'size:
        estimated' and the dome carries none
skins: [default]
