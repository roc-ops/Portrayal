format: 1
kind: module
name: n9k-c9516-fm-e2
version: 1.0.0
class: fabric
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9516 fabric module for the 100-Gigabit line cards including the N9K-X9736C-FX3 (N9K-C9516-FM-E2).
  A vertical module with a vented face, ejector levers, a BCN lamp and a status lamp; it sits in the rear of
  the chassis behind a fan tray and pairs with the N9K-C9516-FAN tray. Five of them go in FM 2 to FM 6; an
  empty odd slot takes the N9K-C9516-FM-CV blank.
size: {w: 62.48, h: 772.16, d: 297.18}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
attrs:
  model: 'N9K-C9516-FM-E2'
  role: 'fabric-module'
  power-draw-typical-w: 439
  power-draw-max-w: 900
  weight-kg: 9.21
  hot-swappable: true
  eol: 'unknown'
provenance:
  size: >-
    datasheet - Cisco N9516 NX-OS Mode Switch Hardware Installation Guide, Appendix A "Switch Dimensions"
    (PDF p116, printed 110), "Fabric modules": 2.46 in (6.25 cm) wide, 11.7 in (29.72 cm) deep, 30.4 in
    (77.22 cm) high. One row serves every fabric type.
  power: >-
    datasheet, READ LINE BY LINE - the chassis's own "Planning for Power Requirements" table (PDF p19,
    printed 13), the row "Line Cards supported by 100-Gigabit -E and -E2 fabric modules", prints two lines
    of figures, 980 W / 1320 W and 439 W / 900 W (typical, maximum). The second line is read as the FM-E2.
    The guide's worked example counts no FM-E2, so nothing confirms it, and the assignment is an inference
    from line order. See cisco/n9k-c9516-fm-e for the first line.
  slots: >-
    install guide - "Overview" Table 1 (PDF p8, printed 2) lists this module for the -EX, -FX and N9K-X9736C-FX3
    line cards, and a note under the table says a 9516 with 16 N9K-X9788TC-FX line cards "requires a minimum of
    3 FM-E2". Slot rules (PDF p9, printed 3): five FM-E or FM-E2 modules go in FM 2 to FM 6.
    CONFLICT: the fan-tray lamp table (PDF p131, printed 125) lists the FM and FM-E as the modules that power
    a fan tray and leaves out the FM-E2; the omission is recorded, and the FM-E2 is accepted in every fabric
    slot.
  weight: >-
    datasheet - Appendix A weights table (PDF p117, printed 111): 22.31 lb (9.21 kg).
  lamps: >-
    install guide - "Fabric Module LEDs" (PDF p132, printed 126): a BCN lamp (blue) and a status lamp.
    Positions estimated.
  skin: >-
    estimated - a vented face and two ejector levers, read from the rear figure of the overview (PDF p11,
    printed 5), which is isometric; no figure dimensions them.
  lifecycle: >-
    unknown - Cisco's support page gives no sale status for this part number, and no end-of-sale notice for
    it is held.
elements:
  bcn:
    at: [10.0, 741.6]
    size: [3.0, 3.0]
    class: led
    description: BCN lamp. The BCN lamp on the fan tray that covers the module also lights.
    states:
    - {name: blue, color: '#2a7de1'}
    - 'off'
  status:
    at: [48.0, 741.6]
    size: [3.0, 3.0]
    class: led
    description: Status lamp.
    states:
    - {name: green, color: '#39b54a'}
    - {name: flashing-red, color: '#d0021b', behavior: blinking}
    - {name: flashing-amber, color: '#f5a623', behavior: blinking}
    - 'off'
skins: [default]
