format: 1
kind: module
name: nc57-c3-fan2-hx
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  The environment-hardened fan tray with two 60 mm fans of the Cisco NCS-57C3-MOD-HX, ordered as NC57-C3-FAN2-HX, for fan tray
  slots 0 and 1. It installs from the rear and is drawn as the NC57-C3-FAN2-FW is: two round fans one above the other, a black
  pull handle at the right and a status lamp at the lower left. The -HX chassis takes only the -HX trays.
size: {w: 66.0, h: 126.0}
size-confidence: {w: photo-measured, h: photo-measured}
part-numbers:
  NC57-C3-FAN2-HX: {part: NC57-C3-FAN2-HX}
attrs:
  airflow: front-to-back
  hot-swappable: 'yes'
  power-absent: not-published
provenance:
  model: >-
    datasheet - Hardware Installation Guide for Cisco NCS 5700 Series Fixed-Port Routers (first published 2021-06-23, last modified
    2026-05-15), Fan Modules and Fan Trays: "Fan tray slots 0 and 1 support fan tray assembly with 2x60mm fans
    (NC57-C3-FAN2-FW/NC57-C3-FAN2-HX)"; Figure 4 is captioned for both parts. Table 2: the NCS-57C3-MOD-HX "can be paired with either the
    NC57-C3-FAN1-HX or NC57-C3-FAN2-HX fan tray", and only the environmental-hardened fan tray is to be installed in it.
  power: >-
    NOT STATED. Searched the guide for the tray's watts: only supply ratings are given. No power figure is written.
  size: >-
    photo-measured - the size of nc57-c3-fan2-fw from Figure 20. The guide gives one figure for both parts and says nothing of how the
    hardened tray differs, so its face is the FW tray's, and this is a reading of that figure and not of a hardened tray.
  elements: >-
    estimated - as nc57-c3-fan2-fw; no figure of the -HX tray itself is held, and the guide does not say how it differs.
  depth: >-
    estimated - not stated in any held document; 80 mm is a round figure for a fan tray of this class.
states: [absent]
elements:
  fan-a: {at: [3.0, 3.0], size: [48.0, 54.0], class: rotor}
  fan-b: {at: [3.0, 66.0], size: [48.0, 54.0], class: rotor}
  handle: {at: [53.0, 6.0], size: [10.0, 114.0], class: handle}
  status: {at: [4.0, 120.0], size: [2.2, 2.2], class: led, states: ['off', {name: ok, color: '#22c55e'}, {name: failed, color: '#ef4444'}]}
skins: [default]
body:
  depth: 80
  color: '#26292d'
  footprint: {at: [0, 0], size: [66.0, 126.0]}
