format: 1
kind: module
name: n9k-x97160yc-ex
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9500 48-port 1/10/25-Gigabit Ethernet SFP28 and 4-port 40/100-Gigabit Ethernet QSFP28 line card
  (N9K-X97160YC-EX). Forty-eight SFP28 ports in two rows of twenty-four and four QSFP28 ports in two rows of
  two at the right, a Beacon and a Status lamp at the left and one Link triangle per port between the rows,
  with an ejector lever at each end. The Nexus 9504, 9508 and 9516 take it.
size: {w: 431.8, h: 44.45, d: 419.1}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
attrs:
  model: 'N9K-X97160YC-EX'
  role: 'line-card'
  sfp28: 48
  qsfp28: 4
  media: 'SFP28, 1/10/25 Gigabit Ethernet; QSFP28, 40/100 Gigabit Ethernet'
  weight-kg: 5.78
  power-draw-typical-w: 415
  power-draw-max-w: 516
  chassis: 'Nexus 9504, Nexus 9508, Nexus 9516'
  hot-swappable: true
  eol: 'unknown'
provenance:
  size: >-
    datasheet - Cisco N9508 NX-OS Mode Switch Hardware Installation Guide, Appendix A "Switch Dimensions"
    (PDF p120, printed 114), "Line cards": 17.0 in (43.18 cm) wide by 1.75 in (4.4 cm) high; the 9504 guide
    (PDF p120, printed 114) and the 9516 guide (PDF p116, printed 110) print the same row. It is the class row
    for every line card, not a row of this card.
  depth: >-
    datasheet - the same row: 16.5 in (41.91 cm) inside the chassis, ejector levers 2.5 in (6.35 cm) outside
    it. The depth is the inside figure, as the supervisor's is; the levers swing out and are not added.
  weight: >-
    datasheet - Cisco N9504 NX-OS Mode Switch Hardware Installation Guide, "Weights and Quantities" (PDF p121,
    printed 115): 12.75 lb (5.78 kg), the same in the 9516 guide (PDF p117, printed 111). SLIP: the weights
    tables call it "10/25-Gigabit"; the power tables of all three guides say "1/10/25-Gigabit", which is
    carried. The 9508 guide's weights section has no table.
  power: >-
    datasheet - the "Planning for Power Requirements" tables (9504 guide, PDF pp17-20, printed 11-14; 9508 and
    9516 guides, PDF p18, printed 12): typical 415 W, maximum 516 W, the same in all three guides and under the
    -E, -E2 and -G headings. The 9504's first row splits its label across two lines ("... and 4-port -" and
    "40/100-Gigabit Ethernet QSFP28 line card (N9K-X97160YC-EX)"), so its figures are read by line order.
  ports: >-
    install guide - the Overview tables and the power tables call it a "48-port 1/10/25-Gigabit Ethernet SFP28
    and 4-port 40/100-Gigabit Ethernet QSFP28 line card". TEXT ONLY: no held figure shows this card's
    faceplate, so the counts and cages are the guide's words and every position is estimated - two rows of
    twenty-four SFP cages in three groups of eight (SFP28 uses the SFP cage) on the registry's 14.25 mm pitch,
    then two columns of two QSFP28 cages, odd ports over even in each column. The SFP28 cages are ports 1 to 48
    and the QSFP28 cages 49 to 52; the numbering as printed on the metal is not shown, and Ethernet1/n
    interface names are not drawn.
  lamps: >-
    install guide - "Line Card LEDs" (9504 and 9508 guides PDF p136, printed 130; 9516 guide PDF p132,
    printed 126): the Beacon (BCN) and Status (STS) lamps are "on the front, toward the left side of the
    module"; the Link lamp of each port is "between the two rows of ports", a triangle pointing to the port
    above or below it. BCN: flashing blue, or off. STS: green, flashing red, flashing amber, or off. Link:
    green, orange, flashing orange, or off. The lamps are drawn beside what they name; positions estimated.
  skin: >-
    estimated - the card's own faceplate is not shown, so the skin does not show this card. The levers follow
    the install procedure ("Installing or Replacing a Line Card", 9504 guide PDF p91, printed 85): a release
    button on each ejector lever, which is pressed before the lever is rotated away. A figure of an unnamed
    36-port card (9504 guide PDF p93, printed 87) shows two rows with the lamps at the left, a ventilation
    strip over each row and the levers at each end, and is used for that arrangement only. The maker's mark is
    reserved as the logo-zone and not drawn.
  chassis-compatibility: >-
    install guide - the Overview tables of the 9504 (PDF pp8-9, printed 2-3), 9508 (PDF pp8-9, printed 2-3)
    and 9516 (PDF pp7-8, printed 1-2) guides list it under the -E, -E2 (9508, 9516) and -G (9504, 9508) fabric
    modules, four of them for maximum bandwidth (a fifth for redundancy under the 9508's -E and -E2 and the
    9516's -E2). That is why the slot bays of all three chassis accept it; geometry is not a compatibility
    source. The fabric modules the guides pair with it are listed in the chassis and are not enforced.
  lifecycle: >-
    unknown - Cisco's support page gives no sale status for this part number, and no end-of-sale notice is held.
