<svg xmlns="http://www.w3.org/2000/svg" width="9.0mm" height="16.0mm" viewBox="0 0 9.0 16.0">
  <!-- The NXA-PDC-930W power connector seen from its mating face: a body with three cells in a column ("- DC", "+ DC", earth from
       the top down) and the clip tab on its left side at the middle cell. Shapes and colours are estimates; the guide's figure is line art. -->
  <rect id="key" x="0" y="6.0" width="2.0" height="4.0" rx="0.4" fill="#2a2d31"/>
  <rect id="body" x="1.6" y="0" width="7.4" height="16.0" rx="0.5" fill="#24272b" stroke="#4a4f55" stroke-width="0.2"/>
  <g id="cells" fill="#0e0f11">
    <rect x="2.6" y="1.5" width="5.4" height="3.8" rx="0.3"/>
    <rect x="2.6" y="6.1" width="5.4" height="3.8" rx="0.3"/>
    <rect x="2.6" y="10.7" width="5.4" height="3.8" rx="0.3"/>
  </g>
  <g id="contacts" fill="#9a9fa5">
    <rect x="4.7" y="2.8" width="1.2" height="1.2"/>
    <rect x="4.7" y="7.4" width="1.2" height="1.2"/>
    <rect x="4.7" y="12.0" width="1.2" height="1.2"/>
  </g>
</svg>
