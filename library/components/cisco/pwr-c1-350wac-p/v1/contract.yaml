format: 1
kind: module
name: pwr-c1-350wac-p
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 350 W AC Platinum-certified power supply of the Cisco Catalyst 9300 family,
  PWR-C1-350WAC-P - the default supply of the C9300-48T and C9300-24T. The same dark,
  honeycomb-vented rear face as the 715 W supply, with an AC OK and a PS OK lamp, an IEC
  C14 inlet, two release latches and a power cord retainer. Airflow is front-to-back.
size: {w: 82.55, h: 40.1}
size-confidence: {w: datasheet, h: datasheet}
attrs:
  model: 'PWR-C1-350WAC-P'
  power-output-w: 350
  input: ac
  inlet: c14
  input-voltage: '100 to 240 VAC (autoranging)'
  input-current-max: '4 to 2 A'
  input-frequency: '47 to 63 Hz'
  output: '-56 V at 6.25 A'
  weight-kg: 1.2
  airflow: front-to-back
  efficiency: platinum
provenance:
  model: >-
    datasheet - Cisco Catalyst 9300 Series Switches Hardware Installation Guide (first
    published 2017-06-20, last modified 2026-05-15), Table 18 gives PWR-C1-350WAC-P as the
    default supply of the C9300-24T and C9300-48T. Table 35 lists it for the C9300X series
    and lists PWR-C1-350WAC, not the -P, for the C9300 series; the two tables disagree and
    both parts are modelled (cisco/pwr-c1-350wac@1).
  power: >-
    datasheet - Table 44: maximum output power 350 W, 100 to 240 VAC autoranging at 47-63 Hz,
    input current 4-2 A, output -56 V at 6.25 A. An OUTPUT rating, so power-output-w.
  size: >-
    datasheet - Physical Specifications of Power Supplies, 1.58 x 3.25 x 12.20 in (40.1 x
    82.55 x 309.9 mm); the column is headed H x D x W and printed height, width, depth (see
    cisco/pwr-c1-715wac-p@1, which reads it the same way).
  weight: >-
    datasheet - the same table prints 2.3 lb (1.2 kg); the pounds and kilograms disagree
    (2.3 lb is 1.04 kg) and the kilograms are carried, as the 350 W non-Platinum row prints
    2.6 lb for the same 1.2 kg.
  depth: >-
    datasheet - 309.9 mm.
  elements: >-
    estimated - the guide has no figure of the 350 W AC supply. Drawn as the 715 W supply is,
    from the community NetBox rear elevation of the C9300-48T; see cisco/pwr-c1-715wac-p@1.
  lamps: >-
    datasheet - Table 36, Switch Power Supply Module LEDs, as cisco/pwr-c1-715wac-p@1.
  inlet: >-
    datasheet - C15 cords (Table 49) mate a C14 inlet.
  colour: >-
    estimated - read off the NetBox elevation.
states: [absent]
elements:
  ac-ok: {at: [10.2, 7.6], size: [3.0, 3.0], class: led, states: ['off', {name: ok, color: '#22c55e'}]}
  ps-ok: {at: [31.4, 7.6], size: [3.0, 3.0], class: led, states: ['off', {name: ok, color: '#22c55e'}, {name: fault, color: '#ef4444'}]}
  latch: {at: [28.2, 26.5], size: [11.0, 11.9], class: handle}
  retainer: {at: [56.0, 28.5], size: [12.7, 9.9], class: handle}
parts:
  - {ref: std/c14-inlet@1, id: inlet, at: [41.2, 7.3]}
relief:
  wall: '#15171a'
skins: [default]
body:
  depth: 309.9
  color: '#2a2c30'
  footprint: {at: [0, 0], size: [82.55, 40.1]}
