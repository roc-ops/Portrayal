    - 'cisco/a9k-mpa-2x10ge@1'
    - 'cisco/a9k-mpa-4x10ge@1'
    - 'cisco/a9k-mpa-8x10ge@1'
    - 'cisco/a9k-mpa-1x40ge@1'
    - 'cisco/a9k-mpa-2x40ge@1'
  bay-1:
    at: [7.59, 202.78]
    size: [33.81, 160.02]
    accepts:
    - 'cisco/a9k-mpa-blank@1'
    - 'cisco/a9k-mpa-2x10ge@1'
    - 'cisco/a9k-mpa-4x10ge@1'
    - 'cisco/a9k-mpa-8x10ge@1'
    - 'cisco/a9k-mpa-1x40ge@1'
    - 'cisco/a9k-mpa-2x40ge@1'
