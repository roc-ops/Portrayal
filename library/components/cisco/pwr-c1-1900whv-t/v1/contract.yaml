format: 1
kind: module
name: pwr-c1-1900whv-t
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 1900 W high-voltage AC or DC Titanium-certified power supply of the Cisco Catalyst
  9300 family, PWR-C1-1900WHV-T. The same dark, honeycomb-vented rear face as the other
  1900 W supply, with an AC OK and a PS OK lamp, a Saf-D-Grid power cord connector, a
  release latch and an extraction handle. Airflow is front-to-back.
size: {w: 82.55, h: 40.1}
size-confidence: {w: borrowed, h: borrowed}
attrs:
  model: 'PWR-C1-1900WHV-T'
  power-output-w: 1900
  input: hvac-hvdc
  inlet: other
  inlet-connector: saf-d-grid
  weight-kg: 1.47
  airflow: front-to-back
  efficiency: titanium
provenance:
  model: >-
    datasheet - Cisco Catalyst 9300 Series Switches Hardware Installation Guide (first
    published 2017-06-20, last modified 2026-05-15), Table 35 lists PWR-C1-1900WHV-T, "1900W
    HVAC/HVDC Titanium-certified power supply module", for the C9300 and C9300X series; Figure
    48 draws it, isometrically, with callouts for the AC OK LED, the PS OK LED, the AC or DC
    power cord connector, the release latch, the extraction handle and the keying feature.
  power: >-
    datasheet - the part's own description, 1900 W. No specification table of the guide
    covers this supply (Table 44 is the 1900 W Platinum supply), so its input voltage,
    current and output rating are not stated and are left out. An OUTPUT rating, so
    power-output-w.
  size: >-
    borrowed - cisco/pwr-c1-1900wac-p@1. THE GUIDE'S DIMENSIONS TABLE HAS NO ROW FOR THIS
    SUPPLY. The 1900 W Platinum supply's 82.55 x 40.1 face and 348.2 depth are carried on
    the assumption that the two 1900 W supplies share a chassis; nothing held says so.
  weight: >-
    datasheet - 3.25 lb (1.47 kg), the guide's Physical Specifications of Power Supplies.
  depth: >-
    borrowed - 348.2 mm, cisco/pwr-c1-1900wac-p@1; see size.
  elements: >-
    estimated - Figure 48 is isometric; positions are those of the other supplies, see
    cisco/pwr-c1-715wac-p@1, with a handle in place of the cord retainer.
  lamps: >-
    datasheet - Table 36, Switch Power Supply Module LEDs; the guide labels the first lamp AC
    OK and gives no DC-input name for this supply.
  inlet: >-
    datasheet - the guide's HVAC/HVDC Power Cord Specifications table lists cords with a
    Saf-D-Grid connector for this supply (footnote 10: "Saf-D-Grid connector rating. Wire and
    C20 connector have different voltage and current ratings"). Drawn as std/saf-d-grid@1.
  colour: >-
    estimated - as the other AC supplies.
states: [absent]
elements:
  ac-ok: {at: [10.2, 7.6], size: [3.0, 3.0], class: led, states: ['off', {name: ok, color: '#22c55e'}]}
  ps-ok: {at: [31.4, 7.6], size: [3.0, 3.0], class: led, states: ['off', {name: ok, color: '#22c55e'}, {name: fault, color: '#ef4444'}]}
  latch: {at: [28.2, 29.5], size: [11.0, 9.0], class: handle}
  handle: {at: [58.0, 31.0], size: [18.0, 7.5], class: handle}
parts:
  - {ref: std/saf-d-grid@1, id: inlet, at: [41.5, 6.5]}
relief:
  wall: '#15171a'
skins: [default]
body:
  depth: 348.2
  color: '#2a2c30'
  footprint: {at: [0, 0], size: [82.55, 40.1]}
