format: 1
kind: module
name: asr-9922-rp-se
version: 2.0.0
class: supervisor
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9900 Route Processor, Service Edge optimised, for the ASR 9922 and ASR 9912.
  Two SYNC timing ports, an IEEE 1588 timestamp port, nV Sync0 and nV Sync1/TOD inter-
  chassis sync ports, two management LAN ports, a console and an auxiliary port. Nine
  RJ-45 jacks, 10 MHz and 1 PPS SMB clock inputs under a GPS INTERFACE bracket, a nine-
  pin alarm output, a USB port, ACO and LAMP TEST push buttons, a discrete lamp cluster
  and a four-character LED dot-matrix display.
size: {w: 41.4, h: 395.7, d: 628.9}
size-confidence: {w: borrowed, h: borrowed}
attrs:
  model: 'ASR-9922-RP-SE'
  role: 'route-processor'
  mgmt: '2 x 100/1000 RJ-45'
  console: 'EIA/TIA-232 RJ-45'
  timing: '2 x SYNC (BITS/J.211/DTI) RJ-45, IEEE 1588 RJ-45, 2 x nV Sync RJ-45, 10 MHz and 1 PPS SMB'
  alarm: 'DB9, three dry-contact outputs'
  usb: '1 x USB 2.0 type A'
  weight-kg: 5.9
  power-draw-max-w: 259
  eol: 'none-announced'
provenance:
  stack-orientation: >-
    The library's stack convention (docs/pluggables-3d-design.md, S1-S4): on a card
    drawn on its side a pair sits left and right, the left cage 270 beside the right 90,
    so both cage lips face the band between the two cages and both bails face outward.
    Decided by the rule, not an observation, so a photograph of the stack overturns it:
    the 1 SFP pair (sfp-plus-1/sfp-plus-0). Turning a composed cage in place changes no
    box, id or anything a device places, so it is a minor bump (S6).
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 8 panel lamps at dome 0.3 (one number, carried by
    120 Cisco contracts); 4 ejector brackets, their levers and the grip flanges at out 4.2
    (one number, carried by 61 Cisco contracts); 2 captive screw heads at cyl 1.6 (one
    number, carried by 63 Cisco contracts); 2 pushbuttons at cyl 1.2 (one number, carried by
    15 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE
    READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind of
    interpolated anyway... It's just to give it a realistic view instead of just being a
    flat 2d... All of the 3d stuff is going to be mostly conjecture unless the vendor
    provides that data.' So a proudness here is an interpolation for a realistic view, NOT a
    claim about the hardware, and the confidence token on every feature says so rather than
    leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE
    DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED
    figure reused for the same class of hardware, and these origins are not measured - they
    are the library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size. STILL REFUSED ON THIS FACE, and these
    are NOT the same kind of gap: the 1 drawn aperture(s) alarm-out - an optical or
    connector aperture that conforms to no published standard, so no depth exists to
    interpolate from; led-matrix - an alphanumeric display whose glass may be flush or
    recessed and no figure says. The ruling sanctions interpolating a PROUDNESS for a
    realistic view. It does not sanction inventing an APERTURE, which is a dimension a
    specification is withholding rather than one nobody has measured.
  size: >-
    ASR 9000 CARD STANDARD - 41.4 x 395.7 mm, where this part carried 46 x 428.5 until
    2.0.0. Every full-size ASR 9000 card, and every slot that takes one, is that one
    envelope in this library, so a card seats the same way in each chassis that accepts it
    and no two cards in one cage draw at different sizes. The long axis is the
    ejector-inclusive figure of the fourth-generation line card data sheets, 'Physical
    dimensions (includes ejector bracket/lever)', and a lab measurement across a real
    A9K-RSP880 agrees with it - about 15 1/2 in, where the data sheet for that card says 16.87
    (roc-ops/Portrayal#16). The thickness is the figure Cisco states most often, 1.63 in.
    Both axes are borrowed from the family rather than read off this part, which is what
    size-confidence says. The 1.81 in thickness below was never measured, and it is thicker
    than every slot pitch that holds this card. THE ART WAS RE-ENVELOPED, NOT REDRAWN, on
    both axes. The plate scales to the new size, while every port, lamp, button and legend
    keeps its drawn size and moves in proportion, so a feature position is good to about a
    millimetre rather than to a tenth. WHAT THIS PART CARRIED BEFORE, kept because a source
    that disagrees is still evidence: datasheet - Cisco ASR 9900 Route Processor Data Sheet,
    'Physical specifications': Height 1.81" (4.60 cm), Width 16.87" (42.85 cm), Depth 24.74"
    (62.89 cm), Weight 13 lb (5.90 kg). That sheet names ASR-9922-RP-SE and -TR alongside
    ASR-9900-RP-SE and -TR, so the four part numbers share this envelope by Cisco's own
    scoping.
  layout: >-
    drawing - the Cisco Visio master, scaled to the datasheet's own overall dimensions.
    index.json's shape box is the Visio drawing box, not the card - it reads 1.73 x 14.75 in
    for every control-card master - so the ART is the ruler and the box is not, the same
    correction the line cards needed. Long axis scaled to the card's stated width, short
    axis to its stated height, two factors. That describes how 1.x drew the art; 2.0.0
    re-enveloped it to the ASR 9000 card standard, and the size note says how.
  family: >-
    these masters are NOT the one-drawing family the RSP5, RSP-880, RP3 and RSP4-S
    masters are. Each has its own jack column, its own lamp cluster and its own legends
    - the RSP-440's five upper jacks sit at 42.6, 60.6, 102.6, 121.0 and 139.4 mm where
    the RSP5's sit at 42.5, 60.4, 117.7 and a stacked pair at 139.3 - so every feature
    here is read off the master it belongs to. The port IDS come from the legends that
    master prints, matched by proximity and asserted unique, not from a table of mine:
    that is how ICS0/ICS1/TOD on the RSP-440 and nV Sync0/nV Sync1/TOD on the
    ASR-9922-RP came out different without anyone deciding they should.
  cages: >-
    composed from std/. RJ-45s are std/rj45-ganged (12.7 x 11.0) rather than std/rj45's single-jack IEC panel cutout
    (16.0 x 14.0 when this was written - the aperture the registry carried before roc-ops/Portrayal#125,
    retired since; std/rj45@2 is the 15.8 x 13.2 housing): neither figure fits twice across a 41 mm card, and
    the drawn jack measures 12.81 x 10.83. Timing coax is std/smb; the USB is std/usb-a;
    SFP+ is std/sfp-ganged.
  lamps: >-
    install guide - Table 4 for the RSP cards and Table 5 for the RP, transcribed per
    lamp with Cisco's own sentence kept beside the state tokens. WHICH lamp is where is
    read off this master's own printed legends and matched by position - the RSP-440 has
    six lamps in two columns and the ASR-9922-RP has eight in three, and neither was
    assumed from the other. Where a master draws a lamp with NO legend beside it that
    lamp is not modelled: the ASR-9922-RP has three such, almost certainly the External
    and two Internal USB lamps Table 4 describes - but almost certainly is not a source,
    so they are left out and this sentence is the record of them.
  db9: >-
    CLOSED. The ALARM OUT is composed from common/db9-receptacle@1, which frames
    std/db9@1 and its sourced size E aperture, so this card no longer draws a
    connector nobody had dimensioned. What closed it: TE application
    specification 114-40010 Rev G Figure 3 for the panel cutout - 20.47 x 11.40
    with 10 degrees of taper a side and a 3.35 radius in four places - and
    customer drawing C-747905 Rev AB1 for the flange, shell and the 24.99
    mounting centres the standoffs sit on. Both are now carried by the `db9` key
    in spec/schemas/standards.yaml.
    WHAT THE DRAWN ONE HAD BEEN: 9.48 x 34.14, which is not any DE-9. The
    master this family traces is scaled to each card's envelope by two separate
    factors, so the connector came out stretched along the card's long axis and
    differently on every card - 18.46 to 35.65 mm long across the fifteen for a
    part that is one size in reality. The centre was kept; only the size moved.
  identity: >-
    this is the card Table 23 calls the 'RP Card', NOT the RP2. The RP2 is
    A99-RP2-SE/-TR with its own data sheet (Cisco ASR 9900 Route Processor 2) and its
    own Table 23 row at 390/400/410 W, and it has no stencil master. The two are easy to
    conflate because they share an envelope to the millimetre - 46.0 x 428.5 x 628.9 -
    and differ by 4.2 kg and 151 W. The weight is what separates them here: 13 lb on the
    RP sheet against 17.8 lb on the RP2's.
  power: >-
    install guide - Table 23 of the Overview and Reference Guide, row 'RP Card': 227 W
    at 25 C, 251 W at 40 C, 259 W at 55 C. max is the highest rated ambient. NOT the
    'RP2 Card' row's 390/400/410 - see `identity`. Table 23 names the CARD and not the
    part number - its rows are 'RSP-440 Card', 'RP Card' and so on, with no -SE/-TR
    split anywhere - so one figure serves both variants by Cisco's own scoping rather
    than by an inference across it.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
elements:
  fail:
    at: [11.37, 321.38]
    size: [2.11, 2.11]
    class: led
    description: >-
      Power Fail (FAIL). Red: standby power fail; the LED is turned off by the CAN bus
      controller once it is up and running. Off: standby power is normal.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  aco:
    at: [11.37, 327.64]
    size: [2.11, 2.11]
    class: led
    description: >-
      Alarm Cutoff (ACO). Amber: alarm cutoff has been enabled - the ACO push button was
      pressed after at least one alarm occurred.
    states:
    - {name: amber, color: '#f5a623'}
    - 'off'
  sync:
    at: [11.37, 334.67]
    size: [2.11, 2.11]
    class: led
    description: >-
      Synchronization (SYNC). Table 5, 'RP and RP2/RP3 Discrete LED Display Definitions' -
      this card's own table, not the RSP family's Table 4, and the two differ here. Green:
      'System timing is synchronized to an external timing source INCLUDING IEEE 1588' -
      Table 4 omits the 1588 clause. Amber: system timing is free running. Off (default
      after reset): Cisco writes 'LED never turns off', which contradicts listing Off as a
      colour at all; off is kept as a declared state because the drawing needs an unlit
      appearance, and Cisco's sentence is recorded here rather than tidied away. Table 4
      says 'No system timing is configured' for the same row, which is the RSP family's
      answer and is not this card's.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  crit:
    at: [16.13, 321.38]
    size: [2.11, 2.11]
    class: led
    description: >-
      Critical Alarm (CRIT). Red: a critical alarm has occurred.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  maj:
    at: [16.13, 327.64]
    size: [2.11, 2.11]
    class: led
    description: >-
      Major Alarm (MAJ). Red: a major alarm has occurred.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  min:
    at: [16.13, 334.67]
    size: [2.11, 2.11]
    class: led
    description: >-
      Minor Alarm (MIN). Amber: a minor alarm has occurred.
    states:
    - {name: amber, color: '#f5a623'}
    - 'off'
  ssd:
    at: [21.14, 321.38]
    size: [2.11, 2.11]
    class: led
    description: >-
      Internal Solid State Hard Disk Drive (SSD). Green: SSD0 is busy/active.
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  fc-fault:
    at: [21.14, 327.64]
    size: [2.11, 2.11]
    class: led
    description: >-
      FC Fault. Table 5, 'RP and RP2/RP3 Discrete LED Display Definitions' - amber: 'A
      fault has occurred on any or all of the FC cards installed. This LED will be on
      during the boot phase of the FC.' Off (default after reset): 'FC cards are booted up
      and ready.' A real vocabulary from this card's own table. An earlier version of this
      component said no row for FC FAULT existed in Table 4 or Table 5 and carried a bare
      off/on; that was wrong about Table 5.
    states:
    - {name: amber, color: '#f5a623'}
    - 'off'
  led-matrix:
    at: [11.8, 342.12]
    size: [19.4, 7.57]
    class: display
    characters: 4
    description: >-
      the four-character 5x7 LED dot-matrix display. What it shows is a message vocabulary
      - the guide gives it two sections, boot-stage/runtime and CAN bus controller errors
      - not a lamp state list, so it is a display and not an indicator.
  aco-button:
    at: [9.15, 301.85]
    size: [3.97, 3.9]
    class: button
    description: >-
      the ACO momentary push button.
  lamp-test:
    at: [9.15, 311.45]
    size: [3.97, 3.9]
    class: button
    description: >-
      the LAMP TEST momentary push button.
