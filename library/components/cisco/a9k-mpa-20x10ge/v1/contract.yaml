  status:
    at: [14.5, 76.0]
    size: [2.6, 2.6]
    class: led
    description: >-
      the MPA's STATUS lamp. Table 33, 'Modular Port Adapter LEDs': off - modular port
      adapter power is not enabled; red on - has encountered an hardware error; amber on -
      power is on and there is activity; green on - ready and operational, there is no
      activity. Four states, transcribed. Note this is the FAMILY table and its STATUS
      rows are not contradicted by any per-card table, unlike its A/L rows.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - {name: red, color: '#d0021b'}
