format: 1
kind: module
name: a9k-mpa-20x10ge
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Cisco 20-Port 10 Gigabit Ethernet Modular Port Adapter with SFP+. The densest MPA in
  the family: twenty SFP+ ports as two double-stacked blocks of ten, each block five
  positions along the card by two across, with the A/L lamps in the light strip running
  between the two stacks. Seats in an A9K-MOD carrier; it is on the 400 Gigabyte
  carrier's explicit supported list.
size: {w: 34.54, h: 161.8, d: 170.18}
attrs:
  model: 'A9K-MPA-20X10GE'
  power-absent: not-published
  role: 'modular-port-adapter'
  sfp-plus: 20
  media: 'SFP+, 10 Gigabit Ethernet'
  weight-kg: 0.99
  eol: 'none-announced'
provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 21 panel lamps at dome 0.3 (one number, carried
    by 120 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE
    READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind of
    interpolated anyway... It's just to give it a realistic view instead of just being a
    flat 2d... All of the 3d stuff is going to be mostly conjecture unless the vendor
    provides that data.' So a proudness here is an interpolation for a realistic view, NOT a
    claim about the hardware, and the confidence token on every feature says so rather than
    leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE
    DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED
    figure reused for the same class of hardware, and these origins are not measured - they
    are the library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size.
  size: >-
    datasheet - Cisco ASR 9000 Series data sheet c78-735809, Table 3, 'Physical
    dimensions', which lists EVERY MPA by part number and gives them all the same three
    figures: '6.37 W x 1.36 H x 6.70 L', and a second line '6.37 W x 1.36 H x 8.30 L
    (including jackscrew)'. In millimetres, 161.80 long by 34.54 thick by 170.18 deep,
    or 210.82 deep with the jackscrew, which protrudes and is not part of the body. AN
    EARLIER VERSION OF THIS COMPONENT SAID 'NO document in the intake gives an MPA's
    dimensions' and used index.json's shapesheet instead, 33.81 x 160.02 (33.66 for the
    two 20-port masters). That claim was false. The shapesheet was a good proxy - 1.1
    percent short on the length and 2.1 to 2.6 on the thickness - and every measured
    coordinate on this faceplate is now scaled by the ratio of the two, which is exactly
    equivalent to having read the master at the stated anchor to begin with. THE
    CORROBORATION IS WORTH KEEPING: the A9K-MOD400-SE master draws its two MPA bays as
    outlines and, at that carrier's own 43.7 x 395.7 anchor, they measure 161.21 and
    160.94 mm long - 0.4 percent from Cisco's stated 161.80. Two Cisco documents, a
    drawing and a table, agreeing through a third part.
  frame: >-
    modelled PORTRAIT - x across the module's 33.8 mm thickness, y along its 160.0 mm
    length - which is how most of these masters are drawn and how every other card in
    this library is modelled. The ASR 9001 lays its two MPAs FLAT, so its bays rotate
    the component rather than the component carrying two orientations. Note the stencil
    is not consistent about this: A9K-MPA-1X40GE, -2X40GE and -8x10GE are drawn
    landscape and the rest portrait, for one physical form factor - which the intake
    notes flag as a reason to read the artwork rather than assume an orientation from
    index.json's axis order.
  ports: >-
    install guide - 'The 20-Port 10-Gigabit Ethernet (GE) modular port adapter (MPA)
    provides two 2x5 double-stacked cages for SFP+ Ethernet optical interface modules.'
    The master draws exactly that: two blocks of 29.27 x 71.71 mm at y 4.77 and 84.30,
    each holding five positions along the card on a 14.18 mm pitch and two across, at x
    5.11 and 22.50. Twenty openings of 10.72 x 14.19 mm against std/sfp's 14.5 x 10.0 -
    the same slight under-height every SFP cage in this stencil shows.
  numbering: >-
    drawing - THE MASTER NUMBERS ONLY THE FOUR END PORTS, and those four are enough. It
    prints no numerals as text and none was found until the artwork was rendered and
    looked at; they are outlined glyphs, four dark ink boxes outside the cage blocks at
    the two ends of the card. Reading them: at the top, x 9.13 width 2.48 mm and x 28.63
    width 1.84 mm; at the bottom, x 9.46 width 3.97 and x 26.46 width 3.95. The two
    columns of cages sit at x 5.11 to 15.83 and 22.50 to 33.22, so one numeral stands
    over each column at each end. THE WIDTHS SAY WHICH IS WHICH. At the top both are
    single digits and the narrower - 1.84 against 2.48 - is the figure one, so the top
    of the low-x column is 0 and the top of the high-x column is 1. At the bottom both
    are double width, so they are 18 and 19, and the only assignment consistent with 0
    and 1 above them is 18 under the 0 and 19 under the 1. That fixes the whole card:
    the low-x column carries the EVEN ports and the high-x column the ODD, ascending
    together down the length, 0-1 at the first position through 18-19 at the tenth. It
    is the same scheme the A9K-MPA-20X1GE prints - that master numbers its ends 0, 1,
    18, 19 as live text - which is the corroboration from a sibling that the reading is
    right rather than merely self-consistent.
  lamps: >-
    drawing, and the shapes had to be looked at rather than measured. The middle strip
    between the two stacks carries four small shapes per position and only two of them
    are lamps: rendered at 26 px/mm the outer four are the cage LATCH TABS, two at each
    end, and the middle two are a TRIANGLE PAIR pointing outward, one at each of the two
    stacked ports. That is what makes the count come right - two per position, ten per
    block, twenty for twenty ports - and it is what the guide describes: 'Each SFP+ cage
    on the 20-Port 10GE MPA has an adjacent A/L (Active/Link) LED visible on the front
    panel'. WHICH TRIANGLE BELONGS TO WHICH OF THE TWO STACKED PORTS is not established
    here: both sit at the same across-card x within half a millimetre, and the
    assignment follows the same positional convention as the numbering. If the numbering
    is ever corrected the lamp pairing moves with it.
  power: >-
    NOT PUBLISHED. Cisco does not state per-card power for this generation in any document
    that could be found, and the search was thorough enough to say so.
    WHAT WAS SEARCHED. All 573 converted documents, for this part number, with a
    twelve-line window either side and again with a thirty-line window against any line
    introducing a power requirement or consumption - no hit. The CANONICAL DATASHEETS are
    staged and converted (datasheet-c78-743580 for the 5th-generation high-density
    multi-rate cards, c78-743579, c78-744662 for the 400 GbE multi-rate card, c78-744663)
    and their product-specification tables run chassis compatibility, port density,
    performance, dimensions, weight, operating and storage temperature, humidity, EMC,
    immunity, safety and NEBS - and then stop. There is no power row.
    Cisco's own per-card power appendix EXISTS and does not cover this card: the ASR
    9000 Ethernet Line Card Installation Guide, Table 35 'Ethernet Line Card Power
    Consumption Values', gives 25/40/55 C figures for the previous generation and has no row
    for a 200 Gigabyte modular card, a 400G combo card or any FLEX part. That was checked
    against the guide's own part-number-to-description mapping table rather than by reading
    the prose.
    A web search in August 2026 returned only reseller listings, which are not a source
    for this library.
    THIS IS A VENDOR DISCLOSURE GAP, NOT AN INTAKE GAP - staging more documents will not
    close it. The remaining routes are the Cisco Power Calculator or asking Cisco directly,
    and if either produces a figure it belongs here.
  carrier: >-
    install guide - this MPA is named on the one explicit per-carrier list in the
    intake: 'The 400 Gigabyte Modular Line Cards only support the following MPAs ...
    20-Port 10-Gigabit Ethernet Modular Port Adapter (MPA) with SFP+'. A consumption-
    model variant A9K-MPA-20x10GE-CM exists as a separate part number for the
    A9K-MOD400-CM carrier and is not modelled - no master.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
elements:
  led-p0:
    at: [17.45, 9.76]
    size: [2.74, 1.97]
    class: led
    description: >-
      the port's A/L (Active/Link) lamp. NO PER-CARD LED TABLE EXISTS for this MPA - the
      guide gives one for the 20-port GE, the 2-, 4- and 8-port 10GE and both 40GE cards,
      and none for this one - so the vocabulary here is the family's Table 33, 'Modular
      Port Adapter LEDs', reduced to the three states its A/L rows name that have a
      colour: off - port is administratively shut down; green on - link is up; and the
      down state. Table 33 calls that down state RED where five of the six per-card tables
      call it AMBER; amber is carried because the majority of the per-card tables in this
      same family say so, and this is the one place in these seven MPAs where a state
      colour is a judgement rather than a transcription. Table 33's fourth row, 'Blinking
      ... The LED blinks green-amber-green', is a modulation of states already named and
      is not a fourth state. This one is port 0's.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
