<svg xmlns="http://www.w3.org/2000/svg" width="15.0mm" height="23.0mm" viewBox="0 0 15.0 23.0">
  <!-- The two-socket DC power connector of the ASR 9000 fixed-port DC supplies seen from its mating face: a shrouded body with two
       round sockets, one above the other, each with a pin at its centre ("+DC" above, "-DC" below, printed on the supply beside it).
       Shapes, sizes and colours are estimates; the guide's Figure 163 is line art and its Figure 162 a photograph of the supply. -->
  <rect id="body" x="0" y="0" width="15.0" height="23.0" rx="1.8" fill="#1d2023" stroke="#3c4045" stroke-width="0.25"/>
  <g id="sockets" fill="#0d0f11" stroke="#4a4f55" stroke-width="0.2">
    <rect x="2.0" y="0.9" width="11.0" height="9.2" rx="2.2"/>
    <rect x="2.0" y="12.9" width="11.0" height="9.2" rx="2.2"/>
  </g>
  <g id="pins" fill="#9a9fa5">
    <circle cx="7.5" cy="5.5" r="1.1"/>
    <circle cx="7.5" cy="17.5" r="1.1"/>
  </g>
</svg>
