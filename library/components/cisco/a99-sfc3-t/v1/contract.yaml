format: 1
kind: module
name: a99-sfc3-t
version: 1.0.0
class: fabric
profile: networking
description: >-
  Cisco ASR 9900 Series Third Generation Switch Fabric Card for the ASR 9906. Line-card
  width but longer than a line card at 492.1 mm. Two ejector levers, captive screws and
  a single tri-colour Status LED; no vent field.
size: {w: 43.7, h: 492.1}
attrs:
  model: 'A99-SFC3-T'
  role: 'switch-fabric'
  generation: '3rd'
  chassis: 'ASR 9906'
  power-draw-max-w: 110
  eol: 'none-announced'
provenance:
  relief: >-
    NO RELIEF FEATURE IS DECLARED AND THIS IS THE RECORD OF WHY. What should stand proud of
    this face: the status lamp, a domed lens on the real card. Each needs a depth in
    millimetres, and no document in the intake states one for any Cisco part. The searches,
    recorded so this can be overturned rather than repeated: every doc.md in the
    112-document intake for 'protrud', 'extends outward', 'stands proud' and 'clearance in
    front' - the ONLY vendor in the whole intake that publishes a projection is UfiSpace,
    whose S9510-28DC datasheet gives its fan and PSU handle travel, and no Cisco document
    does; the per-card dimension tables, Table A-10 of the older Ethernet Line Card
    Installation Guide and every data sheet's 'Physical dimensions (includes ejector
    bracket/lever)' row, which carry H, W, D and weight only - and where the ejector IS
    included it is included in the card's LONG axis, which this model already draws in 2D,
    not in its depth; and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR
    elevations with no side, top or isometric view, so it carries no depth axis to measure
    at all. The figures that DO show this hardware in three dimensions - Figure 48 of the
    Ethernet Line Card Installation Guide, 'Ejector Levers and Captive Screws', and Figure
    1-8 of the ISM guide - are perspective drawings with a vanishing point and no scale, so
    they are authoritative for WHAT IS THERE and for nothing about size. A lamp measured off
    a drawing whose aspect is wrong reads two different diameters and neither is the lens,
    so the drawing cannot supply this either. WHAT WOULD CLOSE IT: the lamp's part number,
    or a photograph of the part with a rule in frame. THIS PARAGRAPH IS ONE STATEMENT,
    WRITTEN ONCE BY THE CISCO RELIEF PASS AND INSERTED INTO THE 51 SIBLING CONTRACTS that
    share this hardware - it is a single search, not 51 agreeing readings.
  size: >-
    drawing - the stencil master, and for THIS master the shape box is usable where it
    was not for the cards. The card masters are padded: their shape box aspect (0.1166)
    disagrees with their own art (0.1122). This master's agrees - 0.1548 shape against
    0.1552 art for the -S, 0.0888 against 0.0890 for the -T - so the box is the art box,
    at the stencil's 1:10 inches, giving 76.2 x 492.1 mm and 43.7 x 492.1 mm. Checking
    the box against the art before using it is the whole of the method here; it is what
    caught the cards. NO document in the intake states a fabric card's dimensions.
  depth: >-
    NOT MODELLED. No document in the intake gives a fabric card's depth, and unlike the
    line cards there is no datasheet row to take it from. Rather than inherit the line
    cards' 604.5 - which would be a guess dressed as a measurement, and these cards do
    not even share the line cards' length - the component declares a faceplate and no
    body. It will render as a face rather than a box in 3D, and that is the honest
    depiction of what is known.
  lamp: >-
    install guide - Table 9, 'FC Card LED Display Definitions', of the Overview and
    Reference Guide. Four states, transcribed rather than reduced: green, red, amber and
    off, each with the sentence Cisco prints beside it. This is a sourced vocabulary,
    not the RSP's borrowed.
  chassis: >-
    datasheet - Third Generation Switch Fabric Card 3 Data Sheet, Table 3: 'A99-SFC3-T
    (supports ASR 9906 chassis)'.
  power: >-
    install guide - Table 23 of the Overview and Reference Guide, row 'A99-SFC3-T Card':
    105 W at 27 C, 108 W at 40 C, 110 W at 55 C. max is the highest rated ambient; no
    typical is stated.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
elements:
  status:
    at: [20.4, 358.4]
    size: [3.2, 3.2]
    class: led
    description: >-
      the single tri-colour Status LED. Table 9, 'FC Card LED Display Definitions', of
      the Overview and Reference Guide: green - FC card powered on and FPGA is
      programmed; red - fault or malfunction in FC card power up or FPGA programming;
      amber - FC card powered on but fabric not active; off - FC card powered off via
      CLI. Cisco's own note on the green state is worth carrying: 'Fabric Data Link
      failure is not detected so LED remains green'.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - {name: red, color: '#d0021b'}
    - 'off'
relief:
  wall: '#4a4f55'
skins: [default]
