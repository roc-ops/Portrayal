format: 1
kind: module
name: asr-9001-fan
version: 1.1.0
class: cooling
profile: networking
description: >-
  Cisco ASR 9001 fan module. A narrow 2RU-tall module that stands on one side of the
  fixed-port chassis rather than lying across it - the faceplate is a slotted vent, a
  STATUS lamp and two captive screws.
size: {w: 54.76, h: 88.19}
attrs:
  model: 'ASR-9001-FAN'
  role: 'fan-module'
  eol: 'none-announced'
provenance:
  body: >-
    NO `body:` BLOCK, AND THIS IS THE RECORD OF WHY. The renderer now admits class `cooling`
    to the set that draws a solid body and ejects (relief.js, commit 9e3d0cb), so this part
    is ELIGIBLE for one. It does not get one because a body needs a DEPTH and no document in
    the 112-document intake states this fan tray's: the ASR 9001 is a fixed-configuration
    chassis and its fan section gives no dimension. Both searches were run - the part number
    across every doc.md, and the field name ('depth', 'Physical specifications',
    'Dimensions') across every doc.md, in the current Overview and Reference Guide AND in
    the older asr9kOVRGbk revision, since vendors delete tables between revisions. Exactly
    ONE Cisco fan tray or power module in the whole intake has a published depth - the ASR
    9922/9912 tray, 23 inches, and it is stated in passing inside a sentence about a width
    change. WHAT WOULD CLOSE IT: a Cisco mechanical drawing, or the chassis interior
    measured from a photograph with a rule in frame. A body depth invented to make the part
    eject would be a solid-looking number in the one field a 3D viewer trusts absolutely,
    and `size.d` is deliberately absent for the same reason.
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 2 captive screw heads at cyl 1.6 (one number,
    carried by 63 Cisco contracts); 1 vent fields at vent 26 (one number, carried by 9 Cisco
    contracts); 1 panel lamps at dome 0.3 (one number, carried by 120 Cisco contracts).
    EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE READING OF WHAT RELIEF IS
    FOR. The owner's ruling: 'the whole 3d part is kind of interpolated anyway... It's just
    to give it a realistic view instead of just being a flat 2d... All of the 3d stuff is
    going to be mostly conjecture unless the vendor provides that data.' So a proudness here
    is an interpolation for a realistic view, NOT a claim about the hardware, and the
    confidence token on every feature says so rather than leaving it to be inferred. WHY
    `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE DOES COME FROM ANOTHER PORTRAYAL
    PART. `borrowed` is defined as another part's MEASURED figure reused for the same class
    of hardware, and these origins are not measured - they are the library's first guess at
    that hardware, and the contracts say so themselves: agr-panel-screw's provenance reads
    'estimated - it stands proud but was not measured', agr-psu-dc sources its latch's
    ARRANGEMENT from a photograph and never its proudness, agr-fan describes its handle and
    grille by appearance only, and common/led-dot's entire provenance is 'size: estimated'.
    Spelling that chain `borrowed` would convert a guess into an apparent measurement at one
    remove, a thousand times over. `source` still names the origin, so the coordinating
    benefit is kept and only the claim that is not true is dropped. READ THE COUNTS ABOVE AS
    THEY ARE MEANT: a figure carried by sixty-odd contracts is ONE ESTIMATE WRITTEN
    SIXTY-ODD TIMES, not sixty-odd readings that happened to agree. One caliper on any one
    Cisco captive screw, any one ejector lever or any one panel lamp corrects every part in
    the library that shares it, which is the whole reason the numbers are pooled instead of
    chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN FIRST AND IS RECORDED SO IT IS NOT
    REPEATED: all 112 doc.md extracts for 'protrud', 'extends outward', 'stands proud' and
    'clearance in front' - the only vendor in the intake that publishes a projection is
    UfiSpace, on the S9510-28DC; the per-card dimension tables, including Table A-10 of the
    older Ethernet Line Card Installation Guide which the current revision dropped, all of
    which carry H, W, D and weight only; and the ASR 9000 Visio stencil, whose 119 masters
    are FRONT and REAR elevations with no side, top or isometric view, so it holds no depth
    axis at all and is closed as a source. Figure 48 of the Ethernet Line Card Installation
    Guide and Figure 1-8 of the ISM guide DO show this hardware in three dimensions and are
    perspective drawings with a vanishing point, so they settle the ARRANGEMENT - bracket
    off the plate, lever along it, domed screw head proud of both - and nothing about size.
  size: >-
    drawing - the stencil master, both axes from index.json's shapesheet, 54.76 x 88.19
    mm. The 88.19 is the corroboration: it is the ASR 9001 chassis height the data sheet
    states, 3.472 in. (88.2 mm), so this module is the full height of the box it stands
    in, and the drawing and the data sheet agree without either being fitted to the
    other.
  lamp: >-
    drawing - the faceplate is printed STATUS beside one lamp. The four-state vocabulary
    carried here is the Overview and Reference Guide's 'Fan Tray Status Indicators'
    section, which describes the MODULAR chassis fan trays; the fixed-port guide gives
    no LED table for this module. So the states are BORROWED from a sibling part and
    that is stated rather than hidden - if the ASR 9001's fan lamp differs, this is the
    assumption to break first.
  power: >-
    NOT STATED. Table 24, 'Fan Tray Power Consumption Specifications', of the Overview
    and Reference Guide covers the ASR 9006, 9010, 9904, 9906, 9910, 9912 and 9922 trays
    and has no row for the ASR 9001. The fixed-port Hardware Installation Guide gives no
    per-module power for it either. So the figure is absent and the L27 warning stands.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
elements:
  status:
    at: [8.09, 42.2]
    size: [3.0, 3.0]
    class: led
    description: >-
      the fan tray's Run/Fail status LED, one per tray.
    states:
    - {name: green, color: '#39b54a'}
    - {name: yellow, color: '#f5c518'}
    - {name: red, color: '#d0021b'}
    - 'off'
relief:
  wall: '#4a4f55'
  features:
    - node: vent
      vent: 26
      confidence: estimated
      source: >-
        edgecore/agr-fan@1 grille - the library's one vent-cavity figure, described in that
        contract by appearance and not by depth
    - node: screw-t
      cyl: 1.6
      confidence: estimated
      source: >-
        edgecore/agr-panel-screw@1 - the library's one captive-screw-head figure, whose own
        provenance reads 'estimated - it stands proud but was not measured'
    - node: screw-b
      cyl: 1.6
      confidence: estimated
      source: >-
        edgecore/agr-panel-screw@1 - the library's one captive-screw-head figure, whose own
        provenance reads 'estimated - it stands proud but was not measured'
    - node: status
      dome: 0.3
      confidence: estimated
      source: >-
        common/led-dot@1 - the library's one panel-lamp figure. Its own provenance is 'size:
        estimated' and the dome carries none
skins: [default]
