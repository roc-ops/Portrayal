format: 1
kind: module
name: a9k-rsp
version: 1.2.0
class: supervisor
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9000 Series Route Switch Processor with 4 GB of DRAM, the ORIGINAL
  generation - the card the ASR 9006 and ASR 9010 shipped with before the RSP-440. Two
  SYNC timing ports, two management LAN ports, a console and an auxiliary port, a nine-
  pin alarm output, ACO and LAMPTEST push buttons, an eight-lamp cluster and the two
  removable-media carrier panels the later control cards do not have. No GPS bracket, no
  virtualization cluster ports and no USB: those arrive with the RSP-440. Both RSPs in a
  chassis must be the same version.
size: {w: 41.9, h: 406.4, d: 673.8}
attrs:
  model: 'A9K-RSP-4G'
  role: 'route-switch-processor'
  memory: '4 GB ECC DRAM'
  storage: '40 GB SAS HDD, 4 GB eUSB flash'
  mgmt: '2 x 100/1000 RJ-45'
  console: 'EIA/TIA-232 RJ-45'
  aux: 'EIA/TIA-232 RJ-45'
  timing: '2 x SYNC (BITS or J.211/UTI) RJ-45'
  alarm: 'nine-pin, dry-contact outputs'
  chassis: 'ASR 9006, ASR 9010'
  weight-kg: 8.16
  power-draw-typical-w: 170
  power-draw-max-w: 235
  eol: 'none-announced'
provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 8 panel lamps at dome 0.3 (one number, carried by
    120 Cisco contracts); 4 ejector brackets, their levers and the grip flanges at out 4.2
    (one number, carried by 61 Cisco contracts); 2 captive screw heads at cyl 1.6 (one
    number, carried by 63 Cisco contracts); 2 pushbuttons at cyl 1.2 (one number, carried by
    15 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE
    READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind of
    interpolated anyway... It's just to give it a realistic view instead of just being a
    flat 2d... All of the 3d stuff is going to be mostly conjecture unless the vendor
    provides that data.' So a proudness here is an interpolation for a realistic view, NOT a
    claim about the hardware, and the confidence token on every feature says so rather than
    leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE
    DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED
    figure reused for the same class of hardware, and these origins are not measured - they
    are the library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size. STILL REFUSED ON THIS FACE, and these
    are NOT the same kind of gap: the 1 drawn aperture(s) alarm-out - an optical or
    connector aperture that conforms to no published standard, so no depth exists to
    interpolate from; disk-0, disk-1, led-matrix - a hinged or sliding cover whose travel
    nothing states. The ruling sanctions interpolating a PROUDNESS for a realistic view. It
    does not sanction inventing an APERTURE, which is a dimension a specification is
    withholding rather than one nobody has measured.
  size: >-
    datasheet - data_sheet_c78-500699, the Cisco ASR 9000 Series Route Switch Processor
    data sheet, 'Physical specifications': 'Occupies one slot; dual redundant RSPs in 2
    slots in Cisco ASR 9010 and ASR 9006 chassis. Height: 1.65 in. (4.19 cm). Width: 16
    in. (40.64 cm). Depth: 26.53 in (67.38 cm). Weight: 18 lb (8.16 kgs).' Cisco's own
    centimetre column gives 41.9 x 406.4 x 673.8 mm and those are the numbers carried;
    the inch column rounds. Note the axis convention - Height is the THICKNESS here,
    which is the newer sheets' convention and not the original line cards'.
  how-this-was-found: >-
    THIS COMPONENT WAS FIRST BUILT WITH NO SOURCE FOR ITS SIZE AT ALL, and how that
    happened is worth more than quietly replacing it. The first version said 'NOT STATED
    ANYWHERE IN THE INTAKE' and took the A9K-RSP440's 42.0 x 406.0 because both masters
    share a drawing template, flagged as an inference; its depth was left unmodelled
    because the RSP-440's 674.0 looked like a later and deeper design. Those sentences
    were written after searching both installation guides and the stencil. THE CARD HAS
    ITS OWN DATA SHEET and it was in the intake the whole time. It was found by grepping
    all 78 documents for the string 'Power consumption' - an audit prompted by three
    earlier claims of vendor silence that turned out false - and not by searching for
    this part number. That is the lesson: the search that finds a thing is often not the
    search you would think to run for it. What the sibling inference got: 42.0 against a
    true 41.9, 406.0 against 406.4, and a depth declined on the reasoning that 674.0
    could not be right when the true figure is 673.8. It was very nearly correct and it
    was still the wrong way to get there.
  ruler-was-tried: >-
    THE STANDARD-PART RULER WAS TRIED HERE AND IT IS TOO BLUNT, kept because the method
    works elsewhere and this is the clearest record of its limit. This faceplate is full
    of RJ-45 jacks and std/rj45's opening is 16.0 x 14.0 mm from IEC 60603-7. Scale this
    master to 42.0 x 406.0 and its six jacks measure 12.8 x 16.67; scale it to 43.7 and
    they measure 13.32 x 16.67. Against a rotated 14.0 x 16.0 that is 8.6 percent under
    and 4.9 under - so THE RULER PREFERS 43.7, and the data sheet says 41.9. The ruler
    was not merely inconclusive, it pointed at the answer furthest from the truth. The
    reason is that the stencil draws these jacks about eight percent narrow, which is
    twice the spread between the candidate sizes: a ruler only discriminates when the
    drawing is more accurate than the difference being resolved. Contrast the
    A9K-MOD200, where the MPA gave 1.2 percent against 6.4 and settled it outright.
  ports: >-
    install guide - Table 22, 'RSP/RP Port Specifications', of the Overview and
    Reference Guide, a family table that covers this card: 'Console port: EIA/TIA-232
    RJ-45 interface ... 9600 Baud, 8 data, no parity, 2 stop bits with flow control none
    for all other RSP/RP cards'; 'Auxiliary port: EIA/TIA-232 RJ-45 interface, 9600
    Baud, 8 data, no parity, 1 stop bit with software handshake (default)'; 'Management
    ports (0, 1): Dual-speed (100M/1000M) RJ-45'; 'Sync ports (0, 1): can be configured
    as one of the following: BITS (Building Integrated Timing System) port, J.211 or UTI
    (Universal Timing Interface) port'. Six RJ-45 jacks, which is what the master draws,
    and the ids come from its own printed legends matched by position.
  power: >-
    TWO CISCO FIGURES THAT DISAGREE, both recorded. data_sheet_c78-500699, the Cisco ASR
    9000 Series Route Switch Processor data sheet gives 'Power consumption: Typical:
    170W. Maximum: 205W', with no ambient stated for either. Table 23 of the Overview
    and Reference Guide, row 'RSP Card', gives 175 W at 25 C, 205 W at 40 C and 235 W at
    55 C. They agree at 205 - the data sheet's maximum is Table 23's 40 C figure - and
    they differ in that Table 23 goes on to a 55 C rating the data sheet does not
    mention. power-draw-max-w carries 235 because a chassis budget must survive the
    highest ambient the vendor rates, and a figure that stops at 40 C is a maximum for a
    narrower question. power-draw-typical-w carries the data sheet's 170, which Table 23
    does not give for any card. WHICH ROW IS THIS PART: Table 23 names generations, not
    part numbers, and every other row carries a suffix - RSP-440, RSP-440 Lite, RSP-880,
    RSP880-LT, RSP4-S, RSP5 - so the bare 'RSP Card' row is the unsuffixed original. The
    Hardware Installation Guide names which parts those are: 'ASR 9000 Series Routers
    with RSP route switch processors (RSP-4G and RSP-8G)'. The two memory variants share
    one row and one data sheet.
  variants: >-
    datasheet - data_sheet_c78-500699, the Cisco ASR 9000 Series Route Switch Processor
    data sheet treats the two as ONE product entry: 'A9K-RSP-4G and A9K-RSP-8G: Route
    switch processor, bidirectional nonblocking fabric, controller, 40-GB hard drive',
    with a single physical specification block, a single power block, and the difference
    stated once - '4-GB Error-Correcting Code (ECC)-protected DRAM for A9K-RSP-4G; 8-GB
    ... for A9K-RSP-8G'. So one drawing serves both and the only thing that differs
    between these two components is the DRAM figure and the printed PID. The stencil has
    one master and it prints A9K-RSP-4G; the 8G's faceplate legend is substituted, which
    is the one thing here NOT taken from a drawing. Cisco adds an operational constraint
    worth carrying: 'RSP redundancy (both RSPs must be the same version, either
    A9K-RSP-4G or A9K-RSP-8G)' - a chassis may not mix them.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake, which for a
    first-generation control card is more likely a gap in the intake than a statement
    that the part is current.
elements:
  disk-0:
    at: [6.49, 212.37]
    size: [15.26, 65.68]
    class: cover
    description: >-
      the disk 0 carrier panel, read off the master. Cisco names the media in its lamp
      table - this card has both an HDD and a CF lamp - but no document in the intake says
      which panel is which, so the two are identified by position against the lamp column
      above them and that is an inference, not a citation.
  disk-1:
    at: [23.76, 212.35]
    size: [15.46, 64.06]
    class: cover
    description: >-
      the disk 1 carrier panel, read off the master. Cisco names the media in its lamp
      table - this card has both an HDD and a CF lamp - but no document in the intake says
      which panel is which, so the two are identified by position against the lamp column
      above them and that is an inference, not a citation.
  fail:
    at: [13.73, 317.72]
    size: [2.11, 2.11]
    class: led
    description: >-
      Power Fail (FAIL). Red: standby power fail; the LED is turned off by the CAN bus
      controller once it is up and running. Off: standby power is normal.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  sync:
    at: [19.38, 317.72]
    size: [2.11, 2.11]
    class: led
    description: >-
      Synchronization (SYNC). Green: system timing is synchronized to an external source.
      Amber: system timing is free running. Off: no system timing is configured.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  crit:
    at: [13.73, 324.58]
    size: [2.11, 2.11]
    class: led
    description: >-
      Critical Alarm (CRIT). Red: a critical alarm has occurred.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  hdd:
    at: [19.38, 324.58]
    size: [2.11, 2.11]
    class: led
    description: >-
      Internal Hard Disk Drive (HDD). Green: the hard disk is busy/active, driven by the
      SAS controller.
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  maj:
    at: [13.73, 331.42]
    size: [2.11, 2.11]
    class: led
    description: >-
      Major Alarm (MAJ). Red: a major alarm has occurred.
    states:
    - {name: red, color: '#d0021b'}
    - 'off'
  cf:
    at: [19.38, 331.42]
    size: [2.11, 2.11]
    class: led
    description: >-
      External Compact Flash (CF). Green: Compact Flash is busy/active.
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  min:
    at: [13.73, 338.28]
    size: [2.11, 2.11]
    class: led
    description: >-
      Minor Alarm (MIN). Amber: a minor alarm has occurred.
    states:
    - {name: amber, color: '#f5a623'}
    - 'off'
  aco:
    at: [19.38, 338.28]
    size: [2.11, 2.11]
    class: led
    description: >-
      Alarm Cutoff (ACO). Amber: alarm cutoff has been enabled - the ACO push button was
      pressed after at least one alarm occurred.
    states:
    - {name: amber, color: '#f5a623'}
    - 'off'
  led-matrix:
    at: [14.53, 357.28]
    size: [17.67, 7.8]
    class: display
    description: >-
      the four-character 5x7 LED dot-matrix display. What it shows is a message vocabulary
      - the guide gives it two sections, boot-stage/runtime and CAN bus controller errors
      - not a lamp state list, so it is a display and not an indicator.
  aco-button:
    at: [8.1, 295.9]
    size: [3.62, 3.7]
    class: button
    description: >-
      the ACO momentary push button.
  lamp-test:
    at: [8.1, 305.76]
    size: [3.62, 3.7]
    class: button
    description: >-
      the LAMP TEST momentary push button.
