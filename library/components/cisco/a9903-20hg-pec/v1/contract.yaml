format: 1
kind: module
name: a9903-20hg-pec
version: 1.0.0
class: line-card
profile: networking
description: >-
  Cisco ASR 9903 Series 2T Port Expansion Card. Twenty physical ports in two rows of ten
  - five 400GE QSFP-DD and fifteen 100GE QSFP28 - arranged as five groups of four, each
  group one QSFP-DD and three QSFP28. Configuring the QSFP-DD port for 400GE leaves the
  other three ports of its group unused. One of two optional PECs for the ASR 9903.
size: {w: 436.58, h: 38.73, d: 383.28}
attrs:
  model: 'A9903-20HG-PEC'
  role: 'port-expansion-card'
  qsfp-dd: 5
  qsfp28: 15
  throughput: '2 Tbps'
  weight-kg: 6.81
  port-groups: '5 groups of 4 (1 x QSFP-DD + 3 x QSFP28)'
  eol: 'none-announced'
provenance:
  relief: >-
    NO RELIEF FEATURE IS DECLARED AND THIS IS THE RECORD OF WHY. What should stand proud of
    this face: the captive screws; and the status lamp, a domed lens on the real card. Each
    needs a depth in millimetres, and no document in the intake states one for any Cisco
    part. The searches, recorded so this can be overturned rather than repeated: every
    doc.md in the 112-document intake for 'protrud', 'extends outward', 'stands proud' and
    'clearance in front' - the ONLY vendor in the whole intake that publishes a projection
    is UfiSpace, whose S9510-28DC datasheet gives its fan and PSU handle travel, and no
    Cisco document does; the per-card dimension tables, Table A-10 of the older Ethernet
    Line Card Installation Guide and every data sheet's 'Physical dimensions (includes
    ejector bracket/lever)' row, which carry H, W, D and weight only - and where the ejector
    IS included it is included in the card's LONG axis, which this model already draws in
    2D, not in its depth; and the ASR 9000 Visio stencil, whose 119 masters are FRONT and
    REAR elevations with no side, top or isometric view, so it carries no depth axis to
    measure at all. The figures that DO show this hardware in three dimensions - Figure 48
    of the Ethernet Line Card Installation Guide, 'Ejector Levers and Captive Screws', and
    Figure 1-8 of the ISM guide - are perspective drawings with a vanishing point and no
    scale, so they are authoritative for WHAT IS THERE and for nothing about size. The guide
    names the DRIVER ('a 3/16-inch flat-blade screwdriver') and the TORQUE (10 +/-1 in-lb),
    which fix neither the head diameter nor how far it stands proud. A lamp measured off a
    drawing whose aspect is wrong reads two different diameters and neither is the lens, so
    the drawing cannot supply this either. WHAT WOULD CLOSE IT: the captive screw's part
    number, the lamp's part number, or a photograph of the part with a rule in frame. THIS
    PARAGRAPH IS ONE STATEMENT, WRITTEN ONCE BY THE CISCO RELIEF PASS AND INSERTED INTO THE
    3 SIBLING CONTRACTS that share this hardware - it is a single search, not 3 agreeing
    readings.
  size: >-
    TWO NUMBERS, and which one this component carries matters. The Cisco ASR 9903
    Compact High-Performance Router Data Sheet gives 'Physical dimensions (H x W x D);
    weight': 1.47 x 16.31 x 15.09 in. (37.34 mm x 414.27 mm x 383.28 mm) for both PECs,
    which differ only in weight - 6.81 kg for the 2T against 5.82 kg (est.) for the
    800G. index.json's shapesheet gives 436.58 x 38.73 mm. The difference is 22.31 mm
    across and 1.39 mm high, which is an ejector at each end and a rail top and bottom.
    THE SHAPESHEET FIGURE IS CARRIED, for two reasons. First, a module's `size` in this
    library is its SLOT ENVELOPE - the bay it occupies - not its faceplate, and the
    faceplate is what the skin draws. Second, this datasheet's heading is bare '(H x W x
    D)' where every modular line-card sheet in the intake says '(includes ejector
    bracket/lever)', and the one other sheet that omits the qualifier - the dual-rate
    10GE pair - turned out to be quoting the plate rather than the envelope in exactly
    the same way. So 414.27 x 37.34 is recorded here as the plate and is what the
    drawing shows; 436.58 x 38.73 is the envelope and is what a bay is sized from. Both
    axes of the carried figure come from one source, which is the rule a power module
    3.66 mm too wide taught tonight.
  orientation: >-
    modelled LANDSCAPE, as the master draws it and as the card installs: the ASR 9903 is
    a 3RU fixed-port chassis and its PECs lie flat across the width. So unlike the
    modular-chassis line cards there is no portrait frame to undo here, and the std/
    apertures go in unrotated.
  lamps: >-
    drawing - two lamps, printed STATUS and OIR READY, read off the master. NO colour
    table for either is in the intake: the fixed-port Hardware Installation Guide's PEC
    sections cover installation, online insertion and removal, and port modes, and give
    no LED table at all. OIR READY therefore carries off/on and nothing more; STATUS
    carries the four-state card vocabulary the modular line cards use, which is a
    BORROWING from a sibling part and is flagged as one rather than presented as
    sourced.
  ports: >-
    install guide - '2T Port Expansion Card: The 2T Port Expansion Card has five 400GE
    QSFP-DD ports and fifteen 100GE QSFP28 ports. The 2T PEC can provide up to 2-Tbps
    throughput. You can group the ports into five groups of four ports each. Each group
    includes one QSFP-DD port and three QSFP28 ports. You can configure the QSFP-DD port
    with 400GE port rate in which case the other three physical ports in that port group
    are unused.' The master draws 20 cages at 18.98 x 8.96 mm against std/qsfp-ganged's
    18.5 x 9.58.
  which-are-dd: >-
    INFERRED, and the inference is stated because it is the one thing here that is not
    read off a document. The guide gives five groups of four with one QSFP-DD each, and
    prints '400/200/100G' beside some ports and '-/-/100G' or '-/100G/100G' beside
    others - so the drawing does distinguish them. What the guide does NOT say is which
    numbered port in each group is the QSFP-DD. Ports 0, 4, 8, 12 and 16 are modelled as
    the QSFP-DD, which is the first of each group of four; the '400/200/100G' legend
    does sit beside port 0 on the master. If the real card puts the QSFP-DD elsewhere in
    the group, this is the assumption to break, and the consequence is one cage 0.5 mm
    different from its neighbours.
  power: >-
    NOT STATED. The ASR 9903 data sheet gives a chassis power envelope and no per-card
    figure; the fixed-port guide's `show environment` example is from an ASR 9902, which
    has no PEC; and Table 35 of the Ethernet Line Card Installation Guide covers the
    modular-chassis cards only.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
