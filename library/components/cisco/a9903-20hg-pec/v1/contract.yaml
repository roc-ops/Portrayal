  model: 'A9903-20HG-PEC'
  role: 'port-expansion-card'
  qsfp-dd: 5
  qsfp28: 15
  throughput: '2 Tbps'
  weight-kg: 6.81
  port-groups: '5 groups of 4 (1 x QSFP-DD + 3 x QSFP28)'
  eol: 'none-announced'
provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 2 ejector brackets, their levers and the grip
    flanges at out 4.2 (one number, carried by 61 Cisco contracts); 2 captive screw heads at
    cyl 1.6 (one number, carried by 63 Cisco contracts); 2 panel lamps at dome 0.3 (one
    number, carried by 120 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS
    A DELIBERATE READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is
    kind of interpolated anyway... It's just to give it a realistic view instead of just
    being a flat 2d... All of the 3d stuff is going to be mostly conjecture unless the
    vendor provides that data.' So a proudness here is an interpolation for a realistic
    view, NOT a claim about the hardware, and the confidence token on every feature says so
    rather than leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY
    NUMBER HERE DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another
    part's MEASURED figure reused for the same class of hardware, and these origins are not
    measured - they are the library's first guess at that hardware, and the contracts say so
    themselves: agr-panel-screw's provenance reads 'estimated - it stands proud but was not
    measured', agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its
    proudness, agr-fan describes its handle and grille by appearance only, and
    common/led-dot's entire provenance is 'size: estimated'. Spelling that chain `borrowed`
    would convert a guess into an apparent measurement at one remove, a thousand times over.
    `source` still names the origin, so the coordinating benefit is kept and only the claim
    that is not true is dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried
    by sixty-odd contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings
    that happened to agree. One caliper on any one Cisco captive screw, any one ejector
    lever or any one panel lamp corrects every part in the library that shares it, which is
    the whole reason the numbers are pooled instead of chosen per card. THE SEARCH FOR A
    REAL FIGURE WAS RUN FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts
    for 'protrud', 'extends outward', 'stands proud' and 'clearance in front' - the only
    vendor in the intake that publishes a projection is UfiSpace, on the S9510-28DC; the
    per-card dimension tables, including Table A-10 of the older Ethernet Line Card
    Installation Guide which the current revision dropped, all of which carry H, W, D and
    weight only; and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR
    elevations with no side, top or isometric view, so it holds no depth axis at all and is
    closed as a source. Figure 48 of the Ethernet Line Card Installation Guide and Figure
    1-8 of the ISM guide DO show this hardware in three dimensions and are perspective
    drawings with a vanishing point, so they settle the ARRANGEMENT - bracket off the plate,
    lever along it, domed screw head proud of both - and nothing about size.
  size: >-
    TWO NUMBERS, and which one this component carries matters. The Cisco ASR 9903
    Compact High-Performance Router Data Sheet gives 'Physical dimensions (H x W x D);
    weight': 1.47 x 16.31 x 15.09 in. (37.34 mm x 414.27 mm x 383.28 mm) for both PECs,
    which differ only in weight - 6.81 kg for the 2T against 5.82 kg (est.) for the
    800G. index.json's shapesheet gives 436.58 x 38.73 mm. The difference is 22.31 mm
    across and 1.39 mm high, which is an ejector at each end and a rail top and bottom.
    THE SHAPESHEET FIGURE IS CARRIED, for two reasons. First, a module's `size` in this
    library is its SLOT ENVELOPE - the bay it occupies - not its faceplate, and the
    faceplate is what the skin draws. Second, this datasheet's heading is bare '(H x W x
    D)' where every modular line-card sheet in the intake says '(includes ejector
    bracket/lever)', and the one other sheet that omits the qualifier - the dual-rate
    10GE pair - turned out to be quoting the plate rather than the envelope in exactly
    the same way. So 414.27 x 37.34 is recorded here as the plate and is what the
    drawing shows; 436.58 x 38.73 is the envelope and is what a bay is sized from. Both
    axes of the carried figure come from one source, which is the rule a power module
    3.66 mm too wide taught tonight.
  orientation: >-
    modelled LANDSCAPE, as the master draws it and as the card installs: the ASR 9903 is
    a 3RU fixed-port chassis and its PECs lie flat across the width. So unlike the
    modular-chassis line cards there is no portrait frame to undo here, and the std/
    apertures go in unrotated.
  lamps: >-
    drawing - two lamps, printed STATUS and OIR READY, read off the master. NO colour
    table for either is in the intake: the fixed-port Hardware Installation Guide's PEC
    sections cover installation, online insertion and removal, and port modes, and give
    no LED table at all. OIR READY therefore carries off/on and nothing more; STATUS
    carries the four-state card vocabulary the modular line cards use, which is a
    BORROWING from a sibling part and is flagged as one rather than presented as
    sourced.
  ports: >-
    install guide - '2T Port Expansion Card: The 2T Port Expansion Card has five 400GE
    QSFP-DD ports and fifteen 100GE QSFP28 ports. The 2T PEC can provide up to 2-Tbps
    throughput. You can group the ports into five groups of four ports each. Each group
    includes one QSFP-DD port and three QSFP28 ports. You can configure the QSFP-DD port
    with 400GE port rate in which case the other three physical ports in that port group
    are unused.' The master draws 20 cages at 18.98 x 8.96 mm against std/qsfp-ganged's
    18.5 x 9.58.
  which-are-dd: >-
    INFERRED, and the inference is stated because it is the one thing here that is not
    read off a document. The guide gives five groups of four with one QSFP-DD each, and
    prints '400/200/100G' beside some ports and '-/-/100G' or '-/100G/100G' beside
    others - so the drawing does distinguish them. What the guide does NOT say is which
    numbered port in each group is the QSFP-DD. Ports 0, 4, 8, 12 and 16 are modelled as
    the QSFP-DD, which is the first of each group of four; the '400/200/100G' legend
    does sit beside port 0 on the master. If the real card puts the QSFP-DD elsewhere in
    the group, this is the assumption to break, and the consequence is one cage 0.5 mm
    different from its neighbours.
  power: >-
    NOT STATED. The ASR 9903 data sheet gives a chassis power envelope and no per-card
    figure; the fixed-port guide's `show environment` example is from an ASR 9902, which
    has no PEC; and Table 35 of the Ethernet Line Card Installation Guide covers the
    modular-chassis cards only.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
elements:
  status:
    at: [14.5, 19.5]
    size: [2.6, 2.6]
    class: led
    description: >-
      the STATUS lamp.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - {name: red, color: '#d0021b'}
    - 'off'
  oir-ready:
    at: [14.5, 26.0]
    size: [2.6, 2.6]
    class: led
    description: >-
      the OIR READY lamp, printed beside STATUS. No colour table for either lamp is in the
      intake - the fixed-port guide's PEC sections cover installation and port modes and
      give no LED table - so OIR READY carries off/on and STATUS carries the four-state
      card vocabulary the modular line cards use, which is a borrowing and is said so
      here.
    states:
    - 'off'
    - 'on'
