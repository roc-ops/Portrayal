    - {name: amber, color: '#f5a623'}
    - {name: red, color: '#d0021b'}
    - 'off'
  oir-ready:
    at: [14.5, 26.0]
    size: [2.6, 2.6]
    class: led
    description: >-
      the OIR READY lamp, printed beside STATUS. No colour table for either lamp is in the
      intake - the fixed-port guide's PEC sections cover installation and port modes and
      give no LED table - so OIR READY carries off/on and STATUS carries the four-state
      card vocabulary the modular line cards use, which is a borrowing and is said so
      here.
    states:
    - 'off'
    - 'on'
