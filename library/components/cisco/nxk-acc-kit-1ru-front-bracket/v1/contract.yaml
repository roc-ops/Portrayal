format: 1
kind: component
name: nxk-acc-kit-1ru-front-bracket
version: 1.0.0
class: bracket
behaviour: mounts
profile: networking
description: >-
  The front rack-mount bracket of the Cisco NXK-ACC-KIT-1RU rack-mount kit, two to a kit.
  A flat flange that screws to the side of a Nexus 9300 fixed switch and to the front rack
  posts. Drawn as a plain plate: no guide dimensions it.
size: {w: 21.6, h: 43.5}
size-confidence: {w: estimated, h: estimated}
provenance:
  model: >-
    datasheet - the kit's contents table in the Cisco N93180YC-FX3 NX-OS Mode Switch Hardware
    Installation Guide, appendix D, "Rack Mount Kit NXK-ACC-KIT-1RU": "Front brackets (2)",
    "Rear brackets (2)", "Slider rails (2)", "M4 Phillips pan-head screws (10)". Installing
    the Switch Using the NXK-ACC-KIT-1RU Rack-Mount Kit calls them "Front rack-mount
    brackets (2)", and the FX3S and 93108TC-FX3 guides repeat it.
  size: >-
    estimated - NO GUIDE DIMENSIONS THIS PART. The width is derived: the guide's clearance
    figure gives the chassis width as 17.3 in (43.9 cm) and the width with two rack-mount
    brackets attached as 19.0 in (48.3 cm), so each bracket reaches 0.85 in, 21.6 mm,
    beyond the chassis side. The height is the 1 RU the bracket serves, less a small margin,
    and is the same round figure as common/rack-ear@1's. The part is a plate with no hole
    drawn: the guide's rack-mounting figure (art number 503557) draws a column of slots in
    the flange that this part does not place.
skins: [default]
