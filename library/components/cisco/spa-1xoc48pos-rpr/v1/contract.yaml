format: 1
kind: module
name: spa-1xoc48pos-rpr
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Cisco 1-Port OC-48/STM16 SPA, a single-height shared port adapter for the ASR 9000
  SIP-700. 'The 1-Port OC48-POS/RPR SPA has one duplex LC-type receptacle.' Optics SFP-
  OC48-SR, -IR1, -LR2. And the faceplate's second opening: 'The 40-pin connector on the
  1-Port OC-48/STM-16 POS SPA is used for resilient packet ring (RPR) connections.' Seats in
  a SIP-700 SPA subslot; it is a module, not a device.
size: {w: 17.29, h: 167.87}
attrs:
  model: 'SPA-1XOC48POS/RPR'
  role: 'shared-port-adapter'
  form-factor: 'single-width, single-height (one SIP-700 subslot)'
  ports: 1
  media: 'SFP, OC-48/STM-16 POS/RPR, 2.488 Gbps'
  min-ios-xr: '5.1.1'
  min-hardware-revision: '1.0'
  eol: 'none-announced'
provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 8 panel lamps at dome 0.3 (one number, carried by
    120 Cisco contracts); 2 captive screw heads at cyl 1.6 (one number, carried by 63 Cisco
    contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE READING OF WHAT
    RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind of interpolated anyway...
    It's just to give it a realistic view instead of just being a flat 2d... All of the 3d
    stuff is going to be mostly conjecture unless the vendor provides that data.' So a
    proudness here is an interpolation for a realistic view, NOT a claim about the hardware,
    and the confidence token on every feature says so rather than leaving it to be inferred.
    WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE DOES COME FROM ANOTHER
    PORTRAYAL PART. `borrowed` is defined as another part's MEASURED figure reused for the
    same class of hardware, and these origins are not measured - they are the library's
    first guess at that hardware, and the contracts say so themselves: agr-panel-screw's
    provenance reads 'estimated - it stands proud but was not measured', agr-psu-dc sources
    its latch's ARRANGEMENT from a photograph and never its proudness, agr-fan describes its
    handle and grille by appearance only, and common/led-dot's entire provenance is 'size:
    estimated'. Spelling that chain `borrowed` would convert a guess into an apparent
    measurement at one remove, a thousand times over. `source` still names the origin, so
    the coordinating benefit is kept and only the claim that is not true is dropped. READ
    THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd contracts is ONE
    ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened to agree. One
    caliper on any one Cisco captive screw, any one ejector lever or any one panel lamp
    corrects every part in the library that shares it, which is the whole reason the numbers
    are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN FIRST AND IS
    RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud', 'extends
    outward', 'stands proud' and 'clearance in front' - the only vendor in the intake that
    publishes a projection is UfiSpace, on the S9510-28DC; the per-card dimension tables,
    including Table A-10 of the older Ethernet Line Card Installation Guide which the
    current revision dropped, all of which carry H, W, D and weight only; and the ASR 9000
    Visio stencil, whose 119 masters are FRONT and REAR elevations with no side, top or
    isometric view, so it holds no depth axis at all and is closed as a source. Figure 48 of
    the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide DO show this
    hardware in three dimensions and are perspective drawings with a vanishing point, so
    they settle the ARRANGEMENT - bracket off the plate, lever along it, domed screw head
    proud of both - and nothing about size.
  size: >-
    NO CISCO DOCUMENT IN THIS INTAKE STATES ANY SPA DIMENSION. THIS SENTENCE IS THE SAME
    SENTENCE ON ALL 24 SPA COMPONENTS: it is ONE derivation, not 24 measurements, and the
    next reader should count it once. Searches run before writing it: 'Physical dimensions',
    'Physical specifications', 'dimension', 'weight', 'inches' and 'mm' across all 104 PDFs
    of the intake rendered to text, plus the SIP and SPA Hardware Installation Guide read
    end to end. What the guide has is Table 6, 'Cisco ASR 9000 SIP-700 Physical
    Specifications', whose 'Physical dimensions' row reads 'Occupies one line card slot on a
    Cisco ASR 9000 Series Aggregation Services Router' - a heading that promises coverage
    its row does not have. The SPA data sheet, data_sheet_c78-688005 'Cisco ASR 9000 Series
    Shared Port Adapter Support', is an ordering list: it points at a URL for specifications
    and gives none. WHAT THE NUMBER IS: the SIP-700's own subslot band, measured off Cisco's
    stencil master by whoever built library/components/cisco/a9k-sip-700 and recorded there
    as bays 17.29 x 167.87 mm. That is the OPENING this SPA seats in, and this library's
    convention (the note bay-size-vs-component-size.md under working/notes) is that a bay
    and its occupant carry the same envelope, so the occupant takes the band. THE HALVING IS
    A JUDGEMENT AND NOT MINE: the SIP-700's own provenance.bay-split says the divider
    between the left and right subslots is not drawn on the master and the middle was
    assumed. AND THE FIGURE DOES NOT AGREE WITH IT ALONG THE LONG AXIS. Scale each faceplate
    figure so its drawn plate is 167.87 mm and two independent standard apertures come out
    oversized: the SFP bezel opening reads 16.5 mm against SFF-8432's 14.5, and the ganged
    RJ-45 pitch on the 8-port T1/E1 SPA reads 17.9 mm against this library's measured 13.99.
    Scale the same figures by those apertures instead and the plate is 131 to 148 mm long -
    but the ACROSS axis then reads 16.3 to 16.9 mm against the band's 17.29, agreeing to 3
    per cent. So the two axes disagree about which reading is right, and nothing in the
    intake settles it. The likeliest reconciliation is that the 167.87 band includes the
    SPA's end brackets and captive jackscrews, which every faceplate figure draws OUTSIDE
    the plate body, and the plate itself is nearer 145 mm - but that is a reading, not a
    measurement, and the number carried here is the band.
  form-factor: >-
    install guide - THIS PARAGRAPH IS SHARED BY ALL 24 SPA COMPONENTS. The guide uses TWO
    AXIS VOCABULARIES for one form factor and never reconciles them. The SIP-700 chapter
    says width for the axis across the card and height for the axis along it - 'The Cisco
    ASR 9000 SIP-700 supports a maximum of 2 single-width, double-height SPAs, 4 single-
    width, single-height SPAs, 2 double-width, single-height SPAs' - and Figure 2's caption,
    'the Cisco ASR 9000 SIP-700 faceplate with 2 double-width, single-height SPAs', is drawn
    as two panels each spanning the full 34.58 mm across the card. Table 7 uses the opposite
    naming for the same shape: 'Double height single width SPA in Subslot 0, Bay 3', against
    a figure in which that SPA is the one spanning both levels across the card. Table 10,
    the supported-SPA list, is in TABLE 7's vocabulary - it calls SPA-2XCHOC12/DS0 double-
    height, and Figure 6 draws that part's plate at twice the thickness and the same length
    as a single. So: `double-height` in Table 10 and `double-width` in the SIP-700 prose are
    the SAME PHYSICAL THING, a plate about 34.58 mm across and the same length as a single,
    filling two subslots SIDE BY SIDE. The attrs key here is written in the SIP-700
    chapter's vocabulary, because that is the chapter the seating geometry comes from, and
    the drawing is what settles the shape. FOR THIS PART the sources agree on single-height:
    Table 10's row reads 'single-height' and the faceplate figure draws a single-height
    plate.
  ports: >-
    install guide - Table 10: '1-Port OC-48/STM16 SPA ... 1 OC48 ... single-height'. Its row
    is the only one in the table with TWO minimum-release/revision pairs: 5.1.1 with
    hardware revision 1.0 and 6.3.1 with revision 2.0.. 'The 1-Port OC48-POS/RPR SPA has one
    duplex LC-type receptacle.' Optics SFP-OC48-SR, -IR1, -LR2. And the faceplate's second
    opening: 'The 40-pin connector on the 1-Port OC-48/STM-16 POS SPA is used for resilient
    packet ring (RPR) connections.'
  leds: >-
    install guide - 'The 1-Port OC48-POS/RPR SPA has eight LEDs' and Table 13 gives all
    eight: WRAP, PASSTHRU, MATESYNC, C/A, A/L, CARRIER, ACTIVE, STATUS. The guide adds 'The
    WRAP, PASSTHRU, and MATESYNC LEDs apply to the SPA in RPR/SRP mode only.' CARRIER
    carries a fourth row with no colour of its own - 'Blinking: SRP mode mismatch alarm is
    indicated' - which is a modulation of amber, not a fourth state, so it is recorded here
    rather than added to the vocabulary. Lamp positions are fractions of the drawn plate
    (see provenance.figure); lamp SIZE is the figure's own 6 x 4 px at that scale and is not
    a Cisco dimension. The state vocabularies are transcribed from this part's own LED
    table, named in each element's description, and NOT from a sibling's - the SPA sections
    in this guide word the same lamp differently often enough that borrowing one would be a
    false citation.
  figure: >-
    install guide - Figure 11, '1-Port OC-48/STM16 SPA Faceplate'. THIS SENTENCE IS SHARED
    BY ALL 24 SPA COMPONENTS and describes the drawings as a class. The faceplate figures
    are RASTERS embedded in the PDF at about 570 px across, which is roughly 2.7 px/mm at
    the plate scale used here, so no position below is better than about +/- 0.4 mm and none
    of them is stated more precisely than the millimetre. GATE 1, on the axis it can be run
    on: the drawn plate's thickness-to-length ratio is 0.107 against the 0.103 the SIP-700's
    subslot band implies, agreeing to 4 per cent, and a single-height plate and a double-
    height plate differ by the factor of two the guide's vocabulary requires - so the
    figures are orthographic and their FRACTIONS carry geometry. They do not carry absolute
    scale: see provenance.size. Every position on this component is therefore a fraction of
    the drawn plate mapped onto the band, and every standard aperture is placed at its
    measured CENTRE at the size the registry gives it rather than at the size the figure
    draws it. FIGURE 11'S PLATE CARRIES TWO PART NUMBERS. It prints 'SPA-1XOC48POS/RPR'
    along the top right and 'SPA-1XOC12-POS' below it, on one faceplate. Only the first is
    this part; the second belongs to a different SPA whose own figure is Figure 41. The
    drawing is a reused master that was relabelled without the old legend being removed, and
    it is a reason to trust its layout more than its lettering.
  power: >-
    NOT STATED. No document in this intake gives a power figure for any SPA: not the SIP and
    SPA Hardware Installation Guide, which has no power table at all; not
    data_sheet_c78-688005, the SPA data sheet, which is an ordering list; and not Table 35
    of the Ethernet Line Card Installation Guide, whose rows are line cards and carriers. So
    no power-draw key is written and lint L27 stands - that warning is the record. AND THE
    SCOPE QUESTION IS OPEN AT THE OTHER END TOO: the SIP-700 states 375 W maximum without
    saying whether the measurement was taken with SPAs seated or bare, so a budget cannot be
    closed from this end either. See a9k-sip-700's provenance.power.
  lifecycle: >-
    searched - no end-of-life notice for SPA-1XOC48POS/RPR is in this intake. Table 10 gives
    this part a minimum IOS XR release of 5.1.1 and a minimum hardware revision of 1.0,
    which is a support floor and not a lifecycle statement.
elements:
  led-wrap:
    at: [5.02, 5.96]
    size: [2.2, 1.4]
    class: led
    description: >-
      the SPA's WRAP lamp, which describes the RPR ring rather than the port. Table 13 of
      the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - port is not
      in wrap mode; green on - port is in wrap mode somewhere on the ring; amber on - port
      is in wrap mode locally. Cisco: 'The WRAP, PASSTHRU, and MATESYNC LEDs apply to the
      SPA in RPR/SRP mode only.'
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  led-passthru:
    at: [5.02, 12.24]
    size: [2.2, 1.4]
    class: led
    description: >-
      the SPA's PASSTHRU lamp. Table 13 of the Cisco ASR 9000 Series SIP and SPA Hardware
      Installation Guide: off - port is not in pass-through mode; amber on - port is in
      pass-through mode. Cisco: 'The WRAP, PASSTHRU, and MATESYNC LEDs apply to the SPA in
      RPR/SRP mode only.'
    states:
    - {name: amber, color: '#f5a623'}
    - 'off'
  led-matesync:
    at: [5.02, 18.53]
    size: [2.2, 1.4]
    class: led
    description: >-
      the SPA's MATESYNC lamp, which describes the mate link through the 40-pin connector.
      Table 13 of the Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off -
      mate port is not synchronized; green on - mate port is synchronized. Cisco: 'The WRAP,
      PASSTHRU, and MATESYNC LEDs apply to the SPA in RPR/SRP mode only.'
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  led-ca-p0:
    at: [0.7, 57.72]
    size: [2.2, 1.4]
    class: led
    description: >-
      the port's C/A (Carrier/Alarm) lamp. Table 13 of the Cisco ASR 9000 Series SIP and SPA
      Hardware Installation Guide: off - port is not enabled by software; green on - port is
      enabled by software; amber on - port is enabled by software, and there is at least one
      alarm.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  led-al-p0:
    at: [5.02, 57.72]
    size: [2.2, 1.4]
    class: led
    description: >-
      the port's A/L (Active/Loopback) lamp. Table 13 of the Cisco ASR 9000 Series SIP and
      SPA Hardware Installation Guide: off - port is not enabled by software; green on -
      port is enabled by software, loopback is off; amber on - port is enabled by software,
      loopback is on.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  led-carrier-p0:
    at: [5.02, 68.81]
    size: [2.2, 1.4]
    class: led
    description: >-
      the port's CARRIER lamp. Table 13 of the Cisco ASR 9000 Series SIP and SPA Hardware
      Installation Guide: off - port is not enabled by software; green on - port is enabled
      by software, and there is a valid SONET signal without alarms; amber on - at least one
      alarm (LOS, LOF, RDI, and so on); blinking - SRP mode mismatch alarm is indicated. The
      blinking row carries no colour of its own and is recorded here rather than added to
      the vocabulary.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  led-active-p0:
    at: [5.02, 75.84]
    size: [2.2, 1.4]
    class: led
    description: >-
      the port's ACTIVE lamp. Table 13 of the Cisco ASR 9000 Series SIP and SPA Hardware
      Installation Guide: off - port is not enabled by software; green on - port is enabled
      by software, and loopback is off; amber on - port is enabled by software, and loopback
      is on.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
  status:
    at: [7.91, 166.03]
    size: [2.2, 2.2]
    class: led
    description: >-
      the SPA's STATUS lamp, the one lamp every SPA in this guide carries. Table 13 of the
      Cisco ASR 9000 Series SIP and SPA Hardware Installation Guide: off - SPA power is off;
      green on - SPA is ready and operational; amber on - SPA power is on and good, and the
      SPA is being configured.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
