format: 1
kind: module
name: a9k-20hg-flex-tr
version: 1.0.0
class: line-card
profile: networking
description: >-
  Cisco ASR 9000 Series 2T Packet Transport Combo Line Card, 5th generation. Twenty 100
  Gigabit Ethernet ports - fifteen QSFP28 and five QSFP-DD - for 20x100G, or 5x200G, or
  5x400G, or any mix up to 2 Tbps. The five QSFP-DD ports are ports 0, 7, 8, 12 and 19,
  and each is upgraded to 400GE by a per-port licence.
size: {w: 41.4, h: 395.7, d: 604.5}
