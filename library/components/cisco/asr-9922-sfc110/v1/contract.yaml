format: 1
kind: module
name: asr-9922-sfc110
version: 1.0.0
class: fabric
profile: networking
description: >-
  Cisco ASR 9922 Router Switch Fabric Card, first generation. One switch fabric plane
  for an ASR 9922. UNLIKE ITS 9912 NAMESAKE THIS IS A DIFFERENT DRAWING from the SFC3
  family: a much denser perforation covering nearly the whole plate rather than the
  SFC3's hex band, long ejector levers running a seventh of the card's length, and a
  stiffening pad at mid-length. The two SFC110s share a naming convention and nothing
  else.
size: {w: 41.4, h: 395.7}
attrs:
  model: 'ASR-9922-SFC110'
  role: 'switch-fabric'
  generation: '1st'
  chassis: 'ASR 9922'
  eol: 'none-announced'
provenance:
  size: >-
    drawing - the stencil master, read the way the line cards were. Its shape box is the
    padded 1.72 x 14.75 in that every card-envelope master in this stencil carries and
    is not the part; the art measures a plate of 44.06 x 358.8 mm inside a 395.7 mm
    envelope, and 395.7 is Cisco's own stated line-card W, the one the spec table says
    'includes ejector bracket/lever'. w is normalised to the line cards' 41.4 so that a
    fabric slot and a line-card slot are the same opening where a chassis shares them.
    NO datasheet states a fabric card's dimensions - the SFC3 and SFC2 data sheets carry
    a specifications table with no physical row at all - so this is stencil-derived, and
    the corroboration is that the art is the same drawing, at the same scale, as the
    cards whose dimensions ARE stated.
  depth: >-
    NOT MODELLED. No document in the intake gives a fabric card's depth, and unlike the
    line cards there is no datasheet row to take it from. Rather than inherit the line
    cards' 604.5 - which would be a guess dressed as a measurement, and these cards do
    not even share the line cards' length - the component declares a faceplate and no
    body. It will render as a face rather than a box in 3D, and that is the honest
    depiction of what is known.
  lamp: >-
    install guide - Table 9, 'FC Card LED Display Definitions', of the Overview and
    Reference Guide. Four states, transcribed rather than reduced: green, red, amber and
    off, each with the sentence Cisco prints beside it. This is a sourced vocabulary,
    not the RSP's borrowed.
  vendor-silence: >-
    THIS PART NUMBER APPEARS IN NO DOCUMENT IN THE INTAKE. Not in the Overview and
    Reference Guide, not in the Hardware Installation Guide, not in any data sheet and
    not in any of the three release-note inventories, which between them name
    ASR-9922-FAN, ASR-9922-RP, ASR-9922-FLTR, ASR-9922-AC and ASR-9912-SFC220 but never
    this. The only place it exists is the stencil master's own name. Everything below is
    therefore either drawn from the artwork or deliberately absent, and this component
    sits alongside the three vendor-silent line cards on the same footing: the art is
    real, the specifications do not exist to be cited.
  geometry: >-
    drawing - measured off this master and NOT inherited. The check that made that
    necessary: the ASR-9912-SFC110 master matches the A99-SFC3's on thirty-two of
    thirty-two features to 0.44 mm, so it could borrow that geometry outright, while
    this one shares none of it. Its vent is a single image-backed perforation field of
    30.94 x 317.82 mm where the SFC3's is a 25.75 mm hex band; its ejector levers are
    10.22 x 50.70 mm blocks against the SFC3's small grips; and it carries a mid-length
    pad the SFC3 has no counterpart for. Two cards with the same suffix in the same
    stencil, drawn differently - which is worth stating because the obvious shortcut
    here would have been wrong. The mid-length pad is carried at its measured 5.36,
    193.47, 32.17 x 10.25 mm and drawn in plate metal over the perforation, which is
    what the master shows: a stiffener standing proud of the vent field. The ejector
    levers are NOT carried at their measured 10.22 x 50.70 mm - drawn full size they
    would run a seventh of the card and cover the vent and the PID band. They are
    reduced to grips at the same x and the levers' own ends, which is the level of
    detail every other fabric card in this library is drawn at.
  chassis: >-
    INFERRED FROM THE PART NUMBER, which is the weakest kind of source and is labelled
    as such. ASR-99xx- prefixed parts in this family are chassis-specific by
    construction - ASR-9922-FAN, ASR-9922-RP, ASR-9922-FLTR all are, and the guide says
    outright that ASR-9912-SFC110 is the 9912's fabric card. No document says this one
    is the 9922's. It is a sound reading of Cisco's own naming and it is not a citation.
  power: >-
    NOT STATED FOR THIS PART NUMBER, and the near miss is the reason to be careful
    rather than a reason to guess. Table 23 of the Overview and Reference Guide has a
    row 'FC Card (ASR 9922)' at 135 W at 25 C, 147 at 40 and 160 at 55, and it is very
    likely this card. It is NOT carried, because that heading names a GENERATION and a
    chassis, not a part number. On the 9912 the same join IS licensed - the guide states
    in prose that ASR-9912-SFC110 is the FC for that chassis - and no equivalent
    sentence exists for the 9922. Taking the row anyway would make the two components
    look equally well sourced when one rests on Cisco's words and the other on my
    analogy. The figure is left out and the L27 warning stands, which is the correct
    signal.
  lifecycle: >-
    searched - nothing. Consistent with a part number that appears in no document at
    all, and not evidence that the part is current.
elements:
  status:
    at: [33.4, 362.4]
    size: [3.2, 3.2]
    class: led
    description: >-
      the single tri-colour Status LED. Table 9, 'FC Card LED Display Definitions', of
      the Overview and Reference Guide: green - FC card powered on and FPGA is
      programmed; red - fault or malfunction in FC card power up or FPGA programming;
      amber - FC card powered on but fabric not active; off - FC card powered off via
      CLI. Cisco's own note on the green state is worth carrying: 'Fabric Data Link
      failure is not detected so LED remains green'.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - {name: red, color: '#d0021b'}
    - 'off'
relief:
  wall: '#4a4f55'
skins: [default]
