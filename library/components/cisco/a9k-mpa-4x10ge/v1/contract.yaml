description: >-
  Cisco 4-Port 10 Gigabit Ethernet Modular Port Adapter with XFP. Four XFP cages down
  the faceplate, each with an A/L lamp beside it, plus a STATUS lamp and a captive screw
  at each end. One of the four MPAs the ASR 9001 takes; it also seats in the A9K-MOD
  carrier line cards.
