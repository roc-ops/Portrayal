provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 5 panel lamps at dome 0.3 (one number, carried by
    120 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE
    READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind of
    interpolated anyway... It's just to give it a realistic view instead of just being a
    flat 2d... All of the 3d stuff is going to be mostly conjecture unless the vendor
    provides that data.' So a proudness here is an interpolation for a realistic view, NOT a
    claim about the hardware, and the confidence token on every feature says so rather than
    leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE
    DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED
    figure reused for the same class of hardware, and these origins are not measured - they
    are the library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size.
  size: >-
    datasheet - Cisco ASR 9000 Series data sheet c78-735809, Table 3, 'Physical
    dimensions', which lists EVERY MPA by part number and gives them all the same three
    figures: '6.37 W x 1.36 H x 6.70 L', and a second line '6.37 W x 1.36 H x 8.30 L
    (including jackscrew)'. In millimetres, 161.80 long by 34.54 thick by 170.18 deep,
    or 210.82 deep with the jackscrew, which protrudes and is not part of the body. AN
    EARLIER VERSION OF THIS COMPONENT SAID 'NO document in the intake gives an MPA's
    dimensions' and used index.json's shapesheet instead, 33.81 x 160.02 (33.66 for the
    two 20-port masters). That claim was false. The shapesheet was a good proxy - 1.1
    percent short on the length and 2.1 to 2.6 on the thickness - and every measured
    coordinate on this faceplate is now scaled by the ratio of the two, which is exactly
    equivalent to having read the master at the stated anchor to begin with. THE
    CORROBORATION IS WORTH KEEPING: the A9K-MOD400-SE master draws its two MPA bays as
    outlines and, at that carrier's own 43.7 x 395.7 anchor, they measure 161.21 and
    160.94 mm long - 0.4 percent from Cisco's stated 161.80. Two Cisco documents, a
    drawing and a table, agreeing through a third part.
  frame: >-
    modelled PORTRAIT - x across the module's 33.8 mm thickness, y along its 160.0 mm
    length - which is how most of these masters are drawn and how every other card in
    this library is modelled. The ASR 9001 lays its two MPAs FLAT, so its bays rotate
    the component rather than the component carrying two orientations. Note the stencil
    is not consistent about this: A9K-MPA-1X40GE, -2X40GE and -8x10GE are drawn
    landscape and the rest portrait, for one physical form factor - which the intake
    notes flag as a reason to read the artwork rather than assume an orientation from
    index.json's axis order.
  cages: >-
    COMPOSED from std/xfp, which did not exist when these two were first deferred. The
    XFP bezel opening is 19.5 +/-0.1 by 9.7 +/-0.2 with R0.5 MAX corners, dimensioned
    identically in Figure 37 (single-sided) and Figure 38 (double-sided) of XFP MSA
    INF-8077i Rev 4.5 - a published industry specification, fetched for the purpose
    because nothing in the 78-document Cisco intake carries an XFP dimension. That is
    the same route the mcx and f-type registry keys took: the vendor is silent, the
    standard is not. THE DRAWING CORROBORATES IT: this master's cages measure 19.94 x
    9.84, which is 2.3 and 1.4 percent off the MSA opening - a Cisco drawing and the MSA
    agreeing without either being fitted to the other. Cisco spaces the ports on a 33.3
    mm pitch against the MSA's 23.5 minimum, which the spec explicitly permits: both
    figures label it 'minimum pitch illustrated'.
  ports: >-
    drawing - 4 cages at x 15.29 on a 33.3 mm pitch, with the port numerals extracted as
    text rather than outlined glyphs: '0' at y 29.6 and the rest following down the
    card. The install guide names the part - '4-Port 10GE Modular Port Adapter (MPA)
    with XFP' - which is where the XFP rather than SFP+ comes from; the 8-port MPA in
    the same list is SFP+ and is a different aperture entirely.
  power: >-
    NOT STATED. Table 35 of the Ethernet Line Card Installation Guide gives per-card
    power for the modular-chassis line cards including the A9K-MOD carriers, but nothing
    for the MPAs that go inside them, and the ASR 9001 data sheet gives a chassis figure
    only (425 W typical, 525 W maximum).
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
  weight: >-
    datasheet - c78-735809 Table 3, same row: 31 oz (0.87 kg). Cisco gives every MPA the
    same envelope and a different weight, so the weight is the only physical figure that
    distinguishes them.
elements:
  led-p0:
    at: [21.62, 11.23]
    size: [3.44, 2.91]
    class: led
    description: >-
      the port's A/L (Active/Link) lamp. Table 22, '4-Port 10-Gigabit Ethernet MPA LEDs':
      off - port is not enabled; green on - port is enabled and the link is up; amber on -
      port is enabled and the link is down. Cisco adds a row without a colour of its own:
      'The MPA A/L (Active/Link) LED will blink green and amber when there is traffic
      activity.' Blink is a modulation of the two states already named, not a fourth
      state, so it is recorded here and not added to the vocabulary. This one is port 0's.
      NOTE THE COLOUR: this card's table says the link-down state is amber, and the
      family's Table 33 and the sibling MPAs do not all agree with it. The card's own
      table wins.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - 'off'
