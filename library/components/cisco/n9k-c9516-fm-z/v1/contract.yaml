name: n9k-c9516-fm-z
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9516 fabric blank module with a fan-tray power connector (N9K-C9516-FM-Z). It fills a
  fabric-module slot that holds no fabric module and passes power to the fan tray in front of it. Fabric
  slots FM 2, FM 4 and FM 6 must hold a fabric module or this blank to power their fan tray, so it is the
  blank for an empty even slot; an empty odd slot (FM 1, FM 3, FM 5) takes the N9K-C9516-FM-CV.
