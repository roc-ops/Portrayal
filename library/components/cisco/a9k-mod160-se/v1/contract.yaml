format: 1
kind: module
name: a9k-mod160-se
version: 1.0.1
class: line-card
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9000 Series 160 Gigabyte Modular Line Card, Service Edge Optimized. A
  carrier, not a port card: the faceplate is two bays for Modular Port Adapters and
  almost nothing else - a Status lamp, an ejector and a captive screw at each end. Every
  port this card presents belongs to the MPA seated in one of its bays.
size: {w: 43.7, h: 395.7, d: 616.0}
attrs:
  model: 'A9K-MOD160-SE'
  role: 'modular-line-card'
  capacity: '160 Gbps'
  mpa-bays: 2
  variant: 'service-edge'
  power-draw-max-w: 420
  weight-kg: 7.412
  eol: 'none-announced'
provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 1 panel lamps at dome 0.3 (one number, carried by
    120 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE
    READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind of
    interpolated anyway... It's just to give it a realistic view instead of just being a
    flat 2d... All of the 3d stuff is going to be mostly conjecture unless the vendor
    provides that data.' So a proudness here is an interpolation for a realistic view, NOT a
    claim about the hardware, and the confidence token on every feature says so rather than
    leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE
    DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED
    figure reused for the same class of hardware, and these origins are not measured - they
    are the library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size.
  size: >-
    install guide - Table A-10, 'Ethernet Line Card Physical Dimensions', of the
    OL-17500-09 revision of the Ethernet Line Card Installation Guide, which lists THIS
    PART NUMBER by name: Height 14 inches / 35.56 cm, Width 1.72 inches / 4.37 cm, Depth
    20.5 inches / 52.07 cm, Weight 16.34 pounds / 7.4117 kg '(without EPs)'. Note the
    axis order - H is the LONG dimension and W the thickness, the original generation's
    convention. 355.6 is the PLATE; the component carries the family's ejector-inclusive
    395.7, the same step and the same reasoning as the original-generation line cards
    already in this library, and the drawn plate here measures 358.13. WORTH KNOWING
    THAT THIS TABLE IS GONE: the CURRENT revision of the same guide replaced it with a
    section whose entire content is 'For physical specifications, refer to the ASR 9000
    Series line card data sheets' and a URL. The older revision is in the intake and it
    is the source. Anything sized from the newer guide alone would have had to guess.
    AND A SECOND DIRECT SOURCE, found later than the measurement above and kept beside
    it because it settles what the parenthetical means. Two Cisco data sheets carry this
    family in a 'Physical Dimensions' table. data_sheet_c78-663866, the ASR 9000 Modular
    Line Cards sheet, gives the 80 and 160 Gigabyte carriers in TWO LINES each: '14.5 W
    x 1.72 H x 22.40 L' and, underneath, '14.5 W x 1.72 H x 24.25 L (including ejector
    levers)'. datasheet-c78-735809 gives the 200 and 400 in ONE line, which is the
    second of those two: '14.5 W x 1.72 H x 24.25 L (including ejector levers)'. SO THE
    PARENTHETICAL ATTACHES TO L. The ejector levers add 1.85 in = 47.0 mm to the DEPTH
    and nothing to the width - which is physically right, since a card's levers protrude
    forward of its faceplate - and 14.5 in = 368.3 mm is the PLATE width in both sheets.
    The ejector-inclusive width, 395.7, is simply not stated on either; it comes from
    the family's own sheets, which give 368.3 and 15.58 in = 395.7 for the same cards,
    and from the MPA measurement above. An earlier version of this provenance said the
    parenthetical was misplaced. It is not; it was the two-line layout collapsing to
    one.
  depth: >-
    THREE CISCO FIGURES FOR THIS DEPTH AND ONE IS CARRIED. Table A-10 of the OL-17500-09
    line card guide gives the 80 and 160 Gigabyte carriers 20.5 in = 520.7 mm,
    unqualified, in a row alongside every original-generation line card at the same
    figure. data_sheet_c78-663866 gives the same two cards 22.40 in = 568.96 mm for the
    body and 24.25 in = 616.0 mm including ejector levers. datasheet-c78-735809 gives
    the 200 and 400 only the 616.0. 616.0 IS CARRIED, on all eight, for two reasons: it
    is the one figure both dedicated data sheets state, and it is the ejector-inclusive
    convention this library already uses for the 4th-generation cards, which carry the
    604.5 their sheets give as '(includes ejector bracket/lever)'. Carrying 520.7 would
    have made these carriers shallower than the 4th-generation cards they sit beside in
    the same chassis, which they are not. Table A-10's 520.7 looks like the original-
    generation row value applied to a card that had not been measured separately; it is
    recorded here rather than discarded, because it is Cisco's and because it is what
    the 80 and 160 were first modelled at.
  art-box-is-not-a-size: >-
    A TRAP IN THIS STENCIL THAT COST ME A WRONG ARGUMENT, recorded because it will catch
    the next person. The first version of this provenance said these carriers share a
    plate 'to the hundredth of a millimetre' with the original-generation line cards.
    That was CIRCULAR: both had been scaled to 395.7 first, so of course their plates
    agreed. What is not circular is the RAW art box, and it does carry a signal - the
    card masters fall into exactly three: 46.55 x 413.95, 46.39 x 413.45 and 46.62 x
    413.95, and the three contain cards whose data sheets say 43.7, 41.4 and 42.0 mm
    thick. It is very tempting to read the box as a thickness. IT IS NOT ONE. The
    A9K-MOD200-SE master is drawn on the 46.39 box, the one whose other occupants are
    all 41.4 mm 4th-generation cards - and the MPA drawn inside it measures 33.41 mm at
    a 43.7 anchor and 31.65 at a 41.4 anchor, so the card is 43.7. The art box
    identifies the TEMPLATE a master was drawn from and nothing more; Cisco reused a
    newer template for an older-sized card. The standard part inside the art is the
    authority for the scale, and the outline is not.
  bays: >-
    install guide + drawing, and the two agree. The guide: 'The modular line card
    provides two bays that support the following Modular Port Adapters (MPAs)'. The
    drawing gives WHERE: the A9K-MOD400-SE master is drawn with two MPAs actually
    installed - a 20-port GE in the upper bay and a 2-port 100GE in the lower - and
    their outlines measure 33.23 x 161.21 and 33.23 x 160.94 mm at x 7.59, y 32.24 and
    202.78. An MPA's own envelope is 33.81 x 160.02, so the drawn openings agree with it
    to 1.7 and 0.75 percent. THE BAYS ARE DECLARED AT THE MPA'S ENVELOPE, not at the
    drawn opening, because the module's own dimension is the better of two measurements
    of one thing; the drawn opening is what corroborates it. Bay 0 is the upper - the
    master prints '0' at y 27.45 and '1' at 366.39, one above each bay.
  bays-are-inert: >-
    A NOTE ON WHAT `bays:` DOES HERE, so nobody reads more into it than is there. The
    component schema calls this key 'for modules that themselves host bays (v0:
    unused)', and it is accurate: nothing in render.py or lint.py reads a COMPONENT's
    bays - every bay the toolchain acts on today is a device view's. So these two
    entries are inert. They are declared anyway because the geometry is real, measured
    and sourced, and the alternative is to leave it in prose where no future renderer
    can reach it. When nested modules are supported the numbers are already here; until
    then a MOD carrier renders as a faceplate with two empty openings.
  variants: >-
    install guide - 'Each type of card is available in -SE (Service Edge Optimized) and
    -TR (Packet Transport Optimized) variants. The two variants are functionally
    equivalent, but vary in configuration scale and buffer capacity.' THE STENCIL HAS
    ONLY THE -SE MASTERS. The -TR is modelled on the same drawing, which that sentence
    licenses: configuration scale and buffer capacity are internal and no faceplate can
    show them. Table 35 says the same thing from the other side - every modular line
    card power row is headed '(-TR or -SE)', so Cisco itself gives one figure for the
    pair.
  power: >-
    install guide - Table 35 of the Ethernet Line Card Installation Guide, row '160
    Gigabyte 4-NPU Modular Line Card (-TR or -SE)': 350 W at 25 C, 400 W at 40 C, 420 W
    at 55 C. max is the highest rated ambient. The row's heading names both variants, so
    one figure covers the pair by Cisco's own wording. No typical stated. WHAT THIS
    FIGURE COVERS IS NOT STATED and an earlier version of this sentence said it was.
    Table 35's heading names the carrier and says nothing about whether the measurement
    was taken with MPAs seated or bare, and no other document in the intake settles it.
    So it could be the populated carrier, in which case adding an MPA's draw would
    double-count, or the bare carrier, in which case a budget built from it is short by
    whatever the adapters take. NOTHING TURNS ON IT TODAY because no MPA states a figure
    anywhere in the intake, so there is nothing to add in either direction - but the day
    one does, this is the question that has to be answered before the two numbers are
    summed. Recorded rather than assumed.
  mpas: >-
    install guide - 'The modular line card provides two bays that support the following
    Modular Port Adapters (MPAs)', followed by the chapter's own MPA sections. NO PER-
    CARD LIST EXISTS FOR THIS CARRIER: the 400 Gigabyte card is the only one the guide
    narrows, with an explicit 'only support the following' list, and nothing equivalent
    is written for the 80, 160 or 200. `accepts` therefore carries the general family -
    every MPA in this library plus the blank - which is what the guide's general
    sentence supports and no more. If a per-card restriction exists in a data sheet not
    in this intake, this list is the thing it would narrow.
  weight: >-
    install guide - Table A-10 of OL-17500-09, row 'A9K-MOD160-SE': 16.34 pounds /
    7.4117 kg, footnoted '(without EPs)' - that is, without the port adapters.
    data_sheet_c78-663866 gives '18 lbs. (8.16 Kg)' for the same part with no qualifier
    at all. The qualified figure is carried because it is the one whose scope is known;
    the estimate is recorded so the difference is not read later as an error.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
elements:
  status:
    at: [27.26, 372.18]
    size: [3.54, 3.54]
    class: led
    description: >-
      install guide - Table 32, 'Port Status and Line Card Status LEDs', of the Ethernet
      Line Card Installation Guide, section 'Card Status LED (one per card)'. Green: 'Line
      card has booted properly, and is ready to pass or is passing traffic.' Steady amber:
      'Line card boot process is underway. When the Cisco IOS XR software finishes
      loading, the LED turns green.' Blinking amber: 'Software configuration error has
      occurred that prevents the line card from passing traffic. It is possible that the
      line card is still passing traffic, but there is some degradation.' Red: 'Line card
      has encountered a hardware error, and is not passing traffic.' Off: 'Line card is
      powered off. The LED might turn off momentarily when switching between the states
      described above, although the line card has not powered off.' Steady and blinking
      amber share one colour and are not carried as two states; the distinction is
      recorded here because it is the difference between a card booting and a card
      misconfigured. AN EARLIER VERSION OF THIS SENTENCE said Table 32 'is written for the
      fixed-port cards' and called this vocabulary a BORROWING. That was wrong. Table 32
      sits in Chapter 3, 'Verifying and Troubleshooting the Line Card Installation', which
      is scoped to line cards generally and not to fixed-port ones - Table 33, the MPA
      lamp table, is in the same section, and MPAs only exist inside modular carriers. A
      modular line card is a line card and its Status lamp is a Card Status LED.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - {name: red, color: '#d0021b'}
    - 'off'
relief:
  wall: '#4a4f55'
  features:
