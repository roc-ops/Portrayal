format: 1
kind: module
name: nc57-c3-fan1-hx
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  The environment-hardened fan tray with two 40 mm fans of the Cisco NCS-57C3-MOD-HX, ordered as NC57-C3-FAN1-HX, for fan tray
  slots 2 to 5. It installs from the rear and is drawn as the NC57-C3-FAN1-FW is: two round fans one above the other, a black pull
  handle at the right and a status lamp at the lower left. The -HX chassis takes only the -HX trays.
size: {w: 49.0, h: 89.0}
size-confidence: {w: photo-measured, h: photo-measured}
part-numbers:
  NC57-C3-FAN1-HX: {part: NC57-C3-FAN1-HX}
attrs:
  airflow: front-to-back
  hot-swappable: 'yes'
  power-absent: not-published
provenance:
  model: >-
    datasheet - Hardware Installation Guide for Cisco NCS 5700 Series Fixed-Port Routers (first published 2021-06-23, last modified
    2026-05-15), Fan Modules and Fan Trays: "Fan tray slots 2 through 5 support fan tray assembly with 2x40mm fans
    (NC57-C3-FAN1-FW/NC57-C3-FAN1-HX)"; Figure 5 is captioned for both parts. Table 2: the NCS-57C3-MOD-HX "can be paired with either the
    NC57-C3-FAN1-HX or NC57-C3-FAN2-HX fan tray", and only the environmental-hardened fan tray is to be installed in it.
  power: >-
    NOT STATED. Searched the guide for the tray's watts: only supply ratings are given. No power figure is written.
  size: >-
    photo-measured - the size of nc57-c3-fan1-fw from Figure 20. The guide gives one figure for both parts and says nothing of how the
    hardened tray differs, so its face is the FW tray's, and this is a reading of that figure and not of a hardened tray.
  elements: >-
    estimated - as nc57-c3-fan1-fw; no figure of the -HX tray itself is held, and the guide does not say how it differs.
  depth: >-
    estimated - not stated in any held document; 80 mm is a round figure for a fan tray of this class.
states: [absent]
elements:
  fan-a: {at: [2.5, 2.5], size: [34.0, 38.0], class: rotor}
  fan-b: {at: [2.5, 46.0], size: [34.0, 38.0], class: rotor}
  handle: {at: [39.0, 5.0], size: [8.0, 79.0], class: handle}
  status: {at: [3.0, 85.0], size: [2.0, 2.0], class: led, states: ['off', {name: ok, color: '#22c55e'}, {name: failed, color: '#ef4444'}]}
skins: [default]
body:
  depth: 80
  color: '#26292d'
  footprint: {at: [0, 0], size: [49.0, 89.0]}
