format: 1
kind: component
name: nxk-acc-kit-1ru-slider-rail
version: 1.0.0
class: mount
behaviour: mounts
profile: networking
description: >-
  The slider rail of the Cisco NXK-ACC-KIT-1RU rack-mount kit, two to a kit. It screws to the
  rear posts of a four-post rack, and the switch slides onto it. Drawn as a plain plate: no
  guide dimensions it.
size: {w: 20.0, h: 43.5}
size-confidence: {w: estimated, h: estimated}
provenance:
  model: >-
    datasheet - the Cisco N93180YC-FX3 NX-OS Mode Switch Hardware Installation Guide,
    appendix D, "Rack Mount Kit NXK-ACC-KIT-1RU": "Slider rails (2)"; the installation
    procedure: "Install the slider rails on the rack or cabinet" and "Slide the rack-mount
    guides onto the slider rails". The rails are not a rail that extends for service.
  size: >-
    estimated - NO GUIDE DIMENSIONS THIS PART. 20.0 by 43.5 mm is a placeholder envelope for
    the rail seen end on, the height being the 1 RU it serves; nothing measures it, and the
    length of the rail is not stated.
skins: [default]
