name: n9k-c9516-fm-cv
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9516 fabric-module blank card (N9K-C9516-FM-CV). A plain cover that fills an odd fabric-module
  slot (FM 1, FM 3, FM 5) holding no fabric module, to preserve the designed airflow. It is a different part
  number from the N9K-C9516-FM-Z, which goes in an empty even slot (FM 2, FM 4, FM 6) because it also passes
  power to the fan tray.
size: {w: 62.48, h: 772.16, d: 297.18}
