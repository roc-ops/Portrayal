<svg xmlns="http://www.w3.org/2000/svg" width="15.0mm" height="23.0mm" viewBox="0 0 15.0 23.0">
  <!-- The cable block of the ASR 9000 fixed-port DC supplies seen from the wire side, seated: a grey housing at the outline of the
       connector it seats in, and one wire entering each of its two ways, "+DC" above and "-DC" below. -->
  <rect id="body" x="0" y="0" width="15.0" height="23.0" rx="1.8" fill="#8b9096" stroke="#5c6167" stroke-width="0.25"/>
  <circle id="wire-1" cx="7.5" cy="5.5" r="2.4" fill="#cfd2d6" stroke="#5c6167" stroke-width="0.15" data-fill-from="wire-1-color"/>
  <circle id="wire-2" cx="7.5" cy="17.5" r="2.4" fill="#cfd2d6" stroke="#5c6167" stroke-width="0.15" data-fill-from="wire-2-color"/>
</svg>
