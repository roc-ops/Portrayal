<svg xmlns="http://www.w3.org/2000/svg" width="14.9mm" height="33.8mm" viewBox="0 0 14.9 33.8">
  <!-- Drawn from the cable end, logo side up. Farthest from the viewer first. The three
       blades sit behind the body; the two finger screws are above and below it (their place
       is a reading) and one cable leaves the body. -->
  <path id="shell" fill="#c9cdd1"
        d="M 1.2 5.8 H 13.7 V 9.4 H 1.2 Z M 1.2 15.1 H 13.7 V 18.7 H 1.2 Z M 1.2 24.4 H 13.7 V 28.0 H 1.2 Z"/>
  <rect id="body" x="0" y="5" width="14.9" height="23.8" rx="1.2" fill="#26282b" stroke="#4a4d52" stroke-width="0.12"/>
  <g id="screw-top">
    <circle cx="7.45" cy="2.5" r="2.0" fill="#c9cdd1" stroke="#8d949c" stroke-width="0.15"/>
    <path d="M 6.2 2.5 H 8.7" stroke="#4a4f55" stroke-width="0.3" fill="none"/>
  </g>
  <g id="screw-bottom">
    <circle cx="7.45" cy="31.3" r="2.0" fill="#c9cdd1" stroke="#8d949c" stroke-width="0.15"/>
    <path d="M 6.2 31.3 H 8.7" stroke="#4a4f55" stroke-width="0.3" fill="none"/>
  </g>
  <rect id="relief-boot" x="2.0" y="5.8" width="10.9" height="22.2" rx="2" fill="#202225" stroke="#4a4d52" stroke-width="0.12"/>
  <circle id="stub" cx="7.45" cy="16.9" r="2.5" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
