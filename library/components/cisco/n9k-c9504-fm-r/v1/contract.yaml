format: 1
kind: module
name: n9k-c9504-fm-r
version: 1.0.0
class: fabric
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9504 fabric module for the -R and -RX line cards (N9K-C9504-FM-R). A vertical module with a
  vented face, ejector levers, a BCN lamp and a status lamp; it sits in the rear of the chassis behind a fan
  tray and pairs with the N9K-C9504-FAN tray. Six are required for maximum bandwidth, so all six fabric
  slots hold one.
size: {w: 62.48, h: 238.76, d: 297.18}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
attrs:
  model: 'N9K-C9504-FM-R'
  role: 'fabric-module'
  power-draw-max-w: 130
  weight-kg: 2.8
  hot-swappable: true
  eol: 'unknown'
provenance:
  size: >-
    datasheet - Cisco N9504 NX-OS Mode Switch Hardware Installation Guide, Appendix A "Switch Dimensions"
    (printed p114, PDF p120), "Fabric modules": 2.46 in (6.25 cm) wide, 11.7 in (29.72 cm) deep, 9.4 in
    (23.88 cm) high. One row serves every fabric type.
  power: >-
    datasheet - the chassis's own "Planning for Power Requirements" table (PDF p18, printed p12), the row
    "Line cards that are supported by N9K-C9504-FM-R fabric modules": the guide prints 130 W in the maximum
    column and 140 W in the typical column. A typical figure above the maximum is an evident slip in the
    guide (the copied 9508 table's FM-R row reads 240 W typical, 250 W maximum), and nothing says which
    figure is wrong. Lint refuses a typical above a maximum, so only the maximum, 130 W, is carried as
    printed, and the 140 W typical is a gap on the 9504 device (fm-r-typical-draw).
  compatibility: >-
    install guide - "Overview" Table 1 (PDF p8, printed p2): six N9K-C9504-FM-R modules are required for
    maximum bandwidth with the N9K-X9636C-RX, -R, N9K-X9636Q-R and N9K-X96136YC-R line cards; the slot rules
    on PDF p9 (printed p3) put six modules in FM 1 to FM 6. Supervisor B or B+ is required for -R line cards
    (PDF p17, printed p11).
  weight: >-
    datasheet - Appendix A weights table (PDF p122, printed p116): 6.2 lb (2.8 kg), "supporting -R and -RX
    line cards".
  lamps: >-
    install guide - "Fabric Module LEDs" (PDF p136, printed p130): a BCN lamp (blue) and a status lamp.
    Positions estimated.
  skin: >-
    estimated - a vented face and two ejector levers, read from the rear figure of the overview (PDF p11,
    printed p5), which is isometric; no figure dimensions them.
  lifecycle: >-
    unknown - Cisco's support page gives no sale status for this part number, and no end-of-sale notice for
    it is held.
elements:
  bcn:
    at: [10.0, 208.2]
    size: [3.0, 3.0]
    class: led
    description: BCN lamp. The BCN lamp on the fan tray that covers the module also lights.
    states:
    - {name: blue, color: '#2a7de1'}
    - 'off'
  status:
    at: [48.0, 208.2]
    size: [3.0, 3.0]
    class: led
    description: Status lamp.
    states:
    - {name: green, color: '#39b54a'}
    - {name: flashing-green, color: '#39b54a', behavior: blinking}
    - {name: flashing-yellow, color: '#f5c518', behavior: blinking}
    - {name: flashing-red, color: '#d0021b', behavior: blinking}
    - {name: flashing-amber, color: '#f5a623', behavior: blinking}
    - 'off'
skins: [default]
