  - {ref: std/rj45-ganged@1, id: nv-sync-1-tod, at: [8.96, 152.37], rotate: 90}
  - {ref: std/rj45-ganged@1, id: mgt-lan-0, at: [8.96, 246.39], rotate: 90}
  - {ref: std/rj45-ganged@1, id: mgt-lan-1, at: [8.96, 267.17], rotate: 90}
  - {ref: std/rj45-ganged@1, id: console, at: [8.96, 288.28], rotate: 90}
  - {ref: std/rj45-ganged@1, id: aux, at: [8.96, 309.05], rotate: 90}
  - {ref: std/smb@1, id: gps-10mhz, at: [10.98, 175.36]}
