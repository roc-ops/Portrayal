provenance:
  stack-orientation: >-
    The belly-to-belly cage pairs on this card follow the library's stack convention
    (docs/pluggables-3d-design.md, S1-S4): on a card drawn on its side a pair sits left
    and right, the left cage 270 beside the right 90, so both cage lips face the band
    between the two cages and both bails face outward, where a thumb reaches them. Where
    this provenance records a reading of a stack the orientation is that reading;
    otherwise it is the rule, not an observation. A photograph of the stack that shows
    otherwise overturns it. Turning a composed cage in place changes no box, id or
    anything a device places, so it is a minor bump (S6).
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 4 ejector brackets, their levers and the grip
    flanges at out 4.2 (one number, carried by 61 Cisco contracts); 2 captive screw heads at
    cyl 1.6 (one number, carried by 63 Cisco contracts); 1 panel lamps at dome 0.3 (one
    number, carried by 120 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS
    A DELIBERATE READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is
    kind of interpolated anyway... It's just to give it a realistic view instead of just
    being a flat 2d... All of the 3d stuff is going to be mostly conjecture unless the
    vendor provides that data.' So a proudness here is an interpolation for a realistic
    view, NOT a claim about the hardware, and the confidence token on every feature says so
    rather than leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY
    NUMBER HERE DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another
    part's MEASURED figure reused for the same class of hardware, and these origins are not
    measured - they are the library's first guess at that hardware, and the contracts say so
    themselves: agr-panel-screw's provenance reads 'estimated - it stands proud but was not
    measured', agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its
    proudness, agr-fan describes its handle and grille by appearance only, and
    common/led-dot's entire provenance is 'size: estimated'. Spelling that chain `borrowed`
    would convert a guess into an apparent measurement at one remove, a thousand times over.
    `source` still names the origin, so the coordinating benefit is kept and only the claim
    that is not true is dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried
    by sixty-odd contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings
    that happened to agree. One caliper on any one Cisco captive screw, any one ejector
    lever or any one panel lamp corrects every part in the library that shares it, which is
    the whole reason the numbers are pooled instead of chosen per card. THE SEARCH FOR A
    REAL FIGURE WAS RUN FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts
    for 'protrud', 'extends outward', 'stands proud' and 'clearance in front' - the only
    vendor in the intake that publishes a projection is UfiSpace, on the S9510-28DC; the
    per-card dimension tables, including Table A-10 of the older Ethernet Line Card
    Installation Guide which the current revision dropped, all of which carry H, W, D and
    weight only; and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR
    elevations with no side, top or isometric view, so it holds no depth axis at all and is
    closed as a source. Figure 48 of the Ethernet Line Card Installation Guide and Figure
    1-8 of the ISM guide DO show this hardware in three dimensions and are perspective
    drawings with a vanishing point, so they settle the ARRANGEMENT - bracket off the plate,
    lever along it, domed screw head proud of both - and nothing about size.
  size: >-
    datasheet - Cisco ASR 9000 Series Ethernet Line Cards data sheet, 'Physical
    dimensions (H x W x D); weight: 14 x 1.72 x 20.5 in. (35.56 x 4.37 x 52.07 cm)'. The
    24-port and 36-port sheets repeat it verbatim, so one envelope covers the whole
    original generation. NOTE THE AXIS ORDER IS THE OTHER WAY ROUND from the 4th and 5th
    generation sheets: here H is the LONG dimension and W the thickness, where the newer
    sheets give H as the thickness. THE THICKNESS IS THE FINDING: 1.72 in = 43.7 mm
    against the 4th generation's 1.63 in = 41.4. These are physically thicker cards. And
    43.7 is exactly the shape-box width that had to be DISCARDED as padding for the
    newer masters - for this generation it is the real number, which is a good reminder
    that the shape box is not wrong so much as it is not always the same thing.
  anchor: >-
    the long axis is anchored at 395.7 mm, which is the 4th generation's stated ejector-
    inclusive width and NOT this generation's stated 355.6 - so here is the reasoning,
    because it looks like the wrong number. These masters are a SECOND SHELL: they share
    zero shell features with the 4th/5th generation masters, different ejector blocks,
    different screws, the PID band at the other end. But both shells are DRAWN at the
    same scale, and the standard part inside the art proves it: the SFP cages here
    measure 14.39 mm against SFF-8433's 14.25, one percent, at the 395.7 anchor. Anchor
    at 355.6 instead and they come out 12.93, nine percent under, which no SFP cage is.
    The datasheet's 355.6 is the PLATE - the drawn plate is 358.13, agreeing to 0.7
    percent - where the newer sheets quote plate plus ejectors. Same card length, two
    measuring conventions, and the 43.7 thickness is carried from the datasheet because
    that IS this generation's own number.
  leds: >-
    install guide - every Ethernet line card has port Status LEDs on its front panel,
    one beside each SFP or XFP port showing that port's status, plus a single tristate
    Status LED per card for card status. The card lamp's four states are Table 32,
    transcribed. The per-port A/L lamps ARE drawn on these masters but as a shared
    strip between each pair of rows rather than one lamp per port, so which part
    belongs to which port is not resolvable and they are not modelled - the same gap
    the newer SFP cards carry.
  power: >-
    install guide - Table 35, row '40-Port Gigabit Ethernet Line Card': 310 W at 25 C,
    320 W at 40 C, 350 W at 55 C.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
  weight: >-
    install guide - Table A-10, 'Ethernet Line Card Physical Dimensions', of the
    OL-17500-09 revision of the Ethernet Line Card Installation Guide, row 'A9K-40GE-E':
    13.5 pounds +/- .5. The kilogram figure is Cisco's own column and not my conversion
    of the pounds one. NOTE WHERE THIS COMES FROM: the CURRENT revision of the same
    guide has no such table - its 'Ethernet Line Card Physical Dimensions' section is
    one sentence pointing at a URL - so the older revision in the intake is the only
    per-part weight source there is for this generation.
  variants: >-
    the -B, -E and -L masters of this card are the SAME DRAWING - extracted cage centres
    agree at every port - which is what the data sheet says they should be: 'available
    in base, extended, and low-queue versions. All versions are functionally equivalent,
    but vary in configuration scale and buffer capacity.' Table 35 gives one power row
    for the card and does not split by variant, so all three carry the same figure by
    Cisco's own scoping.
elements:
  status:
    at: [31.43, 372.0]
    size: [3.2, 3.2]
    class: led
    description: >-
      the single tristate card Status LED (Ethernet Line Card Installation Guide, Table
      32).
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - {name: amber-blinking, behavior: blinking, color: '#f5a623'}
    - {name: red, color: '#d0021b'}
    - 'off'
