format: 1
kind: module
name: a9k-8x100ge-x-tr
version: 1.0.2
class: line-card
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9000 Series 8-Port 100 Gigabit Ethernet QSFP TR Line Card, 4th generation.
  Eight QSFP28 ports at 100 Gigabit Ethernet, in two groups of four on the upper half of
  the faceplate. Cisco published no data sheet for this part number; it is modelled from
  the stencil artwork. Not to be confused with the CPAK-based A9K-8X100GE-SE/-TR, which
  is a different generation and a different faceplate.
unplaced: >-
  no ASR 9000 chassis in this library accepts this card because no Cisco document in the
  corpus says which chassis take it. Searched: the per-card datasheets with a Chassis
  compatibility row, the RSP5 and RP3 supported-line-card tables (c78-741128 Table 4,
  c78-741127 Table 4), the Ethernet Line Card Installation Guide chassis tables (Tables 2 to
  10), the release notes, the 4th generation line card end-of-life bulletin and the
  cisco-asr9000-hw knowledge base. The part appears only in documents that do not state
  chassis support - release notes, the bulletin, the secure boot list and feature lists. The
  -X variants are absent from every table that lists the plain A9K-8X100GE. Tracked in
  roc-ops/Portrayal#262.
size: {w: 41.4, h: 395.7, d: 604.5}
