format: 1
kind: module
name: a9k-sip-700
version: 1.0.2
class: line-card
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9000 SIP-700 SPA Interface Processor with 4 GB of memory. A carrier for
  shared port adapters rather than a port card: the faceplate is four SPA subslots in a
  two-by-two grid and a single Status lamp. Cisco: it takes up to 2 single-width
  double-height SPAs, up to 4 single-width single-height SPAs, or up to 2 double-width
  single-height SPAs, and does not take double-width double-height SPAs.
  Supported on all ASR 9000 Series routers except the ASR 9906.
size: {w: 43.7, h: 395.7, d: 520.7}
attrs:
  model: 'A9K-SIP-700'
  role: 'spa-interface-processor'
  memory: '4 GB'
  capacity: '20 Gbps'
  spa-subslots: 4
  weight-kg: 6.35
  operating-temp: '5 to 40 C'
  operating-temp-short-term: '-5 to 55 C'
  power-draw-max-w: 375
  eol: 'none-announced'
provenance:
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 1 panel lamps at dome 0.3 (one number, carried by
    120 Cisco contracts). EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE
    READING OF WHAT RELIEF IS FOR. The owner's ruling: 'the whole 3d part is kind of
    interpolated anyway... It's just to give it a realistic view instead of just being a
    flat 2d... All of the 3d stuff is going to be mostly conjecture unless the vendor
    provides that data.' So a proudness here is an interpolation for a realistic view, NOT a
    claim about the hardware, and the confidence token on every feature says so rather than
    leaving it to be inferred. WHY `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE
    DOES COME FROM ANOTHER PORTRAYAL PART. `borrowed` is defined as another part's MEASURED
    figure reused for the same class of hardware, and these origins are not measured - they
    are the library's first guess at that hardware, and the contracts say so themselves:
    agr-panel-screw's provenance reads 'estimated - it stands proud but was not measured',
    agr-psu-dc sources its latch's ARRANGEMENT from a photograph and never its proudness,
    agr-fan describes its handle and grille by appearance only, and common/led-dot's entire
    provenance is 'size: estimated'. Spelling that chain `borrowed` would convert a guess
    into an apparent measurement at one remove, a thousand times over. `source` still names
    the origin, so the coordinating benefit is kept and only the claim that is not true is
    dropped. READ THE COUNTS ABOVE AS THEY ARE MEANT: a figure carried by sixty-odd
    contracts is ONE ESTIMATE WRITTEN SIXTY-ODD TIMES, not sixty-odd readings that happened
    to agree. One caliper on any one Cisco captive screw, any one ejector lever or any one
    panel lamp corrects every part in the library that shares it, which is the whole reason
    the numbers are pooled instead of chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN
    FIRST AND IS RECORDED SO IT IS NOT REPEATED: all 112 doc.md extracts for 'protrud',
    'extends outward', 'stands proud' and 'clearance in front' - the only vendor in the
    intake that publishes a projection is UfiSpace, on the S9510-28DC; the per-card
    dimension tables, including Table A-10 of the older Ethernet Line Card Installation
    Guide which the current revision dropped, all of which carry H, W, D and weight only;
    and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR elevations with no
    side, top or isometric view, so it holds no depth axis at all and is closed as a source.
    Figure 48 of the Ethernet Line Card Installation Guide and Figure 1-8 of the ISM guide
    DO show this hardware in three dimensions and are perspective drawings with a vanishing
    point, so they settle the ARRANGEMENT - bracket off the plate, lever along it, domed
    screw head proud of both - and nothing about size.
  size: >-
    datasheet + install guide, and they say it two ways. THE DATA SHEET GIVES NUMBERS:
    data_sheet_c78-573452, the Cisco ASR 9000 SIP-700 data sheet, 'Physical dimensions
    (H x W x D); weight: 14 x 1.72 x 20.5 in.; 14 lb' - 355.6 x 43.7 x 520.7 mm and 6.35
    kg, the original generation's envelope exactly. The INSTALL GUIDE gives the same
    fact by reference: Table 6, 'Cisco ASR 9000 SIP-700 Physical Specifications', says
    'Physical dimensions: Occupies one line card slot on a Cisco ASR 9000 Series
    Aggregation Services Router' and no numbers at all. 355.6 is the PLATE; the
    component carries 395.7, the ejector-inclusive step every original-generation card
    in this library uses and which Cisco's own sheets write as 15.58 in where the plate
    is 14.5. Depth 520.7 is the sheet's own 20.5 in. AN EARLIER VERSION OF THIS
    COMPONENT modelled no depth at all, on the reasoning that 'occupies one line card
    slot' fixes the opening and not how far back the card reaches. That reasoning was
    sound and the conclusion was unnecessary - the number was stated in a data sheet I
    had not found.
  power: >-
    datasheet - data_sheet_c78-573452, the Cisco ASR 9000 SIP-700 data sheet: 'Power:
    375W (maximum)'. No typical and no ambient are given with it. AN EARLIER VERSION OF
    THIS COMPONENT SAID 'NOT STATED ANYWHERE IN THE INTAKE' and was wrong. What that
    sentence got right is that the SIP and SPA Hardware Installation Guide has no power
    table, Table 35 of the Ethernet Line Card guide has no SIP row, and Table 23 of the
    Overview and Reference Guide covers RSPs, RPs and fabric cards only - all three
    true, and all three about the wrong books. WHAT THE FIGURE COVERS IS NOT STATED and
    an earlier version of this sentence said it was. The sheet gives 375W maximum
    against the SIP and says nothing about whether the measurement was taken with SPAs
    seated or bare. It could be the populated carrier, in which case adding a SPA's draw
    would double-count, or the bare carrier, in which case a budget built from it is
    short by whatever the adapters take. NOTHING TURNS ON IT TODAY - no SPA is modelled
    in this library and none has a figure anywhere in the intake - but the day one does,
    this is the question to answer before the two are summed.
  weight: >-
    datasheet - data_sheet_c78-573452, the Cisco ASR 9000 SIP-700 data sheet gives '14
    lb' with the physical dimensions, which is 6.35 kg and is the CARD. The install
    guide's Table 6 gives 'Shipping weight 10kg (22 lbs)', which is the card plus its
    packaging. Both are Cisco's and they are not the same quantity; attrs carries the
    card at 6.35 and this sentence is the record of the other, so that nobody later
    reads the two as a contradiction.
  operating-temp: >-
    datasheet + install guide, AND THEY DISAGREE, so both are here.
    data_sheet_c78-573452, the Cisco ASR 9000 SIP-700 data sheet: 'Operating temperature
    (nominal): 41 to 104F (5 to 40C). Operating temperature (short-term): 23 to 131F (-5
    to 55C).' The SIP and SPA Hardware Installation Guide's Table 6: 'Operating
    temperature 32 to 104F (0 to 40C)'. The ceilings agree at 40 C for continuous
    operation; the floors differ, 5 C against 0 C, and only the data sheet mentions a
    short-term range at all. attrs carries the data sheet's nominal range because it is
    the more conservative floor and the more completely specified pair.
  bays: >-
    install guide + drawing, AND THEY CORROBORATE EACH OTHER ON THE NUMBERING, which is
    the part worth setting out because SPA subslot numbering is not in reading order.
    The guide lists it flatly: 'Bay 2 (Top Left), Bay 0 (Top Right), Bay 3 (Bottom
    Left), Bay 1 (Bottom Right)'. The master prints all four numerals on its end
    flanges: '2' and '0' together at one end of the card and '3' and '1' at the other,
    and within each pair the 2/3 numeral sits at across-card x 21.19 and the 0/1 numeral
    at 37.42. So the master says {2,0} share one end, {3,1} the other, {2,3} one side
    and {0,1} the other - which is exactly the guide's Top/Bottom/Left/Right partition,
    with Top mapping to the low-y end and Left to the low-x side. Two sources, different
    media, same answer. IT ALSO FIXES WHICH CARD AXIS IS 'WIDTH': the guide captions its
    figure '2 double-width, single-height SPAs' and the master draws exactly two panels,
    each spanning the FULL 34.58 mm across the card at one position along it. So width
    runs across the card and height along it, and a single-width single-height subslot
    is half of one of those panels. The four bays here are those halves.
  bay-split: >-
    THE SPLIT DOWN THE MIDDLE IS MINE. The master draws only the two double-width
    panels, at 6.98, 27.71 and 6.98, 195.59, each 34.58 mm across and 167.87 and 165.47
    mm long - those two bands are measured. Where the dividing line falls between the
    left and right subslots inside a band is NOT drawn, because the SPAs installed in
    the figure span both. It is taken as the middle. The guide supports halves rather
    than any other split - 'up to 4 single-width, single-height SPAs' in a 2 x 2 grid -
    but not the exact millimetre, and the printed numerals at x 21.19 and 37.42 fall on
    either side of that middle, which is consistent with it without proving it.
  bays-were-inert-and-are-not: >-
    THIS WAS RECORDED AS INERT AND IS NO LONGER. Two things that were true when the
    geometry was written have both changed: component-level `bays:` is now read by
    render.py, which seats an occupant into a seated module's own bay, and 24 SPAs
    are now modelled from the SIP and SPA Hardware Installation Guide's Table 10.
    So `accepts` can name real parts and does.
  accepts-is-singles-only: >-
    THE 22 SINGLE-WIDTH SPAs ARE LISTED AND THE TWO DOUBLES ARE NOT, and that is a
    limit of the bay model rather than a statement about the hardware.
    SPA-2XCHOC12/DS0 and SPA-1XCHOC48/DS3 occupy TWO SUBSLOTS SIDE BY SIDE - about
    34.58 across against a subslot's 17.29 - and an occupant that spans two bays has
    no representation here: a bay holds one module sized to itself. Listing them
    would put a 34.58 part in a 17.29 opening and the drawing would lie. They are
    built and correct as components; what is missing is a way to say a module fills
    two bays. Note the guide names this class 'double-height' in Table 10 and
    'double-width' in the SIP-700 chapter - one axis, two vocabularies, which is why
    the count of affected parts (2 of 24) matters more than either word.
  blank-is-a-real-part-we-do-not-have: >-
    NO DEFAULT OCCUPANT IS SET, and the reason is a missing component rather than a
    missing decision. Cisco requires a filler: an unused bay must be closed with a
    blank so the router or switch meets electromagnetic interference requirements,
    and that blank has to come out before a SPA goes into the bay. That blank is a
    real orderable part and this library has no component for it, so the four
    subslots render as openings. The guide gives it neither a part number nor a
    dimension in any section searched, so it is not buildable from what we hold.
    When somebody builds it, the `default` goes on these four bays the way
    a9k-mpa-blank goes on the MOD carriers' two.
  capacity: >-
    install guide - Table 3, 'SIP Summary', names this part '20G SPA Interface
    Processor, 4 GB memory'.
  variants: >-
    install guide - the Cisco ASR 9000 SIP-700 comes in two types, A9K-SIP-700 with 4
    GB of memory and A9K-SIP-700-8G with 8 GB; the two LOOK IDENTICAL and are told
    apart only by the PID on the SIP's faceplate. That last clause is why
    both are modelled from the one master: Cisco says the faceplates differ in exactly
    one thing, the printed PID, and that is the only thing that differs between these
    two components.
  chassis: >-
    install guide - 'Cisco ASR 9000 SIP-700 SIPs are supported on all Cisco ASR 9000
    Series Routers.' ONE EXCEPTION IS STATED ELSEWHERE and is easy to miss because it is
    not in the SIP guide at all: the Overview and Reference Guide notes that 'The Cisco
    ASR 9906 supports A9K-VSM-500 and Tomahawk-based line cards; it does not support
    SIP-700'. Two Cisco books disagreeing, and the narrower statement is the one
    carried.
  status-lamp: >-
    install guide - Table 32, 'Port Status and Line Card Status LEDs', of the Ethernet
    Line Card Installation Guide, section 'Card Status LED (one per card)'. Green =
    booted properly and ready to pass, or passing, traffic; steady amber = boot
    underway, turning green once the Cisco IOS XR software finishes loading; blinking
    amber = a software configuration error keeps the card from passing traffic, though
    it may still be passing some in a degraded way; red = a hardware error, and no
    traffic passing; off = powered off, though the LED can also go dark for a moment
    while changing between the states above without the card powering off. Steady and
    blinking amber share one colour and are not carried as two states; the distinction
    is recorded here because it is the difference between a card booting and a card
    misconfigured. A SIP IS NOT AN ETHERNET LINE CARD, so the scope needs a licence and
    Cisco gives one explicitly: the SIP and SPA Hardware Installation Guide carries the
    note 'References to line cards in the router hardware installation and configuration
    guides apply equally to SIPs.' That sentence is what makes Table 32 this card's
    table rather than a neighbour's. An earlier version of this component said the guide
    gave the lamp's existence and no colour table and carried a flagged BORROWING; the
    colour table was in the other book, which that note points at.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake. Note the
    guide's own note that 'The ASR 9000 SIP-700 is not supported on Cisco IOS XR 64-bit
    images', which is a software limit rather than a lifecycle statement but is the
    nearest thing to one that the intake carries.
body:
  depth: 520.7
  color: '#b9bec4'
elements:
  status:
    at: [25.25, 370.39]
    size: [3.54, 3.54]
    class: led
    description: >-
      the SIP's single Status lamp. Cisco: 'The Cisco ASR 9000 SIP-700 faceplate has one
      Status LED.' Its vocabulary is Table 32's Card Status LED - see provenance.status-
      lamp for why that table reaches a SIP.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - {name: red, color: '#d0021b'}
    - 'off'
relief:
  wall: '#4a4f55'
  features:
    - node: status
      dome: 0.3
      confidence: estimated
      source: >-
        common/led-dot@1 - the library's one panel-lamp figure. Its own provenance is 'size:
        estimated' and the dome carries none
