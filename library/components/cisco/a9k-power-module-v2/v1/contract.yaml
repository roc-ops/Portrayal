format: 1
kind: module
name: a9k-power-module-v2
version: 1.0.0
class: psu
profile: networking
description: >-
  Cisco ASR 9000 version 2 power module for a modular-chassis power tray. Two axial fans
  behind finger guards, a pull handle between them, a hazard label and Input, Output and
  Fault lamps. Four of these fill a version 2 tray.
size: {w: 99.62, h: 42.85}
attrs:
  model: 'A9K Power Module (V2)'
  role: 'power-module'
  generation: '2'
  fans: '2'
  eol: 'none-announced'
provenance:
  relief: >-
    NO RELIEF FEATURE IS DECLARED AND THIS IS THE RECORD OF WHY. What should stand proud of
    this face: the pull handle. Each needs a depth in millimetres, and no document in the
    intake states one for any Cisco part. The searches, recorded so this can be overturned
    rather than repeated: every doc.md in the 112-document intake for 'protrud', 'extends
    outward', 'stands proud' and 'clearance in front' - the ONLY vendor in the whole intake
    that publishes a projection is UfiSpace, whose S9510-28DC datasheet gives its fan and
    PSU handle travel, and no Cisco document does; the per-card dimension tables, Table A-10
    of the older Ethernet Line Card Installation Guide and every data sheet's 'Physical
    dimensions (includes ejector bracket/lever)' row, which carry H, W, D and weight only -
    and where the ejector IS included it is included in the card's LONG axis, which this
    model already draws in 2D, not in its depth; and the ASR 9000 Visio stencil, whose 119
    masters are FRONT and REAR elevations with no side, top or isometric view, so it carries
    no depth axis to measure at all. The figures that DO show this hardware in three
    dimensions - Figure 48 of the Ethernet Line Card Installation Guide, 'Ejector Levers and
    Captive Screws', and Figure 1-8 of the ISM guide - are perspective drawings with a
    vanishing point and no scale, so they are authoritative for WHAT IS THERE and for
    nothing about size. WHAT WOULD CLOSE IT: a mechanical drawing of the module, or a
    photograph of the part with a rule in frame. THIS PARAGRAPH IS ONE STATEMENT, WRITTEN
    ONCE BY THE CISCO RELIEF PASS AND INSERTED INTO THE 4 SIBLING CONTRACTS that share this
    hardware - it is a single search, not 4 agreeing readings.
  size: >-
    drawing - the stencil master 'A9K Power Module V2', BOTH AXES from index.json's
    shapesheet: 0.3922 x 0.1687 in, so 99.62 x 42.85 mm. CORRECTED from 95.85 x 42.80,
    which mixed a shapesheet height with an art-derived width - the same error as the
    version 1 module and found in the same sweep. Note this one erred the other way,
    3.77 mm UNDER rather than over, because this master's art is narrower than its shape
    box where the version 1's is wider. That is why the rule is 'both axes from the same
    source' rather than 'the art is always bigger'. No document in the intake gives a
    power module's dimensions.
  fits: >-
    checked, not assumed, and the measurement is worth stating precisely because the
    first attempt used the wrong feature. The 'A9K Power Tray' master draws ONE
    continuous opening 429.2 mm wide with four M0..M3 legends beneath it, so the module
    pitch is 429.2 / 4 = 107.3 mm - the 99.05 mm bands under the legends are the LABELS,
    not the bays, and reading them as bays is what the first pass did. This module is
    99.62 mm wide, which fits a 107.3 mm position with room for the rails; the version 1
    master at 139.12 mm cannot. Four positions is also exactly what the guide's version
    2 arithmetic needs: 'four 2100 W DC power modules or 3000 W AC power modules in a
    single tray, 8400 W (DC) 12,000 W (AC)'. The version 3 trays are on different
    pitches again - 139.05 mm on the AC tray and 104.5 on the DC - so this module is not
    offered as a version 3 part.
  lamps: >-
    install guide - the Overview and Reference Guide's 'Power Module Status Indicators',
    which gives one table for the version 1 module and a second for version 2 and says
    'The status indicators for the version 3 power module are similar'. Both tables read
    the same and are transcribed here: Input LED - 'ON continuously when the input
    voltage is present and within the correct range. BLINKING when the input voltage is
    out of acceptable range. OFF when no input voltage is present.' Output LED - 'ON
    when the power module output voltage is present. BLINKING when the power module is
    in a power limit or overcurrent condition.' Fault LED - 'ON indicates that a power
    supply failure has occurred.' Note what Cisco does NOT give: a colour for any of the
    three. So the states are on/blinking/off and no colour is asserted.
  power: >-
    NOT STATED FOR THIS DRAWING, and the reason is worth the paragraph because the
    numbers themselves are not missing - the attribution is. Cisco's own part numbers
    give six ratings: PWR-1.6KW-AC and PWR-1.6KW-DC; PWR-2KW-DC-V2 and PWR-3KW-AC-V2;
    PWR-4.4KW-DC-V3 and PWR-6KW-AC-V3, plus a PWR-3KW-HVDC. The DC output tables in the
    Overview and Reference Guide give the same figures from the system side - 'four 2100
    W DC power modules or 3000 W AC power modules in a single tray', 'four 4400 W power
    modules or three 6000 W AC power modules per tray'. What no document does is connect
    a rating to a FACEPLATE. The stencil master carries no part number, no legend and no
    input connector - on these trays the AC receptacles and DC lugs are on the tray, not
    on the module - so an AC module and a DC module of one version present the same
    face, and their ratings differ by 900 W at version 2 and 1600 W at version 3.
    Choosing one would be choosing which product this drawing is. A photograph of a
    module's own label closes this in one step.
  superseded-by: >-
    PREFER pwr-3kw-ac-v2 OR pwr-2kw-dc-v2. This component is the version 2 module's
    GEOMETRY with no power figure, because one drawing serves two part numbers and there
    was nothing to attach a rating to. Those two components are the same face with their
    ratings attached - the ASR 9000 Series data sheet's ordering table makes the wattage
    attributable to a part number, "AC power supply, 3000W" against PWR-3KW-AC-V2 and
    "DC power supply, 2100W" against PWR-2KW-DC-V2 - so a chassis that knows which it
    has should accept those instead, and its module total will then be a total rather
    than a floor. This one is kept for a bay that genuinely does not know which variant
    is fitted.
  lifecycle: >-
    searched - no end-of-life notice for this part is in the intake.
elements:
  input:
    at: [2.7, 8.01]
    size: [2.6, 2.6]
    class: led
    description: >-
      Input LED. ON continuously when the input voltage is present and within the correct
      range; BLINKING when the input voltage is out of acceptable range; OFF when no input
      voltage is present. Cisco states no colour for it.
    states:
    - 'off'
    - 'on'
    - {name: blinking, behavior: blinking}
  output:
    at: [2.7, 14.62]
    size: [2.6, 2.6]
    class: led
    description: >-
      Output LED. ON when the power module output voltage is present; BLINKING when the
      power module is in a power limit or overcurrent condition. Cisco states no colour
      for it.
    states:
    - 'off'
    - 'on'
    - {name: blinking, behavior: blinking}
  fault:
    at: [2.7, 21.23]
    size: [2.6, 2.6]
    class: led
    description: >-
      Fault LED. ON indicates that a power supply failure has occurred. Cisco states no
      colour for it, and gives no off-state sentence.
    states:
    - 'off'
    - 'on'
relief:
  wall: '#4a4f55'
skins: [default]
