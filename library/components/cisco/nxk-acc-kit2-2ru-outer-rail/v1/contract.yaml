format: 1
kind: component
name: nxk-acc-kit2-2ru-outer-rail
version: 1.0.0
class: mount
behaviour: mounts
profile: networking
description: >-
  The outer rail of the Cisco NXK-ACC-KIT2-2RU rack-mount kit, two to a kit. It latches to the
  front posts of a rack and extends to the rear posts, and the inner rail on the chassis
  slides into it. Drawn as a plain plate: no guide dimensions it.
size: {w: 12.0, h: 30.0}
size-confidence: {w: estimated, h: estimated}
provenance:
  model: >-
    datasheet - the Cisco N93180YC-FX3S NX-OS Mode Switch Hardware Installation Guide (Last
    Modified 2026-07-27), "Installing the Switch using the NXK-ACC-KIT2-2RU Rack-Mount Kit":
    "Rack-mount outer rails (2)", "Install the two outer rails to the front posts of the rack
    by aligning the rails to the post holes", "Fasten the two outer rails to the front posts
    of the rack by pushing the latch into place", then the same at "the back posts of the rack
    by extending them into place". The Cisco N93108TC-FX3 guide says the same.
  size: >-
    estimated - NO GUIDE DIMENSIONS THIS PART. 12.0 by 30.0 mm is a placeholder envelope for
    the rail seen end on; nothing measures it, and the length of the rail is not stated.
skins: [default]
