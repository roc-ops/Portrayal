format: 1
kind: module
name: asr-9010-fan
version: 1.0.0
class: cooling
profile: networking
description: >-
  Cisco ASR 9010 Router fan tray. Twelve axial 120 mm (4.72 in) fans behind a full-width
  band, with a pull handle across the middle, a grip and a captive screw at each end, a
  FAN STATUS lamp and a hazard label. The ASR 9010 carries two of these for redundancy
  and both are required for normal operation - if both are pulled or missing the router
  raises a critical alarm.
size: {w: 444.25, h: 33.32}
attrs:
  model: 'ASR-9010-FAN'
  role: 'fan-tray'
  fans: '12 x 120 mm axial'
  weight-kg: 6.29
  power-draw-max-w: 1100
  eol: 'none-announced'
provenance:
  body: >-
    NO `body:` BLOCK, AND THIS IS THE RECORD OF WHY. The renderer now admits class `cooling`
    to the set that draws a solid body and ejects (relief.js, commit 9e3d0cb), so this part
    is ELIGIBLE for one. It does not get one because a body needs a DEPTH and no document in
    the 112-document intake states this fan tray's: 'Cisco ASR 9010 Router Fan Trays' gives
    12 120-mm fans, two captive screws, two guide pins, a finger guard and a weight. Both
    searches were run - the part number across every doc.md, and the field name ('depth',
    'Physical specifications', 'Dimensions') across every doc.md, in the current Overview
    and Reference Guide AND in the older asr9kOVRGbk revision, since vendors delete tables
    between revisions. Exactly ONE Cisco fan tray or power module in the whole intake has a
    published depth - the ASR 9922/9912 tray, 23 inches, and it is stated in passing inside
    a sentence about a width change. WHAT WOULD CLOSE IT: a Cisco mechanical drawing, or the
    chassis interior measured from a photograph with a rule in frame. A body depth invented
    to make the part eject would be a solid-looking number in the one field a 3D viewer
    trusts absolutely, and `size.d` is deliberately absent for the same reason.
  relief: >-
    NO RELIEF FEATURE IS DECLARED AND THIS IS THE RECORD OF WHY. What should stand proud of
    this face: the captive screws; the pull handle; the grip flanges; and the status lamp, a
    domed lens on the real card. Each needs a depth in millimetres, and no document in the
    intake states one for any Cisco part. The searches, recorded so this can be overturned
    rather than repeated: every doc.md in the 112-document intake for 'protrud', 'extends
    outward', 'stands proud' and 'clearance in front' - the ONLY vendor in the whole intake
    that publishes a projection is UfiSpace, whose S9510-28DC datasheet gives its fan and
    PSU handle travel, and no Cisco document does; the per-card dimension tables, Table A-10
    of the older Ethernet Line Card Installation Guide and every data sheet's 'Physical
    dimensions (includes ejector bracket/lever)' row, which carry H, W, D and weight only -
    and where the ejector IS included it is included in the card's LONG axis, which this
    model already draws in 2D, not in its depth; and the ASR 9000 Visio stencil, whose 119
    masters are FRONT and REAR elevations with no side, top or isometric view, so it carries
    no depth axis to measure at all. The figures that DO show this hardware in three
    dimensions - Figure 48 of the Ethernet Line Card Installation Guide, 'Ejector Levers and
    Captive Screws', and Figure 1-8 of the ISM guide - are perspective drawings with a
    vanishing point and no scale, so they are authoritative for WHAT IS THERE and for
    nothing about size. The guide names the DRIVER ('a 3/16-inch flat-blade screwdriver')
    and the TORQUE (10 +/-1 in-lb), which fix neither the head diameter nor how far it
    stands proud. A lamp measured off a drawing whose aspect is wrong reads two different
    diameters and neither is the lens, so the drawing cannot supply this either. WHAT WOULD
    CLOSE IT: a mechanical drawing of the module, the captive screw's part number, the
    lamp's part number, or a photograph of the part with a rule in frame. THIS PARAGRAPH IS
    ONE STATEMENT, WRITTEN ONCE BY THE CISCO RELIEF PASS AND INSERTED INTO THE 1 SIBLING
    CONTRACTS that share this hardware - it is a single search, not 1 agreeing readings.
  size: >-
    drawing - and NOT from a fan-tray master, because there is not one. The ASR 9010's
    own front master draws BOTH trays in place, labelled ASR-9010-FAN with their FAN
    STATUS legends and hazard labels, so the part is measured off the chassis it sits
    in: the band runs x 23.97 to 468.22 and y 571.44 to 604.76 in that master's frame,
    giving 444.25 x 33.32 mm. The Y ANCHOR IS EXACT - the chassis master's 21 RU is
    933.45 mm and lands on the shape box to 0.05 mm - and every feature below is
    measured in that same frame. THE X ANCHOR IS THE ONE TO CHECK: this art's bounding
    box is 492.38 mm where the shape box says 482.60, so an x scale taken from the art
    would be 2 percent generous. 444.25 is quoted as measured because it lands within a
    quarter of a millimetre of the 444.5 mm chassis body asr9k-chassis measured
    independently, which is what a full-width tray should do - but if that agreement is
    coincidence rather than corroboration, this is the number to re-derive first.
  lamp: >-
    install guide - the Overview and Reference Guide's 'Fan Tray Status Indicators':
    'After fan tray insertion into the chassis, the LED lights up temporarily appearing
    yellow. During normal operation: The LED lights green to indicate that all fans in
    the module are operating normally. The LED lights red to indicate a fan failure or
    another fault in the fan tray module.' Four states; yellow is the insertion state
    and is real.
  fans: >-
    install guide - 'Cisco ASR 9010 Router Fan Trays' in the Overview and Reference
    Guide: 'The Cisco ASR 9010 Router contains two fan trays for redundancy... The fan
    tray contains 12 axial 120-mm (4.72-in) fans. There is a fan control board at the
    back end of each tray with a single power/data connector that connects with the
    backplane. The fan tray aligns through two guide pins inside the chassis, and it is
    secured by two captive screws... The maximum weight of the fan tray is 13.82 lb
    (6.29 kg).' The guide adds that 'Both fan trays are required for normal system
    operation for the Cisco ASR 9010 Router and Cisco ASR 9006 Router. If both fan trays
    in the router are pulled out or are not installed, a critical alarm is raised.'
  power: >-
    install guide - Table 24 of the Overview and Reference Guide, and THERE ARE TWO ROWS
    because there are two generations of this tray. 'ASR 9010 Fan Tray V1': 200 W at 25
    C, 300 at 40, 600 at 55. 'ASR 9010 Fan Tray V2': 240 W at 25 C, 960 at 40, 1100 at
    55. Both part numbers are real - ASR-9010-FAN and ASR-9010-FAN-V2 both appear in the
    IOS XR 24.3.2 firmware table. THE V2 FIGURE IS CARRIED, 1100 W, because this
    component is named for the tray without a version suffix and the V2 is the current
    one, and because a budget built on 600 W would be 500 W short per tray if a V2 is
    fitted. That is a choice between two Cisco figures rather than a reading of one, and
    it is the kind of choice worth seeing: if you know the tray is a V1, 600 is the
    number.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake, though
    EOL9675 retires the version 1 POWER bundle for this chassis, which is a different
    part.
elements:
  status:
    at: [16.5, 1.7]
    size: [3.0, 3.0]
    class: led
    description: >-
      the fan tray's Run/Fail status LED, one per tray.
    states:
    - {name: green, color: '#39b54a'}
    - {name: yellow, color: '#f5c518'}
    - {name: red, color: '#d0021b'}
    - 'off'
relief:
  wall: '#4a4f55'
skins: [default]
