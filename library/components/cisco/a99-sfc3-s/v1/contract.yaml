format: 1
kind: module
name: a99-sfc3-s
version: 1.0.0
class: fabric
profile: networking
description: >-
  Cisco ASR 9900 Series Third Generation Switch Fabric Card for the ASR 9910. A
  double-width plate - 76.2 mm against a line card's 41.4 - and longer than a line card
  at 492.1 mm. Two ejector levers, captive screws and a single tri-colour Status LED; no
  vent field.
size: {w: 76.2, h: 492.1}
attrs:
  model: 'A99-SFC3-S'
  role: 'switch-fabric'
  generation: '3rd'
  chassis: 'ASR 9910'
  power-draw-max-w: 170
  eol: 'none-announced'
provenance:
  size: >-
    drawing - the stencil master, and for THIS master the shape box is usable where it
    was not for the cards. The card masters are padded: their shape box aspect (0.1166)
    disagrees with their own art (0.1122). This master's agrees - 0.1548 shape against
    0.1552 art for the -S, 0.0888 against 0.0890 for the -T - so the box is the art box,
    at the stencil's 1:10 inches, giving 76.2 x 492.1 mm and 43.7 x 492.1 mm. Checking
    the box against the art before using it is the whole of the method here; it is what
    caught the cards. NO document in the intake states a fabric card's dimensions.
  depth: >-
    NOT MODELLED. No document in the intake gives a fabric card's depth, and unlike the
    line cards there is no datasheet row to take it from. Rather than inherit the line
    cards' 604.5 - which would be a guess dressed as a measurement, and these cards do
    not even share the line cards' length - the component declares a faceplate and no
    body. It will render as a face rather than a box in 3D, and that is the honest
    depiction of what is known.
  lamp: >-
    install guide - Table 9, 'FC Card LED Display Definitions', of the Overview and
    Reference Guide. Four states, transcribed rather than reduced: green, red, amber and
    off, each with the sentence Cisco prints beside it. This is a sourced vocabulary,
    not the RSP's borrowed.
  chassis: >-
    datasheet - Third Generation Switch Fabric Card 3 Data Sheet, Table 3: 'A99-SFC3-S
    (supports ASR 9910 chassis)'.
  power: >-
    install guide - Table 23 of the Overview and Reference Guide, row 'A99-SFC3-S Card':
    150 W at 27 C, 160 W at 40 C, 170 W at 55 C. max is the highest rated ambient.
    Unlike the A99-SFC3 this part number has ONE row, because it serves one chassis. No
    typical is stated.
  shared-art: >-
    the A99-SFC3-S and A99-SFC-S masters are the SAME DRAWING - every rectangle and
    every rounded shape in the two files agrees to 0.01 mm, and only the printed part
    number differs. That is consistent with the Hardware Installation Guide's 'Migrating
    from A99-SFC-S/A99-SFC-T to A99-SFC3-S/A99-SFC3-T Card' procedure, which is a card
    swap into the same slot. It is recorded rather than assumed away: if the two
    generations really do differ on the faceplate, the stencil is what is wrong.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
elements:
  status:
    at: [36.4, 358.4]
    size: [3.2, 3.2]
    class: led
    description: >-
      the single tri-colour Status LED. Table 9, 'FC Card LED Display Definitions', of
      the Overview and Reference Guide: green - FC card powered on and FPGA is
      programmed; red - fault or malfunction in FC card power up or FPGA programming;
      amber - FC card powered on but fabric not active; off - FC card powered off via
      CLI. Cisco's own note on the green state is worth carrying: 'Fabric Data Link
      failure is not detected so LED remains green'.
    states:
    - {name: green, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - {name: red, color: '#d0021b'}
    - 'off'
relief:
  wall: '#4a4f55'
skins: [default]
