format: 1
kind: module
name: nc57-c3-fan2-fw
version: 1.2.0
class: fan
behaviour: fills
profile: networking
description: >-
  The fan tray with two 60 mm fans of the Cisco NCS-57C3-MOD, ordered as NC57-C3-FAN2-FW, for fan tray slots 0 and 1. It
  installs from the rear: two round fans one above the other, a black pull handle at the right and a status lamp at the
  lower left. Airflow is port-side intake. The -HX chassis takes the NC57-C3-FAN2-HX instead.
size: {w: 66.0, h: 126.0}
size-confidence: {w: photo-measured, h: photo-measured}
part-numbers:
  NC57-C3-FAN2-FW: {part: NC57-C3-FAN2-FW}
attrs:
  airflow: front-to-back
  hot-swappable: 'yes'
  power-absent: not-published
provenance:
  model: >-
    datasheet - Hardware Installation Guide for Cisco NCS 5700 Series Fixed-Port Routers (first published 2021-06-23, last
    modified 2026-05-15), Fan Modules and Fan Trays: "Fan tray slots 0 and 1 support fan tray assembly with 2x60mm fans
    (NC57-C3-FAN2-FW/NC57-C3-FAN2-HX)"; Figure 4. The router "has 6 latched fan trays that install into the chassis from the
    rear"; each tray has two fan units. The fan modules work with N+1 redundancy.
  power: >-
    NOT STATED. Searched the guide for the tray's watts, amps and CFM: only supply ratings are given. No power figure is
    written, and lint's missing-power warning stands.
  size: >-
    photo-measured - Figure 20 (a flat rear elevation) at about 2.87 px/mm taken from the chassis width of 438.4 mm: the
    tray reads about 66 mm wide and 126 mm high (slots 0 and 1). The guide prints no dimension of the tray.
  guard: >-
    photo-measured - Figure 20 draws each 60 mm fan behind a round hex-mesh guard (holes about 2.8 mm across on a 2.6 mm pitch, ribs about 0.2 mm)
    with a ring, a second inner ring, eight radial spokes and a hub, on the tray's own grey with no dark square behind it. Scale
    anchor: the chassis width of 438.4 mm is 2337 px on the guide page at 400 dpi, 5.33 px/mm. The grille is 297 to 300 px (56 mm)
    across a tray 350 px (66 mm) wide, 0.85 of the width, centred 31.5 mm from the tray's left edge and 33 mm and 93.5 mm down;
    the earlier drawing was 46 mm (0.70). The figure draws curved blades behind the grille, not spokes; the spokes stay a
    simplification.
  handle: >-
    photo-measured - Figure 20: the black handle is a loop, a bar across the top (5 to 11.6 mm down) and another across the bottom
    from x 33 mm, joined by a bar 6.2 mm wide at the right edge, passing over the fans' right sides; not a plain slab. The grey
    release latch with two screws at the right and the two small holes at the left are drawn from the same figure.
  elements: >-
    photo-measured - two fans, the handle and the lamp read from Figure 20 and Figure 4. The lamp is Figure 135's STATUS lamp
    on the bottom-left corner (the table under Figure 135: green fan operating normally, red fan failure, off not receiving power). The guide gives the tray an airflow
    direction only as "port-side" parts; FW is carried as front-to-back.
  depth: >-
    estimated - not stated in any held document; 80 mm is a round figure for a fan tray of this class.
states: [absent]
elements:
  fan-a: {at: [3.0, 5.5], size: [56.0, 56.0], class: rotor}
  fan-b: {at: [3.0, 65.0], size: [56.0, 56.0], class: rotor}
  handle: {at: [59.0, 5.2], size: [6.2, 117.9], class: handle}
  status: {at: [5.1, 117.7], size: [3.6, 3.6], class: led, states: ['off', {name: ok, color: '#22c55e'}, {name: failed, color: '#ef4444'}]}
skins: [default]
body:
  depth: 80
  color: '#26292d'
  footprint: {at: [0, 0], size: [66.0, 126.0]}
