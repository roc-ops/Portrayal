format: 1
kind: module
name: a9k-1600w-ac
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9901 1600 W AC power module. One axial fan behind a wire finger
  guard on the left half, a Saf-D-Grid appliance inlet in the middle, a
  release latch down the right edge and one OK lamp. The ASR 9901 takes two of
  these; AC and DC modules may not be mixed in one chassis.
size: {w: 71.21, h: 39.21}
size-confidence: {w: drawing, h: drawing}
size-notes: >-
  both axes from one source - the "ASR-9901 Rear" master, in a chassis face
  calibrated on the ASR 9901 data sheet's 439.93 x 87.12 mm body, where the two
  modules are drawn populated and measure 71.21 x 39.21 and 71.26 x 39.25 - two
  readings of one part agreeing to 0.05 mm. Taking one axis from each of two
  sources is the error that made a Cisco power module 3.66 mm too wide.
attrs:
  model: 'A9K-1600W-AC'
  power-output-w: 1600
  role: 'power-module'
  input: 'ac'
  fans: '1'
  eol: 'none-announced'
provenance:
  inlet: >-
    THE CORD TABLE NAMES THE CONNECTOR AND IT IS NOT AN IEC APPLIANCE INLET.
    Table 11 of the fixed-port Hardware Installation Guide, "AC-Input Power Cord
    Options for Cisco ASR 9901 Router", lists sixteen cords and every one of them
    is a CAB-AC-*-SG-* - CAB-AC-16A-SG-EU, -UK, -JPN, -AR and the rest at 16 A
    250 VAC, with CAB-AC-20A-SG-US and -US1 at 20 A 110 and 125 VAC. SG is
    Anderson's Saf-D-Grid, and the master draws that profile rather than a C14.
    The rating is why the connector is what it is: 1600 W off a 90 V low line is
    nearly 18 A, past what a C14 is rated to carry.
    IT IS NOW COMPOSED RATHER THAN DRAWN. std/saf-d-grid@1 carries Anderson's own
    panel cutout - 26.80 x 19.90, corners R2.5 max, off drawing 115171S1 - and it
    is placed `rotate: 90` because this module mounts the receptacle upright. The
    hand-drawn opening this replaced was a shape read off the Cisco master; the
    standard's figure is a measurement of the connector.
    WHICH WAY ROUND THE QUARTER TURN GOES IS NOT SOURCED. Anderson's front view
    puts the ground contact above the positive and negative; turned upright it
    lands on one side or the other, and the Cisco master's rendering of the
    coupler is too stylised to say which. `rotate: 90` is a choice between two
    equally undetermined options and the consequence is which side a 3 mm
    contact is drawn on. A photograph of an A9K-1600W-AC's face settles it.
    AND THE TWO AGREE, WHICH IS THE CHECK WORTH RECORDING. The Cisco master draws
    this module's aperture 19.98 x 26.51 mm at a scale set by the ASR 9901's body
    width alone; Anderson's cutout turned a quarter turn is 19.90 x 26.80. That
    is 0.4 percent across and 1.1 percent down, between two documents that share
    no author, no units convention and no measurement - and neither figure was an
    input to the other.
    `attrs.inlet` IS GONE RATHER THAN SET. The schema's vocabulary is c14, c20,
    dc-terminal, other and none, and its own description says a module that
    composes an inlet part "needs nothing here" - the composed part is the strong
    form and carries the standard, the cutout and the size. Saying `other` beside
    a part that names the connector exactly would be the weaker statement of two.
  input: >-
    datasheet - Table 2 of c78-740540: "Worldwide ranging AC (90-265V; 50-60 Hz)".
  size: >-
    drawing - see size-notes. NO DOCUMENT IN THE INTAKE DIMENSIONS THIS MODULE:
    the Cisco ASR 9901 Router Data Sheet (c78-740540) gives the chassis envelope
    and the two power-supply part numbers and stops, and the fixed-port Hardware
    Installation Guide's power chapters give input ranges, cord options and
    replacement steps and no envelope. DEPTH IS THEREFORE ABSENT rather than
    estimated.
    IT IS NOT THE ASR 9902'S MODULE. cisco/pwr-1p6kw-ac@1 is 74.94 x 40.91 mm and
    carries a different part number; this is 3.7 mm narrower and 1.7 mm shorter,
    which is what two different 1.6 kW supplies should look like rather than two
    readings of one.
  power: >-
    datasheet - the part number states 1600 W and Table 2 of c78-740540 lists it
    outright: "Power supply part number: A9K-1600W-AC, A9K-1600W-DC". The same
    table gives the CHASSIS envelope beside it - "850 watts typical, 1100 watts
    maximum" - which is what the box draws, not what a supply can give; the two
    are recorded in different places for that reason.
  lamp: >-
    install guide - the AC-input troubleshooting table, whose LED column reads
    "OK (Cisco ASR 9901) / STATUS (Cisco ASR 9903 and Cisco ASR 9902)" and gives
    five states for it: "Solid Green - Power supply is on and outputting power.
    Flashing Green - Power supply is connected to input power or FPD upgrade in
    progress. Amber - Power supply failure, due to one of the following: Over
    voltage, Over current, Over Temperature, Fan failure. Flashing Amber - Power
    supply is operating but a warning condition ... High temperature, High power,
    Slow fan. Off - Power supply is not receiving power." THE LEGEND IS OK ON
    THIS CHASSIS AND STATUS ON THE OTHER TWO, which is Cisco's own distinction
    and is why the element's description says OK rather than STATUS. Figure 163
    confirms the position: its one callout points at the lamp above the +DC mark.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
parts:
  - {ref: std/saf-d-grid@1, id: inlet, at: [38.13, 6.51], rotate: 90}
elements:
  ok:
    at: [64.30, 3.20]
    size: [3.0, 3.0]
    class: led
    description: >-
      the module's OK lamp - Cisco's legend for this chassis, where the ASR 9902
      and ASR 9903 modules print STATUS. One per module.
    states:
    - {name: green, color: '#39b54a'}
    - {name: green-blink, behavior: blinking, color: '#39b54a'}
    - {name: amber, color: '#f5a623'}
    - {name: amber-blink, behavior: blinking, color: '#f5a623'}
    - 'off'
relief:
  wall: '#4a4f55'
  features:
    - node: latch
      out: 4.2
      confidence: estimated
      source: >-
        edgecore/agr-psu-dc@1 latch - the library's one release-hardware figure.
        That contract sources the latch's ARRANGEMENT from photographs, never its
        proudness
    - node: ok
      dome: 0.3
      confidence: estimated
      source: >-
        common/led-dot@1 - the library's one panel-lamp figure. Its own
        provenance is 'size: estimated' and the dome carries none
skins: [default]
