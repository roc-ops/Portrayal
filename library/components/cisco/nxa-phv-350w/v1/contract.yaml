format: 1
kind: module
name: nxa-phv-350w
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 350 W PHV (HVAC/HVDC) power supply of the Cisco Nexus 9348GC-FX3 and 9348GC-FXP fixed
  switches. It is ordered as NXA-PHV-350W-PI (port-side intake, burgundy latch) or
  NXA-PHV-350W-PE (port-side exhaust, blue latch). No picture of this supply is held. The face
  is drawn from its 350 W AC sibling and the inlet is a plain recess.
size: {w: 84.7, h: 40.6}
size-confidence: {w: estimated, h: estimated}
attrs:
  model: 'NXA-PHV-350W'
  power-output-w: 350
  input: hvac-hvdc
  inlet: other
  input-voltage: '240 to 380 Vdc, 100 to 277 Vac'
  efficiency: 'Climate Savers Platinum Efficiency (80Plus Platinum certified)'
  weight-kg: 1.2
  airflow: front-to-back
provenance:
  model: >-
    datasheet - the Cisco N9348GC-FX3 NX-OS Mode Switch Hardware Installation Guide (First
    Published 2023-08-18, Last Modified 2026-09-18), Overview: "350-W PHV power supply with
    port-side intake airflow (burgundy coloring) (NXA-PHV-350W-PI)" and "... exhaust airflow
    (blue coloring) (NXA-PHV-350W-PE)". The 9348GC-FXP guide lists the same two as "350-W
    HVAC/HVDC power supply". THE AIRFLOW SUFFIX IS DROPPED from the model, as on
    cisco/nxa-pac-500w@1.
  power: >-
    datasheet - appendix B, "350-W PHV Power Supply Specifications": input voltage "240 to 380
    VDC 100 to 277 VAC", 50 to 60 Hz, "Maximumoutput power per power supply 350W" (an OUTPUT
    rating, so `power-output-w`), Climate Savers Platinum, form factor RSP1. The weight is the
    guide's weights table, 2.64 lb (1.2 kg), printed once for the 350 W AC, 350 W PHV and 440 W
    DC supplies.
  size: >-
    estimated - THE GUIDE STATES NO DIMENSION, only "Form factor RSP1". The size is
    cisco/nxa-pac-350w@1's.
  elements: >-
    estimated - NO PICTURE OF THIS SUPPLY IS HELD. The guide's figure shows AC supplies only
    ("AC power supplies shown"). The housing, grille, lamps and latch are
    cisco/nxa-pac-350w@1's arrangement; the inlet window is a plain dark recess because the
    guide does not describe the connector.
  lamps: >-
    datasheet - appendix C, "Power Supply LEDs", one table for every supply.
  latch-colour: >-
    datasheet for the convention - burgundy for port-side intake and blue for port-side
    exhaust. The values are cisco/nxa-pac-500w@1's.
  depth: >-
    estimated - not stated. 185 mm is cisco/nxa-pac-500w@1's round figure.
  connector: >-
    the supply composes std/saf-d-grid@1 as `inlet`, inside the surround the skin already draws for it. The Cisco
    N9348GC-FX3 NX-OS Mode Switch Hardware Installation Guide names the connector in "Starting the Switch" (PDF
    page 33): the power cable's "Anderson Power Saf-D-Grid connector" goes into the power receptacle on the
    supply, for any HVAC/HVDC supply, and again in "Installing an HVAC/HVDC Power Supply" (PDF page
    46); its cable table lists CAB-HVAC-SD-0.6M, CAB-HVAC-C14-2M, CAB-HVAC-RT-0.6M and CAB-HVDC-3T-2M, "Saf-D-Grid
    and three terminal connectors". The Cisco N9336C-FX2-E guide says the same of its HVAC/HVDC supplies. NO FIGURE
    SHOWS THIS SUPPLY'S INLET (the guide's figure shows AC supplies only), so the part's turn and place are
    estimates: it is seated unturned, centred in the surround, in the landscape window the skin draws. The
    library's cable connector generic/saf-d-grid-plug@1 mates it. The skin is unchanged.
  no-dc-port: >-
    NO DC PORT IS STATED. The supply takes HVAC or HVDC at one connector, and the library's DC power model leaves
    HVDC out. The HVDC cable's source end carries three terminal rings, ground, negative and positive (the guide's
    "Starting the Switch" steps 3 to 5 and the cable table's "three terminal connectors"); the guide does not say
    which contact of the connector each lands on, so no role is stated here.
