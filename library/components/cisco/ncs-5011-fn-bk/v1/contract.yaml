format: 1
kind: module
name: ncs-5011-fn-bk
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  The one-rack-unit fan module of the Cisco NCS 5011, ordered as NCS-5011-FN-BK: back-to-front airflow, which
  the guide calls port-side exhaust. The same face as the front-to-back NCS-5011-FN-FR: a dark honeycomb grille
  filling the face with a pull handle across its middle. Hot-swappable.
size: {w: 52.0, h: 40.0}
size-confidence: {w: estimated, h: estimated}
part-numbers:
  NCS-5011-FN-BK: {part: NCS-5011-FN-BK}
attrs:
  airflow: back-to-front
  hot-swappable: 'yes'
  power-absent: not-published
provenance:
  model: >-
    datasheet - Hardware Installation Guide for Cisco NCS 5000 Series Routers (first published 2015-12-23, last
    modified 2019-01-31), Table 7: NCS-5011-FN-BK "Cisco NCS 5011 Router Fan Back to Front Airflow", with a spare
    NCS-5011-FN-BK= that is the same part. The guide does not say the two airflow parts look different, so the
    face is the front-to-back part's face.
  power: >-
    NOT STATED. Searched the guide for the fan module's watts, amps and CFM: Appendix C gives power-supply figures
    only. No power figure is written, and lint's missing-power warning stands.
  size: >-
    estimated - as for NCS-5011-FN-FR: a fraction of the rear face in Figure 5, one-rack-unit height.
  elements: >-
    estimated - as for NCS-5011-FN-FR; Figure 5 is a three-quarter view. No fan-module lamp is named, so none is
    drawn.
  latch-colour: >-
    NOT STATED for either airflow; the guide's fan figures are greyscale.
  depth: >-
    estimated - not stated in any held document; 100 mm is a round figure for a fan module of this class.
states: [absent]
elements:
  grille: {at: [2.0, 2.0], size: [48.0, 36.0], class: rotor}
  handle: {at: [6.0, 15.0], size: [40.0, 10.0], class: handle}
relief:
  wall: '#15181b'
  features:
    - node: grille
      vent: 24
      confidence: estimated
      source: the grille's extent is read off Figure 5; the cavity behind it is not stated.
    - node: handle
      uhandle: 12.0
      color: '#4a4f55'
      confidence: estimated
      source: Figure 5 shows the handle standing clear of the face; 12 mm is a reading of its proportions.
skins: [default]
body:
  depth: 100
  color: '#26292d'
  footprint: {at: [0, 0], size: [52.0, 40.0]}
