format: 1
kind: component
name: stackpower-port
version: 1.0.0
class: port
profile: networking
description: >-
  A Cisco StackPower connector of the Catalyst 9300 (labelled S-PWR 1 and S-PWR 2, the first
  also marked XPS) - a keyed two-blade power connector in a recess at the rear, for a
  StackPower cable or an XPS 2200. It is Cisco's own connector and has no registry standard.
size: {w: 23.6, h: 18.5, d: 25.0}
size-confidence: {w: estimated, h: estimated, d: estimated}
attrs: {media: stackpower}
provenance:
  model: >-
    datasheet - Cisco Catalyst 9300 Series Switches Hardware Installation Guide (first
    published 2017-06-20, last modified 2026-05-15), Figure 10 callout 7, "StackPower
    connectors", and StackPower Connector: "The C9300 switches have a StackPower connector for
    use with Cisco StackPower cables to configure a switch power stack that includes up to
    four switches", with the cables CAB-SPWR-30CM and CAB-SPWR-150CM.
  size: >-
    estimated - THE GUIDE PRINTS NO DIMENSION OF THE CONNECTOR. The community NetBox rear
    elevation of the C9300-48T draws each recess 23.6 x 18.5 at 5.03 px per mm (its 19 inch
    width over 2428 px). The depth is a reading.
  registry: >-
    There is no standard for it: no entry of spec/schemas/standards.yaml, and no other
    component in the library presents a StackPower connector.
elements:
  opening: {at: [0.0, 0.0], size: [23.6, 18.5], class: mechanical}
skins: [default]
