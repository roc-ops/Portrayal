name: 69-2037-xx-bracket
version: 1.0.0
class: ear
behaviour: mounts
description: >-
  The L-shaped rack-mount bracket of Cisco's standard rack-mount kit 69-2037-xx, one of the
  two the kit ships. It bolts to the side of a Catalyst 4948E or 4948E-F with four M4 screws,
  at the front or the rear, and its flange bolts to the rack post with two screws.
size: {w: 14.0, h: 43.5}
size-confidence: {w: estimated, h: estimated}
