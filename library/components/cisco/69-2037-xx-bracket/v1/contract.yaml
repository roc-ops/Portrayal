  model: >-
    datasheet - Catalyst 4948E and Catalyst 4948E-F Switch Installation Guide OL-21561-02,
    Table 3-1 and "Attaching the Rack-Mount Brackets to the Chassis": "Two rack-mount brackets
    are included as part of the rack-mount kit (69-2037-xx)", "Eight M4 x 8 mm Phillips
    flat-head screws for attaching the brackets to the switch", "four (two on each side)"
    10-32 or 12-24 x 3/4-inch screws to the rack post.
  size: >-
    estimated - no document dimensions the bracket. The envelope is the generic 1U ear's
    (common/rack-ear@1, EIA-310 proportions), and Figure 3-1 is an isometric drawing.
