format: 1
kind: module
name: n9k-c9504-fm-g
version: 1.0.0
class: fabric
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9504 fabric module for the 400-Gigabit -GX line cards (N9K-C9504-FM-G). A vertical module with
  a vented face, ejector levers, a BCN lamp and a status lamp; it sits in the rear of the chassis behind a
  fan tray and requires the N9K-C9504-FAN2 trays. A slot left without a fabric module takes the
  N9K-C9504-FAN-PWR card.
size: {w: 62.48, h: 238.76, d: 297.18}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
attrs:
  model: 'N9K-C9504-FM-G'
  role: 'fabric-module'
  power-draw-typical-w: 270
  power-draw-max-w: 504
  weight-kg: 3.53
  hot-swappable: true
  eol: 'unknown'
provenance:
  size: >-
    datasheet - Cisco N9504 NX-OS Mode Switch Hardware Installation Guide, Appendix A "Switch Dimensions"
    (printed p114, PDF p120), "Fabric modules": 2.46 in (6.25 cm) wide, 11.7 in (29.72 cm) deep, 9.4 in
    (23.88 cm) high. One row serves every fabric type.
  power: >-
    datasheet - the chassis's own "Planning for Power Requirements" table (PDF p18, printed p12), the row
    "Line cards that are supported by N9K-C9504-FM-G fabric modules": 270 W typical, 504 W maximum. The
    guide's worked example (PDF p21, printed p15) counts six fabric modules at 504 W, which confirms the
    maximum. The guide's first table is a copy of the 9508's and is not used.
  compatibility: >-
    install guide - "Overview" Table 1 (PDF p9, printed p3), printed "N9K-C9504-FM-G1": the footnote says
    "-G fabric modules require the N9K-C9504-FAN2 fan trays for operation", and the note beneath says that
    with FM-G modules "any empty slots should be filled with FAN-PWR modules (N9K-C9504-FAN-PWR)". The
    migration caution (PDF p118, printed p112) names "N9K-C950x-FM-G-Z" for empty slots; that is the 9508
    guide's text copied, no 9504 part number is made from it, and the guide's fabric-module LED text lists
    only the FM, FM-E and FM-S as powering a fan tray.
  weight: >-
    datasheet - Appendix A weights table (PDF p122, printed p116): 7.78 lb (3.53 kg).
  lamps: >-
    install guide - "Fabric Module LEDs" (PDF p136, printed p130): a BCN lamp (blue) and a status lamp.
    Positions estimated.
  skin: >-
    estimated - a vented face and two ejector levers, read from the rear figure of the overview (PDF p11,
    printed p5), which is isometric; no figure dimensions them.
  lifecycle: >-
    unknown - Cisco's support page gives no sale status for this part number, and no end-of-sale notice for
    it is held.
elements:
  bcn:
    at: [10.0, 208.2]
    size: [3.0, 3.0]
    class: led
    description: BCN lamp. The BCN lamp on the fan tray that covers the module also lights.
    states:
    - {name: blue, color: '#2a7de1'}
    - 'off'
  status:
    at: [48.0, 208.2]
    size: [3.0, 3.0]
    class: led
    description: Status lamp.
    states:
    - {name: green, color: '#39b54a'}
    - {name: flashing-green, color: '#39b54a', behavior: blinking}
    - {name: flashing-yellow, color: '#f5c518', behavior: blinking}
    - {name: flashing-red, color: '#d0021b', behavior: blinking}
    - {name: flashing-amber, color: '#f5a623', behavior: blinking}
    - 'off'
skins: [default]
