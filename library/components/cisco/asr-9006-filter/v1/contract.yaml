format: 1
kind: module
name: asr-9006-filter
version: 1.0.0
class: filter
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9006 Router chassis air filter. A framed mesh panel along the right side of the
  chassis, reached from the rear and held by one thumb screw. It slides out rearwards. The router
  takes one. Cisco recommends replacing it at regular maintenance intervals, between 3 and 12
  months depending on the environment.
size: {w: 52.0, h: 279.63}
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  no document states the filter's size; it is the opening the chassis already drew on its right
  face, which was itself read from a perspective figure with no dimension lines
attrs:
  model: 'ASR-9006-FILTER'
  part-number: 'ASR-9006-FILTER'
  role: 'air-filter'
provenance:
  sources: >-
    Cisco ASR 9000 Series Aggregation Services Router Hardware Installation Guide: "Replacing the
    Chassis Air Filter" and Table 17 "Air Filter Locations for the Cisco ASR 9000 Series
    Routers" (printed p228-229), Figure 207 "Replacing the Cisco ASR 9006 Router Chassis Air
    Filter" (printed p230, PDF p244). Cisco ASR 9000 Series Aggregation Services Routers Data
    Sheet (c78-501767) p7, "Thermal Infrastructure" table, row "Cisco ASR 9006 fan filter, 1 per
    chassis". Cisco ASR 9000 release notes, "Cisco ASR 9000 Series Aggregation Services Router
    6-Slot Air Filter".
  part-number: >-
    datasheet - Data Sheet c78-501767 p7: ASR-9006-FILTER, described there as the "fan filter, 1
    per chassis". The release notes name the same number as the "6-Slot Air Filter".
  position: >-
    datasheet - Table 17 p229: "Located along the right side of the chassis and is accessible from
    the rear". Figure 207 shows the panel swung out of the right face with its thumb screw at the
    lower edge.
  size: >-
    estimated - Figure 207 is a three-quarter perspective drawing with no dimension lines, so it
    cannot give an absolute size. The width and height are the opening the chassis drew for the
    filter. No depth is stated anywhere, so none is carried.
  serviceability: >-
    The note on printed p228 says the chassis air filter of the ASR 9006 is "not serviceable" and
    should be replaced at regular maintenance intervals; the procedure that follows loosens the thumb
    screw and slides the filter out. Both are recorded: the filter is replaced as a unit and is not
    cleaned.
  colour: >-
    estimated - Figure 207 is line art in black and white, so no colour is printed. A neutral grey
    frame and a darker mesh are drawn.
  mesh: >-
    estimated - the figure shows a rectangular grid in a frame; its pitch is not dimensioned and is
    drawn at 8 mm for the look of a mesh, not as a measurement.
  lifecycle: >-
    searched the staged ASR 9000 documents - no end-of-sale notice for ASR-9006-FILTER is held
skins: [default]
