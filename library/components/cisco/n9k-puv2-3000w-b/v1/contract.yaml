format: 1
kind: module
name: n9k-puv2-3000w-b
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  Cisco N9500 Series 3.15-kW Dual Input Universal AC/DC power supply (N9K-PUV2-3000W-B). One supply with
  two redundant high-voltage input lines, each a Saf-D-Grid receptacle, and a power switch; it delivers
  3150 W with either line or both. It stands on end in a power-supply bay, with the OK and FAIL lamps at
  the upper left. The Nexus 9504, 9508 and 9516 take the same part.
size: {w: 44.45, h: 133.35, d: 450.85}
size-confidence: {w: estimated, h: estimated, d: datasheet}
attrs:
  model: 'N9K-PUV2-3000W-B'
  role: 'power-module'
  input: 'ac-dc'
  inputs: 2
  power-output-w: 3150
  input-voltage: '180 to 305 VAC or 192 to 400 VDC'
  input-frequency: '50 to 60 Hz'
  efficiency: '90% or greater (20 to 100% load)'
  airflow: 'port-side intake'
  hot-swappable: true
  eol: 'unknown'
provenance:
  size: >-
    estimated - Cisco N9508 NX-OS Mode Switch Hardware Installation Guide, Appendix A "Switch Dimensions"
    (printed p113, PDF p119): 5.25 in by 1.75 in, 17.75 in deep. The figures (PDF pp102-103) stand the
    supply on end, so 44.45 mm wide by 133.35 mm high. The guide gives no separate row for this supply, so
    the dimensions are the table's one "Power supply" row.
  depth: >-
    datasheet - the same table, 17.75 in (450.85 mm) inside the chassis.
  power: >-
    datasheet - the guide's "3000-W Dual Input Universal AC/DC Power Supply Specifications" table (printed
    under that title but stating 3150 W): 3150 W; input "180 to 305 VAC or 192 to 400 VDC or"; 50 to 60
    Hz; efficiency 90 percent or greater. CONFLICT: the text of "Installing or Replacing a 3.15-kW Dual
    Input Universal AC/DC Power Supply" says the supply accepts 200-240 VAC or 240/380 VDC. The
    specifications table is used, as the table that states the supply's rating.
  lamps: >-
    install guide - "Power Supply LEDs", OK and FAIL or FAIL/ID, upper left. Positions estimated.
  skin: >-
    estimated - two input lines are stated ("grid A ... the receptacles closest to the power switch, grid B
    ... the receptacles furthest from it"), and the figure on PDF p106 shows two receptacles; no figure
    dimensions them, so the skin's positions are estimated.
  inlet-part: >-
    COMPOSED, NOT DRAWN, SINCE 1.1.0: std/saf-d-grid@1 twice, as the parts inlet-1 and inlet-2, so a power
    cord lands on each of the supply's two input lines. THEIR PLACE IS ESTIMATED, read off the drawing
    they replace: that drawing's two boxes (each 28.5 x 20.0, at [8.0, 66.0] and [8.0, 90.0]) were
    themselves estimated from the guide's figures, none of which dimensions the receptacles. The part's own
    26.8 x 19.9, turned on end, is 26.8 tall and the two boxes were 24.0 apart, so the two parts cannot
    stand on the boxes' centres: they stand one above the other on the boxes' common centre line,
    x 22.25, 0.6 apart (inlet-1 on y 58.4 to 85.2, inlet-2 on y 85.8 to 112.6), the pair as low as the
    drawn power switch below it allows, and the skin's vent is 2.4 shorter (53.6 high, where it was 56.0)
    so that the upper part stands clear of it. THEIR TURN IS ESTIMATED TOO, AND WHICH WAY ROUND THE
    QUARTER TURN GOES IS NOT SOURCED. The Cisco N9508 NX-OS Mode Switch Hardware Installation Guide draws
    this supply in an isometric figure under "Installing or Replacing a 3.15-kW Dual Input Universal
    AC/DC Power Supply" (PDF p108; the N9504 guide's PDF p112 and the N9516 guide's PDF p108 carry the
    same figure): two receptacles one above the other on the face, each standing on end, taller than
    wide, as shrouds that stand proud of it. The figure is 300 by 342 pixels and shows neither their
    blades nor their keyed corners. 90 is the turn the library gives every other supply that stands this
    receptacle on end (cisco/a9k-1600w-ac@1, cisco/n9k-puv-1200w@1, edgecore/ais800-psu-ac@1,
    arista/7280dr3a-pwr-3000@1). The guide says which line is which, "grid A to the receptacles closest to
    the power switch" and grid B to those furthest from it (the N9508 guide's PDF p107; the N9504 guide's
    PDF p111, the N9516 guide's PDF p107), and its figure puts the switch at the top of the face, above
    the upper receptacle; this skin draws the switch below both, from no figure, so neither part is named
    for a grid. No page gives the receptacles' size or place on the supply. The cords are not drawn.
    `attrs.inlet` (it said other) is gone: the parts name the connector exactly, and a module that
    composes an inlet needs nothing there.
  lifecycle: >-
    unknown - Cisco's support page gives no sale status for this part number.
elements:
  ok:
    at: [4.2, 7.0]
    size: [3.0, 3.0]
    class: led
    description: OK lamp, upper left of the module.
    states:
    - {name: green, color: '#39b54a'}
    - {name: flashing-green, color: '#39b54a', behavior: blinking}
    - 'off'
  fail:
    at: [4.2, 12.5]
    size: [3.0, 3.0]
    class: led
    description: FAIL or FAIL/ID lamp, below the OK lamp.
    states:
    - {name: amber, color: '#f5a623'}
    - {name: flashing-amber, color: '#f5a623', behavior: blinking}
    - 'off'
parts:
  - {ref: std/saf-d-grid@1, id: inlet-1, at: [8.85, 61.85], rotate: 90}
  - {ref: std/saf-d-grid@1, id: inlet-2, at: [8.85, 89.25], rotate: 90}
skins: [default]
