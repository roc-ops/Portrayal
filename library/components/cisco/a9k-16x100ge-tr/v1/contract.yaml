description: >-
  Cisco ASR 9000 Series 16-Port 100 Gigabit Ethernet Packet Transport Line Card, 4th
  generation. Sixteen QSFP28/QSFP+ ports at 100 Gigabit Ethernet, in a single row of
  four groups of four. Superseded by the A9K-20HG-FLEX-TR.
