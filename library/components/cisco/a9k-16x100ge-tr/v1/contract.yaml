provenance:
  relief: >-
    NO RELIEF FEATURE IS DECLARED AND THIS IS THE RECORD OF WHY. What should stand proud of
    this face: the ejector brackets, their levers and the captive screws; and the status
    lamp and the per-port lamps, domed lenses on the real card. Each needs a depth in
    millimetres, and no document in the intake states one for any Cisco part. The searches,
    recorded so this can be overturned rather than repeated: every doc.md in the
    112-document intake for 'protrud', 'extends outward', 'stands proud' and 'clearance in
    front' - the ONLY vendor in the whole intake that publishes a projection is UfiSpace,
    whose S9510-28DC datasheet gives its fan and PSU handle travel, and no Cisco document
    does; the per-card dimension tables, Table A-10 of the older Ethernet Line Card
    Installation Guide and every data sheet's 'Physical dimensions (includes ejector
    bracket/lever)' row, which carry H, W, D and weight only - and where the ejector IS
    included it is included in the card's LONG axis, which this model already draws in 2D,
    not in its depth; and the ASR 9000 Visio stencil, whose 119 masters are FRONT and REAR
    elevations with no side, top or isometric view, so it carries no depth axis to measure
    at all. The figures that DO show this hardware in three dimensions - Figure 48 of the
    Ethernet Line Card Installation Guide, 'Ejector Levers and Captive Screws', and Figure
    1-8 of the ISM guide - are perspective drawings with a vanishing point and no scale, so
    they are authoritative for WHAT IS THERE and for nothing about size. Figure 48 does
    settle the ARRANGEMENT: the bracket stands off the plate, the lever lies along it and
    the captive-screw head is proud of both. A lamp measured off a drawing whose aspect is
    wrong reads two different diameters and neither is the lens, so the drawing cannot
    supply this either. WHAT WOULD CLOSE IT: a Cisco mechanical drawing of a line-card
    faceplate, the lamp's part number, or a photograph of the part with a rule in frame.
    THIS PARAGRAPH IS ONE STATEMENT, WRITTEN ONCE BY THE CISCO RELIEF PASS AND INSERTED INTO
    THE 37 SIBLING CONTRACTS that share this hardware - it is a single search, not 37
    agreeing readings.
  size: >-
    datasheet - Cisco ASR 9000 Series 16-Port 100 Gigabit Ethernet Packet Transport Line
    Card Data Sheet: '16-port 100 Gigabit Ethernet Line Card: 1.63 x 15.58 x 1.63 x
    23.80 in.; 21.73 lb (est.) (41.4 mm x 395.7 mm x 604.5 mm; 9.86 kg)'.
  layout: >-
    drawing - the Cisco Visio master, scaled to the datasheet's own overall dimensions.
    CAUTION for anyone re-deriving this: index.json's props.height_in and width_in are
    the Visio SHAPE box, not the card. They read 1.72 x 14.75 in for EVERY card master,
    against the datasheet's 1.63 x 15.58 in, and are 5 percent out in both axes. The ART
    is orthographic and does carry geometry: taking Cisco's stated W - which the spec
    table says 'includes ejector bracket/lever' - as the full long extent of the art
    puts the faceplate rectangle at 41.6 mm against a stated H of 41.4, inside half a
    percent, which is the gate-1 check. So the drawing is the ruler and the shape box is
    not.
  frame: >-
    the card is modelled PORTRAIT - x across the card's thickness, y along its width -
    which is the stencil's own frame and casa's. WHICH WAY A CHASSIS CARRIES IT is the
    Overview and Reference Guide's 'Chassis Slots' section, quoted because an earlier
    version of this note had it wrong for three chassis out of seven: 'Cisco ASR 9010
    Router: All line cards and RSP cards are front-facing and mounted VERTICALLY, with
    ejector levers and captive screws at the top and bottom of each card. Cisco ASR 9006
    Router and Cisco ASR 9904 Router: All chassis line cards and RSP cards are
    front-facing and mounted HORIZONTALLY, with ejector levers and captive screws at the
    left and right ends of each card. Cisco ASR 9906 Router: ... mounted vertically ...
    Cisco ASR 9910 Router: ... vertically ... Cisco ASR 9922 Router: ... vertically ...
    Cisco ASR 9912 Router: ... vertically.' So only the ASR 9006 and the ASR 9904 lay
    their cards flat and rotate the bay; the other five place this component unrotated.
    The ejector-lever wording is the tell and it is why the guide is worth quoting
    rather than paraphrasing - 'top and bottom' means vertical, 'left and right ends'
    means horizontal, and the RU height of a chassis does not decide it.
  cages: >-
    composed from std/, not drawn. Ganged QSFP pitch measures 18.73 mm off the art
    against the registry's TE-measured 19.0, so Cisco's shared-wall block is about 1.4
    percent tighter; the measured PITCH is carried and the registry's APERTURE is
    carried, which leaves a nominal 0.23 mm wall. Aperture size is a governed dimension
    and a drawing is not the place to take it from.
  leds: >-
    install guide - 'Each line card has a single tristate Status LED to display card
    status. Each ... port on the line card has a port status LED visible on the front
    panel.' The state vocabulary on both is Table 32, 'Port Status and Line Card Status
    LEDs', of the Ethernet Line Card Installation Guide, transcribed rather than
    summarised: the card lamp's amber is TWO states, steady during boot and blinking for
    a software configuration error.
  not-drawn: >-
    one thing on the real faceplate is deliberately NOT modelled: the coloured outlines
    that box each port group. They are real printing - the install guide spells the
    scheme out for the 400G combo card, 'Ports 0-5 (blue), 10-15 (red), 20-25 (magenta),
    30-35 (orange)' - and the stencil draws them per group in solid and dashed strokes.
    They are omitted because the stencil builds them from many short stroked segments
    rather than closed rectangles, and guessing at a box that reads as a group boundary
    would put a line on the drawing that no measurement supports. Port grouping is
    carried structurally instead, by the port ids and by the lamp clusters that sit at
    each group's end.
  ports: >-
    install guide - '16-Port 100-Gigabit Ethernet Line Card with QSFP28/QSFP+ ...
    provides sixteen ports for QSFP28/QSFP+ modules that operate at a rate of 100 Gbps',
    Figure 16 callout 3.
  power: >-
    install guide - Table 35, row '16-port 100-Gigabit Ethernet Line Card (-TR or -CM)':
    675 W at 27 C, 700 W at 40 C, 750 W at 50 C. max is the highest rated ambient. No
    typical is stated.
  lifecycle: >-
    bulletin EOL15321, 'End-of-Sale and End-of-Life Announcement for the Cisco ASR 9000
    Series 4th Generation Ethernet Line Card Family', updated 15 March 2024. Table 2
    lists this part number as affected. Last order 15 June 2024; last date of hardware
    support 15 June 2029.
