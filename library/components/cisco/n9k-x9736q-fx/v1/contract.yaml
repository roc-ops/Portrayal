format: 1
kind: module
name: n9k-x9736q-fx
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9500 36-port 40-Gigabit Ethernet line card (N9K-X9736Q-FX), which the guides call a QSFP28 card.
  Thirty-six QSFP28 cages in two rows of eighteen, run at 40 Gigabit Ethernet, a Beacon and a Status lamp at
  the left and one Link triangle per port between the rows, with an ejector lever at each end. The Nexus 9504,
  9508 and 9516 take it, and it is one of the three cards that work in fabric slot FM 5.
size: {w: 431.8, h: 44.45, d: 419.1}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
attrs:
  model: 'N9K-X9736Q-FX'
  role: 'line-card'
  qsfp: 36
  media: 'QSFP28 cage, 40 Gigabit Ethernet'
  weight-kg: 6.62
  power-draw-typical-w: 571
  power-draw-max-w: 684
  chassis: 'Nexus 9504, Nexus 9508, Nexus 9516'
  hot-swappable: true
  eol: 'unknown'
provenance:
  size: >-
    datasheet - Cisco N9508 NX-OS Mode Switch Hardware Installation Guide, Appendix A "Switch Dimensions"
    (PDF p120, printed 114), "Line cards": 17.0 in (43.18 cm) wide by 1.75 in (4.4 cm) high; the 9504 guide
    (PDF p120, printed 114) and the 9516 guide (PDF p116, printed 110) print the same row. It is the class row
    for every line card, not a row of this card.
  depth: >-
    datasheet - the same row: 16.5 in (41.91 cm) inside the chassis, ejector levers 2.5 in (6.35 cm) outside
    it. The depth is the inside figure, as the supervisor's is; the levers swing out and are not added.
  weight: >-
    datasheet - Cisco N9504 NX-OS Mode Switch Hardware Installation Guide, "Weights and Quantities" (PDF p121,
    printed 115): 14.6 lb (6.62 kg); the 9516 guide's weights table (PDF p117, printed 111) prints the same.
    The 9508 guide's weights section has no table.
  power: >-
    datasheet - the "Planning for Power Requirements" tables (9504 guide, PDF pp18-19, printed 12-13; 9508
    guide, PDF p18, printed 12; 9516 guide, PDF pp18 and 20, printed 12 and 14): typical 571 W, maximum 684 W,
    the same in all three guides. The pair is read by line order from the card's own row, not the fabric-module
    heading row's figures above it.
  ports: >-
    install guide - the Overview tables and the power and weight tables call it a "36-port 40-Gigabit Ethernet
    QSFP28 line card"; the 9504 guide's Overview calls the cage nothing, and the other 40G cards in the same
    tables are "QSFP+". The cage is the library's QSFP28 cage, which also takes a 40G optic, and the card states
    its 40G rate as `qsfp`. TEXT ONLY: no held figure shows this card's faceplate, so the count and cage are the
    guide's words and every position is estimated - two rows of eighteen, laid out evenly between the lamps and
    the right-hand lever on a 21 mm pitch, odd ports over even in each column. The guide's figure of a 36-port
    card (9504 guide PDF p93, printed 87) names no model and is not taken as this card's. The numbering as
    printed on the metal is not shown; Ethernet1/n interface names are not drawn.
  lamps: >-
    install guide - "Line Card LEDs" (9504 and 9508 guides PDF p136, printed 130; 9516 guide PDF p132,
    printed 126): the Beacon (BCN) and Status (STS) lamps are "on the front, toward the left side of the
    module"; the Link lamp of each port is "between the two rows of ports", a triangle pointing to the port
    above or below it. BCN: flashing blue, or off. STS: green, flashing red, flashing amber, or off. Link:
    green, orange, flashing orange, or off. The lamps are drawn beside what they name; positions estimated.
  skin: >-
    estimated - the card's own faceplate is not shown, so the skin does not show this card. The levers follow
    the install procedure ("Installing or Replacing a Line Card", 9504 guide PDF pp91-92, printed 85-86): a
    release button on each ejector lever, which is pressed before the lever is rotated away. A figure of an
    unnamed 36-port card (9504 guide PDF p93, printed 87) shows two rows with the lamps at the left, a
    ventilation strip over each row and the levers at each end, and is used for that arrangement only. The
    maker's mark is reserved as the logo-zone and not drawn.
  chassis-compatibility: >-
    install guide - the Overview tables of the 9504 (PDF pp8-9, printed 2-3; under the -E modules), 9508 (PDF
    pp8-9, printed 2-3; under the -E and -E2) and 9516 (PDF p8, printed 2; under the -E and -E2) guides list
    it, five fabric modules for maximum bandwidth; FM 5 (slot 25) works only with this card, the N9K-X9736C-FX
    and the N9K-X9736C-FX3 (9504 and 9516 guides, PDF p9, printed 3). That is why the slot bays of all three
    chassis accept it; geometry is not a compatibility source. The fabric modules the guides pair with it are
    listed in the chassis and are not enforced.
  lifecycle: >-
    unknown - Cisco's support page gives no sale status for this part number, and no end-of-sale notice is held.
elements:
  bcn:
    at: [12.5, 12.0]
    size: [3.0, 3.0]
    class: led
    description: BCN lamp, at the left of the face.
    states:
    - {name: blue, color: '#2a7de1', behavior: blinking}
    - 'off'
  sts:
    at: [12.5, 25.0]
    size: [3.0, 3.0]
    class: led
    description: STS lamp, at the left of the face.
    states:
    - {name: green, color: '#39b54a'}
    - {name: red, color: '#d0021b', behavior: blinking}
    - {name: amber, color: '#f5a623', behavior: blinking}
    - 'off'
  logo-zone:
    at: [413.5, 18.0]
    size: [8.0, 8.0]
    class: mechanical
    description: The maker's mark, reserved and not drawn.
