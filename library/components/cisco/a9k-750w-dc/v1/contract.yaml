format: 1
kind: module
name: a9k-750w-dc
version: 1.0.2
class: psu
behaviour: fills
profile: networking
description: >-
  Cisco ASR 9001 and ASR 9001-S DC power entry module, 750 W. Same shell as the AC unit,
  with a two-pole -48 VDC terminal block and its '+  -' legend where the AC unit carries
  its appliance inlet, and the vent field moved to the right of the handle.
size: {w: 55.2, h: 39.9}
attrs:
  inlet: dc-terminal
  model: 'A9K-750W-DC'
  input: 'dc'
  power-output-w: 750
  eol: 'none-announced'
provenance:
  inlet: >-
    transcribed from this contract's own description, which reads 'a two-pole -48 VDC
    terminal block and its "+  -" legend where the AC unit carries its appliance inlet'. The
    token records a fact the model already held in prose; nothing new was measured.
  relief: >-
    RELIEF IS DECLARED, AND WHAT MATTERS ABOUT IT IS THAT IT IS A HANDFUL OF NUMBERS AND NOT
    A HANDFUL PER PART. This face carries: 2 panel lamps at dome 0.3 (one number, carried by
    120 Cisco contracts); 1 vent fields at vent 26 (one number, carried by 9 Cisco
    contracts); 1 pull handles at uhandle 8.0 (one number, carried by 10 Cisco contracts).
    EVERY MAGNITUDE BELOW IS ESTIMATED, AND THAT IS A DELIBERATE READING OF WHAT RELIEF IS
    FOR. The owner's ruling: 'the whole 3d part is kind of interpolated anyway... It's just
    to give it a realistic view instead of just being a flat 2d... All of the 3d stuff is
    going to be mostly conjecture unless the vendor provides that data.' So a proudness here
    is an interpolation for a realistic view, NOT a claim about the hardware, and the
    confidence token on every feature says so rather than leaving it to be inferred. WHY
    `estimated` AND NOT `borrowed`, SINCE EVERY NUMBER HERE DOES COME FROM ANOTHER PORTRAYAL
    PART. `borrowed` is defined as another part's MEASURED figure reused for the same class
    of hardware, and these origins are not measured - they are the library's first guess at
    that hardware, and the contracts say so themselves: agr-panel-screw's provenance reads
    'estimated - it stands proud but was not measured', agr-psu-dc sources its latch's
    ARRANGEMENT from a photograph and never its proudness, agr-fan describes its handle and
    grille by appearance only, and common/led-dot's entire provenance is 'size: estimated'.
    Spelling that chain `borrowed` would convert a guess into an apparent measurement at one
    remove, a thousand times over. `source` still names the origin, so the coordinating
    benefit is kept and only the claim that is not true is dropped. READ THE COUNTS ABOVE AS
    THEY ARE MEANT: a figure carried by sixty-odd contracts is ONE ESTIMATE WRITTEN
    SIXTY-ODD TIMES, not sixty-odd readings that happened to agree. One caliper on any one
    Cisco captive screw, any one ejector lever or any one panel lamp corrects every part in
    the library that shares it, which is the whole reason the numbers are pooled instead of
    chosen per card. THE SEARCH FOR A REAL FIGURE WAS RUN FIRST AND IS RECORDED SO IT IS NOT
    REPEATED: all 112 doc.md extracts for 'protrud', 'extends outward', 'stands proud' and
    'clearance in front' - the only vendor in the intake that publishes a projection is
    UfiSpace, on the S9510-28DC; the per-card dimension tables, including Table A-10 of the
    older Ethernet Line Card Installation Guide which the current revision dropped, all of
    which carry H, W, D and weight only; and the ASR 9000 Visio stencil, whose 119 masters
    are FRONT and REAR elevations with no side, top or isometric view, so it holds no depth
    axis at all and is closed as a source. Figure 48 of the Ethernet Line Card Installation
    Guide and Figure 1-8 of the ISM guide DO show this hardware in three dimensions and are
    perspective drawings with a vanishing point, so they settle the ARRANGEMENT - bracket
    off the plate, lever along it, domed screw head proud of both - and nothing about size.
    STILL REFUSED ON THIS FACE, and these are NOT the same kind of gap: terminal-block -
    each would need an EIGHTH family number for one or two nodes, which buys a little
    realism at the cost of another invented figure; left flat deliberately. The ruling
    sanctions interpolating a PROUDNESS for a realistic view. It does not sanction inventing
    an APERTURE, which is a dimension a specification is withholding rather than one nobody
    has measured.
  size: >-
    drawing - the stencil masters A9K-750W-AC and A9K-750W-DC, at the stencil's 1:10
    inches. For THESE masters the shape box is usable, and the check is what says so:
    the box aspect is 1.3834 and the art's own is 1.3791, agreeing to 0.3 percent, where
    the line-card masters' box and art disagree by five percent and the box had to be
    thrown away. So 55.2 x 39.9 mm is Cisco's own figure for this module. NEITHER the
    ASR 9001 nor the ASR 9001-S data sheet gives a power supply dimension - both give
    the chassis at 88.2 x 442 x 470 mm and stop - so this is stencil-derived. It is
    consistent with the chassis: two of these stacked is 79.8 mm inside an 88.2 mm 2RU
    box.
  face: >-
    drawing - measured off the master. Both variants share one shell: a punched vent
    field of vertical slots, a pull handle, and FAIL and OK lamps. What differs is the
    input, which is why these are two components and not two skins of one - a skin
    cannot compose a part, and the AC unit's inlet is a real standard part.
  power: >-
    part number - the module IS its rating. The ASR 9001-S data sheet's 'Power supply
    part number' row gives 'A9K-750W-AC' and 'A9K-750W-DC', and its ordering table names
    them 'AC Power Entry module' and 'DC Power Entry module'. 750 W is the continuous
    output the part number states, and power-output-w is the supply side of the meter,
    not a draw. No document in the intake gives these modules an efficiency, an input
    current or a hold-up time.
  lamps: >-
    drawing - two lamps, printed FAIL and OK, read off the master at high zoom. NO
    colour table for them exists in the intake: the Overview and Reference Guide's
    indicator tables cover the RSP, RP and FC cards and the fan tray, and neither fixed-
    port guide gives a power supply LED table. So the states here are the two the
    LEGENDS name and nothing more - `on` and `off` per lamp, with no colour asserted.
    That is the honest shape of what is known; a green/amber/red vocabulary borrowed
    from another card would look identical and be invented.
  lifecycle: >-
    searched - no end-of-life notice for either part number is in the intake.
  terminal-block: >-
    drawing - a two-pole terminal block with a captive screw at each end, printed '+  -'
    above it, measured off the master at 33.64 x 14.87 mm. It is drawn here rather than
    composed because no std/ part and no standards.yaml key exists for a DC terminal
    block, and no document in the intake dimensions this one - so there is nothing to
    conform to yet. It is deliberately NOT declared `class: cutout`: a terminal block is
    hardware bolted to the face, not a hole punched in it, and claiming a cutout would
    put a false entry in the aperture census that L26 keeps.
elements:
  fail:
    at: [45.3, 2.3]
    size: [2.6, 2.6]
    class: led
    description: >-
      the lamp printed FAIL. No document in the intake gives this module's
      lamp colours, so the states are the legend and nothing more.
    states: ['off', 'on']
  ok:
    at: [45.3, 7.3]
    size: [2.6, 2.6]
    class: led
    description: >-
      the lamp printed OK. Same footing as `fail`: legend only, no sourced
      colour vocabulary.
    states: ['off', 'on']
  handle:
    at: [38.1, 4.2]
    size: [5.0, 31.0]
    class: handle
relief:
  wall: '#4a4f55'
  features:
    - node: vent-field
      vent: 26
      confidence: estimated
      source: >-
        edgecore/agr-fan@1 grille - the library's one vent-cavity figure, described in that
        contract by appearance and not by depth
    - node: handle
      uhandle: 8.0
      confidence: estimated
      source: >-
        edgecore/agr-fan@1 handle - the library's one pull-handle figure. Its provenance
        describes the handle's appearance from a photograph, not its proudness
    - node: fail
      dome: 0.3
      confidence: estimated
      source: >-
        common/led-dot@1 - the library's one panel-lamp figure. Its own provenance is 'size:
        estimated' and the dome carries none
    - node: ok
      dome: 0.3
      confidence: estimated
      source: >-
        common/led-dot@1 - the library's one panel-lamp figure. Its own provenance is 'size:
        estimated' and the dome carries none
skins: [default]
