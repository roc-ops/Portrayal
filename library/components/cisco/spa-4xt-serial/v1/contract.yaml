format: 1
kind: module
name: spa-4xt-serial
version: 1.0.0
class: line-card
profile: networking
description: >-
  Cisco 4-Port Serial Interface SPA, a single-height shared port adapter for the ASR 9000
  SIP-700. 'The 4-Port Serial Interface SPA uses Smart Serial cable interfaces that support
  one of two serial interface ports: DTE or DCE.' Table 42 lists ten cables, CAB-
  SS-V35MT/FC, -232MT/FC, -449MT/FC, -X21MT/FC, -530MT and the rest. 'The 4-Port Serial
  Interface SPA supports six interfaces in DCE and DTE mode: V.35, EIA/TIA-232, EIA/TIA-449,
  EIA/TIA-530, EIA/TIA-530A, X.21.' 'Each port allows a maximum bandwidth of 8064 Kbps
  except for the X.21 and EIA/TIA-232 interfaces.' Seats in a SIP-700 SPA subslot; it is a
  module, not a device.
size: {w: 17.29, h: 167.87}
attrs:
  model: 'SPA-4XT-Serial'
  role: 'shared-port-adapter'
  form-factor: 'single-width, single-height (one SIP-700 subslot)'
  ports: 4
  media: 'Smart Serial, V.35 / EIA-TIA-232 / -449 / -530 / -530A / X.21, DTE or DCE'
  min-ios-xr: '6.4.1'
  min-hardware-revision: '2.0'
  eol: 'none-announced'
provenance:
  relief: >-
    NO RELIEF FEATURE IS DECLARED AND THIS IS THE RECORD OF WHY. What should stand proud of
    this face: the status lamp and the per-port lamps, domed lenses on the real card. Each
    needs a depth in millimetres, and no document in the intake states one for any Cisco
    part. The searches, recorded so this can be overturned rather than repeated: every
    doc.md in the 112-document intake for 'protrud', 'extends outward', 'stands proud' and
    'clearance in front' - the ONLY vendor in the whole intake that publishes a projection
    is UfiSpace, whose S9510-28DC datasheet gives its fan and PSU handle travel, and no
    Cisco document does; the per-card dimension tables, Table A-10 of the older Ethernet
    Line Card Installation Guide and every data sheet's 'Physical dimensions (includes
    ejector bracket/lever)' row, which carry H, W, D and weight only - and where the ejector
    IS included it is included in the card's LONG axis, which this model already draws in
    2D, not in its depth; and the ASR 9000 Visio stencil, whose 119 masters are FRONT and
    REAR elevations with no side, top or isometric view, so it carries no depth axis to
    measure at all. The figures that DO show this hardware in three dimensions - Figure 48
    of the Ethernet Line Card Installation Guide, 'Ejector Levers and Captive Screws', and
    Figure 1-8 of the ISM guide - are perspective drawings with a vanishing point and no
    scale, so they are authoritative for WHAT IS THERE and for nothing about size. A lamp
    measured off a drawing whose aspect is wrong reads two different diameters and neither
    is the lens, so the drawing cannot supply this either. WHAT WOULD CLOSE IT: the lamp's
    part number, or a photograph of the part with a rule in frame. THIS PARAGRAPH IS ONE
    STATEMENT, WRITTEN ONCE BY THE CISCO RELIEF PASS AND INSERTED INTO THE 51 SIBLING
    CONTRACTS that share this hardware - it is a single search, not 51 agreeing readings.
  size: >-
    NO CISCO DOCUMENT IN THIS INTAKE STATES ANY SPA DIMENSION. THIS SENTENCE IS THE SAME
    SENTENCE ON ALL 24 SPA COMPONENTS: it is ONE derivation, not 24 measurements, and the
    next reader should count it once. Searches run before writing it: 'Physical dimensions',
    'Physical specifications', 'dimension', 'weight', 'inches' and 'mm' across all 104 PDFs
    of the intake rendered to text, plus the SIP and SPA Hardware Installation Guide read
    end to end. What the guide has is Table 6, 'Cisco ASR 9000 SIP-700 Physical
    Specifications', whose 'Physical dimensions' row reads 'Occupies one line card slot on a
    Cisco ASR 9000 Series Aggregation Services Router' - a heading that promises coverage
    its row does not have. The SPA data sheet, data_sheet_c78-688005 'Cisco ASR 9000 Series
    Shared Port Adapter Support', is an ordering list: it points at a URL for specifications
    and gives none. WHAT THE NUMBER IS: the SIP-700's own subslot band, measured off Cisco's
    stencil master by whoever built library/components/cisco/a9k-sip-700 and recorded there
    as bays 17.29 x 167.87 mm. That is the OPENING this SPA seats in, and this library's
    convention (the note bay-size-vs-component-size.md under working/notes) is that a bay
    and its occupant carry the same envelope, so the occupant takes the band. THE HALVING IS
    A JUDGEMENT AND NOT MINE: the SIP-700's own provenance.bay-split says the divider
    between the left and right subslots is not drawn on the master and the middle was
    assumed. AND THE FIGURE DOES NOT AGREE WITH IT ALONG THE LONG AXIS. Scale each faceplate
    figure so its drawn plate is 167.87 mm and two independent standard apertures come out
    oversized: the SFP bezel opening reads 16.5 mm against SFF-8432's 14.5, and the ganged
    RJ-45 pitch on the 8-port T1/E1 SPA reads 17.9 mm against this library's measured 13.99.
    Scale the same figures by those apertures instead and the plate is 131 to 148 mm long -
    but the ACROSS axis then reads 16.3 to 16.9 mm against the band's 17.29, agreeing to 3
    per cent. So the two axes disagree about which reading is right, and nothing in the
    intake settles it. The likeliest reconciliation is that the 167.87 band includes the
    SPA's end brackets and captive jackscrews, which every faceplate figure draws OUTSIDE
    the plate body, and the plate itself is nearer 145 mm - but that is a reading, not a
    measurement, and the number carried here is the band.
  form-factor: >-
    install guide - THIS PARAGRAPH IS SHARED BY ALL 24 SPA COMPONENTS. The guide uses TWO
    AXIS VOCABULARIES for one form factor and never reconciles them. The SIP-700 chapter
    says width for the axis across the card and height for the axis along it - 'The Cisco
    ASR 9000 SIP-700 supports a maximum of 2 single-width, double-height SPAs, 4 single-
    width, single-height SPAs, 2 double-width, single-height SPAs' - and Figure 2's caption,
    'the Cisco ASR 9000 SIP-700 faceplate with 2 double-width, single-height SPAs', is drawn
    as two panels each spanning the full 34.58 mm across the card. Table 7 uses the opposite
    naming for the same shape: 'Double height single width SPA in Subslot 0, Bay 3', against
    a figure in which that SPA is the one spanning both levels across the card. Table 10,
    the supported-SPA list, is in TABLE 7's vocabulary - it calls SPA-2XCHOC12/DS0 double-
    height, and Figure 6 draws that part's plate at twice the thickness and the same length
    as a single. So: `double-height` in Table 10 and `double-width` in the SIP-700 prose are
    the SAME PHYSICAL THING, a plate about 34.58 mm across and the same length as a single,
    filling two subslots SIDE BY SIDE. The attrs key here is written in the SIP-700
    chapter's vocabulary, because that is the chapter the seating geometry comes from, and
    the drawing is what settles the shape. FOR THIS PART the sources agree on single-height:
    Table 10's row reads 'single-height' and the faceplate figure draws a single-height
    plate.
  ports: >-
    install guide - Table 10: '4-Port Serial SPA ... 4 serial ... single-height', minimum
    IOS XR 6.4.1 and minimum hardware revision 2.0 - the only SPA in the table needing
    revision 2.0 from the outset. The March 2018 change log records it as the guide's last
    addition.. 'The 4-Port Serial Interface SPA uses Smart Serial cable interfaces that
    support one of two serial interface ports: DTE or DCE.' Table 42 lists ten cables, CAB-
    SS-V35MT/FC, -232MT/FC, -449MT/FC, -X21MT/FC, -530MT and the rest. 'The 4-Port Serial
    Interface SPA supports six interfaces in DCE and DTE mode: V.35, EIA/TIA-232,
    EIA/TIA-449, EIA/TIA-530, EIA/TIA-530A, X.21.' 'Each port allows a maximum bandwidth of
    8064 Kbps except for the X.21 and EIA/TIA-232 interfaces.'
  leds: >-
    install guide - Table 41 in this guide describes the STATUS LED ONLY, at length - the
    three conditions that must be met before it goes green are spelled out. The per-port
    lamps are printed on the faceplate as ACTIVE and CD/LP and Figure 54's callouts name two
    of them, but NO TABLE IN THIS GUIDE GIVES THEIR COLOURS OR MEANINGS. They are drawn with
    the family's green/amber/off vocabulary and that vocabulary is BORROWED, not sourced -
    see provenance.leds. Lamp positions are fractions of the drawn plate (see
    provenance.figure); lamp SIZE is the figure's own 6 x 4 px at that scale and is not a
    Cisco dimension. The state vocabularies are transcribed from this part's own LED table,
    named in each element's description, and NOT from a sibling's - the SPA sections in this
    guide word the same lamp differently often enough that borrowing one would be a false
    citation.
  figure: >-
    install guide - Figure 54, '4-Port Serial Interface SPA Faceplate'. THIS SENTENCE IS
    SHARED BY ALL 24 SPA COMPONENTS and describes the drawings as a class. The faceplate
    figures are RASTERS embedded in the PDF at about 570 px across, which is roughly 2.7
    px/mm at the plate scale used here, so no position below is better than about +/- 0.4 mm
    and none of them is stated more precisely than the millimetre. GATE 1, on the axis it
    can be run on: the drawn plate's thickness-to-length ratio is 0.107 against the 0.103
    the SIP-700's subslot band implies, agreeing to 4 per cent, and a single-height plate
    and a double-height plate differ by the factor of two the guide's vocabulary requires -
    so the figures are orthographic and their FRACTIONS carry geometry. They do not carry
    absolute scale: see provenance.size. Every position on this component is therefore a
    fraction of the drawn plate mapped onto the band, and every standard aperture is placed
    at its measured CENTRE at the size the registry gives it rather than at the size the
    figure draws it.
  power: >-
    NOT STATED. No document in this intake gives a power figure for any SPA: not the SIP and
    SPA Hardware Installation Guide, which has no power table at all; not
    data_sheet_c78-688005, the SPA data sheet, which is an ordering list; and not Table 35
    of the Ethernet Line Card Installation Guide, whose rows are line cards and carriers. So
    no power-draw key is written and lint L27 stands - that warning is the record. AND THE
    SCOPE QUESTION IS OPEN AT THE OTHER END TOO: the SIP-700 states 375 W maximum without
    saying whether the measurement was taken with SPAs seated or bare, so a budget cannot be
    closed from this end either. See a9k-sip-700's provenance.power.
  lifecycle: >-
    searched - no end-of-life notice for SPA-4XT-Serial is in this intake. Table 10 gives
    this part a minimum IOS XR release of 6.4.1 and a minimum hardware revision of 2.0,
    which is a support floor and not a lifecycle statement.
