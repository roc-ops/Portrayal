format: 1
kind: module
name: a9k-8x100g-lb-se
version: 1.0.0
class: line-card
profile: networking
description: >-
  Cisco ASR 9000 Series 8-Port 100 Gigabit Ethernet Line Card with CPAK. 8 CPAK cages
  down the faceplate, numbered 0 to 7, with a single card Status lamp. Cisco: 'Based on
  Cisco CPAK technology, this line card has flexible interfaces that support 100 Gigabit
  Ethernet, 40 Gigabit Ethernet and 10 Gigabit Ethernet modes, so it gives customers the
  flexibility to mix and match interface types on the same line card.' The LAN-only
  variant of the 8-port; the OTN variant is cisco/a9k-8x100ge-se.
size: {w: 41.4, h: 395.7, d: 559.3}
attrs:
  model: 'A9K-8X100G-LB-SE'
  role: 'line-card'
  cpak: 8
  media: 'CPAK, 100/40/10 Gigabit Ethernet'
  weight-kg: 12.7
  operating-temp: '5 to 40 C'
  chassis: 'ASR 9006, ASR 9010, ASR 9904, ASR 9912, ASR 9922'
  power-draw-max-w: 1150
  eol: 'none-announced'
provenance:
  size: >-
    datasheet - Cisco ASR 9000 Series 4-Port and 8-Port 100 Gigabit Ethernet Line Cards
    Data Sheet (c78-733790), 'Physical dimensions (H x W x D); weight': '8-port 100
    Gigabit Ethernet Line Card: 14.5 x 1.63 x 22.02 in.; 28 lb (est.) (368.3 mm x 41.4
    mm x 559.3 mm; 12.7 kg)'. H is the LONG dimension in this sheet's axis order and
    368.3 is the PLATE; the card is modelled at the family's ejector-inclusive 395.7,
    the same step and the same reasoning as every other 4th-generation card here, and
    Cisco's own sheets give both figures for cards of this family - 368.3 unqualified
    and 15.58 in = 395.7 where they say '(includes ejector bracket/lever)'. Depth 559.3
    is the sheet's.
  shell: >-
    drawing - the plate, ejector blocks, captive screws and Status lamp are measured off
    this master and scaled to the datasheet's own dimensions on both axes. NOTE THE ART
    BOX IS NOT A SIZE: this master is drawn on the 46.55 x 413.95 template that the
    ORIGINAL generation uses, and the datasheet says 41.4 mm, which is the 4th
    generation's thickness and not that template's 43.7. The A9K-MOD200 is the standing
    proof that a template does not settle a thickness - it sits on the 4th generation's
    template and is an original-generation 43.7 mm card - so the datasheet is the
    authority here and the template is only a fact about which drawing Cisco copied.
  aperture: >-
    DRAWN, NOT COMPOSED, AND DECLARED `class: cutout` ANYWAY - which takes an L26
    warning, and the warning is the point. CPAK IS CISCO-PROPRIETARY AND HAS NO MSA AT
    ALL. There is no multi-source agreement, no public mechanical specification and no
    bezel-opening figure anywhere in the 78-document intake. The cages here are
    transcribed from the master at 13.92 x 37.01 mm and conform to nothing, because
    there is nothing to conform to. The earlier instinct on cards like this was to
    withhold `class: cutout` so the aperture census stayed clean; that is backwards.
    L26's own message ends 'if the dimension cannot be sourced yet, this warning is the
    record of that'. A census kept tidy by not declaring a cutout has been routed
    around, not satisfied. WHAT WOULD CLOSE THIS, stated so a contributor is not sent on
    an errand that cannot be run: CFP MSA membership and the baseline drawing it gives
    access to, or a Cisco mechanical drawing of this faceplate. NOT 'look harder' - this
    is not a search that failed, it is a specification that withholds the figure.
    Contrast the XFP on the 4-port and 2-port 10GE MPAs in this library, where INF-8077i
    gives the bezel opening outright in two figures and the only thing missing had been
    anyone looking outside the vendor's own guide.
  ports: >-
    drawing - the master draws 8 cages at x 18.10 on a pitch that alternates 42.25 and
    44.93 mm, and NUMBERS EVERY ONE ITSELF as text at x 34.21. The numerals are read,
    not inferred: '0' at y 41.04 through '7' at 346.14, each beside its own cage.
  chassis: >-
    datasheet - c78-733790: 'Both the ASR 9000 Series 4-port and 8-port 100 Gigabit
    Ethernet line cards are fully compatible with Cisco ASR 9006 Router, ASR 9010
    Router, ASR 9904 Router, ASR 9912 Router, and ASR 9922 Router. However, their
    chassis may require a hardware update for the cooling and power systems, because the
    line cards offer industry-leading, high-density 100 Gigabit Ethernet throughput.'
    Five chassis, and the caveat is Cisco's own and worth carrying - it is the only
    place in this family where a compatibility statement comes with a condition
    attached.
  lifecycle: >-
    searched - no end-of-life notice for this part number is in the intake.
  power: >-
    install guide - Table 35, row '8-Port 100-Gigabit Ethernet Line Card (LAN version)':
    1050 W at 27 C, 1100 at 40 and 1150 at 50. max is the highest rated ambient. The
    join is Cisco's own words rather than elimination: c78-734909 is titled 'Cisco ASR
    9000 8-port 100GE "LAN-only" Service Edge Optimized Line Card' and its ordering
    table gives A9K-8X100G-LB-SE for exactly that.
  part-number: >-
    THREE SPELLINGS OF THIS PART EXIST AND THEY DISAGREE. The stencil master is filed as
    'a9k-8x100ge-lb-se'. The FACEPLATE in that master prints 'A9K-8X100GE-L-SE'. And
    Cisco ORDERS it as 'A9K-8X100G-LB-SE' - that is the string in c78-734909's ordering
    table, and the line card family sheet c78-737841 lists it the same way as
    'A9K-8X100G-LB (-SE, -TR)'. The component is named for the ORDERABLE part number,
    because that is the one a purchase order, an inventory and a `show diag` will carry.
    The faceplate legend is a fact about the DRAWING and is recorded here rather than
    reproduced as the model, the same way the A99-32X100GE-X masters' misprinted port 32
    was recorded and not drawn.
  identity: >-
    'LB' is LAN/Backbone and this card is the LAN-only one: c78-734909's title says so
    in quotation marks. Its OTN counterpart is A9K-8X100GE-SE, a different part number
    on the same faceplate drawing, and the two are separated in Table 35 by rows
    explicitly headed '(LAN version)' and '(OTN version)'.
