format: 1
kind: module
name: n9k-psu-blank
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9500 power-supply slot blank (the guide's "power supply slot blank" or "blank filler
  plate"). A plain plate on the power-supply envelope that covers a power-supply slot holding no supply, to
  keep the designed airflow. Held by one captive screw. The guide prints no part number for it.
size: {w: 44.45, h: 133.35, d: 25.0}
size-confidence: {w: estimated, h: estimated, d: estimated}
attrs:
  model: 'Nexus 9500 power supply slot blank'
  role: 'airflow-blank'
  eol: 'unknown'
provenance:
  size: >-
    estimated - the guide gives dimensions for the power supply (1.75 in by 5.25 in as it stands in the
    chassis) and none for its blank, which fills a power-supply slot and takes that envelope.
  depth: >-
    estimated - 25 mm, a plate and its flange; the guide gives no depth.
  purpose: >-
    install guide - "Starting Up the Switch": "Cover each open slot with a power supply slot blank to
    preserve the designed airflow"; "Installing or Replacing a 3-kW AC Power Supply": "remove the blank
    filler plate that is already in that slot. Unscrew its captive screws and pull it out of the slot";
    "Installing or Replacing a 3-kW DC Power Supply": "cover the empty power supply slot with a blank
    module". No part number is printed, so none is stated.
  skin: >-
    estimated - a plain plate with one captive screw; no figure draws the blank.
  lifecycle: >-
    unknown - no part number, so no sale status.
skins: [default]
