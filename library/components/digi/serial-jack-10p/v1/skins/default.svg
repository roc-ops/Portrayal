<svg xmlns="http://www.w3.org/2000/svg" width="16mm" height="16.2mm" viewBox="0 0 16 16.2">
  <!-- One cell of a four-jack block: the housing, solid, with a ten-position opening punched
       through it in three tiers (body 14.1 x 6.83, shoulder 6.30 x 1.69, slot 4.06 wide to the
       cell's lower edge). The opening is an estimate; see provenance.cavity. -->
  <path id="housing" fill-rule="evenodd" fill="#b0b5bb" data-fill-from="finish" stroke="#1c1f23" stroke-width="0.12" d="
    M 0.2 0 h 15.6 a 0.2 0.2 0 0 1 0.2 0.2 v 15.8 a 0.2 0.2 0 0 1 -0.2 0.2 h -15.6 a 0.2 0.2 0 0 1 -0.2 -0.2 v -15.8 a 0.2 0.2 0 0 1 0.2 -0.2 z
    M 0.95 0.9 h 14.1 v 6.83 h -3.9 v 1.69 h -1.12 v 6.78 h -4.06 v -6.78 h -1.12 v -1.69 h -3.9 z"/>
  <path id="cavity" fill="#0a0c0e" d="
    M 0.95 0.9 h 14.1 v 6.83 h -3.9 v 1.69 h -1.12 v 6.78 h -4.06 v -6.78 h -1.12 v -1.69 h -3.9 z"/>
  <path id="opening" fill="none" d="M 0.95 0.9 h 14.1 v 15.3 h -14.1 z"/>
  <g id="pins" fill="#a8873c">
    <rect x="3.41" y="1.5" width="0.46" height="2.0"/>
    <rect x="4.43" y="1.5" width="0.46" height="2.0"/>
    <rect x="5.45" y="1.5" width="0.46" height="2.0"/>
    <rect x="6.47" y="1.5" width="0.46" height="2.0"/>
    <rect x="7.49" y="1.5" width="0.46" height="2.0"/>
    <rect x="8.51" y="1.5" width="0.46" height="2.0"/>
    <rect x="9.53" y="1.5" width="0.46" height="2.0"/>
    <rect x="10.55" y="1.5" width="0.46" height="2.0"/>
    <rect x="11.57" y="1.5" width="0.46" height="2.0"/>
    <rect x="12.59" y="1.5" width="0.46" height="2.0"/>
  </g>
  <rect id="led-a" x="1.6" y="13.3" width="2.0" height="1.1" rx="0.2" fill="var(--led-color, #3a3f44)"/>
  <rect id="led-b" x="12.4" y="13.3" width="2.0" height="1.1" rx="0.2" fill="var(--led-color, #3a3f44)"/>
</svg>
