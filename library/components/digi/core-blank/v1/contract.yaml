format: 1
kind: module
name: core-blank
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  The plain black cover over the empty CORE module socket of a Digi Connect EZ 16 or 32 - a
  plate 136.5 x 22.8. No photograph held shows the cover itself; it is drawn as the module's
  plate with no connectors.
size: {w: 133.2, h: 22.8}
size-confidence: {w: drawing, h: drawing}
attrs:
  role: slot-blank
provenance:
  size: >-
    drawing - the Connect EZ 16 dimension model ("footprint" STEP file, EZ16-A000): the plate
    in the lower part of the rear face is 136.5 wide, 22.8 high and 1.0 thick; it overlaps the
    first power supply's box by 3.3 mm, so it is cut to 133.2 here.
  face: >-
    estimated - the only rear photograph held shows the socket filled by the CORE module, and
    Digi's page says the SMA jacks exist only "when used with" it, so a socket without the
    module has a cover that no document shows. It is drawn as the module's plate without the
    jacks, legend and thumbscrews, and a photograph of an empty socket would replace it.
elements:
  plate: {at: [0.0, 0.0], size: [133.2, 22.8], class: body}
body:
  depth: 1.0
  color: '#1b1d20'
skins: [default]
