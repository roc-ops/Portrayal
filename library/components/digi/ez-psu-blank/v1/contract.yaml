format: 1
kind: module
name: ez-psu-blank
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  The blank cover that fills the second power-supply bay of a single-supply Digi Connect EZ 16
  or 32. A plain black plate 95 x 41.5 with a screw and a "PSU2" legend at its outer end.
size: {w: 95.0, h: 41.5}
size-confidence: {w: drawing, h: drawing}
attrs:
  role: slot-blank
provenance:
  size: >-
    drawing - the Connect EZ 16 dimension model ("footprint" STEP file, EZ16-A000): a plate 95.0
    wide and 41.5 high, 1.0 thick, in the bay of the second supply.
  face: >-
    photo-measured - the Connect EZ 16/32 rear photograph shows the bay of the second supply
    covered by a plain black plate with a small screw and a printed PSU2 legend at the outer
    end. The screw's position and size are read off an 800 px photograph and are estimated;
    nothing else is on the plate, so nothing else is drawn.
elements:
  plate: {at: [0.0, 0.0], size: [95.0, 41.5], class: body}
body:
  depth: 1.0
  color: '#1b1d20'
skins: [default]
