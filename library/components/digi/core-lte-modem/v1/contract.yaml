format: 1
kind: module
name: core-lte-modem
version: 1.1.0
class: transceiver
behaviour: fills
profile: networking
description: >-
  Digi CORE plug-in LTE modem 1002-CMG4-GLB (Global LTE Cat 4, 3G / 2G fallback). The cellular
  module that fits the CORE module socket of the Digi Connect EZ 16 and 32.
  A black plate with two SMA antenna jacks printed WWAN2 and WWAN1 under a "CORE MODULE"
  legend, and a thumbscrew at each end.
size: {w: 133.2, h: 22.8}
size-confidence: {w: drawing, h: drawing}
attrs: {model: 1002-CMG4-GLB, media: cellular}
provenance:
  model: >-
    datasheet - the Digi Connect EZ 16/32 product page lists "Digi CORE plug-In LTE modem" as
    1002-CMG4-GLB, "LTE Cat 4 with 3G / 2G fallback (Global)", an accessory. Its "CONNECTORS" row
    lists "(2) 50 Ω SMA (center pin: female)" and its "SIM SLOTS" row "(2) Mini-SIM (2FF)",
    "Secured in cellular module", under the heading "When used with Digi CORE plug-in LTE modem".
  size: >-
    drawing - the Connect EZ 16 dimension model ("footprint" STEP file, EZ16-A000): a plate
    136.5 wide and 22.8 high, 1.0 thick, in the lower part of the rear face. It overlaps the
    first power supply's box by 3.3 mm, so it is cut to 133.2 here. The plate in that model may
    be the module's or the socket's cover; the rear photograph shows these two jacks and
    legends on it.
  layout: >-
    photo-measured - the Connect EZ 16/32 rear photograph (800 px, 1.64 px/mm across): the
    jacks at 17.5 and 107.5 from the model's plate edge, less the 3.3 cut, the legend centred
    between them, and the thumbscrews from the dimension model at 4.5 and 132.0, less the
    cut at the left. Good to about 2 mm.
  groups: >-
    Digi Connect EZ 16/32 product page, the cellular rows "When used with Digi CORE plug-in LTE modem": its
    "CONNECTORS" row lists two 50 ohm SMA connectors, and the module's accessory row names the model as
    "LTE Cat 4 with 3G / 2G fallback". The two jacks are printed WWAN2 and WWAN1 on the plate in the
    Connect EZ 16/32 rear photograph. Both join one group. The page prints a connector count and an LTE
    category and no data rate for either jack, so the group states no speed. Its role is traffic, the
    schema's role for the link the box is bought to carry, as the antenna group of the Digi Connect IT
    16 and 48 is; the page names no role for the jacks, so that is the contract's reading of the job.
  sim: >-
    not drawn - the two mini-SIM slots are inside the module and no document held shows
    where they are.
  power: >-
    not stated - Digi's page gives no draw for the module, so none is written here and the
    whole-library lint carries it as a part with no power figure.
elements:
  legend: {at: [34.4, 7.0], size: [56.5, 6.0], class: label}
  screw-left: {at: [0.0, 4.7], size: [9.0, 9.0], class: fastener}
  screw-right: {at: [124.2, 4.7], size: [9.0, 9.0], class: fastener}
groups:
  antennas:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: coax-sma}
    description: >-
      the two WWAN antenna jacks of the module plate, printed WWAN2 and WWAN1
parts:
  - {ref: std/sma@1, id: wwan2, at: [11.1, 7.1], group: antennas}
  - {ref: std/sma@1, id: wwan1, at: [101.1, 7.1], group: antennas}
relief:
  wall: '#17191b'
  features:
    - node: screw-left
      cyl: 6.2
      confidence: drawing
      source: >-
        digi/core-lte-modem@1 - the dimension model gives the thumbscrew head 10.76 across and
        6.2 proud; the node is the 9.0 square drawn here.
    - node: screw-right
      cyl: 6.2
      confidence: drawing
      source: as screw-left
body:
  depth: 40.0
  color: '#1b1d20'
skins: [default]
