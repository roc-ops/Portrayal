format: 1
kind: module
name: psu-132-dc
version: 1.2.0
class: psu
behaviour: fills
profile: networking
description: UfiSpace PSU-132-DESR 1300W DC PSU (S9300-32D family) - silver face,
  red release latch, two-pole screw-terminal block with flip-open plastic cover,
  square-hole vent grid, wire bail handle, status LED; front-to-back (exhaust)
  airflow; the intake PSU-132-DISB is the back-to-front unit and wears a blue latch
  (`latch-finish`)
size: {w: 50.5, h: 40.0}
attrs: {power-output-w: 1300, input: dc, model: PSU-132-DESR, inlet: dc-terminal}
provenance:
  inlet: >-
    transcribed from this contract's own description: 'two-pole screw-terminal block with
    flip-open plastic cover'. Nothing new was measured.
  power: >-
    datasheet - the ordering line states the rating in the part number's own row: 'Power
    Supply Types PSU-132-DESR-3N, 1300W DC, exhaust air flow / PSU-132-DISB1, 1300W DC,
    intake air flow', beside the AC pair at the same 1300 W. Input per datasheet: DC -40
    to -75 V, 40 A. The HIG adds a built-in 60 A fast-acting fuse and that 12 V and 5VSB
    are live the moment input is connected.
  size: >-
    datasheet/drawing - the HIG component table gives the PSU 50.5 x 321 x 40 mm (W x D x
    H); the HIG Fig 7 DC PSU drawing dimensions the body (321 mm, 316.2 mm to the latch
    shoulder, 331.2 mm overall with handle, face 50.0 x 39.9 drawn) - the drawing's face
    view is printed rotated 90 degrees, its 39.9 being the installed HEIGHT. Face taken
    as 50.5 x 40 per the table; the 43.8 mm chassis leaves a 1.9 mm margin top and bottom.
  terminal-block: >-
    drawing/photo - HIG Fig 32/33 show the screw-type terminal block behind a flip-open
    plastic cover, taking two one-hole lugs on M-studs torqued to 14.0 +/- 0.5 kgf.cm;
    the datasheet rear view draws the two clamps side by side in the centre of the face.
    Two poles (-48V and return); positions photo-measured off the datasheet rear render,
    which is 6% off in aspect, so they are proportions, not measurements.
  seats: >-
    estimated - each terminal screw is the library's common/terminal-screw-34@1, a screw head
    3.4 across (that part's own size is an estimate), standing at the centre of the clamp screw
    this skin already draws (centres 19.8 and 30.2 across, 22.6 down), so the head is drawn
    smaller than the ring round it, and lifted 8.0 mm, this block's own estimated proudness.
    No document held gives the screw head, the thread or the stud of this block: the guides
    name a one-hole lug and a torque and no screw.
  poles: >-
    UfiSpace S9300-32D Hardware Installation Guide, section 9 Connecting Power (DC version),
    Figure 32; the S9701-82DC and S9600-72XC guides print the same figure. The cables land on
    the left and right terminal, and the legend under them reads '-' (black cable, left) and
    '+' (red cable, right), as this skin's face stands, latch on the left. The roles are the
    signs the legend prints, `neg` and `pos`; the '-48V and return' of the terminal-block note
    above is the telecom reading of the same two signs. The S9600-72XC, S9600-102XC and
    S9601-102XC guides name 'the RTN terminal' only in a sentence about isolating it from the
    chassis, and none of the guides says which of the two terminals that is.
  rating: >-
    datasheet - 'DC input: -40V to -75V, 40A' in the datasheet of every device that places
    this part. The 40 A is the input current. The range has no nominal in any of them, and a
    port's `voltage` needs one, so the port states no voltage. The guides name cable of #6, #8
    and #10 AWG for this block between them, so the port states no `awg`.
  led-states: HIG section 10, PSU FRU LED table (page 25), transcribed in full
  airflow: >-
    inferred - the datasheet names two units by airflow word ('PSU-132-DESR... exhaust air flow',
    'PSU-132-DISB... intake air flow') and HIG Fig 6 names two by latch colour (red for
    front-to-back systems, blue for back-to-front); no S9300/S9301 document joins the two
    lists. For a supply at the REAR, exhaust is front-to-back, and three independent
    readings agree: the FAN-405637-HD fan is 'exhaust air flow' and is the red, front-to-back
    unit by the same HIG's colour rule; the S9600-72XC is sold front-to-back only and its
    datasheet lists only this family's exhaust units; and the S9311-64D datasheet prints
    'exhaust air, ... red colored latch' against 'intake air, ... blue latch' for its own
    CRPS supplies. This contract used to say the opposite ('PSU-132-DISB1 ... front-to-back
    (intake)') and was corrected on that evidence. The default skin draws the red-latched
    exhaust unit; `latch-finish` / `latch-edge` draw the blue-latched PSU-132-DISB.
elements:
  status-led:
    at: [6.4, 31.4]
    size: [3.0, 3.0]
    class: led
    states: ['off',
             {name: ok, color: '#22c55e'},
             {name: standby, color: '#22c55e', behavior: blinking},
             {name: fail, color: '#ef4444'},
             {name: input-lost, color: '#ef4444', behavior: blinking},
             {name: warning, color: '#22c55e', behavior: {mode: alternating, color: '#ef4444'}}]
    description: >-
      HIG PSU FRU LED table - Off (no input power to all power supplies), Green (output
      on and OK), Blinking Green (standby state / only +5VSB on, or firmware updating),
      Red (critical event causing shutdown - failure, over current, short circuit, over
      voltage, fan failure, over temperature), Blinking Red (input power lost with a
      second supply in parallel still powered), Blinking between Green and Red (warning
      event, supply continues to operate - high temp, high power, high current, slow fan)
  latch: {at: [0.6, 3.5], size: [4.2, 14.5], class: latch}
  handle: {at: [40.6, 3.0], size: [3.2, 24.0], class: handle}
  terminal-block: {at: [13.0, 8.0], size: [24.0, 28.0], class: inlet}
relief:
  features:
    - node: latch
      out: 2.2
      confidence: estimated
      source: >-
        ufispace/psu-132-dc@1 - the HIG Fig 7 drawing gives the face and the body depth
        and projects only the handle; the latch's proudness is not in it. Same 2.2 as
        ufispace/psu-401-dc.
    - node: handle
      uhandle: 38
      confidence: datasheet
      source: >-
        UfiSpace S9300-32D HIG, Space Clearance: 'the handle for the power supplies will
        extend outwards by 1.5 inches (3.8cm)'. 38 mm, published by the vendor for the PSU
        handle specifically (the fan handle's 1 inch is the other half of the same
        sentence).
    - node: terminal-block
      out: 8
      confidence: estimated
      source: >-
        ufispace/psu-132-dc@1 - unsourced. The HIG dimensions the body and projects the
        handle; the block's proudness is not in it. Same 8 as ufispace/psu-401-dc's block:
        one estimate written twice.
    - node: status-led
      dome: 0.4
      confidence: estimated
      source: >-
        ufispace/psu-132-dc@1 - unsourced. The HIG's PSU FRU LED table gives the lamp's
        states and nothing about its lens. Same 0.4 as every other UfiSpace FRU lamp.
    - node: vent-field
      vent: 30
      confidence: estimated
      source: >-
        ufispace/psu-132-dc@1 - the HIG dimensions nothing off the face but the handle;
        the vent depth is not in it.
connection-points:
  power: {at: [25.0, 24.0], direction: front}
parts:
  - {ref: common/terminal-screw-34@1, id: pole-neg, at: [18.1, 20.9], lift: 8.0}
  - {ref: common/terminal-screw-34@1, id: pole-pos, at: [28.5, 20.9], lift: 8.0}
dc:
  ports:
    - id: input
      direction: input
      rating-a: 40
      poles:
        - {role: neg, slot: pole-neg}
        - {role: pos, slot: pole-pos}
      source: {poles: poles, rating-a: rating}
fields:
  latch-finish:
    label: Latch colour
    type: text
    default: '#c22f2f'
  latch-edge:
    label: Latch edge
    type: text
    default: '#8c2323'
skins: [default]
