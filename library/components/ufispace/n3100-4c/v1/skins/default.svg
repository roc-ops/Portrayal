<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="21.59mm" viewBox="0 0 120.02 21.59">
  <!-- ufispace/n3100-4c: the card's punched faceplate. Outline, retention tip
       and keyed flange are std/pcie-bracket-fh@2, composed BEHIND this.
       TIP AT THE LEFT, so the vendor's figure is turned a half-turn and the
       printing reads upside down; in a turned bay it lands upright. -->
  <!-- the board and cover edge, standing past the metal on the keyed side -->
  <rect id="pcb-edge" x="32.80" y="1.37" width="87.31" height="1.80" fill="#1d2023"/>
  <!-- METAL FILLING THE OPENING: seamless, the bracket's colour, 0.3 proud
       all round so the opening's own stroke leaves no ghost rectangle. -->
  <rect id="plate" x="19.66" y="6.05" width="90.50" height="12.66" fill="#9aa1a8"/>
  <g id="vents"><rect x="107.95" y="16.40" width="2.0" height="2.0" rx="0.25" fill="#17191c"/><rect x="104.60" y="16.40" width="2.0" height="2.0" rx="0.25" fill="#17191c"/><rect x="101.25" y="16.40" width="2.0" height="2.0" rx="0.25" fill="#17191c"/><rect x="97.90" y="16.40" width="2.0" height="2.0" rx="0.25" fill="#17191c"/><rect x="94.55" y="16.40" width="2.0" height="2.0" rx="0.25" fill="#17191c"/><rect x="91.20" y="16.40" width="2.0" height="2.0" rx="0.25" fill="#17191c"/><rect x="109.32" y="13.18" width="2.0" height="2.0" rx="0.25" fill="#17191c"/><rect x="109.32" y="9.83" width="2.0" height="2.0" rx="0.25" fill="#17191c"/><rect x="109.32" y="6.49" width="2.0" height="2.0" rx="0.25" fill="#17191c"/><rect x="99.19" y="13.10" width="2.0" height="2.0" rx="0.25" fill="#17191c"/><rect x="99.19" y="9.75" width="2.0" height="2.0" rx="0.25" fill="#17191c"/></g>
  <g id="port-tags">
    <rect x="76.67" y="17.02" width="5.07" height="2.49" rx="0.3" fill="#e0cd3c"/>
    <rect x="62.50" y="17.02" width="5.07" height="2.49" rx="0.3" fill="#e0cd3c"/>
    <rect x="48.20" y="17.02" width="5.07" height="2.49" rx="0.3" fill="#e0cd3c"/>
    <rect x="33.86" y="17.02" width="5.07" height="2.49" rx="0.3" fill="#e0cd3c"/>
  </g>
  <g id="silkscreen">
    <text id="label-port-0" x="79.2" y="19.05" transform="rotate(180 79.2 18.26)" font-family="sans-serif" font-size="2.2" font-weight="bold" text-anchor="middle" fill="#141414">0</text>
    <text id="label-port-1" x="65.03" y="19.05" transform="rotate(180 65.03 18.26)" font-family="sans-serif" font-size="2.2" font-weight="bold" text-anchor="middle" fill="#141414">1</text>
    <text id="label-port-2" x="50.74" y="19.05" transform="rotate(180 50.74 18.26)" font-family="sans-serif" font-size="2.2" font-weight="bold" text-anchor="middle" fill="#141414">2</text>
    <text id="label-port-3" x="36.4" y="19.05" transform="rotate(180 36.4 18.26)" font-family="sans-serif" font-size="2.2" font-weight="bold" text-anchor="middle" fill="#141414">3</text>
    <text id="label-1pps" x="105.04" y="8.09" transform="rotate(180 105.04 7.23)" font-family="sans-serif" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#2b2d2f">1PPS</text>
    <text id="label-10mhz" x="94.95" y="8.09" transform="rotate(180 94.95 7.23)" font-family="sans-serif" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#2b2d2f">10MHZ</text>
    <text id="label-gnss-ant" x="24.77" y="8.09" transform="rotate(180 24.77 7.23)" font-family="sans-serif" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#2b2d2f">GNSS ANT</text>
  </g>
</svg>
