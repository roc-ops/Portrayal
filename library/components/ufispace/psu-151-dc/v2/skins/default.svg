    <circle cx="28.2" cy="26.9" r="3.1" fill="#8a9099" stroke="#4a4f55" stroke-width="0.3"/>
    <line x1="6.8" y1="26.9" x2="11.2" y2="26.9" stroke="#4a4f55" stroke-width="0.5"/>
    <line x1="16.4" y1="26.9" x2="20.8" y2="26.9" stroke="#4a4f55" stroke-width="0.5"/>
    <line x1="26.0" y1="26.9" x2="30.4" y2="26.9" stroke="#4a4f55" stroke-width="0.5"/>
    <rect x="7.4" y="33.4" width="3.2" height="1.2" fill="#8a9099"/>
    <rect x="17.0" y="33.4" width="3.2" height="1.2" fill="#8a9099"/>
    <rect x="26.6" y="33.4" width="3.2" height="1.2" fill="#8a9099"/>
