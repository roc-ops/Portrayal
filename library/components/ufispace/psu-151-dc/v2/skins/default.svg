<svg xmlns="http://www.w3.org/2000/svg" width="50.5mm" height="40.2mm" viewBox="0 0 50.5 40.2">
  <defs>
    <pattern id="sq" width="3.0" height="3.0" patternUnits="userSpaceOnUse">
