<svg xmlns="http://www.w3.org/2000/svg" width="50.5mm" height="40.2mm" viewBox="0 0 50.5 40.2">
  <defs>
    <pattern id="sq" width="3.0" height="3.0" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="2.0" height="2.0" fill="#0d0f11"/>
    </pattern>
  </defs>
  <rect id="body" x="0" y="0" width="50.5" height="40.2" rx="0.6" fill="#9aa0a8" stroke="#5a6068" stroke-width="0.4"/>
  <rect id="vent-field" x="2.0" y="2.2" width="25.0" height="13.0" fill="url(#sq)"/>
  <rect id="vent-col" x="40.5" y="10.0" width="7.5" height="22.0" fill="url(#sq)"/>
  <rect id="latch" x="0.4" y="0.6" width="6.4" height="3.6" rx="0.8" fill="#c22f2f" stroke="#8c1f1f" stroke-width="0.3" data-fill-from="latch-finish" data-stroke-from="latch-edge"/>
  <g id="terminal-block">
