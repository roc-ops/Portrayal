    <rect x="0" y="0" width="120.9" height="3.0" fill="#8a9096" stroke="#5c6167" stroke-width="0.3"/>
    <rect x="116.9" y="30.0" width="3.0" height="89.0" rx="0.3" fill="#c9a227"/>
    <rect x="0" y="3.0" width="94.9" height="170.8" rx="0.8" fill="#c3c6c8" stroke="#8f9396" stroke-width="0.4"/>
  </g>
</svg>
