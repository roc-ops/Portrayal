format: 1
kind: module
name: psu-151-ac
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: UfiSpace PSU-151-AESR 150W AC PSU (S6301-56ST family) - C14 inlet,
  red release latch (exhaust / front-to-back airflow; the intake sibling
  PSU-151-AISB wears blue), black wire pull strap, status LED top-right
size: {w: 50.5, h: 40.2}
attrs: {power-output-w: 150, input: ac, model: PSU-151-AESR}
provenance:
  power: >-
    datasheet - UfiSpace states the rating in the part number's own ordering line, in the
    S6301-56ST datasheet's Available to Order section: 'PSU-151-AESR, 150W AC, exhaust air
    flow', beside 'PSU-151-AISB, 150W AC, intake air flow' and the DC siblings at the same
    150 W. No ambient is stated with it, so none is recorded.
  size: >-
    drawing - S6301-56ST HIG Figure 9 (AC PSU dimension drawing, stated to share the DC
    unit's envelope): face 50.5 x 40.2 mm, body 196.0 mm (203.5 mm over the latch); the
    HIG component table rounds it to 'PSU (W x D x H) 50.5 x 196 x 40 mm'.
  inlet: standard (IEC 60320-1 via std/c14-inlet); position estimated from HIG Figure 8's
    isometric photographs - no held image shows the AC face straight on
  latch-color: >-
    photo + HIG section 4 - red identifies front-to-back (exhaust) airflow, blue
    back-to-front. This skin draws the red exhaust unit; the intake variant is not
    separately drawn.
  led-states: S6301-56ST HIG section 10, PSU FRU LED table (page 22), transcribed in full
elements:
  status-led:
    at: [43.4, 5.1]
    size: [3.2, 3.2]
    class: led
    states: ['off',
             {name: ok, color: '#22c55e'},
             {name: standby, color: '#22c55e', behavior: blinking},
             {name: fw-update, color: '#22c55e', behavior: blinking},
             {name: critical, color: '#eab308'},
             {name: input-lost, color: '#eab308', behavior: blinking},
             {name: warning, color: '#22c55e', behavior: {mode: alternating, color: '#eab308'}}]
    description: >-
      S6301-56ST HIG PSU FRU LED table - Off (no input power to all power supplies), Green
      (output ON and OK), Blinking Green 1/sec (standby state, input present, only +5VSB
      on), Blinking Green 2/sec (power supply firmware updating, boot-loader mode - same
      colour and behaviour token as standby, the table separates them only by blink rate),
      Yellow (critical event causing shutdown: failure, over current, short circuit, over
      voltage, fan failure, over temperature), Blinking Yellow 1/sec (power cord unplugged
      or input lost with the second supply still fed; or input present with 5VSB and 12V
      off via system control), Blinking between Green and Yellow (warning events where the
      supply continues to operate: high temp, high power, high current, slow fan)
  latch: {at: [0.4, 0.6], size: [6.4, 3.6], class: latch}
  handle: {at: [29.0, 2.0], size: [4.6, 36.5], class: handle}
parts:
  - {ref: std/c14-inlet@1, id: inlet, at: [0.8, 16.8]}
relief:
  features:
    - node: latch
      out: 2.2
      confidence: estimated
      source: >-
        ufispace/psu-151-ac@1 - the HIG's Figure 9 drawing gives the face and the body
        length and dimensions nothing else off the face; 2.2 follows the psu-401 family
        estimate.
    - node: handle
      uhandle: 38
      confidence: datasheet
      source: >-
        S6301-56ST HIG, Space Clearance: 'the handle for the power supplies will extend
        outwards by 1.5 inches (3.8cm)'. 38 mm, published by the vendor for THIS device's
        supplies - NOT the 27 mm of the S9510's PSU-401, which is that HIG's own figure.
    - node: status-led
      dome: 0.4
      confidence: estimated
      source: >-
        ufispace/psu-151-ac@1 - unsourced. The HIG's PSU FRU LED table gives the lamp's
        states and nothing about its lens; 0.4 follows the UfiSpace FRU family estimate.
    - node: vent-field
      vent: 30
      confidence: estimated
      source: >-
        ufispace/psu-151-ac@1 - the vent depth is not in any held drawing; follows the
        psu-401 family estimate.
connection-points:
  power: {at: [14.8, 26.8], direction: front}
fields:
  latch-finish:
    label: Latch colour
    type: text
    default: '#c22f2f'
  latch-edge:
    label: Latch edge
    type: text
    default: '#8c1f1f'
skins: [default]
