format: 1
kind: module
name: psu-401-dc
version: 1.4.0
class: psu
behaviour: fills
profile: networking
description: UfiSpace PSU-401-DISB-1 400W DC PSU - screw-terminal block, blue
  release latch, black tube handle, status LED (S9510-28DC family)
size: {w: 50.5, h: 40.2}
attrs: {power-output-w: 400, input: dc, model: PSU-401-DISB-1, inlet: dc-terminal}
provenance:
  inlet: >-
    transcribed from this contract's own description: 'screw-terminal block', drawn here as
    the `terminal-block` element. Nothing new was measured.
  power: >-
    datasheet - UfiSpace states the rating in the part number's own ordering line: 'Power
    Supply Types PSU-401-DISB-1, 400W DC, intake air flow', beside the AC sibling 'PSU-401-AISB,
    400W AC, intake air flow' and the exhaust-flow 'PSU-401-DESR, 400W DC'. The AC and DC
    units are rated alike at 400 W. No ambient is stated, so none is recorded.
  size: HIG (Fig 6 drawing, 50.5 x 40.2 face; body 211mm, handle to 27mm proud)
  led-states: HIG section 10, PSU FRU LED table (page 21), transcribed in full
  seats: >-
    estimated - each terminal screw is the library's common/terminal-screw-34@1, a screw head
    3.4 across (that part's own size is an estimate), standing at the centre of the clamp screw
    this skin already draws (centres 11.3, 20.9, 30.5 across, 29.2 down) and lifted 8.0 mm, this
    block's own estimated proudness. The head is drawn smaller than the ring round it, and
    smaller than the screw: the guides name M3.5 screws (the S9510-28DC Hardware Installation
    Guide, section 9 (DC version), Figure 23 (PDF page 20); the S7801-54XS, S8901-54XC,
    S9500-30XS and S9510-30XC guides print the same figure), and an M3.5 thread is wider than
    that head, so the drawing marks where a lug lands and does not show the screw. The same
    figure gives a lug hole over 3.5 mm and a lug no wider than 8.2 mm (W < 8.2 mm). No document
    held gives the screw head, the stud length or the spacing of the screws; the spacing is this
    skin's own.
  poles: >-
    UfiSpace S9510-28DC Hardware Installation Guide, section 9 Connecting Power (DC version),
    Figure 24 (PDF page 21): the supply's face with the legend printed under its three terminal
    screws, 'RTN', a negative voltage range (-36 to -75 V as the picture reads) and the earth
    symbol, a lug and wire under each, and the label 'Green/Yellow Grounding Wire (min. size 14
    AWG)' at the right-hand one. The S7801-54XS, S8901-54XC, S9500-30XS and S9510-30XC guides
    print the same figure (Figure 26 in the first two, Figure 24 in the others). The roles are
    the legend's, left to right as this skin's face stands, latch on the left: `rtn` for RTN,
    `batt` for the negative voltage range (spec/schemas/dc.yaml writes `batt` as -48V or
    negative (battery)) and `gnd` for the earth symbol (it writes `gnd` as the earth symbol).
    The earth terminal is the third pole of the port and is not a conductor of a feed. The same
    guide's NEBS note (PDF page 32) names 'the RTN terminal' and says it is isolated from the
    chassis or rack. No document held gives a nominal voltage.
  rating: >-
    datasheet - 'DC input: -36 to -75V, 16A' in the datasheet of each of the five devices that
    place this part (the S7801-54XS, S8901-54XC, S9500-30XS, S9510-28DC and S9510-30XC
    datasheets). The 16 A is the input current. The range has no nominal in any of them, and a
    port's `voltage` needs one, so the port states no voltage. The guides add a built-in 20A
    fast acting fuse; that is the fuse, not the input current.
  awg: >-
    UfiSpace S9510-28DC Hardware Installation Guide, section 9 step 2 (PDF page 20): a 'UL 1015,
    14 AWG DC power cable' of stranded copper for the screw-type terminal block; the S7801-54XS,
    S8901-54XC, S9500-30XS and S9510-30XC guides say the same; the earth wire of the legend
    figure is labelled 'min. size 14 AWG'. One size in every guide held for this supply, so the
    port states it.
elements:
  status-led:
    at: [44.2, 2.2]
    size: [3.2, 3.2]
    class: led
    states: ['off',
             {name: ok, color: '#22c55e'},
             {name: fail, color: '#ef4444'},
             {name: standby, color: '#22c55e', behavior: blinking},
             {name: no-dc, color: '#ef4444', behavior: blinking},
             {name: warning, color: '#22c55e', behavior: {mode: alternating, color: '#ef4444'}}]
    description: >-
      HIG PSU FRU LED table - Off (no DC power to any PSU), Green (DC output on and
      OK), Red (PSU failure), Flashing Green (DC present, only standby output on -
      poor contact), Flashing Red (no DC power to THIS PSU), Flashing between Green
      and Red (warning: working condition not satisfied, check voltage, current and
      temperature)
  latch: {at: [0.6, 4.5], size: [3.6, 14.0], class: latch}
  handle: {at: [38.6, 6.0], size: [3.4, 26.0], class: handle}
  terminal-block: {at: [5.8, 21.0], size: [30.2, 16.5], class: inlet}
relief:
  features:
    - node: latch
      out: 2.2
      confidence: estimated
      source: >-
        ufispace/psu-401-dc@1 - the HIG's Fig 6 drawing gives the 50.5 x 40.2 FACE and, for
        the fan and PSU handles, a projection; it dimensions nothing else off the face. This
        magnitude is not in it.
    - node: handle
      uhandle: 27
      confidence: datasheet
      source: >-
        UfiSpace S9510-28DC HIG, Space Clearance: 'the handle for the power supplies will
        extend outwards by 1.06 inches (2.7cm)'. 27 mm. CORRECTED FROM 25, which was the FAN
        handle's figure from the first half of the same sentence. THE FILE ALREADY HELD THE
        RIGHT NUMBER: this contract's own size key reads 'body 211mm, handle to 27mm proud'.
        That is not a second source corroborating this one - it is the same HIG read by
        whoever sized the part - but it does mean the contract stated 27 in one place and
        rendered 25 in another.
    - node: terminal-block
      out: 8
      confidence: estimated
      source: >-
        ufispace/psu-401-dc@1 - unsourced. Its size key reaches past the face to give 'body
        211mm, handle to 27mm proud' and stops there; the terminal block's 8 mm is not in
        the HIG.
    - node: status-led
      dome: 0.4
      confidence: estimated
      source: >-
        ufispace/psu-401-dc@1 - unsourced. The HIG's PSU FRU LED table gives the lamp's
        states and nothing about its lens. Same 0.4 as the fan and the AC PSU: one estimate
        written three times.
    - node: vent-field
      vent: 30
      confidence: estimated
      source: >-
        ufispace/psu-401-dc@1 - the HIG's Fig 6 drawing gives the 50.5 x 40.2 FACE and, for
        the fan and PSU handles, a projection; it dimensions nothing else off the face. This
        magnitude is not in it.
connection-points:
  power: {at: [20.9, 29], direction: front}
parts:
  - {ref: common/terminal-screw-34@1, id: pole-rtn, at: [9.6, 27.5], lift: 8.0}
  - {ref: common/terminal-screw-34@1, id: pole-batt, at: [19.2, 27.5], lift: 8.0}
  - {ref: common/terminal-screw-34@1, id: pole-gnd, at: [28.8, 27.5], lift: 8.0}
dc:
  ports:
    - id: input
      direction: input
      rating-a: 16
      awg: [14]
      poles:
        - {role: rtn, slot: pole-rtn}
        - {role: batt, slot: pole-batt}
        - {role: gnd, slot: pole-gnd}
      source: {poles: poles, rating-a: rating, awg: awg}
skins: [default]
