format: 1
kind: module
name: fan-402825
version: 1.1.0
class: fan
profile: networking
description: UfiSpace FAN-402825-HD hot-swap fan module (S9510-28DC family) -
  red tube handle on the left, knurled captive thumbscrew on the right,
  status LED top-left; exhaust airflow
size: {w: 51.5, h: 42.2}
attrs: {model: FAN-402825-HD, airflow: exhaust}
provenance:
  size: HIG (component table 51.5 x 57.8 x 42.2; Fig 8 drawing)
  led-states: HIG section 10, Fan FRU LED table (page 21), transcribed in full
elements:
  status-led:
    at: [2.0, 1.6]
    size: [3.0, 3.0]
    class: led
    states: ['off',
             {name: ok, color: '#22c55e'},
             {name: fault, color: '#eab308', behavior: blinking}]
    description: >-
      HIG Fan FRU LED table - Off (main board 3.3V power fail, or fan not present),
      Solid Green (fan present and interrupt de-assert), Blinking Yellow (fan present
      but interrupt assert). The table's Blinking Green and Solid Yellow rows read
      N/A and are deliberately not modelled
relief:
  features:
    - node: rotor-grille
      vent: 25
      confidence: estimated
      source: >-
        ufispace/fan-402825@1 - the HIG's Fig 8 drawing gives the 51.5 x 42.2 FACE and, for
        the fan and PSU handles, a projection; it dimensions nothing else off the face. This
        magnitude is not in it.
    - node: rotor-behind
      vent: 25
      confidence: estimated
      source: >-
        ufispace/fan-402825@1 - the HIG's Fig 8 drawing gives the 51.5 x 42.2 FACE and, for
        the fan and PSU handles, a projection; it dimensions nothing else off the face. This
        magnitude is not in it.
    - node: rotor-bulge
      dome: 3.2
      confidence: estimated
      source: >-
        ufispace/fan-402825@1 - the HIG's Fig 8 drawing gives the 51.5 x 42.2 FACE and, for
        the fan and PSU handles, a projection; it dimensions nothing else off the face. This
        magnitude is not in it.
    - node: handle
      uhandle: 25
      confidence: datasheet
      source: >-
        UfiSpace S9510-28DC HIG, Space Clearance: 'The handle for the fan units will extend
        outwards by 1 inch (2.5cm)'. 25 mm exactly, published by the vendor for THIS part.
        ONE OF ONLY TWO VENDOR-PUBLISHED RELIEF PROJECTIONS IN THE WHOLE INTAKE - no Cisco,
        Casa, Edgecore or Celestica document states one for any part.
    - node: thumbscrew
      cyl: 5
      knurl: true
      confidence: estimated
      source: >-
        ufispace/fan-402825@1 - the HIG's Fig 8 drawing gives the 51.5 x 42.2 FACE and, for
        the fan and PSU handles, a projection; it dimensions nothing else off the face. This
        magnitude is not in it.
    - node: status-led
      dome: 0.4
      confidence: estimated
      source: >-
        ufispace/fan-402825@1 - unsourced. The HIG's fan FRU LED table gives the lamp's
        STATES in full and nothing about its lens. 0.4 is the same dome on all three
        UfiSpace FRUs: one estimate written three times.
