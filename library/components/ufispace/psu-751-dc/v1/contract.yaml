format: 1
kind: module
name: psu-751-dc
version: 1.0.1
class: psu
behaviour: fills
profile: networking
description: UfiSpace PSU-751 750W DC PSU (S9110-32X) - three-stud screw-terminal
  block, release latch, black tube handle, status LED. Default skin is the
  red-latched PSU-751-DESR (exhaust, front-to-back systems); the blue skin is
  the PSU-751-DISB intake unit
size: {w: 50.5, h: 40.2}
attrs: {power-output-w: 750, input: dc, model: PSU-751-DESR, inlet: dc-terminal}
provenance:
  inlet: >-
    transcribed from this contract's own description: 'three-stud screw-terminal block'.
    Nothing new was measured.
  power: >-
    datasheet - UfiSpace states the rating in the part number's own ordering lines:
    'PSU-751-DESR, 750W DC, exhaust air flow' and 'PSU-751-DISB, 750W DC, intake air
    flow'. The HIG's environment section says the same the other way round: 'a reserve
    of at least 750 watts on each power circuit'. Input -36 to -75 VDC, 28 A max per
    feed (datasheet and HIG checklist; the HIG's power-up step narrows it to -40 to
    -75 V for a 5000 m rating and notes a built-in 30 A fast-acting fuse). No ambient
    is stated with the rating, so none is recorded.
  size: >-
    HIG - the component table gives the PSU 50.5 x 263 x 40.2 mm (W x D x H) and
    Figure 7 dimensions the DC unit's body at 260/263/273 mm long with the 50.5 x
    40.2 face; the face measures 49.9 mm across in the rear product render at
    3.807 px/mm. NOTE Figure 7 draws the face rotated 90 degrees (50.5 vertical);
    the table's W x H and the render agree the face stands 50.5 wide by 40.2 tall.
  airflow: >-
    HIG Figure 6 - 'the DC PSU with back-to-front airflow, identified with a blue
    latch... the DC PSU for front-to-back airflow, identified with a red latch'.
    Same size both ways (HIG); only the latch colour and SKU differ.
  layout: photo-measured off the rear product renders (3.807 px/mm) - latch top-left,
    lamp beside it, square vent field across the top, terminal block lower-left,
    tube handle at right, slot vents and a green spec label on the right margin.
  led-states: HIG section 10, PSU FRU LED table (page 21), transcribed in full.
elements:
  status-led:
    at: [11.2, 4.6]
    size: [3.2, 3.2]
    class: led
    states: ['off',
             {name: ok, color: '#22c55e'},
             {name: fail, color: '#ef4444'},
             {name: standby, color: '#22c55e', behavior: blinking},
             {name: fw-update, color: '#22c55e', behavior: blinking},
             {name: input-lost, color: '#ef4444', behavior: blinking},
             {name: warning, color: '#22c55e', behavior: {mode: alternating, color: '#ef4444'}}]
    description: >-
      HIG PSU FRU LED table - Off (no input power to all power supplies), Green
      (output ON and OK), Blinking Green 1/sec (standby state, only +5VSB on),
      Blinking Green 2/sec (power supply firmware updating, boot-loader mode), Red
      (critical event causing a shutdown - failure, over current, short circuit,
      over voltage, fan failure, over temperature), Blinking Red 1/sec (input power
      cord unplugged or input power lost with a second supply still fed), Blinking
      between Green and Red (warning while still operating - high temp, high power,
      high current, slow fan)
  latch: {at: [0.0, 4.0], size: [2.5, 12.0], class: latch}
  handle: {at: [36.2, 2.5], size: [3.6, 35.0], class: handle}
  terminal-block: {at: [2.2, 18.6], size: [32.0, 17.0], class: inlet}
relief:
  features:
    - node: latch
      out: 2.2
      confidence: estimated
      source: >-
        ufispace/psu-751-dc@1 - the HIG's Figure 7 dimensions the body and, in the
        Space Clearance note, projects the handle; nothing else off the face is
        dimensioned. Same 2.2 estimate as the psu-401 family.
    - node: handle
      uhandle: 38
      confidence: datasheet
      source: >-
        UfiSpace S9110-32X HIG, Space Clearance: 'the handle for the power supplies
        will extend outwards by 1.5 inches (3.8cm)'. 38 mm, published by the vendor
        for this PSU. Note it differs from the S9510-28DC family's 27 mm.
    - node: terminal-block
      out: 8
      confidence: estimated
      source: >-
        ufispace/psu-751-dc@1 - unsourced; the block stands proud in HIG Figure 6's
        isometric and no document dimensions it. Same 8 estimate as psu-401-dc.
    - node: status-led
      dome: 0.4
      confidence: estimated
      source: >-
        ufispace/psu-751-dc@1 - unsourced. The HIG's PSU FRU LED table gives the
        lamp's states and nothing about its lens. Same 0.4 estimate as the other
        UfiSpace FRUs.
    - node: vent-field
      vent: 30
      confidence: estimated
      source: >-
        ufispace/psu-751-dc@1 - the vent field is visible in both rear renders;
        its open fraction is not documented.
connection-points:
  power: {at: [18.2, 27.1], direction: front}
fields:
  latch-finish:
    label: Latch colour
    type: text
    default: '#c22f2f'
  latch-edge:
    label: Latch edge
    type: text
    default: '#8c1f1f'
skins: [default]