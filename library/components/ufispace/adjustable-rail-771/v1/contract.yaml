format: 1
kind: component
name: adjustable-rail-771
version: 1.0.0
class: mount
behaviour: mounts
profile: networking
description: >-
  The 771 mm adjustable mounting rail of the UfiSpace deep routers and switches, two sets to a
  kit. Each set has three members. The inner rail hangs on the chassis pins, the middle rail
  slides out, and the outer rail clips to the posts of a four-post rack. Drawn as one plain bar,
  because the guide dimensions no member.
size: {w: 22.0, h: 44.0, d: 771.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
provenance:
  model: >-
    datasheet - UfiSpace S9710-76D Core/Edge Router Hardware Installation Guide (R1.12),
    section 5 Rack Mounting, page 11, Figure 11: the adjustable mounting rail comes apart into
    an inner rail, a middle rail and an outer rail. Pages 11 to 13: the inner rail hangs on the
    chassis pins, the outer rail clips to the posts, and the middle rail is pulled out to its
    locked position before the chassis is slid in.
  size: >-
    datasheet - the same guide, section 3.1 Accessory List, page 5, item 8 (Adjustable Mounting
    Rail, for 4 post), prints the whole assembly as 30.4 x 1.7 x 0.9 inches (771 x 44 x 22mm),
    3.5 lb (1.589 kg) a set. The millimetres are the guide's own. The guide does not name the
    axes. 771 is read as the length, which is the depth `d`. 44 is read as the height and 22 as
    the width, so the section is a rail seen end on. No member is dimensioned. See the kit's
    `gaps`.
skins: [default]
