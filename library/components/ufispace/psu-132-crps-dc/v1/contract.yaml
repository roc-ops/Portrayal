    - node: rotor-grille
      vent: 25
      confidence: estimated
      source: >-
        ufispace/psu-132-crps-dc@1 - nothing in the HIG dimensions anything off the
        face. Same treatment as its AC sibling.
    - node: rotor-bulge
      dome: 3.0
      confidence: estimated
      source: >-
        ufispace/psu-132-crps-dc@1 - unsourced; the impeller stands slightly behind
        the frame in HIG Figure 6's isometric.
    - node: handle
      out: 3.5
      confidence: estimated
      source: >-
        ufispace/psu-132-crps-dc@1 - the pull bar stands off the face in HIG Figure
        6's isometric; nothing dimensions it.
    - node: dc-input
      out: 2.0
      confidence: estimated
      source: >-
        ufispace/psu-132-crps-dc@1 - the terminal block and its hinged cover stand
        proud of the face (they have to, to be flipped open), by an amount no
        document gives.
    - node: latch
      out: 1.2
      confidence: estimated
      source: >-
        ufispace/psu-132-crps-dc@1 - the latch is pressed to release (HIG section 7)
        so it must stand proud; nothing dimensions it.
    - node: status-led
      dome: 0.4
      confidence: estimated
      source: >-
        ufispace/psu-132-crps-dc@1 - unsourced. Same 0.4 estimate as the other
        UfiSpace FRUs.
