<svg xmlns="http://www.w3.org/2000/svg" width="68mm" height="40.6mm" viewBox="0 0 68 40.6">
  <defs>
    <pattern id="perf302" width="2.0" height="2.0" patternUnits="userSpaceOnUse">
      <circle cx="1.0" cy="1.0" r="0.68" fill="#101315"/>
    </pattern>
  </defs>
  <rect id="body" x="0" y="0" width="68" height="40.6" rx="0.6" fill="#b9bec4" stroke="#7d848c" stroke-width="0.4"/>
  <g id="vent-field">
    <rect x="1.2" y="17.2" width="16.4" height="21.8" fill="url(#perf302)"/>
    <rect x="53.6" y="1.6" width="13.2" height="37.4" fill="url(#perf302)"/>
    <rect x="19.8" y="30.2" width="33.0" height="8.8" fill="url(#perf302)"/>
  </g>
  <!-- The handle is raised to the end of the drawing (it has a `uhandle`), so it would
       paint over the grip drawn inside it. The grip's outline is an evenodd HOLE in it
       instead, and the grip shows through however late the handle paints. -->
  <path id="handle" fill-rule="evenodd" fill="#1d2023"
        d="M 15.1 29.8 H 52.5 A 3.6 3.6 0 0 1 56.1 33.4 V 33.9 A 3.6 3.6 0 0 1 52.5 37.5
           H 15.1 A 3.6 3.6 0 0 1 11.5 33.9 V 33.4 A 3.6 3.6 0 0 1 15.1 29.8 Z
           M 15.8 31.8 H 51.8 A 1.8 1.8 0 0 1 53.6 33.6 V 33.7 A 1.8 1.8 0 0 1 51.8 35.5
           H 15.8 A 1.8 1.8 0 0 1 14.0 33.7 V 33.6 A 1.8 1.8 0 0 1 15.8 31.8 Z"/>
  <rect id="handle-grip" x="14.0" y="31.8" width="39.6" height="3.7" rx="1.8" fill="#2b2f33"/>
  <rect id="clip" x="62.0" y="10.1" width="5.5" height="16.7" rx="1.4" fill="#c22f2f"/>
  <rect id="input-led" x="4.7" y="3.9" width="2.6" height="2.6" rx="1.3" fill="var(--led-color, #3a3f44)"/>
  <rect id="output-led" x="4.7" y="11.4" width="2.6" height="2.6" rx="1.3" fill="var(--led-color, #3a3f44)"/>
</svg>
