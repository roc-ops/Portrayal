<svg xmlns="http://www.w3.org/2000/svg" width="22.0mm" height="22.6mm" viewBox="0 0 22.0 22.6">
  <!-- The cable connector of the PSU-242-DEERN seen from the wire side, seated: the body at the connector's outline and one wire entering each of
       the six ways, the upper row "V+" and the lower "V-" as the supply prints them. The pull handle is not drawn. -->
  <rect id="body" x="0" y="0" width="22.0" height="22.6" rx="0.8" fill="#2a2d31" stroke="#15171a" stroke-width="0.4"/>
  <g id="wires-upper" stroke="#4a4d52" stroke-width="0.12">
    <circle id="wire-1" cx="4.6" cy="5.6" r="2.0" fill="#1c1c1c" data-fill-from="wire-v-plus-color"/>
    <circle id="wire-2" cx="11.0" cy="5.6" r="2.0" fill="#1c1c1c" data-fill-from="wire-v-plus-color"/>
    <circle id="wire-3" cx="17.4" cy="5.6" r="2.0" fill="#1c1c1c" data-fill-from="wire-v-plus-color"/>
  </g>
  <g id="wires-lower" stroke="#4a4d52" stroke-width="0.12">
    <circle id="wire-4" cx="4.6" cy="17.0" r="2.0" fill="#c8262c" data-fill-from="wire-v-minus-color"/>
    <circle id="wire-5" cx="11.0" cy="17.0" r="2.0" fill="#c8262c" data-fill-from="wire-v-minus-color"/>
    <circle id="wire-6" cx="17.4" cy="17.0" r="2.0" fill="#c8262c" data-fill-from="wire-v-minus-color"/>
  </g>
</svg>
