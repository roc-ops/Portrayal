format: 1
kind: module
name: psu-162-dc
version: 2.0.0
class: psu
behaviour: fills
profile: networking
description: UfiSpace PSU-162-DESR 1600W -48V DC PSU (S9600-30DX) - shares the AC
  unit's face, silver mesh intake grille, bail handle, lamp and latch, with a
  two-post DC terminal block in place of the appliance inlet; exhaust airflow
size: {w: 50.5, h: 40.0}
size-confidence: {w: datasheet, h: datasheet}
size-notes: >-
  both axes from the S9600-30DX HIG's Component Physical Information table, 50.5 x 360 x 40 mm
  (provenance `size`).
attrs: {power-output-w: 1600, input: dc, model: PSU-162-DESR, airflow: exhaust, inlet: dc-terminal}
provenance:
  inlet-token: >-
    transcribed from this contract's own description: 'a two-post DC terminal block in place
    of the appliance inlet'. Nothing new was measured.
  power: >-
    datasheet - UfiSpace states the rating in the part number's own ordering line:
    'Power Supply Types PSU-162-DESR, 1600W DC, exhaust air flow', beside its AC sibling
    'PSU-162-AESR, 1600W AC, exhaust air flow'. This sentence has the same shape as
    ufispace/psu-162-ac's because both are the same document's ordering block, not
    because one was copied from the other - the two rows are different lines with
    different part numbers. No ambient is stated, so none is recorded.
  size: >-
    HIG - the Component Physical Information table gives the PSU 50.5 x 360 x 40 mm
    (W x D x H), and the face here is the 50.5 x 40. Note the face is the same as the
    400 W PSU-401 this vendor uses in its 1RU boxes; what differs is the 360 mm body,
    nearly twice as deep, which is where the extra 1200 W lives.
  layout: >-
    drawing - HIG Figure 7's rear elevation (fig-0012) at 3.115 px/mm, positions
    relative to the face's own top-left: silver mesh grille filling the left 40% under a
    curved red bail handle, green status lamp at the grille's top-left corner, the C20
    aperture at x 24.0-43.6 spanning nearly the full face height, and the red release
    latch straddling the right edge. The bail handle is drawn as a rounded bar rather
    than the curved tube the figure shows, which is this library's convention for the
    vendor's handles and is NOT the shape of the part.
  inlet: >-
    The terminal block's place on the face is NOT DRAWN FROM A FIGURE OF THIS PART. No held
    figure gives this face in elevation: HIG Figure 7's rear elevation and every product
    render show the AC unit with its appliance inlet, and the guide's DC section draws the
    block in isometric only (see `block`). The face here is the AC unit's, measured, with
    the DC terminal block drawn on the inlet's own footprint, widened to hold the pair of
    screws of each pole (see `block`). Where the block stands on the face is inferred, not
    measured; see the device's dc-psu-face gap.
  block: >-
    estimated - the block is drawn from the UfiSpace S9600-30DX Hardware Installation
    Guide, section 9.1 Connecting Power (DC version), Figures 25 and 26 (PDF pages 23 and
    24), which show it in isometric with no elevation and no scale: a dark housing under a
    clear plastic cover that is pushed open from its top or bottom edge, two poles one
    above the other with a barrier between them, and two screws side by side on each pole
    (four in all), the black cable marked -40 to -72 on the upper pole and the red RTN
    cable on the lower. The block's own spacing is printed nowhere. Each pole's screws
    stand 5/8 in. (15.875 mm) apart, read from the lug the guide dimensions (Figure 22, PDF
    page 22, a Pencom EL1048 6 STR CU two-hole lug, hole centres .65/.61 in., that is
    16.5 to 15.5 mm, a range that holds 5/8 in.). The box of the block (22.6 across, 4.0
    down, 20.9 by 32.0 mm), the two rows (12.0 and 28.0 down, 16.0 apart) and the screws'
    ring size are estimates; the block is wider than the 19.0 mm the first drawing gave it,
    to hold the pair, and stays clear of the grille and the edge strip. The first drawing
    (version 1) put one pad in each row and printed '+' above '-' beside it, which the
    figures do not show and which stood the wrong way round (the upper pole takes the
    negative range); version 2 draws neither. The colours are the library's own for this
    family, not read from a figure: the figures are CAD pictures with a grey-blue body.
  seats: >-
    estimated - each pole is juniper/mx240-dc-pole@1, a pair of studs on 5/8 in. centres
    that one two-hole lug lands across, standing so that the pair's middle is the middle of
    the two screws this skin draws in its row (centres 25.11 and 40.985 across, 12.0 and
    28.0 down). The pole's own screw heads, 3.4 across, and the height it presents at (10.6
    above the block's base, from its own estimate for a Juniper stud) are Portrayal's
    stand-ins, not UfiSpace's: the guide shows low pan-head screws with square washers and
    gives no height. The drawing marks where a lug lands and does not show the screw. The
    guide's lug is bent at a right angle (Figure 22, 95 to 85 degrees), which the library's
    straight generic/two-hole-lug-5-8@1 stands in for; no document gives the lug's maker
    drawing for this block beyond that figure. The height of the pair off the face is
    estimated and each device that seats this supply carries a dc-terminal-height gap that
    names the drawing wanted.
  poles: >-
    UfiSpace S9600-30DX Hardware Installation Guide, section 9.1 Connecting Power (DC
    version), step 3 and Figure 25 (PDF page 23): the two-hole lug of the black cable
    marked '-40 to -72' goes on the upper pole and that of the red cable marked 'RTN' on
    the lower, the plastic cover opened from its top or bottom edge. The roles are the
    markings': `batt` for the negative voltage range (spec/schemas/dc.yaml writes `batt` as
    -48V and negative (battery)) and `rtn` for RTN. The port has two poles, upper pole
    first, as the figure stands with the face seen as the figure shows it. No document
    states a nominal voltage: the guide prints a range, -40V to -72V (step 5).
  rating: >-
    datasheet - 'DC input: -40 to -72V, 50A' in the S9600-30DX, S9600-32X and S9600-64X
    datasheets, the three devices that seat this supply, the same figure in all three. The
    range has no nominal, so the port states no voltage. The guide's step 5 adds a built-in
    60A fast acting fuse; that is the fuse and not the input current.
  awg: >-
    UfiSpace S9600-30DX, S9600-32X and S9600-64X Hardware Installation Guides, section 9.1
    (DC version) step 2: a 'UL 1015, 6 AWG DC power cable' of stranded copper, attached to a
    two-hole lug. One size in every guide held for this supply, so the port states it. The
    torque the S9600-30DX guide prints, 14.0 +/- 0.5 kgf.cm, is not stated by the port.
  led-states: >-
    NOT TABLED FOR THIS PLATFORM. The S9600-30DX HIG has no PSU FRU LED table - unlike
    the S9500-30XS and S9510-28DC guides. The lamp is drawn because Figure 7 draws it,
    and it keeps a plain off/on vocabulary rather than borrowing another platform's
    table; see the device's fru-led-semantics gap.
elements:
  handle: {at: [10.5, 3.0], size: [8.0, 34.0], class: handle}
  latch: {at: [44.0, 2.0], size: [5.5, 14.0], class: latch}
  dc-input: {at: [22.6, 4.0], size: [20.9, 32.0], class: inlet}
  status-led:
    at: [7.0, 3.4]
    size: [3.0, 3.0]
    class: led
    states: ['off', 'on']
    description: >-
      Present in HIG Figure 7 and given no table anywhere in this guide, so the states
      are the component default rather than a vocabulary borrowed from another platform
relief:
  features:
    - node: mesh-grille
      vent: 25
      confidence: estimated
      source: >-
        ufispace/psu-162-dc@2 - the HIG dimensions the face and the body length and
        nothing off the face.
    - node: handle
      uhandle: 30
      confidence: datasheet
      source: >-
        UfiSpace S9600-30DX HIG, Space Clearance: 'the handle for the power supplies
        will extend outwards by 1.19 inches (3cm)'. 30 mm, published by the vendor for
        this module.
    - node: latch
      out: 1.2
      confidence: estimated
      source: >-
        ufispace/psu-162-dc@2 - the latch is pressed to release; nothing dimensions it.
    - node: status-led
      dome: 0.4
      confidence: estimated
      source: ufispace/psu-162-dc@2 - unsourced, as for the vendor's other FRUs.
    - node: dc-input
      out: 8
      confidence: estimated
      source: >-
        ufispace/psu-162-dc@2 - the terminal block stands proud under its cover; no
        held figure dimensions it and none shows this face in elevation. Version 1 gave
        0.8; this follows the 8 mm that ufispace/psu-202-dc and the PSU-201 and PSU-401
        families carry for the same style of block.
parts:
  - {ref: juniper/mx240-dc-pole@1, id: pole-batt, at: [23.41, 10.3]}
  - {ref: juniper/mx240-dc-pole@1, id: pole-rtn, at: [23.41, 26.3]}
dc:
  ports:
