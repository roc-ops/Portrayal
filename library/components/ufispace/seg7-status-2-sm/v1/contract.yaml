format: 1
kind: component
name: seg7-status-2-sm
version: 1.1.1
class: display
profile: networking
description: Two-digit seven-segment status display in a dark bezel, the small
  12.8 x 6.8 mm size UfiSpace prints under the model name on the S9610-36D
  faceplate - both digits drawn showing all segments and both decimal points, as
  the vendor's own artwork draws them
size: {w: 12.8, h: 6.8}
provenance:
  size: >-
    photo-measured - UfiSpace S9610-36D vendor front elevation
    (the vendor's front gallery image of the S9610-36D), whose body measures
    1668 x 337 px against the datasheet's 436 x 87.7 mm chassis: aspect 4.9496
    against a true 4.9715, 0.44% out, so it is orthographic and reads at 3.826 px/mm
    across and 3.842 px/mm down. The near-black bezel measures x 4.70-17.51 and
    y 16.66-23.43 on the faceplate, so 12.81 x 6.77. Cross-checked against HIG
    Figure 9a (fig-0017, 2.734 px/mm), which draws the same bezel in the same place
    at the same proportion.
  why-not-seg7-status-2: >-
    This is a SECOND part, not a re-measurement of ufispace/seg7-status-2@1. That
    contract is 17.2 x 9.5, measured on the S9600-72XC at 9.585 px/mm off a 600 dpi
    page render - a far better ruler than this one - and 17.2 x 9.5 against 12.8 x 6.8
    is 34% and 40%, which no measurement error at either scale can produce. It also
    would not fit here: on this faceplate the display has 8.4 mm of clear metal between
    the model-name legend and the vent slots below it, and the 9.5 mm part would print
    over both. The aspect ratios agree (1.88 here against 1.81 there), which is what
    two sizes of one display family look like.
  semantics: >-
    vendor-silent - the S9610-36D HIG names this display nowhere. Section 4's Figure 4
    overview calls out RJ45, Reset, Beacon LED, 1PPS, 10MHz, USB, System LED, Micro USB
    and the SFP and QSFP-DD ports, and stops; the Figure 4 callout that lands nearest is
    'Beacon LED', which points at this block in the overview drawing but is a lamp's name
    and not a readout's. Section 10's Verifying System Operation tables the five
    front-panel lamps (SYNC, SYS, FAN, PS0, PS1) and the PSU and Fan FRU lamps and says
    nothing about a numeric display. What the two digits show - a POST code, a chassis or
    stack ID, a fault code - is therefore not stated, and no state vocabulary is claimed
    here. The artwork draws '8.8.', which is the all-segments lamp test, not a value.
    This finding is reached from the S9610-36D's own documents; it agrees with
    ufispace/seg7-status-2@1's, which was reached from the S9600-72XC's.
  colour: >-
    photo-measured - the digits are a light blue on near-black, sampled off the vendor
    front elevation. HIG Figures 8a/8b/9a/9b draw them the same way.
elements:
  digit-1:
    at: [1.3, 1.2]
    size: [3.6, 4.4]
    class: display
    description: >-
      the left digit. Its states are the characters a seven-segment cell can form, each naming the segments it lights - a top, b top-right, c bottom-right, d bottom, e bottom-left, f top-left, g middle. The drawing's own face is '0'.
    states: &digit-states
      - {name: '0', lights: [a, b, c, d, e, f]}
      - {name: '1', lights: [b, c]}
      - {name: '2', lights: [a, b, g, e, d]}
      - {name: '3', lights: [a, b, g, c, d]}
      - {name: '4', lights: [f, g, b, c]}
      - {name: '5', lights: [a, f, g, c, d]}
      - {name: '6', lights: [a, f, g, e, c, d]}
      - {name: '7', lights: [a, b, c]}
      - {name: '8', lights: [a, b, c, d, e, f, g]}
      - {name: '9', lights: [a, b, c, d, f, g]}
      - {name: 'a', lights: [a, b, c, e, f, g]}
      - {name: 'b', lights: [f, g, e, c, d]}
      - {name: 'c', lights: [a, f, e, d]}
      - {name: 'd', lights: [b, g, e, c, d]}
      - {name: 'e', lights: [a, f, g, e, d]}
      - {name: 'f', lights: [a, f, g, e]}
      - {name: 'blank', lights: []}
  digit-2:
    at: [7.4, 1.2]
    size: [3.6, 4.4]
    class: display
    description: >-
      the right digit. Its states are the characters a seven-segment cell can form, each naming the segments it lights - a top, b top-right, c bottom-right, d bottom, e bottom-left, f top-left, g middle. The drawing's own face is '0'.
    states: *digit-states
  point-1:
    at: [5.3, 5.4]
    size: [0.6, 0.6]
    class: display
    description: >-
      the left digit's decimal point, driven separately from the digit as it is on the part. Unlit in the drawing, which is why the face reads '00' and not the vendor artwork's '8.8.'
    states:
      - {name: 'on', lights: [dp]}
      - {name: 'off', lights: []}
  point-2:
    at: [11.4, 5.4]
    size: [0.6, 0.6]
    class: display
    description: >-
      the right digit's decimal point, driven separately from the digit as it is on the part. Unlit in the drawing, which is why the face reads '00' and not the vendor artwork's '8.8.'
    states:
      - {name: 'on', lights: [dp]}
      - {name: 'off', lights: []}
skins: [default]
