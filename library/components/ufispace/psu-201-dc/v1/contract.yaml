format: 1
kind: module
name: psu-201-dc
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: UfiSpace PSU-201-DISB 200W DC PSU - screw-terminal block, blue
  release latch, black tube handle, status LED (M3000-14XC fronthaul family)
size: {w: 50.5, h: 40.2}
attrs: {power-output-w: 200, input: dc, model: PSU-201-DISB, inlet: dc-terminal}
provenance:
  inlet: >-
    transcribed from this contract's own description: 'screw-terminal block', drawn here as
    the `terminal-block` element. Nothing new was measured.
  power: >-
    datasheet - the M3000-14XC datasheet's accessory list states the rating in the part
    number's own ordering line: 'PSU-201-DISB, 200W DC PSU, intake air flow', beside the AC
    sibling 'PSU-201-AISB, 200W AC PSU, intake air flow'. Consistent with the HIG's
    provisioning instruction, 'a reserve of at least 200 watts on each power circuit'.
    READ THE DEVICE GAP BEFORE REUSING THIS NUMBER: the HIG's Figure 5 callout prints
    '2 x 120W AC or DC PSU' for these same bays - recorded on the m3000-14xc device as a
    sources-disagree gap. The 200 W ordering line is carried here because it names this
    exact part number. DC input -36 to -75 V, 8 A max (datasheet); built-in 20 A fast-acting
    fuse (HIG Connecting Power, DC version).
  size: >-
    HIG - Component Physical Information table, 'PSU (W x D x H) 1.99 x 8.31 x 1.58 in
    (50.5 x 211 x 40.2 mm)', and the Fig 6 drawing (50.5 x 40.2 face, 211 mm body, 221 mm
    over the handle). Weight 1.48 lb (672.2 g), same table.
  art: >-
    borrowed - face layout (latch, hex vent field, three-pole terminal block, tube handle,
    lamp) copied from ufispace/psu-401-dc@1, whose art was drawn from the S9510-28DC HIG.
    The M3000-14XC HIG's Fig 6 drawing and the front photograph show the same construction
    at the same 50.5 x 40.2 face; element positions were not re-measured against this
    family's drawing beyond that visual match.
  led-states: HIG section 10, PSU FRU LED table (page 21), transcribed in full
  seats: >-
    estimated - each terminal screw is the library's common/terminal-screw-34@1, a screw head
    3.4 across (that part's own size is an estimate), standing at the centre of the clamp screw
    this skin already draws (centres 11.3, 20.9, 30.5 across, 29.2 down) and lifted 8.0 mm, this
    block's own estimated proudness. The head is drawn smaller than the ring round it, and
    smaller than the screw: the guides name M3.5 screws (the M3000-14XC Hardware Installation
    Guide, section 9 (DC version), Figure 23 (PDF page 20); the S9500-22XST, S9501-18SMT and
    S9501-28SMT guides print the same figure), and an M3.5 thread is wider than that head, so
    the drawing marks where a lug lands and does not show the screw. The same figure gives a lug
    hole over 3.5 mm and a lug no wider than 8.2 mm (W < 8.2 mm). No document held gives the
    screw head, the stud length or the spacing of the screws; the spacing is this skin's own.
  poles: >-
    UfiSpace M3000-14XC Hardware Installation Guide, section 9 Connecting Power (DC version),
    Figure 24 (PDF page 21): the supply's face with the legend printed under its three terminal
    screws, 'RTN', a negative voltage range (-36 to -75 V as the picture reads) and the earth
    symbol, a lug and wire under each, and the label 'Green/Yellow Grounding Wire (min. size 14
    AWG)' at the right-hand one. The S9500-22XST, S9501-18SMT and S9501-28SMT guides print the
    same figure (Figure 24, PDF page 20). The roles are the legend's, left to right as this
    skin's face stands, latch on the left: `rtn` for RTN, `batt` for the negative voltage range
    (spec/schemas/dc.yaml writes `batt` as -48V or negative (battery)) and `gnd` for the earth
    symbol (it writes `gnd` as the earth symbol). The earth terminal is the third pole of the
    port and is not a conductor of a feed. No document held gives a nominal voltage.
  rating: >-
    datasheet - 'DC input: -36 to -75V, 8A' in the datasheets of the S9500-22XST, S9501-18SMT
    and S9501-28SMT and 'DC input: -36 ~ -75V, 8A' in the M3000-14XC datasheet. The 8 A is the
    input current. The range has no nominal in any of them, and a port's `voltage` needs one, so
    the port states no voltage. The guides add a built-in 20A fast acting fuse; that is the
    fuse, not the input current.
  awg: >-
    UfiSpace M3000-14XC Hardware Installation Guide, section 9 step 2 (PDF page 20): a 'UL 1015,
    14 AWG DC power cable' of stranded copper for the screw-type terminal block; the
    S9500-22XST, S9501-18SMT and S9501-28SMT guides say the same; the earth wire of the legend
    figure is labelled 'min. size 14 AWG'. One size in every guide held for this supply, so the
    port states it.
elements:
  status-led:
    at: [44.2, 2.2]
    size: [3.2, 3.2]
    class: led
    states: ['off',
             {name: ok, color: '#22c55e'},
             {name: fail, color: '#ef4444'},
             {name: standby, color: '#22c55e', behavior: blinking},
             {name: no-dc, color: '#ef4444', behavior: blinking},
             {name: warning, color: '#22c55e', behavior: {mode: alternating, color: '#ef4444'}}]
    description: >-
      HIG PSU FRU LED table - Off (no DC power to any PSU), Green (PSU DC output on and
      OK), Red (PSU failure), Flashing Green (DC present, only standby output on -
      poor contact), Flashing Red (no DC power to this PSU), Flashing between Green
      and Red (warning: working condition not satisfied, check voltage, current and
      temperature)
  latch: {at: [0.6, 4.5], size: [3.6, 14.0], class: latch}
  handle: {at: [38.6, 6.0], size: [3.4, 26.0], class: handle}
  terminal-block: {at: [5.8, 21.0], size: [30.2, 16.5], class: inlet}
relief:
  features:
    - node: latch
      out: 2.2
      confidence: estimated
      source: >-
        ufispace/psu-201-dc@1 - the M3000-14XC HIG's Fig 6 drawing dimensions the face, the
        body depth and the handle projection, and nothing else off the face. This magnitude
        is not in it; same estimate as ufispace/psu-401-dc@1, from which the art is copied.
    - node: handle
      uhandle: 10
      confidence: drawing
      source: >-
        M3000-14XC HIG Fig 6 drawing - the bottom elevation dimensions the module at 211 mm
        to the face and 221 mm over the handle, so the tube handle stands 10 mm proud of
        this module's own face. NOT the 27 mm of ufispace/psu-401-dc@1, which is the
        S9510-28DC family's published clearance for a different handle.
    - node: terminal-block
      out: 8
      confidence: estimated
      source: >-
        ufispace/psu-201-dc@1 - unsourced. The HIG dimensions the face and depth only; the
        terminal block's projection is not in it. Same estimate as ufispace/psu-401-dc@1.
    - node: status-led
      dome: 0.4
      confidence: estimated
      source: >-
        ufispace/psu-201-dc@1 - unsourced. The HIG's PSU FRU LED table gives the lamp's
        states and nothing about its lens. Same estimate as the psu-401 family.
    - node: vent-field
      vent: 30
      confidence: estimated
      source: >-
        ufispace/psu-201-dc@1 - unsourced open-area fraction; the HIG's drawing shows the
        hex field without dimensioning it. Same estimate as the psu-401 family.
connection-points:
  power: {at: [20.9, 29], direction: front}
parts:
  - {ref: common/terminal-screw-34@1, id: pole-rtn, at: [9.6, 27.5], lift: 8.0}
  - {ref: common/terminal-screw-34@1, id: pole-batt, at: [19.2, 27.5], lift: 8.0}
  - {ref: common/terminal-screw-34@1, id: pole-gnd, at: [28.8, 27.5], lift: 8.0}
dc:
  ports:
    - id: input
      direction: input
      rating-a: 8
      awg: [14]
      poles:
        - {role: rtn, slot: pole-rtn}
        - {role: batt, slot: pole-batt}
        - {role: gnd, slot: pole-gnd}
      source: {poles: poles, rating-a: rating, awg: awg}
skins: [default]
