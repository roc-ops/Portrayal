<svg xmlns="http://www.w3.org/2000/svg" width="9.3mm" height="11.5mm" viewBox="0 0 9.3 11.5">
  <!-- The four-position DC housing: black body, two rows of two square cells, the cells a darker black. -->
  <rect id="body" x="0" y="0" width="9.3" height="11.5" rx="0.4" fill="#1b1b1d" stroke="#3a3b3e" stroke-width="0.2"/>
  <g id="cells" fill="#050506" stroke="#4a4b4f" stroke-width="0.12">
    <rect x="1.2" y="2.4" width="3.1" height="3.2" rx="0.2"/>
    <rect x="5.0" y="2.4" width="3.1" height="3.2" rx="0.2"/>
    <rect x="1.2" y="6.2" width="3.1" height="3.2" rx="0.2"/>
    <rect x="5.0" y="6.2" width="3.1" height="3.2" rx="0.2"/>
  </g>
</svg>
