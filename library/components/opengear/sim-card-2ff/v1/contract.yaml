format: 1
kind: component
name: sim-card-2ff
version: 1.0.0
class: port
mates: sim-card-2ff
profile: networking
description: >-
  A mini (2FF) SIM card, the carrier's card that goes into the SIM slots of the Opengear ACM7000 cellular models.
  It is seen from the face it is pushed in from, a narrow card edge. It is not shipped with the gateway.
size: {w: 15.0, h: 0.8}
size-confidence: {w: estimated, h: estimated}
attrs: {media: sim, form-factor: 2ff}
unplaced: seated by configurations downstream of this library; see docs/pluggables-design.md decision 2
provenance:
  size: >-
    estimated - no drawing of the card is held. The quick starts say only "mini SIM" and give no dimension. 15.0
    by 0.8 is a card edge that fits the 17.3 mm slot bar of opengear/sim-slot-2ff@1.
  identity: >-
    datasheet and quick start - the ACM7000 data sheet lists the SIM slots by model, two on the -L models. The
    quick starts say "slide your carrier-provided mini SIM into the SIM slot with contacts facing up".
  mate: >-
    estimated - the centre of the card edge, on the slot's own mate point.
  card: >-
    A DECLARED STAND-IN. The SIM card is not an Opengear part and no drawing of one is held.
elements: {}
connection-points:
  mate: {at: [7.5, 0.4], direction: front}
skins: [default]
