format: 1
kind: component
name: acm7000-dio-header
version: 1.0.0
class: port
profile: networking
interface: opengear-acm-dio-block-8
description: >-
  The digital I/O header on the rear of the Opengear ACM7004-2-L gateway. It is a black housing with eight
  positions in a row, printed DC O2 G O1 G I2 G I1. The black terminal block that ships in the box plugs into it.
size: {w: 22.4, h: 5.7}
size-confidence: {w: photo-measured, h: photo-measured}
attrs:
  media: acm7000-dio-block
  positions: 8
provenance:
  sources: >-
    photo-measured and datasheet. The ACM7004-2-L rear photograph of the Resilience Gateway Quick Start Guide
    (06052019), page 2, is read at 8.3 pixels per millimetre. It gives the outline and the eight
    positions. The ACM7000 data sheet (October 02, 2026), Interfaces, "I/O Ports", gives the digital inputs and outputs.
  size: >-
    photo-measured - 185 pixels across and 47 down on that photograph, good to about 0.5 mm. No document gives a
    dimension for the header.
  positions: >-
    printed - the rear prints DC, O2, G, O1, G, I2, G and I1 under the eight positions, left to right. The data sheet
    says "2 x TTL level Digital I/O ports (DIO) 5V DC max @ 20mA". It also lists "2 High Voltage Digital Outputs
    (HVDO) 5-30V DC@ 100mA". The pitch is read off the photograph at about 2.7 mm. No document states it, so the key claims none.
  part: >-
    A DECLARED STAND-IN FOR THE PART. NO MAKER, SERIES OR PART NUMBER IS NAMED FOR THE HEADER. The quick start guide
    calls the plug "Digital I/O converter (terminal block)" and "Black terminal block" and says it is not sold
    separately.
  colour: photo-measured - a black housing with a darker opening at each position.
  mate: >-
    derived - the centre of the housing, (11.2, 2.85), facing out. opengear/acm7000-dio-plug@1 is the part that
    mates it.
  depth: >-
    NOT STATED. No document gives how far the header stands out of the rear, so the part draws a plan outline only
    and builds no relief.
elements:
  body: {at: [0.0, 0.0], size: [22.4, 5.7], class: connector}
connection-points:
  mate: {at: [11.2, 2.85], direction: front}
skins: [default]
