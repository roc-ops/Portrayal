    <rect x="3.5" y="1.0" width="1.9" height="3.2" rx="0.15"/>
    <rect x="6.2" y="1.0" width="1.9" height="3.2" rx="0.15"/>
    <rect x="8.9" y="1.0" width="1.9" height="3.2" rx="0.15"/>
    <rect x="11.6" y="1.0" width="1.9" height="3.2" rx="0.15"/>
    <rect x="14.3" y="1.0" width="1.9" height="3.2" rx="0.15"/>
    <rect x="17.0" y="1.0" width="1.9" height="3.2" rx="0.15"/>
    <rect x="19.7" y="1.0" width="1.9" height="3.2" rx="0.15"/>
  </g>
</svg>
