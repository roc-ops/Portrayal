<svg xmlns="http://www.w3.org/2000/svg" width="9.3mm" height="11.5mm" viewBox="0 0 9.3 11.5">
  <!-- Stand-in for the supply's four-chamber connector: a black body with four contacts. -->
  <rect id="body" x="0" y="0" width="9.3" height="11.5" rx="0.4" fill="#2a2b2e" stroke="#4a4b4f" stroke-width="0.2"/>
  <g id="contacts" fill="#c9a86a">
    <circle cx="2.75" cy="4.0" r="0.9"/>
    <circle cx="6.55" cy="4.0" r="0.9"/>
    <circle cx="2.75" cy="7.8" r="0.9"/>
    <circle cx="6.55" cy="7.8" r="0.9"/>
  </g>
</svg>
