<svg xmlns="http://www.w3.org/2000/svg" width="13.7mm" height="10.3mm" viewBox="0 0 13.7 10.3">
  <!-- The cable connector of the OSA 542x -48 VDC supply seen from the wire side, seated: the body at the header's outline,
       the release tab on its top edge, and one wire entering each of the three ways, "-", Gnd and "+" left to right. -->
  <rect id="tab" x="4.8" y="0" width="3.8" height="5.0" rx="0.4" fill="#3b3f44"/>
  <rect id="body" x="0" y="4.8" width="13.7" height="5.5" rx="0.5" fill="#2a2d31" stroke="#15171a" stroke-width="0.2"/>
  <circle id="wire-1" cx="2.5" cy="7.45" r="1.3" fill="#c8262c" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-1-color"/>
  <circle id="wire-2" cx="6.9" cy="7.45" r="1.3" fill="#5a9e3c" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-2-color"/>
  <circle id="wire-3" cx="11.3" cy="7.45" r="1.3" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-3-color"/>
</svg>
