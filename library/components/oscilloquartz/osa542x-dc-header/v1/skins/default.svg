<svg xmlns="http://www.w3.org/2000/svg" width="13.7mm" height="10.3mm" viewBox="0 0 13.7 10.3">
  <!-- The OSA 542x -48 VDC supply's power header seen from its mating face: the release-tab key above the body, the body, and
       three square contact cells in a row with a contact in each. Shapes and colours are those the supply's own skin drew
       before it composed this part (read off the data sheet render). -->
  <rect id="key" x="4.8" y="0" width="3.8" height="5.0" rx="0.4" fill="#2a2d31"/>
  <rect id="body" x="0" y="4.8" width="13.7" height="5.5" rx="0.5" fill="#6a6f75" stroke="#3b3f44" stroke-width="0.2"/>
  <g id="cells" fill="#1b1d20">
    <rect x="1.0" y="5.65" width="3.0" height="3.6" rx="0.3"/>
    <rect x="5.4" y="5.65" width="3.0" height="3.6" rx="0.3"/>
    <rect x="9.8" y="5.65" width="3.0" height="3.6" rx="0.3"/>
  </g>
  <g id="contacts" fill="#9a9fa5">
    <rect x="1.9" y="6.85" width="1.2" height="1.2"/>
    <rect x="6.3" y="6.85" width="1.2" height="1.2"/>
    <rect x="10.7" y="6.85" width="1.2" height="1.2"/>
  </g>
</svg>
