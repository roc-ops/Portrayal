<svg xmlns="http://www.w3.org/2000/svg" width="113.5mm" height="20.6mm" viewBox="0 0 113.5 20.6">
  <!-- OSA GE-4S expansion card faceplate, 113.5 x 20.6, off the 2023 data sheet p6
       image at 2.75 px/mm. The lamps and the four SFP cages are composed parts;
       the frame (plate, notches, thumbscrew, tab) is the HD cards' frame. -->
  <rect id="plate" x="0.1" y="0.1" width="113.3" height="20.4" rx="0.4" fill="#dcdee1" stroke="#6b7076" stroke-width="0.2"/>
  <rect x="7.2" y="0" width="1.5" height="0.9" fill="#15171a"/>
  <rect x="7.2" y="19.7" width="1.5" height="0.9" fill="#15171a"/>
  <g id="thumbscrew">
    <circle cx="3.3" cy="12.35" r="3.2" fill="#c9cdd1" stroke="#7a7f85" stroke-width="0.25"/>
    <circle cx="3.3" cy="12.35" r="2.6" fill="none" stroke="#9ca1a6" stroke-width="0.5" stroke-dasharray="0.3 0.3"/>
    <path d="M 1.9 12.35 L 2.6 11.1 H 4.0 L 4.7 12.35 L 4.0 13.6 H 2.6 Z" fill="#e2e5e8" stroke="#8a8f95" stroke-width="0.2"/>
  </g>
  <g id="vents" fill="#2b2f33">
    <circle cx="10.5" cy="6.4" r="0.9"/><circle cx="16.3" cy="6.4" r="0.9"/><circle cx="22.1" cy="6.4" r="0.9"/>
    <circle cx="13.4" cy="8.9" r="0.9"/><circle cx="19.2" cy="8.9" r="0.9"/><circle cx="25.0" cy="8.9" r="0.4"/>
    <circle cx="10.5" cy="11.4" r="0.9"/><circle cx="16.3" cy="11.4" r="0.9"/><circle cx="22.1" cy="11.4" r="0.9"/>
    <circle cx="13.4" cy="13.9" r="0.9"/><circle cx="19.2" cy="13.9" r="0.9"/>
    <circle cx="10.5" cy="15.4" r="0.5"/><circle cx="16.3" cy="15.4" r="0.5"/><circle cx="22.1" cy="15.4" r="0.5"/>
  </g>
  <rect id="cage-block" x="43.6" y="5.1" width="61.1" height="10.9" rx="0.3" fill="#8f949a" stroke="#5c6167" stroke-width="0.2"/>
  <g id="handle">
    <rect x="105.3" y="0.55" width="7.0" height="19.25" rx="1.3" fill="#e3e5e8" stroke="#8d9298" stroke-width="0.2"/>
    <rect x="106.5" y="1.8" width="4.6" height="16.75" rx="1.1" fill="#d3d6da"/>
  </g>
  <g id="silkscreen" font-family="Helvetica, Arial, sans-serif" font-style="italic" fill="#26407a">
    <text x="1.8" y="3.6" font-size="2.4" font-weight="bold">OSA GE-4S</text>
    <text x="28.4" y="4.9" font-size="1.5" text-anchor="middle">PWR</text>
    <text x="28.4" y="16.6" font-size="1.5" text-anchor="middle">STA</text>
    <text x="34.2" y="4.9" font-size="1.5" text-anchor="middle">1</text>
    <text x="39.3" y="4.9" font-size="1.5" text-anchor="middle">2</text>
    <text x="34.2" y="16.6" font-size="1.5" text-anchor="middle">3</text>
    <text x="39.3" y="16.6" font-size="1.5" text-anchor="middle">4</text>
    <text x="51.3" y="4.5" font-size="1.6" text-anchor="middle">1</text>
    <text x="66.2" y="4.5" font-size="1.6" text-anchor="middle">2</text>
    <text x="81.1" y="4.5" font-size="1.6" text-anchor="middle">3</text>
    <text x="96.0" y="4.5" font-size="1.6" text-anchor="middle">4</text>
  </g>
</svg>
