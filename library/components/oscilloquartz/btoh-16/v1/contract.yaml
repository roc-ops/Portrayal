format: 1
kind: module
name: btoh-16
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Oscilloquartz BTOH-16 - the OSA 542x BITS-OUT HD expansion card, sixteen BITS outputs
  (E1, T1/DS1 or 2.048 MHz, per output) brought out on one VHDCI high-density connector
  and fanned out to RJ-48 or BNC at a patch panel.
size: {w: 113.5, h: 20.6}
size-confidence: {w: photo-measured, h: photo-measured}
attrs:
  model: BTOH-16
  part-number: 1078904679-01
  outputs: 16
  signal: E1, T1 (DS1) or 2.048 MHz per output
groups:
  outputs:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: vhdci}
    description: >-
      ONE CONNECTOR, SIXTEEN OUTPUTS. The VHDCI carries all sixteen BITS outputs to a
      patch panel over one high-density cable (1036005401-01 or 1036005402-01), and
      the outputs are numbered 1-16 on the panel's ports, not on this face. A timing
      output is the work a grandmaster is bought to do, so the group is traffic.
provenance:
  identity: >-
    manual - OSA 5420/5421 Installation and Commissioning Manual R9.5.1 p16, "BTOH-16
    BITS-OUT HD Expansion Card", part number 1078904679-01. The same paragraph pairs it
    with the 16x BNC and 16x RJ-48C modular patch panel connectors (1047026081-01,
    1047026082-01), the fixed patch panel (1078904692-01) and the high-density cables
    1036005401-01 or 1036005402-01. The 2015 data sheet
    and the manual's Figures 3-6 letter the same card "BITS-OUT HD"; the manual's own
    Figure 8 and the 2016 and 2023 data sheets letter it BTOH-16, which is drawn.
  size: >-
    photo-measured - 2023 OSA 5420 Series data sheet p1 front render, both expansion
    bays at 3.25 px/mm: 113.5 wide x 20.6 high on a 115.6 pitch. The manual's Figure 8
    card image (p16, 1476 x 298 px) gives a plate of 1457 x 262 px, aspect 5.56 against
    5.51 from the render - a 1% agreement, which is what lets the higher-resolution
    image supply the layout at 12.8 px/mm.
  elements: >-
    photo-measured off the manual's Figure 8 at 12.8 px/mm: captive thumbscrew centred
    at (3.3, 12.35), about 7 across; PWR and STA lamps at x 19.1 on y 7.5 and 12.7 with
    their names printed to the left; the VHDCI centred at (57.5, 11.8); "16 BITS-OUT"
    beneath it; the pull tab 105.3-112.3 at the right end; and a small notch at x 7.2-8.7
    in the top and bottom edges, which the data sheet render shows as two black squares
    per card.
  lamp-states: >-
    manual - Table 2, System LEDs: PWR (Expansion Card) Off, power to LC is faulty;
    Green, power to LC is OK. "The STA functions also apply for the STA LED on a 16
    BITS OUT Expansion Card": Off, Green, Flashing-Green, Yellow, Flashing Yellow, Red.
  power: >-
    NOT STATED. Searched the manual (every "W" and "Watt" is a PSU rating) and the 2015,
    2016 and 2023 data sheets, whose power figures are for the chassis "without LC or
    SFP". No figure for any expansion card exists in the corpus.
states: [absent]
elements:
  thumbscrew: {at: [0.1, 9.15], size: [6.4, 6.4], class: fastener}
  handle: {at: [105.3, 0.55], size: [7.0, 19.25], class: handle}
parts:
  - ref: common/led-indicator@1
    id: led-pwr
    at: [17.1, 5.5]
    states: {lamp: ['off', {name: power-ok, color: '#39b54a'}]}
  - ref: common/led-indicator@1
    id: led-sta
    at: [17.1, 10.7]
    states: {lamp: ['off', {name: normal, color: '#39b54a'}, {name: initializing, color: '#39b54a', behavior: blinking}, {name: power-up, color: '#e0b21b'}, {name: loading, color: '#e0b21b', behavior: blinking}, {name: fail, color: '#d0342c'}]}
  - {ref: common/vhdci-receptacle@1, id: bits-out, at: [37.3, 9.2], group: outputs}
connection-points:
  mate: {at: [56.75, 10.3], direction: rear}
skins: [default]
