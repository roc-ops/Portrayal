<svg xmlns="http://www.w3.org/2000/svg" width="113.5mm" height="20.6mm" viewBox="0 0 113.5 20.6">
  <!-- OSA 542x IRIG-B expansion card faceplate, 113.5 x 20.6, off the 2023 data
       sheet p1 render at 3.25 px/mm. The lamps, the HD-15 aperture and the RS-422
       jack are composed parts; the BNC, the optical output and the terminal block
       have no library part and are drawn here. -->
  <rect id="plate" x="0.1" y="0.1" width="113.3" height="20.4" rx="0.4" fill="#dcdee1" stroke="#6b7076" stroke-width="0.2"/>
  <rect x="7.2" y="0" width="1.5" height="0.9" fill="#15171a"/>
  <rect x="7.2" y="19.7" width="1.5" height="0.9" fill="#15171a"/>
  <g id="thumbscrew">
    <circle cx="3.3" cy="12.35" r="3.2" fill="#c9cdd1" stroke="#7a7f85" stroke-width="0.25"/>
    <circle cx="3.3" cy="12.35" r="2.6" fill="none" stroke="#9ca1a6" stroke-width="0.5" stroke-dasharray="0.3 0.3"/>
    <path d="M 1.9 12.35 L 2.6 11.1 H 4.0 L 4.7 12.35 L 4.0 13.6 H 2.6 Z" fill="#e2e5e8" stroke="#8a8f95" stroke-width="0.2"/>
  </g>
  <g id="irig-in">
    <circle cx="22.9" cy="9.2" r="3.95" fill="#c8ccd0" stroke="#7d8288" stroke-width="0.2"/>
    <circle cx="22.9" cy="9.2" r="2.9" fill="#dfe2e5" stroke="#8d9298" stroke-width="0.2"/>
    <circle cx="22.9" cy="9.2" r="1.7" fill="#e8d7b4" stroke="#a88f5e" stroke-width="0.2"/>
    <circle cx="22.9" cy="9.2" r="0.5" fill="#6b5a3a"/>
    <rect x="22.55" y="4.9" width="0.7" height="1.2" fill="#8d9298"/>
  </g>
  <g id="optical-out">
    <circle cx="37.7" cy="9.2" r="3.7" fill="#9ea3a8" stroke="#62676d" stroke-width="0.2"/>
    <circle cx="37.7" cy="9.2" r="2.4" fill="#7c8187"/>
    <circle cx="37.7" cy="9.2" r="1.0" fill="#1b1d20"/>
  </g>
  <g fill="#d3d6da" stroke="#7d8288" stroke-width="0.2">
    <path id="post-l" d="M 46.6 8.6 L 47.6 6.87 H 49.6 L 50.6 8.6 L 49.6 10.33 H 47.6 Z"/>
    <path id="post-r" d="M 72.5 8.6 L 73.5 6.87 H 75.5 L 76.5 8.6 L 75.5 10.33 H 73.5 Z"/>
  </g>
  <g fill="#5c6167">
    <circle cx="48.6" cy="8.6" r="0.6"/>
    <circle cx="74.5" cy="8.6" r="0.6"/>
  </g>
  <g id="irig-out">
    <path d="M 53.7 4.6 H 69.9 L 68.6 12.9 H 55.0 Z" fill="#c9cdd1" stroke="#7d8288" stroke-width="0.25" stroke-linejoin="round"/>
    <path d="M 54.6 5.3 H 69.0 L 67.9 12.2 H 55.7 Z" fill="#141619"/>
    <g fill="#8a6a3a"><circle cx="57.10" cy="6.60" r="0.35"/><circle cx="59.40" cy="6.60" r="0.35"/><circle cx="61.70" cy="6.60" r="0.35"/><circle cx="64.00" cy="6.60" r="0.35"/><circle cx="66.30" cy="6.60" r="0.35"/><circle cx="58.25" cy="8.75" r="0.35"/><circle cx="60.55" cy="8.75" r="0.35"/><circle cx="62.85" cy="8.75" r="0.35"/><circle cx="65.15" cy="8.75" r="0.35"/><circle cx="67.45" cy="8.75" r="0.35"/><circle cx="57.10" cy="10.90" r="0.35"/><circle cx="59.40" cy="10.90" r="0.35"/><circle cx="61.70" cy="10.90" r="0.35"/><circle cx="64.00" cy="10.90" r="0.35"/><circle cx="66.30" cy="10.90" r="0.35"/></g>
  </g>
  <g id="alarm-pulse">
    <rect x="79.7" y="6.9" width="10.1" height="6.5" rx="0.3" fill="#6fbf4a" stroke="#3f7d2a" stroke-width="0.2"/>
    <g fill="#3f7d2a">
      <rect x="80.6" y="8.9" width="2.4" height="3.6" rx="0.2"/>
      <rect x="83.55" y="8.9" width="2.4" height="3.6" rx="0.2"/>
      <rect x="86.5" y="8.9" width="2.4" height="3.6" rx="0.2"/>
    </g>
    <g fill="#c9a86a">
      <circle cx="81.8" cy="7.8" r="0.5"/><circle cx="84.75" cy="7.8" r="0.5"/><circle cx="87.7" cy="7.8" r="0.5"/>
    </g>
  </g>
  <g id="handle">
    <rect x="105.3" y="0.55" width="7.0" height="19.25" rx="1.3" fill="#e3e5e8" stroke="#8d9298" stroke-width="0.2"/>
    <rect x="106.5" y="1.8" width="4.6" height="16.75" rx="1.1" fill="#d3d6da"/>
  </g>
  <g id="silkscreen" font-family="Helvetica, Arial, sans-serif" font-style="italic" fill="#26407a">
    <text x="1.7" y="3.9" font-size="2.4" font-weight="bold">IRIG-B</text>
    <text x="13.6" y="5.2" font-size="1.5" text-anchor="middle">PWR</text>
    <text x="13.6" y="16.3" font-size="1.5" text-anchor="middle">STA</text>
    <text x="23.2" y="17.8" font-size="1.7" font-weight="bold" text-anchor="middle">IRIG IN</text>
    <text x="38.0" y="17.8" font-size="1.7" font-weight="bold" text-anchor="middle">Optical OUT</text>
    <text x="61.6" y="17.8" font-size="1.7" font-weight="bold" text-anchor="middle">10 IRIG OUT</text>
    <text x="84.3" y="17.8" font-size="1.7" font-weight="bold" text-anchor="middle">Alarm/Pulse</text>
    <text x="97.7" y="17.8" font-size="1.7" font-weight="bold" text-anchor="middle">RS-422 OUT</text>
  </g>
</svg>
