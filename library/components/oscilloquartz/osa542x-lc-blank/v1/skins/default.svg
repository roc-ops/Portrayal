<svg xmlns="http://www.w3.org/2000/svg" width="113.5mm" height="20.6mm" viewBox="0 0 113.5 20.6">
  <!-- OSA 542x expansion-slot blank plate, 113.5 x 20.6. ESTIMATED ART: no image
       of the blank is held; the manual says only that it carries a captive
       thumbscrew oriented to the right. -->
  <rect id="plate" x="0.1" y="0.1" width="113.3" height="20.4" rx="0.4" fill="#d6d8db" stroke="#6b7076" stroke-width="0.2"/>
  <g id="thumbscrew">
    <circle cx="110.1" cy="10.3" r="3.2" fill="#c9cdd1" stroke="#7a7f85" stroke-width="0.25"/>
    <circle cx="110.1" cy="10.3" r="2.6" fill="none" stroke="#9ca1a6" stroke-width="0.5" stroke-dasharray="0.3 0.3"/>
    <path d="M 108.7 10.3 L 109.4 9.05 H 110.8 L 111.5 10.3 L 110.8 11.55 H 109.4 Z" fill="#e2e5e8" stroke="#8a8f95" stroke-width="0.2"/>
  </g>
</svg>
