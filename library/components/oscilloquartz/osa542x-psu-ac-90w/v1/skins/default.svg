<svg xmlns="http://www.w3.org/2000/svg" width="81mm" height="36mm" viewBox="0 0 81 36">
  <!-- OSA 542x AC PSU face. THE MODULE IS L-SHAPED: a 71.8 x 35 plate with the
       thumbscrew tab stepping out at its lower right to 81 x 36. The notch above
       the tab is CHASSIS METAL, painted here in the chassis grey because a bay
       is a rectangle. The C14 is std/c14-inlet@1, composed by the contract; this
       art draws the black moulded flange around it. -->
  <rect id="notch" x="71.8" y="0" width="9.2" height="24.25" fill="#d2d4d7"/>
  <rect id="plate" x="0.15" y="0.15" width="71.5" height="34.7" rx="0.4" fill="#d9dbde" stroke="#55595e" stroke-width="0.3"/>
  <rect id="tab" x="70.1" y="24.25" width="10.75" height="11.6" rx="1.2" fill="#d9dbde" stroke="#55595e" stroke-width="0.3"/>
  <rect x="70.3" y="24.5" width="1.6" height="10.2" fill="#d9dbde"/>
  <g id="handle">
    <rect x="2.2" y="3.95" width="21.6" height="4.8" rx="2.4" fill="#aeb3b8" stroke="#6c7176" stroke-width="0.25"/>
    <rect x="4.6" y="5.55" width="16.8" height="1.6" rx="0.8" fill="#eef0f2"/>
  </g>
  <circle cx="64.9" cy="6.25" r="2.4" fill="#8e9398"/>
  <circle id="lamp-status" cx="64.9" cy="6.25" r="1.6" fill="var(--led-color, #3a3f44)"/>
  <rect id="flange" x="26.5" y="7.35" width="33.6" height="23.8" rx="2.2" fill="#1b1d20" stroke="#0b0c0d" stroke-width="0.2"/>
  <g fill="#c4c8cc" stroke="#6c7176" stroke-width="0.2">
    <circle id="screw-flange-l" cx="23.9" cy="18.75" r="1.5"/>
    <circle id="screw-flange-r" cx="63.7" cy="18.75" r="1.5"/>
  </g>
  <g stroke="#6c7176" stroke-width="0.25">
    <path d="M 23.1 18.75 H 24.7 M 23.9 17.95 V 19.55"/>
    <path d="M 62.9 18.75 H 64.5 M 63.7 17.95 V 19.55"/>
  </g>
  <g id="thumbscrew">
    <circle cx="76.6" cy="31.85" r="3.7" fill="#c9cdd1" stroke="#7a7f85" stroke-width="0.25"/>
    <circle cx="76.6" cy="31.85" r="3.1" fill="none" stroke="#9ca1a6" stroke-width="0.5" stroke-dasharray="0.3 0.3"/>
    <circle cx="76.6" cy="31.85" r="2.0" fill="#dfe2e5" stroke="#8a8f95" stroke-width="0.2"/>
    <path d="M 75.5 31.85 H 77.7 M 76.6 30.75 V 32.95" stroke="#6c7176" stroke-width="0.35"/>
  </g>
  <g id="silkscreen" font-family="Helvetica, Arial, sans-serif" fill="#2f3a66">
    <text x="53.7" y="6.9" font-size="1.9" text-anchor="middle">Status</text>
    <text x="14.8" y="27.7" font-size="2.0">100-</text>
    <text x="14.8" y="30.3" font-size="2.0">240V AC</text>
  </g>
</svg>
