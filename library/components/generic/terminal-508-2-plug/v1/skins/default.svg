<svg xmlns="http://www.w3.org/2000/svg" width="10.16mm" height="15mm" viewBox="0 0 10.16 15">
  <!-- Drawn from the wire side, as a front elevation sees a seated plug, in
       the convention of common/terminal-header-508-2@3: the board side of the header
       down, so the clamp-screw tower rises above the header, and pole 1 at
       the left. The clamp screws are on the top face, which this view sees
       edge on, and are not drawn. Farthest from the viewer first. Each node
       is the whole art of its relief feature. -->
  <!-- The body, 10.16 x 15, with a wire entry cut through it at each pole
       (evenodd) so the entries, standing lower, show as open funnels in 3D. -->
  <path id="body" fill-rule="evenodd" fill="#4fb548" stroke="#306e2c" stroke-width="0.2"
        data-fill-from="body-color" data-stroke-derive="body-color"
        d="M 0 0 H 10.16 V 15 H 0 Z M 0.69 6.3 h 3.7 v 6.8 h -3.7 Z M 5.77 6.3 h 3.7 v 6.8 h -3.7 Z"/>
  <!-- The floor of each wire entry, 3.7 x 6.8. -->
  <rect id="entry-1" x="0.69" y="6.3" width="3.7" height="6.8" fill="#17191c"/>
  <rect id="entry-2" x="5.77" y="6.3" width="3.7" height="6.8" fill="#17191c"/>
  <!-- One wire per pole, numbered from the left. The drawn radius is half the
       default wire-od (3); a wrapper's or a placement's wire-od resizes
       every one, and wire-color paints every one. -->
  <circle id="wire-1" cx="2.54" cy="10.7" r="1.5"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="wire-od" data-fill-from="wire-color"/>
  <circle id="wire-2" cx="7.62" cy="10.7" r="1.5"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="wire-od" data-fill-from="wire-color"/>
</svg>
