<svg xmlns="http://www.w3.org/2000/svg" width="53.5mm" height="15.7mm" viewBox="0 0 53.5 15.7">
  <!-- Drawn from the cable end, as a front elevation sees a seated plug, in
       the convention of std/db25@1: the long side of the D up. Nothing that
       keys the plug is visible from here. Farthest from the viewer first. Each
       node is the whole art of its relief feature. -->
  <!-- The front shell, 38.96 x 8.36, long side up. Behind the hood from here;
       the part of the connector in front of the hood builds from this outline. -->
  <path id="shell" fill="#c9cdd1" d="M7.684 6.017 A2.000 2.000 0 0 1 9.654 3.670 L43.846 3.670 A2.000 2.000 0 0 1 45.816 6.017 L45.047 10.377 A2.000 2.000 0 0 1 43.078 12.030 L10.422 12.030 A2.000 2.000 0 0 1 8.453 10.377 Z"/>
  <!-- The ears of the hood, 53.5 across, that hold the two screws. -->
  <rect id="hood-front" x="0" y="0" width="53.5" height="15.7" rx="1" fill="#b4b8bd"
        stroke="#6d7379" stroke-width="0.2"/>
  <!-- The hood at its full 41.8 x 15.7 section. -->
  <rect id="hood" x="5.85" y="0" width="41.8" height="15.7" rx="1" fill="#b9bdc2"
        stroke="#6d7379" stroke-width="0.2"/>
  <!-- The tapering rear of the hood, built as one step 29 x 15.7. -->
  <rect id="hood-rear" x="12.25" y="0" width="29" height="15.7" rx="1" fill="#aeb2b7"
        stroke="#6d7379" stroke-width="0.2"/>
  <!-- The two thumbscrews, diameter 4.01, on 47.04 centres. -->
  <circle id="screw-l" cx="3.23" cy="7.85" r="2.005"
          fill="#cfd3d7" stroke="#6d7379" stroke-width="0.2"/>
  <circle id="screw-r" cx="50.27" cy="7.85" r="2.005"
          fill="#cfd3d7" stroke="#6d7379" stroke-width="0.2"/>
  <!-- The cable. Its drawn radius is half the default cable-od (8.61); the
       cable-od of a wrapper or a placement resizes it. -->
  <circle id="stub" cx="26.75" cy="7.85" r="4.305"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
