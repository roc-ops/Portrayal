<svg xmlns="http://www.w3.org/2000/svg" width="29mm" height="16.4mm" viewBox="0 0 29 16.4">
  <!-- Drawn from the cable end, as a front elevation sees a seated straight
       MRJ21 plug, in the convention of std/mrj21@1: a jackscrew at the upper
       left and the lower right, over the two guide holes of the receptacle.
       Farthest from the viewer first. Each node is the whole art of its
       relief feature. -->
  <!-- The die-cast backshell, 29.0 x 15.7. -->
  <rect id="hood" x="0" y="0.35" width="29" height="15.7" rx="0.8" fill="#b9bdc2"
        stroke="#6d7379" stroke-width="0.2"/>
  <!-- The two jackscrew heads, diameter 4.1, on the guide holes of the
       receptacle: 22.88 apart along the face and 7.20 across it. -->
  <circle id="screw-a" cx="3.06" cy="4.595" r="2.05"
          fill="#cfd3d7" stroke="#6d7379" stroke-width="0.2"/>
  <circle id="screw-b" cx="25.94" cy="11.795" r="2.05"
          fill="#cfd3d7" stroke="#6d7379" stroke-width="0.2"/>
  <!-- The moulded boot, 16.4 in diameter. -->
  <circle id="relief-boot" cx="14.5" cy="8.2" r="8.2"
          fill="#26282b" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The cable. Its drawn radius is half the default cable-od (12.2); the
       cable-od of a wrapper or a placement resizes it. -->
  <circle id="stub" cx="14.5" cy="8.2" r="6.1"
          fill="#9a9da1" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
