<svg xmlns="http://www.w3.org/2000/svg" width="13.55mm" height="8.55mm" viewBox="0 0 13.55 8.55">
  <!-- End-on, as a front elevation sees a seated SFP+ cable end. The head is
       the backshell's front outline: 1.40 above the 8.55 face the cage accepts
       and 1.55 below it (head.exceeds on the contract). Behind it, in the order
       they stand out from the face: the strain relief, the pull strap lying on
       it, the strap's ring, and the stub of cable, whose radius is half the
       cable-od field. -->
  <rect id="head" x="0" y="-1.40" width="13.55" height="11.50" rx="0.5"
        fill="#9aa0a6" stroke="#5f656b" stroke-width="0.18"/>
  <circle id="relief-boot" cx="6.775" cy="4.275" r="4.4"
          fill="#2a2a2a" stroke="#111111" stroke-width="0.15"/>
  <rect id="strap" x="3.9" y="-0.625" width="5.75" height="0.5"
        fill="#6f6f6f" stroke="#444444" stroke-width="0.1"
        data-fill-from="latch-color" data-stroke-derive="latch-color"/>
  <rect id="strap-ring" x="0.06" y="-1.125" width="13.43" height="1.5" rx="0.4"
        fill="#6f6f6f" stroke="#444444" stroke-width="0.1"
        data-fill-from="latch-color" data-stroke-derive="latch-color"/>
  <circle id="stub" cx="6.775" cy="4.275" r="2.4"
          fill="#1c1c1c" stroke="#000000" stroke-width="0.1"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
