      source: Molex 747520001 rev V1 top view, scaled on its 11.50 REF and 8.55 - the de-latch pull from its hinge at the backshell back to where the ring begins; the ring carries it on to its far end
    - node: strap-ring
      out: 53.9
      lift: 39.0
      confidence: estimated
      source: Molex 747520001 rev V1 top view, scaled on its 11.50 REF and 8.55 - the ring, 28.2 to 43.1 past the backshell back
