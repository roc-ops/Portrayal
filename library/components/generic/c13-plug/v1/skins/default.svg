<svg xmlns="http://www.w3.org/2000/svg" width="26mm" height="16mm" viewBox="0 0 26 16">
  <!-- Drawn from the cable end, as a front elevation sees a seated C13, in the
       inlet's own convention: earth side up, so the two cut corners are at
       the top. Farthest from the viewer first. Each node is the whole art of
       its relief feature. -->
  <!-- The insertion nose, 23 x 15.8, its two earth-side corners cut at 45
       degrees on a 5.5 leg and the other two R3.5. Behind the overmould from
       here; the 5.0 of it in front of the inlet builds from this outline. -->
  <path id="nose" fill="#1c1c1c"
        d="M 7.0 0.1 H 19.0 L 24.5 5.6 V 12.4 A 3.5 3.5 0 0 1 21.0 15.9 H 5.0 A 3.5 3.5 0 0 1 1.5 12.4 V 5.6 Z"/>
  <!-- The overmould at its full 26 x 16, the same keyed outline. -->
  <path id="body" fill="#26282b" stroke="#4a4d52" stroke-width="0.12"
        d="M 7.0 0 H 19.0 L 26.0 7.0 V 12.5 A 3.5 3.5 0 0 1 22.5 16.0 H 3.5 A 3.5 3.5 0 0 1 0 12.5 V 7.0 Z"/>
  <!-- The overmould's tapering rear, built at the 21.6 its ears span, inside
       the same cut corners. -->
  <path id="body-rear" fill="#2c2e32" stroke="#4a4d52" stroke-width="0.12"
        d="M 7.0 0 H 19.0 L 23.8 4.8 V 12.5 A 3.5 3.5 0 0 1 20.3 16.0 H 5.7 A 3.5 3.5 0 0 1 2.2 12.5 V 4.8 Z"/>
  <!-- The strain relief, 11.6 across. -->
  <circle id="relief-boot" cx="13" cy="8" r="5.8"
          fill="#202225" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The cord. Its drawn radius is half the default cable-od (8.33); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="13" cy="8" r="4.165"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
