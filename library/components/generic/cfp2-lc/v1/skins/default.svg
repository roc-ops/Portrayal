<svg xmlns="http://www.w3.org/2000/svg" width="41.5mm" height="12.4mm" viewBox="0 0 41.5 12.4">
  <!-- The head: the enlarged front of a seated CFP2, 42.5 x 16.7 on the
       41.5 x 12.4 body (provenance.head), 0.1 inside the head box for the
       stroke. It overhangs this viewBox on purpose, as a head does. FIRST
       CHILD, so render.py never raises it. -->
  <rect id="body" x="-0.4" y="-2.6" width="42.3" height="16.5" rx="0.5" fill="#9aa0a8" stroke="#6e747c" stroke-width="0.2"/>
  <!-- The receptacle housing the two bores sit in, painted: the bores are
       composed parts and carry their own depth. It frames the keyed
       std/lc-bore@3 openings by 0.30. -->
  <rect id="opening" x="14.975" y="2.54" width="11.55" height="6.9" rx="0.4" fill="#2a2f34"/>
  <!-- The bail bar across the top of the head (provenance.latch).
       data-fill-from lets a wrapper recolour it; the literal stroke is the
       shade of the default. -->
  <rect id="bail" x="-0.4" y="-2.6" width="42.3" height="1.9" rx="0.95" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.18" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <g font-family="sans-serif" font-size="0.9" fill="#2a2f34" text-anchor="middle">
    <g id="silkscreen">
      <text x="17.625" y="11.9">T</text>
      <text x="23.875" y="11.9">R</text>
      <text id="label" x="20.75" y="13.4" data-from="label" font-size="0.7"></text>
    </g>
  </g>
</svg>
