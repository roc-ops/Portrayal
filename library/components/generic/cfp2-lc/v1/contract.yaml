        CFP2 Baseline Drawing Rev 1L sheets 1 and 3: the enlarged section at the front of the module, A08 less
        A11 MIN - see provenance.head
    - node: bail
      lift: 16.0
      bar: 1.9
      confidence: estimated
      source: >-
        A ROUND BAR across the top of the head, resting on the head front at
        lift 16.0, as generic/xfp-lc@1 builds its bail. The diameter is the
        drawn height of the bar, scaled - see provenance.latch
connection-points:
  mate: {at: [20.75, 6.2], direction: front}
  optical-tx: {at: [17.625, 6.79], direction: front}
  optical-rx: {at: [23.875, 6.79], direction: front}
skins: [default]
