format: 1
kind: component
name: sfp-lc-simplex
version: 2.0.0
class: transceiver
behaviour: occupies
mates: sfp
conforms: sfp-module
profile: networking
description: >-
  A generic SFP with one LC bore on its optical axis - the shape every
  bidirectional (BiDi) SFP, SFP+ and SFP28 optic has, standing for all of
  them. One keyed bore with the ferrule standing in it, carrying transmit and
  receive on a single fibre, and a bail latch lying flat because the module
  is seated. Which module it is - rate, reach, wavelength, watts - is a fact
  about a vendor's product and lives on the wrapper that composes this
  (docs/pluggables-design.md, decision 5), never here.
size: {w: 13.55, h: 8.55, d: 47.50}
size-confidence: {w: registry, h: registry, d: registry}
attrs: {power-absent: not-applicable, form-factor: sfp, face: lc-simplex, media: fiber}
fields:
  latch-color:
    label: Latch colour
    type: text
    default: '#6b6f73'
  label:
    label: Module label
    type: text
    default: ''
unplaced: seated by configurations downstream of this library; see docs/pluggables-design.md decision 2
provenance:
  size: >-
    registry - sfp-module, which is SFF-8432 Rev 5.2a Table 4-3 (designator E
    13.55 width, S 8.55 height, T 47.50 distance from positive stop to rear of
    module). Unchanged from generic/sfp-lc@1, which this contract is copied
    from - a bidi face does not change the module's outer envelope.
  power: >-
    NOT APPLICABLE, because this contract is a GENERIC and not a part. It is a
    shape that stands in for every module of its kind, so there is no one figure
    to state: a 1000BASE-BX at 1310/1490nm is under 1 W and others run several,
    and this single drawing is both. Any wattage here would be a fiction dressed
    as a fact. The figure belongs on the wrapper, which knows which module it
    is. L27 exempts by `power-absent` and this sentence is why.
  protrusion: >-
    SFF-8432 Rev 5.2a Table 4-3 designator A, "Module length extending outside
    of cage" (Note 4: indicated outline defines the maximum envelope outside
    of the cage), 10.0mm Recommended Maximum - carried unchanged from
    generic/sfp-lc@1; see that contract's own `provenance.protrusion` for the
    full reading. A face swap does not move the body's protrusion.
  bail-colour: >-
    A FIELD, not a fact, and the default is a NEUTRAL GREY (#6b6f73) because
    every chromatic default is a claim. SFF-8432 Rev 5.2a Note 13 makes the
    colour of an exposed SFP feature a mode code - black or beige for
    multi-mode, blue for single mode, and it says "shall" - so the blue this
    default used to carry told every generic SFP drawn with it that it was
    single mode. That is a per-SKU fact, and a generic stands for every SKU of
    its shape (L99). The grey is in no code table: not blue, not black, not
    beige. A vendor wrapper, which knows which module it is, sets
    `latch-color` to the colour its mode or wavelength calls for. Decided
    2026-09-21. SFF-8432 Rev 5.2a is held locally in the maintainer's
    gitignored corpus.
  latch: >-
    carried unchanged from generic/sfp-lc@1's `provenance.latch` - the bail
    geometry is a fact about the module body, not about which face is cut
    into it, and a bidi face does not move it.
  optical-axis: >-
    carried unchanged from generic/sfp-lc@1's `provenance.optical-axis`. The
    reasoning that put the LC-duplex pair's axis at y 5.70 - clear of the
    bail below and the receptacle geometry above, std/lc-bore@3 being 6.3
    tall and keyed - applies identically to this one bore: it sits at the
    same y for the same clearance reason, and at the duplex RX bore's x (see
    `bores` below).
  bores: >-
    std/lc-bore@3, the same KEYED opening generic/sfp-lc@1 composes, IN THE
    PLACE OF THAT PART'S RX BORE: `at: [7.60, 1.75]`, generic/sfp-lc@1's own
    `rx` placement, so the bore's 4.7-wide square spans x 7.60 to 12.30 and
    its centre is (9.95, 5.70), the duplex part's `optical-rx`. Same y as the
    duplex pair (1.75, hence the same 5.70 optical axis - see `optical-axis`
    above). CORRECTED IN @2 (2026-09-21). @1 centred the bore on the module
    (`at: [4.425, 1.75]`, centre x 6.775 = 13.55/2) because no drawing of a
    bidi SFP face in the intake placed it otherwise; that was a guess, and the
    maintainer's observation of real simplex parts, 2026-09-21, is that a
    simplex LC SFP's bore is not centred but sits where the duplex's RX bore
    does. THAT OBSERVATION IS THE WHOLE SOURCE: no document or photograph in
    the corpus shows a simplex SFP face - a search of the staged photographs
    found none - so the placement rests on it and on nothing drawn. What would
    corroborate it is a bidi module's own mechanical drawing, e.g. a
    1000BASE-BX SFP datasheet's mechanical page, or an orthographic photograph
    of one; if either disagrees, this placement is the thing it argues with.
parts:
  - {ref: std/lc-bore@3, id: bore, at: [7.60, 1.75], lift: 10.0, rotate: 180}
relief:
  features:
    - node: body
      out: 10.0
      color: '#6e747c'
      confidence: drawing
      source: >-
        SFF-8432 Rev 5.2a Table 4-3 designator A, module length extending
        outside of cage, 10.0mm Recommended Maximum - other lengths are
        application specific - see provenance.protrusion
    - node: bail
      lift: 10.0
      out: 14.3
      confidence: estimated
      source: >-
        SFF-8432 Rev 5.2a checked directly (not just carried from
        common/sfp-lc-duplex@1): Table 4-3 designator A is 10.00 RECOMMENDED
        MAXIMUM for "module length extending outside of cage", with "other
        lengths are application specific" - the body's protrusion, not the
        bail's. Figure 4-2 "Latch Post Detail" is the cage-retention post, a
        different part, not the wire bail. Neither gives a figure the bail's
        forward reach could rest on. common/sfp-lc-duplex@1's length key gives
        '0.49 in [12.3] is the face height with the bail extended', a HEIGHT
        across the face, not how far forward the bail reaches. 14.3 is 0.4
        past the body's 10.0 and stays estimated on that basis - a bail that
        clears the body it hinges from, nothing more precise than that.
        Carried unchanged from generic/sfp-lc@1 - a bidi face does not move
        the body's protrusion or the bail's reach past it.
connection-points:
  mate: {at: [6.775, 4.275], direction: front}
  optical: {at: [9.95, 5.70], direction: front}
skins: [default]
