<svg xmlns="http://www.w3.org/2000/svg" width="13.55mm" height="8.55mm" viewBox="0 0 13.55 8.55">
  <!-- The head: the whole front of a seated copper SFP. It overhangs the
       8.55 face the cage accepts by 2.50 above and 2.15 below
       (head.exceeds on the contract); the jack is composed into it. -->
  <rect id="head" x="0" y="-2.50" width="13.55" height="13.20" rx="0.5"
        fill="#9aa0a6" stroke="#5f656b" stroke-width="0.18"/>
  <g font-family="sans-serif" font-size="0.9" fill="#5f656b" text-anchor="middle">
    <g id="silkscreen">
      <text id="label" x="6.775" y="10.40" data-from="label"></text>
    </g>
  </g>
</svg>
