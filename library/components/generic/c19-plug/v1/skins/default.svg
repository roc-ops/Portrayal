<svg xmlns="http://www.w3.org/2000/svg" width="37mm" height="24mm" viewBox="0 0 37 24">
  <!-- Drawn from the cable end, as a front elevation sees a seated C19, in the
       inlet's own convention: long axis across. Farthest from the viewer
       first. Each node is the whole art of its relief feature. -->
  <!-- The insertion nose, 28 x 20, R3.5 at all four corners. Behind the
       overmould from here; the 5.0 of it in front of the inlet builds from
       this outline. -->
  <rect id="nose" x="4.5" y="2" width="28" height="20" rx="3.5" fill="#1c1c1c"/>
  <!-- The two grip lugs, 37 across and 8 wide, as one bar behind the body. -->
  <rect id="lugs" x="0" y="8" width="37" height="8"
        fill="#2c2e32" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The overmould, 29 x 24. -->
  <rect id="body" x="4" y="0" width="29" height="24" rx="3.5"
        fill="#26282b" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The strain relief, 16 across. -->
  <circle id="relief-boot" cx="18.5" cy="12" r="8"
          fill="#202225" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The cord. Its drawn radius is half the default cable-od (9.65); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="18.5" cy="12" r="4.825"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
