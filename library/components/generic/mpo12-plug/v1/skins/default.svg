<svg width="12.5mm" height="7.6mm" viewBox="0 0 12.5 7.6" xmlns="http://www.w3.org/2000/svg">
  <!-- Front view, ferrule end. The 12.5 x 7.6 barrel-ended housing (printed
       callouts, see provenance.size), the 4.39 x 0.90 key rib across the top
       face (measured, see provenance.key - which face carries it is a
       convention argument and is stated there), and the MT ferrule standing in
       its 6.10 x 2.50 window (measured, undimensioned).

       THE KEY AND THE FERRULE ARE INSIDE THE BODY GROUP, the idiom
       common/sc-dust-cap@1 records: a node standing `out` is moved to the end
       of the instance, so art drawn as the body's sibling would be painted
       over by the body it belongs to.

       The twelve fibre bores are not drawn - at 0.12 mm they are smaller than
       the line weight of the face they would sit on, and the count is carried
       by optical.positions. -->
  <g id="body" class="port">
    <rect x="0.0" y="0.0" width="12.5" height="7.6" rx="3.0" ry="3.0"
          fill="#7b818a" stroke="#4a4f55" stroke-width="0.12"/>
    <rect id="key" x="4.055" y="0.42" width="4.39" height="0.9" rx="0.15"
          fill="#8a9099" stroke="#4a4f55" stroke-width="0.1"/>
    <rect id="ferrule" x="3.2" y="2.55" width="6.1" height="2.5" rx="0.2"
          fill="#c7ccd1" stroke="#4a4f55" stroke-width="0.12"/>
  </g>
</svg>
