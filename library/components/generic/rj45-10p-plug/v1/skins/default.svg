<svg width="14mm" height="7.93mm" viewBox="0 0 14 7.93" xmlns="http://www.w3.org/2000/svg">
  <!-- Front view, mating face: a rectangular body with the contacts along its top and a latch
       along its lower edge, borrowed from generic/rj45-plug@1 and widened to 14.0. -->
  <rect id="body" x="0.0" y="0.0" width="14.0" height="7.93" rx="0.4" ry="0.4" class="port" fill="#7b818a"/>
  <rect id="contacts" x="1.66" y="0.6" width="10.68" height="1.3" fill="#c9a227"/>
  <rect id="latch" x="4.96" y="6.43" width="4.08" height="1.5" rx="0.3" ry="0.3" class="latch" fill="#5f656d"/>
</svg>
