<svg xmlns="http://www.w3.org/2000/svg" width="9.17mm" height="7.94mm" viewBox="0 0 9.17 7.94">
  <!-- Drawn end-on, as a front elevation sees a seated SMA plug. The hex
       coupling nut, 7.94 across the flats and 9.17 across the corners,
       turned corners left and right; then the crimp ferrule, 4.0 across; then
       the cable, nearest the viewer. Each node is the whole art of its relief
       feature. -->
  <polygon id="coupling" points="9.17,3.97 6.8775,0 2.2925,0 0,3.97 2.2925,7.94 6.8775,7.94"
           fill="#c9ccd0" stroke="#7d8388" stroke-width="0.12"/>
  <circle id="relief-boot" cx="4.585" cy="3.97" r="2.0"
          fill="#b8bcc0" stroke="#7d8388" stroke-width="0.12"/>
  <!-- The cable. Its drawn radius is half the default cable-od (2.49); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="4.585" cy="3.97" r="1.245"
          fill="#1c1c1c" stroke="#111111" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
