<svg xmlns="http://www.w3.org/2000/svg" width="18.35mm" height="8.5mm" viewBox="0 0 18.35 8.5">
  <!-- Drawn end-on, as a front elevation sees a seated QSFP cable end. The
       head is the diecast backshell's front outline: 3.2 above the 8.5 face
       the cage accepts (the tab side) and 1.4 below it. The boot, the stub
       and the strap stand nearer the viewer than the head's face, so they
       are drawn over it. Each node is the whole art of its relief feature. -->
  <rect id="head" x="0" y="-3.2" width="18.35" height="13.10" rx="0.6"
        fill="#9aa0a6" stroke="#5f656b" stroke-width="0.18"/>
  <!-- The strain relief, 11.0 across, centred on the body axis. -->
  <circle id="relief-boot" cx="9.175" cy="4.25" r="5.5"
          fill="#2b2b2b" stroke="#161616" stroke-width="0.15"/>
  <!-- The cable. Its drawn radius is half the default cable-od (6.9); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="9.175" cy="4.25" r="3.45"
          fill="#1c1c1c" stroke="#111111" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
  <!-- The pull strap lies on top of the cable: its underside on the boot's
       top (y -1.25), 0.8 thick. It ends in a flat ring 17.8 across and
       1.65 thick, centred on the strap. -->
  <rect id="strap" x="5.3" y="-2.05" width="7.75" height="0.8" rx="0.2"
        fill="#6f6f6f" stroke="#444444" stroke-width="0.12"
        data-fill-from="latch-color" data-stroke-derive="latch-color"/>
  <!-- The ring stands nearer the viewer (to 81.3) than the strap (to 63.5)
       and covers it end-on, so it is drawn after it. -->
  <rect id="strap-ring" x="0.275" y="-2.475" width="17.8" height="1.65" rx="0.4"
        fill="#6f6f6f" stroke="#444444" stroke-width="0.12"
        data-fill-from="latch-color" data-stroke-derive="latch-color"/>
</svg>
