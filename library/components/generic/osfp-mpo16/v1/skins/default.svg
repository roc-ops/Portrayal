<svg xmlns="http://www.w3.org/2000/svg" width="22.58mm" height="13.0mm" viewBox="0 0 22.58 13.0">
  <!-- The nose: the part of the module that stands the whole way out of the
       cage. 22.93 wide, from 3.8 below the module top to 1.6 below its
       bottom (OSFP MSA Figure 3-2 Note 1, Figure 3-16 - provenance.head),
       0.1 inside the head box for the stroke. FIRST CHILD, so render.py
       never raises it and the art drawn after it is not buried. -->
  <rect id="body" x="-0.075" y="3.9" width="22.73" height="10.6" rx="0.5" fill="#8d949c" stroke="#61686f" stroke-width="0.18"/>
  <!-- The dark behind the heat sink vents: the vents are holes in `sink`,
       and this is what shows through them in 2D and in 3D. -->
  <rect id="sink-back" x="0.3" y="0.2" width="21.98" height="3.5" fill="#1b1e22"/>
  <!-- The front of the integrated heat sink, the top 3.8 of the face: the
       closed-top example of OSFP MSA Figure 3-16, ten vent holes 1.80 x
       3.20 under a 0.30 skin with 0.30 ribs (provenance.heat-sink). One
       evenodd path, so the holes punch through when relief raises it. -->
  <path id="sink" fill-rule="evenodd" fill="#8d949c" stroke="#61686f" stroke-width="0.12" d="
    M 0.5 0 h 21.58 a 0.5 0.5 0 0 1 0.5 0.5 v 3.3 h -22.58 v -3.3 a 0.5 0.5 0 0 1 0.5 -0.5 z
    M 0.94 0.3 h 1.8 v 3.2 h -1.8 z
    M 3.04 0.3 h 1.8 v 3.2 h -1.8 z
    M 5.14 0.3 h 1.8 v 3.2 h -1.8 z
    M 7.24 0.3 h 1.8 v 3.2 h -1.8 z
    M 9.34 0.3 h 1.8 v 3.2 h -1.8 z
    M 11.44 0.3 h 1.8 v 3.2 h -1.8 z
    M 13.54 0.3 h 1.8 v 3.2 h -1.8 z
    M 15.64 0.3 h 1.8 v 3.2 h -1.8 z
    M 17.74 0.3 h 1.8 v 3.2 h -1.8 z
    M 19.84 0.3 h 1.8 v 3.2 h -1.8 z"/>
  <!-- The black receptacle insert, 13.1 x 9.4, borrowed from
       generic/qsfp-mpo@1 and centred on the receptacle (provenance.insert). -->
  <rect id="insert" x="4.74" y="4.5" width="13.1" height="9.4" rx="0.5" fill="#1b1e22"/>
  <g font-family="sans-serif" font-size="0.6" fill="#61686f" text-anchor="middle">
    <g id="silkscreen">
      <text id="label" x="11.29" y="14.35" data-from="label"></text>
    </g>
  </g>
</svg>
