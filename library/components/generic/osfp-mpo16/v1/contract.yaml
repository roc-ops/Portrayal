mates: osfp
conforms: osfp-module
profile: networking
description: >-
  A generic OSFP with one MPO-16 face - the shape of the OSFP parallel-fibre
  optic with a single-row sixteen-fibre receptacle, standing for all of them.
  The finned heat sink across the top of the module, a nose below it that
  stands out of the cage with one MPO-16 receptacle in it, key up and
  pinned, and a pull tab. Which module it is - rate, reach, wavelength,
  watts - is a fact about a vendor product and lives on the wrapper that
  composes this (docs/pluggables-design.md, decision 5), never here.
