<svg width="5.58mm" height="8.535mm" viewBox="0 0 5.58 8.535" xmlns="http://www.w3.org/2000/svg">
  <!-- Front view, ferrule end, SEATED: latch DOWN, the way the bore is drawn
       unrotated, and compressed so the tab ends 5.71 below the ferrule axis -
       the bulkhead keyway's end. Four tiers read DOWN from the body: the 5.58
       body, the 3.3 stem, the 4.3 shoulder standing proud of both its
       neighbours, then the 2.3 tab. Widths are SENKO's; the three latch
       heights are the free ones scaled in proportion (provenance.keyway). -->
  <rect id="body" x="0.0" y="0.0" width="5.58" height="5.65" rx="0.5" ry="0.5" class="port" fill="#7b818a"/>
  <rect id="stem" x="1.14" y="5.65" width="3.3" height="0.803" class="latch" fill="#8a9099"/>
  <rect id="shoulder" x="0.64" y="6.453" width="4.3" height="0.477" class="latch" fill="#8a9099"/>
  <rect id="tip" x="1.64" y="6.93" width="2.3" height="1.605" class="latch" fill="#8a9099"/>
  <!-- FIBRE POSITION 1: the ferrule end as drawn, wrapped so the plug's one
       fibre has the path <part>/1 (element `1`, class fibre). -->
  <g id="1">
    <circle id="ferrule" cx="2.79" cy="2.825" r="1.6" fill="#c7ccd1" stroke="#4a4f55" stroke-width="0.15"/>
    <circle id="ferrule-bore" cx="2.79" cy="2.825" r="0.45" fill="#2a2d31"/>
  </g>
</svg>
