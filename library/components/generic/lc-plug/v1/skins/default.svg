<svg width="5.58mm" height="10.43mm" viewBox="0 0 5.58 10.43" xmlns="http://www.w3.org/2000/svg">
  <!-- Front view, ferrule end. Four tiers, read DOWN from the latch tab: the
       2.3 tab, the 4.3 shoulder standing proud of both its neighbours, the
       3.3 stem, then the 5.58 body. NOT a monotonic taper - see
       provenance.keyway for the widths, the heights and how the order was
       established, and provenance.axis for the shared optical axis the
       mate/boot/cable connection points sit on. -->
  <rect id="tip" x="1.64" y="0.0" width="2.3" height="2.66" class="latch" fill="#8a9099"/>
  <rect id="shoulder" x="0.64" y="2.66" width="4.3" height="0.79" class="latch" fill="#8a9099"/>
  <rect id="stem" x="1.14" y="3.45" width="3.3" height="1.33" class="latch" fill="#8a9099"/>
  <rect id="body" x="0.0" y="4.78" width="5.58" height="5.65" rx="0.5" ry="0.5" class="port" fill="#7b818a"/>
  <circle id="ferrule" cx="2.79" cy="7.61" r="1.6" fill="#c7ccd1" stroke="#4a4f55" stroke-width="0.15"/>
  <circle id="ferrule-bore" cx="2.79" cy="7.61" r="0.45" fill="#2a2d31"/>
</svg>
