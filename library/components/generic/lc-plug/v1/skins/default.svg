<svg width="5.58mm" height="10.43mm" viewBox="0 0 5.58 10.43" xmlns="http://www.w3.org/2000/svg">
  <!-- Front view, ferrule end. Four tiers, narrowest at the latch tip (top,
       y near 0) to widest at the body (bottom, y near 10.43) - see
       provenance.keyway for the widths and provenance.axis for the shared
       optical axis the mate/boot/cable connection points sit on. -->
  <rect id="tip" x="1.64" y="0.0" width="2.3" height="0.85" class="latch" fill="#8a9099"/>
  <rect id="neck" x="1.14" y="0.85" width="3.3" height="4.2" class="latch" fill="#8a9099"/>
  <rect id="shoulder" x="0.64" y="5.05" width="4.3" height="0.9" class="latch" fill="#8a9099"/>
  <rect id="body" x="0.0" y="5.95" width="5.58" height="4.48" rx="0.5" ry="0.5" class="port" fill="#7b818a"/>
  <circle id="ferrule" cx="2.79" cy="8.19" r="1.6" fill="#c7ccd1" stroke="#4a4f55" stroke-width="0.15"/>
  <circle id="ferrule-bore" cx="2.79" cy="8.19" r="0.45" fill="#2a2d31"/>
</svg>
