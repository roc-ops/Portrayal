<svg xmlns="http://www.w3.org/2000/svg" width="12.83mm" height="11.11mm" viewBox="0 0 12.83 11.11">
  <!-- Drawn end-on, as a front elevation sees a seated F plug. The 7/16 hex
       coupling nut, 11.11 across the flats and 12.83 across the corners,
       turned corners left and right; then the ribbed crimp ferrule, 11.0
       across its ribs, which leaves only the hex corners showing; then the
       cable, nearest the viewer. Each node is the whole art of its relief
       feature. -->
  <polygon id="coupling" points="12.83,5.555 9.6225,0 3.2075,0 0,5.555 3.2075,11.11 9.6225,11.11"
           fill="#c9ccd0" stroke="#7d8388" stroke-width="0.12"/>
  <circle id="relief-boot" cx="6.415" cy="5.555" r="5.5"
          fill="#b8bcc0" stroke="#7d8388" stroke-width="0.12"/>
  <!-- The cable. Its drawn radius is half the default cable-od (6.96); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="6.415" cy="5.555" r="3.48"
          fill="#1c1c1c" stroke="#111111" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
