<svg xmlns="http://www.w3.org/2000/svg" width="29mm" height="21mm" viewBox="0 0 29 21">
  <!-- Drawn from the cable end, as a front elevation sees a C14 seated in a
       C13 outlet, in the outlet's own convention: earth side up, so the
       shroud's two cut corners are at the top. Farthest from the viewer
       first. Each node is the whole art of its relief feature. -->
  <!-- The shroud, 29 x 21, its earth-side corners cut at 45 degrees; it
       enters the outlet's well over the C13 nose. Behind the overmould from
       here; the 0.3 of it left in front of the outlet builds from this
       outline. -->
  <path id="shroud" fill="#1c1c1c"
        d="M 5.0 0 H 24.0 L 29.0 5.0 V 18.0 A 3.0 3.0 0 0 1 26.0 21.0 H 3.0 A 3.0 3.0 0 0 1 0 18.0 V 5.0 Z"/>
  <!-- The overmould's front, 26.6 x 19.3, inside the same cut corners. -->
  <path id="body" fill="#26282b" stroke="#4a4d52" stroke-width="0.12"
        d="M 5.6 0.85 H 23.4 L 27.8 5.25 V 17.15 A 3.0 3.0 0 0 1 24.8 20.15 H 4.2 A 3.0 3.0 0 0 1 1.2 17.15 V 5.25 Z"/>
  <!-- Its tapering rear, built at 18.9 x 13.7. -->
  <rect id="body-rear" x="5.05" y="3.65" width="18.9" height="13.7" rx="3.0"
        fill="#2c2e32" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The strain relief, 11.2 across. -->
  <circle id="relief-boot" cx="14.5" cy="10.5" r="5.6"
          fill="#202225" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The cord. Its drawn radius is half the default cable-od (8.33); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="14.5" cy="10.5" r="4.165"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
