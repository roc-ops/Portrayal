format: 1
kind: component
name: c14-plug
version: 1.6.0
class: port
mates: [iec-c13, eaton-c39, servertech-hdot-cx, raritan-hdot-cx, vertiv-combo, panduit-combo]
conforms: c14-plug
profile: networking
description: >-
  A moulded straight IEC C14 plug connector on its cord, the end of a rack
  jumper that goes into a PDU's C13 outlet, seen from the cable end as a front
  elevation sees it seated: the shroud, keyed by the two cut corners on its
  earth side, the overmould, the strain relief and a short straight stub of
  cord whose diameter is the cable-od field. Seats in an `iec-c13` outlet at
  its own mate point, and in an `eaton-c39` outlet.
size: {w: 29.0, h: 21.0}
size-confidence: {w: drawing, h: drawing}
attrs: {media: c14, connector: c14}
fields:
  cable-od: {label: Cable outside diameter, type: number, unit: mm, default: 7.1}
  jacket-color: {label: Jacket colour, type: text, default: '#1c1c1c'}
unplaced: seated by configurations downstream of this library; see docs/pluggables-design.md decision 2
provenance:
  size: >-
    drawing - registry `c14-plug`. Volex Power Products catalogue, Aug-2025,
    cat. no. VNBC14S "3-pole Straight Plug Receptacle", face view on the
    catalogue's p.271: the shroud 29 +0/-0.5 x 21 +0/-0.5 outside and
    24 +0.5/-0 x 16 +0.5/-0 inside, its earth-side corners cut at 45 degrees
    (+0/-3), and the pins 14.0 +/-0.2 apart with the earth 4.0 +/-0.2 off
    their line. The side view dimensions the overall length 59. The
    catalogue gives no drawing number or revision.
  mates: >-
    A LIST: `iec-c13` and `eaton-c39`. `iec-c13` is the C13 outlet
    std/c13-outlet@1 presents; the plug seats at the `mate` of that part, the
    centre of its well. `eaton-c39` is the Eaton combination outlet
    eaton/c39-outlet@1 presents, which is designed to take a C14 or a C20
    plug (Eaton Rack PDU G4 installation and setup guide P-164001156 rev 3,
    section 1.5). The nose in a C39 is a C13 nose, so the plug seats there
    as it does in a C13 outlet. THE STAND-OFF IS THE C13 OUTLET FIGURE on
    both: the relief below is measured against the 18 well of
    std/c13-outlet@1, and the C39 well is modelled 20 deep, so in a C39 the
    plug is drawn up to 2 prouder than it would sit. No Eaton drawing held
    sections the C39. `servertech-hdot-cx` is the Server Technology HDOT Cx
    outlet, which its PRO4X data sheet calls a hybrid of the C13 and C19 that
    takes a C14 or a C20 plug; the plug seats at the `mate` of
    servertech/hdot-cx-outlet@1 as it does in the C39, and the same stand-off
    applies. `raritan-hdot-cx` is the Raritan PX4 HDOT Cx outlet, which its PX4
    data sheet calls a hybrid of the C13 and C19 that takes a C14 or a C20 plug;
    the plug seats at the `mate` of raritan/px4-cx-outlet@1 the same way, and
    the same stand-off applies. `vertiv-combo` is the Vertiv combination outlet,
    which Table 2.4 of the PowerIT installer guide SL-71211 Rev E rates with a
    C14 cord at 10 A; the plug seats at the `mate` of vertiv/combo-outlet@1 and
    the same stand-off applies. `panduit-combo` is the Panduit G5 combination
    outlet, which the P42G20M customer drawing's plug and receptacle block
    names C13/C15/C19 COMBO at 16 A; the plug seats at the `mate` of
    panduit/g5-outlet-c13-c15-c19@1 and the same stand-off applies.
  no-depth: >-
    NO `size.d`, DELIBERATELY, as on generic/c13-plug@1.
  orientation: >-
    DRAWN IN THE OUTLET'S UNROTATED CONVENTION: std/c13-outlet@1 draws its
    chamfered end up, so the shroud's cut corners are at the top. The Volex
    face view is drawn with the long axis vertical and the earth to the
    right; it is turned a quarter here.
  seated-depth: >-
    RULING - THE SHROUD GOES TO THE FLOOR OF THE WELL THE OUTLET MODELS, as on
    generic/c20-plug@1. The C13 outlet's well is 18 deep (std/c13-outlet@1,
    from the C13 nose's 18 MIN, Volex V1625), so the plug stands 59 - 18 = 41
    in front of the outlet's face: 0.3 of shroud, 24.0 of overmould and 16.7
    of strain relief.
  shroud: >-
    scaled - the shroud is 18.3 long on the VNBC14S side view, calibrated on
    the printed 59 (11.15 px/mm on a 4x enlargement of the catalogue raster,
    which is 2.8 px/mm as embedded; good to about 0.4). The cut corners' leg,
    5.0, is estimated: the drawing gives their angle and not their size.
    The two other corners take R3, the R3.0 MAX the drawing prints.
  body: >-
    scaled - the overmould is 26.6 across the long axis for 8.3 behind the
    shroud and then tapers over 15.7 to the strain relief. It is built as two
    steps, as generic/c13-plug@1's is: 26.6 x 19.3 for the first 8.3, then
    18.9 x 13.7 for the taper. The short-axis figures (19.3, 13.7) are
    estimated in the long axis's proportion; no view held dimensions them.
  relief-boot: >-
    scaled - the strain relief, 16.7 to the dimensioned 59 end and about
    11.2 across, with a collar at its end that is not built.
  stub: >-
    estimated - the stub rule, docs/connectors-coax-design.md section 5.
  cable-od: >-
    datasheet - H05VV-F 3G1.0, the cord the Rack Builder draws for an IEC cord
    (spec/schemas/cable-types.yaml `power-c13`), so a cord drawn between two ends
    is as wide as this stub (#1060). Oznur Kablo, H05VV-F 300/500 V flexible
    cord technical data, the 3x1 row, nominal overall diameter 7.1 mm
    (min and max are not printed). The SJT cord this default was before,
    SJT 3 x 18 AWG, Belden 19348 (0.328 in, 8.33 mm), the cord VNBC14S lists, is a sourced North
    American alternative; a placement or a wrapper
    sets the cord it carries, at its own `cable-od`.
  jacket-colour: >-
    a FIELD, black by default, as on generic/c13-plug@1.
  contacts: >-
    NOT DRAWN, ON PURPOSE: the pins are inside the outlet.
  behaviour: >-
    DELIBERATELY OMITTED, as on every class port contract.
  axis: >-
    derived - `mate` and `cable` share one point, the centre of the shroud
    (14.5, 10.5).
  dcim: >-
    NO DCIM ROW, as generic/c13-plug@1 has none: a cord end is the far end of
    a jumper, not a port of the device it is drawn on.
elements: {}
relief:
