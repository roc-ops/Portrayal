<svg xmlns="http://www.w3.org/2000/svg" width="18.35mm" height="8.5mm" viewBox="0 0 18.35 8.5">
  <!-- The front outline of the Type 2 nose: 3.13 above and 1.5 below the 8.5
       body (JPC p2, toleranced - provenance.head), 0.1 inside the head box
       for the stroke. FIRST CHILD, so render.py never raises it. -->
  <rect id="body" x="0.1" y="-3.03" width="18.15" height="12.93" rx="0.8" fill="#8d949c" stroke="#61686f" stroke-width="0.18"/>
  <!-- The black receptacle insert, 13.1 x 9.4, borrowed from
       generic/qsfp-mpo@1 and centred on the receptacle (provenance.insert). -->
  <rect id="insert" x="2.625" y="-0.45" width="13.1" height="9.4" rx="0.5" fill="#1b1e22"/>
  <g font-family="sans-serif" font-size="0.6" fill="#61686f" text-anchor="middle">
    <g id="silkscreen">
      <text id="label" x="9.175" y="9.65" data-from="label"></text>
    </g>
  </g>
</svg>
