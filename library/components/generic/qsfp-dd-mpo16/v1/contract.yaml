provenance:
  size: >-
    registry - qsfp-dd-module, QSFP-DD/QSFP-DD800/QSFP112 Hardware
    Specification Rev 6.3 section 7.3, Figures 52 and 53: 18.35 +/-0.1 wide,
    8.5 +/-0.1 high, 58.26 REF inserted length behind the nose. Unchanged from
    generic/qsfp-dd-lc@2; see that contract for the full reading. The JPC 400G
    QSFP-DD SR8 datasheet p2 outline prints the same body (18.35 +/-0.1, 8.5
    +/-0.1, and 10.06 +/-0.15 from the hard stop to the rear end).
  power: >-
    NOT APPLICABLE, because this contract is a GENERIC and not a part. It
    stands in for every module of its kind, so there is no one figure to
    state, and any wattage here would be a fiction. The figure belongs on the
    wrapper, which knows which module it is. L27 exempts by `power-absent` and
    this sentence is why.
  head: >-
    datasheet - the JPC 400G QSFP-DD SR8 Transceiver datasheet (an MPO-16
    module), p2 outline drawing, toleranced: the nose stands 3.13 +/-0.25
    above and 1.5 +/-0.1 below the 8.5 +/-0.1 body, 13.13 (ref) tall. Both are
    inside the registry envelope (3.4 MAX above, 1.6 MAX below; QSFP-DD HW Rev
    6.3 Figure 52 Note 4), so nothing is listed in `exceeds`. The width is the
    registry 18.35, which the same sheet prints. THE LENGTH IS 31.9, DERIVED:
    the sheet dimensions 80.5 +/-0.2 from the nose front to the hard stop and
    48.61 +/-0.2 from the back of the nose to the same stop, and the
    difference is 31.89. That is a TYPE 2 nose (35 MAX; Type 1 is 20 MAX),
    hence `type: 2`. A SECOND VENDOR AGREES IN KIND: the FluxLight
    QSFP-DD-400GBase-SR8 datasheet, revision 21.04, p13 prints 93.00 +/-0.20
    module length, MAX 3.4 above and 1.40 +/-0.10 below; less the registry
    58.26 that is 34.74 outside the cage, a derivation that assumes its 93.00
    runs to the rear end. The two differ by 2.8 and both are Type 2. The FS
    QDD-SR4-400G datasheet p9, an MPO-12 QSFP-DD, also draws a long nose.
    generic/qsfp-dd-lc@2 keeps a Type 1 head; one drawing of one face is not
    the class, and this part says only what the MPO-16 drawings show.
  receptacle: >-
    std/mpo16@1, the MTP-16 opening, composed as `mpo16`. QSFP-DD HW Rev 6.3
    section 6.2.1 places the MPO-16 plug and receptacle under TIA-604-18 and
    IEC 61754-7-3 (Figure 29). The 12.9 x 8.0 is the estimate std/mpo16@1
    records, and no keyway is drawn because that part draws none.
  key: >-
    datasheet - KEY UP, toward the module top and the pull tab: QSFP-DD HW
    Rev 6.3 section 6.2.1; the FluxLight p13 end view draws the notch on the
    pull-tab side; the JPC p10 lane figure draws the key up and offset to the
    right of centre looking into the receptacle, with TX 1-8 on the left and
    RX 8-1 on the right. std/mpo16@1 is composed unrotated, and
    generic/mpo16-plug@1 draws its key on top, offset right, so a seated plug
    agrees with that figure.
  gender: >-
    datasheet - PINNED. QSFP-DD HW Rev 6.3 section 6.2.1 notes two alignment
    pins present in each receptacle. Stated in prose only, as on
    generic/qsfp-mpo@1; the pins are not drawn.
  position: >-
    ESTIMATED - centred on the face in x and at the mid-height of the body
    (9.175, 4.25). NO DOCUMENT DIMENSIONS IT and no QSFP-DD module has been
    photographed. FluxLight p13 and QSFP-DD HW Figure 29 draw the receptacle
    centred in x with no callout. The height is scaled off a SIBLING: the
    Gigalight GQD-MPO401-SR8CB Rev V2 Figure 6 end view (the two-row variant
    of the same module, a raster), scaled on its 18.35 width, puts the ferrule
    centre on the x centreline and 4.2 below the body top. An MPO-16 module is
    taken to share that nose.
  insert: >-
    borrowed - the 13.1 x 9.4 black insert of generic/qsfp-mpo@1,
    photo-measured there on a QSFP28 module, drawn centred on this receptacle.
    Estimated here: nothing shows the insert of a QSFP-DD MPO-16 module.
  tab: >-
    composed - common/qsfp-pull-tab@2 at `lift: 31.9`, on the nose front, as
    generic/qsfp-dd-lc@2 composes it. PLACED WITH ITS TOP LEVEL WITH THE NOSE
    TOP (`at: [-0.325, -3.13]`), estimated: the JPC p2 side view draws the
    handle top on the line its 13.13 (ref) height is measured to. THE REACH IS
    KNOWN-WRONG FOR THIS NOSE: the composed tab is the Type 1 handle,
    photo-measured on a QSFP28, reaching 49.8 from the nose front, and
    QSFP-DD HW Rev 6.3 Appendix B says a Type 2 handle is shortened by the
    case extension. JPC p2 prints 117.6 +/-0.4 from the tab end to the hard
    stop, 37.1 forward of the nose front; FluxLight p13 prints 128.06 +/-0.5
    overall, 35.06 forward. A shorter tab is its own part and is not drawn.
    THE LAYERING IS DELIBERATE (lint L46): the size box of the tab overlaps
    the receptacle, but the tab is a loop open in the middle and draws nothing
    over it.
  tab-colour: >-
    A FIELD, and the default is BEIGE because the code says so for this face.
    QSFP-DD HW Rev 6.3 section 6.3 recommends colour coding the pull tab by
    wavelength - beige for 850 nm, blue for 1310 nm, white for 1550 nm - and
    a single-row MPO-16 face is the multimode parallel face. The document
    names the colour and not a value: #d9cba3 is a representative beige,
    estimated. A vendor wrapper sets `latch-color` where its module differs.
