name: qsfp-dd-mpo16
version: 1.0.0
class: transceiver
behaviour: occupies
mates: qsfp-dd
conforms: qsfp-dd-module
profile: networking
description: >-
  A generic QSFP-DD with one MPO-16 face - the shape of the QSFP-DD
  parallel-fibre optic with a single-row sixteen-fibre receptacle. One MPO-16
  receptacle, key up and pinned, in a long Type 2 nose, and a pull tab.
  Which module it is - rate, reach, wavelength, watts - is a fact about a
  vendor product and lives on the wrapper that composes this
  (docs/pluggables-design.md, decision 5), never here. Copies
  generic/qsfp-dd-lc@2 and changes the face and the nose.
