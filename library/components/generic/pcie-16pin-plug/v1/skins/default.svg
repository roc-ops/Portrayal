<svg xmlns="http://www.w3.org/2000/svg" width="20.85mm" height="11.7mm" viewBox="0 0 20.85 11.7">
  <!-- Drawn from the cable end, as a front elevation sees a seated plug.
       Farthest from the viewer first. Each node is the whole art of its relief
       feature. -->
  <!-- The housing, 20.85 x 11.70: the six-wide power block with the narrower
       sense row stepping in below it (Molex 2191140001-SD), and the sixteen cell
       openings through it - twelve power cells and four smaller sense cells - as
       subpaths, so it builds as a tube and the cells are open at the mating face. -->
  <path id="body" fill="#3a3e44" fill-rule="evenodd" stroke="#4a4d52" stroke-width="0.12"
        d="M 0 0 H 20.85 V 7.8 H 17.85 L 16.85 11.7 H 4 L 3 7.8 H 0 Z M 1.725 1.4 H 4.125 V 3.8 H 1.725 Z M 4.725 1.4 H 7.125 V 3.8 H 4.725 Z M 7.725 1.4 H 10.125 V 3.8 H 7.725 Z M 10.725 1.4 H 13.125 V 3.8 H 10.725 Z M 13.725 1.4 H 16.125 V 3.8 H 13.725 Z M 16.725 1.4 H 19.125 V 3.8 H 16.725 Z M 1.725 4.4 H 4.125 V 6.8 H 1.725 Z M 4.725 4.4 H 7.125 V 6.8 H 4.725 Z M 7.725 4.4 H 10.125 V 6.8 H 7.725 Z M 10.725 4.4 H 13.125 V 6.8 H 10.725 Z M 13.725 4.4 H 16.125 V 6.8 H 13.725 Z M 16.725 4.4 H 19.125 V 6.8 H 16.725 Z M 6.625 8.3 H 8.225 V 9.9 H 6.625 Z M 8.625 8.3 H 10.225 V 9.9 H 8.625 Z M 10.625 8.3 H 12.225 V 9.9 H 10.625 Z M 12.625 8.3 H 14.225 V 9.9 H 12.625 Z"/>
  <!-- The housing's rear wall, closing the cells where the wires enter. -->
  <path id="back" fill="#26282c" stroke="#4a4d52" stroke-width="0.12"
        d="M 0.05 0.05 H 20.8 V 7.75 H 17.81 L 16.81 11.65 H 4.04 L 3.04 7.75 H 0.05 Z"/>
  <!-- The latch arm along the top wall, and the hook at its mating end. They stand
       above the housing, outside its drawn outline. -->
  <rect id="latch-arm" x="5" y="-1.2" width="10.85" height="1.4" rx="0.3" fill="#2c3036" stroke="#4a4d52" stroke-width="0.1"/>
  <rect id="latch-hook" x="5.05" y="-2.2" width="10.75" height="1.05" rx="0.3" fill="#3a3e43" stroke="#4a4d52" stroke-width="0.1"/>
  <!-- A wire stub out of each cell: twelve power wires, yellow over black, and four
       thin grey sense wires. -->
  <g>
    <circle id="wire-1" cx="2.925" cy="2.6" r="0.9" fill="#d9b22f"/>
    <circle id="wire-2" cx="5.925" cy="2.6" r="0.9" fill="#d9b22f"/>
    <circle id="wire-3" cx="8.925" cy="2.6" r="0.9" fill="#d9b22f"/>
    <circle id="wire-4" cx="11.925" cy="2.6" r="0.9" fill="#d9b22f"/>
    <circle id="wire-5" cx="14.925" cy="2.6" r="0.9" fill="#d9b22f"/>
    <circle id="wire-6" cx="17.925" cy="2.6" r="0.9" fill="#d9b22f"/>
    <circle id="wire-7" cx="2.925" cy="5.6" r="0.9" fill="#1a1a1a"/>
    <circle id="wire-8" cx="5.925" cy="5.6" r="0.9" fill="#1a1a1a"/>
    <circle id="wire-9" cx="8.925" cy="5.6" r="0.9" fill="#1a1a1a"/>
    <circle id="wire-10" cx="11.925" cy="5.6" r="0.9" fill="#1a1a1a"/>
    <circle id="wire-11" cx="14.925" cy="5.6" r="0.9" fill="#1a1a1a"/>
    <circle id="wire-12" cx="17.925" cy="5.6" r="0.9" fill="#1a1a1a"/>
    <circle id="sense-wire-1" cx="7.425" cy="9.1" r="0.55" fill="#7a7f86"/>
    <circle id="sense-wire-2" cx="9.425" cy="9.1" r="0.55" fill="#7a7f86"/>
    <circle id="sense-wire-3" cx="11.425" cy="9.1" r="0.55" fill="#7a7f86"/>
    <circle id="sense-wire-4" cx="13.425" cy="9.1" r="0.55" fill="#7a7f86"/>
  </g>
  <!-- The comb that gathers the wires into the sleeve. -->
  <path id="comb" fill="#2a2c30" stroke="#4a4d52" stroke-width="0.1"
        d="M 0.8 0.8 H 20.05 V 7.0 H 17.4 L 16.5 10.9 H 4.35 L 3.45 7.0 H 0.8 Z"/>
  <!-- The wire bundle; radius is half the default cable-od (10.0). -->
  <circle id="stub" cx="10.425" cy="5.85" r="5.0"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
