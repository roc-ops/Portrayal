<svg xmlns="http://www.w3.org/2000/svg" width="6.2mm" height="6.2mm" viewBox="0 0 6.2 6.2">
  <!-- Drawn end-on, as a front elevation sees a seated SMB plug. The plain
       snap-on body, 6.2 across; then the crimp ferrule, 3.85 across; then
       the cable, nearest the viewer. Each node is the whole art of its
       relief feature. -->
  <circle id="coupling" cx="3.1" cy="3.1" r="3.1"
          fill="#c9ccd0" stroke="#7d8388" stroke-width="0.12"/>
  <circle id="relief-boot" cx="3.1" cy="3.1" r="1.925"
          fill="#b8bcc0" stroke="#7d8388" stroke-width="0.12"/>
  <!-- The cable. Its drawn radius is half the default cable-od (2.49); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="3.1" cy="3.1" r="1.245"
          fill="#1c1c1c" stroke="#111111" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
