<svg xmlns="http://www.w3.org/2000/svg" width="26mm" height="18.9mm" viewBox="0 0 26 18.9">
  <!-- Drawn from the cable end, as a front elevation sees a seated Saf-D-Grid
       plug, in the inlet's own convention: ground side up, so the nose's two
       long chamfers are at the top. Farthest from the viewer first. Each node
       is the whole art of its relief feature. -->
  <!-- The insertion nose, 22.8 x 16.7, the mate of the inlet's six-sided
       cavity. Behind the body from here; the 8.5 of it in front of the inlet
       builds from this outline. -->
  <path id="nose" fill="#1c1c1c"
        d="M 5.1 1.1 H 20.9 L 24.4 9.5 V 16.8 A 1 1 0 0 1 23.4 17.8 H 2.6 A 1 1 0 0 1 1.6 16.8 V 9.5 Z"/>
  <!-- The latch collar and the overmould as one block, 26.0 x 18.9. -->
  <rect id="body" x="0" y="0" width="26" height="18.9" rx="2"
        fill="#26282b" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The ribbed strain relief, 13.2 wide by 16.6 high: not round. -->
  <rect id="relief-boot" x="6.4" y="1.15" width="13.2" height="16.6" rx="2"
        fill="#202225" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The cord. Its drawn radius is half the default cable-od (9.65); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="13" cy="9.45" r="4.825"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
