<svg xmlns="http://www.w3.org/2000/svg" width="14.3mm" height="14.3mm" viewBox="0 0 14.3 14.3">
  <!-- Drawn end-on, as a front elevation sees a seated BNC plug. The knurled
       ring of the bayonet sleeve, 14.3 across; the sleeve's bayonet slots are
       in front of the ring and hidden by it from this side (provenance
       bayonet-slots). Then the crimp ferrule, 6.4 across; then the cable,
       nearest the viewer. Each node is the whole art of its relief
       feature. -->
  <circle id="coupling" cx="7.15" cy="7.15" r="7.15"
          fill="#c9ccd0" stroke="#7d8388" stroke-width="0.12"/>
  <circle id="relief-boot" cx="7.15" cy="7.15" r="3.2"
          fill="#b8bcc0" stroke="#7d8388" stroke-width="0.12"/>
  <!-- The cable. Its drawn radius is half the default cable-od (4.90); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="7.15" cy="7.15" r="2.45"
          fill="#1c1c1c" stroke="#111111" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
