format: 1
kind: component
name: terminal-250-3-plug
version: 1.0.0
class: port
mates: terminal-250-3
profile: networking
description: >-
  A three-position pluggable terminal plug on a 2.50 mm pitch with its cable, seen from the wire
  side as a front elevation sees it seated: a green body, the strain relief and a short straight
  stub of cable whose diameter is the cable-od field. Seats in a `terminal-250-3` header at its own
  mate point; the cable leaves from the far end of the stub.
size: {w: 10.1, h: 6.5}
size-confidence: {w: estimated, h: estimated}
attrs: {media: terminal-block, connector: terminal-250-3, positions: 3, pitch-mm: 2.5}
fields:
  cable-od: {label: Cable outside diameter, type: number, unit: mm, default: 3.0}
  jacket-color: {label: Jacket colour, type: text, default: '#1c1c1c'}
unplaced: seated by configurations downstream of this library; see docs/pluggables-design.md decision 2
provenance:
  model: >-
    datasheet - Adtran OSA 5422 data sheet, p6, IRIG/TIMECODE line card: the alarm/pulse relay takes
    a "WR-TBL 3-pin Serie 382 - 2.50 mm" connector. The data sheet gives no plug body dimension,
    and no plug drawing is held, so this part is a stand-in for the cable plug.
  size: >-
    estimated - NO DRAWING OF THE PLUG IS HELD. It is drawn as large as the header it mates,
    common/terminal-header-250-3@1 (10.1 x 6.5, itself estimated).
  needs-drawing: >-
    the maker's drawing of the WR-TBL Series 382 three-position plug with its body outline, wire
    entries and the screw or spring clamp it uses.
  stub: >-
    estimated - the stub rule, docs/connectors-coax-design.md section 5: a straight run of cable 30 long
    starting where the strain relief ends.
  cable-od: >-
    estimated - no cable diameter is held. 3.0 is a reading for a three-core relay cable.
  jacket-colour: >-
    a FIELD. Black is the default as on the library's other cable ends; no colour is held.
  frame: >-
    THE RELIEF IS MEASURED FROM THE LIFT THE HOST PRESENTS, the frame the house plugs use.
    common/terminal-header-250-3@1 presents at the mouth of its housing, so 0 is that mouth.
  behaviour: >-
    DELIBERATELY OMITTED, as on every class port contract (spec/tests/test_behaviour.py).
  axis: >-
    derived - `mate` and `cable` share one point, the centre of the body (5.05, 3.25): the cable runs
    straight through the plug.
elements: {}
relief:
  features:
    - node: body
      out: 8.0
      shape: true
      color: '#6fbf4a'
      confidence: estimated
      source: provenance.size - the plug body, 8.0 long (estimated)
    - node: relief-boot
      lift: 8.0
      cyl: 6.0
      color: '#202225'
      confidence: estimated
      source: provenance.stub - the strain relief, 6.0 long (estimated)
    - node: stub
      lift: 14.0
      cyl: 30
      confidence: estimated
      source: the stub rule, docs/connectors-coax-design.md section 5
connection-points:
  mate: {at: [5.05, 3.25], direction: front}
  cable: {at: [5.05, 3.25], direction: front, 'on': stub}
skins: [default]
