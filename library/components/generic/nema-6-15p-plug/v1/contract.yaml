format: 1
kind: component
name: nema-6-15p-plug
version: 1.0.0
class: inlet
conforms: nema-6-15p-plug
profile: power
description: >-
  A NEMA 6-15P straight-blade plug, face on (15 A 250 V, two pole, three
  wire, grounding). It has the moulded body with its cord boss, two flat
  blades lying the same way and the round earth pin below them. The input
  plug at the end of a 250 V 15 A cord.
size: {w: 31.2, h: 29.6}
size-confidence: {w: drawing, h: drawing}
attrs: {plug: nema-6-15p, rating-a: 15, rating-v: 250}
unplaced: >-
  No device in the library places it yet. It is for a cord or a PDU whose
  fixed input cord ends in a 6-15P.
provenance:
  size: >-
    drawing - registry `nema-6-15p-plug`. Volex "Power Products catalogue"
    (Aug-2025), cat. no. VS205S "NEMA 6-15P Straight Plug for Class I
    Appliance", PDF page 164: the body 31.2 +-0.5 across and 29.6 +-0.5 high,
    dimensioned. NEMA WD 6, which governs the configuration, is not held.
  method: >-
    estimated - the sheet is a raster (about 200 ppi), not a vector, and its
    three views are at no common printed scale. The figures that are printed
    are used as printed; every position that is not is measured off the face
    view against the printed 31.2 and 29.6 and is a reading of about +-0.5.
  pins: >-
    drawing for the blade pitch 18.24 +-0.13, the blade thickness 1.52 +-0.13
    and the earth pin 4.67 to 4.83 across (drawn 4.75), and for the blade
    centre line 11.89 +-0.13 above the earth pin centre. estimated: the blade
    centre line 12.0 below the top edge and the blade width 6.35 (the width
    the same catalogue prints for the 6-20P's blade, page 166), read off the
    face view. The blades are centred on the body.
  outline: >-
    estimated - the body's top corners, the cord boss that narrows to 21.98
    across at the foot (the width the 6-20P sheet prints as 21.9752) and the
    rounded foot are traced from the face view and simplified. The screw hole
    the sheet draws at the foot is the earth pin.
  blade-length: >-
    drawing - the side view: the blades 15.88 minimum and the earth pin 21.40
    maximum proud of the face.
  color: >-
    photograph - the sheet's photograph shows a black body, nickel-coloured
    blades and a nickel earth pin.
  no-text: >-
    No moulded legend is drawn.
  no-depth: >-
    NO `size.d`, as on every generic plug: the body behind the face, 56.34
    +-1 long, is not built.
  dcim: >-
    PART_POWER maps it to `other`, and POWER_LABEL names it "NEMA 6-15P plug":
    the target slug `nema-6-15p` has not been read from a source file. A device
    draws either its cord or its plug, not both.
elements:
  face: {at: [0, 0], size: [31.2, 29.6], class: inlet}
