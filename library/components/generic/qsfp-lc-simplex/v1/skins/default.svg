<svg xmlns="http://www.w3.org/2000/svg" width="18.35mm" height="8.5mm" viewBox="0 0 18.35 8.5">
  <!-- The front outline of the nose: 2.2 above and 1.5 below the 8.5 body
       (ROBOfiber Figure 3 - provenance.head), 0.1 inside the head box for the
       stroke. FIRST CHILD, so render.py never raises it. -->
  <rect id="body" x="0.1" y="-2.1" width="18.15" height="12.0" rx="0.8" fill="#8d949c" stroke="#61686f" stroke-width="0.18"/>
  <!-- The duplex-shaped receptacle housing of generic/qsfp-lc@2: 11.55 x 6.90,
       framing a bay either side. Painted, not a cavity. -->
  <rect id="opening" x="3.40" y="0.65" width="11.55" height="6.90" rx="0.4" fill="#2a2f34"/>
  <!-- THE RIGHT BAY, EMPTY: the keyed outline of std/lc-bore@3, tongue up, in
       the receive position of the duplex face (at 9.95, 0.95), with no sleeve
       and no ferrule in it (GBC Photonics p4 end view - provenance.shell). The
       left bay holds the composed bore. -->
  <path id="empty-bay" fill="#15181b" d="
    M 10.98 0.95 h 2.64 v 0.69 h 1.03 v 0.49 h -0.62 v 0.42 h 0.62 v 4.7
      h -4.7 v -4.7 h 0.62 v -0.42 h -0.62 v -0.49 h 1.03 z"/>
  <g font-family="sans-serif" font-size="0.9" fill="#61686f" text-anchor="middle">
    <g id="silkscreen">
      <text x="6.05" y="8.30">T/R</text>
      <text id="label" x="12.30" y="8.30" data-from="label"></text>
    </g>
  </g>
</svg>
