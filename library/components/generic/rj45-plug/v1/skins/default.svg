<svg width="11.68mm" height="7.93mm" viewBox="0 0 11.68 7.93" xmlns="http://www.w3.org/2000/svg">
  <!-- Front view, mating face. A single rectangular body - see provenance.size
       for why this is sheet 1 (unshielded) of CommScope 2843005 rev K and not
       sheet 2 (shielded, a different shape). The spring latch stands 2.77 below
       the body datum in the drawing's side view - an in-plane Y displacement,
       not a Z protrusion (see provenance.latch). Its reach ALONG the plug
       axis is Z, and is the `latch` relief feature (pluggables D). L4
       holds this viewBox to `size` exactly, so the latch is drawn inset within
       the body rather than extending past the bottom edge to scale. -->
  <rect id="body" x="0.0" y="0.0" width="11.68" height="7.93" rx="0.4" ry="0.4" class="port" fill="#7b818a"/>
  <rect id="contacts" x="1.5" y="0.6" width="8.68" height="1.3" fill="#c9a227"/>
  <rect id="latch" x="3.8" y="6.43" width="4.08" height="1.5" rx="0.3" ry="0.3" class="latch" fill="#5f656d"/>
</svg>
