<svg xmlns="http://www.w3.org/2000/svg" width="21.2mm" height="9.81mm" viewBox="0 0 21.2 9.81">
  <!-- The head: the plug body, the whole of a seated CXP outside the
       receptacle. 23.9 x 14.0 on the 21.2 x 9.81 snout (provenance.head),
       0.1 inside the head box for the stroke. It overhangs this viewBox on
       purpose, as a head does. FIRST CHILD, so render.py never raises it. -->
  <rect id="body" x="-1.25" y="-2.48" width="23.7" height="13.8" rx="0.6" fill="#9aa0a8" stroke="#6e747c" stroke-width="0.2"/>
  <!-- The black receptacle insert, 13.1 x 9.4, borrowed from
       generic/qsfp-mpo@1 and centred on the receptacle (provenance.insert). -->
  <rect id="insert" x="4.05" y="-0.1" width="13.1" height="9.4" rx="0.5" fill="#1b1e22"/>
  <!-- The pull tab, seen end on: two arms 3.1 wide on a 19.7 loop and the
       bar across its far end, 1.5 thick, level with the body top
       (provenance.tab). The arms are drawn first and the bar, nearest the
       viewer, last. -->
  <rect id="arm-l" x="0.75" y="-2.48" width="3.1" height="1.5" fill="#6f6f6f" stroke="#444444" stroke-width="0.12" data-fill-from="latch-color" data-stroke-derive="latch-color"/>
  <rect id="arm-r" x="17.35" y="-2.48" width="3.1" height="1.5" fill="#6f6f6f" stroke="#444444" stroke-width="0.12" data-fill-from="latch-color" data-stroke-derive="latch-color"/>
  <rect id="grip" x="0.75" y="-2.48" width="19.7" height="1.5" rx="0.4" fill="#6f6f6f" stroke="#444444" stroke-width="0.12" data-fill-from="latch-color" data-stroke-derive="latch-color"/>
  <g font-family="sans-serif" font-size="0.6" fill="#2a2f34" text-anchor="middle">
    <g id="silkscreen">
      <text id="label" x="10.6" y="10.6" data-from="label"></text>
    </g>
  </g>
</svg>
