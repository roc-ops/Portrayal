<svg xmlns="http://www.w3.org/2000/svg" width="12.6mm" height="18mm" viewBox="0 0 12.6 18">
  <!-- Drawn from the cable end, as a front elevation sees a seated plug.
       Farthest from the viewer first. Each node is the whole art of its relief
       feature. -->
  <!-- The housing, 12.6 x 18.0, the corner that keys it cut, with the eight cell
       openings through it: eight subpaths, so it builds as a tube and the cells are
       open at the mating face. -->
  <path id="body" fill="#3a3e44" fill-rule="evenodd" stroke="#4a4d52" stroke-width="0.12"
        d="M 0 0 H 12.6 V 16.2 L 10.8 18 H 0 Z M 3.7 1.2 H 5.9 V 4.2 H 2.5 V 2.4 Z M 6.7 1.2 H 10.1 V 4.2 H 6.7 Z M 2.5 5.4 H 5.9 V 8.4 H 2.5 Z M 6.7 5.4 H 10.1 V 8.4 H 6.7 Z M 2.5 9.6 H 5.9 V 12.6 H 2.5 Z M 6.7 9.6 H 10.1 V 12.6 H 6.7 Z M 2.5 13.8 H 5.9 V 16.8 H 2.5 Z M 6.7 13.8 H 10.1 V 16.8 H 6.7 Z"/>
  <!-- The housing's rear wall, closing the cells where the wires enter. -->
  <path id="back" fill="#26282c" stroke="#4a4d52" stroke-width="0.12"
        d="M 0.05 0.05 H 12.55 V 16.18 L 10.78 17.95 H 0.05 Z"/>
  <!-- The latch arm along the top wall, and the hook at its mating end. They stand
       above the housing, outside its drawn outline. -->
  <rect id="latch-arm" x="3.3" y="-1.2" width="6" height="1.4" rx="0.3" fill="#2c3036" stroke="#4a4d52" stroke-width="0.1"/>
  <rect id="latch-hook" x="3.35" y="-2.2" width="5.9" height="1.05" rx="0.3" fill="#3a3e43" stroke="#4a4d52" stroke-width="0.1"/>
  <!-- A wire stub out of each cell: yellow 12 V, black ground. -->
  <g>
    <circle id="wire-1" cx="4.2" cy="2.7" r="1.1" fill="#1a1a1a"/>
    <circle id="wire-2" cx="8.4" cy="2.7" r="1.1" fill="#d9b22f"/>
    <circle id="wire-3" cx="4.2" cy="6.9" r="1.1" fill="#1a1a1a"/>
    <circle id="wire-4" cx="8.4" cy="6.9" r="1.1" fill="#d9b22f"/>
    <circle id="wire-5" cx="4.2" cy="11.1" r="1.1" fill="#1a1a1a"/>
    <circle id="wire-6" cx="8.4" cy="11.1" r="1.1" fill="#d9b22f"/>
    <circle id="wire-7" cx="4.2" cy="15.3" r="1.1" fill="#1a1a1a"/>
    <circle id="wire-8" cx="8.4" cy="15.3" r="1.1" fill="#d9b22f"/>
  </g>
  <!-- The comb that gathers the wires into the sleeve. -->
  <rect id="comb" x="0.8" y="0.8" width="11" height="16.4" rx="1.2" fill="#2a2c30" stroke="#4a4d52" stroke-width="0.1"/>
  <!-- The wire bundle. Its drawn radius is half the default cable-od (9.0); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="6.3" cy="9" r="4.5"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
