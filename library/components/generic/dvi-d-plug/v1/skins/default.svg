<svg xmlns="http://www.w3.org/2000/svg" width="39.5mm" height="15.13mm" viewBox="0 0 39.5 15.13">
  <!-- Drawn from the cable end, as a front elevation sees a seated DVI plug. The shell and the contacts are on the
       mating face and are behind the hood from here. Farthest from the viewer first. -->
  <!-- The shell, 24.16 x 7.90, centred between the jackscrews; its corners are estimated. It is the shell's node
       for the 3D build and is hidden under the hood in the 2D skin. -->
  <path id="shell" fill="#c9cdd1" d="M8.67 3.615 L30.83 3.615 A1 1 0 0 1 31.83 4.615 L31.83 9.515 L29.83 11.515 L9.67 11.515 L7.67 9.515 L7.67 4.615 A1 1 0 0 1 8.67 3.615 Z"/>
  <!-- The outline of the plug, 39.50 x 15.13 maximum. -->
  <rect id="hood" x="0" y="0" width="39.5" height="15.13" rx="3" fill="#26282b"
        stroke="#17181a" stroke-width="0.12"
        data-fill-from="hood-color" data-stroke-derive="hood-color"/>
  <!-- The two jackscrews, 32.51 apart. -->
  <circle id="screw-l" cx="3.495" cy="7.565" r="1.7"
          fill="#26282b" stroke="#17181a" stroke-width="0.12"
          data-fill-from="hood-color" data-stroke-derive="hood-color"/>
  <circle id="screw-r" cx="36.005" cy="7.565" r="1.7"
          fill="#26282b" stroke="#17181a" stroke-width="0.12"
          data-fill-from="hood-color" data-stroke-derive="hood-color"/>
  <!-- The cable. Its drawn radius is half the default cable-od (7.0). -->
  <circle id="stub" cx="19.75" cy="7.565" r="3.5"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
