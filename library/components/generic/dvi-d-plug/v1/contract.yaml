format: 1
kind: component
name: dvi-d-plug
version: 1.0.0
class: port
mates: dvi-d
conforms: dvi-d-plug
profile: networking
description: >-
  A DVI digital cable plug, seen from the cable end as a front elevation sees it seated.
  It is the male connector, with 24 contact positions in three rows of eight, a flat blade slot and a jackscrew either side.
  The body outline, the two jackscrews and a short straight stub of cable are drawn.
  The shell and the contacts are behind them, and are drawn on its rear face, the mating face.
  Seats on a `dvi-d` jack at its own mate point. The cable leaves from the far end of the stub.
size: {w: 39.5, h: 15.13}
size-confidence: {w: drawing, h: drawing}
size-notes: both figures are printed as maxima of the plug's outline in the specification's mating interface drawing, 39.50 MAX and 15.13 MAX
attrs: {media: dvi-d, connector: dvi-d, gender: male}
fields:
  cable-od: {label: Cable outside diameter, type: number, unit: mm, default: 7.0}
  jacket-color: {label: Jacket colour, type: text, default: '#1c1c1c'}
  hood-color: {label: Hood colour, type: text, default: '#26282b'}
unplaced: seated by configurations downstream of this library; see docs/pluggables-design.md decision 2
provenance:
  size: >-
    drawing - registry `dvi-d-plug`. Source: Digital Display Working Group, Digital Visual Interface DVI, Revision 1.0
    (2 April 1999). Figure 5-5 on PDF page 47, Digital Plug Connector Mating Interface Dimensions, prints the outline
    39.50 MAX across and 15.13 MAX high. Both are maxima, so the box is the largest the plug may be and
    not a measured hood.
  contacts: >-
    drawing - the same Figure 5-5 and Table 5-1 (page 43). The digital plug has 24 contact positions in three rows of
    eight. They are numbered 1 to 8 along the top row, 9 to 16 and 17 to 24 below. Pin 1 is at the upper right seen
    from the mating face. The pitch is 1.91 along the rows and 1.91 between the rows. It is 13.34 between the first
    and the eighth, and 3.81 between the first and the third. Figure 5-1 (page 45) prints the same grid as 1.905 and
    13.335, so the two are one 0.075 inch pitch. All 24 positions are drawn in the figure. Which of them a cable
    populates is not printed. Pins 4, 5, 12, 13, 20 and 21 carry the second link (Data3, Data4 and Data5 of
    Table 5-1). The specification does not say that a plug omits them. The contacts are on the mating face and are not
    drawn from the cable end. They are drawn on the rear face, `generic/dvi-d-plug-mating@1`.
  jackscrews: >-
    drawing - Figure 5-5: the two jackscrews are 32.51 apart, centred on the shell and level with the middle row of
    contacts. Figure 5-1 (page 45) and the panel cutout of Figure 5-7 (page 48) give them the same way. THE KNOB
    DIAMETER, 3.2, IS ESTIMATED: the figure draws a circle at each screw and prints no diameter. On page 47 rendered
    at 150 dpi the screws are 292 px apart, 8.98 px per mm, and the circle is 28 px across. At 600 dpi it is 114 px
    across, 36.06 px per mm. Read as 3.1 to 3.2 mm; 3.2 is drawn, good to about 0.1 mm. The thread is #4-40 UNC on the receptacle (Figure 5-1).
  shell: >-
    drawing and estimated - Figure 5-5: the D-shaped shell is 24.16 across and 7.90 high, centred between the
    jackscrews. THE CORNERS ARE ESTIMATED. The figure draws the lower corners cut and the upper corners rounded.
    It dimensions neither, so they are drawn as 1.0 radii and 2.0 cuts. The printed 24.16 by 7.90 runs to the
    shell's inner line, not to its lip. The flat blade slot is left of the contacts. It is ESTIMATED at 2.57 by 0.44,
    from 185 by 32 px on the 1200 dpi page. It is drawn on the rear face, not from the cable end.
  depth: >-
    not stated - the side view of Figure 5-5 is cut by break lines and carries no dimension. The shell is built 6.5
    long, ESTIMATED from the 6.50 that Figure 5-1 prints for the shell of the receptacle, which is another part's
    figure. How far the plug enters its jack is not printed on the pages held.
  hood: >-
    NOT DRAWN BEYOND ITS OUTLINE - no held document gives the form of a plug's hood or its strain relief. Figure 5-5
    dimensions only the outline. Its side view draws the hood's and shell's form without a dimension. Molex
    PS-74320-001 prints no dimension of the plug's hood or shell on pages 1 to 5. Its exploded drawings are on
    page 4 only. The 1.91 mm grid and the key are on page 2. The 4-40 UNC-2A jackscrew thread is on page 3. The outline,
    39.50 by 15.13, is drawn flat, its corner radius of 3.0 is estimated, and the hood has no depth in the relief.
  stub: >-
    estimated - the stub rule, docs/connectors-coax-design.md section 5: a straight run of cable 30 long starting at
    the end of the shell. The bend is the installation.
  cable-od: >-
    estimated - no held document gives the outside diameter of a DVI cable. 7.0 is inside the 2 to 15 mm range lint
    allows. A placement or a wrapper sets the cable it actually carries.
  colour: >-
    estimated - no photograph of a DVI plug is held. The hood is drawn dark grey and the shell metal; both are
    stand-ins. The hood colour and the jacket colour are fields.
  orientation: >-
    The key is not visible from the cable end: the shell is behind the hood. Which way is up is recorded here:
    the long side of the D is up, as the jack draws it. Pin 1 is at the upper right seen from the mating face.
  behaviour: >-
    DELIBERATELY OMITTED, as on generic/hd15-plug@1 - every class port contract states none.
  mate: >-
    derived - the centre of the shell, which is the middle of the two jackscrews and of the outline (19.75, 7.565).
    The jack presents at its own face, so the plug is built from that plane.
elements: {}
relief:
  features:
    - node: shell
      out: 6.5
      shape: true
      color: '#c9cdd1'
      confidence: estimated
      source: >-
        Digital Display Working Group, Digital Visual Interface DVI, Revision 1.0, page 47, Figure 5-5: the 24.16 by 7.90
        shell. Its length is estimated from the 6.50 of Figure 5-1, page 45 (provenance.depth).
    - node: stub
      lift: 6.5
      cyl: 30
      confidence: estimated
      source: the stub rule, docs/connectors-coax-design.md section 5
connection-points:
  mate: {at: [19.75, 7.565], direction: front}
  cable: {at: [19.75, 7.565], direction: front, 'on': stub}
faces:
  rear:
    ref: generic/dvi-d-plug-mating@1
skins: [default]
