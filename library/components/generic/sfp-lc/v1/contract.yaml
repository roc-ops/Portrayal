format: 1
kind: component
name: sfp-lc
version: 1.0.0
class: transceiver
behaviour: occupies
mates: sfp
conforms: sfp-module
profile: networking
description: >-
  A generic SFP with an LC duplex face - the shape every SFP, SFP+ and SFP28
  optic with two LC bores has, standing for all of them. Two keyed bores with
  the ferrules standing in them, and a bail latch lying flat because the module
  is seated. Which module it is - rate, reach, wavelength, watts - is a fact
  about a vendor's product and lives on the wrapper that composes this
  (docs/pluggables-design.md, decision 5), never here.
size: {w: 13.55, h: 8.55, d: 47.50}
attrs: {power-absent: not-applicable, form-factor: sfp, face: lc-duplex, media: fiber}
fields:
  latch-color:
    label: Latch colour
    type: text
    default: '#2f5fa8'
  label:
    label: Module label
    type: text
    default: ''
unplaced: seated by configurations downstream of this library; see docs/pluggables-design.md decision 2
provenance:
  size: >-
    registry - sfp-module, which is SFF-8432 Rev 5.2a Table 4-3 (designator E
    13.55 width, S 8.55 height, T 47.50 distance from positive stop to rear of
    module). common/sfp-lc-duplex@1 carried 13.5 x 8.5 from the AutomationDirect
    SFP-30K-FSF drawing confirmed by its STEP solid at 13.46 x 8.48; that
    drawing and the registry agree to within L9's own 0.05 tolerance in spirit
    but not in the literal decimal (13.55 - 13.5 = 0.05, and floating point
    makes that compare false), so the registry's exact figures are kept - L9
    requires it - and the drawing stays the corroborating measurement, not the
    source.
  power: >-
    NOT APPLICABLE, because this contract is a GENERIC and not a part. It is a
    shape that stands in for every module of its kind, so there is no one figure
    to state: a 1000BASE-SX is under 1 W and a 25G-ER several, and this single
    drawing is both. Any wattage here would be a fiction dressed as a fact. The
    figure belongs on the wrapper, which knows which module it is. L27 exempts
    by `power-absent` and this sentence is why.
  lc-spacing: >-
    measured in X (STEP front face - bore centres at x +/-3.175, i.e. 0.125 in
    each side of centre, so 6.35 apart). THE X IS THE MEASURED HALF; the Y is
    derived, and it moved in #126 from 4.25 to 5.70.
  pitch-note: >-
    L81 flags this composing 2 x std/lc-bore@3 6.35mm apart against
    lc-duplex-receptacle's registry pitch of 6.25mm. The 6.35 is not a guess
    drifting off that registry - `lc-spacing` above already documents it as
    measured off the SFP-30K-FSF STEP solid (bore centres at x +/-3.175), a
    real transceiver housing, independent of the FOCIS 10 bulkhead-adapter
    pitch the registry states. Two sourced numbers from two different parts,
    1.6% apart; this one keeps its own measurement.
  optical-axis: >-
    derived, and it is NOT the module's vertical centreline. 4.25 was half of 8.5
    and nothing ever sourced it - only the X of the bore centres was measured -
    and it was only ever consistent with a bore drawn as a plain square.
    std/lc-bore@3 is 6.3 tall because the opening is keyed, and at 4.25 its latch
    slot would need y 0.30 to 1.90, which is exactly where the bail lies (0.55 to
    1.60): the aperture cut the bail in half in the compiled render. The
    receptacle goes below the bail, so the aperture starts at 1.75 - 0.15 clear
    of it - and the axis follows to 5.70. THREE INDEPENDENT READINGS AGREE THAT
    IT SITS LOW, and none of them is a callout: LINK-PP's LS-SM311G-10C front
    view scales to a bore square 2.70 +/-0.3 below the face top (an axis near
    5.05); the face BELOW the bail, 1.60 to 8.50, has its own centre at 5.05;
    and the bail and the QSFP receptacle housing both have to sit clear of the
    opening. They bracket 5.05 to 5.85 and 5.70 is inside that. The number that
    would settle it is in IEC 61754-20, which is paywalled - see `gap` on
    std/lc-bore@3
  bores: >-
    std/lc-bore@3 - the KEYED opening, 4.7 wide by 6.3, whose first tier is the
    4.7 square from the ProLabs CWDM4 section A-A and, now, from LINK-PP's
    LS-SM311G-10C drawing of this exact module class. Composed @1 (4.6 x 4.4,
    proportional), then @2 (4.7 square) when the two versions were collapsed,
    and now @3 once that square proved to be one tier of four (#126).
    RECENTRED HERE for the registry's 13.55 width (was 13.5 on
    common/sfp-lc-duplex@1): the pair keeps its measured 6.35 spacing, so the
    bore centres are (3.60, 5.70) and (9.95, 5.70) - 0.025 further out each
    side than the old (3.575, 9.925), half of the 0.05 width increase - and
    the `at` values are (1.25, 1.75) and (7.60, 1.75) accordingly. The Y is
    unmoved and keeps the account in `optical-axis`. rotate: 180 puts the
    latch tongue up. The keyway is 1.60, which is what this face has room for
    once the bail is cleared; see `short-keyway` on @3 for why it is retained
    rather than re-derived
  protrusion: >-
    SFF-8432 Rev 5.2a Table 4-3 designator A, "Module length extending outside
    of cage" (Note 4: indicated outline defines the maximum envelope outside
    of the cage), 10.0mm Recommended Maximum. Figure 4-1 places the "A MAX"
    callout immediately forward of "MODULE POSITIVE STOP", so A is the
    distance from the positive stop to the front of the module - the same
    reference datum designator T (47.50, distance from positive stop to rear
    of module) already uses for the registry's depth. NOT a subtraction:
    common/sfp-lc-duplex@1 derived ~13.9 from an AutomationDirect overall-
    length drawing (55.4) less a TE cage measurement (41.5), two numbers off
    two unrelated parts; A is a single Table 4-3 dimension sharing T's own
    datum, so no arithmetic is needed. A is stated as a Recommended Maximum
    with "other lengths are application specific", which is consistent with
    common/sfp-lc-duplex@1's vendor drawing landing at 13.9 - past the
    recommendation, not a contradiction of it.
  bail-colour: >-
    A FIELD, not a fact. Vendors colour the bail by reach (blue is commonly
    single-mode) and the wrapper sets `latch-color`; the default here is a
    colour, not a claim.
  latch: >-
    drawing (2.18 in [55.4] overall; 0.49 in [12.3] is the face height with the
    bail extended, which is why the module reads taller than 8.5 when
    unlatched) - common/sfp-lc-duplex@1's length key, carried verbatim. The
    bail's reach past the body stays estimated: no MSA dimensions how far a
    bail stands off, same as common/sfp-lc-duplex@1's own bail figure below.
parts:
  - {ref: std/lc-bore@3, id: tx, at: [1.25, 1.75], lift: 10.0, rotate: 180}
  - {ref: std/lc-bore@3, id: rx, at: [7.60, 1.75], lift: 10.0, rotate: 180}
relief:
  features:
    - node: body
      out: 10.0
      color: '#6e747c'
      confidence: drawing
      source: >-
        SFF-8432 Rev 5.2a Table 4-3 designator A, module length extending
        outside of cage, 10.0mm Recommended Maximum - see
        provenance.protrusion
    - node: bail
      lift: 10.0
      out: 14.3
      color: '#2f5fa8'
      confidence: estimated
      source: >-
        common/sfp-lc-duplex@1 - unsourced. The length key gives '0.49 in
        [12.3] is the face height with the bail extended', which is a HEIGHT
        across the face, not how far forward the bail reaches. 14.3 is 0.4
        past the body's Table 4-3 protrusion and nothing states it.
connection-points:
  mate: {at: [6.775, 4.275], direction: front}
  optical-tx: {at: [3.60, 5.70], direction: front}
  optical-rx: {at: [9.95, 5.70], direction: front}
skins: [default]
