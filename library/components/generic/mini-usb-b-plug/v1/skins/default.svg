<svg xmlns="http://www.w3.org/2000/svg" width="11mm" height="8.5mm" viewBox="0 0 11 8.5">
  <!-- Drawn from the cable end, as a front elevation sees a seated Mini-B
       plug, the opening lying flat with its two cut corners at the bottom.
       Farthest from the viewer first. Each node is the whole art of its
       relief feature. -->
  <!-- The plug shell, 6.8 x 3.0, centred in the overmould: straight sides for
       1.08, cut in to the 1.65 line, straight again to a 5.67 flat. Behind the
       overmould from here; the 1.3 of it in front of the receptacle builds
       from this outline. -->
  <path id="shell" fill="#c9cdd1"
        d="M 2.1 2.75 H 8.9 V 3.83 L 8.335 4.4 V 5.75 H 2.665 V 4.4 L 2.1 3.83 Z"/>
  <!-- The overmould at the 11.0 x 8.5 maximum section, 0.5 radii. -->
  <path id="body" fill="#26282b" stroke="#4a4d52" stroke-width="0.12"
        d="M 0.5 0 H 10.5 A 0.5 0.5 0 0 1 11 0.5 V 8.0 A 0.5 0.5 0 0 1 10.5 8.5 H 0.5 A 0.5 0.5 0 0 1 0 8.0 V 0.5 A 0.5 0.5 0 0 1 0.5 0 Z"/>
  <!-- The strain relief, built as one round section 8.0 across. -->
  <circle id="relief-boot" cx="5.5" cy="4.25" r="4.0"
          fill="#202225" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The cable. Its drawn radius is half the default cable-od (4.06); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="5.5" cy="4.25" r="2.03"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
