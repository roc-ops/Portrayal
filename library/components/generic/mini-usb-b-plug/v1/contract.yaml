format: 1
kind: component
name: mini-usb-b-plug
version: 1.0.0
class: port
mates: mini-usb-b
profile: networking
description: >-
  A moulded straight USB 2.0 Mini-B cable plug on its cable, seen from the
  cable end as a front elevation sees it seated. It shows the overmould at the
  largest section the USB 2.0 Mini-B connector ECN allows and the round strain
  relief. A short straight stub of cable follows, whose diameter is the
  cable-od field. The plug shell behind it is keyed by two cut corners on its
  lower side. It seats in a `mini-usb-b` receptacle at its own mate point, and
  the cable leaves from the far end of the stub.
size: {w: 11.0, h: 8.5}
size-confidence: {w: drawing, h: drawing}
size-notes: both figures are the overmould MAXIMUM the USB 2.0 Mini-B connector ECN dimensions on figure 6-8, not a measured plug
attrs: {media: mini-usb-b, connector: mini-usb-b}
fields:
  cable-od: {label: Cable outside diameter, type: number, unit: mm, default: 4.06}
  jacket-color: {label: Jacket colour, type: text, default: '#1c1c1c'}
unplaced: seated by configurations downstream of this library; see docs/pluggables-design.md decision 2
provenance:
  size: >-
    drawing - USB 2.0 Mini-B connector ECN (rev D), figure 6-8, Typical USB
    Mini-B Connector Plug Orientation, PDF p.15 (printed p.97): the end view
    dimensions the overmould 8.5 MAX across and 11.0 MAX high with its opening
    standing on end. The part is drawn with the opening lying flat, as figure
    6-15 draws the plug and figure 6-11 the receptacle, so the 11.0 is its
    width and the 8.5 its height. THE PART IS DRAWN AT THAT MAXIMUM, with the
    R0.5 REF corner radius the same figure gives. A real plug is usually
    smaller. needs-drawing: a maker's drawing of the plug a cable assembly
    actually carries.
  no-depth: >-
    NO `size.d`, DELIBERATELY, as on generic/micro-usb-b-plug@1 and
    generic/bnc-plug@1. A `size.d` on a component with no `behaviour` compiles
    to `data-depth`, and the kit builds that as a pit behind the whole box of
    the part. The overall length (6.8 + 27.0 = 33.8 from the front of the
    shell to the rear of the strain relief, figure 6-8) is in the relief below.
  orientation: >-
    DRAWN WITH THE TWO CUT CORNERS OF THE SHELL AT THE BOTTOM and the flat of
    the contacts at the top, UP as figure 6-15 draws the plug and figure 6-11
    (PDF p.19) the receptacle, whose lower corners are the ones cut; the
    receptacle std/mini-usb@1 draws its opening with the same lower corners
    chamfered. The turn a seat applies carries the plug round with its
    receptacle, and a device whose jack is mounted otherwise turns the jack and
    the plug follows.
  seated-depth: >-
    RULING - THE PLUG SEATS TO THE DEPTH THE USB DRAWING GIVES, MEASURED FROM
    THE FACE THE RECEPTACLE PRESENTS. Figure 6-11 (PDF p.19) dimensions the
    Mini-B receptacle 5.5 +0.1/-0 from the mouth of its shell (datum A) to the
    wall the plug meets, and figures 6-8 and 6-15 (PDF p.15 and p.25) give the
    plug shell 6.8 MIN from its front to the overmould, so a seated plug leaves
    6.8 - 5.5 = 1.3 of shell in front of the receptacle face. THE RECEPTACLE AS
    MODELLED DISAGREES: std/mini-usb@1 states its depth as 9.0, which is 3.5
    deeper than the 5.5 the drawing gives and longer than the whole plug shell.
    A plug seated on that modelled floor would have its overmould 2.2 behind
    the panel, so the modelled depth is not what seats this plug; THE 9.0 IS
    THE FIGURE TO REVISIT (it is the overall length of a Molex right-angle
    through-hole receptacle, not the insertion depth), and nothing here changes
    when it is, because no figure below is derived from it.
  frame: >-
    THE RELIEF IS MEASURED FROM THE LIFT THE HOST PRESENTS, the frame
    generic/micro-usb-b-plug@1 and generic/bnc-plug@1 use. std/mini-usb@1
    presents at its own face (its `mate` carries no `on:` and no `seat-out`),
    so 0 here is the panel plane the opening is in. The 5.5 of shell inside the
    receptacle is not built.
  shell: >-
    drawing - USB 2.0 Mini-B connector ECN, figure 6-15, USB Series Mini-B Plug
    Interface Drawing, PDF p.25 (printed p.107): the shell is 6.8 +0.04/-0.05
    wide and 3 +0.04/-0.05 high; its sides run straight for 1.08 +/-0.05 from
    the top, then cut in to the 1.65 +/-0.05 line and run straight again to the
    bottom, where the flat is 5.67 +/-0.05 wide. Drawn as that outline with
    straight cuts; the figure's R0.55 and R0.25 radii are not reproduced.
    Length: 6.8 MIN (figures 6-8 and 6-15). It is centred in the overmould: on
    the end view of figure 6-8 the opening centre scales to the overmould
    centre within 0.1. Seen from the cable end it is wholly behind the
    overmould; it is drawn so the 1.3 of it in front of the receptacle has a
    node to build from. The five contacts (0.8 pitch) are not drawn.
  body: >-
    estimated - the overmould holds its 11.0 by 8.5 maximum section
    (provenance.size) for the whole of its 20.0 REF length, figure 6-8, PDF
    p.15; REF figures are typical dimensions and may vary from maker to maker.
    needs-drawing: a maker's drawing of the overmould, for its real section,
    length and corner shape.
  relief-boot: >-
    estimated - figure 6-8, PDF p.15: the strain relief is the 7.0 REF between
    the 27.0 REF overall and the 20.0 REF overmould. Its section is not
    dimensioned: the side view scales to about 8.0 against the printed 11.0 of
    the overmould, and it is built as one round section 8.0 across; the ribs
    are not built. needs-drawing: a maker's drawing of the boot.
  stub: >-
    estimated - the stub rule, docs/connectors-coax-design.md section 5: a
    straight run of cable 30 long starting where the strain relief ends (28.3
    in front of the receptacle face). The bend is the installation.
  cable-od: >-
    estimated - the ECN does not dimension the cable, which figure 6-8 draws
    about 4.3 across against the printed 11.0 of the overmould. The default is
    the 4.06 mm nominal of a USB 2.0 shielded 28/28 cable, as for
    generic/micro-usb-b-plug@1. needs-drawing: the cable data sheet of the
    assembly a placement stands for. A placement or a wrapper sets the cable it
    actually carries.
  jacket-colour: >-
    a FIELD. Black is the default as for the other generic USB plugs; the ECN
    states no colour.
  icon: >-
    NOT DRAWN, ON PURPOSE. Figure 6-8 puts the USB mark on the flat of the
    overmould, a face a front elevation does not see.
  contacts: >-
    NOT DRAWN, ON PURPOSE. The five contacts are on the mating face of the
    plug, which is in the receptacle; a front elevation of a seated plug looks
    at the cable end.
  behaviour: >-
    DELIBERATELY OMITTED, as on generic/bnc-plug@1 - every class port contract
    states none (spec/tests/test_behaviour.py).
  axis: >-
    derived - `mate` and `cable` share one point, the centre of the overmould
    (5.5, 4.25), which is also the centre of the shell: the cable runs straight
    through the connector, so its front and its rear are one axis seen from two
    directions.
elements: {}
relief:
  features:
    - node: shell
      out: 1.3
      shape: true
      color: '#c9cdd1'
      confidence: drawing
      source: >-
        USB 2.0 Mini-B connector ECN, figures 6-8 and 6-15, the 6.8 MIN plug
        shell, less the 5.5 of figure 6-11 from the receptacle mouth to the
        wall the plug meets. The 1.3 is what the ruling in
        provenance.seated-depth leaves in front of the receptacle face.
    - node: body
      lift: 1.3
      out: 21.3
      shape: true
      color: '#26282b'
      confidence: estimated
      source: >-
        USB 2.0 Mini-B connector ECN, figure 6-8: the overmould, 20.0 REF long
        (provenance.body).
    - node: relief-boot
      lift: 21.3
      cyl: 7.0
      color: '#202225'
      confidence: estimated
      source: >-
        USB 2.0 Mini-B connector ECN, figure 6-8: the strain relief, 7.0 REF
        long, built as one round section 8.0 across (provenance.relief-boot).
    - node: stub
      lift: 28.3
      cyl: 30
      confidence: estimated
      source: the stub rule, docs/connectors-coax-design.md section 5
connection-points:
  mate: {at: [5.5, 4.25], direction: front}
  cable: {at: [5.5, 4.25], direction: front, 'on': stub}
skins: [default]
