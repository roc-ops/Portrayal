<svg xmlns="http://www.w3.org/2000/svg" width="34mm" height="15.5mm" viewBox="0 0 34 15.5">
  <!-- Drawn from the cable end, as a front elevation sees a seated VGA plug,
       in the convention of std/vga@1: the long side of the D up. Nothing that
       keys the plug is visible from here. Farthest from the viewer first. Each
       node is the whole art of its relief feature. -->
  <!-- The front shell, 16.92 x 8.36, long side up. Behind the hood from here;
       the part of the connector in front of the hood builds from this outline. -->
  <path id="shell" fill="#c9cdd1" d="M8.954 5.917 A2.000 2.000 0 0 1 10.924 3.570 L23.076 3.570 A2.000 2.000 0 0 1 25.046 5.917 L24.277 10.277 A2.000 2.000 0 0 1 22.308 11.930 L11.692 11.930 A2.000 2.000 0 0 1 9.723 10.277 Z"/>
  <!-- The moulded hood, 34.0 x 15.5. Drawn in the default hood-color, the blue
       of the VGA port; the hood, the strain relief and the two knobs are one
       moulding colour, each outlined in the shade of its fill. -->
  <rect id="hood" x="0" y="0" width="34" height="15.5" rx="2" fill="#1f4f9e"
        stroke="#133060" stroke-width="0.12"
        data-fill-from="hood-color" data-stroke-derive="hood-color"/>
  <!-- The strain relief, a flat block 14.5 x 11.0. -->
  <rect id="relief-boot" x="9.75" y="2.25" width="14.5" height="11" rx="2" fill="#1f4f9e"
        stroke="#133060" stroke-width="0.12"
        data-fill-from="hood-color" data-stroke-derive="hood-color"/>
  <!-- The two thumbscrew knobs, 7.7 across, on 24.99 centres. -->
  <circle id="screw-l" cx="4.505" cy="7.75" r="3.85"
          fill="#1f4f9e" stroke="#133060" stroke-width="0.12"
          data-fill-from="hood-color" data-stroke-derive="hood-color"/>
  <circle id="screw-r" cx="29.495" cy="7.75" r="3.85"
          fill="#1f4f9e" stroke="#133060" stroke-width="0.12"
          data-fill-from="hood-color" data-stroke-derive="hood-color"/>
  <!-- The cable. Its drawn radius is half the default cable-od (9.0); the
       cable-od of a wrapper or a placement resizes it. -->
  <circle id="stub" cx="17" cy="7.75" r="4.5"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
