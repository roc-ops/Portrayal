<svg xmlns="http://www.w3.org/2000/svg" width="10.6mm" height="8.5mm" viewBox="0 0 10.6 8.5">
  <!-- Drawn from the cable end, as a front elevation sees a seated Micro-B
       plug, latch side up: the shell's wide flat is at the top and its two
       cut corners at the bottom; the overmould's two chamfers are on the
       latch side, so they are at the top. Farthest from the viewer first.
       Each node is the whole art of its relief feature. -->
  <!-- The plug shell, 6.85 x 1.8, centred in the overmould, its two lower
       corners cut to a 5.3 flat from 1.03 below the top. Behind the overmould
       from here; the 1.9 of it in front of the receptacle builds from this
       outline. -->
  <path id="shell" fill="#c9cdd1"
        d="M 1.875 3.35 H 8.725 V 4.38 L 7.95 5.15 H 2.65 L 1.875 4.38 Z"/>
  <!-- The overmould at the 10.6 x 8.5 maximum section: two 1.75 chamfers on
       the latch side, 0.5 radii on the other. -->
  <path id="body" fill="#26282b" stroke="#4a4d52" stroke-width="0.12"
        d="M 1.75 0 H 8.85 L 10.6 1.75 V 8.0 A 0.5 0.5 0 0 1 10.1 8.5 H 0.5 A 0.5 0.5 0 0 1 0 8.0 V 1.75 Z"/>
  <!-- The strain relief, built as one round section 6.5 across. -->
  <circle id="relief-boot" cx="5.3" cy="4.25" r="3.25"
          fill="#202225" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The cable. Its drawn radius is half the default cable-od (4.06); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="5.3" cy="4.25" r="2.03"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
