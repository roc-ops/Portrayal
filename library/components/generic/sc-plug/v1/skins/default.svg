<svg width="8.3mm" height="9.0mm" viewBox="0 0 8.3 9" xmlns="http://www.w3.org/2000/svg">
  <!-- Front view, ferrule end. The 7.4 x 9.0 housing with the 0.9 x 1.8 key
       standing off its LEFT wall, centred on the optical axis - see
       provenance.keyway for why left rather than the drawing's right, and
       provenance.size for the four printed callouts these figures are.
       The corner chamfers are drawn (about 0.5, measured, undimensioned) and
       the elements hold the plain envelope conforms: sc-plug is checked
       against. -->
  <rect id="key" x="0.0" y="3.6" width="0.9" height="1.8" class="latch" fill="#8a9099"/>
  <polygon id="body" class="port" fill="#7b818a"
           points="1.4,0 7.8,0 8.3,0.5 8.3,8.5 7.8,9 1.4,9 0.9,8.5 0.9,0.5"/>
  <circle id="ferrule-collar" cx="4.6" cy="4.5" r="2.34" fill="#6d737b" stroke="#4a4f55" stroke-width="0.12"/>
  <!-- FIBRE POSITION 1: the ferrule end as drawn, wrapped so the plug's one
       fibre has the path <part>/1 (element `1`, class fibre). -->
  <g id="1">
    <circle id="ferrule" cx="4.6" cy="4.5" r="1.25" fill="#c7ccd1" stroke="#4a4f55" stroke-width="0.12"/>
    <circle id="ferrule-bore" cx="4.6" cy="4.5" r="0.4" fill="#2a2d31"/>
  </g>
</svg>
