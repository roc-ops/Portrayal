format: 1
kind: component
name: dvi-d-plug-mating
version: 1.0.0
class: port
profile: networking
description: >-
  The mating face of a DVI digital plug, seen from the jack side as the specification draws it.
  It is the rear face of `generic/dvi-d-plug@1`.
  The outline, the D shell, the two jackscrews, the 24 contacts in three rows of eight, their numerals and the flat
  blade slot are drawn. The hood and the cable are behind them.
size: {w: 39.5, h: 15.13}
size-confidence: {w: drawing, h: drawing}
size-notes: both figures are printed as maxima of the plug's outline in the specification's mating interface drawing, 39.50 MAX and 15.13 MAX
attrs: {media: dvi-d, connector: dvi-d, gender: male}
unplaced: a drawing of another side of generic/dvi-d-plug@1, reached through that part's `faces.rear`; no device seats it
provenance:
  size: >-
    drawing - Digital Display Working Group, Digital Visual Interface DVI, Revision 1.0 (2 April 1999). Figure 5-5
    on PDF page 47, Digital Plug Connector Mating Interface Dimensions, prints the outline 39.50 MAX across and
    15.13 MAX high. Both are maxima.
  shell: >-
    drawing and estimated - Figure 5-5 prints the D shell as 24.16 across and 7.90 high. Those figures run to the shell's
    INNER line, not to its lip. The figure draws a lip line about 25.3 by 9.0, 0.57 outside the printed edge.
    It draws a second outline line 1.3 inside the outline. Neither is dimensioned. Both are drawn as thin lines, ESTIMATED
    from pixels. The corners are ESTIMATED: the figure draws them and prints no dimension, so they are the 1.0 radii
    and 2.0 cuts of the plug.
  jackscrews: >-
    drawing and estimated - Figure 5-5 prints the jackscrews 32.51 apart, level with the middle row. The knob
    diameter, 3.2, is ESTIMATED: the figure prints none. It reads 114 px across at 600 dpi, 36.06 px per mm,
    good to about 0.1 mm. The figure draws a crosshair at each screw. They are drawn 0.6 long, ESTIMATED.
  contacts: >-
    drawing and estimated - Table 5-1 (page 43) and Figure 5-5 give 24 contacts in three rows of eight. Pin 1 is
    at the upper right and pin 24 at the lower left. The top row reads 8 to 1 from the left, the middle row 16 to 9
    and the bottom row 24 to 17. PRINTED and used as printed: the pitch 1.91 along and between the rows. So are 13.34
    between pins 8 and 1 and 3.81 between the top and bottom rows. Figure 5-1 (page 45) prints 1.905 and 13.335,
    which fit all three within 0.01, so 1.905 is drawn. ESTIMATED: each contact is 1.4 by 0.5, a rectangle with a
    slanted pin about 1.2 high across it, standing 0.3 out above and below. Each slanted pin is drawn as a straight
    line across its contact box. The figure draws it as a rotated rectangle with a hollow outline, which is not
    reproduced. The field is placed with pin 8 at
    15.93 from the outline's left edge, level with the jackscrews. The figure prints neither. The figure prints the
    numerals 1 to 24 above the contacts. They are drawn as text, ESTIMATED in size and place.
  blade: >-
    estimated - Figure 5-5 draws one flat rectangular slot, its ends cut, left of the contact field and level with the
    middle row. It prints no dimension for it. On the 1200 dpi page it is 185 by 32 px at 72.12 px per mm.
    So 2.57 by 0.44 is ESTIMATED, centred 11.47 from the outline's left edge. The Molex plug sheet calls this blade a key
    for polarization. The words flat blade slot are the specification figure's drawing. This digital-only plug has no
    analogue cross and no C1 to C5 contacts, so none are drawn.
  method: >-
    The scale is the printed 13.34 between pins 8 and 1, 481 px on the 600 dpi page, so 36.06 px per mm. The contact
    columns measure 1.91 mm apart, as the figure prints. Every ESTIMATED figure is read from pixels at this scale,
    good to about 0.1 mm.
  colour: >-
    estimated - no photograph of a DVI plug is held. The hood is dark grey, the shell metal, the contacts gold and
    the slot dark. All four are stand-ins.
  orientation: >-
    Seen from the mating face, as Figure 5-5 draws it. The long side of the D is up and pin 1 is at the upper right.
    The cable-end view of the same plug is the mirror of this one.
