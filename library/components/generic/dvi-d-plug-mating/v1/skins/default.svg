<svg xmlns="http://www.w3.org/2000/svg" width="39.5mm" height="15.13mm" viewBox="0 0 39.5 15.13">
  <!-- The mating face of a DVI digital plug, drawn as Figure 5-5 of the Digital Visual Interface specification draws it:
       pin 1 at the upper right, pin 24 at the lower left. The outline, the shell and the jackscrews' spacing and the grid
       pitch are printed; the contact size, the blade slot, the corners, the extra lines, the numerals and the colours are
       estimated (provenance). -->
  <!-- The outline of the plug, 39.50 x 15.13 maximum. -->
  <rect id="hood" x="0" y="0" width="39.5" height="15.13" rx="3" fill="#26282b" stroke="#17181a" stroke-width="0.12"/>
  <!-- The figure's second outline line, 1.3 inside the outline; estimated, not dimensioned. -->
  <rect id="hood-inner" x="1.3" y="1.3" width="36.9" height="12.53" rx="1.7" fill="none" stroke="#4a4d52" stroke-width="0.05"/>
  <!-- The shell's lip line, 25.3 x 9.0, about 0.57 outside the printed shell edge; estimated, not dimensioned. -->
  <path id="shell-lip" fill="none" stroke="#8d9196" stroke-width="0.05" d="M8.67 3.065 L30.83 3.065 A1.57 1.57 0 0 1 32.4 4.635 L32.4 9.751 L30.086 12.065 L9.414 12.065 L7.1 9.751 L7.1 4.635 A1.57 1.57 0 0 1 8.67 3.065 Z"/>
  <!-- The shell, 24.16 x 7.90, centred between the jackscrews; this is the figure's inner shell line, to which the printed
       figures run. Its corners are estimated. -->
  <path id="shell" fill="#c9cdd1" stroke="#8d9196" stroke-width="0.1" d="M8.67 3.615 L30.83 3.615 A1 1 0 0 1 31.83 4.615 L31.83 9.515 L29.83 11.515 L9.67 11.515 L7.67 9.515 L7.67 4.615 A1 1 0 0 1 8.67 3.615 Z"/>
  <!-- The two jackscrews, 32.51 apart, level with the middle row; the knob diameter 3.2 is estimated. -->
  <circle id="screw-l" cx="3.495" cy="7.565" r="1.6" fill="#26282b" stroke="#17181a" stroke-width="0.12"/>
  <circle id="screw-r" cx="36.005" cy="7.565" r="1.6" fill="#26282b" stroke="#17181a" stroke-width="0.12"/>
  <!-- The crosshair the figure draws at each screw: two strokes 0.6 long, estimated. -->
  <path id="screw-hair-l" fill="none" stroke="#8d9196" stroke-width="0.05" d="M3.195 7.565 L3.795 7.565 M3.495 7.265 L3.495 7.865"/>
  <path id="screw-hair-r" fill="none" stroke="#8d9196" stroke-width="0.05" d="M35.705 7.565 L36.305 7.565 M36.005 7.265 L36.005 7.865"/>
  <!-- The flat blade slot left of the contacts: 2.57 x 0.44 estimated, centred 11.47 from the left edge, level with the middle row. -->
  <rect id="blade-slot" x="10.185" y="7.345" width="2.57" height="0.44" rx="0.1" fill="#4a4d52" stroke="#17181a" stroke-width="0.06"/>
  <!-- The 24 contacts, 1.905 apart along and between the rows. Top row 8 to 1, middle row 16 to 9, bottom row 24 to 17. -->
  <g id="contacts" fill="#b79a3e" stroke="#17181a" stroke-width="0.06">
    <rect id="pin-8" x="15.23" y="5.41" width="1.4" height="0.5"/>
    <rect id="pin-7" x="17.135" y="5.41" width="1.4" height="0.5"/>
    <rect id="pin-6" x="19.04" y="5.41" width="1.4" height="0.5"/>
