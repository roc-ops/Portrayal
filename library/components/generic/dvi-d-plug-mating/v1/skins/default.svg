<svg xmlns="http://www.w3.org/2000/svg" width="39.5mm" height="15.13mm" viewBox="0 0 39.5 15.13">
  <!-- The mating face of a DVI digital plug, drawn as Figure 5-5 of the Digital Visual Interface specification draws it:
       pin 1 at the upper right, pin 24 at the lower left. The outline, the shell, the jackscrews and the grid pitch are
       printed; the contact size, the blade slot, the corners and the colours are estimated (provenance). -->
  <!-- The outline of the plug, 39.50 x 15.13 maximum. -->
  <rect id="hood" x="0" y="0" width="39.5" height="15.13" rx="3" fill="#26282b" stroke="#17181a" stroke-width="0.12"/>
  <!-- The shell, 24.16 x 7.90, centred between the jackscrews; its corners are estimated. -->
  <path id="shell" fill="#c9cdd1" stroke="#8d9196" stroke-width="0.1" d="M8.67 3.615 L30.83 3.615 A1 1 0 0 1 31.83 4.615 L31.83 9.515 L29.83 11.515 L9.67 11.515 L7.67 9.515 L7.67 4.615 A1 1 0 0 1 8.67 3.615 Z"/>
  <!-- The two jackscrews, 32.51 apart, level with the middle row. -->
  <circle id="screw-l" cx="3.495" cy="7.565" r="1.7" fill="#26282b" stroke="#17181a" stroke-width="0.12"/>
  <circle id="screw-r" cx="36.005" cy="7.565" r="1.7" fill="#26282b" stroke="#17181a" stroke-width="0.12"/>
  <!-- The flat blade slot left of the contacts: 2.6 x 0.45 estimated, centred 11.47 from the left edge, level with the middle row. -->
  <rect id="blade-slot" x="10.17" y="7.34" width="2.6" height="0.45" rx="0.1" fill="#4a4d52" stroke="#17181a" stroke-width="0.06"/>
  <!-- The 24 contacts, 1.905 apart along and between the rows. Top row 8 to 1, middle row 16 to 9, bottom row 24 to 17. -->
  <g id="contacts" fill="#b79a3e" stroke="#17181a" stroke-width="0.06">
    <rect id="pin-8" x="15.23" y="5.41" width="1.4" height="0.5"/>
    <rect id="pin-7" x="17.135" y="5.41" width="1.4" height="0.5"/>
    <rect id="pin-6" x="19.04" y="5.41" width="1.4" height="0.5"/>
    <rect id="pin-5" x="20.945" y="5.41" width="1.4" height="0.5"/>
    <rect id="pin-4" x="22.85" y="5.41" width="1.4" height="0.5"/>
    <rect id="pin-3" x="24.755" y="5.41" width="1.4" height="0.5"/>
    <rect id="pin-2" x="26.66" y="5.41" width="1.4" height="0.5"/>
    <rect id="pin-1" x="28.565" y="5.41" width="1.4" height="0.5"/>
    <rect id="pin-16" x="15.23" y="7.315" width="1.4" height="0.5"/>
    <rect id="pin-15" x="17.135" y="7.315" width="1.4" height="0.5"/>
    <rect id="pin-14" x="19.04" y="7.315" width="1.4" height="0.5"/>
    <rect id="pin-13" x="20.945" y="7.315" width="1.4" height="0.5"/>
    <rect id="pin-12" x="22.85" y="7.315" width="1.4" height="0.5"/>
    <rect id="pin-11" x="24.755" y="7.315" width="1.4" height="0.5"/>
    <rect id="pin-10" x="26.66" y="7.315" width="1.4" height="0.5"/>
    <rect id="pin-9" x="28.565" y="7.315" width="1.4" height="0.5"/>
    <rect id="pin-24" x="15.23" y="9.22" width="1.4" height="0.5"/>
    <rect id="pin-23" x="17.135" y="9.22" width="1.4" height="0.5"/>
    <rect id="pin-22" x="19.04" y="9.22" width="1.4" height="0.5"/>
