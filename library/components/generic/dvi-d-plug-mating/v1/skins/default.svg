    <rect id="pin-1" x="28.565" y="5.41" width="1.4" height="0.5"/>
    <rect id="pin-16" x="15.23" y="7.315" width="1.4" height="0.5"/>
    <rect id="pin-15" x="17.135" y="7.315" width="1.4" height="0.5"/>
    <rect id="pin-14" x="19.04" y="7.315" width="1.4" height="0.5"/>
