    <rect id="pin-12" x="22.85" y="7.315" width="1.4" height="0.5"/>
    <rect id="pin-11" x="24.755" y="7.315" width="1.4" height="0.5"/>
    <rect id="pin-10" x="26.66" y="7.315" width="1.4" height="0.5"/>
    <rect id="pin-9" x="28.565" y="7.315" width="1.4" height="0.5"/>
    <rect id="pin-24" x="15.23" y="9.22" width="1.4" height="0.5"/>
    <rect id="pin-23" x="17.135" y="9.22" width="1.4" height="0.5"/>
    <rect id="pin-22" x="19.04" y="9.22" width="1.4" height="0.5"/>
    <rect id="pin-21" x="20.945" y="9.22" width="1.4" height="0.5"/>
    <rect id="pin-20" x="22.85" y="9.22" width="1.4" height="0.5"/>
    <rect id="pin-19" x="24.755" y="9.22" width="1.4" height="0.5"/>
    <rect id="pin-18" x="26.66" y="9.22" width="1.4" height="0.5"/>
    <rect id="pin-17" x="28.565" y="9.22" width="1.4" height="0.5"/>
  </g>
  <!-- The slanted pin the figure draws across each contact, 0.9 x 1.2, estimated. -->
  <path id="slants" fill="none" stroke="#17181a" stroke-width="0.2"
        d="M15.48 5.06 L16.38 6.26 M17.385 5.06 L18.285 6.26 M19.29 5.06 L20.19 6.26 M21.195 5.06 L22.095 6.26 M23.1 5.06 L24 6.26 M25.005 5.06 L25.905 6.26 M26.91 5.06 L27.81 6.26 M28.815 5.06 L29.715 6.26
           M15.48 6.965 L16.38 8.165 M17.385 6.965 L18.285 8.165 M19.29 6.965 L20.19 8.165 M21.195 6.965 L22.095 8.165 M23.1 6.965 L24 8.165 M25.005 6.965 L25.905 8.165 M26.91 6.965 L27.81 8.165 M28.815 6.965 L29.715 8.165
           M15.48 8.87 L16.38 10.07 M17.385 8.87 L18.285 10.07 M19.29 8.87 L20.19 10.07 M21.195 8.87 L22.095 10.07 M23.1 8.87 L24 10.07 M25.005 8.87 L25.905 10.07 M26.91 8.87 L27.81 10.07 M28.815 8.87 L29.715 10.07"/>
  <!-- The numerals the figure prints above each contact, as the library's port skins carry text (generic/cfp-lc).
       Top row 8 to 1, middle row 16 to 9, bottom row 24 to 17; size and place estimated. -->
  <g font-family="sans-serif" font-size="0.4" fill="#17181a" text-anchor="middle"><g id="silkscreen">
    <text id="num-8" x="15.93" y="4.94">8</text>
