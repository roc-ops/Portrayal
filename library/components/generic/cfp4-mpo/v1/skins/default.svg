<svg xmlns="http://www.w3.org/2000/svg" width="21.5mm" height="9.5mm" viewBox="0 0 21.5 9.5">
  <!-- The head: the enlarged front of a seated CFP4, 21.9 x 14.1 on the
       21.5 x 9.5 body (provenance.head), 0.1 inside the head box for the
       stroke. It overhangs this viewBox on purpose, as a head does. FIRST
       CHILD, so render.py never raises it. -->
  <rect id="body" x="-0.1" y="-3" width="21.7" height="13.9" rx="0.5" fill="#9aa0a8" stroke="#6e747c" stroke-width="0.2"/>
  <!-- The black receptacle insert, 13.1 x 9.4, borrowed from
       generic/qsfp-mpo@1 and centred on the receptacle (provenance.insert). -->
  <rect id="insert" x="4.2" y="0.25" width="13.1" height="9.4" rx="0.5" fill="#1b1e22"/>
  <!-- The bail bar across the top of the head (provenance.latch).
       data-fill-from lets a wrapper recolour it; the literal stroke is the
       shade of the default. -->
  <rect id="bail" x="-0.1" y="-3" width="21.7" height="1.1" rx="0.55" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.18" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <g font-family="sans-serif" font-size="0.6" fill="#2a2f34" text-anchor="middle">
    <g id="silkscreen">
      <text id="label" x="10.75" y="10.5" data-from="label"></text>
    </g>
  </g>
</svg>
