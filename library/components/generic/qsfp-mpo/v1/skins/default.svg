<svg xmlns="http://www.w3.org/2000/svg" width="18.35mm" height="8.5mm" viewBox="0 0 18.35 8.5">
  <!-- The front outline of the nose: 1.4 above and 1.4 below the 8.5 body
       (the head, photo-measured - provenance.head), 0.1 inside the head box
       for the stroke. It overhangs the 8.5 viewBox on purpose, as a head does.
       FIRST CHILD, so render.py never raises it over the art below. -->
  <rect id="body" x="0.1" y="-1.3" width="18.15" height="11.1" rx="0.8" fill="#8d949c" stroke="#61686f" stroke-width="0.18"/>
  <!-- The black plastic receptacle body seen in the metal nose, 13.1 x 9.4
       (photo-measured - provenance.insert). Painted; the MPO opening itself
       is the composed std/mpo@2, which carries its own depth. -->
  <rect id="insert" x="2.7" y="-0.15" width="13.1" height="9.4" rx="0.5" fill="#1b1e22"/>
  <g font-family="sans-serif" font-size="0.5" fill="#61686f" text-anchor="middle">
    <g id="silkscreen">
      <text id="label" x="9.175" y="9.7" data-from="label"></text>
    </g>
  </g>
</svg>
