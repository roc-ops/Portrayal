<svg xmlns="http://www.w3.org/2000/svg" width="76.29mm" height="12.19mm" viewBox="0 0 76.29 12.19">
  <!-- A straight two-hole lug on its wire, seen in plan, drawn ACROSS: the
       tongue's rounded tip at the left, the holes 25.4 apart along x, the
       barrel and a 10 stub of wire leaving to the right. Farthest from the
       viewer first; each node is the whole art of its relief feature. -->
  <path id="tongue" fill-rule="evenodd" fill="#c9cdd1" stroke="#6d7379" stroke-width="0.15"
        d="M 6.095 0 H 45.72 V 12.19 H 6.095 A 6.095 6.095 0 0 1 6.095 0 Z M 9.525 6.095 A 3.43 3.43 0 1 0 2.665 6.095 A 3.43 3.43 0 1 0 9.525 6.095 Z M 34.925 6.095 A 3.43 3.43 0 1 0 28.065 6.095 A 3.43 3.43 0 1 0 34.925 6.095 Z"/>
  <rect id="barrel" x="45.72" y="2.16" width="20.57" height="7.87" rx="0.6"
        fill="#c9cdd1" stroke="#7b7d7f" stroke-width="0.15"
        data-fill-from="barrel-color" data-stroke-derive="barrel-color"/>
  <rect id="wire" x="66.29" y="2.16" width="10" height="7.87"
        fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.15"
        data-fill-from="wire-color"/>
  <g id="head-1">
    <circle cx="6.095" cy="6.095" r="4.875" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2"/>
    <path d="M 3.4137 6.095 H 8.7763 M 6.095 3.4137 V 8.7763" fill="none" stroke="#5b6167" stroke-width="0.4" stroke-linecap="round"/>
  </g>
  <g id="head-2">
    <circle cx="31.495" cy="6.095" r="4.875" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2"/>
    <path d="M 28.8137 6.095 H 34.1762 M 31.495 3.4137 V 8.7763" fill="none" stroke="#5b6167" stroke-width="0.4" stroke-linecap="round"/>
  </g>
</svg>
