<svg xmlns="http://www.w3.org/2000/svg" width="10.36mm" height="22.25mm" viewBox="0 0 10.36 22.25">
  <!-- The female PLA03 cable connector drawn from the wire side, as a front elevation sees it seated, upright: the
       insulator with its lock tab at the top end, and one wire leaving each of its three contacts, top to bottom
       DC return, the -36 to -72 VDC feed and ground, as the Edgecore guide wires it. Farthest from the viewer first;
       each node is the whole art of its relief feature. -->
  <rect id="body" x="0" y="0" width="10.36" height="22.25" rx="0.6" fill="#2366ae" stroke="#17457a" stroke-width="0.25"
        data-fill-from="body-color" data-stroke-derive="body-color"/>
  <rect id="lock-tab" x="3.88" y="0.5" width="2.6" height="1.6" rx="0.3" fill="#17457a"/>
  <!-- One wire per contact. The drawn radius is half the default wire-od (3.0); a placement's wire-od resizes all three. -->
  <circle id="wire-1" cx="5.18" cy="6.125" r="1.5" fill="#af3728" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="wire-od" data-fill-from="wire-1-color"/>
  <circle id="wire-2" cx="5.18" cy="11.125" r="1.5" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="wire-od" data-fill-from="wire-2-color"/>
  <circle id="wire-3" cx="5.18" cy="16.125" r="1.5" fill="#5a9e3c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="wire-od" data-fill-from="wire-3-color"/>
</svg>
