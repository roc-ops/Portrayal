<svg xmlns="http://www.w3.org/2000/svg" width="12.85mm" height="7mm" viewBox="0 0 12.85 7">
  <!-- Drawn from the cable end, as a front elevation sees a seated Type-C
       plug. The plug is the same either way up. Farthest from the viewer
       first. Each node is the whole art of its relief feature. -->
  <!-- The plug shell, 8.25 x 2.40 with fully rounded ends. Behind the
       overmould from here; the 0.45 of it in front of the receptacle builds
       from this outline. -->
  <rect id="shell" x="2.3" y="2.3" width="8.25" height="2.4" rx="1.2" fill="#c9cdd1"/>
  <!-- The overmould at the 12.85 x 7.0 maximum section, fully rounded ends. -->
  <rect id="body" x="0" y="0" width="12.85" height="7" rx="3.5" fill="#26282b"
        stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The strain relief, 6.1 across. -->
  <circle id="relief-boot" cx="6.425" cy="3.5" r="3.05"
          fill="#202225" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The cable. Its drawn radius is half the default cable-od (5.2); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="6.425" cy="3.5" r="2.6"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
