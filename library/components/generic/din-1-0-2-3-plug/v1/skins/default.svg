<svg xmlns="http://www.w3.org/2000/svg" width="7.7mm" height="7.7mm" viewBox="0 0 7.7 7.7">
  <!-- Drawn end-on, as a front elevation sees a seated 1.0/2.3 plug. The
       push-pull latch sleeve, 7.7 across; then the crimp ferrule, 4.0
       across; then the cable, nearest the viewer. Each node is the whole art
       of its relief feature. -->
  <circle id="coupling" cx="3.85" cy="3.85" r="3.85"
          fill="#c9ccd0" stroke="#7d8388" stroke-width="0.12"/>
  <circle id="relief-boot" cx="3.85" cy="3.85" r="2.0"
          fill="#b8bcc0" stroke="#7d8388" stroke-width="0.12"/>
  <!-- The cable. Its drawn radius is half the default cable-od (2.54); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="3.85" cy="3.85" r="1.27"
          fill="#1c1c1c" stroke="#111111" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
