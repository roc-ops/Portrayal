<svg xmlns="http://www.w3.org/2000/svg" width="18.35mm" height="8.5mm" viewBox="0 0 18.35 8.5">
  <!-- The head: the whole front of a seated XFP. 22.15 wide on the 18.35
       body, 2.85 above it and 0.80 below (vendor outlines, inside the XFP
       MSA envelope - provenance.head), 0.1 inside the head box for the
       stroke. It overhangs this 8.5 viewBox on purpose, as a head does.
       FIRST CHILD, so render.py never raises it. -->
  <rect id="body" x="-1.8" y="-2.75" width="21.95" height="11.95" rx="0.5" fill="#9aa0a8" stroke="#6e747c" stroke-width="0.2"/>
  <!-- The receptacle housing the two bores sit in, painted: the bores are
       composed parts and carry their own depth. It frames the keyed
       std/lc-bore@3 openings (3.70 to 14.65 by 0.30 to 6.60) by 0.30. -->
  <rect id="opening" x="3.40" y="0.0" width="11.55" height="6.9" rx="0.4" fill="#2a2f34"/>
  <!-- The bail bar across the top of the head (provenance.latch).
       data-fill-from lets a wrapper recolour it; the literal stroke is the
       shade of the default. -->
  <rect id="bail" x="-1.8" y="-2.75" width="21.95" height="1.3" rx="0.65" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.18" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <g font-family="sans-serif" font-size="0.9" fill="#2a2f34" text-anchor="middle">
    <g id="silkscreen">
      <text x="6.05" y="8.1">T</text>
      <text x="12.30" y="8.1">R</text>
      <text id="label" x="9.175" y="8.1" data-from="label"></text>
    </g>
  </g>
</svg>
