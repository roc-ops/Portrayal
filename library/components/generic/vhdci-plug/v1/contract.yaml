        cable connector, starting the 0.34 nominal of Figure 27, p.39, in
        front of the seating surface (provenance.seated-depth). Built at the
        35.08 by 5.80 section of its flange.
    - node: hood
      lift: 7.44
      out: 25.14
      shape: true
      color: '#26282b'
      confidence: estimated
      source: >-
        Cliff Electronic Components data sheet VHDCI Cable (08/2021 ISS.2),
        drawing, scaled (provenance.scale): the hood at its full 43.4 by 9.0
        section, 17.7 long.
    - node: hood-rear
      lift: 25.14
      out: 41.14
      shape: true
      color: '#2c2e32'
      confidence: estimated
      source: >-
        Cliff Electronic Components data sheet VHDCI Cable (08/2021 ISS.2),
        drawing, scaled: the narrowing rear 16.0 of the hood, built as one
        step 26.2 across (provenance.hood).
    - node: relief-boot
      lift: 41.14
      out: 55.44
      shape: true
      color: '#202225'
      confidence: estimated
      source: >-
        Cliff Electronic Components data sheet VHDCI Cable (08/2021 ISS.2),
        drawing, scaled: the flat strain relief, 24.4 across and 14.3 long.
    - node: screw-l
      lift: 25.14
      cyl: 20.2
      color: '#cfd3d7'
      confidence: estimated
