        Cliff Electronic Components data sheet VHDCI Cable (08/2021 ISS.2):
        a 5 mm thumbscrew, built 20.2 long from the shoulder of the hood to
        the end of its knob (scaled; provenance.thumbscrews).
    - node: screw-r
      lift: 25.14
      cyl: 20.2
      color: '#cfd3d7'
      confidence: estimated
      source: >-
        Cliff Electronic Components data sheet VHDCI Cable (08/2021 ISS.2):
        a 5 mm thumbscrew, built 20.2 long from the shoulder of the hood to
        the end of its knob (scaled; provenance.thumbscrews).
