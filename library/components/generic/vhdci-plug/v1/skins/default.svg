<svg xmlns="http://www.w3.org/2000/svg" width="43.4mm" height="9mm" viewBox="0 0 43.4 9">
  <!-- Drawn from the cable end, as a front elevation sees a seated VHDCI plug.
       Nothing that keys the plug is visible from here. Farthest from the
       viewer first. Each node is the whole art of its relief feature. -->
  <!-- The front shell at the section of its flange, 35.08 x 5.80. Behind the
       hood from here; the part of the connector in front of the hood builds
       from this outline. -->
  <rect id="shell" x="4.16" y="1.6" width="35.08" height="5.8" rx="1" fill="#c9cdd1"/>
  <!-- The moulded hood at its full 43.4 x 9.0 section. -->
  <rect id="hood" x="0" y="0" width="43.4" height="9" rx="1" fill="#26282b"
        stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The tapering rear of the hood, built as one step 26.2 wide. -->
  <rect id="hood-rear" x="8.6" y="0" width="26.2" height="9" rx="1" fill="#2c2e32"
        stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The flat strain relief, 24.4 wide. -->
  <rect id="relief-boot" x="9.5" y="0" width="24.4" height="9" rx="1" fill="#202225"
        stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The two thumbscrews, diameter 5.0, on the 37.7 centres of the
       screwlocks. -->
  <circle id="screw-l" cx="2.85" cy="4.5" r="2.5"
          fill="#cfd3d7" stroke="#6d7379" stroke-width="0.2"/>
  <circle id="screw-r" cx="40.55" cy="4.5" r="2.5"
          fill="#cfd3d7" stroke="#6d7379" stroke-width="0.2"/>
  <!-- The cable. Its drawn radius is half the default cable-od (10.0); the
       cable-od of a wrapper or a placement resizes it. -->
  <circle id="stub" cx="21.7" cy="4.5" r="5"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
