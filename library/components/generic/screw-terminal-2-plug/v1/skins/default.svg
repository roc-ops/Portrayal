<svg xmlns="http://www.w3.org/2000/svg" width="10.6mm" height="11mm" viewBox="0 0 10.6 11">
  <!-- The cable plug of a two-pole pluggable DC terminal seen from the wire side, seated: a green body at the outline of the plug that
       common/dc-terminal-plug-2@1 draws in its header, a wire entry and one wire at each of the two ways. No document draws it alone;
       the shapes and colours are estimates. -->
  <rect id="body" x="0" y="0" width="10.6" height="11" rx="0.4" fill="#4aa541" stroke="#2f7a2a" stroke-width="0.3"/>
  <rect id="entry-1" x="1.2" y="2" width="3.6" height="7.6" rx="0.3" fill="#1f3a1f"/>
  <rect id="entry-2" x="5.8" y="2" width="3.6" height="7.6" rx="0.3" fill="#1f3a1f"/>
  <circle id="wire-1" cx="3.0" cy="5.8" r="1.3" fill="#2b2b2b" stroke="#6c7073" stroke-width="0.12" data-fill-from="wire-1-color"/>
  <circle id="wire-2" cx="7.6" cy="5.8" r="1.3" fill="#2b2b2b" stroke="#6c7073" stroke-width="0.12" data-fill-from="wire-2-color"/>
</svg>
