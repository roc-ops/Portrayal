format: 1
kind: component
name: cfp-mpo
version: 1.0.0
class: transceiver
behaviour: occupies
mates: cfp
conforms: cfp-module
profile: networking
description: >-
  A generic CFP with one two-row MPO face - the shape of the CFP
  parallel-fibre optic with a twenty-four-fibre receptacle, standing for all
  of them. A long flat body behind a faceplate that is wider than it, one MPO
  receptacle at the middle of the faceplate, key up and pinned, and a knurled
  thumbscrew at each end. Which module it is - rate, reach, wavelength,
  watts - is a fact about a vendor product and lives on the wrapper that
  composes this (docs/pluggables-design.md, decision 5), never here.
  generic/cfp-lc@1 is the same module with the other face.
