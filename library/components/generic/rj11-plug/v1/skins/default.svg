<svg xmlns="http://www.w3.org/2000/svg" width="9.65mm" height="6.6mm" viewBox="0 0 9.65 6.6">
  <!-- Drawn as generic/rj45-plug@1 is: the body as a front view has it,
       contacts at the top and the latch at the bottom, which is where
       common/rj11-jack@1 draws its pins and its latch slot. The latch stands 2.77
       below the body in the side view of the drawing; the viewBox is held to
       the body, so it is drawn inset within it and not to scale below it. The
       cable is drawn over the body: a seated plug is seen from its cable
       end. -->
  <rect id="body" x="0" y="0" width="9.65" height="6.6" rx="0.4" ry="0.4" class="port" fill="#d5dade"
        stroke="#8a9096" stroke-width="0.12"/>
  <!-- Four contacts on a 1.02 pitch, the 6P4C loading. -->
  <rect id="contacts" x="2.8" y="0.5" width="4.05" height="1.1" fill="#c9a227"/>
  <rect id="latch" x="3.225" y="5.3" width="3.2" height="1.3" rx="0.3" ry="0.3" class="latch" fill="#b9c0c6"/>
  <!-- The cord. Its drawn radius is half the default cable-od (2.9); the
       cable-od of a wrapper or a placement resizes it. -->
  <circle id="stub" cx="4.825" cy="3.3" r="1.45"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
