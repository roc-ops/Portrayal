<svg xmlns="http://www.w3.org/2000/svg" width="64.61mm" height="11.68mm" viewBox="0 0 64.61 11.68">
  <!-- A straight two-hole lug on its wire, seen in plan, drawn ACROSS: the
       tongue's rounded tip at the left, the holes 15.875 apart along x, the
       barrel and a 10 stub of wire leaving to the right. Farthest from the
       viewer first; each node is the whole art of its relief feature. -->
  <path id="tongue" fill-rule="evenodd" fill="#c9cdd1" stroke="#6d7379" stroke-width="0.15"
        d="M 5.84 0 H 34.04 V 11.68 H 5.84 A 5.84 5.84 0 0 1 5.84 0 Z M 8.38 5.84 A 2.54 2.54 0 1 0 3.3 5.84 A 2.54 2.54 0 1 0 8.38 5.84 Z M 24.255 5.84 A 2.54 2.54 0 1 0 19.175 5.84 A 2.54 2.54 0 1 0 24.255 5.84 Z"/>
  <rect id="barrel" x="34.04" y="1.905" width="20.57" height="7.87" rx="0.6"
        fill="#c9cdd1" stroke="#7b7d7f" stroke-width="0.15"
        data-fill-from="barrel-color" data-stroke-derive="barrel-color"/>
  <rect id="wire" x="54.61" y="1.905" width="10" height="7.87"
        fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.15"
        data-fill-from="wire-color"/>
  <g id="head-1">
    <circle cx="5.84" cy="5.84" r="4.67" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2"/>
    <path d="M 3.2715 5.84 H 8.4085 M 5.84 3.2715 V 8.4085" fill="none" stroke="#5b6167" stroke-width="0.4" stroke-linecap="round"/>
  </g>
  <g id="head-2">
    <circle cx="21.715" cy="5.84" r="4.67" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2"/>
    <path d="M 19.1465 5.84 H 24.2835 M 21.715 3.2715 V 8.4085" fill="none" stroke="#5b6167" stroke-width="0.4" stroke-linecap="round"/>
  </g>
</svg>
