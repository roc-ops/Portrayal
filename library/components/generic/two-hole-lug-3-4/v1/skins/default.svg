<svg xmlns="http://www.w3.org/2000/svg" width="62.32mm" height="10.67mm" viewBox="0 0 62.32 10.67">
  <!-- A straight two-hole lug on its wire, seen in plan, drawn ACROSS: the
       tongue's rounded tip at the left, the holes 19.05 apart along x, the
       barrel and a 10 stub of wire leaving to the right. Farthest from the
       viewer first; each node is the whole art of its relief feature. -->
  <path id="tongue" fill-rule="evenodd" fill="#c9cdd1" stroke="#6d7379" stroke-width="0.15"
        d="M 5.335 0 H 29.72 V 10.67 H 5.335 A 5.335 5.335 0 0 1 5.335 0 Z M 8.765 5.335 A 3.43 3.43 0 1 0 1.905 5.335 A 3.43 3.43 0 1 0 8.765 5.335 Z M 27.815 5.335 A 3.43 3.43 0 1 0 20.955 5.335 A 3.43 3.43 0 1 0 27.815 5.335 Z"/>
  <rect id="barrel" x="29.72" y="2.54" width="22.6" height="5.59" rx="0.6"
        fill="#c9cdd1" stroke="#7b7d7f" stroke-width="0.15"
        data-fill-from="barrel-color" data-stroke-derive="barrel-color"/>
  <rect id="wire" x="52.32" y="2.54" width="10" height="5.59"
        fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.15"
        data-fill-from="wire-color"/>
  <g id="head-1">
    <circle cx="5.335" cy="5.335" r="4.27" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2"/>
    <path d="M 2.9865 5.335 H 7.6835 M 5.335 2.9865 V 7.6835" fill="none" stroke="#5b6167" stroke-width="0.4" stroke-linecap="round"/>
  </g>
  <g id="head-2">
    <circle cx="24.385" cy="5.335" r="4.27" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2"/>
    <path d="M 22.0365 5.335 H 26.7335 M 24.385 2.9865 V 7.6835" fill="none" stroke="#5b6167" stroke-width="0.4" stroke-linecap="round"/>
  </g>
</svg>
