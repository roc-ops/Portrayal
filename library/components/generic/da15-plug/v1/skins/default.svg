<svg xmlns="http://www.w3.org/2000/svg" width="39.9mm" height="15.3mm" viewBox="0 0 39.9 15.3">
  <!-- Drawn from the cable end, as a front elevation sees a seated plug, in
       the convention of std/da15@1: the long side of the D up. Nothing that
       keys the plug is visible from here. Farthest from the viewer first. Each
       node is the whole art of its relief feature. -->
  <!-- The front shell, 25.25 x 8.36, long side up. Behind the hood from here;
       the part of the connector in front of the hood builds from this outline. -->
  <path id="shell" fill="#c9cdd1" d="M7.739 5.817 A2.000 2.000 0 0 1 9.709 3.470 L30.191 3.470 A2.000 2.000 0 0 1 32.161 5.817 L31.392 10.177 A2.000 2.000 0 0 1 29.423 11.830 L10.477 11.830 A2.000 2.000 0 0 1 8.508 10.177 Z"/>
  <!-- The ears of the hood, 39.9 across, that hold the two screws. -->
  <rect id="hood-front" x="0" y="0" width="39.9" height="15.3" rx="1" fill="#b4b8bd"
        stroke="#6d7379" stroke-width="0.2"/>
  <!-- The hood at its full 27.4 x 15.3 section. -->
  <rect id="hood" x="6.25" y="0" width="27.4" height="15.3" rx="1" fill="#b9bdc2"
        stroke="#6d7379" stroke-width="0.2"/>
  <!-- The tapering rear of the hood, built as one step 20.7 x 14.26. -->
  <rect id="hood-rear" x="9.6" y="0.52" width="20.7" height="14.26" rx="1" fill="#aeb2b7"
        stroke="#6d7379" stroke-width="0.2"/>
  <!-- The two thumbscrews, diameter 4.01, on 33.32 centres. -->
  <circle id="screw-l" cx="3.29" cy="7.65" r="2.005"
          fill="#cfd3d7" stroke="#6d7379" stroke-width="0.2"/>
  <circle id="screw-r" cx="36.61" cy="7.65" r="2.005"
          fill="#cfd3d7" stroke="#6d7379" stroke-width="0.2"/>
  <!-- The cable. Its drawn radius is half the default cable-od (7.21); the
       cable-od of a wrapper or a placement resizes it. -->
  <circle id="stub" cx="19.95" cy="7.65" r="3.605"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
