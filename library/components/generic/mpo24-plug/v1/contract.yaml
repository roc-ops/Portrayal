relief:
  features:
    - node: body
      out: 15.2
      confidence: estimated
      source: >-
        generic/mpo24-plug@1's own `provenance.standoff` - the printed 25.6
        connector body less half the printed 20.7 adapter, on the stated
        assumption that two ferrules meet at the adapter's mid-plane. ABSOLUTE
        from this part's own face: std/mpo@2 puts its `mate` on nothing and so
        presents a lift of 0.0, which is why common/mpo-dust-cap@2's own
        figures are absolute from the panel too, and why this one has to clear
        common/mpo-adapter@2's bezel by being larger than it rather than by
        inheriting anything.
