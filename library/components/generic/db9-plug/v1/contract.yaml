format: 1
kind: component
name: db9-plug
version: 1.0.0
class: port
mates: db9
conforms: db9-plug
profile: networking
description: >-
  A DE-9 serial or alarm cable plug: the FEMALE nine-position D-subminiature
  connector in its backshell hood on its cable, seen from the cable end as a
  front elevation sees it seated: the hood, the two thumbscrews either side of
  it and a short straight stub of cable whose diameter is the cable-od field.
  Seats on a `db9` panel connector at its own mate point; the cable leaves
  from the far end of the stub.
size: {w: 31, h: 15.6}
size-confidence: {w: drawing, h: drawing}
size-notes: both figures are the die-cast hood NorComp drawing 979-009-030R121 dimensions, 31 across the ears and 15.6 thick at the front; a plastic or moulded hood of the same shell size is a little different
attrs: {media: db9, connector: db9, gender: female}
fields:
  cable-od: {label: Cable outside diameter, type: number, unit: mm, default: 6.2}
  jacket-color: {label: Jacket colour, type: text, default: '#1c1c1c'}
unplaced: seated by configurations downstream of this library; see docs/pluggables-design.md decision 2
provenance:
  size: >-
    drawing - registry `db9-plug`. NorComp drawing 979-009-030R121 Rev 8, 979
    Series D-Sub Backshell - Die Cast, sheet 1, for D-sub shell size 1: the
    hood is dimensioned 31 across the two ears that hold its screws and 15.6
    thick at its front, all tolerances +/-0.3. THE BOX IS THE WIDEST SECTION
    DRAWN, the ears, and the thumbscrews sit inside it.
  no-depth: >-
    NO `size.d`, DELIBERATELY, as on generic/usb-a-plug@1 and
    generic/c13-plug@1. The overall length (51.14, the 6.18 front shell and
    the 44.96 of hood behind the flange) is in the registry entry and in the
    relief below, but a `size.d` on a component with no `behaviour` compiles
    to `data-depth`, and the kit builds that as a pit behind the whole box of
    the part. The depth is carried by the relief features instead.
  gender: >-
    female - THE CORE IS MALE: std/db9@1 records that a DE-9 on equipment
    carries pins and draws them light, so the cable plug that mates it carries
    sockets. The gender is stated in `attrs` because the interface `db9` names
    the panel connector with the gender the library draws, and a plug of the
    other gender does not mate it. Sockets are on the mating face, inside the
    panel connector, and are not drawn.
  orientation: >-
    DRAWN IN THE UNROTATED CONVENTION OF THE CORE: std/db9@1 draws the long
    side of its D UP, so the front shell of this plug has its long side UP
    too, and the turn a seat applies carries that round with a rotated core.
    THE KEY IS NOT VISIBLE FROM THE CABLE END: the D is the front shell, which
    is wholly behind the hood from here, and the hood, its two screws and the
    cable are the same either way up. A plug seated the other way up would
    look identical, so which way is up is recorded here and tested on the
    shell outline alone.
  seated-depth: >-
    RULING - THE PLUG SEATS BY THE MATING DIMENSION THE DRAWING GIVES,
    MEASURED FROM THE FACE THE CORE PRESENTS. Tyco Electronics catalogue
    82068, AMPLIMITE Subminiature D Connectors (revised 1-08), p.126,
    Plug/Receptacle Mating, dimensions the two mated flanges 6.73 +/-0.38
    apart for shell sizes 1 and 2 and says the dimension is required to assure
    full mating of the connector halves. std/db9@1 presents at its own face
    (its `mate` carries no `on:` and no `seat-out`), the panel plane its
    flange lies on, so the flange of this plug stands 6.73 in front of that
    plane. Its front shell is 6.05 to 6.30 long (Amphenol M2000 Series D-Sub
    Connectors catalogue (D-Sub-01 Rev. 10/10), p.22, Solder Type Standard
    D-Sub Connector), built at 6.18, so it reaches back to 6.73 - 6.18 = 0.55
    from the panel plane, and the two shells engage along what the panel
    connector stands in front of that. THE CORE AS MODELLED AGREES ON THE
    SEAT: std/db9@1 states its depth as 6.73, the same mating dimension, so
    the lip of its modelled shell and the flange of this plug meet in one
    plane and nothing here is derived from a figure the drawing does not give.
    WHAT THE CORE DOES NOT AGREE WITH IS ITS OWN SHELL: the same Amphenol
    table gives the front shell of a panel connector as 5.82 to 6.05 long, so
    the modelled 6.73 is about 0.79 taller than a real shell, as the
    provenance of the core already says of its depth. THAT IS THE FIGURE TO
    REVISIT, and no figure of this plug moves when it is.
  frame: >-
    THE RELIEF IS MEASURED FROM THE LIFT THE HOST PRESENTS, the frame
    generic/usb-a-plug@1 and generic/c13-plug@1 use: 0 here is the panel plane
    the core stands on. The front shell is built where it is, from 0.55 to
    6.73, inside the height the shell of the core occupies: the two nest in
    the real connector and they overlap here, hidden by the hood from the
    front and by the shell of the core from the side.
  shell: >-
    drawing - Amphenol M2000 Series D-Sub Connectors catalogue (D-Sub-01 Rev.
    10/10), p.22, Solder Type Standard D-Sub Connector: the front shell of a
    socket connector of shell size 1 is 16.21 to 16.46 by 7.77 to 8.03 and
    6.05 to 6.30 long from its lip to the front of its flange. Drawn at 16.33
    by 7.9, the middle of each range, with 10 degrees of taper a side as the
    panel cutout has. THE CORNER RADIUS, 2.0, IS ESTIMATED: the table
    dimensions none. Seen from the cable end the shell is wholly behind the
    hood; it is drawn so the part of the connector in front of the hood has a
    node to build from.
  hood: >-
    drawing and scaled - NorComp drawing 979-009-030R121 Rev 8, 979 Series
    D-Sub Backshell - Die Cast, sheet 1. Dimensioned: 19.9 wide and 15.6 thick
    at the front, 13.22 wide and 12.52 thick at the cable end, 46.86 long
    overall, 31 across the ears, a lip of 1.9 in front of the slot that holds
    the connector flange, and 9.64 from the front to the top of the saddle
    washer under each screw. The flange of the connector therefore sits 1.9
    behind the very front of the casting, and the hood runs 46.86 - 1.9 =
    44.96 behind the flange face. THE LIP IS NOT BUILT: it is two tabs about a
    quarter of the hood wide, above and below the shell. The ears are built
    9.64 - 1.9 = 7.74 long. WHERE THE TAPER STARTS IS SCALED: 27.9 behind the
    flange, read on a 600 dpi render of the vector drawing calibrated on its
    own printed width, good to about 0.5. The drawing is marked not to scale,
    so that one figure is an estimate. THE EARS ARE DRAWN THE FULL THICKNESS
    OF THE HOOD, which no view dimensions. A second drawing agrees on the
    envelope: NorComp 977-009-0Y0RYY1 Rev 4, the plastic hood of the same
    shell size, gives 31.2 +/-0.5 across, 25.0 +/-0.5 between its screws, 16.4
    +/-0.5 thick and 40.7 +/-0.7 long.
  taper: >-
    scaled - built as TWO steps, not a taper, as on generic/usb-a-plug@1:
    `hood` at the full 19.9 by 15.6 section as far as the taper starts, and
    `hood-rear` for the rest at 16.56 by 14.06, midway between the front
    section and the cable end. The rear step overstates the casting near the
    cable and understates it near the body.
  thumbscrews: >-
    drawing and estimated - NorComp drawing 160-000-050R031 Rev 3, 4-40
    Thumbscrew, the thumbscrew NorComp lists for the 977, 978, 979 and 983
    hoods: 44.45 long, a 4-40 thread 5.31 long, a diameter 3.1 collar, a
    diameter 2.36 neck that ends 13.21 from the tip, and a diameter 4.01 body
    from there to the end, its last 15.88 knurled. THE HOOD DRAWING ITSELF
    SHOWS A SLOTTED MATING SCREW with a 4.20 head (979-009-030R121 sheet 2);
    the thumbscrew is the alternative the same maker lists for the same hood,
    and it is what is drawn. Each is built from the rear of the ears for 44.45
    - 13.21 = 31.24, which ASSUMES the screw is tightened with the shoulder of
    its body on the saddle washer; that puts its thread in the standoff of the
    panel connector. THE CENTRES ARE 24.99, the mounting-hole spacing registry
    `db9` holds for shell size 1 (TE catalogue 82068 p.126 prints 24.99; the
    hood drawing prints 25 +/-0.3), which is where common/db9-receptacle@1
    draws its two standoffs.
  stub: >-
    estimated - the stub rule, docs/connectors-coax-design.md section 5: a
    straight run of cable 30 long starting where the hood ends (51.69 in front
    of the panel plane). THERE IS NO SEPARATE STRAIN RELIEF TO DRAW: this hood
    clamps the cable inside and the cable leaves through a grommet in its rear
    face (979-009-030R121 sheet 2), so the stub starts at the hood. The bend
    is the installation.
  cable-od: >-
    datasheet - Belden 9539 data sheet (revision 0.540, 09-07-2025), a nine
    conductor 24 AWG foil-shielded EIA RS-232 cable: overall nominal diameter
    6.2 mm. The hood takes any cable up to 10.4 (979-009-030R121 sheet 1,
    maximum cable diameter). A placement or a wrapper sets the cable it
    actually carries.
  jacket-colour: >-
    a FIELD, and it paints the cable only. Black is the default the plugs of
    this library share. THE HELD SOURCES DO NOT AGREE ON A COLOUR: the Belden
    data sheet lists its jacket as chrome, a grey, and the one held serial
    cable assembly (Hatteland Technology appliance cables data sheet, revision
    19, p.5) is beige, hood and cable alike. THE HOOD IS NOT A FIELD: it is
    drawn in the nickel of the die-cast hood the dimensions come from
    (NorComp, zinc alloy, nickel plated), and the thumbscrews are
    nickel-plated steel.
  no-mark: >-
    NOTHING IS PRINTED OR EMBOSSED ON THE HOOD. No logo, no part number and no
    screw slots are drawn: the skin is the outlines its relief builds from.
  behaviour: >-
    DELIBERATELY OMITTED, as on generic/bnc-plug@1 - every class port contract
    states none (spec/tests/test_behaviour.py).
  axis: >-
    derived - `mate` and `cable` share one point, the centre of the hood
    (15.5, 7.8), which is also the centre of the front shell: the cable runs
    straight through the connector, so its front and its rear are one axis
    seen from two directions. The two thumbscrews are 12.495 either side of
    it.
