<svg xmlns="http://www.w3.org/2000/svg" width="31mm" height="15.6mm" viewBox="0 0 31 15.6">
  <!-- Drawn from the cable end, as a front elevation sees a seated plug, in
       the convention of std/db9@1: the long side of the D up. Nothing that
       keys the plug is visible from here. Farthest from the viewer first. Each
       node is the whole art of its relief feature. -->
  <!-- The front shell, 16.33 x 7.9, long side up. Behind the hood from here;
       the part of the connector in front of the hood builds from this outline. -->
  <path id="shell" fill="#c9cdd1" d="M7.749 6.197 A2.000 2.000 0 0 1 9.719 3.850 L21.281 3.850 A2.000 2.000 0 0 1 23.251 6.197 L22.563 10.097 A2.000 2.000 0 0 1 20.594 11.750 L10.406 11.750 A2.000 2.000 0 0 1 8.437 10.097 Z"/>
  <!-- The ears of the hood, 31 across, that hold the two screws. -->
  <rect id="hood-front" x="0" y="0" width="31" height="15.6" rx="1" fill="#b4b8bd"
        stroke="#6d7379" stroke-width="0.2"/>
  <!-- The hood at its full 19.9 x 15.6 section. -->
  <rect id="hood" x="5.55" y="0" width="19.9" height="15.6" rx="1" fill="#b9bdc2"
        stroke="#6d7379" stroke-width="0.2"/>
  <!-- The tapering rear of the hood, built as one step 16.56 x 14.06. -->
  <rect id="hood-rear" x="7.22" y="0.77" width="16.56" height="14.06" rx="1" fill="#aeb2b7"
        stroke="#6d7379" stroke-width="0.2"/>
  <!-- The two thumbscrews, diameter 4.01, on 24.99 centres. -->
  <circle id="screw-l" cx="3.005" cy="7.8" r="2.005"
          fill="#cfd3d7" stroke="#6d7379" stroke-width="0.2"/>
  <circle id="screw-r" cx="27.995" cy="7.8" r="2.005"
          fill="#cfd3d7" stroke="#6d7379" stroke-width="0.2"/>
  <!-- The cable. Its drawn radius is half the default cable-od (6.2); the
       cable-od of a wrapper or a placement resizes it. -->
  <circle id="stub" cx="15.5" cy="7.8" r="3.1"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
