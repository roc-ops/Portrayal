<svg xmlns="http://www.w3.org/2000/svg" width="33.75mm" height="25.75mm" viewBox="0 0 33.75 25.75">
  <!-- Drawn from the cable end, as a front elevation sees a C20 seated in a
       C19 outlet, in the outlet's own convention: long axis across. Farthest
       from the viewer first. Each node is the whole art of its relief feature. -->
  <!-- The shroud, 33.75 x 25.75, that enters the outlet's well over the C19
       nose. Behind the overmould from here; the 1.3 of it left in front of
       the outlet builds from this outline. -->
  <rect id="shroud" x="0" y="0" width="33.75" height="25.75" rx="4" fill="#1c1c1c"/>
  <!-- The overmould, the same section as the shroud. -->
  <rect id="body" x="0" y="0" width="33.75" height="25.75" rx="4"
        fill="#26282b" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The strain relief, 15 across where it leaves the overmould. -->
  <circle id="relief-boot" cx="16.875" cy="12.875" r="7.5"
          fill="#202225" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The cord. Its drawn radius is half the default cable-od (9.65); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="16.875" cy="12.875" r="4.825"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
