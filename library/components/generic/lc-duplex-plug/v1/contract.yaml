format: 1
kind: component
name: lc-duplex-plug
version: 1.0.1
class: port
mates: lc-duplex
optical: {positions: 2}
profile: networking
description: >-
  An LC duplex plug - the cable end that fills BOTH ports of a duplex LC
  adapter at once. Two generic/lc-plug@1 bodies held SIDE BY SIDE at the 6.25
  duplex pitch by a clip, so each half keeps the plug's own front profile, its
  own rear point and its own relief, and a boot can seat behind either one.
  Occupies the `lc-duplex` slot a duplex adapter presents on itself (B3,
  docs/pluggables-caps-design.md, "The duplex host"), which is mutually
  exclusive with that adapter's two bore slots - so a port takes this OR two
  simplex parts, never both. `generic/` because what it fixes is the standard's
  (see `provenance.standard`); what the clip adds is declared as a modelling
  choice rather than dressed as a reading.
size: {w: 11.83, h: 10.43}
size-confidence: {w: drawing, h: drawing}
attrs: {media: fiber, connector: lc}
unplaced: >-
  seated by a device that places or composes a duplex LC adapter - none
  declares one yet. spec/tests/test_fibre_plugs.py seats it as a configured
  occupant on copies of two real devices: smartoptics/dcp-r-34d-cs, which
  places common/lc-duplex-adapter@4 directly, and fs/fhd-1ufce with an FHD LC
  cassette in bay-1, which reaches common/lc-duplex-v-adapter@4 three levels
  down.
provenance:
  standard: >-
    `generic/`, AND THE REASON IS THE PITCH RATHER THAN THE ENVELOPE - which is
    what docs/pluggables-caps-design.md gives under "Parts" when it puts this
    part in that namespace: the pitch the clip holds is the standard's, the
    clip's own outline is not, and the part is required to say which of its
    figures are which. That is what the keys below do.
    NO `conforms:`, DELIBERATELY, and this is the one place this part departs
    from generic/lc-plug@1's shape. `lc-duplex-receptacle` is 4.7 x 6.3 - ONE
    bore of a transceiver face, not the pair - and `lc-plug` is 5.58 x 10.43,
    one plug. Neither describes a duplex plug's outline and no registry entry
    does; declaring either would make L9 compare this part's 11.83 x 10.43
    against a single connector's figures and fail, and inventing a registry
    entry for an outline no standard governs is the error common/lc-boot@1
    refuses for a boot. So the envelope claim is made where it can be held:
    both halves ARE generic/lc-plug@1, whose own `conforms: lc-plug` L9 checks,
    and the one figure the clip contributes is the pitch, which
    `provenance.pitch` ties to the registry and which lint's own duplex pitch
    rule already holds every adapter this seats in to.
  pitch: >-
    6.25, THE STANDARD'S, not measured here and not re-derived. It is
    spec/schemas/standards.yaml's `lc-duplex-receptacle` `pitch`, at
    `pitch-confidence: verified` and `pitch-kind: target` - "the duplex
    interface pitch itself, not a layout clearance ... there is no 'wider is
    fine' reading of a keyed mating interface". Both duplex adapters in the
    library sit their bores on it: common/lc-duplex-adapter@4 places its two
    at x 1.125 and 7.375, and common/lc-duplex-v-adapter@4 its two at y 0.60
    and 6.85. The two halves here are placed 6.25 apart for the same reason
    and from the same figure, held once in the registry rather than restated.
  size: >-
    DERIVED, not measured, and it is arithmetic on two figures that are each
    sourced elsewhere: 6.25 (the pitch, above) plus 5.58 (generic/lc-plug@1's
    own drawing-confidence body width, from SENKO DS-LC-000004 Rev A) is
    11.83, and the height is that plug's own 10.43 silhouette unchanged
    because the two halves sit level. `size-confidence: drawing` on both axes
    is a statement about where those two figures come from, not a claim that
    anybody dimensioned a duplex plug 11.83 wide.
    THE TWO BODIES DO NOT TOUCH: 6.25 - 5.58 leaves 0.67 between them, which
    is the gap the clip's web fills and the one figure in `elements` that is
    a consequence rather than a source.
    NO DEPTH, for the reason generic/lc-plug@1 carries none: three SENKO
    drawings give an LC plug's overall length only as a parenthesised
    REFERENCE and none of them agrees with the others, because the back end is
    the assembler's. A duplex plug inherits that exactly.
  clip: >-
    A MODELLING CHOICE, AND NO SOURCE HERE DIMENSIONS IT. No document in this
    corpus draws a duplex LC clip: the LC intake (SENKO DS-LC-000004,
    DS-LC-000010, DS-LC-000023) is three simplex plug and adapter drawings,
    and the clip is the moulding a cable assembler fits afterwards - which is
    also why the LC plug carries no depth. What is drawn here is the least
    that makes the pair read as one part: the 0.67 web between the two plug
    bodies, at the bodies' own height (5.58 wide bodies start 4.78 down the
    10.43 silhouette and run 5.65 - generic/lc-plug@1's own `elements`), given
    the same `out` as those bodies because it is the same moulding seen
    end-on. It adds no width and no height: `size` is the two halves' bounding
    box and nothing more.
    WHAT IS NOT DRAWN. A real duplex clip wraps the outside of both bodies and
    carries a trigger bar across the two latches. Drawing either would put an
    outline on the face that no document supports and would change `size`, so
    neither is drawn - the same restraint generic/lc-plug@1 records for its
    own ferrule detail.
  axis: >-
    the `mate` at (5.915, 7.61) is the MIDPOINT OF THE TWO HALVES' OWN MATE
    POINTS, computed rather than chosen: generic/lc-plug@1 puts its mate at
    (2.79, 7.61), so half `a` at [0, 0] lands it at (2.79, 7.61) and half `b`
    at [6.25, 0] at (9.04, 7.61); the midpoint is (5.915, 7.61), which is also
    11.83/2 across. That is the point a duplex adapter presents - B3's "a
    duplex LC adapter presents `lc-duplex` at the midpoint of its two bores" -
    so seating this on either adapter lands each half's own mate on the
    corresponding bore's, which spec/tests/test_fibre_plugs.py checks in the
    device frame to 1e-6 rather than trusting the arithmetic here.
  orientation: >-
    DRAWN SIDE BY SIDE, WHICH IS THE CANONICAL AXIS, AND THE HOST SUPPLIES THE
    REST. common/lc-duplex-adapter@4 (Smartoptics) puts its two bores side by
    side and this plug lands on them exactly. common/lc-duplex-v-adapter@4
    (the FS FHD cassettes) puts the same pair STACKED - its own provenance
    calls it "the same duplex pair stood on end" - and an occupant cannot be
    turned relative to its host: render.solve_seat takes the host's rotation
    and refuses an occupant that declares a different one.
    SO THE ADAPTER SAYS WHICH WAY ROUND ITS PAIR RUNS. A spanning slot
    publishes the turn that carries the canonical across axis onto its own
    bores, derived from those bores (manifest.spanning_axis), and the seat
    applies it: this plug is drawn across on the Smartoptics adapter and
    turned onto the stacked pair on an FHD one, from one drawing, with half
    `a` landing on the adapter's first bore either way. Lint L112 holds every
    part mating a spanning interface to this axis, so the two sides of the
    arrangement cannot drift apart. This WAS a stated gap, shared with
    common/lc-duplex-dust-cap, whose @1 was drawn stacked and whose @2 is
    drawn across for the same reason; drawing this one at the standard's own
    arrangement is also what keeps the pitch figure honest.
  halves: >-
    TWO WHOLE PLUGS, NOT A REDRAWN PAIR, which is what
    docs/pluggables-caps-design.md asks for: "It composes two
    `generic/lc-plug@1` rather than redrawing one, so each half keeps the
    plug's own rear point and a boot can seat behind either." Each half
    therefore brings generic/lc-plug@1's four keyed tiers, its `lc-plug`
    interface presented at its own `boot` point, and its own relief (body
    12.5, latch 6.6), and nothing here restates any of them.
    HOW A BOOT REACHES ONE HALF. The halves are composed parts with ids `a`
    and `b`, so a boot is keyed on the half's part id UNDER the plug's own
    seat: with the plug seated at `port-1510`, `port-1510-occupant/a` seats a
    common/lc-boot@1 on half `a`. `port-1510-occupant` alone is NOT how a half
    is addressed - the plug as a whole presents no interface (it composes two
    parts that do, and manifest.presented_interface declines to pick one), so
    a boot keyed there has nothing to mate. See
    spec/tests/test_fibre_plugs.py, which seats one on each half.
  optical: >-
    `positions: 2` - two fibre positions, one per half. Not the sum of the
    halves computed by anything: generic/lc-plug@1 states 1 and this states 2,
    the way spec/schemas/component.schema.json describes the key ("2 for an LC
    duplex"). spec/tests/test_connector_sweep.py requires it of every fibre
    connector, and without it this part drops out of every optical coverage
    check without erroring.
parts:
  # SIDE BY SIDE AT THE 6.25 DUPLEX PITCH (provenance.pitch), unrotated: each
  # half is generic/lc-plug@1 as drawn, latch up, so the pair reads the way a
  # duplex patch cord's two plugs do. The halves are 5.58 wide, so 6.25 leaves
  # 0.67 between them, which is the clip web below.
  - {id: a, ref: generic/lc-plug@1, at: [0.0, 0.0]}
  - {id: b, ref: generic/lc-plug@1, at: [6.25, 0.0]}
elements:
  clip: {at: [5.58, 4.78], size: [0.67, 5.65], class: latch}
connection-points:
  mate: {at: [5.915, 7.61], direction: front}
relief:
  features:
    - node: clip
      out: 12.5
      confidence: estimated
      source: >-
        THE SAME FIGURE THE TWO HALVES CARRY, and it is theirs, not a new
        reading: generic/lc-plug@1's `body` feature stands `out: 12.5` at
        `confidence: estimated`, bracketed 11.6 to 13.4 in its own
        `provenance.standoff`. The web is the same moulding as the bodies it
        joins seen end-on, so it stands to the same face; giving it anything
        else would open or close a step across the front of one part for no
        stated reason. Inherits that estimate and is no better than it.
        ABSOLUTE from this part's own face, like every `out`: the lift that
        puts the plug on a lifted bezel arrives with the seat.
skins: [default]
