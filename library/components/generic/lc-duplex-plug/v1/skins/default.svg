<svg width="11.83mm" height="10.43mm" viewBox="0 0 11.83 10.43" xmlns="http://www.w3.org/2000/svg">
  <!-- ONLY THE CLIP IS DRAWN HERE. The two halves are composed parts
       (generic/lc-plug@1 at x 0 and x 6.25) and each draws itself with its own
       skin, which is the whole point of composing them rather than redrawing a
       pair - see provenance.halves.

       The web is the 0.67 the 6.25 pitch leaves between two 5.58 bodies, at
       the bodies' own height (4.78 down the 10.43 silhouette, 5.65 tall). It
       is a modelling choice and provenance.clip says so: no document in this
       corpus dimensions a duplex LC clip. -->
  <rect id="clip" x="5.58" y="4.78" width="0.67" height="5.65" class="latch" fill="#6d737b"/>
</svg>
