<svg xmlns="http://www.w3.org/2000/svg" width="38.9mm" height="38.9mm" viewBox="0 0 38.9 38.9">
  <!-- NEMA 5-20P straight-blade plug, face on: Leviton CATSTD-05366-00C-D01 rev 1, read
       off its 1:1 vector face view. Earth pin up; the line blade on the right; the
       neutral blade, turned a quarter, on the left - the 5-20 key. -->
  <circle id="grip" cx="19.45" cy="19.45" r="19.45" fill="#1b1c1e" stroke="#4a4d51" stroke-width="0.25"/>
  <circle id="face" cx="19.45" cy="19.45" r="17.65" fill="#2a2c2f" stroke="#4a4d51" stroke-width="0.2"/>
  <circle id="insulator" cx="19.45" cy="19.45" r="16.45" fill="#232527" stroke="#3a3c3f" stroke-width="0.15"/>
  <g id="screws" fill="#5d6166" stroke="#3a3c3f" stroke-width="0.15">
    <circle cx="19.4" cy="32.9" r="2.58"/>
    <circle cx="6.75" cy="14.8" r="2.58"/>
    <circle cx="32.1" cy="14.8" r="2.58"/>
  </g>
  <circle id="pin-g" cx="19.42" cy="10.72" r="2.38" fill="#b08d57"/>
  <rect id="blade-line" x="24.98" y="19.44" width="1.55" height="6.35" fill="#b08d57"/>
  <rect id="blade-neutral" x="9.93" y="21.84" width="6.35" height="1.55" fill="#b08d57"/>
</svg>
