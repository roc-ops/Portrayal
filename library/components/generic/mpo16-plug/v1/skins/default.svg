<svg width="12.5mm" height="7.6mm" viewBox="0 0 12.5 7.6" xmlns="http://www.w3.org/2000/svg">
  <!-- Front view, as a seated plug shows it (from its boot end, key up). The
       12.5 x 7.6 housing (printed), the 3.65 x 0.68 key rib across the top
       face with its centre 1.12 RIGHT of the centreline (measured - see
       provenance.key for the convention), the MT ferrule in its 6.36 x 2.46
       window (measured) and the two guide-pin bores 5.3 apart (printed).

       THE KEY, THE FERRULE AND THE PIN BORES ARE INSIDE THE BODY GROUP, the
       idiom generic/mpo12-plug@1 uses: a node standing `out` is moved to the
       end of the instance, so art drawn as its sibling would be painted over.

       The sixteen fibre bores are not drawn - at 0.11 mm they are smaller
       than the line weight - and the count is carried by optical.positions. -->
  <g id="body" class="port">
    <rect x="0.0" y="0.0" width="12.5" height="7.6" rx="3.0" ry="3.0"
          fill="#7b818a" stroke="#4a4f55" stroke-width="0.12"/>
    <rect id="key" x="5.545" y="0.4" width="3.65" height="0.68" rx="0.15"
          fill="#8a9099" stroke="#4a4f55" stroke-width="0.1"/>
    <rect id="ferrule" x="3.07" y="2.57" width="6.36" height="2.46" rx="0.2"
          fill="#c7ccd1" stroke="#4a4f55" stroke-width="0.12"/>
    <circle id="pin-bore-l" cx="3.6" cy="3.8" r="0.3" fill="#2a2d31"/>
    <circle id="pin-bore-r" cx="8.9" cy="3.8" r="0.3" fill="#2a2d31"/>
  </g>
  <!-- FIBRE POSITIONS 1-16, ZERO INK: addresses on the ferrule row at the 0.25
       pitch, centred on the window, fibre 1 on the RIGHT. See the contract's
       provenance.fibre-positions. -->
  <rect id="1" x="8.05" y="3.725" width="0.15" height="0.15" fill="none"/>
  <rect id="2" x="7.8" y="3.725" width="0.15" height="0.15" fill="none"/>
  <rect id="3" x="7.55" y="3.725" width="0.15" height="0.15" fill="none"/>
  <rect id="4" x="7.3" y="3.725" width="0.15" height="0.15" fill="none"/>
  <rect id="5" x="7.05" y="3.725" width="0.15" height="0.15" fill="none"/>
  <rect id="6" x="6.8" y="3.725" width="0.15" height="0.15" fill="none"/>
  <rect id="7" x="6.55" y="3.725" width="0.15" height="0.15" fill="none"/>
  <rect id="8" x="6.3" y="3.725" width="0.15" height="0.15" fill="none"/>
  <rect id="9" x="6.05" y="3.725" width="0.15" height="0.15" fill="none"/>
  <rect id="10" x="5.8" y="3.725" width="0.15" height="0.15" fill="none"/>
  <rect id="11" x="5.55" y="3.725" width="0.15" height="0.15" fill="none"/>
  <rect id="12" x="5.3" y="3.725" width="0.15" height="0.15" fill="none"/>
  <rect id="13" x="5.05" y="3.725" width="0.15" height="0.15" fill="none"/>
  <rect id="14" x="4.8" y="3.725" width="0.15" height="0.15" fill="none"/>
  <rect id="15" x="4.55" y="3.725" width="0.15" height="0.15" fill="none"/>
  <rect id="16" x="4.3" y="3.725" width="0.15" height="0.15" fill="none"/>
</svg>
