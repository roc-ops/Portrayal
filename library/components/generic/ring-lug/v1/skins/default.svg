<svg xmlns="http://www.w3.org/2000/svg" width="5.5mm" height="47.4mm" viewBox="0 0 5.5 47.4">
  <!-- A one-hole insulated ring terminal on its wire, seen in plan, as a
       front elevation sees it lying on a terminal screw: the ring at the
       top, the wire leaving downward in the plane of the face. Farthest from
       the viewer first. Each node is the whole art of its relief feature. -->
  <!-- The tongue: a ring 5.5 across round a 3.2 stud hole, necking to the
       crimp barrel 5.65 below the hole centre. -->
  <path id="tongue" fill-rule="evenodd" fill="#c9cdd1" stroke="#6d7379" stroke-width="0.12"
        d="M 0.643 4.518 A 2.75 2.75 0 1 1 4.857 4.518 L 4.4 8.4 H 1.1 Z M 4.35 2.75 A 1.6 1.6 0 1 0 1.15 2.75 A 1.6 1.6 0 1 0 4.35 2.75 Z"/>
  <!-- The insulating sleeve over the crimp barrel, 4.5 across and 9.0 long. -->
  <rect id="sleeve" x="0.5" y="8.4" width="4.5" height="9" rx="0.4"
        fill="#3250d2" stroke="#1f3180" stroke-width="0.12"
        data-fill-from="barrel-color" data-stroke-derive="barrel-color"/>
  <!-- The wire, 3.0 across, a 30 stub from the end of the sleeve. -->
  <rect id="wire" x="1.25" y="17.4" width="3" height="30"
        fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
        data-fill-from="wire-color"/>
  <!-- The head of the screw that holds the lug, drawn by the lug: the host's
       own head is under the tongue. -->
  <g id="head">
    <circle cx="2.75" cy="2.75" r="1.9" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2"/>
    <path d="M 1.2 2.75 H 4.3 M 2.75 1.2 V 4.3" fill="none" stroke="#5b6167" stroke-width="0.3" stroke-linecap="round"/>
  </g>
</svg>
