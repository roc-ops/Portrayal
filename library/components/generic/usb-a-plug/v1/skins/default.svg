<svg xmlns="http://www.w3.org/2000/svg" width="16mm" height="8mm" viewBox="0 0 16 8">
  <!-- Drawn from the cable end, as a front elevation sees a seated Standard-A
       plug, in the receptacle's own convention: insulator down, icon side up.
       Nothing that keys the plug is visible from here. Farthest from the
       viewer first. Each node is the whole art of its relief feature. -->
  <!-- The plug shell, 12.0 x 4.5. Behind the overmould from here; the 2.87 of
       it in front of the receptacle builds from this outline. -->
  <rect id="shell" x="2" y="1.75" width="12" height="4.5" fill="#c9cdd1"/>
  <!-- The overmould at the 16.0 x 8.0 maximum section. -->
  <rect id="body" x="0" y="0" width="16" height="8" rx="1" fill="#26282b"
        stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The overmould's tapering rear, built as one step 11.5 wide. -->
  <rect id="body-rear" x="2.25" y="0" width="11.5" height="8" rx="1" fill="#2c2e32"
        stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The strain relief, 6.9 across. -->
  <circle id="relief-boot" cx="8" cy="4" r="3.45"
          fill="#202225" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The cable. Its drawn radius is half the default cable-od (4.06); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="8" cy="4" r="2.03"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
