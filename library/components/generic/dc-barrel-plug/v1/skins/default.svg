<svg xmlns="http://www.w3.org/2000/svg" width="8.2mm" height="8.2mm" viewBox="0 0 8.2 8.2">
  <!-- Drawn from the cable end, as a front elevation sees a seated barrel
       plug. The plug is round and the same any way up. The 5.5 barrel is in
       the jack and is not drawn. Farthest from the viewer first. Each node is
       the whole art of its relief feature. -->
  <!-- The flange that stops against the jack, diameter 7.8. -->
  <circle id="flange" cx="4.1" cy="4.1" r="3.9"
          fill="#c9cdd1" stroke="#6d7379" stroke-width="0.12"/>
  <!-- The grip, the round cover, diameter 8.2. -->
  <circle id="grip" cx="4.1" cy="4.1" r="4.1"
          fill="#26282b" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The cable. Its drawn radius is half the default cable-od (4.0); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="4.1" cy="4.1" r="2"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
