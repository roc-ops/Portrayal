<svg xmlns="http://www.w3.org/2000/svg" width="77.2mm" height="13.6mm" viewBox="0 0 77.2 13.6">
  <!-- The module faceplate: 82.0 x 14.0 on the 77.2 x 13.6 body (CFP MSA
       Module Dimensions drawing, A1 and B1 - provenance.head), 0.1 inside
       the head box for the stroke. It overhangs this viewBox on purpose, as
       a head does. FIRST CHILD, so render.py never raises it. -->
  <rect id="body" x="-2.3" y="-0.1" width="81.8" height="13.8" rx="0.6" fill="#9aa0a8" stroke="#6e747c" stroke-width="0.2"/>
  <!-- The receptacle housing the two bores sit in, painted: the bores are
       composed parts and carry their own depth. It frames the keyed
       std/lc-bore@3 openings by 0.30. -->
  <rect id="opening" x="32.825" y="2.55" width="11.55" height="6.9" rx="0.4" fill="#2a2f34"/>
  <g font-family="sans-serif" font-size="0.9" fill="#2a2f34" text-anchor="middle">
    <g id="silkscreen">
      <text x="35.475" y="11.9">T</text>
      <text x="41.725" y="11.9">R</text>
      <text id="label" x="38.6" y="13.2" data-from="label" font-size="0.7"></text>
    </g>
  </g>
</svg>
