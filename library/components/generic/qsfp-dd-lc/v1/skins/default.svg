<svg xmlns="http://www.w3.org/2000/svg" width="18.35mm" height="8.5mm" viewBox="0 0 18.35 8.5">
  <rect id="body" x="0.1" y="0.1" width="18.15" height="8.3" rx="0.8" fill="#8d949c" stroke="#61686f" stroke-width="0.18"/>
  <!-- The receptacle housing the two bores sit in. Painted, not a cavity - the
       bores are composed parts and carry their own depth. It is 6.90 tall rather
       than 5.30 because std/lc-bore@3's opening is KEYED and 6.3 tall (#126): a
       5.30 housing cannot contain it at any position, and the latch tongues
       rendered poking out onto bare face. 0.65 to 7.55 frames the aperture
       (0.95 to 7.25) by 0.30 all round and still clears the T/R silkscreen. -->
  <rect id="opening" x="3.40" y="0.65" width="11.55" height="6.90" rx="0.4" fill="#2a2f34"/>
  <!-- T and R were #8d949c on a #8d949c face - the same value as the metal they
       sat on, so they had never once been visible. The taller housing above put
       half of each letter over dark and made that obvious. Darkened to the
       body's own stroke colour, and dropped to 8.30 at 0.9 so they clear the
       housing's lower edge (7.55) rather than straddling it. -->
  <g font-family="sans-serif" font-size="0.9" fill="#61686f" text-anchor="middle">
    <g id="silkscreen">
      <text x="6.05" y="8.30">T</text>
      <text x="12.30" y="8.30">R</text>
      <text id="label" x="9.175" y="8.30" data-from="label"></text>
    </g>
  </g>
  <!-- The pull tab, drawn here rather than composed (see provenance.tab) -
       19.00 MAX straddling the 18.35 face at the same x common/qsfp-transceiver@1
       composed common/qsfp-pull-tab@1 at (-0.325), 3.40 MAX thick, centred on the
       face's vertical middle (4.25). data-fill-from lets a placement's
       latch-color field recolour it; the literal fill is the drawing's own
       PULL LATCH COLOR WHITE. -->
  <rect id="tab" x="-0.325" y="2.55" width="19.0" height="3.40" rx="0.5" fill="#f2f2f2"
        stroke="#9a9a9a" stroke-width="0.12" data-fill-from="latch-color"/>
</svg>
