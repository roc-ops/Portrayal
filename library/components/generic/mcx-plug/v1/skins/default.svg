<svg xmlns="http://www.w3.org/2000/svg" width="5mm" height="5mm" viewBox="0 0 5 5">
  <!-- Drawn end-on, as a front elevation sees a seated MCX plug. The ribbed
       snap-on grip, 5.0 across; then the crimp ferrule, 4.0 across; then the
       cable, nearest the viewer. The slotted outer contact is inside the
       jack and not drawn. Each node is the whole art of its relief
       feature. -->
  <circle id="coupling" cx="2.5" cy="2.5" r="2.5"
          fill="#c9ccd0" stroke="#7d8388" stroke-width="0.12"/>
  <circle id="relief-boot" cx="2.5" cy="2.5" r="2.0"
          fill="#b8bcc0" stroke="#7d8388" stroke-width="0.12"/>
  <!-- The cable. Its drawn radius is half the default cable-od (2.49); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="2.5" cy="2.5" r="1.245"
          fill="#1c1c1c" stroke="#111111" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
