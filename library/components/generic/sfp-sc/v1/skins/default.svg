<svg xmlns="http://www.w3.org/2000/svg" width="13.55mm" height="8.55mm" viewBox="0 0 13.55 8.55">
  <!-- The head: the whole front of a seated SC SFP. 14 MAX wide on the 13.55
       body, 2.1 above it and 1.4 below (Superxon Figure 8, 6COM p8 -
       provenance.head), 0.1 inside the head box for the stroke. FIRST CHILD,
       so render.py never raises it. The SC opening is the composed
       std/sc-bore@1, turned so its long axis is horizontal. -->
  <rect id="body" x="-0.125" y="-2.0" width="13.8" height="11.85" rx="0.5"
        fill="#9aa0a8" stroke="#6e747c" stroke-width="0.2"/>
  <!-- The bail bar along the bottom of the head: 8.4 wide (Superxon end view,
       scaled), the rest estimated - provenance.latch. data-fill-from lets a
       wrapper recolour it; the literal stroke is the shade of the default. -->
  <rect id="bail" x="2.575" y="8.6" width="8.4" height="1.3" rx="0.65" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.18" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <g id="silkscreen">
    <text id="label" x="6.775" y="-0.75" font-family="sans-serif" font-size="0.9"
          text-anchor="middle" fill="#2a2f34" data-from="label"></text>
  </g>
</svg>
