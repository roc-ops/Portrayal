<svg xmlns="http://www.w3.org/2000/svg" width="9.3mm" height="39.4mm" viewBox="0 0 9.3 39.4">
  <!-- A spade (fork) terminal on its wire, seen in plan, as a front elevation
       sees it slid onto a post: the tongue at the top with its slot open at the
       tip, the wire leaving downward in the plane of the face. Farthest from
       the viewer first. Each node is the whole art of its relief feature. -->
  <!-- The tongue: 9.3 across, a slot 4.0 wide open at the tip and closed half
       round at its centre, necking to the crimp barrel 14.2 below the tip. -->
  <path id="tongue" fill="#c9cdd1" stroke="#6d7379" stroke-width="0.12"
        d="M 0 0 H 2.65 V 4.65 A 2 2 0 0 0 6.65 4.65 V 0 H 9.3 V 8 L 7.4 14.2 H 1.9 L 0 8 Z"/>
  <!-- The insulating sleeve over the crimp barrel, 7.6 across and 15.2 long. -->
  <rect id="sleeve" x="0.85" y="14.2" width="7.6" height="15.2" rx="0.6"
        fill="#fcdc14" stroke="#9a860c" stroke-width="0.12"
        data-fill-from="barrel-color" data-stroke-derive="barrel-color"/>
  <!-- The wire, 2.6 across, a 10 stub from the end of the sleeve. -->
  <rect id="wire" x="3.35" y="29.4" width="2.6" height="10"
        fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
        data-fill-from="wire-color"/>
</svg>
