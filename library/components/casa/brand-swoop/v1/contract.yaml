format: 1
kind: component
name: brand-swoop
version: 1.0.0
class: marking
profile: networking
description: >-
  The curved moulding on the C100G front bezel, between the casa systems mark
  and the model name. A closed lens-shaped outline, not a filled graphic.
attrs: {model: 'Bezel Swoop'}
size: {w: 258.3, h: 40.5, d: 1.0}
provenance:
  path: 'drawing - Jason''s hand-built front SVG, `swoop`. Its nested transforms
    were not composed by hand; the path was SAMPLED at 160 points along its
    length through the browser CTM and decimated to 80, so the curve here is the
    measured curve rather than a redrawn approximation'
  style: drawing - his path is closed, fill none, stroked 0.72 in a 190.26-wide
    frame, which is 1.64 here. Drawn as an outline because that is what the
    source is - a moulded groove reads as an outline, a printed graphic would
    not
  extent: drawing - 48.66 to 162.13 across and 4.62 to 24.08 down in his frame,
    mapped fractionally onto our 432.95 x 571 body
skins: [default]
