format: 1
kind: module
name: csc-8x10g
version: 1.3.0
class: line-card
profile: networking
description: >-
  Casa CCAP Services Card (CSC8x10G) for the C100G/C40G CCAP chassis. Eight
  10GbE SFP+ ports (XG0-XG7) in two ganged blocks of four, carrying the DOCSIS
  and EQAM MAC functions to Distributed Access nodes, plus a bank of eight
  two-lamp port rows and the STATUS, ACTIVE and ALARM cluster. Out-of-band
  signalling is on the separate optional CSC I/O card, not on this faceplate.
size: {w: 30.47, h: 345.5, d: 380.0}
attrs:
  model: 'CSC 8x10G'
  role: ccap-services
  sfp-plus: '8'
  power-draw-max-w: 250
provenance:
  layout: 'photo-measured - the CSC8x10G data sheet (CSC R7, May 2019) product photograph,
    read as fractions of the known 345.5 card height. Top to bottom: the CCAP 8x10G
    legend between two orange bands, XG0-XG3 in one ganged bezel, XG4-XG7 in a second,
    a separate bank of eight port-lamp rows labelled XG0-XG7 in two groups of four,
    then STATUS, ACTIVE, ALARM and the graduated stripe motif. Note the lamp order
    is STATUS, ACTIVE, ALARM here and on the SMM cards, but STATUS, ALARM, ACTIVE
    on the DQM and DCU line cards - one rule for all of them would be wrong'
  size: shared with the rest of the C100G front-card family, taken from the chassis
    slot envelope (30.47 x 345.5, C100G device manifest); the depth is the family
    estimate carried by casa/smm-8x10g
  legend: 'drawing - the model legend sits between TWO orange bands, not below one,
    which is the first thing three product photographs settle and which casa/smm-8x10g
    does not show. Position is casa/bdm''s, from Figure 1-14: 20.42 and 33.76. The
    DS8x96, CSC8x10G and SMM300G photographs put them at 21.1-22.5 and 34.1-35.4,
    consistently 1.3-1.6mm lower and in the same direction as they put the DS card''s
    stripe groups 5.6mm lower - one perspective bias across all three, not three
    findings - so the figure is carried and the whole front-card family lines up'
  ports: composed from std/ aperture components rather than drawn as rectangles.
    The ganged blocks use std/sfp-ganged (SFF-8433, the port's share of a continuous
    1xN slot, so adjacent instances abut with no gap) and std/qsfp-ganged; the two
    jacks reuse common/rj45-shielded@2 exactly as casa/smm-8x10g does
  rotation: every cage is ROTATED 90. A ganged SFP opening is 14.25 x 10.4 and the
    faceplate is only 30.47 wide, so the long axis has to run down the card. The
    SMM300G photograph measures the openings at 10.1mm across (7.5 to 17.6mm from
    the plate edge on the CSC, independently), which is the rotated width, and the
    vertical pitch measures 14.0-14.2 against the 14.25 the standard specifies
  port-pitch: registry (SFF-8433 B04, 14.25 Basic) confirmed by photograph - the
    photograph measures 13.8-14.1 between adjacent cages, and the standard figure
    is carried because a ganged block's pitch is specified, not chosen. Block A
    starts at 81.1 and block B at 142.4, both photo-measured
  port-lamps: photo-inferred - two lamps per port, on either side of the port legend,
    in a bank BELOW the cages rather than beside them. The photograph resolves the
    dots and the XG0-XG7 legends; no document held here gives their colour vocabulary,
    so no states are declared
  stripes: photo-measured - five stripes below the lamp cluster, thick to thin downward.
    The lower two measure under 0.2mm, which is the photograph's resolution limit,
    and are drawn at 0.35
  power-draw-max-w: 'datasheet - the CCAP Services Card CSC8x10G data sheet (CSC
    R7, May 2019) technical specifications: ''Total Power 250W''. This card is not
    in the C100G install guide''s Appendix A tables, which predate it, so the data
    sheet is the only source and there is nothing to cross-check it against'
  compliance: not stated - the CSC8x10G data sheet carries no compliance line at
    all, unlike the SMM300G sheets which both give NEBS level 3
  faceplate-hardware-photo: 'THE OWNER SUPPLIED AN ISOMETRIC OF THE C100G FRONT and it
    corrects the SHAPE of two things on this faceplate. working/photos/casa/ -
    c100g-front-isometric.png and the crop crop-ejectors.png, read at high zoom.
    WHAT IT SETTLES:
    - The captive screw is not a flat slotted head. It is a substantial BLACK KNURLED
      KNOB standing well proud, with a dark top face and a light metallic band. `knurl`
      is added for that reason - it is a shape fact and costs no dimension. The drawn
      2D head is still a slotted circle and is NOT redrawn; the figures draw it that way
      and this photograph cannot give a true elevation of it.
    - The EJECTOR LEVER is the most prominent thing on the whole face: a large CURVED
      BLACK lever, not the rounded strip this skin draws, with a thin vertical linkage
      rod running down the card from the knob to it.
    - RELATIVE PROMINENCE, which is the one quantitative thing a perspective view CAN
      give: lever stands proud of knob stands proud of lamp. This contract already
      orders them that way - 4.2, 1.6, 0.3 - so the photograph CONFIRMS the ordering
      rather than correcting it. Only the absolute magnitudes are understated, and it
      gives no absolute magnitude.
    WHAT IT DOES NOT SETTLE, and why nothing else moved. It is a three-quarter view:
    every forward projection is foreshortened by an unknown factor, nothing of known
    size is in frame, and the one feature that looks measurable - the knob ellipse -
    needs a diameter nobody has. So it fails gate 1 outright, exactly as the Cisco
    perspective figures did. THE LEVER SILHOUETTE IS DELIBERATELY NOT REDRAWN: the true
    elevation outline of a curved lever is precisely what a three-quarter crop cannot
    give, and drawing sixteen faceplates from it would replace a sourced schematic strip
    with an invented curve. The 4.2 stays, marked `borrowed`.
    WANTED, and it closes both at once: ONE STRAIGHT-ON PHOTOGRAPH OF A SINGLE CARD,
    with a rule or any part of known size in frame. That would give the lever its
    silhouette AND its projection, and it is the cheapest open question on this family.
    THIS ENTRY IS ONE READING OF ONE PHOTOGRAPH restated across the thirteen front-slot
    cards that share this faceplate. The photograph shows DS 8X96, US 16X4 and SMM 8X10G
    specifically; the rest inherit it because the family shares a plate, which the
    DS/US positions provenance already establishes to the millimetre. It is NOT thirteen
    observations. The REAR cards - the 6+12 I/O family, rfd, rfu-16x8, ups-32x4,
    lc-sw-bdm and the two SMM Switch BDMs - are NOT in this photograph and are
    deliberately left alone.'
  relief: 'the C100G/C40G card family treatment - two captive screws (cyl 1.6), the
    ejector latch strip (out 4.2) and the 3 status lamps and 16 port lamps (dome 0.3). THE FULL ARGUMENT IS IN casa/bdm@1 AND THIS IS A
    POINTER TO IT, not a second reading: the three magnitudes are one estimate per kind of
    hardware, borrowed from edgecore/agr-panel-screw@1, edgecore/agr-psu-dc@1 and
    common/led-dot@1, applied across the family because these cards share a faceplate.
    No Casa document states a depth for any of them. Eleven cards carrying 4.2 is ONE
    estimate written eleven times, not eleven readings that agreed.'
