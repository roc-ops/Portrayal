format: 1
kind: module
name: c40g-fan-left
version: 1.2.0
class: cooling
behaviour: fills
profile: networking
description: >-
  Casa C40G LEFT fan module - the secondary position, and the one that carries
  the slot numbering. Mechanically the same tall side-mounted assembly as the
  right-hand system fan module, at the same 34.7 x 205, but its faceplate prints
  the six card-slot numbers 5 down to 0 with 3 and 2 in red, which the right-hand
  module does not.
size: {w: 34.7, h: 205.0, d: 380.0}
attrs:
  model: 'C40G System Fan Module'
  role: cooling
  fans: '8'
  power-draw-max-w: 400
provenance:
  identity: 'Jason - the left and right fan positions are separate part numbers and
    only the left one is printed with the slot numbers. Photographs support it: at 9x
    on c40g-front-3x the LEFT column carries the hazard triangle AND the slot number
    on one continuous face with no seam between them, while the RIGHT column at the
    same magnification carries the triangle and nothing else. Both bays take the same
    module in the model, so a single part cannot be printed two ways - either the
    parts differ or the numbers are chassis ink on a bezel too flush to resolve, and
    a left/right pair is the ordinary way a vendor does this. The guide addresses
    them by side, "show envm fan" reporting FAN_Tray RIGHT. WANTED - the two Casa
    part numbers, or one photograph with the left module withdrawn, which would
    settle it outright by showing whether the numbers leave with it.'
  slot-numbers: 'drawing-measured - carried over from the device silkscreen, where they
    were declared at x 20 and buried under this very bay, which is what L21 reported.
    Y positions are the device values less the bay origin at y 17. X is 26.0 in module
    coordinates, the centre of the 16.3-35.8 band Figure 1-1 shows the numbers in at
    2.467 px/mm, which clears the handle this skin draws at 13.4-21.3.'
  layout: 'drawing - Figure 1-1 of the C40G Hardware Installation Guide (rev 07/07/2022),
    "Casa C40G CMTS front view", which PASSES the orthographic gate: the drawn chassis
    measures 1364 x 760 px for an aspect of 1.795 against the real rack face of
    482 / 265.9 = 1.813, agreeing to 1 percent, so it carries geometry at 2.858
    px/mm scaled by the exactly known 265.9 height. Positions here are measured
    off it rather than taken as fractions'
  what-it-is: 'drawing - "The C40G is equipped with a system fan module and air
    filter assembly on the right-hand side of the chassis. The fan assembly module
    (see Figure 1-7) has eight fans units to supply cooling air to the chassis,
    drawing cool air through the air filter and across the system modules from right
    to left with the air exiting the chassis on the left." Figure 1-7 labels the
    right strip "System fan module" and "Air filter" with "Air flow direction IN",
    and the left strip "Secondary fan module slot (optional with redundancy kit)"
    with "Air flow direction OUT"'
  face: 'drawing - CORRECTED. This skin drew a perforated mesh across the whole
    front face, and NO C40G FIGURE SHOWS ONE THERE. Figure 1-1, "Casa C40G CMTS
    front view", and Figure 2-3, "Fan assembly removal", both draw the module''s
    front as plain sheet metal carrying one long rounded pull handle, and the
    guide describes using it in those words - "grab the handle on the front of
    the fan tray and slowly pull the module out of the chassis". THE MESH WAS THE
    RIGHT FEATURE ON THE WRONG FACE: the perforation is Figure 1-9, "C40G fan
    module air filter side", which is the OUTBOARD face, and Figure 1-8''s cross
    section shows why - the eight fans sit behind the filter, not behind the
    front plate, which is why the front is blank. Everything else in that column
    of Figure 1-1 - the yellow triangle, the FAN TRAY 2 / FAN TRAY 1 / AIR FILTER
    legends, "UNLOCK FAN TRAY", the rotating-blades label and the PSU boxes - is
    printed on the CHASSIS, which is how the device''s front-furniture entry
    already reads it, so none of it belongs on the module.
    THE HANDLE RECTANGLE IS UNMEASURED and is left exactly as it was drawn.
    Figure 1-1 gives its width as about 0.19 of the module width against the 0.23
    drawn here, but its top and bottom edges cannot be separated from the chassis
    in that figure - the strip and the chassis are the same grey above and below
    the bay - so there is no honest anchor for its length. Wanted: a front
    photograph of the fan strip, or a caliper'
  air-filter: 'drawing - the filter is PART OF THIS MODULE, not a separate FRU.
    "Figure 1-9 shows the air filter side of the fan module." That is why no separate
    filter component is modelled for the fan position. The chassis carries a SECOND,
    unrelated filter - the one integrated into the snap-on front PSU cover - which
    is casa/c40g-psu-cover'
  size: 'drawing-measured - the strip runs x 386.7 to 422.7 and y 17 to 222 in
    body coordinates off Figure 1-1, so 36 x 205. The width is trimmed to 34.7 so
    the bay does not overlap the card bays, which end at x 387.5'
  power-draw-max-w: 'drawing - "The fan module has a power draw of approximately
    400W." The word is the vendors: approximately. This is a whole-module figure
    for all eight fan units, and it is stated for THE system fan module in the singular
    - no document held here says what a second, redundancy-kit module adds'
  relief: 'one feature, and the rest is a refusal. The front face carries exactly
    one thing - "grab the handle on the front of the fan tray and slowly pull the
    module out of the chassis" - and Figures 1-1 and 2-3 both draw that one long
    rounded bar and nothing else, which is why the mesh was taken off this face.
    So there is one raised node to declare and `bar` is the right primitive for a
    grab handle. Its DIAMETER, 7.9, is the drawn rectangle''s own short axis - the
    only self-consistent choice available - and its PROUDNESS is therefore also 7.9,
    which is a floor and not a measurement: a handle must clear enough for fingers.
    THE CROSS SECTION DOES NOT HELP, and this is worth recording because it is the
    figure anyone would reach for. Figure 1-8, "C40G fan module cross section", is not
    a section through the depth: it is the module with a side cover off, looking at the
    eight fan faces in two rows of four with the controller PCB and its fuses below.
    It shows the handle in profile at the right-hand edge, but the drawing''s own
    aspect (1100 x 740 px, 1.49) matches neither 380/205 (1.85) nor any other pair of
    this module''s dimensions, so it fails the orthographic gate and a fraction off it
    would be a number about the drawing. What it DOES establish is construction: eight
    fans, two rows, a PCB with fuses and a backplane connector, and a handle that
    genuinely protrudes.
    NOT MODELLED HERE: the perforated air-filter face. It is real and Figure 1-9 draws
    it, but it is the OUTBOARD side, and this component has only a front skin. A
    skins/body-right.svg carrying that mesh with a `vent` on it is the right way to add
    it and is left for whoever draws the six faces.
    WHAT WOULD SETTLE THE HANDLE: a front photograph of the fan strip, or a caliper -
    the same two things the face entry above already asks for.'
  body: 'the 380.0 is the size entry''s own depth restated as a body so the tray draws
    as a solid. Same caveat as casa/fan: class `cooling` is not in the viewer''s FRU
    class list, so it will not eject until that is reconciled with class `fan`'
  not-the-c100g-fan: 'CHECKED, and they are NOT the same part. casa/fan is the
    C100G assembly: three of them sit horizontally above the rear card band, each
    holds two fans, each draws 100 W, and the air goes front to rear. This one is
    a single tall side-mounted module holding eight fans at 400 W with the air going
    right to left. Same vendor, same era, different machine'
relief:
  wall: '#4a4f55'
  features:
    # The one thing on this face. `bar` at 7.9 is the handle rect's OWN drawn
    # short axis, so the tube is as thick as the handle is drawn rather than as
    # thick as somebody guessed. See provenance/relief - and note the face entry
    # above already records that this rectangle is UNMEASURED in x and y too.
    - {node: handle, bar: 7.9, confidence: drawing, source: 'the handle rect own drawn 7.9 short axis - the diameter is drawn. The proudness is a FLOOR'}
