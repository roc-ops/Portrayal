format: 1
kind: module
name: smm-8x10g
version: 1.3.0
class: supervisor
profile: networking
description: >-
  Casa high-density SMM 8x10GigE - the C100G/C40G supervisor and switch module.
  Eight 10GigE SFP+ (XG0-XG7), two GigE SFP (G0, G1), a 10/100BASE-T management
  RJ45 and an RS-232 console RJ45, plus STATUS, ACTIVE and ALARM LEDs.
size: {w: 30.47, h: 345.5, d: 380.0}
attrs: {model: 'SMM 8x10G', role: supervisor, power-draw-max-w: 160, sfp-plus: '8',
  sfp: '2', mgmt: 10/100BASE-T, console: RS-232}
provenance:
  layout: drawing - Figure 1-8 of the Casa C100G Hardware Installation Guide
    (rev 07/08/2022). Port order down the faceplate is 10/100MI, XG0 to XG7, G0,
    G1, console - XG numbering runs UP the card, so XG0 sits nearest the
    management port at the top
  ports: composed from the shared cage components rather than drawn as
    rectangles. Every cage is ROTATED 90 - the card is only 30.47 wide, so a
    16.0 x 10.0 SFP+ cage only fits on its side, which is what the figure shows
    (detected 9.7 x 16.0, against 10.0 x 16.0 for the rotated component)
  power: datasheet - Casa SMM8x10G datasheet, "Power Consumption 160W". The
    datasheet calls it a single-slot module and there is no paired rear half, so
    unlike the BDM2's 300 W this figure covers exactly this component. Filed as
    max because a single unqualified figure on a card spec table is the number a
    chassis is budgeted with; Casa states no typical
  lamps: 'CORRECTED. This component used to place alarm at the TOP of the cluster and status at
    the bottom, while its own description said "STATUS, ACTIVE and ALARM LEDs" - the text
    and the geometry contradicted each other. Figures 1-7, 1-8 and 1-9 all print STATUS,
    ACTIVE, ALARM top to bottom, and the CSC8x10G product photograph shows that order at a
    legible size. That change reassigned which lamp sits at which position and left the
    three y values alone - AND THE SENTENCE SAYING SO WAS TRUNCATED MID-CLAUSE, which is
    fixed here along with the rest. THOSE Y VALUES HAVE SINCE MOVED, and not for order
    reasons: see the lamp-pitch entry, which re-derives all three from Figure 1-14 of the
    C40G guide. THE ORDER IS CONFIRMED INDEPENDENTLY on the C40G side. Figure 1-14 prints
    STATUS, ACTIVE, ALARM top to bottom, and the lamp COLOURS say it without reading a word
    - the top two are drawn green and the third dark, where on the BDM and on the DS/US
    cards it is the MIDDLE lamp that is dark. The SMM pair genuinely orders them
    differently. That is worth stating loudly, because a reader who knows the other Casa
    cards will see status/ACTIVE/ALARM and assume two rows were transposed.'
  legends: 'CORRECTED. The twelve port legends used to sit BELOW each opening and
    six of them were invisible, because the cage pitch alternates 17.3 and 20.2
    while a rotated cage is 16 tall - so on every tight pair the legend fell
    inside the NEXT opening and the cage installed there painted over it. They
    now sit BESIDE each opening at x 21.8, clear of both the 20.23 right edge of
    a rotated cage and the 21.49 edge of the wider RJ45, which is also what the
    SMM300G photograph shows the real hardware doing'
  legend-band: 'CORRECTED. The model legend sits between TWO orange bands, not
    below one. Three product photographs - DS8x96, CSC8x10G and SMM300G - agree
    on that, and casa/bdm carries the same pair from Figure 1-14. Position and
    type size are the family values (20.42 and 33.76, baseline 29.84 at 2.84)
    rather than this component''s previous single band at 20.4'
  size: ESTIMATED, shared with the rest of the family. Absolute numbers come
    from the chassis front view; the isolated card figures are drawn ~17 percent
    narrower than the real card, so their port positions are used as fractions
  'lamp-pitch': 'drawing-measured, BY A DIFFERENT ANCHOR, and the difference matters. Figure 1-14 of the
    C40G guide, "High-density SMM 8x10GigE (eight 10GigE, two GigE ports)", draws this card,
    but EVERY FIGURE OF THE SMM PAIR IN BOTH GUIDES IS CLIPPED at the plate edge - C40G
    Figures 1-13 to 1-16 and C100G Figures 1-7 to 1-10 all run the plate grey to the last
    pixel row - so the drawn plate height cannot be recovered and the plate-fraction method
    used on casa/bdm and on the DS/US cards is unavailable here. THE TWO CAPTIVE SCREWS ARE
    THE ANCHOR INSTEAD: this skin places them at cy 6.00 and 339.50, 333.50 mm apart, and
    the figure draws both. They measure at rows 15.0 and 1370.0, a separation of 1355.0 px,
    giving 4.06297 px/mm and an implied plate top at row -9.38. The implied top edge is
    NEGATIVE, which is the clipping stated as a number: the crop starts 9 px inside the
    plate. Lamp centres then land at 272.60, 276.25 and 279.90 for a pitch of 3.65 mm. THE
    METHOD WAS VALIDATED ON A CONTROL BEFORE BEING TRUSTED HERE: run against the un-clipped
    BDM in Figure 1-20, the screw anchor puts the plate top at row 71.62 where the plate box
    reads 70 - agreement to 1.6 px. It carries a systematic though, and it is stated rather
    than hidden: the two anchors disagree by 0.9 percent, because the drawn plate is 1417 px
    where the screws imply 1404, so a position taken this way is about 2 mm softer than one
    taken from a plate box. Both underlying numbers - the 345.5 height and the 6.00/339.50
    screw positions - are conventions rather than measurements, which is why neither anchor
    can settle the other. It replaces a 6.6 mm pitch that was never measured on this card or
    on any other: casa/bdm''s provenance said outright that 6.6 was picked so the lamps
    would "read as separate indicators", and the same three numbers had been carried onto
    every Casa front card. This entry is a separate reading of a separate plate and is not
    that number under a new name. THE 3.0 LAMP DIAMETER IS UNCHANGED AND STILL UNMEASURED,
    for the reason the BDM gave: these drawings are anisotropic, so a round lamp scales to
    two different diameters depending on the axis, which tells you the drawing is wrong
    rather than telling you the size.'
  relief: 'the C100G/C40G card family treatment - two captive screws (cyl 1.6), the
    ejector latch strip (out 4.2) and the 3 status lamps (dome 0.3). THE FULL ARGUMENT IS IN casa/bdm@1 AND THIS IS A
    POINTER TO IT, not a second reading: the three magnitudes are one estimate per kind of
    hardware, borrowed from edgecore/agr-panel-screw@1, edgecore/agr-psu-dc@1 and
    common/led-dot@1, applied across the family because these cards share a faceplate.
    No Casa document states a depth for any of them. Eleven cards carrying 4.2 is ONE
    estimate written eleven times, not eleven readings that agreed.'
elements:
  status: {at: [4.80, 271.10], size: [3.0, 3.0], class: led}
  active: {at: [4.80, 274.75], size: [3.0, 3.0], class: led}
  alarm: {at: [4.80, 278.40], size: [3.0, 3.0], class: led}
relief:
  wall: '#4a4f55'
  features:
    # Two captive slotted screws on the centreline - the guide's own
    # "integrated thumbscrews" / "captive screws".
    - {node: screw-t, cyl: 1.6}
    - {node: screw-b, cyl: 1.6}
    # The ejector latch strip.
    - {node: latch-t, out: 4.2}
    - {node: latch-b, out: 4.2}
    # STATUS / ALARM / ACTIVE - lenses, not painted dots.
    - {node: status, dome: 0.3}
    - {node: active, dome: 0.3}
    - {node: alarm, dome: 0.3}
