description: >-
  Casa CSC Out-of-Band (OOB) 2+8 I/O module - the rear half of a CSC 8x10G
  position, carrying two Narrowband Digital Forward downstream jacks (NDF0,
  NDF1) and eight Narrowband Digital Return upstream jacks (NDR0-NDR7). It
  gives a Remote PHY deployment the SCTE 55-1 / 55-2 signalling path that
  two-way legacy set-top boxes still need: analogue OOB carriers are digitised
  in the headend and turned back into RF at the node. One NDF and one NDR as a
  set (NDF0 with NDR0) is the minimum connection; NDF1/NDR1 drive a second
  signalling device.
