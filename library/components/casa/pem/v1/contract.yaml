format: 1
kind: module
name: pem
version: 1.7.0
class: power
behaviour: fills
profile: networking
description: >-
  Casa C-series Power Entry Module. Two per chassis, PEM B on the left and
  PEM A on the right when facing the rear. Each carries four 30 A power
  branches. A branch is a -48/-60 VDC feed with its return, landed on a pair
  of studs in one of the two terminal blocks, and protected by its own rocker
  circuit breaker in the row above. The faceplate draws a leader line from
  each branch's terminal-cover screw up to the breaker that protects it.
attrs:
  model: 'PEM'
  power-output-w: 3840
  power-per-branch-w: 960
  power-output-scope: pass-through-ceiling
  role: dc-power-entry
  input-voltage: '-42 to -60 VDC (-48 VDC nominal)'
  current-per-feed: '20 A nominal, 30 A rating'
  feeds: '4'

size: {w: 207.0, h: 91.6, d: 250.0}
provenance:
  positions: >-
    FIELDS, since 1.7.0 (docs/switch-positions-design.md, #808): `breaker-1`, `breaker-2`, `breaker-3`, `breaker-4`, each `off` or `on`. Each rocker is a SEE-SAW: one surface tipped about its centre, so the end it is set to presses in and the other end rises. O (a ring) at the left and I (a dash) at the right of each paddle, as the PEM drawing prints them; OFF raises the I end and ON the O end, each a node shown for its position, shaded lighter toward its raised end and built in 3D as a sloped profile. The heights are estimated. The skin draws OFF; nothing held says how a unit ships.
  power: >-
    THIS IS A POWER ENTRY MODULE AND THE CONDUIT ARGUMENT DOES NOT FIT IT. That
    argument - a tray carries what the modules seated in it produce, so watts are
    the wrong unit - was written for the Cisco power trays and is right about them:
    `a9k-power-tray` and `a9k-dc-pem-v3` both declare `module-bays: 4`, and those
    four supplies each state their own output. NOTHING SEATS IN A CASA PEM. It has
    no module bays, it holds no supplies, and on a DC chassis it is the only path
    power takes into the box - so there is no other part to carry the figure, and
    "the supplies that seat in it state their own output" is simply false here.
    DERIVED, AND THE ARITHMETIC IS THE WHOLE OF IT: four branches x 20 A NOMINAL x 48 V = 3840 W, which is 960 W a branch. Both inputs are the
    vendor's - "Each PEM provides power terminals for four 30A power branches", C100G HIG 6-14, where the 30 A is the BREAKER and 20 A the nominal the same guide gives per feed - and -48 VDC is the stated nominal. Casa publishes no
    watt rating for the PEM itself, in either hardware guide or either data sheet.
    THE BREAKER IS NOT THE LOAD, and using it here was wrong once already: four
    times the 30 A trip current gives 5760 W, which is the sum of the protection
    and not a capacity anything draws. A breaker is sized ABOVE continuous load by
    design. The nominal 20 A is the figure per branch, and four of them at 48 V
    come to 3840 W - within 2 percent of what Casa says to provision, which is the
    check that the right current was used. It is recorded because a DC chassis has nowhere
    else to state its input capacity, and a consumer asking "how much can this
    take" would otherwise get silence.
    IT CROSS-CHECKS: the C100G guide asks for a supply "rated to provide -48VDC at
    a minimum 3900W", and 3840 W lands on it - the two PEMs are redundant, not additive - which is what the two of
    them being redundant means.
  electrical: 'datasheet - Table A-1 of the C100G install guide gives "Voltage
    -42 to -60VDC" and "Current 20A nominal per feed"; the chassis nameplate reproduced
    at Figure 1-3 gives "-48VDC, 30A per Feed (4+4 Feeds)". Four feeds per PEM,
    two PEMs, hence 4+4'
  layout: 'drawing - Figure 1-6 of the C100G Hardware Installation Guide, "C100G
    Power Entry Module, terminal covers removed". Every feature position below
    is a measured PERCENTAGE of that figure''s faceplate, stretched onto this
    module''s size. The figure''s own aspect is 3.43 against this module''s 2.26,
    so its absolute geometry is not usable - the same trap the isolated card
    figures set, and the reason fractions are used throughout'
  size: 'drawing - the maintainer''s hand-built rear SVG, group `pemA`: 90.80 x 44.04 in a
    190.26-wide frame, mapped fractionally onto our 432.95 x 571 body. The guide
    figure gives the layout; the hand-built SVG gives the size'
  branches: 'datasheet - each PEM has power terminals for four 30A branches, and each
    branch is a -48VDC cable plus its return cable behind a 30A circuit breaker (Chapter
    1). Those four breakers, one per branch, give the over-current protection and
    nothing else - the guide says they are not to be used as power switches'
  breaker-order: 'drawing - measured breaker centres are 18.04 / 37.99 / 61.36 /
    81.33 percent of the faceplate, so four evenly-paired rockers. They map to
    Branch 4 / 3 / 2 / 1 LEFT TO RIGHT, which the leader lines in the figure
    make unambiguous'
  labels: 'the maintainer - the guide interrupts each leader where its Branch label sits.
    At this drawing scale that reads as text cutting through the line, so the
    lines are drawn UNBROKEN and the labels moved clear - outer labels above
    their horizontal run, inner labels below theirs. The -48/-60VDC and RTN
    captions are centred in the clear lane between each block and the nearest
    leader vertical, at a size that fits it, rather than overlapping the block'
  leaders: 'drawing - the routing is NOT uniform. The two OUTER branches (4 and 1)
    leave their rocker''s outer side edge at 12.9 percent height, run outward to
    3.41 / 96.27 percent, then drop to the cover screw. The two INNER branches
    (3 and 2) drop from their rocker''s bottom CENTRE and run inward to the screw.
    Each run is interrupted where its Branch label sits'
  terminals: 'drawing - two blocks at 6.99 and 71.1 percent, each 21.5 percent
    wide. Figure 1-6 draws them 61.9 percent tall with an uneven split; corrected
    on the maintainer''s eye against the hardware to 40.4mm total in TWO EQUAL halves of
    20.2, top edge unchanged. Breaker height likewise cut a quarter, 19.5 to 14.6. Four studs per block in 2 columns x 2 rows: the
    TOP row is -48/-60VDC and the BOTTOM row is RTN, labelled once per block in
    the central gap. Left block holds Branch 4 (left column) and Branch 3; right
    block holds Branch 2 and Branch 1 (right column)'
  hand: 'drawing - in it `pemA` sits at x 97.70 (RIGHT) and `pemB` at x 2.98 (LEFT)'
  relief: 'estimated, and the split matters. WHAT is raised, what it is, and where
    it sits are read off Figure 1-6, "C100G Power Entry Module, terminal covers
    removed" - the breakers are bezels standing off the plate, the terminal blocks
    are moulded bodies with the studs on their faces, the cover screws are captive
    brass, the HS control is a pushbutton and the three indicators are lamps. That
    is what an elevation can answer and it is what this contract was missing.
    HOW FAR each stands proud is NOT in any Casa document. Neither hardware
    installation guide, nor Table A-1, nor the chassis nameplate carries a single Z
    dimension for this module; the only figures of it are flat elevations, and this
    one fails the orthographic gate outright at an aspect of 3.43 against this
    module''s 2.26, so even a fraction off it would be worthless. Searched: both
    guides for "Power Entry", "PEM", "terminal", "breaker" and the Appendix A
    tables. So every mm here is ESTIMATED, and each is the Portrayal library''s
    existing figure for the same class of hardware rather than a fresh guess:
    the 2.2 mm nut is agr-psu-dc''s, the 1.6 mm screw head is
    edgecore/agr-panel-screw@1 and the 0.3 mm lamp dome is common/led-dot@1 - AND NONE
    OF THE THREE WAS MEASURED THERE EITHER, which an earlier version of this entry got
    wrong by calling the nut "read off real Edgecore terminal hardware". What the owner
    measured on that PSU is its walls at 12.7 and its bolts at 6.35; the nut subdivides
    the 6.35. agr-panel-screw says "estimated - not measured" outright and led-dot carries
    no depth provenance at all. The ones with no library precedent are the breakers
    (a 1.0 bezel under a paddle tipped from 1.35 to 3.0, provenance.positions) and
    the 6.0 mm terminal block, and they are flagged here rather than buried: they
    are the only invented magnitudes in this file.
    WHAT WOULD SETTLE IT: a caliper on a C100G PEM, or any three-quarter photograph
    of the rear face - one oblique shot with the terminal covers off would fix the
    block height, the bezel and the stud length together'
  body: 'the box behind the face is the size entry''s own depth, 250.0, which that
    entry already records as ESTIMATED - not a second claim. `body` is declared so
    the module draws as a solid that fills its bay instead of a floating faceplate;
    without it the 3D viewer has no box to build and the PEM reads as art painted
    on the rear plate, which is what the owner is seeing. NOTE that declaring it is
    necessary but not sufficient here: the viewer built FRU groups only for
    data-class psu, fan and tab, and this module is class power, so it would not
    eject. Reported rather than worked around by mislabelling a power ENTRY
    module as a psu - and kit/relief.js now admits power and cooling
    to that list, so it ejects'
  depth: estimated - not measured
