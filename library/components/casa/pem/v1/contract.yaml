relief:
  wall: '#4a4f55'
  features:
    # WHICH node is raised and WHICH primitive it is comes from Figure 1-6; the
    # MAGNITUDES do not - see provenance/relief. Every mm below is `estimated`.
    #
    # The four rocker breakers are a moulded bezel standing off the plate: the
    # figure draws each as a black surround with a lighter, clearly inboard panel
    # carrying the round trip button and the rocker paddle.
    - {node: breaker-4, out: 3.0, confidence: estimated, source: 'NO PRECEDENT - a panel rocker/breaker bezel. Invented here and reused across casa/pem and casa/c40g-ac-inlet-panel'}
    - {node: breaker-3, out: 3.0, confidence: estimated, source: 'NO PRECEDENT - a panel rocker/breaker bezel. Invented here and reused across casa/pem and casa/c40g-ac-inlet-panel'}
    - {node: breaker-2, out: 3.0, confidence: estimated, source: 'NO PRECEDENT - a panel rocker/breaker bezel. Invented here and reused across casa/pem and casa/c40g-ac-inlet-panel'}
    - {node: breaker-1, out: 3.0, confidence: estimated, source: 'NO PRECEDENT - a panel rocker/breaker bezel. Invented here and reused across casa/pem and casa/c40g-ac-inlet-panel'}
    # Each terminal block is a moulded body standing proud, with the studs on its
    # face. `out` goes on the GROUP so the black surround, the well and the
    # centre divider all travel with it; a raised sibling left behind would read
    # as a coloured shadow under the block.
    - {node: terminal-block-1, out: 6.0, confidence: estimated, source: 'NO PRECEDENT - a moulded DC terminal block. Invented here'}
    - {node: terminal-block-2, out: 6.0, confidence: estimated, source: 'NO PRECEDENT - a moulded DC terminal block. Invented here'}
    # Eight studs, two per branch: -48/-60 VDC on the top row, RTN below. Each is
    # its own node so `cyl` takes ITS radius - grouped per branch, a pair 25.9 mm
    # apart would have produced one cylinder spanning both. lift 6.0 stands them
    # on the block face rather than on the faceplate. See agr-psu-dc, which is
    # where the 2.2 comes from.
    - {node: nut-b4-vdc, cyl: 2.2, lift: 6.0, confidence: estimated, source: 'edgecore/agr-psu-dc@1 terminal nut - NOT MEASURED. The owner measured that part walls at 12.7 and its bolts at 6.35; the nut subdivides the 6.35 and was not itself measured'}
    - {node: nut-b4-rtn, cyl: 2.2, lift: 6.0, confidence: estimated, source: 'edgecore/agr-psu-dc@1 terminal nut - NOT MEASURED. The owner measured that part walls at 12.7 and its bolts at 6.35; the nut subdivides the 6.35 and was not itself measured'}
