    # WHICH node is raised and WHICH primitive it is comes from Figure 1-6; the
    # MAGNITUDES do not - see provenance/relief. Every mm below is `estimated`.
    #
    # The four rocker breakers are a moulded bezel standing off the plate: the
    # figure draws each as a black surround with a lighter, clearly inboard panel
    # carrying the round trip button and the rocker paddle.
    - {node: breaker-4, out: 1.0, confidence: estimated, source: 'the bezel or frame the rocker sits in, lowered to 1.0 so the tipped surface stands out of it; estimated'}
    - {node: breaker-3, out: 1.0, confidence: estimated, source: 'the bezel or frame the rocker sits in, lowered to 1.0 so the tipped surface stands out of it; estimated'}
    - {node: breaker-2, out: 1.0, confidence: estimated, source: 'the bezel or frame the rocker sits in, lowered to 1.0 so the tipped surface stands out of it; estimated'}
    - {node: breaker-1, out: 1.0, confidence: estimated, source: 'the bezel or frame the rocker sits in, lowered to 1.0 so the tipped surface stands out of it; estimated'}
    # Each terminal block is a moulded body standing proud, with the studs on its
    # face. `out` goes on the GROUP so the black surround, the well and the
    # centre divider all travel with it; a raised sibling left behind would read
    # as a coloured shadow under the block.
