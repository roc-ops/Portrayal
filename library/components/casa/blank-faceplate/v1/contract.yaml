format: 1
kind: module
name: blank-faceplate
version: 1.4.0
class: blank
profile: networking
description: >-
  Casa blank face plate for an unpopulated C100G or C40G card slot. A plain
  plate with two captive thumbscrews and nothing else. It is a functional part,
  not trim - it keeps the cooling airflow channelled through the chassis, and
  the guide is explicit that running a slot open makes components "excessively
  warm or even overheat". An empty bay in a real chassis has one of these in it.
size: {w: 30.47, h: 345.5, d: 20.0}
attrs:
  model: 'Blank Face Plate'
  role: airflow-blank
provenance:
  purpose: 'drawing - both hardware installation guides describe it and why it
    matters. C100G: "For any unpopulated chassis slots, the C100G CMTS comes
    equipped with blank face plates that you can easily remove using the
    integrated thumbscrews. The blank face plates are necessary to ensure system
    cooling by keeping the airflow properly channeled through the chassis. If
    these face plates are removed, the cooling airflow will escape prematurely,
    causing system components to become excessively warm or even overheat." The
    C40G carries the same paragraph. The line-card replacement procedure closes
    with "Otherwise, install a blank cover over the slot and screw down its
    captive screws to complete this procedure"'
  part-number: 'NONE - and that is a finding, not an omission. Neither guide
    gives this part a number, an order code or a figure. It is referred to only
    by description - "blank face plates", "blank cover", "blank filler plates" -
    across four separate procedures. No number is invented here. Anyone holding
    the hardware can close this by reading the label'
  fits: 'drawing - one part, both faces, because nothing in either guide
    distinguishes a front blank from a rear one. Front and rear slots share the
    30.47 x 345.5 envelope, both guides use the same wording for both, and the
    C40G is the only place either guide places blanks by slot number - "Rear
    slots (non-redundant system) - Blank filler plates: 2, 3", which are rear
    slots. If the real part differs front to rear, this is the assumption to
    break first'
  size: shared with the rest of the front-card family, taken from the chassis
    slot envelope (30.47 x 345.5). The depth is a guess at plate-plus-flange and
    is deliberately shallow - a blank has no body behind the face
  screws: 'drawing - two captive screws, at the family positions casa/bdm and
    casa/smm-8x10g use. The guides call them both "integrated thumbscrews" and
    "captive screws" and say a flat-tip screwdriver removes them, so they are
    drawn as the same slotted captive screw the cards carry'
  cutouts: none - a blank is unpunched by definition. That is the entire point
    of the part
  faceplate-hardware-photo: 'THE OWNER SUPPLIED AN ISOMETRIC OF THE C100G FRONT and it
    corrects the SHAPE of two things on this faceplate. working/photos/casa/ -
    c100g-front-isometric.png and the crop crop-ejectors.png, read at high zoom.
    WHAT IT SETTLES:
    - The captive screw is not a flat slotted head. It is a substantial BLACK KNURLED
      KNOB standing well proud, with a dark top face and a light metallic band. `knurl`
      is added for that reason - it is a shape fact and costs no dimension. The drawn
      2D head is still a slotted circle and is NOT redrawn; the figures draw it that way
      and this photograph cannot give a true elevation of it.
    - The EJECTOR LEVER is the most prominent thing on the whole face: a large CURVED
      BLACK lever, not the rounded strip this skin draws, with a thin vertical linkage
      rod running down the card from the knob to it.
    - RELATIVE PROMINENCE, which is the one quantitative thing a perspective view CAN
      give: lever stands proud of knob stands proud of lamp. This contract already
      orders them that way - 4.2, 1.6, 0.3 - so the photograph CONFIRMS the ordering
      rather than correcting it. Only the absolute magnitudes are understated, and it
      gives no absolute magnitude.
    WHAT IT DOES NOT SETTLE, and why nothing else moved. It is a three-quarter view:
    every forward projection is foreshortened by an unknown factor, nothing of known
    size is in frame, and the one feature that looks measurable - the knob ellipse -
    needs a diameter nobody has. So it fails gate 1 outright, exactly as the Cisco
    perspective figures did. THE LEVER SILHOUETTE IS DELIBERATELY NOT REDRAWN: the true
    elevation outline of a curved lever is precisely what a three-quarter crop cannot
    give, and drawing sixteen faceplates from it would replace a sourced schematic strip
    with an invented curve. The 4.2 stays, marked `borrowed`.
    WANTED, and it closes both at once: ONE STRAIGHT-ON PHOTOGRAPH OF A SINGLE CARD,
    with a rule or any part of known size in frame. That would give the lever its
    silhouette AND its projection, and it is the cheapest open question on this family.
    THIS ENTRY IS ONE READING OF ONE PHOTOGRAPH restated across the thirteen front-slot
    cards that share this faceplate. The photograph shows DS 8X96, US 16X4 and SMM 8X10G
    specifically; the rest inherit it because the family shares a plate, which the
    DS/US positions provenance already establishes to the millimetre. It is NOT thirteen
    observations. The REAR cards - the 6+12 I/O family, rfd, rfu-16x8, ups-32x4,
    lc-sw-bdm and the two SMM Switch BDMs - are NOT in this photograph and are
    deliberately left alone.'
  relief: 'the C100G/C40G card family treatment - two captive screws (cyl 1.6), the
    ejector latch strip (out 4.2). THE FULL ARGUMENT IS IN casa/bdm@1 AND THIS IS A
    POINTER TO IT, not a second reading: the magnitudes are one estimate per kind of
    hardware, borrowed from edgecore/agr-panel-screw@1 for a screw head, applied across the family because these cards share a faceplate.
    No Casa document states a depth for any of them. Eleven cards carrying 4.2 is ONE
    estimate written eleven times, not eleven readings that agreed. NOTE this card has
    NO LAMPS, so the family''s dome figure is deliberately not cited here - citing a
    source for a number a file does not carry is how an inert wrong claim gets started. A blank has no latch and no lamp, so it takes the two screws and nothing else - which is the whole point of the part.'
relief:
  wall: '#4a4f55'
  features:
    # Two captive slotted screws on the centreline - the guide's own
    # "integrated thumbscrews" / "captive screws".
    - {node: screw-t, cyl: 1.6, knurl: true, confidence: borrowed, source: 'edgecore/agr-panel-screw@1 - its measured captive screw head'}
    - {node: screw-b, cyl: 1.6, knurl: true, confidence: borrowed, source: 'edgecore/agr-panel-screw@1 - its measured captive screw head'}
skins: [default]
