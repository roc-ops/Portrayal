    - {node: washer-bl, cyl: 0.7, confidence: estimated, source: 'casa/ground-bolts@1 star washer - NOT MEASURED there either'}
    - {node: nut-bl, cyl: 2.2, lift: 0.7, confidence: estimated, source: 'casa/ground-bolts@1 terminal nut - NOT MEASURED there either'}
    - {node: stud-top-br, cyl: 3.5, thread: 1.0, confidence: estimated, source: 'casa/ground-bolts@1 - NO PRECEDENT beyond it, a grounding stud. A FLOOR: it has to clear the nut'}
    - {node: washer-br, cyl: 0.7, confidence: estimated, source: 'casa/ground-bolts@1 star washer - NOT MEASURED there either'}
