format: 1
kind: module
name: lc-sw-bdm
version: 1.0.0
class: switch
profile: networking
description: >-
  Casa LC Switch BDM (LC-SW-BDM) - the line-card switch for BDM redundancy.
  Goes in the rear slot that PROTECTS, which under the C100G 11+1 scheme is
  rear 5 and under the C40G 3+1 scheme is rear 1. A blank faceplate; it
  switches the RF path rather than presenting ports.
attrs: {model: 'LC-SW-BDM'}
size: {w: 30.47, h: 345.5, d: 380.0}
provenance:
  power: >-
    NONE STATED, AND FOR A DIFFERENT REASON THAN THE I/O MODULES, which is worth saying
    because this card sits in the same L29 warning list as they do. The I/O modules are
    silent because their figure is already carried by the BDM they pair with, so writing
    one would double count. NOTHING LIKE THAT APPLIES HERE. This is the protection card,
    not a paired half: it takes the rear slot that protects a BDM rather than partnering
    one, so no other component's figure covers it and nothing would be double counted by a
    number appearing here.
    IT IS SIMPLY UNSOURCED. LC-BDM-SWITCH appears in both guides only in slot assignments
    and installation steps - "LC Switch used with the BDM redundant module", "Slot 1 -
    LC-BDM-SWITCH (for BDM line module redundancy)", "Install the SMM-SW-BDM and
    LC-BDM-SWITCH modules at the rear side" - and never in a table with a figure beside
    it. Searched, not assumed.
    NO NUMBER IS ESTIMATED FROM ITS BEING A SWITCH. It is drawn as a plain plate that
    switches the RF path rather than presenting ports, which makes a small draw plausible
    and zero unprovable, and a plausible number is the failure this project keeps having
    to dig back out. The L27 warning stands as the record.
  layout: drawing - Figure 1-14 of the C100G Hardware Installation Guide shows
    LC-SW-BDM as a plain plate with a model band and no connectors
  slot: datasheet - "Slot 5 - LC-BDM-SWITCH (for BDM line module redundancy)"
    in the C100G rear 11+1 assignment
relief:
  wall: '#4a4f55'
skins: [default]
