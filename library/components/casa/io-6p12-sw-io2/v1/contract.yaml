format: 1
kind: module
name: io-6p12-sw-io2
version: 1.8.0
class: line-card
profile: networking
description: >-
  Casa 6+12 SW-IO2 - the 204 MHz-capable combined switch and I/O card. Same
  eighteen MCX jacks and the same LC switch function as the plain 6+12 SW-
  IO, at 5-204 MHz, so it is what a 204 MHz BDM build puts in the redundancy
  slot a BDM scheme frees up: C100G rear 8, C40G rear 4.
size: {w: 30.47, h: 345.5, d: 380.0}
size-confidence: {d: known-wrong}
size-notes: 'd 380.0 is IMPOSSIBLE - a front and a rear card mate at a midplane inside a 386.0 chassis and two at 380.0 need 760. See provenance/depth-known-wrong'
attrs: {model: '6+12 SW-IO2', media: coax, connector: mcx, downstream: '6', upstream: '12', spectrum: 5-204MHz, switch: 'yes', slot: C100G-rear-8 / C40G-rear-4}
provenance:
  depth-known-wrong: 'THE 380.0 IS NOT MERELY UNMEASURED, IT IS IMPOSSIBLE, and this
    contract now says so in a field a tool can read - size-confidence: {d: known-wrong}.
    THE CONSTRAINT. Front and rear cards MEET AT A MIDPLANE, which the owner photographed:
    working/photos/casa/c40g-empty-midplane.png shows the emptied cage with the card guides
    and the midplane at the back of it, and the opening where the rear I/O card reaches
    through to the front card. So a front card and its rear partner have to share the
    chassis depth - 386.0 on the C100G, 388.45 on the C40G. Two cards at 380.0 need 760,
    which is not a wide error bar, it is twice the box.
    WHAT THE SHAPE IS, from the owner: "the front card is mostly rectangular, but the I/O
    card is kind of L SHAPED where the top part of the top connector PASSES THROUGH THE
    MIDPLANE and plugs into the front card, and the other one is plugged into the midplane.
    So they ultimately kind of meet in the middle." So the rear card is a body against the
    midplane PLUS A TONGUE at the top reaching forward through it.
    NOTE WHAT THAT DOES AND DOES NOT ALLOW, because the obvious rule is wrong. front + rear
    CAN exceed the chassis depth, by about the tongue length, because the tongue overlaps the
    front card at a height where the front card is not - they interleave rather than tile. The
    constraint is therefore an inequality with slack, not an equality. What it cannot absorb
    is a 374 mm overlap where a tongue is tens of millimetres.
    ONE PHOTOGRAPH IS USABLE AND IT IS NOT THIS CARD-FAMILY-WIDE. bdm2m-solder-side.jpeg has
    the faceplate FULLY IN FRAME, so its 345.5 long axis anchors the scale at 5.00 px/mm; the
    card measures 1336 px from the faceplate to the top of its midplane connectors. Raw that
    is 267 mm. The shot is NOT orthographic - the PCB reads 4.66 percent wider at the
    connector end than at the faceplate end, which is perspective, not a taper - so correcting
    to the mean scale gives about 261, and taking the card top at the outermost connector edge
    instead pushes it to about 282. CALL IT 270 PLUS OR MINUS 12 AND DO NOT ROUND THAT AWAY.
    REJECTED, and the rejection is the useful part: bdm2m-top-plan.jpeg and both qam-io-card
    plan shots have the faceplate CLIPPED BY THE FRAME, so the 345.5 anchor is truncated and
    every number off them is understated by an unknown amount. Measured anyway, the top-plan
    gives 227 mm for the same card the solder side gives 270 - a 19 percent disagreement that
    is entirely the broken anchor. They are not second opinions and must not be averaged in.
    NOTHING IS REPLACED. 270 plus or minus 12 is one reading of one card from one photograph
    that fails gate 1, and stamping it on twelve cards would be the family-number pattern
    doing harm instead of good - these cards share a FACEPLATE, which is established, not a
    depth, which is not. What is established is that 380.0 cannot be true.
    WANTED, in order of how much each unlocks: a tape on any one front card (fixes it
    outright); a tape on any one rear I/O card; an unclipped side-on photograph of a rear card
    showing where the tongue begins, which would give the midplane position and both halves
    at once.'
  body-shape-not-a-box: 'THIS CARD IS AN L IN SIDE ELEVATION AND PORTRAYAL CANNOT SAY SO.
    The owner: the rear I/O card has a main body that seats against the midplane plus a TONGUE
    at the top that passes THROUGH an opening in the midplane and plugs directly into the front
    card. `body:` takes a depth, a colour, an optional smaller footprint and a plate - all of
    which describe a BOX. There is no way to declare a body that is full slot height for part
    of its depth and a narrower section for the rest.
    So this contract declares NO body rather than declaring a box that is wrong in a way
    nothing records. That is the same call this library made on the MCX recess: where the
    vocabulary cannot express the shape, say so and leave the record, because a wrong shape
    with no note is worse than an absent one.
    WANTED: either a body section - a list of depth bands with their own footprints - or the
    honest acknowledgement that a mid-plane-mating card needs its own kind.'
  variant: 'drawing - the IO2 is a REAL, separately orderable card, not a relabelling.
    Both guides list it as an alternative wherever the plain 6+12 goes: "Slots 0
    to 4 - 6+12 IO or 6+12 IO2 module", "Slot 8 - 6+12 SW-IO or 6+12 SW-IO2" on
    the C100G, and the same pairs on the C40G. What differs is the upstream spectrum
    and therefore which BDM it pairs with: Table A-10 heads the plain card "BDM
    6+12 (BDM with 6+12 IO)" at "Up to 85 MHz", and Table A-11 heads the IO2 "BDM
    6+12 (BDM_204MHZ and BDM2m_204MHZ with 6+12 IO2)" at "Up to 204 MHz". The C40G
    data sheets ordering table names the part: "BDM6-12-IO2 - BDM2/2M IO card 204
    MHz-capable, supporting 6 DS and 12 US ports"'
  geometry: 'drawing - the faceplate is the plain cards, deliberately and on the
    vendors authority: casa/io-6p12 already recorded that "The IO2 variant is the
    same faceplate at 5-204 MHz instead of 5-85 MHz". Same eighteen MCX jacks on
    the same axes, same cable comb, same standoffs. Only the legend and the spectrum
    change. Jack positions and the composed std/mcx@1 aperture are taken from casa/io-6p12@2
    and casa/io-6p12-sw@2 rather than re-derived, so the four cards cannot drift
    apart'
  power: 'NONE STATED, same as the plain card. No table in either guide gives
    an I/O module a figure - Tables A-8 and A-9 give the RFD and RFU their connectors
    and nothing else - and the BDMs "approximately 300W" is scoped to the BDM WITH
    its I/O card, which is the front halfs figure carrying power-draw-scope: module-with-paired-io.
    Writing anything here would double count that pairing. The L27 warning is the
    record'
  layout: drawing - Figure 1-15 of the Casa C100G Hardware Installation Guide
    (rev 07/08/2022). Twelve U jacks in the left column, six D in the right,
    interleaved. Port COUNT and ARRANGEMENT are read straight off the figure
    and are reliable
  size: ESTIMATED. The guide figures are schematic, not to scale - the drawn
    chassis aspect is 0.936 against a specified 0.844, and the drawn slot
    pitches are irregular (108, 130, 78, 112 px for what should be one pitch).
    Width is arithmetic from Table A-1 instead - 19in rack, ~440mm interior,
    14 slots gives 31.43. Height is bracketed by two schematic estimates that
    disagree by 10 percent - 461mm from the front-view proportion, 417mm from
    the Fig 1-15 faceplate aspect - so 440 is the midpoint. Needs a caliper
  connector: drawing - the figure's cable note reads "Single quad-shielded
    cable with MCX male snap-on plug; 75 ohm male F-connector on opposite end",
    so the jack on this card is MCX and the F-connector is at the headend end
  bore: registry - THIS IS THE VERSION BUMP. v1 drew the eighteen MCX openings
    inline; v2 COMPOSES std/mcx@1, so the aperture is the registry's `mcx` key (4.95 x
    4.50 D-hole, Radiall R113.553.000 panel drawing) instead of the estimate this
    card used to carry. Every jack AXIS is unchanged - only the
    hole's size and shape moved, from a guessed rectangle to the sourced D-hole
    (proved by diffing the compiled drawing - 18/18 axes land within 0.005 mm,
    which is the old skin's two-decimal rounding and not a move). Note the
    composed part is placed on its AXIS, which sits 2.475 from the top of a
    4.50-high D-hole rather than at half its height.
    The two cards had disagreed with each other about the same connector (3.87 x
    3.14 here against 3.88 x 3.88 on the SW card); they now cannot
  rf-layout: drawing - Figure 1-16, measured separately from Figure 1-15 rather
    than copied. The SW card's port field is SHORTER and more compressed - it spans
    18.6 to 72.7 percent of the plate against the plain card's 12.1 to 73.7, and its
    U pitch is 4.84 percent of plate height against 5.60. Jason flagged this; the
    figures agree
  shape: photograph - a C40G rear shot with plain 6+12 I/O in slots 0 and 5 and
    this card in slot 4 shows they are NOT the same. This one has slightly
    different overall dimensions and a section carrying the RF ports that stands
    about 5/8in (15.9mm) proud of the faceplate, ahead of the comb. The
    dimensional difference is visible but not yet measured, so this card is
    modelled at the plain card's envelope for now - that part is ESTIMATED
  comb: photograph - a C40G rear shot shows every I/O card fronted by a cable
    comb carried on brass standoffs. Jason measured the standoffs at about 3/8in
    (9.5mm) proud of the faceplate and the comb itself at about 1/16in (1.6mm)
    thick. The comb is notched per port and carries the U0-U11 / D0-D5 silkscreen,
    and the labels appear on BOTH the card face and the comb - the comb
    repeats them where the cable actually lands rather than replacing them
  rf-block-3d: 'THE THREE ENTRIES rf-block-3d, mcx-is-recessed AND standoff-vs-block
    ARE THE SAME TEXT casa/io-6p12-sw@2 CARRIES, written there and copied here. ONE
    analysis of one defect that both files share because the two skins were built from
    each other - NOT two independent findings that agreed. Restated rather than
    cross-referenced for the reason this file''s power entry gives.
    CORRECTED, AND THE CORRECTION REVERSES PART OF THE FIRST PASS. Read
    this before touching the RF section again.
    WHAT WAS FIXED AND STAYS FIXED: `rf-block` was a BARE RECT. A raised solid is
    textured from ITS OWN node''s art, so a 27.27 x 202.02 rect at fill-opacity 0.18
    extruded as a blank translucent slab standing over everything - the "switch I/O
    card with no ports in it". It is now a GROUP holding that rect and the eighteen
    U0-U11 / D0-D5 legends, which is right whether or not it is ever raised.
    WHAT WAS UNDONE: the `out: 15.9` on that group and the `lift: 15.9` on the
    eighteen composed jacks. Both are gone. THREE INDEPENDENT STRANDS point away from
    a raised RF section on this card and none of them existed when the 15.9 was
    written:
    (1) THE OWNER, LOOKING AT THE HARDWARE: "on some of the 6 plus 12 I/O cards the
        MCX connector is RECESSED INTO the faceplate, so it actually doesn''t stick
        out from the faceplate ... whereas the US I/O and the DS I/Os have the F
        fitting STICKING OUT". Jacks mounted on a section standing 15.9 proud would
        stick out further than anything else on the card, which is the opposite.
    (2) THE FIGURE DRAWS THE SAME OUTLINE ON THE PLAIN CARD. Figure 1-15, "Casa 6+12
        IO modules", and Figure 1-16, "Casa 6+12 Switch I/O modules", are the same
        artwork in this respect: both enclose the port field in one light rectangle
        with three hex standoffs inside it, and both put a notched cable retention
        bracket beside it. So the rectangle is not what distinguishes the switch card.
        casa/ups-32x4 reads the IDENTICAL artwork as "the footprint the cable
        retention plate seats against ... drawn as a silkscreen outline, not as
        relief, because nothing states its depth" - and that call was made
        independently, before this one, on a different card.
    (3) THE STANDOFF ARITHMETIC. The owner has since confirmed the topology -
        FACEPLATE, then RF section, then COMB, with the standoffs "raising the comb up
        above the faceplate" - so a standoff must clear everything under it. At 9.5
        it cannot clear a 15.9 block. That contradiction only exists if the block is
        raised, and it disappears when it is not, which is evidence rather than
        convenience.
    WHAT IS NOT CLAIMED: that Jason''s 5/8in reading is wrong. It is a photograph of
    real hardware and it stays recorded in `shape` above, untouched. Something on this
    card stands proud; what is now in doubt is whether it is the port field. THIS IS
    A SUSPENDED MEASUREMENT, NOT A WITHDRAWN ONE.
    THE RECESS CANNOT BE MODELLED AT ALL TODAY, and that is the real gap. Portrayal
    has no way to say "this REGION of a module''s face is a pocket": `sink` is the
    right word and exists in the schema, but the extractor only reads it inside a
    node that already carries data-depth, and `relief.cavity` on a module would turn
    the whole 380 mm card into a cavity. So the port field is flat - which is wrong,
    but it is wrong by the same amount the plain card is, instead of wrong in the
    opposite direction by 15.9. WANTED: a way to declare a face pocket, and then the
    pocket depth, which no figure or document gives.'
  mcx-is-recessed: 'THE OWNER, AGAINST THE HARDWARE: "the MCX connector is RECESSED
    INTO the faceplate, so it actually doesn''t stick out from the faceplate, it''s
    recessed from the faceplate ... whereas the US I/O and the DS I/Os have the F
    fitting STICKING OUT of the faceplate." Recorded here in his terms so it does not
    have to be rediscovered, and it is a fact about the WORLD, not about a drawing.
    THE FIGURES AGREE, INDEPENDENTLY. Figure 1-12, "RF IO upstream and downstream
    modules", draws all three rear I/O cards side by side and gives the two connector
    families completely different treatments: on QAM IO and US IO each F port is a HEX
    NUT with concentric rings and a shadow - a connector body standing off the plate -
    while on UPS IO 32 each MCX port is a small flat dark circle with no hex and no
    body at all. Figures 1-15 and 1-16 draw the 6+12 cards'' MCX the same flat way.
    That is a second source, and it was read after the owner spoke rather than before,
    so it is confirmation and not the thing that suggested it.
    THIS CONTRACT CANNOT ACT ON IT YET. The aperture is composed from std/mcx@1, whose
    relief is {node: barrel, cyl: 2.0} - a PROTRUSION, sourced from the Radiall
    R113.553.000 side elevation, which is a FRONT-MOUNT bulkhead jack whose flange
    genuinely does sit on the front of its panel. That part is not wrong about the
    Radiall connector; it is the wrong VARIANT for every card that uses it, and all
    five of its users are Casa. Reported to the team lead rather than edited, because
    it is a std/ part and because the registry note in spec/schemas/standards.yaml
    says the same thing ("a hole through sheet metal with the barrel standing proud of
    it"), so the two would have to move together.
    NO DEPTH IS GUESSED. The owner gave a topology, not a dimension, and nothing in
    either guide gives a recess depth. WANTED: how far below the faceplate the MCX
    interface sits - one caliper reading, or a side-on photograph of a 6+12 card.'
  standoff-vs-block: 'THE SWITCH CARD''S STANDOFF HEIGHT WAS NEVER MEASURED, and 9.5
    is carried here without confirmation. This entry supersedes the unresolved
    contradiction the first pass recorded; the owner has since answered the question
    that was put to him.
    WHAT HE SETTLED - the topology: "the comb stands in front of the RF block. So it''s
    away from the card ... That''s what the standoffs do is they raise the comb up
    above the faceplate and help hold the cables." So the order outward from the card
    is FACEPLATE, RF SECTION, COMB, with the comb furthest out. That is now a sourced
    fact and should not have to be asked again.
    WHAT HE DID NOT SETTLE - the 9.5. The `comb` entry above has him measuring the
    brass standoffs about 3/8in proud of the faceplate off ONE C40G rear photograph,
    and that same photograph contains PLAIN 6+12 CARDS IN SLOTS 0 AND 5 WITH NO RF
    SECTION AT ALL. On one of those, 9.5 is entirely sensible - there is nothing to
    clear. So the most likely reading is that 9.5 is a correct measurement OF A
    DIFFERENT CARD and this card''s standoff was never measured. That is a materially
    different state from "9.5 is wrong", and it is why the number is left alone rather
    than replaced: 15.9-plus-a-bit would be arithmetic dressed as a measurement.
    AND IF THE RF SECTION DOES STAND 15.9 PROUD, THE STANDOFF MUST EXCEED IT. That
    constraint is recorded even though this contract no longer raises the section (see
    rf-block-3d for why), because it is the check that will catch the error if the
    section turns out to be raised after all.
    WANTED: a photograph of a SWITCH I/O card with a rule in frame, or a Casa
    mechanical drawing. One reading closes both this and the 15.9.'
  missing-component: 'THE CABLE COMB IS A REAL, NAMED PART AND THIS LIBRARY DOES NOT
    HAVE ONE. The `comb` entry above describes it from a photograph; the guides name it
    and draw it. Figures 1-15 and 1-16 of the C100G guide are captioned "6+12 IO Module
    w/ cable retention bracket" and "6+12 SW IO Modules w/ cable retention bracket", and
    each draws the bracket as its OWN object beside the card - a notched strip with the
    U and D numbers printed between the notches and three screws through it, one per
    standoff. Figure 2-15 of the C40G guide names the equivalent outright, "UPS 32x4 I/O
    cable retention plate", and draws it separated from its module.
    So casa/ is missing a component, not a decision: there is no cable-retention-plate
    part and none of the four I/O card families can seat one, even though the three
    standoffs on this faceplate exist for no other purpose than to carry it. Recorded
    rather than built - building it is a modelling job with its own sourcing, not part
    of a relief pass. It is NOT casa/cable-manager, which is a different bracket on the
    chassis front. WRITTEN FIRST IN casa/ups-32x4@1 and restated here.'
  relief: 'the C100G/C40G card family treatment - two captive screws (cyl 1.6), the
    ejector latch strip (out 4.2). THE FULL ARGUMENT IS IN casa/bdm@1 AND THIS IS A
    POINTER TO IT, not a second reading: the magnitudes are one estimate per kind of
    hardware, taken from edgecore/agr-panel-screw@1 for a screw head and edgecore/agr-psu-dc@1 for the ejector latch, applied across the family because these cards share a faceplate.
    No Casa document states a depth for any of them. Eleven cards carrying 4.2 is ONE
    estimate written eleven times, not eleven readings that agreed. NOTE this card has
    NO LAMPS, so the family''s dome figure is deliberately not cited here - citing a
    source for a number a file does not carry is how an inert wrong claim gets started. The three brass comb standoffs above are a separate, PHOTO-MEASURED number and are not part of this family treatment.'
relief:
  wall: '#4a4f55'
  features:
    # Two captive slotted screws on the centreline - the guide's own
    # "integrated thumbscrews" / "captive screws".
    - {node: screw-t, cyl: 1.6, confidence: estimated, source: 'edgecore/agr-panel-screw@1 - the library one figure for a captive screw head. NOT MEASURED: that part own provenance reads estimated - it stands proud but was not measured'}
    - {node: screw-b, cyl: 1.6, confidence: estimated, source: 'edgecore/agr-panel-screw@1 - the library one figure for a captive screw head. NOT MEASURED: that part own provenance reads estimated - it stands proud but was not measured'}
    # The ejector latch strip.
    - {node: latch-t, out: 4.2, confidence: estimated, source: 'edgecore/agr-psu-dc@1 latch - the library one figure for an ejector latch. NOT MEASURED: that part measured 360.7 is the MODULE depth; the latch height is sourced nowhere'}
    - {node: latch-b, out: 4.2, confidence: estimated, source: 'edgecore/agr-psu-dc@1 latch - the library one figure for an ejector latch. NOT MEASURED: that part measured 360.7 is the MODULE depth; the latch height is sourced nowhere'}
    # Brass standoffs stand 3/8in proud of the faceplate, centred across the
    # card, and carry the comb when it is fitted
    - {node: standoff-t, out: 9.5, color: '#b08d57', confidence: photo-measured, source: 'Jason - 3/8in off one C40G rear photograph. All twelve are that ONE reading'}
    - {node: standoff-m, out: 9.5, color: '#b08d57', confidence: photo-measured, source: 'Jason - 3/8in off one C40G rear photograph. All twelve are that ONE reading'}
    - {node: standoff-b, out: 9.5, color: '#b08d57', confidence: photo-measured, source: 'Jason - 3/8in off one C40G rear photograph. All twelve are that ONE reading'}
    # NOTE: rf-block carries NO relief. It was raised 15.9 out and that has been
    # reversed - see provenance/rf-block-3d. It stays a GROUP so that if it is ever
    # raised again it carries its own port legends instead of extruding blank.
