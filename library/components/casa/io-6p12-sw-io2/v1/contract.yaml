    - {node: standoff-m, out: 9.5, color: '#b08d57'}
    - {node: standoff-b, out: 9.5, color: '#b08d57'}
    # the RF section stands proud of the faceplate, which the plain card does not
    - {node: rf-block, out: 15.9, color: '#9aa0a6'}
