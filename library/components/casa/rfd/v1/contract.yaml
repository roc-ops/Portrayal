format: 1
kind: module
name: rfd
version: 1.6.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Casa RF Downstream I/O module (RFD) - the rear half of a DQM position, carrying
  the eight downstream F-type ports for one DS 8x8, DS 8x96 or DS 8x192 line card
  in the paired front slot. Silkscreened QAM IO. It carries no electronics of its
  own that the guide describes; it is the mechanical and electrical QAM
  connection to the HFC network.
size: {w: 30.47, h: 345.5, d: 380.0}
size-confidence: {d: known-wrong}
size-notes: 'd 380.0 is IMPOSSIBLE - a front and a rear card mate at a midplane inside a 386.0 chassis and two at 380.0 need 760. See provenance/depth-known-wrong'
attrs: {power-absent: not-applicable, model: 'QAM IO', role: downstream, media: coax, connector: f-type, rf-ports: '8', pairs-with: casa/ds-8x192}
provenance:
  depth-known-wrong: 'THE 380.0 IS NOT MERELY UNMEASURED, IT IS IMPOSSIBLE, and this
    contract now says so in a field a tool can read - size-confidence: {d: known-wrong}.
    THE CONSTRAINT. Front and rear cards MEET AT A MIDPLANE, which the owner photographed:
    working/photos/casa/c40g-empty-midplane.png shows the emptied cage with the card guides
    and the midplane at the back of it, and the opening where the rear I/O card reaches
    through to the front card. So a front card and its rear partner have to share the
    chassis depth - 386.0 on the C100G, 388.45 on the C40G. Two cards at 380.0 need 760,
    which is not a wide error bar, it is twice the box.
    WHAT THE SHAPE IS, from the owner: "the front card is mostly rectangular, but the I/O
    card is kind of L SHAPED where the top part of the top connector PASSES THROUGH THE
    MIDPLANE and plugs into the front card, and the other one is plugged into the midplane.
    So they ultimately kind of meet in the middle." So the rear card is a body against the
    midplane PLUS A TONGUE at the top reaching forward through it.
    NOTE WHAT THAT DOES AND DOES NOT ALLOW, because the obvious rule is wrong. front + rear
    CAN exceed the chassis depth, by about the tongue length, because the tongue overlaps the
    front card at a height where the front card is not - they interleave rather than tile. The
    constraint is therefore an inequality with slack, not an equality. What it cannot absorb
    is a 374 mm overlap where a tongue is tens of millimetres.
    ONE PHOTOGRAPH IS USABLE AND IT IS NOT THIS CARD-FAMILY-WIDE. bdm2m-solder-side.jpeg has
    the faceplate FULLY IN FRAME, so its 345.5 long axis anchors the scale at 5.00 px/mm; the
    card measures 1336 px from the faceplate to the top of its midplane connectors. Raw that
    is 267 mm. The shot is NOT orthographic - the PCB reads 4.66 percent wider at the
    connector end than at the faceplate end, which is perspective, not a taper - so correcting
    to the mean scale gives about 261, and taking the card top at the outermost connector edge
    instead pushes it to about 282. CALL IT 270 PLUS OR MINUS 12 AND DO NOT ROUND THAT AWAY.
    REJECTED, and the rejection is the useful part: bdm2m-top-plan.jpeg and both qam-io-card
    plan shots have the faceplate CLIPPED BY THE FRAME, so the 345.5 anchor is truncated and
    every number off them is understated by an unknown amount. Measured anyway, the top-plan
    gives 227 mm for the same card the solder side gives 270 - a 19 percent disagreement that
    is entirely the broken anchor. They are not second opinions and must not be averaged in.
    NOTHING IS REPLACED. 270 plus or minus 12 is one reading of one card from one photograph
    that fails gate 1, and stamping it on twelve cards would be the family-number pattern
    doing harm instead of good - these cards share a FACEPLATE, which is established, not a
    depth, which is not. What is established is that 380.0 cannot be true.
    WANTED, in order of how much each unlocks: a tape on any one front card (fixes it
    outright); a tape on any one rear I/O card; an unclipped side-on photograph of a rear card
    showing where the tongue begins, which would give the midplane position and both halves
    at once.'
  body-shape-not-a-box: 'THIS CARD IS AN L IN SIDE ELEVATION AND PORTRAYAL CANNOT SAY SO.
    The owner: the rear I/O card has a main body that seats against the midplane plus a TONGUE
    at the top that passes THROUGH an opening in the midplane and plugs directly into the front
    card. `body:` takes a depth, a colour, an optional smaller footprint and a plate - all of
    which describe a BOX. There is no way to declare a body that is full slot height for part
    of its depth and a narrower section for the rest.
    So this contract declares NO body rather than declaring a box that is wrong in a way
    nothing records. That is the same call this library made on the MCX recess: where the
    vocabulary cannot express the shape, say so and leave the record, because a wrong shape
    with no note is worse than an absent one.
    WANTED: either a body section - a list of depth bands with their own footprints - or the
    honest acknowledgement that a mid-plane-mating card needs its own kind.'
  size: ESTIMATED, and shared with the whole C100G/C40G rear-slot family. Figure
    1-12 is schematic - it draws these three cards 309, 295 and 288 px wide for
    one physical card, and the guide's chassis aspect is 0.936 against a
    specified 0.844 - so nothing absolute is taken from it. The envelope is the
    rear-slot bay in the C100G device manifest, 30.47 x 345.5, and the depth is
    the family estimate carried by casa/io-6p12
  layout: drawing - Figure 1-12 of the Casa C100G Hardware Installation Guide
    (rev 07/08/2022), "RF IO upstream and downstream modules", which draws all
    three rear I/O cards side by side. Port COUNT, port ORDER and the column
    arrangement are read straight off it and are reliable; positions are taken
    as fractions of the drawn plate, measured by colour detection at 600 dpi
  furniture: drawing - the same figure. Two captive screws on the card
    centreline, the orange band(s) and the legend below them, and the latch
    strip on the RIGHT of the plate. Note that casa/io-6p12 draws its latch
    strip on the LEFT while both Figure 1-12 and Figure 1-15 put it on the
    right; these cards follow the figures
  ports: drawing - Table A-8 of the same guide, headed "RFD specifications",
    gives "8 ports per RFD" and a connector row reading "F-type, 75 ohm, SCTE
    compliant" with a maximum torque of 20 inch-pounds. The aperture itself is the registry's `f-type` key - Casa
    states the connector type and no dimension, which is exactly the case the
    registry exists for
  positions: drawing - one column at 0.528 of the plate width, eight ports on a
    uniform 26.43 mm pitch from 77.65. The measured per-port x scatters +-0.4 mm
    down the card, which is figure jitter rather than a real skew, so a single
    column x is used. Note the RFU's column measures 1.15 mm further right on
    the same figure; the two cards are NOT forced onto one x, because nothing
    says they share one
  power: >-
    NOT APPLICABLE, because this part is one half of a pair the vendor measures together and
    the other half already carries the number. Every Casa power figure in the C40G and C100G
    hardware guides is scoped to the FRONT card with its I/O module - 'Table 4-1. BDM 6+12
    (BDM with 6+12 IO) ... Power consumption | Approximately 300W per BDM' - and there is no
    separate figure for the rear half anywhere in either guide. Recording a wattage here
    would DOUBLE COUNT: the partner contract carries power-draw-scope: module-with-paired-io
    precisely so a consumer knows its figure already contains this card. So a chassis total
    is complete without a number here, which is what separates this from not-published -
    nothing is missing.
  f-type-stands-proud: 'THE OWNER, AGAINST THE HARDWARE: "the US I/O and the DS I/Os
    have the F fitting STICKING OUT of the faceplate", against the MCX cards where "the
    MCX connector is RECESSED INTO the faceplate". This card is on the PROUD side of
    that distinction and it must not inherit the MCX treatment.
    THIS SENTENCE IS COPIED FROM casa/io-6p12-sw@2, where the pair was written up
    first. One statement about one pair of families, restated where it applies.
    NOTHING NEEDED CHANGING, WHICH IS THE POINT OF RECORDING IT. std/f-type@1 already
    models the connector as proud - a hex nut at cyl 2.4 with the 3/8-32 threaded neck
    as a threaded cyl running 2.4 to 13.0 off the face - because the F thread IS the
    mating interface and has to be outside the panel. So the owner''s statement
    CONFIRMS an existing model rather than correcting one, and this entry exists so
    that a later pass correcting the MCX cards does not sweep these two along with them.
    THE FIGURE AGREES AND SHOWS THE CONTRAST DIRECTLY. Figure 1-12 (C100G), "RF IO
    upstream and downstream modules", draws QAM IO, US IO and UPS IO 32 side by side:
    every F port is a hex nut with concentric rings and a drop shadow, every MCX port
    on the neighbouring card is a flat dark circle with no body at all. One figure,
    both families, opposite treatments.'
  relief: 'the C100G/C40G card family treatment - two captive screws (cyl 1.6), the
    ejector latch strip (out 4.2). THE FULL ARGUMENT IS IN casa/bdm@1 AND THIS IS A
    POINTER TO IT, not a second reading: the magnitudes are one estimate per kind of
    hardware, taken from edgecore/agr-panel-screw@1 for a screw head and edgecore/agr-psu-dc@1 for the ejector latch, applied across the family because these cards share a faceplate.
    No Casa document states a depth for any of them. Eleven cards carrying 4.2 is ONE
    estimate written eleven times, not eleven readings that agreed. NOTE this card has
    NO LAMPS, so the family''s dome figure is deliberately not cited here - citing a
    source for a number a file does not carry is how an inert wrong claim gets started.'
