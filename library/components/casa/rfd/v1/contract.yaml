  - {ref: std/f-type@1, id: p4, at: [11.24, 179.412]}
  - {ref: std/f-type@1, id: p5, at: [11.24, 205.84]}
  - {ref: std/f-type@1, id: p6, at: [11.24, 232.268]}
  - {ref: std/f-type@1, id: p7, at: [11.24, 258.696]}
connection-points:
