format: 1
kind: module
name: io-6p12-sw
version: 2.2.0
class: line-card
profile: networking
description: >-
  Casa 6+12 SW I/O - the combined switch and I/O card. Same six downstream and
  twelve upstream MCX jacks as the plain 6+12, but it also carries the LC switch
  function, so it goes in the redundancy slot that a BDM scheme frees up: C100G
  rear 8, C40G rear 4. Its RF port section stands proud of the faceplate.
  (v2 = composed - the eighteen MCX openings are std/mcx@1 at the sourced
  4.95 x 4.50 D-hole; v1 drew them inline at an ESTIMATED 3.88 x 3.88, so an
  aperture here is about 28 percent wider in x and 16 percent in y than it was
  at v1. Jack AXES are unchanged.)
size: {w: 30.47, h: 345.5, d: 380.0}
attrs: {model: '6+12 SW IO', media: coax, connector: mcx, downstream: '6', upstream: '12', spectrum: 5-85MHz, switch: 'yes', slot: C100G-rear-8 / C40G-rear-4}
provenance:
  power: >-
    NONE STATED, and the reasoning is the plain card's - see casa/io-6p12, which carries
    it in full. Restated rather than cross-referenced only, because a contract that sends
    the reader to another file for why a figure is absent is one step from having no
    answer at all.
    THE SHORT FORM: no table in either Casa guide gives an I/O module a power figure, and
    the BDM's "approximately 300W" already covers the BDM together with its paired I/O
    card under power-draw-scope: module-with-paired-io. A number here would double count
    that pairing. The absence is correct rather than merely unsourced.
    WHAT IS SPECIFIC TO THIS CARD: it is the SWITCH I/O variant, the rear half that goes
    in the protecting slot, and being the switch variant changes nothing about the
    argument - it is still an I/O module whose front partner carries the figure, so it
    inherits the double-count reasoning rather than escaping it. casa/io-6p12-sw-io2 has
    carried this since it was built and opens with "same as the plain card", asserting it
    about a file that did not say it; this is that assertion moved to where it applies.
    An echo of casa/io-6p12's entry, not independent confirmation of it.
  layout: drawing - Figure 1-15 of the Casa C100G Hardware Installation Guide
    (rev 07/08/2022). Twelve U jacks in the left column, six D in the right,
    interleaved. Port COUNT and ARRANGEMENT are read straight off the figure
    and are reliable
  size: ESTIMATED. The guide figures are schematic, not to scale - the drawn
    chassis aspect is 0.936 against a specified 0.844, and the drawn slot
    pitches are irregular (108, 130, 78, 112 px for what should be one pitch).
    Width is arithmetic from Table A-1 instead - 19in rack, ~440mm interior,
    14 slots gives 31.43. Height is bracketed by two schematic estimates that
    disagree by 10 percent - 461mm from the front-view proportion, 417mm from
    the Fig 1-15 faceplate aspect - so 440 is the midpoint. Needs a caliper
  connector: drawing - the figure's cable note reads "Single quad-shielded
    cable with MCX male snap-on plug; 75 ohm male F-connector on opposite end",
    so the jack on this card is MCX and the F-connector is at the headend end
  bore: registry - THIS IS THE VERSION BUMP. v1 drew the eighteen MCX openings
    inline; v2 COMPOSES std/mcx@1, so the aperture is the registry's `mcx` key (4.95 x
    4.50 D-hole, Radiall R113.553.000 panel drawing) instead of the estimate this
    card used to carry. Every jack AXIS is unchanged - only the
    hole's size and shape moved, from a guessed rectangle to the sourced D-hole
    (proved by diffing the compiled drawing - 18/18 axes land within 0.005 mm,
    which is the old skin's two-decimal rounding and not a move). Note the
    composed part is placed on its AXIS, which sits 2.475 from the top of a
    4.50-high D-hole rather than at half its height.
    The two cards had disagreed with each other about the same connector (3.87 x
    3.14 here against 3.88 x 3.88 on the SW card); they now cannot
  rf-layout: drawing - Figure 1-16, measured separately from Figure 1-15 rather
    than copied. The SW card's port field is SHORTER and more compressed - it spans
    18.6 to 72.7 percent of the plate against the plain card's 12.1 to 73.7, and its
    U pitch is 4.84 percent of plate height against 5.60. Jason flagged this; the
    figures agree
  shape: photograph - a C40G rear shot with plain 6+12 I/O in slots 0 and 5 and
    this card in slot 4 shows they are NOT the same. This one has slightly
    different overall dimensions and a section carrying the RF ports that stands
    about 5/8in (15.9mm) proud of the faceplate, ahead of the comb. The
    dimensional difference is visible but not yet measured, so this card is
    modelled at the plain card's envelope for now - that part is ESTIMATED
  comb: photograph - a C40G rear shot shows every I/O card fronted by a cable
    comb carried on brass standoffs. Jason measured the standoffs at about 3/8in
    (9.5mm) proud of the faceplate and the comb itself at about 1/16in (1.6mm)
    thick. The comb is notched per port and carries the U0-U11 / D0-D5 silkscreen,
    and the labels appear on BOTH the card face and the comb - the comb
    repeats them where the cable actually lands rather than replacing them
  figure-check: drawing - RE-MEASURED against Figure 1-16 at 600 dpi for the v2
    bump, rather than trusted because v1 had used them. Twelve U jacks at x 8.685
    of a 30.47 plate, y 67.11 to 251.00 on a 16.717 pitch, and six D jacks at x
    19.917, y 64.12 to 225.81 on a 32.339 pitch. What this contract carries -
    8.61 / 67.11 / 16.729 and 19.87 / 64.18 / 32.356 - agrees with all six to
    0.08 mm, so the composed apertures land where the FIGURE puts them and not
    merely where they used to be. It also re-confirms the separate measurement
    this card's `rf-layout` note records - the SW card's port field really is
    shorter and tighter than the plain card's.
    The drawn jack is 7.85 mm across overall (36 radii, spread 0.4 mm) with a
    3.28 mm coloured centre, the same art as Figure 1-15. That is the connector as
    seen rather than the panel hole - the Radiall sheet gives an MCX bulkhead
    flange at 6.5 mm dia - so a 4.95 hole under a 6.5 flange is what the figure
    draws, and v1's 3.88 x 3.88 was smaller than either.
    Clearance is not close even here, where the pitch is tightest of the two
    cards - 16.72 between U jacks and 11.2 between the columns against a 4.95
    aperture. Nothing had to be compressed.
  rf-block-3d: 'THE RAISED RF SECTION WAS DRAWING AS A BLANK PLATE OVER THE PORTS,
    which is the "switch I/O card with no ports in it" the owner reported, and it was
    two separate defects.
    FIRST, `rf-block` was a BARE RECT. relief.features textures a raised solid from ITS
    OWN node''s art, so a 27.27 x 202.02 rect at fill-opacity 0.18 extruded 15.9 mm
    produced exactly what it says: a blank translucent slab. It is now a GROUP holding
    that rect and the eighteen U0-U11 / D0-D5 legends, so the block face carries its own
    printing. This is the "put `out` on a group holding the part and all its detail,
    never on a bare rect" rule, and it had been missed here.
    SECOND, the eighteen MCX jacks are COMPOSED parts and composed parts are siblings of
    the block, not children of it - so with the block 15.9 mm proud they were left lying
    on the faceplate underneath it. Each part now declares `lift: 15.9`, which is the
    correct statement: the jacks are mounted ON the raised section, so their faces sit at
    the block face and their barrels stand 2.0 further out from there.
    THAT LIFT IS NOT HONOURED BY THE 3D VIEWER TODAY, and saying so is the point of this
    entry. render.py writes it as data-z-lift on the composed part''s instance GROUP,
    and library/demo2/relief.js reads data-z-lift off the FEATURE element itself when it
    collects outs (a dataset is not inherited), so a lift on the parent group reaches
    cavity parts and not protruding ones - and std/mcx@1 is a protruding `cyl`, not a
    cavity. Until the extractor walks up for an ancestor lift, the barrels will still
    draw at the panel. The DATA is right; one renderer line is not. Reported.'
  standoff-vs-block: 'AN UNRESOLVED CONTRADICTION IN THIS FILE, recorded rather than
    reconciled. The `comb` entry has Jason measuring the brass standoffs about 3/8in
    (9.5 mm) proud of the FACEPLATE; the `shape` entry has him measuring the RF section
    about 5/8in (15.9 mm) proud of the same faceplate. Both readings are off one C40G
    rear photograph and both are carried here. On this card all three standoffs sit
    INSIDE the block''s footprint, so at 9.5 against 15.9 they are buried in it - a
    standoff 6 mm shorter than the thing it passes through cannot carry a comb.
    Something has to give and it is not obvious which: "ahead of the comb" in the shape
    entry can mean the block stands further out than the comb, or that it sits between
    the faceplate and the comb, and the two readings may also have been taken on
    DIFFERENT CARDS - the same photo has plain 6+12 cards in slots 0 and 5, which have
    no RF block at all, and the standoff reading would be right on those.
    NOTHING IS CHANGED. Deriving out 25.4 (block face plus the measured 9.5) would be
    arithmetic dressed as a measurement, and it would silence the only check that can
    see the problem. WHAT WOULD SETTLE IT: one question to Jason - on the SW card, does
    the comb stand in front of the RF block or behind it - or one side-on photograph.'
  relief: 'the C100G/C40G card family treatment - two captive screws (cyl 1.6), the
    ejector latch strip (out 4.2). THE FULL ARGUMENT IS IN casa/bdm@1 AND THIS IS A
    POINTER TO IT, not a second reading: the three magnitudes are one estimate per kind of
    hardware, borrowed from edgecore/agr-panel-screw@1, edgecore/agr-psu-dc@1 and
    common/led-dot@1, applied across the family because these cards share a faceplate.
    No Casa document states a depth for any of them. Eleven cards carrying 4.2 is ONE
    estimate written eleven times, not eleven readings that agreed. The three brass comb standoffs above are a separate, PHOTO-MEASURED number and are not part of this family treatment.'
relief:
  wall: '#4a4f55'
  features:
    # Two captive slotted screws on the centreline - the guide's own
    # "integrated thumbscrews" / "captive screws".
    - {node: screw-t, cyl: 1.6}
    - {node: screw-b, cyl: 1.6}
    # The ejector latch strip.
    - {node: latch-t, out: 4.2}
    - {node: latch-b, out: 4.2}
    # Brass standoffs stand 3/8in proud of the faceplate, centred across the
    # card, and carry the comb when it is fitted
    - {node: standoff-t, out: 9.5, color: '#b08d57'}
    - {node: standoff-m, out: 9.5, color: '#b08d57'}
    - {node: standoff-b, out: 9.5, color: '#b08d57'}
    # the RF section stands proud of the faceplate, which the plain card does not
    - {node: rf-block, out: 15.9, color: '#9aa0a6'}
