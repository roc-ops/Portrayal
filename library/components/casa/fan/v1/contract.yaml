format: 1
kind: module
name: fan
version: 1.8.0
class: fan
behaviour: fills
profile: networking
description: >-
  Casa C100G fan assembly module. Three sit side by side above the rear card
  band - LEFT, CENTER and RIGHT - and each contains two fans, designated 0 =
  front and 1 = back. The face is a punched perforation grid with a pull
  handle across the lower third and an indicator panel carrying a hot-swap
  button and HS / alarm / OK indicators. Maximum 100 W each, 300 W across the
  three.
attrs: {model: 'Fan Assembly', power-draw-max-w: 100}
size: {w: 137.25, h: 91.2, d: 150.0}
provenance:
  led-states: >-
    datasheet - C100G Hardware Installation Guide (rev 07/08/2022) Table 1-4 and Table 6-3,
    System fan module LEDs: Green (running normally, normal cooling speed) or off (no power);
    Red (one or more fans failed) or off; Blue (fans at high RPM to maintain cooling) or off.
    The table names colours, not the three printed marks, so which lamp is which is read from
    the marks: the boxed OK is the green, the warning triangle the red, HS the blue. Declared
    `ok`, `alarm` and `high-speed`; the green is the lamp green of the Casa photographs, red and
    blue are not measured. Every lamp is drawn OFF: the skin used to paint OK lit.
  layout: 'drawing - Figure 1-4 of the C100G Hardware Installation Guide, "C100G
    fan module", left panel "Fan tray front view". Measured as percentages of
    that figure''s face and stretched onto this module. The figure''s aspect is
    1.563 against this module''s 1.505, so it is close to scale, but fractions
    are used anyway'
  perforation-colour: the maintainer - the punched cells look THROUGH the faceplate into
    the chassis, so they are drawn dark with a light punch edge. Figure 1-4 shows
    them white, which is line-art convention, not what the part looks like
  perforation: 'drawing - 19 columns x 9 rows of punched cells, each 4.15 percent
    of the face wide and 7.83 percent tall, on a 5.09 x 10.84 percent pitch,
    starting at 2.31 / 2.75 percent. Three cells in the bottom row are blanked
    where the handle latches land'
  panel: 'drawing - indicator panel at 33.8 to 68.3 percent of the width and 1.6
    to 31.7 percent of the height. Hot-swap button at 40.2 percent, three
    indicators at 49.2 / 55.9 / 62.5 percent with their icons above them and the
    LEDs below - HS, warning triangle, boxed OK'
  size: 'drawing - the maintainer''s hand-built rear SVG, group `fanL`: 60.06 x 43.84 in a
    190.26-wide frame, mapped fractionally onto our 432.95 x 571 body and
    symmetrised across the three modules'
  power: 'CONFLICT, recorded not resolved. The HIG body text states "Each fan
    assembly module has a maximum power consumption of 100W, totaling 300W across
    the three fan assemblies", and Table A-2 gives the row "Fan assembly (3)" as
    "330W maximum, 220W typical" - both statements are about the set of three, and
    300 is not 330. 100 W is taken because it is the only figure the vendor states
    PER MODULE, which is the granularity this contract needs; dividing 330 by three
    would be our arithmetic rather than the vendor''s, and 220/3 would invent a
    per-module typical nobody published. The C100G carries a fan-power-sources
    gap naming both figures'
  count: datasheet - the guide names three fan modules, LEFT, CENTER and
    RIGHT, each with two fans designated either front or back
  airflow: 'CONFLICT, unresolved. Figure 1-5 and the body text say the fans draw
    air in at the FRONT BOTTOM through the filter and exhaust at the rear top,
    which would make this face an OUTLET. The maintainer states the opposite from the
    hardware - in at the rear, out at the front bottom. The filter sits on the
    front bottom opening, and filters belong on intakes, which favours the guide.
    Recorded rather than decided; see docs/casa-modular-chassis.md'
  relief: 'estimated depths, sourced kinds. WHICH nodes stand off the face and
    what they are is drawing - Figure 1-4, "C100G fan module", left panel "Fan tray
    front view", and Figure 7-11, "Fan assembly installation", which draws the same
    three trays in the chassis at higher fidelity. Between them: a punched
    perforation grid across the whole face, an indicator panel sitting on top of it,
    a pull handle across the lower third and three spring-latch slots in the bottom
    row.
    NO C100G DOCUMENT GIVES A DEPTH for any of them. Searched both guides for "fan
    assembly", "fan tray", "fan module" and Appendix A Table A-2; the tables carry
    power and airflow and no mechanical dimension at all. So: vent 25.0 is the
    library''s figure for a fan grille (common/fan-module@1 uses 25, edgecore/agr-fan@1
    uses 26); NEITHER OF THOSE IS A MEASUREMENT - neither part gives a grille
    depth, only a module depth. cyl 1.2 and dome 0.3 are the
    pushbutton and lamp idiom this library already uses (common/led-dot@1). The
    HANDLE is the one number that is not borrowed and not invented: bar 9.0 is the
    handle rect''s own drawn height, so the tube is as thick as the handle is drawn.
    Whether it stands 9 mm proud or 20 is unknown - a pull handle must clear enough
    for fingers, and 9.0 is the floor rather than a reading.
    THE INDICATOR BEZEL IS NOW RAISED, and the history is worth keeping. It was left
    FLAT in the first pass - deliberately, and recorded as such - because `dome`
    carried no `lift` in the relief extractor, so raising the bezel 1.5 would have
    buried the three lamps it holds at z 0 inside it, and the lamps are this module''s
    state display. That extractor gap has since been fixed (library/demo2/relief.js now
    sums data-z-lift up the ancestor chain and domes honour it), so the reason no longer
    applies and the panel is raised with the button and lamps lifted onto its face. A
    part that was deliberately wrong for a reason that has gone away must not quietly
    stay wrong. The 1.5 is the bolted-plate estimate, edgecore/agr-ground-plate@1''s.
    NOT RAISED, on purpose and not by oversight:
    - `latch-slots`. Figure 1-4 draws them black like the punched cells and Figure
      7-11 draws them as grey tabs, so it is not resolved whether they are openings
      in the metal or the spring latch standing in them. Two figures disagreeing about
      what a thing IS is not a depth question and is not answered by picking one.
    WHAT WOULD SETTLE ALL OF IT: one photograph of a C100G fan tray out of the chassis'
  body: 'the 150.0 is the size entry''s own ESTIMATED depth restated as a body so the
    tray draws as a solid rather than a face floating in the rear plate. NOTE the
    viewer will not eject it even so: it builds FRU groups for data-class psu, fan and
    tab, and every Casa and Cisco fan is class `cooling` while every Edgecore, UfiSpace
    and common one is class `fan` (library/demo2/relief.js). That split is reported,
    not papered over here'
  depth: estimated - not measured
elements:
  hs: {at: [65.8, 19.5], size: [3.4, 3.4], class: led, states: ['off', {name: high-speed, color: '#3b82f6'}]}
  alarm: {at: [75.0, 19.5], size: [3.4, 3.4], class: led, states: ['off', {name: alarm, color: '#ef4444'}]}
  ok: {at: [84.1, 19.5], size: [3.4, 3.4], class: led, states: ['off', {name: ok, color: '#39b54a'}]}
relief:
  wall: '#4a4f55'
  features:
    # The punched cells are REAL HOLES, not dark paint - Figure 1-4 draws the
    # whole face as a perforation grid and the guide's own note (see
    # perforation-colour) is that they look through the faceplate into the
    # chassis. `vent` is the only primitive that says that.
    - {node: perforation, vent: 25.0, confidence: estimated, source: 'common/fan-module@1 grille - NOT MEASURED: neither that part nor edgecore/agr-fan@1 which draws 26 gives a grille depth; both carry only a module depth'}
    # The pull handle. Figure 7-11 draws it as a light grey bar with an outline
    # standing on the grid, where Figure 1-4 draws it solid black at lower
    # fidelity; both put it in the same place and the guide calls it a handle.
    # `bar` at 9.0 is the node's OWN drawn short axis - a tube as thick as the
    # handle is drawn, which is the one diameter that is not a new number.
    - {node: handle, bar: 9.0, confidence: drawing, source: 'the handle rect own drawn 9.0 short axis - the diameter is drawn. The proudness is a FLOOR'}
    # The indicator bezel is a plate sitting ON the perforation grid - Figures 1-4
    # and 7-11 both draw it that way - so it is raised, and the button and the
    # three lamps it holds are lifted onto its face rather than left at the panel.
    - {node: panel, out: 1.5, confidence: estimated, source: 'edgecore/agr-ground-plate@1 - the library one figure for a bolted plate. NOT MEASURED: that part own provenance reads estimated - the plate stands slightly proud; not measured'}
    - {node: hs-button, cyl: 1.2, lift: 1.5, confidence: estimated, source: 'NO PRECEDENT - a panel pushbutton. Invented here'}
    - {node: hs, dome: 0.3, lift: 1.5, confidence: estimated, source: 'common/led-dot@1 - the library one figure for a panel lamp. NOT MEASURED: that part carries no depth or relief provenance, only size: estimated'}
    - {node: alarm, dome: 0.3, lift: 1.5, confidence: estimated, source: 'common/led-dot@1 - the library one figure for a panel lamp. NOT MEASURED: that part carries no depth or relief provenance, only size: estimated'}
    - {node: ok, dome: 0.3, lift: 1.5, confidence: estimated, source: 'common/led-dot@1 - the library one figure for a panel lamp. NOT MEASURED: that part carries no depth or relief provenance, only size: estimated'}
body:
  depth: 150.0
  color: '#8d949c'
skins: [default]
