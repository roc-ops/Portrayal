format: 1
kind: module
name: c40g-ac-inlet-panel
version: 1.6.0
class: inlet
behaviour: mounts
profile: networking
description: >-
  Casa C40G AC input panel - the bolted panel across the bottom of the REAR face
  on an AC chassis, where a DC chassis carries its two power entry modules. One
  continuous panel, not four module ends: it carries a rocker ON/OFF switch and
  an IEC C14 inlet for each of the four front-loaded PSUs, with vent mesh above
  and below.
size: {w: 349.2, h: 68.5, d: 20.0}
attrs:
  model: 'C40G AC Input Panel'
  role: ac-input
  inlets: '4'
  input: 115VAC or 240VAC auto-adjusting
provenance:
  positions: >-
    FIELDS, since 1.6.0 (docs/switch-positions-design.md, #808): `switch-1`, `switch-2`, `switch-3`, `switch-4`, each `off` or `on`. Each rocker is a SEE-SAW: one surface tipped about its centre, so the end it is set to presses in and the other end rises. I (a bar) at the top and O (a ring) at the bottom of each rocker, as Figure 1-11 draws them; OFF raises the I end and ON the O end, each a node shown for its position, shaded lighter toward its raised end and built in 3D as a sloped profile. The heights are estimated. The skin draws OFF; nothing held says how a unit ships.
  what-it-is: 'drawing - Figure 1-2, "C40G CMTS rear view (AC; non-redundant)",
    and Figure 1-3, its redundant twin. The bottom band of an AC chassis is ONE
    panel spanning the card-region width with screws at its corners and mid-edges
    and one captive screw at its centre - not four separate PSU rear faces. Figure
    1-11 shows the same four switch-and-inlet groups in isolation and calls them
    "C40G PSU On/Off switch and AC power receptacle"'
  why-not-bays: 'the four PSUs are already modelled as FRONT bays (casa/c40g-psu-ac),
    because that is where they load and where the guide numbers them. Declaring
    the rear groups as bays too would count each PSU twice in any module total.
    This panel is therefore ONE part standing for the chassis-side AC entry, and
    it holds no power figure - the PSUs hold it'
  mirroring: 'the four groups run PSU1 to PSU4 LEFT to right here, which is the
    mirror of the front, where the guide says they are "labeled on the front of
    the chassis as PSU1, PSU2, PSU3 and PSU4 from right to left". Walking round
    a chassis flips left and right. Group centres are the front bay centres mirrored
    about the panel width, so an inlet lands behind its own PSU'
  size: 'drawing, as FRACTIONS - Figure 1-2 renders at an aspect of 1.756 against
    the real 1.813, about 3 percent out, so it sits between Figure 1-1 (1.795, passes
    the gate) and Figure 1-10 (1.918, fails). Proportions only, anchored to the
    band already established from the DC rear: the panel occupies the same band the
    two PEMs do, and the same x 37.5 to 386.7 card-region width. The depth is ESTIMATED.
    HEIGHT CORRECTED 70.5 -> 68.5, AND IT IS THE SAME CORRECTION THE PEM BAYS ALREADY
    HAD. This panel was anchored to a band of y 194.0 to 264.5. The bottom edge is not
    in doubt, but 194.0 as the top edge is the reading the device`s `pem-band-top-edge`
    gap calls IMPOSSIBLE - the card slot above ends at 194.82 - and the manifest moved
    the PEM bays to 196.0 without this part following them. So one band was carrying two
    heights in one model, 68.5 for the DC openings and 70.5 for the AC panel that
    replaces them. NO NEW MEASUREMENT was taken and none is claimed: the band is
    whatever the gap eventually settles it to be, and the only assertion here is that
    the panel and the openings it stands in for are the SAME band.
    WHERE THE 2.0 WENT: off the two margins, 1.0 at each edge, so the drawing is still
    symmetric about its centre. NOT scaled uniformly - the four C14 inlets are an IEC
    60320 standard at 28.0 x 20.0 and the rockers are hardware, so squeezing the artwork
    would have shrunk parts that have a real size. The vent fields absorbed it, which is
    the only slack the drawing has. The corner screws keep their 4.5 inset from whichever
    edge they bolt to, so the bottom pair moved 2.0 and the top pair did not move at all'
  inlets: 'composed from std/c14-inlet@1 rather than drawn - the IEC 60320 C14
    appliance inlet at the standard 28.0 x 20.0 panel cutout. The figure draws the
    unmistakable C14 shroud, and the guide calls it an "AC power socket 115VAC or
    240VAC auto-adjusting"'
  relief: 'the four rockers and the seven screws, and nothing else.
    WHAT: Figure 1-11, "C40G PSU On/Off switch and AC power receptacle", draws a rocker
    switch and an IEC inlet per PSU with vent mesh above and below; Figures 1-2 and 1-3
    draw the panel bolted on with screws at its corners, mid-edges and one captive screw
    at its centre. The four C14 inlets carry their own relief through std/c14-inlet@1
    and are not re-declared here.
    HOW FAR: not stated anywhere in the C40G guides - searched "AC power", "receptacle",
    "On/Off", Appendix A. out 3.0 for a rocker bezel is the SAME number casa/pem carries
    for its breakers, and it is the same number for the same reason - one estimate for
    one class of panel-mounted rocker - NOT two independent readings that agreed. cyl 1.6
    is edgecore/agr-panel-screw@1. The skin gained an id per corner screw so each cyl
    takes its own radius; as one group of six spread over 340 mm it would have been a
    single cylinder the width of the panel.
    THE VENT REFUSAL IS LIFTED. The first pass declined `vent` on vent-top and
    vent-bottom because the skin drew the CELLS light on a grey panel, the inverse of
    what `vent` punches, and recorded that the answer was to fix the drawing WITH A
    SOURCE. The owner''s rear photograph of the AC chassis is that source: the bottom
    band of an AC chassis carries fields of fine perforation that are unmistakably DARK
    HOLES on light grey metal, above and below the inlet row and between the groups. The
    cells are now drawn dark and the vent is declared.
    THE PHOTOGRAPH ALSO CONFIRMS THE ARRANGEMENT this contract derived from Figure 1-11:
    a small black rocker switch immediately to the LEFT of each IEC inlet, four groups
    across. That was read off a figure and is now corroborated by hardware.
    ONE FIDELITY POINT, RECORDED RATHER THAN FIXED: the real perforation is ROUND holes
    on a staggered lattice; this skin draws a rectangular grid of rounded cells. That
    simplification predates this pass, the photograph shows it is a simplification, and
    changing it is a drawing job rather than a relief one.
    NO DEPTH COMES OFF THE PHOTOGRAPH. It is a perspective shot with nothing of known
    size in frame; the 20.0 is this contract own estimate restated.'
  placement: 'NOW PLACED, on the rear face, scoped `only-in: [ac-power]`. The
    previous note recorded this part as built-but-unplaced against a real format
    limitation - a configuration could carry bays, skins, airflow, region-context
    and part-numbers but NOT placements, so a bolted panel could not be switched
    per configuration, and marking it `optional:` would have hidden it everywhere
    because build.sh emits no --with variants.
    The limitation is gone. `only-in` on the bay or placement itself says which
    configurations that piece of METAL exists in, which is a different question
    from what is fitted into it, and it sits in the view because that is where
    geometry lives. The two PEM bays carry the mirror of it and are absent from
    ac-power, so nothing overlaps and L13 has nothing to reject: an AC chassis has
    one bolted panel here, a DC chassis has two module openings, and they are never
    both present. That also stops the bay picker offering a DC power entry module
    on a chassis that cannot take one'
