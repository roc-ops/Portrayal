  features:
    # Four rocker ON/OFF switches, one per PSU. Same bezel treatment and the same
    # 3.0 as casa/pem's breakers - one number for one kind of hardware, not two
    # readings that happened to agree.
    - {node: psu1-switch, out: 3.0, confidence: estimated, source: 'NO PRECEDENT - a panel rocker/breaker bezel. Invented here and reused across casa/pem and casa/c40g-ac-inlet-panel'}
    - {node: psu2-switch, out: 3.0, confidence: estimated, source: 'NO PRECEDENT - a panel rocker/breaker bezel. Invented here and reused across casa/pem and casa/c40g-ac-inlet-panel'}
    - {node: psu3-switch, out: 3.0, confidence: estimated, source: 'NO PRECEDENT - a panel rocker/breaker bezel. Invented here and reused across casa/pem and casa/c40g-ac-inlet-panel'}
    - {node: psu4-switch, out: 3.0, confidence: estimated, source: 'NO PRECEDENT - a panel rocker/breaker bezel. Invented here and reused across casa/pem and casa/c40g-ac-inlet-panel'}
    # The captive centre screw and the six edge screws that bolt the panel on.
    - {node: screw-mid, cyl: 1.6, confidence: borrowed, source: 'edgecore/agr-panel-screw@1 - its measured captive screw head'}
    - {node: corner-tl, cyl: 1.6, confidence: borrowed, source: 'edgecore/agr-panel-screw@1 - its measured captive screw head'}
    - {node: corner-tr, cyl: 1.6, confidence: borrowed, source: 'edgecore/agr-panel-screw@1 - its measured captive screw head'}
    - {node: corner-ml, cyl: 1.6, confidence: borrowed, source: 'edgecore/agr-panel-screw@1 - its measured captive screw head'}
    - {node: corner-mr, cyl: 1.6, confidence: borrowed, source: 'edgecore/agr-panel-screw@1 - its measured captive screw head'}
    - {node: corner-bl, cyl: 1.6, confidence: borrowed, source: 'edgecore/agr-panel-screw@1 - its measured captive screw head'}
    - {node: corner-br, cyl: 1.6, confidence: borrowed, source: 'edgecore/agr-panel-screw@1 - its measured captive screw head'}
    # Perforated grille above and below the inlet row - real holes, redrawn dark.
    - {node: vent-top, vent: 20.0, confidence: estimated, source: 'this contract own ESTIMATED 20.0 panel depth re-expressed. Not a second claim'}
    - {node: vent-bottom, vent: 20.0, confidence: estimated, source: 'this contract own ESTIMATED 20.0 panel depth re-expressed. Not a second claim'}
