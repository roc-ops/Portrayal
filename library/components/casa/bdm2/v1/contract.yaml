format: 1
kind: module
name: bdm2
version: 1.6.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Casa Bi-Directional Module 2 (BDM_204MHZ), the high-split 204 MHz card.
  Carries no RF connectors at all; every port lands on the paired rear 6+12
  IO2 card. Faceplate shared with the BDM and BDM2m.
size: {w: 30.47, h: 345.5, d: 380.0}
size-confidence: {d: known-wrong}
size-notes: 'd 380.0 is IMPOSSIBLE - a front and a rear card mate at a midplane inside a 386.0 chassis and two at 380.0 need 760. See provenance/depth-known-wrong'
attrs:
  model: 'BDM2'
  role: docsis-line-card
  power-draw-max-w: 300
  power-draw-scope: module-with-paired-io
  rf-ports: '0'
  ds-ports: '6'
  us-ports: '12'
  upstream: up to 204 MHz, 1 OFDMA and 6 ATDMA channels
  pairs-with: casa/io-6p12-io2
provenance:
  depth-known-wrong: 'THE 380.0 IS NOT MERELY UNMEASURED, IT IS IMPOSSIBLE, and this
    contract now says so in a field a tool can read - size-confidence: {d: known-wrong}.
    THE CONSTRAINT. Front and rear cards MEET AT A MIDPLANE, which the owner photographed:
    working/photos/casa/c40g-empty-midplane.png shows the emptied cage with the card guides
    and the midplane at the back of it, and the opening where the rear I/O card reaches
    through to the front card. So a front card and its rear partner have to share the
    chassis depth - 386.0 on the C100G, 388.45 on the C40G. Two cards at 380.0 need 760,
    which is not a wide error bar, it is twice the box.
    WHAT THE SHAPE IS, from the owner: "the front card is mostly rectangular, but the I/O
    card is kind of L SHAPED where the top part of the top connector PASSES THROUGH THE
    MIDPLANE and plugs into the front card, and the other one is plugged into the midplane.
    So they ultimately kind of meet in the middle." So the rear card is a body against the
    midplane PLUS A TONGUE at the top reaching forward through it.
    NOTE WHAT THAT DOES AND DOES NOT ALLOW, because the obvious rule is wrong. front + rear
    CAN exceed the chassis depth, by about the tongue length, because the tongue overlaps the
    front card at a height where the front card is not - they interleave rather than tile. The
    constraint is therefore an inequality with slack, not an equality. What it cannot absorb
    is a 374 mm overlap where a tongue is tens of millimetres.
    ONE PHOTOGRAPH IS USABLE AND IT IS NOT THIS CARD-FAMILY-WIDE. bdm2m-solder-side.jpeg has
    the faceplate FULLY IN FRAME, so its 345.5 long axis anchors the scale at 5.00 px/mm; the
    card measures 1336 px from the faceplate to the top of its midplane connectors. Raw that
    is 267 mm. The shot is NOT orthographic - the PCB reads 4.66 percent wider at the
    connector end than at the faceplate end, which is perspective, not a taper - so correcting
    to the mean scale gives about 261, and taking the card top at the outermost connector edge
    instead pushes it to about 282. CALL IT 270 PLUS OR MINUS 12 AND DO NOT ROUND THAT AWAY.
    REJECTED, and the rejection is the useful part: bdm2m-top-plan.jpeg and both qam-io-card
    plan shots have the faceplate CLIPPED BY THE FRAME, so the 345.5 anchor is truncated and
    every number off them is understated by an unknown amount. Measured anyway, the top-plan
    gives 227 mm for the same card the solder side gives 270 - a 19 percent disagreement that
    is entirely the broken anchor. They are not second opinions and must not be averaged in.
    NOTHING IS REPLACED. 270 plus or minus 12 is one reading of one card from one photograph
    that fails gate 1, and stamping it on twelve cards would be the family-number pattern
    doing harm instead of good - these cards share a FACEPLATE, which is established, not a
    depth, which is not. What is established is that 380.0 cannot be true.
    WANTED, in order of how much each unlocks: a tape on any one front card (fixes it
    outright); a tape on any one rear I/O card; an unclipped side-on photograph of a rear card
    showing where the tongue begins, which would give the midplane position and both halves
    at once.'
  identity: 'drawing - Table A-11 of the C100G install guide, "BDM 6+12 (BDM_204MHZ and BDM2m_204MHZ with 6+12 IO2)". BDM2 is the guide''s BDM_204MHZ. It differs from the BDM2m only in packet processor, and from the plain BDM in upstream reach and in which I/O card it takes'
  'layout': 'drawing - Figure 1-14 of the Casa C100G Hardware Installation Guide
    (rev 07/08/2022). Three LEDs in a single column with STATUS, ALARM and ACTIVE
    printed to their right, between two mirrored stripe groups. The BDM, BDM2 and
    BDM2m are one faceplate; the model band is the only visible difference, which
    is exactly why they were once one component'
  'ports': 'drawing - the BDM faceplate has NO connectors. This is not an omission;
    the architecture puts all RF on the paired rear I/O card'
  'size': 'ESTIMATED, shared with casa/io-6p12 - the six faceplates in Fig 1-14
    measure 196 x 2610 px against that card''s 197 x 2613, so the whole family shares
    one envelope. The guide figures are schematic rather than to scale, so the absolute
    numbers come from Table A-1 arithmetic. Needs a caliper'
  'leds': 'drawing-measured - Figure 1-20 of the C40G Hardware Installation Guide (rev
    07/07/2022), "BDM module, SMM Switch BDM A, B, and LC Switch BDM", which draws
    the BDM, BDM2 and BDM2m side by side. All three plates measure 113 x 1417 px
    and give IDENTICAL feature fractions, which is what confirms the three share
    one faceplate. THE FIGURE IS SCHEMATIC IN OUTLINE - its 12.54 aspect is 10
    percent off the real 30.47 / 345.5 = 11.34 - SO ONLY PROPORTIONS ARE TAKEN
    FROM IT, anchored to the 345.5 height this contract already holds. Lamp
    centres read y 804.5, 822.5 and 837.5 within a plate spanning y 70 to 1486;
    the figure''s own pitch wobbles between 18.0 and 15.0 px, which is a drawing
    slip of a pixel and a half, so the pitch is the group''s span divided evenly:
    16.5 px = 0.011644 of the height = 4.02 mm, putting the centres at 196.16,
    200.18 and 204.20. THIS REPLACES A 6.6 mm PITCH THAT WAS NEVER MEASURED - it
    was chosen so the lamps would read as separate indicators, and it pushed the
    cluster up against the upper stripe group, leaving 1.66 mm of grey above it
    and 4.44 mm below. The figure puts the cluster in clean grey between the two
    groups; at 4.02 the margins are 5.42 above and 5.84 below, against the
    figure''s own 6.10 and 5.60. THE 3.0 DIAMETER IS UNCHANGED AND IS STILL NOT
    MEASURED: the figure''s lamp is 12 px tall and 14 px wide, and because the
    plate outline is anisotropic those scale to 2.93 mm off the height and 3.78
    mm off the width. A lamp is round, so neither is the answer, and 3.0 sits
    between them, so it is carried forward unchanged and UNMEASURED. This
    contract cannot open a gap for that - gaps are device-level in the schema -
    so the uncertainty is stated here, alongside the same admission the size
    entry makes: a caliper on the hardware closes both at once'
  'led-column-x': 'NOT ACTED ON, and this is the gap. The same figure puts the
    lamp column centre at 0.25221 of the plate width and the label text starting
    at 0.4336, which anchored to 30.47 would be cx 7.68 and text x 13.21 against
    the 6.30 and 10.64 drawn here. The vertical fix above is trustworthy because
    it is anchored to the 345.5 height, which is a dimension the contract already
    holds; there is no equally trusted width, and the figure''s outline aspect is
    10 percent off, so an x-fraction off this drawing is the softer number of the
    two. Left alone deliberately rather than moved on a figure that is known to
    be wrong about the axis it would be scaled by'
  'variants': 'THREE PRODUCTS, ONE FACEPLATE, and they are now three components.
    casa/bdm@1 used to be all of them at once: it carried attrs model BDM2m while
    its own description said "BDM, BDM2 and BDM2m share it and differ only by label",
    and the plain BDM was reachable only as a skin override inside the docsis-classic
    configuration. A reader could not tell which product was in a slot, and no bay
    could offer a choice. They are split because the guides differentiate them on
    a real specification, not just a label: Table A-10 ("BDM 6+12 (BDM with 6+12
    IO)") gives upstream "Up to 85 MHz with 1 OFDMA and 6 ATDMA channels", while
    Table A-11 ("BDM 6+12 (BDM_204MHZ and BDM2m_204MHZ with 6+12 IO2)") gives "Up
    to 204 MHz" - different upstream capability AND a different paired rear I/O
    card. The BDM2/BDM2m data sheet (BDM2_BDM2m_DS_RevA, 12-2024) separates the
    last two: "BDM2m provides identical capabilities as the BDM2 card but uses a
    different packet processor", the same distinction CommScope draws between the
    SMM300G and SMM300Gm'
  'power': 'Table A-11 reads "Approximately 300W per BDM_204MHZ", under a title scoping it to the
    BDM WITH its 6+12 I/O, and the BDM2/BDM2m data sheet''s "Total Power 300 W"
    sits in a table headed "BDM2/2 m with 6+12 IO Card". So the figure is the
    pair''s, and `power-draw-scope: module-with-paired-io` says so in DATA rather
    than in this sentence. A BDM position is two modelled modules - this card in
    a front bay and casa/io-6p12 in the paired rear bay - and no document divides
    the 300 W between them, so a chassis sum must not add the rear module as
    well. Both vendor statements say "approximately"'
  faceplate-hardware-photo: 'THE OWNER SUPPLIED AN ISOMETRIC OF THE C100G FRONT and it
    corrects the SHAPE of two things on this faceplate. working/photos/casa/ -
    c100g-front-isometric.png and the crop crop-ejectors.png, read at high zoom.
    WHAT IT SETTLES:
    - The captive screw is not a flat slotted head. It is a substantial BLACK KNURLED
      KNOB standing well proud, with a dark top face and a light metallic band. `knurl`
      is added for that reason - it is a shape fact and costs no dimension. The drawn
      2D head is still a slotted circle and is NOT redrawn; the figures draw it that way
      and this photograph cannot give a true elevation of it.
    - The EJECTOR LEVER is the most prominent thing on the whole face: a large CURVED
      BLACK lever, not the rounded strip this skin draws, with a thin vertical linkage
      rod running down the card from the knob to it.
    - RELATIVE PROMINENCE, which is the one quantitative thing a perspective view CAN
      give: lever stands proud of knob stands proud of lamp. This contract already
      orders them that way - 4.2, 1.6, 0.3 - so the photograph CONFIRMS the ordering
      rather than correcting it. Only the absolute magnitudes are understated, and it
      gives no absolute magnitude.
    WHAT IT DOES NOT SETTLE, and why nothing else moved. It is a three-quarter view:
    every forward projection is foreshortened by an unknown factor, nothing of known
    size is in frame, and the one feature that looks measurable - the knob ellipse -
    needs a diameter nobody has. So it fails gate 1 outright, exactly as the Cisco
    perspective figures did. THE LEVER SILHOUETTE IS DELIBERATELY NOT REDRAWN: the true
    elevation outline of a curved lever is precisely what a three-quarter crop cannot
    give, and drawing sixteen faceplates from it would replace a sourced schematic strip
    with an invented curve. The 4.2 stays, marked `borrowed`.
    WANTED, and it closes both at once: ONE STRAIGHT-ON PHOTOGRAPH OF A SINGLE CARD,
    with a rule or any part of known size in frame. That would give the lever its
    silhouette AND its projection, and it is the cheapest open question on this family.
    THIS ENTRY IS ONE READING OF ONE PHOTOGRAPH restated across the thirteen front-slot
    cards that share this faceplate. The photograph shows DS 8X96, US 16X4 and SMM 8X10G
    specifically; the rest inherit it because the family shares a plate, which the
    DS/US positions provenance already establishes to the millimetre. It is NOT thirteen
    observations. The REAR cards - the 6+12 I/O family, rfd, rfu-16x8, ups-32x4,
    lc-sw-bdm and the two SMM Switch BDMs - are NOT in this photograph and are
    deliberately left alone.'
  relief: 'the C100G/C40G card family treatment - two captive screws (cyl 1.6), the
    ejector latch strip (out 4.2) and the 3 status lamps (dome 0.3). THE FULL ARGUMENT IS IN casa/bdm@1 AND THIS IS A
    POINTER TO IT, not a second reading: the three magnitudes are one estimate per kind of
    hardware, taken from edgecore/agr-panel-screw@1, edgecore/agr-psu-dc@1 and
    common/led-dot@1 - NONE of which measured them, which is why all three are tokened
    `estimated` rather than `borrowed` - applied across the family because these cards share a faceplate.
    No Casa document states a depth for any of them. Eleven cards carrying 4.2 is ONE
    estimate written eleven times, not eleven readings that agreed.'
