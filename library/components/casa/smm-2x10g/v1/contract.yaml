format: 1
kind: module
name: smm-2x10g
version: 1.7.1
class: supervisor
behaviour: fills
profile: networking
description: >-
  Casa standard SMM 2x10GE - the C100G/C40G Switch and Management Module in its
  original density. Eight GigE SFP (G0-G7) and two 10GigE SFP+ (XG2, XG1), a
  10/100BASE-T management RJ45 at the top and an RS-232 console RJ45 at the
  bottom, plus STATUS, ACTIVE and ALARM lamps. The cage population is the
  inverse of the high-density SMM 8x10G, on the same eleven openings.
size: {w: 30.47, h: 345.5, d: 380.0}
size-confidence: {d: known-wrong}
size-notes: 'd 380.0 is IMPOSSIBLE - a front and a rear card mate at a midplane inside a 386.0 chassis and two at 380.0 need 760. See provenance/depth-known-wrong'
attrs:
  model: 'SMM 2x10G'
  role: supervisor
  sfp-plus: '2'
  sfp: '8'
  mgmt: 10/100BASE-T
  console: RS-232
  power-draw-max-w: 110
provenance:
  depth-known-wrong: 'THE 380.0 IS NOT MERELY UNMEASURED, IT IS IMPOSSIBLE, and this
    contract now says so in a field a tool can read - size-confidence: {d: known-wrong}.
    THE CONSTRAINT. Front and rear cards MEET AT A MIDPLANE, which the owner photographed:
    A photograph of the C40G with its cards pulled shows the emptied cage with the card guides
    and the midplane at the back of it, and the opening where the rear I/O card reaches
    through to the front card. So a front card and its rear partner have to share the
    chassis depth - 386.0 on the C100G, 388.45 on the C40G. Two cards at 380.0 need 760,
    which is not a wide error bar, it is twice the box.
    WHAT THE SHAPE IS, as the maintainer reports it from the hardware: the front card is
    mostly a plain rectangle, but the I/O card is L SHAPED - the top of its upper connector
    PASSES THROUGH THE MIDPLANE and plugs into the front card, while the lower one plugs
    into the midplane itself, so the two cards end up meeting in the middle. So the rear
    card is a body against the midplane PLUS A TONGUE at the top reaching forward through
    it.
    NOTE WHAT THAT DOES AND DOES NOT ALLOW, because the obvious rule is wrong. front + rear
    CAN exceed the chassis depth, by about the tongue length, because the tongue overlaps the
    front card at a height where the front card is not - they interleave rather than tile. The
    constraint is therefore an inequality with slack, not an equality. What it cannot absorb
    is a 374 mm overlap where a tongue is tens of millimetres.
    ONE PHOTOGRAPH IS USABLE AND IT IS NOT THIS CARD-FAMILY-WIDE. bdm2m-solder-side.jpeg has
    the faceplate FULLY IN FRAME, so its 345.5 long axis anchors the scale at 5.00 px/mm; the
    card measures 1336 px from the faceplate to the top of its midplane connectors. Raw that
    is 267 mm. The shot is NOT orthographic - the PCB reads 4.66 percent wider at the
    connector end than at the faceplate end, which is perspective, not a taper - so correcting
    to the mean scale gives about 261, and taking the card top at the outermost connector edge
    instead pushes it to about 282. CALL IT 270 PLUS OR MINUS 12 AND DO NOT ROUND THAT AWAY.
    REJECTED, and the rejection is the useful part: bdm2m-top-plan.jpeg and both qam-io-card
    plan shots have the faceplate CLIPPED BY THE FRAME, so the 345.5 anchor is truncated and
    every number off them is understated by an unknown amount. Measured anyway, the top-plan
    gives 227 mm for the same card the solder side gives 270 - a 19 percent disagreement that
    is entirely the broken anchor. They are not second opinions and must not be averaged in.
    NOTHING IS REPLACED. 270 plus or minus 12 is one reading of one card from one photograph
    that fails gate 1, and stamping it on twelve cards would be the family-number pattern
    doing harm instead of good - these cards share a FACEPLATE, which is established, not a
    depth, which is not. What is established is that 380.0 cannot be true.
    WANTED, in order of how much each unlocks: a tape on any one front card (fixes it
    outright); a tape on any one rear I/O card; an unclipped side-on photograph of a rear card
    showing where the tongue begins, which would give the midplane position and both halves
    at once.'
  layout: drawing - Figure 1-7 of the Casa C100G Hardware Installation Guide (rev
    07/08/2022), 'Standard SMM 2x10GE (eight GigE, two 10GigE ports)'. The faceplate
    order top to bottom is SMM, 10/100MI, G0 through G7, XG2, XG1, IOIOI, then STATUS,
    ACTIVE, ALARM. Note XG2 sits ABOVE XG1, which is the order the figure prints
    and is not a transcription slip. There is NO data sheet for this card - the
    install guide figure and Table A-5 are the sources
  size: shared with the rest of the C100G front-card family, taken from the chassis
    slot envelope (30.47 x 345.5, C100G device manifest); the depth is the family
    estimate carried by casa/smm-8x10g
  legend: 'drawing - the model legend sits between TWO orange bands, not below one,
    which is the first thing three product photographs settle and which casa/smm-8x10g
    does not show. Position is casa/bdm''s, from Figure 1-14: 20.42 and 33.76. The
    DS8x96, CSC8x10G and SMM300G photographs put them at 21.1-22.5 and 34.1-35.4,
    consistently 1.3-1.6mm lower and in the same direction as they put the DS card''s
    stripe groups 5.6mm lower - one perspective bias across all three, not three
    findings - so the figure is carried and the whole front-card family lines up'
  positions: inherited from casa/smm-8x10g, deliberately. Figures 1-7 and 1-8 draw
    the same shell with the same eleven openings in the same places - one RJ45,
    ten cages, one RJ45 - and differ only in which cage takes which media and in
    the legends. Modelling it as the sibling's geometry with the population inverted
    is the claim the guide actually supports; re-measuring the small figure would
    have invented precision it does not carry
  ports: composed from common/sfp-plus-cage@2, as casa/smm-8x10g does, with attrs
    overridden per port so the eight GigE positions declare media sfp at 1g and
    the two 10GigE positions declare sfp-plus at 10g. The cage hardware is the same
    either way - SFP and SFP+ share the SFF-8432 aperture - so the difference between
    the two cards is the transceiver each socket accepts, not the metal
  rotation: 'every cage is ROTATED 90, as on casa/smm-8x10g and for the same reason:
    the faceplate is 30.47 wide and a 16.0-wide cage has to lie on its side'
  lamps: 'drawing - Figure 1-7 prints STATUS, ACTIVE, ALARM top to bottom, as do Figures 1-8 and
    1-9, and the CSC8x10G photograph shows the same order at a legible size. casa/smm-8x10g
    once drew the three the other way up with ALARM at the top, and this entry used to
    record that disagreement as live. IT IS NOT LIVE ANY MORE - that component was corrected
    to STATUS, ACTIVE, ALARM and its own lamps entry says so, so the two cards now agree and
    this sentence is kept only to say that they once did not. CONFIRMED INDEPENDENTLY on the
    C40G side: Figure 1-13 of the C40G guide, the standard SMM 2x10GE, prints STATUS,
    ACTIVE, ALARM top to bottom, and the lamp COLOURS say it too - the top two are drawn
    green and the third dark, where on the BDM and the DS/US cards it is the MIDDLE lamp
    that is dark. The order really is different on the SMM pair, which is worth stating
    loudly because the next reader will assume a transposition'
  legends: 'placed BESIDE each opening rather than below it, at x 21.0, which the
    SMM300G photograph shows is what the real hardware does. Below does not work
    on this shell: the cage pitch alternates 17.3 and 20.2 while a rotated cage
    is 16 tall, so on every tight pair a legend under one opening falls inside the
    next one and the cage installed there paints over it. casa/smm-8x10g places
    its twelve legends that way and loses six of them for exactly this reason'
  power-draw-max-w: install guide - Table A-5 of the C100G install guide, 'SMM power
    consumption 110W'. There is no data sheet for this card, so the install guide
    is the only source - but it IS a source, and 110 W is 50 W below the SMM 8x10G
    sibling whose 160 W it was assumed to share
  'lamp-pitch': 'drawing-measured, BY A DIFFERENT ANCHOR, and the difference matters. Figure 1-13 of the
    C40G guide, "Standard SMM 2x10GE (eight GigE, two 10GigE ports)", draws this card, but
    EVERY FIGURE OF THE SMM PAIR IN BOTH GUIDES IS CLIPPED at the plate edge - C40G Figures
    1-13 to 1-16 and C100G Figures 1-7 to 1-10 all run the plate grey to the last pixel row
    - so the drawn plate height cannot be recovered and the plate-fraction method used on
    casa/bdm and on the DS/US cards is unavailable here. THE TWO CAPTIVE SCREWS ARE THE
    ANCHOR INSTEAD: this skin places them at cy 6.00 and 339.50, 333.50 mm apart, and the
    figure draws both. They measure at rows 28.0 and 1390.0, a separation of 1362.0 px,
    giving 4.08396 px/mm and an implied plate top at row 3.50. The plate box read y 3 to
    1415 independently, so on this card the anchor recovers the drawn top edge to half a
    pixel. Lamp centres then land at 272.40, 276.05 and 279.70 for a pitch of 3.65 mm. THE
    METHOD WAS VALIDATED ON A CONTROL BEFORE BEING TRUSTED HERE: run against the un-clipped
    BDM in Figure 1-20, the screw anchor puts the plate top at row 71.62 where the plate box
    reads 70 - agreement to 1.6 px. It carries a systematic though, and it is stated rather
    than hidden: the two anchors disagree by 0.9 percent, because the drawn plate is 1417 px
    where the screws imply 1404, so a position taken this way is about 2 mm softer than one
    taken from a plate box. Both underlying numbers - the 345.5 height and the 6.00/339.50
    screw positions - are conventions rather than measurements, which is why neither anchor
    can settle the other. It replaces a 6.6 mm pitch that was never measured on this card or
    on any other: casa/bdm''s provenance said outright that 6.6 was picked so the lamps
    would "read as separate indicators", and the same three numbers had been carried onto
    every Casa front card. This entry is a separate reading of a separate plate and is not
    that number under a new name. THE 3.0 LAMP DIAMETER IS UNCHANGED AND STILL UNMEASURED,
    for the reason the BDM gave: these drawings are anisotropic, so a round lamp scales to
    two different diameters depending on the axis, which tells you the drawing is wrong
    rather than telling you the size.'
  faceplate-hardware-photo: 'THE OWNER SUPPLIED AN ISOMETRIC OF THE C100G FRONT and it
    corrects the SHAPE of two things on this faceplate. An isometric front photograph
    of the C100G and a crop of its ejectors, read at high zoom.
    WHAT IT SETTLES:
    - The captive screw is not a flat slotted head. It is a substantial BLACK KNURLED
      KNOB standing well proud, with a dark top face and a light metallic band. `knurl`
      is added for that reason - it is a shape fact and costs no dimension. The drawn
      2D head is still a slotted circle and is NOT redrawn; the figures draw it that way
      and this photograph cannot give a true elevation of it.
    - The EJECTOR LEVER is the most prominent thing on the whole face: a large CURVED
      BLACK lever, not the rounded strip this skin draws, with a thin vertical linkage
      rod running down the card from the knob to it.
    - RELATIVE PROMINENCE, which is the one quantitative thing a perspective view CAN
      give: lever stands proud of knob stands proud of lamp. This contract already
      orders them that way - 4.2, 1.6, 0.3 - so the photograph CONFIRMS the ordering
      rather than correcting it. Only the absolute magnitudes are understated, and it
      gives no absolute magnitude.
    WHAT IT DOES NOT SETTLE, and why nothing else moved. It is a three-quarter view:
    every forward projection is foreshortened by an unknown factor, nothing of known
    size is in frame, and the one feature that looks measurable - the knob ellipse -
    needs a diameter nobody has. So it fails gate 1 outright, exactly as the Cisco
    perspective figures did. THE LEVER SILHOUETTE IS DELIBERATELY NOT REDRAWN: the true
    elevation outline of a curved lever is precisely what a three-quarter crop cannot
    give, and drawing sixteen faceplates from it would replace a sourced schematic strip
    with an invented curve. The 4.2 stays, marked `borrowed`.
    WANTED, and it closes both at once: ONE STRAIGHT-ON PHOTOGRAPH OF A SINGLE CARD,
    with a rule or any part of known size in frame. That would give the lever its
    silhouette AND its projection, and it is the cheapest open question on this family.
    THIS ENTRY IS ONE READING OF ONE PHOTOGRAPH restated across the thirteen front-slot
    cards that share this faceplate. The photograph shows DS 8X96, US 16X4 and SMM 8X10G
    specifically; the rest inherit it because the family shares a plate, which the
    DS/US positions provenance already establishes to the millimetre. It is NOT thirteen
    observations. The REAR cards - the 6+12 I/O family, rfd, rfu-16x8, ups-32x4,
    lc-sw-bdm and the two SMM Switch BDMs - are NOT in this photograph and are
    deliberately left alone.'
  relief: 'the C100G/C40G card family treatment - two captive screws (cyl 1.6), the
    ejector latch strip (out 4.2) and the 3 status lamps (dome 0.3). THE FULL ARGUMENT IS IN casa/bdm@1 AND THIS IS A
    POINTER TO IT, not a second reading: the three magnitudes are one estimate per kind of
    hardware, taken from edgecore/agr-panel-screw@1, edgecore/agr-psu-dc@1 and
    common/led-dot@1 - NONE of which measured them, which is why all three are tokened
    `estimated` rather than `borrowed` - applied across the family because these cards share a faceplate.
    No Casa document states a depth for any of them. Eleven cards carrying 4.2 is ONE
    estimate written eleven times, not eleven readings that agreed.'
