format: 1
kind: module
name: io-6p12-io2
version: 1.2.0
class: line-card
profile: networking
description: >-
  Casa 6+12 IO2 module - the 204 MHz-capable rear half of a BDM2 or BDM2m
  position, carrying six downstream (D0-D5) and twelve upstream (U0-U11) MCX
  jacks. Same faceplate as the plain 6+12 IO; the difference is upstream
  spectrum, 5-204 MHz instead of 5-85 MHz, and therefore which BDM it pairs
  with.
size: {w: 30.47, h: 345.5, d: 380.0}
attrs: {model: '6+12 IO2', media: coax, connector: mcx, downstream: '6', upstream: '12', spectrum: 5-204MHz}
provenance:
  variant: 'drawing - the IO2 is a REAL, separately orderable card, not a relabelling.
    Both guides list it as an alternative wherever the plain 6+12 goes: "Slots 0
    to 4 - 6+12 IO or 6+12 IO2 module", "Slot 8 - 6+12 SW-IO or 6+12 SW-IO2" on
    the C100G, and the same pairs on the C40G. What differs is the upstream spectrum
    and therefore which BDM it pairs with: Table A-10 heads the plain card "BDM
    6+12 (BDM with 6+12 IO)" at "Up to 85 MHz", and Table A-11 heads the IO2 "BDM
    6+12 (BDM_204MHZ and BDM2m_204MHZ with 6+12 IO2)" at "Up to 204 MHz". The C40G
    data sheets ordering table names the part: "BDM6-12-IO2 - BDM2/2M IO card 204
    MHz-capable, supporting 6 DS and 12 US ports"'
  geometry: 'drawing - the faceplate is the plain cards, deliberately and on the
    vendors authority: casa/io-6p12 already recorded that "The IO2 variant is the
    same faceplate at 5-204 MHz instead of 5-85 MHz". Same eighteen MCX jacks on
    the same axes, same cable comb, same standoffs. Only the legend and the spectrum
    change. Jack positions and the composed std/mcx@1 aperture are taken from casa/io-6p12@2
    and casa/io-6p12-sw@2 rather than re-derived, so the four cards cannot drift
    apart'
  power: 'NONE STATED, same as the plain card. No table in either guide gives
    an I/O module a figure - Tables A-8 and A-9 give the RFD and RFU their connectors
    and nothing else - and the BDMs "approximately 300W" is scoped to the BDM WITH
    its I/O card, which is the front halfs figure carrying power-draw-scope: module-with-paired-io.
    Writing anything here would double count that pairing. The L27 warning is the
    record'
  layout: drawing - Figure 1-15 of the Casa C100G Hardware Installation Guide
    (rev 07/08/2022). Twelve U jacks in the left column, six D in the right,
    interleaved. Port COUNT and ARRANGEMENT are read straight off the figure
    and are reliable
  size: ESTIMATED. The guide figures are schematic, not to scale - the drawn
    chassis aspect is 0.936 against a specified 0.844, and the drawn slot
    pitches are irregular (108, 130, 78, 112 px for what should be one pitch).
    Width is arithmetic from Table A-1 instead - 19in rack, ~440mm interior,
    14 slots gives 31.43. Height is bracketed by two schematic estimates that
    disagree by 10 percent - 461mm from the front-view proportion, 417mm from
    the Fig 1-15 faceplate aspect - so 440 is the midpoint. Needs a caliper
  connector: drawing - the figure's cable note reads "Single quad-shielded
    cable with MCX male snap-on plug; 75 ohm male F-connector on opposite end",
    so the jack on this card is MCX and the F-connector is at the headend end
  bore: registry - THIS IS THE VERSION BUMP. v1 drew the eighteen MCX openings
    inline; v2 COMPOSES std/mcx@1, so the aperture is the registry's `mcx` key (4.95 x
    4.50 D-hole, Radiall R113.553.000 panel drawing) instead of the estimate this
    card used to carry. Every jack AXIS is unchanged - only the
    hole's size and shape moved, from a guessed rectangle to the sourced D-hole
    (proved by diffing the compiled drawing - 18/18 axes land within 0.005 mm,
    which is the old skin's two-decimal rounding and not a move). Note the
    composed part is placed on its AXIS, which sits 2.475 from the top of a
    4.50-high D-hole rather than at half its height.
    The two cards had disagreed with each other about the same connector (3.87 x
    3.14 here against 3.88 x 3.88 on the SW card); they now cannot
  comb: photograph - a C40G rear shot shows every I/O card fronted by a cable
    comb carried on brass standoffs. Jason measured the standoffs at about 3/8in
    (9.5mm) proud of the faceplate and the comb itself at about 1/16in (1.6mm)
    thick. The comb is notched per port and carries the U0-U11 / D0-D5 silkscreen,
    and the labels appear on BOTH the card face and the comb - the comb
    repeats them where the cable actually lands rather than replacing them
  mcx-is-recessed: 'THE OWNER, AGAINST THE HARDWARE: "the MCX connector is RECESSED
    INTO the faceplate, so it actually doesn''t stick out from the faceplate, it''s
    recessed from the faceplate ... whereas the US I/O and the DS I/Os have the F
    fitting STICKING OUT of the faceplate." So the two connector families on these
    chassis go OPPOSITE WAYS - MCX recessed, F-type proud - and that is a fact about
    the world, recorded in his terms so it does not have to be rediscovered.
    THIS SENTENCE IS COPIED FROM casa/io-6p12-sw@2, where it was written first. One
    statement from one person about one pair of connector families, restated on every
    card it applies to - not several observations that agreed.
    THE FIGURES AGREE, INDEPENDENTLY AND AFTERWARDS. Figure 1-12 (C100G), "RF IO
    upstream and downstream modules", draws the three rear I/O cards side by side and
    treats the families completely differently: every F port on QAM IO and US IO is a
    HEX NUT with concentric rings and a shadow, a connector body standing off the
    plate, while every MCX port on UPS IO 32 is a small flat dark circle with no hex
    and no body. Figures 1-15 and 1-16 draw the 6+12 cards'' MCX the same flat way.
    NOTHING IS CHANGED HERE YET, and the reason is not indecision. The aperture is
    composed from std/mcx@1, whose relief is {node: barrel, cyl: 2.0} - a PROTRUSION
    read off the Radiall R113.553.000 side elevation, which is a FRONT-MOUNT bulkhead
    jack whose flange does sit on the front of its panel. std/mcx@1 is not wrong about
    that connector; it is the wrong VARIANT for every card that composes it, and all
    five of its users are Casa. It is a std/ part and the registry note in
    spec/schemas/standards.yaml says the same thing, so the two have to move together
    and the decision is not this contract''s to take. Reported to the team lead.
    NO DEPTH IS GUESSED: the owner gave a topology, not a dimension, and no Casa
    document gives a recess depth. WANTED: how far below the faceplate the MCX
    interface sits - one caliper reading or one side-on photograph.'
  relief: 'the C100G/C40G card family treatment - two captive screws (cyl 1.6), the
    ejector latch strip (out 4.2). THE FULL ARGUMENT IS IN casa/bdm@1 AND THIS IS A
    POINTER TO IT, not a second reading: the three magnitudes are one estimate per kind of
    hardware, borrowed from edgecore/agr-panel-screw@1, edgecore/agr-psu-dc@1 and
    common/led-dot@1, applied across the family because these cards share a faceplate.
    No Casa document states a depth for any of them. Eleven cards carrying 4.2 is ONE
    estimate written eleven times, not eleven readings that agreed. The three brass comb standoffs above are a separate, PHOTO-MEASURED number and are not part of this family treatment.'
relief:
  wall: '#4a4f55'
  features:
    # Two captive slotted screws on the centreline - the guide's own
    # "integrated thumbscrews" / "captive screws".
    - {node: screw-t, cyl: 1.6}
    - {node: screw-b, cyl: 1.6}
    # The ejector latch strip.
    - {node: latch-t, out: 4.2}
    - {node: latch-b, out: 4.2}
    # Brass standoffs stand 3/8in proud of the faceplate, centred across the
    # card, and carry the comb when it is fitted
    - {node: standoff-t, out: 9.5, color: '#b08d57'}
    - {node: standoff-m, out: 9.5, color: '#b08d57'}
    - {node: standoff-b, out: 9.5, color: '#b08d57'}
