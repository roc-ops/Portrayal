    # card, and carry the comb when it is fitted
    - {node: standoff-t, out: 9.5, color: '#b08d57', confidence: photo-measured, source: 'the maintainer - 3/8in off one C40G rear photograph. All twelve are that ONE reading'}
    - {node: standoff-m, out: 9.5, color: '#b08d57', confidence: photo-measured, source: 'the maintainer - 3/8in off one C40G rear photograph. All twelve are that ONE reading'}
