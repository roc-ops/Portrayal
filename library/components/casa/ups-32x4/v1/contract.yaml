    - {node: screw-t, cyl: 1.6, confidence: estimated, source: 'edgecore/agr-panel-screw@1 - the library one figure for a captive screw head. NOT MEASURED: that part own provenance reads estimated - it stands proud but was not measured'}
    - {node: screw-b, cyl: 1.6, confidence: estimated, source: 'edgecore/agr-panel-screw@1 - the library one figure for a captive screw head. NOT MEASURED: that part own provenance reads estimated - it stands proud but was not measured'}
    # Three captive round slotted thumb screws down the port field.
    # NOT screw heads - hex STANDOFFS that carry the cable retention plate. See
    # provenance/standoffs-not-screws. The node ids still read `thumbscrew` because
    # renaming them would break every reference to a part whose position is right.
    - {node: thumbscrew-0, cyl: 9.5, color: '#b08d57', confidence: borrowed, source: 'casa/io-6p12@2 standoff - the origin IS a measurement, photo-measured: the maintainer read 3/8in proud off one C40G rear photograph. ONE reading of a DIFFERENT card, not a second reading'}
