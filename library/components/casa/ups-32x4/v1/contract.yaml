format: 1
kind: module
name: ups-32x4
version: 1.4.0
class: line-card
profile: networking
description: >-
  Casa UPS 32x4 I/O module - the high-density RFU, and the only Casa rear I/O card
  that lands its upstream RF on MCX instead of F. Thirty-two ports at four
  channels each, in two staggered columns, for a US 16x8 line card in the paired
  front slot; it is not supported behind a US 16x4. Silkscreened UPS IO 32.
size: {w: 30.47, h: 345.5, d: 380.0}
attrs: {model: 'UPS IO 32', role: upstream, media: coax, connector: mcx, rf-ports: '32', channels-per-port: '4', pairs-with: casa/us-16x8}
provenance:
  size: ESTIMATED, and shared with the whole C100G/C40G rear-slot family. Figure
    1-12 is schematic - it draws these three cards 309, 295 and 288 px wide for
    one physical card, and the guide's chassis aspect is 0.936 against a
    specified 0.844 - so nothing absolute is taken from it. The envelope is the
    rear-slot bay in the C100G device manifest, 30.47 x 345.5, and the depth is
    the family estimate carried by casa/io-6p12
  layout: drawing - Figure 1-12 of the Casa C100G Hardware Installation Guide
    (rev 07/08/2022), "RF IO upstream and downstream modules", which draws all
    three rear I/O cards side by side. Port COUNT, port ORDER and the column
    arrangement are read straight off it and are reliable; positions are taken
    as fractions of the drawn plate, measured by colour detection at 600 dpi
  furniture: drawing - the same figure. Two captive screws on the card
    centreline, the orange band(s) and the legend below them, and the latch
    strip on the RIGHT of the plate. Note that casa/io-6p12 draws its latch
    strip on the LEFT while both Figure 1-12 and Figure 1-15 put it on the
    right; these cards follow the figures
  ports: drawing - Table A-9 of the same guide, headed "RFU specifications",
    gives "32 ports x 4 channels per port using UPS 32x4 I/O module" and a
    connector row reading, for that module, "MCX (micro coaxial), 50 ohm,
    European CECC 22220". Casa naming CECC 22220 is the
    same specification the registry's `mcx` key cites, so the aperture composed
    here is the one Casa points at. Note the impedance - this card is 50-ohm MCX
    where the BDM's 6+12 I/O is 75-ohm MCX (Table A-10) - one mechanical
    interface, two impedances, which is why the panel hole is shared and the
    media attr is not
  numbering: drawing - the RIGHT column is even (0, 2 ... 30) and the LEFT column
    odd (1, 3 ... 31), with both numbers printed BELOW their row. Read at 4x
    from the 600 dpi render; at page scale the pair reads as one number
  positions: drawing - two columns at 0.183 and 0.645 of the plate width,
    sixteen rows on a uniform 17.69 mm pitch from 43.29. The drawn row spacing
    varies from 16.0 to 19.8 mm, so a uniform pitch is fitted rather than each
    gap copied. The column pair's midline sits 2.6 mm left of the plate centre,
    which is where casa/io-6p12's two columns sit too (12.42 against 12.61) -
    two cards measured off two different figures agreeing to 0.2 mm is what
    makes the offset real rather than jitter
  thumbscrews: drawing AND photograph, which disagree, and the photograph wins.
    Figure 1-12 puts three captive thumb screws on the column midline at the
    mid-point of the row pairs (0,1), (14,15) and (28,29), and draws them as
    HEXAGONS; the product photograph on the Casa US16x8 datasheet, captioned "32
    port", shows the same three at the same three places with ROUND slotted
    heads, noticeably larger than an MCX jack. They are drawn round here. The
    installation procedure names them - "attach the UPS 32x4 cable retention
    plate using the three captive thumb screws at the front of the plate". How
    far they stand proud is NOT stated and is not modelled - casa/io-6p12's
    brass standoffs were measured at 9.5 mm on a photograph, but that is a
    different card and copying the number would be inventing one
  photograph: CONFIRMED against the real card - the "32 port" photograph on the
    Casa US16x8 datasheet (2018). Sixteen rows of two, both numbers printed
    BELOW their row with the right column even and the left odd, "UPS IO 32"
    under a SINGLE orange band, and the three captive screws at the row-pair
    mid-points. The shot is taken at an angle, so it settles what is there and
    not where anything is; the one thing it settles that the figure got wrong is
    the shape of the screw heads
  rf-field: drawing - the figure outlines the port field with a light rectangle,
    which is the footprint the cable retention plate seats against. Drawn as a
    silkscreen outline, not as relief, because nothing states its depth
  power: NO FIGURE. Table A-9 gives ports and connector only. Table A-4 gives
    the row "Single DCU w/ RFU UPS 32x4 I/O" as 220 W for the US16x8 - that is the
    PAIR's figure and casa/us-16x8 already carries it with
    `power-draw-scope` of module-with-paired-io. Deriving this card's share by
    subtracting the 200 W RFU figure from the 220 W UPS 32x4 figure would be OUR
    arithmetic, not Casa's, and would also be wrong - the two numbers differ by
    the whole pairing, not by one card. L27 stands
  mcx-is-recessed: 'THE OWNER, AGAINST THE HARDWARE: "the MCX connector is RECESSED
    INTO the faceplate, so it actually doesn''t stick out from the faceplate, it''s
    recessed from the faceplate ... whereas the US I/O and the DS I/Os have the F
    fitting STICKING OUT of the faceplate." So the two connector families on these
    chassis go OPPOSITE WAYS - MCX recessed, F-type proud - and that is a fact about
    the world, recorded in his terms so it does not have to be rediscovered.
    THIS SENTENCE IS COPIED FROM casa/io-6p12-sw@2, where it was written first. One
    statement from one person about one pair of connector families, restated on every
    card it applies to - not several observations that agreed.
    THE FIGURES AGREE, INDEPENDENTLY AND AFTERWARDS. Figure 1-12 (C100G), "RF IO
    upstream and downstream modules", draws the three rear I/O cards side by side and
    treats the families completely differently: every F port on QAM IO and US IO is a
    HEX NUT with concentric rings and a shadow, a connector body standing off the
    plate, while every MCX port on UPS IO 32 is a small flat dark circle with no hex
    and no body. Figures 1-15 and 1-16 draw the 6+12 cards'' MCX the same flat way.
    NOTHING IS CHANGED HERE YET, and the reason is not indecision. The aperture is
    composed from std/mcx@1, whose relief is {node: barrel, cyl: 2.0} - a PROTRUSION
    read off the Radiall R113.553.000 side elevation, which is a FRONT-MOUNT bulkhead
    jack whose flange does sit on the front of its panel. std/mcx@1 is not wrong about
    that connector; it is the wrong VARIANT for every card that composes it, and all
    five of its users are Casa. It is a std/ part and the registry note in
    spec/schemas/standards.yaml says the same thing, so the two have to move together
    and the decision is not this contract''s to take. Reported to the team lead.
    NO DEPTH IS GUESSED: the owner gave a topology, not a dimension, and no Casa
    document gives a recess depth. WANTED: how far below the faceplate the MCX
    interface sits - one caliper reading or one side-on photograph.'
  standoffs-not-screws: 'THE RECORDED DRAWING-VERSUS-PHOTOGRAPH DISAGREEMENT ABOVE IS
    NOT A DISAGREEMENT. The `thumbscrews` entry has Figure 1-12 drawing three HEXAGONS
    and the US16x8 datasheet photograph showing three ROUND SLOTTED HEADS at the same
    three places, and resolves it by letting the photograph win. Figure 2-15 shows both
    at once and they are TWO DIFFERENT OBJECTS.
    That figure draws three things stacked and labels them: the "UPS 16x8 line card",
    the "UPS 32x4 I/O cable retention plate" and the "UPS 32x4 I/O module". The MODULE
    carries three HEX heads inside the outlined port field. The RETENTION PLATE, drawn
    separately above it, carries three ROUND SLOTTED SCREW HEADS at matching heights.
    So the hexagons are threaded STANDOFFS on the card and the round heads are the
    screws that fasten the plate to them - and the datasheet photograph was taken WITH
    THE PLATE FITTED, which is why it shows round heads where the figure shows hex.
    Both sources were right about different objects. This is the trap the modelling
    notes name in as many words: before recording a source disagreement, check that
    both sources are talking about the same thing.
    WHAT CHANGES: the three nodes are standoffs, so cyl 1.6 - a panel screw HEAD
    height - was the wrong kind of number for them, not merely the wrong value. They
    now carry 9.5.
    WHERE THE 9.5 COMES FROM, AND WHAT IT IS NOT: it is the 3/8in Jason read off the
    C40G rear photograph for the 6+12 I/O cards standoffs, recorded in casa/io-6p12@2.
    It is adopted here because Figure 2-15 shows the same kind of hex standoff carrying
    the same kind of retention plate on this card. THAT IS ONE READING APPLIED TO A
    SECOND PART, NOT A SECOND READING - the two cards agreeing about it would be an
    echo, and if their standoffs differ this is the first assumption to break. No
    figure or table gives this card its own standoff height. WANTED: a caliper, or a
    side-on photograph of a UPS 32x4 with the plate off.'
  missing-component: 'THE CABLE RETENTION PLATE IS A REAL PART AND THIS LIBRARY DOES
    NOT HAVE ONE. Figure 2-15 names it - "UPS 32x4 I/O cable retention plate" - and
    draws it as its own object: a notched strip with the port numbers printed between
    the notches and three screws through it. Figures 1-15 and 1-16 of the C100G guide
    draw the equivalent beside the 6+12 and 6+12 SW I/O cards, captioned "w/ cable
    retention bracket". The three standoffs on this card exist for no other purpose
    than to carry it.
    So this is a MISSING COMPONENT, not a missing decision: casa/ has no
    cable-retention-plate and none of the four I/O card families can seat one. It is
    recorded rather than built because building it is a modelling job with its own
    sourcing, not part of a relief pass. Note it is NOT casa/cable-manager, which is a
    different part on the chassis front.
    `rf-field` stays a silkscreen outline and is now CONFIRMED as one: Figure 2-15
    makes it unambiguous that the rectangle is where that plate seats.'
  relief: 'the C100G/C40G card family treatment - two captive screws (cyl 1.6), the
    ejector latch strip (out 4.2). THE FULL ARGUMENT IS IN casa/bdm@1 AND THIS IS A
    POINTER TO IT, not a second reading: the magnitudes are one estimate per kind of
    hardware, borrowed from edgecore/agr-panel-screw@1 for a screw head and edgecore/agr-psu-dc@1 for the ejector latch, applied across the family because these cards share a faceplate.
    No Casa document states a depth for any of them. Eleven cards carrying 4.2 is ONE
    estimate written eleven times, not eleven readings that agreed. NOTE this card has
    NO LAMPS, so the family''s dome figure is deliberately not cited here - citing a
    source for a number a file does not carry is how an inert wrong claim gets started. The three round thumb screws take the same cyl 1.6; `rf-field` is still NOT relief, for the reason its own entry gives.'
relief:
  wall: '#4a4f55'
  features:
    # Two captive slotted screws on the centreline - the guide's own
    # "integrated thumbscrews" / "captive screws".
    - {node: screw-t, cyl: 1.6}
    - {node: screw-b, cyl: 1.6}
    # Three captive round slotted thumb screws down the port field.
    # NOT screw heads - hex STANDOFFS that carry the cable retention plate. See
    # provenance/standoffs-not-screws. The node ids still read `thumbscrew` because
    # renaming them would break every reference to a part whose position is right.
    - {node: thumbscrew-0, cyl: 9.5, color: '#b08d57'}
    - {node: thumbscrew-1, cyl: 9.5, color: '#b08d57'}
    - {node: thumbscrew-2, cyl: 9.5, color: '#b08d57'}
    # The ejector latch strip.
    - {node: latch-t, out: 4.2}
    - {node: latch-b, out: 4.2}
