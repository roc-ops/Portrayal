    - {node: thumbscrew-2, cyl: 9.5, color: '#b08d57', confidence: borrowed, source: 'casa/io-6p12@2 standoff - the origin IS a measurement, photo-measured: the maintainer read 3/8in proud off one C40G rear photograph. ONE reading of a DIFFERENT card, not a second reading'}
