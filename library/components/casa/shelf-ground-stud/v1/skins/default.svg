  <polygon id="nut" points="9.3,5.4 7.35,8.78 3.45,8.78 1.5,5.4 3.45,2.02 7.35,2.02" fill="#ffffff" stroke="#231f20" stroke-width="0.45"/>
  <circle id="stud-top" cx="5.4" cy="5.4" r="1.55" fill="#c9cbcd" stroke="#231f20" stroke-width="0.3"/>
