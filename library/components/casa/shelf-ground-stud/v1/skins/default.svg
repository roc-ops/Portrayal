<svg xmlns="http://www.w3.org/2000/svg" width="10.8mm" height="10.8mm" viewBox="0 0 10.8 10.8">
  <!-- One stud of a Casa shelf ground terminal, seen end on, as
       casa/c40g-ground-studs@1 drew each of its three: a star washer, the hex
