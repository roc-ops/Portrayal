format: 1
kind: module
name: c40g-psu-ac
version: 1.4.0
class: psu
profile: networking
description: >-
  Casa C40G AC power supply unit, 1100 W. Four sit in a row across the bottom
  front of the chassis behind the snap-on cover, numbered PSU1 to PSU4 from
  right to left. The front face carries two fans, a folding pull handle and a
  status LED; the ON/OFF switch and the AC inlet are on the module's other end,
  at the rear of the chassis.
size: {w: 81.0, h: 38.2, d: 300.0}
attrs:
  model: 'C40G AC PSU'
  role: ac-power-supply
  power-output-w: 1100
  input: 115VAC or 240VAC auto-adjusting
  redundancy: 'up to four, concurrent; the C40G-20 needs at least two'
provenance:
  what-it-is: '"The C40G supports up to four removable 1100W AC power supply units
    (PSUs). The PSUs operate concurrently in the chassis. In the event of a PSU
    failure, the remaining PSUs (up to two) provide the required power to maintain
    system operation." The warning beside it is worth keeping: "The C40G-20 cannot
    be sufficiently powered with less than two PSUs"'
  power-output-w: '1100 W, and it is an OUTPUT because this module PROVIDES power.
    A psu states power-output-w and never a draw key - they are opposite signs of
    one unit and summing across both is the category error the vocabulary exists
    to prevent. The figure is the vendors nameplate rating, stated in the running
    text'
  faceplate: 'drawing - Figure 1-10, "C40G AC power supply units", shows the four
    in place with the cover removed and enlarges one of them. Each face carries two
    fans, a folding pull handle across the LEFT fan, a status LED and a locking
    thumb screw on the right edge; the guide labels three of those in as many words
    ("Folding pull handle", "Locking thumb screw", "Status LED - ON / FAIL").
    ARRANGEMENT CORRECTED against that enlargement. The skin had the two fans at
    0.296 and 0.642 of the module width and the LED at 0.833 - out beyond the right
    fan, where the figure draws nothing. Measured on the enlarged face, whose box
    reads 374 x 157 px: the fans centre on 0.2674 and 0.7206 and the LED sits in the
    GAP BETWEEN THEM at 0.4987 across and 0.5833 down. Anchored to the 81.0 x 38.2
    this contract holds, that is fan centres 21.66 and 58.37 and a lamp at 40.39,
    22.28. The handle is translated with the left fan rather than re-drawn, the same
    treatment casa/c40g-pem gave its face, because it was never dimensioned on its
    own. X-fractions are safe to take from this figure even though it fails the
    orthographic gate, because the size entry below already anchors this part to a
    width measured elsewhere; a horizontal-centre reading of 0.4987 is in any case
    the one fraction an anisotropic drawing cannot get wrong.
    THE LAMP DIAMETER IS UNCHANGED AT 2.6 AND IS NOT MEASURED. The figure''s lamp
    is 15 px across and 17 px down, which scale to 3.25 mm off the width and 4.16
    off the height. A lamp is round, so the spread is the drawing being 12 percent
    out in aspect - 2.382 against this part''s 2.121 - and not a diameter. Wanted:
    a caliper.
    NOT DRAWN, and named so it is not mistaken for absent: the figure gives each fan
    four corner screws, eight on the face. They are fasteners with no state and no
    stated position beyond that figure, so they are left out rather than placed from
    a drawing that cannot hold a dimension'
  the-other-end: 'drawing - Figure 1-11, "C40G PSU On/Off switch and AC power
    receptacle", shows a rocker switch and an IEC appliance inlet per PSU, with
    vent mesh above and below. That figure numbers PSU1 to PSU4 LEFT to right while
    Figure 1-10 numbers them right to left, and the two are consistent rather than
    in conflict: walking round the chassis flips left and right, so Figure 1-11
    is the REAR face of the same four modules. The text settles which way round
    is which - "PSUs are labeled on the front of the chassis as PSU1, PSU2, PSU3
    and PSU4 from right to left". Only the front face is drawn here; the rear face
    is not modelled, because these bays live on the front view'
  relief: 'the kinds are the guide''s own words; the depths are estimated.
    Figure 1-10 LABELS three things on this face - "Folding pull handle", "Locking
    thumb screw", "Status LED" - so which node is what is not a reading at all, it is
    a caption. What none of it gives is a Z dimension, and neither does Table A-1, the
    running text, or Figure 1-11 of the other end. Searched both C40G guides for "power
    supply", "PSU", "handle", "thumb".
    - handle: modelled FOLDED, because that is how Figure 1-10 draws it, lying across
      the left fan rather than swung out. bar 1.5 is the drawn stroke width - the wire
      diameter of the bail - so it is a number off the drawing rather than a guess.
      `uhandle` was the obvious primitive and is WRONG here: it takes its tube diameter
      from the node''s SHORT axis, which on this path is the 12.2 mm bracket width, not
      the 1.5 mm wire, so it would have produced a 12 mm pipe. Recorded because the next
      person will reach for uhandle too.
    - thumbscrew: cyl 5.0 with knurl, which is common/fan-module@1''s locking screw
      exactly - same part doing the same job, and the guide calls both a thumb screw.
    - status: dome 0.3, common/led-dot@1''s lamp. Note the lamp DIAMETER stays 2.6 and
      stays unmeasured, for the reason the faceplate entry above gives; this pass adds
      Z only.
    THE FAN REFUSAL IS LIFTED AND THE ART IS REDRAWN. The first pass declined `vent`
    on fan-left/fan-right because this skin drew each fan as a LIGHT disc with dark guard
    wires over it - the inverse of what `vent` needs, which punches a node''s DARK cells -
    so declaring it would have asserted that the surround was the hole. It recorded that
    the fix was "redrawing the fan as a dark aperture behind a light guard, which is an
    artwork change with no source behind it". THE OWNER''S PHOTOGRAPH IS THAT SOURCE:
    working/photos/casa/c40g-front.png, the chassis with the PSU cover off, shows each of
    the four PSUs with TWO circular openings that are genuinely dark and see-through, with
    the fan blades visible behind, and a light WIRE FINGER GUARD over each - concentric
    rings crossed by radial spokes. The art now draws that, and the vent is honest.
    IT ALSO CONFIRMS THE FOLDED HANDLE. The bail is a bright metal tube lying flat across
    the LEFT fan, exactly where Figure 1-10 draws it and where this contract put it. The
    tube is visibly more substantial than the 1.5 the drawn stroke width gave, but the
    photograph supplies no dimension and the number is unchanged.
    THE PHOTOGRAPH FAILS GATE 1 AND WAS TESTED RATHER THAN ASSUMED. Its metal extent
    measures 1149 x 591 px for an aspect of 1.944 against the real rack face at 1.813 -
    7.2 percent out - so no absolute geometry comes off it and no fraction either. Shape,
    count and arrangement only, which is all that was needed. The four corner screws per fan
    that Figure 1-10 shows are still not drawn, for the reason already recorded above.'
  body: 'the 300.0 is the size entry''s own ESTIMATED depth restated as a body, not a
    second claim. Unlike the PEMs and the fans this one WILL eject: it is class psu,
    which is in the viewer''s FRU class list'
  size: 'drawing, as FRACTIONS - Figure 1-10 FAILS the orthographic gate at an
    aspect of 1.918 against the real 1.813, nearly 6 percent out, where Figure 1-1
    passes at 1.795. So only proportions are taken from it and they are anchored
    to the band Figure 1-1 does carry: the PSU row occupies the snap-on covers footprint,
    y 226.7 to 264.9 and x 44.0 to 386.6, and the four read as about 81.0 wide on
    an 87.2 pitch within it. The depth is ESTIMATED'
relief:
  wall: '#4a4f55'
  features:
    # The three things the guide NAMES on this face, in its own words: "Folding
    # pull handle", "Locking thumb screw", "Status LED - ON / FAIL".
    #
    # The handle is FOLDED in Figure 1-10 - lying flat across the left fan - so it
    # is modelled lying on the face. bar 1.5 is the drawn stroke width, i.e. the
    # wire diameter, which is a quantity the drawing actually carries.
    - {node: handle, bar: 1.5, confidence: drawing, source: 'the handle path own drawn stroke width - the bail wire diameter. Also a FLOOR'}
    - {node: thumbscrew, cyl: 5.0, knurl: true, confidence: estimated, source: 'common/fan-module@1 knurled locking screw - NOT MEASURED: that part provenance covers size and elements only and says nothing about screw height'}
    - {node: status, dome: 0.3, confidence: estimated, source: 'common/led-dot@1 - the library one figure for a panel lamp. NOT MEASURED: that part carries no depth or relief provenance, only size: estimated'}
    # The two fan openings are REAL HOLES with a wire finger guard over each. The
    # art was drawn light-on-grey, the inverse of what `vent` needs, and the first
    # pass refused the feature rather than assert the surround was the hole. The
    # owner's C40G front photograph settled it and the art is redrawn dark-on-light.
    - {node: fan-left, vent: 25.0, confidence: estimated, source: 'common/fan-module@1 grille - NOT MEASURED: neither that part nor edgecore/agr-fan@1 which draws 26 gives a grille depth; both carry only a module depth'}
    - {node: fan-right, vent: 25.0, confidence: estimated, source: 'common/fan-module@1 grille - NOT MEASURED: neither that part nor edgecore/agr-fan@1 which draws 26 gives a grille depth; both carry only a module depth'}
body:
  depth: 300.0
  color: '#e9eaec'
skins: [default]
