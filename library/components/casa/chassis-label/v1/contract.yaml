format: 1
kind: component
name: chassis-label
version: 1.3.0
class: sticker
behaviour: mounts
profile: networking
description: >-
  Casa C100G/C40G chassis identity and compliance label, affixed to the top
  front of the chassis. Placeholder art - the blocks stand for the printed
  fields and no real model or serial is reproduced.
size: {w: 120.0, h: 57.0}
attrs:
  model: 'Chassis Label'
provenance:
  content: 'drawing - Figure 1-3 of the C100G Hardware Installation Guide, "Casa
    C100G chassis label", and the bulleted list beside it. The label carries the
    Casa triangle logo and wordmark, Model # and Serial # fields, the FCC part 15
    statement and FCC mark, the electrical rating, the CE mark, a TUV / C-NRTL-US
    mark citing UL/CSA/IEC 60950, and a "Do not open risk of electric shock"
    warning'
  location: 'drawing - "The C100G product label is affixed to the top front side
    of the chassis", which is why it is placed on the top view near the front
    edge rather than on the bottom cover where a 1RU switch would carry it'
  size: 'ESTIMATED, and this is the weak figure. Figure 1-3 reproduces the label
    alone with nothing of known size beside it, so only its ASPECT can be read -
    about 2.1 to 1, which 120 x 57 preserves. No guide states the label''s
    dimensions and no photograph of the chassis top exists here. A tape measure
    on a real unit closes this in one minute'
  relief: 'out 0.2 on the label, which is the thickness of an adhesive label and is
    edgecore''s figure for the same thing - agr-label-spec@1, agr-label-serial@1 and
    agr-label-caution@1 all carry 0.2. It is ESTIMATED and no Casa document states it;
    the point of declaring it at all is that a label is a thing stuck ON the metal, so
    at zero it is indistinguishable from print. The placeholder blocks inside it are
    NOT given relief - they stand for printed fields, and print has no height.
    Note this part has no `size.d` and must not acquire one: depth on a kind: component
    compiles to a cavity, so a 0.2 there would make the label a pit rather than a
    sticker.'
  artwork: 'placeholder blocks, deliberately. The vendor''s own figure prints
    Serial # 00, but transcribing any real identifier into artwork is a rule this
    library keeps regardless. The rectangle is a stand-in for the printed fields'
relief:
  wall: '#8a8d90'
  features:
    - {node: label, out: 0.2, confidence: estimated, source: 'edgecore/agr-label-spec@1 - the library one figure for an adhesive label. NOT MEASURED: that part has photo-measured SIZE provenance and no depth provenance at all'}
skins: [default]
