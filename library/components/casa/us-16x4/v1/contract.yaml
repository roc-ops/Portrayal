format: 1
kind: module
name: us-16x4
version: 1.0.0
class: line-card
profile: networking
description: >-
  Casa US 16X4 upstream line card for the C100G/C40G CCAP chassis.
  DOCSIS Control & Upstream module (DCU). Sixteen upstream burst receivers, but the RF connectors are on the paired rear RF Upstream I/O (RFU) module - this faceplate carries no connectors at all, only the STATUS, ALARM and ACTIVE lamps.
size: {w: 30.47, h: 345.5, d: 380.0}
attrs:
  model: 'US 16X4'
  role: upstream
  rf-ports: '16'
  power-draw-max-w: 150
provenance:
  layout: drawing - Figure 1-11 of the Casa C100G Hardware Installation Guide (rev
    07/08/2022) draws US 16X4, US 16X8, DS 8X8, DS 8X96 and DS 8X192 side by side
    on ONE shell. It is authoritative for WHAT is on the face - which is nothing
    but three lamps, because the RF connectors live on the rear I/O module - and
    for the lamp ORDER, which is STATUS, ALARM, ACTIVE and is NOT the STATUS, ACTIVE,
    ALARM order the SMM and CSC faceplates use
  size: shared with the rest of the C100G front-card family, taken from the chassis
    slot envelope (30.47 x 345.5, C100G device manifest); the depth is the family
    estimate carried by casa/smm-8x10g
  positions: 'photo-measured - taken as FRACTIONS of the known 345.5 card height
    from the DS8x96 data sheet product photograph. Figure 1-11 fails the orthographic
    gate: its plate renders 147 x 1951 px, aspect 0.0753 against the real 0.0882,
    so it is drawn about 15 percent narrow, and its five cards are drawn small enough
    that the lamp dots are squeezed onto a 3.6 pitch. Scaled by the full card height
    the photograph puts them on 8.14, and the DS8x96 and SMM300G photographs independently
    agree with each other on the two legend bands to within 0.5mm. So the photograph
    is used for placement and the figure for arrangement'
  cutouts: NONE - this card has no aperture of any kind, which is the whole point
    of the split. The eight QAM or sixteen burst-receiver ports belong to the rear
    RFD/RFU I/O module, and Tables A-8 and A-9 of the install guide give those their
    F-type and MCX connectors
  power-draw-max-w: 'install guide - Table A-4 of the C100G install guide: ''Power
    consumption: Single DCU w/ RFU I/O - US16x4: 150W''. This card is end-of-life
    and has no findable data sheet, so the install guide is the only source - but
    it IS a source. The figure is transcribed, not estimated, and it is 50 W below
    the US16x8 sibling it was assumed to match'
elements:
  status: {at: [4.8, 197.7], size: [3.0, 3.0], class: led}
  alarm: {at: [4.8, 205.8], size: [3.0, 3.0], class: led}
  active: {at: [4.8, 214.0], size: [3.0, 3.0], class: led}
relief:
  wall: '#4a4f55'
