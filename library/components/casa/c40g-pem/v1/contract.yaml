format: 1
kind: module
name: c40g-pem
version: 1.4.1
class: power
behaviour: fills
profile: networking
description: >-
  Casa C40G DC power entry module. Two sit side by side across the bottom of the
  rear face, each taking -40.5 to -60 VDC from a separate 20 A source and
  providing EMI filtering and redundant DC power to the chassis. The face
  carries a bolted terminal cover, four studs in a minus pair and a plus pair,
  two release levers and a disconnect-power warning.
size: {w: 158.0, h: 68.5, d: 200.0}
attrs:
  model: 'C40G PEM'
  power-output-w: 1920
  power-output-scope: pass-through-ceiling
  feeds: '2'
  role: dc-power-entry
  input-voltage: '-40.5 to -60 VDC (-48 VDC nominal)'
  current-per-feed: '20 A nominal'
provenance:
  what-it-is: 'drawing - the C40G ships with two DC power entry modules (PEMs), each fed
    from its own 20A supply at -40.5 to -60 VDC (-48VDC nominal); between them they give
    the chassis EMI filtering and redundant DC power (Figure 1-12). It is a bay rather
    than a placement because the guide has both "Removing the DC power entry modules"
    and "Replacing the PEMs" procedures and it slides into an opening'
  size: 'drawing-measured off Figure 1-4, "C40G CMTS rear view (DC; non-redundant)",
    scaled by the known 265.9 chassis height at 2.982 px/mm. The two PEM faces read
    x 44.8 to 195.7 and 212.8 to 377.7, so about 151 and 165 wide - the spread is
    edge noise on a figure at this scale - and 158.0 is carried for both. THE BAND WAS
    READ AS y 194 TO 264.5, SO 70.5 TALL, AND THAT TOP EDGE IS AN OVERREAD. 194 is
    impossible: the card slot immediately above ends at 194.82 in the same view, and
    two pieces of sheet metal cannot share 0.82 mm. The C40G''s bays already said
    196.0, leaving a 1.18 mm margin below the card cage, and the FRONT face shows a
    measured 1.48 mm margin in exactly that position between the card band and the
    brand band. So the height is 68.5 - the opening this module goes into - and the
    2 mm was six pixels at 2.982 px/mm.
    FOUND BY asr9k-cards'' BAY-VERSUS-OCCUPANT FIT CHECK, which is the only thing
    that could have: L13 fires on overlap, so a module too BIG for its bay is
    invisible to it. The bottom edge at 264.5 was agreed by every source throughout
    and is unchanged. The depth is ESTIMATED'
  not-the-c100g-pem: 'CHECKED, and they do not match. casa/pem, the C100G part,
    is 207.0 x 91.6 for an aspect of 2.26; this face measures 158 x 70.5 for an
    aspect of 2.24. The aspects are nearly identical but the SIZE is not - the C40G
    part is a quarter narrower - so they are modelled separately rather than shared
    on the strength of a name and a silhouette. If a drawing later shows one part
    in both chassis, this is the assumption to break'
  power: >-
    THIS IS A POWER ENTRY MODULE AND THE CONDUIT ARGUMENT DOES NOT FIT IT. That
    argument - a tray carries what the modules seated in it produce, so watts are
    the wrong unit - was written for the Cisco power trays and is right about them:
    `a9k-power-tray` and `a9k-dc-pem-v3` both declare `module-bays: 4`, and those
    four supplies each state their own output. NOTHING SEATS IN A CASA PEM. It has
    no module bays, it holds no supplies, and on a DC chassis it is the only path
    power takes into the box - so there is no other part to carry the figure, and
    "the supplies that seat in it state their own output" is simply false here.
    DERIVED, AND THE ARITHMETIC IS THE WHOLE OF IT: two feeds x 20 A x 48 V = 1920 W. Both inputs are the
    vendor's - "Each power source provides two separate feeds to each power entry module (each PEM has total of four terminals, two for -48VDC...)", C40G HIG 7-13, with the 20 A from that guide's own rack-protection requirement - and -48 VDC is the stated nominal. Casa publishes no
    watt rating for the PEM itself, in either hardware guide or either data sheet.
    IT IS A CEILING, NOT A RATING, which is what `power-output-scope:
    pass-through-ceiling` says. Fuses and breakers are sized above continuous load,
    so a real plant delivers less; the number bounds what the metal may pass rather
    than promising what it will. It is recorded because a DC chassis has nowhere
    else to state its input capacity, and a consumer asking "how much can this
    take" would otherwise get silence.
    IT CROSS-CHECKS: the C40G guide asks for a supply "rated to provide -48VDC at
    a minimum 1800W", and one PEM covers that alone - which is what the two of
    them being redundant means.
  relief: 'estimated, and the two halves of that word are different claims.
    WHAT stands proud is drawing - Figure 1-12, "C40G power entry module": a bolted
    terminal cover plate at the top left with a captive screw at its centre and two
    bolt sockets; below it a minus pair and a plus pair of studs, each carrying a hex
    nut over a star washer; two release levers to the right of them; and the yellow
    DISCONNECT POWER warning label. Those five kinds of thing, and which node each is,
    are read straight off that figure.
    HOW FAR each stands proud is stated NOWHERE. Searched both C40G guides for
    "power entry", "PEM", "terminal", "stud" and Appendix A; there is no Z dimension
    for this module in any of them, and Figure 1-12 is a flat elevation, so it cannot
    supply one either. Every mm below is ESTIMATED against the library''s existing
    treatment of the same class of part, named so the next reader can overturn it in
    one place: 1.5 for the bolted cover plate is edgecore/agr-ground-plate@1; 1.6 for
    a panel screw head is edgecore/agr-panel-screw@1; 2.2 for a terminal nut is
    edgecore/agr-psu-dc@1, which did NOT measure it - its own measured figure is the module depth; 4.2 for a release lever is
    the same part''s latch; 0.2 for a printed label is edgecore/agr-label-caution@1.
    NOT DONE ON PURPOSE: the two white-outlined terminal boxes are NOT raised. The
    figure draws them as outlines on the same grey as the plate, which is as
    consistent with printed boundaries as with a moulded body, and raising them would
    turn an ambiguity into an assertion. Note this is the opposite call from casa/pem,
    where the C100G blocks are drawn as filled black bodies - the two parts are
    treated differently because the two figures show different things, not by oversight.
    WHAT WOULD SETTLE IT: one oblique photograph of a C40G rear, or a caliper.
    THE FACE IS UNTOUCHED. 158.0 x 68.5 and every x/y in the skin are exactly as the
    size provenance above left them; this pass adds Z and nothing else'
  body: 'the box behind the face is the size entry''s own ESTIMATED 200.0 depth
    restated as a body, not a second claim about the world. It is declared so the
    module draws as a solid filling its bay rather than as art painted on the rear
    plate. As with casa/pem, the 3D viewer additionally builds FRU groups only for
    data-class psu, fan and tab (library/demo2/relief.js), so a class power module
    will not eject until that list admits it - reported, not worked around'
relief:
  wall: '#4a4f55'
  features:
    # WHAT is raised comes from Figure 1-12; HOW FAR does not - see provenance/relief.
    # The bolted terminal cover is a plate on the outside of the face, so it takes
    # the same treatment (and the same 1.5) as edgecore/agr-ground-plate@1.
    - {node: terminal-cover, out: 1.5, confidence: estimated, source: 'edgecore/agr-ground-plate@1 - the library one figure for a bolted plate. NOT MEASURED: that part own provenance reads estimated - the plate stands slightly proud; not measured'}
    - {node: cover-screw, cyl: 1.6, lift: 1.5, confidence: estimated, source: 'edgecore/agr-panel-screw@1 - the library one figure for a captive screw head. NOT MEASURED: that part own provenance reads estimated - it stands proud but was not measured'}
    # Four studs, a minus pair above a plus pair, each carrying a hex nut over a
    # star washer. Own node each, so `cyl` takes ITS radius.
    - {node: nut-neg-l, cyl: 2.2, confidence: estimated, source: 'edgecore/agr-psu-dc@1 terminal nut - NOT MEASURED. The owner measured that part walls at 12.7 and its bolts at 6.35; the nut subdivides the 6.35 and was not itself measured'}
    - {node: nut-neg-r, cyl: 2.2, confidence: estimated, source: 'edgecore/agr-psu-dc@1 terminal nut - NOT MEASURED. The owner measured that part walls at 12.7 and its bolts at 6.35; the nut subdivides the 6.35 and was not itself measured'}
    - {node: nut-pos-l, cyl: 2.2, confidence: estimated, source: 'edgecore/agr-psu-dc@1 terminal nut - NOT MEASURED. The owner measured that part walls at 12.7 and its bolts at 6.35; the nut subdivides the 6.35 and was not itself measured'}
    - {node: nut-pos-r, cyl: 2.2, confidence: estimated, source: 'edgecore/agr-psu-dc@1 terminal nut - NOT MEASURED. The owner measured that part walls at 12.7 and its bolts at 6.35; the nut subdivides the 6.35 and was not itself measured'}
    # The two release levers stand off the face far enough to get a hand behind.
    - {node: lever-a, out: 4.2, confidence: estimated, source: 'edgecore/agr-psu-dc@1 latch - the library one figure for an ejector latch. NOT MEASURED: that part measured 360.7 is the MODULE depth; the latch height is sourced nowhere'}
    - {node: lever-b, out: 4.2, confidence: estimated, source: 'edgecore/agr-psu-dc@1 latch - the library one figure for an ejector latch. NOT MEASURED: that part measured 360.7 is the MODULE depth; the latch height is sourced nowhere'}
    # DISCONNECT POWER PRIOR TO SERVICE - a printed label, not sheet metal.
    - {node: warning, out: 0.2, confidence: estimated, source: 'edgecore/agr-label-spec@1 - the library one figure for an adhesive label. NOT MEASURED: that part has photo-measured SIZE provenance and no depth provenance at all'}
body:
  depth: 200.0
  color: '#9b9da0'
skins: [default]
