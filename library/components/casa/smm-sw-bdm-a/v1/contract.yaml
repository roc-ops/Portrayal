format: 1
kind: module
name: smm-sw-bdm-a
version: 1.1.0
class: switch
profile: networking
description: >-
  Casa SMM Switch BDM A. Carries a Power Supply Monitor window and prints its
  own slot on the faceplate. NOT interchangeable with the B card - A is C100G
  rear slot 6 and C40G rear slot 2.
attrs: {model: 'SMM-SW-BDM A'}
size: {w: 30.47, h: 345.5, d: 380.0}
provenance:
  psu-monitor: Jason - the Power Supply Monitor is an RJ45 port, which the
    figure draws only as a dark rectangle
  layout: drawing - Figure 1-14. Power Supply Monitor, and the faceplate
    itself prints "C100G Slot 6 / C40G Slot 2"
  slot: datasheet - "SMM-SW-BDM-A (slot 6)". The guide adds that correct slot
    positions are indicated on the module face plates, so this is not advisory
  relief: 'the C100G/C40G card family treatment - two captive screws (cyl 1.6), the
    ejector latch strip (out 4.2). THE FULL ARGUMENT IS IN casa/bdm@1 AND THIS IS A
    POINTER TO IT, not a second reading: the three magnitudes are one estimate per kind of
    hardware, borrowed from edgecore/agr-panel-screw@1, edgecore/agr-psu-dc@1 and
    common/led-dot@1, applied across the family because these cards share a faceplate.
    No Casa document states a depth for any of them. Eleven cards carrying 4.2 is ONE
    estimate written eleven times, not eleven readings that agreed.'
relief:
  wall: '#4a4f55'
  features:
    # Two captive slotted screws on the centreline - the guide's own
    # "integrated thumbscrews" / "captive screws".
    - {node: screw-t, cyl: 1.6}
    - {node: screw-b, cyl: 1.6}
    # The ejector latch strip.
    - {node: latch-t, out: 4.2}
    - {node: latch-b, out: 4.2}
parts:
  # the Power Supply Monitor is an RJ45, not a blank window. Rotated like every
  # other jack on these cards, because the faceplate is only 30.47 wide.
  - {ref: common/rj45-shielded@2, id: psu-monitor, at: [7.33, 119.65], rotate: 90}
skins: [default]
