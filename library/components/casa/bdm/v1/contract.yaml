format: 1
kind: module
name: bdm
version: 1.0.0
class: line-card
profile: networking
description: >-
  Casa Bi-Directional Module - the front half of a BDM position. Carries no RF
  connectors at all; every port lands on the paired rear 6+12 I/O card. The
  faceplate is a blank plate with a model band, two tapering stripe groups and
  three status LEDs. BDM, BDM2 and BDM2m share it and differ only by label.
size: {w: 30.47, h: 345.5, d: 380.0}
attrs: {model: 'BDM2m', role: docsis-line-card, rf-ports: '0', pairs-with: casa/io-6p12}
provenance:
  layout: drawing - Figure 1-14 of the Casa C100G Hardware Installation Guide
    (rev 07/08/2022). Three LEDs in a single column with STATUS, ALARM and
    ACTIVE printed to their right, between two mirrored stripe groups
  ports: drawing - the BDM faceplate has NO connectors. This is not an
    omission; the architecture puts all RF on the rear I/O card
  size: ESTIMATED, shared with casa/io-6p12 - the six faceplates in Fig 1-14
    measure 196 x 2610 px against that card's 197 x 2613, so the whole family
    shares one envelope. The guide figures are schematic rather than to scale,
    so the absolute numbers come from Table A-1 arithmetic. Needs a caliper
  skins: the default skin is the BDM2m, the current member of the family and the
    card the C100G ships in its default configuration. bdm2 and bdm are the two
    predecessors, selectable per configuration via configurations.skins
  leds: drawing - three LEDs in one column. Pitch set to 6.6 against a 3.0 diameter so they read as separate
    indicators; the figure draws them nearly touching, which does not
    survive being scaled down into a chassis view
elements:
  status: {at: [4.80, 190.90], size: [3.0, 3.0], class: led}
  alarm: {at: [4.80, 197.50], size: [3.0, 3.0], class: led}
  active: {at: [4.80, 204.10], size: [3.0, 3.0], class: led}
relief:
  wall: '#4a4f55'
connection-points:
  mate: {at: [15.23, 172.75], direction: front}
skins: [default, bdm2, bdm]
