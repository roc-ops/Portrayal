format: 1
kind: module
name: io-6p12
version: 2.6.0
class: line-card
profile: networking
description: >-
  Casa 6+12 I/O module - the rear half of a BDM position, carrying six
  downstream (D0-D5) and twelve upstream (U0-U11) MCX jacks. Pairs with a BDM
  in the associated front slot. The IO2 variant is the same faceplate at
  5-204 MHz instead of 5-85 MHz.
  (v2 = composed - the eighteen MCX openings are std/mcx@1 at the sourced
  4.95 x 4.50 D-hole; v1 drew them inline at an ESTIMATED 3.87 x 3.14, so an
  aperture here is about 28 percent wider than it was at v1. Jack AXES are
  unchanged.)
size: {w: 30.47, h: 345.5, d: 380.0}
size-confidence: {d: known-wrong}
size-notes: 'd 380.0 is IMPOSSIBLE - a front and a rear card mate at a midplane inside a 386.0 chassis and two at 380.0 need 760. See provenance/depth-known-wrong'
attrs: {model: '6+12 IO', media: coax, connector: mcx, downstream: '6', upstream: '12', spectrum: 5-85MHz}
provenance:
  depth-known-wrong: 'THE 380.0 IS NOT MERELY UNMEASURED, IT IS IMPOSSIBLE, and this
    contract now says so in a field a tool can read - size-confidence: {d: known-wrong}.
    THE CONSTRAINT. Front and rear cards MEET AT A MIDPLANE, which the owner photographed:
    working/photos/casa/c40g-empty-midplane.png shows the emptied cage with the card guides
    and the midplane at the back of it, and the opening where the rear I/O card reaches
    through to the front card. So a front card and its rear partner have to share the
    chassis depth - 386.0 on the C100G, 388.45 on the C40G. Two cards at 380.0 need 760,
    which is not a wide error bar, it is twice the box.
    WHAT THE SHAPE IS, from the owner: "the front card is mostly rectangular, but the I/O
    card is kind of L SHAPED where the top part of the top connector PASSES THROUGH THE
    MIDPLANE and plugs into the front card, and the other one is plugged into the midplane.
    So they ultimately kind of meet in the middle." So the rear card is a body against the
    midplane PLUS A TONGUE at the top reaching forward through it.
    NOTE WHAT THAT DOES AND DOES NOT ALLOW, because the obvious rule is wrong. front + rear
    CAN exceed the chassis depth, by about the tongue length, because the tongue overlaps the
    front card at a height where the front card is not - they interleave rather than tile. The
    constraint is therefore an inequality with slack, not an equality. What it cannot absorb
    is a 374 mm overlap where a tongue is tens of millimetres.
    ONE PHOTOGRAPH IS USABLE AND IT IS NOT THIS CARD-FAMILY-WIDE. bdm2m-solder-side.jpeg has
    the faceplate FULLY IN FRAME, so its 345.5 long axis anchors the scale at 5.00 px/mm; the
    card measures 1336 px from the faceplate to the top of its midplane connectors. Raw that
    is 267 mm. The shot is NOT orthographic - the PCB reads 4.66 percent wider at the
    connector end than at the faceplate end, which is perspective, not a taper - so correcting
    to the mean scale gives about 261, and taking the card top at the outermost connector edge
    instead pushes it to about 282. CALL IT 270 PLUS OR MINUS 12 AND DO NOT ROUND THAT AWAY.
    REJECTED, and the rejection is the useful part: bdm2m-top-plan.jpeg and both qam-io-card
    plan shots have the faceplate CLIPPED BY THE FRAME, so the 345.5 anchor is truncated and
    every number off them is understated by an unknown amount. Measured anyway, the top-plan
    gives 227 mm for the same card the solder side gives 270 - a 19 percent disagreement that
    is entirely the broken anchor. They are not second opinions and must not be averaged in.
    NOTHING IS REPLACED. 270 plus or minus 12 is one reading of one card from one photograph
    that fails gate 1, and stamping it on twelve cards would be the family-number pattern
    doing harm instead of good - these cards share a FACEPLATE, which is established, not a
    depth, which is not. What is established is that 380.0 cannot be true.
    WANTED, in order of how much each unlocks: a tape on any one front card (fixes it
    outright); a tape on any one rear I/O card; an unclipped side-on photograph of a rear card
    showing where the tongue begins, which would give the midplane position and both halves
    at once.'
  body-shape-not-a-box: 'THIS CARD IS AN L IN SIDE ELEVATION AND PORTRAYAL CANNOT SAY SO.
    The owner: the rear I/O card has a main body that seats against the midplane plus a TONGUE
    at the top that passes THROUGH an opening in the midplane and plugs directly into the front
    card. `body:` takes a depth, a colour, an optional smaller footprint and a plate - all of
    which describe a BOX. There is no way to declare a body that is full slot height for part
    of its depth and a narrower section for the rest.
    So this contract declares NO body rather than declaring a box that is wrong in a way
    nothing records. That is the same call this library made on the MCX recess: where the
    vocabulary cannot express the shape, say so and leave the record, because a wrong shape
    with no note is worse than an absent one.
    WANTED: either a body section - a list of depth bands with their own footprints - or the
    honest acknowledgement that a mid-plane-mating card needs its own kind.'
  power: >-
    NONE STATED, AND THIS IS WHERE THAT BELONGS. No table in either Casa guide gives an
    I/O module a power figure - Tables A-8 and A-9 give the RFD and RFU their connectors
    and nothing else - and the BDM's "approximately 300W" is scoped to the BDM WITH its
    paired I/O card, which is why the front half carries that figure under
    power-draw-scope: module-with-paired-io. Writing a number here would double count the
    pairing, so the absence is CORRECT rather than merely unsourced and the L27 warning is
    its record.
    WHERE THIS CAME FROM: casa/io-6p12-io2 and casa/io-6p12-sw-io2 have carried this
    reasoning since they were built, and both open it with "same as the plain card" - so
    they were asserting a fact about THIS file, in their own, where nothing could check it
    and where this card never said it. Restated here in this card's own terms. It is the
    same finding, not a second one, and the two io2 entries are echoes of it rather than
    independent corroboration.
  layout: drawing - Figure 1-15 of the Casa C100G Hardware Installation Guide
    (rev 07/08/2022). Twelve U jacks in the left column, six D in the right,
    interleaved. Port COUNT and ARRANGEMENT are read straight off the figure
    and are reliable
  size: ESTIMATED. The guide figures are schematic, not to scale - the drawn
    chassis aspect is 0.936 against a specified 0.844, and the drawn slot
    pitches are irregular (108, 130, 78, 112 px for what should be one pitch).
    Width is arithmetic from Table A-1 instead - 19in rack, ~440mm interior,
    14 slots gives 31.43. Height is bracketed by two schematic estimates that
    disagree by 10 percent - 461mm from the front-view proportion, 417mm from
    the Fig 1-15 faceplate aspect - so 440 is the midpoint. Needs a caliper
  connector: drawing - the figure's cable note reads "Single quad-shielded
    cable with MCX male snap-on plug; 75 ohm male F-connector on opposite end",
    so the jack on this card is MCX and the F-connector is at the headend end
  bore: registry - THIS IS THE VERSION BUMP. v1 drew the eighteen MCX openings
    inline; v2 COMPOSES std/mcx@1, so the aperture is the registry's `mcx` key (4.95 x
    4.50 D-hole, Radiall R113.553.000 panel drawing) instead of the estimate this
    card used to carry. Every jack AXIS is unchanged - only the
    hole's size and shape moved, from a guessed rectangle to the sourced D-hole
    (proved by diffing the compiled drawing - 18/18 axes land within 0.005 mm,
    which is the old skin's two-decimal rounding and not a move). Note the
    composed part is placed on its AXIS, which sits 2.475 from the top of a
    4.50-high D-hole rather than at half its height.
    The two cards had disagreed with each other about the same connector (3.87 x
    3.14 here against 3.88 x 3.88 on the SW card); they now cannot
  comb: photograph - a C40G rear shot shows every I/O card fronted by a cable
    comb carried on brass standoffs. Jason measured the standoffs at about 3/8in
    (9.5mm) proud of the faceplate and the comb itself at about 1/16in (1.6mm)
    thick. The comb is notched per port and carries the U0-U11 / D0-D5 silkscreen,
    and the labels appear on BOTH the card face and the comb - the comb
    repeats them where the cable actually lands rather than replacing them
  figure-check: drawing - RE-MEASURED against Figure 1-15 at 600 dpi for the v2
    bump, rather than trusted because v1 had used them. Detecting the orange jack
    fills by colour and walking out to the plate gives twelve U jacks at x 6.974
    of a 30.47 plate, y 41.93 to 254.50 on a 19.324 pitch, and six D jacks at x
    18.066, y 46.78 to 240.58 on a 38.761 pitch. What this contract carries -
    6.855 / 41.93 / 19.34 and 17.985 / 46.72 / 38.79 - agrees with all six to
    0.12 mm, so the composed apertures land where the FIGURE puts them and not
    merely where they used to be.
    The figure also settles the size question the bump raises. The drawn jack is
    7.82 mm across overall (36 radii, spread 0.4 mm) with a 3.28 mm coloured
    centre. That is not the panel hole - it is the connector as seen, and an MCX
    bulkhead jack's front flange is 6.5 mm dia on the Radiall sheet, which at this
    figure's demonstrated 14 percent scale error is the same thing. So a 4.95 mm
    hole under a 6.5 mm flange is what the figure draws; v1's 3.87 x 3.14 was
    smaller than either.
    Clearance is not close. The U pitch is 19.32 and the columns are 11.1 apart,
    so a 4.95 aperture (and even a 6.5 flange) fits with room; nothing had to be
    compressed to make the sourced size fit the figure's pitch.
  mcx-is-recessed: 'THE OWNER, AGAINST THE HARDWARE: "the MCX connector is RECESSED
    INTO the faceplate, so it actually doesn''t stick out from the faceplate, it''s
    recessed from the faceplate ... whereas the US I/O and the DS I/Os have the F
    fitting STICKING OUT of the faceplate." So the two connector families on these
    chassis go OPPOSITE WAYS - MCX recessed, F-type proud - and that is a fact about
    the world, recorded in his terms so it does not have to be rediscovered.
    THIS SENTENCE IS COPIED FROM casa/io-6p12-sw@2, where it was written first. One
    statement from one person about one pair of connector families, restated on every
    card it applies to - not several observations that agreed.
    THE FIGURES AGREE, INDEPENDENTLY AND AFTERWARDS. Figure 1-12 (C100G), "RF IO
    upstream and downstream modules", draws the three rear I/O cards side by side and
    treats the families completely differently: every F port on QAM IO and US IO is a
    HEX NUT with concentric rings and a shadow, a connector body standing off the
    plate, while every MCX port on UPS IO 32 is a small flat dark circle with no hex
    and no body. Figures 1-15 and 1-16 draw the 6+12 cards'' MCX the same flat way.
    NOTHING IS CHANGED HERE YET, and the reason is not indecision. The aperture is
    composed from std/mcx@1, whose relief is {node: barrel, cyl: 2.0} - a PROTRUSION
    read off the Radiall R113.553.000 side elevation, which is a FRONT-MOUNT bulkhead
    jack whose flange does sit on the front of its panel. std/mcx@1 is not wrong about
    that connector; it is the wrong VARIANT for every card that composes it, and all
    five of its users are Casa. It is a std/ part and the registry note in
    spec/schemas/standards.yaml says the same thing, so the two have to move together
    and the decision is not this contract''s to take. Reported to the team lead.
    NO DEPTH IS GUESSED: the owner gave a topology, not a dimension, and no Casa
    document gives a recess depth. WANTED: how far below the faceplate the MCX
    interface sits - one caliper reading or one side-on photograph.'
  missing-component: 'THE CABLE COMB IS A REAL, NAMED PART AND THIS LIBRARY DOES NOT
    HAVE ONE. The `comb` entry above describes it from a photograph; the guides name it
    and draw it. Figures 1-15 and 1-16 of the C100G guide are captioned "6+12 IO Module
    w/ cable retention bracket" and "6+12 SW IO Modules w/ cable retention bracket", and
    each draws the bracket as its OWN object beside the card - a notched strip with the
    U and D numbers printed between the notches and three screws through it, one per
    standoff. Figure 2-15 of the C40G guide names the equivalent outright, "UPS 32x4 I/O
    cable retention plate", and draws it separated from its module.
    So casa/ is missing a component, not a decision: there is no cable-retention-plate
    part and none of the four I/O card families can seat one, even though the three
    standoffs on this faceplate exist for no other purpose than to carry it. Recorded
    rather than built - building it is a modelling job with its own sourcing, not part
    of a relief pass. It is NOT casa/cable-manager, which is a different bracket on the
    chassis front. WRITTEN FIRST IN casa/ups-32x4@1 and restated here.'
  relief: 'the C100G/C40G card family treatment - two captive screws (cyl 1.6), the
    ejector latch strip (out 4.2). THE FULL ARGUMENT IS IN casa/bdm@1 AND THIS IS A
    POINTER TO IT, not a second reading: the magnitudes are one estimate per kind of
    hardware, borrowed from edgecore/agr-panel-screw@1 for a screw head and edgecore/agr-psu-dc@1 for the ejector latch, applied across the family because these cards share a faceplate.
    No Casa document states a depth for any of them. Eleven cards carrying 4.2 is ONE
    estimate written eleven times, not eleven readings that agreed. NOTE this card has
    NO LAMPS, so the family''s dome figure is deliberately not cited here - citing a
    source for a number a file does not carry is how an inert wrong claim gets started. The three brass comb standoffs above are a separate, PHOTO-MEASURED number and are not part of this family treatment.'
relief:
  wall: '#4a4f55'
  features:
    # Two captive slotted screws on the centreline - the guide's own
    # "integrated thumbscrews" / "captive screws".
    - {node: screw-t, cyl: 1.6, confidence: borrowed, source: 'edgecore/agr-panel-screw@1 - its measured captive screw head'}
    - {node: screw-b, cyl: 1.6, confidence: borrowed, source: 'edgecore/agr-panel-screw@1 - its measured captive screw head'}
    # The ejector latch strip.
    - {node: latch-t, out: 4.2, confidence: borrowed, source: 'edgecore/agr-psu-dc@1 latch - measured off the real PSU'}
    - {node: latch-b, out: 4.2, confidence: borrowed, source: 'edgecore/agr-psu-dc@1 latch - measured off the real PSU'}
    # Brass standoffs stand 3/8in proud of the faceplate, centred across the
    # card, and carry the comb when it is fitted
    - {node: standoff-t, out: 9.5, color: '#b08d57', confidence: photo-measured, source: 'Jason - 3/8in off one C40G rear photograph. All twelve are that ONE reading'}
    - {node: standoff-m, out: 9.5, color: '#b08d57', confidence: photo-measured, source: 'Jason - 3/8in off one C40G rear photograph. All twelve are that ONE reading'}
    - {node: standoff-b, out: 9.5, color: '#b08d57', confidence: photo-measured, source: 'Jason - 3/8in off one C40G rear photograph. All twelve are that ONE reading'}
