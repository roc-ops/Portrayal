format: 1
kind: component
name: lcm-touchscreen-1-3
version: 1.0.0
class: display
profile: networking
description: >-
  The 1.3 inch colour touchscreen on the front of the UniFi rack switches and the Dream Machine
  gateways - a dark square on the left of the faceplate that shows the device's status and menus
  and answers touch.
size: {w: 23.0, h: 23.0}
size-confidence: {w: estimated, h: estimated}
provenance:
  size: >-
    estimated - the dark square is read off the community front elevations of the USW-Pro-24-PoE
    (23.6 x 24.4 mm at 2.665 px per mm across and 2.586 down, from the 442.4 x 43.7 mm body) and
    of the UDM-Pro (23.0 x 22.8 mm at 2.407 px per mm across and 2.425 down); 23.0 square is
    carried. The 1.3 inch figure is the maker's, on both data sheets ("LCM display: (1) 1.3 inch
    touchscreen"); it is a diagonal of the glass, 33 mm, and the 23 mm square plate has a 32.5 mm
    diagonal, which agrees. No held document dimensions the bezel.
  same-part: >-
    the data sheets of the USW-Pro-24-PoE and the UDM-Pro, and both spec pages, give the same
    field and the same words on the two models. The two photographs show the same dark rounded
    square; only what the screen displays differs.
  readout: >-
    not stated: no held document says what the screen shows or which touches it takes (the
    install guides are not held), so it carries no messages.
elements:
  screen: {at: [1.0, 1.0], size: [21.0, 21.0], class: display}
skins: [default]
