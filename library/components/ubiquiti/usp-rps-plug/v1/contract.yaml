format: 1
kind: component
name: usp-rps-plug
version: 1.0.0
class: port
mates: ubiquiti-usp-rps
profile: power
description: >-
  The connector end of the cable that joins a UniFi rack switch or Dream Machine gateway to an external
  redundant power supply, seen from the cable end as a front elevation sees it seated: a rectangular
  moulded plug as wide as the socket's face and a short straight stub of cable. It seats in the
  USP-RPS input (`ubiquiti-usp-rps`) at its own mate point. No drawing or part number of the plug is
  held, so every figure is estimated from the socket.
size: {w: 60.0, h: 15.8}
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  estimated - the plug is drawn to the 60.0 by 15.8 of the socket face of ubiquiti/usp-rps-input@1; no
  source gives a dimension of the plug
attrs: {media: rps, connector: ubiquiti-usp-rps}
fields:
  cable-od: {label: Cable outside diameter, type: number, unit: mm, default: 6.0}
  jacket-color: {label: Jacket colour, type: text, default: '#1c1c1c'}
unplaced: seated by configurations downstream of this library; see docs/pluggables-design.md
provenance:
  size: >-
    estimated - the face is the socket face of ubiquiti/usp-rps-input@1, 60.0 by 15.8, read off the
    community NetBox rear elevations of the USW-Pro-24-PoE and the UDM-Pro. A plug has to enter the
    socket, so it cannot be larger; how much smaller it is no held source says.
  needs-drawing: >-
    NEEDS A DRAWING - the connector end of the cable for the USP-RPS input. The USW-Pro-24-PoE and
    UDM-Pro data sheets name the input ("USP RPS DC input", "USP-RPS DC input") and name no cable, plug
    or part number, so none is given here. Until a drawing of the end is held every figure is a
    reading.
  no-depth: >-
    NO `size.d`, DELIBERATELY, as on cisco/rps2300-plug@1: a `size.d` on a component with no
    `behaviour` compiles to `data-depth`, which the kit builds as a pit behind the part. The depth is
    carried by the relief instead.
  frame: >-
    THE RELIEF IS MEASURED FROM THE HOST'S PRESENTED LIFT, as cisco/rps2300-plug@1's is.
    ubiquiti/usp-rps-input@1 presents at its own face, so 0 is the panel plane the socket stands in.
    What lies inside the socket is not built.
  stands: >-
    estimated - the body stands 30.0 in front of the panel. No source gives the plug's length or how
    far it seats; 30.0 is a reading, to be replaced by the drawing named under needs-drawing.
  stub: >-
    estimated - the stub rule, docs/connectors-coax-design.md section 5: a straight run of cable 30
    long from the plug's rear face. The cable's bend is the installation's.
  cable-od: >-
    estimated - 6.0 is a reading that fits inside the plug's 15.8 height. No source gives the cable's
    diameter; a placement or a wrapper sets the cable it carries, at its own `cable-od`.
  jacket-colour: >-
    a FIELD. Black is the default because no held source states a colour.
  axis: >-
    derived - `mate` and `cable` share one point, the centre of the face (30.0, 7.9): the cable runs
    straight through the plug, so its front and its rear are one axis seen from two directions.
  contacts: >-
    NOT DRAWN, ON PURPOSE. The contacts are on the plug's front face, which is in the socket; a front
    elevation of a seated plug looks at the cable end. Their number is not published.
  behaviour: >-
    DELIBERATELY OMITTED, as on every class port plug.
elements: {}
relief:
  features:
    - node: body
      out: 30.0
      shape: true
      color: '#26282b'
      confidence: estimated
      source: >-
        no source - the plug's length is a reading (provenance.stands)
    - node: stub
      lift: 30.0
      cyl: 30
      confidence: estimated
      source: the stub rule, docs/connectors-coax-design.md section 5
connection-points:
  mate: {at: [30.0, 7.9], direction: front}
  cable: {at: [30.0, 7.9], direction: front, 'on': stub}
skins: [default]
