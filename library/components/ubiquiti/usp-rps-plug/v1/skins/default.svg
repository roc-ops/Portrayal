<svg xmlns="http://www.w3.org/2000/svg" width="60mm" height="15.8mm" viewBox="0 0 60 15.8">
  <!-- Drawn from the cable end, as a front elevation sees a seated plug: a body as wide as the
       socket's face, then the cable. Farthest from the viewer first. Each node is the
       whole art of its relief feature. Every figure is estimated. -->
  <rect id="body" x="0" y="0" width="60" height="15.8" rx="2.0" fill="#26282b" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The cable. Its drawn radius is half the default cable-od (6.0); a wrapper's or a
       placement's cable-od resizes it. -->
  <circle id="stub" cx="30.0" cy="7.9" r="3.0"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
