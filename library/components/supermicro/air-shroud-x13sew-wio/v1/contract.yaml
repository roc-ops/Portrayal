description: >-
  The processor air shroud of the Supermicro X13SEW WIO servers seen from
  above - a black moulded duct that is as wide as four fans at the fan row and
  narrows to the width of the heatsink it covers
provenance:
  sources: >-
    An angled photograph of the open SYS-111E-WR in the StorageReview review
    (storagereview.com/wp-content/uploads/2023/03/StorageReview-Supermicro-Sys-111E-WR-5.jpg),
    the only image held that shows the shroud fitted; both manuals list one air shroud
    and photograph the chassis from above with it taken out.
  size: >-
    estimated - 164 x 181. The photograph is taken from a corner and nothing is measured
    off it: the shroud is drawn from what it is seen to cover - the four fans nearest
    the supplies at its wide end, the heatsink under its narrow end, with the DIMM banks
    showing either side of it - at the positions the top-down photograph gives those
    parts.
  relief: >-
    estimated - 34 tall, a duct that stands over the heatsink; not measured.
