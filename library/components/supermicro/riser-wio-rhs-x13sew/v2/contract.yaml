name: riser-wio-rhs-x13sew
version: 2.0.0
class: riser
behaviour: fills
profile: server
description: >-
  The right-hand-side WIO riser of the SuperServer SYS-111E-WR as the rear
  presents it - slot 3, PCIe 5.0 x8 in an x16 connector, low profile, a window
  above the onboard LAN and VGA ports over a standard bracket
provenance:
  sources: >-
    The near straight-on rear photograph in StorageReview's review of the SYS-111E-WR
    (storagereview.com/wp-content/uploads/2023/03/StorageReview-Supermicro-Sys-111E-WR-6.jpg,
    1200 x 677), on which the body between its side walls is 889 px for the 437 mm
    width, 2.034 px/mm. SuperServer SYS-111E-WR User's Manual, MNL-2490 revision 1.0d
    section 3.9: "1U RHS WIO riser card with PCIe 5.0 x8 (in x16) slot" for slot 3, and
    the rear view table: slot 3 PCIe 5.0 x8 (in x16) low-profile. THE RISER CARD PART
    NUMBER IS NOT PRINTED in any document held; the name here is this library's, after
    the X13SEW board. The SYS-111E-FDWTR seats the same part: its front image puts this
    window at 230.2..293.6 across its face, against 230.6..292.5 here.
  size: >-
    photo-measured - 79.5 x 23.8: from the bracket tab left of the window (218.5 on the
    rear) to where it meets the slot 1 and 2 brackets (298.0), and down to the ledge
    over the LAN ports.
  placing: >-
    photo-measured - WHAT THE WINDOW SHOWS IS THE BRACKET CONNECTOR OPENING, and that
    places the bay. The window runs 12.1..71.0 x 6.3..22.5 on this face. A low-profile
    bracket's opening is 15.63..70.16 from its tip (std/pcie-bracket-lp@1); turned over,
    with the bay at 2.9, it lies 11.9..66.5 here and the whole opening shows. @1 HAD THE
    BAY AT 0.3, to make this bracket's tip meet the tips of slots 1 and 2 at 298.0, and
    the plate then covered the first 2.5 mm of the opening - the edge of a card's first
    cage. The tip now runs 2.6 past this part's end, behind the post of the slot 1 and 2
    bracket, as the tips of two opposed slots do (hpe/riser-primary-dl160@1 has the same
    overlap).
  handedness: >-
    estimated - turned over (rotate 180, tip right). The flange end is read from the tab
    the photograph shows at the left of the window; no image held shows a card in slot
    3, so which edge its connectors stand at is not seen.
  slots: >-
    datasheet - product page and manual: one PCIe 5.0 x8 slot in an x16 connector, low
    profile.
  depth: >-
    estimated - 180, as supermicro/riser-wio-lhs-x13sew@1.
  plan: >-
    seen from above, the riser is supermicro/riser-wio-rhs-plan-x13sew@1, and a card in
    slot 3 lies in it at the slot wall.
