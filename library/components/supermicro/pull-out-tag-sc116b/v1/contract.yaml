  serial number label underneath
provenance:
  sources: >-
    The near straight-on front photograph in StorageReview's review of the SYS-111E-WR
    (storagereview.com/wp-content/uploads/2023/03/StorageReview-Supermicro-Sys-111E-WR-7.jpg,
    1200 x 698), on which the body between the ear folds is 894 px for the 437 mm width,
    2.046 px/mm. The quick reference guide QRG-2490: "Pull-out tag with BMC unique
    password and Serial Number Label underneath." Supermicro product page front view
    callout, Pull-out Tag.
  size: >-
    photo-measured - 52.0 x 5.0, the tab as it sits in the top strip over the first
    drive column (1.5..53.5 x 1.2..6.2 on the front). Its right end is soft on the
    photograph.
