description: >-
  The slot 1 and 2 riser bracket of the SuperServer SYS-111E servers seen from
  above, slot wall at the top - a sheet-metal L: a bar along the slot wall and
  an arm running in beside the board, with its two blue lift points
provenance:
  sources: >-
    the top-down photograph of the open SYS-111E-WR embedded in its manual MNL-2490 as
    figure 1-5 (856 x 1050), on which the chassis is 660 px across at the rear for 437
    mm (1.510 px/mm) and 900 px front to rear for 597 (1.508); the product page top view
    callout "Tool-Less, Top-Loading Riser Brackets with FHFL Double-Width GPU Support".
  size: >-
    estimated - 123 x 205. 123 is the width of the bracket on the slot wall
    (supermicro/riser-wio-lhs-x13sew@1), so the plan lands on its own bay; 205 is how
    far the arm runs in on the WR photograph, 308 px. The shape is traced by eye. ON THE
    PHOTOGRAPH THE ARM LIES FURTHER INBOARD than this, over the edge of the board
    (133..163 across the chassis, where this draws it 113..139): the part is kept to the
    width of its bay so that the cards it carries project inside it.
