format: 1
kind: module
name: pcie-blank-fh
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  Supermicro full-height expansion slot blank of the 1U WIO chassis, lying flat -
  the part of it a slot window shows, two rows of square vents
provenance:
  sources: >-
    The near straight-on rear photograph in StorageReview's review of the SYS-111E-WR
    (storagereview.com/wp-content/uploads/2023/03/StorageReview-Supermicro-Sys-111E-WR-6.jpg,
    1200 x 677), on which the body between its side walls is 889 px for the 437 mm
    width, 2.034 px/mm; slot 2 carries this blank on the photographed server.
    SuperServer SYS-111E-WR User's Manual, MNL-2490 revision 1.0d section 3.9.
  size: >-
    registry - 120.02 x 21.59, THE WHOLE BRACKET (std/pcie-bracket-fh@2, PCIe CEM 5.0),
    drawn tip-left as the standard part is, so a slot seats it as it seats a card. The
    photograph gives the window, not the bracket.
  face: >-
    photo-measured - two rows of square vents, 3.3 on a 4.9 pitch across and 6.1 down,
    centred on the height of the bracket body; 18 columns starting 21.3 from the tip.
  depth: >-
    estimated - NOT KNOWN; drawn as a plate.
size: {w: 120.02, h: 21.59}
size-confidence: {w: registry, h: registry}
elements:
  vents: {at: [21.3, 7.68], size: [86.6, 9.4], class: vent}
skins: [default]
