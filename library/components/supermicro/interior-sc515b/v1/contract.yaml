version: 1.0.0
class: mechanical
profile: server
description: >-
  The interior of the SuperServer SYS-111E-FDWTR and SYS-111E-FWTR seen from above with the cover off -
  the chassis floor between the side walls, drawn as the well everything under
  the cover stands in
provenance:
  size: >-
    estimated - 435 x 330.5: the chassis between its side walls, a millimetre of sheet
    metal in from each, from the I/O wall as far as the fan row. THE FANS ARE NOT IN IT,
    on purpose: a part standing in a well is built down to the well floor and does not
    lift out whole, and a fan has to. They stand in the band of chassis beside it,
    framed by their tray, as dell/fan-1u-16g@1 stands in its bracket.
  depth: >-
    estimated - 41.5, the 43 mm chassis less its floor and lid. THIS WELL IS WHAT MAKES
    THE INTERIOR SOLID IN 3D: a part in it stands on the floor and rises its own height,
    so a DIMM (31.3) stops short of the lid, and a supply or riser seated from the rear
    or front stands in it as its own body and leaves it empty when pulled. Before it
    existed the board was the only well and the supplies were paint on a solid top.
