format: 1
kind: component
name: xm3352-dc-cable-plug
version: 1.0.0
class: port
mates: telco-dc-block-3
profile: power
description: >-
  The cable connector of the Telco Systems XM-3352's DC supply, wired, seen from the wire side as
  seated. A green block at the outline of the connector it seats in, with one insulated wire
  entering each of its three cells. It seats in a `telco-dc-block-3` connector at its own mate
  point. It carries one wire per cell, not one cable.
size: {w: 23.4, h: 13.9}
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  The outline of the connector it seats in, telco-systems/xm3352-dc-header@1, 23.4 by 13.9. No
  document held draws or measures a cable connector for this supply.
attrs: {media: xm3352-dc, connector: DC power cable connector, positions: 3}
unplaced: seated by configurations downstream of this library; see docs/pluggables-design.md decision 2
provenance:
  model: >-
    NO DOCUMENT HELD SHOWS A CABLE CONNECTOR FOR THIS SUPPLY: the Telco Systems XM-3352 data sheet's
    photographs show the supply with nothing seated in its DC connector. THE PART IS A STAND-IN FOR THE
    CABLE CONNECTOR, drawn as the half that seats in telco-systems/xm3352-dc-header@1 and no more.
  size: >-
    estimated - see size-notes.
  wiring: >-
    estimated - one wire to each of the three cells, drawn as plain grey discs because no document states
    a wire colour. The module prints "-" above the left cell and "+" above the right one and nothing above
    the middle cell, so the wires are numbered left to right and no meaning is given to the middle one.
  far-end: >-
    NOT DRAWN. The other ends of the wires land on the site's DC source, which is not this supply's.
  depth: >-
    NOT STATED. No document gives how far the cable connector stands out of the supply, so the part draws a
    plan outline only and builds no relief.
  behaviour: >-
    DELIBERATELY OMITTED, as on every class port contract.
elements: {}
connection-points:
  mate: {at: [11.7, 10.5], direction: front}
  wire-1: {at: [7.7, 10.5], direction: front}
  wire-2: {at: [11.7, 10.5], direction: front}
  wire-3: {at: [15.7, 10.5], direction: front}
skins: [default]
