<svg xmlns="http://www.w3.org/2000/svg" width="23.4mm" height="13.9mm" viewBox="0 0 23.4 13.9">
  <!-- The cable connector of the XM-3352 DC supply seen from the wire side, seated: a green block at the connector's outline and one
       wire entering each of its three cells. Shapes and colours are estimates; no document held draws a cable connector. -->
  <rect id="body" x="0" y="0" width="23.4" height="13.9" rx="0.6" fill="#4fb57e" stroke="#2f7a52" stroke-width="0.3"/>
  <circle id="wire-1" cx="7.7" cy="10.5" r="1.4" fill="#8a8d91" stroke="#4a4d52" stroke-width="0.12"/>
  <circle id="wire-2" cx="11.7" cy="10.5" r="1.4" fill="#8a8d91" stroke="#4a4d52" stroke-width="0.12"/>
  <circle id="wire-3" cx="15.7" cy="10.5" r="1.4" fill="#8a8d91" stroke="#4a4d52" stroke-width="0.12"/>
</svg>
