<svg xmlns="http://www.w3.org/2000/svg" width="20.1mm" height="12.1mm" viewBox="0 0 20.1 12.1">
  <!-- The cable connector of the XM-8424H DC supply seen from the wire side, seated: a green block at the connector's outline and one
       wire entering each of its two cells. Shapes and colours are estimates; no document held draws a cable connector. -->
  <rect id="body" x="0" y="0" width="20.1" height="12.1" rx="0.5" fill="#4fb548" stroke="#2f7a2a" stroke-width="0.3"/>
  <circle id="wire-1" cx="7.85" cy="7.75" r="1.4" fill="#8a8d91" stroke="#4a4d52" stroke-width="0.12"/>
  <circle id="wire-2" cx="12.85" cy="7.75" r="1.4" fill="#8a8d91" stroke="#4a4d52" stroke-width="0.12"/>
</svg>
