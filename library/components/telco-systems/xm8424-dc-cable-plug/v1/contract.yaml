format: 1
kind: component
name: xm8424-dc-cable-plug
version: 1.0.0
class: port
mates: telco-dc-block-2
profile: power
description: >-
  The cable connector of the Telco Systems XM-8424H's DC supply, wired, seen from the wire side as
  seated. A green block at the outline of the connector it seats in, with one insulated wire
  entering each of its two cells. It seats in a `telco-dc-block-2` connector at its own mate
  point. It carries one wire per cell, not one cable.
size: {w: 20.1, h: 12.1}
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  The outline of the connector it seats in, telco-systems/xm8424-dc-header@1, 20.1 by 12.1. No
  document held draws or measures a cable connector for this supply.
attrs: {media: xm8424-dc, connector: DC power cable connector, positions: 2}
unplaced: seated by configurations downstream of this library; see docs/pluggables-design.md decision 2
provenance:
  model: >-
    NO DOCUMENT HELD SHOWS A CABLE CONNECTOR FOR THIS SUPPLY: the Telco Systems XM-8424H data sheet's
    photographs show the supply with nothing seated in its DC connector. THE PART IS A STAND-IN FOR THE
    CABLE CONNECTOR, drawn as the half that seats in telco-systems/xm8424-dc-header@1 and no more.
  size: >-
    estimated - see size-notes.
  wiring: >-
    estimated - one wire to each of the two cells, drawn as plain grey discs because no document states a
    wire colour or which cell takes which pole; the wires are numbered left to right and no role is given to
    either.
  far-end: >-
    NOT DRAWN. The other ends of the wires land on the site's DC source, which is not this supply's.
  depth: >-
    NOT STATED. No document gives how far the cable connector stands out of the supply, so the part draws a
    plan outline only and builds no relief.
  behaviour: >-
    DELIBERATELY OMITTED, as on every class port contract.
elements: {}
connection-points:
  mate: {at: [10.35, 7.75], direction: front}
  wire-1: {at: [7.85, 7.75], direction: front}
  wire-2: {at: [12.85, 7.75], direction: front}
skins: [default]
