format: 1
kind: module
name: tm810x-4qsfp28
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Telco Systems TM810x-4QSFP28 - the 4 x 40/100GE QSFP28 expansion module of the TM-8104
  and TM-8106, a full-width card in the chassis' upper slot: four QSFP28 cages in a row,
  each under four round lane lamps, a perforated vent field along the top and a silver
  ejector handle at each end.
size: {w: 376.7, h: 33.9}
size-confidence: {w: estimated, h: estimated}
attrs:
  model: TM810x-4QSFP28
  power-absent: not-published
  qsfp28: 4
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      4 x 40/100GE QSFP28 (data sheets, "TM810x Expansion Module With 4x100G"). THE FACE
      NUMBERS THEM AS SLOTS: the legends under the cages read 1/2/1, 1/3/1, 1/4/1 and
      1/5/1, so each cage is interface 1 of its own logical slot 2-5 rather than port 1-4
      of slot 2.
  lane-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: four round lamps above each cage, one per 25G lane.
provenance:
  identity: >-
    datasheet - ordered as TM810x-4QSFP28 "Expansion Module With 4x100G" (TM-8104 and
    TM-8106 data sheets, 2025/12); TM8104-4QSFP28 / Ext-T-Metro 8104-100GE in the 2021
    editions.
  size: >-
    estimated - the stencil master TM810x-4QSFP28, same 142.2 x 12.95 unit outline as the
    48-port card, drawn at the chassis slot's 376.7 x 33.9 (see telco-systems/tm810x-48sfp@1).
  ports: >-
    estimated - common/qsfp-cage@3 centred on the stencil's 20.28 x 9.72 cage openings at
    x 54.32, 118.08, 181.89 and 245.75 (a 63.8 pitch), y 18.79. The 2025 render
    (telco.com 2025/08/8104@2x.png) and the 2022 8106 front (2022/05/8106.jpg) put the
    four cages in the same places, the right quarter of the card blank.
  lamps: >-
    estimated - common/led-dot@1 on the stencil's four 2.07 mm dots per cage at y 14.55,
    x on a 4.6 pitch; the 2025 render shows the same four dots above each cage. Their
    states are not documented anywhere held.
  printing: >-
    TWO PRINTINGS EXIST. The stencil and the 2025 renders print "4 x 40/100G Port Module"
    at the lower left and 1/2/1 ... 1/5/1 under the cages; the 2022 8106 front
    (telco.com 2022/05/8106.jpg) prints "100G Port Module" with "1/2/x" above and 1 ... 4
    under the cages. The current printing is drawn; the older one is recorded here rather
    than drawn as a second skin because no configuration could say which unit wears it.
  vents: >-
    photo-measured extent, estimated holes - the 2025 render shows a field of small square
    perforations across the top of the plate from inboard of the left thumbscrew to the
    right one; hole size and pitch are drawn to look right at that render's ~3.9 px/mm,
    not measured.
  power: >-
    NOT STATED. No data sheet held gives a per-module figure.
