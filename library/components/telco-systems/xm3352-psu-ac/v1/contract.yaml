format: 1
kind: module
name: xm3352-psu-ac
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The swappable AC supply of the Telco Systems XM-3352: a captive thumbscrew at the left and a
  cloverleaf (C6-form) AC inlet, under a printed "100-240V~".
size: {w: 49.8, h: 21.6}
size-confidence: {w: photo-measured, h: photo-measured}
attrs:
  model: XM-3352-ACPS-NA
  power-absent: not-published
  input: ac
  input-voltage: 100-240 VAC (face "100-240V~")
provenance:
  size: >-
    photo-measured - the XM-3352 render rectified onto 220 x 44 (about 5 px/mm): the two supply
    bays are stacked at the left, x 0.3-50.1, the upper at y 0.4-22.0 and the lower at y
    22.4-44.0, meeting the fixed face panel at x 51.
  power: >-
    NOT STATED. The data sheet gives "100-240V AC, 48-60V DC" and no supply rating; the module
    prints only "100-240V~".
  elements: >-
    photo-measured at the same scale: thumbscrew centred at about (4.3, 12.1) on the face, the
    inlet surround x 18.2-40.8, y 1.0-21.5.
states: [absent]
elements:
  thumbscrew: {at: [1.1, 8.3], size: [6.4, 6.4], class: fastener}
parts:
  - {ref: telco-systems/xm3352-ac-inlet@1, id: inlet, at: [17.9, 0.6]}
skins: [default]
