  <circle id="wire-1" cx="5.7" cy="12.2" r="1.4" fill="#8a8d91" stroke="#4a4d52" stroke-width="0.12"/>
  <circle id="wire-2" cx="5.7" cy="17.33" r="1.4" fill="#8a8d91" stroke="#4a4d52" stroke-width="0.12"/>
  <circle id="wire-3" cx="5.7" cy="22.46" r="1.4" fill="#8a8d91" stroke="#4a4d52" stroke-width="0.12"/>
  <circle id="wire-4" cx="5.7" cy="27.59" r="1.4" fill="#8a8d91" stroke="#4a4d52" stroke-width="0.12"/>
