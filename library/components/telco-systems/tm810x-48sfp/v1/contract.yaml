format: 1
kind: module
name: tm810x-48sfp
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Telco Systems TM810x-48SFP+ - the 48 x 1/10GE SFP+ expansion module of the TM-8104 and
  TM-8106 (formerly T-Metro 8104 / 8106), a full-width card in the chassis' upper slot:
  three blocks of 2 x 8 stacked SFP+ cages with an up and a down arrow lamp per column in
  the pale strip between the rows, a silver ejector handle at each end.
size: {w: 376.7, h: 33.9}
size-confidence: {w: estimated, h: estimated}
attrs:
  model: TM810x-48SFP+
  power-absent: not-published
  sfp-plus: 48
groups:
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      48 x 1/10GE SFP+ (TM-8104 and TM-8106 data sheets, "TM810x Expansion Module With
      48x1G/10G"). Numbered 1-48 in stacked pairs, odd above and even below, the pair's
      legend "1▲▼2" printed above the column; the card is slot 2 of the chassis, so
      the interfaces read 1/2/1 to 1/2/48 ("1/2/x" at the card's foot).
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: one arrow lamp per port in the strip between the rows, pointing at its port.
provenance:
  identity: >-
    datasheet - the TM-8104 and TM-8106 data sheets (telco.com, 2025/12) order it as
    TM810x-48SFP+ "Expansion Module With 48x1G/10G"; the 2021 T-Metro 8104 data sheets call
    it TM8104-48SFP+ / Ext-T-Metro 8104-48SFP. The face prints "48 Port Module".
  size: >-
    estimated - the NetZoom stencil master TM810x-48SFP+ (Telco-TM810x-04-30-2024.VSS) is
    142.2 x 12.95 units, 376.3 x 34.3 mm at the stencil's 1:10, and the chassis master's
    empty slot is 376.7 x 33.9; the card is drawn at the slot's size so bay and module
    agree. A stencil is a diagram symbol, not a mechanical drawing, but its column pitch
    (14.36 mm) matches the vendor's 2021 render (14.34 to 14.41 on its two undistorted
    blocks) and its 2RU face is 88.6 mm, so its scale is right to well under a percent.
  ports: >-
    estimated - each std/sfp-ganged@1 is centred on the stencil's own 13.91 x 9.68 cage
    opening: upper row y 4.21, lower 20.18, three blocks of eight columns at x 14.71,
    131.2 and 247.69 on a 14.35 pitch. The lower row is turned 180 so both rows' lips face
    the lamp strip, which is how the 2021 render shows the latches.
  lamps: >-
    photo - the 2021 render (telco.com 2021/01/8104-02.png) and the stencil both show one
    up and one down triangle per column in the strip between the rows. Their meaning is not
    documented anywhere held; common/led-arrow@1's own states stand.
  printing: >-
    photo and stencil agree on "48 Port Module" and "1/2/x" at the card's foot and on the
    per-column pair legends above it.
  power: >-
    NOT STATED. No data sheet held (2021 v14, 2021-04, 2025 TM-8104 and TM-8106) gives a
    per-module figure, only the chassis' "Max power consumption: 400W".
