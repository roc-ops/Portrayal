  inlet: c14
  input-voltage: 100-240 VAC, 50-60 Hz, 2 A (face)
provenance:
  size: >-
    estimated - the stencil master TM-7124S (F) seats this module in the upper supply bay at
    81.86 x 30.98 (bay 81.7 x 30.97); the 2025 render shows two of them stacked at the same
    place to within 2 mm.
  power: >-
    NOT STATED. The data sheets give "100-240VAC, 50/60 Hz, -48VDC, -60VDC and +24VDC nominal"
    and no supply rating; the face prints only the input, "100-240V~50-60Hz 2A".
  elements: >-
    drawing - the stencil master's own vectors: inlet surround 30.85 x 21.23 at (11.61, 1.81),
    rocker 20.14 x 14.32 at (45.17, 7.94), lamps 3.84 x 1.64 at (55.53, 4.18) and (61.49,
    4.18), thumbscrews 6.36 across at (4.68, 17.83) and (76.61, 17.83). The render agrees on
    every one; the inlet is upright (unrotated C14), as both draw it.
