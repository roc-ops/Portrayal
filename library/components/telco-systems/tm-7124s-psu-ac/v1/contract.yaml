description: >-
  The hot-swappable AC supply of the Telco Systems TM-7124S (T-Metro 7124S), ordered as
  TM-7124S-ACPS: an IEC C14 inlet, a rocker switch, AC and +12V lamps and a thumbscrew
  at each end.
