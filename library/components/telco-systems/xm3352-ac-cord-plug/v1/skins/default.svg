<svg xmlns="http://www.w3.org/2000/svg" width="22.6mm" height="20.5mm" viewBox="0 0 22.6 20.5">
  <!-- The cord connector of the XM-3352 AC supply seen from the cord side, seated: a dark moulded block at the inlet's outline and
       the cord entering its middle. Shapes and colours are estimates; no document held draws a cord connector. -->
  <rect id="body" x="0" y="0" width="22.6" height="20.5" rx="0.8" fill="#3a3d41" stroke="#1c1e21" stroke-width="0.3"/>
  <circle id="cord" cx="11.3" cy="10.3" r="3.6" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"/>
</svg>
