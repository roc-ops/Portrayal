format: 1
kind: module
name: tm810x-psu-dc
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The hot-swappable DC power supply of the Telco Systems TM-8104 and TM-8106 - the AC
  supply's face with a three-pole barrier terminal block in place of the inlet and a
  vertical pull handle beside it.
size: {w: 50.91, h: 39.43}
size-confidence: {w: estimated, h: estimated}
attrs:
  model: TM810x DC PSU
  power-absent: not-published
  input: dc
  inlet: dc-terminal
  input-voltage: 24 or -48 VDC (data sheets, "AC or DC 24/-48VDC")
provenance:
  size: >-
    estimated - the stencil's PSU face, 50.91 x 39.43 at x 5.92 and y 3.9 / 45.4 in the
    TM-8104 and TM-8106 masters, which is the face the 2021 and 2025 renders show two of,
    stacked at the chassis' front left.
  power: >-
    NOT STATED. The data sheets give "Dual redundant, hot-swappable AC or DC 24/-48VDC" and
    the chassis' "Max power consumption: 400W", never the supply's own rating, and no
    installation guide is public (support portal only; see the device gaps).
  elements: >-
    estimated - the stencil draws a lattice grille down the left edge, a vertical handle
    bar beside it, the inlet and a round latch at the foot; the 2025 render
    (2025/08/8104@2x.png) shows a silver bail handle over the lattice, which is what the
    handle node draws.
  inlet: >-
    photo - the 2022 TM-8106 front (telco.com 2022/05/8106.jpg, 1.77 px/mm) shows both
    supplies with a three-pole barrier block across the top and a dark pull handle below
    it on the right. common/dc-terminal-24@1 is placed where that image puts the block;
    at 1.77 px/mm its position is good to a millimetre or two and its model is not
    readable. No stencil master draws the DC supply. THE DC FACE IS NOT THE AC FACE WITH A
    DIFFERENT INLET: the same image shows no silver bail over its grille, and the lattice
    runs about 16 mm in from the left edge where the AC supply's stops at about 11, so
    this part draws the wider grille and no bail.
states: [absent]
elements:
  vent-field: {at: [1.0, 1.2], size: [15.9, 37.0], class: vent}
  pull: {at: [38.0, 18.0], size: [6.0, 18.5], class: handle}
parts:
  - {ref: common/dc-terminal-24@1, id: terminal, at: [18.6, 1.8]}
  - {ref: common/led-dot@1, id: led-status, at: [27.23, 34.91]}
skins: [default]
