format: 1
kind: component
name: xm3352-dc-plug
version: 1.0.0
class: inlet
behaviour: mounts
profile: networking
description: >-
  The three-pole pluggable DC terminal on the Telco Systems XM-3352's DC supply module - a green
  screw-clamp plug with a flange and clamp screw at each end and three wire entries between them.
  The poles (- and +, and a middle entry) are printed on the module above it, so the part carries
  none.
size: {w: 23.4, h: 13.9, d: 15.0}
size-confidence: {w: photo-measured, h: photo-measured, d: estimated}
attrs: {media: dc-terminal}
provenance:
  size: >-
    PHOTO-MEASURED on the XM-3352 render rectified onto 220 x 44 (about 5 px/mm): the green body
    and flanges run x 19.0-42.4, y 29.0-42.9 on the face (a colour-mask bounding box). Depth is
    estimated.
  the-face: >-
    photo-measured at the same scale: flanges with clamp screws at each end (centres about 3.0
    and 20.4 across, 5.4 down), a centre body 12.6 wide carrying three wire entries.
elements:
  body: {at: [5.0, 0.0], size: [13.4, 13.9], class: connector}
skins: [default]
