format: 1
kind: component
name: tripplite-duct-1u-end
version: 1.0.0
class: mechanical
description: >-
  The rear of the Tripp Lite SmartRack SRCABLEDUCT1U finger duct seen from either end. It draws
  the back plate with the flange it turns rearward along each edge. It draws the channel floor
  with its rounded corners and the first stretch of the two walls. It draws a round boss pressed
  out of the plate and the small stud inside the channel. It is the end-view counterpart of
  tripplite-duct-1u-base, the plate drawn edge-on.
provenance:
  size: >-
    drawing - the side view of the SRCABLEDUCT1U submittal drawing. It is read at 12.54 px per mm
    from the printed 37.57 mm clear between the walls (471 px between the wall lines). The plate is
    the 43.69 mm [1.72 in] over the ears. It stands 5.0 mm behind the plane the ears bolt to
    (top view, 62.71 mm to the plane of 67.71 overall). The flanges, 1.2 mm thick, run from the
    plate to that rear edge.
  floor: >-
    estimated - the channel floor reads 1.3 mm over the plate's 1.2 mm at the same scale.
    The rows are 786 to 803 and 803 to 818 px of the 900 dpi crop. It is drawn 1.1 mm, the wall's figure, so the
    floor and the walls are one sheet. The corner radius, 2.5 mm outside, is read off the arc.
    It is good to about 0.5 mm.
  boss: >-
    estimated - the boss behind the plate is a segment 12.4 mm across and 2.4 mm high.
    The 12.4 mm is the back view's boss (11.9 mm over its ring). The stud inside the channel
    is 5.0 mm across and 2.2 mm high. Both are centred across the part.
  color: >-
    datasheet - "Cold rolled steel with black finish"; the shade is this library's render of
    black steel, the back plate's.
size: {w: 9.7, h: 43.69}
