  <rect id="plate" x="5" y="0" width="1.2" height="43.69" fill="#3a3d41" data-fill-from="finish"/>
  <path id="floor" d="M9.7 2.5H8.75A1.9 1.9 0 0 0 6.85 4.4V39.3A1.9 1.9 0 0 0 8.75 41.2H9.7" fill="none" stroke="#4d5156" stroke-width="1.1" stroke-linejoin="round"/>
