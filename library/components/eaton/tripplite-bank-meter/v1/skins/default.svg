<svg xmlns="http://www.w3.org/2000/svg" width="21.6mm" height="31.8mm" viewBox="0 0 21.6 31.8">
  <!-- The PDUMV30 bank meter: the outline between its two screws, the readout window with two
       seven-segment digits (unlit) and the screws above and below. The segment art is drawn to the
       drawing's "88" and is not dimensioned. -->
  <circle id="screw-top" cx="10.8" cy="3.3" r="2.4" fill="#1f2022" stroke="#4a4d51" stroke-width="0.2"/>
  <circle id="screw-bottom" cx="10.8" cy="28.5" r="2.4" fill="#1f2022" stroke="#4a4d51" stroke-width="0.2"/>
  <rect id="outline" x="0.15" y="7.15" width="21.3" height="17.5" rx="0.6" fill="#2c2d2f" stroke="#3d3f42" stroke-width="0.3"/>
  <rect id="window" x="2.4" y="9.6" width="16.8" height="12.9" rx="0.4" fill="#0e0f10" stroke="#3a3c3f" stroke-width="0.25"/>
  <g id="ghost" fill="#1d211c">
    <rect x="5.4" y="11.2" width="3.6" height="0.9" rx="0.2"/>
    <rect x="4.4" y="12.1" width="1.0" height="3.9" rx="0.2"/>
    <rect x="9.0" y="12.1" width="1.0" height="3.9" rx="0.2"/>
    <rect x="5.4" y="16.0" width="3.6" height="0.9" rx="0.2"/>
    <rect x="4.4" y="16.9" width="1.0" height="3.9" rx="0.2"/>
    <rect x="9.0" y="16.9" width="1.0" height="3.9" rx="0.2"/>
    <rect x="5.4" y="20.8" width="3.6" height="0.9" rx="0.2"/>
    <rect x="12.6" y="11.2" width="3.6" height="0.9" rx="0.2"/>
    <rect x="11.6" y="12.1" width="1.0" height="3.9" rx="0.2"/>
    <rect x="16.2" y="12.1" width="1.0" height="3.9" rx="0.2"/>
    <rect x="12.6" y="16.0" width="3.6" height="0.9" rx="0.2"/>
    <rect x="11.6" y="16.9" width="1.0" height="3.9" rx="0.2"/>
    <rect x="16.2" y="16.9" width="1.0" height="3.9" rx="0.2"/>
    <rect x="12.6" y="20.8" width="3.6" height="0.9" rx="0.2"/>
  </g>
  <g id="digit-1" fill="#70be44">
    <rect data-seg="a" opacity="0" x="5.4" y="11.2" width="3.6" height="0.9" rx="0.2"/>
    <rect data-seg="f" opacity="0" x="4.4" y="12.1" width="1.0" height="3.9" rx="0.2"/>
    <rect data-seg="b" opacity="0" x="9.0" y="12.1" width="1.0" height="3.9" rx="0.2"/>
    <rect data-seg="g" opacity="0" x="5.4" y="16.0" width="3.6" height="0.9" rx="0.2"/>
    <rect data-seg="e" opacity="0" x="4.4" y="16.9" width="1.0" height="3.9" rx="0.2"/>
    <rect data-seg="c" opacity="0" x="9.0" y="16.9" width="1.0" height="3.9" rx="0.2"/>
    <rect data-seg="d" opacity="0" x="5.4" y="20.8" width="3.6" height="0.9" rx="0.2"/>
  </g>
  <g id="digit-2" fill="#70be44">
    <rect data-seg="a" opacity="0" x="12.6" y="11.2" width="3.6" height="0.9" rx="0.2"/>
    <rect data-seg="f" opacity="0" x="11.6" y="12.1" width="1.0" height="3.9" rx="0.2"/>
    <rect data-seg="b" opacity="0" x="16.2" y="12.1" width="1.0" height="3.9" rx="0.2"/>
    <rect data-seg="g" opacity="0" x="12.6" y="16.0" width="3.6" height="0.9" rx="0.2"/>
    <rect data-seg="e" opacity="0" x="11.6" y="16.9" width="1.0" height="3.9" rx="0.2"/>
    <rect data-seg="c" opacity="0" x="16.2" y="16.9" width="1.0" height="3.9" rx="0.2"/>
    <rect data-seg="d" opacity="0" x="12.6" y="20.8" width="3.6" height="0.9" rx="0.2"/>
  </g>
</svg>
