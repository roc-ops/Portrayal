format: 1
kind: component
name: tripplite-duct-1u-fingers
version: 1.0.0
class: mechanical
description: >-
  One slotted wall of the Tripp Lite SmartRack SRCABLEDUCT1U finger duct seen from the front -
  the steel wall along the top or bottom of the channel, 25 fingers end-on with a slot a cable
  is laid through between each pair. The same part at the top and at the bottom of the duct.
provenance:
  size: >-
    drawing - the top view of the SRCABLEDUCT1U submittal drawing: the wall is the 431.80 mm
    [17.00 in] of the duct, the bar between two slots is dimensioned 10 mm [.39 in] and each
    slot is read 8.0 mm wide at 2.416 px/mm off that 431.80. Its 1.1 mm is the sheet: the
    side view gives 37.57 mm [1.48 in] clear between the walls and the body 39.8 over them,
    so (39.8 - 37.57) / 2 (estimated: derived from a figure read off the picture).
  pitch: >-
    estimated - TWENTY-FOUR SLOTS COUNTED ON THE TOP VIEW, centres 1000 px apart over 23
    pitches at 2.416 px/mm, 18.0 mm (a 10 mm bar and an 8.0 mm slot); the first and last bars
    run to the ends of the duct and are 4.9 mm. The pitch is a count and a measure, not a
    dimension: no figure states it.
  relief: >-
    drawing - the top view dimensions the slot 49.78 mm [1.96 in] long, from 9.8 mm behind the
    front edge (under the cover's lip) to 3.1 mm in front of the ear plane, and the ear plane
    62.71 mm behind the front, so a slot runs from 2.93 to 52.71 above the floor of the well
    (the plate's front face, 5.2 behind the back). A bar stands from the root to the rim, the
    ends of the slots closed: the slots are punched, so a finger is held at both ends, and the
    root and the rim are the solid wall either side of the slots.
  color: >-
    datasheet - "Cold rolled steel with black finish" (the spec sheet's Highlights). The
    shade is this library's render of black steel; the bars are lighter than the root so the
    slots read as slots in a wall, and the wall reads on the dark stage as on a white one.
size: {w: 431.8, h: 1.1}
size-confidence: {w: drawing, h: estimated}
