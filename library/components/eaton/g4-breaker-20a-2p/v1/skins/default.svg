<svg xmlns="http://www.w3.org/2000/svg" width="48mm" height="60mm" viewBox="0 0 48 60">
  <!-- A G4 section breaker: the plate, its three screws, the 20 A two-pole rocker
       in its round recess and the section tile. Drawn in the drawing's frame
       (u along the PDU from the cord end, v across) and turned to the standing PDU,
       which puts the tile above the rocker and its letter reading bottom to top. -->
  <g id="plate">
    <g transform="matrix(0,-1,1,0,0,60)">
      <rect x="0" y="0" width="60" height="48" rx="2.2" fill="#232528" stroke="#3b3e42" stroke-width="0.3"/>
      <ellipse cx="24.5" cy="33.4" rx="14.0" ry="9.6" fill="#2a2d30" stroke="#3b3e42" stroke-width="0.2"/>
      <circle cx="8.9" cy="14.5" r="3.4" fill="#4d5257" stroke="#6b7076" stroke-width="0.2"/>
      <path d="M 7.2 14.5 h 3.4 M 8.9 12.8 v 3.4" stroke="#24272a" stroke-width="0.5"/>
      <circle cx="51.1" cy="14.5" r="3.4" fill="#4d5257" stroke="#6b7076" stroke-width="0.2"/>
      <path d="M 49.4 14.5 h 3.4 M 51.1 12.8 v 3.4" stroke="#24272a" stroke-width="0.5"/>
      <circle cx="8.9" cy="33.4" r="3.4" fill="#4d5257" stroke="#6b7076" stroke-width="0.2"/>
      <path d="M 7.2 33.4 h 3.4 M 8.9 31.7 v 3.4" stroke="#24272a" stroke-width="0.5"/>
      <circle cx="24.5" cy="33.4" r="7.6" fill="#141516" stroke="#3b3e42" stroke-width="0.2"/>
      <path id="tile" d="M 41.3 26.0 H 58.7 V 41.0 H 41.3 A 7.5 7.5 0 0 1 41.3 26.0 Z" fill="#f4d440" data-fill-from="section-color"/>
    </g>
    <g id="silkscreen" font-family="sans-serif" fill="#202224">
      <text x="33.5" y="18.07" font-size="12" text-anchor="middle" transform="rotate(-90 33.5 13.75)" data-from="section">A</text>
    </g>
    <rect id="rocker" x="30.6" y="29.5" width="5.6" height="12.0" rx="0.6" fill="#0b0b0c" stroke="#3b3e42" stroke-width="0.2"/>
  </g>
</svg>
