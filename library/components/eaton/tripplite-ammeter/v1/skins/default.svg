<svg xmlns="http://www.w3.org/2000/svg" width="25.3mm" height="18.55mm" viewBox="0 0 25.3 18.55">
  <!-- The two-digit load meter of a 1U Tripp Lite series PDU as PDUMH20NET_DT01
       shows it: a thin grey bezel round a black window and two seven-segment
       cells, unlit (the faint ghost segments are what an unlit cell shows). It has
       no button. LOAD (AMPS) is printed on the PDU face below it, not on the part. -->
  <rect id="bezel" x="0.15" y="0.15" width="25.0" height="18.25" rx="0.4" fill="#0b0b0b" stroke="#4b4a47" stroke-width="0.3"/>
  <rect id="window" x="0.6" y="0.55" width="24.0" height="17.5" fill="#070707"/>
  <g id="ghost" fill="#15190f">
    <rect x="4.10" y="1.75" width="6.80" height="1.60" rx="0.5"/>
    <rect x="2.70" y="2.95" width="1.60" height="6.00" rx="0.5"/>
    <rect x="10.70" y="2.95" width="1.60" height="6.00" rx="0.5"/>
    <rect x="4.10" y="8.55" width="6.80" height="1.60" rx="0.5"/>
    <rect x="2.70" y="9.75" width="1.60" height="6.00" rx="0.5"/>
    <rect x="10.70" y="9.75" width="1.60" height="6.00" rx="0.5"/>
    <rect x="4.10" y="15.35" width="6.80" height="1.60" rx="0.5"/>
    <rect x="15.20" y="1.75" width="6.80" height="1.60" rx="0.5"/>
    <rect x="13.80" y="2.95" width="1.60" height="6.00" rx="0.5"/>
    <rect x="21.80" y="2.95" width="1.60" height="6.00" rx="0.5"/>
    <rect x="15.20" y="8.55" width="6.80" height="1.60" rx="0.5"/>
    <rect x="13.80" y="9.75" width="1.60" height="6.00" rx="0.5"/>
    <rect x="21.80" y="9.75" width="1.60" height="6.00" rx="0.5"/>
    <rect x="15.20" y="15.35" width="6.80" height="1.60" rx="0.5"/>
  </g>
  <g id="digit-1" fill="#63bc46">
    <rect data-seg="a" opacity="0" x="4.10" y="1.75" width="6.80" height="1.60" rx="0.5"/>
    <rect data-seg="f" opacity="0" x="2.70" y="2.95" width="1.60" height="6.00" rx="0.5"/>
    <rect data-seg="b" opacity="0" x="10.70" y="2.95" width="1.60" height="6.00" rx="0.5"/>
    <rect data-seg="g" opacity="0" x="4.10" y="8.55" width="6.80" height="1.60" rx="0.5"/>
    <rect data-seg="e" opacity="0" x="2.70" y="9.75" width="1.60" height="6.00" rx="0.5"/>
    <rect data-seg="c" opacity="0" x="10.70" y="9.75" width="1.60" height="6.00" rx="0.5"/>
    <rect data-seg="d" opacity="0" x="4.10" y="15.35" width="6.80" height="1.60" rx="0.5"/>
  </g>
  <g id="digit-2" fill="#63bc46">
    <rect data-seg="a" opacity="0" x="15.20" y="1.75" width="6.80" height="1.60" rx="0.5"/>
    <rect data-seg="f" opacity="0" x="13.80" y="2.95" width="1.60" height="6.00" rx="0.5"/>
    <rect data-seg="b" opacity="0" x="21.80" y="2.95" width="1.60" height="6.00" rx="0.5"/>
    <rect data-seg="g" opacity="0" x="15.20" y="8.55" width="6.80" height="1.60" rx="0.5"/>
    <rect data-seg="e" opacity="0" x="13.80" y="9.75" width="1.60" height="6.00" rx="0.5"/>
    <rect data-seg="c" opacity="0" x="21.80" y="9.75" width="1.60" height="6.00" rx="0.5"/>
    <rect data-seg="d" opacity="0" x="15.20" y="15.35" width="6.80" height="1.60" rx="0.5"/>
  </g>
</svg>
