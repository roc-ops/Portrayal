format: 1
kind: component
name: tripplite-duct-1uhd-cover
version: 1.1.0
class: mechanical
behaviour: mounts
lid: true
description: >-
  The cover of the Tripp Lite SmartRack SRCABLEDUCT1UHD high capacity finger duct, seen from the
  front - a steel plate across the whole front of the channel with a lip folded back over the
  front of the top wall and of the bottom wall. It ships fitted and lifts off.
provenance:
  size: >-
    estimated - the cover is the width of the duct (431.8 mm, as the SRCABLEDUCT1U's) and the
    51.82 mm height of the unit over its lips, a lip 1.1 mm thick outside each wall. No
    document dimensions the part.
  relief: >-
    estimated - the cover takes the front 12.0 mm as the lip over each wall, a stand-in: the
    spec sheet's photograph shows a deep front plate and gives no reach. It stands in the well, so
    its plate lies 112.06 to 113.16 above the floor and its lips 101.16 to 113.16.
  lid: >-
    datasheet - the spec sheet calls it a "finger duct with dual-hinge cover" and its photographs
    show a front plate on hinges. THE FORMAT HAS NO HINGE, AND NONE IS INVENTED: the dual-hinge
    cover is a lid that lifts off, drawn as one plate (`lid: true`), and the hinges are a gap.
  tabs: >-
    estimated - FOUR TABS AND A LABEL PLATE READ ON THE MAKER'S 500 px PHOTOGRAPH, counted twice.
    There are four ribbed rectangles on the cover's face, two high and two low. The first two are on
    the left and the other two on the right. A plate in the middle carries the maker's mark.
    Their sizes are read off the picture by one method. The ten rim specks fix a perspective term.
    The cover's two end edges fix the rest. The cover's top and bottom edge fix the height as a
    fraction of its 51.82. Each figure is rounded to 1 mm and good to about 6 mm.
    The first tab has a bright strap across its top, 2.5 mm of which is drawn.
    The ribbing and any rise of the tabs off the plate are not drawn: the picture gives them too few pixels.
    The maker's mark on the plate is not drawn: the maintainer has left marks, colours and the rest to a later touch.
    The notch at the cover's left end is not drawn. The 500 px photograph is oblique.
    Its corner cut is 3 x 2 px (about 3.5 x 2.3 mm). The step beside it is 3 x 6 px (about 3.5 x 7 mm).
    Each is under 4 px across, and the sheet's front picture gives under one pixel. The pull request asks the maintainer.
  color: >-
    datasheet - "Cold rolled steel with black finish". The shade is this library's render of
    black steel, a little lighter than the walls so the cover reads apart from them, and its
    top lip lighter again so the part has an edge on the explorer's dark stage. The tabs are a
    little darker than the plate, as the photograph shows them, and the label plate darker again.
size: {w: 431.8, h: 51.82}
