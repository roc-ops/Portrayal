<svg xmlns="http://www.w3.org/2000/svg" width="431.8mm" height="51.82mm" viewBox="0 0 431.8 51.82">
  <!-- the cover from the front: one steel plate across the channel, and the
       edges of the two lips that fold back over the walls, the top one lit.
       On the plate: four tabs, two high and two low, the strap lying over the top
       of the first, and the label plate in the middle -->
  <rect id="plate" x="0" y="0" width="431.8" height="51.82" rx="0.6" fill="#55595e" data-fill-from="finish"/>
  <rect id="lip-top" x="0" y="0" width="431.8" height="1.1" fill="#6b7076"/>
  <rect id="lip-bottom" x="0" y="50.72" width="431.8" height="1.1" fill="#464a4f"/>
  <rect id="tab-1" x="72" y="3" width="24" height="24" rx="0.6" fill="#44484d"/>
  <rect id="tab-1-strap" x="70" y="0" width="23" height="2.5" fill="#9aa0a6"/>
  <rect id="tab-2" x="116" y="30" width="21" height="21.82" rx="0.6" fill="#44484d"/>
  <rect id="tab-3" x="291" y="28" width="19" height="22" rx="0.6" fill="#44484d"/>
  <rect id="tab-4" x="335" y="2" width="24" height="24" rx="0.6" fill="#44484d"/>
  <rect id="label" x="204" y="9" width="36" height="38.6" rx="0.6" fill="#202326"/>
</svg>
