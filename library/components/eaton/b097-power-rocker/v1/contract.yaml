format: 1
kind: component
name: b097-power-rocker
version: 1.0.0
class: button
profile: networking
description: >-
  The small rocker power switch above each AC inlet on the rear of an Eaton Tripp Lite series B097 console
  server. It is printed with a circle at its left end and a bar at its right. Drawn from one photograph.
size: {w: 16.5, h: 5.6}
size-confidence: {w: estimated, h: estimated}
provenance:
  size: >-
    estimated - read off the straight-on rear photograph of the B097-048 on the maker's product page (1000 pixels
    across), where the rocker's bezel reads about 30 px by 10 px and the 13.97 mm pitch of the serial jacks
    beside it reads 24.7 px. No document dimensions the switch. The shape follows perle/scg-power-rocker@1,
    which is the same small switch with the same marks, and the common 21 x 15 snap-in rocker is much larger,
    so that part is not used.
  marks: >-
    photograph - a circle at the left end and a bar at the right, as printed. Which end is on is not stated by
    any document held, so the part draws the rocker at rest and no state.
  models: >-
    The B097-016 rear photograph shows the same switch above each inlet; that device does not place it.
elements:
  rocker: {at: [0.8, 0.8], size: [14.9, 4.0], class: button}
skins: [default]
