<svg xmlns="http://www.w3.org/2000/svg" width="12mm" height="55.12mm" viewBox="0 0 12 55.12">
  <!-- the cover from the end: the plate on edge at the front (right) and the two
       lips running back over the walls -->
  <rect id="lip-top" x="0" y="0" width="12" height="1.1" fill="#ffd84a" stroke="#947600" stroke-width="0.15"/>
  <rect id="lip-bottom" x="0" y="54.02" width="12" height="1.1" fill="#c99e00" stroke="#947600" stroke-width="0.15"/>
  <rect id="plate" x="10.9" y="0" width="1.1" height="55.12" fill="#f2c200" stroke="#947600" stroke-width="0.15" data-fill-from="finish" data-stroke-derive="finish"/>
</svg>
