<svg xmlns="http://www.w3.org/2000/svg" width="12mm" height="11.8mm" viewBox="0 0 12 11.8">
  <!-- A G3 navigation button, ESC: a black square with a raised rim and the word ESC. -->
  <rect id="cap" x="0.15" y="0.15" width="11.7" height="11.5" rx="1.6" fill="#0b0b0c" stroke="#5a5a5d" stroke-width="0.3"/>
  <rect x="1.2" y="1.2" width="9.6" height="9.4" rx="1.2" fill="#4aa4de" stroke="#3a3a3d" stroke-width="0.25"/>
  <g id="silkscreen" font-family="sans-serif" font-weight="bold" fill="#ffffff">
    <text x="6" y="7.1" font-size="3.4" text-anchor="middle">ESC</text>
  </g>
</svg>
