<svg xmlns="http://www.w3.org/2000/svg" width="19.4mm" height="27mm" viewBox="0 0 19.4 27">
  <!-- The L5-30P input cord leaving the foot of a Tripp Lite series PDUMV30: the rounded strain
       relief as an outer loop and an inner opening, and the cord's cut end. -->
  <rect id="relief" x="0.15" y="0.15" width="19.1" height="26.7" rx="9.5" fill="#1d1e20" stroke="#4a4946" stroke-width="0.3"/>
  <rect x="3.4" y="3.4" width="12.6" height="20.2" rx="6.3" fill="#121212" stroke="#3a3936" stroke-width="0.3"/>
  <circle id="cord" cx="9.7" cy="13.5" r="4.4" fill="#0a0a0a" stroke="#3c3b38" stroke-width="0.3"/>
</svg>
