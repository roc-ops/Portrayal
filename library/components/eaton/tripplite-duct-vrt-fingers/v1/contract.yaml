format: 1
kind: component
name: tripplite-duct-vrt-fingers
version: 1.0.0
class: mechanical
description: >-
  One slotted wall of the Tripp Lite SmartRack SRCABLEDUCTVRT vertical finger duct seen from the front -
  the steel wall down the left or right of the channel, 49 bars end-on with a slot a cable is laid
  through between each pair. The same part on the left and on the right.
provenance:
  size: >-
    drawing - the side view of the SRCABLEDUCTVRT submittal drawing (13-03-167, page 2): the wall
    is the 862.6 mm [33.96 in] of the duct. Its 1.1 mm is the sheet, estimated: the end view
    draws a wall of about that gauge and no view dimensions it.
  pitch: >-
    drawing for the pitch, counted for the number - the side view dimensions the pitch 18 mm
    [.71 in]; 48 slots are counted on it (96 slot edges at 2.25 px/mm, the scale that the 18 mm
    gives). The slot, 8 mm wide, and the 3.1 mm from the top end to the first slot
    are read off the picture (estimated), so the bar between two slots is 10 and
    the bar at the foot 5.5.
  relief: >-
    drawing - the side view dimensions a slot 44.99 mm [1.77 in] long and the part 62.71 mm
    [2.47 in] from the plate to the cover. The slot starts about 10 mm from the back
    (estimated: read at 2.25 px/mm) and so ends 54.99 mm from it, under the cover's
    lip. A bar stands from the root to the rim; the slots are punched, closed at both ends, so
    a bar is held at both ends and no tip is free.
  color: >-
    datasheet - "Cold rolled steel" and "Color: Black". The shade is this library's render of
    black steel; the bars are lighter than the root so the slots read as slots in a wall.
