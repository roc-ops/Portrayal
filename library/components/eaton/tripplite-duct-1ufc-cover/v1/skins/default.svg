<svg xmlns="http://www.w3.org/2000/svg" width="431.8mm" height="55.12mm" viewBox="0 0 431.8 55.12">
  <!-- the cover from the front: one steel plate across the channel (the finish
       field, outlined in a fixed shade of it), and the edges of the two lips
       that fold back over the walls, the top one lit -->
  <rect id="plate" x="0" y="0" width="431.8" height="55.12" rx="0.6" fill="#f2c200" stroke="#947600" stroke-width="0.3" data-fill-from="finish" data-stroke-derive="finish"/>
  <rect id="lip-top" x="0" y="0" width="431.8" height="1.1" fill="#ffd84a"/>
  <rect id="lip-bottom" x="0" y="54.02" width="431.8" height="1.1" fill="#c99e00"/>
</svg>
