<svg xmlns="http://www.w3.org/2000/svg" width="24.7mm" height="24.7mm" viewBox="0 0 24.7 24.7">
  <!-- A Tripp Lite series toolless mounting button seen from behind the PDU: the base
       plate, the 17.67 head that enters the rack's button-mount slot, and the bright
       washer and screw that hold it on. The washer and screw are drawn inside `head`
       so they ride on its face in 3D rather than under it. -->
  <circle id="base" cx="12.35" cy="12.35" r="12.3" fill="#26282b" stroke="#3a3d41" stroke-width="0.2"/>
  <g id="head">
    <circle cx="12.35" cy="12.35" r="8.835" fill="#18191b" stroke="#3a3d41" stroke-width="0.2"/>
    <circle id="washer" cx="12.35" cy="12.35" r="4.0" fill="#b9bec4" stroke="#7b8187" stroke-width="0.15"/>
    <circle cx="12.35" cy="12.35" r="1.6" fill="#8d9298"/>
    <path d="M 11.35 12.35 H 13.35 M 12.35 11.35 V 13.35" stroke="#4a4e53" stroke-width="0.35"/>
  </g>
</svg>
