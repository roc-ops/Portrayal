<svg xmlns="http://www.w3.org/2000/svg" width="21.5mm" height="18.7mm" viewBox="0 0 21.5 18.7">
  <!-- The L5-20P input cord leaving the end of an ePDU G3 basic strip: the black strain-relief
       bushing, an oval round the cord, and the cord's cut end. -->
  <rect id="bushing" x="0.15" y="0.15" width="21.2" height="18.4" rx="6.5" fill="#121212" stroke="#4a4946" stroke-width="0.3"/>
  <circle id="cord" cx="10.75" cy="9.35" r="5.6" fill="#0a0a0a" stroke="#3c3b38" stroke-width="0.3"/>
</svg>
