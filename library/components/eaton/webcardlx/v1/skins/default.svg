<svg xmlns="http://www.w3.org/2000/svg" width="85.8mm" height="29.1mm" viewBox="0 0 85.8 29.1">
  <!-- The WEBCARDLX faceplate as PDUMH20NET_DT01 shows it: a black plate with a
       screw tab at its lower left and its upper right, the RJ45's metal shield,
       the USB-A's metal shell, two Phillips screws and the CONSOLE and STATUS
       legends. The ports, the reset hole and the status lamp are composed parts. -->
  <path id="faceplate" d="M 9.6 0 H 84.8 A 1.0 1.0 0 0 1 85.8 1.0 V 7.4 A 1.0 1.0 0 0 1 84.8 8.4 H 77.4 A 1.0 1.0 0 0 0 76.4 9.4 V 28.1 A 1.0 1.0 0 0 1 75.4 29.1 H 1.0 A 1.0 1.0 0 0 1 0 28.1 V 19.6 A 1.0 1.0 0 0 1 1.0 18.6 H 8.1 A 1.0 1.0 0 0 0 9.1 17.6 V 0.5 A 0.5 0.5 0 0 1 9.6 0 Z" fill="#212020" stroke="#3b3a38" stroke-width="0.3"/>
  <rect id="rj45-shield" x="23.9" y="7.6" width="19.2" height="14.4" rx="0.3" fill="#a9acae" stroke="#6d7174" stroke-width="0.2"/>
  <rect id="usb-shell" x="58.9" y="6.4" width="6.8" height="14.8" rx="0.4" fill="#b8bbbe" stroke="#6d7174" stroke-width="0.2"/>
  <g id="screws">
    <circle cx="4.4" cy="23.8" r="2.2" fill="#2b2b2a" stroke="#4a4a48" stroke-width="0.2"/>
    <path d="M 3.2 23.8 H 5.6 M 4.4 22.6 V 25.0" stroke="#0e0e0d" stroke-width="0.5"/>
    <circle cx="82.0" cy="3.6" r="2.2" fill="#2b2b2a" stroke="#4a4a48" stroke-width="0.2"/>
    <path d="M 80.8 3.6 H 83.2 M 82.0 2.4 V 4.8" stroke="#0e0e0d" stroke-width="0.5"/>
  </g>
  <g id="silkscreen" fill="#fefefe" font-family="Helvetica, Arial, sans-serif" font-weight="bold">
    <text x="49.7" y="27.5" font-size="2.6" text-anchor="middle">CONSOLE</text>
    <text x="62.0" y="27.5" font-size="2.6" text-anchor="middle">STATUS</text>
  </g>
</svg>
