<svg xmlns="http://www.w3.org/2000/svg" width="9.8mm" height="42mm" viewBox="0 0 9.8 42">
  <!-- the cover from the end, depth running left (rear) to right (front): the plate on edge at the front,
       and on each side the wall sheet, the cover's return lip that hooks back toward it, the snap tongue
       between them and the small beak where the cover starts. The lip and the tongue are the maker's bend,
       an S curve, drawn with curve segments through the pixel points read off the side view.
       The upper side is drawn once and mirrored. -->
  <g id="upper">
    <path id="lip-top" d="M0 1.65H8.3" fill="none" stroke="#565b61" stroke-width="1.1"/>
    <path id="return-lip-top" d="M8.28 7.24H3.4C2.7 7.24 2.2 7.1 1.7 6.7C1.1 6.25 0.7 5.7 0.43 5.2C0.2 4.8 0.05 4.5 0 4.13" fill="none" stroke="#6b7076" stroke-width="1.0" stroke-linejoin="round"/>
    <path id="tongue-top" d="M7.29 2.38Q8.09 2.7 8.09 3.33V5.33C8.09 5.8 7.6 6.12 6.97 6.12C5.9 6.12 5.2 5.33 4.26 5.33C3.4 5.33 2.9 6.12 2.26 6.12L2.02 5.41C2.6 4.8 3.46 4.6 3.46 4.13V2.38Z" fill="#464a4f"/>
    <polygon id="beak-top" points="0.45,1.1 0,0.65 0,1.6" fill="#565b61"/>
  </g>
  <g id="lower" transform="translate(0 42) scale(1 -1)">
    <path id="lip-bottom" d="M0 1.65H8.3" fill="none" stroke="#464a4f" stroke-width="1.1"/>
    <path id="return-lip-bottom" d="M8.28 7.24H3.4C2.7 7.24 2.2 7.1 1.7 6.7C1.1 6.25 0.7 5.7 0.43 5.2C0.2 4.8 0.05 4.5 0 4.13" fill="none" stroke="#585d63" stroke-width="1.0" stroke-linejoin="round"/>
    <path id="tongue-bottom" d="M7.29 2.38Q8.09 2.7 8.09 3.33V5.33C8.09 5.8 7.6 6.12 6.97 6.12C5.9 6.12 5.2 5.33 4.26 5.33C3.4 5.33 2.9 6.12 2.26 6.12L2.02 5.41C2.6 4.8 3.46 4.6 3.46 4.13V2.38Z" fill="#3a3d41"/>
    <polygon id="beak-bottom" points="0.45,1.1 0,0.65 0,1.6" fill="#464a4f"/>
  </g>
  <rect id="plate" x="8.28" y="1.1" width="1.52" height="39.8" fill="#55595e" data-fill-from="finish"/>
</svg>
