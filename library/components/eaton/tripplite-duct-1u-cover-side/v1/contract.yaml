    outside each wall, estimated). The plate's thickness, 1.1 mm, is the wall's: no view
    dimensions the cover section.
  color: >-
    datasheet - "Cold rolled steel with black finish"; the shade is this library's render, the
    cover's.
size: {w: 9.8, h: 42.0}
