description: >-
  The cover of the Tripp Lite SmartRack SRCABLEDUCT1U finger duct seen from either end - the
  plate edge-on across the front and the two lips folded back over the walls, 9.8 mm deep.
  The same cover as tripplite-duct-1u-cover, drawn on the side views: it comes off with it.
provenance:
  size: >-
    drawing - the SRCABLEDUCT1U submittal drawing: the lips run 9.8 mm back from the front edge
