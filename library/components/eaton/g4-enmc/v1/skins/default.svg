<svg xmlns="http://www.w3.org/2000/svg" width="49.15mm" height="187.9mm" viewBox="0 0 49.15 187.9">
  <!-- The G4 network module (eNMC) faceplate, as 9001-22301 draws it and the
       EVMI2130X_DT5 photograph shows it. Art printed for the module lying down is
       drawn in the drawing's frame (u along the PDU from the cord end, v across)
       and turned by the group transform; the parts, the lamps, the LCD and the four
       keys are in the standing frame. -->
  <rect id="faceplate" x="0" y="0" width="49.15" height="187.9" rx="1.0" fill="#18191b" stroke="#3a3d41" stroke-width="0.25"/>
  <rect x="0.6" y="3.5" width="47.95" height="180.9" rx="7" fill="#212326" stroke="#34373b" stroke-width="0.2"/>
  <g transform="matrix(0,-1,1,0,0,187.9)">
    <circle cx="9.55" cy="24.55" r="3.0" fill="#4d5257" stroke="#6b7076" stroke-width="0.2"/>
    <path d="M 8.05 24.55 h 3 M 9.55 23.05 v 3" stroke="#24272a" stroke-width="0.45"/>
    <circle cx="177.35" cy="24.55" r="3.0" fill="#4d5257" stroke="#6b7076" stroke-width="0.2"/>
    <path d="M 175.85 24.55 h 3 M 177.35 23.05 v 3" stroke="#24272a" stroke-width="0.45"/>
    <g id="icons-silkscreen" font-family="sans-serif" fill="#c9ccd0">
      <path d="M 26.35 14.85 V 17.85 M 27.95 14.85 V 17.85" stroke="#c9ccd0" stroke-width="0.3" fill="none"/>
      <path d="M 26.35 14.05 l -0.6 0.9 h 1.2 z M 27.95 18.65 l -0.6 -0.9 h 1.2 z" fill="#c9ccd0"/>
      <circle cx="27.15" cy="34.55" r="0.8" fill="none" stroke="#c9ccd0" stroke-width="0.25"/>
      <path d="M 27.15 31.15 V 33.75" stroke="#c9ccd0" stroke-width="0.5"/>
      <path d="M 49.05 8.95 h 1.4 v 0.9 h -1.4 z M 48.15 10.75 h 1.2 v 0.8 h -1.2 z M 50.15 10.75 h 1.2 v 0.8 h -1.2 z M 49.75 9.85 v 0.8 M 48.75 10.45 h 2.4" fill="none" stroke="#c9ccd0" stroke-width="0.2"/>
      <path d="M 49.05 36.95 h 1.4 v 0.9 h -1.4 z M 48.15 38.75 h 1.2 v 0.8 h -1.2 z M 50.15 38.75 h 1.2 v 0.8 h -1.2 z M 49.75 37.85 v 0.8 M 48.75 38.45 h 2.4" fill="none" stroke="#c9ccd0" stroke-width="0.2"/>
      <path d="M 94.25 11.15 h 2.8 v 1.8 h -2.8 z M 93.75 13.25 h 3.8" fill="none" stroke="#c9ccd0" stroke-width="0.2"/>
    </g>
    <g id="keys-silkscreen">
    <path d="M 150.7 14.1 L 146.3 17.1 L 150.7 20.1" fill="none" stroke="#c9ccd0" stroke-width="0.4"/>
    <path d="M 160.8 14.1 L 165.2 17.1 L 160.8 20.1" fill="none" stroke="#c9ccd0" stroke-width="0.4"/>
    <path d="M 165.6 30.3 V 32.7 H 160.6 M 160.4 32.7 l 1.1 -0.9 v 1.8 z" fill="none" stroke="#c9ccd0" stroke-width="0.4"/>
    </g>
  </g>
  <g id="standing-silkscreen" font-family="sans-serif" fill="#c9ccd0">
    <text x="6.25" y="155.89" font-size="2.6" text-anchor="middle" transform="rotate(-90 6.25 154.95)">PDU+1</text>
    <text x="43.55" y="154.79" font-size="2.6" text-anchor="middle" transform="rotate(-90 43.55 153.85)">SENSOR</text>
    <text x="15.05" y="139.09" font-size="2.6" text-anchor="middle" transform="rotate(-90 15.05 138.15)">0</text>
    <text x="33.05" y="139.09" font-size="2.6" text-anchor="middle" transform="rotate(-90 33.05 138.15)">1</text>
    <text x="8.15" y="101.19" font-size="2.2" text-anchor="middle" transform="rotate(-90 8.15 100.4)">USB/0</text>
    <text x="41.15" y="101.19" font-size="2.2" text-anchor="middle" transform="rotate(-90 41.15 100.4)">USB/1</text>
    <text x="24.55" y="102.43" font-size="6.6" text-anchor="middle" transform="rotate(-90 24.55 100.05)" font-weight="bold">EATON</text>
    <text x="31.9" y="40.48" font-size="3" text-anchor="middle" transform="rotate(-90 31.9 39.4)">ESC</text>
    <text x="24.15" y="137.15" font-size="1.9" text-anchor="middle">10/100/1Gb</text>
    <text x="24.15" y="166.95" font-size="1.9" text-anchor="middle">RESTART</text>
  </g>
  <rect id="lcd" x="8.95" y="52.15" width="31.1" height="30.9" fill="#2b4a99" stroke="#4a4d51" stroke-width="0.3"/>
  <rect id="key-up" x="10.95" y="18.75" width="12.3" height="12.3" rx="3" fill="none" stroke="#6b7076" stroke-width="0.3"/>
  <rect id="key-enter" x="25.75" y="18.75" width="12.3" height="12.3" rx="3" fill="none" stroke="#6b7076" stroke-width="0.3"/>
  <rect id="key-down" x="10.95" y="33.25" width="12.3" height="12.3" rx="3" fill="none" stroke="#6b7076" stroke-width="0.3"/>
  <rect id="key-esc" x="25.75" y="33.25" width="12.3" height="12.3" rx="3" fill="none" stroke="#6b7076" stroke-width="0.3"/>
</svg>
