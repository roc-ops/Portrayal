<svg xmlns="http://www.w3.org/2000/svg" width="30.4mm" height="22mm" viewBox="0 0 30.4 22">
  <!-- Eaton G4 C13 outlet as drawn on 9001-22301: the recess a C14 plug's shroud
       enters, the C13 nose standing in it and its three contact slots. Drawn in
       the drawing's frame and turned to the standing PDU by the group transform. -->
  <g id="outlet" transform="matrix(0,-1,1,0,0,22)">
    <path id="recess" d="M 5.5 0 H 16.6 L 22 5.4 V 25.0 L 16.6 30.4 H 5.5 A 5.5 5.5 0 0 1 0 24.9 V 5.5 A 5.5 5.5 0 0 1 5.5 0 Z" fill="#0f1011" stroke="#3a3c3f" stroke-width="0.25"/>
    <path id="nose" d="M 6.86 3.7 H 14.56 L 19.06 8.2 V 22.1 L 14.56 26.6 H 6.86 A 3.5 3.5 0 0 1 3.36 23.1 V 7.2 A 3.5 3.5 0 0 1 6.86 3.7 Z" fill="#242628" stroke="#45484c" stroke-width="0.2"/>
    <rect x="6.06" y="6.4" width="6.2" height="3.6" rx="0.3" fill="#030303"/>
    <rect x="6.06" y="20.4" width="6.2" height="3.6" rx="0.3" fill="#030303"/>
    <rect x="10.06" y="13.4" width="6.2" height="3.6" rx="0.3" fill="#030303"/>
  </g>
</svg>
