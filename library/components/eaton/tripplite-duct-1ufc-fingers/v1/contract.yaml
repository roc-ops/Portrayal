format: 1
kind: component
name: tripplite-duct-1ufc-fingers
version: 1.0.0
class: mechanical
description: >-
  One slotted wall of the Tripp Lite SmartRack SRCABLEDUCT1UFC yellow finger duct seen from the
  front - the steel wall along the top or bottom of the channel, 25 fingers end-on with a slot
  a fibre, copper or coax cable is laid through between each pair. The same part at the top
  and at the bottom of the duct ("fingers on either side").
provenance:
  size: >-
    estimated - NO DOCUMENT DIMENSIONS THE FINGERS. The wall is taken as the 431.8 mm duct of the
    maker's SRCABLEDUCT1U between ears 31.5 mm wide (494.79 less 431.8, shared) - the ear width
    is not stated; its 1.1 mm is that part's sheet.
  pitch: >-
    estimated - TWENTY-FOUR SLOTS COUNTED on the maker's photograph of the duct (the slots in its
    top wall, perspective view), which on 431.8 mm is the 18.0 pitch of the SRCABLEDUCT1U's
    drawing, drawn as an 8.0 mm slot between 10.0 mm bars with the end bars 4.9. The count is the
    only reading here; the slot width is by eye and is that drawing's.
  relief: >-
    estimated - a slot runs from 8.0 mm in front of the back plate to 12.0 mm behind the front,
    under the cover, closed at both ends; so it runs 2.8 to 87.7 above the floor of the well (5.2
    behind the back) in the 104.9 mm overall. The 12.0 mm cover reach is a stand-in: no
    document gives it.
  color: >-
    datasheet - "Color: Yellow" and "high-visibility yellow steel". The bars take the finish
    field; the root and the rim are fixed shades of yellow so the slots read as slots punched in
    a wall.
