<svg xmlns="http://www.w3.org/2000/svg" width="37.1mm" height="37.1mm" viewBox="0 0 37.1 37.1">
  <!-- The cord gland of an ePDU G3 managed strip seen from the cord end: a ring, a disc with
       a serrated top edge, four small rectangles across its lower half and a key notch. -->
  <circle id="gland" cx="18.55" cy="18.55" r="18.4" fill="#1a1a19" stroke="#4a4946" stroke-width="0.3"/>
  <circle id="disc" cx="18.55" cy="18.55" r="15.25" fill="#0a0a0a" stroke="#3c3b38" stroke-width="0.3"/>
  <path id="serration" d="M 11.0 5.9 A 15.25 15.25 0 0 1 26.1 5.9" fill="none" stroke="#6a6862" stroke-width="0.7" stroke-dasharray="0.35 0.35"/>
  <path id="notch" d="M 17.2 33.7 H 19.9 V 32.4 H 17.2 Z" fill="#3c3b38"/>
  <g id="conductors" fill="#0a0a0a" stroke="#6a6862" stroke-width="0.3">
    <rect x="3.9" y="18.1" width="2.7" height="6.0" rx="0.2"/>
    <rect x="11.1" y="18.1" width="2.7" height="6.0" rx="0.2"/>
    <rect x="18.3" y="18.1" width="2.7" height="6.0" rx="0.2"/>
    <rect x="27.1" y="18.1" width="2.7" height="6.0" rx="0.2"/>
  </g>
</svg>
