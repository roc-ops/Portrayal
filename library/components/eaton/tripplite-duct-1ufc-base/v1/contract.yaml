format: 1
kind: component
name: tripplite-duct-1ufc-base
version: 1.0.0
class: mechanical
description: >-
  The back plate of the Tripp Lite SmartRack SRCABLEDUCT1UFC yellow finger duct seen from the
  front, with the ears that are its two ends - drawn as the well the two finger walls stand in,
  its floor the front face of the steel plate, open at the two pass-through windows in the rear
provenance:
  size: >-
    datasheet for the overall - the spec sheet's unit size is printed as "4.130 x 2.170 x
    19.480" in (hwd) and "10.490 x 5.511 x 49.50" cm: the axes are out of order (19.48 in, 49.5
    cm is the width). The width is 494.79 mm (19.48 in) and, the part being 1U, the height is
    the 2.170 in (55.12 mm) and the depth the 4.130 in (104.9 mm); 4.13 in cannot be the height of a
    1U part (see the device's `size-conflict`). No document states where the ears end.
  size-holes: >-
    estimated - no document draws the ears or the rear. The ear slots stand where an EIA-310
    ear's holes stand, 465 mm between hole centres (14.9 mm from the end of this 494.79 mm
    plate) and 32 mm apart, at the 12 x 6 mm the SRCABLEDUCT1U's drawing gives its own. The
    two rear windows are read off the maker's picture of the back, at 0.126 to 0.374 of the
    plate's length from either end and about half its height: 122.7 x 22 mm each, by eye on
    a perspective view.
  depth: >-
    datasheet for the overall - 4.130 in, 104.9 mm. The back plate is taken to stand 5.0 mm
    behind the plane of the ears and the well to run from the front to 0.2 mm in front of the
    plate's face: 104.9 less 5.2, 99.7 (estimated: no document states it).
  color: >-
    datasheet - "Color: Yellow" and "high-visibility yellow steel". The finish is a field
    (`finish`) set by the device's configuration; the yellow here, #f2c200, is this library's
    render of it, an estimate with no sampled value behind it. The outline follows the finish as a
    shade, so a yellow plate reads on a white stage as well as on the dark one.
size: {w: 494.79, h: 55.12, d: 99.7}
size-confidence: {w: datasheet, h: datasheet, d: estimated}
fields:
  finish:
    label: Finish
    type: text
    default: '#f2c200'
relief: {wall: '#d4a900'}
elements:
  floor: {at: [0.0, 0.0], size: [494.79, 55.12], class: bezel}
skins: [default]
