format: 1
kind: component
name: tripplite-duct-1u-cover-plan
version: 1.0.0
class: mechanical
description: >-
  The cover of the Tripp Lite SmartRack SRCABLEDUCT1U finger duct seen from above or below -
  the lip along the front 9.8 mm of the top wall or of the bottom wall. The same cover as
  tripplite-duct-1u-cover, drawn on the plan and the underside: it comes off with it.
provenance:
  size: >-
    drawing - the top view of the SRCABLEDUCT1U submittal drawing: the cover is 431.80 mm
    [17.00 in] across and its lip reads 23 px at 2.344 px/mm, 9.8 mm from the front edge to
    where the slots begin (the drawing's 49.78 mm slot ends on it).
  color: >-
    datasheet - "Cold rolled steel with black finish"; the shade is this library's render, the
    cover's, lighter than the wall it lies on.
size: {w: 431.8, h: 9.8}
size-confidence: {w: drawing, h: drawing}
attrs: {material: Cold rolled steel}
fields:
  finish:
    label: Finish
    type: text
    default: '#55595e'
elements:
  lip: {at: [0.0, 0.0], size: [431.8, 9.8], class: bezel}
skins: [default]
