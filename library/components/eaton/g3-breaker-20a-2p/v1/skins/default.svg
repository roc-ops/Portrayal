<svg xmlns="http://www.w3.org/2000/svg" width="59.2mm" height="31.1mm" viewBox="0 0 59.2 31.1">
  <!-- A G3 section breaker, two poles: two mounting screws above the plate, the
       plate with its small screw, the round handle and the section tile. -->
  <g id="screws">
    <circle cx="8.5" cy="2.7" r="2.5" fill="#4d5257" stroke="#6b7076" stroke-width="0.2"/>
    <path d="M 6.6 2.7 h 3.8 M 8.5 0.8 v 3.8" stroke="#24272a" stroke-width="0.4"/>
    <circle cx="50.7" cy="2.7" r="2.5" fill="#4d5257" stroke="#6b7076" stroke-width="0.2"/>
    <path d="M 48.8 2.7 h 3.8 M 50.7 0.8 v 3.8" stroke="#24272a" stroke-width="0.4"/>
  </g>
  <g id="plate" transform="translate(0 11.7)">
    <rect x="0.15" y="0.15" width="58.9" height="19.1" rx="0.8" fill="#232528" stroke="#3b3e42" stroke-width="0.3"/>
    <circle cx="8.2" cy="9.7" r="2.2" fill="#4d5257" stroke="#6b7076" stroke-width="0.2"/>
    <path d="M 6.7 9.7 h 3 M 8.2 8.2 v 3" stroke="#24272a" stroke-width="0.4"/>
    <circle id="handle" cx="24.2" cy="9.7" r="8.1" fill="#b8b2a4" stroke="#5a5d61" stroke-width="0.3"/>
    <path d="M 17.2 9.7 H 31.2" stroke="#7d786c" stroke-width="0.8"/>
    <path id="tile" d="M 41.5 1.8 H 59.0 V 17.6 H 41.5 A 8.0 8.0 0 0 1 41.5 1.8 Z" fill="#f4d440" data-fill-from="section-color"/>
  </g>
  <g id="silkscreen" font-family="sans-serif" fill="#202224">
    <text x="49.8" y="25.9" font-size="12" text-anchor="middle" data-from="section">A</text>
  </g>
</svg>
