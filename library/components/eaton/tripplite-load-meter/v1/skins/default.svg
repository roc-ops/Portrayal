<svg xmlns="http://www.w3.org/2000/svg" width="48.2mm" height="30.3mm" viewBox="0 0 48.2 30.3">
  <!-- The Tripp Lite series 20 A load meter as the standing PDU shows it: the outline the
       submittal drawing gives it, the readout window with two seven-segment digits and
       their decimal points (unlit; the faint ghost segments are what DT02 shows of an
       unlit cell), and the Select / Rotate button. -->
  <rect id="outline" x="0.15" y="0.15" width="47.9" height="30.0" rx="0.6" fill="#2c2d2f" stroke="#3d3f42" stroke-width="0.3"/>
  <rect id="window" x="13.7" y="3.1" width="20.6" height="16.9" rx="0.4" fill="#0e0f10" stroke="#3a3c3f" stroke-width="0.25"/>
  <g id="ghost" fill="#1d211c">
    <rect x="17.10" y="5.80" width="4.80" height="1.10" rx="0.25"/>
    <rect x="16.00" y="6.90" width="1.10" height="4.10" rx="0.25"/>
    <rect x="21.90" y="6.90" width="1.10" height="4.10" rx="0.25"/>
    <rect x="17.10" y="11.00" width="4.80" height="1.10" rx="0.25"/>
    <rect x="16.00" y="12.10" width="1.10" height="4.10" rx="0.25"/>
    <rect x="21.90" y="12.10" width="1.10" height="4.10" rx="0.25"/>
    <rect x="17.10" y="16.20" width="4.80" height="1.10" rx="0.25"/>
    <rect x="26.10" y="5.80" width="4.80" height="1.10" rx="0.25"/>
    <rect x="25.00" y="6.90" width="1.10" height="4.10" rx="0.25"/>
    <rect x="30.90" y="6.90" width="1.10" height="4.10" rx="0.25"/>
    <rect x="26.10" y="11.00" width="4.80" height="1.10" rx="0.25"/>
    <rect x="25.00" y="12.10" width="1.10" height="4.10" rx="0.25"/>
    <rect x="30.90" y="12.10" width="1.10" height="4.10" rx="0.25"/>
    <rect x="26.10" y="16.20" width="4.80" height="1.10" rx="0.25"/>
  </g>
  <g id="digit-1" fill="#70be44">
    <rect data-seg="a" opacity="0" x="17.10" y="5.80" width="4.80" height="1.10" rx="0.25"/>
    <rect data-seg="f" opacity="0" x="16.00" y="6.90" width="1.10" height="4.10" rx="0.25"/>
    <rect data-seg="b" opacity="0" x="21.90" y="6.90" width="1.10" height="4.10" rx="0.25"/>
    <rect data-seg="g" opacity="0" x="17.10" y="11.00" width="4.80" height="1.10" rx="0.25"/>
    <rect data-seg="e" opacity="0" x="16.00" y="12.10" width="1.10" height="4.10" rx="0.25"/>
    <rect data-seg="c" opacity="0" x="21.90" y="12.10" width="1.10" height="4.10" rx="0.25"/>
    <rect data-seg="d" opacity="0" x="17.10" y="16.20" width="4.80" height="1.10" rx="0.25"/>
  </g>
  <g id="digit-2" fill="#70be44">
    <rect data-seg="a" opacity="0" x="26.10" y="5.80" width="4.80" height="1.10" rx="0.25"/>
    <rect data-seg="f" opacity="0" x="25.00" y="6.90" width="1.10" height="4.10" rx="0.25"/>
    <rect data-seg="b" opacity="0" x="30.90" y="6.90" width="1.10" height="4.10" rx="0.25"/>
    <rect data-seg="g" opacity="0" x="26.10" y="11.00" width="4.80" height="1.10" rx="0.25"/>
    <rect data-seg="e" opacity="0" x="25.00" y="12.10" width="1.10" height="4.10" rx="0.25"/>
    <rect data-seg="c" opacity="0" x="30.90" y="12.10" width="1.10" height="4.10" rx="0.25"/>
    <rect data-seg="d" opacity="0" x="26.10" y="16.20" width="4.80" height="1.10" rx="0.25"/>
  </g>
  <g id="point-1" fill="#70be44">
    <rect data-seg="dp" x="23.3" y="16.4" width="0.9" height="0.9" rx="0.45" opacity="0"/>
  </g>
  <g id="point-2" fill="#70be44">
    <rect data-seg="dp" x="32.3" y="16.4" width="0.9" height="0.9" rx="0.45" opacity="0"/>
  </g>
  <g id="select-rotate">
    <circle cx="40.7" cy="20.5" r="5.5" fill="#141517" stroke="#4a4d51" stroke-width="0.25"/>
  </g>
  <g id="silkscreen" fill="#e8e8e6" font-family="Helvetica, Arial, sans-serif">
    <text x="24.0" y="25.6" font-size="2.3" text-anchor="middle">LOAD (AMPS)</text>
    <text x="24.0" y="0.75" font-size="1.9" text-anchor="middle" transform="rotate(180 24.0 0.75)" dy="-0.0">LOAD (AMPS)</text>
    <text x="40.1" y="20.5" font-size="1.25" text-anchor="middle" fill="#b9bcc0" transform="rotate(270 40.1 20.5)">Select /</text>
    <text x="41.8" y="20.5" font-size="1.25" text-anchor="middle" fill="#b9bcc0" transform="rotate(270 41.8 20.5)">Rotate</text>
  </g>
</svg>
