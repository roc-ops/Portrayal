format: 1
kind: component
name: tripplite-duct-1uhd-fingers
version: 1.1.0
class: mechanical
description: >-
  One wall of the Tripp Lite SmartRack SRCABLEDUCT1UHD high capacity finger duct, seen from the
  front. It is the steel wall along the top or bottom of the channel. It has eleven dividers end-on.
  Between each pair is a wide pocket a cable bundle is laid through, ten pockets in all. The same
  part stands at the top and at the bottom of the duct.
provenance:
  size: >-
    estimated - NO DOCUMENT DIMENSIONS THE FINGERS. The spec sheet carries three pictures of the
    part and a unit size only. The wall is the 431.8 mm duct of the maker's SRCABLEDUCT1U
    (the 19.00 in over the ears is the same on this sheet, and the ear width is taken from
    that drawing); its 1.1 mm is that part's sheet.
  pitch: >-
    estimated - TEN POCKETS COUNTED twice on the maker's 500 px photograph of the duct. There are
    ten dark cells, each with one bright speck on its rear-left rim. The specks stand on one equal
    pitch to 1.3 px (a one-dimensional perspective fit). The earlier count, nine, was a miscount
    of the same photograph. The pockets are drawn 34.0 wide (kept from the earlier reading) on a
    40.9 pitch with 6.9 mm dividers, the ends 14.85 each. That is 9 x 40.9 + 34 = 402.1
    inside the 431.8. The fit alone gives a pitch of 40.7, so the 40.9 is within a half percent
    of it. The photograph is a perspective view, so the width and the divider are by eye.
  relief: >-
    estimated - a pocket runs from 8.0 mm in front of the back plate to 12.0 mm behind the
    front, under the cover's lip, and is closed at both ends like the SRCABLEDUCT1U's slots;
    so it runs 2.8 to 101.16 above the floor of the well (5.2 behind the back) in the 118.36
    mm overall. The 12.0 mm lip is a stand-in: no document gives how far the cover reaches.
  color: >-
    datasheet - "Cold rolled steel with black finish" (the spec sheet's Highlights). The
    shade is this library's render of black steel; the dividers are lighter than the root so
    the pockets read as pockets in a wall, and the wall reads on the dark stage as on a white
    one.
size: {w: 431.8, h: 1.1}
