format: 1
kind: component
name: tripplite-led
version: 1.0.0
class: led
profile: power
description: >-
  The round lamp window of an Eaton Tripp Lite series rack PDU face - a flush
  grey window about 6 mm across, one beside every switched outlet and one for
  the LX network interface's status. A lamp knows only that it is lit or not;
  what lit means, and in what colour, is the placement's statement.
size: {w: 6.0, h: 6.0}
size-confidence: {w: drawing, h: drawing}
provenance:
  size: >-
    drawing - the Tripp Lite PDUMV20HVNETLX submittal drawing (17-08-067, page
    2, front view) is vector; it draws each outlet lamp as a stroked circle
    whose outer edge reads 7.44 across and whose stroke is about 1.3 thick at
    the sheet's 0.32252 pt/mm (the 1776.44 overall, line centre to line
    centre), so the circle at its stroke centre is 6.1 across, taken as 6.0.
    The LX status lamp is drawn 6.9 outside, 5.6 at its stroke centre, the
    same window within the drawing's line weight.
  colour: >-
    photo-measured - PDUMV20HVNETLX_DT01 (3000 px master) shows every outlet
    window unlit: a flat grey disc, #333333 against the #2f2f2f face, with no
    rim distinct from the window. The lit colour is not stated by any held
    source (the device records the gap).
  relief: >-
    none built - the photographs show a flush window and no drawing gives a
    standoff, so the lamp is painted on the face.
elements:
  lamp: {at: [0, 0], size: [6.0, 6.0], class: led, states: ['off', 'on']}
skins: [default]
