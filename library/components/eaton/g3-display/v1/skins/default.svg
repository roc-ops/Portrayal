<svg xmlns="http://www.w3.org/2000/svg" width="30.4mm" height="33.6mm" viewBox="0 0 30.4 33.6">
  <!-- The pixel display of a G3 meter module: a dark bezel round a dark blue window. -->
  <rect id="bezel" x="0.15" y="0.15" width="30.1" height="33.3" rx="1.0" fill="#0e0e10" stroke="#3a3a3d" stroke-width="0.3"/>
  <rect id="window" x="1.8" y="1.8" width="26.8" height="30.0" rx="0.5" fill="#1c2a4a" stroke="#2a3a60" stroke-width="0.2"/>
</svg>
