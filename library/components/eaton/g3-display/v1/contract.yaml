format: 1
kind: component
name: g3-display
version: 1.0.0
class: display
profile: power
description: >-
  The pixel display of the hot-swappable meter module of an Eaton ePDU G3 rack
  PDU. It is a tall window in the module's faceplate, beside four navigation
  buttons; the maker's overview calls it an advanced LCD pixel display for IP
  setup and troubleshooting.
size: {w: 30.4, h: 33.6}
size-confidence: {w: drawing, h: drawing}
provenance:
  size: >-
    drawing - Eaton EMIT03-10 and EMIT04-10 specification drawings (rev 002,
    sheet 1), the front view read at 300 dpi against each sheet's own 482.6
    overall (9.45 px per mm): the window is 30.4 across by 33.6 down on both.
    Neither sheet dimensions it and the reading is good to about 0.5.
  existence: >-
    datasheet - Eaton ePDU G3 product overview (PA155003EN, December 2018):
    "Advanced LCD pixel display allows for easy IP setup and troubleshooting".
  colour: >-
    estimated - the drawings are line art and show no colour. The 1U units
    photographed on page 3 of the Eaton Rack PDU G3+ brochure (BR155022EN) show
    a lit screen, white digits on a blue-violet window (a median of about
    #5c62b4), on a black module; the unlit window is drawn dark blue as a
    stand-in.
  not-drawn: >-
    what the screen shows is not drawn; no held document gives its resolution or
    its menus.
elements:
  window: {at: [0.3, 0.3], size: [29.8, 33.0], class: display, kind: pixel}
skins: [default]
