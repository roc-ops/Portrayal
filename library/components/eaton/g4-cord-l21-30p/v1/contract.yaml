format: 1
kind: component
name: g4-cord-l21-30p
version: 1.0.0
class: inlet
profile: power
description: >-
  The fixed input cord of an Eaton Rack PDU G4 with a NEMA L21-30P plug - 10 ft of
  10 AWG five-conductor cord (three lines, neutral, earth) leaving the end cap through
  a grommet. Drawn as the end cap shows it; the cord and plug beyond it are not.
size: {w: 36.9, h: 36.9}
size-confidence: {w: drawing, h: drawing}
attrs: {plug: nema-l21-30p, cord-length-ft: 10, cord-gauge: 10 AWG / 5C}
provenance:
  size: >-
    drawing - the end view of 9001-22301: a grommet 36.9 across centred on the width
    and 28.5 from the back, the cord 18.2 across centred 31.1 from the back.
  plug: >-
    drawing - 9001-22301 INPUT: NEMA L21-30, 10AWG / 5C, 10FT POWERCORD; the drawing
    draws the plug face and the cord leaving the end beyond section A, and the
    EVMI2130X-PLUG_DT5 photograph shows the five-pin twist-lock plug. The EVMI2130X
    SKU page gives INPUT CONNECTION L21-30P and CORD LENGTH 10 ft.
  not-drawn: >-
    THE CORD BEYOND THE END CAP AND THE PLUG ARE NOT DRAWN: the far end of a cord is
    not a part (docs/connectors-power-design.md section 7). This part stands for the
    power input a DCIM records, a NEMA L21-30P power port.
elements:
  grommet: {at: [0, 0], size: [36.9, 36.9], class: inlet}
skins: [default]
