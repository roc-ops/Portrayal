format: 1
kind: component
name: pdu-digital-input-plug
version: 1.0.0
class: port
mates: pdu-io-header
profile: power
description: >-
  The conductor ends of the wires that land on the digital input header of a Rittal PDU metered controller. Two
  stripped ends sit side by side at the header's two positions. The part seats in a `pdu-io-header` connector.
size: {w: 8.3, h: 9.4}
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  The outline of the header it seats in, rittal/pdu-digital-input@1. No document gives a dimension of a conductor
  end or of a wire.
attrs: {media: pdu-digital-input, connector: conductor ends, positions: 2}
unplaced: seated by configurations downstream of this library; see docs/pluggables-design.md decision 2
provenance:
  part: >-
    A DECLARED STAND-IN FOR THE CABLE CONNECTOR. Fig. 21 of Rittal's instructions for the PDU metered (7979204)
    names the digital input and shows no cable connector. The part is the wires' own ends and claims no maker,
    series or part number.
  size: >-
    estimated - see size-notes.
  colour: >-
    estimated - the grey body and the lighter conductor ends are declared estimates.
  far-end: >-
    NOT DRAWN. The other end lands on the site's own signal.
  depth: >-
    NOT STATED. No document gives how far a conductor enters the header, so the part draws a plan outline only.
  behaviour: >-
    DELIBERATELY OMITTED, as on every class port contract.
elements: {}
connection-points:
  mate: {at: [4.15, 4.7], direction: front}
skins: [default]
