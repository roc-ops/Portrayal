  <g id="pins">
    <rect x="1.2" y="1.26" width="5.65" height="3.1" rx="1.8" fill="#1f2421"/>
    <rect x="1.2" y="4.76" width="5.65" height="3.1" rx="1.8" fill="#1f2421"/>
    <rect x="1.2" y="8.26" width="5.65" height="3.1" rx="1.8" fill="#1f2421"/>
    <circle cx="3.53" cy="2.81" r="0.8" fill="#b9bec3" stroke="#6b7076" stroke-width="0.12"/>
    <circle cx="3.53" cy="6.31" r="0.8" fill="#b9bec3" stroke="#6b7076" stroke-width="0.12"/>
    <circle cx="3.53" cy="9.81" r="0.8" fill="#b9bec3" stroke="#6b7076" stroke-width="0.12"/>
  </g>
