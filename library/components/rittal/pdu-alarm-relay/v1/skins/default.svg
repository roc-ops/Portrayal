<svg xmlns="http://www.w3.org/2000/svg" width="8.3mm" height="12.9mm" viewBox="0 0 8.3 12.9">
  <!-- The three-position alarm relay header of the PDU metered controller, three positions in a row along the strip.
       Outline from the maker's front view; colours and openings are estimated. -->
  <rect id="body" x="0" y="0" width="8.3" height="12.9" rx="0.4" fill="#a3aaa6" stroke="#5d6460" stroke-width="0.25"/>
  <g id="pins">
    <rect x="1.2" y="0.9" width="3.6" height="3.2" rx="0.2" fill="#1f2421"/>
    <rect x="1.2" y="4.9" width="3.6" height="3.2" rx="0.2" fill="#1f2421"/>
    <rect x="1.2" y="8.9" width="3.6" height="3.2" rx="0.2" fill="#1f2421"/>
    <circle cx="6.5" cy="2.5" r="0.8" fill="#b9bec3" stroke="#6b7076" stroke-width="0.12"/>
    <circle cx="6.5" cy="6.5" r="0.8" fill="#b9bec3" stroke="#6b7076" stroke-width="0.12"/>
    <circle cx="6.5" cy="10.5" r="0.8" fill="#b9bec3" stroke="#6b7076" stroke-width="0.12"/>
  </g>
</svg>
