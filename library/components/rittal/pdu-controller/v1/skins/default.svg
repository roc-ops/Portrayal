<svg xmlns="http://www.w3.org/2000/svg" width="39.1mm" height="100mm" viewBox="0 0 39.1 100">
  <!-- The head end of the controller plate of the Rittal PDU metered, standing with the foot down. It has the name.
       It also has the keys, the display, the RESET opening, the two lamp slots, the step in the outline and the rim.
       The first of the plate's five section lines crosses it 74.0 mm from the head end. -->
  <rect id="faceplate" x="0" y="0" width="39.1" height="100" rx="0.8" fill="#3c3d40" stroke="#26272a" stroke-width="0.25"/>
  <g id="screws">
    <circle cx="6.87" cy="4.7" r="3.0" fill="#55585c" stroke="#1d1e20" stroke-width="0.25"/>
    <circle cx="6.87" cy="4.7" r="1.2" fill="#2a2b2e"/>
    <circle cx="31.93" cy="4.7" r="3.0" fill="#55585c" stroke="#1d1e20" stroke-width="0.25"/>
    <circle cx="31.93" cy="4.7" r="1.2" fill="#2a2b2e"/>
  </g>
  <rect id="display" x="6.87" y="32.2" width="25.4" height="26.6" fill="#16212a" stroke="#6b7076" stroke-width="0.3"/>
  <circle id="esc" cx="9.62" cy="23.8" r="4.0" fill="#2a2b2e" stroke="#6b7076" stroke-width="0.3"/>
  <circle id="up" cx="29.02" cy="23.8" r="4.0" fill="#2a2b2e" stroke="#6b7076" stroke-width="0.3"/>
  <circle id="enter" cx="9.62" cy="67.04" r="4.0" fill="#2a2b2e" stroke="#6b7076" stroke-width="0.3"/>
  <circle id="down" cx="29.02" cy="67.04" r="4.0" fill="#2a2b2e" stroke="#6b7076" stroke-width="0.3"/>
  <circle cx="9.62" cy="23.8" r="3.245" fill="none" stroke="#6b7076" stroke-width="0.2"/>
  <circle cx="29.02" cy="23.8" r="3.245" fill="none" stroke="#6b7076" stroke-width="0.2"/>
  <circle cx="9.62" cy="67.04" r="3.245" fill="none" stroke="#6b7076" stroke-width="0.2"/>
  <circle cx="29.02" cy="67.04" r="3.245" fill="none" stroke="#6b7076" stroke-width="0.2"/>
  <circle id="reset" cx="28.0" cy="79.2" r="1.0" fill="#101112" stroke="#6b7076" stroke-width="0.2"/>
  <rect x="3.68" y="83.15" width="4.5" height="1.9" rx="0.3" fill="#101112" stroke="#55585c" stroke-width="0.2"/>
  <rect x="3.68" y="89.0" width="4.5" height="1.9" rx="0.3" fill="#101112" stroke="#55585c" stroke-width="0.2"/>
  <rect id="notch-head-1" x="0" y="0" width="0.6" height="23.0" fill="#1d1d1f"/>
  <rect id="notch-head-2" x="38.5" y="0" width="0.6" height="23.0" fill="#1d1d1f"/>
  <path id="rim-head" d="M 0.6 24.3 H 1.75 V 1.0 H 37.35 V 24.3 H 38.5" fill="none" stroke="#26272a" stroke-width="0.35"/>
  <rect id="section-1" x="0" y="73.825" width="39.1" height="0.35" fill="#26272a"/>
  <g id="silkscreen" font-family="sans-serif" fill="#d9d9d9">
    <text x="19.55" y="14.4" text-anchor="middle" font-size="4.2">RITTAL</text>
    <text x="17.5" y="79.7" font-size="1.8">RESET</text>
    <text x="12.5" y="85.4" font-size="1.8">POWER</text>
    <text x="12.5" y="91.3" font-size="1.8">STATUS</text>
  </g>
