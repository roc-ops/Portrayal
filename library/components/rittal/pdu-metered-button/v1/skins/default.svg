<svg xmlns="http://www.w3.org/2000/svg" width="35mm" height="25mm" viewBox="0 0 35 25">
  <!-- The Rittal metered PDU push-button attachment seen from behind the strip. The plate has two lines
       across it, 5 mm in from each end. Two lines of 24 mm cross at its centre, one each way. The button has
       three rings, 15.0, 7.5 and 3.7 across, and a small cross inside the smallest. The lines show between the two
       outer rings and stop at the smallest ring, as the drawing has them. -->
  <rect id="plate" x="0" y="0" width="35" height="25" rx="1.0" fill="#26282b" stroke="#3a3d41" stroke-width="0.2"/>
  <path id="bands" d="M 0 5 H 35 M 0 20 H 35" fill="none" stroke="#4a4e53" stroke-width="0.2"/>
  <g id="head">
    <circle cx="17.5" cy="12.5" r="7.5" fill="#18191b" stroke="#3a3d41" stroke-width="0.2"/>
    <path id="cross-lines" d="M 5.5 12.5 H 29.5 M 17.5 0.5 V 24.5" fill="none" stroke="#4a4e53" stroke-width="0.2"/>
    <circle cx="17.5" cy="12.5" r="3.75" fill="#202225" stroke="#3a3d41" stroke-width="0.2"/>
    <circle cx="17.5" cy="12.5" r="1.85" fill="#b9bec4" stroke="#7b8187" stroke-width="0.15"/>
    <path d="M 16.8 12.5 H 18.2 M 17.5 11.8 V 13.2" stroke="#4a4e53" stroke-width="0.25"/>
  </g>
</svg>
