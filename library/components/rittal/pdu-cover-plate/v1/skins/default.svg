  <path id="rim" d="M 0.61 2.69 V 105.29 M 39.27 2.69 V 105.29 M 0.61 2.69 H 39.27 M 0.61 105.29 H 39.27 M 0 0 L 0.61 2.69 M 40.2 0 L 39.27 2.69 M 0 107.3 L 0.61 105.29 M 40.2 107.3 L 39.27 105.29" fill="none" stroke="#55585c" stroke-width="0.2"/>
</svg>
