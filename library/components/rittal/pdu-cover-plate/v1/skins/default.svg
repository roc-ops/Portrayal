<svg xmlns="http://www.w3.org/2000/svg" width="40.2mm" height="107.3mm" viewBox="0 0 40.2 107.3">
  <!-- The label cover of the Rittal PDU metered, seen from the front. It stands 13.2 mm proud and its ends slope. -->
  <rect id="plate" x="0" y="0" width="40.2" height="107.3" rx="0.6" fill="#2e2e31" stroke="#232427" stroke-width="0.25"/>
