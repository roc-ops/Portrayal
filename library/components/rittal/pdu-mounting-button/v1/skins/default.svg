<svg xmlns="http://www.w3.org/2000/svg" width="36.6mm" height="25.2mm" viewBox="0 0 36.6 25.2">
  <!-- The Rittal PDU push-button attachment seen from behind the strip: the
       plate across the back, and the round button and screw at its centre. The
       screw is drawn inside `head` so it rides on the button's face in 3D. -->
  <rect id="plate" x="0" y="0" width="36.6" height="25.2" rx="1.0" fill="#26282b" stroke="#3a3d41" stroke-width="0.2"/>
  <g id="head">
    <circle cx="18.3" cy="12.6" r="5.5" fill="#18191b" stroke="#3a3d41" stroke-width="0.2"/>
    <circle cx="18.3" cy="12.6" r="2.0" fill="#b9bec4" stroke="#7b8187" stroke-width="0.15"/>
    <path d="M 17.4 12.6 H 19.2 M 18.3 11.7 V 13.5" stroke="#4a4e53" stroke-width="0.3"/>
  </g>
</svg>
