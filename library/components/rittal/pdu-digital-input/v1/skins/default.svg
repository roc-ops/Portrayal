<svg xmlns="http://www.w3.org/2000/svg" width="8.3mm" height="9.4mm" viewBox="0 0 8.3 9.4">
  <!-- The two-position digital input header of the PDU metered controller, two positions in a row along the strip.
       Outline from the maker's front view; colours and openings are estimated. -->
  <rect id="body" x="0" y="0" width="8.3" height="9.4" rx="0.4" fill="#838788" stroke="#4a4d4e" stroke-width="0.25"/>
  <g id="pins">
    <rect x="1.2" y="0.9" width="3.6" height="3.2" rx="0.2" fill="#1f2421"/>
    <rect x="1.2" y="5.3" width="3.6" height="3.2" rx="0.2" fill="#1f2421"/>
    <circle cx="6.5" cy="2.5" r="0.8" fill="#b9bec3" stroke="#6b7076" stroke-width="0.12"/>
    <circle cx="6.5" cy="6.9" r="0.8" fill="#b9bec3" stroke="#6b7076" stroke-width="0.12"/>
  </g>
</svg>
