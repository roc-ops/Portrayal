name: op34d5x
version: 1.0.0
class: filter
behaviour: fills
profile: optical
description: >-
  CommScope (ARRIS) OP34D5X - 5-channel CWDM demultiplexer with cascade output, integrated 1310 nm splitter and -20 dB test port: COM, OUT, 1310, TP and five channel outputs. A passive half-depth module for the CH3000: it seats in
  the front or the rear half of a slot.
size: {w: 25.76, h: 130.2, d: 165.1}
size-confidence: {w: borrowed, h: borrowed, d: datasheet}
