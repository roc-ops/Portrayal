format: 1
kind: module
name: bp-p1
version: 1.0.0
class: inlet
behaviour: fills
profile: optical
description: >-
  CommScope (ARRIS) BP-P1 - the dynamic back plate a PS3006 power supply mates in a
  CH3000 chassis, two slots wide at the rear. It carries the IEC C14 AC inlet the
  supply is fed through, a fan grille, and the blank position a CX3002 / CX3003C
  communications module mounts in above the PSU.
size: {w: 52.52, h: 130.2}
size-confidence: {w: borrowed, h: borrowed}
attrs:
  model: BP-P1
  input-rating: 100-240 V~, 4.0 A, 50-60 Hz
  slots: 2
provenance:
  size: >-
    borrowed - commscope/ps3006d@1's plate, the two-slot footprint the back plate mates
    from behind. The PS3006 data sheet's BP-P1 drawing (p3, 269 x 586) outlines the plate
    at 215 x 528 px, an aspect of 0.407 against 52.52 / 130.2 = 0.403, so the drawing is
    orthographic and the two-slot, full-height footprint holds.
  face-features: >-
    drawing - PS3006 data sheet p3 "Required Module BP-P1 Back Plate", read at 4.09 px/mm
    across and 4.06 down: thumbscrews centred x 13.4 and 39.6 at y 6.2 and 124.5, the
    legend BP-P1 between the top pair, a blank rectangle y 14.3-35.8, ten grille slots
    across x 7.3-45.2 at y 38.2-77.7, the C14 inlet centred 26.9, 92.0 with a flange screw
    either side at x 5.4 and 46.9, and the rating legend "100-240V~ 4.0 A 50-60 Hz" under it.
    A cord-retaining clip is drawn below the rating; cable management is not modelled.
  inlet: >-
    standard (IEC 60320-1) via std/c14-inlet@1, composed unrotated: the drawing puts the
    earth pin up and centred, line and neutral below, which is that part's own orientation.
  comms-position: >-
    the blank rectangle is where a communications module mounts. The CX3003C data sheet
    (p3 photograph) shows the module seated at the top of a PSU back plate, above the fan
    and the inlet, and its text says it "mounts in the BP-P1 or BP-P2 back plate". Drawn
    as the blank cover here; a nested bay for CX3002 / CX3003C is left for when those
    modules are modelled.
  fan: >-
    the grille is over a fan: the CX3003C photograph of a populated BP-P2 shows a fan
    behind the same position. It is fed from the mid-plane; no document held gives it a
    figure, and a back plate carries no power figure of its own here.
