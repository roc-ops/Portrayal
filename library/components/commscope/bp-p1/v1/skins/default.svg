<svg xmlns="http://www.w3.org/2000/svg" width="52.52mm" height="130.2mm" viewBox="0 0 52.52 130.2">
  <!-- BP-P1 back plate, 52.52 x 130.2, from the PS3006 data sheet's p3 drawing.
       The C14 inlet is std/c14-inlet@1, composed; the top 43.2 is the `comms` bay,
       whose default cover carries the BP-P1 legend. -->
