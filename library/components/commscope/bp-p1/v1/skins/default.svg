    <rect x="23.17" y="38.2" width="2.2" height="39.5" rx="23.17"/>
    <rect x="27.14" y="38.2" width="2.2" height="39.5" rx="27.14"/>
    <rect x="31.10" y="38.2" width="2.2" height="39.5" rx="31.10"/>
    <rect x="35.07" y="38.2" width="2.2" height="39.5" rx="35.07"/>
    <rect x="39.04" y="38.2" width="2.2" height="39.5" rx="39.04"/>
    <rect x="43.00" y="38.2" width="2.2" height="39.5" rx="43.00"/>
  </g>
  <g id="flange-screw-1"><circle cx="5.4" cy="94.4" r="1.9" fill="#8b9096"/><path d="M 4.3 94.4 H 6.5 M 5.4 93.3 V 95.5" stroke="#3c4045" stroke-width="0.3"/></g>
