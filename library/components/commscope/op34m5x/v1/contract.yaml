format: 1
kind: module
name: op34m5x
version: 1.1.0
class: filter
behaviour: fills
profile: optical
description: >-
  CommScope (ARRIS) OP34M5X - 5-channel CWDM multiplexer with cascade input, integrated 1310 nm combiner and -20 dB test port: INP, COM, 1310, TP and five channel inputs. A passive half-depth module for the CH3000: it seats in
  the front or the rear half of a slot.
size: {w: 25.76, h: 130.2, d: 165.1}
size-confidence: {w: borrowed, h: borrowed, d: datasheet}
fields:
  model:
    label: the part number printed under the title
    type: text
    default: ''
  ch1:
    label: wavelength printed at channel port 1
    type: text
    default: ''
  ch2:
    label: wavelength printed at channel port 2
    type: text
    default: ''
  ch3:
    label: wavelength printed at channel port 3
    type: text
