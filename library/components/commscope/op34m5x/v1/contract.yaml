attrs:
  model: OP34M5X
  role: passive
provenance:
  size: >-
    borrowed - one CH3000 slot pitch less the faceplate gap (26.76 - 1.0), and the chassis
    face's 130.2, the face every single-width module here takes; the OP34M5x 5-channel CWDM multiplexer data sheet (p1 photograph of an OP34M5H, 339 x 994)
    is a three-quarter view that
    shows the module's side as well, so its pixel box does not give the face's aspect -
    the photograph is normalised to these dimensions rather than checked against them. Depth
    datasheet - "6.5 D", 165.1 mm, a half-depth module.
  face-features: >-
    photo-measured as fractions of the face: the photograph is normalised to 25.76 x 130.2
    and the SC/APC adapters found by colour (their green or blue bodies and yellow laser
    shutters), which gives each row's position to about half a millimetre; the legends are
    read off the same photograph. The five channel wavelengths are printed per model (the V, L and H groups - Very Low 1270-1350, Low 1430-1510 and High 1530-1610) and are fields. The data sheet's features say "Occupies two half-depth slots" while its dimensions give 1.0 in wide and the photograph shows a single-width face; the dimensions and the photograph are taken.
  seating: >-
    the sheet's features say "Occupies two half-depth slots", but its dimensions give 1.0 in wide and its photograph shows a single-width face, so the module takes one half-depth slot here; accepted by a slot's front bay and its rear bay alike, per the chassis data
    sheet's 16 front-loaded and 16 rear-loaded half-depth slots.
  power: >-
    passive - no power figure; the data sheet gives optical characteristics only.
  adapter-bodies: >-
    the adapter frames drawn in the skin are declared as class adapter.
    They were declared as ports as well as the std/sc-bore@1 openings
    composed beside them, which are the ports and present the registered
    interface sc, so a drawn port stood on the face that presented none.
    Ids, positions, sizes and the skin are unchanged.
