<svg xmlns="http://www.w3.org/2000/svg" width="52.52mm" height="43.2mm" viewBox="0 0 52.52 43.2">
  <!-- CX3033N face, 52.52 x 43.2 (see contract). RJ45s are common/rj45-eth@1, lamps
       common/led-dot@1 and the micro-USB std/micro-usb@1, composed; the stereo RS-232
       jacks are drawn here. -->
  <rect id="heatsink" x="4.0" y="0" width="44.5" height="5.5" fill="#1a1b1d"/>
  <rect x="16.5" y="0.3" width="2.4" height="5.2" rx="0.4" fill="#141517"/>
  <rect x="20.5" y="0.3" width="2.4" height="5.2" rx="0.4" fill="#141517"/>
  <rect x="24.5" y="0.3" width="2.4" height="5.2" rx="0.4" fill="#141517"/>
  <rect x="28.5" y="0.3" width="2.4" height="5.2" rx="0.4" fill="#141517"/>
  <rect x="32.5" y="0.3" width="2.4" height="5.2" rx="0.4" fill="#141517"/>
  <g id="screw-1"><circle cx="13.4" cy="3.0" r="2.9" fill="#0e0f10"/></g>
  <g id="screw-2"><circle cx="39.6" cy="3.0" r="2.9" fill="#0e0f10"/></g>
  <rect id="body" x="0" y="5.5" width="52.52" height="37.7" rx="0.6" fill="#232528" stroke="#0c0d0e" stroke-width="0.3"/>
  <rect x="8.3" y="27.7" width="35.8" height="13.6" rx="0.3" fill="#b9bdc1" stroke="#6d7277" stroke-width="0.3"/>
  <g id="rs232"><rect x="9.40" y="12.80" width="7.4" height="7.4" rx="0.8" fill="#161719"/><circle cx="13.1" cy="16.5" r="2.6" fill="#2a2c2f" stroke="#55585c" stroke-width="0.4"/><circle cx="13.1" cy="16.5" r="1.2" fill="#08090a"/></g>
  <g id="reset"><circle cx="44.3" cy="23.1" r="0.7" fill="#08090a"/></g>
  <g id="silkscreen" fill="#d9dcdf" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="43.4" y="11.7" font-size="2.6">CX3033N</text>
    <text x="13.2" y="13.1" font-size="1.6">RS-232</text>
    <text x="44.3" y="15.9" font-size="1.6">microUSB</text>
    <text x="44.3" y="25.9" font-size="1.6">RESET</text>
    <text x="7.5" y="24.1" font-size="1.6">ACCESS</text>
    <text x="6.4" y="26.3" font-size="1.6">STATUS</text>
    <text x="17.2" y="26.6" font-size="1.6">OUT</text>
    <text x="34.7" y="26.6" font-size="1.6">IN</text>
    <text x="12.0" y="42.5" font-size="1.3">10/100M</text>
    <text x="24.0" y="42.5" font-size="1.3">1G</text>
    <text x="29.5" y="42.5" font-size="1.3">10/100M</text>
    <text x="42.0" y="42.5" font-size="1.3">1G</text>
    <text x="20.1" y="23.4" font-size="1.4">LOS</text>
    <text x="34.3" y="22.9" font-size="1.4">BER</text>
    <path d="M 4.0 10.3 V 25.7 M 4.7 18.3 V 23.5" fill="none" stroke="#d9dcdf" stroke-width="0.2"/>
  </g>
</svg>
