<svg xmlns="http://www.w3.org/2000/svg" width="25.76mm" height="130.2mm" viewBox="0 0 25.76 130.2">
  <!-- FA3500-series EDFA face, 25.76 x 130.2, from the FA3500 data sheet's face-on photograph
       of an FA3524 (see contract). Lamps are common/led-dot@1, composed; the model number is
       the `model` field. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8187"/>
      <stop offset="1" stop-color="#63686e"/>
    </linearGradient>
    <radialGradient id="key" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#e6e8ea"/>
      <stop offset="1" stop-color="#8f949a"/>
    </radialGradient>
  </defs>
  <rect id="body" x="0" y="0" width="25.76" height="130.2" rx="1.0" fill="url(#plate)" stroke="#55595e" stroke-width="0.3"/>
  <g id="screw-top"><circle cx="12.88" cy="5.0" r="4.9" fill="#1d1f22"/><circle cx="12.88" cy="5.0" r="3.2" fill="#2e3135"/></g>
  <rect id="vent-left" x="2.6" y="29.4" width="2.3" height="59.1" rx="1.1" fill="#101214"/>
  <rect id="vent-inner-1" x="7.1" y="54.9" width="2.3" height="33.6" rx="1.1" fill="#1a2a1e"/>
  <rect id="vent-inner-2" x="11.6" y="54.9" width="2.3" height="33.6" rx="1.1" fill="#1a2a1e"/>
  <rect id="vent-inner-3" x="16.2" y="54.9" width="2.3" height="33.6" rx="1.1" fill="#1a2a1e"/>
  <rect id="vent-right" x="20.8" y="29.4" width="2.3" height="59.1" rx="1.1" fill="#101214"/>
  <g id="laser-key">
    <circle cx="13.2" cy="105.6" r="6.45" fill="url(#key)" stroke="#6d7277" stroke-width="0.3"/>
    <circle cx="13.2" cy="105.6" r="4.2" fill="#c3c6ca" stroke="#8e9398" stroke-width="0.3"/>
    <path d="M 12.0 104.6 H 14.4 V 106.6 H 12.0 Z" fill="#9aa0a6" stroke="#6d7277" stroke-width="0.2"/>
  </g>
  <g id="screw-bottom"><circle cx="12.88" cy="125.2" r="4.9" fill="#1d1f22"/><circle cx="12.88" cy="125.2" r="3.2" fill="#2e3135"/></g>
  <g id="silkscreen" fill="#eef0f2" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="12.88" y="14.4" font-size="2.6">EDFA</text>
    <text x="12.88" y="17.8" font-size="2.6" data-from="model"></text>
    <g fill="none" stroke="#eef0f2" stroke-width="0.22">
      <path d="M 9.3 28.2 H 7.2 V 44.5 H 18.8 V 28.2 H 16.5"/>
      <path d="M 8.3 46.5 H 7.2 V 53.6 H 18.8 V 46.5 H 17.5"/>
      <path d="M 5.8 96.4 L 8.4 100.2 M 21.2 93.6 L 18.2 100.2"/>
    </g>
    <text x="12.9" y="29.0" font-size="2.1">Status</text>
    <text x="12.9" y="47.3" font-size="2.1">Access</text>
    <text x="4.6" y="92.8" font-size="2.2">OFF</text>
    <text x="21.4" y="92.8" font-size="2.2">ON</text>
    <text x="13.2" y="96.6" font-size="2.2">Laser</text>
    <text x="12.88" y="116.3" font-size="3.6" letter-spacing="1.3" fill="#1e2124">ARRIS</text>
  </g>
</svg>
