profile: optical
description: >-
  CommScope (ARRIS) NP35M08 - 8-channel DWDM multiplexer on the 100 GHz ITU grid: eight channel inputs and the DWDM output to the network. A passive half-depth module for the CH3000: it seats in
  the front or the rear half of a slot.
size: {w: 25.76, h: 130.2, d: 165.1}
size-confidence: {w: borrowed, h: photo-measured, d: datasheet}
