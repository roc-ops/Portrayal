description: >-
  CommScope (ARRIS) OP35D8CF - 8-channel DWDM demultiplexer on the 100 GHz ITU grid for a custom channel group: the DWDM input and eight channel outputs. A passive half-depth module for the CH3000: it seats in
  the front or the rear half of a slot.
