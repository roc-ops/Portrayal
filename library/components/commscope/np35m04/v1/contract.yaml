format: 1
kind: module
name: np35m04
version: 1.0.0
class: filter
behaviour: fills
profile: optical
description: >-
  CommScope (ARRIS) NP35M04 - 4-channel DWDM multiplexer on the 100 GHz ITU grid with a -20 dB line monitoring tap and cascade ports: TP, INP (from the previous mux), OUT (to the network) and four channel inputs. A passive half-depth module for the CH3000: it seats in
  the front or the rear half of a slot.
size: {w: 25.76, h: 130.2, d: 165.1}
size-confidence: {w: borrowed, h: photo-measured, d: datasheet}
fields:
  model:
    label: the part number printed under the title (the channel group is part of it)
    type: text
    default: ''
  ch1:
    label: ITU channel printed at channel port 1
    type: text
    default: ''
  ch2:
    label: ITU channel printed at channel port 2
    type: text
    default: ''
  ch3:
    label: ITU channel printed at channel port 3
    type: text
    default: ''
  ch4:
    label: ITU channel printed at channel port 4
    type: text
    default: ''
attrs:
  model: NP35M04
  role: passive
provenance:
  size: >-
    width borrowed - one CH3000 slot pitch less the faceplate gap (26.76 - 1.0), the width
    every single-width face in this chassis has. Height photo-measured: the NP35M04 / NP35D04 DWDM mux and demux data sheet (p1 photograph of an NP35M04S0K, 214 x 588)
    outlines the face at a height within 3% of 130.2 at the width's scale. Depth datasheet -
    "6.5 D", 165.1 mm, a half-depth module.
  face-features: >-
    photo-measured on the same photograph, normalised to the 25.76 x 130.2 face: a thumbscrew
    top and bottom on the centre line, the title DWDM MUX over the part number, and SC/APC
    adapters mounted on their sides - green bodies 0.8-19.8 across with a yellow laser
    shutter - on a 10.55 pitch, legended TP -20dB, INP, OUT, channel, channel, channel, channel at their right. The photograph is small
    (4.5 to 8 px/mm), so positions are good to about half a millimetre.
  printed-numbers: >-
    the part number and the channel numbers are printed per unit (the ordering code carries
    the channel group), so they are fields, set per module; left empty they print nothing.
  seating: >-
    datasheet - "Occupies one half-depth slot"; the chassis data sheet gives 32 half-depth
    slots, 16 front-loaded and 16 rear-loaded, so the module is accepted by a slot's front
    bay and its rear bay alike.
  power: >-
    passive - no power figure; the data sheet gives optical characteristics only.
