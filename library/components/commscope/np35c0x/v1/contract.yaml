description: >-
  CommScope (ARRIS) NP35C0X - DWDM combiner/separator filter pair: for each of A and B, the BLUE and RED band ports and the common port. A passive half-depth module for the CH3000: it seats in
  the front or the rear half of a slot.
size: {w: 25.76, h: 130.2, d: 165.1}
