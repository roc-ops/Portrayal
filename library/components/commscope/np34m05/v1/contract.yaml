format: 1
kind: module
name: np34m05
version: 1.1.0
class: filter
behaviour: fills
profile: optical
description: >-
  CommScope (ARRIS) NP34M05 - 5-channel CWDM multiplexer with cascade input, integrated 1310 nm combiner and -20 dB test port: INP, COM, 1310, TP and five channel inputs. A passive half-depth module for the CH3000: it seats in
  the front or the rear half of a slot.
size: {w: 25.76, h: 130.2, d: 165.1}
size-confidence: {w: borrowed, h: borrowed, d: datasheet}
fields:
  model:
    label: the part number printed under the title
    type: text
    default: ''
  ch1:
    label: wavelength printed at channel port 1
    type: text
    default: ''
  ch2:
    label: wavelength printed at channel port 2
    type: text
    default: ''
  ch3:
    label: wavelength printed at channel port 3
    type: text
    default: ''
  ch4:
    label: wavelength printed at channel port 4
    type: text
    default: ''
  ch5:
    label: wavelength printed at channel port 5
    type: text
    default: ''
attrs:
  model: NP34M05
  role: passive
provenance:
  size: >-
    borrowed - one CH3000 slot pitch less the faceplate gap (26.76 - 1.0), and the chassis
    face's 130.2, the face every single-width module here takes; the NP34M05 5-channel CWDM multiplexer data sheet (p1 photograph of an NP34M05H, 281 x 825)
    is a three-quarter view that
    shows the module's side as well, so its pixel box does not give the face's aspect -
    the photograph is normalised to these dimensions rather than checked against them. Depth
    datasheet - "6.5 D", 165.1 mm, a half-depth module.
  face-features: >-
    photo-measured as fractions of the face: the photograph is normalised to 25.76 x 130.2
    and the SC/APC adapters found by colour (their green or blue bodies and yellow laser
    shutters), which gives each row's position to about half a millimetre; the legends are
    read off the same photograph. The five channel wavelengths are printed per model (the V, L and H groups - Very Low 1270-1350, Low 1430-1510 and High 1530-1610) and are fields.
  seating: >-
    datasheet - "Occupies one half-depth slot"; accepted by a slot's front bay and its rear
    bay alike, per the chassis data sheet's 16 front-loaded and 16 rear-loaded half-depth
    slots.
  power: >-
    passive - no power figure; the data sheet gives optical characteristics only.
  adapter-bodies: >-
    the adapter frames drawn in the skin are declared as class adapter.
    They were declared as ports as well as the std/sc-bore@1 openings
    composed beside them, which are the ports and present the registered
    interface sc, so a drawn port stood on the face that presented none.
    Ids, positions, sizes and the skin are unchanged.
