format: 1
kind: module
name: np33f01
version: 1.0.0
class: filter
behaviour: fills
profile: optical
description: >-
  CommScope (ARRIS) NP33F01 - single-channel LCWDM add/drop filter: the channel port, the LCWDM pass-through and the common port. A passive half-depth module for the CH3000: it seats in
  the front or the rear half of a slot.
size: {w: 25.76, h: 130.2, d: 165.1}
size-confidence: {w: borrowed, h: borrowed, d: datasheet}
fields:
  model:
    label: the part number printed under the title
    type: text
    default: ''
  channel:
    label: channel printed at the channel port
    type: text
    default: ''
attrs:
  model: NP33F01
  role: passive
provenance:
  size: >-
    borrowed - one CH3000 slot pitch less the faceplate gap (26.76 - 1.0), and the chassis
    face's 130.2, the face every single-width module here takes; the NP33F01 single-channel LCWDM filter data sheet's p1 photograph
    of an NP33F01SNN (213 x 643 px) is a three-quarter view that
    shows the module's side as well, so its pixel box does not give the face's aspect -
    the photograph is normalised to these dimensions rather than checked against them. Depth datasheet - "6.5 D", 165.1 mm, a half-depth module.
  face-features: >-
    photo-measured as fractions of the face: the photograph is normalised to 25.76 x 130.2
    and the SC/APC adapters found by colour (their green bodies and yellow laser shutters),
    which gives each row's position to about half a millimetre; the legends are read off
    the same photograph. The photograph prints the channel and the part number as placeholders (CH NN, NP33F01SNN), so both are fields, set per unit.
  seating: >-
    datasheet - a half-depth module; accepted by a slot's front bay and its rear bay alike,
    per the chassis data sheet's 16 front-loaded and 16 rear-loaded half-depth slots.
  power: >-
    passive - no power figure; the data sheet gives optical characteristics only.
