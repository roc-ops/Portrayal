format: 1
kind: module
name: np35f04s
version: 1.0.0
class: filter
behaviour: fills
profile: optical
description: >-
  CommScope (ARRIS) NP35F04S - 4-channel DWDM filter for one channel group on the 100 GHz ITU grid: the group port, the DWDM pass-through, a -20 dB test port and the common port. A passive half-depth module for the CH3000: it seats in
  the front or the rear half of a slot.
size: {w: 25.76, h: 130.2, d: 165.1}
size-confidence: {w: borrowed, h: borrowed, d: datasheet}
fields:
  model:
    label: the part number printed under the title (the channel group is part of it)
    type: text
    default: ''
  group:
    label: channel-group letter printed at the group port
    type: text
    default: ''
attrs:
  model: NP35F04S
  role: passive
provenance:
  size: >-
    width borrowed - one CH3000 slot pitch less the faceplate gap (26.76 - 1.0), the width
    every single-width face in this chassis has. Height borrowed - the chassis face's 130.2,
    the slot height every full-height face takes; the NP35F04S 4-channel DWDM filter data sheet (p1 photograph of an NP35F04S0N, 204 x 599)
    agrees with it within 3% at the width's scale, which is a check on the borrowed figure,
    not a measurement of it. Depth datasheet -
    "6.5 D", 165.1 mm, a half-depth module.
  face-features: >-
    photo-measured on the same photograph, normalised to the 25.76 x 130.2 face: a thumbscrew
    top and bottom on the centre line, the title DWDM over the part number, and SC/APC
    adapters mounted on their sides - green bodies 0.8-19.8 across with a yellow laser
    shutter - on a 10.55 pitch, legended GRP x, DWDM, TP -20dB, COM at their right. The photograph is small
    (4.5 to 8 px/mm), so positions are good to about half a millimetre.
  printed-numbers: >-
    the part number and the channel numbers are printed per unit (the ordering code carries
    the channel group), so they are fields, set per module; left empty they print nothing.
  seating: >-
    datasheet - "Occupies one half-depth slot"; the chassis data sheet gives 32 half-depth
    slots, 16 front-loaded and 16 rear-loaded, so the module is accepted by a slot's front
    bay and its rear bay alike.
  power: >-
    passive - no power figure; the data sheet gives optical characteristics only.
