<svg xmlns="http://www.w3.org/2000/svg" width="25.76mm" height="130.2mm" viewBox="0 0 25.76 130.2">
  <!-- AR3002E face, 25.76 x 130.2, from the AR3002E data sheet's face-on photograph.
       Lamps are common/led-dot@1 and the micro-USB std/micro-usb@1, composed. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8f95"/>
      <stop offset="1" stop-color="#6f747a"/>
    </linearGradient>
    <radialGradient id="nut" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#e2e4e6"/>
      <stop offset="1" stop-color="#9ea3a8"/>
    </radialGradient>
  </defs>
  <rect id="body" x="0" y="0" width="25.76" height="130.2" rx="1.0"
        fill="url(#plate)" stroke="#55595e" stroke-width="0.3"/>
  <g id="screw-top"><circle cx="12.88" cy="5.0" r="4.9" fill="#1d1f22"/><circle cx="12.88" cy="5.0" r="3.2" fill="#2e3135"/></g>
  <rect id="vent-left" x="2.6" y="24.9" width="2.6" height="53.7" rx="1.2" fill="#16181a"/>
  <g id="vent-right" fill="#16181a">
    <rect x="20.3" y="24.5" width="2.6" height="32.0" rx="1.2"/>
    <rect x="20.3" y="63.5" width="2.6" height="21.9" rx="1.2"/>
    <rect x="15.7" y="63.4" width="2.6" height="21.9" rx="1.2"/>
  </g>
  <rect id="vent-mid" x="6.9" y="57.0" width="2.6" height="9.1" rx="1.2" fill="#16181a"/>
  <rect x="8.7" y="70.0" width="4.6" height="9.9" rx="0.8" fill="#3a3d41"/>
  <g fill="#16181a">
    <circle cx="12.8" cy="64.7" r="1.1"/>
    <circle cx="8.1" cy="83.9" r="1.1"/>
    <circle cx="12.7" cy="84.0" r="1.1"/>
  </g>
  <g id="test-point">
    <circle cx="12.9" cy="105.2" r="7.9" fill="url(#nut)" stroke="#6d7277" stroke-width="0.3"/>
    <circle cx="12.9" cy="105.2" r="5.6" fill="none" stroke="#8e9398" stroke-width="0.4"/>
    <circle cx="12.9" cy="105.2" r="1.3" fill="#55595e"/>
  </g>
  <g id="screw-bottom"><circle cx="12.88" cy="125.2" r="4.9" fill="#1d1f22"/><circle cx="12.88" cy="125.2" r="3.2" fill="#2e3135"/></g>
  <g id="silkscreen" fill="#eef0f2" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="12.88" y="13.8" font-size="2.5">Forward Receiver</text>
    <text x="12.88" y="17.1" font-size="2.5">AR3002E</text>
    <text x="12.88" y="20.4" font-size="2.5">1.2 GHz</text>
    <g fill="none" stroke="#eef0f2" stroke-width="0.22">
      <path d="M 9.3 26.7 H 7.7 V 43.0 H 18.5 V 26.7 H 16.5"/>
      <path d="M 9.0 45.3 H 7.7 V 53.5 H 18.5 V 45.3 H 16.8"/>
    </g>
    <text x="12.9" y="27.5" font-size="2.1">Status</text>
    <text x="12.9" y="46.1" font-size="2.1">Access</text>
    <text x="12.9" y="95.2" font-size="2.5">Out TP</text>
    <text x="12.88" y="119.4" font-size="3.0" letter-spacing="1.1" fill="#26292c">ARRIS</text>
  </g>
</svg>
