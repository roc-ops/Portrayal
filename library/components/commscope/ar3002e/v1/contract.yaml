  vent-mid: {at: [6.9, 57.0], size: [2.6, 9.1], class: vent}
  vent-right: {at: [15.7, 24.5], size: [7.3, 60.9], class: vent}
  test-point: {at: [5.0, 97.3], size: [15.8, 15.8], class: port}
  screw-bottom: {at: [7.98, 120.3], size: [9.8, 9.8], class: fastener}
