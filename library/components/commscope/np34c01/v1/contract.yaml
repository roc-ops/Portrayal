format: 1
kind: module
name: np34c01
version: 1.0.0
class: filter
behaviour: fills
profile: optical
description: >-
  CommScope (ARRIS) NP34C01 - dual CWDM/1310 nm optical filter, two independent three-port filters that combine or separate 1310 nm and the CWDM band, each with a -20 dB test port: A and B groups of COM, 1310, CWDM and TP. A passive half-depth module for the CH3000: it seats in
  the front or the rear half of a slot.
size: {w: 25.76, h: 130.2, d: 165.1}
size-confidence: {w: borrowed, h: borrowed, d: datasheet}
attrs:
  model: NP34C01
  role: passive
provenance:
  size: >-
    borrowed - one CH3000 slot pitch less the faceplate gap (26.76 - 1.0), and the chassis
    face's 130.2, the face every single-width module here takes; the NP34C01x CWDM/1310 optical filter data sheet (p1 photograph of an NP34C01, 283 x 825)
    agrees with it in aspect within a few percent, a check rather than a measurement. Depth
    datasheet - "6.5 D", 165.1 mm, a half-depth module.
  face-features: >-
    photo-measured as fractions of the face: the photograph is normalised to 25.76 x 130.2
    and the SC/APC adapters found by colour (their green or blue bodies and yellow laser
    shutters), which gives each row's position to about half a millimetre; the legends are
    read off the same photograph. The face prints NP34C01 without the ordering suffix, so it is printed as such.
  seating: >-
    datasheet - the filter is mounted in the CH3000 "occupying one half-depth slot"; accepted by a slot's front bay and its rear bay alike, per the chassis data
    sheet's 16 front-loaded and 16 rear-loaded half-depth slots.
  power: >-
    passive - no power figure; the data sheet gives optical characteristics only.
