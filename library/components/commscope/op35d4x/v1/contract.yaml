format: 1
kind: module
name: op35d4x
version: 1.0.0
class: filter
behaviour: fills
profile: optical
description: >-
  CommScope (ARRIS) OP35D4X - 4-channel DWDM demultiplexer on the 100 GHz ITU grid with a -20 dB line monitoring tap and cascade ports: TP, INP (from the network), OUT (to the next demux) and four channel outputs. A passive half-depth module for the CH3000: it seats in
  the front or the rear half of a slot.
size: {w: 25.76, h: 130.2, d: 165.1}
size-confidence: {w: borrowed, h: borrowed, d: datasheet}
fields:
  model:
    label: the part number printed under the title
    type: text
    default: ''
  ch1:
    label: ITU channel printed at channel port 1
    type: text
    default: ''
  ch2:
    label: ITU channel printed at channel port 2
    type: text
    default: ''
  ch3:
    label: ITU channel printed at channel port 3
    type: text
    default: ''
  ch4:
    label: ITU channel printed at channel port 4
    type: text
    default: ''
attrs:
  model: OP35D4X
  role: passive
provenance:
  size: >-
    borrowed - one CH3000 slot pitch less the faceplate gap (26.76 - 1.0), and the chassis
    face's 130.2, the face every single-width module here takes; the OP35M4x / OP35D4x DWDM mux and demux data sheet's p1 photograph
    of an OP35D4K (210 x 587 px) agrees with it in aspect within a few percent, a check rather
    than a measurement. Depth datasheet - "6.5 D", 165.1 mm, a half-depth module.
  face-features: >-
    photo-measured as fractions of the face: the photograph is normalised to 25.76 x 130.2
    and the SC/APC adapters found by colour (their green bodies and yellow laser shutters),
    which gives each row's position to about half a millimetre; the legends are read off
    the same photograph. The data sheet covers the OP35M4x mux as well; only the demux is photographed, so only it is modelled. Channel numbers and the part number are fields.
  seating: >-
    datasheet - a half-depth module; accepted by a slot's front bay and its rear bay alike,
    per the chassis data sheet's 16 front-loaded and 16 rear-loaded half-depth slots.
  power: >-
    passive - no power figure; the data sheet gives optical characteristics only.
