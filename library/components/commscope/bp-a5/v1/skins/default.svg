<svg xmlns="http://www.w3.org/2000/svg" width="25.76mm" height="130.2mm" viewBox="0 0 25.76 130.2">
  <!-- BP-A5 back plate, 25.76 x 130.2. ESTIMATED LAYOUT - no image of this plate is held;
       it follows the BP-A1 siblings on the Aurora 2004 rear photograph (see contract).
       The SC opening is std/sc-bore@1 and the RF jack std/f-type@1, composed. -->
  <rect id="body" x="0" y="0" width="25.76" height="130.2" rx="0.8" fill="#1f2124" stroke="#0e0f10" stroke-width="0.3"/>
  <g id="screw-top"><circle cx="12.88" cy="6.4" r="4.9" fill="#0f1011"/><circle cx="12.88" cy="6.4" r="3.1" fill="#26282b"/></g>
  <g id="fan-grille" fill="#0a0b0c">
    <rect x="3.00" y="30.0" width="2.0" height="25.0" rx="1.0"/>
    <rect x="6.54" y="30.0" width="2.0" height="25.0" rx="1.0"/>
    <rect x="10.08" y="30.0" width="2.0" height="25.0" rx="1.0"/>
    <rect x="13.62" y="30.0" width="2.0" height="25.0" rx="1.0"/>
    <rect x="17.16" y="30.0" width="2.0" height="25.0" rx="1.0"/>
    <rect x="20.70" y="30.0" width="2.0" height="25.0" rx="1.0"/>
  </g>
  <g id="optical-in">
    <rect x="6.2" y="61.5" width="13.36" height="13.0" rx="0.6" fill="#2fa84f" stroke="#1d7a36" stroke-width="0.3"/>
  </g>
  <g id="screw-bottom"><circle cx="12.88" cy="123.8" r="4.9" fill="#0f1011"/><circle cx="12.88" cy="123.8" r="3.1" fill="#26282b"/></g>
  <g id="silkscreen" fill="#e6e8ea" font-family="Helvetica, Arial, sans-serif">
    <text x="12.88" y="15.0" font-size="2.2" text-anchor="middle">BP-A5</text>
    <rect x="6.0" y="17.4" width="1.3" height="1.3" fill="none" stroke="#e6e8ea" stroke-width="0.2"/>
    <text x="8.0" y="18.6" font-size="1.3">OPTICAL INP</text>
    <circle cx="6.65" cy="20.6" r="0.65" fill="none" stroke="#e6e8ea" stroke-width="0.2"/>
    <text x="8.0" y="21.1" font-size="1.3">RF OUT</text>
