<svg xmlns="http://www.w3.org/2000/svg" width="52.52mm" height="130.2mm" viewBox="0 0 52.52 130.2">
  <!-- PS3006D face, 52.52 x 130.2: two CH3000 slots less the faceplate gap.
       Measured off the PS3006 data sheet's face-on photograph; see the contract.
       The micro-USB receptacle is std/micro-usb@1, composed at rotate 90. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8f95"/>
      <stop offset="1" stop-color="#6f747a"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4a4d51"/>
      <stop offset="1" stop-color="#1c1e20"/>
    </radialGradient>
  </defs>

  <rect id="body" x="0" y="0" width="52.52" height="130.2" rx="1.2"
        fill="url(#plate)" stroke="#55595e" stroke-width="0.3"/>

  <g id="screw-1">
    <circle cx="12.88" cy="5.0" r="4.9" fill="#1d1f22" stroke="#0e0f10" stroke-width="0.3"/>
    <circle cx="12.88" cy="5.0" r="3.2" fill="#2e3135"/>
  </g>
  <g id="screw-2">
    <circle cx="39.64" cy="5.0" r="4.9" fill="#1d1f22" stroke="#0e0f10" stroke-width="0.3"/>
    <circle cx="39.64" cy="5.0" r="3.2" fill="#2e3135"/>
  </g>

  <g id="display">
    <rect x="3.6" y="23.7" width="44.6" height="54.0" rx="0.6" fill="#0b1026" stroke="#2a2d31" stroke-width="0.4"/>
    <rect x="6.0" y="27.0" width="39.8" height="47.4" fill="#101a44" opacity="0.7"/>
  </g>

  <g id="joystick">
    <circle cx="28.6" cy="92.7" r="9.3" fill="#2a2c2f" stroke="#121315" stroke-width="0.3"/>
    <circle cx="28.6" cy="92.7" r="6.6" fill="url(#knob)"/>
  </g>

  <g id="vent-left" fill="#16181a">
    <rect x="3.5" y="90.8" width="3.0" height="21.5" rx="1.4"/>
    <rect x="7.6" y="90.8" width="3.0" height="21.5" rx="1.4"/>
    <rect x="11.9" y="90.8" width="3.0" height="21.5" rx="1.4"/>
    <rect x="16.3" y="98.5" width="3.0" height="13.8" rx="1.4"/>
    <rect x="20.7" y="103.9" width="3.0" height="8.4" rx="1.4"/>
    <rect x="25.0" y="103.9" width="3.0" height="8.4" rx="1.4"/>
    <rect x="29.4" y="103.9" width="3.0" height="8.4" rx="1.4"/>
  </g>
  <g id="vent-right" fill="#16181a">
    <rect x="43.2" y="98.5" width="3.0" height="14.1" rx="1.4"/>
    <rect x="47.6" y="98.5" width="3.0" height="14.1" rx="1.4"/>
  </g>

  <g id="handle">
    <rect x="7.6" y="121.9" width="34.0" height="7.5" rx="3.6" fill="#1b1c1e" stroke="#0b0b0c" stroke-width="0.3"/>
    <rect x="10.2" y="123.6" width="28.8" height="2.6" rx="1.3" fill="#2f3134"/>
  </g>

  <g id="silkscreen" fill="#eef0f2" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="26.26" y="13.5" font-size="2.6">Power Supply</text>
    <text x="26.26" y="16.9" font-size="2.6">PS3006D</text>
    <!-- joystick legend: up / left Enter right / down, with the return mark -->
    <text x="46.0" y="89.5" font-size="2.1">Enter</text>
    <path d="M 44.9 83.2 L 46.0 81.3 L 47.1 83.2 Z"/>
    <path d="M 41.4 88.6 L 43.1 87.5 L 43.1 89.7 Z"/>
    <path d="M 50.6 88.6 L 48.9 87.5 L 48.9 89.7 Z"/>
    <path d="M 44.9 91.0 L 46.0 92.9 L 47.1 91.0 Z"/>
    <path d="M 39.4 93.2 L 41.2 93.2 L 42.6 91.4" fill="none" stroke="#eef0f2" stroke-width="0.3"/>
    <text x="41.3" y="108.2" font-size="1.7" transform="rotate(-90 41.3 108.2)">microUSB</text>
    <text x="26.26" y="119.0" font-size="3.0" letter-spacing="1.2">ARRIS</text>
  </g>
</svg>
