format: 1
kind: module
name: ps3006d
version: 1.0.0
class: psu
behaviour: fills
profile: optical
description: >-
  CommScope (ARRIS) PS3006D - the 300 W AC power supply and chassis controller of
  the CH3000 headend optics platform, in the variant with a front-panel fluorescent
  display and joystick. Two full-depth slots wide; it mates the BP-P1 dynamic back
  plate, which carries the AC inlet.
size: {w: 52.52, h: 130.2, d: 330.0}
size-confidence: {w: photo-measured, h: photo-measured, d: datasheet}
attrs:
  model: PS3006D
  input: ac
  input-voltage: 100-240 VAC, 50/60 Hz
  output-voltage: 12 VDC
  power-output-w: 300
  efficiency: 83% typical at 120 V, 18-25 A load
  slots: 2
  back-plate: BP-P1
  inlet: none
provenance:
  inlet: >-
    datasheet - the supply has no inlet of its own: "The PS3006 requires two full-depth
    slots in the CH3000 chassis and mates with the BP-P1 dynamic back plate provided with
    the unit", and the BP-P1 drawing carries the C14. `none` because the chassis-side
    back plate, not the module, is where the cord goes; see commscope/bp-p1@1.
  size: >-
    photo-measured. WIDTH is two CH3000 slot pitches (2 x 26.76) less the 1.0 mm gap
    between neighbouring faceplates, both read off the stitched chassis front on p1 of
    the HT3580H data sheet (2024), where this module sits in slots 1-2 and measures
    52.4 wide at 2.727 px/mm. HEIGHT is the faceplate's 355 px on that photograph
    (130.2 mm), and the PS3006 data sheet's own face-on photograph (p1, four stitched
    tiles, 361 x 880 px) agrees on the aspect to 0.8%.
    NOT the data sheet's "13.0 D x 4.3 H x 2.0 W": 4.3 in is 109 mm and every photograph
    shows the faceplate filling the 132.6 mm face, so the table dimensions the module BODY
    behind the plate. Its 13.0 in (330 mm) is taken as the depth.
  power: >-
    datasheet - PS3006 data sheet (1511519 RevB, 2022), DC Output: "12 V DC nominal,
    25 Amps max (300 watts)". No ambient is stated with it.
  face-features: >-
    photo-measured from the PS3006 data sheet's face-on photograph of the PS3006D, at
    6.88 px/mm across and 6.76 down (the plate's own outline against 52.5 x 130.2). Dark
    features were segmented and read as boxes: display window 44.6 x 54.0 from y 23.7,
    joystick 18.8 across centred 28.6, 92.8, three vent banks of 3.0 mm slots, a vertical
    micro-USB receptacle, and the pull handle 34 x 7.5 at y 121.9.
  screws: >-
    the two captive thumbscrews sit on the SLOT CENTRES, 12.88 and 39.64 from the plate's
    left edge. On the chassis photograph all sixteen thumbscrews across the face fit one
    straight line of 26.76 mm pitch to 1.65 px, which is what identifies them as slot
    centres; the data sheet photograph reads both 0.6-0.7 mm left of that, the same offset
    for both, which is the plate edge read and not the screws.
  face-revision: >-
    THIS IS THE CURRENT FACE, with a micro-USB port. The chassis photograph on the HT3580H
    sheet shows an older face with a 3.5 mm jack legended "Serial" in the same corner and
    the vent slots arranged differently. The PS3006 sheet's text says micro-USB twice
    ("Front panel micro-USB port"), so its photograph is taken as current. The older face
    is recorded as a gap on the CH3000 device rather than drawn.
  display: >-
    the data sheet calls it a "front panel fluorescent display". The chassis photograph
    shows it lit with four lines - "Slot  2", "PS3006D", "Slot:<>", "Sel :v" - each seven
    cells wide, and the unlit panel in the PS3006 photograph resolves a seven-column
    grid. The schema's display is one row, so `characters: 7` states a row and the four
    rows are this sentence.
elements:
  screw-1: {at: [7.98, 0.1], size: [9.8, 9.8], class: fastener}
  screw-2: {at: [34.74, 0.1], size: [9.8, 9.8], class: fastener}
  display: {at: [3.6, 23.7], size: [44.6, 54.0], class: display, characters: 7}
  joystick: {at: [19.3, 83.4], size: [18.6, 18.6], class: button}
  vent-left: {at: [3.5, 90.8], size: [28.9, 21.5], class: vent}
  vent-right: {at: [43.2, 98.5], size: [7.4, 14.1], class: vent}
  handle: {at: [7.6, 121.9], size: [34.0, 7.5], class: handle}
parts:
  - {ref: std/micro-usb@1, id: usb, at: [33.8, 106.3], rotate: 90, attrs: {role: console}}
connection-points:
  mate: {at: [26.26, 65.1], direction: front}
skins: [default]
