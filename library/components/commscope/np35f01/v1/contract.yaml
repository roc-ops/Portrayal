format: 1
kind: module
name: np35f01
version: 1.0.0
class: filter
behaviour: fills
profile: optical
description: >-
  CommScope (ARRIS) NP35F01 - single-channel DWDM add/drop filter on the 100 GHz ITU grid: the channel port, the DWDM pass-through and the common port. A passive half-depth module for the CH3000: it seats in
  the front or the rear half of a slot.
size: {w: 25.76, h: 130.2, d: 165.1}
size-confidence: {w: borrowed, h: photo-measured, d: datasheet}
fields:
  model:
    label: the part number printed under the title (the channel group is part of it)
    type: text
    default: ''
  channel:
    label: ITU channel number printed at the channel port
    type: text
    default: ''
attrs:
  model: NP35F01
  role: passive
provenance:
  size: >-
    width borrowed - one CH3000 slot pitch less the faceplate gap (26.76 - 1.0), the width
    every single-width face in this chassis has. Height photo-measured: the NP35F01 single-channel DWDM filter data sheet (p1 photograph of an NP35F01S21, 199 x 583)
    outlines the face at a height within 3% of 130.2 at the width's scale. Depth datasheet -
    "6.5 D", 165.1 mm, a half-depth module.
  face-features: >-
    photo-measured on the same photograph, normalised to the 25.76 x 130.2 face: a thumbscrew
    top and bottom on the centre line, the title DWDM over the part number, and SC/APC
    adapters mounted on their sides - green bodies 0.8-19.8 across with a yellow laser
    shutter - on a 10.55 pitch, legended Ch. xx, DWDM, COM at their right. The photograph is small
    (4.5 to 8 px/mm), so positions are good to about half a millimetre.
  printed-numbers: >-
    the part number and the channel numbers are printed per unit (the ordering code carries
    the channel group), so they are fields, set per module; left empty they print nothing.
  seating: >-
    datasheet - "Occupies one half-depth slot"; the chassis data sheet gives 32 half-depth
    slots, 16 front-loaded and 16 rear-loaded, so the module is accepted by a slot's front
    bay and its rear bay alike.
  power: >-
    passive - no power figure; the data sheet gives optical characteristics only.
elements:
  screw-top: {at: [8.48, 0.6], size: [8.8, 8.8], class: fastener}
  adapter-ch: {at: [0.8, 18.65], size: [19.0, 10.3], class: port}
  adapter-dwdm: {at: [0.8, 29.05], size: [19.0, 10.3], class: port}
  adapter-com: {at: [0.8, 50.45], size: [19.0, 10.3], class: port}
  screw-bottom: {at: [8.48, 120.8], size: [8.8, 8.8], class: fastener}
parts:
  - {ref: std/sc-bore@1, id: ch, at: [6.50, 19.30], rotate: 90, attrs: {connector: SC/APC}}
  - {ref: std/sc-bore@1, id: dwdm, at: [6.50, 29.70], rotate: 90, attrs: {connector: SC/APC}}
  - {ref: std/sc-bore@1, id: com, at: [6.50, 51.10], rotate: 90, attrs: {connector: SC/APC}}
connection-points:
  mate: {at: [12.88, 65.1], direction: front}
skins: [default]
