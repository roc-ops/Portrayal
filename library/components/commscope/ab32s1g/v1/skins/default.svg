<svg xmlns="http://www.w3.org/2000/svg" width="25.76mm" height="130.2mm" viewBox="0 0 25.76 130.2">
  <!-- AB32S1G face, 25.76 x 130.2 (see contract). F jacks are std/f-type@1 and lamps
       common/led-dot@1, composed. -->
