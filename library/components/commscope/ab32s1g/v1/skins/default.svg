    <text x="9.2" y="21.4" font-size="1.5">A</text><text x="9.2" y="25.3" font-size="1.5">B</text>
    <path d="M 14.2 20.8 H 15.2 L 16.6 22.75 L 15.2 24.7 H 14.2 M 16.6 22.75 H 18.0" fill="none" stroke="#eef0f2" stroke-width="0.22"/>
