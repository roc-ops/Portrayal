  screw-1: {at: [7.98, 0.1], size: [9.8, 9.8], class: fastener}
  screw-2: {at: [34.74, 0.1], size: [9.8, 9.8], class: fastener}
  vent-main: {at: [6.5, 28.4], size: [23.9, 82.1], class: vent}
  vent-lower: {at: [31.8, 64.5], size: [11.3, 35.4], class: vent}
  handle: {at: [7.7, 121.8], size: [32.6, 7.3], class: handle}
parts:
  - {ref: common/led-dot@1, id: led-status-ok, at: [36.8, 30.6], attrs: {function: status, color: green}}
  - {ref: common/led-dot@1, id: led-status-minor, at: [36.8, 35.4], attrs: {function: status, color: yellow}}
  - {ref: common/led-dot@1, id: led-status-major, at: [36.8, 39.2], attrs: {function: status, color: red}}
  - {ref: common/led-dot@1, id: led-access, at: [36.8, 48.8], attrs: {function: activity, color: blue}}
  - {ref: common/led-dot@1, id: led-backup-psu, at: [36.8, 58.4], attrs: {function: redundancy, color: green}}
  - {ref: std/micro-usb@1, id: usb, at: [32.2, 106.7], rotate: 90, attrs: {role: console}}
