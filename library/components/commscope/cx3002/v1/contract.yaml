format: 1
kind: module
name: cx3002
version: 1.0.0
class: supervisor
behaviour: fills
profile: optical
description: >-
  CommScope (ARRIS) CX3002 - the communications module of a CH3000 chassis, fitted in the top of a power supply's BP-P1 or BP-P2 back plate with no slot of its own: two 10BASE-T RJ-45 ports (IN and OUT, for daisy-chaining chassis), CLI and EXT RS-232 jacks, Status and Access lamps and a reset.
size: {w: 52.52, h: 43.2}
size-confidence: {w: datasheet, h: datasheet}
attrs:
  model: CX3002
  role: communications
  power-draw-max-w: 5
provenance:
  size: >-
    datasheet - CX3002 data sheet, "8.1 D x 1.7 H x 2.0 W (20.6 cm x 4.3 cm x 5 cm)",
    installed in the rear of a power supply's back plate with no chassis slot of its own;
    the width is taken as the plate's 52.52, the 2.0 in being the module's nominal width.
    NO DEPTH IS GIVEN: the module sits on top of the supply's 4.3 in body at the rear, a
    space the model's full-height supply box does not leave free, so 8.1 in (205.7 mm)
    drawn as a box would cross a 330 mm PS3006 / PS3248 in 3D. The back plates it sits in
    state none either.
  power: >-
    datasheet - CX3002 data sheet, "Power Consumption 5W". The vendor does not say typical or maximum, so it
    is filed as the maximum.
  mounting: >-
    datasheet - the module "mounts on top of any power supply from rear of chassis" and is
    installed in the BP-P1 or BP-P2 back plate; the CX3003C data sheet's p3 photograph shows
    one seated at the top of a PSU back plate, above its fan grille. It is the `comms` bay
    of commscope/bp-p1@1 and commscope/bp-p2@1.
  face-features: >-
    photo-measured on the CX3002 data sheet's photograph of the face (900 x 538 px), which is
    close to face-on: the face is 638 px across, 12.15 px/mm, and 43 mm tall at that scale -
    the whole 1.7 in, with no heatsink above it. The legend CX3002 between two thumbscrews
    (drawn at the back plate's own screw centres, 13.4 and 39.6, which they replace); STATUS
    over three lamps and ACCESS under a fourth at 4.8 across, 18.5 to 26.6 down; a ganged pair
    of RJ-45s legended OUT - 10 BASE-T - IN, 8.6-43.2 across and 13.4-28.4 down; CLI and EXT
    RS-232 stereo jacks centred 17.7 and 34.2 across at 32.8; and a RESET hole at 47.9, 27.0.
  lamps: >-
    datasheet - Status LEDs: green = OK, yellow = non-service-affecting alarm (or alarm
    history present), red = service-affecting alarm; the Access lamp is not described.
