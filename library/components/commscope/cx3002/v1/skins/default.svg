<svg xmlns="http://www.w3.org/2000/svg" width="52.52mm" height="43.2mm" viewBox="0 0 52.52 43.2">
  <!-- CX3002 face, 52.52 x 43.2 (see contract). RJ45s are common/rj45-eth@1, lamps
       common/led-dot@1 and the micro-USB std/micro-usb@1, composed; the stereo RS-232
       jacks are drawn here. -->
  <rect id="body" x="0" y="0" width="52.52" height="43.2" rx="0.8" fill="#1d1f22" stroke="#0c0d0e" stroke-width="0.3"/>
  <g id="screw-1"><circle cx="13.4" cy="6.2" r="4.4" fill="#0e0f10"/><circle cx="13.4" cy="6.2" r="2.8" fill="#26282b"/></g>
  <g id="screw-2"><circle cx="39.6" cy="6.2" r="4.4" fill="#0e0f10"/><circle cx="39.6" cy="6.2" r="2.8" fill="#26282b"/></g>
  <rect x="8.6" y="13.4" width="34.6" height="15.0" rx="0.4" fill="#b9bdc1" stroke="#6d7277" stroke-width="0.3"/>
  <g id="rs232-cli"><rect x="14.00" y="29.10" width="7.4" height="7.4" rx="0.8" fill="#161719"/><circle cx="17.7" cy="32.8" r="2.6" fill="#2a2c2f" stroke="#55585c" stroke-width="0.4"/><circle cx="17.7" cy="32.8" r="1.2" fill="#08090a"/></g>
  <g id="rs232-ext"><rect x="30.50" y="29.10" width="7.4" height="7.4" rx="0.8" fill="#161719"/><circle cx="34.2" cy="32.8" r="2.6" fill="#2a2c2f" stroke="#55585c" stroke-width="0.4"/><circle cx="34.2" cy="32.8" r="1.2" fill="#08090a"/></g>
  <g id="reset"><circle cx="47.9" cy="27.0" r="0.8" fill="#08090a" stroke="#6d7277" stroke-width="0.2"/></g>
  <g id="silkscreen" fill="#eef0f2" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="26.3" y="7.0" font-size="2.6">CX3002</text>
    <text x="5.3" y="12.6" font-size="1.7">STATUS</text>
    <text x="5.3" y="31.0" font-size="1.7">ACCESS</text>
    <text x="26.0" y="12.8" font-size="1.7">OUT — 10 BASE-T — IN</text>
    <text x="17.7" y="38.4" font-size="1.7">CLI</text>
    <text x="17.7" y="40.4" font-size="1.7">RS232</text>
    <text x="34.2" y="38.4" font-size="1.7">EXT</text>
    <text x="34.2" y="40.4" font-size="1.7">RS232</text>
    <text x="47.7" y="31.0" font-size="1.7">RESET</text>
    <path d="M 3.2 17.2 V 24.6 M 3.2 25.8 V 29.6 H 4.2" fill="none" stroke="#eef0f2" stroke-width="0.2"/>
  </g>
</svg>
