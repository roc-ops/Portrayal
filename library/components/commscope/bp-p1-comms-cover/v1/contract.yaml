format: 1
kind: component
name: bp-p1-comms-cover
version: 1.0.0
class: blank
profile: optical
description: >-
  The blank that fills the communications-module position at the top of a CommScope
  BP-P1 back plate when no CX3002, CX3003C or CX3033N is fitted: the plate's two top
  thumbscrews, its BP-P1 legend and the blank cover, and the top of the fan grille the
  module would hang over. Not a part the vendor numbers - it is the plate's own art in the
  bp-p1's `comms` bay, so a pulled cover or a fitted module replaces it.
size: {w: 52.52, h: 43.2}
size-confidence: {w: borrowed, h: datasheet}
provenance:
  size: >-
    datasheet - the CX modules' "8.1 D x 1.7 H x 2.0 W" (43.2 mm tall) is the position this
    fills; the width is the plate's.
  art: >-
    drawing - the PS3006 data sheet's p3 drawing of the BP-P1: thumbscrews centred 13.4 and 39.6 at 6.2, the legend between them, the
    blank 14.3-35.8, and the lower panel from 37.0 with its grille slots from 38.2.
elements:
  screw-1: {at: [8.5, 1.3], size: [9.8, 9.8], class: fastener}
  screw-2: {at: [34.7, 1.3], size: [9.8, 9.8], class: fastener}
  blank: {at: [2.0, 14.3], size: [48.5, 21.5], class: blank}
connection-points:
  mate: {at: [26.26, 21.6], direction: front}
skins: [default]
