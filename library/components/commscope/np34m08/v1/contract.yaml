description: >-
  CommScope (ARRIS) NP34M08 - 8-channel CWDM multiplexer with cascade input, integrated 1310 nm combiner and -20 dB test port on LC/APC: INP, COM, TP and 1310, and eight channel inputs, in three blocks of four. A passive half-depth module for the CH3000: it seats in
  the front or the rear half of a slot.
