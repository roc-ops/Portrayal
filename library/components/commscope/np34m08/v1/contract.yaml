provenance:
  size: >-
    borrowed - one CH3000 slot pitch less the faceplate gap (26.76 - 1.0), and the chassis
    face's 130.2, the face every single-width module here takes; the NP34M08 8-channel CWDM multiplexer data sheet (p1 photograph of an NP34M08, 217 x 825)
    agrees with it in aspect within a few percent, a check rather than a measurement. Depth
    datasheet - "6.5 D", 165.1 mm, a half-depth module.
  face-features: >-
    photo-measured as fractions of the face: the photograph is normalised to 25.76 x 130.2
    and the LC/APC adapters found by colour (their green or blue bodies and yellow laser
    shutters), which gives each row's position to about half a millimetre; the legends are
    read off the same photograph. Each block is two horizontal duplex LC adapters stacked, composed as common/lc-duplex-v-adapter@6 turned 90 degrees (13.75 x 9.28 against the photographed rows); its four ports are legended above and below. Channel wavelengths are fields.
  seating: >-
    datasheet - "Occupies one half-depth slot"; accepted by a slot's front bay and its rear
    bay alike, per the chassis data sheet's 16 front-loaded and 16 rear-loaded half-depth
    slots.
  power: >-
    passive - no power figure; the data sheet gives optical characteristics only.
