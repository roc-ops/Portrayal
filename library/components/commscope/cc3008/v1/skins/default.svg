<svg xmlns="http://www.w3.org/2000/svg" width="51.92mm" height="19.3mm" viewBox="0 0 51.92 19.3">
  <!-- CC3008 face, 51.92 x 19.3, photo-measured on the HT3580H data sheet's p1 chassis
       front (see contract). The micro-USB is std/micro-usb@1 and the lamps common/led-dot@1,
       composed. -->
  <rect id="body" x="0" y="0" width="51.92" height="19.3" rx="0.8" fill="#5f6368" stroke="#3a3d41" stroke-width="0.2"/>
  <path id="lip" d="M 0 16.0 H 44.0 Q 45.5 16.0 46.2 17.4 L 47.0 19.3 H 0 Z" fill="#4a4e53"/>
  <rect x="41.9" y="0.6" width="9.6" height="15.0" rx="1.4" fill="#676b70" stroke="#4a4e53" stroke-width="0.2"/>
  <g id="screw">
    <circle cx="47.4" cy="5.4" r="3.3" fill="#1b1d20"/>
    <path d="M 45.0 6.6 L 49.8 4.2" stroke="#3a3d41" stroke-width="0.7"/>
  </g>
  <rect x="8.4" y="7.4" width="9.0" height="4.0" rx="1.0" fill="#3f4247"/>
  <g id="silkscreen" fill="#eef0f2" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="5.2" y="7.0" font-size="2.2" transform="rotate(-90 5.2 7.0)">CC3008</text>
    <text x="12.9" y="4.1" font-size="1.9" transform="rotate(-45 12.9 4.1)">Micro</text>
    <text x="14.4" y="5.6" font-size="1.9" transform="rotate(-45 14.4 5.6)">USB</text>
    <path d="M 18.8 7.8 V 6.8 H 29.9 V 7.8" fill="none" stroke="#eef0f2" stroke-width="0.22"/>
    <text x="24.8" y="5.8" font-size="1.9" transform="rotate(-45 24.8 5.8)">Status</text>
    <text x="34.2" y="6.4" font-size="1.9" transform="rotate(-45 34.2 6.4)">Access</text>
    <text x="38.6" y="7.6" font-size="1.9" transform="rotate(-45 38.6 7.6)">Fan</text>
  </g>
</svg>
