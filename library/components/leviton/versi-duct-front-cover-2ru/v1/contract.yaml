format: 1
kind: component
name: versi-duct-front-cover-2ru
version: 1.0.0
class: mechanical
behaviour: mounts
description: >-
  The snap-on cover of the front channel of a Leviton 2RU VERSI-DUCT horizontal duct, seen from
  the front - a PVC plate across the channel with a lip along its top and bottom that fits
  over the tips of the fingers. It ships fitted ("with black covers") and is pushed down and
  rotated off. The same part on the 492RU-HFR and the 492RU-HFO.
provenance:
  size: >-
    drawing - Leviton's 492RU-HFR and 492RU-HFO dimensional drawings (DXF): the side view's
    outline is 3.38 in [85.9mm] high at the cover and the finger tips it clips to (1.3 to 87.3
    on the 492RU-HFR), the specification sheet's page 2 labels the same "3.38"" on its side
    view of the 2RU duct; and 17.5 in [444.5mm] wide, the specification sheet's top view
    dimension and the body between the plate's folds.
  relief: >-
    drawing - the top view: the cover covers the front 22.8 mm of the duct (horizontal lines at
    18.95 and 22.80 across the width), and the side view's front plate is 3.65 mm thick (the
    drawing's line at 3.65). The lips' 1.5 mm thickness is estimated: no view dimensions the
    cover's section. The reference of this part is the cover's rear edge, 22.8 mm from the
    front, so a placement lifts it by the well's depth less 22.8.
  fitting: >-
    datasheet - Leviton's instruction sheet (Versi-Duct Slotted Duct System, horizontal
    slotted duct, step 2): align the cover's left and right sides with the duct, fit it over
    the top of the duct fingers, push down and rotate it to the other side "until it snaps
    into place". The specification sheet calls it a "snap-on duct cover". A hinge,
    49265-HNG, is a separate accessory.
  color: >-
    datasheet - the ducts are sold "with black covers". The drawing is line work, so the shade
    is this library's render, a little lighter than the duct so the two read apart.
size: {w: 444.5, h: 85.9}
size-confidence: {w: drawing, h: drawing}
attrs: {material: PVC, flammability: UL 94V-0}
elements:
  lip-top: {at: [0.0, 0.0], size: [444.5, 1.5], class: bezel}
  lip-bottom: {at: [0.0, 84.4], size: [444.5, 1.5], class: bezel}
  plate: {at: [0.0, 0.0], size: [444.5, 85.9], class: bezel}
relief:
  features:
    - node: lip-top
      out: 22.8
      color: '#303336'
      confidence: estimated
      source: the top view of the 492RU-HFR drawing, the cover over the front 22.8 mm; the lip's thickness is not dimensioned
    - node: lip-bottom
      out: 22.8
      color: '#303336'
      confidence: estimated
      source: the top view of the 492RU-HFR drawing, the cover over the front 22.8 mm; the lip's thickness is not dimensioned
    - node: plate
      lift: 19.15
      out: 22.8
      color: '#303336'
      confidence: drawing
      source: the side view of the 492RU-HFR drawing, the front plate 3.65 mm thick
skins: [default]
