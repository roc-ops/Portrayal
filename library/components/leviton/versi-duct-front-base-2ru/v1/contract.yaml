name: versi-duct-front-base-2ru
version: 1.0.0
class: mechanical
description: >-
  The mounting plate of a Leviton 2RU VERSI-DUCT horizontal duct seen from the front, between
  the ear folds - drawn as the well the front channel's two walls of fingers stand in, its
  floor the front face of the plate. The same part on the 492RU-HFR and the 492RU-HFO.
provenance:
  size: >-
    drawing - the front, side and top views of Leviton's 492RU-HFR and 492RU-HFO
    dimensional drawings (DXF). The plate is 19.0054 in [482.74mm] wide over its ears and
    3.475 in [88.27mm] high; the body between the ears' folds is the 444.5 mm from 19.15 to
    463.65 on the top view, 88.3 high. Both drawings draw the same plate.
  depth: >-
    drawing - 81.4. The side view puts the plate's front face at 81.41 mm from the front of the
    duct and its back face at 84.45, the 3.3247 in [84.45mm] the top view dimensions to the
    plane the ears bolt to, so the plate is 3.04 mm thick; the well is the 81.4 in front of
    that face. The 492RU-HFO ends at the plate: its depth is the 3.325 in [84.46mm].
  color: >-
    datasheet - "PVC rated for 94V-0", ducts "with black covers"; the shade is this library's
    render of black PVC.
