format: 1
kind: component
name: 49253-bcm-ring
version: 1.0.1
class: mechanical
description: >-
  A steel distribution ring of the Leviton 49253-BCM 2RU five-ring manager seen from the
  front - a flat-bar loop welded to the panel that stands 4 in out of it, 9.5 mm across and
  3 in high, its front end two overlapping legs that leave a 9.5 mm slit a patch cord is
  laid in through
provenance:
  edge: >-
    drawing - the front view of the 49253-BCM drawing draws each bar's corners as 1.17 mm
    [0.046 in] arcs, and the front views of the 49253-LPM and 49253-6MR drawings add a flat
    face 7.19 mm across and a line across it 5.59 mm [0.22 in] in from each end. The skin
    draws the radii, the 1.17 mm edge band and the two seam lines over the legs; the seams
    are read on those two drawings and carried to this ring, whose own front view has the
    same arcs.
  face-colour: >-
    estimated - the face is drawn a lighter value than the panel so the ring reads against it
    in 2D. Satin black powder coat catches the light the panel does not; no document states
    a reflectance, so the shade is a render choice and not a measured one.
  size: >-
    drawing - the front view of Leviton's 49253-BCM dimensional drawing (DXF): each ring is
    a band 9.5 mm across and 76.2 mm [3.00 in] high, from 5.95 to 82.15 mm up the 88.1
    plate, centred on it, at the same five positions across as the 49253-LPM's (107.6 mm
    apart, the middle one on the centre line).
  relief: >-
    drawing - the side view of the same drawing: the loop is a bar 3.175 mm [1/8 in] thick
    bent to a rectangle 101.6 mm out of the plate and 76.2 high. Its back leg stands on the
    plate; its top bar runs out 88.9 mm to the inner leg, which hangs from it 3.5 in
    [88.9mm] out, 44.45 mm down (z 85.7 to 88.9); its bottom bar runs the full 101.6 and
    turns up into the outer leg at the front, 44.45 mm up (z 98.4 to 101.6). The legs overlap
    over 12.7 mm of the height with 9.5 mm between them. Built as plates with square
    corners where the real bar is bent to a radius. It is the 49253-LPM's loop made taller:
    the legs' lengths and the bars' places are all that change.
  slit: >-
    drawing - the 9.5 mm between the inner leg's outer face and the outer leg's inner face
    in the side view, over the 12.7 mm where the legs overlap in height. A cord is laid in
    through it and not routed along it. The specification sheet labels the inner leg's
    position "76.2 mm [3.50 in]", which is 3.00 in; the drawing reads 3.50 in and the leg
    is 88.9 mm from the plate, which is what is taken.
  guide: >-
    drawing - the clear opening inside the loop on the side view: 69.85 mm [2.75 in] high
    between the bars and 82.55 mm [3.25 in] deep. Leviton's application note (page 10)
    gives the usable area of the ring as 2.75 in x 3.250 in, 8.9 sq in. Seen looking along
    the panel, which is the run: `w` is the height and `h` the depth out of the panel.
    The slit is not counted as opening.
  guide-depth: >-
    drawing - the ring is a band 9.5 mm across along the run, as the front view draws it.
  material: >-
    datasheet - "16-gauge steel, black powder coated" on the specification sheet, which
    also says the rings are "radius-edged"; the plates here have square edges.
  color: >-
    datasheet - "black powder-coat finish" on the specification sheet. The drawing is line
    work, so the shade is this library's render.
