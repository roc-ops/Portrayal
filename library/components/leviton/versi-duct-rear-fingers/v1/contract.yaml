format: 1
kind: component
name: versi-duct-rear-fingers
version: 1.0.1
class: mechanical
description: >-
  One wall of fingers of a Leviton VERSI-DUCT front-and-rear duct's rear channel seen from
  behind - the PVC wall along the top or bottom of the channel, ten fingers end-on with a
  slot a cable is laid in through between each pair. The same part on the 491RU-HFR and
  492RU-HFR, at the top and at the bottom of the channel.
provenance:
  size: >-
    drawing - the top view of Leviton's 492RU-HFR dimensional drawing (DXF): the rear
    channel's slots are the front channel's, nine of 22.45 mm on a 49.375 mm pitch, the
    same vertical lines running through both in the drawing, so the fingers are 26.925
    wide and the two end fingers 13.5 and 13.55. The wall is 2.54 mm [0.1 in] thick: the
    side view's wall lines (18.75 to 21.29 and 67.01 to 69.55 on the 492RU-HFR; 4.91 to
    7.45 and 40.47 to 43.01 on the 491RU-HFR).
  relief: >-
    drawing - the top view: the rear slots run from the tips of the fingers, 23.1 mm from the
    rear end of the duct (231.5 from its front), forward to the base of the channel, which
    the top view ends 162.45 from the front; the channel's floor is 95.25 mm [3.75 in] from
    the rear end, the application note's depth for the rear channel, so a finger stands 72.15
    mm out of it. Built as plates with square corners.
  slot-root: >-
    drawing - the top view of the 492RU-HFR drawing rounds each slot's root with arcs of
    0.25 in [6.35mm] on the inner edge and 0.28 in [7.11mm] on the outer, as it does the front
    channel's. The relief builds plates and cannot curve, so each slot side carries one step
    2.5 mm wide and 3.0 deep: estimated, a stand-in for the arc and not its section.
  foot: >-
    estimated - the side view draws each wall rolling into the plate along its whole length,
    so a foot 0.8 mm deep joins the ten fingers to each other and to the base. No section
    says how the slots end there, so the depth is a stand-in; the slot roots stay open
    above it.
  color: >-
    datasheet - "PVC rated for 94V-0"; the drawing is line work, so the shade is this
    library's render of black PVC.
size: {w: 444.5, h: 2.54}
size-confidence: {w: drawing, h: drawing}
attrs: {material: PVC, flammability: UL 94V-0}
