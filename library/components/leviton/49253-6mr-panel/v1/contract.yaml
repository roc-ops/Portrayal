provenance:
  size: >-
    drawing - the front and top views of Leviton's 49253-6MR dimensional drawing (DXF). The
    plate is 19.00 in [482.6mm] wide and 3.47 in [88.1mm] high; its top and bottom edges
    fold back from 0.75 in [19.05mm] inside each end to 17.5 in [463.55mm], so this part
    is the 444.5 mm between the folds.
  depth: >-
    drawing - 152.4. The top view dimensions the plate's front face 152.4 mm [6.00 in]
    behind the ring tips; its back face is 1.5 further and the folds reach 11.2 behind that,
    165.1 mm [6.50 in] overall, the drawing's two dimensions.
  holes: >-
    drawing - ten round holes 4.58 mm across stand in two columns 52.3 mm apart behind
    each ring's middle (the rear view of the drawing); the ring's own fixing, which no
    document names.
  color: >-
    datasheet - "16-gauge steel with a black powder-coat finish" on the specification
    sheet; the drawing is line work, so the shade is this library's render of black.
