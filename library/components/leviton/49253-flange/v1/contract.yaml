name: 49253-flange
version: 1.0.0
class: mechanical
description: >-
  The top or bottom flange of a Leviton 49253 five-ring manager seen from above or below -
  the panel's edge folded back behind the rack rails, which stiffens it - drawn as the well
  that builds it one sheet in from the top or bottom of the envelope. The same part on all
  five managers.
provenance:
  size: >-
    drawing - 444.5 wide: the top view of each 49253 dimensional drawing (DXF) draws the
    fold from 0.75 in [19.05mm] to 17.5 in [463.55mm] across the 19.00 in [482.6mm] plate,
    on all five managers alike. 12.7 deep: the plate's 1.5 and the fold's 11.2 behind its
    back face, from the plate's front face to the back of the envelope (the 4.50 in
    [114.3mm] overall less the 4.00 in [101.6mm] of ring on the 4 in managers; the 2 in and 6
    in managers read 63.5 - 50.8 and 165.1 - 152.4, the same 12.7).
  depth: >-
    drawing - 1.5 mm, the sheet: the side view of 49253-LPM draws the fold two lines 1.5
    apart (y 0 to 1.5 at the bottom, 42.15 to 43.7 at the top), as the plate's own
    101.6 to 103.1 in the top view. 16-gauge steel, the specification sheet's material.
  color: >-
    datasheet - "16-gauge steel with a black powder-coat finish" on the specification
    sheet, "Color: Black" on the product page.
