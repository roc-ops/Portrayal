format: 1
kind: component
name: 49265-dc2
version: 1.0.0
class: mechanical
behaviour: mounts
description: >-
  The 2RU front cover of the Leviton 49265-DC2 gray designer cover pack for the 2RU VERSI-DUCT
  horizontal ducts, seen from the front. It is a PVC cover that snaps on across the front
  channel in place of the black cover. The pack also holds a 1.5RU rear cover, which is not
  modelled.
provenance:
  size: >-
    datasheet - Leviton's specification sheet (Product Specifications 491RU-HFx, 492RU-HFx,
    49265-xxx), page 2, the figure "Designer Cover, 2RU": 17.50 in [444.5mm] wide on the front
    view and 0.99 in [25.1mm] deep on the side view, both printed on the page. THE HEIGHT, 3.39
    in [86.1mm], IS NOT PRINTED ON THE VISIBLE PAGE. The page layout clips the left edge of the
    front view, leaving only the two tick marks of its height dimension, and the label "3.39"" is
    in the PDF's text layer beside them, outside the page's visible area. The two ticks,
    measured on a 600 dpi render at the drawing's own scale (the printed 17.50 in width), are
    3.37 in apart, which agrees to 0.02 in. The side view's own height measured the same way is
    3.37 in.
  relief: >-
    datasheet - the depth 0.99 in [25.1mm] is the page-2 side view's printed dimension, taken as
    the reach of the lips from the front of the plate. The side view is a C-shaped section: a
    plate dished toward the duct, a lip along its top and one along its bottom turning in
    toward the duct, each ending in a barb. estimated - the plate and lips are drawn 2.0 mm
    thick, which no view dimensions, and the plate is drawn flat at the front plane, where the
    drawing shows it dished (about 8 mm deep at the middle, read at the drawing's scale) and
    not dimensioned; the barbs are not drawn.
  fitting: >-
    estimated - the sheet says only "Gray snap-on covers", for the designer covers, and that the
    ducts "come with concealing covers"; the side view's barbed lips are the shape of a snap
    fit. It does not say that this cover replaces the black one. A channel's finger tips take
    one cover, so this library fits it in place of the black cover. The cover is 3.39 in high
    against the black cover's 3.38 in, and is centred on the duct's height. Its front is placed
    where the black cover's is, so its lips reach 2.4 mm further back than the black cover's:
    the black cover is 22.8 mm deep and this one 25.1, and nothing states how it seats. The
    reference of this part is the cover's rear edge, so a placement lifts it by the well's
    depth less 25.15.
  color: >-
    estimated - the sheet's part table says "Designer Cover, gray, 2RU*", and no shade is
    printed anywhere: the drawings are line work. The gray here is this library's render of a
    mid gray.
  logo-zone: >-
    reserved, not drawn - the maker's mark sits at the right end of the front view, 1.13 in
    [28.7mm] wide and 0.40 in [10.1mm] high, its left edge 15.36 in [390.2mm] from the left end
    and its top 1.49 in [37.8mm] from the top, centred on the height. The box is read on a 600
    dpi render of page 2 at the drawing's scale. The library reproduces no vendor logo.
