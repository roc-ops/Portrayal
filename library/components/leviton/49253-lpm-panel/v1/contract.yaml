format: 1
kind: component
name: 49253-lpm-panel
version: 1.0.0
class: mechanical
description: >-
  The flat steel panel of the Leviton 49253-LPM 1RU five-ring manager seen from the front -
  the plate between the ear zones, where its top and bottom edges fold back - drawn as the
  well its five rings stand in
provenance:
  size: >-
    drawing - the front and top views of Leviton's 49253-LPM dimensional drawing (DXF).
    The plate is 19.00 in [482.6mm] wide and 1.72 in [43.7mm] high (the drawing's two
    dimensions, which the specification sheet's page 2 repeats); its top and bottom edges
    fold back from 0.75 in [19.05mm] inside each end to 17.5 in [463.55mm], so the flat ends
    outside the folds are the ears, which this library does not draw, and this part is the
    444.5 mm between them.
  depth: >-
    drawing - 101.6. The top view dimensions the plate's front face 101.6 mm [4.00 in]
    behind the tips of the rings, so the plate's face is 101.6 behind the front of the
    envelope; its back face is 1.5 further (the sheet) and the folded edges reach 11.2
    behind that, 114.3 mm [4.50 in] overall.
  holes: >-
    drawing - ten round holes 4.58 mm across stand in two columns 14.2 mm apart behind
    each ring's middle (the rear view of the drawing); they are the ring's own fixing, which
    no document names, and with the rings fitted nothing of them shows on the front.
  color: >-
    datasheet - the specification sheet states "16-gauge steel with a black powder-coat
    finish" and the product page "Color: Black". The drawing is line work, so the shade is
    this library's render of black.
size: {w: 444.5, h: 43.7, d: 101.6}
size-confidence: {w: drawing, h: drawing, d: drawing}
relief: {wall: '#1b1d20'}
elements:
  plate: {at: [0.0, 0.0], size: [444.5, 43.7], class: bezel}
