<svg xmlns="http://www.w3.org/2000/svg" width="9.5mm" height="38.1mm" viewBox="0 0 9.5 38.1">
  <!-- one ring from the front, end-on: the loop's bars along the top and
       bottom, and at the front the two overlapping legs, the inner hanging from
       the top bar and the outer rising from the bottom bar. The drawing's front
       view outlines the bar with a 1.17 mm radius edge on every corner and a flat
       face 7.19 mm across inside it, and ends the face 5.59 mm in from each end
       where the bar turns away: the edges and the two seams are drawn over the
       legs so the ring reads against the panel it stands on. The face is a lighter
       value than the panel because satin powder coat catches the light the panel
       does not; it is a render choice, not a measured colour. -->
  <rect id="back" x="0" y="0" width="9.5" height="38.1" rx="1.17" fill="#40454c"/>
  <rect id="bar-top" x="0" y="0" width="9.5" height="3.175" rx="1.17" fill="#40454c"/>
  <rect id="bar-bottom" x="0" y="34.925" width="9.5" height="3.175" rx="1.17" fill="#40454c"/>
  <rect id="leg-inner" x="0" y="0" width="9.5" height="25.4" rx="1.17" fill="#40454c"/>
  <rect id="leg-outer" x="0" y="12.7" width="9.5" height="25.4" rx="1.17" fill="#40454c"/>
  <rect id="edge-left" x="0" y="1.17" width="1.17" height="35.76" fill="#2a2e33"/>
  <rect id="edge-right" x="8.33" y="1.17" width="1.17" height="35.76" fill="#2a2e33"/>
  <rect id="edge-top" x="0" y="0" width="9.5" height="1.17" rx="0.6" fill="#2a2e33"/>
  <rect id="edge-bottom" x="0" y="36.93" width="9.5" height="1.17" rx="0.6" fill="#2a2e33"/>
  <rect id="seam-top" x="1.17" y="5.59" width="7.16" height="0.5" fill="#23262a"/>
  <rect id="seam-bottom" x="1.17" y="32.01" width="7.16" height="0.5" fill="#23262a"/>
</svg>
