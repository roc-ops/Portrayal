version: 1.0.1
class: mechanical
behaviour: mounts
description: >-
  The Leviton 49253-1CV 1RU metal cover for the 49253 five-ring horizontal managers, seen
  from the front - a plate 442.7 mm wide whose two ends fold back into pockets that hook
  over the outer two rings and slide down until the cover is seated. Sold separately from
  the manager.
provenance:
  size: >-
    drawing - Leviton's 49253-1CV dimensional drawing (DXF, linked on the product page as
    49253-1CV.DXF): 17.4296 in [442.7mm] wide by 1.72 in [43.7mm] high, the specification
    sheet's page 2 giving the same 442.7 mm [17.43 in] and 43.7 mm [1.72 in]. It is as
    tall as the 1RU panel and 1.8 mm narrower than the 444.5 between the panel's folds.
    The drawing's title block names the part 49253-2CV and its note "2RU METAL COVER";
    the dimensions are 1RU's, 43.7 high, and the 1CV file is taken as the 1RU cover.
  relief: >-
    drawing - the top view and right-end view of the same drawing, read at millimetres: the
    plate is 1.22 mm thick (the arcs' 1.98 and 0.76 radii) and stands 6.24 mm [0.2456 in]
    deep with its ends. Each end folds back over a rectangle 37.0 mm long (18.44 to 55.47
    on the drawing) and 26.9 mm high, centred on the height, into a pocket 3.81 mm across
    between the plate and a back tab 1.22 thick. A ring's leg 3.175 thick fits that pocket,
    and the instruction sheet (Horizontal Patch Cord Organizers and Covers, step 3) says to
    "align left and right side of the covers to outside split rings and slide downward
    until cover is fully seated". The pocket's ends are drawn as square folds where the
    drawing shows a radius, and the small notches in the tab's edge are not drawn.
  front: >-
    drawing - the front view of the 49253-1CV drawing: the plate [438.76mm, 17.274 in] wide
    from the strip's inner edge at 1.981 in and 43.7 high, its four corners arcs of 0.125 in [3.175mm], and at each
    end a strip 1.98 mm [0.077 in] wide and 26.9 high, centred on the height, standing out
    beyond the plate's edge: the fold that wraps round it. Between the strips the 17.430 in
    [442.7mm] overall is the plate and the two strips. Nothing else is drawn on the face but
    the maker's printed mark, which this library never draws, so the face is plain by the
    drawing and not by omission. The drawing also shows small notches along each back
    tab's edge, which are not drawn.
  placement: >-
    estimated - the reference of this part is the back of the tab. A placement lifts it by
    the ring depth of its manager less 6.25, so the plate's front face is flush with the
    ring tips and the manager's own depth holds. The drawing does not dimension how the
    pocket sits on a ring leg, and a plate in front of the tips would stand 1.22 mm
    outside the manager's envelope; this keeps the cover inside it, which puts the plate
    1.22 mm nearer the panel than that. The plate and the end strips are built 0.1 mm
    proud of that (an estimate, and the only one here): with the plate exactly flush the
    rings' front legs, which stand in the same 1.22 mm, share the plate's front plane and
    show through it in 3D. The plate keeps its 1.22 mm thickness.
  color: >-
    datasheet - "16-gauge steel with a black powder-coat finish" for the managers and "Metal
    covers" in the same sheet; the product page for the manager says "Color: Black". The
    drawing is line work, so the shade is this library's render, a little lighter than
    the manager so the two read apart.
