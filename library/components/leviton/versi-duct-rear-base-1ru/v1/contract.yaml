description: >-
  The base of the rear channel of the Leviton 491RU-HFR 1RU front-and-rear VERSI-DUCT seen
  from behind - the narrow end of the sloped section that joins the channel to the mounting
  plate - drawn as the well the rear channel's two walls of fingers stand in
provenance:
  size: >-
    drawing - the side and top views of Leviton's 491RU-HFR dimensional drawing (DXF): the
    rear channel is 1.5 in [38.1mm] high over its walls (4.91 to 43.01 on the side view,
    centred on the 47.9), and runs the 444.5 mm between the plate's folds. Leviton's
    application note (page 7) gives the rear channel's usable size as 1.125 in x 3.75 in,
    4.2 sq in.
  depth: >-
    drawing - 95.25, the application note's 3.75 in for the rear channel; the 491RU-HFR's rear
    walls (19.73 to 85.88 from the rear end on the side view) and slots agree with the
    492RU-HFR's, whose well is the same depth.
  color: >-
    datasheet - "PVC rated for 94V-0"; the shade is this library's render of black PVC.
