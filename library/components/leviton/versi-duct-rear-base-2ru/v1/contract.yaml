description: >-
  The base of the rear channel of the Leviton 492RU-HFR 2RU front-and-rear VERSI-DUCT seen
  from behind - the narrow end of the sloped section that joins the channel to the mounting
  plate - drawn as the well the rear channel's two walls of fingers stand in
provenance:
  size: >-
    drawing - the side and top views of Leviton's 492RU-HFR dimensional drawing (DXF): the
    rear channel is 2.0 in [50.8mm] high over its walls (18.75 to 69.55 on the side view,
    centred on the 88.3), and runs the 444.5 mm between the plate's folds. Leviton's
    application note (Maximum Cable Fill Ratios in Cable Managers, page 7) gives the rear
    channel's usable size as 1.625 in x 3.75 in, 6.1 sq in.
  depth: >-
    drawing - 95.25. The application note's 3.75 in [95.25mm] is the channel's depth, and
    the top view puts the base of the slots 162.45 mm from the front of the 254.63 duct,
    92.2 from the rear end, to which the 3.0 mm the sloped section meets the channel
    below it is added: taken as 95.25 so the well is the note's figure.
  color: >-
    datasheet - "PVC rated for 94V-0"; the shade is this library's render of black PVC.
