<svg xmlns="http://www.w3.org/2000/svg" width="444.5mm" height="43.9mm" viewBox="0 0 444.5 43.9">
  <!-- the gray designer cover from the front: one plain plate; its lips turn back over the
       finger tips and are not seen from here. The maker's mark is reserved, not drawn -->
  <rect id="plate" x="0" y="0" width="444.5" height="43.9" rx="1.5" fill="#8d9095"/>
  <rect id="lip-top" x="0" y="0" width="444.5" height="2" fill="#9a9da2"/>
  <rect id="lip-bottom" x="0" y="41.9" width="444.5" height="2" fill="#7d8084"/>
  <rect id="logo-zone" x="390.3" y="16.7" width="28.8" height="10.2" fill="none"/>
</svg>
