<svg xmlns="http://www.w3.org/2000/svg" width="442.7mm" height="88.1mm" viewBox="0 0 442.7 88.1">
  <!-- the cover from the front. The drawing's front view is the plate, 438.76 mm
       wide with its four corners rounded 3.175 mm, and at each end the fold that
       wraps round the plate's edge and back into the pocket: it stands 1.98 mm
       outside the plate's edge over the middle 65 mm of the height and is drawn
       here as a strip a little lighter than the plate because it curves away from
       the light. The pockets and back tabs are behind the plate and are listed so
       the 3D body can build them. The plate is drawn last, over them. -->
  <rect id="hook-left" x="0" y="11.55" width="37.03" height="65" fill="#25272a"/>
  <rect id="hook-right" x="405.67" y="11.55" width="37.03" height="65" fill="#25272a"/>
  <rect id="fold-left" x="0" y="11.55" width="1.22" height="65" fill="#25272a"/>
  <rect id="fold-right" x="441.48" y="11.55" width="1.22" height="65" fill="#25272a"/>
  <rect id="lip-left" x="0" y="11.55" width="1.98" height="65" rx="0.99" fill="#3a3d42"/>
  <rect id="lip-right" x="440.72" y="11.55" width="1.98" height="65" rx="0.99" fill="#3a3d42"/>
  <rect id="plate" x="1.98" y="0" width="438.74" height="88.1" rx="3.175" fill="#2a2c2f"/>
</svg>
