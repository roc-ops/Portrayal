groups:
  sfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: >-
      the eight uplink SFP cages, 1-4 1000BASE-X and 5-8 100BASE-FX / 1000BASE-X (5-8 are
      the optical side of the combo ports)
  base-t:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: >-
      the four combo RJ45s, 10/100/1000BASE-T, labelled 5-8 by Nokia (the electrical side
      of the combo ports; the group counts them 1-4, the label attr carries Nokia's number)
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: one lamp per SFP port, legends 1-8 bracketed PORT
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the board lamps ALM and PWR
