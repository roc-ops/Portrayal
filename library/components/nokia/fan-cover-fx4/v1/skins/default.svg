<svg xmlns="http://www.w3.org/2000/svg" width="33.1mm" height="213.5mm" viewBox="0 0 33.1 213.5">
  <!-- 7360 ISAM FX-4 fan cover, from 3FE64991BAAATQZZA02 p7 fig4 (vector, 1200 dpi).
       Local origin = shelf (413.6, 4.2). Legends read up the cover, as printed. -->
  <path id="face" fill-rule="evenodd" fill="#c9ccd0" stroke="#8d9298" stroke-width="0.35" d="M 0.6 0 H 32.5 A 0.6 0.6 0 0 1 33.1 0.6 V 212.9 A 0.6 0.6 0 0 1 32.5 213.5 H 0.6 A 0.6 0.6 0 0 1 0 212.9 V 0.6 A 0.6 0.6 0 0 1 0.6 0 Z M 18.2 194.5 A 1.9 1.9 0 1 0 14.4 194.5 A 1.9 1.9 0 1 0 18.2 194.5 Z"/>
  <rect x="1.2" y="1.2" width="30.7" height="211.1" rx="0.4" fill="none" stroke="#a7acb1" stroke-width="0.25"/>
  <g id="screw">
    <circle cx="18.0" cy="178.1" r="6.7" fill="#2b2e32" stroke="#15171a" stroke-width="0.3"/>
    <circle cx="18.0" cy="178.1" r="2.2" fill="#6f757b" stroke="#15171a" stroke-width="0.2"/>
    <path d="M 16.8 178.1 H 19.2 M 18.0 176.9 V 179.3" stroke="#15171a" stroke-width="0.35"/>
  </g>
  <!-- the lamp window is a HOLE in the face (evenodd, above), centred on the seated BFAN-X's
       status lamp, so the lamp shows through; this ring is only its rim -->
  <g id="lamp-window">
    <circle cx="16.3" cy="194.5" r="1.9" fill="none" stroke="#3a3f44" stroke-width="0.35"/>
  </g>
  <g id="silkscreen" font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#1d2023" text-anchor="middle">
    <path d="M 14.5 189.6 L 18.1 189.6 M 16.3 188.2 L 16.3 191.0" stroke="#1d2023" stroke-width="0.4" fill="none"/>
    <text x="20.9" y="133.9" font-size="6.6" transform="rotate(-90 20.9 133.9)">7360 ISAM FX-4</text>
    <text x="10.7" y="173.8" font-size="2.8" transform="rotate(-90 10.7 173.8)">NTA</text>
    <text x="10.7" y="147.4" font-size="2.8" transform="rotate(-90 10.7 147.4)">NTIO</text>
    <text x="10.7" y="119.7" font-size="2.8" transform="rotate(-90 10.7 119.7)">NTB</text>
    <text x="10.7" y="89.7" font-size="2.8" transform="rotate(-90 10.7 89.7)">01</text>
    <text x="10.7" y="64.8" font-size="2.8" transform="rotate(-90 10.7 64.8)">02</text>
    <text x="10.7" y="39.9" font-size="2.8" transform="rotate(-90 10.7 39.9)">03</text>
    <text x="10.7" y="15.7" font-size="2.8" transform="rotate(-90 10.7 15.7)">04</text>
  </g>
  <rect id="logo-zone" x="4.0" y="2.0" width="25.0" height="8.0" fill="none"/>
</svg>
