  ejector-right: {at: [382.2, 11.6], size: [18.3, 7.5], class: latch}
  aco: {at: [50.65, 12.35], size: [2.5, 2.5], class: button}
  clock-block: {at: [213.4, 3.0], size: [65.4, 14.6], class: label}
  alarm-block: {at: [283.8, 3.0], size: [65.4, 14.6], class: label}
  esd-mark: {at: [359.4, 2.5], size: [5.0, 4.8], class: marking}
relief:
  features:
    - {node: ejector-left, out: 4.2, color: '#dcdddd', confidence: estimated, source: 'an ejector lever standing off the plate, as nokia/fwlt-c@1; not dimensioned'}
    - {node: ejector-right, out: 4.2, color: '#dcdddd', confidence: estimated, source: as ejector-left}
groups:
  mgmt:
    term: Port
    role: management
    index-origin: 1
    description: the CRAFT port, an RS-232 serial management terminal on a female DE-9
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the clock interfaces of the shelf - 1PPS (in or out) and 10 MHz in on SMA, and 1PPS/ToD
      in, 1PPS/ToD out, BITS 1 and BITS 2 on RJ-45
  alarms:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the alarm interfaces of the shelf - external alarm I/O up and down on DA-15, and the
      rack lamp, rack door and RS-485 system alarm cascade (up and down) on RJ-45
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: PWR and ACO
  alarm-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: ALM, MIN, MAJ and CRI
