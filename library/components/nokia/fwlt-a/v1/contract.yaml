    - node: screw-top
      cyl: 6.0
      confidence: estimated
      source: >-
        a knurled thumbscrew head standing off the plate; nothing dimensions it. The same
        6.0 as nokia/dummy-lt@1, which is the same estimate, not a second reading
    - node: screw-bottom
      cyl: 6.0
      confidence: estimated
      source: as screw-top
    - node: ejector-top
      out: 4.2
      confidence: estimated
      source: >-
        edgecore/agr-psu-dc@1 latch - the library's one release-hardware figure, as
        nokia/fnio-d@1 uses; itself sourced for arrangement and not proudness
    - node: ejector-bottom
      out: 4.2
      confidence: estimated
      source: as ejector-top
    - node: lip-1
      facet: {deg: 26, facing: down}
      confidence: estimated
      source: >-
        drawing - the wedge lip under each cage opening, ANSI UDS R6.9 p314 Figure 142's
        right-hand orthographic profile: about 17 px (4.9 mm) proud at 3.444 px/mm, spanning
        the housing below the flange (+27.0 to +37.1 mm below the housing top). One
        part-less facet looking down, its proud edge at the opening's lower edge and its
        root on the plate at the housing's foot: atan(4.9 / 10.1) = 26 degrees, 4.93 mm
        proud
    - node: lip-2
      facet: {deg: 26, facing: down}
      confidence: estimated
      source: as lip-1
    - node: lip-3
      facet: {deg: 26, facing: down}
      confidence: estimated
      source: as lip-1
    - node: lip-4
      facet: {deg: 26, facing: down}
      confidence: estimated
      source: as lip-1
