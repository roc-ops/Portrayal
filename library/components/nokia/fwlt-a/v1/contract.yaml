  - {ref: common/led-dot@1, id: led-port-2, group: pon-leds, at: [2.44, 123.76], states: {lamp: ['off', {name: provisioned, color: '#f2c200'}, {name: active, color: '#39b54a'}, {name: active-ranging, color: '#39b54a', behavior: blinking}, {name: fault, color: '#d0021b'}]}}
  - {ref: common/led-dot@1, id: led-port-3, group: pon-leds, at: [2.44, 203.72], states: {lamp: ['off', {name: provisioned, color: '#f2c200'}, {name: active, color: '#39b54a'}, {name: active-ranging, color: '#39b54a', behavior: blinking}, {name: fault, color: '#d0021b'}]}}
  - {ref: common/led-dot@1, id: led-port-4, group: pon-leds, at: [2.44, 283.68], states: {lamp: ['off', {name: provisioned, color: '#f2c200'}, {name: active, color: '#39b54a'}, {name: active-ranging, color: '#39b54a', behavior: blinking}, {name: fault, color: '#d0021b'}]}}
