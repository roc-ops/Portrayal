relief:
  wall: '#8d9298'
  features:
    - node: tooth-1-return
      facet: {deg: 48, facing: up}
      confidence: estimated
      source: >-
        drawing (fractions only) - Figure 7 as tooth-1-face. The nine tooth lines (71.0 +
        27.72 n) are taken as the roots; the return closes the tooth above its face, and the
        split between them is set by the cage the figure centres 16.5 mm into each tooth:
        the face must start above the cage's foreshortened top (12.67 mm into the tooth) and
        the return must stay shallow enough that the cage, whose depth runs back along the
        face's normal, does not leave through it (return_h >= face_h x tan^2 40 = 11.12). A
        11.93 mm return at 48 degrees against a 15.79 mm face at 40 meets at a 13.25 mm apex
    - node: tooth-1-face
      facet: {deg: 40, facing: down}
      confidence: estimated
      source: >-
        drawing (fractions only) - UDS 3FE53711AAAATQZZA06 p11 Figure 7, the oblique 3D view
        rendered at 1200 dpi. Each cage's SFP is drawn with its long axis running (0.49,
        0.87) across and down the image; the view's out-of-plate axis is (0.956, 0.294) at
        7.98 px/mm (from the board's top edge, 225 mm) and its along-card axis is vertical
        at 11.93 px/mm, so an axis tipped DOWN from the plate normal by t draws at (0.956 x
        7.98 cos t, 0.294 x 7.98 cos t + 11.93 sin t): 40 degrees gives (0.52, 0.85) and 45
        gives (0.47, 0.88), so the cages point out and down at about 40 to 45 degrees and
        the port face looks down. 40 is taken, the most the tooth can hold with the cage
        left where the figure draws it (see tooth-1-return). The view's across and out axes
        draw almost parallel, so the tooth's own outline cannot be measured and this is the
        only reading
    - node: tooth-2-return
      facet: {deg: 48, facing: up}
      confidence: estimated
      source: as tooth-1-return
    - node: tooth-2-face
