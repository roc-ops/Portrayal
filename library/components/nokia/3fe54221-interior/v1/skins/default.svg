<svg xmlns="http://www.w3.org/2000/svg" width="260.1mm" height="312mm" viewBox="0 0 260.1 312">
  <!-- The back wall of the outdoor ONT enclosure as Product Guide Figures 5-11 and 5-13 draw it with the door open. The spools, the mounting tab, the connector holder legend and the grommets are flat art on the wall; the ONT position is a dashed outline, and the retainers and the protector are flat art too. -->
  <g id="wall">
    <rect x="0" y="0" width="260.1" height="312" rx="8" fill="#7f8181"/>
    <rect x="106.6" y="0.5" width="44.7" height="21.5" rx="1.5" fill="none" stroke="#6c6e70" stroke-width="0.5"/>
    <circle cx="63.5" cy="102.7" r="29.8" fill="none" stroke="#6c6e70" stroke-width="0.6"/>
    <circle cx="144.5" cy="102.7" r="29.8" fill="none" stroke="#6c6e70" stroke-width="0.6"/>
    <rect x="11.1" y="290.3" width="65" height="10" rx="1" fill="#2a2c2e"/>
    <rect x="195.3" y="290.3" width="65" height="10" rx="1" fill="#2a2c2e"/>
  </g>
  <g id="silkscreen">
    <text x="146.3" y="32.2" font-family="Arial" font-size="2.2" fill="#2b2d30" text-anchor="middle">SC CONNECTOR HOLDER</text>
  </g>
  <g id="ont-seat"><rect x="10" y="44.4" width="142.8" height="206.6" rx="19" fill="none" stroke="#d6d8da" stroke-width="0.6" stroke-dasharray="3 2"/></g>
  <g id="retainer-top"><rect x="62.1" y="26" width="20.5" height="48" rx="4" fill="#a9abad" stroke="#6c6e70" stroke-width="0.4"/></g>
  <g id="retainer-bottom"><rect x="73.6" y="223" width="20.5" height="60" rx="4" fill="#a9abad" stroke="#6c6e70" stroke-width="0.4"/></g>
  <g id="line-protector"><rect x="200.1" y="149.6" width="33" height="72" rx="2" fill="#858787" stroke="#6c6e70" stroke-width="0.6"/></g>
</svg>
