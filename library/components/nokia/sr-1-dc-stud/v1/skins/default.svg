<svg xmlns="http://www.w3.org/2000/svg" width="11.2mm" height="11.2mm" viewBox="0 0 11.2 11.2">
  <!-- One 10-32 stud of the 7750 SR-1 DC terminal block, as
       nokia/sr-1-dc-terminal-block@1 drew each of its eight (SR1 Figure 5
       p48): the ring round the stud, the nut and the stud end, moved to the
       part's own origin unchanged. -->
  <circle id="ring" cx="5.6" cy="5.6" r="5.6" fill="none" stroke="#101214" stroke-width="0.3"/>
  <circle id="nut" cx="5.6" cy="5.6" r="2.7" fill="#8a9097" stroke="#101214" stroke-width="0.3"/>
  <circle id="stud" cx="5.6" cy="5.6" r="1.0" fill="#c9cdd2" stroke="#101214" stroke-width="0.25"/>
</svg>
