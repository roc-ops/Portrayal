<svg xmlns="http://www.w3.org/2000/svg" width="38.1mm" height="348.5mm" viewBox="0 0 38.1 348.5">
  <!-- Nokia LFAN-F front cover, 38.1 x 348.5, as it stands in a horizontally mounted MF-8 shelf.
       Positions from the data sheet's front render at 1.8129 px/mm; part names from the Unit
       Data Sheet guide's Figure 58. -->
  <rect id="face" x="0" y="0" width="38.1" height="348.5" rx="0.6" fill="#565f6a" stroke="#3b424b" stroke-width="0.3"/>
  <g id="handle">
    <rect x="16.2" y="122.6" width="5.6" height="102.0" rx="2.8" fill="#8c9197" stroke="#474d55" stroke-width="0.25"/>
    <rect x="17.3" y="124.0" width="2.4" height="99.2" rx="1.2" fill="#d5d7da"/>
  </g>
  <rect id="location-led" x="16.6" y="271.6" width="6.0" height="19.5" rx="3.0" fill="var(--led-color, #7c838b)" stroke="#474d55" stroke-width="0.25"/>
  <g id="unlock-button">
    <rect x="11.8" y="325.0" width="14.9" height="14.9" rx="1.6" fill="#1b1d20" stroke="#0e0f11" stroke-width="0.3"/>
    <rect x="17.6" y="330.1" width="3.4" height="2.6" rx="0.3" fill="#f2f3f4"/>
    <path d="M 18.3 330.1 V 329.3 A 1.0 1.0 0 0 1 20.3 329.3 V 330.1" fill="none" stroke="#f2f3f4" stroke-width="0.45"/>
  </g>
  <g id="caution-label">
    <rect x="27.0" y="300.5" width="5.0" height="46.0" fill="none"/>
    <circle cx="29.5" cy="343.6" r="1.9" fill="none" stroke="#e6e8ea" stroke-width="0.3"/>
    <path d="M 29.5 342.4 L 30.6 344.4 L 28.4 344.4 Z" fill="#e6e8ea"/>
    <path d="M 29.5 336.2 L 31.5 339.8 L 27.5 339.8 Z" fill="#f2c200" stroke="#1b1d20" stroke-width="0.25"/>
  </g>
  <g id="silkscreen">
    <text x="20.7" y="50.05" font-family="Arial" font-size="6.4" fill="#f2f3f4" text-anchor="middle" textLength="71.1" lengthAdjust="spacingAndGlyphs" transform="rotate(-90 20.7 50.05)">Nokia Lightspan MF-8</text>
    <text x="19.7" y="311.6" font-family="Arial" font-size="2.0" fill="#f2f3f4" text-anchor="middle" transform="rotate(-90 19.7 311.6)">PWR</text>
    <text x="30.1" y="319.0" font-family="Arial" font-size="1.7" fill="#f2f3f4" text-anchor="middle" transform="rotate(-90 30.1 319.0)">CAUTION ROTATING FAN</text>
  </g>
</svg>
