format: 1
kind: module
name: m1-10gb-xp-xfp
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia (Alcatel-Lucent) 7750 SR / 7450 ESS 1-port 10GBASE XFP MDA-XP, M1-10GB-XP-XFP
  (3HE04274AA; ESS 3HE04273AA), a classic half-slot MDA for the IOM3-XP: one XFP cage at the
  left with its Lnk, Act and Laser Disabled lamps beneath it, the Stat and Pwr lamps at the far
  left, a WAN lamp at the upper right, the model legend at the lower right and a cross-slotted
  captive screw on each lower end wing. Authored horizontal; an SR-12 IOM3-XP seats it on end
  with the carrier.
size: {w: 190.5, h: 35.4, d: 177.8}
size-confidence: {w: datasheet, h: drawing, d: datasheet}
size-notes: >-
  The chassis guides give MDAs 1.4 x 7.5 x 7.0 in (3.56 x 19.05 x 17.78 cm, SR7 p106 Table 47).
  Held at 190.5 x 35.4 so it seats in the IOM3-XP's MDA bays on the 35.4 slot pitch; Figure 4
  is fitted per axis to that face.
attrs:
  model: M1-10GB-XP-XFP
  part-number: 3HE04274AA
  part-number-variants: 3HE04274AA (7750 SR), 3HE04273AA (7450 ESS)
  xfp: 1
  power-draw-max-w: 48
provenance:
  sources: >-
    datasheet - 7x50 MDA-XP Installation Guide 9302180206 (MXP): p28 Figure 4 and p28-29 Table 4
    (the face, its lamps and screws), p18 Table 2 (power), p16 (the model list). SR7 22.7
    3HE18643AAAATQZZA03 p106 Table 47 (MDA size) and p105 Table 45 (power, 48 W); SR7 15.1
    3HE14151AAAATQZZA02 p98 Table 32 (part numbers, "7750 SR 1-port 10GBASE - XFP MDA-XP"; p91
    says the bracketed number is the 7450 ESS part).
  size: 'datasheet - SR7 p106 Table 47; see size-notes'
  layout: >-
    drawing - MXP p28 Figure 4 (art MDA0071), vector (pdfimages finds no raster), rendered at
    1200 dpi. Fitted per axis exactly as the M10-1GB-XP-SFP's Figure 9: 4618 px between the
    plate's side lines to 190.5 (24.24 px/mm) and 847 px from the top line to the bottom of the
    centre band to 35.4 (23.93 px/mm). The outline is the classic MDA's and measures the same:
    end wings to y 28.27, notches to x 15.59 and 175.01, the band's inner line at y 33.46, the
    top lip at y 1.65. The three small blocks outside each side line are the side guides and
    are not face. XFP box (key 3) drawn 20.05 x 10.32, x 30.38-50.43, y 3.70-14.02, centre
    (40.41, 8.86). Lamps drawn 2.7 across: Stat (11.36, 6.37) and Pwr (11.36, 11.55) with their
    legends to the left; Lnk (32.01, 18.20), Act (40.45, 18.20) and Laser Disabled (48.86,
    18.20) under the cage, legends below them; WAN (179.96, 6.37), legend below. Port number 1
    left of the cage at x 26.9. Captive screws (key 9) centred (7.6, 22.9) and (183.0, 22.9),
    heads 8.2 in a 10.0 ring, cross-slotted; the tab under the left screw is 1.55 deep, the one
    under the right 3.1 (Figure 9 draws the same pair). Model legend M1-10GB-XP-XFP (key 8),
    bold, ending at x 172.5, baseline 32.4.
  cages: >-
    drawing + standard - one std/xfp@1 (INF-8077i aperture 19.5 x 9.7) centred on the drawn
    box, which is barely larger than the aperture and is drawn as the bezel. ORIENTATION IS NOT
    READ: the figure draws an empty box with no latch or bail, and no photograph of this card is
    held, so the cage takes rotate 0.
  lamps: >-
    datasheet - MXP p28-29 Table 4: Status green blinking initializing, green up, amber
    operationally down, unlit administratively down; Power blue on, off no power; Lnk green
    link at 10000 Mbps, amber slow blinking no XFP installed, amber optics installed but no
    link, unlit disabled; Act green active, amber error, unlit no activity; Laser Disabled amber
    laser disabled, off laser on; WAN green configured for 10GBASE WAN PHY framing, unlit not.
    Table 4 says "Both ports" for the WAN lamp of this one-port card; the sentence is the M2's,
    carried over.
  power: 'datasheet - MXP p18 Table 2: M1-10GB-XP-XFP 48 W maximum; SR7 22.7 p105 Table 45 agrees. XFP optics 4 W each (MXP Table 3), not included'
  colour: >-
    estimated - no photograph of a classic MDA is held (the public Ethernet MDA-XP datasheet
    would settle it). Drawn in the charcoal of the SR-7/SR-12 card family. A gap.
  logo-zone: 'reserved on the plain plate between the cage lamps and the WAN lamp; Figure 4 draws no mark'
  depth: 'datasheet - 7.0 in (17.78 cm), SR7 p106 Table 47'
  lifecycle: 'searched only the staged corpus; the MDA-XP guide and the SR7 15.1 and 22.7 guides list it'
  gaps: >-
    Colour is estimated. The cage orientation is not read. The mda-type CLI string is not
    printed for this card in anything held. The WAN lamp's Table 4 wording names two ports.
