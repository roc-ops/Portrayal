size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: 'w is the NT slot pitch (30 mm), taken as the faceplate width; d is the larger of the two depths the UDS gives (205/225)'
attrs:
  model: FANT-F AA
  part-number: 3FE53701AA
  variants: 'AA 3FE53701AA only (the first ETSI build). FNIO-A is not supported with it (coverage grid note from the UDS)'
  standard: ETSI
  switch-capacity: 480 Gbps
  weight-kg: 2.0
  sfp-plus: 4
  power-draw-max-w: 97
  power-draw-typical-w: 82
  power-draw-scope: module
  input-voltage: -48 V DC and -60 V DC nominal
  ntio-note: 'FNIO-A is not supported with the FANT-F AA'
provenance:
  size: 'datasheet - every FANT-F chapter lists the same dimensions: ETSI UDS A18 3FE77012AAAATQZZA18 17.5.1 / 18.6.1 / 19.6.1 / 20.6.1 / 21.6.1 and Lightspan UDS 3HH90279AAAATQZZA23 13.6.1 / 14.6.1: height 405 mm, width 30 mm, depth 205/225 mm, weight 2 kg'
  size-width: 'datasheet - slot pitch, "width: 30 mm" in the UDS dimensions list, which is the NT card pitch the FX shelf bays are built to; faceplate width not stated, taken as the pitch'
  depth: 'datasheet - the UDS gives "205/225 mm" without saying what each measures; 225 is carried as the card depth. Which figure is PCB and which is overall (faceplate and ejectors included) is not stated'
  power: 'datasheet - 97 W maximum, 82 W typical, in every Safety Manual that lists the card: ETSI 3HH11998AAAATCZZA29 p25 Table 2 row "FANT-F (1)", note (1) "The power consumption for all NT cards does not include the NTIO card or SFP power consumption"; ANSI 3HH12894AAAATCZZA27 p25 Table 2 row "FANT-F (1)", note (1) "FANT-F power consumption does not include the NTIO card or SFP power consumption"; Lightspan 3HH91852AAAATCZZA07 p37 row "FANT-F (1)", the same exclusion. No variant is split out, so the one figure is carried for every variant. No ambient is stated'
  thumbscrews: >-
    photo - owner's lab photos of an installed FX-8, 2026-09-24; flush-with-end per the owner.
    One family figure for every NT, NTIO and LT card and blank, because every screw goes into
    the fixed rails of the shelf: head 10.5 mm across, centred 19.4 mm from the left edge on
    this 30 mm plate, the top head touching the top end (y 0) and the bottom head the bottom
    end (y 394.5). The installed card in those photos IS a FANT-F BD (3FE53701BD, label AB 03):
    its screws read 0.64-0.67 of the plate width at the top and about 0.64 at the bottom, so
    this card is one of the cards the family figure was measured on. The Nokia 3D views draw
    a screw at both ends, as here.
  levers: 'drawing and photo - grey ejector levers at both ends, inside the 405 mm, at x 0.4-6.0 (the left edge, away from the screw). Upper 1.0-35.0: the lab photo (images 11) shows the grey handle hanging from the top end to just above the ALM lamp. Lower 322.0-392.0: every FANT-F 3D view draws the lower lever from the level of the lowest jack block down to the bottom end, and the lab photo of the bottom end (image 10) shows its grey handle beside the lowest RJ45. The lever is drawn closed along the left edge; the 3D views draw its arm across the jacks, which is the perspective of an arm standing proud of the plate'
  lamp-colour: >-
    datasheet and estimated - PWR, A/S, ALM and ACO colours are the UDS tables' own (green, green,
    red, green). The SFP+ lamps are "link/activity status" with no colour, so the `link-activity`
    state is drawn in the family green #39b54a that nokia/fnio-a@1 uses for the same unstated case.
    The A/S lamp's `standby` is that lamp OFF (the table: "Off - Stand-by"), so it is drawn unlit
    (#3a3f44). The FANT-F PWR lamp has a single on state (green, power present), unlike the FANT-H.
  lamp-size: 'estimated - common/led-dot@1 (2 mm); the lab photo draws the lamp windows about 0.13 of the plate width (3.9 mm) across, which is the bezel, not the lens'
  lamp-positions: 'photo and drawing - two columns at x 9.3 and 14.4 (lab photo image 11, plate cols 650-950 = 30 mm, lamp centres cols 742 / 795), rows 36.8 + n x 5.08 (the ETSI 3D view, rows 330-395 on the mapping in layout; the photo agrees on the 5.08 pitch, 51 px per row at 10 px/mm)'
  legends: 'drawing and photo - printed legends read at 3-4x off the ETSI 300 ppi views and the BD vector view; the port legends read DOWN the card (glyph tops toward the right edge), as on the FANT-H, so they are set rotate(90). The front uplink RJ45 legend reads "FUI" plus one glyph the drawings do not resolve (it reads as 4 or M); "FUI" is set and the fourth glyph is a gap. The "Alcatel·Lucent" name is the printed text wordmark (text only; the round mark above it is NOT drawn - it is inside logo-zone). Sizes from the lab photo, where the lamp legends are bold and about 2.3 mm tall: lamp legends 2.3 bold on the BD, 1.9 bold on the ETSI builds (FSM4 has to fit left of its lamp), port legends 2.2 to 2.4, card name 2.8'
  rotation: 'estimated - the face is 30 mm wide, so every cage and jack lies on its side. The RJ45s turn 270, as on the FANT-H; the cages turn 270 with the long axis along the card (the lab photo shows the empty X2 cage taller than wide, about 11.5 x 14.5 mm, and the fitted X1 module with its two LC bores one above the other). Which way a cage latch faces is not resolvable'
  angled-panel: >-
    estimated - REAL FACETS: four SFP+ teeth, each a face tipped 41 degrees up (toward the card
    top) carrying its cage, and a return closing the tooth back to the plate, facing down. Every
    FANT-F figure draws the housing as a SAWTOOTH standing PROUD of a flat plate, one tooth per
    cage, the teeth touching (no flat between them); the lab photo of the BD shows the same boxes,
    light grey faces with the cage and a darker underside. Measured on the 300 ppi ETSI views: the
    along-card scale is 4.0 px/mm (plate 405 mm over rows 170-1777 at the right edge, cross-checked
    against the lab photo, see layout); a millimetre proud draws 2.89 px right and 0.51 px down
    (the card top edge, 650 px across and 115 px up for the 225 mm depth). The right-hand outline
    of the housing gives the apexes (rows 507, 622, 738, 853 on the AC view, 988, 1103.5, 1219,
    1334 on the AA view: the same 115.3 px, 28.8 mm, pitch on both), and the tooth side edges give
    the rise: a face edge runs 37 px right over 66 rows and a return edge 37 px back over 49 rows
    (tooth 1: 46 px over 81 rows). So each apex stands 37 / 2.89 = 12.8 mm proud (tooth 1, the
    larger one under the lamps, 15.9) over a face 14.9 mm long in front view (tooth 1, 18.5),
    40.7 degrees for every tooth, taken as 41. On the 205 mm depth the same edges give 38-39
    degrees; the range is the angle's uncertainty. Returns: 14.5 mm (tooth 1) and 13.9 mm (teeth
    2-3) against measured 14.7 and 14.0, and tooth 4's longer return (17.2) runs to the housing
    foot, as drawn. Each return angle is solved so the two facets of a tooth meet at one apex, then
    rounded, and its length re-solved; each next face roots where the return ends (the chained
    roots sit within 0.5 mm of the measured ones). Across, the housing runs x 1.0-23.6 (lab photo:
    cols 660-886 at the face root; the proud apex draws wider, being nearer the camera), the cages centred at x 13.2 (photo: the empty X2 cage centred
    at 13.7; the housing centre is 12.9). Each cage sits on its face with its lower edge 1.0 mm
    above the apex, where Nokia draws a lip across the face. A cage's lower wall, run back 41 mm
    along the face normal, reaches the plate before the return does in every tooth (tooth 1: at
    30.7 mm of 33.0; teeth 2-3: 24.4 of 28.8), so no cage shows through the back of its tooth
  colour: 'photo - light silver-grey plate; the SFP+ tooth faces lighter than the plate and their returns darker (the lab photo); grey plastic ejector handles; white product label at the bottom end (image 10)'
  relief: 'estimated - lever projection and screw heads carry the library card-family figures, not measurements; no Nokia document states them. The SFP+ housing is carried as facets, each face and each return its own relief feature; see angled-panel for how they were read'
  media: 'the RJ45 jacks are typed by what runs through them, as the library devices already do: the front uplink 10/100/1000Base-T rj45 (common/rj45-eth@1), LCRT/CRAFT craft rj45-serial, ToD/1PPS rj45-tod, BITS rj48, and the AA daisy-chain NTR clock jacks rj45-sync (8 kHz / 19.44 MHz clock pairs on pins 5-8, not BITS: ETSI UDS A18 Tables 42 and 43)'
  label: 'photo - the white product label (FANT-F / 3FE53701 / BD AB 03 on the photographed card) is drawn blank at x 9.5-19.0, y 378.0-393.0: the lab photo of the bottom end puts it between the lowest jack and the bottom screw, and every Nokia 3D view draws a rectangle there. Its text is per unit and is not printed in the skin'
  layout: 'drawing - ETSI UDS A18 3FE77012AAAATQZZA18 p164 Figure 51 (drawing 33707, native 300 ppi, pdfimages); the Lightspan UDS 3HH90279AAAATQZZA23 p116 Figure 48 is the same drawing at 150 ppi. the ETSI 3D side-and-front views are 300 ppi; along the card y = (row - 175 - 0.18 x (xr - col)) / 4.0 on the AC view (xr, the plate right edge, runs col 892 to 880 down the card; 0.18 is the slope of a line across the face), which puts the plate ends at -1.2 and 400.5 and was chosen over the bare plate-end fit (row0 170, 3.968 px/mm) because it lands the bottom of the layout where the lab photo of the BD bottom end puts it (lowest jack frame 338, label 378-394, against 339.2 and 377.9-393.9 here) and the lamps where the top-end photo puts them relative to the name. Across, x = 14.4 + (col - 846) / 3.35 anchored on the lamp columns of the lab photo. The AA view is registered to the AC one by the screw heads (rows 177 / 1785 against 203 / 1812: 26.5 px), which also lands its lamps within 0.8 mm of the AC ones. Along: DC IN / DC OUT jack centres 78.8 / 95.0 in one frame 69.5-104.5; a blank rounded plate 137.2-166.0 (x 10.0-19.5); an ESD triangle 180.5; the SFP+ housing 189.1-311.75, the AC sawtooth 127.4 mm lower (see angled-panel); the laser triangle 320.5; FUI 336.85, LCRT 359.1; label 378-393. Across: jack column x 13.2 in frames x 5.9-20.5. The top of the AA view (name, ACO switch) is under the drawn lever and is read as the AC top; the AA 3D view puts the wordmark and name about 6 mm lower than the AC, which would leave no room for the ACO switch the AA close-up draws above the lamps, so the AC arrangement is taken (see gaps)'
  ports: 'datasheet - ETSI UDS A18 17.4.2 External interfaces, transcribed: communication, 4 x 10GE SFP+ (1GE with standard SFP) and 1 x 10/100/1000Base-T (the front uplink); management, the local craft management interface (LCMI, RJ45), the daisy-chain NTR clock input and output (RJ45, Tables 42 / 43: 8 kHz and 19.44 MHz), and the Alarm Cut-Off Switch (ACOS) and LED (ACOLED). Composed from std/sfp@1, common/rj45-eth@1, std/rj45@2, common/reset-button@1, common/laser-warning@1 and common/led-dot@1 at registry size; the cages sit on their tooth faces, so they keep that size and the renderer foreshortens them by cos 41 along the card'
  leds: 'datasheet - ETSI UDS A18 Table 44 p165, transcribed onto each lamp as `states`; the close-up (Figure 52) gives the arrangement: two columns, ALM | PWR, ACO | A/S, FSM2 | FSM1, FSM4 | FSM3, with the ACO push button above them'
  aco: 'drawing - the ACO switch is common/reset-button@1, a recessed push button, centred between the lamp columns 8 mm above the ALM row, where the AC view draws it; the AA close-up (p165 Figure 52) draws the same button above the same lamp block'
  sfp-legends: 'no legends beside the cages: none of the AA/AC views draws any'
  variants: 'drawing - THREE FACES, SO THREE COMPONENTS (nokia/fant-f-aa, -ac, -bd). AA (drawing 33707): DC IN/OUT near the top, the SFP+ housing low, FUI and LCRT only, ACO. AC/AD/AE/AF (33712 for the AC; the AD, AE and AF chapters share one embedded image, 33717, identical in layout): SFP+ housing under the lamps, 1PPS/10MHz SMAs, FUI, LCRT, ToD/1PPS, BITS IN/OUT, ACO. BC/BD/BF (22447 for all three): the AC layout without the ACO switch, ACO lamp and BITS pair. A skin cannot add or remove ports, so the three port sets are three components; part numbers that share a face are one component. This component: AA 3FE53701AA only (the first ETSI build). FNIO-A is not supported with it (coverage grid note from the UDS)'
  gaps: 'The tooth angle rests on the card-depth projection (225 mm read off the card top edge; 205 gives 38-39 degrees). The AA top end (name, ACO switch) is hidden by the lever in its only 3D view and is taken from the AC; the AA view itself puts the name about 6 mm lower. The blank rounded plate 137-166 is drawn as art; its function is not stated. The fourth glyph of the front uplink legend is unread. Cage latch direction (rotate 270 is convention). No photograph of an AA.'
