format: 1
kind: module
name: nglt-a
version: 1.1.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia NGLT-A (3FE 64279 AA), the 8-port GPON line termination board with traffic
  manager (version A) that the 7302 ISAM, 7330 ISAM FTTN and 7360 ISAM FX shelves take.
  Authored upright, as the Unit Data Sheet guides draw it: ejector and thumbscrew at each
  end, a yellow laser warning label under the top lever, a lamp column PWR, A/S, ALM and
  a 2 x 4 block of PON lamps 1-8, then eight SFP cages on a sawtooth faceplate that
  angles each cage for fibre bend radius, a label window, and the bottom lever.
size: {w: 25.0, h: 405.0, d: 225.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: >-
  w is the board-to-board PITCH (25 mm); no faceplate width is stated, so the face is
  held at the pitch by the shared 7360 FX convention. d is the larger of the two board
  depths the UDS gives (225 mm top / 205 mm bottom), taken as the envelope.
attrs:
  model: NGLT-A
  part-number: 3FE 64279 AA
  weight-kg: 0.9
  power-draw-max-w: 76.2
  power-draw-typical-w: 64.2
provenance:
  size: >-
    datasheet - 7360 ANSI UDS R6.9 3FE77013AAAATQZZA16 section 51.5.2 (p497) and the
    NGLT-A Unit Data Sheet 3FE64279AAAATQZZA07 section 1.7.2 (p9): height 405 mm, width
    225 mm (top) / 205 mm (bottom), board-to-board pitch 25 mm.
  size-width: >-
    datasheet - slot pitch 25 mm, UDS section 51.5.2; the faceplate edge-to-edge width
    is not stated in either UDS and is taken as the pitch.
  depth: >-
    datasheet - "width 225 mm (top) / 205 mm (bottom)", the board's depth behind the
    faceplate at its two ends; 225 carried as the envelope.
  weight: 'datasheet - 0.9 kg (2 lb), ANSI UDS R6.9 section 51.5.2'
  power: >-
    datasheet - 7360 ISAM FX ANSI Safety Manual 3HH12894AAAATCZZA27 p26 Table 2 and ETSI
    Safety Manual 3HH11998AAAATCZZA29 p26 Table 2: NGLT-A 64.2 W typical, 76.2 W maximum.
    The ETSI table note says PON line-card figures include the optics.
  layout: >-
    drawing (fractions only) - NGLT-A Unit Data Sheet 3FE64279AAAATQZZA07 p9 Figure 7,
    the 3D side-and-front view (the same art as ANSI UDS R6.9 p497 Figure 265). The
    standalone UDS draws it as vectors, so it was rendered at 600 dpi rather than taken
    from the 150 ppi raster in the guide. No orthographic front exists. Positions along
    the card are fractions of 405 mm between the top of the top ejector and the bottom
    of the bottom ejector (render y 1255 to 3876, 0.1545 mm/px): top lever tip 34.5;
    laser label 36.6-56.0 (its top, an oval DANGER header behind the lever tip, is not
    drawn); lamp rows 60.1 to 89.8 on a 4.95 pitch; sawtooth recess 106.9-335.3 with
    tooth apexes 137.2 to 329.7 on a 27.58 pitch and each cage on the sloped face
    15.9 mm above its apex; label window 337.6-362.4; bottom lever from 377. Across the
    card the face is foreshortened (106 px for 25 mm), so x is taken as fractions of the
    drawn face: lamp columns at 9.0 and 14.9, cages centred. About 1 mm error along the
    card, more across it.
  ports: >-
    datasheet - UDS section 51.4: eight GPON ports (2.488 Gbps down, 1.244 Gbps up) for
    SFP GPON modules. Composed as std/sfp@1 at its registry aperture, unrotated.
    Numbering 1-8 top to bottom is ASSUMED from the lamp block's 1-8; the figure prints
    no numeral beside any cage and no document maps cage to number (gap). No `sfp` count is stated for the export
    (L96 stands): its cage table has no GPON interface type, and `sfp` would type these
    ports as 1000BASE-X.
  lamps: >-
    datasheet - NGLT-A UDS A07 Figure 8 (p10) and Table 2; ANSI R6.9 Table 148. Column
    PWR, A/S, ALM, legends to the right; then 1 | 2, 3 | 4, 5 | 6, 7 | 8, odd legends
    left, even right. PWR off = power off, blinking green = initialisation; the table's
    same row reads "Initialization / Power on state" and has no steady row, so a steady
    green 'on' is added by analogy with the FGUT-A table (inferred, gap). A/S on =
    active, off = standby, colour not stated, drawn with the family green. ALM red =
    alarm. PON lamp off = not active, yellow = provisioned and ranging, green = active,
    blinking green = provisioned and active, red = transmitter failed or no SFP
    communication.
  marks: >-
    drawing - the laser label is drawn with the wording Figure 7 prints on it (invisible
    laser radiation when disconnected, avoid direct exposure to beam) and its starburst;
    the rectangle with corner brackets below the cages is not named in any table and is
    drawn as an empty window.
  relief: >-
    estimated - the ejectors stand proud of the plate; no document gives a figure, so
    the library's pooled release-hardware estimate (4.2) is used, as on the FNIO cards.
    The sawtooth is carried as facets (angled-panel), not as an `out`.
  logo-zone: >-
    reserved by the family convention; Figure 7 draws no mark, so the zone is the empty
    metal between the lamp block and the sawtooth.
  lifecycle: >-
    searched only the staged corpus - listed in ANSI UDS R6.9; no end-of-life notice was
    searched for on the web.
  angled-panel: >-
    estimated - NGLT-A UDS 3FE64279AAAATQZZA07 p9 Figure 7, the vector 3D view rendered
    at 900 dpi. The sawtooth lies in a recess in the plate with its apexes toward the
    viewer; the cage connectors are on the upper edge of each tooth, so the ports look
    up. Tracing the tooth edge over eight teeth gives an image run of 154 px down to
    each apex, 114.5 px back, and a 90 px depth; with the edge of the board as the depth
    axis (6.2-6.6 px/mm across, 1.3 px/mm down) and 9.71 px/mm along the card, that is
    13.9-14.0 mm and 13.6-13.8 mm of front view and 13.7-14.6 mm deep, 44-46 degrees
    each way - the 45/45 of FNIO-A on a slightly shorter pitch. Modelled as eight teeth
    of 45 degrees up (face-N, the cage on it) and 45 down (return-N), 13.79 mm each on
    the 27.58 pitch, apexes at 137.2 + 27.58 n as measured, apex 13.79 mm. The recess in
    Figure 7 ends at 335.3, 5 mm below the last apex, so return-8 is cut there and given
    `lift` 8.75 to still meet the apex; the walls of cage 8 pass below the plate at
    333.2, inside that end. The recess floor is modelled as the plate, so the teeth
    stand 13.79 mm proud where the Nokia apexes sit about level with the plate front
    (gap).
