format: 1
kind: module
name: felt-d
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia FELT-D (3FE 78462 AA), the 1G/10G/25G/100G point-to-point Ethernet LT of the Lightspan
  FX (FX-4, FX-8, FX-16): eighteen SFP28 cages in nine ganged 1x2 blocks taking cSFP, SFP, SFP+
  or SFP28 (36, 18, 18 or 16 ports), two single QSFP28 cages for 100G users or the cross-LT link
  in duplex mode, the PWR and ALM lamps, a link lamp per SFP port (01-36) and one per QSFP28
  (37 and 41), and three hazard marks under the lamps. Authored upright.
size: {w: 25.0, h: 405.0, d: 205.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: >-
  w is the board-to-board PITCH (25 mm), held so the LT bay built from the shared 7360 FX
  convention seats it; the faceplate edge-to-edge width is not stated. The flat front figure
  measures the plate plus its side rail at about 26 mm across (26.1 on the vector FELT-D
  figure), so figure positions across the card are taken as fractions of 26.1 laid onto the
  25 mm face. d is the first of the two board widths the UDS gives (225 top / 205 bottom),
  as nokia/fnio-d@1 carries it.
attrs:
  model: FELT-D
  part-number: 3FE 78462 AA
  sfp-plus: 18
  qsfp28: 2
  weight-kg: 1.7
  power-draw-max-w: 91
  power-draw-typical-w: 80
provenance:
  size: >-
    datasheet - Lightspan UDS 3HH90279AAAATQZZA23 section 47.5.2 (p499): height 405 mm, width
    225 mm (top) / 205 mm (bottom), board to board pitch 25 mm. Face held at the 25 mm pitch by
    the shared 7360 FX convention.
  size-width: >-
    datasheet - slot pitch 25 mm, section 47.5.2; faceplate width not stated, taken as the
    pitch. Figure 250 is vector and measures plate 23.8 plus rail to 26.1 across.
  depth: 'datasheet - 205 mm, the bottom width of section 47.5.2; 225 at the top'
  weight: 'datasheet - 1.7 kg, section 47.5.3 (p499)'
  power: >-
    datasheet - Lightspan Safety Manual 3HH91852AAAATCZZA07 p37: FELT-D 80 W typical, 91 W
    maximum, with no use-case note. Whether pluggables are inside the figure is not stated.
  layout: >-
    drawing - UDS A23 Figure 250 (p498), the flat front panel, which is VECTOR art: rendered at
    1200 dpi, plate x 86..7741 px = 405 mm, 18.90 px/mm. The figure is drawn HORIZONTAL with the card's top end at the figure's LEFT (the
    Figure-233-style 3D view shows the lamps and the top thumbscrew at the upper end, and the
    board name, which the figure prints rotated, reads horizontally once upright), so the
    component is that figure turned 90 degrees clockwise: y = mm along the figure from its
    left plate end, x = 25 x (1 - fy / 26.1) where fy is mm down from the figure's upper plate
    edge. Gate 1: the 1x2
    SFP28 blocks measure 30.05 along by 10.9 across (28.5 + rim by 10.4), the QSFP28 cages 20.1
    along (SFF-8663 20.0), and across the card the drawing spans 26.1 against the 26 mm the
    FNIO chapters state for the same slot family: orthographic, to about 0.1 mm. Read off it:
    top thumbscrew 4.7, top lever 0.5-29.0, FELT-D name at about 25; ALM | PWR at 32.2 (PWR on
    the right once upright, as printed); three hazard triangles side by side at 36.3-41.5;
    nine blocks starting 42.38, 75.13, 107.93, 140.73, 173.53, 206.34, 239.14, 271.94, 304.69
    (a 32.79 pitch), each 30.05 long; link lamps 3.07 x 1.8 at cage centre +/- 3.75 on the left,
    their legends 1-36 beside them; QSFP28 cages 339.3-359.4 and 361.7-382.1 with one lamp
    each, legends 37 and 41; an arrow label at 382.8-393.9; bottom lever 386.9-404.5 and
    thumbscrew 400.2. Figure 248 (p496, a 414 x 82 raster) agrees on the arrangement.
  ports: >-
    datasheet - sections 47.4.1.1 and 47.4.1.2: 18 SFP28 cages as 9 x (1x2), taking cSFP (GE),
    SFP (GE), SFP+ (10G) or SFP28 (25G, at most 16 cages); port number = the odd cage/LED label
    for SFP/SFP+/SFP28, odd and even labels for a cSFP; numbered exactly as the FELT-B for board
    swap. Two single QSFP28 cages labelled 37 and 41, 100G user ports (HW-ready for 40G, 4x10G,
    4x25G) or the cross-LT link; ports 37-40 and 41-44 when broken out. Composed as
    std/sfp-ganged@1 and std/qsfp28@1, turned 90.
  interfaces: >-
    the cSFP's two interfaces per cage cannot be declared here: `interfaces:` is a DEVICE
    placement key (L105) and a component part admits no such key. Recorded in the group
    description and as a gap.
  rate: >-
    datasheet - Table 174: 18 at SFP+ 10G, 16 at SFP28 25G, 36 cSFP GE. `sfp-plus: 18` is
    carried because the export's SFP family has no SFP28 row, so the card's own 25G rate lives
    only in the group's `media: sfp28` (gap); `qsfp28: 2` for the two 100G cages.
  lamps: >-
    datasheet - Tables 175 and 176 (p500-502): PWR bi-colour, off / green active / amber
    standby; ALM red, off / blinking pattern A (3 s on, 1 s off: warming up below 0 C) /
    blinking pattern B (2 s on, 2 s off: operating between 0 and -10 C) / red major-critical.
    Link lamps 01-36 and 37, 41 bi-colour green/red: off no optic, green link, green blinking
    traffic, red LOS. Drawn as common/led-rect-sm@1 turned 90, which matches the 3.07 x 1.8 mm
    rounded windows of Figure 250 to within 0.3 mm.
  marks: >-
    drawing - three triangles under the lamps (heat, laser and ESD by shape) and the arrow
    label at the bottom end are drawn as outlines; what the label is for is not stated (gap).
  logo-zone: 'reserved on the empty metal around the FELT-D name; Figure 250 draws no mark'
  relief: >-
    estimated - levers and thumbscrews as nokia/fant-h-aa@1 carries them; the composed cages
    emit their own depth.
  lifecycle: 'searched only the staged corpus - listed as current in UDS A23; no end-of-life notice searched on the web'
