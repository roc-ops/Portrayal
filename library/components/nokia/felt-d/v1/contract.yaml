groups:
  sfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
    description: >-
      the 18 SFP28 cages in nine 1x2 blocks (cSFP GE, SFP GE, SFP+ 10G or SFP28 25G, at most 16
      at 25G). Cage n presents ports 2n-1 and 2n with a cSFP and port 2n-1 alone otherwise; the
      two cSFP interfaces are not declared per cage because a component part cannot carry
      `interfaces:`.
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      the two single QSFP28 cages, legends 37 and 41 (ports 37-40 and 41-44 when broken out):
      100G user ports or the cross-LT link in duplex mode
  link-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: one bi-colour lamp per SFP28 port position, legends 1-36, two per cage
  qsfp-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: one bi-colour lamp per QSFP28 cage, legends 37 and 41
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the board lamps PWR (green/amber) and ALM (red)
