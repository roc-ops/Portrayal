format: 1
kind: module
name: nglt-c
version: 1.3.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia NGLT-C (3FE 67301 AA), the 8-port GPON line termination board with traffic
  manager (version C) that the 7302 ISAM, 7330 ISAM FTTN and 7360 ISAM FX shelves take
  (in the FX, central-office deployment only). Authored upright, as the Unit Data Sheet
  guides draw it: grey ejector levers and a thumbscrew at each end, a round badge, the
  PWR and ALM lamps and a yellow laser mark at the top, then eight SFP cages in four
  angled pairs, each with its PON lamp on the left, a long bare plate, and the part,
  model and barcode labels above the bottom lever.
size: {w: 25.0, h: 405.0, d: 225.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: >-
  w is the board-to-board PITCH (25 mm); no faceplate width is stated, so the face is
  held at the pitch by the shared 7360 FX convention. d is the larger of the two board
  depths the UDS gives (225 mm top / 205 mm bottom), taken as the envelope.
attrs:
  model: NGLT-C
  part-number: 3FE 67301 AA
  weight-kg: 0.9
  power-draw-max-w: 73.5
  power-draw-typical-w: 65
provenance:
  size: >-
    datasheet - 7360 ANSI UDS R6.9 3FE77013AAAATQZZA16 section 52.5.2 (p508) and the
    NGLT-C Unit Data Sheet 3FE67301AAAATQZZA04 section 1.7.2 (p10): height 405 mm, width
    225 mm (top) / 205 mm (bottom), board-to-board pitch 25 mm.
  size-width: >-
    datasheet - slot pitch 25 mm, UDS section 52.5.2; the faceplate edge-to-edge width
    is not stated in either UDS and is taken as the pitch.
  depth: >-
    datasheet - "width 225 mm (top) / 205 mm (bottom)", the board's depth behind the
    faceplate at its two ends; 225 carried as the envelope.
  weight: 'datasheet - 0.9 kg (2 lb), ANSI UDS R6.9 section 52.5.2 (p509)'
  power: >-
    datasheet - 7360 ISAM FX ANSI Safety Manual 3HH12894AAAATCZZA27 p26 Table 2 and ETSI
    Safety Manual 3HH11998AAAATCZZA29 p26 Table 2: NGLT-C 65 W typical, 73.5 W maximum.
    The ETSI table note says PON line-card figures include the optics.
  layout: >-
    drawing (fractions only) and photo - NGLT-C Unit Data Sheet 3FE67301AAAATQZZA04 p10
    Figure 8, the 3D side-and-front view (the same art as ANSI UDS R6.9 p508 Figure 273),
    drawn as vectors and rendered at 600 dpi; no orthographic front exists. Along the
    card, fractions of 405 mm between the ends of the two ejectors (render y 1342 to
    3892, 0.1588 mm/px): PWR 27.5 and ALM 32.2; sawtooth recess 39.4-200.7, four teeth
    with apexes at 82.3, 122.9 and 163.4 (a 40.6 pitch), two cages on each tooth's
    sloped face centred 25.4 and 8.8 mm above its apex. A thunder-link.com 1200 px
    edge-on photograph (4573nglt-c-2.jpg, card horizontal, top end on the left) agrees
    to about 4 mm along the card, and is used for what the figure does not show: the
    round badge at 17.5 (logo-zone, not drawn), the laser triangle at 30.5-36.5, the grey
    levers ending at 30 and starting at 376 (the figure's top lever reaches 36; the
    photo is followed because the laser triangle sits just past it), and the labels
    above the bottom lever, whose positions are fractions of the photographed face
    (0.410 mm/px) and good to about 3 mm. Across the card, x comes from the same photo
    (face 52 px for 25 mm): lamps at 14.9, legends to their right.
  ports: >-
    datasheet - UDS section 52.4: eight GPON ports for SFP GPON modules. The photo shows
    them as four pairs; composed as std/sfp@1 at its registry aperture, unrotated.
    Numbering 1-8 top to bottom is ASSUMED; neither figure nor photo shows a numeral and
    no document maps cage to number (gap). No `sfp` count is stated for the export
    (L96 stands): its cage table has no GPON interface type, and `sfp` would type these
    ports as 1000BASE-X.
  lamps: >-
    datasheet - NGLT-C UDS A04 Figure 9 (p11) and Table 2; ANSI R6.9 Figure 274 and
    Table 150. PWR off = power off, blinking green = initialisation; the table's same row
    reads "Initialization / Power on state" and has no steady row, so a steady green
    'on' is added by analogy with the FGUT-A table (inferred, gap). ALM red = alarm. PON
    lamp off = not active, yellow = provisioned and ranging, green = active, blinking
    green = provisioned and active, red = transmitter failed or no SFP communication.
    The PON lamps are "on the left of the corresponding PON interface" (note 1); the
    3D figure draws small features on the left rail beside each cage but at 600 dpi they
    cannot be told apart from the cage latches, so each lamp is ESTIMATED at the cage's
    centre line, 3.6 mm from the left edge.
  marks: >-
    photo - the NGLT-C model label is printed as photographed, reading top to bottom; the part-number sticker (with a
    data-matrix) and the barcode label are placeholders, never a real serial; the ESD
    mark beside the model label is drawn as an outline. The round badge is a vendor
    logo and is reserved, not drawn.
  relief: >-
    estimated - the ejector levers stand proud of the plate; no document gives a figure,
    so the library's pooled release-hardware estimate (4.2) is used, as on the FNIO
    cards. The sawtooth is carried as facets (angled-panel), not as an `out`.
  colour: >-
    photo - the plate is light silver-grey and the levers mid-grey plastic (about
    #6e7275) in the thunder-link photographs, not the dark ejectors of the FX NT cards.
  logo-zone: >-
    photo - the round badge on the top end, about 5 mm across, at 17.5 mm.
  lifecycle: >-
    searched only the staged corpus - listed in ANSI UDS R6.9; no end-of-life notice was
    searched for on the web.
  angled-panel: >-
    estimated - NGLT-C UDS 3FE67301AAAATQZZA04 p10 Figure 8, the vector 3D view rendered
    at 900 dpi. The sawtooth stands in a recess with its apexes toward the viewer and
    two cages on the upper, longer edge of each tooth, so the ports look up. One tooth
    measures 321 px down to the apex, 64 px back and 93 px deep; with the edge of the
    board as the depth axis (4.5-4.7 px/mm across, 1.6-2.0 down) and 9.44 px/mm along
    the card, that is about 30 and 10 mm of front view and 20 mm deep: 33-34 and 61-64
    degrees, good to a few degrees only. DEPTH: the apexes are taken 2.0 below the plate
    front as on nokia/nglt-a@1 (the same generation of recess), because Figure 8 does
    not separate the across and depth axes at the recess edge; the recess is the pocket
    `well`, 39.4 to 214.7 and 22.38 deep, and every facet has `lift` -22.38. The angles
    are unchanged by the depth. Section, plate front at 0: apex -2.0, root and pocket
    floor -22.38. Modelled as four teeth of 34 degrees up (face-N, two cages and their
    PON lamps on it) and 63 down (return-N) on the 40.6 pitch, face 30.22 and return
    10.38 mm of front view, roots at 52.3 + 40.6 n; return-0 is the leading edge Figure
    8 draws rising to the top of the recess. The cages keep their positions and pass
    below the pocket floor before any wall (0.60 mm worst clearance). Figure 8 ends the
    recess at about 201, short of the last apex; the pocket runs on to 214.7 over the
    bare plate so that face-4 keeps its return and its lower cage does not come out
    through the end wall (gap).
  thumbscrews: >-
    photo - owner's lab photos of an installed FX-8, 2026-09-24; flush-with-end per the owner.
    One family figure for every NT, NTIO and LT card and blank, because every screw goes into
    the fixed rails of the shelf: head 10.5 mm across, centred 18.7 mm from the left edge on
    this 25 mm plate, the top head touching the top end (y 0) and the bottom head the bottom
    end (y 394.5). Measured as ratios within one card on perspective phone photos, the
    plate-plane screw centre read from the recessed seat (concentric with the shank) rather
    than the projecting head: 30 mm NT (FANT-H top 0.640, bottom 0.651; FANT-F top 0.64-0.67,
    bottom about 0.64) -> 19.4 (ratio 0.647); 25 mm NTIO blank 3FE65651BA (top 0.733, bottom
    0.754) -> 18.7 (ratio 0.748). Head diameter against plate width: the back edge of the
    knurl 0.36 of the FANT-H plate and 0.42 of the NTIO plate at the bottom, the front faces
    0.39-0.48 (magnified by their projection), so an upper bound of 10.6-10.8 mm; 10.5 taken
    (0.35 of 30, 0.42 of 25), inside the 10-11.5 mm the Nokia flat FANT-H view draws. The
    screw sits on the side AWAY from the grey ejector lever (lever at the left edge, screw
    right of centre) at both ends. Same centre at both ends: the photos differ by under 1 mm,
    within the reading error. This replaces the per-figure screw positions and sizes read off
    the oblique guide drawings, which had drifted 17.2-21.0 across and 6.4-10.0 in size.
