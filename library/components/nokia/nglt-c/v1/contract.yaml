  laser-label: {at: [5.6, 30.8], size: [6.2, 5.4], class: label}
  label-part: {at: [1.0, 361.1], size: [8.6, 4.9], class: label}
  label-model: {at: [3.8, 367.7], size: [3.9, 15.5], class: label}
  label-serial: {at: [12.5, 366.0], size: [11.5, 19.7], class: label}
relief:
  wall: '#8d9298'
  features:
    - node: ejector-top
      out: 4.2
      confidence: estimated
      source: >-
        edgecore/agr-psu-dc@1 latch - the library's one release-hardware figure, itself
        sourced for arrangement and not proudness
    - node: ejector-bottom
      out: 4.2
      confidence: estimated
      source: >-
        edgecore/agr-psu-dc@1 latch - the library's one release-hardware figure, itself
        sourced for arrangement and not proudness
groups:
  gpon:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 2.5g, pon: gpon}
    description: the eight GPON SFP cages, in four angled pairs
  pon-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: one PON state lamp left of each cage
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the board lamps PWR and ALM
stack-exceptions:
  - pairs: [[port-1, port-2], [port-3, port-4], [port-5, port-6], [port-7, port-8]]
    reason: >-
      Not a belly-to-belly stack: each pair sits one behind the other on the same sloped
      tooth face of the sawtooth faceplate, both turned the same way. NGLT-C UDS A04
      Figure 8 draws the two cages of every tooth with the same outline and latch side,
      and the thunder-link edge-on photograph (4573nglt-c-2.jpg) shows both cages of each
      pair with their latch tabs on the same edge.
