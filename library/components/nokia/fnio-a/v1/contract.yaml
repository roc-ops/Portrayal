format: 1
kind: module
name: fnio-a
version: 1.3.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia FNIO-A (3FE 65586 BA), the 80G (8x10G) NT I/O applique of the 7360 ISAM FX
  (also Lightspan FX), with SyncE. Seats in the NTIO slot between the two NT boards and
  gives the shelf eight extra SFP/SFP+ uplinks (1G, 2.5G or 10G). Authored upright, as
  the Unit Data Sheet guides draw it: ejector and thumbscrew at each end, a 2 x 5 lamp
  block (ALM, PWR, ports 1-8) under the top ejector, then eight SFP cages in two groups
  of four on a sawtooth faceplate that angles each cage 45 degrees for fibre bend radius.
size: {w: 25.0, h: 405.0, d: 205.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: >-
  w is the board-to-board PITCH (25 mm), not the faceplate: the same UDS section states
  the width as 26 mm, which is wider than the pitch and so is taken to be the widest
  point (the ejector or the sawtooth), not the plate between neighbours. Held at 25.0 so
  the NTIO bay built from the shared family convention seats it. d is the first of the
  two depths the UDS gives (205 / 225 mm); which one applies to which shelf is not stated.
attrs:
  model: FNIO-A
  sfp-plus: 8
  part-number: 3FE 65586 BA
  weight-kg: 0.81
  power-draw-max-w: 26.4
  power-draw-typical-w: 24
provenance:
  size: >-
    datasheet - ETSI Unit Data Sheet guide 3FE77012AAAATQZZA18 section 40.5.1 (p388):
    height 405 mm, width 26 mm, depth 205 mm / 225 mm, board-to-board pitch 25 mm. The
    Lightspan UDS 3HH90279AAAATQZZA23 p286 prints the same. Face held at the 25 mm pitch
    by the shared 7360 FX convention; the 26 mm width is recorded in size-notes and gaps.
  size-width: >-
    datasheet - slot pitch 25 mm, UDS section 40.5.1; the faceplate edge-to-edge width
    is stated only as 26 mm overall, which exceeds the pitch, so the plate width itself is
    not stated and is taken as the pitch.
  depth: >-
    datasheet - 205 mm / 225 mm, section 40.5.1; 205 carried. Neither figure is tied to a
    shelf in the text.
  weight: 'datasheet - 0.81 kg, ETSI UDS A18 section 40.5.2 (p389)'
  power: >-
    datasheet - ETSI Safety Manual 3HH11998AAAATCZZA29 p26, Table 2 "Power consumption
    per component for 7360 ISAM FX": FNIO-A 24 W typical, 26.4 W maximum, 0-1 per shelf.
    The table footnotes say PON line-card figures include their optics and that NT
    figures exclude the NTIO and SFPs; for the NTIO row itself the manual says nothing
    about whether the SFP+ modules are inside the figure, so that scope is open (gap).
  layout: >-
    drawing (fractions only) - ETSI UDS A18 p388 Figure 170, the 3D side-and-front board
    view, taken from the embedded 1435 x 1586 image at 300 ppi (pdfimages; the Lightspan
    p286 copy is a 150 ppi JPEG of the same art). There is no orthographic front in any
    guide. Positions along the card are fractions of the 405 mm face measured between the
    front corners of the two ejectors (image y 137 to 1538, 0.289 mm/px), corrected by
    about 5 px on the tooth apexes for the depth axis of the oblique projection. Top
    ejector lever tip 31.8; lamp rows 34.3 to 54.3 on a 5.0 pitch; sawtooth 57.5 to 175.5
    (four teeth), a 6 mm flat, 181.5 to 300.3 (four teeth); bottom lever from 318.9. Tooth
    pitch 28.5 +/- 0.4. Across the card nothing can be taken from a 3D view, so the cages
    are centred and the lamp columns spaced 6.6 mm by the ratio column/row pitch = 1.33 read
    off the flat LED close-up (Figure 171). Estimated error about 1 mm along the card.
  ports: >-
    datasheet - UDS section 40.4.2.1: eight uplink ports on the front plate, each for a
    1G, 2.5G or 10G SFP/SFP+ module, placed under a 45 degree angle for fibre bend radius.
    Composed as std/sfp@1 at its registry aperture, rotate 90: in Figure 170 at 4x
    each cage opening's long side runs down its facet, ALONG the card, so the 14.5 mm
    side of the aperture lies along the 405 mm and the 10 mm side across it. Each cage
    sits `on` its tooth's face facet, so the drawing foreshortens it to 14.5 x cos 45 =
    10.25 mm along the card; its centre stays on the 28.5 mm tooth pitch (67.3 ... 277.4)
    and `at` is that centre less 5 x cos 45, the projected half of the unrotated height,
    at the true size 14.5 x 10 (L9). Which way each latch faces
    is not resolved at 300 ppi; rotate 90 rather than 270 is the library's vertical-card
    convention, not a reading. Numbering 1-8 top to bottom is
    ASSUMED: the lamp legend numbers 1-8, the board carries no numeral beside any cage in
    Figure 170, and no document maps cage to number (gap).
  lamps: >-
    datasheet - Figure 171 (p389, embedded 1435 x 409 at 300 ppi) and Table 121. Two
    columns: ALM | PWR, then 1 | 2, 3 | 4, 5 | 6, 7 | 8, legends outboard, a bracket
    labelled PORT on the right beside rows 1-8. Table 121: PWR on = power on; ALM red =
    alarm present; port lamp off = no link, green = link up, blinking green = traffic.
    The PWR colour is not stated (on/off only); drawn and named 'on' with the family green.
  relief: >-
    estimated - the ejectors stand proud of the plate; no document gives a figure, so the
    library's pooled release-hardware estimate (4.2, as cisco/ and edgecore/ parts carry)
    is used. The sawtooth is sixteen facets (provenance.angled-panel), not an `out`: a
    facet is the sloped surface itself and the cages on it are cut into it.
  angled-panel: >-
    datasheet and drawing - UDS section 40.4.2.1 places each uplink 'under a 45 degree
    angle', and Figure 170 draws the eight cages on a sawtooth. Each tooth is two facets:
    the FACE, which carries the cage and looks up (root at its upper edge on the plate,
    lower edge proud), and the RETURN below it, which looks down and closes the tooth back
    to the plate. Both are 45 degrees and 14.25 mm front-view, so they meet at a 14.25 mm
    apex and a tooth is the 28.5 mm pitch. Measured in Figure 170 on the near-side edge
    of one tooth (image px): a run of 40 out of the plate over a rise of 54.5 (face) and
    41.75 (return) down the card. The oblique's depth axis, read off the board's top edge
    (15 px down per 100 across, and about 3.1 px/mm over the 205 mm depth), turns that
    into an apex 12.9 mm proud over 14.0 and 13.8 mm front-view: 43 degrees each (45 if
    the depth is the 225 mm figure), so 45/45 as the text says. Each face is centred on
    its cage, which keeps the cage centres where layout puts them; the projected cage
    (10.25 mm) has 2.0 mm of face above and below it, 2.83 mm along the slope. A 45/45
    tooth is square, so a cage's depth runs parallel to the return and stays 2.83 mm
    inside it however deep it goes. What the facets cannot say: Figure 170 draws the six
    valleys INSIDE each group about 2.7 mm proud of the plate (the first face and last
    return of each group are that much longer), and a facet's `lift` would float it off
    the plate, so every valley is modelled on the plate and each group's teeth span 114
    mm (60.2-174.2, 184.8-298.8) against the 118 read off the figure (57.5-175.5,
    181.5-300.3); the difference is flat plate at each end of a group.
  gaps: >-
    Valleys between teeth drawn about 2.7 mm proud of the plate (modelled on it).
    Faceplate edge-to-edge width (26 mm stated overall, held at the 25 mm pitch).
    Whether the SFP+ modules are inside the 26.4 W figure. Cage-to-number mapping
    (assumed 1-8 top to bottom). Cage latch direction (not resolved in Figure 170).
  logo-zone: >-
    reserved by the family convention; Figure 170 draws no mark on the plate, so the zone
    sits on the empty metal between the last cage and the bottom lever.
  lifecycle: >-
    searched only the staged corpus - the UDS guides list it as current; no end-of-life
    notice was searched for on the web.
  thumbscrews: >-
    photo - owner's lab photos of an installed FX-8, 2026-09-24; flush-with-end per the owner.
    One family figure for every NT, NTIO and LT card and blank, because every screw goes into
    the fixed rails of the shelf: head 10.5 mm across, centred 18.7 mm from the left edge on
    this 25 mm plate, the top head touching the top end (y 0) and the bottom head the bottom
    end (y 394.5). Measured as ratios within one card on perspective phone photos, the
    plate-plane screw centre read from the recessed seat (concentric with the shank) rather
    than the projecting head: 30 mm NT (FANT-H top 0.640, bottom 0.651; FANT-F top 0.64-0.67,
    bottom about 0.64) -> 19.4 (ratio 0.647); 25 mm NTIO blank 3FE65651BA (top 0.733, bottom
    0.754) -> 18.7 (ratio 0.748). Head diameter against plate width: the back edge of the
    knurl 0.36 of the FANT-H plate and 0.42 of the NTIO plate at the bottom, the front faces
    0.39-0.48 (magnified by their projection), so an upper bound of 10.6-10.8 mm; 10.5 taken
    (0.35 of 30, 0.42 of 25), inside the 10-11.5 mm the Nokia flat FANT-H view draws. The
    screw sits on the side AWAY from the grey ejector lever (lever at the left edge, screw
    right of centre) at both ends. Same centre at both ends: the photos differ by under 1 mm,
    within the reading error. This replaces the per-figure screw positions and sizes read off
    the oblique guide drawings, which had drifted 17.2-21.0 across and 6.4-10.0 in size.
