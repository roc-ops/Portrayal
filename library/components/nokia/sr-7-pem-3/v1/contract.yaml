name: sr-7-pem-3
version: 1.0.0
class: power
behaviour: fills
profile: networking
description: >-
  Nokia DC PEM-3 100A, the power entry module of the 7750 SR-7 and 7450 ESS-7. Two are
  factory-installed in rear power bays 1 and 2 and share the load; one carries the whole
  chassis, two give 1+1. Each PEM-3 connects inside the chassis to its own DC 100A power
  supply filter in the front filter bay of the same number (nokia/sr-7-power-filter). Its rear
  face carries a single-feed -48 VDC / RTN terminal block (two studs per pole, for a two-hole
  lug) under a clear safety cover with a U notch round the left captive screw, the ON/OFF
  circuit breaker, a pull handle, the second captive screw, and the printed "Model 7750 SR-7 /
  100A PEM-3" with two hazard triangles. It has no lamp: its status shows on the CPM (Pwr
  1-2). Authored as drawn in power bay 1 (terminal block at the left).
unplaced: >-
  seated by the SR-7 rear power bays (pem-1, pem-2); the coordinator wires it
size: {w: 219.5, h: 42.7, d: 195.6}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
