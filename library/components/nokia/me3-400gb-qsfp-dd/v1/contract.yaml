name: me3-400gb-qsfp-dd
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia 3-port Universal QSFP-DD MDA-e-XP (3HE15764AA), CLI type me3-400gb-qsfp-dd, for the 7750
  SR-1 (FP4) and the IOM5-e. Three QSFP-DD cages in bezels at the right of the plate, c1 to c3
  left to right, taking QSFP28, QSFP28-DD, QSFP56-DD and QSFP+ optics at 10/40/100/400GE (XP
  p94); in 400GE MAC mode only c1 and c2 run, each with a 1x400GE module. A Lnk and an Act lamp
  sit above every cage and its cN legend below it; Stat and Pwr are at the left end, the model
  label at the lower right, an insertion handle at each top corner and a captive screw on each
  lower wing.
size: {w: 193, h: 35.4, d: 193}
size-confidence: {w: drawing, h: drawing, d: datasheet}
size-notes: >-
  w and h are the shared 7750 MDA envelope (193.0 x 35.4) the slots are built to; the guide
  states 1.4 x 7.6 in, rounded to 0.1 in. d is the stated 7.6 in.
