groups:
  pon:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: xfp, speed: 10g, pon: 10g-epon}
    description: the eight 10G EPON XFP ports (IEEE 802.3av; 10/10, 10/1 and 1/1 coexistence)
  lnk-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: one dual-colour PON link lamp per XFP, legend LNK
  spd-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: one dual-colour PON speed lamp per XFP, legend SPD
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the board lamps ALM and PWR
