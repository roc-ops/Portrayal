format: 1
kind: module
name: fpxt-b
version: 1.3.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia FPXT-B (3FE 68788 AA, C-temp, and 3FE 68788 AB, I-temp), the 8-port 10G EPON line
  termination board of the 7360 ISAM FX. Eight IEEE 802.3av 10G EPON XFP cages down the
  front panel, each with a dual-colour LNK and SPD lamp pair beside it, and the board lamps
  ALM and PWR under the FPXT-B wordmark. Authored upright, as the Unit Data Sheet draws it
  (turned 90 degrees): thumbscrew and ejector lever at each end, ESD mark at the foot. AA
  and AB share one front panel (the AB data sheet reprints the AA figure, art number 24200),
  so they are one component; the part numbers are recorded in attrs.
size: {w: 25.0, h: 405.0, d: 227.99}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: >-
  w is the 25 mm board-to-board pitch the LT bays are built to. The FPXT-B is the one FX card
  family whose front-cover WIDTH Nokia states: "width top 26.08 mm, width bottom 24.5 mm"
  (UDS 1.8.1). Both are recorded in provenance and neither is drawn: 26.08 exceeds the pitch,
  and the orthographic Figure 9 shows NO taper along the 405 mm (both long edges are straight
  to the pixel from end to end), so what "top" and "bottom" measure is not resolvable from the
  figure. d is the larger board depth the UDS states (225 top / 227.99 bottom).
attrs:
  model: FPXT-B
  part-number: 3FE 68788 AA
  part-number-i-temp: 3FE 68788 AB
  mnemonic: FPXT-B
  pon: 10g-epon
  xfp: 8
  10g-epon: 8
  weight-kg: 1.2
  front-cover-width-top-mm: 26.08
  front-cover-width-bottom-mm: 24.5
provenance:
  size: >-
    datasheet - UDS 3FE68788AAAATQZZA06 (R5.4.01, FPXT-B AA) section 1.7.2: height 405 mm,
    width top 225 mm, width bottom 227.99 mm, board-to-board pitch 25 mm; section 1.8.1, the
    front cover: height 405 mm, width top 26.08 mm, width bottom 24.5 mm, pitch 25 mm; weight
    1.2 kg. The AB sheet 3FE68788ABAATQZZA02 sections 1.8.1 and 1.9.1 print the same figures.
  size-width: >-
    datasheet - slot pitch 25 mm, UDS 1.8.1. The faceplate width IS stated for this family,
    tapered 26.08 top / 24.5 bottom; held at the 25 mm pitch by the shared FX convention so the
    LT bay seats it. Figure 9 draws the plate 316 px across against 5033 px along (1200 dpi
    render, vector art), which is 25.4 mm at the along-scale: between the two stated widths and
    1.6% over the pitch. No taper shows along the length; the only width change drawn is at the
    two end tabs, where the lever-side edge steps in about 2.2 mm (drawn).
  depth: >-
    datasheet - "width top 225 mm, width bottom 227.99 mm" in UDS 1.7.2 are the board's depth
    front to back at its two ends; the larger is carried.
  weight: 'datasheet - 1.2 kg, UDS 1.8.1 (AA) and 1.9.1 (AB)'
  power: >-
    NOT FOUND - searched the ANSI Safety Manual 3HH12894AAAATCZZA27 and A23 Table 2, the ETSI
    Safety Manual 3HH11998AAAATCZZA29 and A25, the Lightspan Safety Manual 3HH91852AAAATCZZA07,
    and every FPXT-B UDS edition held (A01-A06, AB A01-A02) for FPXT and for a wattage; none
    carries a row or figure for the FPXT-B. The coverage grid's "stated in UDS" is wrong. L27
    stands as the record.
  layout: >-
    drawing - UDS 3FE68788AAAATQZZA06 p12 Figure 9 "Front panel of FPXT-B", vector art rendered
    at 1200 dpi. It is an ORTHOGRAPHIC front view of the card turned 90 degrees
    counter-clockwise (the wordmark and PWR/AIM read bottom to top), so its left end is the
    card's top and its top edge the card's right side. Gate 1: 5033 px along for 405 mm is
    12.427 px/mm; 316 px across is 25.4 mm, within 2.6% of 26.08 and 1.6% of 25, so positions
    along the card are taken at 12.427 px/mm and across it as fractions of the 316 px plate
    mapped onto 25 mm. Read: screws (17.6, 6.5) and (17.5, 398.6); top lever x 1.3-6.4, y
    11.0-43.5, bottom lever y 361.4-394.0; FPXT-B wordmark centred y 37.0, x 8.5-20.6; ALM and
    PWR lamps at y 45.7, x 9.5 and 14.2; XFP cage bezels x 4.0-20.8, the first y 51.3-84.9, on
    a 37.42 mm pitch (465 px, identical for all eight to the pixel); the inserted module's face
    centred x 12.3, 21.6 mm into each bezel; LNK and SPD lamps at x 5.3, 7.3 and 21.6 mm into
    each bezel; ESD mark centre (14.5, 387.0).
  ports: >-
    datasheet - UDS 1.3: "8 compliant IEEE802.3av EPON XFP ports". Composed as std/xfp@1 at its
    registry aperture, turned 90 degrees: the drawn bezel is 16.8 mm across, narrower than the
    19.5 mm XFP opening, and the inserted module's face measures 13.0 mm along the card, which
    is the 18.35 mm XFP width foreshortened by a 45 degree tilt (18.35 x 0.707 = 12.97), so
    the module's width runs ALONG the card on a slanted face, as the 3D Figure 7 draws the
    sawtooth. Each cage now sits `on` the 45 degree face of its tooth, so the aperture draws at
    its 13.8 mm projection (see provenance.angled-panel). Numbering 1-8 from the top is ASSUMED from Figure 8, whose XFP legends run left to right
    from the ALM/PWR end; the panel prints no number beside any cage.
    The export rate is `10g-epon: 8` from the same line and the unit name, "8p 10G EPON
    Line Termination unit" (section 1.1), so the cages export as `10g-epon` rather than the
    XFP cage default, 10GBASE-X.
  angled-panel: >-
    drawing and estimated - every XFP sits on its own tooth, two facets inside its drawn cage
    bezel: a RETURN turned 47 degrees up from the plate at the bezel top, then the cage FACE
    turned 45 degrees DOWN back to the plate, the two meeting at an apex about 15.0 mm proud.
    Read from three figures that agree: the orthographic Figure 9 (p12) draws each bezel as a
    blank band on the card-top side (the return, y 52-65 in the first bezel), then the inserted
    module face (66-80), foreshortened to 13.0 mm for its 18.35 mm width (cos 45 degrees), then
    a narrow strip; the 3D Figure 7 (p10) draws each module body standing out of the panel
    pointing down and out, which is a cage mouth facing down; and the FPXT-A front-cover figure
    draws the same ramp-then-mouth tooth. The face angle is that measured 45 degrees; the
    face is sized around the cage projection with 0.7 mm above and 0.5 mm below it (65.31-80.29
    in the first bezel), and the return fitted to meet its apex from the bezel top (51.34), so it
    comes out 47 degrees; the two agree within 0.1 mm. Across the card the tooth spans x 6.4-18.4,
    the band Figure 9 draws between the lamp strip and the long edge strip, so the LNK/SPD lamps
    stay on the flat bezel floor. A cage well runs back along its face normal, up and in, and
    stays under the return: the face and return total 92 degrees, but the port top sits 0.7 mm
    below the apex, which leaves the well clear of the return by at least 0.2 mm over its 61.7 mm
    depth. The apex height is derived from the angle and the bezel, not measured: no document
    dimensions it.
  lamps: >-
    datasheet - Figure 8 (p11) and Table 2. ALM and PWR round lamps under the wordmark; one
    dual-colour (red/green) LNK lamp and one SPD lamp under each XFP. Table 2: PWR off / blinking
    green initialization / green on; ALM off / red alarm; LNK off = PON not active (safe to
    remove), green = provisioned and active, red+green (drawn yellow) = provisioned but no ONU
    ranged, red = transmitter failed or XFP unreachable; SPD off = 10G/1G, green = dual-speed,
    red+green = 10G/10G, red = speed read error. The "both red and green on" state is drawn
    yellow (#f2b705) because that is what a lit red/green bicolour shows; Nokia names it only as
    both elements on. SPD off is a meaningful state (10G/1G) and is drawn unlit.
  lamp-size: >-
    drawing - round lamps drawn 3.4 mm across, carried as common/led-indicator@1 (4 mm bezel);
    the LNK/SPD lamps are drawn 3.6 x 1.0 mm as two halves, carried as common/led-rect-sm@1
    turned 90 degrees (1.6 x 2.8), the nearest library bar lamp. Shape is a compromise.
  legends: >-
    drawing - Figure 9 prints FPXT-B, PWR, "AIM" and LNK / SPD under every cage. "AIM" is read as
    printed in the figure art and in its text layer, and in the FPLT-A art; every LED table
    names the lamp ALM, so ALM is printed here and the art's spelling is taken as a drafting
    slip (gap). No cage numbers are printed on the panel and none are drawn.
  levers: >-
    drawing - Figure 9 draws a lever lying along the card's left edge at each end, with a pivot
    tab beyond it; positions as read in layout.
  colour: 'estimated - light silver-grey plate, dark levers, the family finish of the shared FX conventions; no FPXT-B photograph was staged'
  relief: >-
    estimated - the levers stand proud; no document gives a figure, so the library's pooled
    release-hardware estimate (4.2, as nokia/fnio-a@1 carries) is used.
  logo-zone: 'reserved by the family convention on the empty plate between the last cage and the bottom lever; Figure 9 draws no mark there'
  lifecycle: 'searched only the staged corpus - no end-of-life notice was searched for on the web'
  thumbscrews: >-
    photo - owner's lab photos of an installed FX-8, 2026-09-24; flush-with-end per the owner.
    One family figure for every NT, NTIO and LT card and blank, because every screw goes into
    the fixed rails of the shelf: head 10.5 mm across, centred 18.7 mm from the left edge on
    this 25 mm plate, the top head touching the top end (y 0) and the bottom head the bottom
    end (y 394.5). Measured as ratios within one card on perspective phone photos, the
    plate-plane screw centre read from the recessed seat (concentric with the shank) rather
    than the projecting head: 30 mm NT (FANT-H top 0.640, bottom 0.651; FANT-F top 0.64-0.67,
    bottom about 0.64) -> 19.4 (ratio 0.647); 25 mm NTIO blank 3FE65651BA (top 0.733, bottom
    0.754) -> 18.7 (ratio 0.748). Head diameter against plate width: the back edge of the
    knurl 0.36 of the FANT-H plate and 0.42 of the NTIO plate at the bottom, the front faces
    0.39-0.48 (magnified by their projection), so an upper bound of 10.6-10.8 mm; 10.5 taken
    (0.35 of 30, 0.42 of 25), inside the 10-11.5 mm the Nokia flat FANT-H view draws. The
    screw sits on the side AWAY from the grey ejector lever (lever at the left edge, screw
    right of centre) at both ends. Same centre at both ends: the photos differ by under 1 mm,
    within the reading error. This replaces the per-figure screw positions and sizes read off
    the oblique guide drawings, which had drifted 17.2-21.0 across and 6.4-10.0 in size.
