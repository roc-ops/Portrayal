groups:
  pon-xgs:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g, pon: xgs-pon}
    description: the odd PON ports (1, 3 ... 15) - GPON, XGS-PON or Multi-PON (MPM)
  pon-25gs:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g, pon: 25gs-pon}
    description: the even PON ports (2, 4 ... 16) - GPON, XGS-PON, MPM, and 25GS-PON
  pon-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: one PON state lamp left of each cage
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the board lamps ALM and PWR
