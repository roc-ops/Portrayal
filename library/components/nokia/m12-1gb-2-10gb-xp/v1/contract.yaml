format: 1
kind: module
name: m12-1gb-2-10gb-xp
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia (Alcatel-Lucent) 7750 SR 12-port GE SFP + 2-port 10GE XFP combo MDA-XP, printed
  M12-1GB+2-10GB-XP (3HE07282AA), a classic half-slot MDA for the IOM3-XP drawn in the guide's
  later style: twelve SFP cages in two ganged rows of six, odd ports 1-11 across the top and even
  ports 2-12 across the bottom, two XFP cages (ports 13 and 14) at the right, each with its Lnk,
  Act, WAN and Laser Dis. lamps printed beneath, a printed Lnk/Act grid for the SFP ports under
  the XFPs, the Stat and Pwr lamps at the upper left, an ESD mark at the upper right, a Phillips
  captive screw at the centre of each end and an ejector lever block in each lower corner.
  Authored horizontal; an SR-12 IOM3-XP seats it on end with the carrier.
size: {w: 190.5, h: 35.4, d: 177.8}
size-confidence: {w: datasheet, h: drawing, d: datasheet}
size-notes: >-
  The chassis guides give MDAs 1.4 x 7.5 x 7.0 in (3.56 x 19.05 x 17.78 cm, SR7 p106 Table 47).
  Held at 190.5 x 35.4 so it seats in the IOM3-XP's MDA bays on the 35.4 slot pitch; Figure 10 is
  fitted per axis to that face, lever blocks included.
attrs:
  model: M12-1GB+2-10GB-XP
  part-number: 3HE07282AA
  sfp: 12
  xfp: 2
  power-draw-max-w: 34
provenance:
  sources: >-
    datasheet - 7x50 MDA-XP Installation Guide 9302180206 (MXP): p39 Figure 10 and p39-40 Table 10
    (the face, its lamps and screws), p18 Table 2 (power, "2-pt 10GE + 12-pt 1GE MDA-XP (2+12
    port)"), p19 Table 3 (optics power), p9 (the model list, "2-pt 10GE XFP + 12-pt 1GE MDA-XP").
    SR7 22.7 3HE18643AAAATQZZA03 p106 Table 47 (MDA size). SR7 15.1 3HE14151AAAATQZZA02 p98 Table
    32 (part number, "7750 SR 2-port 10GE XFP + 12-port GE SFP - MDA-XP", 3HE07282AA, no second
    number; the 22.7 edition no longer lists it).
  model: >-
    drawing - Figure 10 prints the model legend on two lines at the lower right, "M12-1GB+" over
    "2-10GB-XP" (the page's text layer, read at 1200 dpi), i.e. M12-1GB+2-10GB-XP; the name is that
    legend lower-cased with its punctuation as hyphens. No guide held spells the model any other
    way: the MXP headings call it the "12-Port 1GB + 2-Port 10GB Combo SFP MDA-XP".
  size: 'datasheet - SR7 p106 Table 47; see size-notes'
  layout: >-
    drawing - MXP p39 Figure 10 (art al_0103), vector (pdfimages finds no raster), rendered at 1200
    dpi. Fitted per axis: 4003 px across the plate to 190.5 (21.01 px/mm) and 738 px from the top
    line to the bottom of the lever blocks to 35.4 (20.85 px/mm), 0.8 percent apart. THE OUTLINE IS
    NOT THE MDA00xx ONE: no notches; an ejector lever block in each lower corner (x 0-31.84 and
    158.62-190.5, from y 27.92) runs to the bottom edge and the plate between them stops at y 33.26,
    as Figures 6 and 7 draw it, the reverse of the older MDA0077 drawing of nokia/m10-1gb-xp-sfp@1.
    Modelled as drawn. The SFP half is Figure 7's to 0.05 mm: two six-port bezels 13.91-103.55,
    rows centred y 6.88 and 20.63, numerals 1 and 11 beside the top row and 4-12 under the bottom
    one over a "SFP Ports" bracket. The XFP half is Figure 6's: bezels 21.07 x 11.16 at x 110.46
    and 146.91, y 1.97, inner openings centred x 121.07 and 157.45, y 7.55; numerals 13 and 14 at
    their upper right; the "XFP" bracket at y 13.77. Beneath each XFP Lnk, Act, WAN and Laser Dis.
    (keys 7, 8, 10 and 9), lamps drawn 2.9 across on y 18.64 at x 113.29, 118.43, 123.61 and 128.71
    for port 13 and 149.93, 155.02, 160.09 and 165.35 for port 14. The SFP Lnk/Act grid (keys 5
    and 6) sits under them, 104.51-152.86 x 20.84-30.72 split at 25.78, filled header cell
    104.51-110.36, cells split at 117.5, 124.7, 131.9, 139.0 and 146.1, lamps drawn 1.6 across at x
    114.48-150.40 on a 7.18 pitch, Lnk y 22.31 and Act 24.39 for the odd ports, 27.05 and 29.12 for
    the even ones. Stat (10.47, 4.77) and Pwr (10.47, 9.95); captive screws (key 11) centred (6.71,
    22.0) and (184.15, 22.0); ESD mark centred x 184.84 - all as Figures 6 and 7, whose values the
    skin shares.
  legends-under-levers: >-
    drawing - the model legend's first line, M12-1GB+, is drawn (x 161.23-173.54, baseline 28.83),
    its foot touching the right lever block as the figure draws it; the second line, 2-10GB-XP
    (baseline 31.71), and the port numeral 2 (x 21.38, baseline 29.72) are in the page's text layer
    and wholly under the lever art. Ink a lever covers is not seen on the card, so neither is
    drawn; the second line is the reason the model-label element spans only the first. Both sit
    where the older MDA00xx art put its legends, which reads as ink carried over from that template.
  cages: >-
    drawing + standard - SFP: each row is one bezel around six drawn openings on a 14.51 pitch, so a
    ganged cage, std/sfp-ganged@1 at the SFF-8433 pitch of 14.25 centred on the drawn block (x
    58.70), end cages 0.65 mm inside their drawn boxes. XFP: std/xfp@1 (INF-8077i aperture 19.5 x
    9.7) centred on each drawn opening, drawn 19.23 x 9.64; Figure 10 draws a duplex LC optic in
    each, and the cage is modelled, not the optic. SFP ORIENTATION IS NOT READ: plain filled
    openings with no latch or tab and no photograph, so the rows take the library's belly-to-belly
    default, upper 0 over lower 180 (L108).
  rate: >-
    datasheet - SR7 15.1 p98 and MXP p9 call the XFP ports 10GE; Table 10 key 7 gives Lnk green at
    10000 Mbps and key 10 a WAN lamp for 10GBASE WAN PHY framing, so they are Ethernet, LAN or WAN
    PHY, and the XFP family's cage default (10gbase-x-xfp) is the right export. The card states
    `sfp: 12` and `xfp: 2`, the count attrs other cards use; `xfp` is not a rate the exporter reads,
    and no attr it does read says 10GbE for an XFP, so L96 reports these two cages as typed by the
    table. The SFP ports are 1000BASE-X (key 5 lists 1000, 100 and 10 Mb/s link rates), stated on
    each port as `speed: 1g`.
  lamps: >-
    datasheet - MXP p39-40 Table 10: Status green blinking initializing, green up, amber
    operationally down, unlit administratively down; Power blue on, off no power; 1GB Lnk green
    link at 1000 Mbps, green fast blinking at 100 Mbps, green slow blinking at 10 Mbps, amber port
    not shut down, unlit disabled; 1GB Act and 10GB Act green active, amber error condition, unlit
    no activity; 10GB Lnk green link at 10000 Mbps, amber slow blinking no XFP installed, amber
    optics installed and no link, unlit disabled; Laser Disabled amber disabled, off on; WAN green
    all ports configured for WAN PHY framing, unlit not. No blink rates are given. The 2.9 lamps
    are common/led-indicator@1 and the 1.6 grid lamps common/led-dot@1 (lamp 1.4), each at its
    drawn centre.
  power: 'datasheet - MXP p18 Table 2: 2-pt 10GE + 12-pt 1GE MDA-XP 34 W maximum; SR7 15.1 p98 Table 32 gives 3HE07282AA 34 W worst case, agreeing. Optics not included: XFP 4 W and SFP 1 W each (MXP p19 Table 3)'
  colour: >-
    estimated - no photograph of an MDA-XP is held. Drawn in the charcoal of the SR-7/SR-12 card
    family; printing, including the ESD mark, in the family's white, since the figure is line art
    and states no colour. The grid's header cells are drawn filled in the legend white with the
    words in the plate colour, the inverse the figure's black-filled cells imply. A gap.
  logo-zone: 'none reserved - the face is full, and Figure 10 prints no mark'
  depth: 'datasheet - 7.0 in (17.78 cm), SR7 p106 Table 47'
  lifecycle: 'searched only the staged corpus - the MDA-XP guide and the 15.1 chassis guide list it; the 22.7 chassis guide does not'
  gaps: >-
    Colour is estimated. The SFP orientation is the library default, not a reading. The mda-type
    CLI string is not printed for this card in anything held, nor is a 7450 ESS part number. The
    XFP ports export by the cage default because no card attr names 10GbE on an XFP (L96). The
    lever blocks carry no relief: no document gives their projection. The lever blocks sit where
    nokia/iom3-xp@1 puts its divider foot and its own ejector levers over an MDA bay's lower
    corners (the MDA00xx notches, 15.5 wide below y 28.25), so seated in that carrier the IOM's
    furniture is drawn over them; the two figures disagree about what occupies those corners and
    nothing held settles it.
