groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      the two uplinks PORT 1 and PORT 2, QSFP28/QSFP+ cages: 1x 100GE, 1x 40GE, 4x 25GE or
      4x 10GE each, data or management uplink
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      the PTP interface, an SFP+ cage toward the PTP master: 1 Gb/s on the LBNT-A AA, 1 or
      10 Gb/s on the LBNT-A AB
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      reaching the board - the OOB and LEMI Ethernet management RJ-45s, the CRAFT serial
      RJ-45, the DEBUG USB Type-C (Nokia personnel) and the USB 2.0 Type-C
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the board lamps PWR, ALM and A/S and the PTP port lamp
  lane-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      four lamps above each uplink cage, legends 1 2 3 4: one per lane with channelised
      optics (led-port-N-L serves lane L of port-N)
