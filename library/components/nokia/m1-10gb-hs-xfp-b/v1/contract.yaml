format: 1
kind: module
name: m1-10gb-hs-xfp-b
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia (Alcatel-Lucent) 7750 SR / 7450 ESS 1-port 10GE XFP HS-MDA2, M1-10GB-HS-XFP-B
  (3HE06433AA), the second-generation High Scale MDA ("HS-MDAv2" in the chassis guides): one XFP
  cage right of centre, the Stat and Pwr lamps at the far left with the Laser Disabled, Lnk and
  Act lamps beside them, the model legend at the lower right and a Phillips captive screw on each
  lower end wing, drawn in the later al_ artwork on the notched classic-MDA outline. Authored
  horizontal; an SR-12 IOM3-XP seats it on end with the carrier.
size: {w: 190.5, h: 35.4, d: 177.8}
size-confidence: {w: datasheet, h: drawing, d: datasheet}
size-notes: >-
  The chassis guides give MDAs 1.4 x 7.5 x 7.0 in (3.56 x 19.05 x 17.78 cm, SR7 p106 Table 47).
  Held at 190.5 x 35.4 so it seats in the IOM3-XP's MDA bays on the 35.4 slot pitch; Figure 5 is
  fitted per axis to that face, and it is 12.6 percent out of aspect (provenance.layout).
attrs:
  model: M1-10GB-HS-XFP-B
  part-number: 3HE06433AA
  xfp: 1
  xfp-10g: 1
  power-draw-max-w: 44
  power-draw-typical-w: 39
provenance:
  ethernet-rate: >-
    the Ethernet rate, from the SR-7 15.1 guide 3HE14151AAAATQZZA02 p98, which lists
    3HE06433AA as "7750 SR 1-port 10GE HS-MDAv2". The export already typed it 10gbase-x-xfp
    by default; this makes that a statement.
  sources: >-
    datasheet - 7750 SR and 7450 ESS HS-MDA2 Installation Guide 93-0369-02-01 (MDA2): p30 Figure 5
    and Table 6 (the face and its lamps), p17 Table 3 (power), p9 (the carriers). SR-12 Chassis
    Installation Guide 9300190903 p39 Figure 8 and Table 7 (the same face, art al_0430). SR7 15.1
    3HE14151AAAATQZZA02 p98 Table 32 (part number and power). SR-12e 13.0 3HE09919AAACTQZZA01 p63
    Table 23 (power, a third reading). SR7 22.7 3HE18643AAAATQZZA03 p106 Table 47 (MDA size).
  size: 'datasheet - SR7 p106 Table 47; see size-notes'
  style: >-
    drawing - NEITHER OF THE TWO MDA-XP DRAWING STYLES. The outline is the classic notched one - the
    end wings stop short (y 29.75) and the band between the notches (x 14.5-175.9) runs to the
    bottom edge - but the artwork is the later al_ style: rounded top corners, Phillips captive
    screws, no screw tabs, no side guides, no lip lines, and no ejector lever blocks and no ESD
    mark either. Modelled as drawn.
  layout: >-
    drawing - MDA2 p30 Figure 5 (art al_0431), vector, rendered at 1200 dpi. GATE 1 FAILS: the
    plate measures 6669 px between its side lines and 1083 px from its top line to its bottom
    edge, aspect 6.16 against the real 5.38, while the lamp rings and screw rings are round in the
    drawing (118 x 120 px, 370 x 372 px); the art is drawn at one scale and the plate is drawn
    about 13 percent too short for its width. SR-12 guide p39 Figure 8 (al_0430) gives the same
    6.16 (6062 x 984 px), which corroborates the drawing, not the hardware. So only fractions are
    taken, per axis: 35.01 px/mm across (6669 px to 190.5) and 30.59 px/mm down (1083 px to 35.4).
    Positions: top corners rounded about 2 across; end wings to y 29.75, the notch edges at x 14.5
    and 175.9 with a rounded outer corner, the notch floor square. Lamp rings drawn 3.4 across:
    Stat (9.67, 4.82), Laser Disabled (14.87, 4.82), Lnk (20.07, 4.82) on one row; Pwr (9.67,
    10.80) and Act (20.07, 10.80) on the next. Legends Stat and Pwr left of their lamps (x
    2.9-7.1), Lnk and Act right (from x 22.8-23.0), Laser / Disabled on two lines from x 11.98
    (baselines 15.0 and 18.1) with a printed line from the Laser Disabled lamp down to it (x
    14.87, y 7.0-12.7). XFP bezel x 120.14-140.56, y 1.85-13.68, centre (130.35, 7.77), drawn
    with a double wall and the cage's latch slot and host connector inside; port numeral 1 under
    it at x 130.4, baseline 19.7. Captive screws (key 1 in Figure 8) centred (6.10, 22.54) and
    (184.44, 22.54), outer ring 10.6 across, Phillips heads. Model legend x 146.34-171.97,
    baseline 34.15, regular weight.
  legend: >-
    drawing - read at 1200 dpi: the legend prints M1-10GB-HS-XFP-B, in the same face as the rest of
    the al_ printing. MDA2 Table 6 carries no model-number key; the figure and its caption name
    the card.
  cages: >-
    drawing + standard - one std/xfp@1 (INF-8077i aperture 19.5 x 9.7) centred on the drawn bezel,
    whose margin is drawn as the bezel. ORIENTATION IS NOT READ as a latch: the drawing puts the
    cage's slot bar at the top and its connector below it, which is the XFP host cage seen face
    on, and the cage takes rotate 0. No photograph of this card is held.
  lamps: >-
    datasheet - MDA2 p30 Table 6: Pwr blue power present/normal, unlit no power present at board;
    Stat green blinking initializing, green up, amber operationally down, off administratively
    down; Laser Disabled amber laser disabled, off laser on; Act green active, amber error, unlit
    no activity; Lnk green link established, amber slow blinking no optic installed, amber fast
    blinking loopback, amber solid optics installed and no link, unlit disabled. The Lnk row says
    "@ 1000 Mbps" and "No SFP is installed" on this 10G XFP card, the SFP card's wording carried
    over; the states are kept, the rate is not repeated. No blink rates are given. Every lamp is
    common/led-indicator@1 at its per-axis centre.
  power: >-
    datasheet - MDA2 p17 Table 3: M1-10GB-HS-XFP-B 36 idle, 37 zero rate, 39 typical, 44 worst
    case; SR7 15.1 p98 Table 32 gives 3HE06433AA the same four; SR-12e 13.0 p63 Table 23 gives them
    again on the row "HSMDA - 7750 High Scale MDA". XFP optics are not in MDA2 Table 4, which lists
    SFPs only; not included.
  part-number: >-
    datasheet - SR7 15.1 p98 Table 32: 3HE06433AA "7750 SR 1-port 10GE HS-MDAv2". The row names no
    model; it is this card by its description and by its four power figures, which are MDA2 p17
    Table 3's for M1-10GB-HS-XFP-B.
  cli-type: >-
    not set - no document held prints m1-10gb-hs-xfp-b. SR-12e 13.0 p63 Table 23 prints the CLI
    string hs-mdav2 on a row "HSMDA - 7750 High Scale MDA" carrying exactly this card's four power
    figures, but the row does not name the card and its sibling has a string of its own
    (m10-1gb-hs-sfp-b, p61), so the match is not taken as this card's mda-type.
  colour: >-
    estimated - no photograph of an HS-MDA2 is held. Drawn in the charcoal of the SR-7/SR-12 card
    family, printing in the family's white, silver Phillips screws as on nokia/m12-1gb-xp-sfp@1. A
    gap.
  logo-zone: 'reserved on the plain plate between the lamps and the cage; Figure 5 draws no mark'
  depth: 'datasheet - 7.0 in (17.78 cm), SR7 p106 Table 47'
  lifecycle: >-
    searched only the staged corpus; every chassis guide from 14.0 to 25.10 held, the SR-7 22.7
    edition included, carries 3HE06433AA's power row. No end-of-sale notice searched.
  gaps: >-
    Colour is estimated. The figure fails Gate 1 at 12.6 percent, so every y is a fraction of an
    out-of-aspect drawing. No mda-type string is held for this card. The group's speed is the
    XFP's 10G; the guide says nothing of LAN or WAN PHY.
