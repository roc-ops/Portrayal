<svg xmlns="http://www.w3.org/2000/svg" width="32.9mm" height="345mm" viewBox="0 0 32.9 345">
  <!-- Nokia BFAN-E front edge, 32.9 x 345, upright as it stands at the FX-8's right end.
       From the vector front-edge view of Figure 2, 3FE66545AAAATQZZA03 p8, at 5.771 px/mm,
       positions by row and column edge scans. x 0-24.2 is the front plate; 24.2-32.9 is the
       fan plate's folded flange seen end-on. -->
  <rect id="face" x="0" y="0" width="32.9" height="345" rx="0.4" fill="#c9ccd0" stroke="#9ba0a6" stroke-width="0.3"/>
  <rect id="flange" x="24.2" y="0" width="8.7" height="345" fill="#b3b7bc" stroke="#9ba0a6" stroke-width="0.2"/>
  <line id="fold" x1="2.4" y1="0" x2="2.4" y2="345" stroke="#9ba0a6" stroke-width="0.2"/>
  <rect id="top-block" x="0" y="0" width="24.2" height="20.1" fill="#bfc3c7" stroke="#9ba0a6" stroke-width="0.2"/>
  <rect id="window-left" x="4.3" y="25.1" width="8.5" height="43.9" rx="0.8" fill="#aeb2b7" stroke="#6f757b" stroke-width="0.25"/>
  <rect id="window-right" x="13.6" y="25.1" width="8.4" height="43.9" rx="0.8" fill="#aeb2b7" stroke="#6f757b" stroke-width="0.25"/>
  <rect id="caution-label" x="4.3" y="71.9" width="18.9" height="41.9" fill="#e9eaeb" stroke="#1d2023" stroke-width="0.25"/>
  <g id="esd-mark">
    <circle cx="14.25" cy="119.8" r="3.1" fill="none" stroke="#1d2023" stroke-width="0.35"/>
    <path d="M 14.25 117.7 L 16.2 121.2 L 12.3 121.2 Z" fill="#1d2023"/>
  </g>
  <g id="grip">
    <rect x="11.1" y="129.8" width="13.8" height="34.8" fill="#b3b7bc" stroke="#3a3f44" stroke-width="0.3"/>
    <line x1="21.0" y1="129.8" x2="21.0" y2="164.6" stroke="#3a3f44" stroke-width="0.25"/>
  </g>
  <rect id="label-window" x="4.3" y="179.7" width="9.5" height="27.9" rx="0.8" fill="#aeb2b7" stroke="#6f757b" stroke-width="0.25"/>
  <circle id="cover-boss" cx="15.4" cy="298.0" r="1.4" fill="#8d9298" stroke="#3a3f44" stroke-width="0.25"/>
  <g id="captive-screw">
    <circle cx="15.5" cy="340.0" r="4.5" fill="#2e3236" stroke="#15171a" stroke-width="0.3"/>
    <circle cx="15.5" cy="340.0" r="2.2" fill="none" stroke="#6f757b" stroke-width="0.3"/>
    <path d="M 14.3 340.0 H 16.7 M 15.5 338.8 V 341.2" stroke="#6f757b" stroke-width="0.35"/>
  </g>
  <rect id="logo-zone" x="4.3" y="220.0" width="16.0" height="10.0" fill="none"/>
  <g id="silkscreen">
    <path d="M 7.7 93.5 L 11.3 91.4 L 11.3 95.6 Z" fill="none" stroke="#1d2023" stroke-width="0.35"/>
    <text x="15.6" y="92.4" font-family="Arial" font-weight="bold" font-size="3.0" fill="#1d2023" text-anchor="middle" transform="rotate(-90 15.6 92.4)">CAUTION</text>
    <text x="21.0" y="91.3" font-family="Arial" font-weight="bold" font-size="3.0" fill="#1d2023" text-anchor="middle" transform="rotate(-90 21.0 91.3)">ROTATING FAN BLADES</text>
  </g>
</svg>
