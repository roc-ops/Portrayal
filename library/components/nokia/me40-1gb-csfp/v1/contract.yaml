  model-label: {at: [171.8, 10.5], size: [19.4, 2.4], class: label}
  esd-mark: {at: [184.0, 3.0], size: [5.8, 4.9], class: label}
  logo-zone: {at: [14.5, 14.2], size: [9, 4.5], class: label}
relief:
  wall: '#23272a'
  features:
    - {node: screw-left, cyl: 1.6, confidence: estimated, source: 'edgecore/agr-panel-screw@1 - the library one figure for a captive screw head, itself estimated and not measured'}
    - {node: screw-right, cyl: 1.6, confidence: estimated, source: 'edgecore/agr-panel-screw@1 - the library one figure for a captive screw head, itself estimated and not measured'}
groups:
  csfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: >-
      the 20 CSFP/SFP cages in two ganged 2-row blocks (six columns, then four). Each cage takes a
      dual-port CSFP (two interfaces) or a single-port SFP (the odd interface only): column k has
      ports 4k-3 and 4k-2 in its top cage and 4k-1 and 4k in its bottom cage, 40 ports in all (MDAE
      Table 10 keys 3-4, section 4.2.1). Each cage declares its two ports as `interfaces:`, the
      pair its id names.
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      one Lnk/Act lamp per port, 1-40 in a row above the cages, each with its numeral above and a
      triangle to its right pointing up for a top-row port and down for a bottom-row port
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the card lamps Stat and Pwr at the upper left
