format: 1
kind: module
name: me16-25gb-sfp28-2-100gb
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia 16-port SFP28 + 2-port QSFP28 MDA-e-XP, 3HE15151AA and its -B variant 3HE18361AA (IEEE
  1588v2 PTP), CLI types me16-25gb-sfp28+2-100gb-qsfp28 and me16-25gb-sfp28+2-100gb-qsfp-b, for
  the 7750 SR-1 (FP4) and the IOM5-e. Both variants share this face; the printed model label is
  a field. Sixteen SFP28 cages with MACsec (SFP+ and SFP28, 10/25GE) in two 2x4 ganged blocks,
  the top row c1, c3 ... c15 and the bottom row c2, c4 ... c16, and two stacked QSFP28 cages c17
  (top) and c18 (bottom) at the right (XP p98-99). The SFP Lnk and Act lamps are in a strip
  under the blocks, a lamp-triangle-lamp group per port; the QSFP lamps sit to the right of each
  cage. Stat and Pwr are at the left end, the model label at the top right, an insertion handle
  at each top corner and a captive screw on each lower wing.
unplaced: >-
  seated by the 7750 SR-1 MDA slots (mda-1, mda-2) and, in later waves, the IOM5-e of the SR-7,
  SR-12 and SR-12e; the coordinator wires it.
size: {w: 193, h: 35.4, d: 193}
size-confidence: {w: drawing, h: drawing, d: datasheet}
size-notes: >-
  w and h are the shared 7750 MDA envelope (193.0 x 35.4) the slots are built to; the guide
  states 1.4 x 7.6 in, rounded to 0.1 in. d is the stated 7.6 in.
