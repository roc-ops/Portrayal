format: 1
kind: module
name: fglt-b
version: 1.4.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia FGLT-B (3FE 68954 AB), the 16-port GPON line termination board with traffic
  manager (version B) of the 7360 ISAM FX and Lightspan FX. Seats in any LT slot of the
  FX-4, FX-8 and FX-16. Authored upright, as the Unit Data Sheet guides draw it: a
  thumbscrew and a grey ejector lever in a cap at each end, the PWR and ALM lamps and a
  hot-surface mark under the top cap, then eight windows in a flat faceplate, each
  showing two SFP cages angled on a sawtooth behind the plate (16 GPON ports), and the
  barcode and model labels above the bottom cap. One PON lamp per port sits in the side
  of its socket, on the port's left. The face is the FGLT-A's; only the model label
  differs.
size: {w: 25.0, h: 405.0, d: 225.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: >-
  w is the board-to-board PITCH (25 mm), the width the shared 7360 FX LT bay is built to;
  the faceplate's own edge-to-edge width is not stated. d is the board's depth at its
  top, 225 mm; the UDS gives 205 mm at the bottom (the board is stepped, and Figure 183
  draws the step).
attrs:
  model: FGLT-B AB
  part-number: 3FE 68954 AB
  gpon: 16
  weight-kg: 1.1
  power-draw-max-w: 100
  power-draw-typical-w: 89
provenance:
  size: >-
    datasheet - Lightspan FX Unit Data Sheet guide 3HH90279AAAATQZZA23 section 38.5.2
    (p396): height 405 mm, width 225 mm (top) / 205 mm (bottom), board-to-board pitch
    25 mm; ETSI UDS 3FE77012AAAATQZZA18 section 35.5.2 prints the same. The UDS "width" is
    the board's depth into the shelf. Face held at the 25 mm pitch by the shared 7360 FX
    convention.
  size-width: >-
    datasheet - slot pitch 25 mm, UDS section 38.5.2; faceplate width not stated, taken
    as the pitch. The photograph below measures the plate at 25.1 mm across at the scale
    its own window pitch gives, which agrees to the pixel it resolves.
  depth: >-
    datasheet - 225 mm at the top, 205 mm at the bottom, section 38.5.2; 225 carried as
    the envelope. ETSI Figure 137 (p340, 1848 x 1490 at 300 ppi) is an orthographic side
    elevation that measures 227.5 and 207.6 mm at its own 3.459 px/mm, so the drawing is
    to scale.
  weight: 'datasheet - 1.1 kg, Lightspan UDS A23 section 38.5.2 (p396)'
  power: >-
    datasheet - Lightspan FX Safety Manual 3HH91852AAAATCZZA07 p37 Table 2 and ANSI Safety
    Manual 3HH12894AAAATCZZA27 p25 Table 2: FGLT-B 89 W typical, 100 W maximum. Neither
    table's notes say whether the SFP optics are inside the figure (the one note that
    speaks to scope is FANT-F's, which excludes NTIO and SFPs), so that scope is open
    (gap).
  layout: >-
    photo-measured along the card, drawing-checked. The guides draw this card only in
    side elevation (ETSI Figure 137 p340, Lightspan Figure 183 p396, ANSI Figure 109): the
    faceplate is seen edge-on, a flat plate with eight sawtooth teeth behind it on a 38.2
    mm pitch (tooth apexes at 54.9 to 358.2 mm on the 405). The face comes from the
    drinia.tech olt1.jpg photograph (2000 x 2000, card horizontal, top end at the left),
    near orthographic: the plate reads 116 px across and the window pitch 177 px, which
    is 25.1 mm and 38.3 mm at 4.63 px/mm, so both axes agree. The thunder-link
    5061fglt-b-2.jpg photograph (1200 px) shows the same face and was used to confirm it.
    Along the card the photo is anchored to the drawing at the end of window 8 (358 mm);
    top cap to 16.8, PWR lamp 31.5, ALM 36.5, hot-surface mark 34.0-42.0, window 1 from
    43.0, the bars between windows at 89.5 + 38.3 n (measured 89.5, 127.5, 165.3, 203.1,
    241.8, 280.2, 319.3), window 8 to 355.6, barcode label 360.2-387.2, model label
    366.9-383.0, bottom cap from 388.5. The metal itself starts about 6.5 mm down: above
    that only the thumbscrew and lever reach, and they are drawn inside the 405 as the
    family convention asks. Across: windows 2.5-23.0, lamps at 14.6 with
    their legends to the right, the mark at 3.6-11.6. About 1.5 mm error along, 1 mm
    across.
  layout-rotation: >-
    the photograph is of a horizontal card; the legends PWR and ALM read upright when the
    card stands with the lamp end at the top, which is what fixes the mapping (photo top
    edge = card right edge). The ETSI LED close-up Figure 138 (p341) draws the same:
    lamp left, legend right, PWR above ALM. The hot-surface triangle then points to the
    right on the upright card, as the photograph shows it upright on the horizontal one.
  ports: >-
    datasheet for the count - UDS section 38.4: 16 GPON ports for SFP GPON optical
    modules. Composed as std/sfp@1 turned 90 (the SFP's 13.7 mm width along the card),
    two per window, both `on` the tilted face in the window and drawn foreshortened; their
    positions come from the tooth geometry (angled-panel). Numbered 1-16 from the top: ASSUMED, as no figure or photograph resolves a
    numeral at any cage (gap). Which way the cage latch faces is not resolved either.
  lamps: >-
    datasheet - Figure 184 / ETSI Figure 138 and Table 150. PWR: off = power off,
    blinking green = initialisation; no steady state is listed and none is drawn. ALM: red
    = alarm. PON lamp (one per port, "worked into the side of the optical socket", "on the
    left of the corresponding PON interface"): off, yellow, green, red. Placed at x 5.0
    level with each cage; no image resolves the light pipe itself (gap).
  labels: >-
    photo-measured - a white barcode label and a small model label reading FGLT-B above
    the bottom cap; drawn as placeholder blocks (no serial is transcribed). Beside the
    model label the photo shows the vendor mark; that is the logo-zone.
  relief: >-
    estimated - the two grey ejector levers stand proud; no document gives a figure, so
    the library's pooled release-hardware estimate (4.2, as nokia/fnio-a@1 carries) is
    used. The caps and windows are not raised; the sawtooth is carried as facets (angled-panel).
  colour: >-
    photo - light silver-grey plate, slightly darker end caps, grey plastic levers,
    knurled silver thumbscrews, a yellow hot-surface label, white labels.
  lifecycle: >-
    searched only the staged corpus - current in the Lightspan UDS A23 and ETSI UDS A18;
    no end-of-life notice was searched for on the web.
  angled-panel: >-
    estimated - ETSI UDS A18 p340 Figure 137, the side elevations (3.457 px/mm,
    isotropic). Line fits on eight teeth give the long edge, on which the two cages sit,
    at 30.7-30.9 degrees to the plate and the short edge at 55.9-56.1 degrees, on a
    38.15 mm pitch; the cages are drawn square to the long edge. DEPTH: the sawtooth
    stands BEHIND the plate. Figure 137 draws the plate 12.0 mm deep (41.5 px, front
    line to back line) and nothing proud of it; the tooth tips touch the back of the
    plate and the roots lie 16.4 mm further in. So the eight windows are one pocket,
    `well`, 43.0 to 366.65 and 28.38 deep, and every facet has `lift` -28.38: roots on
    the pocket floor, proud edges 12.0 below the plate front, where the bars between the
    windows stand in front of them. The angles are unchanged by the depth. Section,
    plate front at 0: bar front 0, tooth crest -12.0, tooth root and pocket floor
    -28.38. Modelled as eight teeth of 31 degrees (face-N, facing up, two cages and
    their PON lamps on it, the lamp in the side of the socket) and 56 degrees (return-N,
    facing down) on the 38.3 window pitch of the photograph: face 27.25 and return 11.05
    mm of front view. Each face ends at the bottom of its window and its return rises
    behind the bar below it to the crest, as Figure 137 draws; the bars are painted on
    the top 4 mm of each return. return-0 is the short edge Figure 137 draws at the top
    of the first window. A cage runs back square to its face, down and in; because 31 +
    56 is under 90 degrees it descends faster than the return below it and passes below
    the pocket floor before it reaches any wall (0.58 mm worst clearance), so none comes
    out through a wall or the back of a tooth. That is also why the last face needs its
    return: the pocket runs to 366.65, 11 mm past the bottom of window 8 (355.6) and
    over the top 6.5 mm of the barcode label (gap); ending it at the window would put
    the lower cage of face-8 through the pocket wall.
  thumbscrews: >-
    photo - owner's lab photos of an installed FX-8, 2026-09-24; flush-with-end per the owner.
    One family figure for every NT, NTIO and LT card and blank, because every screw goes into
    the fixed rails of the shelf: head 10.5 mm across, centred 18.7 mm from the left edge on
    this 25 mm plate, the top head touching the top end (y 0) and the bottom head the bottom
    end (y 394.5). Measured as ratios within one card on perspective phone photos, the
    plate-plane screw centre read from the recessed seat (concentric with the shank) rather
    than the projecting head: 30 mm NT (FANT-H top 0.640, bottom 0.651; FANT-F top 0.64-0.67,
    bottom about 0.64) -> 19.4 (ratio 0.647); 25 mm NTIO blank 3FE65651BA (top 0.733, bottom
    0.754) -> 18.7 (ratio 0.748). Head diameter against plate width: the back edge of the
    knurl 0.36 of the FANT-H plate and 0.42 of the NTIO plate at the bottom, the front faces
    0.39-0.48 (magnified by their projection), so an upper bound of 10.6-10.8 mm; 10.5 taken
    (0.35 of 30, 0.42 of 25), inside the 10-11.5 mm the Nokia flat FANT-H view draws. The
    screw sits on the side AWAY from the grey ejector lever (lever at the left edge, screw
    right of centre) at both ends. Same centre at both ends: the photos differ by under 1 mm,
    within the reading error. This replaces the per-figure screw positions and sizes read off
    the oblique guide drawings, which had drifted 17.2-21.0 across and 6.4-10.0 in size.
