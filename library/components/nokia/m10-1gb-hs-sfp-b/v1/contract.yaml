format: 1
kind: module
name: m10-1gb-hs-sfp-b
version: 1.0.0
unplaced: >-
  seated by the classic MDA bays (mda-1, mda-2) of nokia/iom3-xp@1 (HS-MDA2 guide 93-0369-02-01
  p9: "in IOM3-XP, IOM3-XP-B and IOM3-XP-C"); the coordinator wires it into the IOM3-XP's accepts
  list, which is not edited in this change. Delete this key when the first bay names this part.
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia (Alcatel-Lucent) 7750 SR / 7450 ESS 10-port GE SFP HS-MDA2, M10-1GB-HS-SFP-B (3HE06432AA),
  the second-generation High Scale MDA ("HS-MDAv2" in the chassis guides): the same face as the
  first-generation nokia/m10-1gb-hs-sfp@1 - ten SFP cages in two rows of five at the right (1-5
  across the top, 6-10 across the bottom), a printed Lnk/Act grid with one lamp pair per port
  left of them, the Stat and Pwr lamps at the far left, the model legend with its "-B" at the
  lower left and a cross-slotted captive screw on each lower end wing. Takes Gigabit Ethernet
  SFPs, not copper ones. Authored horizontal; an SR-12 IOM3-XP seats it on end with the carrier.
size: {w: 190.5, h: 35.4, d: 177.8}
size-confidence: {w: datasheet, h: drawing, d: datasheet}
size-notes: >-
  The chassis guides give MDAs 1.4 x 7.5 x 7.0 in (3.56 x 19.05 x 17.78 cm, SR7 p106 Table 47).
  Held at 190.5 x 35.4 so it seats in the IOM3-XP's MDA bays on the 35.4 slot pitch; Figure 4 is
  fitted per axis to that face.
