  model: M10-1GB-HS-SFP-B
  part-number: 3HE06432AA
  cli-type: m10-1gb-hs-sfp-b
  sfp: 10
  power-draw-max-w: 48
  power-draw-typical-w: 46
provenance:
  sources: >-
    datasheet - 7750 SR and 7450 ESS HS-MDA2 Installation Guide 93-0369-02-01 (MDA2): p28 Figure 4
    and p28-29 Table 5 (the face, its lamps, ports and screws), p17 Table 3 (power) and Table 4
    (optics power), p9 (the carriers). 7750 High Scale HS-MDA2 Installation Guide 93-0369-01-01
    (MDA2L): p26 Figure 4 and p26-27 Table 4 (the same face), p16 Table 2 (power), p9 (carriers).
    SR7 15.1 3HE14151AAAATQZZA02 p98 Table 32 (part number and power). SR-12e 13.0
    3HE09919AAACTQZZA01 p61 Table 23 (the CLI string). SR7 22.7 3HE18643AAAATQZZA03 p106 Table 47
    (MDA size).
  size: 'datasheet - SR7 p106 Table 47; see size-notes'
  face: >-
    drawing - ONE FACE WITH nokia/m10-1gb-hs-sfp@1. MDA2 p28 Figure 4, MDA2L p26 Figure 4 and the
    first-generation HS MDA guide 93-0235-02-03 p28 Figure 5 are one artwork (MDA0060): rendered at
    1200 dpi, each measures 4618 px between the plate's side lines and 847 px from the top line to
    the bottom of the band, and every cage, lamp and legend line lands on the same pixel once the
    page offset is taken out. The one difference is the legend, where the two HS-MDA2 figures add
    "-B" in a lighter face after the bold M10-1GB-HS-SFP. Kept a separate component rather than a
    model-label field on the first-generation part because the product is not the same: another
    carrier list (the HS MDA guide p9 names IOM-20G and IOM2; MDA2 p9 names IOM3-XP, -B and -C),
    another power figure (60 W against 48), another part number and another CLI string.
  layout: >-
    drawing - MDA2 p28 Figure 4 (art MDA0060), vector, rendered at 1200 dpi, fitted per axis: 24.24
    px/mm across (4618 px to 190.5) and 23.93 px/mm down (847 px to 35.4), 1.3 percent apart. Every
    position is nokia/m10-1gb-hs-sfp@1's, which states them (provenance.layout there): the
    MDA00xx notched outline, cages 15.82 x 10.99 on the irregular columns x 94.96, 111.49, 129.92,
    148.38, 164.91 in rows centred y 8.38 and 22.36, Stat and Pwr at x 11.28, the Lnk/Act grid
    x 19.37-43.85 with lamps on a 5.10 pitch, screws at (7.6, 22.9) and (183.05, 22.9) over tabs
    1.55 deep left and 3.1 right. Model legend (key 5) x 18.73-42.45, baseline 32.2.
  bracket: >-
    drawing - the bracket right of the grid carries a stub to the leader of callout 3 and is part
    of that callout, not printing on the face; it is not drawn.
  legend: >-
    drawing - read at 1200 dpi in both HS-MDA2 figures: the legend prints M10-1GB-HS-SFP in bold
    followed by -B in a regular weight, and the text layer of MDA2L p26 carries
    "M10-1GB-HS-SFP-B". Both tables' key 5 (MDA2 p29, MDA2L p27) still say M10-1GB-HS-SFP, the
    first-generation text carried over; the figure is followed.
  cages: >-
    drawing + standard - separate cages on an irregular pitch, so each port is std/sfp@1 (SFF-8432
    aperture 14.5 x 10.0) centred on its drawn box. ORIENTATION IS NOT READ: the figure draws empty
    boxes, and no photograph of this card is held, so the rows take the library's belly-to-belly
    default, upper 0 over lower 180 (L108).
  lamps: >-
    datasheet - MDA2 p28-29 Table 5 (MDA2L p26-27 Table 4 is word for word the same): Status green
    blinking initializing, green up, amber operationally down, off administratively down; Power
    blue on, off no power; Port LEDs - Link green link established at 1000 Mb/s, amber slow
    blinking no SFP installed, amber fast blinking loopback, amber optics installed and no link,
    unlit disabled; Active green active, amber error, unlit no activity. No blink rates are given,
    so slow and fast are both `blinking`. Every lamp is common/led-indicator@1 at its drawn centre.
  power: >-
    datasheet - MDA2 p17 Table 3: M10-1GB-HS-SFP-B 28 idle, 43 zero rate, 46 typical, 48 worst
    case; MDA2L p16 Table 2 gives the same four figures as idle, 0, 50 and 100 percent traffic; SR7
    15.1 p98 Table 32 gives 3HE06432AA the same. SFP optics 1 W each (MDA2 p17 Table 4), not
    included. The SR-12e 13.0 guide p61 Table 23 gives m10-1gb-hs-sfp-b an unqualified 60 W (see
    gaps).
  part-number: >-
    datasheet - SR7 15.1 p98 Table 32: 3HE06432AA "7750 SR 10-port GE SFP HS-MDAv2". The row names
    no model; it is this card by its description and by its four power figures, which are MDA2
    p17 Table 3's for M10-1GB-HS-SFP-B.
  cli-type: >-
    datasheet - SR-12e 13.0 p61 Table 23 prints m10-1gb-hs-sfp-b for 10-port GE SFP High Scale
    "-B". Both HS-MDA2 guides' own provisioning examples (MDA2 p18-19, MDA2L p17-18) print
    m10-1gb-hs-sfp, the first-generation string, carried over with the rest of that example.
  colour: >-
    estimated - no photograph of an HS-MDA2 is held. Drawn in the charcoal of the SR-7/SR-12 card
    family, printing in the family's white. A gap.
  logo-zone: 'reserved on the plain plate between the grid and the cages; Figure 4 draws no mark'
  depth: 'datasheet - 7.0 in (17.78 cm), SR7 p106 Table 47'
  lifecycle: >-
    searched only the staged corpus; the chassis guides from 14.0 to 25.10 carry 3HE06432AA's power
    row, though the SR-7 22.7 edition (3HE18643AAAATQZZA03) lists only its XFP sibling. No
    end-of-sale notice searched.
  gaps: >-
    Colour is estimated. The cage orientation is the library default, not a reading. Power: the
    SR-12e 13.0 guide p61 prints 60 W for this card, unqualified, against 48 W worst case in the
    card's own guide and every later chassis guide; 48 is carried.
