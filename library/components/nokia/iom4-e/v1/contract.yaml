format: 1
kind: module
name: iom4-e
version: 1.0.1
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia 7750 SR / 7450 ESS IOM4-e and IOM4-e-B (3HE09648AA/BA/CA, 3HE10717AA/BA/CA - one face,
  two models, three licences each), the FP3 200 Gb/s input/output module for the SR-7 and SR-12
  card slots. A full-length carrier holding two MDA-e slots, slot 1 at the left: a captive
  screw and an ejector lever at each end, and between the two MDA plates, in their notched
  lower corners, a small tab carrying the printed model label (IOM4-e or IOM4-e-B, a field)
  and the Stat lamp. Stat: purple on but not yet through diagnostics, green blinking
  diagnostics passed, green booted. Authored horizontal, as the guide draws it; the SR-12's
  vertical slots seat it at rotate 90, which puts MDA slot 1 at the top. Takes MDA-e cards and
  the MS-ISA2 / MS-ISA2-E; the IOM4-e-HS, which does not take the MS-ISA2, is nokia/iom4-e-hs.
size: {w: 425.4, h: 35.4, d: 431.8}
size-confidence: {w: drawing, h: drawing, d: datasheet}
size-notes: >-
  IOM4-e guide p15 Table 6 gives 1.4 x 16.75 x 17 in (35.56 x 425.45 x 431.8). The face is
  held at 425.4 x 35.4 so the SR-7/SR-12 slots tile on the family's 35.4 pitch; Figure 10
  measures 425.45 x 35.4 exactly.
