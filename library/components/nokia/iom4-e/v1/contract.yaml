provenance:
  sources: >-
    datasheet - 7450 ESS / 7750 SR IOM4-e Installation Guide 20.2, 3HE16328AAAATQZZA01 (IOM4E):
    p12-14 Tables 2-4 (models, variants, supported MDA-e), p15 Table 5 (power), p15 Table 6
    (size, weight), p33-34 Figure 10 / Table 9 (IOM4-e face), p35 Figure 11 / Table 10 (IOM4-e-B,
    the same art). Chassis guides SR12 3HE18644AAAATQZZA03 p66 and SR7 3HE18643AAAATQZZA03.
  size: >-
    datasheet - IOM4E p15 Table 6: H x W x D 1.4 x 16.75 x 17 in (3.6 x 42.5 x 43.2 cm), all
    variants; the chassis guides agree (SR12 p103 Table 43, SR7 p106 Table 47). Held at 425.4 x
    35.4 (the SR-7/SR-12 slot unit U = 35.4); Figure 10 at 1200 dpi is 7121 x 593 px, aspect
    12.01, which is 425.45 x 35.4.
  layout: >-
    drawing - IOM4E p33 Figure 10 (art 25208), vector (pdfimages finds no raster), rendered at
    1200 dpi: 16.74 px/mm, plate left at column 74, plate top at row 201 (the thin strip the
    figure draws above it is the card's top edge in perspective, not face). MDA windows: the
    end walls at x 18.4-19.6 and 405.8-407.0 and a 1.4 divider on the centre line at 212.7, so
    the bays are mda-1 19.0-212.0 and mda-2 213.4-406.4 at the MDA envelope 193.0 x 35.4.
    Captive screws centred (7.4, 22.8) and (418.0, 22.8), heads 8.4 inside a 10.8 boss (key 1).
    Ejector levers along the bottom edge (key 6): bars x 6.2-67.7 and 357.7-419.2 at y
    29.8-33.6, pivot near x 16.4, with the lever tip under it to x 32.3. The tab (keys 3/4):
    x 195.4-230.0 from y 26.5 to the bottom edge, a printed box 199.9-225.2 x 28.3-34.0,
    'IOM4-e' from x 202.1, the Stat lamp centred (219.5, 31.2) drawn 2.4 across, 'Stat' from
    221.1. An earlier reading put the lamp at (219.6, 29.8); the figure puts its centre
    at row 723, 31.2 below the plate top, and the figure is used.
  bays: >-
    drawing - the skin draws the MDA windows as rects mda-1 and mda-2 BEFORE the levers and the
    tab, because render.py inserts a nested occupant at its opening's place in the draw order;
    the levers cross the MDA band from x 35.2 to 67.7 (and 357.7-390.2) and the tab sits in the
    notched lower corners of the two MDA-e plates, so both must paint over the seated cards.
  nested-default: >-
    inferred - Figure 10 draws both MDA slots with impedance panels (Table 9 keys 2/5: "An
    impedance panel is shown in the slot") but gives no part number; nokia/sr-e-mda-impedance-panel
    (3HE10312AA) is the library's one MDA-e-envelope blank and the drawn panel matches it
    (notched lower corners, a captive screw on each wing). Its use in an IOM4-e is inferred.
  accepts: >-
    datasheet - IOM4E p14 Table 4, "supported in all IOM4-e models and variants, unless noted
    otherwise": the ten MDA-e / MS-ISA2 part numbers. 3HE14888AA (8-port 10/25GE SFP+/28 MDA-e)
    is listed but not modelled (it has no genuine faceplate drawing). MDA-e-XP and
    classic MDAs do not seat (SR12 p67 Table 11).
  variants: >-
    datasheet - IOM4E p12-13 Table 3: IOM4-e L3HQ / L3BQ / L2HQ (3HE09648AA/BA/CA) and IOM4-e-B
    L3HQ / L3BQ / L2HQ (3HE10717AA/BA/CA). Table 2: the models differ in policer scale only; p33
    and p35 draw one face, the label reading IOM4-e or IOM4-e-B, so one component with the label
    as a field. CLI card-type iom4-e / iom4-e-b (p33-35).
  power: >-
    datasheet - IOM4E p15 Table 5: idle 122, zero rate 300, typical (50 percent, 25C) 340, worst
    case (100 percent, 55C) 390 W, the same for IOM4-e and IOM4-e-B; MDAs not included. The
    chassis guides print the zero-rate figure as 390 (a typo; the IOM guide's 300 is used).
  weight: 'datasheet - 11.20 lb (5.08 kg), IOM4E p15 Table 6'
  lamps: >-
    datasheet - IOM4E p34 Table 9 key 4 (and p35 Table 10): Stat purple = on, not yet through
    diagnostics; green blinking = boot diagnostics passed; green solid = booted. No unlit state is
    listed; unlit is kept for no power. Purple #8e44ad is the library's estimate of the hue. The
    lab photo (2026-09-24) shows the lamp lit green.
  colour: >-
    photo - lab photos of an installed IOM4-e with an ME1-100GB-CFP2 in an SR-12
    (2026-09-24): a
    charcoal plate, the tab a shade lighter as a separate moulding, white legends, black
    perforated ejector levers and black plastic captive-screw knobs with a cross slot. Phone
    shots under warm light, so hue relationships only.
  logo-zone: 'none reserved - the figure and the photo show no mark on the carrier; its only visible print is the tab label'
  orientation: >-
    datasheet - IOM4E p34 Table 9 key 2 "The left slot is designated as slot 1". SR12 p46:
    "Module slots are vertically oriented ... MDA slot 1 (top slot)", so the SR-12 seats this
    horizontal face at rotate 90; the lab photo reads the tab legend top-to-bottom, as that
    rotation makes it.
  relief: >-
    borrowed - screws and levers take the IOM-e's figures (nokia/iom-e@1: cyl 1.6 knurled; lever
    out 4.2), themselves borrowed from nokia/nelt-b@1. NOT MEASURED. The tab carries no `out`:
    an `out` node is moved to the end of its instance and would paint over the Stat lamp.
  lifecycle: 'searched only the staged corpus - listed in the IOM4-e guide 20.2 and the 22.7 chassis guides; no end-of-sale notice searched'
  gaps: >-
    The tab is a separate raised moulding in the photo; its height is not stated and it is
    drawn flat. Lever and screw relief are borrowed, not measured. Purple is an estimated hue.
