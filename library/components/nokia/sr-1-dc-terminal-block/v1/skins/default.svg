<svg xmlns="http://www.w3.org/2000/svg" width="75.5mm" height="84.6mm" viewBox="0 0 75.5 84.6">
  <!-- 7750 SR-1 -48 VDC terminal block, as SR1 Figure 5 (p48, vector) draws it on the DC rear, origin at rear-face (12.5, 1.0). Stud pitch 0.625 in. from Figure 48; the studs are composed parts, two per pole (nokia/sr-1-dc-pole@1). -->
  <rect id="recess" x="0" y="0" width="75.5" height="84.6" fill="#2a2d31" stroke="#17191c" stroke-width="0.3"/>
  <rect id="legend-strip" x="3.0" y="70.1" width="68.9" height="13.7" fill="#d9dcdf" stroke="#17191c" stroke-width="0.3"/>
  <line x1="37.7" y1="70.1" x2="37.7" y2="83.8" stroke="#17191c" stroke-width="0.3"/>
  <rect id="block-body" x="1.8" y="19.2" width="70.9" height="50.4" rx="1.0" fill="#1c1e21"/>
  <g id="feed-a-neg">
    <rect x="4.6" y="21.9" width="14.0" height="47.2" rx="0.6" fill="#4a4f55" stroke="#101214" stroke-width="0.35"/>
    <path d="M 6.1 69.1 V 60.9 A 5.5 5.5 0 0 1 17.1 60.9 V 69.1 Z" fill="#101214"/>
  </g>
  <g id="feed-a-rtn">
    <rect x="21.7" y="21.9" width="14.0" height="47.2" rx="0.6" fill="#4a4f55" stroke="#101214" stroke-width="0.35"/>
    <path d="M 23.2 69.1 V 60.9 A 5.5 5.5 0 0 1 34.2 60.9 V 69.1 Z" fill="#101214"/>
  </g>
  <g id="feed-b-neg">
    <rect x="38.9" y="21.9" width="14.0" height="47.2" rx="0.6" fill="#4a4f55" stroke="#101214" stroke-width="0.35"/>
    <path d="M 40.4 69.1 V 60.9 A 5.5 5.5 0 0 1 51.4 60.9 V 69.1 Z" fill="#101214"/>
  </g>
  <g id="feed-b-rtn">
    <rect x="55.8" y="21.9" width="14.0" height="47.2" rx="0.6" fill="#4a4f55" stroke="#101214" stroke-width="0.35"/>
    <path d="M 57.3 69.1 V 60.9 A 5.5 5.5 0 0 1 68.3 60.9 V 69.1 Z" fill="#101214"/>
  </g>
  <path id="cover" d="M 0.3 22.0 V 12.0 A 6.0 6.0 0 0 1 6.3 6.1 H 13.2 A 6.0 6.0 0 0 1 19.2 12.0 V 18.0 H 55.8 V 12.0 A 6.0 6.0 0 0 1 61.8 6.1 H 67.9 A 6.0 6.0 0 0 1 73.9 12.0 V 70.1 H 0.3 Z" fill="#b9bec4" fill-opacity="0.35" stroke="#17191c" stroke-width="0.45"/>
  <g><circle cx="9.6" cy="12.7" r="3.4" fill="#8a9097" stroke="#17191c" stroke-width="0.3"/><path d="M 7.7 12.7 H 11.5 M 9.6 10.8 V 14.6" stroke="#17191c" stroke-width="0.5"/></g>
  <g><circle cx="64.4" cy="12.7" r="3.4" fill="#8a9097" stroke="#17191c" stroke-width="0.3"/><path d="M 62.5 12.7 H 66.3 M 64.4 10.8 V 14.6" stroke="#17191c" stroke-width="0.5"/></g>
  <g id="power-switch">
    <rect x="25.6" y="1.1" width="23.9" height="16.9" rx="2.0" fill="#2a2d31" stroke="#101214" stroke-width="0.4"/>
    <rect x="27.0" y="2.5" width="21.1" height="14.1" rx="1.4" fill="#3a3e43" stroke="#101214" stroke-width="0.3"/>
    <rect x="29.6" y="4.8" width="15.4" height="10.5" rx="1.0" fill="#17191c" stroke="#6f757c" stroke-width="0.3"/>
    <rect x="31.2" y="6.0" width="12.2" height="8.1" rx="0.6" fill="#26292d"/>
    <!-- the LED rides on the rocker: inside the raised guard, so raising the guard
         (the block composes parts now) carries the LED with it instead of burying it -->
    <rect id="switch-led" x="41.5" y="8.4" width="1.8" height="3.7" rx="0.4" fill="var(--led-color, #3a3f44)" stroke="#101214" stroke-width="0.2"/>
  </g>
  <g id="silkscreen">
    <path d="M 20.0 4.4 A 2.0 2.0 0 1 0 22.6 4.4 M 21.3 3.2 V 5.8" fill="none" stroke="#e6e8ea" stroke-width="0.4"/>
    <path d="M 53.3 3.6 V 7.8" fill="none" stroke="#e6e8ea" stroke-width="0.45"/>
    <text x="10.5" y="75.4" font-family="Arial" font-size="4.0" text-anchor="middle" fill="#17191c">-48V</text>
    <text x="28.9" y="75.4" font-family="Arial" font-size="4.0" text-anchor="middle" fill="#17191c">RTN</text>
    <text x="45.2" y="75.4" font-family="Arial" font-size="4.0" text-anchor="middle" fill="#17191c">-48V</text>
    <text x="63.5" y="75.4" font-family="Arial" font-size="4.0" text-anchor="middle" fill="#17191c">RTN</text>
    <text x="20.3" y="82.4" font-family="Arial" font-size="6.0" text-anchor="middle" fill="#17191c">A</text>
    <text x="54.4" y="82.4" font-family="Arial" font-size="6.0" text-anchor="middle" fill="#17191c">B</text>
  </g>
</svg>
