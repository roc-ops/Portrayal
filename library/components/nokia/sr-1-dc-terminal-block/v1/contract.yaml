format: 1
kind: component
name: sr-1-dc-terminal-block
version: 1.0.0
class: inlet
behaviour: mounts
profile: networking
description: >-
  The factory-installed -48 VDC input terminal block of the 7750 SR-1 (FP4) DC chassis:
  fixed and not field-replaceable, it fills the area the AC chassis gives to its two PSU
  slots. Dual feed, A and B, each a -48V and an RTN terminal with two 10-32 studs for a
  two-hole 45-degree lug, under a clear plastic safety cover held by two retaining screws.
  Above the cover sits the power On/Standby rocker switch with its green LED, inside an
  actuator guard. The printed strip below reads -48V, RTN, -48V, RTN over A and B.
size: {w: 75.5, h: 84.6}
size-confidence: {w: drawing, h: drawing}
attrs:
  model: 7750 SR-1 -48 VDC terminal block
  input: dc
  feeds: 2
provenance:
  sources: >-
    datasheet - 7750 SR-1 Chassis Installation Guide 25.10, 3HE22130AAAATQZZA01 (SR1):
    Figure 5 p48 (DC rear view, VECTOR), Figure 23 p73 (the block, named callouts), Figure
    47 and Table 58 p152-153 (its components), Figure 48 p153 (dimensions), section 3.4.1.2
    p72. No photograph is staged.
  size: >-
    drawing - measured on SR1 Figure 5 p48, DC rear, at 1200 dpi and the chassis scale
    (13.04 px/mm across, 12.88 down; the figure passes Gate 1 on the 440 x 88.9 body).
    The block occupies the recess from x 12.5 to 88.0 and y 1.0 to 85.6 of the rear face,
    the area the AC chassis uses for its two PSU slots (x 13.6 to 87.3). No document states
    the block's outline; Figure 48 dimensions only its studs and barriers.
  depth: >-
    omitted on purpose: a fixed, behaviour-less part with size.d becomes a pit in 3D. The
    block's depth is not stated anyway.
  layout: >-
    drawing - SR1 Figure 5 p48, read on a 1 mm grid, positions relative to the block's
    origin at rear-face (12.5, 1.0). Safety cover 0.3-73.9 across, 18.0-70.1 down, with a
    lobe at each top corner up to 6.1 carrying a retaining screw at (9.6, 12.7) and (64.4,
    12.7); actuator guard 25.6-49.5 x 1.1-18.0 with the rocker 29.6-45.0 x 4.8-15.3 and its
    LED window 41.5-43.3 x 8.4-12.1 on the "I" side; the standby symbol at (21.3, 5.7) and
    "I" at (53.3, 5.7); four barrier columns 14.0 wide at centres 11.6 / 28.7 / 45.9 / 62.8;
    studs at y 31.4 and 47.3; cable entries (open U shapes) 55.4-69.1; printed strip
    3.0-71.9 x 70.1-83.8, the A/B divider at 37.7.
  studs: >-
    datasheet - SR1 Figure 48 p153: stud spacing on centre 0.625 in (15.86 mm), which is the
    vertical pitch drawn here (Figure 5 measures 15.7); barrier interior width 0.60 in (15.24)
    against 14.0 drawn; interior height 1.775 in (45.09). Table 58: 10-32 studs; "Eight
    terminal block nuts, one for each terminal block stud" (p72).
  switch: >-
    datasheet - SR1 p72: "The power switch ... has a green LED which is lit when the chassis
    is powered ON. The switch is surrounded by an actuator guard". Figure 23 labels it "Power
    ON/OFF Switch with LED"; SR1 Table 6 p49 key 6 calls it the "DC chassis power
    On/Standby switch". The LED is drawn as the small window on the rocker's "I" half.
  cover: >-
    datasheet - SR1 p72: "equipped with a clear plastic safety cover that can be removed ...
    by loosening the retaining screws". Drawn translucent grey, as Figure 5 tints it. The
    cover is deliberately NOT raised in 3D: it is clear, and a raised node would bury the
    studs and barriers under an opaque slab.
  legend: 'drawing - "-48V RTN -48V RTN" over "A" and "B", Figure 5 and Figure 23, as printed'
  power: >-
    datasheet - SR1 Table 31 p90: -48 VDC, 40/30 A per source; operating range -40 to -72
    VDC. The block is a passive input and draws nothing itself; SR1 p50 says the DC
    chassis's CPM/IOM "also includes a power supply card", which is internal.
  colour: 'estimated - no photograph; the cover grey is the figure''s tint'
