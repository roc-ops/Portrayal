relief:
  wall: '#9ea3a9'
  features:
    - node: ejector-top
      out: 4.2
      confidence: estimated
      source: >-
        cisco/a99-rp3-tr@1 ejector levers - the library's shared release-hardware
        figure, itself estimated; nothing in the Nokia corpus gives a proudness
    - node: ejector-bottom
      out: 4.2
      confidence: estimated
      source: >-
        cisco/a99-rp3-tr@1 ejector levers - the library's shared release-hardware
        figure, itself estimated; nothing in the Nokia corpus gives a proudness
    - node: screw
      cyl: 1.6
      confidence: estimated
      source: >-
        cisco/a99-rp3-tr@1 captive screw heads - the library's shared screw-head
        figure, itself estimated
    - node: pps-face
      facet: {deg: 39, facing: up}
