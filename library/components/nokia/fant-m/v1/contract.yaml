groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      PORT1 and PORT2, QSFP28/QSFP+ uplinks - 100GE, 40GE, 4x25GE, 4x10GE, 10GE by
      adapter; SyncE/PTP on all of them (Table 67)
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: PORT3, SFP+ 10GE data and SyncE/PTP (Table 67)
  base-t:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the ETH 10/100/1000Base-T port, which Nokia lists as a communication interface
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the clock block - 1 PPS and 10 MHz GPS SMA inputs, the ToD/1 PPS RJ-45 and
      PORT4, an SFP+ Nokia gives no traffic support and SyncE/PTP at 10GE and 1GE
  craft:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      local access to the card - the LCRT craft (LCMI) RJ-45 and the micro-USB debug port
  leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system status lamps of Figure 73 and Table 68
