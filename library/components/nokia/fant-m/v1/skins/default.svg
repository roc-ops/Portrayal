<svg xmlns="http://www.w3.org/2000/svg" width="30mm" height="405mm" viewBox="0 0 30 405">
  <!-- Nokia FANT-M (ANSI BA/BB), upright. Positions: contract provenance.positions. -->
  <rect id="face" x="0" y="0" width="30" height="405" rx="0.4" fill="#c8cbcf" stroke="#8d9297" stroke-width="0.3"/>
  <rect id="logo-zone" x="11.0" y="3.0" width="16.0" height="18.0" fill="none"/>
  <!-- the connector housing: one box per connector, each face turned about 30 degrees upward (provenance.angled-panel).
       Painted, not tilted: a darker band, a bevel down each side, a lit top edge and a shaded underside per box -->
  <g id="housing">
    <rect x="2.0" y="66.0" width="21.0" height="174.6" rx="0.4" fill="#a3a8ae" stroke="#5f646a" stroke-width="0.3"/>
    <g fill="#8a8f95">
      <rect x="2.0" y="66.0" width="0.9" height="174.6"/>
      <rect x="22.1" y="66.0" width="0.9" height="174.6"/>
    </g>
    <g fill="#7b8086">
      <rect x="2.0" y="81.0" width="21.0" height="2.5"/>
      <rect x="2.0" y="106.4" width="21.0" height="2.5"/>
      <rect x="2.0" y="143.25" width="21.0" height="2.5"/>
      <rect x="2.0" y="176.6" width="21.0" height="2.5"/>
      <rect x="2.0" y="202.75" width="21.0" height="2.5"/>
      <rect x="2.0" y="238.1" width="21.0" height="2.5"/>
    </g>
    <g stroke="#d9dcdf" stroke-width="0.35">
      <line x1="2.9" y1="66.3" x2="22.1" y2="66.3"/>
      <line x1="2.9" y1="83.8" x2="22.1" y2="83.8"/>
      <line x1="2.9" y1="109.2" x2="22.1" y2="109.2"/>
      <line x1="2.9" y1="146.05" x2="22.1" y2="146.05"/>
      <line x1="2.9" y1="179.4" x2="22.1" y2="179.4"/>
      <line x1="2.9" y1="205.55" x2="22.1" y2="205.55"/>
    </g>
    <g stroke="#4f545a" stroke-width="0.25">
      <line x1="2.0" y1="83.5" x2="23.0" y2="83.5"/>
      <line x1="2.0" y1="108.9" x2="23.0" y2="108.9"/>
      <line x1="2.0" y1="145.75" x2="23.0" y2="145.75"/>
      <line x1="2.0" y1="179.1" x2="23.0" y2="179.1"/>
      <line x1="2.0" y1="205.25" x2="23.0" y2="205.25"/>
    </g>
  </g>
  <!-- frames round the lower RJ45s: ETH alone, LCRT and ToD/PPS in one -->
  <g id="jack-frames" fill="none" stroke="#6f747a" stroke-width="0.3">
    <rect x="6.4" y="298.4" width="14.2" height="16.8" rx="0.3"/>
    <rect x="6.4" y="317.6" width="14.2" height="33.6" rx="0.3"/>
  </g>
  <g id="ejector-top">
    <path d="M 1.2 0.5 L 5.6 0.5 L 5.6 12.0 L 7.9 12.6 L 8.2 29.6 Q 8.2 31.0 6.8 31.0 L 2.6 31.0 Q 1.2 31.0 1.2 29.6 Z" fill="#2e3136" stroke="#1c1f23" stroke-width="0.25"/>
    <path d="M 3.4 13.5 L 3.4 29.5" stroke="#4a4e54" stroke-width="0.4" fill="none"/>
  </g>
  <g id="ejector-bottom">
    <path d="M 1.4 318.0 L 5.4 318.0 Q 6.4 318.0 6.4 319.0 L 6.4 404.0 L 0.8 404.0 L 0.8 319.0 Q 0.8 318.0 1.4 318.0 Z" fill="#2e3136" stroke="#1c1f23" stroke-width="0.25"/>
    <path d="M 3.4 320.0 L 3.4 394.0" stroke="#4a4e54" stroke-width="0.4" fill="none"/>
  </g>
  <g id="screw">
    <circle cx="21.0" cy="398.5" r="4.0" fill="#8f959b" stroke="#5d6268" stroke-width="0.25"/>
    <circle cx="21.0" cy="398.5" r="2.6" fill="#a9aeb4" stroke="#5d6268" stroke-width="0.2"/>
    <path d="M 19.6 398.5 L 22.4 398.5 M 21.0 397.1 L 21.0 399.9" stroke="#3a3e43" stroke-width="0.4"/>
  </g>
  <g id="silkscreen" font-family="Arial, Helvetica, sans-serif" fill="#1c1f23">
    <text x="11.0" y="25.7" font-size="2.0">FANT-M</text>
    <!-- lamp legends, Figure 73 -->
    <g font-size="1.3">
      <text x="7.2" y="33.95" text-anchor="end">ALM</text>
      <text x="15.8" y="33.95">PWR</text>
      <text x="15.8" y="38.95">A/S</text>
      <text x="7.2" y="43.95" text-anchor="end">2</text>
      <text x="15.8" y="43.95">1</text>
      <text x="7.2" y="48.95" text-anchor="end">4</text>
      <text x="15.8" y="48.95">3</text>
      <text x="7.2" y="53.95" text-anchor="end">2</text>
      <text x="15.8" y="53.95">1</text>
      <text x="7.2" y="58.95" text-anchor="end">4</text>
      <text x="15.8" y="58.95">3</text>
      <text x="7.2" y="63.95" text-anchor="end">PORT4</text>
      <text x="15.8" y="63.95">PORT3</text>
      <text x="18.4" y="46.45" font-size="1.1">PORT1</text>
      <text x="18.4" y="56.45" font-size="1.1">PORT2</text>
    </g>
    <g fill="none" stroke="#1c1f23" stroke-width="0.18">
      <path d="M 5.6 42.4 L 5.0 42.4 L 5.0 49.6 L 5.6 49.6"/>
      <path d="M 17.1 42.4 L 17.7 42.4 L 17.7 49.6 L 17.1 49.6"/>
      <path d="M 5.6 52.4 L 5.0 52.4 L 5.0 59.6 L 5.6 59.6"/>
      <path d="M 17.1 52.4 L 17.7 52.4 L 17.7 59.6 L 17.1 59.6"/>
    </g>
    <!-- connector legends, reading down the card as Figure 72 prints them -->
    <g font-size="1.5" text-anchor="middle">
      <text x="26.0" y="72.5" transform="rotate(90 26.0 72.0)">1PPS</text>
      <text x="26.0" y="95.5" transform="rotate(90 26.0 95.0)">10MHz</text>
      <text x="26.0" y="128.5" transform="rotate(90 26.0 128.0)">PORT1</text>
      <text x="26.0" y="164.0" transform="rotate(90 26.0 163.5)">PORT2</text>
      <text x="26.0" y="192.5" transform="rotate(90 26.0 192.0)">PORT3</text>
      <text x="26.0" y="219.0" transform="rotate(90 26.0 218.5)">PORT4</text>
      <text x="12.3" y="256.5" transform="rotate(90 12.3 256.0)">USB</text>
      <text x="23.5" y="307.3" transform="rotate(90 23.5 306.8)">ETH</text>
      <text x="23.5" y="326.5" transform="rotate(90 23.5 326.0)">LCRT</text>
      <text x="23.5" y="343.3" transform="rotate(90 23.5 342.8)">ToD/PPS</text>
    </g>
    <!-- laser warning label (yellow, applied) -->
    <g id="laser-label">
      <path d="M 12.5 243.1 L 15.0 247.4 L 10.0 247.4 Z" fill="#f2c230" stroke="#1c1f23" stroke-width="0.2"/>
      <circle cx="12.5" cy="246.0" r="0.5" fill="#1c1f23"/>
    </g>
    <!-- two small hazard/ground icons beside the lower lever, and the ESD triangle -->
    <g fill="none" stroke="#1c1f23" stroke-width="0.2">
      <rect x="10.6" y="378.6" width="2.8" height="2.8"/>
      <rect x="10.6" y="386.6" width="2.8" height="2.8"/>
      <path d="M 20.5 384.9 L 23.2 389.6 L 17.8 389.6 Z"/>
    </g>
  </g>
</svg>
