groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      PORT1 and PORT2, QSFP28/QSFP+ uplinks - 100GE, 40GE, 4x25GE, 4x10GE, 10GE by
      adapter; SyncE/PTP on all of them (Table 67)
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: PORT3, SFP+ 10GE data and SyncE/PTP (Table 67)
  base-t:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the ETH 10/100/1000Base-T port, which Nokia lists as a communication interface
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the clock block - 1 PPS and 10 MHz GPS SMA inputs, the BITS input and output
      RJ-45s, the ToD/1 PPS RJ-45 and PORT4, an SFP+ Nokia gives no traffic support and
      SyncE/PTP at 10GE and 1GE
  craft:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      local access to the card - the LCRT craft (LCMI) RJ-45, the micro-USB debug port
      and the alarm cut-off switch
  leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system status lamps of Figure 91 and Table 87
parts:
  - {ref: common/sma-jack@1, id: pps, group: timing, at: [7.75, 68.309], 'on': pps-face, attrs: {function: 1 PPS input, legend: 1PPS}}
  - {ref: common/sma-jack@1, id: ten-mhz, group: timing, at: [7.75, 91.309], 'on': ten-mhz-face, attrs: {function: 10 MHz GPS input, legend: 10MHz}}
  - {ref: std/qsfp28@1, id: port1, group: qsfp28, at: [2.5, 123.364], 'on': port1-face, rotate: 90, attrs: {legend: PORT1}}
  - {ref: std/qsfp28@1, id: port2, group: qsfp28, at: [2.5, 158.828], 'on': port2-face, rotate: 90, attrs: {legend: PORT2}}
  - {ref: std/sfp@1, id: port3, group: sfp-plus, at: [5.25, 187.545], 'on': port3-face, rotate: 90, attrs: {legend: PORT3}}
  - {ref: std/sfp@1, id: port4, group: timing, at: [5.25, 214.045], 'on': port4-face, rotate: 90, attrs: {media: sfp-plus, speed: 10g, legend: PORT4, function: 'SyncE/PTP timing only - no traffic'}}
  - {ref: std/micro-usb@1, id: usb, group: craft, at: [4.25, 254.625], rotate: 90, attrs: {function: debug, legend: USB}}
  - {ref: std/rj45@2, id: bits-in, group: timing, at: [5.6, 264.7], rotate: 270, attrs: {media: rj48, function: BITS input, legend: BITS_IN}}
  - {ref: std/rj45@2, id: bits-out, group: timing, at: [5.6, 281.4], rotate: 270, attrs: {media: rj48, function: BITS output / daisy-chain NTR clock output, legend: BITS_OUT}}
  - {ref: common/rj45-eth@1, id: eth, group: base-t, at: [5.6, 300.2], rotate: 270, attrs: {legend: ETH}}
