  wall: '#9ea3a9'
  features:
    - node: ejector-top
      out: 4.2
      confidence: estimated
      source: >-
        cisco/a99-rp3-tr@2 ejector levers - the library's shared release-hardware
        figure, itself estimated; nothing in the Nokia corpus gives a proudness
    - node: ejector-bottom
      out: 4.2
      confidence: estimated
