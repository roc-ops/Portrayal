  - {ref: common/led-dot@1, id: port2-l1, group: leds, at: [13.0, 52.5], states: {lamp: [{name: link-activity, color: '#39b54a'}, 'off']}}
  - {ref: common/led-dot@1, id: port2-l4, group: leds, at: [8.0, 57.5], states: {lamp: [{name: link-activity, color: '#39b54a'}, 'off']}}
  - {ref: common/led-dot@1, id: port2-l3, group: leds, at: [13.0, 57.5], states: {lamp: [{name: link-activity, color: '#39b54a'}, 'off']}}
  - {ref: common/led-dot@1, id: port4-led, group: leds, at: [8.0, 62.5], states: {lamp: [{name: link-activity, color: '#39b54a'}, 'off']}}
