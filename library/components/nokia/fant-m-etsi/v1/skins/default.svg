<svg xmlns="http://www.w3.org/2000/svg" width="30mm" height="405mm" viewBox="0 0 30 405">
  <!-- Nokia FANT-M (ETSI AA/AB), upright. Positions: contract provenance.positions. -->
  <rect id="face" x="0" y="0" width="30" height="405" rx="0.4" fill="#c8cbcf" stroke="#8d9297" stroke-width="0.3"/>
  <rect id="logo-zone" x="11.0" y="3.0" width="16.0" height="18.0" fill="none"/>
  <!-- the connector housing: six sawtooth teeth, each a face turned up carrying its connector and a return turned
       down to the plate - real facets (contract relief), flush bands between them (provenance.housing, angled-panel) -->
  <g id="housing">
    <rect x="1.2" y="66.0" width="27.6" height="174.6" rx="0.4" fill="#8f949a" stroke="#5f646a" stroke-width="0.3"/>
  </g>
  <g id="pps-face">
    <rect x="1.2" y="67.6" width="27.6" height="10.5" fill="#b4b9be" stroke="#5f646a" stroke-width="0.2"/>
    <g id="pps-face-silkscreen"><text x="26.0" y="72.5" transform="rotate(90 26.0 72.0)" font-family="Arial, Helvetica, sans-serif" font-size="1.5" text-anchor="middle" fill="#1c1f23">1PPS</text></g>
  </g>
  <g id="pps-return">
    <rect x="1.2" y="78.1" width="27.6" height="9.78" fill="#7b8086" stroke="#5f646a" stroke-width="0.2"/>
    <line x1="1.2" y1="78.25" x2="28.8" y2="78.25" stroke="#d9dcdf" stroke-width="0.3"/>
  </g>
  <g id="ten-mhz-face">
    <rect x="1.2" y="90.5" width="27.6" height="10.5" fill="#b4b9be" stroke="#5f646a" stroke-width="0.2"/>
    <g id="ten-mhz-face-silkscreen"><text x="26.0" y="95.5" transform="rotate(90 26.0 95.0)" font-family="Arial, Helvetica, sans-serif" font-size="1.5" text-anchor="middle" fill="#1c1f23">10MHz</text></g>
  </g>
  <g id="ten-mhz-return">
    <rect x="1.2" y="101.0" width="27.6" height="10.5" fill="#7b8086" stroke="#5f646a" stroke-width="0.2"/>
    <line x1="1.2" y1="101.15" x2="28.8" y2="101.15" stroke="#d9dcdf" stroke-width="0.3"/>
  </g>
  <g id="port1-face">
    <rect x="1.2" y="118.5" width="27.6" height="18.9" fill="#b4b9be" stroke="#5f646a" stroke-width="0.2"/>
    <g id="port1-face-silkscreen"><text x="26.0" y="128.5" transform="rotate(90 26.0 128.0)" font-family="Arial, Helvetica, sans-serif" font-size="1.5" text-anchor="middle" fill="#1c1f23">PORT1</text></g>
  </g>
  <g id="port1-return">
    <rect x="1.2" y="137.4" width="27.6" height="10.77" fill="#7b8086" stroke="#5f646a" stroke-width="0.2"/>
    <line x1="1.2" y1="137.55" x2="28.8" y2="137.55" stroke="#d9dcdf" stroke-width="0.3"/>
  </g>
  <g id="port2-face">
    <rect x="1.2" y="153.9" width="27.6" height="19.9" fill="#b4b9be" stroke="#5f646a" stroke-width="0.2"/>
    <g id="port2-face-silkscreen"><text x="26.0" y="164.0" transform="rotate(90 26.0 163.5)" font-family="Arial, Helvetica, sans-serif" font-size="1.5" text-anchor="middle" fill="#1c1f23">PORT2</text></g>
  </g>
  <g id="port2-return">
    <rect x="1.2" y="173.8" width="27.6" height="10.07" fill="#7b8086" stroke="#5f646a" stroke-width="0.2"/>
    <line x1="1.2" y1="173.95" x2="28.8" y2="173.95" stroke="#d9dcdf" stroke-width="0.3"/>
  </g>
  <g id="port3-face">
    <rect x="1.2" y="183.87" width="27.6" height="16.63" fill="#b4b9be" stroke="#5f646a" stroke-width="0.2"/>
    <g id="port3-face-silkscreen"><text x="26.0" y="192.5" transform="rotate(90 26.0 192.0)" font-family="Arial, Helvetica, sans-serif" font-size="1.5" text-anchor="middle" fill="#1c1f23">PORT3</text></g>
  </g>
  <g id="port3-return">
    <rect x="1.2" y="200.5" width="27.6" height="9.75" fill="#7b8086" stroke="#5f646a" stroke-width="0.2"/>
    <line x1="1.2" y1="200.65" x2="28.8" y2="200.65" stroke="#d9dcdf" stroke-width="0.3"/>
  </g>
  <g id="port4-face">
    <rect x="1.2" y="210.25" width="27.6" height="16.45" fill="#b4b9be" stroke="#5f646a" stroke-width="0.2"/>
    <g id="port4-face-silkscreen"><text x="26.0" y="219.0" transform="rotate(90 26.0 218.5)" font-family="Arial, Helvetica, sans-serif" font-size="1.5" text-anchor="middle" fill="#1c1f23">PORT4</text></g>
  </g>
  <g id="port4-return">
    <rect x="1.2" y="226.7" width="27.6" height="9.64" fill="#7b8086" stroke="#5f646a" stroke-width="0.2"/>
    <line x1="1.2" y1="226.85" x2="28.8" y2="226.85" stroke="#d9dcdf" stroke-width="0.3"/>
  </g>
  <!-- frames round the lower RJ45s: BITS_IN and BITS_OUT in one, ETH alone, LCRT and ToD/PPS in one -->
  <g id="jack-frames" fill="none" stroke="#6f747a" stroke-width="0.3">
    <rect x="6.4" y="262.9" width="14.2" height="33.5" rx="0.3"/>
    <rect x="6.4" y="298.4" width="14.2" height="16.8" rx="0.3"/>
    <rect x="6.4" y="317.6" width="14.2" height="33.6" rx="0.3"/>
  </g>
  <g id="ejector-top">
    <path d="M 1.2 0.5 L 5.6 0.5 L 5.6 12.0 L 7.9 12.6 L 8.2 29.6 Q 8.2 31.0 6.8 31.0 L 2.6 31.0 Q 1.2 31.0 1.2 29.6 Z" fill="#2e3136" stroke="#1c1f23" stroke-width="0.25"/>
    <path d="M 3.4 13.5 L 3.4 29.5" stroke="#4a4e54" stroke-width="0.4" fill="none"/>
  </g>
  <g id="ejector-bottom">
    <path d="M 1.4 318.0 L 5.4 318.0 Q 6.4 318.0 6.4 319.0 L 6.4 404.0 L 0.8 404.0 L 0.8 319.0 Q 0.8 318.0 1.4 318.0 Z" fill="#2e3136" stroke="#1c1f23" stroke-width="0.25"/>
    <path d="M 3.4 320.0 L 3.4 394.0" stroke="#4a4e54" stroke-width="0.4" fill="none"/>
  </g>
  <g id="screw">
    <circle cx="21.0" cy="398.5" r="4.0" fill="#8f959b" stroke="#5d6268" stroke-width="0.25"/>
    <circle cx="21.0" cy="398.5" r="2.6" fill="#a9aeb4" stroke="#5d6268" stroke-width="0.2"/>
    <path d="M 19.6 398.5 L 22.4 398.5 M 21.0 397.1 L 21.0 399.9" stroke="#3a3e43" stroke-width="0.4"/>
  </g>
  <g id="silkscreen" font-family="Arial, Helvetica, sans-serif" fill="#1c1f23">
    <text x="11.0" y="25.7" font-size="2.0">FANT-M</text>
    <!-- lamp legends, Figure 73 -->
    <g font-size="1.3">
      <text x="7.2" y="33.95" text-anchor="end">ALM</text>
      <text x="15.8" y="33.95">PWR</text>
      <text x="7.2" y="38.95" text-anchor="end">ACO</text>
      <text x="15.8" y="38.95">A/S</text>
      <text x="7.2" y="43.95" text-anchor="end">2</text>
      <text x="15.8" y="43.95">1</text>
      <text x="7.2" y="48.95" text-anchor="end">4</text>
      <text x="15.8" y="48.95">3</text>
      <text x="7.2" y="53.95" text-anchor="end">2</text>
      <text x="15.8" y="53.95">1</text>
      <text x="7.2" y="58.95" text-anchor="end">4</text>
      <text x="15.8" y="58.95">3</text>
      <text x="7.2" y="63.95" text-anchor="end">PORT4</text>
      <text x="15.8" y="63.95">PORT3</text>
      <text x="18.4" y="46.45" font-size="1.1">PORT1</text>
      <text x="18.4" y="56.45" font-size="1.1">PORT2</text>
    </g>
    <g fill="none" stroke="#1c1f23" stroke-width="0.18">
      <path d="M 5.6 42.4 L 5.0 42.4 L 5.0 49.6 L 5.6 49.6"/>
      <path d="M 17.1 42.4 L 17.7 42.4 L 17.7 49.6 L 17.1 49.6"/>
      <path d="M 5.6 52.4 L 5.0 52.4 L 5.0 59.6 L 5.6 59.6"/>
      <path d="M 17.1 52.4 L 17.7 52.4 L 17.7 59.6 L 17.1 59.6"/>
    </g>
    <!-- connector legends, reading down the card as Figure 72 prints them -->
    <g font-size="1.5" text-anchor="middle">
      <text x="12.3" y="256.5" transform="rotate(90 12.3 256.0)">USB</text>
      <text x="23.5" y="271.8" transform="rotate(90 23.5 271.3)">BITS_IN</text>
      <text x="23.5" y="288.5" transform="rotate(90 23.5 288.0)">BITS_OUT</text>
      <text x="23.5" y="307.3" transform="rotate(90 23.5 306.8)">ETH</text>
      <text x="23.5" y="326.5" transform="rotate(90 23.5 326.0)">LCRT</text>
      <text x="23.5" y="343.3" transform="rotate(90 23.5 342.8)">ToD/PPS</text>
    </g>
    <!-- laser warning label (yellow, applied) -->
    <g id="laser-label">
      <path d="M 12.5 243.1 L 15.0 247.4 L 10.0 247.4 Z" fill="#f2c230" stroke="#1c1f23" stroke-width="0.2"/>
      <circle cx="12.5" cy="246.0" r="0.5" fill="#1c1f23"/>
    </g>
    <!-- two small hazard/ground icons beside the lower lever, and the ESD triangle -->
    <g fill="none" stroke="#1c1f23" stroke-width="0.2">
      <rect x="10.6" y="378.6" width="2.8" height="2.8"/>
      <rect x="10.6" y="386.6" width="2.8" height="2.8"/>
      <path d="M 20.5 384.9 L 23.2 389.6 L 17.8 389.6 Z"/>
    </g>
  </g>
</svg>
