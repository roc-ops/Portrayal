format: 1
kind: module
name: iom3-xp
version: 1.1.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia (Alcatel-Lucent) 7750 SR / 7450 ESS IOM3-XP, IOM3-XP-B and IOM3-XP-C (3HE03619AA,
  3HE06318AA, 3HE08426AA - one face, three models), the FP2 50 Gb/s input/output module for the
  SR-7 and SR-12 card slots. A full-length carrier holding two classic MDA / MDA-XP slots, slot
  1 at the left: an end block with a Phillips captive screw at each end, an ejector lever along
  the bottom at each end, and between the two MDA windows a narrow divider printed with the
  model name, reading upward, whose T-shaped foot fills the MDAs' notched inner corners and
  carries the Stat light pipe. Stat: purple (IOM3-XP) or teal (-B, -C) on but not yet through
  diagnostics, green blinking booted but not provisioned, green booted, amber fault. Authored
  horizontal, as the guide draws it; the SR-12's vertical slots seat it at rotate 90, which
  puts MDA slot 1 at the top. Takes classic MDAs and MDA-XPs, not MDA-e (SR12 p67 Table 11),
  and an FP2 card fails at fabric-speed-b and -c (SR12 p57, p63).
size: {w: 425.4, h: 35.4, d: 431.8}
size-confidence: {w: drawing, h: drawing, d: datasheet}
size-notes: >-
  The chassis guides give every IOM 1.4 x 16.75 x 17 in (3.56 x 42.55 x 43.18 cm, SR7 p106
  Table 47). The face is held at 425.4 x 35.4, the SR-7/SR-12 slot-card envelope, so the slots
  tile on the 35.4 pitch; Figure 61 measures 425.5 wide and draws the plate 35.1 tall, and its
  y figures are scaled by 35.4 / 35.1.
