format: 1
kind: module
name: m5e2-100g-qsfp28-2-800g-qdd
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia 7750 SR MDA2-e-XP, 2-port 100G QSFP28 + 2-port 800G QDD (3HE20976AA, CLI
  m5e2-100g-qsfp28+2-800g-qdd), an FP4 media-dependent adapter with up to 800 Gb/s of
  line rate. Authored horizontal, as the guide draws it: a handle at each top corner and
  a captive screw on each lower end wing; Stat and Pwr at the left; two QSFP28 cages
  (c1, c2) and two QSFP-DD800 cages (c3, c4) in one row, each with its Lnk/Act lamp
  above it; the legends QSFP28 and QDD bracketed under the cages and the model label at
  the lower right.
size: {w: 193.0, h: 35.4, d: 193.0}
size-confidence: {w: drawing, h: datasheet, d: datasheet}
size-notes: >-
  The shared wave-1 MDA envelope (MDA-e, MDA-e-XP, MDA2-e-XP): w 193.0 measured on the figures
  (the datasheet's 7.6 in), h 35.4 the measured slot pitch (the datasheet's 1.4 in rounded),
  d 193.0 (7.6 in). The lower corners are notched: only x 16.1-176.9 runs the full height.
unplaced: "seated by the SR-1 MDA slots (1.5 Tb/s chassis revisions only) and, in a later wave, the IOM5-e 1.5T; the coordinator wires it"
