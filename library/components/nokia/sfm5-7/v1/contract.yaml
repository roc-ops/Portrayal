name: sfm5-7
version: 1.0.0
class: fabric
behaviour: fills
profile: networking
description: >-
  Nokia 7750 SR SFM5-7 switch fabric module, the carrier half of the SFM5-7 + CPM5 combination
  for the SR-7 / 7450 ESS-7. Its face is two end pieces - each with a black captive screw, the
  black perforated ejector lever along the bottom edge, and on the left one the label plate -
  with a window between them that the pluggable CPM5 fills (the `cpm` bay, nokia/cpm5@1, held by
  its own captive screws). Authored horizontal like every SR-7/SR-12 slot card; the SR-12 turns
  it upright with the left end at the top. SFM5-7, SFM5-12 and SFM6-7/12 share this form factor
  (SR12 p60) and are separate components only because each chassis accepts its own.
size: {w: 425.4, h: 35.4, d: 457.2}
size-confidence: {w: drawing, h: drawing, d: datasheet}
size-notes: >-
  The wave-2 slot-card envelope: 425.4 x 35.4 so the twelve SR-12 slots tile; the guides state
  1.35 in (34.3) for SF/CPMs. d is the 18 in of the SFM + CPM5 combination.
