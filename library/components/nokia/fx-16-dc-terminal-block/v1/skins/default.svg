<svg xmlns="http://www.w3.org/2000/svg" width="202.5mm" height="19.9mm" viewBox="0 0 202.5 19.9">
  <!-- 7360 ISAM FX-16 -48 VDC terminals TB1-1 to TB1-4, as the shelf elevation draws them (NFXS-D BA data sheet Issue 04 Figure 13 p21): a nut 11.9 across round each stud and a post 6.4 across, the pair on a line at 30.2 degrees, the first stud centred (5.95, 13.95) and the second (19.7, 5.95), repeating every 58.95. The studs are composed parts, two per terminal (nokia/fx-16-dc-pole@1). -->
  <g id="tb1-1">
    <circle cx="5.95" cy="13.95" r="5.95" fill="#e8eaec"/>
    <circle cx="19.7" cy="5.95" r="5.95" fill="#e8eaec"/>
    <circle cx="5.95" cy="13.95" r="3.2" fill="#4a5056"/>
    <circle cx="19.7" cy="5.95" r="3.2" fill="#4a5056"/>
  </g>
  <g id="tb1-2">
    <circle cx="64.9" cy="13.95" r="5.95" fill="#e8eaec"/>
    <circle cx="78.65" cy="5.95" r="5.95" fill="#e8eaec"/>
    <circle cx="64.9" cy="13.95" r="3.2" fill="#4a5056"/>
    <circle cx="78.65" cy="5.95" r="3.2" fill="#4a5056"/>
  </g>
  <g id="tb1-3">
    <circle cx="123.85" cy="13.95" r="5.95" fill="#e8eaec"/>
    <circle cx="137.6" cy="5.95" r="5.95" fill="#e8eaec"/>
    <circle cx="123.85" cy="13.95" r="3.2" fill="#4a5056"/>
    <circle cx="137.6" cy="5.95" r="3.2" fill="#4a5056"/>
  </g>
  <g id="tb1-4">
    <circle cx="182.8" cy="13.95" r="5.95" fill="#e8eaec"/>
    <circle cx="196.55" cy="5.95" r="5.95" fill="#e8eaec"/>
    <circle cx="182.8" cy="13.95" r="3.2" fill="#4a5056"/>
    <circle cx="196.55" cy="5.95" r="3.2" fill="#4a5056"/>
  </g>
</svg>
