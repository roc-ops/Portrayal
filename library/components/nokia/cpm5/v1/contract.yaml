format: 1
kind: module
name: cpm5
version: 1.0.1
class: supervisor
behaviour: fills
profile: networking
description: >-
  Nokia 7750 SR / 7450 ESS CPM5, the pluggable control processor that slides into the window of
  an SFM5-7, SFM5-12 or SFM6-7/12 carrier (and the SR-12e's SFM5-12e and SFM6-12e). Left to
  right: a black captive screw, the 7750 SR CPM5 legend and the recessed Reset, the lamp block
  (CPM and SFM Pwr/Stat, M/S Ctl and Ref, Timing, Ref 1-3, Pwr 1-8, Fan 1-3, CF 1-3, the
  OT/Crit/Maj/Min alarms), the lamped Mgmt RJ-45, the 2x2 block of OES 2 and BITS over OES 1 and
  SyncE, the handle, Compact Flash #2 over #1, Compact Flash #3 behind its door, the AUX DB-9
  (reserved), the DTE/DCE switch, the Console RJ-45, the Alarm DB-9, ACO/LT, the 1PPS SMB and
  the second captive screw. Authored horizontal as SR12 p53 Fig 9 draws it; lamp legends print
  vertical so that they read across when the SR-12 turns the carrier upright.
size: {w: 392, h: 31.8}
size-confidence: {w: photo-measured, h: drawing}
size-notes: >-
  The window length L = 392.0 is the mean of three independent readings (provenance.size);
  h = L / 12.33, the aspect of the SR12 p53 Fig 9 plate (5956 x 483 px at 1200 dpi). See provenance.size
  for the three measurements and why no depth is stated.
