  power-draw-max-w: 255
  power-draw-typical-w: 180
provenance:
  size: >-
    measured - no document states the CPM5 face
    and the upgrade guide 3HE11037AAABTQZZA01 (OCR'd) has no faceplate figure at all, only CLI
    output. Three independent readings of the plate length against the 425.4 card length: (1)
    SR-12e guide 3HE18645AAAATQZZA02 p56 Fig 9, the EMPTY SFM5-12e front view, vector: the
    window between the inner edges of the two screw flanges is 6438 of the 7042.5 px card,
    0.9142, i.e. 388.9 mm; (2) the same guide's chassis front p50 Fig 6, vector, which draws
    CPM5s seated in SFM carriers: plate 3276.5 px of the 3530 px card, 0.9282, i.e. 394.9 mm
    (the end-piece offsets 14.9 and 15.7 mm, so the window is centred); (3) lab photo sfm4-12-cpm5-lamps (2026-09-24), the CPM5 beside an SF/CPM4-12 in the next slot: the
    CPM5 screw and Reset land 22.6 and 42.1 mm from the card end on the SF/CPM4-12's own
    measured features, which puts the plate 16.4 mm in, i.e. 392.6 mm. Taken as 392.0 (the
    mean of the three, 392.1), about +-3. The window is centred, leaving 16.7 mm end pieces. h
    = 392.0 / 12.33 = 31.8, the SR12 p53 Fig 9 aspect; the plate is flush with the carrier's
    top edge (SR-12e p50 draws it so) and the carrier's ejector lever runs over the band below
    it. The SFM5-12e and SFM6-12e reuse this part and must cut the same 392.0 x 31.8
    window at [16.7, 0].
  depth: >-
    NOT STATED - the guides give only the SFM + CPM5 combination, 1.35 x 16.75 x 18 in (3.43 x
    42.55 x 45.72 cm, SR12L p101 Table 33); the CPM5 is shorter than its carrier and no figure
    gives its depth. size.d is left off rather than guessed. Gap.
  power: >-
    datasheet - SR12 (3HE18644AAAATQZZA03) p93 Table 31, the FP4 table: CPM5 idle 175, 25C
    180, 55C 255 W; SR7 p97 Table 35 the same. max 255 (55C), typical 180 (25C). CONFLICT: the
    FP3 tables (SR12 p96 Table 35, SR7 p99, SR12L p91 Table 24) give 175 / 175 / 180 / 225 W
    worst case. The larger figure is carried. The bundle rows (SFM5-12 + CPM5 485 W, SFM5-7 +
    CPM5 360 W, SFM6-7/12 + CPM5 525 W) are the carrier's figure plus this one and are not
    carried on either part.
  part-number: >-
    datasheet - 3HE08423AA, 7450 ESS 3HE08432AA (SR12 p93 Table 31, SR7 p97/p99). CONFLICT:
    SR12 p96 Table 35 and SR12L p91 Table 24 print the CPM5 as 3HE08429AA, which SR7 p99 gives
    to the SFM5-7; taken as a misprint.
  layout: >-
    drawing - SR12 p53 Fig 9 (art 27016), vector, read from its paths with PyMuPDF and mapped
    so the plate's outer box is 392.0 x 31.8 (0.911 pt/mm both ways). Captive screws (6.78,
    21.88) and (385.11, 21.88), heads 7.5 across in a 9.2 washer; the lower-corner lips 13.7 x
    4.3 under each; Reset (24.93, 20.51); the lamp box 26.64-32.46 x 3.13-30.18 split at y
    16.68; lamps 2.57 across on columns x 30.88 / 36.05 / 41.22 / 46.39 / 51.56 / 56.73 /
    61.88 / 67.08 and rows y 22.55 / 18.68 / 14.80 / 10.93; Mgmt housing 71.40-87.84 x
    10.20-25.09; the 2x2 shells 90.35-106.88 and 109.55-126.07 x 5.75-29.79, openings on rows
    6.51-16.77 and 18.77-29.03; handle 132.94-137.33 x 3.27-28.30; CF eject buttons
    138.93-145.67, slots 146.20-191.73 on rows 6.77 and 18.66; CF #3 eject 195.29-202.03, door
    202.42-270.29 x 12.39-25.31 with its screw at (265.88, 20.65); AUX shell centred (224.40,
    7.25); DTE/DCE 275.18-279.94 x 16.65-24.10; Console housing 282.32-300.60 x 11.40-26.66;
    Alarm centred (317.99, 20.19); ACO/LT (339.81, 20.66) 7.6 across; 1PPS (362.40, 20.99);
    ESD mark 382.83-390.09 x 1.74-8.03. SR7 p54 Fig 10 is the same art.
  ports: >-
    datasheet - SR12 p54-55 Table 6: Mgmt, 10/100 Ethernet RJ-45; OES 1, the optical extension
    shelf port; OES 2, reserved; BITS, RJ-45 (RJ-48C, p256 Table 105); SyncE/1588v2, 10/100
    Ethernet RJ-45; AUX, reserved, a DB-9; Console, an RJ-45 UART (the SF/CPM4's console was a
    DB-9); Alarm, DB-9 female (p258 Table 108); 1PPS, SMB 50 ohm. CONFLICT: SR12 p51 Table 5
    calls the 1PPS output 1.0/2.3 BNC, but the faceplate key 15 says SMB and Fig 9 draws a
    hex-nut SMB; SMB is used.
  jacks: >-
    drawing + convention - Mgmt is the lamped common/rj45-eth@1 unrotated, its windows at the
    bottom as Fig 9 draws them. The 2x2 block uses common/rj45-ganged-eth@1 cells for OES 1
    and OES 2 (Ethernet) and bare std/rj45-ganged@2 cells for BITS and SyncE (timing jacks,
    L76 and the nokia/ccm-e@1 pattern), centred on the drawn openings; the upper row is lamps-
    up (rotate 180) and the lower row lamps-down, as drawn. The BITS and SyncE lamps are
    separate common/led-dot@1 parts moved out past the housing's latch edge (above BITS, below
    SyncE) at the drawn windows' x, so L46 does not read them as collisions. Console is a bare
    std/rj45@2 turned 180, latch up as drawn; it has no lamps (SR12 p204 Table 81 key 6)
    although Fig 9 draws two windows. AUX and Alarm are common/db9-receptacle@1 centred on the
    drawn shells; Fig 9 draws the standoffs 21.0 apart against the D-sub's 24.99, so the
    registry part is used, not the art. 1PPS is common/smb-jack@1.
  lamps: >-
    datasheet - SR12 pp200-202 Table 80: SFM Stat green up / green blinking booting; SFM Pwr
    and CPM Pwr blue; CPM Stat green up / green blinking loading / green fast blinking
    synchronizing (rate 4 estimated, as the MDA-e cards are); M/S Ctl and Ref green primary / green
    blinking secondary / amber fault; Timing green locked / green blinking holdover / amber
    blinking free-running; Ref 1-3 green selected / green blinking standby / amber not
    qualified; Pwr 1-8 green up / amber no power / amber blinking fault (footnote 19: the
    chassis has only two power entry modules, so only Pwr 1 and 2 ever light, on the active
    CPM5); Fan 1-3 green / amber blinking; CF 1-3 green / amber blinking / amber; OT, Crit,
    Maj red, Min amber. Table 81 (pp203-204): Mgmt, OES 1 and SyncE Link (left) green 100 FD /
    green blinking 100 HD / amber 10 FD / amber blinking 10 HD, Data (right) green blinking
    activity / amber blinking error; BITS one link lamp, amber no clock / green clock; OES 2
    is reserved and is given OES 1's meanings. The guide gives no RGB values; the library's
    lamp colours are used. SR7 pp193-196 Tables 78/79 are the same.
  lamp-mapping: >-
    convention - rj45-eth and rj45-ganged-eth put led-a at the left window and led-b at the
    right when unrotated; rotate 180 swaps them. So Link is led-a on Mgmt and OES 1 and led-b
    on the turned OES 2. Which BITS window carries its one lamp is not stated; the left one is
    used. The printed numerals inside the Ref / Pwr / Fan / CF lamps (Fig 9 and the photo) are
    not drawn: the lamp part covers them.
  legends: >-
    drawing + photo - positions and orientation from Fig 9's text layer: lamp and module
    legends run vertical (bottom to top), port legends horizontal, exactly as the owner's
    photo of the installed CPM5 reads when the SR-12 turns them. Fig 9 prints "Timming"; the
    photo reads "Timing", which is what is drawn. Fig 9 sets them in Times; the photo shows a
    sans face, which is used.
  colour: >-
    photo - lab photos (2026-09-24): charcoal-to-black plate, white legends, black
    plastic captive-screw knobs with a cross slot, a black handle, bright-shield RJ-45s. Warm
    light, so the plate is the SR-7/SR-12 card family value #2e3034 rather than a sampled one.
  relief: >-
    estimated - the captive screw knobs stand proud (cyl 1.6, as nokia/ccm-e@1); the handle
    stands out 12 (a loop the photo shows well clear of the plate; not dimensioned); the CF
    mouths are pocketed 3 (nokia/ccm-e@1). Nothing else is raised in the figure.
  marks: >-
    drawing - the ESD triangle at the top right (Fig 9), drawn yellow with a black glyph as
    the photos show it on the MDA-e plates beside it; no vendor logo on the plate, and a logo-
    zone is reserved on the plain metal above ACO/LT.
  lifecycle: 'searched only the staged corpus - listed in the SR-7/SR-12 22.7 guides; no end-of-life notice searched'
