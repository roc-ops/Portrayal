groups:
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      reaching the router - the RJ-45 console (serial, with the DTE/DCE switch), the 10/100 Mgmt
      Ethernet port, OES 1 and OES 2 (10/100 Ethernet, the optical extension shelf; OES 2 reserved),
      the AUX DB-9 (reserved) and the Alarm DB-9 contact output
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the timing ports - BITS (RJ-48C), SyncE/1588v2 (10/100 Ethernet on RJ-45) and the 1PPS output
      on SMB
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the CPM and SFM Pwr and Stat lamps, M/S Ctl and Ref, and Timing
  system-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: Ref 1-3, Pwr 1-8 (only 1 and 2 are ever lit in the SR-7 and SR-12), Fan 1-3 and CF 1-3
  alarm-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the office alarm lamps OT, Crit, Maj and Min
  timing-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the BITS link lamp and the SyncE Link and Data lamps, drawn as dots at the jacks' latch edges
