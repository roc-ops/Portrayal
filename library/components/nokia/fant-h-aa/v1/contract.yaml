format: 1
kind: module
name: fant-h-aa
version: 1.0.0
class: supervisor
behaviour: fills
profile: networking
unplaced: >-
  the Nokia 7360 ISAM FX / Lightspan FX shelves that seat this card (NFXS-D FX-16, NFXS-G FX-12, NFXS-E FX-8, NFXS-F FX-4 per the variant) are being modelled under #538 and do not exist in the library yet; the NT-A / NT-B bays of those shelves are what will seat it
description: >-
  Nokia FANT-H AA (3FE74828AA), the ETSI build of the 7360 ISAM FX / Lightspan FX network termination card with the 3.2 Tbps switch. Two QSFP28 uplinks and NO SFP cages, 1PPS and 10 MHz SMA timing inputs, a micro-USB debug port, BITS IN and BITS OUT, a 10/100/1000BASE-T port, the LMT craft port and the ToD/1PPS port, all RJ45, the ACO switch, and the ALM/PWR/ACO/A/S lamps plus four lane lamps per QSFP28. Stands vertically in the FX-16 and FX-12 and is turned 90 degrees in the FX-8 and FX-4.
size: {w: 30.0, h: 405.0, d: 225.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: 'w is the NT slot pitch (30 mm), taken as the faceplate width; d is the larger of the two depths the UDS gives (205/225)'
attrs:
  model: FANT-H AA
  part-number: 3FE74828AA
  variant: AA
  standard: ETSI
  switch-capacity: '3.2 Tbps'
  weight-kg: 1.5
  qsfp28: 2
  power-draw-max-w: 178
  power-draw-typical-w: 140
  power-scope: 'excludes the NTIO card and pluggable (SFP/QSFP) power, per the ETSI Safety Manual note (1)'
provenance:
  lamp-colour: >-
    estimated - The UDS LED tables name the port lamps' conditions (link, activity) but not their colour, so
    the `link-activity` state is drawn in the family green #39b54a that nokia/fnio-a@1 uses for the
    same unstated case; the A/S lamp's `standby` is that lamp OFF (the table: 'off = stand-by'), so it
    is drawn unlit (#3a3f44) rather than given a colour the hardware does not show.
  size: 'datasheet - 3HH90279AAAATQZZA23 (Lightspan FX UDS 25.12) section "Dimensions" of the AA chapter: height 405 mm, width 30 mm, depth 205/225 mm, weight approximately 1.5 kg. The same four figures appear in every FANT-H chapter of the ANSI R6.9 and ETSI R7.0 UDS guides. The 30 mm is the NT card pitch; the UDS states no separate faceplate edge-to-edge width, so the face is drawn at the pitch, which is what the FX shelf bays are built to'
  size-width: 'datasheet - slot pitch, "width: 30 mm" in the UDS dimensions list; faceplate width not stated, taken as the pitch'
  depth: 'datasheet - the UDS gives "205/225 mm" without saying what each measures; 225 is carried as the card depth. Which figure is PCB and which is overall (faceplate and ejectors included) is not stated'
  power: 'datasheet - ETSI Safety Manual 3HH11998AAAATCZZA29 p25 Table 2, "FANT-H - AA variant (1)" 140 W typical / 178 W maximum. Note (1): the power consumption for all NT cards does not include the NTIO card or SFP power consumption. Carried as power-draw-max-w 178 and power-draw-typical-w 140; power-scope: excludes the NTIO card and pluggable (SFP/QSFP) power, per the ETSI Safety Manual note (1)'
  layout: 'estimated - positions along the 405 mm are fractions read off 3HH90279AAAATQZZA23 p213 Figure 86 (3D side and front view, ETSI); LED close-up Figure 87 p214, the only face drawing any document holds: a 3D side-and-front view, embedded as a 718 x 617 JPEG at 150 ppi (pdfimages -list), so Gate 1 cannot pass and no absolute geometry comes off it. The face runs from row ~56 to row ~598, 542 px for 405 mm (0.7472 mm/px) and every y is (row - 56) x that. Rows read: SMA nuts 153.75 / 183.75; QSFP openings 219-236 / 265-284; USB 331-342; RJ45s BITS IN 362-382, BITS OUT 384-403, ETH 409-430, LMT + ToD 434-477. Taken at the flat openings, never at the protruding cage shrouds or SMA barrels, which the oblique view draws shifted up-left. Across the face the figure is foreshortened (about 34 px for 30 mm against 40 px vertically), so x is NOT measured: the port column is set on one centreline at x 14.5, the lamps in two columns at x 11.5 and 16.55, and the legends beside them, as the figure arranges them'
  ports: 'datasheet - UDS 3HH90279AAAATQZZA23 AA chapter, "External interfaces", transcribed: communication, 1 x 10/100/1000Base-T and 2 x QSFP28 (no SFP cage: the AA figure draws blank plate with only a laser mark where the other builds carry two SFP+ cages); management, micro-USB (debug), the Alarm Cut-Off switch (ACOS) and LED (ACOLED) and the local craft management interface (LCMI, RJ45); clock, BITS input and BITS output / daisy-chain NTR clock output (both RJ45), ToD/1PPS (RJ45), 10 MHz GPS (SMA) and 1 PPS (SMA). The figure adds the order top to bottom: ACO switch, lamps, 1 PPS, 10 MHz, QSFP28 1, QSFP28 2, laser mark, micro-USB, BITS IN, BITS OUT, Base-T, Craft, Time of Day. Composed from std/qsfp28@1, common/sma-jack@1, std/micro-usb@1 and std/rj45@2 rather than drawn'
  rotation: 'estimated - the face is 30 mm wide, so every cage and jack lies on its side, as on every vertical card in the library. The RJ45s turn 270 so their latch slot faces the legend side, which is where the figure draws the notch; the cages and the micro-USB turn with the long axis vertical, the cages the same way as the jacks. Which way a cage latch faces is not resolvable at 150 ppi'
  media: 'the RJ45 jacks are typed by what runs through them, as the library devices already do: Base-T rj45, LMT craft rj45-serial, ToD/1PPS rj45-tod, BITS IN/OUT rj48'
  leds: 'datasheet - UDS 3HH90279AAAATQZZA23 Table 74 p214, transcribed onto each lamp as `states`. The LED close-up gives the arrangement: two columns, ALM|PWR, ACO|A/S, then 2|1 and 4|3 bracketed PORT1 and 6|5 and 8|7 bracketed PORT2 (the AA numbers the second QSFP28 lamps 5-8 and has no PORT3/PORT4). The table gives NO COLOUR for the port lamps ("Link/activity status"), so they carry a colourless link-activity token rather than an invented green'
  lamp-size: 'estimated - common/led-dot@1 (2 mm) on the 5.0 mm row pitch read off the figure; the drawn lamp diameter is not measurable at 150 ppi'
  legends: 'drawing - printed legends read at 8x off the figure: BITS IN, BITS OUT, ETH, LMT, ToD/1PPS beside the jacks, USB beside the micro-USB, and FANT-H at the top. The SMA and cage legends are drawn but illegible at 150 ppi and are NOT printed here'
  levers: 'drawing - dark ejector levers at both ends, inside the 405 mm, per the figure and the shared Nokia conventions. The lower lever sits below the RJ45 block. Positions estimated from the figure rows'
  colour: 'estimated - light silver-grey plate with dark ejectors, the family finish from the shared FX conventions; the FANT-H photographs (500 px phone shots) were not staged locally and were not used'
  relief: 'estimated - lever projection and screw heads carry the library card-family figures, not measurements; no Nokia document states them'
  aco: 'estimated - the ACO switch is drawn as common/reset-button@1, a recessed push button; the figure shows its callout beside the FANT-H legend at the top but not its shape at a readable size'
  variants: 'drawing - FOUR FACES, SO FOUR COMPONENTS (nokia/fant-h-aa, -ac, -bb, -bc). The UDS draws each build separately and they differ in what is punched and composed, which a skin cannot carry: AA has no SFP cages but has the ACO switch and BITS IN/OUT; BB has two SFP cages, no ACO and no BITS; AC has SFP+, ACO and BITS; BC has SFP+ and neither. The 125 W builds (AC, BC) also share a different arrangement from the 178 W ones (AA, BB): everything from the lamps down sits lower, the RJ45 block is lower still and the closed lower lever lies over the LMT/ToD jacks, where on AA/BB it sits below them. BC is drawn as the AC plate with the BITS pair left blank. BA (3FE74828BA, the R6.x ANSI build, standalone UDS 3FE74828BAAATQZZA01 p7) is NOT modelled: its line drawing is the AA arrangement with blank plate where the BITS pair is, and no SFP cages'
