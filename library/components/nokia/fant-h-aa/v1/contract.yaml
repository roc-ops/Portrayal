  timing: {term: Port, role: management, index-origin: 1, mixed: 'network timing - the 1 PPS and 10 MHz GPS SMA inputs and the ToD/1PPS RJ45, with BITS in and BITS out / daisy-chain NTR output'}
  craft: {term: Port, role: management, index-origin: 1, mixed: 'reaching the card locally - the LMT craft RJ45 (LCMI) and the micro-USB debug port'}
  leds: {term: LED, role: indicator, index-origin: 1}
