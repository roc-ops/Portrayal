format: 1
kind: module
name: fant-h-aa
version: 2.2.0
class: supervisor
behaviour: fills
profile: networking
unplaced: >-
  The ETSI build; the 7360 ISAM FX ETSI subracks (NFXS-D AA/AB/AC, NFXS-E AA/AB/AD, NFXS-F
  AA/AB/AC) seat it at NT-A and NT-B, and none of them is in the library yet - the ANSI
  shelves modelled here do not accept ETSI NT boards. Delete this key when one is modelled.
description: >-
  Nokia FANT-H AA (3FE74828AA), the ETSI build of the 7360 ISAM FX / Lightspan FX network termination card with the 3.2 Tbps switch. Two QSFP28 uplinks and NO SFP cages, 1PPS and 10 MHz SMA timing inputs, the SMAs and cages set in a housing whose facets tip the ports up, a micro-USB debug port, BITS IN and BITS OUT, a 10/100/1000BASE-T port, the LMT craft port and the ToD/1PPS port, all RJ45, the ACO switch, and the ALM/PWR/ACO/A/S lamps plus four lane lamps per QSFP28. Stands vertically in the FX-16 and FX-12 and is turned 90 degrees in the FX-8 and FX-4.
size: {w: 30.0, h: 405.0, d: 225.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: 'w is the NT slot pitch (30 mm), taken as the faceplate width, which the flat BA view agrees with to 0.2 percent; d is the larger of the two depths the UDS gives (205/225)'
attrs:
  model: FANT-H AA
  part-number: 3FE74828AA
  variant: AA
  standard: ETSI
  switch-capacity: '3.2 Tbps'
  weight-kg: 1.5
  qsfp28: 2
  power-draw-max-w: 178
  power-draw-typical-w: 140
  power-scope: 'excludes the NTIO card and pluggable (SFP/QSFP) power, per the ETSI Safety Manual note (1)'
provenance:
  lamp-colour: >-
    estimated - The UDS LED tables name the port lamps' conditions (link, activity) but not their colour, so
    the `link-activity` state is drawn in the family green #39b54a that nokia/fnio-a@1 uses for the
    same unstated case; the A/S lamp's `standby` is that lamp OFF (the table: 'off = stand-by'), so it
    is drawn unlit (#3a3f44) rather than given a colour the hardware does not show.
  size: 'datasheet - 3HH90279AAAATQZZA23 (Lightspan FX UDS 25.12) section "Dimensions" of the AA chapter, and 3FE74828BAAATQZZA01 p7 section 1.7.1: height 405 mm, width 30 mm, depth 205/225 mm, weight approximately 1.5 kg. The 30 mm is the NT card pitch; the UDS states no separate faceplate edge-to-edge width, so the face is drawn at the pitch, which is what the FX shelf bays are built to'
  size-width: 'datasheet - slot pitch, "width: 30 mm" in the UDS dimensions list; faceplate width not stated, taken as the pitch. The flat BA view draws three nested lines down the left edge (cols 197, 200, 202); the face is taken from col 200, the only one that makes the aspect agree'
  depth: 'datasheet - the UDS gives "205/225 mm" without saying what each measures; 225 is carried as the card depth. Which figure is PCB and which is overall (faceplate and ejectors included) is not stated'
  power: 'datasheet - ETSI Safety Manual 3HH11998AAAATCZZA29 p25 Table 2, "FANT-H - AA variant (1)" 140 W typical / 178 W maximum. Note (1): the power consumption for all NT cards does not include the NTIO card or SFP power consumption. Carried as power-draw-max-w 178 and power-draw-typical-w 140; power-scope: excludes the NTIO card and pluggable (SFP/QSFP) power, per the ETSI Safety Manual note (1)'
  gate-1: 'drawing - 3FE74828BAAATQZZA01 p8, the right-hand image of the page (287 x 722 px, 150 ppi, pdfimages -list): the only FLAT front view of any FANT-H. The plate runs rows 7-708 (701 px for 405 mm, 1.731 px/mm) and cols 200-252 (52 px for 30 mm, 1.733 px/mm): aspect 13.48 against 13.50, agreeing to 0.2 percent, so the figure is orthographic and is measured, not read as fractions. Cross-check: the LMT and ToD jacks stand 27.5 px apart, 15.9 mm against the 15.8 mm std/rj45@2 housing they abut in'
  layout: 'drawing - measured, not estimated: the AA is the BA arrangement (3FE74828BAAATQZZA01 p8, the flat view; see gate-1) with the BITS pair in the blank the BA leaves and the ACO switch. Along (y = (row - 7) / 1.731): FANT-H legend baseline 25.7, lamp rows 36.7 on a 5.08 pitch, SMA nuts 72.0 / 95.2 (the nut body; the barrel of a jack tipped up draws above it in a front view, and the 2.0.0 reading of 70.8 / 93.6 took it in), QSFP cages 127.7 / 163.5, laser mark 191.2, micro-USB 210.0, ETH 271.5, LMT 291.2, ToD 307.0, levers 1.0-30.6 and 322.9-383.6, screws 5.2 and 399.8. The @1 fractions off the AA 3D view (p213 Figure 86) agreed with every one of these to 2.2 mm. Only the BITS IN / BITS OUT centres (236.1 / 251.9) and the ACO switch still come off that 3D view. Across, every x is measured off the flat BA view (x = (col - 200) / 1.733): SMA centres x 13.0, QSFP cages x 11.8, laser mark x 13.6, micro-USB x 7.8, RJ45 column x 13.0 inside frames x 5.8-20.2, lamp columns x 8.94 / 14.14, the angled housing x 1.15-25.4, the housing legends x 27.4, the jack legends x 24.8'
  ports: 'datasheet - UDS 3HH90279AAAATQZZA23 AA chapter, "External interfaces", transcribed: communication, 1 x 10/100/1000Base-T and 2 x QSFP28 (no SFP cage); management, micro-USB (debug), the Alarm Cut-Off switch (ACOS) and LED (ACOLED) and the local craft management interface (LCMI, RJ45); clock, BITS input and BITS output / daisy-chain NTR clock output (both RJ45), ToD/1PPS (RJ45), 10 MHz GPS (SMA) and 1 PPS (SMA). Composed from std/qsfp28@1, common/sma-jack@1, std/micro-usb@1 and std/rj45@2 at registry size; the SMA jacks and the cages sit on their housing facets, so they keep that size and the renderer foreshortens them by cos 36 along the card'
  angled-panel: 'estimated - REAL FACETS since 2.1.0 (relief features, facing up for each port face, down for each return). Nokia draws the housing as a SAWTOOTH, one tooth per port, not one slope: each port sits on a face tipped up, a ridge runs across the housing below it, and a return closes the tooth back to the plate before the next port. The 300 ppi ETSI views (3FE77012AAAATQZZA18 p239 Figure 82 for the AA, p247 Figure 85 for the AC) show it plainly: the housing outline steps out and back once per port, and the ridge is a double line across the housing. Measured there: the projection is 2.664 px/mm along the card (plate rows 116-1195 for 405 mm) and the card depth recedes 0.98 px/mm right and 0.26 px/mm down per mm proud (the card top edge, 220 px across and 58 px up for 225 mm; 205 mm gives 1.07 and 0.28). ANGLE: the QSFP28 cage front is a parallelogram whose long edges lean 0.23-0.25 px per row, 33-36 deg; the flat BA view (p8) draws the 20.0 mm cage 16.2 mm tall, cos 0.81, 36 deg; the SMA teeth rise 7.5-8.2 mm over an 11.1 mm face, 34-37 deg (their steepest stretch reads 42-45 deg, the ridge being a small land, not a knife edge). Every port face is set at 36 deg up. The QSFP28 and SFP+ faces start in a POCKET: the flat BA view frames the housing sides 113.2-127.1 and 149.0-162.9, and the 3D view shows those faces behind the plate until about 127 and 163, standing only about 7.5 mm proud at the ridge. The format roots a facet on the plate (lift must be above 0), so each cage face starts 0.6 mm above its projected cage instead, about 6 mm prouder than Nokia draws it, and the pocket above it is drawn flat. The returns are solved so both facets of a tooth meet at one apex; every cage lower wall, run back 37 (QSFP28) or 41 (SFP+) mm along the facet normal, reaches the plate before the return does, so no cage shows through the back of its tooth. Front-view mm: 1PPS SMA face 66.4-77.5 up 36, return 77.5-89.92 down 33, apex 8.1 proud; 10MHz SMA face 89.92-100.55 up 36, return 100.55-110.8 down 37, apex 7.7 proud; QSFP28 PORT1 face 119.01-137.2 up 36, return 137.2-147.16 down 53, apex 13.2 proud; QSFP28 PORT2 face 154.81-173 up 36, return 173-182.96 down 53, apex 13.2 proud.'
  rotation: 'estimated - the face is 30 mm wide, so every cage and jack lies on its side. The RJ45s turn 270 so their latch slot faces the legend side, which is where the flat BA view draws the notch; the cages and the micro-USB turn with the long axis vertical. Which way a cage latch faces is not resolvable at 150 ppi'
  media: 'the RJ45 jacks are typed by what runs through them, as the library devices already do: Base-T rj45, LMT craft rj45-serial, ToD/1PPS rj45-tod, BITS IN/OUT rj48'
  leds: 'datasheet - UDS 3HH90279AAAATQZZA23 Table 74 p214, transcribed onto each lamp as `states`. The LED close-up gives the arrangement: two columns, ALM|PWR, ACO|A/S, then 2|1 and 4|3 bracketed PORT1 and 6|5 and 8|7 bracketed PORT2, which is also how the FANT-H BA close-up (3FE74828BAAATQZZA01 p8 Figure 2) numbers them. The lamp columns sit at x 8.94 and 14.14 and the rows on a 5.08 mm pitch, off the flat BA view (lamp circles cols 213-218 / 222-227, rows 70.5 to 114.5)'
  lamp-size: 'estimated - common/led-dot@1 (2 mm); the flat BA view draws the lamp rings 6 px (3.5 mm) across, which is the bezel ring, not the lens'
  legends: 'drawing - printed legends read at 14x off the flat BA view (3FE74828BAAATQZZA01 p8), where they read DOWN the card, glyph tops toward the right edge (the H of ETH is the lowest glyph, the T of TOD-PPS the highest), so they are set rotate(90), not rotate(-90): 1PPS, 10MHz, PORT1, PORT2 beside the housing at x 27.4; USB beside the micro-USB; ETH, LMT, TOD-PPS beside the jacks; FANT-H at the top; the lamp legends ALM, PWR, A/S, the lane digits and the PORT1 / PORT2 brackets as the LED close-up (p8 Figure 2) draws them. Sizes: port legends 2.4 (the flat view sets TOD-PPS over 13 mm), lamp legends 1.7. AA own: ACO beside its lamp, BITS IN / BITS OUT beside the BITS jacks (the AA 3D view)'
  levers: 'drawing - dark ejector levers at both ends, inside the 405 mm, at x 0.4-6.0 (the flat BA view draws the handle cols 200-210). Upper 1.0-30.6 and lower 322.9-383.6, off the flat view, the lower one below the RJ45 block'
  screws: 'drawing - knurled captive screws at both ends, now drawn to the family figure in thumbscrews; as read, the flat BA view draws the heads 17-20 px (10-11.5 mm) across, centred col 232, and overhanging the plate ends by a pixel; they are kept inside the 405 mm'
  colour: 'estimated - light silver-grey plate with dark ejectors, the family finish from the shared FX conventions; the port housing is a darker grey, each port face a light flat grey and each return a darker one, so the teeth read in a face-on drawing without painted shading - the slope itself is the facets (see angled-panel)'
  relief: 'estimated - lever projection and screw heads carry the library card-family figures, not measurements; no Nokia document states them. The port housing is carried as facets, each port face and each return its own relief feature; see angled-panel for how they were read.'
  aco: 'estimated - the ACO switch is drawn as common/reset-button@1, a recessed push button; the BA build has none, so its place comes from the AA 3D figure'
  variants: 'drawing - FOUR FACES, SO FOUR COMPONENTS (nokia/fant-h-aa, -ac, -bb, -bc). AA has no SFP cages but has the ACO switch and BITS IN/OUT; BB has two SFP cages, no ACO and no BITS; AC has SFP+, ACO and BITS; BC has SFP+ and neither. BA (3FE74828BA, the R6.x ANSI build) is NOT modelled; its flat view is the AA arrangement with blank plate where the BITS pair is and no ACO, and it is the source every @2 across-the-face position comes from'
  thumbscrews: >-
    photo - owner's lab photos of an installed FX-8, 2026-09-24; flush-with-end per the owner.
    One family figure for every NT, NTIO and LT card and blank, because every screw goes into
    the fixed rails of the shelf: head 10.5 mm across, centred 19.4 mm from the left edge on
    this 30 mm plate, the top head touching the top end (y 0) and the bottom head the bottom
    end (y 394.5). Measured as ratios within one card on perspective phone photos, the
    plate-plane screw centre read from the recessed seat (concentric with the shank) rather
    than the projecting head: 30 mm NT (FANT-H top 0.640, bottom 0.651; FANT-F top 0.64-0.67,
    bottom about 0.64) -> 19.4 (ratio 0.647); 25 mm NTIO blank 3FE65651BA (top 0.733, bottom
    0.754) -> 18.7 (ratio 0.748). Head diameter against plate width: the back edge of the
    knurl 0.36 of the FANT-H plate and 0.42 of the NTIO plate at the bottom, the front faces
    0.39-0.48 (magnified by their projection), so an upper bound of 10.6-10.8 mm; 10.5 taken
    (0.35 of 30, 0.42 of 25), inside the 10-11.5 mm the Nokia flat FANT-H view draws. The
    screw sits on the side AWAY from the grey ejector lever (lever at the left edge, screw
    right of centre) at both ends. Same centre at both ends: the photos differ by under 1 mm,
    within the reading error. This replaces the per-figure screw positions and sizes read off
    the oblique guide drawings, which had drifted 17.2-21.0 across and 6.4-10.0 in size.
