  - {node: ground, cyl: 1.6, confidence: estimated, source: 'an M4 screw head (Table 65 key 3); the head height is not stated'}
  - {node: dc-terminal, out: 6.0, color: '#2b2e33', confidence: estimated, source: 'a barrier block standing off the face; not dimensioned'}
  - {node: latch, out: 2.0, color: '#b8bcc1', confidence: estimated, source: 'a thumb latch tab; not dimensioned'}
