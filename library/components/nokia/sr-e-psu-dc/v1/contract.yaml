format: 1
kind: module
name: sr-e-psu-dc
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  Nokia PSU - 7750 SR-e DC -48V (3HE09548AA), the hot-swap -48/-60 VDC supply of the SR-1e,
  SR-2e and SR-3e rear PSU shelf: the integrated exhaust fan at the left under a red handle
  running corner to corner, an M4 ground screw, the Pwr/Stat lamp at the top right, a
  two-stud barrier terminal block (Batt and RTN) and the spring latch at the lower right.
  Authored horizontal as the guide draws it; the SR-2e and SR-3e seat it upright in PSU 1-6
  with `rotate: 90`.
size: {w: 86.4, h: 40.4, d: 197.6}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: >-
  SRE p85 Table 28 prints "H x W x D 3.4 x 7.78 x 1.57 in" - transposed: the face is 3.4 in
  wide and 1.57 in (39.9) tall. h is held at the AC supply's 40.4 so one PSU bay fits both.
attrs:
  model: PSU - 7750 SR-e DC -48V
  part-number: 3HE09548AA
  power-output-w: 1600
  input: dc
  voltage: '-48v'
  inlet: dc-terminal
  airflow: exhaust
  weight-kg: 1.108
provenance:
  size: >-
    datasheet - SRE (3HE17927AAAATQZZA03) p85 Table 28: -48/-60 VDC PSU "3.4 x 7.78 x 1.57 in.
    (8.6 x 19.77 x 3.99 cm)" under an H x W x D heading, transposed as for the AC supply (the
    SR-1e rear view, SRE p45, measures the face 86.4 wide). The 1.57 in (39.9) height is
    held at 40.4, the AC supply's, so the shared bay seats both; 0.5 mm.
  depth: 'datasheet - 7.78 in (197.6 mm), SRE p85 Table 28, read as the depth'
  weight: 'datasheet - 1.108 kg (2.44 lb), SRE p85 Table 28'
  power: 'datasheet - SRE p62: "Each PSU is rated at 1600 W when operating from DC power"'
  voltage: 'datasheet - SRE p62 Table 15 "PSU - 7750 SR-e DC -48V"; section 3.3.1.2 titles it -48/-60 VDC'
  layout: >-
    drawing - SRE p63 Fig 17 (art 24451) at 1200 dpi, the same 2553 x 1230 px outline as the
    AC supply's, read with the same per-axis scales (29.55 / 30.42 px/mm). Fan housing
    3.6-42.5 x 0.6-39.7, fan centre (23.1, 20.0); the handle a bar about 5.5 wide from
    (5.9, 35.3) to (40.8, 3.0); ground screw centre (48.2, 10.5) in a washer about 10 across,
    the earth symbol beside it at (57.2, 10.5); lamp centre (78.6, 8.5) with "Pwr" over
    "Stat" to its left; terminal block 45.3-75.5 x 16.2-33.7, three barriers, the studs at
    (53.8, 25.5) and (67.0, 25.5); latch 79.4-84.8 x 25.5-39.0. The SR-1e rear view (SRE p45)
    draws the same face in PSU 1 and 2.
  terminals: >-
    datasheet - SRE Table 50 p138 (Figure 39 p137): key 1 "DC power grounding terminal with M4
    screw", key 2 "Positive (+) terminal with M4 screw", key 3 "Negative (-) terminal with M4
    screw", key 4 the clear sliding safety cover on three raised guides. Figure 39 dimensions
    the two terminal screws 0.512 in. (13.0 mm) apart and prints "4mm Screw diameter" at the
    right one, "+" under the left and "-" under the right (Figure 17 p63 prints the same).
    SRE Table 65 p187 (key 4 "Left terminal stud (Batt terminal)", key 5 "Right terminal stud
    (RTN terminal)") reads the other way round; see `poles`. The block is drawn as the
    `dc-terminal` element with its barriers and screws in the skin, and each screw is also a
    seat (see `seats`).
  seats: >-
    estimated - the two terminal screws are the library's common/terminal-screw-38@1, a slotted
    head 3.8 across (that part's own size is an estimate), standing at the centres of the two
    rings the skin draws (53.8 and 67.0 across, 25.5 down; 13.2 apart, where Figure 39 gives
    0.512 in., 13.0 mm: 0.2 mm, so the skin is not redrawn) and lifted 6.0 mm, the proudness
    the `dc-terminal` relief below already estimates. The head is drawn smaller than the 4 mm
    screw Figure 39 names and than the ring round it, so the drawing marks where a lug lands
    and does not show the screw. The guide prints no head size or thread pitch, so none is
    claimed. The ring lug the guide recommends (Molex 19071-0178, SRE p138) is a one-hole ring
    lug, which generic/ring-lug@1 stands for.
  earth: >-
    The earth screw is the guide's own "ground screw" (SRE p137, Table 50 key 1 p138, Figure
    39 callout 1), an M4 screw with a washer beside the two-screw block and not on it, so it is
    a ground seat a lug lands on outside the DC port, which keeps two poles. It is the
    library's common/ground-screw-m4@1 (an M4 pan head, 8 across, the registry's own figure),
    standing at the centre of the washer the skin draws (48.2 across, 10.5 down). The guide
    asks a 90-degree ring lug on #8 AWG ground wire, minimum, and torque 8 to 10 lbf-in (SRE
    p138, p142); no angled lug is built, so the straight generic/ring-lug@1 stands in. The
    relief of the `ground` element below is the skin's older estimate and is left as it was.
  poles: >-
    Nokia 7750 SR-1e, SR-2e and SR-3e Chassis Installation Guide (3HE17927AAAATQZZA03, 21.10):
    Figure 39 p137 and Figure 17 p63 print "+" under the left screw and "-" under the right;
    Table 50 p138 calls the left screw (key 2) the positive terminal and the right (key 3) the
    negative; section 6.3.5 steps 4 and 5 (pp143-144) send the positive wire to the "battery
    return" terminal and the negative wire to the negative battery terminal, and Figure 42
    p141 labels the positive wire the battery return. So the left screw is the return and the
    right is the battery feed: `rtn` for the positive terminal (spec/schemas/dc.yaml writes
    `rtn` as positive (battery return)) and `batt` for the negative one (it writes `batt` as
    negative (battery)), listed left to right as the skin draws them. THE ONE DISAGREEMENT:
    Table 65 p187 (Figure 60) calls the left stud the Batt terminal and the right the RTN
    terminal. The legend of Figures 17 and 39, Table 50 and the steps agree, one table reads it
    the other way, and no photograph is held, so the first three are followed. The skin prints
    "+" and "-" under the screws and no word.
  awg: >-
    Nokia 7750 SR-1e, SR-2e and SR-3e Chassis Installation Guide (3HE17927AAAATQZZA03, 21.10):
    p137 "Use #8 AWG wire for the -48/-60 VDC and RTN connections", p138 "requires that you
    use #8 AWG wire" with terminal rings, Table 52 p140 key 1 "#8 AWG copper wire". Section
    4.5.4.1 (p94) words the same size as "#8 AWG (minimum)". One size is named for the power
    wires in every place, so the port states [8]; where the page says minimum, the size is a
    floor, and the ground wire's own "minimum #8 AWG" is outside the port.
  rating: >-
    NOT STATED. Table 24 p81 prints "-48/-60 VDC, 40/30 A per source" under the rated voltage:
    a pair of currents, one for each rated voltage, and the port's `rating-a` is one figure.
    The 60 A fuse or breaker of section 4.5.4 (p94) is the feed's, not the supply's. The port
    states none and a later change can state it once a source says which applies.
  nominal: >-
    NOT STATED AS A NOMINAL. Table 24 p81 prints a rated voltage of "-48/-60 VDC" and an
    operating range of -40 to -72 VDC: two rated figures and a range, and no one nominal, so
    the port states no `voltage`. A feed is matched on its roles.
  handle: >-
    datasheet - SRE p187 Table 65 key 1: "Handle (colored red)"; SRE p198. Fig 17 draws it
    diagonal across the fan, where the AC supply's (Fig 16) runs level - the two faces
    differ, as drawn. The red is #c8102e, estimated.
  latch: 'datasheet - Table 65 key 7: latch lock, pressed to the left to unlock'
  lamps: >-
    datasheet - SRE p187 Table 65 key 6: unlit input below minimum; green slow blink standby;
    green solid operating; amber slow blink warning; amber solid fault; red solid wrong PSU.
    No RGB given; the library's green #39b54a, amber #f5a623, red #d0021b.
  airflow: 'datasheet - SRE p72 Table 19: the integrated PSU fan exhausts at the rear'
  colour: 'estimated - metal grey body, black fan; no photograph staged (DS 189831 listed, not staged). A gap'
  not-interchangeable: 'datasheet - SRE p63: not interchangeable with other 7750 SR products'
  logo-zone: 'none reserved - Fig 17 leaves no free metal: fan, lamp, ground, terminal block and latch fill the face'
  relief: >-
    estimated - the fan pocketed as smartoptics/dcp-2-psu-dc@1's; the diagonal handle is NOT
    raised, because relief builds a raised node from its bounding box and this handle's box
    is the whole fan (a slab over the grille). A gap in 3D, not in 2D.
  lifecycle: 'searched only the staged corpus - listed in SRE 21.10; no end-of-life notice searched on the web'
