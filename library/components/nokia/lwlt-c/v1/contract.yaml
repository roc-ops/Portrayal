format: 1
kind: module
name: lwlt-c
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia LWLT-C (3FE 76353 AA, and 3FE 76353 BA, the US-made BEAD build), the 16-port
  Multi-PON line termination board of the Lightspan MF shelves: GPON, XGS-PON or Multi-PON
  (MPM, GPON + XGS-PON) on every port and 25GS-PON on the even ports, in sixteen SFP-DD
  cages marked 01 to 16. Authored lying flat, as the MF-8 seats it when the shelf is
  mounted horizontally: a slate plate with an ejector lever at each lower corner, the board
  name, the PWR and ALM lamps and a label at the left, and one row of sixteen cages on a
  19.9 mm pitch, each on its own sawtooth step turned to face right, with four vent
  openings above it and, on the strip under the row, its numeral between two rectangular
  PON light pipes. The two part numbers share one face, so they are one component.
size: {w: 400.5, h: 24.5, d: 217.0}
size-confidence: {w: drawing, h: datasheet, d: datasheet}
size-notes: >-
  w is the slot opening the card fills, ejector end to ejector end, measured on the MF-8
  data sheet's front render; the plate itself is 393.3 mm and the board 388 mm. h is the
  board-to-board pitch (24.5 mm). d is the stated depth without handles (256 mm with them).
attrs:
  model: LWLT-C
  part-number: 3FE 76353 AA / BA
  xgs-pon: 16
  weight-kg: 1.6
  power-draw-max-w: 104
  power-draw-typical-w: 96
  power-scope: >-
    full load, all lines active, in the highest use case the manual lists, 8 x 25GS-PON
    (96 W typical at 48 Vdc and 25 C, 104 W maximum at worst-case voltage, temperature and
    component tolerances). 2PM XGS/GPON is 93 / 104 W, XGS-PON 76 / 82, GPON 58 / 62
provenance:
  rate: >-
    datasheet - `xgs-pon: 16`, as nokia/fwlt-c@1 states it and for the same reason.
    Lightspan MF-8 Unit Data Sheet Guide 3HH-92646-AAAA-TQZZA Issue 09 section 8.4 (p57):
    GPON, XGS-PON and Multi-PON (GPON + XGS-PON) "on any of the 16 ports", and 25GS-PON on
    the even ports (2, 4 ... 16). So each port states what its cage carries: the odd ports
    `pon: xgs-pon`, the even ports `pon: 25gs-pon`. 25GS-PON has no interface type in both
    DCIM targets (NetBox has `25g-pon`, Nautobot does not), so the even ports export as the
    XGS-PON they also run, from the card's `xgs-pon: 16`.
  shared-with-fwlt-c: >-
    nokia/fwlt-c@1 is the same 16-port Multi-PON function on the 7360 FX. Taken from it:
    the port treatment (one `sfp-dd` group, std/sfp@1 per cage, media sfp-dd, speed 10g odd
    / 25g even, `pon:` flavour per port, card-level `xgs-pon: 16`), the two-lamps-per-port
    states and their colours, and the ALM / PWR states - the two guides give the same LED
    tables. NOT taken from it: every position and size. This card lies flat at 400.5 x 24.5
    on a 19.9 mm pitch (the FX card stands upright at 25 x 405 on 20.62), its cages stand
    on a sawtooth whose angle this card's figures resolve (the FX contract leaves its own
    unresolved), its lamps are rectangular light pipes flanking the numeral under each cage,
    its ejectors are levers folded along the lower edge with no thumbscrews drawn, the
    board lamps sit at the left end beside the board name, and the power figures are this
    board's own.
  size: >-
    datasheet - Unit Data Sheet Guide section 8.6.1 (p60): height 388 mm, depth 217 mm
    without handles / 256 mm with, board-to-board pitch 24.5 mm, weight 1.6 kg. The LWLT-C
    data sheet CID213054 gives height 388, width 204 and pitch 24.5; 204 against 217 is a
    different reading of the board's depth and the guide's figure is carried.
  size-width: >-
    drawing - 400.5 mm is the slot opening on the Lightspan MF-8 data sheet CID214273
    front render (orthographic; 1.8129 px/mm from the shelf's 481.0 mm over three agreeing
    quantities), where the card's ejector ends fill it. On Unit Data Sheet Guide Figure 39
    the plate measures 393.3 mm, 3.8 mm in from the left end and 3.4 from the right, and
    the stated 388 mm is the board.
  depth: >-
    datasheet - 217 mm, the stated depth without handles.
  power: >-
    datasheet - Lightspan MF-8 User, Safety and Installation Manual 3HH-92647-AAAA-RJZZA
    Issue 09 section 2.4.5 Table 21 (p123-124): LWLT-C GPON 58 W full load typical / 62 W
    full load maximum, XGS-PON 76 / 82, 2PM XGS/GPON 93 / 104, 8x 25GS-PON 96 / 104.
    Typical is "all lines active and maximum load" at 48 Vdc and 25 C with averaged
    component specs; maximum is the same load at worst-case voltage, temperature and
    component tolerances. The highest row is carried. The Unit Data Sheet Guide section
    8.7 (p62) states only the supply (-48 / -60 Vdc nominal) and no wattage, and the table
    does not split the figure by part number.
  faces: >-
    drawing - one figure is drawn for the board (Figure 39, p59) and Table 17 (p55) lists
    3FE 76353 AA and BA under one mnemonic; the BA footnote says it is produced in the USA
    for the BEAD programme, needs a minimum software release, and (Table 18 note 2, p61)
    "does not necessarily support each of the pluggable types". Nothing draws the BA
    apart, so it is one component and the part number is an attr. The manual's Table 13
    (p104-106) gives the BA its own optics column.
  layout: >-
    drawing - Unit Data Sheet Guide p59 Figure 39, an embedded 924 x 169 raster (the page
    renders no finer), read against the MF-8 data sheet render's LT rows. Gate 1: the
    figure's ejector bodies span px 24 to 911, 887 px for 400.5 mm = 2.2147 px/mm, and
    the plate height at that scale is 24.4 to 25.3 mm against the 24.5 pitch. The same
    scale puts the figure and the render on each other: second cage left edge 66.2 mm in
    both, vent group 64.8 / 64.6, cage block 47.9 to 365.3 / 48.6 to 365.7, ejector block
    18.1 / 18.2 wide, left lever tip 70.9 / 70.6, right 328.3 / 329.9. Cage pitch 44.0 px
    = 19.87 mm on the figure and 19.94 on the render (fourteen intervals each); 19.9
    carried. Positions are good to about +-0.5 mm at this resolution. Cage row y 7.4 to
    17.4; vent openings 2.2 mm square at y 2.5, four per port on 3.67, starting at the
    tooth crest; numeral strip y 18.8 to 23.4 with each numeral 3.85 mm right of its
    cage centre and a lamp 4.85 mm either side of the numeral; board name at x 26.7; PWR
    lamp at (31.5, 10.0) and ALM at (31.5, 15.1); ejector blocks 18.1 wide from y 9.9 to
    23.3 with lever arms y 19.4 to 23.3.
  angled-panel: >-
    estimated - the sixteen cages stand on a sawtooth, one tooth per port on the 19.9 mm
    pitch. WHICH WAY: every cage faces RIGHT, toward the higher port numbers. Figure 39
    draws each cage with its left flank showing (a doubled edge 1.6 mm wide on the left of
    cages 02 to 16, none on the right); Figure 42 (p61), a straight-on photograph of ports
    11 to 13 with the card upright, shows the EMI fingers of each cage's lower-numbered
    flank and a plain grey face running from the cage's other side to the next step; the
    3D view (Figure 40) and the data sheet photograph show the same stagger. So each tooth
    is a short return on its left, facing left, and a long face on its right, facing
    right, with the cage at the crest end of the face. THE ANGLE is not dimensioned. Method:
    Figure 39 draws each cage outline 12.8-12.9 mm wide where an SFP cage is 13.7-14.0,
    which is 20 to 24 degrees of foreshortening; 22 is carried. The return then has to
    close the same crest: a 18.58 mm face at 22 degrees rises 7.5 mm, and Figure 39 and
    Figure 42 show about 1.3 mm of return, so it is 80 degrees over 1.32 mm. DEPTH: the
    teeth stand in a window between the top rail and the numeral strip; the photograph
    shows the strip and rail in front of the cages with the light pipes running forward
    to the strip, so the window is a pocket 10.51 mm deep with the crests 3 mm below the
    plate. That 3 mm is read by eye and is the softest number here. The std/sfp@1 opening
    draws 13.4 mm wide on the face.
  first-cage: >-
    drawing - the left end plate's edge at x 48.2 stands in front of the start of the
    first tooth: Figure 39 draws cage 01 from that edge (10.9 mm showing against 12.9 for
    the others, and three vent openings against four) and the photograph shows the AAPA
    label ending just short of it. The tooth is whole underneath; port-1 is composed
    `behind: true` and shows through an opening in the plate art from x 48.2, so the
    plate covers its left 2.4 mm as it does on the card. In 3D the plate edge is painted
    on the tooth rather than built in front of it.
  ports: >-
    datasheet - Unit Data Sheet Guide section 8.5 (p59): 16 cages "marked 01 until 16";
    the manual's Table 4 (p38) gives cage label 01 until 16, cage type SFP-DD, ports 1 to
    16, and its section 2.1.4.2 (p30) lists SFP, SFP+, SFP-DD and SFP28 OLT modules.
    Figure 39 prints 02 to 14 left to right under the cages and the data sheet photograph
    prints 01 to 16 the same way, so numbering runs left to right with the board name at
    the left. The library has no std/ SFP-DD cage, so each port composes std/sfp@1, the
    SFP opening an SFP-DD cage presents, and says media sfp-dd; the cages stand apart on
    19.9 mm, each on its own tooth, so they are single cages, not a ganged block. Speed
    is 25g on the even ports and 10g on the odd.
  lamps: >-
    datasheet - Unit Data Sheet Guide section 8.6.2, Figures 41-42 and Tables 18-19
    (p60-62): PWR off / blinking green (initialisation) / on green; ALM red = alarm; two
    PON lamps per port "worked in into the side of the optical socket", the left one in
    use with a single-channel optic (GPON, XGS-PON or 25G PON status) and showing the
    GPON channel of an MPM, the right one the XGS-PON channel of an MPM. Each: off /
    yellow (provisioned, no ONU ranged) / green (active) / red (transmitter failed or no
    communication with the module). The guide calls them top and bottom for the card
    standing upright and left and right for it lying flat, which is how they are named
    here. The yellow is drawn #f2c200; Nokia gives no shade. SHAPE: they are rectangular
    light-pipe windows set in notches in the upper edge of the numeral strip, one each
    side of the numeral. Figure 39 draws each 2.3 x 1.1 mm; Figure 42 (4.6 px/mm, the
    19.9 mm port pitch as its ruler) shows windows about 3.0 mm along the card by 1.8,
    4.6 mm either side of the numeral. common/led-rect-sm@1 (2.8 x 1.6, window 2.3 x 1.1)
    is that shape. The four dark squares above each cage are vent openings, not lamps.
    Figure 42 puts the numeral nearer the end of its cage than Figure 39 does; it is a
    photograph of a strip standing in front of recessed cages, so the orthographic
    figure and the render are followed.
  ejectors: >-
    drawing - Figure 39 and the render both draw the closed levers lying over the lower
    strip, the left one to x 70.8 and the right one from x 329. In a front view they
    cover the numerals 01, 15 and 16, the PON lamps of those three ports and the ALM
    legend under its lamp, which is why Figure 39 and the render print only 02 to 14 and
    PWR; the data sheet photograph, taken from above, shows all sixteen numerals, their
    lamps and ALM. The skin is the front view, so it prints 02 to 14 and PWR and leaves
    the four covered legends out; the numbering rule does not stop at 14, the lever does.
    Re-read after the sawtooth was modelled: the strip is flat and none of it moved, so
    the same legends and lamps are covered.
    The six covered lamps are composed `behind: true` so the plate covers them. The
    photograph shows bright metal levers; the render draws them white, which is what the
    skin follows.
  colour: >-
    drawing - sampled on the MF-8 data sheet render, LT 8 row: plate median (61, 66, 72)
    to (65, 70, 78), numeral strip (79, 85, 92), cage frame (165, 165, 165), levers (225,
    225, 225) with the right block shaded (173, 173, 173). A render, not a photograph;
    the data sheet photograph shows the same slate plate with white legends.
  labels: >-
    photo - the LWLT-C data sheet photograph shows a white label reading AAPA with a bar
    code between the lamps and the first cage, and two small white labels at the right
    end. Figure 39 draws the two right-hand labels where the skin has them and, where the
    photograph has the AAPA label, three warning triangles; the photographed unit wins,
    so the label is drawn and the triangles are not. All three are placeholders. The
    left label's box is estimated from the photograph's proportions.
  logo-zone: >-
    none - no mark is printed on this faceplate in the figure, the render or the
    photograph, so none is reserved.
  lifecycle: >-
    searched only the staged corpus - listed as current in the 26.9 manual's ordering
    table; no end-of-life notice was searched for on the web.
  gaps: >-
    (1) no std/sfp-dd cage exists, so the opening is the SFP one, and the export has no
    25GS-PON type, so the even ports export as XGS-PON; (2) the labels are placeholders;
    (3) the facet angles and the pocket depth are estimated from front views and one
    photograph, with no side elevation to fit; (4) the small hinge blocks and end lugs of
    the ejectors are drawn schematically; (5) ejector proudness is not stated anywhere.
