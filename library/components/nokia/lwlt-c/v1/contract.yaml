groups:
  sfp-dd:
    term: Port
    role: traffic
    index-origin: 1
    mixed: >-
      one row of identical SFP-DD cages that differ only in the fastest PON they run -
      25GS-PON on the even ports, XGS-PON (or an MPM's XGS channel) on the odd - so each
      port states its own media and speed
    description: >-
      the sixteen Multi-PON ports, SFP-DD cages marked 01 to 16 left to right; GPON,
      XGS-PON or MPM on every port, 25GS-PON on the even ports only (the odd ports carry
      speed 10g)
  pon-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      two rectangular PON light pipes per port in the strip under its cage, led-N-left and led-N-right
      either side of the numeral; left = the optic's channel (the GPON channel of an MPM),
      right = the XGS-PON channel of an MPM
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the board lamps PWR and ALM, at the left end beside the board name
parts:
  - {ref: common/led-indicator@1, id: led-pwr, group: status-leds, at: [29.5, 8.0], states: {lamp: ['off', {name: init, color: '#39b54a', behavior: blinking}, {name: 'on', color: '#39b54a'}]}}
  - {ref: common/led-indicator@1, id: led-alm, group: status-leds, at: [29.5, 13.1], states: {lamp: ['off', {name: alarm, color: '#d0021b'}]}}
  - {ref: std/sfp@1, id: port-1, group: sfp-dd, at: [45.8, 7.4], 'on': face-1, behind: true, attrs: {media: sfp-dd, speed: 10g, pon: xgs-pon}}
  - {ref: std/sfp@1, id: port-2, group: sfp-dd, at: [65.7, 7.4], 'on': face-2, attrs: {media: sfp-dd, speed: 25g, pon: 25gs-pon}}
