groups:
  sfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      the 16 SFP cages, SFP 1-16 (CSFP FE/GE, SFP FE/GE/2.5G or SFP+ 10G). Cage n presents
      ports 2n-1 and 2n with a CSFP and port 2n-1 alone with an SFP/SFP+; the two CSFP
      interfaces are not declared per cage because a component part cannot carry
      `interfaces:`. Port groups G1-G4 each take either SFP+ or any mix of CSFP and SFP.
  link-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      two link lamps per SFP cage, 1-32: with a CSFP one per link; with an SFP/SFP+ the first
      (upper) shows link status and the second (lower) the speed
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the board lamps PWR (A/S) and ALM
  qsfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-plus, speed: 40g}
    description: >-
      the two front crossLT QSFP cages (4 x 10G), cabled to a peer FELT-C in the adjacent slot
      with a customised Nokia DAC for LT redundancy
  qsfp-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: Q1 and Q2, one per QSFP cage, the four lanes combined
