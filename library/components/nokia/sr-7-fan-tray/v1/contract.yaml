name: sr-7-fan-tray
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  Nokia Enhanced Fan Tray of the 7750 SR-7 / 7450 ESS-7, the chassis's single hot-swappable
  cooling unit. It fills the large bay at the rear, right of the air filter faceplate, and
  exhausts the air drawn in through the right-side intake. Its rear face is plain sheet metal
  with two round honeycomb fan grilles at the right, a mounting hole either side of each, and
  three screw flanges along the top and three along the bottom holding four captive screws a
  side. The handles are on the tray's sides, not its face. It has no lamp: fan status shows on
  the CPM (Fan 1-3). It supersedes the High Flow Fan tray.
unplaced: >-
  seated by the SR-7 rear fan bay (fan); the coordinator wires it
size: {w: 363.2, h: 304.8, d: 203.2}
