format: 1
kind: module
name: sr-12-pem-3
version: 1.1.0
class: power
behaviour: fills
profile: networking
description: >-
  Nokia 175A dual-feed DC PEM-3 (3HE03663AA, "7750 SR-12 175 Amp DC PEM-3"), the power entry
  module of the 7750 SR-12 and 7450 ESS-12. Two sit one above the other in the horizontal PEM
  slots at the foot of the chassis rear, load sharing: one carries the whole system, two give
  1+1. Each takes two -40 to -72 VDC feeds. Drawn is its rear face as it sits: a slotted
  captive screw on each end flange, the -48V terminal well at the left and the RTN well at
  the right (each 2 x 2 studs, one two-hole lug per feed per row), the model legend and the
  I/O breaker switch, the pull handle with the PN/SN and CLEI labels behind it, the PWR
  PRESENT lamp, the DB-25 "AC Supply Status" connector for an AC rectifier shelf's status
  cable, and the shock and caution marks. The terminal-block safety cover of the installed
  unit is not drawn, as neither face-on figure draws it.
size: {w: 425.7, h: 51.6, d: 238.3}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: >-
  SR12 p104 Table 43: "Single PEM-3 dimensions (H x W x D) 2.03 x 16.76 x 9.38 in." Both
  face-on figures draw the plate about 44.5 tall at their width scale; the stated 51.6 is
  used and the drawn layout is stretched to it per axis (see provenance.layout).
