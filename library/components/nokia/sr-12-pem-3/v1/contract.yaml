provenance:
  sources: >-
    datasheet - 7450 ESS-12 and 7750 SR-12 Chassis Installation Guide 22.7,
    3HE18644AAAATQZZA03 (SR12): p70 Fig 11 / Table 12 (isometric, the named parts), p206
    Fig 62 / Table 83 (the face, face-on), p49 Fig 7 (the chassis rear, both PEMs face-on),
    p139 Figs 29-30 (the safety cover and the wiring), p91 Table 27 (electrical), p104
    Table 43 (dimensions, weight), p72 Table 14 (the status cable). No photograph of the
    rear is staged.
  size: >-
    datasheet - SR12 p104 Table 43, 2.03 x 16.76 x 9.38 in (5.16 x 42.57 x 23.83 cm), read H x
    W x D. The chassis rear figure draws it 424.4 wide (p49 at 6.463 px/mm), agreeing with
    the 425.7.
  size-figure-height: >-
    CONFLICT - both face-on figures draw the plate about 44.5 tall, not 51.6. Fig 62 at 1200
    dpi: 6840 px wide, 712 px tall, aspect 9.61 against the stated 8.25; the chassis rear
    (p49) at its own scale: 424.4 x 44.6. An earlier reading put the drawn height at
    about 49; both figures measure 44.3-44.6. The stated height is used, and it fits the
    slot pitch (pem-1 at y 498.6, pem-2 at 551.2).
  layout: >-
    drawing - SR12 p206 Fig 62 at 1200 dpi (vector: pdfimages -list finds no raster on
    pp206-209), per axis: x = (px - 106) / 16.068 (the 6840 px outline over 425.7), y = the
    fraction of the 712 px plate height times 51.6. Round and square features keep their
    true (x-scale) size and are placed by fraction; so the studs are 18.0 apart across and
    21.5 down, where the figure draws 18.0 and 18.5. Flanges x 0-16.2 and 409.4-425.7, y
    2.4-46.6; flange screws (8.5, 25.8) and (417.2, 25.8), 8.9 across; terminal wells
    63.2-117.2 and 300.0-354.0 x 3.4-48.4; studs at x 81.2 / 99.2 and 318.0 / 336.0, y 17.8
    / 39.3; the four Phillips screws round each well at x 46.9 / 128.0 and 291.6 / 363.1;
    switch 137.7-169.8 x 24.3-47.3; handle bosses (180.0, 14.1) and (256.7, 14.1), 17.2
    across, grip 173.0-263.8; lamp (202.7, 36.4); DB-25 centre (245.9, 43.5); triangles
    270.0-278.9. The rear figure p49 draws the same face with the lugs and cables fitted
    and agrees to a millimetre across.
  terminals: >-
    datasheet - SR12 p70 Table 12: key 1 "Dual Power cable (VDC)", key 2 "Dual Return cable
    (RTN)". The -48V well is at the LEFT and RTN at the RIGHT on both Fig 62 and the rear
    view. Each well carries 2 x 2 studs; the rear view and p139 Fig 30 draw one two-hole lug
    across each ROW, so the upper row is one feed and the lower row the other. Which row is
    feed A is not stated: `feed-a` is placed on the upper row by assumption. Studs 1/4 in
    (0.250-20 UNC lugs, SR12 15.1 guide section 5; KEPS nuts), torque 40 lbf-in as printed.
  safety-cover: >-
    datasheet - SR12 p69 DANGER and p139 Fig 29: a channel-section cover screws over each
    terminal block in service, and the I/O switch stays reachable with it on (Table 12 key
    4). Neither Fig 62 nor the rear view draws it, so it is not drawn. A gap.
  switch: 'datasheet - SR12 p70 Table 12 key 4 "I / O (on/off) switch"; p91: the internal breaker is 175 A, printed "175" on the rocker in Fig 62'
  status-connector: >-
    datasheet + registry - SR12 p70 Table 12 key 5: "DB-25 connector (provides status if you
    are using AC power with Eltek Valere AC/DC rectifier equipment)"; p72 Table 14 names
    status cable 3HE04173AA to it. Fig 62 draws two rows (13 over 12) in a shell 39.6 x 12.3
    whose standoffs are 47.1 apart, the B shell (TE 114-40010 Rev G Fig 3: 47.04). Composed
    as std/db25@1, female per SR12 p259 section 13.1.3 ("female DB-25 connectors on the DC
    PEM-3s"), centred where Fig 62 draws it, (245.9, 43.45); the two standoffs at
    (222.35, 43.45) and (269.45, 43.45) stay in the skin as decor.
  lamp: >-
    datasheet - SR12 p206 Table 83, PWR PRESENT: lit = power applied and present in all
    terminal lugs; unlit = none. No colour is given; the family green #39b54a is used,
    estimated.
  power: >-
    datasheet - SR12 p91 Table 27: 6480 W at -40 to -72 VDC (162 A); 8050 W at -46 to -72
    (175 A); 8575 W at -49 to -55; 8837.5 W at -50.5 to -72. The widest range, 6480, is
    carried; the ladder stays here. p77: one PEM-3 carries the full system, two are 1+1.
  ac-sites: >-
    datasheet - SR12 pp70-72: AC sites feed each PEM-3 from its own unsplit rectifier shelf
    (OmniOn L20 3HE20675AA with four CP2725AC54TE, or Eltek HM1J 3HE04172AA with four 2500 W
    rectifiers); the Eltek status cable lands on this DB-25. Footnote 4: the OmniOn status
    cable is not used with the SR-12. The shelves are separate devices.
  weight: 'datasheet - 11.1 lb (5.06 kg), SR12 p104 Table 43'
  depth: 'datasheet - 9.38 in (238.3), SR12 p104 Table 43'
  handle: 'drawing - Fig 11 and Fig 62 draw a pull handle on two round bosses at the top centre; the PN/SN label runs under it'
  colour: >-
    estimated - no photograph of the rear is staged. Drawn as bare zinc-plated sheet metal
    with black print, as the line art leaves it; a gap.
  logo-zone: 'reserved on the plain metal right of the caution triangle; the figures print no mark'
  lifecycle: 'searched only the staged corpus; still listed in the 22.7 guide'
