format: 1
kind: module
name: m12-1gb-xp-sfp
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia (Alcatel-Lucent) 7750 SR / 7450 ESS 12-port GE SFP MDA-XP, M12-1GB-XP-SFP (3HE07285AA;
  3HE07284AA), a classic half-slot MDA for the IOM3-XP drawn in the guide's later style: twelve SFP
  cages in two ganged rows of six, odd ports 1-11 across the top and even ports 2-12 across the
  bottom, the Stat and Pwr lamps at the upper left, a printed Lnk/Act grid with one lamp pair per
  port at the right, an ESD mark at the upper right, a Phillips captive screw at the centre of each
  end and an ejector lever block in each lower corner. Authored horizontal; an SR-12 IOM3-XP
  seats it on end with the carrier.
size: {w: 190.5, h: 35.4, d: 177.8}
size-confidence: {w: datasheet, h: drawing, d: datasheet}
size-notes: >-
  The chassis guides give MDAs 1.4 x 7.5 x 7.0 in (3.56 x 19.05 x 17.78 cm, SR7 p106 Table 47).
  Held at 190.5 x 35.4 so it seats in the IOM3-XP's MDA bays on the 35.4 slot pitch; Figure 7 is
  fitted per axis to that face, lever blocks included.
attrs:
  model: M12-1GB-XP-SFP
  part-number: 3HE07285AA
  part-number-variants: 3HE07285AA, 3HE07284AA (printed in parentheses beside it, unexplained)
  sfp: 12
  power-draw-max-w: 30
provenance:
  sources: >-
    datasheet - 7x50 MDA-XP Installation Guide 9302180206 (MXP): p34 Figure 7 and p34-35 Table 7
    (the face, its lamps and screws; the table is misprinted with the title "M2-10GB-XP-XFP MDA-XP
    Features" but its keys are this card's), p18 Table 2 (power), p19 Table 3 (optics power), p9
    (the model list, "12-pt 1GE SFP MDA-XP"). SR7 22.7 3HE18643AAAATQZZA03 p106 Table 47 (MDA
    size). SR7 15.1 3HE14151AAAATQZZA02 p98 Table 32 (part number, "7750 SR 12-port GigE - SFP
    MDA-XP", 3HE07285AA with 3HE07284AA in parentheses; the 22.7 edition no longer lists it).
  size: 'datasheet - SR7 p106 Table 47; see size-notes'
  layout: >-
    drawing - MXP p34 Figure 7 (art al_0104), vector (pdfimages finds no raster), rendered at 1200
    dpi. Fitted per axis: 4314 px across the plate to 190.5 (22.65 px/mm) and 795 px from the top
    line to the bottom of the lever blocks to 35.4 (22.46 px/mm), 0.8 percent apart. THE OUTLINE IS
    NOT THE MDA00xx ONE. The later (al_) figures draw no notches: the plate is full width, each lower
    corner carries an ejector lever block (x 0-31.84 and 158.62-190.5, from y 27.92) that runs to
    the bottom edge, and the plate between the blocks stops at y 33.26 - the reverse of the older
    MDA0077 drawing of nokia/m10-1gb-xp-sfp@1, whose end wings stop at y 28.25 and whose centre band
    runs to the bottom. Modelled as drawn. Stat (10.51, 4.75) and Pwr (10.51, 9.95), drawn 2.9
    across with their legends to the left. Captive screws (key 6) centred (6.76, 22.0) and
    (184.14, 22.0), rings 10.5 across, Phillips heads; Figures 6 and 10 put them at the same two
    points, so the 0.4 mm asymmetry is the artwork's. ESD mark 8.2 x 7.3 at the upper right, centred
    x 184.84. Lnk/Act grid 118.21-166.9 x 8.84-18.68, two rows split at 13.89, a filled header cell
    118.21-124.22 printed Lnk / Act, cells split at 131.3, 138.5, 145.65, 152.84 and 159.95, the
    title "SFP Ports" above it; port numerals odd in the top row and even in the bottom one. An
    unlabelled strip 12.94 x 2.09 at (154.07, 21.55) under the grid is drawn as an outline; no key
    names it. Port numerals: 1 left of the top block, 11 right of it, 4-12 under the bottom block
    over a bracket line with "SFP Ports".
  legends-under-levers: >-
    drawing - two legends are in the page's text layer and under the figure's lever art: the model
    legend M12-1GB-XP-SFP (Table 7 has no model-number key; x 155.05-175.74, baseline 31.41), of which only "M1"
    shows past the right lever block, and the port numeral 2 (x 21.42, baseline 29.69) under the
    left one. Both sit where the older MDA00xx art put its legends (M10-1GB-XP-SFP ends at x 174.3,
    baseline 32.6), which reads as ink carried over from that template and drawn over by the
    lever; ink a lever covers is not seen on the card, so neither is drawn, and no model-label
    element is declared. Where the real card prints its model name is a gap.
  cages: >-
    drawing + standard - each row is one bezel (13.91-103.55 x 0.9-12.87 and 14.56-26.89) around six
    drawn openings on a 14.51 pitch, rows centred at y 6.87 and 20.63. A shared bezel is a ganged
    cage, so each port is std/sfp-ganged@1 at the SFF-8433 pitch of 14.25, centred on the drawn
    block (x 58.70); the drawn pitch is 1.8 percent wider and the end cages sit 0.65 mm inside
    their drawn boxes. ORIENTATION IS NOT READ: the figure draws plain filled openings with no latch
    or tab and no photograph of this card is held, so the rows take the library's belly-to-belly
    default, upper 0 over lower 180 (L108).
  lamps: >-
    datasheet - MXP p34-35 Table 7: Status green blinking initializing, green up, amber
    operationally down, unlit administratively down; Power blue on, off no power (key 1 and 2). Lnk
    (key 4) green link established at 1000 Mb/s, amber slow blinking no SFP installed, amber optics
    installed and no link, unlit disabled; Act (key 5) green active, amber error condition, unlit
    no activity. No blink rates are given. The grid's lamps are drawn 1.6 across, composed as
    common/led-dot@1 (lamp 1.4) at the drawn centres x 128.37-164.31 on a 7.19 pitch, Lnk at y
    10.29 and Act 12.38 for the odd ports, 15.05 and 17.12 for the even ones.
  power: 'datasheet - MXP p18 Table 2: M12-1GB SFP MDA-XP 30 W maximum; SR7 15.1 p98 Table 32 gives 3HE07285AA 30 W worst case, agreeing. SFP optics 1 W each (MXP p19 Table 3), not included'
  colour: >-
    estimated - no photograph of an MDA-XP is held. Drawn in the charcoal of the SR-7/SR-12 card
    family; printing, including the ESD mark, in the family's white, since the figure is line art
    and states no colour. The grid's header cells are drawn filled in the legend white with the
    words in the plate colour, the inverse the figure's black-filled cells imply. A gap.
  logo-zone: 'reserved on the plain plate between the top cage row and the grid title; Figure 7 draws no mark'
  depth: 'datasheet - 7.0 in (17.78 cm), SR7 p106 Table 47'
  lifecycle: 'searched only the staged corpus - the MDA-XP guide and the 15.1 chassis guide list it; the 22.7 chassis guide does not'
  gaps: >-
    Colour is estimated. The cage orientation is the library default, not a reading. The mda-type
    CLI string is not printed for this card in anything held. The lever blocks carry no relief:
    no document gives their projection. The lever blocks sit where nokia/iom3-xp@1 puts its
    divider foot and its own ejector levers over an MDA bay's lower corners (the MDA00xx notches,
    15.5 wide below y 28.25), so seated in that carrier the IOM's furniture is drawn over them; the
    two figures disagree about what occupies those corners and nothing held settles it. The
    model legend's position is not known (provenance.legends-under-levers).
