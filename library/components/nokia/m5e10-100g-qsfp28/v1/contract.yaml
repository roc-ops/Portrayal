      source: >-
        edgecore/agr-psu-dc@1 latch - the library's one release-hardware figure, itself
        sourced for arrangement and not proudness
    - node: handle-right
      out: 4.2
      confidence: estimated
      source: >-
        edgecore/agr-psu-dc@1 latch - the library's one release-hardware figure, itself
        sourced for arrangement and not proudness
    - node: screw-left
      cyl: 1.6
      confidence: estimated
      source: >-
        edgecore/agr-panel-screw@1 - the library's one captive-screw-head figure, whose own
        provenance reads 'estimated - it stands proud but was not measured'
    - node: screw-right
      cyl: 1.6
      confidence: estimated
      source: >-
        edgecore/agr-panel-screw@1 - the library's one captive-screw-head figure, whose own
        provenance reads 'estimated - it stands proud but was not measured'
