format: 1
kind: module
name: m5e10-100g-qsfp28
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia 7750 SR MDA2-e-XP, 10-port 100G QSFP28 (3HE20978AA, CLI m5e10-100g-qsfp28), an
  FP4 media-dependent adapter with up to 800 Gb/s of line rate. Authored horizontal, as
  the guide draws it: a handle at each top corner and a captive screw on each lower end
  wing; Stat and Pwr at the left; ten QSFP28 cages in two belly-to-belly rows of five,
  odd connectors (c1-c9) on top and even (c2-c10) below, each with its Lnk/Act lamp to
  its right; the model label at the lower right.
size: {w: 193.0, h: 35.4, d: 193.0}
size-confidence: {w: drawing, h: datasheet, d: datasheet}
size-notes: >-
  The shared wave-1 MDA envelope (MDA-e, MDA-e-XP, MDA2-e-XP): w 193.0 measured on the figures
  (the datasheet's 7.6 in), h 35.4 the measured slot pitch (the datasheet's 1.4 in rounded),
  d 193.0 (7.6 in). The lower corners are notched: only x 16.1-176.9 runs the full height.
attrs:
  model: M5E10-100G-QSFP28
  part-number: 3HE20978AA
  cli-type: m5e10-100g-qsfp28
  qsfp28: 10
  weight-kg: 1.3
  power-draw-max-w: 185
  power-draw-typical-w: 155
provenance:
  size: >-
    datasheet - XP (3HE20985AAABTQZZA01, MDA-e-XP and MDA2-e-XP Installation Guide
    25.10) p51 Table 27: 1.4 x 7.6 x 7.6 in (3.6 x 19.3 x 19.3 cm) for every MDA2-e-XP.
    The face is held at the shared wave-1 MDA envelope, 193.0 x 35.4: w 193.0 as the
    figures measure it (the 7.6 in), h 35.4 the measured slot pitch (the 1.4 in rounded
    to 0.1 in), so stacked slots tile.
  size-figure-height: >-
    drawing - CONFLICT, recorded not followed. Figs 51-54 (pp103-108), rendered at 1200
    dpi (vector, no raster; `pdfimages -list` finds none on pp103-108), draw the plate
    4912 px wide (193.0 mm, 25.45 px/mm) but only 851 px from the plate top line to the
    bottom of the band: 33.4 mm, against 35.3 mm on the MDA-e-XP Fig 39 (p88, 4927 x 900
    px). The end wings measure the same in both (27.0 mm), so only the central band is
    drawn shorter. Table 27 gives the MDA2 the same 1.4 in as the MDA-e-XP, so the
    shared 35.4 is kept and every feature is placed isotropically from the plate top at
    25.45 px/mm; the bottom 2 mm of the band carries nothing. Whether the MDA2 plate
    really is 2 mm shorter is open (gap) - a photograph settles it.
  depth: >-
    datasheet - XP p51 Table 27: 7.6 in (19.3 cm) deep.
  weight: >-
    datasheet - XP p51 Table 27: 1.30 kg.
  power: >-
    datasheet - XP p53 Table 30 (the SR-1 guide p93 Table 35 prints the same): Idle 0 /
    25C 155 / 40C 180 / 55C 185 W. Carried as max = the 55C rung (100% line rate IMIX,
    the NEBS short-term maximum) and typical = the 25C rung (50% line rate IMIX). XP
    p52: these values do not include the power consumed by optical components.
  model: >-
    datasheet - XP Table 3 (p19): 3HE20978AA; the printed model label on Fig 54 (p108,
    art hw4681) and the CLI provisioning string m5e10-100g-qsfp28.
  layout: >-
    drawing - Fig 54 (p108) at 1200 dpi, 25.45 px/mm, origin at the plate's outer top-
    left. Cage outlines 20.86 x 11.32 (cage plus bezel) centred at x 32.08, 60.29,
    88.51, 116.75 (pitch 28.2) and 152.75 (a 36.0 step before the last pair); top row
    centred y 9.63, bottom row 22.93. Each cage's lamp is to its right, 2.44 across, at
    x 44.52 ... 165.44 and y 11.43 (top) / 22.43 (bottom), with the legend above the top
    lamp and below the bottom one. Stat (14.26, 7.29) above Pwr (14.26, 12.04). Model
    label right-aligned at 174.6, baseline 31.3. About 0.2 mm error.
  plate: >-
    drawing - the plate outline is the same on all four figures: full band x 16.1-176.9
    (measured 16.2-176.9), end wings 27.0 tall from the plate top with a rounded step
    (about 2 mm radius) into the band, as the family plate shape in the wave-1
    conventions gives it. The thin line at y 31.9 across the band is the lip the figures
    draw.
  ports: >-
    datasheet - XP p108 section 5.11 and Table 47: ten QSFP28 connectors (QSFP28 single
    lambda, QSFP+). Numbered as Fig 54 prints them: c1, c3 ... c9 on top, c2, c4 ... c10
    below, left to right. Composed as std/qsfp28@1, port attrs media qsfp28, speed 100g,
    card attr qsfp28: 10. Belly-to-belly: Fig 54 draws the bottom row turned over (the
    latch bar at the top of the upper cages and the bottom of the lower), so upper
    rotate 0 over lower 180 (L108).
  lamps: >-
    datasheet - XP p110 Table 49 (single-port MDA2-e-XP connectors) and pp110-111 Table
    50 (multi-port). Pwr: blue solid = power on, unlit = no power. Stat: green solid =
    up, green blinking = initialising, amber solid = operationally down / admin up,
    unlit = admin down. One Lnk/Act lamp per connector, labelled c1..: green solid =
    link, green blinking = active, amber slow blink = admin up with no optic, amber fast
    blink = loopback, amber solid = optic but no link, amber one blink per errored
    frame, unlit = disabled. The guide gives no blink rates, so the slow/fast pair is
    carried as two named blinking states at the default rate (gap), and the Table 50
    break-out blink sequence (2.75 s amber, then 0.75 s green/amber per sub-port) is not
    modelled as a state.
  handles: >-
    drawing - Figs 51-54 keys 6/7 (Handles, 'used for insertion and extraction of the
    MDA'): a tab at each top corner, measured 19.6-19.9 x 4.7-4.8 mm at x 1.0 and 172.4,
    y 0.9. The conventions give 19.6 x 4.7 (XP p89 Table 38 key 7), used. Under each
    handle the figure draws a U-shaped recess (x 1.2-9.6 / 183.4-191.8, y 5.6-15.6),
    drawn as decor.
  thumbscrews: >-
    drawing - Figs 51-54 (captive screws): head 10.37 mm across, centres 8.33 mm from
    the left end and 7.50 mm from the right (185.50), 20.97 mm below the plate top, the
    same on all four figures. The family figure is about 7.8 / 20.8 / 10.3; the measured
    values are used.
  relief: >-
    estimated - the two insertion/extraction handles stand proud at out 4.2 and the
    captive screw heads at cyl 1.6. No document gives either; these are the library's
    pooled release-hardware (edgecore/agr-psu-dc@1 latch) and captive-screw
    (edgecore/agr-panel-screw@1) estimates.
  colour: >-
    estimated - no photograph is staged. Charcoal faceplate, light silkscreen, dark
    handles, a yellow ESD mark at the top right (the family appearance recorded in the
    wave-1 conventions from PUBLIC-SOURCES; DS 214928 is the MDA2-e-XP datasheet cut-out
    to check against). The figure draws the ESD mark as a triangle at x 176.1-182.1, y
    5.9-8.5. No vendor mark is drawn on any of the four figures, so no logo-zone is
    reserved (gap: the datasheet photo may show one).
  compatibility: >-
    datasheet - XP p9, pp21-22, SR-1 guide p46: MDA2-e-XPs need an FP4 IOM5-e with the
    1.5 Tb/s FD licence. They seat in the SR-1 (FP4) MDA slots only on the 1.5 Tb/s
    chassis revisions (3HE12298xxRD and higher, 3HE12299xxRB and higher) and in an
    IOM5-e 1.5T; XP p22 note: not supported in the SR-7 or SR-12.
  lifecycle: >-
    searched only the staged corpus - current in the 25.10 guide; no end-of-life notice
    was searched for.
