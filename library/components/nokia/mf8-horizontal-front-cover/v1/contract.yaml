description: >-
  The horizontal front dust filter assembly of the Nokia Lightspan MF-8: the perforated front
  cover that hangs on the cover hook of the shelf's left flange and locks, by two quarter-turn
  D-ring screws, onto the cable tray fixed to the shelf's right side. It carries the full-size
  front dust filter (3FE 77351 CA) clamped behind it. It is not orderable on its own: it comes
  in the horizontal mounting and front cover kits (3TJ 00014 AA for a 19 in. rack, 3TJ 00007 AA
  for 21 in., 3TJ 00116 AA for 23 in.). It is 507.6 mm wide, wider than the shelf's 481 mm rack
  face, and overhangs the right flange to cover the cable tray. A different part from the
  vertical front dust filter assembly 3TJ 00003 AA (355 x 542), which fits only a vertically
  mounted shelf.
size: {w: 507.6, h: 355.0, d: 36.0}
