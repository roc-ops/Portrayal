size-notes: >-
  IOM5-e guide p16 Table 6 gives 1.4 x 16.75 x 17 in. The face is held at 425.4 x 35.4 so the
  SR-7/SR-12 slots tile on the family's 35.4 pitch; Figure 1 and SR12 p66 Figure 10 measure
  425.45 x 35.4.
