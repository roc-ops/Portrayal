behaviour: fills
profile: networking
description: >-
  Nokia 7750 SR IOM5-e (3HE12332AA/BA/CA, 3HE13727AA/BA/CA 400G, 3HE15182AA/BA/CA 800G - nine
  licence and rate variants, one face), the FP4 input/output module for the SR-7 and SR-12 card
  slots, which needs the -B chassis with SFM6-7/12 and CPM5. A full-length carrier holding two
  MDA-e-XP slots, slot 1 at the left: a captive screw and an ejector lever at each end, and
  between the two MDA plates, in their notched lower corners, a tab printed IOM5-e with the Stat
  lamp. Stat: blue on but not yet through diagnostics, green blinking booted but not
  provisioned, green booted, amber fault. Authored horizontal; the SR-12 seats it at rotate 90,
  MDA slot 1 at the top. The accepts list is the SR-7/SR-12 one: the 12-port QSFP28 and 6-port
  QSFP-DD MDA-e-XP and the MDA2-e-XP cards seat in an IOM5-e only in the SR-12e, which is not
  this list. Limits accepts cannot express, on the SR-7/SR-12 - at most two 3-port CFP2-DCO
  MDA-e-XP per IOM5-e, the CFP2-DCO optic only in the middle port c2, and the system derated to
  40C with it; the QSFP-DD 400G ZR / ZR+ optics also derate to 40C, and with ZR+ port c3 stays
  empty; on the SR-7/SR-12 even the 1.5 Tb/s variants give at most 800 Gb/s full duplex.
size: {w: 425.4, h: 35.4, d: 431.8}
