format: 1
kind: module
name: fnio-d
version: 1.2.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia FNIO-D (3FE 74928 AA), the 400G (4 x 100G/40G/4x10G) NT I/O applique of the 7360
  ISAM FX, with SyncE. Seats in the NTIO slot between the two NT boards and gives the
  shelf four QSFP28/QSFP+ uplinks. Authored upright, as the Unit Data Sheet guides draw
  it: ejector and thumbscrew at each end, a 2 x 9 lamp block (ALM, PWR and sixteen lane
  lamps, four per port) under the top ejector, two small marks, then four QSFP cages on a
  sawtooth faceplate that angles each cage 45 degrees for fibre bend radius, and two
  hazard marks beside the bottom lever. Not in any Lightspan FX guide.
size: {w: 25.0, h: 405.0, d: 205.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: >-
  w is the board-to-board PITCH (25 mm), not the faceplate: the same UDS section states
  the width as 26 mm, which is wider than the pitch and so is taken to be the widest
  point (the ejector or the sawtooth), not the plate between neighbours. Held at 25.0 so
  the NTIO bay built from the shared family convention seats it. d is the first of the
  two depths the UDS gives (205 / 225 mm); which one applies to which shelf is not stated.
attrs:
  model: FNIO-D
  qsfp28: 4
  part-number: 3FE 74928 AA
  weight-kg: 1.2
  power-draw-max-w: 104
  power-draw-typical-w: 83.5
provenance:
  size: >-
    datasheet - 7360 ANSI Unit Data Sheet guide R6.9 3FE77013AAAATQZZA16 p294 and ETSI UDS
    3FE77012AAAATQZZA18 section 42.5.1 (p406): height 405 mm, width 26 mm, depth 205 mm /
    225 mm, board-to-board pitch 25 mm. Face held at the 25 mm pitch by the shared 7360 FX
    convention; the 26 mm width is recorded in size-notes and gaps.
  size-width: >-
    datasheet - slot pitch 25 mm, UDS section 42.5.1; the faceplate edge-to-edge width
    is stated only as 26 mm overall, which exceeds the pitch, so the plate width itself is
    not stated and is taken as the pitch.
  depth: >-
    datasheet - 205 mm / 225 mm, section 42.5.1; 205 carried. Neither figure is tied to a
    shelf in the text.
  weight: 'datasheet - 1.2 kg, ETSI UDS A18 section 42.5.2 (p407); ANSI R6.9 p295 agrees'
  power: >-
    datasheet - ETSI Safety Manual 3HH11998AAAATCZZA29 p26, Table 2 "Power consumption
    per component for 7360 ISAM FX": FNIO-D 83.5 W typical, 104 W maximum. The manual does
    not say whether the QSFP modules are inside the NTIO figure (it says so only for PON
    line cards, which include their optics, and NT cards, which exclude NTIO and SFPs), so
    that scope is open (gap).
  layout: >-
    drawing (fractions only) - ETSI UDS A18 p406 Figure 183 / ANSI R6.9 p294 Figure 128,
    the same 3D side-and-front board view, taken from the embedded 1425 x 1576 image at
    300 ppi. No orthographic front exists in any guide. This view is close to frontal.
    Positions along the card are fractions of 405 mm between the top of the top ejector
    and the bottom of the bottom ejector (image y 63 to 1498, 0.282 mm/px). Top lever tip
    31.6; lamp rows 37.3 to 78.0 on a 5.09 pitch; two small dark marks at 115 and 164;
    four teeth 174.1 to 317.8, cage openings (the drawn connector on each upper face)
    centred at 189.1, 225.2, 261.1, 297.2 - a 36.0 pitch; hazard marks at 326.5 and 340.6;
    the bottom lever is drawn OPEN in the figure and is modelled closed, its hook at 323.7.
    Across the card the cages are centred and the lamp columns spaced 6.6 mm from the
    column/row pitch ratio 1.31 of the flat LED close-up (Figure 184). About 1 mm error.
  ports: >-
    datasheet - UDS section 42.4.2.1: four uplink ports, each for a 100G, 40G or 4x10G
    QSFP28/QSFP+ module, placed under a 45 degree angle for fibre bend radius. Composed as
    std/qsfp28@1 at its registry aperture, rotate 90: in Figure 183 at 4x each cage
    opening's long side runs down its facet, ALONG the card, so the 20 mm side of the
    aperture lies along the 405 mm and the 10.15 mm side across it (the cages open up
    and down the card, not left and right). Each cage sits `on` its tooth's face facet,
    so the drawing foreshortens it to 20 x cos 45 = 14.14 mm along the card; the centres
    stay at 189.1, 225.2, 261.1 and 297.2, and `at` is each centre less 10.15/2 x cos 45,
    the projected half of the unrotated height, at the true size 20 x 10.15 (L9). Latch
    direction is not resolved; rotate 90 is the library's
    vertical-card convention, not a reading. Numbered 1-4 top to bottom, which is ASSUMED
    from the lamp block's PORT1-PORT4 brackets reading top to bottom; each cage has a
    small printed strip beside it in Figure 183 that the 300 ppi image cannot resolve
    (gap).
  lamps: >-
    datasheet - Figure 184 (ETSI p407, embedded 1425 x 657 at 300 ppi; identical as ANSI
    Figure 129 p295) and Table 126. Rows: ALM | PWR, then 2 | 1, 4 | 3 ... 16 | 15 - EVEN
    on the LEFT, ODD on the RIGHT, the reverse of the FNIO-A, transcribed as printed.
    Brackets PORT1 (lamps 1-4), PORT2 (5-8), PORT3 (9-12), PORT4 (13-16) on the right:
    four lane lamps per QSFP, for 4x10G breakout. Table 126: PWR on = power on; ALM red =
    alarm; QSFP lamp off = no link, green = link up, blinking = traffic. PWR colour and the
    blinking colour are not stated; drawn with the family green.
  marks: >-
    drawing - two small dark rectangles on the plate between the lamps and the cages, at
    115 and 164 mm, about 4.5 x 5 mm; at 300 ppi they hold unreadable glyphs. Drawn as
    dark blocks and not named as anything (gap). The two hazard triangles near the bottom
    are likewise drawn as outlines; one appears to be a laser warning, neither is resolved.
  relief: >-
    estimated - the ejectors stand proud of the plate; no document gives a figure, so the
    library's pooled release-hardware estimate (4.2) is used. The sawtooth is eight facets
    (provenance.angled-panel), not an `out`: a facet is the sloped surface itself and the
    cages on it are cut into it.
  angled-panel: >-
    datasheet and drawing - UDS section 42.4.2.1 places each uplink 'under a 45 degree
    angle'. Figure 183 draws four teeth, each a long face carrying the cage (174.1-199.0,
    209.1-235.4, 245.3-271.8, 281.4-307.3) and a short return below it. Measured on the
    near-side edges of tooth 1 (image px; the oblique's depth axis runs 3 px down per 100
    across on the board's top edge, about 2.9 px/mm over the 205 mm depth): the apex
    stands 28.5 px = 9.8 mm out; the face edge meets the plate at image y 737.5 and
    rises 32.5 px to the apex, 9.2 mm front-view, so about 47 degrees; the return falls
    36.7 px to the next valley, 10.6 mm, about 43 degrees. So the face is at 45 degrees,
    but its upper part is SUNK: the plate has an opening from the top of each long face
    (174.1) down to where the face plane crosses the plate (about 189.6), and the face's
    root sits about 15 mm behind the plate. A facet's `lift` cannot be negative, so the
    facets here keep the 45 degree face and put its root on the plate: face and return
    are both 45 degrees and 18.0 mm front-view on a 36.0 pitch (179.7 to 323.7, the last
    return landing on the bottom ejector's hook), so the apex stands 18.0 mm out where
    the drawing's stands about 10, and the returns are 18.0 mm where it draws about 10.6.
    18.0 is what the cage needs: the projected cage is 14.14 mm, leaving 1.4 to 2.4 mm
    of face either side (2.0 mm along the slope below it). A 45/45 tooth is square, so a
    cage's depth runs parallel to the return and stays inside it however deep it goes.
  gaps: >-
    Each face's root is sunk about 15 mm into the plate in Figure 183; modelled on the
    plate, so the teeth stand about 8 mm prouder than drawn and the returns are longer.
    Faceplate edge-to-edge width (26 mm stated overall, held at the 25 mm pitch).
    Whether the QSFP modules are inside the 104 W figure. The printed strip beside each
    cage and the two marks and hazard icons (unresolved at 300 ppi). Cage latch
    direction.
  logo-zone: >-
    reserved by the family convention; Figure 183 draws no mark there, so the zone sits
    on the empty metal between the lamp block and the first mark.
  lifecycle: >-
    searched only the staged corpus - listed as current in ANSI R6.9 and ETSI A18; no
    end-of-life notice was searched for on the web.
