format: 1
kind: module
name: m5e8-100g-sfp112-2-800g-qdd
version: 1.1.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia 7750 SR MDA2-e-XP, 8-port 100G SFP112 + 2-port 800G QDD (3HE20979AA, CLI
  m5e8-100g-sfp112+2-800g-qdd), an FP4 media-dependent adapter with up to 800 Gb/s of
  line rate. Authored horizontal, as the guide draws it: a handle at each top corner and
  a captive screw on each lower end wing; Stat and Pwr at the left; eight SFP112 ports
  in two ganged 1x4 blocks (c1-c8) and two QSFP-DD800 cages (c9, c10) in one row, a
  Lnk/Act lamp above each; the model label at the lower right.
size: {w: 193.0, h: 35.4, d: 193.0}
size-confidence: {w: drawing, h: datasheet, d: datasheet}
size-notes: >-
  The shared wave-1 MDA envelope (MDA-e, MDA-e-XP, MDA2-e-XP): w 193.0 measured on the figures
  (the datasheet's 7.6 in), h 35.4 the measured slot pitch (the datasheet's 1.4 in rounded),
  d 193.0 (7.6 in). The lower corners are notched: only x 16.1-176.9 runs the full height.
