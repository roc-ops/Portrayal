<svg xmlns="http://www.w3.org/2000/svg" width="25mm" height="405mm" viewBox="0 0 25 405">
  <!-- Nokia 3FE 65651 BA, the LT/NTIO-slot dummy front panel, 25 x 405, authored upright.
       From ETSI UDS 3FE77012AAAATQZZA18 Figure 37 (p133), an oblique drawing: positions
       along the panel are fractions of 405; across it, fractions of the plate's 72 px. -->
  <rect id="face" x="0" y="0" width="25" height="405" rx="0.5" fill="#c9ccd0" stroke="#9ba0a6" stroke-width="0.3"/>
  <g id="screw-top">
    <circle cx="17.4" cy="4.5" r="4.4" fill="#b3b7bc" stroke="#8d9298" stroke-width="0.25"/>
    <circle cx="17.4" cy="4.5" r="3.8" fill="#2e3236" stroke="#15171a" stroke-width="0.3"/>
    <circle cx="17.4" cy="4.5" r="1.9" fill="#6f757b" stroke="#15171a" stroke-width="0.2"/>
    <path d="M 16.4 4.5 H 18.4 M 17.4 3.5 V 5.5" stroke="#15171a" stroke-width="0.35"/>
  </g>
  <g id="screw-bottom">
    <circle cx="17.4" cy="397.5" r="4.4" fill="#b3b7bc" stroke="#8d9298" stroke-width="0.25"/>
    <circle cx="17.4" cy="397.5" r="3.8" fill="#2e3236" stroke="#15171a" stroke-width="0.3"/>
    <circle cx="17.4" cy="397.5" r="1.9" fill="#6f757b" stroke="#15171a" stroke-width="0.2"/>
    <path d="M 16.4 397.5 H 18.4 M 17.4 396.5 V 398.5" stroke="#15171a" stroke-width="0.35"/>
  </g>
  <g id="esd-mark">
    <circle cx="12.8" cy="14.7" r="2.4" fill="none" stroke="#1d2023" stroke-width="0.3"/>
    <path d="M 12.8 13.0 L 14.3 15.7 L 11.3 15.7 Z" fill="#1d2023"/>
  </g>
  <g id="part-label">
    <rect x="7.8" y="354.7" width="10.0" height="19.3" fill="#f2f2f2" stroke="#6f757b" stroke-width="0.2"/>
    <rect x="13.6" y="356.4" width="1.6" height="15.9" fill="#9ea3a9"/>
    <rect x="10.4" y="356.4" width="1.6" height="15.9" fill="#9ea3a9"/>
  </g>
  <rect id="logo-zone" x="4.0" y="190.0" width="17.0" height="12.0" fill="none"/>
</svg>
