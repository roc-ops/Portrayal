format: 1
kind: module
name: iom4-e-hs
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia 7750 SR / 7450 ESS IOM4-e-HS (3HE11351AA L3HQ, 3HE11351CA L2HQ), the high-scale-QoS
  FP3 200 Gb/s input/output module for the SR-7 and SR-12 card slots. The IOM4-e face: a
  full-length carrier holding two MDA-e slots, slot 1 at the left, a captive screw and an
  ejector lever at each end, and between the two MDA plates, in their notched lower corners, a
  tab printed IOM4-e-HS with the Stat lamp. Stat: purple on but not yet through diagnostics,
  green blinking diagnostics passed, green booted. A separate component from nokia/iom4-e
  only because its MDA slots do NOT take the MS-ISA2 / MS-ISA2-E (IOM4-e guide p14 Table 4
  note 1). Authored horizontal; the SR-12 seats it at rotate 90, MDA slot 1 at the top.
size: {w: 425.4, h: 35.4, d: 431.8}
size-confidence: {w: drawing, h: drawing, d: datasheet}
size-notes: >-
  IOM4-e guide p15 Table 6 gives 1.4 x 16.75 x 17 in for all variants. The face is held at
  425.4 x 35.4 so the SR-7/SR-12 slots tile on the family's 35.4 pitch; Figure 12 is the
  Figure 10 art, 425.45 x 35.4.
