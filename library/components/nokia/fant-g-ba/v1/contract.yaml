format: 1
kind: module
name: fant-g-ba
version: 1.0.0
class: supervisor
behaviour: fills
profile: networking
unplaced: "seated by the NT bays of the 7360 ISAM FX shelves; the coordinator wires it"
description: >-
  Nokia FANT-G BA (3FE71256BA), the ANSI build of the 7360 ISAM FX / Lightspan FX network termination card with the 1.2 Tbps switch. Four SFP+ cages and one 100GE CFP4 cage, 1PPS and 10 MHz SMA timing inputs, the cages and SMAs set on a sawtooth housing whose 45 degree teeth tip the ports up, a micro-USB debug port, a 10/100/1000BASE-T port, the craft port and the ToD/1PPS port, all RJ45, and the ALM/PWR/A/S and X1-X5 lamps. No ACO switch and no BITS jacks on the face. The CFP4 cage is drawn, not composed: the library has no CFP4 cage yet (see gaps).
size: {w: 30.0, h: 405.0, d: 225.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: 'w is the NT slot pitch (30 mm), taken as the faceplate width; d is the larger of the two depths the UDS gives (205/225)'
attrs:
  model: FANT-G BA
  part-number: 3FE71256BA
  variant: BA
  standard: ANSI
  switch-capacity: '1.2 Tbps'
  weight-kg: 1.5
  sfp-plus: 4
  power-draw-max-w: 150
  power-draw-typical-w: 120
  power-scope: 'scope NOT stated by the ANSI manual (its note (1) is attached to FANT-F only); the ETSI manual says every NT figure excludes the NTIO card and SFP power, and gives the same 120 / 150 W for the FANT-G'
provenance:
  variants: 'drawing - ONE COMPONENT FOR ONE FACE. The BA is the only ANSI FANT-G (Lightspan UDS 3HH90279AAAATQZZA23 p204 Table 71; standalone UDS 3FE71256BAAATQZZA01-A03). Its figure (3FE71256BAAATQZZA03 p9 Figure 3, vector; the Lightspan p205 Figure 83 is its 150 ppi raster) differs from the AA/AB one (nokia/fant-g-aa): no ACO switch, lamp or legend, no BITS pair (blank plate between the micro-USB and the Base-T jack), and the port lamps legended X1-X5 instead of FSM1-FSM5. Everything the two faces share was measured on both drawings and agrees within 1 mm (the four SFP+ ridges 0.5-1.0 mm, the CFP4 root / ridge / foot 0.7 / 0.1 / 0.2, the SMA foot 0.1, the Base-T frame 324.4-342.3 against 325.1-342.1, the micro-USB centre 281.3 on both), so the BA carries the AA geometry, which comes off the sharper drawing'
  size: 'datasheet - Lightspan UDS 3HH90279AAAATQZZA23 p206 (BA chapter, Dimensions) and 3FE71256BAAATQZZA03 p9 section 1.8.1: height 405 mm, width 30 mm, depth 205/225 mm, weight approximately 1.5 kg'
  size-width: 'datasheet - slot pitch, "width: 30 mm" in the UDS dimensions list; faceplate width not stated, taken as the pitch'
  depth: 'datasheet - the UDS gives "205/225 mm" without saying what each measures; 225 is carried as the card depth'
  power: 'datasheet - ANSI Safety Manual 3HH12894AAAATCZZA27 p25 Table 2, "FANT-G" 120 W typical / 150 W maximum, one row with no variant split and no footnote (the ANSI note (1) is attached to FANT-F only). Carried as power-draw-max-w 150 and power-draw-typical-w 120, with the scope recorded as not stated'
  gate-1: 'drawing - the only drawings of the face are 3D side-and-front views. The BA vector Figure 3 (3FE71256BAAATQZZA03 p9, pdfimages lists no raster there) rendered at 600 dpi: plate rows 1721-3885 on the right edge (5.343 px/mm along the card), 144 px across (4.8 px/mm, the face turned), the top edge rising 0.052 px per px to the right; depth axis off the card top edge 1.85 px right and 0.49 px down per mm toward the viewer. Its housing, lamps, micro-USB and jack frames were read there and checked against the AA drawing (see variants), whose 1200 dpi render gives the positions carried'
  layout: 'drawing - as nokia/fant-g-aa@1 (the AA drawing, see variants) less what the BA does not have. Along (mm): top lever 1.0-33.0, FANT-G legend 26.3, lamp rows 37.5 / 42.53 / 47.56 / 52.59 / 57.62 (the BA drawing reads 36.7 / 41.4 / 47.0 / 52.2 / 57.1 by eye at 5.3 px/mm), label 61.2-66.3, laser mark 62.2-68.2, housing 74.1-271.9, micro-USB 281.3, Base-T frame 325.06-342.14, craft 344.18-361.3, ToD/1PPS 363.4-380.1, ESD mark 384.1-391.8, lower lever 325.5-403.5. Across as the AA: port column x 13.55, housing 1.8-25.3, lamp columns 9.0 / 14.2, jack frames 6.2-21.0'
  angled-panel: 'drawing - read on the AA drawing (nokia/fant-g-aa@1), which the BA drawing agrees with within 1 mm (see variants). SAWTOOTH, one tooth per port group, each tooth a face tipped up (carrying the port) and a return closing it back to the plate. Read off the housing near-side outline in the 1200 dpi render: roots (outline at the plate, col ~200) and ridges (col ~258 for the SFP+ teeth, 261 for the CFP4, 271 for the SMA block). SFP+ teeth: ridges at rows 1360 / 1705 / 2040 / 2373 and roots 1522 / 1862 / 2194; the ridge stands 55-58 px right of the root = 14.3-15.7 mm proud (the 205 or 225 mm depth), and after the 17 px depth correction the face and the return are each 14.2 mm front-view, so 45/45 (atan 14.3/14.2) - the tooth FNIO-A (nokia/fnio-a@1) carries, with the same 28.5 pitch (read 28.3-28.7 here and 28.45 on the BA drawing). Modelled at a fitted pitch of 28.5 with face = return = 14.25: faces 74.1 / 102.6 / 131.1 / 159.6, returns ending 188.1; residuals against the read ridges 0.6 mm or less. CFP4 tooth: root 190.8, ridge 208.9 (depth-corrected), foot 228.6, apex 16.8-18.4 mm proud - modelled 45/45, face 190.8-209.7 and return 209.7-228.6. SMA tooth, both jacks on one face: root 228.6, ridge 250.4, foot 271.9, apex 19.8-21.7 proud - modelled 45/45, face 228.6-250.25 and return 250.25-271.9. Every tooth is square (45/45), so a cage run back along its face normal runs parallel to the return and stays inside the tooth however deep it goes. What the facets cannot say: Nokia draws the valleys between SFP+ teeth about 3 mm proud of the plate (the root outline sits about 10 px right of the housing top), and the first face longer (the housing top at 71.0); every valley is modelled on the plate, so the housing starts at 74.1 and the 2.7 mm between the last SFP+ foot and the CFP4 root is flat. The housing stands proud of the plate in the figure (not set into it)'
  ports: 'datasheet - Lightspan UDS 3HH90279AAAATQZZA23 BA chapter (pp203-205), External interfaces, transcribed: communication, 1 x 10/100/1000Base-T, 4 x 10GE SFP+, 1 x 100GE CFP4; management, micro-USB (debug) and the local craft management interface (LCMI, RJ45), no ACO; clock, ToD/1PPS (RJ45), 10 MHz GPS (SMA), 1 PPS (SMA), no BITS and no daisy-chain output. Composed from std/sfp@1, common/sma-jack@1, std/micro-usb@1, std/rj45@2 and common/rj45-eth@1 at registry size; the SFP+ cages (turned 90, the BA drawing draws their openings taller than wide) and the SMA jacks sit on their tooth faces. Cage numbering 1-4 top to bottom is ASSUMED; the CFP4 is module 5 by the lamp table'
  cfp4: 'drawing - the CFP4 cage is drawn in the skin (cfp4-aperture, the CFP4 MSA module envelope 21.5 x 9.5 mm, long side along the card, foreshortened by cos 45 on its tooth face), NOT composed as a port: the library has no std/cfp4 and cfp4 is not in the pluggables registry, the standards table, the exporter type map or lint PLUGGABLE_CAGES. Adding that family touches shared schema, lint and test files, which is outside a card change. Until it lands, this card exports four SFP+ ports and no CFP4 port'
  rotation: 'estimated - the face is 30 mm wide, so every cage and jack lies on its side. The RJ45s turn 270 as on the FANT-H; the micro-USB turns 90. Which way a cage latch faces is not resolvable'
  media: 'the RJ45 jacks are typed by what runs through them: Base-T rj45, craft rj45-serial, ToD/1PPS rj45-tod'
  leds: 'datasheet - Lightspan UDS p206-207 Table 72 (and 3FE71256BAAATQZZA03 Table 2), transcribed as states: PWR green power present / off; A/S green active / off stand-by (drawn unlit); ALM red / off; X1-X5 link/activity status of modules 1-5. The close-up (Lightspan p206 Figure 84, and the vector 3FE71256BAAATQZZA03 p10 Figure 4) gives the arrangement: ALM | PWR, blank | A/S, X2 | X1, X4 | X3, blank | X5'
  lamp-colour: 'estimated - the table gives X1-X5 no colour, so link-activity is drawn in the family green #39b54a that nokia/fnio-a@1 uses for the same unstated case'
  lamp-size: 'estimated - common/led-dot@1 (2 mm); the figure draws the bezel rings about 5.5 mm across'
  legends: 'drawing - read off the vector figure (3FE71256BAAATQZZA03 p9, rendered 2400 dpi): FANT-G, the lamp legends and USB. The BA drawing prints no legend beside the Base-T, craft or ToD jacks (the plate right of the frames is blank but for the callout arrows), so none is drawn; the legends beside the teeth are hidden behind the teeth (X1-X5 and 1PP fragments show)'
  levers: 'drawing - dark ejector levers at the left edge. The top one is a broad curved handle, 0.4-10.0 across and 1.0-33.0 along (after the depth correction). The bottom one runs from 325.5 to 403.5 beside the Base-T, craft and ToD jacks; in the figure its handle end stands out from the plate and is drawn across the left of those jacks, but at the plate it hugs the left edge, so it is held to x 0.4-5.6, clear of the jacks'
  screws: 'drawing - knurled captive screw at each end, right of the lever, drawn to the family figure (see thumbscrews); the figure draws both'
  marks: 'drawing - skin art only: the ESD mark at the bottom (the BA drawing prints none of the AA drawing labels). The laser warning is common/laser-warning@1 (the library triangle points up; Nokia prints it pointing right)'
  logo: 'drawing - the figure prints the Alcatel-Lucent mark and wordmark above FANT-G; per the library rule no logo is drawn, and a logo-zone covers both'
  colour: 'estimated - light silver-grey plate with dark ejectors, the family finish; the housing darker grey, each port face light and each return darker, so the teeth read face-on'
  relief: 'estimated - lever projection and screw heads carry the library card-family figures, not measurements. The port housing is facets, each face and each return its own relief feature (see angled-panel)'
  thumbscrews: 'photo - owner lab photos of an installed FX-8, 2026-09-24: one family figure for every NT card, head 10.5 mm across centred 19.4 mm from the left edge on a 30 mm plate, top head at y 0 and bottom head at y 394.5, flush with the ends'
  gaps: 'CFP4 cage drawn, not composed (no std/cfp4 in the library; the card exports no CFP4 port). SFP+ cage numbering assumed top to bottom. Teeth and jack legends not drawn (hidden or absent in the figure). Valleys between teeth drawn about 3 mm proud, modelled on the plate. Positions carried from the AA drawing where the two agree within 1 mm. Faceplate edge-to-edge width not stated (taken as the 30 mm pitch). Which of 205/225 mm is the card depth is not stated.'
