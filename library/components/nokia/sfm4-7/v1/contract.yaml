format: 1
kind: module
name: sfm4-7
version: 1.0.0
class: supervisor
behaviour: fills
profile: networking
description: >-
  Nokia 7750 SR-7 SF/CPM4 (and SF/CPM3, same face): the integrated switch fabric and control
  processor of the SR-7 / 7450 ESS, one full-length plate. Left to right: a silver captive screw
  and the black ejector lever along the bottom edge, "7750 SR" over the printed model, the
  recessed Reset, the lamp block (Status, Power, M/S Ctl and Ref, Timing, Reference 1-3, Power
  Supply 1-4, Fan Status 1-3, Compact Flash 1-3, Alarms OT/Crit/Maj/Min), the BITS RJ-45, the
  DTE/DCE switch, the Console DB-9, the Aux RJ-45 (reserved), the Alarm DB-9, ACO/LT, the lamped
  Mgmt RJ-45, Compact Flash #1 and #2, Compact Flash #3 behind its door, and the second screw
  and lever. Authored horizontal as SR7L draws it; the SR-12 turns it upright, the SR-7 seats it
  as drawn.
size: {w: 425.4, h: 35.4, d: 457.2}
size-confidence: {w: drawing, h: drawing, d: datasheet}
size-notes: >-
  The SR-7/SR-12 slot-card envelope, 425.4 x 35.4; the figure's plate measures 424.9 x 35.5 at the
  15.1 guide's own scale. The guides state 1.35 x 16.75 x 18 in; the 1.35 in thickness is
  recorded, not drawn, so the twelve SR-12 slots tile at the 35.4 pitch.
