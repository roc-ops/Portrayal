  model: 7750 SR SFM4-7
  part-number: 3HE05949AA
  part-number-variants: 3HE05949AA, 3HE05951AA, 3HE04164AA, 3HE04166AA
  weight-kg: 6.53
  power-draw-max-w: 325
provenance:
  size: >-
    drawing + datasheet - SR7L (3HE14151AAAATQZZA02, SR-7 15.1) p52 Fig 9, art 25628, vector:
    the plate's outer box is 6034 x 504 px at 1200 dpi (14.18 px/mm across, 14.24 down against
    425.4 x 35.4, 0.4% apart; Gate 1 passes). The guides state 1.35 x 16.75 x 18 in (3.43 x
    42.55 x 45.72 cm; SR12L p100 Table 33, SR7L Table 37). Drawn 425.4 x 35.4, the SR-7/SR-12
    slot-card envelope.
  depth: >-
    datasheet - 18 in (45.72 cm), SR12L p100 Table 33 / SR7L Table 37.
  weight: >-
    datasheet - SF/CPM4-7 14.4 lb (6.53 kg), SF/CPM3-7 10.6 lb (4.81 kg), SR7L Table 37; the
    SF/CPM4 figure is carried.
  power: >-
    datasheet - SR7L Table 28, SFM and CPM power consumption: SR-7 SF/CPM4 (3HE05949AA) 325 W
    worst case; SR-7 SF/CPM3 (3HE04164AA) 122 W worst case; no idle, zero-rate or typical
    figures. max = the SF/CPM4's 325. CONFLICT: the
    Alcatel-era SR-7 guide 3HE09917 reads 255 / 325 (not re-read here); the 15.1 worst case is
    carried.
  part-number: >-
    datasheet - SF/CPM4-7 3HE05949AA (7450 ESS-7 3HE05951AA); SF/CPM3-7 3HE04164AA (ESS-7
    3HE04166AA) (SR7L Table 28). One face: SR7L p52 draws both with this figure.
  layout: >-
    drawing - SR7L (3HE14151AAAATQZZA02, SR-7 15.1) p52 Fig 9, art 25628, read from its vector
    paths with PyMuPDF in the 425.4 x 35.4 frame. The plate's top corners are notched 2.3 deep
    over the first and last 15.4. Captive screws (7.43, 20.86) and (418.02, 20.86), 7.9
    across; ejector levers 0.75-34.12 and 391.35-424.71 x 26.22-33.17 (their housings; the arm
    is drawn 27.3-32.1); Reset (38.99, 18.37); lamps 2.66 across at Status (44.75, 7.92),
    Power (44.75, 20.31), Timing (50.07, 7.92), M/S Ref (50.21, 16.31) and Ctl (50.21, 20.29),
    then columns x 55.09 (Reference), 60.47 (Power Supply), 65.94 (Fan Status), 71.41 (Compact
    Flash) and 76.71 (Alarms) on rows y 20.13 / 16.28 / 12.43 / 8.57, numbered from the
    bottom; RJ-45 housings 17.6 x 14.5 centred at x 90.38 (BITS), 150.16 (Aux) and 214.61
    (Mgmt), y 15.70, windows at the top; DTE/DCE 102.18-105.01 x 14.10-19.63; D-sub shells
    centred (123.22, 15.72) (Console) and (176.83, 15.72) (Alarm); ACO/LT (199.11, 16.02), 9.4
    across; CF #1 and #2 eject buttons at 235.12 and 289.66 and slots 240.01-286.54 and
    294.59-341.12 x 13.95-19.99; CF #3 eject 344.04, door 348.85-408.52 x 11.16-22.49 under a
    rail 353.72-403.94 x 6.89-11.16, three round holes 3.5 across at x 360.07 / 371.30 /
    382.52 and its screw at (402.61, 16.75). SR12L p54 and SR7L p52 are the same art to 0.03
    mm.
  ports: >-
    datasheet - SR12L p55-56 Table 6 (SR7L p52-53 Table 6 the same): BITS, an RJ-45 for the
    network clock (RJ-48C); DTE/DCE sets the console's sense; Console, a DB-9 UART; AUX,
    reserved for future use; Alarm, a DB-9 contact output; ACO/LT, alarm cut-off and lamp
    test; Mgmt, 10/100 Ethernet RJ-45 with Link and Data lamps; Compact Flash #1 (cf1:), #2
    (cf2:) and #3 (cf3:, whose ejector is recessed), key 14 the ejector levers.
  jacks: >-
    drawing + convention - BITS and Aux are bare std/rj45@2 turned 180 (latch up, the windows
    on top as drawn); Mgmt is the lamped common/rj45-eth@1, also turned 180, so its Link lamp,
    printed at the left, is led-b. The BITS link lamp (Table 6: one lamp) is a separate
    common/led-dot@1 moved just above the housing at the left window's x, the nokia/ccm-e@1
    pattern for a timing jack; the Aux windows are left dark (the AUX lamp is "not supported",
    Table 6 key 9). Console and Alarm are common/db9-receptacle@1 centred on the drawn shells;
    the figure draws the standoffs 25.9 apart against the D-sub's 24.99, so the registry part
    is used, not the art. The owner's photo shows an RJ-45-to-DB-9 adapter fitted to the
    Console; it is an accessory and is not drawn.
  lamps: >-
    datasheet - SR12L pp202-205 Table 63: Status green up / green fast blinking booting (rate
    4 estimated, as the MDA-e cards are) / green slow blinking secondary; Power blue; Timing green
    locked / green blinking holdover / amber blinking free-running; M/S Ctl and Ref green
    primary / green blinking secondary; Reference 1-3 green selected / green blinking standby
    / amber not qualified; Power Supply 1-4 green up / amber error; Fan Status 1-3 green up /
    amber failure / amber blinking absent or too hot; Compact Flash 1-3 green active / amber
    blinking error / amber down; OT, Crit, Maj red, Min amber. Table 6 keys 4 and 10: the BITS
    lamp amber with no clock / green with clock; Mgmt Link amber 10 Mb/s / green 100 Mb/s,
    Data green blinking activity / amber blinking error. The guide gives no RGB values; the
    library's lamp colours are used. The owner's photo shows the same legends and lamp
    positions on the slot-A SF/CPM4-12.
  model-label: >-
    drawing - SR7L p52 prints "7750 SR" over "SFM4-7", vertical. The SF/CPM3-7's printed label
    is not seen in any document or photo: "SFM3-7" is offered as a field value by analogy.
    Gap.
  colour: >-
    estimated - no SR-7 is photographed; drawn as the photographed SF/CPM4-12 (charcoal plate,
    white legends, silver screws, black levers).
  relief: >-
    estimated - the captive screws stand proud (cyl 1.6, as nokia/ccm-e@1), the levers out 4.2
    (the nokia/cpm-e@1 figure), the CF mouths pocketed 3 (nokia/ccm-e@1). NOT MEASURED.
  marks: >-
    drawing - no ESD mark and no vendor mark on the plate in the figure; a logo-zone is
    reserved below the CF slots.
  lifecycle: 'searched only the staged corpus - drawn in the 15.1 guides and absent from the 22.7 ones, so superseded by the SFM5/CPM5; no end-of-life notice searched'
