groups:
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      reaching the router - the Console DB-9 (serial, with the DTE/DCE switch), the Aux RJ-45
      (reserved), the 10/100 Mgmt Ethernet port and the Alarm DB-9 contact output
  timing:
    term: Port
    role: management
    index-origin: 1
    description: the BITS network-clock input (RJ-48C on an RJ-45)
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: Status, Power, M/S Ctl and Ref, and Timing
  system-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: Reference 1-3, Power Supply 1-4, Fan Status 1-3 and Compact Flash 1-3, numbered from the plate's lower edge
  alarm-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the office alarm lamps OT, Crit, Maj and Min
  timing-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the BITS link lamp, drawn as a dot above the jack
