<svg xmlns="http://www.w3.org/2000/svg" width="33.1mm" height="213.5mm" viewBox="0 0 33.1 213.5">
  <!-- Nokia BFAN-X front edge, 33.1 x 213.5, upright as it stands at the FX-4's right end.
       From the vector front-edge view of Figure 2, 3FE66544AAAATQZZA02 p8, at 5.199 px/mm,
       positions by row and column edge scans. x 0-23.8 is the front plate; 23.8-33.1 is the
       fan plate's folded flange seen end-on. -->
  <rect id="face" x="0" y="0" width="33.1" height="213.5" rx="0.4" fill="#c9ccd0" stroke="#9ba0a6" stroke-width="0.3"/>
  <rect id="flange" x="23.8" y="0" width="9.3" height="213.5" fill="#b3b7bc" stroke="#9ba0a6" stroke-width="0.2"/>
  <line id="fold" x1="2.8" y1="0" x2="2.8" y2="210.2" stroke="#9ba0a6" stroke-width="0.2"/>
  <rect id="flange-tab" x="25.9" y="88.5" width="3.6" height="16.0" rx="0.6" fill="#aeb2b7" stroke="#6f757b" stroke-width="0.2"/>
  <rect id="top-lip" x="0" y="0" width="23.8" height="2.9" fill="#b3b7bc" stroke="#9ba0a6" stroke-width="0.2"/>
  <rect id="foot" x="0" y="210.2" width="33.1" height="3.3" fill="#b3b7bc" stroke="#9ba0a6" stroke-width="0.2"/>
  <rect id="window-left" x="3.8" y="13.1" width="8.9" height="60.0" rx="0.8" fill="#aeb2b7" stroke="#6f757b" stroke-width="0.25"/>
  <rect id="window-right" x="13.6" y="13.1" width="8.9" height="60.0" rx="0.8" fill="#aeb2b7" stroke="#6f757b" stroke-width="0.25"/>
  <g id="fan-clips" stroke="#1d2023" stroke-width="0.2">
    <rect x="11.2" y="83.5" width="13.6" height="11.5" rx="2.5" fill="#b3b7bc"/>
    <rect x="11.2" y="96.5" width="13.6" height="11.5" rx="2.5" fill="#b3b7bc"/>
    <circle cx="14.6" cy="89.2" r="1.3" fill="#8d9298"/>
    <circle cx="14.6" cy="102.2" r="1.3" fill="#8d9298"/>
    <rect x="18.2" y="84.5" width="1.8" height="22.5" rx="0.6" fill="#2e3236"/>
  </g>
  <rect id="caution-label" x="3.8" y="113.7" width="18.7" height="41.7" fill="#e9eaeb" stroke="#1d2023" stroke-width="0.25"/>
  <g id="esd-mark">
    <circle cx="12.7" cy="163.5" r="3.2" fill="none" stroke="#1d2023" stroke-width="0.35"/>
    <path d="M 12.7 161.3 L 14.7 164.9 L 10.7 164.9 Z" fill="#1d2023"/>
  </g>
  <rect id="label-window" x="3.8" y="170.6" width="9.6" height="27.7" rx="0.8" fill="#aeb2b7" stroke="#6f757b" stroke-width="0.25"/>
  <g id="cover-screw">
    <circle cx="16.3" cy="194.5" r="1.9" fill="#8d9298" stroke="#3a3f44" stroke-width="0.3"/>
    <line x1="16.3" y1="193.1" x2="16.3" y2="195.9" stroke="#3a3f44" stroke-width="0.35"/>
  </g>
  <rect id="logo-zone" x="4.0" y="200.0" width="16.0" height="8.0" fill="none"/>
  <g id="silkscreen">
    <path d="M 7.2 135.2 L 10.8 133.1 L 10.8 137.3 Z" fill="none" stroke="#1d2023" stroke-width="0.35"/>
    <text x="15.6" y="134.0" font-family="Arial" font-weight="bold" font-size="3.1" fill="#1d2023" text-anchor="middle" transform="rotate(-90 15.6 134.0)">CAUTION</text>
    <text x="21.1" y="132.4" font-family="Arial" font-weight="bold" font-size="3.0" fill="#1d2023" text-anchor="middle" transform="rotate(-90 21.1 132.4)">ROTATING FAN BLADES</text>
  </g>
