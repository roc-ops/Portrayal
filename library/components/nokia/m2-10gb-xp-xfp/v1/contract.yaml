format: 1
kind: module
name: m2-10gb-xp-xfp
version: 1.0.0
unplaced: >-
  seated by the classic MDA bays (mda-1, mda-2) of nokia/iom3-xp@1; wired by the IOM3-XP's
  accepts list, which is not edited in this change. Delete this key when those bays name this
  part.
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia (Alcatel-Lucent) 7750 SR / 7450 ESS 2-port 10GBASE XFP MDA-XP, M2-10GB-XP-XFP
  (3HE03685AA; ESS 3HE03687AA), a classic half-slot MDA for the IOM3-XP: two XFP cages, 1 at
  the left and 2 near the middle, each with its Lnk, Act and Laser Disabled lamps beneath it,
  the Stat and Pwr lamps at the far left, a WAN lamp at the upper right, the model legend at
  the lower right and a cross-slotted captive screw on each lower end wing. Authored
  horizontal; an SR-12 IOM3-XP seats it on end with the carrier.
size: {w: 190.5, h: 35.4, d: 177.8}
size-confidence: {w: datasheet, h: drawing, d: datasheet}
size-notes: >-
  The chassis guides give MDAs 1.4 x 7.5 x 7.0 in (3.56 x 19.05 x 17.78 cm, SR7 p106 Table 47).
  Held at 190.5 x 35.4 so it seats in the IOM3-XP's MDA bays on the 35.4 slot pitch; Figure 5
  is fitted per axis to that face.
attrs:
  model: M2-10GB-XP-XFP
  part-number: 3HE03685AA
  part-number-variants: 3HE03685AA (7750 SR), 3HE03687AA (7450 ESS)
  xfp: 2
  power-draw-max-w: 50
provenance:
  sources: >-
    datasheet - 7x50 MDA-XP Installation Guide 9302180206 (MXP): p30 Figure 5 and p30-31 Table 5
    (the face, its lamps and screws), p18 Table 2 (power), p16 (the model list). SR7 22.7
    3HE18643AAAATQZZA03 p106 Table 47 (MDA size) and p105 Table 45 (power, 50 W); SR7 15.1
    3HE14151AAAATQZZA02 p97 Table 32 (part numbers, "7750 SR 2-port 10GBASE - XFP MDA-XP"; p91
    says the bracketed number is the 7450 ESS part).
  size: 'datasheet - SR7 p106 Table 47; see size-notes'
  layout: >-
    drawing - MXP p30 Figure 5 (art MDA0063), vector (pdfimages finds no raster), rendered at
    1200 dpi. Fitted per axis exactly as the M10-1GB-XP-SFP's Figure 9: 4618 px between the
    plate's side lines to 190.5 (24.24 px/mm) and 847 px from the top line to the bottom of the
    centre band to 35.4 (23.93 px/mm). The outline is the classic MDA's and measures the same:
    end wings to y 28.27, notches to x 15.59 and 175.01, the band's inner line at y 33.46, the
    top lip at y 1.65; the blocks outside each side line are the side guides, not face. Port 1
    and its lamps are Figure 4's to the pixel. XFP boxes (key 3) drawn 20.0 x 10.32, x
    30.38-50.43 and 104.39-124.39, y 3.70-14.02, centres (40.41, 8.86) and (114.39, 8.86), a
    73.98 pitch. Lamps drawn 2.7 across: Stat (11.36, 6.37) and Pwr (11.36, 11.55), legends to
    the left; Lnk, Act and Laser Disabled at y 18.20, x 32.01, 40.45, 48.86 under cage 1 and
    106.02, 114.43, 122.85 under cage 2, legends below; WAN (179.96, 6.37). Port numbers 1 and 2
    left of their cages at x 26.9 and 101.2. Captive screws (key 9) centred (7.6, 22.9) and
    (183.0, 22.9), heads 8.2 in a 10.0 ring, cross-slotted; the tab under the left screw 1.55
    deep, under the right 3.1. Model legend M2-10GB-XP-XFP (key 8), bold, ending at x 172.5,
    baseline 32.2.
  cages: >-
    drawing + standard - each port is a std/xfp@1 (INF-8077i aperture 19.5 x 9.7) centred on its
    drawn box, which is barely larger than the aperture and is drawn as the bezel. The 73.98
    pitch is far above the MSA's 23.5 floor. ORIENTATION IS NOT READ: the figure draws empty
    boxes with no latch or bail, and no photograph of this card is held, so both cages take
    rotate 0.
  lamps: >-
    datasheet - MXP p30-31 Table 5: Status green blinking initializing, green up, amber
    operationally down, unlit administratively down; Power blue on, off no power; Lnk green
    link at 10000 Mbps, amber slow blinking no XFP installed, amber optics installed but no
    link, unlit disabled; Act green active, amber error, unlit no activity; Laser Disabled amber
    laser disabled, off laser on; WAN green both ports configured for 10GBASE WAN PHY framing,
    unlit not.
  power: 'datasheet - MXP p18 Table 2: M2-10GB-XP-XFP 50 W maximum; SR7 15.1 p97 and SR7 22.7 p105 Table 45 agree. XFP optics 4 W each (MXP Table 3), not included'
  colour: >-
    estimated - no photograph of a classic MDA is held (the public Ethernet MDA-XP datasheet
    would settle it). Drawn in the charcoal of the SR-7/SR-12 card family. A gap.
  logo-zone: 'reserved on the plain plate between cage 2 and the WAN lamp; Figure 5 draws no mark'
  depth: 'datasheet - 7.0 in (17.78 cm), SR7 p106 Table 47'
  lifecycle: 'searched only the staged corpus; the MDA-XP guide and the SR7 15.1 and 22.7 guides list it'
  gaps: >-
    Colour is estimated. The cage orientation is not read. The mda-type CLI string is not
    printed for this card in anything held.
