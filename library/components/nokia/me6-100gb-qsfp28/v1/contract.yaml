format: 1
kind: module
name: me6-100gb-qsfp28
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia 6-port Universal QSFP28 MDA-e-XP (3HE12333AA), CLI type me6-100gb-qsfp28, for the 7750
  SR-1 (FP4) and the IOM5-e. Six QSFP28 cages in one row, c1 to c6 left to right, each taking
  QSFP28 10x10GE or 1x100GE, QSFP+ 1x40GE or 4x10GE optics, or a QSFP28-to-SFP28/SFP+ adapter
  (XP p88). A Lnk and an Act lamp sit above every cage and its cN legend below it; Stat and Pwr
  are at the left end, the model label at the lower right, an insertion handle at each top
  corner and a captive screw on each lower wing.
size: {w: 193, h: 35.4, d: 193}
size-confidence: {w: drawing, h: drawing, d: datasheet}
size-notes: >-
  w and h are the shared 7750 MDA envelope (193.0 x 35.4) the slots are built to; the guide
  states 1.4 x 7.6 in, rounded to 0.1 in. d is the stated 7.6 in.
