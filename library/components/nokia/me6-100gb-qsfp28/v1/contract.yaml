  model: ME6-100GB-QSFP28
  part-number: 3HE12333AA
  qsfp28: 6
  weight-kg: 0.95
  power-draw-max-w: 66
  power-draw-typical-w: 59
provenance:
  size: >-
    datasheet - MDA-e-XP and MDA2-e-XP Installation Guide 3HE20985AAABTQZZA01 (25.10) p50 Table
    26: H x W x D 1.4 x 7.6 x 7.6 in (3.6 x 19.3 x 19.3 cm) for every MDA-e-XP. The face is held
    at 193.0 x 35.4, the shared 7750 wave-1 MDA envelope the SR-1 and SR-e slots are built to:
    1.4 in (35.56) is rounded to 0.1 in and the SR-3e slot pitch measures 35.43 (SRE
    3HE17927AAAATQZZA03 p50 Fig 10). The 7.6 in width is 193.0
  depth: >-
    datasheet - 7.6 in (19.3 cm), MDA-e-XP and MDA2-e-XP Installation Guide 3HE20985AAABTQZZA01
    (25.10) p50 Table 26; carried as 193.0
  shape: >-
    drawing - the plate is notched at both lower corners, as every MDA-e-XP faceplate figure
    draws it. Measured on the vector paths of Fig 39 (p88), whose plate is 295.66 x 54.23 pt,
    1.5319 pt/mm on BOTH axes (aspect 5.452 = 193.0 / 35.4 exactly): the full-height band runs x
    16.2 to 176.8 (outer edge of the 1.5 pt stroke), the end wings stop 27.4 below the plate
    top, and a 2.4 fillet joins wing and band. Fig 40 draws the identical outline. The notches
    are transparent in the skin. The thin strip the figures draw above the plate is the card's
    top edge in slight perspective and is not face; the fine line 1.9 below the plate top is the
    fold of the plate's top flange and is drawn
  thumbscrews: >-
    drawing - two captive screws, one on each lower wing (the figure's 'Captive screws' key):
    head 10.1 across, centres (8.1, 21.0) and (184.9, 21.0), from Fig 39 and Fig 40 (the two
    figures drawn at an exact 193 x 35.4 aspect). The other four figures read 7.6-8.4 in,
    21.0-22.2 down and 10.1-10.35 across once fitted per axis; their spread is the drawings' own
    aspect error (Figs 41 and 43 are drawn 1.8% and 5.6% squat), so one screw geometry serves
    the family. The wave-1 family figure is 7.8 / 20.8 / 10.3
  handles: >-
    drawing - insertion/extraction handles at both top corners (the figure's 'Handles' key;
    MDA-e has none, this is the one visible difference between the two plates): a tab 19.6 x 5.1
    across each top corner (x 1.1-20.7 and 172.3-191.9, y 0.8-5.9) with a D-shaped pull loop
    hanging below it at the outer edge (x 1.0-9.1 and 183.9-192.0, down to y 15.4), from Fig 39.
    Figs 41-44 draw the same tab 19.6-20.3 wide; Fig 40 draws it 17.7
  colour: >-
    estimated - no photograph of an MDA-e-XP is staged. Charcoal plate, light legends, grey
    handles, silver screws and a yellow ESD mark are the 7750 wave-1 family estimate (dark MDA
    faceplates, a yellow ESD mark at the top right) from the datasheet cut-out DS 194147 listed
    in PUBLIC-SOURCES, which is not staged (gap)
  lamps: >-
    datasheet - MDA-e-XP and MDA2-e-XP Installation Guide 3HE20985AAABTQZZA01 (25.10) p109 Table
    48 (single-port connectors). Pwr: blue solid = power on, unlit = no power. Stat: green solid
    = up, green blinking = initialising, amber solid = operationally down, unlit = admin down.
    Lnk: green = link, amber slow blink = no optic, amber fast blink = loopback, amber solid =
    optic but no link, unlit = disabled. Act: green = active, amber = error, unlit = no
    activity. The guide gives no blink rates: slow is carried as plain blinking and fast as 4
    Hz, an ESTIMATE shared with the MDA-e cards (gap). With a break-out optic the Lnk lamp runs
    the blink sequence of Table 50 (p110-111: 2.75 s amber, then one 0.75 s green or amber blink
    per port) and Act stays off; that sequence is not carried as a state (gap)
  relief: >-
    estimated - the two handles stand proud; no document gives a figure, so the library's pooled
    release-hardware estimate (4.2, as nokia/fglt-b@1 carries from edgecore/agr-psu-dc@1) is
    used. Cages and lamps take their own std/ and common/ relief
  esd-mark: >-
    drawing - the ESD warning symbol at the top right, under the right handle's tab. Each
    figure's symbol box is recorded in `layout`; the part of it the tab hides is not drawn, so
    the mark is drawn from the tab's lower edge (y 5.95) down. Yellow is the family estimate,
    not read from any figure (gap)
  logo: >-
    drawing - none of the six figures draws a vendor mark on the plate, so no logo-zone is
    reserved; the only printed text besides the legends is the model label
  lifecycle: >-
    searched only the staged corpus - current in the 25.10 guide; no end-of-sale notice was
    searched for
  figure-scale: >-
    drawing - every figure is vector (pdfimages -list finds no raster on pp88-102), so the paths
    were read directly rather than a render measured
  weight: >-
    datasheet - 2.1 lb (0.95 kg), MDA-e-XP and MDA2-e-XP Installation Guide 3HE20985AAABTQZZA01
    (25.10) p50 Table 26
  power: >-
    datasheet - MDA-e-XP and MDA2-e-XP Installation Guide 3HE20985AAABTQZZA01 (25.10) p52 Table
    29 (SR1 p93 Table 35 prints the same): idle 0, 25C 59, 40C 63, 55C 66 W. Max is the 55C rung
    (100% line rate, IMIX), typical the 25C one (50%). The table says the figures EXCLUDE the
    optics
  ports: >-
    datasheet - six QSFP28 connectors, 'numbered c1 to c6, from left to right' (XP p88 Table 38
    key 4). Composed as std/qsfp28@1: Fig 39 draws each cage 19.53 x 9.78 at x 23.67 + 25.27 n,
    y 11.57-21.35, and the 20.0 x 10.15 aperture is centred on it. Nokia names the connectors
    c1-c6, so those are the ids
  layout: >-
    drawing - Fig 39 p88 vector paths at 1.5319 pt/mm. Lnk lamps at x 24.56 + 25.27 n and Act
    lamps at 37.23 + 25.27 n, y 8.96, drawn 2.01 across, legends to their right (2.6 mm
    Helvetica, baseline 9.99); cN centred under each cage on baseline 25.37. Stat (12.81, 8.23)
    and Pwr (12.81, 12.30), 2.57 across, legends to the right. Model label bold 3.2 mm, ending
    at x 174.8 on baseline 32.1. ESD mark x 176.0-182.3, y 3.0-8.6. The bracket drawn under the
    six cages and the one over c3's lamps are callout brackets (keys 3 and 4, drawn at the
    callout line weight), not silkscreen
