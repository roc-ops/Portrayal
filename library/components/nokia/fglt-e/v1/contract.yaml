groups:
  pon-cages:
    term: Cage
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 2.5g, pon: gpon}
    description: >-
      the sixteen dual-GPON cages, two PON interfaces each - cage N carries ports 2N-1
      and 2N (GPON, 2.488 Gbps down)
  pon-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: two PON lamps per cage, one per port, on the cage's left - lamp N is port N
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
