format: 1
kind: module
name: fant-h-bb
version: 1.0.0
class: supervisor
behaviour: fills
profile: networking
description: >-
  Nokia FANT-H BB (3FE74828BB), the ANSI build of the 7360 ISAM FX / Lightspan FX network termination card with the 3.2 Tbps switch. Two QSFP28 uplinks and two SFP/SFP+ ports, 1PPS and 10 MHz SMA timing inputs, a micro-USB debug port, a 10/100/1000BASE-T port, the LMT craft port and the ToD/1PPS port, all RJ45, and the ALM/PWR/A/S lamps, four lane lamps per QSFP28 and one per SFP. No ACO switch and no BITS jacks on the face.
size: {w: 30.0, h: 405.0, d: 225.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: 'w is the NT slot pitch (30 mm), taken as the faceplate width; d is the larger of the two depths the UDS gives (205/225)'
attrs:
  model: FANT-H BB
  part-number: 3FE74828BB
  variant: BB
  standard: ANSI
  switch-capacity: '3.2 Tbps (2.6 Tbps effectively used)'
  weight-kg: 1.5
  qsfp28: 2
  sfp-plus: 2
  power-draw-max-w: 178
  power-draw-typical-w: 140
  power-scope: 'scope NOT stated by the ANSI manual. The ETSI manual says every NT figure excludes the NTIO card and SFP power, and the BB figures equal the AA ones, but the ANSI document itself does not say so'
provenance:
  lamp-colour: >-
    estimated - The UDS LED tables name the port lamps' conditions (link, activity) but not their colour, so
    the `link-activity` state is drawn in the family green #39b54a that nokia/fnio-a@1 uses for the
    same unstated case; the A/S lamp's `standby` is that lamp OFF (the table: 'off = stand-by'), so it
    is drawn unlit (#3a3f44) rather than given a colour the hardware does not show.
  size: 'datasheet - 3HH90279AAAATQZZA23 (Lightspan FX UDS 25.12) section "Dimensions" of the BB chapter: height 405 mm, width 30 mm, depth 205/225 mm, weight approximately 1.5 kg. The same four figures appear in every FANT-H chapter of the ANSI R6.9 and ETSI R7.0 UDS guides. The 30 mm is the NT card pitch; the UDS states no separate faceplate edge-to-edge width, so the face is drawn at the pitch, which is what the FX shelf bays are built to'
  size-width: 'datasheet - slot pitch, "width: 30 mm" in the UDS dimensions list; faceplate width not stated, taken as the pitch'
  depth: 'datasheet - the UDS gives "205/225 mm" without saying what each measures; 225 is carried as the card depth. Which figure is PCB and which is overall (faceplate and ejectors included) is not stated'
  power: 'datasheet - ANSI Safety Manual 3HH12894AAAATCZZA27 p25 Table 2, "FANT-H - BA and BB variants" 140 W typical / 178 W maximum. The ANSI row carries no footnote; the ANSI note (1) is attached to FANT-F only. Carried as power-draw-max-w 178 and power-draw-typical-w 140; power-scope: scope NOT stated by the ANSI manual. The ETSI manual says every NT figure excludes the NTIO card and SFP power, and the BB figures equal the AA ones, but the ANSI document itself does not say so'
  layout: 'estimated - positions along the 405 mm are fractions read off 3HH90279AAAATQZZA23 p229 Figure 91 (3D side and front view, ANSI); LED close-up Figure 92 p230, the only face drawing any document holds: a 3D side-and-front view, embedded as a 718 x 617 JPEG at 150 ppi (pdfimages -list), so Gate 1 cannot pass and no absolute geometry comes off it. The face runs from row ~50 to row ~592, 542 px for 405 mm (0.7472 mm/px) and every y is (row - 50) x that. Rows read: SMA nuts 150 / 182.5; QSFP openings 205-227.5 / 255-275; SFP openings 307.5-325 / 347.5-361; USB 392.5-405; RJ45s ETH 409-430, LMT 432.5-452.5, ToD 454-474. Taken at the flat openings, never at the protruding cage shrouds or SMA barrels, which the oblique view draws shifted up-left. Across the face the figure is foreshortened (about 34 px for 30 mm against 40 px vertically), so x is NOT measured: the port column is set on one centreline at x 14.5, the lamps in two columns at x 11.5 and 16.55, and the legends beside them, as the figure arranges them'
  ports: 'datasheet - UDS 3HH90279AAAATQZZA23 BB chapter, "External interfaces", transcribed: communication, 1 x 10/100/1000Base-T and 2 x QSFP28 and 2 x SFP+; management, micro-USB (debug) and the local craft management interface (LCMI, RJ45); clock, ToD/1PPS (RJ45), 10 MHz GPS (SMA) and 1 PPS (SMA). The figure adds the order top to bottom: lamps, 1 PPS, 10 MHz, QSFP28/QSFP+, QSFP28/QSFP+, SFP/SFP+, SFP/SFP+, laser mark, micro-USB, Base-T, Craft, Time of Day. Composed from std/qsfp28@1, std/sfp@1, common/sma-jack@1, std/micro-usb@1 and std/rj45@2 rather than drawn'
  rotation: 'estimated - the face is 30 mm wide, so every cage and jack lies on its side, as on every vertical card in the library. The RJ45s turn 270 so their latch slot faces the legend side, which is where the figure draws the notch; the cages and the micro-USB turn with the long axis vertical, the cages the same way as the jacks. Which way a cage latch faces is not resolvable at 150 ppi'
  media: 'the RJ45 jacks are typed by what runs through them, as the library devices already do: Base-T rj45, LMT craft rj45-serial, ToD/1PPS rj45-tod'
  leds: 'datasheet - UDS 3HH90279AAAATQZZA23 Table 78 p230, transcribed onto each lamp as `states`. The LED close-up gives the arrangement: two columns, ALM|PWR, a lone A/S on the right, 2|1 and 4|3 bracketed PORT1, 2|1 and 4|3 bracketed PORT2, then PORT4|PORT3. The table gives NO COLOUR for the port lamps ("Link/activity status"), so they carry a colourless link-activity token rather than an invented green'
  lamp-size: 'estimated - common/led-dot@1 (2 mm) on the 5.2 mm row pitch read off the figure; the drawn lamp diameter is not measurable at 150 ppi'
  legends: 'drawing - printed legends read at 8x off the figure: ETH, LMT, ToD/1PPS beside the jacks, USB beside the micro-USB, and FANT-H at the top. The SMA and cage legends are drawn but illegible at 150 ppi and are NOT printed here'
  levers: 'drawing - dark ejector levers at both ends, inside the 405 mm, per the figure and the shared Nokia conventions. The lower lever sits below the RJ45 block. Positions estimated from the figure rows'
  colour: 'estimated - light silver-grey plate with dark ejectors, the family finish from the shared FX conventions; the FANT-H photographs (500 px phone shots) were not staged locally and were not used'
  relief: 'estimated - lever projection and screw heads carry the library card-family figures, not measurements; no Nokia document states them'
  variants: 'drawing - FOUR FACES, SO FOUR COMPONENTS (nokia/fant-h-aa, -ac, -bb, -bc). The UDS draws each build separately and they differ in what is punched and composed, which a skin cannot carry: AA has no SFP cages but has the ACO switch and BITS IN/OUT; BB has two SFP cages, no ACO and no BITS; AC has SFP+, ACO and BITS; BC has SFP+ and neither. The 125 W builds (AC, BC) also share a different arrangement from the 178 W ones (AA, BB): everything from the lamps down sits lower, the RJ45 block is lower still and the closed lower lever lies over the LMT/ToD jacks, where on AA/BB it sits below them. BC is drawn as the AC plate with the BITS pair left blank. BA (3FE74828BA, the R6.x ANSI build, standalone UDS 3FE74828BAAATQZZA01 p7) is NOT modelled: its line drawing is the AA arrangement with blank plate where the BITS pair is, and no SFP cages'
