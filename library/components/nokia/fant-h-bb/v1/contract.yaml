  qsfp28: {term: Port, role: traffic, index-origin: 1, attrs: {media: qsfp28, speed: 100g}, description: 'QSFP28 uplinks - 100GE, 40GE and 4x10GE'}
  sfp-plus: {term: Port, role: traffic, index-origin: 1, attrs: {media: sfp-plus, speed: 10g}, description: 'SFP+ ports - 10GE and 1GE; their lamps are PORT3 and PORT4'}
  base-t: {term: Port, role: traffic, index-origin: 1, attrs: {media: rj45, speed: 1g}, description: 'the fixed 10/100/1000Base-T communication port (ETH)'}
  timing: {term: Port, role: management, index-origin: 1, mixed: 'network timing - the 1 PPS and 10 MHz GPS SMA inputs and the ToD/1PPS RJ45'}
  craft: {term: Port, role: management, index-origin: 1, mixed: 'reaching the card locally - the LMT craft RJ45 (LCMI) and the micro-USB debug port'}
  leds: {term: LED, role: indicator, index-origin: 1}
