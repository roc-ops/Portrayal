provenance:
  size: >-
    datasheet + convention - 16.75 in wide (42.55 cm) and 1.35 in thick (3.43 cm) for the SFM
    + CPM5 combination (SR12L p101 and SR7L Table 37, both 1.35 x 16.75 x 18 in); drawn 425.4
    x 35.4, the wave-2 slot-card envelope, so the SR-12's twelve slots tile at the 35.4 pitch.
    The 1.35 in thickness is recorded, not drawn.
  depth: >-
    datasheet - 18 in (45.72 cm), SR12L p101 / SR7L Table 37 (SFM + CPM5). SR7 p106 gives the
    SFM6 17 in and SR12 p103 18 in; 18 is carried.
  power: >-
    datasheet - SR12 (3HE18644AAAATQZZA03) p93 Table 31, the FP4 table: SFM6-7/12 idle 85, 25C
    165, 40C 220, 55C 270 W. max = 55C, typical = 25C. CONFLICT (it depends on the chassis):
    SR7 p97 Table 35 gives 80 / 120 / 125 / 150 W for the same part in the SR-7. The SR-12
    row, the larger, is carried. The bundle 3HE13504AA (SFM6-7/12 + CPM5) is 260 / 345 / - /
    525 W, not carried here.
  part-number: >-
    datasheet - 3HE12335AA; bundled with a CPM5 as 3HE13504AA (SR12 p93 Table 31). No 7450 ESS
    number is given.
  window: >-
    measured - the `cpm` window is 392.0 x 31.8 at [16.7, 0], centred along the card and flush
    with its top edge: the CPM5's own face, decided for Q2 and recorded in nokia/cpm5@1
    provenance.size (the empty SFM5-12e front view, SR-12e 3HE18645AAAATQZZA02 p56 Fig 9, the
    SR-12e chassis front p50 Fig 6, and the owner's photo of a CPM5 beside an SF/CPM4-12).
    SR12 p216 Fig 68 shows the same split: end pieces with the levers (keys 3/6), the CPM5
    (key 1) sliding in between.
  layout: >-
    drawing + photo - the carrier's captive screw at (6.6, 21.6), about 8 across (SR-12e p50
    Fig 6 reads (6.6, 21.1); the owner's photo reads about (6.3, 23.4)); the ejector lever
    along the bottom edge from x 0.8 to 39.9, y 26.5-31.8, running over the CPM5's lower
    corner as the SR-12e chassis figure draws it (331 px of its 3530 px card, from each end);
    the right end mirrors the screw and lever. The label plate on the left end piece is read
    off the photo (about 0.8-9.6 x 5.4-16.8).
  label: >-
    estimated - no SFM6 is photographed and no figure draws one; SR12 p60 says only that the
    form factor is the SFM5-12's. The label plate is drawn as the SFM5-12's with the printed
    text a guess. Gap.
  colour: >-
    estimated - not photographed; drawn as the photographed SFM5-12 carrier (black end pieces,
    black screw knobs and levers).
  relief: >-
    estimated - the screw knobs stand proud (cyl 1.6, as nokia/ccm-e@1) and the levers out 4.2
    (the nokia/cpm-e@1 figure, itself borrowed from nokia/nelt-b@1). NOT MEASURED.
  lifecycle: 'searched only the staged corpus - listed in the SR-7/SR-12 22.7 guides; no end-of-life notice searched'
unplaced: >-
  seated by the SR-7 and SR-12 SF/CPM slots A and B, in the -B chassis only (3HE10766AA,
  3HE10768AA); the coordinator wires it
