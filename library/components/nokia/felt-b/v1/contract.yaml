format: 1
kind: module
name: felt-b
version: 1.2.1
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia FELT-B (3FE 69486 AA and 3FE 69486 AB), the high-speed point-to-point Ethernet LT of
  the 7360 ISAM FX / Lightspan FX: eighteen SFP cages in nine ganged 1x2 blocks, grouped G1-G5,
  each taking a CSFP (two FE/GE ports), an SFP (FE/GE/2.5G) or an SFP+ (10G), so 36, 18 or 16
  ports; a BITS OUT RJ45; the PWR(A/S) and ALM lamps and two link lamps per cage. Authored
  upright, as the card stands in the FX-16; the FX-4 and FX-8 bays turn it 90 degrees. The AA
  and AB variants share one face (the two UDS chapters embed the SAME image objects for their
  front and 3D views), so they are one component with the variant in attrs. FELT-B AC
  (3FE 69486 AC) has no data sheet in any staged document and is not modelled.
size: {w: 25.0, h: 405.0, d: 205.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: >-
  w is the board-to-board PITCH (25 mm), held so the LT bay built from the shared 7360 FX
  convention seats it; the faceplate edge-to-edge width is not stated. The flat front figure
  measures the plate plus its side rail at about 26 mm across (26.1 on the vector FELT-D
  figure), so figure positions across the card are taken as fractions of 26.1 laid onto the
  25 mm face. d is the first of the two board widths the UDS gives (225 top / 205 bottom),
  as nokia/fnio-d@1 carries it.
attrs:
  model: FELT-B
  part-number: 3FE 69486 AA
  part-number-variants: 3FE 69486 AA, 3FE 69486 AB
  sfp-plus: 16
  weight-kg: 1.28
  power-draw-max-w: 95
  power-draw-typical-w: 80
provenance:
  size: >-
    datasheet - Lightspan UDS 3HH90279AAAATQZZA23 section 45.5.2 (p474) and 46.5.2 (p487):
    height 405 mm, width 225 mm (top) / 205 mm (bottom), board to board pitch 25 mm. Face held
    at the 25 mm pitch by the shared 7360 FX convention.
  size-width: >-
    datasheet - slot pitch 25 mm, UDS section 45.5.2; faceplate width not stated, taken as the
    pitch. The flat figure measures plate plus rail at about 26 mm (see size-notes).
  depth: 'datasheet - 205 mm, the bottom width of section 45.5.2; 225 at the top'
  weight: >-
    datasheet - 1.28 kg, ANSI Product Information Manual 3HH12892AAAATCZZA23 p114 unit table;
    the UDS chapters state no weight.
  power: >-
    datasheet - Lightspan Safety Manual 3HH91852AAAATCZZA07 p37 and ETSI Safety Manual
    3HH11998AAAATCZZA29 p26, Table 2: FELT-B typical 80 W (50% of ports active, with 1G cSFP or
    10G SFP+), maximum 88 W (all ports, 36G throughput, 1G cSFP) and 95 W (all ports, 80G
    throughput, 10G SFP+). 95 carried as the maximum. Whether the pluggables are inside the
    figure is not stated for LT cards (the manual says so only for PON LTs, which include them,
    and NTs, which exclude them); the use-case notes name the optics fitted, which suggests they
    are counted, but that is a reading, not the vendor's statement.
  variants: >-
    drawing - UDS A23 Figure 232 (FELT-B AA, p473) and Figure 241 (FELT-B AB, p486) are the same
    embedded image (PDF object 2200; the 3D views are both object 2199), and the two chapters'
    interface, LED and dimension sections read the same. One face, so one component (the family
    rule: a different part number with the same face is an attr).
  layout: >-
    drawing - UDS A23 Figure 232, the flat front panel, embedded 924 x 244 at 150 ppi (no
    higher-resolution copy is staged). The figure is drawn HORIZONTAL with the card's top end at the figure's LEFT (the
    Figure-233-style 3D view shows the lamps and the top thumbscrew at the upper end, and the
    board name, which the figure prints rotated, reads horizontally once upright), so the
    component is that figure turned 90 degrees clockwise: y = mm along the figure from its
    left plate end, x = 25 x (1 - fy / 26.1) where fy is mm down from the figure's upper plate
    edge. Plate x 15..912 px = 405 mm, 2.215 px/mm. Gate 1:
    the ganged SFP blocks measure 30.25 mm along and about 10.7 across against 28.5 + rim and
    10.4 for SFF-8433, so the figure is orthographic to within the 150 ppi pixel (0.45 mm).
    Read off it: top thumbscrew centre 5.0, top lever 0.5-29.3 at the card's left edge; round
    Alcatel-Lucent mark at 15.8 (logo-zone), the Alcatel-Lucent wordmark and FELT-B name at
    about 20.9 and 25.6; the two board lamps side by side at 32.1 (ALM left, PWR right, as
    printed); BITS OUT RJ45 at 54.2-71.3; nine 1x2 cage blocks starting at 81.27, 114.68,
    147.64, 180.60, 213.56, 246.52, 279.48, 312.44, 345.40, each 30.25 long (a 32.96 pitch);
    bracketed group legends G1 (cages 1-4), G2 (5-8), G3 (9-12), G4 (13-16), G5 (17-18) on the
    right; laser and ESD triangles at 379-392; bottom lever 375.7-404.5 and thumbscrew at 400.3.
    About 0.5 mm error along, 0.7 across.
  ports: >-
    datasheet - UDS section 45.4.2.1: 18 SFP cages for CSFP (FE/GE, two ports), SFP
    (FE/GE/2.5G/Smart SFP) or SFP+ (10G); ports numbered 1-36, a CSFP using the odd and even
    port, an SFP/SFP+ the odd port only; five port groups G1-G5 printed on the cover; a group
    holds either SFP+ or any mix of CSFP and SFP, and at most 16 cages take SFP+ (45.4.2.2).
    Figure 234 numbers the cages SFP 1 / CSFP 1 ... SFP 18 / CSFP 18, so the cages are sfp-1 to
    sfp-18 and cage n presents ports 2n-1 and 2n, printed under it as the figure prints them.
    Composed as std/sfp-ganged@1 turned 90 degrees (the blocks run along the card, bail toward
    the port legends).
  interfaces: >-
    datasheet - UDS A23 section 45.4.2.1, ports linearly numbered 1-36, CSFP odd and even: cage n declares `interfaces: [port-{2n-1}, port-{2n}]`, the two ports it numbers
    whether a CSFP (both) or an SFP (the odd one alone) is seated, so the DCIM module type lists
    all 36 ports, typed from the cage, and no cage row (roc-ops/Portrayal#443).
  rate: >-
    datasheet - `sfp-plus: 16` is Table 164's SFP+ maximum and the 45.4.2.2 rule that at most
    16 of the 18 cages take SFP+; the export's per-card rate is one value, so the CSFP (36 x
    FE/GE) and SFP (18 x 2.5G) builds are not expressed by it.
  bits-out: >-
    datasheet - UDS section 45.4.2.3: BITS OUT on a generic RJ45 "with embedded, but
    uncontrolled LEDs", E1/T1 carrying the SyncE-recovered frequency, pins per Table 165.
    Composed as std/rj45@2 (no lamps, because the jack's LEDs are not driven), turned 270 so
    its contacts face the port legends as the figure draws them.
  lamps: >-
    datasheet - Tables 166 and 167 (p475) and Figure 234: PWR (A/S) off / green active / yellow
    standby; ALM off / red major-critical. Two link lamps per cage, drawn as round lenses above
    each cage in Figure 232 (on the right once upright), LED1 nearer the top: with a CSFP each
    shows its own link (green, blinking green on traffic, red on LOS, off with no SFP); with an
    SFP/SFP+ LED1 is status and LED2 speed (off up to 1G, blinking green/yellow at 2.5G, yellow
    at 10G). Figure 234's legend calls them dual-colour red/green, so yellow is the mix; drawn
    #f5c400.
  marks: >-
    drawing - the two hazard triangles near the bottom end are drawn as outlines; at 150 ppi
    their glyphs are unresolved (one is laser, one ESD by shape).
  logo-zone: 'reserved over the round Alcatel-Lucent mark at 15.8 mm; the mark itself is not drawn'
  relief: >-
    estimated - levers and thumbscrews as nokia/fant-h-aa@1 carries them; the composed cages
    and jack emit their own depth.
  lifecycle: 'searched only the staged corpus - listed as current in UDS A23; no end-of-life notice searched on the web'
  thumbscrews: >-
    photo - lab photos of an installed FX-8, 2026-09-24; flush-with-end per the maintainer's reading.
    One family figure for every NT, NTIO and LT card and blank, because every screw goes into
    the fixed rails of the shelf: head 10.5 mm across, centred 18.7 mm from the left edge on
    this 25 mm plate, the top head touching the top end (y 0) and the bottom head the bottom
    end (y 394.5). Measured as ratios within one card on perspective phone photos, the
    plate-plane screw centre read from the recessed seat (concentric with the shank) rather
    than the projecting head: 30 mm NT (FANT-H top 0.640, bottom 0.651; FANT-F top 0.64-0.67,
    bottom about 0.64) -> 19.4 (ratio 0.647); 25 mm NTIO blank 3FE65651BA (top 0.733, bottom
    0.754) -> 18.7 (ratio 0.748). Head diameter against plate width: the back edge of the
    knurl 0.36 of the FANT-H plate and 0.42 of the NTIO plate at the bottom, the front faces
    0.39-0.48 (magnified by their projection), so an upper bound of 10.6-10.8 mm; 10.5 taken
    (0.35 of 30, 0.42 of 25), inside the 10-11.5 mm the Nokia flat FANT-H view draws. The
    screw sits on the side AWAY from the grey ejector lever (lever at the left edge, screw
    right of centre) at both ends. Same centre at both ends: the photos differ by under 1 mm,
    within the reading error. This replaces the per-figure screw positions and sizes read off
    the oblique guide drawings, which had drifted 17.2-21.0 across and 6.4-10.0 in size.
