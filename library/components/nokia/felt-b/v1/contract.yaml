groups:
  sfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      the 18 SFP cages, SFP 1-18 (CSFP FE/GE, SFP FE/GE/2.5G or SFP+ 10G). Cage n presents
      ports 2n-1 and 2n with a CSFP and port 2n-1 alone with an SFP/SFP+; each cage declares
      both as its `interfaces:`. Port groups G1-G5 (G5 = cages 17-18) each take either SFP+ or any mix of CSFP and SFP.
  link-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      two link lamps per SFP cage, 1-36: with a CSFP one per link; with an SFP/SFP+ the first
      (upper) shows link status and the second (lower) the speed
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the board lamps PWR (A/S) and ALM
  timing:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj48}
    description: the BITS OUT RJ45 (E1/T1), carrying the SyncE-recovered clock to the NT BITS input
