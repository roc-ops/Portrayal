name: me6-400gb-qsfp-dd
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia 6-port Universal QSFP-DD MDA-e-XP (3HE15152AA), CLI type me6-400gb-qsfp-dd, for the 7750
  SR-1 (FP4) and the IOM5-e of the SR-12e (not the SR-7 or SR-12). Six QSFP-DD cages in bezels
  in one row, c1 to c6 left to right, taking QSFP28, QSFP28-DD, QSFP56-DD and QSFP+ optics at
  10/40/100/400GE (XP p96); each E4 instance runs 400GE on its first two ports (c1-c2, c4-c5) or
  100GE on all three. A Lnk and an Act lamp sit above every cage and its cN legend below it;
  Stat and Pwr are at the left end, the model label at the lower right, an insertion handle at
  each top corner and a captive screw on each lower wing.
size: {w: 193, h: 35.4, d: 193}
size-confidence: {w: drawing, h: drawing, d: datasheet}
size-notes: >-
  w and h are the shared 7750 MDA envelope (193.0 x 35.4) the slots are built to; the guide
  states 1.4 x 7.6 in, rounded to 0.1 in. d is the stated 7.6 in.
attrs:
  model: ME6-400GB-QSFP-DD
