format: 1
kind: module
name: fan-cover-fx8
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  The fan cover of the Nokia 7360 ISAM FX-8 shelf (NFXS-E): a strip closing the fan area at
  the shelf's right-hand end, in front of the BFAN-E fan unit, held by one captive screw.
  THIS IS THE PART THAT CARRIES THE SHELF'S NAME: "7360 ISAM FX-8" is printed on the cover,
  not on the fan unit or the shelf frame, together with the slot legend for each card row
  (NTA, NTIO, NTB, 01 to 08). Below the screw a FAN lamp window shows the fan unit's
  status, and a notch in the foot leaves the fan unit's own captive screw exposed. No part
  number for the cover appears in any staged document.
size: {w: 32.9, h: 345.0}
size-confidence: {w: borrowed, h: borrowed}
size-notes: >-
  the cover closes exactly the fan area, so it takes the BFAN-E face it covers; its own
  outline is not dimensioned
attrs:
  model: FX-8 fan cover
  role: access-cover
provenance:
  size: >-
    borrowed - nokia/bfan-e@1, the fan unit this closes (32.9 x 345.0, Lightspan UDS
    3HH90279AAAATQZZA23 s36.5.1 p378). In the NFXS-E BB shelf elevation (3FE64936BBAATQZZA03
    p8 fig4, vector, rendered at 1200 dpi, 9.250 px/mm across from the 446.5 mm body and
    9.285 down from the 355 mm height) the cover's outline runs between line centres 304 px
    apart, which is 32.9 mm, and from 131 to 3322 px down, 343.6 mm - the 345 less the
    0.4 percent by which the drawing's two scales disagree; nothing in that figure
    distinguishes the cover's outline from the fan's.
  layout: >-
    drawing - read off the same elevation by connected-component extraction, in shelf
    millimetres, then shifted by the cover's origin (411.1, 8.1). Slot legends centred at
    cover y 08 10.5, 07 36.1, 06 61.3, 05 86.3, 04 111.6, 03 136.4, 02 161.5, 01 187.2,
    NTB 217.6, NTIO 245.5, NTA 273.2, glyph boxes 4.5 to 7.3 across - each 1 to 3 mm above
    the centre of the card row it names, the legends running on a 25.2 mm pitch where the
    rows run on 25.0. The name "7360 ISAM FX-8" runs up the cover from y 221.5 to 272.3
    (50.8 mm) with its glyphs 13.7 to 19.1 across. Captive screw centre (15.9, 299.1), 10.3
    mm over its outer ring; FAN legend centred at x 8.0, baseline 315.5; lamp window centre
    (8.0, 319.9), about 3.6 across. A second screw head is drawn at (15.9, 340.6) straddling
    the cover's lower edge: that is the fan unit's captive screw (nokia/bfan-e@1 puts it at
    15.5, 340), seen through the semicircular notch HIM 3HH91853AAAARJZZA08 fig 158 draws in
    the foot of the removed cover. The notch is drawn 5.8 in radius about (15.7, 340.6) so the
    fan's screw shows through; its size is not dimensioned anywhere.
  identity: >-
    drawing - Lightspan HW Installation Manual 3HH91853AAAARJZZA08 fig 158 (p255, 150 ppi
    JPEG) "Removing the installed FX-8 fan unit" labels the part "Fan cover" and its
    "Captive screw fan cover", and prints "7360 ISAM FX-8" and the slot legends on it. No part
    number is given in the installation manual, the Unit Data Sheet guides or the
    Product Information Guides.
  text-weight: >-
    drawing - fig4 sets the slot legends and the FAN legend in a heavy face and the name in
    a regular one (stem 0.86 mm on a 5.1 mm cap height, a ratio of 0.17, against about 0.2
    for the bold legends beside it). Sizes are fitted to the drawing with Arial metrics:
    the name at 6.9 (7.39 em wide spans 50.8 mm), the slot legends at 3.5 (NTIO 8.6 mm long,
    08 3.9 mm), FAN at 2.6 (5.2 mm wide, 1.9 tall). Good to about half a millimetre.
