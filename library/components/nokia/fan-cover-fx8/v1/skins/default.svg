       the foot leaves the fan unit's captive screw exposed (HIM 3HH91853AAAARJZZA08 fig 158). -->
  <path id="face" d="M 0 0 H 32.9 V 345 H 21.5 V 340.6 A 5.8 5.8 0 0 0 9.9 340.6 V 345 H 0 Z" fill="#c9ccd0" stroke="#8d9298" stroke-width="0.35"/>
