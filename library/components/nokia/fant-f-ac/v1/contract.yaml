  base-t: {term: Port, role: traffic, index-origin: 1, attrs: {media: rj45, speed: 1g}, description: 'the front uplink interface (FUI), the fixed 10/100/1000Base-T port Nokia counts among the five communication interfaces'}
  timing: {term: Port, role: management, index-origin: 1, mixed: 'network timing - the 1 PPS and 10 MHz GPS SMA jacks, the ToD/1PPS RJ45, and BITS in and BITS out / daisy-chain NTR output (RJ45)'}
  craft: {term: Port, role: management, index-origin: 1, attrs: {media: rj45-serial}, description: 'reaching the card locally - the LCRT craft RJ45 (LCMI)'}
  leds: {term: LED, role: indicator, index-origin: 1}
