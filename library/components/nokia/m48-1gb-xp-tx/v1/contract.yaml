    term: Connector
    role: traffic
    index-origin: 1
    attrs: {media: mrj21, speed: 1g}
    description: >-
      the 8 mini-RJ21 connectors, 1-8 left to right, each carrying six 10/100/1000 Ethernet ports
      (connector 1 ports 1-6 through connector 8 ports 43-48) to a breakout cable, as Table 13
      numbers them
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      the six Port LEDs in the grid at the left, 1, 3, 5 across the top and 2, 4, 6 across the
      bottom, showing the ports of the connector Push to Scroll has selected
  connector-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      the eight Connector LEDs at the right, 1, 3, 5, 7 across the top and 2, 4, 6, 8 across the
      bottom; the lit one is the connector selected
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the card lamps Stat and Pwr at the left
