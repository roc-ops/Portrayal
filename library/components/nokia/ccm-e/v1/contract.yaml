  screw-right: {at: [179.0, 1.9], size: [11.0, 11.0], class: screw}
  dte-dce: {at: [21.9, 4.4], size: [7.7, 5.2], class: control}
  aco-lt: {at: [117.7, 18.9], size: [6.2, 6.2], class: control}
  cf-slot: {at: [129.8, 18.2], size: [46.1, 7.5], class: slot}
  cf-eject: {at: [176.4, 18.0], size: [5.7, 4.7], class: control}
  logo-zone: {at: [76.0, 28.0], size: [30.0, 5.0], class: label}
relief:
  features:
  - {node: screw-left, cyl: 1.6, knurl: true, confidence: estimated, source: 'nokia/nelt-b@1 captive screw head, itself borrowed from edgecore/agr-panel-screw@1. NOT MEASURED'}
  - {node: screw-right, cyl: 1.6, knurl: true, confidence: estimated, source: 'nokia/nelt-b@1 captive screw head, itself borrowed from edgecore/agr-panel-screw@1. NOT MEASURED'}
  - {node: aco-lt, cyl: 0.8, confidence: estimated, source: 'a short round push button standing just proud; nothing dimensions it'}
  - {node: cf-slot, pocket: 3.0, confidence: estimated, source: 'the CF card mouth, recessed; 3 is enough to read as a slot. Not dimensioned'}
groups:
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      reaching the router locally - the RJ-45 console (serial, with the DTE/DCE switch), the
      10/100 Mgmt Ethernet port and the 10/100 OES Ethernet port (the GMPLS-UNI control
      channel)
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the timing ports - BITS (DS1/E1 on RJ-45), SyncE/1588 (10/100 Ethernet on RJ-45) and
      the 1PPS output on SMB
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the module lamps Stat and Pwr
  timing-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the Lnk and Flt lamps of the BITS and SyncE/1588 jacks, drawn as dots at the jacks' latch edges
  alarm-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the office alarm lamps Critical, Major and Minor
