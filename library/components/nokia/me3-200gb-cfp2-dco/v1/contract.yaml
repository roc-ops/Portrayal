name: me3-200gb-cfp2-dco
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia 3-port CFP2-DCO MDA-e-XP (3HE13955AA), CLI type me3-200gb-cfp2-dco, for the 7750 SR-1
  (FP4) and the IOM5-e. Three CFP2 cages in bezels, c1 to c3 left to right, each taking a CFP2
  or a CFP2-DCO coherent optic (200GE; XP p92). A Lnk-over-Act lamp pair sits to the right of
  every cage and its cN legend below it; Stat and Pwr are at the left end, the model label at
  the lower right, an insertion handle at each top corner and a captive screw on each lower
  wing. On the SR-7 and SR-12 only the middle port takes a DCO and the system is held to 40C.
unplaced: >-
  seated by the 7750 SR-1 MDA slots (mda-1, mda-2) and, in later waves, the IOM5-e of the SR-7,
  SR-12 and SR-12e; the coordinator wires it.
size: {w: 193, h: 35.4, d: 193}
size-confidence: {w: drawing, h: drawing, d: datasheet}
size-notes: >-
  w and h are the shared 7750 MDA envelope (193.0 x 35.4) the slots are built to; the guide
  states 1.4 x 7.6 in, rounded to 0.1 in. d is the stated 7.6 in.
