<svg xmlns="http://www.w3.org/2000/svg" width="30mm" height="405mm" viewBox="0 0 30 405">
  <!-- Nokia 3FE 65651 AA, the NT-slot dummy front panel, 30 x 405, authored upright.
       From ETSI UDS 3FE77012AAAATQZZA18 Figure 38 (p137), an oblique drawing: positions
       along the panel are fractions of 405; across it, fractions of the plate's 90 px. -->
  <rect id="face" x="0" y="0" width="30" height="405" rx="0.5" fill="#c9ccd0" stroke="#9ba0a6" stroke-width="0.3"/>
  <g id="screw-top">
    <circle cx="17.5" cy="4.5" r="4.4" fill="#b3b7bc" stroke="#8d9298" stroke-width="0.25"/>
    <circle cx="17.5" cy="4.5" r="3.8" fill="#2e3236" stroke="#15171a" stroke-width="0.3"/>
    <circle cx="17.5" cy="4.5" r="1.9" fill="#6f757b" stroke="#15171a" stroke-width="0.2"/>
    <path d="M 16.5 4.5 H 18.5 M 17.5 3.5 V 5.5" stroke="#15171a" stroke-width="0.35"/>
  </g>
  <g id="screw-bottom">
    <circle cx="17.5" cy="397.5" r="4.4" fill="#b3b7bc" stroke="#8d9298" stroke-width="0.25"/>
    <circle cx="17.5" cy="397.5" r="3.8" fill="#2e3236" stroke="#15171a" stroke-width="0.3"/>
    <circle cx="17.5" cy="397.5" r="1.9" fill="#6f757b" stroke="#15171a" stroke-width="0.2"/>
    <path d="M 16.5 397.5 H 18.5 M 17.5 396.5 V 398.5" stroke="#15171a" stroke-width="0.35"/>
  </g>
  <g id="esd-mark">
    <circle cx="15.3" cy="14.8" r="2.4" fill="none" stroke="#1d2023" stroke-width="0.3"/>
    <path d="M 15.3 13.1 L 16.8 15.8 L 13.8 15.8 Z" fill="#1d2023"/>
  </g>
  <g id="part-label">
    <rect x="10.9" y="354.3" width="9.3" height="19.1" fill="#f2f2f2" stroke="#6f757b" stroke-width="0.2"/>
    <rect x="16.4" y="356.0" width="1.6" height="15.7" fill="#9ea3a9"/>
    <rect x="13.2" y="356.0" width="1.6" height="15.7" fill="#9ea3a9"/>
  </g>
  <rect id="logo-zone" x="5.0" y="190.0" width="20.0" height="12.0" fill="none"/>
</svg>
