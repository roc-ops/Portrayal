format: 1
kind: module
name: m4-10gb-xp-xfp
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia (Alcatel-Lucent) 7750 SR / 7450 ESS 4-port 10GBASE XFP MDA-XP, M4-10GB-XP-XFP
  (3HE03686AA; ESS 3HE03688AA), a classic half-slot MDA for the IOM3-XP: four XFP cages in a
  row, 1-4 left to right, each with its Lnk, Act and Laser Disabled lamps beneath it, the Stat
  and Pwr lamps at the far left, a WAN lamp at the upper right, the model legend at the lower
  right and a cross-slotted captive screw on each lower end wing. Authored horizontal; an
  SR-12 IOM3-XP seats it on end with the carrier.
size: {w: 190.5, h: 35.4, d: 177.8}
size-confidence: {w: datasheet, h: drawing, d: datasheet}
size-notes: >-
  The chassis guides give MDAs 1.4 x 7.5 x 7.0 in (3.56 x 19.05 x 17.78 cm, SR7 p106 Table 47).
  Held at 190.5 x 35.4 so it seats in the IOM3-XP's MDA bays on the 35.4 slot pitch; Figure 8
  is fitted per axis to that face.
attrs:
  model: M4-10GB-XP-XFP
  part-number: 3HE03686AA
  part-number-variants: 3HE03686AA (7750 SR), 3HE03688AA (7450 ESS)
  xfp: 4
  power-draw-max-w: 60
provenance:
  sources: >-
    datasheet - 7x50 MDA-XP Installation Guide 9302180206 (MXP): p36 Figure 8 and p36-37 Table 8
    (the face, its lamps and screws), p18 Table 2 (power), p16 (the model list). SR7 22.7
    3HE18643AAAATQZZA03 p106 Table 47 (MDA size) and p105 Table 45 (power, 60 W); SR7 15.1
    3HE14151AAAATQZZA02 p97 Table 32 (part numbers, "7750 SR 4-port 10GBASE - XFP MDA-XP"; p91
    says the bracketed number is the 7450 ESS part).
  size: 'datasheet - SR7 p106 Table 47; see size-notes'
  layout: >-
    drawing - MXP p36 Figure 8 (art MDA0062), vector (pdfimages finds no raster), rendered at
    1200 dpi. Fitted per axis exactly as the M10-1GB-XP-SFP's Figure 9: 4618 px between the
    plate's side lines to 190.5 (24.24 px/mm) and 847 px from the top line to the bottom of the
    centre band to 35.4 (23.93 px/mm). The outline is the classic MDA's and measures the same:
    end wings to y 28.25, notches to x 15.51 and 174.99, the band's inner line at y 33.33, the
    top lip at y 1.55; the blocks outside each side line are the side guides, not face. The
    plate's contents sit about 0.2 left and 0.1 higher than in Figures 4 and 5; each figure is
    measured on its own. XFP boxes (key 3) drawn 20.0 x 10.37, y 3.57-13.94, centres x 40.19,
    77.19, 114.17 and 151.16 at y 8.76, a 36.99 pitch. Lamps drawn 2.7 across: Stat (11.14,
    6.25) and Pwr (11.14, 11.41), legends to the left; under each cage Lnk, Act and Laser
    Disabled at y 18.08, 8.4 apart, x 31.81/40.22/48.64, 68.81/77.22/85.64,
    105.79/114.21/122.62 and 142.77/151.19/159.60, legends below; WAN (179.73, 6.27). Port
    numbers 1-4 left of their cages at x 26.7, 63.8, 101.0, 137.8. Captive screws (key 9)
    centred (7.6, 22.9) and (183.0, 22.9), heads 8.2 in a 10.0 ring, cross-slotted; the tab
    under the left screw 1.55 deep, under the right 3.1. Model legend M4-10GB-XP-XFP (key 8),
    bold, ending at x 172.3, baseline 32.1.
  cages: >-
    drawing + standard - each port is a std/xfp@1 (INF-8077i aperture 19.5 x 9.7) centred on its
    drawn box, which is barely larger than the aperture and is drawn as the bezel. The 36.99
    pitch is above the MSA's 23.5 floor. ORIENTATION IS NOT READ: the figure draws empty boxes
    with no latch or bail, and no photograph of this card is held, so every cage takes rotate 0.
  lamps: >-
    datasheet - MXP p36-37 Table 8: Status green blinking initializing, green up, amber
    operationally down, unlit administratively down; Power blue on, off no power; Lnk green
    link at 10000 Mbps, amber slow blinking no XFP installed, amber optics installed but no
    link, unlit disabled; Act green active, amber error, unlit no activity; Laser Disabled amber
    laser disabled, off laser on; WAN green all ports configured for 10GBASE WAN PHY framing,
    unlit not.
  power: 'datasheet - MXP p18 Table 2: M4-10GB-XP-XFP 60 W maximum; SR7 15.1 p97 and SR7 22.7 p105 Table 45 agree. XFP optics 4 W each (MXP Table 3), not included'
  colour: >-
    estimated - no photograph of a classic MDA is held (the public Ethernet MDA-XP datasheet
    would settle it). Drawn in the charcoal of the SR-7/SR-12 card family. A gap.
  logo-zone: 'none reserved - the four cages, their lamps and the WAN lamp fill the plate, and Figure 8 draws no mark'
  depth: 'datasheet - 7.0 in (17.78 cm), SR7 p106 Table 47'
  lifecycle: 'searched only the staged corpus; the MDA-XP guide and the SR7 15.1 and 22.7 guides list it'
  gaps: >-
    Colour is estimated. The cage orientation is not read. The mda-type CLI string is not
    printed for this card in anything held.
