format: 1
kind: module
name: me2-100gb-qsfp28
version: 1.0.0
class: line-card
behaviour: fills
profile: networking
description: >-
  Nokia 2-port 100GE QSFP28 MDA-e (3HE11031AA), CLI type me2-100gb-qsfp28, for the 7750 SR-e
  front MDA slots and the IOM4-e. Authored horizontal, as MDA-e guide 20.2 p57 Figure 14 draws
  it: Stat and Pwr at the left end, then for each port its Lnk and Act lamps to the left of a
  QSFP28 cage (QSFP+ also accepted), ports printed 1 and 2 left to right, the ESD mark at the
  top right, the model label ME2-100GB-QSFP28 at the lower right and a captive screw on each
  lower wing. Stat: blinking green initialising, green up, amber operationally down, unlit
  admin down. Pwr: blue on, unlit no power. Lnk: green link at 100G; amber slow blink no
  optic; amber fast blink loopback; amber optics but no link; unlit disabled. Act: green
  active; amber error; unlit no activity.
size: {w: 193.0, h: 35.4, d: 195.6}
size-confidence: {w: drawing, h: drawing, d: datasheet}
size-notes: >-
  w and h are the shared 7750 MDA envelope (193.0 x 35.4) the SR-e slots are built to;
  the guide states 1.4 x 7.6 in, rounded to 0.1 in. d is the stated 7.7 in.
attrs:
  model: ME2-100GB-QSFP28
  part-number: 3HE11031AA
  cli-type: me2-100gb-qsfp28
  qsfp28: 2
  weight-kg: 1.0
  power-draw-max-w: 89
  power-draw-typical-w: 72
provenance:
  size: >-
    datasheet - MDA-e Installation Guide 3HE16330AAAATQZZA02 (20.2) p17 Table 4: H x W x D 1.4
    x 7.6 x 7.7 in (3.6 x 19.3 x 19.6 cm). The face is held at 193.0 x 35.4, the shared 7750
    wave-1 MDA envelope: 1.4 in (35.56) is rounded to 0.1 in, and the SR-3e slot pitch
    measures 35.43 (SRE 3HE17927AAAATQZZA03 p50 Fig 10), so stacked slots tile at 35.4. The
    figure agrees: the plate is 4016 x 732 px at 1200 dpi, aspect 5.49 = 193.0 / 35.2
  depth: >-
    datasheet - 7.7 in (19.6 cm), MDA-e guide p17 Table 4; carried as 195.6
  shape: >-
    drawing - the plate is notched at both lower corners, as every MDA-e faceplate figure
    draws it: the full 35.4 band runs x 16.2 to 176.8 and the two end wings stop 27.3 below
    the plate top, with a 2.4 fillet where wing meets band (1200 dpi render, 20.81 px/mm
    across and 20.68 px/mm down). The notches are transparent in the skin. The thin strip the
    figure draws above the plate is the card's top edge in slight perspective and is not face
  thumbscrews: >-
    drawing - two captive screws (Table key 'Captive screws'), one on each lower wing. The
    figure measures centre 7.8-8.0 in from each end and 21.0 below the plate top, head 10.6
    across; the wave-1 family figure (7.8 / 20.8 / 10.3) is used, which this figure agrees
    with to 0.3 mm. MDA-e has no insertion handles (MDA-e-XP has)
  esd-mark: >-
    drawing - the ESD warning triangle at the top right, 183.5-189.7 x 3.0-8.6; yellow is the
    family colour the 7750 conventions record, not read from this figure (gap)
  colour: >-
    estimated - no photograph of this card is staged. Charcoal plate, light legends, silver
    screws and a yellow ESD mark are the 7750 wave-1 family estimate (dark MDA faceplates with
    a yellow ESD mark at the top right). Gap until a datasheet cut-out or photo is staged
  lifecycle: >-
    searched only the staged corpus - listed in the MDA-e guides from 14.0 to 20.2
    (3HE16330AAAATQZZA02); no end-of-sale notice was searched for
  lamps: >-
    datasheet - LED colours and states from the card's Features and LEDs table (quoted per
    lamp in the part's description). The guide gives 'slow' and 'fast' amber blinking for Lnk
    without rates: slow is carried as plain blinking and fast as 4 Hz, an ESTIMATE (gap).
    Positions measured on the figure: Stat and Pwr at (11.6, 7.6) and (11.6, 11.7), drawn 2.35
    across
  logo: >-
    drawing - the figure draws no vendor mark on the plate, so no logo-zone is reserved; the
    only printed text besides the legends is the model label at the lower right
  weight: >-
    datasheet - 2.2 lb (1 kg), MDA-e guide p17 Table 4
  power: >-
    datasheet - MDA-e guide p16 Table 3: idle 0, zero rate 69, typical 72, worst case 89 W.
    Max is the worst case (55C, 100%), typical the typical figure. Optics are NOT included
  layout: >-
    drawing - MDA-e guide 3HE16330AAAATQZZA02 p57 Figure 14 (art 25993), vector, rendered at
    1200 dpi. Cages drawn 21.05 x 10.59 over their outline (std/qsfp28 is 20.0 x 10.15),
    centred at (46.81, 17.97) and (155.97, 17.97); the std cages are centred there. Lamps port
    1 Lnk (32.32, 16.03), Act (32.32, 21.11); port 2 at x 141.46. Lnk above and Act below each
    lamp pair
  ports: >-
    datasheet - Table 2: two ports, each a 100GE QSFP28 or 40GE QSFP+; Sync-E, clause 91 FEC
