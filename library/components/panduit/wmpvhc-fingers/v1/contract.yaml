format: 1
kind: component
name: wmpvhc-fingers
version: 1.0.0
class: mechanical
description: >-
  Half of one section of fingers of a Panduit NetRunner WMPVHC45E vertical manager seen end-on -
  fifteen ABS fingers one rack unit apart down one side of a channel, 25.4 mm of opening between
  each pair that cables are laid in through. Three a side make the 45 fingers a face
provenance:
  size: >-
    drawing - the WMPVHC45E customer drawing (Panduit 10225-25 sheet 1), Detail A: a finger is 4.73
    [120.1] long across the front and the opening between two fingers is 1.00 [25.4], the rack
    unit's 44.45 pitch less a 19.05 finger. The specification sheet (RKSP112): "gaps between the fingers
    are spaced so that they align with EIA rack spaces", "each [large finger opening] accommodates up
    to 24 Category 6 cables". THE FINGER IS ONE LOOP ACROSS THE WIDTH: IT IS DRAWN AS TWO 40 MM HALVES,
    ONE FROM EACH SIDE, so that the central holes of the backbone lie clear of the fingers (lint L136);
    the 40 and the 19.05 height (the pitch less the stated gap) are estimates of the drawing.
  relief: >-
    drawing - the plan view: the fingers stand out of the backbone into the channel; the channel is the
    166.1 of the drawing and the fingers are taken 150 out of it, ESTIMATED: the sheet's plan draws
    the section and not the fingers' length. They are hollow loops in the maker's drawing and built
    as solid blocks.
  color: >-
    datasheet - "Finger Material: ABS", "The manager is black" on the product page. The shade is this
    library's render of black ABS.
