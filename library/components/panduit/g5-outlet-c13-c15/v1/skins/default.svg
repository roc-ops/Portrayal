  <g id="nose">
    <path d="M 5 2.4 H 19 A 1.6 1.6 0 0 1 20.6 4 V 31 A 1.6 1.6 0 0 1 19 32.6 H 5 L 3.4 31 V 4 Z" fill="#777674" stroke="#4a4a49" stroke-width="0.2"/>
    <path d="M 6 5 H 10 V 8.4 H 6 Z" fill="#0b0b0b"/>
    <path d="M 6 26.6 H 10 V 30 H 6 Z" fill="#0b0b0b"/>
    <path d="M 14.6 15 H 18 V 20 H 14.6 Z" fill="#0b0b0b"/>
  </g>
