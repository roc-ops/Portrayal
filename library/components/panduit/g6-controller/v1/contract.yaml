format: 1
kind: module
name: g6-controller
version: 1.0.0
class: nic
behaviour: fills
profile: power
description: >-
  The controller of a Panduit G6 intelligent PDU, a plate midway along the strip. It has a display window and three
  round buttons labelled Select, Menu and Scroll. It also has two lamps labelled Status and Reset, five RJ45 jacks and a USB-A port.
size: {w: 47.0, h: 127.8, d: 40}
size-confidence: {w: drawing, h: drawing, d: estimated}
attrs: {module: G6 controller}
provenance:
  method: >-
    drawing - Panduit customer drawing P42G20G-XXYZ_DC rev 00A is a vector sheet drawn to no stated scale. Its scale
    was taken from its own 1780.0 overall dimension. The front view was rendered at 1500 dpi (7.1 px/mm), and every
    figure and label below was read off that rendering, to about 0.5 mm. The drawing lies the PDU down with the cord
    end left. This part is drawn as the PDU stands, cord end down, so the printed legends read upside down.
  size: >-
    drawing - the rounded face is 128.0 along the PDU by 46.9 across on the drawing. That matches the 127.8 by 47.0 of
    the G5 plate and is kept. The display window is 36.0 along by 20.7 across and each button is 7.3 across.
    The five jack cells are 16.4 to 17.1 along by 16.2 to 17.1 across.
  labels: >-
    drawing - the 1500 dpi rendering of the front view prints these legends. Select, Menu and Scroll sit beside the
    three buttons. Status and Reset sit beside two small circles. Serial sits beside the lone jack.
    Ethernet/PDU In, PDU Out, Sensor-2 and Sensor-1 sit beside the 2 by 2 group. USB sits beside the USB-A port.
    The maker's wordmark is printed too. Each jack is named by its printed label and by nothing beyond it.
    The G5 drawing prints the same legends.
  ports: >-
    drawing - five RJ45-shaped jacks and one USB-A jack. The Serial jack is drawn as an RJ45 body, because no held page
    states its standard. The manual IM064 (pages 6 and 7) names Dual 1Gb Ethernet and up to six physical sensors. It
    does not say which jack is which. Each jack is typed as a telemetry jack (`media: rj45-telemetry`),
    which says only that none is exported as an Ethernet interface. The upper row of the 2 by 2 group is drawn with the
    latch notch toward the plate's left edge, and the lower row mirrored.
  lamps: >-
    drawing - the Status and Reset circles are 2.8 across and are drawn off. No held page gives the colour or meaning
    of either lamp, so no colour is stated. The drawing prints Reset beside its circle, and no held page says whether
    it holds a lamp or a pinhole. The manual IM064 (page 21) says switched units show a light for each outlet,
    which is not on this plate.
  display: >-
    drawing - the display window is drawn as a plain dark rectangle. The sheet PUSP97 (page 1) and the manual IM064 (page 6)
    call it an OLED display. No held page gives its resolution or its colour, so no characters are stated.
  depth: >-
    estimated - no document held shows the controller's depth, so 40 is chosen to sit inside the body, as for the G5 plate.
  colour: >-
    NOT CHECKED - no photograph is held, so the plate's colour is a dark neutral and the display window a darker one.
    Neither is read from a source.
  power: >-
    no document held states the controller's own draw; L27 stands as the record.
groups:
  jacks: {term: Port, role: management, index-origin: 1, mixed: 'the controller''s five RJ45 jacks and its USB-A port, each named by its printed label. No document held says which is network, which sensor or which daisy chain'}
