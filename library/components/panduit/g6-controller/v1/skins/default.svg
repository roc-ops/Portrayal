<svg xmlns="http://www.w3.org/2000/svg" width="47mm" height="127.8mm" viewBox="0 0 47 127.8">
  <!-- The controller plate of a Panduit G6 intelligent PDU as drawing P42G20G-XXYZ_DC draws it, in the standing frame.
       The legends are the drawing's own, upside down because the drawing lies the PDU down and the library stands it. -->
  <rect id="faceplate" x="0" y="0" width="47" height="127.8" rx="1.5" fill="#18191b" stroke="#3a3d41" stroke-width="0.25"/>
  <rect id="display" x="17.9" y="77.2" width="20.5" height="35.8" fill="#0c0d0e" stroke="#4a4d51" stroke-width="0.3"/>
  <circle id="button-select" cx="8.7" cy="105.95" r="3.65" fill="none" stroke="#6b7076" stroke-width="0.3"/>
  <circle id="button-menu" cx="8.7" cy="93.55" r="3.65" fill="none" stroke="#6b7076" stroke-width="0.3"/>
  <circle id="button-scroll" cx="8.7" cy="81.15" r="3.65" fill="none" stroke="#6b7076" stroke-width="0.3"/>
  <circle id="lamp-status" cx="26.9" cy="71.0" r="1.4" fill="var(--led-color, #1c1e22)" stroke="#6b7076" stroke-width="0.25"/>
  <circle id="lamp-reset" cx="41.2" cy="71.0" r="1.4" fill="var(--led-color, #1c1e22)" stroke="#6b7076" stroke-width="0.25"/>
  <rect x="5.5" y="46.1" width="16.2" height="19.6" fill="#141516" stroke="#34373b" stroke-width="0.2"/>
  <rect x="30.1" y="46.2" width="11.2" height="19.5" fill="#141516" stroke="#34373b" stroke-width="0.2"/>
  <rect x="5.5" y="28.6" width="17.1" height="16.4" fill="#141516" stroke="#34373b" stroke-width="0.2"/>
  <rect x="23.4" y="28.6" width="16.8" height="16.4" fill="#141516" stroke="#34373b" stroke-width="0.2"/>
  <rect x="5.5" y="11.5" width="17.1" height="15.8" fill="#141516" stroke="#34373b" stroke-width="0.2"/>
  <rect x="23.4" y="11.5" width="16.8" height="15.8" fill="#141516" stroke="#34373b" stroke-width="0.2"/>
  <g id="silkscreen" font-family="sans-serif" fill="#c9ccd0" text-anchor="middle">
    <text x="8.4" y="112.4" font-size="2.6" transform="rotate(180 8.4 111.4)">Select</text>
    <text x="8.4" y="99.8" font-size="2.6" transform="rotate(180 8.4 98.8)">Menu</text>
    <text x="8.4" y="87.4" font-size="2.6" transform="rotate(180 8.4 86.4)">Scroll</text>
    <text x="13.6" y="69.1" font-size="2.6" transform="rotate(180 13.6 68.1)">Serial</text>
    <text x="12.6" y="47.0" font-size="2.2" transform="rotate(180 12.6 46.2)">Ethernet/PDU In</text>
    <text x="30.7" y="47.2" font-size="2.6" transform="rotate(180 30.7 46.2)">PDU Out</text>
    <text x="13.0" y="10.4" font-size="2.6" transform="rotate(180 13.0 9.4)">Sensor-2</text>
    <text x="31.8" y="10.4" font-size="2.6" transform="rotate(180 31.8 9.4)">Sensor-1</text>
    <text x="33.9" y="69.1" font-size="2.6" transform="rotate(180 33.9 68.1)">USB</text>
    <text x="26.7" y="75.5" font-size="2.6" transform="rotate(180 26.7 74.5)">Status</text>
    <text x="42.0" y="75.5" font-size="2.6" transform="rotate(180 42.0 74.5)">Reset</text>
    <text x="23.4" y="123.2" font-size="7.0" font-weight="bold" textLength="35" lengthAdjust="spacingAndGlyphs" transform="rotate(180 23.4 120.3)">PANDUIT</text>
  </g>
</svg>
