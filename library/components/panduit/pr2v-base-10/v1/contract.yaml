    drawing - the table of the PR2VD customer drawing (Panduit 14V455LV-DC): PR2VD10 254.0 [10.00 in]
    wide, 2130.4 [83.88 in] high, 526.4 [20.7 in] deep overall; the product page gives the same
    (254 x 2130.4 x 526.4 mm); the maker's catalogue bulletin states 84.0 and 20.6 in.
  depth: >-
    estimated - 303. The overall depth is the maker's 526.4; the backbone is taken 20.4 thick and the
    rest shared between the channels in the ratio of the calculator's front and rear areas (82.31 and
    52.21 sq in for the PR2VD10), 1.6:1, which the plan view's backbone line (41 per cent of the depth
    from the back) agrees with.
  size-holes: >-
    drawing - the 3.0 in Ø [76.2 mm] "CABLE PASS THROUGH" the PR2VD drawing's page 2 labels, four a 7 ft
    manager, centred on the width, 393, 865, 1337 and 1809 mm below the top. The pitch (472 mm) and
    the first and last are read off the drawing at 150 dpi: ESTIMATED, to about 10 mm.
  color: >-
    datasheet - "Body Material: Steel", "The manager is black" on the PR2VD10 product page. The shade
    is this library's render of black powder-coated steel.
