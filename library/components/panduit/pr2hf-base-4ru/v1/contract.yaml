format: 1
kind: component
name: pr2hf-base-4ru
version: 1.0.0
class: mechanical
description: >-
  The mounting plate of a Panduit PatchRunner 2 PR2HF4 4RU horizontal manager seen from the front,
  ears and all, with its two front-to-rear pass-through windows - drawn as the well the channel's
  two walls of fingers stand in, its floor the front face of the plate
provenance:
  size: >-
    drawing - the table of the PR2HF customer drawing (Panduit 00224EAE-DC): PR2HF4 177.0 [6.97 in]
    high, 483.9 [19.05 in] wide over the ears, 201.7 [7.94 in] overall depth, 181.4 [7.14 in] mounting
    depth. The ears are the ends of the plate, as the drawing's front view draws them, so the plate is
    drawn the full width.
  depth: >-
    drawing - 181.4. The drawing's "D=MOUNTING DEPTH" is the distance from the front of the manager to
    the plane its ears bolt to; the 20.3 behind it (201.7 overall) is the plate's back. The well is
    the 181.4 in front of the plate.
  size-holes: >-
    drawing - the front view's two windows, read at 300 dpi against the 177.0 height (2.955 px/mm):
    118 wide, 147 high (15 from the top and bottom edges), 94 and 270 from the left edge, the pair
    centred on the plate. ESTIMATED: no view dimensions them. The corner radius, 10, is estimated.
  color: >-
    datasheet - "The manager is white" on the PR2HF4WH product page (ABS body). The shade is this
    library's render of white ABS.
size: {w: 483.9, h: 177, d: 181.4}
size-confidence: {w: drawing, h: drawing, d: drawing}
relief: {wall: '#cfd2d4'}
elements:
  floor: {at: [0.0, 0.0], size: [483.9, 177], class: bezel}
skins: [default]
