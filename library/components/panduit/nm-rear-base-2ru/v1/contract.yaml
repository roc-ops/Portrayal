description: >-
  The back of the mounting plate of a Panduit NetManager High Capacity 2RU front-and-rear
  horizontal manager (NM2) seen from behind, between the ears, with its two front-to-rear
  pass-through windows - drawn as the well the rear channel's five D-rings stand in, its floor
  the rear face of the plate
provenance:
  size: >-
    drawing - the NM2 customer drawing (Panduit 10404-20): 482 [19.0 in] over the ears, 88 [3.5 in]
    high; the body between the ears is the 444.83 of nm-base-2ru, ESTIMATED by the likeness to
    the NCMH2 drawing (00787-07).
  depth: >-
    drawing - 175. The drawing dimensions the whole manager "13.1 REF [332]" and the front channel
    "5.5 REF [140]"; the plate and flange are the 17.3 of the NMF2's "6.2 REF [157]", so the rear
    channel is the 332 less 157, 175 mm out of the plate's back face.
  size-holes: >-
    drawing - the same two windows as the front (see nm-base-2ru): they go through the plate, so
    the rear floor is open where they are. ESTIMATED: no view dimensions them.
  color: >-
    datasheet - "The manager is black" on the NM2 product page (ABS body); the shade is this
    library's render of black ABS.
