format: 1
kind: component
name: nm-base-1ru
version: 1.0.0
class: mechanical
description: >-
  The mounting plate of a Panduit NetManager High Capacity 1RU horizontal manager (NM1 and
  NMF1) seen from the front, between the ears, with its two front-to-rear pass-through
  windows - drawn as the well the front channel's two walls of fingers stand in, its floor
  the front face of the plate
provenance:
  size: >-
    drawing - the front view of the NM1 and NMF1 customer drawings (Panduit 10404-19 and
    10404-15): 482 [19.0 in] over the ears, 465 [18.3 in] between the fixing holes, 44 [1.7 in]
    high. The body between the ears is taken as 444.83, as nm-base-2ru does: ESTIMATED by the
    likeness to the NCMH2 drawing (00787-07).
  depth: >-
    drawing - 139.7. Both customer drawings dimension the front channel "5.5 REF [140]" and the NMF1
    "6.2 REF [157]"; the plate and flange are the 17.3 behind. The well is the 139.7 in front of
    the plate.
  size-holes: >-
    drawing - the front view's two windows, read at 130 dpi against the 482 width: two stadiums
    98.5 wide and 17 high, centred 109.7 either side of the middle (the 2RU's windows,
    shortened to fit the 44). ESTIMATED: no view dimensions them.
  color: >-
    datasheet - "The manager is black" on the NM1 and NMF1 product pages (ABS body); the shade
    is this library's render of black ABS.
size: {w: 444.83, h: 44, d: 139.7}
size-confidence: {w: estimated, h: drawing, d: drawing}
relief: {wall: '#232527'}
elements:
  floor: {at: [0.0, 0.0], size: [444.83, 44], class: bezel}
skins: [default]
