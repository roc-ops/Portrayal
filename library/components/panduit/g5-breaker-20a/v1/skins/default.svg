<svg xmlns="http://www.w3.org/2000/svg" width="46.6mm" height="70.2mm" viewBox="0 0 46.6 70.2">
  <!-- A Panduit B-series breaker plate as drawing P24B14M_DC draws it: the plate, four screws, the
       rocker's window and the breaker's number and lines. Drawn in the drawing's frame (u along the
       PDU from the cord end, v across) and turned to the standing PDU, so the printing reads bottom to top. -->
  <g id="plate" transform="matrix(0,-1,1,0,0,70.2)">
    <rect x="0" y="0" width="70.2" height="46.6" rx="2.2" fill="#232528" stroke="#3b3e42" stroke-width="0.3"/>
    <circle cx="11.8" cy="12.9" r="2.6" fill="#4d5257" stroke="#6b7076" stroke-width="0.2"/>
    <circle cx="55.6" cy="12.9" r="2.6" fill="#4d5257" stroke="#6b7076" stroke-width="0.2"/>
    <circle cx="11.8" cy="32.6" r="2.6" fill="#4d5257" stroke="#6b7076" stroke-width="0.2"/>
    <circle cx="55.6" cy="32.6" r="2.6" fill="#4d5257" stroke="#6b7076" stroke-width="0.2"/>
    <rect x="15.9" y="22.5" width="26.8" height="19.2" fill="#0b0b0c" stroke="#3b3e42" stroke-width="0.2"/>
    <rect id="rocker" x="22.0" y="26.5" width="12.0" height="11.2" rx="0.6" fill="#1b1c1e" stroke="#4d5257" stroke-width="0.2"/>
  </g>
  <g id="silkscreen" font-family="sans-serif" fill="#d9dbde">
    <text x="14.0" y="34.3" font-size="7.2" text-anchor="middle" transform="rotate(-90 14.0 34.3)" data-from="label">B1</text>
    <text x="23.3" y="8.2" font-size="3.6" text-anchor="middle" transform="rotate(180 23.3 7.0)" data-from="lines">L1-L2</text>
  </g>
</svg>
