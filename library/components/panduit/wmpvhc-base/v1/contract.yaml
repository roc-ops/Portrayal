name: wmpvhc-base
version: 1.0.0
class: mechanical
description: >-
  The backbone of the Panduit NetRunner WMPVHC45E 45RU vertical manager seen from the front or the
  back, with its eight oval pass-through holes - drawn as the well one channel's finger columns
  stand in, its floor the face of the backbone. The same part serves the front and the rear
provenance:
  size: >-
    drawing - the WMPVHC45E customer drawing (Panduit 10225-25 sheet 1): 6.7 [170] wide and 83.0 [2108]
    high ("2- 22.5RU cable management sections", each 41.5 in [1054]).
  depth: >-
    drawing - 166.1. The drawing's plan dimensions "6.54 [166.1]" from the front of a channel to the
    backbone and 14.1 [357] overall, so the backbone is 24.8 thick and the two channels are 166.1
    each; the calculator gives the manager equal front and rear usable areas (30.7 sq in each),
    which agrees.
  size-holes: >-
    drawing - the sheet's view of the backbone: "8X 2.20 [55.9]" wide, "4X 5.20 [132.1]" and "4X 2.70
    [68.6]" long, four of each, centred on the width. Each 22.5RU section carries two long and two short
    ones, a short at each end. THEIR PLACES DOWN THE LENGTH ARE READ OFF THE VIEW AT 220 dpi AND ARE
    ESTIMATED to about 30 mm: centres 77, 377, 667 and 948 mm below the top of a section, the two
    sections alike.
  color: >-
    datasheet - "Body Material: ABS", "The manager is black" on the product page. The shade is this
    library's render of black ABS.
