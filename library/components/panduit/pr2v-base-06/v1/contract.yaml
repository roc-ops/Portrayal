description: >-
  The steel backbone of the 6 in wide Panduit PatchRunner 2 vertical manager (PR2VSD06) seen from
  the front, with its four round pass-through holes - drawn as the well the front channel's finger
  columns stand in, its floor the front face of the backbone
provenance:
  size: >-
    drawing - the table of the PR2VSD customer drawing (Panduit 14V455MW-DC): PR2VSD06 152.4 [6.00 in]
    wide, 2130.4 [83.88 in] high, 526.4 deep overall; the maker's catalogue bulletin states 84.0 and 20.6
    in for the 45RU managers. The PR2VD** drawing 14V455LV-DC gives the same 152.4 x 2130.4 x 526.4.
  depth: >-
    estimated - 303. The overall depth is the maker's 526.4; the backbone is taken 20.4 thick and the
    rest shared between the channels in the ratio of the calculator's front and rear areas
    (45.11 and 27.26 sq in for the PR2VD06; 63.71 and 39.73 for the PR2VD08), 1.6:1, which the
    plan view's backbone line (41 per cent of the depth from the back) agrees with.
  size-holes: >-
    drawing - the 3.0 in Ø [76.2 mm] "CABLE PASS THROUGH" the PR2VD drawing's page 2 labels, four a 7 ft
    manager, centred on the width, 393, 865, 1337 and 1809 mm below the top. The pitch (472 mm) and
    the first and last are read off the drawing at 150 dpi: ESTIMATED, to about 10 mm.
  color: >-
    datasheet - "Body Material: Steel", "The manager is black" on the product pages. The shade is
    this library's render of black powder-coated steel.
