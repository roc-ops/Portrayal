format: 1
kind: component
name: ncmh2-rear-fingers
version: 1.0.0
class: mechanical
description: >-
  One wall of fingers of the rear channel of a Panduit NetManager NCMH2 2RU front-and-rear
  horizontal manager seen from behind - the row along the top or the bottom edge of the
  channel, twelve arched fingers end-on with a space between each pair that a cable is laid in
  through
provenance:
  size: >-
    drawing - the plan view of the NCMH2 customer drawing (Panduit 00787-07), read at 300 dpi
    against its 17.51 [444.83] dimension: the rear section's fingers stand on the same 34.9 mm
    pitch as the front's (eleven arches and an end piece at each side were counted), so twelve
    fingers 25.4 across on a 34.925 pitch are taken, as ncmh2-fingers. ESTIMATED: the count and the
    finger's width are read off a plan, not dimensioned. The specification sheet's "el radio de
    curvatura para los dedos en la parte trasera es de 3/8"" [9.5 mm] gives the bend radius.
  relief: >-
    drawing - the plan view: the rear fingers stand out of the plate's back face towards the rear
    cover; 100 mm is taken, ESTIMATED, so that the channel's depth is close to the 86 mm that
    Panduit's calculator area (8 sq in rear) divides into over the 60.0 clear height. Built as
    plates with square corners where the finger is an arch.
  color: >-
    datasheet - "Finger Material: Polycarbonate", "The manager is black" on the product page. The
    shade is this library's render of black polycarbonate.
