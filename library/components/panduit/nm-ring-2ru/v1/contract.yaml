format: 1
kind: component
name: nm-ring-2ru
version: 1.0.0
class: mechanical
description: >-
  An open D-ring of the rear channel of a Panduit NetManager High Capacity 2RU front-and-rear
  horizontal manager (NM2) seen from behind - a moulded loop standing 175 mm out of the plate's
  back face, 15 mm across, whose far end is a hook that leaves the rest open so a cable is laid
  in. Five stand along the rear of the manager
provenance:
  size: >-
    drawing - the plan view of the NM2 customer drawing (Panduit 10404-20), read at 300 dpi against
    its 482 [19.0 in] width: five posts stand from the plate to the back of the rear channel,
    centred about 107 mm apart (the five were measured 103, 112, 111 and 102 apart on the NM1's
    plan) and each about 15 mm across along the run. Taken as five, 107 apart, the middle one on
    the centre line, 15 mm across. The ring's height is the 88 of the manager less 12, 76.
    ESTIMATED: the plan is a picture of the posts and no view gives their height or their cross
    section.
  relief: >-
    drawing - the plan view: each post runs the 175 mm of the rear channel from the plate to a
    foot at the back. The loop is drawn as a back leg on the plate, a top bar and a bottom bar the
    175 mm out and a hook at the far end across the lower third of the height, which leaves the upper
    two thirds open. THE BARS' THICKNESS (3) AND THE HOOK'S EXTENT ARE ESTIMATED: the plan shows the
    posts' foot, not the shape of the loop, and no side view of the rear channel is drawn.
    Built as plates with square corners where the moulding is curved.
  guide: >-
    datasheet - Panduit's Cable Capacity Calculator gives the NM2's rear usable area as 11.1 sq in
    [7161 mm2]. Over the clear height of the channel, the 88 less two 10 mm walls, 68, that is
    105 mm out of the plate: the opening is 68 across the run's height and 105 deep, ESTIMATED by
    that division. The specification sheet notes the rear section "may be partially blocked by
    rack posts".
  guide-depth: >-
    drawing - the ring is a band about 15 mm across along the run, as the plan draws the posts.
  material: >-
    datasheet - the NM2 product page lists an ABS body and ABS fingers.
  color: >-
    datasheet - "The manager is black" on the product page. The shade is this library's render of
    black ABS.
size: {w: 15, h: 76}
size-confidence: {w: estimated, h: estimated}
