name: ncmh2-base
version: 1.0.0
class: mechanical
description: >-
  The mounting plate of a Panduit NetManager NCMH2 or NCMHF2 2RU horizontal manager seen from the
  front, between the ears, with its two front-to-rear pass-through windows - drawn as the well
  the front channel's two walls of fingers stand in, its floor the front face of the plate
provenance:
  size: >-
    drawing - the front view of the NCMH2 customer drawing (Panduit 00787-07): 482.59 [19.00 in]
    over the ears, 465.07 [18.31 in] between the fixing holes, 88.14 [3.47 in] high, and the 444.83
    [17.51 in] the NCMHF2 drawing (00787-10) dimensions for the body between the ears.
  depth: >-
    drawing - 82.27. The plan view of the NCMH2 drawing dimensions the front section "3.24 REF
    [82.27]" and the rear "6.51 REF [165.43]" of the 9.75 [247.71]; the NCMHF2 drawing dimensions
    its front "3.24 REF [82.40]" and the whole "3.74 REF [95.10]", so the plate and flange are the 13
    mm behind. The well is the 82.27 in front of the plate.
  size-holes: >-
    drawing - the front view's two windows, read at 300 dpi against the 444.83 dimension: 97.4 and
    99.6 wide (taken as 98.5), 38 high, 63.6 and 281.8 from the left edge of the body, centred on the
    height. ESTIMATED: no view dimensions them. The corner radius, 8, is estimated.
  color: >-
    datasheet - "The manager is black" on the product pages. The NCMH2 drawing lists a
    polycarbonate manager; the shade is this library's render of black polycarbonate.
