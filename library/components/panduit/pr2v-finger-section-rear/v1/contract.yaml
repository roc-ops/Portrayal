format: 1
kind: component
name: pr2v-finger-section-rear
version: 1.0.0
class: mechanical
description: >-
  One section of rear fingers of a Panduit PatchRunner 2 vertical manager (PR2VD08, PR2VD10 and
  PR2VSD06) seen from behind - fifteen ABS fingers one rack unit apart down one side of the
  rear channel, with a gap between each pair that a patch cord is laid in through. Three a side
  make the 45 fingers of a 45RU manager
provenance:
  size: >-
    drawing - the rear view of the PR2VD customer drawing (Panduit 14V455LV-DC), which draws
    "front and rear fingers" in the title: the rear channel carries a column of fingers down each side
    of the backbone, one to each rack unit, as the front does, in sections of fifteen (see
    pr2v-finger-section-front, which this repeats at the same pitch, height and reach, ESTIMATED).
  relief: >-
    drawing - the plan view: each rear finger stands out of the backbone's back into the rear
    channel. 175 mm is taken, ESTIMATED: the rear channel is shallower than the front, 158 against
    236 mm by the calculator's rear and front areas per inch of width (6.23 and 9.3 sq in). The
    finger is a hollow loop in the maker's drawing; it is built as a solid block.
  color: >-
    datasheet - "Finger Material: ABS", "The manager is black" on the PR2VD10 and PR2VSD06 product
    pages. The shade is this library's render of black ABS.
