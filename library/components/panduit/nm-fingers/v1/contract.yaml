format: 1
kind: component
name: nm-fingers
version: 1.0.0
class: mechanical
description: >-
  One wall of fingers of a Panduit NetManager High Capacity horizontal manager's front
  channel seen from the front - the row along the top or the bottom edge of the channel,
  twelve T-shaped inset fingers end-on, a stem with a crossbar at the front tip, and a slot
  between each pair that a patch cord is laid in through. The same wall on the NM1 to NM4 and
  the NMF1 to NMF4, at the top and at the bottom of the channel.
provenance:
  size: >-
    drawing - the plan view of the NMF2, NMF3, NM1 and NM2 customer drawings (Panduit 10404-16,
    V10404AI, 10404-19, 10404-20), measured at 300 dpi against the 482 [19.0 in] width of the
    same view: twelve T fingers, the crossbars on a 34.7 to 34.9 mm pitch (two views, 82.4
    px at 2.375 px/mm), each crossbar about 29.5 mm wide and the stem 5 mm, a slot 5.4 mm
    wide between the crossbar tips. The pitch is taken as 34.925 mm [1.375 in], the pitch of the
    NCMH2's fingers that its specification sheet states (finger 25.4 + spacing 9.5), so the
    twelve span 413.7 centred in the 444.83 between the ears. THESE ARE READ OFF A PICTURE, NOT
    DIMENSIONED: every figure here is `estimated` (the pitch, the crossbar and the stem). The
    row is 10 high, estimated: no view dimensions the finger's end-on size.
  relief: >-
    drawing - the plan view: each stem runs from the mounting plate to a crossbar at the front
    tip, 100 mm out of the plate and a crossbar 6 mm deep on its tip. The usable depth of the
    channel that Panduit's Cable Capacity Calculator states (9.8 sq in for the NM2, 3.3 for the
    NM1, 17.3 for the NMF3, 24.3 for the NMF4) is 89 to 100 mm over the channel height, so 100
    is taken. The stem's thickness (5 mm) and the crossbar's depth (6 mm) are estimated; built
    as plates with square corners where the moulding is curved.
  color: >-
    datasheet - "The manager is black" on the product pages; the NM1, NM2 and NMF drawings
    list ABS for the manager. The shade is this library's render of black ABS.
size: {w: 444.83, h: 10}
size-confidence: {w: estimated, h: estimated}
