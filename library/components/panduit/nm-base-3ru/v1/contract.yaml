name: nm-base-3ru
version: 1.0.0
class: mechanical
description: >-
  The mounting plate of a Panduit NetManager High Capacity 3RU front-only horizontal manager
  (NMF3) seen from the front, between the ears, with its two front-to-rear pass-through
  windows - drawn as the well the front channel's two walls of fingers stand in, its floor
  the front face of the plate
provenance:
  size: >-
    drawing - the front view of the NMF3 customer drawing (Panduit V10404AI-DC): 482 [19.0 in] over
    the ears, 465 [18.3 in] between the fixing holes, 133 [5.2 in] high. The body between the ears
    is taken as 444.83, as nm-base-2ru does: ESTIMATED by the likeness to the NCMH2 drawing
    (00787-07).
  depth: >-
    drawing - 139.7. The customer drawing dimensions the front channel "5.5 REF [140]" and the
    whole of the manager "6.2 REF [157]"; the plate and flange are the 17.3 behind. The well is the
    139.7 in front of the plate.
  size-holes: >-
    drawing - the front view's two windows, read at 130 dpi against the 482 width: 98.5 wide and
    85 high, centred 109.7 either side of the middle and 24 from the top and bottom edges.
    ESTIMATED: no view dimensions them. The corner radius, 8, is estimated.
  color: >-
    datasheet - "The manager is black" on the NMF3 product page (ABS body); the shade is this
    library's render of black ABS.
size: {w: 444.83, h: 133, d: 139.7}
size-confidence: {w: estimated, h: drawing, d: drawing}
