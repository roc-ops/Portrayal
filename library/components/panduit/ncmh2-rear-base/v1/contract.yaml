name: ncmh2-rear-base
version: 1.0.0
class: mechanical
description: >-
  The back of the mounting plate of a Panduit NetManager NCMH2 2RU front-and-rear horizontal
  manager seen from behind, between the ears, with its two front-to-rear pass-through windows -
  drawn as the well the rear channel's walls of fingers stand in, its floor the rear face of the
  plate
provenance:
  size: >-
    drawing - the NCMH2 customer drawing (Panduit 00787-07): 88.14 [3.47 in] high and 444.83
    [17.51 in] across the rear section's body.
  depth: >-
    drawing - 152.41. The drawing dimensions the whole manager 9.75 [247.71] and the NCMHF2 drawing
    its front-only form 3.75 [95.3], so the rear channel is the 247.71 less 95.3, 152.41 mm out of
    the plate's back face (the plan's "6.51 REF [165.43]" is the plate and rear together).
  size-holes: >-
    drawing - the same two windows as the front (see ncmh2-base): they go through the plate, so
    the rear floor is open where they are. ESTIMATED: no view dimensions them.
  color: >-
    datasheet - "The manager is black" on the product page; the shade is this library's render
    of black polycarbonate.
size: {w: 444.83, h: 88.14, d: 152.41}
size-confidence: {w: drawing, h: drawing, d: drawing}
