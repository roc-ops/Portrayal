<svg xmlns="http://www.w3.org/2000/svg" width="45.8mm" height="80.7mm" viewBox="0 0 45.8 80.7">
  <!-- The B1 and B2 breaker plate of a Panduit G5 intelligent PDU as drawing P32E06M_DC draws it. Drawn in
       the drawing's frame (u along the PDU from the cord end, v across) and turned to the standing PDU. -->
  <g id="plate" transform="matrix(0,-1,1,0,0,80.7)">
    <rect x="0" y="0" width="80.7" height="45.8" rx="2.5" fill="#232528" stroke="#3b3e42" stroke-width="0.3"/>
    <line x1="0" y1="22.9" x2="80.7" y2="22.9" stroke="#3b3e42" stroke-width="0.3"/>
    <circle cx="5.0" cy="11.9" r="2.3" fill="#4d5257" stroke="#6b7076" stroke-width="0.2"/>
    <circle cx="50.5" cy="11.9" r="2.3" fill="#4d5257" stroke="#6b7076" stroke-width="0.2"/>
    <circle cx="5.0" cy="34.0" r="2.3" fill="#4d5257" stroke="#6b7076" stroke-width="0.2"/>
    <circle cx="50.5" cy="34.0" r="2.3" fill="#4d5257" stroke="#6b7076" stroke-width="0.2"/>
    <rect x="11.4" y="3.6" width="32.5" height="16.6" fill="#0b0b0c" stroke="#3b3e42" stroke-width="0.2"/>
    <rect x="11.4" y="24.9" width="32.5" height="17.1" fill="#0b0b0c" stroke="#3b3e42" stroke-width="0.2"/>
    <rect id="rocker-1" x="16.0" y="6.4" width="13.0" height="11.0" rx="0.6" fill="#1b1c1e" stroke="#4d5257" stroke-width="0.2"/>
    <rect id="rocker-2" x="16.0" y="27.7" width="13.0" height="11.4" rx="0.6" fill="#1b1c1e" stroke="#4d5257" stroke-width="0.2"/>
  </g>
  <g id="silkscreen" font-family="sans-serif" fill="#d9dbde">
    <text x="10.0" y="12.2" font-size="6.0" text-anchor="middle" transform="rotate(-90 10.0 12.2)">B1</text>
    <text x="19.0" y="12.2" font-size="3.2" text-anchor="middle" font-weight="bold" transform="rotate(-90 19.0 12.2)">L-N</text>
    <text x="31.5" y="12.2" font-size="6.0" text-anchor="middle" transform="rotate(-90 31.5 12.2)">B2</text>
    <text x="38.5" y="12.2" font-size="3.2" text-anchor="middle" font-weight="bold" transform="rotate(-90 38.5 12.2)">L-N</text>
  </g>
</svg>
