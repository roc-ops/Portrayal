format: 1
kind: component
name: nm-cover-1ru
version: 1.0.0
class: mechanical
behaviour: mounts
lid: true
description: >-
  The hinged cover of a Panduit NetManager High Capacity 1RU horizontal manager (NM1 and NMF1)
  seen from the front - a PVC plate across the finger tips with a lip along its top and
  bottom edge. It ships fitted on the front of the manager and on the rear of a front-and-rear
  one, and opens up or down 110 degrees
provenance:
  size: >-
    drawing - the plan view of the NM1 and NMF1 customer drawings (Panduit 10404-19 and 10404-15):
    the cover is the thin bar along the front edge of the finger zone, as wide as the body; the
    parts lists say "1- 1 RU 19" COVER" (NMF1) and "2- 1RU 19" COVERS" (NM1), "1RU COVER: PVC".
    444.83 wide as the body (see nm-base-1ru) and 44 high.
  relief: >-
    drawing - the cover is the front 12.6 mm of the plan. Its plate and lips are 3.5 and 1.5
    thick, ESTIMATED: no view sections the cover (see nm-cover-2ru): the plate stands from
    136.2 to 139.7 above the well's floor and the lips from 127.1.
  lid: >-
    datasheet - the NetManager High Capacity specification sheet (RKSP237): "Dual hinged
    covers shall allow access to the cable pathway", opening 110 degrees to the top or bottom
    without removing the cover. It opens over the channel, so it is a lid (`lid: true`). The
    format has no hinge, so the cover is on or off; the device records the gap.
  color: >-
    datasheet - "Cover Material: PVC", "The manager is black" on the product pages. The shade
    is this library's render, a little lighter than the manager so the two read apart.
size: {w: 444.83, h: 44}
size-confidence: {w: estimated, h: drawing}
attrs: {material: PVC}
elements:
  lip-top: {at: [0.0, 0.0], size: [444.83, 1.5], class: bezel}
  lip-bottom: {at: [0.0, 42.5], size: [444.83, 1.5], class: bezel}
  plate: {at: [0.0, 0.0], size: [444.83, 44], class: bezel}
relief:
  features:
    - node: lip-top
      lift: 127.1
      out: 139.7
      color: '#333639'
      confidence: estimated
      source: the plan view of the NetManager drawings, the cover over the front 12.6 mm; the lip's thickness is not dimensioned
    - node: lip-bottom
      lift: 127.1
      out: 139.7
      color: '#333639'
      confidence: estimated
      source: the plan view of the NetManager drawings, the cover over the front 12.6 mm; the lip's thickness is not dimensioned
    - node: plate
      lift: 136.2
      out: 139.7
      color: '#333639'
      confidence: estimated
      source: the plan view of the NetManager drawings; the plate's thickness is not dimensioned
skins: [default]
