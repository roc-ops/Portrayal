format: 1
kind: component
name: pr2v-door-06
version: 1.0.0
class: mechanical
behaviour: mounts
lid: true
description: >-
  The full-length dual-hinging push-to-close door of the 6 in wide Panduit PatchRunner 2 vertical
  manager (PR2VSD06) seen from the front - a steel skin with ABS ends that closes the front channel.
  It ships fitted, opens to the left or right and lifts off its hinge pins
provenance:
  size: >-
    drawing - the table of the PR2VSD customer drawing (Panduit 14V455MW-DC): door width D 152.1 [5.99
    in], door height E 2051.6 [80.77 in] for the 7 ft manager, centred on its 2130.4 height; the
    page-2 view of the PR2VD drawing draws the same door.
  relief: >-
    estimated - the door stands at the front of the channel: its skin is taken 3.5 thick (no view
    sections it) from 299.5 to 303 above the well's floor. The drawing's "F=DOOR OPENING DEPTH"
    (117.3 mm) is how far an open door stands out and is not drawn.
  lid: >-
    datasheet - the product page: "includes one full-length metal, dual-hinging, push-to-close door";
    the PR2VD drawing: "PUSH-TO-CLOSE DOOR LATCHES", "TURN KNOB HANDLES", "HINGE PINS & HINGE LATCHES:
    POLYCARBONATE". It opens over the channel, so it is a lid (`lid: true`) that comes off. The format has
    no hinge, so the door is on or off; the device records the gap.
  color: >-
    datasheet - "Cover Material: Steel", "The manager is black" on the product page. The shade is this
    library's render of black powder-coated steel, a little lighter than the backbone.
size: {w: 152.1, h: 2051.6}
size-confidence: {w: drawing, h: drawing}
attrs: {material: steel}
