<svg xmlns="http://www.w3.org/2000/svg" width="47mm" height="127.8mm" viewBox="0 0 47 127.8">
  <!-- The controller plate of a Panduit G5 intelligent PDU as drawing P32E06M_DC draws it, in the standing frame:
       the display window, three round indicators, a status lamp and a reset hole, and the cells the jacks sit in.
       The wordmark and the legends beside the jacks are not drawn. -->
  <rect id="faceplate" x="0" y="0" width="47" height="127.8" rx="1.5" fill="#18191b" stroke="#3a3d41" stroke-width="0.25"/>
  <rect id="display" x="19.7" y="77.2" width="17.8" height="35.6" fill="#0c0d0e" stroke="#4a4d51" stroke-width="0.3"/>
  <circle id="indicator-1" cx="8.5" cy="106.4" r="3.3" fill="none" stroke="#6b7076" stroke-width="0.3"/>
  <circle id="indicator-2" cx="8.5" cy="93.8" r="3.3" fill="none" stroke="#6b7076" stroke-width="0.3"/>
  <circle id="indicator-3" cx="8.5" cy="81.0" r="3.3" fill="none" stroke="#6b7076" stroke-width="0.3"/>
  <circle id="status-lamp" cx="26.4" cy="71.5" r="1.2" fill="none" stroke="#6b7076" stroke-width="0.25"/>
  <circle id="reset" cx="41.8" cy="71.5" r="0.9" fill="#0b0b0c" stroke="#6b7076" stroke-width="0.2"/>
  <rect x="5.5" y="48.2" width="17.3" height="17.9" fill="#141516" stroke="#34373b" stroke-width="0.2"/>
  <rect x="28.0" y="48.2" width="11.4" height="17.9" fill="#141516" stroke="#34373b" stroke-width="0.2"/>
  <rect x="5.9" y="29.2" width="16.7" height="15.5" fill="#141516" stroke="#34373b" stroke-width="0.2"/>
  <rect x="5.9" y="11.9" width="16.7" height="15.7" fill="#141516" stroke="#34373b" stroke-width="0.2"/>
  <rect x="24.5" y="29.2" width="15.5" height="15.5" fill="#141516" stroke="#34373b" stroke-width="0.2"/>
  <rect x="24.5" y="11.9" width="15.5" height="15.7" fill="#141516" stroke="#34373b" stroke-width="0.2"/>
</svg>
