description: >-
  The rear full-length dual-hinging push-to-close door of the 8 in wide Panduit PatchRunner 2
  vertical manager (PR2VD08) seen from behind - a steel skin with ABS ends that closes the rear
  channel. It ships fitted, opens to the left or right and lifts off its hinge pins
provenance:
  size: >-
    drawing - the table of the PR2VD customer drawing (Panduit 14V455LV-DC): door width D 202.9
    [7.99 in], door height E 2051.5 [80.77 in] for the 7 ft manager, centred on its 2130.4 height; the
    drawing's title is "front and rear fingers and doors" and its note 4 lists "2- PATCHRUNNER 2 DUAL
    HINGE DOOR".
  relief: >-
    estimated - the door stands at the back of the rear channel: its skin is taken 3.5 thick (no
    view sections it) from 199.5 to 203 above the rear well's floor.
  lid: >-
    datasheet - the product page: "includes two full-length metal, dual-hinging, push-to-close
    doors", one on each face. It opens over the channel, so it is a lid (`lid: true`) that comes off. The
    format has no hinge, so the door is on or off; the device records the gap.
  color: >-
    datasheet - "Cover Material: Steel", "The manager is black" on the product page. The shade is this
    library's render of black powder-coated steel, a little lighter than the backbone.
