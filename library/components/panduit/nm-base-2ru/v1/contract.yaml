format: 1
kind: component
name: nm-base-2ru
version: 1.0.0
class: mechanical
description: >-
  The mounting plate of a Panduit NetManager High Capacity 2RU horizontal manager (NM2 and
  NMF2) seen from the front, between the ears, with its two front-to-rear pass-through
  windows - drawn as the well the front channel's two walls of fingers stand in, its floor
  the front face of the plate
provenance:
  size: >-
    drawing - the front view of the NMF2 and NM2 customer drawings (Panduit 10404-16 and
    10404-20): 482 [19.0 in] over the ears, 465 [18.3 in] between the fixing holes, 88 [3.5 in]
    high. The body between the ears is taken as 444.83, the width the NCMH2 drawing
    (00787-07) dimensions for the same moulding (17.51 in); no NetManager High Capacity
    drawing dimensions it, so the width is ESTIMATED by that likeness.
  depth: >-
    drawing - 139.7. Both customer drawings dimension the front channel "5.5 REF [140]" from the
    front of the cover to the end of the finger zone, and the whole of the NMF2 "6.2 REF
    [157]": the plate and the mounting flange are the 17.3 behind. The well is the 139.7 in
    front of the plate.
  size-holes: >-
    drawing - the front view's two windows, read at 300 dpi against the 482 [19.0 in] width:
    98.5 wide and 40 high, centred 109.7 either side of the middle, 63.5 and 282.9 from the left
    edge of the body. The same windows are measured on the NCMH2 drawing (97.4 and 99.6 wide
    by 38 high on its 88.14). ESTIMATED: no view dimensions them. The corner radius, 8, is
    estimated.
  color: >-
    datasheet - "The manager is black" on the NM2 and NMF2 product pages (ABS body); the shade
    is this library's render of black ABS.
size: {w: 444.83, h: 88, d: 139.7}
size-confidence: {w: estimated, h: drawing, d: drawing}
