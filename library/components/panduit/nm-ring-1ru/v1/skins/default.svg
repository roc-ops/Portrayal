<svg xmlns="http://www.w3.org/2000/svg" width="15mm" height="32mm" viewBox="0 0 15 32">
  <!-- one open D-ring from behind, end-on: the loop's bars along the top and bottom and at the
       far end a hook across the lower third, the upper two thirds left open for a cable -->
  <rect id="back" x="0" y="0" width="15" height="32" rx="1.5" fill="#111315"/>
  <rect id="bar-top" x="0" y="0" width="15" height="3" rx="1.5" fill="#0d0f10"/>
  <rect id="bar-bottom" x="0" y="29" width="15" height="3" rx="1.5" fill="#0d0f10"/>
  <rect id="hook" x="0" y="21.3" width="15" height="10.7" rx="1.5" fill="#101214"/>
</svg>
