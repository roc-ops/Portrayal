format: 1
kind: component
name: pr2v-finger-section-front
version: 1.0.0
class: mechanical
description: >-
  One section of front fingers of a Panduit PatchRunner 2 vertical manager (PR2VD08, PR2VD10 and
  PR2VSD06) seen from the front - fifteen ABS fingers one rack unit apart down one side of the
  front channel, with a gap between each pair that a patch cord is laid in through. Three a side
  make the 45 fingers of a 45RU manager
provenance:
  size: >-
    drawing - the front view of the PR2VD customer drawing (Panduit 14V455LV-DC): the fingers stand
    in two columns, one each side of the backbone, one finger to each rack unit; the specification
    sheet (RKSP172 and the Space-Saving bulletin RKCB46) says "individual fingers align with rack
    spaces", and the bulletin sells a "Replacement 15-Finger Kit for PR2V/PE2V Vertical Managers,
    one left and one right section" (PR2VRFK15), so a side is three sections of 15. The pitch is
    the 44.45 mm [1.75 in] rack unit, the finger 33 high and 30 across, ESTIMATED: read off the
    front view at 300 dpi, which is not dimensioned for a finger. 30 mm is a finger's reach across
    the front, taken equal for every width and short enough to leave the four 76.2 mm holes of the
    6 in manager clear; the calculator's channel areas grow by a constant 9.3 sq in for each inch
    of width, which a finger of fixed length gives.
  relief: >-
    drawing - the plan view: each finger stands out of the backbone into the front channel. 260 mm
    is taken, ESTIMATED: the plan draws the fingers' tips only as a frame, and 236 mm is the depth
    that the calculator's front area per inch of width (9.3 sq in) gives for the channel. The
    finger is a hollow loop in the maker's drawing; it is built as a solid block.
  color: >-
    datasheet - "Finger Material: ABS", "The manager is black" on the PR2VD10 and PR2VSD06 product
    pages (steel backbone, ABS fingers). The shade is this library's render of black ABS.
