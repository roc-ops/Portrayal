<svg xmlns="http://www.w3.org/2000/svg" width="82.5mm" height="15.1mm" viewBox="0 0 82.5 15.1">
  <!-- nvidia/mcx753436-ocp3-sff: ConnectX-7 MCX753436 on its thumbscrew (pull tab)
       bracket, 82.50 x 15.1 (OCP 3.0 user manual, bracket drawing, page 84).
       Original art measured off that drawing on its printed 82.50 width, so
       positions are good to about half a millimetre. The two QSFP windows and the
       four lamps are composed parts. The tab housing outline is an estimate. -->
  <rect id="bracket" x="0.45" y="0.1" width="71.35" height="14.9" rx="0.4" fill="#8c9094" stroke="#4a4d50" stroke-width="0.3"/>
  <rect id="latch" x="0.6" y="1.6" width="6.0" height="12.0" rx="0.5" fill="#17181a"/>
  <g id="tab">
    <path d="M71.8 3.4 L75.2 2.6 L79.6 2.6 L82.3 5.2 L82.3 12.0 L79.6 14.6 L75.2 14.6 L71.8 13.6 Z" fill="#8c9094" stroke="#4a4d50" stroke-width="0.3"/>
    <circle id="thumbscrew" cx="77.5" cy="8.3" r="4.9" fill="#2e3033" stroke="#0c0d0e" stroke-width="0.3"/>
    <circle cx="77.5" cy="8.3" r="2.4" fill="#5a5d61"/>
    <path d="M75.7 8.3 H79.3 M77.5 6.5 V10.1" stroke="#17181a" stroke-width="0.55" stroke-linecap="round"/>
  </g>
  <g id="vents" fill="#08090a">
    <rect x="28.48" y="2.39" width="2.81" height="3.09" rx="0.3"/><rect x="32.55" y="2.39" width="2.81" height="3.09" rx="0.3"/><rect x="36.62" y="2.39" width="2.81" height="3.09" rx="0.3"/><rect x="40.55" y="2.39" width="2.81" height="3.09" rx="0.3"/>
    <rect x="28.48" y="6.59" width="2.81" height="2.95" rx="0.3"/><rect x="32.55" y="6.59" width="2.81" height="2.95" rx="0.3"/><rect x="36.62" y="6.59" width="2.81" height="2.95" rx="0.3"/><rect x="40.55" y="6.59" width="2.81" height="2.95" rx="0.3"/>
    <rect x="65.38" y="2.39" width="1.68" height="2.53" rx="0.3"/><rect x="68.33" y="2.39" width="1.54" height="2.53" rx="0.3"/>
    <rect x="65.38" y="6.17" width="1.68" height="2.67" rx="0.3"/><rect x="68.33" y="6.17" width="1.54" height="2.67" rx="0.3"/>
    <rect x="65.38" y="9.82" width="1.68" height="2.67" rx="0.3"/><rect x="68.33" y="9.82" width="1.68" height="2.67" rx="0.3"/>
  </g>
  <g id="silkscreen" fill="#17181a" font-family="sans-serif" font-size="0.85" text-anchor="middle">
    <text x="30.00" y="14.15">LINK</text>
    <text x="34.00" y="14.15">ACT</text>
    <text x="37.90" y="14.15">LINK</text>
    <text x="42.00" y="14.15">ACT</text>
    <text x="32.00" y="14.95" font-size="0.6">PORT 1</text>
