format: 1
kind: module
name: rtx-4080-fe
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA GeForce RTX 4080 Founders Edition, a dual-axial-fan Founders Edition
  card that is three slots wide. The bracket face carries three DisplayPort
  and one HDMI receptacle on the board's side, with four vent panes below
  them. The shroud is the X-shaped Founders Edition design. Its fan pocket is
  at the far end and its model name is printed on the other pocket. The heat
  sink's fins show along the top edge. Its power connector is a 16-pin
  (12VHPWR) receptacle in a notch in the top edge. It plugs into one riser
  slot and covers the two beside it.
slot-width: 3
size: {w: 120.02, h: 62.23, d: 304}
size-confidence: {w: registry, h: registry, d: datasheet}
unplaced: >-
  no bay in the library lists this card in `accepts`, and no bay states `interface: pcie-fh`. The card
  does not state `mates: pcie-fh`: the library has not begun that migration (spec/tests/test_cards_by_interface.py
  holds it at no part until it does). No document held says any server takes a consumer card.
attrs:
  model: 'RTX 4080'
  edition: 'Founders Edition'
  role: gpu
  form-factor: 'Full-height, three-slot (61 mm), 304 mm x 137 mm'
  pcie-connector: x16
  pcie-height: full
  power-draw-max-w: 320
  power-input: 'host PCIe slot and one 16-pin 12VHPWR connector; an adapter from three PCIe 8-pin cables is in the box'
  memory: '16 GB GDDR6X, 256-bit'
  display-ports: '3 x DisplayPort and 1 x HDMI on the bracket'
  cooling: active
  airflow: 'axial fan on the broad side; a flow-through heat sink exhausts through the second side and the top edge'
faces:
  rear: {ref: nvidia/rtx-4090-fe-tail@1}
  plan: {ref: nvidia/rtx-4090-fe-top@1}
provenance:
  why-a-module: >-
    The RTX 4080 is its own module, not a configuration of the 4080 SUPER, because a module has one shape and one set of
    figures and the two differ in name and finish. It is modelled from the 4080 SUPER because the 4080's own quick-start
    guide draws the same shell: of 1068 vector paths on page 5, 1064 are identical to the 4080 SUPER guide's (the four
    that differ are the HDMI callout and its dot). NVIDIA's family page shows only the SUPER; no picture of the 4080 is held.
    Every figure of the broad side is therefore BORROWED from nvidia/rtx-4080-super-fe@1 (itself borrowed from the RTX 4090
    skin) and is `estimated`. The finish of the 4080 (the SUPER's family-page pictures are the only ones) is not known to
    differ in any way a skin can show, and none is drawn. If the owner prefers the 4080 as an attribute list on the SUPER,
    deleting this module is a clean revert.
  slot-width: >-
    datasheet - NVIDIA's RTX 4080 family page prints 3-Slot for the 4080, the quick-start guide's clearance box reads 'Must
    have space for 304mm (L) x 137mm (W) x 61mm (H) card' and its step 2 says 'Remove three adjacent slot covers'. The card
    declares `slot-width: 3` as the RTX 4090 does.
  sources: >-
    NVIDIA GeForce RTX 4080 Founders Edition - NVIDIA's GeForce RTX 4080 family page (fetched 2026-10-07),
    https://www.nvidia.com/en-us/geforce/graphics-cards/40-series/rtx-4080-family/ ; NVIDIA GeForce RTX 4080 quick-start
    guide, Rev1 (vector), https://www.nvidia.com/content/geforce-gtx/GeForce_RTX_4080_QSG_Rev1.pdf ; NVIDIA's compare page,
    https://www.nvidia.com/en-us/geforce/graphics-cards/compare/ ; NVIDIA's case-clearance diagram for the 4080 SUPER, which
    the intake records as shared with the 4080 (https://www.nvidia.com/content/dam/en-zz/Solutions/geforce/ada/rtx-4080/
    geforce-4080-super-comp-guide-case-size.jpg); PCI Express CEM 5.0 via the library's standards registry. NVIDIA publishes
    no dimensioned drawing of any GeForce card. The pictures are NVIDIA's; their licence is not stated, so facts were read
    from them and no picture is copied.
  reference-images: >-
    estimated - NO PICTURE OF THE RTX 4080 IS HELD (the family page now shows only the SUPER; the intake's handoff list
    item 9 asks for the launch-era pictures). The only drawing of this card is the quick-start guide's page 5, which is the
    RTX 4090's artwork (it prints 'RTX 4090' beside the fan). No mm per pixel exists for any view of this card. The broad
    side is the 4080 SUPER's skin; see nvidia/rtx-4080-super-fe@1 for how that was checked against the SUPER's 3/4 pictures.
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2, PCIe CEM 5.0 figure 11-5). h is three slots:
    the single bracket's 21.59 plus two 20.32 slot pitches, 62.23.
  depth: >-
    datasheet - NVIDIA's page prints the length as 304 mm, taken from the bracket's outer face. The guide's clearance box
    agrees (304 mm (L) x 137 mm (W) x 61 mm (H)).
  face-outline: >-
    estimated - the plate is the 4090's (std/pcie-bracket-fh@2's outline with a third tab and a far edge at 61.5). The
    guide shows 3 tabs. No straight-on view of any GeForce bracket exists. This bracket is taken to be the same part as the
    4080 SUPER's and the 4090's.
  face-ports: >-
    estimated - the places and shell sizes are BORROWED from nvidia/rtx-4080-super-fe@1, which reads them on the vector guide
    of the 4080 SUPER (page 5): the two guides draw one bracket, and the 4080 quick-start guide's page 5 differs from the
    SUPER's only in the HDMI callout dot. The three DisplayPort shells are 15.8 long at 96.9, 80.0 and 62.4 from the tip and the
    HDMI shell 12.9 long at 45.6, 7.1 and 6.0 across (the depths are estimated too). The gaps between shells are 1.1, 1.8 and
    3.9 mm: no two touch. THE LIBRARY HAS NO DISPLAYPORT OR HDMI PART OR INTERFACE, so each receptacle is an element of class
    `connector` painted in the skin and not a seated part. NO STRAIGHT-ON VIEW OF ANY GEFORCE BRACKET EXISTS.
  face-vent: >-
    estimated - four grilles and three screws, as nvidia/rtx-4080-super-fe@1 (the same guide drawing): panes from about 25 to
    111 along, each 20.2 long with 1.5 bars, screws at x 17 and y 12.4, 32.7 and 53.0.
  face-markings: >-
    estimated - the guide draws no lamp, label or printing on the bracket and no straight-on picture exists to resolve any
    (no control in the same image can be named, so this is a gap, not a reading).
  thickness: >-
    datasheet - 3-Slot and the guide's 'x 61mm (H) card'. The shroud's far face is put at y 61.0 from the bracket's
    board-side datum (the envelope is 62.23). The backplate is not drawn.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the A100 are. The board, and the bracket's keyed side, are at the top (small
    y), which is where the DisplayPorts are.
  body: >-
    estimated - the board and its edge follow PCIe CEM 5.0. The shroud is the 4080 SUPER's (the 4090's: the 4070 SUPER's
    elevation scaled to the stated 137 mm total height): x 26.73 to 151.75, 125.0 high. The board box runs 159.1 behind
    the bracket and is hidden.
  body-shroud: >-
    estimated - one dark slab from the board's component face (y 6.01) to the far face (61.0), in three boxes split at the top
    edge's notch so that the notch is a real step in 3D. Its broad side is painted as the 4080 SUPER's, with the model name
    'RTX 4080' as plain text, centred on the pocket as the SUPER's name block is (no picture of this card is held, so the place is
    the SUPER's, estimated), and the maker's mark reserved as a logo-zone. The shell is the SUPER's, every figure borrowed and
    `estimated`; it is not a measurement of this card.
    The BACK of the card is shown in no picture and is not drawn.
  body-fan: >-
    estimated - the fan in the far pocket is the 4080 SUPER's: ring about 113 mm, hub 41 mm, 11 blades (a count that no
    picture of either card can confirm).
  body-top-edge: >-
    estimated - the 4080 SUPER's: dark grey end caps and, between them from 108 to 193 behind the bracket, the heat sink's
    fins, one every 1.6 mm. The lettering on the far cap is a maker's wordmark and is reserved as `logo-zone` in
    skins/body-right.svg, not drawn.
  body-power-connector: >-
    estimated - NVIDIA's page says 'Supplementary Power Connectors: 3x PCIe 8-pin cables (adapter in box) OR 1x 450 W or
    greater PCIe Gen 5 cable' and the guide's callout reads 'PCIe Gen5 16-pin Power Connector' on the TOP of the card. The card
    composes std/12vhpwr-header@1 as `aux-power` on its top face (`faces.plan`, nvidia/rtx-4090-fe-top@1). DCIM exports no
    power port for it for now: the owner chose (decided 2026-10-26) to keep the header on the top face, and the exporter reads
    only `faces.rear`. The 3D body draws the housing in the notch (20.85 x 11.7, 9.0 deep); the notch (centred 180.7 behind the
    bracket, 28 long, 4.5 deep) is the 4090's, a guess.
  body-end: >-
    estimated - a closed dark end plate 1.0 thick at the far end. No photograph shows the end. The rear face (`faces.rear`,
    nvidia/rtx-4090-fe-tail@1) is a plain plate.
  power: >-
    datasheet - NVIDIA's page: 'Total Graphics Power (W) 320' for the 4080 (and for the 4080 SUPER). The figure is the
    board's total, filed as the maximum. 750 W is NVIDIA's required system power.
  memory: >-
    datasheet - 16 GB GDDR6X, 256-bit. NVIDIA's family page, Memory Specs.
  part-numbers: >-
    not stated - no document held gives an order code or part number for this Founders Edition card.
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) a straight-on view of the I/O bracket (needs-photo); (2) any picture of the RTX 4080 at
    all, so the whole shroud, the top edge and the far end are borrowed and estimated (needs-photo; handoff item 9 of the
    intake); (3) the DisplayPort and HDMI parts and interfaces, which the library lacks (painted, not seated); (4) the card's
    back, backplate and second fan; (5) a weight and an order code (vendor-silent); (6) PCIe generation (vendor-silent in the
    page tables held); (7) the lifecycle, which was not searched; (8) the dimensioned FE board outline, which NVIDIA does not
    publish; (9) no 3D reference is held for this card.
  conflicts: >-
    CONFLICTS SETTLED: (a) the guide's page 5 is the RTX 4090's artwork and prints 'RTX 4090': the text of the same guide is
    the 4080's (304 x 137 x 61, three covers), so the drawing is taken for the shell only; (b) the 4080 guide's HDMI dot is at
    the lower end of the connector and the 4080 SUPER guide's at its centre: the centre is used; (c) the guide names the
    connector 'PCIe Gen5 16-pin'; std/12vhpwr-header@1 is composed because the guide does not name 12V-2x6.
