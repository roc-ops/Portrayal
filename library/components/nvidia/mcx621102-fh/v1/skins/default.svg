<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="21.59mm" viewBox="0 0 120.02 21.59">
  <!-- nvidia/mcx621102-fh: MCX621102A on its tall bracket. The outline, tip
       and keyed flange are std/pcie-bracket-fh@2, composed BEHIND this; what is drawn
       here is the punched plate: vents, light-pipe slots and port numerals.
       TIP AT THE LEFT - NVIDIA draws the card tip-right, so this is its
       figure turned a half-turn and the numerals read upside down. -->
  <!-- METAL FILLING THE OPENING: the bracket colour, 0.3 proud all round so
       the opening stroke leaves no ghost; the holes are punched in it. -->
  <rect id="plate" x="19.66" y="6.05" width="90.50" height="12.66" fill="#9aa1a8"/>
  <g id="vents"><rect x="74.49" y="14.40" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="74.49" y="9.07" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="50.85" y="14.40" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="50.85" y="9.07" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="27.02" y="14.40" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="27.02" y="9.07" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="21.68" y="14.40" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="21.68" y="9.07" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="16.15" y="14.40" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="16.15" y="9.07" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="80.03" y="14.29" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="80.03" y="8.78" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="85.42" y="14.29" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="85.42" y="8.78" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="90.81" y="14.29" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="90.81" y="8.78" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="96.36" y="14.29" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="96.36" y="8.78" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="101.67" y="14.29" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="101.67" y="8.78" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="107.06" y="14.29" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="107.06" y="8.78" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="112.45" y="14.29" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="112.45" y="8.78" width="3.60" height="3.60" rx="0.60" fill="#17191c"/></g>
