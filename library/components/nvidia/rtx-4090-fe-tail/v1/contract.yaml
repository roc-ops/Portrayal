format: 1
kind: component
name: rtx-4090-fe-tail
version: 1.0.0
class: mechanical
profile: server
description: >-
  The far end of the NVIDIA RTX 4090 Founders Edition, seen from behind. It is a closed dark end plate: the
  power connector is on the top edge and not on this face. It is the card's `faces.rear`.
size: {w: 125.02, h: 56.56}
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  The end face is the shroud's width across (125.02) and runs from the board's rear face to the
  shroud's far wall (56.56). NO DEPTH IS DECLARED: a face is a drawing of a back. SEEN FROM BEHIND WITH THE
  BOARD'S SIDE AT THE TOP, so x' is the shroud's top-edge x less the card's x (the top edge at the left)
  and y' is the card's y less 4.44, the frame of nvidia/a10-tail@1.
attrs: {media: gpu}
provenance:
  size: >-
    estimated - see size-notes. The shroud's width is photo-measured on the
    broad-side elevation and its far wall is the card's estimated thickness;
    no photograph of the card's end is held.
  connector: >-
    The 16-pin or 12-pin connector of these cards sits on the TOP EDGE in a
    notch (NVIDIA's guide: 'the power receptacle on the top of the graphics
    card'), so it is composed on the card's top face where it has an
    interface, and drawn as a plain housing in the 3D body where it has none.
    Nothing is on the end.
  end-plate: >-
    estimated - a closed dark end plate over the full width and height. No
    photograph of the end of any of these cards is held.
elements: {}
skins: [default]
