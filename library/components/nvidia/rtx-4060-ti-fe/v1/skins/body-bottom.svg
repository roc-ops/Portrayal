<svg xmlns="http://www.w3.org/2000/svg" width="100.34mm" height="243.1mm" viewBox="-7.05 0 100.34 243.1">
  <!-- RTX 4060 Ti: THE SHROUD'S BROAD SIDE, the body's bottom side seen from outside. Across: 120.02 less the card's x, so the lower edge is at the right. Down: 244 less mm behind the bracket's outer face, so the far end is at the top. THE ART IS THE RTX 4070 SUPER SKIN'S, written in that elevation's own pixels and turned into this frame by one matrix (6.05 px per mm); it is not a measurement of this card, but it was laid under a rectified 4060 Ti hero and the X waist, the two pockets and the fan ring agree to about 2.5 mm (the hub to 5.6 mm) (provenance reference-images). Drawn in-house; nothing is traced. The maker's small mark is reserved (logo-zone), not drawn. -->
