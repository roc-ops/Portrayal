<svg xmlns="http://www.w3.org/2000/svg" width="167.54mm" height="10.85mm" viewBox="0 9.63 167.54 10.85">
  <!-- nvidia/l4: THE SHROUD'S LOWER EDGE, the body's left side seen from
       outside. Across: 168.54 less mm behind the bracket's outer face, so the
       card's far end is at the left and the shroud's front (1.0 behind the
       bracket) at 167.54. Down: the face's y, the shroud's 9.63 to 20.48. Ribbed
       as the top edge is, on the A100's pitch of 2.194 (borrowed). -->
  <defs>
    <pattern id="ribs" patternUnits="userSpaceOnUse" x="0" y="9.63" width="2.194" height="10.85">
      <rect x="0" y="0" width="2.194" height="10.85" fill="#c2b098"/>
      <rect x="0.25" y="0" width="0.55" height="10.85" fill="#d6c8b4"/>
      <rect x="1.80" y="0" width="0.394" height="10.85" fill="#86745f"/>
    </pattern>
  </defs>
  <rect x="0" y="9.63" width="167.54" height="10.85" fill="url(#ribs)"/>
</svg>
