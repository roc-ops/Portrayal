<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="21.59mm" viewBox="0 0 120.02 21.59">
  <!-- nvidia/l4: the L4 on its full-height bracket. The outline, tip and keyed
       flange are std/pcie-bracket-fh@2, composed BEHIND this; what is drawn here
       is the punched plate, which the render shows BLACK: one long vent window
       with a screw at each end and the heat-sink fins behind it, end-on.
       TIP AT THE LEFT, flange end at the right, as the standard bracket is
       drawn. The window, the screws and the fins' pitch are estimated from 3/4
       renders (provenance face-window); nothing is traced. -->
  <!-- the plate filling the standard's opening, 0.3 proud all round so the
       opening's stroke leaves no ghost -->
  <rect id="plate" x="19.66" y="6.05" width="90.50" height="12.66" fill="#2c2f33"/>
  <!-- the vent window and the fins behind it -->
  <rect id="window" x="25.5" y="7.6" width="78.8" height="9.6" rx="0.8" fill="#0d0e10" stroke="#8d9399" stroke-width="0.3"/>
  <g id="fins" fill="#7b8187">
    <rect x="26.75" y="8.1" width="0.4" height="8.6"/>
    <rect x="29.65" y="8.1" width="0.4" height="8.6"/>
    <rect x="32.55" y="8.1" width="0.4" height="8.6"/>
    <rect x="35.45" y="8.1" width="0.4" height="8.6"/>
    <rect x="38.35" y="8.1" width="0.4" height="8.6"/>
    <rect x="41.25" y="8.1" width="0.4" height="8.6"/>
    <rect x="44.15" y="8.1" width="0.4" height="8.6"/>
    <rect x="47.05" y="8.1" width="0.4" height="8.6"/>
    <rect x="49.95" y="8.1" width="0.4" height="8.6"/>
    <rect x="52.85" y="8.1" width="0.4" height="8.6"/>
    <rect x="55.75" y="8.1" width="0.4" height="8.6"/>
    <rect x="58.65" y="8.1" width="0.4" height="8.6"/>
    <rect x="61.55" y="8.1" width="0.4" height="8.6"/>
    <rect x="64.45" y="8.1" width="0.4" height="8.6"/>
    <rect x="67.35" y="8.1" width="0.4" height="8.6"/>
    <rect x="70.25" y="8.1" width="0.4" height="8.6"/>
    <rect x="73.15" y="8.1" width="0.4" height="8.6"/>
    <rect x="76.05" y="8.1" width="0.4" height="8.6"/>
    <rect x="78.95" y="8.1" width="0.4" height="8.6"/>
    <rect x="81.85" y="8.1" width="0.4" height="8.6"/>
    <rect x="84.75" y="8.1" width="0.4" height="8.6"/>
    <rect x="87.65" y="8.1" width="0.4" height="8.6"/>
    <rect x="90.55" y="8.1" width="0.4" height="8.6"/>
    <rect x="93.45" y="8.1" width="0.4" height="8.6"/>
    <rect x="96.35" y="8.1" width="0.4" height="8.6"/>
    <rect x="99.25" y="8.1" width="0.4" height="8.6"/>
    <rect x="102.15" y="8.1" width="0.4" height="8.6"/>
  </g>
  <!-- a screw at each end of the window -->
  <g id="screw-1"><circle cx="22.4" cy="12.38" r="1.5" fill="#b9bfc5" stroke="#5f666d" stroke-width="0.25"/><circle cx="22.4" cy="12.38" r="0.55" fill="#4a4f55"/></g>
  <g id="screw-2"><circle cx="107.4" cy="12.38" r="1.5" fill="#b9bfc5" stroke="#5f666d" stroke-width="0.25"/><circle cx="107.4" cy="12.38" r="0.55" fill="#4a4f55"/></g>
</svg>
