<svg xmlns="http://www.w3.org/2000/svg" width="18.4mm" height="10.9mm" viewBox="0 0 18.4 10.9">
  <!-- nvidia/a100-eps12v-standin: the A100's CPU 8-pin connector, end on.
       Seen from behind with the board's side at the top, so the latch ramp is
       at the bottom (toward the shroud). A black housing, eight cells in two
       rows of four on a 4.2 pitch. Drawn in-house from the photograph's
       layout; nothing is traced. -->
  <rect id="opening" x="0" y="0" width="18.4" height="10.9" rx="0.5" fill="#17191c"/>
  <path id="inlet-face" fill="#08090a" d="M 0.7 0.7 H 17.7 V 10.2 H 0.7 Z"/>
  <g fill="#1d2024" stroke="#2c3036" stroke-width="0.1">
    <rect x="1.5" y="1.3" width="3.2" height="3.2"/>
    <rect x="5.7" y="1.3" width="3.2" height="3.2"/>
    <rect x="9.9" y="1.3" width="3.2" height="3.2"/>
    <rect x="14.1" y="1.3" width="3.2" height="3.2"/>
    <rect x="1.5" y="5.5" width="3.2" height="3.2"/>
    <rect x="5.7" y="5.5" width="3.2" height="3.2"/>
    <rect x="9.9" y="5.5" width="3.2" height="3.2"/>
    <rect x="14.1" y="5.5" width="3.2" height="3.2"/>
  </g>
  <!-- the latch ramp, on the housing's wall toward the shroud -->
  <path d="M 6.4 10.2 L 7.4 9.2 H 11.0 L 12.0 10.2 Z" fill="#26292d"/>
</svg>
