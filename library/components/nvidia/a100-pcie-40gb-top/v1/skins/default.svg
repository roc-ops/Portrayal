<svg xmlns="http://www.w3.org/2000/svg" width="38.23mm" height="266.7mm" viewBox="0 0 38.23 266.7">
  <!-- nvidia/a100-pcie-40gb-top: the A100 40GB's top edge seen from outside,
       from the bracket's outer face (y' 0) to the far end (y' 266.7). x' is the
       card's y less 1.77: the backplate at the left, then the board's edge, the
       black cover and the champagne shroud. The NVLink connectors are composed
       over it. Drawn in-house; nothing is traced. -->
  <rect id="backplate-edge" x="0" y="0.9" width="2.67" height="265.8" fill="#202326"/>
  <rect id="board-edge" x="2.67" y="0.9" width="1.57" height="265.8" fill="#1d2420"/>
  <rect id="cover-edge" x="4.24" y="0.9" width="8.39" height="265.8" fill="#202326"/>
  <rect id="shroud-edge" x="12.63" y="0.9" width="25.6" height="265.8" fill="#b8a68c"/>
</svg>
