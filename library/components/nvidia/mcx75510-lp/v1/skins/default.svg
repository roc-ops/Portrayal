<svg xmlns="http://www.w3.org/2000/svg" width="79.2mm" height="18.42mm" viewBox="0 0 79.2 18.42">
  <!-- nvidia/mcx75510-lp: MCX75510A on its short bracket. The outline, tip
       and keyed flange are std/pcie-bracket-lp@1, composed BEHIND this; what is drawn
       here is the punched plate: vents, light-pipe slots and port numerals.
       TIP AT THE LEFT - NVIDIA draws the card tip-right, so this is its
       figure turned a half-turn and the numerals read upside down. -->
  <!-- METAL FILLING THE OPENING: the bracket colour, 0.3 proud all round so
       the opening stroke leaves no ghost; the holes are punched in it. -->
  <rect id="plate" x="15.33" y="2.88" width="55.13" height="12.66" fill="#9aa1a8"/>
  <g id="vents"><rect x="65.03" y="15.57" width="4.90" height="1.65" rx="0.60" fill="#17191c"/><rect x="58.45" y="15.57" width="4.90" height="1.65" rx="0.60" fill="#17191c"/><rect x="51.98" y="15.57" width="4.90" height="1.65" rx="0.60" fill="#17191c"/><rect x="45.55" y="15.57" width="4.90" height="1.65" rx="0.60" fill="#17191c"/><rect x="71.81" y="10.00" width="3.45" height="4.73" rx="0.60" fill="#17191c"/><rect x="71.81" y="6.08" width="3.45" height="2.64" rx="0.60" fill="#17191c"/><rect x="40.16" y="10.00" width="3.45" height="4.73" rx="0.60" fill="#17191c"/><rect x="40.16" y="6.08" width="3.45" height="2.64" rx="0.60" fill="#17191c"/><rect x="35.20" y="10.00" width="3.45" height="4.73" rx="0.60" fill="#17191c"/><rect x="35.20" y="4.07" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="30.20" y="10.00" width="3.45" height="4.73" rx="0.60" fill="#17191c"/><rect x="30.20" y="4.07" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="25.23" y="10.00" width="3.45" height="4.73" rx="0.60" fill="#17191c"/><rect x="25.23" y="4.07" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="20.23" y="10.00" width="3.45" height="4.73" rx="0.60" fill="#17191c"/><rect x="20.23" y="4.07" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="15.28" y="10.00" width="3.45" height="4.73" rx="0.60" fill="#17191c"/><rect x="15.28" y="4.07" width="3.45" height="4.66" rx="0.60" fill="#17191c"/></g>
  <g id="slots"></g>
  <g id="silkscreen">
