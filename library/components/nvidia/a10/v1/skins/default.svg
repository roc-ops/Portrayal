<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="21.59mm" viewBox="0 0 120.02 21.59">
  <!-- nvidia/a10: the A10 on its full-height bracket. The outline, tip and keyed
       flange are std/pcie-bracket-fh@2, composed BEHIND this; what is drawn here
       is the punched plate: a field of narrow vertical vent slots with one screw
       at the tip end and the heat-sink fins behind them. TIP AT THE LEFT, flange
       end at the right. Every place is estimated from a 3/4 render
       (provenance face-window); nothing is traced. -->
  <rect id="plate" x="19.66" y="6.05" width="90.50" height="12.66" fill="#a7aeb5"/>
  <!-- the slot field: a dark window with 24 silver bars between the slots -->
  <rect id="window" x="24.0" y="7.6" width="81.0" height="9.6" rx="0.8" fill="#0d0e10" stroke="#8d9399" stroke-width="0.3"/>
  <g id="fins" fill="#a7aeb5">
    <rect x="26.2" y="7.6" width="1.3" height="9.6"/>
    <rect x="29.7" y="7.6" width="1.3" height="9.6"/>
    <rect x="33.2" y="7.6" width="1.3" height="9.6"/>
    <rect x="36.7" y="7.6" width="1.3" height="9.6"/>
    <rect x="40.2" y="7.6" width="1.3" height="9.6"/>
    <rect x="43.7" y="7.6" width="1.3" height="9.6"/>
    <rect x="47.2" y="7.6" width="1.3" height="9.6"/>
    <rect x="50.7" y="7.6" width="1.3" height="9.6"/>
    <rect x="54.2" y="7.6" width="1.3" height="9.6"/>
    <rect x="57.7" y="7.6" width="1.3" height="9.6"/>
    <rect x="61.2" y="7.6" width="1.3" height="9.6"/>
    <rect x="64.7" y="7.6" width="1.3" height="9.6"/>
    <rect x="68.2" y="7.6" width="1.3" height="9.6"/>
    <rect x="71.7" y="7.6" width="1.3" height="9.6"/>
    <rect x="75.2" y="7.6" width="1.3" height="9.6"/>
    <rect x="78.7" y="7.6" width="1.3" height="9.6"/>
    <rect x="82.2" y="7.6" width="1.3" height="9.6"/>
    <rect x="85.7" y="7.6" width="1.3" height="9.6"/>
    <rect x="89.2" y="7.6" width="1.3" height="9.6"/>
    <rect x="92.7" y="7.6" width="1.3" height="9.6"/>
    <rect x="96.2" y="7.6" width="1.3" height="9.6"/>
    <rect x="99.7" y="7.6" width="1.3" height="9.6"/>
    <rect x="103.2" y="7.6" width="1.3" height="9.6"/>
  </g>
  <!-- one screw at the tip end of the field -->
  <g id="screw-1"><circle cx="21.4" cy="12.38" r="1.5" fill="#b9bfc5" stroke="#5f666d" stroke-width="0.25"/><circle cx="21.4" cy="12.38" r="0.55" fill="#4a4f55"/></g>
</svg>
