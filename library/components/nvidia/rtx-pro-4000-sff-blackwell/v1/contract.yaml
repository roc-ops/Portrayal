format: 1
kind: module
name: rtx-pro-4000-sff-blackwell
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA RTX PRO 4000 Blackwell SFF Edition (24 GB GDDR7), an actively cooled
  low-profile dual-slot workstation card with a small blower. It takes no
  auxiliary power. The bracket face is a low-profile silver plate two slots across.
  It has four mini DisplayPort connectors on the board's side, with a latch slot
  beside each. A grid of square vent holes sits in a pressed panel held by two Torx
  screws.
  The shroud is dark grey with the blower's opening on its broad side and a black
  backplate. It plugs into one riser slot and covers the one beside it.
slot-width: 2
size: {w: 79.20, h: 41.91, d: 167.64}
size-confidence: {w: registry, h: registry, d: datasheet}
unplaced: >-
  no bay in the library lists this card in `accepts`. A riser bay that takes a low
  profile card names each card by hand (docs/cards-by-interface-design.md, status
  proposed: no interface or mates field exists on a card or a bay today), and no
  document held says any server takes a workstation card, so none was added.
attrs:
  model: 'RTX PRO 4000 Blackwell SFF Edition'
  part-numbers: 'PNY VCNRTXPRO4000BLP-PB (retail); NVIDIA 900-5G195-2200-000'
  role: gpu
  form-factor: 'Low profile, 2.7 in x 6.6 in, dual slot, on a low profile bracket; a full-height bracket is in the box'
  pcie-connector: x16
  pcie-generation: 5
  pcie-lanes: 8
  pcie-height: low
  power-draw-max-w: 70
  power-input: 'host PCIe slot only'
  memory: '24 GB GDDR7 with ECC, 192-bit, 432 GB/s'
  display-ports: '4 x mini DisplayPort 2.1b on the bracket; a mini DisplayPort to DisplayPort adapter is in the box'
  cooling: active
  airflow: 'blower; it draws air from the card''s broad side and exhausts toward the bracket'
  nvlink: 'none listed'
  eol: none-announced
provenance:
  slot-width: >-
    datasheet - NVIDIA's RTX PRO 4000 SFF datasheet (4016700): "Form Factor 2.7' x
    6.6' L, dual slot, half height"; the RTX PRO Blackwell quick-start guide (r18)
    lists the RTX PRO 4000 SFF among the "dual-slot GPUs" that "require removing two
    adjacent slot covers". The face is one plate about 38.7 across (`face-outline`).
    The card declares `slot-width: 2` as docs/pcie-two-slot-bays-design.md R1
    defines it.
  sources: >-
    NVIDIA RTX PRO 4000 Blackwell SFF Edition datasheet (4016700),
    https://www.nvidia.com/content/dam/en-zz/Solutions/products/workstations/professional-desktop-gpus/rtx-pro-4000-sff/workstation-datasheet-blackwell-rtx-pro-4000-sff-nvidia-us-4016700.pdf.
    PNY's print of it,
    https://www.pny.com/File%20Library/Company/Support/Product%20Brochures/NVIDIA%20RTX/English/NVIDIA-RTX-PRO-4000-Blackwell-SFF-Edition-Datasheet.pdf,
    and PNY's NVIDIA Professional Graphics line card (REV. 09.14.26),
    https://www.pny.com/File%20Library/Company/Support/linecards/pro-viz-gpus/NVIDIA-Professional-Graphics-Linecard.pdf,
    for the order codes. NVIDIA's RTX PRO Blackwell online quick-start guide (r18,
    17 March 2026),
    https://images.nvidia.com/aem-dam/Solutions/design-visualization/quadro-product-literature/rtx-pro-blackwell-online-qsg-210x148mm-20260317-r18.pdf:
    the box contents (a mini DisplayPort to DisplayPort adapter and a support
    full-height bracket), the dual-slot statement and that the card does not use a
    power cable. NVIDIA publishes no dimensioned drawing of this card: the geometry
    is measured on PNY's photographs (below) and carried over from the standards.
    The photographs are named by their files and licence is not stated; facts read
    from them, pictures not used.
  reference-photos: >-
    reference - PNY's product images for the RTX PRO 4000 SFF, under
    https://d2vfia6k6wrouk.cloudfront.net/productimages/de8264fa-0ea5-487f-bc02-b33600b81a79/images/
    (PNG with alpha, 800 x 800): rtx-pro-4000-sff-left-short-bracket.png (the low
    profile bracket straight on, 362 x 719 px, its tip at the bottom),
    rtx-pro-4000-sff-front-short-bracket.png (the broad side straight on, 720 x 322
    px), rtx-pro-4000-sff-back-short-bracket.png (the backplate straight on, 720 x
    335 px) and rtx-pro-4000-sff-3qtr-left-short-bracket.png, a 3/4 view from
    below (not scaled). NVIDIA's own 1200 x 630 render (rtx-pro-4000-og.jpg) is a
    marketing picture on a background and was not scaled. Each picture was checked
    to be this card: four mini DisplayPorts with a latch slot beside each, a 4 by 12
    vent grid in a pressed panel with two screws on a two-slot low profile bracket,
    a small blower on the broad side and the stepped lower edge, the same card in
    all four; none is byte-identical to a picture of another card. MM PER PIXEL:
    bracket photograph 0.1135 (8.81 px/mm); broad-side photograph 0.2502 along the
    card (3.997 px/mm) and 0.2484 across it (4.025 px/mm); back photograph 0.2519
    along (3.97 px/mm) and 0.2484 across (4.025 px/mm). All are set out under
    `face-outline`, `body-fan` and `body-backplate`. NO STRAIGHT-ON VIEW OF THE TOP
    EDGE OR THE FAR END EXISTS.
  size: >-
    registry - w is the low profile bracket's 79.2 (std/pcie-bracket-lp@1, PCIe CEM
    5.0 figure 11-9). h is two slots, 41.91, as the full-height two-slot cards have
    it: std/pcie-bracket-lp@1 is a one-slot plate 18.42 across and cannot be
    composed for a bracket that is two slots across, so the plate is drawn here, as
    nvidia/rtx-a2000@1 draws its own.
  depth: >-
    datasheet - 6.6 in, exactly 167.64, from the bracket's outer face as
    nvidia/rtx-a2000@1 reads the same figure. On the broad-side photograph the card
    runs 670 px from the bracket's outer face (column 89) to the far end (column 759),
    which at 3.997 px/mm is 167.6 (the scale along is set by that length), and the
    shroud's 224 px (rows 242 to 466) at 4.025 px/mm are 55.65 across, the low
    profile board's height; the 318 px from the bracket's tip to the top edge are
    79.2 at 4.015 px/mm.
  face-outline: >-
    photo-measured - the bracket photograph turned a quarter turn into this frame,
    tip at the left and the board's side at the top. Its scale is the two retention
    tabs, whose centres are 179 px apart (316 and 495), the 20.32 slot pitch, so 8.81
    px/mm (0.1135 mm/px); the tabs are 88 and 86 px wide, 10.0 and 9.8 against CEM's
    10.2. The plate's own length checks it: the tip is row 757 and the flange's fold row
    59, 698 px, 79.2 at that scale. The first tab's centre is put at y 12.38, where
    the standard puts its own. Read that way the plate's board-side edge is at y 3.2
    and its far edge at 41.9, 38.7 across, which is the 41.91 envelope; the outline is
    the standard's low profile shape (tabs 10.2 wide and 7.27 long, 45 degree
    chamfers of 4.11 to the body at 11.38) with the far edge stepping in 2.8 near the
    flange end over a bevel from x 74.2, as nvidia/rtx-a2000@1 reads it and as this
    photograph shows. Readings are good to about 0.5 mm.
  face-displayports: >-
    photo-measured - four mini DisplayPort receptacles along the board's side, at the
    same scale. Each shell is 9.2 along the bracket and 6.2 across (y 6.6 to 12.8).
    Their centres along the bracket are 31.0, 43.8, 56.6 and 69.4, a pitch of 12.8
    (113 px). The photograph prints the port numbers 1 to 4 on the plate beyond each
    receptacle's tip end, 2.2 high; they are drawn. THE LIBRARY HAS NO DISPLAYPORT
    PART OR INTERFACE, and none for a mini DisplayPort, so each is an element of class
    `connector` painted in the skin and not a seated part; nothing mates it and the
    module type carries no port for them (the `display-ports` attr says 4 x mini
    DisplayPort 2.1b, the datasheet's words).
  face-latches: >-
    photo-measured - beside each receptacle, on the grid's side, a dark slot 6.3 by
    2.1 (y 14.1 to 16.2) for the connector's latching mechanism, centred on the
    receptacle, and between each pair a small square 2.0 by 2.0 (y 14.2 to 16.2) at
    x 63.0, 50.2 and 37.4. The squares have no stated purpose and are drawn as dark
    squares.
  face-grille: >-
    photo-measured - a grid of square vent holes beside the receptacles: 4 columns
    across and 12 rows along the bracket. Each hole is 3.0 square (26.5 px) on a
    pitch of 4.0 along (35.3 px) and 4.03 across, the columns at y 18.9, 22.93, 26.96
    and 31.0 and the rows from x 28.6 to 75.6. In the first and last row the fourth
    hole is replaced by the screw and the third is narrow (1.7 across). The grid sits
    in a pressed panel whose raised edge is drawn as a line (x 25.7 to 78.9, y 17.7 to
    35.3).
  face-screws: >-
    photo-measured - two Torx screws in the grid's two end corners, at x 75.4 and
    29.7 and y 31.8 and 31.7, heads 4.6 across. The recess is drawn as a plain dark
    circle, not a six-lobe star.
  thickness: >-
    estimated - the datasheet states no thickness. The shroud's far face is put at y
    40.0, as the full-height two-slot cards have it, and the backplate's outer face at
    1.77, the CEM rear envelope's 2.67 behind the board. The bracket photograph's
    plate is 38.7 across, which bounds a dual-slot card at 41.91.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-lp@1 is. The board, and the bracket's keyed
    side, are at the top (small y), which is where the receptacles are.
  body: >-
    the board, its edge and the pads follow PCIe CEM 5.0 (figures 6-5 and 11-3, as
    nvidia/a2@1 and nvidia/rtx-a2000@1 have them for a low profile card): the card
    68.90 high from the finger datum W (at x 11.11 on this bracket), its lower edge
    13.25 above W, the key datum 58.15 behind the bracket and the x16 finger tab to the
    standard's 81.88 past it. NVIDIA prints no figure for this card. The broad-side
    photograph agrees on the height (224 px at 4.025 px/mm, 55.65). The lower edge has
    a step near the far end from 141.6 to 159.9 behind the bracket, 4.0 deep (16 px;
    the shroud's lower edge is row 466 and the step's floor row 450), with a vertical
    wall at the bracket end and a ramp at the far end: it is drawn as one box 18.3
    long. THE BOARD STARTS 0.90 behind the bracket, as nvidia/a10@1 has it (estimated).
  body-shroud: >-
    photo-measured - the shroud is dark grey, one slab from the board's component face
    (y 6.01) to the far face (40.0), the outline of the board, split at the step as
    the board is. Its broad side shades from darker at the bracket end to lighter at
    the far end, a smooth ramp, painted as a gradient.
  body-backplate: >-
    photo-measured - the back photograph shows a flat matte black plate over the
    board's whole rear, on the board's outline, with eight small screws: four on the
    lower edge's side (x 28.6) at 15.6, 34.0, 129.7 and 163.7 behind the bracket's outer
    face and four on the top edge's side (x 75.8) at 15.6, 49.9, 114.4 and 164.0. It
    has no opening for the blower. Its thickness is the CEM rear envelope's 2.67,
    estimated. The photograph's two small printed corner marks are not drawn. Screw
    places are read to about 1 mm.
  body-fan: >-
    photo-measured - the blower's opening on the broad side, from PNY's photograph at
    3.997 px/mm along and 4.025 across. The ring's outer rim is 159 px across, 39.7,
    centred 38.5 from the far end and 23.1 below the top edge, close to the top edge
    as the RTX A2000's is (38.5 and 23.0). The flat hub is 70 px, 17.5 across, inside
    a blade zone 35.1 across. About 54 swept blades are counted; the lean drawn (30
    degrees) is schematic. Painted on the broad side, not an opening in the 3D body.
  body-top-edge: >-
    estimated - no photograph shows this edge: PNY's 3/4 view looks up at the card
    from below and NVIDIA's own render is a marketing picture. The edge is drawn
    plain, dark and flat, with no printing, strip or connector, and the maker's mark
    is not drawn and not reserved (nothing is known of where it is, if there is one).
  body-end: >-
    estimated - a closed dark end plate 1.0 thick, 0.4 inside the card's length, as
    nvidia/a10@1 has it. No photograph shows the end.
  power: >-
    datasheet - total board power 70 W in NVIDIA's datasheet and PNY's print and line
    card ("70W Active"); no auxiliary connector (the quick-start guide: the RTX PRO 4000
    SFF does not use a power cable). The sources agree.
  memory: >-
    datasheet - 24 GB GDDR7 with ECC, 192-bit, 432 GB/s.
  pcie: >-
    datasheet - PCIe 5.0 x8 in a full-length (x16) connector: the datasheet's footnote
    says "Uses full-length PCIe interface". The attrs say x16 for the connector and 8
    lanes.
  nvlink: >-
    datasheet - the datasheet does not list NVLink and the card has no connector for
    one on any photograph held. The attr says `none listed`.
  part-numbers: >-
    datasheet - PNY's line card (REV. 09.14.26): "NVIDIA RTX PRO 4000 SFF Blackwell
    Edition VCNRTXPRO4000BLP-PB 900-5G195-2200-000, 24GB". NVIDIA's own datasheet gives
    none.
  weight: >-
    not stated - no datasheet held gives a weight for the card.
  lifecycle: >-
    PNY's line card of September 2026 lists the card as a current part and no
    end-of-life notice was found in the documents held. The attr says `none-announced`.
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) a view of the top edge and the far end (needs-photo;
    the edge is drawn plain); (2) the DisplayPort part and interface, which the library
    lacks, and a mini DisplayPort one (the four are painted, not seated); (3) the
    thickness, which no source states (vendor-silent); (4) the fingers' true outline,
    which the broad-side photograph draws shorter than CEM (needs-drawing); (5) a weight
    (vendor-silent in the documents held); (6) a low-profile two-slot bracket in the
    registry (std/pcie-bracket-lp@1 is a one-slot plate), so the plate is photo-measured
    only; (7) the full-height support bracket in the box, which no photograph shows on
    this card; (8) no dimensioned drawing of any active workstation card (the intake's
    handoff list, item 1).
