<svg xmlns="http://www.w3.org/2000/svg" width="79.2mm" height="41.91mm" viewBox="0 0 79.2 41.91">
  <!-- nvidia/rtx-pro-4000-sff-blackwell: the RTX PRO 4000 SFF Blackwell
       low-profile dual-slot bracket, seen from OUTSIDE the chassis, drawn from the
       facts in the contract's provenance (a straight-on photograph of the bracket,
       scaled by the two retention tabs: 0.1135 mm per pixel). TIP AT THE LEFT,
       flange end at the right, the board's side at the top, as
       std/pcie-bracket-lp@1 is drawn: the photograph (tip at the bottom) is turned
       a quarter turn into this frame. A silver plate with four mini DisplayPort
       receptacles along the board's side, a latch slot beside each, and a grid of
       4 x 12 square vent holes in a pressed panel with a Torx screw in each end
       corner. Nothing is traced. -->
  <defs>
    <!-- one vent hole 3.0 square on a 4.0 pitch along the bracket and 4.03 across -->
    <pattern id="hole" patternUnits="userSpaceOnUse" x="32.6" y="18.9" width="4.0" height="4.03">
      <rect x="0" y="0" width="3.0" height="3.0" fill="#101112"/>
    </pattern>
  </defs>
  <path id="plate" d="M1.9 7.28 L7.27 7.28 L11.38 3.17 L79.2 3.17 L79.2 39.1 L77.0 39.1 L74.2 41.91 L11.38 41.91 L7.27 37.8 L1.9 37.8 A1.9 1.9 0 0 1 0 35.9 L0 29.5 A1.9 1.9 0 0 1 1.9 27.6 L7.27 27.6 L10.35 24.52 A2.1 2.1 0 0 0 10.35 20.56 L7.27 17.48 L1.9 17.48 A1.9 1.9 0 0 1 0 15.58 L0 9.18 A1.9 1.9 0 0 1 1.9 7.28 Z" fill="#a3a6a9" stroke="#5f666d" stroke-width="0.4" stroke-linejoin="round"/>
  <!-- the fold: the flange turns 90 degrees here. On an elevation it is a line. -->
  <path id="flange-fold" d="M78.8 3.5 V38.8" stroke="#5f666d" stroke-width="0.3" fill="none"/>
  <!-- the pressed panel the grid and its screws sit in: a raised edge drawn as a
       line, x 25.7 to 78.9 and y 17.7 to 35.3 -->
  <rect id="panel" x="25.7" y="17.7" width="53.2" height="17.6" rx="3.6" fill="none" stroke="#d9dbdd" stroke-width="0.5"/>
  <rect x="25.4" y="17.4" width="53.8" height="18.2" rx="3.8" fill="none" stroke="#6d7175" stroke-width="0.3"/>
  <!-- the four latch slots (6.3 along, 2.1 across, y 14.1 to 16.2) and the three
       small squares between them (2.0 square) -->
  <g id="latches" fill="#101112">
    <rect x="66.25" y="14.1" width="6.3" height="2.1" rx="0.3"/>
    <rect x="53.45" y="14.1" width="6.3" height="2.1" rx="0.3"/>
    <rect x="40.65" y="14.1" width="6.3" height="2.1" rx="0.3"/>
    <rect x="27.85" y="14.1" width="6.3" height="2.1" rx="0.3"/>
    <rect x="61.9" y="14.2" width="2.0" height="2.0" rx="0.3"/>
    <rect x="49.1" y="14.2" width="2.0" height="2.0" rx="0.3"/>
    <rect x="36.3" y="14.2" width="2.0" height="2.0" rx="0.3"/>
  </g>
  <!-- the four mini DisplayPort receptacles: a 9.2 x 6.2 shell, a dark opening and
       the tongue. Each is drawn once at its own place; the library has no
       DisplayPort part. Centres 69.4, 56.6, 43.8 and 31.0 along the bracket. -->
  <g id="display-port-1">
    <rect x="64.8" y="6.6" width="9.2" height="6.2" rx="1.3" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M65.8 7.4 H73.0 V10.6 L71.7 11.9 H67.1 L65.8 10.6 Z" fill="#18191b"/>
    <rect x="67.0" y="8.9" width="4.8" height="1.6" fill="#6b6e72"/>
  </g>
  <g id="display-port-2">
    <rect x="52.0" y="6.6" width="9.2" height="6.2" rx="1.3" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M53.0 7.4 H60.2 V10.6 L58.9 11.9 H54.3 L53.0 10.6 Z" fill="#18191b"/>
    <rect x="54.2" y="8.9" width="4.8" height="1.6" fill="#6b6e72"/>
  </g>
  <g id="display-port-3">
    <rect x="39.2" y="6.6" width="9.2" height="6.2" rx="1.3" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M40.2 7.4 H47.4 V10.6 L46.1 11.9 H41.5 L40.2 10.6 Z" fill="#18191b"/>
    <rect x="41.4" y="8.9" width="4.8" height="1.6" fill="#6b6e72"/>
  </g>
  <g id="display-port-4">
    <rect x="26.4" y="6.6" width="9.2" height="6.2" rx="1.3" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M27.4 7.4 H34.6 V10.6 L33.3 11.9 H28.7 L27.4 10.6 Z" fill="#18191b"/>
    <rect x="28.6" y="8.9" width="4.8" height="1.6" fill="#6b6e72"/>
  </g>
  <!-- the vent grid: 4 columns by 12 rows of 3.0 square holes. The ten middle
       rows are one pattern; the first and last rows lose the fourth hole to the
       screw and have a narrow third. -->
  <rect id="vent" x="32.6" y="18.9" width="39.0" height="15.09" fill="url(#hole)"/>
  <g id="vent-ends" fill="#101112">
    <rect x="72.6" y="18.9" width="3.0" height="3.0"/>
    <rect x="72.6" y="22.93" width="3.0" height="3.0"/>
    <rect x="72.6" y="26.96" width="3.0" height="1.7"/>
    <rect x="28.6" y="18.9" width="3.0" height="3.0"/>
    <rect x="28.6" y="22.93" width="3.0" height="3.0"/>
    <rect x="28.6" y="26.96" width="3.0" height="1.7"/>
  </g>
  <g id="screws">
    <g id="screw-1"><circle cx="75.4" cy="31.8" r="2.3" fill="#7e8388" stroke="#33363a" stroke-width="0.3"/><circle cx="75.4" cy="31.8" r="0.9" fill="#2b2d30"/></g>
    <g id="screw-2"><circle cx="29.7" cy="31.7" r="2.3" fill="#7e8388" stroke="#33363a" stroke-width="0.3"/><circle cx="29.7" cy="31.7" r="0.9" fill="#2b2d30"/></g>
  </g>
  <!-- the port numbers printed on the plate, upright in this frame: 1 beside the
       first square and 4 below the last receptacle -->
  <g id="silkscreen">
    <text x="62.9" y="13.9" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#6f7377">1</text>
    <text x="50.1" y="13.9" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#6f7377">2</text>
    <text x="37.3" y="13.9" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#6f7377">3</text>
    <text x="24.5" y="13.9" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#6f7377">4</text>
  </g>
</svg>
