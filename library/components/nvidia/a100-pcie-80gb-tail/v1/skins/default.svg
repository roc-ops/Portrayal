<svg xmlns="http://www.w3.org/2000/svg" width="97.9mm" height="38.23mm" viewBox="0 0 97.9 38.23">
  <!-- nvidia/a100-pcie-80gb-tail: the A100's far end seen from behind, from
       the backplate (y 0) to the shroud's far wall (y 38.23). THE TOP EDGE IS
       AT THE LEFT: x' = 126.31 less the card's x. The black end plate is below,
       the open shroud above it with the fin stack edge-on, and a connector and
       two mount bosses on the plate. Drawn in-house; nothing is traced. -->
  <rect id="end-plate" x="0" y="0" width="97.9" height="12.63" fill="#202326"/>
  <!-- the shroud's rim: a wall round the opening, 2.1 thick, estimated -->
  <rect id="shroud-rim" x="0" y="12.63" width="97.9" height="25.6" fill="#b8a68c"/>
  <rect id="opening" x="2.1" y="12.63" width="93.7" height="23.5" fill="#07080a"/>
  <!-- the fin stack, edge-on: 18 fins on a 5.0 pitch, 0.8 thick. The first is
       at x' 95.06, which is the card's x 31.25 and the face window's grid. -->
  <g id="fins" fill="#2b2e32">
    <rect x="94.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="89.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="84.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="79.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="74.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="69.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="64.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="59.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="54.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="49.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="44.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="39.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="34.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="29.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="24.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="19.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="14.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="9.66" y="12.63" width="0.8" height="23.5"/>
  </g>
  <!-- the extender mount: two tapped bosses the straight and long offset
       extenders' thumbscrews fasten to, 28.8 apart, centred on the extender
       flange's width -->
  <circle id="mount-1" cx="91.01" cy="6.63" r="2.0" fill="#8a9199" stroke="#5f666d" stroke-width="0.2"/>
  <circle id="mount-2" cx="62.21" cy="6.63" r="2.0" fill="#8a9199" stroke="#5f666d" stroke-width="0.2"/>
</svg>
