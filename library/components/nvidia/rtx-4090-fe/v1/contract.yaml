format: 1
kind: module
name: rtx-4090-fe
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA GeForce RTX 4090 Founders Edition, a dual-axial-fan Founders Edition
  card that is three slots wide. The bracket face carries three DisplayPort
  and one HDMI receptacle on the board's side, with four vent panes below
  them. The shroud is the X-shaped Founders Edition design. Its fan pocket is
  at the far end and its model name is printed on the other pocket. The heat
  sink's fins show along the top edge. Its power connector is a 16-pin
  (12VHPWR) receptacle in a notch in the top edge. It plugs into one riser
  slot and covers the two beside it.
slot-width: 3
size: {w: 120.02, h: 62.23, d: 304}
size-confidence: {w: registry, h: registry, d: datasheet}
unplaced: >-
  no bay in the library lists this card in `accepts`, and no bay states `interface: pcie-fh`. The card
  does not state `mates: pcie-fh`: the library has not begun that migration (spec/tests/test_cards_by_interface.py
  holds it at no part until it does). No document held says any server takes a consumer card.
attrs:
  model: 'RTX 4090'
  edition: 'Founders Edition'
  role: gpu
  form-factor: 'Full-height, three-slot (61 mm), 304 mm x 137 mm'
  pcie-connector: x16
  pcie-height: full
  power-draw-max-w: 450
  power-input: 'host PCIe slot and one 16-pin 12VHPWR connector; an adapter from three PCIe 8-pin cables is in the box'
  memory: '24 GB GDDR6X, 384-bit'
  display-ports: '3 x DisplayPort and 1 x HDMI on the bracket'
  cooling: active
  airflow: 'axial fan on the broad side; a flow-through heat sink exhausts through the second side and the top edge'
faces:
  rear: {ref: nvidia/rtx-4090-fe-tail@1}
  plan: {ref: nvidia/rtx-4090-fe-top@1}
provenance:
  slot-width: >-
    datasheet - NVIDIA's RTX 4090 page prints 3-Slot (61mm), and the quick-
    start guide says 'Remove three adjacent slot covers'. The card declares
    `slot-width: 3` (the schema allows up to 4; docs/pcie-two-slot-bays-
    design.md leaves room for a three-slot card in a bay that lists two ids in
    `span`). The face is one plate three slot pitches across: CEM draws no
    three-slot bracket, so the outline is the two-slot bracket's with a third
    tab, as the guide's drawing shows three tabs. CONFLICT: the intake's note
    that the 50-series guides say two covers for a 3-slot clearance box does
    not apply to this card; the 4090's own guide says three.
  sources: >-
    NVIDIA GeForce RTX 4090 Founders Edition - NVIDIA's GeForce RTX 4090 page,
    https://www.nvidia.com/en-us/geforce/graphics-cards/40-series/rtx-4090/;
    NVIDIA GeForce RTX 4090 quick-start guide, Rev1 (vector):
    https://www.nvidia.com/content/geforce-gtx/GeForce_RTX_4090_QSG_Rev1.pdf;
    NVIDIA PCI Express CEM 5.0 via the library's standards registry. NVIDIA's
    compare page, https://www.nvidia.com/en-us/geforce/graphics-cards/compare/
    (card dimensions). NVIDIA's case-clearance diagram for this card (the
    intake's compguide folder: 'case-size', 'slots', and the power-connector
    panels). NVIDIA publishes no dimensioned drawing of any GeForce card. The
    pages and guides were fetched on 2026-10-07 and the figures converted on
    2026-10-08. The pictures are NVIDIA's; their licence is not stated, so
    facts were read from them and no picture is copied.
  reference-images: >-
    estimated - NO STRAIGHT-ON PICTURE OF THE RTX 4090 EXISTS in the intake.
    What is held: the 4090 quick-start guide (Rev1, vector), whose page 5
    draws the card obliquely with the bracket's ports; NVIDIA's case-size
    diagram (12 in, 5.4 in, '3 Slots', 1.4 in above the connector); and a 3/4
    hero picture at 1280 px (geforce-rtx-4090-hero-350-p@2x.jpg),
    https://www.nvidia.com/content/dam/en-
    zz/Solutions/geforce/ada/rtx-4090/geforce-rtx-4090-hero-350-p@2x.jpg. The
    hero shows the same X, the same notch in the top edge and the fan at the
    far end as the 4070 SUPER. THE BROAD SIDE IS THEREFORE THE 4070 SUPER'S
    ELEVATION SCALED BY THE RATIO OF THE TWO STATED SIZES: 304 over 244 along
    (1.246) and 125.0 over 100.3 across (1.246 again), 4.855 of the
    elevation's px per mm. It is ESTIMATED throughout and was checked by eye
    on the 3/4 hero (the model name on the left pocket, the large fan on the
    right, the notch in the top edge); it is a borrowed shape at the 4090's
    stated size, not a measurement.
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2,
    PCIe CEM 5.0 figure 11-5). h is three slots: the single bracket's 21.59
    plus two 20.32 slot pitches, 62.23.
  depth: >-
    datasheet - NVIDIA's page prints the length as 304 mm, taken from the
    bracket's outer face as nvidia/a100-pcie-40gb@1 reads the same kind of
    figure. The guide's clearance box agrees: 'Must have space for 304 mm (L)
    x 137 mm (W) x 61 mm (H) card' and NVIDIA's case diagram prints 12 in by
    5.4 in for the 4090.
  face-outline: >-
    estimated - the plate is std/pcie-bracket-fh@2's, as nvidia/rtx-a6000@1
    draws it, with a third tab and a far edge at 61.5: 120.02 long, the 0.8
    fold at the flange end, ten-wide retention tabs on the 20.32 slot pitch
    with the 4.1 board-side step and the V notches between them. No straight-
    on photograph of a GeForce bracket exists, so no outline of it was
    measured; the guides draw the plate obliquely, show 3 tabs and a hook-
    shaped flange that this skin does not draw.
  face-ports: >-
    drawing - the bracket's port places are read on the VECTOR figure of
    NVIDIA's guide (the 4090 quick-start guide and the 4070 SUPER user guide,
    page 5, which draw one bracket in an oblique view): the callout dots on
    the page are vector circles at the port centres (y 199.7, 218.9, 238.6 and
    258.8 pt on both pages) and the bracket's flange hook and tab tips were
    read on a 400 dpi render of the same page. As fractions of the plate's
    length from the tab tips the ports lie at 0.875, 0.721, 0.562 and 0.400
    (4090) and 0.856, 0.716, 0.572 and 0.424 (4070 SUPER); the mean, times the
    standard 120.02 plate, puts the three DisplayPort receptacles at 103.9,
    86.2 and 68.1 from the tip and the HDMI receptacle at 49.5. The two pages
    agree to 2 mm and the oblique view is in some perspective, so every place
    is good to about 2 mm. The order, flange end to tab end, is DisplayPort,
    DisplayPort, DisplayPort, HDMI, as the guides' callouts name them. A
    DisplayPort shell is drawn 16.4 long and 7.1 across (y 6.1 to 13.2, as the
    A6000's photographed shells), an HDMI shell 14.5 by 6.0: sizes are
    estimated, not measured. NO STRAIGHT-ON VIEW OF ANY GEFORCE BRACKET EXISTS
    in the intake (0 of 24 boards), so this face is the least certain part of
    the card. THE LIBRARY HAS NO DISPLAYPORT OR HDMI PART OR INTERFACE, so
    each receptacle is an element of class `connector` painted in the skin and
    not a seated part; the `display-ports` attr says what the page says. The
    three DisplayPort pitches (17.8) are tighter than the 21.4 PNY's
    photograph of the RTX A6000's four read; that is another card and was not
    carried over.
  face-vent: >-
    estimated - the guide's drawing shows the vent column below the ports as
    four grilles in a row with narrow bars between them, a screw at the tab
    end and a hole near the flange. Their places are read as fractions of the
    plate's length on the same page: the four panes from about 25 to 111
    along, each 20.2 long with 1.5 bars, and three screws at x 36.5 across the
    three slots (the 4090's guide draws three at the tab end). No hole is
    drawn at the flange.
  face-markings: >-
    estimated - the guides draw no lamp, label or printing on the bracket and
    no straight-on picture exists to resolve any (no control in the same image
    can be named, so this is a gap, not a reading).
  thickness: >-
    datasheet - NVIDIA prints 3-Slot (61mm) and 'x 61mm (H) card' in the
    guide. The shroud's far face is put at y 61.0 from the bracket's board-
    side datum (the envelope is 62.23). Whether NVIDIA's 61 includes the
    backplate is not stated; the backplate is not drawn.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the A100 are. The board, and
    the bracket's keyed side, are at the top (small y), which is where the
    DisplayPorts are.
  body: >-
    estimated - the board and its edge follow PCIe CEM 5.0. The shroud is the
    4070 SUPER's, scaled to the 4090's stated 137 mm total height (the finger
    edge to the shroud's far edge, 136.6 here): x 26.73 to 151.75, 125.0 high.
    The board box runs 159.1 behind the bracket and is hidden.
  body-shroud: >-
    estimated - one dark slab from the board's component face (y 6.01) to the
    far face (61.0), in three boxes split at the top edge's notch (provenance
    body-power-connector) so that the notch is a real step in 3D. Its broad
    side is painted from the elevation: the X-shaped waist, the two pockets
    with their bright rims, the louvres beside the fan pocket and the printed
    model name. The BACK of the card (its backplate and the second fan the
    Founders Edition design has there) is shown in no picture at its scale and
    is not drawn.
  body-fan: >-
    estimated - the fan in the far pocket is the 4070 SUPER's, scaled to the
    4090: ring about 113 mm, hub 41 mm. The number of blades (11) is the
    Founders Edition 4090's by memory of the 3/4 hero, where about eleven can
    be counted; it is not read from a scaled picture.
  body-top-edge: >-
    estimated - the top edge is seen only in 3/4 views (the 3080's gallery
    pictures and the guides' oblique drawings), so nothing on it is scaled
    from a picture of it. What is drawn: the shroud's end caps in the shroud's
    metal (champagne on the 3080 and 3080 Ti, grey on the 4070 and 4070 SUPER,
    olive-grey on the 4090) and, between them from 108 to 193 behind the
    bracket, the heat sink's fins, one every 1.6 mm. The run is read from the
    broad-side elevation (the 3080's open run between the two pockets; the
    4070 SUPER's, scaled for the 4090). The lettering on the far cap is a
    maker's wordmark and is reserved as `logo-zone` in skins/body-right.svg,
    not drawn.
  body-power-connector: >-
    estimated - NVIDIA's family page says 'Supplementary Power Connectors: 3x
    PCIe 8-pin cables (adapter in box) OR 450 W or greater PCIe Gen 5 cable'
    and the guide's callout reads 'PCIe Gen5 16-pin Power Connector', drawn on
    the TOP of the card in a notch midway along it ('power receptacle on the
    top of the graphics card'). It is the 12VHPWR receptacle (the guide's
    inset shows twelve large cells and four small sense cells). The card
    composes std/12vhpwr-header@1 as `aux-power` on its top face
    (`faces.plan`, nvidia/rtx-4090-fe-top@1). DCIM exports no power port for
    it for now: the owner chose to keep the header on the top face, and the
    exporter reads only `faces.rear`. The 3D body draws the housing in the notch (20.85 x 11.7, 9.0 deep). The
    notch's place (about midway along the card) is read on the 3/4 pictures
    and guide drawings, and its size is a guess: centred 180.7 behind the
    bracket, 28 long, 4.5 deep (the 4090's scaled from the 4070 SUPER's). A
    1.4 in (35.6 mm) cable clearance above the connector is NVIDIA's case
    diagram's; it is not drawn.
  body-end: >-
    estimated - a closed dark end plate 1.0 thick at the far end. No
    photograph shows the end; the elevation shows the shroud's far edge only.
    The rear face (`faces.rear`, nvidia/rtx-4090-fe-tail@1) is a plain plate.
  power: >-
    datasheet - NVIDIA's page: 'Total Graphics Power (W) 450'. The figure is
    the board's total, filed as the maximum.
  memory: >-
    datasheet - 24 GB GDDR6X, 384-bit. NVIDIA's family page, Memory Specs.
  part-numbers: >-
    not stated - no document held gives an order code or part number for this
    Founders Edition card (NVIDIA sells it direct and prints none on the pages
    held).
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) a straight-on view of the I/O bracket
    (needs-photo; the whole face is estimated from NVIDIA's guide drawing and
    the standard); (2) a straight-on view of the top edge and the far end
    (needs-photo; the fin run, the caps, the wordmark and the notch are read
    from 3/4 views, and the 12VHPWR notch's size is estimated); (3) the
    DisplayPort and HDMI parts and interfaces, which the library lacks
    (painted, not seated); (4) the card's back, its backplate and the second
    fan, which no picture at scale shows (needs-photo); (5) a weight and an
    order code (vendor-silent in the documents held); (6) PCIe generation,
    which no document held states in a table (vendor-silent: the page tables
    held carry no bus row); (7) the lifecycle, which was not searched; (8) the
    dimensioned FE board outline and bracket drawing, which NVIDIA does not
    publish (handoff list, item 1 of the intake). (9) NO STRAIGHT-ON VIEW OF
    THE BROAD SIDE: the whole shroud is borrowed from the 4070 SUPER's
    elevation and scaled.
  conflicts: >-
    CONFLICTS SETTLED: (a) NVIDIA prints 3-Slot (61mm), the intake's COVERAGE
    note raised a conflict for the 50-series (guides say two covers for a
    three-slot box); the 4090's guide says three covers and its page says
    3-slot, so there is none here; (b) the case diagram's 12 in and 5.4 in are
    304.8 and 137.2 mm against the page's 304 and 137: the page's are used;
    (c) the 4090's connector is the 12VHPWR receptacle (guide: 'PCIe Gen5
    16-pin'); (d) no two-slot card's 41.91 envelope holds this card, which is
    why its face is three slots across.
