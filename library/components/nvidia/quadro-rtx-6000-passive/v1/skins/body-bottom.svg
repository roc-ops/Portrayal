<svg xmlns="http://www.w3.org/2000/svg" width="97.9mm" height="265.8mm" viewBox="-6.29 0 97.9 265.8">
  <!-- nvidia/quadro-rtx-6000-passive: THE SHROUD'S BROAD SIDE, the body's
       bottom side seen from outside. Across: 120.02 (the face's width) less the
       face's x, so the card's top edge is at -6.29 and its lower edge at 91.61.
       Down: 266.7 less mm behind the bracket's outer face, so the far end is at
       the top and the bracket's end at the bottom. The 14 slots are scaled off
       PB-09762 figure 4 (provenance body-broad-slots): 2.2 across on a 5.24
       pitch, from 46.4 to 221.0 down this drawing. The maker's mark is
       reserved near the bracket's end, where figure 4 puts it. -->
  <rect x="-6.29" y="0" width="97.9" height="265.8" fill="#53565b"/>
  <g id="slots" fill="#0e0f10" stroke="#2d3034" stroke-width="0.25">
