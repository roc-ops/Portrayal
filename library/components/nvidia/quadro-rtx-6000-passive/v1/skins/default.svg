<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="41.91mm" viewBox="0 0 120.02 41.91">
  <!-- nvidia/quadro-rtx-6000-passive: the passive server card's dual-slot
       bracket, seen from OUTSIDE the chassis. THE PLATE'S OUTLINE IS THE A100
       80GB'S DRAWING (nvidia/a100-pcie-80gb@1), borrowed: the product brief's
       end view (figure 7) shows the same two tabs, V notch and flange, and no
       straight-on view of this card's bracket exists (provenance face-outline).
       The window is crossed by X braces, as the brief's 3/4 view (figure 1)
       shows it, with two screws on the crossings; those are estimated.
       TIP AT THE LEFT, flange end at the right, the board's side at the top, as
       std/pcie-bracket-fh@2 is drawn. -->
  <path id="plate" d="M1.9 7.4 L7.27 7.4 L9.57 5.1 L20.0 5.1 L21.0 4.1 L119.2 4.1 L119.2 0.3 L120.02 0.3 L120.02 39.7 L119.2 39.7 L119.2 40.0 L9.67 40.0 L7.27 37.6 L1.9 37.6 A1.9 1.9 0 0 1 0 35.7 L0 29.8 A1.9 1.9 0 0 1 1.9 27.9 L7.27 27.9 L10.95 24.22 A2.4 2.4 0 0 0 10.95 20.88 L7.27 17.2 L1.9 17.2 A1.9 1.9 0 0 1 0 15.3 L0 9.3 A1.9 1.9 0 0 1 1.9 7.4 Z" fill="#9aa1a8" stroke="#5f666d" stroke-width="0.4" stroke-linejoin="round"/>
  <!-- the fold: the flange turns 90 degrees here. On an elevation it is a line. -->
  <path id="flange-fold" d="M119.6 0.6 V39.4" stroke="#5f666d" stroke-width="0.3" fill="none"/>
  <!-- the vent window, one opening from x 31.2 to 107.31 as the A100's is drawn
       (the registry's windows end 12.76 from the flange) -->
  <g id="grille">
    <rect id="vent" x="31.2" y="11.8" width="76.11" height="25.8" rx="2.0" fill="#141618" stroke="#41474d" stroke-width="0.3"/>
    <!-- two cells, each crossed corner to corner: the X braces of the brief's
         figure 1, 1.6 wide -->
    <g id="braces" stroke="#8d9399" stroke-width="1.6" fill="none" stroke-linecap="butt">
      <path d="M32.6 13.2 L67.9 36.2"/>
      <path d="M32.6 36.2 L67.9 13.2"/>
      <path d="M70.6 13.2 L105.9 36.2"/>
      <path d="M70.6 36.2 L105.9 13.2"/>
    </g>
    <g id="screw-1"><circle cx="50.25" cy="24.7" r="2.15" fill="#b9bfc5" stroke="#5f666d" stroke-width="0.3"/><circle cx="50.25" cy="24.7" r="0.8" fill="#4a4f55"/></g>
    <g id="screw-2"><circle cx="88.25" cy="24.7" r="2.15" fill="#b9bfc5" stroke="#5f666d" stroke-width="0.3"/><circle cx="88.25" cy="24.7" r="0.8" fill="#4a4f55"/></g>
  </g>
</svg>
