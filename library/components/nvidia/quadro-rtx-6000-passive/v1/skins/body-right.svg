<svg xmlns="http://www.w3.org/2000/svg" width="265.8mm" height="38.23mm" viewBox="0.9 1.77 265.8 38.23">
  <!-- nvidia/quadro-rtx-6000-passive: THE TOP EDGE, the body's right side seen
       from outside. Across: mm behind the bracket's outer face (0.9 to 266.7,
       the shroud's length). Down: the face's y (1.77 the backplate's outer
       face, 40.0 the shroud's). Every piece whose right side is the card's top
       edge `shows: [right]` and carries its patch of this. The one NVLink cap
       is the contract's `nvlink` box (provenance body-nvlink). The maker's mark
       is reserved where PB-09763 figure 5 puts it (provenance body-top-edge). -->
  <!-- the black band: backplate, board edge and cover -->
  <rect x="0.9" y="1.77" width="265.8" height="12.63" fill="#24262a"/>
  <rect x="0.9" y="4.44" width="265.8" height="1.57" fill="#1d2420"/>
  <!-- the shroud's top edge -->
  <rect x="0.9" y="14.4" width="265.8" height="25.6" fill="#4a4d52"/>
  <!-- the NVLink cap, the contract's nvlink box -->
  <rect x="15.1" y="2.2" width="60.0" height="4.7" rx="0.6" fill="#303237" stroke="#121315" stroke-width="0.25"/>
  <!-- the mark is reserved, not drawn (L172) -->
  <rect id="logo-zone" x="98.0" y="21.3" width="21.0" height="11.8" fill="none"/>
</svg>
