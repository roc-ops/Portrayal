format: 1
kind: module
name: p40
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA Tesla P40 GPU Accelerator (24 GB GDDR5), a passive dual-slot
  full-height full-length card. It is on NVIDIA's Form Factor 3.0 board, the
  outline of the Tesla V100 PCIe and P100 PCIe. The bracket face is a plate with
  a truss of vent openings and no ports. The far end is open. It has one CPU
  8-pin power connector at the east edge and no NVLink connector. It plugs into
  one riser slot and covers the one beside it.
slot-width: 2
size: {w: 120.02, h: 41.91, d: 266.70}
size-confidence: {w: registry, h: registry, d: drawing}
unplaced: >-
  no bay in the library lists this card in `accepts`. The one riser that spans,
  dell/riser-1a-14g@2's `slot-1`, is the Dell R740xd's, and that server's
  manual (table 27) names "Nvidia A16, A30, A40, A100, A800" for double-width
  GPUs and not the P40. A server whose documents list this card, and a riser
  bay that spans for it, would seat it.
attrs:
  model: 'Tesla P40'
  part-numbers: 'NVPN 699-2G610-0200-100 (PG610 SKU 200)'
  gpu-sku: 'GP102-895-A1'
  role: gpu
  form-factor: 'Dual-slot, 10.5 in, NVIDIA Form Factor 3.0, full-height bracket'
  pcie-connector: x16
  pcie-generation: 3
  pcie-height: full
  power-draw-max-w: 250
  power-input: 'host PCIe slot and one CPU 8-pin auxiliary connector'
  memory: '24 GB GDDR5, 384-bit, up to 347 GB/s'
  cooling: passive
  airflow: 'bidirectional; the heat sink takes system airflow either way along the card'
  nvlink: 'none'
  weight-kg: 0.968
  eol: none-announced
faces:
  rear: {ref: nvidia/v100-pcie-tail@1}
  plan:
    ref: common/pcie-card-plan@1
provenance:
  slot-width: >-
    datasheet - PB-08338 overview and table 1: "a dual-slot 10.5 inch PCI Express
    Gen3 graphics card", "NVIDIA Form Factor 3.0 compliant 4.376 inches x 10.5
    inches, dual-slot". The card declares `slot-width: 2` as
    docs/pcie-two-slot-bays-design.md R1 defines it, and its face is one plate 36
    across (`face-outline`).
  sources: >-
    NVIDIA Tesla P40 GPU Accelerator Product Brief PB-08338-001_v01, NVIDIA's own
    copy (https://images.nvidia.com/content/pdf/tesla/Tesla-P40-Product-Brief.pdf).
    Tables 1 and 2, figure 1 (the board, a line drawing seen from the bracket
    end), figures 2 and 3 (the two airflow directions), figure 4 (board
    dimensions), figure 5 (the CPU 8-pin connector, an end view) and the power
    and form-factor text. NVIDIA's P40 datasheet carries no card dimension.
    NVIDIA's brief forbids reproducing its figures, so its facts are transcribed
    and none of its figures is copied.
  reference-photos: >-
    NONE. No photograph of this card was found at NVIDIA or PNY (NVIDIA's P40
    page returns 404 and PNY has no page). The only pictures are figures 1 to 5 of the brief, line drawings. The
    bracket face is drawn from figure 1 (in perspective) and figure 4 (the broad
    side, orthographic), and every colour is a choice (see `body-colour`).
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2,
    PCIe CEM 5.0 figure 11-5). h is two slots: the single bracket's 21.59 plus
    one 20.32 slot pitch, 41.91, as on the A100 and the L40.
  depth: >-
    drawing - PB-08338 figure 4: "266.7 (PCA LENGTH)", from the bracket's plate
    (the figure labels it "chassis to bracket mating interface [A]") to the
    card's end, and 111.15 high with 104.88 to the flange's end. Measured on the
    1284 px page the bracket line is at x 181.5 and the end at 1279, 4.115 px/mm
    on the length, and the 111.15 runs from y 80 to y 538, 4.12 px/mm: the figure
    is orthographic to 0.1 percent. IT IS NOT STATED WHETHER 266.7 IS TAKEN FROM
    THE BRACKET'S OUTER FACE: the V100's and P100's figures say "with I/O bracket"
    and print the same 266.70, and the figure's bracket is the same line, so the
    outer face is taken. A 0.9 error (the A100 80GB's difference between its two
    lengths) would be possible.
  face-outline: >-
    borrowed - nvidia/a100-pcie-80gb@1 `face-outline`: the dual-slot bracket's
    plate, its two retention tabs, its V notch and the flange, drawn with the
    same path (the envelope of `std/pcie-bracket-fh-2slot@1`, 36 across). PB-08338
    figure 1 draws the same two feet at the tip and the same keyed flange.
    Not measured on this card.
  face-window: >-
    estimated - figure 1 shows the plate as a frame round one window filled with
    a truss and printed text near the tip (the SKU number, turned); the screws
    are in the middle of the plate. A perspective drawing of an edge cannot
    measure the window. It is drawn as nvidia/v100-pcie@1 draws its own: a window
    x 22.0 to 108.0 and y 7.5 to 36.5, a truss of two bands of struts 1.3 wide at
    45 degrees on a 14.5 pitch, and one screw of 1.5 radius at x 21.0, y 22.0. All
    of it is estimated, and the heat sink is not drawn behind it.
  face-markings: >-
    estimated - the printed text near the tip is not drawn: its characters
    cannot be read from the line drawing.
  thickness: >-
    estimated - PB-08338 states no thickness. The shroud's far face is put at y
    40.0, the A100 80GB's (nvidia/a100-pcie-80gb@1 `thickness`, 38.2 from its
    backplate), so the body stands 35.56 above the board's outer face. THIS CARD
    DRAWS NO BACKPLATE, because no picture shows one.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the A100 are. The board, and
    the bracket's keyed side, are at the top (small y); the cooler is below the
    board in this frame.
  body: >-
    the board, its edge and the pads follow PCIe CEM 5.0 (figures 6-5 and 11-3,
    as nvidia/mcx755106-fh@1 has them) at the lengths of the V100 PCIe's figure:
    PB-08338 says the board "conforms to the NVIDIA Form Factor 3.0
    specification", as the V100's and P100's briefs say of theirs, and its figure
    4 draws the same outline (the card 111.15 high, the finger tab ending near
    130.9 behind the bracket on a crop of the figure, 129.3 in CEM's x16, the
    same small hook after it). The V100's numbers are used: the board's lower
    edge 13.25 above W, the key datum 57.15, the tab end 129.3. THE P40'S OWN
    KEY SLOT WAS READ NEARER, about 53.8 behind the bracket, and was not
    reconciled (see `gaps`). The board's outline has no 3.55 notch. The shroud
    and the cover follow the board's outline.
  body-colour: >-
    estimated - figures 1 and 4 are line drawings, so NO COLOUR IS HELD. The
    shroud is drawn a dark grey and the cover black to mark an unknown, not a
    finding. The drawings show a cover with a raised rim, "TESLA" up the bracket
    end and the NVIDIA mark and wordmark on the top edge.
  body-top-edge: >-
    estimated - figure 1 shows the NVIDIA mark and wordmark on the top edge at
    about the card's middle. The mark is reserved as `logo-zone` and the wordmark
    is drawn at a place read as a fraction of the length (about 0.40) and a size
    of the L40's. Not measured.
  body-power-connector: >-
    estimated - PB-08338: "a CPU 8-pin power connector on the East edge of the
    board", and figure 5 draws it in an end view, circled, beside the board.
    THE FIGURE PUTS IT NEARER THE MIDDLE OF THE BOARD'S HEIGHT THAN THE A100'S
    PHOTOGRAPH DOES (by eye), and its scale is not known, so it was not measured
    (see `gaps`). The housing is drawn at the A100 80GB's place by the top edge,
    kept as a placeholder (x 105.6 to 124.0, as
    nvidia/a100-pcie-80gb@1 `body-power-connector`, photo-measured there on its
    own card, borrowed here), 18.4 along and 10.85 across, with eight cells in two
    rows of four on the 4.2 pitch. Its depth and colour are not seen here. THE
    PORT is `aux-power` on the rear face (`faces.rear`, nvidia/v100-pcie-tail@1,
    shared): std/eps12v-header@1, which presents `eps12v-8pin` for a CPU 8-pin
    cable and which the card exports as a power port. PB-08338 table 5 lists one
    CPU 8-pin cable, or the dongle of its figure 6 to two PCIe 8-pin cables.
  body-far-end: >-
    estimated - as nvidia/v100-pcie@1 `body-far-end`: the far end is open, drawn
    as a dark opening inside a rim 2.1 thick. THE FINS ARE NOT DRAWN: figure 5's
    end view is not dimensioned and no photograph exists.
  extenders: >-
    datasheet - PB-08338 table 1 lists a long offset extender (52 g) and a
    straight extender (42 g) and gives no part number, length or figure, so the
    card has no `extender` field and none is drawn.
  power: >-
    datasheet - PB-08338 tables 1 and 5: total board power 250 W; the overview
    calls it a "250 W maximum power limit". Filed as the maximum.
  weight: >-
    datasheet - PB-08338 table 1: board 968 g, excluding the bracket and
    extenders; the bracket with screws is 20 g.
  memory: >-
    datasheet - PB-08338 table 2: 24 GB GDDR5, 384-bit (24 pieces of 512M x 16),
    up to 347 GB/s.
  pcie: >-
    datasheet - PB-08338 table 1: PCI Express 3.0 x16, lane and polarity reversal
    supported.
  part-numbers: >-
    datasheet - PB-08338 table 1: PG610 SKU 200, NVPN 699-2G610-0200-100. No
    order code or reseller part number is written in a document held.
  nvlink: >-
    datasheet - PB-08338 does not mention NVLink and figures 1 and 4 draw no
    bridge connector on the top edge.
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) the bracket face straight on (needs-photo:
    the truss and the printing are estimated from a line drawing); (2) every
    colour (needs-photo); (3) the far end, its fins and bosses (needs-photo,
    needs-drawing); (4) the extenders (needs-drawing); (5) the key slot's place,
    53.8 read on the P40's figure 4 against CEM's 57.15 used (sources-disagree,
    both read from a drawing); (6) the board's hook after the tab (needs-drawing);
    (7) whether 266.7 starts at the bracket's outer face (needs-drawing); (8) the
    thickness, which no source states (vendor-silent); (9) the power connector's
    depth, colour and place along the board's height (needs-photo,
    needs-drawing: figure 5 puts it lower than the A100's place, which is drawn).
  lifecycle: >-
    No end-of-life notice for the P40 was found. NVIDIA's own P40 page returns a
    404 and PNY has no page, which is retirement shown as a missing page, not an
    announcement; the attr says `none-announced` because nothing was announced.
