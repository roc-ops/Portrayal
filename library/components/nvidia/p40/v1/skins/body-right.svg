<svg xmlns="http://www.w3.org/2000/svg" width="265.8mm" height="35.56mm" viewBox="0.9 4.44 265.8 35.56">
  <!-- nvidia/p40: THE TOP EDGE, the body's right side seen from outside.
       Across: mm behind the bracket's outer face (0.9 to 266.7, the shroud's
       length). Down: the face's y (4.44 the board's outer face, 40.0 the
       shroud's). Every piece whose right side is the card's top edge `shows:
       [right]` and carries its patch of this. The NVIDIA mark and wordmark are
       at about 0.40 of the length (PB-08338 figure 1), estimated. -->
  <rect x="0.9" y="4.44" width="265.8" height="1.57" fill="#1d2420"/>
  <rect x="0.9" y="6.01" width="265.8" height="8.39" fill="#17191c"/>
  <rect x="0.9" y="14.4" width="265.8" height="25.6" fill="#3a3d42"/>
  <!-- the NVIDIA mark is reserved, not drawn (L172) -->
  <rect id="logo-zone" x="104.0" y="6.6" width="7.0" height="4.6" fill="none"/>
  <g id="silkscreen">
    <text x="112.5" y="10.4" font-family="Arial" font-weight="bold" font-size="4.45" fill="#d9d9d9" textLength="20.9" lengthAdjust="spacingAndGlyphs">NVIDIA</text>
  </g>
</svg>
