<svg xmlns="http://www.w3.org/2000/svg" width="97.9mm" height="265.8mm" viewBox="-6.29 0 97.9 265.8">
  <!-- nvidia/rtx-a6000: THE SHROUD'S BROAD SIDE, the body's bottom side seen
       from outside. Across: 120.02 (the face's width) less the face's x, so the
       card's top edge is at -6.29 and its lower edge at 91.61. Down: 266.7 less
       mm behind the bracket's outer face, so the far end is at the top and the
       bracket's end at the bottom. Glossy black with the blower's opening: a
       ring 73.8 across centred 50.4 from the far end and 47.9 below the top
       edge (PNY's broad-side photograph at 2.44 px/mm, provenance
       body-fan), with a hub and 24 blades. Drawn in-house; nothing is traced. -->
  <defs>
    <linearGradient id="gloss" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0e10"/>
      <stop offset="0.5" stop-color="#202226"/>
      <stop offset="1" stop-color="#2b2d32"/>
    </linearGradient>
    <path id="blade" d="M41.6 30.4 L42.3 16.2 L43.5 16.3 L42.6 30.5 Z"/>
  </defs>
  <rect x="-6.29" y="0" width="97.9" height="265.8" fill="url(#gloss)"/>
  <circle id="fan-ring" cx="41.6" cy="50.4" r="36.9" fill="#0b0c0e" stroke="#b79b6c" stroke-width="0.9"/>
  <g id="blades" fill="#3b3e44" transform="translate(0 0)">
    <use href="#blade" transform="rotate(0 41.6 50.4)"/>
    <use href="#blade" transform="rotate(15 41.6 50.4)"/>
    <use href="#blade" transform="rotate(30 41.6 50.4)"/>
    <use href="#blade" transform="rotate(45 41.6 50.4)"/>
    <use href="#blade" transform="rotate(60 41.6 50.4)"/>
    <use href="#blade" transform="rotate(75 41.6 50.4)"/>
    <use href="#blade" transform="rotate(90 41.6 50.4)"/>
    <use href="#blade" transform="rotate(105 41.6 50.4)"/>
    <use href="#blade" transform="rotate(120 41.6 50.4)"/>
    <use href="#blade" transform="rotate(135 41.6 50.4)"/>
    <use href="#blade" transform="rotate(150 41.6 50.4)"/>
    <use href="#blade" transform="rotate(165 41.6 50.4)"/>
    <use href="#blade" transform="rotate(180 41.6 50.4)"/>
    <use href="#blade" transform="rotate(195 41.6 50.4)"/>
    <use href="#blade" transform="rotate(210 41.6 50.4)"/>
    <use href="#blade" transform="rotate(225 41.6 50.4)"/>
    <use href="#blade" transform="rotate(240 41.6 50.4)"/>
    <use href="#blade" transform="rotate(255 41.6 50.4)"/>
    <use href="#blade" transform="rotate(270 41.6 50.4)"/>
    <use href="#blade" transform="rotate(285 41.6 50.4)"/>
    <use href="#blade" transform="rotate(300 41.6 50.4)"/>
    <use href="#blade" transform="rotate(315 41.6 50.4)"/>
    <use href="#blade" transform="rotate(330 41.6 50.4)"/>
    <use href="#blade" transform="rotate(345 41.6 50.4)"/>
  </g>
  <circle id="fan-hub" cx="41.6" cy="50.4" r="19.3" fill="#2a2c30" stroke="#1a1b1e" stroke-width="0.6"/>
  <circle cx="41.6" cy="50.4" r="15.0" fill="none" stroke="#3c3f44" stroke-width="0.4"/>
  <circle cx="41.6" cy="50.4" r="10.0" fill="none" stroke="#3c3f44" stroke-width="0.4"/>
</svg>
