<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="41.91mm" viewBox="0 0 120.02 41.91">
  <!-- nvidia/rtx-a6000: the RTX A6000 dual-slot bracket, seen from OUTSIDE the
       chassis, drawn from the facts in the contract's provenance (a straight-on
       photograph of the bracket, scaled with the two retention tabs as the
       ruler). TIP AT THE LEFT, flange end at the right, the board's side at the
       top, as std/pcie-bracket-fh@2 is drawn: the photograph is turned a half
       turn into this frame. A black plate with four DisplayPort receptacles
       along the board's side and one vent window below them with the heat-sink
       fins behind it. Nothing is traced. -->
  <path id="plate" d="M1.9 7.4 L7.27 7.4 L9.57 5.1 L20.0 5.1 L21.0 4.1 L119.2 4.1 L119.2 0.3 L120.02 0.3 L120.02 40.9 L119.2 40.9 L119.2 41.2 L10.8 41.2 L7.27 37.68 L1.9 37.68 A1.9 1.9 0 0 1 0 35.78 L0 29.63 A1.9 1.9 0 0 1 1.9 27.73 L7.27 27.73 L10.95 24.22 A2.4 2.4 0 0 0 10.95 20.88 L7.27 17.35 L1.9 17.35 A1.9 1.9 0 0 1 0 15.45 L0 9.3 A1.9 1.9 0 0 1 1.9 7.4 Z" fill="#2b2d30" stroke="#0e0f10" stroke-width="0.4" stroke-linejoin="round"/>
  <!-- the fold: the flange turns 90 degrees here. On an elevation it is a line. -->
  <path id="flange-fold" d="M119.6 0.6 V40.6" stroke="#0e0f10" stroke-width="0.3" fill="none"/>
  <!-- the four DisplayPort receptacles: a 17.6 x 7.1 shell with the D shape's
       chamfer at the flange end, a dark opening and two rows of pins. Each is
       drawn once at its own place; the library has no DisplayPort part. -->
  <g id="display-port-1">
    <path d="M32.4 6.1 L48.4 6.1 A0.8 0.8 0 0 1 49.2 6.9 L49.2 10.0 L46.0 13.2 L32.4 13.2 A0.8 0.8 0 0 1 31.6 12.4 L31.6 6.9 A0.8 0.8 0 0 1 32.4 6.1 Z" fill="#c9cbcc" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M32.5 7.1 L48.3 7.1 L48.3 9.7 L45.8 12.2 L32.5 12.2 Z" fill="#18191b"/>
    <path d="M34.0 8.5 H46.7 M34.0 10.4 H44.7" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-2">
    <path d="M53.8 6.1 L69.8 6.1 A0.8 0.8 0 0 1 70.6 6.9 L70.6 10.0 L67.4 13.2 L53.8 13.2 A0.8 0.8 0 0 1 53.0 12.4 L53.0 6.9 A0.8 0.8 0 0 1 53.8 6.1 Z" fill="#c9cbcc" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M53.9 7.1 L69.7 7.1 L69.7 9.7 L67.2 12.2 L53.9 12.2 Z" fill="#18191b"/>
    <path d="M55.4 8.5 H68.1 M55.4 10.4 H66.1" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-3">
    <path d="M75.2 6.1 L91.2 6.1 A0.8 0.8 0 0 1 92.0 6.9 L92.0 10.0 L88.8 13.2 L75.2 13.2 A0.8 0.8 0 0 1 74.4 12.4 L74.4 6.9 A0.8 0.8 0 0 1 75.2 6.1 Z" fill="#c9cbcc" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M75.3 7.1 L91.1 7.1 L91.1 9.7 L88.6 12.2 L75.3 12.2 Z" fill="#18191b"/>
    <path d="M76.8 8.5 H89.5 M76.8 10.4 H87.5" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-4">
    <path d="M96.6 6.1 L112.6 6.1 A0.8 0.8 0 0 1 113.4 6.9 L113.4 10.0 L110.2 13.2 L96.6 13.2 A0.8 0.8 0 0 1 95.8 12.4 L95.8 6.9 A0.8 0.8 0 0 1 96.6 6.1 Z" fill="#c9cbcc" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M96.7 7.1 L112.5 7.1 L112.5 9.7 L110.0 12.2 L96.7 12.2 Z" fill="#18191b"/>
    <path d="M98.2 8.5 H110.9 M98.2 10.4 H108.9" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <!-- the vent window below them, with the heat-sink fins behind it: 17 fins on
