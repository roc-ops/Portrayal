    <rect x="64.56" y="15.8" width="0.6" height="22.5"/>
    <rect x="69.02" y="15.8" width="0.6" height="22.5"/>
    <rect x="73.48" y="15.8" width="0.6" height="22.5"/>
    <rect x="77.94" y="15.8" width="0.6" height="22.5"/>
    <rect x="82.4" y="15.8" width="0.6" height="22.5"/>
    <rect x="86.86" y="15.8" width="0.6" height="22.5"/>
    <rect x="91.32" y="15.8" width="0.6" height="22.5"/>
    <rect x="95.78" y="15.8" width="0.6" height="22.5"/>
    <rect x="100.24" y="15.8" width="0.6" height="22.5"/>
    <rect x="104.7" y="15.8" width="0.6" height="22.5"/>
    <rect x="109.16" y="15.8" width="0.6" height="22.5"/>
  </g>
  <!-- four Torx screws, one beyond each end of the window at its two sides -->
  <g id="screw-1"><circle cx="32.4" cy="17.9" r="2.4" fill="#5a5e63" stroke="#0e0f10" stroke-width="0.3"/><circle cx="32.4" cy="17.9" r="0.9" fill="#1d1f21"/></g>
  <g id="screw-2"><circle cx="114.7" cy="17.9" r="2.4" fill="#5a5e63" stroke="#0e0f10" stroke-width="0.3"/><circle cx="114.7" cy="17.9" r="0.9" fill="#1d1f21"/></g>
  <g id="screw-3"><circle cx="32.4" cy="36.0" r="2.4" fill="#5a5e63" stroke="#0e0f10" stroke-width="0.3"/><circle cx="32.4" cy="36.0" r="0.9" fill="#1d1f21"/></g>
  <g id="screw-4"><circle cx="114.7" cy="36.0" r="2.4" fill="#5a5e63" stroke="#0e0f10" stroke-width="0.3"/><circle cx="114.7" cy="36.0" r="0.9" fill="#1d1f21"/></g>
</svg>
