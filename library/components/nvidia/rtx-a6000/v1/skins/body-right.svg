<svg xmlns="http://www.w3.org/2000/svg" width="265.8mm" height="35.56mm" viewBox="0.9 4.44 265.8 35.56">
  <!-- nvidia/rtx-a6000: THE TOP EDGE, the body's right side seen from outside.
       Across: mm behind the bracket's outer face (0.9 to 266.7, the shroud's
       length). Down: the face's y (4.44 the board's outer face, 40.0 the
       shroud's). Every piece whose right side is the card's top edge `shows:
       [right]` and carries its patch of this. The champagne strip is the heat
       sink's fins showing on the edge; its place is read off a 3/4 view and is
       estimated (provenance body-top-edge). The maker's mark is reserved, not
       drawn. -->
  <defs>
    <pattern id="fins" patternUnits="userSpaceOnUse" x="0.9" y="14" width="1.2" height="18">
      <rect x="0" y="0" width="1.2" height="18" fill="#cdb78d"/>
      <rect x="0.8" y="0" width="0.4" height="18" fill="#8d7a56"/>
    </pattern>
  </defs>
  <!-- the board's edge and the black shroud -->
  <rect x="0.9" y="4.44" width="265.8" height="1.57" fill="#1d2420"/>
  <rect x="0.9" y="6.01" width="265.8" height="33.99" fill="#15161a"/>
  <!-- the fin strip -->
  <rect x="20.0" y="14.0" width="205.0" height="18.0" fill="url(#fins)"/>
  <!-- the mark is reserved, not drawn (L172) -->
  <rect id="logo-zone" x="228.0" y="20.0" width="9.0" height="5.9" fill="none"/>
  <g id="silkscreen">
    <text x="3.0" y="11.5" font-family="Arial" font-weight="bold" font-size="2.4" fill="#bdb8aa">RTX A6000</text>
  </g>
</svg>
