format: 1
kind: module
name: h100-nvl
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA H100 NVL GPU (94 GB HBM3), a passive dual-slot full-height full-length
  card. The bracket face carries one vent window and no ports. Three NVLink
  bridge connectors sit on the top edge under removable caps. The far end is
  open and shows the heat sink's fins edge-on. It has one 16-pin 12V-2x6 power
  connector by the top edge and two bosses for an extender. NVIDIA's straight
  or long offset extender can be fitted to the far end; the `extender` field
  chooses it. It plugs into one riser slot and covers the one beside it.
slot-width: 2
size: {w: 120.02, h: 41.91, d: 268.60}
size-confidence: {w: registry, h: registry, d: drawing}
unplaced: >-
  no bay in the library lists this card in `accepts`. The one riser that spans,
  dell/riser-1a-14g@2's `slot-1`, is the Dell R740xd's, and that server's
  documents cap a double-width GPU at 300 W (spec sheet, "Accelerator options")
  against this card's 400 W. The other Dell risers with a double-width slot
  model it as one bay with no `span`, or only as a half-length riser, so none
  takes a card two slots wide. A server whose documents list this card, and a
  riser bay that spans for it, would seat it.
attrs:
  model: 'H100 NVL'
  part-numbers: 'PNY NVH100NVLTCGPU-KIT'
  board-sku: 'P1010 SKU 210, NVPN 699-21010-0210-xxx'
  role: gpu
  form-factor: 'Full-height, full-length (FHFL) 10.5 in, dual-slot'
  pcie-connector: x16
  pcie-generation: 5
  pcie-height: full
  power-draw-max-w: 400
  power-input: 'host PCIe slot and one PCIe 16-pin (12V-2x6) auxiliary connector'
  memory: '94 GB HBM3, 6016-bit, 3,938 GB/s'
  cooling: passive
  airflow: 'bidirectional; the heat sink takes system airflow either way along the card'
  nvlink: 'three bridge connectors on the top edge; 600 GB/s with one adjacent H100 NVL'
  weight-kg: 1.214
  eol: none-announced
fields:
  extender:
    label: Extender
    type: choice
    options: [none, straight, long-offset]
    default: none
    drawn-by-absence: [none]
    description: >-
      The bracket at the card's far end that a server's card guide holds. The
      straight one (NVPN 682-00007-5555-001) makes the card 312 mm long. The
      long offset one (NVPN 682-00007-5555-000) makes it 339 mm. The enhanced
      straight extender (NVPN 151-0398-000, also 312 mm) is not drawn.
faces:
  rear: {ref: nvidia/h100-nvl-tail@1}
  plan: {ref: nvidia/h100-nvl-top@1}
provenance:
  slot-width: >-
    datasheet - PB-11773 table 1: form factor "Full-height, full-length (FHFL)
    10.5', dual-slot". The face is the same one plate 36 across as the A100's
    (`face-outline`). The card declares `slot-width: 2` as
    docs/pcie-two-slot-bays-design.md R1 defines it.
  sources: >-
    NVIDIA H100 NVL Product Brief PB-11773-001_v01,
    https://www.nvidia.com/content/dam/en-zz/Solutions/Data-Center/h100/PB-11773-001_v01.pdf.
    Tables 1, 2, 6 to 8, figure 4 (the top edge with the three caps, an
    orthographic line drawing), figure 5 (card dimensions), figure 6 (the 16-pin
    connector, an end view) and the NVLink, power and extender text. PNY's one
    page datasheet,
    https://www.pny.com/File%20Library/Company/Support/Product%20Brochures/NVIDIA%20Data%20Center%20GPUs/english/H100-NVL-Datasheet.pdf,
    for the PNY part number, and NVIDIA's H100 datasheet,
    https://dam-cdn.nvd.orangelogic.com/AssetLink/u5hh6fv4r7564i4y673484y3m20083nj.pdf,
    which covers the NVL. This card is built from the pilot
    nvidia/a100-pcie-80gb@1 wherever the two cards share a part, and the
    provenance says where they differ. NVIDIA's brief forbids reproducing its
    figures, so its facts are transcribed and none of its figures is copied.
  reference-photos: >-
    reference - PNY's product render
    https://d2vfia6k6wrouk.cloudfront.net/productimages/ab2f11c5-8853-4088-88c5-b1380098c279/images/h100-nvl-3qtr-right-reverse.png,
    800 x 800, a 3/4 view of the broad side and the bracket end. The same bytes are
    served on PNY's H200 NVL page, so it may show either card and is
    used only for what the two cards have in common: the vent window in the
    bracket, the ribbed top edge and the notch in the lower edge. It is the only
    photograph held. Licence not stated; facts read from it, picture not used.
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2,
    PCIe CEM 5.0 figure 11-5). h is two slots: the single bracket's 21.59 plus
    one 20.32 slot pitch, 41.91, as on the A100.
  depth: >-
    drawing - PB-11773 figure 5: 266.70 +/-0.30 from the inside of the PCB
    outline, 0.90 from the cover edge to that outline and 1.00 from the outside
    of the I/O bracket to the cover edge. 1.00 + 0.90 + 266.70 = 268.60, which
    is the A100 80GB's length with the bracket.
  face-outline: >-
    borrowed - nvidia/a100-pcie-80gb@1 `face-outline`, `face-keyed-flange`,
    `face-grille` and `face-markings`: the bracket's outline, its two retention
    tabs, its V notch, the raised grille frame, the vent window, the four Torx
    screws and the sixteen fins behind it, measured there from a straight-on
    photograph of an A100 80GB. THIS CARD'S OWN BRACKET WAS NOT PHOTOGRAPHED.
    Figure 6 shows the same two-tab plate with the V notch at its foot.
  thickness: >-
    estimated - 38.2 as on the A100 (see its `thickness`). PB-11773 figure 4 is
    an orthographic drawing of the top edge, so it measures the thickness
    directly: the card's edge from its first line to its last is 154 rows at
    3.976 px/mm, 38.7, where the lines are 2 px wide. The A100 pilot measured 38.7
    off two other pictures too. This card keeps 38.2 so that the five cards of
    the batch share one envelope; the 0.5 is the width of the drawn lines.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the A100 are. The board, and
    the bracket's keyed side, are at the top (small y).
  body: >-
    the board, its edge and the pads follow PCIe CEM 5.0 (figures 6-5 and 11-3,
    as nvidia/mcx755106-fh@1 has them) at PB-11773 figure 5's lengths: the board
    97.90 +/-0.20 high, its lower edge 13.25 +/-0.20 above the finger datum W,
    the key datum 59.05, the long run of the tab 81.90 past it, and a notch 3.57
    deep and 19.48 long whose near end is 59.05 + 81.90 = 140.95 behind the
    bracket (the A100's are 3.55, 19.50 and 140.93 REF). THE COVER, SHROUD AND
    BACKPLATE START 1.00 behind the bracket's outer face and THE BOARD 1.90 behind
    it, as the figure dimensions them; the A100 pilot started all of them at
    0.90. The shroud, cover and backplate follow the board's outline
    (`body-shroud`, estimated).
  body-shroud: >-
    borrowed - nvidia/a100-pcie-80gb@1 `body-shroud`: a champagne shroud with a
    black cover on the board's side and a black backplate, split at the notch.
    PNY's render of this card shows a champagne broad side and a black band
    along the top edge. On figure 4 the black band is 13.1 across, which agrees
    with the cover and backplate together (12.63).
  body-nvlink: >-
    drawing - three NVLink bridge connectors on the top edge, each under a
    removable cap (PB-11773: "NVLink bridge interfaces of the H100 NVL card
    include removable caps"). Figure 4, an orthographic line drawing, puts the
    caps 49.1 long, starting 12.83, 69.30 and 125.60 behind the bracket's outer
    face, 6.5 wide (see nvidia/h100-nvl-top@1). The caps' 0.5 stand-off is
    estimated. THE BOXES BELOW (`nvlink-1` to `nvlink-3`) ARE THE CAPS, drawn at
    the connector's 49.5 and centred on the measured caps (12.55, 69.10 and
    125.45); the connectors under them are nvidia/a100-pcie-80gb-top's:
    nvidia/nvlink-a100-connector@1, composed by `faces.plan`, because PB-11773
    says the bridge is "the same ... used in the NVIDIA Ampere architecture
    generation, including the NVIDIA A100 PCIe card" (900-53651-0000-000).
  body-power-connector: >-
    estimated - PB-11773: "a PCIe 16-pin power connector on the east edge of the
    board", "One PCIe 16-pin auxiliary power connector (12v-2x6 auxiliary power
    connector)". Its place and size are read on figure 6, an end view, and on
    PNY's straight-on photograph of the L40S's east end (the same card form):
    the housing is 19.0 along the card and 9.2 across its thickness, from the
    card's x 104.2 to 123.2, 3.3 from the top edge, black, with 12 power
    contacts in two rows of six and four sense contacts in a strip on the
    backplate side. Figure 6 itself reads 9.0 by 18.3, 3.8 from the top edge,
    inside the 1 mm that page allows. The housing's depth, 5.8, and its colour
    are not seen. THE PORT is `aux-power` on the rear face (`faces.rear`,
    nvidia/h100-nvl-tail@1): std/12v-2x6-header@1, which presents
    `pcie-12v-2x6` for a 16-pin cable and which the card exports as a power port.
  body-end: >-
    estimated - as nvidia/a100-pcie-80gb@1 `body-end`: the black end plate
    (backplate, board and cover) stops 0.4 short of the shroud's lip and the
    housing and mount bosses stand 0.2 proud of it.
  body-tail-fins: >-
    estimated - the shroud is open at its far end and PB-11773 figure 6 shows the
    fin stack edge-on behind it (see nvidia/h100-nvl-tail@1 `fins`). The 18 fins
    at a 5.0 pitch are the A100's and are not counted on this card.
  body-extender-mount: >-
    estimated - the two bosses the extenders' thumbscrews fasten to, at the
    card's x 35.3 and 64.1 and y 8.4, 4.0 across and 0.4 proud: the A100's
    (`body-extender-mount`). Figure 6 shows two round bosses and a slot on the end
    plate. PB-11773 says OEMs "may design a custom attach method using the
    extender-mounting holes on the east edge".
  power: >-
    datasheet - PB-11773 table 1: total board power 400 W maximum (default) on
    a 16-pin cable strapped for 450 W or 600 W, 310 W power compliance limit,
    200 W minimum; 310 W maximum (default) on a cable strapped for 300 W. Table 7
    gives the sense logic. attrs carry the 400 W.
  weight: >-
    datasheet - PB-11773 table 1: board 1,214 g excluding the bracket,
    extenders and bridges. The bracket with screws is 20 g, each NVLink bridge
    20.5 g, the enhanced straight extender 35 g, the long offset extender 48 g
    and the straight extender 32 g.
  memory: >-
    datasheet - PB-11773 table 2: HBM3, 94 GB, 6,016-bit, 2,619 MHz, 3,938 GB/s.
  pcie: >-
    datasheet - PB-11773 table 1: PCI Express Gen5 x16, Gen5 x8 and Gen4 x16,
    lane and polarity reversal supported.
  part-numbers: >-
    datasheet - PNY's one page datasheet gives its part number
    NVH100NVLTCGPU-KIT; the brief's table 1 gives the board SKU P1010 SKU 210,
    NVPN 699-21010-0210-xxx. NO NVIDIA ORDER CODE (900-...) IS GIVEN in the
    brief, the PNY datasheet or the line cards held, and none is written. The
    PNY line card prints 900-21010-0040-000 for the H200 NVL and none for this
    card.
  nvlink: >-
    datasheet - PB-11773 table 6: three bridges, 48 lanes at 100 Gbps a lane
    each way, 600 GB/s. The bridge is the 2-slot bridge 900-53651-0000-000, the
    A100's. The brief says "two NVIDIA H100 PCIe cards" in the overview
    where it means the NVL; the table is used.
  extenders: >-
    datasheet - PB-11773 "Extenders": a long offset extender (NVPN
    682-00007-5555-000, card plus extender 339 mm, 48 g), a straight extender
    (NVPN 682-00007-5555-001, 312 mm, 32 g) and an enhanced straight extender
    (NVPN 151-0398-000, 312 mm, 35 g, figure 10). The long offset and straight
    ones are the A100 80GB's by number, and their pieces below are that card's,
    which was photographed with the straight one fitted. THE ENHANCED STRAIGHT
    ONE IS NOT DRAWN: figure 10 has no dimension that was read.
  body-extender-straight: >-
    borrowed - nvidia/a100-pcie-80gb@1 `body-extender-straight`: a slotted plate
    of four bars with three slots, an upright 1.2 thick and 15 wide that ends at
    x 103.41, clear of the 16-pin housing (x 104.2; the clearance is thin and
    estimated). Its far edge is the brief's 312.
  body-extender-long-offset: >-
    borrowed - nvidia/a100-pcie-80gb@1 `body-extender-long-offset`. Its far edge
    is the brief's 339; no photograph of it was found.
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) the bracket face straight on, for this card
    (needs-photo; the A100's is carried over); (2) a side elevation of this card
    (needs-photo; the shroud's bands are the A100's); (3) the thickness, which
    no source states (vendor-silent; the drawing reads 38.7); (4) the NVIDIA
    order code (vendor-silent in the documents held); (5) the enhanced straight
    extender (needs-drawing); (6) the 16-pin housing's depth and colour
    (needs-photo); (7) a photograph that is the NVL and not the H200 NVL.
  lifecycle: >-
    No end-of-life notice for the H100 NVL was found. NVIDIA publishes no GPU
    end-of-life list. The attr says `none-announced`, which here means none was
    found.
