<svg xmlns="http://www.w3.org/2000/svg" width="267.6mm" height="38.23mm" viewBox="1.0 1.77 267.6 38.23">
  <!-- nvidia/h100-nvl: THE TOP EDGE, the body's right side seen from outside.
       Across: mm behind the bracket's outer face (1.0 to 268.6, the shroud's
       length, which starts at the cover edge). Down: the face's y (1.77 the
       backplate's outer face, 40.0 the shroud's). Every piece whose right side
       is the card's top edge `shows: [right]` and carries its patch of this.
       The ribs are the A100's (nvidia/a100-pcie-80gb@1 `body-ribs`, borrowed).
       The caps, their NVLINK legends and the NVIDIA mark are PB-11773
       figure 4's. -->
  <defs>
    <pattern id="ribs" patternUnits="userSpaceOnUse" x="1.0" y="14.4" width="2.194" height="25.6">
      <rect x="0" y="0" width="2.194" height="25.6" fill="#cdbca5"/>
      <rect x="0.25" y="0" width="0.55" height="25.6" fill="#e2d5c2"/>
      <rect x="1.80" y="0" width="0.394" height="25.6" fill="#8f7d67"/>
    </pattern>
  </defs>
  <!-- the black band: backplate, board edge and cover -->
  <rect x="1.0" y="1.77" width="267.6" height="12.63" fill="#24262a"/>
  <rect x="1.9" y="4.44" width="266.7" height="1.57" fill="#1d2420"/>
  <!-- the shroud's top edge -->
  <rect x="1.0" y="14.4" width="267.6" height="25.6" fill="url(#ribs)"/>
  <!-- the three NVLink caps, the contract's nvlink boxes -->
  <rect x="12.55" y="2.2" width="49.5" height="6.6" rx="0.6" fill="#303237" stroke="#121315" stroke-width="0.25"/>
  <rect x="69.1" y="2.2" width="49.5" height="6.6" rx="0.6" fill="#303237" stroke="#121315" stroke-width="0.25"/>
  <rect x="125.45" y="2.2" width="49.5" height="6.6" rx="0.6" fill="#303237" stroke="#121315" stroke-width="0.25"/>
  <!-- the NVIDIA mark is reserved, not drawn (L172) -->
  <rect id="logo-zone" x="230.5" y="5.35" width="9.0" height="5.9" fill="none"/>
  <g id="silkscreen">
    <text x="37.3" y="12.7" font-family="Arial" font-weight="bold" font-size="2.5" fill="#50535b" text-anchor="middle">NVLINK</text>
    <text x="93.85" y="12.7" font-family="Arial" font-weight="bold" font-size="2.5" fill="#50535b" text-anchor="middle">NVLINK</text>
    <text x="150.2" y="12.7" font-family="Arial" font-weight="bold" font-size="2.5" fill="#50535b" text-anchor="middle">NVLINK</text>
    <text x="240.7" y="10.4" font-family="Arial" font-weight="bold" font-size="4.45" fill="#ddd7c5" textLength="20.9" lengthAdjust="spacingAndGlyphs">NVIDIA</text>
  </g>
</svg>
