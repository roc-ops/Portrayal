format: 1
kind: module
name: mcx516a-fh
version: 1.0.0
class: expansion-card
behaviour: fills
profile: networking
description: >-
  NVIDIA ConnectX-5 MCX516A dual-port 40/50/100GbE QSFP28 adapter, PCIe x16,
  on its tall (full-height) bracket. The same board ships with both brackets;
  nvidia/mcx516a-lp@1 is the other.
size: {w: 120.02, h: 21.59, d: 142.24}
size-confidence: {w: registry, h: registry, d: drawing}
attrs:
  model: 'MCX516A tall bracket'
  part-numbers: 'MCX516A-GCAT, MCX516A-BDAT, MCX516A-CCAT, MCX516A-CCHT, MCX516A-CDAT, MCX556A-ECAT, MCX556A-ECUT, MCX556A-EDAT'
  role: nic
  power-draw-max-w: 23.4
  power-draw-typical-w: 19.3
  power-input: host PCIe slot
  pcie-connector: x16
  pcie-generation: 4
  pcie-height: full
  qsfp28: 2
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
provenance:
  sources: >-
    CX-5 EN user manual: p12 LED interface, p50-55 spec tables, p57 board
    drawing Dual-Port x16 Card (142.24 x 68.90), p58 Dual-port Tall Bracket.
    CX-5 VPI user manual p16 LED interface.
  size: >-
    registry - the face is std/pcie-bracket-fh@2, 120.02 x 21.59, composed
    behind a punched plate; `d` is the board drawing's 142.24, the card's
    length back from its bracket.
  depth: >-
    drawing - 142.24, the board mechanical drawing's length.
  the-face-is-derived-from-the-board: >-
    EVERY POSITION IS THE CARD'S, NOT THE BRACKET'S. The cages are placed at
    their distance above datum W on the dimensioned board drawing - port 1
    48.08, port 2 26.72 - with W at x' 15.16 on this bracket (PCIe CEM 5.0:
    120.02 - 104.86, fig 11-3). Vents, light-pipe slots, lamps and numerals
    keep their measured offset from their nearest cage (or from W), read off
    NVIDIA's bracket drawings. The tall bracket art on cx4lx p54 is also on
    cx5en p58, pixel for pixel. The manuals show it under every card, SFP28
    included, but it is QSFP28 art. Its windows are 20.7 x 10.8 (a QSFP28
    cage is 20.0 wide) and they land within 0.2 of the QSFP28 boards: the
    windows at d 48.18 / 26.71 against this board's 48.08 / 26.72. Against
    the SFP28 boards it is wrong, so it is used only for the QSFP28 layouts.
    The vent field, squares, LED windows and numerals keep their offsets
    from the nearest window. The across-bracket positions are anchored at
    the cage's y_lp 8.30. The art is scaled by its own 121.05; its windows
    read 20.7 against an 18.75 QSFP28 opening, but rescaling by the window
    would break the 0.1-0.2 cage and LED agreement with the boards, so the
    window is taken as drawn with clearance. There is no short-bracket
    drawing, so the low-profile face is the tall one moved through the CEM W
    offsets. Features that would fall off the short metal are drawn on the
    tall bracket only.
  orientation: >-
    drawn TIP-LEFT, so NVIDIA's tip-right figures are turned a half-turn:
    cages and lamps are placed `rotate: 180` and the numerals read upside
    down. In a turned bay - Dell riser 3 - the card lands as NVIDIA draws
    it.
  lamps: >-
    drawing - one bi-colour LED per port (cx5en p12, yellow/green), shown
    through the art's two ovals on the keyed side, 14.36 flange-ward of port
    1 and 14.52 tip-ward of port 2. The p57 x16 board draws the LEDs 14.40 /
    -14.87 from the cages. common/led-rect-sm@1 stands in for an oval about
    2.7 x 1.6. NVIDIA's top-view photograph of this card does not agree (see
    notes); the drawings are carried.
  body: >-
    the board, edge tab and pads are PCIe CEM 5.0's (figs 6-5, 11-3, 11-8)
    at the board drawing's size; the heatsink is the board drawing's U1
    outline at its drawn position (the manual says a heatsink is attached to
    the IC by push pins or screws but does not draw it); its 6.0 height is
    an estimate.
  power: >-
    datasheet - cx5en p50-51 and p54-55 spec tables, typical at ATIS load
    and maximum with passive cables: MCX516A-CDAT (Ex) 19.3 W typical, 23.4
    W maximum (26.8 / 29.0 W with 1.5 / 2.5 W active cables). The others:
    BDAT 18.4 / 21.6, CCAT/CCHT 16.2 / 19.0, GCAT 14.7 / 17.2 W. The VPI
    MCX556A parts have no figures, because the VPI manual has no
    specifications chapter.
  pcie: >-
    Generation 4 is the Ex members' (-BDAT, -CDAT, MCX556A-EDAT); the rest
    are Gen3 (cx5en p50-55).
  membership: >-
    MCX556A-ECAT/-ECUT/-EDAT (VPI) are grouped here on the shared SKU root
    900-9X5AD-0056 only; the VPI manual has no drawings or specifications.
body:
  depth: 142.24
  color: '#2f7d3a'
  # the slab stops where the bracket stops being a rectangle
  plate: {at: [11.38, 3.17], size: [102.90, 18.42]}
  boxes:
  - {id: board, at: [23.56, 4.44], size: [60.50, 1.57], from: 0.00, depth: 142.24,
     color: '#2f7d3a', confidence: drawing,
     source: 'the board drawing''s 142.24 x 68.90; CEM 5.0 fig 6-5 shoulder 8.40 above W'}
  - {id: edge-tab-short, at: [15.16, 4.44], size: [8.40, 1.57], from: 46.90, depth: 11.20,
     color: '#2f7d3a', confidence: registry,
     source: 'CEM 5.0 fig 6-5: key centre 59.05 behind the bracket, 12.15 to the tab end, notch 1.90'}
  - {id: edge-tab-long, at: [15.16, 4.44], size: [8.40, 1.57], from: 60.00, depth: 71.20,
     color: '#2f7d3a', confidence: registry,
     source: 'CEM 5.0 fig 6-5: x16 DIM B 72.15 from the key centre'}
  - {id: edge-pads-short, at: [17.76, 4.39], size: [3.00, 1.67], from: 47.25, depth: 10.60,
     color: '#d4a72c', confidence: registry,
     source: 'CEM 5.0 fig 6-5: pads 2.60..5.60 up the tab, pins 1-11 on 1.00 pitch'}
  - {id: edge-pads-long, at: [17.76, 4.39], size: [3.00, 1.67], from: 60.25, depth: 70.60,
     color: '#d4a72c', confidence: registry,
     source: 'CEM 5.0 fig 6-5: the x16 pad run on 1.00 pitch'}
  - {id: heatsink, at: [43.49, 6.01], size: [25.10, 6.00], from: 75.04, depth: 25.10,
     color: '#b8bcc0', confidence: estimated,
     source: 'cx5en p57 Dual-Port x16 board: U1 outline 25.1 x 25.1 centred 40.88 above W and 87.59 behind the bracket; height not drawn'}
