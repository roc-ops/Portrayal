<svg xmlns="http://www.w3.org/2000/svg" width="79.2mm" height="18.42mm" viewBox="0 0 79.2 18.42">
  <!-- nvidia/mcx621102-lp: MCX621102A on its short bracket. The outline, tip
       and keyed flange are std/pcie-bracket-lp@1, composed BEHIND this; what is drawn
       here is the punched plate: vents, light-pipe slots and port numerals.
       TIP AT THE LEFT - NVIDIA draws the card tip-right, so this is its
       figure turned a half-turn and the numerals read upside down. -->
  <!-- METAL FILLING THE OPENING: the bracket colour, 0.3 proud all round so
       the opening stroke leaves no ghost; the holes are punched in it. -->
  <rect id="plate" x="15.33" y="2.88" width="55.13" height="12.66" fill="#9aa1a8"/>
  <g id="vents"><rect x="70.44" y="11.23" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="70.44" y="5.90" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="46.80" y="11.23" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="46.80" y="5.90" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="22.97" y="11.23" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="22.97" y="5.90" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="17.63" y="11.23" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="17.63" y="5.90" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="12.10" y="11.23" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="12.10" y="5.90" width="3.60" height="3.60" rx="0.60" fill="#17191c"/></g>
  <g id="slots"><rect x="51.66" y="14.80" width="4.60" height="0.80" rx="0.40" fill="#17191c"/><rect x="57.67" y="14.80" width="4.60" height="0.80" rx="0.40" fill="#17191c"/><rect x="63.67" y="14.80" width="4.60" height="0.80" rx="0.40" fill="#17191c"/><rect x="28.81" y="14.80" width="4.60" height="0.80" rx="0.40" fill="#17191c"/><rect x="34.92" y="14.80" width="4.60" height="0.80" rx="0.40" fill="#17191c"/><rect x="40.79" y="14.80" width="4.60" height="0.80" rx="0.40" fill="#17191c"/></g>
  <g id="silkscreen">
    <text id="label-1" x="69.42" y="8.92" transform="rotate(180 69.42 8.20)" font-family="sans-serif" font-size="2.0" font-weight="bold" text-anchor="middle" fill="#2b2d2f">1</text>
    <text id="label-2" x="27.59" y="8.92" transform="rotate(180 27.59 8.20)" font-family="sans-serif" font-size="2.0" font-weight="bold" text-anchor="middle" fill="#2b2d2f">2</text>
  </g>
</svg>
