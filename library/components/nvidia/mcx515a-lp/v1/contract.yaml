format: 1
kind: module
name: mcx515a-lp
version: 1.0.0
class: expansion-card
behaviour: fills
profile: networking
description: >-
  NVIDIA ConnectX-5 MCX515A single-port 50/100GbE QSFP28 adapter, PCIe Gen3
  x16, on its short (low-profile) bracket. The same board ships with both
  brackets; nvidia/mcx515a-fh@1 is the other.
size: {w: 79.2, h: 18.42, d: 142.24}
size-confidence: {w: registry, h: registry, d: drawing}
attrs:
  model: 'MCX515A short bracket'
  part-numbers: 'MCX515A-GCAT, MCX515A-CCAT, MCX515A-CCUT, MCX555A-ECAT'
  role: nic
  power-draw-max-w: 17.0
  power-draw-typical-w: 14.2
  power-input: host PCIe slot
  pcie-connector: x16
  pcie-generation: 3
  pcie-height: low
  qsfp28: 1
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
provenance:
  sources: >-
    CX-5 EN user manual: p12 LED interface, p53-55 spec tables, p58 Single-
    port Tall Bracket. CX-5 VPI user manual p16 LED interface. No board
    drawing: the cage is port 1 of the p57 Dual-Port x16 board; the CX-4 Lx
    single QSFP28 board (cx4lx p54) puts its cage at 48.03.
  size: >-
    registry - the face is std/pcie-bracket-lp@1, 79.2 x 18.42, composed
    behind a punched plate; `d` is the board drawing's 142.24, the card's
    length back from its bracket.
  depth: >-
    drawing - 142.24, the board mechanical drawing's length.
  the-face-is-derived-from-the-board: >-
    EVERY POSITION IS THE CARD'S, NOT THE BRACKET'S. The cages are placed at
    their distance above datum W on the dimensioned board drawing - port 1
    48.08 - with W at x' 11.11 on this bracket (PCIe CEM 5.0: 79.20 - 68.09,
    fig 11-8). Vents, light-pipe slots, lamps and numerals keep their
    measured offset from their nearest cage (or from W), read off NVIDIA's
    bracket drawings. The tall bracket art on cx4lx p54 is also on cx5en
    p58, pixel for pixel. The manuals show it under every card, SFP28
    included, but it is QSFP28 art. Its windows are 20.7 x 10.8 (a QSFP28
    cage is 20.0 wide) and they land within 0.2 of the QSFP28 boards: the
    window at d 48.19 against 48.08, the x16 dual board's port 1, and 48.03
    on the CX-4 Lx single QSFP28 board. Against the SFP28 boards it is
    wrong, so it is used only for the QSFP28 layouts. The vent field,
    squares, LED windows and numerals keep their offsets from the nearest
    window. The across-bracket positions are anchored at the cage's y_lp
    8.30. The art is scaled by its own 121.05; its windows read 20.7 against
    an 18.75 QSFP28 opening, but rescaling by the window would break the
    0.1-0.2 cage and LED agreement with the boards, so the window is taken
    as drawn with clearance. There is no short-bracket drawing, so the low-
    profile face is the tall one moved through the CEM W offsets. Features
    that would fall off the short metal are drawn on the tall bracket only.
    The cage d is INFERRED because this card has no board drawing.
  orientation: >-
    drawn TIP-LEFT, so NVIDIA's tip-right figures are turned a half-turn:
    cages and lamps are placed `rotate: 180` and the numerals read upside
    down. In a turned bay - Dell riser 3 - the card lands as NVIDIA draws
    it.
  lamps: >-
    drawing - one bi-colour LED (cx5en p12, yellow/green), placed at the
    art's flange-side oval, 14.63 from the cage. Both drawn QSFP28 boards
    put an LED there (14.56 on cx4lx p54 and 14.40 on cx5en p57).
    common/led-rect-sm@1 stands in for an oval about 2.7 x 1.6. The art's
    tip-side oval is drawn as an empty window: no drawn single-port board
    has an LED behind it.
  body: >-
    the board, edge tab and pads are PCIe CEM 5.0's (figs 6-5, 11-3, 11-8)
    at the board drawing's size; the heatsink is the board drawing's U1
    outline at its drawn position (the manual says a heatsink is attached to
    the IC by push pins or screws but does not draw it); its 6.0 height is
    an estimate. The U1 outline is borrowed from the x16 dual-QSFP28 board.
  power: >-
    datasheet - cx5en p53-55 spec tables, typical at ATIS load and maximum
    with passive cables: MCX515A-CCAT/-CCUT 14.2 W typical, 17.0 W maximum
    (18.6 / 19.7 W with 1.5 / 2.5 W active cables); MCX515A-GCAT 12.7 / 15.1
    W. MCX555A-ECAT (VPI) has no figures: the VPI manual has no
    specifications chapter.
  membership: >-
    MCX555A-ECAT (VPI, EDR InfiniBand / 100GbE) is grouped here on size, IC
    and SKU root only; the VPI manual has no drawings or specifications.
body:
  depth: 142.24
  color: '#2f7d3a'
  # the slab stops where the bracket stops being a rectangle
  plate: {at: [11.85, 0.00], size: [56.18, 18.42]}
  boxes:
  - {id: board, at: [19.51, 1.27], size: [60.50, 1.57], from: 0.00, depth: 142.24,
     color: '#2f7d3a', confidence: drawing,
     source: 'the board drawing''s 142.24 x 68.90; CEM 5.0 fig 6-5 shoulder 8.40 above W'}
  - {id: edge-tab-short, at: [11.11, 1.27], size: [8.40, 1.57], from: 46.90, depth: 11.20,
     color: '#2f7d3a', confidence: registry,
     source: 'CEM 5.0 fig 6-5: key centre 59.05 behind the bracket, 12.15 to the tab end, notch 1.90'}
  - {id: edge-tab-long, at: [11.11, 1.27], size: [8.40, 1.57], from: 60.00, depth: 71.20,
     color: '#2f7d3a', confidence: registry,
     source: 'CEM 5.0 fig 6-5: x16 DIM B 72.15 from the key centre'}
  - {id: edge-pads-short, at: [13.71, 1.22], size: [3.00, 1.67], from: 47.25, depth: 10.60,
     color: '#d4a72c', confidence: registry,
     source: 'CEM 5.0 fig 6-5: pads 2.60..5.60 up the tab, pins 1-11 on 1.00 pitch'}
  - {id: edge-pads-long, at: [13.71, 1.22], size: [3.00, 1.67], from: 60.25, depth: 70.60,
     color: '#d4a72c', confidence: registry,
     source: 'CEM 5.0 fig 6-5: the x16 pad run on 1.00 pitch'}
  - {id: heatsink, at: [39.44, 2.84], size: [25.10, 6.00], from: 75.04, depth: 25.10,
     color: '#b8bcc0', confidence: estimated,
     source: 'INFERRED from the cx5en p57 Dual-Port x16 board''s U1 (25.1 square, 40.88 above W, 87.59 behind the bracket); no single-port board drawing; height not drawn'}
faces:
  plan:
    ref: common/pcie-card-plan-lp@1
parts:
  - {ref: std/pcie-bracket-lp@1, id: bracket, at: [0, 0], behind: true}
  - {ref: std/qsfp28@1, id: port-1, at: [49.19, 3.23], rotate: 180, group: qsfp28}
  - ref: common/led-rect-sm@1
    id: led-port-1
    at: [72.42, 2.67]
    rotate: 180
    group: port-leds
    states: {lamp: ['off', {name: link-up, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: error, color: '#eab308', behavior: blinking}, {name: beacon, color: '#eab308', behavior: blinking}]}
skins: [default]
