format: 1
kind: module
name: mcx4121a-fh
version: 1.0.0
class: expansion-card
behaviour: fills
profile: networking
description: >-
  NVIDIA ConnectX-4 Lx MCX4121A dual-port 10/25GbE SFP28 adapter, PCIe Gen3
  x8, on its tall (full-height) bracket. The same board ships with both
  brackets; nvidia/mcx4121a-lp@1 is the other.
size: {w: 120.02, h: 21.59, d: 142.24}
size-confidence: {w: registry, h: registry, d: drawing}
attrs:
  model: 'MCX4121A tall bracket'
  part-numbers: 'MCX4121A-XCAT, MCX4121A-XCHT, MCX4121A-ACAT, MCX4121A-ACUT, MCX4121A-ACHT, MCX4121A-ACST'
  role: nic
  power-draw-max-w: 11.6
  power-draw-typical-w: 9.6
  power-input: host PCIe slot
  pcie-connector: x8
  pcie-generation: 3
  pcie-height: full
  sfp28: 2
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
provenance:
  sources: >-
    CX-4 Lx EN user manual: p12 LED interface, p49/p51 spec tables, p54
    board drawing Dual-port 10/25 Gb/s (142.24 x 68.90). Face borrowed from
    the CX-5 EN user manual p58 MCX512F-ACAT tall bracket. Lamp check:
    NVIDIA's own top-view product photograph (nvidia.com, connectx4-lx
    page).
  size: >-
    registry - the face is std/pcie-bracket-fh@2, 120.02 x 21.59, composed
    behind a punched plate; `d` is the board drawing's 142.24, the card's
    length back from its bracket.
  depth: >-
    drawing - 142.24, the board mechanical drawing's length.
  the-face-is-derived-from-the-board: >-
    EVERY POSITION IS THE CARD'S, NOT THE BRACKET'S. The cages are placed at
    their distance above datum W on the dimensioned board drawing - port 1
    49.60, port 2 25.10 - with W at x' 15.16 on this bracket (PCIe CEM 5.0:
    120.02 - 104.86, fig 11-3). Vents, light-pipe slots, lamps and numerals
    keep their measured offset from their nearest cage (or from W), read off
    NVIDIA's bracket drawings. Face confidence BORROWED from nvidia/mcx512f:
    cx5en p58's MCX512F-ACAT tall bracket is a real SFP28 bracket. Its two
    15.2 x 10.8 windows sit at d 49.80 / 25.49 by its own 121.05, which is
    within 0.29 / 0.64 of the 512A x8 board (pitch 24.31 against 24.66). Its
    hexagonal vent field, the six 1.5 squares beside each window and the LED
    windows and numerals keep their offsets from the nearest window. The
    across-bracket positions are anchored at the cage's y_lp 8.24, because
    the art puts the window 0.48 higher. There is no short-bracket drawing,
    so the low-profile face is the tall one moved through the CEM W offsets.
    Features that would fall off the short metal are drawn on the tall
    bracket only. cx4lx p54's 'Dual-port Tall Bracket' is QSFP28 art with
    its two windows touching, which contradicts this board's cages 24.51
    apart. So the 512F bracket, the same vendor's SFP28 bracket one
    generation later, is placed around this board's own cages (pitch 24.50
    against the art's 24.31).
  orientation: >-
    drawn TIP-LEFT, so NVIDIA's tip-right figures are turned a half-turn:
    cages and lamps are placed `rotate: 180` and the numerals read upside
    down. In a turned bay - Dell riser 3 - the card lands as NVIDIA draws
    it.
  lamps: >-
    drawing - one bi-colour LED per port (cx4lx p12, amber/green), shown
    through an oval window about 3.0 x 1.5 on the keyed side, 13.09 flange-
    ward of port 1 and 13.09 tip-ward of port 2 (from the 512F art).
    common/led-rect-sm@1 at 2.8 x 1.6 is 0.2 short. Checks: the cx4lx p54
    board draws the LEDs 12.85 / -13.27 from the cages, and NVIDIA's top-
    view photograph shows the right-angle LEDs D1 / D5 13.05 / -12.62 from
    the cages.
  body: >-
    the board, edge tab and pads are PCIe CEM 5.0's (figs 6-5, 11-3, 11-8)
    at the board drawing's size; the heatsink is the board drawing's U1
    outline at its drawn position (the manual says a heatsink is attached to
    the IC by push pins or screws but does not draw it); its 6.0 height is
    an estimate.
  power: >-
    datasheet - cx4lx p49 and p51 spec tables, typical at ATIS load and
    maximum with passive cables: MCX4121A-AC* 9.6 W typical, 11.6 W maximum
    (15.0 W with a 1 W active cable); MCX4121A-XC* 9.3 / 11.1 W (13.3 W with
    a 1 W active cable). The largest passive figures are carried.
body:
  depth: 142.24
  color: '#2f7d3a'
