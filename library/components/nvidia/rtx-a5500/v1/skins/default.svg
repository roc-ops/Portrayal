<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="41.91mm" viewBox="0 0 120.02 41.91">
  <!-- nvidia/rtx-a5500: the RTX A5500 dual-slot bracket, seen from OUTSIDE the
       chassis, drawn from the facts in the contract's provenance (a straight-on
       photograph of the bracket, scaled by the plate's own length: 0.2942 mm per
       pixel). TIP AT THE LEFT, flange end at the right, the board's side at the
       top, as std/pcie-bracket-fh@2 is drawn: the photograph is turned a quarter
       into this frame. A silver plate with four DisplayPort receptacles along the
       board's side and a grid of square vent holes beside them, with a Torx screw
       on a round boss at each corner of the grid. Nothing is traced. -->
  <defs>
    <!-- one vent hole 3.60 along the bracket by 3.75 across it, on a 4.68 pitch
         along and a 4.70 pitch across -->
    <pattern id="hole" patternUnits="userSpaceOnUse" x="31.30" y="15.71" width="4.68" height="4.70">
      <rect x="0" y="0" width="3.60" height="3.75" fill="#101112"/>
    </pattern>
  </defs>
  <path id="plate" d="M1.9 7.3 L7.27 7.3 L9.27 5.3 L20.5 5.3 L21.5 3.5 L119.2 3.5 L119.2 0.3 L120.02 0.3 L120.02 40.9 L119.2 40.9 L119.2 41.2 L21.5 41.2 L20.5 40.1 L9.67 40.1 L7.27 37.7 L1.9 37.7 A1.9 1.9 0 0 1 0 35.8 L0 29.4 A1.9 1.9 0 0 1 1.9 27.5 L7.27 27.5 L10.95 24.1 A2.4 2.4 0 0 0 10.95 20.9 L7.27 17.5 L1.9 17.5 A1.9 1.9 0 0 1 0 15.6 L0 9.2 A1.9 1.9 0 0 1 1.9 7.3 Z" fill="#b9bec3" stroke="#5f666d" stroke-width="0.4" stroke-linejoin="round"/>
  <!-- the fold: the flange turns 90 degrees here. On an elevation it is a line. -->
  <path id="flange-fold" d="M119.6 0.6 V40.6" stroke="#5f666d" stroke-width="0.3" fill="none"/>
  <!-- the pressed panel the grid and its screws sit in -->
  <rect id="panel" x="30.1" y="15.1" width="86.2" height="24.0" rx="1.4" fill="none" stroke="#a5aaaf" stroke-width="0.25"/>
  <!-- the four DisplayPort receptacles: an 18.2 x 6.9 shell with the D shape's
       chamfer at the flange end, a dark opening and two rows of pins. Each is
       drawn once at its own place; the library has no DisplayPort part. -->
  <g id="display-port-1">
    <path d="M95.7 6.15 L112.3 6.15 A0.8 0.8 0 0 1 113.1 6.95 L113.1 9.9 L109.95 13.05 L95.7 13.05 A0.8 0.8 0 0 1 94.9 12.25 L94.9 6.95 A0.8 0.8 0 0 1 95.7 6.15 Z" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M95.9 7.15 L112.1 7.15 L112.1 9.6 L109.6 12.05 L95.9 12.05 Z" fill="#18191b"/>
    <path d="M97.5 8.4 H110.7 M97.5 10.3 H108.6" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-2">
    <path d="M74.6 6.15 L91.2 6.15 A0.8 0.8 0 0 1 92.0 6.95 L92.0 9.9 L88.85 13.05 L74.6 13.05 A0.8 0.8 0 0 1 73.8 12.25 L73.8 6.95 A0.8 0.8 0 0 1 74.6 6.15 Z" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M74.8 7.15 L91.0 7.15 L91.0 9.6 L88.5 12.05 L74.8 12.05 Z" fill="#18191b"/>
    <path d="M76.4 8.4 H89.6 M76.4 10.3 H87.5" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-3">
    <path d="M53.7 6.15 L70.3 6.15 A0.8 0.8 0 0 1 71.1 6.95 L71.1 9.9 L67.95 13.05 L53.7 13.05 A0.8 0.8 0 0 1 52.9 12.25 L52.9 6.95 A0.8 0.8 0 0 1 53.7 6.15 Z" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M53.9 7.15 L70.1 7.15 L70.1 9.6 L67.6 12.05 L53.9 12.05 Z" fill="#18191b"/>
    <path d="M55.5 8.4 H68.7 M55.5 10.3 H66.6" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-4">
    <path d="M31.8 6.15 L48.4 6.15 A0.8 0.8 0 0 1 49.2 6.95 L49.2 9.9 L46.05 13.05 L31.8 13.05 A0.8 0.8 0 0 1 31.0 12.25 L31.0 6.95 A0.8 0.8 0 0 1 31.8 6.15 Z" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M32.0 7.15 L48.2 7.15 L48.2 9.6 L45.7 12.05 L32.0 12.05 Z" fill="#18191b"/>
    <path d="M33.6 8.4 H46.8 M33.6 10.3 H44.7" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <!-- the vent grid: 18 rows of 5 holes along the bracket; the holes under the
       four screws' bosses and those the bosses clip are covered by the boss -->
  <rect id="vent" x="31.30" y="15.71" width="83.16" height="22.55" fill="url(#hole)"/>
  <g id="screws">
    <g id="screw-1"><circle cx="113.5" cy="18.24" r="3.3" fill="#b9bec3" stroke="#a5aaaf" stroke-width="0.2"/><circle cx="113.5" cy="18.24" r="2.35" fill="#cfd2d5" stroke="#5f666d" stroke-width="0.3"/><circle cx="113.5" cy="18.24" r="1.0" fill="#4a4f55"/></g>
    <g id="screw-2"><circle cx="113.5" cy="35.9" r="3.3" fill="#b9bec3" stroke="#a5aaaf" stroke-width="0.2"/><circle cx="113.5" cy="35.9" r="2.35" fill="#cfd2d5" stroke="#5f666d" stroke-width="0.3"/><circle cx="113.5" cy="35.9" r="1.0" fill="#4a4f55"/></g>
    <g id="screw-3"><circle cx="32.4" cy="18.24" r="3.3" fill="#b9bec3" stroke="#a5aaaf" stroke-width="0.2"/><circle cx="32.4" cy="18.24" r="2.35" fill="#cfd2d5" stroke="#5f666d" stroke-width="0.3"/><circle cx="32.4" cy="18.24" r="1.0" fill="#4a4f55"/></g>
    <g id="screw-4"><circle cx="32.4" cy="35.9" r="3.3" fill="#b9bec3" stroke="#a5aaaf" stroke-width="0.2"/><circle cx="32.4" cy="35.9" r="2.35" fill="#cfd2d5" stroke="#5f666d" stroke-width="0.3"/><circle cx="32.4" cy="35.9" r="1.0" fill="#4a4f55"/></g>
  </g>
</svg>
