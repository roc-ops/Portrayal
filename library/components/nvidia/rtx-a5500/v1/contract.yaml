format: 1
kind: module
name: rtx-a5500
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA RTX A5500 (24 GB GDDR6), an actively cooled dual-slot full-height
  full-length workstation card with a blower. The bracket face is silver with
  four DisplayPort connectors on the board's side and a grid of square vent holes
  beside them, held by four Torx screws. The shroud is matte black with the
  blower's opening on its broad side and the heat sink's champagne top showing
  along the top edge. One NVLink connector sits on the top edge. It has one PCIe
  8-pin power connector at the far end by the top edge. It plugs into one riser
  slot and covers the one beside it.
slot-width: 2
size: {w: 120.02, h: 41.91, d: 266.70}
size-confidence: {w: registry, h: registry, d: datasheet}
unplaced: >-
  no bay in the library lists this card in `accepts`. The one riser that spans,
  dell/riser-1a-14g@2's `slot-1`, is the Dell R740xd's, and nvidia/a30@1 records
  that server's manual (table 27) as naming data-center cards only. No document
  held says any server takes a workstation card, and seating it is an edit to an
  existing component that this change does not make.
attrs:
  model: 'RTX A5500'
  part-numbers: 'PNY VCNRTXA5500-PB (retail), VCNRTXA5500-SB (single bulk), VCNRTXA5500-BLK (bulk), VCNRTXA5500-EDU (education)'
  role: gpu
  form-factor: 'Full-height, full-length (FHFL) 4.4 in x 10.5 in, dual slot'
  pcie-connector: x16
  pcie-generation: 4
  pcie-height: full
  power-draw-max-w: 230
  power-input: 'host PCIe slot and one PCIe 8-pin auxiliary connector'
  memory: '24 GB GDDR6, 384-bit, 768 GB/s'
  display-ports: '4 x DisplayPort 1.4a on the bracket'
  cooling: active
  airflow: 'blower; it draws air from the card''s broad side and exhausts toward the bracket'
  nvlink: 'one connector on the top edge; low-profile bridges connect two RTX A5500, 112.5 GB/s bidirectional'
faces:
  rear: {ref: nvidia/rtx-a5000-tail@1}
provenance:
  slot-width: >-
    datasheet - NVIDIA's RTX A5500 datasheet: "Form factor 4.4' H x 10.5' L, dual
    slot, full height". The Ampere quick-start guide's dual-slot sentence names the
    RTX A6000, A5000 and A2000 and does not name this card; the datasheet is the
    source. The face is one plate about 38 across (`face-outline`). The card
    declares `slot-width: 2` as docs/pcie-two-slot-bays-design.md R1 defines it.
  sources: >-
    NVIDIA RTX A5500 datasheet (footer 2022),
    https://www.nvidia.com/content/dam/en-zz/Solutions/products/workstations/nvidia-rtx-a5500-datasheet.pdf.
    PNY's copy,
    https://www.pny.com/File%20Library/Company/Support/Product%20Brochures/NVIDIA%20RTX/English/nvidia-rtx-a5500-datasheet.pdf,
    for the order codes. NVIDIA's RTX Ampere online quick-start guide (r3, 7 March
    2024), https://images.nvidia.com/aem-dam/en-zz/Solutions/design-visualization/quadro-product-literature/proviz-rtx-ampere-online-qsg-210x148mm-20240307-r3.pdf:
    it does not name this card, and its connector figure is the family's. NVIDIA's
    power guide DA-07261-001_v15,
    https://images.nvidia.com/aem-dam/en-zz/Solutions/design-visualization/quadro-product-literature/DA-07261-001_v15.pdf,
    table 1: "NVIDIA RTX A5500" 230 W, "PCIe 8-pin". NVIDIA publishes no dimensioned drawing of
    this card: the geometry is measured on PNY's photographs (below) and carried
    over from the standards. Licence not stated; facts read from them, pictures
    not used.
  reference-photos: >-
    reference - PNY's product images for the RTX A5500, under
    https://d2vfia6k6wrouk.cloudfront.net/productimages/8b90ccdf-c2e8-4db4-94f9-ae6000b8b4f8/images/:
    rtx_a-series-a5500_left.png (the bracket straight on, 143 x 427 px, its tip at
    the bottom), rtx_a-series-a5500_front.png (the broad side straight on, 739 x
    331 px) and three 3/4 views (nvidia-rtx-a5500-topleft.png,
    rtx_a-series-a5500-nvlink_3qtr-topleft.png with a bridge fitted, and
    rtx_a-series-a5500_3qtr-left.png). Each was checked to be this card: four
    DisplayPorts beside a grid of square vent holes, a matte black blower shroud,
    the same card in all five, and none of the five is byte-identical to a picture
    of the RTX A5000, A4500 or A6000 (checked by checksum). The intake's NVIDIA
    page image for this card is the RTX A5000's render and is not used. MM PER
    PIXEL: bracket photograph 0.2942 (3.399 px/mm), broad-side photograph 0.3769
    (2.653 px/mm). Both are set out under `face-outline` and `body-fan`. NO
    STRAIGHT-ON VIEW OF THE TOP EDGE OR THE FAR END EXISTS: the 3/4 views are at
    about 45 degrees and cannot be scaled.
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2,
    PCIe CEM 5.0 figure 11-5). h is two slots: the single bracket's 21.59 plus
    one 20.32 slot pitch, 41.91, as on the A100.
  depth: >-
    datasheet - 10.5 in, exactly 266.70, from the bracket's outer face as
    nvidia/a100-pcie-40gb@1 reads the same figure. On the broad-side photograph
    the plate seen edge on has its outer face at column 55.5 and the shroud runs
    from column 58 to 763, so 707.5 px stand for the datasheet's length: 2.653
    px/mm, and the shroud starts 0.94 behind the face (0.9 is used). The
    photograph is isotropic to better than 2 percent: the blower's ring fits a
    circle in pixels, the shroud's 257 px are 96.9 across against the board's 97.9
    (1.0 less), and the 330 px from the bracket's tip to the top edge are 124.4
    against CEM's 126.31 (1.9 less).
  face-outline: >-
    photo-measured - the bracket photograph (rtx_a-series-a5500_left.png) turned
    a quarter into this frame, tip at the left and the board's side at the top.
    Its scale is the plate itself: the 408 px from the tip (row 607.5) to the
    flange's end (row 199.5, the line of the fold, with the card's dark top edge
    above it) are the standard's 120.02, so 3.399 px/mm (0.2942 mm per pixel). The
    two retention tabs check it: each is 34.5 px wide, 10.15 against CEM's 10.2, and
    their centres are 68.5 px apart, 20.15 at that scale against the 20.32 slot
    pitch (0.8 percent short). The plate is columns 337.5 to 465.5, 128 px, so its
    board-side edge is put at y 3.5 and its far edge at 41.2 (the photograph gives
    41.15; 37.7 across, against 38.74 for two CEM single bodies on one pitch and
    the A100's 35.9), with a step 20 from the tip to 5.5 and 40.35 (rows 540; the
    A5000's 20.5 to 5.3 and 40.1 are kept); the tabs are at 7.5 to 17.5 and 27.5
    to 37.7, 10.0 wide. The tip's rounded corners and the V notch between the tabs
    are the A100's; the notch's apex reads 11.0 from the tip. Readings are good to
    about 0.5 mm.
  face-displayports: >-
    photo-measured - four DisplayPort receptacles along the board's side, at the
    same scale. Their openings are 55 px long, 16.2, and 4.9 across, and the shell
    is drawn 1.0 larger all round, 18.2 x 6.9 (y 6.15 to 13.05), with the D shape's
    chamfer at the flange end on the grid's side. Their centres along the bracket
    are 40.1, 62.0, 82.9 and 104.0 (rows 471, 396.5, 325.5 and 254 of the
    photograph), pitches 21.9, 20.9 and 21.1: the lowest pair is not on the others'
    pitch, and the RTX A4500's bracket photograph, measured at its own scale, gives
    the same three pitches. THE LIBRARY HAS NO DISPLAYPORT PART OR INTERFACE, so each
    is an element of class `connector` painted in the skin and not a seated part;
    nothing mates it and the module type carries no port for them (the
    `display-ports` attr says 4 x DisplayPort 1.4a, the datasheet's words). The
    pins are drawn as two rows of dashes, not counted.
  face-grille: >-
    photo-measured - a grid of square vent holes beside the DisplayPorts: 5 columns
    across and 18 rows along the bracket. Each hole is 12 px along (3.6) by 13 px
    across (3.75) on a pitch of 15.9 px along (4.68) and 16.0 px across (4.70),
    from x 31.3 to 114.46 and from y 15.71 to 38.26. The holes' places come from the
    left edges of the rows (columns 379, 395, 411, 427 and 443) and the tops of the
    columns (rows 235 to 473.5). The first and last rows have only three holes: the
    outer two are covered by the screw bosses and the middle three are clipped
    where the boss circle reaches them (9, 13 and 8 px wide in the photograph), as
    the contract's circles cover them.
  face-screws: >-
    photo-measured - four Torx screws in the corners of the grid, at the places the
    photograph puts them: columns 387.6 and 447.7, rows 221.7 and 497.7, which are
    x 113.5 and 32.3 and y 18.24 and 35.9. Each head is 16 px across (4.7) and sits on
    a round boss 22 px across (6.6) that clips the holes beside it. The recess is
    drawn as a plain dark circle, not a six-lobe star.
  face-markings: >-
    photo-measured - the bracket carries no lamp, no label and no printing. The
    control is the holes and the screw recesses, which resolve in the same
    photograph at the same scale. The grid sits in a shallow pressed panel whose
    outline is drawn as a thin line (x 30.1 to 116.3, y 15.1 to 39.1).
  thickness: >-
    estimated - the datasheet states no thickness. The shroud's far face is put at
    y 40.0, as nvidia/a100-pcie-80gb@1 has it, 1.2 inside the bracket's far edge
    (41.2). The bracket photograph's plate is 37.7 across, which bounds a dual-slot
    card at 41.91.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the A100 are. The board, and the
    bracket's keyed side, are at the top (small y), which is where the
    DisplayPorts are.
  body: >-
    the board, its edge and the pads follow PCIe CEM 5.0 (figures 6-5 and 11-3,
    as nvidia/mcx755106-fh@1 has them): the card height 111.15, the lower edge
    13.25 above the finger datum W and the key datum 57.15 behind the bracket, so
    the top edge is at x 126.31. NVIDIA prints no figure for this card. The
    broad-side photograph reads the shroud 96.9 high against the board's 97.9 and
    the gold fingers ending 130.2 behind the bracket against CEM's 128.95: it
    agrees to within the photograph's accuracy, and CEM's figures are kept. The
    lower edge has a notch from 145.7 to 160.0 behind the bracket, 3.4 deep (the
    shroud's lower edge steps up 9 px at columns 442 to 474 and returns by 481),
    drawn as one box 14.3 long, as the A5000's.
  body-shroud: >-
    photo-measured - the shroud is matte black, one slab from the board's
    component face (y 6.01) to the far face (40.0), the outline of the board, split
    at the notch as the board is. Its broad side is not one tone: the photograph
    reads #1d1d1d at the bracket end, #111111 over the middle and #3d3d3e at the far
    end (a lighter sheen), which the broad-side skin draws as a gradient. The back
    of the card is not seen in any photograph held, so there is no backplate and
    the board's rear is bare, as nvidia/a10@1 has it.
  body-fan: >-
    photo-measured - the blower's opening on the broad side, from PNY's
    photograph (739 x 331 px) at 2.653 px/mm. A circle fitted to the bright rim
    gives the centre at px (577.1, 372.9): 70.1 from the far end and 44.25 below the
    top edge. Read outward from there: the hub's face is 15.2 in radius, ringed by
    a bright rim 16.6 in radius and about 1.4 wide, the hub 18.1; a dark well to
    27.9; a ring of blades from 27.9 to 32.8; a bright inner rim at 33.4; a bezel
    face to 36.4; a groove at 36.8 and the bezel's outer edge at 37.6 (the
    bezel is 75.2 across). The blades are short light strokes: 53 of them (the
    angular profile at five radii gives 53 peaks from r 78 outward; the same count
    holds on the RTX A4500's photograph), each leaning 24 degrees from the radius,
    its outer end turned counter-clockwise on the screen (the phase of the 53rd
    harmonic drifts 173 degrees over the 10 px of the band). They are 0.55 wide and
    4.6 long. Painted on the broad side, not an opening in the 3D body.
  body-top-edge: >-
    estimated - PNY's 3/4 views show the top edge as a grey frame around a slot,
    with the heat sink's champagne top (#d2c2a8, the median of its pixels) filling
    most of it, "RTX A5500" in small print on the ledge by the bracket end, and
    three connectors on the ledge along the strip's board side: NVLINK (gold
    contacts) at the bracket end, STEREO and SYNC beyond it. The views are at about
    45 degrees and cannot be scaled, so every place here is a fraction of the edge's
    length read along the strip's axis, with the perspective not removed, and is
    estimated: the strip from 11.5 to 252.5 behind the bracket (4 to 95 percent of
    the length), 19.0 to 36.8 across the card (the ledge is the first 38 percent of
    the top face, the strip 52 and the outer wall 8), with a bay cut into its board
    side 6.5 deep from 163 to 205 around the blower and a rounded far end; beyond
    it the slot is black. "RTX A5500" is 3.0 behind the bracket, 2.4 tall. THE
    NVLINK, STEREO AND SYNC CONNECTORS ARE NOT DRAWN: no straight-on view shows them
    at scale (gaps). The maker's mark on the ledge by the far end (it reads 24 long
    and 6 across, from 238 to 262 behind the bracket and 9.0 to 15.0 across) is NOT
    DRAWN and its box is reserved as `logo-zone` in `skins/body-right.svg`,
    estimated.
  body-nvlink: >-
    datasheet - one NVLink connector on the top edge; "low profile bridges connect
    two NVIDIA RTX A5500 GPUs", 112.5 GB/s bidirectional. NOT DRAWN, AND NO
    INTERFACE: no document held names the bridge's part number, and the registry
    has the A100's connector only (nvidia/nvlink-a100-connector@1), which no source
    says this card mates. The fact is the `nvlink` attr.
  body-power-connector: >-
    estimated - the datasheet says "Power connector 1x 8-pin PCIe", 230 W, and
    NVIDIA's power guide DA-07261 table 1 says "PCIe 8-pin", 230 W. The Ampere
    quick-start guide does not name this card, so no figure of the connector at the
    card's end is held for it. The housing is drawn at
    nvidia/a10@1's place (105.6 to 123.6 on the card's x, 12.5 across the board's
    component face), black, with eight cells. No photograph of the card's end is
    held. THE PORT is `aux-power` on the rear face (`faces.rear`,
    nvidia/rtx-a5000-tail@1, reused: the RTX A5000's end, a closed black plate 97.9 x
    35.56 with the same header at the same place, which every figure of the RTX
    A5500's end matches and no photograph contradicts): std/pcie-8pin-header@1, which presents
    `pcie-8pin` for a PCIe 8-pin cable and which the card exports as a power
    port.
  body-end: >-
    estimated - a closed black end plate 1.0 thick, 1.4 inside the card's length,
    and the connector housing standing 0.2 proud of it, as nvidia/a10@1 has it. No
    photograph shows the end.
  body-foot: >-
    photo-measured - the broad-side photograph shows a dark block under the
    shroud's near end: 19 px, 7.2, below the lower edge and 12 px, 4.6, along the
    card, from 5.0 behind the bracket (columns 69 to 81), the board stepping down
    toward the finger datum, drawn as a part of the board. The bracket's two
    retention tabs below it are the face's (`skins/default.svg`), 0.9 thick,
    estimated.
  power: >-
    datasheet - total board power 230 W in the datasheet and DA-07261 table 1. The
    sources agree.
  memory: >-
    datasheet - 24 GB GDDR6, 384-bit, 768 GB/s, ECC.
  pcie: >-
    datasheet - PCIe 4.0 x16.
  part-numbers: >-
    datasheet - PNY's datasheet: "Retail: VCNRTXA5500-PB, Single Bulk:
    VCNRTXA5500-SB, Education: VCNRTXA5500-EDU, Bulk: VCNRTXA5500-BLK". NVIDIA's
    own copy gives none. No NVIDIA board SKU or order code is in any document held.
  weight: >-
    not stated - no datasheet held gives a weight for the card.
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) a straight-on view of the top edge and the
    far end (needs-photo; the top edge's strip, its bay and the printing are
    estimated, the NVLINK, STEREO and SYNC connectors are not drawn and the end is a
    schematic); (2) the NVLink connector's place and the bridge's interface, which
    the registry does not have (needs-photo, needs-drawing); (3) the DisplayPort
    part and interface, which the library lacks (the four are painted, not seated);
    (4) the thickness, which no source states (vendor-silent); (5) the fingers' and
    the notch's true outline, which the broad-side photograph draws otherwise than
    CEM by a few millimetres (needs-drawing); (6) the card's back, which no
    photograph shows (needs-photo); (7) a weight and an NVIDIA order code
    (vendor-silent in the documents held); (8) the lifecycle: no end-of-life notice
    was searched for; (9) a quick-start guide that names this card (the Ampere
    guide does not, so no figure of its connector is held).
