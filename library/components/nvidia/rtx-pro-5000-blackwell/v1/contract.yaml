format: 1
kind: module
name: rtx-pro-5000-blackwell
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA RTX PRO 5000 Blackwell (48 GB GDDR7) and RTX PRO 5000 72GB Blackwell.
  It is one actively cooled dual-slot full-height full-length workstation card in
  two memory sizes. The board, the bracket and the shroud are the same. The bracket
  face is silver with four DisplayPort connectors on the board's side and a framed
  field of eleven vent slots beside them. The shroud is matte near-black with the
  blower's opening on its broad side and a black backplate. The heat sink's ridged
  top shows along the top edge. It has one 16-pin PCIe CEM5 power connector at the
  far end by the top edge. It plugs into one riser slot and covers the one beside
  it.
slot-width: 2
size: {w: 120.02, h: 41.91, d: 266.70}
size-confidence: {w: registry, h: registry, d: datasheet}
unplaced: >-
  no bay in the library lists this card in `accepts`. A riser bay names each card
  it takes by hand (docs/cards-by-interface-design.md, status proposed: no
  interface or mates field exists on a card or a bay today), and no document held
  says any server takes a workstation card, so none was added and seating it
  would be an edit to an existing component that this change does not make.
attrs:
  model: 'RTX PRO 5000 Blackwell'
  part-numbers: 'RTX PRO 5000 Blackwell (48 GB): PNY VCNRTXPRO5000B-PB (retail), VCNRTXPRO5000B-BLK (bulk), NVIDIA 900-5G153-2250-000; RTX PRO 5000 72GB Blackwell: PNY VCNRTXPRO5000B72-PB (retail), VCNRTXPRO5000B72-BLK (bulk), NVIDIA 900-5G153-2270-000'
  role: gpu
  form-factor: 'Full-height, full-length (FHFL) 4.4 in x 10.5 in, dual slot'
  pcie-connector: x16
  pcie-generation: 5
  pcie-height: full
  power-draw-max-w: 300
  power-input: 'host PCIe slot and one PCIe CEM5 16-pin (12VHPWR) auxiliary connector; a 2x PCIe 8-pin to 1x PCIe Gen5 16-pin adapter is in the box'
  memory: 'RTX PRO 5000: 48 GB GDDR7 with ECC; RTX PRO 5000 72GB: 72 GB GDDR7 with ECC; both 384-bit, 1,344 GB/s'
  display-ports: '4 x DisplayPort 2.1b on the bracket'
  cooling: active
  airflow: 'blower; it draws air from the card''s broad side and exhausts toward the bracket'
  nvlink: 'none listed'
