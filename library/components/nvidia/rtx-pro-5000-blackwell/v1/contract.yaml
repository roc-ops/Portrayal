provenance:
  slot-width: >-
    datasheet - NVIDIA's RTX PRO 5000 Blackwell datasheet (5488550): "Form Factor
    4.4' x 10.5' L, dual slot, full height"; the RTX PRO Blackwell quick-start
    guide (r18) lists the RTX PRO 5000 72GB and RTX PRO 5000 among the "dual-slot
    GPUs" that "require removing two adjacent slot covers". The face is one plate
    about 36.5 across (`face-outline`). The card declares `slot-width: 2` as
    docs/pcie-two-slot-bays-design.md R1 defines it.
  variants: >-
    ONE MODULE FOR TWO MEMORY SIZES. NVIDIA's datasheet is one document for "NVIDIA
    RTX PRO 5000 Blackwell" and "NVIDIA RTX PRO 5000 72GB Blackwell": the same
    cores, 384-bit bus, 1,344 GB/s, 300 W, form factor and connector, with 48 GB or
    72 GB of memory. PNY lists the 72GB card on its own pages with four pictures
    that are byte for byte the 48 GB card's (the bracket, the front, the back and
    one 3/4 view from above, checked by checksum) and a fifth, its own file
    (rtx5000-pro-front.png), that shows the same broad side with a 16-pin plug
    pictogram. The face, bracket and body are therefore one. A module has no
    `configurations` key (the schema keeps it for kits), so the 72GB card is not a
    configuration of this one: its memory is in the `memory` attr and its order
    codes are in `part-numbers`. The DCIM export is one module type, "RTX PRO 5000
    Blackwell".
  sources: >-
    NVIDIA RTX PRO 5000 Blackwell datasheet (5488550), served by nvidia.com at
    https://www.nvidia.com/content/dam/en-zz/Solutions/products/workstations/professional-desktop-gpus/rtx-pro-5000-blackwell/workstation-datasheet-blackwell-rtx-pro-5000-5488550-nvidia.pdf
    (it carries both memory sizes in two columns, and is the newer of the two
    datasheets held). The earlier print (GTC spring 2025, 3658700), same folder,
    workstation-datasheet-blackwell-rtx-pro-5000-gtc25-spring-nvidia-3658700.pdf.
    PNY's print of NVIDIA's datasheet,
    https://www.pny.com/file%20library/company/support/product%20brochures/nvidia%20rtx/english/nvidia-rtx-pro-5000-blackwell.pdf,
    and PNY's NVIDIA Professional Graphics line card (REV. 09.14.26),
    https://www.pny.com/File%20Library/Company/Support/linecards/pro-viz-gpus/NVIDIA-Professional-Graphics-Linecard.pdf,
    for the order codes. NVIDIA's RTX PRO Blackwell online quick-start guide (r18,
    17 March 2026),
    https://images.nvidia.com/aem-dam/Solutions/design-visualization/quadro-product-literature/rtx-pro-blackwell-online-qsg-210x148mm-20260317-r18.pdf:
    the box contents, the dual-slot statement and the 16-pin connector "on the
    east edge". NVIDIA publishes no dimensioned drawing of this card and the power
    guide DA-07261 stops at the Ada generation: the geometry is measured on PNY's
    photographs (below) and carried over from the standards. The photographs are
    named by their files and licence is not stated; facts read from them, pictures
    not used.
  reference-photos: >-
    reference - PNY's product images for the RTX PRO 5000 Blackwell, under
    https://d2vfia6k6wrouk.cloudfront.net/productimages/e73bd9df-a2d4-4dbc-8d4c-b2a40108c705/images/
    (JPEG, 800 x 800, no alpha): 8-rtx-pro-5000-left.jpg (the bracket straight on,
    237 x 720 px, its tip at the bottom), 1-rtx-pro-5000-front.jpg (the broad side
    straight on, 720 x 326 px), 7-rtx-pro-5000-back.jpg (the backplate straight on,
    684 x 250 px) and 6-rtx-pro-5000-3qtr-top-left.jpg, a 3/4 view from above (the
    other 3/4 views, 2, 3 and 4, were looked at and not scaled). The 72GB card's
    folder (50b45686-df36-43ae-8ea9-b38400add381) serves the same four files by
    checksum. Each picture was checked to be this card: four DisplayPorts beside
    eleven vent slots on a silver bracket, a blower with a grey hub on a matte
    broad side, the notch 141 behind the bracket, the same card in every view. MM
    PER PIXEL: bracket photograph 0.1739 along the plate (5.75 px/mm) and 0.1736
    across it (5.76 px/mm), 0.2 percent apart; broad-side photograph 0.386 along
    the card (2.590 px/mm) and 0.390 across it (2.564 px/mm), 1.0 percent apart;
    back photograph 0.390 along (2.565 px/mm) and 0.392 across (2.554 px/mm), 0.4
    percent apart. All are set out under `face-outline`, `body-fan` and
    `body-backplate`. NO STRAIGHT-ON VIEW OF THE TOP EDGE OR THE FAR END EXISTS.
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2, PCIe
    CEM 5.0 figure 11-5). h is two slots: the single bracket's 21.59 plus one 20.32
    slot pitch, 41.91, as on the A100 and the RTX A6000.
  depth: >-
    datasheet - 10.5 in, exactly 266.70, from the bracket's outer face as
    nvidia/rtx-a5000@1 reads the same figure. On the broad-side photograph the card
    runs 691 px from the bracket's outer face (column 69) to the far end (column
    759), which at 2.590 px/mm is 266.7 (the scale along is set by that length), and
    the shroud's 251 px (rows 238 to 488) at 2.564 px/mm are 97.9 across, the board's
    height; the back photograph agrees at its own scale (684 px, 2.565 px/mm).
  face-outline: >-
    photo-measured - the bracket photograph (8-rtx-pro-5000-left.jpg) turned a
    quarter turn into this frame, tip at the left and the board's side at the top.
    Its scale along is the plate: 690 px from the tip (row 760) to the flange's fold
    (row 70, below the curl of the flange's retention tab), the standard's 120.02,
    so 5.75 px/mm (0.1739 mm/px). Its scale across is the two retention tabs, whose
    centres are 117 px apart (353.5 and 470.5), the 20.32 slot pitch, so 5.76 px/mm
    (0.1736 mm/px); the tabs are 57 px wide, 9.9 against CEM's 10.2. The first tab's
    centre is put at y 12.38, where std/pcie-bracket-fh@2 puts its own. Read that
    way the plate's board-side edge is at y 4.31 and its far edge at 40.85 above the
    step 20.7 from the tip (5.52 and 40.19 below it), so THIS PLATE IS 36.5 ACROSS,
    inside the 41.91 envelope. The tip's rounded corners, the V notch between the
    tabs (its apex 11.4 from the tip) and the flange's width are the A5000's, read
    to agree on this photograph. Readings are good to about 0.5 mm.
  face-displayports: >-
    photo-measured - four DisplayPort receptacles along the board's side, at the same
    scales. Each shell is 18.4 long and 7.5 across (y 5.7 to 13.2), with the D shape's
    chamfer (3.7 by 3.0) at the flange end on the BOARD's side, the other way about
    from the RTX A5000's. Their centres along the bracket are 41.2, 62.1, 82.9 and
    103.8, a pitch of 20.87 (shells 120 px apart). The photograph prints the port
    numbers 1 to 4 on the plate beside each shell, at its flange end and 2.0 high; they
    are drawn (the one at the flange end is 1). Readings are good to about 0.5 mm. THE
    LIBRARY HAS NO DISPLAYPORT PART OR INTERFACE, so each is an element of class
    `connector` painted in the skin and not a seated part; nothing mates it and the
    module type carries no port for them (the `display-ports` attr says 4 x
    DisplayPort 2.1b, the datasheet's words). The pins are drawn as two rows of
    dashes, not counted.
  face-grille: >-
    photo-measured - one framed field beside the DisplayPorts. The frame is 86.9 long
    and 23.8 across (x 29.6 to 116.5, y 14.9 to 38.7), a bright raised edge drawn as a
    line. Inside it, eleven slots 5.7 along and 22.7 across (y 15.4 to 38.1) on a
    pitch of 6.73, the first at x 103.9 to 109.6 and the last at 36.6 to 42.3, and a
    window at each end of the run, 4.9 along and 11.8 across (x 110.6 to 115.5 and
    30.4 to 35.3, y 20.8 to 32.6). Four Torx screws stand at x 32.7 and 113.7 and y
    17.85 and 35.6, heads 4.4 across (25 px), in the four corners of the frame. The
    slots are black on black behind the plate: how deep they run is not seen.
  face-markings: >-
    photo-measured - the bracket carries no lamp and no label; its only printing is
    the port numbers 1 to 4 named above. The control is the slots and the screw
    recesses, which resolve in the same photograph at the same scale.
  thickness: >-
    estimated - the datasheet states no thickness. The shroud's far face is put at
    y 40.0, as nvidia/rtx-a6000@1 has it, and the backplate's outer face at 1.77, the
    CEM rear envelope's 2.67 behind the board. The bracket photograph's plate
    reaches y 40.85, which bounds a dual-slot card at 41.91.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the A100 are. The board, and the
    bracket's keyed side, are at the top (small y), which is where the DisplayPorts
    are.
  body: >-
    the board, its edge and the pads follow PCIe CEM 5.0 (figures 6-5 and 11-3, as
    nvidia/mcx755106-fh@1 has them): the card height 111.15, the lower edge 13.25
    above the finger datum W and the key datum 57.15 behind the bracket, so the top
    edge is at x 126.31. NVIDIA prints no figure for this card. The broad-side
    photograph agrees on the height (251 px at 2.564 px/mm, 97.9). The photograph's
    gold run reads 49.4 to 130.9 behind the bracket's outer face against CEM's 45.35
    to 128.95 (a perspective of the pad end, as on the RTX A6000): the body keeps CEM's.
    The lower edge has a notch at 140.8 to 159.0 behind the bracket, 3.9 deep (10 px
    at 2.564 px/mm; the shroud's lower edge is row 488 and the notch's floor row 478):
    it is drawn as one box 18.2 long.
  body-shroud: >-
    photo-measured - the shroud is matte near-black, one slab from the board's
    component face (y 6.01) to the far face (40.0), the outline of the board, split
    at the notch as the board is. The broad side has a gentle light-to-dark shading
    toward the fan end; it is painted, not drawn as a change of height.
  body-backplate: >-
    photo-measured - the back photograph shows a flat matte black plate over the
    board's whole rear, on the board's outline, with ten small screws: four on the
    lower edge's side (x 32.1) at 17.7, 49.5, 136.1 and 246.6 behind the bracket's
    outer face, four on the top edge's side (x 122.0) at 5.1, 49.5, 136.1 and 246.6,
    and two on the far edge at x 55.0 and 99.6, 3.7 from the end, and three on the
    blower's round cover. It has an opening over the blower: a ring 72.6 across
    (186 px) centred 216.9 behind the bracket (49.8 from the far end) at x 77.8, whose
    blades show as a C round a round hub 41.2 across on the ring's centre, the blade
    zone 20.6 to 33.4 from the centre with round ends, closed by the plate over the
    sector between its ends. The pose is set by 7-rtx-pro-5000-back.jpg turned
    bracket-down (a turn, not a mirror): the C runs from the lower right round the
    bottom and the lower edge's side to the far end, and the plate closes the far-end
    and top-edge side. The outline of the C and its ends is ESTIMATED, read off the
    photograph by eye. Its thickness is the CEM rear envelope's 2.67, estimated.
    The photograph also shows a small connector-like notch at the far end near the
    top edge and two tiny printed corner marks by the bracket end; none is drawn.
  body-fan: >-
    photo-measured - the blower's opening on the broad side. In PNY's side photograph
    (720 x 326 px) its outer ring is 190 px across, centred at px (629.3, 361.4). At
    2.590 px/mm along the card and 2.564 across, the ring is 73.7 across, its centre
    50.1 from the far end and 48.1 below the top edge. The grey hub (brushed in
    concentric rings) is 91 px, 35.2 across, in a dark cavity about 50 across, and
    the pale blades run from radius 27 to 33. About 14 are counted in a quarter of
    the ring, so 56 are drawn, their lean schematic. Painted on the broad side, not
    an opening in the 3D body.
  body-top-edge: >-
    estimated - PNY's 3/4 view from above shows the top edge dark with a champagne
    strip of ridges (the heat sink's top) along most of its length, narrowing and
    bending toward the board side at the blower, a flat dark lid on the far side of
    it near the bracket, two small gold lines of model name at the bracket end and
    the maker's mark at the far end. It is a 3/4 view and cannot be scaled, so every
    place here is estimated: the strip from 13 to 232 behind the bracket and 14.0 to
    32.0 across the card, its bay from 150 to 223 behind it, the lid from 12 to 64
    behind it and 33.0 to 38.6 across, "RTX PRO 5000" at 3.0 behind the bracket, 2.4
    tall. The ridge pitch (1.2) is estimated. THE MARK IS NOT DRAWN: its box (234 to
    256 behind the bracket, 21.0 to 25.6 across) is reserved as `logo-zone` in
    `skins/body-right.svg`, estimated. The view shows no NVLink connector and no
    stereo or sync connector on this card.
  body-power-connector: >-
    estimated - the datasheet says "Power connector 1x PCIe CEM5 16-pin"; the RTX PRO
    Blackwell quick-start guide says the 16-pin PCIe Gen5 connector is "on the east
    edge" of this card and puts a 2x PCIe 8-pin to 1x PCIe Gen5 16-pin adapter in
    its box. The housing is drawn at nvidia/l40s@1's place for its 12VHPWR (104.1 to
    123.0 on the card's x, 9.1 across the board's component face), black, with twelve
    power cells in two columns of six on a 3.0 pitch and four sense cells; that is the
    L40S housing measured on a photograph of that card, and no photograph of this
    card's end is held. THE PORT is `aux-power` on the rear face (`faces.rear`,
    nvidia/rtx-pro-5000-blackwell-tail@1): std/12vhpwr-header@1, which presents
    `pcie-12vhpwr` for a 16-pin cable and which the card exports as a power port. The
    datasheet's words are CEM5, the 12VHPWR of CEM 5.0; a 2025 board may carry the
    12V-2x6 revision (CEM 5.1), which no document says, and the two take one plug.
  body-end: >-
    estimated - a closed black end plate 1.0 thick, 1.4 inside the card's length, and
    the connector housing standing 0.2 proud of it, as nvidia/rtx-a6000@1 has it. No
    photograph shows the end.
  body-foot: >-
    estimated - the bracket's two retention tabs below the card are the face's
    (`skins/default.svg`), 0.9 thick.
  power: >-
    datasheet - total board power 300 W in both datasheets and the PNY line card
    ("300W Active"). The sources agree. DA-07261 does not list this card.
  memory: >-
    datasheet - 48 GB or 72 GB GDDR7 with ECC, 1,344 GB/s. THE BUS WIDTH IS A CONFLICT:
    the 2026 datasheet (5488550) says 384-bit and the GTC 2025 print (3658700) says
    512-bit. 384-bit is used: 384 bits at 28 Gbps is 1,344 GB/s, the figure both
    print, and 512 bits would be 1,792.
  pcie: >-
    datasheet - PCIe 5.0 x16.
  nvlink: >-
    datasheet - neither datasheet lists NVLink and the card's top edge in PNY's 3/4 view
    shows no connector for one. The attr says `none listed`.
  part-numbers: >-
    datasheet - PNY's line card (REV. 09.14.26): "NVIDIA RTX PRO 5000 Blackwell
    VCNRTXPRO5000B-PB VCNRTXPRO5000B-BLK 900-5G153-2250-000, 48GB" and "NVIDIA RTX PRO
    5000 72GB Blackwell VCNRTXPRO5000B72-PB VCNRTXPRO5000B72-BLK 900-5G153-2270-000,
    72GB". NVIDIA's own datasheet gives none.
  weight: >-
    not stated - no datasheet held gives a weight for the card.
  lifecycle: >-
    PNY's line card of September 2026 lists both cards as current parts and no
    end-of-life notice was found in the documents held. The attr says `none-announced`.
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) a straight-on view of the top edge and the far end
    (needs-photo; the top edge's strip is estimated from a 3/4 view and the end is a
    schematic); (2) the DisplayPort part and interface, which the library lacks (the
    four are painted, not seated); (3) the thickness, which no source states
    (vendor-silent); (4) the connector's own photograph and whether it is 12VHPWR or
    12V-2x6 (the housing is the L40S's); (5) a weight (vendor-silent in the documents
    held); (6) no dimensioned drawing of any active workstation card (the intake's
    handoff list, item 1); (7) the power guide DA-07261 stops at the Ada generation,
    so the connector rests on the quick-start guide; (8) the bus width, on which two
    datasheets disagree (settled above).
