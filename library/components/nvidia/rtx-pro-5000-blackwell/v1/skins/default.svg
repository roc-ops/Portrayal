<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="41.91mm" viewBox="0 0 120.02 41.91">
  <!-- nvidia/rtx-pro-5000-blackwell: the RTX PRO 5000 Blackwell dual-slot bracket,
       seen from OUTSIDE the chassis, drawn from the facts in the contract's
       provenance (a straight-on photograph of the bracket, scaled with the plate's
       own length along and the two retention tabs across). TIP AT THE LEFT, flange
       end at the right, the board's side at the top, as std/pcie-bracket-fh@2 is
       drawn: the photograph is turned a quarter turn into this frame. A silver
       plate with four DisplayPort receptacles along the board's side and a framed
       field of eleven vent slots beside them between two windows and four Torx
       screws. Nothing is traced. -->
  <path id="plate" d="M1.9 7.52 L7.0 7.52 L9.1 5.52 L20.7 5.52 L21.6 4.31 L119.2 4.31 L119.2 0.3 L120.02 0.3 L120.02 40.9 L119.2 40.9 L119.2 40.85 L21.6 40.85 L20.7 40.19 L9.5 40.19 L7.0 37.73 L1.9 37.73 A1.9 1.9 0 0 1 0 35.83 L0 29.74 A1.9 1.9 0 0 1 1.9 27.84 L7.0 27.84 L10.95 24.3 A2.4 2.4 0 0 0 10.95 20.9 L7.0 17.41 L1.9 17.41 A1.9 1.9 0 0 1 0 15.51 L0 9.42 A1.9 1.9 0 0 1 1.9 7.52 Z" fill="#aeb0b2" stroke="#5f666d" stroke-width="0.4" stroke-linejoin="round"/>
  <!-- the fold: the flange turns 90 degrees here. On an elevation it is a line. -->
  <path id="flange-fold" d="M119.6 0.6 V40.6" stroke="#5f666d" stroke-width="0.3" fill="none"/>
  <!-- the four DisplayPort receptacles: an 18.4 x 7.5 shell with the D shape's
       chamfer at the flange end on the board's side, a dark opening and two rows
       of pins. Each is drawn once at its own place; the library has no
       DisplayPort part. Centres 103.8, 82.9, 62.1 and 41.2 along the bracket. -->
  <g id="display-port-1" transform="translate(94.6 5.7)">
    <path d="M0.8 0 L14.7 0 L18.4 3.7 L18.4 6.7 A0.8 0.8 0 0 1 17.6 7.5 L0.8 7.5 A0.8 0.8 0 0 1 0 6.7 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#d0d2d4" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M1.0 1.0 L14.2 1.0 L17.4 4.2 L17.4 6.5 L1.0 6.5 Z" fill="#18191b"/>
    <path d="M2.8 2.5 H12.8 M2.8 4.7 H15.4" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-2" transform="translate(73.73 5.7)">
    <path d="M0.8 0 L14.7 0 L18.4 3.7 L18.4 6.7 A0.8 0.8 0 0 1 17.6 7.5 L0.8 7.5 A0.8 0.8 0 0 1 0 6.7 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#d0d2d4" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M1.0 1.0 L14.2 1.0 L17.4 4.2 L17.4 6.5 L1.0 6.5 Z" fill="#18191b"/>
    <path d="M2.8 2.5 H12.8 M2.8 4.7 H15.4" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-3" transform="translate(52.86 5.7)">
    <path d="M0.8 0 L14.7 0 L18.4 3.7 L18.4 6.7 A0.8 0.8 0 0 1 17.6 7.5 L0.8 7.5 A0.8 0.8 0 0 1 0 6.7 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#d0d2d4" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M1.0 1.0 L14.2 1.0 L17.4 4.2 L17.4 6.5 L1.0 6.5 Z" fill="#18191b"/>
    <path d="M2.8 2.5 H12.8 M2.8 4.7 H15.4" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-4" transform="translate(32.0 5.7)">
    <path d="M0.8 0 L14.7 0 L18.4 3.7 L18.4 6.7 A0.8 0.8 0 0 1 17.6 7.5 L0.8 7.5 A0.8 0.8 0 0 1 0 6.7 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#d0d2d4" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M1.0 1.0 L14.2 1.0 L17.4 4.2 L17.4 6.5 L1.0 6.5 Z" fill="#18191b"/>
    <path d="M2.8 2.5 H12.8 M2.8 4.7 H15.4" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <!-- the field's raised frame, a painted line: 86.9 long and 23.8 across -->
  <rect id="frame" x="29.6" y="14.9" width="86.9" height="23.8" rx="2.4" fill="none" stroke="#e1e3e5" stroke-width="0.5"/>
  <rect x="29.3" y="14.6" width="87.5" height="24.4" rx="2.6" fill="none" stroke="#7b7f83" stroke-width="0.3"/>
  <!-- the two windows between the screws, 11.8 across and 4.9 along -->
  <rect id="window-1" x="110.6" y="20.8" width="4.9" height="11.8" rx="0.9" fill="#101112"/>
  <rect id="window-2" x="30.4" y="20.8" width="4.9" height="11.8" rx="0.9" fill="#101112"/>
  <!-- the vent: eleven slots 5.7 along and 22.7 across on a 6.73 pitch, from x
       36.6 to 109.6 -->
  <g id="vent" fill="#101112">
    <rect x="103.9" y="15.4" width="5.7" height="22.7" rx="0.6"/>
    <rect x="97.17" y="15.4" width="5.7" height="22.7" rx="0.6"/>
    <rect x="90.44" y="15.4" width="5.7" height="22.7" rx="0.6"/>
    <rect x="83.71" y="15.4" width="5.7" height="22.7" rx="0.6"/>
    <rect x="76.98" y="15.4" width="5.7" height="22.7" rx="0.6"/>
    <rect x="70.25" y="15.4" width="5.7" height="22.7" rx="0.6"/>
    <rect x="63.52" y="15.4" width="5.7" height="22.7" rx="0.6"/>
    <rect x="56.79" y="15.4" width="5.7" height="22.7" rx="0.6"/>
    <rect x="50.06" y="15.4" width="5.7" height="22.7" rx="0.6"/>
    <rect x="43.33" y="15.4" width="5.7" height="22.7" rx="0.6"/>
    <rect x="36.6" y="15.4" width="5.7" height="22.7" rx="0.6"/>
  </g>
  <g id="screws">
    <g id="screw-1"><circle cx="113.7" cy="17.85" r="2.2" fill="#7b7f83" stroke="#33363a" stroke-width="0.3"/><circle cx="113.7" cy="17.85" r="0.9" fill="#2b2d30"/></g>
    <g id="screw-2"><circle cx="113.7" cy="35.6" r="2.2" fill="#7b7f83" stroke="#33363a" stroke-width="0.3"/><circle cx="113.7" cy="35.6" r="0.9" fill="#2b2d30"/></g>
    <g id="screw-3"><circle cx="32.7" cy="17.85" r="2.2" fill="#7b7f83" stroke="#33363a" stroke-width="0.3"/><circle cx="32.7" cy="17.85" r="0.9" fill="#2b2d30"/></g>
    <g id="screw-4"><circle cx="32.7" cy="35.6" r="2.2" fill="#7b7f83" stroke="#33363a" stroke-width="0.3"/><circle cx="32.7" cy="35.6" r="0.9" fill="#2b2d30"/></g>
  </g>
  <!-- the port numbers printed beside the receptacles, turned a quarter: the
       photograph reads them upright -->
  <g id="silkscreen">
    <text x="113.8" y="6.0" transform="rotate(90 113.8 6.0)" text-anchor="middle" font-family="sans-serif" font-size="2.0" fill="#7a7d81">1</text>
    <text x="92.93" y="6.0" transform="rotate(90 92.93 6.0)" text-anchor="middle" font-family="sans-serif" font-size="2.0" fill="#7a7d81">2</text>
    <text x="72.06" y="6.0" transform="rotate(90 72.06 6.0)" text-anchor="middle" font-family="sans-serif" font-size="2.0" fill="#7a7d81">3</text>
    <text x="51.19" y="6.0" transform="rotate(90 51.19 6.0)" text-anchor="middle" font-family="sans-serif" font-size="2.0" fill="#7a7d81">4</text>
  </g>
</svg>
