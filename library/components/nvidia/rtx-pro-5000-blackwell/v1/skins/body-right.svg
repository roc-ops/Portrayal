<svg xmlns="http://www.w3.org/2000/svg" width="265.8mm" height="38.23mm" viewBox="0.9 1.77 265.8 38.23">
  <!-- nvidia/rtx-pro-5000-blackwell: THE TOP EDGE, the body's right side seen
       from outside. Across: mm behind the bracket's outer face (0.9 to 266.7, the
       shroud's length). Down: the face's y (1.77 the backplate's outer face, 4.44
       the board's outer face, 40.0 the shroud's). Every piece whose right side is
       the card's top edge `shows: [right]` and carries its patch of this. The
       champagne strip is the heat sink's ridged top, with a flat dark lid on the
       far side of it near the bracket; their places are read off PNY's 3/4 view
       from above and are estimated (provenance body-top-edge). The stereo and
       sync connectors the same view shows near the bracket are not drawn. -->
  <defs>
    <pattern id="ridges" patternUnits="userSpaceOnUse" x="0.9" y="14" width="1.2" height="20">
      <rect x="0" y="0" width="1.2" height="20" fill="#c7b88f"/>
      <rect x="0.8" y="0" width="0.4" height="20" fill="#8c7f5b"/>
    </pattern>
  </defs>
  <!-- the backplate's edge, the board's edge and the dark shroud -->
  <rect x="0.9" y="1.77" width="265.8" height="2.67" fill="#232325"/>
  <rect x="0.9" y="4.44" width="265.8" height="1.57" fill="#1d2420"/>
  <rect x="0.9" y="6.01" width="265.8" height="33.99" fill="#1d1d1f"/>
  <!-- the heat sink's ridged strip, with a bay at the blower -->
  <path id="ridge-strip" d="M13 14 L150 14 C157 14 159 22 166 22 L214 22 C221 22 223 14 230 14 L232 14 L232 32 L13 32 Z" fill="url(#ridges)"/>
  <!-- the flat lid on the far side of the strip -->
  <rect id="lid" x="12.0" y="33.0" width="52.0" height="5.6" rx="0.6" fill="#252628" stroke="#3a3b3e" stroke-width="0.3"/>
  <!-- the mark is reserved, not drawn (L172) -->
  <rect id="logo-zone" x="234.0" y="21.0" width="22.0" height="4.6" fill="none"/>
  <g id="silkscreen">
    <text x="3.0" y="11.5" font-family="Arial" font-weight="bold" font-size="2.4" fill="#a89a74">RTX PRO 5000</text>
  </g>
</svg>
