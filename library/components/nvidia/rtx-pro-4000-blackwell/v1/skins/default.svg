<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="21.59mm" viewBox="0 0 120.02 21.59">
  <!-- nvidia/rtx-pro-4000-blackwell: the RTX PRO 4000 Blackwell on its full-height
       bracket. The outline, tip and keyed flange are std/pcie-bracket-fh@2,
       composed BEHIND this; what is drawn here is the punched plate: four
       DisplayPort receptacles along the board's side, a column of 18 square vent
       holes beside them and a Torx screw at each end of it. TIP AT THE LEFT, flange
       end at the right, the board's side at the top: the photograph (tip at the
       bottom) is turned a quarter into this frame. Every place is read on the
       photograph (provenance face-grille); nothing is traced. -->
  <rect id="plate" x="19.6" y="6.0" width="90.6" height="12.8" fill="#9aa1a8"/>
  <!-- the four DisplayPort receptacles: an 18.4 x 7.1 shell with the D shape's
       chamfer at the flange end on the board's side, a dark opening and two rows
       of pins. Each is drawn once at its own place; the library has no
       DisplayPort part. Centres 104.8, 83.7, 62.6 and 41.5 along the bracket. -->
  <g id="display-port-1" transform="translate(95.6 5.5)">
    <path d="M0.8 0 L14.7 0 L18.4 3.7 L18.4 6.3 A0.8 0.8 0 0 1 17.6 7.1 L0.8 7.1 A0.8 0.8 0 0 1 0 6.3 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#d0d2d4" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M1.0 1.0 L14.2 1.0 L17.4 4.2 L17.4 6.1 L1.0 6.1 Z" fill="#18191b"/>
    <path d="M2.8 2.4 H12.8 M2.8 4.4 H15.4" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-2" transform="translate(74.5 5.5)">
    <path d="M0.8 0 L14.7 0 L18.4 3.7 L18.4 6.3 A0.8 0.8 0 0 1 17.6 7.1 L0.8 7.1 A0.8 0.8 0 0 1 0 6.3 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#d0d2d4" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M1.0 1.0 L14.2 1.0 L17.4 4.2 L17.4 6.1 L1.0 6.1 Z" fill="#18191b"/>
    <path d="M2.8 2.4 H12.8 M2.8 4.4 H15.4" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-3" transform="translate(53.4 5.5)">
    <path d="M0.8 0 L14.7 0 L18.4 3.7 L18.4 6.3 A0.8 0.8 0 0 1 17.6 7.1 L0.8 7.1 A0.8 0.8 0 0 1 0 6.3 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#d0d2d4" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M1.0 1.0 L14.2 1.0 L17.4 4.2 L17.4 6.1 L1.0 6.1 Z" fill="#18191b"/>
    <path d="M2.8 2.4 H12.8 M2.8 4.4 H15.4" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-4" transform="translate(32.3 5.5)">
    <path d="M0.8 0 L14.7 0 L18.4 3.7 L18.4 6.3 A0.8 0.8 0 0 1 17.6 7.1 L0.8 7.1 A0.8 0.8 0 0 1 0 6.3 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#d0d2d4" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M1.0 1.0 L14.2 1.0 L17.4 4.2 L17.4 6.1 L1.0 6.1 Z" fill="#18191b"/>
    <path d="M2.8 2.4 H12.8 M2.8 4.4 H15.4" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <!-- the vent column: 18 holes 3.0 along and 3.1 across on a 4.365 pitch, from
       x 35.3 to 112.5 -->
  <g id="vent" fill="#101112">
    <rect x="109.5" y="15.0" width="3.0" height="3.1"/>
    <rect x="105.14" y="15.0" width="3.0" height="3.1"/>
    <rect x="100.77" y="15.0" width="3.0" height="3.1"/>
    <rect x="96.41" y="15.0" width="3.0" height="3.1"/>
    <rect x="92.04" y="15.0" width="3.0" height="3.1"/>
    <rect x="87.68" y="15.0" width="3.0" height="3.1"/>
    <rect x="83.31" y="15.0" width="3.0" height="3.1"/>
    <rect x="78.95" y="15.0" width="3.0" height="3.1"/>
    <rect x="74.58" y="15.0" width="3.0" height="3.1"/>
    <rect x="70.22" y="15.0" width="3.0" height="3.1"/>
    <rect x="65.85" y="15.0" width="3.0" height="3.1"/>
    <rect x="61.49" y="15.0" width="3.0" height="3.1"/>
    <rect x="57.12" y="15.0" width="3.0" height="3.1"/>
    <rect x="52.76" y="15.0" width="3.0" height="3.1"/>
    <rect x="48.39" y="15.0" width="3.0" height="3.1"/>
    <rect x="44.03" y="15.0" width="3.0" height="3.1"/>
    <rect x="39.66" y="15.0" width="3.0" height="3.1"/>
    <rect x="35.3" y="15.0" width="3.0" height="3.1"/>
  </g>
  <g id="screws">
    <g id="screw-1"><circle cx="116.7" cy="16.2" r="2.45" fill="#8a9097" stroke="#33363a" stroke-width="0.3"/><circle cx="116.7" cy="16.2" r="0.95" fill="#2b2d30"/></g>
    <g id="screw-2"><circle cx="31.5" cy="16.2" r="2.45" fill="#8a9097" stroke="#33363a" stroke-width="0.3"/><circle cx="31.5" cy="16.2" r="0.95" fill="#2b2d30"/></g>
  </g>
  <!-- the port numbers printed above each receptacle's flange end, turned a
       quarter: the photograph reads them upright -->
  <g id="silkscreen">
    <text x="115.3" y="6.2" transform="rotate(90 115.3 6.2)" text-anchor="middle" font-family="sans-serif" font-size="2.0" fill="#6f7377">1</text>
    <text x="94.2" y="6.2" transform="rotate(90 94.2 6.2)" text-anchor="middle" font-family="sans-serif" font-size="2.0" fill="#6f7377">2</text>
    <text x="73.1" y="6.2" transform="rotate(90 73.1 6.2)" text-anchor="middle" font-family="sans-serif" font-size="2.0" fill="#6f7377">3</text>
    <text x="52.0" y="6.2" transform="rotate(90 52.0 6.2)" text-anchor="middle" font-family="sans-serif" font-size="2.0" fill="#6f7377">4</text>
  </g>
</svg>
