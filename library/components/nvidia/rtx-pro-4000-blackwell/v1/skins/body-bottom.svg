<svg xmlns="http://www.w3.org/2000/svg" width="97.9mm" height="240.4mm" viewBox="-6.29 0 97.9 240.4">
  <!-- nvidia/rtx-pro-4000-blackwell: THE SHROUD'S BROAD SIDE, the body's bottom
       side seen from outside. Across: 120.02 (the face's width) less the face's
       x, so the card's top edge is at -6.29 and its lower edge at 91.61. Down:
       241.3 less mm behind the bracket's outer face, so the far end is at the top
       and the bracket's end at the bottom. Dark grey, lighter toward the top edge,
       with 25 long vent slits near the bracket (PNY's side photograph,
       provenance body-slits) and the blower's opening: a ring 59.1 across centred
       47.2 from the far end and 45.4 below the top edge (provenance body-fan), a
       flat hub and 72 swept blades. Drawn in-house; nothing is traced. -->
  <defs>
    <linearGradient id="matte" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a4a4b"/>
      <stop offset="0.5" stop-color="#323233"/>
      <stop offset="1" stop-color="#242425"/>
    </linearGradient>
    <!-- one slit 1.0 across on a 3.68 pitch, 38.6 long -->
    <pattern id="slit" patternUnits="userSpaceOnUse" x="-2.19" y="192.5" width="3.68" height="38.6">
      <rect x="0" y="0" width="1.0" height="38.6" fill="#050506"/>
    </pattern>
  </defs>
  <rect x="-6.29" y="0" width="97.9" height="240.4" fill="url(#matte)"/>
