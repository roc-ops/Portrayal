    <use href="#blade" transform="rotate(353.21)"/>
  </g>
  <circle id="fan-hub" cx="24.04" cy="26.26" r="9.5" fill="#2c2c2d"/>
  <circle id="fan-hub-rim" cx="24.04" cy="26.26" r="8.7" fill="none" stroke="#8c8c8c" stroke-width="0.8"/>
  <circle id="fan-hub-face" cx="24.04" cy="26.26" r="7.5" fill="#535353"/>
</svg>
