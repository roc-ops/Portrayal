<svg xmlns="http://www.w3.org/2000/svg" width="56.6mm" height="161.66mm" viewBox="-0.4 0 56.6 161.66">
  <!-- nvidia/rtx-a1000: THE CARD'S BROAD SIDE, the body's bottom side seen from
       outside. Across: 79.2 (the face's width) less the face's x, so the shroud's
       top edge is at -0.4 and its lower edge at 56.2. Down: 162.56 less mm behind
       the bracket's outer face, so the far end is at the top and the board's start
       (0.9 behind the bracket) at the bottom. The board is bare for its first 44.3:
       four connector bodies, three capacitors, power stages and chokes, in the
       places PNY's straight-on broad-side photograph puts them (4.014 px/mm); the
       shroud follows, dark, lighter toward the far end, with the blower's opening: a
       groove, a bright rim, 53 long curved blades, a dark floor and a hub with its
       own bright rim. The ring is centred 26.3 from the far end and 24.4 below the
       top edge (provenance body-fan). Drawn in-house; nothing is traced. -->
  <defs>
    <linearGradient id="matte" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1d1d1d"/>
      <stop offset="0.24" stop-color="#1f1f1f"/>
      <stop offset="0.36" stop-color="#242424"/>
      <stop offset="0.49" stop-color="#313131"/>
      <stop offset="0.56" stop-color="#393939"/>
      <stop offset="0.74" stop-color="#464646"/>
      <stop offset="1" stop-color="#505050"/>
    </linearGradient>
    <!-- one blade, at the top of the ring (centre at 0 0): from r 10.0 to r 16.4,
         curving 28 degrees counter-clockwise on the way out, steeply at first and
         then straighter (the photograph's phase against radius) -->
    <path id="blade" d="M0 -9.97 L-0.974 -10.92 L-2.262 -11.74 L-3.7 -12.41 L-5.406 -12.86 L-6.554 -13.44 L-7.385 -14.13 L-7.742 -14.5" fill="none" stroke="#bdbdbd" stroke-width="0.32" stroke-linejoin="round"/>
    <g id="cap">
      <circle r="3.3" fill="#34363a"/>
      <circle r="2.7" fill="#d0d3d6"/>
      <path d="M-2.3 1.0 A2.7 2.7 0 0 0 2.3 1.0" stroke="#4a90d9" stroke-width="0.7" fill="none"/>
    </g>
  </defs>
  <!-- the board's component side, and the shroud over its last 118.26 -->
  <rect x="-0.4" y="0" width="56.6" height="161.66" fill="#14171a"/>
  <rect x="-0.4" y="0" width="56.6" height="118.26" fill="url(#matte)"/>
  <!-- the board's parts, in the 44.3 the shroud leaves bare -->
  <g id="board-parts">
    <g fill="#9da0a4" stroke="#55585c" stroke-width="0.2">
      <rect x="7.15" y="148.56" width="9.1" height="13.1"/>
      <rect x="19.45" y="148.56" width="9.1" height="13.1"/>
      <rect x="32.05" y="148.56" width="9.1" height="13.1"/>
      <rect x="44.55" y="148.56" width="9.1" height="13.1"/>
    </g>
    <g fill="#2a2c2f">
      <rect x="8.0" y="150.0" width="7.4" height="8.4"/>
      <rect x="20.3" y="150.0" width="7.4" height="8.4"/>
      <rect x="32.9" y="150.0" width="7.4" height="8.4"/>
      <rect x="45.4" y="150.0" width="7.4" height="8.4"/>
    </g>
    <use href="#cap" x="6.2" y="138.0"/>
    <use href="#cap" x="20.1" y="143.3"/>
    <use href="#cap" x="35.2" y="143.3"/>
    <g fill="#1a1c1f" stroke="#2b2e32" stroke-width="0.2">
      <rect x="13.0" y="131.4" width="6.2" height="6.2"/>
      <rect x="11.4" y="124.8" width="6.2" height="6.2"/>
      <rect x="11.4" y="118.7" width="6.2" height="6.2"/>
      <rect x="20.5" y="131.0" width="6.2" height="6.2"/>
      <rect x="28.0" y="131.0" width="6.2" height="6.2"/>
      <rect x="34.2" y="131.0" width="6.2" height="6.2"/>
    </g>
    <g fill="#3a3b3e" stroke="#202123" stroke-width="0.25">
      <rect x="19.05" y="120.45" width="8.3" height="8.3"/>
      <rect x="29.45" y="120.45" width="8.3" height="8.3"/>
    </g>
    <circle cx="46.9" cy="134.9" r="3.7" fill="#4a4b4e" stroke="#2a2b2d" stroke-width="0.25"/>
    <rect x="42.05" y="121.45" width="3.7" height="3.7" fill="#1b1d20"/>
  </g>
  <!-- the blower -->
  <circle id="fan-groove" cx="24.04" cy="26.26" r="19.3" fill="#444445" stroke="#0f0f10" stroke-width="0.8"/>
  <circle id="fan-rim" cx="24.04" cy="26.26" r="17.1" fill="#151516" stroke="#8a8a8a" stroke-width="0.5"/>
  <g id="blades" transform="translate(24.04 26.26)">
