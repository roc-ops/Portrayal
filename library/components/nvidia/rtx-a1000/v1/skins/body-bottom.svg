    <use href="#blade" transform="rotate(115.47)"/>
    <use href="#blade" transform="rotate(122.26)"/>
    <use href="#blade" transform="rotate(129.06)"/>
    <use href="#blade" transform="rotate(135.85)"/>
    <use href="#blade" transform="rotate(142.64)"/>
