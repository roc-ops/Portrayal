<svg xmlns="http://www.w3.org/2000/svg" width="79.2mm" height="18.42mm" viewBox="0 0 79.2 18.42">
  <!-- nvidia/rtx-a1000: the RTX A1000 on its low profile bracket. The outline, tip
       and flange are std/pcie-bracket-lp@1, composed BEHIND this; what is drawn
       here is the punched plate: four mini DisplayPort receptacles along the board's
       side, a latch slot on the far side of each, a small square between each pair,
       and the port numbers 1 to 4 printed beside them. TIP AT THE LEFT, the board's
       side at the top, as the standard part is drawn. Measured on PNY's straight-on
       bracket photograph, 0.1111 mm per pixel, turned a quarter into this frame
       (provenance face-displayports). Nothing is traced. -->
  <rect id="plate" x="15.33" y="2.88" width="55.13" height="12.66" fill="#9aa1a8"/>
  <!-- the four latch slots (5.7 x 1.9) and the three small squares between them -->
  <g id="latches" fill="#101012">
    <rect x="64.65" y="11.05" width="5.7" height="1.9" rx="0.4"/>
    <rect x="52.35" y="11.05" width="5.7" height="1.9" rx="0.4"/>
    <rect x="39.75" y="11.05" width="5.7" height="1.9" rx="0.4"/>
    <rect x="27.25" y="11.05" width="5.7" height="1.9" rx="0.4"/>
    <rect x="60.35" y="11.05" width="1.7" height="1.9" rx="0.3"/>
    <rect x="47.95" y="11.05" width="1.7" height="1.9" rx="0.3"/>
    <rect x="35.55" y="11.05" width="1.7" height="1.9" rx="0.3"/>
  </g>
  <!-- the four mini DisplayPort receptacles: an 8.9 x 6.3 shell, a dark opening with
       its two corners cut on the far side, and the blue tongue. Each is drawn once
       at its own place; the library has no mini DisplayPort part. -->
  <g id="display-port-1">
    <rect x="63.05" y="3.8" width="8.9" height="6.3" rx="1.3" fill="#c4c7ca" stroke="#6b6f73" stroke-width="0.25"/>
    <path d="M64.05 4.6 H70.95 V8.1 L69.75 9.3 H65.25 L64.05 8.1 Z" fill="#17181a"/>
    <rect x="64.5" y="5.3" width="6.0" height="1.4" fill="#8fb4e0"/>
  </g>
  <g id="display-port-2">
    <rect x="50.75" y="3.8" width="8.9" height="6.3" rx="1.3" fill="#c4c7ca" stroke="#6b6f73" stroke-width="0.25"/>
    <path d="M51.75 4.6 H58.65 V8.1 L57.45 9.3 H52.95 L51.75 8.1 Z" fill="#17181a"/>
    <rect x="52.2" y="5.3" width="6.0" height="1.4" fill="#8fb4e0"/>
  </g>
  <g id="display-port-3">
    <rect x="38.15" y="3.8" width="8.9" height="6.3" rx="1.3" fill="#c4c7ca" stroke="#6b6f73" stroke-width="0.25"/>
    <path d="M39.15 4.6 H46.05 V8.1 L44.85 9.3 H40.35 L39.15 8.1 Z" fill="#17181a"/>
    <rect x="39.6" y="5.3" width="6.0" height="1.4" fill="#8fb4e0"/>
  </g>
  <g id="display-port-4">
    <rect x="25.65" y="3.8" width="8.9" height="6.3" rx="1.3" fill="#c4c7ca" stroke="#6b6f73" stroke-width="0.25"/>
    <path d="M26.65 4.6 H33.55 V8.1 L32.35 9.3 H27.85 L26.65 8.1 Z" fill="#17181a"/>
    <rect x="27.1" y="5.3" width="6.0" height="1.4" fill="#8fb4e0"/>
  </g>
  <!-- the port numbers, printed on the tip side of each receptacle -->
  <g id="silkscreen" font-family="sans-serif" font-size="2.9" fill="#ececec" text-anchor="middle">
    <text x="61.3" y="10.05">1</text>
    <text x="49.0" y="10.05">2</text>
    <text x="36.4" y="10.05">3</text>
    <text x="23.9" y="10.05">4</text>
  </g>
</svg>
