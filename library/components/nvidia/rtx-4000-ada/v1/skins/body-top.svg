    <circle cx="31.8" cy="19.5" r="1.7"/>
    <circle cx="31.8" cy="118.5" r="1.7"/>
    <circle cx="31.8" cy="170.9" r="1.7"/>
    <circle cx="31.8" cy="223.2" r="1.7"/>
    <circle cx="100.3" cy="4.2" r="1.7"/>
