<svg xmlns="http://www.w3.org/2000/svg" width="97.9mm" height="240.3mm" viewBox="28.41 0 97.9 240.3">
  <!-- nvidia/rtx-4000-ada: THE BACKPLATE, the body's top side seen from outside
       (from the board's rear). Across: the face's x, the lower edge at 28.41 and
       the top edge at 126.31. Down: 241.3 less mm behind the bracket's outer face,
       so the far end is at the top and the bracket's end at the bottom. A matte
       black plate with ten small screws and, near the far end, the blower's
       intake: a ring 59.4 across with a crescent of curved blades seen through it
       and three screws on its hub (PNY's back photograph at 2.94 px/mm,
       provenance body-backplate). Drawn in-house; nothing is traced. -->
  <defs>
    <linearGradient id="plate-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2c"/>
      <stop offset="1" stop-color="#1d1d1f"/>
    </linearGradient>
  </defs>
  <rect x="28.41" y="0" width="97.9" height="240.3" fill="url(#plate-shade)"/>
  <circle id="intake-ring" cx="80.4" cy="48.25" r="29.7" fill="none" stroke="#111112" stroke-width="1.0"/>
  <path id="intake-crescent" d="M105.9 53.25 A26 26 0 1 1 84.9 22.65 L83.1 32.75 A15.7 15.7 0 1 0 95.8 51.25 Z" fill="#0a0a0b" stroke="#303033" stroke-width="0.3"/>
  <g id="backplate-screws" fill="#0c0c0d" stroke="#3f3f42" stroke-width="0.3">
    <circle cx="122.0" cy="19.5" r="1.7"/>
    <circle cx="122.0" cy="118.5" r="1.7"/>
