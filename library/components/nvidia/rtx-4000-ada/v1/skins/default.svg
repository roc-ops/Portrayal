<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="21.59mm" viewBox="0 0 120.02 21.59">
  <!-- nvidia/rtx-4000-ada: the RTX 4000 Ada on its full-height bracket. The outline,
       tip and keyed flange are std/pcie-bracket-fh@2, composed BEHIND this; what
       is drawn here is the punched plate: four DisplayPort receptacles along the
       board's side, a column of 16 square vent holes beside them and a Torx screw
       at each end of it. TIP AT THE LEFT, flange end at the right, the board's
       side at the top: the photograph (tip at the bottom) is turned a quarter
       into this frame. Every place is read on the photograph (provenance
       face-grille); nothing is traced. -->
  <rect id="plate" x="11.38" y="3.17" width="102.9" height="18.42" fill="#999898"/>
  <!-- the photograph's plate is bright from y 4.6 to 19.7 and darker beyond, at
       its two long edges -->
  <rect x="11.38" y="3.17" width="102.9" height="1.43" fill="#5c5c5b"/>
  <rect x="11.38" y="19.71" width="102.9" height="1.88" fill="#5c5c5b"/>
  <!-- the four DisplayPort receptacles: a 17.6 x 6.8 shell with the D shape's
       chamfer at the flange end, a dark opening and two rows of pins. Each is
       drawn once at its own place; the library has no DisplayPort part. Centres
       40.16, 61.70, 82.34 and 102.87 along the bracket. -->
  <g id="display-port-4" transform="translate(31.36 6.18)">
    <path d="M0.8 0 L16.8 0 A0.8 0.8 0 0 1 17.6 0.8 L17.6 3.5 L14.3 6.8 L0.8 6.8 A0.8 0.8 0 0 1 0 6.0 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#c4c4c3" stroke="#555453" stroke-width="0.3"/>
    <path d="M1.0 0.9 L16.6 0.9 L16.6 3.3 L13.9 5.9 L1.0 5.9 Z" fill="#141516"/>
    <path d="M2.4 2.1 H15.2 M2.4 3.9 H13.0" stroke="#7d8288" stroke-width="0.65" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-3" transform="translate(52.90 6.18)">
    <path d="M0.8 0 L16.8 0 A0.8 0.8 0 0 1 17.6 0.8 L17.6 3.5 L14.3 6.8 L0.8 6.8 A0.8 0.8 0 0 1 0 6.0 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#c4c4c3" stroke="#555453" stroke-width="0.3"/>
    <path d="M1.0 0.9 L16.6 0.9 L16.6 3.3 L13.9 5.9 L1.0 5.9 Z" fill="#141516"/>
    <path d="M2.4 2.1 H15.2 M2.4 3.9 H13.0" stroke="#7d8288" stroke-width="0.65" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-2" transform="translate(73.54 6.18)">
    <path d="M0.8 0 L16.8 0 A0.8 0.8 0 0 1 17.6 0.8 L17.6 3.5 L14.3 6.8 L0.8 6.8 A0.8 0.8 0 0 1 0 6.0 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#c4c4c3" stroke="#555453" stroke-width="0.3"/>
    <path d="M1.0 0.9 L16.6 0.9 L16.6 3.3 L13.9 5.9 L1.0 5.9 Z" fill="#141516"/>
    <path d="M2.4 2.1 H15.2 M2.4 3.9 H13.0" stroke="#7d8288" stroke-width="0.65" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-1" transform="translate(94.07 6.18)">
    <path d="M0.8 0 L16.8 0 A0.8 0.8 0 0 1 17.6 0.8 L17.6 3.5 L14.3 6.8 L0.8 6.8 A0.8 0.8 0 0 1 0 6.0 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#c4c4c3" stroke="#555453" stroke-width="0.3"/>
    <path d="M1.0 0.9 L16.6 0.9 L16.6 3.3 L13.9 5.9 L1.0 5.9 Z" fill="#141516"/>
    <path d="M2.4 2.1 H15.2 M2.4 3.9 H13.0" stroke="#7d8288" stroke-width="0.65" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <!-- the vent column: 16 square holes 3.7 across on a 4.805 pitch along the
       bracket, centres from x 36.55 to 108.63 -->
  <g id="vent" fill="#101112">
    <rect x="34.70" y="14.70" width="3.7" height="3.7"/>
    <rect x="39.51" y="14.70" width="3.7" height="3.7"/>
    <rect x="44.31" y="14.70" width="3.7" height="3.7"/>
    <rect x="49.12" y="14.70" width="3.7" height="3.7"/>
    <rect x="53.92" y="14.70" width="3.7" height="3.7"/>
    <rect x="58.73" y="14.70" width="3.7" height="3.7"/>
    <rect x="63.53" y="14.70" width="3.7" height="3.7"/>
    <rect x="68.34" y="14.70" width="3.7" height="3.7"/>
    <rect x="73.14" y="14.70" width="3.7" height="3.7"/>
    <rect x="77.95" y="14.70" width="3.7" height="3.7"/>
    <rect x="82.75" y="14.70" width="3.7" height="3.7"/>
    <rect x="87.56" y="14.70" width="3.7" height="3.7"/>
    <rect x="92.36" y="14.70" width="3.7" height="3.7"/>
    <rect x="97.17" y="14.70" width="3.7" height="3.7"/>
    <rect x="101.97" y="14.70" width="3.7" height="3.7"/>
    <rect x="106.78" y="14.70" width="3.7" height="3.7"/>
  </g>
  <!-- the two Torx screws at the ends of the column -->
  <g id="screw-1"><circle cx="31.58" cy="16.55" r="2.05" fill="#a9a9a8" stroke="#3d3d3c" stroke-width="0.3"/><circle cx="31.58" cy="16.55" r="0.8" fill="#2a2a2a"/></g>
  <g id="screw-2"><circle cx="114.67" cy="16.55" r="2.05" fill="#a9a9a8" stroke="#3d3d3c" stroke-width="0.3"/><circle cx="114.67" cy="16.55" r="0.8" fill="#2a2a2a"/></g>
</svg>
