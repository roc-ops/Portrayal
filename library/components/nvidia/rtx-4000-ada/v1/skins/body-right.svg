<svg xmlns="http://www.w3.org/2000/svg" width="240.3mm" height="18.71mm" viewBox="1.0 1.77 240.3 18.71">
  <!-- nvidia/rtx-4000-ada: THE TOP EDGE, the body's right side seen from outside.
       Across: mm behind the bracket's outer face (1.0 to 241.3, the shroud's
       length). Down: the face's y (1.77 the backplate's outer face, 4.44 the
       board's outer face, 20.48 the shroud's). Every piece whose right side is the
       card's top edge `shows: [right]` and carries its patch of this. The edge is
       matte black with a field of fine vertical vent slits along most of it; its
       place is read off NVIDIA's render, a 3/4 view, and is estimated (provenance
       body-top-edge). The maker's mark is reserved, not drawn. -->
  <defs>
    <pattern id="slits" patternUnits="userSpaceOnUse" x="40" y="10" width="1.6" height="9.2">
      <rect x="0" y="0" width="1.6" height="9.2" fill="#242426"/>
      <rect x="0.4" y="0" width="0.8" height="9.2" fill="#090909"/>
    </pattern>
  </defs>
  <!-- the backplate's edge, the board's edge and the black shroud -->
  <rect x="1.0" y="1.77" width="240.3" height="2.67" fill="#202326"/>
  <rect x="1.0" y="4.44" width="240.3" height="1.57" fill="#1d2420"/>
  <rect x="1.0" y="6.01" width="240.3" height="14.47" fill="#1f1f21"/>
  <!-- the slit field -->
  <rect id="top-edge-slits" x="40" y="10" width="190" height="9.2" fill="url(#slits)"/>
  <!-- the mark is reserved, not drawn (L172) -->
  <rect id="logo-zone" x="207.0" y="4.7" width="22.0" height="4.6" fill="none"/>
  <g id="silkscreen">
    <text x="4.0" y="9.0" font-family="Arial" font-weight="bold" font-size="2.4" fill="#bdb8aa">RTX 4000</text>
  </g>
</svg>
