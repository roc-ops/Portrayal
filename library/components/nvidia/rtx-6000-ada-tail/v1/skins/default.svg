<svg xmlns="http://www.w3.org/2000/svg" width="97.9mm" height="35.56mm" viewBox="0 0 97.9 35.56">
  <!-- nvidia/rtx-6000-ada-tail: the RTX 6000 Ada's far end seen from behind, from
       the board's rear face (y 0) to the shroud's far wall (y 35.56). THE TOP EDGE
