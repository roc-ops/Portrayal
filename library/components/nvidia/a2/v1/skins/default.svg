<svg xmlns="http://www.w3.org/2000/svg" width="79.2mm" height="18.42mm" viewBox="0 0 79.2 18.42">
  <!-- nvidia/a2: the A2 on its low profile bracket. The outline, tip and flange
       are std/pcie-bracket-lp@1, composed BEHIND this; what is drawn here is the
       punched plate: one long vent window with the heat-sink fins behind it,
       end-on, and one screw at the tip end. TIP AT THE LEFT. The window, the
       screw and the fins' pitch are estimated from a 3/4 render (provenance
       face-window); nothing is traced. -->
  <rect id="plate" x="15.33" y="2.88" width="55.13" height="12.66" fill="#9aa1a8"/>
  <rect id="window" x="22.0" y="4.2" width="46.0" height="10.0" rx="0.8" fill="#0d0e10" stroke="#8d9399" stroke-width="0.3"/>
  <g id="fins" fill="#7b8187">
    <rect x="23.2" y="4.7" width="0.4" height="9.0"/>
    <rect x="26.1" y="4.7" width="0.4" height="9.0"/>
    <rect x="29.0" y="4.7" width="0.4" height="9.0"/>
    <rect x="31.9" y="4.7" width="0.4" height="9.0"/>
    <rect x="34.8" y="4.7" width="0.4" height="9.0"/>
    <rect x="37.7" y="4.7" width="0.4" height="9.0"/>
    <rect x="40.6" y="4.7" width="0.4" height="9.0"/>
    <rect x="43.5" y="4.7" width="0.4" height="9.0"/>
    <rect x="46.4" y="4.7" width="0.4" height="9.0"/>
    <rect x="49.3" y="4.7" width="0.4" height="9.0"/>
    <rect x="52.2" y="4.7" width="0.4" height="9.0"/>
    <rect x="55.1" y="4.7" width="0.4" height="9.0"/>
    <rect x="58.0" y="4.7" width="0.4" height="9.0"/>
    <rect x="60.9" y="4.7" width="0.4" height="9.0"/>
    <rect x="63.8" y="4.7" width="0.4" height="9.0"/>
    <rect x="66.7" y="4.7" width="0.4" height="9.0"/>
  </g>
  <g id="screw-1"><circle cx="18.7" cy="9.3" r="1.5" fill="#b9bfc5" stroke="#5f666d" stroke-width="0.25"/><circle cx="18.7" cy="9.3" r="0.55" fill="#4a4f55"/></g>
