<svg xmlns="http://www.w3.org/2000/svg" width="55.65mm" height="166.64mm" viewBox="-0.81 0 55.65 166.64">
  <!-- nvidia/a2: THE SHROUD'S BROAD SIDE, the body's bottom side seen from
       outside. Across: 79.2 (the face's width) less the face's x, so the card's
       top edge is at -0.81 and its lower edge at 54.84. Down: 167.64 less mm
       behind the bracket's outer face, so the far end is at the top and the
       shroud's front (1.0 behind the bracket) at the bottom. A matte grain along
       the card, lighter toward the far end (the A100's `body-broad-side`,
       borrowed: PNY's A2 side view shows a smooth champagne broad side). -->
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#998e7b"/>
      <stop offset="1" stop-color="#ab9f8b"/>
    </linearGradient>
    <pattern id="grain-a" patternUnits="userSpaceOnUse" x="0" y="0" width="1.3" height="166.64">
      <rect x="0.15" y="0" width="0.12" height="166.64" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="0.55" y="0" width="0.10" height="166.64" fill="#000000" fill-opacity="0.05"/>
      <rect x="0.95" y="0" width="0.14" height="166.64" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>
  <rect x="-0.81" y="0" width="55.65" height="166.64" fill="url(#shade)"/>
  <rect x="-0.81" y="0" width="55.65" height="166.64" fill="url(#grain-a)"/>
</svg>
