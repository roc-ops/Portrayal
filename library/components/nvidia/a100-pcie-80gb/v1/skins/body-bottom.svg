<svg xmlns="http://www.w3.org/2000/svg" width="97.9mm" height="267.7mm" viewBox="-6.29 0 97.9 267.7">
  <!-- nvidia/a100-pcie-80gb: THE SHROUD'S BROAD SIDE, the body's bottom side
       seen from outside. Across: 120.02 (the face's width) less the face's x,
       so the card's top edge is at -6.29 and its lower edge at 91.61. Down:
       268.6 less mm behind the bracket's outer face, so the far end is at the
       top and the bracket's end at the bottom. A matte grain along the card,
       a little lighter toward the lower edge (provenance body-broad-side). -->
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#998e7b"/>
      <stop offset="1" stop-color="#ab9f8b"/>
    </linearGradient>
    <pattern id="grain-a" patternUnits="userSpaceOnUse" x="0" y="0" width="1.3" height="267.7">
      <rect x="0.15" y="0" width="0.12" height="267.7" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="0.55" y="0" width="0.10" height="267.7" fill="#000000" fill-opacity="0.05"/>
      <rect x="0.95" y="0" width="0.14" height="267.7" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
    <pattern id="grain-b" patternUnits="userSpaceOnUse" x="0" y="0" width="1.9" height="267.7">
      <rect x="0.35" y="0" width="0.10" height="267.7" fill="#000000" fill-opacity="0.04"/>
      <rect x="1.40" y="0" width="0.12" height="267.7" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect x="-6.29" y="0" width="97.9" height="267.7" fill="url(#shade)"/>
  <rect x="-6.29" y="0" width="97.9" height="267.7" fill="url(#grain-a)"/>
  <rect x="-6.29" y="0" width="97.9" height="267.7" fill="url(#grain-b)"/>
</svg>
