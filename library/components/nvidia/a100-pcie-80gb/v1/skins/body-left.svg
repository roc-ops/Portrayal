<svg xmlns="http://www.w3.org/2000/svg" width="267.7mm" height="25.6mm" viewBox="0 14.4 267.7 25.6">
  <!-- nvidia/a100-pcie-80gb: THE SHROUD'S LOWER EDGE, the body's left side
       seen from outside. Across: 268.6 less mm behind the bracket's outer
       face, so the card's far end is at the left and the bracket's end at
       267.7. Down: the face's y, the shroud's 14.4 to 40.0. Ribbed as the top
       edge is, on the same 2.194 (provenance body-ribs). -->
  <defs>
    <pattern id="ribs" patternUnits="userSpaceOnUse" x="0" y="14.4" width="2.194" height="25.6">
      <rect x="0" y="0" width="2.194" height="25.6" fill="#c2b098"/>
      <rect x="0.25" y="0" width="0.55" height="25.6" fill="#d6c8b4"/>
      <rect x="1.80" y="0" width="0.394" height="25.6" fill="#86745f"/>
    </pattern>
  </defs>
  <rect x="0" y="14.4" width="267.7" height="25.6" fill="url(#ribs)"/>
</svg>
