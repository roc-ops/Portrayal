format: 1
kind: module
name: rtx-3080-fe
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA GeForce RTX 3080 Founders Edition, a dual-axial-fan Founders Edition
  card that is two slots wide. The bracket face carries three DisplayPort and
  one HDMI receptacle on the board's side, with four vent panes below them.
  The shroud is the X-shaped Founders Edition design. Its fan pocket is at the
  far end and its model name is printed on the other pocket. The heat sink's
  fins show along the top edge. Its power connector is a 12-pin receptacle in
  a notch in the top edge. It plugs into one riser slot and covers the one
  beside it.
slot-width: 2
size: {w: 120.02, h: 41.91, d: 285}
size-confidence: {w: registry, h: registry, d: datasheet}
unplaced: >-
  no bay in the library lists this card in `accepts`, and no bay states `interface: pcie-fh`. The card
  does not state `mates: pcie-fh`: the library has not begun that migration (spec/tests/test_cards_by_interface.py
  holds it at no part until it does). No document held says any server takes a consumer card.
attrs:
  model: 'RTX 3080'
  edition: 'Founders Edition'
  role: gpu
  form-factor: 'Full-height, two-slot, 285 mm x 112 mm'
  pcie-connector: x16
  pcie-height: full
  power-draw-max-w: 320
  power-input: 'host PCIe slot and one 12-pin auxiliary connector; an adapter from two PCIe 8-pin cables to the 12-pin plug is in the box'
  memory: '10 GB GDDR6X, 320-bit'
  display-ports: '3 x DisplayPort and 1 x HDMI on the bracket'
  cooling: active
  airflow: 'axial fan on the broad side; a flow-through heat sink exhausts through the second side and the top edge'
faces:
  rear: {ref: nvidia/rtx-3080-fe-tail@1}
  plan: {ref: common/pcie-card-plan@1}
provenance:
  slot-width: >-
    datasheet - NVIDIA's family page prints the slot figure for this card as
    2-Slot, and the guide says to remove two slot covers (the guide's figure
    and NVIDIA's compare page). The face is one plate about 41 across. The
    card declares `slot-width: 2` as docs/pcie-two-slot-bays-design.md R1
    defines it. docs/cards-by-interface-design.md (#1171) adds `mates: pcie-
    fh` for a card; the mechanism is in the tools but the library has not
    begun the migration and a test holds every part to no `mates: pcie-fh`
    yet, so this card does not state it.
  sources: >-
    NVIDIA GeForce RTX 3080 Founders Edition - NVIDIA's GeForce RTX 3080 and
    3080 Ti page, https://www.nvidia.com/en-us/geforce/graphics-
    cards/30-series/rtx-3080-3080ti/; NVIDIA GeForce RTX 3080 user guide, v03
    (raster): https://www.nvidia.com/content/geforce-
    gtx/GEFORCE_RTX_3080_USER_GUIDE_v03.pdf; NVIDIA PCI Express CEM 5.0 via
    the library's standards registry. NVIDIA's compare page,
    https://www.nvidia.com/en-us/geforce/graphics-cards/compare/ (card
    dimensions). NVIDIA's case-clearance diagram for this card (the intake's
    compguide folder: 'case-size', 'slots', and the power-connector panels).
    NVIDIA publishes no dimensioned drawing of any GeForce card. The pages and
    guides were fetched on 2026-10-07 and the figures converted on 2026-10-08.
    The pictures are NVIDIA's; their licence is not stated, so facts were read
    from them and no picture is copied.
  reference-images: >-
    photo-measured - NVIDIA's straight-on side elevation of the RTX 3080
    Founders Edition, geforce-rtx-3080-1-1920.jpg (1920 x 1080),
    https://www.nvidia.com/content/dam/en-
    zz/Solutions/geforce/ampere/rtx-3080/images/design/geforce-
    rtx-3080-1-1920.jpg. It is the card's broad side seen square on, turned
    with the bracket at the left and the gold fingers at the top (the
    library's frame is the bracket's tip at the left and the board's side at
    the top, which this picture turned by a quarter turn gives). MM PER PIXEL:
    0.2246 (4.453 px/mm), from the stated 285 mm over 1269 px, the bracket's
    outer face at px x 326.5 to the shroud's far end at 1595.5. Checks: the
    shroud runs 434.5 px from y 324 to 758.5, 97.6 mm against CEM's 97.9; the
    fingers' top edge (y 268) to the shroud's bottom is 490.5 px, 110.1 mm
    against NVIDIA's stated 112 (1.7 percent short, the one disagreement: the
    figure is not corrected); the bracket edge-on is 119.0 against 120.02. The
    3/4 gallery pictures (3840 px, 'full-screen-3840-1', -2, -3) and the
    exploded-view still were used to read the top edge and the second fan, and
    are not scaled. The Printables model (CC BY, 'Nvidia RTX 3080 Founder's
    Edition - Split in parts', https://www.printables.com/model/197975-nvidia-
    rtx-3080-founders-edition-split-in-parts) is a crude print split and its
    parts are at mixed scales: it was looked at for shape only and no
    dimension comes from it.
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2,
    PCIe CEM 5.0 figure 11-5). h is two slots: the single bracket's 21.59 plus
    one 20.32 slot pitch, 41.91.
  depth: >-
    datasheet - NVIDIA's page prints the length as 285 mm (11.2 in), taken
    from the bracket's outer face as nvidia/a100-pcie-40gb@1 reads the same
    kind of figure. The guide's clearance box agrees: 'Must have space for 285
    mm (L) x 112 mm (W) x (the raster guide's text is not in its text layer;
    the page's figures read 11.2 in) card'.
  face-outline: >-
    estimated - the plate is std/pcie-bracket-fh@2's, as nvidia/rtx-a6000@1
    draws it, with its far edge at 41.2: 120.02 long, the 0.8 fold at the
    flange end, ten-wide retention tabs on the 20.32 slot pitch with the 4.1
    board-side step and the V notches between them. No straight-on photograph
    of a GeForce bracket exists, so no outline of it was measured; the guides
    draw the plate obliquely, show 2 tabs and a hook-shaped flange that this
    skin does not draw. The straight-on elevation shows the bracket EDGE-ON at
    the left of the card, 530 px tall, which at 4.453 px/mm is 119.0 against
    the standard's 120.02 (0.9 percent short); it confirms the plate's length
    and nothing else.
  face-ports: >-
    estimated - the bracket's port places are BORROWED from other cards'
    guides, not read on this card's own (its guide is raster and puts the
    first DisplayPort about 4 mm nearer the tip); the bracket is taken to be
    the same part. They are read on the VECTOR figure of NVIDIA's guide (the 4090 quick-start guide and the 4070 SUPER user guide,
    page 5, which draw one bracket in an oblique view): the callout dots on
    the page are vector circles at the port centres (y 199.7, 218.9, 238.6 and
    258.8 pt on both pages) and the bracket's flange hook and tab tips were
    read on a 400 dpi render of the same page. As fractions of the plate's
    length from the tab tips the ports lie at 0.875, 0.721, 0.562 and 0.400
    (4090) and 0.856, 0.716, 0.572 and 0.424 (4070 SUPER); the mean, times the
    standard 120.02 plate, puts the three DisplayPort receptacles at 103.9,
    86.2 and 68.1 from the tip and the HDMI receptacle at 49.5. The two pages
    agree to 2 mm and the oblique view is in some perspective, so every place
    is good to about 2 mm. The order, flange end to tab end, is DisplayPort,
    DisplayPort, DisplayPort, HDMI, as the guides' callouts name them. A
    DisplayPort shell is drawn 16.4 long and 7.1 across (y 6.1 to 13.2, as the
    A6000's photographed shells), an HDMI shell 14.5 by 6.0: sizes are
    estimated, not measured. NO STRAIGHT-ON VIEW OF ANY GEFORCE BRACKET EXISTS
    in the intake (0 of 24 boards), so this face is the least certain part of
    the card. THE LIBRARY HAS NO DISPLAYPORT OR HDMI PART OR INTERFACE, so
    each receptacle is an element of class `connector` painted in the skin and
    not a seated part; the `display-ports` attr says what the page says. The
    three DisplayPort pitches (17.8) are tighter than the 21.4 PNY's
    photograph of the RTX A6000's four read; that is another card and was not
    carried over.
  face-vent: >-
    estimated - the guide's drawing shows the vent column below the ports as
    four grilles in a row with narrow bars between them, a screw at the tab
    end and a hole near the flange. Their places are read as fractions of the
    plate's length on the same page: the four panes from about 25 to 111
    along, each 20.2 long with 1.5 bars, and one screw at x 36.5, y 36.8 (the
    guide draws one at the tab end). No hole is drawn at the flange.
  face-markings: >-
    estimated - the guides draw no lamp, label or printing on the bracket and
    no straight-on picture exists to resolve any (no control in the same image
    can be named, so this is a gap, not a reading).
  thickness: >-
    estimated - the raster guide is the only 3080 document with a thickness
    and it prints no figure; the slots figure says 2-Slot. The shroud's far
    face is put at y 40.0 as nvidia/a100-pcie-80gb@1 has it, 1.9 inside the
    41.91 two-slot envelope. NVIDIA's own case diagram draws the card as 2
    slots.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the A100 are. The board, and
    the bracket's keyed side, are at the top (small y), which is where the
    DisplayPorts are.
  body: >-
    the board and its edge follow PCIe CEM 5.0 (figures 6-5 and 11-3): the
    card height 111.15, the lower edge 13.25 above the finger datum, the key
    datum 57.15 behind the bracket. The photograph's fingers run 82.9 mm from
    47 to 130 behind the bracket and CEM's end at 139.03: CEM's are used (the
    same disagreement the workstation cards' photographs show). The Founders
    Edition board is much shorter than its cooler: only the fingers, the stub
    below the shroud and a short run behind it are seen in the elevation, so
    the board box runs 158.1 behind the bracket (estimated, hidden by the
    shroud). The shroud and the board agree to 0.4 mm across (97.6 against
    97.9); the shroud is drawn at the board's lower edge, x 28.41.
  body-shroud: >-
    photo-measured - one dark slab from the board's component face (y 6.01) to
    the far face (40.0), in three boxes split at the top edge's notch
    (provenance body-power-connector) so that the notch is a real step in 3D.
    Its broad side is painted from the elevation: the X-shaped waist, the two
    pockets with their bright rims, the louvres beside the fan pocket and the
    printed model name. The BACK of the card (its backplate and the second fan
    the Founders Edition design has there) is shown in no picture at its scale
    and is not drawn.
  body-fan: >-
    photo-measured - the fan in the far pocket: ring 377 px across (1148 to
    1525 along, 187 radius), centred at px (1337, 540); hub 68 px radius; 11
    blades counted in the photograph, drawn as sickles with a counter-
    clockwise lean; the ring's rim is dark and the blades carry a light edge.
    At 4.453 px/mm that is a ring of 84.3 mm, a hub of 30.5, centred 58.1
    behind the far end and 76.9 down from the board's lower edge. The blades'
    lean was checked by eye, not fitted. Painted on the broad side; it is not
    an opening in the 3D body.
  body-top-edge: >-
    estimated - the top edge is seen only in 3/4 views (the 3080's gallery
    pictures and the guides' oblique drawings), so nothing on it is scaled
    from a picture of it. What is drawn: the shroud's end caps in the shroud's
    metal (champagne on the 3080 and 3080 Ti, grey on the 4070 and 4070 SUPER,
    olive-grey on the 4090) and, between them from 94 to 193 behind the
    bracket, the heat sink's fins, one every 1.6 mm. The run is read from the
    broad-side elevation (the 3080's open run between the two pockets; the
    4070 SUPER's, scaled for the 4090). The lettering on the far cap is a
    maker's wordmark and is reserved as `logo-zone` in skins/body-right.svg,
    not drawn.
  body-power-connector: >-
    estimated - NVIDIA's family page says 'Supplementary Power Connectors: 2x
    PCIe 8-pin (adapter to 1x 12-pin included)' and the raster guide's callout
    reads '12-pin Power Connector', drawn on the top of the card in a notch
    midway along it. THE REGISTRY HAS NO 12-PIN INTERFACE (docs/connectors-
    gpu-design.md and spec/schemas/connectors.yaml name EPS12V, PCIe 8-pin,
    12VHPWR and 12V-2x6 only), so the connector is a plain housing in the 3D
    body (an 18.0 x 9.3 x 8.0 box in the notch, from the guide's 2 x 6 inset)
    and the card exports no power port. The notch's place (about midway along
    the card) is read on the 3/4 pictures and its size is a guess: centred 150
    behind the bracket, 23 long, 4.5 deep. The elevation shows the top edge
    edge-on at its far side and cannot confirm it. The adapter cable is in the
    box and is not modelled.
  body-end: >-
    estimated - a closed dark end plate 1.0 thick at the far end. No
    photograph shows the end; the elevation shows the shroud's far edge only.
    The rear face (`faces.rear`, nvidia/rtx-3080-fe-tail@1) is a plain plate.
  power: >-
    datasheet - NVIDIA's page: 'Graphics Card Power (W) 320' for the 3080 (the
    combined 3080 / 3080 Ti table reads 350 / 320). The figure is the board's
    total, filed as the maximum.
  memory: >-
    datasheet - 10 GB GDDR6X, 320-bit. NVIDIA's family page, Memory Specs.
  part-numbers: >-
    not stated - no document held gives an order code or part number for this
    Founders Edition card (NVIDIA sells it direct and prints none on the pages
    held).
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) a straight-on view of the I/O bracket
    (needs-photo; the whole face is estimated from NVIDIA's guide drawing and
    the standard); (2) a straight-on view of the top edge and the far end
    (needs-photo; the fin run, the caps, the wordmark and the notch are read
    from 3/4 views, and the 12VHPWR notch's size is estimated); (3) the
    DisplayPort and HDMI parts and interfaces, which the library lacks
    (painted, not seated); (4) the card's back, its backplate and the second
    fan, which no picture at scale shows (needs-photo); (5) a weight and an
    order code (vendor-silent in the documents held); (6) PCIe generation,
    which no document held states in a table (vendor-silent: the page tables
    held carry no bus row); (7) the lifecycle, which was not searched; (8) the
    dimensioned FE board outline and bracket drawing, which NVIDIA does not
    publish (handoff list, item 1 of the intake). (9) the 12-pin connector's
    interface, which the registry does not have.
  conflicts: >-
    CONFLICTS SETTLED: (a) the elevation reads the card 110.1 high from the
    fingers' edge where NVIDIA prints 112: the figure is kept at CEM's board,
    0.4 mm and 1.7 percent in doubt; (b) the fingers end 130 behind the
    bracket in the photograph, 139.03 in CEM: CEM's is used; (c) NVIDIA's
    combined 3080 / 3080 Ti table reads 350 / 320 W: the 3080 is 320 and the
    3080 Ti 350 on their own pages; (d) the guide's drawing and the 3/4
    pictures show the 12-pin connector in the notch; the family page calls the
    supplementary connectors '2x PCIe 8-pin (adapter to 1x 12-pin included)':
    both are true (the card has the 12-pin, the box has the adapter).
