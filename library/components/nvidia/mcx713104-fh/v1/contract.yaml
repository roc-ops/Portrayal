  - {ref: std/sfp-ganged@1, id: port-1, at: [67.17, 5.87], rotate: 180, group: sfp56}
  - {ref: std/sfp-ganged@1, id: port-2, at: [53.06, 5.87], rotate: 180, group: sfp56}
  - {ref: std/sfp-ganged@1, id: port-3, at: [38.95, 5.87], rotate: 180, group: sfp56}
  - {ref: std/sfp-ganged@1, id: port-4, at: [24.82, 5.87], rotate: 180, group: sfp56}
  - ref: common/led-dot@1
