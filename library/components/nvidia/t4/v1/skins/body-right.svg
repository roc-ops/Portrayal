<svg xmlns="http://www.w3.org/2000/svg" width="167.33mm" height="16.04mm" viewBox="2.2 1.27 167.33 16.04">
  <!-- nvidia/t4: THE TOP EDGE, the body's right side seen from outside. Across:
       mm behind the bracket's outer face (2.2 to 169.53, the cover's length).
       Down: the face's y (1.27 the board's outer face, 17.31 the cover's). A
       black edge with "NVIDIA" and "TESLA T4" printed on it, at fractions of the
       card's length read off PNY's oblique top-edge render (provenance
       body-top-edge). -->
  <rect x="2.2" y="1.27" width="167.33" height="16.04" fill="#222528"/>
  <!-- the NVIDIA mark is reserved, not drawn (L172) -->
  <rect id="logo-zone" x="78.0" y="6.0" width="4.4" height="3.0" fill="none"/>
  <g id="silkscreen">
    <text x="83.5" y="8.6" font-family="Arial" font-weight="bold" font-size="2.6" fill="#e8e8e8" textLength="11.0" lengthAdjust="spacingAndGlyphs">NVIDIA</text>
    <text x="141.0" y="8.6" font-family="Arial" font-weight="bold" font-size="2.4" fill="#e8e8e8" textLength="16.0" lengthAdjust="spacingAndGlyphs">TESLA T4</text>
  </g>
</svg>
