<svg xmlns="http://www.w3.org/2000/svg" width="54.1mm" height="167.33mm" viewBox="0.17 0 54.1 167.33">
  <!-- nvidia/t4: THE COVER'S BROAD SIDE, the body's bottom side seen from
       outside. Across: 79.2 (the face's width) less the face's x, so the card's
       top edge is at 0.17 and its lower edge at 54.27. Down: 169.53 less mm
       behind the bracket's outer face, so the far end is at the top and the
       cover's front (2.2 behind the bracket) at the bottom. Silver with two
       green bands and nine grooves along the card, as PNY's side renders show;
       the bands' and grooves' places are fractions of those pictures, estimated. -->
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9adb0"/>
      <stop offset="1" stop-color="#bcc0c3"/>
    </linearGradient>
  </defs>
  <rect x="0.17" y="0" width="54.1" height="167.33" fill="url(#shade)"/>
  <!-- the green bands, along the card near each edge -->
  <rect x="4.2" y="18" width="4.6" height="134" fill="#76b900"/>
  <rect x="45.4" y="18" width="4.6" height="134" fill="#76b900"/>
  <!-- nine grooves between the bands -->
  <g fill="#6b7075">
    <rect x="11.0" y="18" width="0.4" height="134"/>
    <rect x="14.6" y="18" width="0.4" height="134"/>
    <rect x="18.2" y="18" width="0.4" height="134"/>
    <rect x="21.8" y="18" width="0.4" height="134"/>
    <rect x="25.4" y="18" width="0.4" height="134"/>
    <rect x="29.0" y="18" width="0.4" height="134"/>
    <rect x="32.6" y="18" width="0.4" height="134"/>
    <rect x="36.2" y="18" width="0.4" height="134"/>
    <rect x="39.8" y="18" width="0.4" height="134"/>
  </g>
</svg>
