<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="21.59mm" viewBox="0 0 120.02 21.59">
  <!-- nvidia/mcx713114-fh: MCX713114T on its tall bracket. The outline, tip
       and keyed flange are std/pcie-bracket-fh@2, composed BEHIND this; what is drawn
       here is the punched plate: vents, light-pipe slots and port numerals.
       TIP AT THE LEFT - NVIDIA draws the card tip-right, so this is its
       figure turned a half-turn and the numerals read upside down. -->
  <!-- METAL FILLING THE OPENING: the bracket colour, 0.3 proud all round so
       the opening stroke leaves no ghost; the holes are punched in it. -->
  <rect id="plate" x="19.66" y="6.05" width="90.50" height="12.66" fill="#9aa1a8"/>
  <g id="vents"><rect x="82.25" y="17.52" width="2.54" height="2.75" rx="0.60" fill="#17191c"/><rect x="75.74" y="17.52" width="2.54" height="2.75" rx="0.60" fill="#17191c"/><rect x="67.98" y="17.52" width="2.54" height="2.75" rx="0.60" fill="#17191c"/><rect x="61.53" y="17.52" width="2.54" height="2.75" rx="0.60" fill="#17191c"/><rect x="53.76" y="17.52" width="2.54" height="2.75" rx="0.60" fill="#17191c"/><rect x="47.19" y="17.52" width="2.54" height="2.75" rx="0.60" fill="#17191c"/><rect x="39.55" y="17.52" width="2.54" height="2.75" rx="0.60" fill="#17191c"/><rect x="92.99" y="12.64" width="3.00" height="4.51" rx="0.60" fill="#17191c"/><rect x="92.99" y="7.12" width="3.00" height="4.51" rx="0.60" fill="#17191c"/><rect x="104.13" y="12.64" width="2.88" height="4.51" rx="0.60" fill="#17191c"/><rect x="104.13" y="7.12" width="2.88" height="4.51" rx="0.60" fill="#17191c"/><rect x="108.14" y="12.64" width="2.50" height="4.51" rx="0.60" fill="#17191c"/><rect x="108.14" y="7.12" width="2.50" height="4.51" rx="0.60" fill="#17191c"/><rect x="111.77" y="12.64" width="2.50" height="4.51" rx="0.60" fill="#17191c"/><rect x="111.77" y="7.12" width="2.50" height="4.51" rx="0.60" fill="#17191c"/><rect x="29.76" y="12.64" width="3.00" height="4.51" rx="0.60" fill="#17191c"/><rect x="29.76" y="7.12" width="3.00" height="4.51" rx="0.60" fill="#17191c"/><rect x="18.75" y="12.64" width="2.88" height="4.51" rx="0.60" fill="#17191c"/><rect x="18.75" y="7.12" width="2.88" height="4.51" rx="0.60" fill="#17191c"/></g>
  <g id="slots"><rect x="86.12" y="15.80" width="2.44" height="2.61" rx="1.30" fill="#17191c"/><rect x="71.89" y="15.80" width="2.44" height="2.61" rx="1.30" fill="#17191c"/><rect x="57.65" y="15.80" width="2.44" height="2.61" rx="1.30" fill="#17191c"/><rect x="43.42" y="15.80" width="2.44" height="2.61" rx="1.30" fill="#17191c"/></g>
  <g id="silkscreen">
    <text id="label-1" x="89.71" y="17.66" transform="rotate(180 89.71 17.12)" font-family="sans-serif" font-size="1.5" font-weight="bold" text-anchor="middle" fill="#2b2d2f">1</text>
    <text id="label-2" x="75.48" y="17.66" transform="rotate(180 75.48 17.12)" font-family="sans-serif" font-size="1.5" font-weight="bold" text-anchor="middle" fill="#2b2d2f">2</text>
    <text id="label-3" x="61.24" y="17.66" transform="rotate(180 61.24 17.12)" font-family="sans-serif" font-size="1.5" font-weight="bold" text-anchor="middle" fill="#2b2d2f">3</text>
    <text id="label-4" x="47.01" y="17.66" transform="rotate(180 47.01 17.12)" font-family="sans-serif" font-size="1.5" font-weight="bold" text-anchor="middle" fill="#2b2d2f">4</text>
    <text id="label-IN" x="100.12" y="18.19" transform="rotate(180 100.12 17.58)" font-family="sans-serif" font-size="1.7" font-weight="bold" text-anchor="middle" fill="#2b2d2f">IN</text>
    <text id="label-OUT" x="25.94" y="18.19" transform="rotate(180 25.94 17.58)" font-family="sans-serif" font-size="1.7" font-weight="bold" text-anchor="middle" fill="#2b2d2f">OUT</text>
  </g>
</svg>
