<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="41.91mm" viewBox="0 0 120.02 41.91">
  <!-- nvidia/rtx-2000-ada: the RTX 2000 Ada's FULL-HEIGHT support bracket, seen from
       OUTSIDE the chassis, drawn from the facts in the contract's provenance (a
       straight-on photograph of this bracket, scaled with the two retention tabs
       as the ruler across and the plate's length along). TIP AT THE LEFT, flange
       end at the right, the board's side at the top, as std/pcie-bracket-fh@2 is
       drawn: the photograph is turned a quarter turn into this frame. A silver
       plate two slots across with four mini DisplayPort receptacles along the
       board's side, a latch slot beside each, and a grid of square vent holes in a
       pressed panel held by two Torx screws. Nothing is traced. -->
  <path id="plate" d="M1.9 7.47 L7.56 7.47 L11.43 3.24 L25.6 3.24 L26.3 3.91 L119.2 3.91 L119.2 0.3 L120.02 0.3 L120.02 40.9 L119.2 40.9 L119.2 38.8 L110.94 38.8 L110.4 40.15 L19.0 40.15 L18.5 41.51 L11.4 41.51 L7.56 37.78 L1.9 37.78 A1.9 1.9 0 0 1 0 35.88 L0 29.52 A1.9 1.9 0 0 1 1.9 27.62 L7.56 27.62 L11.2 24.15 A2.4 2.4 0 0 0 11.2 20.95 L7.56 17.46 L1.9 17.46 A1.9 1.9 0 0 1 0 15.56 L0 9.37 A1.9 1.9 0 0 1 1.9 7.47 Z" fill="#bdbbbb" stroke="#6a6969" stroke-width="0.4" stroke-linejoin="round"/>
  <!-- the fold: the flange turns 90 degrees here. On an elevation it is a line. -->
  <path id="flange-fold" d="M119.6 0.6 V40.6" stroke="#6a6969" stroke-width="0.3" fill="none"/>
  <!-- the four mini DisplayPort receptacles: a 9.2 x 6.3 shell, an opening whose two
       corners are cut on the grid's side and a tongue. Each is drawn once at its
       own place; the library has no DisplayPort part and none for a mini
       DisplayPort. Centres 72.20, 59.76, 46.90 and 34.21 along the bracket. -->
  <g id="display-port-1" transform="translate(67.60 6.79)">
    <rect width="9.2" height="6.27" rx="1.0" fill="#dcdcdc" stroke="#6f6f6f" stroke-width="0.3"/>
    <path d="M0.8 0.9 L8.4 0.9 L8.4 3.7 L7.1 5.3 L1.9 5.3 L0.8 3.7 Z" fill="#151515"/>
    <rect x="1.6" y="2.0" width="6.0" height="1.3" fill="#7d8288"/>
  </g>
  <g id="display-port-2" transform="translate(55.16 6.79)">
    <rect width="9.2" height="6.27" rx="1.0" fill="#dcdcdc" stroke="#6f6f6f" stroke-width="0.3"/>
    <path d="M0.8 0.9 L8.4 0.9 L8.4 3.7 L7.1 5.3 L1.9 5.3 L0.8 3.7 Z" fill="#151515"/>
    <rect x="1.6" y="2.0" width="6.0" height="1.3" fill="#7d8288"/>
  </g>
  <g id="display-port-3" transform="translate(42.30 6.79)">
    <rect width="9.2" height="6.27" rx="1.0" fill="#dcdcdc" stroke="#6f6f6f" stroke-width="0.3"/>
    <path d="M0.8 0.9 L8.4 0.9 L8.4 3.7 L7.1 5.3 L1.9 5.3 L0.8 3.7 Z" fill="#151515"/>
    <rect x="1.6" y="2.0" width="6.0" height="1.3" fill="#7d8288"/>
  </g>
  <g id="display-port-4" transform="translate(29.61 6.79)">
    <rect width="9.2" height="6.27" rx="1.0" fill="#dcdcdc" stroke="#6f6f6f" stroke-width="0.3"/>
    <path d="M0.8 0.9 L8.4 0.9 L8.4 3.7 L7.1 5.3 L1.9 5.3 L0.8 3.7 Z" fill="#151515"/>
    <rect x="1.6" y="2.0" width="6.0" height="1.3" fill="#7d8288"/>
  </g>
  <!-- the latch slots, one beside each receptacle, and the three small squares
       between them -->
  <g id="latch-slots" fill="#1c1c1c">
    <rect x="69.50" y="14.07" width="5.4" height="2.04" rx="0.6"/>
    <rect x="57.06" y="14.07" width="5.4" height="2.04" rx="0.6"/>
    <rect x="44.20" y="14.07" width="5.4" height="2.04" rx="0.6"/>
    <rect x="31.51" y="14.07" width="5.4" height="2.04" rx="0.6"/>
    <rect x="64.89" y="14.10" width="2.0" height="2.0"/>
    <rect x="52.29" y="14.10" width="2.0" height="2.0"/>
    <rect x="39.51" y="14.10" width="2.0" height="2.0"/>
  </g>
  <!-- the port numbers 1 to 4 printed on the plate, each on the tip side of its
       receptacle, 1 at the flange end; light print, 1.7 tall, turned with the
       photograph's quarter turn so the glyph's top points at the flange -->
  <g id="silkscreen" fill="#f0f0f0" font-family="sans-serif" font-size="2.4" text-anchor="middle">
    <text x="64.82" y="11.7" transform="rotate(90 64.82 11.7)">1</text>
    <text x="52.38" y="11.7" transform="rotate(90 52.38 11.7)">2</text>
    <text x="39.61" y="11.7" transform="rotate(90 39.61 11.7)">3</text>
    <text x="27.12" y="11.7" transform="rotate(90 27.12 11.7)">4</text>
  </g>
  <!-- the pressed panel: 52.6 along, 20.2 across -->
  <rect id="panel" x="29.42" y="14.75" width="52.61" height="20.15" rx="2.6" fill="none" stroke="#8a8a8a" stroke-width="0.3"/>
  <!-- the vent grid: 4 holes across and 12 along, each 3.04 square on a pitch of
