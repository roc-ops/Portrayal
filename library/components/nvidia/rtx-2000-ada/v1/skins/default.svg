  <!-- the two Torx screws at the far corners of the panel -->
  <g id="screw-1"><circle cx="77.49" cy="32.36" r="2.27" fill="#9a9a9a" stroke="#555555" stroke-width="0.3"/><circle cx="77.49" cy="32.36" r="0.9" fill="#2a2a2a"/></g>
