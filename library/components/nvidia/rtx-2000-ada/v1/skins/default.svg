    <rect x="55.80" y="23.05" width="3.04" height="3.04"/>
    <rect x="55.80" y="27.12" width="3.04" height="3.04"/>
    <rect x="55.80" y="31.10" width="3.04" height="3.04"/>
    <rect x="51.76" y="18.99" width="3.04" height="3.04"/>
    <rect x="51.76" y="23.05" width="3.04" height="3.04"/>
