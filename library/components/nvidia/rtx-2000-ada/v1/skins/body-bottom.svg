       mm behind the bracket's outer face, so the far end is at the top and the
       bracket's end at the bottom. Dark grey, lighter toward the bracket, with the
       blower's opening: a dark ring 39.8 across centred 38.5 from the far end and
       23.0 below the top edge (PNY's side photograph at 4.01 px/mm, provenance
       body-fan), with a dark hub and 47 curved blades. Drawn in-house; nothing is
       traced. -->
