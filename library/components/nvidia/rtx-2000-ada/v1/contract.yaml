format: 1
kind: module
name: rtx-2000-ada
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA RTX 2000 Ada Generation (16 GB GDDR6), a low-profile dual-slot
  workstation card with a small blower. It is drawn on its full-height support
  bracket, the one straight-on picture held. It takes no auxiliary power. The
  bracket face is a silver plate two slots across. It has four mini DisplayPort
  connectors on the board's side with a latch slot beside each. Beside them is a
  grid of square vent holes in a pressed panel held by two Torx screws. The shroud
  is dark grey with the blower's opening on its broad side and a long recessed lid
  along the top edge. It plugs into one riser slot and covers the one beside it.
slot-width: 2
size: {w: 120.02, h: 41.91, d: 167.64}
size-confidence: {w: registry, h: registry, d: datasheet}
unplaced: >-
  no bay in the library lists this card in `accepts`. A riser bay that takes a
  low profile card names each card by hand (docs/cards-by-interface-design.md,
  status proposed: no interface or mates field exists on a card or a bay today),
  and no server document in the library was found to list an RTX 2000 Ada, so no
  riser was edited.
attrs:
  model: 'RTX 2000 Ada'
  part-numbers: 'PNY VCNRTX2000ADA-PB (retail); NVIDIA 900-5G192-2240-000'
  role: gpu
  form-factor: 'Low profile, 2.7 in x 6.6 in, dual slot; drawn on its full-height support bracket'
  pcie-connector: x16
  pcie-electrical: x8
  pcie-generation: 4
  pcie-height: low
  power-draw-max-w: 70
  power-input: 'host PCIe slot only'
  memory: '16 GB GDDR6, 128-bit, 224 GB/s'
  display-ports: '4 x mini DisplayPort 1.4a on the bracket'
  cooling: active
  airflow: 'blower; it draws air from the card''s broad side and exhausts toward the bracket'
provenance:
  slot-width: >-
    datasheet - NVIDIA's RTX 2000 Ada datasheet (2999417, FEB24, a partner print):
    "Form factor 2.7' H x 6.6' L, Dual Slot"; the Ada quick-start guide: "The RTX
    6000, RTX 5000, RTX 4500, RTX 4000 SFF and RTX 2000 are dual-slot GPUs and will
    require removing two adjacent slot covers". The face is one plate about 38.3
    across (`face-outline`). The card declares `slot-width: 2` as
    docs/pcie-two-slot-bays-design.md R1 defines it.
  sources: >-
    NVIDIA RTX 2000 Ada Generation datasheet (2999417, FEB24), a partner print
    published by PNY (NVIDIA's own page for it is not held),
    https://www.pny.com/file%20library/company/support/product%20brochures/geforce%20graphics/english/proviz-rtx-2000-ada-datasheet-partner-us-2999417-r4.pdf,
    and PNY's NVIDIA Professional Graphics line card (REV. 09.14.26),
    https://www.pny.com/File%20Library/Company/Support/linecards/pro-viz-gpus/NVIDIA-Professional-Graphics-Linecard.pdf,
    for the order code. NVIDIA's RTX Ada Generation online quick-start guide,
    https://images.nvidia.com/aem-dam/Solutions/design-visualization/quadro-product-literature/proviz-rtx-ada-gen-online-qsg.pdf:
    the dual-slot statement, "Support Full Height Bracket: 1" in the box, and "the
    RTX 4000 SFF and RTX 2000 do not use a power cable". NVIDIA's power guide
    DA-07261-001_v15 (27 July 2023) predates this card and does not list it.
    NVIDIA publishes no dimensioned drawing of this card: the geometry is measured
    on PNY's photographs (below) and carried over from the standards. The
    photographs are named by their files and licence is not stated; facts read
    from them, pictures not used.
  reference-photos: >-
    reference - PNY's product images for the RTX 2000 Ada, under
    https://d2vfia6k6wrouk.cloudfront.net/productimages/5b5f8f56-b41e-473e-9f70-b11400b51165/images/:
    pny-nvidia-rtx-2000-ada-fr-long.png (the FULL-HEIGHT support bracket straight
    on, 254 x 722 px, its tip at the bottom), pny-nvidia-rtx-2000-ada-top.png (named
    top by PNY, but the broad side straight on with the same full-height bracket
    fitted, 720 x 484 px) and three 3/4 views (-left-front-angle, -left-front and
    -right-angle). The 3/4 views are at about 45 degrees and cannot be scaled; the
    -right-angle one is the only picture of the top edge. Each was checked to be
    this card: four mini DisplayPorts with a latch slot beside each and a pressed
    vent panel with two screws on a bracket two slots across, a dark blower shroud
    with a lower-edge step at the far end, the same card in all five; none is
    byte-identical to a picture of another card. MM PER PIXEL: bracket photograph
    0.1681 along the plate (5.949 px/mm) and 0.1693 across it (5.906 px/mm), 0.7
    percent apart; broad-side photograph 0.2495 (4.008 px/mm) both ways, 0.6 percent
    from the card's own length. All are set out under `face-outline` and
    `body-fan`.
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2, PCIe
    CEM 5.0 figure 11-5). h is two slots, 41.91, as the full-height two-slot cards
    have it.
  depth: >-
    datasheet - 6.6 in, exactly 167.64, from the bracket's outer face as
    nvidia/a2@1 reads the same figure. On the broad-side photograph the plate seen
    edge on has its outer face at column 83 and the shroud's far end is at column
    759, so 676 px stand for 168.7 at 4.008 px/mm (0.6 percent over the datasheet's
    length), and the shroud's 222 px are 55.4 high against the board's 55.65.
  face-outline: >-
    photo-measured - the bracket photograph (pny-nvidia-rtx-2000-ada-fr-long.png)
    turned a quarter turn into this frame, tip at the left and the board's side at
    the top. Its scale across is the two retention tabs, whose centres are 120 px
    apart (351 and 471), the 20.32 slot pitch, so 5.906 px/mm (0.1693 mm/px); its
    scale along is the plate, 714 px from the tip (row 750) to the flange's fold
    (row 36), the standard's 120.02, so 5.949 px/mm (0.1681 mm/px). The two are 0.7
    percent apart. The tabs are 60 px wide, 10.16 against CEM's 10.2. At that scale
    the first tab's centre is put at y 12.38, where std/pcie-bracket-fh@2 puts its
    own. Read that way the tabs are at y 7.47 to 17.46 and 27.62 to 37.78, 7.56
    long, reached by 45 degree chamfers to the body at 11.4; the plate's board-side
    edge is at y 3.24 up to 26.05 from the tip and 3.91 beyond it, and its far edge
    at 41.51 up to 18.5, 40.15 up to 110.9 and 38.8 beyond (the steps are read at
    rows 595, 640 and 90; the plate is NOT the standard's outline, which is why this
    face draws its own and composes no std bracket). The plate is 38.3 across,
    inside the 41.91 envelope. Readings are good to about 0.5 mm.
  face-displayports: >-
    photo-measured - four mini DisplayPort receptacles along the board's side, at the
    same scales. Each shell is 9.2 along the bracket and 6.3 across (y 6.79 to
    13.06), with its opening cut on the grid's side and its tongue drawn as one bar.
    Their centres along the bracket are 72.20, 59.76, 46.90 and 34.21 (the middles of
    the shells, rows 320.5, 394.5, 471 and 546.5), a pitch of 12.66. The photograph
    prints the port numbers 1 to 4, each on the tip side of its receptacle, and they
    are drawn (`#silkscreen`, 1.7 tall, centred at x 65.7, 53.2, 40.5 and 28.0 and
    y 11.7, read at 5.949 and 5.906 px/mm; see `face-markings`). So `display-port-1`
    is the receptacle nearest the flange (x 67.60), `display-port-2`, `-3` and `-4`
    following toward the tip: the element ids follow the photograph's numbers, the
    one numbering source held for any of these cards. THE LIBRARY HAS
    NO DISPLAYPORT PART OR INTERFACE, and none for a mini DisplayPort, so each is an
    element of class `connector` painted in the skin and not a seated part; nothing
    mates it and the module type carries no port for them (the `display-ports` attr
    says 4 x mini DisplayPort 1.4a, the datasheet's words).
  face-latches: >-
    photo-measured - beside each receptacle a dark slot 5.4 by 2.0 (y 14.07 to
    16.11) for the connector's latch, centred on the receptacle, and between each
    pair a small square 2.0 by 2.0 at x 65.89, 53.29 and 40.51. The squares have no
    stated purpose and are drawn as dark squares.
  face-grille: >-
    photo-measured - a grid of square vent holes in a pressed panel beside the
    receptacles: 12 along the bracket and 4 across, each 3.04 square on a pitch of
    4.03 along (24.0 px) and 4.06 across (24 px), the first row at x 77.49 and the
    last at 33.11, the columns at y 20.51, 24.57, 28.64 and 32.62. The two end rows'
    fourth hole is the screw's and their third is 2.4 across. The panel's outline
    is x 29.42 to 82.03 and y 14.75 to 34.9, drawn as a thin line.
  face-screws: >-
    photo-measured - two Torx screws at the far corners of the panel, at x 77.49 and
    33.11 and y 32.36, heads 4.5 across. The recess is drawn as a plain dark circle,
    not a six-lobe star.
  face-markings: >-
    photo-measured - the bracket carries no lamp and no label; its only printing is
    the port numbers 1 to 4, which are drawn in light print beside the small squares
    (the first three) and below the fourth port, each 1.7 tall; their place is read
    to about 0.5 mm and the glyph is the skin's sans-serif, not the printed one.
  bracket-variants: >-
    NOT DRAWN: THE LOW-PROFILE BRACKET. The quick-start guide lists "Support Full
    Height Bracket" in the card's box, so the card ships on a low-profile bracket
    with this one beside it, and PNY's -left-front-angle view shows the low-profile
    bracket fitted. No straight-on picture of it is held, so the card is drawn on the
    full-height support bracket, the only one that can be scaled, and no part number
    of either bracket is stated by any document held.
  thickness: >-
    estimated - the datasheet states no thickness. The shroud's far face is put at
    y 40.0, as the full-height two-slot cards have it, 1.5 inside the bracket's far
    edge (41.51).
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 is. The board, and the bracket's keyed
    side, are at the top (small y), which is where the receptacles are.
  body: >-
    the board, its edge and the pads follow PCIe CEM 5.0 (figures 6-5 and 11-3, as
    the RTX 6000, 4500 and 4000 Ada have them): the card 55.65 high above its lower
    edge, which is 13.25 above the finger datum W (at x 15.16 on this full-height
    bracket), the key datum 57.15 behind the bracket, the full-height datum those
    three use, and the x16 finger tab to the standard's 81.88 past it. (An earlier
    figure, the low-profile key datum 58.15 copied from nvidia/a2@1, is dropped: this
    card is drawn on its full-height bracket, and the photographs show the fingers
    starting at the same place on all four cards.) NVIDIA prints no figure for this
    card. The broad-side photograph agrees on the height: the shroud's top edge is at
    83.1 from the tip against the board's 84.06. THE PHOTOGRAPH'S FINGERS DO NOT
    FOLLOW CEM exactly: the gold fingers run from 48.4 to 129.0 behind the bracket
    against CEM's 45.35 to 128.95 (the same start as the RTX 6000 Ada's 48.2 and the
    RTX 4500 Ada's 48.7), and the key's gap is read at 59.6 against CEM's 58.35; the
    body keeps CEM's and this is a gap. The lower edge has a step at the far end from 142.5 to 160.0
    behind the bracket, 4.2 deep (the shroud's lower edge steps up 17 px with sloped
    ends), drawn as one box 17.5 long. THE BOARD STARTS 0.90 behind the bracket, as
    nvidia/a10@1 has it (estimated).
  body-shroud: >-
    photo-measured - the shroud is dark grey, one slab from the board's component
    face (y 6.01) to the far face (40.0), the outline of the board, split at the
    step as the board is. Its broad side is not one tone: the photograph reads #686868
    at the bracket end and #161616 at the far end, a smooth ramp, which the broad-side
    skin draws as a gradient. The back of the card is not seen in any photograph held,
    so there is no backplate and the board's rear is bare (a gap).
  body-fan: >-
    photo-measured - the blower's opening on the broad side, from PNY's photograph
    (720 x 484 px) at 4.008 px/mm. The ring is 160 px across, 39.8, centred at px
    (605, 400): 38.5 from the far end and 23.0 below the top edge, close
    to the top edge. The hub's face is 8.75 in radius
    in a rim of 10.0, and the 47 curved blades run from radius 11 to 17.8. Their
    number follows the photograph's (about 47) and their curve is schematic. Painted
    on the broad side, not an opening in the 3D body.
  body-top-edge: >-
    estimated - PNY's 3/4 view from above (-right-angle) shows the top edge as a
    dark frame round a long recessed glossy lid that runs from the bracket end nearly
    to the far end, the model name "RTX 2000" in small print on the frame at the bracket
    end, a black pocket near the far end and the maker's mark on the frame by the
    pocket. There is no champagne heat-sink strip on this card. The view is at about
    45 degrees and cannot be scaled, so every place here is a fraction of the edge's
    length read along it, with the perspective not removed, and is estimated: the lid
    from 5.5 to 151 behind the bracket and 9.0 to 37.4 across the card, the pocket from
    146 to 166.4, "RTX 2000" at 3.0 behind it, 2.0 tall. THE MAKER'S MARK IS NOT
    DRAWN: its box (147 to 164 behind the bracket, 6.3 to 8.9 across) is reserved as
    `logo-zone` in `skins/body-right.svg`, estimated.
  body-end: >-
    estimated - a closed dark end plate 1.0 thick, 0.4 inside the card's length, as
    nvidia/a10@1 has it. PNY's -right-angle view shows the far end plain with two
    small round holes and the maker's mark above them; none is drawn.
  power: >-
    datasheet - total board power 70 W in the datasheet (2999417, FEB24) and the PNY
    line card; no auxiliary connector (the quick-start guide: "the RTX 4000 SFF and
    RTX 2000 do not use a power cable"). The sources agree.
  memory: >-
    datasheet - 16 GB GDDR6, 128-bit, 224 GB/s, ECC.
  pcie: >-
    datasheet - PCIe 4.0 x8 with "a full-length PCIe x8 interface" (footnote 4): the
    connector is drawn x16 long, with eight lanes wired (`pcie-connector: x16`,
    `pcie-electrical: x8`), as the photograph's finger run shows.
  part-numbers: >-
    datasheet - PNY's line card: "NVIDIA RTX 2000 Ada Generation VCNRTX2000ADA-PB
    900-5G192-2240-000" (PNY part, NVIDIA part). The datasheet gives none.
  weight: >-
    not stated - no datasheet held gives a weight for the card.
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) a straight-on view of the top edge and the far
    end (needs-photo; the lid, its pocket and the printing are estimated and the end
    is a schematic); (2) the DisplayPort part and interface, which the library
    lacks, and a mini DisplayPort one (the four are painted, not seated); (3) the
    thickness, which no source states (vendor-silent); (4) the fingers' true run,
    which the broad-side photograph draws about 4 percent shorter than CEM
    (needs-drawing); (5) the card's back, which no photograph shows (needs-photo);
    (6) a weight (vendor-silent in the documents held); (7) the lifecycle: no
    end-of-life notice was searched for; (8) the low-profile bracket the card ships
    on, with no straight-on picture and no part number (needs-photo; see
    `bracket-variants`); (9) NVIDIA's own datasheet page for this card (the intake
    holds PNY's print of it only); (10) no dimensioned drawing of any active
    workstation card (the intake's handoff list, item 1). The RTX 2000E Ada (50 W,
    single slot) has no photograph in the intake and is not modelled.
