  <g id="screw-2"><circle cx="113.43" cy="17.74" r="2.2" fill="#6f6c6a" stroke="#2a2927" stroke-width="0.3"/><circle cx="113.43" cy="17.74" r="0.9" fill="#1d1f21"/></g>
  <g id="screw-3"><circle cx="31.21" cy="36.5" r="2.2" fill="#6f6c6a" stroke="#2a2927" stroke-width="0.3"/><circle cx="31.21" cy="36.5" r="0.9" fill="#1d1f21"/></g>
