<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="41.91mm" viewBox="0 0 120.02 41.91">
  <!-- nvidia/rtx-6000-ada: the RTX 6000 Ada dual-slot bracket, seen from OUTSIDE
       the chassis, drawn from the facts in the contract's provenance (a straight-on
       photograph of the bracket, scaled with the two retention tabs as the ruler
       across and the plate's length along). TIP AT THE LEFT, flange end at the
       right, the board's side at the top, as std/pcie-bracket-fh@2 is drawn: the
       photograph is turned a quarter turn into this frame. A silver plate with four
       DisplayPort receptacles along the board's side and one framed vent window
       beside them with the heat-sink fins behind it. Nothing is traced. -->
  <path id="plate" d="M1.9 7.24 L7.27 7.24 L9.5 5.23 L20.3 5.23 L21.3 3.45 L119.2 3.45 L119.2 0.3 L120.02 0.3 L120.02 40.9 L119.2 40.9 L119.2 41.41 L21.3 41.41 L20.3 40.29 L10.8 40.29 L7.27 37.84 L1.9 37.84 A1.9 1.9 0 0 1 0 35.94 L0 29.46 A1.9 1.9 0 0 1 1.9 27.56 L7.27 27.56 L10.95 24.2 A2.4 2.4 0 0 0 10.95 20.9 L7.27 17.52 L1.9 17.52 A1.9 1.9 0 0 1 0 15.62 L0 9.14 A1.9 1.9 0 0 1 1.9 7.24 Z" fill="#a9a5a3" stroke="#5f5b59" stroke-width="0.4" stroke-linejoin="round"/>
  <!-- the fold: the flange turns 90 degrees here. On an elevation it is a line. -->
  <path id="flange-fold" d="M119.6 0.6 V40.6" stroke="#5f5b59" stroke-width="0.3" fill="none"/>
  <!-- the four DisplayPort receptacles: an 18.6 x 7.6 shell with the D shape's
       chamfer at the flange end on the window's side, a dark opening and two rows
       of pins. Each is drawn once at its own place; the library has no
       DisplayPort part. Centres 40.12, 61.55, 82.65 and 103.42 along the bracket. -->
  <g id="display-port-1" transform="translate(30.82 5.68)">
    <path d="M0.8 0 L17.8 0 A0.8 0.8 0 0 1 18.6 0.8 L18.6 3.9 L14.9 7.6 L0.8 7.6 A0.8 0.8 0 0 1 0 6.8 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#c9c8c7" stroke="#6b6866" stroke-width="0.3"/>
    <path d="M1.0 1.0 L17.6 1.0 L17.6 3.6 L14.5 6.6 L1.0 6.6 Z" fill="#161718"/>
    <path d="M2.6 2.5 H16.0 M2.6 4.4 H13.9" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-2" transform="translate(52.25 5.68)">
    <path d="M0.8 0 L17.8 0 A0.8 0.8 0 0 1 18.6 0.8 L18.6 3.9 L14.9 7.6 L0.8 7.6 A0.8 0.8 0 0 1 0 6.8 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#c9c8c7" stroke="#6b6866" stroke-width="0.3"/>
    <path d="M1.0 1.0 L17.6 1.0 L17.6 3.6 L14.5 6.6 L1.0 6.6 Z" fill="#161718"/>
    <path d="M2.6 2.5 H16.0 M2.6 4.4 H13.9" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-3" transform="translate(73.35 5.68)">
    <path d="M0.8 0 L17.8 0 A0.8 0.8 0 0 1 18.6 0.8 L18.6 3.9 L14.9 7.6 L0.8 7.6 A0.8 0.8 0 0 1 0 6.8 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#c9c8c7" stroke="#6b6866" stroke-width="0.3"/>
