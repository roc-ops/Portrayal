    <path d="M1.0 1.0 L17.6 1.0 L17.6 3.6 L14.5 6.6 L1.0 6.6 Z" fill="#161718"/>
    <path d="M2.6 2.5 H16.0 M2.6 4.4 H13.9" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
