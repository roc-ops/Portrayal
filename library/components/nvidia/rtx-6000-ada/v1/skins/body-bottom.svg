       mm behind the bracket's outer face, so the far end is at the top and the
       bracket's end at the bottom. Glossy black with the blower's opening: a gold
       ring 73.6 across centred 50.2 from the far end and 48.3 below the top edge
       (PNY's side photograph at 2.56 px/mm, provenance body-fan), with a hub and 56
       blades. The photograph's diagonal reflection is light, not geometry, and is
       drawn as a soft gradient only. Drawn in-house; nothing is traced. -->
