format: 1
kind: module
name: rtx-6000-ada
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA RTX 6000 Ada Generation (48 GB GDDR6), an actively cooled dual-slot
  full-height full-length workstation card with a blower. The bracket face is
  silver with four DisplayPort connectors on the board's side and one framed
  vent window beside them. The shroud is glossy black with the blower's
  gold-ringed opening on its broad side and the heat sink's fins showing along
  the top edge. It has one 16-pin CEM5 power connector at the far end by the top
  edge. It plugs into one riser slot and covers the one beside it.
slot-width: 2
size: {w: 120.02, h: 41.91, d: 266.70}
size-confidence: {w: registry, h: registry, d: datasheet}
unplaced: >-
  no bay in the library lists this card in `accepts`. A riser bay names each card
  it takes by hand (docs/cards-by-interface-design.md, status proposed: no
  interface or mates field exists on a card or a bay today), and no document held
  says any server takes a workstation card, so none was added and seating it
  would be an edit to an existing component that this change does not make.
attrs:
  model: 'RTX 6000 Ada'
  part-numbers: 'PNY VCNRTX6000ADA-PB (retail), VCNRTX6000ADA-SB (single bulk), VCNRTX6000ADA-BLK (bulk), VCNRTX6000ADA-EDU (education), VCNRTX6000ADASYNC-PB (with the Sync card); NVIDIA 900-5G133-2250-000'
  role: gpu
  form-factor: 'Full-height, full-length (FHFL) 4.4 in x 10.5 in, dual slot'
  pcie-connector: x16
  pcie-generation: 4
  pcie-height: full
  power-draw-max-w: 300
  power-input: 'host PCIe slot and one PCIe CEM5 16-pin (12VHPWR) auxiliary connector; a 2x PCIe 8-pin to 1x CEM5 16-pin adapter is in the box'
  memory: '48 GB GDDR6, 384-bit, 960 GB/s'
  display-ports: '4 x DisplayPort 1.4a on the bracket'
  cooling: active
  airflow: 'blower; it draws air from the card''s broad side and exhausts toward the bracket'
  nvlink: 'none'
faces:
  rear: {ref: nvidia/rtx-6000-ada-tail@1}
provenance:
  slot-width: >-
    datasheet - NVIDIA's RTX 6000 Ada datasheet (2647623, FEB23): "Form factor
    4.4' H x 10.5' L, dual slot, full height"; the Ada quick-start guide: "The RTX
    6000, RTX 5000, RTX 4500, RTX 4000 SFF and RTX 2000 are dual-slot GPUs and
    will require removing two adjacent slot covers". The face is one plate about
    38 across (`face-outline`). The card declares `slot-width: 2` as
    docs/pcie-two-slot-bays-design.md R1 defines it.
  sources: >-
    NVIDIA RTX 6000 Ada Generation datasheet (2647623, FEB23),
    https://dam-cdn.nvd.orangelogic.com/AssetLink/83uo5f1t66fkm0dh16mi5uq1412l7ux5.pdf.
    PNY's copy, https://www.pny.com/File%20Library/Company/Support/Product%20Brochures/NVIDIA%20RTX/English/nvidia-rtx-6000-ada-datasheet.pdf,
    and PNY's NVIDIA Professional Graphics line card (REV. 09.14.26),
    https://www.pny.com/File%20Library/Company/Support/linecards/pro-viz-gpus/NVIDIA-Professional-Graphics-Linecard.pdf,
    for the order codes. NVIDIA's RTX Ada Generation online quick-start guide,
    https://images.nvidia.com/aem-dam/Solutions/design-visualization/quadro-product-literature/proviz-rtx-ada-gen-online-qsg.pdf:
    the box contents, the dual-slot statement and "connect the auxiliary power
    cable ... to the 16-pin PCIe CEM5 connector on the back edge". NVIDIA's power
    guide DA-07261-001_v15 (27 July 2023),
    https://images.nvidia.com/aem-dam/en-zz/Solutions/design-visualization/quadro-product-literature/DA-07261-001_v15.pdf,
    table 1 (300 W, CEM5 16-pin). NVIDIA publishes no dimensioned drawing of this
    card: the geometry is measured on PNY's photographs (below) and carried over
    from the standards. The photographs are named by their files and licence is
    not stated; facts read from them, pictures not used.
  reference-photos: >-
    reference - PNY's product images for the RTX 6000 Ada, under
    https://d2vfia6k6wrouk.cloudfront.net/productimages/786342ec-d6fe-4d2b-9baf-af1600c0648e/images/:
    nvidia-rtx-6000-left.png (the bracket straight on, 188 x 568 px, its tip at the
    bottom), nvidia-rtx-6000-front.png (the broad side straight on, 712 x 325 px)
    and the 3/4 views nvidia-rtx-6000-3qtr-left.png and
    nvidia-rtx-6000-3qtr-top-left.png. THE `top` PICTURE IS A 3/4 VIEW FROM
    ABOVE, NOT A TOP EDGE STRAIGHT ON: the card is seen at about 45 degrees, so
    nothing on the top edge is scaled from it. No back view of this card exists in
    the intake. Each picture was checked to be this card: the silver bracket with
    four DisplayPorts and a framed vent window, the gold-ringed blower on the
    broad side; its checksum differs from every other card's in the intake. MM PER
    PIXEL: bracket photograph 0.2198 along the plate (4.549 px/mm) and 0.2233
    across it (4.478 px/mm), 1.6 percent apart; broad-side photograph 0.392 along
    the card (2.55 px/mm) and 0.390 across it (2.565 px/mm), 0.6 percent apart.
    All are set out under `face-outline` and `body-fan`.
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2, PCIe
    CEM 5.0 figure 11-5). h is two slots: the single bracket's 21.59 plus one 20.32
    slot pitch, 41.91, as on the A100 and the RTX A6000.
  depth: >-
    datasheet - 10.5 in, exactly 266.70, from the bracket's outer face as
    nvidia/rtx-a6000@1 reads the same figure. On the broad-side photograph the card
    runs 680 px from the bracket's outer face to the far end, which at 2.55 px/mm
    is 266.7, and the shroud's 250 px at 2.565 px/mm are 97.5 across against the
    board's 97.9, so the datasheet's length holds to the photograph's accuracy
    (the scale along the card is taken from the datasheet's length, so that
    check is the across one).
  face-outline: >-
    photo-measured - the bracket photograph (nvidia-rtx-6000-left.png) turned a
    quarter turn into this frame, tip at the left and the board's side at the top.
    Its scale across is the two retention tabs, whose centres are 91 px apart
    (365 and 456), the 20.32 slot pitch, so 4.478 px/mm (0.2233 mm/px); its
    scale along is the plate, 546 px from the tip (row 687) to the flange's fold
    (row 141), the standard's 120.02, so 4.549 px/mm (0.2198 mm/px). The two are
    1.6 percent apart, which is the photograph's perspective; each axis uses its
    own. The tabs are 46 px wide, 10.3 against CEM's 10.2. At that scale the first
    tab's centre is put at y 12.38, where std/pcie-bracket-fh@2 puts its own. Read
    that way the plate's board-side edge is at y 3.45 (5.23 below the step 21.3
    from the tip) and its far edge at 41.41 (40.29 below the step), so THIS PLATE
    IS 38.0 ACROSS, wider than the A100's 35.9 and inside the 41.91 envelope. The
    tip's chamfers, the V notch between the tabs (apex 10.8 from the tip, read at
    row 638), the 7.25 long tabs and the flange are the standard's and were read to
    agree on this photograph. The plate's edges are read to about 0.5 mm.
  face-displayports: >-
    photo-measured - four DisplayPort receptacles along the board's side, at the
    same scales. Each shell is 18.6 long and 7.6 across (y 5.68 to 13.27), with the
    D shape's chamfer at the flange end on the window's side. Their centres along
    the bracket are 40.12, 61.55, 82.65 and 103.42, a pitch of 21.1. Readings are
    good to about 0.5 mm. The photograph prints no port number (checked enlarged), so
    no source numbers these four: `display-port-1` is the receptacle nearest the tip
    (x 30.82) and `display-port-4` the one nearest the flange by the order the
    RTX A6000 and RTX A4000 use, which is a convention and not a reading (the RTX
    4500, 4000 and 2000 Ada photographs print their numbers from the flange end).
    THE LIBRARY HAS NO DISPLAYPORT PART OR INTERFACE, so each
    is an element of class `connector` painted in the skin and not a seated part;
    nothing mates it and the module type carries no port for them (the
    `display-ports` attr says 4 x DisplayPort 1.4a, the datasheet's words). The pins
    are drawn as two rows of dashes, not counted.
  face-grille: >-
    photo-measured - one framed vent window beside the DisplayPorts. The bezel is
    87.3 long and 25.0 across (x 29.24 to 116.5, y 14.84 to 39.85); the dark window
    is x 33.5 to 111.0 and y 15.5 to 38.3, with the heat-sink fins behind it: 35
    lines on a pitch of 2.17 (9.9 px), the first at x 36.05 and the last at 109.93.
    A luminance scan down the window's centre column of nvidia-rtx-6000-left.png
    (rows 175 to 540, columns 410 to 450) finds a line every 9.5 to 10 px (the
    Fourier period is 9.8 px, 33.6 cycles over 330 px), alternating a bright line
    (the 18 drawn as `#fins`, 4.34 apart) and a dimmer one between (the 17 drawn as
    `#fins-dim`); the fins are drawn as straight lines from the window's top to its
    bottom, and their depth and the dim lines' true nature (a second fin edge or the
    gap's shadow) are not read. Four Torx screws stand
    at x 31.21 and 113.43 and y 17.74 and 36.5, at the window's four corners, heads
    about 4.4 across. The window's corners are cut round the screws in the
    photograph; that is not drawn, and the bezel's raised edge is a painted line, not
    relief.
  face-markings: >-
    photo-measured - the bracket carries no lamp, no label and no printing.
  thickness: >-
    estimated - the datasheet states no thickness. The shroud's far face is put at
    y 40.0, as nvidia/rtx-a6000@1 has it, 1.4 inside the bracket's far edge (41.41).
    The bracket photograph's plate is 38.0 across, which bounds a dual-slot card at
    41.91.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the A100 are. The board, and the
    bracket's keyed side, are at the top (small y), which is where the
    DisplayPorts are.
  body: >-
    the board, its edge and the pads follow PCIe CEM 5.0 (figures 6-5 and 11-3, as
    nvidia/mcx755106-fh@1 has them): the card height 111.15, the lower edge 13.25
    above the finger datum W and the key datum 57.15 behind the bracket, so the top
    edge is at x 126.31. NVIDIA prints no figure for this card. The broad-side
    photograph agrees on the height: the shroud runs 250 px at 2.565 px/mm, 97.5
    against the board's 97.9. THE PHOTOGRAPH'S FINGERS DO NOT FOLLOW CEM exactly:
    the gold run is 197 to 400 px, 48.2 to 127.8 behind the bracket's outer face,
    against CEM's 45.35 to 128.95 (4 percent short), so the body keeps CEM's and
    this is a gap. The lower edge has a notch at 141.0 to 159.0 behind the bracket,
    3.1 deep (8 px), with chamfered ends: it is drawn as one box 18.0 long.
  body-shroud: >-
    photo-measured - the shroud is glossy black, one slab from the board's
    component face (y 6.01) to the far face (40.0), the outline of the board, split
    at the notch as the board is. The broad-side photograph is one black surface
    with a bright diagonal reflection, which is light and not geometry. The back of
    the card is not seen in any photograph held, so there is no backplate and the
    board's rear is bare, as nvidia/rtx-a6000@1 has it (a gap).
  body-fan: >-
    photo-measured - the blower's opening on the broad side. In PNY's side
    photograph (712 x 325 px) its gold ring is about 188 px across, centred at px
    (624, 366). At 2.55 px/mm along the card and 2.565 across, the ring is 73.6
    across, its centre 50.2 from the far end and 48.3 below the top edge, as the
    RTX A6000's (73.8, 50.4 and 47.9). The hub is about 97 px, 38 across. The 56
    blades are drawn as short strokes leaning 10 degrees the way the photograph's
    do (a gradient measurement on the photograph gives 14 degrees): their number is
    read to about 4 and their lean is schematic. Painted on the broad side, not an opening
    in the 3D body.
  body-top-edge: >-
    estimated - PNY's 3/4 view from above shows the top edge black with a champagne
    strip of heat-sink fins along most of its length, dipping where the blower's
    ring comes near, two connectors and their labels at the bracket end, the card's
    model name in small print, and the maker's mark near the far end. The view is
    at about 45 degrees and cannot be scaled, so every place here is estimated: the
    strip from 46 to 248 behind the bracket and 14.0 to 34.0 across the card, its
    bay from 168 to 220 behind it, "RTX 6000" at 6.0 behind it, 2.4 tall. THE
    STEREO AND SYNC CONNECTORS ARE NOT DRAWN (no straight-on view shows them at
    scale; the library has no part). THE MARK IS NOT DRAWN: its box (232 to 254
    behind the bracket, 7.6 to 12.2 across) is reserved as `logo-zone` in
    `skins/body-right.svg`, estimated. The fin ridge pitch (1.2) is estimated.
  body-power-connector: >-
    estimated - the datasheet says "Power connector 1x PCIe CEM5 16-pin" and NVIDIA's
    power guide DA-07261 table 1 says "CEM5 16-pin", 300 W. The housing is drawn at
    nvidia/l40s@1's place for its 12VHPWR (104.1 to 123.0 on the card's x, 9.1
    across the board's component face), black, with twelve power cells in two
    columns of six on a 3.0 pitch and four sense cells; that is the L40S housing
    measured on a photograph of that card, and no photograph of this card's end is
    held. NVIDIA's render of the RTX 5000 Ada shows the connector at the same
    corner. THE PORT is `aux-power` on the rear face (`faces.rear`,
    nvidia/rtx-6000-ada-tail@1): std/12vhpwr-header@1, which presents
    `pcie-12vhpwr` for a 16-pin cable and which the card exports as a power port.
  body-end: >-
    estimated - a closed black end plate 1.0 thick, 1.4 inside the card's length,
    and the connector housing standing 0.2 proud of it, as nvidia/rtx-a6000@1 has
    it. No photograph shows the end.
  body-foot: >-
    estimated - the bracket's two retention tabs below the card are the face's
    (`skins/default.svg`), 0.9 thick.
  power: >-
    datasheet - total board power 300 W in the datasheet (2647623, FEB23), the
    PNY line card and DA-07261 table 1. The sources agree.
  memory: >-
    datasheet - 48 GB GDDR6, 384-bit, 960 GB/s, ECC.
  pcie: >-
    datasheet - PCIe 4.0 x16.
  nvlink: >-
    datasheet - "NVIDIA NVLink: No". The card has no NVLink connector.
  part-numbers: >-
    datasheet - PNY's datasheet: "Retail: VCNRTX6000ADA-PB Single Bulk:
    VCNRTX6000ADA-SB Bulk: VCNRTX6000ADA-BLK Education: VCNRTX6000ADA-EDU"; PNY's
    line card adds VCNRTX6000ADASYNC-PB and NVIDIA part 900-5G133-2250-000.
    NVIDIA's own datasheet gives none.
  weight: >-
    not stated - no datasheet held gives a weight for the card.
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) a straight-on view of the top edge and the far
    end (needs-photo; the top edge's strip is estimated, the STEREO and SYNC
    connectors are not drawn and the end is a schematic); (2) the DisplayPort part
    and interface, which the library lacks (the four are painted, not seated);
    (3) the thickness, which no source states (vendor-silent); (4) the fingers'
    true run, which the broad-side photograph draws 4 percent shorter than CEM
    (needs-drawing); (5) the card's back, which the intake holds no photograph of
    (needs-photo; the board's rear is bare); (6) a weight (vendor-silent in the
    documents held); (7) the lifecycle: no end-of-life notice was searched for;
    (8) no dimensioned drawing of any active workstation card (the intake's handoff
    list, item 1).
