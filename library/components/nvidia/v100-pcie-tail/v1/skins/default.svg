<svg xmlns="http://www.w3.org/2000/svg" width="97.9mm" height="38mm" viewBox="0 0 97.9 38">
  <!-- nvidia/v100-pcie-tail: the V100 PCIe's far end seen from behind, from
       2.0 above the board's outer face (y 0) to the shroud's far wall (y 38.0).
       THE TOP EDGE IS AT THE LEFT: x' = 126.31 less the card's x. A black end
       plate over the board's side, the shroud's rim below it round a dark
       opening, and the CPU 8-pin header composed over the plate. The fins are
       not drawn (provenance end-plate). Drawn in-house; nothing is traced. -->
  <rect id="end-plate" x="0" y="0" width="97.9" height="12.4" fill="#17191c"/>
  <rect id="shroud-rim" x="0" y="12.4" width="97.9" height="25.6" fill="#3a3d42"/>
  <rect id="opening" x="2.1" y="12.4" width="93.7" height="23.5" fill="#07080a"/>
</svg>
