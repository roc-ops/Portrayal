format: 1
kind: module
name: rtx-3090-fe
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA GeForce RTX 3090 Founders Edition, a dual-axial-fan Founders Edition
  card that is three slots wide. The bracket face carries three DisplayPort
  and one HDMI receptacle on the board's side, with four vent panes below
  them. The shroud is the X-shaped Founders Edition design. Its fan pocket is
  at the far end and its model name is printed on the other pocket. The heat
  sink's fins show along the top edge, where its NVLink connector is near the
  bracket end. Its power connector is a 12-pin receptacle in a notch in the top
  edge. It plugs into one riser slot and covers the two beside it.
slot-width: 3
size: {w: 120.02, h: 62.23, d: 313}
size-confidence: {w: registry, h: registry, d: datasheet}
unplaced: >-
  no bay in the library lists this card in `accepts`, and no bay states `interface: pcie-fh`. The card
  does not state `mates: pcie-fh`: the library has not begun that migration (spec/tests/test_cards_by_interface.py
  holds it at no part until it does). No document held says any server takes a consumer card.
attrs:
  model: 'RTX 3090'
  edition: 'Founders Edition'
  role: gpu
  form-factor: 'Full-height, three-slot, 313 mm x 138 mm'
  pcie-connector: x16
  pcie-height: full
  power-draw-max-w: 350
  power-input: 'host PCIe slot and one 12-pin auxiliary connector; an adapter from two PCIe 8-pin cables to the 12-pin plug is in the box'
  memory: '24 GB GDDR6X, 384-bit'
  display-ports: '3 x DisplayPort 1.4a and 1 x HDMI 2.1 on the bracket'
  nvlink: 'NVIDIA NVLink (SLI-ready), edge connector on the top of the card near the bracket end; the bridge is a separate part'
  cooling: active
  airflow: 'axial fan on the broad side; a flow-through heat sink exhausts through the second side and the top edge'
faces:
  rear: {ref: nvidia/rtx-3090-fe-tail@1}
  plan: {ref: common/pcie-card-plan@1}
provenance:
  slot-width: >-
    datasheet - NVIDIA's 30-series page prints Founders Edition 'Slot 3-Slot' for the 3090 and the case-clearance diagram
    draws '3 Slots' beside 12.3 in by 5.4 in. The card declares `slot-width: 3` as the RTX 4090 does (the schema allows up to
    4). The face is one plate three slot pitches across, the 4090's outline. docs/cards-by-interface-design.md (#1171) adds
    `mates: pcie-fh` for a card; the mechanism is in the tools but a test holds every part to no `mates: pcie-fh` until the
    migration runs, so this card does not state it.
  sources: >-
    NVIDIA GeForce RTX 3090 Founders Edition - NVIDIA's GeForce RTX 3090 and 3090 Ti page and the 30-series page (fetched
    2026-10-07), https://www.nvidia.com/en-us/geforce/graphics-cards/30-series/rtx-3090-3090ti/ and
    https://www.nvidia.com/en-us/geforce/graphics-cards/30-series/ ; NVIDIA GeForce RTX 3090 user guide, v01 and v02 (raster),
    https://www.nvidia.com/content/geforce-gtx/GEFORCE_RTX_3090_USER_GUIDE_v01.pdf and
    https://www.nvidia.com/content/geforce-gtx/GEFORCE_RTX_3090_USER_GUIDE_v02.pdf (page 6's figure is the same in both, and
    both misspell it 'HDM 2.1'); NVIDIA's compare page, https://www.nvidia.com/en-us/geforce/graphics-cards/compare/ ;
    NVIDIA's case-clearance diagram, 1362218-gf-comp-guide-3090-case-size-d@2x.png under
    https://www.nvidia.com/content/dam/en-zz/Solutions/geforce/ampere/rtx-3090/ ; the 3/4 gallery pictures
    geforce-rtx-3090-product-gallery-full-screen-3840-1.jpg, -2 (3838 x 2160) and -3 under the same folder; PCI Express CEM 5.0
    via the library's standards registry. NVIDIA publishes no dimensioned drawing of any GeForce card. The pictures are
    NVIDIA's; their licence is not stated, so facts were read from them and no picture is copied.
  reference-images: >-
    estimated - NO STRAIGHT-ON PICTURE OF THE RTX 3090 EXISTS in the intake. What is held: the guide's raster figure (page 6,
    1173 x 885, an oblique line drawing), the 3/4 gallery pictures (3840 x 2160; -2 shows the name pocket and the fan pocket
    from above and the near end with the 'GEFORCE RTX' lettering, -1 a low view of the fan end, -3 a close-up of the fins and
    the 'RTX 3090' on the rim) and the case diagram. THE 3/4 PICTURES ARE NOT SCALED: no mm per pixel is stated for any view,
    because none is square-on; a rectification was not attempted on -2 because the face's four corners cannot be placed (the
    near corner is hidden by the end and the far corner is cut by the top edge). So the broad side is borrowed: see
    provenance body-shroud. The 3D reference survey holds no RTX 3090 model; the intake's GrabCAD folders hold two (an
    'RTX 3090 v5' and an 'nvidia-rtx-3090-nvlink') under GrabCAD's community terms (non-commercial, internal use), and the line's
    COVERAGE says that licensing for a commercial tool is undecided, so neither was opened.
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2, PCIe CEM 5.0 figure 11-5). h is three slots: the
    single bracket's 21.59 plus two 20.32 slot pitches, 62.23.
  depth: >-
    datasheet - NVIDIA's page prints the length as 12.3 in (313 mm), taken from the bracket's outer face as
    nvidia/rtx-4090-fe@1 reads the same kind of figure. The case diagram's 12.3 in is 312.4 mm and its 5.4 in is 137.2 mm
    against the page's 313 and 138.
  face-outline: >-
    estimated - the plate is the RTX 4090's (std/pcie-bracket-fh@2's outline with a third tab and a far edge at 61.5):
    120.02 long, the 0.8 fold at the flange end, ten-wide retention tabs on the 20.32 slot pitch with the 4.1 board-side step
    and the V notches between them. The raster guide shows 3 tabs. No straight-on view of any GeForce bracket exists. The
    bracket is taken to be the same part as the 4090's and the 4080's.
  face-ports: >-
    estimated - the port places are BORROWED from the RTX 4090 contract (nvidia/rtx-4090-fe@1, batch 1, merged; the RTX 4070
    SUPER's are the same): the three DisplayPort shells are at 95.7, 78.0 and 59.9 from the tip and the HDMI shell at 42.25,
    each good to about 2 mm. The 3090's OWN guide is raster, and the figure's oblique view reads the places 107.7, 88.8, 68.4
    and 49.2 (fractions of the plate along the same oblique axis, 0.90, 0.74, 0.57 and 0.41, rough to 0.03): the HDMI differs
    by 6.5 mm from the borrowed one. The 4090's spacing is used because it keeps a gap between every shell (1.3, 1.7 and
    3.2 mm); the bracket is taken to be the same part. The order, flange end to tab end, is DisplayPort, DisplayPort,
    DisplayPort, HDMI, as the guide names them ('DisplayPort 1.4a Connectors (Qty 3)', 'HDM 2.1 Connector'). A DisplayPort
    shell is drawn 16.4 long and 7.1 across and an HDMI shell 14.5 by 6.0: those sizes are estimated. THE LIBRARY HAS NO
    DISPLAYPORT OR HDMI PART OR INTERFACE, so each receptacle is an element of class `connector` painted in the skin and not
    a seated part. NO STRAIGHT-ON VIEW OF ANY GEFORCE BRACKET EXISTS, so this face is the least certain part of the card.
  face-vent: >-
    estimated - the raster guide shows four grilles in a row below the ports and three screws at the tab end. Places are the
    4080 SUPER's: the four panes from about 25 to 111 along, each 20.2 long with 1.5 bars, and the screws at x 17 and y
    12.4, 32.7 and 53.0 (the slot centres). No hole is drawn at the flange.
  face-markings: >-
    estimated - the guide draws no lamp, label or printing on the bracket and no straight-on picture exists to resolve any (no
    control in the same image can be named, so this is a gap, not a reading).
  thickness: >-
    estimated - NVIDIA prints 3-Slot and no thickness for this card (the 3090's guide has no clearance box in its text layer).
    The shroud's far face is put at y 60.3, 1.9 inside the 62.23 three-slot envelope, as nvidia/a100-pcie-80gb@1 does. The
    backplate is not drawn.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the A100 are. The board, and the bracket's keyed side, are at the top (small
    y), which is where the DisplayPorts are. The broad side drawn is the face the 3/4 gallery picture -2 shows (the name pocket
    toward the far end of the picture, the fan pocket at the end carrying 'GEFORCE RTX'); the guide's figure shows the other
    face, with the fan beside the bracket and the name pocket at the far end, and which face is which end was not settled
    (the same open point as the other cards of this line).
  body: >-
    estimated - the board and its edge follow PCIe CEM 5.0. The shroud is the 4090's scaled to NVIDIA's 313 mm by 138 mm: it is
    taken 126.02 high (the 4090's 125.02, 1.0 more for the card's 1.0 more of height), x 26.73 to 152.75. The board box runs
    159.1 behind the bracket and is hidden. No document gives a shroud height or length of this card.
  body-shroud: >-
    estimated - one dark slab from the board's component face (y 6.01) to the far face (60.3), in three boxes split at the top
    edge's notch (provenance body-power-connector) so that the notch is a real step in 3D. Its broad side is painted: the
    X-shaped waist, the two pockets with their champagne rims, the louvres beside the fan pocket and the printed model name
    ('RTX 3090', plain text; the maker's mark is a logo-zone). The art is the RTX 4090 skin's (itself the 4070 SUPER's
    elevation scaled), with the name pocket lengthened by 9 mm to the 3090's 313 and the fan pocket moved on by it; it was
    compared by eye with the 3/4 gallery pictures, whose name pocket, X waist and fan pocket with a cut corner it follows, and
    it is NOT a measurement of this card. The BACK of the card (its backplate and the second fan the Founders Edition design
    has there) is shown in no picture at its scale and is not drawn.
  body-fan: >-
    estimated - the fan in the far pocket is the 4090 skin's: ring about 113 mm, hub 41 mm, 11 blades (the 3080's counted
    count; the gallery pictures' fan is too oblique to count). The blades' lean is the 3080's and 4090's.
  body-top-edge: >-
    estimated - the top edge is seen only in 3/4 views and the guide's oblique figure. What is drawn: the shroud's end caps in
    champagne (the 3080's colour: the gallery's rims and caps are champagne) and, between them from 100 to 190 behind the
    bracket (read on the guide's figure, where the fins start about 0.31 and end about 0.58 of the way along; good to about 10
    mm), the heat sink's fins, one every 1.6 mm. The lettering on the far cap is a maker's wordmark and is reserved as
    `logo-zone` in skins/body-right.svg, not drawn.
  body-nvlink: >-
    estimated - NVIDIA's 30-series page marks NVLink 'Yes' for the 3090 and the guide's figure calls out 'GeForce RTX NVLink
    Connector' on the top edge near the bracket end (from about 0.07 to 0.19 of the way along: 22 to 60 mm behind the
    bracket, rough). It is painted on the top-edge skin only: a dark recess with its gold contacts on the board's edge. THE
    NVLINK BRIDGE IS A SEPARATE PART WITH ITS OWN PART NUMBER, NOT HELD, so nothing is composed or exported for it (the library's
    `nvidia/nvlink-bridge-a100-2slot@1` is the A100's bridge, not this card's).
  body-power-connector: >-
    estimated - NVIDIA's page says 'Supplementary Power Connectors: 2x PCIe 8-pin (adapter to 1x 12-pin included)' and the
    guide's callout reads '12-pin Power Connector', drawn on the top of the card in the fin run about midway (about 0.50 of the
    way along). THE REGISTRY HAS NO 12-PIN INTERFACE (docs/connectors-gpu-design.md and spec/schemas/connectors.yaml name
    EPS12V, PCIe 8-pin, 12VHPWR and 12V-2x6 only), so the connector is a plain housing in the 3D body (an 18.0 x 9.3 x 8.0 box
    in the notch, from the guide's 2 x 6 inset) and the card exports no power port. The card's plan face is
    common/pcie-card-plan@1, as the 3080's. The notch's place is read on the guide and is a guess in size: centred 160 behind
    the bracket, 23 long, 4.5 deep (the 3080's notch, moved to 0.5 of 313). The adapter cable is in the box and is not
    modelled.
  body-end: >-
    estimated - a closed dark end plate 1.0 thick at the far end. No square-on picture shows the end. The rear face
    (`faces.rear`, nvidia/rtx-3090-fe-tail@1) is a plain plate.
  power: >-
    datasheet - NVIDIA's page: 'Graphics Card Power (W) 350' for the 3090 (the Founders Edition table reads 450 / 350 for the
    3090 Ti and the 3090: the 3090 is 350). The figure is the board's total, filed as the maximum. 750 W is NVIDIA's required
    system power.
  memory: >-
    datasheet - 24 GB GDDR6X, 384-bit. NVIDIA's 30-series page, Memory Specs.
  part-numbers: >-
    not stated - no document held gives an order code or part number for this Founders Edition card (NVIDIA sells it direct and
    prints none on the pages held).
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) a straight-on view of the I/O bracket (needs-photo; the whole face is estimated from the
    other cards' vector guides and the standard); (2) a straight-on view of the broad side, the top edge and the far end
    (needs-photo; the shroud is borrowed from the 4090's skin); (3) the DisplayPort and HDMI parts and interfaces, and the
    12-pin connector's interface, which the library lacks; (4) the card's back, its backplate and the second fan (needs-photo);
    (5) the NVLink bridge and its part number (vendor-silent in the documents held); (6) a weight and an order code
    (vendor-silent); (7) PCIe generation (vendor-silent in the page tables held); (8) the lifecycle, which was not searched;
    (9) the dimensioned FE board outline, which NVIDIA does not publish; (10) the 3D reference: none is held with a licence
    that clearly allows its use.
  conflicts: >-
    CONFLICTS SETTLED: (a) the case diagram's 12.3 in x 5.4 in read 312.4 x 137.2 mm against the page's 313 x 138: the page's
    are used; (b) the raster guide's figure puts the ports up to 6.5 mm from the 4090's places: the 4090's places are
    used, because they keep a gap between every shell (the bracket is taken to be the same part); (c) the figure and both guide revisions say 'HDM 2.1': the text is
    HDMI 2.1; (d) the family page's Founders Edition table lists the 3090 and 3090 Ti side by side at 350 and 450 W: the 3090 is
    350 W; (e) the guide names the connector '12-pin Power Connector' and the family page '2x PCIe 8-pin (adapter to 1x 12-pin
    included)': both are true.
