    <circle id="thumbscrew" cx="77.7" cy="10.9" r="4.75" fill="#2e3033" stroke="#0c0d0e" stroke-width="0.3"/>
    <circle cx="77.7" cy="10.9" r="2.4" fill="#5a5d61"/>
    <path d="M75.9 10.9 H79.5 M77.7 9.1 V12.7" stroke="#17181a" stroke-width="0.55" stroke-linecap="round"/>
  </g>
