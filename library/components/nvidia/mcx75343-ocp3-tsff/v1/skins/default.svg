<svg xmlns="http://www.w3.org/2000/svg" width="82.5mm" height="17.8mm" viewBox="0 0 82.5 17.8">
  <!-- nvidia/mcx75343-ocp3-tsff: ConnectX-7 MCX75343A on its thumbscrew (pull tab)
       TSFF bracket, 82.50 x 17.80 (OCP 3.0 user manual, bracket drawing, page 84).
       Original art measured off that drawing on its printed 82.50 width, so
       positions are good to about half a millimetre. The OSFP window and the two
       lamps are composed parts. The tab housing outline is an estimate. -->
