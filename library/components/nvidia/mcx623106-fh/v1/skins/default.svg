<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="21.59mm" viewBox="0 0 120.02 21.59">
  <!-- nvidia/mcx623106-fh: MCX623106A on its tall bracket. The outline, tip
       and keyed flange are std/pcie-bracket-fh@2, composed BEHIND this; what is drawn
       here is the punched plate: vents, light-pipe slots and port numerals.
       TIP AT THE LEFT - NVIDIA draws the card tip-right, so this is its
       figure turned a half-turn and the numerals read upside down. -->
  <!-- METAL FILLING THE OPENING: the bracket colour, 0.3 proud all round so
       the opening stroke leaves no ghost; the holes are punched in it. -->
  <rect id="plate" x="19.66" y="6.05" width="90.50" height="12.66" fill="#9aa1a8"/>
  <g id="vents"><rect x="74.85" y="14.03" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="74.85" y="8.69" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="25.66" y="14.03" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="25.66" y="8.69" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="20.29" y="14.03" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="20.29" y="8.69" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="14.87" y="14.03" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="14.87" y="8.69" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="80.20" y="14.04" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="80.20" y="8.69" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="85.72" y="14.04" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="85.72" y="8.69" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="91.07" y="14.04" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="91.07" y="8.69" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="96.50" y="14.04" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="96.50" y="8.69" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="101.85" y="14.04" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="101.85" y="8.69" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="107.38" y="14.04" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="107.38" y="8.69" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="112.81" y="14.04" width="2.70" height="4.05" rx="0.60" fill="#17191c"/><rect x="112.81" y="8.69" width="2.70" height="4.05" rx="0.60" fill="#17191c"/></g>
