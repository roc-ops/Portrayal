format: 1
kind: module
name: rtx-4500-ada
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA RTX 4500 Ada Generation (24 GB GDDR6), an actively cooled dual-slot
  full-height full-length workstation card with a blower. The bracket face is
  dark nickel with four DisplayPort connectors on the board's side and one framed
  vent window beside them. The shroud is matte dark grey with the blower's opening
  on its broad side and a black backplate. The heat sink's fins show along the
  top edge. It has one 16-pin CEM5 power connector at the far end by the top
  edge. It plugs into one riser slot and covers the one beside it.
slot-width: 2
size: {w: 120.02, h: 41.91, d: 266.70}
size-confidence: {w: registry, h: registry, d: datasheet}
unplaced: >-
  no bay in the library lists this card in `accepts`. A riser bay names each card
  it takes by hand (docs/cards-by-interface-design.md, status proposed: no
  interface or mates field exists on a card or a bay today), and no document held
  says any server takes a workstation card, so none was added and seating it
  would be an edit to an existing component that this change does not make.
attrs:
  model: 'RTX 4500 Ada'
  part-numbers: 'PNY VCNRTX4500ADA-PB (retail), YVCNRTX4500ADA-KIT (kit), VCNRTX4500ADA-EDU (education), VCNRTX4500ADA-BLK (bulk), VCNRTX4500ADASYNC-PB (with the Sync card); NVIDIA 900-5G132-2260-000'
  role: gpu
  form-factor: 'Full-height, full-length (FHFL) 4.4 in x 10.5 in, dual slot'
  pcie-connector: x16
  pcie-generation: 4
  pcie-height: full
  power-draw-max-w: 210
  power-input: 'host PCIe slot and one PCIe CEM5 16-pin (12VHPWR) auxiliary connector; a 2x PCIe 8-pin to 1x CEM5 16-pin adapter is in the box'
  memory: '24 GB GDDR6, 192-bit, 432 GB/s'
  display-ports: '4 x DisplayPort 1.4a on the bracket'
  cooling: active
  airflow: 'blower; it draws air from the card''s broad side and exhausts toward the bracket'
  nvlink: 'none'
faces:
  rear: {ref: nvidia/rtx-4500-ada-tail@1}
provenance:
  slot-width: >-
    datasheet - NVIDIA's RTX 4500 Ada datasheet (2895216, OCT23): "Form factor
    4.4' H x 10.5' L, dual slot"; the Ada quick-start guide: "The RTX 6000, RTX
    5000, RTX 4500, RTX 4000 SFF and RTX 2000 are dual-slot GPUs and will require
    removing two adjacent slot covers". The face is one plate about 37 across
    (`face-outline`). The card declares `slot-width: 2` as
    docs/pcie-two-slot-bays-design.md R1 defines it.
  sources: >-
    NVIDIA RTX 4500 Ada Generation datasheet (2895216, OCT23),
    https://www.nvidia.com/content/dam/en-zz/Solutions/products/workstations/nvidia-rtx-4500-datasheet.pdf.
    PNY's print (2819963, r4), https://www.pny.com/file%20library/company/support/product%20brochures/nvidia%20rtx/english/pny-print-nvidia-rtx-4500-datasheet-2819963-r4.pdf,
    and PNY's NVIDIA Professional Graphics line card (REV. 09.14.26),
    https://www.pny.com/File%20Library/Company/Support/linecards/pro-viz-gpus/NVIDIA-Professional-Graphics-Linecard.pdf,
    for the order codes. NVIDIA's RTX Ada Generation online quick-start guide,
    https://images.nvidia.com/aem-dam/Solutions/design-visualization/quadro-product-literature/proviz-rtx-ada-gen-online-qsg.pdf:
    the box contents, the dual-slot statement and the 16-pin CEM5 connector.
    NVIDIA's power guide DA-07261-001_v15 (27 July 2023),
    https://images.nvidia.com/aem-dam/en-zz/Solutions/design-visualization/quadro-product-literature/DA-07261-001_v15.pdf,
    for the CEM5 16-pin connector's description (the guide predates this card and
    does not list it). NVIDIA publishes no dimensioned drawing of this card: the
    geometry is measured on PNY's photographs (below) and carried over from the
    standards. The photographs are named by their files and licence is not stated;
    facts read from them, pictures not used.
  reference-photos: >-
    reference - PNY's product images for the RTX 4500 Ada, under
    https://d2vfia6k6wrouk.cloudfront.net/productimages/2e1a48ed-8429-4a5b-8117-b05800cc44e0/images/:
    nvidia-rtx-4500-ada-left.png (the bracket straight on, 167 x 502 px, its tip at
    the bottom), nvidia-rtx-4500-ada-front.png (the broad side straight on, 630 x
    286 px), nvidia-rtx-4500-ada-back.png (the backplate straight on, 738 x 332 px)
    and the 3/4 view nvidia-rtx-4500-ada-3qtr-left.png. NO TOP-EDGE PICTURE IS
    HELD. Each picture was checked to be this card (four DisplayPorts and a framed
    vent window on a dark bracket, the blower on a matte broad side with the step
    138 behind the bracket). The same four files are served under the RTX 5000
    Ada's name by PNY (see nvidia/rtx-5000-ada@1). MM PER PIXEL: bracket
    photograph 0.2506 along the plate (3.991 px/mm) and 0.2572 across it (3.888
    px/mm), 2.6 percent apart; broad-side photograph 0.443 along the card (2.257
    px/mm) and 0.445 across it (2.248 px/mm), 0.4 percent apart; back photograph
    0.3827 (2.613 px/mm) both ways. All are set out under `face-outline`,
    `body-fan` and `body-backplate`.
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2, PCIe
    CEM 5.0 figure 11-5). h is two slots: the single bracket's 21.59 plus one 20.32
    slot pitch, 41.91, as on the A100 and the RTX A6000.
  depth: >-
    datasheet - 10.5 in, exactly 266.70, from the bracket's outer face as
    nvidia/rtx-a6000@1 reads the same figure. On the broad-side photograph the card
    runs 602 px from the bracket's outer face to the far end, which at 2.257 px/mm
    is 266.7 (the scale along is set by that length), and the shroud's 220 px at
    2.248 px/mm are 97.9 across, the board's height; the back photograph agrees at
    its own scale (697 px, 2.613 px/mm, 266.7).
  face-outline: >-
    photo-measured - the bracket photograph (nvidia-rtx-4500-ada-left.png) turned a
    quarter turn into this frame, tip at the left and the board's side at the top.
    Its scale across is the two retention tabs, whose centres are 79 px apart
    (368.5 and 447.5), the 20.32 slot pitch, so 3.888 px/mm (0.2572 mm/px); its
    scale along is the plate, 479 px from the tip (row 650) to the flange's fold
    (row 171), the standard's 120.02, so 3.991 px/mm (0.2506 mm/px). The two are
    2.6 percent apart, which is the photograph's perspective; each axis uses its
    own. The tabs are 40 px wide, 10.3 against CEM's 10.2. At that scale the first
    tab's centre is put at y 12.38, where std/pcie-bracket-fh@2 puts its own. Read
    that way the plate's board-side edge is at y 4.28 (5.31 below the step 20.6
    from the tip) and its far edge at 41.57 (40.55 below the step), so THIS PLATE
    IS 37.3 ACROSS, wider than the A100's 35.9 and inside the 41.91 envelope. The
    tip's chamfers, the V notch between the tabs, the 7.25 long tabs and the flange
    are the standard's and were read to agree on this photograph. The plate's edges
    are read to about 0.5 mm. The plate is printed with a small warning triangle
    (outline only) at x 21.5 to 27.1 and y 10.6 to 16.0.
  face-displayports: >-
    photo-measured - four DisplayPort receptacles along the board's side, at the
    same scales. Each shell is 18.0 long and 7.5 across (y 5.8 to 13.3), with the
    D shape's chamfer at the flange end on the window's side. Their centres along
    the bracket are 40.09, 62.14, 82.94 and 103.73, a pitch of 21.2. The photograph
    prints the port numbers 1 to 4 in faint small figures, each on the flange side
    of its receptacle, 1 beside the flange-most one (legible only when the picture
    is enlarged; they are not drawn). So `display-port-1` is the receptacle nearest
    the flange (x 94.73) and `display-port-4` the one nearest the tip (x 31.09), as
    printed. Readings are
    good to about 0.5 mm. THE LIBRARY HAS NO DISPLAYPORT PART OR INTERFACE, so each
    is an element of class `connector` painted in the skin and not a seated part;
    nothing mates it and the module type carries no port for them (the
    `display-ports` attr says 4 x DisplayPort 1.4a, the datasheet's words). The pins
    are drawn as two rows of dashes, not counted.
  face-grille: >-
    photo-measured - one framed vent window beside the DisplayPorts. The bezel is
    87.7 long and 25.0 across (x 28.3 to 116.0, y 14.6 to 39.6); the window is dark
    from x 30.6 to 115.6 and the heat-sink fins show from x 35.58 to 110.25 and y
    15.6 to 38.74: 17 on a pitch of 4.3 read from the bright lines (the last two
    of 18 lines, at the window's own end, are not drawn), the first at x 37.6. Four
    Torx screws stand at x 33.07 and 113.51 and y 18.09 and 36.35, at the window's
    four corners, heads about 4.7 across. The window's corners are cut round the
    screws in the photograph; that is not drawn, and the bezel's raised edge is a
    painted line, not relief.
  face-markings: >-
    photo-measured - the bracket carries no lamp and no label; its only printing
    is the warning triangle and the faint port numbers 1 to 4 named under
    `face-displayports` (not drawn).
  thickness: >-
    estimated - the datasheet states no thickness. The shroud's far face is put at
    y 40.0, as nvidia/rtx-a6000@1 has it, 1.57 inside the bracket's far edge
    (41.57), and the backplate's outer face at 1.77, the CEM rear envelope's 2.67
    behind the board. The bracket photograph's plate is 37.3 across, which bounds
    a dual-slot card at 41.91.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the A100 are. The board, and the
    bracket's keyed side, are at the top (small y), which is where the
    DisplayPorts are.
  body: >-
    the board, its edge and the pads follow PCIe CEM 5.0 (figures 6-5 and 11-3, as
    nvidia/mcx755106-fh@1 has them): the card height 111.15, the lower edge 13.25
    above the finger datum W and the key datum 57.15 behind the bracket, so the top
    edge is at x 126.31. NVIDIA prints no figure for this card. The broad-side
    photograph agrees on the height: the shroud runs 220 px at 2.248 px/mm, 97.9.
    The back photograph's gold run is 392 to 610 px, 45.2 to 128.6 behind the
    bracket's outer face, against CEM's 45.35 to 128.95: the body keeps CEM's (the
    broad-side photograph reads 48.7 to 129.4, which is its perspective). The lower
    edge has a notch at 140.0 to 159.0 behind the bracket, 3.3 deep: the broad-side
    photograph reads 140.9 to 160.0 and 3.5 deep, the back photograph 139.0 to
    158.0 and 3.1 deep, and the mean is drawn as one box 19.0 long.
  body-shroud: >-
    photo-measured - the shroud is matte dark grey, one slab from the board's
    component face (y 6.01) to the far face (40.0), the outline of the board, split
    at the notch as the board is. The broad side's colour steps at 138 behind the
    bracket (lighter toward the bracket); it is painted, not drawn as a change of
    height.
  body-backplate: >-
    photo-measured - the back photograph shows a flat matte black plate over the
    board's whole rear, on the board's outline, with ten small screws: four on each
    long edge, at 6.1, 91.8, 169.5 and 248.0 behind the bracket along the top edge
    (x 122.9) and 16.5, 91.8, 169.5 and 248.0 along the lower edge (x 32.2), and two
    on the far edge at x 100.0 and 55.1, 4.1 from the end. Its thickness is the CEM
    rear envelope's 2.67, estimated. The photograph also shows a small step at the
    far end by the top edge and a tiny printed mark by the bracket end; neither is
    drawn.
  body-fan: >-
    photo-measured - the blower's opening on the broad side. In PNY's side
    photograph (630 x 286 px) its ring is 168 px across, centred at px (556, 358).
    At 2.257 px/mm along the card and 2.248 across, the ring is 74.4 across, its
    centre 70.0 from the far end and 44.9 below the top edge (the RTX A6000's blower
    is 50 from the far end: this card's is further in). The grey hub is 71 px, 31.5
    across, in a dark cavity about 52 across, and the 52 pale blades run from radius
    29.5 to 35. Their number is read to about 4 and their lean is schematic.
    Painted on the broad side, not an opening in the 3D body.
  body-top-edge: >-
    estimated - no photograph of this card's top edge is held. NVIDIA's own render of
    the RTX 5000 Ada (the same family and envelope) shows the top edge black with a
    champagne strip of heat-sink fins along most of its length, dipping where the
    blower is, two connectors and the model name at the bracket end and the maker's
    mark at the far end. It is a 3/4 view and cannot be scaled, so every place here
    is estimated: the strip from 46 to 250 behind the bracket and 14.0 to 34.0
    across the card, its bay from 158 to 236 behind it (the ring's span), "RTX 4500"
    at 6.0 behind it, 2.4 tall. THE STEREO AND SYNC CONNECTORS ARE NOT DRAWN (no
    straight-on view shows them at scale; the library has no part). THE MARK IS NOT
    DRAWN: its box (232 to 254 behind the bracket, 7.6 to 12.2 across) is reserved
    as `logo-zone` in `skins/body-right.svg`, estimated. The fin ridge pitch (1.2)
    is estimated.
  body-power-connector: >-
    estimated - NVIDIA's Ada quick-start guide names "the 16-pin PCIe CEM5
    connector on the back edge" of this card and puts a 2x PCIe 8-pin to 1x CEM5
    16-pin adapter in its box; the datasheet states no connector. The housing is
    drawn at nvidia/l40s@1's place for its 12VHPWR (104.1 to 123.0 on the card's x,
    9.1 across the board's component face), black, with twelve power cells in two
    columns of six on a 3.0 pitch and four sense cells; that is the L40S housing
    measured on a photograph of that card, and no photograph of this card's end is
    held. THE PORT is `aux-power` on the rear face (`faces.rear`,
    nvidia/rtx-4500-ada-tail@1): std/12vhpwr-header@1, which presents
    `pcie-12vhpwr` for a 16-pin cable and which the card exports as a power port.
  body-end: >-
    estimated - a closed black end plate 1.0 thick, 1.4 inside the card's length,
    and the connector housing standing 0.2 proud of it, as nvidia/rtx-a6000@1 has
    it. No photograph shows the end.
  body-foot: >-
    estimated - the bracket's two retention tabs below the card are the face's
    (`skins/default.svg`), 0.9 thick.
  power: >-
    datasheet - total board power 210 W in the datasheet (2895216, OCT23) and the
    PNY line card. DA-07261 does not list this card.
  memory: >-
    datasheet - 24 GB GDDR6, 192-bit, 432 GB/s, ECC.
  pcie: >-
    datasheet - PCIe 4.0 x16.
  nvlink: >-
    datasheet - "NVIDIA NVLink: No". The card has no NVLink connector.
  part-numbers: >-
    datasheet - PNY's print: "PNY Part Numbers VCNRTX4500ADA-PB YVCNRTX4500ADA-KIT
    VCNRTX4500ADA-EDU VCNRTX4500ADA-BLK VCNRTX4500ADASYNC-PB"; PNY's line card adds
    NVIDIA part 900-5G132-2260-000. NVIDIA's own datasheet gives none.
  weight: >-
    not stated - no datasheet held gives a weight for the card.
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) a straight-on view of the top edge and the far
    end (needs-photo; the top edge's strip is estimated from another card's render,
    the STEREO and SYNC connectors are not drawn and the end is a schematic); (2)
    the DisplayPort part and interface, which the library lacks (the four are
    painted, not seated); (3) the thickness, which no source states
    (vendor-silent); (4) the connector's own photograph (the housing is the
    L40S's); (5) a weight (vendor-silent in the documents held); (6) the lifecycle:
    no end-of-life notice was searched for; (7) no dimensioned drawing of any active
    workstation card (the intake's handoff list, item 1); (8) the power guide
    DA-07261 does not list this card, so its connector rests on the quick-start
    guide.
