<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="41.91mm" viewBox="0 0 120.02 41.91">
  <!-- nvidia/l40s: the L40S dual-slot bracket, seen from OUTSIDE the chassis,
       drawn from the facts in the contract's provenance (PNY's straight-on
       photograph, measured with the two retention tabs as the ruler). TIP AT
       THE LEFT, flange end at the right, the board's side at the top, as
       std/pcie-bracket-fh@2 is drawn. The plate is the A100's outline. Four
       DisplayPort receptacles run along the board's side and one vent window
       sits below them. -->
  <path id="plate" d="M1.9 7.4 L7.27 7.4 L9.57 5.1 L20.0 5.1 L21.0 4.1 L119.2 4.1 L119.2 0.3 L120.02 0.3 L120.02 39.7 L119.2 39.7 L119.2 40.0 L9.67 40.0 L7.27 37.6 L1.9 37.6 A1.9 1.9 0 0 1 0 35.7 L0 29.8 A1.9 1.9 0 0 1 1.9 27.9 L7.27 27.9 L10.95 24.22 A2.4 2.4 0 0 0 10.95 20.88 L7.27 17.2 L1.9 17.2 A1.9 1.9 0 0 1 0 15.3 L0 9.3 A1.9 1.9 0 0 1 1.9 7.4 Z" fill="#9aa1a8" stroke="#5f666d" stroke-width="0.4" stroke-linejoin="round"/>
  <!-- the fold: the flange turns 90 degrees here. On an elevation it is a line. -->
  <path id="flange-fold" d="M119.6 0.6 V39.4" stroke="#5f666d" stroke-width="0.3" fill="none"/>
  <!-- the four DisplayPort receptacles: an 18.3 x 7.3 shell with the D shape's
       chamfer at the flange end, a dark opening and two rows of pins. Each is
       drawn once at its own place; the library has no DisplayPort part. -->
  <g id="display-port-1">
    <path d="M32.35 6.0 L46.55 6.0 L49.85 9.2 L49.85 12.3 A1.0 1.0 0 0 1 48.85 13.3 L32.35 13.3 A0.8 0.8 0 0 1 31.55 12.5 L31.55 6.8 A0.8 0.8 0 0 1 32.35 6.0 Z" fill="#d8d9d6" stroke="#5f666d" stroke-width="0.3"/>
    <path d="M33.15 7.1 L46.0 7.1 L48.55 9.5 L48.55 11.9 L33.15 12.2 Z" fill="#1b1d20"/>
    <path d="M34.6 8.5 H46.2 M34.6 10.5 H46.2" stroke="#8a8f95" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-2">
    <path d="M53.55 6.0 L67.75 6.0 L71.05 9.2 L71.05 12.3 A1.0 1.0 0 0 1 70.05 13.3 L53.55 13.3 A0.8 0.8 0 0 1 52.75 12.5 L52.75 6.8 A0.8 0.8 0 0 1 53.55 6.0 Z" fill="#d8d9d6" stroke="#5f666d" stroke-width="0.3"/>
    <path d="M54.35 7.1 L67.2 7.1 L69.75 9.5 L69.75 11.9 L54.35 12.2 Z" fill="#1b1d20"/>
    <path d="M55.8 8.5 H67.4 M55.8 10.5 H67.4" stroke="#8a8f95" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-3">
    <path d="M74.75 6.0 L88.95 6.0 L92.25 9.2 L92.25 12.3 A1.0 1.0 0 0 1 91.25 13.3 L74.75 13.3 A0.8 0.8 0 0 1 73.95 12.5 L73.95 6.8 A0.8 0.8 0 0 1 74.75 6.0 Z" fill="#d8d9d6" stroke="#5f666d" stroke-width="0.3"/>
    <path d="M75.55 7.1 L88.4 7.1 L90.95 9.5 L90.95 11.9 L75.55 12.2 Z" fill="#1b1d20"/>
    <path d="M77.0 8.5 H88.6 M77.0 10.5 H88.6" stroke="#8a8f95" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-4">
    <path d="M95.95 6.0 L110.15 6.0 L113.45 9.2 L113.45 12.3 A1.0 1.0 0 0 1 112.45 13.3 L95.95 13.3 A0.8 0.8 0 0 1 95.15 12.5 L95.15 6.8 A0.8 0.8 0 0 1 95.95 6.0 Z" fill="#d8d9d6" stroke="#5f666d" stroke-width="0.3"/>
    <path d="M96.75 7.1 L109.6 7.1 L112.15 9.5 L112.15 11.9 L96.75 12.2 Z" fill="#1b1d20"/>
    <path d="M98.2 8.5 H109.8 M98.2 10.5 H109.8" stroke="#8a8f95" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <!-- the grille frame: a separate plate on four Torx screws. The window,
       fins and screws are inside its group, because the 3D relief paints the
       raised frame with this node's own art and would otherwise hide them. -->
  <g id="grille">
  <!-- THE FRAME ENDS 7.8 SHORT OF THE PHOTOGRAPH'S, at x 109.11, as the A100's
       does (provenance face-grille). -->
  <rect x="29.4" y="15.0" width="79.71" height="24.3" rx="2.0" fill="#a7aeb5" stroke="#5f666d" stroke-width="0.35"/>
  <!-- the vent window, its corners cut round each screw boss (R3.5) -->
  <path id="vent" d="M35.52 15.9 L103.39 15.9 A3.5 3.5 0 0 0 107.31 21.39 L107.31 32.31 A3.5 3.5 0 0 0 103.88 38.3 L35.03 38.3 A3.5 3.5 0 0 0 31.4 32.39 L31.4 21.31 A3.5 3.5 0 0 0 35.52 15.9 Z" fill="#141618" stroke="#41474d" stroke-width="0.3"/>
  <!-- heat-sink fins behind the window, end-on, on a 4.18 pitch from x 38.3 -->
  <g id="fins" fill="#565c62">
    <rect x="38.01" y="16.2" width="0.5" height="21.8"/>
    <rect x="42.19" y="16.2" width="0.5" height="21.8"/>
    <rect x="46.37" y="16.2" width="0.5" height="21.8"/>
    <rect x="50.55" y="16.2" width="0.5" height="21.8"/>
    <rect x="54.73" y="16.2" width="0.5" height="21.8"/>
    <rect x="58.91" y="16.2" width="0.5" height="21.8"/>
    <rect x="63.09" y="16.2" width="0.5" height="21.8"/>
    <rect x="67.27" y="16.2" width="0.5" height="21.8"/>
    <rect x="71.45" y="16.2" width="0.5" height="21.8"/>
    <rect x="75.63" y="16.2" width="0.5" height="21.8"/>
    <rect x="79.81" y="16.2" width="0.5" height="21.8"/>
    <rect x="83.99" y="16.2" width="0.5" height="21.8"/>
    <rect x="88.17" y="16.2" width="0.5" height="21.8"/>
    <rect x="92.35" y="16.2" width="0.5" height="21.8"/>
    <rect x="96.53" y="16.2" width="0.5" height="21.8"/>
    <rect x="100.71" y="16.2" width="0.5" height="21.8"/>
  </g>
  <g id="screw-1"><circle cx="32.8" cy="18.1" r="2.15" fill="#b9bfc5" stroke="#5f666d" stroke-width="0.3"/><circle cx="32.8" cy="18.1" r="0.8" fill="#4a4f55"/></g>
  <g id="screw-2"><circle cx="106.11" cy="18.1" r="2.15" fill="#b9bfc5" stroke="#5f666d" stroke-width="0.3"/><circle cx="106.11" cy="18.1" r="0.8" fill="#4a4f55"/></g>
  <g id="screw-3"><circle cx="32.8" cy="35.6" r="2.15" fill="#b9bfc5" stroke="#5f666d" stroke-width="0.3"/><circle cx="32.8" cy="35.6" r="0.8" fill="#4a4f55"/></g>
  <g id="screw-4"><circle cx="106.11" cy="35.6" r="2.15" fill="#b9bfc5" stroke="#5f666d" stroke-width="0.3"/><circle cx="106.11" cy="35.6" r="0.8" fill="#4a4f55"/></g>
  </g>
  <!-- THE EXTENDER bolts to the far end, which this face does not show. One
       empty node per option says which is fitted, and the body's extender
       pieces follow it (`when`, L148). None fitted shows neither. -->
  <g id="extender-straight" data-show-from="extender" data-show="straight" display="none"/>
  <g id="extender-long-offset" data-show-from="extender" data-show="long-offset" display="none"/>
</svg>
