format: 1
kind: module
name: l40s
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA L40S GPU (48 GB GDDR6), a passive dual-slot full-height full-length
  card. The bracket face carries four DisplayPort connectors on the board's
  side and one vent window beside them. The far end is open and shows the heat
  sink's fins edge-on. It has one 16-pin 12VHPWR power connector by the top edge
  and two bosses for an extender. NVIDIA's straight or long offset extender can
  be fitted to the far end; the `extender` field chooses it. It has no NVLink.
  It plugs into one riser slot and covers the one beside it.
slot-width: 2
size: {w: 120.02, h: 41.91, d: 268.60}
size-confidence: {w: registry, h: registry, d: drawing}
unplaced: >-
  no bay in the library lists this card in `accepts`. The one riser that spans,
  dell/riser-1a-14g@2's `slot-1`, is the Dell R740xd's, and that server's
  documents cap a double-width GPU at 300 W (spec sheet, "Accelerator options")
  against this card's 350 W. The other Dell risers with a double-width slot
  model it as one bay with no `span`, or only as a half-length riser, so none
  takes a card two slots wide. A server whose documents list this card, and a
  riser bay that spans for it, would seat it.
attrs:
  model: 'L40S'
  part-numbers: 'PNY NVL40STCGPU-KIT'
  board-sku: 'PG133 SKU 242, NVPN 669-2G133-242-xxx (as the brief prints it)'
  role: gpu
  form-factor: 'Full-height, full-length (FHFL) 10.5 in, dual-slot'
  pcie-connector: x16
  pcie-generation: 4
  pcie-height: full
  power-draw-max-w: 350
  power-input: 'host PCIe slot and one PCIe 16-pin (12VHPWR) auxiliary connector'
  memory: '48 GB GDDR6, 384-bit, 864 GB/s'
  display-ports: '4 x DisplayPort 1.4a on the bracket'
  cooling: passive
  airflow: 'bidirectional; the heat sink takes system airflow either way along the card'
  nvlink: 'none'
  weight-kg: 1.052
  eol: none-announced
fields:
  extender:
    label: Extender
    type: choice
    options: [none, straight, long-offset]
    default: none
    drawn-by-absence: [none]
    description: >-
      The bracket at the card's far end that a server's card guide holds. The
      straight one (NVPN 682-00007-5555-001) makes the card 312 mm long. The
      long offset one (NVPN 682-00007-5555-000) makes it 339 mm. The enhanced
      straight extender the H100 briefs list is not in this card's brief.
faces:
  rear: {ref: nvidia/l40s-tail@1}
provenance:
  slot-width: >-
    datasheet - PB-11470 table 1: form factor "Full-height, full-length (FHFL)
    10.5', dual-slot"; PNY's datasheet: "4.4" (H) x 10.5" (L), dual slot". The
    face is one plate 36 across (`face-outline`). The card declares
    `slot-width: 2` as docs/pcie-two-slot-bays-design.md R1 defines it.
  sources: >-
    NVIDIA L40S Product Brief PB-11470-001_v02, served by PNY from
    https://www.pny.com/File%20Library/Company/Support/product-briefs/data-center-gpus/NVIDIA-L40S-Product-Brief.pdf
    (NVIDIA's own copy was not found at ten tried paths, so this is the
    mirror). Tables 1 and 2, figure 3 (card dimensions), figure 4 (the 16-pin
    connector, an end view), figure 5 (its pin assignments) and the power,
    display and extender text. PNY's datasheet,
    https://www.pny.com/File%20Library/Company/Support/Product%20Brochures/NVIDIA%20Data%20Center%20GPUs/l40s-datasheet.pdf,
    for the PNY part number and "4x DisplayPort 1.4a". PB-11470 figure 3 is the
    A100 80GB's drawing figure for figure (268.60 and 267.70, 59.05, 81.88 REF,
    19.50 REF, 3.55 REF, 13.25, 111.15, 104.86), so the body is built from the
    pilot nvidia/a100-pcie-80gb@1 and the provenance says where they differ.
    NVIDIA's brief forbids reproducing its figures, so its facts are
    transcribed and none of its figures is copied.
  reference-photos: >-
    reference - PNY's product images for the L40S, under
    https://d2vfia6k6wrouk.cloudfront.net/productimages/8b56407f-6ed8-4455-9983-b05800c70eb5/images/:
    nvidia-l40s-left.png (the bracket straight on, 118 x 356 px), nvidia-l40s-right.png
    (the east end straight on, 108 x 276 px), nvidia-l40s-front.png and
    nvidia-l40s-back.png (the two broad sides, 590 x 266 px) and two 3/4 views.
    Licence not stated; facts read from them, pictures not used. The two
    straight-on views are the only ones of this kind for a card of the batch
    other than the A100; the two sides check the outline.
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2,
    PCIe CEM 5.0 figure 11-5). h is two slots: the single bracket's 21.59 plus
    one 20.32 slot pitch, 41.91, as on the A100.
  depth: >-
    drawing - PB-11470 figure 3: product length 268.60 with the I/O bracket,
    267.70 without. The card ends 268.60 behind the bracket's outer face.
  face-outline: >-
    photo-measured - PNY's straight-on photograph of the bracket
    (nvidia-l40s-left.png), turned a quarter into this frame, tip at the left and
    the board's side at the top. Its scale is the two retention tabs, whose
    centres are 462 px apart in an 8 times enlargement, the 20.32 slot pitch, so
    22.74 px/mm (2.84 px/mm in the file). The 356 px of the object are then 125
    and not the 120.02: the object takes in the card's top edge behind the
    bracket's flange. At that scale the plate matches the A100's to the
    readings' 0.3: the plate's edge at y 4.1 (5.1 for the first 20 mm, the step
    at x 20.9), the V notch's apex at x 11.4 (the A100's 11.5), the tabs at y 7.4
    to 17.2 and 27.9 to 37.7, the flange fold at 119.8. THE PLATE IS THEREFORE THE
    A100'S OUTLINE (`std/pcie-bracket-fh-2slot@1`'s envelope, 36 across), and is
    drawn with the same path. The first tab's centre is put at y 12.38 as the A100
    does.
  face-displayports: >-
    photo-measured - four DisplayPort receptacles along the board's side, at
    the same scale. Each shell is 18.3 long and 7.3 across (y 6.0 to 13.3),
    with the D shape's two chamfered corners at the flange end (the upper one
    drawn; the lower is round in the photograph). Their centres along the bracket,
    least squares on a pitch: 40.7, 61.9, 83.1 and 104.3 (measured 40.45, 62.35,
    83.1 and 104.05, so the pitch is 21.2 and not the slot's 20.32). The
    readings are good to about 0.5 mm. THE LIBRARY HAS NO DISPLAYPORT PART OR
    INTERFACE, so each is an element of class `connector` painted in the skin and
    not a seated part; nothing mates it and the module type carries no port for
    them (the `display-ports` attr says 4 x DisplayPort 1.4a, the datasheet's
    words). The pins are drawn as two rows of dots, not counted.
  face-grille: >-
    photo-measured - a raised frame held by four Torx screws covers one vent
    window below the DisplayPorts. Frame x 29.4 to 116.9, y 15.0 to 39.3; window
    y 15.9 to 38.3; screw centres at y 18.1 and 35.6 and x 32.8 and 113.6. The
    window's corners are cut round each screw boss, about R3.5. Behind it the
    heat-sink fins show as lines across the window on a pitch of 4.18 (95 px),
    the first at x 38.3, sixteen in the length drawn. THE DRAWN FRAME ENDS 7.8
    SHORT OF THAT, at x 109.11, the window at 107.31 and the far screws at
    106.11, as nvidia/a100-pcie-80gb@1 draws its own: std/pcie-bracket-fh-2slot@1's
    windows end 12.76 from the flange, and the riser's post covers the rest. This
    end is a drawing choice, not a measurement. THE FIN PITCH HERE (4.18) IS NOT
    THE 4.93 THE EAST-END PHOTOGRAPH SHOWS (`body-tail-fins`), and the two were
    not reconciled.
  face-markings: >-
    photo-measured - the bracket carries no lamp, no label and no printing
    beside the DisplayPorts.
  thickness: >-
    estimated - as nvidia/a100-pcie-80gb@1 `thickness`: 38.2, bounded by the
    2.67 backside clearance and the bracket's far edge. The east-end photograph
    reads 108 px at 2.82 px/mm, 38.3, which agrees; PB-11470 does not state it.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the A100 are. The board, and
    the bracket's keyed side, are at the top (small y), which is where the
    DisplayPorts are.
  body: >-
    the board, its edge and the pads follow PCIe CEM 5.0 (figures 6-5 and 11-3,
    as nvidia/mcx755106-fh@1 has them) at PB-11470 figure 3's lengths, which are
    the A100 80GB's: the lower edge 13.25 above the finger datum W, the key
    datum 59.05 behind the bracket, a notch 3.55 REF deep and 19.50 REF long
    whose near end is 59.05 + 81.88 = 140.93 behind the bracket, the top edge at
    W + 111.15. PNY's two side views show the same outline, with the notch.
    The shroud, cover and backplate follow the board's outline, as on the A100
    (`body-shroud`, estimated).
  body-shroud: >-
    borrowed - nvidia/a100-pcie-80gb@1 `body-shroud`: a champagne shroud with a
    black cover on the board's side and a black backplate, split at the notch.
    PNY's 3/4 views of this card show a champagne broad side and a black band
    along the top edge; the thicknesses of the two bands were measured on the
    A100's render.
  body-top-edge: >-
    estimated - PNY's 3/4 view shows the NVIDIA mark and wordmark near the far end
    of the top edge and two small connectors on the black band near the bracket
    end. THE BRIEF SAYS "the L40S frame lock and stereo connectors are on the
    card's north edge" (the Quadro Sync II board's). They are not drawn and not
    measured: a view of the top edge at known scale was not found. The mark is
    reserved as `logo-zone` and the wordmark drawn at the A100's place, which is
    not measured on this card.
  body-power-connector: >-
    photo-measured - PB-11470: "One PCIe 16-pin auxiliary power connector", and
    figure 5 names "PCIe CEM 5.0", so it is a 12VHPWR. The east-end photograph
    (2.82 px/mm) puts the black housing 18.9 along the card and 9.1 across its
    thickness, from the card's x 104.1 to 123.0 and y 3.4 to 12.5, 3.3 from the
    top edge. Its 12 power contacts are on a 3.0 pitch in two columns of six, at
    the card's x 106.1, 109.1, 112.0, 115.0, 118.1 and 121.2 and y 7.6 and 10.5;
    the four sense contacts are in a strip on the backplate side at y 5.0, centred
    on x 113.6. The housing's depth, 5.8 standing in the end plate, and the
    contacts' sizes are not seen. THE PORT is `aux-power` on the rear face
    (`faces.rear`, nvidia/l40s-tail@1): std/12vhpwr-header@1, which presents
    `pcie-12vhpwr` for a 16-pin cable and which the card exports as a power
    port. The header's own size is 20.85 x 11.7 (the plug's outline), 1.95 and 2.6
    more than the housing measured here, so the boxes below keep the measured
    size and are the 3D body of the port. PB-11470 table 8 lists a native 16-pin
    cable and a 3x PCIe 8-pin to 16-pin adapter.
  body-end: >-
    estimated - as nvidia/a100-pcie-80gb@1 `body-end`: the black end plate
    (backplate, board and cover) stops 0.4 short of the shroud's lip and the
    housing and mount bosses stand 0.2 proud of it.
  body-tail-fins: >-
    photo-measured - the shroud is open at its far end and the east-end
    photograph shows the fin stack edge-on behind it: 19 lines on a 4.93 pitch,
    the first 3.98 from the top edge (see nvidia/l40s-tail@1 `fins`). The A100's
    are 18 on 5.0. The fins' thickness (0.8) and depth (40) are estimated.
  body-extender-mount: >-
    photo-measured - the two bosses the extenders' thumbscrews fasten to, 3.5
    across, at the card's x 36.8 and 65.2 and y 10.5 (nvidia/l40s-tail@1
    `mount`). They stand 0.4 proud, estimated. PB-11470 says OEMs "may design a
    custom attach method using the extender mounting holes on the east edge".
  power: >-
    datasheet - PB-11470 table 1: total board power 350 W default and maximum,
    minimum "TBD". The brief says the card needs up to 350 W from the 16-pin
    connector and will not boot on a cable strapped for 300 W or less (sense
    logic, its table 7).
  weight: >-
    datasheet - PB-11470 table 1: board 1,052 g, excluding the bracket and
    extenders. The bracket with screws is 20 g, the enhanced straight extender 35
    g, the long offset extender 48 g and the straight extender 32 g. (The brief
    lists the enhanced one's weight and describes no such extender.)
  memory: >-
    datasheet - PB-11470 table 2: GDDR6, 48 GB, 384-bit, 9,001 MHz, 864 GB/s.
  pcie: >-
    datasheet - PB-11470 table 1: PCI Express Gen4 x16, lane and polarity
    reversal supported.
  display: >-
    datasheet - PNY's L40S datasheet: "Display Ports 4x DisplayPort 1.4a";
    PB-11470 table 1: "Four VESA DisplayPort connectors". In the default Display
    Off mode the connectors are not enabled; Display On modes drive up to four
    monitors (PB-11470 "Display").
  part-numbers: >-
    datasheet - PNY's datasheet gives its part number NVL40STCGPU-KIT; the
    brief's table 1 gives the board SKU "PG133 SKU 242 NVPN: 669-2G133-242-xxx",
    printed with a 669 where the other briefs have 699. PNY's line card prints
    NVIDIA PN 900-2G133-0080-000 for BOTH the L40S and the RTX PRO 6000
    Blackwell Server Edition (one of the two must be wrong),
    so no NVIDIA order code is written.
  nvlink: >-
    datasheet - PB-11470 table 1: "NVIDIA NVLink: Not supported". The card has
    no bridge connectors.
  extenders: >-
    datasheet - PB-11470 "Extenders": a long offset extender (NVPN
    682-00007-5555-000, card plus extender 339 mm) and a straight extender (NVPN
    682-00007-5555-001, 312 mm), the A100 80GB's by number. Their pieces below
    are that card's, which was photographed with the straight one fitted, with
    the thumbscrews moved over this card's bosses (2.1 higher across the
    card than the A100's, so the flange the screws sit on does not reach them: the
    flange is the A100's estimate).
  body-extender-straight: >-
    borrowed - nvidia/a100-pcie-80gb@1 `body-extender-straight`: a slotted plate
    of four bars with three slots, an upright 1.2 thick and 15 wide that ends at
    x 103.41, clear of the 16-pin housing (x 104.1; the clearance is thin and
    estimated). Its far edge is the brief's 312.
  body-extender-long-offset: >-
    borrowed - nvidia/a100-pcie-80gb@1 `body-extender-long-offset`. Its far edge
    is the brief's 339; no photograph of it was found.
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) the DisplayPort part and interface, which the
    library lacks (the four are painted, not seated); (2) the frame lock and
    stereo connectors on the top edge (needs-photo, needs-drawing); (3) the
    thickness, which no source states (vendor-silent); (4) the NVIDIA order code
    (sources-disagree: the line card gives one code for two cards); (5) the
    fin pitch, 4.18 through the bracket's window and 4.93 from the east end
    (sources-disagree, both measured); (6) the 16-pin housing's depth and colour
    (needs-photo); (7) NVIDIA's own copy of the brief, which is the PNY mirror
    here.
  lifecycle: >-
    No end-of-life notice for the L40S was found, and PNY's line card of August
    2025 lists it as a current part. The attr says `none-announced`.
