  - {ref: std/qsfp56@1, id: port-1, at: [49.82, 2.62], rotate: 180, group: qsfp112}
  - {ref: std/qsfp56@1, id: port-2, at: [28.60, 2.62], rotate: 180, group: qsfp112}
  - ref: common/led-dot@1
    id: led-port-1-1
    at: [71.35, 2.80]
    rotate: 180
    group: port-leds
    states: {lamp: ['off', {name: link-up, color: '#22c55e'}, {name: link-up-reduced-speed, color: '#eab308'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: beacon, color: '#eab308', behavior: blinking}, {name: error, color: '#eab308', behavior: blinking}]}
  - ref: common/led-dot@1
    id: led-port-1-2
    at: [74.34, 2.80]
    rotate: 180
    group: port-leds
    states: {lamp: ['off', {name: link-up, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: error, color: '#22c55e'}]}
  - ref: common/led-dot@1
    id: led-port-2-1
    at: [25.16, 2.80]
    rotate: 180
    group: port-leds
    states: {lamp: ['off', {name: link-up, color: '#22c55e'}, {name: link-up-reduced-speed, color: '#eab308'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: beacon, color: '#eab308', behavior: blinking}, {name: error, color: '#eab308', behavior: blinking}]}
  - ref: common/led-dot@1
    id: led-port-2-2
    at: [22.13, 2.80]
