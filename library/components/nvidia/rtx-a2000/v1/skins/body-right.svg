<svg xmlns="http://www.w3.org/2000/svg" width="166.74mm" height="35.56mm" viewBox="0.9 4.44 166.74 35.56">
  <!-- nvidia/rtx-a2000: THE TOP EDGE, the body's right side seen from outside.
       Across: mm behind the bracket's outer face (0.9 to 167.64, the shroud's
       length). Down: the face's y (4.44 the board's outer face, 40.0 the
       shroud's). Every piece whose right side is the card's top edge `shows:
       [right]` and carries its patch of this. The top edge is a grey frame around
       a long flat lid that runs from the bracket end nearly to the far end,
       darker at the bracket end and lighter toward the blower, as PNY's 3/4 view
       lights it, with a black pocket past the lid's rounded end. There is no
       champagne heat-sink strip on this card. The lid's places are fractions
       read off a 3/4 view and are estimated (provenance body-top-edge). -->
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#222223"/>
      <stop offset="0.6" stop-color="#4d4d50"/>
      <stop offset="1" stop-color="#6a6a6e"/>
    </linearGradient>
  </defs>
  <!-- the board's edge and the frame's top -->
  <rect x="0.9" y="4.44" width="166.74" height="1.57" fill="#1d2420"/>
  <rect x="0.9" y="6.01" width="166.74" height="33.99" fill="#4a4a4d"/>
  <!-- the pocket past the lid: black, 146 to 166.4 behind the bracket -->
  <rect id="pocket" x="146.0" y="9.0" width="20.4" height="28.4" fill="#0b0b0b"/>
  <!-- the lid, 5.5 to 151 behind the bracket, 9.0 to 37.4 across, its far end rounded -->
  <path id="lid-top" d="M5.5 9.0 H138 Q151 9.0 151 22.2 Q151 37.4 138 37.4 H5.5 Z" fill="url(#lid)"/>
  <!-- the mark is reserved, not drawn (L172): on the ledge by the far end -->
  <rect id="logo-zone" x="147.0" y="6.3" width="17.0" height="2.6" fill="none"/>
  <g id="silkscreen">
    <text x="3.0" y="8.4" font-family="Arial" font-weight="bold" font-size="2.0" fill="#2f2f33">RTX A2000</text>
  </g>
</svg>
