<svg xmlns="http://www.w3.org/2000/svg" width="79.2mm" height="41.91mm" viewBox="0 0 79.2 41.91">
  <!-- nvidia/rtx-a2000: the RTX A2000 low-profile dual-slot bracket, seen from
       OUTSIDE the chassis, drawn from the facts in the contract's provenance (a
       straight-on photograph of the bracket, scaled by the retention tabs: 0.1802
       mm per pixel). TIP AT THE LEFT, flange end at the right, the board's side at
       the top, as std/pcie-bracket-lp@1 is drawn: the photograph is turned half a
       turn into this frame. A silver plate with four mini DisplayPort receptacles
       along the board's side, a latch slot above each, and a grid of 12 x 4 square
       vent holes in a pressed panel with a Torx screw at each of its far corners.
       Nothing is traced. -->
  <defs>
    <!-- one vent hole 3.2 square on a 4.03 pitch along the bracket and 4.02 across -->
    <pattern id="hole" patternUnits="userSpaceOnUse" x="27.95" y="19.18" width="4.03" height="4.02">
      <rect x="0" y="0" width="3.2" height="3.2" fill="#101112"/>
    </pattern>
  </defs>
  <path id="plate" d="M1.9 7.64 L7.8 7.64 L11.94 3.5 L79.2 3.5 L79.2 39.1 L77.0 39.1 L74.2 41.9 L11.4 41.9 L7.8 38.3 L1.9 38.3 A1.9 1.9 0 0 1 0 36.4 L0 29.9 A1.9 1.9 0 0 1 1.9 28.0 L7.8 28.0 L10.5 25.1 A2.2 2.2 0 0 0 10.5 20.8 L7.8 17.9 L1.9 17.9 A1.9 1.9 0 0 1 0 16.0 L0 9.54 A1.9 1.9 0 0 1 1.9 7.64 Z" fill="#b9bec3" stroke="#5f666d" stroke-width="0.4" stroke-linejoin="round"/>
  <!-- the fold: the flange turns 90 degrees here. On an elevation it is a line. -->
  <path id="flange-fold" d="M78.8 3.8 V38.8" stroke="#5f666d" stroke-width="0.3" fill="none"/>
  <!-- the pressed panel the grid and its screws sit in -->
  <rect id="panel" x="25.9" y="18.0" width="52.2" height="17.7" rx="2.2" fill="none" stroke="#a5aaaf" stroke-width="0.25"/>
  <!-- the four latch slots and the three small squares between them, above the
       receptacles (y 14.2 to 16.4) -->
  <g id="latches" fill="#101112">
    <rect x="66.05" y="14.2" width="5.9" height="2.2"/>
    <rect x="53.25" y="14.2" width="5.9" height="2.2"/>
    <rect x="40.45" y="14.2" width="5.9" height="2.2"/>
    <rect x="27.85" y="14.2" width="5.9" height="2.2"/>
    <rect x="61.6" y="14.3" width="2.0" height="2.0"/>
    <rect x="48.8" y="14.3" width="2.0" height="2.0"/>
    <rect x="36.1" y="14.3" width="2.0" height="2.0"/>
  </g>
  <!-- the four mini DisplayPort receptacles: a 9.3 x 6.1 shell, a dark opening
       with its two chamfered corners on the grid's side, and the tongue. Each is
       drawn once at its own place; the library has no DisplayPort part. -->
  <g id="display-port-1">
    <rect x="64.35" y="7.0" width="9.3" height="6.1" rx="1.3" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M65.35 7.8 H72.65 V11.0 L71.35 12.3 H66.65 L65.35 11.0 Z" fill="#18191b"/>
    <rect x="66.6" y="9.3" width="4.8" height="1.6" fill="#6b6e72"/>
  </g>
  <g id="display-port-2">
    <rect x="51.55" y="7.0" width="9.3" height="6.1" rx="1.3" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M52.55 7.8 H59.85 V11.0 L58.55 12.3 H53.85 L52.55 11.0 Z" fill="#18191b"/>
    <rect x="53.8" y="9.3" width="4.8" height="1.6" fill="#6b6e72"/>
  </g>
  <g id="display-port-3">
    <rect x="38.75" y="7.0" width="9.3" height="6.1" rx="1.3" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M39.75 7.8 H47.05 V11.0 L45.75 12.3 H41.05 L39.75 11.0 Z" fill="#18191b"/>
    <rect x="41.0" y="9.3" width="4.8" height="1.6" fill="#6b6e72"/>
  </g>
  <g id="display-port-4">
    <rect x="26.15" y="7.0" width="9.3" height="6.1" rx="1.3" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M27.15 7.8 H34.45 V11.0 L33.15 12.3 H28.45 L27.15 11.0 Z" fill="#18191b"/>
    <rect x="28.4" y="9.3" width="4.8" height="1.6" fill="#6b6e72"/>
  </g>
  <!-- the vent grid: 12 columns along the bracket and 4 rows across; the two
       outer holes of the far row are covered by the screws' bosses, and the outer
       holes of the next row are cut to their board-side 1.4 by the panel's corners -->
  <rect id="vent" x="27.95" y="19.18" width="47.53" height="15.26" fill="url(#hole)"/>
  <rect x="27.95" y="28.65" width="3.2" height="1.8" fill="#b9bec3"/>
  <rect x="72.28" y="28.65" width="3.2" height="1.8" fill="#b9bec3"/>
  <g id="screws">
    <g id="screw-1"><circle cx="75.2" cy="31.97" r="2.9" fill="#b9bec3" stroke="#a5aaaf" stroke-width="0.2"/><circle cx="75.2" cy="31.97" r="2.25" fill="#cfd2d5" stroke="#5f666d" stroke-width="0.3"/><circle cx="75.2" cy="31.97" r="0.9" fill="#4a4f55"/></g>
    <g id="screw-2"><circle cx="28.9" cy="31.97" r="2.9" fill="#b9bec3" stroke="#a5aaaf" stroke-width="0.2"/><circle cx="28.9" cy="31.97" r="2.25" fill="#cfd2d5" stroke="#5f666d" stroke-width="0.3"/><circle cx="28.9" cy="31.97" r="0.9" fill="#4a4f55"/></g>
  </g>
</svg>
