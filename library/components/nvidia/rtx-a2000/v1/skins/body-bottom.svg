<svg xmlns="http://www.w3.org/2000/svg" width="55.65mm" height="166.74mm" viewBox="-0.81 0 55.65 166.74">
  <!-- nvidia/rtx-a2000: THE SHROUD'S BROAD SIDE, the body's bottom side seen
       from outside. Across: 79.2 (the face's width) less the face's x, so the
       card's top edge is at -0.81 and its lower edge at 54.84. Down: 167.64 less
       mm behind the bracket's outer face, so the far end is at the top and the
       bracket's end at the bottom. Matte dark grey, lighter toward the far end as
       PNY's broad-side photograph is, with the blower's opening: a bezel groove,
       a bright rim, 47 long curved blades, a dark floor and a hub with its own
       bright rim. The ring is centred 38.5 from the far end and 23.0 below the top
       edge (provenance body-fan). Drawn in-house; nothing is traced. -->
  <defs>
    <linearGradient id="matte" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1f1f1f"/>
      <stop offset="1" stop-color="#3c3c3d"/>
    </linearGradient>
    <!-- one blade, at the top of the ring (centre at 0 0): from r 10.5 to r 16.8,
         curving 24 degrees counter-clockwise on the way out, steeply at first and
         then straight out (read off the photograph's phase against radius) -->
    <path id="blade" d="M0 -10.53 L-1.351 -11.5 L-3.056 -12.26 L-4.431 -12.94 L-5.522 -13.67 L-6.296 -14.48 L-6.797 -15.41" fill="none" stroke="#b4b4b4" stroke-width="0.32" stroke-linejoin="round"/>
  </defs>
  <rect x="-0.81" y="0" width="55.65" height="166.74" fill="url(#matte)"/>
  <circle id="fan-groove" cx="22.19" cy="38.5" r="19.1" fill="#303031" stroke="#101011" stroke-width="0.8"/>
  <circle id="fan-rim" cx="22.19" cy="38.5" r="17.9" fill="#161616" stroke="#6e6e6f" stroke-width="0.5"/>
  <g id="blades" transform="translate(22.19 38.5)">
    <use href="#blade" transform="rotate(0)"/>
    <use href="#blade" transform="rotate(7.66)"/>
