<svg xmlns="http://www.w3.org/2000/svg" width="79.2mm" height="18.42mm" viewBox="0 0 79.2 18.42">
  <!-- nvidia/mcx623105-lp: MCX623105A on its short bracket. The outline, tip
       and keyed flange are std/pcie-bracket-lp@1, composed BEHIND this; what is drawn
       here is the punched plate: vents, light-pipe slots and port numerals.
       TIP AT THE LEFT - NVIDIA draws the card tip-right, so this is its
       figure turned a half-turn and the numerals read upside down. -->
  <!-- METAL FILLING THE OPENING: the bracket colour, 0.3 proud all round so
       the opening stroke leaves no ghost; the holes are punched in it. -->
  <rect id="plate" x="15.33" y="2.88" width="55.13" height="12.66" fill="#9aa1a8"/>
  <g id="vents"><rect x="11.36" y="11.10" width="3.60" height="3.70" rx="0.60" fill="#17191c"/><rect x="11.36" y="5.75" width="3.60" height="3.70" rx="0.60" fill="#17191c"/><rect x="16.83" y="11.10" width="3.60" height="3.70" rx="0.60" fill="#17191c"/><rect x="16.83" y="5.75" width="3.60" height="3.70" rx="0.60" fill="#17191c"/><rect x="22.16" y="11.10" width="3.60" height="3.70" rx="0.60" fill="#17191c"/><rect x="22.16" y="5.75" width="3.60" height="3.70" rx="0.60" fill="#17191c"/><rect x="50.15" y="11.10" width="3.60" height="3.70" rx="0.60" fill="#17191c"/><rect x="50.15" y="5.75" width="3.60" height="3.70" rx="0.60" fill="#17191c"/><rect x="55.61" y="11.10" width="3.60" height="3.70" rx="0.60" fill="#17191c"/><rect x="55.61" y="5.75" width="3.60" height="3.70" rx="0.60" fill="#17191c"/><rect x="61.06" y="11.10" width="3.60" height="3.70" rx="0.60" fill="#17191c"/><rect x="61.06" y="5.75" width="3.60" height="3.70" rx="0.60" fill="#17191c"/><rect x="66.64" y="11.10" width="3.60" height="3.70" rx="0.60" fill="#17191c"/><rect x="66.64" y="5.75" width="3.60" height="3.70" rx="0.60" fill="#17191c"/><rect x="71.92" y="11.10" width="3.60" height="3.70" rx="0.60" fill="#17191c"/><rect x="71.92" y="5.75" width="3.60" height="3.70" rx="0.60" fill="#17191c"/></g>
  <g id="slots"><rect x="28.47" y="14.65" width="5.00" height="0.80" rx="0.40" fill="#17191c"/><rect x="35.56" y="14.65" width="5.00" height="0.80" rx="0.40" fill="#17191c"/><rect x="42.52" y="14.65" width="5.00" height="0.80" rx="0.40" fill="#17191c"/></g>
  <g id="silkscreen">
  </g>
</svg>
