<svg xmlns="http://www.w3.org/2000/svg" width="79.2mm" height="18.42mm" viewBox="0 0 79.2 18.42">
  <!-- nvidia/mcx755106-lp: MCX755106A on its short bracket. The outline, tip
       and keyed flange are std/pcie-bracket-lp@1, composed BEHIND this; what is drawn
       here is the punched plate: vents, light-pipe slots and port numerals.
       TIP AT THE LEFT - NVIDIA draws the card tip-right, so this is its
       figure turned a half-turn and the numerals read upside down. -->
  <!-- METAL FILLING THE OPENING: the bracket colour, 0.3 proud all round so
       the opening stroke leaves no ghost; the holes are punched in it. -->
  <rect id="plate" x="15.33" y="2.88" width="55.13" height="12.66" fill="#9aa1a8"/>
  <g id="vents"><rect x="65.52" y="14.13" width="3.45" height="3.08" rx="0.60" fill="#17191c"/><rect x="60.54" y="14.13" width="3.45" height="3.08" rx="0.60" fill="#17191c"/><rect x="55.55" y="14.13" width="3.45" height="3.08" rx="0.60" fill="#17191c"/><rect x="50.55" y="14.13" width="3.45" height="3.08" rx="0.60" fill="#17191c"/><rect x="71.25" y="10.50" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="71.25" y="5.85" width="3.45" height="3.26" rx="0.60" fill="#17191c"/><rect x="44.32" y="14.13" width="3.45" height="3.08" rx="0.60" fill="#17191c"/><rect x="39.30" y="14.13" width="3.45" height="3.08" rx="0.60" fill="#17191c"/><rect x="34.35" y="14.13" width="3.45" height="3.08" rx="0.60" fill="#17191c"/><rect x="29.36" y="14.13" width="3.45" height="3.08" rx="0.60" fill="#17191c"/><rect x="23.63" y="10.50" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="23.63" y="5.85" width="3.45" height="3.26" rx="0.60" fill="#17191c"/><rect x="18.60" y="10.50" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="18.60" y="5.85" width="3.45" height="3.26" rx="0.60" fill="#17191c"/><rect x="13.63" y="10.50" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="13.63" y="4.53" width="3.45" height="4.56" rx="0.60" fill="#17191c"/></g>
  <g id="slots"></g>
  <g id="silkscreen">
    <text id="label-1" x="70.36" y="9.77" transform="rotate(180 70.36 8.69)" font-family="sans-serif" font-size="3.0" font-weight="bold" text-anchor="middle" fill="#2b2d2f">1</text>
    <text id="label-2" x="27.74" y="9.72" transform="rotate(180 27.74 8.64)" font-family="sans-serif" font-size="3.0" font-weight="bold" text-anchor="middle" fill="#2b2d2f">2</text>
  </g>
</svg>
