<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="21.59mm" viewBox="0 0 120.02 21.59">
  <!-- nvidia/mcx621202-fh: MCX621202A on its tall bracket. The outline, tip
       and keyed flange are std/pcie-bracket-fh@2, composed BEHIND this; what is drawn
       here is the punched plate: vents, light-pipe slots and port numerals.
       TIP AT THE LEFT - NVIDIA draws the card tip-right, so this is its
       figure turned a half-turn and the numerals read upside down. -->
  <!-- METAL FILLING THE OPENING: the bracket colour, 0.3 proud all round so
       the opening stroke leaves no ghost; the holes are punched in it. -->
  <rect id="plate" x="19.66" y="6.05" width="90.50" height="12.66" fill="#9aa1a8"/>
  <g id="vents"><rect x="74.19" y="14.40" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="74.19" y="9.07" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="50.48" y="14.40" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="50.48" y="9.07" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="26.65" y="14.40" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="26.65" y="9.07" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="21.31" y="14.40" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="21.31" y="9.07" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="15.78" y="14.40" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="15.78" y="9.07" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="79.73" y="14.29" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="79.73" y="8.78" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="85.12" y="14.29" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="85.12" y="8.78" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="90.51" y="14.29" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="90.51" y="8.78" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="96.06" y="14.29" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="96.06" y="8.78" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="101.37" y="14.29" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="101.37" y="8.78" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="106.76" y="14.29" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="106.76" y="8.78" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="112.15" y="14.29" width="3.60" height="3.60" rx="0.60" fill="#17191c"/><rect x="112.15" y="8.78" width="3.60" height="3.60" rx="0.60" fill="#17191c"/></g>
