<svg xmlns="http://www.w3.org/2000/svg" width="6.6mm" height="49.5mm" viewBox="0 0 6.6 49.5">
  <!-- aperture: the connector's footprint on the card's top edge, 6.6 x 49.5, estimated -->
  <rect id="opening" x="0" y="0" width="6.6" height="49.5" rx="0.5" fill="#17191c"/>
  <!-- the mating well the bridge's plug enters -->
  <rect id="inlet-face" x="0.8" y="0.8" width="5.0" height="47.9" rx="0.3" fill="#0d0f11"/>
  <!-- the housing's rim, standing proud round the well: an outline with the well
       cut out of it, so it builds as a tube -->
  <path id="rim" fill="#2c3036" fill-rule="evenodd" stroke="#4a4d52" stroke-width="0.1"
        d="M 0.5 0 H 6.1 Q 6.6 0 6.6 0.5 V 49 Q 6.6 49.5 6.1 49.5 H 0.5 Q 0 49.5 0 49 V 0.5 Q 0 0 0.5 0 Z
           M 0.8 0.8 H 5.8 V 48.7 H 0.8 Z"/>
  <!-- contact rows standing on the well's floor, schematic: the pad count is not published -->
  <g fill="#b9bfc6">
    <rect id="contact-a" x="1.75" y="2.2" width="0.9" height="45.1" rx="0.15"/>
    <rect id="contact-b" x="3.95" y="2.2" width="0.9" height="45.1" rx="0.15"/>
  </g>
</svg>
