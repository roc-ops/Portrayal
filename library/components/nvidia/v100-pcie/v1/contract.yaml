format: 1
kind: module
name: v100-pcie
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA Tesla V100 PCIe GPU Accelerator (16 GB or 32 GB HBM2), a passive
  dual-slot full-height full-length card on NVIDIA's Form Factor 3.0 board. The
  two memory sizes are one card to the eye and to NVIDIA's brief, which draws
  one board for both. The bracket face is a plate with a truss of vent openings
  and no ports. The far end is open. It has one CPU 8-pin power connector at
  the east edge and no NVLink connector on a PCIe card. It plugs into one riser
  slot and covers the one beside it.
slot-width: 2
size: {w: 120.02, h: 41.91, d: 266.70}
size-confidence: {w: registry, h: registry, d: drawing}
unplaced: >-
  no bay in the library lists this card in `accepts`. The one riser that spans,
  dell/riser-1a-14g@2's `slot-1`, is the Dell R740xd's, and that server's
  manual (table 27) names "Nvidia A16, A30, A40, A100, A800" for double-width
  GPUs and not the V100. A server whose documents list this card, and a riser
  bay that spans for it, would seat it.
attrs:
  model: 'Tesla V100 PCIe'
  part-numbers: 'NVPN 699-2G500-0200-XXX (16 GB), NVPN 699-2G500-0202-XXX (32 GB)'
  gpu-sku: 'GV100-893-A1 (16 GB), GV100-897-A1 (32 GB)'
  role: gpu
  form-factor: 'Dual-slot, 10.5 in, NVIDIA Form Factor 3.0, full-height bracket'
  pcie-connector: x16
  pcie-generation: 3
  pcie-height: full
  power-draw-max-w: 250
  power-input: 'host PCIe slot and one CPU 8-pin auxiliary connector'
  memory: '16 GB or 32 GB HBM2, 4096-bit, up to 900 GB/s'
  cooling: passive
  airflow: 'bidirectional; the heat sink takes system airflow either way along the card'
  nvlink: 'none on the PCIe card'
  weight-kg: 1.196
  eol: none-announced
faces:
  rear: {ref: nvidia/v100-pcie-tail@1}
  plan:
    ref: common/pcie-card-plan@1
provenance:
  slot-width: >-
    datasheet - PB-08744 overview: "a dual-slot 10.5 inch PCI Express Gen3
    card". The card declares `slot-width: 2` as
    docs/pcie-two-slot-bays-design.md R1 defines it, and its face is one plate
    36 across (`face-outline`).
  memory-sizes: >-
    datasheet - PB-08744 tables 1 and 2 list two columns, the 16 GB card
    (NVPN 699-2G500-0200, GV100-893-A1, base clock 1245 MHz) and the 32 GB card
    (NVPN 699-2G500-0202, GV100-897-A1, base 1230 MHz); both are 250 W, 4096-bit
    and up to 900 GB/s. A MODULE CONTRACT HAS NO `configurations` KEY (the schema
    admits it on a kit only), so the two are ONE COMPONENT and `attrs.memory`
    and `attrs.part-numbers` name both. The brief draws one board and one
    figure 3 for both and prints one weight. The bracket and the body are the
    same for the two; nothing held says otherwise.
  sources: >-
    NVIDIA Tesla V100 PCIe GPU Accelerator Product Brief PB-08744-001_v05,
    NVIDIA's own copy (https://images.nvidia.com/content/tesla/pdf/Tesla-V100-PCIe-Product-Brief.pdf).
    Tables 1 and 2, figure 1 (the board with the optional I/O bracket, a line
    drawing seen from the bracket end), figure 3 (board dimensions), figure 4
    (the CPU 8-pin connector, an end view) and the power, extender and
    form-factor text. NVIDIA's V100 datasheets (two editions) carry no card
    dimension. NVIDIA's brief forbids reproducing its figures, so its facts
    are transcribed and none of its figures is copied.
  reference-photos: >-
    NONE. No photograph of this card was found at NVIDIA or PNY, or for the
    P100, P40 or P4 either (NVIDIA's V100 page redirects to the data-center
    index). The only picture of the bracket
    is figure 1 of the brief, a LINE DRAWING in perspective, and figure 3,
    an orthographic line drawing of the broad side. Everything on the bracket
    face is drawn from those two, and every colour is a choice (see
    `body-colour`).
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2,
    PCIe CEM 5.0 figure 11-5). h is two slots: the single bracket's 21.59 plus
    one 20.32 slot pitch, 41.91, as on the A100 and the L40.
  depth: >-
    drawing - PB-08744 figure 3, titled "with optional I/O bracket": 266.70
    from the bracket's outer face to the card's end, 111.15 high. Measured on
    the 1286 px page the bracket line is at x 150 and the end at 1283, so
    4.248 px/mm along the card, and the 111.15 runs from y 6 to y 477, so 4.237
    px/mm across: the figure is orthographic to 0.3 percent and can carry
    readings. The A100 40GB's figure 3 prints the same 266.7.
  face-outline: >-
    borrowed - nvidia/a100-pcie-80gb@1 `face-outline`: the dual-slot bracket's
    plate, its two retention tabs, its V notch and the flange, drawn with the
    same path (the envelope of `std/pcie-bracket-fh-2slot@1`, 36 across). PB-08744
    figure 1 draws the same two feet at the tip and the same keyed flange.
    Not measured on this card.
  face-window: >-
    estimated - figure 1 shows the plate as a frame round one window filled
    with a truss: a row of diagonals in two bands with three round bosses down
    the middle (a screw about the middle, a hole near each end), and printed
    text near the tip ("0449-063" and a line under it, turned). A perspective
    drawing of an edge cannot measure the window. It is drawn as a window x
    22.0 to 108.0 and y 7.5 to 36.5, a truss of two bands of struts 1.3 wide
    at 45 degrees on a 14.5 pitch, and one screw of 1.5 radius at x 21.0, y 22.0.
    All of it is estimated, and the heat sink is not drawn behind it.
  face-markings: >-
    estimated - the printed text near the tip is not drawn: its characters
    cannot be read from the line drawing.
  thickness: >-
    estimated - PB-08744 states no thickness and figure 4's end view is not
    dimensioned. The shroud's far face is put at y 40.0, the A100 80GB's
    (nvidia/a100-pcie-80gb@1 `thickness`, 38.2 from its backplate), so the body
    stands 35.56 above the board's outer face. THIS CARD DRAWS NO BACKPLATE,
    because no picture shows one, so its body is 2.67 thinner than the A100's.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the A100 are. The board, and
    the bracket's keyed side, are at the top (small y); the cooler is below the
    board in this frame.
  body: >-
    the board, its edge and the pads follow PCIe CEM 5.0 (figures 6-5 and 11-3,
    as nvidia/mcx755106-fh@1 has them) at PB-08744 figure 3's lengths: the card
    111.15 high, the board's lower edge 13.25 above the finger datum W (figure 3
    reads 12.7 at 4.237 px/mm, within its resolution), the key slot at 57.7 behind
    the bracket on the page (CEM's 57.15 datum, taken as the figure's), and the
    finger tab ending at x 700, 129.5 behind the bracket, which is CEM's x16
    72.15 past the datum (129.3, as nvidia/t4@1 has it). THE BOARD'S OUTLINE
    HAS NO 3.55 NOTCH HERE as the A100's does: figure 3's lower edge is straight
    from the tab to the end, with a small hook at 139.4 to 145.5 that is not
    drawn (see `gaps`). The shroud and the cover follow the board's outline.
  body-colour: >-
    estimated - figures 1 and 3 are line drawings, so NO COLOUR IS HELD. The
    shroud is drawn a dark grey and the cover black to mark an unknown, not a
    finding. The drawings show the card's broad side as a cover with a raised
    rim, "TESLA" printed up the bracket end and an NVIDIA mark and wordmark on
    the top edge near the middle (all drawn only as the mark's reserved zone).
  body-top-edge: >-
    estimated - figure 1 shows the NVIDIA mark and wordmark on the top edge at
    about the card's middle. The mark is reserved as `logo-zone` and the wordmark
    is drawn at a place read as a fraction of the length (about 0.40) and a size
    of the L40's. Not measured.
  body-power-connector: >-
    estimated - PB-08744: "a CPU 8-pin power connector on the East edge of the
    board", and figure 4 draws it in an end view beside the board. THE FIGURE
    PUTS IT NEARER THE MIDDLE OF THE BOARD'S HEIGHT THAN THE A100'S PHOTOGRAPH
    DOES (by eye, about a sixth of the way down), and its scale is not known, so
    it was not measured or reconciled (see `gaps`). The housing is drawn at the
    A100 80GB's place by the top edge, kept as a placeholder (x 105.6 to
    124.0, as nvidia/a100-pcie-80gb@1 `body-power-connector`, photo-measured
    there on its own card, borrowed here), 18.4 along and 10.85 across, with eight
    cells in two rows of four on the 4.2 pitch. Its depth and colour are not seen
    here. THE PORT is `aux-power` on the rear face (`faces.rear`,
    nvidia/v100-pcie-tail@1): std/eps12v-header@1, which presents `eps12v-8pin`
    for a CPU 8-pin cable and which the card exports as a power port. PB-08744
    table 6 lists one CPU 8-pin cable, or the dongle NVPN 030-0571-000 to two
    PCIe 8-pin cables.
  body-far-end: >-
    estimated - the far end is open: figure 4 draws the heat sink's fins edge-on
    behind a rim. THE FINS ARE NOT DRAWN. Figure 4 is not dimensioned, so their
    pitch cannot be put to a scale (about 54 rows were counted on a figure whose
    px/mm is not known), and no photograph exists. The opening is drawn dark
    inside a rim 2.1 thick, as the A100's, estimated.
  extenders: >-
    datasheet - PB-08744 "Extenders": a long offset extender (NVPN
    682-00003-5555-002, card plus extender 339 mm, 52 g) and a straight
    extender (NVPN 682-00003-5555-000, 312 mm, 42 g), figures 6 and 7. NOT
    MODELLED: the card has no `extender` field, and the mounting bosses are not
    seen.
  power: >-
    datasheet - PB-08744 tables 1 and 5: total board power 250 W, the TDP of
    Max-P mode; Max-Q lets the operator set any value below 250 W. Filed as the
    maximum.
  weight: >-
    datasheet - PB-08744 table 1: board 1196 g; the bracket with screws is 21 g.
  memory: >-
    datasheet - PB-08744 table 2: HBM2, 16 GB or 32 GB, 4096-bit, 877 MHz
    maximum memory clock, up to 900 GB/s.
  pcie: >-
    datasheet - PB-08744 table 1: PCI Express 3.0 x16, lane and polarity
    reversal supported.
  environment: >-
    datasheet - PB-08744 table 4: operating 0 to 45 C, storage -40 to 75 C,
    humidity 5 to 90 percent operating. The brief says the device must be
    installed with the bracket facing the side of the equipment. Not carried
    in `attrs`, which has no section for it here.
  part-numbers: >-
    datasheet - PB-08744 table 1 gives NVPN 699-2G500-0200-XXX and
    699-2G500-0202-XXX. No order code or reseller part number is written in a
    document held.
  nvlink: >-
    datasheet - PB-08744 does not mention NVLink and the card has no bridge
    connector on its top edge in figures 1 and 3; the SXM2 V100 carries NVLink
    and is a different part.
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) the bracket face straight on (needs-photo:
    the truss, its bosses and the printing are estimated from a line drawing);
    (2) every colour (needs-photo); (3) the far end, its fins and bosses
    (needs-photo, needs-drawing); (4) the extenders, which the brief draws
    (needs-drawing); (5) the board's hook at 139.4 to 145.5 behind the bracket
    (needs-drawing); (6) the thickness, which no source states (vendor-silent);
    (7) a separate 16 GB and 32 GB module, which a module contract cannot
    express; (8) the power connector's depth, colour and place along the
    board's height (needs-photo, needs-drawing: figure 4 puts it lower than
    the A100's place, which is drawn).
  lifecycle: >-
    No end-of-life notice for the V100 PCIe was found. NVIDIA's own V100 page
    redirects to its data-center index and PNY lists no V100 page, which is
    retirement shown as a missing page, not an announcement; the attr says
    `none-announced` because nothing was announced.
