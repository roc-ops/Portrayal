<svg xmlns="http://www.w3.org/2000/svg" width="97.9mm" height="265.8mm" viewBox="-6.29 0 97.9 265.8">
  <!-- nvidia/p100-pcie: THE SHROUD'S BROAD SIDE, the body's bottom side seen
       from outside. Across: 120.02 (the face's width) less the face's x, so the
       card's top edge is at -6.29 and its lower edge at 91.61. Down: 266.7 less
       mm behind the bracket's outer face, so the far end is at the top and the
       bracket's end at the bottom. A dark cover with a darker panel inside its
       rim, as PB-08248 figure 2 draws the broad side (the same drawing as the
       V100's figure 3: the panel from 24.7 to 242.5 behind the bracket and from
       24 to 74 below the top edge), and "TESLA" printed across the bracket end.
       The word is turned half a turn so that it reads upright in the viewer's
       bottom view, where the bracket end is at the top (checked in the 3D
       viewer); the colours are a choice (provenance body-colour). -->
  <rect x="-6.29" y="0" width="97.9" height="265.8" fill="#3a3d42"/>
  <rect x="17.7" y="24.2" width="50.0" height="217.8" rx="1.5" fill="#2a2d31"/>
  <g id="silkscreen">
    <text x="43.0" y="257.0" transform="rotate(180 43.0 252.3)" text-anchor="middle" font-family="sans-serif" font-size="13.0" font-weight="bold" fill="#c8c8c8" textLength="40.0" lengthAdjust="spacingAndGlyphs">TESLA</text>
  </g>
</svg>
