<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="41.91mm" viewBox="0 0 120.02 41.91">
  <!-- nvidia/p100-pcie: the Tesla P100 PCIe dual-slot bracket, seen from
       OUTSIDE the chassis, drawn from the facts in the contract's provenance.
       THE ONLY PICTURES ARE LINE DRAWINGS (PB-08248 figures 1 and 2), so the
       window, its truss and its screw are estimated and nothing is traced.
       TIP AT THE LEFT, flange end at the right, the board's side at the top, as
       std/pcie-bracket-fh@2 is drawn. The plate is the A100's outline. -->
  <path id="plate" d="M1.9 7.4 L7.27 7.4 L9.57 5.1 L20.0 5.1 L21.0 4.1 L119.2 4.1 L119.2 0.3 L120.02 0.3 L120.02 39.7 L119.2 39.7 L119.2 40.0 L9.67 40.0 L7.27 37.6 L1.9 37.6 A1.9 1.9 0 0 1 0 35.7 L0 29.8 A1.9 1.9 0 0 1 1.9 27.9 L7.27 27.9 L10.95 24.22 A2.4 2.4 0 0 0 10.95 20.88 L7.27 17.2 L1.9 17.2 A1.9 1.9 0 0 1 0 15.3 L0 9.3 A1.9 1.9 0 0 1 1.9 7.4 Z" fill="#9aa1a8" stroke="#5f666d" stroke-width="0.4" stroke-linejoin="round"/>
  <!-- the fold: the flange turns 90 degrees here. On an elevation it is a line. -->
  <path id="flange-fold" d="M119.6 0.6 V39.4" stroke="#5f666d" stroke-width="0.3" fill="none"/>
  <!-- the window's raised rim, the window and the truss of two bands of X
       struts on a 14.5 pitch. The window and screw are inside the group,
       because the 3D relief paints the raised rim with this node's own art and
       would otherwise hide them. -->
  <defs>
    <pattern id="truss" patternUnits="userSpaceOnUse" x="22.0" y="7.5" width="14.5" height="14.5">
      <path d="M0 0 L14.5 14.5 M14.5 0 L0 14.5" stroke="#a7aeb5" stroke-width="1.3" fill="none"/>
    </pattern>
  </defs>
  <g id="grille">
    <rect x="20.0" y="6.5" width="89.0" height="31.0" rx="2.0" fill="#a7aeb5" stroke="#5f666d" stroke-width="0.35"/>
    <rect id="vent" x="22.0" y="7.5" width="86.0" height="29.0" rx="1.0" fill="#141618" stroke="#41474d" stroke-width="0.3"/>
    <rect x="22.0" y="7.5" width="86.0" height="29.0" fill="url(#truss)"/>
    <g id="screw-1"><circle cx="21.0" cy="22.0" r="1.5" fill="#b9bfc5" stroke="#5f666d" stroke-width="0.25"/><circle cx="21.0" cy="22.0" r="0.55" fill="#4a4f55"/></g>
  </g>
</svg>
