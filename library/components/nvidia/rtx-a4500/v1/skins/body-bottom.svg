<svg xmlns="http://www.w3.org/2000/svg" width="97.9mm" height="265.8mm" viewBox="-6.29 0 97.9 265.8">
  <!-- nvidia/rtx-a4500: THE SHROUD'S BROAD SIDE, the body's bottom side seen
       from outside. Across: 120.02 (the face's width) less the face's x, so the
       card's top edge is at -6.29 and its lower edge at 91.61. Down: 266.7 less
       mm behind the bracket's outer face, so the far end is at the top and the
       bracket's end at the bottom. Matte black, lighter toward the far end as PNY's
       broad-side photograph is, with the blower's opening: a bezel, a bright inner
       rim, 53 short blades leaning 20 degrees against the turn, a dark well and a
       hub with its own bright rim. The ring is centred 69.0 from the far end and
       43.3 below the top edge (provenance body-fan). Drawn in-house; nothing is
       traced. -->
  <defs>
    <linearGradient id="matte" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1c1c1d"/>
      <stop offset="0.15" stop-color="#161617"/>
      <stop offset="0.40" stop-color="#111112"/>
      <stop offset="0.55" stop-color="#1b1b1c"/>
      <stop offset="0.78" stop-color="#2c2c2e"/>
      <stop offset="0.95" stop-color="#3c3c3e"/>
    </linearGradient>
    <!-- one blade, at the top of the ring (centre at 0 0): from r 26.6 out to r 31.7,
         the outer end turned 3.7 degrees counter-clockwise (the 20 degree lean) -->
    <path id="blade" d="M0 -26.6 L-2.04 -31.63" fill="none" stroke="#5a5d61" stroke-width="0.55"/>
  </defs>
  <rect x="-6.29" y="0" width="97.9" height="265.8" fill="url(#matte)"/>
  <circle id="fan-bezel" cx="37.0" cy="69.0" r="38.5" fill="#222224" stroke="#34353a" stroke-width="0.4"/>
  <circle id="fan-groove" cx="37.0" cy="69.0" r="35.9" fill="#1c1c1e" stroke="#0e0e0f" stroke-width="0.5"/>
  <circle id="fan-rim" cx="37.0" cy="69.0" r="34.45" fill="#060607" stroke="#686b6f" stroke-width="0.6"/>
  <circle id="fan-well" cx="37.0" cy="69.0" r="26.5" fill="#0d0d0e"/>
  <g id="blades" transform="translate(37.0 69.0)">
