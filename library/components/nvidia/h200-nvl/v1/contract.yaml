format: 1
kind: module
name: h200-nvl
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA H200 NVL GPU (141 GB HBM3e), a passive dual-slot full-height
  full-length card. The bracket face carries one vent window and no ports. One
  wide NVLink bridge connector sits on the top edge under a removable cap. The
  far end is open and shows the heat sink's fins edge-on. It has one 16-pin
  power connector by the top edge. It plugs into one riser slot and covers the
  one beside it.
slot-width: 2
size: {w: 120.02, h: 41.91, d: 268.60}
size-confidence: {w: registry, h: registry, d: drawing}
unplaced: >-
  no bay in the library lists this card in `accepts`. The one riser that spans,
  dell/riser-1a-14g@2's `slot-1`, is the Dell R740xd's, and that server's
  documents cap a double-width GPU at 300 W (spec sheet, "Accelerator options")
  against this card's 600 W. The other Dell risers with a double-width slot
  model it as one bay with no `span`, or only as a half-length riser, so none
  takes a card two slots wide. A server whose documents list this card, and a
  riser bay that spans for it, would seat it.
attrs:
  model: 'H200 NVL'
  part-numbers: 'PNY NVH200NVLTCGPU-KIT'
  board-sku: 'P1010 SKU 230, NVPN 900-21010-xx40-xxx'
  role: gpu
  form-factor: 'Full-height, full-length (FHFL) 10.5 in, dual-slot'
  pcie-connector: x16
  pcie-generation: 5
  pcie-height: full
  power-draw-max-w: 600
  power-input: 'host PCIe slot and one PCIe 16-pin (12VHPWR) auxiliary connector'
  memory: '141 GB HBM3e, 6016-bit, 4,813 GB/s'
  cooling: passive
  airflow: 'bidirectional; the heat sink takes system airflow either way along the card'
  nvlink: 'one bridge connector on the top edge; 900 GB/s with a 2-slot bridge'
  weight-kg: 1.217
  eol: none-announced
faces:
  rear: {ref: nvidia/h100-pcie-tail@1}
provenance:
  slot-width: >-
    datasheet - PB-12128 table 2-1: form factor "Full-height, full-length (FHFL)
    10.5', dual-slot". The face is the same one plate 36 across as the A100's
    (`face-outline`). The card declares `slot-width: 2` as
    docs/pcie-two-slot-bays-design.md R1 defines it.
  sources: >-
    NVIDIA H200 NVL GPU Product Brief PB-12128-001_v01 (April 2025), fetched
    from NVIDIA's product page link
    https://dam-cdn.nvd.orangelogic.com/AssetLink/7n7vya4684sdccfyy6kv37ek5lw702h7.pdf.
    ITS FOOTER SAYS "NVIDIA CONFIDENTIAL" AND THE INTAKE RECORDS "PREPARED AND
    PROVIDED UNDER NDA", although NVIDIA's public H200 page links it; per the
    owner's decision of 2026-10-07 on such documents its facts are transcribed
    here, cited by that public URL. Tables 2-1, 2-2, 4-1 to 4-3, figure 4-1 (the
    top edge with the NVLink cap, an orthographic line drawing), figure 4-2 (card
    dimensions), figure 4-3 (the 16-pin connector, an end view), figure 4-5 (the
    extender) and the NVLink, power and extender text. PNY's H200 NVL datasheet
    for the PNY part number. NVIDIA's brief forbids reproducing its figures, so
    its facts are transcribed and none of its figures is copied. This card is built
    from nvidia/h100-nvl@1 wherever the two share a part, because figure 4-2 is
    that card's figure 5 with the same lengths.
  reference-photos: >-
    reference - PNY's product render
    https://d2vfia6k6wrouk.cloudfront.net/productimages/ab2f11c5-8853-4088-88c5-b1380098c279/images/h200-nvl-3qtr-right-reverse.png,
    800 x 800, and NVIDIA's own h200nvl-ari.jpg, 2560 x 1440: 3/4 views of the
    broad side and the bracket end. PNY's is the same bytes as it serves for the
    H100 NVL, so it may show either card. Licence not stated; facts read from
    them, pictures not used. THEY CANNOT MEASURE ANYTHING.
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2,
    PCIe CEM 5.0 figure 11-5). h is two slots: the single bracket's 21.59 plus
    one 20.32 slot pitch, 41.91, as on the A100.
  depth: >-
    drawing - PB-12128 figure 4-2: 266.70 +/-0.30 from the inside of the PCB
    outline, 0.90 from the cover edge to that outline and 1.00 from the outside of
    the I/O bracket to the cover edge. 1.00 + 0.90 + 266.70 = 268.60.
  face-outline: >-
    borrowed - nvidia/a100-pcie-80gb@1 `face-outline`, `face-keyed-flange`,
    `face-grille` and `face-markings`: the bracket's outline, its two retention
    tabs, its V notch, the raised grille frame, the vent window, the four Torx
    screws and the sixteen fins behind it, measured there from a straight-on
    photograph of an A100 80GB. THIS CARD'S OWN BRACKET WAS NOT PHOTOGRAPHED.
    NVIDIA's 3/4 render shows a framed vent window on a two-tab plate.
  thickness: >-
    estimated - 38.2 as on the A100 (see its `thickness`). PB-12128 figure 4-1 is
    an orthographic drawing of the top edge, so it measures the thickness
    directly: 184 rows from the top line to the bottom one at 4.784 px/mm, 38.5.
    This card keeps 38.2 so that the cards of the family share one envelope; the
    0.3 is the width of the drawn lines.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the A100 are. The board, and the
    bracket's keyed side, are at the top (small y).
  body: >-
    the board, its edge and the pads follow PCIe CEM 5.0 (figures 6-5 and 11-3,
    as nvidia/mcx755106-fh@1 has them) at PB-12128 figure 4-2's lengths: the board
    97.90 +/-0.20 high, its lower edge 13.25 +/-0.20 above the finger datum W, the
    key datum 59.05, the long run of the tab 81.90 past it, and a notch 3.57 deep
    and 19.48 long whose near end is 59.05 + 81.90 = 140.95 behind the bracket,
    all as nvidia/h100-nvl@1 has them. THE COVER, SHROUD AND BACKPLATE START 1.00
    behind the bracket's outer face and THE BOARD 1.90 behind it, as the figure
    dimensions them. The figure's 7.95 at the notch and the hockey stick tab it
    draws are not modelled.
  body-shroud: >-
    borrowed - nvidia/a100-pcie-80gb@1 `body-shroud`: a champagne shroud with a
    black cover on the board's side and a black backplate, split at the notch.
    Figure 4-1 draws the black band 13.2 across (63 rows at 4.784 px/mm), which
    agrees with the cover and backplate together (12.63), and the ribbed shroud
    below it.
  body-nvlink: >-
    drawing - one wide NVLink bridge connector on the top edge under a removable
    cap, labelled NVLINK. Figure 4-1, an orthographic line drawing, puts the cap
    from 67.9 to 167.4 behind the bracket's outer face (99.5 long) and 7.0 across,
    read on the 1347 px page with the bracket's face at x 59 and the card's end at x
    1344 as 268.60 (4.784 px/mm). The cap's 0.5 stand-off is estimated. THE BOX
    BELOW (`nvlink-1`) IS THE CAP. NO NVLINK CONNECTOR PART IS COMPOSED AND NO
    FACE CARRIES ONE: the registry's `nvlink-a100-pcie` is the A100's connector,
    about half this one's length, and PB-12128 lists bridges of its own part
    numbers (table 4-2: 900-23945-xx00-xxx and 900-23946-xx00-xxx). The card
    exports no NVLink port. PB-12128 says the card takes "one single wide NVLink
    bridge" in a 2-slot or a 4-slot form.
  body-power-connector: >-
    borrowed - nvidia/h100-nvl@1 `body-power-connector`: the housing, its 12 power
    and 4 sense contacts, 19.0 along the card and 9.2 across, 3.3 from the top
    edge, read on PNY's L40S east-end photograph and PB-11773 figure 6. PB-12128
    says "One PCIe 16-pin auxiliary power connector (12VHPWR auxiliary power
    connector)" and figure 4-3, the end view, puts it in the same corner. THE TWO
    NAMES DISAGREE INSIDE THE BRIEF: its table 4-3 is "PCIe CEM 5.1", which is the
    revision that names 12V-2x6. The port uses the brief's product-line wording,
    std/12vhpwr-header@1 (`pcie-12vhpwr`), through nvidia/h100-pcie-tail@1; the
    plug is the same for both. THE PORT is `aux-power` on that rear face,
    which the card exports as a power port.
  body-end: >-
    estimated - as nvidia/a100-pcie-80gb@1 `body-end`: the black end plate
    (backplate, board and cover) stops 0.4 short of the shroud's lip and the
    housing and mount bosses stand 0.2 proud of it.
  body-tail-fins: >-
    estimated - the shroud is open at its far end (nvidia/h100-pcie-tail@1
    `fins`). The 18 fins at a 5.0 pitch are the A100's and are not counted on this
    card.
  body-extender-mount: >-
    estimated - the two bosses of nvidia/h100-nvl@1, at the card's x 35.3 and 64.1
    and y 8.4, 4.0 across and 0.4 proud: the A100's. No extender is drawn.
  extenders: >-
    datasheet - PB-12128 "Extender": an enhanced straight extender (NVPN
    151-0398-000, card plus extender 312 mm, 35 g), figure 4-5. NOT MODELLED: the
    figure has no dimension that was read, so the card has no `extender` field.
  power: >-
    datasheet - PB-12128 table 2-1: on a 16-pin cable strapped for 600 W, the
    maximum (default) total board power is printed with a symbol the PDF's text
    extraction renders as ">" before 600 W, 350 W (the power compliance limit)
    and 200 W (the minimum). The text says the card "requires up to 600 W" from
    the connector and that it will not boot on a cable strapped for less (table
    4-3), so attrs carry 600 W. The reading of the symbol was not checked against
    the page's picture.
  weight: >-
    datasheet - PB-12128 table 2-1: board 1,217 g excluding the bracket, extender
    and bridge. The bracket with screws is 20 g, the enhanced straight extender 35
    g, the 2-way bridge 49 g and the 4-way bridge 128 g.
  memory: >-
    datasheet - PB-12128 table 2-2: HBM3e, 141 GB, 6016-bit, 3,201 MHz, 4,813 GB/s.
  pcie: >-
    datasheet - PB-12128 table 2-1: PCI Express Gen5 x16, Gen5 x8 and Gen4 x16,
    lane and polarity reversal supported.
  part-numbers: >-
    datasheet - PNY's datasheet gives its part number NVH200NVLTCGPU-KIT; the
    brief's table 2-1 gives the board SKU P1010 SKU 230, NVPN 900-21010-xx40-xxx.
    PNY's line card prints NVIDIA PN 900-21010-0040-000 for this card, which only
    that one document gives, so no full order code is written.
  nvlink: >-
    datasheet - PB-12128 table 4-1: one bridge, 18 links, 900 GB/s. Table 4-2:
    the 2-slot bridge (900-23945-xx00-xxx, 900 GB/s) spans two cards and the
    4-slot bridge (900-23946-xx00-xxx, 1800 GB/s) spans four. Table 4-1 prints the
    data rate per lane as "50 gigabytes per second", which is not a lane rate; it
    is not used.
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) the bracket face straight on, for this card
    (needs-photo; the A100's is carried over); (2) a side elevation of this card
    (needs-photo; the shroud's bands are the A100's); (3) the NVLink connector's
    interface and part, which the registry does not have (needs-drawing, and a
    registry entry the sources do not yet carry); (4) the thickness, which no
    source states (vendor-silent; the drawing reads 38.5); (5) the full NVIDIA
    order code, which only PNY's line card gives (vendor-silent in NVIDIA's own
    documents); (6) the
    enhanced straight extender (needs-drawing); (7) the 12VHPWR against 12V-2x6
    wording (sources-disagree inside the brief); (8) the power table's symbol
    (needs-source); (9) the 16-pin housing's depth and colour (needs-photo); (10)
    a photograph that is the H200 NVL and not the H100 NVL.
  lifecycle: >-
    No end-of-life notice for the H200 NVL was found, and NVIDIA's line card of
    August 2025 lists it as a current part. The attr says `none-announced`.
