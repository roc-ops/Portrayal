format: 1
kind: module
name: l40
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA L40 GPU (48 GB GDDR6), a passive dual-slot full-height full-length
  card and the L40S's sibling. The bracket face carries four DisplayPort
  connectors on the board's side and one vent window beside them. The far end
  is open and shows the heat sink's fins edge-on. It has one 16-pin 12VHPWR
  power connector by the top edge and two bosses at the far end. It has no
  NVLink. It plugs into one riser slot and covers the one beside it.
slot-width: 2
size: {w: 120.02, h: 41.91, d: 268.60}
size-confidence: {w: registry, h: registry, d: drawing}
unplaced: >-
  no bay in the library lists this card in `accepts`. The one riser that spans,
  dell/riser-1a-14g@2's `slot-1`, is the Dell R740xd's. That server's manual
  (table 27) names "Nvidia A16, A30, A40, A100, A800" for double-width GPUs and
  does not name the L40, whose 300 W is the spec sheet's ceiling for one
  double-width GPU. The other Dell risers with a double-width slot model it as
  one bay with no `span`, or only as a half-length riser. A server whose
  documents list this card, and a riser bay that spans for it, would seat it.
attrs:
  model: 'L40'
  part-numbers: 'PNY NVL40TCGPU-KIT'
  board-sku: 'PG133 SKU 250, NVPN 699-2G133-0250-xxx (as the brief prints it)'
  role: gpu
  form-factor: 'Full-height, full-length (FHFL) 10.5 in, dual-slot'
  pcie-connector: x16
  pcie-generation: 4
  pcie-height: full
  power-draw-max-w: 300
  power-input: 'host PCIe slot and one PCIe 16-pin (12VHPWR) auxiliary connector'
  memory: '48 GB GDDR6, 384-bit, 864 GB/s'
  display-ports: '4 x DisplayPort 1.4a on the bracket'
  cooling: passive
  airflow: 'bidirectional; the heat sink takes system airflow either way along the card'
  nvlink: 'none'
  weight-kg: 1.051
  eol: none-announced
faces:
  rear: {ref: nvidia/l40s-tail@1}
provenance:
  slot-width: >-
    datasheet - PB-11131 table 1: form factor "Full-height, full-length (FHFL)
    10.5', dual-slot". The face is one plate 36 across (`face-outline`). The
    card declares `slot-width: 2` as docs/pcie-two-slot-bays-design.md R1
    defines it.
  sources: >-
    NVIDIA L40 GPU Accelerator Product Brief PB-11131-001_v03 (January 2023),
    NVIDIA's own copy, and its v02 served by PNY. Tables 1 and 2, figure 3
    (card dimensions), figures 4 and 5 (the 16-pin connector, an end view and
    its pins), the power, display and extender text. NVIDIA's vGPU datasheet
    for the L40 and PNY's datasheet for the PNY part number. PB-11131 figure 3
    is the L40S's drawing (PB-11470) and the A100 80GB's figure for figure
    (268.60 and 267.70, 59.05, 81.88 REF, 19.50 REF, 3.55 REF, 13.25, 111.15,
    104.86), so the body is the one nvidia/l40s@1 has and the provenance says
    where they differ. NVIDIA's brief forbids reproducing its figures, so its
    facts are transcribed and none of its figures is copied.
  reference-photos: >-
    reference - PNY's product images for the L40, under
    https://d2vfia6k6wrouk.cloudfront.net/productimages/7f3c20b9-b2e3-4ec9-a71c-af5c0145ae88/images/:
    nvidia-l40-left-left.png (the bracket straight on, 189 x 566 px),
    nvidia-l40-right.png (the far end straight on, 178 x 451 px),
    nvidia-l40-front.png and nvidia-l40-left-back.png (the two broad sides) and
    three 3/4 views. Licence not stated; facts read from them, pictures not
    used. They are the same pictures as PNY's L40S ones at 1.6 times the pixels.
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2,
    PCIe CEM 5.0 figure 11-5). h is two slots: the single bracket's 21.59 plus
    one 20.32 slot pitch, 41.91, as on the A100 and the L40S.
  depth: >-
    drawing - PB-11131 figure 3: product length 268.60 with the I/O bracket,
    267.70 without. The card ends 268.60 behind the bracket's outer face.
  face-outline: >-
    photo-measured - PNY's straight-on bracket photograph (nvidia-l40-left-left.png),
    scaled by the two retention tabs, whose centres are 92 px apart, the 20.32
    pitch, so 4.53 px/mm. The tabs are 46 px wide, 10.2 mm, against the 9.8 the
    L40S's skin draws, and the plate's step at the tabs and the V notch match
    the L40S's to the readings' 0.5. THE PLATE IS THEREFORE THE L40S'S OUTLINE,
    which is the A100's (`std/pcie-bracket-fh-2slot@1`'s envelope, 36 across),
    drawn with the same path.
  face-displayports: >-
    photo-measured - four DisplayPort receptacles along the board's side, in the
    same photograph. The centres of the four dark openings are 94 px apart on
    average (about 20.8 mm, readings good to 0.5), against the 21.2 measured
    on the L40S's smaller picture, so the L40S's centres, 40.7 to 104.3, are
    kept. Each shell is drawn 18.3 long and 7.3 across as the L40S's.
    THE LIBRARY HAS NO DISPLAYPORT PART OR INTERFACE, so each is an element of
    class `connector` painted in the skin and not a seated part; nothing mates
    it and the module type carries no port for them (the `display-ports` attr
    says 4 x DisplayPort 1.4a, the datasheet's words).
  face-grille: >-
    photo-measured - a raised frame held by four Torx screws covers one vent
    window below the DisplayPorts, as on the L40S. In this photograph the fins
    show behind the window on a pitch of 18.6 px, 4.11 mm, against the 4.18 the
    L40S's picture gave. The drawn frame ends 7.8 short of the photograph's, at x
    109.11, as nvidia/l40s@1 and nvidia/a100-pcie-80gb@1 draw theirs:
    std/pcie-bracket-fh-2slot@1's windows end 12.76 from the flange, and the
    riser's post covers the rest. This end is a drawing choice, not a
    measurement. THE FIN PITCH HERE (4.18) IS NOT THE 4.93 THE FAR-END
    PHOTOGRAPH SHOWS (`body-tail-fins`), and the two were not reconciled.
  face-markings: >-
    photo-measured - the bracket carries no lamp, no label and no printing
    beside the DisplayPorts.
  thickness: >-
    estimated - as nvidia/l40s@1 `thickness`: 38.2, bounded by the 2.67
    backside clearance and the bracket's far edge. The far-end photograph reads
    178 px at 4.61 px/mm, 38.6, which agrees; PB-11131 does not state it.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the L40S are. The board, and
    the bracket's keyed side, are at the top (small y), which is where the
    DisplayPorts are.
  body: >-
    the board, its edge and the pads follow PCIe CEM 5.0 (figures 6-5 and 11-3,
    as nvidia/mcx755106-fh@1 has them) at PB-11131 figure 3's lengths, which are
    the A100 80GB's: the lower edge 13.25 above the finger datum W, the key
    datum 59.05 behind the bracket, a notch 3.55 REF deep and 19.50 REF long
    whose near end is 59.05 + 81.88 = 140.93 behind the bracket, the top edge at
    W + 111.15. PNY's two side views show the same outline, with the notch.
    The shroud, cover and backplate follow the board's outline
    (`body-shroud`, estimated).
  body-shroud: >-
    borrowed - nvidia/l40s@1 `body-shroud`, itself the A100's: a champagne
    shroud with a black cover on the board's side and a black backplate, split
    at the notch. PNY's 3/4 views of this card show a champagne broad side and
    a black band along the top edge.
  body-top-edge: >-
    estimated - PNY's 3/4 view shows the NVIDIA mark and wordmark near the far
    end of the top edge. THE BRIEF SAYS NOTHING ABOUT THE TOP EDGE and no view of
    it at known scale was found, so the wordmark is drawn at the L40S's place,
    which is not measured on this card. The mark is reserved as `logo-zone`.
  body-power-connector: >-
    photo-measured - PB-11131: "One PCIe 16-pin auxiliary power connector", and
    figure 5 names "PCIe CEM 5.0", so it is a 12VHPWR. The far-end photograph
    (4.61 px/mm) shows the same housing, in the same corner, as the L40S's: its
    twelve power cells in two columns of six and a strip of four sense cells.
    The boxes below are the L40S's measurements (x 104.1 to 123.0, y 3.4 to
    12.5, contacts on a 3.0 pitch); this photograph was not measured again.
    The housing's depth, 5.8 standing in the end plate, and the contacts' sizes
    are not seen. THE PORT is `aux-power` on the rear face (`faces.rear`,
    nvidia/l40s-tail@1, shared): std/12vhpwr-header@1, which presents
    `pcie-12vhpwr` for a 16-pin cable and which the card exports as a power
    port. The header's own size is 20.85 x 11.7 (the plug's outline), larger
    than the housing measured, so the boxes keep the measured size and are the
    3D body of the port. PB-11131 table 8 lists a native 16-pin cable and a CPU
    8-pin to 16-pin adapter.
  body-end: >-
    estimated - as nvidia/l40s@1 `body-end`: the black end plate (backplate,
    board and cover) stops 0.4 short of the shroud's lip and the housing and
    mount bosses stand 0.2 proud of it.
  body-tail-fins: >-
    photo-measured - the shroud is open at its far end and the far-end
    photograph shows the fin stack edge-on behind it. Its lower fins step 22.9
    px, 4.97 mm at 4.61 px/mm, against the 4.93 the L40S gave (see
    nvidia/l40s-tail@1 `fins`, shared), so the L40S's 19 fins are kept. The
    fins' thickness (0.8) and depth (40) are estimated.
  body-extender-mount: >-
    photo-measured - the two bosses at the far end, 3.5 across, at the card's x
    36.8 and 65.2 and y 10.5, in the same places as the L40S's (nvidia/l40s-tail@1
    `mount`). They stand 0.4 proud, estimated.
  extenders: >-
    datasheet - PB-11131 "Extenders": "The NVIDIA L40 PCIe extender options are
    TBD." Its weight row lists an enhanced straight (35 g), a long offset (48 g)
    and a straight extender (32 g) but no part number or length, so the card has
    no `extender` field and none is drawn. nvidia/l40s@1's extenders are the
    L40S's and are not carried over.
  power: >-
    datasheet - PB-11131 table 1: total board power 300 W default and maximum,
    100 W minimum. The brief says the card needs up to 300 W from the 16-pin
    connector and will not boot on a cable strapped for 150 W or less (sense
    logic, its table 7).
  weight: >-
    datasheet - PB-11131 table 1: board 1,051 g, excluding the bracket and
    extenders. The bracket with screws is 20 g.
  memory: >-
    datasheet - PB-11131 table 2: GDDR6, 48 GB, 384-bit, 864 GB/s.
  pcie: >-
    datasheet - PB-11131 table 1: PCI Express Gen4 x16, lane and polarity
    reversal supported.
  display: >-
    datasheet - PB-11131 table 1: "Four DisplayPort connectors"; NVIDIA's vGPU
    datasheet and PNY's datasheet: DisplayPort 1.4a. In the default mode the
    connectors may be off; Display On modes drive up to four monitors
    (PB-11131 "Display").
  part-numbers: >-
    datasheet - PNY's datasheet gives the part number NVL40TCGPU-KIT; the brief's
    table 1 gives the board SKU "PG133 SKU 250 NVPN: 699-2G133-0250-xxx". No
    NVIDIA order code is written.
  nvlink: >-
    datasheet - PB-11131 table 1: "NVIDIA NVLink: Not supported". The card has
    no bridge connectors.
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) the DisplayPort part and interface, which the
    library lacks (the four are painted, not seated); (2) the top edge's
    connectors, if any (needs-photo); (3) the thickness, which no source states
    (vendor-silent); (4) the NVIDIA order code (vendor-silent); (5) the fin
    pitch, 4.18 through the bracket's window and 4.93 from the far end
    (sources-disagree, both measured); (6) the 16-pin housing's depth and colour
    (needs-photo); (7) the extenders (vendor-silent: the brief says TBD).
  lifecycle: >-
    No end-of-life notice for the L40 was found. NVIDIA's line card of August
    2025 does not list it and PNY's legacy page does not either; the attr says
    `none-announced` because nothing was announced.
