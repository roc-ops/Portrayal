<svg xmlns="http://www.w3.org/2000/svg" width="97.9mm" height="265.8mm" viewBox="-6.29 0 97.9 265.8">
  <!-- nvidia/rtx-a5000: THE SHROUD'S BROAD SIDE, the body's bottom side seen
       from outside. Across: 120.02 (the face's width) less the face's x, so the
       card's top edge is at -6.29 and its lower edge at 91.61. Down: 266.7 less
       mm behind the bracket's outer face, so the far end is at the top and the
       bracket's end at the bottom. Matte black with the blower's opening: a ring
       74.6 across centred 70.6 from the far end and 44.6 below the top edge
       (PNY's broad-side photograph at 2.52 px/mm, provenance body-fan), a hub and
       24 blades, all black on black. Drawn in-house; nothing is traced. -->
  <defs>
    <linearGradient id="matte" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#101113"/>
      <stop offset="1" stop-color="#1c1d20"/>
    </linearGradient>
    <path id="blade" d="M40.5 30.4 L41.2 16.2 L42.4 16.3 L41.5 30.5 Z"/>
  </defs>
  <rect x="-6.29" y="0" width="97.9" height="265.8" fill="url(#matte)"/>
  <circle id="fan-ring" cx="38.3" cy="70.6" r="37.3" fill="#080809" stroke="#2c2e32" stroke-width="0.8"/>
  <g id="blades" fill="#34363b" transform="translate(-2.2 20.2)">
    <use href="#blade" transform="rotate(0 40.5 50.4)"/>
    <use href="#blade" transform="rotate(15 40.5 50.4)"/>
    <use href="#blade" transform="rotate(30 40.5 50.4)"/>
    <use href="#blade" transform="rotate(45 40.5 50.4)"/>
    <use href="#blade" transform="rotate(60 40.5 50.4)"/>
    <use href="#blade" transform="rotate(75 40.5 50.4)"/>
    <use href="#blade" transform="rotate(90 40.5 50.4)"/>
    <use href="#blade" transform="rotate(105 40.5 50.4)"/>
    <use href="#blade" transform="rotate(120 40.5 50.4)"/>
    <use href="#blade" transform="rotate(135 40.5 50.4)"/>
    <use href="#blade" transform="rotate(150 40.5 50.4)"/>
    <use href="#blade" transform="rotate(165 40.5 50.4)"/>
    <use href="#blade" transform="rotate(180 40.5 50.4)"/>
    <use href="#blade" transform="rotate(195 40.5 50.4)"/>
    <use href="#blade" transform="rotate(210 40.5 50.4)"/>
    <use href="#blade" transform="rotate(225 40.5 50.4)"/>
    <use href="#blade" transform="rotate(240 40.5 50.4)"/>
    <use href="#blade" transform="rotate(255 40.5 50.4)"/>
    <use href="#blade" transform="rotate(270 40.5 50.4)"/>
    <use href="#blade" transform="rotate(285 40.5 50.4)"/>
    <use href="#blade" transform="rotate(300 40.5 50.4)"/>
    <use href="#blade" transform="rotate(315 40.5 50.4)"/>
    <use href="#blade" transform="rotate(330 40.5 50.4)"/>
    <use href="#blade" transform="rotate(345 40.5 50.4)"/>
  </g>
  <circle id="fan-hub" cx="38.3" cy="70.6" r="18.0" fill="#121315" stroke="#2c2e32" stroke-width="0.6"/>
</svg>
