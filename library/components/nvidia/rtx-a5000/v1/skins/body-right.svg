<svg xmlns="http://www.w3.org/2000/svg" width="265.8mm" height="35.56mm" viewBox="0.9 4.44 265.8 35.56">
  <!-- nvidia/rtx-a5000: THE TOP EDGE, the body's right side seen from outside.
       Across: mm behind the bracket's outer face (0.9 to 266.7, the shroud's
       length). Down: the face's y (4.44 the board's outer face, 40.0 the
       shroud's). Every piece whose right side is the card's top edge `shows:
       [right]` and carries its patch of this. The champagne strip is the top of
       the heat sink, smooth on this card; its place is read off a 3/4 view and
       is estimated (provenance body-top-edge). The NVLink, stereo and sync
       connectors the same view shows are not drawn. -->
  <!-- the board's edge and the black shroud -->
  <rect x="0.9" y="4.44" width="265.8" height="1.57" fill="#1d2420"/>
  <rect x="0.9" y="6.01" width="265.8" height="33.99" fill="#17181b"/>
  <!-- the heat sink's strip -->
  <rect x="12.0" y="14.0" width="218.0" height="18.0" fill="#cdb78d"/>
  <!-- the mark is reserved, not drawn (L172) -->
  <rect id="logo-zone" x="228.0" y="20.0" width="9.0" height="5.9" fill="none"/>
  <g id="silkscreen">
    <text x="3.0" y="11.5" font-family="Arial" font-weight="bold" font-size="2.4" fill="#bdb8aa">RTX A5000</text>
  </g>
</svg>
