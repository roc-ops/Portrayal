<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="41.91mm" viewBox="0 0 120.02 41.91">
  <!-- nvidia/rtx-a5000: the RTX A5000 dual-slot bracket, seen from OUTSIDE the
       chassis, drawn from the facts in the contract's provenance (a straight-on
       photograph of the bracket, scaled by the plate's own length). TIP AT THE
       LEFT, flange end at the right, the board's side at the top, as
       std/pcie-bracket-fh@2 is drawn: the photograph is turned a quarter into
       this frame. A silver plate with four DisplayPort receptacles along the
       board's side and a grid of square vent holes beside them, held by four
       Torx screws. Nothing is traced. -->
  <defs>
    <!-- one vent hole 3.65 square on a 4.67 pitch along the bracket and a 4.73
         pitch across it -->
    <pattern id="hole" patternUnits="userSpaceOnUse" x="30.97" y="15.65" width="4.67" height="4.73">
      <rect x="0" y="0" width="3.65" height="3.65" fill="#101112"/>
    </pattern>
  </defs>
  <path id="plate" d="M1.9 7.3 L7.27 7.3 L9.27 5.3 L20.5 5.3 L21.5 3.5 L119.2 3.5 L119.2 0.3 L120.02 0.3 L120.02 40.9 L119.2 40.9 L119.2 41.2 L21.5 41.2 L20.5 40.1 L9.67 40.1 L7.27 37.7 L1.9 37.7 A1.9 1.9 0 0 1 0 35.8 L0 29.4 A1.9 1.9 0 0 1 1.9 27.5 L7.27 27.5 L10.95 24.1 A2.4 2.4 0 0 0 10.95 20.9 L7.27 17.5 L1.9 17.5 A1.9 1.9 0 0 1 0 15.6 L0 9.2 A1.9 1.9 0 0 1 1.9 7.3 Z" fill="#b9bec3" stroke="#5f666d" stroke-width="0.4" stroke-linejoin="round"/>
  <!-- the fold: the flange turns 90 degrees here. On an elevation it is a line. -->
  <path id="flange-fold" d="M119.6 0.6 V40.6" stroke="#5f666d" stroke-width="0.3" fill="none"/>
  <!-- the four DisplayPort receptacles: an 18.2 x 6.9 shell with the D shape's
       chamfer at the flange end, a dark opening and two rows of pins. Each is
       drawn once at its own place; the library has no DisplayPort part. -->
  <g id="display-port-1">
    <path d="M32.0 6.15 L48.6 6.15 A0.8 0.8 0 0 1 49.4 6.95 L49.4 9.9 L46.25 13.05 L32.0 13.05 A0.8 0.8 0 0 1 31.2 12.25 L31.2 6.95 A0.8 0.8 0 0 1 32.0 6.15 Z" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M32.2 7.15 L48.4 7.15 L48.4 9.6 L45.9 12.05 L32.2 12.05 Z" fill="#18191b"/>
    <path d="M33.8 8.4 H47.0 M33.8 10.3 H44.9" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-2">
    <path d="M53.13 6.15 L69.73 6.15 A0.8 0.8 0 0 1 70.53 6.95 L70.53 9.9 L67.38 13.05 L53.13 13.05 A0.8 0.8 0 0 1 52.33 12.25 L52.33 6.95 A0.8 0.8 0 0 1 53.13 6.15 Z" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M53.33 7.15 L69.53 7.15 L69.53 9.6 L67.03 12.05 L53.33 12.05 Z" fill="#18191b"/>
    <path d="M54.93 8.4 H68.13 M54.93 10.3 H66.03" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-3">
    <path d="M74.27 6.15 L90.87 6.15 A0.8 0.8 0 0 1 91.67 6.95 L91.67 9.9 L88.52 13.05 L74.27 13.05 A0.8 0.8 0 0 1 73.47 12.25 L73.47 6.95 A0.8 0.8 0 0 1 74.27 6.15 Z" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M74.47 7.15 L90.67 7.15 L90.67 9.6 L88.17 12.05 L74.47 12.05 Z" fill="#18191b"/>
    <path d="M76.07 8.4 H89.27 M76.07 10.3 H87.17" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-4">
    <path d="M95.4 6.15 L112.0 6.15 A0.8 0.8 0 0 1 112.8 6.95 L112.8 9.9 L109.65 13.05 L95.4 13.05 A0.8 0.8 0 0 1 94.6 12.25 L94.6 6.95 A0.8 0.8 0 0 1 95.4 6.15 Z" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M95.6 7.15 L111.8 7.15 L111.8 9.6 L109.3 12.05 L95.6 12.05 Z" fill="#18191b"/>
    <path d="M97.2 8.4 H110.4 M97.2 10.3 H108.3" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <!-- the vent grid: 18 rows of 5 holes, those under the four screws' bosses
       covered by the boss -->
  <rect id="vent" x="30.97" y="15.65" width="83.03" height="22.57" fill="url(#hole)"/>
  <g id="screws">
    <g id="screw-1"><circle cx="113.5" cy="17.6" r="4.0" fill="#b9bec3"/><circle cx="113.5" cy="17.6" r="2.8" fill="#cfd2d5" stroke="#5f666d" stroke-width="0.3"/><circle cx="113.5" cy="17.6" r="1.0" fill="#4a4f55"/></g>
    <g id="screw-2"><circle cx="113.5" cy="36.2" r="4.0" fill="#b9bec3"/><circle cx="113.5" cy="36.2" r="2.8" fill="#cfd2d5" stroke="#5f666d" stroke-width="0.3"/><circle cx="113.5" cy="36.2" r="1.0" fill="#4a4f55"/></g>
    <g id="screw-3"><circle cx="32.3" cy="17.6" r="4.0" fill="#b9bec3"/><circle cx="32.3" cy="17.6" r="2.8" fill="#cfd2d5" stroke="#5f666d" stroke-width="0.3"/><circle cx="32.3" cy="17.6" r="1.0" fill="#4a4f55"/></g>
    <g id="screw-4"><circle cx="32.3" cy="36.2" r="4.0" fill="#b9bec3"/><circle cx="32.3" cy="36.2" r="2.8" fill="#cfd2d5" stroke="#5f666d" stroke-width="0.3"/><circle cx="32.3" cy="36.2" r="1.0" fill="#4a4f55"/></g>
  </g>
</svg>
