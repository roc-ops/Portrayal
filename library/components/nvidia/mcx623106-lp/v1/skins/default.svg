<svg xmlns="http://www.w3.org/2000/svg" width="79.2mm" height="18.42mm" viewBox="0 0 79.2 18.42">
  <!-- nvidia/mcx623106-lp: MCX623106A on its short bracket. The outline, tip
       and keyed flange are std/pcie-bracket-lp@1, composed BEHIND this; what is drawn
       here is the punched plate: vents, light-pipe slots and port numerals.
       TIP AT THE LEFT - NVIDIA draws the card tip-right, so this is its
       figure turned a half-turn and the numerals read upside down. -->
  <!-- METAL FILLING THE OPENING: the bracket colour, 0.3 proud all round so
       the opening stroke leaves no ghost; the holes are punched in it. -->
  <rect id="plate" x="15.33" y="2.88" width="55.13" height="12.66" fill="#9aa1a8"/>
  <g id="vents"><rect x="70.80" y="10.86" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="70.80" y="5.53" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="21.62" y="10.86" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="21.62" y="5.53" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="16.24" y="10.86" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="16.24" y="5.53" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="10.83" y="10.86" width="4.05" height="4.05" rx="0.60" fill="#17191c"/><rect x="10.83" y="5.53" width="4.05" height="4.05" rx="0.60" fill="#17191c"/></g>
  <g id="slots"><rect x="49.14" y="14.56" width="5.40" height="1.20" rx="0.60" fill="#17191c"/><rect x="56.21" y="14.56" width="5.40" height="1.20" rx="0.60" fill="#17191c"/><rect x="63.19" y="14.56" width="5.40" height="1.20" rx="0.60" fill="#17191c"/><rect x="27.91" y="14.56" width="5.40" height="1.20" rx="0.60" fill="#17191c"/><rect x="34.98" y="14.56" width="5.40" height="1.20" rx="0.60" fill="#17191c"/><rect x="41.96" y="14.56" width="5.40" height="1.20" rx="0.60" fill="#17191c"/></g>
  <g id="silkscreen">
    <text id="label-1" x="69.87" y="8.87" transform="rotate(180 69.87 8.15)" font-family="sans-serif" font-size="2.0" font-weight="bold" text-anchor="middle" fill="#2b2d2f">1</text>
    <text id="label-2" x="26.64" y="8.87" transform="rotate(180 26.64 8.15)" font-family="sans-serif" font-size="2.0" font-weight="bold" text-anchor="middle" fill="#2b2d2f">2</text>
  </g>
</svg>
