format: 1
kind: module
name: mcx512a-lp
version: 1.0.0
class: expansion-card
behaviour: fills
profile: networking
description: >-
  NVIDIA ConnectX-5 MCX512A dual-port 10/25GbE SFP28 adapter, PCIe x8, on its
  short (low-profile) bracket. The same board ships with both brackets;
  nvidia/mcx512a-fh@1 is the other.
size: {w: 79.2, h: 18.42, d: 142.24}
size-confidence: {w: registry, h: registry, d: drawing}
attrs:
  model: 'MCX512A short bracket'
  part-numbers: 'MCX512A-ACAT, MCX512A-ACUT, MCX512A-ADAT'
  role: nic
  power-draw-max-w: 17.5
  power-draw-typical-w: 12.5
  power-input: host PCIe slot
  pcie-connector: x8
  pcie-generation: 4
  pcie-height: low
  sfp28: 2
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
provenance:
  sources: >-
    CX-5 EN user manual: p12 LED interface, p50/p52 spec tables, p57 board
    drawing Dual-Port x8 Card (142.24 x 68.90), p58 MCX512F-ACAT Tall
    Bracket.
  size: >-
    registry - the face is std/pcie-bracket-lp@1, 79.2 x 18.42, composed
    behind a punched plate; `d` is the board drawing's 142.24, the card's
    length back from its bracket.
  depth: >-
    drawing - 142.24, the board mechanical drawing's length.
  the-face-is-derived-from-the-board: >-
    EVERY POSITION IS THE CARD'S, NOT THE BRACKET'S. The cages are placed at
    their distance above datum W on the dimensioned board drawing - port 1
    49.51, port 2 24.85 - with W at x' 11.11 on this bracket (PCIe CEM 5.0:
    79.20 - 68.09, fig 11-8). Vents, light-pipe slots, lamps and numerals
    keep their measured offset from their nearest cage (or from W), read off
    NVIDIA's bracket drawings. drawing - cx5en p58's MCX512F-ACAT tall
    bracket is a real SFP28 bracket. Its two 15.2 x 10.8 windows sit at d
    49.80 / 25.49 by its own 121.05, which is within 0.29 / 0.64 of the 512A
    x8 board (pitch 24.31 against 24.66). Its hexagonal vent field, the six
    1.5 squares beside each window and the LED windows and numerals keep
    their offsets from the nearest window. The across-bracket positions are
    anchored at the cage's y_lp 8.24, because the art puts the window 0.48
    higher. There is no short-bracket drawing, so the low-profile face is
    the tall one moved through the CEM W offsets. Features that would fall
    off the short metal are drawn on the tall bracket only. The drawing is
    labelled for the 512F. The only other dual-port bracket in the manual is
    QSFP28 art, and this is the manual's only SFP28 bracket, measured
    against this board.
  orientation: >-
    drawn TIP-LEFT, so NVIDIA's tip-right figures are turned a half-turn:
    cages and lamps are placed `rotate: 180` and the numerals read upside
    down. In a turned bay - Dell riser 3 - the card lands as NVIDIA draws
    it.
  lamps: >-
    drawing - one bi-colour LED per port (cx5en p12, yellow/green), shown
    through an oval window about 3.0 x 1.5 on the keyed side, 13.09 either
    side of the cages (512F art). The p57 x8 board draws the LEDs 12.97 /
    -13.36 from the cages. common/led-rect-sm@1 at 2.8 x 1.6 is 0.2 short.
  body: >-
    the board, edge tab and pads are PCIe CEM 5.0's (figs 6-5, 11-3, 11-8)
    at the board drawing's size; the heatsink is the board drawing's U1
    outline at its drawn position (the manual says a heatsink is attached to
    the IC by push pins or screws but does not draw it); its 6.0 height is
    an estimate.
  power: >-
    datasheet - cx5en p50 and p52 spec tables, typical at ATIS load and
    maximum with passive cables: MCX512A-ADAT (ConnectX-5 Ex) 12.5 W
    typical, 17.5 W maximum (21 W with a 1.5 W active cable);
    MCX512A-ACAT/-ACUT 9.5 / 11.8 W (15.1 W with a 1.5 W active cable). The
    largest passive figures are carried.
  pcie: >-
    x8 per the spec (cx5en p50/p52) and the brief; the p8 intro table's
    merged cell reads x16 for ADAT. Generation 4 is the -ADAT (Ex) member's;
    -ACAT/-ACUT are Gen3. ADAT uses the MT28808 Ex IC at about 30 percent
    more power, and its heatsink may differ; the manual does not say.
body:
  depth: 142.24
  color: '#2f7d3a'
  # the slab stops where the bracket stops being a rectangle
  plate: {at: [11.85, 0.00], size: [56.18, 18.42]}
  boxes:
  - {id: board, at: [19.51, 1.27], size: [60.50, 1.57], from: 0.00, depth: 142.24,
     color: '#2f7d3a', confidence: drawing,
     source: 'the board drawing''s 142.24 x 68.90; CEM 5.0 fig 6-5 shoulder 8.40 above W'}
  - {id: edge-tab-short, at: [11.11, 1.27], size: [8.40, 1.57], from: 46.90, depth: 11.20,
     color: '#2f7d3a', confidence: registry,
     source: 'CEM 5.0 fig 6-5: key centre 59.05 behind the bracket, 12.15 to the tab end, notch 1.90'}
  - {id: edge-tab-long, at: [11.11, 1.27], size: [8.40, 1.57], from: 60.00, depth: 38.20,
     color: '#2f7d3a', confidence: registry,
     source: 'CEM 5.0 fig 6-5: x8 DIM B 39.15 from the key centre'}
  - {id: edge-pads-short, at: [13.71, 1.22], size: [3.00, 1.67], from: 47.25, depth: 10.60,
     color: '#d4a72c', confidence: registry,
     source: 'CEM 5.0 fig 6-5: pads 2.60..5.60 up the tab, pins 1-11 on 1.00 pitch'}
  - {id: edge-pads-long, at: [13.71, 1.22], size: [3.00, 1.67], from: 60.25, depth: 37.60,
     color: '#d4a72c', confidence: registry,
     source: 'CEM 5.0 fig 6-5: the x8 pad run on 1.00 pitch'}
  - {id: heatsink, at: [39.28, 2.84], size: [25.20, 6.00], from: 75.04, depth: 25.10,
     color: '#b8bcc0', confidence: estimated,
     source: 'cx5en p57 Dual-Port x8 board: U1 outline 25.2 x 25.1 centred 40.77 above W and 87.59 behind the bracket; height not drawn'}
faces:
