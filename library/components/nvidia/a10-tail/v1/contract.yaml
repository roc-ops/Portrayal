format: 1
kind: component
name: a10-tail
version: 1.0.0
class: mechanical
profile: server
description: >-
  The far end of the NVIDIA A10 card, seen from behind. It is a black vented end
  plate with the PCIe 8-pin power connector at the corner by the top edge. It is
  the card's `faces.rear`.
size: {w: 97.90, h: 16.04}
size-confidence: {w: drawing, h: estimated}
size-notes: >-
  The end face is 97.9 across (PB-10415 figure 3's 28.41 to 126.31) and runs from
  the board's outer face to the shroud's far face, 16.04 (the card's thickness is
  itself estimated, see the card's `thickness`). NO DEPTH IS DECLARED: a face is a
  drawing of a back. SEEN FROM BEHIND WITH THE BOARD'S SIDE AT THE TOP, so x' =
  126.31 less the card's x (the top edge at the left) and y' = the card's y less
  4.44. This is the frame of nvidia/a100-pcie-80gb-tail@1 with the backplate
  taken away, as the card has none.
attrs: {media: gpu}
parts:
  # The header is 12.6 x 18.0 upright. Turned 270 about its centre it is 18.0
  # across and 12.6 down, centred on the housing's centre (x' 11.51, y' 7.87),
  # with its latch ramp toward the shroud, at the bottom.
  - {ref: std/pcie-8pin-header@1, id: aux-power, at: [5.21, -1.13], rotate: 270}
provenance:
  size: >-
    drawing - see size-notes.
  connector: >-
    estimated - PB-10415: "One PCIe 8-pin auxiliary power connector" on the east
    edge; figure 4 is an end view that says the connector's position on the image
    is approximate. The part is std/pcie-8pin-header@1, turned a quarter so its
    two columns of four become two rows, and put at the A100's place by the top
    edge (nvidia/a100-pcie-80gb-tail@1), on the board's component side. PNY's
    top-right render shows a dark vented end plate with the connector in that
    corner; it cannot measure it.
  end-plate: >-
    estimated - a black end plate over the full 97.9 x 16.04. PNY's top-right render
    shows windows in it; their sizes and places are not drawn.
elements: {}
skins: [default]
