<svg xmlns="http://www.w3.org/2000/svg" width="97.9mm" height="16.04mm" viewBox="0 0 97.9 16.04">
  <!-- nvidia/rtx-a4000-tail: the RTX A4000's far end seen from behind, from the
       board's rear face (y 0) to the shroud's far wall (y 16.04). THE TOP EDGE
       IS AT THE LEFT: x' = 126.31 less the card's x. A closed black end plate.
       The 6-pin power connector at the corner by the top edge is the card's 3D
       housing and is not a part here (the library has no 6-pin interface).
       Drawn in-house; nothing is traced. -->
  <rect id="end-plate" x="0" y="0" width="97.9" height="16.04" fill="#17181b"/>
</svg>
