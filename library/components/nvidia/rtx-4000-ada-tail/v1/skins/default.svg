<svg xmlns="http://www.w3.org/2000/svg" width="97.9mm" height="18.71mm" viewBox="0 0 97.9 18.71">
  <!-- nvidia/rtx-4000-ada-tail: the RTX 4000 Ada's far end seen from behind, from
       the backplate's outer face (y 0) to the shroud's far wall (y 18.71). THE TOP
       EDGE IS AT THE LEFT: x' = 126.31 less the card's x. A closed black end plate
       with the 16-pin power connector at the corner by the top edge, which the
       contract composes. Drawn in-house; nothing is traced. -->
  <rect id="end-plate" x="0" y="0" width="97.9" height="18.71" fill="#18181a"/>
  <rect id="backplate-edge" x="0" y="0" width="97.9" height="2.67" fill="#26272a"/>
</svg>
