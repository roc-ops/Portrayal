format: 1
kind: component
name: rtx-4000-ada-tail
version: 1.0.0
class: mechanical
profile: server
description: >-
  The far end of the NVIDIA RTX 4000 Ada card, seen from behind. It is a closed
  black end plate over the backplate, with the 16-pin CEM5 power connector at the
  corner by the top edge. It is the card's `faces.rear`.
size: {w: 97.90, h: 18.71}
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  The end face is 97.9 across (the board's height from the A100 80GB's PB-10577
  figure 3, 28.41 to 126.31 on the card, which the RTX 4000 Ada's photographed
  side agrees with to 0.3 percent) and runs from the backplate's outer face to the
  shroud's far wall, 18.71 (the card's thickness is itself estimated at 20.48, see
  the card's `thickness`). NO DEPTH IS DECLARED: a face is a drawing of a back.
  SEEN FROM BEHIND WITH THE BOARD'S SIDE AT THE TOP, so x' = 126.31 less the
  card's x (the top edge at the left) and y' = the card's y less 1.77. This is
  the frame of nvidia/rtx-4500-ada-tail@1 and nvidia/l40s-tail@1.
attrs: {media: gpu}
parts:
  # The header is 20.85 across and 11.7 down. Its centre is the housing's: x'
  # 12.76 (the card's x 113.55) and y' 8.84 (the card's y 10.61). Half-turned so
  # that the four sense contacts are at the top, toward the backplate, as
  # nvidia/l40s-tail@1 has it.
  - {ref: std/12vhpwr-header@1, id: aux-power, at: [2.335, 2.99], rotate: 180}
provenance:
  size: >-
    estimated - see size-notes.
  connector: >-
    estimated - NVIDIA's power guide DA-07261 table 1 says "CEM5 16-pin" for the
    RTX 4000 Ada, 130 W, and the Ada quick-start guide says "connect the auxiliary
    power cable ... to the 16-pin PCIe CEM5 connector on the back edge" and lists a
    1x PCIe 8-pin to 1x CEM5 16-pin adapter in its box (the RTX 6000, 5000 and 4500
    have the 2x adapter). NVIDIA's own render of the RTX 4000 Ada shows the
    connector at the end face's corner by the top edge, on the board's side, its
    long side along the card's width; it has no scale. The place and size are
    nvidia/l40s-tail@1's (the L40S housing, measured on a photograph of that
    card), on this card's component face. The part is std/12vhpwr-header@1 because
    DA-07261 calls it the PCIe CEM5 16-pin, the 12VHPWR of CEM 5.0. No photograph of
    this card's end is held.
  end-plate: >-
    estimated - a closed black end plate over the full 97.9 x 18.71, with the
    backplate's 2.67 band along the foot. NVIDIA's render shows a plain end face
    with two small round holes, which are not drawn, and the maker's mark beside the
    connector, which is reserved on the card's top edge, not here.
elements: {}
skins: [default]
