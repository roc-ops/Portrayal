format: 1
kind: module
name: rtx-a4000
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA RTX A4000 (16 GB GDDR6), an actively cooled single-slot full-height
  workstation card with a blower. The bracket face is silver with four
  DisplayPort connectors on the board's side and a column of square vent holes
  beside them. The shroud is matte black with a field of vent slits near the
  bracket and the blower's opening on its broad side. It has one 6-pin PCIe
  power connector at the far end by the top edge. It plugs into one riser slot
  and covers none beside it.
size: {w: 120.02, h: 21.59, d: 241.30}
size-confidence: {w: registry, h: registry, d: datasheet}
unplaced: >-
  no bay in the library lists this card in `accepts`. A riser bay names each
  card it takes by hand (docs/cards-by-interface-design.md), and no document
  held says any server takes a workstation card, so none was added. A server
  whose documents list this card would seat it in a full-length slot.
attrs:
  model: 'RTX A4000'
  part-numbers: 'PNY VCNRTXA4000-PB (retail), VCNRTXA4000-SB (single bulk), VCNRTXA4000-BLK (bulk), VCNRTXA4000-EDU (education), VCNRTXA4000-TAA'
  role: gpu
  form-factor: 'Full-height, full-length (FHFL) 4.4 in x 9.5 in, single slot'
  pcie-connector: x16
  pcie-generation: 4
  pcie-height: full
  power-draw-max-w: 140
  power-input: 'host PCIe slot and one PCIe 6-pin auxiliary connector'
  memory: '16 GB GDDR6, 256-bit, 448 GB/s'
  display-ports: '4 x DisplayPort 1.4a on the bracket'
  cooling: active
  airflow: 'blower; it draws air from the card''s broad side and exhausts toward the bracket'
  nvlink: 'none'
