<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="21.59mm" viewBox="0 0 120.02 21.59">
  <!-- nvidia/rtx-a4000: the RTX A4000 on its full-height bracket. The outline,
       tip and keyed flange are std/pcie-bracket-fh@2, composed BEHIND this; what
       is drawn here is the punched plate: four DisplayPort receptacles along the
       board's side, a column of 16 square vent holes beside them and a Torx screw
       at each end of it. TIP AT THE LEFT, flange end at the right, the board's
       side at the top: the photograph (tip at the bottom) is turned a quarter
       into this frame. Every place is read on the photograph (provenance
       face-grille); nothing is traced. -->
  <rect id="plate" x="19.66" y="6.05" width="90.5" height="12.66" fill="#a7aeb5"/>
  <!-- the four DisplayPort receptacles: an 18.2 x 6.9 shell with the D shape's
       chamfer at the flange end, a dark opening and two rows of pins. Each is
       drawn once at its own place; the library has no DisplayPort part. -->
  <g id="display-port-1">
    <path d="M32.2 6.15 L48.8 6.15 A0.8 0.8 0 0 1 49.6 6.95 L49.6 9.9 L46.45 13.05 L32.2 13.05 A0.8 0.8 0 0 1 31.4 12.25 L31.4 6.95 A0.8 0.8 0 0 1 32.2 6.15 Z" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M32.4 7.15 L48.6 7.15 L48.6 9.6 L46.1 12.05 L32.4 12.05 Z" fill="#18191b"/>
    <path d="M34.0 8.4 H47.2 M34.0 10.3 H45.1" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-2">
    <path d="M53.47 6.15 L70.07 6.15 A0.8 0.8 0 0 1 70.87 6.95 L70.87 9.9 L67.72 13.05 L53.47 13.05 A0.8 0.8 0 0 1 52.67 12.25 L52.67 6.95 A0.8 0.8 0 0 1 53.47 6.15 Z" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M53.67 7.15 L69.87 7.15 L69.87 9.6 L67.37 12.05 L53.67 12.05 Z" fill="#18191b"/>
    <path d="M55.27 8.4 H68.47 M55.27 10.3 H66.37" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-3">
    <path d="M74.73 6.15 L91.33 6.15 A0.8 0.8 0 0 1 92.13 6.95 L92.13 9.9 L88.98 13.05 L74.73 13.05 A0.8 0.8 0 0 1 73.93 12.25 L73.93 6.95 A0.8 0.8 0 0 1 74.73 6.15 Z" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M74.93 7.15 L91.13 7.15 L91.13 9.6 L88.63 12.05 L74.93 12.05 Z" fill="#18191b"/>
    <path d="M76.53 8.4 H89.73 M76.53 10.3 H87.63" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-4">
    <path d="M96.0 6.15 L112.6 6.15 A0.8 0.8 0 0 1 113.4 6.95 L113.4 9.9 L110.25 13.05 L96.0 13.05 A0.8 0.8 0 0 1 95.2 12.25 L95.2 6.95 A0.8 0.8 0 0 1 96.0 6.15 Z" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M96.2 7.15 L112.4 7.15 L112.4 9.6 L109.9 12.05 L96.2 12.05 Z" fill="#18191b"/>
    <path d="M97.8 8.4 H111.0 M97.8 10.3 H108.9" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <!-- the vent column: 16 square holes 3.65 across on a 4.90 pitch along the
       bracket, from x 34.7 to 111.8 -->
  <g id="vent" fill="#101112">
    <rect x="34.67" y="15.34" width="3.65" height="3.65"/>
    <rect x="39.57" y="15.34" width="3.65" height="3.65"/>
    <rect x="44.47" y="15.34" width="3.65" height="3.65"/>
    <rect x="49.37" y="15.34" width="3.65" height="3.65"/>
    <rect x="54.27" y="15.34" width="3.65" height="3.65"/>
    <rect x="59.17" y="15.34" width="3.65" height="3.65"/>
    <rect x="64.07" y="15.34" width="3.65" height="3.65"/>
    <rect x="68.97" y="15.34" width="3.65" height="3.65"/>
    <rect x="73.87" y="15.34" width="3.65" height="3.65"/>
    <rect x="78.77" y="15.34" width="3.65" height="3.65"/>
    <rect x="83.67" y="15.34" width="3.65" height="3.65"/>
    <rect x="88.57" y="15.34" width="3.65" height="3.65"/>
    <rect x="93.47" y="15.34" width="3.65" height="3.65"/>
    <rect x="98.37" y="15.34" width="3.65" height="3.65"/>
    <rect x="103.27" y="15.34" width="3.65" height="3.65"/>
    <rect x="108.17" y="15.34" width="3.65" height="3.65"/>
  </g>
  <!-- the two Torx screws at the ends of the column -->
  <g id="screw-1"><circle cx="31.1" cy="17.2" r="2.45" fill="#cfd2d5" stroke="#5f666d" stroke-width="0.3"/><circle cx="31.1" cy="17.2" r="0.9" fill="#4a4f55"/></g>
  <g id="screw-2"><circle cx="115.4" cy="17.2" r="2.45" fill="#cfd2d5" stroke="#5f666d" stroke-width="0.3"/><circle cx="115.4" cy="17.2" r="0.9" fill="#4a4f55"/></g>
</svg>
