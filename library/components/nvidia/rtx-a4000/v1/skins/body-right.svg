<svg xmlns="http://www.w3.org/2000/svg" width="240.3mm" height="16.04mm" viewBox="1.0 4.44 240.3 16.04">
  <!-- nvidia/rtx-a4000: THE TOP EDGE, the body's right side seen from outside.
       Across: mm behind the bracket's outer face (1.0 to 241.3, the shroud's
       length). Down: the face's y (4.44 the board's outer face, 20.48 the
       shroud's). Every piece whose right side is the card's top edge `shows:
       [right]` and carries its patch of this. The champagne strip is the top of
       the heat sink; its place is read off a 3/4 view and is estimated
       (provenance body-top-edge). The stereo and sync connectors the same view
       shows are not drawn. The maker's mark is reserved, not drawn. -->
  <rect x="1.0" y="4.44" width="240.3" height="1.57" fill="#1d2420"/>
  <rect x="1.0" y="6.01" width="240.3" height="14.47" fill="#17181b"/>
  <!-- the heat sink's strip -->
  <rect x="30.0" y="9.0" width="175.0" height="8.0" fill="#cdb78d"/>
  <!-- the mark is reserved, not drawn (L172) -->
  <rect id="logo-zone" x="214.0" y="9.0" width="9.0" height="5.9" fill="none"/>
</svg>
