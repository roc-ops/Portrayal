<svg xmlns="http://www.w3.org/2000/svg" width="97.9mm" height="240.3mm" viewBox="-6.29 0 97.9 240.3">
  <!-- nvidia/rtx-a4000: THE SHROUD'S BROAD SIDE, the body's bottom side seen
       from outside. Across: 120.02 (the face's width) less the face's x, so the
       card's top edge is at -6.29 and its lower edge at 91.61. Down: 241.3 less
       mm behind the bracket's outer face, so the far end is at the top and the
       bracket's end at the bottom. Matte black with 25 vent slits near the
       bracket's end (low contrast in the photograph, so their number and pitch
       are estimated) and the blower's opening: a ring 58 across centred 47.5
       from the far end and 45.4 below the top edge (PNY's broad-side
       photograph at 2.80 px/mm, provenance body-fan), with a hub and 24 grey
       blades. Drawn in-house; nothing is traced. -->
  <defs>
    <linearGradient id="matte" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#101113"/>
      <stop offset="1" stop-color="#1c1d20"/>
    </linearGradient>
    <pattern id="slit" patternUnits="userSpaceOnUse" x="0.26" y="191.5" width="3.6" height="40.7">
      <rect x="0" y="0" width="0.9" height="40.7" fill="#08090a"/>
    </pattern>
    <path id="blade" d="M39.1 31.5 L40.0 20.5 L41.4 20.7 L40.4 31.6 Z"/>
  </defs>
  <rect x="-6.29" y="0" width="97.9" height="240.3" fill="url(#matte)"/>
  <rect id="slits" x="0.26" y="191.5" width="90.0" height="40.7" fill="url(#slit)"/>
  <circle id="fan-ring" cx="39.1" cy="47.5" r="29.0" fill="#080809" stroke="#2c2e32" stroke-width="0.8"/>
  <g id="blades" fill="#7d8187">
    <use href="#blade" transform="rotate(0 39.1 47.5)"/>
    <use href="#blade" transform="rotate(15 39.1 47.5)"/>
    <use href="#blade" transform="rotate(30 39.1 47.5)"/>
    <use href="#blade" transform="rotate(45 39.1 47.5)"/>
    <use href="#blade" transform="rotate(60 39.1 47.5)"/>
    <use href="#blade" transform="rotate(75 39.1 47.5)"/>
    <use href="#blade" transform="rotate(90 39.1 47.5)"/>
    <use href="#blade" transform="rotate(105 39.1 47.5)"/>
    <use href="#blade" transform="rotate(120 39.1 47.5)"/>
    <use href="#blade" transform="rotate(135 39.1 47.5)"/>
    <use href="#blade" transform="rotate(150 39.1 47.5)"/>
    <use href="#blade" transform="rotate(165 39.1 47.5)"/>
    <use href="#blade" transform="rotate(180 39.1 47.5)"/>
    <use href="#blade" transform="rotate(195 39.1 47.5)"/>
    <use href="#blade" transform="rotate(210 39.1 47.5)"/>
    <use href="#blade" transform="rotate(225 39.1 47.5)"/>
    <use href="#blade" transform="rotate(240 39.1 47.5)"/>
    <use href="#blade" transform="rotate(255 39.1 47.5)"/>
    <use href="#blade" transform="rotate(270 39.1 47.5)"/>
    <use href="#blade" transform="rotate(285 39.1 47.5)"/>
    <use href="#blade" transform="rotate(300 39.1 47.5)"/>
    <use href="#blade" transform="rotate(315 39.1 47.5)"/>
    <use href="#blade" transform="rotate(330 39.1 47.5)"/>
    <use href="#blade" transform="rotate(345 39.1 47.5)"/>
  </g>
  <circle id="fan-hub" cx="39.1" cy="47.5" r="15.5" fill="#121315" stroke="#3a3c40" stroke-width="0.6"/>
</svg>
