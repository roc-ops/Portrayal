<svg xmlns="http://www.w3.org/2000/svg" width="97.9mm" height="38.23mm" viewBox="0 0 97.9 38.23">
  <!-- nvidia/quadro-rtx-passive-tail: the Quadro RTX 8000 and 6000 passive
       cards' far end seen from behind, from the backplate (y 0) to the
       shroud's far wall (y 38.23). THE TOP EDGE IS AT THE LEFT: x' = 126.31 less
       the card's x. The black band is above (backplate, board, cover), the open
       shroud below with the fin stack edge-on. Drawn in-house on the frame of
       nvidia/a100-pcie-80gb-tail@1; nothing is traced. -->
  <rect id="end-plate" x="0" y="0" width="97.9" height="12.63" fill="#202326"/>
  <!-- the shroud's rim: a wall round the opening, 2.1 thick, estimated -->
  <rect id="shroud-rim" x="0" y="12.63" width="97.9" height="25.6" fill="#4a4d52"/>
  <rect id="opening" x="2.1" y="12.63" width="93.7" height="23.5" fill="#07080a"/>
  <!-- the fin stack, edge-on: 17 fins on a 5.24 pitch, 0.8 thick; the first
       is at x' 94.66, the card's x 30.85 -->
  <g id="fins" fill="#2b2e32">
    <rect x="94.66" y="12.63" width="0.8" height="23.5"/>
    <rect x="89.42" y="12.63" width="0.8" height="23.5"/>
    <rect x="84.18" y="12.63" width="0.8" height="23.5"/>
    <rect x="78.94" y="12.63" width="0.8" height="23.5"/>
    <rect x="73.70" y="12.63" width="0.8" height="23.5"/>
    <rect x="68.46" y="12.63" width="0.8" height="23.5"/>
    <rect x="63.22" y="12.63" width="0.8" height="23.5"/>
    <rect x="57.98" y="12.63" width="0.8" height="23.5"/>
    <rect x="52.74" y="12.63" width="0.8" height="23.5"/>
    <rect x="47.50" y="12.63" width="0.8" height="23.5"/>
    <rect x="42.26" y="12.63" width="0.8" height="23.5"/>
    <rect x="37.02" y="12.63" width="0.8" height="23.5"/>
    <rect x="31.78" y="12.63" width="0.8" height="23.5"/>
    <rect x="26.54" y="12.63" width="0.8" height="23.5"/>
    <rect x="21.30" y="12.63" width="0.8" height="23.5"/>
    <rect x="16.06" y="12.63" width="0.8" height="23.5"/>
    <rect x="10.82" y="12.63" width="0.8" height="23.5"/>
  </g>
</svg>
