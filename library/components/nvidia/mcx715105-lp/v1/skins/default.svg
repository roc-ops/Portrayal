<svg xmlns="http://www.w3.org/2000/svg" width="79.2mm" height="18.42mm" viewBox="0 0 79.2 18.42">
  <!-- nvidia/mcx715105-lp: MCX715105A on its short bracket. The outline, tip
       and keyed flange are std/pcie-bracket-lp@1, composed BEHIND this; what is drawn
       here is the punched plate: vents, light-pipe slots and port numerals.
       TIP AT THE LEFT - NVIDIA draws the card tip-right, so this is its
       figure turned a half-turn and the numerals read upside down. -->
  <!-- METAL FILLING THE OPENING: the bracket colour, 0.3 proud all round so
       the opening stroke leaves no ghost; the holes are punched in it. -->
  <rect id="plate" x="15.33" y="2.88" width="55.13" height="12.66" fill="#9aa1a8"/>
  <g id="vents"><rect x="44.21" y="14.06" width="3.45" height="3.16" rx="0.60" fill="#17191c"/><rect x="39.26" y="14.06" width="3.45" height="3.16" rx="0.60" fill="#17191c"/><rect x="34.19" y="14.06" width="3.45" height="3.16" rx="0.60" fill="#17191c"/><rect x="29.25" y="14.06" width="3.45" height="3.16" rx="0.60" fill="#17191c"/><rect x="49.90" y="10.37" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="49.90" y="4.37" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="54.90" y="10.37" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="54.90" y="4.37" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="59.90" y="10.37" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="59.90" y="4.37" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="64.90" y="10.37" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="64.90" y="4.37" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="69.81" y="10.37" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="69.81" y="4.37" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="23.54" y="10.37" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="23.54" y="5.71" width="3.45" height="3.31" rx="0.60" fill="#17191c"/><rect x="18.57" y="10.37" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="18.57" y="5.71" width="3.45" height="3.31" rx="0.60" fill="#17191c"/><rect x="13.54" y="10.37" width="3.45" height="4.66" rx="0.60" fill="#17191c"/><rect x="13.54" y="4.37" width="3.45" height="4.66" rx="0.60" fill="#17191c"/></g>
