format: 1
kind: module
name: a30
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA A30 GPU (24 GB HBM2), a passive dual-slot full-height full-length card
  on the A100 80GB's board outline. The bracket face carries one vent window and
  no ports. One NVLink bridge connector sits on the top edge. The far end is
  open and shows the heat sink's fins edge-on. It has one CPU 8-pin power
  connector by the top edge and two bosses for an extender. NVIDIA's straight or
  long offset extender can be fitted to the far end; the `extender` field
  chooses it. It plugs into one riser slot and covers the one beside it.
slot-width: 2
size: {w: 120.02, h: 41.91, d: 268.60}
size-confidence: {w: registry, h: registry, d: drawing}
unplaced: >-
  no bay in the library lists this card in `accepts`. The one riser that spans,
  dell/riser-1a-14g@2's `slot-1`, is the Dell R740xd's, whose manual (table 27)
  names "Nvidia A16, A30, A40, A100, A800" for double-width GPUs, and the card's
  165 W is under the spec sheet's 300 W ceiling. Seating it is one `accepts`
  entry in that riser, which is an edit to an existing component that this
  change does not make.
attrs:
  model: 'A30'
  part-numbers: 'PNY NVA30TCGPU-KIT'
  board-sku: 'P1001 SKU 205, NVPN 699-21001-0205-xxx'
  role: gpu
  form-factor: 'Full-height, full-length (FHFL) 10.5 in, dual-slot'
  pcie-connector: x16
  pcie-generation: 4
  pcie-height: full
  power-draw-max-w: 165
  power-input: 'host PCIe slot and one CPU 8-pin auxiliary connector'
  memory: '24 GB HBM2, 3072-bit, up to 933 GB/s'
  cooling: passive
  airflow: 'bidirectional; the heat sink takes system airflow either way along the card'
  nvlink: 'one bridge connector on the top edge; 200 GB/s with one adjacent A30'
  weight-kg: 1.24
  eol: none-announced
fields:
  extender:
    label: Extender
    type: choice
    options: [none, straight, long-offset]
    default: none
    drawn-by-absence: [none]
    description: >-
      The bracket at the card's far end that a server's card guide holds. The
      straight one (NVPN 682-00007-5555-001) makes the card 312 mm long. The
      long offset one (NVPN 682-00007-5555-000) makes it 339 mm.
faces:
  rear: {ref: nvidia/a100-pcie-80gb-tail@1}
provenance:
  slot-width: >-
    datasheet - PB-10418 table 1: form factor "Full-height, full-length (FHFL)
    10.5', dual-slot". The face is one plate 36 across (`face-outline`). The card
    declares `slot-width: 2` as docs/pcie-two-slot-bays-design.md R1 defines it.
  sources: >-
    NVIDIA A30 Tensor Core GPU Product Brief PB-10418-001_v03 (March 2022),
    NVIDIA's own copy. Tables 1, 2 and 7, figure 4 (NVLink connector placement,
    a keep-out), figure 5 (card dimensions), figure 6 (CPU 8-pin connector, an
    end view), figure 8 (the extenders) and the NVLink, power and root of trust
    text. NVIDIA's A30 datasheet and PNY's datasheet for the PNY part number.
    PB-10418 figure 5 is the A100 80GB's drawing figure for figure (268.60 and
    267.70, 59.05, 81.88 REF, 19.50 REF, 3.55 REF, 13.25, 111.15, 104.86), so the
    body is the pilot nvidia/a100-pcie-80gb@1's and the provenance says where
    they differ. NVIDIA's brief forbids reproducing its figures, so its facts
    are transcribed and none of its figures is copied.
  reference-photos: >-
    reference - PNY's product images for the A30, under
    https://d2vfia6k6wrouk.cloudfront.net/productimages/657d4d3b-cbcc-4062-9c43-ad0c008df229/images/:
    a30_front.png (the broad side) and a30-3qtr-top-left.png and
    a30_3qtr-top-right.png (3/4 views, the first showing the bracket's window at
    an angle). NVIDIA's own tensor-core page image. Licence not stated; facts
    read from them, pictures not used. NO STRAIGHT-ON VIEW OF THE BRACKET, THE
    FAR END OR THE TOP EDGE EXISTS.
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2,
    PCIe CEM 5.0 figure 11-5). h is two slots: the single bracket's 21.59 plus
    one 20.32 slot pitch, 41.91, as on the A100.
  depth: >-
    drawing - PB-10418 figure 5: product length 268.60 with the I/O bracket,
    267.70 without. The card ends 268.60 behind the bracket's outer face.
  face-outline: >-
    borrowed - nvidia/a100-pcie-80gb@1 `face-outline`, measured on a straight-on
    photograph of that card. PNY's 3/4 view of the A30 shows the same plate: two
    retention tabs, the V notch between them and a framed vent window with four
    screws. Nothing measures this card's bracket, so it is the A100's drawing,
    and the figure 5 outline (104.86 to the flange end, 111.15 card height) is
    the same.
  face-grille: >-
    borrowed - nvidia/a100-pcie-80gb@1 `face-grille`: a raised frame held by four
    Torx screws over one vent window, with 16 heat-sink fins behind it on a 5.0
    pitch. The 3/4 view shows the frame, the four screws and fins in the window.
    The drawn frame ends 8.49 short of the A100 photograph's, as the pilot
    draws it.
  face-markings: >-
    estimated - the 3/4 view shows no lamp, no label and no connector on the
    bracket; a straight-on view could show printing it cannot resolve.
  thickness: >-
    estimated - as nvidia/a100-pcie-80gb@1 `thickness`: 38.2, bounded by the
    2.67 backside clearance and the bracket's far edge. PB-10418 states a
    clearance behind the PCB for the bridge, not the thickness.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the A100 are. The board, and the
    bracket's keyed side, are at the top (small y).
  body: >-
    the board, its edge and the pads follow PCIe CEM 5.0 (figures 6-5 and 11-3,
    as nvidia/mcx755106-fh@1 has them) at PB-10418 figure 5's lengths, which are
    the A100 80GB's: the lower edge 13.25 above the finger datum W, the key
    datum 59.05 behind the bracket, a notch 3.55 REF deep and 19.50 REF long
    whose near end is 59.05 + 81.88 = 140.93 behind the bracket, the top edge at
    W + 111.15. PNY's broad-side render shows the same outline with the notch.
  body-shroud: >-
    borrowed - nvidia/a100-pcie-80gb@1 `body-shroud`: a champagne shroud with a
    black cover on the board's side and a black backplate, split at the notch.
    PNY's 3/4 views show a champagne broad side and a black band along the top
    edge, with a ribbed edge.
  body-nvlink: >-
    datasheet - PB-10418 table 7: one NVLink bridge, 32 Rx and Tx lanes at 50
    Gbps each way, 200 GB/s with one adjacent A30. Figure 4 is a keep-out with
    no dimensions, and shows the connector's cap lettered NVLINK next to the
    bracket's end. PNY's 3/4 view shows one cap on the top edge. ITS PLACE ALONG
    THE EDGE WAS NOT MEASURED: no top-edge view at known scale exists, so no cap
    is drawn and no face composes a connector. THE A100'S
    nvidia/nvlink-a100-connector@1 IS NOT USED: the registry says the A30's
    bridge has its own part number and no source says the two intermate. The
    fact is the `nvlink` attr.
  body-power-connector: >-
    borrowed - nvidia/a100-pcie-80gb@1 `body-power-connector`: PB-10418 says "One
    CPU 8-pin auxiliary power connector", and figure 6, the end view, puts it in
    the corner by the top edge above two windows and two bosses, as the A100's
    end view does. The housing, its eight cells and its size are the A100's,
    photographed on that card (black); this card's housing colour is not seen.
    THE PORT is `aux-power` on the rear face (`faces.rear`,
    nvidia/a100-pcie-80gb-tail@1, shared): std/eps12v-header@1, which presents
    `eps12v-8pin` for a CPU 8-pin cable and which the card exports as a power
    port. PB-10418 lists a CPU 8-pin cable and a CPU 8-pin to PCIe 8-pin adapter.
  body-end: >-
    estimated - as nvidia/a100-pcie-80gb@1 `body-end`: the black end plate stops
    0.4 short of the shroud's lip and the connector housing and mount bosses
    stand proud of it.
  body-tail-fins: >-
    borrowed - nvidia/a100-pcie-80gb@1 `body-tail-fins`: 18 fins on a 5.0 pitch,
    edge-on behind the open end. NVIDIA's A30 figure 6 does not draw them and no
    photograph of this card's far end was found.
  body-extender-mount: >-
    borrowed - the two bosses of nvidia/a100-pcie-80gb@1, at the card's x 35.3
    and 64.1 and y 8.4, 4.0 across and 0.4 proud. PB-10418 figure 6 draws two
    round holes in the end plate where the A100's end view does.
  power: >-
    datasheet - PB-10418 table 1: total board power 165 W. The brief does not say
    whether that is the default, the maximum or the minimum, so it is filed as
    the maximum and the brief's wording is kept here. It gives no ambient.
  weight: >-
    datasheet - PB-10418 table 1: board 1,240 g, excluding the bracket,
    extenders and bridge. The bracket with screws is 20 g, the bridge 20.5 g,
    the long offset extender 64 g and the straight extender 39 g.
  memory: >-
    datasheet - PB-10418 table 2: HBM2, 24 GB, 3072-bit, 1215 MHz, up to 933 GB/s.
  pcie: >-
    datasheet - PB-10418 table 1: PCI Express 4.0 x16, lane and polarity
    reversal supported.
  part-numbers: >-
    datasheet - PNY's datasheet gives the part number NVA30TCGPU-KIT. PB-10418
    "Root of Trust": 900-21001-XXXX-0XX with the CEC1712 secondary root of
    trust, 900-21001-XXXX-1XX without; table 1 gives the board SKU and NVPN. No
    full NVIDIA order code is written.
  nvlink: >-
    datasheet - PB-10418 table 7: one bridge, 32 lanes, 50 Gbps a lane each way,
    200 GB/s. The bridge spans two PCIe slots and pairs two adjacent A30 cards.
  extenders: >-
    datasheet - PB-10418 "Extenders": a long offset extender (NVPN
    682-00007-5555-000, card plus extender 339 mm) and a straight extender (NVPN
    682-00007-5555-001, 312 mm). The numbers are the A100 80GB's, but the weights
    are not (64 g and 39 g here, 48 g and 32 g there), so the shapes are not known
    to be the same. The pieces below are the A100 80GB's, whose lengths are this
    card's, and are `estimated` here.
  body-extender-straight: >-
    estimated - nvidia/a100-pcie-80gb@1 `body-extender-straight`: a slotted plate
    of four bars with three slots and a flat upright. Its far edge is the
    brief's 312. PB-10418 figure 8 draws it; no photograph of it on this card was
    found.
  body-extender-long-offset: >-
    estimated - nvidia/a100-pcie-80gb@1 `body-extender-long-offset`. Its far edge
    is the brief's 339.
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) the bracket face straight on, the far end and
    the top edge, none of which has a view (the A100's are carried over,
    needs-photo); (2) the NVLink connector's place and the A30's bridge
    interface, which the registry does not have (needs-drawing, and a registry
    entry the sources do not yet carry); (3) the thickness, which no source states
    (vendor-silent); (4) the full NVIDIA order code (vendor-silent); (5) the
    extenders' shapes, whose weights differ from the A100's (needs-photo); (6)
    the power figure's qualifier, which the brief omits (vendor-silent).
  lifecycle: >-
    No end-of-life notice for the A30 was found: a search for one returned only
    NVIDIA's networking notices. PNY lists the A30 under its legacy data-center
    GPUs. That is a listing, not an announcement, so the attr says
    `none-announced`.
