<svg xmlns="http://www.w3.org/2000/svg" width="166.74mm" height="38.23mm" viewBox="0.9 1.77 166.74 38.23">
  <!-- nvidia/rtx-pro-2000-blackwell: THE TOP EDGE, the body's right side seen from
       outside. Across: mm behind the bracket's outer face (0.9 to 167.64, the
       shroud's length). Down: the face's y (1.77 the backplate's outer face, 4.44
       the board's outer face, 40.0 the shroud's). Every piece whose right side is
       the card's top edge `shows: [right]` and carries its patch of this. NO
       PHOTOGRAPH SHOWS THIS EDGE (PNY's three-quarter view looks up from below), so
       it is drawn plain, dark and flat, and is estimated (provenance
       body-top-edge). -->
  <rect x="0.9" y="1.77" width="166.74" height="2.67" fill="#222223"/>
  <rect x="0.9" y="4.44" width="166.74" height="1.57" fill="#1d2420"/>
  <rect x="0.9" y="6.01" width="166.74" height="33.99" fill="#262627"/>
</svg>
