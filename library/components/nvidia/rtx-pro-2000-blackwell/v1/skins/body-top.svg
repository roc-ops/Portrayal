<svg xmlns="http://www.w3.org/2000/svg" width="55.65mm" height="166.74mm" viewBox="28.41 0 55.65 166.74">
  <!-- nvidia/rtx-pro-2000-blackwell: THE BACKPLATE, the body's top side seen from
       outside (from the board's rear). Across: the face's x, the lower edge at
       28.41 and the top edge at 84.06. Down: 167.64 less mm behind the bracket's
       outer face, so the far end is at the top and the bracket's end at the
       bottom. A flat matte black plate with eight small screws, four along each
       long edge (PNY's back photograph at 3.98 px/mm, provenance body-backplate).
       It has no opening for the blower. Drawn in-house; nothing is traced. -->
  <rect x="28.41" y="0" width="55.65" height="166.74" fill="#222224"/>
  <g id="backplate-screws" fill="#0c0c0d" stroke="#3f3f42" stroke-width="0.3">
