    <circle cx="32.5" cy="38.24" r="1.6"/>
    <circle cx="32.5" cy="4.34" r="1.6"/>
    <circle cx="80.3" cy="152.34" r="1.6"/>
    <circle cx="80.3" cy="118.14" r="1.6"/>
    <circle cx="80.3" cy="54.04" r="1.6"/>
    <circle cx="80.3" cy="4.34" r="1.6"/>
