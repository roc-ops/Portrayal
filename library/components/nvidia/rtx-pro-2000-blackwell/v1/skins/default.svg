<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="41.91mm" viewBox="0 0 120.02 41.91">
  <!-- nvidia/rtx-pro-2000-blackwell: the RTX PRO 2000 Blackwell on its full-height
       support bracket, a plate two slots across, seen from OUTSIDE the chassis,
       drawn from the facts in the contract's provenance (a straight-on photograph
       of the bracket, scaled by the two retention tabs: 0.1679 mm per pixel). TIP
       AT THE LEFT, flange end at the right, the board's side at the top, as
       std/pcie-bracket-fh@2 is drawn: the photograph (tip at the bottom) is turned
       a quarter turn into this frame. A silver plate, blank above the card, with
       four mini DisplayPort receptacles along the board's side, a latch slot beside
       each, and a grid of 4 x 12 square vent holes in a pressed panel with a Torx
       screw in each end corner. Nothing is traced. -->
  <defs>
    <!-- one vent hole 3.1 square on a 3.9 pitch both ways -->
    <pattern id="hole" patternUnits="userSpaceOnUse" x="36.3" y="19.35" width="3.9" height="3.9">
      <rect x="0" y="0" width="3.1" height="3.1" fill="#101112"/>
    </pattern>
  </defs>
  <path id="plate" d="M1.9 7.38 L6.5 7.38 L10.0 3.9 L119.2 3.9 L119.2 0.3 L120.02 0.3 L120.02 40.9 L119.2 40.9 L119.2 41.4 L112.4 41.4 L111.8 41.9 L10.7 41.9 L6.5 37.7 L1.9 37.7 A1.9 1.9 0 0 1 0 35.8 L0 29.6 A1.9 1.9 0 0 1 1.9 27.7 L6.5 27.7 L10.0 24.2 A2.0 2.0 0 0 0 10.0 20.9 L6.5 17.38 L1.9 17.38 A1.9 1.9 0 0 1 0 15.48 L0 9.28 A1.9 1.9 0 0 1 1.9 7.38 Z" fill="#a3a6a9" stroke="#5f666d" stroke-width="0.4" stroke-linejoin="round"/>
  <!-- the fold: the flange turns 90 degrees here. On an elevation it is a line. -->
  <path id="flange-fold" d="M119.6 0.6 V40.6" stroke="#5f666d" stroke-width="0.3" fill="none"/>
  <!-- the pressed panel the grid and its screws sit in: a raised edge drawn as a
       line, x 29.6 to 81.1 and y 17.8 to 35.4 -->
  <rect id="panel" x="29.6" y="17.8" width="51.5" height="17.6" rx="3.5" fill="none" stroke="#d9dbdd" stroke-width="0.5"/>
  <rect x="29.3" y="17.5" width="52.1" height="18.2" rx="3.7" fill="none" stroke="#6d7175" stroke-width="0.3"/>
  <!-- the four latch slots (5.6 along, 2.1 across, y 14.6 to 16.7) and the three
       small squares between them (1.7 square) -->
  <g id="latches" fill="#101112">
    <rect x="69.1" y="14.6" width="5.6" height="2.1" rx="0.3"/>
    <rect x="56.5" y="14.6" width="5.6" height="2.1" rx="0.3"/>
    <rect x="44.1" y="14.6" width="5.6" height="2.1" rx="0.3"/>
    <rect x="31.5" y="14.6" width="5.6" height="2.1" rx="0.3"/>
    <rect x="65.05" y="14.75" width="1.7" height="1.7" rx="0.3"/>
    <rect x="52.55" y="14.75" width="1.7" height="1.7" rx="0.3"/>
    <rect x="40.05" y="14.75" width="1.7" height="1.7" rx="0.3"/>
  </g>
  <!-- the four mini DisplayPort receptacles: an 8.6 x 6.0 shell, a dark opening and
       the tongue. Each is drawn once at its own place; the library has no
       DisplayPort part. Centres 71.9, 59.3, 46.9 and 34.3 along the bracket. -->
  <g id="display-port-1">
    <rect x="67.6" y="7.5" width="8.6" height="6.0" rx="1.3" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M68.6 8.3 H75.2 V11.0 L74.0 12.5 H69.8 L68.6 11.0 Z" fill="#18191b"/>
    <rect x="69.7" y="9.6" width="4.4" height="1.5" fill="#6b6e72"/>
  </g>
  <g id="display-port-2">
    <rect x="55.0" y="7.5" width="8.6" height="6.0" rx="1.3" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M56.0 8.3 H62.6 V11.0 L61.4 12.5 H57.2 L56.0 11.0 Z" fill="#18191b"/>
    <rect x="57.1" y="9.6" width="4.4" height="1.5" fill="#6b6e72"/>
  </g>
  <g id="display-port-3">
    <rect x="42.6" y="7.5" width="8.6" height="6.0" rx="1.3" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M43.6 8.3 H50.2 V11.0 L49.0 12.5 H44.8 L43.6 11.0 Z" fill="#18191b"/>
    <rect x="44.7" y="9.6" width="4.4" height="1.5" fill="#6b6e72"/>
  </g>
  <g id="display-port-4">
    <rect x="30.0" y="7.5" width="8.6" height="6.0" rx="1.3" fill="#d3d5d7" stroke="#6f7378" stroke-width="0.3"/>
    <path d="M31.0 8.3 H37.6 V11.0 L36.4 12.5 H32.2 L31.0 11.0 Z" fill="#18191b"/>
    <rect x="32.1" y="9.6" width="4.4" height="1.5" fill="#6b6e72"/>
  </g>
  <!-- the vent grid: 4 columns by 12 rows of 3.1 square holes. The ten middle rows
       are one pattern; the first and last rows lose the fourth hole to the screw
       and have a narrow third. -->
  <rect id="vent" x="36.3" y="19.35" width="38.2" height="14.8" fill="url(#hole)"/>
  <g id="vent-ends" fill="#101112">
    <rect x="75.3" y="19.35" width="3.1" height="3.1"/>
    <rect x="75.3" y="23.25" width="3.1" height="3.1"/>
    <rect x="75.3" y="27.15" width="3.1" height="1.7"/>
    <rect x="32.4" y="19.35" width="3.1" height="3.1"/>
    <rect x="32.4" y="23.25" width="3.1" height="3.1"/>
    <rect x="32.4" y="27.15" width="3.1" height="1.7"/>
  </g>
  <g id="screws">
    <g id="screw-1"><circle cx="77.6" cy="32.7" r="2.4" fill="#7e8388" stroke="#33363a" stroke-width="0.3"/><circle cx="77.6" cy="32.7" r="0.9" fill="#2b2d30"/></g>
    <g id="screw-2"><circle cx="32.8" cy="32.4" r="2.4" fill="#7e8388" stroke="#33363a" stroke-width="0.3"/><circle cx="32.8" cy="32.4" r="0.9" fill="#2b2d30"/></g>
  </g>
  <!-- the port numbers printed on the plate, upright in this frame -->
  <g id="silkscreen">
    <text x="65.9" y="13.4" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#6f7377">1</text>
    <text x="53.4" y="13.4" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#6f7377">2</text>
    <text x="40.9" y="13.4" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#6f7377">3</text>
    <text x="28.4" y="13.4" text-anchor="middle" font-family="sans-serif" font-size="2.2" fill="#6f7377">4</text>
  </g>
</svg>
