       as PNY's broad-side photograph is, with the blower's opening: a dark ring
       39.7 across centred 38.5 from the far end and 23.1 below the top edge
       (provenance body-fan), 54 swept blades (straight strokes for curved blades)
       and a flat hub. Drawn in-house; nothing is traced. -->
