format: 1
kind: module
name: mcx75310-fh
version: 1.0.0
class: expansion-card
behaviour: fills
profile: networking
description: >-
  NVIDIA ConnectX-7 MCX75310A single-port NDR 400Gb/s InfiniBand / 400GbE OSFP
  adapter, PCIe Gen5 x16, on its tall (full-height) bracket. The same board
  ships with both brackets; nvidia/mcx75310-lp@1 is the other.
size: {w: 120.02, h: 21.59, d: 167.65}
size-confidence: {w: registry, h: registry, d: drawing}
attrs:
  model: 'MCX75310A tall bracket'
  part-numbers: 'MCX75310AAS-NEAT, MCX75310AAC-NEAT, MCX75310AAS-HEAT'
  role: nic
  power-draw-typical-w: 25.9
  power-input: host PCIe slot
  pcie-connector: x16
  pcie-generation: 5
  pcie-height: full
groups:
  osfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: osfp, speed: 400g}
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
provenance:
  sources: >-
    CX-7 user manual: p70-72 spec tables, p81 board mechanical drawing
    Single-port x16 OSFP (167.65 x 68.90), p82 bracket mechanical drawings
    Single-port OSFP (tall 121.05 x 21.59, short 80.29 x 22.83), p19-20 LED
    scheme 2
  size: >-
    registry - the face is std/pcie-bracket-fh@2, 120.02 x 21.59, composed
    behind a punched plate; `d` is the board drawing's 167.65, the card's
    length back from its bracket.
  depth: >-
    drawing - 167.65, the board mechanical drawing's length.
  the-face-is-derived-from-the-board: >-
    EVERY POSITION IS THE CARD'S, NOT THE BRACKET'S. The cages are placed at
    their distance above datum W on the dimensioned board drawing - port 1
    46.63 - with W at x' 15.16 on this bracket (PCIe CEM 5.0: 120.02 -
    104.86, fig 11-3). Vents, light-pipe slots, lamps and numerals keep
    their measured offset from their nearest cage (or from W), read off
    NVIDIA's bracket drawings. The OSFP window reads 24.05 x 11.05 on both
    brackets against std/osfp@1's 23.1 x 13.5; its centre agrees with the
    board drawing to 0.10. The full-height face adds seven vent columns
    beyond the flange side of the cage and one beyond the tip side.
  orientation: >-
    drawn TIP-LEFT, so NVIDIA's tip-right figures are turned a half-turn:
    cages and lamps are placed `rotate: 180` and the numerals read upside
    down. In a turned bay - Dell riser 3 - the card lands as NVIDIA draws
    it.
  lamps: >-
    drawing - two round light-pipe holes per port on the bracket's keyed
    side, about 1.4 across (drawn 1.3-1.5), carried as common/led-dot@1
    (2.0, so 0.6 larger than drawn), holding LED scheme 2 of UM p19-20: LED1
    bi-colour yellow/green (green solid at full speed, yellow solid below
    it, green blinking on activity, yellow 1 Hz beacon, yellow 4 Hz error)
    and LED2 green (on at link up and on error, blinking on activity, off
    for beacon). Which hole is which is not drawn, so LED1 is the one nearer
    the cage by assumption. The OSFP bracket punches TWO such pairs, one
    each side of its single window (p82, both brackets); the manual never
    says what the second pair shows. The flange-side pair is led-port-1-*,
    the tip-side pair led-port-1-tip-* with the same states, by assumption.
  body: >-
    the board, edge tab and pads are PCIe CEM 5.0's (figs 6-5, 11-3, 11-8)
    at the board drawing's size; the ASIC is the drawn package lid only (UM
    p81 draws no heatsink on it). The OSFP cage's riding heatsink (the
    finned block from about 6 to 88 behind the bracket, 28 to 65 above W on
    UM p81) is NOT a box: it sits on the cage, and a box here would fill the
    cage's own volume.
  power: >-
    datasheet - CX-7 UM p70-72 (spec tables): typical power with passive
    cables in a PCIe Gen5 x16 host is 25.9 W for MCX75310AAC-NEAT, 24.9 W
    for -AAS-NEAT and 16.7 W for -AAS-HEAT (NDR200); the largest is carried.
    The manual gives NO maximum: it refers to the NVOnline 'NVIDIA
    ConnectX-7 Electrical and Thermal Specifications' document, which is not
    held, so power-draw-max-w is left out rather than estimated.
body:
  depth: 167.65
  color: '#2f7d3a'
  # the slab stops where the bracket stops being a rectangle
  plate: {at: [11.38, 3.17], size: [102.90, 18.42]}
  boxes:
  - {id: board, at: [23.56, 4.44], size: [60.50, 1.57], from: 0.00, depth: 167.65,
     color: '#2f7d3a', confidence: drawing,
     source: 'the board drawing''s 167.65 x 68.90; CEM 5.0 fig 6-5 shoulder 8.40 above W'}
  - {id: edge-tab-short, at: [15.16, 4.44], size: [8.40, 1.57], from: 46.90, depth: 11.20,
     color: '#2f7d3a', confidence: registry,
     source: 'CEM 5.0 fig 6-5: key centre 59.05 behind the bracket, 12.15 to the tab end, notch 1.90'}
  - {id: edge-tab-long, at: [15.16, 4.44], size: [8.40, 1.57], from: 60.00, depth: 71.20,
     color: '#2f7d3a', confidence: registry,
     source: 'CEM 5.0 fig 6-5: x16 DIM B 72.15 from the key centre'}
  - {id: edge-pads-short, at: [17.76, 4.39], size: [3.00, 1.67], from: 47.25, depth: 10.60,
     color: '#d4a72c', confidence: registry,
     source: 'CEM 5.0 fig 6-5: pads 2.60..5.60 up the tab, pins 1-11 on 1.00 pitch'}
  - {id: edge-pads-long, at: [17.76, 4.39], size: [3.00, 1.67], from: 60.25, depth: 70.60,
     color: '#d4a72c', confidence: registry,
     source: 'CEM 5.0 fig 6-5: the x16 pad run on 1.00 pitch'}
  - {id: asic, at: [42.51, 6.01], size: [26.80, 3.00], from: 104.00, depth: 27.00,
     color: '#b8bcc0', confidence: estimated,
     source: 'UM p81 board drawing: the ConnectX-7 package lid, 26.8 x 27.0, at its drawn position (z registered on the PCIe key); the drawing shows no ASIC heatsink, and the 3.0 height is an estimate'}
faces:
  plan:
    ref: common/pcie-card-plan@1
parts:
  - {ref: std/pcie-bracket-fh@2, id: bracket, at: [0, 0], behind: true}
  - {ref: std/osfp@1, id: port-1, at: [50.24, 5.03], rotate: 180, group: osfp}
  - ref: common/led-dot@1
    id: led-port-1-1
    at: [74.55, 5.82]
    rotate: 180
    group: port-leds
    states: {lamp: ['off', {name: link-up, color: '#22c55e'}, {name: link-up-reduced-speed, color: '#eab308'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: beacon, color: '#eab308', behavior: blinking}, {name: error, color: '#eab308', behavior: blinking}]}
  - ref: common/led-dot@1
    id: led-port-1-2
    at: [77.56, 5.82]
    rotate: 180
    group: port-leds
    states: {lamp: ['off', {name: link-up, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: error, color: '#22c55e'}]}
  - ref: common/led-dot@1
    id: led-port-1-tip-1
    at: [46.96, 5.82]
    rotate: 180
    group: port-leds
    states: {lamp: ['off', {name: link-up, color: '#22c55e'}, {name: link-up-reduced-speed, color: '#eab308'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: beacon, color: '#eab308', behavior: blinking}, {name: error, color: '#eab308', behavior: blinking}]}
  - ref: common/led-dot@1
    id: led-port-1-tip-2
    at: [43.99, 5.82]
    rotate: 180
    group: port-leds
    states: {lamp: ['off', {name: link-up, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: error, color: '#22c55e'}]}
skins: [default]
