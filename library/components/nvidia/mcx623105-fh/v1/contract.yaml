format: 1
kind: module
name: mcx623105-fh
version: 1.0.0
class: expansion-card
behaviour: fills
profile: networking
description: >-
  NVIDIA ConnectX-6 Dx MCX623105A single-port 100/200GbE QSFP56 adapter, PCIe
  Gen4 x16, on its tall (full-height) bracket. The same board ships with both
  brackets; nvidia/mcx623105-lp@1 is the other.
size: {w: 120.02, h: 21.59, d: 142.00}
size-confidence: {w: registry, h: registry, d: drawing}
attrs:
  model: 'MCX623105A tall bracket'
  part-numbers: 'MCX623105AN-CDAT, MCX623105AC-CDAT, MCX623105AE-CDAT, MCX623105AC-VDAT, MCX623105AN-VDAT, MCX623105AE-VDAT, MCX623105AS-VDAT'
  role: nic
  power-draw-max-w: 24.0
  power-draw-typical-w: 16.94
  power-input: host PCIe slot
  pcie-connector: x16
  pcie-generation: 4
  pcie-height: full
groups:
  qsfp56:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp56, speed: 200g}
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
provenance:
  sources: >-
    CX-6 Dx EN user manual: p59 and p63 spec tables, p64 board mechanical
    drawing Single-Port QSFP56 x16 (142.00 x 68.90, embedded image p64-004),
    p65 bracket mechanical drawing Single-Port QSFP56 Cards (short p65-004,
    tall p65-006), p16-17 LED scheme 2
  size: >-
    registry - the face is std/pcie-bracket-fh@2, 120.02 x 21.59, composed
    behind a punched plate; `d` is the board drawing's 142.00, the card's
    length back from its bracket.
  depth: >-
    drawing - 142.00, the board mechanical drawing's length.
  the-face-is-derived-from-the-board: >-
    EVERY POSITION IS THE CARD'S, NOT THE BRACKET'S. The cages are placed at
    their distance above datum W on the dimensioned board drawing - port 1
    26.88 - with W at x' 15.16 on this bracket (PCIe CEM 5.0: 120.02 -
    104.86, fig 11-3). Vents, light-pipe slots, lamps and numerals keep
    their measured offset from their nearest cage (or from W), read off
    NVIDIA's bracket drawings. The bracket drawings put the cage window 0.32
    (short) and 0.70 (tall) nearer the tip than the board drawing's cage
    lands; the punched features keep their offsets from the window they were
    read against. The full-height face adds six vent columns on the flange
    side.
  orientation: >-
    drawn TIP-LEFT, so NVIDIA's tip-right figures are turned a half-turn:
    cages and lamps are placed `rotate: 180` and the numerals read upside
    down. In a turned bay - Dell riser 3 - the card lands as NVIDIA draws
    it.
  lamps: >-
    drawing - the two brackets disagree: the short one punches two round
    holes, about 1.6 across, on the tip side of the window, the tall one a
    single 4.0 x 0.7 light-pipe slot about where their midpoint is. LED
    scheme 2 (LED1 bi-colour yellow/green, LED2 green) is drawn as two
    common/led-dot@1 (2.0 round, 0.4 over the hole) on the short bracket and
    a common/led-slot-pair@1 (3.7 x 1.2) on the tall one. Which hole is LED1
    is not drawn; LED1 is assumed nearer the cage.
  body: >-
    the board, edge tab and pads are PCIe CEM 5.0's (figs 6-5, 11-3, 11-8)
    at the board drawing's size; the heatsink is the board drawing's 23.0
    square at its drawn position, 10.0 tall by estimate. The drawing shades
    the whole board face grey inside a green rim, which may be a board-
    length heat spreader; it is not modelled.
  power: >-
    datasheet - CX-6 Dx UM p63 (spec table, -VDAT 200GbE builds): 16.94 W
    typical and 24 W maximum at Gen4 (Gen3 TBD), with passive cables; the
    -CDAT builds (p59) are 15.67 / 16.48 W typical and 20.51 / 22 W maximum
    at Gen3 / Gen4. The largest of each is carried. p55 adds ActiveModuleW x
    modules x 1.1 for active optics.
  rate: >-
    the -VDAT builds run the port at 200GbE (UM p5, p63), the -CDAT builds
    at 100GbE; the group carries the larger.
body:
  depth: 142.00
  color: '#2f7d3a'
  # the slab stops where the bracket stops being a rectangle
  plate: {at: [11.38, 3.17], size: [102.90, 18.42]}
  boxes:
  - {id: board, at: [23.56, 4.44], size: [60.50, 1.57], from: 0.00, depth: 142.00,
     color: '#2f7d3a', confidence: drawing,
     source: 'the board drawing''s 142.00 x 68.90; CEM 5.0 fig 6-5 shoulder 8.40 above W'}
  - {id: edge-tab-short, at: [15.16, 4.44], size: [8.40, 1.57], from: 46.90, depth: 11.20,
     color: '#2f7d3a', confidence: registry,
     source: 'CEM 5.0 fig 6-5: key centre 59.05 behind the bracket, 12.15 to the tab end, notch 1.90'}
  - {id: edge-tab-long, at: [15.16, 4.44], size: [8.40, 1.57], from: 60.00, depth: 71.20,
     color: '#2f7d3a', confidence: registry,
     source: 'CEM 5.0 fig 6-5: x16 DIM B 72.15 from the key centre'}
  - {id: edge-pads-short, at: [17.76, 4.39], size: [3.00, 1.67], from: 47.25, depth: 10.60,
     color: '#d4a72c', confidence: registry,
     source: 'CEM 5.0 fig 6-5: pads 2.60..5.60 up the tab, pins 1-11 on 1.00 pitch'}
  - {id: edge-pads-long, at: [17.76, 4.39], size: [3.00, 1.67], from: 60.25, depth: 70.60,
     color: '#d4a72c', confidence: registry,
     source: 'CEM 5.0 fig 6-5: the x16 pad run on 1.00 pitch'}
  - {id: heatsink, at: [44.56, 6.01], size: [23.00, 10.00], from: 85.10, depth: 23.00,
     color: '#b8bcc0', confidence: estimated,
     source: 'the board drawing''s 23.0 square over the IC at its drawn position; its height is not drawn'}
faces:
  plan:
    ref: common/pcie-card-plan@1
parts:
  - {ref: std/pcie-bracket-fh@2, id: bracket, at: [0, 0], behind: true}
  - {ref: std/qsfp56@1, id: port-1, at: [32.04, 6.45], rotate: 180, group: qsfp56}
  - ref: common/led-slot-pair@1
    id: led-port-1
    at: [26.55, 6.31]
    rotate: 180
    group: port-leds
    states: {lamp-1: ['off', {name: link-up, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: beacon, color: '#eab308', behavior: blinking}, {name: error, color: '#eab308', behavior: blinking}], lamp-2: ['off', {name: link-up, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}]}
skins: [default]
