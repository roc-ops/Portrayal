<svg xmlns="http://www.w3.org/2000/svg" width="79.2mm" height="18.42mm" viewBox="0 0 79.2 18.42">
  <!-- nvidia/p4: the Tesla P4 on its low profile bracket. The outline, tip and
       flange are std/pcie-bracket-lp@1, composed BEHIND this; what is drawn here
       is the punched plate with two columns of eight rectangular vent holes and
       two Torx screws. TIP AT THE LEFT. PB-08449 figure 1 draws the bracket in
       perspective, so the holes' sizes and places are estimated (provenance
       face-holes); the count and the two-by-eight layout are read. Nothing is
       traced. -->
  <rect id="plate" x="15.33" y="2.88" width="55.13" height="12.66" fill="#a7aeb5"/>
  <g id="vent" fill="#1a1a1a">
    <rect x="23.60" y="3.30" width="5.0" height="5.6" rx="0.5"/>
    <rect x="29.36" y="3.30" width="5.0" height="5.6" rx="0.5"/>
    <rect x="35.12" y="3.30" width="5.0" height="5.6" rx="0.5"/>
    <rect x="40.88" y="3.30" width="5.0" height="5.6" rx="0.5"/>
    <rect x="46.64" y="3.30" width="5.0" height="5.6" rx="0.5"/>
    <rect x="52.40" y="3.30" width="5.0" height="5.6" rx="0.5"/>
    <rect x="58.16" y="3.30" width="5.0" height="5.6" rx="0.5"/>
    <rect x="63.92" y="3.30" width="5.0" height="5.6" rx="0.5"/>
    <rect x="23.60" y="9.30" width="5.0" height="5.6" rx="0.5"/>
    <rect x="29.36" y="9.30" width="5.0" height="5.6" rx="0.5"/>
    <rect x="35.12" y="9.30" width="5.0" height="5.6" rx="0.5"/>
    <rect x="40.88" y="9.30" width="5.0" height="5.6" rx="0.5"/>
    <rect x="46.64" y="9.30" width="5.0" height="5.6" rx="0.5"/>
    <rect x="52.40" y="9.30" width="5.0" height="5.6" rx="0.5"/>
    <rect x="58.16" y="9.30" width="5.0" height="5.6" rx="0.5"/>
    <rect x="63.92" y="9.30" width="5.0" height="5.6" rx="0.5"/>
  </g>
  <g id="screw-1"><circle cx="20.5" cy="10.9" r="2.0" fill="#b9bfc5" stroke="#5f666d" stroke-width="0.25"/><circle cx="20.5" cy="10.9" r="0.7" fill="#4a4f55"/></g>
  <g id="screw-2"><circle cx="72.8" cy="10.9" r="2.0" fill="#b9bfc5" stroke="#5f666d" stroke-width="0.25"/><circle cx="72.8" cy="10.9" r="0.7" fill="#4a4f55"/></g>
</svg>
