<svg xmlns="http://www.w3.org/2000/svg" width="53.78mm" height="165.44mm" viewBox="1.0 0 53.78 165.44">
  <!-- nvidia/p4: THE COVER'S BROAD SIDE, the body's bottom side seen from
       outside. Across: 79.2 (the face's width) less the face's x, so the card's
       top edge is at 1.0 and its lower edge at 54.78. Down: 167.64 less mm
       behind the bracket's outer face, so the far end is at the top and the
       cover's front (2.2 behind the bracket) at the bottom. A dark cover with
       "TESLA" printed across the bracket end and a window of fourteen parallel
       fins along the card, as PB-08449 figure 1 draws it; the window's size and
       place are fractions of that perspective drawing, estimated, and the colours
       are a choice (provenance body-colour). -->
  <rect x="1.0" y="0" width="53.78" height="165.44" fill="#4a4e53"/>
  <rect x="8.0" y="30.0" width="38.0" height="110.0" rx="1.0" fill="#1b1d20"/>
  <g fill="#6b7075">
