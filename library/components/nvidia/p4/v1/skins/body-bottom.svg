    <rect x="8.0" y="48.0" width="38.0" height="0.5"/>
    <rect x="8.0" y="56.0" width="38.0" height="0.5"/>
    <rect x="8.0" y="64.0" width="38.0" height="0.5"/>
    <rect x="8.0" y="72.0" width="38.0" height="0.5"/>
    <rect x="8.0" y="80.0" width="38.0" height="0.5"/>
    <rect x="8.0" y="88.0" width="38.0" height="0.5"/>
    <rect x="8.0" y="96.0" width="38.0" height="0.5"/>
    <rect x="8.0" y="104.0" width="38.0" height="0.5"/>
    <rect x="8.0" y="112.0" width="38.0" height="0.5"/>
    <rect x="8.0" y="120.0" width="38.0" height="0.5"/>
    <rect x="8.0" y="128.0" width="38.0" height="0.5"/>
    <rect x="8.0" y="136.0" width="38.0" height="0.5"/>
