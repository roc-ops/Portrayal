<svg xmlns="http://www.w3.org/2000/svg" width="165.44mm" height="16.04mm" viewBox="2.2 1.27 165.44 16.04">
  <!-- nvidia/p4: THE TOP EDGE, the body's right side seen from outside. Across:
       mm behind the bracket's outer face (2.2 to 167.64, the cover's length).
       Down: the face's y (1.27 the board's outer face, 17.31 the cover's). A
       dark edge with "NVIDIA" and "TESLA P4" printed on it, at fractions of the
       card's length read off PB-08449 figure 1 (provenance body-top-edge). -->
  <rect x="2.2" y="1.27" width="165.44" height="16.04" fill="#222528"/>
  <!-- the NVIDIA mark is reserved, not drawn (L172) -->
  <rect id="logo-zone" x="114.0" y="6.0" width="4.4" height="3.0" fill="none"/>
  <g id="silkscreen">
    <text x="119.5" y="8.6" font-family="Arial" font-weight="bold" font-size="2.6" fill="#e8e8e8" textLength="11.0" lengthAdjust="spacingAndGlyphs">NVIDIA</text>
    <text x="137.0" y="8.6" font-family="Arial" font-weight="bold" font-size="2.4" fill="#e8e8e8" textLength="17.0" lengthAdjust="spacingAndGlyphs">TESLA P4</text>
  </g>
</svg>
