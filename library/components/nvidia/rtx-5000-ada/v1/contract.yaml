format: 1
kind: module
name: rtx-5000-ada
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA RTX 5000 Ada Generation (32 GB GDDR6), an actively cooled dual-slot
  full-height full-length workstation card with a blower. The bracket face is dark
  nickel with four DisplayPort connectors on the board's side and one framed vent
  window beside them. The shroud is matte dark grey with the blower's opening on
  its broad side and a black backplate. The heat sink's fins show along the top
  edge. It has one 16-pin CEM5 power connector at the far end by the top edge. It
  plugs into one riser slot and covers the one beside it. EVERY FACE OF THIS CARD
  IS ESTIMATED FROM THE RTX 4500 ADA. PNY serves that card's photographs under
  this card's name. No other picture of the 5000 is held except NVIDIA's own
  render, which cannot be scaled.
slot-width: 2
size: {w: 120.02, h: 41.91, d: 266.70}
size-confidence: {w: registry, h: registry, d: datasheet}
unplaced: >-
  no bay in the library lists this card in `accepts`. A riser bay names each card
  it takes by hand (docs/cards-by-interface-design.md, status proposed: no
  interface or mates field exists on a card or a bay today), and no document held
  says any server takes a workstation card, so none was added and seating it
  would be an edit to an existing component that this change does not make.
attrs:
  model: 'RTX 5000 Ada'
  part-numbers: 'PNY VCNRTX5000ADA-PB (retail), YVCNRTX5000ADA-PB, VCNRTX5000ADA-EDU (education), VCNRTX5000ADA-BLK (bulk), VCNRTX5000ADASYNC-PB (with the Sync card); NVIDIA 900-5G132-2240-000'
  role: gpu
  form-factor: 'Full-height, full-length (FHFL) 4.4 in x 10.5 in, dual slot'
  pcie-connector: x16
  pcie-generation: 4
  pcie-height: full
  power-draw-max-w: 250
  power-input: 'host PCIe slot and one PCIe CEM5 16-pin (12VHPWR) auxiliary connector; a 2x PCIe 8-pin to 1x CEM5 16-pin adapter is in the box'
  memory: '32 GB GDDR6, 256-bit, 576 GB/s'
  display-ports: '4 x DisplayPort 1.4a on the bracket'
  cooling: active
  airflow: 'blower; it draws air from the card''s broad side and exhausts toward the bracket'
  nvlink: 'none'
faces:
  rear: {ref: nvidia/rtx-4500-ada-tail@1}
provenance:
  slot-width: >-
    datasheet - NVIDIA's RTX 5000 Ada datasheet (2898211, AUG23): "Form factor
    4.4' H x 10.5' L, dual slot"; the Ada quick-start guide: "The RTX 6000, RTX
    5000, RTX 4500, RTX 4000 SFF and RTX 2000 are dual-slot GPUs and will require
    removing two adjacent slot covers". The card declares `slot-width: 2` as
    docs/pcie-two-slot-bays-design.md R1 defines it.
  sources: >-
    NVIDIA RTX 5000 Ada Generation datasheet (2898211, AUG23),
    https://cdn.pathfactory.com/assets/10412/contents/1095460/b57d512c-c1b8-4fea-b9e5-cb95bcb33c44.pdf.
    PNY's print (2788511, v6), https://www.pny.com//file%20library/company/support/product%20brochures/nvidia%20rtx/english/pny-rtx-5000-ada-datasheet-2788511-partner-v6.pdf,
    and PNY's NVIDIA Professional Graphics line card (REV. 09.14.26),
    https://www.pny.com/File%20Library/Company/Support/linecards/pro-viz-gpus/NVIDIA-Professional-Graphics-Linecard.pdf,
    for the order codes. NVIDIA's RTX Ada Generation online quick-start guide,
    https://images.nvidia.com/aem-dam/Solutions/design-visualization/quadro-product-literature/proviz-rtx-ada-gen-online-qsg.pdf:
    the box contents, the dual-slot statement and the 16-pin CEM5 connector.
    NVIDIA's power guide DA-07261-001_v15 (27 July 2023),
    https://images.nvidia.com/aem-dam/en-zz/Solutions/design-visualization/quadro-product-literature/DA-07261-001_v15.pdf,
    table 1 (250 W, CEM5 16-pin). NVIDIA publishes no dimensioned drawing of this
    card: the geometry is the RTX 4500 Ada's (nvidia/rtx-4500-ada@1), measured on
    PNY's photographs of that card and carried over from the standards. The
    photographs are named by their files and licence is not stated; facts read
    from them, pictures not used.
  reference-photos: >-
    reference - PNY's product images filed under the RTX 5000 Ada, under
    https://d2vfia6k6wrouk.cloudfront.net/productimages/954d5ff2-29f0-48e9-9c37-b05800c792ee/images/:
    nvidia-rtx-5000-ada-front.png, -back.png and -3qtr-left.png are BYTE FOR BYTE
    THE RTX 4500 ADA'S pictures (the same MD5 sums), and nvidia-rtx-5000-ada-left.png
    (the bracket) is the same picture re-encoded: on the pixels opaque in both,
    97 percent are within 30 grey levels summed over the three channels and the mean
    difference is 4.9, with the same outline, the same four DisplayPorts and the same
    window. NO PICTURE IN THE INTAKE IS THIS CARD'S OWN, so none is used as this
    card's reading: the bracket face, the broad side, the backplate and the
    fingers are the RTX 4500 Ada's figures and are `estimated` here. The one
    picture that is this card's is NVIDIA's own render (rtx-5000-og.jpg, 1200 x 630),
    a 3/4 view of the top edge and the far end that cannot be scaled: it shows the
    champagne strip with its bay by the blower, two connectors and the model name
    at the bracket end, the maker's mark at the far end's foot and the 16-pin
    connector at the end face's corner by the top edge, and it is the reference for
    those places (all estimated). Whether the 5000 and the 4500 share a bracket and
    a shroud outline is not stated by any document held; the two datasheets give the
    same 4.4 x 10.5 in dual-slot form factor. MM PER PIXEL: none of this card's;
    the RTX 4500 Ada's are 0.2506 along and 0.2572 across the bracket photograph,
    0.443 and 0.445 on the broad-side photograph and 0.3827 on the back photograph.
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2, PCIe
    CEM 5.0 figure 11-5). h is two slots: the single bracket's 21.59 plus one 20.32
    slot pitch, 41.91, as on the A100 and the RTX A6000.
  depth: >-
    datasheet - 10.5 in, exactly 266.70, from the bracket's outer face as
    nvidia/rtx-a6000@1 reads the same figure.
  face-outline: >-
    estimated - the RTX 4500 Ada's plate (nvidia/rtx-4500-ada@1 `face-outline`):
    board-side edge at y 4.28 (5.31 below the step 20.6 from the tip), far edge at
    41.57 (40.55 below the step), 37.3 across, the standard's tip, tabs and flange.
    The photograph filed under this card is that card's.
  face-displayports: >-
    estimated - the RTX 4500 Ada's: four shells 18.0 long and 7.5 across (y 5.8 to
    13.3) with centres 40.09, 62.14, 82.94 and 103.73 along the bracket. As on the
    RTX 4500 Ada's photograph, which prints 1 to 4 in faint figures from the flange
    end, `display-port-1` is the receptacle nearest the flange (x 94.73). THE LIBRARY
    HAS NO DISPLAYPORT PART OR INTERFACE, so each is an element of class
    `connector` painted in the skin and not a seated part; nothing mates it and the
    module type carries no port for them (the `display-ports` attr says 4 x
    DisplayPort 1.4a, the datasheet's words).
  face-grille: >-
    estimated - the RTX 4500 Ada's: a framed window 87.7 long and 25.0 across (x
    28.3 to 116.0, y 14.6 to 39.6), 17 fins on a 4.3 pitch from x 37.6 behind it and
    four Torx screws at x 33.07 and 113.51 and y 18.09 and 36.35.
  face-markings: >-
    estimated - a small warning triangle at x 21.5 to 27.1 and y 10.6 to 16.0, the
    RTX 4500 Ada's.
  thickness: >-
    estimated - the datasheet states no thickness. The shroud's far face is put at
    y 40.0, as nvidia/rtx-a6000@1 has it, and the backplate's outer face at 1.77,
    the CEM rear envelope's 2.67 behind the board.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the A100 are. The board, and the
    bracket's keyed side, are at the top (small y), which is where the
    DisplayPorts are.
  body: >-
    estimated - the board, its edge and the pads follow PCIe CEM 5.0 (figures 6-5
    and 11-3): the card height 111.15, the lower edge 13.25 above the finger datum W
    and the key datum 57.15 behind the bracket, so the top edge is at x 126.31. The
    lower edge's notch (140.0 to 159.0 behind the bracket, 3.3 deep) is the RTX
    4500 Ada's, read on that card's photographs.
  body-shroud: >-
    estimated - the RTX 4500 Ada's: matte dark grey, one slab from the board's
    component face (y 6.01) to the far face (40.0), the outline of the board, split
    at the notch as the board is.
  body-backplate: >-
    estimated - the RTX 4500 Ada's back photograph (also filed under this card):
    a flat matte black plate over the board's whole rear with ten small screws.
    Whether the 5000 has the same is not shown by any picture of the 5000.
  body-fan: >-
    estimated - the RTX 4500 Ada's blower: a dark ring 74.4 across centred 70.0 from
    the far end and 44.9 below the top edge, a grey hub 31.5 across and 52 pale
    blades. NVIDIA's render of the 5000 shows the blower on the broad side toward
    the far end with a flat round hub, which is all it can say: the view is a 3/4
    one and the blower's distance from the end cannot be read from it.
  body-top-edge: >-
    estimated - NVIDIA's own render of this card (rtx-5000-og.jpg) shows the top
    edge black with a champagne strip of heat-sink fins along most of its length,
    dipping where the blower is, two connectors and the model name at the bracket
    end. It is a 3/4 view and cannot be scaled, so every place here is estimated:
    the strip from 46 to 250 behind the bracket and 14.0 to 34.0 across the card,
    its bay from 158 to 236 behind it (the RTX 4500 Ada's ring span), "RTX 5000" at
    6.0 behind it, 2.4 tall. THE STEREO AND SYNC CONNECTORS ARE NOT DRAWN (no
    straight-on view shows them at scale; the library has no part). THE MARK IS NOT
    DRAWN: its box (232 to 254 behind the bracket, 7.6 to 12.2 across) is reserved
    as `logo-zone` in `skins/body-right.svg`, estimated.
  body-power-connector: >-
    estimated - NVIDIA's power guide DA-07261 table 1 says "CEM5 16-pin", 250 W, and
    the quick-start guide names "the 16-pin PCIe CEM5 connector on the back edge" and
    puts a 2x PCIe 8-pin to 1x CEM5 16-pin adapter in the box. NVIDIA's own render of
    this card shows the connector at the end face's corner by the top edge, on the
    board's side, with no scale. The housing is drawn at nvidia/l40s@1's place for
    its 12VHPWR (104.1 to 123.0 on the card's x, 9.1 across the board's component
    face), black, with twelve power cells and four sense cells; that is the L40S
    housing measured on a photograph of that card. THE PORT is `aux-power` on the
    rear face (`faces.rear`, nvidia/rtx-4500-ada-tail@1): std/12vhpwr-header@1,
    which presents `pcie-12vhpwr` for a 16-pin cable and which the card exports as a
    power port.
  body-end: >-
    estimated - a closed black end plate 1.0 thick, 1.4 inside the card's length,
    and the connector housing standing 0.2 proud of it, as nvidia/rtx-a6000@1 has
    it. NVIDIA's render shows a plain end face with two small round holes (not
    drawn) and the maker's mark at its foot.
  body-foot: >-
    estimated - the bracket's two retention tabs below the card are the face's
    (`skins/default.svg`), 0.9 thick.
  power: >-
    datasheet - total board power 250 W in the datasheet (2898211, AUG23), the PNY
    line card and DA-07261 table 1. The sources agree.
  memory: >-
    datasheet - 32 GB GDDR6, 256-bit, 576 GB/s, ECC. (The PNY line card prints 440
    tensor cores against the datasheet's 400; neither figure is stored here.)
  pcie: >-
    datasheet - PCIe 4.0 x16.
  nvlink: >-
    datasheet - "NVIDIA NVLink: No". The card has no NVLink connector.
  part-numbers: >-
    datasheet - PNY's print: "PNY Part Numbers VCNRTX5000ADA-PB YVCNRTX5000ADA-PB
    VCNRTX5000ADA-EDU VCNRTX5000ADA-BLK VCNRTX5000ADASYNC-PB"; PNY's line card adds
    NVIDIA part 900-5G132-2240-000. NVIDIA's own datasheet gives none.
  weight: >-
    not stated - no datasheet held gives a weight for the card.
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) EVERY MEASURED FACE of this card: no picture of
    the 5000's bracket, broad side, back or fingers is held (PNY serves the RTX 4500
    Ada's; needs-photo, a lab card or a second partner, the intake's handoff list
    item 5), so the figures are the 4500's and the 5000 may differ; (2) a
    straight-on view of the top edge and the far end (needs-photo; NVIDIA's render
    is a 3/4 view); (3) the DisplayPort part and interface, which the library lacks;
    (4) the thickness, which no source states (vendor-silent); (5) the connector's
    own photograph (the housing is the L40S's); (6) a weight (vendor-silent in the
    documents held); (7) the lifecycle: no end-of-life notice was searched for; (8)
    no dimensioned drawing of any active workstation card (the intake's handoff
    list, item 1).
