<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="41.91mm" viewBox="0 0 120.02 41.91">
  <!-- nvidia/rtx-5000-ada: the RTX 5000 Ada dual-slot bracket, seen from OUTSIDE
       the chassis, drawn from the facts in the contract's provenance. NO PHOTOGRAPH
       OF THIS CARD'S BRACKET IS HELD: PNY serves the RTX 4500 Ada's picture under
       this card's name, so this face is the RTX 4500 Ada's, estimated (see
       nvidia/rtx-4500-ada@1, whose figures are copied here and which was scaled with
       the two retention tabs across and the plate's length along). TIP AT THE LEFT,
       flange end at the right, the board's side at the top, as
       std/pcie-bracket-fh@2 is drawn. A dark nickel plate with four DisplayPort
       receptacles along the board's side and one framed vent window beside them with
       the heat-sink fins behind it. Nothing is traced. -->
  <path id="plate" d="M1.9 7.36 L7.27 7.36 L9.5 5.31 L19.5 5.31 L20.55 4.28 L119.2 4.28 L119.2 0.3 L120.02 0.3 L120.02 40.9 L119.2 40.9 L119.2 41.57 L20.55 41.57 L19.5 40.55 L10.8 40.55 L7.27 37.72 L1.9 37.72 A1.9 1.9 0 0 1 0 35.82 L0 29.58 A1.9 1.9 0 0 1 1.9 27.68 L7.27 27.68 L10.95 24.2 A2.4 2.4 0 0 0 10.95 20.9 L7.27 17.4 L1.9 17.4 A1.9 1.9 0 0 1 0 15.5 L0 9.26 A1.9 1.9 0 0 1 1.9 7.36 Z" fill="#7c7b7a" stroke="#3f3e3d" stroke-width="0.4" stroke-linejoin="round"/>
  <!-- the fold: the flange turns 90 degrees here. On an elevation it is a line. -->
  <path id="flange-fold" d="M119.6 0.6 V40.6" stroke="#3f3e3d" stroke-width="0.3" fill="none"/>
  <!-- the printed warning triangle on the plate's lower part, a line drawing -->
  <path id="warning" d="M24.3 10.6 L27.1 16.0 L21.5 16.0 Z" fill="none" stroke="#a5a4a3" stroke-width="0.3" stroke-linejoin="round"/>
  <!-- the four DisplayPort receptacles: an 18.0 x 7.5 shell with the D shape's
       chamfer at the flange end on the window's side, a dark opening and two rows
       of pins. Each is drawn once at its own place; the library has no
       DisplayPort part. Centres 40.09, 62.14, 82.94 and 103.73 along the bracket. -->
  <g id="display-port-4" transform="translate(31.09 5.8)">
    <path d="M0.8 0 L17.2 0 A0.8 0.8 0 0 1 18.0 0.8 L18.0 3.8 L14.3 7.5 L0.8 7.5 A0.8 0.8 0 0 1 0 6.7 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#b3b2b1" stroke="#4a4948" stroke-width="0.3"/>
    <path d="M1.0 1.0 L17.0 1.0 L17.0 3.5 L13.9 6.5 L1.0 6.5 Z" fill="#141516"/>
    <path d="M2.6 2.4 H15.6 M2.6 4.3 H13.4" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-3" transform="translate(53.14 5.8)">
    <path d="M0.8 0 L17.2 0 A0.8 0.8 0 0 1 18.0 0.8 L18.0 3.8 L14.3 7.5 L0.8 7.5 A0.8 0.8 0 0 1 0 6.7 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#b3b2b1" stroke="#4a4948" stroke-width="0.3"/>
    <path d="M1.0 1.0 L17.0 1.0 L17.0 3.5 L13.9 6.5 L1.0 6.5 Z" fill="#141516"/>
    <path d="M2.6 2.4 H15.6 M2.6 4.3 H13.4" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-2" transform="translate(73.94 5.8)">
    <path d="M0.8 0 L17.2 0 A0.8 0.8 0 0 1 18.0 0.8 L18.0 3.8 L14.3 7.5 L0.8 7.5 A0.8 0.8 0 0 1 0 6.7 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#b3b2b1" stroke="#4a4948" stroke-width="0.3"/>
    <path d="M1.0 1.0 L17.0 1.0 L17.0 3.5 L13.9 6.5 L1.0 6.5 Z" fill="#141516"/>
    <path d="M2.6 2.4 H15.6 M2.6 4.3 H13.4" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <g id="display-port-1" transform="translate(94.73 5.8)">
    <path d="M0.8 0 L17.2 0 A0.8 0.8 0 0 1 18.0 0.8 L18.0 3.8 L14.3 7.5 L0.8 7.5 A0.8 0.8 0 0 1 0 6.7 L0 0.8 A0.8 0.8 0 0 1 0.8 0 Z" fill="#b3b2b1" stroke="#4a4948" stroke-width="0.3"/>
    <path d="M1.0 1.0 L17.0 1.0 L17.0 3.5 L13.9 6.5 L1.0 6.5 Z" fill="#141516"/>
    <path d="M2.6 2.4 H15.6 M2.6 4.3 H13.4" stroke="#7d8288" stroke-width="0.7" stroke-dasharray="0.5 0.45" fill="none"/>
  </g>
  <!-- the window's bezel: a frame 87.7 long and 25.0 across around the vent -->
  <rect id="bezel" x="28.3" y="14.6" width="87.7" height="25.0" rx="1.6" fill="none" stroke="#4a4948" stroke-width="0.35"/>
  <!-- the vent window with the heat-sink fins behind it: 17 fins on a 4.3 pitch,
       the first at x 37.6 -->
  <rect x="30.6" y="15.4" width="85.0" height="23.5" rx="1.0" fill="#0b0c0d"/>
  <rect id="vent" x="35.58" y="15.6" width="74.67" height="23.14" rx="0.8" fill="#0b0c0d" stroke="#3a3e43" stroke-width="0.3"/>
  <g id="fins" fill="#5a5d60">
    <rect x="37.3" y="15.9" width="0.6" height="22.5"/>
    <rect x="41.6" y="15.9" width="0.6" height="22.5"/>
    <rect x="45.9" y="15.9" width="0.6" height="22.5"/>
    <rect x="50.2" y="15.9" width="0.6" height="22.5"/>
    <rect x="54.5" y="15.9" width="0.6" height="22.5"/>
    <rect x="58.8" y="15.9" width="0.6" height="22.5"/>
    <rect x="63.1" y="15.9" width="0.6" height="22.5"/>
    <rect x="67.4" y="15.9" width="0.6" height="22.5"/>
    <rect x="71.7" y="15.9" width="0.6" height="22.5"/>
    <rect x="76.0" y="15.9" width="0.6" height="22.5"/>
    <rect x="80.3" y="15.9" width="0.6" height="22.5"/>
    <rect x="84.6" y="15.9" width="0.6" height="22.5"/>
    <rect x="88.9" y="15.9" width="0.6" height="22.5"/>
    <rect x="93.2" y="15.9" width="0.6" height="22.5"/>
    <rect x="97.5" y="15.9" width="0.6" height="22.5"/>
    <rect x="101.8" y="15.9" width="0.6" height="22.5"/>
    <rect x="106.1" y="15.9" width="0.6" height="22.5"/>
  </g>
  <!-- four Torx screws at the window's corners, beyond the vent's two ends -->
  <g id="screw-1"><circle cx="33.07" cy="18.09" r="2.35" fill="#5d5c5b" stroke="#1f1e1d" stroke-width="0.3"/><circle cx="33.07" cy="18.09" r="0.9" fill="#1d1f21"/></g>
  <g id="screw-2"><circle cx="113.51" cy="18.09" r="2.35" fill="#5d5c5b" stroke="#1f1e1d" stroke-width="0.3"/><circle cx="113.51" cy="18.09" r="0.9" fill="#1d1f21"/></g>
  <g id="screw-3"><circle cx="33.07" cy="36.35" r="2.35" fill="#5d5c5b" stroke="#1f1e1d" stroke-width="0.3"/><circle cx="33.07" cy="36.35" r="0.9" fill="#1d1f21"/></g>
  <g id="screw-4"><circle cx="113.51" cy="36.35" r="2.35" fill="#5d5c5b" stroke="#1f1e1d" stroke-width="0.3"/><circle cx="113.51" cy="36.35" r="0.9" fill="#1d1f21"/></g>
</svg>
