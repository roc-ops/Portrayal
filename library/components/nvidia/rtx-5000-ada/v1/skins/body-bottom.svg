  <!-- nvidia/rtx-5000-ada: THE SHROUD'S BROAD SIDE, the body's bottom side seen
       from outside. NO PHOTOGRAPH OF THIS CARD'S BROAD SIDE IS HELD (PNY serves
       the RTX 4500 Ada's picture under this card's name), so this is the RTX 4500
       Ada's side, estimated. Across: 120.02 (the face's width) less the face's x,
       so the card's top edge is at -6.29 and its lower edge at 91.61. Down: 266.7
       less mm behind the bracket's outer face, so the far end is at the top and
       the bracket's end at the bottom. Matte dark grey, lighter toward the bracket,
       with the blower's opening: a dark ring 74.4 across centred 70.0 from the far
       end and 44.9 below the top edge, with a grey hub and 52 pale blades. Drawn
       in-house; nothing is traced. -->
