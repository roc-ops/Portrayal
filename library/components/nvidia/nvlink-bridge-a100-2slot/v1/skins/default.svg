<svg xmlns="http://www.w3.org/2000/svg" width="47.24mm" height="49.5mm" viewBox="0 0 47.24 49.5">
  <!-- The bridge seen from above, built in four steps, lowest first. Every node is
       the whole art of its relief feature. Body only: no printed mark is held. -->
  <!-- the base plate, 47.24 across, from half a connector beyond one end's centre
       line to half a connector beyond the other's -->
  <path id="body" fill="#202225" stroke="#4a4d52" stroke-width="0.15"
        d="M 0 1.5 Q 0 0 1.5 0 H 45.74 Q 47.24 0 47.24 1.5 V 48 Q 47.24 49.5 45.74 49.5 H 1.5 Q 0 49.5 0 48 Z"/>
  <!-- the two connector ends, over the two connectors (6.6 wide, 3.3 in from the
       edge to the centre line, 40.64 apart), each drawn 0.05 inside the plate's
       edge so its sides do not share a plane with the plate's -->
  <rect id="end-a" x="0.05" y="0.05" width="6.5" height="49.4" rx="0.5" fill="#2c2e32" stroke="#4a4d52" stroke-width="0.12"/>
  <rect id="end-b" x="40.69" y="0.05" width="6.5" height="49.4" rx="0.5" fill="#2c2e32" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- the top cover between the ends, then the raised centre of it -->
  <rect id="cover" x="8.0" y="3.0" width="31.24" height="43.5" rx="1.5" fill="#25282c" stroke="#4a4d52" stroke-width="0.12"/>
  <rect id="cover-top" x="14.0" y="8.0" width="19.24" height="33.5" rx="1.2" fill="#2e3136" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- three grip ridges across the raised centre -->
  <g fill="#3a3e43">
    <rect id="ridge-1" x="17.0" y="21.5" width="13.24" height="1.0" rx="0.3"/>
    <rect id="ridge-2" x="17.0" y="24.25" width="13.24" height="1.0" rx="0.3"/>
    <rect id="ridge-3" x="17.0" y="27.0" width="13.24" height="1.0" rx="0.3"/>
  </g>
</svg>
