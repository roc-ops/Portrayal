<svg xmlns="http://www.w3.org/2000/svg" width="97.9mm" height="38.23mm" viewBox="0 0 97.9 38.23">
  <!-- nvidia/l40s-tail: the L40S's far end seen from behind, from the
       backplate (y 0) to the shroud's far wall (y 38.23). THE TOP EDGE IS AT
       THE LEFT: x' = 126.31 less the card's x. The black end plate is below,
       the open shroud above it with the fin stack edge-on, and the 16-pin
       connector (composed) and two mount bosses on the plate. Drawn in-house,
       in the frame of nvidia/a100-pcie-80gb-tail@1; nothing is traced. -->
  <rect id="end-plate" x="0" y="0" width="97.9" height="12.63" fill="#202326"/>
  <!-- the shroud's rim: a wall round the opening, 2.1 thick, estimated -->
  <rect id="shroud-rim" x="0" y="12.63" width="97.9" height="25.6" fill="#b8a68c"/>
  <rect id="opening" x="2.1" y="12.63" width="93.7" height="23.5" fill="#07080a"/>
  <!-- the fin stack, edge-on: 19 fins on a 4.93 pitch, 0.8 thick, the first at
       x' 3.98 (measured on the straight-on photograph) -->
  <g id="fins" fill="#2b2e32">
    <rect x="3.58" y="12.63" width="0.8" height="23.5"/>
    <rect x="8.51" y="12.63" width="0.8" height="23.5"/>
    <rect x="13.44" y="12.63" width="0.8" height="23.5"/>
    <rect x="18.37" y="12.63" width="0.8" height="23.5"/>
    <rect x="23.30" y="12.63" width="0.8" height="23.5"/>
    <rect x="28.23" y="12.63" width="0.8" height="23.5"/>
    <rect x="33.16" y="12.63" width="0.8" height="23.5"/>
    <rect x="38.09" y="12.63" width="0.8" height="23.5"/>
    <rect x="43.02" y="12.63" width="0.8" height="23.5"/>
    <rect x="47.95" y="12.63" width="0.8" height="23.5"/>
    <rect x="52.88" y="12.63" width="0.8" height="23.5"/>
    <rect x="57.81" y="12.63" width="0.8" height="23.5"/>
    <rect x="62.74" y="12.63" width="0.8" height="23.5"/>
    <rect x="67.67" y="12.63" width="0.8" height="23.5"/>
    <rect x="72.60" y="12.63" width="0.8" height="23.5"/>
    <rect x="77.53" y="12.63" width="0.8" height="23.5"/>
    <rect x="82.46" y="12.63" width="0.8" height="23.5"/>
    <rect x="87.39" y="12.63" width="0.8" height="23.5"/>
    <rect x="92.32" y="12.63" width="0.8" height="23.5"/>
  </g>
  <!-- the extender mount: two bosses the thumbscrews fasten to, 28.4 apart -->
  <circle id="mount-1" cx="89.51" cy="8.73" r="1.75" fill="#8a9199" stroke="#5f666d" stroke-width="0.2"/>
  <circle id="mount-2" cx="61.11" cy="8.73" r="1.75" fill="#8a9199" stroke="#5f666d" stroke-width="0.2"/>
</svg>
