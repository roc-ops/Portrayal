format: 1
kind: module
name: a100-pcie-40gb
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  NVIDIA A100 40GB PCIe GPU, a passive dual-slot full-height full-length card
  and the 80GB card's sibling. The bracket face carries one vent window and no
  ports. Three NVLink bridge connectors sit on the top edge under removable
  caps. The far end is open and shows the heat sink's fins edge-on. It has one
  black CPU 8-pin power connector by the top edge and two bosses for an
  extender. NVIDIA's straight or long offset extender can be fitted to the far
  end; the `extender` field chooses it. It plugs into one riser slot and covers
  the one beside it.
slot-width: 2
size: {w: 120.02, h: 41.91, d: 266.70}
size-confidence: {w: registry, h: registry, d: drawing}
attrs:
  model: 'A100 40GB PCIe'
  board-sku: 'P1001 SKU 200, NVPN 699-21001-0200-xxx'
  role: gpu
  form-factor: 'Full-height, full-length (FHFL) 10.5 in, dual-slot'
  pcie-connector: x16
  pcie-generation: 4
  pcie-height: full
  power-draw-max-w: 250
  power-input: 'host PCIe slot and one CPU 8-pin auxiliary connector'
  memory: '40 GB HBM2, 5120-bit, up to 1.555 TB/s'
  cooling: passive
  airflow: 'bidirectional; the heat sink takes system airflow either way along the card'
  nvlink: 'three bridge connectors on the top edge; 600 GB/s with one adjacent A100'
  weight-kg: 1.24
  eol: none-announced
fields:
  extender:
    label: Extender
    type: choice
    options: [none, straight, long-offset]
    default: none
    drawn-by-absence: [none]
    description: >-
      The bracket at the card's far end that a server's card guide holds. The
      straight one (NVPN 682-00003-5555-007) makes the card 312 mm long. The
      long offset one (NVPN 682-00003-5555-006) makes it 339 mm.
faces:
  rear: {ref: nvidia/a100-pcie-80gb-tail@1}
  plan: {ref: nvidia/a100-pcie-40gb-top@1}
provenance:
  slot-width: >-
    datasheet - PB-10137 table 1: form factor "Full-height, full-length (FHFL)
    10.5', dual-slot". The face is the same one plate 36 across as the 80GB's
    (`face-outline`). The card declares `slot-width: 2` as
    docs/pcie-two-slot-bays-design.md R1 defines it.
  sources: >-
    NVIDIA A100 40GB PCIe GPU Accelerator Product Brief PB-10137-001_v03,
    22 September 2020, https://www.nvidia.com/content/dam/en-zz/Solutions/Data-Center/a100/pdf/A100-PCIE-Prduct-Brief.pdf.
    Tables 1, 2, 5 and 6, figure 3 (card dimensions), figure 5 (NVLink
    keep-out) and the NVLink, power and extender text. The A100 datasheet,
    https://www.nvidia.com/content/dam/en-zz/Solutions/Data-Center/a100/pdf/nvidia-a100-datasheet-nvidia-us-2188504-web.pdf,
    gives the 80GB card's figures and none for the 40GB. This card is built
    from the pilot nvidia/a100-pcie-80gb@1 wherever the two cards share a part
    (the bracket, the shroud, the connectors' places), and the provenance says
    where it differs. NVIDIA's brief forbids reproducing its figures, so its
    facts are transcribed and none of its figures is copied.
  reference-photos: >-
    reference - PNY's product images for the 40GB card, which are the same
    files as the 80GB card's (the same bytes are served on both
    product pages): a100pcie_fr.png (broad side), a100pcie_top.png and
    a100pcie_top-2.png (top edge) and a100-pcie-3qtr.png, under
    https://d2vfia6k6wrouk.cloudfront.net/productimages/4ffc5dc6-2cd9-4629-ae48-acf0011aef4b/images/.
    Licence not stated; facts read from them, pictures not used. THEY ARE ONE
    SET OF PICTURES FOR TWO CARDS, so they show that the two cards look alike
    and cannot show a difference between them. No photograph of the 40GB
    bracket straight on was found.
  size: >-
    registry - w is the full-height bracket's 120.02 (std/pcie-bracket-fh@2,
    PCIe CEM 5.0 figure 11-5). h is two slots: the single bracket's 21.59 plus
    one 20.32 slot pitch, 41.91. That is the envelope two adjacent slots give a
    card, as on the 80GB card.
  depth: >-
    drawing - PB-10137 figure 3: 266.7 +/-1.4 overall, measured from the
    bracket's outer face. The brief prints one length and does not say
    "with" or "without" the bracket; the dimension starts at the bracket's
    outer line in the drawing, so it is read as with.
  size-length: >-
    THE 40GB AND 80GB DRAWINGS DIFFER, AND EACH CARD USES ITS OWN. PB-10137
    figure 3 (this card) prints 266.7 +/-1.4 overall, the CEM datum 57.15 from
    the bracket and 209.55 from the datum to the end (57.15 + 209.55 = 266.70),
    the card height 111.15 and 104.86 to the bracket's flange end. The 80GB's
    figure 3 prints 268.60 with the bracket, 59.05 and 81.88. The 1.9 between
    the two datums is the 1.9 between the two lengths. The figure is
    consistent in itself: measured on the 1368 px page it is 3.887 px/mm down
    the 111.15 and 3.873 px/mm along the 266.7, so it is near orthographic and
    can carry a reading. Every length behind the datum here is this drawing's.
  face-outline: >-
    borrowed - nvidia/a100-pcie-80gb@1 `face-outline`, `face-keyed-flange`,
    `face-grille` and `face-markings`: the bracket's outline, its two retention
    tabs, its V notch, the raised grille frame, the vent window, the four Torx
    screws and the sixteen fins behind the window, measured there from a
    straight-on photograph of an 80GB card. This card's own bracket was not
    photographed. PB-10137 table 1 gives the same "bracket with screws: 20
    grams" the 80GB brief does, and PNY's one set of renders shows one shroud
    and one bracket for both, so the drawing is carried over unchanged. If
    the 40GB's bracket differs, this is where.
  thickness: >-
    borrowed - nvidia/a100-pcie-80gb@1 `thickness`: 38.2, estimated there from
    the dual-slot envelope, the brief's 2.67 backside clearance (PB-10137 also
    prints it, in the NVLink text) and the bracket's far edge. PB-10137 does not
    state the thickness either.
  orientation: >-
    drawn TIP-LEFT, as std/pcie-bracket-fh@2 and the 80GB card are. The board,
    and the bracket's keyed side, are at the top (small y).
  body: >-
    the board, its edge and the pads follow PCIe CEM 5.0 (figures 6-5 and 11-3,
    as nvidia/mcx755106-fh@1 has them) at PB-10137 figure 3's lengths: the card
    height 111.15, the lower edge 13.25 above the finger datum W and the key
    datum 57.15 behind the bracket, so the top edge is at x 126.31. The
    tab's short run ends 0.95 before the datum and its long run starts 0.95
    after it, the key's 1.9 notch. The notch in the lower edge is
    NOT dimensioned in this figure and is read off it at 3.88 px/mm: its long
    base runs from about 139.4 to 158.8 behind the bracket, 19.4 long, where
    the 80GB's figure prints 19.50 REF. The long run of the tab is drawn to
    139.03 (the datum plus the 80GB figure's 81.88) and the notch 19.50 long
    from there, which the reading confirms to 0.4. Its depth, 3.55, is the 80GB
    figure's REF and this figure shows a notch of the same shape. The
    shroud, cover and backplate follow the board's outline, as on the 80GB
    card (`body-shroud`, estimated). The board is 1.90 behind the bracket
    in CEM 5.5 and nearer in this figure; the 3D body keeps the pilot's 0.90
    gap to the shroud's front and moves everything behind the datum by the
    1.9 the two figures differ.
  body-lower-edge: >-
    drawing - 13.25 above W, read on this figure at 12.9 (50 px at 3.887
    px/mm), which is within the figure's resolution of the printed 13.25 on the
    80GB drawing and 13.25 of the CEM envelope. The step near the bracket
    (the board's lower edge stepping toward W for about 18 mm) is not a box, as
    on the 80GB card.
  body-shroud: >-
    borrowed - nvidia/a100-pcie-80gb@1 `body-shroud`: a champagne shroud with
    a black cover on the board's side and a black backplate, split at the
    notch. Estimated there from photographs of the 80GB card; PNY's renders of
    the 40GB card are the same pictures.
  body-nvlink: >-
    estimated - three NVLink bridge connectors on the top edge, each under a
    removable cap (PB-10137: "NVLink bridge interfaces of the A100 PCIe card
    include removable caps"). The positions, 49.5 long starting 13.5, 70.7 and
    126.1 behind the bracket and 6.6 wide from 2.2 to 8.8 across the card, are
    the 80GB card's, read on the same PNY top-edge render. Figure 5 is the
    keep-out and has no dimensions. Whether the 40GB's connectors are the
    80GB's is not stated by either brief; both name "NVIDIA A100 NVLink
    bridges" and one bridge, so the connector is the 80GB's
    nvidia/nvlink-a100-connector@1 and the claim is an estimate. THE BOXES
    BELOW (`nvlink-1` to `nvlink-3`) ARE THE CAPS; the connectors under them
    are composed by `faces.plan` (nvidia/a100-pcie-40gb-top@1).
  body-power-connector: >-
    borrowed - nvidia/a100-pcie-80gb@1 `body-power-connector`. PB-10137 table
    1 and the text say "One CPU 8-pin auxiliary power connector ... on the east
    edge of the board", the 80GB brief's words. Its place and size (18.4 x
    10.85, 2.3 from the top edge, black) are the 80GB photograph's; the 40GB's
    own housing colour and position were not photographed. THE PORT is
    `aux-power` on the rear face (`faces.rear`, nvidia/a100-pcie-80gb-tail@1),
    std/eps12v-header@1, which presents `eps12v-8pin` for a CPU 8-pin cable;
    PB-10137 table 6 lists a "1x CPU 8-pin cable" and a "CPU 8-pin to PCIe
    8-pin cable adapter", the same two as the 80GB card.
  body-end: >-
    estimated - as nvidia/a100-pcie-80gb@1 `body-end`: the black end plate stops
    0.4 short of the shroud's lip and the housing and bosses stand 0.2 proud
    of it. This card's end is at 266.7, so the plate stops at 266.3.
  body-tail-fins: >-
    borrowed - nvidia/a100-pcie-80gb@1 `body-tail-fins`: 18 fins on a 5.0
    pitch seen edge-on through the open far end, 0.8 thick, drawn 40 deep. The
    far end is shown by `faces.rear`, which is the 80GB card's
    nvidia/a100-pcie-80gb-tail@1 reused: the end of the two cards is taken to
    be the same, which no photograph of a 40GB card shows.
  body-extender-mount: >-
    borrowed - nvidia/a100-pcie-80gb@1 `body-extender-mount`. PB-10137 says OEMs
    "may design a custom attach method using the extender mounting holes on
    the east edge of the PCIe card", the same holes the 80GB brief names.
  power: >-
    datasheet - PB-10137 table 1: total board power 250 W, and the text:
    "operates unconstrained up to its thermal design power (TDP) level of 250
    W". The brief gives no default, maximum or minimum separately.
  weight: >-
    datasheet - PB-10137 table 1: board 1240 g, excluding the bracket and
    extenders. The bracket with screws is 20 g, the long offset extender 64 g
    and the straight extender 39 g, all of them different from the 80GB card's
    1170, 48 and 32.
  memory: >-
    datasheet - PB-10137 table 2: HBM2, 40 GB, 5120-bit, 1215 MHz, up to
    1555 GB/s.
  pcie: >-
    datasheet - PB-10137 table 1: PCI Express 4.0 x16, lane and polarity
    reversal supported.
  part-numbers: >-
    datasheet - PB-10137 table 1: product SKU P1001 SKU 200, NVPN
    699-21001-0200-xxx. NO ORDER CODE (900-...) IS GIVEN IN ANY DOCUMENT HELD
    for this card, and none is written: the A100 datasheet's PNY part number
    is the 80GB's. Searched: PB-10137, the A100 datasheet 2188504, PNY's 80GB
    datasheet and PNY's line card. The model name is the contract's `model`.
  nvlink: >-
    datasheet - PB-10137 table 5 and the NVLink text: three bridges, 96 lanes
    at 50 Gbps per direction, 600 GB/s with one adjacent A100 card. The brief
    gives no bridge part number; the 80GB brief's 900-53651-0000-000 and the
    H100 briefs' statement that the bridge is the Ampere generation's suggest it
    is the same, and that is not claimed.
  extenders: >-
    datasheet - PB-10137 "Extenders": a long offset extender (NVPN
    682-00003-5555-006, card plus extender 339 mm, 64 g) and a straight
    extender (NVPN 682-00003-5555-007, 312 mm, 39 g). THESE ARE NOT THE 80GB
    CARD'S PART NUMBERS (682-00007-5555-000 and -001) and the weights differ;
    the lengths are the same. The pieces below are the 80GB card's, which was
    photographed with the straight one fitted, moved to this card's end so the
    far edges stay at 312 and 339. Whether the 40GB's extender has the same
    plate and slots is not shown by any document held (PB-10137 figure 8 draws
    both, with no dimensions that were read).
  body-extender-straight: >-
    borrowed - nvidia/a100-pcie-80gb@1 `body-extender-straight`: a slotted
    plate of four bars with three slots, an upright 1.2 thick and 15 wide that
    ends at x 103.41, clear of the 8-pin housing. Its far edge is the brief's
    312. Its length shrinks by the 1.9 the card is shorter, so the bars run
    30.3 and not 28.4 before the upright.
  body-extender-long-offset: >-
    borrowed - nvidia/a100-pcie-80gb@1 `body-extender-long-offset`. Its far
    edge is the brief's 339; no photograph of it was found.
  gaps: >-
    GAPS HANDED ON, NOT CLOSED: (1) the bracket face straight on, for this
    card (needs-photo; the 80GB's is carried over); (2) the thickness, which no
    source states (vendor-silent); (3) the order code 900-21001-xxxx-xxx
    (vendor-silent in the documents held); (4) the notch's printed
    dimensions, which this figure does not carry (the 80GB figure's REF
    values are used and the reading agrees to 0.4); (5) a photograph of the
    far end, the top edge printing and the extenders on a 40GB card.
  lifecycle: >-
    No end-of-life notice for the 40GB card was found. One Stop Systems' notice
    of 24 January 2024 names the A100 80GB, not this card, and NVIDIA publishes
    no GPU end-of-life list. PNY lists the A100 under legacy data-center GPUs.
    The attr says `none-announced`, which here means none was found.
