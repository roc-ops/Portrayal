<svg xmlns="http://www.w3.org/2000/svg" width="79.2mm" height="18.42mm" viewBox="0 0 79.2 18.42">
  <!-- nvidia/mcx623102a-lp: MCX623102A on its short bracket. The outline, tip
       and keyed flange are std/pcie-bracket-lp@1, composed BEHIND this; what is drawn
       here is the punched plate: vents, light-pipe slots and port numerals.
       TIP AT THE LEFT - NVIDIA draws the card tip-right, so this is its
       figure turned a half-turn and the numerals read upside down. -->
  <!-- METAL FILLING THE OPENING: the bracket colour, 0.3 proud all round so
       the opening stroke leaves no ghost; the holes are punched in it. -->
  <rect id="plate" x="15.33" y="2.88" width="55.13" height="12.66" fill="#9aa1a8"/>
  <g id="vents"><rect x="46.96" y="11.20" width="3.3" height="3.3" rx="0.6" fill="#17191c"/><rect x="46.96" y="5.98" width="3.3" height="3.3" rx="0.6" fill="#17191c"/><rect x="70.27" y="11.20" width="3.3" height="3.3" rx="0.6" fill="#17191c"/><rect x="70.27" y="5.98" width="3.3" height="3.3" rx="0.6" fill="#17191c"/><rect x="11.93" y="11.20" width="3.3" height="3.3" rx="0.6" fill="#17191c"/><rect x="11.93" y="5.98" width="3.3" height="3.3" rx="0.6" fill="#17191c"/><rect x="17.29" y="11.20" width="3.3" height="3.3" rx="0.6" fill="#17191c"/><rect x="17.29" y="5.98" width="3.3" height="3.3" rx="0.6" fill="#17191c"/><rect x="22.58" y="11.20" width="3.3" height="3.3" rx="0.6" fill="#17191c"/><rect x="22.58" y="5.98" width="3.3" height="3.3" rx="0.6" fill="#17191c"/></g>
  <g id="slots"><rect x="52.66" y="14.41" width="4.3" height="1.0" rx="0.5" fill="#17191c"/><rect x="58.56" y="14.41" width="4.3" height="1.0" rx="0.5" fill="#17191c"/><rect x="64.46" y="14.41" width="4.3" height="1.0" rx="0.5" fill="#17191c"/><rect x="27.66" y="14.41" width="4.3" height="1.0" rx="0.5" fill="#17191c"/><rect x="33.56" y="14.41" width="4.3" height="1.0" rx="0.5" fill="#17191c"/><rect x="39.46" y="14.41" width="4.3" height="1.0" rx="0.5" fill="#17191c"/></g>
  <g id="silkscreen">
    <text id="label-port-1" x="69.21" y="8.92" transform="rotate(180 69.21 8.20)" font-family="sans-serif" font-size="2.0" font-weight="bold" text-anchor="middle" fill="#2b2d2f">1</text>
    <text id="label-port-2" x="27.41" y="8.92" transform="rotate(180 27.41 8.20)" font-family="sans-serif" font-size="2.0" font-weight="bold" text-anchor="middle" fill="#2b2d2f">2</text>
  </g>
</svg>
