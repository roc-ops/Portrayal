unmated: the fixed input cord of the PDU, ending in a NEMA 5-15P plug; the plug is the cord's own end, so nothing plugs into the cord and no mate is offered for it
description: >-
  The fixed input cord of the CyberPower PDU81001G, 12 ft (3.7 m) long with a NEMA 5-15P plug. It leaves the left end
  of the front face through a strain relief. Only the strain relief is drawn, as the front photograph shows it.
size: {w: 16.0, h: 16.0}
size-confidence: {w: estimated, h: estimated}
attrs: {plug: nema-5-15p, cord-length-ft: 12}
provenance:
  size: >-
    ESTIMATED. The only picture is the angled product photograph on page 1 of the PDU81001G data sheet, where the strain
    relief reads about 55 px across at 2.64 px per mm (the 433 mm body is 1145 px across the photograph) and the cord falls
    away toward the camera, so its size is read as a fraction of the body and drawn 16.0. needs-drawing: a straight-on
    photograph of the left end, or a dimensioned drawing.
  plug: >-
    datasheet - PDU81001G data sheet, page 1 and 2: "Input Plug Type NEMA 5-15P" and "Cord Length (ft.) 12 ft (3.7 m)". The
    plug style is not stated.
  not-drawn: >-
    THE CORD BEYOND THE STRAIN RELIEF AND THE PLUG ARE NOT DRAWN: the far end of a cord is not a part. This part stands for
    the power input a DCIM records, a NEMA 5-15P power port.
