  existence: >-
    datasheet - CyberPower PDU81001G data sheet, page 1 photograph of the controller face. No document names it or says what
    its four arrows select.
  size: >-
    ESTIMATED. Read as a fraction of the body off the angled photograph on page 1: the four arrows span about 14 mm and the
    cap about 7 mm. No document dimensions it. needs-drawing: a straight-on photograph of the controller face.
elements:
  cap: {at: [3.5, 3.5], size: [7.0, 7.0], class: button}
