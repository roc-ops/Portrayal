description: >-
  The navigation button of the CyberPower PDU81001G: a round black cap in a ring, with an arrow at its top, bottom, left
  and right. The data sheet photograph shows it under a RESET legend. The data sheet says nothing of how it works.
size: {w: 14.0, h: 14.0}
size-confidence: {w: estimated, h: estimated}
