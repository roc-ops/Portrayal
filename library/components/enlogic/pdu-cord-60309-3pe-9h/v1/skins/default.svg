<svg xmlns="http://www.w3.org/2000/svg" width="46mm" height="46mm" viewBox="0 0 46 46">
  <!-- The cable gland of the input cord seen end on: a round nut and the cord filling its bore.
       The end-on shape is a circle for lack of a drawing. -->
  <circle id="gland" cx="23" cy="23" r="23" fill="#17181a" stroke="#4a4d51" stroke-width="0.25"/>
  <circle id="cord" cx="23" cy="23" r="11" fill="#0d0e0f" stroke="#3c3f43" stroke-width="0.3"/>
</svg>
