<svg xmlns="http://www.w3.org/2000/svg" width="44.9mm" height="50.2mm" viewBox="0 0 44.9 50.2">
  <!-- An Enlogic Advantage Series bank breaker: the plate in the bank's colour, four screws, the recess and
       the 20 A rocker, drawn as the PDU stands (cord end up, the drawing's top edge on the right). The bank
       reads up the left, the lines beside it. Positions estimated from a 300 dpi render. -->
  <g id="plate">
    <rect x="0" y="0" width="44.9" height="50.2" rx="2.5" fill="#e8e8e8" stroke="#2a2c2f" stroke-width="0.3" data-fill-from="bank-color"/>
    <circle cx="39.4" cy="5.0" r="2.0" fill="#8a8d90" stroke="#3a3d41" stroke-width="0.2"/>
    <circle cx="39.4" cy="45.2" r="2.0" fill="#8a8d90" stroke="#3a3d41" stroke-width="0.2"/>
    <circle cx="5.5" cy="5.0" r="2.0" fill="#8a8d90" stroke="#3a3d41" stroke-width="0.2"/>
    <circle cx="5.5" cy="45.2" r="2.0" fill="#8a8d90" stroke="#3a3d41" stroke-width="0.2"/>
    <rect x="22.0" y="7.0" width="19.0" height="36.0" fill="#101112" stroke="#2a2c2f" stroke-width="0.25"/>
  </g>
  <g id="silkscreen" font-family="sans-serif" fill="#202020">
    <text x="14.5" y="25.1" font-size="9.0" text-anchor="middle" transform="rotate(90 14.5 25.1)" data-from="bank" data-fill-from="ink">B1</text>
    <text x="6.0" y="25.1" font-size="3.6" text-anchor="middle" transform="rotate(90 6.0 25.1)" data-from="lines" data-fill-from="ink">L1-L2</text>
  </g>
  <rect id="rocker" x="27.0" y="17.0" width="7.8" height="14.7" rx="0.6" fill="#0b0b0c" stroke="#3b3e42" stroke-width="0.2"/>
</svg>
