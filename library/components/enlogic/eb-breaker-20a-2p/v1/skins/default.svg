<svg xmlns="http://www.w3.org/2000/svg" width="46.8mm" height="80mm" viewBox="0 0 46.8 80">
  <!-- An Enlogic EB bank breaker: the plate in the bank's colour, four Torx screws,
       the recess and the 20 A rocker, drawn as the PDU stands (cord end up). The
       maker's drawing lies the strip down: its length runs down this part, its width
       across it. B1 reads down the strip; the lines and the receptacle's line read
       across it, as the face render prints them. -->
  <g id="plate">
    <rect x="0" y="0" width="46.8" height="80" rx="2.5" fill="#646867" stroke="#2a2c2f" stroke-width="0.3" data-fill-from="bank-color"/>
    <circle cx="32.5" cy="12.7" r="2.8" fill="#8a8d90" stroke="#3a3d41" stroke-width="0.2"/>
    <path d="M 31.2 12.7 h 2.6 M 32.5 11.4 v 2.6" stroke="#2a2c2f" stroke-width="0.4"/>
    <circle cx="32.5" cy="56.5" r="2.8" fill="#8a8d90" stroke="#3a3d41" stroke-width="0.2"/>
    <path d="M 31.2 56.5 h 2.6 M 32.5 55.2 v 2.6" stroke="#2a2c2f" stroke-width="0.4"/>
    <circle cx="14.2" cy="12.7" r="2.8" fill="#8a8d90" stroke="#3a3d41" stroke-width="0.2"/>
    <path d="M 12.9 12.7 h 2.6 M 14.2 11.4 v 2.6" stroke="#2a2c2f" stroke-width="0.4"/>
    <circle cx="14.2" cy="56.5" r="2.8" fill="#8a8d90" stroke="#3a3d41" stroke-width="0.2"/>
    <path d="M 12.9 56.5 h 2.6 M 14.2 55.2 v 2.6" stroke="#2a2c2f" stroke-width="0.4"/>
    <rect x="2.8" y="17.3" width="19.7" height="35.1" fill="#101112" stroke="#2a2c2f" stroke-width="0.25"/>
  </g>
  <g id="silkscreen" font-family="sans-serif" fill="#e6e6e6">
    <text x="28.7" y="35.1" font-size="10.6" text-anchor="middle" transform="rotate(90 28.7 35.1)" data-from="bank" data-fill-from="ink">B1</text>
    <text x="23.0" y="66.6" font-size="6.8" text-anchor="middle" data-from="lines" data-fill-from="ink">L1-L2</text>
    <text x="23.0" y="77.2" font-size="6.3" text-anchor="middle" data-from="branch" data-fill-from="ink">L1-N(5-20R)</text>
  </g>
  <rect id="rocker" x="6.0" y="27.1" width="14.7" height="7.8" rx="0.6" fill="#0b0b0c" stroke="#3b3e42" stroke-width="0.2"/>
</svg>
