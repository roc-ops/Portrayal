  <rect id="nose" x="2.6" y="3.4" width="16.9" height="27.6" rx="2" fill="#26282a" stroke="#45484c" stroke-width="0.2"/>
  <rect x="4.6" y="8.5" width="3.2" height="6" rx="0.3" fill="#030303"/>
  <rect x="14.3" y="8.5" width="3.2" height="6" rx="0.3" fill="#030303"/>
