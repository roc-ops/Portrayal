  <rect id="nose" x="3" y="4" width="16.8" height="26.4" rx="2" fill="#26282a" stroke="#45484c" stroke-width="0.2"/>
  <rect x="5" y="9" width="3" height="5" rx="0.3" fill="#030303"/>
  <rect x="14.8" y="9" width="3" height="5" rx="0.3" fill="#030303"/>
  <rect x="9.9" y="20" width="3" height="5" rx="0.3" fill="#030303"/>
