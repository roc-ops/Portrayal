<svg xmlns="http://www.w3.org/2000/svg" width="45mm" height="70mm" viewBox="0 0 45 70">
  <!-- An Enlogic EN2333 / EN6324 bank breaker: the plate in the bank's colour with its rounded ends, four
       screws, the recess and the 20 A rocker, drawn as the PDU stands (cord end up, the drawing's top edge on the
       right). The bank reads up the left, the lines beside it. Positions estimated from 500 dpi renders. -->
  <g id="plate">
    <rect x="0" y="0" width="45" height="70" rx="4.0" fill="#646867" stroke="#2a2c2f" stroke-width="0.3" data-fill-from="bank-color"/>
    <circle cx="32.0" cy="13.8" r="3.25" fill="#8a8d90" stroke="#3a3d41" stroke-width="0.2"/>
    <circle cx="32.0" cy="56.2" r="3.25" fill="#8a8d90" stroke="#3a3d41" stroke-width="0.2"/>
    <circle cx="13.0" cy="13.8" r="3.25" fill="#8a8d90" stroke="#3a3d41" stroke-width="0.2"/>
    <circle cx="13.0" cy="56.2" r="3.25" fill="#8a8d90" stroke="#3a3d41" stroke-width="0.2"/>
    <rect x="23.3" y="18.3" width="19.0" height="33.4" fill="#101112" stroke="#2a2c2f" stroke-width="0.25"/>
  </g>
  <g id="silkscreen" font-family="sans-serif" fill="#e6e6e6">
    <text x="14.5" y="35.1" font-size="9.0" text-anchor="middle" transform="rotate(90 14.5 35.1)" data-from="bank" data-fill-from="ink">B1</text>
    <text x="6.0" y="35.1" font-size="3.6" text-anchor="middle" transform="rotate(90 6.0 35.1)" data-from="lines" data-fill-from="ink">L1-L2</text>
  </g>
  <rect id="rocker" x="28.3" y="27.65" width="7.8" height="14.7" rx="0.6" fill="#0b0b0c" stroke="#3b3e42" stroke-width="0.2"/>
</svg>
