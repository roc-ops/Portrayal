format: 1
kind: component
name: scg-power-rocker
version: 1.0.0
class: button
profile: networking
description: >-
  The small rocker power switch under each AC inlet on the rear of a Perle IOLAN SCG console server. It is printed
  with a circle (0) at its left end and a bar at its right. Drawn from one photograph.
size: {w: 15.5, h: 6.0}
size-confidence: {w: estimated, h: estimated}
provenance:
  size: >-
    estimated - read off the rear photograph of an SCG50 RRR-LAWM on page 9 of the IOLAN SCG Hardware Installation
    Guide, Expandable Models (5500427-10), where the face is 1278 px for 436 mm (2.93 px/mm) and the rocker reads
    about 45 px by 17 px. Page 12 of the guide shows the same switch and says each inlet has its own. No document
    dimensions it, and the common 21 x 15 snap-in rocker is much larger, so that part is not used.
  marks: >-
    photograph - a circle at the left end and a bar at the right, as printed. Which end is on is not stated by any
    document held, so the part draws the rocker at rest and no state.
elements:
  rocker: {at: [0.8, 0.8], size: [13.9, 4.4], class: button}
skins: [default]
