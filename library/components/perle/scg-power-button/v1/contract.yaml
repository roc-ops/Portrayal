format: 1
kind: component
name: scg-power-button
version: 1.0.0
class: button
profile: networking
description: >-
  The soft power button on the front of a Perle IOLAN SCG console server, a small round metal-ringed button at the
  left of the display. Holding it for six seconds powers the unit off.
size: {w: 6.8, h: 6.8}
size-confidence: {w: drawing, h: drawing}
provenance:
  identity: >-
    IOLAN SCG Hardware Installation Guide, Expandable Models (5500427-10), "Power Button" (page 13): "Pressing the
    power button for 6 seconds will cause the IOLAN to power off." Page 9 labels it "Power Button".
  size: >-
    drawing - the circle in the front view of Appendix D (page 35) reads 30 px across at 4.44 px/mm, 6.8 mm. The
    drawing prints no dimension for it; the figure is read off the drawing against its body width of 436 mm.
  colour: >-
    photo-measured - the labelled front photograph on page 9 shows a metal ring round a dark centre; the colours are
    approximate.
elements:
  button:
    at: [0.0, 0.0]
    size: [6.8, 6.8]
    class: button
skins: [default]
