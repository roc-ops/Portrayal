format: 1
kind: component
name: scg-sd-slot
version: 1.0.0
class: port
profile: networking
unmated: the Micro SD card slot of a Perle IOLAN SCG front; the registry names no Micro SD interface, so none is claimed and no mate is offered, and the card is the user's own
description: >-
  The Micro SD card slot on the front of a Perle IOLAN SCG console server, a thin dark opening printed SD CARD.
  The card is the user's own and holds firmware and configuration files. The slot presents no connector key: the
  registry holds only the full-size SD key, and the guide names a Micro SD card.
size: {w: 14.6, h: 4.5}
size-confidence: {w: drawing, h: drawing}
attrs: {media: micro-sd-card}
provenance:
  identity: >-
    IOLAN SCG Hardware Installation Guide, Expandable Models (5500427-10), page 7 and page 9: "Micro SD card slot
    (SD card provided by the user)", the "SD Card" callout, and the "SD Card" section (page 15): firmware and
    configuration files. The R/U product page lists "Micro SD Card Slot" on every model.
  size: >-
    drawing - the outline of the slot in the front view of Appendix D (page 35) reads 65 px by 20 px at 4.44 px/mm,
    14.6 by 4.5 mm. The drawing prints no dimension for it; the figures are read off the drawing against its body
    width of 436 mm. The drawing's label reads SD CARD.
  depth: >-
    not stated - no document held gives how far a card enters, so the contract states no depth and the part is a
    flat opening in 3D.
  key: >-
    The slot presents no `interface`: the registry's sd-card key is a full-size slot, and no registry key names a
    Micro SD slot, so none is claimed and no card is mated.
elements:
  opening: {at: [0.0, 0.0], size: [14.6, 4.5], class: port}
skins: [default]
