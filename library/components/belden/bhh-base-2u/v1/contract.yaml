format: 1
kind: component
name: bhh-base-2u
version: 1.0.0
class: mechanical
description: >-
  The steel back plate of the Belden BHH192UR 2U horizontal manager seen from the front, the
  full 19 in width with its ears. It is drawn as the well the two rows of molded fingers stand in,
  its floor the front face of the plate.
provenance:
  size: >-
    datasheet - the BHH192UR technical data sheet (revision 0.50, 05-31-2024) gives Rack Units 2U,
    Overall Height 3.5 in (88.9 mm), Overall Width 19.0 and Overall Depth 7.22 in. The plate is the
    whole 482.6 with its ears (a rack-face part is its ears and what hangs off them) and 88.9
    high. The well is 181.9 deep: the 183.4 of the 7.22 in less an estimated 1.5 of sheet where the
    plate stands.
  thickness: >-
    estimated - 1.5, a stand-in: "Material: Steel and Plastic Molded Fingers" is all the data sheet
    says, and no Belden document gives a gauge.
  shading: >-
    estimated - a stand-in for the light a render would give: a 10% white layer over the plate so it
    reads as a plate against the fingers in front of it on the light stage and on the dark one. The
    data sheet states "Black powdercoat finish" and "Color: Black".
size: {w: 482.6, h: 88.9, d: 181.9}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
relief: {wall: '#3c3f43'}
elements:
  floor: {at: [0.0, 0.0], size: [482.6, 88.9], class: bezel}
