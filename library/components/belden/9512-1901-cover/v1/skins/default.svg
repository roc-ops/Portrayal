<svg xmlns="http://www.w3.org/2000/svg" width="450mm" height="38.1mm" viewBox="0 0 450 38.1">
  <!-- the cover from the front: one steel face with a rolled lip along each edge, where the two
       returns close over the finger tips. The lit and shaded bands are semi-transparent over the
       fill, so it reads on a light stage and on a dark one -->
  <rect id="plate" x="0" y="0" width="450" height="38.1" rx="0.6" fill="#4a4f55"/>
  <rect id="face-lit" x="0" y="1" width="450" height="1" fill="#fff" fill-opacity="0.3"/>
  <rect id="face-shade" x="0" y="36.1" width="450" height="1" fill="#000" fill-opacity="0.3"/>
  <rect id="lip-top" x="0" y="0" width="450" height="1" fill="#565b61"/>
  <rect id="lip-bottom" x="0" y="37.1" width="450" height="1" fill="#3a3e43"/>
</svg>
