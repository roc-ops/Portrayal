<svg xmlns="http://www.w3.org/2000/svg" width="14.25mm" height="6mm" viewBox="0 0 14.25 6">
  <!-- an end finger end-on from the front: the root toward the row, the stem at the manager's
       end, and the tip widening toward the row. Lit rim and shaded opening as 9512-1901-finger -->
  <rect id="root" x="0" y="0" width="14.25" height="6" fill="#34383c"/>
  <rect id="stem" x="0" y="0" width="7" height="6" fill="#383c41"/>
  <rect id="tip" x="0" y="0" width="9" height="6" fill="#454a50"/>
  <rect id="opening-shade" x="9" y="0" width="5.25" height="6" fill="#000" fill-opacity="0.35"/>
  <rect id="tip-lit" x="0" y="0" width="9" height="6" fill="#fff" fill-opacity="0.1"/>
  <rect id="tip-rim" x="0.3" y="0.3" width="8.4" height="5.4" rx="0.6" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="0.5"/>
</svg>
