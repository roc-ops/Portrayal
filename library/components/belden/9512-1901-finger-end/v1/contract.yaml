format: 1
kind: component
name: 9512-1901-finger-end
version: 1.0.0
class: mechanical
description: >-
  An end finger of the finger stock of the Belden 9512-1901 1U horizontal manager, seen end-on from
  the front. It is the first or last finger of a row. Its root runs half an opening toward the row.
  Placed turned half a circle at the right end.
provenance:
  size: >-
    estimated - the end finger stands 7.0 wide like the rest, with half an opening (7.25) of root on
    the side toward the row: 14.25 in all. The 6.5 left between it and the end of the 450.0 body is the
    plate's, drawn by the back plate. Read off the data sheet photograph of the 9512-1901, where the
    row ends a little inside the manager's end. No Belden document dimensions a finger. The height,
    6.0, is `9512-1901-finger`'s.
  relief: >-
    estimated - as `9512-1901-finger`: 6 of root, 36 of stem and a curled tip from 36 to 41. The tip is
    2.0 wider on the side toward the row only.
  shading: >-
    estimated - as `9512-1901-finger`: a stand-in for the light a render would give, over the fill.
size: {w: 14.25, h: 6.0}
size-confidence: {w: estimated, h: estimated}
attrs: {material: Steel}
elements:
  root: {at: [0.0, 0.0], size: [14.25, 6.0], class: bezel}
  stem: {at: [0.0, 0.0], size: [7.0, 6.0], class: bezel}
  tip: {at: [0.0, 0.0], size: [9.0, 6.0], class: bezel}
relief:
  features:
    - node: root
      out: 6.0
      color: '#34383c'
      confidence: estimated
      source: the slit ends read off the data sheet photograph against the 2.0 in overall depth
    - node: stem
      out: 36.0
      color: '#383c41'
      confidence: estimated
      source: the finger from the back plate to where its tip curls, read off the same photograph
    - node: tip
      lift: 36.0
      out: 41.0
      color: '#454a50'
      confidence: estimated
      source: the curled tip under the cover's return, read off the same photograph
skins: [default]
