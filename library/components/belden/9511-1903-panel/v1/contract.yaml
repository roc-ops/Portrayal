format: 1
kind: component
name: 9511-1903-panel
version: 1.0.0
class: mechanical
description: >-
  The flat steel panel of the Belden 9511-1903 3U ring manager seen from the front, the full 19 in
  width with its ears. It is drawn as the well its eight saddle rings stand in, its floor the front
  face of the plate.
provenance:
  size: >-
    datasheet - the 9511-1903 technical data sheet (revision 0.27, 05-31-2024) gives Rack Units 3U,
    Overall Width 19 in and Overall Depth 3.0 in (76.2 mm), and TWO HEIGHTS: "Overall Height 3.0 in" in
    its Construction and Dimensions table and 5.25 in in its Variants table. The 3U of its own rack
    units is 5.25 in, and the maker's BHH193UR 3U sheet states 5.25 in too, so 5.25 in (133.35 mm) is
    taken and 3.0 in, which is the depth repeated, is not. The panel is the whole 482.6 with its ears
    (a rack-face part is its ears and what hangs off them). The well is 74.7 deep: the 76.2 of the 3.0
    in less an estimated 1.5 of sheet where the plate stands.
  thickness: >-
    estimated - 1.5, a stand-in: "Material: Steel" is all the data sheet says, and no Belden document
    gives a gauge.
  ears: >-
    estimated - the thumbnail shows the panel's ends as flat tabs. No hole is drawn: no document gives
    their size or place.
  shading: >-
    estimated - a stand-in for the light a render would give: a 10% white layer over the plate so it
    reads as a plate on the light stage and on the dark one. The data sheet states "Black Powdercoat
    Finish" and "Color: Black".
size: {w: 482.6, h: 133.35, d: 74.7}
size-confidence: {w: datasheet, h: estimated, d: datasheet}
relief: {wall: '#3c3f43'}
elements:
  floor: {at: [0.0, 0.0], size: [482.6, 133.35], class: bezel}
skins: [default]
