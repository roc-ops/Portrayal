format: 1
kind: component
name: 9512-1901-base
version: 1.0.0
class: mechanical
description: >-
  The steel back plate of the Belden 9512-1901 1U horizontal manager seen from the front, the full 19
  in width with its ears. It is drawn as the well the two rows of finger stock stand in, its floor
  the front face of the plate.
provenance:
  size: >-
    datasheet - the 9512-1901 technical data sheet (revision 0.48, 05-31-2024) gives Rack Units 1U,
    Overall Height 1.5 in (38.1 mm), Overall Width 19 in and Overall Depth 2.0 in (50.8 mm). The plate
    is the whole 482.6 with its ears (a rack-face part is its ears and what hangs off them) and 38.1
    high, which is under the 44.45 of the rack unit it takes. The well is 49.3 deep: the 50.8 of the 2.0
    in less an estimated 1.5 of sheet where the plate stands.
  thickness: >-
    estimated - 1.5, a stand-in: "Material: Steel" is all the data sheet says, and no Belden document
    gives a gauge.
  ears: >-
    estimated - the photograph shows each ear as a flat tab with two slotted holes. The holes are not
    drawn: no document gives their size or place, and the photograph is too small to measure them.
  shading: >-
    estimated - a stand-in for the light a render would give: a 10% white layer over the plate so it
    reads as a plate against the fingers in front of it on the light stage and on the dark one. The
    data sheet states "Black Powdercoat Finish" and "Color: Black".
size: {w: 482.6, h: 38.1, d: 49.3}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
relief: {wall: '#3c3f43'}
elements:
  floor: {at: [0.0, 0.0], size: [482.6, 38.1], class: bezel}
skins: [default]
