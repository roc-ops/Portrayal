format: 1
kind: component
name: 9511-1904-panel
version: 1.0.0
class: mechanical
description: >-
  The flat steel panel of the Belden 9511-1904 4U ring manager seen from the front, the full 19 in
  width with its ears. It is drawn as the well its eight saddle rings stand in, its floor the front
  face of the plate.
provenance:
  size: >-
    datasheet - the 9511-1904 technical data sheet (revision 0.27, 05-31-2024) gives Rack Units 4U,
    Overall Width 19 in and Overall Depth 3.0 in (76.2 mm), and TWO HEIGHTS: "Overall Height 5.25 in" in
    its Construction and Dimensions table and 6.9 in in its Variants table. The 4U of its own rack
    units is 7.0 in, and the maker's BHH194UR 4U sheet states 7.0 in, so 7.0 in (177.8 mm) is taken. The
    5.25 in is the 3U height (it is the 9511-1903's), and the 6.9 in is 0.1 in under the 4U, as the
    9510-1901's 1.65 in is 0.1 in under its 1U; the maker's 4U figure is preferred. The owner is asked
    to accept the choice. The panel is the whole 482.6 with its ears (a rack-face part is its ears and
    what hangs off them). The well is 74.7 deep: the 76.2 of the 3.0 in less an estimated 1.5 of sheet
    where the plate stands.
  thickness: >-
    estimated - 1.5, a stand-in: "Material: Steel" is all the data sheet says, and no Belden document
    gives a gauge.
  ears: >-
    estimated - the thumbnail shows the panel's ends as flat tabs. No hole is drawn: no document gives
    their size or place.
  shading: >-
    estimated - a stand-in for the light a render would give: a 10% white layer over the plate so it
    reads as a plate on the light stage and on the dark one. The data sheet states "Black Powdercoat
    Finish" and "Color: Black".
size: {w: 482.6, h: 177.8, d: 74.7}
size-confidence: {w: datasheet, h: estimated, d: datasheet}
relief: {wall: '#3c3f43'}
elements:
  floor: {at: [0.0, 0.0], size: [482.6, 177.8], class: bezel}
skins: [default]
