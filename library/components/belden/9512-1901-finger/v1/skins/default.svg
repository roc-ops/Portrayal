<svg xmlns="http://www.w3.org/2000/svg" width="21.5mm" height="6mm" viewBox="0 0 21.5 6">
  <!-- one finger end-on from the front, one pitch wide: the root across half an opening either
       side, the stem, and the wider curled tip in front. The tip is drawn with a lit rim and the
       opening either side of it in shade, so a black finger reads against a black plate -->
  <rect id="root" x="0" y="0" width="21.5" height="6" fill="#34383c"/>
  <rect id="stem" x="7.25" y="0" width="7" height="6" fill="#383c41"/>
  <rect id="tip" x="5.25" y="0" width="11" height="6" fill="#454a50"/>
  <rect id="opening-shade-left" x="0" y="0" width="5.25" height="6" fill="#000" fill-opacity="0.35"/>
  <rect id="opening-shade-right" x="16.25" y="0" width="5.25" height="6" fill="#000" fill-opacity="0.35"/>
  <rect id="tip-lit" x="5.25" y="0" width="11" height="6" fill="#fff" fill-opacity="0.1"/>
  <rect id="tip-rim" x="5.55" y="0.3" width="10.4" height="5.4" rx="0.6" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="0.5"/>
</svg>
