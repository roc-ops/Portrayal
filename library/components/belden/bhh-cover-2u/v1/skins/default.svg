<svg xmlns="http://www.w3.org/2000/svg" width="450mm" height="88.9mm" viewBox="0 0 450 88.9">
  <!-- the cover from the front: one steel panel with a ridge rolled along it, and the edges of the
       two returns that close over the finger heads. The lit and shaded bands are
       semi-transparent over the fill, so it reads on a light stage and on a dark one -->
  <rect id="plate" x="0" y="0" width="450" height="88.9" rx="0.8" fill="#4a4f55"/>
  <rect id="ridge-lit" x="0" y="48" width="450" height="1" fill="#fff" fill-opacity="0.3"/>
  <rect id="ridge-shade" x="0" y="49" width="450" height="1" fill="#000" fill-opacity="0.3"/>
  <rect id="lip-top" x="0" y="0" width="450" height="1.5" fill="#565b61"/>
  <rect id="lip-bottom" x="0" y="87.4" width="450" height="1.5" fill="#3a3e43"/>
</svg>
