<svg xmlns="http://www.w3.org/2000/svg" width="10mm" height="40mm" viewBox="0 0 10 40">
  <!-- one ring from the front: the strap end-on, 10 wide and 40 high. Behind the front leg stand
       the back leg, the top bar and the bottom bar with its upturned hook; they are separate
       plates in 3D and read here as the shading of one bar. The front leg is drawn a lighter
       value than the plate with a lit rim, so the ring reads on a black plate on a light stage and
       on a dark one -->
  <rect id="back" x="0" y="0" width="10" height="40" fill="#4a5058"/>
  <rect id="top" x="0" y="0" width="10" height="3" fill="#59606a"/>
  <rect id="bottom" x="0" y="37" width="10" height="3" fill="#3f444b"/>
  <rect id="hook" x="0" y="29" width="10" height="8" fill="#4a5058"/>
  <rect id="front" x="0" y="0" width="10" height="40" rx="1" fill="#59606a"/>
  <rect id="front-lit" x="0" y="0" width="10" height="40" rx="1" fill="#fff" fill-opacity="0.08"/>
  <rect id="front-rim" x="0.4" y="0.4" width="9.2" height="39.2" rx="1" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="0.6"/>
  <rect id="front-shade" x="0" y="37" width="10" height="3" fill="#000" fill-opacity="0.3"/>
</svg>
