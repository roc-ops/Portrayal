format: 1
kind: component
name: bhh-finger
version: 1.0.0
class: mechanical
description: >-
  One molded finger of the Belden BHH191UR to BHH194UR horizontal managers, seen end-on from
  the front. A plastic finger stands from the back plate toward the hinging cover. Its head widens
  under the cover to leave a narrow neck that a cable is pressed through into the manager.
provenance:
  size: >-
    estimated - the width is one finger pitch, 42.5: ten openings counted across the rack width on
    the technical data sheet's thumbnail of the BHH192UR (the BHH191UR and BHH193UR thumbnails show
    the same row), so eleven fingers and ten openings across the 450.0 between the ears. No Belden
    document dimensions a finger. The openings read about four fifths of the pitch against the
    finger between them, so the finger is taken as 8.5 and the opening as 34.0. The thumbnail draws
    each finger as a pair of rods; one finger here stands for the pair. The height, 10.0, is the
    thickness of the rod deck against the front face on the same thumbnail (about 11 to 13 per cent
    of a 2U face), rounded down so the 1U part keeps a channel.
  relief: >-
    estimated - a finger stands from the back plate to the cover, 160 of stem and a head from 160 to
    168 under the cover's return; the root, the solid band between the plate and the rounded ends of
    the openings, is 16. The data sheet gives the overall depth, 7.22 in, and nothing inside it; the
    openings' ends are read off the thumbnail against that depth. The head is 3.0 wider each side
    than the stem, which leaves a 28.0 neck: nothing dimensions it.
  shading: >-
    estimated - a stand-in for the light a render would give: the head carries a lit rim, and the
    4.0 either side of it is shaded, so a black finger reads against the black back plate on the
    light stage and on the dark one. The rim and the shade are semi-transparent white and black over
    the fill. The data sheet states "Black Powdercoat Finish" for the steel and gives the plastic no
    colour of its own.
size: {w: 42.5, h: 10.0}
size-confidence: {w: estimated, h: estimated}
attrs: {material: Plastic}
elements:
  root: {at: [0.0, 0.0], size: [42.5, 10.0], class: bezel}
  stem: {at: [17.0, 0.0], size: [8.5, 10.0], class: bezel}
  tip: {at: [14.0, 0.0], size: [14.5, 10.0], class: bezel}
relief:
  features:
    - node: root
      out: 16.0
      color: '#34383c'
      confidence: estimated
      source: the opening ends read off the data sheet thumbnail against the 7.22 in overall depth
    - node: stem
      out: 160.0
      color: '#383c41'
      confidence: estimated
      source: the finger from the back plate to where its head widens, read off the same thumbnail
    - node: tip
      lift: 160.0
      out: 168.0
      color: '#454a50'
      confidence: estimated
      source: the head under the cover's return, read off the same thumbnail
skins: [default]
