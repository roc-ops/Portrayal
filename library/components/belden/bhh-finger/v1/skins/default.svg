<svg xmlns="http://www.w3.org/2000/svg" width="42.5mm" height="10mm" viewBox="0 0 42.5 10">
  <!-- one finger end-on from the front, one pitch wide: the root across half an opening either
       side, the stem, and the wider head in front. The head is drawn with a lit rim and the
       opening either side of it in shade, so a black finger reads against a black plate -->
  <rect id="root" x="0" y="0" width="42.5" height="10" fill="#34383c"/>
  <rect id="stem" x="17" y="0" width="8.5" height="10" fill="#383c41"/>
  <rect id="tip" x="14" y="0" width="14.5" height="10" fill="#454a50"/>
  <rect id="opening-shade-left" x="0" y="0" width="14" height="10" fill="#000" fill-opacity="0.35"/>
  <rect id="opening-shade-right" x="28.5" y="0" width="14" height="10" fill="#000" fill-opacity="0.35"/>
  <rect id="head-lit" x="14" y="0" width="14.5" height="10" fill="#fff" fill-opacity="0.1"/>
  <rect id="head-rim" x="14.4" y="0.4" width="13.7" height="9.2" rx="0.8" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="0.6"/>
</svg>
