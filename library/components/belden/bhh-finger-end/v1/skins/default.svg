<svg xmlns="http://www.w3.org/2000/svg" width="25.5mm" height="10mm" viewBox="0 0 25.5 10">
  <!-- an end finger end-on from the front: the root toward the row, the stem at the manager's
       end, and the head widening toward the row. Lit rim and shaded opening as bhh-finger -->
  <rect id="root" x="0" y="0" width="25.5" height="10" fill="#34383c"/>
  <rect id="stem" x="0" y="0" width="8.5" height="10" fill="#383c41"/>
  <rect id="tip" x="0" y="0" width="11.5" height="10" fill="#454a50"/>
  <rect id="opening-shade" x="11.5" y="0" width="14" height="10" fill="#000" fill-opacity="0.35"/>
  <rect id="head-lit" x="0" y="0" width="11.5" height="10" fill="#fff" fill-opacity="0.1"/>
  <rect id="head-rim" x="0.4" y="0.4" width="10.7" height="9.2" rx="0.8" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="0.6"/>
</svg>
