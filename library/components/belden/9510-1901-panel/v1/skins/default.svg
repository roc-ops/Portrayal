<svg xmlns="http://www.w3.org/2000/svg" width="482.6mm" height="41.91mm" viewBox="0 0 482.6 41.91">
  <!-- the panel from the front, ears and all: one flat sheet. The rings are separate parts
       screwed to it. Each ear has two slotted holes, 12 by 5, 12 in from the end and 32 apart -->
  <rect id="floor" x="0" y="0" width="482.6" height="41.91" fill="#2a2d31"/>
  <rect id="floor-lit" x="0" y="0" width="482.6" height="41.91" fill="#fff" fill-opacity="0.1"/>
  <rect id="ear-hole-left-top" x="6" y="2.46" width="12" height="5" rx="2.5" fill="#0a0b0c"/>
  <rect id="ear-hole-left-bottom" x="6" y="34.46" width="12" height="5" rx="2.5" fill="#0a0b0c"/>
  <rect id="ear-hole-right-top" x="464.6" y="2.46" width="12" height="5" rx="2.5" fill="#0a0b0c"/>
  <rect id="ear-hole-right-bottom" x="464.6" y="34.46" width="12" height="5" rx="2.5" fill="#0a0b0c"/>
</svg>
