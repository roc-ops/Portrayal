format: 1
kind: component
name: 9510-1901-panel
version: 1.0.0
class: mechanical
description: >-
  The flat steel panel of the Belden 9510-1901 1U ring panel seen from the front, the full 19 in
  width with its ears. It is drawn as the well its six saddle rings stand in, its floor the front
  face of the plate.
provenance:
  size: >-
    datasheet - the 9510-1901 technical data sheet (revision 0.57, 05-31-2024) gives Rack Units 1U,
    Overall Height 1.65 in (41.91 mm), Overall Width 19 in and Overall Depth 3.0 in (76.2 mm). The
    panel is the whole 482.6 with its ears (a rack-face part is its ears and what hangs off them) and
    41.91 high, under the 44.45 of the rack unit it takes. The well is 74.7 deep: the 76.2 of the 3.0 in
    less an estimated 1.5 of sheet where the plate stands.
  thickness: >-
    estimated - 1.5, a stand-in: "Material: Steel" is all the data sheet says, and no Belden document
    gives a gauge.
  ears: >-
    estimated - the photograph shows each ear as the flat end of the panel with a slotted hole. The holes
    are not drawn: no document gives their size or place.
  flange: >-
    not drawn - the photograph shows a narrow flange folded back along the panel's top edge. No document
    dimensions it, and the data sheet's 3.0 in is the overall projection, so nothing is added behind the
    plate for it.
  shading: >-
    estimated - a stand-in for the light a render would give: a 10% white layer over the plate so it
    reads as a plate on the light stage and on the dark one. The data sheet states "Black Powdercoat
    Finish" and "Color: Black".
size: {w: 482.6, h: 41.91, d: 74.7}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
relief: {wall: '#3c3f43'}
elements:
  floor: {at: [0.0, 0.0], size: [482.6, 41.91], class: bezel}
skins: [default]
