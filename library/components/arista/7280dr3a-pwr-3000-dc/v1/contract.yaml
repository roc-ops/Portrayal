format: 1
kind: module
name: 7280dr3a-pwr-3000-dc
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 3000 W DC power supply of the Arista 7280DR3A-54, PWR-3001-DC-RED (forward airflow, red
  handle). It is a 1RU module, 73.5 mm wide. It has the AC supply's round fan guard and red
  diagonal handle, and a terminal block in place of its inlet. The block is drawn with the two poles the
  guide's section 4.4.2.2 names, negative (-48V) and positive (RTN). The protective earth terminal
  is on the other side of the module and is not drawn.
size: {w: 73.5, h: 40.0}
size-confidence: {w: datasheet, h: estimated}
part-numbers:
  PWR-3001-DC-RED: {part: PWR-3001-DC-RED}
attrs:
  power-output-w: 3000
  input: dc
  inlet: dc-terminal
  airflow: front-to-back
  input-note: '-48 to -60 VDC, 70 A per the guide (69 A max at -48 V per the data sheet)'
provenance:
  size: >-
    datasheet for the width, estimated for the height, as the AC supply (arista/7280dr3a-pwr-3000-ac):
    "PWR-3001-DC-RED  Arista PSU, 1RU, DC/DC, 3000W, FORWARD, 73.5MM", 1RU.
  part-number: >-
    datasheet - ordering information for the 7280DR3A-54: "PWR-3001-DC-RED  Arista PSU, 1RU,
    DC/DC, 3000W, FORWARD, 73.5MM". The quick start guide's table 3 lists PWR-3001-DC and table 4
    gives it as the supported DC supply of the DR3A-54 (and of its K and M forms). The data
    sheet lists no DCS-7280DR3A-54 SKU for a DC build: the DC supply is a spare, and the "#"
    configurable orders take it.
  power-output: >-
    datasheet - the "3000W" of the ordering description, and "Output Power 3000 W" in the power
    supply table. An output.
  input: >-
    guide and datasheet, which differ in the current and the wire. Guide table 3: PWR-3001-DC
    "-48 to -60 VDC, 70 A"; the data sheet's power supply table: "Max Input Current 69 A Max
    (-48 V)", efficiency 94 percent. The two are different measures (a rating over a range and a
    maximum at -48 V) and neither is a power figure; both are kept in `input-note`, the guide's
    first. Table 7 gives the wire as 1 to 2 AWG (50 to 35 mm2) and the tightening torque as
    4.0 N-m (35 in-lbs); the data sheet reads "Input Connector AWG #3 Max", a different
    statement of the largest conductor (3 AWG is 26.7 mm2, smaller than table 7's range). The
    guide's wire is the one a lug takes and is the one stated.
  face: >-
    estimated, AND NOT FROM THIS MODULE. The guide holds no picture of a PWR-3001-DC. Its figure
    4-5 shows the PWR-1900-DC and PWR-500-DC, and its figure 4-7 a connection example. The guard,
    handle, latch and lamp are drawn as the AC supply's (the figure D-4 art, the generic module
    of the same housing), and the terminal block is a plain two-pole block that follows figure
    4-7's -48V and RTN terminals. The real terminal arrangement (table 7 note 2: "twin #10 studs
    spaced for dual-hole lug with 5/8 inch hole spacing") is not drawn and is a gap on the device.
  airflow: >-
    datasheet - the part number's RED and "FORWARD" airflow; no blue DC supply is listed for the
    DR3A-54.
  handle-finish: >-
    As the AC supply: a field, `handle-finish`, default `#a32a38`.
