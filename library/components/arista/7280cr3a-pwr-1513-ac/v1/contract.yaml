  handle: {at: [1.0, 1.0], size: [41.0, 38.0], class: handle}
  latch: {at: [68.0, 10.4], size: [5.0, 12.8], class: latch}
  status: {at: [66.4, 2.6], size: [4.8, 4.8], class: led, states: ['off', 'ok', 'fault']}
fields:
  handle-finish: {label: Handle colour, type: text, default: '#a32a38'}
parts:
