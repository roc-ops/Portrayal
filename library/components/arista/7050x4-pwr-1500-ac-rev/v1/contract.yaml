format: 1
kind: module
name: 7050x4-pwr-1500-ac-rev
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 1500 W AC power supply of the Arista 7050DX4-32S, 7050PX4-32S and 7050CX4M-48D8 for rear-to-front
  air, PWR-1512-AC-BLUE (reverse airflow, blue handle). It is the PWR-1512-AC-RED housing with the fan
  turned the other way. It is a 1RU module, 73.5 mm wide. A round fan guard with a blue diagonal handle
  is at the left. An IEC C14 inlet, a latch and a status lamp are at the right.
size: {w: 73.5, h: 40.0}
size-confidence: {w: datasheet, h: estimated}
part-numbers:
  PWR-1512-AC-BLUE: {part: PWR-1512-AC-BLUE}
attrs:
  power-output-w: 1500
  input: ac
  inlet: c14
  airflow: back-to-front
  input-note: '200 - 240 VAC, 9.6 A, 50/60 Hz'
provenance:
  size: >-
    datasheet for the width, estimated for the height, as arista/7050x4-pwr-1500-ac: the 7050X4
    Series Data Sheet (03-0057-27) lists "PWR-1512-AC-BLUE  Arista PSU, 1RU, DC/DC, 1500W, REVERSE,
    73.5MM" (the description says DC/DC; the part number and the power supply table say AC).
  part-number: >-
    datasheet - optional components and spares, as above, fitted to the -R (rear-to-front air, 2xAC)
    part numbers of the DX4-32S, PX4-32S and CX4M-48D8 (the DX4M-32S has no -R part number).
  power-output: >-
    datasheet - the "1500W" of the ordering description. An output.
  input: >-
    datasheet - as arista/7050x4-pwr-1500-ac: guide table 3 and the power supply table, which lists one
    PWR-1512-AC column for both airflow builds.
  airflow: >-
    datasheet - the part number's BLUE and "REVERSE". The guide's appendix D says "Handle or bezel
    color indicates airflow direction" and does not name the colours; the library's convention (red
    air exit, blue air inlet) is as arista/7280cr3-pwr-1000-ac-rev.
  inlet: >-
    datasheet - the same IEC 60320 C14 connector as the red build.
  face: >-
    estimated, AND NOT FROM THIS MODULE. No picture of a blue PWR-1512 is held. It is the red module
    with the handle and the centre disc changed. Which way the blades turn is not drawn.
  handle-finish: >-
    The blue of the handle is a field, `handle-finish`, default `#3d7bd6`, the library's blue for a
    back-to-front handle.
  power: >-
    No supply figure other than the rating is stated; nothing is written.
