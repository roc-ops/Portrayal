format: 1
kind: module
name: 7280cr3-pwr-1000-ac-rev
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 1000 W AC power supply of the Arista 7280CR3-32D4 for rear-to-front air, PWR-1011-AC-BLUE
  (reverse airflow, blue handle). It is the PWR-1011-AC-RED housing with the fan turned the other
  way. It is a 1RU module, 73.5 mm wide. A round fan guard with a blue diagonal handle is at the
  left. An IEC C14 inlet, a latch and a status lamp are at the right. Two seat at the ends of the
  rear. The pair is 1+1 redundant and hot-swappable.
size: {w: 73.5, h: 40.0}
size-confidence: {w: datasheet, h: estimated}
part-numbers:
  PWR-1011-AC-BLUE: {part: PWR-1011-AC-BLUE}
attrs:
  power-output-w: 1000
  input: ac
  inlet: c14
  airflow: back-to-front
  input-note: '100 - 120 / 200 - 240 VAC, 12 / 6 A, 50/60 Hz'
provenance:
  size: >-
    datasheet for the width, estimated for the height, as arista/7280cr3-pwr-1000-ac: the data
    sheet (03-0045-59) describes the part as "PWR-1011-AC-BLUE  Arista PSU, 1RU, AC/DC, 1000W,
    REVERSE, 73.5MM".
  part-number: >-
    datasheet - ordering information for the 7280CR3-32D4: "PWR-1011-AC-BLUE  Arista PSU, 1RU,
    AC/DC, 1000W, REVERSE, 73.5MM", fitted to the -R (rear to front air, 2 x AC) part numbers.
  power-output: >-
    datasheet - the "1000W" of the ordering description. An output.
  input: >-
    datasheet - as arista/7280cr3-pwr-1000-ac: guide table 3 and the data sheet's power supply
    table, which lists one PWR-1011 AC column for both airflow builds.
  airflow: >-
    datasheet - the part number's BLUE and "REVERSE" airflow. The guide's section 2.1 says a blue
    handle marks an air-inlet module: air enters at the rear and leaves at the port side.
  inlet: >-
    datasheet - the same IEC 60320 C14 input connector as the red build; the data sheet lists one
    power supply table row for both.
  face: >-
    estimated, AND NOT FROM THIS MODULE. The guide holds no picture of a PWR-1011-AC-BLUE. Figure
    D-2 draws the red module, and the blue one is drawn as the same housing with only the handle
    changed, which is what the guide's note "Handle or bezel color indicates airflow direction"
    describes. Which way the fan blades turn is not drawn.
  handle-finish: >-
    The blue of the handle is a field, `handle-finish`, default `#3d7bd6`, the library's blue for a
    back-to-front handle (the guide says only "Blue Handle: Air Inlet module").
skins: [default]
