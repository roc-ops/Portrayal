format: 1
kind: module
name: 7050x4-pwr-1500-ac
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 1500 W AC power supply of the Arista 7050DX4-32S, 7050PX4-32S, 7050DX4M-32S and 7050CX4M-48D8,
  PWR-1512-AC-RED (forward airflow, red handle). It is a 1RU module, 73.5 mm wide. A round fan guard
  with a red diagonal handle is at the left. An IEC C14 inlet, a latch and a status lamp are at the
  right. Two seat in the rear, 1+1 redundant and hot-swappable.
size: {w: 73.5, h: 40.0}
size-confidence: {w: datasheet, h: estimated}
part-numbers:
  PWR-1512-AC-RED: {part: PWR-1512-AC-RED}
attrs:
  power-output-w: 1500
  input: ac
  inlet: c14
  airflow: front-to-back
  input-note: '200 - 240 VAC, 9.6 A, 50/60 Hz'
provenance:
  size: >-
    datasheet for the width, estimated for the height. The 7050X4 Series Data Sheet (03-0057-27,
    Aug 27th, 2025) describes the part as "PWR-1512-AC-RED  Arista PSU, 1RU, AC/DC, 1500W, FORWARD,
    73.5MM": 73.5 is its width. The 1RU height is 40 mm to within a pixel of the guide's figure D-1
    (a 552 px raster at 1.23 px/mm), as arista/7280cr3-pwr-1000-ac found for the same housing.
  part-number: >-
    datasheet - ordering information, optional components and spares: "PWR-1512-AC-RED  Arista PSU,
    1RU, AC/DC, 1500W, FORWARD, 73.5MM". The 7050X4 Quick Start Guide (DOC-06569-02) table 3 lists
    the supply as PWR-1512-AC and table 4 gives it as the supported AC supply of the DX4-32S,
    PX4-32S, DX4M-32S and CX4M-48D8. Its section 4.4.1 and table 12 name "PWR-1511-AC" where table
    3 says PWR-1512-AC; the part number written here is the datasheet's and table 3's.
  power-output: >-
    datasheet - the "1500W" of the ordering description and "Output Power 1500W" in the power
    supply table. An output, because a supply provides power; the switch's own draw (guide table 4)
    is the switch's figure.
  input: >-
    datasheet - guide table 3: PWR-1512-AC "200 - 240 VAC 9.6 A 50/60 Hz"; the datasheet's power
    supply table: 200-240 V AC, typical input current 9.6 A, 93 percent efficiency (Platinum), IEC
    60320 C14 input connector.
  airflow: >-
    datasheet - the part number's RED and "FORWARD". The guide's appendix D says "Handle or bezel
    color indicates airflow direction". The reverse build is arista/7050x4-pwr-1500-ac-rev.
  inlet: >-
    datasheet - "Input Connector IEC 60320 C14" for the PWR-1512-AC, and the guide's appendix B
    "IEC-320/C13-C14, 13 A, 250 V, 2 meter" cords.
  face: >-
    estimated, AND NOT FROM THIS MODULE. The 7050X4 guide's figure D-1 and D-2 draw this housing
    (round fan guard with a diagonal handle, a C14 inlet, a latch and a lamp) at about 1.2 px/mm;
    the drawing is the one arista/7280cr3-pwr-1000-ac makes of the same 73.5 mm 1RU module. No
    document says the 1500 W supply differs from the 1000 W one in outline. The lamp is the module's
    status lamp (guide figure A-4, table 12: green normal, yellow fault, off no input).
  handle-finish: >-
    The red of the handle is a field, `handle-finish`, default `#a32a38`, read off the figure.
  power: >-
    The guide's table 4 gives the switch's draw and no supply figure other than the rating. Nothing
    is written for the supply's own loss.
skins: [default]
