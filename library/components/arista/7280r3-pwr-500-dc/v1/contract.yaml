format: 1
kind: module
name: 7280r3-pwr-500-dc
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 500 W DC power supply of the Arista 7280SR3-48YC8 and 7280SR3-40YC6, PWR-511-DC-RED (forward
  airflow, red handle). It is a 1RU module, 73.5 mm wide, with a red diagonal handle on the fan
  guard and a terminal block in place of an inlet. The block has the two poles the guide's section
  4.4.2.2 names, negative (-48V) and positive (RTN). The protective earth terminal is on the other
  side of the module and is not drawn.
size: {w: 73.5, h: 40.0}
size-confidence: {w: datasheet, h: estimated}
part-numbers:
  PWR-511-DC-RED: {part: PWR-511-DC-RED}
attrs:
  power-output-w: 500
  input: dc
  inlet: dc-terminal
  airflow: front-to-back
  input-note: '-48 to -60 VDC, 13 A'
provenance:
  size: >-
    datasheet for the width, estimated for the height, as arista/7280r3-pwr-500-ac: the data sheet
    (03-0045-59, August 11th, 2025) describes the part as "PWR-511-DC-RED  Arista PSU, 1RU, DC,
    500W, FORWARD, 73.5mm".
  part-number: >-
    datasheet - ordering information for the 7280SR3-48YC8 and 7280SR3-40YC6: "PWR-511-DC-RED
    Arista PSU, 1RU, DC, 500W, FORWARD, 73.5mm". It is a spare: the "-F" and "-R" SKUs are "2 x AC".
  power-output: >-
    datasheet - the "500W" of the ordering description and the "Output Power 500W" row of the data
    sheet's power supply table. An output.
  input: >-
    datasheet - guide table 3: PWR-511-DC "-48 to -60 VDC, 13 A"; the data sheet's power supply
    table gives -48 to -60 V DC, 11.8 A max at -48 V, 92 percent efficiency and an AWG #14 maximum
    input connector. The two currents (13 A and 11.8 A) are a rating and a maximum input at -48 V.
  face: >-
    estimated, AND NOT FROM THIS MODULE. The guide holds no flat picture of a PWR-511-DC. It is
    drawn as the library's other DC supplies (arista/7280cr3-pwr-1000-dc): the AC supply's housing
    with a plain two-pole terminal block in place of the inlet. The guide's isometric figures show
    a DC supply with a terminal cover and the protective earth terminal on the far side.
  airflow: >-
    datasheet - the part number's RED and "FORWARD" airflow; the guide's section 2.1 gives red as
    the colour of an air-exit module.
  handle-finish: >-
    The red of the handle is a field, `handle-finish`, default `#a32a38`.
