format: 1
kind: module
name: 7280r3-pwr-1500-ac
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 1500 W AC power supply of the Arista 7280PR3-24 and 7280DR3-24, PWR-1511-AC-RED (forward
  airflow, red handle). It is a 1RU module, 73.5 mm wide. A round fan guard with a red diagonal
  handle is at the left. An IEC C14 inlet, a latch and a status lamp are at the right. Two seat at
  the ends of the rear. The pair is 1+1 redundant and hot-swappable.
size: {w: 73.5, h: 40.0}
size-confidence: {w: datasheet, h: estimated}
part-numbers:
  PWR-1511-AC-RED: {part: PWR-1511-AC-RED}
attrs:
  power-output-w: 1500
  input: ac
  inlet: c14
  airflow: front-to-back
  input-note: '200 - 240 VAC, 9.6 A, 50/60 Hz'
provenance:
  size: >-
    datasheet for the width, estimated for the height. The 7280R3 Series Data Sheet (03-0045-59,
    August 11th, 2025) describes the part as "PWR-1511-AC-RED  Arista PSU, 1RU, AC/DC, 1500W,
    FORWARD, 73.5MM": 73.5 is its width. The 1RU module height is taken as 40.0, as for the
    library's other 73.5 mm supplies (arista/7280cr3-pwr-1000-ac, measured off figure D-2 of the
    7280R3 Series Quick Start Guide, DOC-07041-01).
  part-number: >-
    datasheet - ordering information for the 7280PR3-24 and 7280DR3-24: "PWR-1511-AC-RED  Arista
    PSU, 1RU, AC/DC, 1500W, FORWARD, 73.5MM". The guide's table 3 lists the supply as PWR-1511-AC
    and table 4 gives it as the supported AC supply of the PR3-24, PR3K-24, DR3-24 and DR3K-24. No
    blue (reverse) PWR-1511 is listed.
  power-output: >-
    datasheet - the "1500W" of the ordering description and the "Output Power 1500W" row of the data
    sheet's power supply table. An output.
  input: >-
    datasheet - guide table 3: PWR-1511-AC "200 - 240 VAC 9.6 A 50/60 Hz"; the data sheet's power
    supply table gives 200-240 V AC, typical input current 9.6 A, 93 percent efficiency (Platinum)
    and an IEC 60320 C14 input connector (as the data sheet prints it for this column).
  airflow: >-
    datasheet - the part number's RED and "FORWARD" airflow; the guide's section 2.1 gives red as
    the colour of an air-exit module.
  face: >-
    estimated, AND NOT FROM THIS MODULE. No picture of a PWR-1511 is held: the guide's rear figures
    draw one generic supply, which is the 1RU module drawn for arista/7280cr3-pwr-1000-ac. This
    module is drawn as that supply.
  handle-finish: >-
    The red of the handle is a field, `handle-finish`, default `#a32a38`, read off figure D-2.
skins: [default]
states: [absent]
elements:
  handle: {at: [1.0, 1.0], size: [41.0, 38.0], class: handle}
  latch: {at: [68.0, 10.4], size: [5.0, 12.8], class: latch}
  status: {at: [66.4, 2.6], size: [4.8, 4.8], class: led, states: ['off', 'ok', 'fault']}
fields:
  handle-finish: {label: Handle colour, type: text, default: '#a32a38'}
parts:
