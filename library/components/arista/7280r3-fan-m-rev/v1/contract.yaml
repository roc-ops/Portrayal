format: 1
kind: module
name: 7280r3-fan-m-rev
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  The 1RU enhanced-speed hot-swap fan module of the Arista 7280R3 small chassis for rear-to-front
  air, FAN-7011M-R (reverse airflow, blue). It is the FAN-7011M-F housing with the rotor turned
  the other way. The module has a blue frame and a honeycomb grille. A grey release rail with a
  slider runs down the middle, with a blue label tab at its top. A status lamp is at the bottom
  centre. Two of them fill the rear between the management ports and the right power supply. The
  module is hot-swappable, and its release is the slider.
size: {w: 78.6, h: 38.6}
size-confidence: {w: estimated, h: estimated}
part-numbers:
  FAN-7011M-R: {part: FAN-7011M-R}
attrs:
  airflow: back-to-front
  role: fan
provenance:
  size: >-
    estimated, as arista/7280r3-fan-m: the guide's figure D-1 draws the red module, and the blue
    one is the same housing.
  part-number: >-
    datasheet - the 7280R3 Series Data Sheet (03-0045-59, August 11th, 2025), ordering
    information for the 7280SR3-48YC8 and the 7280SR3-40YC6: "FAN-7011M-R  Spare fan module for
    Arista 7000 Series 1RU Enhanced Fan Speed (rear-to-front airflow)". The 7280CR3-36S takes the
    FAN-7011H-R for rear-to-front air (arista/7280cr3-fan-rev), not this module.
  airflow: >-
    datasheet - the part number's "rear-to-front airflow". The guide, section 2.1, says a blue
    handle marks an air-inlet module.
  face: >-
    estimated, AND NOT FROM THIS MODULE. No picture of a FAN-7011M-R is held. It is drawn as the
    red module of figure D-1 with the frame and tab changed, which is what the guide's note
    "Handle or bezel color indicates airflow direction" describes. The lamp, states and positions
    are as arista/7280r3-fan-m.
  handle-finish: >-
    The blue of the frame is a field, `handle-finish`, default `#3d7bd6`, the library's blue for a
    back-to-front handle.
  power: >-
    NOT STATED. Neither the quick start guide nor the data sheet gives a power draw for the
    FAN-7011M, so none is written and the lint warning for a fan without one stands.
