format: 1
kind: component
name: 7010tx-dc-terminal
version: 1.1.0
class: inlet
behaviour: mounts
profile: networking
description: >-
  The -48 V DC input of an Arista 7010TX-48-DC: a two-pole barrier terminal block under a clear
  protective cover, with a clear guard along each side held by dark clips. The upper screw is the
  negative pole and the lower the positive (RTN) pole, as the printing beside it reads. Each of the
  switch's two internal power supplies has one, PS1 at the left of the rear view and PS2 at the right.
  The guide says the wire is a 14 to 18 AWG ring lug (Table 4), so each pole is a screw a lug lands on.
size: {w: 42.4, h: 27.4}
size-confidence: {w: estimated, h: estimated}
attrs: {media: dc-terminal}
provenance:
  size: >-
    estimated - read off the datasheet's straight-on rear photograph of the 7010TX-48-DC (7010X Series Data
    Sheet 03-0052-14, 5251 px across the 439 mm body, 11.96 px per mm). The guards and the block read 8.4
    to 50.8 mm across and 11.2 to 38.6 down on the left supply and 388.4 to 430.8 on the right one, so
    the two are the same part about the chassis centre. No document dimensions it.
  poles: >-
    estimated - read off the same photograph: the upper screw centre at 19.7 mm from the part's left edge and
    8.3 down, the lower one at the same x and 17.6 down, a 9.3 mm pitch. The guide's Figure D-4 labels
    them -48V (upper) and RTN (lower); Table 4 gives the wire as 14 to 18 AWG, ring lug, torque 0.8 N m.
  voltage: >-
    NOT STATED. Arista 7010 Series 1RU Quick Start Guide, Table 3 (page 4), prints "-40 to -72 VDC" for the DC
    models: a range, and a port states one nominal, so the port states none.
  rating: >-
    NOT STATED. Table 3 (page 4) prints "2.5 A" beside the DC models without saying whether it is per switch
    or per power supply, so the port states no current.
  awg: >-
    NOT STATED. Table 4 (page 21) prints the wire as "14 to 18" AWG for the DCS-7010TX-48-DC: a range, not a list
    of sizes, so the port states none.
  side: >-
    NOT STATED. No document says which of the two power supplies is feed A, so the port states no side.
  screws: >-
    each terminal screw is the composed common/terminal-screw-34@1, as common/dc-terminal-24@1 composes
    it. The head size is that part's estimate; the photograph shows a larger slotted screw with a
    washer, so the head is smaller than the real one.
  cover: >-
    estimated - the clear cover and the side guards are drawn as a translucent pale layer over the
    darker block, as the photograph shows them; their outline is read off it, the thickness is not
    known.
elements:
  pole-1: {at: [16.2, 4.8], size: [7.0, 7.0], class: terminal}
  pole-2: {at: [16.2, 14.1], size: [7.0, 7.0], class: terminal}
parts:
  - {ref: common/terminal-screw-34@1, id: lug-1, at: [18.0, 6.6]}
  - {ref: common/terminal-screw-34@1, id: lug-2, at: [18.0, 15.9]}
dc:
  ports:
    - id: input
      direction: input
      poles:
        - {role: batt, slot: lug-1}
        - {role: rtn, slot: lug-2}
      source: {poles: poles}
connection-points:
  dc-in: {at: [21.2, 13.7], direction: front}
skins: [default]
