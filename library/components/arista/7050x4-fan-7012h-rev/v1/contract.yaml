name: 7050x4-fan-7012h-rev
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  The 2RU high-speed hot-swap fan module of the Arista 7050CX4M-48D8 for rear-to-front air, spare
  FAN-7012H-BLUE (reverse airflow, blue). It is the FAN-7012H-RED housing with the rotor turned the other
  way. A blue-framed module with a honeycomb grille, a grey release rail running down its middle with a
  slider and a blue tab at its top, and a status lamp in its lower right corner. Four of them fill the
  2RU rear beside the two power supplies.
size: {w: 79.6, h: 81.5}
size-confidence: {w: estimated, h: estimated}
