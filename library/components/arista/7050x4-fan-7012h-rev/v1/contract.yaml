  FAN-7012H-BLUE: {part: FAN-7012H-BLUE}
attrs:
  airflow: back-to-front
  role: fan
provenance:
  size: >-
    estimated, as arista/7280dr3a-fan: figure D-2 of the 7050X4 Quick Start Guide (DOC-06569-02), a
    565 px raster at 1.19 px/mm (the 525 px between the chassis edges over the 440 mm body), draws the
    same four-fan 2RU rear as the 7280R3A guide's figure D-3; its four frames measure 97 px wide on a
    102 px pitch, 81 mm on an 85.5 mm pitch, and 96 to 99 px tall. No document dimensions the module.
  part-number: >-
    datasheet - the 7050X4 Series Data Sheet (03-0057-27, Aug 27th, 2025), optional components and
    spares: "FAN-7012H-BLUE  Spare fan module for Arista 7000 Series 2RU High Speed Fan (rear-to-front
    airflow)", and the model comparison's "Fan Tray" row for the 7050CX4M-48D8 ("FAN-7012H-RED /
    FAN-7012H-BLUE"). The 7280R3A data sheet lists the same spare.
  airflow: >-
    datasheet - the part number's BLUE and "rear-to-front airflow". The guide's appendix D says handle
    or bezel colour indicates airflow direction; the library's blue marks an air-inlet module.
  face: >-
    estimated, AND NOT FROM THIS MODULE. No picture of a FAN-7012H-BLUE is held; figure D-2 draws the
    red module and the blue one is the same housing with the frame and tab changed. The lamp and
    positions are arista/7280dr3a-fan's (guide figure A-3, table 11).
  handle-finish: >-
    The blue of the frame is a field, `handle-finish`, default `#3d7bd6`.
  power: >-
    NOT STATED. Neither the guide nor the datasheet gives a power draw for the FAN-7012H, so none is
    written and the lint warning for a fan without one stands.
