format: 1
kind: module
name: 7050x4-pwr-1500-dc-rev
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 1500 W DC power supply of the Arista 7050DX4-32S, 7050PX4-32S and 7050CX4M-48D8 for rear-to-front
  air, PWR-1511-DC-BLUE (reverse airflow, blue handle). It is the PWR-1511-DC-RED housing with the fan
  turned the other way, with a blue diagonal handle and the same two-pole terminal block.
size: {w: 73.5, h: 40.0}
size-confidence: {w: datasheet, h: estimated}
part-numbers:
  PWR-1511-DC-BLUE: {part: PWR-1511-DC-BLUE}
attrs:
  power-output-w: 1500
  input: dc
  inlet: dc-terminal
  airflow: back-to-front
  input-note: '-48 to -60 VDC, 38.0 A'
provenance:
  size: >-
    datasheet for the width, estimated for the height, as arista/7280r3-pwr-1500-dc (the same part number's red module): the 7050X4 Series
    Data Sheet (03-0057-27) lists "PWR-1511-DC-BLUE  Arista PSU, 1RU, DC/DC, 1500W, REVERSE, 73.5MM".
  part-number: >-
    datasheet - optional components and spares, as above. The datasheet lists no DC SKU of the switch;
    the supply is a spare and the "#" configurable orders take it.
  power-output: >-
    datasheet - the "1500W" of the ordering description. An output.
  input: >-
    datasheet - the 7050X4 guide, where arista/7280r3-pwr-1500-dc (the red module) carries the 7280R3
    guide's current: guide table 3, "-48 to -60 VDC, 38.0 A", and the power
    supply table's "35.2A Max (-48V)".
  face: >-
    estimated, AND NOT FROM THIS MODULE. No picture of a blue PWR-1511-DC is held. It is the red module
    with the handle and the centre disc changed, as arista/7280cr3-pwr-1000-dc-rev draws its own.
  airflow: >-
    datasheet - the part number's BLUE and "REVERSE".
  handle-finish: >-
    A field, `handle-finish`, default `#3d7bd6`.
  power: >-
    No supply figure other than the rating is stated; nothing is written.
skins: [default]
states: [absent]
