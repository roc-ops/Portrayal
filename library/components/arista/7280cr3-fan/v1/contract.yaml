format: 1
kind: module
name: 7280cr3-fan
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  The 1RU high-speed hot-swap fan module of the Arista 7280CR3-32D4, spare FAN-7011H-F
  (front-to-rear airflow, red). The module has a red frame and a honeycomb grille. A grey release
  rail with a slider runs down the middle, with a red label tab at its top. A status lamp is at
  the bottom centre. Three of them fill the rear between the management ports and the right
  power supply. The module is hot-swappable, and its release is the slider.
size: {w: 78.6, h: 38.6}
size-confidence: {w: estimated, h: estimated}
part-numbers:
  FAN-7011H-F: {part: FAN-7011H-F}
attrs:
  airflow: front-to-back
  role: fan
provenance:
  size: >-
    estimated - read off the rear panel figure D-2 of the 7280R3 Series Quick Start Guide
    (DOC-07041-01) at 1.24 px/mm (the 545 px between the figure's chassis edges over the 440 mm
    body, which the data sheet gives as 43.99 cm); the figure is a 552 px raster, so one pixel is
    0.8 mm. The three red frames measure 97 px wide (78.3 mm) on a 103 to 104 px pitch (83.3 mm),
    and 144 px tall in a 3-times enlargement, 38.7 mm. No document dimensions the module.
  part-number: >-
    datasheet - the 7280R3 Series Data Sheet (03-0045-59, August 11th, 2025), ordering
    information for the 7280CR3-32D4: "FAN-7011H-F  Spare fan module for Arista 7000 Series 1RU
    High Speed Fan (front-to-rear airflow)", and "Fan Tray FAN-7011H" in the model comparison
    table, with "Hot-swappable Fans 3 (N+1 redundant)".
  airflow: >-
    datasheet - the part number's "front-to-rear airflow". The guide, section 2.1, says a red
    handle marks an air-exit module and a blue handle an air-inlet one. The reverse module is the
    separate component arista/7280cr3-fan-rev (FAN-7011H-R).
  face: >-
    estimated - figure D-2: red outer frame about 3 mm wide, a honeycomb grille, a grey vertical
    rail at the middle with a slider block and a red label tab at its top (callouts 4, 6 and 8, "Fan
    module release"), and a lamp in a round socket at the bottom centre (callouts 5, 7 and 9, "Fan
    module status LED"). The guide's Appendix A (figure A-4) names the lamp the "fan module status
    LED"; table 11 gives its states: off (not detected), green (normal), red (failed). Positions
    are fractions of the figure read at 1.24 px/mm, so good to about a millimetre. The label tab
    is drawn blank: its print is unreadable in the figure.
  handle-finish: >-
    The red of the frame is a field, `handle-finish`, default `#e0332e`, read off the figure (the
    guide says only "red handle" and "handle or bezel color indicates airflow direction").
  power: >-
    NOT STATED. Neither the quick start guide nor the data sheet gives a power draw for the
    FAN-7011H, so none is written and the lint warning for a fan without one stands.
states: [absent]
