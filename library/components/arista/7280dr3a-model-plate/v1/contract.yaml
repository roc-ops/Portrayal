format: 1
kind: component
name: 7280dr3a-model-plate
version: 1.0.0
class: sticker
behaviour: mounts
profile: networking
description: >-
  The model line printed on the narrow plate at the lower left of the Arista 7280DR3A-54 front,
  turned to read upward. The default skin prints "7280DR3A-54"; the `k` skin prints
  "7280DR3AK-54", the line figure C-1 of the quick start guide shows.
attrs: {model: '7280DR3A-54 model plate'}
size: {w: 3.0, h: 16.0}
size-confidence: {w: estimated, h: estimated}
provenance:
  size: >-
    estimated - the printed line of figure C-1 of the Arista 7280R3A Series Quick Start Guide
    (DOC-07042-01) at 2.0 mm type, about 13 mm long for "7280DR3AK-54"; the box is the line with a
    little margin. The plate it is printed on is the chassis face, so the box is no part.
  content: >-
    guide figure C-1 prints "7280DR3AK-54"; the base and M plates are not shown, and the default
    skin's "7280DR3A-54" is the model name of the base switch.
skins: [default, k]
