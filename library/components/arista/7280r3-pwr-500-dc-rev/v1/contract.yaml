format: 1
kind: module
name: 7280r3-pwr-500-dc-rev
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 500 W DC power supply of the Arista 7280SR3-48YC8 and 7280SR3-40YC6 for rear-to-front air,
  PWR-511-DC-BLUE (reverse airflow, blue handle). It is the PWR-511-DC-RED housing with the fan
  turned the other way. It is a 1RU module, 73.5 mm wide, with a blue diagonal handle on the fan
  guard and a terminal block in place of an inlet. The block has the two poles the guide's section
  4.4.2.2 names, negative (-48V) and positive (RTN). The protective earth terminal is on the other
  side of the module and is not drawn.
size: {w: 73.5, h: 40.0}
size-confidence: {w: datasheet, h: estimated}
part-numbers:
  PWR-511-DC-BLUE: {part: PWR-511-DC-BLUE}
attrs:
  power-output-w: 500
  input: dc
  inlet: dc-terminal
  airflow: back-to-front
  input-note: '-48 to -60 VDC, 13 A'
provenance:
  size: >-
    datasheet for the width, estimated for the height, as arista/7280r3-pwr-500-ac: the data sheet
    (03-0045-59, August 11th, 2025) describes the part as "PWR-511-DC-BLUE  Arista PSU, 1RU, DC,
    500W, REVERSE, 73.5mm".
  part-number: >-
    datasheet - ordering information for the 7280SR3-48YC8 and 7280SR3-40YC6: "PWR-511-DC-BLUE
    Arista PSU, 1RU, DC, 500W, REVERSE, 73.5mm". It is a spare: the "-R" SKUs are "2 x AC".
  power-output: >-
    datasheet - the "500W" of the ordering description. An output.
  input: >-
    datasheet - as arista/7280r3-pwr-500-dc: guide table 3 and the data sheet's power supply
    table, which lists one PWR-511 DC column for both airflow builds.
  face: >-
    estimated, AND NOT FROM THIS MODULE. No picture of a PWR-511-DC-BLUE is held. It is drawn as
    arista/7280r3-pwr-500-dc with the handle blue, which is what the guide's note "Handle or
    bezel color indicates airflow direction" describes.
  airflow: >-
    datasheet - the part number's BLUE and "REVERSE" airflow. The guide's section 2.1 says a blue
    handle marks an air-inlet module.
  handle-finish: >-
    The blue of the handle is a field, `handle-finish`, default `#3d7bd6`, the library's blue for a
    back-to-front handle.
