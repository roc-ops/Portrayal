format: 1
kind: component
name: sfp
version: 1.4.1
class: port
profile: networking
conforms: sfp
interface: sfp
description: SFP/SFP+/SFP28 cage cutout (1G/10G/25G)
size: {w: 14.5, h: 10.0, d: 41.0}
attrs: {media: sfp}
provenance:
  depth: estimated (typical receptacle depth; refine from spec)
  size: standard (SFF-8432) - this is the panel aperture
  relief.size: the module envelope that slides into the cage, taken from the
    13.5 x 8.5 body of common/sfp-lc-duplex. SFF-8432 governs the bezel cutout
    the registry carries, not the recess behind it, so this is the cage interior
    rather than a specified figure
elements:
  opening: {at: [0.0, 0.0], size: [14.5, 10.0], class: cutout}
relief:
  wall: '#aab0b7'
  cavity: cavity
  size: {w: 13.5, h: 8.5}
  features:
    - node: collar
      out: 1.0
      color: '#7d848c'
      confidence: estimated
      source: >-
        std/ cage collars - the library's ONE cage-lip figure, carried by std/sfp@1,
        std/xfp@1, std/qsfp28@1, std/qsfp56@1 and std/qsfp-dd@1. SFF-8432, INF-8077i,
        SFF-8663 and the QSFP-DD MSA all dimension the bezel OPENING and the
        bezel-to-connector depth, and NONE of them dimensions how far the cage lip stands
        proud of the panel - which is why five cages share one number. It is one estimate
        written five times, not five readings, and one caliper on any cage in any vendor's
        hardware corrects all five.
connection-points:
  mate: {at: [7.25, 5], direction: front}
skins: [default]
