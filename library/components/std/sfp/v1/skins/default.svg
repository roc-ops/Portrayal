<svg xmlns="http://www.w3.org/2000/svg" width="14.5mm" height="10mm" viewBox="0 0 14.5 10">
  <rect id="opening" x="0" y="0" width="14.5" height="10" rx="0.3" fill="#17191c"/>
  <!-- cavity: the cage interior a module slides into. Without this the
       cage is a painted rectangle with a raised collar and no recess. -->
  <rect id="cavity" x="0.5" y="0.75" width="13.5" height="8.5" rx="0.3" fill="#0a0c0e"/>
  <rect id="cage-lip" x="1.0" y="1.2" width="12.5" height="1.2" rx="0.3" fill="#2b2f33"/>
  <rect id="module-slot" x="1.0" y="3.6" width="12.5" height="2.6" rx="0.4" fill="#000000"/>
  <path id="collar" fill-rule="evenodd" fill="#9aa0a8" d="M 0.05 0.05 h 14.4 v 9.9 h -14.4 z M 0.75 0.75 h 13 v 8.5 h -13 z"/>
</svg>
