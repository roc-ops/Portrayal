    the body's top edge sits 0.5 below the cell's top edge (estimated; the shared wall
    is thin) and the slot runs 1.98. v1's 11.89 x 6.85 body and 4.0 slot were right to
    0.02; the shoulder is new.
  pins: drawing - TE 1734264 detail C, eight contacts 0.46 wide on a 1.02 pitch.
