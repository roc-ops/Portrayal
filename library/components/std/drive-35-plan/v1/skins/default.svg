<svg xmlns="http://www.w3.org/2000/svg" width="101.6mm" height="147mm" viewBox="0 0 101.6 147">
  <!-- A 3.5 inch drive from above. The OUTLINE is SFF-8301, by way of the
       registry entry this contract conforms to; everything drawn on it is
       estimated furniture so the part reads as a drive rather than a plain
       rectangle. Nothing here is measured. -->
  <g id="body">
    <rect x="0" y="0" width="101.6" height="147" rx="1.2"
          fill="#6a7076" stroke="#3a4045" stroke-width="0.8"/>
    <g fill="#5b6167">
      <circle cx="6" cy="6" r="2.1"/>
      <circle cx="95.6" cy="6" r="2.1"/>
      <circle cx="6" cy="141" r="2.1"/>
      <circle cx="95.6" cy="141" r="2.1"/>
    </g>
    <rect x="18" y="128" width="65.6" height="12" rx="1" fill="#3f4348"/>
  </g>
  <rect id="label" x="8" y="12" width="85.6" height="60" rx="1"
        fill="#c8ccd0" stroke="#9aa1a8" stroke-width="0.4"/>
</svg>
