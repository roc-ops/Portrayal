<svg xmlns="http://www.w3.org/2000/svg" width="12.9mm" height="8.0mm" viewBox="0 0 12.9 8.0">
  <!-- One MPO/MTP adapter opening, 12.9 x 8.0 (estimated: the printed
       12.5 x 7.6 connector plus a measured clearance - see the contract's
       provenance.size).

       THE APERTURE, NOT THE ADAPTER. What is drawn is the mouth: a rounded
       rectangle with a bevel inside it. The bezel belongs to
       common/mpo-adapter@2, which composes this.

       The opening is drawn pale because that is what FS's renders show - an
       MPO adapter's interior is a light grey sleeve against a black plate.
       The key notch the adapter drawings show is not drawn: nothing
       dimensions it (provenance.key). -->
  <rect id="opening" x="0" y="0" width="12.9" height="8.0" rx="0.6"
        fill="#8e97a4" stroke="#1b1e22" stroke-width="0.25"/>
  <rect id="bevel" x="0.55" y="0.5" width="11.8" height="7.0" rx="0.4"
        fill="#aab3bf"/>
</svg>
