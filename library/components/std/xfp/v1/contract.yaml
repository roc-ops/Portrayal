format: 1
kind: component
name: xfp
version: 1.0.0
class: port
profile: networking
conforms: xfp
interface: xfp
description: XFP cage cutout (10G pluggable) - the recommended bezel opening of the
  XFP MSA, the aperture an XFP cage protrudes through
size: {w: 19.5, h: 9.7, d: 61.7}
attrs: {media: xfp}
provenance:
  size: standard (XFP MSA INF-8077i Rev 4.5, Figure 37 "Recommended Single Sided
    Bezel Design" and Figure 38 "Recommended Double Side Mounting Bezel Design" -
    19.5 +/-0.1 by 9.7 +/-0.2, R0.5 MAX TYP. Both figures dimension it identically,
    which is a second reading inside one document rather than one drawing taken on
    trust)
  depth: standard (INF-8077i Fig 30 "XFP Datum Alignment, Depth" - front of bezel
    Datum B to the connector centreline Datums K and L, 61.7 MAX. This is the XFP
    analogue of the 37 REF that std/qsfp28 carries, and it is much deeper because an
    XFP is a much longer module)
  pitch: standard (INF-8077i section 6.8 - "a nominal centerline to centerline
    spacing of 23.5 mm (0.925 in) is sufficient", labelled "minimum pitch
    illustrated" in both figures, so it is a floor rather than a fixed pitch)
elements:
  opening: {at: [0.0, 0.0], size: [19.5, 9.7], class: cutout}
relief:
  wall: '#aab0b7'
  features:
    - node: collar
      out: 1.0
      color: '#7d848c'
      confidence: estimated
      source: >-
        std/ cage collars - the library's ONE cage-lip figure, carried by std/sfp@1,
        std/xfp@1, std/qsfp28@1, std/qsfp56@1 and std/qsfp-dd@1. SFF-8432, INF-8077i,
        SFF-8663 and the QSFP-DD MSA all dimension the bezel OPENING and the
        bezel-to-connector depth, and NONE of them dimensions how far the cage lip stands
        proud of the panel - which is why five cages share one number. It is one estimate
        written five times, not five readings, and one caliper on any cage in any vendor's
        hardware corrects all five.
connection-points:
  mate: {at: [9.75, 4.85], direction: front}
skins: [default]
