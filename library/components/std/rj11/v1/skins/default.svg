<svg xmlns="http://www.w3.org/2000/svg" width="9.88mm" height="11.26mm" viewBox="0 0 9.88 11.26">
  <!-- THE OPENING ALONE, in three tiers, as TE C-1775675 rev C draws it: body 9.88 x
       6.85, shoulder 6.60 wide and 1.69 high, latch slot 4.04 wide and 2.72 high. The
       housing round it is the placing part's. The cavity node is the same outline so
       the 3D view recesses exactly what the face shows. -->
  <path id="cavity" fill="#17191c" d="
    M 0 0 h 9.88 v 6.85 h -1.64 v 1.69 h -1.28 v 2.72 h -4.04 v -2.72 h -1.28 v -1.69 h -1.64 z"/>
  <path id="opening" fill="none" d="M 0 0 h 9.88 v 11.26 h -9.88 z"/>
  <!-- two contacts loaded, positions 3 and 4 of six on the 1.02 pitch (6P2C) -->
  <g id="pins" fill="#a8873c">
    <rect x="4.20" y="0.6" width="0.46" height="2.3"/>
    <rect x="5.22" y="0.6" width="0.46" height="2.3"/>
  </g>
</svg>
