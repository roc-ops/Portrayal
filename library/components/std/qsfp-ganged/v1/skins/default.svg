<svg xmlns="http://www.w3.org/2000/svg" width="18.5mm" height="9.58mm" viewBox="0 0 18.5 9.58">
  <!-- aperture: the cage opening, 18.50 x 9.58 (TE 2322551-4). The 0.50 shared
       wall between ganged ports belongs to the parent block, not to this port. -->
  <rect id="opening" x="0" y="0" width="18.5" height="9.58" rx="0.3" fill="#17191c"/>
  <!-- cavity: SFF-8661 module envelope 18.35 x 8.5 - the invariant mating interface -->
  <rect id="module-bay" x="0.075" y="0.54" width="18.35" height="8.5" rx="0.3" fill="#0d0f11"/>
  <rect id="cage-lip" x="0.9" y="6.88" width="16.7" height="1.3" rx="0.3" fill="#2b2f33"/>
  <rect id="module-slot" x="0.9" y="4.0" width="16.7" height="2.6" rx="0.4" fill="#000000"/>
</svg>
