<svg xmlns="http://www.w3.org/2000/svg" width="79.2mm" height="18.42mm" viewBox="0 0 79.2 18.42">
  <!-- Low profile PCIe I/O bracket, PCIe CEM 5.0 figure 11-9:
       79.2 x 18.42, connector opening 54.53, tapped hole
       spacing 53.9, 20 GA steel. Long-axis horizontal. -->
  <rect x="0.2" y="0.2" width="78.80" height="18.02" rx="1.27" fill="#9aa1a8" stroke="#5f666d" stroke-width="0.4"/>
  <rect id="opening" x="12.07" y="1.71" width="54.53" height="15.0" rx="1.27" fill="#1b1f22" stroke="#41474d" stroke-width="0.35"/>
  <!-- THE TAPPED EARS ARE NOT DRAWN. The two #4-40 holes sit
       53.9 apart on the RETURN FLANGE that screws to the
       card board - they face into the chassis, not out of it. A
       first draft put them on this face and they landed INSIDE the
       connector opening, which is the giveaway: the hole spacing is
       SHORTER than the opening is long. Nothing on this face has a
       hole in it except the opening. -->
</svg>
