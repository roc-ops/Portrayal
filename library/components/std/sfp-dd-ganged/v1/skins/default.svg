<svg xmlns="http://www.w3.org/2000/svg" width="14.25mm" height="10.4mm" viewBox="0 0 14.25 10.4">
  <!-- full-bleed: the ganged bezel cutout is one continuous slot (TE 114-60027
       Figure 4), so ports abut - the only thing between them is the shared cage wall -->
  <rect id="opening" x="0" y="0" width="14.25" height="10.4" fill="#17191c"/>
  <!-- cavity: the port opening inside the cage, 14.00 x 8.95, leaving a 0.25 shared wall -->
  <rect id="cavity" x="0.125" y="0.725" width="14" height="8.95" rx="0.3" fill="#0a0c0e"/>
  <rect id="cage-wall" x="0" y="0" width="0.125" height="10.4" fill="#3a4046"/>
  <rect id="cage-wall-right" x="14.125" y="0" width="0.125" height="10.4" fill="#3a4046"/>
</svg>
