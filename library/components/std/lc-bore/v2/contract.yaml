format: 1
kind: component
name: lc-bore
version: 2.0.0
class: port
interface: lc
profile: networking
description: One LC receptacle bore - a square recess with the fiber ferrule
  standing in it, as seen looking into an LC port
size: {w: 4.7, h: 4.7, d: 4.5}
conforms: lc-duplex-receptacle
attrs: {media: fiber, connector: lc}
provenance:
  size: drawing - 4.7 +/-0.05 square, section A-A of the ProLabs
    PAN-QSFP28-100GBASE-CWDM4-C datasheet. v1 was 4.6 x 4.4 and said so in its
    own provenance - proportional, because no source we held gave the opening
  ferrule: standard (LC uses a 1.25mm ferrule; SC and FC use 2.5mm)
  depth: estimated (recess deep enough that the ferrule face sits below the
    surrounding surface, which is what you see looking into a real LC port)
elements:
  bore: {at: [0.0, 0.0], size: [4.7, 4.7], class: cutout}
relief:
  wall: '#4a4f55'
  cavity: bore
  features:
    - node: ferrule
      top: 3.6
      color: '#e8ecef'
      confidence: estimated
      source: >-
        std/lc-bore@1 (v1) - the same 3.6 carried into v2 unchanged when the OPENING was
        corrected to 4.7 square from the ProLabs section A-A. Only the aperture gained a
        source in v2; the ferrule protrusion did not, and it remains v1's estimate.
connection-points:
  mate: {at: [2.35, 2.35], direction: front}
skins: [default]
