<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="21.59mm" viewBox="0 0 120.02 21.59">
  <!-- Standard (full height) PCIe I/O bracket, PCIe CEM 5.0 figure 11-5,
       seen from OUTSIDE the chassis.
       body 18.42 at y 3.17..21.59 in a 21.59 box, keyed top 0..19.05;
       opening 89.9 x 12.06 starting
       19.96 from the tip; retention tab 10.20 wide
       over the first 7.27, reached by 45 degree chamfers.
       TIP AT THE LEFT, flange end at the right, and the keyed flange
       stepping UP past the body - the side the card's PCB is on. -->
  <path d="M1.91 17.48 L7.27 17.48 L11.38 21.59 L114.28 21.59 L117.18 19.05 L118.75 19.05 A1.27 1.27 0 0 0 120.02 17.78 L120.02 1.27 A1.27 1.27 0 0 0 118.75 0 L117.18 0 L115.29 3.17 L11.38 3.17 L7.27 7.28 L1.91 7.28 A1.91 1.91 0 0 0 0 9.19 L0 15.57 A1.91 1.91 0 0 0 1.91 17.48 Z" fill="#9aa1a8" stroke="#5f666d" stroke-width="0.4" stroke-linejoin="round"/>
  <rect id="opening" x="19.96" y="6.35" width="89.9" height="12.06" rx="1.0" fill="#1b1f22" stroke="#41474d" stroke-width="0.35"/>
  <!-- the fold: the flange turns 90 degrees out of the page here and
       runs 9.40 into the chassis. On an elevation it is a line. -->
  <path id="flange-fold" d="M119.16 3.57 V18.65" stroke="#5f666d" stroke-width="0.3" fill="none"/>
  <!-- 5.08 across the outboard end of the retention tab -->
  <path d="M5.08 7.58 V17.18" stroke="#5f666d" stroke-width="0.3" fill="none"/>
</svg>
