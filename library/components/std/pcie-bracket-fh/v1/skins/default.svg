<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="18.42mm" viewBox="0 0 120.02 18.42">
  <!-- Standard (full height) PCIe I/O bracket, PCIe CEM 5.0 figure 11-5:
       120.02 x 18.42, connector opening 89.9, tapped hole
       spacing 85.4, 20 GA steel. Long-axis horizontal. -->
  <rect x="0.2" y="0.2" width="119.62" height="18.02" rx="1.27" fill="#9aa1a8" stroke="#5f666d" stroke-width="0.4"/>
  <rect id="opening" x="12.06" y="1.71" width="89.9" height="15.0" rx="1.27" fill="#1b1f22" stroke="#41474d" stroke-width="0.35"/>
  <!-- THE TAPPED EARS ARE NOT DRAWN. The two #4-40 holes sit
       85.4 apart on the RETURN FLANGE that screws to the
       card board - they face into the chassis, not out of it. A
       first draft put them on this face and they landed INSIDE the
       connector opening, which is the giveaway: the hole spacing is
       SHORTER than the opening is long. Nothing on this face has a
       hole in it except the opening. -->
</svg>
