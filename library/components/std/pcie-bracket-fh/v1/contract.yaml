format: 1
kind: component
name: pcie-bracket-fh
version: 1.0.0
class: bracket
conforms: pcie-bracket-fh
description: >-
  Standard (full height) PCI Express add-in card I/O bracket - the faceplate every PCIe
  card presents at the chassis wall, with the connector opening its I/O looks
  through
size: {w: 120.02, h: 18.42}
attrs:
  material: '0.86 mm (20 GA) low carbon steel, zinc plated'
  card-height-max: 111.28
  chassis-opening: 100.71
provenance:
  size: >-
    standard - PCI Express Card Electromechanical Specification Revision 5.0,
    June 2021, figure 11-5 "Standard (full height) I/O Bracket" on page 172.
    Overall 120.02 +/-0.38 by 18.42 wide, connector opening 89.9,
    tapped hole spacing 85.4, material 0.86 +/-0.08 mm (20 GA) low carbon
    steel, zinc plated. Every figure here is dimensioned; nothing is read off a
    picture.
  why-a-standard-part: >-
    EVERY PCIe CARD SHARES THIS OUTLINE, which is the point of the form factor -
    "to enable the reuse of existing chassis slots" in the specification's own
    words. A blanking plate, a NIC, an HBA and a GPU differ in what is printed on
    the bracket and in nothing else about its shape, so they compose this rather
    than each carrying a traced copy.
  the-trap-it-closes: >-
    MEASURING A PHOTOGRAPH GIVES THE OPENING, NOT THE BRACKET. Reading Dell's
    rear figure produced a "bracket" of about 90 mm on one riser and 110 on
    another - impossible for a standard part, and it sent two rounds of modelling
    chasing per-riser widths that do not exist. 89.90 is the CONNECTOR OPENING:
    the hole is what the eye picks out and the metal around it recedes into the
    chassis. The specification settles in one page what no amount of measuring
    the photograph could.
  tapped-ears: >-
    THE TWO #4-40 HOLES ARE NOT ON THIS FACE and are not drawn. They sit on the
    RETURN FLANGE that screws to the card board, facing into the chassis. A first
    draft put them on the face and they landed INSIDE the connector opening -
    which is the giveaway, since the hole spacing is SHORTER than the opening is
    long. The spacing is recorded above because it identifies the part; it is not
    geometry this view carries.
  confirmed-against-the-part: >-
    A PHOTOGRAPH OF A LOOSE BLANKING BRACKET agrees with the specification: the
    hooked tab at one end, the plain tab at the other, and between them a vent
    field of TWO ROWS inside a rounded window with the outboard pair of holes
    sitting outside that window. The outline is the spec's; what a vendor does
    inside the opening is the vendor's, which is why the vent field belongs to
    dell/pcie-filler-* and not here.
  orientation: >-
    drawn LONG-AXIS HORIZONTAL, which is how a 2U rear presents it and how the
    rest of std/ is drawn. A tower stands it on end; that is a device's `rotate`
    and not a property of the part.
  chassis-opening: >-
    100.71 REF is the chassis opening dimension K from the same
    specification's figure 11-35 table - the MINIMUM aperture, which it says
    explicitly "will vary based on system implementation". It is carried in attrs
    for a device that needs to punch one, and is deliberately not this part's
    `size`.
elements:
  opening:
    at: [12.06, 1.71]
    size: [89.9, 15.0]
    class: cutout
    description: >-
      the connector opening in the bracket, 89.9 along its length. Its
      width across the bracket is NOT dimensioned in the figure the way the
      length is, so 15.0 is drawn to the proportion shown and the length is the
      number that carries weight.
skins: [default]
