<svg xmlns="http://www.w3.org/2000/svg" width="28.8mm" height="11.4mm" viewBox="0 0 28.8 11.4">
  <!-- THE OUTLINE IS THE SHELL, NOT THE HOLE. `size` 28.80 x 11.40 is the
       MOUNTING PANEL CUTOUT for the 15-position (A) shell from TE 114-40010
       Rev G Figure 3; the shell passes THROUGH it and is drawn 28.55 x 10.50
       inside it, the same clearance std/db9@1 reads off a photograph of the E
       shell. Shape per Figure 3: 10 degrees +/-2 of taper a side, 3.35 radius
       in four places. This is std/db9@1's outline with its two flats
       lengthened by 8.33, the difference between the two C dimensions. -->
  <!-- A RING, so 3D builds the shell as a tube round the insert rather than a
       slab over it. -->
  <path id="opening" fill-rule="evenodd"
        d="M0.818 4.382 A3.350 3.350 0 0 1 4.117 0.450 L24.683 0.450 A3.350 3.350 0 0 1 27.982 4.382 L27.312 8.182 A3.350 3.350 0 0 1 24.013 10.950 L4.787 10.950 A3.350 3.350 0 0 1 1.488 8.182 Z M1.546 4.225 A2.450 2.450 0 0 1 3.959 1.350 L24.841 1.350 A2.450 2.450 0 0 1 27.254 4.225 L26.584 8.025 A2.450 2.450 0 0 1 24.171 10.050 L4.629 10.050 A2.450 2.450 0 0 1 2.216 8.025 Z" fill="#5c6268" stroke="#9aa0a6" stroke-width="0.35"/>
  <!-- THE BORES, DRAWN BEHIND THE INSERT so they have something to be - the
       std/vga@1 arrangement. The insert is pierced by the same fifteen circles,
       so in 3D each is a hole through a solid face. -->
  <g id="socket-floor">
    <circle cx="4.81" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="7.55" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="10.29" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="13.03" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="15.77" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="18.51" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="21.25" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="23.99" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="6.18" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="8.92" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="11.66" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="14.4" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="17.14" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="19.88" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="22.62" cy="7.12" r="0.5" fill="#050607"/>
  </g>
  <!-- FEMALE, FLUSH AND PIERCED. Nokia's CCM-e figure (SR-e install guide
       Figure 98) draws holes and numbers pin 1 at the top RIGHT, which is a
       receptacle's face seen from the front. Eight over seven, the lower row
       offset half a pitch. Pitch 2.74 and row separation 2.84 are TE
       114-40010 Figure 6's board footprint for the 15-position part, standing
       in for the face field it mirrors. -->
  <path id="insert" fill-rule="evenodd"
        d="M1.546 4.225 A2.450 2.450 0 0 1 3.959 1.350 L24.841 1.350 A2.450 2.450 0 0 1 27.254 4.225 L26.584 8.025 A2.450 2.450 0 0 1 24.171 10.050 L4.629 10.050 A2.450 2.450 0 0 1 2.216 8.025 Z M4.310 4.280 A0.500 0.500 0 1 0 5.310 4.280 A0.500 0.500 0 1 0 4.310 4.280 Z M7.050 4.280 A0.500 0.500 0 1 0 8.050 4.280 A0.500 0.500 0 1 0 7.050 4.280 Z M9.790 4.280 A0.500 0.500 0 1 0 10.790 4.280 A0.500 0.500 0 1 0 9.790 4.280 Z M12.530 4.280 A0.500 0.500 0 1 0 13.530 4.280 A0.500 0.500 0 1 0 12.530 4.280 Z M15.270 4.280 A0.500 0.500 0 1 0 16.270 4.280 A0.500 0.500 0 1 0 15.270 4.280 Z M18.010 4.280 A0.500 0.500 0 1 0 19.010 4.280 A0.500 0.500 0 1 0 18.010 4.280 Z M20.750 4.280 A0.500 0.500 0 1 0 21.750 4.280 A0.500 0.500 0 1 0 20.750 4.280 Z M23.490 4.280 A0.500 0.500 0 1 0 24.490 4.280 A0.500 0.500 0 1 0 23.490 4.280 Z M5.680 7.120 A0.500 0.500 0 1 0 6.680 7.120 A0.500 0.500 0 1 0 5.680 7.120 Z M8.420 7.120 A0.500 0.500 0 1 0 9.420 7.120 A0.500 0.500 0 1 0 8.420 7.120 Z M11.160 7.120 A0.500 0.500 0 1 0 12.160 7.120 A0.500 0.500 0 1 0 11.160 7.120 Z M13.900 7.120 A0.500 0.500 0 1 0 14.900 7.120 A0.500 0.500 0 1 0 13.900 7.120 Z M16.640 7.120 A0.500 0.500 0 1 0 17.640 7.120 A0.500 0.500 0 1 0 16.640 7.120 Z M19.380 7.120 A0.500 0.500 0 1 0 20.380 7.120 A0.500 0.500 0 1 0 19.380 7.120 Z M22.120 7.120 A0.500 0.500 0 1 0 23.120 7.120 A0.500 0.500 0 1 0 22.120 7.120 Z" fill="#2b2e33" stroke="#3a3e43" stroke-width="0.2"/>
</svg>
