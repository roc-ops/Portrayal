       3.18 in from each long edge and 20.32 apart. Where the upper one
       runs under an ear recess the figure's hatch crosses the edge; it
       is kept 0.5 inside the metal there. -->
  <path id="window-1" d="M25.38 7.67 H31.23 V6.35 H103.07 V7.67 H107.31 V18.41 H25.38 Z" fill="#1b1f22" stroke="#41474d" stroke-width="0.35"/>
  <rect id="window-2" x="25.38" y="26.67" width="81.93" height="12.06" rx="1.0" fill="#1b1f22" stroke="#41474d" stroke-width="0.35"/>
  <!-- the fold: the flange turns 90 degrees out of the page here. -->
  <path id="flange-fold" d="M119.21 1.67 V37.7" stroke="#5f666d" stroke-width="0.3" fill="none"/>
  <!-- 5.08 across the outboard end of each retention tab -->
  <path d="M5.08 7.58 V17.18 M5.08 27.9 V37.5" stroke="#5f666d" stroke-width="0.3" fill="none"/>
