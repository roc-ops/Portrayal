<svg xmlns="http://www.w3.org/2000/svg" width="120.07mm" height="41.91mm" viewBox="0 0 120.07 41.91">
  <!-- Two-slot (full height) PCIe I/O bracket, PCIe CEM 5.0 figure 11-13,
       seen from OUTSIDE the chassis, in std/pcie-bracket-fh@2's frame:
       TIP AT THE LEFT, flange end at the right, keyed flange stepping UP.
       body 38.74 at y 3.17..41.91 in a 41.91 box, keyed top 0..39.37;
       two retention tabs 10.20 wide on the 20.32 pitch, 7.14 long,
       reached by 45 degree chamfers; between them the plate edge runs
       at the tabs' root. The PCB side is the top: the two recesses in
       the top edge are where the tapped ears fold back to the card. -->
