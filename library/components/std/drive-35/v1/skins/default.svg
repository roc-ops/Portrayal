<svg xmlns="http://www.w3.org/2000/svg" width="101.6mm" height="26.1mm" viewBox="0 0 101.6 26.1">
  <!-- 3.5 inch drive per SFF-8301: 101.60 wide, 26.10 high, drawn LYING FLAT,
       which is how a front-loading bay presents it.
       THE FRONT EDGE IS BLANK. A hot-swap drive enters connector first, so this
       face carries no connector, label, lamp or latch - all of those are the
       carrier's, and the carrier is the vendor's. -->
  <rect x="0.25" y="0.25" width="101.10" height="25.60" rx="0.8"
        fill="#8f959b" stroke="#5b6167" stroke-width="0.5"/>
  <!-- the chamfer along the leading edge, which is what makes a drive end read
       as a drive end rather than as a blank rectangle -->
  <path d="M1.6 1.6 H100.00 V24.50 H1.6 Z" fill="none"
        stroke="#a7adb3" stroke-width="0.4"/>
</svg>
