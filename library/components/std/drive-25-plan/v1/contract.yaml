format: 1
kind: module
name: drive-25-plan
version: 1.1.0
class: drive
behaviour: fills
conforms: drive-25
presents: hd
profile: server
description: >-
  A 2.5 inch drive lying flat, seen from above - the same body std/drive-25@1
  draws standing on edge, in the projection a mid-bay presents
size: {w: 69.85, h: 100.45, d: 15.0}
provenance:
  it-is-a-module-because-it-SEATS: >-
    `kind: module` with `behaviour: fills`, and the reason is render.py's
    aperture rule: anything that is not a module is drawn as a HOLE as deep as
    its `size.d`. Seated straight into a bay as a plain component, this drive
    became a 15.0 mm void in the top of the chassis - four rectangular pits
    where four drives should be.
    std/drive-25@1 is a plain component and is right to be: on a front face the
    bare drive body is COMPOSED INTO a carrier, and the carrier is the module
    that fills the bay. This projection has no carrier to be composed into - see
    below - so it is the thing that seats, and it has to say so.
  the-mid-tray-carrier-is-not-modelled: >-
    A limitation, stated. Dell's mid tray holds its drives in carriers -
    `740XD_ MidDriveTray_ Bracket-1.001` is in the service model at
    392.29 x 160.53 - and this library has no plan-view carrier to compose this
    drive into. The bare drive stands in for the carrier it should sit in, so
    the bay reads correctly and the drive is the right size, but the carrier's
    own ears, latch and handle are simply absent rather than wrong.
  size: >-
    registry - spec/schemas/standards.yaml `drive-25`, the same entry
    std/drive-25@1 conforms to. `presents: hd` says these are the standard's
    h and depth, leaving its w - the 15.0 thickness - as this contract's own
    depth. Nothing is restated: change SFF-8201 in the registry and both files
    move, or both fail.
  the-registry-draws-it-on-edge-and-this-bay-does-not: >-
    THE STANDARD FIXES AN ORIENTATION AND A BAY IS FREE TO DISAGREE. The
    registry's own description says drive-35 is drawn lying flat "where drive-25
    is drawn standing on edge", which is right for the front of this machine -
    24 of them on edge across a 2U face. The mid tray lays the same drive flat,
    so what a view from above shows is the standard's h x depth rather than its
    w x depth.
    That is exactly why L9 checks the pair as a SET and not in order: which way
    round a part is turned belongs to the placement. What must not drift are the
    values, and they cannot.
  the-length-the-tray-measures-is-100-50: >-
    Dell's service model gives the drives in `740XD_ MidDriveTray_ 2.5 HDD-5.002`
    as 69.85 x 100.50 x 15.00. The registry's SFF-8201 depth is 100.45. The 0.05
    is inside L9's tolerance and inside what the model resolves; the registry
    figure is used because it is the anchored one.
  the-face-is-plain-and-that-is-honest: >-
    estimated - a lid, a label panel and the connector end, drawn so the part
    reads as a drive rather than a plain rectangle. NO VENDOR DRAWING WAS
    CONSULTED for the top of a 2.5 inch drive. The OUTLINE is the standard; the
    furniture on it is not, and nothing should be measured off this artwork.
skins: [default]
elements:
  body: {at: [0.0, 0.0], size: [69.85, 100.45], class: bezel}
  label: {at: [6.0, 9.0], size: [57.85, 42.0], class: label}
