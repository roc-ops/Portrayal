<svg xmlns="http://www.w3.org/2000/svg" width="69.85mm" height="100.45mm" viewBox="0 0 69.85 100.45">
  <!-- A 2.5 inch drive lying flat, from above. The OUTLINE is SFF-8201, by way
       of the registry entry this contract conforms to; everything drawn on it
       is estimated furniture so the part reads as a drive rather than a plain
       rectangle. Nothing here is measured. -->
  <g id="body">
    <rect x="0" y="0.0" width="69.85" height="100.45" rx="1"
          fill="#6a7076" stroke="#3a4045" stroke-width="0.7"/>
    <g fill="#5b6167">
      <circle cx="4.5" cy="95.95" r="1.6"/>
      <circle cx="65.35" cy="95.95" r="1.6"/>
      <circle cx="4.5" cy="4.5" r="1.6"/>
      <circle cx="65.35" cy="4.5" r="1.6"/>
    </g>
    <rect x="12" y="3.45" width="45.85" height="9" rx="0.8" fill="#3f4348"/>
  </g>
  <rect id="label" x="6" y="49.45" width="57.85" height="42" rx="0.8"
        fill="#c8ccd0" stroke="#9aa1a8" stroke-width="0.35"/>
  <!-- the label's print: the capacity fields, defaults here, filled from attrs -->
  <g id="silkscreen">
  <text data-from="capacity" x="33.90" y="74.00" font-family="sans-serif" font-size="7.0" font-weight="bold" fill="#22262a" text-anchor="end">1.2</text>
  <text data-from="capacity-unit" x="35.40" y="74.00" font-family="sans-serif" font-size="3.85" fill="#41474d" text-anchor="start">TB</text>
  </g>
</svg>
