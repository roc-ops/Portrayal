<svg xmlns="http://www.w3.org/2000/svg" width="35.6mm" height="27.7mm" viewBox="0 0 35.6 27.7">
  <!-- IEC 60320 C19 outlet (IEC 60320-3 sheet J), as SCHURTER 4710-5 draws it: the R5
       well a C20 plug shroud enters, and the C19 nose standing up out of it to the
       face with its three contact slots, earth up. `opening` is the whole part; the
       well is `well`, which relief.cavity names, so its walls follow the R5 outline. -->
  <rect id="opening" x="0" y="0" width="35.6" height="27.7" fill="none"/>
  <path id="well" d="M 5 0 H 30.6 A 5 5 0 0 1 35.6 5 V 22.7 A 5 5 0 0 1 30.6 27.7 H 5 A 5 5 0 0 1 0 22.7 V 5 A 5 5 0 0 1 5 0 Z" fill="#0b0c0d" stroke="#3a3c3f" stroke-width="0.25"/>
  <g id="nose">
    <path d="M 8.5 3.45 H 27.1 A 4.7 4.7 0 0 1 31.8 8.15 V 19.55 A 4.7 4.7 0 0 1 27.1 24.25 H 8.5 A 4.7 4.7 0 0 1 3.8 19.55 V 8.15 A 4.7 4.7 0 0 1 8.5 3.45 Z" fill="#26282a" stroke="#45484c" stroke-width="0.2"/>
    <rect id="slot-earth" x="14.2" y="8.5" width="7.2" height="2.65" rx="0.3" fill="#030303"/>
    <rect id="slot-line" x="8.2" y="16.5" width="6.25" height="2.65" rx="0.3" fill="#030303"/>
    <rect id="slot-neutral" x="21.15" y="16.5" width="6.25" height="2.65" rx="0.3" fill="#030303"/>
  </g>
</svg>
