<svg xmlns="http://www.w3.org/2000/svg" width="4.7mm" height="8.06mm" viewBox="0 0 4.7 8.06">
  <!-- THE BULKHEAD LC OPENING, keyed. One path, four tiers concentric on
       x=2.35: the 4.7 bore square, then the neck 3.46, the shoulder 4.70 and
       the latch tongue 2.64 - std/lc-bore@3's widths. The heights are the
       ones measured off SENKO DS-LC-000010's front view (see the contract's
       provenance.keyway): tier boundaries 3.10, 4.29 and 5.71 from the
       ferrule axis at y 2.35. Tongue DOWN here; placements turn it. -->
  <path id="bore" fill="#15181b" d="
    M 0 0 h 4.7 v 4.70
    h -0.62 v 0.75 h 0.62 v 1.19
    h -1.03 v 1.42 h -2.64 v -1.42
    h -1.03 v -1.19 h 0.62 v -0.75 h -0.62 z"/>
  <!-- Floors for the latch slot, one per tier, stepping deeper as they run out
       from the bore - the same fill as the aperture, so they change nothing in
       2D and give the 3D view the scoop a finger reaches into. -->
  <rect id="key-neck" x="0.62" y="4.70" width="3.46" height="0.75" fill="#15181b"/>
  <rect id="key-shoulder" x="0" y="5.45" width="4.7" height="1.19" fill="#15181b"/>
  <rect id="key-tongue" x="1.03" y="6.64" width="2.64" height="1.42" fill="#15181b"/>
  <circle id="sleeve" cx="2.35" cy="2.35" r="1.2" fill="#22262a" stroke="#3a4046" stroke-width="0.12"/>
  <!-- LC ferrule: 1.25mm diameter -->
  <circle id="ferrule" cx="2.35" cy="2.35" r="0.625" fill="#e8ecef"/>
</svg>
