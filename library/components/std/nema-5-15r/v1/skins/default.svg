<svg xmlns="http://www.w3.org/2000/svg" width="27mm" height="27mm" viewBox="0 0 27 27">
  <!-- NEMA 5-15R single receptacle face: a flat 27 x 27 face, the U earth hole
       up and two parallel slots, the line on the left and the neutral on the
       right, 12.7 apart. There is no T: that is the 5-20 key. The face, the
       earth hole and the line slot are the Qualtek 739W-X2/30 5-20R's, set
       centred; the neutral slot is the line slot mirrored. The three holes are
       `pocket` features. -->
  <rect id="face" x="0" y="0" width="27" height="27" rx="0.5" fill="#2a2c2f" stroke="#4a4d51" stroke-width="0.25"/>
  <path id="hole-earth" d="M 10.86 4.47 H 16.14 V 7.14 A 2.64 2.64 0 0 1 10.86 7.14 Z" fill="#050505"/>
  <rect id="slot-line" x="6.03" y="15.49" width="2.22" height="6.99" fill="#050505"/>
  <rect id="slot-neutral" x="18.75" y="15.49" width="2.22" height="6.99" fill="#050505"/>
</svg>
