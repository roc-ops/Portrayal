format: 1
kind: component
name: mpo-module-receptacle
version: 1.0.0
interface: mpo
class: port
profile: networking
conforms: mpo-adapter
optical: {positions: 12}
description: >-
  One MPO receptacle as a module carries it - the mouth an MPO-12 or MPO-24
  plug enters on a transceiver, looked into: a dark cavity, the key notch
  centred in its top wall, and the MT ferrule at the back with two guide pins
  and a row of twelve fibres. The same opening as std/mpo@2 and the same
  interface, so it offers the same plugs and dust caps; std/mpo@2 stays the
  panel adapter's open sleeve.
size: {w: 12.9, h: 8.0, d: 9.0}
size-confidence: {w: estimated, h: estimated, d: estimated}
attrs: {media: fiber, connector: mpo}
provenance:
  size: >-
    ESTIMATED, borrowed - the 12.9 x 8.0 mouth of std/mpo@2, the same opening
    seen on a module and not on a panel: SFF-8436 Rev 4.9 section 5.1 says a
    module receptacle meets the MPO adapter interface of IEC 61754-7. See
    std/mpo@2 for the derivation (the printed 12.5 x 7.6 plug plus a measured
    clearance). The size box is kept so an optic that composed std/mpo@2 keeps
    its layout.
  depth: >-
    ESTIMATED at 9.0, the figure std/mpo@2 carries. No document held gives the
    depth of a module receptacle.
  what-differs: >-
    WHY A SECOND PART FOR ONE OPENING. std/mpo@2 draws what a panel adapter
    shows: a pale sleeve, open through to the other side. Looked into, a
    module is a dark cavity with the MT ferrule at the back, its two guide
    pins and the fibre row. The interface, the mate point and the size are
    the same, so the slot offers the same plugs and caps.
  gender: >-
    datasheet - PINNED. SFF-8679 Rev 1.9 section 7.3 describes the module receptacle as a male MPO connector with two alignment pins. The plugs that land here are
    unpinned.
  ferrule: >-
    drawing, measured, undimensioned - 6.10 x 2.50, the window the MT ferrule
    stands in on US Conec customer drawing C20044 rev B, sheet 2 front view,
    as generic/mpo12-plug@1 records it (its `provenance.ferrule`), centred on
    the opening. The receptacle's own ferrule is the mating half of that one;
    no drawing of a module receptacle is held.
  guide-pins: >-
    the pitch is 4.6: the US Conec MTP-16 handout SM-0022-0823 p1 prints 4.6mm
    for the traditional MT ferrule (against 5.3mm for the sixteen-fibre one),
    and the two guide-pin bores measure 4.59 apart on C20044 rev B
    (generic/mpo12-plug@1 `provenance.ferrule`). The maintainer's end-on
    photograph of a QSFP28 SR4 reads 4.4 on the recessed ferrule. THE PIN
    DIAMETER IS NOT DIMENSIONED in anything held: 0.7 is drawn, the lower end
    of the 0.70 to 0.80 the bores the pins enter measure on C20044, so it is
    a measured bore and an estimated pin.
  keyway: >-
    ESTIMATED, derived from the plug - CENTRED. The MPO-12 key moulding is
    4.39 wide and 0.90 tall, centred on the housing to 0.02 and 0.42 inside
    its top flat (US Conec C20044 rev B, measured; generic/mpo12-plug@1
    `provenance.key`). The notch is that key where a seated plug puts it,
    plus the 0.2 a side the opening allows the housing: 4.79 x 1.30, from 0.4
    below the top of the mouth. No drawing held dimensions an MPO keyway
    (std/mpo@2 `provenance.key`), so this is the plug's key and not a reading
    of a receptacle. KEY UP is SFF-8679 Rev 1.9 section 7.3.1.
  fibre-positions: >-
    ELEMENTS 1 TO 12 ARE THE FIBRES, drawn as dots 0.125 across on the
    ferrule, one row through its centre at the 0.25 pitch
    (the US Conec handout prints 0.25mm fibre pitch within the row; 0.249 measured on C20044). THIS VIEW LOOKS INTO THE RECEPTACLE, key up, and
    position 1 is at the RIGHT. That is the mirror of a plug seen on its own
    end face, where key up puts fibre 1 at the left (ANSI/TIA-568.3-D, as
    generic/mpo12-plug@1 cites it), and it is the same side the library draws
    a SEATED plug's fibre 1 on, because a seated plug is seen from its boot
    end, looking the same way. So position n here is where fibre n of the
    seated plug lands, as on the panel adapters. WHICH POSITIONS TRANSMIT AND
    WHICH RECEIVE IS NOT STATED: that is a fact about the module a wrapper is,
    and a generic states none.
  recess: >-
    ESTIMATED, every figure. The ferrule face stands 5.0 up from the floor of
    the 9.0 cavity, so 4.0 behind the mouth: the maintainer's end-on
    photograph of a QSFP28 SR4 shows the ferrule recessed, and nothing
    dimensions how far. The pins stand 1.9 proud of the ferrule face,
    which is printed (US Conec C20044 rev B SECTION A-A, 1.9).
