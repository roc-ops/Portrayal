<svg xmlns="http://www.w3.org/2000/svg" width="12.9mm" height="8.0mm" viewBox="0 0 12.9 8.0">
  <!-- A two-row MPO receptacle on a MODULE, looked into, key up: a dark
       cavity, the key notch in its top wall, the MT ferrule at the back with
       its two guide pins and two rows of twelve fibres. Same 12.9 x 8.0
       mouth as std/mpo@2. The fibres are real ink, dots 0.125 across at the
       0.25 pitch in rows 0.50 apart; 1 to 12 in the key-side row and 13 to
       24 in the other, each from the right (the contract's
       provenance.fibre-positions). -->
  <rect id="opening" x="0" y="0" width="12.9" height="8.0" rx="0.6"
        fill="#0c0e10" stroke="#1b1e22" stroke-width="0.25"/>
  <rect id="keyway" x="4.055" y="0.4" width="4.79" height="1.3" rx="0.15" fill="#23282d"/>
  <rect id="ferrule" x="3.4" y="2.75" width="6.1" height="2.5" rx="0.2"
        fill="#30363d" stroke="#4a4f55" stroke-width="0.1"/>
  <circle id="pin-l" cx="4.15" cy="4" r="0.35" fill="#b9bfc6"/>
  <circle id="pin-r" cx="8.75" cy="4" r="0.35" fill="#b9bfc6"/>
