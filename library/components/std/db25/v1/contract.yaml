format: 1
kind: component
name: db25
version: 1.0.0
class: port
profile: networking
conforms: db25
interface: db25
description: >-
  D-subminiature DB-25 receptacle - twenty-five contacts in two rows, thirteen
  over twelve, in the size B shell; the power-shelf status connector on
  equipment such as the Nokia 7750 SR-12 DC PEM-3
size: {w: 42.52, h: 11.40, d: 6.50}
size-confidence: {w: drawing, h: drawing, d: estimated}
size-notes: >-
  w and h are the 25-position panel cutout in TE 114-40010 Rev G Figure 3 (C
  dimension 42.52; 11.40 high for every shell). d is Figure 4's mating
  dimension for 25 and 37 position, standing in for an unmeasured setback.
attrs: {media: db25}
provenance:
  size: >-
    standard - TE application specification 114-40010 Rev G, Figure 3, mounting
    panel cutout: C dimension 42.52 for 25 positions (the B shell), 11.40 high,
    10 degrees +/-2 of taper on the two sloped sides and a 3.35 radius in four
    places. The same figure puts the mounting holes at 47.04 centres (A
    dimension), diameter 3.05 plain or 4.83 with screwlocks. The height, taper
    and radius are drawn once for every shell, so only the width differs from
    std/db9@1's E-shell 20.47 and std/da15@1's A-shell 28.80.
  depth: >-
    estimated - 6.50 is the MATING DIMENSION from 114-40010 Figure 4 for 25 and
    37 position, 'needed to ensure full mating of connectors' (6.73 for 9 and
    15, which std/db9@1 and std/da15@1 carry). As on those parts, it is how far
    the plug engages rather than a measured recess.
  gender: >-
    document - female. The SR-12 guide's section 13.1.3 (p259, Table 110)
    describes the AC status cable as running from the power shelf's Alarm
    connector 'to female DB-25 connectors on the DC PEM-3s'. Pins are therefore
    numbered as a receptacle's face seen from the front: 1 to 13 along the top
    row right to left, 14 to 25 along the bottom row right to left.
  pins: >-
    estimated - thirteen over twelve, the lower row offset half a pitch, at 2.76
    pitch and 2.84 row separation. Those figures are 114-40010 Figure 6's
    printed circuit board footprint for the 25-position right-angle part (A
    dimension 2.76, D half-pitch 1.379; rows 2.84 for every size), whose tails
    mirror the contact field; no document held dimensions the face itself. The
    socket openings are drawn 1.0 across, which is not dimensioned anywhere
    held.
  shell: >-
    estimated - THE OUTLINE DRAWN IS THE SHELL, NOT THE APERTURE: 42.27 x 10.50
    inside the 42.52 x 11.40 cutout, carrying std/db9@1's photo-measured
    clearance (0.125 a side in x, 0.45 in y) across to the B shell rather than
    measuring it on one.
  insert: >-
    estimated - a near-black insulator, flush with the shell lip as a female
    receptacle's is (std/vga@1 and std/da15@1 the precedent), 0.90 inside the
    shell as on std/db9@1. The colour is not taken from a photograph of the
    PEM-3, which is not staged.
elements:
  opening: {at: [0.0, 0.0], size: [42.52, 11.40], class: cutout}
relief:
  wall: '#3a3e43'
  features:
  # THE SHELL STANDS PROUD - see std/db9@1 and std/da15@1, the same shell
  # family with the same correction. Drawn as a ring so it builds as a tube.
  - node: opening
    out: 6.50
    shape: true
    color: '#5c6268'
    confidence: estimated
    source: >-
      6.50 is this contract's own `d`, 114-40010 Figure 4's mating dimension for
      25 and 37 position. THE DIRECTION IS THE SOURCED PART: a D-sub passes
      through its cutout rather than sitting behind it.
  # FLUSH WITH THE LIP AND PIERCED, the female half - std/da15@1's arrangement.
  # The twenty-five bores are subpaths of the insert's outline, so they build
  # as holes through the face rather than discs standing on it.
  - node: insert
    out: 6.50
    shape: true
    color: '#2b2e33'
    confidence: estimated
    source: >-
      6.50 is this contract's `d`, so the insert face lands level with the shell
      lip. The PEM-3's status connector is female (SR-12 guide p259, 'female
      DB-25 connectors on the DC PEM-3s'), and a receptacle presents its
      insulator at the face. The flush setback is sourced from what the
      connector is; the millimetres are not dimensioned anywhere held.
connection-points:
  mate: {at: [21.26, 5.70], direction: front}
skins: [default]
