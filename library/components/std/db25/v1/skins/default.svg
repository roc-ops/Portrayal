<svg xmlns="http://www.w3.org/2000/svg" width="42.52mm" height="11.4mm" viewBox="0 0 42.52 11.4">
  <!-- THE OUTLINE IS THE SHELL, NOT THE HOLE. `size` 42.52 x 11.40 is the
       MOUNTING PANEL CUTOUT for the 25-position (B) shell from TE 114-40010
       Rev G Figure 3; the shell passes THROUGH it and is drawn 42.27 x 10.50
       inside it, the same clearance std/db9@1 reads off a photograph of the E
       shell. Shape per Figure 3: 10 degrees +/-2 of taper a side, 3.35 radius
       in four places. This is std/da15@1's outline with its two flats
       lengthened by 13.72, the difference between the two C dimensions. -->
  <!-- A RING, so 3D builds the shell as a tube round the insert rather than a
       slab over it. -->
  <path id="opening" fill-rule="evenodd"
        d="M0.818 4.382 A3.350 3.350 0 0 1 4.117 0.450 L38.403 0.450 A3.350 3.350 0 0 1 41.702 4.382 L41.032 8.182 A3.350 3.350 0 0 1 37.733 10.950 L4.787 10.950 A3.350 3.350 0 0 1 1.488 8.182 Z M1.546 4.225 A2.450 2.450 0 0 1 3.959 1.350 L38.561 1.350 A2.450 2.450 0 0 1 40.974 4.225 L40.304 8.025 A2.450 2.450 0 0 1 37.891 10.050 L4.629 10.050 A2.450 2.450 0 0 1 2.216 8.025 Z" fill="#5c6268" stroke="#9aa0a6" stroke-width="0.35"/>
  <!-- THE BORES, DRAWN BEHIND THE INSERT so they have something to be - the
       std/vga@1 and std/da15@1 arrangement. The insert is pierced by the same
       twenty-five circles, so in 3D each is a hole through a solid face. -->
  <g id="socket-floor">
    <circle cx="4.7" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="7.46" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="10.22" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="12.98" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="15.74" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="18.5" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="21.26" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="24.02" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="26.78" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="29.54" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="32.3" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="35.06" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="37.82" cy="4.28" r="0.5" fill="#050607"/>
    <circle cx="6.08" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="8.84" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="11.6" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="14.36" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="17.12" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="19.88" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="22.64" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="25.4" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="28.16" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="30.92" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="33.68" cy="7.12" r="0.5" fill="#050607"/>
    <circle cx="36.44" cy="7.12" r="0.5" fill="#050607"/>
  </g>
  <!-- FEMALE, FLUSH AND PIERCED. The Nokia SR-12 guide (p259 section 13.1.3)
       calls the PEM-3 status connector a "female DB-25". Thirteen over
       twelve, the lower row offset half a pitch, numbered from the top right
       as a receptacle's face is. Pitch 2.76 and row separation 2.84 are TE
       114-40010 Figure 6's board footprint for the 25-position part, standing
       in for the face field it mirrors. -->
