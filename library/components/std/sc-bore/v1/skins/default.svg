<svg xmlns="http://www.w3.org/2000/svg" width="8.39mm" height="9mm" viewBox="0 0 8.39 9">
  <!-- ONE SC OPENING, KEY SLOT LEFT. The 7.5 x 9.0 opening runs x 0.89-8.39;
       the key slot is the 0.89 x 2.1 notch in its left wall, centred on it.
       Both printed on SENKO DS-SC-000010 / DS-SC-000011 (see the contract).
       Placements that want the slot elsewhere say rotate. -->
  <path id="bore" fill="#15181b" d="
    M 0.89 0 H 8.39 V 9 H 0.89 V 5.55 H 0 V 3.45 H 0.89 Z"/>
  <!-- the two moulded latch fingers, above and below the collar -->
  <rect id="hook-upper" x="1.9" y="0.9" width="5.48" height="0.9" fill="#23272b"/>
  <rect id="hook-lower" x="1.9" y="7.2" width="5.48" height="0.9" fill="#23272b"/>
  <!-- collar 4.685, sleeve 3.302, ferrule 2.5 - concentric on the opening -->
  <circle id="collar" cx="4.64" cy="4.5" r="2.34" fill="#262a2f" stroke="#3a4046" stroke-width="0.12"/>
  <circle id="sleeve" cx="4.64" cy="4.5" r="1.65" fill="#1e2226"/>
  <circle id="ferrule" cx="4.64" cy="4.5" r="1.25" fill="#e8ecef"/>
</svg>
