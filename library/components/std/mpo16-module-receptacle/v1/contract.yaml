relief:
  # CAVITY ALONE, NO POCKET, as on std/mpo16@1: `relief.cavity` names the skin node
  # whose art is the recess and the depth is `size.d`. The ferrule and the pins
  # are `top` features standing up from the floor, the way std/lc-bore@3 and
  # std/sc-bore@1 stand their ferrules, so nothing is a slab over the mouth.
  wall: '#15181b'
  cavity: opening
  features:
    - node: ferrule
      top: 5.0
      confidence: estimated
      source: >-
        NOT MEASURED - see provenance.recess. The top of this box carries the
        fibre dots, which are painted on it.
    - node: pin-l
      top: 6.8
      color: '#b9bfc6'
      confidence: estimated
      source: >-
        the ferrule face plus the printed 1.8 the guide pins stand
        proud of it (US Conec C17864 rev H, C18012 rev F and C21364 rev C, 1.8); the face itself is estimated
    - node: pin-r
      top: 6.8
      color: '#b9bfc6'
      confidence: estimated
      source: the same reading as pin-l
connection-points:
  mate: {at: [6.45, 4.0], direction: front}
skins: [default]
