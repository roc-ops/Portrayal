format: 1
kind: component
name: mpo16-module-receptacle
version: 1.0.0
interface: mpo16
class: port
profile: networking
conforms: mpo-adapter
optical: {positions: 16}
description: >-
  One MPO-16 receptacle as a module carries it - the mouth an MTP-16 plug
  enters on a transceiver, looked into: a dark cavity, the key notch in its
  top wall OFFSET from the centreline, and the MT ferrule at the back with two
  guide pins and a row of sixteen fibres. The same opening as std/mpo16@1 and
  the same interface, so it offers the same plug and dust cap; std/mpo16@1
  stays the panel adapter's open sleeve.
size: {w: 12.9, h: 8.0, d: 9.0}
size-confidence: {w: estimated, h: estimated, d: estimated}
attrs: {media: fiber, connector: mpo16}
provenance:
  size: >-
    ESTIMATED, borrowed - the 12.9 x 8.0 mouth of std/mpo16@1, the same opening
    seen on a module and not on a panel: SFF-8436 Rev 4.9 section 5.1 says a
    module receptacle meets the MPO adapter interface of IEC 61754-7. See
    std/mpo16@1 for the derivation (the printed 12.5 x 7.6 plug plus a measured
    clearance). The size box is kept so an optic that composed std/mpo16@1 keeps
    its layout.
  depth: >-
    ESTIMATED at 9.0, the figure std/mpo16@1 carries. No document held gives the
    depth of a module receptacle.
  what-differs: >-
    WHY A SECOND PART FOR ONE OPENING. std/mpo16@1 draws what a panel adapter
    shows: a pale sleeve, open through to the other side. Looked into, a
    module is a dark cavity with the MT ferrule at the back, its two guide
    pins and the fibre row. The interface, the mate point and the size are
    the same, so the slot offers the same plugs and caps.
  gender: >-
    datasheet - PINNED. QSFP-DD HW Rev 6.3 section 6.2.1 notes two alignment pins present in each receptacle. The plugs that land here are
    unpinned.
  ferrule: >-
    drawing, measured, undimensioned - 6.36 x 2.46, the window the MT ferrule
    stands in on US Conec customer drawing C17864 rev H, sheet 2 front view
    (6.35 x 2.46 on C18012 rev F), as generic/mpo16-plug@1 records it, centred
    on the opening. The receptacle's own ferrule is the mating half of that
    one; no drawing of a module receptacle is held.
  guide-pins: >-
    the pitch is 5.3: the US Conec MTP-16 handout SM-0022-0823 p1 prints
    5.3mm, and the bores measure 5.30 apart on C17864 rev H and 5.31 on SENKO
    DS-MPO-000001 Rev B p4. THE PIN DIAMETER IS NOT DIMENSIONED in anything
    held: 0.6 is drawn, inside the 0.56 to 0.63 the bores the pins enter
    measure on C17864, so it is a measured bore and an estimated pin.
  keyway: >-
    ESTIMATED, derived from the plug - OFFSET 1.12 FROM THE CENTRELINE, TO
    THE RIGHT LOOKING INTO THE RECEPTACLE. The MTP-16 key moulding is 3.65
    wide and 0.68 tall, its centre 1.12 from the housing centreline and its
    outer edge 0.40 inside the flat (US Conec C17864 rev H and C18012 rev F,
    measured; SENKO DS-MPO-000001 Rev B p4 gives 1.13). THE CONVENTION: this
    view looks INTO the receptacle, which is the mirror of the plug seen on
    its own end face. On the end face the key is offset to the left; looking
    in, and on a seated plug seen from its boot end, it is to the right. The
    JPC 400G QSFP-DD SR8 datasheet p10 lane figure draws exactly that: key up
    and right of centre looking into the receptacle. The notch is the key
    where a seated generic/mpo16-plug@1 puts it, plus 0.2 a side: 4.05 x
    1.08, from 0.4 below the top of the mouth. No drawing held dimensions the
    keyway itself (TIA-604-18 and IEC 61754-7-3 would).
  fibre-positions: >-
    ELEMENTS 1 TO 16 ARE THE FIBRES, drawn as dots 0.125 across on the
    ferrule, one row through its centre at the 0.25 pitch
    (the US Conec handout prints 0.25mm within the row; 0.2496 measured on C17864). THIS VIEW LOOKS INTO THE RECEPTACLE, key up, and
    position 1 is at the RIGHT. That is the mirror of a plug seen on its own
    end face, where key up puts fibre 1 at the left (ANSI/TIA-568.3-D, as
    generic/mpo12-plug@1 cites it), and it is the same side the library draws
    a SEATED plug's fibre 1 on, because a seated plug is seen from its boot
    end, looking the same way. So position n here is where fibre n of the
    seated plug lands, as on the panel adapters. WHICH POSITIONS TRANSMIT AND
    WHICH RECEIVE IS NOT STATED: that is a fact about the module a wrapper is,
    and a generic states none.
  recess: >-
    ESTIMATED, every figure. The ferrule face stands 5.0 up from the floor of
    the 9.0 cavity, so 4.0 behind the mouth: the maintainer's end-on
    photograph of a QSFP28 SR4 shows the ferrule recessed, and nothing
    dimensions how far. The pins stand 1.8 proud of the ferrule face,
    which is printed (US Conec C17864 rev H, C18012 rev F and C21364 rev C, 1.8).
