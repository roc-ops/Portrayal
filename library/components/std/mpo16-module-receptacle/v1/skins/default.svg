<svg xmlns="http://www.w3.org/2000/svg" width="12.9mm" height="8.0mm" viewBox="0 0 12.9 8.0">
  <!-- An MPO receptacle on a MODULE, looked into, key up: a dark cavity, the
       key notch in its top wall, the MT ferrule at the back with its two
       guide pins and the fibre row. Same 12.9 x 8.0 mouth as std/mpo16@1.
       The fibres are real ink, dots 0.125 across at the 0.25 pitch, position 1
       at the right (the contract's provenance.fibre-positions). -->
  <rect id="opening" x="0" y="0" width="12.9" height="8.0" rx="0.6"
        fill="#0c0e10" stroke="#1b1e22" stroke-width="0.25"/>
  <rect id="keyway" x="5.545" y="0.4" width="4.05" height="1.08" rx="0.15" fill="#23282d"/>
  <rect id="ferrule" x="3.27" y="2.77" width="6.36" height="2.46" rx="0.2"
        fill="#30363d" stroke="#4a4f55" stroke-width="0.1"/>
  <circle id="pin-l" cx="3.8" cy="4" r="0.3" fill="#b9bfc6"/>
  <circle id="pin-r" cx="9.1" cy="4" r="0.3" fill="#b9bfc6"/>
