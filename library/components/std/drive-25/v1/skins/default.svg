<svg xmlns="http://www.w3.org/2000/svg" width="15.0mm" height="69.85mm" viewBox="0 0 15.0 69.85">
  <!-- 2.5 inch drive per SFF-8201 Rev 3.4: A4 69.85 wide, A1 15.00
       thick, drawn STANDING ON EDGE at {W} x {H}.
       THE FRONT EDGE IS BLANK. A hot-swap drive enters connector first,
       so this face carries no connector, label, lamp or latch - all of
       those are the carrier's, and the carrier is the vendor's. -->
  <rect x="0.25" y="0.25" width="14.50" height="69.35" rx="0.8" fill="#8f959b" stroke="#5b6167" stroke-width="0.5"/>
  <!-- the chamfer along the leading edge, which is what makes a drive
       end read as a drive end rather than as a blank rectangle -->
  <path d="M1.6 1.6 H13.40 V68.25 H1.6 Z" fill="none" stroke="#a7adb3" stroke-width="0.4"/>
</svg>
