<svg xmlns="http://www.w3.org/2000/svg" width="32.4mm" height="24.4mm" viewBox="0 0 32.4 24.4">
  <!-- aperture: panel cutout 32.4 x 24.4, max R4.5 (SCHURTER C20 drawing) -->
  <rect id="opening" x="0" y="0" width="32.4" height="24.4" rx="4.5" fill="#17191c"/>
  <!-- cavity: C19/C20 coupler recess - a plain rounded rectangle. No chamfers:
       unlike C13/C14 this coupler is not keyed by shape. Proportional, not dimensioned. -->
  <rect id="inlet-face" x="2.7" y="2.7" width="27.0" height="19.0" rx="3" fill="#0d0f11"/>
  <rect id="pin-earth"   x="14.8" y="5.8"  width="2.8" height="5.4" rx="0.3" fill="#7a8087"/>
  <rect id="pin-line"    x="7.6"  y="12.4" width="2.8" height="5.4" rx="0.3" fill="#7a8087"/>
  <rect id="pin-neutral" x="22.0" y="12.4" width="2.8" height="5.4" rx="0.3" fill="#7a8087"/>
</svg>
