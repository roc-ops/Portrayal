<svg xmlns="http://www.w3.org/2000/svg" width="32.4mm" height="24.4mm" viewBox="0 0 32.4 24.4">
  <!-- aperture: panel cutout 32.4 x 24.4, max R4.5 (SCHURTER C20 drawing) -->
  <rect id="opening" x="0" y="0" width="32.4" height="24.4" rx="4.5" fill="#17191c"/>
  <!-- cavity: C19/C20 coupler recess - a plain rounded rectangle, 29.0 x 21.0 measured off
       the SCHURTER front view at its own scale. No chamfers: unlike C13/C14 this coupler is
       not keyed by shape. -->
  <rect id="inlet-face" x="1.7" y="1.7" width="29.0" height="21.0" rx="2.2" fill="#0d0f11"/>
  <!-- blades: all three lie ALONG the long side (IEC 60320: pins parallel to the long axis).
       Line/neutral centres 13.0 apart, earth 8.0 above their line, the triangle centred on the
       face. Cross-sections measured, not dimensioned: earth 6.2 x 2.2, line/neutral 5.3 x 2.2. -->
  <rect id="pin-earth"   x="13.1"  y="7.1"  width="6.2" height="2.2" rx="0.3" fill="#7a8087"/>
  <rect id="pin-line"    x="7.05"  y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087"/>
  <rect id="pin-neutral" x="20.05" y="15.1" width="5.3" height="2.2" rx="0.3" fill="#7a8087"/>
</svg>
