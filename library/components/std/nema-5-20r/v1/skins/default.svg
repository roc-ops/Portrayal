<svg xmlns="http://www.w3.org/2000/svg" width="27mm" height="27mm" viewBox="0 0 27 27">
  <!-- NEMA 5-20R single receptacle face, as Qualtek 739W-X2/30 draws its snap-in
       T-slot receptacle: a flat 27 x 27 face, the U earth hole up, the line slot
       on the left and the T neutral slot - the 5-20 key, taking a 5-15P or a
       5-20P - on the right. The three holes are `pocket` features. -->
  <rect id="face" x="0" y="0" width="27" height="27" rx="0.5" fill="#2a2c2f" stroke="#4a4d51" stroke-width="0.25"/>
  <path id="hole-earth" d="M 8.25 4.47 H 13.53 V 7.14 A 2.64 2.64 0 0 1 8.25 7.14 Z" fill="#050505"/>
  <rect id="slot-line" x="3.42" y="15.49" width="2.22" height="6.99" fill="#050505"/>
  <path id="slot-neutral" d="M 16.02 14.77 H 18.24 V 18.0 H 23.43 V 20.2 H 18.24 V 23.37 H 16.02 Z" fill="#050505"/>
</svg>
