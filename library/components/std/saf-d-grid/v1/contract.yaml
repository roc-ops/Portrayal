  cavity: inlet-face
  features:
    - node: contact-ground
      top: 14.0
      color: '#c0c5cb'
      confidence: estimated
      source: >-
        std/saf-d-grid@1 itself - 115171S1 dimensions the panel cutout, the
        flange and the body depth but NOT the contact geometry, so how far a
        blade stands into the coupler has no source. The same gap std/c14-inlet
        records for its pins.
    - node: contact-positive
      top: 14.0
      color: '#c0c5cb'
      confidence: estimated
      source: >-
        std/saf-d-grid@1 itself - 115171S1 dimensions the panel cutout, the
        flange and the body depth but NOT the contact geometry, so how far a
        blade stands into the coupler has no source. The same gap std/c14-inlet
        records for its pins.
    - node: contact-negative
      top: 14.0
      color: '#c0c5cb'
      confidence: estimated
      source: >-
        std/saf-d-grid@1 itself - 115171S1 dimensions the panel cutout, the
        flange and the body depth but NOT the contact geometry, so how far a
        blade stands into the coupler has no source. The same gap std/c14-inlet
        records for its pins.
