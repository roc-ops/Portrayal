format: 1
kind: component
name: saf-d-grid
version: 1.1.0
class: inlet
profile: networking
conforms: saf-d-grid
interface: saf-d-grid
description: >-
  Anderson Saf-D-Grid appliance inlet - the panel cutout with the keyed coupler
  recessed behind it, a first-mate last-break ground above a positive and a
  negative. It sits in roughly the space an IEC C14 takes and carries several
  times the current through it, which is why a 1.6 kW supply on a 90 V low line
  uses one.
size: {w: 26.8, h: 19.9, d: 17.0}
attrs: {media: ac, input: ac}
provenance:
  size: >-
    standard - Anderson Power Products drawing 115171S1 rev 12 (ECN 2024-0034,
    2024-03-13), whose "RECOMMENDED PANEL CUT-OUT" block reads 26.80 +0.10/-0.00
    x 19.90 +0.10/-0.00 mm, corners R2.5 MAX TYP. APP's Saf-D-Grid data sheet
    repeats the same figure under the heading "Panel Cut Out For All Receptacle
    Types", so one aperture serves every variant - unlike the C14 range, whose
    cutout is series-specific.
  depth: >-
    standard, and MEASURED rather than estimated, which is rare for an inlet
    here. The side view on 115171S1 dimensions the body 17.0 mm behind the panel
    and 5.8 mm proud of it. That is the ultra-short 2006 series, which is the
    shallowest; the flush-mount variants run deeper and the data sheet dimensions
    those separately. std/c14-inlet's own depth is estimated because its
    datasheet does not dimension the shroud interior; this one does.
  what-the-skin-draws: >-
    SIX NODES, THREE OF THEM CONTACTS. `opening` is the panel cutout; `inlet-face` is the
    coupler cavity behind it; `pocket-left` and `pocket-right` are the housing's two upper
    keying recesses, which carry no contact and take no relief; and `contact-ground`,
    `contact-negative` and `contact-positive` are the three blade receptacles the drawing
    labels. The relief block below targets the three contacts, as it did before 1.1.0, so
    nothing downstream of it changed name.
  it-also-fits-a-c14-hole: >-
    NOTE 4 OF THE DRAWING SAYS SO OUTRIGHT - "OR USE WITH IEC320 C14 PANEL
    CUT-OUTS" - and the two apertures are NOT the same number: 28.0 x 20.0
    against this 26.8 x 19.9. A Saf-D-Grid receptacle in a C14 cutout is a part
    in an oversized hole, which is the vendor's own allowance. It is worth
    knowing because a chassis drawing that shows a C14-sized opening with a
    Saf-D-Grid in it is not a contradiction, and because conforming this part to
    `c14-inlet` to make a hole line up would put the wrong standard on it.
  coupler-face: >-
    MEASURED SINCE 1.1.0, AND THE DRAWING WAS ON DISK THE WHOLE TIME. Until then this
    key read "PROPORTIONAL, NOT DIMENSIONED" and the skin drew three rounded rectangles
    sized to read rather than to measure. 115171S1 does not dimension the contacts, but
    it DRAWS them, in a front view that carries its own dimensioned 31.0 x 24.0 flange -
    so the flange calibrates the view and every feature in it can be read off.
    HOW IT WAS READ. working/intake/standards/saf-d-grid/sdg-115171s1.pdf rendered at
    900 dpi; the front view's flange measures 1104 x 859 px against the stated 31.0 x
    24.0, which is 35.34 px/mm and closes to 31.24 x 24.31 - inside the line width. Scan
    lines across the view then give, in FLANGE coordinates: the ground blade opening
    x 11.47-19.55 by y 5.6-8.3; its stem x 13.56-17.20 (interior 13.80-17.20, centre
    15.50 against the flange's own 15.5); the negative x 5.77-13.00 and the positive
    x 18.00-25.25, both y 14.3-19.5; and the two upper keying pockets at x 6.7-10.3 and
    20.7-24.3 by y 3.7-8.9. The two lower contacts are 7.23 and 7.25 wide - one part,
    read twice - and their centres sit 6.12 either side of the flange's midline.
    THE SKIN IS DRAWN IN THE CUTOUT'S FRAME, which is the flange's less the 2.10 x 2.05
    the cutout is inset by, since the cutout is centred on the flange.
    THE CAVITY IS SIX-SIDED, NOT A ROUNDED RECTANGLE, and 1.1.0's first cut got that wrong too.
    Tracing the front view row by row gives a shield: a flat top from x 6.31 to 24.81 at y 3.04,
    chamfers down and out to the full width at y 6.20, straight sides at x 3.60 and 27.44 - held
    to within 0.1 mm from y 12.6 to 19.6, which is what makes them straight rather than curved -
    and a radiused bottom at y 21.22. Those chamfers are the shape's signature: they are what a
    reader recognises when the part is turned on its side, and they are what settles which way a
    device has mounted it. Drawn as a rounded rectangle the part loses the only cue it has.
    Two diagonals in the upper corners of the FLANGE are not part of this outline; they are
    moulded gussets running from the flange's own corner down to its inner edge, and reading
    them as the cavity is how the first trace went wrong.
    THE CAVITY IS ONE HOLE AND THE WEB IS ONE PIECE, AND IT TOOK FIVE CUTS OF 1.1.0 TO DRAW
    THAT. The Edgecore AIS800 elevation, which is this part rendered by a vendor's CAD, was
    thresholded inside the inlet and gives exactly one black connected component - the cavity -
    and exactly one grey component inside it: 212,167 px at 50.66 px/mm, x 37.36-47.75 by
    y 10.01-30.18 mounted. Its row runs resolve into seven rectangles, mirror-symmetric: an
    outer tine along each side edge, an inner tine beside it, a bridge joining each pair at the
    base, and a bar joining the two bridges. Two forks and a bar. The black between a fork's
    tines is a pocket, open into the cavity; the black between the bridges is the ground
    pocket, and the bar is its far wall, with the contact visible in it as a lighter rectangle.
    NOTHING IN THE CAVITY IS A HOLE IN A BLOCK. Cuts one to four drew three light shapes in a
    black field, then blocks with painted slots, then blocks with sunk slots. All were three
    islands with three holes, and no plug could mate with them. The Anderson drawing's front
    view outlines the pockets, which is how they were read as blocks; its isometric shows the
    web joined into one, and the elevation's single component is what settled it.
    THE CHAMFERS ARE HALF THE CAVITY'S HEIGHT. Per row on the elevation the D's right edge sits
    at 51.65 for y 12.4-27.8 and runs from (42.77, 8.05) to (51.44, 11.71) above that and its
    mirror below: an 8.7 mm rise for a 3.7 mm run. 115171S1's front view has the same two
    diagonals in its upper corners, from flange (4.72, 3.6) to (2.20, 11.1), which the first
    trace dismissed as flange gussets and drew instead as a 3.2 x 2.6 corner. They are the
    cavity. Reading them wrong halved the shape's one recognisable feature.
    WHAT THE SHAPE MEANS. The ground is not a bar over two blades; it is a T - a wide
    blade across the top whose stem runs down BETWEEN the positive and the negative,
    which is the first-mate last-break geometry the family is sold on. A face drawn as
    three separate rectangles cannot show that, and the T is what makes the part
    recognisable against an IEC C14 at a glance.
    WHAT IS STILL NOT SOURCED: the depth each contact sits at behind the face. The
    relief entries below say so individually.
  the-flange-is-not-this-aperture: >-
    31.0 x 24.0 is the bezel that lands on the metal AROUND the hole, and it is
    deliberately not this part's size - the same layering the components README
    describes for std/usb-a's 12.0 x 4.5 inside common/usb-a's 17 x 7. A wrapper
    part carrying the flange, the latch ears and the APP marking belongs in
    common/ when a device needs it drawn; nothing does yet.
  rating: >-
    data sheet and drawing together. Note 5 of 115171S1: "20A, 600V NOT FOR
    CURRENT INTERRUPTION; 20A, 400V FOR CURRENT INTERRUPTION", temperature rating
    105 C, housing high-temperature nylon with 30 percent glass fill to UL 94
    V-0 and halogen free, contacts silver-plated copper alloy. The data sheet's
    family page goes further - "up to 40A and 600V DC or AC within the same space
    of the IEC 320 C13 & C14 system that is limited to 10A and 250 VAC" - across
    variants this aperture does not distinguish.
  who-uses-it: >-
    THREE VENDORS IN THIS CORPUS, WHICH IS WHY IT IS A std/ PART AND NOT A CISCO
    ONE. Cisco's ASR 9901 takes it on the A9K-1600W-AC, and Table 11 of the
    fixed-port Hardware Installation Guide lists sixteen CAB-AC-*-SG-* cords for
    it. Juniper names "SAF-D-Grid 400" in the MX960, MX2008, MX2010, MX2020,
    QFX5120, QFX5230 and QFX5241 cord tables. Dell's PowerEdge R670, R770, R6715,
    R6725, R7715 and R7725 technical guides list "APP/Saf-D-Grid" against their
    277 VAC and HVDC supplies. Twenty-four staged documents mention it.
elements:
  opening: {at: [0.0, 0.0], size: [26.8, 19.9], class: cutout}
relief:
  wall: '#141619'
  cavity: inlet-face
  features:
    - node: contact-web
      top: 14.0
      color: '#858a90'
      confidence: estimated
      source: >-
        std/saf-d-grid@1 itself. The web is the housing's own plastic standing in the cavity;
        115171S1 dimensions the cutout, the flange and the body depth and never how far the
        web stands up inside the recess, so 14.0 of a 17.0 cavity - three millimetres below
        the face - is read off the isometric, not a dimension. It is the housing's grey and
        not a metal, and it is ONE node, because it is one piece: the three pockets are the
        black between its tines, not holes in three blocks, and a 3D build must show a
        single hole with a single shape in it, which is what a plug is the inverse of.
        IT IS ONE PATH, NOT SEVEN RECTANGLES. The first union was drawn as its parts and each
        carried an outline, so the seams showed and it read as pieces; the web is traversed
        once now. THE GROUND POCKET IS A T, NOT A U, and cut six got that backwards by
        filling its corners and filleting the side pockets: the elevation's row runs show
        the bridges stopping 2.2 mm short of the bar, so under the bar the pocket widens to
        7.6 between the two posts, then narrows to 5.2 between the bridges and runs to the
        open bottom, with a 45-degree cut into each bridge's inner corner where it widens.
        The side pockets are square. Each inner tine's tip is cut at 45 on the corner facing
        the cavity's chamfer, so the tine follows the D. A chamfer cut into the web widens a
        pocket; one cut into a pocket narrows it, and only the first is what the part has.
connection-points:
  mate: {at: [13.4, 9.95], direction: front}
skins: [default]
