<svg xmlns="http://www.w3.org/2000/svg" width="20.47mm" height="11.4mm" viewBox="0 0 20.47 11.4">
  <!-- THE OUTLINE IS THE SHELL, NOT THE HOLE. `size` 20.47 x 11.40 is the
       MOUNTING PANEL CUTOUT from TE 114-40010 Figure 3 and stays that; the
       shell passes THROUGH it and so is drawn smaller, 20.22 x 10.50, which is
       the clearance a photograph of the port shows. Painting the cutout solid
       is what made this connector render as big as its own hole.
       Shape per Figure 3: 10 degrees +/-2 of taper a side, 3.35 radius in four
       places where the flats meet the slopes. The insert is a separate path
       because it is a separate part - a metal shell with an insulator in it -
       and that is what lets 3D say one sits behind the other. -->
  <path id="opening" d="M0.818 4.382 A3.350 3.350 0 0 1 4.117 0.450 L16.353 0.450 A3.350 3.350 0 0 1 19.652 4.382 L18.982 8.182 A3.350 3.350 0 0 1 15.683 10.950 L4.787 10.950 A3.350 3.350 0 0 1 1.488 8.182 Z" fill="#5c6268" stroke="#9aa0a6" stroke-width="0.35"/>
  <path id="insert" d="M1.546 4.225 A2.450 2.450 0 0 1 3.959 1.350 L16.511 1.350 A2.450 2.450 0 0 1 18.924 4.225 L18.254 8.025 A2.450 2.450 0 0 1 15.841 10.050 L4.629 10.050 A2.450 2.450 0 0 1 2.216 8.025 Z" fill="#055760" stroke="#02333a" stroke-width="0.2"/>
  <!-- Nine contacts, five over four. DE-9 ON EQUIPMENT IS MALE: these
       are PINS and catch light, which is the difference a viewer uses
       to tell this port from the VGA beside it. Pitch and row
       separation are NOT SOURCED and the contract says so. -->
  <g id="pins" fill="#cfd6dd">
    <circle cx="4.97" cy="4.23" r="0.52"/>
    <circle cx="7.63" cy="4.23" r="0.52"/>
    <circle cx="10.30" cy="4.23" r="0.52"/>
    <circle cx="12.97" cy="4.23" r="0.52"/>
    <circle cx="15.63" cy="4.23" r="0.52"/>
    <circle cx="6.35" cy="7.36" r="0.52"/>
    <circle cx="9.02" cy="7.36" r="0.52"/>
    <circle cx="11.68" cy="7.36" r="0.52"/>
    <circle cx="14.35" cy="7.36" r="0.52"/>
  </g>
</svg>
