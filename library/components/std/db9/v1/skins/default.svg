<svg xmlns="http://www.w3.org/2000/svg" width="20.47mm" height="11.4mm" viewBox="0 0 20.47 11.4">
  <!-- The D of D-subminiature: 10 degrees of taper a side per TE 114-40010
       Figure 3, so an 11.40 drop insets each edge by 11.40*tan(10) = 2.01 and
       the narrow edge comes out at 16.45. Wide edge up is the usual mounting. -->
  <path id="opening" d="M0 0 H20.47 L18.46 11.4 H2.01 Z" fill="#17191c"/>
  <!-- Nine contacts, five over four. NOT SOURCED - neither document held here
       dimensions the contact pitch or the row separation, so this field is
       decoration and the contract says so. -->
  <g fill="#8b9199">
    <circle cx="4.4" cy="4.0" r="0.55"/>
    <circle cx="7.4" cy="4.0" r="0.55"/>
    <circle cx="10.4" cy="4.0" r="0.55"/>
    <circle cx="13.4" cy="4.0" r="0.55"/>
    <circle cx="16.4" cy="4.0" r="0.55"/>
    <circle cx="5.9" cy="7.4" r="0.55"/>
    <circle cx="8.9" cy="7.4" r="0.55"/>
    <circle cx="11.9" cy="7.4" r="0.55"/>
    <circle cx="14.9" cy="7.4" r="0.55"/>
  </g>
</svg>
