format: 1
kind: component
name: din-1-0-2-3
version: 1.0.1
class: port
profile: networking
conforms: din-1-0-2-3
interface: din-1-0-2-3
description: 1.0/2.3 push-pull coaxial panel jack core (DIN 41626/2) - the round
  hole and the plain barrel with its collar, latch groove, bore and contact.
  The spanner nut in front of the panel is wider than the hole and belongs to
  the bezel, common/din-1-0-2-3-jack, which composes this core. 50 and 75 ohm
  variants share the interface, so a placement that knows says
  attrs.impedance.
size: {w: 5.59, h: 5.59}
size-confidence: {w: drawing, h: drawing}
size-notes: >-
  The round .220 inch [5.59] hole named in the title of Pasternack PE44259
  REV 1.1. See the registry key din-1-0-2-3.
attrs: {media: coax-din-1-0-2-3}
provenance:
  size: >-
    drawing - registry key din-1-0-2-3, the .220 inch [5.59] round hole of the
    Pasternack drawing PE44259 REV 1.1 (1.0/2.3 jack bulkhead mount, solder
    attachment, thru hole PCB), for the M5.5 x 0.5 thread that PE44259,
    Pasternack PE44254 and L-com RFPCB-1.0/2.3FS-4G72 rev A all dimension.
  standard: >-
    The HUBER+SUHNER general catalogue 2020 (3628 78Z034, p.239) says its 1.0/2.3
    interface dimensions conform to DIN 41626/2 and names no other standard.
    IEC 61169-29 is the international part for the series, cited by the design
    note and not held here.
  core-and-bezel: >-
    This is the CORE, as std/sma is to common/sma-jack. The three mounting
    drawings agree that the jack is rear-mounted, flange behind the panel and
    the round spanner nut IN FRONT of it. The nut is 7.01 across, wider than
    the hole, so it is the bezel common/din-1-0-2-3-jack; everything drawn
    here lies inside the hole box.
  barrel: >-
    drawing - HUBER+SUHNER general catalogue 2020 (3628 78Z034), p.239, jack
    table: tube outside dia I 4.03-4.15 (drawn 4.09; PE44259 scales 4.16),
    tube inside dia N 3.00-3.06 (drawn 3.03, the dark bore), and a collar dia
    K 4.72-4.75 (drawn 4.735) starting C/D 5.80-6.50 behind the front face
    (drawn 6.15). The front ring before the latch groove is 1.4 long (L-com
    RFPCB-1.0/2.3FS-4G72 rev A side view, .055 [1.4], dimensioned). The latch
    groove, about 1.4 to 2.2 behind the front at about dia 3.6, is SCALED off
    PE44259 p.3 (checked against its dimensioned M5.5 thread, read 5.47).
  projection: >-
    drawing (derived) - PE44259 p.3 dimensions flange to front face 0.530
    [13.5] and a maximum panel 0.162 [4.1] (L-com gives 13.39), so the front
    face stands at least 13.5 - 4.1 = 9.4 in front of the panel. The floor is
    drawn: a thinner panel leaves more standing, up to 13.5 less its
    thickness. The sheet also shows about 6.7 of barrel in front of the nut,
    which would give 9.11 - below this dimensioned floor, so it is not used.
  insulator: >-
    drawing (derived) - H+S p.239: the jack dielectric sits C 5.80-5.90 behind
    the front, inside the 3.03 bore, and the socket contact tip is B 1.15-1.45
    behind it. Drawn as a dimmed disc 2.76 across inside the bore (the bore
    less its edge, so the tube wall reads) and a contact circle.
  opening-colour: >-
    the hole is painted thread-grey, not black: the M5.5 threaded body fills
    it, and seen through the bezel nut a black ring read as a recess that is
    not there.
  centre-contact: >-
    estimated - the 0.8 contact circle is art only; no source used here
    dimensions the contact face on.
  mated-plane: >-
    drawing (derived), a midpoint - THE MATE CARRIES `seat-out: 3.85`, the
    plane a mated plug's sleeve front sits on, absolute from this part's
    face. The jack's front face is 9.4 in front of the panel (the `ring`
    feature: 13.5 flange-to-front less the 4.1 maximum panel, Pasternack
    PE44259 REV 1.1 p.3), and a mated plug's sleeve runs 5.40-5.70 over the
    jack tube from that face (HUBER+SUHNER general catalogue 2020, 3628
    78Z034, p.239, plug A): 9.4 - 5.70 = 3.70 to 9.4 - 5.40 = 4.00, and 3.85
    is the midpoint of that drawing-derived range. No drawn face stands
    there: the `collar` rear, 3.25, is the shoulder the sleeve clears (jack C
    5.80-5.90), 0.45-0.75 behind the plane, and the plane otherwise lies along
    the plain barrel. common/din-1-0-2-3-jack forwards it with the core.
