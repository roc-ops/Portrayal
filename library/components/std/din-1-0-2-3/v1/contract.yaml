format: 1
kind: component
name: din-1-0-2-3
version: 1.0.0
class: port
profile: networking
conforms: din-1-0-2-3
interface: din-1-0-2-3
description: 1.0/2.3 push-pull coaxial panel jack (IEC 61169-29, DIN 41626/2) -
  a rear-mount bulkhead on an M5.5 x 0.5 thread, so the round spanner nut and
  the plain barrel with its latch groove stand in front of the panel. The small
  T3/E3 and video jack; 50 and 75 ohm variants share the interface, so a
  placement that knows says attrs.impedance.
unplaced: placed by the stand-in moves of docs/connectors-coax-design.md section 6 (the Cisco T3/E3 SPAs), which land after this part
size: {w: 5.59, h: 5.59}
size-confidence: {w: drawing, h: drawing}
size-notes: >-
  The round .220 inch [5.59] hole named in the title of Pasternack PE44259
  REV 1.1. See the registry key din-1-0-2-3.
attrs: {media: coax-din-1-0-2-3}
provenance:
  size: >-
    drawing - registry key din-1-0-2-3, the .220 inch [5.59] round hole of the
    Pasternack drawing PE44259 REV 1.1 (1.0/2.3 jack bulkhead mount, solder
    attachment, thru hole PCB), for the M5.5 x 0.5 thread that PE44259,
    Pasternack PE44254 and L-com RFPCB-1.0/2.3FS-4G72 rev A all dimension.
  rear-mount: >-
    The three mounting drawings agree: the flange is behind the panel and the
    nut is IN FRONT of it, the other way round from the BNC jack. So the nut is
    drawn, and it is wider than the hole; the art overhangs the viewBox on
    purpose, because that is what stands in front of the panel.
  nut: >-
    drawing - L-com RFPCB-1.0/2.3FS-4G72 rev A, SPANNER NUT view: a round
    spanner nut dia 7.01, 2.41 thick (PE44259 scales 7.09). Drawn as a plain
    disc; the spanner slots are not dimensioned in the findings and are not
    drawn.
  barrel: >-
    drawing - HUBER+SUHNER general catalogue 2020 (3628 78Z034), p.239, jack
    table: tube outside dia I 4.03-4.15 (drawn 4.09; PE44259 scales 4.16),
    tube inside dia N 3.00-3.06 (drawn 3.03, the dark bore), and a collar dia
    K 4.72-4.75 (drawn 4.735) starting C/D 5.80-6.50 behind the front face
    (drawn 6.15). The front ring before the latch groove is 1.4 long (L-com
    RFPCB-1.0/2.3FS-4G72 rev A side view, .055 [1.4]); the latch groove runs
    about 1.4 to 2.2 behind the front at about dia 3.6 (PE44259 p.3, scaled).
  projection: >-
    drawing (scaled) - PE44259 p.3 shows about 6.7 of barrel in front of the
    nut, so with the 2.41 nut the front face is 9.11 in front of the panel.
    Because the jack is rear-mounted the projection depends on the panel: the
    same sheet dimensions flange to front face 13.5 (L-com 13.39) with a max
    panel 4.1, so a thin panel leaves more standing (13.5 less the panel).
    9.11 is the drawn case, not a property of the interface.
  insulator: >-
    drawing (derived) - H+S p.239: the jack dielectric sits C 5.80-5.90 behind
    the front, inside the 3.03 bore, and the socket contact tip is B 1.15-1.45
    behind it. Drawn as a dimmed disc 2.76 across inside the bore (the bore
    less its edge, so the tube wall reads) and a contact circle.
  centre-contact: >-
    estimated - the 0.8 contact circle is art only; no source used here
    dimensions the contact face on.
