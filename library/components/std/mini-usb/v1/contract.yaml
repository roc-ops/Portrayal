provenance:
  size: >-
    registry - the mini-usb-b entry of spec/schemas/standards.yaml, which reads Molex sales
    drawing SD-54819-026 rev A (part 54819-0519, right angle, through hole): a 7.7 x 3.9
    shell case, bounding box. Other makers' Mini-B shells may differ by a few tenths.
  depth: >-
    registry - the same entry's 9.0, the overall length on the drawing's side view.
  opening: >-
    registry - the plug opening inside the case is 6.9 wide by 3.1 high with five contacts at
    0.8 pitch, as the registry's notes give it. The cut-away lower corners are drawn as
    chamfers; the drawing's two R0.7 bends are not reproduced.
elements:
  opening: {at: [0.0, 0.0], size: [7.7, 3.9], class: cutout}
