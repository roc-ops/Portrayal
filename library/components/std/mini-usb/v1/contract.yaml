format: 1
kind: component
name: mini-usb
version: 1.0.0
class: port
profile: networking
description: Mini-USB Type-B receptacle, as used for a console port
size: {w: 7.7, h: 3.9, d: 9.0}
size-confidence: {w: drawing, h: drawing, d: drawing}
conforms: mini-usb-b
