format: 1
kind: component
name: f-type
version: 1.0.1
class: port
profile: networking
conforms: f-type
interface: f-type
description: F-type 75-ohm coaxial panel jack (3/8-32 UNEF-2A) - the CATV drop
  connector. The threaded neck IS the mating interface, so it stands proud of the
  panel with the hex nut clamped behind it; the aperture is a double-D hole.
size: {w: 9.7, h: 7.9}
attrs: {media: coax-f}
provenance:
  size: standard - registry key `f-type`, from the MOUNTING HOLE inset of the
    Pasternack PE44327 CAD drawing (REV 1.1, 75-ohm F female bulkhead mount,
    .380 inch DD hole) - 0.380 [9.7] by 0.310 [7.9]. See the registry note for
    why this is a mounting style rather than a figure the F standard fixes
  neck: drawing - the same sheet dimensions the 3/8-32 threaded section at
    0.419 [10.6] and the maximum panel at 0.093 [2.4]. The thread is the mating
    interface, so it is the part that stands outside the panel; pitch is
    25.4/32 = 0.794
  nut: drawing - the hex nut and washer between the thread and the panel take up
    about 2.4 mm of the 0.235 [6.0] front assembly. The real 3/8 in nut is 9.53
    across flats, WIDER than the 9.7 x 7.9 aperture in one axis, so the art here
    draws it inscribed in the aperture rather than overhanging - a component may
    not paint outside its own opening
  mated-plane: >-
    drawing (derived), a midpoint - THE MATE CARRIES `seat-out: 7.8`, the
    plane a mated plug's nut leading edge sits on, absolute from this part's
    face. The thread front is 13.0 in front of the panel (the `nut` 2.4 plus
    the `thread` 10.6, Pasternack PE44327 REV 1.1), and with the plug's
    mandrel face on the port's front face the nut runs D past it, 4.29-6.10
    (ANSI/SCTE 123 2021, Table 1, dim D, mandrel face depth to nut leading
    edge): 13.0 - 6.10 = 6.90 to 13.0 - 4.29 = 8.71, and 7.8 is the midpoint
    of that drawing-derived range (D is the plug's tolerance, not how tight
    it is run). No drawn face stands there - the plane lies along the plain
    thread - so the figure is stated, not an `on:`.
elements:
  opening: {at: [0.0, 0.0], size: [9.7, 7.9], class: cutout}
relief:
  features:
    - node: nut
      cyl: 2.4
      color: '#c0c4c8'
      confidence: drawing
      source: >-
        std/f-type@1's own nut key - Pasternack PE44327 CAD drawing REV 1.1: the hex nut and
        washer take up about 2.4 mm of the 0.235 [6.0] front assembly. Read off the sheet,
        not estimated.
    - node: thread
      cyl: 10.6
      lift: 2.4
      thread: 0.794
      color: '#c0c4c8'
      confidence: drawing
      source: >-
        std/f-type@1's own neck key - Pasternack PE44327 CAD drawing REV 1.1 dimensions the
        3/8-32 threaded section at 0.419 [10.6] and the maximum panel at 0.093 [2.4], so the
        thread stands 10.6 proud from a 2.4 lift. The 0.794 pitch is 25.4/32 computed for 32
        TPI, not read off anything.
connection-points:
  mate: {at: [4.85, 3.95], direction: front, seat-out: 7.8}
skins: [default]
