<svg xmlns="http://www.w3.org/2000/svg" width="12mm" height="4.5mm" viewBox="0 0 12 4.5">
  <!-- THE TONGUE'S COLOUR IS A SPECIFICATION, NOT A STYLE. USB-IF colours the
       Type-A receptacle insulator by what the port is: white for USB 1.x and
       2.0, Pantone 300C blue for 3.0, teal for 3.1 Gen 2. `default` draws the
       blue; this one draws the white, so a datasheet that says USB 2.0 and a
       drawing that says 3.0 stop being the same picture.

       The opening, the tongue's box and every dimension are `default`'s - only
       the fill differs, because only the fill is what the colour means. Nothing
       here is a new measurement. -->
  <rect id="opening" x="0" y="0" width="12" height="4.5" fill="#17191c"/>
  <rect id="tongue" x="0.9" y="0.8" width="10.2" height="1.5" rx="0.2" fill="#d5d9de"/>
</svg>
