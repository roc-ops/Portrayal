format: 1
kind: component
name: vga
version: 1.1.0
class: port
profile: networking
conforms: hd15
interface: hd15
description: >-
  VGA video receptacle - a female high-density DE-15, fifteen contacts in three
  rows inside the D-subminiature size E shell
size: {w: 20.47, h: 11.40, d: 6.73}
attrs: {media: vga}
provenance:
  size: >-
    standard - the size E panel cutout, 20.47 x 11.40 with 10 degrees of taper a
    side and a 3.35 radius, from TE application specification 114-40010 Rev G
    Figure 3. HD-15 sits in that shell rather than a larger one: Amphenol's High
    Density D-Subminiature datasheet puts its 15-position part on a 30.81 flange
    at 24.99 mounting centres, and TE's standard-density DE-9 drawing C-747905
    Rev AB1 gives 30.8 and 24.99 for the same shell. See spec/schemas/
    standards.yaml `hd15` for why the 15 row of a standard-density table is a
    different connector.
  gender: >-
    female on equipment - VGA is a receptacle with sockets, where the DE-9 alarm
    and serial ports on router processors are usually male with pins. The shell
    and therefore the aperture are the same either way; only the insert differs.
  depth: >-
    estimated - carried from `db9`, where 6.73 is 114-40010's mating dimension
    for 9 and 15 position rather than a measured recess.
  pins: >-
    NOT SOURCED. Fifteen contacts are drawn in the three-row arrangement HD-15
    uses, five per row, but no document held here dimensions the contact pitch
    or the row separation. The field is decoration and must not be measured off.
    The middle row is offset by half its own pitch so the rows interleave, which
    is HD-15's arrangement and not a measurement: drawn without it the three
    rows read as a grid. The offset carries the consequence that the middle row
    ends further right than the top row and is inset further on the left.
  shell: >-
    photo-measured - THE OUTLINE DRAWN IS THE SHELL, NOT THE APERTURE. `size`
    stays 20.47 x 11.40 because that is what TE 114-40010 Figure 3 gives as the
    mounting panel cutout, and this registry entry is `verified`; the shell
    passes through that hole rather than filling it, and is drawn 20.22 x 10.50
    inside it. The clearance - 0.125 a side in x, 0.45 in y - is read off the
    R740xd rear reference, where the port had been rendering as large as its own
    hole. An earlier skin painted the cutout outline solid, which is where the
    extra 0.9 of height came from.
  insert: >-
    estimated - the insulator is a separate path from the shell because it is a
    separate part, and 0.90 inside it is proportional rather than dimensioned.
    ITS DEPTH IS THE POINT OF THE SPLIT: on a female HD-15 the insert face sits
    LEVEL with the shell's front, which is why `top` equals the full 6.73 cavity
    and why this port reads flat where std/db9 reads recessed. Neither document
    held here dimensions either setback.
elements:
  opening: {at: [0.0, 0.0], size: [20.47, 11.40], class: cutout}
relief:
  wall: '#3a3e43'
  features:
  # THE SHELL STANDS PROUD - see std/db9@1, the same shell with the same
  # correction. Drawn as a ring so it builds as a tube.
  - node: opening
    out: 6.73
    shape: true
    color: '#5c6268'
    confidence: estimated
    source: >-
      6.73 is this contract's own `d`, which TE 114-40010 Figure 3 dimensions
      against the panel face. THE DIRECTION IS THE SOURCED PART: a D-sub passes
      through its cutout rather than sitting behind it.
  # FLUSH WITH THE LIP AND PIERCED, which is the female half of the pair. The
  # fifteen bores are subpaths of the insert's own outline rather than separate
  # features, so they build as holes THROUGH the face instead of discs standing
  # on it; what shows down them is the dark floor drawn behind, which is also
  # what the flat drawing shows.
  - node: insert
    out: 6.73
    shape: true
    color: '#1f4f9e'
    confidence: estimated
    source: >-
      6.73 is this contract's `d`, so the insert face lands level with the shell
      lip and the shell makes no recess in front of it. That is the female half
      of the pair: a receptacle presents its insulator at the face, and std/db9@1
      sets its insert back instead. The flush/recessed distinction is sourced
      from what the two connectors are; the millimetres are not dimensioned
      anywhere held here.
      HD-15 IS FEMALE, so the contacts are holes the plug's pins enter, cut from
      this outline rather than modelled as sunk discs - which is the whole
      difference from std/db9@1's pins.
connection-points:
  mate: {at: [10.235, 5.7], direction: front}
skins: [default]
