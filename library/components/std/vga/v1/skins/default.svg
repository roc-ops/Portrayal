<svg xmlns="http://www.w3.org/2000/svg" width="20.47mm" height="11.4mm" viewBox="0 0 20.47 11.4">
  <!-- THE OUTLINE IS THE SHELL, NOT THE HOLE. `size` 20.47 x 11.40 is the
       MOUNTING PANEL CUTOUT from TE 114-40010 Figure 3 and stays that; the
       shell passes THROUGH it and so is drawn smaller, 20.22 x 10.50, which is
       the clearance a photograph of the port shows. Painting the cutout solid
       is what made this connector render as big as its own hole.
       Shape per Figure 3: 10 degrees +/-2 of taper a side, 3.35 radius in four
       places where the flats meet the slopes. The insert is a separate path
       because it is a separate part - a metal shell with an insulator in it -
       and that is what lets 3D say one sits behind the other. -->
  <path id="opening" d="M0.818 4.382 A3.350 3.350 0 0 1 4.117 0.450 L16.353 0.450 A3.350 3.350 0 0 1 19.652 4.382 L18.982 8.182 A3.350 3.350 0 0 1 15.683 10.950 L4.787 10.950 A3.350 3.350 0 0 1 1.488 8.182 Z" fill="#5c6268" stroke="#9aa0a6" stroke-width="0.35"/>
  <!-- THE FACE IS BLUE. Every VGA receptacle made carries a blue
       insulator; it is how the connector is told apart from the other
       D-subs on the same panel. Same shell as std/db9 - high density
       means more contacts in the same shell, not a bigger one. -->
  <path id="insert" d="M1.546 4.225 A2.450 2.450 0 0 1 3.959 1.350 L16.511 1.350 A2.450 2.450 0 0 1 18.924 4.225 L18.254 8.025 A2.450 2.450 0 0 1 15.841 10.050 L4.629 10.050 A2.450 2.450 0 0 1 2.216 8.025 Z" fill="#1f4f9e" stroke="#16376e" stroke-width="0.2"/>
  <!-- Fifteen contacts in three rows of five, and HD-15 IS FEMALE:
       these are SOCKETS, so they are drawn as holes rather than as
       pins. THE MIDDLE ROW IS OFFSET BY HALF ITS PITCH, which is what
       makes the rows interleave - each middle contact falls in a gap
       of the row above. Drawn flat before, the three rows read as a
       grid. Pitch and row separation are NOT SOURCED. -->
  <g id="sockets-outer" fill="#0b1526">
    <circle cx="5.66" cy="3.49" r="0.42"/>
    <circle cx="7.93" cy="3.49" r="0.42"/>
    <circle cx="10.20" cy="3.49" r="0.42"/>
    <circle cx="12.47" cy="3.49" r="0.42"/>
    <circle cx="14.74" cy="3.49" r="0.42"/>
    <circle cx="6.25" cy="7.91" r="0.42"/>
    <circle cx="8.32" cy="7.91" r="0.42"/>
    <circle cx="10.40" cy="7.91" r="0.42"/>
    <circle cx="12.47" cy="7.91" r="0.42"/>
    <circle cx="14.55" cy="7.91" r="0.42"/>
  </g>
  <g id="sockets-mid" fill="#0b1526">
    <circle cx="7.04" cy="5.70" r="0.42"/>
    <circle cx="9.21" cy="5.70" r="0.42"/>
    <circle cx="11.39" cy="5.70" r="0.42"/>
    <circle cx="13.56" cy="5.70" r="0.42"/>
    <circle cx="15.73" cy="5.70" r="0.42"/>
  </g>
</svg>
