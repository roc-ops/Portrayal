<svg xmlns="http://www.w3.org/2000/svg" width="20.47mm" height="11.4mm" viewBox="0 0 20.47 11.4">
  <!-- Size E shell, identical outline to std/db9 - high density means more
       contacts in the same shell, not a bigger one. TE 114-40010 Figure 3:
       10 degrees of taper a side, 2.01 inset over an 11.40 drop for a 16.45
       narrow edge, 3.35 radius in four places where the flats meet the slopes. -->
  <path id="opening"
        d="M0.693 3.932 A3.350 3.350 0 0 1 3.992 0.000 L16.478 0.000
           A3.350 3.350 0 0 1 19.777 3.932 L18.948 8.632
           A3.350 3.350 0 0 1 15.649 11.400 L4.821 11.400
           A3.350 3.350 0 0 1 1.522 8.632 Z"
        fill="#17191c" stroke="#9aa0a6" stroke-width="0.35"/>
  <!-- Fifteen contacts in three rows of five - the arrangement HD-15 uses, but
       NOT SOURCED: no document held here dimensions the pitch or the row
       separation, so this is decoration and the contract says so. -->
  <g fill="#8b9199">
    <circle cx="5.6" cy="3.3" r="0.42"/>
    <circle cx="7.9" cy="3.3" r="0.42"/>
    <circle cx="10.2" cy="3.3" r="0.42"/>
    <circle cx="12.5" cy="3.3" r="0.42"/>
    <circle cx="14.8" cy="3.3" r="0.42"/>
    <circle cx="5.9" cy="5.7" r="0.42"/>
    <circle cx="8.1" cy="5.7" r="0.42"/>
    <circle cx="10.3" cy="5.7" r="0.42"/>
    <circle cx="12.5" cy="5.7" r="0.42"/>
    <circle cx="14.7" cy="5.7" r="0.42"/>
    <circle cx="6.2" cy="8.1" r="0.42"/>
    <circle cx="8.3" cy="8.1" r="0.42"/>
    <circle cx="10.4" cy="8.1" r="0.42"/>
    <circle cx="12.5" cy="8.1" r="0.42"/>
    <circle cx="14.6" cy="8.1" r="0.42"/>
  </g>
</svg>
