<svg xmlns="http://www.w3.org/2000/svg" width="20.47mm" height="11.4mm" viewBox="0 0 20.47 11.4">
  <!-- Size E shell, identical to std/db9: 10 degrees of taper a side over an
       11.40 drop insets each edge by 2.01, giving a 16.45 narrow edge. High
       density means more contacts in the same shell, not a bigger one. -->
  <path id="opening" d="M0 0 H20.47 L18.46 11.4 H2.01 Z" fill="#17191c"/>
  <!-- Fifteen contacts in three rows of five - the arrangement HD-15 uses, but
       NOT SOURCED: no document held here dimensions the pitch or the row
       separation, so this is decoration and the contract says so. -->
  <g fill="#8b9199">
    <circle cx="5.2" cy="3.0" r="0.42"/>
    <circle cx="7.8" cy="3.0" r="0.42"/>
    <circle cx="10.4" cy="3.0" r="0.42"/>
    <circle cx="13.0" cy="3.0" r="0.42"/>
    <circle cx="15.6" cy="3.0" r="0.42"/>
    <circle cx="5.6" cy="5.7" r="0.42"/>
    <circle cx="8.0" cy="5.7" r="0.42"/>
    <circle cx="10.4" cy="5.7" r="0.42"/>
    <circle cx="12.8" cy="5.7" r="0.42"/>
    <circle cx="15.2" cy="5.7" r="0.42"/>
    <circle cx="6.0" cy="8.4" r="0.42"/>
    <circle cx="8.2" cy="8.4" r="0.42"/>
    <circle cx="10.4" cy="8.4" r="0.42"/>
    <circle cx="12.6" cy="8.4" r="0.42"/>
    <circle cx="14.8" cy="8.4" r="0.42"/>
  </g>
</svg>
