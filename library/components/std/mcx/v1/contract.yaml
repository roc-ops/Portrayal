format: 1
kind: component
name: mcx
version: 1.0.0
class: port
profile: networking
conforms: mcx
interface: mcx
description: MCX coaxial panel jack (IEC 61169-36) - snap-on micro coax, the
  75-ohm RF drop connector on cable headend I/O cards and the 50-ohm GNSS/timing
  jack elsewhere. The panel aperture is a D-hole with one anti-rotation flat.
size: {w: 4.95, h: 4.50}
attrs: {media: coax-mcx}
provenance:
  variant-is-front-mount-and-at-least-one-vendor-is-not: >-
    THE 2.0 IS TRUE OF THIS VARIANT AND IS NOT TRUE OF EVERY MCX. It is read off
    a FRONT-MOUNT bulkhead jack, whose flange sits on the front of the panel -
    the sheet is named in `barrel` above and the registry entry says
    'bulkhead front-mount panel hole' in as many words. This part is not wrong;
    it is specific, and the specificity was not stated where a reader would meet
    it.
    THE CASA CARDS THAT COMPOSE IT USE A VARIANT THAT DOES NOT PROTRUDE. The
    owner, looking at the hardware: the MCX connectors on the 6+12 I/O cards are
    RECESSED INTO the faceplate and do not stick out, where the F fittings on the
    US and DS I/O cards do. Figure 1-12 of the C40G guide shows both in one
    image - every F port a hex nut with concentric rings and a shadow, every MCX
    port on the neighbouring UPS IO 32 a flat dark circle with no body at all.
    So all five users of this part - casa/io-6p12, io-6p12-sw, io-6p12-io2,
    io-6p12-sw-io2 and ups-32x4 - draw about 774 barrels standing 2.0 proud that
    the hardware does not stand.
    NOTHING IS CHANGED HERE, DELIBERATELY. Flattening this part would make it
    wrong about the jack it documents and would silently re-point every future
    user at a shape nobody measured. What is missing is the Casa variant: a part
    number, or a Casa mechanical drawing, or one oblique photograph with a rule.
    Until then the mismatch is recorded on the Casa contracts where it applies
    rather than corrected here, and the direction is known - the error is
    PROUD-WHEN-IT-SHOULD-NOT-BE, not an unknown sign.
    Portrayal also has no way to express the recess itself: `sink` is the right
    word and is in the schema, but the extractor reads it only inside a node
    already carrying a depth, and `relief.cavity` on a module would make the
    whole card a cavity. That mechanism is not being built ahead of a number to
    put in it.
  size: standard - registry key `mcx`, from the MOUNTING HOLE inset of the
    Radiall R113.553.000 technical data sheet (MCX bulkhead jack receptacle,
    front mount, cylindrical contact; issue 9841B04). Bore dia 5.00/4.90, across
    the flat 4.55/4.45; w and h are the midpoints. Radiall originated MCX, so
    this is the series' own panel drawing rather than a derived figure.
    Corroborated by L-com LCCN3038, sold as fitting a ".177 inch D hole"
  barrel: drawing - the same sheet's side elevation, scaled against its own
    2.5 mm maximum panel thickness (36 px/mm at 600 dpi). The 6.5 dia flange and
    the mating interface together stand about 2.0 mm proud of the panel front,
    which is why an MCX jack reads as a flush disc rather than a threaded stalk
    the way sma does
  flat: the flat is drawn at the BOTTOM of the aperture. Nothing in the Radiall
    sheet fixes its clocking - a D-hole is punched to whatever orientation the
    panel drawing calls for - so a card that shows a different clocking should
    place this part with `rotate:` rather than have the flat re-cut here
elements:
  opening: {at: [0.0, 0.0], size: [4.95, 4.50], class: cutout}
relief:
  features:
    - node: barrel
      cyl: 2.0
      color: '#c9a227'
      confidence: drawing
      source: >-
        std/mcx@1's own barrel key - the Radiall R113.553.000 side elevation (issue 9841B04)
        scaled against its own 2.5 mm maximum panel thickness at 36 px/mm: flange plus
        mating interface stand about 2.0 proud. TRUE OF THIS FRONT-MOUNT VARIANT ONLY, as
        this contract's variant-is-front-mount key warns - a rear-mount MCX does not read as
        a flush disc.
connection-points:
  mate: {at: [2.475, 2.475], direction: front}
skins: [default]
