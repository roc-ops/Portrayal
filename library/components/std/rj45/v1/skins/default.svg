<svg xmlns="http://www.w3.org/2000/svg" width="16mm" height="14mm" viewBox="0 0 16 14">
  <!-- aperture: the hole in the panel / the port's face area -->
  <rect id="opening" x="0" y="0" width="16" height="14" rx="0.4" fill="#17191c"/>
  <!-- cavity: the 8P8C plug interface, 11.89 x 6.85 body + 4.0 x 2.6 latch keyway.
       Standard across vendors - a plug that fits one RJ45 fits them all. -->
  <path id="cavity" d="M 2.055 2.275 h 11.89 v 6.85 h -3.945 v 2.6 h -4 v -2.6 h -3.945 z" fill="#0a0c0e"/>
  <g id="pins" fill="#a8873c">
    <rect x="4.134" y="2.925" width="0.62" height="2.3"/>
    <rect x="5.150" y="2.925" width="0.62" height="2.3"/>
    <rect x="6.166" y="2.925" width="0.62" height="2.3"/>
    <rect x="7.182" y="2.925" width="0.62" height="2.3"/>
    <rect x="8.198" y="2.925" width="0.62" height="2.3"/>
    <rect x="9.214" y="2.925" width="0.62" height="2.3"/>
    <rect x="10.230" y="2.925" width="0.62" height="2.3"/>
    <rect x="11.246" y="2.925" width="0.62" height="2.3"/>
  </g>
</svg>
