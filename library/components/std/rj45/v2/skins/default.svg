<svg xmlns="http://www.w3.org/2000/svg" width="15.8mm" height="13.2mm" viewBox="0 0 15.8 13.2">
  <!-- THE HOUSING IS SOLID AND THE OPENING IS PUNCHED THROUGH IT. One evenodd
       path: the housing face, minus the three-tier 8P8C interface (TE 1734264).
       Body 11.91 x 6.83 from y 2.0; shoulder 6.30 wide, 1.69 high; latch slot
       4.06 wide to the lower edge. The cavity node is the same outline so the
       3D view recesses exactly what the face shows. -->
  <path id="housing" fill-rule="evenodd" fill="#2b2f33" stroke="#1c1f23" stroke-width="0.15" d="
    M 0.4 0 h 15.0 a 0.4 0.4 0 0 1 0.4 0.4 v 12.4 a 0.4 0.4 0 0 1 -0.4 0.4 h -15.0 a 0.4 0.4 0 0 1 -0.4 -0.4 v -12.4 a 0.4 0.4 0 0 1 0.4 -0.4 z
    M 1.945 2.0 h 11.91 v 6.83 h -2.805 v 1.69 h -1.12 v 2.68 h -4.06 v -2.68 h -1.12 v -1.69 h -2.805 z"/>
  <path id="cavity" fill="#0a0c0e" d="
    M 1.945 2.0 h 11.91 v 6.83 h -2.805 v 1.69 h -1.12 v 2.68 h -4.06 v -2.68 h -1.12 v -1.69 h -2.805 z"/>
  <path id="opening" fill="none" d="M 1.945 2.0 h 11.91 v 11.2 h -11.91 z"/>
  <g id="pins" fill="#a8873c">
    <rect x="4.10" y="2.6" width="0.46" height="2.3"/>
    <rect x="5.12" y="2.6" width="0.46" height="2.3"/>
    <rect x="6.14" y="2.6" width="0.46" height="2.3"/>
    <rect x="7.16" y="2.6" width="0.46" height="2.3"/>
    <rect x="8.18" y="2.6" width="0.46" height="2.3"/>
    <rect x="9.20" y="2.6" width="0.46" height="2.3"/>
    <rect x="10.22" y="2.6" width="0.46" height="2.3"/>
    <rect x="11.24" y="2.6" width="0.46" height="2.3"/>
  </g>
</svg>
