  <rect id="reset" x="4" y="4" width="2" height="2" rx="1" fill="#0a0a0b" stroke="#55585c" stroke-width="0.2"/>
  <g fill="#0b0b0c" stroke="#55585c" stroke-width="0.3">
    <rect x="90.0" y="9.0" width="10.5" height="12.5" rx="0.6"/>
    <rect x="102.5" y="9.0" width="10.5" height="12.5" rx="0.6"/>
  </g>
  <g fill="#3a3c40">
    <rect x="92.4" y="11.0" width="5.7" height="7.0"/>
    <rect x="104.9" y="11.0" width="5.7" height="7.0"/>
  </g>
  <g id="silkscreen" font-family="sans-serif" font-size="2.4" fill="#d9dbde" text-anchor="middle">
    <text x="28.0" y="6.6">LNK</text>
