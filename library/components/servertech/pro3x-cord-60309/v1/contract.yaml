format: 1
kind: component
name: pro3x-cord-60309
version: 1.0.0
class: inlet
profile: power
unmated: the fixed input cord of the PDU, ending in an IEC 60309 3P+G 9h plug; the plug is the cord's own end, so nothing plugs into the cord and no mate is offered for it
description: >-
  The fixed input cord of a Server Technology PRO3X Basic PDU whose SKU page lists an IEC 60309 3P+G 9h plug.
  It leaves the cord end of the strip through a cord-entry frame.
  Drawn as a frame; the cord and plug beyond it are not.
size: {w: 29.2, h: 33.1}
size-confidence: {w: borrowed, h: borrowed}
size-notes: borrowed from servertech/pro4x-cord-60309@1, the same maker's entry frame on the same family of strip
attrs: {plug: iec-60309-3p-g-9h}
provenance:
  size: >-
    borrowed - the 3A06 outline's end view draws a cord-entry frame, and no figure of it is dimensioned. The 29.2 by
    33.1 frame is servertech/pro4x-cord-60309@1's, read from the PRO4X outline drawing's end view.
  plug: >-
    datasheet - the maker's SKU page for C3B36RL-DQJE0AT2 prints Input Plug Type "208V Delta 60A IEC 60309 3P+G 9Hr"
    and Input Cord Location "Bottom/End". The outline drawing marks "BOTTOM ENTRY LOCATION" and "FRONT ENTRY LOCATION"
    and draws no cord and no plug.
  not-drawn: >-
    THE CORD BEYOND THE FRAME AND THE PLUG ARE NOT DRAWN, and no document held gives the cord's length or gauge:
    the far end of a cord is not a part (docs/connectors-power-design.md section 7). This part stands for the power
    input a DCIM records, one power port of type `other` labelled as an IEC 60309 3P+G 9h plug.
elements:
  frame: {at: [0, 0], size: [29.2, 33.1], class: inlet}
skins: [default]
