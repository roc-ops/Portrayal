    <rect x="0.8" y="27.9" width="42.3" height="21.0"/>
    <rect x="0.8" y="53.9" width="42.3" height="21.8"/>
  </g>
  <g fill="#8d9096" stroke="#3a3b3e" stroke-width="0.2">
