<svg xmlns="http://www.w3.org/2000/svg" width="30.1mm" height="24mm" viewBox="0 0 30.1 24">
  <!-- Server Technology HDOT Cx outlet, a hybrid of the C13 and C19. The recess is the well a C14 or
       C20 shroud enters; the nose is a simplified C13 nose with three contacts. Standing frame. -->
  <rect id="well" x="0" y="0" width="30.1" height="24" fill="#1e1f21"/>
  <rect id="recess" x="0" y="0" width="30.1" height="24" rx="4.5" fill="#0b0c0d" stroke="#3a3c3f" stroke-width="0.25"/>
  <g id="nose">
    <path d="M 5.5 19.5 L 5.5 9.5 L 10 9.5 L 10 5 L 20.1 5 L 20.1 9.5 L 24.6 9.5 L 24.6 19.5 Z" fill="#26282a" stroke="#45484c" stroke-width="0.2"/>
    <rect x="7" y="12" width="4" height="5" fill="#030303"/>
    <rect x="19.1" y="12" width="4" height="5" fill="#030303"/>
    <rect x="12.6" y="7" width="4.9" height="4" fill="#030303"/>
  </g>
</svg>
