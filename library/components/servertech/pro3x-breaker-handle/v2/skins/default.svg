<svg xmlns="http://www.w3.org/2000/svg" width="18.5mm" height="29.9mm" viewBox="0 0 18.5 29.9">
  <!-- A PRO3X Smart or Switched breaker cell as the C3S36RL sheet's front view shows it: a framed square toward the far end and a narrow bar with two dots toward the cord end. -->
  <rect id="window" x="0" y="0" width="18.5" height="29.9" rx="1" fill="#141516" stroke="#3b3e42" stroke-width="0.3"/>
  <rect id="frame" x="0.5" y="0.97" width="17.4" height="17.45" rx="0.4" fill="#565b60"/>
  <rect id="frame-inner" x="1.4" y="1.87" width="15.6" height="15.65" fill="#0b0b0c"/>
  <rect id="frame-line" x="1.4" y="13.7" width="14.4" height="0.8" fill="#565b60"/>
  <rect id="frame-notch" x="13.1" y="11.8" width="2.4" height="2.7" fill="#565b60"/>
  <rect id="bar-head" x="2.0" y="21.45" width="3.8" height="6.65" fill="#565b60"/>
  <rect id="bar-stem" x="5.8" y="23.4" width="3.9" height="2.8" fill="#565b60"/>
  <circle id="bar-dot-1" cx="12.1" cy="24.8" r="1.4" fill="#565b60"/>
  <circle id="bar-dot-2" cx="15.5" cy="24.8" r="1.0" fill="#565b60"/>
</svg>
