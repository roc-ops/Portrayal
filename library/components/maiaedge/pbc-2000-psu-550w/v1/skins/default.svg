<svg xmlns="http://www.w3.org/2000/svg" width="73.5mm" height="40mm" viewBox="0 0 73.5 40">
  <rect id="body" x="0.2" y="0.2" width="73.1" height="39.6" rx="0.8"
        fill="#b9bec4" stroke="#8a9099" stroke-width="0.4"/>
  <!-- the fan, behind a four-spoke silver guard, filling the left 39 mm -->
  <rect x="0.6" y="0.6" width="38.8" height="34.4" rx="1.0" fill="#c4c8cd" stroke="#8a9099" stroke-width="0.3"/>
  <circle id="fan-bore" cx="20.0" cy="17.7" r="16.4" fill="#111316"/>
  <path d="M20 17.7 L5.2 4.4 M20 17.7 L34.8 4.4 M20 17.7 L5.2 31.0 M20 17.7 L34.8 31.0"
        stroke="#c4c8cd" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="20.0" cy="17.7" r="9.05" fill="#2f7fd6" stroke="#1d5aa0" stroke-width="0.35"/>
  <g id="rating-silkscreen">
    <text x="20.0" y="15.6" font-family="sans-serif" font-size="2.9" font-weight="bold"
          text-anchor="middle" fill="#0e2a52">550W</text>
    <text x="20.0" y="19.9" font-family="sans-serif" font-size="1.5"
          text-anchor="middle" fill="#0e2a52">CRPS Platinum</text>
  </g>
  <circle cx="5.4" cy="1.9" r="1.4" fill="#9aa0a8" stroke="#6e747c" stroke-width="0.25"/>
  <circle cx="36.8" cy="1.6" r="1.4" fill="#9aa0a8" stroke="#6e747c" stroke-width="0.25"/>
  <!-- the pull handle: a black U folded flat along the foot of the fan -->
  <path id="handle" d="M0.6 30.4 L3.4 30.4 L3.4 36.8 L36.2 36.8 L36.2 30.4 L39.0 30.4 L39.0 39.6 L0.6 39.6 Z"
        fill="#16181b"/>
  <!-- the C14 inlet stands in a black shroud; its retention latch lies over the
       shroud's right side -->
  <rect id="shroud" x="40.3" y="0.4" width="25.4" height="32.0" rx="0.6" fill="#15171a"/>
  <rect id="latch" x="54.0" y="8.1" width="11.7" height="22.7" rx="1.2" fill="#3a3f8c"/>
  <circle id="vent-hole" cx="54.5" cy="36.6" r="2.3" fill="#0d0f11"/>
  <circle id="led" cx="66.8" cy="36.6" r="2.3" fill="var(--led-color, #6d7278)" stroke="#8a9099" stroke-width="0.3"/>
</svg>
