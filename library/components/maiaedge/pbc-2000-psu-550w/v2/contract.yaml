format: 1
kind: module
name: pbc-2000-psu-550w
version: 2.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 550 W CRPS supply fitted to the MaiaEdge PBC-2000 - a fan behind a four-spoke silver guard
  with a blue 550W CRPS Platinum label on its hub, a black pull handle folded along the foot, and
  a vertical C14 inlet in a black shroud with a purple retention latch.
size: {w: 73.5, h: 40.0, d: 185.0}
size-confidence: {w: registry, h: registry, d: registry}
conforms: crps-1u
attrs: {power-output-w: 550, input: ac, efficiency: platinum, form-factor: crps-1u, power-absent: not-published}
provenance:
  size: >-
    registry - the CRPS 1U module envelope, 73.5 x 40 x 185, the same as common/psu-550w@2. The
    face-on rear photograph confirms the width: the two cages read 74.9 and 73.6 mm on a scale
    taken from the chassis's own 437.9, which is the module plus its cage lip.
  why-not-common-psu-550w: >-
    THE FACE IS DIFFERENT. common/psu-550w@2 is the Gospower unit in the Smartoptics DCP: its
    handle is a bar across the fan's middle and its latch a small blue tab at the top right. The
    PBC-2000's supply, photographed square-on (working/intake/maiaedge/pbc/photos/
    pbc-rear-faceon.jpg), folds its handle flat along the fan's foot, stands its inlet in a black
    shroud and closes a tall purple latch over the shroud's right side. Same envelope, same
    rating, different metal - a second part, not a second skin, because the handle and latch
    are elements and they sit in different places.
  latch: >-
    field knowledge (the maintainer, 2026-09-21) - THE LATCH STANDS OUT OF THE FACE, it does not
    lie on it. @1 drew it as a flat plate 11.7 x 22.7 over the shroud's right side, read off the
    face-on photograph; that broad purple area is the tab's SIDE, seen from the camera, which
    stood to the right of both supplies and so saw each tab's flank spread leftward from its
    root. The root is the shroud's right edge, x 63.2 to 65.7; the tab is 22.7 mm tall there
    and stands 14 mm proud. This is why the part is @2 - an element moved.
  rating: >-
    photograph - the hub label reads 550W, CRPS and Platinum, on both supplies. The unit's own
    rating label is not in view, so its manufacturer and part number are not recorded.
  elements: >-
    photo-measured on the rear photograph's per-axis scales (4.137 px/mm across, 3.925 down),
    relative to each module's left edge and averaged over the two: guard 0.6 to 39.4, fan hub
    centred at (20.0, 17.7) with the label 18.1 mm across; handle along the foot from y 30.4;
    shroud 40.3 to 65.7 across and to y 32.4 down; latch 54.0 to 65.7 by 8.1 to 30.8; two round
    openings below the shroud at x 54.5 and 66.8, the right-hand one with a grey lens, which is
    taken to be the supply's status lamp.
  power: >-
    NOT PUBLISHED as a draw. 550 W is the supply's output rating, not what it imposes.
states: [ok, fail, absent]
elements:
  latch: {at: [63.2, 8.1], size: [2.5, 22.7], class: latch}
  handle: {at: [0.6, 30.4], size: [38.4, 9.2], class: handle}
  led: {at: [64.5, 34.3], size: [4.6, 4.6], class: led}
parts:
  - {ref: std/c14-inlet@1, id: inlet, at: [38.55, 5.75], rotate: 90}
relief:
  features:
  - node: handle
    out: 2.5
    confidence: estimated
    source: the handle is photographed folded flat; its thickness off the face is not stated
  - node: latch
    out: 14.0
    color: '#2f3372'
    confidence: estimated
    source: >-
      the maintainer, 2026-09-21: the latch points toward the user, perpendicular to the face.
      Its reach is not stated; 14 mm is a CRPS inlet latch's usual throw
connection-points:
  power: {at: [52.55, 15.75], direction: rear}
body:
  depth: 185.0
  color: '#b9bec4'
skins: [default]
