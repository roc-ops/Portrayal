format: 1
kind: component
name: pbc-2000-bezel
version: 1.0.0
class: bezel
behaviour: mounts
profile: networking
description: >-
  The built-in front bezel of the MaiaEdge PBC-2000 - one formed plate across the face from
  the left edge to the touch screen, standing off the faceplate and cut through by the two
  octagonal windows the ports are seen through. Flat only across a narrow band level with
  the windows' vertical ends, where the wordmark is, and sloping back to the faceplate
  above and below it. Fixed to the chassis, not a removable cover.
# NO `d`. On a component a depth is read as a hole of that depth behind its box,
# which is what a port aperture is; the plate stands ON the faceplate, and how
# far is `out` below.
size: {w: 377.0, h: 41.27}
size-confidence: {w: estimated, h: datasheet}
provenance:
  shape: >-
    field knowledge (the maintainer, 2026-09-21), from the hardware, in two passes. First: the
    pane where the wordmark sits stands out from the faceplate and slopes back, and the sides
    of the octagons facing it are its edges - drawn from that, as a pane between the windows,
    and looked at in 3D. Second, correcting it: the profile runs ALL THE WAY ACROSS, "up into
    about the LCD on the right", and the octagons FRAME the faceplate underneath - a bezel
    attached in front of it, built in rather than removable. So the windows are holes in this
    part, not the ends of it. `behaviour: mounts` is the format's word for exactly this - it
    attaches to the surface and stands on it, as a rack ear and a bolted panel do - and it does
    not claim the part comes off. It also makes it paint over what it stands in front of,
    which is why the status lamp on its chamfer is one of its parts rather than the device's.
  status-lamp: >-
    the chassis status lamp is IN the bezel: the photograph puts it in the notch outside the
    right window's lower-right chamfer, which is bezel, not faceplate. It is composed here at
    the position maiaedge/pbc-2000 v3 placed it on the face, lifted 6.2 mm - the plate's
    stand-off at the lamp's centre, 11.25 at the flat band falling to 0 at the bottom edge
    9.1 mm below.
  profile: >-
    field knowledge (the maintainer, 2026-09-21): the flat face is only as tall as the
    octagons' short vertical ends - 16.15 to 24.85 mm, from the window as maiaedge/pbc-2000
    draws it (29 mm tall, chamfer 0.35 of that) - and the plate tapers from there to the top
    and bottom edges rather than cutting across. The rack photograph's highlight band above
    the wordmark is the upper slope catching the light.
  depth: >-
    estimated. The maintainer put the stand-off at half to three-quarters of an inch, and on
    seeing 15 mm in 3D asked for it 25% closer to the face: 11.25. The datasheet bounds it -
    page 3 gives the chassis 11.46 in deep and the total "with ears and tabs" 12.13 in, 17.0
    mm more, which is the most anything may stand off the face.
  size: >-
    estimated in width, datasheet in height. The bezel runs from the chassis's left edge to
    "about the LCD": it stops at 377, four millimetres short of maiaedge/pbc-2000-lcd@1's frame
    at 381, and both are estimates. The height is the chassis's 41.27, page 3 of the
    datasheet.
  windows: >-
    the octagons maiaedge/pbc-2000 has drawn since v3 - 132 x 29 at x 8 and x 232, y 6 - so
    the ports behind line up with the holes in front of them. Their positions are estimated
    (see the device's `front-face-positions` gap).
  walls: >-
    the window walls are the vendor's amber, because that is the edge of the cut on the
    hardware - looking into a window you see the amber bead's depth. The outer edge is the
    plate's own dark finish.
  wordmark: >-
    carried here rather than on the device's silkscreen because it is printed ON the bezel:
    left on the faceplate it would sit 11 mm behind the surface it is read on, and the 3D view
    would bury it. Size and colour match the photograph. The logo mark beside it is still not
    drawn - see the device's `wordmark-logo-mark` gap.
relief:
  features:
  - node: bezel
    out: 11.25
    profile-y: [[0, 0], [16.15, 11.25], [24.85, 11.25], [41.27, 0]]
    shape: true
    color: '#1d2024'
    hole-color: '#f5b21c'
    confidence: estimated
    source: >-
      the maintainer's account of the hardware (provenance `shape`, `profile`, `depth`),
      bounded by the datasheet's 17.0 mm between chassis depth and total depth
skins: [default]
parts:
