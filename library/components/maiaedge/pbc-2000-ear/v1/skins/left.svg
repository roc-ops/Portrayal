<svg xmlns="http://www.w3.org/2000/svg" width="22.6mm" height="41.27mm" viewBox="0 0 22.6 41.27">
  <defs>
    <!-- the powder coat's texture: a fine speckle, which is what distinguishes
         the ears from the smooth face beside them in the photograph -->
    <pattern id="pbc-ear-grain" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
      <rect width="1.6" height="1.6" fill="#2c2e31"/>
      <circle cx="0.4" cy="0.5" r="0.22" fill="#3a3d41"/>
      <circle cx="1.2" cy="1.2" r="0.2" fill="#232528"/>
    </pattern>
  </defs>
  <rect id="flange" x="0" y="0" width="22.6" height="41.27" fill="url(#pbc-ear-grain)" stroke="#1c1d1f" stroke-width="0.35"/>
  <g id="thumbscrew">
    <circle cx="9.0" cy="20.6" r="5.2" fill="#18191b" stroke="#303236" stroke-width="0.4"/>
    <circle cx="9.0" cy="20.6" r="3.9" fill="#222326" stroke="#3a3c40" stroke-width="0.3"/>
    <path d="M7.00 20.6 L11.00 20.6 M9.0 18.6 L9.0 22.6" stroke="#0c0c0d" stroke-width="0.7"/>
  </g>
</svg>
