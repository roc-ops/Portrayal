format: 1
kind: component
name: pbc-2000-ear-back
version: 1.0.0
class: ear
behaviour: mounts
profile: networking
description: >-
  The back of a MaiaEdge PBC-2000 rack ear, as the rear view sees it past each side of the
  chassis - the black textured flange, with nothing on it. The front is maiaedge/pbc-2000-ear@1.
size: {w: 22.6, h: 41.27}
size-confidence: {w: datasheet, h: datasheet}
provenance:
  size: >-
    datasheet - maiaedge/pbc-2000-ear@1's own figure: page 3's total width "with ears and tabs",
    19.02 in, less the 17.24 in chassis, halved.
  why-its-own-part: >-
    the front ear carries a thumbscrew with relief, and a skin may not leave out a node its
    part's relief names (L11). The back of the flange has no thumbscrew to name, so it is a part
    of its own rather than a third skin of the front one.
skins: [default]
