format: 1
kind: component
name: pbc-2000-rear-bracket
version: 1.0.0
class: mechanical
profile: networking
description: >-
  The steel strap at the left end of the MaiaEdge PBC-2000's rear, held by two screws and carrying
  the chassis ground stud. The plain strap between the two supplies is
  maiaedge/pbc-2000-psu-divider@1.
size: {w: 14.5, h: 40.0}
size-confidence: {w: photo-measured, h: estimated}
provenance:
  size: >-
    photo-measured in width - working/intake/maiaedge/pbc/photos/pbc-rear-faceon.jpg at 4.137
    px/mm reads the strip between the supplies 14.6 mm between their cages, and the left-end
    strap 17.5 mm to the first cage; both are drawn 14.5, the narrower, placed on the strip's
    centre, so the strap at the left end leaves chassis showing either side of it. The height
    is the supplies' 40, which the photograph shows the straps matching.
  screws: >-
    photo-measured - two pan-head Phillips screws on each strap's centre line, at y 6.5 and
    31.2 from its top edge.
  stud: >-
    photo-measured in position, estimated in reach. A threaded stud stands out of the left
    strap at y 19.3 - foreshortened toward the lens in the photograph, which is how a stud
    square to the face looks at the edge of the frame. It is the chassis ground; its length is
    not stated, so its reach below is estimated.
relief:
  features:
  - node: stud
    cyl: 10.0
    thread: 1.25
    color: '#c3c7cb'
    confidence: estimated
    source: >-
      the stud's position is photo-measured; 10 mm of M6 thread (1.25 pitch) is a chassis
      ground stud's usual size, not a reading
skins: [default]
