format: 1
kind: module
name: pbc-2000-fan-plate
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  The rear fan tray of the MaiaEdge PBC-2000 - ONE bare-steel plate carrying five 40 mm
  San Ace 40 fans behind round openings, with a thumbscrew at its left end that releases
  it. One field-replaceable unit, not five: the fans come out together.
size: {w: 240.9, h: 40.07}
size-confidence: {w: photo-measured, h: estimated}
attrs: {power-absent: not-published, airflow: front-to-back}
provenance:
  one-unit: >-
    field knowledge (the maintainer, 2026-09-21): the five fans are a single tray and the
    tray is a FRU. The photograph agrees in every particular it can show: one continuous
    plate runs from the second supply to the chassis's right edge with no seam between
    fans, and the only fastener a hand can turn is the thumbscrew at its left end - every
    other screw on it is a fan's own mounting screw. maiaedge/pbc-2000 v3 drew five
    common/fan-module-41 trays with red pull tabs, which is a different machine's fan.
  size: >-
    photo-measured - working/intake/maiaedge/pbc/photos/pbc-rear-b.jpeg, the one rear shot
    square enough to scale. Anchored on the chassis's 437.90 mm width (x 210 to 2205 px at
    full resolution, 4.556 px/mm), the face's height reads 41.7 mm against the datasheet's
    41.27 - 1% out, which is what a nearly square photograph looks like. The plate runs
    from 1105 px to the right edge: 196.4 to 437.9 mm. IT IS DRAWN 0.6 SHORT OF THE RIGHT
    EDGE AND OF THE TOP AND BOTTOM - 240.9 x 40.07 - the inset the supplies beside it already
    carry. Drawn flush, its faces lay in the same planes as the chassis lid and the right
    flank, and the 3D view shimmered where they fought; the photograph cannot resolve a gap that small either
    way, so the height is estimated.
  fans: >-
    photo-measured - five fan centres at 1335, 1520, 1700, 1885 and 2070 px, a pitch of
    184 px or 40.4 mm, drawn on a uniform 40.3 from 50.5 mm into the plate. The earlier
    five-module model read 40.8 off the other rear photograph; the two agree to 1%. The
    hub labels read SanAce40 - Sanyo Denki's 40 x 40 frame - and each fan is held by four
    screws on the frame's 32 mm hole square, which is the pair of screws the photograph
    shows between every two fans.
  thumbscrew: >-
    photo-measured in position (1205 px, 22 mm into the plate), estimated in size. Two
    small screws sit left of it, at the plate's left edge.
  power: >-
    NOT PUBLISHED. The datasheet states no chassis draw and no per-fan figure, so L29
    stands on it.
elements:
  fan-1: {at: [33.5, 3.0], size: [34.0, 34.0], class: rotor}
  fan-2: {at: [73.8, 3.0], size: [34.0, 34.0], class: rotor}
  fan-3: {at: [114.1, 3.0], size: [34.0, 34.0], class: rotor}
  fan-4: {at: [154.4, 3.0], size: [34.0, 34.0], class: rotor}
  fan-5: {at: [194.7, 3.0], size: [34.0, 34.0], class: rotor}
  thumbscrew: {at: [17.8, 6.2], size: [8.4, 8.4], class: latch}
relief:
  # NO VENT ON THE FAN OPENINGS: a vent punches every dark pixel of its node,
  # and each opening is one dark disc, so the hub label and the blades drawn
  # over it would go with it. The fans read as art on the plate instead.
  features:
  - node: thumbscrew
    cyl: 5.0
    color: '#c3c6c9'
    confidence: estimated
    source: the thumbscrew's position is photo-measured; how far it stands off is not
skins: [default]
