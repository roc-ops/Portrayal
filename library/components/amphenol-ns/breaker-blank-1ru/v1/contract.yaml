format: 1
kind: module
name: breaker-blank-1ru
version: 1.0.0
class: blank
behaviour: fills
profile: power
description: >-
  Blanking cover for an unused breaker position on an Amphenol Network
  Solutions 1RU breaker panel. A sheet of sixteen ships with the panel and
  more are part number 149568.
size: {w: 17.8, h: 39.1, d: 1.0}
size-confidence: {w: drawing, h: drawing, d: estimated}
size-notes: >-
  The cover closes one opening of the front cover, so it takes the cell that
  the 300CB08 installation guide 149722-2 A9 Fig. 3-1 draws: 17.8 by 39.1. The thickness is a guess at a moulded
  plate; Fig. 2-12 shows it as a thin part and gives no dimension.
attrs: {model: 1RU Breaker Blanking Cover, vendor-sku: '149568'}
provenance:
  size: >-
    drawing for the face, estimated for the depth - see size-notes.
  face: >-
    drawing - the 300CB08 installation guide 149722-2 A9 Fig. 2-12 shows a plain plate with a fixing at the top and
    at the bottom. Its colour is not shown anywhere in the documents held:
    every photograph is of a fully populated panel. Black is assumed, to match
    the guards beside it.
elements:
  plate: {at: [0.0, 0.0], size: [17.8, 39.1], class: mechanical}
skins: [default]
