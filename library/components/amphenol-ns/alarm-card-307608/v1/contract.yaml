class: port
profile: power
description: >-
  Rear face of the alarm card of a passive Amphenol Network Solutions 300CB08
  - two three-pin wire-wrap headers, one per side, carrying the Form C alarm
  relay contacts. Replacement part 307608.
size: {w: 39.0, h: 42.8}
size-confidence: {w: drawing, h: drawing}
