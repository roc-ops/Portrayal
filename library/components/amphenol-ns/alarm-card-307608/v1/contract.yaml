format: 1
kind: component
name: alarm-card-307608
version: 1.2.0
class: port
profile: power
description: >-
  Rear face of the alarm card of a passive Amphenol Network Solutions 300CB08
  - two three-pin wire-wrap headers, one per side, carrying the Form C alarm
  relay contacts. Replacement part 307608.
size: {w: 39.0, h: 42.8}
size-confidence: {w: drawing, h: drawing}
provenance:
  size: >-
    drawing - the centre block of the 300CB08 installation guide 149722-2 A9 Fig. 3-6, 125 px by 137 px at 3.2006
    px/mm.
  headers: >-
    drawing and datasheet - Fig. 3-6 draws two three-pin headers either side of
    a centre screw. The datasheet gives Form C relay contacts on wire-wrap
    terminals that also mate with TE Connectivity 3-640428-3. WHICH HEADER IS
    SIDE A is not marked in the drawing; the rear photograph is of a
    controller panel, whose centre block differs. A is drawn on the right as
    seen from the rear, the side its breakers and outputs are on. EACH HEADER
    IS A COMPOSED PART SINCE 1.1.0, amphenol-ns/alarm-header@1, under the ids
    `alarm-b` and `alarm-a` the elements carried before: the shroud and its
    pins are that part's drawing, moved out of this skin unchanged, and its 6.0
    of height is that part's relief. It presents the `wire-wrap-3` interface;
    this part states no interface of its own.
  groups: >-
    The 300CB08 installation guide 149722-2 A9 (p39, Fig. 3-6) draws the two three-pin headers, one each side of the
    centre screw, and the 300CB08 datasheet (p1) gives Form C alarm relay contacts. They carry alarm contacts out of
    the panel to external equipment, so the role is management: the role the devices that place this card already
    give the rear centre block. No media and no speed is stated: the headers carry relay contacts, not data, and
    neither document prints a rate for them.
attrs: {vendor-sku: '307608'}
