<svg xmlns="http://www.w3.org/2000/svg" width="17.8mm" height="39.1mm" viewBox="0 0 17.8 39.1">
  <!-- 1RU TPA fuse holder, front end: a round hole over a ribbed pull grip. The fuse is inside. -->
  <rect id="body" x="0" y="1.05" width="17.8" height="37.0" rx="0.6" fill="#1a1c1e" stroke="#060707" stroke-width="0.25"/>
  <circle id="eye" cx="8.9" cy="9.8" r="3.2" fill="#070808" stroke="#2c3033" stroke-width="0.4"/>
  <g id="grip">
    <rect x="2.4" y="22.6" width="13.0" height="13.4" rx="1.2" fill="#202326" stroke="#050606" stroke-width="0.25"/>
    <rect x="3.4" y="24.6" width="11.0" height="0.9" rx="0.3" fill="#2c3033"/>
    <rect x="3.4" y="26.5" width="11.0" height="0.9" rx="0.3" fill="#2c3033"/>
    <rect x="3.4" y="28.4" width="11.0" height="0.9" rx="0.3" fill="#2c3033"/>
    <rect x="3.4" y="30.3" width="11.0" height="0.9" rx="0.3" fill="#2c3033"/>
    <rect x="3.4" y="32.2" width="11.0" height="0.9" rx="0.3" fill="#2c3033"/>
    <rect x="3.4" y="34.1" width="11.0" height="0.9" rx="0.3" fill="#2c3033"/>
  </g>
  <g id="silkscreen">
    <!-- the fuse is inside the holder: its rating is carried, not displayed -->
    <text id="fuse-rating" data-from="fuse-rating" x="8.9" y="18.5" font-size="3" text-anchor="middle" fill="#e8e8e4" display="none">0</text>
  </g>
</svg>
