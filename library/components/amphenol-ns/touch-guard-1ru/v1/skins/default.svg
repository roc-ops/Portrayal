<svg xmlns="http://www.w3.org/2000/svg" width="17.8mm" height="39.1mm" viewBox="0 0 17.8 39.1">
  <!-- touch guard over a 1RU breaker, as the panel front view draws it -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26292c"/><stop offset="0.5" stop-color="#17191b"/><stop offset="1" stop-color="#0f1112"/>
    </linearGradient>
  </defs>
  <rect id="guard" x="0" y="0" width="17.8" height="39.1" rx="0.8" fill="url(#g)" stroke="#060707" stroke-width="0.25"/>
  <rect id="hood" x="1.4" y="2.6" width="15.0" height="33.9" rx="2.2" fill="#1b1e20" stroke="#08090a" stroke-width="0.25"/>
  <g id="screw-top">
    <circle cx="8.9" cy="8.0" r="1.5" fill="#3a3e42" stroke="#0a0b0c" stroke-width="0.3"/>
