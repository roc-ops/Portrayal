format: 1
kind: component
name: input-feed-busbar
version: 1.0.1
class: inlet
profile: power
description: >-
  One DC feed input of an Amphenol Network Solutions 1RU power panel with
  horizontal inputs - two busbar landings side by side, one BATTERY and one
  RETURN, that run straight back from the panel so the input cables leave to
  the rear. Each landing takes a dual-hole lug on 3/8 inch holes.
size: {w: 42.5, h: 30.6}
size-confidence: {w: drawing, h: drawing}
size-notes: >-
  the 300CB08 installation guide 149722-2 A9 Fig. 3-8 at 2.849 px/mm: the input assembly is framed 42.5 wide by
  30.6 high (121 px by 87 px), with the two landings seen end-on as slots
  6.0 and 7.7 wide and 24.9 high, and two bolt heads between them.
provenance:
  size: >-
    drawing - see size-notes.
  landings: >-
    datasheet - 300CB08 datasheet, Inputs, -C versions: two pairs of 3/8 inch
    holes on 5/8 to 1 inch centres per terminal, maximum lug width 1.5 inch,
    bolts with Keps nuts and flat washers.
  reach: >-
    drawing - THE TWO LANDINGS OF A FEED ARE NOT THE SAME LENGTH. The
    installation guide's -C bottom views dimension them from the front of the
    metal: 462.2 to the longer (Fig. 3-13 upper, the 300CB08-C) and 462.23
    and 405.08 to the longer and the shorter (the nrgILS300CB08-C, p43). On
    both drawings the shorter landing of each feed is the one nearer the
    panel's side, which is `landing-1`. Behind the 367.0 chassis of a -C panel
    that is 38.1 for `landing-1` and 95.2 for `landing-2`. This part used to
    build both 147, the datasheet's 478 less the stud panel's 331, which
    subtracted a depth without the front guards from one with them and gave
    both landings the length of neither (#860).
  polarity: >-
    WHICH LANDING IS BATTERY IS A FACT OF THE PANEL, printed beside the
    assembly (Fig. 3-8), and it mirrors from side A to side B. The landings
    are named for where they sit; the device prints the legends. On the one
    panel that places this part, the narrower landing, `landing-1`, is BATTERY
    on both sides, because the side A feed is this part turned 180 degrees.
attrs: {hole-diameter: 3/8 in, lug-holes: 2}
elements:
  landing-1: {at: [4.9, 3.2], size: [6.0, 24.9], class: inlet}
  landing-2: {at: [30.2, 3.2], size: [7.7, 24.9], class: inlet}
relief:
  wall: '#0c0d0e'
  features:
    - node: landing-1
      out: 38.1
      color: '#c4c8cc'
      confidence: drawing
      source: >-
        405.08 to the shorter landing less the 367.0 chassis (provenance.reach)
    - node: landing-2
      out: 95.2
      color: '#c4c8cc'
      confidence: drawing
      source: >-
        462.2 to the longer landing less the 367.0 chassis (provenance.reach)
    - node: bolt-top
      cyl: 4.0
      color: '#b9bdc1'
      confidence: estimated
      source: >-
        a bolt head between the landings in Fig. 3-8; height by eye
    - node: bolt-bottom
      cyl: 4.0
      color: '#b9bdc1'
      confidence: estimated
      source: >-
        see bolt-top
skins: [default]
