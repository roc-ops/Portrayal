<svg xmlns="http://www.w3.org/2000/svg" width="17.8mm" height="39.1mm" viewBox="0 0 17.8 39.1">
  <!-- 1RU plug-in breaker behind its touch guard, as the panel front view draws it -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26292c"/><stop offset="0.5" stop-color="#17191b"/><stop offset="1" stop-color="#0f1112"/>
    </linearGradient>
  </defs>
  <rect id="guard" x="0" y="0" width="17.8" height="39.1" rx="0.8" fill="url(#g)" stroke="#060707" stroke-width="0.25"/>
  <rect id="lip-top" x="3.6" y="0.6" width="10.6" height="1.5" rx="0.3" fill="#0a0b0c"/>
  <rect id="lip-bottom" x="3.6" y="37.0" width="10.6" height="1.5" rx="0.3" fill="#0a0b0c"/>
  <circle id="thread-top" cx="8.9" cy="8.0" r="1.5" fill="#050606" stroke="#34383c" stroke-width="0.35"/>
  <circle id="thread-bottom" cx="8.9" cy="30.5" r="1.5" fill="#050606" stroke="#34383c" stroke-width="0.35"/>
  <g id="silkscreen">
    <!-- the rating is printed on the handle, which the guard covers: carried, not displayed -->
    <text id="rating" data-from="rating" x="8.9" y="20.5" font-size="3" text-anchor="middle" fill="#e8e8e4" display="none">60</text>
  </g>
</svg>
