<svg xmlns="http://www.w3.org/2000/svg" width="17.8mm" height="39.1mm" viewBox="0 0 17.8 39.1">
  <!-- bare 1RU plug-in breaker: body, two threaded inserts, the handle with its rating, the on/off flag -->
  <rect id="body" x="0" y="1.05" width="17.8" height="37.0" rx="0.6" fill="#1a1c1e" stroke="#060707" stroke-width="0.25"/>
  <rect id="window" x="4.3" y="10.6" width="9.2" height="14.8" rx="0.5" fill="#0a0b0c"/>
  <g id="flag">
    <rect x="13.6" y="14.0" width="2.6" height="4.0" fill="#c8312b"/>
    <rect x="13.6" y="18.0" width="2.6" height="4.0" fill="#2f9a56"/>
  </g>
  <g id="handle">
    <rect x="4.9" y="12.0" width="8.0" height="12.0" rx="1.0" fill="#232628" stroke="#050606" stroke-width="0.25"/>
    <rect x="5.7" y="14.6" width="6.4" height="6.8" rx="0.4" fill="#ecebe6"/>
    <g id="silkscreen">
      <text id="rating" data-from="rating" x="8.9" y="19.7" font-size="4.6" font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#111213">60</text>
    </g>
  </g>
</svg>
