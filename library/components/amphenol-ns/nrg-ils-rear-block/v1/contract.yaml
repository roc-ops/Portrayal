format: 1
kind: component
name: nrg-ils-rear-block
version: 1.2.0
class: port
profile: power
description: >-
  Rear centre block of an Amphenol Network Solutions nrgILS power panel: a
  dark plate lettered nrgNET, with the two nrgNET RJ45s stacked IN over OUT on
  the left, and on the right a probe jack over three small white headers. It
  takes the place the passive panel gives its alarm card.
size: {w: 39.0, h: 42.8}
size-confidence: {w: borrowed, h: borrowed}
size-notes: >-
  The opening the 300CB08 installation guide 149722-2 A9 gives the centre
  block of every 300CB08 rear (Fig. 3-6, 39.0 by 42.8). The only image of this
  block is the rear photograph in the nrgILS300CB08 datasheet (Fig. 2), a 790
  px three-quarter view in which the plate spans about 65 px, so nothing
  inside it is measured: every position below is a fraction of the plate read
  by eye, good to two millimetres at best.
provenance:
  size: >-
    borrowed - see size-notes. The plate fills the gap between the two output
    banks in the photograph, as the passive alarm card does.
  nrgnet: >-
    datasheet and photo. The installation guide gives the nrgNET connector of
    ILS panels as a removable RJ45, IN from the controller or the upstream
    panel and OUT to the downstream one; the nrgILS datasheet calls it an
    Ethernet IN and OUT. The photograph shows two RJ45 jacks stacked under the
    nrgNET legend, the upper taken to be IN as on the nrgSMART block. EACH JACK
    IS A COMPOSED PART SINCE 1.1.0, amphenol-ns/nrgnet-jack@1, under the ids
    `nrgnet-in` and `nrgnet-out` the elements carried before, at the places they
    were drawn: the shell, the opening and the latch slot are that part's
    drawing, moved out of this skin unchanged, and its 2.0 of height is that
    part's relief. It presents the `rj45` interface and generic/rj45-plug@1
    mates it. The jack is a serial link on an RJ45 (the datasheet's
    "proprietary serial protocol"), so it states `rj45-serial` and no lamps. It
    is not std/rj45@2, a housing drawn from a maker's drawing, and it is not a
    network interface for a DCIM: nrgNET is a private bus between panels, and a
    part composed here is no port of the device, so nothing is published for it.
  probe-jack: >-
    photo - a black square-bodied jack with a round hole at the top of the
    right-hand column, as the nrgSMART block's TEMP 1. The datasheet sells two
    probes, nrgTEMP (legacy analog) and nrgILSTEMP (I2C temperature and
    humidity), and the configuration guide 155376 names Temperature 1 analog
    and Temperature 2 digital. Which socket takes the digital probe is not
    resolved. THE JACK IS STILL AN ELEMENT OF THIS SKIN and presents no
    interface, because its type is not stated.
  headers: >-
    photo - three small white rectangular headers stacked under the probe
    jack. NOTHING HELD NAMES THEM. The plain panel's two alarm headers are
    white three-way headers of about this size, and the I2C probe needs a
    socket, so they are probably the two alarm outputs and the digital probe,
    in an order nobody states. THEY ARE STILL ELEMENTS OF THIS SKIN and present
    no interface, for that reason.
  legend: >-
    photo - nrgNET is printed in white at the top left of the plate, and a
    short legend sits over the right-hand column that the photograph does not
    resolve. Only nrgNET is drawn.
  groups: >-
    The nrgILS300CB08 datasheet (p4) gives the nrgNET connector of this panel as RJ45, "Ethernet IN" from the
    controller or the upstream panel and "Ethernet OUT" to the downstream one, over a "proprietary serial protocol",
    and the installation guide 149722-2 A9 (p34, Fig. 2-30) shows the two jacks of the nrgILS panels under the legend
    nrgNET. They link a panel to the controller, so the role is management, the role the devices that place this block
    already give it. The group states the media the part states, `rj45-serial`, and no speed: the datasheet (p1) lists
    "One ethernet connection, 10/100/1000" for the panel without saying which jack carries it, and prints no rate for the
    nrgNET link. The probe jack and the three headers are still elements of the skin, not parts, and join no group.
attrs: {nrgnet-connector: rj45}
groups:
  nrgnet:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45-serial}
    description: the nrgNET jacks, IN over OUT, the panel-to-panel link to the controller
elements:
  probe: {at: [26.0, 3.0], size: [11.0, 14.0], class: port}
  header-1: {at: [24.6, 19.4], size: [12.6, 5.0], class: port}
  header-2: {at: [24.6, 26.4], size: [12.6, 5.0], class: port}
  header-3: {at: [24.6, 33.4], size: [12.6, 5.0], class: port}
parts:
  - {ref: amphenol-ns/nrgnet-jack@1, id: nrgnet-in, at: [2.2, 13.0], group: nrgnet}
  - {ref: amphenol-ns/nrgnet-jack@1, id: nrgnet-out, at: [2.2, 28.4], group: nrgnet}
