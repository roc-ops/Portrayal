<svg xmlns="http://www.w3.org/2000/svg" width="9.7mm" height="34.2mm" viewBox="0 0 9.7 34.2">
  <!-- Drawn from the wire side, as a front elevation sees a seated plug,
       unturned as amphenol-ns/output-p40@1 is placed: BATT (pole 1) above
       RTN (pole 2). Farthest from the viewer first; each node is the whole
       art of its relief feature. -->
  <!-- The ribbed press tab at the end of each latch arm. -->
  <rect id="latch-top" x="1.45" y="0" width="6.8" height="4.0" rx="0.3" fill="#1a1b1d" stroke="#101012" stroke-width="0.2"
        data-fill-from="body-color" data-stroke-derive="body-color"/>
  <rect id="latch-bottom" x="1.45" y="30.2" width="6.8" height="4.0" rx="0.3" fill="#1a1b1d" stroke="#101012" stroke-width="0.2"
        data-fill-from="body-color" data-stroke-derive="body-color"/>
  <!-- The housing, 9.7 x 26.2, with a round wire opening cut through it at
       each pole (evenodd) so the openings, standing lower, show in 3D. -->
  <path id="body" fill-rule="evenodd" fill="#1a1b1d" stroke="#101012" stroke-width="0.2"
        data-fill-from="body-color" data-stroke-derive="body-color"
        d="M 0 4.0 H 9.7 V 30.2 H 0 Z M 0.85 12.3 a 4.0 4.0 0 1 0 8.0 0 a 4.0 4.0 0 1 0 -8.0 0 Z M 0.85 22.4 a 4.0 4.0 0 1 0 8.0 0 a 4.0 4.0 0 1 0 -8.0 0 Z"/>
  <!-- The floor of each wire opening. -->
  <circle id="entry-1" cx="4.85" cy="12.3" r="4.0" fill="#0b0c0d"/>
  <circle id="entry-2" cx="4.85" cy="22.4" r="4.0" fill="#0b0c0d"/>
  <!-- One wire per pole. The drawn radius is half the default wire-od (8.0);
       a placement's wire-od resizes both, and wire-color paints both. -->
  <circle id="wire-1" cx="4.85" cy="12.3" r="4.0"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="wire-od" data-fill-from="wire-color"/>
  <circle id="wire-2" cx="4.85" cy="22.4" r="4.0"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="wire-od" data-fill-from="wire-color"/>
</svg>
