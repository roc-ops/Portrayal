format: 1
kind: component
name: nrg-rear-block
version: 1.1.0
class: port
profile: power
description: >-
  Rear centre block of an Amphenol Network Solutions nrgSMART power panel with
  an integrated controller or sensor card: the two alarm relay headers of the
  plain panel, and below them two nrgNET connectors, IN over OUT, and two
  nrgTEMP probe jacks.
size: {w: 39.0, h: 42.8}
size-confidence: {w: drawing, h: drawing}
size-notes: >-
  The centre block of the 300CB08 installation guide 149722-2 A9 Fig. 3-7, the same 39.0 by 42.8 the plain panel
  gives its alarm card in Fig. 3-6. The connectors inside it are placed from a
  threefold enlargement of that figure, about 3.2 px/mm before enlarging, so
  each is good to a millimetre and no better.
provenance:
  size: >-
    drawing - see size-notes.
  nrgnet: >-
    datasheet and photo. A removable 5-pin connector with screw-down terminals
    (controller datasheet), RS485, pins COM+, COM-, S, PWR+, PWR- with the two
    power pins unused on these panels (the 300CB08 installation guide 149722-2 A9 table 2.9.2). The guide photographs
    them as green pluggable headers silkscreened IN on the upper and OUT on the
    lower (Fig. 2-30). Their pitch is not stated; the drawing gives five ways in
    about 20, so 3.81 is drawn. EACH CONNECTOR IS A COMPOSED PART SINCE 1.1.0,
    amphenol-ns/nrgnet-header@1, under the ids `nrgnet-in` and `nrgnet-out` the
    elements carried before, at the places they were drawn; it presents the
    `screw-terminal-5` interface.
  nrgtemp: >-
    photo - two black square-bodied jacks with a round hole, the upper
    silkscreened TEMP 1 (the 300CB08 installation guide 149722-2 A9, the photograph captioned Empty Temp Ports). THE
    JACK TYPE IS NOT STATED in any document held; the probe ends in a
    phone-style plug of no stated size. The lower is taken to be TEMP 2. THE
    TWO JACKS ARE STILL DRAWN AS ELEMENTS OF THIS SKIN and present no
    interface, for that reason.
  alarm-headers: >-
    drawing - as amphenol-ns/alarm-card-307608@1, whose two headers this block
    repeats; which header is side A is not marked there either. Each is the
    composed part amphenol-ns/alarm-header@1 since 1.1.0, under the ids
    `alarm-b` and `alarm-a`, centred in the box the element drew (that drew
    12.5 and 12.2 wide, the part is the card's 11.0 by 5.5, the better-sourced
    drawing of the same header).
attrs: {nrgnet-pins: 5, nrgnet-bus: RS485}
elements:
  temp-1: {at: [23.8, 12.0], size: [10.7, 9.5], class: port}
  temp-2: {at: [23.8, 24.9], size: [10.7, 10.2], class: port}
parts:
  - {ref: amphenol-ns/alarm-header@1, id: alarm-b, at: [3.65, 2.35]}
  - {ref: amphenol-ns/alarm-header@1, id: alarm-a, at: [23.8, 2.35]}
  - {ref: amphenol-ns/nrgnet-header@1, id: nrgnet-in, at: [1.0, 13.9]}
  - {ref: amphenol-ns/nrgnet-header@1, id: nrgnet-out, at: [1.0, 27.7]}
relief:
  features:
    - node: temp-1
      out: 3.0
      color: '#1b1d20'
      confidence: estimated
      source: >-
        a jack body standing a little off the rear in the same photograph; height by eye
    - node: temp-2
      out: 3.0
      color: '#1b1d20'
      confidence: estimated
      source: >-
        see temp-1
skins: [default]
