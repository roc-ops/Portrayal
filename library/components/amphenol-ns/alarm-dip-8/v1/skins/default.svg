<svg xmlns="http://www.w3.org/2000/svg" width="21.9mm" height="4.6mm" viewBox="0 0 21.9 4.6">
  <!-- eight slide switches behind a slot; every slider drawn at the top of its track (up, OFF);
       a switch set `down` carries its slider 1.5 down the track -->
  <rect id="slot" x="0" y="0" width="21.9" height="4.6" rx="0.3" fill="#0c0d0e"/>
  <rect id="sw-1" x="0.95" y="0.7" width="1.6" height="3.2" rx="0.2" fill="#3b3e41"/>
  <rect id="sw-2" x="3.55" y="0.7" width="1.6" height="3.2" rx="0.2" fill="#3b3e41"/>
  <rect id="sw-3" x="6.15" y="0.7" width="1.6" height="3.2" rx="0.2" fill="#3b3e41"/>
  <rect id="sw-4" x="8.75" y="0.7" width="1.6" height="3.2" rx="0.2" fill="#3b3e41"/>
  <rect id="sw-5" x="11.35" y="0.7" width="1.6" height="3.2" rx="0.2" fill="#3b3e41"/>
  <rect id="sw-6" x="13.95" y="0.7" width="1.6" height="3.2" rx="0.2" fill="#3b3e41"/>
  <rect id="sw-7" x="16.55" y="0.7" width="1.6" height="3.2" rx="0.2" fill="#3b3e41"/>
  <rect id="sw-8" x="19.15" y="0.7" width="1.6" height="3.2" rx="0.2" fill="#3b3e41"/>
  <rect id="slider-1" x="1.10" y="0.85" width="1.3" height="1.4" rx="0.15" fill="#eceae5" data-move-from="sw-1" data-move="down: 0 1.5"/>
  <rect id="slider-2" x="3.70" y="0.85" width="1.3" height="1.4" rx="0.15" fill="#eceae5" data-move-from="sw-2" data-move="down: 0 1.5"/>
  <rect id="slider-3" x="6.30" y="0.85" width="1.3" height="1.4" rx="0.15" fill="#eceae5" data-move-from="sw-3" data-move="down: 0 1.5"/>
  <rect id="slider-4" x="8.90" y="0.85" width="1.3" height="1.4" rx="0.15" fill="#eceae5" data-move-from="sw-4" data-move="down: 0 1.5"/>
  <rect id="slider-5" x="11.50" y="0.85" width="1.3" height="1.4" rx="0.15" fill="#eceae5" data-move-from="sw-5" data-move="down: 0 1.5"/>
  <rect id="slider-6" x="14.10" y="0.85" width="1.3" height="1.4" rx="0.15" fill="#eceae5" data-move-from="sw-6" data-move="down: 0 1.5"/>
  <rect id="slider-7" x="16.70" y="0.85" width="1.3" height="1.4" rx="0.15" fill="#eceae5" data-move-from="sw-7" data-move="down: 0 1.5"/>
  <rect id="slider-8" x="19.30" y="0.85" width="1.3" height="1.4" rx="0.15" fill="#eceae5" data-move-from="sw-8" data-move="down: 0 1.5"/>
</svg>
