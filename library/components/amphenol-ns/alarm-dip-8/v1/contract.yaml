format: 1
kind: component
name: alarm-dip-8
version: 1.0.0
class: button
profile: power
description: >-
  Eight-position DIP switch seen through a slot in the front of an Amphenol
  Network Solutions 1RU power panel - one slide switch per breaker position on
  that side, down to enable its alarm and up to silence an empty position.
  Drawn with all eight UP, which is OFF and is how a panel with no breakers
  fitted has to be set.
size: {w: 21.9, h: 4.6}
size-confidence: {w: drawing, h: drawing}
provenance:
  size: >-
    drawing - the slot in the 300CB08 installation guide 149722-2 A9 Fig. 3-1, 21.9 by 4.6 (43 px by 9 px at 1.9685
    px/mm). The slot is what is measured; the switch body behind it is larger
    and is not seen.
  switches: >-
    estimated - eight slide actuators on a 2.6 pitch, which fits eight across
    the slot; an ordinary DIP is on 2.54. The guide numbers them 1 to 8 and
    says down is ON and up is OFF (section 2.2.9). The product photograph of
    the panel with its cover off shows two white eight-way switch blocks.
  position: >-
    THE DRAWING SHOWS ONE POSITION AND CANNOT SHOW ANOTHER. Nothing in a
    contract can yet say that a switch is up or down, so every switch is drawn
    up. A populated panel has the switches of its fitted positions down.
