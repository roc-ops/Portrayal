format: 1
kind: component
name: alarm-dip-8
version: 1.0.0
class: button
profile: power
description: >-
  Eight-position DIP switch seen through a slot in the front of an Amphenol
  Network Solutions 1RU power panel - one switch per breaker position on that
  side, down to enable its alarm and up to silence an empty position.
size: {w: 21.9, h: 4.6}
size-confidence: {w: drawing, h: drawing}
provenance:
  size: >-
    drawing - the slot in the 300CB08 installation guide 149722-2 A9 Fig. 3-1, 21.9 by 4.6 (43 px by 9 px at 1.9685
    px/mm). The slot is what is measured; the switch body behind it is larger
    and is not seen.
  switches: >-
    estimated - eight actuators on a 2.54 pitch, which is the ordinary DIP
    pitch and fits eight across the slot. The guide numbers them 1 to 8 and
    says down is ON (section 2.2.9).
elements:
  sw-1: {at: [1.10, 1.0], size: [1.5, 2.6], class: button}
  sw-2: {at: [3.64, 1.0], size: [1.5, 2.6], class: button}
  sw-3: {at: [6.18, 1.0], size: [1.5, 2.6], class: button}
  sw-4: {at: [8.72, 1.0], size: [1.5, 2.6], class: button}
  sw-5: {at: [11.26, 1.0], size: [1.5, 2.6], class: button}
  sw-6: {at: [13.80, 1.0], size: [1.5, 2.6], class: button}
  sw-7: {at: [16.34, 1.0], size: [1.5, 2.6], class: button}
  sw-8: {at: [18.88, 1.0], size: [1.5, 2.6], class: button}
