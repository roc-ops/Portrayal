format: 1
kind: component
name: alarm-dip-8
version: 1.1.0
class: button
profile: power
description: >-
  Eight-position DIP switch seen through a slot in the front of an Amphenol
  Network Solutions 1RU power panel - one slide switch per breaker position on
  that side, down to enable its alarm and up to silence an empty position.
  Drawn with all eight UP, which is OFF and is how a panel with no breakers
  fitted has to be set.
size: {w: 21.9, h: 4.6}
size-confidence: {w: drawing, h: drawing}
provenance:
  size: >-
    drawing - the slot in the 300CB08 installation guide 149722-2 A9 Fig. 3-1, 21.9 by 4.6 (43 px by 9 px at 1.9685
    px/mm). The slot is what is measured; the switch body behind it is larger
    and is not seen.
  switches: >-
    estimated - eight slide actuators on a 2.6 pitch, which fits eight across
    the slot; an ordinary DIP is on 2.54. The guide numbers them 1 to 8 and
    says down is ON and up is OFF (section 2.2.9). The product photograph of
    the panel with its cover off shows two white eight-way switch blocks.
  position: >-
    FIELDS, since 1.1.0 (docs/switch-positions-design.md): `sw-1` to `sw-8` are
    each `up` or `down`, and `down` carries its slider 1.5 down its track, from
    the top to the same 0.15 short of the bottom. The options are the switch's
    physical positions, not what they do, because that differs by panel: on the
    300CB08 and its nrgSMART versions down enables the alarm of the breaker
    position of the same number (installation guide 149722-2 A9, section 2.2.9
    and installation step 21), and on the nrgILS a switch up holds its circuit
    on, out of software control (step 21). Each device says which in its
    placements' `positions:`. The skin draws `up`, how a panel with no breakers
    fitted has to be set.
fields:
  sw-1: {label: Switch 1, type: choice, options: [up, down], default: up}
  sw-2: {label: Switch 2, type: choice, options: [up, down], default: up}
  sw-3: {label: Switch 3, type: choice, options: [up, down], default: up}
  sw-4: {label: Switch 4, type: choice, options: [up, down], default: up}
  sw-5: {label: Switch 5, type: choice, options: [up, down], default: up}
