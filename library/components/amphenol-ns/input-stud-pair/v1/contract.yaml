format: 1
kind: component
name: input-stud-pair
version: 1.0.0
class: inlet
profile: power
description: >-
  One input terminal of an Amphenol Network Solutions 1RU power panel with
  vertical inputs - two 3/8-16 studs one above the other on 1 inch centres,
  taking a dual-hole compression lug up to 1.15 inch wide.
size: {w: 29.0, h: 41.0}
size-confidence: {w: drawing, h: drawing}
provenance:
  size: >-
    drawing - the 300CB08 installation guide 149722-2 A9 Fig. 3-6: each terminal sits in a bay about 29 wide across
    the full height of the rear (94 px at 3.2006 px/mm), with the two studs
    25.3 apart, which is the 1 inch the callout states.
  studs: >-
    datasheet - 300CB08 datasheet, Inputs: two pairs of 3/8-16 studs on 1 inch
    centres per terminal, maximum lug width 1.15 inch, Keps nuts and flat
    washers.
attrs: {stud-thread: 3/8-16, stud-centres-mm: 25.4, lug-holes: 2}
elements:
  stud-top: {at: [10.9, 5.4], size: [7.2, 7.2], class: inlet}
  stud-bottom: {at: [10.9, 28.4], size: [7.2, 7.2], class: inlet}
relief:
  wall: '#0c0d0e'
  features:
    - node: washer-top
      out: 2.0
      shape: true
      color: '#b9bdc1'
      confidence: estimated
      source: >-
        a flat washer under each nut, per the datasheet (Keps nuts and flat washers); thickness not stated
    - node: nut-top
      out: 10.0
      shape: true
      color: '#d0d3d6'
      confidence: estimated
      source: >-
        a 3/8-16 hex nut is about 8.5 thick and sits on the washer; neither figure is in the documents held
    - node: stud-top
      cyl: 24.0
      thread: 1.59
      color: '#a4a9ae'
      confidence: estimated
      source: >-
        3/8-16 is 16 threads per inch, a 1.59 pitch; how far the stud stands past the nut is by eye off the rear photograph of the guide, Fig. 1-2
    - node: washer-bottom
      out: 2.0
      shape: true
      color: '#b9bdc1'
      confidence: estimated
      source: >-
        a flat washer under each nut, per the datasheet (Keps nuts and flat washers); thickness not stated
    - node: nut-bottom
      out: 10.0
