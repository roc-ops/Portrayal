format: 1
kind: component
name: lug-tag-16
version: 1.0.0
class: tab
behaviour: fills
profile: networking
description: >-
  Celestica "LUG TAG" - the black pull-out luggage tag that slides out of the bottom edge of the
  DS4101's front panel below its SFP+ pair, with a raised grip along its top edge; the narrow
  15.9 mm form. The tag itself prints LUG TAG and the model name.
size: {w: 15.9, h: 4.0}
size-confidence: {w: measured, h: measured}
attrs: {role: info-tab}
provenance:
  size: >-
    measured on the DS4101 installation guide's Product Overview Figure 1 (DS4101 Front View),
    whose face box reads 6836 x 673 px against the stated 438.5 x 43.1 mm - aspect 10.158
    against 10.174, 0.16% out, 15.6 px/mm (an upscale; edges are soft by about 0.2 mm). The
    tag reads x 416.9 to 432.8 by y 38.0 to 42.0, with a raised grip x 420 to 430 along its top.
  why-a-part: >-
    a separate pull-out card, drawn standing out of its slot in the guide figure and in the
    three-quarter marketing render (cls.celestica.com DS4101 page). celestica/lug-tag-23@1 is
    the DS4100's, 7 mm wider, so the two are separate shapes.
  label: >-
    the marketing render prints LUG TAG over the model name on the tag itself; the guide figure
    is untextured CAD and prints nothing. The model name is a field.
elements:
  tab: {at: [0.0, 0.0], size: [15.9, 4.0], class: tab}
fields:
  label: {label: Printed model name, type: text, default: ''}
relief:
  features:
    - node: tab
      out: 1.5
      confidence: estimated
      source: >-
        celestica/lug-tag-16@1 itself - the render shows the grip standing a little proud of the
        panel and nothing states by how much.
skins: [default]
