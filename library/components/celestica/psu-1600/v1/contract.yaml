format: 1
kind: module
name: psu-1600
version: 1.3.0
class: psu
behaviour: fills
profile: networking
description: Gospower G1482-1600WRA 1600W AC PSU (Celestica ES1010 FRU) - 54.5V
  output for PoE++, CRPS form factor, C14 inlet, purple release latch, fold-out
  handle, 40mm fan
size: {w: 73.5, h: 40.0}
attrs:
  power-output-w: 1600
  power-output-low-line-w: 1000
  input: ac
  model: G1482-1600WRA
  part-number: PR0B
  vendor: Gospower
  output-v: '54.5'
provenance:
  power: >-
    photo - the unit's own FRU label, captured in the intake photographs and transcribed on
    this contract under provenance.ratings: input 100-127 V 13 A or 200-240 V 10 A, output
    +54.5 V at 18.35 A or 29.35 A, and '1000W/1600W max depending on input'. THE LOW-LINE
    FIGURE IS NOW RECORDED ALONGSIDE, which it was not before: 1600 W is the 200-240 V
    rating and the supply delivers 1000 W on a 100-127 V feed, so a budget drawn on low line
    while assuming 1600 W would be 600 W over. Both check against the output rail - 54.5 x
    29.35 = 1600 and 54.5 x 18.35 = 1000. Recorded the way mx304-psu-ac and mx240-psu-ac
    already do it: high line in power-output-w, low line beside it.
  size: estimated (CRPS 1U form factor; verify with calipers)
  face: >-
    STILL ESTIMATED. The features are read from psu-face.jpeg - fan, C14, purple
    latch, black handle - but their SPACING is not measured: it was tuned around a
    c14-inlet that was 20 percent undersized, and correcting that inlet to 28 x 20
    forced a retighten of the right-hand side. psu-face.jpeg now contains a verified
    28 mm scale reference (the C14 boss), so the face can be re-derived properly
    from it and should be. NOTE: this key was DUPLICATED - a second, shorter `face:`
    reading only "photo (psu-face.jpeg ...)" followed it, and YAML keeps the last, so
    the file silently claimed the face was photo-sourced while this caveat was
    discarded at parse time. The two are merged here and the caveat is the survivor
  ratings: FRU label photo (100-127V 13A / 200-240V 10A in; +54.5V 18.35A/29.35A;
    1000W/1600W max depending on input)
  body: photo (six faces captured; card-edge blind-mate connector at the rear)
