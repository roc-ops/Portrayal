format: 1
kind: component
name: lug-tag-ridge-23
version: 1.0.0
class: tab
behaviour: fills
profile: networking
description: >-
  Celestica pull-out luggage tag, the TOP-RIDGE form in its long 23.3 mm length - a flat black
  card in a slot in the faceplate whose grip is a raised ridge running along its top edge over
  about two-thirds of its length, with the model name printed on the card below it, reading left
  to right. The DS4100's tag, and the ES1000's. Not celestica/lug-tag@1, whose grip is a block at one END; the
  short sibling of this card is celestica/lug-tag-ridge-16@1 (DS4101).
size: {w: 23.3, h: 3.8}
size-confidence: {w: measured, h: measured}
attrs: {role: info-tab}
provenance:
  size: >-
    measured twice, on two devices' orthographic guide figures. DS4100 Front Panel Callouts
    (4.08 px/mm): the slot reads x 383.0-405.8, 22.8 long, from y 38.3 to the panel's bottom
    edge. ES1000 - the slot as celestica/es1000 records it (23.3 mm long, from x 23.1, on the
    ES1000 guide's Front Panels figure 1 at 3.438 px/mm), and 3.8 mm tall on the same figure,
    where the dark slot outline reads about 13 px against the card's 11. At 3.4 px/mm both are
    good to about 0.3 mm.
  ridge: >-
    measured on the same figure: the lighter raised band spans about 15% to 85% of the slot's
    length (3.6 to 19.6 in the part's frame), and the vendor three-quarter render (cls.celestica.com
    ES1000 page, the tag close-up at x6) shows it as a ridge standing along the card's TOP edge and
    sloping down at each end, with ES1000 printed on the card beneath it. Its height on the face
    (0.9 mm) is estimated from the render.
  one-contract-or-two: >-
    Two contracts, because the two lengths are two sizes and size is a contract's geometry - see
    celestica/lug-tag-ridge-16@1, which is drawn to the same recipe at 15.9 x 4.0.
  label: >-
    render - the ES1000 render prints ES1000 on the card and LUG TAG on the panel below it; the
    DS4100 render (cls.celestica.com ds4100_front) prints DS4100 on the card, with the same hatched
    top-edge grip and rounded ends, and LUG TAG on the panel above. The label is a field.
  relief: >-
    estimated, following celestica/lug-tag@1 and common/pull-tab@1: the card stands a little proud
    of its slot and the ridge stands further. No held document dimensions either standoff.
  body: >-
    estimated - the same 70 deep and 55 of travel celestica/lug-tag@1 carries for a card of this
    length; no document dimensions either.
elements:
  tab: {at: [0.3, 0.3], size: [22.7, 3.2], class: tab}
fields:
  label:
    label: Printed model name
    type: text
    default: ''
relief:
  features:
    - node: tab
      out: 1.2
      color: '#26292d'
      confidence: estimated
      source: >-
        celestica/lug-tag@1 - the card's standoff from its slot; not dimensioned for this card
        either.
    - node: tab-ridge
      out: 2.4
      color: '#34383d'
      confidence: estimated
      source: >-
        celestica/lug-tag@1's grip figure, applied to this card's top-edge ridge; the ridge's height
        is seen on the ES1000 render and not dimensioned.
skins: [default]
body:
  depth: 70
  travel: 55
  color: '#26292d'
