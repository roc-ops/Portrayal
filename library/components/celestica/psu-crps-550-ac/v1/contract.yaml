format: 1
kind: module
name: psu-crps-550-ac
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  550 W AC CRPS supply of the Celestica ES1000-24, -48 and -48C - C14 inlet turned portrait, 40 mm fan, black release tab, fold-down handle, one status lamp. Offered F2B and B2F; the vendor part number is not published.
size: {w: 73.5, h: 40.0, d: 185.0}
size-confidence: {w: registry, h: registry, d: registry}
conforms: crps-1u
attrs: {power-output-w: 550, input: ac, form-factor: crps-1u}
provenance:
  size: >-
    registry - the CRPS 1U module envelope (73.5 x 40, 185 deep). The ES1000 rear figure agrees: each supply face measures 73.5 wide on the ES1010 guide's 5736 px copy of the same rear art (256.0 to 329.5 and 346.3 to 419.8 mm across the body)
  depth: >-
    registry - CRPS 1U nominal 185; no Celestica document states the supply depth
  face: >-
    measured - every feature is read off the ES1010/ES1050/EG1050 guide Rear Panel figure 1 (5736 x 634 px, 11.5 px/mm across, orthographic CAD render), which is the same rear art as the ES1000 guide's own Rear Panel figure 2 (1681 x 182, 3.35 px/mm) - checked by placing both at matched scale: fan, inlet, latch and the two bottom lamps land within 0.5 mm. Fan left, C14 portrait at right with its earth pin outboard, the black release tab to the right of the inlet ('Press the black tab next to the power receptacle', ES1000 guide PSU Removal step 2), fold-down handle along the bottom, two lamp windows either side of a dark round boss nobody documents.
  power: >-
    datasheet - ES1000 guide PSU Power Options: '2 x 550W PSUs are used in the ES1000-24, ES1000-48C and ES1000-48'; Table of Attributes, PSU column '2 x 550W'. Output rating as the vendor states it; no low-line derating is stated for this supply.
  leds: >-
    datasheet - ES1000 guide PSU LEDs Table 1, 550W row: ONE lamp, green on (output OK), amber on (failure, or AC lost while the second supply is powered), off. The guide's rear figures draw two lamp windows on every supply and say the rear 'of all ES1000 systems is visually identical', so the face keeps the second window unlit and unaddressed (window-right) rather than inventing a lamp the table does not describe; which of the two windows the 550 W lamp is is NOT stated - the left one is assumed.
states: [ok, fail, absent]
elements:
  handle: {at: [1.8, 28.0], size: [39.4, 10.8], class: handle}
  latch: {at: [67.0, 13.8], size: [4.6, 18.2], class: latch}
  status-led:
    at: [43.8, 35.1]
    size: [3.0, 3.0]
    class: led
    states:
      - 'off'
      - {name: ok, color: '#22c55e'}
      - {name: fail, color: '#f59e0b'}
parts:
  - {ref: std/c14-inlet@1, id: inlet, at: [40.75, 5.1], rotate: 90}
relief:
  features:
    - node: handle
      uhandle: 10.0
      confidence: estimated
      source: >-
        the ES1000 guide shows the supply only face-on and in a three-quarter view, so every out-of-plane depth here is a proportion of the three-quarter render, not a measurement.
    - node: latch
      out: 2.5
      confidence: estimated
      source: >-
        the ES1000 guide shows the supply only face-on and in a three-quarter view, so every out-of-plane depth here is a proportion of the three-quarter render, not a measurement; the tab hangs proud of the inlet in ES1000 guide PSU Removal figure 2.
    - node: status-led
      dome: 0.3
      confidence: estimated
      source: common/led-dot@1 - the lamp dome the library carries for small panel lamps; unmeasured here.
connection-points:
  power: {at: [54.8, 15.1], direction: rear}
body:
  depth: 185.0
  color: '#c3c7cc'
skins: [default]
