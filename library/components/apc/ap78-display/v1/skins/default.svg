<svg xmlns="http://www.w3.org/2000/svg" width="22mm" height="17mm" viewBox="0 0 22 17">
  <!-- The two-digit display of the APC AP7821B and AP7921B as the datasheet photographs show it: a pale
       window round two ghosted seven-segment cells. Cell size and the lit colour are stand-ins. -->
  <rect id="bezel" x="0.15" y="0.15" width="21.7" height="16.7" rx="0.4" fill="#adb8b4" stroke="#555a58" stroke-width="0.3"/>
  <rect id="window" x="0.3" y="0.3" width="21.4" height="16.4" fill="#adb8b4"/>
  <g id="ghost" fill="#9aa5a1">
    <rect x="4.60" y="2.70" width="5.40" height="1.30" rx="0.4"/>
    <rect x="3.40" y="3.70" width="1.30" height="4.60" rx="0.4"/>
    <rect x="9.70" y="3.70" width="1.30" height="4.60" rx="0.4"/>
    <rect x="4.60" y="7.70" width="5.40" height="1.30" rx="0.4"/>
    <rect x="3.40" y="8.70" width="1.30" height="4.60" rx="0.4"/>
    <rect x="9.70" y="8.70" width="1.30" height="4.60" rx="0.4"/>
    <rect x="4.60" y="13.00" width="5.40" height="1.30" rx="0.4"/>
    <rect x="13.60" y="2.70" width="5.40" height="1.30" rx="0.4"/>
    <rect x="12.40" y="3.70" width="1.30" height="4.60" rx="0.4"/>
    <rect x="18.70" y="3.70" width="1.30" height="4.60" rx="0.4"/>
    <rect x="13.60" y="7.70" width="5.40" height="1.30" rx="0.4"/>
    <rect x="12.40" y="8.70" width="1.30" height="4.60" rx="0.4"/>
    <rect x="18.70" y="8.70" width="1.30" height="4.60" rx="0.4"/>
    <rect x="13.60" y="13.00" width="5.40" height="1.30" rx="0.4"/>
  </g>
  <g id="digit-1" fill="#d03a30">
    <rect data-seg="a" opacity="0" x="4.60" y="2.70" width="5.40" height="1.30" rx="0.4"/>
    <rect data-seg="f" opacity="0" x="3.40" y="3.70" width="1.30" height="4.60" rx="0.4"/>
    <rect data-seg="b" opacity="0" x="9.70" y="3.70" width="1.30" height="4.60" rx="0.4"/>
    <rect data-seg="g" opacity="0" x="4.60" y="7.70" width="5.40" height="1.30" rx="0.4"/>
    <rect data-seg="e" opacity="0" x="3.40" y="8.70" width="1.30" height="4.60" rx="0.4"/>
    <rect data-seg="c" opacity="0" x="9.70" y="8.70" width="1.30" height="4.60" rx="0.4"/>
    <rect data-seg="d" opacity="0" x="4.60" y="13.00" width="5.40" height="1.30" rx="0.4"/>
  </g>
  <g id="digit-2" fill="#d03a30">
    <rect data-seg="a" opacity="0" x="13.60" y="2.70" width="5.40" height="1.30" rx="0.4"/>
    <rect data-seg="f" opacity="0" x="12.40" y="3.70" width="1.30" height="4.60" rx="0.4"/>
    <rect data-seg="b" opacity="0" x="18.70" y="3.70" width="1.30" height="4.60" rx="0.4"/>
    <rect data-seg="g" opacity="0" x="13.60" y="7.70" width="5.40" height="1.30" rx="0.4"/>
    <rect data-seg="e" opacity="0" x="12.40" y="8.70" width="1.30" height="4.60" rx="0.4"/>
    <rect data-seg="c" opacity="0" x="18.70" y="8.70" width="1.30" height="4.60" rx="0.4"/>
    <rect data-seg="d" opacity="0" x="13.60" y="13.00" width="5.40" height="1.30" rx="0.4"/>
  </g>
</svg>
