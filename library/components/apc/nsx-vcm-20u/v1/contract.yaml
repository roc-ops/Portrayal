name: nsx-vcm-20u
version: 1.0.0
class: mechanical
description: 'The 20U length of the APC NetShelter vertical cable manager AR7722, seen face on: a rail down the
  left edge and 20 smooth loops one rack unit apart reaching across the 107 mm width, each a gap a patch cord is
  laid in through'
provenance:
  size: 'datasheet - 107 mm wide and 45 mm deep, the AR7722 data sheet. 20 loops is READ OFF the installation sheet''s
    figure (990-5140A, page 1, the length labelled "20U", counted at 300 dpi) and agrees with the length: 20 x 44.45
    = 889.0. The loop is 31 high (about 70 per cent of the pitch) and the rail 12 wide, ESTIMATED from the figure,
    which is not dimensioned.'
  relief: 'estimated - the loops are solid slabs 45 deep, the data sheet''s depth: no view sections a loop, so how
    deep each is, and that it is a slab and not an open frame, is a stand-in.'
  color: 'datasheet - "Color: Black" on the data sheet. The shade is this library''s render of black plastic.'
