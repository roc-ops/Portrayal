format: 1
kind: component
name: nsx-vcm-20u
version: 2.0.0
class: mechanical
description: The 20U length of the APC NetShelter vertical cable manager AR7721, seen from the crossbar side. Twenty crossbars,
  one rack unit apart, reach out from a plate down the right edge. Each has a lip at its outer end. A grey strip with a
  block to each crossbar runs along the plate edge.
provenance:
  size: 'datasheet - 107 mm wide, 45 mm deep and 889 mm long, 20 x 44.45: the AR7721 data sheet, page 1. The 20 crossbars
    are COUNTED on its page 5 photographs, twice. The plate and strip are 44 wide, read at 105 px of 2.41 px/mm; the dark
    plate is 33 and the grey strip 11. The crossbars are 7 thick and 63 long. Each has a 2.5 x 36 lip at the outer end,
    92 of 107 px tall on the photograph. The strip has a 7 mm block to each crossbar. The scale is the 44.45 mm crossbar
    pitch. These are ESTIMATED from the photographs, which are not dimensioned, to within about 2 mm.'
  relief: estimated - every solid stands 45 deep, the data sheet's depth. No photograph sections a crossbar, so how deep
    each is, is a stand-in.
  marks: estimated - two round marks on the plate, near the 3rd and the 18th crossbar, read at 0.81 mm a pixel from the
    photograph. No document says what they are, so they are painted flat.
  color: 'datasheet - "Color: Black" on the data sheet. The shade is this library''s render of black plastic. The lit photograph
    samples the plate at #2a2a2a, the strip at #444444 and the blocks at #373738.'
