  depth: >-
    estimated - 300, as perf-vcm-base-6: the data sheets' 14.2 in (360 mm) single-sided and 26.0 in
    (660 mm) double-sided give a well of 300 and a back plate zone of 60, a derivation and not a
    reading.
  color: >-
    datasheet - "Color: Black" on the data sheet. The shade is this library's render of black
    powder-coated steel.
