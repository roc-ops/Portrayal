name: pdu-cord-l6-30p
version: 1.0.0
class: inlet
profile: power
unmated: the fixed input cord of the PDU, ending in a NEMA L6-30P locking plug. The plug is the cord's own end. Nothing plugs into it and no mate is offered.
description: >-
  The fixed input cord of the APC AP9571A, 11.98 ft (3.65 m) long with a NEMA L6-30P plug. It leaves the left end of the
  outlet face through a round base. A round cord stands in the base, perpendicular to the face. Only the round base and
  the end of the round cord are drawn, seen straight on.
size: {w: 33.0, h: 33.0}
size-confidence: {w: estimated, h: estimated}
attrs: {plug: nema-l6-30p, cord-length-m: 3.65}
provenance:
  size: >-
    ESTIMATED. The best picture is the maker's 1500 px outlet-face photograph. The 369 px photograph is its small copy
    and cannot tell round from squared. At the boss the face reads 95.3 px for 44 mm, so the scale is 2.17 px per mm
    across it. The boss's round outline reads 71 px high, rows 673.2 to 744.3, which is 33 mm. It was read by eye in a
    crop enlarged 14 times. The boss is 33 mm high, good to about 3 mm. The base is drawn as a circle of that diameter.
    needs-drawing: a straight-on photograph of the left end, or a drawing.
  plug: >-
    datasheet - page 1 of the 5 Nov copy of the AP9571A data sheet. It prints "Input Connection Type NEMA L6-30P", "Number
    of cables 1" and "Cable length 3.65 m". The 10 Nov copy prints "Cable length 11.98 ft (3.65 m)". The 1500 px
    photograph shows one round cable leaving the boss to the left. The data sheet says one cord.
  base: >-
    PHOTOGRAPH. The 1500 px outlet-face photograph from the maker's page shows the cord leaving the face's left end
    through a round boss. A round cable runs out of it to the left. The 369 px photograph is its small copy and cannot tell
    round from squared. The photograph is a perspective view from the front left, so the angle the cord shows in it
    belongs to the camera. The base and the cord are taken to stand perpendicular to the face. Straight on, they show as a
    circle and an end-on circle. At the base the face reads 95.3 px for 44 mm, so the scale is 2.17 px per mm across it.
    The scale is 1.506 px per mm along the face, which is 0.37 px per mm at 369 px times 4.07. The base's footprint on the
    face is read from the shank's flat top, the shank's straight right side and the boss's lower edge. The round outline
    was read by eye in a crop enlarged 14 times. The flat top is at row 673.5, 9.7 mm below the face top, good to about 1
    mm: 2 px. The right side is at column 448.5, 33 mm from the face edge, read on rows 695 to 720, good to about 3.5 mm.
    That is 2 px, 1.3 mm, plus 2.0 mm for the scale spread. The boss's front face spans rows 673.2 to 744.3, which is 9.5
    to 42.5 mm below the face top. It is 33 mm high, good to about 3 mm: 2 px at each end, 0.9 mm each, plus 1 mm for the
    dark lower arc. The shank's own lower edge is dark on dark below row 729, 35.3 mm below the face top, and is not
    read. So the base is a circle 33 mm across, centred 16.5 mm from the face edge and 26.0 mm below the face top. Each is
    good to about 3.5 mm. The circle reaches the face edge and does not pass it, so it is not cut. A base that stands out
    of the face shows its front face shifted by its depth in an oblique picture. The front face's right extreme reads
    19.5 mm and the footprint's right side 33 mm, a shift of 13.5 mm. The cord is 22 mm across, good to about 2 mm. Its
    outer edges are the first and last crossing of grey level 200 against the white background. It reads 46.5 px at
    columns 200 to 280, which is 21.4 mm, and 49.7 px near the boss, which is 22.9 mm. The drawn diameter is the mean of
    the two readings, rounded. The cord's centre reads 29.5 mm below the face top at the face edge, and the boss's centre
    reads 26.0 mm. That is an offset of 3.5 mm, inside the 5 mm that the cord's 2 mm and the boss's 3 mm add up to. The
    picture's angle explains it. The two end-on circles share one centre, so the cord is drawn at 26.0 mm below the face
    top. Along the cord the centre falls to 34.9 mm at column 260. That is read as the cord's bend and is not drawn. The
    photograph shows a straight-sided shank, like a nut. Some features belong only to the oblique view and are not seen
    straight on. The shank's top and side faces and the lit vertical edge are not drawn. The bright arc on the boss's rim,
    the cord's highlight stripes and the nub on the boss are not drawn. The photograph also shows the cord entering a dark
    opening in a lighter ring. Straight on, that is a darker disc in a ring. Its diameter cannot be read from the oblique
    view, so no inner circle is drawn. A round mark stands right of the shank in the photograph. It is left to the marks.
    The base's depth cannot be read. The cord's perpendicular stand is the direction taken, not a reading.
  not-drawn: >-
    THE CORD BEYOND THE FACE EDGE IS NOT DRAWN: the face view ends at the unit's left edge. The plug is not drawn
    either, as the far end of a cord is not a part. This part stands for the power input a DCIM records, a NEMA L6-30P
    power port.
