name: pdu-cord-l6-30p
version: 1.0.0
class: inlet
profile: power
unmated: the fixed input cord of the PDU, ending in a NEMA L6-30P locking plug. The plug is the cord's own end. Nothing plugs into it and no mate is offered.
description: >-
  The fixed input cord of the APC AP9571A, 11.98 ft (3.65 m) long with a NEMA L6-30P plug. It leaves the left end of the
  outlet face through a round strain relief. Only the strain relief is drawn, as the data sheet photograph shows it.
size: {w: 20.0, h: 20.0}
size-confidence: {w: estimated, h: estimated}
attrs: {plug: nema-l6-30p, cord-length-m: 3.65}
provenance:
  size: >-
    ESTIMATED. The only picture is a 369 px product photograph, taken at an angle. The strain relief reads about 8 px
    across, and the 445 mm face runs about 245 px with perspective. So it is drawn 20.0, as the maker's other fixed cord
    part is. needs-drawing: a straight-on photograph of the left end, or a dimensioned drawing.
  plug: >-
    datasheet - AP9571A data sheet, page 1: "Input Connection Type NEMA L6-30P", "Number of cables 1" and "Cable length
    3.65 m". The photograph shows two grey lines leaving the left end. At that size it cannot tell one looped cord from
    two cords. The data sheet says one.
  not-drawn: >-
    THE CORD BEYOND THE STRAIN RELIEF AND THE PLUG ARE NOT DRAWN: the far end of a cord is not a part. This part stands for
    the power input a DCIM records, a NEMA L6-30P power port.
elements:
