format: 1
kind: component
name: pdu-cord-l6-30p
version: 1.0.0
class: inlet
profile: power
unmated: the fixed input cord of the PDU, ending in a NEMA L6-30P locking plug. The plug is the cord's own end. Nothing plugs into it and no mate is offered.
description: >-
  The fixed input cord of the APC AP9571A, 11.98 ft (3.65 m) long with a NEMA L6-30P plug. It leaves the left end of the
  outlet face through a round boss, a strain relief. A round cord runs out of the boss to the left, along the length of
  the unit. Only the round boss and the start of the round cord are drawn.
size: {w: 33.0, h: 33.0}
size-confidence: {w: estimated, h: estimated}
attrs: {plug: nema-l6-30p, cord-length-m: 3.65}
provenance:
  size: >-
    ESTIMATED. The best picture is the maker's 1500 px outlet-face photograph. The 369 px photograph is its small copy
    and cannot tell round from squared. At the boss the face reads 95.3 px for 44 mm, so the scale is 2.17 px per mm
    across it. The boss's round outline reads 71 px high, rows 673.2 to 744.3, which is 33 mm. It was read by eye in a
    crop enlarged 14 times. The boss is 33 mm high, good to about 3 mm.
    needs-drawing: a straight-on photograph of the left end, or a drawing.
  plug: >-
    datasheet - page 1 of the 5 Nov copy of the AP9571A data sheet. It prints "Input Connection Type NEMA L6-30P", "Number
    of cables 1" and "Cable length 3.65 m". The 10 Nov copy prints "Cable length 11.98 ft (3.65 m)". The 1500 px
    photograph shows one round cable leaving the boss to the left. The data sheet says one cord.
  boss: >-
    PHOTOGRAPH. The 1500 px outlet-face photograph from the maker's page shows the cord leaving the face's left end
    through a round boss. A round cable runs out of it to the left. The 369 px photograph is its small copy and cannot tell
    round from squared. At the boss the face reads 95.3 px for 44 mm, so the scale is 2.17 px per mm across it. The scale
    is 1.506 px per mm along the face, which is 0.37 px per mm at 369 px times 4.07. The boss's front face is an ellipse
    and a shank runs on to its right. The round outline was read by eye in a crop enlarged 14 times. The boss is 33 mm
    high, rows 673.2 to 744.3, and stands 9.5 mm below the face top. That is good to about 3 mm: 2 px at each end,
    0.9 mm each, plus 1 mm for the dark lower arc. The boss stands 0 to 33 mm from the face's left edge, good to about
    3.5 mm. That is 2 px, 1.3 mm, plus 2.0 mm for the scale spread. The ellipse's left extreme stands 6.7 px,
    left of the face edge, which is 4.5 mm along the face. The view ends at the edge, so the ellipse is drawn whole from it,
    4.5 mm right of the photograph. That is beyond the 3.5 mm limit. The light edge stands 21 mm from the face's left edge, good to about 2 mm. That is 1 px, 0.7 mm, plus 1.3 mm for the scale spread. It reads at columns 428.6 to
    432.9. The cord is 22 mm high, good to about 2 mm. Its outer edges are the first and last crossing of grey level 200
    against the white background. It reads 46.5 px at columns 200 to 280, which is 21.4 mm, and 49.7 px near the boss,
    which is 22.9 mm. The drawn height is the mean of the two readings, rounded. The cord's centre reads 29.5 mm below the
    face top, so it is drawn 18.5 to 40.5 mm below the face top. It stands 3.5 mm lower than the boss's centre, as the
    picture shows. The shank looks faceted in the photograph and is drawn round, as the boss and the cord are. The photograph
    also shows the cord entering a dark opening in a lighter ring. It shows a second highlight stripe on the cord and a
    small nub on the disc's upper left. None of these is drawn. The shank's lower edge, the boss's thickness and the cord's angle to the face cannot be read. Nothing held shows the boss from the end.
  not-drawn: >-
    THE CORD BEYOND THE FACE EDGE IS NOT DRAWN: the face view ends at the unit's left edge. The plug is not drawn
    either, as the far end of a cord is not a part. This part stands for the power input a DCIM records, a NEMA L6-30P
    power port.
