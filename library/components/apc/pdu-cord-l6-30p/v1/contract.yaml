format: 1
kind: component
name: pdu-cord-l6-30p
version: 1.0.0
class: inlet
profile: power
unmated: the fixed input cord of the PDU, ending in a NEMA L6-30P locking plug. The plug is the cord's own end. Nothing plugs into it and no mate is offered.
description: >-
  The fixed input cord of the APC AP9571A, 11.98 ft (3.65 m) long with a NEMA L6-30P plug. It leaves the left end of the
  outlet face through a squared, boxy boot with a light vertical edge. Two flat grey lines show the cord leaving the boot
  to the left from its lower half, along the length of the unit. Only the boot and the first 4 mm of the two lines are
  drawn.
size: {w: 23.0, h: 28.0}
size-confidence: {w: estimated, h: estimated}
attrs: {plug: nema-l6-30p, cord-length-m: 3.65}
provenance:
  size: >-
    ESTIMATED. The only picture is a 369 px product photograph, taken at an angle. At the boot the face reads about 22 px
    high for 44 mm, so 0.5 px per mm. The boot reads about 10 px wide and 14 px high. So it is drawn 19.0 by 28.0, good
    to about 6 mm. needs-drawing: a straight-on photograph of the left end, or a drawing.
  plug: >-
    datasheet - page 1 of the 5 Nov copy of the AP9571A data sheet. It prints "Input Connection Type NEMA L6-30P", "Number
    of cables 1" and "Cable length 3.65 m". The 10 Nov copy prints "Cable length 11.98 ft (3.65 m)". The photograph shows two
    grey lines leaving the boot to the left. At that size it cannot tell one looped cord from two cords. The data sheet
    says one.
  boot: >-
    PHOTOGRAPH. The 369 px outlet-face photograph, 9 times enlarged, shows a squared boot at the left corner of the face. A
    light vertical edge stands on its right. The cord leaves toward the left along the length of the unit, as two flat grey
    parallel lines. They leave the lower half of the boot. At 0.5 px per mm the pair reads about 8 to 10 px, or 16 to 20 mm,
    counting its shadow. The two lines themselves are drawn at 12 to 25 mm of the boot's 28 mm, good to about 4 mm.
    Nothing held shows the boot from the end.
  not-drawn: >-
    THE CORD BEYOND THE FIRST 4 MM IS NOT DRAWN: the face view ends at the unit's left edge. The plug is not drawn
    either, as the far end of a cord is not a part. This part stands for the power input a DCIM records, a NEMA L6-30P
    power port.
elements:
  relief: {at: [4, 0], size: [19.0, 28.0], class: inlet}
skins: [default]
