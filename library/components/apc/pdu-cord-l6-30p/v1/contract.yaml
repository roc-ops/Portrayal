format: 1
kind: component
name: pdu-cord-l6-30p
version: 1.0.0
class: inlet
profile: power
unmated: the fixed input cord of the PDU, ending in a NEMA L6-30P locking plug. The plug is the cord's own end. Nothing plugs into it and no mate is offered.
description: >-
  The fixed input cord of the APC AP9571A, 11.98 ft (3.65 m) long with a NEMA L6-30P plug. It leaves the left end of the
  outlet face through a squared, boxy boot with a light vertical edge. Two flat grey lines show the cord leaving the boot
  to the left from its middle and lower part, along the length of the unit. Only the boot and the two lines from it to the
  face edge are drawn.
size: {w: 33.0, h: 28.0}
size-confidence: {w: estimated, h: estimated}
attrs: {plug: nema-l6-30p, cord-length-m: 3.65}
provenance:
  size: >-
    ESTIMATED. The only picture is a 369 px product photograph, taken at an angle. At the boot the face reads 24.7 px
    high for 44 mm, so 0.56 px per mm across it. Along it the scale is about 0.4 px per mm. The boot reads 7.5 px wide and
    16 px high: rows 166 to 182. The top is the first dark row at 106 to 108 px. The bottom is where the lit left side
    steps down, at row 182. So the boot is 28 mm high, from 16 px at 0.56 px per mm, which is 28.6 mm. Its width is 19 mm,
    from 7.5 px at 0.4 px per mm. At 0.37 px per mm it would be 20 mm. Both are good to about 4 mm, as the bottom row
    cannot be told from the face's shaded lower edge. It is drawn 19.0 by 28.0.
    needs-drawing: a straight-on photograph of the left end, or a drawing.
  plug: >-
    datasheet - page 1 of the 5 Nov copy of the AP9571A data sheet. It prints "Input Connection Type NEMA L6-30P", "Number
    of cables 1" and "Cable length 3.65 m". The 10 Nov copy prints "Cable length 11.98 ft (3.65 m)". The photograph shows two
    grey lines leaving the boot to the left. At that size it cannot tell one looped cord from two cords. The data sheet
    says one.
  boot: >-
    PHOTOGRAPH. The 369 px outlet-face photograph, enlarged 24 times, shows a squared boot at the left corner of the face.
    The boot spans 103.5 to 111 px. The face's left edge stands at 98.5 px, so the boot's left edge is 5 px in and its
    right side 12.5 px in. Along the face the scale is 0.37 px per mm out to the first round mark. That is 17 px for
    46 mm, so 2.7 mm per px. The boot is read at 5 px and 12.5 px at 2.7 mm per px, which is 13.5 and 33.8 mm. The boot stands
    14 to 33 mm from the face's left edge, good to about 4.5 mm. That is 2.7 mm for a pixel plus 1.75 mm for the scale spread.
    A scale of 0.4 px per mm gives 12.5 and 31 mm, inside that
    limit. The plain-face photograph shows no boot and no cord. A light vertical edge, one pixel wide, stands at 106 to 107 px. That is about 40 percent
    across the boot from its left, and it is drawn there. The edge stands 40 percent across the boot, plus or minus 6 points,
    from a right side at 111 px, plus or minus 1 px. The edge reads 9 to 10 px high, so it is drawn 18 mm high.
    The cord leaves toward the left along the length of the unit, as two flat grey parallel lines. They leave the middle
    and lower part of the boot. The pair reads from 170.7 to 181.7 px, so 11 px. The face reads 24.7 px for 44 mm, so
    11 px is 20 mm. So the pair is 20 mm high, and it is drawn 8 to 28 mm of the boot's 28 mm. Each line was read in the
    columns x 87 to 91 and 96, where it stands on the white background. The cut is the grey level of 140, between the dark
    line and the light gap. The upper line reads 2.7 px, the gap 2.6 px and the lower line 6 px. At 0.56 px per mm across the face
    that is 4.8, 4.6 and 10.8 mm. They are drawn 3.5, 6 and 10.5 mm. Each is an estimate good to about 2 mm, so the split
    is an estimate. The pair reads 18 to 37 mm
    below the face top, so the boot is placed 10 mm below it. At 10 mm the pair stands 18 to 38 mm below the face top and
    the edge 15 to 33 mm, as read. Nothing held shows the boot from the end.
  not-drawn: >-
    THE CORD BEYOND THE FACE EDGE IS NOT DRAWN: the face view ends at the unit's left edge. The plug is not drawn
    either, as the far end of a cord is not a part. This part stands for the power input a DCIM records, a NEMA L6-30P
    power port.
