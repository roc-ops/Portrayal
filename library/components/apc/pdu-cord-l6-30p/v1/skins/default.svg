<svg xmlns="http://www.w3.org/2000/svg" width="33mm" height="28mm" viewBox="0 0 33 28">
  <!-- The input cord leaving the left end of the outlet face: a squared boot, and the cord's two flat lines running from the face edge to it. -->
  <rect id="cord-line-1" x="0" y="8" width="15" height="3.5" fill="#7d8085"/>
  <rect id="cord-line-2" x="0" y="17.5" width="15" height="10.5" fill="#7d8085"/>
  <rect id="relief" x="14" y="0" width="19" height="28" rx="1.2" fill="#1b1c1e" stroke="#4a4d51" stroke-width="0.25"/>
  <rect id="boot-edge" x="21.1" y="5" width="1" height="18" fill="#8a8d91"/>
</svg>
