<svg xmlns="http://www.w3.org/2000/svg" width="23mm" height="28mm" viewBox="0 0 23 28">
  <!-- The input cord leaving the left end of the outlet face: a squared boot, and the cord's two flat lines leaving it to the left. -->
  <rect id="cord-line-1" x="0" y="12" width="5" height="6" fill="#7d8085"/>
  <rect id="cord-line-2" x="0" y="19" width="5" height="6" fill="#7d8085"/>
  <rect id="relief" x="4" y="0" width="19" height="28" rx="1.2" fill="#1b1c1e" stroke="#4a4d51" stroke-width="0.25"/>
  <rect id="boot-edge" x="20.6" y="3" width="1" height="22" fill="#8a8d91"/>
</svg>
