<svg xmlns="http://www.w3.org/2000/svg" width="33mm" height="33mm" viewBox="0 0 33 33">
  <!-- The input cord leaving the left end of the outlet face, seen straight on: a round base and the round cord end-on in it, one axis. -->
  <defs>
    <radialGradient id="base-shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a2c2f"/><stop offset="1" stop-color="#17181a"/>
    </radialGradient>
    <radialGradient id="cord-shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4a4d51"/><stop offset="0.6" stop-color="#2a2c2f"/><stop offset="1" stop-color="#0d0e0f"/>
    </radialGradient>
  </defs>
  <circle id="relief" cx="16.5" cy="16.5" r="16.5" fill="url(#base-shade)" stroke="#4a4d51" stroke-width="0.25"/>
  <circle id="cord" cx="16.5" cy="16.5" r="11" fill="url(#cord-shade)" stroke="#3c3f43" stroke-width="0.3"/>
</svg>
