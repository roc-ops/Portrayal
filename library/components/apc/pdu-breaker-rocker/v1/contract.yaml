format: 1
kind: component
name: pdu-breaker-rocker
version: 1.0.0
class: breaker
profile: power
description: >-
  The rocker circuit breaker of an APC NetShelter basic rack PDU. It is a small dark block standing proud of the outlet
  face, in its upper half. One stands before the first bank of outlets and one between the two banks. It stands for the
  class and no rating is given. The data sheet states only that the unit has a circuit breaker.
size: {w: 13.0, h: 18.0}
size-confidence: {w: estimated, h: estimated}
provenance:
  size: >-
    ESTIMATED. The AP9571A product photograph (369 px, angled) was enlarged 20 times. The second block reads 8 px wide and
    12 px high, at 0.7 px per mm. The first reads 7 px wide and 10 px high, at 0.5 px per mm. That is about 11 by 17 mm
    and 14 by 20 mm. So it is drawn 13.0 by 18.0. One pixel is 1.4 to 2 mm. The angle foreshortens the width. So the
    figure is good to about 3 mm. needs-drawing: a straight-on photograph or a dimensioned drawing.
  rating: >-
    NOT STATED. The data sheet gives "Protection type Circuit breaker" and nothing of its rating, poles or number. The
    contract carries no rating.
  states: >-
    ESTIMATED. The states `on` and `off` are the library's vocabulary for a breaker, not read from a picture. Nothing held
    shows the I and O marks or which way the rocker tips, so both states draw alike.
elements:
  rocker: {at: [0, 0], size: [13.0, 18.0], class: breaker, states: ['on', 'off']}
skins: [default]
