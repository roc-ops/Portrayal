format: 1
kind: component
name: pdu-breaker-rocker
version: 1.0.0
class: breaker
profile: power
description: >-
  The rocker circuit breaker of an APC NetShelter basic rack PDU. It is a small dark block standing proud of the outlet
  face. One stands before the first bank of outlets and one between the two banks. It stands for the
  class and no rating is given. The data sheet states only that the unit has a circuit breaker.
size: {w: 10.0, h: 18.0}
size-confidence: {w: estimated, h: estimated}
provenance:
  size: >-
    ESTIMATED. The AP9571A product photograph (369 px, angled) shows the block about 4 px wide and about 10 px high at
    14 times magnification. An outlet 22 mm wide reads about 10 px. So it is drawn 10.0 by 18.0 and is good to about
    4 mm. needs-drawing: a straight-on photograph or a dimensioned drawing.
  rating: >-
    NOT STATED. The data sheet gives "Protection type Circuit breaker" and nothing of its rating, poles or number. The
    contract carries no rating.
  state: >-
    The rocker is drawn as a dark block with its top edge lighter. Nothing held shows the I and O marks or which way it
    tips, so both states draw alike.
elements:
  rocker: {at: [0, 0], size: [10.0, 18.0], class: breaker, states: ['on', 'off']}
skins: [default]
