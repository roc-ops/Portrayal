format: 1
kind: component
name: nsx-vcm-750-fingers
version: 1.0.0
class: mechanical
description: One 20U length of fingers of the APC NetShelter vertical cable manager AR7580A seen end-on from the
  working face - twenty smooth plastic fingers one rack unit apart down one side of the channel. Two a side make
  the 40 fingers of a face
provenance:
  size: datasheet - "smooth plastic fingers at 1U increments" on the AR7580A data sheet. 40 fingers a side is 1778
    / 44.45, and the installation sheet's figure (page 1, two lengths stacked) shows a column of that order; the
    count is derived from the height, not counted exactly off the figure. The finger is 31 high and 20 across, ESTIMATED,
    as the figure is not dimensioned.
  relief: estimated - the arm stands 112 off the back plate and the hooked tip reaches 138; the data sheet gives
    160 deep overall (a well of 140 and a back plate zone of 20, see nsx-vcm-750-base). No view sections a finger.
  color: 'datasheet - "Color: Black". The shade is this library''s render of black plastic, the tips a shade lighter.'
