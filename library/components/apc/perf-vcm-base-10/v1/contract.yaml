class: mechanical
description: >-
  The back plate of the 10 in wide APC Performance vertical cable manager (AR8635 and AR8645) seen
  from the working face, the full width and the full 2134 mm height of the part - drawn as the well
  the finger columns stand in, its floor the plate a cable lies against
provenance:
  size: >-
    datasheet - the AR8635 and AR8645 product data sheets: height 84.02 in (2134 mm), width 10.0 in
    (253 mm, as printed; 10 in is 254.0). The plate runs the whole of both, as the instruction
    sheet's figure (990-4576A-001, page 1) draws it.
  depth: >-
    estimated - 300, as perf-vcm-base-6: the data sheets' 14.2 in (360 mm) single-sided and 26.0 in
    (660 mm) double-sided give a well of 300 and a back plate zone of 60, a derivation and not a
    reading.
  color: >-
    datasheet - "Color: Black" on the data sheet. The shade is this library's render of black
    powder-coated steel.
size: {w: 253, h: 2134, d: 300}
size-confidence: {w: datasheet, h: datasheet, d: estimated}
