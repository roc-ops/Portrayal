format: 1
kind: component
name: perf-vcm-finger-section
version: 1.0.0
class: mechanical
description: >-
  One section of fingers of an APC Performance vertical cable manager (AR8615 to AR8675) seen
  end-on from the working face - eleven smooth plastic fingers one rack unit apart down one side of
  the channel, each an arm standing off the back plate with a hooked tip, and a gap between each pair
  that a patch cord is laid in through. Four a side make the 44 fingers of a face
provenance:
  size: >-
    datasheet - every data sheet of the six: "smooth plastic fingers at 1U increments", and the
    brochure (Enclosure and Rack Systems, Cable Management): "smooth radius fingers at 1U
    increments". The pitch is the 44.45 mm [1.75 in] rack unit. 44 fingers a side is COUNTED, not
    stated: the instruction sheet's figure (990-4576A-001, page 1) of the single-sided manager
    printed at 600 dpi has 44 fingers in a column at a constant pitch (35 px), the 44 units of the
    AR203A and one short of the AR201's 45 (the figure does not say which rack it stands against).
    A section is 11, so a side is four. The finger is 31 mm high and 22 mm across end-on, ESTIMATED
    from the figure: its tongue is about 70 per cent of the pitch and the rest the gap, and the figure
    is not dimensioned.
  relief: >-
    estimated - the fingers stand off the back plate toward the face. 296 mm is taken: the data sheets
    give 360 mm overall for one channel, the well is 300 (see perf-vcm-base-6) and the door closes
    over the tips, so the tips stop 4 mm short of the face. The arm is 12 mm across and rises to 266;
    the tip, 22 mm across, is the hook at its end from 262 to 296, the "smooth radius" of the
    brochure; no view sections a finger, so the split between arm and tip is a stand-in.
  color: >-
    datasheet - "Color: Black" on the data sheet. The shade is this library's render of black plastic,
    the tips a shade lighter than the arms so the hook reads.
