<svg xmlns="http://www.w3.org/2000/svg" width="281.5mm" height="19.55mm" viewBox="0 0 281.5 19.55">
  <!-- The GL-x 12-port BNC card faceplate: a black plate the full slot, the twelve
       jacks and their lamps composed as parts. Only the plate, the thumbscrews and the
       printed legends are drawn here. -->
  <rect id="plate" x="0.1" y="0.1" width="281.3" height="19.35" rx="0.3" fill="#141619" stroke="#3a3e43" stroke-width="0.2"/>
  <!-- THE WHOLE SCREW IS ONE NODE, so the cylinder relief builds carries the head and
       its cross on its top cap (the dell/thumbscrew-blue-14g lesson). -->
  <!-- two small flush screws that fix the plate to its bracket, dark in the product render -->
  <circle cx="11.8" cy="8.05" r="2.2" fill="#1f2226" stroke="#3a3e43" stroke-width="0.2"/>
  <circle cx="269.7" cy="8.05" r="2.2" fill="#1f2226" stroke="#3a3e43" stroke-width="0.2"/>
  <g id="thumbscrew-left">
    <circle cx="3.99" cy="9.59" r="3.9" fill="#b9bec3" stroke="#7d8388" stroke-width="0.25" stroke-dasharray="0.35 0.25"/>
    <circle cx="3.99" cy="9.59" r="3.1" fill="#cfd3d7"/>
    <rect x="2.29" y="9.19" width="3.4" height="0.8" fill="#26292d"/>
    <rect x="3.59" y="7.89" width="0.8" height="3.4" fill="#26292d"/>
  </g>
  <g id="thumbscrew-right">
    <circle cx="277.49" cy="9.59" r="3.9" fill="#b9bec3" stroke="#7d8388" stroke-width="0.25" stroke-dasharray="0.35 0.25"/>
    <circle cx="277.49" cy="9.59" r="3.1" fill="#cfd3d7"/>
    <rect x="275.79" y="9.19" width="3.4" height="0.8" fill="#26292d"/>
    <rect x="277.09" y="7.89" width="0.8" height="3.4" fill="#26292d"/>
  </g>
  <g id="silkscreen" font-family="Helvetica, Arial, sans-serif" fill="#e9ecef">
    <text x="24.27" y="16.95" font-size="3.2" text-anchor="middle">RL1</text>
    <text x="44.97" y="16.95" font-size="3.2" text-anchor="middle">RL2</text>
    <text x="65.67" y="16.95" font-size="3.2" text-anchor="middle">RL3</text>
    <text x="86.37" y="16.95" font-size="3.2" text-anchor="middle">RL4</text>
    <text x="107.07" y="16.95" font-size="3.2" text-anchor="middle">RL5</text>
    <text x="127.77" y="16.95" font-size="3.2" text-anchor="middle">RL6</text>
    <text x="148.47" y="16.95" font-size="3.2" text-anchor="middle">RL7</text>
    <text x="169.17" y="16.95" font-size="3.2" text-anchor="middle">RL8</text>
    <text x="189.87" y="16.95" font-size="3.2" text-anchor="middle">RL9</text>
    <text x="210.57" y="16.95" font-size="3.2" text-anchor="middle">RL10</text>
    <text x="231.27" y="16.95" font-size="3.2" text-anchor="middle">RL11</text>
    <text x="251.97" y="16.95" font-size="3.2" text-anchor="middle">RL12</text>
  </g>
</svg>
