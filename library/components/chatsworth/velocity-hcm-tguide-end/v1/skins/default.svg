<svg xmlns="http://www.w3.org/2000/svg" width="90.0mm" height="15.5mm" viewBox="0 0 90.0 15.5">
  <!-- one finger end-on from the front, one pitch wide: the root, the body and the wider head in front, the head with a lit rim and the slot beside it in shade -->
  <rect id="root" x="0" y="0" width="90.0" height="15.5" fill="#17181a" data-fill-from="finish"/>
  <rect id="stem" x="0.0" y="0" width="72.0" height="15.5" fill="#1b1c1e" data-fill-from="finish"/>
  <rect id="tip" x="0.0" y="0" width="84.0" height="15.5" fill="#1f2022" data-fill-from="finish"/>
  <rect id="slot-shade" x="84.0" y="0" width="6.0" height="15.5" fill="#000" fill-opacity="0.5"/>
  <rect id="head-lit" x="0.0" y="0" width="84.0" height="15.5" fill="#fff" fill-opacity="0.1"/>
  <rect id="head-rim" x="0.5" y="0.5" width="83.0" height="14.5" rx="1" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="0.8"/>
</svg>
