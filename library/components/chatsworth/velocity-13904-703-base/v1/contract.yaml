format: 1
kind: component
name: velocity-13904-703-base
version: 1.0.0
class: mechanical
description: >-
  The back plate of the Chatsworth Velocity 13904-703 single-sided vertical cable manager seen
  from the front - the 7 ft manager's whole length as one floor, the joint between its two
  sections a seam, drawn as the well the two finger walls stand in
provenance:
  size: >-
    datasheet - the ordering table (page 3) prints 13904-703 as 80.5 x 10 x 10.3 in (2045 x 254
    x 262 mm), for 7'H (2.1 m), 45U racks. The well is 212 deep from the front of the door (262)
    to the floor, which is 50 from the rear: the table's note gives 9.5 in (241 mm) without
    doors and 7.5 in (191 mm) usable, and 241 less 191 is the 50 behind the floor.
  seam: >-
    estimated - the guide (page 2) says the manager is an upper and a lower section, equal for
    the 6 ft and 8 ft managers and a short upper over a long lower for the 7 ft one. No held
    page gives the lengths; the seam is drawn at the middle of the height.
size: {w: 254, h: 2045, d: 212}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
attrs: {material: Steel}
elements:
  floor: {at: [0, 0], size: [254, 2045], class: bezel}
relief: {wall: '#232527'}
skins: [default]
