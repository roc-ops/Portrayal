format: 1
kind: component
name: velocity-13911-715-front-door
version: 1.0.0
class: mechanical
behaviour: mounts
lid: true
description: >-
  One half-height door of the front channel of the Chatsworth Velocity 13911-715 double-sided
  vertical cable manager seen from the front - a plain plastic cover the full width of the
  manager, with a hinge rail over each finger wall, that snaps onto the T-shaped cable guides,
  swings open to the right or left and lifts off
provenance:
  size: >-
    datasheet - the data sheet (page 1) lists four half-height covers that snap onto the
    T-shaped cable guides for the double-sided manager, two on each face, and the cover on the
    3.6 in manager is plastic (page 2). Each is 91 wide, the manager's, and half of its 2311.
    For the 7 ft manager the guide says the upper section is short and the lower long, and no
    page gives the lengths, so the half is ESTIMATED there.
  relief: >-
    estimated - the plate stands 3 thick at the outside of the 196.5 well, its rails 2.5 deep
    over the 191 the guides reach from the floor. No held page gives the section of the door or
    its bevel; the rails take the whole of the 5.5 the door stands past the guides, which is
    half the table's 417 less the 406 if the two doors are equal.
  lid: >-
    datasheet - 'The doors can be hinged open for cable access' and 'mount each door by
    positioning over the hinges and pressing firmly until it snaps in place' (installation
    instructions of the single-sided part, page 5); 'swing open to the right or left' (data
    sheet, page 2). It is a lid. The format has no hinge, so which side it swings from is a gap.
  logo-zone: >-
    not reserved - the data sheet's photographs show a plain face.
size: {w: 91, h: 1155.5}
