format: 1
kind: component
name: velocity-13911-703-front-base
version: 1.0.0
class: mechanical
description: >-
  The back plate of the front channel of the Chatsworth Velocity 13911-703 double-sided vertical
  cable manager seen from the front - the 7 ft manager's whole length as one floor, the joint
  between its two sections a seam, drawn as the well the two finger walls stand in
provenance:
  size: >-
    datasheet - the ordering table (page 3) prints 13911-703 as 80.5 x 3.6 x 16.4 in (2045 x 91
    x 417 mm), for 7'H (2.1 m), 45U racks. The well is 196.5 deep from the outside of the front
    door to its floor: the table's note gives 16 in (406 mm) without doors and 191 mm usable at
    the front, and the door stands 5.5 past the ends of the guides. That 5.5 is ESTIMATED: it is
    the table's 417 less the 406, halved on the assumption that the two doors are equal. The
    usable depth is taken to run from the floor to the ends of the guides, which the note does
    not say.
  spine: >-
    estimated - the two floors stand 75 apart, the 406 less the 191 and the 140 usable; the data
    sheet (page 1) lists four steel mid panels with attachment points and no held page draws or
    dimensions one, so the rear channel and the panel between are not part of this plate.
  seam: >-
    estimated - the guide (page 2) says the manager is an upper and a lower section, equal for
    the 6 ft and 8 ft managers and a short upper over a long lower for the 7 ft one. No held
    page gives the lengths; the seam is drawn at the middle of the height.
size: {w: 91, h: 2045, d: 196.5}
size-confidence: {w: datasheet, h: datasheet, d: estimated}
attrs: {material: Steel}
elements:
  floor: {at: [0, 0], size: [91, 2045], class: bezel}
relief: {wall: '#232527'}
skins: [default]
