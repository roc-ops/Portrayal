<svg xmlns="http://www.w3.org/2000/svg" width="482.6mm" height="133.35mm" viewBox="0 0 482.6 133.35">
  <!-- the back plate from the front, ears included: the brush's window is a hole in the
       path, so the floor of the well is open where the brush is -->
  <path id="floor" fill="#232527" fill-rule="evenodd" data-fill-from="finish" d="M0.00,0.00 H482.60 V133.35 H0.00 Z M286.30,33.52 H436.30 V99.82 H286.30 Z"/>
  <!-- the light on the steel, over the plate and not over the opening, so the plate reads as a
       plate against the black fingers in front of it -->
  <path id="floor-lit" fill="#fff" fill-opacity="0.12" fill-rule="evenodd" d="M0.00,0.00 H482.60 V133.35 H0.00 Z M286.30,33.52 H436.30 V99.82 H286.30 Z"/>
</svg>
