format: 1
kind: component
name: evolution-hcm-base-brush-4u
version: 1.0.1
class: mechanical
description: >-
  The back plate of the 4U Chatsworth Evolution horizontal cable manager with brushes
  (33548-X04) seen from the front, the full 19 in EIA width with its ears, with the window the
  brush fills - drawn as the well the two rows of fingers stand in, its floor the front face
  of the plate
fields:
  finish:
    label: Finish
    type: text
    default: '#232527'
provenance:
  shading: >-
    estimated - a stand-in for the light a render would give: a 12% white layer over the plate,
    not over its openings, so the plate reads as a plate against the black fingers in front of
    it. It is a semi-transparent layer over the finish, so it holds for Glacier White too; no
    document gives the plate's shade.
  size: >-
    datasheet - the Evolution Cable Management System data sheet (page 3, Evolution Horizontal
    Cable Managers table) gives 4U x 19" EIA x 8.2" (208 mm), chassis style with brushes, for
    33548-X04. The plate is the whole 482.6 with its ears (a rack-face part is its ears and
    what hangs off them) and 177.8 high, four units at the EIA-310 1.75 in. The well is 206
    deep, 2 mm short of the 208 overall, where the plate stands.
  size-holes: >-
    estimated - the window the brush fills is 150.0 wide and 93.0 high (0.6 of the 155.0
    between the finger plates), centred on the height, its right end 30 mm in from the end of
    the 450.0 between the ears, as seen from the front. The 2U part's picture (data sheet page
    3, "Brushes shown") is the only one of a brush insert; its width and the 0.6 ratio are
    held here. No picture or table shows the 4U part's brush.
size: {w: 482.6, h: 177.8, d: 206.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
relief: {wall: '#232527'}
