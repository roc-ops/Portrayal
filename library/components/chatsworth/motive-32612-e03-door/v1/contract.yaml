description: >-
  The front door of the Chatsworth Motive 32612-E03 single-sided vertical cable manager, seen from
  the front. It is one full-height glacier white cover the width of the manager. It is dual-hinged,
  opens to the right or to the left and lifts off.
provenance:
  size: >-
    estimated - the data sheet (page 1) lists one 'dual-hinged front door assembly (pre-installed)';
    the installation instructions (page 3) draw it as one plate the height of the manager. It is
    drawn the manager's nominal width, 10 in (250 mm), and its nominal 7 ft height, 2133.6 mm, both
    sizes to order by from the matrix (page 3), not printed overall dimensions.
  relief: >-
    estimated - the plate stands 3 thick at the front of the 392 overall depth the matrix note (page
    3) prints, the frame behind it ending at 389. No held page gives the section of the door or its
    bevel.
  lid: >-
    datasheet - 'Dual-hinged door opens to the right or left and offers push-to-close convenience'
    (data sheet, page 1) and 'Left Hinging', 'Right Hinging' and 'To Remove Door' (installation
    instructions, page 3). It is a lid. The format has no hinge, so which side it swings from is a
    gap.
  logo-zone: >-
    estimated - the installation instructions (page 3) say the front door has the logo at the top. The data sheet's page 1
    photograph of the right-hand manager shows a plate down the door's upper part. A white block at the plate's top carries the
    maker's mark. The plate is drawn (`door-plate`). The block's place is reserved and paints nothing, because a vendor mark is
    not reproduced. No page prints the width of a pictured manager, so the part is read as 10 in wide, which is inferred. The
    door is 86.8 px wide and 761 px high. Taking the nominal 7 ft over 761 px gives 2.804 mm per px. The door is then 243 mm
    wide, 2.6 percent under 250 mm. The same height to width ratio also fits 8 in at 6 ft and 12 in at 9 ft. The plate is
    39 px wide, 109 mm, and 264 px high, 740 mm, from 0.178 of the door's height. Across the door each figure is its fraction
    of the pictured door applied to 250 mm. The plate is 112.3 wide from 68.5 and 738 high from 378. The reserved block is 204
    high at its top. The black render (page 3) puts the plate's top at 0.16 of the door and its height at 0.35, which agrees.
    The plate's shade is the photograph's on a white part, a gradient from light at the top to dark at the bottom. On a black
    part it is the render's flat grey, lighter than the door. The corners are rounded as each picture shows, both radii
    estimated. The white plate's bottom corners have a radius of 6: the photograph's bottom edge is cut in by 2 px, 5.6 mm. The
    black plate's top corners have a radius of 20: the render's top edge falls 9 rows across the plate.
  seams: >-
    estimated - the page 1 photograph of the right-hand manager shows two vertical seams that divide the door into three
    panels. They are at 0.234 and 0.729 of the door's width: luminance dips at x 390 and 433 of the door's 369.7 to 456.5. The
    right seam is read from the picture and not mirrored from the left. On 250 mm they sit at 58.5 and 182.3, each drawn 1 wide.
  door-geometry: >-
    The plate and seams are drawn on this width only because the three pictures do not agree in millimetres at any listed width.
  latches: >-
    estimated - the installation instructions (page 3) say the door has two blue latches on its back. They draw them on the
    rear door seen from inside: a housing at each side edge and a handle, about 0.473 down the door. The figure is not to
    scale along the door, so only that fraction and the proportions are read. The housing measures 75 by 355 px at 1200 dpi,
    4.7 to 1, and the handle is about 2.5 to 1. The sizes are stand-ins: the rear housing is 17 by 80 and the handle 17 by 45. The side housing is 15 by 70.5, the same proportion.
    The rear housing's width is the 20 mm side assembly less 3. The device draws them on its rear, left and right faces, where the back of
    the door is seen. The black render on page 3 shows one dot, at the right edge, about 0.44 down the door, and none at the
    left edge. Each handle's tip is drawn 2 wide at its edge of the front. The left tip is built as the right tip, as no
    picture shows it.
  hook: >-
    not drawn - the data sheet (page 1) lists a hook on the inside of the front door, for a test meter.
    No held picture shows it.
