format: 1
kind: component
name: evolution-hcm-base-grommet-2u
version: 1.0.1
class: mechanical
description: >-
  The back plate of the 2U Chatsworth Evolution horizontal cable manager with grommets
  (33549-X02) seen from the front, the full 19 in EIA width with its ears, with the three round
  openings the grommets fill - drawn as the well the two rows of fingers stand in, its floor
  the front face of the plate
fields:
  finish:
    label: Finish
    type: text
    default: '#232527'
provenance:
  shading: >-
    estimated - a stand-in for the light a render would give: a 12% white layer over the plate,
    not over its openings, so the plate reads as a plate against the black fingers in front of
    it. It is a semi-transparent layer over the finish, so it holds for Glacier White too; no
    document gives the plate's shade.
  size: >-
    datasheet - the Evolution Cable Management System data sheet (page 3, Evolution Horizontal
    Cable Managers table) gives 2U x 19" EIA x 8.2" (208 mm), chassis style with grommets, for
    33549-X02, and the product page for 33549-702 gives 3.5 in (89 mm) high, 19 in (483 mm)
    wide. The plate is the whole 482.6 with its ears (a rack-face part is its ears and what
    hangs off them) and 88.9 high. The well is 206 deep, 2 mm short of the 208 overall, where
    the plate stands.
  size-holes: >-
    estimated - three round openings in a row, 35.6 across, 51.2 apart centre to centre,
    centred on the height, the last one's centre 52.3 in from the end of the 450.0 between the
    ears, as seen from the front. Read off the data sheet's "Grommets shown" picture, which
    shows a plate of three round grommets beside the part and at the one end of its back plate,
    and is a perspective render of a 3U part: the grommet is taken as 0.5 of the part's height
    outside, 44.5, and its opening as 0.8 of that. No document dimensions a grommet.
size: {w: 482.6, h: 88.9, d: 206.0}
