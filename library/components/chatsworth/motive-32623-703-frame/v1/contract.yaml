format: 1
kind: component
name: motive-32623-703-frame
version: 1.0.0
class: mechanical
description: >-
  The frame of one face of the Chatsworth Motive 32623-703 double-sided vertical cable manager, seen
  from that face. It has two side assemblies that carry the T-shaped guides and, between them, the
  central track, 2133.6 mm long, in black powder coat. The front and the rear are the same, so the
  one part is placed on both.
provenance:
  size: >-
    estimated - the only size a held page prints is the overall depth of the double-sided manager,
    600 mm (data sheet, page 3), which is not a size of the frame. Every size of the frame is
    ESTIMATED. The width (300 mm) and the height (2133.6 mm, 7 ft, 84 in) are the matrix's nominal
    sizes (12 in and 7'), taken as the overall size. The depth of the frame (198 from the centre
    section) is a third of the printed 600 less its doors, read from the thirds of the top view on
    installation instructions page 2, which is not to a stated scale. The side assembly width (20)
    and the track width (30) are read by eye; no held page dimensions a section of the frame.
  track: >-
    estimated - the data sheet (page 1) says the frame is an extruded aluminum profile with an
    integral central track, and the installation instructions (page 2) show the section of the
    double-sided manager equal about its centre. Its width and how far it stands are not dimensioned
    by any held page, so it is drawn the full depth of the channel.
  color: >-
    estimated - the matrix (page 3) gives the colour as Black and the specifications (page 1) as
    'Black or Glacier White powder coat paint'; the shade drawn is read from the data sheet's
    renders, which are not a colour value.
size: {w: 300, h: 2133.6, d: 198}
