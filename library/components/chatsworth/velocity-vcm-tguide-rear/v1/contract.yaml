format: 1
kind: component
name: velocity-vcm-tguide-rear
version: 1.0.0
class: mechanical
behaviour: mounts
description: >-
  One T-shaped cable guide (finger) of the rear channel of a Chatsworth Velocity double-sided
  vertical cable manager, seen from the rear - a moulded plastic arm that stands out from its
  wall with a wider head at its end, one rack unit from the next
provenance:
  size: >-
    datasheet - the cell is one rack unit, 44.45: the data sheet (page 1) says the T-shaped
    cable guides (fingers) are 'spaced 1U apart'. Its width is the wall's 16.5, half of the 33
    mm the ordering table's note takes off the overall width to give the usable width, on the
    assumption that the two walls are equal and are all of it. The arm (14) and the head (32)
    are ESTIMATED: no held page dimensions a guide; the installation drawing of the single-sided
    part (page 2) shows a slender arm and a head about twice as long, read by eye and never
    measured, and taken to be the same at the rear.
  relief: >-
    estimated - the guide ends where the rear usable depth does, 140 above the floor (the
    table's note: 5.5 in, 140 mm, at the rear), the arm to 131 and the head the last 9. The note
    does not say that the usable depth runs from the floor to the ends of the guides, and no
    held page draws the rear channel.
size: {w: 16.5, h: 44.45}
size-confidence: {w: estimated, h: datasheet}
attrs: {material: Plastic}
elements:
  head: {at: [0, 6.23], size: [16.5, 32], class: bezel}
  arm: {at: [0, 15.23], size: [16.5, 14], class: bezel}
relief:
  features:
    - node: arm
      out: 131
      color: '#26282a'
      confidence: estimated
      source: the single-sided installation instructions' page 2 drawing shows the arm from the back plate to the head; its length is the rear usable depth less the head, read by eye
    - node: head
      lift: 131
      out: 140
      color: '#2a2c2e'
      confidence: estimated
      source: the single-sided installation instructions' page 2 drawing shows the T head at the end of each guide; no page dimensions it
skins: [default]
