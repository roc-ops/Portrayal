<svg xmlns="http://www.w3.org/2000/svg" width="450.0mm" height="44.45mm" viewBox="0 0 450.0 44.45">
  <!-- the cover from the front: a plain plate with a lit upper edge and a shaded lower edge, and
       the edges of the two returns that snap onto the finger ends -->
  <rect id="plate" x="0" y="0" width="450.0" height="44.45" rx="0.8" fill="#1b1c1e" data-fill-from="finish"/>
  <rect id="lit" x="0" y="1.5" width="450.0" height="3" fill="#fff" fill-opacity="0.1"/>
  <rect id="shade" x="0" y="39.95" width="450.0" height="3" fill="#000" fill-opacity="0.3"/>
  <rect id="lip-top" x="0" y="0" width="450.0" height="1.5" fill="#26282a" data-fill-from="finish"/>
  <rect id="lip-bottom" x="0" y="42.95" width="450.0" height="1.5" fill="#121315" data-fill-from="finish"/>
</svg>
