format: 1
kind: component
name: velocity-hcm-door-1u
version: 1.0.0
class: mechanical
behaviour: mounts
lid: true
description: >-
  The snap-on cover of the 1U Chatsworth Velocity horizontal cable manager (13930-701), seen from
  the front - a plastic plate that closes the manager, whose returns snap onto the ends of the
  T-shaped cable guides, and that stays in the open position when it is swung out
fields:
  finish:
    label: Finish
    type: text
    default: '#1b1c1e'
provenance:
  size: >-
    estimated - the cover closes the front between the ears: 450.0 wide, the 482.6 (19 in EIA) of
    the data sheet's table less an estimated 16.3 of ear each end, and 44.45 high, the 1U of that
    table. The page-3 photograph shows the cover as one plate along the manager's lower front;
    nothing dimensions its width or height.
  relief: >-
    estimated - the cover stands at the front of the 150 mm overall depth: a plate 2.0 thick (148
    to 150) with returns 6.0 deep along its top and bottom edges, 1.5 thick, that clip onto the
    finger heads. No held page gives the cover's section.
  lid: >-
    datasheet - the Velocity Cable Management product data sheet (page 1 and the closing paragraph
    of page 2): the horizontal manager includes "One cover that snaps onto the T-shaped cable
    guides", and "the snap-on cover stays in the opened position to provide easy access to
    cables". It snaps on and off, so it is a lid (`lid: true`).
  finish: >-
    estimated - "Color is Black" (the table's note) and "black plastic" (the finish row); the
    default is the near-black the other Velocity parts use. The photograph is a grey render.
  mark: >-
    not drawn - a vendor mark is never drawn, and nothing is reserved for it.
size: {w: 450.0, h: 44.45}
