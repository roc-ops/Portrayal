version: 1.1.0
class: mechanical
behaviour: mounts
lid: true
description: >-
  The front door of the Chatsworth Motive 32623-E03 double-sided vertical cable manager, seen from the
  front. It is one full-height glacier white cover the width of the manager. It is dual-hinged, opens to the
  right or to the left and lifts off. The rear door is its own part.
provenance:
  size: >-
    estimated - the data sheet (page 1) lists a dual-hinged front door and a rear door assembly,
    pre-installed. The door is drawn the manager's nominal width, 12 in (300 mm), and its nominal 7 ft
    height, 2133.6 mm. Both are sizes to order by from the matrix (page 3), not printed overall dimensions.
    Its thickness is in the relief entry.
  relief: >-
    estimated - the plate stands 3 thick at the end of the channel, which ends 198 from the centre section.
    No held page gives the section of the door or its bevel.
  lid: >-
    datasheet - 'Dual-hinged door opens to the right or left and offers push-to-close convenience' (data
    sheet, page 1). The installation instructions (page 3) say 'Left Hinging', 'Right Hinging' and 'To
    Remove Door'. It is a lid. The format has no hinge, so which side it swings from is a gap.
  logo-zone: >-
    estimated - the installation instructions (page 3) say the front door has the logo at the top. The data
    sheet's page 1 photograph of the left-hand manager shows a plate down the door's upper part. A block at
    the plate's top carries the maker's mark and two lines of print. The plate is drawn (`door-plate`). The
    block's place is reserved and paints nothing, because a vendor mark is not reproduced. No page captions
    the photograph or prints a width. The door is 112 px wide at row 450 and 813 px high, a ratio of 0.138.
    At 7 ft a 12 in door is 0.141, a 10 in door 0.117 and a 15 in door 0.178. The same ratio also fits 10 in
    at 6 ft and 15 in at 9 ft. The part is read as 12 in wide at 7 ft, the height of these ten parts, which
    is inferred. Along the door the scale is the nominal 7 ft, 2133.6 mm, over rows 72 to 885, so 2.624 mm
    per px. Across the door it is 300 mm over the door's 112 px, so 2.679 mm per px. The plate is rows 170
    to 380 and columns 205 to 230. That is 257 mm down, 551 mm high, 134 mm from the door's left edge and 67
    mm wide. The block is rows 170 to 199, so 76 mm high. Each figure is read to 1 px, which is 2.7 mm
    across and 2.6 mm along. The white plate's bottom corners have a radius of 6, as the photograph's plate
    shows, an estimate. The built plate is a gradient from #e8e2de (232,226,222) to #4d4f52 (77,79,82) on a white part and a
    flat #5d5d5d on a black part. My samples of the photograph's plate are means over 10 rows at column
    217. They are (174,181,193) at row 205, (160,160,159) at row 280 and (117,114,112) at row 360. They
    replace the earlier samples (171,179,192) at row 205 and (110,108,105) at row 355, which differ by 1 to 9
    levels. The photograph's plate falls from about 183 in luminance at row 205 to about 114 at row 360. The
    white build runs about 227 to 79 and the black build is flat at 93. The render's plate is (97,104,105)
    over 550 px at rows 225 to 275 and columns 29 to 40, luminance 102. The build has a different tone and
    more contrast than the photograph. Both parts keep the single-sided doors' plate shades. The maintainer
    has left marks, colours and the rest to a later touch.
  seams: >-
    estimated - the photograph shows two vertical seams that divide the door into three panels. At row 450
    the seams are at columns 201 and 231. The door spans columns 155 to 267, so they stand 123 mm and 203.5
    mm from its left edge. Each is drawn 1 wide, centred on its figure, and the tolerance is 3 mm. The right
    seam is read from the picture and not mirrored from the left. The built plate's right edge stands 2.5 mm from
    the right seam's centre, within that tolerance. The photograph reads 2.8 mm at row 280. The built plate's
    left edge stands 11 mm from the left seam's centre. The seams lean with the photograph's perspective. The
    left seam reads at column 202 at row 280, 200.7 at row 450 and 200.2 at row 700. The door's left edge reads
    156.6, 154.6 and 152.6 at the same rows. The build draws one vertical seam at the mid-height reading, row
    450, because the drawing has no perspective. The plate's left edge, column 205, is read at row 280. It
    stands 3 px, about 8 mm, from the seam read at row 280. It stands 4 px, 11 mm, from the seam read at row
    450. The 11 mm mixes two rows, and the 8 mm is at the plate's own rows. The right seam is a light
    ridge at columns 231 to 233, with a step down at column 234. The build takes column 231, 203.5 mm.
    The step is at about 212 mm, so the seam may stand about 8 mm further right than drawn.
  door-geometry: >-
    The plate and the seams are drawn on this width because the photograph reads as 12 in. The three pictures
    do not agree on the plate's width. The photograph's plate is 25 px, 67 mm, at the door's 2.679 mm per px.
    The render's plate is 18.5 px at rows 240 to 270, 81 mm over its door's 68.7 px at 300 mm. The render's
    flat grey alone is 14 px, 61 mm. The installation drawing's plate strip is 30.5 px of a 167.5 px door
    face, 55 mm at row 750 on a 300 mm face. These are not the same width. The render resolves one seam and
    puts it and the plate 20 to 35 mm further left. The installation drawing carries no scale.
  latches: >-
    estimated - the installation instructions (page 3) say the door has two blue latches on its back. The
    page 1 photograph shows a blue speck at the door's left edge. It is 3 x 6 px, at columns 152 to 154 and
    rows 482 to 487, on the native 603 x 953 photograph. At 2.624 mm per px along the door that is about 8
    x 16 mm, centred 1083 mm down. The page 3 render shows two blue handles. One is at the dark door's
    right edge. It is 5 x 7 px, at columns 75 to 79 and rows 331 to 337, on the native 225 x 627 render.
    That edge runs rows 131 to 610, so at 4.445 mm per px the handle is centred 902 mm down. The other is
    at the far edge. It is 10 x 13 px, at columns 190 to 199 and rows 257 to 269. The far post runs rows 48
    to 548, so at 4.267 mm per px it is centred 917 mm down. The page 3 figure is drawn from inside the
    door. At 300 dpi it puts the latch housing at rows 1199 to 1285, on a door at rows 529 to 2075. At
    1.380 mm per px that housing is centred 984 mm down. The readings do not agree. The build draws every
    tip and handle centred 1009.5 mm down, on a door 2133.6 mm high. That height lies inside the spread of
    the readings, 902 to 1083 mm, and is kept from the earlier reading of the page 3 figure. Each tip is
    drawn 2 wide at its edge of the front, on both edges. The photograph shows only the left edge and the
    render only the right. Each unseen edge is built as the edge shown. The speck is about 8 mm wide and
    sits 1 to 2 px outside the door's edge. The 2 mm width and the 45 mm height are stand-ins, because no
    picture gives them. On the device's side faces only the end of each handle shows, because the housing
    stands behind the arms.
  hook: >-
    not drawn - the data sheet (page 1) lists a hook on the inside of the front door, for a test meter. No
    held picture shows it.
