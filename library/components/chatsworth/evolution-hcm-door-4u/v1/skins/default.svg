<svg xmlns="http://www.w3.org/2000/svg" width="450mm" height="177.8mm" viewBox="0 0 450 177.8">
  <!-- the door from the front: the contoured face (a bevel falling away toward each return),
       the aluminium strip along its middle in a shaded groove with a lit upper edge, and the
       edges of the two returns that snap onto the finger ends. The lit and shaded bands are
       semi-transparent over the finish, so the door reads in black and in Glacier White -->
  <rect id="plate" x="0" y="0" width="450" height="177.8" rx="0.8" fill="#1b1c1e" data-fill-from="finish"/>
  <rect id="bevel-top" x="0" y="1.5" width="450" height="7" fill="#fff" fill-opacity="0.1"/>
  <rect id="bevel-top-edge" x="0" y="8.5" width="450" height="0.6" fill="#fff" fill-opacity="0.22"/>
  <rect id="bevel-bottom" x="0" y="169.3" width="450" height="7" fill="#000" fill-opacity="0.3"/>
  <rect id="bevel-bottom-edge" x="0" y="169.3" width="450" height="0.6" fill="#000" fill-opacity="0.35"/>
  <rect id="groove" x="0" y="84.4" width="450" height="9" fill="#000" fill-opacity="0.4"/>
  <rect id="strip" x="0" y="85.9" width="450" height="6" fill="#98a1a9"/>
  <rect id="strip-lit" x="0" y="85.9" width="450" height="1" fill="#fff" fill-opacity="0.6"/>
  <rect id="strip-shade" x="0" y="90.9" width="450" height="1" fill="#000" fill-opacity="0.3"/>
  <rect id="lip-top" x="0" y="0" width="450" height="1.5" fill="#26282a" data-fill-from="finish"/>
  <rect id="lip-bottom" x="0" y="176.3" width="450" height="1.5" fill="#121315" data-fill-from="finish"/>
</svg>
