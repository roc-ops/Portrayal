format: 1
kind: component
name: motive-32624-703-door
version: 1.0.0
class: mechanical
behaviour: mounts
lid: true
description: >-
  One door of the Chatsworth Motive 32624-703 double-sided vertical cable manager, seen from
  outside. It is one full-height black cover the width of the manager. It is dual-hinged, opens to
  the right or to the left and lifts off. The front and the rear door are drawn as the same plain
  plate, so the one part is placed on both.
provenance:
  size: >-
    estimated - no held page prints a size of the door. The data sheet (page 1) lists a dual-hinged
    front door and rear door assembly, pre-installed, and the installation instructions (page 3)
    draw the rear door as one plate the height of the manager, without a dimension. The plate is
    taken as the manager's width, 15 in (380 mm), and height, 2133.6 mm (7 ft), the matrix's nominal
    sizes (page 3), which are themselves estimated as overall sizes. Its thickness is in the relief
    entry.
  relief: >-
    estimated - the plate stands 3 thick at the end of the channel, which ends 198 from the centre
    section. No held page gives the section of the door or its bevel.
  lid: >-
    datasheet - 'Dual-hinged door opens to the right or left and offers push-to-close convenience'
    (data sheet, page 1) and 'Left Hinging', 'Right Hinging' and 'To Remove Door' (installation
    instructions, page 3). It is a lid. The format has no hinge, so which side it swings from is a
    gap.
  logo-zone: >-
    not reserved - the installation instructions (page 3) say the front door has the logo at the top
    and the rear door is a plain flat door; no held page gives the logo's size or position. The
    front door is drawn without it.
size: {w: 380, h: 2133.6}
size-confidence: {w: estimated, h: estimated}
elements:
  plate: {at: [0, 0], size: [380, 2133.6], class: bezel}
relief:
  features:
    - node: plate
      lift: 198
      out: 201
      color: '#2f3134'
      confidence: estimated
      source: no held page gives the door section; a thin moulding in the data sheet's photographs
skins: [default]
