format: 1
kind: component
name: motive-32624-703-door
version: 1.1.0
class: mechanical
behaviour: mounts
lid: true
description: >-
  The front door of the Chatsworth Motive 32624-703 double-sided vertical cable manager, seen from the
  front. It is one full-height black cover the width of the manager. It is dual-hinged, opens to the right
  or to the left and lifts off. The rear door is its own part.
provenance:
  size: >-
    estimated - the data sheet (page 1) lists a dual-hinged front door and a rear door assembly,
    pre-installed. The door is drawn the manager's nominal width, 15 in (380 mm), and its nominal 7 ft
    height, 2133.6 mm. Both are sizes to order by from the matrix (page 3), not printed overall dimensions.
    Its thickness is in the relief entry.
  relief: >-
    estimated - the plate stands 3 thick at the end of the channel, which ends 198 from the centre section.
    No held page gives the section of the door or its bevel.
  lid: >-
    datasheet - 'Dual-hinged door opens to the right or left and offers push-to-close convenience' (data
    sheet, page 1). The installation instructions (page 3) say 'Left Hinging', 'Right Hinging' and 'To
    Remove Door'. It is a lid. The format has no hinge, so which side it swings from is a gap.
  logo-zone: >-
    not reserved - the installation instructions (page 3) say the front door has the logo at the top. No
    held picture reads this width, so its place is not drawn.
  seams: >-
    not drawn - the photograph that shows the seams reads as 12 in, and no held picture reads this width.
  door-geometry: >-
    The plate and the seams are not drawn on this width. The photograph that shows them reads as 12 in, and
    no held picture reads this width.
  latches: >-
    estimated - the installation instructions (page 3) say the door has two blue latches on its back. The
    page 1 photograph shows a blue speck at the door's left edge. It is 3 x 6 px, at columns 152 to 154 and
    rows 482 to 487, on the native 603 x 953 photograph. At 2.624 mm per px along the door that is about 8
    x 16 mm, centred 1083 mm down. The page 3 render shows a blue handle at its right edge. It is 10 x 13
    px, at columns 190 to 199 and rows 257 to 269, on the native 225 x 627 render. The render's right edge
    runs rows 48 to 548, so at 4.267 mm per px the handle is centred 917 mm down. The page 3 figure is
    drawn from inside the door. At 300 dpi it puts the latch housing at rows 1199 to 1285, on a door at rows
    529 to 2075. At 1.380 mm per px that housing is centred 984 mm down. The three readings do not agree.
    The build draws every tip and handle centred 1009.5 mm down, which is 0.473 of the door's 2133.6 mm.
    That height lies inside the spread of the readings and is kept from the earlier reading of the page 3
    figure. Each tip is drawn 2 wide at its edge of the front, on both edges. Its 45 mm height is a
    stand-in handle height, because no picture gives it. On the device's side faces only the end of each
    handle shows, because the housing stands behind the arms.
  hook: >-
    not drawn - the data sheet (page 1) lists a hook on the inside of the front door, for a test meter. No
    held picture shows it.
