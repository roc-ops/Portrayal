<svg xmlns="http://www.w3.org/2000/svg" width="45mm" height="11.4mm" viewBox="0 0 45 11.4">
  <!-- the end finger of a row from the front, drawn for the left end: the frame edge on the
       outer side, the finger, and the wider head in front. The head has a lit rim and the
       slot beside it is in shade, as on the other fingers -->
  <rect id="root" x="0" y="0" width="45" height="11.4" fill="#17181a" data-fill-from="finish"/>
  <rect id="stem" x="0" y="0" width="33" height="11.4" fill="#1b1c1e" data-fill-from="finish"/>
  <rect id="tip" x="0" y="0" width="41" height="11.4" fill="#1f2022" data-fill-from="finish"/>
  <rect id="slot-shade" x="41" y="0" width="4" height="11.4" fill="#000" fill-opacity="0.5"/>
  <rect id="head-lit" x="0" y="0" width="41" height="11.4" fill="#fff" fill-opacity="0.1"/>
  <rect id="head-rim" x="0.5" y="0.5" width="40" height="10.4" rx="1" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="0.8"/>
</svg>
