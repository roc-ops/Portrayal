format: 1
kind: component
name: evolution-hcm-base-ports-2u
version: 1.0.1
class: mechanical
description: >-
  The back plate of the 2U Chatsworth Evolution horizontal cable manager with cable
  pass-through ports (35441-X02) seen from the front, the full 19 in EIA width with its
  ears, with the two oval ports - drawn as the well the two rows of fingers stand in, its
  floor the front face of the plate
fields:
  finish:
    label: Finish
    type: text
    default: '#232527'
provenance:
  shading: >-
    estimated - a stand-in for the light a render would give: a 12% white layer over the plate,
    not over its openings, so the plate reads as a plate against the black fingers in front of
    it. It is a semi-transparent layer over the finish, so it holds for Glacier White too; no
    document gives the plate's shade.
  size: >-
    datasheet - the Evolution Cable Management System data sheet (page 3, Evolution Horizontal
    Cable Managers table) gives 2U x 19" EIA x 8.2" (208 mm) for 35441-X02, and the product
    page for 35441-702 gives 3.5 in (89 mm) high and 19 in (483 mm) wide. The plate is the
    whole 482.6 with its ears (a rack-face part is its ears and what hangs off them) and 88.9
    high. The well is 206 deep, 2 mm short of the 208 overall, where the plate stands.
  size-holes: >-
    estimated - the two ports are oval, 80 wide and 40 high, centred on the height and with
    their centres at 0.24 and 0.76 of the 450.0 between the ears. Read off the one picture of
    the ports (data sheet page 3, "Cable Pass-Through Ports shown", a 2U part, two ovals seen
    through the finger slots in the back plate), by the distance of each from the ends
    against the part's width. Nothing dimensions a port; no picture shows the 3U or 4U
    parts' ports.
  thickness: >-
    estimated - not stated; see the device's `thickness`.
size: {w: 482.6, h: 88.9, d: 206.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
relief: {wall: '#232527'}
elements:
  floor: {at: [0.0, 0.0], size: [482.6, 88.9], class: bezel}
skins: [default]
