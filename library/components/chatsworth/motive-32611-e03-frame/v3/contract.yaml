format: 1
kind: component
name: motive-32611-e03-frame
version: 3.0.0
class: mechanical
description: >-
  The frame of the Chatsworth Motive 32611-E03 single-sided vertical cable manager, seen from the
  front. It has two side assemblies, each drawn as a thin plate the T-shaped guides stand on, and,
  between them, the central track, in glacier white powder coat. It is drawn 2133.6 mm long, the
  nominal 7 ft.
provenance:
  size: >-
    estimated - the matrix (page 3) gives the width as 8 in (200 mm) and the height as 7' (2.1 m) as
    sizes to order by, not as overall dimensions: the figures are taken as the overall size, and the
    height is 7 ft, 84 in. The side assembly width (20), the track width (30) and the depth of the
    track (389, the printed 392 less the door) are also ESTIMATED: no held page dimensions a section
    of the frame.
  plate: >-
    estimated - the data sheet (page 1) says the left and right side assemblies carry the T-shaped
    cable guides, and the installation instructions (page 2) draw the guides standing out of the
    centre section; no held page dimensions the section of a side assembly. Each is drawn as a plate
    under its guides, the full length of the manager and the width of a guide (20), 1.5 thick (the
    wall gauge the device estimates for comparable sheet parts), and not as a solid the depth of the
    channel, which filled the space the guides stand in. The plate is drawn 0.05 inside the width of
    the guides and stands 0.05 off the floor of the well, so that no face of it lies on a plane of a
    guide (two faces on one plane shimmer in 3D); neither of those two figures is a measurement.
  track: >-
    estimated - the data sheet (page 1) says the frame is an extruded aluminum profile with an
    integral central track, and the installation instructions (page 2) show it down the middle of
    the manager. Its width and how far it stands from the rear are not dimensioned by any held page,
    so it is drawn the full depth behind the door.
  color: >-
    estimated - the matrix (page 3) gives the colour as Glacier White and the specifications (page
    1) as 'Black or Glacier White powder coat paint'; the shade drawn is chosen, and is not a colour
    value from any held page.
