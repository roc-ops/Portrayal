name: velocity-13902-703-door
version: 1.0.0
class: mechanical
behaviour: mounts
lid: true
description: >-
  One half-height door of the Chatsworth Velocity 13902-703 vertical cable manager seen from the
  front - a plain plastic cover the full width of the manager, with a hinge rail over each
  finger wall, that snaps onto the T-shaped cable guides, swings open to the right or left and
  lifts off
provenance:
  size: >-
    datasheet - the data sheet (page 1) lists 'two half-height covers that snap onto the
    T-shaped cable guides', and the 6 in cover is plastic (page 2). Each is 152 wide, the
    manager's, and half of its 2045. For the 7 ft manager the guide says the upper section is
    short and the lower long, and no page gives the lengths, so the half is ESTIMATED there.
  relief: >-
    estimated - the plate stands 3 thick at the front of the 249 overall (the table's depth with
    the bevel of the door), its rails 5 deep over the 241 the guides reach without doors. No
    held page gives the section of the door or its bevel.
  lid: >-
    datasheet - 'The doors can be hinged open for cable access' and 'mount each door by
    positioning over the hinges and pressing firmly until it snaps in place' (installation
    instructions, page 5); 'swing open to the right or left' (data sheet, page 2). It is a lid.
    The format has no hinge, so which side it swings from is a gap.
  logo-zone: >-
    not reserved - the data sheet's photographs show a plain face.
size: {w: 152, h: 1022.5}
