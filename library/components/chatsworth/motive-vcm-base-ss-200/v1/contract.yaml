format: 1
kind: component
name: motive-vcm-base-ss-200
version: 1.0.0
class: mechanical
description: >-
  This is the well of a Chatsworth Motive single-sided vertical cable manager, 8 in (200 mm) wide,
  seen from the front. The frame, the guides and the door stand in it. It is the nominal length and the
  printed depth, 392 mm, from the outer face of the door to the open rear. It draws no back plate,
  because the rear is open.
provenance:
  size: >-
    estimated - the width (200 mm) and the length (2133.6 mm, 7 ft) are the matrix's nominal sizes (data
    sheet, page 3), taken as the overall size. The depth is the data sheet's: the matrix note (page 3)
    prints 'Overall depth for Single-Sided manager is 15.5"D (392 mm)'.
  rear: >-
    datasheet - the data sheet (page 6) sells a Rear Panel Kit that 'encloses the rear of the Motive
    Single-Sided Vertical Cable Manager', so none is fitted: the well has no floor drawn.
size: {w: 200, h: 2133.6, d: 392}
size-confidence: {w: estimated, h: estimated, d: datasheet}
