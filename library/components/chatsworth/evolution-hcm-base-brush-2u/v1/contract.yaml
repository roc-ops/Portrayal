format: 1
kind: component
name: evolution-hcm-base-brush-2u
version: 1.0.1
class: mechanical
description: >-
  The back plate of the 2U Chatsworth Evolution horizontal cable manager with brushes
  (33548-X02) seen from the front, the full 19 in EIA width with its ears, with the window the
  brush fills - drawn as the well the two rows of fingers stand in, its floor the front face
  of the plate
fields:
  finish:
    label: Finish
    type: text
    default: '#232527'
provenance:
  shading: >-
    estimated - a stand-in for the light a render would give: a 12% white layer over the plate,
    not over its openings, so the plate reads as a plate against the black fingers in front of
    it. It is a semi-transparent layer over the finish, so it holds for Glacier White too; no
    document gives the plate's shade.
  size: >-
    datasheet - the Evolution Cable Management System data sheet (page 3, Evolution Horizontal
    Cable Managers table) gives 2U x 19" EIA x 8.2" (208 mm), chassis style with brushes, for
    33548-X02, and the product page for 33548-702 gives 3.5 in (89 mm) high, 19 in (483 mm)
    wide. The plate is the whole 482.6 with its ears (a rack-face part is its ears and what
    hangs off them) and 88.9 high. The well is 206 deep, 2 mm short of the 208 overall, where
    the plate stands.
  size-holes: >-
    estimated - the window the brush fills is 150.0 wide and 39.7 high (0.6 of the 66.1
    between the finger plates), centred on the height, its right end 30 mm in from the end of
    the 450.0 between the ears, as seen from the front. Read off the data sheet's "Brushes
    shown" picture, which shows a brush insert at the one end of the back plate beside the
    part, and is a perspective render: the insert is about a third of the part's width. No
    document dimensions it.
size: {w: 482.6, h: 88.9, d: 206.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
relief: {wall: '#232527'}
elements:
  floor: {at: [0.0, 0.0], size: [482.6, 88.9], class: bezel}
skins: [default]
