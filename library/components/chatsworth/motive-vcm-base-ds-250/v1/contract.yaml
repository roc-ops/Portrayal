format: 1
kind: component
name: motive-vcm-base-ds-250
version: 1.0.0
class: mechanical
description: >-
  This is the well of one face of a Chatsworth Motive double-sided vertical cable manager, 10 in (250 mm)
  wide, seen from that face. The frame, the guides and the door of the face stand in it. It is the
  nominal length and the depth of one face, 201 mm, from the outer face of its door to the central
  section. It draws no back plate, because the rear of each face is open. The front and the rear are
  the same, so the one part is placed on both.
provenance:
  size: >-
    estimated - the width (250 mm) and the length (2133.6 mm, 7 ft) are the matrix's nominal sizes (data
    sheet, page 3), taken as the overall size. The depth of one face, 201, is the door (3) and the
    channel (198) of the top view, read from the thirds of the top view on installation instructions
    page 2, which is not to a stated scale; the printed overall depth, 600 mm (data sheet, page 3), is
    that twice and the central section of 198 between.
  rear: >-
    estimated - the faces of the manager are open behind their guides, on the central track, so the
    well has no floor drawn.
