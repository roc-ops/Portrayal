format: 1
kind: component
name: velocity-13901-701-base
version: 1.0.0
class: mechanical
description: >-
  The back plate of the Chatsworth Velocity 13901-701 single-sided vertical cable manager seen
  from the front - the 6 ft manager's whole length as one floor, the joint between its two
  sections a seam, drawn as the well the two finger walls stand in
provenance:
  size: >-
    datasheet - the ordering table (page 3) prints 13901-701 as 70 x 3.6 x 9.7 in (1778 x 91 x
    246 mm), for 6'H (1.8 m), 38U racks. The well is 196 deep from the front of the door (246)
    to the floor, which is 50 from the rear: the table's note gives 9.5 in (241 mm) without
    doors and 7.5 in (191 mm) usable, and 241 less 191 is the 50 behind the floor.
  seam: >-
    estimated - the guide (page 2) says the manager is an upper and a lower section, equal for
    the 6 ft and 8 ft managers and a short upper over a long lower for the 7 ft one. No held
    page gives the lengths; the seam is drawn at the middle of the height.
size: {w: 91, h: 1778, d: 196}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
attrs: {material: Steel}
elements:
  floor: {at: [0, 0], size: [91, 1778], class: bezel}
relief: {wall: '#232527'}
skins: [default]
