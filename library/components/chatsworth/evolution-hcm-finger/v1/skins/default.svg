<svg xmlns="http://www.w3.org/2000/svg" width="45mm" height="11.4mm" viewBox="0 0 45 11.4">
  <!-- one finger end-on from the front, one pitch wide: the root across half a slot either
       side, the stem, and the wider head in front. The head is drawn with a lit rim and the
       slot either side of it in shade, so a black finger reads against a black plate -->
  <rect id="root" x="0" y="0" width="45" height="11.4" fill="#17181a" data-fill-from="finish"/>
  <rect id="stem" x="12" y="0" width="21" height="11.4" fill="#1b1c1e" data-fill-from="finish"/>
  <rect id="tip" x="4" y="0" width="37" height="11.4" fill="#1f2022" data-fill-from="finish"/>
  <rect id="slot-shade-left" x="0" y="0" width="4" height="11.4" fill="#000" fill-opacity="0.5"/>
  <rect id="slot-shade-right" x="41" y="0" width="4" height="11.4" fill="#000" fill-opacity="0.5"/>
  <rect id="head-lit" x="4" y="0" width="37" height="11.4" fill="#fff" fill-opacity="0.1"/>
  <rect id="head-rim" x="4.5" y="0.5" width="36" height="10.4" rx="1" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="0.8"/>
</svg>
