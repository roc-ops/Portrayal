name: velocity-13912-701-front-door
version: 1.0.0
class: mechanical
behaviour: mounts
lid: true
description: >-
  One half-height door of the front channel of the Chatsworth Velocity 13912-701 double-sided
  vertical cable manager seen from the front - a plain plastic cover the full width of the
  manager, with a hinge rail over each finger wall, that snaps onto the T-shaped cable guides,
  swings open to the right or left and releases when pulled from a corner
provenance:
  size: >-
    datasheet - the data sheet (page 1) lists four half-height covers that snap onto the
    T-shaped cable guides for the double-sided manager, two on each face, and the cover on the 6
    in manager is plastic (page 2). Each is 152 wide, the manager's, and half of its 1778. For
    the 7 ft manager the guide says the upper section is short and the lower long, and no page
    gives the lengths, so the half is ESTIMATED there.
  relief: >-
    estimated - the plate stands 3 thick at the outside of the 199 well, its rails 5 deep over
    the 191 the guides reach from the floor. No held page gives the section of the door or its
    bevel; the rails take the whole of the 8 the door stands past the guides, which is half the
    table's 422 less the 406 if the two doors are equal.
  lid: >-
    datasheet - 'The doors can be hinged open for cable access' and 'pressing firmly until it
    snaps in place' (installation instructions of the single-sided part, page 5); 'swing open to
    the right or left' (data sheet, page 2). It is a lid. The format has no hinge, so which side
    it swings from is a gap.
  logo-zone: >-
    not reserved - the data sheet's photographs show a plain face.
