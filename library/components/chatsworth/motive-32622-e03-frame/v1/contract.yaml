format: 1
kind: component
name: motive-32622-e03-frame
version: 1.0.0
class: mechanical
description: >-
  The frame of one face of the Chatsworth Motive 32622-E03 double-sided vertical cable manager, seen
  from that face. It has two side assemblies that carry the T-shaped guides and, between them, the
  central track, 2133.6 mm long, in glacier white powder coat. The front and the rear are the same,
  so the one part is placed on both.
provenance:
  size: >-
    datasheet - the matrix (page 3) gives the width as 10 in (250 mm) and the height as 7' (2.1 m),
    nominal sizes: the figures are taken as the overall size, and the height is 7 ft, 84 in. The
    side assembly width (20), the track width (30) and the depth of the frame (198 from the centre
    section, a third of the printed 600 less its doors) are ESTIMATED: no held page dimensions a
    section of the frame.
  track: >-
    estimated - the data sheet (page 1) says the frame is an extruded aluminum profile with an
    integral central track, and the installation instructions (page 2) show the section of the
    double-sided manager equal about its centre. Its width and how far it stands are not dimensioned
    by any held page, so it is drawn the full depth of the channel.
  color: >-
    estimated - the matrix (page 3) gives the colour as Glacier White and the specifications (page
    1) as 'Black or Glacier White powder coat paint'; the shade drawn is read from the data sheet's
    renders, which are not a colour value.
size: {w: 250, h: 2133.6, d: 198}
