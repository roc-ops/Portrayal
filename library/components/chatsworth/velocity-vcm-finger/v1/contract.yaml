format: 1
kind: component
name: velocity-vcm-finger
version: 1.0.0
class: mechanical
behaviour: mounts
description: >-
  One T-shaped cable guide (finger) of the Chatsworth Velocity 6 in single-sided vertical cable
  manager, seen from the front - a moulded plastic arm that stands forward from its wall with a
  wider head at its end, one rack unit from the next
provenance:
  size: >-
    datasheet - the cell is one rack unit, 44.45: the data sheet (page 1) says the T-shaped
    cable guides (fingers) are 'spaced 1U apart'. Its width is the wall's 16.5, half of the 33
    mm the ordering table's note takes off the 152 overall to give the usable width, on the
    assumption that the two walls are equal and are all of it. The arm (14) and the head (32)
    are ESTIMATED: no held page dimensions a guide; the installation drawing (page 2) shows a
    slender arm and a head about twice as long, read by eye and never measured.
  relief: >-
    estimated - the arm rises from the floor of the well and the head closes its end, ending at
    the 241 the data sheet gives without doors (182 and 191 above the floor, which is 50 from
    the rear). The split between arm and head is the drawing's, by eye.
size: {w: 16.5, h: 44.45}
size-confidence: {w: estimated, h: datasheet}
attrs: {material: Plastic}
elements:
  head: {at: [0, 6.23], size: [16.5, 32], class: bezel}
  arm: {at: [0, 15.23], size: [16.5, 14], class: bezel}
relief:
  features:
    - node: arm
      out: 182
      color: '#26282a'
      confidence: estimated
      source: the installation instructions' page 2 drawing shows the arm from the back plate to the head; its length is the 241 overall without doors less the head, read by eye
    - node: head
      lift: 182
      out: 191
      color: '#2a2c2e'
      confidence: estimated
      source: the installation instructions' page 2 drawing shows the T head at the end of each guide; no page dimensions it
skins: [default]
