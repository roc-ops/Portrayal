format: 1
kind: component
name: motive-32623-703-rear-door
version: 1.0.0
class: mechanical
behaviour: mounts
lid: true
description: >-
  The rear door of the Chatsworth Motive 32623-703 double-sided vertical cable manager, seen from the rear.
  It is one full-height black plain flat cover the width of the manager. It is dual-hinged, opens to the
  right or to the left and lifts off. The front door is its own part.
provenance:
  size: >-
    estimated - the data sheet (page 1) lists a dual-hinged front door and a rear door assembly,
    pre-installed. The door is drawn the manager's nominal width, 12 in (300 mm), and its nominal 7 ft
    height, 2133.6 mm. Both are sizes to order by from the matrix (page 3), not printed overall dimensions.
    Its thickness is in the relief entry.
  relief: >-
    estimated - the plate stands 3 thick at the end of the channel, which ends 198 from the centre section.
    No held page gives the section of the door or its bevel.
  lid: >-
    datasheet - 'Dual-hinged door opens to the right or left and offers push-to-close convenience' (data
    sheet, page 1). The installation instructions (page 3) say 'Left Hinging', 'Right Hinging' and 'To
    Remove Door'. It is a lid. The format has no hinge, so which side it swings from is a gap.
  logo-zone: >-
    not reserved - the installation instructions (page 3) say that for double sided managers the rear door
    is a plain flat door, with no logo.
  seams: >-
    not drawn - the installation instructions (page 3) call the rear door plain and flat. No held picture
    shows its outside.
  latches: >-
    estimated - the installation instructions (page 3) draw this door from inside. A housing and a handle
    sit at each side edge, centred 1009.5 mm down the door, and the handles point downward. The page 3
    figure's housing is centred 984 mm down. That is rows 1199 to 1285 of a door at rows 529 to 2075, at
    1.380 mm per px. Only the tip at each edge shows from the rear, and it is drawn 2 wide and 45 high. The
    45 mm is a stand-in handle height, because no picture gives it. On the device's side faces only the end
    of each handle shows, because the housing stands behind the arms.
  hook: >-
    not drawn - no held picture shows a hook on the rear door.
  door-back: >-
    not drawn - the installation instructions (page 3) label one figure 'Rear Door' and draw it from inside.
    It shows a central rib, two cross bars and four hinge tabs, one at each corner. The figure carries no
    scale, so no size is read. They are on the door's back, and a following change draws them. The device's
    `door-hinge-tabs` gap records them.
