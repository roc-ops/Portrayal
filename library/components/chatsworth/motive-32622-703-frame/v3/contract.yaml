format: 1
kind: component
name: motive-32622-703-frame
version: 3.0.0
class: mechanical
description: >-
  The frame of one face of the Chatsworth Motive 32622-703 double-sided vertical cable manager, seen
  from that face. It has two side assemblies, each drawn as a thin plate the T-shaped guides stand
  on, and, between them, the central track, 2133.6 mm long, in black powder coat. The front and the
  rear are the same, so the one part is placed on both.
provenance:
  size: >-
    estimated - the only size a held page prints is the overall depth of the double-sided manager,
    600 mm (data sheet, page 3), which is not a size of the frame. Every size of the frame is
    ESTIMATED. The width (250 mm) and the height (2133.6 mm, 7 ft, 84 in) are the matrix's nominal
    sizes (10 in and 7'), taken as the overall size. The depth of the track (198 from the centre
    section) is a third of the printed 600 less its doors, read from the thirds of the top view on
    installation instructions page 2, which is not to a stated scale. The side assembly width (20)
    and the track width (30) are read by eye; no held page dimensions a section of the frame.
  plate: >-
    estimated - the data sheet (page 1) says the left and right side assemblies carry the T-shaped
    cable guides, and the installation instructions (page 2) draw the guides standing out of the
    centre section; no held page dimensions the section of a side assembly. Each is drawn as a plate
    under its guides, the full length of the manager and the width of a guide (20), 1.5 thick (the
    wall gauge the device estimates for comparable sheet parts), and not as a solid the depth of the
    channel, which filled the space the guides stand in. The plate is drawn 0.05 inside the width of
    the guides and stands 0.05 off the floor of the well, so that no face of it lies on a plane of a
    guide (two faces on one plane shimmer in 3D); neither of those two figures is a measurement.
  track: >-
    estimated - the data sheet (page 1) says the frame is an extruded aluminum profile with an
    integral central track, and the installation instructions (page 2) show the section of the
    double-sided manager equal about its centre. Its width and how far it stands are not dimensioned
    by any held page, so it is drawn the full depth of the channel.
  color: >-
    estimated - the matrix (page 3) gives the colour as Black and the specifications (page 1) as
    'Black or Glacier White powder coat paint'; the shade drawn is read from the data sheet's
    renders, which are not a colour value.
