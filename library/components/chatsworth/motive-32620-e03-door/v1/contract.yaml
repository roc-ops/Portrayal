format: 1
kind: component
name: motive-32620-e03-door
version: 1.0.0
class: mechanical
behaviour: mounts
lid: true
description: >-
  One door of the Chatsworth Motive 32620-E03 double-sided vertical cable manager, seen from
  outside. It is one full-height glacier white cover the width of the manager. It is dual-hinged,
  opens to the right or to the left and lifts off. The front and the rear door are drawn as the same
  plain plate, so the one part is placed on both.
provenance:
  size: >-
    datasheet - the data sheet (page 1) lists a dual-hinged front door and rear door assembly,
    pre-installed; the installation instructions (page 3) draw the rear door as one plate the height
    of the manager. It is the manager's width, 6 in (150 mm) nominal, and its 2133.6 mm height, 7 ft
    nominal, both from the matrix (page 3).
  relief: >-
    estimated - the plate stands 3 thick at the end of the channel, which ends 198 from the centre
    section. No held page gives the section of the door or its bevel.
  lid: >-
    datasheet - 'Dual-hinged door opens to the right or left and offers push-to-close convenience'
    (data sheet, page 1) and 'Left Hinging', 'Right Hinging' and 'To Remove Door' (installation
    instructions, page 3). It is a lid. The format has no hinge, so which side it swings from is a
    gap.
  logo-zone: >-
    not reserved - the installation instructions (page 3) say the front door has the logo at the top
    and the rear door is a plain flat door; no held page gives the logo's size or position. The
    front door is drawn without it.
size: {w: 150, h: 2133.6}
