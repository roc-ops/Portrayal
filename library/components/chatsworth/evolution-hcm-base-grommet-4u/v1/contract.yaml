format: 1
kind: component
name: evolution-hcm-base-grommet-4u
version: 1.0.1
class: mechanical
description: >-
  The back plate of the 4U Chatsworth Evolution horizontal cable manager with grommets
  (33549-X04) seen from the front, the full 19 in EIA width with its ears, with the three round
  openings the grommets fill - drawn as the well the two rows of fingers stand in, its floor
  the front face of the plate
fields:
  finish:
    label: Finish
    type: text
    default: '#232527'
provenance:
  shading: >-
    estimated - a stand-in for the light a render would give: a 12% white layer over the plate,
    not over its openings, so the plate reads as a plate against the black fingers in front of
    it. It is a semi-transparent layer over the finish, so it holds for Glacier White too; no
    document gives the plate's shade.
  size: >-
    datasheet - the Evolution Cable Management System data sheet (page 3, Evolution Horizontal
    Cable Managers table) gives 4U x 19" EIA x 8.2" (208 mm), chassis style with grommets, for
    33549-X04. The plate is the whole 482.6 with its ears (a rack-face part is its ears and
    what hangs off them) and 177.8 high, four units at the EIA-310 1.75 in. The well is 206
    deep, 2 mm short of the 208 overall, where the plate stands.
  size-holes: >-
    estimated - three round openings in a row, 71.1 across, 102.2 apart centre to centre,
    centred on the height, the last one's centre 74.5 in from the end of the 450.0 between the
    ears, as seen from the front. Read off the data sheet's "Grommets shown" picture, a
    perspective render of a 3U part with a plate of three round grommets beside it and at the
    one end of its back plate: the grommet is taken as 0.5 of the part's height outside, 88.9,
    and its opening as 0.8 of that. No picture or table shows the 4U part's grommets.
size: {w: 482.6, h: 177.8, d: 206.0}
