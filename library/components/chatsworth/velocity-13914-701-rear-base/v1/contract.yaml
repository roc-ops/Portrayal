format: 1
kind: component
name: velocity-13914-701-rear-base
version: 1.0.0
class: mechanical
description: >-
  The back plate of the rear channel of the Chatsworth Velocity 13914-701 double-sided vertical
  cable manager seen from the rear - the 6 ft manager's whole length as one floor, the joint
  between its two sections a seam, drawn as the well the two finger walls stand in
provenance:
  size: >-
    datasheet - the ordering table (page 3) prints 13914-701 as 70 x 10 x 17.5 in (1778 x 254 x
    445 mm), for 6'H (1.8 m), 38U racks. The well is 159.5 deep from the outside of the rear
    door to its floor: the table's note gives 16 in (406 mm) without doors and 140 mm usable at
    the rear, and the door stands 19.5 past the ends of the guides. That 19.5 is ESTIMATED: it
    is the table's 445 less the 406, halved on the assumption that the two doors are equal. The
    usable depth is taken to run from the floor to the ends of the guides, which the note does
    not say.
  spine: >-
    estimated - the two floors stand 75 apart, the 406 less the 191 and the 140 usable; the data
    sheet (page 1) lists four steel mid panels with attachment points and no held page draws or
    dimensions one, so the front channel and the panel between are not part of this plate.
  seam: >-
    estimated - the guide (page 2) says the manager is an upper and a lower section, equal for
    the 6 ft and 8 ft managers and a short upper over a long lower for the 7 ft one. No held
    page gives the lengths; the seam is drawn at the middle of the height.
size: {w: 254, h: 1778, d: 159.5}
size-confidence: {w: datasheet, h: datasheet, d: estimated}
attrs: {material: Steel}
elements:
  floor: {at: [0, 0], size: [254, 1778], class: bezel}
relief: {wall: '#232527'}
skins: [default]
