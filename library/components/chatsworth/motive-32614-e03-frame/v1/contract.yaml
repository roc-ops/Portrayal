name: motive-32614-e03-frame
version: 1.0.0
class: mechanical
description: >-
  The frame of the Chatsworth Motive 32614-E03 single-sided vertical cable manager, seen from the
  front. It has two side assemblies that carry the T-shaped guides and, between them, the central
  track, in glacier white powder coat. It is drawn 2133.6 mm long, the nominal 7 ft.
provenance:
  size: >-
    estimated - the matrix (page 3) gives the width as 15 in (380 mm) and the height as 7' (2.1 m)
    as sizes to order by, not as overall dimensions: the figures are taken as the overall size, and
    the height is 7 ft, 84 in. The side assembly width (20), the track width (30) and the depth of
    the frame (389, the printed 392 less the door) are also ESTIMATED: no held page dimensions a
    section of the frame.
  track: >-
    estimated - the data sheet (page 1) says the frame is an extruded aluminum profile with an
    integral central track, and the installation instructions (page 2) show it down the middle of
    the manager. Its width and how far it stands from the rear are not dimensioned by any held page,
    so it is drawn the full depth of the frame.
  color: >-
    estimated - the matrix (page 3) gives the colour as Glacier White and the specifications (page
    1) as 'Black or Glacier White powder coat paint'; the shade drawn is chosen, and is not a colour
    value from any held page.
