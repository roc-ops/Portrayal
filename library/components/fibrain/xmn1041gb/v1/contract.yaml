body:
  depth: 37.0
  # A BODY IN PIECES, because a holder seated in a drawer's slot is a module
  # inside a module, and the 3D build gives such a part only the boxes it
  # declares: the moulding, held just inside its own face so it shares no
  # surface with the drawer or the shell, and the back half of each adapter
  # standing out of it, which is what the panel shows from behind. Each piece
  # `shows: [rear]`, so its back carries the patch of the rear face it covers:
  # the SC opening on an adapter, the moulding between them.
  boxes:
    - {id: moulding, at: [0.5, 0.7], size: [99.0, 19.6], from: 1.0, depth: 30.0, color: '#17191b', shows: [rear],
       confidence: estimated, source: 'the moulding of the 100 x 21 x 37 holder of DSH_XMx rev 1.1, drawn 0.5 to 0.7 inside its face on each side; the 37 is taken as the overall depth with the adapters, and the moulding as 6 short of it, by eye off the renders'}
    - {id: sc01-back, at: [4.225, 1.400], size: [12.2, 8.8], from: 31.0, depth: 6.0, color: '#1c9dbe', shows: [rear],
       confidence: estimated, source: 'the adapter body standing out of the back of the holder, as the vendor renders show it; 6 is read by eye'}
