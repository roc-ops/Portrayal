provenance:
  size: >-
    datasheet - DSH_XMx_EN rev 1.1 (03.06.2024), technical specification: height
    21, width 100, depth 37 mm, plastic. One holder fills one HD slot.
  parts: >-
    ESTIMATED, MEASURED OFF ONE RENDER. No drawing of the holder is published
    and every image of it is a three-quarter render. The columns come from the
    one image with the camera on the centre line, the vendor's front render of
    the 1U extendable panel XHU00 (XHU00_6.jpg, 4000 px), scaled on its 482.6
    rack face at 7.94 px/mm: across all four holders the green adapter bodies
    stand on a constant 15.87 pitch and read 12.6 to 13.35 wide, and the group
    of six is centred between the red release latches either side (offsets
    7.99, 7.37, 6.68 and 5.66 from the latch on its left, drifting with the
    perspective of parts that stand proud; the mean, 6.93, is the centred
    value 6.96). So six cells on 15.87, the first 3.925 from the holder's edge.
    The rows are fractions of the 21 height on the same image, whose vertical
    scale is foreshortened to 0.85 of the horizontal: the two rows of one
    holder abut and span 19.9 on the render, a little over two 9.4 bodies
    because the camera sits above and sees their top faces; they are drawn
    abutting, 18.8, centred on the 21. The adapter is
    common/sc-simplex-adapter@1 turned a quarter turn, landing 12.8 x 9.4.
  orientation: >-
    photo - the 12-port holder's render (XM-Uchwyt-adapterow_2.jpg) and the
    XHU00 front render both show the upper row's key slot cut through the top
    wall and the lower row's through the bottom wall, the two rows mounted
    belly to belly. The 6-port render (XM-Uchwyt-adapterow_3.jpg) shows one
    row in the lower position with the key up.
  numbering: >-
    ASSUMED. Fibrain prints nothing on the holder; port numbers go on a separate
    label field (XL00), whose 12-port insert is two rows of six blank cells.
    Ids run left to right, the upper row first, which is how the vendor's
    render of numbered labels on the hybrid panel counts its RJ45 ports.
  optical: >-
    EVERY PATH IS ONE MATING SLEEVE, NOT A STRAND. A holder carries adapters and
    no glass: a fibre entering a front adapter leaves through the same adapter
    at the back, so front `scNN.1` reaches rear `bNN.1`. The rear face
    composes each adapter at the mirrored column.
  colour: >-
    ESTIMATED, NOT SEEN. No held image shows a Fibrain SC PC adapter. Blue is the
    colour the vendor's LC PC single-mode holders are rendered in (#1c9dbe,
    the median of 380,610 blue pixels on XM-Uchwyt-adapterow_5.jpg) and the
    usual colour of a single-mode PC adapter; it is carried over, not read.
  catalogue: >-
    datasheet - ordering information lists XMN1041GB as 'FO Holder 12x SC,
    SM'. The 14.12.2023 issue of the same sheet named the fibre as G.657A1 and
    the product page says OS2 G.652D; the current sheet says only SM.
