<svg xmlns="http://www.w3.org/2000/svg" width="14.6mm" height="18.4mm" viewBox="0 0 14.6 18.4">
  <!-- Fibrain XR210 - HD RJ45 connection module, Cat.6A, screened, with keystone
       adapter. The face of the XR200 elevation (frame 14.60 x 16.10, label plate,
       two round marks, latch tab under the frame) with the die-cast shell as bright
       metal above the frame and as a thin shield rim round its edge, and, from the
       XR210 photograph, what the adapter adds: a clear latch over the top of the
       shell and a clear collar inside the shield rim; the tab under the frame is
       clear. The sheet dimensions neither the adapter nor the rim, so the latch
       width (the tab's 6.78), the collar inset and the rim width are stand-ins, see
       the contract. The RJ45 jack is composed by the contract. -->
  <rect id="housing-top" x="0.2" y="0" width="14.2" height="1.3" fill="#c0c1c4"/>
  <rect id="housing-tab" x="3.91" y="17.4" width="6.78" height="1.0" fill="#e4eaed" fill-opacity="0.8" stroke="#c0c1c4" stroke-width="0.15"/>
  <rect id="frame" x="0" y="1.3" width="14.6" height="16.1" rx="0.2" fill="#4cae91" stroke="#0c0d0e" stroke-width="0.1"/>
  <rect id="shield" x="0.15" y="1.45" width="14.3" height="15.8" rx="0.2" fill="none" stroke="#c0c1c4" stroke-width="0.3"/>
  <rect id="collar" x="0.6" y="1.75" width="13.4" height="14.7" rx="0.3" fill="none" stroke="#e4eaed" stroke-opacity="0.8" stroke-width="0.2"/>
  <rect id="latch" x="3.91" y="0.1" width="6.78" height="1.1" rx="0.3" fill="#e4eaed" fill-opacity="0.8" stroke="#8d939a" stroke-width="0.1"/>
  <rect id="label" x="1.65" y="1.9" width="11.3" height="4.2" rx="0.5" fill="#5fbca2"/>
  <circle id="mark-left" cx="2.0" cy="15.3" r="1.25" fill="#3f9a80"/>
  <circle id="mark-right" cx="12.6" cy="15.3" r="1.25" fill="#3f9a80"/>
</svg>
