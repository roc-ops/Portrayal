provenance:
  size: >-
    datasheet - DSH_XMx_EN rev 1.1 (03.06.2024), technical specification: height
    21, width 100, depth 37 mm, plastic. One holder fills one HD slot. THE
    100 x 21 IS THE NOMINAL ENVELOPE, kept because it is the slot: the maker's
    front elevation draws the moulding 99.70 x 20.95, in a frame opening drawn
    99.99 x 21.00, and 103.50 over the two latch tabs that reach into the
    posts.
  parts: >-
    drawing - measured on the entities of the maker's front elevation of
    this slot front, `cassette-12-LCdx.dxf` in
    the maker's CAD libraries archive (hd.fibrain.com/dxf/cad-libraries.zip, files
    dated 2020-07-30; AutoCAD 2007 DXF, units millimetres, drawn 1:1).
    Six windows 12.95 wide stand on a 16.10 pitch between ribs 3.15 wide, the
    first window 3.125 from the moulding's edge, the row centred on the
    moulding; with the moulding centred in the 100 x 21, the adapter centres
    are 9.75, 25.85, 41.95, 58.05, 74.15 and 90.25. UNTIL THIS MAJOR the
    columns stood on a 15.87 pitch read off a render of the 1U extendable
    panel XHU00.
    THE DRAWING SEATS ITS OWN ADAPTERS UP TO 0.125 OFF THOSE CENTRES: the
    first on its window centre, the second 0.125 right of its own and the
    third to sixth 0.125 left of theirs (ferrule-pair centres 9.60, 25.825,
    41.675, 57.775, 73.875, 89.975 of the moulding, successive steps 16.225,
    15.85 and 16.10). That is slack in a 12.95 window round a 12.70 body; the
    window centres are what is modelled.
    THE ADAPTER IS FIBRAIN's OWN, fibrain/lc-duplex-adapter@1, drawn from the
    same file: 12.70 x 9.30 with its ferrules 6.25 apart and 1.45 off the
    body's centre line. @1 composed common/lc-duplex-v-adapter@6, another
    maker's body turned on its side, 1.05 wider and with its ferrules 0.24
    nearer the centre line.
    ROWS: two bodies 9.30 tall with 0.25 between them, belly to belly, centred
    on the height, which puts their ferrule rows 6.65 apart, as drawn.
  moulding: >-
    drawing for the outline, windows, ribs, latch fingers and label holes
    (the same archive); photo for what a 6 has above and below its one row.
    The drawing leaves the whole 18.85 window open round the single row of a
    6; the vendor's render of the 6-port holder shows solid black moulding
    above and below the adapters, so the skin draws a window only the
    adapter's height and 0.3 over, which is estimated. The base plate the
    drawing shows 1.0 under the moulding (its layer is named for a base,
    1.00 to 102.50 across) is not drawn: the datasheet gives the holder as 21
    high and the 1U frame's slot rows stand 21.00 apart, which leaves no room
    for it under an upper holder. Which body the drawn front belongs to, the
    37 deep holder or the 169 deep cassette, the file does not say. THE LATCH
    TAB at each end, 1.90 out and 1.80 tall at mid height, is outside the 100
    envelope and is not drawn; seated, it is inside the post.
  orientation: >-
    drawing and photo - the maker's front elevation and its render of the
    12-port LC holder (XM-Uchwyt-adapterow_5.jpg) both show the upper row with
    its latch slots up and the lower row with them down, the two rows belly
    to belly, as the SC holders are; the elevation and the render of the
    6-port (_4) show one row with the slots up.
  numbering: >-
    ASSUMED. Fibrain prints nothing on the holder; port numbers go on a separate
    label field (XL00). Ids run left to right, the upper row first.
    WITHIN AN ADAPTER the two bores count left to right as well, in both
    rows. A lower-row adapter is an upper-row one turned over, so its own
    bore 1 is on the right; `optical.front-order` therefore names its
    positions `.2` then `.1`, and a 12-port holder's ports read 13, 14, 15,
    16 along its lower row. Fibrain's label field gives each bore a blank
    cell in that order and prints no numbers, so this is assumed.
  colour: >-
    photo - blue, the median of 380,610 blue pixels on the vendor's render of
    the 12-port LC single-mode holder (XM-Uchwyt-adapterow_5.jpg), #1c9dbe.
  catalogue: >-
    datasheet - ordering information lists XMN1021GB as 'FO Holder 12x LCdx,
    SM'.
    THE 12-PORT PART NUMBERS ARE THE DATASHEET's. The product page and the 2020
    HD catalogue print this row differently (a repeated number, or one ending
    in A, which is a 6-port number); the datasheet is taken as right and that
    is unconfirmed.
  optical: >-
    EVERY PATH IS ONE MATING SLEEVE, NOT A STRAND. A holder carries adapters and
    no glass: a fibre entering bore k of a front adapter leaves through the
    same bore at the back, so front `lcNN.k` reaches rear `bNN.k`. The rear
    face composes each adapter at the mirrored column and TURNED THE OTHER
    WAY, so that bore k is the same sleeve seen from behind; that puts its
    latch slot on the wrong side of the rear drawing, a stated art error,
    because a mirrored host cannot seat an occupant.
  dust-caps: >-
    DRAWN CAPPED, AND THE VENDOR's RENDERS SHOW THE PORTS OPEN. The adapter
    ships holding a duplex dust cap, as fibrain/lc-duplex-adapter@1 declares
    it, and a cap is what an unused port holds. The library ships its
    configurations bare of `occupants:` keys (docs/pluggables-design.md,
    decision 2), so no configuration here empties them; whoever populates the
    panel does. The SC holders of this family are open, because
    common/sc-simplex-adapter@1 seats no cap - an inconsistency of that part,
    not a fact about Fibrain.
  groups: >-
    Fibrain HD adapter holder data sheet XMx (revision 1.1, modified 03.06.2024), page
    2, lists XMN1021GB as 'FO Holder 12x LCdx, SM' and, on page 1, describes a holder
    'fully equipped with adapters'. The sheet does not number the adapters; the contract
    counts them left to right. No page names a role for the port; the role follows the
    job, carrying a user's link through the panel, so it is traffic. The port is passive
    and the data sheet prints no rate for it, so the group states no speed.
