<svg xmlns="http://www.w3.org/2000/svg" width="100.0mm" height="21.0mm" viewBox="0 0 100.0 21.0">
  <!-- Fibrain XMI1031GA rear - the holder from behind
       The adapters are composed by the contract; this skin is the black
       moulding as the maker's front elevation draws it: the 99.70 x 20.95
       face, six windows 12.95 wide on a 16.10 pitch, the five ribs 3.15 wide
       between them, the two end cheeks with their latch fingers and the four
       1.5 mm label holes. The latch tab that stands 1.90 out of each end is
       not drawn: it is outside the 100 envelope and inside the post when the
       holder is seated. Nothing is printed on the holder. See the contract's
       provenance. -->
  <rect id="bezel" x="0.15" y="0.025" width="99.7" height="20.95" rx="0.4"
        fill="#17191b" stroke="#0c0d0e" stroke-width="0.2"/>
