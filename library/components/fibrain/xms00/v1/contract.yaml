description: >-
  Fibrain XMS00 - HD holder for six RJ45 connection modules, screened version,
  empty. Fills one slot of a Fibrain HD patch panel; each of its six positions
  takes one connection module without an adapter, in any category.
size: {w: 100.0, h: 21.0, d: 66.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
size-notes: >-
  DSH XMS00 rev 0 (11.09.2019), dimensions: 0.5U x 100 x 66 mm. THE 100 x 21 IS
  THE NOMINAL ENVELOPE, kept because it is the slot. The maker's front
  elevation draws the moulding 99.50 x 21.00, and 103.50 over the latch tab
  that stands 2.00 out of each end.
