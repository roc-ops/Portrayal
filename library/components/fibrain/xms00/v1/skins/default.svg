<svg xmlns="http://www.w3.org/2000/svg" width="100.0mm" height="21.0mm" viewBox="0 0 100.0 21.0">
  <!-- Fibrain XMS00 - HD holder for six RJ45 connection modules, screened. The
       moulding as the maker's front elevation draws it: 99.50 x 21.00, six
       windows 14.80 x 16.60 on a 16.02 pitch between dividers 1.22 wide, the
       end slots and the four 1.5 mm holes. The latch tab 2.00 out of each end
       is outside the 100 envelope and is not drawn. The six spring plates
       along the top of the windows are the screening contacts the datasheet
       photograph shows, drawn estimated; the unscreened XMU00 has none. The
       modules are composed by the device. See the contract's provenance. -->
  <rect id="moulding" x="0.25" y="0" width="99.5" height="21" rx="0.4"
        fill="#17191b" stroke="#0c0d0e" stroke-width="0.2"/>
  <rect x="0.35" y="0.1" width="2.2" height="20.8" fill="#222528"/>
  <rect x="97.45" y="0.1" width="2.2" height="20.8" fill="#222528"/>
  <rect id="window-1" x="2.55" y="2.2" width="14.8" height="16.6" fill="#0b0c0d"/>
  <rect id="window-2" x="18.57" y="2.2" width="14.8" height="16.6" fill="#0b0c0d"/>
  <rect id="window-3" x="34.59" y="2.2" width="14.8" height="16.6" fill="#0b0c0d"/>
  <rect id="window-4" x="50.61" y="2.2" width="14.8" height="16.6" fill="#0b0c0d"/>
  <rect id="window-5" x="66.63" y="2.2" width="14.8" height="16.6" fill="#0b0c0d"/>
  <rect id="window-6" x="82.65" y="2.2" width="14.8" height="16.6" fill="#0b0c0d"/>
  <!-- the six module positions, the bays: each module's own 14.6 x 18.4, centred on its window -->
  <rect id="pos-1" x="2.65" y="1.15" width="14.6" height="18.4" fill="none"/>
  <rect id="pos-2" x="18.67" y="1.15" width="14.6" height="18.4" fill="none"/>
  <rect id="pos-3" x="34.69" y="1.15" width="14.6" height="18.4" fill="none"/>
  <rect id="pos-4" x="50.71" y="1.15" width="14.6" height="18.4" fill="none"/>
  <rect id="pos-5" x="66.73" y="1.15" width="14.6" height="18.4" fill="none"/>
  <rect id="pos-6" x="82.75" y="1.15" width="14.6" height="18.4" fill="none"/>
  <rect x="17.35" y="0.1" width="1.22" height="20.8" fill="#2a2d30"/>
  <rect x="33.37" y="0.1" width="1.22" height="20.8" fill="#2a2d30"/>
  <rect x="49.39" y="0.1" width="1.22" height="20.8" fill="#2a2d30"/>
  <rect x="65.41" y="0.1" width="1.22" height="20.8" fill="#2a2d30"/>
  <rect x="81.43" y="0.1" width="1.22" height="20.8" fill="#2a2d30"/>
  <rect id="spring-1" x="3.95" y="2.2" width="12.0" height="2.4" fill="#aab0b6"/>
  <rect id="spring-2" x="19.97" y="2.2" width="12.0" height="2.4" fill="#aab0b6"/>
  <rect id="spring-3" x="35.99" y="2.2" width="12.0" height="2.4" fill="#aab0b6"/>
  <rect id="spring-4" x="52.01" y="2.2" width="12.0" height="2.4" fill="#aab0b6"/>
  <rect id="spring-5" x="68.03" y="2.2" width="12.0" height="2.4" fill="#aab0b6"/>
  <rect id="spring-6" x="84.05" y="2.2" width="12.0" height="2.4" fill="#aab0b6"/>
  <path d="M 1.65 6.65 V 14.35 M 98.35 6.65 V 14.35" fill="none" stroke="#0c0d0e" stroke-width="0.15"/>
  <circle cx="1.65" cy="1.4" r="0.75" fill="#050506"/>
  <circle cx="1.65" cy="19.6" r="0.75" fill="#050506"/>
  <circle cx="98.35" cy="1.4" r="0.75" fill="#050506"/>
  <circle cx="98.35" cy="19.6" r="0.75" fill="#050506"/>
</svg>
