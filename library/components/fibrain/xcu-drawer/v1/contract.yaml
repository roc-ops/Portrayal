provenance:
  size: >-
    see size-notes.
  travel: >-
    estimated - the datasheet says 'full extension on telescopic rails' and
    gives no figure; the travel is taken as the drawer's own depth, itself a
    guess.
  slots: >-
    estimated - four slots, each the 100 x 21 face the XM holder datasheet
    states, between pillars 6.27 wide, centred on the height. Measured off the
    centre-line front render of the 1U sibling XHU00; see the device.
  accepts: >-
    datasheet - '48xSC SX / LC DX / E2000 (4 adapter holders)'. Every Fibrain
    holder this library models is in every slot. THE DEFAULT IS THE BLIND
    COVER, XBCS0, the part Fibrain makes for an empty HD slot; the device's
    orderable configurations seat the holders each variant ships with.
  latches: >-
    estimated - a red release latch at the top of each pillar, read 7.9 wide
    and 8.9 tall on the render, drawn inside the pillar. Part of the drawer:
    the empty holder's own render carries none.
  not-drawn: >-
    the three pull handles, which hang from the top edge in front of the
    adapters. The rails are not on this face: they are body pieces, and the
    plan draws them. See the device's gaps.
skins: [default]
