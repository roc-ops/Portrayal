format: 1
kind: module
name: xcu-drawer
version: 1.0.0
class: mechanical
behaviour: fills
profile: optical
description: >-
  The drawer of the Fibrain XCU10 extendable patch panel - the tray that
  slides out of the shell on telescopic rails, carrying the four HD adapter
  holders across its front and the splice cassettes on its floor. Captive: it
  pulls out to full extension and stays on its rails.
size: {w: 431.35, h: 22.2, d: 250.0}
size-confidence: {w: estimated, h: datasheet, d: estimated}
size-notes: >-
  The face is the whole front of the panel, 431.35 x 22.2: the drawer's front is
  the panel's front. 22.2 is 0.5U. The width is the span of the five latch
  pillars (see the device's provenance.chassis). THE DEPTH IS A GUESS: the
  panel is 284 deep and the renders of the drawer pulled out show a tray a
  little shorter than the shell; 250 is that, unmeasured.
