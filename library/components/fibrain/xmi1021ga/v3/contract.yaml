       confidence: estimated, source: 'the adapter body standing out of the back of the holder, as the vendor renders show it; 6 is read by eye'}
    - {id: lc02-back, at: [19.800, 6.150], size: [12.10, 8.70], from: 31.0, depth: 6.0, color: '#1c9dbe', shows: [rear],
       confidence: estimated, source: 'the adapter body standing out of the back of the holder, as the vendor renders show it; 6 is read by eye'}
    - {id: lc03-back, at: [35.900, 6.150], size: [12.10, 8.70], from: 31.0, depth: 6.0, color: '#1c9dbe', shows: [rear],
       confidence: estimated, source: 'the adapter body standing out of the back of the holder, as the vendor renders show it; 6 is read by eye'}
    - {id: lc04-back, at: [52.000, 6.150], size: [12.10, 8.70], from: 31.0, depth: 6.0, color: '#1c9dbe', shows: [rear],
       confidence: estimated, source: 'the adapter body standing out of the back of the holder, as the vendor renders show it; 6 is read by eye'}
    - {id: lc05-back, at: [68.100, 6.150], size: [12.10, 8.70], from: 31.0, depth: 6.0, color: '#1c9dbe', shows: [rear],
       confidence: estimated, source: 'the adapter body standing out of the back of the holder, as the vendor renders show it; 6 is read by eye'}
    - {id: lc06-back, at: [84.200, 6.150], size: [12.10, 8.70], from: 31.0, depth: 6.0, color: '#1c9dbe', shows: [rear],
