<svg xmlns="http://www.w3.org/2000/svg" width="14.6mm" height="18.4mm" viewBox="0 0 14.6 18.4">
  <!-- Fibrain XQ200 - HD RJ45 connection module, Cat.6, screened, no adapter.
       The face of the XR200 elevation, which the XQ200 photograph shows alike: the
       front frame 14.60 x 16.10 in the dust-cover colour, the label plate above the
       opening, two round marks at the lower corners and the latch tab under the
       frame. The die-cast shell shows as bright metal above and below the frame and
       as a thin shield rim round the frame's edge (the rim width is a stand-in, see
       the contract). No keystone collar. The RJ45 jack is composed by the
       contract. -->
  <rect id="housing-top" x="0.2" y="0" width="14.2" height="1.3" fill="#c0c1c4"/>
  <rect id="housing-tab" x="3.91" y="17.4" width="6.78" height="1.0" fill="#c0c1c4"/>
  <rect id="frame" x="0" y="1.3" width="14.6" height="16.1" rx="0.2" fill="#bf291d" stroke="#0c0d0e" stroke-width="0.1"/>
  <rect id="shield" x="0.15" y="1.45" width="14.3" height="15.8" rx="0.2" fill="none" stroke="#c0c1c4" stroke-width="0.3"/>
  <rect id="label" x="1.65" y="1.9" width="11.3" height="4.2" rx="0.5" fill="#cc3a2d"/>
  <circle id="mark-left" cx="2.0" cy="15.3" r="1.25" fill="#a82217"/>
  <circle id="mark-right" cx="12.6" cy="15.3" r="1.25" fill="#a82217"/>
</svg>
