description: >-
  The Fibrain XCU10 drawer seen from above, front edge at the top of the
  drawing: the plate over the holder row, the tray floor, and the splice
  cassettes lying on it.
size: {w: 431.35, h: 250.0}
size-confidence: {w: estimated, h: estimated}
provenance:
  size: >-
    estimated - the drawer's own width and its guessed depth; see
    fibrain/xcu-drawer@1.
  layout: >-
    ESTIMATED, A SCHEMATIC. Read off the vendor's two renders of the drawer
    pulled out (XCU00_3, XCU00_4), which are three-quarter views: a plate
    with screw heads over the holder row, an open floor behind it, the
    splice cassettes lying across the middle of the floor with their long
    side across the panel - flat trays, each with two fibre storage rings
    and two red splice holders, as the cassette datasheet photographs them - and a bright rail down each side. Only the cassette's own
    195 x 93.6 is a stated figure (DSH_SCM_A rev 1.2). The floor's slots,
    tie-down points and the two standoffs either side of the cassette are
    visible on the renders and are not drawn.
