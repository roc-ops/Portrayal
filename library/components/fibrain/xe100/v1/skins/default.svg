<svg xmlns="http://www.w3.org/2000/svg" width="14.6mm" height="18.4mm" viewBox="0 0 14.6 18.4">
  <!-- Fibrain XE100 - HD RJ45 connection module, Cat.5, unscreened, no adapter.
       The face of the XR200 elevation, which the XE100 photograph shows alike: the
       front frame 14.60 x 16.10 in the dust-cover colour, the label plate above the
       opening, two round marks at the lower corners and the latch tab under the
       frame. The unscreened shell is near black, so its strips above and below the
       frame carry a thin grey outline (the shell's own grey is not told apart from
       the black holder). No shield rim, no keystone collar. The RJ45 jack is
       composed by the contract. -->
  <rect id="housing-top" x="0.2" y="0" width="14.2" height="1.3" fill="#323335" stroke="#8d939a" stroke-width="0.15"/>
  <rect id="housing-tab" x="3.91" y="17.4" width="6.78" height="1.0" fill="#323335" stroke="#8d939a" stroke-width="0.15"/>
  <rect id="frame" x="0" y="1.3" width="14.6" height="16.1" rx="0.2" fill="#479e35" stroke="#0c0d0e" stroke-width="0.1"/>
  <rect id="label" x="1.65" y="1.9" width="11.3" height="4.2" rx="0.5" fill="#5bb048"/>
  <circle id="mark-left" cx="2.0" cy="15.3" r="1.25" fill="#3b8a2b"/>
  <circle id="mark-right" cx="12.6" cy="15.3" r="1.25" fill="#3b8a2b"/>
</svg>
