<svg xmlns="http://www.w3.org/2000/svg" width="14.6mm" height="18.4mm" viewBox="0 0 14.6 18.4">
  <!-- Fibrain XQ110 - HD RJ45 connection module, Cat.6, unscreened, with keystone
       adapter. The face of the XR200 elevation (frame 14.60 x 16.10, label plate,
       two round marks, latch tab under the frame) and, from the XQ110 photograph,
       what the adapter adds: a clear latch over the top of the shell and a clear
       collar round the frame; the tab under the frame is clear too. The sheet does
       not dimension the adapter, so the latch width (the tab's 6.78) and the collar
       inset are stand-ins, see the contract. The unscreened shell is near black, so
       its strips carry a thin grey outline. The RJ45 jack is composed by the
       contract. -->
  <rect id="housing-top" x="0.2" y="0" width="14.2" height="1.3" fill="#323335" stroke="#8d939a" stroke-width="0.15"/>
  <rect id="housing-tab" x="3.91" y="17.4" width="6.78" height="1.0" fill="#e4eaed" fill-opacity="0.8" stroke="#8d939a" stroke-width="0.15"/>
  <rect id="frame" x="0" y="1.3" width="14.6" height="16.1" rx="0.2" fill="#bf291d" stroke="#0c0d0e" stroke-width="0.1"/>
  <rect id="collar" x="0.6" y="1.75" width="13.4" height="14.7" rx="0.3" fill="none" stroke="#e4eaed" stroke-opacity="0.8" stroke-width="0.2"/>
  <rect id="latch" x="3.91" y="0.1" width="6.78" height="1.1" rx="0.3" fill="#e4eaed" fill-opacity="0.8" stroke="#8d939a" stroke-width="0.1"/>
  <rect id="label" x="1.65" y="1.9" width="11.3" height="4.2" rx="0.5" fill="#cc3a2d"/>
  <circle id="mark-left" cx="2.0" cy="15.3" r="1.25" fill="#a82217"/>
  <circle id="mark-right" cx="12.6" cy="15.3" r="1.25" fill="#a82217"/>
</svg>
