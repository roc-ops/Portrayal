format: 1
kind: component
name: xpu-top-sheet
version: 1.0.1
class: mechanical
behaviour: mounts
profile: optical
description: >-
  The top sheet of the Fibrain HD 1U frame XPU00 / XPS00 - the steel plate
  over the slot parts, across the front of the frame. Behind it the frame is
  open from above.
size: {w: 435.0, h: 115.6}
size-confidence: {w: drawing, h: estimated}
elements:
  cover: {at: [0.0, 0.0], size: [435.0, 115.6], class: bezel}
relief:
  features:
    - node: cover
      lift: 42.30
      out: 43.10
      color: '#1b1e21'
      confidence: drawing
      source: 'the front elevation draws the top sheet 0.80 thick, 0.05 to 0.85 from the top of the frame; the heights here are those above the floor, which put it there'
    - {node: screw-1, lift: 43.10, cyl: 0.7, color: '#b8bdc2', confidence: estimated, source: 'the plan and the vendor renders show a screw over each post, 27 back from the face; a head height is on no sheet, so 0.7 is a stand-in that keeps the head inside the 43.96 of the frame'}
    - {node: screw-2, lift: 43.10, cyl: 0.7, color: '#b8bdc2', confidence: estimated, source: 'as screw-1'}
    - {node: screw-3, lift: 43.10, cyl: 0.7, color: '#b8bdc2', confidence: estimated, source: 'as screw-1'}
    - {node: screw-4, lift: 43.10, cyl: 0.7, color: '#b8bdc2', confidence: estimated, source: 'as screw-1'}
    - {node: screw-5, lift: 43.10, cyl: 0.7, color: '#b8bdc2', confidence: estimated, source: 'as screw-1'}
provenance:
  size: >-
    drawing across - 435, the frame between its ears, off the front elevation
    (the CAD libraries archive Fibrain publishes (hd.fibrain.com/dxf/cad-libraries.zip, files dated 2020-07-30), `XPS00.dxf`: AutoCAD 2007, units millimetres, one 1:1 front elevation);
    the sheet itself is drawn 434.80 there. ESTIMATED DEEP -
    the front and plan line drawing on page 2 of DSH-XPU00 rev 2 (15.05.2020) and DSH-XPS00 rev 1 (24.05.2020), one image in both, 782 px across at 1.376 px/mm:
    the sheet reaches 90 back from the face across the middle and 115.6 at
    each end, with a slope about 26 long between the two depths starting 21
    in from each side.
  size-holes: >-
    estimated - the same plan: four pairs of slots about 22 x 3, 48 and 59
    back from the face, and a screw over each of the five posts, 27 back. The
    vendor renders show the same screws and more that the plan does not
    resolve.
  relief: >-
    drawing - see the feature.
  color: >-
    photo - black, a fine texture on the vendor renders.
  top-features: >-
    what the sources show of the top, drawn: the notched outline (90 deep
    across the middle, 115.6 at each end), the four pairs of slots about 22 x 3,
    each now rimmed in a thin grey (#8d939a, the kit shell's dim grey) so the
    openings read against the black sheet, and a screw head over each of the
    five posts, raised 0.7 off the sheet. ESTIMATED: the head height, which no
    sheet gives. NOT DRAWN, because no source shows it: any rib, emboss, fold
    or edge flange of the sheet, and any marking on it; the vendor renders show
    a plain black top.
skins: [default]
