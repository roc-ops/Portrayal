provenance:
  size: >-
    datasheet - see size-notes.
  parts: >-
    borrowed from fibrain/xms00@1: the windows, dividers, bays and moulding
    are the maker's 1:1 front elevation of XMS00 (see that part), the only
    holder elevation the maker publishes. The XMU00 datasheet (rev 0,
    11.09.2019) draws the same front and the same plan as the XMS00 one, six
    windows between dividers, 100 across and 21 high, compared by eye and not
    measured. Six windows 14.80 x 16.60 on a 16.02 pitch, 4.30 from the outer
    edge of the left latch tab; the window centres in the 100 envelope are
    9.95, 25.97, 41.99, 58.01, 74.03 and 90.05.
  positions: >-
    ASSUMED. Fibrain prints nothing on the holder; port numbers go on a
    separate label field. Positions are numbered left to right, as the front
    elevation shows them.
  moulding: >-
    drawing (borrowed, as parts) for the outline, windows, dividers, end slots
    and the four 1.5 mm holes. THE LATCH TAB at each end, 2.00 out, is outside
    the 100 envelope and is not drawn.
  depth: >-
    datasheet for the overall 66; the boxes behind the face are estimated, as
    they say.
  screening: >-
    datasheet and photo - XMU00 is 'Holder for HD Patch panel for 6 x RJ45,
    unscreened, empty' (DSH XMU00 rev 0). Its photograph shows plain black
    window tops where XMS00's shows a bright metal spring plate, so this part
    draws none. The screening contact is the only difference between the two
    holders in this library.
  weight: >-
    sources disagree - DSH XMU00 rev 0 prints 0.23 kg and DSH XMS00 rev 0 prints
    0.02 kg for the same frame. Neither is carried: this library's holders
    state no weight, and a holder 0.23 kg beside a 0.02 kg one is a
    misprint on one sheet that nothing here settles.
  modules: >-
    datasheet - the same list as XMS00's: support for all Fibrain HD module
    categories (kat.5/s, kat.6/s, kat.6A/s), installation 'without adapter', a
    density of 6xRJ45/s per holder and 8 holders per HD patch panel. THE SHEET SAYS 'SCREENED' ON THIS UNSCREENED
    HOLDER, which is the same text under the other part number, and the
    XPU00 sheet lists RJ45/u in kat.5, kat.6 and kat.6A for the frame. So the
    holder takes all twelve modules in both screenings.
  catalogue: >-
    datasheet and catalogue - 'HD 6x RJ45 holder, no grounding, unequipped' is
    XMU00 and 'grounding' is XMS00. Which pairs with which module screening is
    the buyer's to choose; the library does not forbid a mix.
