format: 1
kind: component
name: xmn1041db-rear
version: 1.0.0
class: adapter-panel
description: >-
  The back of Fibrain XMN1041DB: the same adapters that face forward, seen from
  behind, whose far ends take the pigtails spliced inside the panel.
