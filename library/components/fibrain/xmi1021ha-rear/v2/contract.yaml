format: 1
kind: component
name: xmi1021ha-rear
version: 2.1.0
class: adapter-panel
description: >-
  The back of Fibrain XMI1021HA: the same adapters that face forward, seen from
  behind, whose far ends take the pigtails spliced inside the panel.
size: {w: 100.0, h: 21.0}
size-confidence: {w: datasheet, h: datasheet}
size-notes: >-
  The holder's own 100 x 21 face seen from behind. No depth is declared: a
  face is a drawing of a back, and the depth belongs to the holder, as
  `body.depth`.
attrs: {media: fiber}
groups:
  adapters:
    term: Adapter
    role: traffic
    index-origin: 1
    attrs: {media: fiber}
    description: the 6 adapters seen from the back of the holder
parts:
  - {id: b01, ref: fibrain/lc-duplex-adapter@1, group: adapters, at: [83.900, 5.850], rotate: 180, attrs: {housing-finish: '#a0ae61'}}
  - {id: b02, ref: fibrain/lc-duplex-adapter@1, group: adapters, at: [67.800, 5.850], rotate: 180, attrs: {housing-finish: '#a0ae61'}}
  - {id: b03, ref: fibrain/lc-duplex-adapter@1, group: adapters, at: [51.700, 5.850], rotate: 180, attrs: {housing-finish: '#a0ae61'}}
  - {id: b04, ref: fibrain/lc-duplex-adapter@1, group: adapters, at: [35.600, 5.850], rotate: 180, attrs: {housing-finish: '#a0ae61'}}
  - {id: b05, ref: fibrain/lc-duplex-adapter@1, group: adapters, at: [19.500, 5.850], rotate: 180, attrs: {housing-finish: '#a0ae61'}}
  - {id: b06, ref: fibrain/lc-duplex-adapter@1, group: adapters, at: [3.400, 5.850], rotate: 180, attrs: {housing-finish: '#a0ae61'}}
provenance:
  size: >-
    datasheet - see size-notes.
  parts: >-
    THE FRONT's ADAPTERS, SEEN FROM BEHIND. Each front part has one entry here,
    `bNN` behind `lcNN`, at the front column mirrored across the 100 face and
    at the same height. Turned the other way from its front, so bore k is the same sleeve - see the holder's provenance.optical.
  coupler: >-
    EACH ADAPTER IS A COUPLER WITH AN END ON EACH FACE. The front's end is
    toward the aisle and this face is the end into the rack, one mating sleeve,
    so a link passes through (the holder's `optical.paths`). Fibrain's holder
    datasheet (DSH_XMx_EN rev 1.1, 03.06.2024) sells the holder 'fully equipped
    with adapters' and draws no rear. The XCU datasheet (DSH_XCU00_EN rev 1.1,
    05.07.2024) sells the XCU10 equipped in two SCM-A-24H splice cassettes with
    'type of adapters and pigtails', 24 splices to a cassette (DSH_SCM_A rev
    1.2, 02.04.2021), so in that panel this end is where a pigtail's connector
    plugs in. THE REAR ART IS A STAND-IN: no document or render shows the back
    of an adapter square-on, so it is the front's adapter turned the other way.
  face-detail-gap: >-
    the vendor's renders show the adapter bodies standing out of the back of
    the holder and no printing; the moulding behind them is painted as the
    front is.
  groups: >-
    Fibrain HD adapter holder data sheet XMx (revision 1.1, modified 03.06.2024), page
    1, lists XMI1021HA as 'FO Holder 6x LCdx, MM, OM5' and describes a holder 'fully
    equipped with adapters'. This component is the holder seen from behind, and each
    adapter is the same mating sleeve as the front one of the same number in the
    holder's own paths, so the ports are a group of their own on this component. No page
    names a role for the port; the role follows the job, carrying a user's link through
    the panel, so it is traffic. The port is passive and the data sheet prints no rate
    for it, so the group states no speed.
skins: [default]
# The @1 of this part is gone from the library (#1046). A rack file that names it
# is read as this one: the ids of its parts, its ports and their names are the same.
