format: 1
kind: component
name: xcu-shell-top
version: 1.0.0
class: mechanical
behaviour: mounts
profile: optical
description: >-
  The top of the Fibrain XCU10's outer shell - the sheet-steel cover the
  drawer slides out from under. It lifts off in the viewer so the drawer's
  contents can be seen from above.
size: {w: 431.35, h: 284.0}
size-confidence: {w: estimated, h: datasheet}
relief:
  wall: '#101214'
  features:
    - node: cover
      out: 1.0
      color: '#1b1e21'
      confidence: estimated
      source: sheet steel of about a millimetre, so the top reads as a surface
elements:
  cover: {at: [0.0, 0.0], size: [431.35, 284.0], class: bezel}
provenance:
  size: >-
    estimated across, datasheet deep - the body's 431.35 and the panel's 284.
  removable: >-
    A VIEWING AID, NOT A SERVICE COVER. Nothing held says this top comes off:
    the datasheet describes access by pulling the drawer, and it is the fixed
    sibling XAU whose sheet says 'removable cover'. It is a part that lifts
    off here because that is how a top view shows what is under it.
  not-drawn: >-
    the renders show the top notched across the rear, between two tabs, and a
    joggled seam near the front; neither is dimensioned and neither is drawn.
