<svg xmlns="http://www.w3.org/2000/svg" width="100.0mm" height="21.0mm" viewBox="0 0 100.0 21.0">
  <!-- Fibrain XMI1041CA - HD adapter holder, 6 SC simplex adapters (aqua), multimode, OM3. Fills one slot of a Fibrain HD patch panel.
       The adapters are composed by the contract; this skin is the black
       moulding: the face, the five ribs between the six cells and the two end
       cheeks. Nothing is printed on the holder. See the contract's provenance. -->
  <rect id="bezel" x="0" y="0" width="100.0" height="21.0" rx="0.6"
        fill="#17191b" stroke="#0c0d0e" stroke-width="0.25"/>
  <rect x="0.125" y="0.125" width="2.925" height="20.75" fill="#222528"/>
  <rect x="96.950" y="0.125" width="2.925" height="20.75" fill="#222528"/>
  <rect x="17.260" y="0" width="2.0" height="21.0" fill="#2a2d30"/>
  <rect x="33.130" y="0" width="2.0" height="21.0" fill="#2a2d30"/>
  <rect x="49.000" y="0" width="2.0" height="21.0" fill="#2a2d30"/>
  <rect x="64.870" y="0" width="2.0" height="21.0" fill="#2a2d30"/>
  <rect x="80.740" y="0" width="2.0" height="21.0" fill="#2a2d30"/>
</svg>
