format: 1
kind: component
name: xmi1041ga-rear
version: 2.1.0
class: adapter-panel
description: >-
  The back of Fibrain XMI1041GA: the same adapters that face forward, seen from
  behind, whose far ends take the pigtails spliced inside the panel.
size: {w: 100.0, h: 21.0}
size-confidence: {w: datasheet, h: datasheet}
size-notes: >-
  The holder's own 100 x 21 face seen from behind. No depth is declared: a
  face is a drawing of a back, and the depth belongs to the holder, as
  `body.depth`.
attrs: {media: fiber}
groups:
  adapters:
    term: Adapter
    role: traffic
    index-origin: 1
    attrs: {media: fiber}
    description: the 6 adapters seen from the back of the holder
parts:
  - {id: b01, ref: common/sc-simplex-adapter@1, group: adapters, at: [85.550, 4.100], rotate: 90, attrs: {housing-finish: '#1c9dbe'}}
  - {id: b02, ref: common/sc-simplex-adapter@1, group: adapters, at: [69.450, 4.100], rotate: 90, attrs: {housing-finish: '#1c9dbe'}}
  - {id: b03, ref: common/sc-simplex-adapter@1, group: adapters, at: [53.350, 4.100], rotate: 90, attrs: {housing-finish: '#1c9dbe'}}
  - {id: b04, ref: common/sc-simplex-adapter@1, group: adapters, at: [37.250, 4.100], rotate: 90, attrs: {housing-finish: '#1c9dbe'}}
  - {id: b05, ref: common/sc-simplex-adapter@1, group: adapters, at: [21.150, 4.100], rotate: 90, attrs: {housing-finish: '#1c9dbe'}}
  - {id: b06, ref: common/sc-simplex-adapter@1, group: adapters, at: [5.050, 4.100], rotate: 90, attrs: {housing-finish: '#1c9dbe'}}
provenance:
  size: >-
    datasheet - see size-notes.
  parts: >-
    THE FRONT's ADAPTERS, SEEN FROM BEHIND. Each front part has one entry here,
    `bNN` behind `scNN`, at the front column mirrored across the 100 face and
    at the same height, turned the same way: seen from behind the key slot is
    still up or still down.
  coupler: >-
    EACH ADAPTER IS A COUPLER WITH AN END ON EACH FACE. The front's end is
    toward the aisle and this face is the end into the rack, one mating sleeve,
    so a link passes through (the holder's `optical.paths`). Fibrain's holder
    datasheet (DSH_XMx_EN rev 1.1, 03.06.2024) sells the holder 'fully equipped
    with adapters' and draws no rear. The XCU datasheet (DSH_XCU00_EN rev 1.1,
    05.07.2024) sells the XCU10 equipped in two SCM-A-24H splice cassettes with
    'type of adapters and pigtails', 24 splices to a cassette (DSH_SCM_A rev
    1.2, 02.04.2021), so in that panel this end is where a pigtail's connector
    plugs in. THE REAR ART IS A STAND-IN: no document or render shows the back
    of an adapter square-on, so it is the front's adapter turned the other way.
  face-detail-gap: >-
    the vendor's renders show the adapter bodies standing out of the back of
    the holder and no printing; the moulding behind them is painted as the
    front is.
  groups: >-
    Fibrain HD adapter holder data sheet XMx (revision 1.1, modified 03.06.2024), page
    1, lists XMI1041GA as 'FO Holder 6x SC, SM' and describes a holder 'fully equipped
    with adapters'. This component is the holder seen from behind, and each adapter is
    the same mating sleeve as the front one of the same number in the holder's own
    paths, so the ports are a group of their own on this component. No page names a role
    for the port; the role follows the job, carrying a user's link through the panel, so
    it is traffic. The port is passive and the data sheet prints no rate for it, so the
    group states no speed.
skins: [default]
# The @1 of this part is gone from the library (#1046). A rack file that names it
# is read as this one: the ids of its parts, its ports and their names are the same.
