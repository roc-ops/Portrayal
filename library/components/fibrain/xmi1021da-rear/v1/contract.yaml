format: 1
kind: component
name: xmi1021da-rear
version: 1.0.0
class: adapter-panel
description: >-
  The back of Fibrain XMI1021DA: the same adapters that face forward, seen from
  behind, whose far ends take the pigtails spliced inside the panel.
size: {w: 100.0, h: 21.0}
size-confidence: {w: datasheet, h: datasheet}
size-notes: >-
  The holder's own 100 x 21 face seen from behind. No depth is declared: a
  face is a drawing of a back, and the depth belongs to the holder, as
  `body.depth`.
attrs: {media: fiber}
parts:
  - {id: b01, ref: common/lc-duplex-v-adapter@6, at: [85.035, 8.265], rotate: 270, attrs: {housing-finish: '#54ccde'}}
  - {id: b02, ref: common/lc-duplex-v-adapter@6, at: [69.165, 8.265], rotate: 270, attrs: {housing-finish: '#54ccde'}}
  - {id: b03, ref: common/lc-duplex-v-adapter@6, at: [53.295, 8.265], rotate: 270, attrs: {housing-finish: '#54ccde'}}
  - {id: b04, ref: common/lc-duplex-v-adapter@6, at: [37.425, 8.265], rotate: 270, attrs: {housing-finish: '#54ccde'}}
  - {id: b05, ref: common/lc-duplex-v-adapter@6, at: [21.555, 8.265], rotate: 270, attrs: {housing-finish: '#54ccde'}}
  - {id: b06, ref: common/lc-duplex-v-adapter@6, at: [5.685, 8.265], rotate: 270, attrs: {housing-finish: '#54ccde'}}
provenance:
  size: >-
    datasheet - see size-notes.
  parts: >-
    THE FRONT's ADAPTERS, SEEN FROM BEHIND. Each front part has one entry here,
    `bNN` behind `lcNN`, at the front column mirrored across the 100 face and
    at the same height. Turned the other way from its front, so bore k is the same sleeve - see the holder's provenance.optical.
  face-detail-gap: >-
    the vendor's renders show the adapter bodies standing out of the back of
    the holder and no printing; the moulding behind them is painted as the
    front is.
skins: [default]
