format: 1
kind: module
name: xmi1051ga
version: 2.1.0
class: adapter-panel
behaviour: fills
description: >-
  Fibrain XMI1051GA - HD adapter holder, 6 SC/APC simplex adapters (green),
  single-mode. Fills one slot of a Fibrain HD patch panel.
size: {w: 100.0, h: 21.0, d: 37.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
attrs: {media: fiber, model: XMI1051GA}
body:
  depth: 37.0
  # A BODY IN PIECES, because a holder seated in a drawer's slot is a module
  # inside a module, and the 3D build gives such a part only the boxes it
  # declares: the moulding, held just inside its own face so it shares no
  # surface with the drawer or the shell, and the back half of each adapter
  # standing out of it, which is what the panel shows from behind. Each piece
  # `shows: [rear]`, so its back carries the patch of the rear face it covers:
  # the SC opening on an adapter, the moulding between them.
  boxes:
    - {id: moulding, at: [0.5, 0.7], size: [99.0, 19.6], from: 1.0, depth: 30.0, color: '#17191b', shows: [rear],
       confidence: estimated, source: 'the moulding of the 100 x 21 x 37 holder of DSH_XMx rev 1.1, drawn 0.5 to 0.7 inside its face on each side; the 37 is taken as the overall depth with the adapters, and the moulding as 6 short of it, by eye off the renders'}
    - {id: sc01-back, at: [3.650, 6.100], size: [12.2, 8.8], from: 31.0, depth: 6.0, color: '#44a72a', shows: [rear],
       confidence: estimated, source: 'the adapter body standing out of the back of the holder, as the vendor renders show it; 6 is read by eye'}
    - {id: sc02-back, at: [19.750, 6.100], size: [12.2, 8.8], from: 31.0, depth: 6.0, color: '#44a72a', shows: [rear],
       confidence: estimated, source: 'the adapter body standing out of the back of the holder, as the vendor renders show it; 6 is read by eye'}
    - {id: sc03-back, at: [35.850, 6.100], size: [12.2, 8.8], from: 31.0, depth: 6.0, color: '#44a72a', shows: [rear],
       confidence: estimated, source: 'the adapter body standing out of the back of the holder, as the vendor renders show it; 6 is read by eye'}
    - {id: sc04-back, at: [51.950, 6.100], size: [12.2, 8.8], from: 31.0, depth: 6.0, color: '#44a72a', shows: [rear],
       confidence: estimated, source: 'the adapter body standing out of the back of the holder, as the vendor renders show it; 6 is read by eye'}
    - {id: sc05-back, at: [68.050, 6.100], size: [12.2, 8.8], from: 31.0, depth: 6.0, color: '#44a72a', shows: [rear],
       confidence: estimated, source: 'the adapter body standing out of the back of the holder, as the vendor renders show it; 6 is read by eye'}
    - {id: sc06-back, at: [84.150, 6.100], size: [12.2, 8.8], from: 31.0, depth: 6.0, color: '#44a72a', shows: [rear],
       confidence: estimated, source: 'the adapter body standing out of the back of the holder, as the vendor renders show it; 6 is read by eye'}
groups:
  adapters:
    term: Adapter
    role: traffic
    index-origin: 1
    attrs: {media: fiber}
    description: the 6 SC simplex adapters of the holder
parts:
  - {id: sc01, ref: common/sc-simplex-adapter@1, group: adapters, at: [5.050, 4.100], rotate: 90, attrs: {housing-finish: '#44a72a'}}
  - {id: sc02, ref: common/sc-simplex-adapter@1, group: adapters, at: [21.150, 4.100], rotate: 90, attrs: {housing-finish: '#44a72a'}}
  - {id: sc03, ref: common/sc-simplex-adapter@1, group: adapters, at: [37.250, 4.100], rotate: 90, attrs: {housing-finish: '#44a72a'}}
  - {id: sc04, ref: common/sc-simplex-adapter@1, group: adapters, at: [53.350, 4.100], rotate: 90, attrs: {housing-finish: '#44a72a'}}
  - {id: sc05, ref: common/sc-simplex-adapter@1, group: adapters, at: [69.450, 4.100], rotate: 90, attrs: {housing-finish: '#44a72a'}}
  - {id: sc06, ref: common/sc-simplex-adapter@1, group: adapters, at: [85.550, 4.100], rotate: 90, attrs: {housing-finish: '#44a72a'}}
faces:
  rear: {ref: fibrain/xmi1051ga-rear@2}
optical:
  media: os2
  polish: apc
  front-order:
    [sc01, sc02, sc03, sc04, sc05, sc06]
  paths:
    - {from: sc01.1, to: 'rear:b01.1'}
    - {from: sc02.1, to: 'rear:b02.1'}
    - {from: sc03.1, to: 'rear:b03.1'}
    - {from: sc04.1, to: 'rear:b04.1'}
    - {from: sc05.1, to: 'rear:b05.1'}
    - {from: sc06.1, to: 'rear:b06.1'}
provenance:
  size: >-
    datasheet - DSH_XMx_EN rev 1.1 (03.06.2024), technical specification: height
    21, width 100, depth 37 mm, plastic. One holder fills one HD slot. THE
    100 x 21 IS THE NOMINAL ENVELOPE, kept because it is the slot: the maker's
    front elevation draws the moulding 99.70 x 20.95, in a frame opening drawn
    99.99 x 21.00, and 103.50 over the two latch tabs that reach into the
    posts.
  parts: >-
    drawing - measured on the entities of the maker's front elevations of
    this slot front, `cassette-12-SCsx.dxf` and `cassette-6-SCsx.dxf` in
    the maker's CAD libraries archive (hd.fibrain.com/dxf/cad-libraries.zip, files
    dated 2020-07-30; AutoCAD 2007 DXF, units millimetres, drawn 1:1).
    Six windows 12.95 wide stand on a 16.10 pitch between ribs 3.15 wide, the
    first window 3.125 from the moulding's edge, the row centred on the
    moulding; with the moulding centred in the 100 x 21, the adapter centres
    are 9.75, 25.85, 41.95, 58.05, 74.15 and 90.25. THE DRAWING SEATS ITS OWN
    ADAPTERS UP TO 0.05 OFF THOSE CENTRES, slack in a 12.95 window; the
    window centres are what is modelled.
    ROWS: the 12 draws two adapter bodies 9.35 tall, abutting, their ferrules
    9.35 apart about mid height; the 6 draws one row at mid height. The
    adapter is common/sc-simplex-adapter@1 turned a quarter turn, landing
    12.8 x 9.4 where the drawing's body is 12.90 x 9.35. It is placed at its
    own size and not squeezed: two rows abut at 9.4, centred on the 21, so
    each ferrule is 0.025 further from mid height than drawn, which is inside
    the 9.4 -0.2 that adapter's own source allows.
    UNTIL THIS MAJOR the columns stood on a 15.87 pitch read off a render of the 1U
    extendable panel XHU00, and a 6 carried its row in the lower of the two
    positions, 4.7 below where the drawing and the vendor's render of the
    6-port holder (XM-Uchwyt-adapterow_3.jpg) both put it.
  moulding: >-
    drawing for the outline, windows, ribs, latch fingers and label holes
    (the same archive); photo for what a 6 has above and below its one row.
    The drawing leaves the whole 18.85 window open round the single row of a
    6; the vendor's render of the 6-port holder shows solid black moulding
    above and below the adapters, so the skin draws a window only the
    adapter's height and 0.3 over, which is estimated. The base plate the
    drawing shows 1.0 under the moulding (its layer is named for a base,
    1.00 to 102.50 across) is not drawn: the datasheet gives the holder as 21
    high and the 1U frame's slot rows stand 21.00 apart, which leaves no room
    for it under an upper holder. Which body the drawn front belongs to, the
    37 deep holder or the 169 deep cassette, the file does not say. THE LATCH
    TAB at each end, 1.90 out and 1.80 tall at mid height, is outside the 100
    envelope and is not drawn; seated, it is inside the post.
  orientation: >-
    photo - the 12-port holder's render (XM-Uchwyt-adapterow_2.jpg) and the
    XHU00 front render both show the upper row's key slot cut through the top
    wall and the lower row's through the bottom wall, the two rows mounted
    belly to belly. The 6-port render (XM-Uchwyt-adapterow_3.jpg) shows its
    one row with the key up. The maker's front elevations draw the key notch
    the same way: up on the 6 and on the upper row of the 12, down on its
    lower row.
  numbering: >-
    ASSUMED. Fibrain prints nothing on the holder; port numbers go on a separate
    label field (XL00), whose 12-port insert is two rows of six blank cells.
    Ids run left to right, the upper row first, which is how the vendor's
    render of numbered labels on the hybrid panel counts its RJ45 ports.
  optical: >-
    EVERY PATH IS ONE MATING SLEEVE, NOT A STRAND. A holder carries adapters and
    no glass: a fibre entering a front adapter leaves through the same adapter
    at the back, so front `scNN.1` reaches rear `bNN.1`. The rear face
    composes each adapter at the mirrored column.
  colour: >-
    photo - the green is the median of 401,235 green pixels on the 12-port
    SC/APC holder render (XM-Uchwyt-adapterow_2.jpg), #44a72a; the 6-port
    render reads #3aa023.
  catalogue: >-
    datasheet - ordering information lists XMI1051GA as 'FO Holder 6x SC/APC,
    SM'. The 14.12.2023 issue of the same sheet named the fibre as G.657A1 and
    the product page says OS2 G.652D; the current sheet says only SM.
  groups: >-
    Fibrain HD adapter holder data sheet XMx (revision 1.1, modified 03.06.2024), page
    1, lists XMI1051GA as 'FO Holder 6x SC/APC, SM' and describes a holder 'fully
    equipped with adapters'. The sheet does not number the adapters; the contract counts
    them left to right. No page names a role for the port; the role follows the job,
    carrying a user's link through the panel, so it is traffic. The port is passive and
    the data sheet prints no rate for it, so the group states no speed.
skins: [default]
