format: 1
kind: module
name: xq100
version: 1.0.1
class: adapter-panel
behaviour: fills
profile: networking
description: >-
  Fibrain XQ100 - HD RJ45 connection module, Cat.6, unscreened, without
  adapters. Seats in one position of a Fibrain HD RJ45 holder (XMU00, XMS00).
  Carries one RJ45 jack on its front; the cable ends on its IDC back. Red dust cover.
size: {w: 14.6, h: 18.4, d: 38.0}
size-confidence: {w: datasheet, h: borrowed, d: datasheet}
size-notes: >-
  DSH XQ100 rev 2 prints 14.60 across and 16.10 high on its front view and
  38.00 on its side view, the same figures as every module sheet of the
  family. The 18.40 overall height is BORROWED from the maker's 1:1 front
  elevation of XR200 (fibrain/xr200@1), the only module elevation published:
  its housing is 14.60 wide and 18.40 high, with a 0.22 clamp nub on the right
  side that is not part of the 14.6.
attrs: {media: rj45, model: XQ100, category: '6', screening: unscreened, keystone: none, cover: red}
body:
  depth: 38.0
  boxes:
    - {id: body, at: [0.0, 1.3], size: [14.6, 16.1], from: 0, depth: 38.0, color: '#323335',
       confidence: datasheet, source: 'the module as DSH XQ100 rev 2 draws it, 14.60 x 16.10 across the front and 38.00 long; a plastic shell, black on the photograph'}
parts:
  - {id: jack, ref: common/rj45-ganged-eth-plain@1, at: [0.95, 6.0], attrs: {finish: '#bf291d'}}
provenance:
  size: >-
    datasheet for the width, the front height and the depth - see size-notes;
    the overall height is borrowed from fibrain/xr200@1.
  datasheet: >-
    DSH XQ100 rev 2 - 'Connection module HD RJ45, kat.6, unscreened'; Cat.6 to
    ISO 11801, EN 50173 and ANSI/TIA 568.2-D; unscreened, housing plastic;
    IEC 60603-7-4; PoE to IEEE 802.3bt type 4 (100 W); 1.5 A; IDC termination,
    tool or toolless; fixation 'without keystone adapter'; ordering line
    'XQ100 FibrainDATA connection module, RJ45/u, kat.6, red dust cover,
    without adapters'.
  face: >-
    borrowed from fibrain/xr200@1: the outline, the 14.60 x 16.10 front frame,
    the label plate, the two round marks and the latch tab, as the maker's
    front elevation of XR200 draws them. The photograph of this part shows the
    same face as the one of XR200 in red.
  jack: >-
    estimated - as fibrain/xr200@1: common/rj45-ganged-eth-plain@1, the lamp-less
    Ethernet member of the family (no lamp window on the maker's drawings, and
    the bare cell would export as a console port), whose body tier lands on
    the opening drawn on the XR200 elevation, 11.90 wide from x 1.35 and from y
    6.50.
  colour: >-
    photo - the red of the dust cover and face, #bf291d, the median of 40,000
    pixels on the right border of the maker's render of the Cat.6 module; the
    datasheet names 'red dust cover'. The unscreened shell is near black,
    #323335, the median of 90,000 pixels on the unscreened render's side.
  not-modelled: >-
    the IDC back, which takes the cable and is not a port here; the dust cover's
    hinged door; the clamp nub, 0.22 out of the right side; the latch tab under
    the frame.
  seating: >-
    datasheet - the module clips into a window of the XMU00 or XMS00 holder
    directly.
  art-outline: >-
    the shell strips above and below the frame carry a 0.15 outline in #8d939a,
    the kit shell's dim grey, so the near-black shell reads against the black
    holder on a light stage and a dark one. The outline is not on the maker's
    drawing. This module has no shield rim and no keystone collar: the sheet
    says unscreened, without adapters.
skins: [default]
