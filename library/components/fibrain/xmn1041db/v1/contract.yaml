provenance:
  size: >-
    datasheet - DSH_XMx_EN rev 1.1 (03.06.2024), technical specification: height
    21, width 100, depth 37 mm, plastic. One holder fills one HD slot.
  parts: >-
    ESTIMATED. The six columns stand on the 15.87 pitch measured for the SC
    holders off the vendor's centre-line front render of the 1U extendable
    panel (fibrain/xmn1051gb@1 records the reading), centred on the 100 face.
    The adapter is common/sc-simplex-adapter turned a quarter turn, landing
    12.8 x 9.4; two rows abut, 18.8, centred on the 21.
  orientation: >-
    carried over from the single-mode SC holders (fibrain/xmn1051gb@1,
    fibrain/xmi1051ga@1), whose renders show the upper row's key slot up and
    the lower row's down, and a 6-port's single row with the key up. No image
    of a multimode SC holder is held.
  numbering: >-
    ASSUMED. Fibrain prints nothing on the holder; port numbers go on a separate
    label field (XL00). Ids run left to right, the upper row first.
  colour: >-
    ASSUMED, NOT SEEN. No held image shows a Fibrain multimode holder. Aqua
    is the usual colour of an OM4 adapter and the one this library's other
    OM4 panels carry (#54ccde); it is not read off anything of Fibrain's.
  catalogue: >-
    datasheet - ordering information lists XMN1041DB as 'FO Holder 12x SC,
    MM, OM4'.
    THE 12-PORT PART NUMBERS ARE THE DATASHEET's. The product page and the 2020
    HD catalogue print this row differently (a repeated number, or one ending
    in A, which is a 6-port number); the datasheet is taken as right and that
    is unconfirmed.
  optical: >-
    EVERY PATH IS ONE MATING SLEEVE, NOT A STRAND. A holder carries adapters and
    no glass: a fibre entering a front adapter leaves through the same adapter
    at the back, so front `scNN.1` reaches rear `bNN.1`. The rear face
    composes each adapter at the mirrored column.
skins: [default]
