format: 1
kind: module
name: dcp-2-psu-ac
version: 1.4.0
class: psu
behaviour: fills
profile: networking
description: Smartoptics DCP-2-PSU-AC-FB - the AC power supply for the DCP-2 chassis,
  a 1U CRPS module wrapping a std/c14-inlet core, with a fan aperture and an orange
  release lever.
size: {w: 73.5, h: 40.0}
attrs:
  model: DCP-2-PSU-AC-FB
  input: ac
  power-output-w: 460
  airflow: front-to-back
provenance:
  lamp-states: >-
    THE LAMP IS DRAWN, CONTRACTED, AND DELIBERATELY SILENT - and this contract said
    why before there was anywhere to put it. `lamp` above: "What it signals is not
    stated in any DCP document, so it is drawn unlit and carries no function attr."
    Searched again for this change: DCP-Series_User_Manual_14.0_A has no PSU LED
    table and exactly one sentence that touches a lamp at all, s4.2's "The chassis
    will automatically power up as soon as the first PSU is connected. The power LED
    turns green" - which is about the chassis coming up and does not say whether the
    lamp meant is this module's or the chassis's own.
    THE CRPS FORM FACTOR WOULD ANSWER IT AND IS NOT A DOCUMENT WE HOLD. The sticker
    reads "CRPS 460W AC Gold" and that specification fixes the bi-colour behaviour,
    but naming a standard is not citing it. So the lamp carries no states, and the
    module no longer declares `ok` and `fail` it has no way to show. That is L47's
    own question answered in the direction the hardware allows rather than the
    direction that clears the warning.
  size: >-
    photo-measured, then snapped to the CRPS form factor - and the snap is the point.
    The module's own sticker reads "CRPS 460W AC Gold" in DCP-Series_User_Manual fig 2-5,
    which names the form factor, and 1U CRPS is 73.5 wide x 40 high. Measuring the two
    installed bays in that figure gives 81 and 75 for what are demonstrably the same
    part, so neither edge read is worth more than the standard it brackets. What IS sharp
    in the photograph is the pitch between the two fan stickers - 352.3, and figs 2-5 and
    2-6 are separate photographs that agree on it to 0.15%. 73.5 at a 352.3 pitch puts
    the pair at 4.0-77.5 and 356.3-429.8 in a 440 face, which matches the measured right
    bay to under a millimetre.
  power: >-
    the sticker, and it disagrees with the datasheet ON PURPOSE. so-ds-dcp-2-r4.3 says
    "PSU Rating 400W"; the module sticker says 460W. Both are recorded because they are
    different claims - 400 is what the chassis is rated to draw from a supply, 460 is what
    this supply can deliver. NO AMBIENT is quoted with either figure in any DCP document,
    so none is asserted here.
  inlet: >-
    standard (IEC 60320-1) via std/c14-inlet@1, composed rather than drawn - and it is
    ROTATED 270, earth pin to the left. The first cut of this part hand-drew a 19 x 20
    inlet, which is neither the standard cutout (28 x 20) nor the orientation the
    hardware uses, and it read as a squashed socket.
    THE ROTATION IS MEASURED, not assumed: the aperture in UM figs 2-5 and 2-6 is about
    20 across by 27 down - the standard cutout on its side - and the C14 shroud's two
    chamfered corners, which sit on the earth side, are on the LEFT in both that figure
    and the removed-module shot (fig 2-13). Chamfer position survives foreshortening,
    which is what lets the oblique photograph corroborate the face-on one.
    common/psu-ac-650@3 already composes the same part at the same rotation for the same
    reason, so this follows an existing convention rather than inventing one.
  latch-and-handle: >-
    THE SAME MECHANISM AS THE R740xd's SUPPLY, on the owner's reading of both machines,
    so both figures are borrowed from dell/psu-1100w-ac-14g@1 rather than guessed a
    second time. The lever does two jobs - it retains the cord and it is the cantilever
    the supply is pulled out by - and at 2.2 proud it could do neither.
  latch-position: >-
    CENTRED ON THE INLET, and it was not. The lever was drawn at y 14.5-37.0, low and
    long, which put it across the bottom-right corner where the status lamp sits - so the
    lamp was hidden behind it and the lever was off-centre against the aperture it
    belongs to. The inlet spans y 6-34 about a centre of 20; the lever now shares that
    centre at 8.75-31.25, and the lamp has its corner back.
  screws: >-
    FOUR, ON THE CORNERS OF THE FAN APERTURE, and this supersedes an earlier reading of
    the same photograph that recorded two "along the bottom of the face at local x 8 and
    39.5". There were two, sitting along the bottom
    of the face clear of the opening, which read as unrelated to it. fig 2-5 resolves
    fastener heads at the aperture's corners; the two that were drawn were the two
    that happened to be legible.
  face-features: >-
    photo-measured from UM fig 2-5, averaged over BOTH installed supplies, which are the
    same part photographed twice and agree to about a millimetre. Fan opening 34.1 wide
    centred on local x 25.5; the C14 aperture centred on 55.5; the release lever spanning
    roughly 64.5-73. The bail handle is drawn stowed, lying across the top of the fan
    opening, which is where it sits in both installed photographs; fig 2-13 shows it
    folded out on a module in the hand.
  lamp: >-
    ONE status lamp, at local x 57.4 - not two. The first cut drew a pair by analogy with
    other supplies. The bottom band of the face resolves exactly one round aperture in
    both installed supplies, and one bi-colour status LED is what the CRPS form factor
    named on the module's own sticker specifies. What it signals is not stated in any DCP
    document, so it is drawn unlit and carries no function attr.
  elements: >-
    photo-measured - fig 2-5 and fig 2-6 (installed, face-on) for the arrangement, and
    fig 2-13 (the AC and DC modules side by side, out of the chassis) for what each
    feature is. The fan sits left, the C14 inlet right of centre, the orange release
    lever at the right edge, with two round lamp apertures low on the face. Positions
    are good to about +/-1mm across; the y axis in both installed figures is ~3%
    compressed by the camera angle and is scaled from the 45mm chassis height rather
    than from the same factor as x.
  handle: >-
    fig 2-13 - a black wire bail handle folds out of the face. It is drawn stowed, which
    is how it appears in both installed photographs; UM s2.3.1-2.3.2 describes lifting it
    to extract the module.

  depth-gap: >-
    NOT STATED in any DCP document, and not derivable from a front elevation. 1U CRPS is
    a family of lengths, so the form factor does not settle it either.
  no-body-relief: >-
    THE BODY DECLARES NO `out`, DELIBERATELY. A face that stands proud of its own panel
    buries everything on it - the kit extrudes the plate as a slab and every feature
    without relief of its own ends up inside it. That is what left smartoptics/dcp-404@1
    blank in 3D. The module's own proudness relative to the chassis is the bay's
    business, not the part's.
  depth: >-
    ESTIMATED at 265, and stated as a figure only so the part is a solid in 3D rather
    than a plane. NO DCP DOCUMENT GIVES A PSU LENGTH. 1U CRPS is a family of lengths
    rather than one, so the form factor named on the module's own sticker does not
    settle it either; what bounds it is the chassis, which is 500 deep. Replace it the
    moment anything states one.
states: [absent]
elements:
  handle: {at: [4.5, 3.5], size: [35.5, 5.0], class: handle}
  fan-aperture: {at: [8.45, 8.0], size: [34.1, 30.0], class: vent}
  screw-tl: {at: [8.45, 8.00], size: [3.4, 3.4], class: fastener}
  screw-tr: {at: [39.15, 8.00], size: [3.4, 3.4], class: fastener}
  screw-bl: {at: [8.45, 34.60], size: [3.4, 3.4], class: fastener}
  screw-br: {at: [39.15, 34.60], size: [3.4, 3.4], class: fastener}
  latch: {at: [66.0, 8.75], size: [7.0, 22.5], class: latch}
  lamp-status: {at: [66.0, 34.4], size: [3.6, 3.6], class: indicator}
parts:
  - {ref: std/c14-inlet@1, id: inlet, at: [41.5, 10.0], rotate: 270}
connection-points:
  power: {at: [50.5, 20.0], direction: rear}
relief:
  wall: '#5a6065'
  features:
    # POCKET AND NOT SINK: this was `sink`, which measures down from a cavity
    # FLOOR and means nothing on a node that is not inside one - so the recess
    # was collected by nothing and never built (#230). Same depth, right key.
    - node: fan-aperture
      pocket: 6.0
      confidence: estimated
      source: >-
        a fan sits behind a grille recessed into the face; 6 is the depth at which the
        blades read as behind the plate rather than flush with it. No document dimensions
        it and no view in the corpus is a side elevation of this module.
    # THE SAME HARDWARE AS THE R740xd's SUPPLY, on the owner's reading, so it takes
    # dell/psu-1100w-ac-14g@1's figures rather than a second guess at the same thing.
    # Both were given by the operator with the machine in front of them.
    - node: latch
      out: 19.05
      confidence: estimated
      source: >-
        borrowed - dell/psu-1100w-ac-14g@1's release lever, "about three-quarters of an
        inch proud ... pushed sideways to lock the cord in, so it has to stand off the
        face far enough to get a thumb on, and a flat tab would not work". The owner
        reads this as the same cantilever: it retains the cord AND is what the supply is
        pulled out by. Drawn 2.2 proud at first, which is a tab and not a lever.
    - node: handle
      uhandle: 25.4
      color: '#c9ced3'
      confidence: estimated
      source: >-
        borrowed - dell/psu-1100w-ac-14g@1's grip, "about an inch proud and a U rather
        than the flat rectangle this was drawn as, the same shape as the handles already
        in this library". Drawn here as a flat bar before, which is what a stowed bail
        looks like in a photograph and not what the part does.
    - node: screw-tl
      dome: 1.6
      confidence: estimated
      source: borrowed - dell/psu-1100w-ac-14g@1's captive screws, "rounded head, about a sixteenth proud"
    - node: screw-tr
      dome: 1.6
      confidence: estimated
      source: as screw-tl
    - node: screw-bl
      dome: 1.6
      confidence: estimated
      source: as screw-tl
    - node: screw-br
      dome: 1.6
      confidence: estimated
      source: as screw-tl
    - node: lamp-status
      out: 0.2
      confidence: estimated
      source: a light pipe finishing flush to slightly proud of the face
body:
  depth: 265.0       # estimated - see provenance/depth
  color: '#a8aeb4'
skins: [default]
