<svg xmlns="http://www.w3.org/2000/svg" width="73.5mm" height="40mm" viewBox="0 0 73.5 40">
  <!-- DCP-2-PSU-AC-FB face, 73.5 x 40 (1U CRPS, named by the module's own
       "CRPS 460W AC Gold" sticker in DCP-Series_User_Manual fig 2-5).

       THE INLET IS NOT DRAWN HERE. It is std/c14-inlet@1, composed by the
       contract at rotate 270 (earth pin left), and this bezel art wraps it - the
       same arrangement common/psu-ac-650@3 uses.

       THE LEVER IS CENTRED ON THE INLET, and the lamp sits below it in the
       corner. It was drawn low and long, which put it across the bottom-right
       corner where the status lamp goes. The C14 aperture spans y 6-34 about a
       centre of 20; the lever now shares that centre.

       THE FOUR SCREWS SIT ON THE CORNERS OF THE FAN APERTURE. There were two,
       placed along the bottom and clear of the opening, which read as unrelated
       to it. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3c8cd"/>
      <stop offset="0.55" stop-color="#a8aeb4"/>
      <stop offset="1" stop-color="#8d9399"/>
    </linearGradient>
    <radialGradient id="fanwell" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#2a2e32"/>
      <stop offset="1" stop-color="#111417"/>
    </radialGradient>
  </defs>

  <rect id="body" x="0" y="0" width="73.5" height="40" rx="0.8"
        fill="url(#metal)" stroke="#6d7278" stroke-width="0.3"/>

  <g id="fan-aperture">
    <rect x="8.45" y="8" width="34.1" height="30" rx="1.4" fill="url(#fanwell)"
          stroke="#70767c" stroke-width="0.35"/>
    <circle cx="25.5" cy="23" r="13.4" fill="none" stroke="#3d4247" stroke-width="0.5"/>
    <circle cx="25.5" cy="23" r="10.0" fill="none" stroke="#33373b" stroke-width="0.45"/>
    <circle cx="25.5" cy="23" r="6.2" fill="none" stroke="#33373b" stroke-width="0.45"/>
    <circle cx="25.5" cy="23" r="3.7" fill="#4a5055"/>
    <g stroke="#3d4247" stroke-width="0.4">
      <path d="M 25.5 9.6 V 36.4"/>
      <path d="M 12.1 23 H 38.9"/>
      <path d="M 16.0 13.5 L 35.0 32.5"/>
      <path d="M 35.0 13.5 L 16.0 32.5"/>
    </g>
  </g>

  <g id="handle">
    <rect x="4.5" y="3.5" width="35.5" height="5" rx="2.4" fill="#26292c" stroke="#141618" stroke-width="0.25"/>
    <rect x="6.6" y="4.9" width="31.3" height="2.2" rx="1.1" fill="#3a3e42"/>
  </g>

  <g fill="#9aa0a6" stroke="#5f646a" stroke-width="0.28">
    <circle id="screw-tl" cx="10.15" cy="9.70" r="1.70"/>
    <circle id="screw-tr" cx="40.85" cy="9.70" r="1.70"/>
    <circle id="screw-bl" cx="10.15" cy="36.30" r="1.70"/>
    <circle id="screw-br" cx="40.85" cy="36.30" r="1.70"/>
  </g>
  <g stroke="#5f646a" stroke-width="0.3" fill="none">
    <path d="M 9.05 8.60 L 11.25 10.80 M 11.25 8.60 L 9.05 10.80"/>
    <path d="M 39.75 8.60 L 41.95 10.80 M 41.95 8.60 L 39.75 10.80"/>
    <path d="M 9.05 35.20 L 11.25 37.40 M 11.25 35.20 L 9.05 37.40"/>
    <path d="M 39.75 35.20 L 41.95 37.40 M 41.95 35.20 L 39.75 37.40"/>
  </g>

  <g id="latch">
    <rect x="66" y="8.75" width="7" height="22.5" rx="1.6" fill="#e2621d" stroke="#a8430f" stroke-width="0.3"/>
    <rect x="67.4" y="11.25" width="4.2" height="17.5" rx="1.1" fill="#f07a33"/>
  </g>

  <circle id="lamp-status" cx="67.8" cy="36.2" r="1.8" fill="var(--led-color, #1d2124)" stroke="#5f646a" stroke-width="0.3"/>
</svg>
