<svg xmlns="http://www.w3.org/2000/svg" width="192mm" height="40mm" viewBox="0 0 192 40">
  <!-- DCP-2-FAN-FB faceplate, 192 x 40, measured off DCP-Series_User_Manual
       figs 2-5 and 2-6 at 2.72 px/mm across.

       THE HEXAGONS ARE FLAT-TOP - flat edges top and bottom, vertices left and
       right. That is the opposite orientation to the pointy-top cells on
       smartoptics/dcp-404@1, which sits in this same chassis. Both were read at
       14x from photographs of their own faces; the difference is real and neither
       was copied from the other.

       Column pitch 5.50 is measured (autocorrelation of the dark mask across the
       whole field). Row pitch 6.35 and the hole size follow from it for a regular
       honeycomb; the web between holes is set from the photograph at ~15% of pitch.
       120 holes. -->
