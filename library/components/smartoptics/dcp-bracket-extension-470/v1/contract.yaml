format: 1
kind: component
name: dcp-bracket-extension-470
version: 1.0.0
class: mount
behaviour: mounts
profile: networking
description: >-
  The bracket extension marked 470 mm of the Smartoptics DCP rack-mount kit, one for each side of
  the chassis. A flat plate screwed along the side of a front bracket with four screws, to reach
  the rear rack post of the deepest racks. Drawn as a plain plate: the manual dimensions nothing.
size: {w: 12.0, h: 45.0}
size-confidence: {w: estimated, h: estimated}
provenance:
  model: >-
    datasheet - the Smartoptics DCP-Series User Manual, release 14.0 A, section 3.2.1 (item 4,
    "Front bracket extension, right and left (470mm)"), section 3.2.2.1 (the "Middle extension"
    column) and section 3.2.4, which screws it to the front bracket.
  size: >-
    estimated - NO FIGURE DIMENSIONS THIS PART. 12.0 by 45.0 mm is a placeholder envelope for the
    plate seen from the front, the height being the chassis height; nothing measures it. The
    "470mm" in the parts list is the name the manual gives the part. It does not say what the
    figure measures, so it is not read as a length.
skins: [default]
