format: 1
kind: module
name: ppm-ad1-1625
version: 1.0.0
class: filter
behaviour: fills
profile: optical
description: Smartoptics PPM-AD1-1625-2F - a passive plug-in module that adds and
  drops a 1625nm OTDR signal onto the line fibre, so a fibre break can be located
  without taking the traffic wavelengths down. Three LC duplex adapters - OTDR 1625,
  Ext and Line - on a half-height plate that seats in a DCP-F carrier's PPM bay.
size: {w: 55.4, h: 19.5}
attrs:
  model: PPM-AD1-1625-2F
  media: fiber
  role: otdr-filter
  channel-nm: '1625'
provenance:
  size: >-
    borrowed - smartoptics/ppm-ad1-1510@1, whose 55.4 x 19.5 is itself ESTIMATED from
    four agreeing inferences rather than measured. NO DOCUMENT IN THE CORPUS DIMENSIONS
    ANY PPM: ds-ppm-r4.0 gives all eight parts a spec table and none of them a
    mechanical section. What makes borrowing right rather than lazy is that these two
    plates fill the SAME bay in the same carrier, and the library must not hold two
    answers for one aperture. Read that part's `size` key for how weak the figure is.
  what-it-is: >-
    datasheet - ds-ppm-r4.0 section "OSC ADD/DROP FILTER (PPM-AD1-1625-2F)": "The OTDR
    Add/drop filter is intended to enable insertion of an ODTR-signal along the line
    fiber to detect e.g. fiber cuts. The AD-filter operates at 1625nm". The section
    heading calls it an OSC add/drop filter, which is the 1510's job; the body and the
    port captions both say OTDR, so the heading is a copy from the previous page.
  ports: >-
    datasheet render and stencil master ppm-1625, which agree - three duplex pairs
    captioned OTDR 1625, Ext and Line, each with a white Tx/Rx box beneath it. Six
    bores, not four. The OTDR pair is set apart from the other two by a wider gap.
  port-positions: >-
    MEASURED TWICE, ON TWO DOCUMENTS. Duplex-pair centres read off ds-ppm-r4.0's own
    render (10.48, 28.52, 43.13) and off the DCP-F stencil master (10.21, 28.23,
    42.84), both scaled on the 55.4 width; the two agree within 0.3.
    THE ADAPTER IS THE LIBRARY'S, NOT THE ARTWORK'S. Both drawings space a pair's
    bores about 7.25 apart where common/lc-duplex-adapter@3 - measured off the
    Smartoptics DCP-R stencil, the same vendor drawing the same connector - spaces
    them 6.6. The connector is the part the library already owns, so only the
    POSITIONS are taken from these renders.
    Ext and Line abut in both drawings, so they are placed at the adapter's own 13.2
    pitch anchored on the MIDPOINT of the drawn group: the artwork's over-wide
    connectors then cost half the error at each end instead of all of it at one. That
    gives 22.50 and 35.70 - the same two numbers smartoptics/ppm-ad1-1510@1 already
    carries, from readings taken independently of it, which is the strongest thing
    said about this face.
    The OTDR pair is isolated, so it sits on its own measured centre at 3.75. IT IS
    NOT WHERE THE 1510's OSC PAIR IS - both sources put it about 1.8 further left -
    so the two plates are drawn differently and this is not a scaling artefact.
  face-layout: >-
    the adapter block runs y 3.86-4.02 to 14.99-15.10 across five renders in two
    documents, and the white caption box 16.15-16.37 to 18.22-18.32. Taken as 4.0 and
    16.2 x 2.05. smartoptics/ppm-ad1-1510@1 shipped the caption box at 15.4 x 2.7,
    which agrees with neither source; it is corrected to these figures alongside this
    part rather than being matched for the sake of a consistent family.
  connector: >-
    datasheet - ds-ppm-r4.0's spec table for this exact part: "Connector type LC/UPC".
    Worth stating because THE ARTWORK DISAGREES: the stencil master's adapters read as
    SC at a glance, on this part as on every other PPM.
  marking: >-
    datasheet render and stencil master - the part number is silkscreened VERTICALLY UP
    THE RIGHT-HAND EDGE, as on the rest of the family.
  depth: >-
    borrowed - smartoptics/ppm-ad1-1510@1's ESTIMATED 60, on the reasoning that a
    passive add/drop filter of the same family in the same bay is the same object
    behind the face. No document gives a depth for any PPM. Treat it as a placeholder
    with a ceiling - the carrier is 270 deep, so it cannot exceed that - and replace it
    the moment anything states one.
  face-detail-gap: >-
    no orthographic photograph of a PPM exists; both readings above are of DRAWINGS.
    Lamp inventory and any marking other than the part number are unknown, and the
    module may well carry none - a passive filter has nothing to report.
elements:
  caption-otdr: {at: [3.75, 16.2], size: [13.2, 2.05], class: marking}
  caption-ext: {at: [22.50, 16.2], size: [13.2, 2.05], class: marking}
  caption-line: {at: [35.70, 16.2], size: [13.2, 2.05], class: marking}
parts:
  - {ref: common/lc-duplex-adapter@3, id: otdr, at: [3.75, 4.0], attrs: {role: otdr}}
  - {ref: common/lc-duplex-adapter@3, id: ext, at: [22.50, 4.0], attrs: {role: ext}}
  - {ref: common/lc-duplex-adapter@3, id: line, at: [35.70, 4.0], attrs: {role: line}}
relief:
  wall: '#22262a'
  features:
    # NOT `out` ON THE BODY. A plate that stands proud of its own panel buries
    # everything drawn on it - see smartoptics/ppm-ad1-1510@1, which carries the
    # same note and the same reason. The plate IS the panel; the adapters recess.
    - node: caption-otdr
      out: 0.15
      confidence: estimated
      source: a printed caption panel, drawn barely proud so it reads as label rather than hole
    - node: caption-ext
      out: 0.15
      confidence: estimated
      source: as caption-otdr
    - node: caption-line
      out: 0.15
      confidence: estimated
      source: as caption-otdr
body:
  depth: 60.0        # estimated - see provenance/depth
  color: '#33383d'
skins: [default]
