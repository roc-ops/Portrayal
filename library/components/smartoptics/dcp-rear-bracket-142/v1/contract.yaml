format: 1
kind: component
name: dcp-rear-bracket-142
version: 1.0.0
class: mount
behaviour: mounts
profile: networking
description: >-
  The rear mounting bracket marked 142 mm of the Smartoptics DCP rack-mount kit, one for each side
  of the chassis. A plate fixed to the rear rack post with two screws and two retainer nuts, which
  the front bracket (or its extension) slides into. Drawn as a plain plate: the manual dimensions
  nothing.
size: {w: 12.0, h: 45.0}
size-confidence: {w: estimated, h: estimated}
provenance:
  model: >-
    datasheet - the Smartoptics DCP-Series User Manual, release 14.0 A, section 3.2.1 (item 5,
    "Rear-mounting brackets, right and left (142mm)"), section 3.2.2.1 (the "Rear bracket" column)
    and section 3.2.5, which fixes it to the rear post.
  size: >-
    estimated - NO FIGURE DIMENSIONS THIS PART. 12.0 by 45.0 mm is a placeholder envelope for the
    plate seen from the rear, the height being the chassis height; nothing measures it. The
    "142mm" in the parts list is the name the manual gives the part. It does not say what the
    figure measures, so it is not read as a length.
skins: [default]
