format: 1
kind: module
name: dcp-2-blank
version: 1.2.0
class: blank
behaviour: fills
profile: networking
description: Smartoptics DCP-2 blind plate - the moulded blank that fills an unused
  traffic slot so the airflow still passes through the populated one. Two perforated
  vent patches, each with a central boss.
size: {w: 205.0, h: 44.0}
attrs:
  role: slot-blank
provenance:
  size: >-
    borrowed - smartoptics/dcp-404@1, because a blank fills the same slot a traffic unit
    does and the library should not hold two different answers for one aperture. The
    aperture itself was measured independently: DCP-Series_User_Manual fig 2-4 puts the
    front slots at ~7-213 and ~226-433 in the 440 face, i.e. ~206.5 each, which leaves
    1.5 of clearance on a 205 module. UM s2.5 gives the part no dimensions of its own.
  elements: >-
    photo-inferred from an OBLIQUE view - UM fig 2-15 is the only artwork, and it is a
    three-quarter shot of the plate off the chassis. What it fixes: the plate is BLACK
    moulded plastic, not the chassis' light grey metal, and it carries two perforated
    patches, one toward each end, each with a raised central boss. The perforations are
    ROUND holes in a hexagonal packing - not the hexagonal holes used on the fan tray
    and the DCP-404. Patch positions, hole pitch and hole size are estimated from that
    photograph and are the weakest numbers on this part.
  part-number: >-
    NONE EXISTS, and that is why this part exports under its slug rather than a part
    number as the PSUs and fan tray do. so-ds-dcp-2-r4.3's ordering table lists the
    chassis, the licence, both PSUs and a spare fan unit, and no blind plate; UM s4.1
    lists it only inside the box contents - "DCP-2 chassis, incl. PSU, fan units and
    blind plate". It ships with the chassis and is not separately orderable.
  purpose: >-
    UM s2.5 - "If only 1 traffic module is being used in the DCP2 chassis this blind
    plate should be mounted to the empty slot to help guide the airflow through the
    traffic unit." The DCP-404 technical description backs this with an alarm: its high
    temperature warning tells the operator to "Check if the second slot in DCP-2 has a
    card or a dummy front panel."

  face-geometry-gap: >-
    no orthographic artwork exists. Patch centres, hole pitch and hole diameter are read
    off a three-quarter photograph and are estimated, not measured.
  depth: >-
    ESTIMATED at 15, stated only so the plate is a solid in 3D. UM s2.5 gives the part
    no dimensions at all. A moulded blanking plate is a plate with a lip, and it guides
    airflow rather than filling the slot, so it is given far less than the 270 of the
    traffic unit whose aperture it shares.
  latching-gap: >-
    UM s2.5 does not say how the plate is retained. The two central bosses look like
    captive fasteners in fig 2-15 but nothing states it, so they are drawn as bosses
    rather than as screws.
elements:
  vent-left: {at: [25.0, 9.0], size: [42.0, 26.0], class: vent}
  vent-right: {at: [138.0, 9.0], size: [42.0, 26.0], class: vent}
  boss-left: {at: [43.4, 19.4], size: [5.2, 5.2], class: fastener}
  boss-right: {at: [156.4, 19.4], size: [5.2, 5.2], class: fastener}
relief:
  wall: '#17191b'
  features:
    # REAL HOLES, not a sink. The perforation goes through a moulded plate whose
    # whole job is to pass air (UM s2.5), so `vent` - which turns the node's dark
    # cells into actual openings - is what it is. Drawn first as a 2.0 sink, which
    # rendered as a shallow dimple and read as printing.
    - node: vent-left
      vent: 12.0
      confidence: estimated
      source: >-
        through-holes in a moulded plate. The 12 is how far back the opening runs
        before anything closes it, bounded by the plate's own depth; nothing dimensions
        either.
    - node: vent-right
      vent: 12.0
      confidence: estimated
      source: as vent-left
    # THE PULL STANDS WELL PROUD - it is what a hand grabs to get the plate out.
    - node: boss-left
      cyl: 15.0
      confidence: estimated
      source: >-
        Jason, from the hardware: "I am really certain that that sits proud of the box,
        at least enough to grab onto to pull the blank out - so at least a half inch if
        not three-quarters." 12.7 to 19.05 is the range; 15 is a round figure inside it, not the midpoint, which is 15.875. It was first drawn at
        `out: 1.2`, a flat pad, which is what a boss looks like in a three-quarter
        photograph and not what it does. A cylinder rather than a box because the node is
        round and `cyl` takes its radius from the node's own bounds.
        WHAT IS NOT SETTLED: whether it is a pull, a thumbscrew or a captive fastener.
        UM s2.5 does not say, and fig 2-15 does not resolve it.
    - node: boss-right
      cyl: 15.0
      confidence: estimated
      source: as boss-left
body:
  depth: 15.0        # estimated - see provenance/depth
  color: '#26292b'
skins: [default]
