<svg xmlns="http://www.w3.org/2000/svg" width="205mm" height="44mm" viewBox="0 0 205 44">
  <!-- DCP-2 blind plate, 205 x 44 - the same slot footprint as a traffic unit,
       borrowed from smartoptics/dcp-404@1 because it fills the same aperture.

       BLACK MOULDED PLASTIC, not the chassis' light grey metal. Two perforated
       patches, one toward each end, each with a raised central boss.

       THE HOLES ARE ROUND, in a hexagonal packing - deliberately unlike the
       hexagonal holes on smartoptics/dcp-2-fan@1 and smartoptics/dcp-404@1. All
       three were read from photographs of their own faces.

       DRAWN FROM AN OBLIQUE PHOTOGRAPH. DCP-Series_User_Manual fig 2-15 is a
       three-quarter shot off the chassis; patch centres, hole pitch and hole size
       are estimated from it and are the weakest numbers on this part. -->
  <defs>
    <linearGradient id="moulding" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d40"/>
      <stop offset="0.4" stop-color="#26292b"/>
      <stop offset="1" stop-color="#17191b"/>
    </linearGradient>
    <radialGradient id="boss" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#4a4e51"/>
      <stop offset="1" stop-color="#1d1f21"/>
    </radialGradient>
  </defs>

