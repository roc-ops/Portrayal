<svg xmlns="http://www.w3.org/2000/svg" width="205mm" height="44mm" viewBox="0 0 205 44">
  <!-- DCP-F-A22 front face, 205 x 44 (datasheet so-ds-dcp-f-a22-r1.3, whose
       "44 x 205 x 270mm (WxDxH)" labels are transposed exactly as the DCP-404's
       are). Same footprint as smartoptics/dcp-404@1 in all three axes.

       THE PORTS ARE NOT DRAWN HERE - they are composed by the contract: two
       common/rj45-eth, two common/lc-duplex-adapter (EDFA and OCM), two std/sfp,
       and two PPM bays. Sizes come from those parts and NOT from the stencil,
       which draws its optical adapters SC-sized at ~10mm pitch against a
       datasheet that says LC.

       LAYOUT ORDER CAME FROM A PHOTOGRAPH. a22.gif draws one stacked pair of
       openings and brackets it twice, SFP on the left and PPM on the right;
       dcp-f-a22.jpg shows they are two separate groups, the SFP cages between the
       OCM and the PPM field and the bays at the right-hand end.

       THE VENT ROW STOPS AT THE PPM FIELD, and the master draws it further. Two
       19.5 bays stacked take 39 of the 44 height, leaving 5 for margins and none
       for a band above them - so a row running the full width cannot be what the
       metal does. The master's y is not trustworthy here in any case: its
       faceplate box has an aspect of 3.52 against the real 4.659, so x was scaled
       on 205 and y on 44, never on one factor. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f55"/>
      <stop offset="0.22" stop-color="#33383d"/>
      <stop offset="1" stop-color="#1c1f22"/>
    </linearGradient>
    <linearGradient id="topband" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3035"/>
      <stop offset="1" stop-color="#1a1d20"/>
    </linearGradient>
  </defs>

  <!-- TWO BOXES WELDED AT 147.3, NOT ONE PLATE WITH A PROFILE. The left block's
       top slopes back to the chassis, the right block is square to its top edge,
       and no single `profile-y` can say that - it reads down the height and knows
       nothing about x. So the face is two sibling groups that abut on the PPM
       field's left edge, each carrying its own relief.

       Square on the right is not a preference. ppm-1 opens at y 2.5 and the ramp
       runs to 8.9, so a ramp over this end would cut through the top 6.4 of bay 1;
       the metal has to stand full height for a module to slide into it.

       EACH GROUP WRAPS EVERYTHING THAT RIDES ON IT, because `out` extrudes the
       node's OWN ART as a height field. On a bare plate rect it extrudes a slab
       and leaves every mark inside it at the panel plane, which is what left
       smartoptics/dcp-404@1 blank in 3D.

       `body` stays as the wrapper the two sit in. It carries no relief of its own -
       each block declares its own - but keeping the id means this restructure adds
       nodes and removes none, so nothing addressing the face by name breaks. -->
  <g id="body">
    <g id="body-ramp">
      <path id="plate-ramp" fill="url(#plate)"
            d="M 1.2 0 H 147.3 V 44 H 1.2 A 1.2 1.2 0 0 1 0 42.8 V 1.2 A 1.2 1.2 0 0 1 1.2 0 Z"/>
      <!-- OUTER EDGES ONLY. Stroking each block's whole outline draws the weld: two
           0.3 strokes meeting at 147.3 make a dark line down the middle of a plate
           that has no seam in it. So each block strokes an OPEN path along the edges
           it actually has, and the two together outline the 205 x 44 shell. -->
      <path id="edge-ramp" fill="none" stroke="#111417" stroke-width="0.3"
            d="M 147.3 0 H 1.2 A 1.2 1.2 0 0 0 0 1.2 V 42.8 A 1.2 1.2 0 0 0 1.2 44 H 147.3"/>

      <rect id="ramp-band" x="0" y="0" width="147.3" height="8.9" rx="1.2" fill="url(#topband)"/>
      <g id="vent-top" fill="#0a0c0e">
        <polygon points="14.00,5.000 15.30,4.554 17.90,4.554 19.20,5.000 17.90,5.446 15.30,5.446"/>
        <polygon points="20.50,6.900 21.80,6.454 24.40,6.454 25.70,6.900 24.40,7.346 21.80,7.346"/>
        <polygon points="27.00,5.000 28.30,4.554 30.90,4.554 32.20,5.000 30.90,5.446 28.30,5.446"/>
        <polygon points="33.50,6.900 34.80,6.454 37.40,6.454 38.70,6.900 37.40,7.346 34.80,7.346"/>
        <polygon points="40.00,5.000 41.30,4.554 43.90,4.554 45.20,5.000 43.90,5.446 41.30,5.446"/>
        <polygon points="46.50,6.900 47.80,6.454 50.40,6.454 51.70,6.900 50.40,7.346 47.80,7.346"/>
        <polygon points="53.00,5.000 54.30,4.554 56.90,4.554 58.20,5.000 56.90,5.446 54.30,5.446"/>
        <polygon points="59.50,6.900 60.80,6.454 63.40,6.454 64.70,6.900 63.40,7.346 60.80,7.346"/>
        <polygon points="66.00,5.000 67.30,4.554 69.90,4.554 71.20,5.000 69.90,5.446 67.30,5.446"/>
        <polygon points="72.50,6.900 73.80,6.454 76.40,6.454 77.70,6.900 76.40,7.346 73.80,7.346"/>
        <polygon points="79.00,5.000 80.30,4.554 82.90,4.554 84.20,5.000 82.90,5.446 80.30,5.446"/>
        <polygon points="85.50,6.900 86.80,6.454 89.40,6.454 90.70,6.900 89.40,7.346 86.80,7.346"/>
        <polygon points="92.00,5.000 93.30,4.554 95.90,4.554 97.20,5.000 95.90,5.446 93.30,5.446"/>
        <polygon points="98.50,6.900 99.80,6.454 102.40,6.454 103.70,6.900 102.40,7.346 99.80,7.346"/>
        <polygon points="105.00,5.000 106.30,4.554 108.90,4.554 110.20,5.000 108.90,5.446 106.30,5.446"/>
        <polygon points="111.50,6.900 112.80,6.454 115.40,6.454 116.70,6.900 115.40,7.346 112.80,7.346"/>
        <polygon points="118.00,5.000 119.30,4.554 121.90,4.554 123.20,5.000 121.90,5.446 119.30,5.446"/>
        <polygon points="124.50,6.900 125.80,6.454 128.40,6.454 129.70,6.900 128.40,7.346 125.80,7.346"/>
        <polygon points="131.00,5.000 132.30,4.554 134.90,4.554 136.20,5.000 134.90,5.446 132.30,5.446"/>
        <polygon points="137.50,6.900 138.80,6.454 141.40,6.454 142.70,6.900 141.40,7.346 138.80,7.346"/>
      </g>

      <g id="brand-silkscreen" font-family="sans-serif">
        <text id="brand" x="4.7" y="14.1" font-size="3.4" fill="#eef1f4">smartoptics</text>
        <text id="model" x="4.7" y="18.4" font-size="2.4" fill="#b9bfc5">DCP-F-A22</text>
      </g>

      <g id="caption-silkscreen" font-family="sans-serif" text-anchor="middle">
        <text id="caption-power" x="8.68" y="40.6" font-size="1.9" fill="#dfe4e8">Power</text>
        <text id="caption-status" x="17.79" y="40.6" font-size="1.9" fill="#dfe4e8">Status</text>
        <text x="37.8" y="21.9" font-size="2.1" fill="#e8ecef">ETH1</text>
        <text x="60.2" y="21.9" font-size="2.1" fill="#e8ecef">ETH2</text>
        <text x="94.68" y="21.9" font-size="2.1" fill="#e8ecef">EDFA</text>
        <text x="120.58" y="21.9" font-size="2.1" fill="#e8ecef">OCM</text>
        <!-- A CAPTION CANNOT SIT ON A SLOPE. This read y 8.2, inside the ramp, and
           in 3D it lay on the bevel facing the ceiling. It moves into the 4mm the
           two cages leave between them, which is off the ramp AND keeps this
           face's habit of captioning a port from just above it. -->
        <text x="138.0" y="23.0" font-size="2.1" fill="#e8ecef">SFP</text>
      </g>

      <g id="port-caption-boxes">
        <rect x="88.08" y="36.0" width="13.2" height="2.7" rx="0.3" fill="#eef0f2"/>
        <rect x="113.98" y="36.0" width="6.6" height="2.7" rx="0.3" fill="#eef0f2"/>
      </g>
      <g id="txrx-silkscreen" font-family="sans-serif" text-anchor="middle">
        <text x="91.4" y="38.0" font-size="1.9" fill="#1c1f22">Tx</text>
        <text x="97.9" y="38.0" font-size="1.9" fill="#1c1f22">Rx</text>
        <text x="117.3" y="38.0" font-size="1.9" fill="#1c1f22">Tx</text>
      </g>
    </g>

  <!-- the square end. Its plate meets the ramp's at 147.3 with both edges cut
       straight, so the two abut without a seam and without either rounding into
       the other; only the outer corners carry the shell's radius.

       The two PPM bays. A seated module nests under the element whose id matches
       its bay, so these openings must exist for the bay to hold anything. -->
    <g id="body-square">
      <path id="plate-square" fill="url(#plate)"
            d="M 147.3 0 H 203.8 A 1.2 1.2 0 0 1 205 1.2 V 42.8 A 1.2 1.2 0 0 1 203.8 44 H 147.3 Z"/>
      <path id="edge-square" fill="none" stroke="#111417" stroke-width="0.3"
            d="M 147.3 0 H 203.8 A 1.2 1.2 0 0 1 205 1.2 V 42.8 A 1.2 1.2 0 0 1 203.8 44 H 147.3"/>
      <rect id="ppm-1" x="147.3" y="2.5" width="55.4" height="19.5" rx="0.8"
            fill="#101315" stroke="#0a0c0e" stroke-width="0.25"/>
      <rect id="ppm-2" x="147.3" y="22.0" width="55.4" height="19.5" rx="0.8"
            fill="#101315" stroke="#0a0c0e" stroke-width="0.25"/>
    </g>
  </g>
</svg>
