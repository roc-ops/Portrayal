  <!-- DCP-1203 front face, 205 x 44 (datasheet so-ds-dcp-1203-r1.5), measured off
       the datasheet's product render at 4.532 px/mm across and 4.583 down.

       `body` IS A GROUP WRAPPING THE WHOLE FACE, as on smartoptics/dcp-404@1 and
       for the same reason: relief builds a height field with the node's own art
       on it, so everything printed or punched has to be inside the node.

       THE TOP 10.4 IS THE BAND THAT SLOPES BACK TO THE LID. On this unit's render
       it is plain: no hexagons and no slot row along the fold, where the DCP-404
       carries both. It is drawn as the plate's own gradient and nothing else. -->
