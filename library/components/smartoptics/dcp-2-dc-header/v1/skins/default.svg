<svg xmlns="http://www.w3.org/2000/svg" width="11.0mm" height="26.0mm" viewBox="0 0 11.0 26.0">
  <!-- The three-cell DC power connector of the DCP-2-PSU-DC-FB supply seen from its mating face: a metal shell, a black insulator and three
       gold-coloured cells in a column, a small one, a large one and a small one from the top down. Shapes and colours are estimates; the
       manual's figure is an oblique photograph. -->
  <rect id="body" x="0" y="0" width="11.0" height="26.0" rx="0.9" fill="#6b6f70" stroke="#3d4247" stroke-width="0.35"/>
  <rect id="insulator" x="1.4" y="1.6" width="8.2" height="22.8" rx="0.6" fill="#15181a" stroke="#585d63" stroke-width="0.28"/>
  <g id="cells" fill="#c9a227" stroke="#8a6f14" stroke-width="0.22">
    <circle cx="5.5" cy="5.5" r="1.5"/>
    <ellipse cx="5.5" cy="13.0" rx="2.4" ry="2.0"/>
    <circle cx="5.5" cy="20.5" r="1.5"/>
  </g>
</svg>
