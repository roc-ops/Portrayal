<svg xmlns="http://www.w3.org/2000/svg" width="11.0mm" height="26.0mm" viewBox="0 0 11.0 26.0">
  <!-- The cable connector of the DCP-2-PSU-DC-FB supply seen from the wire side, seated: a dark body at the outline of the connector it seats in
       and one wire entering each of the three ways. No document draws it; the shapes and the neutral grey of the wires are estimates. -->
  <rect id="body" x="0" y="0" width="11.0" height="26.0" rx="0.9" fill="#3d4247" stroke="#262a2e" stroke-width="0.35"/>
  <circle id="wire-1" cx="5.5" cy="5.5" r="1.7" fill="#8d9399" stroke="#4a4d52" stroke-width="0.12"/>
  <circle id="wire-2" cx="5.5" cy="13.0" r="1.7" fill="#8d9399" stroke="#4a4d52" stroke-width="0.12"/>
  <circle id="wire-3" cx="5.5" cy="20.5" r="1.7" fill="#8d9399" stroke="#4a4d52" stroke-width="0.12"/>
</svg>
