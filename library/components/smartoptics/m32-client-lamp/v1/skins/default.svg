<svg xmlns="http://www.w3.org/2000/svg" width="13.2mm" height="2mm" viewBox="0 0 13.2 2">
  <!-- The DCP-M32's per-channel client indicator. THE CAPTION IS THE LAMP: a
       white diffuser carrying its own Tx/Rx lettering, dark when the channel is
       dark and green when the monitor sees light (DCP-M UM s3.6.4).

       Drawn unlit, which is what every photograph of this unit shows - in those
       frames Power and Status are green while every client strip is white, so
       the channels are dark rather than the lamps absent. -->
  <rect id="lamp" x="0" y="0" width="13.2" height="2" rx="0.25"
        fill="var(--led-color, #eef0f2)"/>
  <g id="caption-silkscreen" font-family="sans-serif" text-anchor="middle">
    <text x="3.3" y="1.55" font-size="1.5" fill="#1c1f22">Tx</text>
    <text x="9.9" y="1.55" font-size="1.5" fill="#1c1f22">Rx</text>
  </g>
</svg>
