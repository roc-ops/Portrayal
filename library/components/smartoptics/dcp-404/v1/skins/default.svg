<svg xmlns="http://www.w3.org/2000/svg" width="205mm" height="44mm" viewBox="0 0 205 44">
  <!-- `body` IS A GROUP WRAPPING THE WHOLE FACE, not the plate rect, and that is
       load-bearing. relief's profile path builds "a height field with the node's
       art on it": if `body` names only the gradient rect, the raised surface is
       textured with a bare gradient and every vent and silkscreen line vanishes -
       which is what 3D showed. Naming the group puts the entire face on the
       height field, the way the R740xd bezel's node carries its honeycomb.
       The plate rect underneath is `plate`. -->
  <!-- DCP-404 front face, 205 x 44 (datasheet so-ds-dcp-404-r1.8), measured off
       the vendor product render at 4.610 px/mm across, 4.841 down.

       EVERY VENT CELL IS A HEXAGON, point up and point down with flat edges
       either side, and every group sits in a lighter rounded recess. The first
       cut of this part drew them as circles and ovals with no recess, which is
       what the Visio stencil shows and is not what the product does.

       THE TWO EDGE ROWS ARE CENTRED, and were not. Both ran 5.20 to 205.30 on a
       205 face - a 5.20 inset on the left and 0.30 PAST the edge on the right, so
       the last cell of each hung off the module and wrapped. The angled rows were
       already centred (3.80/4.40 and 8.40/9.00), which is what says the 5.20 was
       a generator that stepped until it ran out rather than a chosen margin. All
       22 cells are kept and the rows shifted 2.75 left, giving 2.45 each side.

       THE ANGLED BAND'S CELLS ARE DRAWN AT THE TRUE FORESHORTENING, 0.230 -
       squashed to 23% of a regular hexagon's height. That looks extreme in a flat
       reading of this file and it is what a front elevation of this surface shows:
       the band is 10.4 tall in projection and 45.21 along the slope.
       IT IS ALSO WHAT MAKES 3D RIGHT, which is the part worth knowing. relief's
       height field maps the texture linearly in face-y, so the slope stretches it
       by 45.21/10.4 = 4.35x - exactly the inverse. Cells drawn at 0.230 come out
       REGULAR on the sloped surface. They were previously drawn at 0.561, a squash
       eyed off a perspective render rather than computed, and rendered 2.44x too
       tall - stretched ovals lying along the slope.
       One number serves both views because the two distortions are reciprocal. If
       the slope depth ever changes, this squash must change with it.

       THE ANGLED BAND IS DRAWN FLAT IN THIS FACE. The top of the real face
       slopes back to the lid, so its hexagons foreshorten to squashed cells;
       they are drawn squashed here because foreshortening is what a front
       elevation shows. The slope ITSELF is expressed, in the contract, as
       `profile-y` on the body relief feature - see provenance/slope there.
       (An earlier version of this comment said the vocabulary had no term for
       a slope. It has: `profile` across the width and `profile-y` down the
       height, the same keys the R740xd bezel uses.) -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4247"/>
      <stop offset="0.26" stop-color="#23272b"/>
      <stop offset="1" stop-color="#191c1f"/>
    </linearGradient>
  </defs>
  <g id="body">
    <rect id="plate" x="0" y="0" width="205" height="44" rx="1.0" fill="url(#plate)" stroke="#0d0f11" stroke-width="0.3"/>

