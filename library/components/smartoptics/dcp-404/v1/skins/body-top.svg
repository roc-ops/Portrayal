<svg xmlns="http://www.w3.org/2000/svg" width="205.0mm" height="270.0mm" viewBox="0 0 205.0 270.0">
  <!-- The lid, from the vendor product render - a light, heavily mottled
       surface. WHETHER THAT MOTTLE IS A FINISH OR A PERFORATION IS NOT KNOWN:
       no source shows the lid square-on or names it, and at the angle the
       render gives it a fine perforation and a textured paint look the same.
       It is drawn as a texture, which is the reading that invents least - a
       perforated lid would want real holes and an airflow claim behind them. -->
  <defs>
    <pattern id="mottle" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#a9b0b7"/>
      <circle cx="1.5" cy="1.5" r="1.15" fill="#bcc3ca"/>
      <circle cx="4.5" cy="4.5" r="1.15" fill="#9aa1a8"/>
      <circle cx="4.6" cy="1.4" r="0.75" fill="#b3bac1"/>
      <circle cx="1.4" cy="4.6" r="0.75" fill="#a2a9b0"/>
    </pattern>
  </defs>
  <rect id="lid" x="0" y="0" width="205.0" height="270.0" fill="url(#mottle)" stroke="#767d84" stroke-width="0.4"/>
  <!-- the front edge folds down to meet the angled band -->
  <rect id="front-fold" x="0" y="0" width="205.0" height="3.2" fill="#8f969d"/>
</svg>
