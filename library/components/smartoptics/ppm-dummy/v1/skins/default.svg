<svg xmlns="http://www.w3.org/2000/svg" width="55.4mm" height="19.5mm" viewBox="0 0 55.4 19.5">
  <!-- PPM-DUMMY, 55.4 x 19.5 - the cover plate for an empty PPM bay.

       ds-ppm-r4.0: "The 'PPM-DUMMY' is a cover plate for slots that are not
       equipped with a PPM module." No ports. The datasheet gives every other PPM
       a spec table with a Connector type row and gives this one none, which is
       evidence rather than a gap.

       DRAWN PLAIN ON PURPOSE. There is no stencil master for this part - the only
       one of the nine PPMs without one - and the manual's figure of it resolves no
       features. A plate with nothing on it is what the sources support, and
       inventing detail here would be inventing it entirely. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f55"/>
      <stop offset="0.35" stop-color="#33383d"/>
      <stop offset="1" stop-color="#22262a"/>
    </linearGradient>
  </defs>

  <rect id="body" x="0" y="0" width="55.4" height="19.5" rx="1.0"
        fill="url(#plate)" stroke="#15181a" stroke-width="0.25"/>

  <g id="part-silkscreen" font-family="sans-serif">
    <text x="53.4" y="9.75" font-size="1.9" fill="#dfe3e7" text-anchor="middle"
          transform="rotate(90 53.4 9.75)">PPM-DUMMY</text>
  </g>
</svg>
