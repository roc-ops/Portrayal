format: 1
kind: module
name: psu-1100w-dc-14g
version: 1.0.0
class: psu
behaviour: fills
profile: server
description: >-
  1100 W -48 V DC hot-plug power supply for a 14th-generation PowerEdge - a
  terminal-block input, a fan under a strap handle, and a status lamp of its own
attrs:
  power-output-w: 1100
  form-factor: crps
  inlet: dc-terminal
  efficiency: gold
provenance:
  it-is-a-different-faceplate-not-a-wattage-skin: >-
    THE INPUT IS A TERMINAL BLOCK, so the casting differs and no skin can express
    it - the same rule that split the C20 supplies out. Three things change from
    the AC unit: the IEC inlet becomes dell/dc-terminal-6ryj9, the green EPP disc
    becomes a black label with the wattage in white, and the indicator moves off
    the lever to its own mark at the upper left. The AC unit's light latch bar is
    simply absent.
    THE STRAP HANDLE IS BACK, AND THE ARGUMENT FOR DROPPING IT ONLY HELD IN 2D.
    It was left out because a flexible part has no fixed pose and because drawn
    solid it wipes out the only text on the face. Both true, and both about a
    flat drawing: in 3D its ABSENCE is the bigger error, since a handle you grab
    is the most three-dimensional thing on this supply.
    So it is drawn TRANSLUCENT and declared PROUD. The flat view shows the
    wattage through it; `relief` stands it 6 mm off the face, where it occludes
    by geometry rather than by ink and the label reads from any angle that is
    not straight on. The translucency is a DRAWING CONVENTION and not a claim
    about the material - the strap is opaque black webbing.
    It runs LOWER-LEFT TO UPPER-RIGHT across the fan.
    EPP IS AN AC-SUPPLY MARK and this unit does not carry it, which is why the
    disc is not simply recoloured.
  the-indicator-stopped-being-the-latch: >-
    On the AC supply the ISM calls the release lever "an illuminated translucent
    handle that serves as an indicator" - one part doing both jobs, which is why
    that lever carries `var(--led-color)`. This supply separates them: the latch
    is plain amber plastic and the lamp is a round indicator in the corner. So
    the colour variable moved with the function, and a device lighting this
    supply lights the thing that actually lights.
    THE LAMP AND ITS LABEL ARE TWO THINGS. A first pass drew one rounded
    rectangle with the waveform on it, which makes the mark read as part of the
    lit surface; the supply has a round lamp with the waveform printed on the
    metal beside it. Only the lamp carries `var(--led-color)`.
    PLACED FROM DESCRIPTION, NOT FROM THE PHOTOGRAPHS - at about 1.6 px/mm they
    cannot separate a 3 mm lamp from the screw next to it, so the corner is
    right and the millimetres are not.
  the-region-and-the-class: >-
    UNRESTRICTED, UNLIKE THE OTHER DC OPTIONS. The R740 and R740xd Technical
    Guide marks the 750 W Mixed Mode HVDC and the 750 W Mixed Mode 240 V DC as
    "for China only" and the 1100 W 380 V DC as "China and Japan only"; this one
    is listed simply as "Gold 1100W -48VDC" with no region.
    IT IS GOLD, NOT PLATINUM, and both the ISM and Dell's online
    technical-specifications page omit the class for it - the technical guide is
    the only source held that states it.
  what-the-photographs-can-and-cannot-say: >-
    photo-measured, from a source named rather than hidden. The operator's
    face-on views are 140 px across the whole supply, about 1.6 px/mm, so the DC
    terminal, the lamp, the strap and the fan label are PROPORTIONS of the
    supply's own 86.3 x 39.1 rather than readings. The body, latch, fan and
    screws are the AC supply's, off ISM figure 8, and are not affected.
    Sold as 5G4WK, 02RN7, C7JTF and Y1MGX, model E1100D-S0; the -48 V unit is
    rated 32 A.
  what-the-vendor-cad-settles-and-what-it-cannot: >-
    THE SHAPES ARE CONFIRMED AND THE PROTRUSIONS ARE NOT, and the reason is the
    pose. Dell's interactive service model for this machine
    (r740xd, 740XD_Powersupply_Unit-1.001) draws the supply with its handle
    SWUNG OPEN, because the guide is a removal procedure - which is why the unit
    boxes 132.6 wide against a body that is 86.3. Anything measured from the
    face in that pose is measuring an open handle.
    CONFIRMED: the withdrawal handle really is a U standing off the faceplate,
    which is what the side view shows and what `uhandle` was chosen for; and the
    release lever really is a Z - a rounded head at the rear, a dogleg, and a
    long shaft running back into the supply. Both were described from the
    hardware before the model was read, and both are there.
    NOT SETTLED: how far either stands proud when the supply is SEATED and the
    handle closed. 19.05 and 25.4 stay as they are - operator estimates, marked
    `estimated` - until a guide poses this supply home. A number taken from an
    open handle would be `vendor-cad` and wrong, which is worse than an estimate
    that says it is one.
    ALSO READ, and not applied: the supply's own body measures 86.3 x 39.1 x
    195.5 against the 87.5 x 41.8 this part carries from ISM figure 8. Those are
    close enough to be the same supply and far enough apart to be worth
    re-reading; the figure is this device's own source and stays until something
    settles it.
  the-latch-is-a-z-and-we-see-its-end: >-
    CARRIED FROM THE AC SUPPLY - the mechanism is the same one, and the
    operator's photographs show the same orange lever in the same place. What
    differs is that here it does NOT light: see the indicator note above.
    THE ORANGE RECTANGLE IS THE TOP OF A LEVER, NOT A TAB. Behind the face it
    runs about three-quarters of an inch out, turns to run PARALLEL to the
    faceplate across to the inlet bezel, and turns again back into the supply -
    a Z. Pushed sideways the middle leg sweeps over the coupler and traps the
    cord; pulled back it releases the cord and the supply together, which is why
    it is the same part as the handle you withdraw the unit by. It is roughly
    three-eighths to half an inch across that middle leg.
    RELIEF CAN ONLY SAY HOW FAR IT STANDS OFF. `out: 19.05` carries the first
    leg and nothing expresses the other two, so the shape is written here rather
    than approximated by a primitive that does not mean it.
  the-latch-travels-in-two-slots: >-
    measured - ISM figure 8 at 2.5991 px/mm, supply-local x 1.00..5.30 with one
    slot at y 14.00 and one at 27.80, each 2.80 tall. They are OPENINGS, not
    paint: they are what the lever's leg moves through, and without them the
    orange reads as a coloured rectangle rather than the end of a mechanism.
  size: >-
    photo-measured from ISM figure 8, which passes Gate 1 at 0.38% against a
    434 x 86.8 rear face - the best-scaled source held for this machine. THE
    WIDTH IS A PITCH RATHER THAN AN OUTLINE, which is the more reliable of the
    two: the handles sit about 90 mm apart on both rear figures. WIDTH IS THEN
    CONSTRAINED BY WHAT ELSE IS ON THE FACE: riser 2's vent field stops at
    x 251.4, so the first supply cannot begin before it, and the second must end
    at the 434 edge. 88.7 each from 256.6 is what fits, and it sits inside the
    handle pitch's own spread (89.9 on one figure, 90.5 on the other).
    HEIGHT IS 41.8 AND THE MODULE TOP IS y 45.0, read off the R740 ISM figure 9
    - "Back view of three riser system" - which passes Gate 1 at 0.26% and is
    the best-scaled rear source held. An earlier draft made it 43.4 by halving
    the face, which is a derivation and not a measurement.
  output: >-
    the figure prints "EPP 1100W 94.5% efficiency" on the fan label of both
    supplies, which is where 1100 comes from. THE R740xd TAKES THIRTEEN DIFFERENT
    SUPPLIES - the Information Update tech sheet (Rev 2, Nov 2022) lists 495 W
    through 2600 W across AC, DC, HVDC and Mixed Mode - so this part is one of
    them and not "the" R740xd supply. The others are not modelled and the device
    accepts this one.
  power: >-
    power-output-w 1100 is READ OFF THE PART'S OWN LABEL in ISM figure 8, which
    prints "EPP 1100W 94.5% efficiency" on the fan of both supplies. It is a
    RATING and not a draw - this class states output and never a draw key,
    because the two are opposite signs of one unit.
    NO AMBIENT QUALIFIES IT. Vendor tables commonly print the same supply at 25,
    40 and 55 C and the figures differ by enough to matter; the label in this
    figure carries one number and no temperature, so one number is recorded and
    no rung is invented to fill the sentence. The Information Update tech sheet
    gives this family's heat dissipation (4100 BTU/hr for 1100 W AC) and its
    current draw, also without an ambient.
  inlet: >-
    COMPOSED, NOT DRAWN, AND THAT TOOK THREE WRONG DRAFTS TO REACH. std/c14-inlet
    already exists - 28.0 x 20.0, the panel cutout from SCHURTER 6100-3 against
    IEC 60320-1 - and NINE other supplies in this library compose it. This part
    drew its own instead and got it wrong three separate ways: first as a rounded
    rectangle with three slots, which reads as a BS 1363 outlet; then chamfered on
    the top corners like an upright C14; then re-chamfered to the right.
    The last of those was the correct ORIENTATION and still the wrong practice.
    A connector with a standard, a datasheet and an existing part is never
    something to redraw from a photograph - the photograph can only say which way
    up it goes, which here is `rotate: 90`.
  handle-is-the-lamp: >-
    AND IT IS THE WITHDRAWAL HANDLE, NOT THE RELEASE LEVER. Two parts of this
    supply were both being called a handle - the orange Z you push sideways to
    release the unit, and the U in the middle you pull it out by - so the lamp
    with all five of Dell's states on it sat on the orange lever, and the thing
    that actually glows green in a rack was inert. mkpsu.py had it written down
    as settled ("THE HANDLE IS STILL THE INDICATOR ... and that is the orange
    lever"), which is how it survived. The skin's lever node is named `lever`
    now so the two cannot be confused by name again, and the lamp carries the
    grip's own box, 33.04, 3.65, 8.24 x 34.64.
    NOT A LAMP BESIDE A HANDLE. ISM: "AC power supply units (PSUs) have an
    illuminated translucent handle that serves as an indicator." So the handle
    carries the state class, in the same construction as the drive carrier's
    glyphs and the left control panel's - three places on this chassis where the
    thing you look at is the thing that lights.
    THE DC SUPPLY IS DIFFERENT and is not this part: the ISM says "The DC PSUs
    have an LED that serves as an indicator", a separate lamp rather than a lit
    handle, so a DC variant is a different component and not a skin of this one.
  face: >-
    photo-measured, and only to the level figure 8 resolves at 7.2074 px/mm: the
    handle, the C14 inlet, the release latch and the fan aperture are placed from
    it; the fan blade count, the label text and the inlet's internal detail are
    drawn rather than measured. No vector master for a 14G supply is held - the
    stencil's PSU masters are 15G and later wattages (700, 800, 1100, 1400, 1800,
    2400, 2800 W on C14 through C22) and none of them is this unit.
  depth: >-
    estimated. A CRPS-form supply is around 185 mm deep and no document held here
    states it for this one. Not recorded rather than guessed.
size: {w: 86.3, h: 39.1}
relief:
  wall: '#3a4045'
  features:
  - node: handle
    out: 6.0
    color: '#17191d'
    confidence: estimated
    source: >-
      THE ONE NUMBER HERE THAT A POSE CANNOT SETTLE. The strap is woven webbing
      and how far it stands off the face depends on how it is lying; the
      operator's photographs show it slack over the fan rather than pulled. 6.0
      is a grab-handle's clearance and is an estimate saying so, not a reading.
      It exists so the 3D view puts the strap in front of the fan, which is the
      whole reason the flat view can afford to draw it translucent.
  # ALL FOUR ARE THE OPERATOR'S READINGS OFF THE HARDWARE, which is a better
  # source than a photograph for how far something stands off a face: a
  # straight-on figure cannot show protrusion at all. `estimated` says so.
  - node: lever
    out: 19.05
    color: '#e8a33d'
    confidence: estimated
    source: >-
      operator, from the machine - the orange release lever stands about
      three-quarters of an inch proud. It is pushed sideways to lock the cord
      in, so it has to stand off the face far enough to get a thumb on, and a
      flat tab would not work.
  - node: screw-1
    dome: 1.6
    color: '#c3c8cd'
    confidence: estimated
    source: operator - rounded head, about a sixteenth proud
  - node: screw-2
    dome: 1.6
    color: '#c3c8cd'
    confidence: estimated
    source: operator - rounded head, about a sixteenth proud
  - node: screw-3
    dome: 1.6
    color: '#c3c8cd'
    confidence: estimated
    source: operator - rounded head, about a sixteenth proud
  - node: screw-4
    dome: 1.6
    color: '#c3c8cd'
    confidence: estimated
    source: operator - rounded head, about a sixteenth proud
parts:
  # THE DC INPUT IS A TERMINAL BLOCK, NOT AN INLET, which is the whole reason
  # this is a separate part rather than a wattage skin. dell/dc-terminal-6ryj9
  # is the receptacle; Dell part 6RYJ9 is the block that plugs into it.
  # `behind` for the same reason the AC inlet uses it: the body carries the
  # knockout, so without this the terminal is drawn and then painted over.
  - {ref: dell/dc-terminal-6ryj9@1, id: terminal, at: [10.0, 5.5], behind: true}
elements:
  lamp-status:
    at: [6.05, 1.85]
    size: [2.70, 2.70]
    class: led
    states: ['off',
             {name: 'ok', color: '#22c55e'},
             {name: fault, color: '#eab308', behavior: {mode: blinking, rate: 1}},
             {name: updating, color: '#22c55e',
              behavior: {mode: blinking, rate: 1}},
             {name: mismatch,
              behavior: {mode: sequence,
                         phases: [{color: '#22c55e', seconds: 0.125},
                                  {seconds: 0.125},
                                  {color: '#22c55e', seconds: 0.125},
                                  {seconds: 0.125},
                                  {color: '#22c55e', seconds: 0.125},
                                  {seconds: 0.125},
                                  {color: '#22c55e', seconds: 0.125},
                                  {seconds: 0.125},
                                  {color: '#22c55e', seconds: 0.125},
                                  {seconds: 2.0}]}}]
    description: >-
      The translucent handle, lit from within. ISM table 12 entire: green - a
      valid source is connected and the supply is operational; blinking amber - a
      problem with the supply; not illuminated - no power connected; blinking
      green - firmware is being updated.
      `mismatch` IS WHY THE SEQUENCE MECHANISM EXISTS, for the fourth time on
      this chassis: Dell's wording is "the PSU handle blinks green five times at
      a rate of 4 Hz and turns off", which gives the phase length exactly -
      4 Hz is 0.125 s lit and 0.125 s dark - and then a dark tail that the
      article does not time. The five blinks and their rate are Dell's; the
      2 second tail is this library's reading of "and turns off".
      NO RATE IS PUBLISHED for the amber fault or the firmware blink, so 1 Hz is
      a reading and not a figure - unlike the mismatch, where 4 Hz is stated.
  fan:
    at: [43.03, 1.80]
    size: [33.0, 33.8]
    class: vent
    description: the exhaust aperture
skins: [default]
