<svg xmlns="http://www.w3.org/2000/svg" width="86.3mm" height="39.1mm" viewBox="0 0 86.3 39.1">
  <!-- 1100 W -48 V DC supply, 14G PowerEdge. A DIFFERENT FACEPLATE FROM THE AC
       UNIT, not a wattage skin: the IEC inlet is replaced by a DC terminal
       receptacle, the illuminated lever gives up its indicator role to a
       separate lamp at the upper left, the latch bar is replaced by a black
       strap running diagonally across the fan, and the green EPP disc becomes a
       black label with the wattage in white.
       THE BODY, LATCH, FAN AND SCREWS ARE THE AC SUPPLY'S, measured off ISM
       figure 8. Everything DC-specific is placed from the operator's
       photographs, whose largest face-on view is 140 px across the whole
       supply - about 1.6 px/mm. That is enough to say what is there and roughly
       where, and not enough to dimension anything.
       The shared geometry, from the AC supply: re-read off ISM figure 8 at 2.5991
       px/mm. The FAN OPENING IS AN OCTAGON with a screw at each cut corner
       and an X of spokes running in to the hub; it was a rounded rectangle
       with a circle in it, which reads as a fan at a glance and as a
       different part up close. The label was 9.14 left of where it sits -
       three-eighths of an inch, called by eye before it was measured. -->
  <!-- the body carries the same knockout as the bezel. `behind` puts a
       composed part under the WHOLE skin, base plate included, so
       without this hole the inlet is drawn and then painted over. -->
  <path id="body" fill-rule="evenodd" d="M0.2 1.2 a1 1 0 0 1 1 -1 h83.90 a1 1 0 0 1 1 1 v36.70 a1 1 0 0 1 -1 1 h-83.90 a1 1 0 0 1 -1 -1 Z M10.0 5.5 h31.0 v27.5 h-31.0 Z" fill="#8d949c" stroke="#5f666d" stroke-width="0.4"/>
  <!-- THE LEVER IS JUST A LEVER HERE, and that is the difference worth
       naming. On the AC supply the ISM calls it "an illuminated translucent
       handle that serves as an indicator" - one part doing both jobs, which is
       why that one carries the LED colour variable. This supply separates them:
       the lamp is its own mark at the upper left, so the colour variable moved
       there and this is plain amber plastic. -->
  <path id="lever" d="M7.47 12.99 h3.20 a2.6 2.6 0 0 1 2.6 2.6 v10.47 a2.6 2.6 0 0 1 -2.6 2.6 h-3.20 Z"
        fill="#e8a33d" stroke="#9a6a1e" stroke-width="0.35"/>
  <!-- THE SLOTS THE LEVER TRAVELS IN, straddling the tab above and below.
       They are openings rather than paint: without them the orange reads as
       a coloured tab instead of the top of a mechanism. -->
  <rect id="latch-slot-top" x="0.4" y="12.5" width="4.3" height="2.8" rx="0.4" fill="#141719"/>
  <rect id="latch-slot-bottom" x="0.4" y="26.3" width="4.3" height="2.8" rx="0.4" fill="#141719"/>
  <!-- THE LEVER'S LEG, between the two slots. It is the same metal as the
       face and so the same colour, which left the holes reading and the part
       moving through them invisible. A faint outline is the whole of the fix. -->
  <rect id="latch-leg" x="0.4" y="15.30" width="4.3" height="11.00" rx="0.4" fill="#9aa1a8" stroke="#7a8189" stroke-width="0.3"/>
  <!-- the fan opening: an octagon, four cut corners, four screws -->
  <path id="fan" d="M51.63 1.80 H71.93 L80.53 10.40 V28.90 L72.63 36.80 H51.63 L43.03 28.20 V10.40 Z" fill="#141719" stroke="#41474d" stroke-width="0.4"/>
  <g stroke="#2c3237" stroke-width="1.1" fill="none" stroke-linecap="round">
    <path d="M48.19 6.96 L53.56 11.76 M75.37 6.96 L70.55 11.52 M75.79 32.06 L70.63 27.29 M48.19 31.64 L53.46 27.04"/>
  </g>
  <g><circle id="screw-1" cx="45.73" cy="3.50" r="3.1" fill="#c3c8cd" stroke="#8b9299" stroke-width="0.3"/><path d="M43.93 3.50 h3.6 M45.73 1.70 v3.6" stroke="#7b8288" stroke-width="0.55"/></g><g><circle id="screw-2" cx="78.33" cy="3.50" r="3.1" fill="#c3c8cd" stroke="#8b9299" stroke-width="0.3"/><path d="M76.53 3.50 h3.6 M78.33 1.70 v3.6" stroke="#7b8288" stroke-width="0.55"/></g><g><circle id="screw-3" cx="78.33" cy="35.10" r="3.1" fill="#c3c8cd" stroke="#8b9299" stroke-width="0.3"/><path d="M76.53 35.10 h3.6 M78.33 33.30 v3.6" stroke="#7b8288" stroke-width="0.55"/></g><g><circle id="screw-4" cx="45.73" cy="35.10" r="3.1" fill="#c3c8cd" stroke="#8b9299" stroke-width="0.3"/><path d="M43.93 35.10 h3.6 M45.73 33.30 v3.6" stroke="#7b8288" stroke-width="0.55"/></g>
  <!-- THE LAMP AND ITS LABEL ARE TWO THINGS, and drawing them as one was
       wrong. The first pass made the indicator a rounded rectangle with the
       waveform drawn ON it, so the mark appeared to be part of the lit surface.
       The supply has a ROUND lamp and, beside it, a waveform printed on the
       sheet metal - the same relationship the drive carriers have, where the
       glyph names the lamp rather than sitting inside it.
       Only the round one carries the LED colour variable; the waveform is
       silkscreen and never lights.
       PLACED FROM THE OPERATOR'S DESCRIPTION, not from the photographs. At
       about 1.6 px/mm the face-on views cannot resolve a 3 mm lamp from the
       screw beside it, so the corner is right and the millimetres are not. -->
  <g id="silkscreen-lamp" fill="none" stroke="#c9ced3" stroke-width="0.30">
    <path d="M1.50 3.20 l0.85 0 0.50 -1.35 0.65 2.65 0.50 -1.30 0.75 0"/>
  </g>
  <circle id="lamp-status" cx="7.40" cy="3.20" r="1.35"
          fill="var(--led-color, #2c3a30)" stroke="#454b51" stroke-width="0.3"/>
  <!-- THE FAN LABEL IS BLACK WITH THE WATTAGE IN WHITE, not the AC supply's
       green EPP disc. EPP is an AC-supply mark; this unit does not carry it. -->
  <circle id="fan-label" cx="62.16" cy="19.45" r="9.10" fill="#141719"
          stroke="#3a4046" stroke-width="0.4"/>
  <g id="silkscreen">
  <text id="watts" data-from="watts" x="62.16" y="21.35" font-family="sans-serif" font-size="5.4" font-weight="bold" fill="#e7ebee" text-anchor="middle">1100W</text>
  </g>
  <!-- THE WITHDRAWAL STRAP, lower-left to upper-right across the fan.
       TRANSLUCENT HERE AND PROUD IN 3D, which is the whole reason it can be
       drawn at all. Solid, it wipes out the only text on the face; absent, the
       most three-dimensional thing on the supply is missing and the face reads
       as a plain plate. So the flat view shows the wattage through it, and
       `relief` stands it 6 mm off the face where it occludes by geometry
       instead of by ink.
       THE TRANSLUCENCY IS A DRAWING CONVENTION, NOT A MATERIAL. The strap is
       opaque black webbing; nothing here claims otherwise.
       IT IS DRAWN AS THREE RAILS, not one band: a light outer, a dark body and
       a light centre. One translucent band reads over the pale label and
       disappears over the opening, because the fan is nearly the strap's own
       colour, and the outline is what survives both grounds. -->
  <g id="handle" stroke-linecap="round" fill="none">
    <path d="M47.3 32.5 L76.2 6.1"
          stroke="#7d858d" stroke-width="3.60" stroke-opacity="0.30"/>
    <path d="M47.3 32.5 L76.2 6.1"
          stroke="#17191d" stroke-width="2.90" stroke-opacity="0.42"/>
    <path d="M47.3 32.5 L76.2 6.1"
          stroke="#5d656c" stroke-width="0.8" stroke-opacity="0.35"/>
  </g>
</svg>
