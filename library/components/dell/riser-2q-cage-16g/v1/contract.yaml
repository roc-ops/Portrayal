format: 1
kind: component
name: riser-2q-cage-16g
version: 1.0.0
class: riser
profile: server
description: >-
  the riser 2Q cage of a 16th-generation 1U PowerEdge (R660) - two low-profile Gen5 windows set wider apart than riser 2A's, the vent block at the left and the latch at the right, slot numbers 1 and 2 printed on the cage
attrs:
  power-absent: not-applicable
provenance:
  power: >-
    NOT APPLICABLE - sheet metal and print; the riser that composes it carries
    the power record.
  why-this-is-its-own-part: >-
    THE METAL IS SHARED AND THE WIRING IS NOT. Dell's riser variants on this
    cage (riser 2Q) differ in which processor and PCIe generation each slot
    carries (ISM table 111), and not in anything the rear face shows - so the
    face is drawn once, here, and each variant composes it, as
    dell/riser-2-fh-plate-14g@1 does for the 14th generation.
  sources: >-
    drawing - the VisioCafe master `R660 2xPCI LP Gen5 Rear` (r660-2xpci-lp-gen5-rear-1), read on the 434 body
    at 22.24 px/mm with y scaled 0.9926 (see dell/psu-1400w-ac-60mm@1,
    provenance/stencil-scale). Facts read, art not traced.
  size: >-
    drawing - 186.50 x 19.80 from rear-face x 107.00, y 2.20: the riser's
    extent between its neighbours on the master, at the height of
    dell/riser-3-blank-16g@1, the plate riser 3's place takes without it.
  features: >-
    drawing - windows 131.80..201.80 and 213.68..283.68, the vent block 109.71..127.88, the latch 284.6..292.1. THE PRINT IS FROM THE PHOTOGRAPH, NOT THE MASTER: the StorageReview rear photograph of a real R660 with riser 2Q (photos/r660/storagereview, -01.jpg) prints a dark strip along the top of each slot with a down-pointing triangle and the slot number centred over it and GEN 5 at its right end, where the master prints 1 with a left-pointing triangle at 203.56 and 2 at 217.22. A perspective photograph, so the strip is placed on the windows and its glyphs by fraction, not measured, all in rear-face millimetres.
  numerals: >-
    drawing - THE SLOT NUMBERS ARE PRINTED ON THE RISER, NOT THE CHASSIS: the
    masters move them with the cage (the full-height risers print theirs beside
    the window with a right-pointing triangle; riser 2Q prints its numbers and
    GEN 5 on a strip over each slot, per the photograph), and the rear-storage master, which has no riser
    2, prints no 1 or 2. Glyph heights 2.5 on the masters; the font is not
    identified.
size: {w: 186.50, h: 19.80}
