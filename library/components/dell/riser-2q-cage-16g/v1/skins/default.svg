<svg xmlns="http://www.w3.org/2000/svg" width="186.50mm" height="19.80mm" viewBox="0 0 186.50 19.80">
  <!-- riser-2q-cage-16g: original art from positions measured on the VisioCafe
       master; facts read, art not traced. The windows are holes: the
       slots are `behind: true`, so a filler shows through them and this
       metal covers its ends. THE CAGE IS ONE NODE, `plate`, which the
       contract stands 20 proud by its outline: its printing and latches
       are inside it so they ride on its front, and the printed triangles
       are polygons, not paths, so they are not read as holes. -->
  <g id="plate">
  <path fill-rule="evenodd" d="M0.30 0.30 H186.20 V19.50 H0.30 Z M34.51 1.92 H90.69 V19.50 H34.51 Z M110.79 1.92 H166.97 V19.50 H110.79 Z" fill="#cfd3d7" stroke="#9aa1a8" stroke-width="0.25"/>
    <rect x="2.71" y="6.73" width="3.78" height="3.75" rx="0.3" fill="#16191c"/>
    <rect x="2.71" y="12.22" width="3.78" height="3.75" rx="0.3" fill="#16191c"/>
    <rect x="13.73" y="9.23" width="3.82" height="3.75" rx="0.3" fill="#16191c"/>
    <rect x="19.26" y="9.23" width="1.62" height="3.75" rx="0.3" fill="#16191c"/>
    <rect x="177.60" y="0.60" width="7.50" height="18.60" rx="0.3" fill="#aeb4ba"/>
    <rect x="182.71" y="8.42" width="2.43" height="5.89" rx="0.3" fill="#16191c"/>
    <g id="silkscreen">
      <rect x="24.80" y="0.30" width="70.00" height="1.75" fill="#24282c"/>
      <rect x="106.68" y="0.30" width="70.00" height="1.75" fill="#24282c"/>
      <polygon points="57.70,0.75 59.00,0.75 58.35,1.55" fill="#e6e8ea"/>
      <text x="59.30" y="1.70" font-family="sans-serif" font-size="1.7" fill="#e6e8ea">1</text>
      <text x="93.80" y="1.65" font-family="sans-serif" font-size="1.3" fill="#e6e8ea" text-anchor="end">GEN 5</text>
      <polygon points="139.58,0.75 140.88,0.75 140.23,1.55" fill="#e6e8ea"/>
      <text x="141.18" y="1.70" font-family="sans-serif" font-size="1.7" fill="#e6e8ea">2</text>
      <text x="175.68" y="1.65" font-family="sans-serif" font-size="1.3" fill="#e6e8ea" text-anchor="end">GEN 5</text>
