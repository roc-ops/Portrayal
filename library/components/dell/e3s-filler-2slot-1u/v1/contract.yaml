version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  The vented filler a 16th-generation 1U PowerEdge (R660) fits across the two
  lower E3.S slots of its last column in the 14-drive build - one plate in place
  of two carriers
provenance:
  sources: >-
    R660 ISM figure 4 (14 x EDSFF E3.S drive system), the embedded image at 1664
    x 372 px, about 3.27 px/mm across the 482.6 face: the right-hand column
    carries two carriers and, below them, this one plate with a row of tall
    vents. No vector master or photograph held draws it.
  size: >-
    drawing - 77.65 x 17.38: one carrier's width (dell/e3s-carrier@1) and two of
    the 9.63 row pitches less the gap below, which is the space it fills; the
    figure agrees to its resolution (about 78 x 17).
  face: >-
    estimated - a dark plate with a recessed field of about nineteen tall vents,
    read by eye off a figure at 3.27 px/mm; counts and spacing are not measured.
  depth: >-
    NOT KNOWN; drawn as a plate.
size: {w: 77.65, h: 17.38}
size-confidence: {w: drawing, h: drawing}
skins: [default]
