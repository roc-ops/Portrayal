format: 1
kind: component
name: pch-shroud-1u-16g
version: 1.0.0
class: mechanical
behaviour: mounts
profile: server
description: >-
  The PCH shroud of a 16th-generation 1U PowerEdge (R660) seen from above - a
  black plastic air duct over the chipset heatsink, fitted only when no riser
  is installed
provenance:
  identity: >-
    datasheet - R660 ISM "Removing the PCH shroud" / "Installing the PCH
    shroud" (figures 67, 68): "the PCH shroud is installed on systems with no
    riser configuration"; it sits on guide pins on the system board, held by
    two latches, and is moulded PCH SHROUD, AIRFLOW and REMOVE TO INSTALL
    RISERS.
  place: >-
    drawing - over the chipset heatsink, which the R660 technical guide's
    figure 10 ('Inside view of the chassis without risers', a true top view at
    1.13 px/mm on the 434.0 body) puts at plan x 179.0..220.5, y 172.8..215.0.
    That figure draws the chassis WITHOUT the shroud.
  outline: >-
    estimated - THE SHROUD IS DRAWN ONLY IN ISOMETRIC. Figures 67 and 68 show
    a duct wide at its front edge, over and beyond the heatsink on both sides,
    narrowing toward the rear with a latch post at its PSU 2 corner. The
    outline here is that shape by eye, 140 x 113 around the heatsink; nothing
    of it is measured.
  size: >-
    estimated - 140.0 x 113.0, the outline's box (see outline); not measured.
  height: >-
    NOT MEASURED.
size: {w: 140.0, h: 113.0}
size-confidence: {w: estimated, h: estimated}
skins: [default]
