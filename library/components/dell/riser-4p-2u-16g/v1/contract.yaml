format: 1
kind: module
name: riser-4p-2u-16g
version: 1.0.0
class: riser
behaviour: fills
profile: server
description: >-
  Dell riser 4P of the PowerEdge R760 - one full-height PCIe Gen5 x16 slot (slot 7, the lower) on dell/riser-4-cage-2u-16g@1, its upper window closed by a vented plate; fitted in riser configurations 3 and 5
attrs:
  riser: '4P'
  appears-in: 'riser configurations 3 and 5'
  power-absent: not-published
  slot-7: 'x16, full height (double width with the full-length 4P FL), half length, processor 2, PCIe Gen5'
provenance:
  power: >-
    NOT PUBLISHED - the riser is a passive board with connectors. The R760 ISM,
    technical guide and spec sheet were searched for 'riser' beside a wattage
    and none gives one.
  slots: >-
    datasheet - R760 ISM table 153, configurations 3-1, 3-2, 5-1 and 5-2: R4P carries slot 7 only, full height, Gen5 x16 on processor 2; the -2 builds (4P FL) take a double-width card. ISM figure 218 shows one connector, labelled slot 7; the upper window is shut by a plate, modelled as `window-8`, which takes the filler and nothing else and is deliberately NOT named a slot: the ISM lists no slot 8 for this riser, and a `slot-8` bay would be exported as a PCIe slot that does not exist.
  face: >-
    photo-measured - composed from dell/riser-4-cage-2u-16g@1, the same face as the two-slot risers.
  seating: >-
    estimated - as dell/riser-4b-2u-16g@1.
  size: >-
    photo-measured - the cage's extent, 137.3 x 44.0.
size: {w: 137.3, h: 44.0, d: 246.9}
