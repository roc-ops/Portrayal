<svg xmlns="http://www.w3.org/2000/svg" width="427mm" height="469.69mm" viewBox="0 0 427 469.69">
  <!-- The system board seen from above, at the bottom of the chassis. Almost
       all of it is covered by the air shroud or the mid tray and the fan cage;
       what this draws is the floor you see in the gaps between them. -->
  <g id="board">
    <rect x="0" y="0" width="427" height="469.69" rx="2" fill="#1f5138" stroke="#123a28" stroke-width="1"/>
  </g>
</svg>
