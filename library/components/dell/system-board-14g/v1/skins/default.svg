<svg xmlns="http://www.w3.org/2000/svg" width="422.8mm" height="456.5mm" viewBox="0 0 422.8 456.5">
  <!-- The system board's PCB seen from above, at the bottom of the chassis.
       It is an L: the rear-left corner is missing where the two supplies
       sit. The outline is the model's PCB body; the notch is the supplies'
       envelope (see the contract); the twelve DIMM socket pairs are at their
       measured positions and the device's 24 DIMM bays stand in them. -->
  <!-- THE NOTCH IS NOT AIR. The supplies' cage stands in it - Dell's model puts
       the two supplies at face x 6.6..182.7, 195.5 into the chassis - and seen
       from above with the lid off that is sheet metal, the two supplies' tops
       showing through it in 3D. Painted, so the well's punch takes the whole
       rect: unpainted, the chassis face stayed at lid level over the supplies
       and read as a plate floating above them, and picked as the board. -->
  <g id="psu-cage">
    <rect x="0" y="0" width="177.20" height="189.30" fill="#2b3035"/>
    <rect x="1.10" y="0" width="86.30" height="189.30" fill="none" stroke="#3a4045" stroke-width="0.6"/>
    <rect x="90.90" y="0" width="86.30" height="189.30" fill="none" stroke="#3a4045" stroke-width="0.6"/>
  </g>
  <g id="board">
    <path d="M 177.20 0 H 422.8 V 456.5 H 0 V 189.30 H 177.20 Z" fill="#1f5138" stroke="#123a28" stroke-width="1"/>
    <rect x="14.00" y="260.60" width="15.9" height="162.0" rx="0.8" fill="#163d2c" stroke="#0e2a1e" stroke-width="0.5"/>
    <rect x="32.90" y="260.60" width="15.9" height="162.0" rx="0.8" fill="#163d2c" stroke="#0e2a1e" stroke-width="0.5"/>
    <rect x="51.70" y="260.60" width="15.9" height="162.0" rx="0.8" fill="#163d2c" stroke="#0e2a1e" stroke-width="0.5"/>
    <rect x="157.10" y="260.60" width="15.9" height="162.0" rx="0.8" fill="#163d2c" stroke="#0e2a1e" stroke-width="0.5"/>
    <rect x="176.00" y="260.60" width="15.9" height="162.0" rx="0.8" fill="#163d2c" stroke="#0e2a1e" stroke-width="0.5"/>
    <rect x="194.80" y="260.60" width="15.9" height="162.0" rx="0.8" fill="#163d2c" stroke="#0e2a1e" stroke-width="0.5"/>
    <rect x="213.50" y="260.60" width="15.9" height="162.0" rx="0.8" fill="#163d2c" stroke="#0e2a1e" stroke-width="0.5"/>
    <rect x="232.40" y="260.60" width="15.9" height="162.0" rx="0.8" fill="#163d2c" stroke="#0e2a1e" stroke-width="0.5"/>
    <rect x="251.20" y="260.60" width="15.9" height="162.0" rx="0.8" fill="#163d2c" stroke="#0e2a1e" stroke-width="0.5"/>
    <rect x="356.60" y="260.60" width="15.9" height="162.0" rx="0.8" fill="#163d2c" stroke="#0e2a1e" stroke-width="0.5"/>
    <rect x="375.50" y="260.60" width="15.9" height="162.0" rx="0.8" fill="#163d2c" stroke="#0e2a1e" stroke-width="0.5"/>
    <rect x="394.30" y="260.60" width="15.9" height="162.0" rx="0.8" fill="#163d2c" stroke="#0e2a1e" stroke-width="0.5"/>
  </g>
</svg>
