format: 1
kind: component
name: system-board-14g
version: 1.5.0
class: mechanical
profile: server
description: >-
  The system board of a 14G PowerEdge seen from above - the floor of the
  chassis, visible between the fan cage, the shroud and the risers
size: {w: 427.0, h: 469.69, d: 79.9}
provenance:
  size: >-
    measured - Dell's service model, `R740XD_ SystemBoard`, the one seated pose:
    face x 3.58..430.58 and top_y 0.07..469.76 in the top view's frame
    (top_y = 713.5 - raw_z; rear at 0). It is the full width of the chassis interior and runs
    from just behind the fan cage to the rear wall.
  depth: >-
    measured - 79.9 is the PCB, the floor everything on this board stands on:
    the DIMM sockets base at cad y 6.9 and the panel is at 86.8. That is the
    number `size.d` carries, which makes this part a WELL 79.9 deep with its
    own art as the floor, and it is what the heatsinks stand on with their
    measured 33.1 and the DIMMs with their 31.3. A WELL'S DEPTH IS ITS FLOOR,
    NOT THE TOP OF WHAT IS IN IT. The first figure here was 46.17, the top of
    the heatsinks, because the model's bounding box for the assembly stops
    there - and with that as the floor a DIMM's body sank 31 mm into the
    board and a heatsink was 1 mm tall.
  what-is-on-it: >-
    The processors' heatsinks are dell/heatsink-1u-14g@1, placed on the
    device over this board; the memory is twenty-four bays of
    common/dimm-plan@1, also on the device; and the twelve socket pairs the
    DIMMs stand in are drawn HERE, because a socket is the board -
    `00_740XD_Ram Slot_MT-1.002`, twelve seated at 15.9 x 162.0, two DIMMs
    each, at face x 18.3, 37.1, 56.0, 161.4, 180.2, 199.1, 217.8, 236.6,
    255.5, 360.9, 379.7, 398.6 and top_y 266.8..428.8. The
    board says `under:` all of them. What is still not drawn: the processor
    sockets themselves (under the heatsinks), the NVDIMM-N battery
    (`DELL_R740XD_NVDIMM-N battery-1.001`, face x 178.58..247.58, and it
    mounts on the shroud rather than here), and every connector.
  the-board-is-a-plain-green-rectangle: >-
    estimated - the outline is measured and the SURFACE IS NOT. No trace, no
    socket, no connector and no silkscreen is drawn; the colour is a plain board
    green and is not sampled from anything. Nothing should be read off it except
    where the board begins and ends.
  the-walls-are-the-chassis-and-not-the-board: >-
    `relief.wall` is the colour of the recess's sides, and this recess is the
    whole interior of the box: 79.9 deep, the full width, from the fan wall to
    the rear metal. Its sides are the chassis's own sheet metal and they are
    seen from OUTSIDE too - the kit draws a well's walls double-sided, as the
    housing seen through a neighbouring opening - so a dark green here turned
    every rear opening green: the riser slots, the rear drive bays, whatever
    looked into the box saw the back of this well where the bay interior used
    to be. Dark grey, the interior of any server, and not sampled. And they
    are drawn from INSIDE ONLY - `walls: inside` - because the colour was
    half of it: the well's rear wall stood 0.07 behind the rear panel and cut
    off the C14 inlets' pins and every rear bay's interior at a flat plane.
relief:
  wall: '#1e2226'
  walls: inside
elements:
  board: {at: [0.0, 0.0], size: [427.0, 469.69], class: bezel}
skins: [default]
