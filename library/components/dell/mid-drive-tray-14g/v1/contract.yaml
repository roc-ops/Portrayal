format: 1
kind: component
name: mid-drive-tray-14g
version: 1.0.0
class: mechanical
profile: server
description: >-
  The mid-drive tray of a 14G PowerEdge - four drives lying flat between the
  front cage and the risers, reached by taking the system cover off
size: {w: 431.4, h: 181.24}
provenance:
  size: >-
    measured - Dell's service model, `740XD_ MidDriveTray_-1.001`: face
    x 1.30..432.70 and top_y 322.34..503.58 in the top view's own frame.
  the-top-view-frame-is-derived-and-checked: >-
    top_y = raw_z + 24.0, which is not measured but follows from two figures
    that are: the rear panel plane at raw_z 713.5, used by every part on the
    rear face, and the datasheet depth 737.5 front metal to rear metal.
    CHECKED WHERE IT MATTERS: the rear 3.5 inch drives land at top_y 738.06
    against a 737.5 rear metal face, 0.56 out. The front end of the same axis
    does NOT check out - the front drives sit at top_y 28 to 44 where a face
    flush with the front metal would be near 0 - and that is unexplained. It
    does not touch this part, which is mid-chassis and measured against the
    rear, but the axis should not be treated as solved.
  the-slot-pitch-is-106-30-and-the-2-5-inch-drives-were-regularised: >-
    THE TWO DRIVE OPTIONS DISAGREED AND ONE OF THEM IS WRONG. The four 3.5 inch
    drives measure 101.60 x 146.99 x 26.11 - SFF-8301 to the hundredth, which is
    std/drive-35@1's own registry size - at left edges 7.52, 113.82, 220.12 and
    326.42: a pitch of 106.30, 106.30, 106.30.
    The four 2.5 inch drives in the same tray measure 69.85 x 100.50 x 15.00,
    which is SFF-8201, at left edges 23.79, 127.80, 236.32 and 340.64 - pitches
    of 104.01, 108.52 and 104.32. FOUR DRIVES IN ONE TRAY ARE NOT ON AN UNEVEN
    PITCH; a tray has four identical slots and they are where the sheet metal
    puts them. An implausible layout is a failed check rather than a finding, so
    the 2.5 inch drives are drawn CENTRED IN THE 106.30 SLOTS the 3.5 inch
    drives establish - within 2 mm of where the model puts them, and evenly.
    The CAD figures are recorded here so the regularisation can be argued with.
  the-drives-are-drawn-and-not-seated: >-
    A LIMITATION, STATED RATHER THAN HIDDEN. std/drive-35@1 and std/drive-25@1
    are FACE parts: their w x h is what a front panel shows, 101.6 x 26.1 and
    15.0 x 69.85. A tray seen from above needs the drive's FOOTPRINT instead -
    101.60 x 146.99 and 69.85 x 100.50 - which is a different projection of the
    same hardware and not something a placement can ask for. So the drives are
    artwork on this tray rather than occupants of four bays, and no
    configuration can swap one for a blank. See the device's gap.
  the-backplane: >-
    measured - `740XD_ MidDriveTray_ Backplane-1.001`, face x 4.80..429.20 and
    top_y 484.51..509.28, so 424.40 x 24.77 across the rear of the tray. Drawn
    in board green because that is what it is; the colour is not sampled from
    anything.
  what-is-not-drawn: >-
    The tray's own latch and bracket are in the model - `740XD_ MidDriveTray_
    Latch-1.001` and `..._ Bracket-1.001`, the bracket 392.29 x 160.53 - and are
    not drawn here. The bracket is under the drives and the latch was not
    measured. Recorded so the next person knows they exist rather than
    rediscovering them.
skins: [default, sff]
elements:
  tray: {at: [0.0, 0.0], size: [431.4, 181.24], class: bezel}
