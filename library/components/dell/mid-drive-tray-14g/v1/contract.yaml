format: 1
kind: component
name: mid-drive-tray-14g
version: 2.0.0
class: mechanical
# It lifts out of the chassis - the ISM removes it in one step - and `mounts`
# is what gives it the viewer's pull handle. It is ALSO the recess its four
# drives sit in, and a mounted part is solid unless it says otherwise:
# `relief.cavity` below is the saying, the same override render.py has always
# honoured, and lint and the renderer both read it.
behaviour: mounts
profile: server
description: >-
  The mid-drive tray of a 14G PowerEdge - four drives lying flat between the
  front cage and the risers, reached by taking the system cover off
size: {w: 431.4, h: 181.24, d: 5.21}
provenance:
  size: >-
    measured - Dell's service model, `740XD_ MidDriveTray_-1.001`: face
    x 1.30..432.70 and top_y 233.92..415.16 in the top view's own frame.
  the-top-view-frame-is-derived-and-checked: >-
    top_y = 713.5 - raw_z, which is not measured but follows from two figures
    that are: the rear panel plane at raw_z 713.5, used by every part on the
    rear face, and the datasheet depth 737.5 front metal to rear metal. THE
    REAR IS AT y=0, which is this library's plan convention and the viewer's;
    a first pass had the axis running the other way, and the 3D showed the fan
    wall two thirds of the way back before anyone noticed.
    CHECKED WHERE IT MATTERS: the rear 3.5 inch drives land at top_y -0.56
    against the rear metal face at 0. The front end of the same axis does NOT
    check out - the front drives sit at top_y 693.5 to 709.5 where a face
    flush with the front metal would be near 737.5 - and that is unexplained. It
    does not touch this part, which is mid-chassis and measured against the
    rear, but the axis should not be treated as solved.
  the-slot-pitch-is-106-30-and-the-2-5-inch-drives-were-regularised: >-
    THE TWO DRIVE OPTIONS DISAGREED AND ONE OF THEM IS WRONG. The four 3.5 inch
    drives measure 101.60 x 146.99 x 26.11 - SFF-8301 to the hundredth, which is
    std/drive-35@1's own registry size - at left edges 7.52, 113.82, 220.12 and
    326.42: a pitch of 106.30, 106.30, 106.30.
    The four 2.5 inch drives in the same tray measure 69.85 x 100.50 x 15.00,
    which is SFF-8201, at left edges 23.79, 127.80, 236.32 and 340.64 - pitches
    of 104.01, 108.52 and 104.32. FOUR DRIVES IN ONE TRAY ARE NOT ON AN UNEVEN
    PITCH; a tray has four identical slots and they are where the sheet metal
    puts them. An implausible layout is a failed check rather than a finding, so
    the 2.5 inch drives are drawn CENTRED IN THE 106.30 SLOTS the 3.5 inch
    drives establish - within 2 mm of where the model puts them, and evenly.
    The CAD figures are recorded here so the regularisation can be argued with.
  the-drives-are-seated-and-were-not: >-
    THEY WERE ARTWORK ON THIS PART AND ARE NOW BAYS ON THE DEVICE. The reason
    they could not be seated is worth keeping, because the fix is not the one
    the first attempt reached for: a component's `size` is what a FACE shows,
    so std/drive-35@1 is 101.6 x 26.1 and a tray seen from above needs the
    101.60 x 146.99 footprint instead - a different projection of one piece of
    hardware.
    A SKIN CANNOT EXPRESS THAT, because `elements` is one block shared by every
    skin and `relief.features` name nodes in it. The library's grain is one
    contract per presented face, so the drives are std/drive-35-plan@1 and
    std/drive-25-plan@1 - separate contracts that `conforms:` to the SAME
    registry entries as the face-on ones, with `presents:` saying which two of
    each standard's three dimensions they draw. No number is restated and none
    can drift.
  the-well-is-5-21-deep: >-
    measured, and it is what makes the lid worth taking off. With no `size.d`
    this tray was flat paint on the top plane: the cover came away and what was
    behind it was a picture of a tray rather than a recess anything could sit
    in.
    render.py draws a plain component as an APERTURE as deep as its `size.d`, so
    this number is the depth of the well and this part's own art is its floor.
    5.21 is the drop from the top plane to the top of a seated drive: the panel
    is 86.8 and Dell's model puts the 3.5 inch drives in this tray at
    y 55.49..81.60, so 86.8 - 81.60. The tray's sheet metal is 1.17 below the
    plane and its floor is lower again at 37.91; neither is the number wanted
    here, because what the well has to clear is the DRIVE.
  it-lifts-out-and-is-a-well: >-
    `behaviour: mounts` with `relief.cavity: tray`, and the two together are
    the point. The tray comes out of the chassis as one piece with its drives
    in it - the ISM's "Removing the mid drive tray" is lift by the handles -
    so it wants the pull handle `mounts` gives. But `mounts` makes a part
    solid in the renderer and in L13, and this part is a recess 5.21 deep
    with four bays `in:` it. `relief.cavity` is how a mounted part says it
    has a hole in it, and both rule and renderer read it. Pulling the tray in
    the viewer takes its drives with it, which is what the hardware does.
  the-backplane: >-
    measured - `740XD_ MidDriveTray_ Backplane-1.001`, face x 4.80..429.20 and
    top_y 228.22..252.99, so 424.40 x 24.77 across the rear of the tray. Drawn
    in board green because that is what it is; the colour is not sampled from
    anything.
  what-is-not-drawn: >-
    The tray's own latch and bracket are in the model - `740XD_ MidDriveTray_
    Latch-1.001` and `..._ Bracket-1.001`, the bracket 392.29 x 160.53 - and are
    not drawn here. The bracket is under the drives and the latch was not
    measured. Recorded so the next person knows they exist rather than
    rediscovering them.
relief:
  wall: '#2b3035'
  cavity: tray
skins: [default, sff]
elements:
  tray: {at: [0.0, 0.0], size: [431.4, 181.24], class: bezel}
