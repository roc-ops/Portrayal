<svg xmlns="http://www.w3.org/2000/svg" width="431.4mm" height="181.24mm" viewBox="0 0 431.4 181.24">
  <!-- The mid-drive tray seen from above, with the cover off. Four slots on a
       106.30 pitch, a backplane across the rear of the tray, and the drives
       lying flat. From Dell's service model, `740XD_ MidDriveTray_-1.001` and
       the assembly under it, in the top view's own frame: top_y = raw_z + 24.
       THE DRIVES ARE DRAWN, NOT SEATED IN BAYS. std/drive-35@1 and
       std/drive-25@1 are FACE parts - their w x h is what a front panel shows -
       and a tray seen from above needs the footprint instead. See the gap on
       the device. -->
  <g id="tray">
    <rect x="0" y="0" width="431.4" height="181.24" rx="1.5"
          fill="#3a4045" stroke="#22262a" stroke-width="1.2"/>
    <rect id="backplane" x="3.5" y="162.17" width="424.4" height="24.77" rx="1"
          fill="#1f6a4a" stroke="#124f37" stroke-width="0.8"/>
  </g>
  <g id="drives">
    <rect x="6.22" y="20.58" width="101.6" height="146.99" rx="1.2" fill="#5b6167" stroke="#22262a" stroke-width="0.8"/>
    <rect x="22.48" y="153.57" width="69.09" height="9" rx="1" fill="#2b3035"/>
    <rect x="112.52" y="20.58" width="101.6" height="146.99" rx="1.2" fill="#5b6167" stroke="#22262a" stroke-width="0.8"/>
    <rect x="128.78" y="153.57" width="69.09" height="9" rx="1" fill="#2b3035"/>
    <rect x="218.82" y="20.58" width="101.6" height="146.99" rx="1.2" fill="#5b6167" stroke="#22262a" stroke-width="0.8"/>
    <rect x="235.08" y="153.57" width="69.09" height="9" rx="1" fill="#2b3035"/>
    <rect x="325.12" y="20.58" width="101.6" height="146.99" rx="1.2" fill="#5b6167" stroke="#22262a" stroke-width="0.8"/>
    <rect x="341.38" y="153.57" width="69.09" height="9" rx="1" fill="#2b3035"/>
  </g>
</svg>
