format: 1
kind: module
name: riser-1a-14g
version: 2.0.0
class: riser
behaviour: fills
profile: server
description: >-
  Dell riser 1A - two x16 full-height slots on the three-window riser 1 plate;
  the middle opening has no connector behind it
attrs:
  riser: '1A'
  bracket-envelope: '120.02 x 64.05'
  slot-1: 'x16, full height, full length, processor 1'
  slot-2: 'no connector - opening takes a filler only'
  slot-3: 'x16, full height, half length, processor 1'
provenance:
  depth: >-
    THE BODY IS IN PIECES AND IT IS THE WHOLE RISER: the plate the face
    paints, the PCB standing behind it at the bay's outer edge, and a slot
    connector on the PCB's inboard face per slot that takes a card - each a
    box in `body.boxes`, so that ejecting the riser takes the riser, and
    the chassis interior stays visible around it. `size.d` and `body.depth`
    are the reach from the face to the PCB's far end. A first pass drew one
    box the full reach and it hid the interior; a second cut it to 20, the
    plate and its latch, and stood the PCB in the top view as a part of its
    own, which stayed behind when the riser came out. Each box says where
    its numbers are from.
    estimated from a measurement of a sibling. Dell's service model carries
    riser 1 once, as the three-slot card that is dell/riser-1b-14g@2, and it
    reaches 170.9 into the chassis. This riser shares the cage and the slot
    position and differs in what is on the card, so it is given the same
    reach and the same body; the number is the sibling's and not this
    part's, and a model of this variant would settle it.
  identity: >-
    A REMOVABLE ASSEMBLY THAT BRINGS ITS OWN SLOTS, which is why it is a module
    with `bays` rather than openings drawn on the chassis. The ISM carries
    removal and installation procedures for risers 1, 2, 2A, 2B and 3, and the
    component schema names exactly this case: `bays` is for "MODULES THAT
    THEMSELVES HOST BAYS - a PCIe riser, a SIP carrying SPAs".
    WHAT THIS PART IS, PRECISELY, is the card that plugs into the system board.
    The sheet metal a photograph of the rear shows is dell/riser-1-plate-14g@1
    and is common to 1A, 1B and 1D; it is composed here rather than redrawn.
    That split is the whole point: nothing on the rear face separates the three,
    and the two copies of the artwork that used to exist differed only in their
    comments.
  the-middle-opening-is-there-and-is-blanked: >-
    THE PLATE HAS THREE WINDOWS AND THIS CARD HAS TWO CONNECTORS. The windows
    are chassis-side sheet metal on the PCI 20.32 pitch and are punched whichever
    riser is fitted, so a machine with 1A shows three rectangles like every other
    one; what it does not have is a card in the middle.
    So `slot-2` names one part in `accepts` - the full-height filler - and no
    card can be seated there. That is the model saying "blanked": not by hiding
    the opening, but by there being nothing a card can seat into. It is a
    structural claim a consumer can act on, which an attribute would not be.
  slot-numbering: >-
    THE NUMBERS BELONG TO THE RISER, NOT THE CHASSIS, and that is what resolves
    the puzzle in ISM table 25: the low-profile slot is numbered 4 when riser 2
    presents only that one, and 6 when riser 2 presents three. An opening cannot
    change size in place - a full-height card will not fit where the half-height
    one goes, with the power supply directly beneath it - so the metal is fixed
    and the numbering travels with the part.
    THIS PART SKIPS 2 AND THAT IS DELIBERATE. 1A wires slots 1 and 3; the bay
    keeping the name `slot-2` is what makes the gap legible rather than
    renumbering three openings into two.
  the-slots-hold-the-standard-bracket: >-
    Each slot is positioned by its OPENING - 89.90 x 12.06, the PCIe opening -
    while std/pcie-bracket-fh is 120.02 long: 19.96 of it runs past the opening
    at the tip end and 10.16 at the flange end, behind the riser's own sheet,
    which is why a face-on reading never sees it. `insert` carries that envelope
    so a bay reserves what the brackets need rather than what the plate shows.
  the-slot-block: >-
    `slot:` on each bay is the same facts as the prose attrs, structured for
    a card feature: `lanes` and `processor` are Technical Guide Table 11 and
    the Information Update Tech Sheet Table 3, as below; `generation` 3 is
    the platform's, Technical Guide 'PCIe Gen3'; `connector` x16 is measured
    on riser 1 - the model's three connectors are 91 long, the x16 length,
    on the x8-wired 1B as on the x16-wired 1A - and is taken as the family's
    mechanical connector on every other slot, full-height and low-profile
    alike, which is an inference from that riser and not a figure the guide
    prints. A card feature reads `connector` for whether a card fits and
    `lanes` for the width it will run at.
  where-the-electrical-facts-come-from: >-
    datasheet - PowerEdge R740 and R740xd Technical Guide, Table 11, which gives
    height, length and link width for every slot on every riser, and the ISM's
    Table 3, which gives the processor each slot is wired to. Table 11 lists
    riser 1A as slot 1 x16 full-height full-length and slot 3 x16 full-height
    half-length, and names no slot 2.
    THESE ARE ATTRS AND NOT `accepts` ENTRIES. Lane width does not decide what
    fits an opening - height and length do, and those are already enforced
    structurally by which brackets each bay names. A consumer that cares about
    x8 against x16 reads the attribute; a consumer asking what can physically be
    installed reads `accepts`, and the two questions stay apart.
  adjacent-brackets-overlap-by-1.27-on-purpose: >-
    THE SLOT BAYS OVERLAP IN Y AND THE PARTS STILL FIT. A PCIe bracket is 21.59
    across overall on a 20.32 slot pitch, because its flange end is KEYED - the
    top of the plate is offset sideways so the mounting tab reaches over the
    neighbouring slot and keys against it. Consecutive brackets interleave by
    exactly 1.27 and that is why a row of them nests. Any overlap check working
    on bounding boxes will report these; it is the check unable to express a real
    interlock, not a fault in the placement.
size: {w: 107.59, h: 62.0, d: 184.8}
body:
  depth: 184.8
  color: '#4a5057'
  boxes:
  - {id: pcb, at: [-0.75, -1.40], size: [1.6, 77.0],
     from: 13.9, depth: 170.9, color: '#1f5138',
     confidence: borrowed, source: 'dell/riser-1b-14g@2 - the model carries riser 1 once, as 1B, and this riser shares its cage'}
  - {id: slot-1-connector, at: [0.85, -0.58], size: [11.3, 10.8],
     from: 47.9, depth: 91.0, color: '#15171b',
     confidence: borrowed, source: 'dell/riser-1b-14g@2 - the model carries riser 1 once, as 1B, and this riser shares its cage'}
  - {id: slot-3-connector, at: [0.85, 40.06], size: [11.3, 10.8],
     from: 47.9, depth: 91.0, color: '#15171b',
     confidence: borrowed, source: 'dell/riser-1b-14g@2 - the model carries riser 1 once, as 1B, and this riser shares its cage'}
# SEEN FROM ABOVE IT IS ITS PCB: the part that stood in the top view as a
# placement of its own, now this part's plan, drawn where the rear bay says.
plan: {ref: dell/riser-card-14g@1}
insert: {w: 120.02, h: 64.05}
parts:
  # THE METAL, DRAWN OVER THE CARDS. The bays below are `behind: true`, so a
  # seated card renders beneath this component's own skin; this plate is
  # composed with the default (over), which puts it above the cards. What shows
  # of a card is its working area through a punched window and its retention tab
  # clear of the metal - the flange end is covered, which is what the hardware
  # does.
  - {ref: dell/riser-1-plate-14g@1, id: plate, at: [0, 0]}
bays:
  slot-1:
    slot: {connector: x16, lanes: 16, height: full, length: full, processor: 1, generation: 3}
    plan: {at: [-97.9, -13.9]}
    behind: true
    at: [-13.41, -1.35]
    size: [120.02, 21.59]
    accepts: [dell/pcie-filler-fh-14g@2, std/pcie-bracket-fh@2, common/pcie-card-fh@2]
    default: dell/pcie-filler-fh-14g@2
  slot-2:
    # THE OPENING WITH NO CONNECTOR BEHIND IT. Same geometry as its neighbours -
    # the chassis punches all three - but `accepts` names the filler and nothing
    # else, so no card can be seated here.
    plan: {at: [-97.9, -13.9]}
    behind: true
    at: [-13.41, 18.97]
    size: [120.02, 21.59]
    accepts: [dell/pcie-filler-fh-14g@2]
    default: dell/pcie-filler-fh-14g@2
  slot-3:
    slot: {connector: x16, lanes: 16, height: full, length: half, processor: 1, generation: 3}
    plan: {at: [-97.9, -13.9]}
    behind: true
    at: [-13.41, 39.29]
    size: [120.02, 21.59]
    accepts: [dell/pcie-filler-fh-14g@2, std/pcie-bracket-fh@2, common/pcie-card-fh@2]
    default: dell/pcie-filler-fh-14g@2
skins: [default]
