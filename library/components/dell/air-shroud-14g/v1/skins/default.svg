<svg xmlns="http://www.w3.org/2000/svg" width="431.49mm" height="210.42mm" viewBox="0 0 431.49 210.42">
  <!-- The air shroud from above. The OUTLINE is measured; everything on it is
       estimated so the part reads as a moulding rather than a slab. A real
       shroud has ducts, finger holes and cutouts over the DIMM banks - none of
       that is drawn, and nothing here should be measured. -->
  <g id="shroud">
    <rect x="0" y="0" width="431.49" height="210.42" rx="3"
          fill="#4a5057" stroke="#2b3035" stroke-width="1.2"/>
    <g fill="none" stroke="#3d4349" stroke-width="1.6">
      <rect x="16" y="18" width="399.49" height="86" rx="3"/>
      <rect x="16" y="112" width="399.49" height="80" rx="3"/>
    </g>
    <g fill="#3d4349">
      <rect x="196" y="6" width="40" height="7" rx="3.5"/>
      <rect x="196" y="197" width="40" height="7" rx="3.5"/>
    </g>
  </g>
</svg>
