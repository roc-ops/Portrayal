format: 1
kind: component
name: air-shroud-14g
version: 1.0.0
class: mechanical
# `behaviour: mounts` IS WHAT THIS PART WANTS AND IT CANNOT HAVE IT YET. It
# lies over the processors and lifts out to reach them, which is exactly what
# `mounts` declares, and declaring it is what would give it the viewer's pull
# handle - the whole point of drawing it. But the system cover is `mounts` too
# and lies over THIS, and L13 reports two mounted parts in one place, correctly,
# because on a faceplate that is a sizing error. See the device's gap
# `interior-is-a-stack-not-a-face`.
profile: server
description: >-
  The air shroud of a 14G PowerEdge - the moulding over the processors and
  memory that ducts the fans' air across them, lifted out to service either
size: {w: 431.49, h: 210.42}
provenance:
  size: >-
    measured - Dell's service model, `DELL_R740XD_Air shroud-1.001`, the one
    seated pose: face x 1.36..432.84 and top_y 318.98..529.40 in the top view's
    frame (top_y = raw_z + 24). It is very nearly the full interior width.
  it-and-the-mid-tray-are-alternatives: >-
    THEY OCCUPY THE SAME VOLUME AND CANNOT BOTH BE FITTED. This shroud is
    top_y 318.98..529.40 at chassis height 36.12..84.88;
    dell/mid-drive-tray-14g@1 is 322.34..503.58 at 48.89..85.63. Both are seated
    poses in the same model - overlapping in depth AND in height - so a machine
    has one or the other over the processors, never both.
    That is why this part carries the thirty-one configurations WITHOUT a mid
    tray and the tray carries the nine with. It is an inference from two
    measurements rather than a statement found in a manual, and it is the reason
    the scoping is what it is.
  a-second-name-gives-a-longer-part: >-
    `R740XD_ AirShroud` - the same assembly under its other name - measures
    top_y 318.98..564.39, which is 34.99 longer at the rear. The shorter
    `DELL_R740XD_Air shroud-1.001` is used because the longer one runs past the
    mid tray's own rear edge and into the riser area, which reads as the
    assembly's envelope taking in something mounted behind it. RECORDED BECAUSE
    IT IS A DISAGREEMENT BETWEEN TWO NAMES FOR ONE THING, and the choice between
    them is a judgement rather than a measurement.
  depth: >-
    measured - the shroud's own top is at chassis height 84.88 against an 86.8
    panel, so it sits 1.92 below the lid. Drawn as a solid at that height rather
    than as a well, because it is a moulding you look AT and then lift out, not
    a recess you look into.
  the-face-is-plain: >-
    estimated - the outline is measured and the surface is not. A real shroud
    has ducts, finger holes, part-number moulding and cutouts over the DIMM
    banks; none of that is drawn. The two ribs are there so the part does not
    read as a plain slab, and nothing should be measured off them.
relief:
  wall: '#3a4045'
  features:
  - node: shroud
    out: 1.0
    color: '#4a5057'
    confidence: estimated
    source: >-
      unsourced. The shroud's top is 1.92 below the lid, so what stands proud of
      the surrounding metal is not this number - it is drawn 1.0 proud of the
      floor it sits on so it reads as a moulding rather than as paint. A well
      would be wrong: this is a part you lift out.
elements:
  shroud: {at: [0.0, 0.0], size: [431.49, 210.42], class: bezel}
skins: [default]
