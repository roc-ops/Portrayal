<svg xmlns="http://www.w3.org/2000/svg" width="102.5mm" height="62.0mm" viewBox="0 0 102.5 62.0">
  <!-- riser-1-2fh-14g: the riser plate and its slot windows. The plate sits
       drawn at the module origin. The BRACKETS behind it are 120.02
       long and start 17.46 to the LEFT of this plate, behind the
       neighbouring metal - see `insert` in the contract. -->
  <!-- THE PLATE IS PUNCHED AND THE CARDS SIT BEHIND IT. These were stroked
       outlines on a solid rect - a drawing of a window rather than a window -
       so the whole bracket showed on top, flange and all. `evenodd` with a
       subpath per opening makes them holes; the bays carry `behind: true` so
       the cards seat under this plate and show through. -->
  <!-- THE PLATE IS THE SAME METAL AS THE CHASSIS. It was #7d848c against a
       #9aa1a8 panel, which read as a dark box laid on the face; ISM figure 8
       measures the plate at #acaeb3 and the chassis beside it at #afb0b5 -
       three parts in 255, a hair darker and no more. The value here keeps that
       relationship against this library's own panel colour rather than copying
       the figure's absolute level. -->
  <!-- THE WINDOW FRAMES THE BRACKET, NOT THE VENT FIELD. It was drawn at
       89.90 x 12.20 - the PCIe OPENING, which is the hole a connector needs
       rather than the hole the sheet metal has - so it cropped the card to its
       vents. Measured off ISM figure 8 by tone, in a column at face x 21 and 24
       where the only transition is plate to card: slot 1 shows card from y 5.0
       to 22.75, 17.75 tall, and a row at y 15 puts the right edge at local
       90.75 with no plate band left of the vents at all. 90.00 x 18.00,
       centred on the opening. -->
  <!-- THE PLATE REACHES PAST THE CARD'S OUTBOARD VENTS. It stopped at 95.0,
       face 112, and the card runs to 119.56 - so its flange end showed. A row
       at face y 15 finds the outboard vent pair dark to 114.75, bracket metal
       to 118.50, and bright sheet metal from there: the metal that covers the
       flange begins at 118.5, so the plate is 102.50 and its right edge lands
       at 119.50. The LEFT edge stays at face 17; the slot numerals at
       11.75..14.00 are on the chassis, left of this plate. -->
  <path id="plate" fill-rule="evenodd" d="M1.50 0.30 H101.00 A1.20 1.20 0 0 1 102.20 1.50 V60.50 A1.20 1.20 0 0 1 101.00 61.70 H1.50 A1.20 1.20 0 0 1 0.30 60.50 V1.50 A1.20 1.20 0 0 1 1.50 0.30 Z M2.50 0.50 H97.00 A2.00 2.00 0 0 1 99.00 2.50 V16.50 A2.00 2.00 0 0 1 97.00 18.50 H2.50 A2.00 2.00 0 0 1 0.50 16.50 V2.50 A2.00 2.00 0 0 1 2.50 0.50 Z M2.50 41.14 H97.00 A2.00 2.00 0 0 1 99.00 43.14 V57.14 A2.00 2.00 0 0 1 97.00 59.14 H2.50 A2.00 2.00 0 0 1 0.50 57.14 V43.14 A2.00 2.00 0 0 1 2.50 41.14 Z" fill="#969da4" stroke="#4f565d" stroke-width="0.5"/>
  <rect id="slot-1" x="2.50" y="5.00" width="89.9" height="12.2" rx="1.4" fill="none" stroke="#454b51" stroke-width="0.35"/>
  <rect id="slot-3" x="2.50" y="45.64" width="89.9" height="12.2" rx="1.4" fill="none" stroke="#454b51" stroke-width="0.35"/>
  <!-- VENT SLOTS CARRIED FROM riser-1-3fh-14g, NOT MEASURED HERE. No
       orthographic figure held here shows this riser's face: both back views
       have rear storage in these bays, and the riser figures are isometric.
       The carry rests on the plates being identical - same width, same opening
       positions on the same 20.32 pitch, same 8.12 gaps - and on the fact that
       leaving them blank would assert there are no slots, which is equally
       unsourced and contradicts the one riser that has been measured.
       16 slots at 5.492 pitch, 4.06 x 2.25, first centre 5.62. -->
  <g id="vents-1" fill="#1c2023"><rect x="3.59" y="20.75" width="4.06" height="2.25" rx="0.5"/><rect x="9.08" y="20.75" width="4.06" height="2.25" rx="0.5"/><rect x="14.57" y="20.75" width="4.06" height="2.25" rx="0.5"/><rect x="20.07" y="20.75" width="4.06" height="2.25" rx="0.5"/><rect x="25.56" y="20.75" width="4.06" height="2.25" rx="0.5"/><rect x="31.05" y="20.75" width="4.06" height="2.25" rx="0.5"/><rect x="36.54" y="20.75" width="4.06" height="2.25" rx="0.5"/><rect x="42.03" y="20.75" width="4.06" height="2.25" rx="0.5"/><rect x="47.53" y="20.75" width="4.06" height="2.25" rx="0.5"/><rect x="53.02" y="20.75" width="4.06" height="2.25" rx="0.5"/><rect x="58.51" y="20.75" width="4.06" height="2.25" rx="0.5"/><rect x="64.00" y="20.75" width="4.06" height="2.25" rx="0.5"/><rect x="69.49" y="20.75" width="4.06" height="2.25" rx="0.5"/><rect x="74.99" y="20.75" width="4.06" height="2.25" rx="0.5"/><rect x="80.48" y="20.75" width="4.06" height="2.25" rx="0.5"/><rect x="85.97" y="20.75" width="4.06" height="2.25" rx="0.5"/></g>
  <g id="vents-2" fill="#1c2023"><rect x="3.59" y="40.75" width="4.06" height="2.25" rx="0.5"/><rect x="9.08" y="40.75" width="4.06" height="2.25" rx="0.5"/><rect x="14.57" y="40.75" width="4.06" height="2.25" rx="0.5"/><rect x="20.07" y="40.75" width="4.06" height="2.25" rx="0.5"/><rect x="25.56" y="40.75" width="4.06" height="2.25" rx="0.5"/><rect x="31.05" y="40.75" width="4.06" height="2.25" rx="0.5"/><rect x="36.54" y="40.75" width="4.06" height="2.25" rx="0.5"/><rect x="42.03" y="40.75" width="4.06" height="2.25" rx="0.5"/><rect x="47.53" y="40.75" width="4.06" height="2.25" rx="0.5"/><rect x="53.02" y="40.75" width="4.06" height="2.25" rx="0.5"/><rect x="58.51" y="40.75" width="4.06" height="2.25" rx="0.5"/><rect x="64.00" y="40.75" width="4.06" height="2.25" rx="0.5"/><rect x="69.49" y="40.75" width="4.06" height="2.25" rx="0.5"/><rect x="74.99" y="40.75" width="4.06" height="2.25" rx="0.5"/><rect x="80.48" y="40.75" width="4.06" height="2.25" rx="0.5"/><rect x="85.97" y="40.75" width="4.06" height="2.25" rx="0.5"/></g>
</svg>
