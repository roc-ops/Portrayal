format: 1
kind: module
name: riser-1-2fh-14g
version: 1.4.0
class: riser
behaviour: fills
profile: server
description: >-
  PCIe expansion card riser for a 14th-generation PowerEdge - three chassis
  openings, of which it wires 2; the middle one takes a filler only
attrs:
  supported-risers: '1A'
  bracket-envelope: '120.02 x 64.05'
provenance:
  the-plate-is-not-punched-and-that-was-a-misreading: >-
    A ROW OF VENTS WAS DRAWN ON THIS PLATE AND IT BELONGS TO THE CARD. Measured
    at face 24.75 and 44.75, each row falls inside a BRACKET - local y 18.93 and
    18.61, the same place on each card - and each overlaps one of this plate's
    own windows, which is a hole and cannot carry ink. Two independent reasons,
    agreeing. The rows now live in dell/pcie-filler-fh-14g@1 where they are
    louvres rather than punched rectangles.
    Nothing here is punched between the openings on the evidence held: this
    plate is metal with windows in it and no vent field of its own.
  identity: >-
    A REMOVABLE ASSEMBLY THAT BRINGS ITS OWN SLOTS, which is why it is a module
    with `bays` rather than openings drawn on the chassis. The ISM carries
    removal and installation procedures for risers 1, 2, 2A, 2B and 3, and the
    component schema names exactly this case: `bays` is for "MODULES THAT
    THEMSELVES HOST BAYS - a PCIe riser, a SIP carrying SPAs".
  the-slots-hold-the-standard-bracket-now: >-
    THEY USED TO HOLD A PLATE THIS PROJECT DREW, sized to the connector opening.
    The 90.0 x 12.2 rectangles read off the figure were RIGHT - they are the PCIe
    opening, 89.90 x 12.06, to a tenth of a percent - but an opening is not a
    bracket. std/pcie-bracket-fh is 120.02 long: 19.96 of it runs on past the
    opening at the tip end and 10.16 at the flange end, behind this riser's own
    sheet, which is why a face-on reading never sees it. Each slot is positioned
    by its OPENING, so what shows through the window has not moved; the module
    grew instead, to hold the metal that was always there.
  the-plate-reaches-past-the-outboard-vents: >-
    photo-measured - it was 95.0, which put its right edge at face 112 while the
    card runs to 119.56, so the flange end showed. Reading tone along face y 15
    across the right of slot 1: the card's OUTBOARD vent pair - the column
    outside the rounded frame - is dark to 114.75, the bracket's own metal runs
    to 118.50, and bright sheet metal begins there. So the metal that covers the
    flange starts at 118.5 and the plate is 102.50, right edge at 119.50.
    THE LEFT EDGE DOES NOT MOVE. The same row finds no plate band between face
    17 and the vents, and the slot numerals sit at 11.75..14.00 - left of this
    plate, on the chassis. That is a different piece of metal and it is what
    carries the labels.
  size: >-
    size is 95.0 x 62.0, the plate the skin DRAWS; insert is 120.02 x 64.05, what a
    slot has to reserve. THOSE ARE DIFFERENT THINGS and the difference is the
    whole point here: the plate is what a photograph shows, the insert is what
    the brackets need. Growing `size` to the envelope instead was tried and put
    five false overlaps on the rear face - riser 3's box across the power supply,
    riser 1's down over the iDRAC port - none of them collisions between parts,
    all of them collisions between boxes of things at different heights. The plate and the slot pitch come from the R740 ISM figure 9, which
    passes Gate 1 at 0.26% against a 434 x 86.8 rear face; the pitch is the PCI
    standard 20.32 and the figure confirms it at 20.535 (1.06%).
    THE OUTLINE IS AREA ON THE FACE, not the assembly behind it. Nothing held
    here dimensions the riser's depth or its board, so no depth is recorded.
  slot-numbering: >-
    THE NUMBERS BELONG TO THE RISER, NOT THE CHASSIS, and that is what resolves
    the puzzle in ISM table 25: the low-profile slot is numbered 4 when riser 2
    presents only that one, and 6 when riser 2 presents three. An opening cannot
    change size in place - a full-height card will not fit where the half-height
    one goes, with the power supply directly beneath it - so the metal is fixed
    and the numbering travels with the part.
  the-middle-opening-is-there-and-is-blanked: >-
    THE PLATE WAS DRAWN WITH TWO WINDOWS AND THE MACHINE HAS THREE. This is 1A,
    the one riser-1 arrangement the reference composite does not show, so it was
    modelled from the slots it wires - and that put sheet metal where the
    chassis has a hole. The windows are on the PCI 20.32 pitch and are the same
    pressing as riser-1-3fh-14g; a riser with fewer connectors does not get a
    differently punched plate.
    So the middle window is cut, its geometry lifted verbatim from
    riser-1-3fh-14g rather than re-measured, and `slot-2` names one part in
    `accepts` - the full-height filler. That is the model saying "blanked": not
    by hiding the opening, but by there being nothing a card can seat into.
    WHETHER THE NUMERAL 2 STILL PRINTS IS NOT SETTLED HERE. It is on
    dell/pcie-slot-strip-14g, chassis metal at face 11.75..14.00, left of this
    plate and outside this part - so on the evidence held it is printed on every
    14G chassis whatever riser is fitted, and it is left alone. If it turns out
    the strip comes out with the riser cage, the fix is a second skin on the
    strip, not a change here.
  which-part-numbers: >-
    THIS FACE IS SHARED BY 1A. ISM table 25 names eleven riser part numbers
    across the three positions and they present only FIVE distinct arrangements
    of slots; within a face the variants differ in LANE WIDTH and which processor
    each slot is wired to. Those are facts about the electronics, recorded in
    attrs, and they do not change the drawing.
  adjacent-brackets-overlap-by-1.27-on-purpose: >-
    THE SLOT BAYS OVERLAP IN Y AND THE PARTS STILL FIT. A PCIe bracket is 21.59
    across overall on a 20.32 slot pitch, because its flange end is KEYED - the
    top of the plate is offset sideways so the mounting tab reaches over the
    neighbouring slot and keys against it. Consecutive brackets interleave by
    exactly 1.27 and that is why a row of them nests. Any overlap check working
    on bounding boxes will report these; it is the check unable to express a real
    interlock, not a fault in the placement.
size: {w: 107.59, h: 62.0}
insert: {w: 120.02, h: 64.05}
bays:
  # THE BRACKETS SIT 1 MM RIGHT OF WHERE THEY WERE. Only the bays move;
  # the plate, its windows and the slot strip are chassis and stay put.
  slot-1:
    # BEHIND THE PLATE. What shows of a card is its working area
    # through the punched window and its retention tab clear of the
    # metal; the flange end is covered. Without this the occupant is
    # appended after the skin and the whole outline shows on top.
    behind: true
    at: [-13.41, 1.82]
    size: [120.02, 21.59]
    accepts: [dell/pcie-filler-fh-14g@1, std/pcie-bracket-fh@1]
    default: dell/pcie-filler-fh-14g@1
  slot-2:
    # THE OPENING WITH NO CONNECTOR BEHIND IT. Same geometry as its
    # neighbours - the chassis punches all three - but `accepts` names
    # the filler and nothing else, so no card can be seated here.
    behind: true
    at: [-13.41, 22.14]
    size: [120.02, 21.59]
    accepts: [dell/pcie-filler-fh-14g@1]
    default: dell/pcie-filler-fh-14g@1
  slot-3:
    # BEHIND THE PLATE. What shows of a card is its working area
    # through the punched window and its retention tab clear of the
    # metal; the flange end is covered. Without this the occupant is
    # appended after the skin and the whole outline shows on top.
    behind: true
    at: [-13.41, 42.46]
    size: [120.02, 21.59]
    accepts: [dell/pcie-filler-fh-14g@1, std/pcie-bracket-fh@1]
    default: dell/pcie-filler-fh-14g@1
skins: [default]
