name: riser-2q-plan-16g
version: 1.0.0
class: mechanical
profile: server
description: >-
  riser 2Q of the PowerEdge R660 seen from above, as an ESTIMATE - a metal roof over its two low-profile cards at the rear and a black plastic cable frame running forward from it
provenance:
  sources: >-
    estimated - NOTHING HELD SHOWS THIS RISER FROM ABOVE. Dell's service model
    carries risers 2A and 3A only, and the top views in the R660, R6615 and
    R6625 manuals show low-profile risers 2 and 3. The R660 ISM's figure 157
    (Riser 2Q) draws it in isometric from the front and above, and this
    outline is that figure's shape by eye.
  size: >-
    estimated - 186.50 x 253.2: the riser's own rear extent (dell/riser-2q-16g@1,
    from the VisioCafe master) and riser 2's measured depth inside the rear
    wall (dell/riser-2-lp-plan-16g@1). Neither is measured for this riser, and
    the figure shows its cable frame reaching wider and further forward than
    riser 2A's.
  shape: >-
    estimated - from the isometric: sheet metal over the cards for about the
    first 110, and a black plastic frame carrying the cables to two paddle
    boards in front of it. The frame is drawn as one block from 20 to the
    right edge; the paddle boards, the two riser boards and the cables are not
    drawn. Proportions are by eye.
  is-a-plan: >-
    A plan part: what the top view draws where the rear bay projects the riser.
size: {w: 186.50, h: 253.2}
size-confidence: {w: estimated, h: estimated}
