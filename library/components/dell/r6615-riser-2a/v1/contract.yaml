format: 1
kind: module
name: r6615-riser-2a
version: 1.0.0
class: riser
behaviour: fills
profile: server
description: >-
  Dell riser 2A of the PowerEdge R6615 - slot 1 and slot 2 on dell/riser-2-lp-cage-16g@1, fitted in riser configurations 1 and 6
attrs:
  riser: '2A'
  appears-in: 'riser configurations 1 and 6'
  power-absent: not-published
  slot-1: 'x8, low profile, half length, processor 1, PCIe Gen4'
  slot-2: 'x8, low profile, half length, processor 1, PCIe Gen4'
provenance:
  why-this-is-not-dell/riser-2a-16g: >-
    THE METAL IS THE R660'S AND THE WIRING IS NOT. The R6615 has one processor:
    ISM table 16 (and table 97) give R2A's two slots as x8 Gen4 on processor 1,
    where the R660's riser 2A is two x16 Gen4 slots on processors 1 and 2. A
    slot's electrical width and processor are contract data, so the R660's part
    would state a wiring this server does not have. The face is composed from
    the same cage, which the R6615's figure 6 and table 6 do not distinguish.
  power: >-
    NOT PUBLISHED - the riser is a passive board with connectors. The R6615 ISM,
    technical guide and spec sheet were searched for 'riser' beside a wattage
    and none gives one.
  identity: >-
    A REMOVABLE ASSEMBLY THAT BRINGS ITS OWN SLOTS (ISM figure 116, 'Riser 2A',
    slot 1 and slot 2), so it is a module with `bays`, as dell/riser-2a-16g@1 is.
  slots: >-
    datasheet - R6615 ISM table 16 and table 97: slot 1 and slot 2 low profile,
    half length, x8 (Gen4), processor 1. Table 17 (technical guide table 11)
    lists the riser in configurations 1 and 6.
  face: >-
    borrowed - composed from dell/riser-2-lp-cage-16g@1, the metal of the R660's
    riser 2A, which ISM figure 116 shows with the same two windows.
  size: >-
    borrowed - the cage's extent, 163.60 x 19.80.
  seating: >-
    borrowed - the slot bays are dell/riser-2a-16g@1's, which read them off
    Dell's R660 service model.
  body: >-
    borrowed - the board and connectors are dell/riser-2a-16g@1's.
  plan: >-
    borrowed - dell/riser-2-lp-plan-16g@1, the R660's riser 2 outline. The
    R6615's interior view with risers (ISM figure 11) shows riser 2 on the
    right of riser 3 from above, and the outline lands on it at matched scale
    (x 288 to 550 against the figure's 290 to 555 px at 0.8 of 2.195 px/mm).
