format: 1
kind: module
name: pcie-filler-lp-16g
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  Vented low-profile slot filler of a 16th-generation 1U PowerEdge (R660), lying
  flat in its riser - the part of it the rear face shows, an eighteen-square vent
  field
provenance:
  sources: >-
    The VisioCafe R660 rear masters (r660-3xpci-lp-rear-1 and siblings), read on
    the 434 body at 22.24 px/mm, y scaled 0.9926 to 42.8 (see dell/psu-1400w-
    ac-60mm@1, provenance/stencil-scale). All three slots of the 3 x LP master
    draw this filler. Facts read, art not traced.
  size: >-
    registry - 79.20 x 18.42, THE WHOLE BRACKET (std/pcie-bracket-lp@1, PCIe CEM
    5.0 fig 11-9), drawn tip-left as the standard part is. It was the 70.0
    window until the riser cages were drawn: the cage now covers the bracket's
    ends, and a filler the size of a card's bracket seats in the same slot at
    the same place. Dell's service model puts the low-profile brackets on
    riser 2A at rear x 120.9..200.9 and 187.0..267.0, overlapping 14 mm at
    different depths - the ends interleave, which is why three of them fit a
    pitch shorter than a bracket.
  vents: >-
    drawing - nine columns of two, 4.0 square on a 5.48 pitch across and 5.49
    down, the field centred 36.3 from the tip: the mean over the three slots of
    the master's vent-field centre less the bracket's tip end (36.70 for slot
    1, 37.59 and 34.70 for slots 2 and 3, which are turned over), so each sits within
    1.6 of where the master draws it.
  depth: >-
    NOT KNOWN; drawn as a plate.
size: {w: 79.2, h: 18.42}
size-confidence: {w: registry, h: registry}
skins: [default]
