format: 1
kind: module
name: pcie-filler-lp-16g
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  Vented low-profile slot filler of a 16th-generation 1U PowerEdge (R660), lying
  flat in its riser - the part of it the rear face shows, an eighteen-square vent
  field
provenance:
  sources: >-
    The VisioCafe R660 rear masters (r660-3xpci-lp-rear-1 and siblings), read on
    the 434 body at 22.24 px/mm, y scaled 0.9926 to 42.8 (see dell/psu-1400w-
    ac-60mm@1, provenance/stencil-scale). All three slots of the 3 x LP master
    draw this filler. Facts read, art not traced.
  size: >-
    drawing - 70.0 x 18.42, THE VISIBLE WINDOW, NOT THE BRACKET. The master's
    three filler plates are 70.1, 68.75 and 75.85 wide between the riser
    hardware either side, each centred on its vent field to within 0.6 mm (3.0
    for slot 3), so the window is the plate's centred extent. A PCIe low-profile
    bracket is 79.20 long (CEM 5.0 fig 11-9, std/pcie-bracket-lp@1), and on
    this machine's slot pitch - 72.9 and 77.2 between plate edges - three of
    them cannot lie end to end in view: the bracket ends are under the riser
    hardware. 18.42 is the standard's height, which the master's plates match.
  vents: >-
    drawing - nine columns of two, 4.0 square on a 5.48 pitch across and 5.49
    down, centred in the window.
  depth: >-
    NOT KNOWN; drawn as a plate.
size: {w: 70.0, h: 18.42}
size-confidence: {w: drawing, h: registry}
skins: [default]
