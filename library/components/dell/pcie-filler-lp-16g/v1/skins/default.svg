<svg xmlns="http://www.w3.org/2000/svg" width="79.2mm" height="18.42mm" viewBox="0 0 79.2 18.42">
  <!-- 16G 1U low-profile slot filler, in std/pcie-bracket-lp@1's frame - the
       79.20 envelope with its 7.74 tip end at the LEFT, so a slot turned over
       (rotate 180) seats it as it seats a card. A FILLER HAS NO TIP: the
       master draws Dell's blank as a plain plate filling the window, and a
       drawn tip showed in the gaps between slots, so the plate runs from 7.74
       to the flange end and the tip end is empty. The riser cage covers the
       ends; what shows is the window and its eighteen-square vent field.
       Original art from measured positions. -->
  <path id="plate" d="M7.74 0.15 H78.45 Q79.05 0.15 79.05 0.75 V17.67 Q79.05 18.27 78.45 18.27 H7.74 Z" fill="#d9dcdf" stroke="#9aa1a8" stroke-width="0.25"/>
  <g id="vents"><rect x="18.82" y="4.46" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="18.82" y="9.95" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="24.30" y="4.46" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="24.30" y="9.95" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="29.78" y="4.46" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="29.78" y="9.95" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="35.26" y="4.46" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="35.26" y="9.95" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="40.74" y="4.46" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="40.74" y="9.95" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="46.22" y="4.46" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="46.22" y="9.95" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="51.70" y="4.46" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="51.70" y="9.95" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="57.18" y="4.46" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="57.18" y="9.95" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="62.66" y="4.46" width="4.0" height="4.0" rx="0.4" fill="#16191c"/><rect x="62.66" y="9.95" width="4.0" height="4.0" rx="0.4" fill="#16191c"/></g>
