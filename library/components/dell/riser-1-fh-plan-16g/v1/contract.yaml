name: riser-1-fh-plan-16g
version: 1.0.0
class: mechanical
profile: server
description: >-
  riser 1 of the PowerEdge R660 (riser 1P) seen from above, as an ESTIMATE - a metal arm along the riser board with the RISER 1 label, a wing across its front, and a dark sheet over the full-height card
provenance:
  sources: >-
    estimated - NOTHING HELD SHOWS THIS RISER FROM ABOVE. Dell's service model
    carries risers 2A and 3A only, and the top views in the R660, R6615 and
    R6625 manuals show low-profile risers 2 and 3. The R660 ISM's figure 154
    (Riser 1P) draws it in isometric from behind and above, and this
    outline is that figure's shape by eye.
  size: >-
    estimated - 120.60 x 253.2: the riser's own rear extent (dell/riser-1p-16g@1,
    from the VisioCafe master) and riser 2's measured depth inside the rear
    wall (dell/riser-2-lp-plan-16g@1). Neither the width behind the rear face
    nor the depth is measured for this riser.
  shape: >-
    estimated - from the isometric: a sheet-metal arm about 48 wide along the
    riser board's side, the full width at the rear over the bracket (the first
    38) and again as a wing across the front (from 205), with a dark sheet
    in the bay between them. The board is at the right in this view, mirrored
    from the rear face, where the riser stands it at the left. Proportions are
    by eye; the holes, the latch and the card guide are not drawn.
  label: >-
    drawing - the arm is printed RISER 1 in white on black (figure 154).
  is-a-plan: >-
    A plan part: what the top view draws where the rear bay projects the riser.
size: {w: 120.60, h: 253.2}
size-confidence: {w: estimated, h: estimated}
