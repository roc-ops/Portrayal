<svg xmlns="http://www.w3.org/2000/svg" width="26mm" height="10mm" viewBox="0 0 26 10">
  <!-- BOSS-N1 M.2 carrier, lying flat with its tab at the left. Original art
       from measured positions (see the contract). -->
  <rect id="body" x="0.1" y="0.1" width="25.8" height="9.8" rx="0.4" fill="#5f6366" stroke="#3b3f42" stroke-width="0.2"/>
  <!-- the label plate carrying the two icons and their lamps -->
  <rect id="plate" x="6.82" y="2.27" width="10.71" height="5.47" rx="0.3" fill="#6d7175"/>
  <!-- the grip, chamfered at its far lower corner -->
  <path id="grip" d="M17.58 2.71 H23.96 V7.70 L22.99 8.67 H17.58 Z" fill="#45494c"/>
  <rect id="tab" x="0.0" y="1.97" width="4.33" height="6.07" rx="0.3" fill="#e8781e" stroke="#a9520f" stroke-width="0.2"/>
  <path d="M1.0 4.1 L2.2 5.0 L1.0 5.9 Z" fill="#b5560d"/>
  <rect id="led-status" x="9.95" y="4.36" width="1.3" height="1.3" rx="0.15" fill="var(--led-color, #8a8e92)"/>
  <rect id="led-activity" x="14.80" y="4.36" width="1.3" height="1.3" rx="0.15" fill="var(--led-color, #8a8e92)"/>
  <g id="silkscreen" fill="none" stroke="#f2f3f4" stroke-width="0.22">
    <!-- the drive icon: a cylinder -->
    <path d="M7.95 4.25 v1.6 a0.7 0.3 0 0 0 1.4 0 v-1.6 M7.95 4.25 a0.7 0.3 0 0 0 1.4 0 a0.7 0.3 0 0 0 -1.4 0"/>
    <!-- the activity icon: a pulse -->
    <path d="M11.95 5.0 h0.7 l0.35 -0.9 l0.45 1.8 l0.35 -0.9 h0.45"/>
  </g>
</svg>
