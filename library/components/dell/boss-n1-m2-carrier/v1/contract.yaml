             {name: failed, color: '#eab308', behavior: {mode: blinking, rate: 1}},
             {name: identify, color: '#22c55e', behavior: {mode: blinking, rate: 1}}]
    description: >-
      the drive's status lamp, beside the drive icon. BOSS-N1 User's Guide
