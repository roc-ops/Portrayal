<svg xmlns="http://www.w3.org/2000/svg" width="11.0mm" height="37.5mm" viewBox="0 0 11.0 37.5">
  <!-- The chassis tab at riser 2's left end, carrying the blue thumbscrew.
       IT IS A SEPARATE PART BECAUSE OF WHAT IT HAS TO BE IN FRONT OF. It lived
       in rear-bay-frame-14g, which is a plain placement and so draws before the
       bays - right for the cage panels and vents, which a fitted blank covers,
       and wrong for this, which riser 2's bracket tails run across and go
       behind. One component cannot be both, so the tab left.
       The operator's composite shows it standing proud with the thumbscrew on
       it and the blank's perforations starting to its right, so drawing it
       after the bays is correct for the blanked rear as well. -->
  <path id="tab" fill-rule="evenodd" fill="#8c939b" stroke="#5a6069"
        stroke-width="0.3" d="M0.00 0.00 L0.00 37.50 L1.31 37.50 L1.31 25.50 L11.00 25.43 L11.00 4.62 L10.25 3.00 L8.88 2.06 L1.38 2.00 L1.31 0.00 Z M5.44 5.37 L7.62 5.74 L8.69 7.18 L8.38 9.37 L6.88 10.50 L4.81 10.24 L3.62 8.68 L3.88 6.62 Z"/>
  <!-- THE SCREW SITS ON A PAD, separated from the bar below it by tone rather
       than by outline - the pad is tilted toward the light and the bar is not.
       Carried over verbatim from the frame. -->
  <rect id="screw-pad" x="0.00" y="1.16" width="11.0" height="13.25"
        rx="1.1" fill="#a9b0b7" stroke="#7d848c" stroke-width="0.25"/>
  <rect id="screw-tab-tongue" x="1.74" y="26.41" width="9.26" height="9.5"
        rx="0.8" fill="#767d85" stroke="#5a6069" stroke-width="0.25"/>
</svg>
