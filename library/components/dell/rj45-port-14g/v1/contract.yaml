format: 1
kind: component
name: rj45-port-14g
version: 1.3.0
class: port
interface: rj45
profile: server
description: >-
  A 14G PowerEdge network port - common/rj45-eth@1 carrying the link and activity
  states ISM table 11 gives it
size: {w: 15.8, h: 13.2, d: 18.6}
provenance:
  it-carries-meaning-and-not-drawing: >-
    NOTHING HERE IS DRAWN. There is no skin: the housing, its three-tier opening,
    its eight conductors and the two lamp windows are all common/rj45-eth@1,
    composed whole. There is no bezel - roc-ops/Portrayal#125 retired the bezel plates, and the
    jack this composes is the housing itself. What this part adds is ISM table 11 - what those two lamps signify on
    a 14G PowerEdge - attached with the `states` override on `parts:`.
    A component declares what a lamp IS and can only guess what it MEANS. The
    same jack is a management port here and a data port on the next card, and
    the indicator table belongs to whoever fitted it.
  why-it-is-a-component-at-all: >-
    Because the table is worth writing once. `states` on a placement or a part
    could put it inline on every card that wants it, and then four NDCs would
    carry four copies of the same four state names and nothing would keep them
    in step. Naming it once means a card composes `dell/rj45-port-14g@1` and
    gets Dell's meanings with the connector.
  it-used-to-redraw-the-lamps: >-
    RECORDED BECAUSE THE FIRST VERSION WAS A WORKAROUND. `parts:` accepted at,
    attrs, behind, id, lift, ref, rotate and skin - and not states - so this
    component originally composed the common port `behind: true` and drew two
    lamp rects of its own on top, at the composed part's own lamp coordinates.
    Identical rects in identical places: two nodes for one indicator, and the
    only way to attach a meaning was to redraw the thing it was about.
    `states` on `parts:` removed the need, and the redrawn rects with it. The
    machinery was already there - apply_states handles a per-element mapping and
    already reached lamps inside composed parts - it had simply never been wired
    to anything but device placements.
  lamps: >-
    ISM table 11, per port: the LINK indicator is green at the port's maximum
    speed, amber below it, blinking green when NIC identify is enabled through
    the configuration utility, and off when the NIC is not connected; the
    ACTIVITY indicator blinks green when data is moving and is off when it is
    not. NO RATE IS PUBLISHED for either blink and none is stated.
    Transcribed from dell/ndc-4x-rj45-14g@1, which read them off the ISM and is
    where they lived before this part existed.
  which-lamp-is-which: >-
    LINK IS THE LEFT ONE AND THAT IS MEASURED, not assumed from the order of the
    table. On the NDC the link indicator sits at face x 3.60 and the activity
    indicator at 15.64, on a jack spanning 2.47..18.47 - so link is the lamp on
    the keyway's left and activity the one on its right.
    THE PART ROTATES NOW, AND THAT SWAPS THE IDS. common/rj45-eth@1's own
    provenance says led-a is its left window and led-b its right when unrotated,
    swapped by a 180 turn - and this composition turns it, because the Dell
    jacks are keyway-up in ISM figure 8 while the housing draws keyway-down
    unrotated. So after the turn, left - where link sits - is `led-b`, and right
    - where activity sits - is `led-a`; the ids in `parts[0].states` below carry
    the meanings on that footing, not on the common part's own unrotated
    left/right.
  composes-rj45-eth: >-
    Since 1.1.0 this composes common/rj45-eth@1 - the housing with two lamps - where
    1.0.0 composed common/rj45-port@4, a bezel plate over an aperture. Same two lamps,
    same ISM meanings; the part underneath became a jack (#125).
  interface: >-
    A PLUG SEATS HERE, AND SINCE 1.3.0 THE PART SAYS SO (#610). The slot code looks
    through ONE wrapper to the aperture inside it (manifest.presented_interface),
    and this part is a wrapper around a wrapper - dell/rj45-port-14g composes
    common/rj45-eth@1, which composes std/rj45@2 - so nothing reached the jack and
    the four NDC ports could not take generic/rj45-plug@1. `interface: rj45` and
    `mate` state it at this level instead. The point is std/rj45@2's own, [7.9,
    6.6], forwarded unchanged by common/rj45-eth@1; it is the centre of the 15.8 x
    13.2 face, so the 180 turn on `parts[0]` leaves it where it is.
  size: >-
    17.0 x 14.9 was common/rj45-port@4's own footprint; via common/rj45-eth@1 it
    is now that part's 15.8 x 13.2.
parts:
  - ref: common/rj45-eth@1
    id: port
    at: [0.0, 0.0]
    rotate: 180
    states:
      led-a:
        - 'off'
        - {name: active, color: '#22c55e', behavior: blinking}
      led-b:
        - 'off'
        - {name: up, color: '#22c55e'}
        - {name: degraded, color: '#eab308'}
        - {name: identify, color: '#22c55e', behavior: blinking}
connection-points:
  mate: {at: [7.9, 6.6], direction: front}
