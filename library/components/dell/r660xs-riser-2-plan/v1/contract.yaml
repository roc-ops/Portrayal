format: 1
kind: component
name: r660xs-riser-2-plan
version: 1.0.0
class: mechanical
profile: server
description: >-
  riser 2 of the PowerEdge R660xs (2a, 2d, 2e) seen from above - the cage roof over its two card positions, a window where the board shows through and the black connector slot
provenance:
  sources: >-
    drawing - the PowerEdge R660xs Installation and Service Manual, figure 8
    'Inside the system', read as dell/r660xs-riser-1-plan@1 reads it (1.802
    px/mm, plan y from the rear wall). Figure 8 shows riser 2a.
  size: >-
    ESTIMATED - 170.1 x 165.0: the width is the riser's rear-face extent
    (dell/r660xs-riser-2-cage@1); the depth is where the roof's lobes end in the
    figure (y 415), as for riser 1. THE OUTLINE IS NOT TRACED: the figure shows
    a plate with a band across the rear and legs, and a large rounded panel
    beside the BOSS riser, and this part draws them as one rectangle with a
    window and a slot.
  window: >-
    estimated - the 35.3 x 80.0 window at plan x 17.7, y 45.0 from the riser's
    corner is where the figure shows the board's connector block (figure x
    475..539, y 199..343), read by eye.
  slot: >-
    drawing - the black slot, 4.2 x 96.0 at x 76.3, y 35.0 (figure x 578..586,
    y 182..354): the riser connector's opening as the figure shows it.
  one-slot-risers: >-
    estimated - risers 2d and 2e (slot 2 alone) are drawn as riser 2a. No
    figure shows them from above; their isometrics (ISM figures 80 and 81) show
    the same cage with one card.
  is-a-plan: >-
    A plan part: what the top view draws where the rear bay projects the riser.
size: {w: 170.1, h: 165.0}
size-confidence: {w: estimated, h: estimated}
skins: [default]
