format: 1
kind: module
name: ocp3-blank-16g
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  The vented blank a 16th-generation PowerEdge (R660) fits in an empty OCP NIC
  3.0 slot - a twelve-by-two grid of square vents on the SFF bracket's outline
provenance:
  sources: >-
    The VisioCafe R660 3 x LP rear master, which draws this blank in the OCP
    slot, read at 22.24 px/mm (facts read, art not traced); the outline is the
    Dell SFF bracket of dell/ocp3-4x1g-rj45@1, measured on the R660 service
    model.
  size: >-
    measured outline, 71.8 x 15.1 - the bracket the cards share. The master's
    vent field centres at x 201.83 on the rear face, and the CAD bracket spans
    164.95..236.75, centre 200.85: the blank is drawn on the bracket it closes.
  vents: >-
    drawing - twelve columns of two, 4.0 x 3.97 on a 5.48 pitch across and 5.45
    down, from 4.66, 3.46 on the plate.
  depth: >-
    NOT KNOWN; drawn as a plate.
size: {w: 71.8, h: 15.1}
size-confidence: {w: measured, h: measured}
skins: [default]
