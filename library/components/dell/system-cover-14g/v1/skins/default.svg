<svg xmlns="http://www.w3.org/2000/svg" width="434mm" height="540.6mm" viewBox="0 0 434 540.6">
  <!-- The system cover seen from above: the lid that comes off to reach the
       mid-drive tray, the risers and the processor tray. Its rear edge, at y=0 in
       the plan convention, is the chassis's rear metal face; the front edge
       stops short of the front drive cage, which is under its own shell.
       THE LATCH IS PART OF THIS COVER, not paint on the chassis. It was decor
       on the top panel, which put a moving handle on the sheet metal it moves
       against - and left nothing to take off when the lid came away. -->
  <g id="cover">
    <rect x="0" y="0.0" width="434" height="540.6" fill="#2b3035" stroke="#1a1d21" stroke-width="1.2"/>
    <!-- the pressed stiffening ribs that run fore-and-aft on this lid -->
    <g fill="#31373c">
      <rect x="26" y="441.4" width="382" height="3.2" rx="1.6"/>
      <rect x="26" y="237.4" width="382" height="3.2" rx="1.6"/>
      <rect x="26" y="67.4" width="382" height="3.2" rx="1.6"/>
    </g>
  </g>
  <g id="latch">
    <rect x="204.58" y="449.09" width="25.02" height="63.62" rx="2"
          fill="#3a4045" stroke="#1a1d21" stroke-width="0.8"/>
    <rect x="209.6" y="472.6" width="15" height="30" rx="1.5" fill="#22262a"/>
  </g>
</svg>
