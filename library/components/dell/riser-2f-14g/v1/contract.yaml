  slot-4:
    plan: {at: [-97.9, -13.9]}
    behind: true
    at: [-10.115, 1.82]
    size: [120.02, 21.59]
    accepts: [dell/pcie-filler-fh-14g@1, std/pcie-bracket-fh@1, common/pcie-card-fh@1]
    default: dell/pcie-filler-fh-14g@1
  slot-5:
    plan: {at: [-97.9, -13.9]}
    behind: true
    at: [-10.115, 22.14]
    size: [120.02, 21.59]
    accepts: [dell/pcie-filler-fh-14g@1, std/pcie-bracket-fh@1, common/pcie-card-fh@1]
    default: dell/pcie-filler-fh-14g@1
  slot-6:
