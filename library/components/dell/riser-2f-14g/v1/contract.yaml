    at: [-10.115, 42.46]
    size: [79.2, 18.42]
    accepts: [dell/pcie-filler-lp-14g@1, std/pcie-bracket-lp@1, common/pcie-card-lp@1]
    default: dell/pcie-filler-lp-14g@1
