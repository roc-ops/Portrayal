format: 1
kind: component
name: riser-3-lp-cage-16g
version: 1.0.0
class: riser
profile: server
description: >-
  the riser 3 cage of a 16th-generation 1U PowerEdge (R660) - one low-profile window, slot number 3 printed above it and the riser's latch at the right; shared by risers 3A, 3P, 3Q and 3R
attrs:
  power-absent: not-applicable
provenance:
  power: >-
    NOT APPLICABLE - sheet metal and print; the riser that composes it carries
    the power record.
  why-this-is-its-own-part: >-
    THE METAL IS SHARED AND THE WIRING IS NOT. Dell's riser variants on this
    cage (risers 3A, 3P, 3Q and 3R) differ in which processor and PCIe generation each slot
    carries (ISM table 111), and not in anything the rear face shows - so the
    face is drawn once, here, and each variant composes it, as
    dell/riser-2-fh-plate-14g@1 does for the 14th generation.
  sources: >-
    drawing - the VisioCafe master `R660 3xPCI LP Rear` (r660-3xpci-lp-rear-1), read on the 434 body
    at 22.24 px/mm with y scaled 0.9926 (see dell/psu-1400w-ac-60mm@1,
    provenance/stencil-scale). Facts read, art not traced.
  size: >-
    drawing - 89.80 x 19.80 from rear-face x 272.80, y 2.20: the riser's
    extent between its neighbours on the master, at the height of
    dell/riser-3-blank-16g@1, the plate riser 3's place takes without it.
  features: >-
    drawing - window 278.70..348.70 (notched top-left under its numeral), triangle and 3 at 283.95 and 286.20, the latch 349.6..359.0 - a latch the masters draw only where riser 3 is fitted (the 3 x LP and rear-storage masters), and not on the riser configuration 6 and 8 masters, which put vents there, all in rear-face millimetres.
  numerals: >-
    drawing - THE SLOT NUMBERS ARE PRINTED ON THE RISER, NOT THE CHASSIS: the
    masters move them with the cage (the Gen5 riser 2Q's sit 12 mm right of
    riser 2A's, the full-height risers print theirs beside the window with a
    right-pointing triangle), and the rear-storage master, which has no riser
    2, prints no 1 or 2. Glyph heights 2.5 on the masters; the font is not
    identified.
size: {w: 89.80, h: 19.80}
size-confidence: {w: drawing, h: drawing}
skins: [default]
