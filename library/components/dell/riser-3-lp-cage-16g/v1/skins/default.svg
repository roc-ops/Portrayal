<svg xmlns="http://www.w3.org/2000/svg" width="89.80mm" height="19.80mm" viewBox="0 0 89.80 19.80">
  <!-- riser-3-lp-cage-16g: original art from positions measured on the VisioCafe
       master; facts read, art not traced. The windows are holes: the
       slots are `behind: true`, so a filler shows through them and this
       metal covers its ends. THE CAGE IS ONE NODE, `plate`, which the
       contract stands 20 proud by its outline: its printing and latches
       are inside it so they ride on its front, and the printed triangles
       are polygons, not paths, so they are not read as holes. -->
  <g id="plate">
  <path fill-rule="evenodd" d="M0.30 0.30 H89.50 V19.50 H0.30 Z M12.25 4.30 H15.00 V1.92 H70.93 V19.50 H12.25 Z" fill="#cfd3d7" stroke="#9aa1a8" stroke-width="0.25"/>
    <rect x="76.80" y="0.60" width="9.40" height="19.60" rx="0.3" fill="#5a6066"/>
    <rect x="78.20" y="0.61" width="4.23" height="19.19" rx="0.3" fill="#2b3035"/>
    <g id="silkscreen">
      <text x="14.26" y="3.65" font-family="sans-serif" font-size="3.4" fill="#2b2f33" text-anchor="middle">3</text>
      <polygon points="11.15,2.26 12.59,2.26 11.87,3.47" fill="#2b2f33"/>
    </g>
  </g>
</svg>
