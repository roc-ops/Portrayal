<svg xmlns="http://www.w3.org/2000/svg" width="92.00mm" height="19.80mm" viewBox="0 0 92.00 19.80">
  <!-- riser-3-lp-cage-16g: original art from positions measured on the VisioCafe
       master; facts read, art not traced. The windows are holes: the
       slots are `behind: true`, so a filler shows through them and this
       metal covers its ends. THE CAGE IS TWO NODES. `plate` is the
       cage's face, which the contract stands 1.0 proud by its outline:
       its printing and latches are inside it so they ride on its front,
       and the printed triangles are polygons, not paths, so they are not
       read as holes. `flange-cover` is the metal over the seated card's
       bracket flange, which the contract stands past the wall; it sits
       under the plate, so the flat drawing is the plate's alone. Its
       rectangle is the flange's fold, 1.5 each side, over the flange's
       length (the bay's seat of std/pcie-bracket-lp@1). -->
  <g id="flange-cover">
    <path d="M74.74 1.82 H77.74 V18.43 H74.74 Z" fill="#cfd3d7"/>
  </g>
  <g id="plate">
  <path fill-rule="evenodd" d="M0.30 0.30 H91.70 V19.50 H0.30 Z M9.75 4.30 H17.20 V1.92 H68.43 V19.50 H9.75 Z" fill="#cfd3d7" stroke="#9aa1a8" stroke-width="0.25"/>
    <rect x="79.00" y="0.60" width="9.40" height="19.60" rx="0.3" fill="#5a6066"/>
    <rect x="80.40" y="0.61" width="4.23" height="19.19" rx="0.3" fill="#2b3035"/>
    <g id="silkscreen">
      <text x="16.46" y="3.65" font-family="sans-serif" font-size="3.4" fill="#2b2f33" text-anchor="middle">3</text>
      <polygon points="13.35,2.26 14.79,2.26 14.07,3.47" fill="#2b2f33"/>
    </g>
  </g>
</svg>
