<svg xmlns="http://www.w3.org/2000/svg" width="6.14mm" height="14.54mm" viewBox="0 0 6.14 14.54">
  <!-- What the riser cage mounts to, seen when no cage is fitted. An open ring
       above a ring with a boss in it, one pair per rear bay.
       THEY ARE NOT THE CLIP AND THE CLIP IS NOT THEM. Both occupy this spot in
       different configurations: dell/riser-card-clip-14g@1 when a full-height
       riser 2 or 3 is fitted, this when the bay carries drives instead. The
       previous pass found the clips and deleted these as a misread of them,
       which was half right - the drawings differ because the machines do.
       Geometry carried over verbatim from dell/rear-bay-frame-14g, where it was
       read off the 4 x 2.5 inch and 2 x 3.5 inch rears. -->
  <circle id="ring-upper" cx="3.07" cy="3.07" r="3.07"
          fill="none" stroke="#868d95" stroke-width="0.75"/>
  <circle id="ring-lower" cx="3.07" cy="11.57" r="2.97"
          fill="none" stroke="#868d95" stroke-width="0.75"/>
  <circle id="boss" cx="3.07" cy="11.57" r="0.85" fill="#7d848c"/>
</svg>
