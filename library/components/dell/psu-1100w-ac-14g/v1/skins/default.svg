<svg xmlns="http://www.w3.org/2000/svg" width="90.46mm" height="43.4mm" viewBox="0 0 90.46 43.4">
  <!-- 1100 W AC supply, 14G PowerEdge. 90.46 x 43.4 from the handle pitch
       in ISM figure 8. The HANDLE is the status lamp, not a dot beside
       one - the ISM calls it "an illuminated translucent handle that
       serves as an indicator". The green disc is the printed EPP label
       ground; the wordmark itself is Dell artwork and is not reproduced. -->
  <rect x="0.2" y="0.2" width="90.06" height="43.00" rx="1.0" fill="#8d949c" stroke="#5f666d" stroke-width="0.4"/>
  <!-- the handle IS the indicator: ISM says the supply has "an
       illuminated translucent handle that serves as an indicator" -->
  <rect id="handle" x="4.97" y="11.0" width="5.45" height="26.0" rx="2.4"
        fill="var(--led-color, #e8a33d)" stroke="#9a6a1e" stroke-width="0.35"/>
  <!-- C14 appliance inlet. A C14 is a SHROUDED MALE with the top corners
       cut away - that chamfer is what tells it from a C13 outlet or from
       a BS 1363 socket, and a rounded rectangle with three slots (which
       is what a first draft drew) reads as the latter. Three pins: earth
       above, line and neutral below. -->
  <rect x="14.5" y="8.5" width="30.0" height="26.0" rx="1.2" fill="#1b1f22" stroke="#41474d" stroke-width="0.4"/>
  <path id="inlet" d="M17.5 31.0 V17.4 L20.9 13.2 H38.1 L41.5 17.4 V31.0 Z" fill="#0d0f11" stroke="#6d747a" stroke-width="0.5" stroke-linejoin="round"/>
  <g fill="#b9c0c6">
    <rect x="27.2" y="16.4" width="4.6" height="3.4" rx="0.5"/>
    <rect x="21.4" y="24.2" width="4.6" height="3.4" rx="0.5"/>
    <rect x="33.0" y="24.2" width="4.6" height="3.4" rx="0.5"/>
  </g>
  <!-- release latch -->
  <rect x="47.5" y="10.0" width="5.0" height="24.0" rx="1.2" fill="#c9ced3" stroke="#8b9299" stroke-width="0.35"/>
  <rect x="55.0" y="4.0" width="32.0" height="35.0" rx="1.2" fill="#141719" stroke="#41474d" stroke-width="0.4"/>
  <circle id="fan" cx="71.0" cy="21.5" r="16.0" fill="#0a0c0e" stroke="#3a4045" stroke-width="0.5"/>
  <g stroke="#2c3237" stroke-width="0.8" fill="none">
    <path d="M74.33 22.21 L81.73 31.69"/>
    <path d="M72.85 24.35 L71.38 36.30"/>
    <path d="M70.29 24.83 L60.81 32.23"/>
    <path d="M68.15 23.35 L56.20 21.88"/>
    <path d="M67.67 20.79 L60.27 11.31"/>
    <path d="M69.15 18.65 L70.62 6.70"/>
    <path d="M71.71 18.17 L81.19 10.77"/>
    <path d="M73.85 19.65 L85.80 21.12"/>
  </g>
  <circle cx="71.0" cy="21.5" r="9.4" fill="#e8ebee" stroke="#9aa0a6" stroke-width="0.35"/>
  <path d="M61.6 19.9 A9.4 9.4 0 0 1 80.4 19.9 Z" fill="#1f8b57"/>
  <path d="M62.8 23.7 h16.4 M64.6 26.5 h12.8" stroke="#6d747a" stroke-width="1.5" stroke-linecap="round"/>
</svg>
