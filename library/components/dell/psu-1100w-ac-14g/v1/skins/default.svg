<svg xmlns="http://www.w3.org/2000/svg" width="90.46mm" height="41.8mm" viewBox="0 0 90.46 41.8">
  <!-- 1100 W AC supply, 14G PowerEdge. 90.46 x 43.4 from the handle pitch
       in ISM figure 8. The HANDLE is the status lamp, not a dot beside
       one - the ISM calls it "an illuminated translucent handle that
       serves as an indicator". The green disc is the printed EPP label
       ground; the wordmark itself is Dell artwork and is not reproduced. -->
  <rect x="0.2" y="0.2" width="90.06" height="41.40" rx="1.0" fill="#8d949c" stroke="#5f666d" stroke-width="0.4"/>
  <!-- the handle IS the indicator: ISM says the supply has "an
       illuminated translucent handle that serves as an indicator" -->
  <rect id="handle" x="2.0" y="13.0" width="7.0" height="15.0" rx="1.6"
        fill="var(--led-color, #e8a33d)" stroke="#9a6a1e" stroke-width="0.35"/>
  <!-- C14 appliance inlet, TURNED A QUARTER CLOCKWISE. Two drafts got
       this wrong: the first drew a rounded rectangle with three slots and
       read as a BS 1363 outlet, the second chamfered the TOP corners as an
       upright C14 would. Dell mounts it on its side - the chamfers are on
       the RIGHT and the earth pin sits centre-right with line and neutral
       stacked to its left, which is what figure 9 shows at 4x. The chamfer
       is the whole identity of the part, so which way it faces is not a
       detail. -->
  <rect x="4.6" y="3.6" width="26.0" height="34.8" rx="1.2" fill="#1b1f22" stroke="#41474d" stroke-width="0.4"/>
  <path id="inlet" d="M6.0 5.0 H24.0 L29.0 10.0 V32.0 L24.0 37.0 H6.0 Z" fill="#0d0f11" stroke="#6d747a" stroke-width="0.55" stroke-linejoin="round"/>
  <g fill="#b9c0c6">
    <rect x="14.8" y="15.6" width="3.2" height="1.8" rx="0.35"/>
    <rect x="19.3" y="20.6" width="3.2" height="1.8" rx="0.35"/>
    <rect x="14.8" y="25.6" width="3.2" height="1.8" rx="0.35"/>
  </g>
  <!-- release latch -->
  <rect x="34.0" y="6.0" width="6.0" height="30.0" rx="1.2" fill="#c9ced3" stroke="#8b9299" stroke-width="0.35"/>
  <rect x="49.5" y="4.0" width="33.0" height="33.8" rx="1.2" fill="#141719" stroke="#41474d" stroke-width="0.4"/>
  <circle id="fan" cx="66.0" cy="20.9" r="15.4" fill="#0a0c0e" stroke="#3a4045" stroke-width="0.5"/>
  <g stroke="#2c3237" stroke-width="0.8" fill="none">
    <path d="M69.33 21.61 L76.30 30.68"/>
    <path d="M67.85 23.75 L66.37 35.10"/>
    <path d="M65.29 24.23 L56.22 31.20"/>
    <path d="M63.15 22.75 L51.80 21.27"/>
    <path d="M62.67 20.19 L55.70 11.12"/>
    <path d="M64.15 18.05 L65.63 6.70"/>
    <path d="M66.71 17.57 L75.78 10.60"/>
    <path d="M68.85 19.05 L80.20 20.53"/>
  </g>
  <circle cx="66.0" cy="20.9" r="9.4" fill="#e8ebee" stroke="#9aa0a6" stroke-width="0.35"/>
  <path d="M56.6 19.299999999999997 A9.4 9.4 0 0 1 75.4 19.299999999999997 Z" fill="#1f8b57"/>
  <path d="M57.8 23.099999999999998 h16.4 M59.6 25.9 h12.8" stroke="#6d747a" stroke-width="1.5" stroke-linecap="round"/>
</svg>
