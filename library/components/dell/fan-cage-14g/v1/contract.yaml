format: 1
kind: component
name: fan-cage-14g
version: 2.1.0
class: mechanical
profile: server
description: >-
  The cooling fan cage of a 14G PowerEdge seen from above - the frame across the
  full width of the chassis, between the front drive backplane and the shroud
size: {w: 408.9, h: 71.5, d: 78.08}
provenance:
  size: >-
    measured - Dell's service model, `DELL_R740XD_CoolingfanFrame-1`, the seated
    one of its two poses: face x 12.55..421.45 and top_y 420.62..492.12 in the
    top view's frame (top_y = 713.5 - raw_z; rear at 0).
  depth: >-
    measured - the fans stand on it. A fan is 74.6 tall from cad y 8.72 to
    83.32, so its base is 78.08 below the 86.8 panel, and that is the floor
    this well is drawn to; a fan `in:` it rises its own 74.6 and tops out
    3.48 below the lid, where the model has it. The frame's own top is at
    86.34, effectively the lid line. The first figure here was 3.48 - the top
    of a fan - which is a fine description of what looking down shows and a
    wrong one of where a fan is.
  the-six-fans-are-measured-and-unevenly-spaced: >-
    measured, and the unevenness is REPORTED RATHER THAN REGULARISED, which is
    the opposite of the call made for the mid tray's drives - so the difference
    is worth stating.
    `DELL_R740XD_Coolingfan-1` has six seated poses, each 64.14 x 46.20, at face
    x 16.56, 80.22, 144.24, 225.62, 289.46 and 353.21. The gaps run 63.66,
    64.02, 81.38, 63.84, 63.75: five fans on a ~63.8 pitch and one gap of 81.38
    in the middle.
    THE MID TRAY'S DRIVES WERE REGULARISED BECAUSE FOUR SLOTS IN ONE TRAY HAVE
    ONE PITCH AND A SECOND MEASUREMENT OF THE SAME TRAY AGREED. Here there is no
    second measurement and no pitch to regularise TO: two banks of three either
    side of a wider centre is a perfectly ordinary way to build a 2U fan wall,
    and forcing six fans onto an even pitch would invent a layout to replace one
    the model actually shows. If it is wrong, it is wrong in a way a photograph
    settles in a second. Those six positions are now the device's fan bays,
    which this part `frames:` - 63.60 wide rather than the 64.14 envelope,
    because the envelopes overlap their neighbours by up to 0.48 mm and slots
    cannot; dell/fan-14g@1 records the reasoning.
  it-is-mechanical-and-not-cooling: >-
    `class: mechanical`, and a test is what settled it. `cooling` is one of the
    five classes this library treats as a body that comes out - psu, fan, tab,
    power, cooling - so anything wearing it must declare `behaviour: fills`, and
    test_the_old_class_list_is_a_subset_of_fills says so.
    THE CAGE DOES NOT COME OUT AND THE FANS DO. This part is the fixed frame the
    fans sit in, so it is mechanical like every other frame in here; `cooling`
    belongs to the fan itself, and will be right on it the day the fans are
    modules in bays rather than artwork on this cage.
  the-fans-are-bays-and-were-artwork: >-
    Version 1 drew six fans on this cage, hub and finger guard and all, and
    said in its own provenance that they ought to be bays. They are: the
    device declares six bays at the measured positions, this part frames them,
    and dell/fan-14g@1 seats in each and pulls individually in the viewer.
    What this art keeps is the FLOOR - six dark slots where a lifted fan came
    from. The rings went with the fans, and they were wrong anyway: a fan seen
    from above shows the top of its housing, not its rotor (ISM Figure 35).
  the-fans-carry-their-own-height: >-
    dell/fan-14g@1 is 74.6 tall and says so in its `size.d`; the well is
    78.08 to the floor; the difference is the 3.48 a seated fan sits below the
    lid. Three numbers, each measured, and none restated.
relief:
  wall: '#2b3035'
elements:
  cage: {at: [0.0, 0.0], size: [408.9, 71.5], class: bezel}
skins: [default]
