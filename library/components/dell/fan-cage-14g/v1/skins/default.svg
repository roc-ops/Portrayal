<svg xmlns="http://www.w3.org/2000/svg" width="408.9mm" height="71.5mm" viewBox="0 0 408.9 71.5">
  <!-- The fan cage from above: the frame, and six slots at the measured fan
       positions. The fans themselves are dell/fan-14g@1 seated in bays the
       device declares over these slots, so what is drawn here is the floor
       a pulled fan leaves behind. Frame and slot positions are measured. -->
  <g id="cage">
    <rect x="0" y="0.0" width="408.9" height="71.5" rx="1.5" fill="#3a4045" stroke="#22262a" stroke-width="1.2"/>
    <rect x="4.64" y="11.5" width="63.6" height="46.2" rx="2" fill="#15181b" stroke="#0f1113" stroke-width="0.8"/>
    <rect x="68.39" y="11.5" width="63.6" height="46.2" rx="2" fill="#15181b" stroke="#0f1113" stroke-width="0.8"/>
    <rect x="132.23" y="11.5" width="63.6" height="46.2" rx="2" fill="#15181b" stroke="#0f1113" stroke-width="0.8"/>
    <rect x="213.61" y="11.5" width="63.6" height="46.2" rx="2" fill="#15181b" stroke="#0f1113" stroke-width="0.8"/>
    <rect x="277.63" y="11.5" width="63.6" height="46.2" rx="2" fill="#15181b" stroke="#0f1113" stroke-width="0.8"/>
    <rect x="341.29" y="11.5" width="63.6" height="46.2" rx="2" fill="#15181b" stroke="#0f1113" stroke-width="0.8"/>
  </g>
</svg>
