format: 1
kind: module
name: r660xs-riser-2-blank
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  The vented plate the PowerEdge R660xs fits where riser 2 is absent (riser configuration 3, riser 1a alone) - one row of twenty-eight vents; an estimate, drawn by analogy with the R660's riser blank
attrs:
  power-absent: not-applicable
provenance:
  power: >-
    NOT APPLICABLE - a vented plate with no electronics. The R660xs ISM,
    technical guide and spec sheet were searched for a blank or filler beside a
    wattage and none gives one.
  identity: >-
    datasheet - ISM table 95 and technical guide table 25: configuration 3 is
    'R1a' alone, one low-profile slot, with riser 2's place left unfilled. The
    ISM's figures draw no cover for it, and no document draws a rear with riser
    2 absent.
  sources: >-
    ESTIMATED, BY ANALOGY - no R660xs figure draws this plate. It is drawn as
    dell/riser-3-blank-16g@1 draws the R660's blank (one row of 4.05 x 4.02 vents
    on a 5.49 pitch, 8.78 down), run across riser 2's band; that part is the
    R660's, measured off a VisioCafe master, and it is borrowed here as a
    pattern and not as a measurement.
  size: >-
    estimated - 170.1 x 19.8, riser 2's band (dell/r660xs-riser-2-cage@1).
  vents: >-
    estimated - twenty-eight, from the R660's pitch across this width.
  depth: >-
    NOT KNOWN; drawn as a plate.
size: {w: 170.1, h: 19.8}
size-confidence: {w: estimated, h: estimated}
skins: [default]
