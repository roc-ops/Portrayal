<svg xmlns="http://www.w3.org/2000/svg" width="113.55mm" height="43.25mm" viewBox="0 0 113.55 43.25">
  <!-- Traced from the vendor service model's own silhouette, not from ISM
       figure 8 - the figure resolves this face at 2.6 px/mm and this is a dark
       part on a dark ground, which is why earlier attempts were abandoned.
       Filling the shell's 9,354 triangles flat gives the outline directly.
       A FRAME, NOT A BAR: the middle rail is what you grab, and it runs into a
       post rising on the LEFT and a leg falling on the RIGHT. The two windows
       clear the low-profile riser slot above and the four NIC ports below.
       The lower window's top-right sweep - 215.5 out to 228.5 over y 67.7 to
       71.2 in face terms - is drawn as one large radius rather than traced. -->
  <path id="frame" fill-rule="evenodd" fill="#2a2d31" stroke="#15181b"
        stroke-width="0.4"
        d="M1.60 0.00 H111.95 A1.60 1.60 0 0 1 113.55 1.60 V41.65 A1.60 1.60 0 0 1 111.95 43.25 H1.60 A1.60 1.60 0 0 1 0.00 41.65 V1.60 A1.60 1.60 0 0 1 1.60 0.00 Z M25.90 5.05 H103.20 A2.50 2.50 0 0 1 105.70 7.55 V18.05 A2.50 2.50 0 0 1 103.20 20.55 H25.90 A2.50 2.50 0 0 1 23.40 18.05 V7.55 A2.50 2.50 0 0 1 25.90 5.05 Z M4.20 24.85 H80.20 A12.00 12.00 0 0 1 92.20 36.85 V37.85 A2.50 2.50 0 0 1 89.70 40.35 H4.20 A2.50 2.50 0 0 1 1.70 37.85 V27.35 A2.50 2.50 0 0 1 4.20 24.85 Z"/>
  <!-- THE RAIL IS ITS OWN NODE because it is its own thing: the frame is what
       clears the riser and the ports, and this is what a person actually holds.
       Naming it is also what lets relief say the rail stands off and the frame
       does not, the day somebody measures that off the hardware. -->
  <g id="rail">
    <rect x="0.4" y="20.85" width="112.75" height="3.95" rx="0.5"
          fill="#2a2d31"/>
    <rect x="1.2" y="21.10" width="111.15" height="0.55" rx="0.27"
          fill="#4a4f55"/>
  </g>
</svg>
