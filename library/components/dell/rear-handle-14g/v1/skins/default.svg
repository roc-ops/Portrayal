<svg xmlns="http://www.w3.org/2000/svg" width="111.69mm" height="41.85mm" viewBox="0 0 111.69 41.85">
  <!-- EXTRACTED, NOT DRAWN. spec/tools/intake/cad-outline.py projects only the
       geometry standing in front of the rear panel - cut at z 713.5, the PSU
       body's front face, which is the one part in this scene known to sit in
       that plane - rasterises it at 16 px/mm and simplifies the contours at
       0.30 mm. An earlier version of this part projected the WHOLE shell,
       flange and all, and came out as a solid frame; a third of this moulding
       is inside the chassis and a face view cannot see any of it.
       Three subpaths: the body, the screw hole in the left block, and the
       small bar at the top right. `evenodd` is what makes the hole a hole.
       DO NOT MEASURE THE 0.30 BACK OFF THIS OUTLINE as though it were a
       chamfer - it is the simplification tolerance. -->
  <!-- THE RELEASE LATCH at this handle's right end, and it is BEHIND the handle
       - drawn before the body so the body's own metal cuts across it, which is
       what the figure shows and what the first version had backwards.
       THE BLUE IS A U OPENING TO THE LEFT, not a closed ring. Closed and
       rounded on the right at face 248.0, with two straight arms running left
       to about 229.75 at y 51.00 and 59.75. Drawn as a stroked centreline
       rather than a filled outline, because a bracket of even wall is what it
       is; a ring drawn as a rectangle with a hole gets the corners wrong.
       INSIDE IT IS A THIN BLACK Y, not an arrow. THE BRANCH ENDS SIT AT 50% OF
       THE LATCH'S WIDTH - face 238.88 on a span of 229.75..248.0 - which is the
       measurement the operator gave, and it is a better one than any position
       for the Y itself: an endpoint on a known span can be checked, where "a
       bit left of centre" cannot. Fork at 235.38, stem back to 233.5, so the Y
       as a whole centres at 35% across.
       The first version put the branch ends at 241.50 and a long stem back to
       232.50, which centred the Y and pushed it right. It was also read as a
       solid left-pointing triangle before that - which is what a Y this thin
       becomes at 4 px/mm once the fork and the stem blur together, right at the
       tip and wrong everywhere else.
       A SHORT BLUE STUB, 1.50 long, sits between the Y's branches and the U's
       rounded end at face 243.05, and it runs VERTICALLY - y 54.63..56.13. It
       went in horizontal first, along the Y's own axis, which is the direction
       everything around it runs and therefore the one that needed checking
       rather than assuming.
       Being blue is what puts it with the moulding rather than with the black
       Y. The colour assigns it, not the position.
       ON THE FAR LEFT, a black plastic piece running top to bottom at face
       229.75..231.75. It reads as a hinge: something flipped out before the
       handle is pulled. THAT FUNCTION IS THE OPERATOR'S READING OF THE
       HARDWARE, not something the figure or the service model states.
       #6785a4, sampled - a third distinct blue on this face, with #7098be on
       the thumbscrews and #5c7b99 on the riser clip. -->
  <g id="latch">
    <rect x="92.02" y="7.4" width="18.25" height="11.25" rx="1.6"
          fill="#232c38"/>
    <path d="M92.77 8.65 H105.27 A4.375 4.375 0 0 1 105.27 17.4 H92.77"
          fill="none" stroke="#6785a4" stroke-width="2.0"
          stroke-linecap="round"/>
    <path d="M95.77 13.03 H97.65 M97.65 13.03 L101.15 10.25 M97.65 13.03 L101.15 15.8"
          stroke="#14161a" stroke-width="1.6" fill="none"
          stroke-linecap="round"/>
    <path d="M105.32 12.28 V13.78"
          stroke="#6785a4" stroke-width="1.4" fill="none"
          stroke-linecap="round"/>
    <rect x="92.02" y="7.4" width="2.00" height="11.25" rx="0.5"
          fill="#17191d"/>
  </g>
  <path id="body" fill-rule="evenodd" fill="#2a2d31" stroke="#15181b"
        stroke-width="0.35"
        d="M79.81 2.69 L79.81 3.94 L89.06 3.94 L89.12 4.50 L110.12 4.50 L110.12 2.69 Z M0.00 0.00 L0.31 19.94 L9.81 19.94 L12.06 19.25 L13.12 18.44 L14.31 16.38 L14.56 10.31 L15.00 10.25 L15.31 21.38 L16.50 23.56 L18.44 24.88 L20.00 25.19 L76.81 25.19 L82.00 25.69 L87.19 27.00 L90.50 28.38 L98.06 33.00 L98.50 41.69 L110.94 41.81 L111.38 41.31 L111.69 25.75 L108.00 21.88 L104.56 19.88 L98.69 18.69 L22.19 18.69 L21.88 4.00 L29.31 3.94 L29.31 2.69 L21.94 2.69 L21.81 0.00 L13.44 0.00 L13.12 0.75 L2.81 0.75 L2.75 0.00 Z M6.50 10.38 L8.19 10.88 L8.94 12.25 L8.44 13.81 L7.19 14.56 L5.81 14.31 L4.75 12.94 L5.00 11.38 Z"/>
  <!-- The captive screws. The LEFT one lands in the outline's own hole, which
       is why that hole is drawn and then covered: the CAD says where the screw
       goes and the screw is what a person sees there. -->
  <g id="screws"><circle cx="6.85" cy="12.60" r="2.35" fill="#5a6067" stroke="#24282c" stroke-width="0.3"/><path d="M5.50 12.60 h2.70 M6.85 11.25 v2.70" stroke="#24282c" stroke-width="0.45" stroke-linecap="round"/><circle cx="103.87" cy="37.05" r="2.35" fill="#5a6067" stroke="#24282c" stroke-width="0.3"/><path d="M102.52 37.05 h2.70 M103.87 35.70 v2.70" stroke="#24282c" stroke-width="0.45" stroke-linecap="round"/></g>
</svg>
