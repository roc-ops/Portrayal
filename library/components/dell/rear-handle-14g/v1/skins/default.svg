<svg xmlns="http://www.w3.org/2000/svg" width="117mm" height="37mm" viewBox="0 0 117 37">
  <!-- The rear handle, measured off the R740 ISM figure 9 at 7.2074 px/mm.
       THREE PARTS AND NOT A SLAB: a screwed block on the left, a bar that runs
       above the four NIC ports, and an arm angling down to the chassis wall. The
       space between them is air - the bounding box is 117 x 37 and the metal
       fills perhaps a third of it, which is why the device declares what this
       part crosses instead of the drawing pretending to a rectangle. -->
  <g fill="#26292d" stroke="#15181b" stroke-width="0.5" stroke-linejoin="round">
    <!-- block, x 133..152 y 43..62 on the face -->
    <path d="M0.4 0.4 H19.4 V19.4 H0.4 Z" rx="1"/>
    <!-- bar above the NIC ports, x 152..232 y 59..68 -->
    <path d="M15.0 16.0 H99.5 V25.0 H15.0 Z"/>
    <!-- arm down to the wall, x 232..250 y 62..80 -->
    <path d="M96.0 19.0 L116.6 33.0 V36.6 H108.0 L92.0 25.6 Z"/>
  </g>
  <!-- the captive screw: a knurled head with a cross slot, which is all the
       figure resolves -->
  <g id="screw">
    <circle cx="9.5" cy="10.5" r="5.1" fill="#3a3f44" stroke="#5f666d"
            stroke-width="0.5"/>
    <circle cx="9.5" cy="10.5" r="3.0" fill="#22262a" stroke="#4a5157"
            stroke-width="0.4"/>
    <path d="M9.5 8.3 V12.7 M7.3 10.5 H11.7" stroke="#7d848a"
          stroke-width="0.7" stroke-linecap="round"/>
  </g>
</svg>
