format: 1
kind: component
name: rear-handle-14g
version: 1.2.0
class: mechanical
profile: compute
# SURFACE-MOUNTED, AND THAT IS A DRAWING FACT AS WELL AS A MECHANICAL ONE.
# render.py draws placements first and bays second, so a placement can never sit
# in front of a bay - which put this handle UNDER the riser plate and the NIC
# card it is bolted over. `behaviour: mounts` defers a part to the second pass,
# "now safely in front of the openings", which is where a handle screwed to the
# outside of the panel belongs. The vocabulary already existed for labels and
# panel screws; a handle is the same kind of claim about how a part attaches.
behaviour: mounts
description: >-
  The moulded rear grab handle of a 14G PowerEdge - a block on the left, a rail
  running right and a leg falling at the far end, bolted over the NIC daughter
  card and the low-profile riser slot, and pulled to draw the chassis out
size: {w: 111.69, h: 41.85, d: 49.59}
provenance:
  a-subpath-was-deleted-on-the-operators-reading: >-
    THE ONE THING IN THIS FILE THAT IS NOT CAD. The extraction produced a
    stair-stepped bar at face 217.54..247.85 by 45.04..46.85 - the "small bar at
    the top right" the skin used to name - and it renders near-black on light
    chassis, reading as an opening the machine does not have. The operator has
    the hardware and says there is no hole there.
    IT WAS INVISIBLE UNTIL RISER 2 CHANGED. That riser plate ran the full 62.0
    and covered this band until it was cut back to face 46.20, the power
    supply top edge. So the contour is not newly wrong; it is newly LOOKED AT,
    and the rest of that projection in this band deserves the same scrutiny.
    If it turns out to be real geometry, the likely fault is tone rather than
    shape - a chassis-coloured flange seen edge-on, not a black bar.
  the-token-is-measured-and-that-is-deliberate: >-
    A VENDOR CAD FILE MEASURED IN SOFTWARE IS `measured`, NOT `drawing`, and the
    precedent is std/sma@1's barrel key, which says it in as many words: it is
    the geometry the vendor ships rather than a reading off artwork. There is no
    `vendor-cad` token and this part does not invent one - what matters
    downstream is that no caliper touched hardware here, and that belongs in the
    source line where a reader will see it, not in an enum value that would have
    to be taught to every consumer.
  size: >-
    measured - Dell's own service model, r740xd.glb, named shell
    `DELL_R740XD_ Rear Handle-1.002`. NOT MEASURED OFF THE FIGURE: ISM figure 8
    resolves this face at 2.6 px/mm and this is a dark part on a dark ground,
    which is why an earlier attempt at this handle was abandoned as too
    approximate rather than recorded badly.
    THE SIZE IS OF WHAT IS VISIBLE, not of the part. The shell's own box is
    113.55 x 43.25 x 74.5; a third of that depth is inside the chassis and does
    not belong in a face view. See the outline key.
  outline: >-
    measured - extracted by spec/tools/intake/cad-outline.py, which projects
    ONLY the geometry standing in front of the panel, rasterises it at 16 px/mm
    and simplifies the contours at 0.30 mm.
    THE CUT PLANE IS z 713.5, the PSU body's front face - the one part in this
    scene known to sit in the panel plane. The handle's own flange agrees: split
    by region, its lower left and bottom edges stop dead at 709.6-709.7 while
    every other region reaches 763, and a region that stops at one z while the
    rest reaches much further IS what bolts to the panel.
    Three subpaths survive: the body, the screw hole in the left block, and a
    small bar at the top right. THE 0.30 IS A SIMPLIFICATION TOLERANCE and must
    not be measured back off this outline as though it were a chamfer.
  the-first-trace-was-the-whole-part: >-
    RECORDED BECAUSE IT LOOKED RIGHT AND WAS NOT. Projecting the entire shell -
    flange, bosses, returns and all - gives a solid frame 113.55 x 43.25 with
    two windows in it, and that frame lints clean, places cleanly and renders
    without complaint. It is simply not the hardware. A face view shows what a
    person standing behind the rack can see, and geometry behind the sheet metal
    is not visible however faithfully it was traced. The region-z table already
    said so - two of seven regions stopping at 709 while the rest reached 763 -
    and it was read straight past.
  the-position-is-checkable-and-checks-out: >-
    THE CAD IS NOT POSED IN X OR Y HERE, and that is not assumed. The full
    shell's lower opening lands at face 138.0-228.5, 67.2-82.7; the R740xd had
    already placed its NDC bay off the figure at 139.6-229.9, 66.4-80.9.
    Agreement to about 1.5 mm between two readings that knew nothing of each
    other is what licenses the rest of these numbers.
  the-release-latch: >-
    photo-measured - THE BLUE IS A U OPENING TO THE LEFT, not a ring. Closed and
    rounded on the right at face 248.00, two straight arms running left to about
    229.75 at y 51.00 and 59.75. Drawn as a stroked centreline, because a
    bracket of even wall is what it is and a filled outline gets the corners
    wrong at this size.
    INSIDE IT IS A THIN BLACK Y, NOT AN ARROW. THE BRANCH ENDS SIT AT 50% OF
    THE LATCH'S WIDTH - face 238.88 on a span of 229.75..248.00 - and that is
    the operator's own measurement. It is a better one than any position for the
    Y itself would have been: an endpoint on a known span can be checked by
    anyone with the drawing, where "a bit left of centre" cannot. Fork at
    235.38, stem back to 233.50, which centres the Y at 35% across.
    An earlier version put the branch ends at 241.50 with a long stem to 232.50,
    centring the Y and pushing it right. The one before that drew a solid
    left-pointing triangle - which is what a Y this thin becomes at 4 px/mm once
    the fork and the stem blur into one another: right at the tip, wrong
    everywhere else. A BLUR TURNS AN OUTLINE INTO A SILHOUETTE, and a silhouette
    read as a solid is the same class of error as a ring read as a disc.
    A SHORT BLUE STUB, 1.50 long, sits between the Y's branches and the U's
    rounded end at face 243.05, and it runs VERTICALLY - y 54.63..56.13. It went
    in horizontal first, along the Y's own axis, because that is the direction
    everything else in this latch runs; which is exactly why the orientation
    needed asking about rather than inheriting. A LENGTH IS NOT AN ORIENTATION,
    and "1.5 long" was recorded as though it were both.
    Being blue puts it with the moulding rather than with the black Y - the
    colour is what assigns it, not the position.
    THE Y IS DRAWN AT 1.60 WALL, twice its first weight. "Very thin" is a
    description of the real part and 0.80 was a literal reading of it, but at
    this scale it rendered spindly against a figure where the Y is one of the
    darkest marks in the latch. The wall is a rendering decision like the ring
    tones on the drive cage; the endpoints either side of it are measurements.
    ON THE FAR LEFT a black plastic piece runs top to bottom, face
    229.75..231.75. It reads as a hinge - flipped out before the handle is
    pulled - and THAT FUNCTION IS THE OPERATOR'S READING OF THE HARDWARE, not
    something the figure or the service model states.
  the-latch-is-behind-the-handle: >-
    It is drawn before this component's own body, so the body's metal cuts
    across its lower edge. The first version drew it after and it sat on top of
    the handle, which put a latch in front of the thing it releases.
    Draw order inside a skin is the only place this can be said - the latch and
    the handle are one component here, so there is no placement order to lean
    on. Anything added to this skin after `body` will float in front of the
    handle whether that is meant or not.
    Blue is Dell's user-serviceable colour, so it is a thing a person pulls
    rather than a moulding - which is how the operator read it from the figure.
    #6785a4, SAMPLED. That makes THREE distinct blues on this one face: #7098be
    for the thumbscrews, #5c7b99 for the riser clip, #6785a4 here. They are the
    same paint under three lightings, and a single library "Dell blue" would
    have flattened all three into one.
    WHAT IS DRAWN IS THE FACE OF IT AND NOTHING ELSE. How far it stands proud
    and which way it travels are not in the figure, and the service model poses
    this handle away from the chassis, so there is no relief feature for it and
    that is a gap rather than a finding.
  depth: >-
    measured - 49.59 proud of the panel plane, and that is the whole point of
    going to the model for this part: a straight-on figure cannot show
    protrusion at all. Nearly two inches, which was queried here as implausible
    and is NOT - the operator's reading is that this handle exists to pull the
    chassis out, and two inches of grip is what that takes. The doubt is
    recorded because it was wrong: a check that says "this cannot be right"
    is only ever a reason to go and ask.
    WHAT IS NOT MODELLED is the section behind that front face. The side
    elevation shows a hooked profile rather than a solid block, so extruding the
    outline is a first approximation and says so here.
  screws: >-
    THE LEFT ONE IS THE CAD'S OWN. The extracted outline's hole subpath encloses
    a centre of 6.85, 12.60 local with a radius of 2.10 - the model saying where
    the screw goes without being asked. The right one has no hole in the model,
    because it fastens into the chassis rather than through the leg, and is
    photo-measured off ISM figure 8 at face 241.6, 79.4.
    BOTH HEADS ARE DRAWN 4.7 ACROSS, measured for the right one and carried to
    the left. A HOLE IS NOT A HEAD: the CAD's 4.20 is the clearance the shank
    passes through, and taking it for the head would have drawn the left screw
    half a millimetre small - the kind of substitution that looks like a
    measurement afterwards.
    NO RELIEF FEATURE. How far these heads sit below the handle's front face is
    not sourced anywhere held here, and the handle already stands 49.59 proud;
    drawing them flush is not a claim that they are.
relief:
  wall: '#15181b'
  features:
  - node: handle-foot-left
    out: 49.59
    color: '#2a2d31'
    confidence: measured
    source: 'measured - Dell service CAD, guide ic140r740xd000202a, node `DELL_R740XD_
      Rear Handle-1.002`. Material was found band by band across the width, asking
      which triangles CROSS each band rather than which vertices fall in it - a
      straight bar has vertices only at its ends, and the vertex form reported a
      35 mm hole through the grip. This band reaches the panel plane and runs out
      to 49.59: it is a foot, bolted flat, and it is what holds the bar off the
      metal.'
  - node: handle-grip
    out: 49.27
    color: '#2a2d31'
    confidence: measured
    source: 'measured - Dell service CAD, guide ic140r740xd000202a, node `DELL_R740XD_
      Rear Handle-1.002`. Material was found band by band across the width, asking
      which triangles CROSS each band rather than which vertices fall in it - a
      straight bar has vertices only at its ends, and the vertex form reported a
      35 mm hole through the grip. This band carries nothing nearer the panel than
      37.21: it is the BAR, and the 37.21 mm behind it is the finger gap the photographs
      show daylight through. It reaches 49.27, so it is 12.06 thick.'
    lift: 37.21
  - node: handle-foot-right
    out: 49.24
    color: '#2a2d31'
    confidence: measured
    source: 'measured - Dell service CAD, guide ic140r740xd000202a, node `DELL_R740XD_
      Rear Handle-1.002`. Material was found band by band across the width, asking
      which triangles CROSS each band rather than which vertices fall in it - a
      straight bar has vertices only at its ends, and the vertex form reported a
      35 mm hole through the grip. This band reaches the panel plane and runs out
      to 49.24: it is a foot, bolted flat, and it is what holds the bar off the
      metal.'
elements:
  body: {at: [0.0, 0.0], size: [111.69, 41.85], class: handle}
  screws: {at: [4.50, 10.25], size: [101.72, 29.15], class: fastener}
