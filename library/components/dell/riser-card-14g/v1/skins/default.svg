<svg xmlns="http://www.w3.org/2000/svg" width="12.8mm" height="170.9mm" viewBox="0 0 12.8 170.9">
  <!-- A riser card from above: the PCB's edge at the outboard side (x high,
       the chassis wall) and the top slot connector on the inboard face.
       Outline and connector position are measured; the connector's own
       art is not. The device mirrors this for a riser at the other wall. -->
  <g id="card">
    <rect x="11.2" y="0" width="1.6" height="170.9" fill="#1f5138" stroke="#123a28" stroke-width="0.3"/>
    <rect x="0" y="34.0" width="11.3" height="91.0" rx="0.6" fill="#14171a" stroke="#0b0d0f" stroke-width="0.3"/>
    <rect x="1.2" y="36.0" width="8.9" height="87.0" rx="0.4" fill="#2a2e33"/>
  </g>
</svg>
