format: 1
kind: module
name: rear-drive-4e3s-2u-16g
version: 1.0.0
class: mechanical
behaviour: fills
profile: server
description: >-
  The 4 x EDSFF E3.S rear drive module of a 16th-generation 2U PowerEdge (R760) - four E3.S drives lying flat, stacked, in riser 3's place
attrs:
  media: e3s
provenance:
  sources: >-
    photo-measured - R760 Installation and Service Manual (ISM) figure 14 (rear view with the 4 x EDSFF E3.S rear drive module, callout 4) at 3.36 px/mm, see dell/riser-1-cage-2u-16g@1/provenance/sources for the scale and tolerance; ISM figures 83 and 84 and table 90 (rear drive bay slot numbers) for what the module is. Facts read, art not traced.
  size: >-
    photo-measured - 128.7 x 44.0, riser 3's extent (figure 14 shows risers 1, 2 and 4 fitted and this module between the BOSS module and riser 4); the dark frame the drives sit in is 84.6 x 38.8 at module-local x 15.3, y 2.8.
  drives: >-
    photo-measured - four carriers lying flat, orange chevrons at the left (the orientation of dell/e3s-carrier@1), 77.7 long (rear-face x 186.3..264.0, the carrier part's 77.65 to 0.1) on a 9.8 pitch, centred at module-local y 7.0, 16.8, 26.7 and 36.4. The figure's carriers read about 6.2 tall against the part's 7.75; the frame overlaps their edges.
  numbering: >-
    datasheet, WITH A GAP - ISM table 90 names the four rear drives Slot 0, 1, 2 and 3 (Bay 0) for both the 12 x 3.5 and the 24 x 2.5 fronts; the table does not say which is on top. The top is taken as 0 (estimated), and the bays are named e3s-0 to e3s-3 for it.
  default-blanks: >-
    EVERY BAY DEFAULTS TO A BLANK, as the fronts do.
  power: >-
    NOT APPLICABLE - sheet metal; the drives carry their own.
size: {w: 128.7, h: 44.0}
size-confidence: {w: photo-measured, h: photo-measured}
