<svg xmlns="http://www.w3.org/2000/svg" width="10.75mm" height="62.0mm" viewBox="0 0 10.75 62.0">
  <!-- The strip of chassis metal between the card retention clips and the riser
       plate. It is IN FRONT of the card - the bracket passes behind it and shows
       again to its left, which is the retention edge an operator sees first -
       and it carries the slot numbers.
       Measured off ISM figure 8 along face y 15: bright metal from 3.50 to
       14.25, with the numerals at 11.75..14.00 at its right-hand end. -->
  <rect id="strip" x="0" y="0" width="10.75" height="62.0" rx="0.8"
        fill="#9aa1a8" stroke="#7d848c" stroke-width="0.3"/>
  <!-- THE 1A STRIP: NO NUMERAL 2. Riser 1A wires slots 1 and 3 and leaves the
       middle opening blanked, and the operator states the middle position
       carries no printed number on that build.
       THIS IS THE ONE THING HERE NOT TAKEN FROM A FIGURE. No figure in either
       document draws a 1A machine - it is the one riser-1 arrangement the
       reference composite omits - so there is nothing to read it off. It is
       recorded on the operator's word, said twice, and is the softest claim in
       this component. Everything else about the strip is photo-measured. -->
  <g id="silkscreen">
    <text x="9.38" y="9.00" font-family="sans-serif" font-size="2.6" text-anchor="middle" fill="#4a5057">1</text>
    <text x="9.38" y="49.00" font-family="sans-serif" font-size="2.6" text-anchor="middle" fill="#4a5057">3</text>
  </g>
</svg>
