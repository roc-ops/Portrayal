name: riser-3p-16g
version: 1.4.0
class: riser
behaviour: fills
profile: server
description: >-
  Dell riser 3P of the PowerEdge R660 - slot 3 on dell/riser-3-lp-gen5-cage-16g@1, fitted in riser configurations 2 and 7
attrs:
  riser: '3P'
  appears-in: 'riser configurations 2 and 7'
  power-absent: not-published
  slot-3: 'x16, low profile, half length, processor 2, PCIe Gen5'
provenance:
  power: >-
    NOT PUBLISHED - the riser is a passive board with connectors. The R660 ISM,
    technical guide and spec sheet were searched for 'riser' beside a wattage
    and none gives one.
  identity: >-
    A REMOVABLE ASSEMBLY THAT BRINGS ITS OWN SLOTS, which is why it is a module
    with `bays` and the slots are not openings on the chassis: the numbers are
    printed on the riser and move with it (see dell/riser-3-lp-gen5-cage-16g@1).
  slots: >-
    datasheet - R660 ISM table 111, which gives each slot's form factor,
    controlling processor, PCIe generation and electrical width, every one on an
    x16 connector; the technical guide's slot table and the spec sheet agree.
    Length: the same two documents give every low-profile slot as half length.
  face: >-
    drawing - composed from dell/riser-3-lp-gen5-cage-16g@1, the metal every riser sharing this
    cage presents. The slot bays sit on that cage's windows.
  size: >-
    drawing - the cage's extent, 92.00 x 19.80.
  seating: >-
    measured - THE SLOTS TAKE CARDS, the brackets and cards the R740xd's risers
    take at the same heights. Each bay is the whole bracket (79.20 low-profile,
    120.02 x 21.59 full-height), `behind` the cage, which covers its ends as
    the hardware does. A BRACKET'S RETENTION TIP IS AT THE CARD'S EDGE
    CONNECTOR, so it points at the riser board. Dell's service model stands
    riser 2's board at rear x 192.4, between its two slots, and riser 3's at
    274.6, left of slot 3: slot 1 is turned over (rotate 180, tip right) and
    slots 2 and 3 are tip-left, and the model's card boards agree - slot 1's
    low, slots 2 and 3 high. Each bracket sits with its 7.74 tip just under
    the cage and its body filling the window, which puts riser 2's at
    121.17..200.37 and 186.67..265.87 against the model's 120.9..200.9 and
    187.0..267.0; the two overlap at depths a millimetre apart, the ends
    interleaving, which is why two brackets fit a 71.8 pitch. A first version
    had the handedness backwards and showed each tip in the window. The
    full-height slots are tip-left where the master draws their plates, the
    tip under the clip. StorageReview's rear photograph of a real R660 (riser
    2Q) shows a two-port QSFP card in slot 1 with its bracket ends under the
    cage.
  body: >-
    THE RISER IS ITS BOARD AND CONNECTORS in 3D, as on the R740xd's risers:
    each a box in `body.boxes`, so ejecting the riser takes them and the
    interior stays visible. Each box says where it comes from.
  plan: >-
    seen from above, the riser is dell/riser-3-plan-16g@1 - its cage as Dell's service
    model places it.
