format: 1
kind: component
name: r960-riser-2-blank
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  The riser 2 blank of the PowerEdge R960 - the vented plate across riser 2's place where no riser 2 is
  fitted (configurations 0-1, 0-2 and 1)
attrs:
  power-absent: not-applicable
provenance:
  power: >-
    NOT APPLICABLE - a plate.
  sources: >-
    ISM "Installing the Riser 2 blank" and "Removing the Riser 2 blank" (figures 115 and 118) name the
    part; the R960 technical guide's figures 7 and 8 (rear views of configurations 0 and 1, 600 ppi, not
    orthographic - read for shape only) show it as one wide plate with two rows of openings.
  size: >-
    photo-measured - riser 2's extent on ISM figure 10, 149.7 x 18.5 (see dell/r960-riser-2@1).
  vents: >-
    estimated - two rows of 26 openings 3.2 x 3.4 on a 5.0 pitch, counted off figure 7.
size: {w: 149.7, h: 18.5}
size-confidence: {w: photo-measured, h: photo-measured}
elements:
  plate:
    at: [0.0, 0.0]
    size: [149.7, 18.5]
    class: bezel
    description: the vented plate over riser 2's empty place
skins: [default]
