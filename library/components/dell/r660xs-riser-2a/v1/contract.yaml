format: 1
kind: module
name: r660xs-riser-2a
version: 1.0.0
class: riser
behaviour: fills
profile: server
description: >-
  Dell riser 2a of the PowerEdge R660xs - slots 2 and 3, low profile, half length, x8 and x8, both on processor 2, on dell/r660xs-riser-2-cage@1; fitted in riser configuration 1
attrs:
  riser: '2a'
  appears-in: 'riser configuration 1'
  power-absent: not-published
  slot-2: 'x8, low profile, half length, processor 2'
  slot-3: 'x8, low profile, half length, processor 2'
provenance:
  power: >-
    NOT PUBLISHED - the riser is a passive board with connectors. The R660xs
    ISM, technical guide and spec sheet were searched for 'riser' beside a
    wattage and none gives one.
  identity: >-
    A REMOVABLE ASSEMBLY THAT BRINGS ITS OWN SLOTS, as dell/r660xs-riser-1a@1.
    ISM figure 78 'Riser 2a' (slots 2 and 3, x8 + x8, LP-HL) and the removal
    procedure (figure 84, shared with riser 2c).
  slots: >-
    datasheet - ISM table 95: R2a is slots 2 and 3, both controlled by processor
    2 (the table's row for configuration 1 lists 'Processor 2' once for the
    pair), low profile, half length, x8 + x8. The mechanical connectors are taken
    as x8 to match; the ISM states widths and no connector. No PCIe generation is
    stated for the riser. THE SLOT NUMBERS ARE DELL'S (2 and 3 here, 1 on riser
    1), not this riser's own count.
  face: >-
    drawing - composed from dell/r660xs-riser-2-cage@1. ISM figure 7 draws this
    riser in the default rear.
  size: >-
    drawing - the cage's extent, 170.10 x 19.80.
  seating: >-
    estimated - as dell/r660xs-riser-1a@1: the brackets are tip left and placed
    so each filler's vent field lands where figure 7 draws it, slot 2's centred
    at rear-face x 188.2 (figure x 726) and slot 3's at 260.2 (figure x 961),
    which puts the brackets at rear-face x 145.5..224.7 and 217.5..296.7 - the
    ends overlap 7.2 mm, interleaved as the R660's slots are.
  plan: >-
    estimated - seen from above, the riser is dell/r660xs-riser-2-plan@1 - its
    cage roof.
size: {w: 170.1, h: 19.8}
size-confidence: {w: drawing, h: drawing}
