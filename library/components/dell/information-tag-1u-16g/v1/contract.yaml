format: 1
kind: component
name: information-tag-1u-16g
version: 1.0.0
class: tab
behaviour: fills
profile: server
description: >-
  The information tag of a 16th-generation 1U PowerEdge (R660) - Dell's
  slide-out label panel, of which the front shows only its dark pull edge
  along the bottom of the drive bays, with a blue touch stripe
attrs: {role: info-tab}
provenance:
  identity: >-
    datasheet - R660 ISM table 1 (item 4 or 5 on every front): "The Express
    Service Tag is a slide-out label panel that contains system information
    such as Service Tag, NIC, MAC address", and the iDRAC secure default
    password where that was ordered; "Locating the Express Service Code and
    Service Tag" puts it on the front and figure 16 draws both sides. Front
    figures 1-3 point their callout at the bottom edge under the right-hand
    drive columns.
  size: >-
    drawing - 63.55 x 2.03 on all three VisioCafe R660 front masters (10 x 2.5,
    8 x 2.5 Smart Flow, no backplane), read at 20 px/mm with y scaled 0.9942: a
    dark edge from x 393.60 to 457.15, y 40.75 to 42.78, cut back on a bevel at
    its left end to 396.10 at the top. Facts read, art not traced.
  stripe: >-
    drawing - a blue stripe 15.20 x 0.33 at x 417.78, y 41.22 on the masters,
    the colour Dell uses for touch points.
  depth: >-
    NOT KNOWN - no document gives the tag's length or how far it slides out, so
    no body is given; the front shows only its edge, and that is all this
    draws.
size: {w: 63.55, h: 2.03}
size-confidence: {w: drawing, h: drawing}
elements:
  tab: {at: [0, 0], size: [63.55, 2.03], class: tab}
skins: [default]
