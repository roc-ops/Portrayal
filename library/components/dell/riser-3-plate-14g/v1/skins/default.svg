<svg xmlns="http://www.w3.org/2000/svg" width="107.59mm" height="41.68mm" viewBox="0 0 107.59 41.68">
  <!-- BAY 1'S PLATE, REFLECTED, WITH TWO WINDOWS INSTEAD OF THREE. This riser
       is at the far end of the chassis and presents its cards facing out the
       other way, so the plate that frames them is the mirror image of riser 1's
       rather than a differently-measured plate of its own.
       Derived from bay 1 rather than re-read off a figure, which is the
       stronger construction: it cannot disagree with the thing it copies. The
       two checks that it is a reflection and not an approximation are that the
       exposed bracket tip is 2.96 at both ends of the chassis, and that the
       flanges swap - bay 1 leaves 2.25 left and 4.74 right, this leaves 4.74
       left and 2.25 right. -->
  <path id="plate" fill-rule="evenodd" d="M1.500 0.300 H106.090 A1.20 1.20 0 0 1 107.290 1.500 V40.180 A1.20 1.20 0 0 1 106.090 41.380 H1.500 A1.20 1.20 0 0 1 0.300 40.180 V1.500 A1.20 1.20 0 0 1 1.500 0.300 Z M7.040 0.500 H103.040 A2.00 2.00 0 0 1 105.040 2.500 V16.500 A2.00 2.00 0 0 1 103.040 18.500 H7.040 A2.00 2.00 0 0 1 5.040 16.500 V2.500 A2.00 2.00 0 0 1 7.040 0.500 Z M7.040 20.820 H103.040 A2.00 2.00 0 0 1 105.040 22.820 V36.820 A2.00 2.00 0 0 1 103.040 38.820 H7.040 A2.00 2.00 0 0 1 5.040 36.820 V22.820 A2.00 2.00 0 0 1 7.040 20.820 Z" fill="#969da4" stroke="#4f565d" stroke-width="0.5"/>
  <!-- The openings keep their ids and stop drawing: render.py hangs each bay's
       data-path on the node with this id, and a stroked rect over a punched
       window draws a second outline just inside it. -->
  <!-- THE LOUVRE ROW between the two windows, on the plate rather than on the
       card - the card is behind this metal, so anything drawn on it here would
       be covered by definition. -->
  <g id="louvres-1">
