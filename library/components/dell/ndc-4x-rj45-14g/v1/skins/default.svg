<svg xmlns="http://www.w3.org/2000/svg" width="90.3mm" height="14.5mm" viewBox="0 0 90.3 14.5">
  <!-- Network daughter card, four RJ45. THE JACKS ARE NOT DRAWN HERE:
       four std/rj45 are composed in the contract, centred on the bezels
       Dell's 2x10gb-bt-2x1gb-ndc stencil master drew. What is left is
       the plate and the eight lamps, which are the card's own - a bare
       modular jack has no lamps, and ISM table 11 gives these their
       codes. Pitch 22.2 from ISM figure 8. -->
  <rect x="0.15" y="0.15" width="90.00" height="14.20" rx="0.6" fill="#8d949c" stroke="#5f666d" stroke-width="0.3"/>
  <g id="port-1-lamps">
    <rect id="lamp-link-1" x="3.60" y="1.9" width="1.7" height="2.6" rx="0.3" fill="var(--led-color, #3a3f44)"/>
    <rect id="lamp-act-1" x="15.64" y="1.9" width="1.7" height="2.6" rx="0.3" fill="var(--led-color, #3a3f44)"/>
  </g>
  <g id="port-2-lamps">
    <rect id="lamp-link-2" x="25.80" y="1.9" width="1.7" height="2.6" rx="0.3" fill="var(--led-color, #3a3f44)"/>
    <rect id="lamp-act-2" x="37.84" y="1.9" width="1.7" height="2.6" rx="0.3" fill="var(--led-color, #3a3f44)"/>
  </g>
  <g id="port-3-lamps">
    <rect id="lamp-link-3" x="48.00" y="1.9" width="1.7" height="2.6" rx="0.3" fill="var(--led-color, #3a3f44)"/>
    <rect id="lamp-act-3" x="60.04" y="1.9" width="1.7" height="2.6" rx="0.3" fill="var(--led-color, #3a3f44)"/>
  </g>
  <g id="port-4-lamps">
    <rect id="lamp-link-4" x="70.20" y="1.9" width="1.7" height="2.6" rx="0.3" fill="var(--led-color, #3a3f44)"/>
    <rect id="lamp-act-4" x="82.24" y="1.9" width="1.7" height="2.6" rx="0.3" fill="var(--led-color, #3a3f44)"/>
  </g>
</svg>
