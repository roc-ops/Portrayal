<svg xmlns="http://www.w3.org/2000/svg" width="63.6mm" height="46.2mm" viewBox="0 0 63.6 46.2">
  <!-- A cooling fan from above. The outline is measured; the housing, the
       AIRFLOW arrow and the release tab are drawn from Figure 35 of the ISM
       and are not measured. The arrow points to the rear (y=0): air goes
       front to back. The tab is on the front edge. -->
  <g id="body">
    <rect x="0" y="0" width="63.6" height="46.2" rx="2" fill="#1e2226" stroke="#0f1113" stroke-width="0.8"/>
    <rect x="3.0" y="3.0" width="57.6" height="34.0" rx="1.5" fill="#262a2f" stroke="#15181b" stroke-width="0.5"/>
  </g>
  <g id="label">
    <rect x="11.8" y="8.0" width="40.0" height="26.0" rx="1" fill="#2f3439" stroke="#1a1d21" stroke-width="0.4"/>
    <path d="M31.8 12.5 L37.73 20.5 L33.93 20.5 L33.93 29.5 L29.67 29.5 L29.67 20.5 L25.87 20.5 Z" fill="#c9ced3"/>
  </g>
  <g id="tab">
    <rect x="20.8" y="39.7" width="22.0" height="5.0" rx="1.2" fill="#e8762b" stroke="#a3501a" stroke-width="0.5"/>
  </g>
</svg>
