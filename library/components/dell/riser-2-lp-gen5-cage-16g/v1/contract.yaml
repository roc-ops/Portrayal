format: 1
kind: component
name: riser-2-lp-gen5-cage-16g
version: 1.0.0
class: riser
profile: server
description: >-
  the Gen5 riser 2 cage of a 16th-generation 1U PowerEdge (R660) - riser 2A's metal, with the printing Dell's Gen5 risers carry: a dark strip over slot 1 with its number and GEN 5, and a plain 2 over slot 2; shared by risers 2P and 2R
attrs:
  power-absent: not-applicable
provenance:
  power: >-
    NOT APPLICABLE - sheet metal and print; the riser that composes it carries
    the power record.
  why-this-is-its-own-part: >-
    THE METAL IS SHARED AND THE WIRING IS NOT. Dell's riser variants on this
    cage (risers 2P and 2R) differ in which processor and PCIe generation each slot
    carries (ISM table 111), and not in anything the rear face shows - so the
    face is drawn once, here, and each variant composes it, as
    dell/riser-2-fh-plate-14g@1 does for the 14th generation.
  sources: >-
    drawing - the VisioCafe master `R660 3xPCI LP Rear` (r660-3xpci-lp-rear-1), read on the 434 body
    at 22.24 px/mm with y scaled 0.9926 (see dell/psu-1400w-ac-60mm@1,
    provenance/stencil-scale). Facts read, art not traced.
  size: >-
    drawing - 163.60 x 19.80 from rear-face x 107.00, y 2.20: the riser's
    extent between its neighbours on the master, at the height of
    dell/riser-3-blank-16g@1, the plate riser 3's place takes without it.
  features: >-
    drawing - windows 129.84..186.60 and 198.52..257.20 (see windows; the masters' filler plates run 122.63..191.30 and 194.41..264.41) (riser 2A's slot 2 is notched top-left under its numeral; this cage's is not - see numerals), the vent block 107.69..118.39, the latch 265.6..270.4, all in rear-face millimetres.
  windows: >-
    THE WINDOW IS THE BRACKET'S FULL-HEIGHT BODY, 56.18 of a low-profile
    bracket's 79.20 (std/pcie-bracket-lp@1: chamfers from the tip to 11.85,
    the keyed step from 68.03), placed where the slot seats it. The masters
    draw Dell's fillers as plain plates 70 wide and the first windows were
    that wide, which showed a card's chamfers and keyed step at both ends and
    stacked two of them at the junction between slots. Every master vent field
    falls inside the narrower window, so a filler reads as before; the margins
    are cage metal of nearly its grey. The R740xd's riser windows are cut the
    same way. ON THE FLANGE END THE WINDOW RUNS 2.50 PAST THE BODY: the
    connector opening ends 2.13 beyond it (CEM: 70.16 from the tip against
    the body's 68.03), and stopping at the body clipped a card's outer port. Slot 1's stops 1.92 short of its bracket's body, at 186.60,
    where slot 2's tip begins: the renderer paints slot 2 over slot 1, and
    a tip in the window was the look this cut removes.
  numerals: >-
    photo - StorageReview's rear photograph of a real R660 in riser
    configuration 2 (R2P + R3P), photos/r660/storagereview-e3s, -E3S-4.jpg:
    THE GEN5 RISER 2 PRINTS ON A STRIP. Over slot 1, a Gen5 slot on both
    risers that use this cage, a dark strip runs the window's width with a
    down-pointing triangle and 1 centred and GEN 5 at its right end; over slot
    2, Gen4 on both, a plain 2 is printed centred over the window on the bare
    metal, with no strip and no triangle, and the window has no notch: its
    top runs straight across at 4.30, the depth of riser 2A's notch. The `1` with a left-pointing triangle that
    dell/riser-2-lp-cage-16g@1 carries between the slots is not there. The
    VisioCafe 3 x LP master draws only the Gen4 riser 2A's print. Glyph
    positions are placed on the windows by eye from a photograph at about 2.5
    px/mm, not measured.
size: {w: 163.60, h: 19.80}
size-confidence: {w: drawing, h: drawing}
relief:
  features:
  - node: plate
    out: 20.0
    shape: true
    color: '#cfd3d7'
    confidence: measured
    source: >-
      Dell's service model r660.glb: riser 2A's cage Body_1_75 begins at plan y -20.0 - 20 mm proud of the rear wall the supplies' faces sit in - and the low-profile brackets 8.2 to 9.2 proud, inside it. Its windows are cut through it, so a card's face is seen down
      them and the bracket's folded flange, 9.4 proud at the end the window
      does not show, is inside the cage, as on the R740xd's riser shrouds.
