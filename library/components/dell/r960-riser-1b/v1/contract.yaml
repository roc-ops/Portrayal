format: 1
kind: module
name: r960-riser-1b
version: 1.0.0
class: riser
behaviour: fills
profile: server
description: >-
  Dell riser 1B of the PowerEdge R960 - three full-height PCIe Gen5 x16 slots, 1, 2 and 3, one above
  the next behind a cage with a blue thumbscrew at its left; fitted in riser configuration 2
attrs:
  riser: '1B'
  appears-in: 'riser configuration 2'
  power-absent: not-published
  slot-1: 'x16, full height, half length, processor 3, PCIe Gen5'
  slot-2: 'x16, full height, half length, processor 1, PCIe Gen5'
  slot-3: 'x16, full height, half length, processor 1, PCIe Gen5'
provenance:
  power: >-
    NOT PUBLISHED - the riser is a passive board with connectors. The R960 ISM, technical guide
    and spec sheet were searched for 'riser' beside a wattage and none gives one.
  identity: >-
    A REMOVABLE ASSEMBLY THAT BRINGS ITS OWN SLOTS (ISM "Removing the expansion card risers",
    figures 110-113), so it is a module with `bays` and the slots are not openings on the chassis.
  slots: >-
    datasheet - R960 ISM table 88 (configuration 2: R1B slot 1 processor 3, slots 2 and 3
    processor 1, all x16 on a x16 connector, full height) and ISM table 13, the technical guide's
    table 16 and the spec sheet's PCIe rows, which agree. Length: half (table 13).
  size: >-
    photo-measured - ISM figure 10 (1565 x 807, 3.374 px/mm across and 3.333 px/mm down): the cage
    18.0..122.1 across and 9.0..72.0 down in rear-face millimetres, and its thumbscrew at (9.5, 24.1) outside it:
    5.0..122.1 with the screw, 117.1 x 63.0.
  face: >-
    photo-measured - three window bands at slot centres 19.5, 39.4 and 59.1 down (a 19.8 pitch
    against PCIe's 20.32, the figure's resolution), each 90.0 wide from 27.0; the thumbscrew at
    (25.8, 24.1). THE RISER PRINTS NO SLOT NUMBERS on figure 10 (the left cage is bare), unlike
    riser 3 and riser 4.
  slot-order: >-
    Slot 1 is the top window, 2 the middle, 3 the bottom: ISM figures 101-103 list them in that
    order and riser 3's printed pairs (5 above 6, 7 above 8) show Dell numbering down the
    cage. Not printed on this cage, so ESTIMATED from the other two.
  depth: >-
    measured - Dell's R960 service model, working/intake/dell/3d-models/r960.glb: `PowerEdge_R960_Riser1_Long` under
    `R960_ Riser 1B_FL` in the `Main Assembly` node is 357.0 long (cad z 525.7 to 882.7). The first pass had 258.0, read off
    ISM figure 12 at 1.86 px/mm. The model names this riser "FL" (full length) where ISM table 13 gives its slots half
    length: both are recorded on the device (`riser-length-model-vs-table-13`).
size: {w: 117.1, h: 63.0, d: 357.0}
size-confidence: {w: photo-measured, h: photo-measured, d: measured}
body:
  depth: 357.0
  color: '#4a5057'
plan: {ref: dell/r960-riser-plan@1}
relief:
  features:
  - node: plate
    out: 1.0
    shape: true
    color: '#cfd3d7'
    confidence: estimated
    source: >-
      estimated - the cage's plate is the rear wall's own sheet metal, and ISM table 7 puts nothing but the supplies'
      handles past the wall; no R960 model or side figure is held. The first pass drew it 20.0 proud, as the R660's
      riser cages (dell/riser-1-fh-cage-16g@1) are in Dell's R660 service model, which stood the cages outside
      the 866.74 chassis
bays:
  slot-1:
    slot: {connector: x16, lanes: 16, height: full, length: half, processor: 3, generation: 5}
    behind: true
    at: [22.0, 1.29]
    size: [90.0, 18.42]
    accepts: [dell/r960-pcie-filler-fh@1]
    default: dell/r960-pcie-filler-fh@1
  slot-2:
    slot: {connector: x16, lanes: 16, height: full, length: half, processor: 1, generation: 5}
    behind: true
    at: [22.0, 21.19]
    size: [90.0, 18.42]
    accepts: [dell/r960-pcie-filler-fh@1]
    default: dell/r960-pcie-filler-fh@1
  slot-3:
    slot: {connector: x16, lanes: 16, height: full, length: half, processor: 1, generation: 5}
    behind: true
    at: [22.0, 40.89]
    size: [90.0, 18.42]
    accepts: [dell/r960-pcie-filler-fh@1]
    default: dell/r960-pcie-filler-fh@1
elements:
  plate: {at: [13.3, 0.3], size: [103.5, 62.4], class: bezel}
skins: [default]
