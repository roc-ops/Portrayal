<svg xmlns="http://www.w3.org/2000/svg" width="85.37mm" height="15.93mm" viewBox="0 0 85.37 15.93">
  <!-- rear-io-board-dlc-16g: the liquid-cooling rear I/O board's bracket as the
       rear window shows it - no VGA, two coolant tubes in round grommets.
       Original art from positions measured on Dell's figures (see the
       contract); the connectors are composed in the contract. -->
  <rect x="0.15" y="0.15" width="85.07" height="15.63" rx="0.4" fill="#cdd1d5" stroke="#9aa1a8" stroke-width="0.25"/>
  <g id="tube-1"><circle cx="58.90" cy="7.97" r="6.8" fill="#16191c"/><circle cx="58.90" cy="7.97" r="5.7" fill="#3a3e42" stroke="#5a5f64" stroke-width="0.3"/><circle cx="58.90" cy="7.97" r="3.6" fill="#232629"/></g>
  <g id="tube-2"><circle cx="77.00" cy="7.97" r="6.8" fill="#16191c"/><circle cx="77.00" cy="7.97" r="5.7" fill="#3a3e42" stroke="#5a5f64" stroke-width="0.3"/><circle cx="77.00" cy="7.97" r="3.6" fill="#232629"/></g>
  <g id="silkscreen">
    <circle cx="11.45" cy="6.74" r="1.45" fill="#2b2f33"/>
    <text x="11.45" y="7.62" font-family="serif" font-size="2.3" font-style="italic" font-weight="bold" fill="#e6e8ea" text-anchor="middle">i</text>
    <text x="7.62" y="13.97" font-family="sans-serif" font-size="2.5" fill="#2b2f33" text-anchor="middle">iDRAC</text>
    <polygon points="11.56,12.31 12.82,13.00 11.56,13.69" fill="#2b2f33"/>
  </g>
</svg>
