format: 1
kind: component
name: pcie-filler-fh-14g
version: 1.1.0
class: bracket
behaviour: fills
profile: server
description: >-
  full-height PCIe slot blanking plate for a 14th-generation PowerEdge - the standard
  bracket with a 15 x 2 vent field punched where a card's connectors
  would be
size: {w: 120.02, h: 21.59}
attrs:
  vent-holes: 30
provenance:
  identity: >-
    A BLANK IS THE SAME BRACKET AS A CARD, with metal where the connectors would
    be and holes in that metal for air. So it composes std/pcie-bracket-fh@1 rather than
    redrawing the outline: the retention tip, the keyed top, the 45 degree
    chamfers and the connector opening all come from the standard. A blank and a
    NIC in adjacent slots therefore cannot drift apart, and a correction to the
    bracket reaches both without either being edited.
  behind-and-why: >-
    THE BRACKET IS COMPOSED *BEHIND* THIS PART'S OWN ART, which is the opposite
    of how a bezel composes an aperture and is the whole difference between the
    two. A bezel FRAMES a hole, so the hole belongs on top of the plate. A
    blanking plate FILLS one: it takes the bracket for its outline and then
    covers the connector opening with vented metal. Composed the default way
    round the bracket's own dark opening draws back over the vents and the plate
    renders as an empty slot - which is exactly what happened, and is why
    `behind` exists at all.
  what-this-part-adds: >-
    ONLY THE VENT FIELD. Everything else on this drawing belongs to the part
    underneath it. An earlier version of this file drew its own plate at the size
    of the connector OPENING - 89.90 rather than 120.02 - which is the mistake
    the standard exists to stop.
  vent-field: >-
    measured - ISM figure 8 at 2.5991 px/mm, read inside riser 1's own connector
    opening: hole width 3.95 mean across fifteen, pitch 5.63 mean (5.00 to 7.70
    across the run, which is the figure's resolution and not a varying pitch),
    and 9.62 from the opening's left edge to the first hole, where the plate's
    end frame and its narrow slot sit. THE ROW COUNT IS FROM THE EYE, NOT THE
    SCAN: at 2.6 px/mm a 4 mm hole is ten pixels and the row profile reads as
    two uneven bands, so it was confirmed at 10x - two rows of rounded squares.
  the-hole-is-not-scaled-for-the-low-profile-plate: >-
    SAME HOLE, SAME PITCH, SAME 9.62 LEAD-IN, fewer of them - 15 columns
    here against fifteen on the full-height plate. A punch tool is not scaled to
    the part it punches, and a vent field that shrank with the bracket would be
    a drawing decision wearing a measurement's clothes.
parts:
  - {ref: std/pcie-bracket-fh@1, id: bracket, at: [0, 0], behind: true}
skins: [default]
