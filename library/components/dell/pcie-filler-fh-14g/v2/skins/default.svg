  <!-- the lone column, outside the frame, in bare metal -->
  <g id="vent-outer"><rect x="111.27" y="7.57" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="111.27" y="12.96" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/></g>
</svg>
