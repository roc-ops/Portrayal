<svg xmlns="http://www.w3.org/2000/svg" width="120.02mm" height="21.59mm" viewBox="0 0 120.02 21.59">
  <!-- pcie-filler-fh-14g: the vent field ONLY. Outline, retention tip, keyed top
       and connector opening are std/pcie-bracket-fh@2, composed BEHIND this. -->
  <rect id="plate" x="19.66" y="6.05" width="90.50" height="12.66" fill="#9aa1a8"/>
  <!-- the plate is metal FILLING the opening, so it is seamless: no
       stroke, the bracket's own colour. Given an outline it read as a
       second rounded rectangle around the vent frame, and the figure
       has one. The frame below has stadium ends and is centred on the
       columns it encloses. -->
  <!-- ROUNDED CORNERS, NOT A STADIUM. rx was 5.76 on an 11.51-high
       rect - exactly half its height, so the ends came out as semicircles.
       The figure shows flat edges and a small corner radius, and 1.40 is the
       one the riser's own openings use. -->
  <rect id="vent-frame" x="25.20" y="6.62" width="83.30" height="11.51" rx="1.40" fill="none" stroke="#5f666d" stroke-width="0.45"/>
  <g id="vents"><rect x="29.70" y="7.57" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="35.09" y="7.57" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="40.48" y="7.57" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="45.87" y="7.57" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="51.26" y="7.57" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="56.65" y="7.57" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="62.04" y="7.57" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="67.43" y="7.57" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="72.82" y="7.57" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="78.21" y="7.57" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="83.60" y="7.57" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="88.99" y="7.57" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="94.38" y="7.57" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="99.77" y="7.57" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="29.70" y="12.96" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="35.09" y="12.96" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="40.48" y="12.96" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="45.87" y="12.96" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="51.26" y="12.96" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="56.65" y="12.96" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="62.04" y="12.96" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="67.43" y="12.96" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="72.82" y="12.96" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="78.21" y="12.96" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="83.60" y="12.96" width="4.23" height="4.23" rx="0.9" fill="#1b1f22"/><rect x="88.99" y="12.96" width="4.23" height="4