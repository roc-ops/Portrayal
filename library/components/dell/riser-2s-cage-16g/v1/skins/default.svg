<svg xmlns="http://www.w3.org/2000/svg" width="163.60mm" height="19.80mm" viewBox="0 0 163.60 19.80">
  <!-- riser-2s-cage-16g: original art from positions measured on the VisioCafe
       master and printing read off a photograph of the real riser; facts
       read, art not traced. The windows are holes: the slots are `behind:
       true`, so a filler shows through them and this metal covers its ends.
       THE CAGE IS ONE NODE, `plate`, stood 20 proud by its outline: its
       printing is inside it, the triangles are polygons, not paths. -->
  <g id="plate">
  <path fill-rule="evenodd" d="M0.30 0.30 H163.30 V19.50 H0.30 Z M22.84 1.92 H79.60 V19.50 H22.84 Z M82.20 1.85 H160.45 V18.20 H82.20 Z" fill="#cfd3d7" stroke="#9aa1a8" stroke-width="0.25"/>
    <rect x="0.69" y="2.58" width="13.94" height="3.70" rx="0.3" fill="#16191c"/>
    <rect x="4.24" y="8.82" width="3.78" height="3.75" rx="0.3" fill="#16191c"/>
    <rect x="4.24" y="14.31" width="3.78" height="3.75" rx="0.3" fill="#16191c"/>
    <rect x="9.77" y="8.82" width="1.62" height="3.75" rx="0.3" fill="#16191c"/>
    <g id="silkscreen">
      <rect x="22.84" y="0.30" width="56.76" height="1.62" fill="#24282c"/>
      <polygon points="49.67,0.68 50.97,0.68 50.32,1.48" fill="#e6e8ea"/>
      <text x="51.52" y="1.66" font-family="sans-serif" font-size="1.7" fill="#e6e8ea">1</text>
      <text x="79.00" y="1.65" font-family="sans-serif" font-size="1.4" fill="#e6e8ea" text-anchor="end">GEN 5</text>
    </g>
  </g>
</svg>
