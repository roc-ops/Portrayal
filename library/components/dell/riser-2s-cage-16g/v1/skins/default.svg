<svg xmlns="http://www.w3.org/2000/svg" width="163.60mm" height="19.80mm" viewBox="0 0 163.60 19.80">
  <!-- riser-2s-cage-16g: original art from positions measured on the VisioCafe
       master and printing read off a photograph of the real riser; facts
       read, art not traced. The windows are holes: the slots are `behind:
       true`, so a filler shows through them and this metal covers its ends.
       THE CAGE IS ONE NODE, `plate`, stood 20 proud by its outline: its
       printing is inside it, the triangles are polygons, not paths. -->
  <g id="plate">
  <path fill-rule="evenodd" d="M0.30 0.30 H163.30 V19.50 H0.30 Z M10.74 1.92 H67.50 V19.50 H10.74 Z M81.30 0.40 H163.00 V19.20 H81.30 Z" fill="#cfd3d7" stroke="#9aa1a8" stroke-width="0.25"/>
    <g id="silkscreen">
      <rect x="10.74" y="0.30" width="56.76" height="1.62" fill="#24282c"/>
      <polygon points="37.57,0.68 38.87,0.68 38.22,1.48" fill="#e6e8ea"/>
      <text x="39.42" y="1.66" font-family="sans-serif" font-size="1.7" fill="#e6e8ea">1</text>
      <text x="66.90" y="1.65" font-family="sans-serif" font-size="1.4" fill="#e6e8ea" text-anchor="end">GEN 5</text>
    </g>
  </g>
</svg>
