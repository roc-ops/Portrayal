format: 1
kind: component
name: riser-2s-cage-16g
version: 1.0.0
class: riser
profile: server
description: >-
  the riser 2S cage of a 16th-generation 1U PowerEdge (R660) - one low-profile Gen5 window for slot 1 and, where riser 2's second slot would be, the opening for the two-drive rear EDSFF E3.S module of riser configuration 9
attrs:
  power-absent: not-applicable
provenance:
  power: >-
    NOT APPLICABLE - sheet metal and print; the riser that composes it carries
    the power record.
  sources: >-
    drawing, at low resolution - ISM figure 13 ('Rear view of the system with
    2 x EDSFF E3.S rear drive module'), a straight-on rear at 2.34 px/mm,
    scaled on the 434.0 body (1016 px) and checked against ISM figure 9, the
    3 x LP rear drawn in the same frame: riser 2A's slot 1 window measures
    129.4..185.6 there against 129.84..186.60 here, and its vent block
    106.6..121.5 against 107.69..121.63. Positions are good to about 0.5 mm.
    Dell's slide reproduced by StorageReview shows the same layout, and ISM
    figure 159 (Riser 2S) shows the drive cage built onto the riser beside
    slot 1.
  size: >-
    estimated - riser 2's cage extent, 163.60 x 19.80, as riser 2A's; figure
    13 shows nothing to the contrary.
  slot-1-window: >-
    drawing - SLOT 1 SITS 12.1 LEFT OF RISER 2A'S: its vent field measures
    117.8..174.4 in rear-face millimetres in figure 13, riser 2A's window
    width shifted 12.1, so the window is 10.74..67.50 on this cage. Figure 13
    shows no vent block at the cage's left end, so none is drawn.
  drive-opening: >-
    drawing - the drive module's dark frame spans 187.2..270.0 in figure 13
    and nearly the full riser height, so the opening is 81.30..163.00 x
    0.40..19.20 on this cage, its left edge 1.1 right of the measured 80.2 so
    it does not uncover slot 1's bracket tip. The carriers measure
    189.9..266.8, centred at cage x 121.35, so they sit at 82.52 (see
    dell/riser-2s-16g@1).
  numerals: >-
    estimated - slot 1 is a Gen5 slot, and Dell's Gen5 risers print a dark strip
    with the slot number and GEN 5 over it (dell/riser-2-lp-gen5-cage-16g@1,
    from a photograph); figure 13 and the slide are too coarse to read riser 2S's own print, so the strip is placed on the measured window.
    Whatever is printed for the drives is not drawn.
size: {w: 163.60, h: 19.80}
size-confidence: {w: drawing, h: drawing}
relief:
  features:
  - node: plate
    out: 1.0
    shape: true
    color: '#cfd3d7'
    confidence: estimated
    source: >-
      estimated - the cage's plate is the rear wall's own sheet metal. The R660 ISM's table 12 (chassis dimensions, PDF page 27) puts the rear wall at Zb and nothing but the supplies' handles past it (Zc less Zb, 35.57 mm); riser 2S is not in Dell's service model. The first pass drew the plate 20 mm proud by analogy with riser 2A's cage, which stood it outside the chassis.
  - node: flange-cover
    out: 10.26
    shape: true
    color: '#cfd3d7'
    confidence: estimated
    source: >-
      estimated - the metal over a seated card's bracket flange, which stands past the wall; the rest of the cage does not. Neither the R660 ISM (table 12, chassis dimensions, PDF page 27, and its riser sections) nor its figures give a depth for a bracket's flange or for the riser's cover over it, and riser 2S is not in Dell's service model. The reach is the smallest that covers the flange: std/pcie-bracket-lp@1's return-flange-depth, 9.40 (PCIe CEM 5.0 figure 11-9, the fold standing out of the face as that part reads it), plus 0.86 for the sheet over it (the CEM's 20 GA bracket stock, the same figure), 10.26. Riser 2A's cover pieces in the model reach 19.3 to 19.8 (see dell/riser-2-lp-cage-16g@1), which this cage does not borrow. The rectangle is the flange's fold, 1.5 each side, over its length.
