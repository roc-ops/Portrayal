format: 1
kind: component
name: riser-2s-cage-16g
version: 1.0.0
class: riser
profile: server
description: >-
  the riser 2S cage of a 16th-generation 1U PowerEdge (R660) - one low-profile Gen5 window for slot 1 and, where riser 2's second slot would be, the opening for the two-drive rear EDSFF E3.S module of riser configuration 9
attrs:
  power-absent: not-applicable
provenance:
  power: >-
    NOT APPLICABLE - sheet metal and print; the riser that composes it carries
    the power record.
  sources: >-
    drawing, at low resolution - the only image of riser configuration 9's rear
    held is a Dell slide reproduced by StorageReview (photos/r660/storagereview-e3s,
    -10.jpg, 'PowerEdge R660 14x E3.S NVMe + 2x E3.S rear'), its rear render at
    about 2.3 px/mm with labels laid over the slots: two E3.S carriers stacked
    in a frame where riser 2's slot 2 would be, slot 1 to their left and slot 3
    to their right. Dell's technical-guide figure of riser 2S (figure 16 in the
    revision expresscomputersystems reproduces) shows the drive cage built onto
    the riser beside slot 1. ISM figure 13 draws the same rear and cannot be
    measured either.
  size: >-
    estimated - riser 2's cage extent, 163.60 x 19.80, as riser 2A's; slot 1's
    window is riser 2A's.
  drive-opening: >-
    estimated - 78.25 x 16.35 at 82.20, 1.85: two 77.65 x 7.75 E3.S carriers
    (std/drive-e3s) stacked with a 0.30 web between them, in the place of riser
    2's slot 2 window. Placed from the slide, not measured.
  numerals: >-
    estimated - slot 1 is a Gen5 slot, and Dell's Gen5 risers print a dark strip
    with the slot number and GEN 5 over it (dell/riser-2-lp-gen5-cage-16g@1,
    from a photograph); the slide is too coarse to read riser 2S's own print.
    Whatever is printed for the drives is not drawn.
size: {w: 163.60, h: 19.80}
size-confidence: {w: drawing, h: drawing}
relief:
  features:
  - node: plate
    out: 20.0
    shape: true
    color: '#cfd3d7'
    confidence: estimated
    source: >-
      estimated by analogy with riser 2A's cage, 20 mm proud in Dell's service
      model; riser 2S is not in the model.
skins: [default]
