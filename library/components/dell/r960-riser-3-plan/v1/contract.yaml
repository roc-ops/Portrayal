provenance:
  size: >-
    measured - Dell's R960 service model, working/intake/dell/3d-models/r960.glb, read with glbparts.py: `ECriser3A(FL)_` under `R960_
    Riser 3A - FL` in the `Main Assembly` node, 134.7 x 356.3 at plan (148.4, 1.1) (plan x = 228.0 - cad x1, plan y = 883.94 - cad z1). The
    model holds the full-length 3A only; 3B and its scale-out wiring share this plan. The first pass read a 104.3 x 258.0 roof off ISM figure 12
    (1.86 px/mm down against 1.81 across): the board runs 30.4 wider and 98.3 longer. The ISM's table 13 gives riser 3 half-length slots
    except 3A's double-width ones: recorded as sources-disagree on the device (`riser-length-model-vs-table-13`).
  is-a-plan: >-
    A plan part: what the top view draws where the rear bay projects the riser.
