<svg xmlns="http://www.w3.org/2000/svg" width="120.5mm" height="2.05mm" viewBox="0 0 120.5 2.05">
  <!-- The strip of chassis metal under riser 1, which covers the bottom card's
       keyed end. A full-height bracket is 21.59 tall on a 20.32 pitch, so each
       one overlaps its neighbour by the 1.27 key - and the BOTTOM one has no
       neighbour below it, so its key runs 2.05 past the riser plate's own
       bottom edge at face 66.00. Without this it showed as a bar beside the
       rivet at 113.58.
       THE GAP IS THE iDRAC'S OPENING. The strip is one piece of metal with the
       jack's aperture cut through it at face 28.60..44.60, which is why it is
       drawn as two rects rather than one: covering that span would paint over
       the jack, since this part draws after the bays. -->
  <rect id="trim-left" x="0" y="0" width="29.10" height="2.05" rx="0.3"
        fill="#9aa1a8" stroke="#7d848c" stroke-width="0.2"/>
  <rect id="trim-right" x="45.10" y="0"
        width="75.40" height="2.05" rx="0.3"
        fill="#9aa1a8" stroke="#7d848c" stroke-width="0.2"/>
</svg>
