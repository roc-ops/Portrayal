<svg xmlns="http://www.w3.org/2000/svg" width="120.5mm" height="2.05mm" viewBox="0 0 120.5 2.05">
  <!-- The strip of chassis metal under riser 1, covering the bottom card's
       keyed end - 21.59 of bracket on a 20.32 pitch leaves 2.05 with no
       neighbour below it to nest into.
       IT IS BROKEN WHERE THINGS PASS THROUGH IT, which is the whole shape of
       this part. The iDRAC's aperture at face 28.60..44.60, and the four rivets
       of the y 68.85 row at 7.03, 50.72, 86.47 and 113.58 - those are pressed
       THROUGH this metal and their heads stand proud of it, so a continuous
       strip drawn after the bays sliced the top off each one.
       Segments, not one rect, for that reason. -->
  <rect id="trim-1" x="0.00" y="0" width="4.93" height="2.05" rx="0.3" fill="#9aa1a8" stroke="#7d848c" stroke-width="0.2"/>
  <rect id="trim-2" x="10.13" y="0" width="18.97" height="2.05" rx="0.3" fill="#9aa1a8" stroke="#7d848c" stroke-width="0.2"/>
  <rect id="trim-3" x="45.10" y="0" width="3.52" height="2.05" rx="0.3" fill="#9aa1a8" stroke="#7d848c" stroke-width="0.2"/>
  <rect id="trim-4" x="53.82" y="0" width="30.55" height="2.05" rx="0.3" fill="#9aa1a8" stroke="#7d848c" stroke-width="0.2"/>
  <rect id="trim-5" x="89.57" y="0" width="21.91" height="2.05" rx="0.3" fill="#9aa1a8" stroke="#7d848c" stroke-width="0.2"/>
  <rect id="trim-6" x="116.68" y="0" width="3.82" height="2.05" rx="0.3" fill="#9aa1a8" stroke="#7d848c" stroke-width="0.2"/>
</svg>
