<svg xmlns="http://www.w3.org/2000/svg" width="121.06mm" height="1.81mm" viewBox="0 0 121.06 1.81">
  <!-- The strip of chassis metal under riser 1, covering the bottom card's
       keyed end - 21.59 of bracket on a 20.32 pitch leaves 2.05 with no
       neighbour below it to nest into.
       IT IS BROKEN WHERE THINGS PASS THROUGH IT, which is the whole shape of
       this part. The iDRAC's aperture at face 28.60..44.60, and the four rivets
       of the y 68.85 row at 7.03, 50.72, 86.47 and 113.58 - those are pressed
       THROUGH this metal and their heads stand proud of it, so a continuous
       strip drawn after the bays sliced the top off each one.
       Segments, not one rect, for that reason.
       IT SPANS THE WHOLE BRACKET, AND CUTTING IT SHORT WAS A MISTAKE. It was
       trimmed to 111.70 because dell/riser-1-shroud-14g@1 starts there and
       stands 17.76 proud - but the shroud ends at y 66.24 and the key runs to
       68.05, so it covers the key ACROSS and not DOWN. A 1.81 mm strip of the
       bottom card's corner showed below the plate for exactly that reason.
       So the fourth rivet, at face 113.58, needs its gap back.
       IT STARTS AT 66.24, NOT 66.00, and that is what keeps it out of the
       shroud. The shroud's lower edge is CAD-measured at 66.24 and this strip
       ran from 66.00, so the two boxes crossed by 0.24 mm and L13 said so -
       correctly, since both are mounted parts. Starting here abuts the shroud
       instead, and the 0.24 mm above is covered by the riser plate's own
       0.5-wide stroke, centred on its 66.00 edge. -->
    <rect id="trim-1" x="0.00" y="0" width="4.93" height="1.81" rx="0.3" fill="#9aa1a8" stroke="#7d848c" stroke-width="0.2"/>
  <rect id="trim-2" x="10.13" y="0" width="18.97" height="1.81" rx="0.3" fill="#9aa1a8" stroke="#7d848c" stroke-width="0.2"/>
  <rect id="trim-3" x="45.10" y="0" width="3.52" height="1.81" rx="0.3" fill="#9aa1a8" stroke="#7d848c" stroke-width="0.2"/>
  <rect id="trim-4" x="53.82" y="0" width="30.55" height="1.81" rx="0.3" fill="#9aa1a8" stroke="#7d848c" stroke-width="0.2"/>
  <rect id="trim-5" x="89.57" y="0" width="21.91" height="1.81" rx="0.3" fill="#9aa1a8" stroke="#7d848c" stroke-width="0.2"/>
  <rect id="trim-6" x="116.68" y="0" width="4.38" height="1.81" rx="0.3" fill="#9aa1a8" stroke="#7d848c" stroke-width="0.2"/>
</svg>
