  trim-2: {at: [10.13, 0.0], size: [18.97, 2.05], class: bezel}
  trim-3: {at: [45.10, 0.0], size: [3.52, 2.05], class: bezel}
  trim-4: {at: [53.82, 0.0], size: [30.55, 2.05], class: bezel}
  trim-5: {at: [89.57, 0.0], size: [22.63, 2.05], class: bezel}
skins: [default]
