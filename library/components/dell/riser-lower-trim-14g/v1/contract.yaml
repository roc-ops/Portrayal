format: 1
kind: component
name: riser-lower-trim-14g
version: 1.1.0
class: mechanical
# IN FRONT OF THE CARD, so it must draw after the bays. A plain placement draws
# before them and the bracket would cover this instead.
behaviour: mounts
profile: compute
description: >-
  The strip of chassis metal below riser 1 on a 14G PowerEdge, covering the
  bottom card's keyed end
size: {w: 121.06, h: 1.81, d: 2.0}
provenance:
  size: >-
    derived - its height is exactly the overhang it has to cover, and that comes
    from geometry rather than from a reading. A full-height PCIe bracket is
    21.59 tall on a 20.32 pitch, so consecutive brackets overlap by the 1.27
    key; the BOTTOM one has no neighbour below it and its key runs past the
    riser plate's bottom edge. Riser 1's plate covers face y 4.00..66.00 and its
    third bracket sits at 46.46..68.05, so 2.05 is exposed. Width spans the
    bracket's own footprint, face -0.46..119.56, rounded out to -0.50..120.00.
  it-is-broken-where-things-pass-through-it: >-
    THE FOUR RIVETS OF THE y 68.85 ROW ARE PRESSED THROUGH THIS METAL and their
    heads stand proud of it, at face 7.03, 50.72, 86.47 and 113.58. Drawn as one
    continuous strip this part sliced the top off every one of them: the rivets
    are chassis decor and paint before components, this draws after the bays, so
    it won over all four. The strip is segments with a gap at each head.
    That is the same ordering fact that has been the answer repeatedly on this
    face - what a part is drawn AFTER decides what it can cover - showing up
    once more as a part covering something it should be pierced by.
    IT SPANS THE BRACKET, AND STOPPING AT 111.70 WAS THE MISTAKE. The reasoning
    was that dell/riser-1-shroud-14g@1 starts there and stands 17.76 proud, so
    it covers the key from that point on. The shroud does start at 111.70 - but
    it ends at y 66.24 and the key runs to 68.05, so it covers the key ACROSS
    and not DOWN, and a 1.81 mm strip of the bottom card's corner showed below
    the plate. Two parts were checked for overlap in x and neither in y.
    Back to 121.06, face -0.50..120.56, which is the moved bracket's own right
    edge; and the fourth rivet at 113.58 has its gap back.
    IT NOW STARTS AT 66.24 RATHER THAN 66.00, height 1.81. Running from 66.00
    put it 0.24 into the shroud's box and L13 reported it - correctly, because
    both are mounted parts and the exemption is only for one-of-each. Abutting
    the shroud's CAD-measured lower edge instead costs nothing: the 0.24 above
    is under the riser plate's own 0.5-wide stroke, centred on its 66.00 edge.
  the-gap-is-the-idrac: >-
    The strip is one piece of metal with the iDRAC jack's aperture cut through
    it, at face 28.60..44.60 - the same span the panel already declares as that
    port's cutout. It is drawn as two rects because this part draws AFTER the
    bays, so a continuous strip would paint over the jack it should be framing.
  it-is-not-measured-and-says-so: >-
    NO FIGURE SHOWS THIS EDGE. At face y 66..68 the riser's bottom, the chassis
    band and the port row all meet within two millimetres, and ISM figure 8
    resolves that at 2.6 px/mm. What is known is that the bottom card's key must
    be covered - it is behind metal on the hardware and was showing here - and
    this is the smallest piece that does it. If a legible photograph turns up,
    the whole band between the riser and the ports should be read properly and
    this part replaced by it.
  depth: >-
    estimated - 2.0 is a sheet-metal thickness, not a measurement.
