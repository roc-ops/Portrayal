<svg xmlns="http://www.w3.org/2000/svg" width="430.8mm" height="168.5mm" viewBox="0 0 430.8 168.5">
  <!-- R960 security bezel: original art; the cells, plate and release button are Dell's service model (see the contract). The
       openings are holes: nothing is drawn in them, so the drives show through. -->
  <defs>
    <pattern id="honey" x="61.8" y="40.05" width="77.0" height="44.45" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#8f8b85" stroke-width="6.9" stroke-linejoin="round">
        <polygon points="-25.63,0 -12.82,-22.2 12.82,-22.2 25.63,0 12.82,22.2 -12.82,22.2"/>
        <polygon points="51.37,0 64.18,-22.2 89.82,-22.2 102.63,0 89.82,22.2 64.18,22.2"/>
        <polygon points="-25.63,44.45 -12.82,22.25 12.82,22.25 25.63,44.45 12.82,66.65 -12.82,66.65"/>
        <polygon points="51.37,44.45 64.18,22.25 89.82,22.25 102.63,44.45 89.82,66.65 64.18,66.65"/>
        <polygon points="12.87,22.2 25.69,0 51.31,0 64.13,22.2 51.31,44.4 25.69,44.4"/>
        <polygon points="12.87,-22.25 25.69,-44.45 51.31,-44.45 64.13,-22.25 51.31,-0.05 25.69,-0.05"/>
        <polygon points="12.87,66.65 25.69,44.45 51.31,44.45 64.13,66.65 51.31,88.85 25.69,88.85"/>
      </g>
    </pattern>
  </defs>
  <g id="plate">
    <rect x="0" y="0" width="430.8" height="168.5" fill="#2b2e32"/>
    <rect x="21.0" y="0.5" width="377.0" height="167.5" fill="url(#honey)"/>
    <rect x="21.0" y="0.5" width="377.0" height="1.2" fill="#8f8b85"/>
    <rect x="21.0" y="166.8" width="377.0" height="1.2" fill="#8f8b85"/>
  </g>
  <rect id="release" x="410.0" y="62.3" width="20.8" height="43.9" rx="2" fill="#4a4f55" stroke="#1d2024" stroke-width="0.4"/>
  <rect id="logo-zone" x="181.0" y="90.0" width="50.0" height="22.0" fill="none" stroke="none"/>
  <circle id="lock" cx="10.5" cy="13.3" r="3.6" fill="#16181a" stroke="#4a4f55" stroke-width="0.6"/>
</svg>
