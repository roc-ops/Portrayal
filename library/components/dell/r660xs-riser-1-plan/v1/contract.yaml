name: r660xs-riser-1-plan
version: 1.0.0
class: mechanical
profile: server
description: >-
  riser 1 of the PowerEdge R660xs (1a, 1b) seen from above - the cage roof over its low-profile card, a window where the board shows through, and the printed RISER 1 strip
provenance:
  sources: >-
    drawing - the PowerEdge R660xs Installation and Service Manual, figure 8
    'Inside the system' (1207 x 1450 px, Dell's render from above), read at
    1.802 px/mm: the chassis's two side walls are 782 px apart (x 207..989) for
    the 434 body. Plan x runs left to right and plan y from the rear wall (figure
    y 110, which the 699.1 front-to-rear depth puts at the front face, y 1370)
    toward the front. Facts read, art not traced.
  size: >-
    ESTIMATED - 84.5 x 165.0: the width is the riser's rear-face extent
    (dell/r660xs-riser-1-cage@1); the depth is where the roof's lower lobe
    ends in the figure (y 415, 169 mm from the wall), less the 4.4 mm the roof
    begins inside it. The OUTLINE IS NOT TRACED: the figure shows an irregular
    plate - a band across the rear, a leg down the outer edge, a ledge across
    the front, and the board's connectors in the space between - and this part
    draws the band, legs and ledge as one rectangle with one window.
  window: >-
    estimated - the 62.0 x 80.0 window is where the figure shows the board and
    the card edge between the legs; its edges are read by eye.
  label: >-
    drawing - the RISER 1 strip, a dark strip 8.6 x 45.5 at plan x 65.0, y 67.0
    from the riser's corner, printed white along its length (figure x 952..967,
    y 239..321).
  is-a-plan: >-
    A plan part: what the top view draws where the rear bay projects the riser.
size: {w: 84.5, h: 165.0}
