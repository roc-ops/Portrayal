format: 1
kind: module
name: r6615-riser-2-blank
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  The riser 2 blank of the PowerEdge R6615 - the vented plate that fills riser 2's place when only riser 3 is fitted (riser configuration 5), one row of twenty-eight vents
attrs:
  power-absent: not-applicable
provenance:
  identity: >-
    datasheet - R6615 ISM figures 129 and 131, 'Installing / Removing the Riser 2
    blank', and the step 'If the risers are not going to be replaced, install
    riser blanks'. Table 98 lists configuration 5, R3P alone, with riser 2's place
    empty.
  face: >-
    ESTIMATED. ISM figure 129 draws the blank as an isometric from above, a long
    plate with a row of slots along it and a tab at one end; nothing held shows
    its rear face straight on. It is drawn as dell/riser-blank-full-16g@1 draws
    the no-riser plate - a plain plate with one row of square vents low on it,
    which that part reads off the R6615's own technical guide figure 6 - cut to
    riser 2's extent, so the vents are the same 4.05 on a 5.49 pitch (twenty-eight
    of them, not counted off the isometric).
  size: >-
    borrowed - 163.6 x 19.8, riser 2's extent on this chassis, as
    dell/riser-2-lp-cage-16g@1 has it.
  depth: >-
    NOT KNOWN; drawn as a plate.
  power: >-
    NOT APPLICABLE - sheet metal.
size: {w: 163.6, h: 19.8}
size-confidence: {w: borrowed, h: borrowed}
skins: [default]
