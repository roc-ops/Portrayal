format: 1
kind: module
name: pcie-filler-fh-16g
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  Vented full-height slot filler of a 16th-generation 1U PowerEdge (R660), lying
  flat on riser 1 or riser 4 - a fifteen-column, two-row vent field
provenance:
  sources: >-
    The VisioCafe R660 rear masters, read on the 434 body at 22.24 px/mm with y
    scaled 0.9926 to 42.8 (see dell/psu-1400w-ac-60mm@1, provenance/stencil-
    scale). Facts read, art not traced. Master `R660 2xPCI FH Rear` (riser configuration 3, R1P + R4P), which
    draws this filler in both slots.
  size: >-
    registry, BODY ONLY - 120.02 x 18.42. A full-height bracket is 120.02 long and
    21.59 overall across (std/pcie-bracket-fh@2, PCIe CEM 5.0 fig 11-5), of which
    18.42 is the body and the rest a keyed top 2.84 long at the flange end. Lying
    flat in this 1U riser, that keyed end is at the left, under riser 1's latch
    hardware in the master, so the part draws the body. The length shows whole:
    the master's slot-1 plate runs 107.0..226.9, 119.9 long, and slot 2's vents
    sit at the same offset in a plate ending at 353.7, 120.0 from where slot 1's
    offset puts its start.
  vents: >-
    drawing - fourteen columns of two, 4.0 square on a 5.497 pitch from 27.08,
    and a fifteenth column at 108.97 past a wider web; rows at 4.46 and 9.95.
    The field sits towards the far end of the bracket, away from its tab.
  depth: >-
    NOT KNOWN; drawn as a plate.
size: {w: 120.02, h: 18.42}
size-confidence: {w: registry, h: registry}
skins: [default]
