format: 1
kind: module
name: pcie-filler-fh-16g
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  Vented full-height slot filler of a 16th-generation 1U PowerEdge (R660), lying
  flat on riser 1 or riser 4 - a fifteen-column, two-row vent field
provenance:
  sources: >-
    The VisioCafe R660 rear masters, read on the 434 body at 22.24 px/mm with y
    scaled 0.9926 to 42.8 (see dell/psu-1400w-ac-60mm@1, provenance/stencil-
    scale). Facts read, art not traced. Master `R660 2xPCI FH Rear` (riser configuration 3, R1P + R4P), which
    draws this filler in both slots.
  size: >-
    registry - 120.02 x 21.59, std/pcie-bracket-fh@2's envelope (PCIe CEM 5.0
    fig 11-5): the 18.42 body from y 3.17 and the keyed flange's step above it,
    drawn tip-left as the standard part is so that the slot's `rotate: 180`
    puts the flange at the left, under riser 1's latch hardware, as the master
    shows. The plate draws the body; the step is under the cage. The length
    shows whole: the master's slot-1 plate runs 107.0..226.9, 119.9 long.
  vents: >-
    drawing - fourteen columns of two, 4.0 square on a 5.497 pitch from 27.08,
    and a fifteenth column at 108.97 past a wider web; rows at 4.46 and 9.95.
    Turned here into the tip-left frame (x' = 120.02 - x - 4.0, rows moved
    down 3.17 with the body); seated turned over it lands where the master
    has it.
  depth: >-
    NOT KNOWN; drawn as a plate.
size: {w: 120.02, h: 21.59}
size-confidence: {w: registry, h: registry}
skins: [default]
