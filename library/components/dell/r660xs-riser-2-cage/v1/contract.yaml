format: 1
kind: component
name: r660xs-riser-2-cage
version: 1.0.0
class: riser
profile: server
description: >-
  the riser 2 cage of the PowerEdge R660xs - two low-profile windows side by side, two small openings at the left and a latch strip at the right; shared by risers 2a, 2d and 2e
attrs:
  power-absent: not-applicable
provenance:
  power: >-
    NOT APPLICABLE - sheet metal; the riser that composes it carries the power
    record.
  why-this-is-its-own-part: >-
    THE METAL IS SHARED AND THE WIRING IS NOT. Risers 2a (slots 2 and 3), 2d and
    2e (slot 2 alone) differ in which slots are wired and how wide (ISM table
    95), and the cage's two windows are the same: Dell's isometric figures 78,
    80 and 81 each show two window positions at the rear end, so a one-slot
    riser's second window is closed by a filler (see
    dell/r660xs-riser-2d@1) and the face is drawn once, here.
  sources: >-
    drawing - the PowerEdge R660xs Installation and Service Manual, figure 7
    'Rear view of the system' (1650 x 344 px, Dell's render), read as
    dell/r660xs-riser-1-cage@1 reads it: x at 3.263 px/mm from the 434 body,
    y rounded to the R660's riser row. Figure 7 draws riser 2a. Facts read, art
    not traced.
  size: >-
    drawing - 170.1 x 19.8 from rear-face x 132.7, y 2.2: from the BOSS riser's
    bracket (figure x 545) to the chassis wall beside PSU 1 (figure x 1100).
  windows: >-
    drawing - window 1 at rear-face x 163.4..218.2 (figure x 645..824) and
    window 2 at 236.3..288.7 (figure x 883..1054), the two openings in which the
    brackets of slots 2 and 3 show; each runs to the plate's lower edge. Their
    widths differ by 2.4 and the figure's resolution is 0.3 mm a pixel, so the
    difference is read, not rounded away.
  left-openings: >-
    drawing - three small square openings, 4.2 mm, two side by side at rear-face
    x 143.4 and 149.6 (figure x 580 and 600) and one below the first; the
    figure shows dark squares in the plate left of window 1 and its stamped
    detail there is not drawn.
  latch: >-
    drawing - the strip at the right end, 4.8 wide, as the R660's riser cages
    carry theirs; the figure shows a tab there and its size is read by eye.
  psu-mark: >-
    drawing - figure 7 prints PSU 1's boxed bolt and the number 1 ON THE
    CAGE'S END STRIP beside the supply, so they are the cage's print and not the
    chassis wall's: the wall behind is hidden by the cage in every build that
    seats it. The glyph forms are original; the bolt and the 1 are ink boxes
    read at figure 7's resolution. The blank that stands for riser 2 in
    configuration 3 and the rear drives of configuration 4 are not drawn with
    this mark, because no figure shows those builds.
  numerals: >-
    drawing - THE FIGURE PRINTS NO SLOT NUMBER on this cage, so none is drawn;
    see dell/r660xs-riser-1-cage@1.
size: {w: 170.1, h: 19.8}
size-confidence: {w: drawing, h: drawing}
skins: [default]
