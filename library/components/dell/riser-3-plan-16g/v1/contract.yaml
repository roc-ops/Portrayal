  rear-wall: >-
    CLIPPED AT THE REAR WALL. The service model's riser assemblies begin 20 mm
    behind the rear wall (cad z1 809.4 against the wall's 789.4) while their
    vertical PCBs stand on the board, so the pose is not a lift-out; whether the
    rear 20 mm is cage the masters cannot show or an offset in the model is not
    settled. Only the part inside the wall is drawn, at the model's own depth,
    which ends the cage 12.7 short of the DIMM row as the model does.
  is-a-plan: >-
    A plan part: what the top view draws where the rear bay projects the riser.
