<svg xmlns="http://www.w3.org/2000/svg" width="11.59mm" height="30.0mm" viewBox="0 0 11.59 30.0">
  <!-- Left control panel, 14G PowerEdge. Five status glyphs that ARE the
       lamps (ISM table 4: drive, temperature, electrical, memory, PCIe),
       the system health / system ID bar, and the iDRAC Quick Sync 2 bar.
       Both bars are buttons as well as indicators. The bar sits FLUSH
       RIGHT - measured, see the module docstring. -->
  <rect x="0" y="0" width="11.59" height="30.0" rx="0.5" fill="#15181b"/>
  <g id="lamp-drive" fill="none" stroke="#8b9299" stroke-width="0.26" stroke-linejoin="round">
    <ellipse cx="2.45" cy="1.97" rx="1.02" ry="0.40"/>
    <path d="M1.43 1.97 v1.56 a1.02 0.40 0 0 0 2.04 0 v-1.56"/>
    <path d="M1.43 2.77 a1.02 0.40 0 0 0 2.04 0" stroke-width="0.20"/>
  </g>
  <g id="lamp-temperature" fill="none" stroke="#8b9299" stroke-width="0.24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.03 7.65 V6.17 a0.42 0.42 0 0 1 0.84 0 V7.65"/>
    <circle cx="2.45" cy="8.21" r="0.66"/>
    <path d="M2.87 6.63 h0.44 M2.87 7.15 h0.44 M2.87 7.67 h0.44" stroke-width="0.18"/>
    <circle cx="2.45" cy="8.21" r="0.26" fill="#8b9299" stroke="none"/>
  </g>
  <g id="lamp-electrical">
    <rect x="1.35" y="10.85" width="2.20" height="2.20" rx="0.38" fill="none" stroke="#8b9299" stroke-width="0.24"/>
    <path d="M2.75 11.23 L1.93 12.07 h0.52 l-0.30 0.72 l0.86 -0.94 h-0.56 Z" fill="#8b9299"/>
  </g>
  <g id="lamp-memory" fill="none" stroke="#8b9299" stroke-width="0.24" stroke-linejoin="round">
    <path d="M1.21 15.63 h2.48 v1.30 h-2.48 Z"/>
    <path d="M1.21 16.93 h0.86 v0.34 h0.76 v-0.34 h0.86" stroke-width="0.22"/>
    <path d="M1.83 15.97 v0.62 M2.45 15.97 v0.62 M3.07 15.97 v0.62" stroke-width="0.18"/>
  </g>
  <g id="lamp-pcie" fill="none" stroke="#8b9299" stroke-width="0.24" stroke-linejoin="round">
    <path d="M1.25 20.09 h1.92 v1.72 h-1.92 Z"/>
    <path d="M1.73 21.81 h0.62 v0.42 h-0.62 Z" fill="#8b9299" stroke="none"/>
    <path d="M3.17 19.85 v2.60" stroke-width="0.34"/>
  </g>

  <!-- the bar: blue above, white below, one moulding, flush with the
       panel edge. Both halves are buttons - ISM tables 5 and 6 both
       say "press". -->
  <rect x="6.94" y="4.85" width="4.30" height="18.30" rx="1.6" fill="#0c0e10" stroke="#4a5157" stroke-width="0.22"/>
  <rect id="lamp-health" x="7.59" y="5.40" width="3.00" height="9.00" rx="1.3" fill="#1e3a5f"/>
  <rect id="lamp-quicksync" x="7.59" y="14.70" width="3.00" height="8.20" rx="1.3" fill="#3a3f44"/>

  <!-- printed marks, NOT lamps: they say what the bar beside them means.
       The ISM lists three items on this panel and neither of these is
       one of them. -->

  <!-- Dell prints a STYLIZED ITALIC i, not an upright one: a slanted dot
       over a leaning stem that curls right at the foot. ISM fig-0014 shows
       it circled and fig-0010 shows it on this panel. A plain bar and dot
       read as a generic info mark and not as this one. -->
  <g fill="none" stroke="#8b9299" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.39 2.40 L8.87 3.90 C8.93 4.27 9.51 4.31 9.81 3.97" stroke-width="0.62"/>
  </g>
  <ellipse cx="9.51" cy="1.77" rx="0.40" ry="0.31" fill="#8b9299" transform="rotate(-16 9.51 1.77)"/>
  <g fill="none" stroke="#8b9299" stroke-linecap="round">
    <path d="M7.51 25.10 A1.95 1.95 0 0 1 10.67 25.10" stroke-width="0.3"/>
    <path d="M8.02 25.47 A1.32 1.32 0 0 1 10.16 25.47" stroke-width="0.28"/>
    <path d="M8.52 25.84 A0.70 0.70 0 0 1 9.66 25.84" stroke-width="0.26"/>
  </g>
</svg>
