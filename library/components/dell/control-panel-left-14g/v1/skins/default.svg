<svg xmlns="http://www.w3.org/2000/svg" width="8.6mm" height="30.0mm" viewBox="0 0 8.6 30.0">
  <!-- Left control panel, 14G PowerEdge. Five status glyphs that ARE the
       lamps (ISM table 4: drive, temperature, electrical, memory, PCIe),
       the system health / system ID bar, and the iDRAC Quick Sync 2 bar.
       Both bars are buttons as well as indicators. -->
  <rect x="0" y="0" width="8.6" height="30.0" rx="0.5" fill="#15181b"/>
  <g id="lamp-drive" fill="none" stroke="#8b9299" stroke-width="0.22">
    <ellipse cx="2.10" cy="1.88" rx="0.86" ry="0.34"/>
    <path d="M1.24 1.88 v1.42 a0.86 0.34 0 0 0 1.72 0 v-1.42"/>
  </g>
  <g id="lamp-temperature" fill="none" stroke="#8b9299" stroke-width="0.22" stroke-linecap="round">
    <path d="M2.10 6.20 v1.35"/>
    <circle cx="2.10" cy="7.92" r="0.52"/>
    <path d="M1.76 6.20 a0.34 0.34 0 0 1 0.68 0"/>
  </g>
  <g id="lamp-electrical">
    <rect x="1.10" y="10.80" width="2.0" height="2.0" rx="0.34" fill="none" stroke="#8b9299" stroke-width="0.22"/>
    <path d="M2.32 11.18 l-0.72 0.86 h0.52 l-0.30 0.72 l0.78 -0.90 h-0.54 Z" fill="#8b9299"/>
  </g>
  <g id="lamp-memory" fill="none" stroke="#8b9299" stroke-width="0.20" stroke-linejoin="round">
    <path d="M2.10 15.44 l1.05 0.42 l-1.05 0.42 l-1.05 -0.42 Z"/>
    <path d="M2.10 16.08 l1.05 0.42 l-1.05 0.42 l-1.05 -0.42 Z"/>
    <path d="M2.10 16.72 l1.05 0.42 l-1.05 0.42 l-1.05 -0.42 Z"/>
  </g>
  <g id="lamp-pcie" fill="none" stroke="#8b9299" stroke-width="0.22" stroke-linejoin="round">
    <path d="M1.10 20.14 h2.0 v1.50 h-2.0 Z"/>
    <path d="M1.68 21.64 h0.84 v0.34 h-0.84 Z"/>
  </g>

  <!-- the bar: blue above, white below, one moulding. Both halves are
       buttons too - ISM tables 5 and 6 both say "press". -->
  <rect x="3.70" y="5.00" width="2.90" height="18.00" rx="1.15" fill="#0c0e10" stroke="#2a2e32" stroke-width="0.18"/>
  <rect id="lamp-health" x="4.00" y="5.40" width="2.30" height="9.00" rx="1.0" fill="#1e3a5f"/>
  <rect id="lamp-quicksync" x="4.00" y="14.70" width="2.30" height="8.20" rx="1.0" fill="#3a3f44"/>

  <!-- printed marks, NOT lamps: they say what the bar beside them means.
       The ISM lists three items on this panel and neither of these is
       one of them. -->
  <g fill="#8b9299">
    <circle cx="5.15" cy="1.85" r="0.30"/>
    <path d="M4.85 2.55 h0.62 v2.05 h-0.62 Z"/>
  </g>
  <g fill="none" stroke="#8b9299" stroke-width="0.24" stroke-linecap="round">
    <path d="M3.83 24.80 a1.32 1.32 0 0 1 2.64 0"/>
    <path d="M4.29 24.80 a0.86 0.86 0 0 1 1.72 0"/>
    <path d="M4.75 24.80 a0.40 0.40 0 0 1 0.80 0"/>
  </g>
</svg>
