<svg xmlns="http://www.w3.org/2000/svg" width="114.8mm" height="39.1mm" viewBox="0 0 114.8 39.1">
  <!-- The perforated blank over one empty rear storage bay.
       NO ISM FIGURE SHOWS THIS. Figure 8 is the 4 x 2.5 inch rear and figure 9
       the 2 x 3.5 inch, both with drives fitted, so the only source is the
       operator's composite of four rear views. Its third row passes Gate 1 at
       1.25% against a 434 x 86.8 face, which is what makes it measurable rather
       than only proportional - but it is a 220% upscale of a crop of an 800 px
       composite, so the underlying resolution is poor and the hole grid below
       is the softest thing in this file.
       ONE PANEL PER BAY, AND THAT WAS THE QUESTION WORTH ASKING. A smoothed
       perforation scan finds two regions - face 153.2..268.0 and 307.2..423.0 -
       with density falling to 0.00 between them, where the divider and its
       thumbscrew are. One panel spanning both bays could not have been modelled
       per bay, and the bays are independently fittable. -->
  <rect id="plate" x="0.3" y="0.3" width="114.2" height="38.5" rx="1.0"
        fill="#c3c7cb" stroke="#8d939a" stroke-width="0.5"/>
  <rect id="inner" x="2.6" y="1.9" width="109.6" height="35.300000000000004" rx="0.6"
        fill="none" stroke="#9ba1a8" stroke-width="0.3"/>
  <!-- 24 x 6 square holes. The COUNT is read off the figure; the hole size and
       pitch are fitted to the field it occupies rather than measured
       individually - at this resolution a single hole is a few pixels. -->
