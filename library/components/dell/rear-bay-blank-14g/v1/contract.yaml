format: 1
kind: module
name: rear-bay-blank-14g
version: 1.0.0
class: mechanical
behaviour: fills
profile: server
description: >-
  The perforated blank over one empty rear storage bay on a 14G PowerEdge -
  fitted where a riser configuration allows rear drives and none are ordered
size: {w: 114.8, h: 39.1, d: 12.0}
provenance:
  what-it-closes: >-
    ISM table 25 names three riser configurations "with or without rear storage"
    - 0, 1 and 2. This is the WITHOUT: the bay is there, the riser 2 that would
    have blocked it is the one-slot low-profile kind, and no drives were
    ordered. The opening gets a vented panel rather than being left as a hole.
    A drawing that showed bare metal there would be showing a machine with a
    gap in it, which is the same reason dell/riser-2-3-blank-14g exists.
  size: >-
    photo-measured, and from a SOFT SOURCE that is named rather than hidden. No
    ISM figure shows this part - figure 8 is the 4 x 2.5 inch rear and figure 9
    the 2 x 3.5 inch, both with drives fitted. The only source held is the
    operator's composite of four rear views.
    IT PASSES GATE 1, which is what makes it usable: its third row measures
    1.25% against a 434 x 86.8 face. But it is a 220% upscale of a crop of an
    800 px composite, so the resolution underneath is poor and every number here
    should be re-taken from a real figure if one turns up.
    Panel face 153.2..268.0 for bay 2 and 307.2..423.0 for bay 3 - 114.8 and
    115.8, drawn at 114.8 - by y 1.2..40.3.
  one-panel-per-bay: >-
    THE QUESTION THAT DECIDED THE PART. A smoothed perforation scan across the
    face finds TWO regions, 153.2..268.0 and 307.2..423.0, with density falling
    to 0.00 between them where the divider and its thumbscrew sit. So it is one
    blank per bay, not one panel spanning both.
    That matters because the bays are independently fittable: bay 2 can carry
    PCIe while bay 3 carries a blank. A single spanning panel could not have
    been modelled per bay and would have forced the two bays to agree.
  the-hole-grid-is-the-softest-thing-here: >-
    24 columns by 6 rows. THE COUNT IS READ; the hole size and pitch are FITTED
    to the field they occupy rather than measured one by one, because at this
    resolution a single hole is a few pixels across. Hole 3.40 x 4.00 on a
    4.475 x 5.317 pitch, field starting at local 4.2, 3.3.
    Recorded as a fit rather than a measurement so nobody later takes 4.475 off
    this file as though a caliper had produced it.
  depth: >-
    estimated - 12.0. Nothing dimensions it; a blanking panel sits roughly where
    the drive faces would, and that is the reasoning rather than a reading.
elements:
  perforations: {at: [4.2, 3.3], size: [106.1, 32.5], class: vent}
skins: [default]
