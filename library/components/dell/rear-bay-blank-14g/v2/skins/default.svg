<svg xmlns="http://www.w3.org/2000/svg" width="135.19mm" height="39.5mm" viewBox="0 0 135.19 39.5">
  <!-- THE PANEL IS THE BAY, NOT THE HOLE FIELD. v1 was 114.8 wide because the
       perforation scan returned face 153.2..268.0 and that reading was used as
       the panel size - then the holes were inset 4.2 INSIDE it, so the drawn
       field ended up 8.7 mm narrower than the thing that had been measured. One
       reading doing two jobs, and both wrong.
       The panel is what closes the bay opening, and the frame's own path gives
       that exactly: the divider sits at local 135.19..152.00 in a 287.18-wide
       frame, leaving 135.19 to its left and 135.18 to its right. The two bays
       are the same size to a hundredth of a millimetre, which is the check -
       any answer making them different widths would be wrong on its face. -->
  <rect id="plate" x="0.3" y="0.3" width="134.59" height="38.90" rx="1.0"
        fill="#c3c7cb" stroke="#8d939a" stroke-width="0.5"/>
  <rect id="inner" x="2.6" y="1.6" width="129.99" height="36.30" rx="0.6"
        fill="none" stroke="#9ba1a8" stroke-width="0.3"/>
  <!-- THE ROW PITCH IS MEASURED AND THE COLUMN PITCH IS NOT, and they are
       recorded differently for that reason. Six hole rows start at y 5.50,
       11.00, 16.50, 22.00, 27.50 and 33.00 on the reference - a 5.50 pitch with
       no scatter at all - and 5 x 5.50 + 4.00 = 31.50 reproduces the measured
       field height exactly.
       ACROSS, THE IMAGE CANNOT SETTLE IT. Counting dark runs along a hole band
       returns 24 holes in bay 2 and 22 in bay 3, at a pitch whose standard
       deviation is 1.37 on a mean of 5.7, with runs detected outside the field.
       That is a failed measurement, not a soft one. The count stays at 24 from
       the original read and the pitch is FITTED to the field width. -->
  <g id="perforations" fill="#1b1f23">
    <rect x="9.94" y="2.60" width="3.4" height="4.0" rx="0.55"/>
    <rect x="14.81" y="2.60" width="3.4" height="4.0" rx="0.55"/>
