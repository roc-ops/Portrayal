profile: server
description: >-
  Dell riser 4R of the PowerEdge R760 - slots 7 and 8 on dell/riser-4-cage-2u-16g@1, Gen5, with the SNAPI-capable slot 7; fitted in riser configurations 4, 9 and 10
attrs:
  riser: '4R'
  appears-in: 'riser configurations 4, 9 and 10'
  power-absent: not-published
  slot-7: 'x16 (x8+x8 SNAPI), full height, half length, processor 1 and 2 (processor 1 in the single-processor configurations), PCIe Gen5'
  slot-8: 'x8, full height, half length, processor 2, PCIe Gen5'
provenance:
  power: >-
    NOT PUBLISHED - the riser is a passive board with connectors. The R760 ISM,
    technical guide and spec sheet were searched for 'riser' beside a wattage
    and none gives one.
  slots: >-
    datasheet, WITH A DISAGREEMENT - R760 ISM table 153 lists R4R with slot 7 only: Gen5 x16 on processors 1 and 2 in configuration 4-1, Gen5 x8 on processor 1 in configurations 9 and 10-1. Table 18 gives R4R a SNAPI slot 7 (x8+x8, Gen5) and a slot 8 (x8, Gen5), and ISM figure 222 labels two slots, 7 and 8. The configuration tables are followed for slot 7's width and processor (x16, processor 1 here, the dual-processor build being the one that adds processor 2), and table 18 and figure 222 for slot 8's existence; the width the single-processor builds give slot 7 (x8) is in the attrs, not the slot record. Slot 7 is the lower, slot 8 the upper.
  face: >-
    photo-measured - composed from dell/riser-4-cage-2u-16g@1, the same face as the other riser 4 variants.
  seating: >-
    estimated - as dell/riser-4b-2u-16g@1.
  size: >-
    photo-measured - the cage's extent, 137.3 x 44.0.
