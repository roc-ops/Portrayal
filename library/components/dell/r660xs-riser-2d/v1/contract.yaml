format: 1
kind: module
name: r660xs-riser-2d
version: 1.0.0
class: riser
behaviour: fills
profile: server
description: >-
  Dell riser 2d of the PowerEdge R660xs - slot 2, low profile, half length, x8, PCIe Gen5, on processor 1, with a signal and a power cable to the system board, on dell/r660xs-riser-2-cage@1 with its second window closed by a filler; fitted in riser configuration 5
attrs:
  riser: '2d'
  appears-in: 'riser configuration 5'
  power-absent: not-published
  slot-2: 'x8, low profile, half length, processor 1, PCIe Gen5'
provenance:
  power: >-
    NOT PUBLISHED - the riser is a passive board with connectors. The R660xs
    ISM, technical guide and spec sheet were searched for 'riser' beside a
    wattage and none gives one.
  identity: >-
    A REMOVABLE ASSEMBLY THAT BRINGS ITS OWN SLOT, as dell/r660xs-riser-1a@1.
    ISM figure 80 'Riser 2d' (a signal cable connector, slot 2 x8 LP-HL and a
    power cable connector) and the removal procedure (figure 85).
  slots: >-
    datasheet - ISM table 95: R2d is slot 2, controlled by processor 1 (the
    table says 'Processor 1' where R2a and R2e say 'Processor 2'), low profile, half length,
    x8, and the table marks it 'Gen5'. The mechanical connector is taken as x8 to
    match; the ISM states a width and no connector.
  face: >-
    estimated - THE SECOND WINDOW IS CLOSED BY A FILLER AND THAT IS READ OFF AN
    ISOMETRIC, not off a rear: ISM figure 80 draws a cage with two window
    positions at its rear end and one card in it, and no figure draws a rear with
    riser 2d fitted. The cage is dell/r660xs-riser-2-cage@1, slot 2 in its first
    window and the filler (`cover-3`, in the position slot 3 takes on riser 2a)
    in its second. The cage's width is riser 2a's, which the figure's
    perspective cannot confirm.
  size: >-
    drawing - the cage's extent, 170.10 x 19.80.
  seating: >-
    estimated - as dell/r660xs-riser-2a@1.
  plan: >-
    estimated - seen from above, drawn as riser 2a (dell/r660xs-riser-2-plan@1);
    figure 80 shows a smaller board and no figure shows it from above.
