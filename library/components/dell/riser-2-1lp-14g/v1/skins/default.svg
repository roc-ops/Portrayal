<svg xmlns="http://www.w3.org/2000/svg" width="95.0mm" height="20.0mm" viewBox="0 0 95.0 20.0">
  <!-- riser 2, one-slot variant: the SHORT plate that sits under the rear
       drive bays in the 4 x 2.5 machine, not a tall one with holes left
       out. One low-profile window; the bracket behind it is 79.20 and
       starts left of this plate - see `insert`. -->
  <!-- THE PLATE IS THE FACE'S OWN SILVER AND CARRIES NO OUTLINE. It is
       95 wide against a 79.20 bracket, so 16 mm of it shows past the
       bracket - which read as a dark rectangle corresponding to nothing
       on the machine. Deleting it was worse: a bay with nothing over it
       renders as a hole, so the grey box became a black one. It is sheet
       metal, the same metal as the face, and now looks like it. -->
  <rect x="0.3" y="0.3" width="94.4" height="19.4" rx="1.2" fill="#9aa1a8"/>
  <rect id="slot-4" x="2.5" y="0.46" width="54.53" height="12.06" rx="1.4" fill="none" stroke="#454b51" stroke-width="0.35"/>
</svg>
