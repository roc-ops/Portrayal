format: 1
kind: module
name: riser-2-1lp-14g
version: 1.1.0
class: riser
behaviour: fills
profile: server
description: >-
  PCIe expansion card riser for a 14th-generation PowerEdge - the one-slot
  variant, a short plate carrying a single low-profile slot
attrs:
  supported-risers: '2B and 2C'
provenance:
  identity: >-
    A REMOVABLE ASSEMBLY THAT BRINGS ITS OWN SLOT, which is why it is a module
    with a bay rather than an opening drawn on the chassis.
  it-is-a-short-plate-and-that-is-the-point: >-
    THIS USED TO BE 95 x 62, the same outline as the three-slot riser with two of
    its holes left out, and that put the plate straight through the two rear
    drive bays above it. ISM figure 8 shows why: in the 4 x 2.5 machine the top
    of riser 2's column IS the drive bays and this riser is the band underneath
    them. L13 reported the collision twice and it was a real one - metal through
    metal, not two bounding boxes at different heights.
    THE SLOT DID NOT MOVE. A bay at y 46.0 plus this plate's local 0.46
    is 46.46, which is where the three-slot riser puts its own low-profile slot,
    and that agreement is the check that the rearrangement changed nothing.
  the-slot-holds-the-standard-bracket: >-
    std/pcie-bracket-lp is 79.20 long and its connector opening is 54.53, so
    15.63 of it runs on past the opening at the tip end - behind this plate's own
    sheet, which is why a face-on reading never sees it. The bay is positioned by
    the OPENING and x comes out negative, at -13.13: the bracket starts to the left
    of the plate's own edge. Sliding it to zero to avoid the minus sign would
    move the opening, which is the one thing that must not move.
  size: >-
    size is 95.0 x 20.0, the plate the skin draws; insert is 95.0 x
    18.42, what a slot has to reserve. The width and the slot's place come from
    the three-slot riser this is cut down from, whose plate and 20.32 pitch are
    read off the R740 ISM figure 9 at Gate 1 0.26%.
  the-78.0-reading-is-still-unresolved: >-
    The slot was 78.0 wide before any of this. An LP connector opening is 54.53
    and an LP bracket is 79.20, so 78.0 is 23 mm from the opening and within a
    millimetre of the bracket - it appears to have been measured as a BRACKET
    while the full-height slots beside it were measured as OPENINGS, at the same
    x, which cannot both be true of one drawing. Placed by its opening here, and
    the 78.0 recorded rather than quietly kept.
size: {w: 95.0, h: 20.0}
insert: {w: 95.0, h: 18.42}
bays:
  slot-4:
    at: [-13.13, -2.72]
    size: [79.2, 18.42]
    accepts: [std/pcie-bracket-lp@1]
    default: std/pcie-bracket-lp@1
skins: [default]
