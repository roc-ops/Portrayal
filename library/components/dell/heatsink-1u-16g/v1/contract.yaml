name: heatsink-1u-16g
version: 1.0.0
class: mechanical
behaviour: mounts
profile: server
description: >-
  The 1U processor heatsink of a 16th-generation PowerEdge (R660) seen from above - a finned block over each socket
provenance:
  sources: >-
    Dell's R660 service model, working/intake/dell/3d-models/r660.glb, read with glb-parts.py and mapped to plan coordinates (rear at y=0: plan y = 789.4 - cad z1, the rear wall at cad z 789.4; plan x = 217.65 - cad x - w, the body seen from above). Only the poses inside the chassis' 0..43 height are seated; the scene also holds exploded copies above it.
  size: >-
    measured outline - the seated socket retention plate under each heatsink
    (`Body_197.004`, `3DGeom~19374.002`) is 82.1 x 119.1 at plan x 75.2 and
    278.0, y 266.7, and the heatsink seats on it.
  height: >-
    NOT MEASURED. The scene carries the socket and retention parts and no finned
    block that could be read as the heatsink, so no height is stated. TG table 34
    gives two air-cooled heatsinks - standard to 185 W, L-type above - and they
    are not distinguished here.
  fins: >-
    drawn and not measured.
size: {w: 82.1, h: 119.1}
size-confidence: {w: measured, h: measured}
elements:
  block: {at: [0.0, 0.0], size: [82.1, 119.1], class: bezel}
