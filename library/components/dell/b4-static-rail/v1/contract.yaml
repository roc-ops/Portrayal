format: 1
kind: component
name: b4-static-rail
version: 1.0.0
class: mount
behaviour: mounts
profile: server
description: >-
  The ReadyRails static rail (Dell rail identifier B4) of the PowerEdge R740 and R740xd, two to a
  kit. A stab-in static rail for four-post racks and for two-post racks, flush or centre mount.
  The chassis does not slide out on it. It takes no cable management arm. Drawn as a plain
  plate: no source page dimensions the rail's section.
size: {w: 20.0, h: 43.5}
size-confidence: {w: estimated, h: estimated}
provenance:
  model: >-
    datasheet - the Dell PowerEdge R740 and R740xd Technical Guide (July 2019), "Rack rails",
    printed pages 51 to 52: "Static Rails for 4-post & 2-post Racks", stab-in installation,
    Figure 16 "Static rails in 2-post center mount configuration".
  size: >-
    estimated - NO SOURCE PAGE DIMENSIONS THIS PART. 20.0 by 43.5 mm is a placeholder envelope for
    the rail seen end on; the guide and the matrix print the rail's depth in the rack, which
    belongs to the kit, and no section.
