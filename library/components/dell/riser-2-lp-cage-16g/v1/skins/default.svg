<svg xmlns="http://www.w3.org/2000/svg" width="163.60mm" height="19.80mm" viewBox="0 0 163.60 19.80">
  <!-- riser-2-lp-cage-16g: original art from positions measured on the VisioCafe
       master; facts read, art not traced. The windows are holes: the
       slots are `behind: true`, so a filler shows through them and this
       metal covers its ends. THE CAGE IS TWO NODES. `plate` is the
       cage's face, which the contract stands 1.0 proud by its outline:
       its printing and latches are inside it so they ride on its front,
       and the printed triangles are polygons, not paths, so they are not
       read as holes. `flange-cover` is the metal over each seated card's
       bracket flange, which the contract stands past the wall; it sits
       under the plate, so the flat drawing is the plate's alone. Its
       rectangles are each flange's fold, 1.5 each side, over the
       flange's length (the bays' seats of std/pcie-bracket-lp@1: slot 1
       turned over, so its flange is at the left). -->
  <g id="flange-cover">
    <path d="M13.53 3.83 H16.53 V19.50 H13.53 Z" fill="#cfd3d7"/>
    <path d="M156.51 1.82 H159.51 V18.43 H156.51 Z" fill="#cfd3d7"/>
  </g>
  <g id="plate">
  <path fill-rule="evenodd" d="M0.30 0.30 H163.30 V19.50 H0.30 Z M22.84 1.92 H79.60 V19.50 H22.84 Z M91.52 4.30 H100.20 V1.92 H150.20 V19.50 H91.52 Z" fill="#cfd3d7" stroke="#9aa1a8" stroke-width="0.25"/>
    <rect x="0.69" y="2.58" width="13.94" height="3.70" rx="0.3" fill="#16191c"/>
    <rect x="4.24" y="8.82" width="3.78" height="3.75" rx="0.3" fill="#16191c"/>
    <rect x="4.24" y="14.31" width="3.78" height="3.75" rx="0.3" fill="#16191c"/>
    <rect x="9.77" y="8.82" width="1.62" height="3.75" rx="0.3" fill="#16191c"/>
    <rect x="158.60" y="0.60" width="4.80" height="18.60" rx="0.3" fill="#aeb4ba"/>
    <g id="silkscreen">
      <text x="85.00" y="10.57" font-family="sans-serif" font-size="3.4" fill="#2b2f33" text-anchor="middle">1</text>
      <polygon points="84.42,11.75 85.63,11.06 85.63,12.44" fill="#2b2f33"/>
      <text x="98.58" y="3.60" font-family="sans-serif" font-size="3.4" fill="#2b2f33" text-anchor="middle">2</text>
      <polygon points="95.57,2.26 96.96,2.26 96.26,3.47" fill="#2b2f33"/>
    </g>
  </g>
</svg>
