<svg xmlns="http://www.w3.org/2000/svg" width="59.8mm" height="40.1mm" viewBox="0 0 59.8 40.1">
  <!-- Dell 60 mm hot-plug supply, 700 W C14 face. Original art from measured
       positions (see the contract's provenance); nothing here is traced from
       the stencil. The body carries the inlet's footprint as a hole because the
       connector is composed `behind` and would otherwise be painted over. -->
  <path id="body" fill-rule="evenodd" d="M0.2 1.0 a0.8 0.8 0 0 1 0.8 -0.8 h57.80 a0.8 0.8 0 0 1 0.8 0.8 v38.10 a0.8 0.8 0 0 1 -0.8 0.8 h-57.80 a0.8 0.8 0 0 1 -0.8 -0.8 Z M33.10 7.20 h14.00 a3 3 0 0 1 3 3 v22.00 a3 3 0 0 1 -3 3 h-14.00 a3 3 0 0 1 -3 -3 v-22.00 a3 3 0 0 1 3 -3 Z" fill="#c3c8cd" stroke="#7d848b" stroke-width="0.35"/>
  <!-- the vent fields: a slot column at the far left with two more below the
       label, a two-column field beside the grip, one column right of the latch -->
  <g id="vents">
    <rect x="1.07" y="3.96" width="1.47" height="2.75" rx="0.35" fill="#1b1e21"/><rect x="1.07" y="8.29" width="1.47" height="3.92" rx="0.35" fill="#1b1e21"/><rect x="1.07" y="13.76" width="1.47" height="3.92" rx="0.35" fill="#1b1e21"/><rect x="1.07" y="19.29" width="1.47" height="3.92" rx="0.35" fill="#1b1e21"/><rect x="1.07" y="24.78" width="1.47" height="3.92" rx="0.35" fill="#1b1e21"/><rect x="1.07" y="30.28" width="1.47" height="3.92" rx="0.35" fill="#1b1e21"/><rect x="1.07" y="35.77" width="1.47" height="2.47" rx="0.35" fill="#1b1e21"/><rect x="3.74" y="24.78" width="1.47" height="3.92" rx="0.35" fill="#1b1e21"/><rect x="3.74" y="30.28" width="1.47" height="3.92" rx="0.35" fill="#1b1e21"/><rect x="3.74" y="35.77" width="1.47" height="2.14" rx="0.35" fill="#1b1e21"/><rect x="6.41" y="24.78" width="1.47" height="3.92" rx="0.35" fill="#1b1e21"/><rect x="6.41" y="30.28" width="1.47" height="3.92" rx="0.35" fill="#1b1e21"/><rect x="6.41" y="35.77" width="1.47" height="2.14" rx="0.35" fill="#1b1e21"/><rect x="18.47" y="4.85" width="3.69" height="1.86" rx="0.6" fill="#1b1e21"/><rect x="18.47" y="8.29" width="3.69" height="3.92" rx="0.6" fill="#1b1e21"/><rect x="18.47" y="13.76" width="3.69" height="3.92" rx="0.6" fill="#1b1e21"/><rect x="18.47" y="19.29" width="3.69" height="3.92" rx="0.6" fill="#1b1e21"/><rect x="18.47" y="24.78" width="3.69" height="3.92" rx="0.6" fill="#1b1e21"/><rect x="18.47" y="30.28" width="3.69" height="3.92" rx="0.6" fill="#1b1e21"/><rect x="18.47" y="35.77" width="3.69" height="1.81" rx="0.6" fill="#1b1e21"/><rect x="23.73" y="4.85" width="3.69" height="1.86" rx="0.6" fill="#1b1e21"/><rect x="23.73" y="8.29" width="3.69" height="3.92" rx="0.6" fill="#1b1e21"/><rect x="23.73" y="13.76" width="3.69" height="3.92" rx="0.6" fill="#1b1e21"/><rect x="23.73" y="19.29" width="3.69" height="3.92" rx="0.6" fill="#1b1e21"/><rect x="23.73" y="24.78" width="3.69" height="3.92" rx="0.6" fill="#1b1e21"/><rect x="23.73" y="30.28" width="3.69" height="3.92" rx="0.6" fill="#1b1e21"/><rect x="23.73" y="35.77" width="3.69" height="1.81" rx="0.6" fill="#1b1e21"/><rect x="52.48" y="4.85" width="3.74" height="1.86" rx="0.6" fill="#1b1e21"/><rect x="52.48" y="8.29" width="3.74" height="3.92" rx="0.6" fill="#1b1e21"/><rect x="52.48" y="30.28" width="3.74" height="3.92" rx="0.6" fill="#1b1e21"/><rect x="52.48" y="35.77" width="3.74" height="1.81" rx="0.6" fill="#1b1e21"/>
  </g>
  <!-- the latch travels between these two slots -->
  <rect x="54.97" y="14.95" width="4.05" height="0.60" fill="#1b1e21"/>
  <rect x="54.97" y="26.93" width="4.05" height="0.60" fill="#1b1e21"/>
  <!-- the inlet recess, cut as a frame so the composed C14 shows through -->
  <path id="inlet-bezel" fill-rule="evenodd" d="M28.6 7.3 a1.5 1.5 0 0 1 1.5 -1.5 h21.0 a1.5 1.5 0 0 1 1.5 1.5 v28.0 a1.5 1.5 0 0 1 -1.5 1.5 h-21.0 a1.5 1.5 0 0 1 -1.5 -1.5 Z M33.10 7.20 h14.00 a3 3 0 0 1 3 3 v22.00 a3 3 0 0 1 -3 3 h-14.00 a3 3 0 0 1 -3 -3 v-22.00 a3 3 0 0 1 3 -3 Z" fill="#55595e" stroke="#3d4145" stroke-width="0.3"/>
  <!-- the translucent handle's label carrier, and the label on it -->
  <path d="M2.9 4.5 h7.2 v17.9 l-1.0 0.9 h-6.2 Z" fill="#eef0f2" stroke="#b5bbc1" stroke-width="0.3"/>
  <rect id="label" x="3.69" y="5.26" width="5.80" height="16.20" rx="0.3" fill="#1d2023"/>
  <!-- THE GRIP IS THE LAMP: the whole translucent bar carries the led colour -->
  <path id="grip" d="M11.0 3.9 h5.4 l1.0 1.0 v32.0 l-1.0 1.0 h-5.4 l-1.0 -1.0 v-32.0 Z" fill="var(--led-color, #e9ecef)" stroke="#b5bbc1" stroke-width="0.35"/>
  <rect x="11.9" y="7.0" width="3.6" height="27.8" rx="1.6" fill="#ffffff" fill-opacity="0.45"/>
  <rect id="latch" x="49.0" y="13.2" width="5.1" height="14.8" rx="0.6" fill="#d9661a" stroke="#9c4610" stroke-width="0.3"/>
  <g id="silkscreen">
    <text id="watts" data-from="watts" x="5.39" y="13.36" transform="rotate(90 5.39 13.36)" font-family="sans-serif" font-size="3.4" font-weight="bold" fill="#f2f4f6" text-anchor="middle">700W</text>
  </g>
</svg>
