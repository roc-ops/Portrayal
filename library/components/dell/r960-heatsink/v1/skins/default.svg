<svg xmlns="http://www.w3.org/2000/svg" width="128.0mm" height="182.1mm" viewBox="0 0 128.0 182.1">
  <!-- r960-heatsink: original art; the outlines are Dell's service model, the fins and screws are read off ISM figure 15. -->
  <defs>
    <pattern id="fins" x="0" y="1" width="128.0" height="3.6" patternUnits="userSpaceOnUse">
      <rect x="3" y="0" width="122.0" height="1.6" fill="#7d848b"/>
    </pattern>
  </defs>
  <g id="block">
    <rect x="48.7" y="0" width="78.9" height="120.6" rx="1" fill="#9aa1a8" stroke="#6d737a" stroke-width="0.4"/>
    <rect x="48.7" y="1" width="78.9" height="118.6" fill="url(#fins)"/>
    <rect x="65.0" y="55.0" width="46.5" height="14" fill="#b87333"/>
    <circle cx="117.0" cy="11.8" r="2.4" fill="#2b3035"/>
    <circle cx="59.4" cy="11.8" r="2.4" fill="#2b3035"/>
    <circle cx="117.0" cy="114.0" r="2.4" fill="#2b3035"/>
    <circle cx="59.4" cy="114.0" r="2.4" fill="#2b3035"/>
  </g>
  <g id="pack">
    <rect x="0" y="132.8" width="126.8" height="49.3" rx="1" fill="#9aa1a8" stroke="#6d737a" stroke-width="0.4"/>
    <rect x="0" y="134.0" width="126.8" height="47.0" fill="url(#fins)"/>
  </g>
</svg>
