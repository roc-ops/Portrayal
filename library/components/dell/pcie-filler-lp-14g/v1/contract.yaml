format: 1
kind: module
name: pcie-filler-lp-14g
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  Low-profile (half-height) PCIe slot filler bracket for a 14th-generation PowerEdge riser -
  vented sheet metal closing a slot no card occupies
provenance:
  size: >-
    photo-measured from ISM figure 8, which passes Gate 1 at 0.38% against a
    434 x 86.8 rear face. The bracket runs x 12..115 and stands 12.2 mm, which
    is the vented body between the mounting tab and the slot edge.
  pitch: >-
    IT SITS ON A STANDARD, AND THE FIGURE CONFIRMS THE STANDARD RATHER THAN
    SETTING IT. A PCI card bracket pitch is 20.32 mm - 0.8 inch - and the three
    fillers on riser 1 measure 20.535 mm apart from their vent bands, which is
    1.06%. The device therefore places them on 20.32 and records the measurement
    as corroboration: a published pitch beats a reading of a picture, and the
    reading is what tells you the published one applies here.
  vents: >-
    two rows of slots, counted off the figure. The COUNT is what was read; the
    slot proportions are drawn, because at 7.2074 px/mm a 3 mm slot is twenty
    pixels and its corner radii are not in the image.
  which-slot: >-
    riser 2 slot 6, the only half-height slot on this chassis. The R740 ISM
    table 10 item 2 names it: "The PCIe expansion card slot (riser 2) connects
    one half-height PCIe expansion cards to the system."
  what-it-is-not: >-
    NOT A CARD AND NOT A BEZEL. It is the blank that ships in an unused slot, so
    it is `class: blank` and draws nothing. A populated slot has a card's own
    bracket in the same place, and that is a different part which this library
    does not yet hold for this machine.
  depth: >-
    a bracket is sheet metal a millimetre or so thick and nothing held here
    states it, so no depth is recorded rather than a guess being made.
size: {w: 85.0, h: 12.2}
skins: [default]
