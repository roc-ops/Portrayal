<svg xmlns="http://www.w3.org/2000/svg" width="79.2mm" height="18.42mm" viewBox="0 0 79.2 18.42">
  <!-- pcie-filler-lp-14g: the vent field ONLY. Outline, retention tip, keyed top
       and connector opening are std/pcie-bracket-lp@1, composed BEHIND this. -->
