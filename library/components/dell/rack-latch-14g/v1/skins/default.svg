<svg xmlns="http://www.w3.org/2000/svg" width="12.16mm" height="37.99mm" viewBox="0 0 12.16 37.99">
  <!-- Rack release rocker, 14G PowerEdge ear. Outline from the r750 master,
       which draws the same 12.16 x 37.99 section in BOTH ears at y 46.91.
       Only the moulding line and the finger relief are drawn: at 6.5644 px/mm
       the ISM figure resolves nothing finer, and the catch behind it is not
       dimensioned by anything held here. -->
  <rect x="0.15" y="0.15" width="11.86" height="37.69" rx="1.1"
        fill="#2b2f34" stroke="#4a5157" stroke-width="0.3"/>
  <!-- the pressed face: a shallow recess at the head of the rocker -->
  <rect id="press" x="1.4" y="1.6" width="9.4" height="9.0" rx="0.9"
        fill="#202427" stroke="#565d64" stroke-width="0.26"/>
  <path d="M3.1 6.1 h5.96" stroke="#6d7379" stroke-width="0.42"
        stroke-linecap="round"/>
  <!-- the grip below it, moulded flush -->
  <rect x="1.4" y="12.4" width="9.4" height="23.9" rx="0.8"
        fill="#262a2e" stroke="#3d4348" stroke-width="0.22"/>
</svg>
