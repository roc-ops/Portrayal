format: 1
kind: component
name: rack-latch-14g
version: 1.0.0
class: latch
description: >-
  The rack release rocker built into a 14th-generation PowerEdge ear - pressed
  to free the chassis from the rack rail so it can be drawn out. One in each ear
size: {w: 12.16, h: 37.99}
provenance:
  size: >-
    drawing - Dell's r750-24d-2-5-front Visio master, which passes Gate 1 at
    0.67% against a 482.6 x 86.8 rack face. It draws the same section in both
    ears: x 2.80..14.96 on the left and x 469.04..481.20 on the right, both
    y 46.91..84.90. Identical width and identical vertical extent on the two
    sides, which is what a mirrored pair of the same moulding looks like and is
    why one part is placed twice rather than two parts drawn.
  position: >-
    IT STARTS BELOW THE MIDDLE AND RUNS TO THE BOTTOM. y 46.91 is 54% of the way
    down an 86.8 face, which matches the operator's description of the hardware -
    "a little bit lower than midway down, and from there to the bottom" - from a
    machine in a rack, against a drawing of its successor. Two independent
    accounts of the same feature agreeing on where it starts is what fixes it.
  what-it-is: >-
    IT IS NOT THE INFORMATION TAG, which an earlier reading of the right-hand ear
    took it for. The ISM's figure 2 puts the information tag's callout in the
    middle of the drive row at the bottom, not out in the ear - the tag is a
    slide-out from between the bays. The ear section is the rack release, and the
    two are on opposite sides of the face.
  face: >-
    photo-measured in outline only. The ISM figure resolves a recessed panel with
    a finger relief at its top and nothing finer at 6.5644 px/mm, so the moulding
    line and the relief are drawn and the detail inside them is not. No document
    held here dimensions the button travel or the catch.
elements:
  press:
    at: [1.4, 1.6]
    size: [9.4, 9.0]
    class: control
    description: >-
      the pressed face at the top of the rocker, where the finger goes. Below it
      the moulding is a plain grip.
skins: [default]
