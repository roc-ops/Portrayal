format: 1
kind: module
name: e3s-filler-1u
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  Dell's 1U E3.S column filler - one vented plate standing in for a whole
  column of four E3.S bays, a thirteen-by-six grid of square vents
provenance:
  sources: >-
    The VisioCafe master `R670 8D E3.S Front` (r670-8d-e3-s-front-1), rendered
    at 20 px/mm: three of these plates fill the three columns the 8-drive build
    leaves empty. The library also holds the filler as its own master, `1U 17G
    E3.S Filler`, stamped 81.8 wide - which is the COLUMN PITCH, not the plate;
    measured in place on the true-scale front, the plate is 79.25. Facts read,
    art not traced.
  size: >-
    drawing - 79.25 x 37.85, the three plates on the 8D master agreeing to
    0.05, at y 2.6 on the face. The 16D master draws the same plate in the
    middle of a fully populated front, which is the R660 16 x E3.S render's
    centre vent too - whether that one is a removable filler or chassis metal is
    the device's question, not this part's.
  vents: >-
    drawing - 78 squares 5.17 on a side, columns from x 4.25 on a 5.45 pitch,
    rows from y 2.65 on a 5.47 pitch, inside a darker field.
  is-it-r660: >-
    17G evidence for a 16G machine, on the same footing as dell/e3s-carrier@1:
    the R660 render's centre vent shows the same grid. Whether the R660 fills an
    empty column with this plate or with four single-slot E3.S blanks (the ISM
    describes "Removing an EDSFF E3.S drive blank" by its release button, which
    reads like a single-slot part) is NOT settled by any image held.
  depth: >-
    NOT KNOWN - `d` is omitted and the part is drawn as a plate.
size: {w: 79.25, h: 37.85}
size-confidence: {w: drawing, h: drawing}
skins: [default]
