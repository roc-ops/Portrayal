<svg xmlns="http://www.w3.org/2000/svg" width="7.5mm" height="16.5mm" viewBox="0 0 7.5 16.5">
  <!-- Two tabs, top and bottom, that hold a PCIe bracket's tab down. The gap
       between them is where the bracket passes, which is why this part is a
       pair and not a block: on the hardware the two interleave, and drawing it
       solid would cover the thing it retains. -->
  <g id="tabs" fill="#3a4045" stroke="#23282c" stroke-width="0.3">
    <rect x="0" y="0" width="7.5" height="3.0" rx="0.6"/>
    <rect x="0" y="13.5" width="7.5" height="3.0" rx="0.6"/>
  </g>
</svg>
