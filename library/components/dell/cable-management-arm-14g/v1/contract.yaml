name: cable-management-arm-14g
version: 1.0.0
class: mount
behaviour: mounts
profile: server
description: >-
  The optional cable management arm (CMA) of the PowerEdge R740 and R740xd, one to a pair of
  sliding rails. It holds the cords and cables leaving the back of the chassis in large U-shaped
  baskets. It unfolds so the system can slide out of the rack without detaching them. It snaps
  onto either side of a sliding rail, with a low-profile fixed tray that holds it closed. Drawn
  as a plain plate: no source page dimensions the arm.
size: {w: 20.0, h: 43.5}
size-confidence: {w: estimated, h: estimated}
provenance:
  model: >-
    datasheet - the Dell PowerEdge R740 and R740xd Technical Guide (July 2019), "Cable
    management arm (CMA)", printed page 53: mounts without tools on either side of the
    sliding rails, and the static rails are not compatible with it.
  size: >-
    estimated - NO SOURCE PAGE DIMENSIONS THIS PART. 20.0 by 43.5 mm is a placeholder envelope;
    the guide and the matrix print the rail depth with the arm fitted, which belongs to the kit,
    and no size of the arm.
