<svg xmlns="http://www.w3.org/2000/svg" width="11.5mm" height="11.5mm" viewBox="0 0 11.5 11.5">
  <!-- Dell's blue captive thumbscrew. The BLUE RING is the whole point of the
       part: it is the vendor's mark for a fastener a person turns by hand, and
       it is what makes this findable on a figure where the outline is three
       pixels across. #6d92b5 is the ring's median in ISM figure 8; the head
       reads #838489 there, drawn a little lighter here so the cross reads.
       11.5 across is the service model's box; the figure's 12.4 is a blue halo
       on grey at 4 px/mm and is the softer of the two. -->
  <circle id="ring" cx="5.75" cy="5.75" r="5.75" fill="#6d92b5"
          stroke="#4d6a87" stroke-width="0.3"/>
  <circle id="collar" cx="5.75" cy="5.75" r="4.60" fill="#6d92b5"
          stroke="#5b7c9c" stroke-width="0.35"/>
  <circle id="head" cx="5.75" cy="5.75" r="3.40" fill="#9aa1a8"
          stroke="#3f4448" stroke-width="0.35"/>
  <!-- a Phillips cross, which is what the figure shows: four arms, not a slot -->
  <g id="cross" stroke="#3f4448" stroke-width="0.85" stroke-linecap="round">
    <path d="M3.85 5.75 h3.8 M5.75 3.85 v3.8"/>
  </g>
</svg>
