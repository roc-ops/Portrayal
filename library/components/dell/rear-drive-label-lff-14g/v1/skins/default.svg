<svg xmlns="http://www.w3.org/2000/svg" width="11.0mm" height="12.0mm" viewBox="0 0 11.0 12.0">
  <!-- The two slot numbers for a 2 x 3.5 inch rear, and they are NOT arranged
       like the 4 x 2.5 inch ones.
       That layout has a numbered PLATE per bay, outboard of the central
       dividers, at face 254.75 and 313.75 - a darker rectangle with the digits
       on it. This one has no plate at all: the numbers are printed straight on
       the chassis divider between the two bays, stacked one above the other,
       directly over the blue thumbscrew at face 288.34.
       So the same convention is kept - the arrow points AT the bay it names,
       12 to the left and 13 to the right - and everything else about the
       arrangement differs. Read off ISM figure 9 at 4 px/mm, which is the limit
       of what these glyphs resolve at; the positions are good to a few tenths
       and the font size is taken from the 4 x 2.5 inch labels rather than
       measured here. -->
  <g id="silkscreen" fill="#15181b">
    <path transform="translate(0.3 1.3)" d="M2.5 0 L0 1.65 L2.5 3.3 Z"/>
    <text x="3.0" y="4.7" font-family="sans-serif" font-size="4.6" text-anchor="start">12</text>
    <text x="7.5" y="10.8" font-family="sans-serif" font-size="4.6" text-anchor="end">13</text>
    <path transform="translate(7.8 7.7)" d="M0 0 L2.5 1.65 L0 3.3 Z"/>
  </g>
</svg>
