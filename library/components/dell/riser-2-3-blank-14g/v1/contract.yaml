format: 1
kind: module
name: riser-2-3-blank-14g
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  Sheet-metal blank closing riser 2 AND riser 3 on a 14th-generation PowerEdge when no
  riser is fitted there
provenance:
  identity: >-
    ONE PART COVERING TWO POSITIONS. The ISM's procedure is explicit -
    "loosen the screws (3) that secure the blank to the system", then "press the
    release tab" - and it is a single blank for both riser 2 and riser 3, not
    two. So it is seated in the riser-2 bay and DECLARES that it covers riser-3
    with `for:`, the same construction the front bezel uses over the drive bays.
    L13 then reads it as a cover rather than as a sizing mistake.
  size: >-
    photo-measured from the R740 ISM figure 9, which passes Gate 1 at 0.26%
    against a 434 x 86.8 rear face - the extent of the riser position it closes.
  what-it-answers: >-
    THE EMPTY GREY AREAS ON A REAR DRAWING ARE NOT BARE METAL. A chassis with
    fewer risers than positions has a blank over the rest, and a drawing that
    left them grey would be showing a machine with holes in it. That the ISM
    ships removal procedures for both blanks is what makes them parts rather
    than background.
  fasteners: >-
    Three captive Phillips screws, from the ISM's own procedure. The
    heads are NOT drawn: the figure resolves them as a few grey pixels and their
    positions are not measurable at 7.2074 px/mm.
  depth: >-
    not recorded. Nothing held here dimensions it.
size: {w: 233.0, h: 62.0}
skins: [default]
