<svg xmlns="http://www.w3.org/2000/svg" width="107.59mm" height="62.0mm" viewBox="0 0 107.59 62.0">
  <!-- riser-1-3fh-14g: the riser plate and its slot windows. The plate sits
       drawn at the module origin. The BRACKETS behind it are 120.02
       long and start 17.46 to the LEFT of this plate, behind the
       neighbouring metal - see `insert` in the contract. -->
  <!-- THE PLATE IS THE SAME METAL AS THE CHASSIS. It was #7d848c against a
       #9aa1a8 panel, which read as a dark box laid on the face; ISM figure 8
       measures the plate at #acaeb3 and the chassis beside it at #afb0b5 -
       three parts in 255, a hair darker and no more. The value here keeps that
       relationship against this library's own panel colour rather than copying
       the figure's absolute level. -->
  <!-- THE WINDOW FRAMES THE BRACKET, NOT THE VENT FIELD. It was drawn at
       89.90 x 12.20 - the PCIe OPENING, which is the hole a connector needs
       rather than the hole the sheet metal has - so it cropped the card to its
       vents. Measured off ISM figure 8 by tone, in a column at face x 21 and 24
       where the only transition is plate to card: slot 1 shows card from y 5.0
       to 22.75, 17.75 tall, and a row at y 15 puts the right edge at local
       90.75 with no plate band left of the vents at all. 90.00 x 18.00,
       centred on the opening. -->
  <!-- THE PLATE REACHES PAST THE CARD'S OUTBOARD VENTS. It stopped at 95.0,
       face 112, and the card runs to 119.56 - so its flange end showed. A row
       at face y 15 finds the outboard vent pair dark to 114.75, bracket metal
       to 118.50, and bright sheet metal from there: the metal that covers the
       flange begins at 118.5, so the plate is 102.50 and its right edge lands
       at 119.50. The LEFT edge stays at face 17; the slot numerals at
       11.75..14.00 are on the chassis, left of this plate. -->
  <!-- THE PLATE REACHES ITS NEIGHBOURS ON BOTH SIDES. It stopped 3.05 short
       of the slot strip on the left and 2.04 short of the shroud's shelf pip on
       the right, leaving a band of bare chassis down each edge that the
       hardware does not have.
       THE COMPONENT'S ORIGIN MOVED LEFT 3.05 RATHER THAN THE PATH BEING DRAWN
       AT NEGATIVE x. Ink outside the declared box is ink no overlap check, no
       capability query and no consumer can see; growing the box and shifting
       every local coordinate with it leaves the windows, louvres and slot bays
       exactly where they were on the face. -->
  <path id="plate" fill-rule="evenodd" d="M1.50 0.30 H106.09 A1.20 1.20 0 0 1 107.29 1.50 V60.50 A1.20 1.20 0 0 1 106.09 61.70 H1.50 A1.20 1.20 0 0 1 0.30 60.50 V1.50 A1.20 1.20 0 0 1 1.50 0.30 Z M4.55 0.50 H100.55 A2.00 2.00 0 0 1 102.55 2.50 V16.50 A2.00 2.00 0 0 1 100.55 18.50 H4.55 A2.00 2.00 0 0 1 2.55 16.50 V2.50 A2.00 2.00 0 0 1 4.55 0.50 Z M4.55 20.82 H100.55 A2.00 2.00 0 0 1 102.55 22.82 V36.82 A2.00 2.00 0 0 1 100.55 38.82 H4.55 A2.00 2.00 0 0 1 2.55 36.82 V22.82 A2.00 2.00 0 0 1 4.55 20.82 Z M4.55 41.14 H100.55 A2.00 2.00 0 0 1 102.55 43.14 V57.14 A2.00 2.00 0 0 1 100.55 59.14 H4.55 A2.00 2.00 0 0 1 2.55 57.14 V43.14 A2.00 2.00 0 0 1 4.55 41.14 Z" fill="#969da4" stroke="#4f565d" stroke-width="0.5"/>
  <!-- THE OPENINGS KEEP THEIR IDS AND STOP DRAWING. render.py hangs each
       bay's data-path on the node with this id, so they must exist; they kept a
       stroke as well, which drew a second outline just inside every window.
       That doubled rectangle was one shape drawn twice, not a shape read
       wrong. -->
  <rect id="slot-1" x="5.55" y="5.00" width="89.9" height="12.2" rx="1.4" fill="none" stroke="none"/>
  <rect id="slot-2" x="5.55" y="25.32" width="89.9" height="12.2" rx="1.4" fill="none" stroke="none"/>
  <rect id="slot-3" x="5.55" y="45.64" width="89.9" height="12.2" rx="1.4" fill="none" stroke="none"/>
  <!-- THE LOUVRE ROW, AND IT IS ON THIS PLATE. It was moved to the card on
       the argument that the figure puts it inside a window and a hole cannot
       carry ink - but the card is BEHIND this plate, so anything on the card in
       the metal between windows is covered by definition, and the row vanished.
       That settles ownership the other way: only the plate can show ink here.
       THEY ARE LOUVRES, NOT PUNCHED RECTANGLES - a raised cell with the opening
       in its lower half. Drawn flat and dark, sixteen of them read as a dashed
       line, which is exactly how they looked.
       PLACED BY THE GEOMETRY THEY MUST FIT, not by their own reading: the
       figure puts the row at face 24.75 and the metal between windows is
       22.50..24.82, about 2 mm apart. The window is measured off tone at
       4 px/mm and the card pitch is standard and exact, so the gap is the
       harder number. The relief - the cells stand proud - is not modelled. -->
  <g id="louvres-1">
    <rect x="6.64" y="18.56" width="4.06" height="2.2" rx="0.5" fill="#a8afb6" stroke="#818891" stroke-width="0.18"/>
