provenance:
  size: >-
    measured - Dell's R960 service model, working/intake/dell/3d-models/r960.glb, read with glbparts.py: `PowerEdge_R960_Riser4_Long`
    under `R960_ Riser 4A - FL` in the `Main Assembly` node, 148.4 x 357.0 at plan (4.7, 1.1) (plan x = 228.0 - cad x1, plan y = 883.94 -
    cad z1). The model holds the full-length 4A only; 4B and 4C share this plan. The first pass drew dell/r960-riser-plan@1's 105.0 x 258.0
    cage in a 120.0 frame that was the rear bay's width, read off ISM figure 12 (1.86 px/mm down against 1.81 across); the board runs 43.4
    wider and 99.0 longer. The ISM's table 13 gives riser 4's slots half length: recorded as sources-disagree on the device
    (`riser-length-model-vs-table-13`).
  is-a-plan: >-
    A plan part: what the top view draws where the rear bay projects the riser.
