<svg xmlns="http://www.w3.org/2000/svg" width="86.3mm" height="41.0mm" viewBox="0 0 86.3 41.0">
  <!-- Dell 86 mm hot-plug supply, 2400 W C20 face, R760. Original art from
       positions read off ISM figure 10 (see the contract's provenance). The
       body carries the inlet's footprint as a hole because the connector is
       composed `behind` and would otherwise be painted over. -->
  <path id="body" fill-rule="evenodd" d="M0.2 1.2 a1 1 0 0 1 1 -1 h83.90 a1 1 0 0 1 1 1 v38.60 a1 1 0 0 1 -1 1 h-83.90 a1 1 0 0 1 -1 -1 Z M53.7 4.4 h24.4 v32.4 h-24.4 Z" fill="#dfe2e5" stroke="#8d949c" stroke-width="0.35"/>
  <!-- the fan opening: an octagon, four cut corners, four screws, an X of spokes and the hub -->
  <path id="fan" d="M13.0 2.5 H28.2 L36.2 10.5 V30.1 L28.2 38.1 H13.0 L5.0 30.1 V10.5 Z" fill="#141719" stroke="#41474d" stroke-width="0.4"/>
  <path d="M9.0 6.5 L16.5 14.0 M32.2 6.5 L24.7 14.0 M9.0 34.1 L16.5 26.6 M32.2 34.1 L24.7 26.6" stroke="#e9ecef" stroke-width="1.0" fill="none" stroke-linecap="round"/>
  <circle cx="20.6" cy="20.3" r="9.9" fill="#e8ebee" stroke="#9aa0a6" stroke-width="0.35"/>
  <g fill="#3d4247"><circle cx="7.1" cy="4.0" r="3.0"/><circle cx="38.7" cy="4.0" r="3.0"/><circle cx="7.1" cy="35.7" r="3.0"/><circle cx="38.7" cy="35.7" r="3.0"/></g>
  <!-- the inlet recess, cut as a frame so the composed C20 shows through -->
  <path id="inlet-bezel" fill-rule="evenodd" d="M53.7 3.5 H78.1 a1.2 1.2 0 0 1 1.2 1.2 V36.5 a1.2 1.2 0 0 1 -1.2 1.2 H53.7 a1.2 1.2 0 0 1 -1.2 -1.2 V4.7 a1.2 1.2 0 0 1 1.2 -1.2 Z M53.7 4.4 h24.4 v32.4 h-24.4 Z" fill="#1b1f22" stroke="#41474d" stroke-width="0.35"/>
  <!-- THE GRIP IS THE LAMP: the whole translucent strap handle carries the led colour -->
  <rect x="35.1" y="3.1" width="17.0" height="36.5" rx="2.6" fill="#f1f3f5" fill-opacity="0.55" stroke="#b5bbc1" stroke-width="0.35"/>
  <path id="grip" d="M39.5 3.9 h8.7 l1.2 1.2 v32.9 l-1.2 1.2 h-8.7 l-1.2 -1.2 v-32.9 Z" fill="var(--led-color, #e9ecef)" stroke="#b5bbc1" stroke-width="0.35"/>
  <rect x="41.2" y="8.0" width="4.4" height="26.5" rx="2.0" fill="#ffffff" fill-opacity="0.45"/>
  <rect id="latch" x="76.5" y="13.9" width="5.8" height="14.9" rx="0.6" fill="#d9661a" stroke="#9c4610" stroke-width="0.3"/>
  <rect x="80.0" y="13.2" width="5.2" height="0.6" fill="#1b1e21"/>
  <rect x="80.0" y="28.8" width="5.2" height="0.6" fill="#1b1e21"/>
</svg>
