description: >-
  Dell riser 2A of the PowerEdge R760 - slot 3 and slot 6 on dell/riser-2-cage-2u-16g@1, two low-profile PCIe Gen4 x16 slots side by side, slot 3 on processor 1 and slot 6 on processor 2; fitted in every riser configuration but 0
attrs:
  riser: '2A'
  appears-in: 'riser configurations 1 to 11 and 13 (every one but 0)'
  power-absent: not-published
  slot-3: 'x16, low profile, half length, processor 1, PCIe Gen4'
  slot-6: 'x16, low profile, half length, processor 2, PCIe Gen4'
provenance:
  power: >-
    NOT PUBLISHED - the riser is a passive board with connectors. The R760 ISM,
    technical guide and spec sheet were searched for 'riser' beside a wattage
    and none gives one.
  slots: >-
    datasheet - R760 ISM table 153: R2A carries slot 3 (low profile, Gen4 x16, processor 1) and slot 6 (low profile, Gen4 x16, processor 2); table 18 gives both half length. In the single-processor configurations (8, 9, 10-1, 13) slot 6's lanes belong to processor 2, which is absent; table 153 lists slot 6 only for configurations 1 to 6, 11 and 12, and the module keeps both bays. Which is left of which is not stated: slot 3 is on processor 1, the left-hand socket from the rear, and is drawn left.
  face: >-
    photo-measured - composed from dell/riser-2-cage-2u-16g@1.
  seating: >-
    estimated - low-profile brackets (79.2 x 18.42) behind the cage, tip at the left, their vent fields' centre lines on the windows': x 20.9 and 93.6, y 3.85. They overlap by 6.5 as the R660's riser 2A's do; the 1U R660 risers' brackets are the same 79.2 mm part.
  size: >-
    photo-measured - the cage's extent, 244.7 x 23.2.
