<svg xmlns="http://www.w3.org/2000/svg" width="7mm" height="7mm" viewBox="0 0 7 7">
  <!-- Rear system ID button, 7.0 mm across, measured off ISM figure 8. The
       button itself lights - Dell's wording is "turning on the system ID
       button" - so the lamp is its face and not a dot beside it. -->
  <circle cx="3.5" cy="3.5" r="3.3" fill="#22262a" stroke="#5a6167"
          stroke-width="0.3"/>
  <circle id="lamp" cx="3.5" cy="3.5" r="2.1"
          fill="var(--led-color, #3a3f44)" stroke="#6d747a" stroke-width="0.22"/>
</svg>
