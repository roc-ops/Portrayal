<svg xmlns="http://www.w3.org/2000/svg" width="7mm" height="7mm" viewBox="0 0 7 7">
  <!-- ONE PLAIN CIRCLE, a shade lighter than the panel. This was
       drawn as concentric dark rings, which reads as a recessed
       button on a dark face and as nothing at all on a silver one -
       and the figure shows a single light disc. THE DISC IS THE
       LAMP, not a ring around one: the contract has this button
       illuminate while system ID is active, so the circle carries
       the id the contract declares. -->
  <circle id="lamp" cx="3.5" cy="3.5" r="3.2" fill="var(--led-color, #c2c7cc)" stroke="#8d949b" stroke-width="0.45"/>
</svg>
