format: 1
kind: component
name: system-id-button-14g
version: 1.0.0
class: button
description: >-
  The system identification button on the rear of a 14th-generation PowerEdge -
  pressed to make the machine announce itself in a rack, and lit while it does
size: {w: 7.0, h: 7.0}
provenance:
  size: >-
    photo-measured from ISM figure 8 at 7.2074 px/mm, where the recess is a 7.0
    mm circle centred at x 11.5, y 75.5 on the rear face. Round, so ONE diameter
    and not two - a feature measuring differently across and down would be the
    drawing out of aspect rather than the button being oval, and this figure
    passes Gate 1 at 0.38%, so it is neither.
  states: >-
    ISM table 9 item 11: "The System Identification (ID) button is available on
    the front and back of the systems. Press the button to identify a system in a
    rack by turning on the system ID button. You can also use the system ID
    button to reset iDRAC and to access BIOS using the step through mode."
    THE BUTTON ITSELF LIGHTS - "turning on the system ID button" is Dell's own
    phrasing - and `identify` is that state.
    NO BLINK IS PUBLISHED FOR THE REAR ONE. The FRONT health and ID bar is
    documented as blinking blue while ID mode is active (table 5) and it would be
    easy to carry that across; nothing states it for this button, so it gets
    solid and the front's rate is not borrowed. Reading a rate from a different
    lamp because it is nearby is how an invented figure gets a provenance.
  what-is-beside-it: >-
    figure 8 shows a second, smaller dark circle about 10 mm to the right of this
    one and NOTHING IN TABLE 9 NAMES IT. The rear also carries a grounding post -
    the ISM's rack instructions say to connect the safety ground "to the
    grounding post on the back of the system by using a number 6-32 nut" - and
    that is the likeliest reading, but likeliest is not sourced. It is left
    undrawn rather than guessed at.
elements:
  lamp:
    at: [1.4, 1.4]
    size: [4.2, 4.2]
    class: led
    states: ['off', {name: identify, color: '#2563eb'}]
    description: the button's own illumination, lit while system ID is active
skins: [default]
