<svg xmlns="http://www.w3.org/2000/svg" width="41.5mm" height="14.75mm" viewBox="0 0 41.5 14.75">
  <!-- ONE PIECE, NOT TWO. The shelf that closes the top of riser 1's bay runs
       into a wider flange along the very top of the chassis - they are the same
       pressing and were drawn as a lone rectangle, which read as a tab stuck on.
       Measured off ISM figure 8 by tone: the flange is bright from y 0 to 3.50
       and spans 111.50..153.00 here; the shelf hangs below it, 116.75..142.00,
       down to 14.75. A column at face x 130 runs bright 0..14.50 straight
       through - one continuous surface - while a column at x 60 or 200 stops at
       3.50, which is the flange alone.
       THE PIP is a small mark at face 121.25..124.00, and Dell's service model
       puts two small features of the chassis shell at 120.45..125.20,
       y 7.61..12.18 - a picture and a solid model on a 3 mm detail. -->
  <path id="shelf" d="M0.80 0 H40.70 A0.8 0.8 0 0 1 41.50 0.80 V2.70 A0.8 0.8 0 0 1 40.70 3.50 H31.30 A0.8 0.8 0 0 0 30.50 4.30 V13.95 A0.8 0.8 0 0 1 29.70 14.75 H6.05 A0.8 0.8 0 0 1 5.25 13.95 V4.30 A0.8 0.8 0 0 0 4.45 3.50 H0.80 A0.8 0.8 0 0 1 0 2.70 V0.80 A0.8 0.8 0 0 1 0.80 0 Z" fill="#a6adb4" stroke="#7d848c" stroke-width="0.3"/>
  <circle id="pip" cx="11.12" cy="9.90" r="1.38"
          fill="#8e959c" stroke="#6d747c" stroke-width="0.25"/>
</svg>
