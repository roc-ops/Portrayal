<svg xmlns="http://www.w3.org/2000/svg" width="25.25mm" height="14.0mm" viewBox="0 0 25.25 14.0">
  <!-- The shelf of chassis metal closing the top of riser 1's bay, between the
       riser shroud and the rear drive cage. Brighter than everything around it
       in ISM figure 8, which is what a surface tilted toward the light looks
       like and is the reason it reads as a separate piece.
       THE PIP IS THE CHECK. A small dark mark at face 121.25..124.00 in the
       figure, and Dell's service model puts two small features of the chassis
       shell at 120.45..125.20, y 7.61..12.18 - a picture and a solid model
       agreeing on a 3 mm detail neither was measured against. -->
  <rect id="shelf" x="0.15" y="0.15" width="24.95" height="13.7"
        rx="1.0" fill="#a6adb4" stroke="#7d848c" stroke-width="0.3"/>
  <circle id="pip" cx="5.87" cy="9.15" r="1.38"
          fill="#8e959c" stroke="#6d747c" stroke-width="0.25"/>
</svg>
