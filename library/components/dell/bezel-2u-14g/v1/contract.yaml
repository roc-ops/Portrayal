format: 1
kind: module
name: bezel-2u-14g
version: 2.1.0
class: bezel
behaviour: mounts
profile: server
description: >-
  The optional metal front bezel for a 2U 14th-generation PowerEdge - a
  honeycomb of large hexagonal openings between two end flanges, with a keylock
  and a release button at the left end. Unbranded
size: {w: 434.0, h: 82.35, d: 23.3}
provenance:
  size: >-
    THE MASTER'S ASPECT, ANCHORED BY WHERE THE PART FITS. Dell's 2u-14g-bezel
    Visio master draws 21720.3 x 4121.7 units, an aspect of 5.2698, and NO
    document held here dimensions the bezel - the ISM describes it, gives its
    removal procedure and never states a size.
    That aspect fails Gate 1 against a 482.6 x 86.8 rack face by 5.22%, AND IT
    SHOULD: the operator reports that the bezel clears both ears and does not
    cover the whole front, so a rack face was never the right thing to test it
    against. Clearing the ears bounds the width at the 434 mm body, and 434 at
    the master's aspect is 82.35 tall - which leaves 24.3 mm of ear showing each
    side and 2.2 mm of face above and below. A failed gate against the wrong
    reference is not a bad drawing; it is the drawing saying the reference is
    wrong.
  flanges: >-
    drawing - the master's outer path runs the full 21720.3 and the next one in
    starts 1241.9 units from each end, which at 50.05 units/mm is a 24.8 mm end
    flange on each side and a 384.4 mm honeycomb field between them. The field is
    narrower than the 428.8 mm drive array, so the flanges sit over the outermost
    carriers - they are opaque bezel metal and the drives behind them are covered
    either way.
  honeycomb: >-
    counted, not measured. The master draws the honeycomb as gradient-filled
    regions rather than as individual cells - its busiest path has seven
    subpaths and they are the logo - so there is no cell geometry to extract.
    Counting dark runs across the rendered master gives twelve crossings through
    the upper band and eighteen through the middle, which is a flat-top grid of
    about nine columns over the field and two offset rows. Cell size follows from
    the count and the field width; it is not a dimension anything states.
  lock: >-
    ISM 'Removing the front bezel': unlock with the bezel key, press the release
    button, pull the LEFT end, unhook the RIGHT. So the lock and the release are
    at the left end and the hooks at the right, which is why this drawing puts
    them there rather than mirroring them - the removal procedure is the source
    for the handedness.
  material: >-
    the ISM calls it 'an optional metal bezel'. Metal and not plastic, which is
    why it is drawn with a machined edge rather than a moulded one.
  no-branding: >-
    DELIBERATELY UNBRANDED. The master carries a Dell EMC wordmark across the
    middle and it is not reproduced: vendor artwork stays in working/ and what
    crosses into the library is geometry. The operator asked for it left off as
    well, so the drawing and the rule agree.
  lcd-variant: >-
    NOT MODELLED. The ISM says two versions exist, with and without an LCD panel,
    and that the LCD one is hot pluggable. Only the plain bezel is drawn here; a
    bezel with an LCD is a different part with a display element and states, and
    modelling it as a skin of this one would give it a screen that cannot light.
  depth: >-
    measured - Dell's service model, `DELL_R740XD_Frontbezel-1.001`, its one
    body `3DGeom~7136.001`, decoded from Draco: cad z -3.7..19.5 against the
    front drive carriers' faces at z 19.6 (`Poweredge_R760_Drive_Carrier_
    Assembly-1.002`, front-most pose). 23.3 is the badge bar's face; the
    honeycomb's is 20.3 proud, the end caps' 9.3 at their tips. 14 had been a
    placeholder for five versions.
  the-profile: >-
    measured from the same mesh, read as the front-most z in 10 mm bands
    across x and 4 mm bands up y. Across x the bezel is NOT one depth: the
    honeycomb field's front is at z -0.7, 20.3 proud, and the end caps fall
    away from it to 11.3 and 10.3 at the tips - 8.3 and 9.3 proud - over
    about 40 mm each side, a section like a football sliced a third through.
    That is what `profile` on the plate's feature carries, as [x, out] pairs
    from the bands, and the kit sweeps it down the height so the side view
    is the curve and not a box. Up y it is nearly flat: -0.7 to -1.7 across
    the field, the top and bottom rails 3 to 5 behind it, all drawn at the
    field's figure. The BADGE BAR at x 175..265, y 28.7..48.7 stands at
    z -3.7, 3.0 proud of the field, and is its own box; the round badge near
    the left cap is 0.5 proud and is drawn flush. The cells are 20 mm tubes
    to z 19.5 and are not drawn as tubes, which a hole in a 20 mm prism reads
    as anyway. The x rule is the top view's, 217 - raw_x - w, because a front
    view and a plan agree about left and right.
  the-model-puts-the-release-on-the-other-end: >-
    A DISAGREEMENT, RECORDED AND NOT RESOLVED. The ISM says the release
    button is at the LEFT end as seen from the front, and this skin draws it
    there. Dell's model has `DELL_R740XD_Frontbezel_ReleaseButton-1.001` at
    cad x 192.0..215.4, which by the same x rule that put the supplies where
    the board figure notches the PCB is the RIGHT end. Either the guide means
    the other left, or the model's bezel is posed mirrored, or the rule that
    has held for every other part fails for this one; a photograph settles it
    and none held here shows the bezel's ends clearly. The ISM is followed
    because it is the document a person removing the bezel reads.
relief:
  features:
  - node: plate
    out: 20.3
    profile: [[0, 8.3], [20, 14.9], [30, 16.7], [40, 20.3], [400, 20.3], [410, 15.9], [430, 9.3], [434, 9.3]]
    color: '#2b2f34'
    confidence: measured
    source: >-
      the mesh's front-most z in 10 mm bands across x, against the carriers'
      19.6: the field at -0.7 (20.3 proud), the left cap's tip at 11.3 (8.3),
      the right cap's at 10.3 (9.3), and the bands between them. `out` is the
      greatest figure; the profile is the section.
  - node: badge
    out: 23.3
    color: '#2b2f34'
    confidence: measured
    source: the bar's front at cad z -3.7, 3.0 proud of the field
elements:
  plate:
    at: [0.0, 0.0]
    size: [434.0, 82.35]
    class: bezel
    description: the bezel's plate - field and both caps - with the model's section
  field:
    at: [24.8, 0.0]
    size: [384.4, 82.35]
    class: bezel
    description: the honeycomb field between the end caps
  flange-l:
    at: [0.0, 0.0]
    size: [24.8, 82.35]
    class: bezel
    description: the left end cap, with the lock and release on it
  flange-r:
    at: [409.2, 0.0]
    size: [24.8, 82.35]
    class: bezel
    description: the right end cap
  badge:
    at: [175.0, 28.7]
    size: [90.0, 20.0]
    class: bezel
    description: the badge bar across the middle of the field
  lock:
    at: [8.0, 12.0]
    size: [9.0, 9.0]
    class: control
    description: >-
      the keylock. ISM: 'A lock on the bezel is used to protect unauthorized
      access to the drives', and step 1 of removal is to unlock it with the
      bezel key.
  release:
    at: [3.2, 30.0]
    size: [4.6, 22.0]
    class: control
    description: >-
      the release button on the left flange - step 2 of removal, pressed before
      the left end is pulled away.
skins: [default]
