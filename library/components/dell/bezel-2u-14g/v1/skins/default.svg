  <!-- end caps: solid, and the drives behind them are covered even though
       the honeycomb field is narrower than the drive row. The lock and
       release are ON the left cap, so they are in its node and ride on it. -->
  <g id="flange-l">
  <rect x="0" y="0" width="24.80" height="82.35" rx="2.0" fill="#3f4449" stroke="#23272b" stroke-width="0.8"/>
  <!-- lock and release, LEFT end - the end the ISM says to pull -->
  <rect id="release" x="3.2" y="30.0" width="4.6" height="22.0" rx="1.6" fill="#2b2f34" stroke="#4a5157" stroke-width="0.4"/>
  <g id="lock">
    <circle cx="12.5" cy="16.5" r="4.5" fill="#22262a" stroke="#5a6167" stroke-width="0.55"/>
    <circle cx="12.5" cy="16.5" r="1.9" fill="none" stroke="#7d848a" stroke-width="0.45"/>
    <path d="M12.5 14.9 v3.2" stroke="#7d848a" stroke-width="0.5" stroke-linecap="round"/>
  </g>
  </g>
  <g id="flange-r">
  <rect x="409.20" y="0" width="24.80" height="82.35" rx="2.0" fill="#3f4449" stroke="#23272b" stroke-width="0.8"/>
  </g>
    <!-- THE ROUNDEL IS ON THE PLATE. Flush with the cells, so it is plate art and
       travels with the plate's box: drawn at the root of this file it was
       painted onto the chassis face behind the bezel, and stayed there on the
       drives when the bezel came off. -->
  <g id="roundel">
    <circle cx="57.0" cy="22.0" r="8.0" fill="#3f4449" stroke="#23272b" stroke-width="0.8"/>
    <circle cx="57.0" cy="22.0" r="5.2" fill="none" stroke="#7d848a" stroke-width="0.6"/>
  </g>
  </g>

  <!-- THE BADGE BAR, across the middle of the field: Dell's model has a bar
       90 wide standing 3 further out than the cells, and a round badge near
       the left cap flush with them. Positions from the model; the art is not. -->
  <g id="badge">
    <rect x="175.0" y="28.7" width="90.0" height="20.0" rx="3.0" fill="#3f4449" stroke="#23272b" stroke-width="0.8"/>
    <rect x="182.0" y="35.0" width="76.0" height="7.4" rx="1.2" fill="#2b2f34"/>
  </g>
</svg>
