<svg xmlns="http://www.w3.org/2000/svg" width="434.0mm" height="82.35mm" viewBox="0 0 434.0 82.35">
  <!-- 2U 14G front bezel, unbranded. Two end flanges from the master
       (24.8 mm each), a honeycomb field between them, keylock and release
       at the LEFT end because that is the end the ISM says to pull. -->
  <defs>
    <clipPath id="field"><rect x="24.80" y="0" width="384.40" height="82.35" rx="1.2"/></clipPath>
  </defs>

  <!-- THE OPENINGS ARE HOLES, not dark paint. The bezel is ONE path with
       the hexagons as subpaths and fill-rule evenodd, so each cell is cut
       out of the metal and whatever is behind - the drives - shows through
       it. Drawn as dark fills they looked right on a dark ground and would
       have hidden the drives the moment anything was rendered behind them,
       which is exactly what a bezel must NOT do to a drawing of a machine
       whose drives are the thing worth seeing. -->
  <clipPath id="plate"><rect x="0" y="0" width="434.0" height="82.35" rx="2.0"/></clipPath>
  <!-- THE WHOLE BEZEL IS ONE NODE, `body`, so the contract can stand it off
       the face as a block. Its top carries this art, holes and all, which is
       what lets the drives be seen through it in 3D as well as in 2D. -->
