<svg xmlns="http://www.w3.org/2000/svg" width="434.0mm" height="82.35mm" viewBox="0 0 434.0 82.35">
  <!-- 2U 14G front bezel, unbranded. Two end flanges from the master
       (24.8 mm each), a honeycomb field between them, keylock and release
       at the LEFT end because that is the end the ISM says to pull. -->
  <!-- THE OPENINGS ARE HOLES, not dark paint. The bezel is ONE path with
       the hexagons as subpaths and fill-rule evenodd, so each cell is cut
       out of the metal and whatever is behind - the drives - shows through
       it. Drawn as dark fills they looked right on a dark ground and would
       have hidden the drives the moment anything was rendered behind them,
       which is exactly what a bezel must NOT do to a drawing of a machine
       whose drives are the thing worth seeing. -->
  <!-- THE WHOLE BEZEL IS ONE NODE, `body`, so the contract can stand it off
       the face as a block. Its top carries this art, holes and all, which is
       what lets the drives be seen through it in 3D as well as in 2D.
       THE CELLS ARE CUT TO THE FIELD IN THE GEOMETRY, not by a clipPath: the
       kit renders `body` on its own to texture the block and sizes the block
       from the node's bounding box, and neither honours a clip - the first
       block was taller than the face by a row of half-hexagons top and
       bottom, hanging off the bezel like a fringe. -->
  <!-- ONE PLATE, WITH THE MODEL'S SECTION. The field and both caps are inside
       `plate`, which the contract stands off the face by a PROFILE: 20.3 at
       the honeycomb, falling to 9.3 at the tips of the caps, swept down the
       height - so from the side the bezel is the sliced football Dell's mesh
       is, not a box. The badge bar stays its own node, 3 further out. -->
  <g id="plate">
  <g id="field">
  <g>
    <path fill-rule="evenodd" fill="#3f4449" stroke="none" d="M0 0 H434.0 V82.35 H0 Z M75.51 41.17 L63.89 61.32 L40.63 61.32 L29.00 41.17 L40.63 21.03 L63.89 21.03 Z M71.83 82.35 L32.68 82.35 L40.63 68.59 L63.89 68.59 Z M106.65 0.00 L116.70 17.40 L105.07 37.54 L81.81 37.54 L70.19 17.40 L80.23 0.00 Z M116.70 64.95 L106.65 82.35 L80.23 82.35 L70.19 64.95 L81.81 44.81 L105.07 44.81 Z M154.21 0.00 L146.26 13.76 L123.00 13.76 L115.05 0.00 Z M157.89 41.17 L146.26 61.32 L123.00 61.32 L111.37 41.17 L123.00 21.03 L146.26 21.03 Z M154.21 82.35 L115.05 82.35 L123.00 68.59 L146.26 68.59 Z M189.02 0.00 L199.07 17.40 L187.44 37.54 L164.19 37.54 L152.56 17.40 L162.61 0.00 Z M199.07 64.95 L189.02 82.35 L162.61 82.35 L152.56 64.95 L164.19 44.81 L187.44 44.81 Z M236.58 0.00 L228.63 13.76 L205.37 13.76 L197.42 0.00 Z M240.26 41.17 L228.63 61.32 L205.37 61.32 L193.74 41.17 L205.37 21.03 L228.63 21.03 Z M236.58 82.35 L197.42 82.35 L205.37 68.59 L228.63 68.59 Z M271.39 0.00 L281.44 17.40 L269.81 37.54 L246.56 37.54 L234.93 17.40 L244.98 0.00 Z M281.44 64.95 L271.39 82.35 L244.98 82.35 L234.93 64.95 L246.56 44.81 L269.81 44.81 Z M318.95 0.00 L311.00 13.76 L287.74 13.76 L279.79 0.00 Z M322.63 41.17 L311.00 61.32 L287.74 61.32 L276.11 41.17 L287.74 21.03 L311.00 21.03 Z M318.95 82.35 L279.79 82.35 L287.74 68.59 L311.00 68.59 Z M353.77 0.00 L363.81 17.40 L352.19 37.54 L328.93 37.54 L317.30 17.40 L327.35 0.00 Z M363.81 64.95 L353.77 82.35 L327.35 82.35 L317.30 64.95 L328.93 44.81 L352.19 44.81 Z M401.32 0.00 L393.37 13.76 L370.11 13.76 L362.17 0.00 Z M405.00 41.17 L393.37 61.32 L370.11 61.32 L358.49 41.17 L370.11 21.03 L393.37 21.03 Z M401.32 82.35 L362.17 82.35 L370.11 68.59 L393.37 68.59 Z M409.20 33.90 L399.67 17.40 L409.20 0.90 Z M409.20 81.45 L399.67 64.95 L409.20 48.45 Z"/>
    <g fill="none" stroke="#23272b" stroke-width="0.5">
