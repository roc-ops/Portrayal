<svg xmlns="http://www.w3.org/2000/svg" width="11.32mm" height="40.61mm" viewBox="0 0 11.32 40.61">
  <!-- The plate right of riser 2 and the plate left of riser 3 - the same
       pressing twice, either side of the divider that carries the rear-bay
       thumbscrew. Dell's service model has them as `Body_1_4.005` at face
       267.32..278.64 and `Body_1_5.006` at 297.10..308.42, both y 1.81..42.42
       and both 17.61 proud: identical to the hundredth in every dimension,
       which is what says one pressing rather than two similar ones.
       THE CLIP IS COMPOSED AND WINDOWED THROUGH THE OUTLINE, the same pattern
       dell/riser-1-shroud-14g@1 uses and for the same reason: composing a part
       makes render.py raise this outline to the END of its group, where it
       would repaint over the clip drawn before it. A window lets the clip
       through. Nothing shows through it in any configuration - this plate is
       only placed where its clip is. -->
  <path id="plate" fill-rule="evenodd" fill="#9aa1a8" stroke="#6d747c"
        stroke-width="0.3"
        d="M0.40 0 H10.92 A0.40 0.40 0 0 1 11.32 0.40 V40.21
           A0.40 0.40 0 0 1 10.92 40.61 H0.40 A0.40 0.40 0 0 1 0 40.21
           V0.40 A0.40 0.40 0 0 1 0.40 0 Z
           M1.68 24.21 H10.08 V40.61 H1.68 Z"/>
</svg>
