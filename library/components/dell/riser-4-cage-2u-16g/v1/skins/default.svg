<svg xmlns="http://www.w3.org/2000/svg" width="137.3mm" height="44.0mm" viewBox="0 0 137.3 44.0">
  <!-- dell/riser-4-cage-2u-16g: the R760's riser 4 cage. Original art from
       positions read off ISM figure 10. THE WINDOWS ARE HOLES (the slots are
       `behind: true`); TWO NODES: `plate`, which the contract stands 1.0
       proud, and `flange-cover`, the metal over each seated card's bracket
       flange, which the contract stands past the wall. It sits under the
       plate, so the flat drawing is the plate's alone. Its rectangles are
       each flange's fold, 1.5 each side, over the flange's length (the
       bays' seats of std/pcie-bracket-fh@2, turned over: the flange is at
       the left). -->
  <g id="flange-cover">
    <path d="M16.56 1.79 H19.56 V17.87 H16.56 Z" fill="#cfd3d7"/>
    <path d="M16.56 22.24 H19.56 V38.32 H16.56 Z" fill="#cfd3d7"/>
  </g>
  <g id="plate">
    <path fill-rule="evenodd" d="M0 0 H137.3 V44 H0 Z M27.3 8.1 a2 2 0 0 1 2 -2 H109.8 a2 2 0 0 1 2 2 V15.4 a2 2 0 0 1 -2 2 H29.3 a2 2 0 0 1 -2 -2 Z M27.3 28.7 a2 2 0 0 1 2 -2 H109.8 a2 2 0 0 1 2 2 V35.7 a2 2 0 0 1 -2 2 H29.3 a2 2 0 0 1 -2 -2 Z" fill="#cfd3d7" stroke="#9aa1a8" stroke-width="0.25"/>
    <rect x="0" y="0" width="25.3" height="44.0" fill="#dfe2e5"/>
    <circle cx="2.3" cy="15.7" r="4.0" fill="#2a9fd6" stroke="#1d6f95" stroke-width="0.3"/>
    <path d="M0.2 15.7 H4.4 M2.3 13.6 V17.8" stroke="#16313f" stroke-width="0.6" fill="none"/>
    <rect x="125.3" y="0" width="12.0" height="44.0" fill="#e3e6e9"/>
    <g id="vents" fill="#16191c">
      <rect x="128.9" y="7.4" width="3.4" height="3.4" rx="0.5"/><rect x="128.9" y="13.0" width="3.4" height="3.4" rx="0.5"/>
      <rect x="35.3" y="21.3" width="4.2" height="1.2" rx="0.3"/><rect x="40.9" y="21.3" width="4.2" height="1.2" rx="0.3"/><rect x="46.5" y="21.3" width="4.2" height="1.2" rx="0.3"/><rect x="52.1" y="21.3" width="4.2" height="1.2" rx="0.3"/><rect x="57.7" y="21.3" width="4.2" height="1.2" rx="0.3"/><rect x="63.3" y="21.3" width="4.2" height="1.2" rx="0.3"/><rect x="68.9" y="21.3" width="4.2" height="1.2" rx="0.3"/><rect x="74.5" y="21.3" width="4.2" height="1.2" rx="0.3"/><rect x="80.1" y="21.3" width="4.2" height="1.2" rx="0.3"/><rect x="85.7" y="21.3" width="4.2" height="1.2" rx="0.3"/><rect x="91.3" y="21.3" width="4.2" height="1.2" rx="0.3"/><rect x="96.9" y="21.3" width="4.2" height="1.2" rx="0.3"/>
    </g>
    <g id="silkscreen">
