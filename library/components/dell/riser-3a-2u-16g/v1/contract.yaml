format: 1
kind: module
name: riser-3a-2u-16g
version: 1.0.0
class: riser
behaviour: fills
profile: server
description: >-
  Dell riser 3A of the PowerEdge R760 - one full-height PCIe Gen4 x16 slot (slot 5, the upper) on dell/riser-3-cage-2u-16g@1, its lower window closed by a vented plate; fitted in riser configuration 5
attrs:
  riser: '3A'
  appears-in: 'riser configuration 5 (5-1 and 5-2)'
  power-absent: not-published
  slot-5: 'x16, full height, half length (full with the 3A FL), processor 2, PCIe Gen4'
provenance:
  power: >-
    NOT PUBLISHED - the riser is a passive board with connectors. The R760 ISM,
    technical guide and spec sheet were searched for 'riser' beside a wattage
    and none gives one.
  slots: >-
    datasheet - R760 ISM table 153, configurations 5-1 and 5-2: R3A carries slot 5 only, full height, Gen4 x16 on processor 2. ISM figure 215 shows one connector, labelled slot 5, and figure 216 (3A FL) shows the upper connector with the lower bracket window plated. The plate is modelled as `window-4`, which takes the filler and nothing else and is deliberately NOT named a slot: the ISM lists no slot 4 for this riser, and a `slot-4` bay would be exported as a PCIe slot that does not exist.
  face: >-
    photo-measured - composed from dell/riser-3-cage-2u-16g@1, the same face as riser 3B.
  seating: >-
    estimated - as dell/riser-3b-2u-16g@1.
  size: >-
    photo-measured - the cage's extent, 128.7 x 44.0.
size: {w: 128.7, h: 44.0, d: 246.9}
