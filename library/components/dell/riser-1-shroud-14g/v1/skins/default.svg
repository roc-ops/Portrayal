<svg xmlns="http://www.w3.org/2000/svg" width="25.62mm" height="64.43mm" viewBox="0 0 25.62 64.43">
  <!-- The sheet metal right of riser 1 - the outer skin over the PCIe retention
       bracket, and the only part of that assembly visible from outside. From
       Dell's service model, `R740XD_GPU_Brackets_01-1`, clipped at the panel
       plane: 17.76 proud against the bracket's 17.53, and spanning the riser's
       full height where the bracket covers two thirds of it. -->
  <!-- THE SLOT COLUMN. Not in the model at any plane: cutting at 729.0, just under the front
       face, leaves two small tabs, so the recess walls are never cut cleanly.
       Measured off ISM figure 8 - five at face x 128.00..131.40, first at
       y 17.75, pitch 5.47. A sixth above at about 12.25 reads 0.75 tall,
       mostly obscured, and is not drawn. -->
  <!-- THE SLOT COLUMN IS NOT IN THE MODEL AT ANY PLANE. Cutting at 729.0, just
       under the front face, leaves two small tabs - the recess walls are not
       cut cleanly and the slots never appear as holes. Measured off ISM figure
       8: five at face x 128.00..131.40, first at y 17.75, pitch 5.47. A sixth
       above at about 12.25 reads only 0.75 tall, mostly obscured, and is not
       drawn. -->
  <!-- HOLES IN THE PLATE AND A GROUP BENEATH, both - because this
       component composes a part again. render.py raises an `out` node to the
       end of the group when there are composed parts, so the plate would
       otherwise paint over its own slots. The contract predicted this. -->
  <!-- THE LOWER SHELF, and the reason this part's box starts 8.94 left of any
       ink it had. `Body_2_3.002` in the service model runs face 111.70..148.60,
       y 3.36..67.04, standing 11.06 proud - a WIDE shelf under the narrow
       raised plate, and the left edge the component was sized from. It was
       never drawn, so the strip from the box's left edge to the plate was
       empty: transparent in 2D, and in 3D an open canyon with the plate's own
       side wall standing in it as a face belonging to nothing.
       Clipped to this component at x 25.62 and y 64.43; the shelf runs on past
       both, under dell/rear-bay-frame-14g@4 - see the contract. -->
  <rect id="base" x="0" y="1.55" width="25.62" height="62.88"
        fill="#8c939b" stroke="#6d747c" stroke-width="0.3"/>
  <g id="slots" fill="#1b1f23">
    <rect x="16.30" y="15.94" width="3.4" height="4.15" rx="0.35"/>
    <rect x="16.30" y="21.41" width="3.4" height="4.15" rx="0.35"/>
    <rect x="16.30" y="26.88" width="3.4" height="4.15" rx="0.35"/>
    <rect x="16.30" y="32.35" width="3.4" height="4.15" rx="0.35"/>
    <rect x="16.30" y="37.82" width="3.4" height="4.15" rx="0.35"/>
  </g>
  <!-- THE EXPANSION-CARD RETENTION CLIP, and the bar above it. Blue is Dell's
       user-serviceable colour, so a clip here is what a person grips to release
       the riser - the operator's "you pull them out from the top".
       Two blue prongs splayed at the top and leaning together at the bottom,
       face 125.80..133.20, y 54.60..62.30, either side of a dark slot at
       128.25..130.75. Above them a plain dark bar at face 126.50..132.50,
       y 48.30..50.30 - the operator's "one turned rectangle", and it is turned:
       6.00 x 2.00 where the five slots below are 3.40 x 4.15.
       IT IS BACKED AND WINDOWED, exactly like the slots, and for the same
       reason. This component composes a part, which re-triggers render.py's
       raise rule, so the shroud outline is moved to the END of its group and
       repaints over anything drawn before it. Adding the clip and rendering it
       showed nothing at all; the fix is to draw it here and cut a window in the
       outline to let it through, which is the pattern already in this file.
       THE PRONG BLUE IS SAMPLED AND IS NOT THE THUMBSCREW'S: #5c7b99 here
       against #7098be for the thumbscrew, in the same figure. This clip sits in
       a recess and is lit differently. Reusing the library's #6d92b5 was the
       obvious move and would have been wrong. -->
  <!-- THE CLIP IS COMPOSED, NOT DRAWN HERE. The chassis has three of them -
       one per riser - and this file had the only copy, so two more were
       modelled as rivets in dell/rear-bay-frame-14g. It is
       dell/riser-card-clip-14g@1 now, seated in the recess this path still
       cuts for it. -->
  <path id="shroud" fill-rule="evenodd" fill="#9aa1a8" stroke="#6d747c"
        stroke-width="0.3" d="M0.00 1.50 L0.00 2.50 L8.94 2.56 L8.94 63.19 L10.19 63.25 L9.38 63.38 L9.38 64.38 L25.19 64.38 L25.19 63.38 L24.38 63.25 L25.56 63.19 L25.56 2.69 L22.88 2.62 L23.38 0.00 L13.25 0.00 L13.19 2.69 L10.06 2.69 L10.00 1.50 Z M16.65 15.94 H19.35 A0.35 0.35 0 0 1 19.70 16.29 V19.74 A0.35 0.35 0 0 1 19.35 20.09 H16.65 A0.35 0.35 0 0 1 16.30 19.74 V16.29 A0.35 0.35 0 0 1 16.65 15.94 Z M16.65 21.41 H19.35 A0.35 0.35 0 0 1 19.70 21.76 V25.21 A0.35 0.35 0 0 1 19.35 25.56 H16.65 A0.35 0.35 0 0 1 16.30 25.21 V21.76 A0.35 0.35 0 0 1 16.65 21.41 Z M16.65 26.88 H19.35 A0.35 0.35 0 0 1 19.70 27.23 V30.68 A0.35 0.35 0 0 1 19.35 31.03 H16.65 A0.35 0.35 0 0 1 16.30 30.68 V27.23 A0.35 0.35 0 0 1 16.65 26.88 Z M16.65 32.35 H19.35 A0.35 0.35 0 0 1 19.70 32.70 V36.15 A0.35 0.35 0 0 1 19.35 36.50 H16.65 A0.35 0.35 0 0 1 16.30 36.15 V32.70 A0.35 0.35 0 0 1 16.65 32.35 Z M16.65 37.82 H19.35 A0.35 0.35 0 0 1 19.70 38.17 V41.62 A0.35 0.35 0 0 1 19.35 41.97 H16.65 A0.35 0.35 0 0 1 16.30 41.62 V38.17 A0.35 0.35 0 0 1 16.65 37.82 Z M14.0 45.79 H21.6 A0.4 0.4 0 0 1 22.0 46.19 V61.79 A0.4 0.4 0 0 1 21.6 62.19 H14.0 A0.4 0.4 0 0 1 13.6 61.79 V46.19 A0.4 0.4 0 0 1 14.0 45.79 Z"/>
</svg>
