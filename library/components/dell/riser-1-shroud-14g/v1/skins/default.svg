<svg xmlns="http://www.w3.org/2000/svg" width="25.62mm" height="64.43mm" viewBox="0 0 25.62 64.43">
  <!-- The sheet metal right of riser 1 - the outer skin over the PCIe retention
       bracket, and the only part of that assembly visible from outside. From
       Dell's service model, `R740XD_GPU_Brackets_01-1`, clipped at the panel
       plane: 17.76 proud against the bracket's 17.53, and spanning the riser's
       full height where the bracket covers two thirds of it. -->
  <!-- THE SLOT COLUMN. Not in the model at any plane: cutting at 729.0, just under the front
       face, leaves two small tabs, so the recess walls are never cut cleanly.
       Measured off ISM figure 8 - five at face x 128.00..131.40, first at
       y 17.75, pitch 5.47. A sixth above at about 12.25 reads 0.75 tall,
       mostly obscured, and is not drawn. -->
  <!-- THE SLOT COLUMN IS NOT IN THE MODEL AT ANY PLANE. Cutting at 729.0, just
       under the front face, leaves two small tabs - the recess walls are not
       cut cleanly and the slots never appear as holes. Measured off ISM figure
       8: five at face x 128.00..131.40, first at y 17.75, pitch 5.47. A sixth
       above at about 12.25 reads only 0.75 tall, mostly obscured, and is not
       drawn. -->
  <!-- HOLES IN THE PLATE AND A GROUP BENEATH, both - because this
       component composes a part again. render.py raises an `out` node to the
       end of the group when there are composed parts, so the plate would
       otherwise paint over its own slots. The contract predicted this. -->
  <g id="slots" fill="#1b1f23">
    <rect x="16.30" y="15.94" width="3.4" height="4.15" rx="0.35"/>
    <rect x="16.30" y="21.41" width="3.4" height="4.15" rx="0.35"/>
    <rect x="16.30" y="26.88" width="3.4" height="4.15" rx="0.35"/>
    <rect x="16.30" y="32.35" width="3.4" height="4.15" rx="0.35"/>
    <rect x="16.30" y="37.82" width="3.4" height="4.15" rx="0.35"/>
  </g>
  <path id="shroud" fill-rule="evenodd" fill="#9aa1a8" stroke="#6d747c"
