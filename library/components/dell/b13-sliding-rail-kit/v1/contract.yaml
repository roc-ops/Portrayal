format: 1
kind: kit
name: b13-sliding-rail-kit
version: 1.0.0
description: >-
  The stab-in/drop-in sliding rails (Dell rail identifier B13) for the PowerEdge R740 and R740xd,
  with the optional cable management arm. A sliding rail for four-post racks. It takes the
  chassis either lowered onto the rails or pushed in along them. The chassis slides fully out of
  the rack for service. It collapses far enough for racks whose posts are about 24 inches apart. It does
  not mount in a two-post rack.
motion: sliding
travel: full
install: both
parts:
  - {ref: dell/b13-sliding-rail@1, id: rail, count: 2}
configurations:
  - id: four-post
    racks: [4-post]
    parts: [rail]
    depth:
      square: [559, 931]
      round: [559, 931]
      threaded: [559, 931]
    rail-depth: 714
accessories:
  - {kind: cma, ref: dell/cable-management-arm-14g@1, rail-depth: 845, sides: [left, right]}
provenance:
  depth: >-
    The Dell Technologies Enterprise Systems Rail Sizing and Rack Compatibility Matrix (Copyright
    December 2023, Version 4.7), PDF page 12 (printed page 10), Table 2, the row group that lists
    the R740 and R740xd, rail B13: 559 to 931 mm for square, round and threaded holes alike.
    THE TECHNICAL GUIDE LOST. The Dell PowerEdge R740 and R740xd Technical Guide (July 2019),
    printed pages 50 to 51 and Table 19 on printed page 53, gives 603 to 915 mm for all three
    hole types. The matrix is the newer by four years, so its figures are written. The matrix
    prints a higher minimum (609, with a footnote for chassis that self-adjust) for other chassis
    groups; the group of this device has none.
  rail-depth: >-
    714 mm without the arm and 845 mm with it, in the matrix (Table 2, same row, the 714 with the
    footnote "with CMA brackets removed") and in the guide (Table 19), which agree. It is measured
    from the front of the front post.
  hole-type: >-
    The matrix ticks threaded holes for this rail with footnote w only (the threaded hole of the
    rack flange must be 10-32UNF-2B or larger) and no minor-conversion mark; the guide's Table 18
    (printed page 52) ticks them with no mark either, so the two agree. The guide adds that no
    screws are needed to mount the rails in the racks.
  install: >-
    The guide, printed page 52: the stab-in or the drop-in method of fitting the chassis to the
    rails is chosen by the user with this rail, and the B6 is drop-in only. The matrix's rail
    type for it reads "Drop-in/Stab-in".
  rack-type: >-
    Four-post racks only (the guide, printed page 52, "Both sliding rails support mounting in
    4-post racks only"; the matrix marks 2-post "X"). The guide says this rail is the one
    required for the Dell Titan and Titan-D racks; that is a statement about racks and stays here.
  motion: >-
    Full extension out of the rack (the guide, printed page 51); no travel in millimetres is
    printed, so `travel` is `full`.
gaps:
  - what: strain-relief-bar
    scope: [four-post]
    reason: vendor-silent
    note: >-
      The matrix (printed page 4, "Cable Management Solutions") says most stab-in sliding rails
      are compatible with CMA and SRB solutions, and prints only 845 for this row, with no
      bracketed figure. The guide never mentions a bar.
    wanted: >-
      A page that says the strain-relief bar is offered for the R740 and R740xd, its Dell part
      number and the rail depth with it fitted. The rail installation guide settles it.
  - what: part-dimensions
    scope: [rail]
    reason: needs-drawing
    wanted: >-
      A dimensioned drawing of the rail and of the cable management arm. The guide and the matrix
      give the rail's depth in the rack and no section, so the parts carry placeholder envelopes.
