  slots: >-
    datasheet - R760 ISM table 153 (configurations 1 and 8) and table 18: slots 1 and 2 are full height, x8 electrical on an x16 connector, PCIe Gen4, controlled by processor 1. Length: table 18 gives half length with the regular shroud and full length with the GPGPU shroud; half is the shipped case. Slot 1 is the lower and slot 2 the upper: ISM figure 208 points slot 2 at the upper connector.
  face: >-
    photo-measured - composed from dell/riser-1-cage-2u-16g@1, the metal every riser 1 variant presents; the slot bays sit on its windows.
  seating: >-
    estimated - each bay is a full-height bracket (120.02 x 21.59) behind the cage, tip at the left, its vent field's centre line on its window's: x 0.4, y -0.65 (slot 2) and 19.8 (slot 1). The brackets, cards and fillers are the 1U R660's, which share Dell's 120.02 mm full-height bracket (PCI-SIG CEM); the ISM does not dimension the seating.
  size: >-
    photo-measured - the cage's extent, 125.0 x 44.0.
