format: 1
kind: component
name: control-panel-grid-14g
version: 1.0.0
class: silkscreen
description: >-
  The small grid of squares moulded into a 14th-generation PowerEdge right
  control panel, between the two USB ports - seven across and three down, and
  not a vent
size: {w: 8.39, h: 4.91}
provenance:
  size: >-
    drawing - Dell's r750-24d-2-5-front Visio master draws it as three bars at
    y 37.38..38.65, 39.20..40.47 and 41.02..42.29, all spanning x 458.65..467.03,
    which is 8.39 x 4.91 overall on a row pitch of 1.82. THREE ROWS IS THE
    DRAWING'S OWN COUNT, and it agrees with the operator's reading of the machine
    - "three rows tall" - which is why the figure is recorded rather than the
    bars being taken for a single hatched patch.
    Seven columns is the OPERATOR'S count, from the hardware. The master draws
    each row as one bar and does not resolve the columns, so the two sources
    answer different halves of the same grid and neither contradicts the other.
  not-a-vent: >-
    THIS IS NOT PERFORATION, and the distinction is why it is `silkscreen` rather
    than a `vent` element or a decor pattern. The operator is explicit: the
    squares are a design on the panel and not holes punched through it. Recording
    it as a vent would say air passes here, and L64 would then let a legend or a
    jack be placed on something that is not a surface.
  why-a-component: >-
    a decor `pattern` tiles a region and cannot promise seven by three - it would
    fit whatever squares the region happened to hold, and the count is the fact
    worth keeping. A part with the grid drawn in it says exactly what is there.
skins: [default]
