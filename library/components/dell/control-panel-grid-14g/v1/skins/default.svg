<svg xmlns="http://www.w3.org/2000/svg" width="8.39mm" height="4.91mm" viewBox="0 0 8.39 4.91">
  <!-- Seven by three, moulded into the panel between the two USB ports.
       NOT PERFORATION - the squares are a design and not holes, so they are
       drawn as slightly darker faces on the panel rather than as openings.
