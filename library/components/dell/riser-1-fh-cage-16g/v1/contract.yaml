format: 1
kind: component
name: riser-1-fh-cage-16g
version: 1.1.0
class: riser
profile: server
description: >-
  the riser 1 cage of a 16th-generation 1U PowerEdge (R660) - one full-height window, its clip at the left and slot number 1 printed beside the window
attrs:
  power-absent: not-applicable
provenance:
  power: >-
    NOT APPLICABLE - sheet metal and print; the riser that composes it carries
    the power record.
  why-this-is-its-own-part: >-
    THE METAL IS SHARED AND THE WIRING IS NOT. Dell's riser variants on this
    cage (riser 1P) differ in which processor and PCIe generation each slot
    carries (ISM table 111), and not in anything the rear face shows - so the
    face is drawn once, here, and each variant composes it, as
    dell/riser-2-fh-plate-14g@1 does for the 14th generation.
  sources: >-
    drawing - the VisioCafe master `R660 2xPCI FH Rear` (r660-2xpci-fh-rear-1), read on the 434 body
    at 22.24 px/mm with y scaled 0.9926 (see dell/psu-1400w-ac-60mm@1,
    provenance/stencil-scale). Facts read, art not traced.
  size: >-
    drawing - 120.60 x 19.80 from rear-face x 107.00, y 2.20: the riser's
    extent between its neighbours on the master, at the height of
    dell/riser-3-blank-16g@1, the plate riser 3's place takes without it.
  features: >-
    drawing - the window 122.5..221.5 (see windows) between the clip at 110.43..116.36 and riser 4's latch, numeral 1 with a right-pointing triangle at 118.48, all in rear-face millimetres.
  windows: >-
    THE WINDOW STOPS SHORT OF THE KEYED STEP at the flange end, 5.5 inside the
    master's plate end, so a full-height card's keyed flange is under the cage;
    the master's last vent column is still inside it.
  numerals: >-
    drawing - THE SLOT NUMBERS ARE PRINTED ON THE RISER, NOT THE CHASSIS: the
    masters move them with the cage (the full-height risers print theirs beside
    the window with a right-pointing triangle; riser 2Q prints its numbers and
    GEN 5 on a strip over each slot, per the photograph), and the rear-storage master, which has no riser
    2, prints no 1 or 2. Glyph heights 2.5 on the masters; the font is not
    identified.
size: {w: 120.60, h: 19.80}
size-confidence: {w: drawing, h: drawing}
relief:
  features:
  - node: plate
    out: 20.0
    shape: true
    color: '#cfd3d7'
    confidence: estimated
    source: >-
      estimated by analogy with the low-profile cages, 20 mm proud in Dell's service model; the full-height risers are not in the model. Its windows are cut through it, so a card's face is seen down
      them and the bracket's folded flange, 9.4 proud at the end the window
      does not show, is inside the cage, as on the R740xd's riser shrouds.
skins: [default]
