<svg xmlns="http://www.w3.org/2000/svg" width="120.60mm" height="19.80mm" viewBox="0 0 120.60 19.80">
  <!-- riser-1-fh-cage-16g: original art from positions measured on the VisioCafe
       master; facts read, art not traced. The windows are holes: the
       slots are `behind: true`, so a filler shows through them and this
       metal covers its ends. THE CAGE IS TWO NODES. `plate` is the
       cage's face, which the contract stands 1.0 proud by its outline:
       its printing and latches are inside it so they ride on its front,
       and the printed triangles are polygons, not paths, so they are not
       read as holes. `flange-cover` is the metal over the seated card's
       bracket flange, which the contract stands past the wall; it sits
       under the plate, so the flat drawing is the plate's alone. Its
       rectangle is the flange's fold, 1.5 each side, over the flange's
       length (the bay's seat of std/pcie-bracket-fh@2). -->
  <g id="flange-cover">
    <path d="M117.66 1.99 H120.30 V18.07 H117.66 Z" fill="#cfd3d7"/>
  </g>
  <g id="plate">
  <path fill-rule="evenodd" d="M0.30 0.30 H120.30 V19.50 H0.30 Z M15.50 2.09 H114.50 V19.50 H15.50 Z" fill="#cfd3d7" stroke="#9aa1a8" stroke-width="0.25"/>
    <rect x="3.30" y="1.50" width="6.00" height="18.60" rx="0.3" fill="#e3e6e9"/>
    <rect x="3.43" y="1.68" width="1.48" height="4.55" rx="0.3" fill="#16191c"/>
    <rect x="3.43" y="16.37" width="1.48" height="2.72" rx="0.3" fill="#16191c"/>
    <rect x="7.88" y="3.47" width="1.48" height="2.77" rx="0.3" fill="#16191c"/>
    <rect x="7.88" y="16.37" width="1.48" height="2.72" rx="0.3" fill="#16191c"/>
    <g id="silkscreen">
      <text x="11.95" y="11.50" font-family="sans-serif" font-size="3.4" fill="#2b2f33" text-anchor="middle">1</text>
      <polygon points="11.30,12.35 12.56,13.06 11.30,13.78" fill="#2b2f33"/>
    </g>
  </g>
</svg>
