<svg xmlns="http://www.w3.org/2000/svg" width="107.59mm" height="41.68mm" viewBox="0 0 107.59 41.68">
  <!-- riser-3a-14g: THE OPENINGS AND NOTHING ELSE.
       The plate, its louvres and its colour are composed from
       dell/riser-3-plate-14g@1, which is the metal every variant
       sharing it presents; this skin draws only the anchors.
       THEY MUST EXIST AND THEY MUST NOT DRAW. render.py hangs each bay's
       data-path on the node whose id matches the bay, so without these rects a
       seated card is hung off the chassis root instead of inside this riser -
       and L48, the rule that catches exactly that, returns early for a part
       with no skin files at all, so it would never say a word.
       They keep no stroke: a stroked anchor drew a second outline just inside
       every window, which was one shape drawn twice rather than read wrong. -->
  <rect id="slot-7" x="5.04" y="5.00" width="100.00" height="12.2" rx="1.4" fill="none" stroke="none"/>
  <rect id="slot-8" x="5.04" y="25.32" width="100.00" height="12.2" rx="1.4" fill="none" stroke="none"/>
</svg>
