format: 1
kind: module
name: lom-blank-16g
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  The blank a 16th-generation PowerEdge (R660, R760, R7625) fits in the LOM
  card's rear window when no LOM card is installed - Dell YM3P9, a sheet-metal
  tray stamped LOM BLANK whose rear face is plain with two rows of six vents
attrs:
  dell-part: YM3P9
  power-absent: not-applicable
provenance:
  identity: >-
    photo - resellers list Dell YM3P9 as the onboard LOM blank for the
    PowerEdge R660, R760 and R7625, and the part is stamped LOM BLANK on its
    tray (Server Worlds' and Express Computer Systems' listings,
    photos/r660/lom-blank). The R660 ISM makes the LOM card optional and does
    not picture what fills its window without one.
  face: >-
    photo - Server Worlds' near straight-on photograph of the rear face: plain
    galvanised metal with two rows of six rounded-square vents, the field
    centred left to right (10.4 mm of metal either side of it). The vents'
    width to pitch, 97 to 134 px, is the 4.05 on 5.49 of Dell's other rear
    vents (dell/riser-3-blank-16g@1), and that is the scale used; the face is
    seen from slightly above, so the rows' heights are estimates.
  size: >-
    drawing - 42.58 x 15.93, THE WINDOW THE REAR SHOWS, as dell/lom-2x1g-16g@1:
    the blank's face is wider than the window (about 52.8 by the vent scale)
    and its ends are behind the chassis, as the LOM card's bracket's are.
  vents: >-
    photo - two rows of six, 4.05 x 4.02 on a 5.49 pitch, centred in the
    window: columns from 5.54, rows at 4.60 and 10.09 (estimated, see face).
  depth: >-
    NOT KNOWN; the tray is as deep as a card in the photographs and is drawn
    as its face.
  power: >-
    NOT APPLICABLE - sheet metal.
size: {w: 42.58, h: 15.93}
size-confidence: {w: drawing, h: drawing}
skins: [default]
