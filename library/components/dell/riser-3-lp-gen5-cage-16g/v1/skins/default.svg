<svg xmlns="http://www.w3.org/2000/svg" width="92.00mm" height="19.80mm" viewBox="0 0 92.00 19.80">
  <!-- riser-3-lp-gen5-cage-16g: original art from positions measured on the VisioCafe
       master and printing read off a photograph of the real riser; facts
       read, art not traced. The windows are holes: the slots are `behind:
       true`, so a filler shows through them and this metal covers its ends.
       THE CAGE IS ONE NODE, `plate`, stood 20 proud by its outline: its
       printing is inside it, the triangles are polygons, not paths. -->
  <g id="plate">
  <path fill-rule="evenodd" d="M0.30 0.30 H91.70 V19.50 H0.30 Z M9.75 1.92 H68.43 V19.50 H9.75 Z" fill="#cfd3d7" stroke="#9aa1a8" stroke-width="0.25"/>
    <rect x="79.00" y="0.60" width="9.40" height="19.60" rx="0.3" fill="#5a6066"/>
    <rect x="80.40" y="0.61" width="4.23" height="19.19" rx="0.3" fill="#2b3035"/>
    <g id="silkscreen">
      <rect x="9.75" y="0.30" width="58.68" height="1.62" fill="#24282c"/>
      <polygon points="37.54,0.68 38.84,0.68 38.19,1.48" fill="#e6e8ea"/>
      <text x="39.39" y="1.66" font-family="sans-serif" font-size="1.7" fill="#e6e8ea">3</text>
      <text x="67.83" y="1.65" font-family="sans-serif" font-size="1.4" fill="#e6e8ea" text-anchor="end">GEN 5</text>
    </g>
  </g>
</svg>
