format: 1
kind: component
name: riser-3-lp-gen5-cage-16g
version: 1.0.0
class: riser
profile: server
description: >-
  the Gen5 riser 3 cage of a 16th-generation 1U PowerEdge (R660) - riser 3A's metal, with a dark strip over the slot carrying its number and GEN 5; shared by risers 3P, 3Q, 3R and 3S
attrs:
  power-absent: not-applicable
provenance:
  power: >-
    NOT APPLICABLE - sheet metal and print; the riser that composes it carries
    the power record.
  why-this-is-its-own-part: >-
    THE METAL IS SHARED AND THE WIRING IS NOT. Dell's riser variants on this
    cage (risers 3P, 3Q, 3R and 3S) differ in which processor and PCIe generation each slot
    carries (ISM table 111), and not in anything the rear face shows - so the
    face is drawn once, here, and each variant composes it, as
    dell/riser-2-fh-plate-14g@1 does for the 14th generation.
  sources: >-
    drawing - the VisioCafe master `R660 3xPCI LP Rear` (r660-3xpci-lp-rear-1), read on the 434 body
    at 22.24 px/mm with y scaled 0.9926 (see dell/psu-1400w-ac-60mm@1,
    provenance/stencil-scale). Facts read, art not traced.
  size: >-
    drawing - 92.00 x 19.80 from rear-face x 270.60, y 2.20 - 2.20 wider at the left than the master's riser, to meet riser 2's cage and close the gap slot 3's tip would show through: the riser's
    extent between its neighbours on the master, at the height of
    dell/riser-3-blank-16g@1, the plate riser 3's place takes without it.
  features: >-
    drawing - window 280.35..339.03 (see windows; the master's filler plate runs 278.70..348.70) (riser 3A's is notched top-left under its numeral; this cage's is not, its 3 being on the strip - see numerals), the latch 349.6..359.0 - a latch the masters draw only where riser 3 is fitted (the 3 x LP and rear-storage masters), and not on the riser configuration 6 and 8 masters, which put vents there, all in rear-face millimetres.
  windows: >-
    THE WINDOW IS THE BRACKET'S FULL-HEIGHT BODY, 56.18 of a low-profile
    bracket's 79.20 (std/pcie-bracket-lp@1: chamfers from the tip to 11.85,
    the keyed step from 68.03), placed where the slot seats it. The masters
    draw Dell's fillers as plain plates 70 wide and the first windows were
    that wide, which showed a card's chamfers and keyed step at both ends and
    stacked two of them at the junction between slots. Every master vent field
    falls inside the narrower window, so a filler reads as before; the margins
    are cage metal of nearly its grey. The R740xd's riser windows are cut the
    same way. ON THE FLANGE END THE WINDOW RUNS 2.50 PAST THE BODY: the
    connector opening ends 2.13 beyond it (CEM: 70.16 from the tip against
    the body's 68.03), and stopping at the body clipped a card's outer port. Slot 3's bracket is where Dell's service model has it, 268.50, its tip reaching under riser 2's cage (the device paints riser 3 first); the window starts at its body, 1.65 right of the master's filler plate. A version that moved the bracket 4.7 right to hide its tip left a wide blank at the cage's left and read as misplaced.
  numerals: >-
    photo - StorageReview's rear photograph of a real R660 in riser
    configuration 2 (R2P + R3P), photos/r660/storagereview-e3s, -E3S-4.jpg:
    THE GEN5 RISER 3 PRINTS ON A STRIP - a dark strip over slot 3's window
    with a down-pointing triangle and 3 centred and GEN 5 at its right end,
    where the Gen4 riser 3A (dell/riser-3-lp-cage-16g@1) prints a triangle and
    3 in a notch at the window's corner. Placed on the window by eye from a
    photograph at about 2.5 px/mm, not measured.
