provenance:
  identity: >-
    A REMOVABLE ASSEMBLY THAT BRINGS ITS OWN SLOT (ISM figure 119, 'Riser 3A',
    slot 3), so it is a module with `bays`.
  slots: >-
    datasheet - R6615 ISM table 16 and table 97: slot 3 low profile, half
    length, x16 (Gen4), processor 1 - the R660's riser 3A is wired to processor
    2, which this one-socket server does not have. Table 17 (technical guide
    table 11) lists the riser in configurations 1 and 8.
  power: >-
    NOT PUBLISHED - the riser is a passive board with connectors. The R6615 ISM,
    technical guide and spec sheet were searched for 'riser' beside a wattage
    and none gives one.
  face: >-
    borrowed - composed from dell/riser-3-lp-cage-16g@1, the metal of the
    R660's riser 3A.
  size: >-
    borrowed - the cage's extent, 92.00 x 19.80.
  seating: >-
    borrowed - the slot bay is dell/riser-3a-16g@1's.
  body: >-
    borrowed - the board and connector are dell/riser-3a-16g@1's.
  plan: >-
    borrowed - dell/riser-3-plan-16g@1, the R660's riser 3 outline, which lands
    on the R6615's figure 11 at matched scale (x 141 to 288 against the figure's
    140 to 290 px at 0.8 of 2.195 px/mm).
