<svg xmlns="http://www.w3.org/2000/svg" width="8.4mm" height="16.4mm" viewBox="0 0 8.4 16.4">
  <!-- The card retention clip - one per riser, where that riser's brackets end
       and the L of the bracket is held. Lifted verbatim out of
       dell/riser-1-shroud-14g@1, which is where its numbers are argued.
       THE BLUE PRONGS ARE THE WHOLE POINT OF IT and they are what identifies it
       in a figure: two tapered arms either side of a dark recess, in the same
       #5c7b99 the riser clip carries elsewhere on this face. At 4 px/mm the bar
       above them and the recess below read as two stacked circles, which is
       exactly how two of these came to be modelled as rivets. -->
  <rect id="body" x="0" y="0" width="8.4" height="16.4" rx="0.4" fill="#8b9299"/>
  <rect id="clip-bar" x="1.2" y="0.7" width="6.00" height="2.00"
        rx="0.3" fill="#3f4149"/>
  <rect id="clip-recess" x="1.3" y="8.2" width="5.80"
        height="7.60" rx="0.4" fill="#20242a"/>
  <g id="clip-prongs" fill="#5c7b99" stroke="#3f566d" stroke-width="0.2">
    <polygon points="0.5,7.0 2.95,7.0 2.95,14.7 1.7,14.7"/>
    <polygon points="7.9,7.0 5.45,7.0 5.45,14.7 6.7,14.7"/>
  </g>
</svg>
