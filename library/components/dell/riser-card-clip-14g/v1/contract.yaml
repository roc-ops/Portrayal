format: 1
kind: component
name: riser-card-clip-14g
version: 1.1.0
class: mechanical
profile: compute
description: >-
  The blue card-retention clip at the end of a riser's slots on a 14G PowerEdge,
  where the L of a PCIe bracket is held
size: {w: 8.4, h: 16.4}
provenance:
  it-was-inside-the-riser-1-shroud: >-
    Lifted verbatim out of dell/riser-1-shroud-14g@1 so it can be placed three
    times instead of once. Nothing was re-measured in the move and that file is
    still where these numbers are argued; only the origin shifted, to the clip's
    own top-left.
  there-are-three-of-them-and-the-model-had-one: >-
    photo-measured off the R740 ISM's three-riser rear, by COLOUR rather than by
    eye: the prongs are the only saturated blue in that band apart from the
    divider thumbscrew, which is round and known. Pairs at face 125.50..133.75,
    269.00..277.25 and 299.00..307.25 - an 8.25 outer span in all three, which
    is what says they are the same part rather than three similar things.
    One per riser, at the end of that riser's slots.
  what-was-drawn-in-two-of-those-places: >-
    TWO STROKED CIRCLES AND A HOLE, CALLED RIVETS, centred on face 273.00 and
    301.50 - which is where the clips are. At 4 px/mm this part is a pale bar
    above a dark recess with blue either side, and the bar and recess read as
    two stacked circles. The colour is what breaks the tie: rivets are not blue.
  depth: >-
    estimated - 3.0, carried over from the shroud. The clip stands proud of the
    sheet metal and nothing held here dimensions by how much.
elements:
  body: {at: [0.0, 0.0], size: [8.4, 16.4], class: bezel}
relief:
  features:
  # THICKNESS, NOT A HOLE. This carried 3.0 as `size.d`, and
  # render.py reads a non-module, non-mounts part's `d` as the
  # depth of an APERTURE - so it was a pit in the panel. The
  # number is the same; what it means is a protrusion.
  - node: body
    out: 3.0
    confidence: estimated
    source: >-
      carried over verbatim from this part's own `size.d`, where it
      had been since the part was drawn - the clip is a pressing bolted to the chassis and 3.0 is how thick it is - not how deep a hole behind it would be. It sits proud of the panel and a fitted rear blank covers it, which is why it still draws before the bays. No new reading was
      taken; the correction is to what the number means, not to the
      number.
skins: [default]
