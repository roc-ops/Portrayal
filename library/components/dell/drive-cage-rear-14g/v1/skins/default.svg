<svg xmlns="http://www.w3.org/2000/svg" width="287.18mm" height="42.98mm" viewBox="0 0 287.18 42.98">
  <!-- EXTRACTED at the panel plane by spec/tools/intake/cad-outline.py, cut at
       z 713.5 and simplified at 0.40 mm. A FRAME: a top rail, a bottom rail and
       two mounting tabs, with the drive openings between them. The left tab's
       hole lands under dell/thumbscrew-blue-14g@1, which was placed from a
       different reading entirely.
       DO NOT MEASURE THE 0.40 BACK OFF THIS OUTLINE - it is the simplification
       tolerance, not a radius. -->
  <path id="frame" fill-rule="evenodd" fill="#8c939b" stroke="#5a6069"
        stroke-width="0.3" d="M2.50 40.69 L2.50 41.88 L123.19 41.88 L123.19 40.69 Z M135.19 2.69 L135.19 41.88 L151.00 41.88 L151.06 42.94 L162.94 42.94 L162.94 41.94 L152.00 41.88 L152.00 2.69 Z M286.12 1.38 L286.12 12.12 L287.12 12.12 L287.12 1.38 Z M0.00 1.38 L0.00 38.88 L1.31 38.88 L1.31 26.88 L11.00 26.81 L11.00 6.00 L10.25 4.38 L8.88 3.44 L1.38 3.38 L1.31 1.38 Z M5.44 6.75 L7.62 7.12 L8.69 8.56 L8.38 10.75 L6.88 11.88 L4.81 11.62 L3.62 10.06 L3.88 8.00 Z M2.00 0.00 L2.00 1.19 L285.12 1.19 L285.12 0.00 Z"/>
  <!-- THE SCREW SITS ON A PAD, and the tab was drawn as one flat block. The
       figure separates them by tone rather than by outline: a brighter pad from
       face y 4.25 to 17.50 with the thumbscrew on it, then a duller bar below
       from 17.75 to 29.50. Same metal, different faces of it - the pad is
       tilted toward the light and the bar is not - so this is a highlight and
       not a separate part.
       Width is clipped to the tab's own 11.00; the figure reads the pad as
       143.75..156.00, a little wider each side, which at 4 px/mm on a bright
       feature against bright metal is halo rather than metal. -->
  <rect id="screw-pad" x="0.00" y="2.54" width="11.0" height="13.25"
        rx="1.1" fill="#a9b0b7" stroke="#7d848c" stroke-width="0.25"/>
  <!-- THE TONGUE, BENT DOWN INTO THE CHASSIS. Below the screw pad and the bar
       the same tab carries a third face that is not duller but DARK - tone
       falls from about 178 on the bar to about 110 here, which no flat surface
       beside another flat surface does. It is a pressed tongue angled away from
       the light, about 12 degrees on the operator's reading, and slightly
       narrower than the bar it comes off. The figure reads it 10.80 wide with
       its right edge at 156.80 - past the 155.26 the pad and the bar both end
       at - and a tongue cannot overhang the tab it is pressed out of. Drawn to
       9.26, right edge flush at 155.26, taking the width off the right where
       the overhang is. Same halo the pad shows, in the same direction.
       Face 146.00..156.80, y 29.50..39.00. The colour is the measured ratio
       against the bar rather than a pick - 110/178 of it - so the step reads
       as a change of angle rather than a change of part. -->
  <rect id="screw-tab-tongue" x="1.74" y="27.79" width="9.26" height="9.5"
        rx="1.2" fill="#626971" stroke="#4a5057" stroke-width="0.25"/>
  <!-- THE PANEL BETWEEN THE SCREW TAB AND THE FIRST DRIVE BAY. The extracted
       outline has only a top and bottom rail across here - that metal is a face
       the projection at the panel plane does not catch - so it is drawn as a
       plate and its features measured off ISM figure 8.
       FOUR SQUARES AND TWO RINGS, and the fill fraction is what tells them
       apart at this size: the squares come back 90-95% filled and the rings 43%
       and 31%, which is a ring of about 0.8 wall on a 7 mm circle. Reading them
       all as blobs would have drawn six squares.
       squares face 157.70/163.25 x 18.10/23.50, 4.80 x 4.70, pitch 5.55/5.40
       rings   face 162.40, 12.50 and 162.40, 33.50, about 7.1 across
       THE RING INK IS #6d747c AGAINST A #8c939b PANEL. First drawn at #8b9299,
       which is the dull grey the CHASSIS rivets use against a #9aa1a8 panel -
       the same small step, but this background is a different colour and the
       two were within one part in 255 of each other. The rings were in the
       drawing, in the file and in the render, and invisible. A colour is only
       dull relative to what it sits on. -->
  <rect id="cage-panel" x="11.00" y="1.19" width="14.74"
        height="37.79" rx="0.6" fill="#8c939b" stroke="#5a6069"
        stroke-width="0.25"/>
  <g id="cage-vents" fill="#1b1f23">
    <rect x="13.44" y="16.39" width="4.8" height="4.7" rx="0.55"/>
    <rect x="18.99" y="16.39" width="4.8" height="4.7" rx="0.55"/>
    <rect x="13.44" y="21.79" width="4.8" height="4.7" rx="0.55"/>
    <rect x="18.99" y="21.79" width="4.8" height="4.7" rx="0.55"/>
  </g>
  <circle id="cage-rivet-1" cx="18.14" cy="10.79" r="3.22" fill="none" stroke="#6d747c" stroke-width="0.75"/>
  <circle id="cage-rivet-2" cx="18.14" cy="31.79" r="3.12" fill="none" stroke="#6d747c" stroke-width="0.75"/>
  <!-- THE PANEL BEYOND RISER 3, at the far right of the face. Same kind of
       metal as the one beside the screw tab and missing for the same reason -
       the projection at the panel plane carries only the rails across it.
       TEN SQUARES. The RIGHT column at face 423.00 runs the full height - six
       on a 5.50 pitch from y 7.00 - while the two columns to its left carry
       only the middle pair, at 18.00 and 23.50. The two rings sit where those
       columns would otherwise continue, above and below.
       A blob scan found eight of the ten: the top two of the right column touch
       the dark edge beside them and merge into one region, which reads as a
       57%-filled blob and is neither square nor ring. They were found by
       printing the window as characters and looking at it.
       Fill fraction again: squares 87-96%, rings 38% and 31%.
       rings face 416.88, 12.50 and 416.63, 32.75, about 7.2 across -->
  <rect id="cage-r3-panel" x="266.24" y="2.29" width="19.0"
        height="37.0" rx="0.6" fill="#8c939b" stroke="#5a6069"
        stroke-width="0.25"/>
  <g id="cage-r3-vents" fill="#1b1f23">
    <rect x="267.74" y="16.29" width="4.75" height="5.0" rx="0.55"/>
    <rect x="273.24" y="16.29" width="4.75" height="5.0" rx="0.55"/>
    <rect x="267.74" y="21.79" width="4.75" height="5.0" rx="0.55"/>
    <rect x="273.24" y="21.79" width="4.75" height="5.0" rx="0.55"/>
    <rect x="278.74" y="5.29" width="4.75" height="5.0" rx="0.55"/>
    <rect x="278.74" y="10.79" width="4.75" height="5.0" rx="0.55"/>
    <rect x="278.74" y="16.29" width="4.75" height="5.0" rx="0.55"/>
    <rect x="278.74" y="21.79" width="4.75" height="5.0" rx="0.55"/>
    <rect x="278.74" y="27.29" width="4.75" height="5.0" rx="0.55"/>
    <rect x="278.74" y="32.79" width="4.75" height="5.0" rx="0.55"/>
  </g>
  <circle id="cage-r3-rivet-1" cx="272.62" cy="10.79" r="3.24" fill="none" stroke="#6d747c" stroke-width="0.75"/>
  <circle id="cage-r3-rivet-2" cx="272.37" cy="31.04" r="3.17" fill="none" stroke="#6d747c" stroke-width="0.75"/>
  <!-- THE PANEL BETWEEN RISERS 2 AND 3, past the second drive bay. Third of
       the three panels this cage carries that the panel-plane projection does
       not reach.
       A 2 x 3 BLOCK AND TWO RINGS. Columns at face 297.50 and 303.00, rows at
       7.50, 13.00 and 18.50, everything on a 5.50 pitch; rings below at
       301.50, 28.00 and 301.50, 36.50, about 6.9 across and sitting on the
       block's own centre line.
       MAPPED BEFORE IT WAS SCANNED, deliberately. A blob scan of this window
       returns the middle and bottom rows and not the top one - the same failure
       that lost two squares on the panel beyond riser 3 - so the window was
       printed as characters at 0.5 mm and read first. -->
  <rect id="cage-mid-land" x="152.49" y="2.79" width="14.25"
        height="38.00" rx="0.5" fill="#9ba2aa"/>
  <g id="cage-mid-vents" fill="#1b1f23">
    <rect x="153.24" y="5.79" width="4.50" height="4.50" rx="0.55"/>
    <rect x="158.74" y="5.79" width="4.50" height="4.50" rx="0.55"/>
    <rect x="153.24" y="11.29" width="4.50" height="4.50" rx="0.55"/>
    <rect x="158.74" y="11.29" width="4.50" height="4.50" rx="0.55"/>
    <rect x="153.24" y="16.79" width="4.50" height="4.50" rx="0.55"/>
    <rect x="158.74" y="16.79" width="4.50" height="4.50" rx="0.55"/>
  </g>
  <circle id="cage-mid-rivet-1" cx="157.24" cy="26.29" r="3.07" fill="none" stroke="#868d95" stroke-width="0.75"/>
  <circle id="cage-mid-rivet-2" cx="157.24" cy="34.79" r="2.97" fill="none" stroke="#868d95" stroke-width="0.75"/>
  <circle id="cage-mid-hole" cx="157.24" cy="34.79" r="0.85" fill="#7d848c"/>
  <!-- THE TWO VENT GROUPS ARE ONE PART MIRRORED ABOUT face 287.25, and that
       axis is not chosen - the rings fix it exactly. 2 x 287.25 - 301.50 is
       273.00, which is where the left group's rings measured, to the pixel.
       It also lands 0.60 off this cage's own centre at 287.85.
       THE FIGURE DISAGREES ABOUT THE OPENINGS AND IS OVERRULED. Measured off
       ISM figure 8 the left group is six NARROW SLOTS, 2.25 wide on a 3.50
       pitch, against the right group's 4.50 squares on 5.50 - a reading taken
       twice, from a character map and from the raster at 8x, and both times it
       came back slots. The operator, who has the hardware, says the two sides
       are the same part and said so knowing the figure shows otherwise.
       So the openings here are MIRRORED, NOT MEASURED, and the measurement they
       displace is written down rather than deleted: if this ever renders wrong,
       2.25 on a 3.50 pitch at face 269.75 and 273.25 is what the figure says
       and where to start.
       The rings are mirrored too, which makes them a matched pair. A radial
       profile had separated the left ones - 2.90 and 2.30 radius against the
       right's 3.07 and 2.97 - and that finding is set aside by the same call.
       BOTH GROUPS SIT ON A LAND AND NEITHER SITS IN A BOX. The panel rects were
       drawn fill #8c939b with a #5a6069 stroke, which is the frame's own fill
       plus a border - so what read as a dark background was never a background
       at all, it was an outline around nothing. Replaced by the light land the
       vents are actually punched in, on both sides. -->
  <rect id="cage-left-land" x="119.24" y="2.79" width="14.25"
        height="38.00" rx="0.5" fill="#9ba2aa"/>
  <g id="cage-left-vents" fill="#1b1f23">
    <rect x="122.74" y="5.79" width="4.50" height="4.50" rx="0.55"/>
    <rect x="128.24" y="5.79" width="4.50" height="4.50" rx="0.55"/>
    <rect x="122.74" y="11.29" width="4.50" height="4.50" rx="0.55"/>
    <rect x="128.24" y="11.29" width="4.50" height="4.50" rx="0.55"/>
    <rect x="122.74" y="16.79" width="4.50" height="4.50" rx="0.55"/>
    <rect x="128.24" y="16.79" width="4.50" height="4.50" rx="0.55"/>
  </g>
  <circle id="cage-left-rivet-1" cx="128.74" cy="26.29" r="3.07" fill="none" stroke="#868d95" stroke-width="0.75"/>
  <circle id="cage-left-rivet-2" cx="128.74" cy="34.79" r="2.97" fill="none" stroke="#868d95" stroke-width="0.75"/>
  <circle id="cage-left-hole" cx="128.74" cy="34.79" r="0.85" fill="#7d848c"/>
  <!-- THE SLOT NUMBERS, AND THEY ARE PRINTED ON THIS CAGE rather than on the
       chassis behind it. They were drawn as chassis decor first and L21 caught
       it: riser-3 occupies face 318..413 in the no-rear-storage configuration
       and painted straight over 14 and 15. The rule was right about a model
       that was wrong - with riser 3 fitted there are no rear drives to name, so
       the labels have to come and go with the cage, and the cage is already
       only-in: [rear-4-sff].
       THE TWO PAIRS ARE MIRRORED. 12 and 13 are named from a plate on their
       RIGHT with the arrow pointing left; 14 and 15 from a plate on their LEFT
       with the arrow pointing right. The arrow points AT its bay either way,
       and that is what puts the digits on opposite sides of it.
       The ink is BLACK ON DARK GREY, 0-50 against a 60-85 ground, which is why
       three sweeps for dark-on-light and for light-on-dark found nothing here.
       Read off a character map of raw grey values instead. -->
  <g id="drive-labels">
    <!-- THE TWO SIDES ARE ONE PART MIRRORED, and the left one was drawn from
         its own measurements first, which made it 8.50 wide against the right's
         11.00 and a different grey.
         MIRRORING ABOUT face 289.75 IS WHAT SETTLES IT. That axis is fixed by
         the two arrow apexes, 256.50 and 323.00, which are the sharpest
         features either plate carries - and it then puts the right plate's far
         edge at 254.75, against 254.5 measured. A quarter of a millimetre,
         from a number that took no part in choosing the axis.
         THE DISAGREEMENT IS ALL ON ONE SIDE. The mirror says this plate reaches
         265.75 and the figure shows it stopping at 263.00 - 2.75 short, on the
         right, which is the edge the flange lies over. A plate that measures
         short on exactly the side something covers is a plate that is being
         measured through an obstruction, not a plate of a different size.
         SO THE FIGURE'S OWN NUMBERS ARE SET ASIDE HERE, deliberately: width
         from the mirror rather than from the measurement, and the same
         #696d72 as its opposite number rather than the #4d5055 this one
         sampled, because that darker grey is the flange's shadow and not the
         paint. Both readings are real; what changed is which question they were
         answering. -->
    <rect x="110.49" y="6.04" width="11.00" height="31.75" rx="0.5" fill="#696d72"/>
    <rect x="169.49" y="6.04" width="11.00" height="31.75" rx="0.5" fill="#696d72"/>
    <!-- THE WHITE PAD WITH A DOT IS NOT DRAWN, and it was measured cleanly.
         It is the flange lying over this plate - the thing that made the plate
         read short - so drawing it means drawing an obstruction across the
         label it obscures. Left off so the numbering reads, which is what this
         face is for; the plate behind it is shown whole instead.
         The round fitting is kept on BOTH sides. On the right it is inferred
         from a broken highlight arc rather than an outline; on the left it is
         not measured at all, only mirrored, and sits where the flange would
         have hidden it. -->
    <circle cx="121.94" cy="24.89" r="1.5" fill="#c1c6ca"/>
    <circle cx="121.94" cy="24.89" r="0.3" fill="#6d747c"/>
    <circle cx="169.04" cy="24.89" r="1.5" fill="#c1c6ca"/>
    <circle cx="169.04" cy="24.89" r="0.3" fill="#6d747c"/>
  </g>
  <!-- THE DIGITS SIT AT THE MIRROR'S x, NOT THE FIGURE'S. Mirroring the right
       pair's 319.00 about face 289.75 gives 260.50 where this side measured
       259.80 - seven tenths, on glyphs 3.3 mm tall at 4 px/mm, which is inside
       what this figure can resolve. The arrows mirror to their measured
       positions exactly, so the axis is not in question and the 0.70 is. -->
  <g id="silkscreen" fill="#15181b">
    <path transform="translate(112.24 11.04)" d="M2.5 0 L0 1.65 L2.5 3.3 Z"/>
    <text x="116.24" y="14.34" font-family="sans-serif" font-size="4.6" text-anchor="start">12</text>
    <path transform="translate(112.24 28.79)" d="M2.5 0 L0 1.65 L2.5 3.3 Z"/>
    <text x="116.24" y="32.09" font-family="sans-serif" font-size="4.6" text-anchor="start">13</text>
    <path transform="translate(176.24 11.04)" d="M0 0 L2.5 1.65 L0 3.3 Z"/>
    <text x="174.74" y="14.34" font-family="sans-serif" font-size="4.6" text-anchor="end">14</text>
    <path transform="translate(176.24 28.79)" d="M0 0 L2.5 1.65 L0 3.3 Z"/>
    <text x="174.74" y="32.09" font-family="sans-serif" font-size="4.6" text-anchor="end">15</text>
  </g>
</svg>
