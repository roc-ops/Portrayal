format: 1
kind: component
name: drive-cage-rear-14g
version: 1.0.0
class: mechanical
profile: compute
description: >-
  The rear drive cage's own faceplate on a 14G PowerEdge - a top rail, a bottom
  rail and two thumbscrew tabs, standing proud of the rear panel with the drive
  openings between them
size: {w: 287.18, h: 42.98, d: 14.13}
provenance:
  size: >-
    measured - Dell's service model, r740xd.glb, `DELL_R740XD_2.5 Drive Rear
    Cage-1`, clipped to the panel plane at z 713.5. A vendor solid measured in
    software rather than a caliper on hardware, in the sense std/sma@1's barrel
    key sets out. THE SIZE IS OF WHAT IS VISIBLE: 1,304 of the part's 8,644
    triangles stand in front of the panel and the rest are inside the chassis.
  it-is-a-frame-and-that-is-why-it-was-missing: >-
    Its face is a top rail, a bottom rail and two mounting tabs; the drives fill
    everything between, so on a populated rear almost none of it shows. Modelled
    as nothing, the carriers floated on bare chassis and the two thumbscrews sat
    on air - which `lift: 8.1` in their own relief was already describing before
    the thing it lifts off was drawn.
  the-screw-sits-on-a-pad: >-
    photo-measured - the left tab was drawn as one flat block and the figure
    shows it articulated: a BRIGHTER pad from face y 4.25 to 17.50 carrying the
    thumbscrew, then a duller bar below it from 17.75 to 29.50. Same metal,
    different faces of it - one tilted toward the light and one not - so it is
    drawn as a highlight rather than as a second part.
    The pad reads 143.75..156.00 wide in the figure and is drawn at the tab's
    own 144.26..155.26. The extra quarter-millimetre each side is halo: a bright
    feature against bright metal at 4 px/mm, which is the one thing this figure
    is worst at.
  the-tongue-is-bent-not-just-shaded: >-
    photo-measured for its OUTLINE, estimated for its ANGLE. Below the screw pad
    and the bar, the same tab carries a third face at face 146.00..156.80,
    y 29.50..39.00. It is not duller than the bar, it is DARK - tone falls from
    about 178 to about 110 - and no flat surface beside another flat surface in
    the same plane does that. It is also slightly narrower and shifted right,
    10.80 against 11.75, which is what a pressed tongue coming off a wider strip
    looks like.
    ITS RIGHT EDGE IS BROUGHT IN TO 155.26. The figure puts it at 156.80, which
    is past the 155.26 that the pad and the bar both end at - and a tongue
    cannot overhang the tab it is pressed out of. Width goes to 9.26 and the
    correction is taken entirely off the RIGHT, where the overhang is; the left
    edge at 146.00 is not disturbed. This is the same halo the screw pad shows,
    in the same direction, on the same figure.
    THE ANGLE IS THE OPERATOR'S READING, about 12 degrees down into the chassis,
    and it is a guess made deliberately rather than a measurement: the figure
    cannot show an angle at all and the service model has no cage face in front
    of the panel to read one from. At 12 degrees over 9.50 the far edge drops
    1.98, so the relief carries 0.99 - the MEAN of a ramp, since
    `sink` is a uniform recess and there is no bend in the vocabulary. Say
    plainly: one number standing in for a slope, on an angle nobody measured.
  the-panel-between-the-tab-and-the-first-bay: >-
    photo-measured - the extracted outline carries only a top and bottom rail
    across face 155.26..170.00; the metal between them is a face the projection
    at the panel plane does not catch, the same way the shroud's slot column is
    not caught. Drawn as a plate with its features read off ISM figure 8.
    FOUR SQUARES AND TWO RINGS, and FILL FRACTION IS WHAT TELLS THEM APART. At
    this size a ring and a square are the same blob to a threshold; the squares
    come back 90-95% of their bounding box filled and the two rings 43% and 31%,
    which is a wall of about 0.8 on a 7 mm circle. Reading area alone would have
    drawn six squares.
    squares at face 157.70 and 163.25 by 18.10 and 23.50, 4.80 x 4.70, on a
    5.55 x 5.40 pitch; rings at 162.40, 12.50 and 162.40, 33.50, about 7.1
    across. The rings sit on the squares' own centre line - 162.40 against the
    block's 162.85 - which is the check that they are one pressed group.
    THE RING INK IS #6d747c AND WAS FIRST #8b9299, which is the dull grey the
    chassis rivets carry against a #9aa1a8 panel. Here the background is this
    cage's #8c939b and the two were within one part in 255: the rings were in
    the file and in the render and could not be seen. A colour is only dull
    RELATIVE TO WHAT IT SITS ON, and reusing one across two backgrounds is not
    reusing a decision, it is losing one.
  the-panel-beyond-riser-3: >-
    photo-measured - the far right of the face, past the last drive bay. Same
    kind of metal as the panel beside the screw tab and missing for the same
    reason: the projection at the panel plane carries only this cage's rails
    across it.
    TEN SQUARES AND THE ARRANGEMENT IS NOT A GRID. The RIGHT column at face
    423.00 runs the full height - six on a 5.50 pitch from y 7.00 - while the
    two columns to its left carry only the middle pair at 18.00 and 23.50. The
    rings sit where those columns would otherwise continue.
    A BLOB SCAN FOUND EIGHT OF THE TEN. The top two of the right column touch
    the dark edge beside them, merge into one region, and that region comes back
    a 9 x 16 blob at 57% fill - neither square nor ring, so it was dropped.
    Nothing reported an error; two features were simply not in the list. They
    were found by printing the window as characters at 0.5 mm and reading it.
    Connected-component labelling is the right tool until two things touch, and
    then it is silently the wrong one.
    Fill fraction separates them as before: squares 87-96% of their box, rings
    38% and 31%. Rings at face 416.88, 12.50 and 416.63, 32.75, about 7.2
    across; squares 4.75 x 5.00 on a 5.50 pitch both ways.
  the-panel-between-risers-2-and-3: >-
    photo-measured - the third of three panels this cage carries that the
    projection at the panel plane does not reach, past the second drive bay.
    A 2 x 3 BLOCK AND TWO RINGS: columns at face 297.50 and 303.00, rows at
    7.50, 13.00 and 18.50, all on a 5.50 pitch, with rings below at 301.50,
    28.00 and 301.50, 36.50 - about 6.9 across, on the block's own centre line.
    THE LOWER ONE HAS A HOLE IN IT AND THE UPPER ONE DOES NOT. The character map
    shows dark pixels inside the lower circle at rows 36.0..37.5 and clear
    ground inside the upper one. Two different fittings at the same size, and a
    blob scan reports both as one ring-shaped region either way - the difference
    is only visible by looking at what is INSIDE the outline.
    MAPPED BEFORE IT WAS SCANNED, on purpose. A blob scan of this window returns
    the middle and bottom rows and NOT the top one, which is the same failure
    that lost two squares on the panel beyond riser 3 - features touching
    something else merge and then fail the shape test. Printing the window as
    characters at 0.5 mm and reading it took a minute and found six squares
    where the scan found four.
  the-vent-strip-left-of-the-thumbscrew: >-
    photo-measured - the fourth and last of this cage's panels the panel-plane
    projection does not reach, and the one the operator called from a thumbnail
    as "the mirror of the six squares and two rivets".
    THE ROWS SAY YES AND THE COLUMNS SAY NO. Rows land at y 7.40, 12.90 and
    18.40 on a 5.50 pitch, which is the mid panel's 7.50, 13.00, 18.50 to within
    a tenth, and the two fittings below are the same pair in the same order -
    plain ring above, holed ring below - 8.25 apart against 8.50. Six openings,
    two rings, one holed: the inventory is identical.
    But these openings are 2.25 wide on a 3.50 pitch where the mid panel's are
    4.50 on 5.50. They are narrow slots, not near squares, so it is the same
    pressed group at a different width and NOT the same tool. Mirroring the mid
    panel would have laid six 4.50 openings across ground that measures 2.25 -
    and it would have looked right.
  the-two-rings-here-are-not-a-pair: >-
    measured off a RADIAL GREY PROFILE, which is what separates them; they read
    as a matched set at a glance and the cage's other two panels genuinely carry
    matched sets, so the glance had a precedent behind it.
    The upper one is flat at 164 out to r 1.7, bottoms at 104 at r 2.90 and
    recovers by 3.8 - a plain ring, wall 0.90, nothing inside. The lower one
    bottoms at 65 at r 2.30, smaller and darker and thicker, and has a SECOND
    minimum at its centre: 21 at r 0.2, rising to 145 by r 1.2. That is a solid
    stud about 1.4 across inside a ring 4.60 across, not a hole in a ring 5.80
    across. Sampling one ring and copying it to the other would have got the
    size, the weight and the centre all wrong at once.
    Ink #4d5055 and #38393f, both sampled. The other panels' rings are #686b70
    on the same figure; #6d747c was inherited here first and drew two faint grey
    outlines where the figure carries two of the darkest marks on the strip.
  the-figure-is-brighter-than-the-model-and-ratios-are-what-transfer: >-
    RECORDED BECAUSE IT ALMOST PUT A WRONG COLOUR IN TWICE. The mid panel's
    ground samples 169 in this figure where this cage is painted #8c939b, which
    is 147 - the whole figure sits about 15 percent bright, so no absolute grey
    read off it can be used as a fill.
    The land these vents are punched in runs 1.13x that ground and the band
    beside it 0.76x, which puts them at #9ba2aa and #6a7078 here. Read as
    absolutes they are #bdbfc3 and #7d7f84: a land far too bright and a band
    roughly right, which is the worst shape an error can take because half of it
    looks correct and stops the checking.
    Land face 263.50..277.75, y 4.50..42.50 - two grey profiles down it both
    hold 178-194 through that span and fall to 146 by 43.5.
  the-panel-over-it-is-real-and-its-outline-is-not-measurable: >-
    estimated - the operator saw metal lying over the right of this group and
    the figure agrees in the only way it can: a band at face 277.75..279.75
    running from y 9 to the bottom rail and stopping, bright above it and bright
    to its right. That is a step in the metal seen edge on.
    WHAT IS DRAWN IS THE SHADOW, NOT THE PANEL. Where the covering sheet starts,
    how far right it reaches and how proud it stands are all unknown; the
    service model carries no cage face in front of the panel plane to read them
    from. A band is the honest amount of it to draw, and this key is here so the
    band is not later measured back as though it were the panel's edge.
  the-slot-numbers-are-printed-on-this-cage: >-
    photo-measured - four labels, 12 and 13 on the left pair and 14 and 15 on
    the right, each a digit group and a filled triangle pointing AT the bay it
    names.
    THE INK IS BLACK ON DARK GREY and that is why it was missed three times.
    Values run 0-50 against a 60-85 plate, so a dark-on-light threshold sees one
    dark block and a light-on-dark threshold sees nothing inside it; both report
    an empty region and neither reports an error. Found by dumping raw grey
    values and printing them as characters - the same tool that found the two
    squares a blob scan lost beyond riser 3, for the same reason.
    THE TWO PAIRS ARE MIRRORED. 12 and 13 sit on a plate to their RIGHT with the
    arrow pointing left; 14 and 15 on a plate to their LEFT with the arrow
    pointing right. Digits face 259.80..263.00 and 315.50..319.00, triangles
    256.50..259.00 and 320.50..323.00, rows at y 12.75 and 30.50 - a 17.75
    pitch, which is the bay pitch, and the check that the labels belong to the
    bays rather than to the metal.
    THE PLATES ARE TWO DIFFERENT GREYS AND BOTH WERE SAMPLED. #4d5055 on the
    left and #696d72 on the right, from medians over the same figure. They look
    like they should match and they do not; copying one to the other is the
    mistake that made this cage's rings invisible once already.
    Left plate face 254.50..263.00, right 313.75..324.75 - the right edges from
    a grey profile that holds 105-111 inside against 136 and 139 outside.
  they-belong-to-the-cage-and-not-to-the-chassis: >-
    Drawn as chassis decor and silkscreen first, and L21 caught it: riser-3
    occupies face 318..413 in the no-rear-storage configuration and painted
    straight over 14 and 15. The rule was right about a model that was wrong -
    with riser 3 fitted there are no rear drives to name, so the labels have to
    appear and disappear with the cage, which is already only-in: [rear-4-sff].
    A LINT RULE FIRING IS NOT ALWAYS A DRAWING PROBLEM. This one named the
    wrong owner, and the fix was to move the ink to the part it is printed on
    rather than to teach the schema a new way to hide it.
  the-second-fitting-is-inferred-from-a-highlight: >-
    estimated - a pressed pad with a hole sits between 12 and 13 at face
    257.00..262.50, y 21.50..27.75, straddling the bay boundary at 22.8 so it
    belongs to neither label; that one is measured, and the hole is centred both
    ways on the pad, which is the check that it is a fitting and not noise.
    ITS OPPOSITE NUMBER BESIDE THE SECOND PLATE IS NOT. What the figure carries
    there is a BROKEN ARC - bright patches at face 312.0..313.5 and
    314.5..315.5, at 25.0..25.5 and 26.0..27.5 - which is a glare highlight on
    something round, not an outline. A 3.0 circle at 313.30, 26.60 is drawn from
    it, and the figure never showed a circle.
  outline: >-
    measured - extracted by spec/tools/intake/cad-outline.py, rasterised at
    16 px/mm and simplified at 0.40 mm. THAT 0.40 IS A SIMPLIFICATION TOLERANCE
    and must not be measured back off this outline as though it were a radius.
  the-tabs-are-the-check: >-
    THE CAGE WAS EXTRACTED WITHOUT REFERENCE TO THE SCREWS AND PUTS ITS HOLES
    UNDER THEM. The left tab carries a hole centred at local 6.25, 9.35, which
    is face 150.51, 11.06; dell/thumbscrew-blue-14g@1 sits at face 150.41,
    11.10, placed from the CAD's screw node and confirmed by a hue sweep of ISM
    figure 8. A tenth of a millimetre apart, from readings that never met. The
    middle tab at local 135..152 sits between the two drive bays and under the
    other screw at 288.34.
  depth: >-
    measured - 14.13 proud of the panel at its highest. THE FACE IS NOT FLAT and
    `out` cannot say so: the thumbscrews seat at 8.1 proud, which is a lower
    shelf of this same part, so extruding the whole outline to 14.13 is a first
    approximation. Recorded here rather than left for somebody to discover from
    a 3D view that looks a little too solid.
relief:
  wall: '#4a5057'
  features:
  - node: screw-tab-tongue
    sink: 0.99
    color: '#626971'
    confidence: estimated
    source: >-
      dell/drive-cage-rear-14g@1's own tongue key - a 12 degree bend on the
      operator's reading, over a 9.50 face, dropping 1.98 at its far edge.
      0.99 is the MEAN of that ramp, because `sink` is a uniform
      recess and this vocabulary has no bend. The outline is measured; the angle
      is not.
  - node: frame
    out: 14.13
    color: '#8c939b'
    confidence: measured
    source: >-
      dell/drive-cage-rear-14g@1's own depth key - Dell's service model, from
      the panel plane at z 713.5 to the cage's own front at 727.6. One number
      for the whole outline, which the depth key records as an approximation
      because the screw shelf sits 6 mm below it.
elements:
  frame: {at: [0.0, 0.0], size: [287.18, 42.98], class: bezel}
skins: [default]
