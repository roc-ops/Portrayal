     confidence: measured, source: 'Dell service model R740XD_Riser_2C-1, Body_4.006 - one mesh 27.4 x 37.7 x 211.4; the PCB is taken as its outer 1.6'}
  - {id: slot-4-connector, at: [-5.27, -2.40], size: [11.3, 10.8],
     from: 43.6, depth: 91.0, color: '#15171b',
     confidence: estimated, source: 'estimated - the 2C body is one mesh and the connector was not read out; placed 34 behind the PCB''s start, as riser 1''s connectors are'}
# SEEN FROM ABOVE IT IS ITS PCB: the part that stood in the top view as a
# placement of its own, now this part's plan, drawn where the rear bay says.
plan: {ref: dell/riser-card-lp-14g@1}
insert: {w: 95.0, h: 18.42}
bays:
  slot-4:
    slot: {connector: x16, lanes: 16, height: low, length: half, processor: 2, generation: 3}
    plan: {at: [-69.0, -9.6]}
    behind: true
    at: [0, 0]
    size: [79.2, 18.42]
    accepts: [dell/pcie-filler-lp-14g@1, std/pcie-bracket-lp@1, common/pcie-card-lp@1, nvidia/mcx623102a-lp@1]
    default: dell/pcie-filler-lp-14g@1
skins: [default]
