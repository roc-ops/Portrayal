description: >-
  The ReadyRails sliding rail (Dell rail identifier B6) of the PowerEdge R740 and R740xd, two to
  a kit. A drop-in sliding rail for four-post racks: the chassis is lowered onto the inner
  members and slides fully out of the rack for service. Drawn as a plain plate: no source page
  dimensions the rail's section.
size: {w: 20.0, h: 43.5}
size-confidence: {w: estimated, h: estimated}
provenance:
  model: >-
    datasheet - the Dell PowerEdge R740 and R740xd Technical Guide (July 2019), "Rack rails",
    printed page 50: "ReadyRails-Sliding rails for 4-post racks", drop-in installation, full
    extension of the system out of the rack, optional cable management arm.
  size: >-
    estimated - NO SOURCE PAGE DIMENSIONS THIS PART. 20.0 by 43.5 mm is a placeholder envelope for
    the rail seen end on; the guide and the matrix print the rail's depth in the rack, which
    belongs to the kit, and no section.
