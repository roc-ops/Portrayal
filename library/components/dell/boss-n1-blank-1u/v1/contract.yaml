format: 1
kind: module
name: boss-n1-blank-1u
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  The vented blank Dell fits where a 1U PowerEdge has no BOSS-N1 module - a
  plate with a four-by-six grid of square vents
unplaced: the R660 device (dell/r660, in progress on this branch) seats it in its BOSS bay; remove this line when that lands
provenance:
  sources: >-
    (1) The VisioCafe R660 rear masters - every one of them (3xPCI LP, 2xPCI LP,
    2xPCI LP Gen5, 2xPCI FH, 2D 1xPCI) draws this blank at the far left, which
    is where it is read from, at 22.24 px/mm on a 434 mm body (see dell/psu-
    1400w-ac-60mm@1, provenance/stencil-scale). Facts read, art not traced.
    (2) StorageReview's rear photograph of a real R660, which has the blank
    fitted - a light plate and a grid of square vents left of PSU 1.
    (3) The R660 ISM's "Removing the BOSS-N1 module blank", which makes it a
    part rather than chassis metal: one Phillips #1 screw secures the bay.
  size: >-
    drawing - the stencil's plate runs 6.41..31.25 across the rear face and
    2.81..41.25 down it: 24.85 x 38.44. Its right edge agrees with the CAD
    BOSS-N1 module's right edge (30.75) to 0.5 mm. The module itself is wider,
    reaching to 0.85 at the left, where the stencil shows chassis metal beside
    the blank, so the blank does not fill the module's whole width.
  vents: >-
    drawing - 24 squares, 3.82 on a side, columns at plate-local x 2.25, 7.75,
    13.28 and 18.79 and rows at y 3.55 to 31.16 on a 5.52 pitch.
  depth: >-
    NOT KNOWN - no source shows the blank in depth. `d` is omitted and the part
    is drawn as a plate.
size: {w: 24.85, h: 38.44}
size-confidence: {w: drawing, h: drawing}
skins: [default]
