       from measured positions (see the contract). THE OPENINGS ARE HOLES:
       `plate` is one path - the face with every gap between the wings, rails
       and end sections cut out of it, fill-rule evenodd - so the drives show
       through in 2D, the contract can extrude its outline with the holes in it
       for 3D, and a legend lying in an opening is not read as covered. The
       upper wings are lit lighter and the plain left end carries a lighter
       square, as the render shows; the lock sits on the first wing. -->
