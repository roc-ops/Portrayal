<svg xmlns="http://www.w3.org/2000/svg" width="39.0mm" height="15.93mm" viewBox="0 0 39.0 15.93">
  <!-- r660xs-lom-2x1g: the card's bracket as the rear window shows it.
       Original art from positions read off Dell's R660xs rear render (ISM
       figure 7); the jacks are composed in the contract. The 1 and 2 are
       printed on the bracket under the jacks, each with its link icon. -->
  <rect x="0.15" y="0.15" width="38.70" height="15.63" rx="0.4" fill="#cdd1d5" stroke="#9aa1a8" stroke-width="0.25"/>
  <g id="silkscreen">
    <text x="12.50" y="15.45" font-family="sans-serif" font-size="2.30" fill="#2b2f33" text-anchor="middle">1</text>
    <text x="30.40" y="15.45" font-family="sans-serif" font-size="2.30" fill="#2b2f33" text-anchor="middle">2</text>
    <!-- the network-link icon left of each numeral, as figure 7 prints them; the
         form is original, the figure resolves each to a few pixels -->
    <path id="link-1" transform="translate(6.20 13.30)" fill="none" stroke="#2b2f33" stroke-width="0.18" stroke-linejoin="round"
          d="M 1.2 0 H 2.0 V 0.6 H 1.2 Z M 1.6 0.6 V 1.0 M 0.4 1.0 H 2.8 M 0.4 1.0 V 1.4 M 2.8 1.0 V 1.4 M 0 1.4 H 0.8 V 2.0 H 0 Z M 2.39 1.4 H 3.19 V 2.0 H 2.39 Z"/>
    <path id="link-2" transform="translate(24.30 13.30)" fill="none" stroke="#2b2f33" stroke-width="0.18" stroke-linejoin="round"
          d="M 1.2 0 H 2.0 V 0.6 H 1.2 Z M 1.6 0.6 V 1.0 M 0.4 1.0 H 2.8 M 0.4 1.0 V 1.4 M 2.8 1.0 V 1.4 M 0 1.4 H 0.8 V 2.0 H 0 Z M 2.39 1.4 H 3.19 V 2.0 H 2.39 Z"/>
  </g>
</svg>
