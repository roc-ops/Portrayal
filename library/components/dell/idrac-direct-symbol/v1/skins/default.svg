<svg xmlns="http://www.w3.org/2000/svg" width="3.8mm" height="3.8mm" viewBox="0 0 3.8 3.8">
  <!-- The wrench Dell prints above the iDRAC Direct port: an open jaw at the
       head and a handle running down to the right, laid at about 45 degrees.
       ISM table 7 gives it as this port's icon and figure 7 shows it printed.
       It does NOT light - the iDRAC Direct LED is a separate item with no icon,
       sitting below the port.
       THE HEAD IS A RING WITH A GAP, not a filled disc with a nick. A first
       attempt filled it and read as a blob: at this size the jaw is the only
       thing that says wrench, so it has to be the opening rather than a
       detail on a solid shape. -->
  <g id="symbol" fill="none" stroke="#c7ccd1" stroke-linecap="round">
    <path d="M0.97 0.48 A0.82 0.82 0 1 1 0.54 0.84" stroke-width="0.52"/>
    <path d="M1.83 1.83 L3.24 3.24" stroke-width="0.58"/>
  </g>
</svg>
