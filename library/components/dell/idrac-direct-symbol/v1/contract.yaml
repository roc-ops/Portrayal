format: 1
kind: component
name: idrac-direct-symbol
version: 1.0.0
class: silkscreen
description: >-
  The wrench Dell prints beside an iDRAC Direct micro USB port - the mark that
  says this socket reaches the service processor rather than the operating
  system
size: {w: 3.8, h: 3.8}
provenance:
  form: >-
    IT IS A WRENCH, and that is read off the document rather than guessed. The
    R740xd ISM's table 7 gives an icon for each item on the right control panel -
    a power symbol for the button, a USB trident for the two USB ports, this
    wrench for the iDRAC Direct port, a monitor mark for the VGA - and figure 7
    on the same page shows it printed above the micro USB socket at 400 dpi.
    AN EARLIER DRAFT DREW A USB TRIDENT TURNED 45 DEGREES here. At the 6.5644
    px/mm of figure 2 the mark is a few pixels of diagonal ink and a rotated
    trident is a plausible reading of it; page 14's own figure, rendered larger,
    shows a wrench. The lesson is the one this repository keeps relearning - a
    mark too small to resolve should be looked up, not inferred from its
    silhouette.
  size: >-
    photo-measured from ISM figure 2 at 6.5644 px/mm, where the mark occupies
    about 3.8 mm square above the port. The OUTLINE is measured; the shape drawn
    inside it is the recognisable form of the symbol, because neither figure
    resolves the proportions of the jaw and the handle.
  not-a-lamp: >-
    THIS MARK DOES NOT LIGHT, which matters because two other glyph columns on
    this same chassis do. The drive carrier's head glyphs ARE its lamps and the
    left control panel's five status glyphs ARE its lamps, so a reader is right
    to expect it here too - but ISM table 7 lists the iDRAC Direct LED as a
    SEPARATE item (4) with `Icon: N/A`, and figure 7's callout for it points
    below the port at plain strip. The wrench marks the socket; the lamp beneath
    it is unmarked. Same chassis, two different constructions, and the document
    distinguishes them explicitly.
skins: [default]
