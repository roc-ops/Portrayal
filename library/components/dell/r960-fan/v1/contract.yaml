description: >-
  Dual-rotor hot-plug fan module of the PowerEdge R960 seen from above - one of up to six in the fan cage,
  with its orange release latch
provenance:
  sources: >-
    Dell's R960 service model, working/intake/dell/3d-models/r960.glb, read with glbparts.py: the six
    `PEr960_ CoolingFan_ Prefab` nodes under `R960_ CoolingFan` in the `Main Assembly` node (the un-exploded
    assembly; the scene also holds exploded copies under `Extra content`). R960 ISM figure 12 (the six fans
    numbered 1 to 6 across the front edge of the cage, each with an orange latch), the "Cooling fan
    specifications" section (table 12: "up to six sets of Standard cooling fans") and the "Removing a cooling
    fan" procedure (figures 44 and 45); the spec sheet's "Up to 6 sets (dual fan module) hot plug fans".
  size: >-
    measured - r960.glb, each module box 62.7 x 88.2 in plan, at plan x 20.5, 84.9, 149.4, 233.6, 298.1 and
    362.5, y 552.3 (plan x = 228.0 - cad x1, plan y = 883.94 - cad z1). The first pass read 64.0 x 86.0 off
    ISM figure 12 (115 to 120 px across at 1.813 px/mm; 160 px deep at 1.863), which agrees to 1.3 and 2.2 mm.
    The gap between modules 3 and 4 is 84.2 centre to centre against the 64.5 pitch elsewhere: the cage's
    centre post.
  depth: >-
    measured - r960.glb, the module stands 153.2 tall (cad y 18.2 to 171.4) in a 174.3 chassis. The first
    pass had 60.0, estimated by analogy with a 4U fan wall.
  power: >-
    NOT STATED in the R960 documents held.
