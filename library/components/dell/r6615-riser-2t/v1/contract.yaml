name: r6615-riser-2t
version: 1.0.0
class: riser
behaviour: fills
profile: server
description: >-
  Dell riser 2T of the PowerEdge R6615 - slot 1 and slot 2 on dell/riser-2-lp-gen5-cage-16g@1, fitted in riser configurations 2, 4 and 8
attrs:
  riser: '2T'
  appears-in: 'riser configurations 2, 4 and 8'
  power-absent: not-published
  slot-1: 'x16, low profile, half length, processor 1, PCIe Gen5'
  slot-2: 'x16, low profile, half length, processor 1, PCIe Gen4'
provenance:
  identity: >-
    A REMOVABLE ASSEMBLY THAT BRINGS ITS OWN SLOTS (ISM figure 117, 'Riser 2T',
    slot 1 and slot 2; a cable leaves its board for the system board), so it is
    a module with `bays`.
  slots: >-
    datasheet - R6615 ISM table 16 and table 97: slot 1 low profile, half
    length, x16 (Gen5); slot 2 low profile, half length, x16 (Gen4); both on
    processor 1. Table 17 (technical guide table 11) lists the riser in
    configurations 2, 4 and 8.
  power: >-
    NOT PUBLISHED - the riser is a passive board with connectors. The R6615 ISM,
    technical guide and spec sheet were searched for 'riser' beside a wattage
    and none gives one.
  face: >-
    borrowed - composed from dell/riser-2-lp-gen5-cage-16g@1, the metal of the
    R660's riser 2P, which has the same two low-profile slots with slot 1 Gen5
    and slot 2 Gen4. ISM figure 117 shows riser 2T in the same frame as
    riser 2A (figure 116) with a cable added; the cable is not drawn.
  size: >-
    borrowed - the cage's extent, 163.60 x 19.80.
  seating: >-
    borrowed - the slot bays are dell/riser-2p-16g@2's.
  body: >-
    borrowed - the board and connectors are dell/riser-2p-16g@2's.
  plan: >-
    borrowed - dell/riser-2-lp-plan-16g@1, the R660's riser 2 outline, which
    lands on the R6615's figure 11 at matched scale (x 288 to 550 against the
    figure's 290 to 555 px at 0.8 of 2.195 px/mm).
