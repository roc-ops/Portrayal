<svg xmlns="http://www.w3.org/2000/svg" width="10.75mm" height="41.68mm" viewBox="0 0 10.75 41.68">
  <!-- dell/pcie-slot-strip-14g reflected, and two slots instead of three.
       The strip of chassis metal between the card retention clips and the riser
       plate, carrying the slot numbers - riser 3's are 7 and 8.
       IT IS THE MIRROR IMAGE BECAUSE THE BAY IS. Riser 3's brackets face out to
       the right, so the strip sits on the plate's RIGHT and its clips reach
       further right still, away from the plate; the numerals move to the edge
       that faces the plate, which is now the left one. -->
  <rect id="strip" x="0" y="0" width="10.75" height="41.68" rx="0.8"
        fill="#9aa1a8" stroke="#7d848c" stroke-width="0.3"/>
  <g id="silkscreen">
    <text x="1.37" y="9.00" font-family="sans-serif" font-size="2.6" text-anchor="middle" fill="#4a5057">7</text>
    <text x="1.37" y="29.00" font-family="sans-serif" font-size="2.6" text-anchor="middle" fill="#4a5057">8</text>
  </g>
</svg>
