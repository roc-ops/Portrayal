<svg xmlns="http://www.w3.org/2000/svg" width="149.7mm" height="18.5mm" viewBox="0 0 149.7 18.5">
  <!-- R960 riser 2 cage: original art from positions read off ISM figure 10. The windows are
       holes: the slots are `behind: true`. TWO NODES: `plate`, which the contract stands 1.0
       proud, and `flange-cover`, the metal over slot 4's seated card's bracket flange, which the
       contract stands past the wall. It sits under the plate, so the flat drawing is the plate's
       alone. Its rectangle is the flange's fold, 1.5 each side, over the flange's length (the
       bay's seat of std/pcie-bracket-lp@1, turned over: the flange is at the left). Slot 9's
       flange is not covered: its fold, at 151.84, is past the cage's right edge, 149.7. -->
  <rect id="slot-4" x="4.6" y="0.04" width="79.2" height="18.42" fill="none" stroke="none"/>
  <rect id="slot-9" x="73.5" y="0.04" width="79.2" height="18.42" fill="none" stroke="none"/>
  <g id="flange-cover">
    <path d="M3.96 1.95 H6.96 V18.20 H3.96 Z" fill="#cfd3d7"/>
  </g>
  <g id="plate">
    <path fill-rule="evenodd" fill="#cfd3d7" stroke="#9aa1a8" stroke-width="0.25" d="M0.3 0.3 H149.4 V18.2 H0.3 Z M13.3 1.9 H68.2 V18.2 H13.3 Z M85.3 1.9 H137.2 V18.2 H85.3 Z"/>
    <rect x="1.2" y="2.5" width="9.0" height="3.0" rx="0.3" fill="#16191c"/>
    <rect x="1.2" y="8.0" width="3.0" height="3.0" rx="0.3" fill="#16191c"/>
    <rect x="6.0" y="8.0" width="3.0" height="3.0" rx="0.3" fill="#16191c"/>
  </g>
</svg>
