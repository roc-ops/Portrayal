format: 1
kind: module
name: riser-4p-16g
version: 1.0.0
class: riser
behaviour: fills
profile: server
description: >-
  Dell riser 4P of the PowerEdge R660 - slot 2 on dell/riser-4-fh-cage-16g@1, fitted in riser configuration 3
attrs:
  riser: '4P'
  appears-in: 'riser configuration 3'
  power-absent: not-published
  slot-2: 'x16, full height, 3/4 length, processor 2, PCIe Gen5'
provenance:
  power: >-
    NOT PUBLISHED - the riser is a passive board with connectors. The R660 ISM,
    technical guide and spec sheet were searched for 'riser' beside a wattage
    and none gives one.
  identity: >-
    A REMOVABLE ASSEMBLY THAT BRINGS ITS OWN SLOTS, which is why it is a module
    with `bays` and the slots are not openings on the chassis: the numbers are
    printed on the riser and move with it (see dell/riser-4-fh-cage-16g@1).
  slots: >-
    datasheet - R660 ISM table 111, which gives each slot's form factor,
    controlling processor, PCIe generation and electrical width, every one on an
    x16 connector; the technical guide's slot table and the spec sheet agree.
    Length: the same two documents give every low-profile slot as half length.
  face: >-
    drawing - composed from dell/riser-4-fh-cage-16g@1, the metal every riser sharing this
    cage presents. The slot bays sit on that cage's windows.
  size: >-
    drawing - the cage's extent, 135.00 x 19.80.
  seating: >-
    measured - THE SLOTS TAKE CARDS, the brackets and cards the R740xd's risers
    take at the same heights. Each bay is the whole bracket (79.20 low-profile,
    120.02 x 21.59 full-height), `behind` the cage, which covers its ends as
    the hardware does. Dell's service model (r660.glb) seats riser 2A's two
    low-profile brackets at rear x 120.9..200.9 and 187.0..267.0: they overlap
    14 mm in x at depths a millimetre apart, the ends interleaving - which is
    why two brackets fit a 71.8 pitch - and they face each other: slot 1
    tip-left, slot 2 turned over (rotate 180), its card board at the top of
    the bracket where slot 1's is at the bottom. Slot 3 (268.5..348.4) is
    turned over too, and so are the full-height slots, whose keyed flange the
    master puts at the left.
    StorageReview's rear photograph of a real R660 (riser 2Q) shows a two-port
    QSFP card in slot 1 the same way, its bracket ends under the cage.
  three-quarter-length: >-
    THE SLOT IS 3/4 LENGTH AND `slot.length` SAYS half. The technical guide's
    slot table and the spec sheet both give the full-height slots as "Full
    height, 3/4 length, Half length"; the schema's length is full or half, and
    a 3/4-length slot does not take a full-length card, so `half` is the value
    that never promises a card the slot cannot hold. The prose attr carries the
    published 3/4.
  plan: >-
    NONE. Dell's service model carries riser 2A and riser 3A and no other; no
    model, figure or photograph held shows this riser from above, so the top
    view leaves its place empty rather than borrow another riser's outline.
size: {w: 135.00, h: 19.80}
size-confidence: {w: drawing, h: drawing}
