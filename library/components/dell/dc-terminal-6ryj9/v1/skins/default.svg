<svg xmlns="http://www.w3.org/2000/svg" width="31.0mm" height="27.5mm" viewBox="0 0 31.0 27.5">
  <!-- The DC input receptacle on a 14G PowerEdge -48 V supply - the socket
       Dell part 6RYJ9's terminal block plugs into. Two square openings side by
       side, each with a blade, in a black moulding.
       NOT AN IEC INLET AND NOT A STANDARD ONE EITHER, which is why it is a
       dell/ part rather than a std/ one: the mating block is a Dell part
       number, and its wiring - black -(48-60) V DC, red return, green/yellow
       ground on 10 AWG - is specified in the R740 ISM rather than in a
       connector standard. -->
  <rect id="body" x="0" y="0" width="31.0" height="27.5" rx="1.2"
        fill="#15181b" stroke="#3a4046" stroke-width="0.4"/>
  <rect id="shoulder" x="1.4" y="1.4" width="28.2" height="24.7" rx="0.8"
        fill="none" stroke="#2b3137" stroke-width="0.5"/>
  <g id="openings">
    <rect x="3.4" y="5.6" width="11.0" height="16.3" rx="0.5" fill="#0a0c0e"
          stroke="#454b51" stroke-width="0.35"/>
    <rect x="16.6" y="5.6" width="11.0" height="16.3" rx="0.5" fill="#0a0c0e"
          stroke="#454b51" stroke-width="0.35"/>
  </g>
  <!-- the blades, one per opening -->
  <g id="blades" fill="#b8bfc6">
    <rect x="8.15" y="8.2" width="1.5" height="11.1" rx="0.2"/>
    <rect x="21.35" y="8.2" width="1.5" height="11.1" rx="0.2"/>
  </g>
</svg>
