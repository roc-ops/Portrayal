<svg xmlns="http://www.w3.org/2000/svg" width="8.34mm" height="8.31mm" viewBox="0 0 8.34 8.31">
  <!-- Square recess, 8.34 x 8.31, measured off Dell's r750-24d-2-5-front master.
       The IEC 60417-5009 power symbol is the LAMP: it lights from behind, so it
       carries the state class rather than sitting beside something that does. -->
  <rect x="0.12" y="0.12" width="8.10" height="8.07" rx="0.7"
        fill="#22262a" stroke="#4a5157" stroke-width="0.22"/>
  <g id="lamp" fill="none" stroke="#39b54a" stroke-width="0.62"
     stroke-linecap="round">
    <path d="M2.60 2.35 A2.55 2.55 0 1 0 5.74 2.35"/>
    <path d="M4.17 1.15 V4.05"/>
  </g>
</svg>
