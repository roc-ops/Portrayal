<svg xmlns="http://www.w3.org/2000/svg" width="12.95mm" height="31.75mm" viewBox="0 0 12.95 31.75">
  <!-- The numbered plate at the inboard end of one rear drive bay. Both bays
       carry one; they are mirror images about face 289.75, an axis fixed by the
       two arrow apexes and confirmed by the plate edge it predicts to within a
       quarter of a millimetre.
       The arrow points AT the bay it names, which is what puts the digits on
       opposite sides of it in the two skins. -->
  <rect id="plate" x="0.0" y="0" width="11.00" height="31.75" rx="0.5"
        fill="#696d72"/>
  <circle id="fitting" cx="11.45" cy="18.85" r="1.5" fill="#c1c6ca"/>
  <circle id="fitting-hole" cx="11.45" cy="18.85" r="0.3" fill="#6d747c"/>
  <g id="silkscreen" fill="#15181b">
    <path transform="translate(1.75 3.29)" d="M2.5 0 L0 1.65 L2.5 3.3 Z"/>
    <text x="5.75" y="6.59" font-family="sans-serif" font-size="4.6" text-anchor="start">24</text>
    <path transform="translate(1.75 21.04)" d="M2.5 0 L0 1.65 L2.5 3.3 Z"/>
    <text x="5.75" y="24.34" font-family="sans-serif" font-size="4.6" text-anchor="start">25</text>
  </g>
</svg>
