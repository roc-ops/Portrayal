format: 1
kind: module
name: r960-pcie-filler-fh
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  Vented full-height slot filler bracket of the PowerEdge R960, as the rear shows it through a
  riser cage's window - a rounded vent window of two rows of fourteen openings and one lone
  column at the end
provenance:
  sources: >-
    R960 ISM figure 10 (the rear view, 1565 x 807 at 3.374 px/mm across and 3.333 px/mm down) and
    the technical guide's figures 7-9 (600 ppi, not orthographic, read for shape only). The same
    filler fills every empty full-height slot of risers 1, 3 and 4 in them.
  size: >-
    photo-measured - the VISIBLE plate only, 90.0 x 18.42: 27.0..117.0 across riser 1's window band
    and one 18.42 slot body tall (the body of std/pcie-bracket-fh@2, PCIe CEM 5.0 figure 11-5). THE
    BRACKET'S ENDS ARE NOT DRAWN: a full-height bracket is 120.02 long and the cage hides 30 mm of
    it, and the R660's filler (dell/pcie-filler-fh-16g@1) draws all 120.02 and so cannot sit under
    the narrower R960 cages without standing outside them. It is the same part in the same slot.
  vents: >-
    photo-measured - ISM figure 10, riser 1: a rounded window 5.9..88.3 across and 3.0..15.4 down
    holding fourteen columns of two 2.6 x 2.7 openings from 9.8 on a 5.46 pitch (rows at 4.6 and
    10.9), and one lone column of two at 0.6. Risers 1 and 3 show the lone column at the left,
    riser 4 at the right, so the bay turns this part over for riser 4.
  depth: >-
    NOT KNOWN; drawn as a plate.
size: {w: 90.0, h: 18.42}
size-confidence: {w: photo-measured, h: registry}
skins: [default]
