format: 1
kind: module
name: riser-3q-16g
version: 1.0.0
class: riser
behaviour: fills
profile: server
description: >-
  Dell riser 3Q of the PowerEdge R660 - slot 3 on dell/riser-3-lp-cage-16g@1, fitted in riser configuration 5
attrs:
  riser: '3Q'
  appears-in: 'riser configuration 5'
  power-absent: not-published
  slot-3: 'x16, low profile, half length, processors 1 and 2 (SNAPI), PCIe Gen5'
provenance:
  power: >-
    NOT PUBLISHED - the riser is a passive board with connectors. The R660 ISM,
    technical guide and spec sheet were searched for 'riser' beside a wattage
    and none gives one.
  identity: >-
    A REMOVABLE ASSEMBLY THAT BRINGS ITS OWN SLOTS, which is why it is a module
    with `bays` and the slots are not openings on the chassis: the numbers are
    printed on the riser and move with it (see dell/riser-3-lp-cage-16g@1).
  slots: >-
    datasheet - R660 ISM table 111, which gives each slot's form factor,
    controlling processor, PCIe generation and electrical width, every one on an
    x16 connector; the technical guide's slot table and the spec sheet agree.
    Length: the same two documents give every low-profile slot as half length.
  face: >-
    drawing - composed from dell/riser-3-lp-cage-16g@1, the metal every riser sharing this
    cage presents. The slot bays sit on that cage's windows.
  size: >-
    drawing - the cage's extent, 89.80 x 19.80.
  seating: >-
    ONLY THE FILLER IS ACCEPTED. A low-profile bracket is 79.20 long and the
    window 70.0; how a card's bracket ends lie under this riser's metal is not
    shown by any source held, so the device's slot-cards-not-seatable gap
    stands.
  snapi: >-
    datasheet - ISM table 111 gives slot 3 on riser 3Q as "Processor 1 &
    Processor 2", a SNAPI slot taking lanes from both, so `slot.processor`,
    which names one CPU, is left out and the prose attr says both.
  plan: >-
    seen from above, the riser is dell/riser-3-plan-16g@1 - its cage as Dell's service
    model places it.
size: {w: 89.80, h: 19.80}
size-confidence: {w: drawing, h: drawing}
plan: {ref: dell/riser-3-plan-16g@1}
parts:
  - {ref: dell/riser-3-lp-cage-16g@1, id: plate, at: [0, 0]}
bays:
  slot-3:
    slot: {connector: x16, lanes: 16, height: low, length: half, generation: 5}
    behind: true
    at: [5.90, 1.92]
    size: [70.00, 18.42]
    accepts: [dell/pcie-filler-lp-16g@1]
    default: dell/pcie-filler-lp-16g@1
skins: [default]
