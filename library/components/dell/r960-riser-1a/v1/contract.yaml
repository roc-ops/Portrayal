format: 1
kind: module
name: r960-riser-1a
version: 1.0.0
class: riser
behaviour: fills
profile: server
description: >-
  Dell riser 1A (full length) of the PowerEdge R960 - slot 1, a full-height slot, and slot 3, a
  double-width full-height slot for a GPU; fitted in riser configuration 3. Drawn from the
  ISM's tables, not from a rear figure
attrs:
  riser: '1A (FL)'
  appears-in: 'riser configuration 3'
  power-absent: not-published
  slot-1: 'x16, full height, full length, processor 3, PCIe Gen5'
  slot-3: 'x16, full height, full length, double width, processor 1, PCIe Gen5'
provenance:
  power: >-
    NOT PUBLISHED - the riser is a passive board with connectors. The ISM's GPU cabling (table 83)
    routes the GPU's power from the power distribution board, not through the riser.
  identity: >-
    A REMOVABLE ASSEMBLY THAT BRINGS ITS OWN SLOTS (ISM figure 101, "Riser 1A (FL)", and figures
    39-40, the support bar for full-length risers), so it is a module with `bays`.
  slots: >-
    datasheet - R960 ISM table 88 (configuration 3: R1A slot 1 processor 3, slot 3 full height
    double width processor 1) and the technical guide's table 17 (slot 1 SW FL FH, slot 3 DW FL FH,
    Gen5 x16).
  face: >-
    ESTIMATED. NO R960 DOCUMENT DRAWS THE REAR OF CONFIGURATION 3: ISM figure 10 and the technical
    guide's figures 7-9 are configurations 2, 0/1 and 1. The cage is riser 1B's sheet metal
    (dell/r960-riser-1b@1) with the lower two windows read as one double-width window for slot 3,
    which is what ISM table 88's "Full Height (DW)" describes. Full-length risers add a support bar
    at the front of the machine (figure 39) that the rear does not show.
  size: >-
    estimated - 117.1 x 63.0, riser 1B's.
  depth: >-
    estimated - 357.0 as dell/r960-riser-1b@1, the riser 1 Dell's R960 service model (working/intake/dell/3d-models/r960.glb)
    holds; 1A is not in the model, and its own length is not stated.
size: {w: 117.1, h: 63.0, d: 357.0}
size-confidence: {w: estimated, h: estimated, d: estimated}
body:
  depth: 357.0
  color: '#4a5057'
plan: {ref: dell/r960-riser-plan@1}
relief:
  features:
  - node: plate
    out: 1.0
    shape: true
    color: '#cfd3d7'
    confidence: estimated
    source: >-
      estimated - the cage's plate is the rear wall's own sheet metal, and ISM table 7 puts nothing but the supplies'
      handles past the wall; no R960 model or side figure is held. The first pass drew it 20.0 proud by analogy with the
      R660's riser cages, which stood the cages outside the 866.74 chassis
bays:
  slot-1:
    slot: {connector: x16, lanes: 16, height: full, length: full, processor: 3, generation: 5}
    behind: true
    at: [22.0, 1.29]
    size: [90.0, 18.42]
    accepts: [dell/r960-pcie-filler-fh@1]
    default: dell/r960-pcie-filler-fh@1
  slot-3:
    slot: {connector: x16, lanes: 16, height: full, length: full, processor: 1, generation: 5}
    behind: true
    at: [22.0, 21.19]
    size: [90.0, 38.7]
    accepts: [dell/r960-pcie-filler-fh-2slot@1]
    default: dell/r960-pcie-filler-fh-2slot@1
elements:
  plate: {at: [13.3, 0.3], size: [103.5, 62.4], class: bezel}
skins: [default]
