format: 1
kind: module
name: r960-pcie-filler-fh-2slot
version: 1.0.0
class: blank
behaviour: fills
profile: server
description: >-
  Vented double-width slot filler of the PowerEdge R960's GPU riser configuration - the plate over
  a full-height slot that takes a double-width card (slots 3, 6, 8 and 11)
provenance:
  sources: >-
    ESTIMATED. R960 ISM table 88 and the technical guide's table 17 give configuration 3's slots 3,
    6, 8 and 11 as double-width, full-length full-height; the ISM draws no rear view of that
    configuration (figures 10 and the technical guide's 7-9 are configurations 0, 1 and 2), and
    no photograph of a filler over a double-width slot is held.
  size: >-
    estimated - two full-height slot pitches, 90.0 x 38.7 (the single filler's 90.0 x 18.42 over a
    20.32 pitch, twice, less the web).
  window: >-
    ESTIMATED - one tall vent window spanning both slots (82.4 x 32.7, in five rows of vent slots), so that slots 3, 6, 8 and 11 of riser
    configuration 3 read as double width on the rear. The first pass drew the single filler's window twice, one above the other, which read
    as two single slots. No R960 figure shows a filler over a double-width slot and none shows the slot marks of risers 3A and 4A, so
    the window is the single filler's width and the two slots' height: a reading of the table, not of a photograph.
  depth: >-
    NOT KNOWN; drawn as a plate.
size: {w: 90.0, h: 38.7}
size-confidence: {w: estimated, h: estimated}
skins: [default]
