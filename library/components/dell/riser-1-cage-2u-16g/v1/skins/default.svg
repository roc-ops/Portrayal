<svg xmlns="http://www.w3.org/2000/svg" width="125.0mm" height="44.0mm" viewBox="0 0 125.0 44.0">
  <!-- dell/riser-1-cage-2u-16g: the R760's riser 1 cage. Original art from
       positions read off ISM figure 10 (see the contract). THE WINDOWS ARE
       HOLES: the slots are `behind: true`, so a filler shows through them and
       this metal covers its ends. TWO NODES: `plate`, which the contract
       stands 1.0 proud, with the lug, thumbscrew and slots riding on its
       front; and `flange-cover`, the metal over each seated card's bracket
       flange, which the contract stands past the wall. It sits under the
       plate, so the flat drawing is the plate's alone. Its rectangles are
       each flange's fold, 1.5 each side, over the flange's length (the
       bays' seats of std/pcie-bracket-fh@2). -->
  <g id="flange-cover">
    <path d="M118.06 2.42 H121.06 V18.50 H118.06 Z" fill="#cfd3d7"/>
    <path d="M118.06 22.87 H121.06 V38.95 H118.06 Z" fill="#cfd3d7"/>
  </g>
  <g id="plate">
    <path fill-rule="evenodd" d="M0 0 H125 V44 H0 Z M26.8 8.1 a2 2 0 0 1 2 -2 H109 a2 2 0 0 1 2 2 V15.4 a2 2 0 0 1 -2 2 H28.8 a2 2 0 0 1 -2 -2 Z M26.8 28.7 a2 2 0 0 1 2 -2 H109 a2 2 0 0 1 2 2 V35.7 a2 2 0 0 1 -2 2 H28.8 a2 2 0 0 1 -2 -2 Z" fill="#cfd3d7" stroke="#9aa1a8" stroke-width="0.25"/>
    <rect x="0" y="0" width="12.0" height="44.0" fill="#e3e6e9"/>
    <circle cx="5.5" cy="15.7" r="4.0" fill="#2a9fd6" stroke="#1d6f95" stroke-width="0.3"/>
    <path d="M3.4 15.7 H7.6 M5.5 13.6 V17.8" stroke="#16313f" stroke-width="0.6" fill="none"/>
    <g id="vents" fill="#16191c">
      <rect x="21.5" y="7.4" width="3.4" height="3.4" rx="0.5"/><rect x="21.5" y="13.0" width="3.4" height="3.4" rx="0.5"/>
      <rect x="21.5" y="28.0" width="3.4" height="3.4" rx="0.5"/><rect x="21.5" y="33.6" width="3.4" height="3.4" rx="0.5"/>
