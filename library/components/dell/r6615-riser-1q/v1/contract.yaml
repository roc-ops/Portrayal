  appears-in: 'riser configuration 3'
  power-absent: not-published
  slot-1: 'x16, full height, half length, processor 1, PCIe Gen5'
provenance:
  identity: >-
    A REMOVABLE ASSEMBLY THAT BRINGS ITS OWN SLOT (ISM figure 115, 'Riser 1Q',
    slot 1; a cable leaves its board for the system board), so it is a module
    with `bays`.
  slots: >-
    datasheet - R6615 ISM table 16: slot 1 full height, half length, x16 (Gen5),
    processor 1; table 97 gives the same slot full length with a GPU shroud. The
    slot is half length here, which never promises a card it cannot hold.
    Table 17 (technical guide table 11) lists the riser in configuration 3,
    R1Q + R4P.
  power: >-
    NOT PUBLISHED - the riser is a passive board with connectors. The R6615 ISM,
    technical guide and spec sheet were searched for 'riser' beside a wattage
    and none gives one.
  face: >-
    borrowed - composed from dell/riser-1-fh-cage-16g@1, the metal of the R660's
    riser 1P, one full-height window. ISM figure 6 shows the R6615 rear with
    risers 1 and 4 as that cage and dell/riser-4-fh-cage-16g@1 draw them.
  size: >-
    borrowed - the cage's extent, 120.60 x 19.80.
  seating: >-
    borrowed - the slot bay is dell/riser-1p-16g@1's.
  body: >-
    estimated - the board and connector are dell/riser-1p-16g@1's, by analogy
    with riser 2A's tip-left slot.
  plan: >-
    estimated - dell/riser-1-fh-plan-16g@1, an outline by eye from the R660's
    isometric figure; the R6615's figure 115 is the same kind of isometric.
