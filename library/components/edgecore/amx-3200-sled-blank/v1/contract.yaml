format: 1
kind: module
name: amx-3200-sled-blank
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  The blank cover panel for an unused AMX3200 sled slot - shipped one to a box ('1 x
  Blank cover panel accessory') and required by the guide over any slot without a sled.
size: {w: 183.8, h: 41.9}
size-confidence: {w: measured, h: measured}
provenance:
  size: >-
    THE SLOT'S, NOT THE BLANK'S. The blank covers a sled slot, so it takes the slot's
    183.8 x 41.9, measured on the guide's front for the sled that fills it. Neither
    document draws the blank's face - the guide's Package Contents lists it and its
    Install Sled Modules step says 'For unused slots, be sure to install a blank cover
    panel over the slot', and nothing shows what it looks like. It is drawn as a plain
    plate, which is an estimate of a face nobody has published, and the device says so.
states: [absent]
elements:
  plate: {at: [0.0, 0.0], size: [183.8, 41.9], class: panel}
skins: [default]
body:
  depth: 4
  color: '#25282c'
