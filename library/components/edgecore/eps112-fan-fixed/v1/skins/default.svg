<svg xmlns="http://www.w3.org/2000/svg" width="25.1mm" height="25.1mm" viewBox="0 0 25.1 25.1">
  <!-- A round fan opening set straight into the rear panel - no tray, no latch.
       The body square is the panel colour on purpose: what the elevation shows is
       a circular hole, and a darker square around it would draw a tray this machine
       does not have. Inside: a bright rotor disc, the dark blade annulus around it
       with the blade edges catching light, and the spider guard over everything -
       which is how both the guide's elevation and the rear photograph read. -->
  <rect id="body" x="0" y="0" width="25.1" height="25.1" fill="#464646"/>
  <g id="guard">
    <circle id="guard-well" cx="12.55" cy="12.55" r="12.30" fill="#16181b"/>
    <g id="blade-edges" fill="#c9ced3">
      <path d="M 20.95 12.55 L 24.50 12.55 A 11.95 11.95 0 0 1 24.15 15.44 L 20.70 14.58 A 8.40 8.40 0 0 0 20.95 12.55 Z"/>
      <path d="M 17.79 19.12 L 20.00 21.89 A 11.95 11.95 0 0 1 17.52 23.42 L 16.04 20.19 A 8.40 8.40 0 0 0 17.79 19.12 Z"/>
      <path d="M 10.68 20.74 L 9.89 24.20 A 11.95 11.95 0 0 1 7.15 23.21 L 8.76 20.04 A 8.40 8.40 0 0 0 10.68 20.74 Z"/>
      <path d="M 4.98 16.19 L 1.78 17.73 A 11.95 11.95 0 0 1 0.85 14.98 L 4.32 14.26 A 8.40 8.40 0 0 0 4.98 16.19 Z"/>
      <path d="M 4.98 8.91 L 1.78 7.37 A 11.95 11.95 0 0 1 3.36 4.91 L 6.09 7.18 A 8.40 8.40 0 0 0 4.98 8.91 Z"/>
      <path d="M 10.68 4.36 L 9.89 0.90 A 11.95 11.95 0 0 1 12.79 0.60 L 12.72 4.15 A 8.40 8.40 0 0 0 10.68 4.36 Z"/>
      <path d="M 17.79 5.98 L 20.00 3.21 A 11.95 11.95 0 0 1 22.04 5.29 L 19.22 7.44 A 8.40 8.40 0 0 0 17.79 5.98 Z"/>
    </g>
    <circle id="rotor-disc" cx="12.55" cy="12.55" r="8.40" fill="#dfe3e6" stroke="#8d9298" stroke-width="0.3"/>
    <g id="spider" stroke="#5a6167" stroke-width="0.60" fill="none">
      <circle cx="12.55" cy="12.55" r="11.90"/>
      <circle cx="12.55" cy="12.55" r="4.60"/>
      <line x1="4.10" y1="4.10" x2="21.00" y2="21.00"/>
      <line x1="21.00" y1="4.10" x2="4.10" y2="21.00"/>
    </g>
    <circle id="rotor-hub" cx="12.55" cy="12.55" r="2.30" fill="#9aa1a8" stroke="#6e757c" stroke-width="0.22"/>
  </g>
</svg>
