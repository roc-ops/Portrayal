<svg xmlns="http://www.w3.org/2000/svg" width="57mm" height="40mm" viewBox="0 0 57 40">
  <!-- The COR580's 48 VDC supply (FRU FSJ033-610G) as the quick start's angled illustration of
       its terminal end draws it, positions estimated: a black U-handle at the left, two barrier
       plates with a screw each in the middle (screws facing out of the face), a silver ground
       stud at the right (the part below) and a red latch at the lower right. -->
  <rect id="body" x="0" y="0" width="57" height="40" rx="0.6"
    fill="#b7c0c9" stroke="#7a8087" stroke-width="0.4"/>
  <rect x="0.8" y="0.8" width="55.4" height="38.4" rx="0.4"
    fill="none" stroke="#d3d9df" stroke-width="0.22"/>
  <g id="terminal">
    <rect x="14.50" y="5.50" width="24.00" height="24.50" rx="0.6"
      fill="#2b2b2b" stroke="#161616" stroke-width="0.3"/>
    <rect x="16.50" y="7.50" width="9.50" height="20.50" rx="0.4" fill="#1e1e1e"/>
    <rect x="27.00" y="7.50" width="9.50" height="20.50" rx="0.4" fill="#1e1e1e"/>
    <g id="pole-1">
      <circle cx="21.50" cy="18.00" r="2.90" fill="#7f7f7f" stroke="#383838" stroke-width="0.3"/>
      <path d="M 19.70 18.00 H 23.30 M 21.50 16.20 V 19.80" stroke="#383838" stroke-width="0.45" fill="none"/>
    </g>
    <g id="pole-2">
      <circle cx="31.00" cy="18.00" r="2.90" fill="#7f7f7f" stroke="#383838" stroke-width="0.3"/>
      <path d="M 29.20 18.00 H 32.80 M 31.00 16.20 V 19.80" stroke="#383838" stroke-width="0.45" fill="none"/>
    </g>
  </g>
  <g id="handle">
    <rect x="2.30" y="6.00" width="8.60" height="26.00" rx="4.30"
      fill="none" stroke="#2a2a2a" stroke-width="2.60"/>
    <rect x="2.30" y="6.00" width="8.60" height="26.00" rx="4.30"
      fill="none" stroke="#8a8a8a" stroke-width="0.45"/>
  </g>
  <g id="latch">
    <rect x="38.50" y="26.00" width="11.50" height="12.50" rx="1.20"
      fill="#c48484" stroke="#5f3535" stroke-width="0.3"
      data-fill-from="latch-finish" data-stroke-from="latch-edge"/>
    <rect x="42.40" y="30.50" width="2.00" height="5.00" rx="0.5" fill="#1c1f23"/>
  </g>
</svg>
