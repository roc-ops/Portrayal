format: 1
kind: component
name: cor550-rack-rail
version: 1.0.0
class: mount
behaviour: mounts
profile: networking
description: >-
  The rack-rail assembly of the Edgecore COR550 rack mounting kit, two to a kit. A silver rail
  with a rear slide plate that is set to a marked position and held by a thumbscrew, then
  extended until it meets the rear and the front post of the rack. Drawn as a plain plate: the
  guide dimensions nothing.
size: {w: 20.0, h: 43.5}
size-confidence: {w: estimated, h: estimated}
provenance:
  model: >-
    datasheet - the Edgecore Quick Start Guide for the 100G Aggregation Router AS7926-40XKFB,
    page 2, steps 2 to 5: the rear slide plate is set to its marked position and held by a
    thumbscrew, the assembly is extended to meet the rear and the front post, and it is fixed
    with four screws at the rear post and two at the front.
  size: >-
    estimated - NO FIGURE DIMENSIONS THIS PART. 20.0 by 43.5 mm is a placeholder envelope for
    the rail seen end on; nothing measures it, and the length of the rail is not stated.
skins: [default]
