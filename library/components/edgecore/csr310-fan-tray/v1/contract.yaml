format: 1
kind: module
name: csr310-fan-tray
version: 1.0.2
class: fan
behaviour: fills
profile: networking
description: >-
  The fan tray of the Edgecore CSR310 (AS7315-27X) - a hot-swappable 1RU tray at
  the right-hand end of the faceplate carrying the chassis's redundant fan
  modules, with a grab handle across its top and a captive knurled thumbscrew at
  its foot. Edgecore part FAN-1U-1x1J-S. The airflow direction is printed on its
  face as an arrow.
size: {w: 45.2, h: 40.4, d: 300.0}
size-confidence: {w: photo-measured, h: photo-measured, d: estimated}
attrs:
  model: 'FAN-1U-1x1J-S'
  part: 'F0TZZ5627001A'
  power-absent: not-published
  airflow: side-to-side
provenance:
  the-two-columns-were-the-wrong-way-round: >-
    THE DEFECT WAS FOUND IN roc-ops/Portrayal#423, which surveyed this line's fan FRUs while
    deciding NOT to rename edgecore/ais800-fan@1, and noticed that the survey #420 relied on
    had counted contracts rather than documents.
    THIS CONTRACT ALWAYS HAD THE FRU; IT WAS FILED UNDER THE ATTR NOTHING READS. Until
    roc-ops/Portrayal#426 it carried `model: 'AS7315-27X Fan Tray'` with
    `part: 'FAN-1U-1x1J-S'` beside it, which inverts the CSR310 datasheet's own Field
    Replacement Units table. That table has three columns - Model Number, Part Number,
    Description - and its fan row reads `FAN-1U-1x1J-S` | `F0TZZ5627001A` | "AS7315-27X Fan
    Tray Spare Part". The code was in `part:` where the vendor calls it a MODEL number, and
    the Description column's prose was in `model:`. The two are now the way Edgecore prints
    them.
    IT MATTERS BECAUSE ONLY ONE OF THEM IS READ. `spec/tools/portrayal/dcim_export.py` keys
    every module type on `attrs.model` and does not look at `attrs.part` at all, so this tray
    was published to NetBox and Nautobot as `module-types/Edgecore/AS7315-27X Fan Tray.yaml`
    while the orderable code sat one line below in a field no consumer sees. `part:` is not a
    library convention either - three contracts in the whole library use it, this one and the
    two CSR310 supplies, which had the same inversion from the same table and were corrected
    in the same change: see edgecore/csr310-psu-ac@1 and edgecore/csr310-psu-dc@1.
    THE AIRFLOW SUFFIX IS NOT DROPPED HERE, unlike edgecore/dcs201-fan@1 and
    edgecore/fan-2u-1x1sn@1. Those trays print a -F/-B pair that differs only in handle
    colour, so the family name is what goes in the attr. This table prints ONE code with no
    pair, and its trailing `-S` is not an airflow letter - the Description calls the row a
    "Spare Part", so -S may well be that and not part of the tray's own designation.
    THE DC SUPPLY IN THE SAME TABLE BEHAVES THE SAME WAY, which is the nearest thing to
    evidence there is. Its row reads `CRXT - T0T12BS` while the CSR310's and the CSR430's
    quick starts both instruct "Install one or two DC PSUs (part number CRXT-T0T12B only)" -
    three occurrences across two documents and two languages, every one of them WITHOUT the
    trailing S. Two rows of one table carrying a suffix the installation guides drop is a
    pattern; it is not a proof, because no Edgecore document in this corpus defines the
    suffix and no guide names this tray's code at all. So what is recorded is exactly the
    string Edgecore prints, suffix and all, rather than a `FAN-1U-1x1J` this library would
    have inferred from a pattern of two.
    THE CSR430 SEATS THIS TRAY AND NAMES NO FRU. Its datasheet prints no FAN- code anywhere,
    so the CSR310's table is the only source for both, and this attr is scoped to it.
  no-face-extrusion: >-
    edgecore/csr310-fan-tray@1's own depth key. THE TRAY FACE CARRIES NO `out` OF ITS OWN,
    matching the two supplies it sits beside. A full-face extrusion is a slab, and a slab
    lands in front of anything painted on or recessed into the face under it - on the AC
    supply that was a C14 inlet, which vanished entirely; here it would be the AIRFLOW arrow,
    which is the one thing on this tray a technician has to read. The tray sits flush in its
    bay; the handle and the thumbscrew say how far they stand off, one at a time.
  shared-with: >-
    THE CSR430 (AS7515-24X) IS MODELLED WITH THIS TRAY, AND THE EVIDENCE IS WEAKER THAN FOR
    THE SUPPLIES - say so rather than let the reuse imply more. No part number: the CSR430's
    datasheet carries no field-replacement table and its quick start names no fan-tray part,
    where the CSR310's datasheet names FAN-1U-1x1J-S outright. What there is, is the face:
    read off both elevations against one rule, the handle spans 400.9-430.6 and 400.7-433.4,
    the AIRFLOW arrow 397.6-409.9 and 398.5-410.4, the thumbscrew 421.0-429.6 and
    424.4-430.3. Same design, same place, agreeing to about two millimetres on art at 8-9
    px/mm - which is the noise floor, not a match to be proud of.
    A PART NUMBER FOR THE CSR430'S TRAY WOULD SETTLE IT. Until one turns up this is an
    identification by drawing, and the CSR430 carries it as a gap.
  size: >-
    photo-measured - CSR310 datasheet front elevation, page 2 at 600 dpi scaled
    by the stated 440 mm body width to 8.1477 px/mm. The tray's left edge reads
    394.3 and it runs to the panel's own right edge at 439.5, giving 45.2; its
    top and bottom edges read 1.6 and 42.0, the same as the supplies', which is
    what a single row of 1RU modules looks like.
  depth: >-
    estimated, stated as the chassis depth because nothing better exists. The
    datasheet gives the box as 300 mm deep and does not dimension the tray.
  airflow-arrow: >-
    photo-measured - an outlined arrow with the word AIRFLOW inside it, centred
    about 9.5 from the tray's left edge and 35 down, pointing RIGHT. That
    direction is the whole reason it is drawn: every published ordering code for
    this model is side-to-side, and the arrow on the tray is where the hardware
    says which way.
  how-many-fans: >-
    NOT STATED AND NOT DRAWN. The datasheet says "Hot swappable redundant fan
    modules" and the FRU table sells one "Fan Tray Spare Part"; neither says how
    many fans are inside it, and the elevation shows a closed tray with no
    grille. So this is ONE module with no nested bays, and the count is a gap on
    the device rather than a number invented here.
  power: >-
    NOT PUBLISHED. No document states a draw for the tray. L27 stands on it.
elements:
  handle: {at: [7.2, 4.5], size: [31.0, 3.4], class: handle}
  thumbscrew: {at: [27.9, 31.2], size: [8.0, 8.6], class: fastener}
relief:
  wall: '#3a3e43'
  # THE FACE ITSELF GETS NO RELIEF - see `no-face-extrusion`.
  features:
    - node: handle
      out: 7.0
      color: '#8a9099'
      confidence: estimated
      source: >-
        edgecore/csr310-fan-tray@1's own depth key - a grab handle deep enough
        for fingers. Read as a handle from the elevation; the projection is not
        dimensioned anywhere.
    - node: thumbscrew
      cyl: 5.0
      knurl: true
      color: '#6e747c'
      confidence: estimated
      source: >-
        edgecore/csr310-fan-tray@1's own depth key - a captive knurled screw. The
        knurling is read from the elevation, where the head shows vertical ribs;
        how far it stands off is not.
skins: [default]
