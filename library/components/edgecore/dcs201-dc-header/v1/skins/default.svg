<svg xmlns="http://www.w3.org/2000/svg" width="20.0mm" height="18.0mm" viewBox="0 0 20.0 18.0">
  <!-- The pluggable DC terminal of the 48 VDC supply seen from its mating face: a green body, three cells in a column and a label strip printed
       with the earth symbol, "-" and "+" from the top down, and two screw flanges at the left. Shapes and colours are estimates; the guide's
       figure is a colour render. -->
  <rect id="body" x="0" y="0" width="20.0" height="18.0" rx="0.8" fill="#6fa851" stroke="#3d6b2e" stroke-width="0.4"/>
  <g id="screws" fill="#c9cfd4" stroke="#5c6167" stroke-width="0.2">
    <circle cx="1.5" cy="2.0" r="0.9"/>
    <circle cx="1.5" cy="16.0" r="0.9"/>
  </g>
  <rect id="label" x="14.2" y="1.6" width="4.6" height="14.8" rx="0.3" fill="#f2f4f2"/>
  <g id="cells" fill="#1f3d1a">
    <rect x="3.2" y="2.4" width="10.0" height="3.6" rx="0.4"/>
    <rect x="3.2" y="7.2" width="10.0" height="3.6" rx="0.4"/>
    <rect x="3.2" y="12.0" width="10.0" height="3.6" rx="0.4"/>
  </g>
  <g id="contacts" fill="#c9cfd4">
    <rect x="4.4" y="3.4" width="2.0" height="1.6" rx="0.2"/>
    <rect x="4.4" y="8.2" width="2.0" height="1.6" rx="0.2"/>
    <rect x="4.4" y="13.0" width="2.0" height="1.6" rx="0.2"/>
  </g>
  <g id="marks" fill="none" stroke="#1b1b1b" stroke-width="0.4" stroke-linecap="round">
    <path d="M 16.5 3.0 V 4.2 M 15.3 4.2 H 17.7 M 15.8 4.8 H 17.2 M 16.2 5.4 H 16.8"/>
    <path d="M 15.5 9.0 H 17.5"/>
    <path d="M 15.5 13.8 H 17.5 M 16.5 12.8 V 14.8"/>
  </g>
</svg>
