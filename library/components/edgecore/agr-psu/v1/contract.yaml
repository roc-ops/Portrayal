format: 1
kind: module
name: agr-psu
version: 2.0.0
class: psu
profile: networking
description: >-
  Hot-swappable PSU for the Edgecore AGR400 (AS7946-30XB) and AGR420
  (AS7946-74XKSB), used by both platforms. A black bail handle on the left, the
  input in the middle and a red latch on the right. Two variants share one
  shell and differ only in that input, so they are skins: `default` is the
  DC-DC unit with a two-post -48 V terminal block, `ac` the AC-DC unit with an
  IEC inlet.
attrs: {model: 'AGR PSU'}
size: {w: 60.1, h: 37.6, d: 360.7}
provenance:
  face: 'drawing + photo - 60.1 x 37.6 measured off the rear panel figure; the
    arrangement (bail handle LEFT, input centre, red latch RIGHT) is read off
    photographs of the real unit. An earlier pass had it mirrored and gave it
    vents and a status LED that the part does not have'
  depth: 'measured - 360.7 mm, read off a tape measure lying beside the module in
    IMG_6795 at 100 px/inch. Previously estimated at 250'
  variants: 'photo - the unit in our hands is DC (two large + and - screw posts
    in a metal housing, IMG_6789 and IMG_6793-6800). Edgecore''s own stock render
    AS7946-30XB-B shows the AC unit with an IEC inlet. Both exist; the shell is
    the same, so they are skins rather than separate components'
  redundancy: datasheet - "Hot-swappable, load-sharing, and 1+1 redundant
    DC-DC/AC-DC PSUs"
  inputs: datasheet - DC -40 to -75 VDC 40 A max per PSU; AC 100-120 V 12 A or
    200-240 V 7.5 A per PSU
  shared: Jason - both AGR platforms use the same PSUs and fans
relief:
  wall: '#4a4f55'
skins: [default, ac]
