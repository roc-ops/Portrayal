format: 1
kind: component
name: cor550-rack-bracket
version: 1.0.0
class: mount
behaviour: mounts
profile: networking
description: >-
  The rack mount bracket of the Edgecore COR550 rack mounting kit, two to a kit. A dark
  L-shaped plate: its side leg screws to the side of the switch with four screws and its front
  flange, with two holes, bolts to the front post of the rack. Drawn as a plain plate: the
  guide dimensions nothing.
size: {w: 20.0, h: 87.0}
size-confidence: {w: estimated, h: estimated}
provenance:
  model: >-
    datasheet - the Edgecore Quick Start Guide for the 100G Aggregation Router AS7926-40XKFB,
    page 1 (the rack mounting kit) and page 2, step 1, which screws a bracket to each side of
    the switch, and step 7, which secures the switch with two screws through each bracket. The
    figure of step 1 draws a dark bracket with four screw holes in the side leg and two in the
    flange.
  size: >-
    estimated - NO FIGURE DIMENSIONS THIS PART. 20.0 by 87.0 mm is a placeholder envelope for
    the bracket seen from the front, the height being the 2 RU face the figure of step 7 shows
    it running the full height of; nothing measures it.
