<svg xmlns="http://www.w3.org/2000/svg" width="50.9mm" height="39.4mm" viewBox="0 0 50.9 39.4">
  <!-- The DCS500's 850 W AC supply as the datasheet's rear draws it: a bright housing
       with a square-cell exhaust lattice, the C14 inlet at the left end (composed by the
       contract, not drawn here), a black handle standing up the middle and the red release
       latch at the right end. -->
  <rect id="body" x="0" y="0" width="50.9" height="39.4" rx="0.4" fill="#c9cdd1" stroke="#6b7076" stroke-width="0.35"/>
  <g id="vent" fill="#16191c">
    <rect x="2.2" y="7.0" width="2.4" height="3.0"/><rect x="2.2" y="11.6" width="2.4" height="3.0"/>
    <rect x="2.2" y="16.2" width="2.4" height="3.0"/><rect x="2.2" y="20.8" width="2.4" height="3.0"/>
    <rect x="2.2" y="25.4" width="2.4" height="3.0"/>
    <rect x="32.6" y="4.4" width="3.2" height="3.2"/><rect x="37.2" y="4.4" width="3.2" height="3.2"/><rect x="41.8" y="4.4" width="3.2" height="3.2"/>
    <rect x="32.6" y="9.0" width="3.2" height="3.2"/><rect x="37.2" y="9.0" width="3.2" height="3.2"/><rect x="41.8" y="9.0" width="3.2" height="3.2"/>
    <rect x="32.6" y="13.6" width="3.2" height="3.2"/><rect x="37.2" y="13.6" width="3.2" height="3.2"/><rect x="41.8" y="13.6" width="3.2" height="3.2"/>
    <rect x="32.6" y="18.2" width="3.2" height="3.2"/><rect x="37.2" y="18.2" width="3.2" height="3.2"/>
    <rect x="32.6" y="22.8" width="3.2" height="3.2"/><rect x="37.2" y="22.8" width="3.2" height="3.2"/>
    <rect x="32.6" y="27.4" width="3.2" height="3.2"/><rect x="37.2" y="27.4" width="3.2" height="3.2"/>
  </g>
  <g id="handle">
    <rect x="25.60" y="1.20" width="4.60" height="36.00" rx="2.20" fill="#1c1f23" stroke="#0e1013" stroke-width="0.3"/>
    <rect x="26.90" y="3.20" width="2.00" height="32.00" rx="1.00" fill="none" stroke="#4d5258" stroke-width="0.35"/>
  </g>
  <g id="latch">
    <rect x="39.50" y="16.80" width="10.40" height="21.60" rx="1.00" fill="#c0453f" stroke="#7d2b27" stroke-width="0.3" data-fill-from="latch-finish"/>
    <rect x="43.60" y="21.20" width="1.60" height="7.40" rx="0.6" fill="#f2f4f6"/>
  </g>
</svg>
