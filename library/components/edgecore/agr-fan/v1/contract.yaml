description: >-
  Hot-swappable fan module for the Edgecore AGR400 (AS7946-30XB) and AGR420
  (AS7946-74XKSB). Five fit across the rear in a 4+1 redundant arrangement,
  numbered FAN 0 at the right to FAN 4 at the left.
attrs: {model: 'AGR Fan'}
size: {w: 69.4, h: 75.4, d: 120.0}
provenance:
  size: 'drawing - measured off the rear panel figure in the AS7946-30XB Quick
    Start Guide (page 1). Five latch centres at 82.4, 152.3, 222.5, 291.3 and
    360.1 mm give a 69.4 mm pitch across a 351.9 mm bay'
  shared: Jason - both AGR platforms use the same PSUs and fans
  count: datasheet - "4 +1 redundant, hot-swappable fan modules" (AGR400
    datasheet, Features)
  numbering: drawing - the rear figure silkscreens FAN 4, FAN 3, FAN 2, FAN 1,
    FAN 0 from left to right
  depth: estimated - not given in either document
