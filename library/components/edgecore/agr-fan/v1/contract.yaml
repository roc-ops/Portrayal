format: 1
kind: module
name: agr-fan
version: 2.0.0
class: fan
profile: networking
description: >-
  Hot-swappable fan module for the Edgecore AGR400 (AS7946-30XB) and AGR420
  (AS7946-74XKSB). Five across the rear in a 4+1 redundant arrangement,
  numbered FAN 0 at the right to FAN 4 at the left. Two counter-rotating rotors
  in tandem behind a circular honeycomb finger guard, with a red D-handle on
  the left of the faceplate.
attrs: {model: 'AGR Fan'}
size: {w: 69.4, h: 69.4, d: 132.0}
provenance:
  face: 'photo - SQUARE, not the rectangle an earlier pass drew, and set with an
    equal 8.8 mm lip above and below on the 87 mm panel. 69.4 square is the only
    size that is both square and fits the measured 70.4 mm bay pitch'
  depth: 'measured - 132 mm, read off a tape measure lying beside the module in
    IMG_6802 at 156 px/inch. Previously estimated at 120'
  grille: photo - a circular honeycomb finger guard filling most of the square
    face, over two rotors in tandem. The stock rear render and the real
    photograph agree
  handle: photo - a red D-handle on the LEFT of every bay, carrying a small FB
    marking
  count: datasheet - "4 +1 redundant, hot-swappable fan modules" (AGR400
    datasheet, Features)
  numbering: drawing - FAN 4, FAN 3, FAN 2, FAN 1, FAN 0 left to right
  shared: Jason - both AGR platforms use the same PSUs and fans
body:
  depth: 132.0
  color: '#26292d'
relief:
  wall: '#4a4f55'
  features:
    - {node: handle-bar, uhandle: 8.0}
    - {node: grille, vent: 26}
skins: [default]
