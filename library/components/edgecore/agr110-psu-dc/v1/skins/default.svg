<svg xmlns="http://www.w3.org/2000/svg" width="54mm" height="40mm" viewBox="0 0 54 40">
  <!-- The DC supply of the Edgecore AGR110 and AGR130, as it sits in the rear bay: the 54 x 40 housing, the red release
       latch at the left, the black pull handle, and a black barrier block of three screws where the AC supply has its
       inlet. Screws top to bottom: DC return, the -36 to -72 VDC feed, and the one beside the printed earth symbol. -->
  <defs>
    <pattern id="mesh" width="4.8" height="4.8" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="3.8" height="3.8" fill="#3c4046"/>
    </pattern>
  </defs>
  <g id="latch">
    <path id="latch-body" d="M 1.2 8 h 5 a 1.6 1.6 0 0 1 1.6 1.6 v 20.8 a 1.6 1.6 0 0 1 -1.6 1.6 h -5 a 1.2 1.2 0 0 1 -1.2 -1.2 v -21.6 a 1.2 1.2 0 0 1 1.2 -1.2 z" fill="#c22f2f" stroke="#7a1a1a" stroke-width="0.4" data-fill-from="latch-finish" data-stroke-from="latch-edge"/>
    <line id="latch-line" x1="5.85" y1="17.6" x2="5.85" y2="27.2" stroke="#0d0f11" stroke-width="0.7"/>
  </g>
  <rect id="body" x="8" y="0.8" width="45.2" height="38.4" rx="0.8" fill="#b9bec4" stroke="#7a8087" stroke-width="0.4"/>
  <rect id="vent-field" x="9" y="1.8" width="43.2" height="36.4" fill="url(#mesh)"/>
  <g id="handle">
    <rect id="handle-bar" x="10" y="8" width="5" height="24" rx="1.8" fill="#1c1f23" stroke="#0d0f11" stroke-width="0.35"/>
    <rect id="handle-grip" x="11.2" y="10" width="2.6" height="20" rx="1.2" fill="#0d0f11"/>
  </g>
  <!-- bare metal beside the block, where the figure prints the earth symbol -->
  <rect id="legend-strip" x="44.2" y="1.8" width="8.0" height="36.4" fill="#b9bec4"/>
  <g id="earth-symbol" fill="none" stroke="#2a2d31" stroke-width="0.3" stroke-linecap="round">
    <circle cx="48.2" cy="26.0" r="1.5"/>
    <path d="M 48.2 24.9 V 26.1 M 47.2 26.1 H 49.2 M 47.55 26.65 H 48.85 M 47.9 27.2 H 48.5"/>
  </g>
  <g id="dc-inlet">
    <rect id="dc-inlet-block" x="25.05" y="4.0" width="18.9" height="32.0" rx="0.6" fill="#38383a" stroke="#1d2121" stroke-width="0.3"/>
    <rect id="dc-inlet-barrier-1" x="25.65" y="14.6" width="17.7" height="1.0" fill="#1d2121"/>
    <rect id="dc-inlet-barrier-2" x="25.65" y="23.8" width="17.7" height="1.0" fill="#1d2121"/>
    <g id="pole-1">
      <rect x="29.0" y="7.4" width="10.6" height="6.0" rx="0.5" fill="#8b8883" stroke="#5a5854" stroke-width="0.2"/>
      <circle cx="34.3" cy="10.4" r="2.1" fill="#b0ada6" stroke="#6d6a65" stroke-width="0.2"/>
      <path d="M 32.9 10.4 H 35.7 M 34.3 9.0 V 11.8" stroke="#3a3a38" stroke-width="0.45" stroke-linecap="round"/>
    </g>
    <g id="pole-2">
      <rect x="29.0" y="16.7" width="10.6" height="6.0" rx="0.5" fill="#8b8883" stroke="#5a5854" stroke-width="0.2"/>
      <circle cx="34.3" cy="19.7" r="2.1" fill="#b0ada6" stroke="#6d6a65" stroke-width="0.2"/>
      <path d="M 32.9 19.7 H 35.7 M 34.3 18.3 V 21.1" stroke="#3a3a38" stroke-width="0.45" stroke-linecap="round"/>
    </g>
    <g id="pole-3">
      <rect x="29.0" y="25.7" width="10.6" height="6.0" rx="0.5" fill="#8b8883" stroke="#5a5854" stroke-width="0.2"/>
      <circle cx="34.3" cy="28.7" r="2.1" fill="#b0ada6" stroke="#6d6a65" stroke-width="0.2"/>
      <path d="M 32.9 28.7 H 35.7 M 34.3 27.3 V 30.1" stroke="#3a3a38" stroke-width="0.45" stroke-linecap="round"/>
    </g>
  </g>
</svg>
