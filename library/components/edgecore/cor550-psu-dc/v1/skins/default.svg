<svg xmlns="http://www.w3.org/2000/svg" width="54.5mm" height="40.8mm" viewBox="0 0 54.5 40.8">
  <!-- The COR550's 48 VDC supply as the quick start's angled illustration of its terminal end
       draws it, positions estimated: a wire-grid vent field at the upper left, a two-screw
       barrier block below it with its screws facing out of the face, a black U-handle in the
       middle, three small hex fasteners (the parts below) and a red latch at the lower right.
       The diamond mark the figure shows is not drawn; its zone is reserved. -->
  <defs>
    <pattern id="cor550-dc-grid" width="3.2" height="3.2" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="2.2" height="2.2" fill="#2d2f31"/>
    </pattern>
  </defs>
  <rect id="body" x="0" y="0" width="54.5" height="40.8" rx="0.4"
    fill="#b5b5b5" stroke="#7d7f81" stroke-width="0.35"/>
  <rect x="0.55" y="0.55" width="53.4" height="39.7" rx="0.3"
    fill="none" stroke="#cfd1d3" stroke-width="0.22"/>
  <g id="vent">
    <rect id="vent-back" x="1.20" y="1.60" width="29.50" height="14.60" rx="0.4" fill="#dddddd"/>
    <rect id="vent-holes" x="1.20" y="1.60" width="29.50" height="14.60" fill="url(#cor550-dc-grid)"/>
  </g>
  <rect id="logo-zone" x="6.00" y="6.00" width="6.00" height="5.50" fill="none"/>
  <g id="terminal">
    <rect x="1.00" y="17.20" width="30.00" height="22.60" rx="0.6"
      fill="#404040" stroke="#262626" stroke-width="0.3"/>
    <g fill="#2d2f31">
      <rect x="3.80" y="19.20" width="11.40" height="18.60" rx="0.4"/>
      <rect x="17.20" y="19.20" width="11.00" height="18.60" rx="0.4"/>
    </g>
    <g id="pole-1">
      <circle cx="9.60" cy="28.00" r="3.30" fill="#d2d2d2" stroke="#717171" stroke-width="0.3"/>
      <path d="M 7.60 28.00 H 11.60 M 9.60 26.00 V 30.00" stroke="#717171" stroke-width="0.45" fill="none"/>
    </g>
    <g id="pole-2">
      <circle cx="22.00" cy="28.00" r="3.30" fill="#d2d2d2" stroke="#717171" stroke-width="0.3"/>
      <path d="M 20.00 28.00 H 24.00 M 22.00 26.00 V 30.00" stroke="#717171" stroke-width="0.45" fill="none"/>
    </g>
  </g>
  <g id="handle">
    <rect x="32.60" y="3.80" width="7.00" height="33.90" rx="3.50"
      fill="none" stroke="#333333" stroke-width="2.60"/>
    <rect x="32.60" y="3.80" width="7.00" height="33.90" rx="3.50"
      fill="none" stroke="#7a7a7a" stroke-width="0.45"/>
  </g>
  <g id="latch">
    <rect x="46.00" y="24.50" width="7.50" height="15.50" rx="1.20"
      fill="#c05856" stroke="#863a3a" stroke-width="0.3"
      data-fill-from="latch-finish" data-stroke-from="latch-edge"/>
    <rect x="48.60" y="31.00" width="2.20" height="5.50" rx="0.5" fill="#1c1f23"/>
  </g>
</svg>
