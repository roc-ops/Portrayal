<svg xmlns="http://www.w3.org/2000/svg" width="54.5mm" height="40.8mm" viewBox="0 0 54.5 40.8">
  <!-- The COR550's AC supply as both rear elevations draw it: a honeycomb vent over the
       supply's own fan at the inboard end with the black D-handle laid ACROSS it, the C14
       inlet standing on end at the outboard end (composed by the contract, not drawn here),
       and the red release latch beside it.
       The mesh is drawn as holes over a lighter backing - pattern decor paints only its
       holes, so the webbing between them is whatever is underneath. -->
  <defs>
    <pattern id="cor550-psu-mesh" width="4.345" height="7.525" patternUnits="userSpaceOnUse">
      <path d="M 0.000 -2.125 L -1.841 -1.062 L -1.841 1.062 L 0.000 2.125 L 1.841 1.062 L 1.841 -1.062 Z" fill="#0b0d0f"/>
      <path d="M 4.345 -2.125 L 2.504 -1.062 L 2.504 1.062 L 4.345 2.125 L 6.186 1.062 L 6.186 -1.062 Z" fill="#0b0d0f"/>
      <path d="M 2.172 1.637 L 0.332 2.701 L 0.332 4.825 L 2.172 5.888 L 4.013 4.825 L 4.013 2.701 Z" fill="#0b0d0f"/>
      <path d="M 0.000 5.400 L -1.841 6.463 L -1.841 8.587 L 0.000 9.651 L 1.841 8.587 L 1.841 6.463 Z" fill="#0b0d0f"/>
      <path d="M 4.345 5.400 L 2.504 6.463 L 2.504 8.587 L 4.345 9.651 L 6.186 8.587 L 6.186 6.463 Z" fill="#0b0d0f"/>
    </pattern>
  </defs>
  <!-- the body carries a knockout where the composed inlet stands (20.0 x 28.0, corners R3
       as the inlet's own opening): `behind` puts that part under the whole skin, base plate
       included, so the red latch, which hangs in front of the inlet's lower right in both
       elevations, is drawn over it -->
  <path id="body" fill-rule="evenodd"
    d="M0.4 0 H54.1 a0.4 0.4 0 0 1 0.4 0.4 V40.4 a0.4 0.4 0 0 1 -0.4 0.4 H0.4 a0.4 0.4 0 0 1 -0.4 -0.4 V0.4 a0.4 0.4 0 0 1 0.4 -0.4 Z M33.10 4.15 H47.10 a3 3 0 0 1 3 3 V29.15 a3 3 0 0 1 -3 3 H33.10 a3 3 0 0 1 -3 -3 V7.15 a3 3 0 0 1 3 -3 Z"
    fill="#33373c" stroke="#1b1e22" stroke-width="0.35"/>
  <rect x="0.55" y="0.55" width="53.4" height="39.7" rx="0.3"
    fill="none" stroke="#52575d" stroke-width="0.22"/>
  <g id="vent">
    <rect id="vent-back" x="3.00" y="2.50" width="23.00" height="35.60" rx="0.4" fill="#9aa1a8"/>
    <rect id="vent-holes" x="3.00" y="2.50" width="23.00" height="35.60" fill="url(#cor550-psu-mesh)"/>
  </g>
  <g id="handle">
    <rect x="8.00" y="4.20" width="6.00" height="32.00" rx="2.60"
      fill="#1c1f23" stroke="#0e1013" stroke-width="0.3"/>
    <rect x="9.55" y="6.10" width="2.90" height="28.20" rx="1.40"
      fill="none" stroke="#6a6f75" stroke-width="0.45"/>
  </g>
  <g id="latch">
    <rect x="38.70" y="18.80" width="11.40" height="22.00" rx="1.10"
      fill="#c0453f" stroke="#7d2b27" stroke-width="0.3"
      data-fill-from="latch-finish"/>
    <rect x="39.90" y="20.30" width="5.53" height="18.60" rx="0.8"
      fill="none" stroke="#e2867f" stroke-width="0.4"/>
  </g>
</svg>
