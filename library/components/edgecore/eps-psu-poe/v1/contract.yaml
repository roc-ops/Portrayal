  handle: {at: [35.0, 7.30], size: [8.60, 25.00], class: handle}
  latch: {at: [0.80, 7.98], size: [2.90, 13.57], class: latch}
  inlet-well: {at: [43.3, 6.38], size: [17.40, 27.13], class: bezel}
