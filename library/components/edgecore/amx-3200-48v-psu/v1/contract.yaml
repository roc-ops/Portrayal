format: 1
kind: module
name: amx-3200-48v-psu
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  The Edgecore AMX3200's 1200 W DC supply, ordered as AMX-3200-48V-PSU - a 73.5 x 40.0
  module with its release latch at the left edge, its three-pin DC terminal block
  beside it, its own fan behind a guard at the right, and a black U-handle under the
  fan. Two seat at the ends of the rear, PSU2 at the left and PSU1 at the right.
size: {w: 73.5, h: 40.0}
size-confidence: {w: datasheet, h: photo-measured}
attrs:
  model: 'AMX-3200-48V-PSU'
  input: dc
  inlet: dc-terminal
  input-voltage: -40 to -72 VDC
  power-output-w: 1200
provenance:
  size: >-
    DATASHEET for the width: the ordering table's '1200 W DC PSU ... (73.5mmW x
    185mmD)'. The guide's rear (2.536 px/mm) reads the two bays 72.9 and 72.9 wide, within
    a pixel and a half of it. The 40.0 height is photo-measured: the face fills the 43.5 mm
    chassis less its frame, 40.0 against a 73.5 width on the rear photographs to the
    pixel.
  the-face: >-
    PHOTO-MEASURED at 5x on the DC rear product photograph (2.19 px/mm,
    isotropic in the face to 1%). THE GUIDE'S LINE ART IS WRONG ABOUT THE HANDLE: it
    draws a bar laid across the fan guard, and both photographs show a black U-handle
    UNDER the guard, x 31.3-71.3 over y 30.5-39.2. The part follows the photographs.
  inlet: >-
    PHOTOGRAPHED on the DC rear: a blue terminal housing with three gold pins stacked
    down it, which the guide's Connect Power figure wires 'DC Return (white), Ground
    (yellow-green), -40 - -72 VDC (black)'. The blue latch at the left edge is the DC
    build's colour; the AC build's is green, both on the same photographed rear.
  connector: >-
    the supply composes edgecore/amx-3200-dc-header@1 as `dc-header`, the three-pin DC power connector of the
    Edgecore AMX3200 Quick Start Guide, "Connect Power" (page 3, the figure above the wire list), at the box of the
    `inlet` element (17.9 by 34.5), which carries the same outline, window and pins the skin draws. The guide names no
    part number for it ("DC power cord (included with DC PSUs only)", package contents, item 5) and the maker is
    not named in words, so the part is a declared stand-in (its own provenance) and the key `edgecore-amx-dc-block-3`
    claims no maker, series, standard or pitch. edgecore/amx-3200-dc-plug@1, the cable connector of the figure,
    mates it. The skin is unchanged, so the picture does not change.
  roles: >-
    quick start - the guide lists the plug's wires "1. DC Return (white wire), 2. Ground (yellow-green wire), 3. -40 -
    -72 VDC (black wire)" and the figure numbers them 1, 2 and 3 from the top. No mark is printed on the connector, so
    the roles of the three pins from the top are read from the wires: `rtn`, `gnd` and `batt` (the -40 to -72 VDC
    conductor). No nominal is stated: the guide prints a range.
  no-dc-port: >-
    THE DC INPUT PORT IS NOT STATED HERE, ON PURPOSE. A port whose poles are a connector's contacts is offered only
    where that path's part is itself the connector; on a supply in a bay it is the supply, not the connector it
    composes, so a port stated here would be published and then not offered. The roles above are recorded for the
    port a later change can state, a minor on the devices that seat this supply.
  power-output-w: >-
    DATASHEET, 'PSU capacity 1200 W (Max system power consumption 850 W)' and the ordering
    table's '1200 W DC PSU'.
