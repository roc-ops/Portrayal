      confidence: estimated
      source: >-
        edgecore/ais800-fan@1's own elements key - the honeycomb's extent is drawn and the
        depth of the cavity behind it is not stated anywhere.
    - node: handle
      bar: 3.0
      lift: 1.0
      confidence: estimated
      source: >-
        edgecore/exp800-fan@1 and edgecore/dcs240-fan@1 - the family's tray handle, and NOT
        SOURCED for the projection there either; roc-ops/Portrayal#385 is open on exactly this
        figure across this line's trays. The hardware's grip is a closed loop hooked from
        below, which is `uhandle`, and this contract carried that at 27 until the reviewer
        directed the bar: the loop is a great deal of geometry for a 3D build and biases
        nothing, and a bar standing off the face is what every other tray in this line draws.
        The figure is a guess and is labelled one.
    - node: status
