format: 1
kind: module
name: psu-48v-650-f
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Edgecore PSU-48V-650-F, the 650 W -48 VDC supply of the DCS204 (AS7726-32X) in its front-to-back
  builds: a red release latch, a black pull handle, a grille, and a blue Positronic PLA03 connector
  low on the right of its face, with a legend beside it (RTN, -36~-72V, the earth symbol). The cable
  plugs into that connector.
size: {w: 54.0, h: 40.0}
size-confidence: {w: borrowed, h: borrowed}
part-numbers:
  PSU-48V-650-F: {part: F0TZZ7632004A}
attrs:
  power-output-w: 650
  input: dc
  input-note: '-36 - -72 VDC'
  airflow: front-to-back
provenance:
  part-number: >-
    datasheet - Edgecore DCS204 (AS7726-32X) data sheet EC-DS-0726-R09, page 4, "PSU FRUs": model
    PSU-48V-650-F, part number F0TZZ7632004A, 48VDC, front-to-back. Its back-to-front twin, PSU-48V-650-B
    (F0TZZ7632003A), is edgecore/psu-48v-650-b@1: one maker part number, one component. The DCS203
    (AS7326-56X) quick start guide shows the same supply's photograph, but its data sheet (EC-DS-0725-R10,
    page 4) lists AC supply FRUs only, so no DCS203 build is said to take this part.
  size: >-
    BORROWED from common/psu-dc-650@2, which the AS7726-32X rear bays seated before (54.0 x 40.0 each,
    `psu-1` and `psu-2`). No document held dimensions the supply's face.
  body: >-
    BORROWED from common/psu-dc-650@2 (depth 195, colour #b9bec4, the latch, the black handle's place and
    size, the grille's mesh).
  the-face: >-
    READ FROM ONE PHOTOGRAPH, NOT AN ELEVATION. DCS204 quick start guide (E092019-CS-R03), step 4 "Connect
    Power", page 2, the second figure (the DCS203 guide, E082024-AP-R04, prints the same photograph): the
    supply seen from above and to the left, a red latch at the far left, a black U-handle over a grille of
    square holes, and, low on the right of the face, a blue connector standing upright with an ear at each
    end, its pins in one column; a label beside it to the right printed, top to bottom, "RTN", "-36~-72V"
    and an earth symbol; above the connector two small vents and a round dark feature. Taking the
    connector's own 10.36 width (common/pla03-receptacle@1) as the scale beside it, its centre is about
    38 across and its foot at the face's bottom edge, so it is placed at (32.8, 10.3), 28.6 tall, and the
    label at x 44.6 to 48.6. THE POSITIONS ARE ESTIMATED: the photograph has no scale and is taken at an
    angle. The round feature is not identified by any document held and is not drawn; the two small vents
    are. The `dc-inlet` element and the `power` connection point name the connector's box and its middle
    contact.
  colour: >-
    SAMPLED - medians of the same photograph at 500 dpi: the latch #9b2f29 (shaded), the handle #1d1d1d, the
    connector #236bb2 and #215b9c, the label #b4b9bb (in shade). The latch is drawn #c22f2f, the library's
    Edgecore front-to-back red (common/psu-dc-650@2 draws it so), the handle #1c1f23, the label #e6e9ec.
  airflow: >-
    datasheet - "Front-to-Back" in the PSU FRUs table (page 4). Red is the front-to-back colour of the latch
    (Edgecore's guides say so of the supplies and fan trays they describe); the field stays red.
  power: >-
    datasheet - "PSUs: 2 redundant, load-sharing, hot-swappable 650W AC or -48 VDC" and "DC PSU ... -36 - -72
    VDC (16A/650 W max.)" (data sheet page 3); the quick start's "48 VDC PSU, Power Rating 48 VDC, 650
    Watts" (page 3). A rating, not a draw.
  input: >-
    "DC Input -36 V - -72 V, 16 A maximum" (quick start page 3) and the data sheet's "-36 - -72 VDC" (page 3):
    a range and a maximum current. The guide's "48 VDC" names the supply; no nominal is stated here.
  wire: >-
    the quick start's caution under "Connect Power" (page 2): "#14 AWG wire (for -36 VDC to -72 VDC PSU)".
  connector: >-
    the supply composes common/pla03-receptacle@1 as `inlet`, the male Positronic PLA03 connector (its own
    provenance: the guide names the plug PLA03F7000/AA, female, and no document names this half); the
    female cable connector generic/pla03-plug@1 mates it, so the end of a cable is the plug in this connector,
    as a cord's is in an AC supply's C14.
  roles: >-
    photograph and callouts - the label beside the connector prints RTN at the top contact, -36~-72V at
    the middle one and the earth symbol at the bottom one, and the guide's callouts name the plug's wires
    2 "DC Return" (red), 3 "-36 - -72 VDC" (black) and 4 "Ground" (green and yellow), top to bottom. In the
    library's words (spec/schemas/dc.yaml): rtn, batt, gnd.
  no-dc-port: >-
    THE DC INPUT PORT IS NOT STATED HERE, ON PURPOSE. A port's path is the part's own path and its id
    (`psu-1/module/input`), and a port whose poles are a connector's contacts is offered only where that
    path's part is itself the connector; on a supply in a bay it is the supply, not the connector it
    composes, so a port stated here would be published and then not offered. The roles, the 16 A and the
    #14 AWG above are recorded for the port a later change can state, a minor on the devices that seat it.
  states: >-
    THE SAME AS THE AC SUPPLY BESIDE IT (common/psu-ac-650@3): no held document describes a status lamp
    on the supply, so none is drawn. `absent` stays.
  relief: >-
    NONE STATED. No document gives how far the latch, the handle or the connector stand off the face.
states: [absent]
