<svg xmlns="http://www.w3.org/2000/svg" width="17.9mm" height="34.5mm" viewBox="0 0 17.9 34.5">
  <!-- The DC power connector of the AMX3200 supply seen from its mating face: a blue housing, a window in it and three gold pins down it, the
       middle one to the left. The outline, window and pins are the supply's own drawing of the housing, carried over. -->
  <rect id="body" x="0" y="0" width="17.9" height="34.5" rx="0.8" fill="#2f63c4" stroke="#1d3f80" stroke-width="0.3"/>
  <rect id="window" x="2.2" y="5.3" width="13.5" height="24.0" rx="0.6" fill="#3f78d8"/>
  <g id="pins" fill="#d9b24a">
    <circle cx="10.6" cy="10.4" r="1.3"/>
    <circle cx="7.0" cy="16.8" r="1.3"/>
    <circle cx="11.1" cy="24.1" r="1.3"/>
  </g>
</svg>
