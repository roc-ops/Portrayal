<svg xmlns="http://www.w3.org/2000/svg" width="51.3mm" height="39.5mm" viewBox="0 0 51.3 39.5">
  <!-- YM-1151D, as the EPS201's rear elevation draws it: a coloured release latch at the
       inboard edge, a perforated intake beside it, a recessed pull slot across the upper
       face and the C14 inlet in a recess at the outboard end. The latch colour is a field
       because the same supply ships in two airflows - see the contract's `finish` note. -->
  <defs>
    <pattern id="eps201-psu-mesh" width="2.20" height="2.20" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2.20" height="2.20" fill="#14171a"/>
      <rect x="0.45" y="0.45" width="1.30" height="1.30" rx="0.22" fill="#7d848b"/>
    </pattern>
  </defs>
  <rect id="body" x="0" y="0" width="51.3" height="39.5" rx="0.4" fill="#8d9298" stroke="#5d6267" stroke-width="0.35"/>
  <rect x="0.55" y="0.55" width="50.2" height="38.4" rx="0.3" fill="none" stroke="#b6bbc0" stroke-width="0.22"/>
  <g id="vent">
    <rect id="vent-back" x="4.20" y="7.50" width="6.40" height="27.00" rx="0.3" fill="#14171a"/>
    <rect x="4.20" y="7.50" width="6.40" height="27.00" fill="url(#eps201-psu-mesh)"/>
    <rect x="4.20" y="7.50" width="6.40" height="27.00" rx="0.3" fill="none" stroke="#5d6267" stroke-width="0.25"/>
  </g>
  <g id="slot">
    <rect x="12.00" y="8.40" width="33.00" height="4.20" rx="2.10" fill="#16181b" stroke="#5d6267" stroke-width="0.28"/>
  </g>
  <circle id="face-screw" cx="14.60" cy="4.60" r="1.70" fill="#d7dbdf" stroke="#6e757c" stroke-width="0.22"/>
  <g id="inlet-well"><rect x="19.50" y="15.00" width="29.00" height="22.50" rx="0.6" fill="#6f747a" stroke="#5d6267" stroke-width="0.3"/></g>
  <g id="retainer" fill="none" stroke="#2b2f34" stroke-width="0.65" stroke-linecap="round">
    <path d="M 46.6 19.5 V 33.0"/>
    <path d="M 46.6 19.5 H 42.6"/>
    <path d="M 46.6 33.0 H 42.6"/>
  </g>
  <g id="latch">
    <rect x="0.60" y="12.00" width="2.60" height="15.00" rx="1.10" fill="#ef3927" stroke="#2b2f34"
      stroke-width="0.25" data-fill-from="latch-finish"/>
  </g>
</svg>
