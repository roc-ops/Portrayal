<svg xmlns="http://www.w3.org/2000/svg" width="63mm" height="62.6mm" viewBox="0 0 63 62.6">
  <!-- The DCS500's rear fan tray: honeycomb across the face over one rotor, and the red
       D-handle on the tray's RIGHT edge. The rotor is drawn again over the mesh at low
       opacity so it reads through the holes, as it does in both elevations. -->
  <defs>
    <pattern id="dcs500-fan-mesh" width="4.390" height="7.603" patternUnits="userSpaceOnUse">
      <path d="M 0.000 -2.147 L -1.860 -1.073 L -1.860 1.073 L 0.000 2.147 L 1.860 1.073 L 1.860 -1.073 Z" fill="#0b0d0f"/>
      <path d="M 4.390 -2.147 L 2.530 -1.073 L 2.530 1.073 L 4.390 2.147 L 6.250 1.073 L 6.250 -1.073 Z" fill="#0b0d0f"/>
      <path d="M 2.195 1.654 L 0.335 2.729 L 0.335 4.875 L 2.195 5.949 L 4.055 4.875 L 4.055 2.729 Z" fill="#0b0d0f"/>
      <path d="M 0.000 5.456 L -1.860 6.530 L -1.860 8.676 L 0.000 9.751 L 1.860 8.676 L 1.860 6.530 Z" fill="#0b0d0f"/>
      <path d="M 4.390 5.456 L 2.530 6.530 L 2.530 8.676 L 4.390 9.751 L 6.250 8.676 L 6.250 6.530 Z" fill="#0b0d0f"/>
    </pattern>
  </defs>
  <rect id="body" x="0" y="0" width="63" height="62.6" rx="0.5" fill="#2b2f34" stroke="#1b1e22" stroke-width="0.4"/>
  <g id="grille">
    <rect x="1.60" y="1.60" width="54.40" height="59.40" rx="0.4" fill="#9aa1a8"/>
    <rect x="1.60" y="1.60" width="54.40" height="59.40" fill="url(#dcs500-fan-mesh)"/>
    <circle cx="28.80" cy="31.30" r="22.50" fill="#e6eaec" fill-opacity="0.16"/>
    <circle cx="28.80" cy="31.30" r="6.50" fill="#aab1b8" fill-opacity="0.25"/>
  </g>
  <g id="handle">
    <rect x="57.00" y="19.40" width="6.00" height="27.70" rx="2.60"
      fill="#c0453f" stroke="#7d2b27" stroke-width="0.28" data-fill-from="handle-finish"/>
    <rect x="58.60" y="21.40" width="2.80" height="23.70" rx="1.20"
      fill="none" stroke="#e2867f" stroke-width="0.32"/>
  </g>
</svg>
