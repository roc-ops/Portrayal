<svg xmlns="http://www.w3.org/2000/svg" width="17.9mm" height="34.5mm" viewBox="0 0 17.9 34.5">
  <!-- The cable connector of the AMX3200 48 VDC supply seen from the wire side, seated: a blue body at the outline of the connector it seats
       in, a latch tab at the top, and one wire entering each of the three ways (DC return, ground and -40 to -72 VDC from the top down). -->
  <rect id="tab" x="4.0" y="0" width="9.0" height="2.6" rx="0.5" fill="#1d3f80"/>
  <rect id="body" x="0" y="1.6" width="17.9" height="32.9" rx="0.8" fill="#0d69ca" stroke="#1d3f80" stroke-width="0.3"/>
  <circle id="wire-1" cx="7.0" cy="9.0" r="2.2" fill="#f2f2f2" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-1-color"/>
  <circle id="wire-2" cx="7.0" cy="16.8" r="2.2" fill="#b6c43a" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-2-color"/>
  <circle id="wire-3" cx="7.0" cy="24.6" r="2.2" fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-3-color"/>
</svg>
