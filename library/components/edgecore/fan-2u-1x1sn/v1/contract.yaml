format: 1
kind: module
name: fan-2u-1x1sn
version: 1.0.3
class: fan
behaviour: fills
profile: networking
description: >-
  Edgecore's FAN-2U-1x1SN rear fan tray - a near-square 2RU tray, honeycomb across its whole
  face, one 80 mm rotor showing through the mesh, a wide coloured pull bar sweeping across its
  middle with the release button set into the bar, and one unlabelled lens at its top left.
  FOUR fill a chassis, each carrying TWO fans in series behind one grille, which is why the
  vendor's "8 fans total with 7+1 redundancy" counts twice what this library's bays do. It is
  not one machine's part - the AIS800-64D, the AIS800-64O and the AGR560 all seat this same
  tray on the same 440 x 649.2 x 87 shell - which is why it is named for the FRU their three
  datasheets print rather than for any one of them.
size: {w: 81.6, h: 81.2}
size-confidence: {w: photo-measured, h: photo-measured}
attrs:
  model: 'FAN-2U-1x1SN'
  power-absent: not-published
  airflow: front-to-back
provenance:
  size: >-
    photo-measured on the AIS800-64D quick start guide, page 1 Overview REAR elevation,
    rendered from the PDF page at 600 dpi and scaled by the stated 440 mm body width to
    5.0636 px/mm; the face is isotropic to 0.3% against its 87 mm height. The datasheet's
    rear photograph (page 2, 3.67 px/mm native) was scanned the same way and agrees.
    THE RAILS FIX THE PITCH AND THE WIDTH. Vertical-edge scans over the fan block find the
    rails between trays at 176.16/180.50, 262.06/266.01 and 347.58/351.92 on the drawing and
    176.0/180.24 and 261.43/265.67 on the photograph: a 4.1-4.3 mm rail on an 85.71 mm pitch
    (85.43 on the photograph), which leaves 81.6 for the tray face. Tray 1's own left frame
    reads 94.25 on the photograph and 94.8 by pitch from the rails on the drawing; tray 4's
    right frame at 433.1-433.5 closes against the chassis frame at 437.4.
    THE HEIGHT: horizontal seams at 4.94 and about 86.1 on the drawing bound the block, and
    the photograph's honeycomb runs y 7-84 inside a frame that starts at 4.5; 81.2 is the
    frame-to-frame figure and the tray is 0.4 mm short of square.
  the-handle-is-a-swept-bar-with-the-button-in-it: >-
    THE GUIDE SAYS "Pull the handle release latch" and the photograph shows what that means:
    a red bar about 16 mm thick running the full width of the tray, its left end at y 36-52
    and its right end at y 42-58 in face terms (a 6 mm sweep across 77 mm), with a small
    square button set into the bar's centre at (135.5, 47) on tray 1 - the release latch.
    The bar is drawn as that parallelogram in the skin; its element is the axis-aligned
    footprint, and its relief is a `uhandle` on the narrower `handle-bar` node, because the
    guide's Fan Tray Replacement figure shows the part is a D-loop on two pivot bosses rather
    than the flat bar the elevation flattens it into. The projection remains unsourced, which
    roc-ops/Portrayal#385 already records across this line's trays.
  the-lens: >-
    ONE ROUND LENS AT THE TOP LEFT OF EVERY TRAY, face (99.5, 10.0) on tray 1 - a bright dot
    2 mm across on the photograph and a white dot on the drawing. Neither document names
    it. It is drawn as a lamp with the off/on default and no invented legend; see the
    device's module-lamp-legend gap.
  the-grille-is-drawn-light-because-the-holes-are-the-pattern: >-
    THE MESH READS AS A SILVER WEB WITH BLACK HOLES on the datasheet's rear photograph, not as
    a black panel. The first draft of this skin put the hex pattern's dark cells on a dark
    backing rect and the whole tray came out flat black - the vent-field-needs-a-backing-rect
    lesson in its other direction: panel pattern decor paints only its HOLES, so the webbing
    between them is whatever is underneath. The backing is the web and is drawn in the
    photograph's own mid grey.
  two-fans-one-grille: >-
    The datasheet twice says "4 hot-swappable fan modules (2 fans per module), 8 fans total
    with 7+1 redundancy". One rotor is visible through the mesh - the photograph shows one
    hub, about 66 mm across - and the second sits behind it in the same tray. The bay count
    is FOUR and the fan count EIGHT; the device's fans group says which of the two the
    vendor's 7+1 counts.
  power: >-
    NOT PUBLISHED. Neither document gives a per-tray figure; the datasheet's ordering table
    names FAN-2U-1x1SN-F and -B with no rating.
  airflow-colour-convention: >-
    The datasheet photographs both builds on one page - RED bars front-to-back, BLUE bars
    back-to-front - and pairs FAN-2U-1x1SN-F with front-to-back and -B with back-to-front.
    The bar fill is a default overridden per configuration. See roc-ops/Portrayal#277.
  the-name-is-the-fru-because-the-tray-outlived-the-chassis: >-
    THIS PART WAS CALLED `edgecore/ais800-64-fan` UNTIL roc-ops/Portrayal#420, and the name
    was a claim about ownership that the library's own seats had already contradicted. The
    AIS800-64D, the AIS800-64O and the AGR560 all seat it, and the AGR560 is an AGR, not an
    AIS800. A fourth rear on the same shell would have inherited the same wrong surname.
    WHAT SAYS IT IS ONE PART RATHER THAN THREE LOOKALIKES. Every one of the three datasheets
    prints the SAME FRU in its ordering table - `FAN-2U-1x1SN-F` front-to-back and
    `FAN-2U-1x1SN-B` back-to-front - and the guides' rear-elevation tray artwork is not merely
    similar: the AIS800-64D's and the AIS800-64O's are the same image to a maximum difference
    of ZERO grey levels, which spec/tests/test_fan_redundancy.py records in the census, and the
    AGR560's guide draws the same tray on a fan-bay pitch of 85.8 against this family's 85.71.
    So the tray is shared because the vendor shares it, not because a modeller reused a drawing.
    WHY THE FRU AND NOT A FAMILY PREFIX. library/components/README.md's naming rule is "use the
    vendor's model number where one exists; it is what a search will be for", and one exists.
    The `agr-` in `edgecore/agr-fan` is the exception the same page allows - a product LINE
    prefix - and its own contract says why it qualifies: its `model` is the placeholder
    'AGR Fan', because no Edgecore document prints a FRU for that tray. Of the eight Edgecore
    fans this library held ON 2026-09-19 only TWO RECORDED a real vendor ordering code in
    `model:`, this one and `edgecore/ais800-fan@1`'s `FAN-1U-1X1P`; the other six carried a
    descriptive stand-in like 'AS9726-32DB Fan Tray'.
    THAT COUNT IS OF WHAT THE CONTRACTS RECORD, NOT OF WHAT EDGECORE PUBLISHES, which this key
    said less carefully at 420 and roc-ops/Portrayal#423 corrected. The staged datasheets DO
    print a tray FRU for three of the other six - FAN-1U-1x1E for the DCS201 and the DCS202
    (edgecore/dcs201-fan@1), FAN-1U-1x1N for the DCS240 and the DCS511
    (edgecore/dcs240-fan@1) and FAN-1U-1x1J-S for the CSR310 (edgecore/csr310-fan-tray@1).
    A stand-in in `model:` is therefore evidence about the modeller, not about the vendor, and
    the corpus is what settles whether an FRU exists. What is wrong in those three is the ATTR,
    which is what a DCIM orders by and what the exports are keyed on, and not the name.
    DO NOT READ THAT COUNT AS CURRENT. It is a census of the Edgecore fan shelf ON 2026-09-19,
    the day the question was decided, and it is written down because it is what the decision
    was made on - not as a fact about the library today. The shelf had already grown to TEN
    contracts within a day of this note: edgecore/dcs520-fan@1 arrived with #422 and
    edgecore/eps-fan-fixed@1 with #427, both with no `model:` at all and no FRU in their
    documents. library/components/CATALOGUE.md is the census, and it is generated; a number
    typed into a provenance note is stale the next time somebody draws a fan.
    THE ARGUMENT DOES NOT DEPEND ON THE NUMBER, which is the point of saying this here. What it
    rests on is that a stand-in in `model:` is evidence about the modeller and not about the
    vendor, so the corpus - not the contract - settles whether an FRU exists; and that the
    three named above had one all along. roc-ops/Portrayal#426 has since put those three codes
    in `model:`.
    AND THE 1RU SIBLING WAS ASKED THIS SAME QUESTION AND KEPT ITS NAME. #423 put the rule to
    `edgecore/ais800-fan@1`, the other real ordering code here, and answered NO: `FAN-1U-1x1P`
    appears in exactly two of the seventy-two converted Edgecore documents staged for this
    library and both are AIS800-32 datasheets, so unlike this tray its name asserts nothing
    its seats contradict. See that contract's
    the-name-is-the-chassis-because-nothing-but-the-chassis-seats-it. What tips a rename is
    FALSITY - a seat the name denies - and not the bare existence of an ordering code; the
    same two AIS800-32 tables print `PSU-AC-2400W-F/-B` and `PSU-DC-2400W-F/-B`, which
    edgecore/ais800-psu-ac@1 and edgecore/ais800-psu-dc@2 carry in `model:` while keeping
    chassis-family names, and #420 left them and their 3000 W siblings alone.
    THE AIRFLOW SUFFIX IS DROPPED because -F and -B differ only in the handle colour, which is
    the `handle-finish` field and a per-configuration override, not a second part.
    THE PART DID NOT MOVE AND THE DEVICES STILL WENT MAJOR, which is the part of the cost worth
    writing down. Nothing about the tray's geometry, elements, art or size changed - the two
    devices' rendered rears are identical - so the rename is a NEW NAME AT v1 rather than a
    major of the old one, and no `ais800-64-fan/v2/` exists to retire. But a bay's `accepts:`
    and `default:` are ADDRESSING, and `devicelock` counts a composed ref that appeared or
    vanished as exactly that: both the AIS800-64D and the AIS800-64O were asked for at least a
    MAJOR and took 1.0.0 -> 2.0.0, and the AGR560 the same. That is the honest answer for a
    consumer who pinned `edgecore/ais800-64-fan@1` out of `devices.json` and would otherwise
    find it simply absent.
    roc-ops/Portrayal#407 is why the fingerprint noticed at all: the lock digests a component's
    CONTENTS, and the name is part of them.
states: [absent]
elements:
  grille: {at: [2.40, 2.60], size: [76.80, 76.40], class: rotor}
  handle: {at: [3.00, 31.50], size: [76.50, 22.00], class: handle}
  status: {at: [3.50, 3.90], size: [2.40, 2.40], class: led}
fields:
  handle-finish: {label: Handle colour, type: text, default: '#c0453f'}
relief:
  wall: '#15181b'
  features:
    - node: grille
      vent: 60
      confidence: estimated
      source: >-
        edgecore/fan-2u-1x1sn@1's own elements key - the honeycomb's extent is drawn; two
        80 mm fans in series is the only thing known about the depth behind it.
    - node: handle
      uhandle: 26
      dia: 6.0
      confidence: estimated
      source: >-
        IT GOES ON `handle`, THE WHOLE GROUP, AND THE TUBE DIAMETER IS SAID OUT LOUD. The face
        texture hides exactly the node that carries the relief attribute, and nothing else - so
        putting `uhandle` on an inner bar left the big diagonal polygon still painted on the
        tray with the real handle standing in front of it. A reviewer saw both. The node has to
        be the entire 2D handle, and its short axis is then the drawn loop's 22 mm height
        rather than the tube, which is what `dia` is for.
        A FLOATING BAR IS NOT A HANDLE, which is what `bar` builds: a tube standing off the
        face on nothing. At review the trays' handles hung in space with no legs. `uhandle`
        is the primitive that grows them - legs at the node's long-axis ends, two 90-degree
        bends and a crossbar - and it is what the other sixty-seven handles in this library
        use.
        IT IS PUT ON `handle-bar`, NOT ON `handle`. `uhandle` takes its tube diameter from the
        node's SHORT axis, and the handle group's box is 76.5 x 22, which would have built a
        22 mm tube. `handle-bar` is the crossbar's own 6 mm footprint, added to the skin under
        the polygon that draws it, so the 2D face is unchanged. The `handle-bar` idiom is
        common/psu-ac-650@3's.
        26 IS THE OUTER SURFACE, where the old `lift 9 + bar 7` reached 16. A U needs room for
        its bends - the leg is (far - r) - dia long, so at this tube 16 would have left almost
        no leg at all and the bends would have been the whole handle.
        THE PROJECTION IS STILL AN ESTIMATE and roc-ops/Portrayal#385 stays open: the FRU
        figure is an isometric render and dimensions nothing. What the family DOES fix is the
        range - the library's sixty-seven other U-handles run 22-29 mm on fan trays and 27 on
        every other Edgecore supply, the last resting on UfiSpace's published "1.06 inch".
    - node: status
      dome: 0.3
      confidence: estimated
      source: >-
        common/led-dot@1 - the library's one panel-lamp figure. Its own provenance is
        'size: estimated' and the dome carries none.
skins: [default]
