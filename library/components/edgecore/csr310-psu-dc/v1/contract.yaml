format: 1
kind: module
name: csr310-psu-dc
version: 1.0.1
class: psu
behaviour: fills
profile: networking
description: >-
  The -48 VDC power supply of the Edgecore CSR310 (AS7315-27X) - a hot-swappable
  1RU half-height module landing its feed on a three-pole barrier terminal block,
  with a pull handle down the right-hand edge and a latch at its foot. Edgecore
  part CRXT-T0T12BS; the quick start calls the bare unit CRXT-T0T12B and says
  only that part will fit.
size: {w: 54.1, h: 40.4, d: 300.0}
size-confidence: {w: photo-measured, h: photo-measured, d: estimated}
attrs:
  model: 'CRXT-T0T12BS'
  part: '131700000434A'
  power-absent: not-published
  inlet: dc-terminal
  input: '36 V - 72 V, 10 A'
provenance:
  the-model-is-the-code-edgecore-prints-and-there-are-two-of-them: >-
    THE CSR310 DATASHEET'S FIELD REPLACEMENT UNITS TABLE GIVES `CRXT - T0T12BS` |
    `131700000434A` | "AS7315-27X DC PSU (Black Housing)", the spaces around the hyphen being
    the same conversion artifact as the "F an Tray" two rows below it.
    THE GUIDES PRINT THE CODE WITHOUT THE TRAILING S, AND THAT IS NOT A TYPO. The CSR310's
    quick start and the CSR430's both instruct "Install one or two DC PSUs (part number
    CRXT-T0T12B only)", and the CSR310's Chinese text repeats it a third time - three
    occurrences, two documents, two languages, all `CRXT-T0T12B`. THE TABLE'S IS THE ONE
    RECORDED because that table is the FRU table and this attr is what a DCIM orders by, which
    is the whole reason it was moved out of `part:`. The bare code is kept in the description
    above so a search for either string finds this contract.
    WHAT THE S PROBABLY IS, SAID AS A GUESS. The fan row of the same table carries a trailing
    `-S` against a Description that reads "Fan Tray SPARE PART", and this row carries a
    trailing `S` against a guide that calls the installable unit `CRXT-T0T12B`. Two rows
    behaving the same way is a pattern and not a proof: no Edgecore document in the corpus
    defines the suffix. See edgecore/csr310-fan-tray@1's the-two-columns-were-the-wrong-way-round,
    which records the same uncertainty from the other side and, like this contract, writes
    down the string that is printed rather than the one that would be inferred.
    THE TABLE'S THREE COLUMNS ARE Model Number | Part Number | Description, AND THIS CONTRACT
    HAD THE FIRST TWO SWAPPED. Until roc-ops/Portrayal#426 `model:` held the Description
    column's prose and `part:` held the Model Number, which matters because only one of them
    is read: `spec/tools/portrayal/dcim_export.py` keys every module type on `attrs.model` and
    never looks at `attrs.part`, so this supply was published to NetBox and Nautobot under a
    name with spaces in it while the orderable code sat one line below where no consumer sees
    it. `part:` now carries the datasheet's Part Number, as the column says.
    THE FAN TRAY OF THE SAME CHASSIS HAD THE SAME INVERSION and was corrected in the same
    change; see edgecore/csr310-fan-tray@1's the-two-columns-were-the-wrong-way-round. Three
    contracts in this library use `part:` and they are these three.
  shared-with: >-
    THE CSR430 (AS7515-24X) TAKES THIS SAME SUPPLY, AND ITS OWN QUICK START SAYS SO BY PART
    NUMBER: "Install one or two DC PSUs (part number CRXT-T0T12B only)" - the same sentence,
    the same part, in a different document for a different model. The faces agree too, read
    off both datasheets' elevations against one millimetre rule: the general-warning triangle
    centres on 23.0 and 22.9, the hot-surface triangle on 40.3 and 40.8, the terminal block
    measures 29.6 and 30.0 wide with its poles on 16.7/25.9/36.5 and 16.7/25.9/35.6. Every
    pair agrees inside the reading precision of art at 8-9 px/mm.
    THE NAME RECORDS WHERE IT WAS FIRST MODELLED, not where it is used. Renaming it for the
    second device would rewrite a merged contract for cosmetics; the part number in `attrs`
    is the identity.
  no-face-extrusion: >-
        edgecore/csr310-psu-dc@1's own depth key. THE MODULE FACE CARRIES NO `out` OF ITS
        OWN, and that is deliberate: a full-face extrusion is a slab, and a slab buries
        anything that RECESSES into the face under it. On the AC sibling that is the C14
        inlet, which is a 13 mm cavity and vanished completely behind a 1.2 mm body. The
        module sits flush in its bay and the things that stand off it - the handle, the
        latch, the terminal block - say so one at a time. Same lesson as the terminal
        block's own relief, one level up.
  size: >-
    photo-measured - CSR310 datasheet front elevation, page 2 at 600 dpi scaled
    by the stated 440 mm body width to 8.1477 px/mm. The face carries two of
    these. Their left edges read 4.54 and 67.06 - a 62.52 bay pitch, confirmed
    independently by the warning triangles printed on them, whose centres are
    62.6 apart - and the right one ends at 121.14, giving 54.08. Height from the
    module's own top and bottom edges at 1.6 and 42.0.
    THE BAYS ARE NOT ADJACENT: 8.4 mm of chassis sits between them, which is why
    the pitch and the width are measured separately rather than one derived from
    the other.
  depth: >-
    estimated, and stated as the chassis depth because nothing better exists. The
    datasheet gives the box as 300 mm deep and does not dimension the module; a
    front elevation fixes nothing behind the face. Nothing in the library
    consumes it.
  terminal-block: >-
    photo-measured, and DRAWN INTO THIS MODULE rather than placed as a shared
    part. It reads 30.5 x 14.4 on an 8.7 pole pitch, which is a fourth size
    beside common/dc-terminal-27@1 (27.5, 8.2) and common/dc-terminal-24@1
    (24.6, 7.55). Those two are bolted to a faceplate and are separately
    replaceable in the model because they are separately mounted on the hardware;
    this one is part of a supply that comes out as one unit, so it belongs to the
    module's own face. Splitting it out would claim a seam the hardware does not
    have.
  markings: >-
    photo-measured - a general-warning triangle centred 12.8 from the module's
    left edge and a hot-surface triangle at 31.2, both about 10.9 across, above
    the block; the pole names are silkscreened below it as an earth symbol,
    `Input-` and `Input+`, on the pole centres.
  power: >-
    NOT PUBLISHED. The datasheet gives the chassis "Power Capacity: 300 W
    (maximum)" and the quick start "193 Watts maximum" for consumption, and
    NEITHER is an output rating for this supply. The DC input range is stated -
    36 to 72 V, 10 A - and is carried in attrs; the wattage is not, so L27 stands
    on it and the hole stays visible.
elements:
  inlet: {at: [7.0, 19.7], size: [30.5, 14.4], class: inlet}
  handle: {at: [41.5, 3.6], size: [3.5, 21.3], class: handle}
  latch: {at: [46.5, 32.0], size: [6.5, 7.4], class: latch}
relief:
  wall: '#3a3e43'
  # THE FACE ITSELF GETS NO RELIEF - see `no-face-extrusion` in provenance.
  features:
    - node: inlet
      out: 9.5
      color: '#b7bdc3'
      confidence: estimated
      source: >-
        edgecore/csr310-psu-dc@1's own terminal-block key - the block's face is
        measured and its depth is not. 9.5 is a three-pole barrier strip standing
        off a supply's faceplate, matched to common/dc-terminal-27@1's estimate.
    - node: handle
      out: 8.0
      color: '#c3c9cf'
      confidence: estimated
      source: >-
        edgecore/csr310-psu-dc@1's own depth key - a pull handle deep enough for
        fingers. Read as a handle from the elevation and from the quick start's
        three-quarter view of the module being withdrawn; the projection is not
        dimensioned anywhere.
    - node: latch
      out: 4.0
      color: '#8a9099'
      confidence: estimated
      source: >-
        edgecore/csr310-psu-dc@1's own depth key - see `handle`.
skins: [default]
