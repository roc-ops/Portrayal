parts:
  - {ref: std/saf-d-grid@1, id: inlet, at: [7.00, 29.60]}
relief:
  wall: '#3a3e43'
  features:
    - node: vent
      vent: 14
      confidence: estimated
      source: >-
        The guard is open - the photograph shows wiring through it - but no document gives
        a depth. 14 matches the vent depth this library gives other Edgecore supply guards.
    - node: inlet-well
      pocket: 2.6
      confidence: estimated
      source: >-
        The Saf-D-Grid sits in a recess whose walls the photograph shades. How deep is not
        stated anywhere; 2.6 puts the connector's flange level with the module face, which
        is what the photograph shows.
    - node: handle
      bar: 3.1
      confidence: estimated
      source: >-
        A ROD LYING DIAGONALLY ACROSS THE VENT, and `bar` rather than `uhandle` because it
        is not a U: the photograph shows a single straight rod with a short return at its
        inboard end, anchored to the module at both ends and standing off the face along
        its whole length, which is exactly what `bar` builds. The AIS800 supplies' handles
        are U-shaped and were corrected to `uhandle` because `bar` left them standing on
        nothing; this one is genuinely a bar and does not have that problem.
        HOW FAR IT STANDS OFF IS NOT DIMENSIONED. 3.1 is the rod's own drawn thickness.
    - node: latch
      out: 1.2
      confidence: estimated
      source: 'As the shell family''s supply latches - drawn, not dimensioned.'
