format: 1
kind: module
name: ais800-64-fan
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  A rear fan module of the Edgecore AIS800-64D and AIS800-64O - a near-square 2RU tray,
  honeycomb across its whole face, one 80 mm rotor showing through the mesh, a wide coloured
  pull bar sweeping across its middle with the release button set into the bar, and one
  unlabelled lens at its top left. FOUR fill the chassis, each carrying TWO fans in series
  behind one grille, which is why the vendor's "8 fans total with 7+1 redundancy" counts
  twice what this library's bays do.
size: {w: 81.6, h: 81.2}
size-confidence: {w: photo-measured, h: photo-measured}
attrs:
  model: 'FAN-2U-1x1SN'
  power-absent: not-published
  airflow: front-to-back
provenance:
  size: >-
    photo-measured on the AIS800-64D quick start guide, page 1 Overview REAR elevation,
    rendered from the PDF page at 600 dpi and scaled by the stated 440 mm body width to
    5.0636 px/mm; the face is isotropic to 0.3% against its 87 mm height. The datasheet's
    rear photograph (page 2, 3.67 px/mm native) was scanned the same way and agrees.
    THE RAILS FIX THE PITCH AND THE WIDTH. Vertical-edge scans over the fan block find the
    rails between trays at 176.16/180.50, 262.06/266.01 and 347.58/351.92 on the drawing and
    176.0/180.24 and 261.43/265.67 on the photograph: a 4.1-4.3 mm rail on an 85.71 mm pitch
    (85.43 on the photograph), which leaves 81.6 for the tray face. Tray 1's own left frame
    reads 94.25 on the photograph and 94.8 by pitch from the rails on the drawing; tray 4's
    right frame at 433.1-433.5 closes against the chassis frame at 437.4.
    THE HEIGHT: horizontal seams at 4.94 and about 86.1 on the drawing bound the block, and
    the photograph's honeycomb runs y 7-84 inside a frame that starts at 4.5; 81.2 is the
    frame-to-frame figure and the tray is 0.4 mm short of square.
  the-handle-is-a-swept-bar-with-the-button-in-it: >-
    THE GUIDE SAYS "Pull the handle release latch" and the photograph shows what that means:
    a red bar about 16 mm thick running the full width of the tray, its left end at y 36-52
    and its right end at y 42-58 in face terms (a 6 mm sweep across 77 mm), with a small
    square button set into the bar's centre at (135.5, 47) on tray 1 - the release latch.
    The bar is drawn as that parallelogram in the skin; its element is the axis-aligned
    footprint, and its relief is the family's `bar` + `lift` figure, which roc-ops/Portrayal
    #385 already records as unsourced across this line's trays.
  the-lens: >-
    ONE ROUND LENS AT THE TOP LEFT OF EVERY TRAY, face (99.5, 10.0) on tray 1 - a bright dot
    2 mm across on the photograph and a white dot on the drawing. Neither document names
    it. It is drawn as a lamp with the off/on default and no invented legend; see the
    device's module-lamp-legend gap.
  the-grille-is-drawn-light-because-the-holes-are-the-pattern: >-
    THE MESH READS AS A SILVER WEB WITH BLACK HOLES on the datasheet's rear photograph, not as
    a black panel. The first draft of this skin put the hex pattern's dark cells on a dark
    backing rect and the whole tray came out flat black - the vent-field-needs-a-backing-rect
    lesson in its other direction: panel pattern decor paints only its HOLES, so the webbing
    between them is whatever is underneath. The backing is the web and is drawn in the
    photograph's own mid grey.
  two-fans-one-grille: >-
    The datasheet twice says "4 hot-swappable fan modules (2 fans per module), 8 fans total
    with 7+1 redundancy". One rotor is visible through the mesh - the photograph shows one
    hub, about 66 mm across - and the second sits behind it in the same tray. The bay count
    is FOUR and the fan count EIGHT; the device's fans group says which of the two the
    vendor's 7+1 counts.
  power: >-
    NOT PUBLISHED. Neither document gives a per-tray figure; the datasheet's ordering table
    names FAN-2U-1x1SN-F and -B with no rating.
  airflow-colour-convention: >-
    The datasheet photographs both builds on one page - RED bars front-to-back, BLUE bars
    back-to-front - and pairs FAN-2U-1x1SN-F with front-to-back and -B with back-to-front.
    The bar fill is a default overridden per configuration. See roc-ops/Portrayal#277.
