    - node: handle
      uhandle: 27
      dia: 8.49
      confidence: estimated
      source: >-
        IT GOES ON `handle`, THE WHOLE GROUP, as on the AC supply and the tray. Here the group
        IS close to the tube - the loop rect is 8.49 x 34.66 - but the attribute still belongs
        on the group rather than on the rect inside it, because that is the node whose art the
        face texture drops. `dia` states the 8.49 explicitly so the three parts read the same
        way.
        MATCHED TO edgecore/ais800-64-psu-ac@1, which took the same correction: `bar` built a
        tube standing on nothing and both supplies' handles hung in space at review. `uhandle`
        grows the legs, and here they run top and bottom because this loop stands UP the face
        rather than across it - the Connect Power figure draws it at x 9.47-17.96, y 3.48-38.14.
        The node is already the tube's own footprint at 8.49 x 34.66, so it only needed naming.
        27 MATCHES EVERY OTHER EDGECORE SUPPLY. It also has to clear a floor: a U's leg is
        (far - r) - dia, so on an 8.49 mm tube anything under about 13 leaves no leg at all,
        and the 12 this carried before was under it.
        THE PROJECTION IS STILL AN ESTIMATE and roc-ops/Portrayal#385 stays open: the FRU
        figure is an isometric render and dimensions nothing. What the family DOES fix is the
        range - the library's sixty-seven other U-handles run 22-29 mm on fan trays and 27 on
        every other Edgecore supply, the last resting on UfiSpace's published "1.06 inch".
    - node: terminal-pocket
      pocket: 3.2
      confidence: estimated
      source: 'edgecore/ais800-psu-dc@1 - the same vendor''s DC terminal recess, also estimated.'
    # THE SIX BORES HAD NO RELIEF AT ALL AND SO EXISTED ONLY IN 2D. They were drawn as six
    # unnamed <g> inside `terminal-bores`, and a relief feature matches a SKIN NODE BY ID -
    # so nothing resolved, nothing was extruded, and 3D showed the pocket as a flat plate
    # with the whole connector missing. The bores and their studs now carry ids of their own.
    # This is the general trap: art in a skin is invisible to relief unless it is NAMED, and
    # a component whose `relief.features` list looks full can still be missing its main
    # feature. Counting the emitted `data-z-*` nodes against what the face draws catches it.
    - node: bore-1
      sink: 3.0
      confidence: estimated
      source: >-
        edgecore/ais800-64-psu-dc@1's own Connect Power figure - the bores are drawn as round
        recesses with a stud down each one and the figure shades their side walls, so they are
        holes rather than printing. HOW DEEP IS NOT STATED by either document, and the connector
        is not even named - see the device's dc-connector-identity gap. 3.0 below the block's
        own 3.2 pocket floor puts the stud head level with the block face, which is what the
        figure shows.
