      fill="#8a9097" stroke="#5c6167" stroke-width="0.35"/>
    <!-- THE POCKET IS A GROUP, NOT A BARE RECT, AND THE BORES LIVE INSIDE IT. relief.js
         collects a cavity's `sink`/`top` features with querySelectorAll on the cavity node,
         so a feature that is a SIBLING of the pocket rather than a DESCENDANT of it resolves
         to nothing and never gets built. The bores were siblings, which is why the terminal
         block was flat in 3D while every one of its parts was present in 2D. -->
    <g id="terminal-pocket">
      <rect x="24.19" y="9.16" width="26.79" height="22.19" rx="1.20" fill="#6e747b"/>
      <path d="M 28.68 16.57 h 22.27 v 6.40 h -22.27 z" fill="#1b1f23"/>
