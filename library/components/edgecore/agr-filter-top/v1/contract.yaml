format: 1
kind: module
name: agr-filter-top
version: 1.0.0
class: filter
behaviour: fills
profile: networking
description: >-
  Removable top air filter for the Edgecore AGR400 (AS7946-30XB) and AGR420
  (AS7946-74XKSB). A dark metal frame with open sections and reticulated foam
  behind them. It bolts onto the OUTSIDE of the faceplate with captive thumb
  screws - it does not slide into a bay - so it is placed, not seated. Its outline is not a plain rectangle - it drops deeper over each QSFP-DD block, which Jason describes as two nubs and the photographs confirm.
attrs: {model: 'AGR Air Filter (top)'}
size: {w: 353.5, h: 17.2, d: 12.0}
provenance:
  extent: 'drawing - spans the same 353.5 mm as the bottom filter, which its right
    thumb screw at 347.4 requires. Measured off the front panel figures'
  profile: 'drawing - NOT a rectangle, and MEASURED rather than estimated. Its bottom
    edge runs at panel y 26.2 to x 50.0, steps up to 22.4, then up again to 21.0 past
    x 305.4 - rises of 3.6 and 1.6 mm from a 17.2 full depth. An earlier pass guessed
    a quarter and an eighth of an inch and drew the steps roughly twice too deep'
  notch: 'drawing - the first foam cell is an L. It runs full depth to x 50.0, which is
    the right-hand end of the ports 2/3 column, and continues to 55.4 at the shallower
    depth. The step and the notch are the SAME feature: the frame hugs the cut-out and
    carries on at the new level, so there is no square hole to paint'
  construction: 'photo - the QSG figure resolves the filter only as a speckled
    band. The metal frame, the open sections with foam behind them and the
    captive slotted screws are read off straight-on photographs of a real unit'
  screws: 'drawing - three captive thumb screws, 8.1 mm across, measured off the
    datasheet render at 8.450 px/mm. Jason places them by port: left of ports 0/1,
    below ports 12/13 on the BOTTOM filter and between 14/15 and 16/17 on the TOP
    one, and right of ports 28/29. The frame web is wider at each screw'
  sections: 'Jason - the bottom filter has 6.5 foam cells, three between the left
    and middle screws and three and a half between the middle and right. The top
    filter has 7, all rectangular except the first, which is notched by a square
    cut out of its bottom right where the frame steps down'
  removable: datasheet - the QSG has an Air Filter Replacement procedure, so it
    is a serviceable part rather than chassis decoration
  depth: estimated - not given in either document
relief:
  wall: '#4a4f55'
  features:
    # bolted onto the OUTSIDE of the faceplate, so each stepped segment stands
    # proud. `out` uses an element's bounding rect and textures the slab from
    # that element alone, so it must sit on a GROUP holding the frame, its foam
    # and its screws - on a stepped path it gave a rectangle with nothing in it.
    - node: seg-a
      out: 3.0
      confidence: estimated
      source: >-
        edgecore/agr-filter-top@1's own depth key: 'estimated - not given in either
        document'. That key is about the filter's 12.0 size.d; its proudness off the panel
        has no source at all. The frame and foam EXTENTS are drawing-measured off the
        datasheet front figure and are not in doubt - only how far the assembly stands off
        the face.
    - node: seg-b
      out: 3.0
      confidence: estimated
      source: >-
        edgecore/agr-filter-top@1's own depth key: 'estimated - not given in either
        document'. That key is about the filter's 12.0 size.d; its proudness off the panel
        has no source at all. The frame and foam EXTENTS are drawing-measured off the
        datasheet front figure and are not in doubt - only how far the assembly stands off
        the face.
    - node: seg-c
      out: 3.0
      confidence: estimated
      source: >-
        edgecore/agr-filter-top@1's own depth key: 'estimated - not given in either
        document'. That key is about the filter's 12.0 size.d; its proudness off the panel
        has no source at all. The frame and foam EXTENTS are drawing-measured off the
        datasheet front figure and are not in doubt - only how far the assembly stands off
        the face.
