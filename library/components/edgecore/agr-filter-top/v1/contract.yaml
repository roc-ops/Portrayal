format: 1
kind: module
name: agr-filter-top
version: 1.0.0
class: filter
profile: networking
description: >-
  Removable top air filter for the Edgecore AGR400 (AS7946-30XB) and AGR420
  (AS7946-74XKSB). A dark metal frame with open sections and reticulated foam
  behind them, held by captive slotted screws. Its outline is not a plain rectangle - it drops deeper over each QSFP-DD block, which Jason describes as two nubs and the photographs confirm.
attrs: {model: 'AGR Air Filter (top)'}
size: {w: 298.7, h: 18.0, d: 12.0}
provenance:
  extent: 'drawing - measured off the orthographic front panel figure in the
    AS7946-30XB Quick Start Guide at 5.109 px/mm'
  construction: 'photo - the QSG figure resolves the filter only as a speckled
    band. The metal frame, the open sections with foam behind them and the
    captive slotted screws are read off straight-on photographs of a real unit'
  sections: 'INFERRED - section count and spacing are drawn to match the
    photograph''s appearance, not counted from a measurable source. Re-measure
    against a square-on macro shot before this device goes to verified'
  removable: datasheet - the QSG has an Air Filter Replacement procedure, so it
    is a serviceable part rather than chassis decoration
  depth: estimated - not given in either document
relief:
  wall: '#4a4f55'
skins: [default]
