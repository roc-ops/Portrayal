format: 1
kind: module
name: ais800-psu-dc
version: 2.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 2400 W DC power supply of the Edgecore AIS800-32D and AIS800-32O - a bright CRPS-style
  module with a coloured bail stowed across its top, a ground stud at its top left, a two-pole
  screw-down barrier block silkscreened -40 - -72 and RTN across its middle, a latticed grille
  and one unlabelled lamp at its right, and a small release tab at the bottom right. It shares
  the AIS800's bay with edgecore/ais800-psu-ac@1 and shares none of that module's face.
size: {w: 53.7, h: 40.6}
size-confidence: {w: photo-measured, h: photo-measured}
attrs:
  model: 'PSU-DC-2400W'
  power-output-w: 2400
  input: dc
  inlet: dc-terminal
provenance:
  size: >-
    photo-measured, AND FROM A DIFFERENT FIGURE TO THE AC SUPPLY'S. The rear elevation on page 1
    draws the AC build, so this module's face is read off the quick start guide's Connect Power
    figure on page 3, rendered from the PDF page at 600 dpi.
    THE FIGURE'S OWN PROPORTIONS ARE THE CHECK THAT IT IS THE SAME BAY. Its module box measures
    785 x 595 px, an aspect of 1.319, against the 53.7 x 40.6 that the rear elevation measures
    for the AC supply - 1.323. Two independent figures at different scales agreeing to 0.3% is
    what licenses carrying the AC module's measured envelope onto this face rather than
    re-deriving it from a figure that carries no dimension of its own.
    So the ENVELOPE is the rear elevation's, at photo-measured, and everything INSIDE it is
    this figure's, scaled by that envelope to 14.62 px/mm.
  vent-field: >-
    photo-measured (#397), MODULE EDGE TO MODULE EDGE IN ONE FRAME, as the AC supply's lattice
    was corrected in review. On the Connect Power figure at 600 dpi the module's top and bottom
    edges read rows 110 and 688 of the figure's crop, 578 px for the 40.6 the envelope carries,
    so 14.24 px/mm down the face on the 600 dpi render, which upsamples an embedded image
    whose native resolution is 9.51 px/mm, so every figure here is good to about 0.1 mm and no better; the lattice plate's top edge is the line the terminal housing's
    top shares, row 303, and its bottom edge row 637, where the plate meets the dark band the
    release latch sits in. That is y 13.56 to 37.02, 23.46 tall. 1.x drew it 15.01 to 35.13, 20.12
    tall, about 1.5 short at the top and 1.9 at the bottom. The holes themselves run rows 343 to
    609, 16.4 to 35.1, inside the plate's margin, which the pattern does not reproduce. The x
    extent was not re-read and is unchanged. Read on the same frame, the terminal housing's top
    and bottom are 13.6 and 35.1 against the 14.32 and 35.47 drawn: the bottom agrees, and the
    top is the next figure to revisit.
  power: >-
    2400 W, FROM THE DATASHEET, AND THE INPUT FROM THE QUICK START GUIDE. The datasheet's
    feature list reads "Hot-swappable, load-sharing, redundant 2400 W AC/DC PSUs" - one figure
    covering both builds - and the quick start guide's Hardware Specifications table gives
    "DC Input: -48 - -60 VDC, 53 A max. per PS". The ordering table names the FRU as
    PSU-DC-2400W-F and -B.
    THE TWO DOCUMENTS GIVE DIFFERENT RANGES AND BOTH ARE RECORDED. The specifications table
    says -48 to -60 VDC; the Connect Power section, the terminal's own silkscreen and the wire
    note all say -40 to -72 VDC. The wider range is the connector's marking and the narrower is
    the system's rating, which is why the legend below prints -40 - -72 and the attr does not.
  the-terminal-is-two-poles-plus-a-separate-ground: >-
    AND IT IS DRAWN RATHER THAN COMPOSED, DELIBERATELY. The figure's callouts read "1. Ground,
    2. -40 - -72 VDC, 3. DC return" against a hex-head stud at the top left and two large
    cross-head screws in one recessed barrier housing, with -40 - -72 and RTN silkscreened on a
    light strip beneath them.
    NO PART IN THIS LIBRARY FITS. common/dc-terminal-24@1 and common/dc-terminal-27@1 are both
    THREE-pole blocks with a hinged clear cover, 24.6 and 27.5 mm wide on 7.57 and 8.36 mm
    screw pitches. This block is two-pole, open, 35.9 mm wide on a 15.4 mm screw pitch, and its
    ground is a separate stud outside the housing. Seating either would assert a pole that is
    not there and a cover that is not drawn, so the elements below carry the geometry and a
    future common/dc-terminal-36 can replace them.
    A SECOND, FOUR-PIN CONNECTOR IS SHOWN AND IS NOT THIS PART. The same page draws a second
    figure - "1. -40 - -72 VDC, 2. DC return, 3. Signal +, 4. Signal -" - on a blue-cased
    assembly. That is the DC converter's mating connector, not this module's face, and nothing
    of it is modelled here.
  the-bail-stows-across-the-top-on-this-face: >-
    AND THIS IS THE ONLY FIGURE IN EITHER GUIDE THAT SHOWS A STOWED BAIL. It lies flat along the
    module's top edge from x 13.34 to 51.30 by y 2.39 to 8.87, with a row of vent slots visible
    below it.
    IT IS NOT WHERE THE AC SUPPLY'S BAIL IS. edgecore/ais800-psu-ac@1's hinges about a vertical
    axis down its left edge, because that face spends its left half on a lattice and its right
    half on a Saf-D-Grid inlet and has no room across the top. This face spends its left half on
    a terminal block and has no room down its left edge. The two modules share a bay and a
    rating and not a handle, and neither figure was carried onto the other.
  the-lamp-at-the-right-and-the-round-it-was-removed-for: >-
    ONE ROUND LENS IN THE LATTICE'S TOP LEFT CORNER, at module x 45.1-51.3 by y 15.4-20.8 in the
    Connect Power figure - a dark rim with a bright centre. It was drawn, then REMOVED for a round
    on the reasoning that carried on the AC sibling, whose identical ring is the deployed bail's
    root seen end-on. That reasoning does not transfer: this face's bail is stowed along the TOP,
    y 2.4-8.9, and this feature sits 12 mm below it at mid-height, where no part of the bail is.
    The reviewer caught the removal. It is a lamp, drawn with the library's default off/on
    states; NEITHER STAGED DOCUMENT NAMES IT, so its legend is the device's gap.
  airflow-colour-convention: >-
    THE GUIDE SHOWS IT RATHER THAN STATING IT - red bails front-to-back, blue back-to-front in
    the Airflow Reversal figures - and the ordering table pairs PSU-DC-2400W-F with
    front-to-back and -B with back-to-front. The bail fill is a default overridden per
    configuration. See roc-ops/Portrayal#277.
  the-terminal-is-a-frame-of-one-thickness-with-a-screw-centred-in-each-pocket: >-
    AND THE FIRST DRAWING HAD FIVE THICKNESSES AND TWO OFF-CENTRE SCREWS. The block is a
    barrier frame - a bar across the top, a bar across the bottom, and a wall at the left,
    the centre and the right, all the same 3.0 mm - with two recessed lug pockets being
    whatever the frame leaves, 13.45 x 15.15 each, and one screw dead-centre in each pocket.
    THE GROUND IS A HEX HEAD, 7.52 across flats, with a cross drive - the figure draws the flats
    plainly and a first cut drew it round. THE POLE LEGENDS SIT UNDER THEIR POCKETS' CENTRES,
    10.76 and 27.21, and moved with the pockets when the frame was squared.
    It was drawn with 1.3 / 3.0 / 1.2 mm walls, 1.3 / 3.1 mm bars, and screws 0.7 and 2.1 mm
    off their pockets' centres, which read as wrong before it read as why. The frame's
    thickness is the centre barrier's; the pockets are what sink in 3D, not the block.
  the-pole-legend-is-at-the-very-bottom-of-the-face: >-
    AND IT WAS FIRST DRAWN ON A STRIP TUCKED UNDER THE TERMINAL BLOCK, which is not where the
    figure puts it. The light strip carrying -40 - -72 and RTN runs along the module's BOTTOM
    EDGE, module-relative y 35.8 to 39.9, touching the frame; the terminal housing ends at 35.5
    and the strip begins where it stops. The legend is also larger than it was drawn.
  elements: >-
    MEASURED ON THE PAGE 3 FIGURE at 14.62 px/mm, which is a good deal coarser than the rear
    elevation's 5.07 px/mm is fine - but it is a purpose-drawn detail rather than a
    thumbnail, and the callout numbers land on the features they name.
    EVERY RELIEF DEPTH IS ESTIMATED. The figure fixes where things are on the face and never
    how far they stand off it.
  seats: >-
    estimated - each terminal screw is the library's common/terminal-screw-34@1, a screw head 3.4
    across (that part's own size is an estimate), standing at the centre of the disc this skin
    already draws (centres 10.76 and 27.21 across, 24.89 down; each disc is 6.84 across). It is
    not lifted: the figure shows the screw heads below the barriers, in recessed pockets (the
    `terminal-pocket` relief above sinks them 3.2, estimated) and no document says how far, so the
    seat is at the face's own level. The head is drawn smaller than the disc round it, so the
    drawing marks where a lug lands and does not show the screw. The block itself stays drawn, as
    `the-terminal-is-two-poles-plus-a-separate-ground` says; only the two screws and the ground
    are composed. The quick start guides show the two screws and give a wire size and a torque,
    and no screw head, thread or stud; the places are the skin's own.
  earth: >-
    A DECLARED STAND-IN. The AIS800-32D and AIS800-32O Quick Start Guides, "Connect Power", page
    3, the first figure, callout "1. Ground": a hex-head screw with a cross recess and a round
    washer at the top left of the supply, apart from the barrier block. It is a screw beside the
    two-screw block, not on it, so it is a ground seat a lug lands on outside the DC port, which
    keeps two poles (decided 2026-11-02). It is the library's common/ground-screw@1, a screw
    that claims no stud size, standing at the centre of the hex this skin already draws as
    `ground` (6.84 across, 8.36 down), because no document held gives this screw's thread or
    head: the part draws a round cross-head cap over the hex, and the hex stays drawn.
  poles: >-
    Edgecore AIS800-32D and AIS800-32O Quick Start Guides, "Connect Power", page 3, the first
    figure: two screws in a recessed block with -40 - -72 and RTN printed under them, "2. -40 -
    -72 VDC" on the left screw and "3. DC return" on the right one. The second figure on that
    page (a six-bore connector with a signal pair) is another module and is not read. The roles
    are the callouts': `batt` for the -40 - -72 VDC wire (spec/schemas/dc.yaml writes `batt` as
    negative (battery)) and `rtn` for DC return (it writes `rtn` as RTN and return), listed in the
    callouts' order, which the printed legend agrees with. The port states no voltage: the guides
    give two ranges (-40 - -72 and -48 - -60 VDC), a name and no nominal.
  rating: >-
    Edgecore AIS800-32D and AIS800-32O Quick Start Guides, page 4, Hardware Specifications, "DC
    Input -48 - -60 VDC, 53 A max. per PS": the one current the documents held give for this
    supply (the data sheets give 2400 W and no current), so the port states it as the supply's
    input current. The range printed with it differs from the -40 - -72 on page 3; the port
    states no voltage.
  awg: >-
    Edgecore AIS800-32D and AIS800-32O Quick Start Guides, page 3, the note under the figures:
    "#6 AWG / 13.3 mm2 90C-rated copper wire" for a -40 to -72 VDC PSU, with a torque of 2.4
    N.m. It is the one size the documents held give for this supply's DC wires, so the port
    states it.
states: [absent]
elements:
  handle: {at: [13.34, 2.39], size: [37.96, 6.48], class: handle}
  ground: {at: [3.08, 4.43], size: [7.52, 7.85], class: stud}
  vent-top: {at: [18.47, 8.87], size: [26.67, 3.75], class: vent}
  terminal: {at: [1.03, 14.32], size: [35.91, 21.15], class: terminal}
  vent-field: {at: [37.62, 13.56], size: [13.68, 23.46], class: vent}
  status: {at: [46.85, 16.75], size: [2.70, 2.70], class: led}
  latch: {at: [43.77, 35.81], size: [7.53, 4.79], class: latch}
fields:
  handle-finish: {label: Handle colour, type: text, default: '#b8322c'}
  latch-finish: {label: Latch colour, type: text, default: '#e0857f'}
relief:
  wall: '#3a3e43'
  # THE FACE ITSELF GETS NO RELIEF - a full-face `out` is a slab and a slab buries whatever is
  # recessed beneath it, which is how the CSR310's AC supply came out blank. See #364.
  features:
    - node: handle
      uhandle: 27.0
      confidence: estimated
      source: >-
        NOT SOURCED FOR THIS PART, and 27 is borrowed rather than measured. No staged document
        says how far this bail stands off the face. The nearest published figure for a
        CRPS-class supply is UfiSpace's S9510-28DC HIG - "the handle for the power supplies will
        extend outwards by 1.06 inches" - which ufispace/psu-401-ac carries at datasheet
        confidence and edgecore/ais800-psu-ac@1 borrows at estimated, exactly as here.
    - node: terminal-pocket-1
      pocket: 3.2
      confidence: estimated
      source: >-
        edgecore/ais800-psu-dc@2's own elements key. The figure draws the two lug pockets
        RECESSED behind the block's face - their side walls are visible and the screw heads
        sit below the barriers - so it is the pockets that sink and the frame around them
        that stands, which is what keeps two lugs from touching. How deep is not stated.
    - node: terminal-pocket-2
      pocket: 3.2
      confidence: estimated
      source: >-
        edgecore/ais800-psu-dc@2 - as terminal-pocket-1.
    - node: ground
      out: 2.6
      confidence: estimated
      source: >-
        common/ground-lug@1's stud, which is this library's one earthing-hardware figure and
        carries no projection of its own either.
    - node: vent-top
      vent: 24
      confidence: estimated
      source: >-
        edgecore/ais800-psu-dc@2's own elements key - the slots' extent is drawn and the depth
        of the cavity behind them is not stated.
    - node: vent-field
      vent: 24
      confidence: estimated
      source: >-
        edgecore/ais800-psu-dc@2's own elements key - the lattice's extent is drawn and the
        depth of the cavity behind it is not stated.
    - node: status
      dome: 0.3
      confidence: estimated
      source: >-
        common/led-dot@1 - the library's one panel-lamp figure. Its own provenance is
        'size: estimated' and the dome carries none.
    - node: latch
      out: 2.4
      confidence: estimated
      source: >-
        edgecore/dcs240-psu-ac@1's latch, which records the same thing: outline drawn,
        projection not stated.
parts:
  - {ref: common/terminal-screw-34@1, id: pole-batt, at: [9.06, 23.19]}
  - {ref: common/terminal-screw-34@1, id: pole-rtn, at: [25.51, 23.19]}
  - {ref: common/ground-screw@1, id: earth, at: [4.04, 5.56]}
dc:
