parts:
  - {ref: common/terminal-screw-34@1, id: pole-rtn, at: [20.6, 17.05], lift: 6.35}
  - {ref: common/terminal-screw-34@1, id: pole-batt, at: [34.0, 17.05], lift: 6.35}
  - {ref: common/ground-screw@1, id: earth, at: [45.6, 1.6]}
dc:
  ports:
    - id: input
      direction: input
      rating-a: 40
      awg: [8]
      poles:
        - {role: rtn, slot: pole-rtn}
        - {role: batt, slot: pole-batt}
      source: {poles: poles, rating-a: rating, awg: awg}
skins: [default]
