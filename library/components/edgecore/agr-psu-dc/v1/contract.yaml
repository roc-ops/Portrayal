format: 1
kind: module
name: agr-psu-dc
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  DC-DC hot-swappable PSU for the Edgecore AGR400 (AS7946-30XB) and AGR420
  (AS7946-74XKSB). Black bail handle on the left, a two-post -48 V terminal
  block in the middle and a red latch on the right. This is the unit we
  photographed.
attrs: {power-absent: not-published, model: 'AGR PSU (DC)', input: dc,
  input-note: '-40 to -75 VDC, 40 A max per PSU', inlet: dc-terminal}
size: {w: 60.1, h: 37.6, d: 360.7}
provenance:
  inlet: >-
    transcribed from this contract's own description: 'a two-post -48 V terminal block in
    the middle'. Nothing new was measured.
  power: >-
    NOT PUBLISHED. Searched the whole Edgecore corpus held - the AGR400 and AGR420
    datasheets (AGR400-AS7946-30XB-DS-R05, AGR420-AS7946-74XKSB-DS-R03) and both quick-start
    guides (AS7946-30XB QSG R04, AS7946-74XKSB QSG R03). What the datasheets give is BOX
    power, not per-part: 'Power Consumption - Max: 527 W, Typical: 186 W' for the AGR400 and
    'Max: 692 W, Typical: 201 W' for the AGR420. Those belong to the device, not to this
    part. The only per-part figure for the supplies is AC INPUT CURRENT - '100V-120V, 12 A,
    per PS' and '200V-240V, 7.5 A, per PS' - and an output rating cannot be had from an
    input current without an efficiency the datasheet also does not give. The claim is
    scoped to the documents named and to nothing else: if an Edgecore hardware guide is ever
    staged, look there first, because that is where this figure lives for every other vendor
    in the library.
  terminal: 'photo - IMG_6789 and IMG_6796 at 5x. A BLACK plastic housing, not the
    grey an earlier pass drew, with three vertical walls forming two open-ended
    lanes. Each lane takes a bolt with a hex nut and a star washer. The maintainer: the
    walls stand about 1/2 inch proud (12.7mm) and the bolts about 1/4 inch (6.35).
    The lanes are centred in the housing - they were drawn off to the left'
  size: 'drawing + photo - 60.1 x 37.6 measured off the rear panel figure; the
    arrangement (bail handle LEFT, input centre, red latch RIGHT) is read off
    photographs of the real unit'
  depth: 'measured - 360.7 mm, read off a tape measure lying beside the module in
    IMG_6795 at 100 px/inch'
  redundancy: datasheet - "Hot-swappable, load-sharing, and 1+1 redundant
    DC-DC/AC-DC PSUs"
  shared: the maintainer - both AGR platforms use the same PSUs and fans
  variants: 'photo - the unit in our hands is DC (IMG_6789 and IMG_6793-6800).
    Edgecore''s stock render AS7946-30XB-B shows the AC unit. Both exist. They
    were one component with two skins until the AC inlet needed to be a real
    standard part, which a skin cannot carry - so they are now two components
    sharing a shell and its body art'
  seats: >-
    estimated - each terminal screw is the library's common/terminal-screw-34@1, a screw head 3.4
    across (that part's own size is an estimate), standing at the centre of the bolt this skin
    draws (`stud-pos` at 22.30 across and `stud-neg` at 35.70, both 18.75 down) and lifted 6.35
    mm, the bolts' own measured height (the `stud-pos` and `stud-neg` relief below). The head
    is drawn on the nut and the nut is not redrawn. The quick start guides show the two screws
    between the barriers with a ring lug for each and give no screw head, thread or stud; the
    places are the skin's own, which were read off photographs of the real unit.
  earth: >-
    A DECLARED STAND-IN, and its place is estimated. The AS7946-30XB (R04) and AS7946-74XKSB (R03)
    Quick Start Guides, "Connect Power", page 3, the figure above the callouts, show a cross-head
    screw with a star washer on the supply's rear panel at the upper right, above the red latch,
    and call it "4. Use a 8 AWG green/yellow ground wire to ground the DC PSU." It is a screw
    beside the two-screw terminal block, not on it, so it is a ground seat a lug lands on
    outside the DC port, which keeps two poles (decided 2026-11-02). It is the library's
    common/ground-screw@1, a screw that claims no stud size, because no document held gives
    this screw's thread or head. It stands where the figure puts it, over the corner screw this
    skin draws at the upper right (`screw-b`, 47.2 across, 4.4 down) and 1.2 mm to its right
    (48.4 across, 4.4 down) so that its washer clears the terminal block; the skin's other
    corner screw (`screw-a`, upper left) is named by no guide and gets no part. The figure is
    an illustration with no scale, so the place is an estimate.
  poles: >-
    Edgecore AS7946-30XB Quick Start Guide (R04) and AS7946-74XKSB Quick Start Guide (R03),
    "Connect Power", page 3, the figure above the callouts: two screws between three black
    barriers, "1. Use the ring lugs included with the DC PSU.", "2. DC return" on the left
    screw and "3. -40 - -75 VDC" on the right one. This skin prints + over its left bolt and -
    over its right one, which agrees. The roles are the callouts': `rtn` for DC return
    (spec/schemas/dc.yaml writes `rtn` as RTN and return) and `batt` for the -40 - -75 VDC wire
    (it writes `batt` as negative (battery)), listed in the callouts' order. The port states no
    voltage: the guides give a range and call the supply "48 VDC", a name and no nominal.
  rating: >-
    Edgecore AS7946-30XB Quick Start Guide (R04) and AS7946-74XKSB Quick Start Guide (R03),
    page 4, "48 VDC PSU", "DC Input -40 - -75 VDC, 40 A max", and both data sheets, page 3,
    "DC Input: -40 - -75V, 40 A, per PS": one current, the same in all four, so the port states
    it as the supply's input current.
  awg: >-
    Edgecore AS7946-30XB Quick Start Guide (R04) and AS7946-74XKSB Quick Start Guide (R03), page
    3, the note above the figure: "Use # 8 AWG/ 6 mm2 copper wire (for a -40 to -75 VDC PSU)".
    It is the one size the documents held give for this supply's DC wires, so the port states it.
body:
  depth: 360.7
  color: '#b9bec4'
relief:
  wall: '#4a4f55'
  features:
    # These sit on the GROUP, not on the bar inside it. A raised node is taken
    # off the flat plate, but a sibling that is NOT raised stays behind and
    # reads as a coloured shadow under the handle.
    - node: handle
      uhandle: 9.0
      confidence: estimated
      source: >-
        edgecore/agr-psu-dc@1 itself - unsourced. This contract's face key covers the
        ARRANGEMENT only ('bail handle LEFT, input centre, red latch RIGHT ... read off
        photographs') and its depth key's 'measured - 360.7 mm' is the MODULE's depth off a
        tape measure, not this feature's. The handle 9.0 and latch 4.2 are the same two
        numbers on the AC and DC units because they share one shell, so they are one
        estimate written twice.
    - node: latch
      out: 4.2
      confidence: estimated
      source: >-
        edgecore/agr-psu-dc@1 itself - unsourced. This contract's face key covers the
        ARRANGEMENT only ('bail handle LEFT, input centre, red latch RIGHT ... read off
        photographs') and its depth key's 'measured - 360.7 mm' is the MODULE's depth off a
        tape measure, not this feature's. The handle 9.0 and latch 4.2 are the same two
        numbers on the AC and DC units because they share one shell, so they are one
        estimate written twice.
    # The terminal is a BLACK housing with three walls making two open-ended
    # lanes, so cables drop in from above (PSU0) or below (PSU1) onto a bolt.
    # Each wall carries its own `out` - one feature on the group would use the
    # group's bounding rect and fill the lanes back in.
    - node: wall-l
      out: 12.7
      confidence: measured
      source: >-
        edgecore/agr-psu-dc@1's own terminal key - the owner, on the real unit at 5x in
        IMG_6789 and IMG_6796: 'the walls stand about 1/2 inch proud (12.7mm) and the bolts
        about 1/4 inch (6.35)'. THIS IS ONE OF THE VERY FEW GENUINELY MEASURED RELIEF
        MAGNITUDES IN THE LIBRARY - a person looking at hardware - which is why several
        vendors' features point here. Note the reading is to the nearest quarter inch and
        the word is 'about'.
    - node: wall-m
      out: 12.7
      confidence: measured
      source: >-
        edgecore/agr-psu-dc@1's own terminal key - the owner, on the real unit at 5x in
        IMG_6789 and IMG_6796: 'the walls stand about 1/2 inch proud (12.7mm) and the bolts
        about 1/4 inch (6.35)'. THIS IS ONE OF THE VERY FEW GENUINELY MEASURED RELIEF
        MAGNITUDES IN THE LIBRARY - a person looking at hardware - which is why several
        vendors' features point here. Note the reading is to the nearest quarter inch and
        the word is 'about'.
    - node: wall-r
      out: 12.7
      confidence: measured
      source: >-
        edgecore/agr-psu-dc@1's own terminal key - the owner, on the real unit at 5x in
        IMG_6789 and IMG_6796: 'the walls stand about 1/2 inch proud (12.7mm) and the bolts
        about 1/4 inch (6.35)'. THIS IS ONE OF THE VERY FEW GENUINELY MEASURED RELIEF
        MAGNITUDES IN THE LIBRARY - a person looking at hardware - which is why several
        vendors' features point here. Note the reading is to the nearest quarter inch and
        the word is 'about'.
    # The bolt is a stack, not one blob: a threaded stud standing 1/4 inch proud,
    # with the star washer and then the nut as their own solids up its length.
    # `cyl` runs lift..lift+cyl and takes its radius from the node, so each of the
    # three has to be its own node - grouped, they became a single box slab with
    # all three painted flat on its top.
    - node: stud-pos
      cyl: 6.35
      thread: 1.0
      confidence: measured
      source: >-
        edgecore/agr-psu-dc@1's own terminal key - the owner, on the real unit at 5x in
        IMG_6789 and IMG_6796: 'the walls stand about 1/2 inch proud (12.7mm) and the bolts
        about 1/4 inch (6.35)'. THIS IS ONE OF THE VERY FEW GENUINELY MEASURED RELIEF
        MAGNITUDES IN THE LIBRARY - a person looking at hardware - which is why several
        vendors' features point here. Note the reading is to the nearest quarter inch and
        the word is 'about'.
    - node: washer-pos
      cyl: 0.7
      lift: 2.4
      confidence: estimated
      source: >-
        DERIVED, NOT MEASURED, and the distinction matters because this feature sits beside
        two that ARE measured. The owner's reading in the terminal key covers the WALLS
        (12.7) and the BOLTS (6.35) and nothing else; it says only that 'each lane takes a
        bolt with a hex nut and a star washer'. The washer and nut thicknesses and their
        lifts are chosen to stack plausibly inside the measured 6.35 stud, so they are
        estimates standing on a measurement rather than measurements. ANYONE CITING THIS
        NODE AS 'MEASURED OFF REAL HARDWARE' IS CITING THE WALLS, NOT THE NUT.
    - node: nut-pos
      cyl: 2.2
      lift: 3.1
      confidence: estimated
      source: >-
        DERIVED, NOT MEASURED, and the distinction matters because this feature sits beside
        two that ARE measured. The owner's reading in the terminal key covers the WALLS
        (12.7) and the BOLTS (6.35) and nothing else; it says only that 'each lane takes a
        bolt with a hex nut and a star washer'. The washer and nut thicknesses and their
        lifts are chosen to stack plausibly inside the measured 6.35 stud, so they are
        estimates standing on a measurement rather than measurements. ANYONE CITING THIS
        NODE AS 'MEASURED OFF REAL HARDWARE' IS CITING THE WALLS, NOT THE NUT.
    - node: stud-neg
      cyl: 6.35
      thread: 1.0
      confidence: measured
      source: >-
        edgecore/agr-psu-dc@1's own terminal key - the owner, on the real unit at 5x in
        IMG_6789 and IMG_6796: 'the walls stand about 1/2 inch proud (12.7mm) and the bolts
        about 1/4 inch (6.35)'. THIS IS ONE OF THE VERY FEW GENUINELY MEASURED RELIEF
        MAGNITUDES IN THE LIBRARY - a person looking at hardware - which is why several
        vendors' features point here. Note the reading is to the nearest quarter inch and
        the word is 'about'.
    - node: washer-neg
      cyl: 0.7
      lift: 2.4
      confidence: estimated
      source: >-
        DERIVED, NOT MEASURED, and the distinction matters because this feature sits beside
        two that ARE measured. The owner's reading in the terminal key covers the WALLS
        (12.7) and the BOLTS (6.35) and nothing else; it says only that 'each lane takes a
        bolt with a hex nut and a star washer'. The washer and nut thicknesses and their
        lifts are chosen to stack plausibly inside the measured 6.35 stud, so they are
        estimates standing on a measurement rather than measurements. ANYONE CITING THIS
        NODE AS 'MEASURED OFF REAL HARDWARE' IS CITING THE WALLS, NOT THE NUT.
    - node: nut-neg
      cyl: 2.2
      lift: 3.1
      confidence: estimated
      source: >-
        DERIVED, NOT MEASURED, and the distinction matters because this feature sits beside
        two that ARE measured. The owner's reading in the terminal key covers the WALLS
        (12.7) and the BOLTS (6.35) and nothing else; it says only that 'each lane takes a
        bolt with a hex nut and a star washer'. The washer and nut thicknesses and their
