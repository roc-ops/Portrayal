<svg xmlns="http://www.w3.org/2000/svg" width="54mm" height="40mm" viewBox="0 0 54 40">
  <!-- The Edgecore PSU-48V-650-B, the back-to-front unit: the face of PSU-48V-650-F with the blue release latch. The housing,
       the black pull handle over a grille, and low on the right of the face the blue Positronic PLA03 connector (a part this
       supply composes, drawn by its own skin over `dc-inlet`), with a label beside it: RTN, -36~-72V and the earth symbol,
       top to bottom, level with the connector's three contacts. -->
  <defs>
    <pattern id="mesh" width="4.8" height="4.8" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="3.8" height="3.8" fill="#3c4046"/>
    </pattern>
  </defs>
  <g id="latch">
    <path id="latch-body" d="M 1.2 8 h 5 a 1.6 1.6 0 0 1 1.6 1.6 v 20.8 a 1.6 1.6 0 0 1 -1.6 1.6 h -5 a 1.2 1.2 0 0 1 -1.2 -1.2 v -21.6 a 1.2 1.2 0 0 1 1.2 -1.2 z" fill="#3d7bd6" stroke="#234b8c" stroke-width="0.4" data-fill-from="latch-finish" data-stroke-from="latch-edge"/>
    <line id="latch-line" x1="5.85" y1="17.6" x2="5.85" y2="27.2" stroke="#0d0f11" stroke-width="0.7"/>
  </g>
  <rect id="body" x="8" y="0.8" width="45.2" height="38.4" rx="0.8" fill="#b9bec4" stroke="#7a8087" stroke-width="0.4"/>
  <rect id="vent-field" x="9" y="1.8" width="43.2" height="36.4" fill="url(#mesh)"/>
  <rect id="plate" x="31.6" y="1.8" width="20.6" height="36.4" fill="#b9bec4"/>
  <g id="handle">
    <rect id="handle-bar" x="10" y="8" width="5" height="24" rx="1.8" fill="#1c1f23" stroke="#0d0f11" stroke-width="0.35"/>
    <rect id="handle-grip" x="11.2" y="10" width="2.6" height="20" rx="1.2" fill="#0d0f11"/>
  </g>
  <g id="top-vents" fill="#3c4046">
    <rect x="33.6" y="3.2" width="2.8" height="3.6" rx="0.3"/>
    <rect x="40.2" y="3.2" width="2.8" height="3.6" rx="0.3"/>
  </g>
  <rect id="dc-inlet" x="32.8" y="10.3" width="10.36" height="28.6" rx="0.5" fill="#0d0f11"/>
  <g id="legend">
    <rect id="legend-label" x="44.6" y="15.6" width="4.0" height="18.0" rx="0.3" fill="#e6e9ec" stroke="#9aa0a6" stroke-width="0.2"/>
    <g id="silkscreen">
      <text x="46.6" y="19.6" transform="rotate(90 46.6 19.6)" font-family="sans-serif" font-size="1.5" text-anchor="middle" dominant-baseline="middle" fill="#1c1f23">RTN</text>
      <text x="46.6" y="24.6" transform="rotate(90 46.6 24.6)" font-family="sans-serif" font-size="1.3" text-anchor="middle" dominant-baseline="middle" fill="#1c1f23">-36~-72V</text>
    </g>
    <g id="legend-earth" fill="none" stroke="#1c1f23" stroke-width="0.25" stroke-linecap="round">
      <path d="M 46.6 28.4 V 29.6 M 45.6 29.6 H 47.6 M 45.95 30.15 H 47.25 M 46.3 30.7 H 46.9"/>
    </g>
  </g>
</svg>
