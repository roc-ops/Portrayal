format: 1
kind: module
name: dcs520-fan
version: 1.0.0
class: fan
behaviour: fills
profile: networking
description: >-
  The hot-swappable fan tray of the Edgecore DCS520 (AS9736-64D) - an 80.1 x 83.5
  honeycomb face with a red pull bar lying at a slight angle across it, a release button at
  the bar's centre and a status lamp at the top left. Four of them fill the middle of the
  rear between the two supplies. IT LOOKS LIKE THE AIS800 FAMILY'S 2RU TRAY AND THIS FILE
  DOES NOT CLAIM TO BE IT - see the provenance.
size: {w: 80.1, h: 83.5}
size-confidence: {w: measured, h: measured}
attrs:
  rotors: 1
provenance:
  size: >-
    MEASURED ON THE QUICK START GUIDE'S REAR ELEVATION at 600 dpi (5.05 px/mm). The bay
    seams were found twice, in two horizontal bands chosen clear of the handle, and the two
    scans agree: seam pairs at 45.45/51.39, 131.49/136.93, 217.13/222.57, 302.77/308.12 and
    388.42/394.26. That gives four bays 80.1 wide on a pitch of 85.65 - 85.64, 85.64 and
    85.65 on the three intervals between trays. The vertical extent comes from the module's
    own top and bottom edges, strong gradients at y 1.18 and 85.62, taken as 2.0 to 85.5.
  it-is-probably-the-shell-familys-tray-and-probably-is-not-evidence: >-
    THIS IS A SEPARATE COMPONENT ON PURPOSE. The DCS520 shares its 440 x 649.2 x 87 shell
    with the AIS800-64D, the AIS800-64O and the AGR560, all three of which seat one tray
    whose FRU number `FAN-2U-1x1SN-F` is printed in all three datasheets and whose rear
    artwork is pixel-identical between them. The DCS520's tray sits on a pitch of 85.65
    against that family's 85.71 - six hundredths of a millimetre apart - and its face
    carries the same honeycomb, the same angled red bar with two pairs of slots and a
    central button, and the same corner lamp. It is very likely the same tray.
    WHAT IS MISSING IS THE EVIDENCE. Neither DCS520 document prints a fan FRU number, so
    the argument that settled the other three - the same printed part number - is not
    available here. And the two drawings CANNOT be diffed: scaled to a common size and
    normalised, 46% of pixels differ by more than a standard deviation, but that is
    exposure and rendering rather than shape - this guide draws the tray bright with the
    rotor showing through the mesh where the AIS800 guides draw it dark. A test that cannot
    separate "a different part" from "different lighting" decides nothing.
    SO THE SIZES ARE MEASURED HERE AND IDENTITY IS LEFT OPEN. If a DCS520 FRU list turns up
    naming `FAN-2U-1x1SN-F`, this component should be deleted and `edgecore/fan-2u-1x1sn@1`
    seated instead - that is the shared part, renamed for its FRU in roc-ops/Portrayal#420
    precisely because three chassis were already sharing it. The device carries a gap.
  the-handle-is-red-and-there-is-only-one-build: >-
    #d5342c, read on the datasheet's rear photograph. The datasheet publishes ONE ordering
    code - AS9736-64D-O-AC-F, "Front-to-Back airflow" - so unlike the AIS800 pair there is
    no back-to-front build and no second colour to model.
  redundancy: >-
    "3 + 1 redundant, hot-swappable fan modules", printed in the datasheet's key features,
    its physical section and its interfaces table. FOUR BAYS AND THE FIGURE COUNTS BAYS,
    which is not true of the two AIS800 models on this same shell, where a "7+1" counts
    eight rotors inside four trays. One rotor is drawn per tray because the figure and the
    bay count agree and nothing states a second.
