relief:
  wall: '#3a3e43'
  features:
    - node: grille
      vent: 16
      confidence: estimated
      source: >-
        The mesh is open - the rotor shows through it - but no document gives a depth. 16
        matches what this library gives the other Edgecore 2RU trays.
    - node: handle
      uhandle: 24
      dia: 6.2
      confidence: estimated
      source: >-
        A U-SHAPED BAR standing off the mesh, gripped along its whole length and returning
        to the tray at both ends, which is what `uhandle` builds. `bar` would stand a tube
        on nothing - the correction the AIS800 trays took at review.
        HOW FAR IT STANDS OFF IS NOT DIMENSIONED anywhere. 24 is inside the 22-29 mm range
        the library's other fan-tray handles occupy and matches the AIS800 2RU tray this
        one closely resembles. roc-ops/Portrayal#385 is open on this class of estimate.
    - node: status
      pocket: 0.8
      confidence: estimated
      source: >-
        A recessed lens at the tray's top left; drawn, not dimensioned. `pocket` and not
        `sink` because nothing stands above it, so a sink would have no floor to measure
        from and would be collected nowhere.
