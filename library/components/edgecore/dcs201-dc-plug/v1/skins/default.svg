<svg xmlns="http://www.w3.org/2000/svg" width="20.0mm" height="18.0mm" viewBox="0 0 20.0 18.0">
  <!-- The cable connector of the 48 VDC supply seen from the wire side, seated: a green body at the outline of the connector it seats in, a
       screw boss at the top left, and one wire entering each of the three ways (ground, -36 to -75 VDC and DC return from the top down). -->
  <rect id="body" x="0" y="0" width="20.0" height="18.0" rx="0.8" fill="#6fa851" stroke="#3d6b2e" stroke-width="0.4"/>
  <circle id="boss" cx="1.5" cy="2.0" r="0.9" fill="#c9cfd4" stroke="#5c6167" stroke-width="0.2"/>
  <circle id="wire-1" cx="8.2" cy="4.2" r="1.5" fill="#f1f0a8" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-1-color"/>
  <circle id="wire-2" cx="8.2" cy="9.0" r="1.5" fill="#4a3426" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-2-color"/>
  <circle id="wire-3" cx="8.2" cy="13.8" r="1.5" fill="#2f3f86" stroke="#4a4d52" stroke-width="0.12" data-fill-from="wire-3-color"/>
</svg>
