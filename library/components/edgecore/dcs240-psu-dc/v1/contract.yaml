format: 1
kind: module
name: dcs240-psu-dc
version: 1.3.0
class: psu
behaviour: fills
profile: networking
description: >-
  The -48 VDC power supply of the Edgecore DCS240 (AS9726-32DB) - the same 54.4 x 40 CRPS face as the AC variant with a DC terminal in place of the C14 inlet. Rated 1600 W.
size: {w: 54.4, h: 40.0}
size-confidence: {w: photo-measured, h: estimated}
attrs:
  model: 'AS9726-32DB 48VDC PSU'
  power-output-w: 1600
  input: dc
  inlet: dc-terminal
provenance:
  the-face-was-remeasured-from-an-orthographic-photograph: >-
    TWO CORRECTIONS, FROM edgecore/dcs511's REAR PHOTOGRAPH, and they are the AC variant's.
    This face's elements were copied from edgecore/dcs201-psu-ac@1, whose own provenance calls
    them "ESTIMATED POSITIONS ON A MEASURED FACE" read off a 5 px/mm PERSPECTIVE render.
    dcs511-3-DCS511-B.png is an orthographic shot of the same module at 2.19 px/mm, measured
    on PS2 - the supply at x 12.00, far from both chassis edges.
    THE BAIL IS A TALL NARROW BAR, NOT A BOX OVER THE GRILLE: x 17.7-23.7 by y 2.0-39.7,
    6 mm wide and nearly the full module height at the grille's right edge, against the
    13 x 26 box at [8.0, 7.0] that was drawn across the lattice's middle. THE LATCH IS A TALL
    VERTICAL BAR, NOT A SMALL TAB: the red segments at x 44.63-54.22 by y 18.52-40.44, against
    a 9.5 x 3.4 tab at [40.5, 35.0].
    THE AC FACE IS NO LONGER THIS PART'S FACE. Every rear photograph and elevation of the
    chassis in this corpus draws the AC pair, so this variant borrowed the AC face and
    estimated its terminal; that was 1.2.0 and before. Since 1.3.0 the face of this DC
    variant is drawn from its own photograph (see `face`); the corrections above were read
    off the AC pair and no longer apply to the bail, the grille or the terminal.
  size: >-
    photo-measured - the DCS240 quick start guide, page 1 Overview rear elevation at 600 dpi,
    scaled by the stated 438.4 mm body width to 5.0844 px/mm. Both supplies were read with an
    EDGE SCAN rather than a threshold, because a threshold on a bright module against dark
    chassis clips the duller edge: their frames read 12.00-66.28 and 371.73-426.21, giving
    54.28 and 54.48. The arithmetic closes across the whole face - left margin 12.0 against a
    right margin of 12.2, and the six fan bays between them at a 48.50 pitch - which is why
    these are used rather than estimated.
    THE HEIGHT IS NOT MEASURED; 40.0 is the family's 1RU module height and is marked estimated.
  power: >-
    quick start, 48 VDC PSU section, verbatim: "Power Rating / -48 VDC, 1600 Watts". One figure, no temperature ladder, so none is recorded.
  why-this-is-its-own-part: >-
    THE RATING. This face is the same 54 mm CRPS shape the rest of the Edgecore line uses, and
    common/psu-ac-650@3, common/psu-dc-650@2, edgecore/dcs201-psu-ac@1 and its DC sibling all
    fit the bay. They assert 650 W, 650 W, 400 W and 400 W. This chassis draws up to 714 W on
    its own and its supplies are rated 1000/1500 W AC and 1600 W DC, so seating any of them
    would export a figure this vendor does not claim. A shape may be shared; a rating may not.
  elements: >-
    The latch is MEASURED, since 1.1.0, off an orthographic photograph of the AC module in the
    same bay (see the-face-was-remeasured-from-an-orthographic-photograph above), and it is
    where the DC photograph puts it: at the right-hand edge, in the lower half. The bail, the
    grille (`vent-field`) and the terminal block (`dc-inlet`) are ESTIMATED, since 1.3.0: they
    are read off the DC supply's own photograph (see `face`). What is also estimated is the
    HEIGHT of the face, 40.0, and every relief depth below - a photograph fixes where things
    are on the face, not how far they stand off it.
  face: >-
    estimated - the Edgecore DCS240 (AS9726-32DB) Quick Start Guide, page 3, the photograph
    above the callouts (the DCS511 (AS9737-32DB) Quick Start Guide, page 3, prints the same
    photograph smaller). It is a close-up from the front, in perspective, with no scale
    printed, and it shows the DC supply with a black two-screw block, the black bail at the
    left, a perforated grille behind and above the block, a cross-head earth screw at the
    upper right and the red latch at the right. THE SCALE: the metal plate in the photograph
    is taken as the supply's 54.4 mm width. It reads 676 px wide and 485 px high, 54.4 by 39.0
    mm at 12.43 px/mm, which agrees with the face's 40.0 mm height within a millimetre; every
    position below is that scale from the plate's top left corner. The plate is the only part
    of the photograph that is flat to the camera, so what stands off it (the block's walls,
    the screws, the earth screw) is a little larger in the photograph than its place on the
    face, and that is not corrected. The block reads 34.0 by 23.2 mm at (8.1, 15.3), its two
    clamp plates 11 by 11.8 mm, its screw heads about 8 mm across at 17.9 and 32.4 across and
    27.0 down (a 14.6 mm pitch), the legend "-" under the left screw and "+" under the right
    one. The grille is a lattice of holes about 3.1 mm across at a 4.1 mm pitch, drawn where
    the photograph shows it (above the block, left of it between the bail and the block, and
    right of it beside the latch). The earth screw, with its star washer, reads about 11 mm
    across at (44.7, 8.1). THE BAIL AND THE LATCH ARE NOT READ AT THE PHOTOGRAPH'S SIZE. They
    stand off the plate, closer to the camera, and the photograph shows them larger than the
    plate and spilling past its left, right and lower edges (the bail 4 mm past the left edge,
    the latch 8 mm past the right edge and 12 mm below it), which the bay does not allow. The
    bail is drawn inside the face, as a C-shaped loop 9.8 mm across and 38.4 mm tall whose
    bar is 5.6 mm wide (the AC bail's measured bar is 6.0 mm); the latch keeps its measured
    box. The photograph shows a slot in the latch that is not drawn. The colours are read off
    the photograph and are estimates too.
  seats: >-
    estimated - each terminal screw is the library's common/terminal-screw-34@1, a screw head
    3.4 across (that part's own size is an estimate), standing at the centre of a screw head
    this skin draws (17.86 and 32.42 across, 27.03 down; each head is drawn 8.0 across, so the
    drawing marks where a lug lands and does not show the screw). The quick start guides show
    the two screws and give a wire size and a current, and no screw head, thread or stud; the
    places are read off the photograph (see `face`). No depth is claimed: the guide shows the
    block's walls standing off the plate and gives no height, so the block has no relief and
    the screws stand on the face.
  earth: >-
    A DECLARED STAND-IN, and its place is estimated. The Edgecore DCS240 (AS9726-32DB) Quick
    Start Guide and the DCS511 (AS9737-32DB) Quick Start Guide, page 3, the photograph above the
    callouts, show a cross-head screw with a star washer at the upper right of the supply's
    face, above the block, and call it "4. Ground". It is a screw beside the two-screw terminal
    block, not on it, so it is a ground seat a lug lands on outside the DC port, which keeps two
    poles (decided 2026-11-02). It is the library's common/ground-screw@1, a screw that claims no
    stud size, because no document held gives this screw's thread or head. It stands where the
    photograph puts it (its centre at 44.65 across, 8.13 down, over the earth screw this skin
    draws there). The data sheets give the supplied cable as "3 x ring terminal to 3 x ring
    terminal", which agrees with three lugs, one on each screw. The place is an estimate.
  poles: >-
    Edgecore DCS240 (AS9726-32DB) Quick Start Guide and DCS511 (AS9737-32DB) Quick Start Guide,
    step 3 "Connect Power", page 3, the photograph above the callouts: two screws between black
    barriers, "1. Use the DC power cable included with the DC PSU.", "2. -40 - -75 VDC" on the
    left screw and "3. DC return" on the right one, with "-" printed under the left screw and "+"
    under the right one, and "4. Ground". The roles are the callouts': `batt` for the -40 - -75 VDC
    wire (spec/schemas/dc.yaml writes `batt` as negative (battery)) and `rtn` for the DC return (it
    writes `rtn` as RTN and return), listed in the callouts' order. The port states no voltage: the
    guides give a range and call the supply "48 VDC" and "-48 VDC", a name and no nominal.
  rating: >-
    Edgecore DCS240 (AS9726-32DB) Quick Start Guide and DCS511 (AS9737-32DB) Quick Start Guide,
    page 3, "DC PSU", "DC Input -40 V - -75 V, 40 A maximum", and both data sheets, page 3, "DC
    PSU": "-40 - -75 VDC (40 A/1600 W max.)" and "(1600 W/40 A max.)". One current, the same in
    all four, so the port states it as the supply's input current.
  awg: >-
    Edgecore DCS240 (AS9726-32DB) Quick Start Guide and DCS511 (AS9737-32DB) Quick Start Guide,
    page 3, the note under the callouts: "Use #8 AWG / 6 mm2 copper wire (for a -40 to -75 VDC
    PSU)". It is the one size the guides give for this supply's wires, so the port states it. The
    data sheets, page 4, print the supplied cable as "6/8AWG (4.3/6.4mm2)"; that is the cable
    that comes with a system, not a limit on the wire to use, and it is recorded here and not
    stated.
  airflow-colour-convention: >-
    This device's guide states it: F2B supplies carry RED release latches and B2F supplies
    BLUE. The latch fill is therefore a default overridden per configuration. See
    roc-ops/Portrayal#277.
  input: >-
    quick start: '-48 VDC, 1600 W'.
states: [absent]
elements:
  handle: {at: [0.20, 0.80], size: [9.80, 38.40], class: handle}
  latch: {at: [45.40, 19.40], size: [9.00, 20.60], class: latch}
  vent-field: {at: [5.90, 2.65], size: [45.20, 31.90], class: vent}
  dc-inlet: {at: [8.1, 15.3], size: [34.0, 23.2], class: inlet}

fields:
  latch-finish: {label: Latch colour, type: text, default: '#b8324a'}
  latch-edge: {label: Latch edge colour, type: text, default: '#6e1c2c'}

relief:
  wall: '#3a3e43'
  # THE FACE ITSELF GETS NO RELIEF - a full-face `out` is a slab and a slab buries whatever is
  # recessed beneath it, which is how the CSR310's AC supply came out blank. See #364.
  features:
    - node: handle
      uhandle: 27.0
      color: '#2b2f33'
      confidence: estimated
      source: >-
        NOT SOURCED FOR THIS PART, and 27 is borrowed rather than measured. No staged document
        for this chassis says how far its bail stands off the face. The nearest published
        figure for a CRPS-class supply is UfiSpace's S9510-28DC HIG - "the handle for the power
        supplies will extend outwards by 1.06 inches" - which ufispace/psu-401-ac carries at
        datasheet confidence and ufispace/psu-102-ac borrows at estimated, exactly as here.
        WHAT IT REPLACES WAS WORSE. Until 1.1.0 this node read `bar: 4.0, lift: 2.0` - a flat
        plate standing 2 mm off the panel - which is not what a pull-out bail does and is the
        odd one out in this library: common/psu-ac-650@3 uses uhandle 9.5, celestica/psu-1600
        14, common/psu-550w@2 22.85 and the two ufispace/psu-102 parts 27. The vocabulary for
        a handle you hook a finger under is `uhandle`, and this part was not using it.
    - node: latch
      out: 2.4
      confidence: estimated
      source: >-
        edgecore/dcs240-psu-dc@1's own elements key - outline drawn, projection not stated.
    - node: vent-field
      vent: 24
      confidence: estimated
      source: >-
        edgecore/dcs240-psu-dc@1's own elements key - the lattice's extent is drawn and the
        depth of the cavity behind it is not stated.
parts:
  - {ref: common/terminal-screw-34@1, id: pole-batt, at: [16.16, 25.33]}
  - {ref: common/terminal-screw-34@1, id: pole-rtn, at: [30.72, 25.33]}
  - {ref: common/ground-screw@1, id: earth, at: [41.85, 5.33]}
dc:
  ports:
    - id: input
      direction: input
      rating-a: 40
      awg: [8]
      poles:
        - {role: batt, slot: pole-batt}
        - {role: rtn, slot: pole-rtn}
      source: {poles: poles, rating-a: rating, awg: awg}
skins: [default]
body:
  depth: 300
  color: '#b9bec4'
  footprint: {at: [0, 0], size: [54.4, 40]}
