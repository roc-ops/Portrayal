  <!-- The DC power connector of the AIS800-64 supply seen from its mating face: a grey housing, a dark web across its middle, six round
       sockets in two rows of three, a small tab under each socket and a slotted contact at the centre of each. The outline and every
       centre are the supply's own drawing, carried over, so that the part is drawn where and as the supply's skin draws the pocket. -->
