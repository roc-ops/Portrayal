format: 1
kind: module
name: agr420-filter-top
version: 1.0.0
class: filter
profile: networking
description: >-
  Removable TOP air filter for the Edgecore AGR420 (AS7946-74XKSB) - the full-width band of it. A dark metal frame with open sections and reticulated foam behind them, bolted onto the OUTSIDE of the faceplate with two captive thumb screws; it does not slide into a bay, so it is placed, not seated. The same physical filter also carries a deeper section beside the QSFP-DD column, which is agr420-filter-step.
attrs: {model: 'AGR420 Air Filter (top)'}
size: {w: 417.0, h: 8.6, d: 12.0}
provenance:
  extent: 'drawing - measured off the AGR420 datasheet page-2 front figure at 8.9705 px/mm
    across and 8.9080 px/mm down. The reticulated foam was found by local variance on the
    600 dpi render, which is what fixes both ends of each band'
  reuse: 'checked before drawing - edgecore/agr-filter-top@1 and agr-filter-bottom@1 do NOT
    fit this front. They are 353.5 mm wide against the 400 to 417 needed here, and the top one
    is stepped for the AGR400 pair of QSFP-DD blocks where this front has a single block at
    the left'
  split: 'the stepped frame is one physical part, modelled as a band plus an
    agr420-filter-step. A placement is a bounding rectangle to both the renderer and L13, so
    one 26 mm-tall stepped box would sit on top of sixteen ports it steps around'
  construction: photo - the metal frame, the open sections with foam behind them and the
    captive slotted screws are read off IMG_6807, a straight-on shot of a real unit
  screws: drawing - two captive thumb screws, 8.1 mm across, Hough-detected on the front figure at radius 4.2 mm and confirmed by the gaps they leave in the reticulated foam
  removable: datasheet - the QSG has an Air Filter Replacement procedure, so it is a
    serviceable part rather than chassis decoration
  depth: estimated - not given in either document
relief:
  wall: '#4a4f55'
  features:
    # bolted onto the OUTSIDE of the faceplate, so it stands proud. `out` uses the node's
    # bounding rect and textures the slab from that node alone, so it sits on the GROUP
    # holding the frame, its foam and its screws - on a bare rect it came out blank.
    - node: frame
      out: 3.0
      confidence: estimated
      source: >-
        edgecore/agr420-filter-top@1's own depth key: 'estimated - not given in either
        document'. That key is about the filter's 12.0 size.d; its proudness off the panel
        has no source at all. The frame and foam EXTENTS are drawing-measured off the
        datasheet front figure and are not in doubt - only how far the assembly stands off
        the face.
skins: [default]
