format: 1
kind: module
name: dcs240-psu-ac
version: 1.2.0
class: psu
behaviour: fills
profile: networking
description: >-
  The AC power supply of the Edgecore DCS240 (AS9726-32DB) - a CRPS-style module in a bright housing with a latticed exhaust grille at the left, a wire bail handle over it, an IEC C14 inlet turned on its side at the right and a coloured release latch down its right edge. Rated 1000 W at 110 V and 1500 W at 230 V, which is why it is not any 650 W or 400 W part in this library.
size: {w: 54.4, h: 40.0}
size-confidence: {w: photo-measured, h: estimated}
attrs:
  model: 'AS9726-32DB AC PSU'
  power-output-w: 1500
  input: ac
  inlet: c14
provenance:
  the-face-was-remeasured-from-an-orthographic-photograph: >-
    THREE CORRECTIONS, ALL FROM edgecore/dcs511's REAR PHOTOGRAPH. This face's elements were
    copied from edgecore/dcs201-psu-ac@1, whose own provenance calls them "ESTIMATED POSITIONS
    ON A MEASURED FACE" read off a 5 px/mm PERSPECTIVE render. dcs511-3-DCS511-B.png is an
    orthographic shot of the same module at 2.19 px/mm, measured on PS2 - the supply at
    x 12.00, far from both chassis edges and the one the DCS240's edge scan anchored on.
    THE INLET WAS NEVER ROTATED. edgecore/dcs201-psu-ac@1, common/psu-ac-650@3 and
    edgecore/csr440-psu-ac@1 all place std/c14-inlet@1 with `rotate: 270` and this contract
    alone omitted it, so a 28-wide landscape inlet sat at x 30.0 on a 54.4-wide module and
    ran 3.6 mm off the end of the part. The photograph settles the direction independently:
    the coupler's chamfered corners and its lone earth pin BOTH point left, which is a
    quarter turn anticlockwise. Its aperture reads 28.5 to 45.4 wide by 1.0 to 31.4 tall -
    portrait, as the family's other three say.
    THE BAIL IS A TALL NARROW BAR, NOT A BOX OVER THE GRILLE. It reads x 17.7-23.7 by
    y 2.0-39.7 - 6 mm wide and nearly the full module height, standing at the grille's right
    edge - against the 13 x 26 box at [8.0, 7.0] that was drawn across the lattice's middle.
    THE LATCH IS A TALL VERTICAL BAR, NOT A SMALL TAB. Colour segmentation puts the red at
    x 44.63-54.22 by y 18.52-40.44, a bar down the module's right edge, against a 9.5 x 3.4
    tab at [40.5, 35.0]. The width was right and the height was out by a factor of six.
    THE SIBLINGS STILL CARRY THE OLD ESTIMATES. edgecore/dcs201-psu-ac@1 and its DC sibling
    have the same three elements at the same values and are not changed here, because their
    devices are not in this change and the numbers above are measured on THIS chassis's
    supply. They are worth revisiting against the same photograph.
  size: >-
    photo-measured - the DCS240 quick start guide, page 1 Overview rear elevation at 600 dpi,
    scaled by the stated 438.4 mm body width to 5.0844 px/mm. Both supplies were read with an
    EDGE SCAN rather than a threshold, because a threshold on a bright module against dark
    chassis clips the duller edge: their frames read 12.00-66.28 and 371.73-426.21, giving
    54.28 and 54.48. The arithmetic closes across the whole face - left margin 12.0 against a
    right margin of 12.2, and the six fan bays between them at a 48.50 pitch - which is why
    these are used rather than estimated.
    THE HEIGHT IS NOT MEASURED; 40.0 is the family's 1RU module height and is marked estimated.
  power: >-
    quick start, AC PSU section, verbatim and WITH TWO RUNGS: "100-127 VAC, 50/60 Hz, 12 A max. (1000 W max.)" and "200-219 VAC, 50/60 Hz, 8 A max. (1500 W max.) (Acbel PSU only) 220-240 VAC, 50/60 Hz, 8 A max. (1500 W max.)". THE HIGHER RUNG IS RECORDED because it is the supply's rating at the voltage a data-centre rack runs; the low-line 1000 W figure is in the input attr beside it so neither is lost. No ambient is given anywhere, so none is invented.
  why-this-is-its-own-part: >-
    THE RATING. This face is the same 54 mm CRPS shape the rest of the Edgecore line uses, and
    common/psu-ac-650@3, common/psu-dc-650@2, edgecore/dcs201-psu-ac@1 and its DC sibling all
    fit the bay. They assert 650 W, 650 W, 400 W and 400 W. This chassis draws up to 714 W on
    its own and its supplies are rated 1000/1500 W AC and 1600 W DC, so seating any of them
    would export a figure this vendor does not claim. A shape may be shared; a rating may not.
  elements: >-
    MEASURED, NOT ESTIMATED, SINCE 1.1.0. These were copied from the DCS201's supply as
    proportions off a perspective render; they are now read off an orthographic photograph of
    this module. See the-face-was-remeasured-from-an-orthographic-photograph above for the
    three that moved and by how much. What is still estimated is the HEIGHT of the face, 40.0,
    and every relief depth below - the photograph fixes where things are on the face, not how
    far they stand off it.
  airflow-colour-convention: >-
    This device's guide states it: F2B supplies carry RED release latches and B2F supplies
    BLUE. The latch fill is therefore a default overridden per configuration. See
    roc-ops/Portrayal#277.
  input: >-
    quick start: '100-127 VAC 12 A (1000 W max); 200-240 VAC 8 A (1500 W max)'.
states: [absent]
elements:
  handle: {at: [17.70, 2.00], size: [6.00, 37.70], class: handle}
  latch: {at: [45.40, 19.40], size: [9.00, 20.60], class: latch}
  vent-field: {at: [4.20, 3.60], size: [19.40, 32.40], class: vent}

fields:
  latch-finish: {label: Latch colour, type: text, default: '#b8324a'}
  latch-edge: {label: Latch edge colour, type: text, default: '#6e1c2c'}
parts:
  - {ref: std/c14-inlet@1, id: inlet, at: [22.95, 6.20], rotate: 270}
relief:
  wall: '#3a3e43'
  # THE FACE ITSELF GETS NO RELIEF - a full-face `out` is a slab and a slab buries whatever is
  # recessed beneath it, which is how the CSR310's AC supply came out blank. See #364.
  features:
    - node: handle
      uhandle: 27.0
      color: '#2b2f33'
      confidence: estimated
      source: >-
        NOT SOURCED FOR THIS PART, and 27 is borrowed rather than measured. No staged document
        for this chassis says how far its bail stands off the face. The nearest published
        figure for a CRPS-class supply is UfiSpace's S9510-28DC HIG - "the handle for the power
        supplies will extend outwards by 1.06 inches" - which ufispace/psu-401-ac carries at
        datasheet confidence and ufispace/psu-102-ac borrows at estimated, exactly as here.
        WHAT IT REPLACES WAS WORSE. Until 1.1.0 this node read `bar: 4.0, lift: 2.0` - a flat
        plate standing 2 mm off the panel - which is not what a pull-out bail does and is the
        odd one out in this library: common/psu-ac-650@3 uses uhandle 9.5, celestica/psu-1600
        14, common/psu-550w@2 22.85 and the two ufispace/psu-102 parts 27. The vocabulary for
        a handle you hook a finger under is `uhandle`, and this part was not using it.
    - node: latch
      out: 2.4
      confidence: estimated
      source: >-
        edgecore/dcs240-psu-ac@1's own elements key - outline drawn, projection not stated.
    - node: vent-field
      vent: 24
      confidence: estimated
      source: >-
        edgecore/dcs240-psu-ac@1's own elements key - the lattice's extent is drawn and the
        depth of the cavity behind it is not stated.
skins: [default]
body:
  depth: 300
  color: '#b9bec4'
  footprint: {at: [0, 0], size: [54.4, 40]}
