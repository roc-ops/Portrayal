format: 1
kind: component
name: agr-label-caution
version: 1.0.0
class: sticker
behaviour: mounts
profile: networking
description: >-
  Caution label near the rear left of the top cover on the Edgecore AGR400 / AGR420.
attrs: {model: 'AGR caution label'}
size: {w: 26.0, h: 62.0}
provenance:
  layout: 'photo - IMG_6788, a tall rectangular caution notice with a warning triangle'
  size: 'photo-measured - scaled against the 440 mm chassis width in the same
    frame. Approximate: the shot is not orthographic'
  content: placeholder art - field blocks and barcode bars stand in for text that
    is not transcribed
skins: [default]
relief:
  features:
    - node: label
      out: 0.2
      confidence: estimated
      source: >-
        edgecore/agr-label-caution@1 itself - unsourced. The size key is photo-measured, but
        that is the label's OUTLINE scaled against the 440 mm chassis width; nothing
        measures its THICKNESS. 0.2 is the same number on all three AGR labels and is the
        library's adhesive-label figure.
