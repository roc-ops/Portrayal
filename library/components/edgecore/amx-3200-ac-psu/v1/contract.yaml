version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The Edgecore AMX3200's 1200 W AC supply, ordered as AMX-3200-AC-PSU - a 73.5 x 40.0
  module with its release latch at the left edge, its IEC C14 inlet
  beside it, its own fan behind a guard at the right, and a black U-handle under the
  fan. Two seat at the ends of the rear, PSU2 at the left and PSU1 at the right.
size: {w: 73.5, h: 40.0}
size-confidence: {w: datasheet, h: photo-measured}
attrs:
  model: 'AMX-3200-AC-PSU'
  input: ac
  inlet: c14
  power-output-w: 1200
provenance:
  size: >-
    DATASHEET for the width: the ordering table's '1200 W AC PSU ... (73.5mmW x
    185mmD)'. The guide's rear (2.536 px/mm) reads the two bays 72.9 and 72.9 wide, within
    a pixel and a half of it. The 40.0 height is photo-measured: the face fills the 43.5 mm
    chassis less its frame, 40.0 against a 73.5 width on the rear photographs to the
    pixel.
  the-face: >-
    PHOTO-MEASURED at 5x on the AC rear product photograph (2.19 px/mm,
    isotropic in the face to 1%). THE GUIDE'S LINE ART IS WRONG ABOUT THE HANDLE: it
    draws a bar laid across the fan guard, and both photographs show a black U-handle
    UNDER the guard, x 31.3-71.3 over y 30.5-39.2. The part follows the photographs.
  inlet: >-
    PHOTOGRAPHED: an IEC C14 inlet standing on end with a wire cord retainer, and the guide's
    Package Contents lists 'AC power cord, type IEC C13 (included with AC PSUs only)'.
  power-output-w: >-
    DATASHEET, 'PSU capacity 1200 W (Max system power consumption 850 W)' and the ordering
    table's '1200 W AC PSU'.
