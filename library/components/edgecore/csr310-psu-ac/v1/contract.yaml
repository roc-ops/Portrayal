format: 1
kind: module
name: csr310-psu-ac
version: 1.0.1
class: psu
behaviour: fills
profile: networking
description: >-
  The AC power supply of the Edgecore CSR310 (AS7315-27X) - the same hot-swappable
  1RU half-height module as the DC unit with an IEC C14 inlet in place of the
  terminal block, marked N / earth / L beneath it. Edgecore part SPAACTN-03BG.
size: {w: 54.1, h: 40.4, d: 300.0}
size-confidence: {w: borrowed, h: borrowed, d: estimated}
attrs:
  model: 'SPAACTN-03BG'
  part: '131700000453A'
  power-absent: not-published
  inlet: c14
  input: '100 V - 240 V, 5 A'
provenance:
  the-model-is-the-code-edgecore-prints: >-
    THE CSR310 DATASHEET'S FIELD REPLACEMENT UNITS TABLE IS THE ONLY SOURCE FOR THIS SUPPLY'S
    CODE, and it gives one row: `SP AACTN-03BG` | `131700000453A` | "AS7315-27X AC PSU (Black
    Housing)". The space in the model number is a conversion artifact of the same kind as the
    "F an Tray" and "Back-to-F ront" in these documents; `SPAACTN` is confirmed as an unbroken
    prefix by the DCS511's own table, which prints `SPAACTN-01` and `SPAACTN-02`.
    THE QUICK STARTS NAME NO AC PART. Both the CSR310's and the CSR430's give a part number
    for the DC supply only - a safety instruction about DC wiring - and say nothing about this
    one, so the table stands alone and this attr is scoped to it.
    THE TABLE'S THREE COLUMNS ARE Model Number | Part Number | Description, AND THIS CONTRACT
    HAD THE FIRST TWO SWAPPED. Until roc-ops/Portrayal#426 `model:` held the Description
    column's prose and `part:` held the Model Number, which matters because only one of them
    is read: `spec/tools/portrayal/dcim_export.py` keys every module type on `attrs.model` and
    never looks at `attrs.part`, so this supply was published to NetBox and Nautobot under a
    name with spaces in it while the orderable code sat one line below where no consumer sees
    it. `part:` now carries the datasheet's Part Number, as the column says.
    THE FAN TRAY OF THE SAME CHASSIS HAD THE SAME INVERSION and was corrected in the same
    change; see edgecore/csr310-fan-tray@1's the-two-columns-were-the-wrong-way-round. Three
    contracts in this library use `part:` and they are these three.
  shared-with: >-
    THE CSR430 (AS7515-24X) TAKES THIS SAME SUPPLY. Its datasheet draws the front twice, once
    with AC modules and once with DC, and the AC face carries the same C14 inlet marked N,
    earth and L behind the same handle and the same latch. Its DC sibling is proven shared by
    part number - see edgecore/csr310-psu-dc@1's `shared-with` - and the two variants are one
    mechanical part with two faces, so the AC one travels with it.
  no-face-extrusion: >-
        edgecore/csr310-psu-ac@1's own depth key. THE MODULE FACE CARRIES NO `out` OF ITS
        OWN, and that is deliberate: a full-face extrusion is a slab, and a slab buries
        anything that RECESSES into the face under it. On the AC sibling that is the C14
        inlet, which is a 13 mm cavity and vanished completely behind a 1.2 mm body. The
        module sits flush in its bay and the things that stand off it - the handle, the
        latch, the terminal block - say so one at a time. Same lesson as the terminal
        block's own relief, one level up.
  size: >-
    borrowed - edgecore/csr310-psu-dc@1, measured off the datasheet elevation at
    8.1477 px/mm. The two supplies share one bay, which is the whole point of an
    ordering matrix that lists four AC SKUs and one DC SKU against a single
    chassis, and the quick start's package-contents figure draws the AC and DC
    variants of the same box one above the other at the same size.
    THE ELEVATION SHOWS THE DC UNIT. The AC face is read from the quick start's
    step 4a figure, a three-quarter view of a module being withdrawn, which is
    legible for WHAT IS ON IT and useless for where: hence borrowed dimensions
    and a face composed of parts whose own sizes are known.
  inlet: >-
    read from csr310-qsg step 4a - an IEC C14 appliance inlet with N, earth and L
    silkscreened beneath it, one per module. Its size is std/c14-inlet@1's own,
    which carries a SCHURTER panel cutout; the elevation does not resolve it and
    nothing here re-measures it.
  handle-and-latch: >-
    borrowed - edgecore/csr310-psu-dc@1. The step 4a figure shows the same pull
    handle down the right-hand edge and the same latch at the foot on the AC
    module, which is what says these are one mechanical part with two faces.
  power: >-
    NOT PUBLISHED, exactly as on the DC unit. The chassis figures - 300 W capacity
    and 193 W consumption - are the box's, not this supply's. The AC input range
    is stated and carried in attrs; the output wattage is not.
elements:
  handle: {at: [41.5, 3.6], size: [3.5, 21.3], class: handle}
  latch: {at: [46.5, 32.0], size: [6.5, 7.4], class: latch}
parts:
  - {ref: std/c14-inlet@1, id: inlet, at: [11.0, 10.4]}
relief:
  wall: '#3a3e43'
  # THE FACE ITSELF GETS NO RELIEF - see `no-face-extrusion` in provenance.
  features:
    - node: handle
      out: 8.0
      color: '#c3c9cf'
      confidence: estimated
      source: >-
        edgecore/csr310-psu-dc@1's relief, which estimates it too - see `body`.
    - node: latch
      out: 4.0
      color: '#8a9099'
      confidence: estimated
      source: >-
        edgecore/csr310-psu-dc@1's relief, which estimates it too - see `body`.
skins: [default]
