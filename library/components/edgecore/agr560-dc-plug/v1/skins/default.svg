<svg xmlns="http://www.w3.org/2000/svg" width="16.1mm" height="29.0mm" viewBox="0 0 16.1 29.0">
  <!-- The cable connector of the AGR560 48 VDC supply seen from the wire side, seated: a dark body at the outline of the connector it seats in and
       one wire entering each of the two ways. No document draws it; the shapes and colours are estimates. -->
  <rect id="body" x="0" y="0" width="16.1" height="29.0" rx="0.8" fill="#2f3337" stroke="#15171a" stroke-width="0.3"/>
  <circle id="wire-1" cx="6.9" cy="9.4" r="3.2" fill="#2b2b2b" stroke="#6c7073" stroke-width="0.15" data-fill-from="wire-1-color"/>
  <circle id="wire-2" cx="6.9" cy="23.1" r="3.2" fill="#2b2b2b" stroke="#6c7073" stroke-width="0.15" data-fill-from="wire-2-color"/>
</svg>
