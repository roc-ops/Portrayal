<svg xmlns="http://www.w3.org/2000/svg" width="73.2mm" height="40.2mm" viewBox="0 0 73.2 40.2">
  <!-- The EPS112's 600 W AC supply, in its own coordinates. Everything drawn here
       was read off the quick start guide's rear elevation at 2.80 px/mm; see the
       contract's `the-face` note for the numbers. -->
  <rect id="body" x="0" y="0" width="73.2" height="40.2" rx="0.4" fill="#8d9298" stroke="#5d6267" stroke-width="0.35"/>
  <rect x="0.55" y="0.55" width="72.1" height="39.1" rx="0.3" fill="none" stroke="#b6bbc0" stroke-width="0.22"/>
  <g id="fan">
    <circle id="fan-well" cx="24.3" cy="20.1" r="14.4" fill="#6f747a" stroke="#5d6267" stroke-width="0.3"/>
    <g id="fan-blades" fill="#1a1d20">
      <path d="M 34.60 21.55 L 38.26 22.06 A 14.10 14.10 0 0 1 35.41 28.78 L 32.50 26.50 A 10.40 10.40 0 0 0 34.60 21.55 Z"/>
      <path d="M 29.59 29.05 L 31.47 32.24 A 14.10 14.10 0 0 1 24.44 34.20 L 24.40 30.50 A 10.40 10.40 0 0 0 29.59 29.05 Z"/>
      <path d="M 20.60 29.82 L 19.28 33.28 A 14.10 14.10 0 0 1 13.36 29.00 L 16.23 26.67 A 10.40 10.40 0 0 0 20.60 29.82 Z"/>
      <path d="M 14.39 23.26 L 10.87 24.39 A 14.10 14.10 0 0 1 10.52 17.10 L 14.14 17.89 A 10.40 10.40 0 0 0 14.39 23.26 Z"/>
      <path d="M 15.65 14.33 L 12.57 12.27 A 14.10 14.10 0 0 1 18.06 7.46 L 19.69 10.78 A 10.40 10.40 0 0 0 15.65 14.33 Z"/>
      <path d="M 23.42 9.74 L 23.11 6.05 A 14.10 14.10 0 0 1 30.29 7.34 L 28.72 10.69 A 10.40 10.40 0 0 0 23.42 9.74 Z"/>
      <path d="M 31.85 12.95 L 34.54 10.41 A 14.10 14.10 0 0 1 38.01 16.83 L 34.42 17.68 A 10.40 10.40 0 0 0 31.85 12.95 Z"/>
    </g>
    <circle id="fan-disc" cx="24.3" cy="20.1" r="10.3" fill="#d2d7db" stroke="#8d9298" stroke-width="0.3"/>
    <circle id="fan-hub" cx="24.3" cy="20.1" r="2.4" fill="#9aa1a8" stroke="#7d848b" stroke-width="0.22"/>
  </g>
  <g id="handle">
    <rect id="handle-grip" x="6.07" y="4.80" width="7.86" height="30.40" rx="2.30" fill="#b7655f"
      stroke="#8f4b46" stroke-width="0.25" data-fill-from="handle-finish"/>
    <rect x="2.50" y="1.80" width="6.60" height="2.40" rx="1.20" fill="#b7655f" stroke="#8f4b46" stroke-width="0.2"/>
    <rect x="2.50" y="36.00" width="6.60" height="2.40" rx="1.20" fill="#b7655f" stroke="#8f4b46" stroke-width="0.2"/>
    <circle cx="3.40" cy="3.00" r="1.85" fill="#b7655f" stroke="#8f4b46" stroke-width="0.2"/>
    <circle cx="3.40" cy="37.20" r="1.85" fill="#b7655f" stroke="#8f4b46" stroke-width="0.2"/>
  </g>
  <g id="handle-screws" fill="#d7dbdf" stroke="#6e757c" stroke-width="0.22">
    <circle cx="3.40" cy="3.00" r="1.25"/>
    <circle cx="3.40" cy="37.20" r="1.25"/>
  </g>
  <g id="face-screws" fill="#d7dbdf" stroke="#6e757c" stroke-width="0.22">
    <circle cx="17.40" cy="2.90" r="1.25"/>
    <circle cx="17.40" cy="37.30" r="1.25"/>
  </g>
  <g id="dc-ok">
    <circle cx="47.69" cy="4.86" r="2.32" fill="#20242a" stroke="#5d6267" stroke-width="0.25"/>
    <circle id="dc-ok-lens" cx="47.69" cy="4.86" r="1.25" fill="var(--led-color, #5b6169)"/>
  </g>
  <circle id="face-hole" cx="56.30" cy="4.60" r="1.60" fill="#14171a"/>
  <g id="ac-ok">
    <circle cx="64.84" cy="4.86" r="2.32" fill="#20242a" stroke="#5d6267" stroke-width="0.25"/>
    <circle id="ac-ok-lens" cx="64.84" cy="4.86" r="1.25" fill="var(--led-color, #5b6169)"/>
  </g>
  <g id="silkscreen" font-family="sans-serif" font-size="1.5" fill="#3a3e43">
    <text x="50.60" y="3.70">DC</text>
    <text x="50.60" y="5.70">OK</text>
    <text x="58.60" y="3.70">AC</text>
    <text x="58.60" y="5.70">OK</text>
  </g>
  <g id="inlet-well"><rect x="45.50" y="8.50" width="24.5" height="29.5" rx="0.6" fill="#6f747a" stroke="#5d6267" stroke-width="0.3"/></g>
  <g id="latch">
    <rect x="68.40" y="11.50" width="4.30" height="18.70" rx="1.20" fill="#b7655f" stroke="#7e3d39" stroke-width="0.25" data-fill-from="latch-finish"/>
    <rect x="69.55" y="16.00" width="1.30" height="9.50" rx="0.55" fill="#8f4b46"/>
  </g>
</svg>
