format: 1
kind: component
name: agr-label-serial
version: 1.0.0
class: sticker
profile: networking
description: >-
  Serial number, SKU and MAC label on the top cover on the Edgecore AGR400 / AGR420.
attrs: {model: 'AGR serial label'}
size: {w: 74.0, h: 100.0}
provenance:
  layout: 'photo - IMG_6788, rectangular, below the spec label. The artwork is generic: the real serial, SKU and MAC addresses are visible in the photograph and are deliberately NOT transcribed'
  size: 'photo-measured - scaled against the 440 mm chassis width in the same
    frame. Approximate: the shot is not orthographic'
  content: placeholder art - field blocks and barcode bars stand in for text that
    is not transcribed
skins: [default]
relief:
  features:
    - {node: label, out: 0.2}
