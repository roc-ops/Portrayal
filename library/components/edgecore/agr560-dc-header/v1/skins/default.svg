<svg xmlns="http://www.w3.org/2000/svg" width="16.1mm" height="29.0mm" viewBox="0 0 16.1 29.0">
  <!-- The DC power connector of the AGR560 supply seen from its mating face: a dark shroud narrowed at its waist, two round sockets one above the
       other and a pin at the centre of each. The outline and the socket centres are the supply's own drawing, carried over. -->
  <rect id="body" x="0" y="0" width="16.1" height="29.0" rx="0.8" fill="#3a3e43" stroke="#6c7073" stroke-width="0.3"/>
  <path id="shroud" d="M 1.3 3.0 Q 1.3 1.3 3.0 1.3 H 13.1 Q 14.8 1.3 14.8 3.0 V 12.6 Q 14.8 14.2 13.0 14.8 H 3.1 Q 1.3 14.2 1.3 12.6 Z
                        M 1.3 16.4 Q 1.3 17.0 3.1 17.6 H 13.0 Q 14.8 18.2 14.8 19.8 V 26.0 Q 14.8 27.7 13.1 27.7 H 3.0 Q 1.3 27.7 1.3 26.0 Z"
        fill="#15181b" stroke="#3a3e43" stroke-width="0.25"/>
  <circle id="socket-1" cx="6.9" cy="9.4" r="4.6" fill="#101214" stroke="#3a3e43" stroke-width="0.25"/>
  <circle id="socket-2" cx="6.9" cy="23.1" r="4.6" fill="#101214" stroke="#3a3e43" stroke-width="0.25"/>
  <circle id="pin-1" cx="6.9" cy="9.4" r="1.2" fill="#9aa0a6" stroke="#6d7379" stroke-width="0.2"/>
  <circle id="pin-2" cx="6.9" cy="23.1" r="1.2" fill="#9aa0a6" stroke="#6d7379" stroke-width="0.2"/>
</svg>
