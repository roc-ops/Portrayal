format: 1
kind: module
name: as5912-54x-psu-dc
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 650 W 48 VDC supply of the Edgecore AS5912-54X (AGR100). It has a release latch, a black pull handle
  and a grille. A blue Positronic PLA03 connector stands low on the right of its face. A label beside it
  prints RTN on top and an earth symbol at the bottom. The cable plugs into that connector.
size: {w: 54.0, h: 40.0}
size-confidence: {w: borrowed, h: borrowed}
attrs:
  power-output-w: 650
  input: dc
provenance:
  naming: >-
    NO MAKER PART NUMBER IS HELD FOR THIS SUPPLY, so it is named for the chassis that seats it, as
    edgecore/agr110-psu-dc@1 is, and states no model. The AS5912-54X quick start guide (150200001977A R02,
    "AS5912-54X | 5916-54XM") lists switch builds only; the data sheet the device cites (R20) is not held. The
    DCS204 data sheet lists the DC supply FRUs PSU-48V-650-F (F0TZZ7632004A) and PSU-48V-650-B
    (F0TZZ7632003A), but that is another chassis's supply, rated "-36 - -72 VDC (16A/650 W max.)" where this
    guide rates the AS5912-54X's "36-75 VDC, 12 A maximum", so neither number is borrowed and
    edgecore/psu-48v-650-f@1 and -b@1 are not seated here. If a part number is ever held, stating it as
    `part-numbers` renames the exported module type.
  size: >-
    BORROWED from common/psu-dc-650@2, which the AS5912-54X rear bays seated before (54.0 x 40.0 each,
    `psu-1` and `psu-2`). No document held dimensions the supply's face.
  body: >-
    BORROWED from common/psu-dc-650@2 (depth 195, colour #b9bec4, the latch, the black handle's place and
    size, the grille's mesh).
  the-face: >-
    READ FROM ONE PHOTOGRAPH, NOT AN ELEVATION. AS5912-54X | 5916-54XM quick start guide R02, step 5
    "Connect Power" (printed "English 2", PDF page 2), the last figure: the supply seen from above and to
    the left, a blue latch at the far left, a black U-handle over a grille of square holes, and, low on the
    right of the face, a blue connector standing upright with an ear at each end, its three pins in one
    column; a white label on the connector's right prints "RTN" at the top, a line too blurred to read in
    the middle and an earth symbol in a circle at the bottom. The face is the same photograph's subject as
    edgecore/psu-48v-650-f@1 and -b@1 draw from the DCS204 guide, so the connector is placed where they place
    it, at (32.8, 10.3). THE POSITIONS ARE ESTIMATED: the photograph has no scale and is taken at an
    angle. The label's middle line is not drawn, because this figure does not let it be read; the
    DCS204 guide's supply prints "-36~-72V" there, and that is not copied across.
  colour: >-
    estimated - the figure shows a blue latch and a blue connector on a back-to-front unit and its colours
    are the figure's, not sampled. The latch default is the library's Edgecore front-to-back red
    (common/psu-dc-650@2 draws it so) and the back-to-front build sets the library's blue on it from the
    device, as it set it on the generic supply; the handle #1c1f23 and the label #e6e9ec as
    edgecore/psu-48v-650-f@1 draws them.
  airflow: >-
    NOT STATED ON THE PART. The guide says the two supplies must match the fan tray's airflow (F2B or B2F,
    step 5 caution) and the device's two DC builds say which; the build sets the latch colour and the
    direction, as it did on the generic supply.
  power: >-
    guide - "48 VDC PSU, Power Rating 48 VDC, 650 Watts" (page 3, Hardware Specifications). A rating, not a
    draw.
  input: >-
    THE GUIDE PRINTS TWO RANGES. The specification table (page 3) reads "DC Input AS5912-54X: 36-75 VDC,
    12 A maximum" and, for the 5916-54XM, "-36 ~ -72 VDC, 16 A maximum"; the callout under the connector
    figure (page 2) reads "-36 - -72 VDC (black wire)". The table's line for this chassis carries no minus
    sign and a different upper limit, so the part states NO INPUT RANGE until the maker says which is right.
  wire: >-
    the caution under "Connect Power" (page 2): "#14 AWG (for -36 VDC to -72 VDC PSU) wire".
  connector: >-
    the supply composes common/pla03-receptacle@1 as `inlet`, the male Positronic PLA03 connector (its own
    provenance: the guide names the plug "Positronic PLA03F7000/AA connector", callout 1, and no document
    names this half); the female cable connector generic/pla03-plug@1 mates it, so the end of a cable is the
    plug in this connector, as a cord's is in an AC supply's C14.
  roles: >-
    guide and photograph - the label prints RTN at the top contact and an earth symbol at the bottom one, and
    the guide's callouts name the plug's wires 2 "-36 - -72 VDC (black wire)", 3 "DC Return (red wire)" and 4
    "Ground (yellow-green wire)". In the library's words (spec/schemas/dc.yaml): rtn, batt, gnd. THE WIRE
    ORDER AT THE PLUG IS NOT SETTLED: this guide's photograph shows the black wire above the red, the DCS203
    and DCS204 guides' photographs the red above the others, and generic/pla03-plug@1 draws the red on top
    as the supply's RTN label reads. The plug is not edited.
  no-dc-port: >-
    THE DC INPUT PORT IS NOT STATED HERE, ON PURPOSE. A port's path is the part's own path and its id
    (`psu-1/module/input`), and a port whose poles are a connector's contacts is offered only where that
    path's part is itself the connector; on a supply in a bay it is the supply, not the connector it
    composes, so a port stated here would be published and then not offered. The roles and the #14 AWG
    above are recorded for the port a later change can state, a minor on the devices that seat it.
  states: >-
    THE SAME AS THE AC SUPPLY BESIDE IT (common/psu-ac-650@3): no held document describes a status lamp
    on the supply, so none is drawn. `absent` stays.
  relief: >-
    NONE STATED. No document gives how far the latch, the handle or the connector stand off the face.
states: [absent]
elements:
  latch: {at: [0.0, 8.0], size: [7.8, 24.0], class: latch}
  handle: {at: [10.0, 8.0], size: [5.0, 24.0], class: handle}
  dc-inlet: {at: [32.8, 10.3], size: [10.36, 28.6], class: inlet}
parts:
  - {ref: common/pla03-receptacle@1, id: inlet, at: [32.8, 10.3]}
connection-points:
  power: {at: [37.98, 24.6], direction: rear}
