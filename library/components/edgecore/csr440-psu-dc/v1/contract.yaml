  features:
    - node: vent-field
      vent: 28
      confidence: estimated
      source: >-
        edgecore/csr440-psu-ac@1's own vent key, carried: the figures show a wire grid and no
        document states how deep the cavity behind it runs.
    - node: terminal
      out: 9.5
      confidence: estimated
      source: >-
        edgecore/csr440-psu-dc@1's own terminal key. The figures show the cover standing out of the
        face; how far is not stated, and 9.5 matches edgecore/csr310-psu-dc@1's estimate for a
        terminal block of this kind.
    - node: ground-stud
      out: 3.0
      confidence: estimated
      source: >-
        edgecore/csr440-psu-dc@1's own ground-stud key. The stud stands up off its bracket in the
        figures; how far is not stated.
    - node: handle
      uhandle: 27.0
      dia: 5.0
      confidence: estimated
      source: >-
        27 is borrowed, not measured, as edgecore/csr440-psu-ac@1's handle: the nearest published
        figure for a CRPS-class supply is UfiSpace's "1.06 inches". The figures dimension nothing.
    - node: latch
      out: 2.5
      confidence: estimated
      source: >-
        edgecore/csr440-psu-ac@1's own latch key, carried: the outline is read off the figure and
        its projection is not stated.
