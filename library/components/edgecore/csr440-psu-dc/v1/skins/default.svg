<svg xmlns="http://www.w3.org/2000/svg" width="53.8mm" height="39.4mm" viewBox="0 0 53.8 39.4">
  <!-- The CSR440's 48 VDC supply as the quick start's angled illustrations of its terminal end
       draw it, positions estimated: a dark wire-grid housing, a maroon latch at the upper left,
       a grey terminal cover with two openings facing out of the face, a ground stud on a pale
       bracket at the lower left and a black U-handle at the right. The printed label above the
       cover is not drawn. -->
  <defs>
    <pattern id="csr440-dc-grid" width="3.6" height="3.6" patternUnits="userSpaceOnUse">
      <rect x="0.4" y="0.4" width="2.8" height="2.8" fill="#1a1c1e"/>
    </pattern>
  </defs>
  <rect id="body" x="0" y="0" width="53.8" height="39.4" rx="0.5"
    fill="#525252" stroke="#9a9fa4" stroke-width="0.45"/>
  <rect x="0.8" y="0.8" width="52.2" height="37.8" rx="0.35"
    fill="none" stroke="#6c7075" stroke-width="0.22"/>
  <g id="vent-field">
    <rect x="2.00" y="7.00" width="44.00" height="30.50" fill="#66696b"/>
    <rect x="2.00" y="7.00" width="44.00" height="30.50" fill="url(#csr440-dc-grid)"/>
  </g>
  <g id="latch">
    <rect x="4.50" y="1.60" width="10.50" height="4.60" rx="0.8"
      fill="#6f585b" stroke="#4e3b3d" stroke-width="0.3"
      data-fill-from="latch-finish" data-stroke-from="latch-edge"/>
    <path d="M 8.80 2.40 V 5.40 M 10.60 2.40 V 5.40 M 12.40 2.40 V 5.40" stroke="#4e3b3d" stroke-width="0.35" fill="none"/>
  </g>
  <g id="ground-stud">
    <rect x="6.00" y="24.00" width="15.00" height="8.00" rx="0.5"
      fill="#9f9f9e" stroke="#858584" stroke-width="0.3"/>
    <circle cx="12.70" cy="28.00" r="2.40" fill="#b8b8b7" stroke="#858584" stroke-width="0.3"/>
    <circle cx="12.70" cy="28.00" r="1.10" fill="#858584"/>
  </g>
  <g id="terminal">
    <rect x="21.00" y="13.50" width="26.00" height="25.00" rx="0.6"
      fill="#888d91" stroke="#5f6468" stroke-width="0.35"/>
    <rect id="pole-1" x="30.00" y="19.50" width="4.40" height="9.00" rx="0.4" fill="#3a3d40" stroke="#5f6468" stroke-width="0.25"/>
    <rect id="pole-2" x="39.50" y="19.50" width="4.40" height="9.00" rx="0.4" fill="#3a3d40" stroke="#5f6468" stroke-width="0.25"/>
  </g>
  <g id="handle">
    <rect x="47.60" y="4.00" width="4.40" height="24.00" rx="2.20"
      fill="none" stroke="#474747" stroke-width="2.40"/>
    <rect x="47.60" y="4.00" width="4.40" height="24.00" rx="2.20"
      fill="none" stroke="#8a8a8a" stroke-width="0.35"/>
  </g>
</svg>
