  vent: {at: [5.60, 6.50], size: [14.00, 26.50], class: vent}
  handle: {at: [21.2, 7.30], size: [8.60, 25.00], class: handle}
  latch: {at: [0.80, 7.74], size: [2.90, 13.16], class: latch}
  inlet-well: {at: [31.4, 6.19], size: [17.40, 26.32], class: bezel}
  status: {at: [12.83, 3.15], size: [2.90, 2.90], class: led, states: ['off', 'ok', 'fault']}
fields:
  handle-finish: {label: Handle colour, type: text, default: '#c0453f'}
  latch-finish: {label: Latch colour, type: text, default: '#c0453f'}
parts:
  - {ref: std/c14-inlet@1, id: inlet, at: [30.1, 5.35], rotate: 270}
relief:
  wall: '#3a3e43'
  features:
    - node: vent
      vent: 12
      confidence: estimated
      source: >-
        The intake is open but no document gives a depth. 12 matches what this library gives
        other 1RU Edgecore supply intakes.
    - node: handle
      uhandle: 18
      dia: 2.6
      confidence: estimated
      source: >-
        A U standing off the face, gripped along its length and returning to the module at
        both ends - `uhandle`, not `bar`, for the reason the AIS800 supplies record: `bar`
        builds a tube on nothing. HOW FAR IT STANDS OFF IS NOT DIMENSIONED; 18 is the
        shortest projection this library gives a 1RU supply handle, because a 1RU face has
        little room for a deeper one.
    - node: latch
      out: 1.0
      confidence: estimated
      source: 'Drawn, not dimensioned - as every release tab in this library.'
    - node: inlet-well
      pocket: 2.2
      confidence: estimated
      source: >-
        The inlet sits in a recess whose walls the elevation shades; no depth is stated.
        2.2 puts the connector flange level with the module face.
skins: [default]
body:
  depth: 180
  color: '#8d9298'
  footprint: {at: [0, 0], size: [50.4, 38.7]}
