  latch-finish: {label: Latch colour, type: text, default: '#3d3d3f'}
parts:
  - {ref: common/screw-head@1, id: screw-1, at: [3.40, 2.00]}
  - {ref: common/screw-head@1, id: screw-2, at: [37.60, 2.00]}
relief:
  wall: '#3a3e43'
  features:
    - node: guard
      pocket: 2.4
      confidence: estimated
      source: >-
        edgecore/agr560-psu-ac@1's guard on the same shell, and estimated there too - no
        document gives a depth for this fan well.
        `pocket` AND NOT `sink`: nothing stands above this node, so a sink would have no
        floor to measure from and relief.js would collect it nowhere.
    - node: handle
      uhandle: 27
      dia: 6.6
      confidence: estimated
      source: >-
        ESTIMATED, NOT BORROWED: the chain ends at edgecore/ais800-64-psu-ac@1, which
        records 27 as an estimate against an isometric render. The attribute
        goes on `handle`, the whole group, because the face texture hides exactly the node
        that carries it; `dia` states the tube's 6.6 because the group is taller than the tube.
    - node: terminal-pocket
      pocket: 3.2
      confidence: estimated
      source: >-
        The block is a recess and the elevation shades its walls, but no document gives a
        depth. 3.2 matches edgecore/ais800-64-psu-dc@1's block, which is the same vendor's
        DC terminal recess and is also estimated.
    - node: bore-1
      sink: 3.0
      confidence: estimated
      source: >-
        The wells are drawn as round recesses with a stud down each one. HOW DEEP IS NOT
        STATED and the connector is named but not specified - see the device's
        dc-connector-identity gap. 3.0 below the block's own 3.2 pocket floor puts the stud
        head level with the block face, which is what the elevation shows.
    - node: bore-2
      sink: 3.0
      confidence: estimated
      source: >-
        The wells are drawn as round recesses with a stud down each one. HOW DEEP IS NOT
        STATED and the connector is named but not specified - see the device's
        dc-connector-identity gap. 3.0 below the block's own 3.2 pocket floor puts the stud
        head level with the block face, which is what the elevation shows.
    - node: stud-1
      top: 2.0
      confidence: estimated
      source: >-
        As the bores - the stud rises back out of its own well and its head is what a ring
        terminal lands on. 2.0 off a 3.0 floor leaves it 1.0 below the block face.
    - node: stud-2
      top: 2.0
      confidence: estimated
      source: >-
        As the bores - the stud rises back out of its own well and its head is what a ring
        terminal lands on. 2.0 off a 3.0 floor leaves it 1.0 below the block face.
    - node: latch
      out: 1.2
      confidence: estimated
      source: >-
        edgecore/agr560-psu-ac@1's latch on the same shell, and estimated there too - no
        document dimensions how far this tab stands off the face.
