  guard: {at: [1.00, 1.20], size: [41.90, 37.10], class: rotor}
  handle: {at: [6.60, 22.00], size: [30.70, 15.50], class: handle}
  terminal: {at: [47.30, 4.20], size: [18.70, 31.60], class: terminal}
  terminal-pocket: {at: [48.60, 5.50], size: [16.10, 29.00], class: terminal}
  latch: {at: [69.60, 10.50], size: [3.40, 18.50], class: latch}
fields:
