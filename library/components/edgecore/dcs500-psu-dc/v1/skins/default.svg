<svg xmlns="http://www.w3.org/2000/svg" width="50.9mm" height="39.4mm" viewBox="0 0 50.9 39.4">
  <!-- The DCS500's 850 W DC supply, as it sits in the bay: the AC supply's housing with a
       three-pole barrier block where the C14 inlet is, a black handle standing up the middle
       and the red release latch at the right end. Poles top to bottom: chassis ground,
       -36 - -72 VDC, RTN (the quick start's photograph, turned a half turn into the bay). -->
  <rect id="body" x="0" y="0" width="50.9" height="39.4" rx="0.4" fill="#c9cdd1" stroke="#6b7076" stroke-width="0.35"/>
  <g id="vent" fill="#16191c">
    <rect x="2.2" y="7.0" width="2.4" height="3.0"/><rect x="2.2" y="11.6" width="2.4" height="3.0"/>
    <rect x="2.2" y="16.2" width="2.4" height="3.0"/><rect x="2.2" y="20.8" width="2.4" height="3.0"/>
    <rect x="2.2" y="25.4" width="2.4" height="3.0"/>
    <rect x="32.6" y="4.4" width="3.2" height="3.2"/><rect x="37.2" y="4.4" width="3.2" height="3.2"/><rect x="41.8" y="4.4" width="3.2" height="3.2"/>
    <rect x="32.6" y="9.0" width="3.2" height="3.2"/><rect x="37.2" y="9.0" width="3.2" height="3.2"/><rect x="41.8" y="9.0" width="3.2" height="3.2"/>
    <rect x="32.6" y="13.6" width="3.2" height="3.2"/><rect x="37.2" y="13.6" width="3.2" height="3.2"/><rect x="41.8" y="13.6" width="3.2" height="3.2"/>
    <rect x="32.6" y="18.2" width="3.2" height="3.2"/><rect x="37.2" y="18.2" width="3.2" height="3.2"/>
    <rect x="32.6" y="22.8" width="3.2" height="3.2"/><rect x="37.2" y="22.8" width="3.2" height="3.2"/>
    <rect x="32.6" y="27.4" width="3.2" height="3.2"/><rect x="37.2" y="27.4" width="3.2" height="3.2"/>
  </g>
  <g id="terminal">
    <rect x="6.20" y="4.60" width="17.20" height="29.40" rx="0.6" fill="#53534e" stroke="#2e2f2c" stroke-width="0.30"/>
    <rect x="6.80" y="15.90" width="16.00" height="1.40" fill="#1d2121"/>
    <rect x="6.80" y="24.60" width="16.00" height="1.20" fill="#1d2121"/>
    <g id="pole-1">
      <rect x="11.30" y="8.70" width="7.00" height="6.00" rx="0.5" fill="#8b8883" stroke="#5a5854" stroke-width="0.2"/>
      <circle cx="14.80" cy="11.70" r="2.10" fill="#b0ada6" stroke="#6d6a65" stroke-width="0.2"/>
      <path d="M 13.40 11.70 H 16.20 M 14.80 10.30 V 13.10" stroke="#3a3a38" stroke-width="0.45" stroke-linecap="round"/>
    </g>
    <g id="pole-2">
      <rect x="11.30" y="18.00" width="7.00" height="6.00" rx="0.5" fill="#8b8883" stroke="#5a5854" stroke-width="0.2"/>
      <circle cx="14.80" cy="21.00" r="2.10" fill="#b0ada6" stroke="#6d6a65" stroke-width="0.2"/>
      <path d="M 13.40 21.00 H 16.20 M 14.80 19.60 V 22.40" stroke="#3a3a38" stroke-width="0.45" stroke-linecap="round"/>
    </g>
    <g id="pole-3">
      <rect x="11.30" y="26.40" width="7.00" height="6.00" rx="0.5" fill="#8b8883" stroke="#5a5854" stroke-width="0.2"/>
      <circle cx="14.80" cy="29.40" r="2.10" fill="#b0ada6" stroke="#6d6a65" stroke-width="0.2"/>
      <path d="M 13.40 29.40 H 16.20 M 14.80 28.00 V 30.80" stroke="#3a3a38" stroke-width="0.45" stroke-linecap="round"/>
    </g>
  </g>
  <g id="handle">
    <rect x="25.60" y="1.20" width="4.60" height="36.00" rx="2.20" fill="#242725" stroke="#0e1013" stroke-width="0.3"/>
    <rect x="26.90" y="3.20" width="2.00" height="32.00" rx="1.00" fill="none" stroke="#4d5258" stroke-width="0.35"/>
  </g>
  <g id="latch">
    <rect x="39.50" y="16.80" width="10.40" height="21.60" rx="1.00" fill="#b13933" stroke="#7d2b27" stroke-width="0.3" data-fill-from="latch-finish"/>
    <rect x="43.60" y="21.20" width="1.60" height="7.40" rx="0.6" fill="#f2f4f6"/>
  </g>
</svg>
