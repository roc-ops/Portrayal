<svg xmlns="http://www.w3.org/2000/svg" width="9.2mm" height="9.2mm" viewBox="0 0 9.2 9.2">
  <!-- The knob end on: a knurled cylinder 9.2 across (scaled off the CFP MSA
       module drawing). data-fill-from lets a host or a wrapper recolour it;
       the literal stroke is the shade of the default. -->
  <circle id="knob" cx="4.6" cy="4.6" r="4.6" fill="#6f6f6f" stroke="#444444"
          stroke-width="0.18" data-fill-from="latch-color" data-stroke-derive="latch-color"/>
  <!-- The cross recess the end view draws in the knob face, painted. -->
  <path id="cross" d="M 2.3 4.6 H 6.9 M 4.6 2.3 V 6.9" fill="none" stroke="#2a2f34"
        stroke-width="0.5" stroke-linecap="round"/>
</svg>
