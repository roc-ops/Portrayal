format: 1
kind: component
name: qsfp-cage
version: 2.0.0
class: port
profile: networking
description: Plain QSFP cage (no lane LEDs) - bezel around a std/qsfp-ganged
  aperture (v2 = the cage only - the coloured band under each aperture is PRINTED
  ON THE FACEPLATE, not part of the cage assembly, so it moved out to the device's
  panel.decor and the box no longer claims the 3mm of panel it sits on; the skin
  variants existed only to carry that band's colour and collapse into one)
size: {w: 19.5, h: 10.18}
attrs: {media: qsfp28, speed: 100g}
provenance:
  size: 'drawing-inferred (S9510-28DC HIG Fig 9) for the 19.5 width and the 0.6
    bezel flange above the opening; the height is then derived, not measured -
    0.6 + the 9.58 standard opening of std/qsfp-ganged = 10.18. The v1 box was
    13.0 because it painted the faceplate band as well as the cage. Below the
    opening the figure shows the band and the port number starting immediately,
    so this cage carries no bottom flange to speak of'
  aperture: standard (SFF-8661 via std/qsfp-ganged)
elements:
  cage: {at: [0.0, 0.0], size: [19.5, 10.18], class: cage}
parts:
  - {ref: std/qsfp-ganged@1, id: aperture, at: [0.575, 0.6]}
connection-points:
  net: {at: [9.75, 4.85], direction: front}
skins: [default]
