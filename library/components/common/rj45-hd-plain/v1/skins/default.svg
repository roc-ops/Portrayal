<svg xmlns="http://www.w3.org/2000/svg" width="14mm" height="12mm" viewBox="0 0 14 12">
  <!-- THE APERTURE GOES THROUGH THIS TOO. `behind: true` puts the
       composed jack before the skin, so a solid body rect covers it
       and the cavity and its conductors never appear. -->
  <path id="body" fill-rule="evenodd" fill="#1c1f23" d="
    M 0 0 h 14 v 12 h -14 z
    M 1.055 1.275 h 11.89 v 6.85 h -3.945 v 2.6 h -4 v -2.6 h -3.945 z"/>
  <path id="bezel" fill-rule="evenodd" fill="#c9cdd1" stroke="#9aa0a8" stroke-width="0.18" d="
    M 0.15 0.15 h 13.7 v 11.7 h -13.7 z
    M 1.055 1.275 h 11.89 v 6.85 h -3.945 v 2.6 h -4 v -2.6 h -3.945 z"/>
</svg>
