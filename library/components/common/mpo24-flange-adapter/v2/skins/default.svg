<svg xmlns="http://www.w3.org/2000/svg" width="30mm" height="11mm" viewBox="0 0 30 11">
  <!-- Flanged MPO/MTP bulkhead, 30.0 x 11.0, off the back of FS SKU 57016.
       Widths read across the rear render; heights are proportion (see the
       contract). The flange's ends are chamfered, the housing stands up in the
       middle, and the opening is keyed at the middle of its top edge.
       THE OPENING IS std/mpo@2's 12.9 x 8.0 (@2), centred where @1's 13.1 x
       7.0 was, on (15.0, 5.5) - the `mate` an MPO plug or cap seats on. Its
       figures are that part's ESTIMATE, not a reading here; the key slot above
       it is @1's, 3.0 x 0.7, carried up with the opening's top edge. -->
  <path id="flange" fill="#17191c" stroke="#08090a" stroke-width="0.2"
        d="M 1.2 0 H 28.8 L 30 1.2 V 9.8 L 28.8 11 H 1.2 L 0 9.8 V 1.2 Z"/>
  <!-- THE HOUSING IS A RING, NOT A LID. It stands 3.5 off the back (the
       contract's relief), and render.py raises a node with `out` to the END of
       the instance group whenever the component composes parts - here the two
       screws - so whatever this shape covers is covered in the drawing too. As
       a plain rect it painted over the opening, the plug and the whole MT end
       face: the port read as a blank slab in 2D, and in 3D as well, because a
       cavity's floor is cut from its own group rendered standalone. The keyed
       opening is an evenodd HOLE in it instead, the pattern
       common/lc-duplex-v-adapter@5 uses for its bores, so the end face behind
       shows through however late this paints. -->
  <path id="housing" fill-rule="evenodd" fill="#202326" stroke="#0c0d0e" stroke-width="0.2"
        d="M 7.1 0.3 H 22.9 Q 23.5 0.3 23.5 0.9 V 10.1 Q 23.5 10.7 22.9 10.7
           H 7.1 Q 6.5 10.7 6.5 10.1 V 0.9 Q 6.5 0.3 7.1 0.3 Z
           M 8.55 1.5 H 13.5 V 0.8 H 16.5 V 1.5 H 21.45 V 9.5 H 8.55 Z"/>
  <path id="opening" fill="#0b0c0e" stroke="#2c3035" stroke-width="0.2"
        d="M 8.55 1.5 H 13.5 V 0.8 H 16.5 V 1.5 H 21.45 V 9.5 H 8.55 Z"/>
  <!-- THE PLUG'S END FACE, as seen through the opening: the grey plug
       housing, and in it the MT ferrule - 6.4 x 2.5 with 24 fibres on
       the 0.25 MT pitch in two rows, between two guide pins 4.6 apart
       (the cassette's trunk end is MALE). Standard MT figures, not measured. -->
  <rect id="plug" x="9.6" y="2.9" width="10.8" height="5.3" rx="0.9"
        fill="#1a1d20" stroke="#5c636b" stroke-width="0.25"/>
  <rect id="ferrule" x="11.8" y="4.25" width="6.4" height="2.5" rx="0.25"
        fill="#3b4046" stroke="#23262a" stroke-width="0.1"/>
  <g id="fibres" fill="#c9a646">
      <circle id="1" cx="16.375" cy="5.75" r="0.075"/>
      <circle id="2" cx="16.125" cy="5.75" r="0.075"/>
      <circle id="3" cx="15.875" cy="5.75" r="0.075"/>
      <circle id="4" cx="15.625" cy="5.75" r="0.075"/>
      <circle id="5" cx="15.375" cy="5.75" r="0.075"/>
      <circle id="6" cx="15.125" cy="5.75" r="0.075"/>
      <circle id="7" cx="14.875" cy="5.75" r="0.075"/>
      <circle id="8" cx="14.625" cy="5.75" r="0.075"/>
      <circle id="9" cx="14.375" cy="5.75" r="0.075"/>
      <circle id="10" cx="14.125" cy="5.75" r="0.075"/>
      <circle id="11" cx="13.875" cy="5.75" r="0.075"/>
      <circle id="12" cx="13.625" cy="5.75" r="0.075"/>
      <circle id="13" cx="16.375" cy="5.25" r="0.075"/>
      <circle id="14" cx="16.125" cy="5.25" r="0.075"/>
      <circle id="15" cx="15.875" cy="5.25" r="0.075"/>
      <circle id="16" cx="15.625" cy="5.25" r="0.075"/>
      <circle id="17" cx="15.375" cy="5.25" r="0.075"/>
      <circle id="18" cx="15.125" cy="5.25" r="0.075"/>
      <circle id="19" cx="14.875" cy="5.25" r="0.075"/>
      <circle id="20" cx="14.625" cy="5.25" r="0.075"/>
      <circle id="21" cx="14.375" cy="5.25" r="0.075"/>
      <circle id="22" cx="14.125" cy="5.25" r="0.075"/>
      <circle id="23" cx="13.875" cy="5.25" r="0.075"/>
      <circle id="24" cx="13.625" cy="5.25" r="0.075"/>
  </g>
  <circle id="pin-left" cx="12.7" cy="5.5" r="0.35" fill="#c7ccd1"/>
  <circle id="pin-right" cx="17.3" cy="5.5" r="0.35" fill="#c7ccd1"/>
</svg>
