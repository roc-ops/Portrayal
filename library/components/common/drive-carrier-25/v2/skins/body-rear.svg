<svg xmlns="http://www.w3.org/2000/svg" width="17.868mm" height="79.4mm" viewBox="0 0 17.868 79.4">
  <!-- REAR, as seen from behind. `Body_7_4.004` is the only thing the CAD puts
       in this band - x 10.21..15.94, y 11.25..57.01, running z 111.20..123.20,
       so it reaches the back - and it is drawn as the plate it appears to be.
       NO CONNECTOR IS DRAWN. The carrier's back sits inside the cage in this
       scene, so there is no clean rear elevation to read one off, and the
       3.5-inch carrier's rear says the same of its own. -->
  <rect x="0" y="0" width="17.868" height="79.4" fill="#3c4247" stroke="#2a2e32" stroke-width="0.4"/>
  <rect x="9.87" y="11.41"
        width="5.54" height="46.40"
        rx="0.5" fill="#33383d" stroke="#2a2e32" stroke-width="0.25"/>
</svg>
