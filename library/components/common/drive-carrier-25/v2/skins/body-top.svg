<svg xmlns="http://www.w3.org/2000/svg" width="17.868mm" height="123.7mm" viewBox="0 0 17.868 123.7">
  <!-- TOP. Face (the bezel) at y=0.
       THE SPINE IS WHAT YOU SEE, not a drive label: `Body_6_4.002` spans
       x 2.23..14.74 of an 18.48 shell and runs z 0.69..125.15 - the whole depth -
       so on this face it covers nearly everything. The 2.5-inch caddy is a frame
       around a drive rather than a tray under one, which is why this face and the
       3.5-inch carrier's do not look alike. -->
