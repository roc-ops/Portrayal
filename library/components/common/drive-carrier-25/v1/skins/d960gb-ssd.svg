  <!-- head: the two glyphs ARE the lamps - they light up
       themselves, which is why there is no third dot between
       them. Dell KB 000413096 puts activity on the LEFT and
       status on the right AS THE FRONT PRESENTS THEM - and a rear
       bay lays this carrier down with rotate 270, which maps the
       left edge to the BOTTOM. The figure shows activity on top
       there, so the glyphs sit the other way round in the moulding
       than the sentence reads. The drawing follows the part. A BLANK HAS NEITHER: no drive to
       report on, so nothing to report it with. -->
  <g id="lamp-activity" transform="rotate(90 13.13 3.15)" fill="none" stroke="#c9ced3" stroke-width="0.34">
    <path d="M11.18 3.2 l1.0 0 0.6 -1.6 0.8 3.1 0.6 -1.5 0.9 0"/>
  </g>
