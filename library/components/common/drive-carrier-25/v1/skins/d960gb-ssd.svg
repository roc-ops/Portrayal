  <!-- WHAT DRIVE IS IN THIS CARRIER, in four lines of type. It was
       drawn as a QR code: at low resolution a dense block of small
       white glyphs on a dark square is indistinguishable from a
       matrix barcode, and the grid that replaced it carried no
       information at all. The values are this skin's; the layout is
       read from the figure. Rotated 90 so it reads along the
       carrier's long axis, as the figure shows it. -->
