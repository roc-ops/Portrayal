format: 1
kind: component
name: mpo-dust-cap
version: 1.0.0
class: cap
behaviour: occupies
mates: mpo
profile: networking
description: >-
  The grey dust cap FS ships in an MTP/MPO port - a 12.8 x 8.1 moulding drawn
  across the port's visible content, with a raised saddle grip to pull it out
  by. How much of that content is the cap and how much is the aperture's own
  bevelled mouth is NOT settled here, so 12.8 x 8.1 is an upper bound on the
  cap's face rather than a measurement of it (`size-notes`). An
  OCCUPANT of the aperture it plugs (std/mpo@1 and anything composing it), so
  it comes out, swaps for a plug, or leaves the port empty. THE ONLY ONE OF THE
  FOUR CAPS THAT IS NEW: the MPO adapters never drew a cap, so this is read off
  FS's own product renders rather than moved off an adapter, and every figure
  it carries is an estimate - see `size-notes` and `provenance.depth` for what
  the renders settle and what they do not. `common/` for the reason
  common/lc-boot@1 gives: no standard governs a cap's shape, only the interface
  it plugs.
size: {w: 12.8, h: 8.1}
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  THE PIXEL SPANS ARE MEASURED AND WHAT THEY ARE A READING OF IS NOT SETTLED,
  which is why both axes say `estimated` and not `photo-measured`. FS's face-on
  renders of SKU 35510 (the 12x MTP adapter panel) show all twelve ports
  CAPPED, and nothing in them draws a line between the cap's own outline and
  the bevelled mouth of the aperture it stands in. The panel mounts its
  adapters PORTRAIT, so the render's vertical reading is this part's width and
  its horizontal reading is its height.
  ORTHOGRAPHIC FIRST, because a reading off a perspective render is worth
  nothing whatever it is a reading of. The six ports of the lower row fit a
  straight line at a pitch of 81.850 px with a largest residual of 0.68 px -
  under 1% of the pitch - and a least-squares quadratic term of -0.036 px per
  index squared, which over the whole row is under a pixel. Both rows read the
  same size to the pixel (74-75 px by 46-47 px, twelve ports), which a
  perspective view of a 35 mm-tall plate could not give. Nothing here is fitted
  to a curve because there is no curve to fit.
  THE SCALE IS THE RENDER'S OWN PRINTED DIMENSION: the plate spans 633 px
  against its printed 4.29 in (108.97 mm), 5.809 px/mm, cross-checked on the
  printed 1.38 in height (35.05 mm), which reads 205 px, 5.848 px/mm - the two
  0.67% apart.
  THE SPANS: each port's content measures 74.5 px on the long axis (74-75
  across all twelve, both rows, on two renders of the same panel) and 47 px on
  the short (46-47), which at 5.809 px/mm is 12.82 and 8.09. Inside that sits a
  brighter block of 59 by 21 px, 10.16 by 3.62.
  WHICH OF THE TWO THE CAP IS. The strong alternative - that the 12.82 x 8.09
  content IS the aperture's bevelled mouth and the bright block is the cap
  sitting flush in it - is EXCLUDED, but only by the corpus and not by the
  image: a cap filling an MPO opening cannot be 3.62 on its short axis, because
  std/mpo@1 gives that opening 5.6, and the oblique renders show a saddle
  standing off every port, which is what a bright block in the middle of a port
  looks like seen end-on. THE WEAK ALTERNATIVE IS NOT EXCLUDED: some part of
  the 12.82 x 8.09 may be the aperture's own bevel rather than the cap. So
  these figures are an UPPER BOUND on the cap's face adopted as its size, and
  if a caliper or a drawing ever settles the mouth, this part gets smaller and
  not larger.
unplaced: >-
  nothing declares it yet. A cap is the SHIPPED state of an idle port and is
  declared as the aperture's `default:` on the adapter that composes it
  (docs/pluggables-caps-design.md, "The shipped default"); that step is the
  adapters' own, and until it lands no device reaches this part. It is
  exercised as a configured occupant in spec/tests/test_dust_caps.py.
provenance:
  size: >-
    ESTIMATED, BOTH AXES - see size-notes for the render, the orthographic
    check, the scale, and which of two readings the figures assume.
    WHAT THIS PART DOES NOT CLAIM. It does not claim to overhang the aperture
    it plugs. HOW THE CAP'S FACE AND THE MOUTH RELATE IS NOT SETTLED, and it
    cannot be settled from here, because the only comparison available depends
    on a reading of std/mpo@1 that this contract itself calls into question
    (see `aperture-doubt`). Conditionally: IF that part's 5.4-to-8.5 bracket is
    a reading of ONE port's short axis, where 8.5 is the outer edge of the
    bevel, then 8.09 here sits inside it - which is what an object standing in
    the mouth does and not what a flange lying over it does. IF the bracket is
    instead the spread of a detection run across the two rows, which is what
    that part's own note literally says, the two numbers measure different
    things and the comparison says nothing at all. Neither reading is
    established. The drawing here - a cap the size of the port's visible
    content, inside common/mpo-adapter@1's 13.8 x 9.4 - is the adopted reading
    and not a finding, and it is not evidence for either branch.
  aperture-doubt: >-
    A HYPOTHESIS ABOUT std/mpo@1, RECORDED BECAUSE IT IS WORTH TESTING AND NOT
    BECAUSE ANYTHING HERE ESTABLISHES IT. std/mpo@1 is 7.8 x 5.6 at
    `confidence: estimated`, and standards.yaml's `mpo-adapter` entry says the
    detection 'catches a bevelled interior and reads 5.4 to 8.5 across the
    rows'. Both 7.8 and 5.6 fall inside that one bracket, and on the same
    render the port's long axis reads 12.8 against a short axis of 8.1 - an
    aspect a 7.8 x 5.6 opening does not have. (An MPO connector body is
    commonly quoted at about 12.4 by 6.4; THAT IS GENERAL KNOWLEDGE AND NO
    DOCUMENT HELD IN THIS CORPUS STATES IT, so it is mentioned as the reason
    somebody might look and not used as evidence.) That is consistent with 7.8
    and 5.6 being two thresholds on ONE axis rather than two axes, and it would
    mean the aperture is drawn far too short. IT IS A SUSPICION, NOT A
    FINDING: nothing here re-derives std/mpo@1, that part's own note describes
    a reading across the rows rather than along one port, and a caliper or
    IEC 61754-7 settles it. Nothing on this cap depends on the answer.
  mate: >-
    the centre of the 12.8 x 8.1 face, (6.4, 4.05) - the centre of the cap is
    where its spigot is, and std/mpo@1's own `mate` is the centre of its
    opening. Seated on common/mpo-adapter@1 (whose composed aperture puts that
    point at (6.9, 4.7)) this draws the cap at (0.5, 0.65), centred on the
    13.8 x 9.4 adapter, which is where the render shows it.
  grip: >-
    10.2 x 3.6, CENTRED. The saddle's top bar reads 59 px on the port's long
    axis (58-60 across the eight ports whose bar separates cleanly from the lit
    chamfer) and 21 px on the short (21-22), which at 5.809 px/mm is 10.16 and
    3.62. The spans are measured; that they are the BAR rather than the whole
    cap is the reading size-notes argues for, so this figure carries the same
    estimate and the same caveat as `size`. Its centre sits within 0.2 mm of
    the port's in the short axis and within 0.8 mm in the long; CENTRED IS A
    CHOICE, adopted because the spread is lighting and not a shape, and
    recorded as a choice the way fs/fhd-2mtp12-lc-rear@1 records its own
    symmetry assumption.
  depth: >-
    ESTIMATED, BOTH FIGURES, AND NO SOURCE HELD HERE DIMENSIONS EITHER. The
    only views that show the cap standing out of the panel - 35510.C, .D, .E
    and .F - are PERSPECTIVE, not oblique-but-parallel: on 35510.F the plate's
    own width swells from 649 px at its top edge to 664 px at its bottom, so
    nothing on it is measurable the way the face-on render is.
    AND THAT VIEW CANNOT BE UNFOLDED EITHER, which is the part worth writing
    down so nobody tries again. A saddle's silhouette on it mixes two things -
    how far the cap stands off the plate, and how much of the cap's own
    in-plane length is foreshortened into the same direction - and separating
    them needs the view angle. Recovering the angle needs one feature
    identified on two rows a known 15.97 apart, and on that render the blue
    shapes above each near-row saddle cannot be told apart from the near cap's
    own stem with any confidence. An earlier pass here DID print a derivation,
    got 10.3 to 11.0, and then added common/mpo-adapter@1's 1.2 bezel to a
    figure already measured from the plate - double-counting it, and landing
    above the ceiling its own arithmetic set. The derivation is withdrawn
    rather than patched.
    SO `out: 8.0` ON THE GRIP IS A MODELLING CHOICE, NOT A READING OF
    ANYTHING. No document held here dimensions an MTP cap, and no render held
    here can be made to. A ratio inside one image was offered for it in an
    earlier pass - that the saddle rises by roughly the width of the port - and
    it is withdrawn too: protrusion against in-plane width is exactly the
    quantity the paragraph above says cannot be separated without the view
    angle, the only ratio this file ever printed came out nearer 1.4 port
    widths, and the identification of which pixels are the saddle is itself
    unsupported. What constrains 8.0 is only this: it must stand taller than
    the cap's own face, so the grip reads as a grip, and it must be plausible
    for something a hand pulls a cap out by. Anything in that range would draw
    the same picture, and nothing here prefers 8.0 over its neighbours.
    THE CAP'S OWN FACE, 2.5, IS WEAKER STILL and nothing whatever dimensions
    it: it is set so the cap's face shows at the adapter face rather than
    sitting behind common/mpo-adapter@1's own estimated 1.2 bezel, which is the
    only constraint held. Replace both the moment anything states one, exactly
    as std/mpo@1 says of its own 9.0 recess.
    NOTE THE SEAT IS THE PANEL. std/mpo@1's `mate` sits `on:` nothing, so it
    presents a lift of 0.0 and an occupant is seated at the panel plane, not on
    the adapter's bezel - which is why both figures here are absolute from the
    panel and why clearing that bezel has to be done by hand rather than
    arriving with the seat.
  colour: >-
    #808692 for the cap and #b3b6bc for the grip, sampled off 57341.E.jpg -
    FS's render of the FHD 2x MTP-12 cassette's back, which lays two of these
    caps loose on a white ground. Over 12,281 cap pixels the median is
    rgb(128,134,146) and the lit faces (the brightest 30%) median
    rgb(179,182,188); the grip is the face that points at the viewer, so it
    takes the lit figure. 35510's own renders read much bluer (#616f85 and
    #acbcd9) under that shot's key light and are not used for colour.
  pitch-gap: >-
    NOT USED HERE, BUT MEASURED IN PASSING AND WORTH RECORDING. On the scale
    above, 35510's column pitch reads 14.09 and its row pitch 16.16, where
    common/mpo-adapter@1 carries 13.8 and 15.97 off the same render. The
    difference is about 2% and is the scale, not the geometry: 13.8 implies
    5.93 px/mm, which would make the plate 106.8 mm rather than its printed
    108.97. Nothing on this cap depends on either figure.
  face-detail-gap: >-
    the moulded FS mark on the saddle's side (visible on 57341.E), the ribbed
    spigot that enters the adapter, and the saddle's waisted profile are not
    drawn - this face is the cap's outline and the bar, which is what a front
    view shows. The spigot is inside the opening and never visible, the same
    omission common/lc-dust-cap@1 records.
elements:
  body: {at: [0.0, 0.0], size: [12.8, 8.1], class: cap}
connection-points:
  mate: {at: [6.4, 4.05], direction: front}
relief:
  features:
    - node: body
      out: 2.5
      color: '#808692'
      confidence: estimated
      source: >-
        common/mpo-dust-cap@1's own `provenance.depth`. NOTHING DIMENSIONS IT.
        2.5 is set so the cap's face shows at the adapter face rather than
        behind common/mpo-adapter@1's own estimated 1.2 bezel, which is the
        only constraint held. std/mpo@1 presents no lift, so this is absolute
        from the panel.
    - node: grip
      out: 8.0
      lift: 2.5
      color: '#b3b6bc'
      confidence: estimated
      source: >-
        common/mpo-dust-cap@1's own `provenance.depth`. A MODELLING CHOICE AND
        NOT A READING: every view along this axis is a perspective render, none
        of them can be unfolded, and no document held here dimensions an MTP
        cap - so 8.0 is derived from nothing. It is constrained only by having
        to stand taller than the cap's face, so the grip reads as a grip, and
        by being plausible for a pull grip. RAISED, not recessed, so `out` and
        not `pocket`, and it stands on the cap's own front - hence `lift: 2.5`,
        which lifts are summed down the tree to reach.
skins: [default]
