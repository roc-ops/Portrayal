format: 1
kind: component
name: mpo-dust-cap
version: 1.0.0
class: cap
behaviour: occupies
mates: mpo
profile: networking
description: >-
  The grey dust cap FS ships in an MTP/MPO port - a 12.8 x 8.1 moulding filling
  the opening, with a raised saddle grip across it to pull it out by. An
  OCCUPANT of the aperture it plugs (std/mpo@1 and anything composing it), so
  it comes out, swaps for a plug, or leaves the port empty. THE ONLY ONE OF THE
  FOUR CAPS THAT IS NEW: the MPO adapters never drew a cap, so this is read off
  FS's own product renders rather than moved off an adapter. `common/` for the
  reason common/lc-boot@1 gives: no standard governs a cap's shape, only the
  interface it plugs.
size: {w: 12.8, h: 8.1}
size-confidence: {w: photo-measured, h: photo-measured}
size-notes: >-
  BOTH AXES MEASURED, ON AN ORTHOGRAPHIC RENDER THAT WAS CHECKED BEFORE IT WAS
  USED, and the SHORT axis is the one that disagrees with something. FS's
  face-on renders of SKU 35510 (the 12x MTP adapter panel) show all twelve
  ports capped; the panel mounts its adapters PORTRAIT, so the render's
  vertical reading is this part's width and its horizontal reading is this
  part's height.
  ORTHOGRAPHIC FIRST. The six ports of the lower row fit a straight line at a
  pitch of 81.850 px with a largest residual of 0.68 px - under 1% of the
  pitch - and a least-squares quadratic term of -0.036 px per index squared,
  which over the whole row is under a pixel. Both rows read the same size to
  the pixel (74-75 px by 46-47 px, twelve ports), which a perspective view of a
  35 mm-tall plate could not give. Nothing here is fitted to a curve because
  there is no curve to fit.
  THE SCALE IS THE RENDER'S OWN PRINTED DIMENSION: the plate spans 633 px
  against its printed 4.29 in (108.97 mm), 5.809 px/mm, cross-checked on the
  printed 1.38 in height (35.05 mm), which reads 205 px, 5.848 px/mm - the two
  0.67% apart.
  THE READINGS: each port's content measures 74.5 px on the long axis (74-75
  across all twelve, both rows, on two renders of the same panel) and 47 px on
  the short (46-47), which at 5.809 px/mm is 12.82 and 8.09.
unplaced: >-
  nothing declares it yet. A cap is the SHIPPED state of an idle port and is
  declared as the aperture's `default:` on the adapter that composes it
  (docs/pluggables-caps-design.md, "The shipped default"); that step is the
  adapters' own, and until it lands no device reaches this part. It is
  exercised as a configured occupant in spec/tests/test_dust_caps.py.
provenance:
  size: >-
    photo-measured, both axes - see size-notes for the render, the
    orthographic check and the scale.
    IT IS BIGGER THAN THE APERTURE IT PLUGS, AND THAT IS NOT AN ERROR ON THIS
    PART. std/mpo@1 is 7.8 x 5.6 and says of itself that the figure is
    ESTIMATED - 'the opening's own edges are bevelled and read 5.4 to 8.5
    across the two rows'. Both of those numbers are readings of the SHORT axis
    of the same portrait port at two thresholds on this same render, 8.5 where
    the bevel starts and 5.4 where it ends, and 8.09 here is a third reading of
    that same short axis; the 12.8 LONG axis is not a figure std/mpo@1 holds at
    all. So this cap overhangs that aperture, as a flanged cap overhangs the
    hole it plugs, and it sits comfortably inside the 13.8 x 9.4 of
    common/mpo-adapter@1 that carries it. RE-READING std/mpo@1's OWN APERTURE
    IS NOT THIS TASK'S - it is a std/ part every MPO in the library composes -
    but the disagreement is recorded here rather than left for someone to find
    by eye.
  mate: >-
    the centre of the 12.8 x 8.1 face, (6.4, 4.05) - the centre of the cap is
    where its spigot is, and std/mpo@1's own `mate` is the centre of its
    opening. Seated on common/mpo-adapter@1 (whose composed aperture puts that
    point at (6.9, 4.7)) this draws the cap at (0.5, 0.65), centred on the
    13.8 x 9.4 adapter, which is where the render shows it.
  grip: >-
    10.2 x 3.6, CENTRED, photo-measured on the same renders: the saddle's top
    bar reads 59 px on the port's long axis (58-60 across the eight ports whose
    bar separates cleanly from the lit chamfer) and 21 px on the short (21-22),
    which at 5.809 px/mm is 10.16 and 3.62. Its centre sits within 0.2 mm of
    the port's in the short axis and within 0.8 mm in the long; CENTRED IS A
    CHOICE, adopted because the spread is lighting and not a shape, and
    recorded as a choice the way fs/fhd-2mtp12-lc-rear@1 records its own
    symmetry assumption.
  depth: >-
    ESTIMATED, BOTH FIGURES, AND NO ORTHOGRAPHIC VIEW ALONG THIS AXIS IS HELD.
    The renders that show the cap standing out of the panel (35510.C, .D, .E
    and .F) are PERSPECTIVE, not oblique-but-parallel: on 35510.F the plate's
    own width swells from 649 px at its top edge to 664 px at its bottom, so
    nothing on it is measurable the way the face-on render is.
    WHAT THAT VIEW SUPPORTS ANYWAY, stated as the estimate it is: one near-row
    cap's saddle silhouette stands 72 px above the plate face, while the same
    cap's short axis - 8.09 mm, measured face-on - reads 50-53 px across on the
    same view, giving 6.30 px/mm in the plane of the plate. Splitting that 72
    px into the part that is protrusion and the part that is the cap's own
    foreshortened long axis needs the view angle, which nothing gives; but the
    in-plane term is small enough that the answer barely moves - the saddle
    stands 10.3 mm proud at a 60-degree tilt, 10.5 at 75 and 11.0 at 85. The
    adapter face it stands on is common/mpo-adapter@1's bezel, itself an
    estimated 1.2 from the panel, so the saddle's top is 11.5 to 12.2 from the
    panel and `out: 11.5` takes the LOW end - in a perspective view the scale
    at the cap's tip is larger than at its base, which makes the reading an
    over-read.
    THE CAP'S OWN FACE, 2.5, IS THE WEAKER OF THE TWO and nothing dimensions
    it: it is the flange plate that stops against the adapter face, and 2.5
    puts it 1.3 in front of that face, which is the only thing constraining
    it. Replace it the moment anything states one, exactly as std/mpo@1 says
    of its own 9.0 recess.
    NOTE THE SEAT IS THE PANEL. std/mpo@1's `mate` sits `on:` nothing, so it
    presents a lift of 0.0 and an occupant is seated at the panel plane, not on
    the adapter's bezel - which is why both figures here are absolute from the
    panel and why the 1.2 has to be added by hand above rather than arriving
    with the seat.
  colour: >-
    #808692 for the cap and #b3b6bc for the grip, sampled off 57341.E.jpg -
    FS's render of the FHD 2x MTP-12 cassette's back, which lays two of these
    caps loose on a white ground. Over 12,281 cap pixels the median is
    rgb(128,134,146) and the lit faces (the brightest 30%) median
    rgb(179,182,188); the grip is the face that points at the viewer, so it
    takes the lit figure. 35510's own renders read much bluer (#616f85 and
    #acbcd9) under that shot's key light and are not used for colour.
  pitch-gap: >-
    NOT USED HERE, BUT MEASURED IN PASSING AND WORTH RECORDING. On the scale
    above, 35510's column pitch reads 14.09 and its row pitch 16.16, where
    common/mpo-adapter@1 carries 13.8 and 15.97 off the same render. The
    difference is about 2% and is the scale, not the geometry: 13.8 implies
    5.93 px/mm, which would make the plate 106.8 mm rather than its printed
    108.97. Nothing on this cap depends on either figure.
  face-detail-gap: >-
    the moulded FS mark on the saddle's side (visible on 57341.E), the ribbed
    spigot that enters the adapter, and the saddle's waisted profile are not
    drawn - this face is the flange and the bar, which is what a front view
    shows. The spigot is inside the opening and never visible, the same
    omission common/lc-dust-cap@1 records.
elements:
  body: {at: [0.0, 0.0], size: [12.8, 8.1], class: cap}
connection-points:
  mate: {at: [6.4, 4.05], direction: front}
relief:
  features:
    - node: body
      out: 2.5
      color: '#808692'
      confidence: estimated
      source: >-
        common/mpo-dust-cap@1's own `provenance.depth` - the flange plate that
        stops against the adapter face. Nothing dimensions it; 2.5 puts it 1.3
        in front of common/mpo-adapter@1's own estimated 1.2 bezel, which is
        the only constraint held. std/mpo@1 presents no lift, so this is
        absolute from the panel.
    - node: grip
      out: 11.5
      lift: 2.5
      color: '#b3b6bc'
      confidence: estimated
      source: >-
        common/mpo-dust-cap@1's own `provenance.depth` - the saddle stands
        10.3 to 11.0 proud of the adapter face on 35510.F, a PERSPECTIVE
        render, over the plausible range of view angle; on the bezel's 1.2 that
        is 11.5 to 12.2 from the panel, and 11.5 is the low end because
        perspective makes the reading an over-read. RAISED, not recessed, so
        `out` and not `pocket`, and it stands on the cap's own front - hence
        `lift: 2.5`, which lifts are summed down the tree to reach.
skins: [default]
