<svg width="14.5mm" height="10.0mm" viewBox="0 0 14.5 10.0" xmlns="http://www.w3.org/2000/svg">
  <!-- End view, the mouth the plug enters - the boot's OWN body
       (provenance.size), which is the 10 body and NOT the 15.5 silhouette
       including the latch-slot tab. The bore is the EASE J0072 upper end
       view's inner opening: its 11.9 +/-0.5 width is the drawing's callout,
       its 8.12 height is measured off that same view (provenance.bore) - it
       used to be an invented 8.5 citing the 11.9's callout for both. Centred
       on the shared axis (provenance.axis). -->
  <rect id="body" x="0.0" y="0.0" width="14.5" height="10.0" rx="1.0" ry="1.0" class="boot" fill="#3d4147"/>
  <rect id="bore" x="1.3" y="0.94" width="11.9" height="8.12" rx="0.7" ry="0.7" fill="#17181a"/>
</svg>
