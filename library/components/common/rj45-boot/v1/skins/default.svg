<svg width="14.5mm" height="10.0mm" viewBox="0 0 14.5 10.0" xmlns="http://www.w3.org/2000/svg">
  <!-- End view, the mouth the plug enters - sized to the boot's OWN body
       (provenance.size), not borrowed from the plug the way common/lc-boot@1
       borrows its width. The bore is the EASE J0072 11.9 +/-0.5 inner
       opening, centred on the shared axis (provenance.axis). -->
  <rect id="body" x="0.0" y="0.0" width="14.5" height="10.0" rx="1.0" ry="1.0" class="boot" fill="#3d4147"/>
  <rect id="bore" x="1.3" y="0.75" width="11.9" height="8.5" rx="0.7" ry="0.7" fill="#17181a"/>
</svg>
