<svg xmlns="http://www.w3.org/2000/svg" width="9.4mm" height="12.0mm" viewBox="0 0 9.4 12.0">
  <!-- Panel-mount SC duplex adapter, 9.4 x 12.0, geometry read off FS's
       face-on render of SKU 57058 (an FHD SC duplex adapter panel face).

       STACKED, NOT ABREAST. The two SC ports sit one over the other, which is
       what 57058's own panel numbering shows: each block carries a higher
       number above a lower one (2 over 1, 4 over 3, and so on across the
       row), the opposite of common/lc-duplex-adapter's side-by-side pair.
       Neither port's own bore is dimensioned by anything held here, so both
       are drawn as plain dark rectangles rather than a keyed opening.

       The blue flange across the top is what the measurement script actually
       detected - 57058's adapters are dark grey bodies that read pale
       nowhere, so the pitch and width came from that flange's colour rather
       than from the ports themselves. -->
  <rect id="bezel" x="0" y="0" width="9.4" height="12.0" rx="0.4"
        fill="#2a2e33" stroke="#15181a" stroke-width="0.2"/>
  <rect id="flange" x="0.7" y="0.6" width="8.0" height="1.0" rx="0.15"
        fill="#2f6fed"/>
  <rect id="port-upper" x="1.7" y="2.2" width="6.0" height="4.0" rx="0.2"
        fill="#1c1f22"/>
  <rect id="port-lower" x="1.7" y="6.6" width="6.0" height="4.0" rx="0.2"
        fill="#1c1f22"/>
</svg>
