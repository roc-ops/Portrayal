<svg xmlns="http://www.w3.org/2000/svg" width="9.4mm" height="25.4mm" viewBox="0 0 9.4 25.4">
  <!-- Panel-mount SC duplex adapter, 9.4 x 25.4, as fitted to an FS FHD SC
       panel - read off FS's face-on render of SKU 57058.

       THE FRAME IS RAISED, and a raised part carries its art on its front
       face, so the two SC openings are HOLES in it - std/sc-bore@1's outline,
       7.5 x 9.0 at x 0.95-8.45 with the key slot out through the left wall -
       centred in two 12.7 cells. The black caps then plug them, as shipped. -->
  <path id="bezel" fill-rule="evenodd" fill="#3078c0" stroke="#1f5a93" stroke-width="0.15"
        d="M 0.3 0 H 9.1 Q 9.4 0 9.4 0.3 V 25.1 Q 9.4 25.4 9.1 25.4 H 0.3 Q 0 25.4 0 25.1 V 0.3 Q 0 0 0.3 0 Z
           M 0.95 1.85 H 8.45 V 10.85 H 0.95 V 7.40 H 0.06 V 5.30 H 0.95 Z
           M 0.95 14.55 H 8.45 V 23.55 H 0.95 V 20.10 H 0.06 V 18.00 H 0.95 Z"/>
  <!-- each cap and its raised grip as one group: a node standing `out` is
       moved to the end of the instance, and a sibling left behind it would be
       painted over by the cap it belongs to -->
  <g id="cap-tx">
    <rect x="0.3" y="0.9" width="8.8" height="11.45" rx="0.5" fill="#2b2c2e" stroke="#19191a" stroke-width="0.12"/>
    <rect id="grip-tx" x="2.75" y="3.125" width="3.9" height="7.0" rx="0.45" fill="#46484b"/>
  </g>
  <g id="cap-rx">
    <rect x="0.3" y="13.6" width="8.8" height="11.45" rx="0.5" fill="#2b2c2e" stroke="#19191a" stroke-width="0.12"/>
    <rect id="grip-rx" x="2.75" y="15.825" width="3.9" height="7.0" rx="0.45" fill="#46484b"/>
  </g>
</svg>
