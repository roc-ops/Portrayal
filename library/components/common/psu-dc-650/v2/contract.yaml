format: 1
kind: module
name: psu-dc-650
version: 2.6.1
class: psu
behaviour: fills
profile: networking
description: 650W -48V DC PSU module - blue fold-out handle, terminal cover (v2 = photo-measured 54mm)
size: {w: 54.0, h: 40.0}
attrs: {power-output-w: 650, input: dc, voltage: '-48v', inlet: dc-terminal}
provenance:
  airflow-colour-convention: >-
    EDGECORE COLOUR-CODES AIRFLOW ON THIS PART, AND SAYS SO IN EIGHT DOCUMENTS.
    Every one carries the same Airflow Reversal instruction: take out the
    front-to-back (F2B) fan trays and PSUs, which have red handles and red
    release latches, and fit back-to-front (B2F) ones, which have blue handles
    and blue release latches.
    The seven staged are the AIS800-32D and AIS800-32O quick start guides, the
    AMX3200's, and the DCS201, DCS240, DCS510 and DCS511 guides; the eighth is the
    DCS204 (AS7726-32X) guide, which this library registers as a reference and
    quotes on that device already.
    SO THE DEFAULT ON THE FIELDS BELOW IS THE F2B COLOUR, not a neutral one, and a
    back-to-front build overrides it per configuration. That is why the red is a
    default rather than a fixed fill: one part, two colours, decided by which
    airflow variant is installed.
    IT IS A FACT ABOUT THIS PART AND NOT ABOUT ANY CHASSIS, which is why it is
    recorded here. Three chassis in this library offer B2F builds - AS5912-54X,
    AS7326-56X and AS7726-32X - and all three seat this same component.
    See roc-ops/Portrayal#277.
  states: >-
    THE SAME AS THE AC SUPPLY BESIDE IT: a common/ generic seated across three
    Edgecore families, no held document describing a status lamp on it, and a lamp
    drawn on a generic would be one position invented for all of them. #212's
    argument for the fan generics, unchanged. `ok` and `fail` go; `absent` stays.
  inlet: >-
    transcribed from this contract - the description names a 'terminal cover' and the face
    carries a `dc-inlet` element of class `inlet`. Nothing new was measured.
  power: >-
    datasheet - the Edgecore boxes this generic serves state it directly. The DCS204
    datasheet (AS7726-32X): 'PSUs: 2 redundant, load-sharing, hot-swappable 650W AC or -48
    VDC', with the DC input line '-36 - -72 VDC (16A/650 W max.)'. The DCS203 quick-start
    guide repeats '-36 VDC to -72 VDC, 650 Watts'. The AC and DC supplies are rated alike.
    NO MODEL IS SET ON THIS CONTRACT and that is deliberate: this is a `common/` generic
    standing for the 650 W CRPS supply across three Edgecore chassis. What the datasheets
    fix is the RATING, which the form factor and the chassis both share.
  body: same enclosure form factor as the AC unit (photo-measured); DC-specific
    side art pending its own photos
  size: photo-measured (rear overlay; body ~45mm + fold-out handle)
  elements: estimated from AC v2 + angled DC photo
states: [absent]
