format: 1
kind: module
name: psu-dc-650
version: 1.3.0
class: psu
behaviour: fills
profile: networking
description: 650W -48V DC PSU module (Edgecore PSU-DC-650B family) — same footprint as the AC unit, DC terminal input
unplaced: >-
  superseded by `common/psu-dc-650@2`, which the Edgecore devices place. This major's
  footprint was borrowed from the AC unit because no DC photo existed. Kept pending
  roc-ops/Portrayal#172; not a part waiting for a device.
size: {w: 56.0, h: 40.0}
attrs: {power-output-w: 650, input: dc, voltage: '-48v'}
provenance:
  power: >-
    datasheet - the Edgecore boxes this generic serves state it directly. The DCS204
    datasheet (AS7726-32X): 'PSUs: 2 redundant, load-sharing, hot-swappable 650W AC or -48
    VDC', with the DC input line '-36 - -72 VDC (16A/650 W max.)'. The DCS203 quick-start
    guide repeats '-36 VDC to -72 VDC, 650 Watts'. The AC and DC supplies are rated alike.
    NO MODEL IS SET ON THIS CONTRACT and that is deliberate: this is a `common/` generic
    standing for the 650 W CRPS supply across three Edgecore chassis. What the datasheets
    fix is the RATING, which the form factor and the chassis both share.
  size: same footprint as psu-ac-650 (datasheet lists AC and DC PSU SKUs; no DC photo available)
  elements: 'photo-measured (angled install-guide photo: blue latch + blue terminal cover)'
states: [ok, fail, absent]
elements:
  latch: {at: [2.0, 14.0], size: [6.0, 7.0], class: latch}
  handle: {at: [10.0, 8.0], size: [5.0, 24.0], class: handle}
  dc-inlet: {at: [20.5, 4.0], size: [23.0, 32.0], class: inlet}
connection-points:
  power: {at: [32.0, 20.0], direction: rear}
skins: [default]
