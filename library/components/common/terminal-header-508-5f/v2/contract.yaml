format: 1
kind: component
name: terminal-header-508-5f
version: 2.0.0
class: inlet
behaviour: mounts
profile: networking
conforms: terminal-508-5-header
interface: terminal-508-5
description: >-
  Five-position pluggable terminal HEADER on a 5.08 mm pitch with a threaded flange at
  each end - the green receptacle a screw-clamp plug seats in and is then screwed down
  to. The power input of the AurCore AIS industrial switches, wired `+ - earth + -` for
  two redundant DC feeds. Drawn empty, as the vendor photographs it: the plug ships in
  the box. Pole names are printed on the housing beside it, so the part carries none.
size: {w: 35.56, h: 8.6, d: 12.0}
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
attrs: {media: dc-terminal, positions: 5, pitch-mm: 5.08}
provenance:
  size: >-
    DATASHEET - Phoenix Contact MSTB 2,5/ 5-GF-5,08 (1776537), the 5.08 mm threaded-flange
    PCB header family this part is: width [w] 35.56 mm, length [l] 12 mm, and the
    INSTALLED HEIGHT 8.6 (#873). The sheet's [h] is 12.1, which counts the 3.5 solder pin
    under the board; the face is the mating face, board to housing top, so it is drawn
    8.6, as the registry's `terminal-508-5-header` now records and this part claims. 1.x
    drew 12.1. The depth 12.0 is the [l], checked and unchanged. The cells, contacts and
    inserts keep the fractions of the height 1.x drew, an estimate of the openings rather
    than a reading. Checked against the AurCore AIS4001P top face in the vendor video (1:02, 1920 px):
    the housing is 559 px across five contacts on a 78 px pitch, a ratio of 7.17 against
    the family's 35.56 / 5.08 = 7.0 on an oblique view.
  the-face: >-
    DATASHEET for the geometry the family fixes - five cells on 5.08 mm starting one flange
    width (5.08) in, a threaded insert centred in each flange - and the vendor video for
    how this one looks: green housing, brass inserts, open cells with a contact visible in
    each.
  mate: >-
    derived - (17.78, 4.3), the centre of the row of five contacts, which is the centre of the housing,
    on the mouth of the housing (`on: body`): a plug seated here stands off by the 2.5 the
    housing is built proud, and starts where the housing ends. The interface,
    `terminal-508-5`, is the five-position mating face and says nothing of the flanges: a
    plain header presents it too. The data sheet above lists seventeen mating plugs
    (pp.16-25) and every one has screw flanges.
