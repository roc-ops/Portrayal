<svg xmlns="http://www.w3.org/2000/svg" width="30.8mm" height="12.5mm" viewBox="0 0 30.8 12.5">
  <!-- THE PART IS THE CONNECTOR AND ITS TWO STANDOFFS, AND NOTHING ELSE.
       An earlier draft drew a dogbone flange plate here, copied from Cisco's
       ASR 9000 Visio master. That was wrong to put in a shared part: the plate
       is Cisco's own bezel, cut to a shape nothing else uses, and a generic
       DE-9 has no business carrying one vendor's trim. Where a device does have
       a bezel around its D-sub, that device draws it - the same way a faceplate
       draws any other decoration behind the parts seated on it.
       Standoff positions are TE C-747905 Rev AB1's 24.99 mounting centres, and
       hexagonal is what Cisco's master draws and what 114-40010's 4-40
       screwlocks are. -->
  <g id="standoffs" fill="#9aa1a8" stroke="#6d7379" stroke-width="0.25">
    <polygon points="4.90,7.40 2.91,8.55 0.91,7.40 0.91,5.10 2.91,3.95 4.90,5.10"/>
    <polygon points="29.89,7.40 27.89,8.55 25.90,7.40 25.90,5.10 27.89,3.95 29.89,5.10"/>
  </g>
  <!-- The threaded bore. 4-40 UNC takes a 2.26 tap drill, so 2.3 across is the
       hole a screwlock actually presents - an earlier 1.5 read far too small
       against the master. -->
  <g fill="#4a4f55">
    <circle cx="2.905" cy="6.25" r="1.15"/>
    <circle cx="27.895" cy="6.25" r="1.15"/>
  </g>
</svg>
