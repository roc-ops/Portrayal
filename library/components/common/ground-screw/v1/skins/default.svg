<svg xmlns="http://www.w3.org/2000/svg" width="5.6mm" height="5.6mm" viewBox="0 0 5.6 5.6">
  <!-- common/ground-lug@1's stud, washer and screw cap, moved by (-0.7, -7.0);
       no earth symbol. -->
  <circle id="stud" cx="2.8" cy="2.8" r="2.8" fill="#8a9099" stroke="#4a4f55" stroke-width="0.3"/>
  <circle id="washer" cx="2.8" cy="2.8" r="2.66" fill="#7d848c" stroke="#565c63"
    stroke-width="0.45" stroke-dasharray="0.55 0.4"/>
  <g id="screw-cap">
    <circle cx="2.8" cy="2.8" r="2.53" fill="#8a9099" stroke="#4a4f55" stroke-width="0.25"/>
    <line x1="1.1" y1="2.8" x2="4.5" y2="2.8" stroke="#4a4f55" stroke-width="0.45"/>
    <line x1="2.8" y1="1.1" x2="2.8" y2="4.5" stroke="#4a4f55" stroke-width="0.45"/>
  </g>
</svg>
