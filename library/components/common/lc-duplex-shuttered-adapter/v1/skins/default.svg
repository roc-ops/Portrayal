<svg xmlns="http://www.w3.org/2000/svg" width="13.1mm" height="11.6mm" viewBox="0 0 13.1 11.6">
  <!-- Shuttered LC duplex adapter, 13.1 x 11.6, bores side by side, tongue up -
       FS's 36-fibre FHD cassettes (105333, 105335). See the contract.

       THE BEZEL IS RAISED, so the bore openings are evenodd HOLES in it -
       common/lc-duplex-adapter@4's keyed outline moved 0.05 left for the 13.1
       body - and what shows through each hole is the SHUTTER, drawn here at
       the plate plane. No bores are composed: a closed shutter hides them.
       Each shutter is two doors meeting down the bore's middle, in the housing
       colour darkened over a black underlay, so a finish set on the part
       recolours doors and housing together. -->
  <g id="shutter-tx">
    <rect x="1.275" y="3.65" width="4.3" height="4.3" fill="#0f1318"/>
    <rect x="1.275" y="3.65" width="2.08" height="4.3" fill="#368ad4" fill-opacity="0.78"
          data-fill-from="housing-finish"/>
    <rect x="3.495" y="3.65" width="2.08" height="4.3" fill="#368ad4" fill-opacity="0.78"
          data-fill-from="housing-finish"/>
  </g>
  <g id="shutter-rx">
    <rect x="7.525" y="3.65" width="4.3" height="4.3" fill="#0f1318"/>
    <rect x="7.525" y="3.65" width="2.08" height="4.3" fill="#368ad4" fill-opacity="0.78"
          data-fill-from="housing-finish"/>
    <rect x="9.745" y="3.65" width="2.08" height="4.3" fill="#368ad4" fill-opacity="0.78"
          data-fill-from="housing-finish"/>
  </g>
  <path id="bezel" fill-rule="evenodd" fill="#368ad4" stroke="#215481" stroke-width="0.15"
        data-fill-from="housing-finish" data-stroke-derive="housing-finish"
        d="M 0.1 0.1 h 12.9 v 11.4 h -12.9 z
           M 2.105 1.85 h 2.64 v 0.69 h 1.03 v 0.49 h -0.62 v 0.42 h 0.62 v 4.7
             h -4.7 v -4.7 h 0.62 v -0.42 h -0.62 v -0.49 h 1.03 z
           M 8.355 1.85 h 2.64 v 0.69 h 1.03 v 0.49 h -0.62 v 0.42 h 0.62 v 4.7
             h -4.7 v -4.7 h 0.62 v -0.42 h -0.62 v -0.49 h 1.03 z"/>
</svg>
