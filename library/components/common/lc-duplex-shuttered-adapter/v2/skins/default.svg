<svg xmlns="http://www.w3.org/2000/svg" width="13.1mm" height="11.6mm" viewBox="0 0 13.1 11.6">
  <!-- Shuttered LC duplex adapter, 13.1 x 11.6, bores side by side, tongue up -
       FS's 36-fibre FHD cassettes (105333, 105335). See the contract.

       THE BORES ARE COMPOSED BEHIND THIS ART (`behind: true`): two
       std/lc-bulkhead-bore@1 turned 180, ferrules at (3.425, 5.8) and
       (9.675, 5.8). They are the fibre positions `1` (left) and `2` (right).
       THE BEZEL IS RAISED, so the openings are evenodd HOLES in
       it - the bulkhead outline turned 180: tongue from y 0.09, shoulder from
       1.51, neck from 2.70, the 4.7 square from 3.45 to 8.15 - and what shows
       through each hole is the bore's keyway and, over its square, the
       SHUTTER. The outline is the body's own 13.1 x 11.6 box.

       Each shutter is two doors meeting down the bore's middle, in the
       housing colour darkened over a black underlay, so a finish set on the
       part recolours doors and housing together. It is solid in 3D (the
       contract's relief), standing in front of the bore's ferrule. A plug
       seated in the bore paints after this art and covers it. -->
  <g id="shutter-1">
    <rect x="1.275" y="3.65" width="4.3" height="4.3" fill="#0f1318"/>
    <rect x="1.275" y="3.65" width="2.08" height="4.3" fill="#368ad4" fill-opacity="0.78"
          data-fill-from="housing-finish"/>
    <rect x="3.495" y="3.65" width="2.08" height="4.3" fill="#368ad4" fill-opacity="0.78"
          data-fill-from="housing-finish"/>
  </g>
  <g id="shutter-2">
    <rect x="7.525" y="3.65" width="4.3" height="4.3" fill="#0f1318"/>
    <rect x="7.525" y="3.65" width="2.08" height="4.3" fill="#368ad4" fill-opacity="0.78"
          data-fill-from="housing-finish"/>
    <rect x="9.745" y="3.65" width="2.08" height="4.3" fill="#368ad4" fill-opacity="0.78"
          data-fill-from="housing-finish"/>
  </g>
  <path id="bezel" fill-rule="evenodd" fill="#368ad4" stroke="#215481" stroke-width="0.15"
        data-fill-from="housing-finish" data-stroke-derive="housing-finish"
        d="M 0 0 h 13.1 v 11.6 h -13.1 z
           M 2.105 0.09 h 2.64 v 1.42 h 1.03 v 1.19 h -0.62 v 0.75 h 0.62 v 4.7
             h -4.7 v -4.7 h 0.62 v -0.75 h -0.62 v -1.19 h 1.03 z
           M 8.355 0.09 h 2.64 v 1.42 h 1.03 v 1.19 h -0.62 v 0.75 h 0.62 v 4.7
             h -4.7 v -4.7 h 0.62 v -0.75 h -0.62 v -1.19 h 1.03 z"/>
</svg>
