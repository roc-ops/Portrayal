<svg xmlns="http://www.w3.org/2000/svg" width="9.4mm" height="12.8mm" viewBox="0 0 9.4 12.8">
  <!-- Panel-mount SC simplex adapter, 9.4 x 12.8, SENKO's printed body.

       THE FRAME IS RAISED, and a raised part carries its art on its front
       face, so the SC opening is a HOLE in it - std/sc-bore@1's outline,
       7.5 x 9.0 at x 0.95-8.45 with the key slot out through the left wall -
       centred in the body. NO DUST CAP: a cap is an occupant of the opening. -->
  <path id="bezel" fill-rule="evenodd" fill="#3078c0" stroke="#1d4975" stroke-width="0.15"
        data-fill-from="housing-finish" data-stroke-derive="housing-finish"
        d="M 0.3 0 H 9.1 Q 9.4 0 9.4 0.3 V 12.5 Q 9.4 12.8 9.1 12.8 H 0.3 Q 0 12.8 0 12.5 V 0.3 Q 0 0 0.3 0 Z
           M 0.95 1.9 H 8.45 V 10.9 H 0.95 V 7.45 H 0.06 V 5.35 H 0.95 Z"/>
</svg>
