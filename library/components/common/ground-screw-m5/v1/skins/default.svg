<svg xmlns="http://www.w3.org/2000/svg" width="10mm" height="10mm" viewBox="0 0 10 10">
  <!-- A M5 pan head, 9.5 across, head on, with its cross recess, on its
       ISO 7089 washer, 10 across. -->
  <circle id="washer" cx="5" cy="5" r="4.9" fill="#a6acb2" stroke="#62686e" stroke-width="0.2"/>
  <g id="head">
    <circle cx="5" cy="5" r="4.65" fill="#b9bec4" stroke="#62686e" stroke-width="0.2"/>
    <path d="M 2.91 5 H 7.09 M 5 2.91 V 7.09"
          fill="none" stroke="#4e5359" stroke-width="0.57" stroke-linecap="round"/>
  </g>
