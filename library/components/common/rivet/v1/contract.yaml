format: 1
kind: component
name: rivet
version: 1.0.0
class: mechanical
behaviour: mounts
profile: networking
description: >-
  Sheet-metal rivet head. Chassis panels are full of them and they are a real,
  visible feature of a rear or side face, not decoration.
attrs: {model: 'Rivet'}
size: {w: 3.0, h: 3.0}
provenance:
  relief: 'deliberately FLAT. A 0.6mm proud head on a 440mm panel is
    invisible as geometry, and this device places 86 of them - each raised
    feature costs an SVG rasterise on every 3D rebuild. The flat art reads the
    same and the rebuild is seconds faster'
  size: estimated - a typical 3 mm blind-rivet head. Not measured
skins: [default]
