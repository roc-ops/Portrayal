<svg xmlns="http://www.w3.org/2000/svg" width="4.7mm" height="4.7mm" viewBox="0 0 4.7 4.7">
  <!-- The white LC dust cap, front view: the 4.7 square that plugs the bore
       square, with the moulded rounded-square inset in its front.

       THE INSET IS INSIDE THE BODY GROUP, and not its sibling. A node that
       stands `out` is moved to the end of the instance so it paints over what
       it sits on; an inset drawn beside the body was left behind it, under the
       cap, and never showed in 2D. Inside the group it travels with the cap -
       the same arrangement common/lc-duplex-adapter@3's own skin arrived at
       before the cap moved out here. -->
  <g id="body" class="cap">
    <rect x="0.0" y="0.0" width="4.7" height="4.7" rx="1.1" fill="#e9ecef"
          stroke="#b6bcc2" stroke-width="0.12"/>
    <rect id="inset" x="1.0" y="1.0" width="2.7" height="2.7" rx="0.7" fill="#d3d8dd"/>
  </g>
</svg>
