name: pan-screw-m5
version: 1.0.0
class: screw
behaviour: mounts
description: >-
  An M5 cross-recessed pan-head screw, seen head on: a black head 9.5 across with its cross
  recess. A fastener drawn where a document shows one, such as the screws that hold a rail panel
  to its side brackets through their slots.
size: {w: 9.5, h: 9.5}
size-confidence: {w: registry, h: registry}
size-notes: >-
  the head diameter of the standard's M5 pan head, its largest; the thread is not drawn
provenance:
  size: >-
    registry - ISO 7045 (pan head, type H or Z cross recess, product grade A), the M5 row: head
    diameter dk 9.5, head height k 3.5. The maximum head is drawn.
  relief: >-
    registry - the head height of the same row, 3.5, built as a cylinder from the face the screw
    is driven into. The shank is not built.
  color: >-
    photo-measured - black: on FS gallery render g4 of SKU 376695 (DINRAIL4U), a 17 x 17 px patch
    centred on each of the two cross-recessed heads in the near bracket's slots averages
    (15, 15, 15) and (17, 17, 17), 277 and 283 of its 289 pixels darker than 70.
