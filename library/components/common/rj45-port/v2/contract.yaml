format: 1
kind: component
name: rj45-port
version: 2.0.0
class: port
profile: networking
description: RJ45 jack with link/activity LEDs (v2 = composed - std/rj45 cutout core,
  clip up; 1.3mm taller than v1 so the spec 16x14 cutout fits under the LED strip)
size: {w: 17.0, h: 15.9}
attrs: {media: rj45}
provenance:
  size: estimated (LED strip + standard cutout)
  cutout: standard (IEC 60603-7 via std/rj45)
elements:
  led-left:
    at: [1.0, 0.3]
    size: [2.0, 1.2]
    class: led
    states: ['off', up, activity]
  led-right:
    at: [14.0, 0.3]
    size: [2.0, 1.2]
    class: led
    states: ['off', up, activity]
parts:
  - {ref: std/rj45@1, id: jack, at: [0.5, 1.9], rotate: 180}
connection-points:
  net: {at: [8.5, 8.9], direction: front}
skins: [default]
