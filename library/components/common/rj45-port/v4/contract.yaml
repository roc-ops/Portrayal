format: 1
kind: component
name: rj45-port
version: 4.2.0
class: port
profile: networking
description: RJ45 panel port with jack-outline bezel (v4 = silver plate over the
  cutout leaving a plug-shaped aperture, stepped keyway up; link/activity LEDs sit
  in the bezel corner tabs beside the keyway)
size: {w: 17.0, h: 14.9, d: 16.0}
attrs: {media: rj45}
provenance:
  depth: >-
    derived - the std/rj45@1 aperture this composes is 16.0 mm deep, and a bezel around an
    aperture is as deep as the aperture. Stated so the 3D view has a recess to extrude and a
    seated module has a hole to sit in: with the mating fix in #54 a module now actually
    seats here, and a cage with no depth put it in a flat patch painted on the panel. Not a
    new measurement - the number is the aperture's own, read through the part that composes
    it.
  bezel-window: generated from the std cavity silhouette (11.89 x 6.85 body
    + 4.0 x 2.6 keyway, TE 2497310-1 CAD) so the plate frames the recess exactly
    rather than approximating it
  size: estimated (bezel plate + standard cutout)
  cutout: standard (IEC 60603-7 via std/rj45)
elements:
  led-left:
    at: [2.45, 1.05]
    size: [2.3, 1.3]
    class: led
    states: ['off', up, activity]
  led-right:
    at: [12.25, 1.05]
    size: [2.3, 1.3]
    class: led
    states: ['off', up, activity]
parts:
  - {ref: std/rj45@1, id: jack, at: [0.5, 0.5], rotate: 180}
relief:
  features:
    - node: bezel
      out: 0.5
      color: '#9aa1a8'
      confidence: estimated
      source: >-
        common/rj45-port@4 itself - unsourced. Four RJ45 bezel plates and the USB-A bezel
        all carry out 0.5: one estimate written five times. Their bezel WINDOWS are exact -
        generated from the TE 2497310-1 CAD cavity silhouette - so the opening is sourced
        and the plate's thickness is not.
    - node: led-left
      out: 0.3
      color: '#0d0f11'
      confidence: estimated
      source: >-
        common/rj45-port@4 itself - unsourced. Four RJ45 bezel plates and the USB-A bezel
        all carry out 0.5: one estimate written five times. Their bezel WINDOWS are exact -
        generated from the TE 2497310-1 CAD cavity silhouette - so the opening is sourced
        and the plate's thickness is not.
    - node: led-right
      out: 0.3
      color: '#0d0f11'
      confidence: estimated
      source: >-
        common/rj45-port@4 itself - unsourced. Four RJ45 bezel plates and the USB-A bezel
        all carry out 0.5: one estimate written five times. Their bezel WINDOWS are exact -
        generated from the TE 2497310-1 CAD cavity silhouette - so the opening is sourced
        and the plate's thickness is not.
connection-points:
  net: {at: [8.5, 7.5], direction: front}
skins: [default, dark]
