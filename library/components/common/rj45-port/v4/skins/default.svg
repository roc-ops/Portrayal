<svg xmlns="http://www.w3.org/2000/svg" width="17mm" height="14.9mm" viewBox="0 0 17 14.9">
  <!-- THE APERTURE IS A HOLE IN THIS TOO, not just in the bezel. `behind: true`
       inserts the composed jack BEFORE the skin's own nodes, so a solid body
       rect sits on top of it and the cavity and its eight conductors vanish -
       the port renders as a flat dark rectangle inside a silver plate. The hole
       has to go through every layer between the viewer and the jack. -->
  <path id="body" fill-rule="evenodd" fill="#2b2f33" d="
    M 0.4 0.5 h 16.2 a 0.4 0.4 0 0 1 0.4 0.4 v 13.6 a 0.4 0.4 0 0 1 -0.4 0.4
    h -16.2 a 0.4 0.4 0 0 1 -0.4 -0.4 v -13.6 a 0.4 0.4 0 0 1 0.4 -0.4 z
    M 2.555 5.375 h 3.945 v -2.6 h 4 v 2.6 h 3.945 v 6.85 h -11.89 z"/>
  <path id="bezel" fill-rule="evenodd" fill="#c9cdd1" stroke="#9aa1a8" stroke-width="0.25" d="
    M 0.95 0.50 h 15.1 a 0.8 0.8 0 0 1 0.8 0.8 v 12.45 a 0.8 0.8 0 0 1 -0.8 0.8 h -15.1
    a 0.8 0.8 0 0 1 -0.8 -0.8 v -12.45 a 0.8 0.8 0 0 1 0.8 -0.8 z
    M 2.555 5.375 h 3.945 v -2.6 h 4 v 2.6 h 3.945 v 6.85 h -11.89 z
    M 1.85 2.00 h 3.5 v 2.1 h -3.5 z
    M 11.65 2.00 h 3.5 v 2.1 h -3.5 z"/>
  <rect id="led-left" x="1.95" y="2.10" width="3.3" height="1.9" rx="0.2" fill="var(--led-color, #3a3f44)"/>
  <rect id="led-right" x="11.75" y="2.10" width="3.3" height="1.9" rx="0.2" fill="var(--led-color, #3a3f44)"/>
</svg>
