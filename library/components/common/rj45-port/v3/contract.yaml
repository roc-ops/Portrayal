format: 1
kind: component
name: rj45-port
version: 3.0.0
class: port
profile: networking
description: RJ45 panel port with bezel frame and link/activity LEDs (v3 = bezel
  redesign - dark frame outlines the jack, LED strip protrudes proud of the face
  with concave LED wells; no bottom frame so it can stack tight above another port)
size: {w: 18.0, h: 16.4}
attrs: {media: rj45}
provenance:
  size: estimated (bezel strip + standard cutout)
  cutout: standard (IEC 60603-7 via std/rj45)
elements:
  led-left:
    at: [1.7, 0.35]
    size: [2.0, 1.2]
    class: led
    states: ['off', up, activity]
  led-right:
    at: [14.3, 0.35]
    size: [2.0, 1.2]
    class: led
    states: ['off', up, activity]
parts:
  - {ref: std/rj45@1, id: jack, at: [1.0, 2.4], rotate: 180}
relief:
  features:
    - {node: bezel-a, out: 0.7, color: '#15181b'}
    - {node: led-well-left, out: 0.4, color: '#0d0f11'}
    - {node: bezel-b, out: 0.7, color: '#15181b'}
    - {node: led-well-right, out: 0.4, color: '#0d0f11'}
    - {node: bezel-c, out: 0.7, color: '#15181b'}
    - {node: frame-top, out: 0.7, color: '#15181b'}
    - {node: frame-left, out: 0.7, color: '#15181b'}
    - {node: frame-right, out: 0.7, color: '#15181b'}
connection-points:
  net: {at: [9.0, 9.4], direction: front}
skins: [default]
