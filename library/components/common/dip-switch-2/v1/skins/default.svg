<svg xmlns="http://www.w3.org/2000/svg" width="7.0mm" height="10.0mm" viewBox="0 0 7.0 10.0">
  <!-- A red two-way DIP switch, ON at the top. The body is cut through at the slots (evenodd) so the
       slots, standing lower, read as recesses in 3D; the sliders stand proud at the OFF end. -->
  <path id="body" fill-rule="evenodd" fill="#a84749" stroke="#6e2a2c" stroke-width="0.25"
        d="M 0 0 H 7.0 V 10.0 H 0 Z M 0.9 2.6 h 2.4 v 6.4 h -2.4 Z M 3.7 2.6 h 2.4 v 6.4 h -2.4 Z"/>
  <rect id="switch-1" x="0.9" y="2.6" width="2.4" height="6.4" rx="0.3" fill="#e9e6e2"/>
  <rect id="switch-2" x="3.7" y="2.6" width="2.4" height="6.4" rx="0.3" fill="#e9e6e2"/>
  <!-- The sliders are drawn OFF; a switch set `on` carries its slider 3.2 up its slot. -->
  <rect id="slider-1" x="1.1" y="6.0" width="2.0" height="2.8" rx="0.2" fill="#bdb8b2"
        data-move-from="sw-1" data-move="on: 0 -3.2"/>
  <rect id="slider-2" x="3.9" y="6.0" width="2.0" height="2.8" rx="0.2" fill="#bdb8b2"
        data-move-from="sw-2" data-move="on: 0 -3.2"/>
</svg>
