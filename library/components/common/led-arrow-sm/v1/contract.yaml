format: 1
kind: component
name: led-arrow-sm
version: 1.1.0
class: led
profile: networking
description: >-
  Compact triangle port LED for tight inter-port gaps - up skin for top-row
  ports, down for bottom. Geometrically identical to led-arrow at 0.625 scale.
  led-arrow is 3.2mm tall and does not fit between belly-to-belly QSFP cages,
  whose aperture-to-aperture gap is about 2.4mm.
size: {w: 2.25, h: 2.0}
provenance:
  size: estimated
elements:
  lamp:
    at: [0.125, 0.125]
    size: [2.0, 1.75]
    class: led
    states: ['off', 'on']
relief:
  features:
    - node: lamp
      dome: 0.16
      confidence: estimated
      source: >-
        common/led-arrow-sm@1 itself - unsourced. The library's five panel-lamp components
        carry five different domes - led-arrow-sm 0.16, led-arrow 0.25, led-dot 0.3,
        led-rect 0.3, led-indicator 0.45 - and they scale with each lamp's drawn diameter
        rather than with any measurement, which is what a set of proportional guesses looks
        like. led-dot's 0.3 is the one hundreds of features across casa/ and cisco/ point
        at.
skins: [up, down]
