format: 1
kind: component
name: usb-a
version: 2.0.0
class: port
profile: networking
description: USB Type-A receptacle with trident silkscreen (v2 = composed - shell
  bezel wraps a std/usb-a opening core)
size: {w: 17.0, h: 7.0, d: 13.7}
attrs: {media: usb-a}
provenance:
  depth: >-
    derived - the std/usb-a@1 aperture this composes is 13.7 mm deep, and a bezel around an
    aperture is as deep as the aperture. Stated so the 3D view has a recess to extrude and a
    seated module has a hole to sit in: with the mating fix in #54 a module now actually
    seats here, and a cage with no depth put it in a flat patch painted on the panel. Not a
    new measurement - the number is the aperture's own, read through the part that composes
    it.
  size: estimated (USB-A receptacle shell nominal 13.1 x 5.7)
  opening: standard (USB 2.0/3.0 via std/usb-a)
elements:
  symbol: {at: [0.3, 1.2], size: [2.8, 4.6], class: silkscreen}
  receptacle: {at: [3.5, 0.7], size: [13.0, 5.6], class: jack}
parts:
  - {ref: std/usb-a@1, id: port, at: [4.0, 1.25]}
connection-points:
  usb: {at: [10.0, 3.5], direction: front}
skins: [default]
