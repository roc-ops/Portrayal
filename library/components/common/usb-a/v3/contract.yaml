format: 1
kind: component
name: usb-a
version: 3.1.0
class: port
profile: networking
description: USB Type-A port in a silver panel bezel (v3 = bezel plate spans the
  component so it can abut neighboring port bezels; receptacle centered)
size: {w: 17.0, h: 9.3, d: 13.7}
attrs: {media: usb-a}
provenance:
  depth: >-
    derived - the std/usb-a@1 aperture this composes is 13.7 mm deep, and a bezel around an
    aperture is as deep as the aperture. Stated so the 3D view has a recess to extrude and a
    seated module has a hole to sit in: with the mating fix in #54 a module now actually
    seats here, and a cage with no depth put it in a flat patch painted on the panel. Not a
    new measurement - the number is the aperture's own, read through the part that composes
    it.
  size: drawing-inferred (S9510-28DC HIG - bezel bridges mgmt and console jacks)
  opening: standard (USB 3.0 via std/usb-a)
elements:
  receptacle: {at: [2.0, 1.85], size: [13.0, 5.6], class: jack}
parts:
  - {ref: std/usb-a@1, id: port, at: [2.5, 2.4]}
relief:
  features:
    - node: bezel
      out: 0.5
      color: '#9aa1a8'
      confidence: estimated
      source: >-
        common/usb-a@3 itself - unsourced. Four RJ45 bezel plates and the USB-A bezel all
        carry out 0.5: one estimate written five times. Their bezel WINDOWS are exact -
        generated from the TE 2497310-1 CAD cavity silhouette - so the opening is sourced
        and the plate's thickness is not.
connection-points:
  usb: {at: [8.5, 4.65], direction: front}
skins: [default]
