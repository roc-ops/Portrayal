format: 1
kind: component
name: serial-symbol
version: 1.0.0
class: silkscreen
description: >-
  The IOIOI mark printed beside a serial port - alternating bars and rings,
  which is how a vendor says "this one carries a bit stream"
size: {w: 7.2, h: 2.6}
provenance:
  form: >-
    read off the icon column of the R740 ISM table 10, which prints a mark for
    every rear item, and confirmed in figure 9 where it is printed under the
    port itself. Five glyphs alternating bar, ring, bar, ring, bar.
  size: >-
    photo-measured from ISM figure 9 at 7.2074 px/mm. The BOX is measured; the
    proportions of each bar and ring are drawn, because at that scale the whole
    mark is fifty pixels across.
  not-a-standard: >-
    no registry entry and no document dimensions it. It is ink that says what
    the hole above it is for, which is what `silkscreen` means here.
skins: [default]
