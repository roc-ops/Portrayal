format: 1
kind: component
name: qsfp-pull-tab
version: 2.2.0
class: latch
profile: networking
description: >-
  QSFP / QSFP-DD pull tab, as the part is: a flat U-loop whose two thin arms run
  forward along the module's side edges and join in a wider grip at the far end,
  open in the middle so the fibre connector passes through. The grip straddles
  the module's top edge, its top 1.23 above it, inside the MSA's 3.4 MAX
  allowance above the module. Each arm roots in a riser block, a tall
  square post moulded with the strap that stands against the nose front at
  the module's side edge, 7.5 long and 7.8 tall from the strap top. The strap
  is S-bent in side view: it leaves the riser 0.47 above the module top, dips
  1.5 below that mid-span and rises to the grip, 0.76 above where it left.
  Each arm is drawn as six boxes stepping along that curve. No speed
  lettering: the generic that composes it carries no rate.
size: {w: 19.0, h: 8.56}
size-confidence: {w: drawing, h: photo-measured}
attrs: {role: pull-latch}
fields:
  latch-color: {label: Latch colour, type: text, default: '#6f6f6f'}
provenance:
  size: >-
    w 19.0 is the 19.00 MAX across the tab (ProLabs PAN-QSFP28-100GBASE-CWDM4-C,
    drawing), also SFF-8661 Figure 5-1's 19 MAX outside-the-cage width; h 8.56 is
    the arm root's 0.76 below the grip top plus the riser block's 7.8 below the
    arm top (see provenance.riser and provenance.sbend). It was 8.3 while the
    grip top and the strap top were read on median body edges (1.07 and 0.57
    above the module top); both were read again on fitted edges in 2.2.0. All
    measured off the maintainer's photographs of a QSFP SR4 module (side view,
    scale module height 8.5)
  shape: >-
    photo-measured - the maintainer's photographs of a QSFP28-SR4 module (top,
    side and end views). The top view (scale: module width 18.35, passes the
    orthography check at -1.0%) gives ARM_W 1.95 +/-0.15 and GRIP_L 11.2
    +/-0.5; the other top view fails the orthography check (its width varies
    6% along the length and its arms are skewed about 3 deg), so its 10.4 is a
    cross-check only, not a measurement of record. The side views give GRIP_T
    2.9 +/-0.15: 2.87 in side view IMG_2190 and 2.97 in IMG_2192 on the fitted
    frame of provenance.sbend, and the arm thickness 2.92 and 3.00 in the same
    views, so both stay drawn at 2.9.
  reach: >-
    49.8 (QSFP-DD HW Rev 6.3 Appendix B, Type 1: 118 REF - 48.2 MIN - 20 nose;
    drawing), measured from the nose front, because the photographs of the real
    QSFP28-SR4 give 46.7-53.7 (mean 49.9) from the nose front, which agrees
    within 8%, while the ProLabs 34.80 MAX disagrees by 30% or more in either
    frame and is not this tab. The fitted side views put the tip at 48.5
    (IMG_2190) and 49.2 (IMG_2192), inside the same range.
  width: drawing - 19.00 MAX across (ProLabs PAN-QSFP28-100GBASE-CWDM4-C), also
    SFF-8661 Figure 5-1's 19 MAX outside-the-cage width
  height: >-
    the grip top sits 1.23 above the module top and the strap top 0.47 above it
    where the strap leaves the riser, photo-measured on fitted body edges (see
    provenance.sbend); both are inside SFF-8661 Figure 5-1's 3.4 MAX above the
    module (Note 6, including bail travel). The median-edge reading these
    replace gave 1.07 and 0.57. A host composes this part at
    `at: [-0.325, -1.23]` with `lift: 20.0` so the grip's top sits 1.23 above
    the host face's top edge - the grip straddles the body's top edge, as the
    part does; it does not sit wholly above the face.
  sbend: >-
    photo-measured - the maintainer's photographs of a QSFP SR4 module, side
    view IMG_2190 (the side view that passes the orthography check), read on
    the full 4032 x 3024 frame. CALIBRATION: each body edge was fitted as a line
    along the in-cage body (columns 600 to 1650, every 10 px) and evaluated at
    the feature, not read as one median: top y = 1394.29 + 0.00503 x (residual
    0.3 px), bottom y = 1610.94 + 0.00795 x (residual 1.0 px), so the view is
    turned 0.3 to 0.5 deg; the 8.5 module height reads 223.1 px at the nose
    front (x 2193), 26.25 px/mm, rising to 26.55 at the tip. The strap top edge
    was read every 5 px (0.19 mm) at the half-way crossing of red less blue
    between table and strap, and each reading is a height above the fitted top
    edge at its own column, at its own scale. The reach runs from the nose
    front and is stretched by 49.8/48.5 so the photographed tip lands on the
    drawn reach. SAMPLES, strap top above the module top at reach 2.5, 5, 7.5
    ... 47.5 - 0.46, 0.47, 0.46, 0.49, 0.51, 0.55, 0.55, 0.57, 0.35, -0.29,
    -0.80, -1.04, -1.05, -0.79, -0.26, 0.33, 0.78, 1.10, 1.23. So the strap
    leaves the riser at 0.47, bows up to 0.57 by 20, dips to -1.06 at 30.7
    (1.53 below the root) and rises through the grip pad to 1.23 at 47.5 (0.76
    above the root) - the ledger draft's 1.8 dip and 0.5 rise were median-edge
    readings. UNCERTAINTY +/-0.15 on each height (edges +/-0.05, frame and
    scale +/-0.1). CROSS-CHECK, IMG_2192 (marginal orthography, keystoned):
    the same curve, dip at 31 and rise to the tip, but the tab stands pitched
    1.7 deg against the body relative to IMG_2190 - the strap has play on the
    nose - and with that pitch removed the two curves agree to 0.10 rms (0.33
    at the tip). The pose is the view of record's; the shape is both views'.
    DRAWN as six boxes per arm, each one's top the mean of the curve over its
    span: 0 to 22.0 at 0.47 (the root, flush with the riser), 22.0 to 25.3 at
    0.07, 25.3 to 28.6 at -0.69, 28.6 to 32.0 at -1.03, 32.0 to 35.3 at -0.94,
    35.3 to 38.6 at -0.39, then the grip, 38.6 to 49.8 at its 1.23 top. The
    steps are within 0.45 of the curve at the dip's flanks and within 0.1 on
    the flats. Each box is the 1.95 x 2.9 section, so neighbours share their
    end faces and neither gap nor overlap. The grip pad is still one box at its
    top: its first 4 mm, where the strap is still rising, are drawn up to 0.9
    high. In the face-on view the dip lies inside the arm root and riser
    outline, so the skin draws the five lower boxes first, under that art, and
    the drawing looks as it did.
  riser: >-
    photo-measured - the maintainer's photographs of a QSFP SR4 module, the two
    side views, each scaled on the 8.5 module height READ AT THE RISER: both
    views are slightly rotated and one is keystoned (its module height grows 5
    percent from the rear to the nose), so each body edge was fitted as a line
    along the in-cage body and evaluated at the riser, not read as one median.
    Length along the axis 7.41 and 7.53 (mean 7.47, +/-0.15); height from the
    strap top 7.67 and 7.87 (mean 7.77, +/-0.2). Its top is flush with the strap
    top in both views (within 0.05) and its lower edge sits 7.39 and 7.33 below
    the body top (+/-0.15), 1.1 above the body bottom. Drawn from the strap top
    at 0.47 above the body top (provenance.sbend) 7.8 down, it ends 7.33 below
    the body top, as measured. It stands 0.14 and 0.28
    off the nose front, drawn as touching. In plan it is the arm's width at the
    module's side edge (the end view shows the two posts there). The same
    views' strap thickness at this scale, 2.85 in both, agrees with the 2.9 the
    arms were drawn at, which checks the scale (read along the arm on the
    frame of provenance.sbend it is 2.92 and 3.00). The riser is beige, the strap's
    own moulding with no seam, and rides with the tab, so it belongs to this
    part and not to the module's head. Drawn as `riser-l`/`riser-r` BELOW the
    arms' 2.9 cross-section (tab y 3.66 to 8.56): the arm root is the riser's
    top, and two boxes sharing that volume would z-fight. The lower corners are
    chamfered on the part (about 1 mm); relief builds boxes and does not draw
    them.
  colour: >-
    the neutral grey #6f6f6f, not a wavelength code (decision taken in #473); a
    vendor wrapper or placement sets latch-color
