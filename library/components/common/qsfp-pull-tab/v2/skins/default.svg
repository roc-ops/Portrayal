<svg xmlns="http://www.w3.org/2000/svg" width="19.0mm" height="8.3mm" viewBox="0 0 19.0 8.3">
  <!-- The riser blocks, drawn first because they are the farthest from the
       viewer (7.5 out, where the arms reach 38.6 and the grip 49.8). Each is
       the lower part of a 7.8 tall post at an arm root, standing against the
       nose front at the module's side edge; the arm's own 2.9 cross-section
       above it is the post's top, so the two do not overlap. -->
  <rect id="riser-l" x="0" y="3.4" width="1.95" height="4.9" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="riser-r" x="17.05" y="3.4" width="1.95" height="4.9" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <!-- The grip: across the full 19.0 at the top of the part, so a host that
       composes it at at: [-0.325, -1.07] with lift: 20.0 puts the grip's top
       1.07 above the module top, as measured - the grip straddles the body's
       top edge rather than sitting wholly above it. -->
  <rect id="grip" x="0" y="0" width="19.0" height="2.9" rx="0.3" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <!-- The two arms run forward along the module's side edges, below the grip's
       top and open in the middle so the fibre connector passes through. -->
  <rect id="arm-l" x="0" y="0.5" width="1.95" height="2.9" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="arm-r" x="17.05" y="0.5" width="1.95" height="2.9" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
</svg>
