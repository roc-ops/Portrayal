format: 1
kind: component
name: qsfp-pull-tab
version: 1.1.0
class: latch
profile: networking
description: >-
  QSFP / QSFP-DD pull tab - the flat paddle bail that wraps the module and
  extends forward, with an elongated opening through it for a finger. Built as
  a flat loop, two side rails and a front crossbar, rather than a round bail,
  which is what a tube primitive would give. Vendors colour-code it by reach.
size: {w: 19.0, h: 3.4}
attrs: {role: pull-latch}
provenance:
  size: drawing - 19.00 MAX across the bail, 3.40 MAX thick
  reach: drawing - 34.80 MAX forward of the module body
  section: drawing - 1.60 MAX rail thickness in the side view, so the paddle is
    flat rather than round. A photograph of the part confirms a flat loop with
    an elongated opening, not a wire bail
  opening: photo - the finger opening runs most of the tab's length between the
    two rails
  speed-cut: drawing - the crossbar carries the reach cut through it as the word
    100G rather than printed, so it reads from either side
  colour: drawing - PULL LATCH COLOR WHITE on this part number. Vendors code the
    tab by reach, so it is a skin rather than a fixed fill
elements:
  rail-l: {at: [0.0, 0.0], size: [2.6, 3.4], class: latch}
  rail-r: {at: [16.4, 0.0], size: [2.6, 3.4], class: latch}
  crossbar: {at: [0.0, 0.0], size: [19.0, 3.4], class: latch}
  speed-cut: {at: [4.2, 0.75], size: [10.6, 1.9], class: marking}
relief:
  features:
    # two flat rails running forward, joined by a flat bar across the far end -
    # the gap between them IS the finger opening
    - node: rail-l
      out: 34.8
      confidence: drawing
      source: >-
        common/qsfp-pull-tab@1's own reach key - 'drawing - 34.80 MAX forward of the module
        body'. A dimensioned figure, and one of the few relief magnitudes in the library
        that is.
    - node: rail-r
      out: 34.8
      confidence: drawing
      source: >-
        common/qsfp-pull-tab@1's own reach key - the same 34.80 MAX dimension as rail-l. One
        drawing dimension covering both rails of one part.
    - node: crossbar
      out: 34.8
      lift: 31.4
      confidence: drawing
      source: >-
        common/qsfp-pull-tab@1's own size key - 'drawing - 19.00 MAX across the bail, 3.40
        MAX thick'. The 31.4 lift is 34.8 - 3.4, the subtraction that puts the crossbar at
        the end of the rails, not a separate reading.
        `out` IS NOT A THICKNESS. It read 3.4 - the bail's thickness - and relief.js builds
        a solid as `out` minus the summed lift, so the crossbar came out 3.4 - 31.4 = -28:
        a box whose front face sat 28mm behind its back. It is an ABSOLUTE distance from
        the panel, so the far end of the rails is the number, and the thickness falls out
        of the pair: 34.8 - 31.4 = 3.4, which is the dimension the drawing gives. The two
        rails beside it always said 34.8 for the same reach.
    # the speed is cut through the crossbar as lettering, not printed on it
    - node: speed-cut
      sink: 1.2
      lift: 34.8
      confidence: estimated
      source: >-
        common/qsfp-pull-tab@1 - the 34.8 lift is the drawing's reach and the 1.2 sink is
        not dimensioned anywhere. The speed-cut key establishes that the cut goes THROUGH
        the crossbar ('carries the reach cut through it as the word 100G rather than
        printed, so it reads from either side'), which makes 1.2 a shallow stand-in for a
        through-cut.
skins: [white, blue]
