  <circle cx="3.5" cy="3.5" r="3.4" fill="none" stroke="#8b8878" stroke-width="0.12"/>
  <circle cx="3.5" cy="3.5" r="2.15" fill="#c4c0ae" stroke="#a6a08f" stroke-width="0.12"/>
  <circle cx="3.5" cy="3.5" r="0.45" fill="#8e8a78"/>
</svg>
