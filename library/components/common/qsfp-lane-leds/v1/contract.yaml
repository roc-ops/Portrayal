format: 1
kind: component
name: qsfp-lane-leds
version: 1.2.0
class: led
profile: networking
description: QSFP port lane LED strip - four triangles, one per lane (no separate
  link/activity LEDs on this platform)
size: {w: 19.5, h: 3.4}
provenance:
  size: drawing-inferred (S9510-28DC HIG Fig 9)
  semantics: field knowledge (Jason, corrected 2026-08-17) - lanes 1-4 only. The lane
    COUNT is what that established; the states were not sourced. They were 'off, link,
    activity', which no document supports - the S9510-28DC HIG has tables for GNSS,
    SYNC, STAT, FAN, PWR, the PSU and fan FRUs and the management jack, and none for
    the port lamps. Reduced to the off/on default. 'link' also had no colour and no
    base stylesheet rule, so it rendered identically to 'off' - a state that looked
    declared and did nothing. If the real vocabulary is known from the field, declare
    it here with colours and say so; do not restore an undocumented guess
