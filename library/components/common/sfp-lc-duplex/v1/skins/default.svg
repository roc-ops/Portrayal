<svg xmlns="http://www.w3.org/2000/svg" width="13.5mm" height="8.5mm" viewBox="0 0 13.5 8.5">
  <!-- Module body 13.5 x 8.5 (SFP-30K-FSF drawing, full scale), drawn evenodd with
       the two bores as holes. The 3D textures this raised face with alphaTest, so
       the holes punch through and you look into the composed lc-bore recesses
       behind them rather than at a painted-on circle.
       THE HOLES ARE THE KEYED OUTLINE OF std/lc-bore@3, tongue up (the placements
       rotate 180), and they follow the contract: tongue 2.64 x 0.69, shoulder 4.70
       x 0.49, neck 3.46 x 0.42, then the 4.70 bore square. A square hole here would
       show face metal across the latch slot behind it. -->
  <path id="body" fill-rule="evenodd" fill="#9aa0a8" stroke="#6e747c" stroke-width="0.25" d="
    M 0.6 0 h 12.3 a 0.6 0.6 0 0 1 0.6 0.6 v 7.3 a 0.6 0.6 0 0 1 -0.6 0.6 h -12.3
    a 0.6 0.6 0 0 1 -0.6 -0.6 v -7.3 a 0.6 0.6 0 0 1 0.6 -0.6 z
    M 2.255 1.75 h 2.64 v 0.69 h 1.03 v 0.49 h -0.62 v 0.42 h 0.62 v 4.7
      h -4.7 v -4.7 h 0.62 v -0.42 h -0.62 v -0.49 h 1.03 z
    M 8.605 1.75 h 2.64 v 0.69 h 1.03 v 0.49 h -0.62 v 0.42 h 0.62 v 4.7
      h -4.7 v -4.7 h 0.62 v -0.42 h -0.62 v -0.49 h 1.03 z"/>
  <!-- bail latch: the lever that unseats the module. Separate piece on purpose -
       it pivots up to release, and lies flat here because the module is seated. -->
  <rect id="bail" x="0.5" y="0.55" width="12.5" height="1.05" rx="0.5" fill="#2f5fa8"
        stroke="#20406f" stroke-width="0.18"/>
</svg>
