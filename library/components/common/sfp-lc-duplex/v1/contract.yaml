format: 1
kind: component
name: sfp-lc-duplex
version: 1.4.0
class: transceiver
behaviour: occupies
mates: sfp
profile: networking
description: SFP transceiver with an LC duplex face - two recessed bores with the
  fiber ferrules standing in them, and a bail latch that pivots to release
size: {w: 13.5, h: 8.5}
attrs: {power-absent: not-applicable, media: sfp, form-factor: sfp, connector: lc-duplex, mode: single-mode,
        reach: 30km, speed: 100m}
provenance:
  power: >-
    NOT APPLICABLE, because this contract is a GENERIC and not a part. It is a shape that
    stands in for every module of its kind, so there is no one figure to state: a 40GBASE-SR4
    is about 1.5 W and a 400G ZR about 20 W, and this single drawing is both of them. Any
    wattage written here would be a fiction dressed as a fact rather than a missing one. The
    figure belongs on the PLACEMENT, where a device that knows which module it ships can
    source it - the same division of labour L18 already draws for `media`, where a port
    inheriting a family from its cage must declare the real media on the placement. L27 has
    always exempted this contract in code; this records the reason in the data, so that a
    consumer totalling a chassis can tell a deliberate silence from an unanswered question.
    The chassis-level hole stays visible in L29, which is the right place for it.
  size: drawing (SFP-30K-FSF, AutomationDirect, full scale - 0.53 in [13.5] wide by
    0.33 in [8.5] high), confirmed by the STEP solid at 13.46 x 8.48
  lc-spacing: >-
    measured in X (STEP front face - bore centres at x +/-3.175, i.e. 0.125 in each side
    of centre, so 6.35 apart). THE X IS THE MEASURED HALF; the Y is derived, and it moved
    in #126 from 4.25 to 5.70.
  optical-axis: >-
    derived, and it is NOT the module's vertical centreline. 4.25 was half of 8.5 and
    nothing ever sourced it - only the X of the bore centres was measured - and it was
    only ever consistent with a bore drawn as a plain square. std/lc-bore@3 is 6.3 tall
    because the opening is keyed, and at 4.25 its latch slot would need y 0.30 to 1.90,
    which is exactly where the bail lies (0.55 to 1.60): the aperture cut the bail in
    half in the compiled render. The receptacle goes below the bail, so the aperture
    starts at 1.75 - 0.15 clear of it - and the axis follows to 5.70. THREE INDEPENDENT
    READINGS AGREE THAT IT SITS LOW, and none of them is a callout: LINK-PP's
    LS-SM311G-10C front view scales to a bore square 2.70 +/-0.3 below the face top (an
    axis near 5.05); the face BELOW the bail, 1.60 to 8.50, has its own centre at 5.05;
    and the bail and the QSFP receptacle housing both have to sit clear of the opening.
    They bracket 5.05 to 5.85 and 5.70 is inside that. The number that would settle it is
    in IEC 61754-20, which is paywalled - see `gap` on std/lc-bore@3
  length: drawing (2.18 in [55.4] overall; 0.49 in [12.3] is the face height with the
    bail extended, which is why the module reads taller than 8.5 when unlatched)
  protrusion: derived (55.4 module length less the ~41.5 bezel-to-connector measured
    on the TE 2007562-6 cage, so ~13.9 stands proud of the faceplate)
  bail-colour: convention (blue commonly marks single-mode); the drawing is
    monochrome and states only "SFP MODULE 100MB 30km SINGLE-MODE"
  bores: >-
    std/lc-bore@3 - the KEYED opening, 4.7 wide by 6.3, whose first tier is the 4.7
    square from the ProLabs CWDM4 section A-A and, now, from LINK-PP's LS-SM311G-10C
    drawing of this exact module class. Composed @1 (4.6 x 4.4, proportional), then @2
    (4.7 square) when the two versions were collapsed, and now @3 once that square
    proved to be one tier of four (#126). Each bore's CENTRE is unmoved at (3.575,
    4.25) and (9.925, 4.25), keeping the 6.35 spacing the SFP-30K-FSF drawing gives;
    only the opening's outline changed, and rotate: 180 puts the latch tongue up. The
    keyway is 1.60 because that is what an 8.5 face leaves above a bore square on the
    centreline - see `short-keyway` on @3, and `lc-spacing` below for why the
    centreline itself is only half-sourced
parts:
  # lifted to the module front: these recess from the transceiver face, which is
  # 13.9 proud of the panel, not from the panel itself
  - {ref: std/lc-bore@3, id: lc-a, at: [1.225, 1.75], lift: 13.9, rotate: 180}
  - {ref: std/lc-bore@3, id: lc-b, at: [7.575, 1.75], lift: 13.9, rotate: 180}
relief:
  features:
    - node: body
      out: 13.9
      color: '#6e747c'
      confidence: drawing
      source: >-
        common/sfp-lc-duplex@1's own protrusion key - 'derived (55.4 module length less the
        ~41.5 bezel-to-connector measured on the TE 2007562-6 cage, so ~13.9 stands proud)'.
        A SUBTRACTION OF TWO SOURCED NUMBERS rather than a reading: 55.4 is the
        AutomationDirect SFP-30K-FSF drawing, 41.5 is measured off the TE cage. Tokened
        `drawing` for the weaker of the two inputs; the tilde in the contract's own '~13.9'
        is honest and is why this is not `measured`.
    - node: bail
      lift: 13.9
      out: 14.3
      color: '#2f5fa8'
      confidence: estimated
      source: >-
        common/sfp-lc-duplex@1 - unsourced. The length key gives '0.49 in [12.3] is the face
        height with the bail extended', which is a HEIGHT across the face, not how far
        forward the bail reaches. 14.3 is 0.4 past the body's derived 13.9 and nothing
        states it.
connection-points:
  # mate is the module centre - what lands on the port's mate point - and stays
  # on the centreline. optical is where the fibre lands, and that is the bores'
  # own axis, which #126 moved to 5.70; see provenance.optical-axis.
  mate: {at: [6.75, 4.25], direction: front}
  optical: {at: [6.75, 5.7], direction: front}
skins: [default]
