provenance:
  airflow-colour-convention: >-
    EDGECORE COLOUR-CODES AIRFLOW ON THIS PART, AND SAYS SO IN EIGHT DOCUMENTS.
    Every one carries the same Airflow Reversal instruction: take out the
    front-to-back (F2B) fan trays and PSUs, which have red handles and red
    release latches, and fit back-to-front (B2F) ones, which have blue handles
    and blue release latches.
    The seven staged are the AIS800-32D and AIS800-32O quick start guides, the
    AMX3200's, and the DCS201, DCS240, DCS510 and DCS511 guides; the eighth is the
    DCS204 (AS7726-32X) guide, which this library registers as a reference and
    quotes on that device already.
    SO THE DEFAULT ON THE FIELDS BELOW IS THE F2B COLOUR, not a neutral one, and a
    back-to-front build overrides it per configuration. That is why the red is a
    default rather than a fixed fill: one part, two colours, decided by which
    airflow variant is installed.
    IT IS A FACT ABOUT THIS PART AND NOT ABOUT ANY CHASSIS, which is why it is
    recorded here. Three chassis in this library offer B2F builds - AS5912-54X,
    AS7326-56X and AS7726-32X - and all three seat this same component.
    See roc-ops/Portrayal#277.
  states: >-
    A LAMP ON A GENERIC IS A POSITION INVENTED FOR EVERY DEVICE THAT SEATS IT, which
    is the argument #212 used to strip the three common/ fan generics and applies
    here unchanged. This part is seated by six devices across three Edgecore families
    - AS5912-54X, AS7326-56X, AS7726-32X, COR580, AGR110 and AGR130 - and no document
    held for any of them describes a status lamp on the supply: the quick-start guides
    cover PSU replacement and airflow and never a PSU LED.
    So the drawing has no lamp because nothing measured one, and the module no longer
    declares `ok` and `fail` it cannot show. If a per-family supply turns out to carry
    one, it belongs on that family's own part rather than on the generic.
  power: >-
    datasheet - the Edgecore boxes this generic serves state it directly. The DCS204
    datasheet (AS7726-32X): 'PSUs: 2 redundant, load-sharing, hot-swappable 650W AC or -48
    VDC', with the input line '100-240 VAC at 50-60 Hz (6A/650 W max.)'. The DCS203
    datasheet (AS7326-56X) lists the FRU itself - 'YM-2651Y | 650 W AC Power Supply FRU' -
    in both airflow directions, and its quick-start guide repeats '100-240 VAC, 50-60 Hz,
    650 Watts'. NO MODEL IS SET ON THIS CONTRACT and that is deliberate: this is a `common/`
    generic standing for the 650 W CRPS supply across three Edgecore chassis, and the vendor
    ships it as at least two FRU part numbers differing only in airflow direction. What the
    datasheets fix is the RATING, which the form factor and the chassis both share.
