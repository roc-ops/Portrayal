format: 1
kind: module
name: qsfp-transceiver
version: 1.1.0
class: transceiver
behaviour: occupies
profile: networking
description: >-
  QSFP transceiver with a white pull-latch bail, drawn from a vendor mechanical
  drawing. The face is the module envelope that enters the cage; the bail is a
  U-bail standing proud of it, and the body carries the heatsink ribs on top and
  the label area underneath.
unplaced: >-
  SUPERSEDED by generic/qsfp-lc@1, which carries the same measured face without
  this part's baked-in mode, reach and speed - a specific 30 km single-mode
  module wearing a generic's name was the defect. Nothing references this major;
  it is deleted in a later sweep once B and C have landed on the successor.
size: {w: 18.35, h: 8.5, d: 83.2}
mates: qsfp
attrs: {power-absent: not-applicable, media: qsfp, form-factor: qsfp}
provenance:
  power: >-
    NOT APPLICABLE, because this contract is a GENERIC and not a part. It is a shape that
    stands in for every module of its kind, so there is no one figure to state: a 40GBASE-SR4
    is about 1.5 W and a 400G ZR about 20 W, and this single drawing is both of them. Any
    wattage written here would be a fiction dressed as a fact rather than a missing one. The
    figure belongs on the PLACEMENT, where a device that knows which module it ships can
    source it - the same division of labour L18 already draws for `media`, where a port
    inheriting a family from its cage must declare the real media on the placement. L27 has
    always exempted this contract in code; this records the reason in the data, so that a
    consumer totalling a chassis can tell a deliberate silence from an unanswered question.
    The chassis-level hole stays visible in L29, which is the right place for it.
  size: drawing - 18.35 +/-0.10 wide by 8.50 +/-0.10 high are called out
    directly. Depth 83.2 is the 118 reference overall less the 34.80 MAX tab
    reach, so it follows from the drawing rather than from a standard
  geometry: rebuilt from common/qsfp-drawing once those views were corrected
    against photographs, rather than from a first reading of the drawing
  bail: composed from common/qsfp-pull-tab, which carries the drawing's 19.00
    MAX across, 3.40 MAX thick and 34.80 MAX reach. Placed at -0.325 so the
    tab's 19.00 straddles the 18.35 module symmetrically, as the drawing shows
  heatsink: drawing - HEATSINK AREA on the upper face, flatness 0.075
  label: drawing - LABEL AREA 40.10 MAX on the underside
  face: the optical interface is MPO or LC duplex depending on the reach - MPO
    for parallel optics, LC duplex for the serial variants - so it is a skin
  face-lc: drawing - ProLabs PAN-QSFP28-100GBASE-CWDM4-C datasheet,
    Mechanical Specifications, section A-A.
    Bore centres 6.25 +/-0.05 apart, each opening 4.7 +/-0.05 square, T left and
    R right as that section labels them. The 6.25 is the IEC 61754-20 duplex
    pitch and is corroborated by the Smartoptics QSFP-LC stencil master, which
    places its two optical connection points at Width/3 and 2*Width/3 - 6.12 on
    an 18.35 face, within 2 percent. Same drawing independently confirms five
    figures already in this contract (18.35, 8.50, 29.60, 4.20, 2.00)
  optical-axis: >-
    derived, and it is NOT the module's vertical centreline. The bores sat at 4.25, half
    of 8.5, which no source gives and which only ever suited a bore drawn as a plain
    square. std/lc-bore@3's opening is keyed and 6.3 tall (#126), and the receptacle
    housing it sits in was 5.30 - too short to contain it at any position, so the latch
    tongues rendered out on bare face. The housing is now 6.90 (0.65 to 7.55, clear of
    the T/R silkscreen), the aperture sits at 0.95 to 7.25 with a 0.30 frame, and the
    axis follows to 4.90. sfp-lc-duplex made the same move for the same reason and
    landed at 5.70; the two differ because their faces carry different furniture - a
    bail across the top there, silkscreen along the bottom here - and neither number is
    a callout. The figure that would settle both is in IEC 61754-20, which is paywalled;
    see `gap` on std/lc-bore@3
  silkscreen: >-
    the T and R positions are the ProLabs section A-A labelling. Their COLOUR was
    #8d949c on a #8d949c face and so had never rendered at all; #126 found it only
    because the taller housing put half of each letter over dark. Now the shell's own
    stroke colour, which is a silkscreen rather than an invisible one
  receptacle-housing: >-
    the 11.55 width and the 3.40 left edge are as drawn against the ProLabs section A-A
    bore centres. THE HEIGHT IS NOT SOURCED and never was - it was 5.30 and is now 6.90,
    grown to contain the keyed opening it frames rather than measured off anything
  face-mpo: the MPO variant is deliberately NOT here. Parts are emitted for
    every skin, so two LC bores would appear on an MPO face too - one component
    cannot carry both. It needs its own component, and needs dimensions first.
    The photographs give the topology (two alignment pins with the fibre row
    between them) and nothing else, so there is nothing yet to build it from
  latch-features: drawing - 4.20 +/-0.15 and 2.00 +/-0.15 steps at the cage end,
    29.60 +/-0.10 to the latch shoulder, 48.20 MIN to datum D
elements: {}
relief:
  wall: '#4a4f55'
parts:
  # the pull tab is its own part - a flat loop, not a round bail, and vendors
  # colour-code it, so it carries its own skins
  - {ref: common/qsfp-pull-tab@1, id: tab, at: [-0.325, 2.55], skin: white}
  # Each bore is a part rather than paint. A cavity declared here would take
  # its depth from size.d - 83.2, the whole body - and punch a tunnel clean
  # through the module, which is exactly what the 3D was doing. lc-bore carries
  # its own 4.5, which is the recess you actually see looking into the port.
  # @3 is the keyed opening (#126), 4.7 x 6.3 rather than a 4.7 square, and
  # rotate: 180 turns its latch tongue up. The axis moved down with it - see
  # provenance.optical-axis - so optical-tx and optical-rx below read 4.90.
  - {ref: std/lc-bore@3, id: tx, at: [3.70, 0.95], rotate: 180}
  - {ref: std/lc-bore@3, id: rx, at: [9.95, 0.95], rotate: 180}
connection-points:
  # mate is what aligns the module in its cage; optical is where the fibre lands
  mate: {at: [9.175, 4.25], direction: front}
  optical-tx: {at: [6.05, 4.9], direction: front}
  optical-rx: {at: [12.30, 4.9], direction: front}
body:
  depth: 83.2
  color: '#8d949c'
skins: [lc]
