<svg xmlns="http://www.w3.org/2000/svg" width="20mm" height="20mm" viewBox="0 0 20 20">
  <!-- The round boss of an scte-91 port, seen from the face, and the opening
       cut through it (evenodd) so the opening, standing lower, shows in 3D.
       Each node is the whole art of its relief feature. -->
  <path id="boss" fill-rule="evenodd" fill="#b9bcc0" stroke="#7d8186" stroke-width="0.2"
        d="M 10 0 a 10 10 0 1 0 0 20 a 10 10 0 1 0 0 -20 Z M 10 2.5 a 7.5 7.5 0 1 1 0 15 a 7.5 7.5 0 1 1 0 -15 Z"/>
  <!-- The threaded opening. -->
  <circle id="bore" cx="10" cy="10" r="7.5" fill="#0b0c0d"/>
</svg>
