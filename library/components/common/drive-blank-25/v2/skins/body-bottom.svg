<svg xmlns="http://www.w3.org/2000/svg" width="17.868mm" height="25.0mm" viewBox="0 0 17.868 25.0">
  <!-- BOTTOM, authored mirrored in both axes as the schema requires.
       A FILLER, SO THE SIDES ARE PLAIN. No drive, no rails carrying
       one, no screws holding one - drawing the carrier's would be
       inventing hardware, and would blur the one difference that
       matters when a bay is empty. The band is the bezel.
  -->
  <rect x="0" y="0" width="17.868" height="25.0" fill="#3c4247" stroke="#2a2e32" stroke-width="0.4"/>
  <rect x="0" y="19.0" width="17.868" height="6.0" fill="#33383d"/>
</svg>
