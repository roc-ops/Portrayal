format: 1
kind: module
name: drive-blank-25
version: 2.0.0
class: blank
behaviour: fills
profile: server
description: >-
  Filler for a 2.5 inch SFF drive bay - the carrier moulding without the drive:
  same release with its orange ring, same rails, same three windows onto the
  tray honeycomb, and nothing at the head, because the glyphs on a populated
  carrier are its lamps and a blank has nothing to report
attrs:
  media: sff-2.5
  form-factor: '2.5-inch SFF'
provenance:
  size: >-
    drawing - 15.3 x 73.0, the face of the carrier whose bay it fills - common/drive-carrier-25@2's, which carries the measurement and is summarised here, standing on edge. @1 was
    17.868 x 79.4, and neither of those was the carrier: 17.868 is the R740xd's
    bay PITCH and 79.4 the vertical extent of its bay SEAMS on a face-on render
    (both still measured there, and the R740xd's bays keep them - see that
    device's bay-pitch and bay-vertical provenance). @1's own body-inset key
    already said the body inside that pitch was 14.86.
    WHAT FIXES 15.3 x 73.0 IS FOUR DELL DRAWINGS OF THE SAME PART. The 16G R760
    24-bay front master (true scale, drawn ear to ear) has its carriers 15.3 wide
    on a 17.8 pitch with 2.5 mm of chassis between them, and 72.45..73.9 long;
    the 16G R660 10-bay front master lays the same carrier flat, 73.0 x 15.3, on
    an 82.85 column pitch; Dell's isolated carrier master (14g-2-5-sas-ssd-h)
    is stamped 72.5 long with an aspect of 4.74, which is 72.5 x 15.3; and a
    photograph of a real R660 gives an aspect of about 4.8. The R740xd's own ISM
    figure put the body at 14.86 between its rails - 3% under, inside what a
    figure at that resolution resolves.
    ONE PART ACROSS 14G, 15G AND 16G. Dell sells one 2.5 inch carrier, DXD9H, for
    14th- through 16th-generation PowerEdge including the R740xd and the R660
    (reseller listings, secondary), and Dell's own service models put the same
    carrier asset in both machines (r740xd.glb `DD9900_ Drives_` and r660.glb
    `Poweredge_R760_Drive_Carrier_Assembly`, identical children). The CAD's
    78.3 x 18.48 is that asset's bounding box, which takes in what stands off the
    face, and is not the face - it would overlap its neighbour by 2.7 mm on the
    R660's 15.8 row pitch.
    ONE DRAWING DISAGREES: the 15G r750-24d-2-5-front master draws its carriers
    79.01 long, the figure @1 leaned on for corroboration. Against the R760's
    16G master, the isolated carrier master and the R660, it is the outlier, and
    it measures the bay outline rather than the carrier.
  size-was-a-bay: >-
    THE ART IS @1's, RESCALED, NOT REDRAWN. @1 drew its features as percentages
    of the length (from the isolated 14g master) inside a 14.86 body; @2 maps
    that body onto the 15.3 face (x 1.5..16.36 to 0..15.3, scale 1.0296) and the
    79.4 length onto 73.0 (scale 0.9194), so every feature keeps its fraction of
    the part. The gap @1 drew either side of the body is the bay's, and is gone.
  face: >-
    THE SAME GENERATOR DRAWS BOTH FACES. A blank and a populated carrier are one
    moulding differing in one thing, and two files drawing "the same part except"
    drift silently - nothing fails, the faces just stop matching, and a viewer
    reading a row of 24 bays sees a seam that is not on the hardware. The
    proportions are therefore the carrier's, transcribed from Dell's 14g-2-5-sas-v-1
    master: ring centred at 16.1% of the length, rails 23.1-98.3% down BOTH long
    edges, windows at 34.4-48.1, 49.9-63.7 and 65.6-77.1%.
  no-lamps: >-
    OPERATOR REPORT, from the part in hand: the blank is the same as the carrier
    except that it has no LEDs at the head - same release mechanism, everything
    else identical. That is the only difference modelled, and no drawing held
    here contradicts or confirms it. THE STENCIL DOES NOT SETTLE IT: Dell's rack
    server stencil has no 14G blank master at all, and its only 2.5 inch filler
    is 17G, a different generation, drawn as four paths and a plain rectangle
    with no features to compare.
  label: >-
    A WHITE SQUARE WITH A QR CODE IN IT. This took three passes and each one was
    a different reading of the same corner: a plate with a Phillips head (from a
    photograph), then a wide dark strip with bars standing in for printing, and
    now what the operator reports from the machine with the compiled drawing
    zoomed beside it - a light, roughly square label carrying a QR and nothing
    else worth drawing. A screw says the part is bolted and a label says it is
    identified, so the first of those was not a detail apart.
    THE CODE DOES NOT RESOLVE, DELIBERATELY. It is a plausible module grid with
    the three finder patterns that make a QR read AS a QR, generated from a fixed
    rule so it is stable across builds. Encoding a real payload would put a
    scannable string on every drive bay in the library, which is a claim about a
    machine rather than a picture of one.
  depth: >-
    estimated, AND DELIBERATELY NOT THE CARRIER'S 105. A blank holds no drive,
    so there is no reason for it to run the length of one, and copying the
    carrier's figure would assert a depth nothing measured. No document held here
    states it. 25 is a placeholder for a face with a short airflow shroud behind
    it and should be replaced by a measurement, not defended.
  power: >-
    a blank draws nothing. It is not that the figure is unknown - there is no
    figure, which is why no power-draw attribute is stated rather than a zero
    that would read as a measurement.
size: {w: 15.3, h: 73.0, d: 25.0}
size-confidence: {w: drawing, h: drawing, d: measured}
# A BLANK IS A SOLID AND HAD NO WAY TO SAY SO. relief.js builds a module's
# body only `if (meta.body)`, so without this key ejecting one gave a face plane
# hanging in the air - not a shallow filler but a texture with nothing behind it.
# 25.0 is this contract's own `d`; drive-blank-35 has carried the same key since
# it was drawn and this one never did.
body: {depth: 25.0, color: '#3c4247'}
