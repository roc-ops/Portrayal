  - node: window-1
    pocket: 7.6
    confidence: borrowed
    source: >-
      common/drive-carrier-25@2 - the depth of its own `window-1`, measured
      off Dell's service model r740xd.glb. NO BLANK APPEARS IN THAT SCENE: it
      is posed fully populated, with carriers in every bay and nothing named
      blank, filler or dummy anywhere in it, so this number is the carrier's
      and not this part's. What is known without the part is that a Dell
      filler is a moulded face with the same windows pressed into it rather
      than a painted plate - so flat is certainly wrong, and the carrier is
      the nearest thing to right that can be had. Replace it with a reading
