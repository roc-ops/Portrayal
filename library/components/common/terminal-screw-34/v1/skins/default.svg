<svg xmlns="http://www.w3.org/2000/svg" width="3.4mm" height="3.4mm" viewBox="0 0 3.4 3.4">
  <!-- The slotted head of a barrier block's terminal screw, 3.4 across, as
       common/dc-terminal-24@1 drew it. The head's outline stroke runs 0.1 outside
       the box, as it did on the block. -->
  <circle id="head" cx="1.7" cy="1.7" r="1.7" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2"/>
  <path id="slot" d="M 0.35 1.7 H 3.05 M 1.7 0.35 V 3.05"
        fill="none" stroke="#5b6167" stroke-width="0.3" stroke-linecap="round"/>
</svg>
