<svg xmlns="http://www.w3.org/2000/svg" width="6mm" height="3.4mm" viewBox="0 0 6 3.4">
  <!-- The monitor mark: a display outline with a short bar each side, which is
       the form Dell prints above the front VGA. The box was measured off the
       ISM figure; the shape inside it is drawn to the recognisable symbol,
       because at 6.5644 px/mm the internals are not resolvable and tracing them
       would be inventing detail the picture does not carry. -->
  <g id="symbol" fill="none" stroke="#c7ccd1" stroke-width="0.34"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.55" y="0.55" width="2.90" height="2.30" rx="0.30"/>
    <path d="M0.55 1.20 V2.20"/>
    <path d="M5.45 1.20 V2.20"/>
  </g>
</svg>
