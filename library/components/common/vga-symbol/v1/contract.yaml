format: 1
kind: component
name: vga-symbol
version: 1.0.0
class: silkscreen
description: >-
  The monitor mark printed beside a VGA port - a display outline flanked by two
  short bars, which is the form vendors settled on for "plug a screen in here"
size: {w: 6.0, h: 3.4}
provenance:
  size: >-
    photo-measured from Dell's R740xd ISM figure 2 at 6.5644 px/mm, where the
    mark sits above the VGA in the right-hand ear. At that scale the mark is
    about 40 px across and its INTERNAL proportions are not resolvable, so the
    outline is drawn to the recognisable form of the symbol rather than traced.
    The box is what was measured; what is inside it is a drawing.
  form: >-
    NOT A STANDARD. There is no registry entry for this mark and no document
    held here dimensions it - unlike the USB trident, which is a published
    symbol. It is recorded as `silkscreen` for that reason: it is ink that says
    what the hole beside it is for, and it carries no geometry anything else
    should depend on.
skins: [default]
