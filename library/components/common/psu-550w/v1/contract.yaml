format: 1
kind: component
name: psu-550w
version: 1.1.0
class: psu
behaviour: fills
profile: networking
description: >-
  550W hot-swap PSU module with an integrated axial fan and its own C14 inlet,
  as fitted to the Smartoptics DCP chassis. Wider than the Edgecore
  psu-ac-650 family because the fan and inlet share one module face.
unplaced: >-
  the MaiaEdge PBC-2000 is an open question this part is one of the two answers to. Its
  `psu-module-width` gap reads `sources-disagree`: the rear photograph, on a scale five fans
  validate to 0.2%, puts each supply near 85.5mm, which is far closer to this major's 84.0
  than to the 73.5 CRPS width of `common/psu-550w@2` that the device currently places. Retired
  as the maintained major, NOT retired as a candidate - delete it and the gap's own argument
  loses the figure it turns on. Settled by a face-on rear photograph or the vendor's part
  number.
size: {w: 84.0, h: 40.0}
attrs: {power-output-w: 550, input: ac}
provenance:
  power: >-
    photo-measured - read off the unit's own rating label in the bench photographs
    (three photographs of one supply): 'TOTAL POWER: 550W Max', with
    'OUTPUT +12V 45A Max, +12Vsb 1A Max' and 'INPUT 100-240V~ 8.6A, 50-60Hz'. It checks
    itself - 45 A x 12 V is 540 W on the main rail plus 12 W of standby. The unit photographed
    is a Gospower G1251-0550WNA, P/N CRPS0550-AH rev R00, as fitted to the Smartoptics DCP
    chassis this component serves. No model is set on the contract deliberately: CRPS is a
    standard form factor and this drawing is the envelope of it.
  size: approximate - measured from a rear photo of racked DCP-R units
    (IMG_2181), calibrated on the 440mm chassis width. Perspective was not
    corrected, so treat as +/- 3mm until a straight-on rear elevation exists
  fan: photo - single axial fan at the module's outer end
  inlet: photo - C14 appliance inlet, mirrored to the outer edge on each side
elements:
  handle: {at: [30.0, 16.0], size: [22.0, 8.0], class: handle}
parts:
  - {ref: std/c14-inlet@1, id: inlet, at: [52.0, 10.0]}
relief:
  features:
    - node: handle
      out: 1.6
      color: '#3a4046'
      confidence: estimated
      source: >-
        common/psu-550w@1 - unsourced, and superseded: v2 models the same handle as a 22.85
        uhandle from a six-sided photo set. This 1.6 out is the v1 flat-plate reading and is
        kept only so v1 still renders.
skins: [default]
