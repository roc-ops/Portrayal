<svg xmlns="http://www.w3.org/2000/svg" width="8mm" height="8mm" viewBox="0 0 8 8">
  <!-- A M4 pan head, 8 across, head on, with its cross recess. The
       head is the whole art of the relief feature `head`. -->
  <g id="head">
    <circle cx="4" cy="4" r="3.9" fill="#b9bec4" stroke="#62686e" stroke-width="0.2"/>
    <path d="M 2.24 4 H 5.76 M 4 2.24 V 5.76"
          fill="none" stroke="#4e5359" stroke-width="0.48" stroke-linecap="round"/>
  </g>
</svg>
