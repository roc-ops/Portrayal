format: 1
kind: component
name: esd-warning
version: 1.0.0
class: marking
behaviour: mounts
profile: networking
description: >-
  Electrostatic-sensitive-device warning sticker - the IEC 61340-5-1 hand-in-triangle
  symbol, a black triangle with a yellow border, with the word ESD printed beneath it.
  Applied to the chassis where modules are handled, as distinct from common/esd-jack,
  which is the wrist-strap socket itself.
size: {w: 7.7, h: 8.5}
size-confidence: {w: photo-measured, h: photo-measured}
provenance:
  size: >-
    photo-measured - the sticker beside the MGMT LAN jack on the OSA 5420, 2023 OSA 5420
    Series data sheet p1 front render at 3.25 px/mm: triangle 7.1 wide x 6.2 high, "ESD"
    beneath it to 8.5 overall. Read at 10x zoom, which is also what identified it: a
    black field with a yellow border carrying the reaching hand, not the yellow-field
    general warning of common/warning-triangle@1.
  symbol: >-
    IEC 61340-5-1 names the handling precaution and the OSA 5420/5421 manual cites it
    beside every ESD caution. The hand is drawn schematically - the standard's own
    artwork is not held here, and the sticker in the render is 7 mm across, which
    resolves the hand's outline but not its detail.
elements: {}
skins: [default]
