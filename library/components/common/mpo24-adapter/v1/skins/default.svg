<svg xmlns="http://www.w3.org/2000/svg" width="13.8mm" height="9.4mm" viewBox="0 0 13.8 9.4">
  <!-- Panel-mount MPO/MTP-24 adapter, 13.8 x 9.4 - BORROWED from
       common/mpo-adapter@1's own body, not measured here. 57023.E.jpg (the
       only rear render of FS's MTP-24 cassette, SKU 57023) fails
       panel_measure's own validation at 4.66% off the known 35.05 mm second
       axis, so nothing in this library's imagery of the 24-fibre part
       measures a shell this library did not already hold - see the
       contract's own `provenance.size`.

       THE APERTURE IS NOT DRAWN HERE, for the same reason common/mpo-adapter@1
       leaves its own aperture undrawn: std/mpo@1 is composed by the contract
       at 3.0, 1.9; this skin is only the bezel it sits in. -->
  <defs>
    <linearGradient id="bez" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4248"/>
      <stop offset="1" stop-color="#23272c"/>
    </linearGradient>
  </defs>
  <rect id="bezel" x="0" y="0" width="13.8" height="9.4" rx="0.5"
        fill="url(#bez)" stroke="#15181a" stroke-width="0.2"/>
</svg>
