format: 1
kind: module
name: pcie-card-fh
version: 1.0.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  A generic full-height PCI Express
  add-in card, half-length - the standard bracket at the chassis wall and a
  PCB slab running into the chassis behind it. What is fitted stands in for
  any card until the card itself is modelled.
size: {w: 120.02, h: 21.59, d: 167.65}
attrs:
  role: expansion-card
  power-absent: not-published
provenance:
  size: >-
    standard - the face is the pcie-bracket-fh bracket, 120.02 x 21.59, and the length is
    the PCI Express CEM 5.0 half-length card, 167.65 from the bracket.
  the-body-is-the-card: >-
    THE BRACKET IS THE FACE AND THE PCB IS THE BODY. A card is changed from
    the rear - its bracket is what you see, its slot is a bay on the rear
    face - and the rest of it lies inside the chassis on the riser's shelf.
    `body.boxes` is that PCB: a slab 1.6 thick lying in the plane of the
    slot, from inside the riser's connector to the card's top edge, the
    card's length deep. It ejects with its riser, as the hardware does.
  the-pcb-box: >-
    estimated. The bracket's TIP (x 0) goes into the chassis card guide and
    the flange end (x 120.02) is inboard, under the riser's latch; the riser's
    slot connector stands 14.3..25.6 along the bracket from the tip, so the
    PCB's edge fingers are in it and the board starts at 15.5 and runs to
    123.4, which is the CEM's 111.28 maximum card height
    less the fingers, and where Dell's service model draws its generic card
    ending. Its plane is 3.0 from the bracket's top edge, the middle of the
    connector's 10.8. Thickness 1.6 is the CEM nominal 1.57.
  power: >-
    NOT PUBLISHED per card, and could not be: this is a placeholder for
    whatever card is fitted. A real card's draw belongs to the contract that
    models that card.
  lifecycle: >-
    not applicable - a placeholder.
body:
  depth: 167.65
  color: '#2f7a4e'
  boxes:
  - {id: pcb, at: [15.50, 3.00], size: [107.9, 1.6], from: 0.0, depth: 167.65,
     color: '#2f7a4e', confidence: estimated,
     source: 'PCIe CEM 5.0 half-length and 111.28 card height; the plane from the riser connector''s middle'}
parts:
  - {ref: std/pcie-bracket-fh@1, id: bracket, at: [0, 0], behind: true}
elements:
  pcb-edge: {at: [19.96, 9.8], size: [89.9, 1.2], class: bezel}
skins: [default]
