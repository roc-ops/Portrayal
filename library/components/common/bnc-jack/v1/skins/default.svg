       M 1.525 6.35 A 4.825 4.825 0 1 0 11.175 6.35 A 4.825 4.825 0 1 0 1.525 6.35 Z"/>
  <rect id="lug-l" x="0.84" y="5.3575" width="0.885" height="1.985" fill="#d7dade" stroke="#7d8388" stroke-width="0.1"/>
  <rect id="lug-r" x="10.975" y="5.3575" width="0.885" height="1.985" fill="#d7dade" stroke="#7d8388" stroke-width="0.1"/>
