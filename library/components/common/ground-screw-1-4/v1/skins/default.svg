<svg xmlns="http://www.w3.org/2000/svg" width="12.5mm" height="12.5mm" viewBox="0 0 12.5 12.5">
  <!-- A 1/4-20 pan head, 12.5 across, head on, with its cross recess. The
       head is the whole art of the relief feature `head`. -->
  <g id="head">
    <circle cx="6.25" cy="6.25" r="6.15" fill="#b9bec4" stroke="#62686e" stroke-width="0.2"/>
    <path d="M 3.5 6.25 H 9 M 6.25 3.5 V 9"
          fill="none" stroke="#4e5359" stroke-width="0.75" stroke-linecap="round"/>
  </g>
</svg>
