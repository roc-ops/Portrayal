<svg xmlns="http://www.w3.org/2000/svg" width="107.8mm" height="26.5mm" viewBox="0 0 107.8 26.5">
  <!-- 3.5 inch hot-swap drive carrier, front face, drawn in its MOUNTED
       orientation - wide. Both places this device uses it put it that way: the
       rear bays lay it flat, and the 12 x 3.5 inch front is a 3 x 4 grid of
       flat carriers (ISM figure 18).
       Measured off ISM figure 9, "Back view of 2 x 3.5 inch drive system",
       which passes Gate 1 at 0.27% - better than figure 8's 1.05%, and which
       nothing had used. The two carriers there measure 108.0 and 107.6 wide,
       and 107.8 x 26.5 sits within a millimetre of the bare drive it carries
       (101.6 x 26.1) - the check that the reading is of the CARRIER and not of
       the bay opening around it. -->
  <rect id="body" x="0" y="0" width="107.8" height="26.5" rx="1.0"
        fill="#3f454b" stroke="#22262a" stroke-width="0.35"/>
  <rect id="face" x="1.2" y="1.4" width="105.4" height="23.7" rx="0.7"
        fill="#4a5158"/>

  <!-- the two indicators, at the outboard end, one above the other -->
  <rect id="lamp-activity" x="4.6" y="4.4" width="2.6" height="4.4" rx="0.4"
        fill="var(--led-color, #2c3a30)"/>
  <rect id="lamp-status" x="4.6" y="15.8" width="2.6" height="4.4" rx="0.4"
        fill="var(--led-color, #2c3a30)"/>

  <!-- the release latch is a RING, and it is amber. Ring r 4.00 with a 1.30
       wall, on a plate 15.20 wide at local 16.10 - all read off figure 9 at
       8.2 px/mm. A first pass drew r 5.10 on a 19.00 plate, about a quarter
       oversize, which at carrier scale reads as a different latch. The 2.5 inch carrier's is a
       grey ring; this one is Dell's hot-swap touchpoint colour, which is what
       the figure shows and what the service label's legend calls terracotta. -->
  <g id="release">
    <rect x="16.1" y="4.2" width="15.2" height="18.1" rx="1.0" fill="#3a4046"/>
    <circle cx="23.7" cy="13.25" r="4.0" fill="none" stroke="#c2702a"
            stroke-width="1.3"/>
  </g>

  <!-- THE VENT PATTERN IS NOT RESOLVED at 4 px/mm. The real carrier is
       honeycomb; what the figure gives is three dark panels with bright
       separators between them, so three panels is what is drawn rather than a
       hex grid nothing measured. -->
  <g id="vents" fill="#1d2126">
    <rect x="39.0" y="4.6" width="15.5" height="17.3" rx="0.6"/>
    <rect x="56.2" y="4.6" width="15.5" height="17.3" rx="0.6"/>
    <rect x="73.4" y="4.6" width="15.5" height="17.3" rx="0.6"/>
  </g>

  <!-- the capacity label, inboard end, rows right-aligned to the block's own
       edge the way the 2.5 inch carrier's are -->
  <rect id="label" x="92.0" y="5.4" width="12.6" height="15.7" rx="0.3"
        fill="#33383d" stroke="#22262a" stroke-width="0.2"/>
  <g id="silkscreen">
    <text x="101.5" y="11.2" font-family="sans-serif" font-size="3.9" font-weight="bold" fill="#e7ebee" text-anchor="end">10</text>
    <text x="103.8" y="11.2" font-family="sans-serif" font-size="2.3" fill="#c8ced3" text-anchor="end">TB</text>
    <text x="103.8" y="15.4" font-family="sans-serif" font-size="2.6" fill="#e7ebee" text-anchor="end">SATA</text>
    <text x="103.8" y="19.4" font-family="sans-serif" font-size="2.4" fill="#c8ced3" text-anchor="end">7.2K</text>
  </g>
</svg>
