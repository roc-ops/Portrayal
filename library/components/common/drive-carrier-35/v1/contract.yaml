format: 1
kind: module
name: drive-carrier-35
version: 1.2.0
class: drive
behaviour: fills
profile: server
description: >-
  A 3.5 inch hot-swap drive in its carrier, drawn wide - the orientation both
  the rear bays and a 12 x 3.5 inch front mount it in
size: {w: 107.208, h: 26.5, d: 155.0}
attrs:
  form-factor: 3.5in
provenance:
  it-is-the-2-5-inch-carrier-scaled-and-laid-flat: >-
    IT WAS DRAWN AS A DIFFERENT KIND OF OBJECT and it is not one. Two plain LED
    rectangles where common/drive-carrier-25 has stroked lamp GLYPHS, three flat
    dark panels where that one has honeycomb seen through windows, and no rails
    at all - so two carriers out of the same family read as unrelated parts.
    ISM figure 9 shows the same vocabulary at both sizes: two green lamp glyphs
    on a recessed panel at the outboard end, an amber ring on a dark boss,
    bright rails along both long edges, and three windows onto a honeycomb tray.
    The ring, its plate and the label are unchanged - they were measured when
    this part was built and were not what was wrong with it.
  the-rails-and-the-carrier-face: >-
    photo-measured off ISM figure 9, Gate 1 at 0.27% - the best rear in either
    document. A tone profile down a column clear of the vents puts the carrier's
    visible face at y 9.75..35.25 with the bay's dark gap above and below, and
    lighter bands at 9.75..11.25 and 34.00..35.25 running x 187.3..260.3. Those
    are the rails: they start just outboard of the release plate and run to the
    inboard end, the same 23-to-98 per cent span the 2.5 inch carrier's have.
  the-honeycomb-is-carried-not-measured: >-
    "Bigger holes for the honeycomb to show through" is about the WINDOWS, which
    are 15.4 x 17.3 here against 12.2 x 10.9 on the 2.5 inch carrier. The mesh
    behind them belongs to the drive tray and is the same mesh in both.
    THE FIGURE CANNOT SETTLE THE CELL SIZE. At 4 px/mm a cut across the window
    band resolves the three PANELS, 15.62 apart, and not the cells inside them.
    So the flat-top cell and its 3.22 x 3.73 pitch are carried from
    common/drive-carrier-25 rather than read here - and a first pass that scaled
    them 1.6x drew a mesh visibly coarser than the figure's, which is the check
    that carrying them is right.
  the-lamp-glyphs-are-not-scaled-with-the-carrier: >-
    Figure 9's green shows at x 161.25..163.75, y 16.75..19.50 and 26.25..29.25 -
    about 2.5 across - but that is the LIT AREA, not the moulded glyph, and a
    lit mark is smaller than the mark. The glyph is the same silkscreen on both
    carriers so it is drawn the same size on both; the measurement fixes where
    it sits, which is what it can honestly say. Green in the figure, so activity
    is the upper one here.
  size: >-
    photo-measured - ISM figure 9, "Back view of 2 x 3.5 inch drive system",
    which passes Gate 1 at 0.27% against a 434 x 86.8 rear face. That is a
    BETTER figure than the 8 this whole device was built from, at 1.05%, and it
    had never been opened.
    The two carriers in it measure 154.80..262.80 and 314.20..421.80 - 108.0 and
    107.6 wide - and 7.5..34.0 tall.
    THE CHECK IS THE DRIVE INSIDE IT. A bare 3.5 inch drive is 101.6 x 26.1, so
    a carrier at ~107.5 x 26.5 is the drive plus a few millimetres of frame. A
    reading of the BAY OPENING rather than the carrier would have come out
    several millimetres larger and looked just as plausible; that it lands on
    the drive is what says which of the two was measured.
  width-was-107-8-and-is-now-107-208: >-
    photo-measured - and the earlier figure was not wrong, it was UNBOUNDED.
    Figure 9 shows two rear bays 160 mm apart, and two isolated openings put no
    upper limit on the part inside either of them; an opening is legitimately
    wider than what it holds. Four of 107.8 across the 12 x 3.5 inch front
    overrun that front's opening by 2.4 mm, which is how the slack showed up.
    dellr740xd-12x35.webp settles it. It passes Gate 1 at 0.07% against the
    482.6 x 86.8 RACK FACE - the tightest figure in this project - and its ear
    fold lines land at body-relative -0.67 and +434.79, independently confirming
    the 434.5 body. Its four columns divide the same backplane opening the 24
    SFF bays divide: autocorrelated period 107.216 against 428.832/4 = 107.208,
    agreeing to 0.008 mm. FOUR REPEATS BOUND A PART WHERE TWO DISTANT ONES
    CANNOT, so the front is the better witness to the width and the rear stays
    the better witness to the opening. Both readings still hold at 107.208.
  the-height-is-26-5-and-was-deliberately-not-changed: >-
    The same photograph measures the front's ROW pitch at 26.99 by three
    independent methods, and the flush-fit convention the 2.5 inch carrier
    follows would make that the height. It is not taken, because the rear
    opening is 26.5 and a carrier cannot be taller than the hole it goes in.
    Both numbers are upper bounds and 26.5 is the tighter one; the photograph
    also shows why the rows need not be flush, since bright cage shelves run
    between them where the columns have only a thin divider. Taking 26.99 would
    have contradicted a measured opening to satisfy a convention.
  it-declares-no-standard-and-that-is-deliberate: >-
    A first draft carried `conforms: drive-35` and lint rejected it - there is
    no such registry key. The right answer was not to add one: common/
    drive-carrier-25 declares no `conforms` either, and only std/drive-25, the
    BARE DRIVE, does.
    The registry's own drive-25 entry says why, and says it about this exact
    confusion: "three different things get called a 2.5 inch drive bay and only
    this one is standard - the chassis OPENING is the chassis's, the CARRIER is
    the vendor's, and the DRIVE is everybody's." A carrier is Dell's part with
    Dell's latch and Dell's lamps; SFF-8301 has nothing to say about it.
  depth: >-
    estimated - 155.0. Nothing held here dimensions a 3.5 inch carrier's depth;
    this is the drive's own 147 mm plus a carrier's frame, and it is a placement
    for the 3D extrusion rather than a measurement.
  one-carrier-per-bay: >-
    THE TWO CARRIERS ARE IN DIFFERENT BAYS, which is the whole reason this part
    exists rather than a 2 x 3.5 inch cage. Bay 2 runs to about face 288 and bay
    3 from there; the left carrier sits at 154.80 and the right at 314.20, one
    each side. A rear with two 3.5 inch drives is not one assembly - it is two
    bays each fitted with one carrier, and either bay could instead hold PCIe
    slots or a blank.
  the-vent-pattern-is-not-drawn: >-
    The real carrier's vent is honeycomb. At 4 px/mm the figure resolves three
    dark panels separated by bright ribs and no cell structure at all, so three
    panels is what is drawn. Drawing a hex grid would be inventing a pattern
    from knowing what these usually look like, which is the failure this note
    exists to prevent.
  the-latch-is-amber-and-that-is-a-touchpoint: >-
    photo-measured - a ring at local 22.0, 13.25, about 10 across, in Dell's
    hot-swap terracotta rather than the grey ring the 2.5 inch carrier carries.
    The service label's own legend gives that colour its meaning: terracotta is
    serviceable while the system is running.
  capacity-is-an-illustration: >-
    The label reads 10 TB SATA 7.2K, transcribed from the figure. Which drive a
    buyer fits is a purchase, not a property of the carrier - the default skin
    illustrates one and other capacities are skins, exactly as
    common/drive-carrier-25 handles it.
elements:
  window-1: {at: [40.0, 4.6], size: [15.4, 17.3], class: vent}
  window-2: {at: [56.8, 4.6], size: [15.4, 17.3], class: vent}
  window-3: {at: [73.6, 4.6], size: [15.4, 17.3], class: vent}
  release: {at: [16.1, 4.2], size: [15.2, 18.1], class: control}
  lamp-activity:
    at: [4.6, 4.4]
    size: [2.6, 4.4]
    class: led
    states:
      - 'off'
      - {name: active, color: '#22c55e', behavior: blinking}
  lamp-status:
    at: [4.6, 15.8]
    size: [2.6, 4.4]
    class: led
    states:
      - 'off'
      - {name: ready, color: '#22c55e'}
      - {name: fault, color: '#f59e0b', behavior: blinking}
      - {name: rebuild, color: '#22c55e', behavior: blinking}
skins: [default]
