format: 1
kind: component
name: qsfp28-cage
version: 2.2.0
class: port
profile: networking
description: QSFP28 cage at true 18.5mm pitch with four round per-lane LEDs (v2 = resized from v1's oversized 21mm; port number silk sits in the LED-row gap)
size: {w: 18.5, h: 14.5}
attrs: {media: qsfp28, speed: 100g, lanes: '4'}
provenance:
  size: photo-inferred (column pitch measured from product photo ~18.8mm; QSFP28 cage nominal)
  elements: photo-inferred
  led-states: quick start guide (blue=100G, orange=40G, white=25G breakout/lane, green=10G breakout/lane)
elements:
  cage: {at: [0.0, 3.5], size: [18.5, 11.0], class: cage}
  led-1:
    at: [1.5, 0.7]
    size: [1.6, 1.6]
    class: led
    states: ['off', {name: link-100g, color: '#3b82f6'}, {name: link-40g, color: '#f97316'},
             {name: link-25g, color: '#f5f7fa'}, {name: link-10g, color: '#22c55e'}, fault]
  led-2:
    at: [3.9, 0.7]
    size: [1.6, 1.6]
    class: led
    states: ['off', {name: link-100g, color: '#3b82f6'}, {name: link-40g, color: '#f97316'},
             {name: link-25g, color: '#f5f7fa'}, {name: link-10g, color: '#22c55e'}, fault]
  led-3:
    at: [13.0, 0.7]
    size: [1.6, 1.6]
    class: led
    states: ['off', {name: link-100g, color: '#3b82f6'}, {name: link-40g, color: '#f97316'},
             {name: link-25g, color: '#f5f7fa'}, {name: link-10g, color: '#22c55e'}, fault]
  led-4:
    at: [15.4, 0.7]
    size: [1.6, 1.6]
    class: led
    states: ['off', {name: link-100g, color: '#3b82f6'}, {name: link-40g, color: '#f97316'},
             {name: link-25g, color: '#f5f7fa'}, {name: link-10g, color: '#22c55e'}, fault]
connection-points:
  net: {at: [9.25, 9.0], direction: front}
skins: [default]
