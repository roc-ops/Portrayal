<svg xmlns="http://www.w3.org/2000/svg" width="22.58mm" height="4.85mm" viewBox="0 0 22.58 4.85">
  <!-- Face-on, the tab is seen end-on. Every box of an arm shares the 2.4
       arm width and the 2.4 strap thickness and differs in how high it
       sits: the root level with the nose top, three steps of the climb, the
       level run. They are drawn farthest from the viewer first and the grip
       across the far end last, so each paints over the one behind it and
       relief builds each as its own box (the contract provenance.shape). -->
  <rect id="arm-l" x="0" y="2.45" width="2.4" height="2.4" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="arm-r" x="20.18" y="2.45" width="2.4" height="2.4" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="arm-l-2" x="0" y="2.04" width="2.4" height="2.4" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="arm-r-2" x="20.18" y="2.04" width="2.4" height="2.4" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="arm-l-3" x="0" y="1.23" width="2.4" height="2.4" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="arm-r-3" x="20.18" y="1.23" width="2.4" height="2.4" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="arm-l-4" x="0" y="0.41" width="2.4" height="2.4" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="arm-r-4" x="20.18" y="0.41" width="2.4" height="2.4" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="arm-l-5" x="0" y="0" width="2.4" height="2.4" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="arm-r-5" x="20.18" y="0" width="2.4" height="2.4" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="grip" x="0" y="0" width="22.58" height="2.4" rx="0.4" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
</svg>
