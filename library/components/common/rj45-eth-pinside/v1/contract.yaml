format: 1
kind: component
name: rj45-eth-pinside
version: 1.0.0
class: port
profile: networking
description: An Ethernet RJ45 whose two link and activity lamps are in the side walls of
  the housing at its PIN end, beside the opening's corners and away from the latch keyway - common/rj45-eth@1 with its
  lamps at the other end. Three of HPE's two-port 10GBASE-T FlexibleLOM adapters carry it.
size: {w: 15.8, h: 13.2, d: 18.6}
size-confidence: {w: borrowed, h: borrowed, d: borrowed}
size-notes: std/rj45@2 - the housing this part composes; nothing about the size is this part's own.
attrs: {media: rj45}
provenance:
  finish: >-
    borrowed - common/rj45-eth@1, which measured it and made it settable: #b0b5bb, the
    bright shield, by default; a device whose jacks are black says so on the placement.
  size: via std/rj45@2 - the housing, TE 1734264 rev A2.
  depth: via std/rj45@2.
  lamps: >-
    photo-measured - WHICH END, WHERE AND HOW BIG, as fractions of the jack's own face
    on three HPE FlexibleLOM adapters photographed from the port end (562FLR-T,
    535FLR-T, 533FLR-T; the addresses are in hpe/flom-817745-b21@1,
    hpe/flom-817721-b21@1 and hpe/flom-700759-b21@1). Each jack has two windows, one
    in each SIDE WALL of the housing beside the corner of the opening at the end away
    from the latch notch - counted, two per jack, six jacks. On the 533FLR-T's
    photograph, the sharpest, a window is about 0.13 of the face wide and 0.20 tall,
    flush to the housing's side, its top 0.12 down from the pin edge; the other two
    read 0.11..0.15 wide, 0.19..0.26 tall, 0.10..0.17 down. Drawn 1.75 x 2.7 in the
    1.945 side wall, 1.6 from the pin edge. The cameras look from a little above, so
    the heights are a few percent short. A FIRST VERSION mirrored common/rj45-eth@1's
    window instead - 2.0 x 1.1 in the end wall, 1.2 inboard - and said the photographs
    could not measure one; they can, and the window is in the other wall and two and a
    half times as tall. No connector drawing is held for this jack: the family's
    drawings (TE 6368011, Amphenol RJHSE-508X) put their lamps on the latch side, so
    this is what three products show and not a rule for 10GBASE-T jacks. NAMED FOR THE
    PIN SIDE, not for top or bottom, because which way up the jack sits is the
    placement's to say.
  states: >-
    convention - what the two lamps ARE: led-a is the link lamp (`off`, `link`) and
    led-b the activity lamp (`off`, `activity`), with no colour. Ethernet jacks put link
    on one window and activity on the other; the datasheets that name them do not agree
    on colours and most do not name them. A device whose guide tables the lamps
    overrides with `states:` on the placement (dell/rj45-port-14g@1 is the pattern; the
    UfiSpace guides that split the two lamps by speed rather than by link/activity write
    their own per-element mapping). The vocabulary is common/rj45-eth@1's.
  which-is-which: convention - led-a is the left window and led-b the right when the
    part is unrotated (pins and lamps up, keyway down). rotate 180 swaps them on the face with the
    keyway, as on the metal.
fields:
  finish:
    label: Shell finish
    type: text
    default: '#b0b5bb'
elements:
  led-a:
    at: [0.1, 1.6]
    size: [1.75, 2.7]
    class: led
    states: ['off', link]
  led-b:
    at: [13.95, 1.6]
    size: [1.75, 2.7]
    class: led
    states: ['off', activity]
parts:
  - {ref: std/rj45@2, id: jack, at: [0.0, 0.0], behind: true}
relief:
  features:
    - node: led-a
      out: 0.3
      color: '#0d0f11'
      confidence: estimated
      source: >-
        common/rj45-port@4 - the lamp lens stand-off this library has carried on every
        RJ45 bezel, unsourced. TE 6368011 dimensions the LED window on the PCB, not its
        lens height.
    - node: led-b
      out: 0.3
      color: '#0d0f11'
      confidence: estimated
      source: >-
        common/rj45-port@4 - the same one estimate as led-a, written once here for both.
connection-points:
  net: {at: [7.9, 6.6], direction: front}
skins: [default]
