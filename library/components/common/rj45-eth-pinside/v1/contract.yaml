format: 1
kind: component
name: rj45-eth-pinside
version: 1.0.0
class: port
profile: networking
description: An Ethernet RJ45 whose two link and activity lamps are in the corners on
  the PIN side of the housing, opposite the latch keyway - common/rj45-eth@1 with its
  lamps at the other end. The jack HPE's 10GBASE-T FlexibleLOM adapters carry.
size: {w: 15.8, h: 13.2, d: 18.6}
size-confidence: {w: borrowed, h: borrowed, d: borrowed}
size-notes: std/rj45@2 - the housing this part composes; nothing about the size is this part's own.
attrs: {media: rj45}
provenance:
  finish: >-
    measured, and settable because the corpus disagrees with itself. The shield around
    the 8P8C opening is bright metal on some boxes and black plastic on others, and it
    is the one thing that differs between otherwise identical jacks. Sampling the shell
    strip above the cavity - so the black opening does not skew it - on the two devices
    whose front renders carry single jacks at 2 px/mm or better: the S9701-82DC's ToD,
    console and management jacks read 185, 183 and 121 against a cavity of 16, and the
    S8901-54XC's management and console jacks read 46 and 39. Both readings are
    confirmed by eye at 14x: the S9701's jacks are a silver shield around a black bore,
    the S8901's are black plastic in a white bezel plate. So #b0b5bb is the default,
    which is the library's own bright-shell grey and reads 181 against the 183-185
    measured; a device whose jacks are black says so with `attrs: {finish: '#2b2f33'}`
    on the placement, which is the value this part carried for everything until now. THE
    DEFAULT IS A CONVENTION, NOT A CENSUS: five jacks on two devices is what the renders
    support, three of them bright, and the previous single value was chosen with no
    provenance at all. It is recorded as a gap on neither part because the remedy is a
    per-device measurement rather than a document nobody holds.
  size: via std/rj45@2 - the housing, TE 1734264 rev A2.
  depth: via std/rj45@2.
  lamps: >-
    photo-measured for WHERE, borrowed for HOW BIG. Where: three HPE FlexibleLOM
    adapters photographed from the port end (562FLR-T, 535FLR-T, 533FLR-T; the
    addresses are in hpe/flom-817745-b21@1, hpe/flom-817721-b21@1 and
    hpe/flom-700759-b21@1) each show a lamp window in both corners of each jack at the
    end AWAY from the latch notch - counted, two per jack, six jacks. How big:
    common/rj45-eth@1's window, 2.0 x 1.1, 1.2 in from each side and 0.27 from the
    housing's edge, mirrored to the pin edge; the photographs do not resolve a window
    well enough to measure one. NAMED FOR THE PIN SIDE, not for top or bottom, because
    which way up the jack sits is the placement's to say.
  states: >-
    convention - what the two lamps ARE: led-a is the link lamp (`off`, `link`) and
    led-b the activity lamp (`off`, `activity`), with no colour. Ethernet jacks put link
    on one window and activity on the other; the datasheets that name them do not agree
    on colours and most do not name them. A device whose guide tables the lamps
    overrides with `states:` on the placement (dell/rj45-port-14g@1 is the pattern; the
    UfiSpace guides that split the two lamps by speed rather than by link/activity write
    their own per-element mapping). 1.0.0 gave both lamps the whole vocabulary, as the
    retired common/rj45-port@4 had; 1.1.0 splits it.
  which-is-which: convention - led-a is the left window and led-b the right when the
    part is unrotated (pins and lamps up, keyway down). rotate 180 swaps them on the face with the
    keyway, as on the metal.
fields:
  finish:
    label: Shell finish
    type: text
    default: '#b0b5bb'
elements:
  led-a:
    at: [1.2, 0.27]
    size: [2.0, 1.1]
    class: led
    states: ['off', link]
  led-b:
    at: [12.6, 0.27]
    size: [2.0, 1.1]
    class: led
    states: ['off', activity]
parts:
  - {ref: std/rj45@2, id: jack, at: [0.0, 0.0], behind: true}
relief:
  features:
    - node: led-a
      out: 0.3
      color: '#0d0f11'
      confidence: estimated
      source: >-
        common/rj45-port@4 - the lamp lens stand-off this library has carried on every
        RJ45 bezel, unsourced. TE 6368011 dimensions the LED window on the PCB, not its
        lens height.
    - node: led-b
      out: 0.3
      color: '#0d0f11'
      confidence: estimated
      source: >-
        common/rj45-port@4 - the same one estimate as led-a, written once here for both.
connection-points:
  net: {at: [7.9, 6.6], direction: front}
skins: [default]
