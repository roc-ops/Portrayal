format: 1
kind: component
name: rocker-switch
version: 1.1.0
class: button
profile: networking
description: >-
  Snap-in panel rocker power switch, 21 x 15 bezel, rocker across the width - the I (on)
  side at the left and O (off) at the right as drawn. The mains switch a chassis carries
  beside its appliance inlet where the supply is internal. A panel that shows the rocker the
  other way round places the part with rotate.
size: {w: 21.0, h: 15.0}
size-confidence: {w: drawing, h: drawing}
provenance:
  size: >-
    drawing - the switch node of the ReadyLinks GL-12xB vendor GLB (gl-12xb.glb, KAIGUAN_1)
    is 21.0 x 15.0 on the rear face, the common 21 x 15 snap-in rocker bezel.
  rocker: >-
    drawing - the rocker inside the bezel reads about 17.5 x 11.5 in an orthographic render
    of the same GLB at 12 px/mm; drawn at that. The I and O marks are the ReadyLinks
    datasheet photograph's (a bar at the left, a ring at the right).
  depth: >-
    drawing - the GLB switch reaches 4.9 mm behind the rear-panel plane, which is the
    rocker's raised end; the bezel lip is not separated in the mesh and its 1.5 is
    estimated.
  state: >-
    A FIELD, since 1.1.0 (docs/switch-positions-design.md): `off` or `on`. A rocker is
    set by pressing the side marked for the position, so ON presses the I half in and
    raises the O half, and OFF the reverse; each half is a node shown for the position
    that raises it, standing the GLB's 4.9 while the pressed half stands at the rocker's
    own height. That height is ESTIMATED at 3.0 - the GLB's surface across the rocker
    slopes by about 1.8 between its ends, but which way the mesh's own frame faces is
    not certain enough to say which half it holds raised. The skin draws OFF, the I half
    raised; nothing held says how a chassis ships, so OFF is a judgement.
fields:
  state: {label: State, type: choice, options: ['off', 'on'], default: 'off'}
elements:
  rocker: {at: [1.75, 1.75], size: [17.5, 11.5], class: button}
relief:
  features:
    - node: bezel
      out: 1.5
      color: '#1d2023'
      confidence: estimated
      source: >-
        common/rocker-switch@1 depth key - the bezel lip is not a separate mesh in the
        GLB; 1.5 is a typical snap-in bezel lip.
    - node: rocker
      out: 3.0
      color: '#26292d'
      confidence: estimated
      source: >-
        the pressed half of the rocker - see provenance.state; no source gives it
    - node: raised-i
      out: 4.9
      color: '#33373c'
      confidence: drawing
      source: >-
        common/rocker-switch@1 depth key - the GL-12xB GLB switch reaches 4.9 behind the
        rear panel plane, the rocker's raised end.
    - node: raised-o
      out: 4.9
      color: '#33373c'
      confidence: drawing
      source: >-
        see raised-i
skins: [default]
