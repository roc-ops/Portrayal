format: 1
kind: component
name: rocker-switch
version: 1.2.0
class: button
profile: networking
description: >-
  Snap-in panel rocker power switch, 21 x 15 bezel, rocker across the width - the I (on)
  side at the left and O (off) at the right as drawn. The mains switch a chassis carries
  beside its appliance inlet where the supply is internal. A panel that shows the rocker the
  other way round places the part with rotate.
size: {w: 21.0, h: 15.0}
size-confidence: {w: drawing, h: drawing}
provenance:
  size: >-
    drawing - the switch node of the ReadyLinks GL-12xB vendor GLB (gl-12xb.glb, KAIGUAN_1)
    is 21.0 x 15.0 on the rear face, the common 21 x 15 snap-in rocker bezel.
  rocker: >-
    drawing - the rocker inside the bezel reads about 17.5 x 11.5 in an orthographic render
    of the same GLB at 12 px/mm; drawn at that. The I and O marks are the ReadyLinks
    datasheet photograph's (a bar at the left, a ring at the right).
  depth: >-
    drawing - the GLB switch reaches 4.9 mm behind the rear-panel plane, which is the
    rocker's raised end; the bezel lip is not separated in the mesh and its 1.5 is
    estimated.
  state: >-
    A FIELD, since 1.1.0 (docs/switch-positions-design.md): `off` or `on`. A SEE-SAW
    rocker - one surface that tips about its centre, so the end it is set to presses
    into the bezel and the other end rises out of it. Each tipped surface is a node
    shown for its position, the I end raised for `off` and the O end raised for `on`.
    The raised end stands the GLB's 4.9; the low end 2.2, from the slope of the GLB
    switch's own surface, which falls about 1.8 over 12 across the rocker (2.7 over
    its 17.5). The skin draws OFF; nothing held says how a chassis ships, so OFF is a
    judgement.
  rocker-color: >-
    A FIELD, since 1.2.0: the colour of the rocker's moulding, for a switch that is not
    the drawn dark grey - the FS FANP3U3F's is red. Empty, the rocker is drawn as it
    always was. A value tints both tipped surfaces, over their shading, so the raised
    end still reads lighter; the I and O marks are drawn above it. The two surfaces'
    relief states no colour of its own, so their 3D sides take the painted art's and
    follow the field (lint L73).
fields:
  state: {label: State, type: choice, options: ['off', 'on'], default: 'off'}
  rocker-color: {label: Rocker colour, type: text, default: ''}
elements:
  rocker: {at: [1.75, 1.75], size: [17.5, 11.5], class: button}
relief:
  features:
    - node: bezel
      out: 1.5
      color: '#1d2023'
      confidence: estimated
      source: >-
        common/rocker-switch@1 depth key - the bezel lip is not a separate mesh in the
        GLB; 1.5 is a typical snap-in bezel lip.
    - node: rocker-off
      out: 4.9
      profile: [[0, 4.9], [17.5, 2.2]]
      confidence: drawing
      source: >-
        the GL-12xB GLB switch: its raised end 4.9 behind the rear panel plane, and its
        surface falling about 1.8 over 12 across the rocker - see provenance.state
    - node: rocker-on
      out: 4.9
      profile: [[0, 2.2], [17.5, 4.9]]
      confidence: drawing
      source: >-
        rocker-off, tipped the other way
skins: [default]
