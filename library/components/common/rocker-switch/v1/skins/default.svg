<svg xmlns="http://www.w3.org/2000/svg" width="21mm" height="15mm" viewBox="0 0 21 15">
  <!-- A rocker is pressed on the side it is set to: ON presses the I half in and raises the O half,
       OFF the reverse. Drawn OFF - the I half raised; `state` on shows the O half raised instead. -->
  <g id="bezel">
    <rect x="0.1" y="0.1" width="20.8" height="14.8" rx="0.8" fill="#1d2023" stroke="#55595e" stroke-width="0.2"/>
  </g>
  <g id="rocker">
    <rect x="1.75" y="1.75" width="17.5" height="11.5" rx="0.5" fill="#26292d" stroke="#44484d" stroke-width="0.2"/>
    <rect id="raised-i" x="1.75" y="1.75" width="8.75" height="11.5" rx="0.5" fill="#33373c"
          data-show-from="state" data-show="off"/>
    <rect id="raised-o" x="10.5" y="1.75" width="8.75" height="11.5" rx="0.5" fill="#33373c"
          data-show-from="state" data-show="on" display="none"/>
    <line x1="10.5" y1="2.2" x2="10.5" y2="12.8" stroke="#16181b" stroke-width="0.3"/>
    <g id="silkscreen">
      <line x1="4.4" y1="7.5" x2="7.2" y2="7.5" stroke="#e9ecef" stroke-width="0.6"/>
      <circle cx="15.2" cy="7.5" r="1.35" fill="none" stroke="#e9ecef" stroke-width="0.5"/>
    </g>
  </g>
</svg>
