format: 1
kind: module
name: pcie-card-lp
version: 1.2.0
class: expansion-card
behaviour: fills
profile: server
description: >-
  A generic low-profile PCI Express
  add-in card, half-length - the standard bracket at the chassis wall and a
  PCB slab running into the chassis behind it. What is fitted stands in for
  any card until the card itself is modelled.
size: {w: 79.2, h: 18.42, d: 167.65}
attrs:
  role: expansion-card
  power-absent: not-published
provenance:
  size: >-
    standard - the face is the pcie-bracket-lp bracket, 79.2 x 18.42, and the length is
    the PCI Express CEM 5.0 half-length card, 167.65 from the bracket.
  the-body-is-the-card: >-
    THE BRACKET IS THE FACE AND THE PCB IS THE BODY. A card is changed from
    the rear - its bracket is what you see, its slot is a bay on the rear
    face - and the rest of it lies inside the chassis on the riser's shelf.
    `body.boxes` is that PCB: a slab 1.6 thick lying in the plane of the
    slot, from inside the riser's connector to the card's top edge, the
    card's length deep. It ejects with its riser, as the hardware does.
  the-pcb-box: >-
    THE BOARD AND ITS EDGE ARE THE SPECIFICATION'S. PCIe CEM 5.0 figure 11-8
    dimensions the low-profile card from datum W, the edge tab's bottom:
    68.09 to the bracket's flange end, so W is at x' 79.20 - 68.09 = 11.11
    (the full-height figure's 104.86 gives 15.16 the same way, which the
    UfiSpace N3100-4C's datasheet corroborates at 15.20). The key centre is
    59.05 behind the bracket, as on the full-height card, and the edge is
    figure 6-5's x16 tab: 8.40 deep, pads 2.60..5.60 up it, key notch 1.90,
    12.15 / 72.15 either side. The board runs to 68.90 above W, the
    low-profile maximum height. It is 1.57 thick, its solder face 1.27
    inside the bracket's keyed edge, which puts it within a millimetre of the
    middle of Dell's low-profile riser connector. Length is the half-length
    card's 167.65.
    THE SILVER RECTANGLE IS A PLACEHOLDER, estimated.
  power: >-
    NOT PUBLISHED per card, and could not be: this is a placeholder for
    whatever card is fitted. A real card's draw belongs to the contract that
    models that card.
  lifecycle: >-
    not applicable - a placeholder.
body:
  depth: 167.65
  color: '#2f7a4e'
  # THE SLAB STOPS WHERE THE BRACKET STOPS BEING A RECTANGLE - between the
  # tip's chamfers and the flange's step, 11.85..68.03 - or its sides show as
  # fins round the tab and the flange in the component viewer.
  plate: {at: [11.85, 0.0], size: [56.18, 18.42]}
  # THE CARD FROM PCIe CEM 5.0, as common/pcie-card-fh@2 builds it: a green
  # board, the x16 edge tab either side of its key with gold pads 0.05 proud
  # on both faces, and a silver placeholder on the component side. x along
  # the bracket from its tip, y across it from the keyed edge, `from` back
  # from the bracket.
  boxes:
  - {id: board, at: [19.51, 1.27], size: [60.50, 1.57], from: 0.0, depth: 167.65,
     color: '#2f7a4e', confidence: registry,
     source: 'CEM 5.0 fig 11-8: tab edge 68.09 below the flange end, low-profile height 68.90; fig 6-5 shoulder 8.40 up the tab; 1.57 board 1.27 inside the bracket'}
  - {id: edge-tab-short, at: [11.11, 1.27], size: [8.40, 1.57], from: 46.90, depth: 11.20,
     color: '#2f7a4e', confidence: registry,
     source: 'CEM 5.0 fig 6-5 and 11-8: key centre 59.05 behind the bracket, 12.15 to the tab end, notch 1.90 wide'}
  - {id: edge-tab-long, at: [11.11, 1.27], size: [8.40, 1.57], from: 60.00, depth: 71.20,
     color: '#2f7a4e', confidence: registry,
     source: 'CEM 5.0 fig 6-5: x16 DIM B 72.15 from the key centre'}
  - {id: edge-pads-short, at: [13.71, 1.22], size: [3.00, 1.67], from: 47.25, depth: 10.60,
     color: '#d4a72c', confidence: registry,
     source: 'CEM 5.0 fig 6-5: pads 2.60..5.60 up the tab, pins 1-11 on 1.00 pitch, 1.50 from the key'}
  - {id: edge-pads-long, at: [13.71, 1.22], size: [3.00, 1.67], from: 60.25, depth: 70.60,
     color: '#d4a72c', confidence: registry,
     source: 'CEM 5.0 fig 6-5: pins 12-82, N = 70 spaces on 1.00 pitch'}
  - {id: shield, at: [25.00, 2.84], size: [45.00, 8.00], from: 20.0, depth: 120.0,
     color: '#b8bcc0', confidence: estimated,
     source: 'a placeholder for the card''s components, inside the CEM component-side volume'}
faces:
  plan:
    ref: common/pcie-card-plan-lp@1
parts:
  - {ref: std/pcie-bracket-lp@1, id: bracket, at: [0, 0], behind: true}
elements:
  pcb-edge: {at: [19.96, 9.8], size: [45.4, 1.2], class: bezel}
skins: [default]
