<svg xmlns="http://www.w3.org/2000/svg" width="6.6mm" height="8.0mm" viewBox="0 0 6.6 8.0">
  <!-- Panel-mount MDC adapter, 6.6 x 8.0, TWO fibres in one small body.

       ESTIMATED GEOMETRY. No face-on render of SKU 147015's panel exists
       here - only a three-quarter product shot - so this bezel is half of
       common/lc-duplex-adapter@3's measured body width, per US Conec/Senko's
       published density claim, and the two ports are drawn side by side as
       a plain guess since neither port's own internal arrangement is
       photographed. See the contract's `size` provenance for the full
       derivation. -->
  <defs>
    <linearGradient id="bez" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4248"/>
      <stop offset="1" stop-color="#23272c"/>
    </linearGradient>
  </defs>
  <rect id="bezel" x="0" y="0" width="6.6" height="8.0" rx="0.4"
        fill="url(#bez)" stroke="#15181a" stroke-width="0.2"/>
  <rect id="port-a" x="0.6" y="2.4" width="2.2" height="3.2" rx="0.25"
        fill="#1c1f22"/>
  <rect id="port-b" x="3.8" y="2.4" width="2.2" height="3.2" rx="0.25"
        fill="#1c1f22"/>
</svg>
