<svg xmlns="http://www.w3.org/2000/svg" width="40.4mm" height="5.2mm" viewBox="0 0 40.4 5.2">
  <!-- VHDCI receptacle, 40.4 x 5.2: flange, flattened shell, contact slot and a
       thumbscrew lock either side. Measured off the OSA 542x manual's BTOH-16
       card image (p16, Figure 8) at 12.8 px/mm. -->
  <rect id="flange" x="2.4" y="3.5" width="35.6" height="1.5" rx="0.3" fill="#b9bdc2" stroke="#8a8f95" stroke-width="0.15"/>
  <path id="shell" d="M 5.4 0.2 H 35.1 L 35.7 1.0 V 3.7 H 4.8 V 1.0 Z" fill="#c9cdd1" stroke="#7d8288" stroke-width="0.18"/>
  <rect id="opening" x="6.2" y="1.7" width="28.2" height="1.3" rx="0.2" fill="#111417"/>
  <g fill="#f4f5f6">
    <rect x="10.8" y="0.35" width="2.6" height="0.35"/>
    <rect x="19.0" y="0.35" width="2.6" height="0.35"/>
    <rect x="27.2" y="0.35" width="2.6" height="0.35"/>
  </g>
  <g fill="#bfc4c9" stroke="#6f747a" stroke-width="0.18">
    <circle id="screw-l" cx="1.6" cy="2.35" r="1.4"/>
    <circle id="screw-r" cx="38.8" cy="2.35" r="1.4"/>
  </g>
  <g stroke="#6f747a" stroke-width="0.2" fill="none">
    <path d="M 0.9 2.35 H 2.3"/>
    <path d="M 38.1 2.35 H 39.5"/>
  </g>
</svg>
