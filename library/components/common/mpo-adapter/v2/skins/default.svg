<svg xmlns="http://www.w3.org/2000/svg" width="13.8mm" height="9.4mm" viewBox="0 0 13.8 9.4">
  <!-- Panel-mount MPO/MTP adapter, 13.8 x 9.4.

       THE APERTURE IS NOT DRAWN HERE. std/mpo@2 (12.9 x 8.0) is composed by
       the contract at 0.45, 0.7; this skin is the bezel it sits in.

       13.8 IS A PITCH USED AS A WIDTH, not a measured adapter body: FS's 12x
       MTP panel (35510) is one continuous faceplate with apertures punched
       through it, so there is no adapter body to measure a width from at all
       - only the 13.8 spacing between openings, adopted here so a row of
       these tiles at the panel's real pitch. The 9.4 height is not measured
       either - see the contract's `size` provenance. -->
  <defs>
    <linearGradient id="bez" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4248"/>
      <stop offset="1" stop-color="#23272c"/>
    </linearGradient>
  </defs>
  <rect id="bezel" x="0" y="0" width="13.8" height="9.4" rx="0.5"
        fill="url(#bez)" stroke="#15181a" stroke-width="0.2"/>
  <!-- FIBRE POSITIONS 1-12, ZERO INK. The fibres are behind the dust sleeve
       std/mpo@2 draws; these rects give each position an address and a
       place on the ferrule row, 0.25 pitch, centred on the opening at
       6.9, 4.7 - fibre 1 on the RIGHT. See the contract. -->
  <rect id="1" x="8.2" y="4.625" width="0.15" height="0.15" fill="none"/>
  <rect id="2" x="7.95" y="4.625" width="0.15" height="0.15" fill="none"/>
  <rect id="3" x="7.7" y="4.625" width="0.15" height="0.15" fill="none"/>
  <rect id="4" x="7.45" y="4.625" width="0.15" height="0.15" fill="none"/>
  <rect id="5" x="7.2" y="4.625" width="0.15" height="0.15" fill="none"/>
  <rect id="6" x="6.95" y="4.625" width="0.15" height="0.15" fill="none"/>
  <rect id="7" x="6.7" y="4.625" width="0.15" height="0.15" fill="none"/>
  <rect id="8" x="6.45" y="4.625" width="0.15" height="0.15" fill="none"/>
  <rect id="9" x="6.2" y="4.625" width="0.15" height="0.15" fill="none"/>
  <rect id="10" x="5.95" y="4.625" width="0.15" height="0.15" fill="none"/>
  <rect id="11" x="5.7" y="4.625" width="0.15" height="0.15" fill="none"/>
  <rect id="12" x="5.45" y="4.625" width="0.15" height="0.15" fill="none"/>
</svg>
