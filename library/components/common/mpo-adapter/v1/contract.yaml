format: 1
kind: component
name: mpo-adapter
version: 1.0.0
class: port
profile: networking
description: >-
  Panel-mount MPO/MTP adapter - one opening in a bezel, as fitted to an FS FHD
  adapter panel. Twelve fibres by default; an MPO-8, -16 or -24 is the same
  adapter with a different ferrule, and says so by overriding
  `optical.positions` on its placement.
size: {w: 13.8, h: 9.4}
size-confidence: {w: photo-measured, h: estimated}
attrs: {media: fiber, connector: mpo}
optical:
  # TWELVE FIBRES IN ONE FERRULE, which is the whole point of the connector and
  # the reason a cassette needs only one of these on its rear. MPO-8, -16 and
  # -24 share this adapter and this opening - the count is a property of the
  # ferrule - so a module using another count overrides this on its placement
  # rather than composing a different part.
  positions: 12
provenance:
  size: >-
    MEASURED for the width, ESTIMATED for the height, and the width is a
    PITCH, NOT A BODY DIMENSION. 13.8 is the aperture pitch on FS's face-on
    render of SKU 35510 (two rows of six give 13.77 and 13.80, spreads 1.11
    and 0.60), adopted here as the component's width so a row of these tiles
    at the panel's real spacing. It is NOT a measured adapter body width: at
    6x magnification the join between two adapters on 35510 shows one
    continuous faceplate with bevelled apertures punched through it, no
    discrete adapter blocks and no gap between them, because there is nothing
    physical to have a gap between. A median-luminance profile across the top
    row confirms this - bare plate at the margin reads 39, the moulded face
    between two openings reads 60-75, and the five apparent "seams" (27.9,
    41.6, 55.8, 69.4, 83.1 mm, spacing 13.7/14.2/13.6/13.7) are each
    aperture's bevel shadow, not a butt joint - so no adapter body is visible
    here to measure at all.
    The 9.4 height is a share of the panel's measured 15.97 mm row pitch, not
    a body height either - the same continuous-plate reading applies
    vertically, so there is no body edge in this render to place a height
    against.
    A SECOND, INDEPENDENT READING EXISTS FOR A DIFFERENT PART: two vendor
    drawings for a generic MPO/MTP bulkhead adapter (US Conec C9857 rev AA and
    Amphenol 955 series, 22 years apart) agree on a 14.9 (or 14.8) x 9.8 body
    with depth 19.8 or 20.6 and a 25.0 x 20.0 / 3.1 dia mounting flange. That
    reading used to sit in standards.yaml's `mpo-adapter` entry, under the
    same key a `conforms:` on this contract would check `size` against. This
    contract declares no `conforms:`, though - it composes std/mpo@1 for the
    aperture and draws its own bezel around it, as common/lc-duplex-adapter@3
    does for std/lc-bore@3. That entry now holds the FS panel's APERTURE and
    PITCH instead (see its notes for the full history), so the vendor
    body/depth figures are recorded here rather than lost: they describe a
    flanged bulkhead adapter, a different physical part from FS's one-piece
    panel, kept because it is the only adapter-body figure held anywhere in
    this corpus - not because it measures the same thing as 13.8 x 9.4, and
    not in tension with it. The 19.8/20.6 body depth is NOT used for anything
    drawn here or on std/mpo@1 - see std/mpo@1's own `provenance.depth` for
    why.
  fibre-count: >-
    catalogue - FS's FHD panels are sold as `12 x MTP-8/12/24`, one opening
    taking any of the three ferrules. 12 is the default because it is the count
    the FHD cassettes' rear connectors use; see the FS catalogue at
    working/intake/fs/fhd/CATALOGUE.tsv.
  face-detail-gap: >-
    no orthographic photograph of an MPO adapter exists here; the reading is off
    a product RENDER. The latch, the key orientation and any keying mark are not
    modelled, and the key direction matters - FS sells `Up-Down Type A` and
    `Up-Up Type B` panels as different SKUs, which this part does not yet
    distinguish.
  connection-point: >-
    `optical.at` is the plain centre of the 13.8 x 9.4 mating face - (13.8/2,
    9.4/2) = (6.9, 4.7). That figure is corroborated, not just asserted: the
    composed std/mpo@1 bore sits at [3.0, 1.9] with its own size 7.8 x 5.6, so
    its centre is (3.0 + 7.8/2, 1.9 + 5.6/2) = (6.9, 4.7) too - the same point
    two different pieces of geometry land on. `size-confidence` marks w
    photo-measured and h estimated; a centre depending on both axes is only
    as good as the weaker one, so this point is ESTIMATED, not photo-measured,
    even though half of what it is built from is not.
parts:
  - {ref: std/mpo@1, id: bore, at: [3.0, 1.9]}
connection-points:
  # centre of the 13.8 x 9.4 mating face - (6.9, 4.7) - so the next plan has
  # somewhere to hang a fibre path off this adapter without a version bump.
  optical: {at: [6.9, 4.7], direction: front}
relief:
  wall: '#22262a'
  features:
    - node: bezel
      out: 1.2
      confidence: estimated
      source: >-
        the adapter's flange stands slightly proud of the panel, as the renders
        show. 1.2 is not measured; nothing in the corpus dimensions it.
skins: [default]
