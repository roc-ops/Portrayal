format: 1
kind: component
name: nic-symbol
version: 1.0.0
class: silkscreen
description: >-
  The network mark printed beside an Ethernet port - a node above three nodes on
  a bus, which is the figure vendors settled on for "this is a LAN connection"
size: {w: 5.4, h: 4.6}
provenance:
  form: >-
    read off the icon column of the R740 ISM table 10, where the NIC ports carry
    it, and of the R740xd table 9 which prints the same mark. A small square at
    the top, a stem down to a horizontal bus, and three squares hanging off it.
  size: >-
    photo-measured from ISM figure 9 at 7.2074 px/mm - the box only. What is
    inside is drawn to the recognisable form, because the figure resolves the
    mark as a smudge of ink a few pixels across.
  not-a-standard: >-
    no registry entry, nothing dimensions it, and nothing should depend on its
    geometry. `silkscreen` for that reason.
skins: [default]
