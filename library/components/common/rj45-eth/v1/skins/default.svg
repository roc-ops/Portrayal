<svg xmlns="http://www.w3.org/2000/svg" width="15.8mm" height="13.2mm" viewBox="0 0 15.8 13.2">
  <!-- THE OPENING IS A HOLE IN THIS FACE TOO. `behind: true` draws the composed
       housing under this skin, so a solid face here would cover its cavity and
       pins. The face is drawn evenodd with the three-tier opening removed, at the
       same path std/rj45@2 punches. What this skin adds is the two lamp windows. -->
  <path id="face" fill-rule="evenodd" fill="#2b2f33" d="
    M 0.4 0 h 15.0 a 0.4 0.4 0 0 1 0.4 0.4 v 12.4 a 0.4 0.4 0 0 1 -0.4 0.4 h -15.0 a 0.4 0.4 0 0 1 -0.4 -0.4 v -12.4 a 0.4 0.4 0 0 1 0.4 -0.4 z
    M 1.945 2.0 h 11.91 v 6.83 h -2.805 v 1.69 h -1.12 v 2.68 h -4.06 v -2.68 h -1.12 v -1.69 h -2.805 z"/>
  <rect id="led-a" x="1.2" y="11.83" width="2.0" height="1.1" rx="0.2" fill="var(--led-color, #3a3f44)"/>
  <rect id="led-b" x="12.6" y="11.83" width="2.0" height="1.1" rx="0.2" fill="var(--led-color, #3a3f44)"/>
</svg>
