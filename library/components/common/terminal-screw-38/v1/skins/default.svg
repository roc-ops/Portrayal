<svg xmlns="http://www.w3.org/2000/svg" width="3.8mm" height="3.8mm" viewBox="0 0 3.8 3.8">
  <!-- The slotted head of a barrier block's terminal screw, 3.8 across, as
       common/dc-terminal-27@1 drew it. The head's outline stroke runs 0.1 outside
       the box, as it did on the block. -->
  <circle id="head" cx="1.9" cy="1.9" r="1.9" fill="#c3c9cf" stroke="#5b6167" stroke-width="0.2"/>
  <path id="slot" d="M 0.35 1.9 H 3.45 M 1.9 0.35 V 3.45"
        fill="none" stroke="#5b6167" stroke-width="0.3" stroke-linecap="round"/>
</svg>
