<svg xmlns="http://www.w3.org/2000/svg" width="9.28mm" height="13.75mm" viewBox="0 0 9.28 13.75">
  <!-- Panel-mount LC duplex adapter, 9.28 x 13.75, as fitted to FS FHD
       cassettes - geometry off FS's face-on render of SKU 57016.

       THE BEZEL IS RAISED, and a raised part carries this art on its front
       face, so the two bore openings are HOLES in it - otherwise the solid
       face would cover the recesses behind it (the pattern
       common/lc-duplex-adapter@6 uses). Each hole is std/lc-bulkhead-bore@1's
       keyed outline TURNED 90, latch slot to the LEFT: square x 3.50-8.20,
       then the neck to x 2.75, the shoulder to x 1.56 and the tongue out to
       x 0.14 - 3.10, 4.29 and 5.71 from the ferrule line. Upper ferrule at
       (5.85, 3.75), lower at (5.85, 10.0), 6.25 apart. -->
  <path id="bezel" fill-rule="evenodd" fill="#2d91d8" stroke="#1b5884" stroke-width="0.15"
        data-fill-from="housing-finish" data-stroke-derive="housing-finish"
        d="M 0.4 0 H 8.88 Q 9.28 0 9.28 0.4 V 13.35 Q 9.28 13.75 8.88 13.75 H 0.4 Q 0 13.75 0 13.35 V 0.4 Q 0 0 0.4 0 Z
           M 0.14 2.43 H 1.56 V 1.40 H 2.75 V 2.02 H 3.50 V 1.40 H 8.20 V 6.10
             H 3.50 V 5.48 H 2.75 V 6.10 H 1.56 V 5.07 H 0.14 Z
           M 0.14 8.68 H 1.56 V 7.65 H 2.75 V 8.27 H 3.50 V 7.65 H 8.20 V 12.35
             H 3.50 V 11.73 H 2.75 V 12.35 H 1.56 V 11.32 H 0.14 Z"/>
  <!-- NO DUST CAP: the white duplex cap FS ships is an occupant of the
       bores, not part of the adapter (see the contract's provenance.dust-caps). -->
</svg>
