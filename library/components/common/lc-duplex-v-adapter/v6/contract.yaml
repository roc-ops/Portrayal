format: 1
kind: component
name: lc-duplex-v-adapter
version: 6.0.0
class: port
# THE ADAPTER IS ITSELF A SLOT (B3, docs/pluggables-caps-design.md, "The
# duplex host"): FS ships ONE white cap over both stacked ports, and a
# duplex connector mates the pair as one part, at their midpoint. That slot
# and the two bore slots below are mutually exclusive; the build and lint
# hold it.
interface: lc-duplex
# WHAT THAT SLOT SHIPS HOLDING (provenance.shipped-cap). A configuration keys
# the adapter (`bay-1/lc01`) to replace or empty it, and empties it before a
# simplex part takes one of the bores.
default: common/lc-duplex-dust-cap@2
profile: networking
description: >-
  LC duplex panel adapter with its two ports STACKED VERTICALLY - the shell FS
  fits to FHD cassettes and adapter panels. A blue body standing proud of the
  plate, each port turned with its latch slot to the LEFT. The white duplex
  dust cap FS ships over both ports is an occupant, not part of this adapter:
  common/lc-duplex-dust-cap@2, its `default:` (provenance.shipped-cap). Not the same part as common/lc-duplex-adapter@6,
  which is wider and puts its bores side by side.
size: {w: 9.28, h: 13.75}
conforms: fhd-lc-cassette
size-confidence: {w: photo-measured, h: photo-measured}
size-notes: >-
  WIDTH AND HEIGHT ARE BOTH MEASURED, each with a spread of 0.00 across all six
  adapters on FS's face-on render of SKU 57016 - scaled on the 108.97 mm FHD
  faceplate and validated against its 35.05 mm height to 1.02%. The width is
  9.28. The height comes from a luminance profile down the centre of each
  adapter, which separates it cleanly from the plate (bare plate 44-46, adapter
  100-247): top edge 10.66, bottom edge 24.41, height 13.75, identical to the
  pixel on all six.
  NO DEPTH IS RECORDED in `size`. A part with `size.d` and no behaviour is
  compiled as an aperture, a pit behind its whole box; how far this body stands
  OUT of the plate is carried by `relief` instead, where it belongs.
attrs: {media: fiber, connector: lc}
fields:
  housing-finish:
    label: Housing colour
    type: text
    default: '#2d91d8'
optical:
  positions: 2
relief:
  features:
    - node: bezel
      out: 1.2
      confidence: estimated
      source: >-
        FS's side photograph of SKU 57016 (57016.C.jpg), which shows the blue
        adapter bodies standing just proud of the faceplate. It is an oblique
        view, not an orthographic one, so the reading is scaled on the
        cassette's body depth along the same axis and is an estimate: about
        7 px. That scale was first taken on a 110.24 mm body (5.5 px/mm), a
        misreading of FS's 4.64in dimension line - see
        fs/fhd-1mtp6lcd-os2-a@4. On the true 117.86 mm the same span is 5.14
        px/mm and 7 px is 1.36 mm, against the 1.2 recorded. The difference
        is under one pixel (0.19 mm here), inside what a 7 px reading can
        resolve, so the estimate is left at 1.2 rather than redrawn.
parts:
  # THE BULKHEAD APERTURE, TURNED 90: std/lc-bulkhead-bore@1 draws its latch
  # tongue DOWN, and rotate 90 swings it to the LEFT, which is where FS's own
  # render puts every port's stepped latch slot (57016.main.jpg, beside the
  # cap). `at` is the UNROTATED box's corner and the turn is about its centre,
  # so the ferrules stay exactly where @4 and @5 put them - (5.85, 10.0) and (5.85,
  # 3.75) - and only the keyway grows, leftward. Lifted onto the raised bezel so
  # each bore recesses from the proud face, as common/lc-duplex-adapter@6 does.
  - {id: '1', ref: std/lc-bulkhead-bore@1, at: [1.82, 5.97], rotate: 90, lift: 1.2}
  - {id: '2', ref: std/lc-bulkhead-bore@1, at: [1.82, -0.28], rotate: 90, lift: 1.2}
connection-points:
  # WHERE A DUPLEX CONNECTOR SEATS: the midpoint of the two bores' own mate
  # points, which the stacked placements put at (5.85, 3.75) and (5.85, 10.0) -
  # the ferrule line `provenance.parts` reads off FS's own render, so the x is
  # 5.85 and not the 4.64 body centre `optical` uses. The quoted `'on'` is the
  # depth - YAML 1.1 reads a bare `on` as true - and each bore is lifted onto
  # the raised face by the 1.2 of `relief`, so a cap spanning both stands on
  # that face and not on the plate behind it.
  mate: {at: [5.85, 6.875], direction: front, 'on': bezel}
  optical:
    at: [4.64, 6.875]
    direction: front
provenance:
  position-order: >-
    POSITION 1 IS THE LOWER BORE, because FS prints the lower bore of each
    stacked adapter as the ODD port (1 below 2 at the left end of the panel,
    11 below 12 at the right) and a fibre position's number is the port
    number every consumer of the optical model shows. Positions follow the
    order the bores are composed, so bore `1` - composed first - sits below. Until
    v4 the upper bore was composed first: every Type A path was
    "straight through" by number while fibre 1 surfaced at the port FS prints
    as 2, a Type AF wiring on the hardware under a Type A label.
  size: >-
    see size-notes. Width AND height are both photo-measured, each with a spread
    of 0.00 across all six adapters on the same validated render.
  parts: >-
    THE TWO BORES ARE STACKED, ON THE LC DUPLEX PITCH, AND TURNED LATCH-LEFT.
    Stacked: a 6x crop of 57016.main.jpg shows one white dust cap over two
    ports one above the other, and the faceplate numbering agrees - 2 above 1
    at the left end, 12 above 11 at the right. Turned: the same crop shows each
    port's stepped latch slot to the LEFT of the cap, so the bore (tongue down
    unrotated) is placed at rotate 90, which makes each one 8.06 wide and 4.7
    tall - see `bores` for which bore. Pitch: the two ferrules sit 6.25 apart, the duplex pitch
    `lc-duplex-receptacle` records from IEC 61754-20 - a stacked duplex adapter
    is the same duplex pair stood on end - centred on the body at y 3.75 and
    10.0. Across: the ferrule is at x 5.85, the centre of the cap, which the
    render puts at 2.92-8.77 of the 9.28 body. v1 placed the bores tongue-down
    at 6.75 apart, which was the defect v2 fixed.
  bores: >-
    std/lc-bulkhead-bore@1 SINCE THIS MAJOR, and std/lc-bore@3 before it (@5, which
    renamed the bores `1` and `2` and drew nothing new, still composed it). @3 is
    the TRANSCEIVER receptacle, whose 1.60 keyway is cut short to fit a module
    face (its own `short-keyway` named this adapter's composer as drawing less
    keyway than its hardware has); the bulkhead aperture carries the 3.36 stack
    measured off SENKO DS-LC-000010, its keyway ending 5.71 from the ferrule
    axis. THE FERRULES DID NOT MOVE: both mate points are where @4 and @5 put them, so
    the spanning slot's midpoint, its derived axis (270) and every composer's
    fibre positions are unchanged. What moved is the keyway, which now runs out
    to x 0.14 rather than 1.90.
    IT FITS, AND BY LITTLE. At the ferrule line x 5.85 the 5.71 reach ends 0.14
    inside the 9.28 body's left edge, inside the bezel's 0.15 stroke by 0.065,
    and the tongue (2.64 wide, centred on each ferrule) is clear of the body's
    0.4 corner radii. FS's face-on render agrees in kind - the stepped slot runs
    to within a wall's thickness of the blue body's left edge - but at its 5.78
    px/mm it cannot say whether that wall is 0.14 or half a millimetre, so this
    fit is SENKO's keyway on FS's measured outline and ferrule line, not an FS
    reading. A MAJOR because the composed bore ref is addressing: what fills
    `lc01/1` is now a different part.
  dust-caps: >-
    NOT DRAWN SINCE THIS MAJOR. A dust cap is an occupant of the bore it plugs - taken out, swapped for a plug, or left empty - not part of the adapter, so it is no longer in this contract's art or relief; common/lc-duplex-dust-cap@2 is that part, and this adapter's top-level `default:` seats it (see `shipped-cap`). The reading is kept here for that part: photo-measured on 57016.main.jpg at the same 5.78 px/mm the
    plate gives (86-716 px across 108.97 mm): ONE white duplex cap, not two,
    spanning 2.92-8.77 across the body and 0.75-13.0 of its 13.75 - over both
    stacked ports - white #e7e9ec, with a rounded-square inset 3.6 x 4.4 in
    front of each port. Its front stood at `out: 5.5` on the bezel's 1.2,
    estimated off FS's oblique side photo 57016.C (about 30 px past the plate
    at 5.5 px/mm); the insets 0.6 deep, estimated.
  shipped-cap: >-
    ONE DUPLEX CAP ACROSS BOTH PORTS, declared as this adapter's own top-level
    `default:` (B3, docs/pluggables-caps-design.md, "The shipped default"), not
    a simplex cap per bore. FS's face-on render of SKU 57016 shows every one of
    the six adapters holding a single white moulding over its two stacked
    ports, with an inset in front of each - the reading `dust-caps` records.
    So the bores ship empty, and the adapter's slot ships capped:
    the reverse of the Smartoptics adapter, common/lc-duplex-adapter@6.
  colour: >-
    sampled off 57016.main.jpg: the adapter body's median blue is
    rgb(45,145,216), #2d91d8, and the cap rgb(231,231,233). The blue is FS's
    single-mode UPC colour - an APC adapter would be green, whatever its fibre
    - and the `housing-finish` default; a cassette of another fibre sets its
    own through the field, as `attrs:` on each composed adapter. THE COLOUR
    FOLLOWS THE MEDIUM, NOT A CONVENTION, AND EACH WAS COUNTED. One selection
    rule - saturation (max - min) over 60, value over 150, hue within 30
    degrees of the image's dominant one - is tuned until it reproduces this
    recorded blue off 57016.main (it gives #2f90d4, 7 levels out) and then
    applied unchanged to FS's face-on renders of every medium: OS2 #2f90d4
    57016.main, #2f8fd4 57023.B - one blue across layouts; OM4 #1dcbd3 57017.B
    and #18d1dc 182642.g1 (12-fibre plates) but #54ccde 57024.B and #53d0e5
    182644.g1 (24-fibre plates) - two aquas, each pair agreeing across separate
    uploads, so the split is in FS's renders, not in the sampling; OM3 #4dcfe3
    382889.g1, #4ecee4 382897.g1 - the 24-fibre OM4 aqua again, not a colour of
    its own; OM5 #a1af65 174246.g1, #a0ae61 174248.g1 - an olive lime, darker
    than the conventional OM5 lime would have drawn it. Each cassette carries
    the colour its OWN renders show. The outline follows the fill through
    `data-stroke-derive` (each channel x 61/100), so the drawn default's stroke
    is #1b5884, the shade of #2d91d8; until 4.1.0 it was a hand-picked #1d6aa6.
  face-detail-gap: >-
    No dimensioned drawing of this adapter has been obtained. The 9.28 x 13.75
    outline is measured, the cap is photo-measured, the stand-off heights come
    from an oblique photograph and are estimates.
  bore-ids: >-
    THE BORES ARE NUMBERED, NOT TX AND RX. A panel adapter has no direction
    until something is plugged into it; its bores are fibre positions 1 and 2,
    and a cassette path endpoint `lc01.1` is drawn at `lc01/1` (L112). Until
    v5 they were `tx` and `rx`, which read as a direction the part does not have.
skins: [default]
