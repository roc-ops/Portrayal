<svg xmlns="http://www.w3.org/2000/svg" width="9.28mm" height="13.75mm" viewBox="0 0 9.28 13.75">
  <!-- Panel-mount LC duplex adapter, 9.28 x 13.75, geometry read off FS's
       face-on render of SKU 57016 (an FHD LC duplex adapter panel face, the
       part FHD-1MTP6LCDOS2A's cassette front is built from).

       STACKED, NOT ABREAST. The two LC ports sit one over the other - a 6x
       crop of the join between two adapters on 57016.main.jpg shows one white
       dust cap over two ports, and the faceplate numbering agrees (evens
       along the top, odds along the bottom), the opposite of
       common/lc-duplex-adapter@3's side-by-side pair.

       The outline is measured (spread 0.00 across all six bodies on the
       render); where the two bores sit inside it is not - no dimensioned
       drawing of this adapter exists, so the two rects below mark the bore
       footprint at the positions the contract estimates, and the composed
       std/lc-bore@3 parts draw the actual keyed openings on top. -->
  <rect id="bezel" x="0" y="0" width="9.28" height="13.75" rx="0.4"
        fill="#2a2e33" stroke="#15181a" stroke-width="0.2"/>
  <rect id="port-tx" x="2.29" y="0.35" width="4.7" height="6.3" rx="0.2"
        fill="#1c1f22"/>
  <rect id="port-rx" x="2.29" y="7.10" width="4.7" height="6.3" rx="0.2"
        fill="#1c1f22"/>
</svg>
