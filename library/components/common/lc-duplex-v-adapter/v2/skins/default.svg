<svg xmlns="http://www.w3.org/2000/svg" width="9.28mm" height="13.75mm" viewBox="0 0 9.28 13.75">
  <!-- Panel-mount LC duplex adapter, 9.28 x 13.75, as fitted to FS FHD
       cassettes - geometry off FS's face-on render of SKU 57016.

       THE BEZEL IS RAISED, and a raised part carries this art on its front
       face, so the two bore openings are HOLES in it - otherwise the solid
       face would cover the recesses behind it (the pattern
       common/lc-duplex-adapter@3 uses). Each hole is std/lc-bore@3's keyed
       outline TURNED 90, latch slot to the LEFT: square x 3.50-8.20, then the
       neck, shoulder and tongue stepping out to x 1.90. Upper ferrule at
       (5.85, 3.75), lower at (5.85, 10.0), 6.25 apart. -->
  <path id="bezel" fill-rule="evenodd" fill="#2d91d8" stroke="#1d6aa6" stroke-width="0.15"
        d="M 0.4 0 H 8.88 Q 9.28 0 9.28 0.4 V 13.35 Q 9.28 13.75 8.88 13.75 H 0.4 Q 0 13.75 0 13.35 V 0.4 Q 0 0 0.4 0 Z
           M 1.90 2.43 H 2.59 V 1.40 H 3.08 V 2.02 H 3.50 V 1.40 H 8.20 V 6.10
             H 3.50 V 5.48 H 3.08 V 6.10 H 2.59 V 5.07 H 1.90 Z
           M 1.90 8.68 H 2.59 V 7.65 H 3.08 V 8.27 H 3.50 V 7.65 H 8.20 V 12.35
             H 3.50 V 11.73 H 3.08 V 12.35 H 2.59 V 11.32 H 1.90 Z"/>
  <!-- one white duplex dust cap plugging both ports, with a moulded
       rounded-square inset in front of each. ONE GROUP, because a node that
       stands `out` is moved to the end of the instance so it paints over the
       plate - and insets drawn as its siblings were left behind it, under the
       cap, and never showed in 2D. Inside the group they travel with it. -->
  <g id="cap">
    <rect x="2.92" y="0.75" width="5.85" height="12.25" rx="0.6"
          fill="#e7e9ec" stroke="#b6bcc2" stroke-width="0.12"/>
    <rect id="cap-inset-tx" x="4.05" y="1.55" width="3.6" height="4.4" rx="0.6" fill="#d5dade"/>
    <rect id="cap-inset-rx" x="4.05" y="7.80" width="3.6" height="4.4" rx="0.6" fill="#d5dade"/>
  </g>
</svg>
