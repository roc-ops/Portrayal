  <circle cx="5.3" cy="4.9" r="2.4" fill="#1b1e21"/><path d="M 4.1 4.9 H 6.5 M 5.3 3.7 V 6.1" stroke="#6b7076" stroke-width="0.5"/>
  <circle cx="26.0" cy="4.9" r="2.4" fill="#1b1e21"/><path d="M 24.8 4.9 H 27.2 M 26.0 3.7 V 6.1" stroke="#6b7076" stroke-width="0.5"/>
  <rect x="10.50" y="4.00" width="10.00" height="1.60" fill="#1f2a1f"/>
  <g id="plug">
    <rect x="10.10" y="5.30" width="10.60" height="11.00" rx="0.4" fill="#4aa541" stroke="#2f7a2a" stroke-width="0.3"/>
    <rect x="11.30" y="7.30" width="3.60" height="7.60" rx="0.3" fill="#1f3a1f"/>
    <rect x="15.90" y="7.30" width="3.60" height="7.60" rx="0.3" fill="#1f3a1f"/>
  </g>
  <circle cx="8.4" cy="11.9" r="1.4" fill="#d6a84a" stroke="#8a6a2a" stroke-width="0.2"/>
  <circle cx="23.3" cy="11.9" r="1.4" fill="#d6a84a" stroke="#8a6a2a" stroke-width="0.2"/>
</svg>
