format: 1
kind: component
name: ground-hole-pair-5-8-10-32
version: 1.0.0
class: ground
# THE PAIR IS ITSELF A SLOT (docs/connectors-dc-terminal-design.md section 13.7): one two-hole lug lands across both
# holes, at their midpoint. That slot and the two hole slots below are mutually exclusive (L115), as a duplex adapter's
# slot and its two bores are.
interface: stud-pair-5-8
behaviour: mounts
profile: networking
description: >-
  A pair of bare tapped 10-32 grounding holes on 5/8 in. (15.875) centres, the landing one two-hole lug takes: two dark openings in
  the panel and no screws. The screws that hold the lug are fitted with it. Generic: it stands for any chassis whose documents
  give that pitch and that thread and whose photographs show the holes bare, and it carries no vendor's facts.
size: {w: 20.701, h: 4.826}
size-confidence: {w: datasheet, h: registry}
size-notes: >-
  the two holes' own boxes, 15.875 apart centre to centre: the width is the pitch and one hole, the height one hole
attrs: {connector: stud-pair-5-8}
provenance:
  size: >-
    datasheet and registry - the 5/8 in. pitch is the interface's (spec/schemas/standards.yaml `two-hole-lug-5-8`, the lug that
    mates the pair, 15.875); each hole is common/ground-hole-10-32@1, whose own figure is the thread's nominal diameter.
  pitch: >-
    THE PITCH IS THE INTERFACE, NOT A READING OF ANY ONE DEVICE. A two-hole lug is one stamping with its holes 5/8 in.
    apart, so this part composes its holes at exactly 15.875 and lint L116 holds it there to 0.01. A device whose documents
    state another spacing does not place it.
  seat: >-
    THE PAIR PRESENTS AT THE FACE OF THE PANEL. `mate` is the midpoint of the two holes' own `mate` points and states no
    `seat-out`, as the holes state none (their seat is the face), so a lug across the pair lies exactly where a one-hole lug
    on either hole would. L116 holds the two to one figure.
  axis: >-
    THE HOLES ARE COMPOSED LEFT TO RIGHT, so the pair runs along +x, the canonical axis a two-hole lug is drawn on, and a lug
    seated here leaves its wire to the right (manifest.spanning_axis). A pair stood on end is this part placed at
    `rotate: 90`, which carries the first hole to the top and the wire downward.
elements: {}
parts:
  # FIRST HOLE, then second: the order is the axis (provenance.axis). Each is a slot of its own, `<placement>/1` and
  # `<placement>/2`, which the ring lug still seats in.
  - {ref: common/ground-hole-10-32@1, id: '1', at: [0, 0]}
  - {ref: common/ground-hole-10-32@1, id: '2', at: [15.875, 0]}
connection-points:
  # WHERE A TWO-HOLE LUG SEATS: the midpoint of the holes' own mate points, (2.413, 2.413) and (18.288, 2.413), at the face.
  mate: {at: [10.3505, 2.413], direction: front}
skins: [default]
