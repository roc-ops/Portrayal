    rather than approximating it
  size: estimated (bezel plate + standard cutout)
  cutout: standard (IEC 60603-7 via std/rj45)
elements: {}
parts:
  - {ref: std/rj45@1, id: jack, at: [0.5, 0.5]}
relief:
  features:
    - {node: bezel, out: 0.5, color: '#9aa1a8'}
connection-points:
  net: {at: [8.5, 7.5], direction: front}
skins: [default, dark]
