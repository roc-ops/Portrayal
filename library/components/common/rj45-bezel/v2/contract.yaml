format: 1
kind: component
name: rj45-bezel
version: 2.2.0
class: port
profile: networking
description: RJ45 panel port with jack-outline bezel, no LEDs (v2 = silver plate
  over the cutout leaving a plug-shaped aperture, stepped keyway down; console use)
size: {w: 17.0, h: 14.9}
attrs: {media: rj45}
