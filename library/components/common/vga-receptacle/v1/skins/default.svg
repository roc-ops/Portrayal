<svg xmlns="http://www.w3.org/2000/svg" width="30.8mm" height="12.5mm" viewBox="0 0 30.8 12.5">
  <!-- The shell and its two standoffs, and nothing else - the same part as
       common/db9-receptacle wearing a different insert, because HD-15 sits in
       the same size E shell as a DE-9. Any plate around one of these is the
       device's trim, not the connector's, and is drawn by the device. -->
  <g id="standoffs" fill="#9aa1a8" stroke="#6d7379" stroke-width="0.25">
    <polygon points="4.90,7.40 2.91,8.55 0.91,7.40 0.91,5.10 2.91,3.95 4.90,5.10"/>
    <polygon points="29.89,7.40 27.89,8.55 25.90,7.40 25.90,5.10 27.89,3.95 29.89,5.10"/>
  </g>
  <!-- 4-40 UNC takes a 2.26 tap drill, so 2.3 across is the bore a screwlock
       presents. -->
  <g fill="#4a4f55">
    <circle cx="2.905" cy="6.25" r="1.15"/>
    <circle cx="27.895" cy="6.25" r="1.15"/>
  </g>
</svg>
