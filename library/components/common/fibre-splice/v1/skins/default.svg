<svg xmlns="http://www.w3.org/2000/svg" width="60.0mm" height="20.0mm" viewBox="0 0 60.0 20.0">
  <!-- Fusion-splice tray holder, 60.0 x 20.0 - A PLACEHOLDER, NOT A DRAWING OF
       A REAL PART. No photograph of a splice cassette's interior exists in
       this corpus (see the contract's size-notes), so this is deliberately
       plain: a flat lid with a moulded rim, none of the routing channels,
       spool or hinge a real splice tray would carry. A face-on or interior
       photograph of any of the eleven splice SKUs in the catalogue settles
       what actually belongs here. -->
  <rect id="bezel" x="0" y="0" width="60.0" height="20.0" rx="1.0"
        fill="#2a2e33" stroke="#15181a" stroke-width="0.2"/>
  <rect id="lid-rim" x="2.0" y="2.0" width="56.0" height="16.0" rx="0.6"
        fill="none" stroke="#15181a" stroke-width="0.3"/>
</svg>
