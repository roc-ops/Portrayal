<svg xmlns="http://www.w3.org/2000/svg" width="18.35mm" height="10.0mm" viewBox="0 0 18.35 10.0">
  <!-- Face-on, the handle is seen end-on: every box of an arm shares the
       arm's 2.25 width and the handle top, and differs only in how far down
       it reaches. They are drawn farthest from the viewer first - the post at
       the nose, the two dogleg steps, the flat strap - and the grip plate
       last, so each paints over the one behind it and relief builds each as
       its own box (the contract's provenance.arms). -->
  <rect id="riser-l" x="0" y="0" width="2.25" height="10" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="riser-r" x="16.1" y="0" width="2.25" height="10" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="arm-l-2" x="0" y="0" width="2.25" height="8.3" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="arm-r-2" x="16.1" y="0" width="2.25" height="8.3" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="arm-l-3" x="0" y="0" width="2.25" height="4.9" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="arm-r-3" x="16.1" y="0" width="2.25" height="4.9" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="arm-l" x="0" y="0" width="2.25" height="3.2" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <rect id="arm-r" x="16.1" y="0" width="2.25" height="3.2" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
  <!-- The grip plate across the far end, the full 18.35 wide and 3.2 thick,
       its top level with the top of the nose. -->
  <rect id="grip" x="0" y="0" width="18.35" height="3.2" rx="0.3" fill="#6f6f6f"
        stroke="#444444" stroke-width="0.12" data-fill-from="latch-color"
        data-stroke-derive="latch-color"/>
</svg>
