description: Hot-swappable 1U fan module — 44.6mm square unioned with a 4mm left mounting tab (captive screw), honeycomb grille, pull bar in the lower third
size: {w: 48.6, h: 40.0}
attrs: {power-absent: not-applicable, airflow: front-to-back}
provenance:
  airflow-colour-convention: >-
    EDGECORE COLOUR-CODES AIRFLOW ON THIS PART, AND SAYS SO IN EIGHT DOCUMENTS.
    Every one carries the same Airflow Reversal instruction, word for word:
    "Remove front-to-back (F2B) airflow fan trays (red handles) and PSUs (red
    release latches). Install back-to-front (B2F) airflow fan trays (blue handles)
    and PSUs (blue release latches)."
    The seven staged are the AIS800-32D and AIS800-32O quick start guides, the
    AMX3200's, and the DCS201, DCS240, DCS510 and DCS511 guides; the eighth is the
    DCS204 (AS7726-32X) guide, which this library registers as a reference and
    quotes on that device already.
    SO THE DEFAULT ON THE FIELDS BELOW IS THE F2B COLOUR, not a neutral one, and a
    back-to-front build overrides it per configuration. That is why the red is a
    default rather than a fixed fill: one part, two colours, decided by which
    airflow variant is installed.
    IT IS A FACT ABOUT THIS PART AND NOT ABOUT ANY CHASSIS, which is why it is
    recorded here. Three chassis in this library offer B2F builds - AS5912-54X,
    AS7326-56X and AS7726-32X - and all three seat this same component.
    See roc-ops/Portrayal#277.
  states: >-
    NO LAMP, BECAUSE THIS IS A GENERIC. The part is a shape standing for many vendors' 1U fan
    modules, and where a real one puts its status LED differs by vendor - the nine UfiSpace
    fans in this library each draw their own status-led at their own measured position. A lamp
    on the generic would be a position invented for all of them. A device whose fan really has
    one places the vendor part.
  power: >-
    NOT APPLICABLE, because this contract is a GENERIC and not a part. It is a shape that
    stands in for every module of its kind, so there is no one figure to state: a 40GBASE-SR4
    is about 1.5 W and a 400G ZR about 20 W, and this single drawing is both of them. Any
    wattage written here would be a fiction dressed as a fact rather than a missing one. The
    figure belongs on the PLACEMENT, where a device that knows which module it ships can
    source it - the same division of labour L18 already draws for `media`, where a port
    inheriting a family from its cage must declare the real media on the placement. L27 has
    always exempted this contract in code; this records the reason in the data, so that a
    consumer totalling a chassis can tell a deliberate silence from an unanswered question.
    The chassis-level hole stays visible in L29, which is the right place for it.
