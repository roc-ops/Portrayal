format: 1
kind: component
name: g-type-female-port
version: 1.0.0
class: port
profile: networking
interface: g-type-female
description: >-
  A G-type female coaxial test connector on a panel, the -20 dB RF test point
  that CommScope's CH3000 DR3600N data sheet prints as "G-type female
  connector (front panel, -20 dB)". Seen from the face: a round collar with a
  socket in the middle. No data sheet held gives the connector's dimensions
  or a standard for it, so the size is an estimate.
size: {w: 7.0, h: 7.0}
size-confidence: {w: estimated, h: estimated}
attrs: {media: coax-g}
provenance:
  size: >-
    estimated - no document held dimensions a G-type connector. 7.0 is the
    same stand-in common/g-type-male-port@1 uses, a little under half of the
    15.6 across that the DR3600N face drawing gives the whole test-point
    body; it marks where a cable end lands and is not a reading of the
    connector.
  connector: >-
    datasheet - CommScope CH3000 DR3600N 204 MHz Quad Digital Return Receiver
    data sheet, Specifications, "RF Output Test Point": G-type female
    connector, front panel, -20 dB. The DR3450N data sheets held disagree
    with each other on the gender (one prints male, one female), so this part
    is not used for the DR3450N.
elements:
  opening: {at: [0.0, 0.0], size: [7.0, 7.0], class: mechanical}
connection-points:
  mate: {at: [3.5, 3.5], direction: front}
skins: [default]
