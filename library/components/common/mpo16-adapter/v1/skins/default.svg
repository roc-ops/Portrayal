<svg xmlns="http://www.w3.org/2000/svg" width="13.8mm" height="9.4mm" viewBox="0 0 13.8 9.4">
  <!-- Panel-mount MTP-16 adapter, 13.8 x 9.4 - the common/mpo-adapter@2 tile,
       whose outline and opening US Conec says the MTP-16 keeps. The aperture
       is std/mpo16@1, composed by the contract; this skin is the bezel. The
       offset key is not drawn (provenance.key). -->
  <defs>
    <linearGradient id="bez" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4248"/>
      <stop offset="1" stop-color="#23272c"/>
    </linearGradient>
  </defs>
  <rect id="bezel" x="0" y="0" width="13.8" height="9.4" rx="0.5"
        fill="url(#bez)" stroke="#15181a" stroke-width="0.2"/>
  <!-- FIBRE POSITIONS 1-16, ZERO INK, 0.25 pitch centred on 6.9, 4.7 -
       fibre 1 on the RIGHT. See the contract. -->
  <rect id="1" x="8.7" y="4.625" width="0.15" height="0.15" fill="none"/>
