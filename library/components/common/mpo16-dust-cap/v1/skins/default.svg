<svg xmlns="http://www.w3.org/2000/svg" width="12.8mm" height="8.1mm" viewBox="0 0 12.8 8.1">
  <!-- FS's grey MTP/MPO dust cap, front view: the body that fills the mouth,
       and across it the plate at the end of the saddle grip.

       DRAWN LANDSCAPE, WHICH IS std/mpo@2's ORIENTATION. The render it is
       measured off (SKU 35510) mounts its adapters portrait, so the long axis
       there runs down the plate; the figures are transposed into this frame
       once, in the contract's size-notes, and not again here.

       THE SADDLE IS DRAWN UNDER THE PLATE AND IS HIDDEN BY IT FACE-ON: it is
       the narrower web (8.0 against the plate's 10.2) the plate stands on,
       and only the 3D build shows it. Both are INSIDE THE BODY GROUP - a node
       standing `out` is moved to the end of the instance, so art drawn as the
       body's sibling would be painted over by the body it belongs to - and
       they are SIBLINGS of each other, the plate after the saddle, because
       lifts are summed down the tree and the plate's lift is already the
       saddle's top. -->
  <g id="body" class="cap">
    <rect x="0.0" y="0.0" width="12.8" height="8.1" rx="0.5" fill="#808692"
          stroke="#5f646e" stroke-width="0.12"/>
    <rect id="saddle" x="2.4" y="2.25" width="8.0" height="3.6" rx="0.3" fill="#9a9ea6"/>
    <rect id="grip" x="1.3" y="2.25" width="10.2" height="3.6" rx="0.4" fill="#b3b6bc"/>
  </g>
</svg>
