<svg xmlns="http://www.w3.org/2000/svg" width="8.8mm" height="11.45mm" viewBox="0 0 8.8 11.45">
  <!-- FS's black SC dust cap, front view: the lump that fills the opening,
       with the lighter raised grip across its middle.

       THE GRIP IS INSIDE THE BODY GROUP. A node standing `out` is moved to the
       end of the instance, so a grip drawn as the cap's sibling would be
       painted over by the cap it belongs to. Inside the group it travels with
       it, and its relief lift is summed onto the cap's own. -->
  <g id="body" class="cap">
    <rect x="0.0" y="0.0" width="8.8" height="11.45" rx="0.5" fill="#2b2c2e"
          stroke="#19191a" stroke-width="0.12"/>
    <rect id="grip" x="2.45" y="2.225" width="3.9" height="7.0" rx="0.45" fill="#46484b"/>
  </g>
</svg>
