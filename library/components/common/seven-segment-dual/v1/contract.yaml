format: 1
kind: component
name: seven-segment-dual
version: 1.1.1
class: display
profile: networking
description: Two-digit seven-segment status display behind one window - the code
  readout an Accton/Edgecore faceplate prints beside its system LEDs
size: {w: 17.4, h: 12.1}
provenance:
  size: >-
    photo-measured - COR580/AS9926-24D. The lit window reads x 138.1-195 px in
    cor580-datasheet/fig-0007.png panel 0 (3.198 px/mm on x, box [8,111,1410,251])
    for 17.8 mm, and y 148.1-186.25 px for 11.7 mm once mapped through the
    orthographic front elevation cor580-qsg/fig-0007.png (1.8329 px/mm on y). The
    quick-start's own line art gives 40.4-56.5 x 12.0-22.8 mm for the same window,
    which agrees to 1.4 mm on width. 17.4 x 12.1 is the pair, rounded to the
    datasheet's better x scale and the quick-start's better y.
  digits: >-
    drawing - two digits under one filter, the split between them read at 49.7 mm
    in the same figure, which puts it 0.6 mm right of the window's own centre.
    Drawn on the centre: at 3.2 px/mm that offset is two pixels.
  semantics: >-
    datasheet - 'Dual 7-Segment LED' is listed among the COR580's key components
    (cor580-datasheet/doc.md:83) and callout 2 of its interface drawing names it
    'Dual 7-segment LED'. WHAT THE DIGITS MEAN is stated nowhere in either
    document - not a POST code, not a stack ID, not a fabric slot number - so
    this part draws a two-digit readout and claims nothing about what it reads
    out.
elements:
  window:
    at: [0.4, 0.4]
    size: [16.6, 11.3]
    class: display
  digit-1:
    at: [2.3, 1.65]
    size: [5.0, 8.8]
    class: display
    description: >-
      the left digit. Its states are the characters a seven-segment cell can form, each naming the segments it lights - a top, b top-right, c bottom-right, d bottom, e bottom-left, f top-left, g middle. The drawing's own face is '0'.
    states: &digit-states
      - {name: '0', lights: [a, b, c, d, e, f]}
      - {name: '1', lights: [b, c]}
      - {name: '2', lights: [a, b, g, e, d]}
      - {name: '3', lights: [a, b, g, c, d]}
      - {name: '4', lights: [f, g, b, c]}
      - {name: '5', lights: [a, f, g, c, d]}
      - {name: '6', lights: [a, f, g, e, c, d]}
      - {name: '7', lights: [a, b, c]}
      - {name: '8', lights: [a, b, c, d, e, f, g]}
      - {name: '9', lights: [a, b, c, d, f, g]}
      - {name: 'a', lights: [a, b, c, e, f, g]}
      - {name: 'b', lights: [f, g, e, c, d]}
      - {name: 'c', lights: [a, f, e, d]}
      - {name: 'd', lights: [b, g, e, c, d]}
      - {name: 'e', lights: [a, f, g, e, d]}
      - {name: 'f', lights: [a, f, g, e]}
      - {name: 'blank', lights: []}
  digit-2:
    at: [10.1, 1.65]
    size: [5.0, 8.8]
    class: display
    description: >-
      the right digit. Its states are the characters a seven-segment cell can form, each naming the segments it lights - a top, b top-right, c bottom-right, d bottom, e bottom-left, f top-left, g middle. The drawing's own face is '0'.
    states: *digit-states
  point-1:
    at: [7.6, 9.75]
    size: [0.7, 0.7]
    class: display
    description: >-
      the left digit's decimal point, driven separately from the digit as it is on the part. Unlit in the drawing, which is why the face reads '00' and not the vendor artwork's '8.8.'
    states:
      - {name: 'on', lights: [dp]}
      - {name: 'off', lights: []}
  point-2:
    at: [15.4, 9.75]
    size: [0.7, 0.7]
    class: display
    description: >-
      the right digit's decimal point, driven separately from the digit as it is on the part. Unlit in the drawing, which is why the face reads '00' and not the vendor artwork's '8.8.'
    states:
      - {name: 'on', lights: [dp]}
      - {name: 'off', lights: []}
skins: [default]
