format: 1
kind: component
name: keystone-clip
version: 1.0.0
class: mechanical
profile: networking
description: >-
  A generic snap-in keystone clip opening, as fitted to an FS FHD keystone
  panel. This is a MOUNTING OPENING, not a fibre connector - whatever jack
  snaps into it (RJ45, fibre, blank) carries its own optical or electrical
  properties, which is why this contract declares no `optical` block at all.
size: {w: 14.8, h: 19.3}
size-confidence: {w: estimated, h: estimated}
attrs: {opening: keystone}
provenance:
  size: >-
    ESTIMATED - NOT A MEASUREMENT, AND NOT EVEN A FIBRE INTERFACE. A keystone
    clip is a generic mechanical mounting form with no owning IEC or TIA fibre
    standard. SKU 143239's three-quarter shot DOES show an actual panel, not
    just a loose part - the one render among these five that does - but
    panel_measure still refuses it outright, its scaled plate height missing
    the known 35.05 mm by 83.9%, so it cannot be used to measure the cutout.
    14.8 x 19.3 is the de-facto snap-in keystone jack cutout published across
    keystone-panel vendors' generic cut sheets (RJ45, fibre and blank keystone
    inserts all share this one opening), adopted here for lack of anything
    FS-specific.
    THE PITCH IS THE ONE DERIVED FIGURE: FS's catalogue line for 143239 lists
    6 clips, but the render shows two rows of 3, not one row of 6 - a
    3-across row spans 2 gaps. Using a ~67 mm envelope bracketed by two
    face-on sibling panels (35510 and 57058), 67 / (3 - 1) = 33.5. See
    standards.yaml's `keystone-opening` entry for the full arithmetic and its
    `pitch-kind: floor` reasoning.
    What would settle either figure: a face-on (not three-quarter) photograph
    of SKU 143239's actual panel, a caliper, or a manufacturer cut sheet for
    this specific panel.
  face-detail-gap: >-
    no face-on imagery exists for this part - SKU 143239's render shows the
    panel and its six clips, but only from a three-quarter angle, which is
    why panel_measure refuses it rather than yields a usable measurement (see
    the size provenance above). The clip's own retention tabs and release
    latch are not modelled; this is a plain rectangular opening only.
  connection-point: >-
    `mate.at` is the plain centre of the 14.8 x 19.3 opening - (14.8/2,
    19.3/2) = (7.4, 9.65). Keyed `mate`, not `optical`, on purpose: this
    contract's own description says it is a mounting opening rather than a
    fibre connector and declares no `optical` block, and whatever snaps into
    it (RJ45, fibre, blank) carries its own connection point of the kind
    that fits it - a keystone clip's own connection point is a place for
    something ELSE to seat, not a fibre path in its own right. Both axes of
    `size-confidence` are estimated, so this centre is ESTIMATED too.
connection-points:
  mate: {at: [7.4, 9.65], direction: front}
skins: [default]
