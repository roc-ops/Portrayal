format: 1
kind: component
name: keystone-clip
version: 1.0.0
class: mechanical
profile: networking
description: >-
  A generic snap-in keystone clip opening, as fitted to an FS FHD keystone
  panel. This is a MOUNTING OPENING, not a fibre connector - whatever jack
  snaps into it (RJ45, fibre, blank) carries its own optical or electrical
  properties, which is why this contract declares no `optical` block at all.
size: {w: 14.8, h: 19.3}
size-confidence: {w: estimated, h: estimated}
attrs: {opening: keystone}
provenance:
  size: >-
    ESTIMATED - NOT A MEASUREMENT, AND NOT EVEN A FIBRE INTERFACE. A keystone
    clip is a generic mechanical mounting form with no owning IEC or TIA fibre
    standard. No face-on render of an FS keystone panel exists in this corpus;
    SKU 143239's THREE-QUARTER product shot shows only the moulded clip body,
    not a panel with a cutout to measure at all. 14.8 x 19.3 is the de-facto
    snap-in keystone jack cutout published across keystone-panel vendors'
    generic cut sheets (RJ45, fibre and blank keystone inserts all share this
    one opening), adopted here for lack of anything FS-specific.
    THE PITCH IS THE ONE DERIVED FIGURE: FS sells this panel with 6 clips, and
    the 12x MTP panel (35510, face-on) puts its outermost adapter centres
    88.8 mm apart, so six across that envelope, on a 6-across 5-gap layout,
    gives 88.8 / 5 = 17.76. See standards.yaml's `keystone-opening` entry for
    the full arithmetic and its `pitch-kind: floor` reasoning.
    What would settle either figure: a face-on photograph of SKU 143239's
    actual panel (not just the clip), a caliper, or a manufacturer cut sheet
    for this specific panel.
  face-detail-gap: >-
    no face-on imagery exists for this part at all - only a three-quarter
    product render of the clip itself (SKU 143239), with no panel in frame.
    The clip's own retention tabs and release latch are not modelled; this is
    a plain rectangular opening only.
skins: [default]
