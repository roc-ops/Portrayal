<svg xmlns="http://www.w3.org/2000/svg" width="14.8mm" height="19.3mm" viewBox="0 0 14.8 19.3">
  <!-- Generic snap-in keystone clip opening, 14.8 x 19.3.

       ESTIMATED GEOMETRY, AND NOT EVEN FS-SPECIFIC. No face-on render of SKU
       143239's panel exists here - only a three-quarter shot of the clip
       itself, with no panel in frame - so this is the de-facto generic
       keystone cutout published across keystone-panel vendors' cut sheets,
       not a measurement of this SKU. See the contract's `size` provenance
       for the full derivation. A MOUNTING OPENING, NOT A CONNECTOR - no
       fibre position is drawn here because none is declared. -->
  <rect id="bezel" x="0" y="0" width="14.8" height="19.3" rx="0.8"
        fill="#2a2e33" stroke="#15181a" stroke-width="0.2"/>
  <rect id="opening" x="1.2" y="2.0" width="12.4" height="15.3" rx="0.5"
        fill="#1c1f22"/>
</svg>
