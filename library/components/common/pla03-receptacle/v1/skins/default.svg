<svg xmlns="http://www.w3.org/2000/svg" width="10.36mm" height="28.6mm" viewBox="0 0 10.36 28.6">
  <!-- A male Positronic PCS PLA03 connector seen from its mating face, upright: a mounting ear at each end with its
       hole (22.40 apart), the insulator between them, and three pins in its window on a 5.00 pitch. The square
       hole under the top ear is the lock hole the cable connector's tab latches into. -->
  <g id="ears" fill="#2366ae" stroke="#17457a" stroke-width="0.25">
    <rect id="ear-top" x="0.15" y="0.15" width="10.06" height="4.6" rx="0.5"/>
    <rect id="ear-bottom" x="0.15" y="23.85" width="10.06" height="4.6" rx="0.5"/>
  </g>
  <circle id="ear-hole-top" cx="5.18" cy="3.10" r="1.0" fill="#0d0f11"/>
  <circle id="ear-hole-bottom" cx="5.18" cy="25.50" r="1.0" fill="#0d0f11"/>
  <rect id="insulator" x="0.4" y="4.6" width="9.56" height="19.4" rx="0.4" fill="#2366ae" stroke="#17457a" stroke-width="0.3"/>
  <rect id="lock-hole" x="4.38" y="4.9" width="1.6" height="0.9" fill="#0d1a2c"/>
  <rect id="window" x="1.4" y="6.0" width="7.56" height="16.6" rx="0.6" fill="#0f2238" stroke="#17457a" stroke-width="0.25"/>
  <g id="pins" fill="#c9a227" stroke="#7d6413" stroke-width="0.15">
    <circle id="pin-1" cx="5.18" cy="9.30" r="0.794"/>
    <circle id="pin-2" cx="5.18" cy="14.30" r="0.794"/>
    <circle id="pin-3" cx="5.18" cy="19.30" r="0.794"/>
  </g>
</svg>
