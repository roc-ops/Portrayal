<svg xmlns="http://www.w3.org/2000/svg" width="3.8mm" height="133.4mm" viewBox="0 0 3.8 133.4">
  <!-- A DIMM edge-on from above. The outline is measured; the strip is not. -->
  <g id="body">
    <rect x="0" y="0" width="3.8" height="133.4" rx="0.4" fill="#14171a" stroke="#0b0d0f" stroke-width="0.3"/>
    <rect x="0.9" y="2.0" width="2.0" height="129.4" rx="0.3" fill="#3d4349"/>
  </g>
  <!-- the sticker, printed along the edge: capacity then speed, both fields -->
  <g id="silkscreen">
  <text data-from="capacity" transform="translate(2.75,128.0) rotate(-90)" font-family="sans-serif" font-size="2.2" font-weight="bold" fill="#c8ced3">32GB</text>
  <text data-from="speed" transform="translate(2.75,100.0) rotate(-90)" font-family="sans-serif" font-size="1.8" fill="#9aa1a8">2933</text>
  </g>
</svg>
