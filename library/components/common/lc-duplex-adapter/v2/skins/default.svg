<svg xmlns="http://www.w3.org/2000/svg" width="13.2mm" height="11mm" viewBox="0 0 13.2 11">
  <!-- The bezel is raised 6.35mm, and a raised part is built as a box carrying
       this art on its front. So the bore openings have to be holes in the art:
       without them the box face is solid and covers the two recesses behind it,
       which is what made these read as flat grey blocks. evenodd subpaths match
       the lc-bore footprints exactly. -->
  <path id="bezel" fill-rule="evenodd" fill="#2b3035" stroke="#585f66" stroke-width="0.2"
        d="M 0.1 0.1 h 13 v 10.8 h -13 z
           M 1.0 3.3 h 4.6 v 4.4 h -4.6 z
           M 7.6 3.3 h 4.6 v 4.4 h -4.6 z"/>
</svg>
