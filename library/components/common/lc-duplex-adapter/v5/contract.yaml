format: 1
kind: component
name: lc-duplex-adapter
version: 5.0.0
class: port
# THE ADAPTER IS ITSELF A SLOT (B3, docs/pluggables-caps-design.md, "The
# duplex host"): a duplex connector - a duplex dust cap, a duplex plug -
# mates the pair of bores as one part, at their midpoint. That slot and the
# two bore slots below are mutually exclusive; the build and lint hold it.
interface: lc-duplex
profile: networking
description: >-
  Panel-mount LC duplex adapter - a bezel carrying two LC bores side by side,
  as used for Tx/Rx pairs on optical line cards. The body stands proud of the
  faceplate; the bores recess from that raised face, not from the panel. The
  dust caps an unused port ships with are occupants of the bores, not part of
  this adapter - see provenance.dust-caps. Distinct from sfp-lc-duplex, which is a pluggable transceiver.
size: {w: 13.2, h: 11.0}
size-confidence: {w: measured, h: measured}
attrs: {media: fiber, connector: lc-duplex}
provenance:
  size: measured - Smartoptics DCP-R stencil, from the pitch of abutting
    adapters on the DCP-R-34D-CS faceplate (13.24mm) and the row pitch (11.5mm)
  bore-spacing: >-
    THE STANDARD, NOT THE STENCIL. 6.25 between bore centres, from
    standards.yaml's `lc-duplex-receptacle` entry, which carries it at
    `pitch-confidence: verified` sourced to IEC 61754-20 / TIA-604-10 FOCIS 10.
    THIS WAS 6.6 AND THE TWO DISAGREED IN SILENCE. 6.6 was measured off the
    Smartoptics DCP-R stencil - 'the pitch of abutting adapters on the
    DCP-R-34D-CS faceplate', held across 35 adapters - and it is a good reading
    of a drawing that is itself a simplification. A figure marked `verified`
    against a published interface standard outranks one marked `measured` off
    one vendor's Visio artwork, and nothing in the library compared them until
    L81 was written.
    THE 13.2 WIDTH IS UNCHANGED and is a different quantity: the pitch of
    ABUTTING ADAPTERS on a faceplate, not of bores within one. FS's own artwork
    measures that at 12.90 on the FHD cassette face, which is a third reading of
    a third thing and is recorded on the FS parts rather than here.
    THE PAIR MUST STAY CENTRED IN THE 13.2-WIDE BODY: centres at
    13.2/2 +/- 6.25/2 = 3.475 and 9.725, review of the task that landed the
    pitch fix caught that the first pass had done 13.2/2 - 6.25/2 wrong as
    3.175 rather than 3.475, putting the pair 0.300 left of centre (0.825/1.425
    margins instead of a symmetric 1.125 each side) even though the 6.25 PITCH
    between them was already correct. That was an arithmetic error in the plan
    handed to the task, not in how the bore part itself was placed relative to
    its partner - the fix moves both bores +0.300 to 1.125 and 7.375, and
    standards.yaml's own note corroborates the result: 'a duplex pair spans
    pitch plus the body width (10.95)', which leaves 1.125 each side of 13.2.
  bores: >-
    std/lc-bulkhead-bore@1 SINCE THIS MAJOR - the BULKHEAD aperture, whose keyway ends
    5.71 from the ferrule axis (measured off SENKO's LC Premium Adapter,
    DS-LC-000010; that part's `keyway` note). @4 composed std/lc-bore@3, the
    TRANSCEIVER receptacle, whose 1.60 keyway is cut short to fit a module face, so
    a seated plug's compressed latch ran 1.76 past the keyway this part drew and
    0.21 past its outline. Before that the bore was @1 (4.6 x 4.4, proportional,
    unsourced), @2 (the 4.7 square) and @3 (#126).
    THE FERRULE AXIS MOVED FOR IT IN THIS PART'S OWN FRAME, 0.32 AWAY FROM THE
    LATCH SIDE: from y 5.5 to 5.82, so the bores' mates are now (3.475, 5.82) and
    (9.725, 5.82), and so is the duplex seat - see `axis`. On a face, what moved
    depends on what the composer's source measured (`axis`, WHAT MOVED). The HORIZONTAL
    centres are unchanged: 3.475 and 9.725, the verified 6.25 pitch centred in the
    13.2 body (see `bore-spacing`). Each placement carries rotate: 180 so the latch
    tongue points up, as a panel-mount adapter is fitted; `at` is the unrotated
    box's corner and the turn is about its centre, so a bore at [1.125, 0.11] has
    its mate at (1.125 + 2.35, 0.11 + 5.71) and its keyway end at y 0.11.
  axis: >-
    ESTIMATED - 5.82 FROM THE LATCH-SIDE EDGE: the stencil's direct ferrule
    reading, 5.79, plus the smallest move that clears the outline's stroke.
    THE READING. The DCP-R stencil master R-34D-CS is raster art at 8.86 px/mm
    (its two rows of ferrules stand 102.0 px apart against the 11.5 row pitch).
    It draws each adapter about 10.0 tall - not this part's 11.0, which is the
    row pitch less a gap - with the ferrule 5.79 from the latch-side edge and
    4.26 from the other, so the axis is placed 5.79 from this part's latch-side
    edge and the extra height of the model falls on the far side. The reading
    is of a DRAWING, not of the hardware, and it is soft: re-read across the
    stencil's 34 cross-connect adapters it spans 5.75 to 6.03, by adapter and by
    which pixel is taken as the housing's edge (the art's pixel is 0.11), and
    5.79 lies inside that spread. A second figure
    could be read, 6.33, by standing the SENKO keyway on the end of the art's own
    keyway, which stops 0.62 inside its housing; it is not used, because the
    art's bore is the drafter's - its keyway reaches 5.11 from its ferrule, not
    SENKO's 5.71 - so that is a reading of the drawing's keyway, not of where the
    ferrule sits.
    THE MOVE. At 5.79 the keyway ends at y 0.08. The bezel outline is drawn on
    the body's own box with a 0.2 stroke, so the stroke covers y 0 to 0.10 inside
    the part, and at 5.79 the keyway would cut into it by 0.02. The axis is
    therefore 0.03 further from the latch edge than the reading: at 5.82 the
    keyway ends at y 0.11, 0.01 clear of the stroke. The 0.03 is a drawing
    constraint, not a measurement, and a source that fixes the axis replaces
    both figures.
    THE OUTLINE WAS MOVED FIRST, and that too is a DRAWING change, not a
    reading: @4 drew the bezel outline inset 0.1 all round, a seam between
    abutting adapters with no source, whose stroke reached y 0.2 - and at the
    reading's 5.79 the keyway would have cut it by 0.12. The outline is now the
    13.2 x 11.0 box itself, as common/lc-duplex-shuttered-adapter@2 draws its
    own for the same reason; two abutting outlines share one stroke as the
    seam.
    WHAT MOVED: WHATEVER THE COMPOSER'S SOURCE DID NOT MEASURE. Each composer keeps
    the figure its own source gave and lets the other move.
    WHERE THE SOURCE IS THE FIBRE - dcp-r-34d-cs, dcp-r-9d-cs and dcp-m32-cso-zr,
    placed off stencil connection points or the photograph's channel positions, and
    the DCP-F-A22 carrier - the reading above re-derives the body AROUND the
    fibre. Those placements moved 0.32 toward the part's own latch side (turned by
    the placement's `rotate`: up on an unturned row, down on a row at rotate 180),
    with the panel cutout of the same id where there is one, and every optical
    point, bore mate, duplex seat and seated cap or plug stands exactly where @4
    put it.
    WHERE THE SOURCE IS THE BODY - the eight PPM modules, whose position is the
    adapter block measured on five renders - the placements stay, and the
    ferrules move 0.32 inside the body, away from the latch, as the part does on
    its own.
  stand-off: photo - the adapter body sits about an eighth of an inch proud of
    the faceplate, not the quarter inch first modelled
  dust-caps: >-
    NOT DRAWN SINCE THIS MAJOR. A dust cap is an occupant of the bore it plugs - taken out, swapped for a plug, or left empty - not part of the adapter, so it is no longer in this contract's art or relief; the pluggables connectors work seats it (a `common/` cap part, and a default occupant per port). The reading is kept here for that part: photo - unused ports carry a white cap standing about a
    quarter inch proud of the jack face, with a rounded-square inset moulded
    into its front. As @3 drew them: one simplex cap per bore, 4.7 x 4.7 over
    each bore square (x 1.125 and 7.375, y 3.15), white #e9ecef, front at
    `out: 9.525` on the bezel's 3.175 (3.175 + the photographed quarter inch),
    and a 2.7 x 2.7 inset 0.9 deep (estimated). The spigot that seats it into
    the bore is not modelled - it sits inside the recess and is never visible
relief:
  features:
    - node: bezel
      out: 3.175
      confidence: photo-measured
      source: >-
        this part's own stand-off key - 'photo - the adapter body sits
        about an eighth of an inch proud of the faceplate, not the quarter inch first
        modelled'. 3.175 is that eighth of an inch. A photograph read to the nearest eighth,
        and it CORRECTED an earlier quarter-inch guess, which is why it is photo-measured
        rather than estimated.
optical:
  # TWO BORES, SO TWO FIBRE POSITIONS, and position order is the order the bores
  # are composed below: 1 is `tx`, 2 is `rx`. Stated here so no module composing
  # this adapter has to restate it - on the FS FHD line that would be 77 chances
  # to mistype a number the adapter already knows.
  positions: 2
parts:
  # THE BULKHEAD APERTURE, lifted onto the raised bezel, so each bore recesses
  # from the proud face. rotate 180 puts the latch tongue UP, which is how a
  # panel-mount adapter is fitted and how the issue's own photograph shows it;
  # the bore is drawn tongue down. `at` is the unrotated box's corner and the
  # turn is about its centre: each mate lands at y 0.11 + 5.71 = 5.82 (see
  # provenance.axis), each keyway ends at y 0.11.
  - {ref: std/lc-bulkhead-bore@1, id: tx, at: [1.125, 0.11], lift: 3.175, rotate: 180}
  - {ref: std/lc-bulkhead-bore@1, id: rx, at: [7.375, 0.11], lift: 3.175, rotate: 180}
connection-points:
  # WHERE A DUPLEX CONNECTOR SEATS: the midpoint of the two bores' own mate
  # points, which the pair's placements put at (3.475, 5.82) and (9.725, 5.82) -
  # the same point `optical` already names, and for the same reason. The
  # quoted `'on'` is the depth - YAML 1.1 reads a bare `on` as true - and it
  # says the bores recess from the raised face, each lifted onto it by the
  # 3.175 of `relief`, so a part seated across both stands on that face too
  # and not at the panel behind it.
  mate: {at: [6.6, 5.82], direction: front, 'on': bezel}
  # the midpoint of the two ferrule centres (3.475 and 9.725, both at y 5.82
  # since this major - provenance.axis) - which is,
  # correctly, the 13.2-wide body's own centre (6.6). It was 6.6 originally
  # (from the uncorrected 6.6 stencil pitch, itself centred), moved to 6.3 when
  # the pitch was corrected to the verified standard but the pair was
  # mis-centred by a plan arithmetic error, and is now back to 6.6 - genuinely
  # the body centre this time, because the bores are.
  optical: {at: [6.6, 5.82], direction: front}
skins: [default]
