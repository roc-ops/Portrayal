<svg xmlns="http://www.w3.org/2000/svg" width="13.2mm" height="11mm" viewBox="0 0 13.2 11">
  <!-- The bezel is raised, and a raised part carries this art on its front face,
       so the bore openings are holes in it - otherwise the box face is solid and
       covers the recesses behind it. -->
  <!-- The holes are the keyed outline of std/lc-bore@3, tongue up (the placements
       rotate 180), at the bores' own x of 1.125 and 7.375 - the verified 6.25
       pitch, centred. The holes and caps were left at the stencil's 6.6 pitch
       when the bores moved, 0.175 outboard of the sockets they framed. The dust
       caps below plug the 4.70 bore SQUARE, which still starts at y 3.15 - the
       keyway is the 1.60 that sits above it. -->
  <path id="bezel" fill-rule="evenodd" fill="#2b3035" stroke="#585f66" stroke-width="0.2"
        d="M 0.1 0.1 h 13 v 10.8 h -13 z
           M 2.155 1.55 h 2.64 v 0.69 h 1.03 v 0.49 h -0.62 v 0.42 h 0.62 v 4.7
             h -4.7 v -4.7 h 0.62 v -0.42 h -0.62 v -0.49 h 1.03 z
           M 8.405 1.55 h 2.64 v 0.69 h 1.03 v 0.49 h -0.62 v 0.42 h 0.62 v 4.7
             h -4.7 v -4.7 h 0.62 v -0.42 h -0.62 v -0.49 h 1.03 z"/>
  <!-- white dust caps plugging both bores, each with a moulded inset square.
       EACH CAP AND ITS INSET ARE ONE GROUP: a node standing `out` is moved to
       the end of the instance so it paints over the plate, and an inset drawn
       as its sibling was left behind it, under the cap, and never showed in 2D.
       Inside the group it travels with the cap. -->
  <g id="cap-tx">
    <rect x="1.125" y="3.15" width="4.7" height="4.7" rx="1.1" fill="#e9ecef" stroke="#b6bcc2" stroke-width="0.12"/>
    <rect id="cap-tx-inset" x="2.125" y="4.15" width="2.7" height="2.7" rx="0.7" fill="#d3d8dd"/>
  </g>
  <g id="cap-rx">
    <rect x="7.375" y="3.15" width="4.7" height="4.7" rx="1.1" fill="#e9ecef" stroke="#b6bcc2" stroke-width="0.12"/>
    <rect id="cap-rx-inset" x="8.375" y="4.15" width="2.7" height="2.7" rx="0.7" fill="#d3d8dd"/>
  </g>
</svg>
