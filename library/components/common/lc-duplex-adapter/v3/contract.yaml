format: 1
kind: component
name: lc-duplex-adapter
version: 3.1.0
class: port
profile: networking
description: >-
  Panel-mount LC duplex adapter - a bezel carrying two LC bores side by side,
  as used for Tx/Rx pairs on optical line cards. The body stands proud of the
  faceplate; the bores recess from that raised face, not from the panel. Both
  bores carry a white dust cap, which is how an unused port ships and sits.
  Distinct from sfp-lc-duplex, which is a pluggable transceiver.
size: {w: 13.2, h: 11.0}
attrs: {media: fiber, connector: lc-duplex}
provenance:
  size: measured - Smartoptics DCP-R stencil, from the pitch of abutting
    adapters on the DCP-R-34D-CS faceplate (13.24mm) and the row pitch (11.5mm)
  bore-spacing: measured - 6.6mm between the paired connection points, held
    across 35 adapters on that faceplate
  bores: >-
    std/lc-bore@3 - the KEYED opening, 4.7 wide by 6.3, whose first tier is the 4.7
    square from the ProLabs CWDM4 section A-A. This composed @1 (4.6 x 4.4,
    proportional, unsourced), then @2 (4.7 square) when the two versions were
    collapsed, and now @3 when that square turned out to be one tier of four (#126).
    THE CENTRE HAS NOT MOVED ACROSS ANY OF IT - (3.3, 5.5) and (9.9, 5.5) - and the
    dust caps still plug the bore square, which still starts at y 3.15; the 1.60 of
    keyway is new material above it. Each placement carries rotate: 180 so the latch
    tongue points up, as a panel-mount adapter is fitted. THE KEYWAY THIS DRAWS IS
    SHORTER THAN THIS PART'S OWN HARDWARE: @3 is sized for a transceiver face and
    SENKO's bulkhead adapter DS-LC-000010 carries a 3.51 stack rather than 1.60. That
    is recorded on @3 under `short-keyway` and is the price of one shared bore part
  stand-off: photo - the adapter body sits about an eighth of an inch proud of
    the faceplate, not the quarter inch first modelled
  dust-caps: photo - unused ports carry a white cap standing about a quarter
    inch proud of the jack face, with a rounded-square inset moulded into its
    front. The spigot that seats it into the bore is not modelled separately -
    it sits inside the recess and is never visible
elements:
  cap-tx: {at: [0.95, 3.15], size: [4.7, 4.7], class: cap}
  cap-rx: {at: [7.55, 3.15], size: [4.7, 4.7], class: cap}
relief:
  features:
    - node: bezel
      out: 3.175
      confidence: photo-measured
      source: >-
        common/lc-duplex-adapter@3's own stand-off key - 'photo - the adapter body sits
        about an eighth of an inch proud of the faceplate, not the quarter inch first
        modelled'. 3.175 is that eighth of an inch. A photograph read to the nearest eighth,
        and it CORRECTED an earlier quarter-inch guess, which is why it is photo-measured
        rather than estimated.
    # caps seat into the bore and stand a quarter inch proud of the jack face
    - node: cap-tx
      out: 6.35
      lift: 3.175
      color: '#e9ecef'
      confidence: photo-measured
      source: >-
        common/lc-duplex-adapter@3's own dust-caps key - 'photo - unused ports carry a white
        cap standing about a quarter inch proud of the jack face'. 6.35 is that quarter
        inch; the 3.175 lift is the bezel's own eighth-inch stand-off, so the cap is
        measured from the faceplate and not from the jack.
    - node: cap-rx
      out: 6.35
      lift: 3.175
      color: '#e9ecef'
      confidence: photo-measured
      source: >-
        common/lc-duplex-adapter@3's own dust-caps key - the same 'about a quarter inch
        proud' reading as cap-tx. ONE reading covering both caps, not two.
    # the moulded square recessed into each cap front
    - node: cap-tx-inset
      sink: 0.9
      lift: 9.525
      confidence: estimated
      source: >-
        common/lc-duplex-adapter@3 - the dust-caps key fixes that there IS 'a rounded-square
        inset moulded into its front' and nothing about how deep. The 9.525 lift is 3.175 +
        6.35, both photo-measured; only the 0.9 sink is invented.
    - node: cap-rx-inset
      sink: 0.9
      lift: 9.525
      confidence: estimated
      source: >-
        common/lc-duplex-adapter@3 - as cap-tx-inset. The inset's existence is photographed,
        its depth is not.
parts:
  # lifted onto the raised bezel, so each bore recesses from the proud face.
  # rotate 180 puts the latch tongue UP, which is how a panel-mount adapter is
  # fitted and how the issue's own photograph shows it; @3 draws it down.
  - {ref: std/lc-bore@3, id: tx, at: [0.95, 1.55], lift: 3.175, rotate: 180}
  - {ref: std/lc-bore@3, id: rx, at: [7.55, 1.55], lift: 3.175, rotate: 180}
connection-points:
  optical: {at: [6.6, 5.5], direction: front}
skins: [default]
