format: 1
kind: component
name: lc-duplex-adapter
version: 3.4.0
class: port
profile: networking
description: >-
  Panel-mount LC duplex adapter - a bezel carrying two LC bores side by side,
  as used for Tx/Rx pairs on optical line cards. The body stands proud of the
  faceplate; the bores recess from that raised face, not from the panel. Both
  bores carry a white dust cap, which is how an unused port ships and sits.
  Distinct from sfp-lc-duplex, which is a pluggable transceiver.
size: {w: 13.2, h: 11.0}
attrs: {media: fiber, connector: lc-duplex}
provenance:
  size: measured - Smartoptics DCP-R stencil, from the pitch of abutting
    adapters on the DCP-R-34D-CS faceplate (13.24mm) and the row pitch (11.5mm)
  bore-spacing: >-
    THE STANDARD, NOT THE STENCIL. 6.25 between bore centres, from
    standards.yaml's `lc-duplex-receptacle` entry, which carries it at
    `pitch-confidence: verified` sourced to IEC 61754-20 / TIA-604-10 FOCIS 10.
    THIS WAS 6.6 AND THE TWO DISAGREED IN SILENCE. 6.6 was measured off the
    Smartoptics DCP-R stencil - 'the pitch of abutting adapters on the
    DCP-R-34D-CS faceplate', held across 35 adapters - and it is a good reading
    of a drawing that is itself a simplification. A figure marked `verified`
    against a published interface standard outranks one marked `measured` off
    one vendor's Visio artwork, and nothing in the library compared them until
    L81 was written.
    THE 13.2 WIDTH IS UNCHANGED and is a different quantity: the pitch of
    ABUTTING ADAPTERS on a faceplate, not of bores within one. FS's own artwork
    measures that at 12.90 on the FHD cassette face, which is a third reading of
    a third thing and is recorded on the FS parts rather than here.
  bores: >-
    std/lc-bore@3 - the KEYED opening, 4.7 wide by 6.3, whose first tier is the 4.7
    square from the ProLabs CWDM4 section A-A. This composed @1 (4.6 x 4.4,
    proportional, unsourced), then @2 (4.7 square) when the two versions were
    collapsed, and now @3 when that square turned out to be one tier of four (#126).
    THE CENTRE HAS NOT MOVED VERTICALLY ACROSS ANY OF IT, and the dust caps still
    plug the bore square, which still starts at y 3.15; the 1.60 of keyway is new
    material above it. The HORIZONTAL centres DID move, once - from (3.3, 5.5) and
    (9.9, 5.5) to (3.175, 5.5) and (9.425, 5.5) - when the pitch was corrected to the
    verified standard; see `bore-spacing` above. Each placement carries rotate: 180
    so the latch tongue points up, as a panel-mount adapter is fitted. THE KEYWAY
    THIS DRAWS IS SHORTER THAN THIS PART'S OWN HARDWARE: @3 is sized for a
    transceiver face and SENKO's bulkhead adapter DS-LC-000010 carries a 3.51 stack
    rather than 1.60. That is recorded on @3 under `short-keyway` and is the price
    of one shared bore part
  stand-off: photo - the adapter body sits about an eighth of an inch proud of
    the faceplate, not the quarter inch first modelled
  dust-caps: photo - unused ports carry a white cap standing about a quarter
    inch proud of the jack face, with a rounded-square inset moulded into its
    front. The spigot that seats it into the bore is not modelled separately -
    it sits inside the recess and is never visible
elements:
  # x matches the bores' corrected pitch (parts:, below) so the caps still plug
  # the sockets they sit over rather than a socket 0.125mm to one side of them.
  cap-tx: {at: [0.825, 3.15], size: [4.7, 4.7], class: cap}
  cap-rx: {at: [7.075, 3.15], size: [4.7, 4.7], class: cap}
relief:
  features:
    - node: bezel
      out: 3.175
      confidence: photo-measured
      source: >-
        common/lc-duplex-adapter@3's own stand-off key - 'photo - the adapter body sits
        about an eighth of an inch proud of the faceplate, not the quarter inch first
        modelled'. 3.175 is that eighth of an inch. A photograph read to the nearest eighth,
        and it CORRECTED an earlier quarter-inch guess, which is why it is photo-measured
        rather than estimated.
    # caps seat into the bore and stand a quarter inch proud of the jack face
    - node: cap-tx
      out: 9.525
      lift: 3.175
      color: '#e9ecef'
      confidence: photo-measured
      source: >-
        common/lc-duplex-adapter@3's own dust-caps key - 'photo - unused ports carry a white
        cap standing about a quarter inch proud of the jack face'. THE JACK FACE IS THE
        BEZEL'S FRONT, at 3.175, so a quarter inch proud of it is 3.175 + 6.35 = 9.525, and
        the cap is 6.35 thick.
        IT READ 6.35 AND THAT WAS THE QUARTER INCH USED AS AN ABSOLUTE. `out` is a distance
        from the PANEL, not a height above whatever the part sits on, so writing the
        measured proudness straight into it put the cap's front at 6.35 - an eighth of an
        inch proud of the jack, half what the photograph says. The note that shipped with
        it reinterpreted the reading as 'measured from the faceplate and not from the jack'
        rather than recording it; the provenance key says jack face, and the provenance key
        is the reading.
        WHAT CONFIRMS IT: cap-tx-inset has always sat at 9.525, because the inset is
        moulded into the cap's FRONT and 9.525 is where that front is. The two agree now
        and disagreed before, and NOBODY SAW IT BECAUSE THE INSET WAS NEVER DRAWN - it was
        written as a `sink`, which means nothing outside a cavity, so the one feature whose
        position contradicted the cap's was built by nothing. #230, fixed alongside this.
    - node: cap-rx
      out: 9.525
      lift: 3.175
      color: '#e9ecef'
      confidence: photo-measured
      source: >-
        common/lc-duplex-adapter@3's own dust-caps key - the same 'about a quarter inch
        proud' reading as cap-tx, resolved the same way. ONE reading covering both caps,
        not two.
    # the moulded square recessed into each cap front. POCKET AND NOT SINK: a
    # `sink` measures down from a CAVITY FLOOR and means nothing outside one, and
    # the cap is a solid lump standing on the faceplate. Written as a sink it was
    # collected by nothing and the inset was never built (#230); `pocket` is the
    # key for a recess in an otherwise solid face. Same depth, same lift, right
    # word.
    - node: cap-tx-inset
      pocket: 0.9
      lift: 9.525
      confidence: estimated
      source: >-
        common/lc-duplex-adapter@3 - the dust-caps key fixes that there IS 'a rounded-square
        inset moulded into its front' and nothing about how deep. The 9.525 lift is 3.175 +
        6.35, both photo-measured; only the 0.9 depth is invented.
        THIS LIFT WAS RIGHT WHILE cap-tx's `out` WAS NOT, and it is what caught it: an inset
        moulded into the cap's front must sit AT that front, and 9.525 is where the
        photograph puts it. The cap said 6.35. They agree now.
    - node: cap-rx-inset
      pocket: 0.9
      lift: 9.525
      confidence: estimated
      source: >-
        common/lc-duplex-adapter@3 - as cap-tx-inset. The inset's existence is photographed,
        its depth is not.
optical:
  # TWO BORES, SO TWO FIBRE POSITIONS, and position order is the order the bores
  # are composed below: 1 is `tx`, 2 is `rx`. Stated here so no module composing
  # this adapter has to restate it - on the FS FHD line that would be 77 chances
  # to mistype a number the adapter already knows.
  positions: 2
parts:
  # lifted onto the raised bezel, so each bore recesses from the proud face.
  # rotate 180 puts the latch tongue UP, which is how a panel-mount adapter is
  # fitted and how the issue's own photograph shows it; @3 draws it down.
  - {ref: std/lc-bore@3, id: tx, at: [0.825, 1.55], lift: 3.175, rotate: 180}
  - {ref: std/lc-bore@3, id: rx, at: [7.075, 1.55], lift: 3.175, rotate: 180}
connection-points:
  # the midpoint of the two ferrule centres (3.175 and 9.425), not of the
  # 13.2-wide body - it moved from 6.6 to 6.3 with the bore-pitch correction.
  optical: {at: [6.3, 5.5], direction: front}
skins: [default]
