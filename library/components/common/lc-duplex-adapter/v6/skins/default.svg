<svg xmlns="http://www.w3.org/2000/svg" width="13.2mm" height="11mm" viewBox="0 0 13.2 11">
  <!-- The bezel is raised, and a raised part carries this art on its front face,
       so the bore openings are holes in it - otherwise the box face is solid and
       covers the recesses behind it. -->
  <!-- NO DUST CAPS: a cap is an occupant of the bore, not part of the
       adapter (see the contract's provenance.dust-caps). -->
  <!-- The holes are std/lc-bulkhead-bore@1's keyed outline turned 180, tongue
       up, at the bores' own `at` of (1.125, 0.11) and (7.375, 0.11): the
       tongue from y 0.11, the shoulder from 1.53, the neck from 2.72 and the
       4.7 square from 3.47 to 8.17, ferrules at y 5.82 (the contract's
       provenance.axis). The OUTLINE is the body's own 13.2 x 11.0 box - @4 drew
       it inset 0.1, a seam with no source, and the keyway would have cut its
       stroke - so the keyway ends 0.01 clear of the stroke's inner edge. -->
  <!-- ONLY THE OUTLINE IS STROKED. The holes are fill only: stroking them drew
       a 0.2 line round each keyway whose top edge met the outline's stroke
       0.01 away, so the two lines merged and the keyway read as opening
       through the body's edge. `#bezel` is the group the relief's `out`
       names, so the fill and the outline stand proud together. -->
  <g id="bezel" fill-rule="evenodd">
    <path fill="#2b3035"
          d="M 0 0 h 13.2 v 11 h -13.2 z
             M 2.155 0.11 h 2.64 v 1.42 h 1.03 v 1.19 h -0.62 v 0.75 h 0.62 v 4.7
               h -4.7 v -4.7 h 0.62 v -0.75 h -0.62 v -1.19 h 1.03 z
             M 8.405 0.11 h 2.64 v 1.42 h 1.03 v 1.19 h -0.62 v 0.75 h 0.62 v 4.7
               h -4.7 v -4.7 h 0.62 v -0.75 h -0.62 v -1.19 h 1.03 z"/>
    <rect x="0" y="0" width="13.2" height="11" fill="none" stroke="#585f66" stroke-width="0.2"/>
  </g>
</svg>
