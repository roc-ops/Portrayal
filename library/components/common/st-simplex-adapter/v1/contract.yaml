format: 1
kind: component
name: st-simplex-adapter
version: 1.0.0
class: port
profile: networking
description: >-
  Panel-mount ST (BFOC) simplex adapter, one bayonet-coupled opening, as fitted
  to an FS FHD ST panel. One fibre per adapter, unlike the duplex SC and MPO
  adapters this task's siblings model.
size: {w: 10.0, h: 10.0}
size-confidence: {w: estimated, h: estimated}
attrs: {media: fiber, connector: st, fibres: '1'}
optical:
  # ONE FIBRE, ONE BAYONET. ST is inherently simplex - unlike SC and LC, which
  # ship duplex adapters as the panel norm, FS's ST panels are one opening per
  # fibre.
  positions: 1
provenance:
  size: >-
    ESTIMATED - NOT A MEASUREMENT. No face-on render of an FS ST panel exists
    in this corpus, only a THREE-QUARTER product shot of SKU 183380, and a
    three-quarter view cannot be scaled the way 35510's and 57058's face-on
    renders were for the MPO and SC duplex adapters. The 10.0 x 10.0 opening is
    a plausible round number for a bayonet adapter's bulkhead and rests on
    nothing measured.
    THE PITCH IS THE ONE DERIVED FIGURE: FS sells this panel with 6 adapters,
    and the 12x MTP panel (35510, face-on) puts its outermost adapter centres
    88.8 mm apart, so six across that envelope, on a 6-across 5-gap layout,
    gives 88.8 / 5 = 17.76. See standards.yaml's `st-adapter` entry for the
    full arithmetic and its `pitch-kind: floor` reasoning. This component does
    not itself compose a second instance of anything, so it carries no layout
    for the pitch to check against - the number is recorded for the next
    contract that composes several of these in a row.
    What would settle either figure: a face-on photograph of SKU 183380, a
    caliper on one real adapter, or IEC 61754-2.
  face-detail-gap: >-
    no face-on imagery exists for this part at all - only a three-quarter
    product render (SKU 183380). The bayonet key, the coupling nut's knurling
    and any panel-print numbering are not modelled; nothing here reaches that
    level of detail.
skins: [default]
