format: 1
kind: component
name: rj45-ganged-eth
version: 1.1.0
class: port
profile: networking
description: An Ethernet RJ45 in a ganged 2xN block - the std/rj45-ganged@2 cell with
  the two lamps in its keyway-side corners.
size: {w: 12.7, h: 11.0, d: 18.6}
attrs: {media: rj45}
provenance:
  size: via std/rj45-ganged@2 - the housing, TE 1734264 rev A2.
  depth: via std/rj45-ganged@2.
  lamps: >-
    drawing and derived - TE 6368011 rev L and Amphenol RJHSE-508X place the LED
    windows in the housing's two corners on the latch side. The window's size and inset
    (2.0 wide, 1.2 from each side, 0.27 from the keyway edge) are the S9600-72XC's own
    management jack, read for #80; neither drawing dimensions the window itself.
    common/rj45-hd@1 placed them at the same corners on the same cell.
  states: >-
    convention - what the two lamps ARE: led-a is the link lamp (`off`, `link`) and
    led-b the activity lamp (`off`, `activity`), with no colour. Ethernet jacks put link
    on one window and activity on the other; the datasheets that name them do not agree
    on colours and most do not name them. A device whose guide tables the lamps
    overrides with `states:` on the placement (dell/rj45-port-14g@1 is the pattern; the
    UfiSpace guides that split the two lamps by speed rather than by link/activity write
    their own per-element mapping). 1.0.0 gave both lamps the whole vocabulary, as the
    retired common/rj45-port@4 had; 1.1.0 splits it.
  which-is-which: convention - led-a is the left window and led-b the right when the
    part is unrotated (pins up, keyway down). rotate 180 swaps them on the face with the
    keyway, as on the metal.
elements:
  led-a:
    at: [1.2, 9.63]
    size: [2.0, 1.1]
    class: led
    states: ['off', link]
  led-b:
    at: [9.5, 9.63]
    size: [2.0, 1.1]
    class: led
    states: ['off', activity]
parts:
  - {ref: std/rj45-ganged@2, id: jack, at: [0.0, 0.0], behind: true}
relief:
  features:
    - node: led-a
      out: 0.3
      color: '#0d0f11'
      confidence: estimated
      source: >-
        common/rj45-port@4 - the lamp lens stand-off this library has carried on every
        RJ45 bezel, unsourced. TE 6368011 dimensions the LED window on the PCB, not its
        lens height.
    - node: led-b
      out: 0.3
      color: '#0d0f11'
      confidence: estimated
      source: >-
        common/rj45-port@4 - the same one estimate as led-a, written once here for both.
connection-points:
  net: {at: [6.35, 5.1], direction: front}
skins: [default]
