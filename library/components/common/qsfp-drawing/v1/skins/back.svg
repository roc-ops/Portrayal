<svg xmlns="http://www.w3.org/2000/svg" width="118.0mm" height="19.0mm" viewBox="0 0 118.0 19.0">
  <!-- Rear elevation, looking at the electrical end. The three parts nest -
       shell 18.35, PCB 14.60, bottom plate 12.40 - at the heights the side
       view puts them. -->
  <rect id="shell" x="49.83" y="5.67" width="18.35" height="7.65" rx="0.6"
        fill="#a9b0b7" stroke="#767d84" stroke-width="0.25"/>
  <rect id="cavity" x="51.03" y="6.58" width="15.95" height="5.85" rx="0.4" fill="#2b3035"/>
  <rect id="pcb" x="51.70" y="10.26" width="14.6" height="1.24" rx="0.2"
        fill="#c9b98a" stroke="#a89a72" stroke-width="0.2"/>
  <rect id="plate" x="52.80" y="12.39" width="12.4" height="0.93" rx="0.2"
        fill="#6f767d" stroke="#575e65" stroke-width="0.2"/>
</svg>
