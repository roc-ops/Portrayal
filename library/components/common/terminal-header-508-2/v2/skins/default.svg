<svg xmlns="http://www.w3.org/2000/svg" width="12.16mm" height="12.1mm" viewBox="0 0 12.16 12.1">
  <!-- A green 2-way 5.08 mm header; the housing is drawn with its cells cut through (evenodd) so the
       cells, standing lower, show as open wells in 3D with a contact in each. The contacts are
       3.54 in from each end (Phoenix Contact MSTBA 2,5/..-G-5,08 range drawing). -->
  <path id="body" fill-rule="evenodd" fill="#4fb548" stroke="#2f7a2a" stroke-width="0.3" d="M 0 0 H 12.16 V 12.1 H 0 Z M 1.60 2.30 h 3.88 v 7.40 h -3.88 Z M 6.68 2.30 h 3.88 v 7.40 h -3.88 Z"/>
  <rect id="cell-1" x="1.60" y="2.30" width="3.88" height="7.40" rx="0.3" fill="#2f6e2a"/>
  <rect id="pin-1" x="3.09" y="5.60" width="0.90" height="0.90" fill="#c9cdd2"/>
  <rect id="cell-2" x="6.68" y="2.30" width="3.88" height="7.40" rx="0.3" fill="#2f6e2a"/>
  <rect id="pin-2" x="8.17" y="5.60" width="0.90" height="0.90" fill="#c9cdd2"/>
</svg>
