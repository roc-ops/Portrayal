    WIDTH PHOTO-MEASURED against the five-way power header beside it on the same face
    (AurCore AIS4001P, vendor video 1:02, 1920 px): 155 px against that header's 78 px
    contact pitch is 10.1 mm, two cells of the same 5.08 mm family (10.16). HEIGHT is that family's, from the Phoenix Contact MSTB 2,5/..-5,08 datasheet held for
    the five-way part (h 12.1); no depth is given, because a port without a behaviour would read one as a pit cut
    into the face, and the header stands proud of it - its relief says how far - the same series without a flange; no datasheet for
    this exact two-way part is held.
