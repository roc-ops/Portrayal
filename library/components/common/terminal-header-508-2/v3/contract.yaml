format: 1
kind: component
name: terminal-header-508-2
version: 3.0.0
class: port
profile: networking
conforms: terminal-508-2-header
interface: terminal-508-2
description: >-
  Two-position pluggable terminal HEADER on a 5.08 mm pitch, no flange - the green
  receptacle a two-way screw-clamp plug seats in. The dry-contact RELAY (alarm) output
  of the AurCore AIS industrial switches. Drawn empty, as the vendor photographs it.
size: {w: 12.16, h: 8.6}
size-confidence: {w: datasheet, h: datasheet}
attrs: {media: terminal-block, positions: 2, pitch-mm: 5.08}
provenance:
  size: >-
    datasheet - Phoenix Contact MSTBA 2,5/ 2-G-5,08 (order no. 1757242) data sheet,
    25/07/2019, pp.1-2: width [w] 12.16, height [h] 12.1, pitch 5.08. The width is the
    range drawing's a + 7.08 at two positions (registry `terminal-508-2-header`, from the
    MSTBA 2,5/ 6-G-5,08 data sheet, order no. 1757284, p.5), with each contact 3.54 in
    from its end of the housing. The previous major drew it 10.16, photo-measured as two
    bare 5.08 cells off the AIS4001P vendor video (#804). THE HEIGHT IS THE INSTALLED
    HEIGHT, 8.6 (#873): the same data sheet gives [h] 12.1, which counts the 3.5 solder pin
    under the board (8.6 + 3.5 = 12.1), and the range drawing on the MSTBA 2,5/ 6-G-5,08
    data sheet (1757284, p.5) gives the header 8.6 off the board. The face is the mating
    face, the board edge to the housing top, so the pin under the board is not on it; 2.x
    drew 12.1. Checked on the AIS4001P vendor video frame at 1:02 (the top face, straight
    on): the RELAY housing reads 156 px along its contact row and 101 px across it, 0.65 of
    the width, which is 7.9 mm at 12.16 on an oblique view; 12.1 would read 1.0, and the
    round brass inserts of the power header in the same frame show no foreshortening that
    could close the gap. The cells and contact are drawn at the same fractions of the
    height as before, which is an estimate of the opening, not a reading. This is the
    registry's `terminal-508-2-header`, which the part now claims. No depth is given, because a port without a behaviour would read
    one as a pit cut into the face, and the header stands proud of it - its relief says
    how far.
  mate: >-
    derived - (6.08, 4.3), the centre of the pair of contacts, which is the centre of the housing, on
    the mouth of the housing (`on: body`): a plug seated here stands off by the 2.5 the
    housing is built proud, and starts where the housing ends.
