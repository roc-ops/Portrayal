<svg xmlns="http://www.w3.org/2000/svg" width="12.16mm" height="8.6mm" viewBox="0 0 12.16 8.6">
  <!-- A green 2-way 5.08 mm header; the housing is drawn with its cells cut through (evenodd) so the
       cells, standing lower, show as open wells in 3D with a contact in each. The contacts are
       3.54 in from each end (Phoenix Contact MSTBA 2,5/..-G-5,08 range drawing). 8.6 high, the
       installed height (#873); the cells keep the fractions of the height 2.x drew. -->
  <path id="body" fill-rule="evenodd" fill="#4fb548" stroke="#2f7a2a" stroke-width="0.3" d="M 0 0 H 12.16 V 8.6 H 0 Z M 1.60 1.635 h 3.88 v 5.26 h -3.88 Z M 6.68 1.635 h 3.88 v 5.26 h -3.88 Z"/>
  <rect id="cell-1" x="1.60" y="1.635" width="3.88" height="5.26" rx="0.3" fill="#2f6e2a"/>
  <rect id="pin-1" x="3.09" y="3.85" width="0.90" height="0.90" fill="#c9cdd2"/>
  <rect id="cell-2" x="6.68" y="1.635" width="3.88" height="5.26" rx="0.3" fill="#2f6e2a"/>
  <rect id="pin-2" x="8.17" y="3.85" width="0.90" height="0.90" fill="#c9cdd2"/>
</svg>
