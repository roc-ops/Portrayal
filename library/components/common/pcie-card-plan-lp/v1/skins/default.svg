<svg xmlns="http://www.w3.org/2000/svg" width="79.2mm" height="173.8mm" viewBox="0 0 79.2 173.8">
  <!-- A card from above. Outline from the model's generic card; the art is
       not. The bracket is the rear edge (y=0); the edge connector sits along
       the riser side. -->
  <g id="body">
    <rect x="0" y="0" width="79.2" height="173.8" rx="0.8" fill="#1f5138" stroke="#123a28" stroke-width="0.5"/>
    <rect x="0" y="0" width="79.2" height="3.0" fill="#8a9096" stroke="#5c6167" stroke-width="0.3"/>
    <rect x="75.2" y="30.0" width="3.0" height="89.0" rx="0.3" fill="#c9a227"/>
    <rect x="8.0" y="40.0" width="59.2" height="59.2" rx="1.0" fill="#2a2e33" stroke="#1a1d21" stroke-width="0.4"/>
  </g>
</svg>
