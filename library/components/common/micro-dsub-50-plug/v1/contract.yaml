format: 1
kind: component
name: micro-dsub-50-plug
version: 1.0.0
class: port
mates: micro-dsub-50
profile: networking
description: >-
  A 50-pin micro D-sub cable plug (read as male, from the female receptacle it seats in) with an angled
  head on its cable, seen from the cable end as a front elevation sees it seated: a flat shell, the
  strain relief and a short straight stub of cable
  whose diameter is the cable-od field. Seats in a `micro-dsub-50` receptacle at its own mate point;
  the cable leaves from the far end of the stub.
size: {w: 47.7, h: 9.1}
size-confidence: {w: estimated, h: estimated}
attrs: {media: micro-dsub-50, connector: micro-dsub-50}
fields:
  cable-od: {label: Cable outside diameter, type: number, unit: mm, default: 6.0}
  jacket-color: {label: Jacket colour, type: text, default: '#1c1c1c'}
unplaced: seated by configurations downstream of this library; see docs/pluggables-design.md decision 2
provenance:
  model: >-
    datasheet - Lightspan Access Node FX Hardware Installation Manual 3HH-91853-AAAA-RJZZA issue 08,
    sections 18.6 (p324) and 24.6 (p465): the FX-8 and the FX-4 require a 50-pin micro DSUB connector with
    an angled head for the CO external alarm connection, and a cable assembly is sold separately. The
    manual gives no standard, dimension or gender; a plug that seats in a female receptacle is male.
  size: >-
    estimated - NO DRAWING OF THE PLUG'S DIMENSIONS IS HELD. It is drawn as large as the receptacle of
    common/micro-dsub-50-receptacle@1 (47.7 x 9.1, itself estimated). Every figure is a reading.
  needs-drawing: >-
    a maker's drawing of the CO external alarm cable connector (the angled-head 50-pin micro DSUB) with
    its shell outline, the angle of the head and the strain relief.
  stub: >-
    estimated - the stub rule, docs/connectors-coax-design.md section 5: a straight run of cable 30 long
    starting where the strain relief ends. The head is angled in the maker's cable; the bend is the
    installation.
  cable-od: >-
    estimated - no cable diameter is held. 6.0 is a reading.
  jacket-colour: >-
    a FIELD. Black is the default as on the library's other cable ends; no colour is held.
  frame: >-
    THE RELIEF IS MEASURED FROM THE LIFT THE HOST PRESENTS, the frame the house plugs use.
    common/micro-dsub-50-receptacle@1 presents at its own face, so 0 is the panel plane. The nose stands
    2.0 in front of it (estimated, no insertion depth is held).
  behaviour: >-
    DELIBERATELY OMITTED, as on every class port contract (spec/tests/test_behaviour.py).
  axis: >-
    derived - `mate` and `cable` share one point, the centre of the body (23.85, 4.55): the cable runs
    straight through the connector.
elements: {}
relief:
  features:
    - node: shell
      out: 2.0
      shape: true
      color: '#c9cdd1'
      confidence: estimated
      source: provenance.size - the nose, 2.0 in front of the port face (estimated)
    - node: body
      lift: 2.0
      out: 22.0
      shape: true
      color: '#26282b'
      confidence: estimated
      source: provenance.size - the body, 20.0 long (estimated)
    - node: relief-boot
      lift: 22.0
      cyl: 12.0
      color: '#202225'
      confidence: estimated
      source: provenance.stub - the strain relief, 12.0 long (estimated)
    - node: stub
      lift: 34.0
      cyl: 30
      confidence: estimated
      source: the stub rule, docs/connectors-coax-design.md section 5
connection-points:
  mate: {at: [23.85, 4.55], direction: front}
  cable: {at: [23.85, 4.55], direction: front, 'on': stub}
skins: [default]
