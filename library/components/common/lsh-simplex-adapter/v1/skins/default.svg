<svg xmlns="http://www.w3.org/2000/svg" width="7.0mm" height="8.0mm" viewBox="0 0 7.0 8.0">
  <!-- Panel-mount LSH/E2000 simplex adapter, 7.0 x 8.0.

       ESTIMATED GEOMETRY, SCALED TO FIT. No face-on render of SKU 336339's
       panel exists here - only a three-quarter product shot - so this bezel
       is a rough fraction of common/sc-duplex-adapter@1's measured body
       width, sized well inside this panel's own 13.4 mm derived pitch. See
       the contract's `size` provenance for the full derivation. -->
  <defs>
    <linearGradient id="bez" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4248"/>
      <stop offset="1" stop-color="#23272c"/>
    </linearGradient>
  </defs>
  <rect id="bezel" x="0" y="0" width="7.0" height="8.0" rx="0.5"
        fill="url(#bez)" stroke="#15181a" stroke-width="0.2"/>
  <rect id="port" x="1.5" y="2.5" width="4.0" height="3.0" rx="0.3"
        fill="#1c1f22"/>
</svg>
