format: 1
kind: component
name: lsh-simplex-adapter
version: 1.0.1
class: port
profile: networking
description: >-
  Panel-mount LSH/E2000 simplex adapter, one spring-shutter opening, as fitted
  to an FS FHD LSH panel. One fibre per adapter. LSH is the same physical
  interface E2000 names; FS's own catalogue calls it LSH.
unplaced: >-
  as `common/fc-simplex-adapter`: no FHD cassette or modular panel is modelled to fit it
  (roc-ops/Portrayal#244). This is the weakest aperture of the five and its provenance says
  so; it should be re-derived rather than trusted when the panel that carries it is drawn.
size: {w: 7.0, h: 8.0}
conforms: lsh-adapter
size-confidence: {w: borrowed, h: estimated}
size-notes: >-
  w borrowed from common/sc-duplex-adapter@2's photo-measured 9.4 mm body
  width, scaled to a rough fraction for LSH/E2000's smaller bulkhead class -
  see provenance/size. h has no derivation at all and stays estimated.
attrs: {media: fiber, connector: lsh}
optical:
  # ONE FIBRE. LSH/E2000 ships simplex on FS's panels.
  positions: 1
provenance:
  size: >-
    ESTIMATED - NOT A MEASUREMENT, AND THE WEAKEST APERTURE OF THE FIVE. No
    face-on render of an FS LSH panel exists in this corpus, only a
    THREE-QUARTER product shot of SKU 336339, and a three-quarter view cannot
    be scaled the way a face-on render can.
    7.0 x 8.0 IS A ROUGH FRACTION OF A DIFFERENT PART'S MEASURED AXIS, not a
    reading of this one: common/sc-duplex-adapter@2's own body width, 9.4 mm,
    is photo-measured off a face-on render, and SC and LSH/E2000 sit in a
    broadly similar bulkhead size class in vendor cut sheets. That 9.4 mm
    figure is scaled down here to a rough fraction of that body; at the
    corrected pitch below it is no longer a tight fit against a neighbour, so
    this scaling is the only reasoning left behind the number, not a
    measurement of LSH hardware itself.
    THE PITCH IS THE ONE DERIVED FIGURE: FS's catalogue line for 336339 lists
    12 adapters, but the render shows two rows of 6, not one row of 12 - a
    6-across row spans 5 gaps. Using a ~67 mm envelope bracketed by two
    face-on sibling panels (35510 and 57058), 67 / (6 - 1) = 13.4. See
    standards.yaml's `lsh-adapter` entry for the full arithmetic and its
    `pitch-kind: floor` reasoning.
    What would settle either figure: a face-on photograph of SKU 336339, a
    caliper on one real adapter, or IEC 61754-15.
  face-detail-gap: >-
    no face-on imagery exists for this part at all - only a three-quarter
    product render (SKU 336339). The spring-loaded shutter, the bayonet key and
    any panel-print numbering are not modelled.
  connection-point: >-
    `optical.at` is the plain centre of the 7.0 x 8.0 mating face -
    (7.0/2, 8.0/2) = (3.5, 4.0). `size-confidence` marks w borrowed (from
    common/sc-duplex-adapter@2) and h estimated; neither axis is measured, so
    this centre is ESTIMATED, the weaker of the two tokens it is built from.
connection-points:
  optical: {at: [3.5, 4.0], direction: front}
skins: [default]
