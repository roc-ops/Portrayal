format: 1
kind: component
name: rj11-jack
version: 1.3.0
class: port
profile: networking
interface: rj11
description: RJ11 telephone jack (FXS) - the housing round a std/rj11@1 opening, which
  a six-position plug enters, with two contacts loaded (6P2C). Pins up, latch slot
  down when unrotated; rotate 180 at placement for a jack fitted the other way up.
size: {w: 14.0, h: 13.5, d: 20.57}
attrs: {media: rj11}
provenance:
  size: >-
    photo-measured (HLX-TGV rear panel) - the 14.0 x 13.5 housing face. TE C-1775675
    rev C draws its six-position housing 13.34 wide (15.7 over the side lugs) and 15.0
    high, a different maker's body; the photographed one is kept.
  depth: >-
    via std/rj11@1 - TE customer drawing C-1775675 rev C (30 Dec 2014), sheet 1 side
    view: 20.57 overall, the registry `rj11` figure. No plug stop is dimensioned.
  opening: >-
    via std/rj11@1 - the three-tier opening and its two contacts are composed, not drawn
    here, and its source is a maker's drawing (TE C-1775675 rev C), not IEC 60603-7. It
    sits where this part drew it, 9.88 wide, centred in the 14.0 body (x 2.06) from y 1.5,
    which leaves 0.74 below the slot; the 1.5 top wall is the previous drawing's, kept
    because the photographed body is shorter than TE's. The housing face punches a
    hole of the same outline and the composed opening is drawn over it, in the order
    the cavity and the contacts were drawn before.
  walls: >-
    the sides of the opening are the housing, drawn solid, as on std/rj45@2: it is what
    grips a plug. The body colour is the previous drawing's light grey, photo-read; TE
    makes its housing black.
  mate: >-
    THE CENTRE OF THE BODY TIER, (7.0, 4.925): std/rj11@1's own mate (4.94, 3.425) placed
    at (2.06, 1.5). `tel`, the jack's line connection point, is the same place.
elements:
  jack: {at: [2.06, 1.5], size: [9.88, 11.26], class: jack}
parts:
  - {ref: std/rj11@1, id: opening, at: [2.06, 1.5]}
connection-points:
  tel: {at: [7.0, 4.925], direction: front}
  mate: {at: [7.0, 4.925], direction: front}
skins: [default]
