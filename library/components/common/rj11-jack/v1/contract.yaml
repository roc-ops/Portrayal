format: 1
kind: component
name: rj11-jack
version: 1.1.1
class: port
profile: networking
interface: rj11
description: RJ11 telephone jack (FXS)
size: {w: 14.0, h: 13.5}
attrs: {media: rj11}
provenance:
  size: photo-measured (HLX-TGV rear panel)
  elements.jack: 'skin-read - default.svg draws rect id=jack at 1.2, 1.5 sized
    11.6 x 10.5, the 6P4C opening, with jack-keyway inside it and the four pins
    above. Declared class cutout, matching the opening std/rj45 declares. The box
    is unchanged, it already matched the skin to the digit. There is no std/rj11
    and no rj11 key in spec/schemas/standards.yaml, so this aperture stays drawn
    here and the L26 warning is the record of that'
elements:
  jack: {at: [1.2, 1.5], size: [11.6, 10.5], class: cutout}
connection-points:
  tel: {at: [7.0, 6.7], direction: front}
  mate: {at: [7.0, 6.75], direction: front}
skins: [default]
