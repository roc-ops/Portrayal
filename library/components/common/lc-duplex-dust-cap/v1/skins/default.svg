<svg xmlns="http://www.w3.org/2000/svg" width="5.85mm" height="12.25mm" viewBox="0 0 5.85 12.25">
  <!-- FS's one-piece LC duplex dust cap, front view: one white moulding over
       both stacked ports, with a rounded-square inset in front of each.

       THE INSETS ARE INSIDE THE BODY GROUP. A node standing `out` is moved to
       the end of the instance so it paints over what it sits on, and insets
       drawn as its siblings were left behind it, under the cap, and never
       showed in 2D.

       THE INSETS FOLLOW THE PORTS, NOT THE CAP: the adapter stacks its bores
       6.25 apart, at y 3.75 and 10.0 of its own 13.75 body, which is 3.0 and
       9.25 here - so the insets are NOT symmetric about this cap's own
       centre, and must not be "tidied" to be. -->
  <g id="body" class="cap">
    <rect x="0.0" y="0.0" width="5.85" height="12.25" rx="0.6" fill="#e7e9ec"
          stroke="#b6bcc2" stroke-width="0.12"/>
    <rect id="inset-tx" x="1.125" y="0.80" width="3.6" height="4.4" rx="0.6" fill="#d5dade"/>
    <rect id="inset-rx" x="1.125" y="7.05" width="3.6" height="4.4" rx="0.6" fill="#d5dade"/>
  </g>
</svg>
