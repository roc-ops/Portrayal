<svg xmlns="http://www.w3.org/2000/svg" width="42.0mm" height="22.0mm" viewBox="0 0 42.0 22.0">
  <!-- A small dark wall plate with two keyholes, narrow end up, and the two screws holding it to
       the device below the keyholes, as on the lower plate. The plate is cut through at the keyholes (evenodd), so in 3D they are
       holes in a raised plate with the keyhole floor dark below. -->
