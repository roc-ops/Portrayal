        d="M 1.5 0 H 40.5 A 1.5 1.5 0 0 1 42 1.5 V 20.5 A 1.5 1.5 0 0 1 40.5 22 H 1.5 A 1.5 1.5 0 0 1 0 20.5 V 1.5 A 1.5 1.5 0 0 1 1.5 0 Z M 6.6 3.9 a 1.4 1.4 0 0 1 2.8 0 V 10.1 a 2.8 2.8 0 1 1 -2.8 0 Z M 32.6 3.9 a 1.4 1.4 0 0 1 2.8 0 V 10.1 a 2.8 2.8 0 1 1 -2.8 0 Z"/>
  <path id="keyhole-1" fill="#15181b" d="M 6.6 3.9 a 1.4 1.4 0 0 1 2.8 0 V 10.1 a 2.8 2.8 0 1 1 -2.8 0 Z"/>
  <path id="keyhole-2" fill="#15181b" d="M 32.6 3.9 a 1.4 1.4 0 0 1 2.8 0 V 10.1 a 2.8 2.8 0 1 1 -2.8 0 Z"/>
