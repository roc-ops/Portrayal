  <circle id="screw-2" cx="31.0" cy="18.4" r="1.7" fill="#1f2226" stroke="#6b7177" stroke-width="0.25"/>
  <path d="M 10.2 18.4 H 11.8 M 11.0 17.6 V 19.2 M 30.2 18.4 H 31.8 M 31.0 17.6 V 19.2" stroke="#8a9096" stroke-width="0.3"/>
