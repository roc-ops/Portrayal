format: 1
kind: component
name: dc-terminal-header-6
version: 1.0.0
class: inlet
behaviour: mounts
profile: networking
description: >-
  Six-pole pluggable terminal-block HEADER on a 5.08 mm pitch - the green board-mounted
  receptacle with six wire-plug openings and a latch post above each end, fitted behind a
  panel cut-out with no plug seated. The DC input and power-stacking connector of the
  ReadyLinks GL-x chassis. The pole names are printed on the panel below it, so the part
  carries none.
size: {w: 32.4, h: 11.1}
size-confidence: {w: drawing, h: drawing}
attrs: {media: dc-terminal}
provenance:
  size: >-
    drawing - the header node of the ReadyLinks GL-12xB vendor GLB (gl-12xb.glb,
    6P_FANFENGHUANG_1) is 32.4 x 8.6 on the rear face with two latch posts rising 2.5 above
    it, so the box is 32.4 x 11.1.
  the-face: >-
    drawing - measured off an orthographic render of the same GLB at 12 px/mm: six openings
    about 1.4 x 5.9 on a 5.08 pitch from x 3.5, and posts about 2.1 wide centred 5.2 and
    27.2 from the left end.
  depth: >-
    drawing - the header's front sits 0.3 behind the rear-panel plane in the GLB, so it is
    drawn flat; nothing stands proud.
elements:
  body: {at: [0.0, 2.5], size: [32.4, 8.6], class: connector}
skins: [default]
