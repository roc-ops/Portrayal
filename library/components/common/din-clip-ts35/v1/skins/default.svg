<svg xmlns="http://www.w3.org/2000/svg" width="44.0mm" height="58.0mm" viewBox="0 0 44.0 58.0">
  <!-- A TS35 DIN rail clip seen from behind the device, hook at the top, latch at the bottom.
       Each is a block standing on the plate with a lip overhanging the rail seat: the rail's two
       edges slide under the lips, 33 mm apart, so a 35 mm rail is caught 1 mm in at each edge. -->
  <rect id="plate" x="0" y="0" width="44.0" height="58.0" rx="0.8" fill="#474c52" stroke="#2b2f33" stroke-width="0.3"/>
  <rect id="hook" x="0" y="1.5" width="44.0" height="8.5" fill="#2c3035"/>
  <rect id="hook-lip" x="0" y="10.0" width="44.0" height="3.0" fill="#3a3f44"/>
  <path d="M 0 13.0 H 44.0" stroke="#1d2024" stroke-width="0.4"/>
  <circle id="screw-1" cx="22.0" cy="28.4" r="2.1" fill="#1f2226" stroke="#6b7177" stroke-width="0.25"/>
  <circle id="screw-2" cx="15.5" cy="39.2" r="2.1" fill="#1f2226" stroke="#6b7177" stroke-width="0.25"/>
  <circle id="screw-3" cx="28.5" cy="39.2" r="2.1" fill="#1f2226" stroke="#6b7177" stroke-width="0.25"/>
  <path d="M 21.0 28.4 H 23.0 M 22.0 27.4 V 29.4 M 14.5 39.2 H 16.5 M 15.5 38.2 V 40.2 M 27.5 39.2 H 29.5 M 28.5 38.2 V 40.2" stroke="#8a9096" stroke-width="0.35"/>
  <path d="M 0 46.0 H 44.0" stroke="#1d2024" stroke-width="0.4"/>
  <rect id="latch-lip" x="0" y="46.0" width="44.0" height="4.0" fill="#6a7076"/>
  <g id="latch">
    <rect x="0" y="50.0" width="44.0" height="7.0" fill="#5e646a" stroke="#3a3f44" stroke-width="0.3"/>
    <circle cx="22.0" cy="53.5" r="0.6" fill="#15181b"/>
  </g>
</svg>
