format: 1
kind: component
name: din-clip-ts35
version: 1.0.0
class: mount
profile: networking
description: >-
  DIN-rail mounting clip for a 35 mm top-hat rail (IEC 60715 TS35, 7.5 and 15 mm deep) -
  the plate screwed to a device's back with a fixed hook along its top and a spring latch
  along its bottom, the rail seated in the channel between. Hooked over the rail's upper
  lip and snapped down onto the lower one; the pin hole in the latch is where a screwdriver
  levers it to release. Unrotated, the hook is at the top.
size: {w: 44.0, h: 58.0}
size-confidence: {w: estimated, h: estimated}
attrs: {din-profiles: ts35x7.5 ts35x15, rail-centre-y: 29.5}
provenance:
  size: >-
    ESTIMATED from the AurCore AIS4001P back render (vendor product image 3, 1000 px),
    which is NOT square-on: the camera is raised so the top face shows, the back face is
    foreshortened top to bottom and wider near its top edge than its bottom. Widths are
    taken as fractions of the back face's own width on the same image row (the clip spans
    about 0.53 of 83.8 mm, 44 mm); heights are fractions of the face's 145 mm, a rougher
    figure (about 0.40, 58 mm). Good to a few millimetres, not better.
  the-face: >-
    The same render and the vendor video (0:31-0:33, the back three-quarter on): a dark
    plate; a hook bar across the top; the rail channel below it; three cross-head screws
    holding the plate, one centred above two; a lighter latch bar across the bottom with a
    small release pin hole at its upper edge.
  rail-centre-y: >-
    ESTIMATED - midway between the two lips, which stand 33 mm apart so that a 35 mm
    rail's edges sit 1 mm under each. A device placing this clip states the rail centre on
    its face from it.
