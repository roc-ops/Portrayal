format: 1
kind: component
name: lc-boot
version: 1.0.0
class: boot
behaviour: occupies
mates: lc-plug
profile: networking
description: >-
  A strain-relief boot for an LC plug: a 6.2 square cross-section that goes
  AROUND the 5.58 x 5.65 plug body, with about 0.28 of wall on each side. Not
  the plug's front-view silhouette, which includes the latch and this does
  not, and not the plug body either - a boot that were exactly the body it
  wraps would have no wall at all. No standard governs a boot's shape; see
  `provenance.standard` for why this is `common/` and not `generic/`.
size: {w: 6.2, h: 6.2}
size-confidence: {w: drawing, h: drawing}
attrs: {boot-length: 15.1}
unplaced: >-
  seated by a device that mate-to's a seated generic/lc-plug@1 placement -
  none does yet. spec/tests/test_chained_seats.py exercises the mechanism this
  needs (a placement mating to another placement) with std/lc-bore@3 standing
  in for a boot; a device manifest using this part for real is downstream of
  this library, same as generic/lc-plug@1's own `unplaced`.
provenance:
  standard: >-
    NO STANDARD GOVERNS A BOOT, which is why this is `common/lc-boot` and not
    `generic/lc-boot`. `generic/` is for a class shape whose envelope conforms
    to a published standard (spec/schemas/standards.yaml) and stands for every
    product of its kind under that standard - there is no such standard for a
    boot. A boot's size follows the cable OD and the vendor's own tooling: the
    SENKO LC Standard 2PC datasheet (DS-LC-000004) alone lists six boot
    options across three diameters and five colours (900um MINI, 2.0mm MINI,
    3.0mm MINI, each also sold with a "2.0mm Original" and "3.0mm" boot), and
    the LC-HD family lists four more. A `generic/` boot would present one of
    those as THE class shape, which is exactly what L99 refuses for a
    transceiver a level up. `common/` is the namespace for "shapes that stand
    for a class of part rather than one product, with no manufacturer and
    nothing a DCIM could order" (library/components/README.md), which is what
    a boot is - modelled here on common/qsfp-pull-tab@1, the library's other
    part in that position.
  size: >-
    drawing - SENKO DS-LC-000023 Rev A p.3 (XP Fit Plus, series 951), the
    BOOT's own figures on the boot's own sub-assembly, which is the change
    from the first cut of this contract. It previously stated 5.58 x 5.65 -
    the plug body EXACTLY, w borrowed from the plug's front view and h read
    off the plug's side view - which gives a boot ZERO WALL, and is the very
    thing common/rj45-boot@1's own provenance calls wrong ("a boot goes around
    the outside of the part it wraps, not inside it"). It also labelled a PLUG
    figure as `h: drawing` for the BOOT, which is a mislabel however close the
    number.

    THE HEIGHT: 6.2 +/-0.1, the plain (un-diametered) callout on the exploded
    side view's third sub-assembly. It was previously dismissed here as
    unattributed. It is not: it is a linear vertical dimension on the boot,
    its two arrowheads are placed outside pointing IN at the boot's top and
    bottom outer edges, and the pair is centred on the boot's own centreline
    to within half a pixel at 600 dpi. The same sub-assembly carries the 15.1
    +/-0.1 length this contract already cites, from the same left face.

    CHECKED, not just read. At 600 dpi the boot's block measures 200.0 px tall
    (edges at y 367.4 and 567.4, centreline at 467.4 - symmetric). Scaling by
    the 15.1 length on the SAME view gives 32.05-32.20 px/mm, so that block is
    6.21-6.24 mm. The plug body's 5.65 would need 181-182 px; it is out by 18.

    THE WIDTH: 6.2, MEASURED off the top view of the same sheet rather than
    read from a callout - nothing on this drawing dimensions the boot's width.
    The two views are at different scales, so they are tied by a feature both
    draw: the boot's five moulded ribs, whose pitch spans 64.8 px on the side
    view and 79.59 px on the top view, a ratio of 1.228. The boot's block
    measures 245.67 px across on the top view against 200.0 px tall on the
    side view - a ratio of 1.228, THE SAME to three figures. The cross-section
    is therefore square, and the width is the height: 6.2. That is one
    measurement checked against a second, not a figure inferred from the
    height and then restated as if measured.

    WHAT THIS MAKES THE WALL: (6.2 - 5.65)/2 = 0.275 over the plug body's
    height and (6.2 - 5.58)/2 = 0.31 over its width. Those are consequences
    of two independently sourced envelopes, and no wall thickness is stated
    anywhere in this contract - the boot's envelope is its own, not the plug's
    plus something.
  boot-length: >-
    drawing - SENKO DS-LC-000023 Rev A p.3 (XP Fit Plus, series 951), Side
    View, an EXPLODED view whose three sub-assemblies (ferrule, body, boot) are
    dimensioned separately: the boot is 15.1 +/-0.1 long. The same view also
    dimensions the boot's I.D. 1.60 +/-0.05 (verified directly off the page 3
    render at 300dpi) at the cable-exit end and a further I.D. Ø1.0 nearer the
    body joint; neither feeds `size` or `attrs` here, since this contract's
    envelope is the boot's outer block, not its bore. THE BRIEF'S
    "O.D. 2 +/-0.1" IS NOT ON THIS PAGE: nothing on it carries a callout
    reading "O.D." or "Ø2". The plain (un-diametered) "6.2 +/-0.1" on the same
    side view - read at 8x zoom to rule out misreading a "2" for a "6" - is
    the BOOT'S OUTER HEIGHT and now feeds `size`; see provenance.size for what
    establishes that.
  axis: >-
    drawing - the side view draws the boot's centreline, and it sits at y
    467.4 against outer edges at 367.4 and 567.4: dead centre of the block, to
    within the line weight. So `mate` (front, where the boot meets the plug's
    `boot` point) and `cable` (rear, where the cable continues) share one
    (x, y), the centre of the 6.2 x 6.2 cross-section, (3.1, 3.1) - the same
    reasoning generic/lc-plug@1's own `axis` note gives for its three points:
    the fibre runs straight through on one axis, so a front point and a rear
    point are one location seen from two directions.

    THE PLUG'S AXIS IS 7.61 FROM THE TOP OF ITS OWN SILHOUETTE and this boot's
    is 3.1 from the top of its own. The two are not comparable figures and
    nothing here should try to reconcile them: each is measured in its own
    part's frame, and it is the `mate` points that bring them together when
    the boot is seated.
elements:
  body: {at: [0.0, 0.0], size: [6.2, 6.2], class: boot}
connection-points:
  mate: {at: [3.1, 3.1], direction: front}
  cable: {at: [3.1, 3.1], direction: rear}
skins: [default]
