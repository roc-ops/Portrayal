<svg width="5.58mm" height="5.65mm" viewBox="0 0 5.58 5.65" xmlns="http://www.w3.org/2000/svg">
  <!-- Front view of the boot's body cross-section, sized to the plug body it
       wraps (provenance.size). The bore is the SENKO DS-LC-000023 I.D.
       1.60 +/-0.05 at the cable-exit end, centred on the shared optical axis
       (provenance.axis) - it does not set `size`, only the decoration. -->
  <rect id="body" x="0.0" y="0.0" width="5.58" height="5.65" rx="0.7" ry="0.7" class="boot" fill="#3d4147"/>
  <circle id="bore" cx="2.79" cy="2.825" r="0.8" fill="#17181a"/>
</svg>
