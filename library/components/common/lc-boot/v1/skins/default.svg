<svg width="6.2mm" height="6.2mm" viewBox="0 0 6.2 6.2" xmlns="http://www.w3.org/2000/svg">
  <!-- Front view of the boot's body cross-section: the boot's OWN 6.2 square
       block (provenance.size), which goes around the 5.58 x 5.65 plug body
       rather than being it. The bore is the SENKO DS-LC-000023 I.D.
       1.60 +/-0.05 at the cable-exit end, centred on the shared optical axis
       (provenance.axis) - it does not set `size`, only the decoration.
       The bore is INSIDE the `body` group because it is the boot's REAR, the
       end the viewer sees: the `body` relief feature extrudes this group and
       paints its art on the far face, so the cable exit shows there rather
       than being buried at the plug joint. -->
  <g id="body" class="boot">
    <rect x="0.0" y="0.0" width="6.2" height="6.2" rx="0.7" ry="0.7" fill="#3d4147"/>
    <circle id="bore" cx="3.1" cy="3.1" r="0.8" fill="#17181a"/>
  </g>
</svg>
