format: 1
kind: module
name: drive-blank-35
version: 1.2.0
class: blank
behaviour: fills
profile: server
description: >-
  Filler for a 3.5 inch LFF drive bay - the carrier moulding without the drive:
  same release with its orange ring, same rails, same three windows onto the
  tray honeycomb, and nothing at the head, because the glyphs on a populated
  carrier are its lamps and a blank has nothing to report
size: {w: 105.5, h: 26.9, d: 25.0}
body: {depth: 25.0, color: '#3c4247'}
attrs:
  media: lff-3.5
  form-factor: '3.5-inch LFF'
provenance:
  face-size-from-the-carrier: >-
    borrowed - common/drive-carrier-35 entire, now 105.50 x 26.90 from Dell's
    own R740XD 3D guide CAD. A blank fills the same bay on the same pitch, so
    its face is the carrier's face; that reasons from the BAY rather than from
    a drawing of the blank, which is the same borrowing drive-blank-25
    documents.
  depth-is-borrowed-and-unmeasured: >-
    borrowed - common/drive-blank-25's 25.0. A filler is a shell, not a 165 mm
    tray. THERE IS NO BLANK IN DELL'S CAD: searching the R740XD 3D guide for
    blank, filler or dummy returns only rear-cage hardware, so the carrier's
    measured 165.60 depth does NOT transfer here and an earlier pass of this
    work wrongly recorded that it did. Nothing has measured this part's depth.
  body: >-
    the 3D body, and `body.depth` matches `size.d` because the whole part is
    one shallow box behind one face. `travel` is omitted: a blank is
    removable, not captive. THE DEPTH IS BORROWED, so the 3D extent of this
    part is the least-sourced thing about it.
  size: >-
    borrowed - common/drive-carrier-35 entire, because a blank fills the same
    bay on the same pitch and its face is therefore the same 107.208 x 26.5.
    That carrier's width is photo-measured off dellr740xd-12x35.webp, which
    passes Gate 1 at 0.07% against the 482.6 rack face, and its height off ISM
    figure 9 at 0.27%.
  face: >-
    estimated - AND THIS PART IS DERIVED RATHER THAN DRAWN FROM ANYTHING. No
    drawing or photograph of a Dell 3.5 inch blank exists in this intake. The
    12-bay front photograph the geometry came from shows twelve POPULATED
    carriers and no filler at all, and Dell's rack server stencil has no 14G
    blank master - the same silence common/drive-blank-25 records.
    What is applied is that part's RULE, which is itself an operator report from
    the 2.5 inch blank in hand: the blank is the carrier except that it has no
    LEDs at the head. So the two lamp glyphs and the capacity text are dropped
    and everything else is kept.
  what-would-overturn-it: >-
    a photograph of a 3.5 inch blank. It is NOT certain that Dell's LFF filler is
    a carrier moulding at all - a plain vented plate is what some vendors ship,
    and it would look nothing like this. The 2.5 inch precedent makes the
    carrier-moulding reading the better guess and does not make it a fact.
  no-lamps: >-
    borrowed - common/drive-blank-25's `no-lamps`, an operator report from the
    2.5 inch part in hand. Whether the 3.5 inch blank follows its sibling here
    has not been checked against anything.
relief:
  wall: '#2a2e32'
  features: []
