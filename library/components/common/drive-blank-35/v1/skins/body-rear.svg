<svg xmlns="http://www.w3.org/2000/svg" width="105.5mm" height="26.9mm" viewBox="0 0 105.5 26.9">
  <!-- REAR, as seen from behind. Nothing on it: a filler closes an opening and carries no connector.
       A FILLER, SO THE SIDES ARE PLAIN. No drive, no rails carrying
       one, no screws holding one - drawing the carrier's would be
       inventing hardware, and would blur the one difference that
       matters when a bay is empty. The band is the bezel.
  -->
  <rect x="0" y="0" width="105.5" height="26.9" fill="#3c4247" stroke="#2a2e32" stroke-width="0.4"/>
</svg>
