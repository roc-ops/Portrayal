format: 1
kind: component
name: fc-simplex-adapter
version: 1.0.0
class: port
profile: networking
description: >-
  Panel-mount FC simplex adapter, one threaded bayonet-coupled opening, as
  fitted to an FS FHD FC panel. One fibre per adapter, the same simplex
  arrangement as common/st-simplex-adapter.
size: {w: 10.0, h: 10.0}
size-confidence: {w: estimated, h: estimated}
attrs: {media: fiber, connector: fc}
optical:
  # ONE FIBRE. FC is simplex on FS's panels, the same as ST.
  positions: 1
provenance:
  size: >-
    ESTIMATED - NOT A MEASUREMENT. No face-on render of an FS FC panel exists
    in this corpus, only a THREE-QUARTER product shot of SKU 382881, and a
    three-quarter view cannot be scaled the way a face-on render can.
    THE 10.0 x 10.0 APERTURE IS BORROWED FROM common/st-simplex-adapter@1's OWN
    ESTIMATE, not derived independently: FC and ST are both round
    bayonet-coupled interfaces of a similar generation, and vendor drawings for
    the two bulkheads typically read within a millimetre of each other, so the
    same plausible round number is adopted here rather than inventing a second
    unsourced guess. It comfortably fits the 22.3 mm pitch below.
    THE PITCH IS THE ONE DERIVED FIGURE: FS's catalogue line for 382881 lists
    8 adapters, but the render shows two rows of 4, not one row of 8 - a
    4-across row spans 3 gaps. Using a ~67 mm envelope bracketed by two
    face-on sibling panels (35510 and 57058), 67 / (4 - 1) = 22.3. See
    standards.yaml's `fc-adapter` entry for the full arithmetic and its
    `pitch-kind: floor` reasoning.
    What would settle either figure: a face-on photograph of SKU 382881, a
    caliper on one real adapter, or IEC 61754-13.
  face-detail-gap: >-
    no face-on imagery exists for this part at all - only a three-quarter
    product render (SKU 382881). The threaded coupling nut, its knurling and
    any panel-print numbering are not modelled.
  connection-point: >-
    `optical.at` is the plain centre of the 10.0 x 10.0 mating face -
    (10.0/2, 10.0/2) = (5.0, 5.0). Both axes of `size-confidence` are
    estimated, so this centre is ESTIMATED too.
connection-points:
  optical: {at: [5.0, 5.0], direction: front}
skins: [default]
