<svg xmlns="http://www.w3.org/2000/svg" width="10.0mm" height="10.0mm" viewBox="0 0 10.0 10.0">
  <!-- Panel-mount FC simplex adapter, 10.0 x 10.0.

       ESTIMATED GEOMETRY, BORROWED FROM common/st-simplex-adapter@1. No
       face-on render of SKU 382881's panel exists here - only a
       three-quarter product shot - and the 10.0 x 10.0 bulkhead is the same
       plausible round number adopted for ST, on the reasoning that FC and ST
       share a similar bayonet coupling-nut order of magnitude. See the
       contract's `size` provenance for the full derivation. -->
  <defs>
    <linearGradient id="bez" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4248"/>
      <stop offset="1" stop-color="#23272c"/>
    </linearGradient>
  </defs>
  <rect id="bezel" x="0" y="0" width="10.0" height="10.0" rx="0.6"
        fill="url(#bez)" stroke="#15181a" stroke-width="0.2"/>
  <circle id="port" cx="5.0" cy="5.0" r="2.6" fill="#1c1f22"/>
</svg>
