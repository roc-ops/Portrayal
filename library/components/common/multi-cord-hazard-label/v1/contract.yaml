format: 1
kind: component
name: multi-cord-hazard-label
version: 1.0.0
class: marking
behaviour: mounts
profile: networking
description: >-
  Yellow rectangular hazard sticker with two symbols side by side - an electric-shock
  triangle (ISO 7010 W012) and the "disconnect all power cords" mark, a hand drawing plugs
  out of a stack of inlets. The label a multi-supply chassis carries beside its supplies to
  say that pulling one cord does not de-energise it.
size: {w: 29.8, h: 10.9}
size-confidence: {w: photo-measured, h: photo-measured}
provenance:
  size: >-
    photo-measured - the label on the Celestica DS6000 rear render (ds6000-B, 2.09 px/mm
    across, 2.05 down), 62.5 x 22.5 px on each of the two end panels, 29.8 x 10.9 mm after
    each axis is scaled by its own datasheet dimension. Corners rounded about 1 mm.
  glyphs: >-
    photo - read on ds6000-B and the three-quarter render ds6000-A-3: a black-bordered
    triangle with a lightning bolt on the left half, a hand with plugs and an arrow on the
    right. The second symbol is drawn as a simplified outline (three stacked plug bodies and
    an arrow), not traced; at 2 px/mm the render does not resolve the hand, and a reader
    needs only to recognise the kind of warning. The caution text such labels usually carry
    in small print is not legible in any held image and is not reproduced.
skins: [default]
