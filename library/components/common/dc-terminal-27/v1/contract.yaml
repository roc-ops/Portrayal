format: 1
kind: component
name: dc-terminal-27
version: 1.0.1
class: inlet
behaviour: mounts
profile: networking
description: >-
  Three-pole DC barrier terminal block with a hinged clear cover - the
  screw-down -48 V input fitted to 1RU access and timing switches, where the
  supply is landed on ring lugs rather than plugged in. Three screws on an 8.36
  pitch behind a transparent guard; the pole names are silkscreened on the
  faceplate BELOW the block, not moulded into it, so this part carries no
  lettering and a device writes its own.
size: {w: 27.5, h: 15.9, d: 10.4}
size-confidence: {w: photo-measured, h: photo-measured, d: estimated}
attrs: {media: dc-terminal}
provenance:
  size: >-
    photo-measured, READ OFF A MILLIMETRE RULE rather than a threshold. The
    Edgecore CSR200 (AS5915-18X) datasheet elevation, page 2 at 600 dpi scaled by
    the stated 440 mm width to 9.6341 px/mm, cropped at 25 px/mm with the rule
    burned into the image. Both blocks on the face read 27.5 x 15.9 and their
    pole windows 6.8 x 9.4.
    TWO EARLIER READINGS OF THIS PART WERE WRONG AND BOTH WERE AUTOMATED. 28.0 x
    15.2 came from a crop read by eye; 26.93 x 15.98 came from a background-
    relative threshold, which found the block's bright CORE and clipped the
    duller edge on every instance. The rule settles it because the answer is read
    against a printed scale instead of inferred from where a brightness curve
    crosses a number nobody chose.
  poles: >-
    photo-measured on the same rule, and the block IS NOT SYMMETRIC. Pole centres
    read 44.6/52.8/61.0 on the left block and 85.2/93.4/101.6 on the right - an
    8.2 pitch, four gaps agreeing to 0.0 - inside bodies starting at 38.0 and
    79.0. That puts the three poles 0.9 mm right of the body's own centre, with
    3.2 mm of end wall on the left and 1.1 on the right. The asymmetry is on BOTH
    blocks of BOTH devices, which is why it is modelled rather than averaged
    away; an earlier version centred them and drew the windows at 4.6 wide
    against the 6.8 the rule gives.
  depth: >-
    estimated. The elevation is a front view and fixes nothing behind the face.
    10.4 is what the relief below actually BUILDS - the screw heads are the
    furthest-forward thing on the part - rather than a guess at the moulding's
    total depth including whatever sits behind the panel, which no source gives
    and nothing in the library uses.
  screws: >-
    EACH TERMINAL SCREW IS A COMPOSED PART, common/terminal-screw-38@1, one
    per pole under the ids `lug-1` to `lug-3`, standing on its pole through
    the part's `lift` of 9.0. The head and its slot are that part's drawing,
    moved out of this skin unchanged, and its 1.4 of head is that part's
    relief. The part presents the `terminal-stud` interface, so each pole is a
    seat a wire's lug lands on; this block states no interface of its own.
    THE WIRES LEAVE DOWNWARD, toward the legend printed below the block: the
    Edgecore quick start guides draw each pole open at its lower edge between
    the barriers. The element ids `pole-1` to `pole-3` are the poles and are
    unchanged.
  cover: >-
    photo-measured, as a colour rather than a dimension - the block reads far
    brighter than the panel around it in both instances, with the screws
    resolving through it, which is what a clear polycarbonate guard over metal
    looks like at this scale. The hinge is inferred from the guard, not seen.
elements:
  pole-1: {at: [3.2, 3.6], size: [6.8, 9.4], class: terminal}
  pole-2: {at: [11.4, 3.6], size: [6.8, 9.4], class: terminal}
  pole-3: {at: [19.6, 3.6], size: [6.8, 9.4], class: terminal}
relief:
  wall: '#3a3e43'
  features:
    - node: body
      out: 7.5
      shape: true
      color: '#7d848c'
      confidence: estimated
      source: >-
        THE 3D FORM IS THE READING TOO, and the first one was wrong in a way only the
        kit showed. It was written as two full-face slabs - a `body` 9.0 proud and a
        `cover` 14.0 proud over the whole face - so in 3D the cover buried the poles
        and the screws, which had no relief of their own, and the block extruded as a
        featureless pale box. The 2D face was right the whole time. What is here now is
        the form the photograph shows: a slab, two bright lips standing proud of it
        along the top and bottom edges, three pole blocks between them sitting just
        below the lip line, and a screw head on each pole. Only the STEP SIZES are
        estimated; which feature is proud of which is read off the elevation, where the
        lips catch the light and the pole windows are in shadow.
    - node: lip-top
      out: 10.2
      color: '#dde2e7'
      confidence: estimated
      source: >-
        common/dc-terminal-27@1's own 3D-form key - see `body`. The lip's step
        above the block face is estimated; that it IS a step is read off the
        elevation.
    - node: lip-bottom
      out: 10.2
      color: '#dde2e7'
      confidence: estimated
      source: >-
        common/dc-terminal-27@1's own 3D-form key - see `body`. The lip's step
        above the block face is estimated; that it IS a step is read off the
        elevation.
    - node: mid
      out: 8.0
      color: '#b7bdc3'
      confidence: estimated
      source: >-
        common/dc-terminal-27@1's own 3D-form key - see `body`. The band between
        the lips, which the poles stand on.
    - node: pole-1
      out: 9.0
      color: '#7d848c'
      confidence: estimated
      source: >-
        common/dc-terminal-27@1's own 3D-form key - see `body`.
    - node: pole-2
      out: 9.0
      color: '#7d848c'
      confidence: estimated
      source: >-
        common/dc-terminal-27@1's own 3D-form key - see `body`.
    - node: pole-3
      out: 9.0
      color: '#7d848c'
      confidence: estimated
      source: >-
        common/dc-terminal-27@1's own 3D-form key - see `body`.
parts:
  - {ref: common/terminal-screw-38@1, id: lug-1, at: [4.7, 6.1], lift: 9.0}
  - {ref: common/terminal-screw-38@1, id: lug-2, at: [12.9, 6.1], lift: 9.0}
  - {ref: common/terminal-screw-38@1, id: lug-3, at: [21.1, 6.1], lift: 9.0}
connection-points:
  dc-in: {at: [14.8, 8.0], direction: front}
skins: [default]
