format: 1
kind: component
name: dc-terminal-27
version: 1.0.0
class: inlet
behaviour: mounts
profile: networking
description: >-
  Three-pole DC barrier terminal block with a hinged clear cover - the
  screw-down -48 V input fitted to 1RU access and timing switches, where the
  supply is landed on ring lugs rather than plugged in. Three screws on an 8.36
  pitch behind a transparent guard; the pole names are silkscreened on the
  faceplate BELOW the block, not moulded into it, so this part carries no
  lettering and a device writes its own.
size: {w: 26.93, h: 15.98, d: 14.0}
size-confidence: {w: photo-measured, h: photo-measured, d: estimated}
attrs: {media: dc-terminal}
provenance:
  size: >-
    photo-measured - Edgecore CSR200 (AS5915-18X) datasheet front elevation,
    page 2 rendered at 600 dpi and scaled by the stated 440 mm body width to
    9.6341 px/mm, thresholded against the PANEL BACKGROUND rather than by eye.
    The face carries two of these and they read 26.98 x 16.08 and 26.88 x 15.87,
    so 26.93 x 15.98 is the mean of two instances that agree to 0.2 mm.
    AN EARLIER READING OF THIS PART SAID 28.0 x 15.2 and was wrong on both axes -
    a crop read by eye, where the block's dark upper lip was taken for panel on
    one axis and its shadow for body on the other. What fixed it was measuring
    both instances with one threshold derived from the background, which is also
    what made the CSR180's block measurably a DIFFERENT part rather than a noisy
    reading of this one. See common/dc-terminal-24@1.
    WHAT IT IS NOT: it is not a datasheet dimension. No Edgecore document
    dimensions this block, and the barrier strip is a bought-in part whose own
    maker is not named anywhere in the corpus. If the vendor part number ever
    surfaces, its drawing supersedes every number here.
  pitch: >-
    photo-measured - the three bright pole faces read 44.38/52.74/61.10 on the
    left block and 84.76/93.06/101.47 on the right, giving four gaps of 8.36,
    8.36, 8.30 and 8.41. 8.36 is their mean and it is not rounded to a catalogue
    figure, because no catalogue entry is in hand to round to: an earlier note
    here called it 8.5 "the nearest of the standard barrier-strip pitches",
    which dressed a preference as a reading.
  depth: >-
    estimated. The elevation is a front view and fixes nothing behind the face.
    14.0 is what a 3-pole barrier strip with a hinged guard needs to clear a
    ring lug; nothing in the library depends on it.
  cover: >-
    photo-measured, as a colour rather than a dimension - the block reads far
    brighter than the panel around it in both instances, with the screws
    resolving through it, which is what a clear polycarbonate guard over metal
    looks like at this scale. The hinge is inferred from the guard, not seen.
elements:
  pole-1: {at: [2.85, 3.8], size: [4.6, 8.4], class: terminal}
  pole-2: {at: [11.21, 3.8], size: [4.6, 8.4], class: terminal}
  pole-3: {at: [19.57, 3.8], size: [4.6, 8.4], class: terminal}
relief:
  wall: '#3a3e43'
  features:
    - node: body
      out: 9.0
      shape: true
      color: '#7d848c'
      confidence: estimated
      source: >-
        common/dc-terminal-3@1's own depth key - the elevation is a front view
        and dimensions nothing behind the face. The block is split 9.0 body plus
        a 5.0 guard to make 14.0 because a barrier strip's guard is a lid on a
        shorter body, not the whole part; neither figure is read from anything.
    - node: cover
      out: 14.0
      lift: 9.0
      color: '#d2d7dc'
      confidence: estimated
      source: >-
        common/dc-terminal-3@1's own depth key - see `body`. 5.0 of guard above a
        9.0 body, estimated to sum to the estimated 14.0.
connection-points:
  dc-in: {at: [13.47, 7.99], direction: front}
skins: [default]
