<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portrayal — marks harness</title>
<!--
  A bench for demo2/marks.js, standing in for the Annotate tab until it exists.
  Type a markup document, watch it land on a real compiled drawing, and take
  every export the module offers. The <img> panel matters most: an <img> cannot
  reach this page's CSS or script, so if the export reads correctly in there it
  reads correctly in Word.
-->
<style>
  :root { --bg:#16181b; --panel:#1c2024; --line:#2b3035; --ink:#d7dbdf; --dim:#8d939a;
          --accent:#4c9aff; --warn:#f59e0b; --bad:#ef4444; --ok:#22c55e; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column;
         font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:0.7rem; align-items:center; flex-wrap:wrap;
           padding:0.55rem 0.9rem; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:0.86rem; margin:0 0.5rem 0 0; font-weight:600; letter-spacing:0.02em; }
  select, button, input, textarea { font:inherit; font-size:0.78rem; background:#23272c;
    color:var(--ink); border:1px solid #3a4046; border-radius:6px; padding:0.26rem 0.5rem; }
  button { cursor:pointer; }
  button:hover:not(:disabled) { background:#2c3137; }
  button:disabled { opacity:0.5; cursor:progress; }
  label.f { font-size:0.72rem; color:var(--dim); display:flex; gap:0.32rem; align-items:center; }
  main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; overflow:auto; background:#101214; padding:1rem; }
  #stage svg { width:100%; height:auto; display:block; }
  aside { width:31rem; border-left:1px solid var(--line); background:var(--panel);
          display:flex; flex-direction:column; min-height:0; overflow:auto; }
  section { border-bottom:1px solid var(--line); padding:0.6rem 0.7rem; }
  h2 { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em;
       color:var(--dim); margin:0 0 0.4rem; font-weight:600; }
  textarea { width:100%; height:15rem; font-family:ui-monospace, monospace; font-size:0.72rem;
             line-height:1.45; resize:vertical; white-space:pre; }
  .rules { display:flex; flex-wrap:wrap; gap:0.3rem; margin-bottom:0.4rem; }
  .rules button { font-size:0.7rem; padding:0.15rem 0.45rem; }
  table { width:100%; border-collapse:collapse; font-size:0.72rem; }
  th { text-align:left; color:var(--dim); font-weight:500; padding:0.15rem 0.3rem; }
  td { padding:0.15rem 0.3rem; border-top:1px solid #262b30; vertical-align:top; }
  td.sel { font-family:ui-monospace, monospace; color:#c7ccd1; word-break:break-all; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; }
  td.n.zero { color:var(--warn); font-weight:600; }
  .err { color:var(--bad); font-size:0.7rem; font-family:ui-monospace, monospace; }
  .warn { color:var(--warn); font-size:0.7rem; }
  .sw { display:inline-block; width:0.8rem; height:0.8rem; border-radius:3px;
        border:1px solid #00000055; vertical-align:-1px; }
  .msg { color:var(--dim); font-size:0.72rem; min-height:1.15em; margin-top:0.35rem;
         word-break:break-all; }
  .msg.bad { color:var(--bad); }
  .msg.good { color:var(--ok); }
  .btns { display:flex; flex-wrap:wrap; gap:0.35rem; }
  #hash { width:100%; font-family:ui-monospace, monospace; font-size:0.68rem; margin-top:0.35rem; }
  #shot { width:100%; background:#fff; border:1px solid var(--line); border-radius:6px;
          display:block; margin-top:0.4rem; }
  .note { color:var(--dim); font-size:0.68rem; line-height:1.5; margin:0.35rem 0 0; }
  .pass { color:var(--ok); } .fail { color:var(--bad); }
  pre#selftest { font-size:0.68rem; font-family:ui-monospace, monospace; margin:0.3rem 0 0;
                 white-space:pre-wrap; line-height:1.5; }
</style>
</head>
<body>
<header>
  <h1>marks.js harness</h1>
  <label class="f">device <select id="dev"></select></label>
  <label class="f">config <select id="cfg"></select></label>
  <label class="f">view <select id="view"></select></label>
  <button id="reapply">Apply</button>
  <button id="clear">Clear</button>
  <span class="f" id="status"></span>
</header>
<main>
  <div id="stage"></div>
  <aside>
    <section>
      <h2>markup document</h2>
      <div class="rules">
        <button data-add='{"select":"[data-speed=&#39;100g&#39;]","color":"#00e676","label":"100G"}'>100G</button>
        <button data-add='{"select":"[data-class=&#39;port&#39;]","color":"#00d5ff","label":"ports"}'>ports</button>
        <button data-add='{"select":"[data-media=&#39;rj45&#39;]","color":"#ffd400","label":"RJ45"}'>RJ45</button>
        <button data-add='{"select":"[data-class=&#39;led&#39;]","state":"fault"}'>all LEDs fault</button>
        <button data-add='{"select":"[data-path=&#39;psu-0&#39;]","color":"#ff2d95","label":"failed PSU"}'>psu-0</button>
        <button data-add='{"select":"[data-class=&#39;region&#39;]","color":"#ff6d00","label":"regions"}'>regions</button>
        <button data-add='{"select":"not a ][ selector","color":"#ff2d95"}'>bad selector</button>
      </div>
      <textarea id="doc" spellcheck="false"></textarea>
      <div class="msg" id="docmsg"></div>
    </section>
    <section>
      <h2>matches</h2>
      <table id="report"><tbody></tbody></table>
    </section>
    <section>
      <h2>export</h2>
      <div class="btns">
        <button data-act="svg-save">Download SVG</button>
        <button data-act="svg-open">Open SVG standalone ↗</button>
        <button data-act="png-4">PNG 4 px/mm</button>
        <button data-act="png-8">PNG 8</button>
        <button data-act="png-16">PNG 16</button>
        <button data-act="hash">Share URL</button>
      </div>
      <input id="hash" readonly placeholder="share URL appears here">
      <div class="msg" id="expmsg"></div>
      <p class="note">The panel below is the exported string in an <code>&lt;img&gt;</code>,
        rebuilt on every Apply. An <code>&lt;img&gt;</code> gets no page CSS and runs no
        script, so anything visible there is carried by the file itself.
        <span id="shotmeta"></span></p>
      <img id="shot" alt="export preview">
    </section>
    <section>
      <h2>self-check</h2>
      <button id="runtests">Run</button>
      <pre id="selftest"></pre>
    </section>
  </aside>
</main>

<script type="module">
import * as marks from './marks.js';

const $ = s => document.querySelector(s);
const DIST = '../dist';
const state = {svg: null, meta: null, doc: null};

const SAMPLE = {
  v: 1, device: 'as7946-30xb', config: 'dc-psu', view: 'front', legend: true,
  marks: [
    {select: "[data-group='qsfpdd-400g']", color: '#00d5ff', label: '400G QSFP-DD uplinks'},
    {select: "[data-group='qsfp28']", color: '#00e676', label: '100G QSFP28'},
    {select: "[data-group='mgmt']", color: '#ff2d95', label: 'management'},
    {select: "[data-function='link']", state: 'up'},
  ],
};

// ---------------------------------------------------------------- loading

// A 404 comes back as an HTML error page, and .json() on that throws a parse
// error about an unexpected '<' - which reads as a bug in this page rather than
// as "library/dist has not been built". Say which file, and say the status.
async function get(path) {
  const r = await fetch(`${DIST}/${path}`, {cache: 'no-store'});
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status} - is library/dist built?`);
  return r;
}
const j = async p => (await get(p)).json();

async function loadDevice(name, want = {}) {
  state.meta = await j(`${name}.configs.json`);
  const configs = state.meta.configs.map(c => c.name);
  fill($('#cfg'), configs, configs.includes(want.config) ? want.config : state.meta.default);
  fill($('#view'), state.meta.views,
       state.meta.views.includes(want.view) ? want.view : state.meta.views[0]);
  writeTarget();
  await loadStage();
}

// device/config/view are FIELDS OF THE DOCUMENT, not harness state, so the two
// are kept in step in both directions: moving a dropdown rewrites the document,
// and a document that names a different drawing - typed here, or arriving in a
// share URL - moves the stage. Without this the exports and the hash quietly
// describe a drawing other than the one on screen.
function writeTarget() {
  let d;
  try { d = marks.normalise(JSON.parse($('#doc').value)); } catch (e) { return; }
  if (d.device === $('#dev').value && d.config === $('#cfg').value &&
      d.view === $('#view').value) return;
  d.device = $('#dev').value; d.config = $('#cfg').value; d.view = $('#view').value;
  $('#doc').value = pretty(d);
}

const options = sel => [...$(sel).options].map(o => o.value);

/** @returns true if the stage is being reloaded, in which case run() re-enters. */
async function retarget(d) {
  if (d.device && d.device !== $('#dev').value) {
    if (!options('#dev').includes(d.device)) {
      say('#docmsg', `no such device: ${d.device}`, 'bad');
      return false;
    }
    $('#dev').value = d.device;
    await loadDevice(d.device, d);
    return true;
  }
  let moved = false;
  for (const [key, sel] of [['config', '#cfg'], ['view', '#view']])
    if (d[key] && d[key] !== $(sel).value && options(sel).includes(d[key])) {
      $(sel).value = d[key];
      moved = true;
    }
  if (moved) await loadStage();
  return moved;
}

function fill(sel, values, chosen) {
  sel.innerHTML = values.map(v =>
    `<option value="${v}"${v === chosen ? ' selected' : ''}>${v}</option>`).join('');
}

async function loadStage() {
  const file = `${state.meta.device}.${$('#cfg').value}.${$('#view').value}.svg`;
  let txt;
  try { txt = await (await get(file)).text(); }
  catch (e) { $('#status').textContent = e.message; return; }
  const doc = new DOMParser().parseFromString(txt, 'image/svg+xml');
  $('#stage').innerHTML = '';
  state.svg = document.importNode(doc.documentElement, true);
  $('#stage').appendChild(state.svg);
  $('#status').textContent = `${state.svg.querySelectorAll('*').length} elements`;
  run();
}

// ---------------------------------------------------------------- apply

let timer = null;
function schedule() { clearTimeout(timer); timer = setTimeout(run, 180); }

async function run() {
  if (!state.svg) return;
  let parsed;
  try {
    parsed = JSON.parse($('#doc').value);
    say('#docmsg', '', '');
  } catch (e) {
    say('#docmsg', `not JSON: ${e.message}`, 'bad');
    return;
  }
  state.doc = parsed;
  if (await retarget(marks.normalise(parsed))) return;   // loadStage re-enters here
  const t0 = performance.now();
  const report = marks.apply(state.svg, parsed);
  const ms = Math.round(performance.now() - t0);
  const d = marks.normalise(parsed);
  $('#report').querySelector('tbody').innerHTML =
    `<tr><th></th><th>selector</th><th style="text-align:right">parts</th>
         <th style="text-align:right">raw</th></tr>` +
    (report.length ? report.map(r => {
      const m = d.marks[r.index];
      const chip = m.color
        ? `<span class="sw" style="background:${esc(m.color)}"></span>`
        : m.state ? `<span class="sw" style="border-color:${'#8d939a'}"></span>` : '';
      return `<tr><td>${chip}</td>
        <td class="sel">${esc(m.select)}${m.state ? ` <em style="color:#8d939a">→ state-${esc(m.state)}</em>` : ''}
        ${r.error ? `<div class="err">${esc(r.error)}</div>` : ''}
        ${r.warning ? `<div class="warn">${esc(r.warning)}</div>` : ''}
        ${r.states.length ? `<div class="note">states: ${r.states.map(esc).join(' ')}</div>` : ''}</td>
        <td class="n${r.count ? '' : ' zero'}">${r.count}</td>
        <td class="n" style="color:#8d939a">${r.total}</td></tr>`;
    }).join('') : '<tr><td colspan="4" class="note">no marks</td></tr>');
  say('#docmsg', `${report.length} mark(s) applied in ${ms} ms`, '');
  schedulePreview();
}

// The <img> is the only panel here that proves the Word case, so it is not left
// blank waiting for a button: every Apply rebuilds it. It is a whole export -
// clone, apply, flatten, serialise - so it trails the stage by its own debounce
// rather than running on the keystroke.
let shotTimer = null;
function schedulePreview() { clearTimeout(shotTimer); shotTimer = setTimeout(preview, 260); }

function preview() {
  if (!state.svg) return;
  try {
    const t0 = performance.now();
    const text = marks.toSvg(state.svg, state.doc);
    $('#shot').src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(text);
    $('#shotmeta').textContent =
      `${(new Blob([text]).size / 1024).toFixed(0)} KB, built in ` +
      `${Math.round(performance.now() - t0)} ms.`;
  } catch (e) {
    $('#shotmeta').textContent = `export failed: ${e.message || e}`;
  }
}

const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

function say(sel, text, cls) {
  const el = $(sel);
  el.textContent = text;
  el.className = `msg ${cls || ''}`.trim();
}

// ---------------------------------------------------------------- exports

function save(data, name, type) {
  const url = URL.createObjectURL(new Blob([data], {type}));
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

$('.btns').onclick = async ev => {
  const act = ev.target.dataset.act;
  if (!act || !state.svg) return;
  const buttons = [...document.querySelectorAll('.btns button')];
  buttons.forEach(b => { b.disabled = true; });
  try {
    if (act.startsWith('svg')) {
      const text = marks.toSvg(state.svg, state.doc);
      $('#shot').src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(text);
      const kb = (new Blob([text]).size / 1024).toFixed(0);
      if (act === 'svg-save') save(text, marks.filename(state.doc, 'svg'), 'image/svg+xml');
      else window.open(URL.createObjectURL(new Blob([text], {type: 'image/svg+xml'})), '_blank');
      say('#expmsg', `${marks.filename(state.doc, 'svg')} — ${kb} KB, ` +
        `${(text.match(/data-portrayal="/g) || []).length} added element(s)`, 'good');
    } else if (act.startsWith('png')) {
      const pxmm = +act.split('-')[1];
      const blob = await marks.toPng(state.svg, state.doc, pxmm);
      const bitmap = await createImageBitmap(blob);
      save(blob, marks.filename(state.doc, 'png'), 'image/png');
      say('#expmsg', `PNG ${bitmap.width}x${bitmap.height} at ${pxmm} px/mm — ` +
        `${(blob.size / 1024).toFixed(0)} KB`, 'good');
    } else if (act === 'hash') {
      const enc = marks.encode(state.doc);
      const url = `${location.origin}${location.pathname}#${enc}`;
      location.hash = enc;
      $('#hash').value = url;
      $('#hash').select();
      const ok = JSON.stringify(marks.decode(enc)) === JSON.stringify(marks.normalise(state.doc));
      say('#expmsg', `hash ${enc.length} chars, URL ${url.length} chars — ` +
        `round-trip ${ok ? 'exact' : 'FAILED'}`, ok ? 'good' : 'bad');
    }
  } catch (e) {
    say('#expmsg', `${act} failed: ${e.message || e}`, 'bad');
  } finally {
    buttons.forEach(b => { b.disabled = false; });
  }
};

// ---------------------------------------------------------------- self-check

$('#runtests').onclick = async () => {
  $('#runtests').disabled = true;
  const out = [];
  const t = async (name, fn) => {
    try { const r = await fn(); out.push(`${r === true ? '<span class="pass">pass</span>' :
      `<span class="fail">FAIL</span> ${r}`}  ${name}`); }
    catch (e) { out.push(`<span class="fail">THREW</span> ${name}: ${e.message}`); }
  };
  const svg = state.svg;
  // Selectors taken from the loaded drawing, not hardcoded: the checks have to
  // hold on any device and any view, and a rear face has no LEDs to speak of.
  const stateful = svg.querySelector('[data-states]');
  const nested = '[data-path]';

  await t('a malformed selector reports, does not throw', () => {
    const r = marks.apply(svg, {marks: [{select: 'not a ][ selector', color: '#f0f'},
                                        {select: nested, color: '#0f0'}]});
    marks.clear(svg);
    return (r[0].error && r[0].count === 0 && r[1].count > 0) || JSON.stringify(r);
  });
  await t('clear() restores the document byte for byte', () => {
    marks.clear(svg);
    const before = svg.outerHTML;
    marks.apply(svg, SAMPLE);
    marks.clear(svg);
    return svg.outerHTML === before || `${svg.outerHTML.length} vs ${before.length}`;
  });
  await t('a state a chip set is restored by clear()', () => {
    if (!stateful) return 'no [data-states] in this view';
    marks.clear(svg);
    const sel = `[data-path='${stateful.getAttribute('data-path')}']`;
    stateful.classList.add('state-ok');
    marks.apply(svg, {marks: [{select: sel, state: 'fault'}]});
    const during = stateful.classList.contains('state-fault') &&
                   !stateful.classList.contains('state-ok');
    marks.clear(svg);
    const after = stateful.classList.contains('state-ok') &&
                  !stateful.classList.contains('state-fault');
    stateful.classList.remove('state-ok');
    return (during && after) || `during=${during} after=${after}`;
  });
  await t('nested matches collapse to the outermost part', () => {
    const r = marks.apply(svg, {marks: [{select: nested, color: '#f0f'}]})[0];
    marks.clear(svg);
    return r.count < r.total || `count ${r.count} total ${r.total}`;
  });
  await t('encode/decode round-trips exactly', () => {
    const back = marks.decode(marks.encode(SAMPLE));
    return JSON.stringify(back) === JSON.stringify(marks.normalise(SAMPLE)) ||
      JSON.stringify(back);
  });
  await t('decode survives rubbish', () =>
    (marks.decode('m1.@@@@') === null && marks.decode('') === null &&
     marks.decode('nonsense') === null) || 'returned something');
  await t('a ten-mark document fits a URL', () => {
    const ten = {...SAMPLE, marks: Array.from({length: 10}, (_, i) => ({
      select: `[data-path='port-${i}']`, color: '#ff2d95', label: `uplink ${i} to spine-${i}`}))};
    const enc = marks.encode(ten);
    out.push(`      ten marks: hash ${enc.length} chars, ` +
      `raw JSON ${JSON.stringify(marks.normalise(ten)).length}`);
    return enc.length < 2000 || `${enc.length} chars`;
  });
  await t('the export carries no var() and no external reference', () => {
    const text = marks.toSvg(svg, SAMPLE);
    const bad = [];
    if (/var\(--/.test(text)) bad.push('var(--…)');
    if (/<script/i.test(text)) bad.push('<script>');
    if (/xlink:href="(?!#)/.test(text) || /\shref="https?:/.test(text)) bad.push('external href');
    if (/<\?xml-stylesheet/.test(text)) bad.push('xml-stylesheet');
    return bad.length === 0 || bad.join(', ');
  });
  await t('the export is well-formed XML', () => {
    const text = marks.toSvg(svg, SAMPLE);
    const p = new DOMParser().parseFromString(text, 'image/svg+xml');
    return !p.querySelector('parsererror') ||
      p.querySelector('parsererror').textContent.slice(0, 120);
  });
  await t('the legend grows the viewBox and clear() shrinks it back', () => {
    marks.clear(svg);
    const before = svg.getAttribute('viewBox');
    marks.apply(svg, SAMPLE);
    const during = svg.getAttribute('viewBox');
    marks.clear(svg);
    return (during !== before && svg.getAttribute('viewBox') === before) ||
      `${before} → ${during} → ${svg.getAttribute('viewBox')}`;
  });

  // A legend item is as wide as its label, and a long one widens the strip past
  // the drawing - which grows the root's width as well as its viewBox. This is
  // the regression test for restoring two of those three and calling it done:
  // the viewBox looked right and the drawing printed at nearly double size.
  await t('a legend wider than the drawing is undone by clear()', () => {
    marks.clear(svg);
    const before = svg.outerHTML, w0 = parseFloat(svg.getAttribute('width'));
    marks.apply(svg, {legend: true, marks: [{select: nested, color: '#0ff',
      label: 'x'.repeat(400)}]});
    const grew = parseFloat(svg.getAttribute('width')) > w0;
    marks.clear(svg);
    return (grew && svg.outerHTML === before) ||
      `grew=${grew} restored=${svg.outerHTML === before} width=${svg.getAttribute('width')}`;
  });
  // Two marks over one element - a broad rule, then a narrow exception - used to
  // have the second stash the first's state class as if a user had set it, and
  // clear() handed it back. A document must leave nothing behind.
  await t('overlapping state marks leave nothing behind', () => {
    marks.clear(svg);
    const el = svg.querySelector(nested);
    const sel = `[data-path='${el.getAttribute('data-path')}']`;
    const before = el.getAttribute('class') || '';
    marks.apply(svg, {marks: [{select: sel, state: 'off'}, {select: sel, state: 'fault'}]});
    const during = [...el.classList].filter(c => c.startsWith('state-'));
    marks.clear(svg);
    return (during.length === 1 && during[0] === 'state-fault' &&
            (el.getAttribute('class') || '') === before) ||
      `during=${during} after=${el.getAttribute('class')}`;
  });
  // The stylesheet paints state-locate whether or not the part has such a state,
  // so nothing downstream would notice. The mark is still applied - the warning
  // is advice, not a veto.
  await t('a state no match declares warns but still applies', () => {
    // Not `stateful`: several contracts still carry PROSE in data-states -
    // "Blue = all lanes linked, Red = not all lanes linked" - and the module
    // drops those rather than mining words out of them, so they declare nothing.
    const prose = [...svg.querySelectorAll('[data-states]')]
      .filter(e => e.getAttribute('data-states').includes('='));
    if (prose.length) out.push(`      note: ${prose.length} element(s) here carry ` +
      `prose in data-states, e.g. "${prose[0].getAttribute('data-states')}"`);
    const el = [...svg.querySelectorAll('[data-states][data-path]')]
      .find(e => !e.getAttribute('data-states').includes('='));
    if (!el) return 'no tokenised [data-states] in this view';
    marks.clear(svg);
    const declared = el.getAttribute('data-states').split(/[\s,]+/);
    const odd = ['locate', 'fault', 'ok', 'absent'].find(s => !declared.includes(s));
    const r = marks.apply(svg, {marks: [
      {select: `[data-path='${el.getAttribute('data-path')}']`, state: odd}]})[0];
    marks.clear(svg);
    return (r.warning && !r.error && r.count > 0) ||
      `warning=${r.warning} error=${r.error} count=${r.count}`;
  });
  // px/mm is a claim about print resolution, and a data URL that decodes to the
  // wrong size would satisfy every other check here.
  // A crop is a field of the document, so it has to survive the URL and it has
  // to be what the export is actually cut to - the two are the same promise.
  await t('a crop round-trips through the URL and cuts the export', () => {
    marks.clear(svg);
    const vb = svg.getAttribute('viewBox').split(/[\s,]+/).map(Number);
    const c = {x: vb[0] + vb[2] / 4, y: vb[1], w: vb[2] / 2, h: vb[3] / 2};
    const d = {...SAMPLE, legend: false, crop: c};
    const back = marks.decode(marks.encode(d)).crop;
    const box = new DOMParser().parseFromString(marks.toSvg(svg, d), 'image/svg+xml')
      .documentElement.getAttribute('viewBox').split(/[\s,]+/).map(Number);
    const want = [c.x, c.y, c.w, c.h].map(n => Math.round(n * 1000) / 1000);
    return (JSON.stringify(back) === JSON.stringify({x: want[0], y: want[1], w: want[2], h: want[3]}) &&
            JSON.stringify(box) === JSON.stringify(want)) ||
      `url=${JSON.stringify(back)} export=${box.join(' ')} wanted ${want.join(' ')}`;
  });
  // A crop that misses the drawing is not a crop of nothing; and a document
  // with no crop must export exactly as it did before crops existed.
  // A crop the document carries but the drawing does not contain is dropped at
  // the drawing, not at the parser: normalise() keeps what it was given, because
  // a document written against the rear view is not rubbish, it is just not
  // about this picture. What it must never do is silently cut the export.
  await t('a crop off the drawing is dropped, and no crop changes nothing', () => {
    marks.clear(svg);
    const off = {x: -9e4, y: -9e4, w: 10, h: 10};
    const kept = !!marks.normalise({crop: off}).crop;
    const dropped = marks.clampCrop(svg, off) === null;
    // the embedded markup differs by the crop itself; the drawing must not
    const bare = s => s.replace(/ data-portrayal-markup="[^"]*"/, '');
    const plain = bare(marks.toSvg(svg, {...SAMPLE, crop: null}));
    const same = bare(marks.toSvg(svg, {...SAMPLE, crop: off}));
    return (kept && dropped && plain === same && !/portrayal-crop/.test(plain)) ||
      `kept=${kept} dropped=${dropped} identical=${plain === same}`;
  });
  // A legend row for a mark that reached nothing is a claim about the drawing
  // that the drawing contradicts, in a file that outlives the page that made it.
  await t('a labelled mark that matches nothing takes no legend row', () => {
    marks.clear(svg);
    const rows = doc => {
      const built = marks.legend(svg, doc);
      return built ? built.g.querySelectorAll('text').length : 0;
    };
    const one = rows({marks: [{select: nested, color: '#0ff', label: 'real'}]});
    const two = rows({marks: [{select: nested, color: '#0ff', label: 'real'},
                              {select: "[data-path='no-such-part']", label: 'typo'}]});
    const none = rows({marks: [{select: "[data-path='no-such-part']", label: 'typo'}]});
    marks.clear(svg);
    return (one === 1 && two === 1 && none === 0) || `${one}, ${two}, ${none}`;
  });
  await t('toPng is exactly px/mm of the exported drawing', async () => {
    const vb = new DOMParser().parseFromString(marks.toSvg(svg, SAMPLE), 'image/svg+xml')
      .documentElement.getAttribute('viewBox').split(/[\s,]+/).map(Number);
    const bad = [];
    for (const px of [4, 8, 16]) {
      const bmp = await createImageBitmap(await marks.toPng(svg, SAMPLE, px));
      const want = [Math.round(vb[2] * px), Math.round(vb[3] * px)];
      out.push(`      ${px} px/mm: ${bmp.width}x${bmp.height}`);
      if (bmp.width !== want[0] || bmp.height !== want[1])
        bad.push(`${px}: ${bmp.width}x${bmp.height} wanted ${want.join('x')}`);
    }
    return bad.length === 0 || bad.join('; ');
  });

  $('#selftest').innerHTML = out.join('\n');
  $('#runtests').disabled = false;
  run();
};

// ---------------------------------------------------------------- wiring

$('#doc').addEventListener('input', schedule);
$('#reapply').onclick = run;
$('#clear').onclick = () => marks.clear(state.svg);
$('#cfg').onchange = () => { writeTarget(); loadStage(); };
$('#view').onchange = () => { writeTarget(); loadStage(); };
$('#dev').onchange = () => loadDevice($('#dev').value);

for (const b of document.querySelectorAll('.rules button')) {
  b.onclick = () => {
    const d = marks.normalise(JSON.parse($('#doc').value || '{}'));
    d.marks.push(JSON.parse(b.dataset.add));
    $('#doc').value = pretty(d);
    run();
  };
}

// One mark per line: a markup document is read as a list, and a pretty-printer
// that puts every field on its own line makes ten marks unreadable.
function pretty(doc) {
  const d = marks.normalise(doc);
  const rows = d.marks.map(m => '    ' + JSON.stringify(
    Object.fromEntries(Object.entries(m).filter(([, v]) => v))));
  return `{\n  "v": 1,\n  "device": ${JSON.stringify(d.device)},` +
    `\n  "config": ${JSON.stringify(d.config)},\n  "view": ${JSON.stringify(d.view)},` +
    `\n  "legend": ${d.legend},\n  "marks": [\n${rows.join(',\n')}\n  ]\n}`;
}

(async () => {
  try { await boot(); }
  catch (e) { $('#status').textContent = e.message; say('#docmsg', e.message, 'bad'); }
})();

async function boot() {
  const idx = await j('devices.json');
  const fromHash = marks.decode(location.hash);
  const start = fromHash || SAMPLE;
  fill($('#dev'), idx.devices.map(d => d.name), start.device || 'as7946-30xb');
  $('#doc').value = pretty(start);
  state.meta = await j(`${$('#dev').value}.configs.json`);
  fill($('#cfg'), state.meta.configs.map(c => c.name),
       start.config || state.meta.default);
  fill($('#view'), state.meta.views, start.view || state.meta.views[0]);
  await loadStage();
}
</script>
