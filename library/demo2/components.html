<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portrayal — component browser</title>
<link rel="icon" type="image/png" href="portrayal.png">
<style>
  body { font-family: system-ui, sans-serif; background: #16181b; color: #d7dbdf; margin: 0.8rem 1.2rem; }
  .hdr { display: flex; gap: 0.9rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.8rem; }
  h1 { font-size: 1rem; margin: 0; }
  input, select { background: #2b2f33; color: #d7dbdf; border: 1px solid #4a4f55; border-radius: 6px; padding: 0.25rem 0.5rem; font-size: 0.8rem; }
  .hdr label { font-size: 0.8rem; color: #9aa1a8; display: flex; gap: 0.4rem; align-items: center; }
  #grid { display: flex; flex-wrap: wrap; gap: 0.9rem; }
  .card { border: 1px solid #33373c; border-radius: 10px; padding: 0.7rem 0.8rem; background: #1a1d20; max-width: 340px; }
  .card h3 { margin: 0 0 0.1rem; font-size: 0.88rem; font-family: ui-monospace, monospace; }
  .meta { font-size: 0.72rem; color: #9aa1a8; margin-bottom: 0.45rem; }
  .meta .std { color: #f5c542; }
  .stage { background-color: #dfe3e6;
           background-image: linear-gradient(#c9cdd1 1px, transparent 1px), linear-gradient(90deg, #c9cdd1 1px, transparent 1px);
           border-radius: 6px; padding: 6px; display: inline-block; }
  .stage img { display: block; }
  .skinrow { margin-top: 0.4rem; font-size: 0.72rem; display: flex; gap: 0.5rem; align-items: center; color: #9aa1a8; }
  .desc { font-size: 0.72rem; color: #7d848b; margin-top: 0.4rem; max-width: 320px; }
</style>
</head>
<body>
<div class="hdr">
  <h1>Component browser</h1>
  <label>Search <input id="q" placeholder="rj45, port, sff…" size="16"></label>
  <label>Namespace <select id="ns"><option value="">all</option></select></label>
  <label>Zoom <input id="zoom" type="range" min="2" max="14" value="6"> <span id="zl">6 px/mm</span></label>
  <span style="font-size:0.72rem;color:#565d64">grid = 1 mm · gold = standards-registry conformant</span>
</div>
<div id="grid"></div>
<script type="module">
import { jdist } from '../viewer/dist.js';
let DATA = [];
const $ = id => document.getElementById(id);
function render() {
  const q = $('q').value.toLowerCase();
  const ns = $('ns').value;
  const z = +$('zoom').value;
  $('zl').textContent = `${z} px/mm`;
  const grid = $('grid');
  grid.innerHTML = '';
  DATA.filter(c => (!ns || c.ns === ns) &&
      (!q || `${c.ns}/${c.name} ${c.class} ${c.conforms || ''} ${c.description}`.toLowerCase().includes(q)))
    .forEach(c => {
      const card = document.createElement('div');
      card.className = 'card';
      const std = c.conforms ? ` <span class="std">⛭ ${c.conforms}</span>` : '';
      card.innerHTML = `<h3>${c.ns}/${c.name}@${c.major.slice(1)} <span style="color:#565d64">${c.version}</span></h3>
        <div class="meta">${c.kind} · ${c.class} · ${c.size.w}×${c.size.h} mm${std}</div>`;
      const stage = document.createElement('div');
      stage.className = 'stage';
      stage.style.backgroundSize = `${z}px ${z}px`;
      const img = document.createElement('img');
      img.width = c.size.w * z; img.height = c.size.h * z;
      const skins = Object.keys(c.files);
      img.src = '../dist/' + c.files[skins[0]];
      stage.appendChild(img);
      card.appendChild(stage);
      if (skins.length > 1) {
        const row = document.createElement('div');
        row.className = 'skinrow';
        row.textContent = 'skin: ';
        const sel = document.createElement('select');
        skins.forEach(sk => { const o = document.createElement('option'); o.value = sk; o.textContent = sk; sel.appendChild(o); });
        sel.onchange = () => { img.src = '../dist/' + c.files[sel.value]; };
        row.appendChild(sel);
        card.appendChild(row);
      }
      const d = document.createElement('div');
      d.className = 'desc';
      d.textContent = c.description;
      card.appendChild(d);
      const l3d = document.createElement('a');
      // v2's 3D is a stage inside the Explorer and is device-scoped, so a lone
      // component still opens in the frozen v1 page. When viewer3d.js grows a
      // component mode this becomes an internal link.
      l3d.href = `../demo/3d.html?component=${c.ns}/${c.name}@${c.major.slice(1)}`;
      l3d.target = '_blank';
      l3d.textContent = 'view in 3D →';
      l3d.style.cssText = 'font-size:0.72rem;color:#f5c542;display:inline-block;margin-top:0.3rem';
      card.appendChild(l3d);
      grid.appendChild(card);
    });
}
(async () => {
  const idx = await jdist('../dist/components.json');
  DATA = idx.components.sort((a, b) => (a.ns + a.name).localeCompare(b.ns + b.name));
  [...new Set(DATA.map(c => c.ns))].forEach(ns => {
    const o = document.createElement('option'); o.value = ns; o.textContent = ns; $('ns').appendChild(o);
  });
  ['q', 'ns', 'zoom'].forEach(id => $(id).addEventListener('input', render));
  render();
})();
</script>
</body>
</html>
