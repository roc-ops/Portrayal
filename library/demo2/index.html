<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portrayal</title>
<style>
  body { font-family: system-ui, sans-serif; background: #16181b; color: #d7dbdf; margin: 0; }
  nav { display: flex; gap: 0.25rem; align-items: flex-end;
        padding: 0.6rem 1rem 0; background: #101214; border-bottom: 1px solid #33373c; }
  nav .devpick { margin: 0 0.9rem 0.35rem 0; }
  nav button { background: #1c1f23; color: #9aa1a8; border: 1px solid #33373c; border-bottom: none;
               border-radius: 8px 8px 0 0; padding: 0.5rem 1.2rem; cursor: pointer; font-size: 0.95rem; }
  nav button.active { background: #16181b; color: #f0f2f4; border-color: #4a4f55; }
  iframe { width: 100%; border: none; display: block; height: calc(100vh - 46px); }
  #gap { display: none; padding: 3rem; color: #8d939a; font-size: 0.85rem; line-height: 1.6; }
  #gap code { color: #d7dbdf; }
</style>
</head>
<body>
<nav>
  <span id="pick"></span>
  <button data-src="explore.html" class="active">Explorer</button>
  <button data-src="annotate.html">Annotate</button>
  <button data-src="components.html">Components</button>
  <button data-src="exporter.html">Exporter</button>
</nav>
<iframe id="frame"></iframe>
<div id="gap"></div>
<script type="module">
import { createDevicePicker } from './devsel.js';

let DEV = new URLSearchParams(location.search).get('device') || 'as7726-32x';
// Build stamp appended to every iframe URL. A hard refresh bypasses the cache for
// the document it reloads, but this shell navigates the iframe from JS afterwards,
// and that is a fresh navigation which goes through the normal HTTP cache - so a
// stale page survived reload after reload. Versioning the URL makes each deploy
// a distinct cache key. Data fetches already use cache:'no-store'.
let VER = '';
const frame = document.getElementById('frame');
const gap = document.getElementById('gap');

async function nav(src) {
  // Annotate lands after marks.js does. An iframe pointed at a missing file shows
  // the server's 404 page, which reads like a broken demo rather than an unbuilt
  // tab, so ask first and say what is missing.
  const here = (await fetch(src, {method: 'HEAD', cache: 'no-store'}).catch(() => null))?.ok;
  frame.style.display = here ? '' : 'none';
  gap.style.display = here ? 'none' : 'block';
  if (!here) {
    gap.innerHTML = `<b>${src}</b> is not built yet.<br><br>` +
      `The markup document lives in <code>marks.js</code>, and the Annotate tab is ` +
      `wired up from <code>shell.js</code> and <code>marks.js</code> once both have landed.`;
    return;
  }
  frame.src = `${src}?device=${encodeURIComponent(DEV)}` + (VER ? `&v=${VER}` : '');
}

const current = () => document.querySelector('nav button.active').dataset.src;
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  nav(b.dataset.src);
});

// There used to be a second device menu inside every tab, kept in step with this
// one by a postMessage handshake. Two controls for one piece of state is one
// too many however carefully they are synchronised, so the division is now by
// what the state is *about*: this shell owns which device you are looking at,
// and a tab owns how you are looking at it - config, view, 2D/3D, colour, fit.
// The tabs still render their own picker when opened directly; they hide it
// when embedded here.

(async () => {
  const res = await fetch('../dist/devices.json', {cache: 'no-store'});
  // Last-Modified changes on every deploy, so it works as a build stamp for free
  VER = (res.headers.get('Last-Modified') || '').replace(/\W/g, '');
  const d = (await res.json()).devices;
  if (!d.some(x => x.name === DEV)) DEV = d[0].name;
  createDevicePicker({
    mount: document.getElementById('pick'), devices: d, value: DEV,
    onchange: name => { DEV = name; nav(current()); },
  });
  nav(current());
})();
</script>
</body>
</html>
