format: 1
kind: device
name: fx4-vertical-air-intake-tray
version: 0.1.0
maturity: modelled
manufacturer: Nokia
model: 7360 ISAM FX-4 vertical shelf mount kit, air intake baffle and drip tray
aliases:
- {name: 3FE 65787 AA, kind: vendor, note: "one of the two numbers Table 1 lists for the pre-assembly of the shelf horizontal mounting bracket and this tray; the other, 3FE 65751 AA, is also listed in the FX-8 kit with the same bracket size, so it reads as the bracket's"}
description: >-
  The air intake baffle/drip tray of the 7360 ISAM FX-4 vertical shelf mount kit. It hangs under
  a vertically mounted shelf and takes two rack units of the elevation. A vertical mount needs one
  under every shelf, the bottom one included.
profile: passive
provenance:
  chassis:
    confidence: datasheet
    note: >-
      Nokia 7360 ISAM FX-4 Vertical shelf mount kit unit data sheet (3FE 67299 BAAA TQZZA
      Edition 01), Table 3: the tray is 88.14 mm high, 218.59 mm wide and 251.97 mm long. Read
      as height up the rack, width across it (the sheet's Width column, 218.59) and depth (the
      sheet's Length column, 251.97). The depth is the FX-8 tray's depth too (251.97), and 218.59
      sits 3.3 mm under the 221.9 mm the shelf stands across the opening, as the FX-8 tray's
      350.01 sits 5 mm under its 355 mm shelf. Figure 144 of the 7360 ISAM FX ANSI Hardware
      Installation Manual (3HH-12893-AAAA-TCZZA Issue 29) draws the tray about as wide as the
      shelf. Which size lies across is a reading, not a printed fact.
  units:
    confidence: drawing
    note: >-
      two rack units, read from Figure 144 of the installation manual, where the tray fills the
      two units under the shelf and the next shelf's tray stands 15 units above it; 88.14 mm is
      1.983 units. No table prints the units.
  color:
    confidence: estimated
    note: >-
      the held figures are line art and no photograph is held, so the colour is a neutral metal
      grey and is not a reading.
  parts:
    confidence: datasheet
    note: >-
      the tray comes pre-assembled with the shelf horizontal mounting bracket (25.40 mm high,
      486.41 mm long, Table 3), which the installation manual's step 5 of Procedure 53 fixes to the
      rack; the bracket is not drawn apart from the shelf it carries.
  ears:
    confidence: drawing
    note: >-
      no ears. Figure 144 of the installation manual (printed page 258) draws the tray as an open
      box between the posts, with no ear, flange or bolt to a post. It hangs under the shelf's
      bracket.
