format: 1
kind: device
name: 3fe54221ah
version: 0.1.0
maturity: modelled
manufacturer: Nokia
model: Outdoor ONT enclosure 3FE54221AH
aliases:
  - {name: 3FE54221AC, kind: variant, note: 'a sibling ordering variant, lettered Alcatel-Lucent Outdoor U-ONT Enclosure; photographs of it show the same shell, and no document held says how AC and AH differ'}
description: >-
  Wall-mounted outdoor housing for one single-family-unit ONT - a grey moulded frame with a
  gasketed door hinged on the left and a security latch on the right. Inside, two turn
  retainers hold the ONT against the frame's ribs beside fibre slack spools, an SC connector
  holder and a four-line telephone protector block; two grommeted cable entries open through
  the bottom. It carries no electronics of its own. The XS-010XR-P Product Guide lists it as
  that ONT's outdoor accessory.
profile: optical
provenance:
  sources:
    confidence: drawing
    note: >-
      Nokia ONT XS-010XR-P Product Guide, 3TN-00113-AAAA-TCZZA Issue 4, an installation guide
      for the ONT that draws this housing: Table 4-3 p34 names it (Outdoor enclosure,
      3FE54221AH, with a Phoenix connector and a Molex to Phoenix power cable adapter), Figure
      5-10 p54 draws it closed, Figure 5-11 p55 open and empty, Figure 5-13 p57 with the ONT
      seated. All three are vector line art, read at 600 dpi. Five reseller photographs of the
      sibling 3FE54221AC, 5120 px, all taken at an angle: construction and colour only. No
      datasheet or drawing that dimensions the housing was found.
  chassis:
    confidence: estimated
    note: >-
      NO DOCUMENT HELD STATES A SIZE; width and height are measured against the ONT in Figure
      5-13 and are estimates. METHOD: the ONT in that figure is 208 x 142 mm (Product Guide
      Table 4-8) and its outline measures 1689 x 1168 px, which gives 8.12 px/mm down and 8.23
      across - the figure is orthographic to 1.3 percent - and 8.17 px/mm is used for both.
      At that scale the housing is 304 mm across from the hinge pins to the latch tab (2486
      px; the frame alone 274 mm) and 335 mm from the crest of the frame to the foot of the
      bottom mounting tab (2736 px; the frame alone 323 mm). Figure 5-10, scaled by the same
      frame width, gives 304 and 337 with the door shut. Carried: 304 x 336. ERROR: 0.65
      percent of scale either way plus about 1.5 mm of edge picking, so plus or minus 3.5 mm
      on the width and 4 mm on the height. A CANDIDATE WAS TESTED AND NOT ADOPTED: the
      Alcatel-Lucent 7302 ISAM Information Manual 3FE 55873 AAAA TCZZA, Table 28-7 p1042,
      gives 13.5 x 12 x 4.3 in (343 x 305 x 109 mm) for an I-211M-L ONT within an outdoor
      enclosure, without naming the enclosure. Its width agrees with the measurement to 0.3
      percent; its height is 7 mm (2 percent) more than either figure gives, outside the
      error. The disagreement is recorded as a gap. DEPTH cannot be measured from a front
      elevation and the photographs are angled; 109 mm is that candidate's figure, carried as
      an estimate because nothing else gives one.
  front-layout:
    confidence: drawing
    note: >-
      Product Guide Figure 5-10 p54, the housing closed, at 5.80 px/mm from the 274 mm frame.
      The door fills the frame; a crease runs across it about 98 mm down; a recessed label
      panel 107 x 126 mm sits in its lower right. Two hinge knuckle groups on the left stand
      10.9 mm outside the frame. The latch tab on the right stands 19.3 mm outside it, about
      123 to 218 mm down, lettered TELCO, with the pin-in-hex security screw, a second
      fastener and a padlock hole below. The arched top and bowed bottom of the door are
      drawn as a rounded rectangle.
  interior:
    confidence: drawing
    note: >-
      Product Guide Figures 5-11 p55 and 5-13 p57, door open, at 8.17 px/mm. The ONT stands
      upright, 142 across by 208 tall, its top face outwards and its lamps down its left
      side, 29 to 172 mm across and 50 to 257 mm down, between a retainer above and one
      below; its ports face right towards the fibre spools. Two slack spools about 60 mm
      across, an SC connector holder under the top mounting tab, a four-position line
      protector block (Figure 5-11: cable assembly multipair) at the right, grommets over the
      two cable entries at the bottom, and a mounting tab top and bottom on the centre line.
      The figure and the text disagree about the side: step 4 says to place the ONT on the
      right side of the enclosure and both figures draw it on the left; the figures are
      followed. The door, which swings out to the left, is not drawn.
  ont-seat:
    confidence: drawing
    note: >-
      The ONT is a device of its own (nokia/xs-010xr-p) and a bay accepts components, not
      devices, so it is not seated here: the place it occupies is drawn as an outline and
      declared as a region. The guide calls the housing a universal outdoor ONT enclosure;
      which other ONTs it takes is not stated in anything held.
  bottom-layout:
    confidence: estimated
    note: >-
      The two cable entries are centred 62 and 247 mm across the front (Figure 5-13, grommet
      centres); the photographs of 3FE54221AC show each as a round port of roughly 40 mm at
      the split between frame and door. Their size and their position front to back are read
      by eye from angled photographs.
  colours:
    confidence: estimated
    note: >-
      From two photographs of the sibling 3FE54221AC by counting pixels: the door reads
      #8d8e8e (median of 501,120 px) in one and #909091 (574,464 px) in the other - a mid grey
      under studio light, carried as #8e8f8f. The grommets are black.
  rating:
    confidence: drawing
    note: >-
      The guide's sample safety label (Figure 3-1 p25 and the table on p24) reads Type 3R
      enclosure - Rainproof, under UL and TUV. No table rates 3FE54221AH by part number, and
      the data sheet says only that the ONT in the enclosure withstands 55 C outside; the
      guide's Table 4-10 says 58 C.
attrs:
  physical:
    mounting: wall, at least 1.5 m above the floor
    material: moulded grey plastic, gasketed door
  environmental:
    enclosure-rating: Type 3R, rainproof (the guide's sample safety label)
    operating-temp: -40 to 58 C outside the enclosure, with an XS-010XR-P inside
  features:
    houses: one single-family-unit ONT (nokia/xs-010xr-p), held by two turn retainers
    cable-entries: two grommeted entries through the bottom
    included: Phoenix connector 1AB111430003 and Molex to Phoenix power cable adapter 3MV00342AA
  lifecycle:
    eol: none-announced
chassis:
  width: 304.0
  height: 336.0
  depth: 109.0
  mount: wall
  color: '#8e8f8f'
  edge: '#6c6e70'
  silk: '#2b2d30'
gaps:
  - what: dimensions
    reason: sources-disagree
    note: >-
      Measured against the 208 x 142 mm ONT in Product Guide Figure 5-13: 304 mm wide over
      hinge and latch, 335 to 337 mm tall over the bottom mounting tab, plus or minus about 4
      mm. The Alcatel-Lucent 7302 ISAM Information Manual 3FE 55873 AAAA TCZZA Table 28-7
      p1042 prints 343 x 305 x 109 mm for an I-211M-L ONT within an outdoor enclosure it does
      not name. Width agrees; height differs by 7 mm; depth is from that table alone and is
      untested. The manifest carries the measured width and height and the table's depth.
    wanted: a Nokia drawing or data sheet that dimensions 3FE54221, or a tape on a unit
  - what: variant-difference
    reason: vendor-silent
    note: >-
      The guide names 3FE54221AH (customer-specific); the photographs held are of 3FE54221AC.
      Nothing held explains the suffix. The AC photographs show different retainers from the
      guide's figures.
    wanted: the 3FE54221 variant table
  - what: side-and-rear-faces
    scope: [left, right, rear, top]
    reason: needs-photo
    note: >-
      The guide draws the housing from the front only. The photographs are three-quarter
      views of a unit lying on a table; none is square-on to a side, the top or the back.
    wanted: square-on photographs or drawings of the four faces
  - what: cable-entry-size
    scope: [bottom]
    reason: needs-drawing
    note: the two entries are sized and placed front to back by eye from angled photographs
    wanted: a bottom view with dimensions
  - what: compatible-onts
    reason: vendor-silent
    note: >-
      Called a universal outdoor ONT enclosure; only the XS-010XR-P guide was read for it and
      no compatibility list is held.
    wanted: the list of ONTs Nokia qualifies in 3FE54221AH
