gaps:
- what: rear-face
  scope: [rear]
  reason: needs-drawing
  note: >-
    No rear view exists in the UDS, the USIM or the data sheet. UDS Figure 4 shows the six
    BATRET/FG fast-on pairs from the front, on the inner face of the backpanel; nothing shows the
    outside of the back.
  wanted: a photograph or drawing of the shelf's rear face
- what: side-faces
  scope: [left, right, bottom]
  reason: needs-drawing
  note: >-
    The left side's perforated field is placed by eye from perspective renders; the right side
    (the air intake) and the underside appear in no image held. UDS chapter 15 says the bottom
    dust filter assembly is fixed to "four screw holes in the bottom of the shelf" by four
    captive screws and three magnets, but their positions are not drawn.
  wanted: side and underside elevations or photographs
- what: hybrid-slot-legend
  scope: [lt-1, lt-2]
  reason: sources-disagree
  note: >-
    UDS Figure 1 and s2.4.1 label the two hybrid slots "NTIO 1 / LT 1" and "NTIO 2 / LT 2"; the
    data sheet render prints "LT 1" and "LT 2". The UDS wording is printed here.
  wanted: a photograph of the legend strip of a delivered shelf
- what: right-flange-slots
  scope: [front]
  reason: sources-disagree
  note: >-
    UDS Figures 1 and 6 draw the right flange's four mounting slots open to the outer edge; the
    data sheet render draws them as closed oblong slots like the left flange's. Drawn closed.
  wanted: a photograph of the right flange
- what: cover-hook
  scope: [front]
  reason: needs-photo
  note: >-
    The cover hook is absent from the data sheet render and is taken from UDS Figure 1 at about
    2.2 px/mm; its shape is a bracket with a dark receptacle and two screws, no more than that.
  wanted: a close photograph of the left flange
- what: shelf-power
  scope: [power-slots]
  reason: vendor-silent
  note: >-
    No document held gives a power envelope for the whole shelf; USIM Table 21 gives figures per
    unit, and the LPWR-F rating is a current (80 A or 100 A), not a wattage.
  wanted: a shelf-level maximum power or heat dissipation figure
- what: line-cards
  scope: [lt-slots]
  reason: needs-drawing
  note: >-
    USIM Table 5 lists LGLT-D, LLLT-A and LLLT-B as LT boards for this shelf beside LWLT-C; they
    are not modelled and not accepted yet.
  wanted: the three boards modelled from UDS chapters 7, 9 and 10
groups:
  lt-slots:
    term: Slot
    role: traffic
    index-origin: 1
    description: >-
      the eight LT (line termination) slots, 24.5 mm pitch, LT 1 at the bottom of the block to LT
      8 at the top (UDS Figure 3). LT 1 and LT 2 are the hybrid NTIO / LT slots; no NTIO board
      exists in this release (UDS s2.4.1 Note 4)
  nt-slots:
    term: Slot
    role: service
    index-origin: 1
    description: NT A (rel-pos 1) and NT B (rel-pos 2), the two network-termination slots, 35 mm pitch
    attrs:
      redundancy: '1+1'
      redundancy-note: 'UDS s2.4.1 Note 1: the two NT boards provide NT redundancy to the shelf; one NT is the minimum. USIM s2.2.1.3 A: active/active data plane, active/standby control plane'
  alarm-slot:
    term: Slot
    role: service
    index-origin: 1
    description: the alarm module slot (ALM) under NT A, 24.5 mm pitch
  power-slots:
    term: Slot
    role: service
    index-origin: 1
    description: the two half-width power module slots along the bottom, PWR 1 at the left
    attrs:
      redundancy: '1+1'
      redundancy-note: 'UDS s2.4.1: two (redundant) power modules, "The two power modules provide power redundancy to the shelf"; s2.6: the shelf is fed from the active one'
  fans:
    term: Fan
    role: service
    index-origin: 1
    description: the single, unlabelled fan module slot at the left; six blowers in one module
  grounding:
    term: Point
    role: furniture
    index-origin: 1
    description: the dual-stud chassis grounding point and the ESD point on the left flange
  covers:
    term: Cover
    role: furniture
    index-origin: 1
    description: the front cover of the horizontal mounting and front cover kits
