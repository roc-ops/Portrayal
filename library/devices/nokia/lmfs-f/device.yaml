configurations:
  base:
    kind: base
    default: true
    source: >-
      SOURCED: the shelf kit of UDS chapter 3, Table 4 (p24) - one LMFS-F, one LFAN-F, two LPWR-F
      and one LALM-F - with the dummy boards the installation manual requires in every unused
      slot. The kit ships without boards, so this base has no NT.
    description: >-
      The Lightspan MF-8 shelf kit as shipped: the fan module, the alarm module and two power
      modules fitted, and a dummy/filler board in each of the eight LT and two NT slots. This is
      the AA kit, with two 80 A power modules; the AB kit is the `kit-ab` configuration.
    part-numbers:
      LMFS-F AA kit: {part: 3FE 79747 AA}
    bays:
      lt-8: nokia/lmdb-b-ea@1
      lt-7: nokia/lmdb-b-ea@1
      lt-6: nokia/lmdb-b-ea@1
      lt-5: nokia/lmdb-b-ea@1
      lt-4: nokia/lmdb-b-ea@1
      lt-3: nokia/lmdb-b-ea@1
      lt-2: nokia/lmdb-b-ea@1
      lt-1: nokia/lmdb-b-ea@1
      nt-b: nokia/lmdb-e-ba@1
      nt-a: nokia/lmdb-e-ba@1
  kit-ab:
    kind: orderable
    description: >-
      The Lightspan MF-8 shelf kit with the high-capacity feed, 3FE 79747 AB: the base kit
      with two 100 A power modules (LPWR-F AB, breaker marker "2X 50A") in place of the 80 A
      ones.
    part-numbers:
      LMFS-F AB kit: {part: 3FE 79747 AB}
    bays:
      lt-8: nokia/lmdb-b-ea@1
      lt-7: nokia/lmdb-b-ea@1
      lt-6: nokia/lmdb-b-ea@1
      lt-5: nokia/lmdb-b-ea@1
      lt-4: nokia/lmdb-b-ea@1
      lt-3: nokia/lmdb-b-ea@1
      lt-2: nokia/lmdb-b-ea@1
      lt-1: nokia/lmdb-b-ea@1
      nt-b: nokia/lmdb-e-ba@1
      nt-a: nokia/lmdb-e-ba@1
    bay-attrs:
      pwr-1: {rating: 2X 50A}
      pwr-2: {rating: 2X 50A}
  empty-shelf:
    kind: orderable
    description: >-
      The empty shelf LMFS-F, 3FE 79748 AA, as delivered: "without any module or board" (UDS
      s2.4), every slot open onto the backpanel.
    part-numbers:
      LMFS-F: {part: 3FE 79748 AA}
    bays:
      lt-8: ''
      lt-7: ''
      lt-6: ''
      lt-5: ''
      lt-4: ''
      lt-3: ''
      lt-2: ''
      lt-1: ''
      nt-b: ''
      nt-a: ''
      alm: ''
      pwr-1: ''
      pwr-2: ''
      fan: ''
  populated:
    kind: example
    description: >-
      The fully populated shelf of the data sheet's front render: eight LWLT-C multi-PON line
      boards and two LBNT-A NT boards, with the kit's fan, alarm and power modules.
    bays:
      lt-8: nokia/lwlt-c@1
      lt-7: nokia/lwlt-c@1
      lt-6: nokia/lwlt-c@1
      lt-5: nokia/lwlt-c@1
      lt-4: nokia/lwlt-c@1
      lt-3: nokia/lwlt-c@1
      lt-2: nokia/lwlt-c@1
      lt-1: nokia/lwlt-c@1
      nt-b: nokia/lbnt-a@1
      nt-a: nokia/lbnt-a@1
  front-cover:
    kind: example
    description: >-
      The shelf kit with the horizontal front dust filter assembly hung on the cover hook, as the
      installation manual's Figure 35 shows a horizontally mounted shelf with its cover closed.
      The cover is mandatory for EMC and comes in the horizontal mounting and front cover kits.
