aliases:
- {name: LMFS-F, kind: vendor, note: 'the mnemonic of the empty shelf, 3FE 79748 AA, in the Unit Data Sheet guide and the installation manual'}
description: >-
  The Nokia Lightspan MF-8 (LMFS-F), an 8RU fibre access node (OLT) shelf of the Lightspan MF
  family, drawn as it mounts horizontally in a 19-inch rack. Eight line-termination (LT) boards
  and two network-termination (NT) boards lie horizontally in the slot area, LT 8 at the top down
  to LT 1, then NT B, NT A, the alarm module and, at the bottom, two half-width power modules
  side by side. The fan module stands in an unlabelled slot at the left and exhausts the air
  drawn across the boards from the open right side. The front face is drawn with its two
  mounting flanges, because the left flange carries the dual-stud grounding point, the hook for
  the front cover and the ESD point. The shelf is cabled entirely from the front.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Written first, before any number. UDS = Lightspan Access Node MF-8 Unit Data Sheet Guide
      26.9, 3HH-92646-AAAA-TQZZA Issue 09: chapters 2 to 4 (p13-32) the shelf and its two kits,
      Figures 1, 3, 4, 5 and 6; chapter 11 the fan module; chapters 15 and 16 the bottom and the
      vertical front dust filter assemblies. USIM = Lightspan Access Node MF-8 User, Safety and
      Installation Manual 26.9, 3HH-92647-AAAA-RJZZA Issue 09: s2.2 and s2.3 (Table 5, the
      orderable items), s2.3.7 the horizontal mounting and front cover kits, s2.4.5 Table 21 power
      per unit, s4.1.3.4 airflow, s4.4.6 the dummy boards. DS = Nokia Lightspan MF-8 data sheet
      CID214273 (April 2025), with a front render of a fully populated shelf. Every figure in the
      two guides is an embedded raster of 1 to 3 px/mm, and every image of the shelf is a vendor
      render: no photograph of a unit is held.
  chassis:
    confidence: datasheet
    note: >-
      UDS s2.5.1 (p19), repeated for the kits in s3.5.1 and s4.5.1: height 355 mm (8 RU), width
      "overall over flanges: 481 mm" and "no flanges: 448 mm", depth "front plate to rear: 246
      mm" and "including grounding stud: 262 mm"; with a power module 274 mm and with the front
      dust filter assembly 290 mm. s2.5.2: 11.5 kg empty; s3.5.2: 16.75 kg as a kit. The DS prints
      a mounting centre distance of 465 mm and an overall depth of 287.3 mm, which matches none of
      the UDS depths and is carried as the DS's own figure. The chassis width is the 448 body;
      the front view alone is 481 wide, see flanges.
  flanges:
    confidence: datasheet
    note: >-
      The front view is drawn 481.0 wide WITH the two mounting flanges, 16.5 mm each ((481 - 448)
      / 2; the DS render measures 16.5), against the library's rule that ears are not drawn. The
      reason is that this shelf's left flange is not bare: UDS s2.4 (p16) lists on it, from bottom
      to top, a dual-stud chassis grounding point, a hook for the cover of the front dust filter
      assembly and an ESD protection point. Those parts are placements here and they need the
      flange to stand on. The rear,
      top and bottom views are the 448 body.
  panel-scale:
    confidence: photo-measured
    note: >-
      Gate 1. The DS front render is 1053 x 777 px. The shelf's outer flange edges are 872 px
      apart, which against the stated 481.0 is 1.8129 px/mm; at that scale the shelf measures
      355.2 tall against the stated 355, and the two power modules 43.5 tall against the stated
      42.8, so the render is orthographic and carries geometry at about 0.55 mm a pixel. It is a
      vendor render and not a photograph. UDS Figure 5 (p19) is a line drawing of the same face
      at 1.02 px/mm, used only to confirm the arrangement.
  rows:
    confidence: photo-measured
    note: >-
      Row boundaries read on the DS render as the bright lower edge of each board's faceplate, at
      y 27.6, 52.4, 76.7, 101.2, 125.8, 150.3, 174.9, 199.7, 234.7, 269.7 and 292.9, then set to
      the vendor's stated pitches: LT and alarm 24.5 mm, NT 35 mm (UDS board chapters; USIM
      s4.4.6 for the dummy boards). LT 8 starts at 3.0 under the top rail, the LT block ends at
      199.0, NT B 199.0-234.0, NT A 234.0-269.0... the alarm row is seated at 269.5-294.0, half
      a millimetre lower than the stack gives, where the render has it. A dark rail 4.4 mm tall
      separates the alarm row from the power bays, whose white frame ticks are at y 297.9 and
      341.7: the bays are the stated 196.15 x 42.8 (UDS chapter 13) at y 298.4. Below them the
      shelf's bottom rail runs to 355.
  columns:
    confidence: photo-measured
    note: >-
      Across, on the DS render: flanges 0-16.5 and 464.5-481.0; the fan cover between shadow
      lines at 17.7 and 55.2, in which the stated 38.1 x 348.5 fan module (UDS s11.6.1) is
      centred at x 17.4, y 3.2; a legend strip 55.7-58.5; board faceplates from 59.0 to 459.5
      (400.5, the boards being 388 long with their ejector ends); a second legend strip
      460.0-462.2. Power bay frame verticals at 63.2, 259.25 and 455.6, so the two bays are at
      x 63.1 and 259.25.
  slot-order:
    confidence: drawing
    note: >-
      UDS Figure 3 "Board and module positions in LMFS-F" (p16) and USIM Figure 6: from the top
      LT 8 to LT 3, NTIO 2 / LT 2, NTIO 1 / LT 1, NT B, NT A, ALM, then PWR 1 at the left and PWR
      2 at the right, with the fan area at the left. UDS s2.4.1 (p16-17) says the same in words,
      from the bottom up.
  slot-legends:
    confidence: drawing
    note: >-
      The legends are printed in the two narrow strips left and right of the boards, reading
      bottom to top, about 2.2 mm high: LT 8 to LT 3, NT B, NT A, ALM, and PWR 1 (left strip only)
      and PWR 2 (right strip only). Positions measured on the DS render: each LT and ALM legend
      about 3.9 below its row's top, each NT legend 9.4 below, the PWR legends at mid-height.
      For the two hybrid rows UDS Figure 1 (p14) prints the longer "NTIO 2 / LT 2" and "NTIO 1 /
      LT 1", as s2.4.1 says the slots are labelled, while the DS render prints "LT 2" and "LT 1".
      The UDS wording is used, as the unit's own document; see the gap. Legends smaller than this
      on the render (none found on the frame) would not resolve at 0.55 mm a pixel.
  flange-holes:
    confidence: photo-measured
    note: >-
      DS render, hole centres: left flange a round hole 6.1 across at (8.0, 14.6) and at (8.0,
      340.1), and four oblong slots 9.4 x 6.1 at y 37.8, 139.3, 215.7 and 317.4; right flange the
      same four slots at x 473.0. The centres are 465 apart, the DS's mounting centre distance.
      UDS Figures 1 and 6 draw the right flange's four slots open to the outer edge, as notches;
      the DS render draws them closed. Drawn closed, as measured; see the gap.
  left-flange:
    confidence: photo-measured
    note: >-
      DS render, centres from the shelf's top-left: a ringed round label 12 across at (7.9, 92.9),
      read as the earth bonding point label of USIM Figure 81; the ESD point, a white round 14.3
      across, at (7.7, 115.3) (UDS Figure 3 points "ESD point" at this one); the two grounding
      studs, 12.1 across in their caps, at (7.7, 239.4) and (7.7, 255.7), 16.3 apart; the earth
      symbol, 8.3 across, at (7.9, 285.6). The library's common parts are placed on those centres
      and are smaller than the capped rounds the render draws (stud 8.1, jack 6.0, symbol 6.0).
      The cover hook is NOT in the DS render; it is taken from UDS Figure 1 (p14), scaled by the
      flange slots it shares with the render (2.232 px/mm): a bracket about x 2.5-13.5, y
      149-208, with a dark receptacle at y 162.4-196.0 and a screw at each end, at y 154.2 and
      202.5. Good to about a millimetre.
  rear:
    confidence: drawing
    note: >-
      No document held draws the rear of the shelf. UDS s2.4.3 (p18) puts the "six BATRET (battery
      return) / FG (Frame Ground) fast-on combinations in the bottom right side of its backpanel",
      but Figure 4 shows them from the FRONT, through the empty slot area, on the inner face of
      the backpanel behind the alarm row: they are reached with the boards out and are not a
      rear-panel feature. The rear view is therefore sized from the top view and left empty.
  top:
    confidence: drawing
    note: >-
      UDS Figure 5 (p19; the same art is Figures 10 and 15), the plan drawn above the front view,
      an embedded raster at 1.019 px/mm, so positions are good to about a millimetre. It is drawn
      with the FRONT edge uppermost and the shelf's left at the left (the grounding stud projects
      from the upper left corner, in line with the left flange of the front view below it), and
      its AIRFLOW legend is upside down in the figure. USIM Figure 83 (p153) shows that legend on
      the shelf's top cover, near the front edge behind the fan partition, reading "<- AIRFLOW"
      from the front. The 38 screw heads and the legend are transcribed with the rear at y 0. A
      small rectangle the drawing has near the front left corner (x 14-27, 3-10 mm from the
      front) is not identified and is not drawn.
  airflow:
    confidence: datasheet
    note: >-
      USIM s4.1.3.4 (p153): the forced air "comes in via the open side and goes out via the fan",
      which is right to left in a horizontal mounting and bottom to top in a vertical one;
      s2.3.8.1 says the same, "Air intake at the right and air exhaust at the left (via the
      fan)". The top-cover legend "<- AIRFLOW" points the same way.
      UDS s11.3 (p80) gives only the vertical case. Air baffles can turn the flow front-to-rear
      or front-to-top (USIM s2.3.6, s2.3.8); the bare shelf is side to side.
  power:
    confidence: datasheet
    note: >-
      DS: "DC-powered: 48/60 V DC nominal; Fully redundant power feeding (branch A and B)". UDS
      s2.6 (p19): everything in the shelf is fed over the backpanel "from the active power
      module"; s2.4.1 Note: "The two power modules provide power redundancy to the shelf". USIM
      s2.2.1.3 C: "When two power modules are equipped ... power redundancy is supported". USIM
      s3.2.5.4 limits the feed to 80 A with two LPWR-F AA and 100 A with two LPWR-F AB. No
      document held states a power figure for the whole shelf: searched the DS, UDS chapters 2
      to 4 and the USIM for "power consumption", "dissipation" and "W"; USIM Table 21 (p123)
      gives a figure per unit only, and each is carried on that unit's own contract.
  nt-redundancy:
    confidence: datasheet
    note: >-
      UDS s2.4.1 Note 1: "The two NT boards provide NT redundancy to the shelf"; minimum one NT,
      maximum two. USIM s2.2.1.3 A: active/active on the data plane and active/standby on the
      control and management plane.
  occupants:
    confidence: datasheet
    note: >-
      USIM Table 5: LT boards LGLT-D, LWLT-C, LLLT-A and LLLT-B, NT board LBNT-A (AA and AB), fan
      LFAN-F, power LPWR-F (AA 80 A, AB 100 A), alarm LALM-F, and the dummy boards LMDB-B EA
      (LT) and LMDB-E BA (NT); note 6, "no dummy panels exist for any of the modules". Only
      LWLT-C is modelled of the LT boards. UDS s2.4.1 Note 4: "In this release no NTIO boards are
      supported yet", so the two hybrid slots accept LT boards only. The slots are keyed: an NT
      dummy does not fit an LT slot (USIM Procedure 35 Note 2).
  defaults:
    confidence: datasheet
    note: >-
      The base is the shelf kit as UDS chapter 3 and Table 4 (p24) deliver it - the fan module,
      the alarm module and two power modules fitted, "without boards" - with a dummy board in
      every LT and NT slot, because USIM s4.4 forbids operating the shelf with an empty slot.
      It has no NT board and so cannot be logged into; it is the orderable starting point and
      not a working node. The populated example is the DS render's population.
  front-cover:
    confidence: datasheet
    note: >-
      Two front covers exist and they are different parts. The VERTICAL front dust filter assembly
      (3TJ 00003 AA, UDS chapter 16: 355 W x 542 H x 42.13 D) fits only a vertically mounted
      shelf, where it also spans the bottom dust filter assembly. The HORIZONTAL front dust
      filter assembly (USIM s2.3.7.1, p72-74: 355 H x 507.6 W x 36 D) is the one for the
      horizontal mounting drawn here and is nokia/mf8-horizontal-front-cover@1, placed only in
      the front-cover configuration. USIM s2.3.7.1 puts its right edge 55 mm beyond the right
      mounting holes, so on this face it runs from x 20.4 to 528: it overhangs the right flange
      by 47 mm, onto the cable tray of the same kit, which is not part of the shelf and is not
      drawn. Its small light window lands on the fan module's location lamp, which checks the
      position.
  bottom-dust-filter:
    confidence: datasheet
    note: >-
      The bottom dust filter assembly (3FE 79983 AA, UDS chapter 15: 358 W x 89 H x 284.85 D) is
      "a mandatory element when installing a Lightspan MF-8 vertically" and "can only be used in
      case of a vertical mounting configuration" (s15.3, s15.6). In that mounting it sits under
      the shelf's right-hand end, the air intake, across the 355 dimension; it is not part of a
      horizontally mounted shelf and is not drawn on any face here. The DS's "Height (w/o bottom
      dust filter assembly): 355 mm" is the same statement.
  sides:
    confidence: estimated
    note: >-
      No document held draws either side face. Vendor renders of a vertically mounted shelf show
      its upper face - the shelf's LEFT side, behind the fan module - perforated over most of its
      area, which is the fan exhaust; the field is placed by eye from those perspective views.
      The right side is "the open side" the air enters by (USIM s4.1.3.4) and no image held
      shows it.
  colour:
    confidence: photo-measured
    note: >-
      DS render, averaged over plain areas: flange 95,102,111 (#5f666f), fan cover and frame
      86,95,106 (#565f6a), right legend strip 67,74,82. A vendor render, so this is the vendor's
      presentation of a blue-grey slate finish; no photograph of a unit is held.
