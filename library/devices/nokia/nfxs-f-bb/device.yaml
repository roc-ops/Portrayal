gaps:
- what: line-cards
  scope: [lt-1, lt-2, lt-3, lt-4]
  reason: needs-drawing
  note: >-
    Every ANSI-valid LT card the coverage grid lists is modelled and accepted in these slots, except
    FELT-B AC (3FE69486AC), for which no data sheet exists in any staged document. FELT-C is an
    ETSI/MII card and is not accepted by this ANSI shelf. The copper DSL/POTS cards (NDLS, NPOT,
    NIAT, NDPS, NVPS) are out of scope by decision (roc-ops/Portrayal#538).
  wanted: a FELT-B AC unit data sheet
- what: side-top-bottom
  scope: [left, top, bottom, rear]
  reason: needs-drawing
  note: >-
    The top view in 3FE64991BAAATQZZA02 Figure 4 draws a column of openings along the left edge and
    fittings along the right; they are not transcribed yet. No staged document draws the left side, the
    bottom or the rear face.
  wanted: the top view transcribed; a photograph of the rear and left side
- what: horizontal-airflow
  scope: [fans]
  reason: vendor-silent
  note: >-
    The direction of the air across a horizontally mounted FX-4 is not stated; only the vertical
    mounting's front-to-rear flow is.
  wanted: a sentence or airflow figure for the horizontal installation
