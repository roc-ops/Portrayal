    size-with-fibre-tray: 208 x 232 x 48 mm, 0.85 kg
  performance:
    pon-line-rate: 10 Gb/s downstream and upstream (ITU-T G.9807.1 XGS-PON)
    max-frame-bytes: 9216
    vlans: 4094
    multicast-groups: 1024
  power:
    power-max-w: 10.6
    power-min-w: 4.54
    power-typical-w: 7.75
    power-standby-w: 4.6
    power-input: 12 V DC 1 A adapter, or PoE on the 10GE port (802.3af PD)
  environmental:
    operating-temp: -40 to 65 C
    operating-temp-in-enclosure: -40 to 58 C outside the outdoor enclosure
    humidity: 5% to 95% non-condensing
  platform:
    memory: 256 MB DDR3
    flash: 128 MB
  features:
    wan: xgs-pon
    pon-wavelengths: 1260-1280 nm upstream, 1575-1580 nm downstream
  management:
    local-web-gui: 192.168.1.254
    remote: OMCI, Nokia AMS or Altiplano
  compliance:
    regulatory: FCC compliant, UL 62368
  lifecycle:
    eol: none-announced
chassis:
  width: 208.0
  height: 34.3
  depth: 142.0
  mount: desktop
  weight-kg: 0.53
  color: '#f7f7f7'
  edge: '#c9ccd0'
  silk: '#333333'
  power: dc
gaps:
  - what: power-max
    scope: [power-max-w]
    reason: sources-disagree
    note: >-
      Product Guide Table 4-9 prints maximum power (not to exceed) 10.6 W. The data sheet
      CID212870 prints power consumption below 10 W. The manifest carries the guide's figure,
      the larger and the one that states its condition.
    wanted: a Nokia statement of which figure is current
  - what: power-connector
    scope: [dc-in]
    reason: sources-disagree
    note: >-
      Figure 4-1 draws a round coaxial jack with a centre pin and the US kit's adapter is the
      XS-010X-R's 1AF32126AAAA; Table 4-6 says the power connection is a cable with a Molex
      connector, and Table 4-3 sells a Molex to Phoenix adapter with the outdoor enclosure.
      The manifest draws the figure.
    wanted: a photograph of the POWER socket of a real unit
  - what: poe-class
    scope: [rj45-10g]
    reason: sources-disagree
    note: >-
      The guide's section 4.4 names a PoE 802.3af PD function; its section 4.3, the data sheet
      and the Quick Reference Guide say PoE+, and the data sheet writes PoE+ compliant
      powering (802.3af) in one line. The stated 10.6 W maximum is inside the 802.3af budget.
    wanted: the PD class the port negotiates
  - what: rj45-lamp-meanings
    scope: [port-10ge]
    reason: vendor-silent
    note: >-
      The data sheet lists RJ-45 LEDs Mode/Status and Link/Carrier. No table gives their
      colours, which window is which, or their states; the Product Guide LED table covers only
      the three top-face lamps.
    wanted: an LED table for the two jack lamps
  - what: cpu
    reason: vendor-silent
    note: >-
      The guide names an ONT SoC (Figure 4-4) without a part or a clock. Memory and flash are
      stated.
    wanted: the SoC named in a Nokia document
  - what: side-vents
    scope: [left, right]
    reason: needs-drawing
    note: >-
      Side vents are named in the mounting requirements and visible on one short side in the
      render; no elevation of a side is in the guide.
    wanted: a side elevation or a square-on photograph of each short side
  - what: front-face
    scope: [front]
    reason: needs-photo
    note: no figure or render held shows the long edge opposite the ports
    wanted: a photograph or drawing of the front edge
  - what: underside-holes
    scope: [bottom]
    reason: needs-drawing
    note: >-
      Figure 5-8 shows four slanted slots, a third wall-mounting hole and two pegs that are
      not drawn here: the slots are at an angle a decor rectangle cannot take, and no document
      says what the pegs are.
    wanted: a dimensioned underside drawing
