gaps:
  - what: power-max
    scope: [power-max-w]
    reason: sources-disagree
    note: >-
      Product Guide Table 4-9 prints maximum power (not to exceed) 10.6 W. The data sheet
      CID212870 prints power consumption below 10 W. The manifest carries the guide's figure,
      the larger and the one that states its condition.
    wanted: a Nokia statement of which figure is current
  - what: power-connector
    scope: [dc-in]
    reason: sources-disagree
    note: >-
      Figure 4-1 draws a round coaxial jack with a centre pin and the US kit's adapter is the
      XS-010X-R's 1AF32126AAAA; Table 4-6 says the power connection is a cable with a Molex
      connector, and Table 4-3 sells a Molex to Phoenix adapter with the outdoor enclosure.
      The manifest draws the figure.
    wanted: a photograph of the POWER socket of a real unit
  - what: poe-class
    scope: [rj45-10g]
    reason: sources-disagree
    note: >-
      The guide's section 4.4 names a PoE 802.3af PD function; its section 4.3, the data sheet
      and the Quick Reference Guide say PoE+, and the data sheet writes PoE+ compliant
      powering (802.3af) in one line. The stated 10.6 W maximum is inside the 802.3af budget.
    wanted: the PD class the port negotiates
  - what: rj45-lamp-meanings
    scope: [port-10ge]
    reason: vendor-silent
    note: >-
      The data sheet lists RJ-45 LEDs Mode/Status and Link/Carrier. No table gives their
      colours, which window is which, or their states; the Product Guide LED table covers only
      the three top-face lamps.
    wanted: an LED table for the two jack lamps
  - what: cpu
    reason: vendor-silent
    note: >-
      The guide names an ONT SoC (Figure 4-4) without a part or a clock. Memory and flash are
      stated.
    wanted: the SoC named in a Nokia document
  - what: right-side-vents
    scope: [right]
    reason: needs-photo
    note: >-
      No held picture shows the short side at the other end, so whether it is vented is not known.
    wanted: a photograph or drawing of that side
  - what: front-face
    scope: [front]
    reason: needs-photo
    note: no figure or render held shows the long edge opposite the ports
    wanted: a photograph or drawing of the front edge
  - what: wall-hole-shapes
    scope: [bottom]
    reason: needs-drawing
    note: >-
      Figure 5-8 draws the first wall hole as an L of two slots, 17.5 x 7.0 and 7.0 x 11.5 mm,
      and the second as one slot 8.5 x 12.0 mm, each with a round screw position 9.0 mm across and
      a 9.0 mm ring. The device draws them as two shared keyhole parts, 6 x 10 mm each, with the
      round head 5.5 mm above the screw position, and the keyholes also sit upside down against
      the figure. Redrawing them as shown is a later part of its own and a one-way change,
      because leaving the shared part removes two placement ids.
    wanted: a part that cuts the two holes, their rings and their screw positions as the figure shows them
  - what: underside-tab
    scope: [bottom]
    reason: needs-drawing
    note: >-
      Figure 5-8 shows a tab 8.9 mm wide at x 70.7 to 79.6 on the back edge, standing about 5.7 mm
      outside the 208 x 142 outline. Figure 4-1 draws a stub 16.5 mm wide at x 40.4 to 56.9.
      The library holds neither reading as measured. The kit has no shape for a feature outside
      a face's own rectangle: `chassis.overhang` and `chassis.ears` are for a rack device only,
      decor is clipped to the view's size, and `out` and `lift` give only a depth.
    wanted: a drawing of the back edge that gives the tab's width
  - what: case-screw-head
    scope: [bottom]
    reason: needs-drawing
    note: >-
      Figure 5-8 draws the case screw as a slotted head with one slot in a double ring. The device
      seats the shared screw head, which draws a cross. No slotted version exists in the library,
      and a new version of a shared part moves every device that seats it.
    wanted: a slotted version of the shared screw head
