format: 1
kind: device
name: xs-010xr-p
version: 0.2.1
maturity: modelled
manufacturer: Nokia
model: XS-010XR-P
description: >-
  Temperature-hardened, reverse-powered XGS-PON single-family-unit ONT in a 208 x 142 x 34.3 mm
  white moulded housing, for a desk, a wall, or outdoors inside the Nokia outdoor ONT
  enclosure. The back edge carries a ground point, one 100M/1G/2.5G/5G/10GBASE-T RJ-45 that is
  also the PoE powered-device input, a pinhole reset, a round on/off button, the 12 V DC jack
  and the SC/APC PON port in a green adapter with a fibre-lock boss beside it. Three lamps on
  the top face read POWER, PON and DATA.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Nokia ONT XS-010XR-P Product Guide, 3TN-00113-AAAA-TCZZA Issue 4 (BBD Release 25.01):
      Table 4-1 p33 the kits, Table 4-3 p34 the accessories, Table 4-8 p39 size and weight,
      Table 4-9 p39 power, Table 4-10 p39 the environment, Figure 4-1 p36 the back elevation,
      Figure 4-2 p38 the top plan, Figure 5-8 p53 the underside, Table 4-7 p38 the lamps.
      Nokia ONT XS-010XR-P data sheet CID212870 (the vendor datasheet) and Quick Reference
      Guide 3TN-00113-AAAA-TCZZB CID213181 for summary figures and the one product render. The
      guide figures are vector line art, read at 600 dpi.
  chassis:
    confidence: datasheet
    note: >-
      Product Guide Table 4-8 p39, without the fibre storage tray: length 208 mm, width 142 mm,
      height 34.3 mm, 0.53 kg within 0.23 kg; with the tray 208 x 232 x 48 mm and 0.85 kg. The
      data sheet and the Quick Reference Guide print the same 208 x 142 x 34.3 and 0.53 kg.
      The ports are on a 208 mm edge (Figure 4-1 measures 2963 px across, and its RJ-45 then
      comes out 16.0 mm wide), so 208 is the width here and 142 the depth. Mount `desktop`:
      the guide stands it on a desk or shelf, hangs it horizontally on a wall by the keyholes
      in its underside or vertically on bracket 3FE49972AA, and outdoors seats it in outdoor
      enclosure 3FE54221AH; the feet-down way is the one drawn. THE HOUSING IS NOT A PLAIN BOX:
      its plan corners are rounded at about 19 mm (Figure 4-2) and its lower shell curves
      under below two seam lines; the views are the 208 x 142 x 34.3 envelope and the rounded
      outline is drawn on the top and bottom faces as a line.
  rear-layout:
    confidence: drawing
    note: >-
      Product Guide Figure 4-1 p36, an elevation of the back edge. x at 14.245 px/mm from the
      208 width. GATE 1 IS ONLY HALF PASSED: the figure draws the top edge as a shallow arc
      and the shell 514 px from crest to underside, 36.1 mm at that scale against the stated
      34.3, so heights are five percent out and are taken as fractions of 34.3; x is good to
      about 0.5 mm, y to about 1 mm. Centres left to right as seen from behind: ground point
      21.3, 10GE 97.2, RESET 115.9, ON/OFF 132.6, POWER 148.3, PON 169.7, fibre-lock boss
      180.3, laser mark 187.2. The RJ-45 is drawn 16.0 x 12.3 with its latch down and one lamp
      window in its lower left corner; the SC opening has its key slot up. Standard parts keep
      their registry sizes. The earth symbol is drawn 8.7 mm above the ground point; the
      library part that pairs the two holds them 6.5 mm apart, so the symbol sits about 2 mm
      low here.
  top-layout:
    confidence: drawing
    note: >-
      Product Guide Figure 4-2 p38, a plan of the front part of the top face at 15.13 px/mm
      from the 208 width; only the front edge is in the figure, so there is no second axis to
      check it against. Three lamps 1.8 mm across, 12.8 mm in from the front edge at 86.0,
      103.9 and 121.9 mm - a row centred on the face at 17.95 mm pitch, drawn at 86, 104 and
      122. Each legend runs away from its lamp towards the back, reading from the right. The
      data sheet render shows the same three and Figure 5-13 the same order.
  wordmark:
    confidence: estimated
    note: >-
      The data sheet render shows the vendor wordmark on the top face along the short edge at
      the right as seen from the front, reading along that edge. No line drawing shows it, so
      the reserved zone is placed by eye from a three-quarter render. Not drawn - a reserved
      logo zone: the wordmark is a mark, and marks are left to a later part of their own.
  bottom-layout:
    confidence: drawing
    note: >-
      Product Guide Figure 5-8 p53, a plan of the underside, read at 600 dpi. GATE 1: outline
      2140 x 1464 px, 10.29 and 10.31 px/mm against 208 and 142, orthographic to 0.2 percent.
      Four feet 11.65 mm across; two label recesses 60.4 x 40.7 and 60.4 x 20.8 mm, each with
      its lower right corner cut 2.2 mm; a plate 167.1 x 101.3 mm with corners of 7.8 mm radius;
      four slanted slots at 45 degrees, 15.0 x 5.5 mm, each in a dished recess; three
      wall-mounting holes with two screw positions (the first an L of two slots, 17.5 x 7.0 and
      7.0 x 11.5 mm; the second one slot 8.5 x 12.0 mm; the third a slot 9.5 x 5.3 mm ending in
      a round 8.8 mm head; the first two stay the shared keyhole part, see the wall-hole-shapes
      gap, and the third is cut here); two round pegs 8.7 mm across, 9.0 mm from the front edge (Figure 5-12 p56 labels them rubber pads, fitted for the outdoor enclosure; no height is stated); thin
      creases from the plate corners to the housing corners. The file draws eight creases, nine
      paths: the one at the case screw is broken round the screw, as the figure draws it. The figure's double
      housing line is drawn as two, at 1.4 and 2.1 mm in. Each foot has the inner ring the figure
      draws, 10.0 mm across. A U ring recess surrounds the third wall hole, 12.3 mm across and
      open towards its round head. Each peg has the crescent of side wall below it in the figure,
      2.5 mm deep, which the half turn puts on the plate side. These small shapes were read in the
      600 dpi page at 4 times, rounded to 0.5 mm, and are estimates. Sizes are good to about 0.5 mm. The
      figure has the back edge at the bottom; this view has it at the top, so a figure point
      (x, y) is the face point (208 - x, 142 - y). Not drawn: the 8.9 x 5.7 mm tab the figure shows
      on the back edge at x 70.7 to 79.6, which stands outside the face's own 208 x 142 rectangle.
      Figure 4-1 draws a stub 16.5 mm wide at x 40.4 to 56.9 under the rear body.
  side-layout:
    confidence: estimated
    note: >-
      The guide speaks of side vents (5.5 step 1: 50 mm clearance from the side vents).
      Product Guide Figure 5-9 p53 shows a field of 22 slanted slats on the short side at the
      fibre end, which seen from the front is the left; the data sheet render shows only a faint
      vent texture at that end, too small to count. The figure draws two seams across the wall
      at the ends of the field; the two end seams are drawn at 19.0 and 122.8 mm. The figure
      draws no seam along the depth of this wall, so none is drawn on the left face. The right
      face keeps the two carried from the rear elevation (26.3 and 28.3 mm down). The slats are
      drawn on the left face as 2.3 x 21.0 mm stadiums at a 4.75 mm pitch, centred across the
      142 mm depth and from 7.5 mm down the face. Scale: the field is taken to span the flat
      of the side between the 19 mm plan corners, 142 - 2 x 19 = 104 mm. The 22 slats then
      sit 4.75 mm apart, and the wall's 34.3 mm height, 238 px between its outer lines, sets
      the 6.9 px/mm that gives their length and start. The figure is a perspective view, so
      the figures are good to about 30 percent. No held picture shows the right side, so the
      right face carries no vents.
  colours:
    confidence: estimated
    note: >-
      From the data sheet render, 975 x 481 px, by counting pixels: the housing reads #f7f7f7
      on the back edge (3,600 px, median); 2,231 px of the PON adapter are green, median
      #68a80d; the legends are dark, #2f2f2f to #333333 at their darkest; the fibre-lock boss
      beside the PON port is brass-yellow, median #d1b830 over 232 px. A render, not a
      photograph of a unit.
  power:
    confidence: datasheet
    note: >-
      Product Guide Table 4-9 p39: maximum power (not to exceed) 10.6 W, minimum 4.54 W, one
      10GBASE-T Ethernet, other interfaces not provisioned. The Quick Reference Guide prints
      standby 4.6 W and typical 7.75 W; the data sheet prints below 10 W, recorded as a gap.
      Two feeds: the 12 V DC jack (12 V DC 1 A, Table 4-2) or PoE on the 10GE jack, which the
      guide calls a PoE 802.3af PD function and also POE+; the optional injector 1AF32488DA is
      56 V 0.62 A.
  dc-in-rating:
    confidence: datasheet
    note: >-
      Product Guide Table 4-2: 12 V DC 1 A at the DC jack - the `input-voltage` and
      `current-max-a` of the dc-in jack. The guide's block diagram calls it a 12 V barrel and
      states no barrel size; the jack is the library's one nominal `dc-barrel`.
  power-jack:
    confidence: drawing
    note: >-
      Drawn as the coaxial DC jack Figure 4-1 shows - a round socket with a centre pin - and
      the US kit ships the same adapter, 1AF32126AAAA, as the XS-010X-R, whose jack is drawn
      the same way. Table 4-6 calls the power connection a cable with a Molex connector;
      recorded as a gap.
  lamps:
    confidence: datasheet
    note: >-
      Product Guide Table 4-7 p38. POWER green, blinking while firmware loads. PON green when
      up, green blinking while ranging, red when down (O7 or rogue), red blinking when out of
      range. DATA green at 100M/1G, yellow at 2.5G or above. The data sheet also lists two
      RJ-45 lamps, Mode/Status and Link/Carrier, with no colours or states. The lamp colours
      drawn are conventional hues for those words, not sampled.
