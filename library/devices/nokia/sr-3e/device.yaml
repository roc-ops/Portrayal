gaps:
  - what: photographs
    scope: [front, rear]
    reason: needs-photo
    note: >-
      Every figure used is vendor line art. Colour, finish and the printing on the cable-tray links are
      assumed; PUBLIC-SOURCES lists straight-on product photographs that are not staged.
    wanted: NK/2018-11/7750_SR-2e_F.jpg (2880 px) and the DS 189831 chassis cut-outs, staged
  - what: side-top-bottom
    scope: [left, right, top, bottom]
    reason: needs-drawing
    note: >-
      Only two isometrics show the sides (p116 Figure 28, p147 Figure 44); nothing draws the top or the
      bottom. The side decor is estimated from perspective.
    wanted: a side elevation or photographs of the sides
  - what: sr3e-rear-figure-height
    scope: [rear]
    reason: sources-disagree
    note: >-
      SR-e guide Figure 11 (p52) draws the SR-3e rear 586.7 mm tall, and Figure 61 (p189) draws its
      fan tray 524.0 tall; Table 23 gives the chassis 22.75 in (577.9, 13 RU, which Figure 10 agrees
      with at 577.4) and Table 28 the tray 20.2 in (513.1). The stated figures are used. Where the
      rear loses the 8.8 mm is not drawn: here it comes out of the plate under IOM-e 3.
    wanted: a photograph or a corrected rear elevation of the SR-3e
groups:
  ccm-slots:
    term: Slot
    role: service
    index-origin: 1
    description: >-
      front CCM-e slots A (rel-pos 1) and B (rel-pos 2), the top two rows of the front cage. CCM-e A pairs with CPM-e A and B with B across the midplane (SR-e guide p42); in a simplex system both go in A or both in B.
  mda-slots:
    term: Slot
    role: service
    index-origin: 1
    description: >-
      front MDA-e slots 1/1 to 3/4 (rel-pos 1-12, top to bottom), 193.0 x 35.4 each. IOM-e 1 serves MDA-e slots 1/1-1/4. IOM-e 2 serves MDA-e slots 2/1-2/4. IOM-e 3 serves MDA-e slots 3/1-3/4.
      Takes MDA-e cards and MS-ISA2 only; the MDA-e-XP and MDA2-e-XP never seat in an SR-e (SR-e guide
      p61 Table 14; MDA-e-XP guide).
  cpm-slots:
    term: Slot
    role: service
    index-origin: 1
    description: >-
      rear CPM-e slots A (rel-pos 1) and B (rel-pos 2). CCM-e A pairs with CPM-e A and B with B across the midplane (SR-e guide p42); in a simplex system both go in A or both in B.
  iom-slots:
    term: Slot
    role: service
    index-origin: 1
    description: >-
      rear IOM-e slots 1-3, two units tall, separated by non-removable filler plates. IOM-e 1 serves MDA-e slots 1/1-1/4. IOM-e 2 serves MDA-e slots 2/1-2/4. IOM-e 3 serves MDA-e slots 3/1-3/4.
  psus:
    term: PSU
    role: service
    index-origin: 1
    description: >-
      eight PSU slots across the top of the rear: PSU 1-6 vertical, left to right, then PSU 7-8 horizontal. AC and -48/-60 VDC supplies may be mixed (SR-e guide p62); installed N+1 (p49).
    attrs:
      redundancy: 'n+1'
      redundancy-note: 'SR-e guide p49: chassis bundles include the minimum number of PSUs and do not provide N+1 power supply redundancy; at least one other PSU must be added for N+1'
  fans:
    term: Fan Tray
    role: service
    index-origin: 1
    description: the chassis-specific fan tray in the vertical slot at the right of the rear
  grounding:
    term: Point
    role: furniture
    index-origin: 1
    description: the rear ESD strap receptacle
