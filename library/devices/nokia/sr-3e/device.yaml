format: 1
kind: device
name: sr-3e
version: 0.1.1
maturity: modelled
manufacturer: Nokia
model: 7750 SR-3e
description: >-
  The 13RU Nokia 7750 SR-3e service router (1.2 Tb/s half-duplex, 3 forwarding
  complexes), one of the three 7750 SR-e chassis that share a midplane design, cards and
  power supplies. Front: a horizontal card cage at the left under the PSU-shelf air intake - two CCM-e
  slots (A, B) then 12 MDA-e slots numbered 1/1 to 3/4 - with the integrated cable-management tray
  beside it and the hinged grill over the air filter at the right. Rear: the PSU shelf across the top
  (8 slots), the CPM-e slots A and B and 3 IOM-e slots at the left,
  and the chassis-specific fan tray standing in the vertical slot at the right. Every card lies
  horizontally, as the guide draws it, so no card bay rotates; the six vertical PSU slots seat the horizontally authored supplies at rotate 90.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Written first. (1) 7750 SR-1e, SR-2e and SR-3e Chassis Installation Guide 21.10,
      3HE17927AAAATQZZA03 (the SR-e guide): Figures 10 (p50, front) and 11 (p52, rear) are the geometry, p79-80 Tables 21-23 the
      chassis specifications, p82 Table 25 the heat dissipation, p84-86 Tables 27-28 the module power
      and sizes, p89 Figure 25 the rack dimensions, p122-124 the ground, p116 Figure 28 and p147 Figure
      44 (isometric) the sides. (2) The seated fan tray's own contract. Every figure on those pages is
      VECTOR (pdfimages -list finds no raster), so a 1200 dpi pdftocairo render is exact at any scale.
      No photograph of any SR-e chassis is staged (PUBLIC-SOURCES lists NK/2018-11/7750_SR-2e_F.jpg and
      the DS 189831 cut-outs, none downloaded).
  chassis:
    confidence: datasheet
    note: >-
      SR-e guide Table 23 (p80): 22.75 x 17.5 x 21.2 in (H x W x D), 13 RU; weight 38.2 kg
      unpopulated, 83.9 kg full. The table's note 2 says the 17.5 in width "includes the
      integrated flanges", but p89 Figure 25 dimensions it otherwise: "Chassis Width 17.5 in (444.5
      mm)" between arrows that land on the body, and "Chassis Flange Width 19 in (482.6 mm)" over the
      ears, with hole centres 465 mm apart. Measured on that figure at 1200 dpi (9.948 px/mm from the
      19 in flange), the body arrows sit 18.4 mm and 20.0 mm in from the flange edges. So the face is
      the 444.5 between the folds, the ears (about 19 mm a side, not drawn) carry the rack holes, and
      the note is read as loose wording. Depth 538.5 excludes panel protrusions (note 3).
  panel-scale:
    confidence: drawing
    note: >-
      Gate 1. Figures 10 (p50, front): the whole front over the flanges measures 4135-4150 px across at
      1200 dpi and 4958 px top to bottom; 8.587 px/mm across (to 482.6) and
      8.579 down (to 577.9) - orthographic to 0.1 percent. The face frame used for every x below is
      the body centred on the flanges (face x = (px - centre)/8.587 + 222.25), y from the top outer edge.
      Positions were read by pixel scans along rows and columns of the render and on a millimetre grid
      laid over it; they are good to about 0.5 mm, the figures' own stroke widths.
  rear-scale:
    confidence: drawing
    note: >-
      11 (p52, rear): the body top edge to bottom edge is 5038 px = 586.7 mm at 8.587 px/mm,
      the flanges 4149-4158 px (483 mm) across, ears drawn beside the body. THE SR-3e REAR FIGURE IS DRAWN 8.8 mm TOO TALL: it is the SR-2e rear with one IOM-e and one filler plate (4 x 35.4 = 141.6 mm) spliced in, where the real SR-3e is only 133.35 mm (3 RU) taller than the SR-2e, and the front figure (Figure 10) does measure 577.4. Everything down to the last IOM-e slot is taken as drawn; the difference is taken out of the plate under the last IOM-e, which is 25-26 mm here against the SR-2e's 33.8 - see gap sr3e-rear-figure-height.
  card-cage:
    confidence: drawing
    note: >-
      Front cage: the card plates run x 87.2-280.1 on the render (192.9, the stated 193.0 face), so
      every CCM and MDA bay is 193.0 x 35.4 at x 87. Slot boundaries were read where one card's
      bottom edge meets the next card's top edge along x 200; they fall at a mean pitch of
      35.37 mm, and the stack is laid out at the family's U = 35.4 (the conventions' pitch,
      measured 35.43 across the SR-3e's 14 slots) from y 68.5, which leaves every
      boundary within 0.4 mm of the drawing. Top to bottom: CCM A, CCM B, then MDA 1/1 onward.
  rear-cage:
    confidence: drawing
    note: >-
      Rear cage: the CPM-e and IOM-e plates measure 43.7-300.0 across (256.3 drawn against the stated
      259.1), so the 259.1 bays are centred on them at x 42.3. Slot boundaries read along x 150 were
      fitted with the 35.4 unit (CPM 1U, IOM 2U, filler 2U) from y 124.5; the residuals are under
      1.4 mm.
  slot-numbering:
    confidence: datasheet
    note: >-
      SR-e guide p44-51: CCM slots A and B at the top of the front cage; MDA-e slots numbered n/m, where
      n is the IOM-e (forwarding complex) and m the MDA within it (p48). rel-pos counts the MDA slots
      1-12 top to bottom, the "slots 1-4 / 5-8 / 9-12" of p59. The chassis prints each n/m twice: on
      the strip right of the cage and on the cable-tray spine; CCM A/B is printed once on the spine
      (on the CCM B row) and as CCM A, CCM B on the strip.
  psu-shelf:
    confidence: drawing
    note: >-
      p49/p53: eight PSU slots - PSU 1-6 vertical, left to right, then PSU 7-8 horizontal. The vertical slots are 42.73 apart; each bay is the 40.4 x 86.4 footprint of the horizontally authored supply seated at rotate 90 (checked on the conventions 1600 dpi crop of p48: fan to the top, LED bottom right). A bay size is the on-panel footprint and the renderer hangs the occupant at the bay centre, so the bay is NOT given the unrotated 86.4 x 40.4 size the conventions describe. PSU 7-8 are 86.4 x 40.4 at rotate 0 above the fan tray. The PSU n labels sit in cells under the vertical slots; PSU 7 and PSU 8 are printed in two small boxes under PSU 7, with the touch-current warning label below them.
  fan-tray:
    confidence: drawing
    note: >-
      The fan tray bay is the tray's stated face, 137.2 x 513.1, centred on the drawn tray (x 301.5-440.1,
      y 57.8-582.9 as drawn) at x 302.2, y 58.3. It seats nokia/sr-3e-fan-tray@1 only (p66: fan trays are chassis-specific).
  ground:
    confidence: drawing
    note: >-
      p122: two 10-32 ground studs "located at the back of all 7750 SR-e chassis at the bottom-left";
      p124 Figure 33 dimensions them 0.625 in (15.86 mm) apart; the drawn studs are 15.8 apart
      at x 16.0, y 485.2 and 501, on a plate under an earth symbol. Drawn as panel decor (a
      stud plate is chassis metalwork with no part number; no library part draws a two-stud earth
      point without its own symbol).
  esd:
    confidence: drawing
    note: >-
      Front ESD jack (key 4 on the front figure): measured at x 449-452 in the face frame, ON THE RIGHT
      FLANGE outside the 444.5 body (p89 Figure 25 puts it 12.5 mm in from the flange edge, where the
      body starts about 20 mm in), so it is not drawn - ears are not modelled. Rear ESD jack (the last
      rear key) is on the plate under the last IOM-e at (269.4, 563.2), drawn with common/esd-jack@1.
  cable-tray:
    confidence: drawing
    note: >-
      The integrated cable-management tray (key 3; p160 Figure 52) is chassis furniture and is drawn
      as decor: a plate x 0.8-63.6, a spine of oval links x 30.1-40.6 carrying the slot legends, fingers
      at rows 104.7 + n x 35.45 (x 9.0-60.3) and fixing screws at x 10.2 and 52.3. The fingers
      project toward the viewer in p116 Figure 28; the 22 mm stand-off is estimated.
  intake-door:
    confidence: drawing
    note: >-
      The hinged grill (key 6) frame x 301.6-437.7, y 71.9-559.3; opening y 83.4-547.8; louvres at y
      102.2, 137.8, 173.3, 208.8, 244.2, 279.7, 315.2, 350.8, 386.3, 421.8, 457.3, 492.8, 519.5; handle (key 7) at y 300. p69 says the filter slot is
      "angled slightly from left to right"; the door is drawn flat, as the conventions ask (it carries no
      ports). The hinge brackets and two double-line runs that cross the PSU intake from the top edge
      (one ends at the handle) straddle the flange fold or are unidentified, and are not drawn.
  cross-branch-refs:
    confidence: datasheet
    note: >-
      The accepts lists and defaults are the conventions' (SR-e guide p61 Table 14, p44-45, p62-64,
      p72 Table 20), naming nokia/ccm-e, cpm-e, iom-e, sr-e-psu-ac, sr-e-psu-dc, the five sr-e
      impedance panels and the nine MDA-e cards. Those contracts are built on the sibling wave-1
      branches (SR-e modules; MDA-e SFP; MDA-e 100G), so on this branch alone they do not resolve;
      they were checked against those branches' contracts before commit. The 8-port 10/25GE MDA-e
      (3HE14888AA) is held out of wave 1 (no genuine faceplate drawing) and is not listed.
  defaults:
    confidence: drawing
    note: >-
      As the figures draw the chassis: both CCM-e and both CPM-e, every IOM-e, a ME10-10GB-SFP+ in
      every MDA-e slot (the front figure's card, legible on every row),
      DC supplies in PSU 1-6 and PSU impedance panels in PSU 7-8 (key 5),
      and the chassis's own fan tray.
  power:
    confidence: datasheet
    note: >-
      SR-e guide p82 Table 25: worst-case total power 3883 W (13249.18 BTU/hr), "with worst-case total
      power including optical components"; worst case is 100 percent line rate at 55 C (p83). Carried as
      the vendor's system figure. The per-module figures (p84 Table 27) live on the module contracts; this
      figure is not reconciled against them.
  colour:
    confidence: estimated
    note: >-
      No photograph is staged; the charcoal chassis and grey trim are assumed. See gap photographs.
  other-faces:
    confidence: estimated
    note: >-
      Sides from isometrics only (p116 Figure 28 left, p147 Figure 44 right): LEFT view x = 0 is the
      REAR, RIGHT view x = 0 is the FRONT. Top and bottom are not drawn in any staged figure.
