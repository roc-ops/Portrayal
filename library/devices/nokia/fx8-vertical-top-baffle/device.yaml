model: 7360 ISAM FX-8 vertical shelf mount kit, top baffle
aliases:
- {name: 3FE 67824 AA, kind: vendor, note: top baffle}
description: >-
  The top baffle of the 7360 ISAM FX-8 vertical shelf mount kit: the baffle with the fibre
  ring-guides that stands over a vertically mounted shelf and takes two rack units of the
  elevation. A vertical mount needs one over every shelf.
profile: passive
provenance:
  chassis:
    confidence: datasheet
    note: >-
      Nokia 7360 ISAM FX-8 Vertical shelf mount kit unit data sheet (3FE 67300 BAAA TQZZA
      Edition 01), Table 5: the baffle is 99.74 mm high, 205.74 mm wide and 381 mm long. Read as
      height up the rack, depth, and width across it, which Figure 84 of the 7360 ISAM FX ANSI
      Hardware Installation Manual (3HH-12893-AAAA-TCZZA Issue 29) supports: the baffle spans
      about the width of the shelf with its ring-guides along its face.
  units:
    confidence: drawing
    note: >-
      two rack units, read from Figure 84 of the installation manual, where the next shelf's tray
      stands 15 units above the one under the first, which with a tray of two units and a shelf
      that takes eleven leaves two for the baffle. The baffle is 99.74 mm, 2.24 units, so it
      stands about 5.4 mm proud of its units at each end, where the shelf's own spare height
      (eleven units are 488.95 mm, the shelf 446.5 mm) lies. No table prints the units.
  color:
    confidence: estimated
    note: >-
      the held figures are line art and no photograph is held, so the colour is a neutral metal
      grey and is not a reading. The ring-guides the unit data sheet says the baffle carries are
      not drawn: no figure held dimensions them.
  ears:
    confidence: drawing
    note: >-
      no ears. Figure 84 of the installation manual (printed page 168) draws the baffle as a plain
      box standing on the shelf's bracket between the posts, with no ear, flange or bolt to a
      post. The brackets with bolts at the posts are the shelf's, under the baffle.
