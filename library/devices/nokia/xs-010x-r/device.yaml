    mounting: desktop, or wall by two keyholes 85 mm apart or bracket kit 3FE48249AB/AC/AD (vertical only)
  performance:
    pon-line-rate: 10 Gb/s downstream and upstream (ITU-T G.9807.1 XGS-PON)
    max-frame-bytes: 9216
    vlans: 4094
    multicast-groups: 1024
  power:
    power-max-w: 7.7
    power-min-w: 4.3
    power-input: 12 V DC 1 A wall adapter
  environmental:
    operating-temp: -5 to 45 C
    storage-temp: -40 to 65 C
    humidity: 5% to 95% non-condensing
  platform:
    memory: 256 MB RAM
    flash: 128 MB
  features:
    wan: xgs-pon
    standards: ITU-T G.9807.1, G.988; BBF.247 Issue 4; IEEE 802.3az
    pon-wavelengths: 1260-1280 nm upstream, 1575-1580 nm downstream
    pon-launch-power: +4.5 dBm minimum, +9 dBm maximum
    pon-receive-power: -28.5 to -9 dBm
  management:
    remote: OMCI (ITU-T G.988), Nokia 5520 AMS
  compliance:
    regulatory: CE, UKCA
  lifecycle:
    eol: none-announced
chassis:
  width: 135.0
  height: 30.0
  depth: 135.0
  mount: desktop
  weight-kg: 0.258
  color: '#f7f7f7'
  edge: '#c9ccd0'
  silk: '#9a9da1'
  power: dc
gaps:
  - what: weight
    reason: sources-disagree
    note: >-
      Product Guide Table 2-9 (Issue 13, 2026) prints 0.57 lb (0.258 kg). The data sheet
      CID213579 (2023) prints 0.366 kg (0.81 lb). Neither says what is weighed; the manifest
      carries the guide's figure as the later document and the one that names the bare ONT.
    wanted: a weighed unit, or a document saying whether 0.366 kg includes the power adapter
  - what: power-max
    scope: [power-max-w]
    reason: sources-disagree
    note: >-
      Product Guide Table 2-10 prints maximum power (not to exceed) 7.7 W, 10G port
      operational. The data sheet prints power consumption below 8.6 W with no condition. The
      manifest carries the guide's figure because it states its condition.
    wanted: a Nokia statement of which figure is current for hardware 3TN00666
  - what: cpu
    reason: vendor-silent
    note: >-
      The guide's hardware block (Figure 2-5) names an ONT SoC without a part or a clock; the
      data sheet and the Quick Reference Guide say nothing. Memory and flash are stated.
    wanted: the SoC named in a Nokia document
  - what: rj45-lamp-windows
    scope: [lan]
    reason: needs-photo
    note: >-
      No lamp window is drawn in the jack on Figure 2-2 and none shows in the one render held,
      which is three-quarter and 851 px wide. A straight-on photograph of the back would say
      whether the housing carries link lamps of its own.
    wanted: a square-on photograph of the back edge of a real unit
  - what: front-face
    scope: [front]
    reason: needs-photo
    note: >-
      No figure or render held shows the edge opposite the ports. Figure 2-1 and the render
      both look at the back.
    wanted: a photograph or drawing of the front edge
  - what: side-slot-extent
    scope: [left, right]
    reason: needs-drawing
    note: >-
      The five side slots are sized from the back elevation; their run along the side is read
      by eye from an isometric figure and a three-quarter render.
    wanted: a side elevation
  - what: bg-wall-holes
    scope: [bottom]
    reason: needs-drawing
    note: >-
      Kit 3TN00665BG has additional wall mounting holes (Table 2-1) and Figure 3-1 excludes
      it. No figure held shows where they are; the underside drawn is every other variant.
    wanted: the underside of a 3TN00666BG
