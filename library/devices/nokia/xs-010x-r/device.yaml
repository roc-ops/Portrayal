format: 1
kind: device
name: xs-010x-r
version: 0.1.1
maturity: modelled
manufacturer: Nokia
model: XS-010X-R
description: >-
  Indoor XGS-PON single-family-unit ONT in a 135 x 135 x 30 mm white moulded housing that
  stands on a desk or hangs on a wall. Everything is on the back edge: the SC/APC PON port in
  a green adapter, one 100M/1G/2.5G/5G/10GBASE-T RJ-45, a pinhole reset, the 12 V DC jack and
  a round on/off button. Four lamps on the top face read POWER, PON, ALARM and DATA.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Nokia ONT XS-010X-R Product Guide, 3TN-00666-AAAA-TCZZA Issue 13 (BBD Release 26.03):
      Table 2-1 the kits, Table 2-9 p27 the size and weight, Table 2-10 p27 power, Table 2-11
      p28 the environment, Figure 2-2 p25 the back elevation, Figure 2-3 p26 the top plan,
      Figure 3-1 p38 the underside, Table 2-8 pp26-27 the lamps. Nokia ONT XS-010X-R data
      sheet CID213579 (September 2023), the vendor datasheet, for the summary figures and the
      one product render.
      All three guide figures are vector line art, read at 600 dpi.
  chassis:
    confidence: datasheet
    note: >-
      Product Guide Table 2-9 p27: length 135 mm, width 135 mm, height 30 mm; the data sheet
      prints the same three. Weight 0.258 kg is the guide's figure; the data sheet prints
      0.366 kg, recorded as a gap. Mount `desktop`: the guide stands it on four feet on a
      shelf or desk and also hangs it on a wall, by the two keyholes in its underside or on
      bracket kit 3FE48249AB/AC/AD; the feet-down way is the one drawn. THE HOUSING IS NOT A
      PLAIN BOX: its plan corners are rounded at about 16 mm (Figure 2-3: the outline is 40 px
      inside its own corner 62 px along the edge, at 10.76 px/mm) and below a shoulder 20 mm
      down the back face the lower shell curves in to a foot print about 102 mm wide (Figure
      2-2). The chassis keys describe a box, so the views are the 135 x 135 x 30 envelope and
      the rounded outline is drawn on the top and bottom faces as a line.
  variants:
    confidence: datasheet
    note: >-
      Product Guide Table 2-1 pp15-18 lists 24 ordering kits 3TN00665xx, each with the
      provisioning number 3TN00666xx of the ONT inside it. They differ in the power adapter
      plug (AA US; BA-BM EU; CA-CK UK; DA AU) and, for BC and BG, a disabled SLID menu. Two
      rows state a difference in the body: BB is moulded in PCR material and BG has additional
      wall mounting holes (Figure 3-1 is captioned for every variant except BG). Thirteen rows
      are marked customer-specific variant with no further difference stated; those are not
      listed as configurations, and neither is BG, whose underside is not the one drawn. The row for kit 3TN00665CE prints provisioning number
      3TN00666CA, which reads as a misprint for CE and is left out for the same reason.
  rear-layout:
    confidence: drawing
    note: >-
      Product Guide Figure 2-2 p25, a square-on elevation of the back edge. GATE 1: the
      outline is 2628 px wide and 594 px from its top line to the bottom line of the shell
      (feet excluded), 4.42 against the stated 135 / 30 = 4.50, so it is orthographic to 1.7
      percent. x at 19.47 px/mm from the 135 width; y as fractions of the 30 height. Centres,
      left to right as seen from behind: laser mark 24.0, PON 35.6, LAN 59.2, RESET 76.3,
      POWER 87.8, ON/OFF 100.3; the five sit on a line 12 to 14 mm down. The standard parts
      keep their registry sizes: the figure draws the RJ-45 opening 13.6 wide in an 18.3 x
      11.9 moulded bezel and the SC opening 9.7 x 7.3 in a 13.6 x 9.9 adapter, and the SC
      opening is turned key-slot up as the figure draws its notch. Good to about 0.5 mm.
  top-layout:
    confidence: drawing
    note: >-
      Product Guide Figure 2-3 p26, a plan of the top. GATE 1: outline 1452 x 1460 px for a
      135 x 135 face, square to 0.5 percent, 10.76 px/mm. Four lamps 2.0 mm across in a column
      15.4 mm in from the edge, 12.0 mm apart, 49.5 to 85.6 mm from the front edge. The figure
      is drawn with the back edge at the bottom (the on/off button shows 101.0 mm along it,
      against 100.3 on Figure 2-2); this view has the front edge at the bottom, so the figure
      is turned half a turn and the legends, which read from the back, are printed upside
      down here. The data sheet render shows the same four lamps and legends.
  wordmark:
    confidence: estimated
    note: >-
      The data sheet render shows the vendor wordmark on the top face near the back edge,
      reading from the front. No line drawing shows it, and the render is a three-quarter
      view, so the zone reserved for it is placed by eye: centred across the face, about 11 to
      17 mm from the back edge. Not drawn - a reserved logo zone.
  bottom-layout:
    confidence: drawing
    note: >-
      Product Guide Figure 3-1 p38, a plan of the underside with the keyhole spacing printed:
      85 mm. GATE 1: outline 1769 x 1767 px, 13.10 px/mm from the 135 width, and the two
      keyholes then measure 84.5 mm apart against the printed 85 - three quantities agree.
      Four round feet 11.4 mm across, 25.3 mm in from each edge; two keyholes 7.6 x 12.9 mm,
      25.3 mm in from the sides and centred 64.7 mm from the front edge, round end towards the
      back; a label recess 59.9 x 39.9 mm; one cross-head screw 7.2 mm across; a field of
      short slots across a raised plate about 94 x 97 mm. The figure has the back edge at the
      bottom; this view has it at the top.
  side-layout:
    confidence: estimated
    note: >-
      Figure 2-2 shows five slots in each side wall edge-on, 1.26 mm tall on a 2.37 mm pitch,
      3.5 to 14.3 mm down. How far they run along the side is not on any square-on figure:
      the isometric Figure 2-1 and the data sheet render show them running most of the length,
      and they are drawn from 12 to 123 mm by eye.
  colours:
    confidence: estimated
    note: >-
      From the data sheet render, 851 x 581 px, by counting pixels: the top face is #f7f7f7
      (median of 54,000 px); 1,224 px of the PON adapter are green, median #75ba2b; the top
      legends are a pale grey whose darkest eight percent of pixels read #b9b9b9 at this
      resolution, so the ink itself is darker and is taken as #9a9da1. A render, not a
      photograph of a unit.
  power:
    confidence: datasheet
    note: >-
      Product Guide Table 2-10 p27: maximum power (not to exceed) 7.7 W with the 10G port
      operational, minimum 4.3 W with it idle. The data sheet prints power consumption below
      8.6 W, recorded as a gap. Fed 12 V DC 1 A from a wall adapter (Table 2-2).
  dc-in-rating:
    confidence: datasheet
    note: >-
      Product Guide Table 2-2: fed 12 V DC 1 A from a wall adapter - the `input-voltage` and
      `current-max-a` of the dc-in jack. The guide's block diagram calls it a 12 V barrel and
      states no barrel size; the jack is the library's one nominal `dc-barrel`.
  lamps:
    confidence: datasheet
    note: >-
      Product Guide Table 2-8 pp26-27. POWER green, green flashing while firmware downloads,
      red on a failed start or self test. PON green when ranged and authenticated, flashing
      while synchronising. ALARM red when downstream optical power is out of range or there is
      no frame lock. DATA green at 100M/1G (fast blink 1G, slow 100M), amber at 2.5G (yellow
      until Issue 12), white at 5G, blue at 10G, each flashing on activity. The lamp colours
      drawn are conventional hues for those words, not sampled.
  jack:
    confidence: drawing
    note: >-
      The bare housing: Figure 2-2 draws no lamp window in the RJ-45, the data sheet lists
      only the four top lamps, and the render shows none at 851 px. The DATA lamp on the top
      face is the port lamp.
