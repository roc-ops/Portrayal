format: 1
kind: device
name: sr-1-ac
version: 0.1.0
maturity: modelled
manufacturer: Nokia
model: 7750 SR-1 AC (FP4)
description: >-
  The 2RU, FP4-based Nokia 7750 SR-1 service router, AC chassis (3HE12299AA/BA/CA - the CR,
  ER and HE licences of one chassis, 1.5 Tb/s from revision RB). The control and switching
  (CCM, and the integrated CPM with an IOM5-e) are internal and fixed. The front carries the
  control and management row, the L-shaped honeycomb air intake and, at the bottom, two
  horizontal slots for MDA-e-XP or MDA2-e-XP cards. The rear carries two stacked slots for the
  SR-1 AC PSU (PSU 1 above PSU 2) beside a two-stud safety ground, and four fan trays, FAN 1
  to FAN 4 from left to right as seen from behind. The sibling nokia/sr-1-dc differs only
  at the rear, where a fixed -48 VDC terminal block takes the PSU area.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Written first. (1) SR1 = 7750 SR-1 Chassis Installation Guide 25.10, 3HE22130AAAATQZZA01:
      Figure 4 p47 (front), Figure 5 p48 (rear, AC and DC variants), Figure 6 pp50-52 and
      Table 7 (front LEDs, ports and controls), Tables 4, 29-36 (variants, dimensions, power),
      chapter 10 pp206-211 (LEDs), Figure 34 p106 (top view). Every figure used is VECTOR:
      pdfimages -list finds no raster on pp47-48, 106, and so pdftocairo at 1200 dpi is exact.
      (2) the part contracts of every seated module. No photograph of an SR-1 is staged;
      PUBLIC-SOURCES lists NK/2018-11/7750_SR-1_f.jpg and DS 164728, neither fetched.
  chassis:
    confidence: datasheet
    note: >-
      SR1 Tables 29/30 p89: 3.5 x 19.0 x 24.6 in (8.9 x 48.3 x 62.5 cm), H x W x D, and note 2:
      "Width includes the integrated flanges for rack mounting". The body between the fold lines
      is 440.0 (SR1 Figure 4 at 1200 dpi: body 2222-7966 px, ears 1945-8646, 13.055 px/mm),
      so the flanges are about 21 mm a side and are not drawn. Height 88.9 (2RU); depth 624.8
      (24.6 in, excluding protrusions: note 3). Weight unpopulated: 31.7 lb (14.38 kg), Table 30.
  panel-scale:
    confidence: drawing
    note: >-
      Gate 1. SR1 Figure 4 (front) at 1200 dpi: the body measures 5744 x 1166 px over its
      outer strokes, 13.055 px/mm across and 13.12 down, 0.5 percent apart, so the figure is
      orthographic. Figure 5 (rear, both variants) measures 5739 x 1145 px: 13.04 across,
      12.88 down, 1.2 percent apart; positions on the rear are taken at those per-axis scales.
      Every position below was read on a 1 mm grid laid over those renders and is good to
      about 0.3 mm.
  front-layout:
    confidence: drawing
    note: >-
      SR1 Figure 4 p47, positions in mm from the body top-left: chassis label (lens) 15.0-41.8 x
      9.6-17.2 with "7750 SR-1" / "Service Router" under it; Stat/Pwr lamps (66.4, 8.0/15.1); CF
      1-3 at x 71.9, y 8.0/11.6/15.1; OT and BT at x 77.1; Crit/Maj/Min at x 82.4 (lamps drawn
      2.9 across); DTE/DCE slide switch 87.4-91.2 x 9.5-17.4; Console RJ45 centre (102.9, 11.3);
      Bluetooth lens 114.8-133.5 x 7.2-18.5; a 1 x 4 RJ45 shell 136.0-195.4 x 3.8-18.3 holding
      Mgmt, 1588/SyncE, OES1, OES2 on a 13.97 pitch (jack edges measured 138.5 / 152.3 / 166.3
      / 180.2); ACO/LT button centre (200.2, 11.8); Alarm DB9 shell 209.6-230.4 with standoffs
      at 207.5 / 232.6 (30.9 over both, common/db9-receptacle@1 is 30.8); BITS RJ45 centre
      (246.5, 11.35); 1PPS SMB centre (260.5, 11.9); CF2 slot 267.2-319.7 x 8.7-19.0; the CF3
      hinged cover 319.7-371.9 x 6.1-27.7 with its thumbscrew at (348.8, 21.8); ESD warning
      triangle (376.8, 22.9); legends baseline about 21.0. Intake: a band 63.8-418.2 x
      27.7-43.6, a block 381.4-432.5 x 6.1-43.6 and a strip 418.2-432.6 x 43.6-82.2. ESD jack
      centre (13.5, 77.0). MDA slot 1 printed "1" at (33.2, 81.8), slot 2 "2" at (405.6, 81.5).
  mda-slots:
    confidence: drawing
    note: >-
      SR1 Figure 4 and p53 ("two slots... at the bottom"): both slots 193.0 x 35.4, the MDA
      envelope of the wave-1 conventions, at x 26.8 and 220.3, y 48.4 (the drawn plate outlines
      run 25.7-414.0 over their 1.5 mm strokes). Cards are HORIZONTAL and no bay rotates (SR1
      Figure 55 p166; XP Figure 30). The MDA-e-XP family seats in any SR-1; the MDA2-e-XP family
      only in the 1.5 Tb/s revisions (3HE12298xxRD and higher, 3HE12299xxRB and higher, SR1 p46),
      which accepts cannot express. Figure 4 draws slot 1 with an ME6-100GB-QSFP28 and slot 2 with
      the impedance panel 3HE10312AA, of which one ships with each chassis (SR1 p84). The
      printed slot numbers "1" and "2" lie inside the bay boxes, in the notched lower corners
      every MDA plate leaves open (wings 27 mm tall, conventions section 2), which is where
      Figure 4 shows them readable with a card fitted; L21 reads the bay as a full rectangle.
  front-controls:
    confidence: datasheet
    note: >-
      SR1 Table 7 pp51-52: Console is an RJ45 UART port; Mgmt, 1588/SyncE and OES1 are
      10/100 Mb/s Ethernet (OES1 is the GMPLS-UNI IP control channel, OES2 is reserved for
      future use); ACO/LT is the alarm cut-off / lamp test and Bluetooth pairing button; Alarm
      is a DB9; BITS is an RJ45 clock input; 1PPS is an SMB 50 ohm output; CF2 is a compact
      flash drive and CF3 one behind a hinged cover; DTE/DCE is the console mode switch. The
      Bluetooth lens (key 8) covers the internal transceiver.
  front-leds:
    confidence: datasheet
    note: >-
      SR1 Table 72 pp206-207 (Stat green / green slow blink / amber; Pwr blue; CF 1-3 green,
      amber fast blink, amber; BT green blink / green / amber; OT, Crit, Maj red; Min amber) and
      Table 73 pp208-209 (Mgmt, 1588/SyncE and OES1 link: green 100 Mb/s full-duplex, green
      blinking half-duplex, amber 10 Mb/s, amber blinking; activity green blinking, amber
      blinking on errors; OES2 for future use; BITS amber = configured and no clock, green =
      clock). Which of a jack's two windows is link and which is activity is not stated; led-a
      is taken as link. CF1 is the internal flash, "currently not used", but its lamp is fitted.
      The figure numbers the CF lamps 1-3 INSIDE the lamp circles; those numerals sit under the
      lamp parts and are not drawn. The lamps are drawn 2.9 mm across and are placed as
      common/led-dot@1 (2 mm), the part that fits the 3.5 mm CF pitch. The 1588/SyncE and
      BITS jacks are lamped parts although L76 files timing jacks as bare: Table 73 gives
      both lamps (SyncE link and activity, BITS a clock LED) and Figures 4 and 6 draw two
      windows on each, so the hardware wins over the rule's role heuristic.
  rear-layout:
    confidence: drawing
    note: >-
      SR1 Figure 5 p48, AC rear, seen from behind. PSU slots: the drawn supplies span
      12.8-88.0 x 0.0-42.6 and 43.4-85.2 over their strokes; the 73.7 x 40.6 bays are
      centred on them at x 13.6, y 1.0 and 44.0. Printed "PSU 1" and "PSU 2" to their left at
      y 9.1 and 77.9 (centres). Two-stud safety ground (hex nuts about 7.5 across) at (6.8,
      28.9) and (6.8, 45.0) on a plate 3.0-12.5 x 20.8-60.1, earth symbol at (6.9, 55.5).
  fan-bays:
    confidence: drawing
    note: >-
      SR1 Figure 5 p48 (both variants alike): the four tray outlines run 93.9-178.1, 178.8-262.9,
      263.5-347.6 and 348.2-432.7 across and 0.0-85.8 down, a pitch of 84.8; the stated
      82.8 x 83.1 bays are centred on them at x 94.6 / 179.4 / 264.2 / 349.1, y 1.4. FAN 1-4
      run left to right as seen from behind and are printed on the top of the chassis (Table 6
      key 8; SR1 p161 "numbered 1 to 4 from left to right on the top of the chassis").
  top:
    confidence: drawing
    note: >-
      SR1 Figure 34 p106 (clearance, view from top) prints FAN 4, FAN 3, FAN 2, FAN 1 along
      the rear edge, upside down as read from the front, FAN 1 at the right. The figure is a
      schematic (its body aspect is 0.653 against 0.704), so the legends are placed over the
      fan bays they name rather than where that drawing puts them; y = 0 is the REAR edge of
      the top view (the viewer draws the front at the image bottom). Nothing else is drawn on
      the top in any figure; the isometric Figures 36 and 38 show only screw heads along the
      edges, which are not placed.
  power:
    confidence: datasheet
    note: >-
      SR1 Table 34 p92: the four fan trays and the PSUs combined draw 34 W idle, 410 W at 25C
      (50% line rate), 575 W at 40C and 830 W at 55C (100% line rate), EXCLUDING the
      MDA-e-XP / MDA2-e-XP cards and optics; PSUs run at 90% efficiency. The 830 W is carried as
      the vendor's system figure with that scope; the cards carry their own figures (Table 35)
      and optics are extra. The AC PSU is 1600 W high-line / 1000 W low-line (p73).
  airflow:
    confidence: datasheet
    note: >-
      SR1 p75-76: front intake through the honeycomb vent, rear exhaust through the four fan
      trays; the PSU shelf has its own front-to-rear stream through each supply's fan.
  colour:
    confidence: estimated
    note: >-
      No photograph is staged. A charcoal chassis with a light honeycomb intake is taken from
      the family's dark faceplates and the vendor figures' tints, not observed.
  ground:
    confidence: drawing
    note: >-
      SR1 p72: a two-stud safety ground left of the PSU area / terminal block, for the
      Panduit LCD6-10AH-L two-hole 45-degree lug in the accessory kit. It is drawn as two hex
      nuts in panel decor on a plate, with common/ground-symbol@1 for the printed earth mark:
      common/ carries no bare earthing stud and the studs in the library belong to other
      makers, so no part is borrowed for it.
  sides:
    confidence: drawing
    note: >-
      SR1 Figures 36 and 38 (isometric) draw the right side plain apart from screw heads and
      the optional rear rack bracket; Figure 34 shows no side features. No figure draws the
      left side or the bottom square-on.
