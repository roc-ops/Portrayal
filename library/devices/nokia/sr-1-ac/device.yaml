gaps:
- what: photographs
  scope: [front, rear]
  reason: needs-photo
  note: >-
    No photograph of an SR-1 is staged, so every colour is estimated and the finish of the
    intake, the label lens and the fan guards is unconfirmed.
  wanted: NK/2018-11/7750_SR-1_f.jpg and a rear photograph
groups:
  mda-slots:
    term: Slot
    role: service
    index-origin: 1
    description: >-
      the two MDA slots at the bottom of the front, 1 at the left and 2 at the right,
      for MDA-e-XP or MDA2-e-XP cards; MDA2-e-XP only in the 1.5 Tb/s chassis revisions
      (3HE12298xxRD and higher, 3HE12299xxRB and higher, SR1 p46)
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: 'reaching the router - the RJ45 console, the 10/100 management Ethernet and the two OES control-channel Ethernet ports (OES2 reserved)'
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: 'the clock - the 1588/SyncE Ethernet port, the BITS input and the 1PPS SMB output'
  alarm:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: db9}
    description: the DB9 alarm port for external alarm devices
  controls:
    term: Button
    role: management
    index-origin: 1
    description: ACO/LT - alarm cut-off, lamp test and Bluetooth pairing
  system-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: Stat, Pwr, CF 1-3, OT, BT, Crit, Maj and Min (SR1 Table 72)
  fans:
    term: Fan
    role: service
    index-origin: 1
    description: FAN 1 to FAN 4, left to right as seen from behind; all four must be fitted while powered
    attrs:
      redundancy: '3+1'
      redundancy-note: 'SR1 p75: four redundant variable-speed fan trays; if a single fan fails the remaining fans provide adequate cooling, and the failed tray must be replaced at once'
  psus:
    term: PSU
    role: service
    index-origin: 1
    description: PSU 1 (upper) and PSU 2 (lower), SR-1 AC supplies load-sharing 1+1
    attrs:
      redundancy: '1+1'
      redundancy-note: 'SR1 p73-74: one PSU is required for operation and two for redundancy; two PSUs load-share in a 1+1 configuration and either carries the full load'
  grounding:
    term: Point
    role: furniture
    index-origin: 1
