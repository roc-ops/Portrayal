configurations:
  dual-psu:
    kind: base
    default: true
    description: >-
      Two AC PSUs and four fan trays, as SR1 Figure 5 draws the AC rear - 1+1 redundant.
  shipped-bundle:
    kind: orderable
    description: >-
      The AC chassis as it ships: one AC PSU in slot 1 and the blank plate in slot 2 (SR1
      p47, p73), non-redundant until a second supply is fitted.
    bays:
      psu-2: nokia/sr-1-psu-blank@1
