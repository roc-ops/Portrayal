gaps:
  - what: photographs
    scope: [front, rear]
    reason: needs-photo
    note: >-
      Every figure used is vendor line art and no SR-7 photograph is staged, so colour and
      finish are estimated from a photographed lab SR-12. PUBLIC-SOURCES lists a
      straight-on NK/2018-11/7750_SR-7_f.jpg and an eBay rear shot, neither downloaded.
    wanted: NK/2018-11/7750_SR-7_f.jpg (2880 x 2293) and a rear photograph, staged
  - what: side-top-bottom
    scope: [left, right, top, bottom]
    reason: needs-drawing
    note: >-
      Only isometrics show the sides (p125 Figure 25, p128 Figure 27). The right side carries
      the filtered air intake (p82) and the left side and top the ground receptacles (p128),
      but nothing dimensions them.
    wanted: side elevations or photographs of the sides and top
groups:
  card-slots:
    term: Slot
    role: traffic
    index-origin: 1
    description: >-
      the five horizontal IOM/IMM slots at the top of the front, 1 to 5 top to bottom (rel-pos =
      the printed number). An IOM carries two MDAs, MDA slot 1 at the LEFT and slot 2 at the
      right (SR-7 guide p48). IOM5-e needs fabric-speed-c, which means the -B chassis 3HE10766AA
      with SFM6-7/12 (SR-7 guide p61-64); IOM3-XP and other FP2 cards fail at fabric-speed-b
      and -c. Empty slots take an impedance panel.
  sfm-slots:
    term: Slot
    role: service
    index-origin: 1
    description: >-
      the two bottom module slots A (rel-pos 1) and B (rel-pos 2) for the switch fabric /
      control processor: SFM5-7 + CPM5, SFM6-7/12 + CPM5, or the integrated SF/CPM3-7 /
      SF/CPM4-7. One is required; two give redundancy, and in a redundant system the two
      SF/CPMs must be of the same type (p48). SFM6-7/12 needs the -B chassis 3HE10766AA.
  power-filters:
    term: Filter Bay
    role: service
    index-origin: 1
    description: >-
      the two DC power supply filter bays below slot B, 1 at the left (p48); each filter is
      wired internally to its own rear PEM-3 (p72 Figure 12)
    attrs:
      redundancy: '1+1'
      redundancy-note: 'SR-7 guide p72: each power supply filter feeds its own PEM-3, and one PEM-3 carries the full system while two give redundancy; the filters follow their PEMs'
  pems:
    term: PEM
    role: service
    index-origin: 1
    description: >-
      two horizontal DC PEM-3 bays along the bottom of the rear, PEM 1 at the LEFT as seen from
      behind (p51 keys 4 and 5)
    attrs:
      redundancy: '1+1'
      redundancy-note: 'SR-7 guide p72: one DC PEM-3 can support the full system current requirements without power redundancy; for redundancy two must be installed and powered on at all times'
  fans:
    term: Fan Tray
    role: service
    index-origin: 1
    description: the single Enhanced Fan Tray at the rear, right of the air filter tray (p48)
  air-filters:
    term: Filter
    role: service
    index-origin: 1
    description: the vertical air filter tray at the left of the rear (p48, p86)
  grounding:
    term: Point
    role: furniture
    index-origin: 1
    description: the front ESD plug receptacle at the bottom of the slot-number strip
