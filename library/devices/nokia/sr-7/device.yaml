format: 1
kind: device
name: sr-7
version: 1.0.6
maturity: modelled
manufacturer: Nokia
model: 7750 SR-7
aliases:
  - name: 7450 ESS-7
    kind: vendor
    note: >-
      3HE10766AA boots as ESS-7 via BOF (SR-7 guide p47); the pre-2016 ESS-7 chassis 3HE00245AA
      is the same metal; its front label reads "Ethernet Service Switch" (SR-7 guide p50 Figure 7)
description: >-
  The 8RU Nokia 7750 SR-7 service router (and the 7450 ESS-7, the same chassis booted as a
  switch), a DC-only midplane chassis whose seven module slots lie HORIZONTALLY across the
  front: IOM/IMM slots 1-5 at the top, then the two SF/CPM slots A and B, with the slot
  numbers printed in black boxes down a strip at the left. Below slot B are two bays for the
  DC power supply filters (an optional safety panel covers both). Rear: the vertical air
  filter tray at the left, the single Enhanced Fan Tray beside it and two horizontal DC PEM-3
  bays at the bottom. Air enters at the right side and leaves at the rear. Every card is
  authored horizontal and seated at rotate 0, MDA slot 1 at the left as the guide says.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Written first. 7450 ESS-7 and 7750 SR-7 Chassis Installation Guide 22.7,
      3HE18643AAAATQZZA03 (the SR-7 guide; pages are the printed numbers, which are also the
      PDF pages): p49 Figure 6 (front), p50 Figure 7 (front of the ESS-7 with the safety cover)
      and p51 Figure 8 (rear) are the geometry, p47-48 the models and slot rules, p72-76 power,
      p82 airflow, p93-94 Tables 28-29 the chassis and environmental specifications, p111
      storage, p125 and p128 the rack mounting and grounding isometrics. The figures are VECTOR
      (pdfimages -list on p49-55 finds only small icons), so a 600 dpi pdftocairo render is
      exact. No photograph of an SR-7 is staged. The A02 edition is paginated differently and
      is not cited.
  chassis:
    confidence: datasheet
    note: >-
      p93 Table 28: 14 x 17.5 x 25.5 in (35.56 x 44.45 x 64.77 cm) H x W x D; about 34 kg
      empty, 41 kg with the factory-installed parts (Enhanced Fan Tray, air filter tray,
      impedance panels, two DC PEM-3s and the power supply filters), up to 70 kg loaded; the
      mounting brackets are factory-installed for MID-mounting (p48, p93). 8 RU. Ears are not
      modelled: the face is the 444.5 between the folds.
  panel-scale:
    confidence: drawing
    note: >-
      Gate 1. p49 Figure 6 at 600 dpi: the body folds at px 305.5 and 3015.5, 2710 px = 444.5 mm
      at 6.097 px/mm, and top to bottom 2166 px = 355.3 mm against the stated 355.6 (the
      conventions measured 6.098 across and 6.097 down): orthographic to 0.1 percent. Face frame
      x = (px - 305.5) / 6.097, y = (px - 69) / 6.097. p51 Figure 8: folds at px 264 and 2973.5,
      6.096 px/mm, top at px 125, bottom 355.6. Positions read off row and column profiles and
      a 5 mm grid on the renders, good to about 0.5 mm.
  card-cage:
    confidence: drawing
    note: >-
      Seven horizontal slots on the family's slot unit U = 35.4 from y 23.6: the slot tops
      read along x 100 at 22.6-24.3, 58.2, 92.8-93.8, 129.4, 165.0, 200.7 and 236.2 and the
      stack's bottom at 271.4, a mean pitch of 35.4 (the conventions measured the same). Every
      bay is 425.4 x 35.4 at x 17.2; the drawn cards span x 16.3-443.5, stroke included.
      p48: "The module slots are horizontally oriented ... MDA slot 1 (left slot)", so no bay
      rotates.
  slot-numbering:
    confidence: drawing
    note: >-
      p48: the top slots 1 through 5 are reserved for IOMs; the two bottom module slots, A and
      B, for the SF/CPMs. The chassis prints 1-5, A and B in white on black boxes down the strip
      left of the cage (x 4.3-12.0, each about 7.5 tall), read on p49 at y 29.9, 64.9, 101.5,
      136.8, 173.2, 208.5 and 244.9 - each a few millimetres below its slot's top edge, the
      offset growing from 6.3 to 8.9 down the stack, as drawn. rel-pos is the printed number
      for the card slots and 1 = A, 2 = B for the SF/CPM slots.
  legend:
    confidence: drawing
    note: >-
      p49: "7750 SR-7" over "Service Router" at the top left above slot 1, x 21.6, baselines
      10.3 and 14.9, cap heights about 5.7 and 2.6 mm. The ESS-7 of p50 Figure 7 prints
      "Ethernet Service Switch" instead. The text is set in the bezel colour's contrast, white.
  esd:
    confidence: drawing
    note: >-
      p50 Table 3 key 3, the ESD plug receptacle: a hex-faced jack at the bottom of the slot
      strip, centre (8.3, 262.1) on p49, under the ESD awareness mark (a hand over an earth
      symbol, y 232.9-240) printed above the B box. Drawn with common/esd-jack@1.
  filter-bays:
    confidence: drawing
    note: >-
      p48: "Below slot B are two power supply filter bays that house two DC Power Supply
      Filters". The filter plates measure x 4.3-222.6 and 223.8-441.7, y 283.6-348.0 on p49
      (the conventions' figures), so the bays are 218.2 x 64.5 at x 4.3 and 223.6. The band
      between the cage and the filters (y 271.4-283.3) carries two round fasteners, at
      (14.0, 277.7) and (431.9, 277.7). p50 Figure 7 (the ESS-7) draws one safety panel across
      the whole lower front, 444.5 x 84.0 from the bottom of slot B (y 271.6) to the chassis
      foot, covering the band and both bays; it is modelled as the optional nokia/sr-7-psf-safety-panel@1, mounted only in
      the safety-cover configuration.
  rear:
    confidence: drawing
    note: >-
      p51 Figure 8 as seen from behind: the air filter tray faceplate at the left (x 7.55-74.55,
      y 1.3-306.9; drawn 67.5 wide), the Enhanced Fan Tray beside it (x 75.2-438.4, y 0.9-305.7;
      drawn 364.1 wide; the tray is stated 12.0 H x 14.3 W in, p106), and PEM 1 at the LEFT and
      PEM 2 at the right (keys 4 and 5) along the bottom. The drawn PEM plate runs y 307.8-351.8,
      44.0 tall against the stated 42.7 (p107), so the bays centre the stated 219.5 x 42.7 on
      it at y 308.45-351.15 (310.0 is the terminal-block top, not the plate top). The
      "-48 / RTN / TORQUE 40 lbs-inch" text belongs to the PEM-3 plates. No rear ground point is
      drawn; the ground receptacles are on the left side and the top (p128 Figure 27).
  airflow:
    confidence: datasheet
    note: >-
      p82: "The chassis has a right-side air intake and a rear air exhaust"; air crosses the
      line cards from the filtered right-side vent and leaves through the rear fan tray. p113
      asks for 3 in of clearance at the right side for the intake.
  defaults:
    confidence: drawing
    note: >-
      Bay defaults follow Figure 6 with current-generation stand-ins: the figure draws IOM3-XP
      cards with classic MDAs in slots 1, 2 and 4 (key 5) and impedance panels in 3 and 5 (key
      6), and SF/CPM4 in A and B. Slots 1, 2 and 4 default to nokia/iom3-xp@1. Its MDA
      slots carry the classic MDA impedance panel by the carrier's own default, which is what
      key 7 draws in slot 4 MDA 1; the figure's other classic MDAs are not modelled yet. A and B
      default to nokia/sfm4-7@1.
  power:
    confidence: datasheet
    note: >-
      p94 Table 29: heat dissipation "with worst-case IOM and MDAs" 3750 J/s (12 795 BTU/hr),
      carried as power-max-w with envelope fully-configured; the system safety rating maximum is
      4000 J/s with PEM-3s (13 648 BTU/hr) and 2400 J/s with the older PEMs (8189 BTU/hr). DC
      only: -40 to -72 VDC into two load-sharing PEM-3s, each with one -48 V / RTN terminal pair
      behind a cover and a 100 A breaker; one PEM carries the full system, two give redundancy
      (p72). PEM-3 100A: 4000 W at -40 to -72 V, 4600 W at -46 to -72 V (p95 Table 31). Each
      PEM-3 connects internally to its own front power supply filter (p72 Figure 12). AC sites
      use one split external rectifier shelf with two 5 kW outputs, the OmniOn L21 3HE20676AA or
      the Eltek HM34J (p75-76).
  colour:
    confidence: estimated
    note: >-
      No photograph of an SR-7 is staged. The charcoal bezel, the black numeral boxes and the
      white print are taken from the SR-12 lab photographs (the same family and era) and from
      the figure, whose boxes are drawn black. See gap photographs.
  other-faces:
    confidence: estimated
    note: >-
      Nothing draws a side, the top or the bottom in elevation. p125 Figure 25 and p128 Figure
      27 are isometrics: the latter shows the ground receptacles on the left side near the
      front and on the top, and the right side carries the air intake (p82).
