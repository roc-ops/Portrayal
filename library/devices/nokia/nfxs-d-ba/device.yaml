configurations:
  fant-h-simplex:
    kind: base
    default: true
    description: >-
      One FANT-H BB in NT A, the NT dummy in NT B and dummies in NTIO and every LT slot - the shelf as it
      is ordered before line cards are chosen.
  fant-h-duplex:
    kind: orderable
    description: Two FANT-H BB NT boards, redundant.
    bays:
      nt-b: nokia/fant-h-bb@2
  fant-m-duplex:
    kind: orderable
    description: Two FANT-M (ANSI BA/BB) NT boards, redundant - the migration target.
    bays:
      nt-a: nokia/fant-m@1
      nt-b: nokia/fant-m@1
