gaps:
- what: line-cards
  scope: [lt-1, lt-2, lt-3, lt-4, lt-5, lt-6, lt-7, lt-8, lt-9, lt-10, lt-11, lt-12, lt-13, lt-14, lt-15, lt-16]
  reason: needs-drawing
  note: >-
    Every ANSI-valid LT card the coverage grid lists is modelled and accepted in these slots, except
    FELT-B AC (3FE69486AC), for which no data sheet exists in any staged document. FELT-C is an
    ETSI/MII card and is not accepted by this ANSI shelf. The copper DSL/POTS cards (NDLS, NPOT,
    NIAT, NDPS, NVPS) are out of scope by decision (roc-ops/Portrayal#538).
  wanted: a FELT-B AC unit data sheet
- what: fan-front
  scope: [fan]
  reason: sources-disagree
  note: >-
    The front of the fan area is drawn three ways. This shelf's elevation (3FE65209BAAATQZZA04 Figure
    13, UDS Figures 19 and 22) and HIM R6.9 Figure 40 ("Remove the fan cover") put the ALM lamp about
    127 mm from the cover's left end; HIM Figure 40 adds an Energy Hazard label at the right, which
    the elevation lacks. The BFAN-H data sheet 3FE66546AAAATQZZA03 Figure 2 puts ALM at mid-width
    with three label windows. nokia/bfan-h@1 draws the last, and it is seated unchanged. Which is the
    shipping cover, and whether the cover belongs to the tray or the shelf, is not stated.
  wanted: a photograph of an FX-16 fan area, or a part number for the fan cover
- what: terminal-cover
  scope: [front]
  reason: needs-drawing
  note: >-
    The safety cover over TB1-1 to TB1-4 (UDS Figure 20, HIM Figures 45 and 47) is not modelled; no
    staged document gives it a part number or a dimension.
  wanted: the cover's outline and a part number
- what: rear-top-bottom
  scope: [rear, top, bottom]
  reason: needs-drawing
  note: >-
    No staged document draws the rear, top or bottom of the FX-16 as an elevation; Figure 13's second
    view, captioned "top", is the left side.
  wanted: a rear photograph
- what: side-detail
  scope: [left, right]
  reason: needs-drawing
  note: >-
    The left side in Figure 13 also draws two rows of eight fasteners at mid-height, a row of eight
    under the top edge, four near the bottom and a rectangular opening beside the ground studs (the
    cable opening HIM s6.3.2 mentions). Only the ground studs are transcribed; the right side is
    drawn in no orthographic view.
  wanted: the fastener rows and the opening transcribed; a right-side view
- what: horizontal-airflow
  scope: [fan]
  reason: vendor-silent
  note: >-
    The direction of the air through the shelf is not stated; only the vertical mounting's front-to-
    rear NEBS flow with the baffle kit is.
  wanted: a sentence or airflow figure for the shelf
groups:
  lt-slots:
    term: Slot
    role: service
    index-origin: 1
    description: the sixteen LT (line termination) slots, LT1 to LT8 left of the NT block and LT9 to LT16 right of it (UDS Figure 11)
  nt-slots:
    term: Slot
    role: service
    index-origin: 1
    description: NT A (rel-pos 1) and NT B (rel-pos 2), the two network-termination slots, 30 mm pitch
  ntio-slot:
    term: Slot
    role: service
    index-origin: 1
    description: the NT I/O slot between the two NTs, 25 mm pitch
  fans:
    term: Fan
    role: service
    index-origin: 1
    description: the BFAN-H fan tray under the card cage
  leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the PDBP-C lamps - critical, major and minor office alarms, BAT A and BAT B feed presence, ACO (UDS Table 13)
  controls:
    term: Button
    role: management
    index-origin: 1
    description: the alarm cut-off (ACO) push button on the PDBP-C
  craft:
    term: Port
    role: management
    index-origin: 1
    description: the DB-9 remote craft port at the bottom left (UDS Table 10, RS-232 to the NT)
  timing:
    term: Port
    role: management
    index-origin: 1
    description: >-
      the RJ-45 time-of-day and 1 Hz input (UDS Table 15). The BITS wire-wrap pins and the CO alarm
      micro D-sub are management too, but no library part exists for either, so they are panel decor
      and cannot join a group.
  esd:
    term: Point
    role: furniture
    index-origin: 1
    description: the ESD earth bonding point on the PDBP-C
  grounding:
    term: Point
    role: furniture
    index-origin: 1
    description: the two frame grounding stud pairs, left and right side (HIM Figure 42)
  fasteners:
    term: Screw
    role: furniture
    index-origin: 1
