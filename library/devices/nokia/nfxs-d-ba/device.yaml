format: 1
kind: device
name: nfxs-d-ba
version: 1.0.0
maturity: modelled
manufacturer: Nokia
model: 7360 ISAM FX-16 (NFXS-D BA)
description: >-
  The 14RU ANSI shelf of the Nokia 7360 ISAM FX (Lightspan Access Node FX) GPON/NGPON access node,
  part 3FE65209BA. Its line-termination (LT), network-termination (NT) and NT I/O cards stand
  VERTICALLY in one cage, left to right LT1 to LT8, NT A, NTIO, NT B, LT9 to LT16. Below the cage
  are three bands: the fixed PDBP-C power distribution front (two 70 A dual-pole breakers, the
  Energy Hazard label, the shelf name, the critical/major/minor and BAT A/BAT B/ACO lamps and the
  ACO push button, beside an ESD earth bonding point); the BFAN-H fan tray; and the connector band
  (remote craft port at the bottom left, the four -48 V dual-post terminals TB1-1 to TB1-4 on their
  angled shrouds, the BITS wire-wrap pins, the ToD/1 Hz RJ-45 and the 50-pin CO alarms connector).
  The PDBP-C is built into the ANSI shelf and has no part number of its own, so it is drawn as the
  shelf's own panel, not as a bay. The LT slots take only the LT blank until the line cards are
  modelled (roc-ops/Portrayal#538).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Written first, before any number. (1) NFXS-D BA unit data sheet 3FE65209BAAATQZZA04 (Issue 04,
      R5.6, March 2017) p21 Figure 13 "Front and top view of NFXS-D" - a VECTOR elevation (pdfimages
      lists only the cover logo and three p27 icons for this edition; Issues 01, 02 and 05 carry the
      same art, 22180, as 304 ppi rasters), the geometry source. (2) Lightspan Access Node FX Unit Data
      Sheet Guide 3HH90279AAAATQZZA23 (25.12) chapter 3, NFXS-D BA: card positions (Figure 11, p48),
      pitches, the PDBP-C (s3.4.2, Table 9 front connectors, Table 13 lamps), Figure 22 (p63, the same
      22180 art as a 150 ppi raster) and the dimensions and weight (s3.5.2-3.5.3). (3) 7360 ISAM FX
      ANSI Hardware Installation Manual 3HH12893AAAATCZZA29 (R6.9) chapter 5-6: fan cover and fan unit
      (Figures 40-41, pp101-102), grounding (Figure 42, p107), remote craft port (s6.9). (4) the part
      contracts of every seated card and of nokia/bfan-h, each with its own provenance. No photograph
      of this shelf is staged.
  model:
    confidence: datasheet
    note: >-
      3HH90279AAAATQZZA23 Table 8: 3FE 65209 BA, mnemonic NFXS-D, "FX-16 shelf for ANSI". The data
      sheet 3FE65209BAAATQZZA04 is headed "NFXS-D - 7360 ISAM FX-16 Shelf - version D" and its figure
      is the one the UDS reprints, so both describe the same BA build.
  chassis:
    confidence: datasheet
    note: >-
      3HH90279AAAATQZZA23 s3.5.2: width 499.4 mm, overall over flanges 529.4, mounting centre distance
      515, depth 280, depth from rack mounting plane 246.6, height 622.5; s3.5.3 weight 14.5 kg without
      the fan tray. The data sheet 3FE65209BAAATQZZA04/A05 s1.6.2 prints width 497.4 and a mounting
      centre of 566.7 (larger than the 529.4 flanges, so a misprint). 499.4 is modelled: the drawing
      itself decides it - its flange-hole centres measure 513.4 apart against the 515 stated (0.3
      percent) at the 499.4 scale and 511.3 (0.7 percent) at the 497.4 scale, and its x and y px/mm
      agree to 0.17 percent at 499.4 against 0.24 at 497.4. The body modelled is the metal between the
      flange folds; the flanges (ears) are not drawn, per the method; the drawing puts them at 15.7 mm
      a side, the stated figures at (529.4 - 499.4) / 2 = 15.
  panel-scale:
    confidence: drawing
    note: >-
      Gate 1. Figure 13 rendered at 1200 dpi: the body is 3122 px between the outer edges of its side
      walls and 3898 px from the top plate's outer edge to the bottom edge (the card-guide tabs stand
      5 mm above the top plate and are outside the 622.5). 3122 / 499.4 = 6.2515 px/mm across, 3898 /
      622.5 = 6.2619 down, 0.17 percent apart; the flange extent, 3318 px over 529.4, gives 6.268. So
      the figure is orthographic and every position below is a measurement at about 0.16 mm/px, read
      by connected-component extraction of each feature's box, limited in practice by the drawing's
      0.5 to 3 mm stroke widths. The UDS Figure 22 raster (150 ppi) is the same art and was used only
      to confirm that.
  columns:
    confidence: drawing
    note: >-
      Stated pitches (UDS s3.4.1 "NT cards: 30 mm, NT I/O card: 25 mm, LT cards: 25 mm") placed on
      what the drawing shows. The NT block is centred on the body to 0.1 mm (NT A, NTIO and NT B
      backplane connectors at 221.5 / 249.7 / 276.9 against 222.2 / 249.7 / 277.2 for 30-25-30 about
      the 249.7 centre), so it runs 207.2 to 292.2. The LT blocks do NOT abut it: the drawing draws a
      wall between LT8 and NT A and between NT B and LT9, and three independent series agree that
      each LT block sits about 3 mm out from the NT block - the slot legends (LT1 17.3, LT8 192.7,
      LT9 308.8, LT16 482.5, mirror-symmetric about 249.9), the LT backplane connectors (a constant
      1.4 mm left of slot centre in both blocks) and the card-guide tabs on the top rail (a constant
      2.3 mm right of each slot's left edge in both blocks). LT1-8 are therefore modelled from 4.2 to
      204.2 and LT9-16 from 295.2 to 495.2, leaving 3.0 walls and 4.2 side walls; every legend and
      connector then lands within 1.1 mm of its slot centre. The drawn LT pitch is 24.92 (0.3 percent
      short of 25); the stated pitch is held. The wall width is derived, not stated.
  rows:
    confidence: drawing
    note: >-
      Down the face, from Figure 13 at 6.2619 px/mm: card-guide top rail 0 to 18; the cards between
      the card-latch receivers, whose centre dots are at 23.25 and 417.65 (centre 220.45), so a 405
      card is 18.0 to 423.0; bottom rail with the lower latch receivers and screws 423 to 437; slot
      legend strip 437 to 452.7 (legends 3.0 mm tall, baseline 452.4); a step 452.7 to 460.7; the PDBP-C
      face 460.7 to 505.1 (44.4); a step 505.1 to 510.5; the fan tray 510.1 to 570.1 on the drawing,
      whose plate ends at 558.3 and lower lip at 570.1 - 60.0 against BFAN-H's stated 59.25, so the
      bay is 510.5 to 569.75; the connector band 570.1 to 619.4; the bottom edge 619.4 to 622.5.
  power-band:
    confidence: drawing
    note: >-
      The PDBP-C front, measured on Figure 13 and named from UDS Table 9, Table 13 and s3.4.5.6 and
      Figure 19 (the lamp close-up, same art). Breakers: bezels 113.3-152.8 and 232.9-272.4 x 463.4-485.2
      with a screw tab at the right (screws at 156.05 and 275.65, 474.2), toggles 21.5 x 8.6 at 118.9 /
      238.5, 470.0; legends A/70 FOR LT and B/70 FOR LT under them, OFF and ON printed sideways at the
      ends. The UDS: "two dual-pole (2 x 35 A) circuit breakers, one for EBAT-A and one for EBAT-B,
      each capable of 70 A per branch". Energy Hazard label 164.4-215.0 x 463.3-488.7 with a 14.8 mm
      warning triangle, "-48V 70A" and the DC symbol below it. Model name 7360 ISAM FX-16 centred
      328.95, cap height 4.9. Lamps 6.7 mm across on the drawing, centres x 412.85 (CRITICAL, MAJOR,
      MINOR) and 432.8 (BAT A, BAT B, ACO), y 473.05 / 483.0 / 492.9; ACO push button 12.3 across at
      457.55, 492.9 (UDS s3.4.2 "disconnection push button on the frontplate for ACO switch"). ESD
      symbol 25.8-50.7 x 480.7-499.8; EARTH BONDING POINT disc 28 across at 75.9, 490.5 with a 10.8 mm
      stud boss at its centre; compliance marks (WEEE bin, China RoHS 50, N594 tick) 32.5-64.6 x
      463.6-478.0; panel screws at 9.95, 499.35 and 487.5, 472.35.
  breakers-not-bays:
    confidence: datasheet
    note: >-
      The breakers, lamps and button are fixed parts of the PDBP-C, which is built into the ANSI
      shelf and is not an FRU (the coverage grid: "part number never given; no own UDS"). No
      breaker component exists in std/ or common/, so each breaker is panel decor - bezel, toggle and
      handle - and not a placement; the lamps, the ACO button, the ESD point, the craft port, the
      ToD jack and the screws are common/std parts.
  connector-band:
    confidence: drawing
    note: >-
      Figure 13 and UDS Figure 13 (the 3D callout art, p51) with Table 9 items 1-8. Craft port DB-9
      shell 19.5-48.8 x 587.2-598.1 with jackscrews at 21.65 and 46.65 (25.0 apart, the DB-9 spacing),
      in a printed box 17.1-51.3 x 571.2-600.9 captioned CRAFT PORT - the "bottom left side" HIM s6.9
      names. Power terminals: four dual-post terminals whose studs sit on a line at 30.2 degrees, 15.9
      apart (the 5/8 in dual-hole lug spacing), stud centres (108.7, 592.7) and (122.45, 584.7) for
      TB1-1 and repeating every 58.95 across; the angled shrouds that carry them and their legends
      TB1-1 -48V BAT A, TB1-2 BAT RTN A, TB1-3 BAT RTN B, TB1-4 -48V BAT B are traced as printed
      outlines. Alarm plate 348.1-474.9 x 570.4-607.3: six wire-wrap pins in two columns at 357.45 and
      369.5, rows 586.7 / 592.65 / 598.65, captioned NT-A, NT-B and RING / TIP / FRAME GND (UDS Table
      14: X225-X230, NTB and NTA ring and tip plus two frame grounds); the ToD/1 Hz RJ-45 (Table 15)
      at 392.0, 592.7 under 1 Hz-PULSE; the 50-pin micro D-sub CO alarm connector (Table 16) shell
      425.5-461.3 x 589.3-596.1 in a 53.6 mm flange, under CO ALARMS. The drawing prints TIME OF DAY
      above 1 Hz-PULSE, but its upper half is behind the fan tray's lower lip in the elevation and it
      is not transcribed; NT-A and NT-B are visible and are.
  terminal-cover:
    confidence: datasheet
    note: >-
      UDS Figure 20 (p61) and HIM Figures 45 and 47 show a safety cover, labelled "CAUTION: BEFORE
      REMOVING TERMINAL COVER, DISCONNECT BOTH A AND B POWER SOURCES", that closes over the four
      terminals once cabled. The shelf elevation draws the terminals uncovered, and that is what is
      modelled; the cover has no part number in any staged document (gap).
  fan-cover:
    confidence: datasheet
    note: >-
      Whose is the fan cover? HIM R6.9 Procedure 13 (p101): "Loosen the captive screws of the fan
      cover and remove the cover" (Figure 40), then "Pull the unit out of the fan area by the handles"
      (Figure 41, the bare tray, handle recessed in its side), then "Replace the fan unit cover". The
      FX-16 parts list (s5.2.2) names the shelf and "one fan unit (BFAN-H)" and no cover, and UDS Table
      13 lists the ALM lamp under "Fan unit area front panel LED" in the SHELF chapter. No staged
      document gives the cover a part number or says which item ships it. The BFAN-H's own data sheet
      (3FE66546AAAATQZZA03 Figure 2) draws the tray's front with the cover on, which is why
      nokia/bfan-h already draws that face and why no separate cover is placed here: the bay seats
      the tray and the tray brings its front. BUT the three drawings disagree about that front - see
      the gap fan-front: this shelf elevation and HIM Figure 40 put the ALM lamp about 127 mm from
      the cover's left end, and the BFAN-H data sheet at mid-width, 246.4.
  fan-bay:
    confidence: drawing
    note: >-
      nokia/bfan-h@1 is 493.4 wide (UDS s35.5.1); the body is 499.4, so the tray is centred at x 3.0.
      The drawing's side walls step in to 5.4 and 494.1 at the fan level (opening 488.7), so the tray's
      last 2.4 mm each side run behind the wall lips - a 1 percent disagreement between the stated
      width and the drawn opening, noted rather than resolved.
  ground:
    confidence: drawing
    note: >-
      HIM R6.9 s6.3.1: "the 7360 ISAM FX-16 includes two grounding cable connectors. Each ground lug
      is a 4 AWG, 1/4 in. stud with 1 in. hole spacing" dual-hole lug; Figure 42 (p107) places them
      on the left and the right side at the bottom front. The side elevation in 3FE65209BAAATQZZA04
      Figure 13 (drawn with the front at its right, so the LEFT side) draws the stud pair at 210.5 and
      235.85 from the rear (25.35 apart, the 1 in spacing), 586.85 down, at the same 6.2619 px/mm. The
      right-side pair is modelled as its mirror (56.8 from the front); Figure 42's close-up shows it
      there but in perspective. EACH CONNECTOR IS ONE PAIR (#828, #830): common/ground-stud-pair-1-1-4@1,
      two 1/4 in. (1/4-20) pan-head screws at exactly 25.4, the stud-pair-1 interface's pitch, side by
      side and centred on the drawn pair's midpoint (223.175 from the rear on the left side, 56.8 from
      the front on the right), so the screws land at 210.475 and 235.875, within 0.03 of the drawing.
      Formerly one common/ground-lug@1 turned 90 for the whole pair. A two-hole lug seated on a pair
      leaves its wire to the right of the view: toward the front on the left side, toward the rear on
      the right side; on the hardware that is the installer's choice (#829).
  slot-legends:
    confidence: drawing
    note: >-
      01 to 08, NTA, NTIO, NTB, 09 to 16 printed on the strip under the bottom rail, 3.0 mm capitals,
      baseline 452.4. Placed at the modelled slot centres; the drawing's own legends sit within 1.1 mm
      of them (see columns).
  nt-occupants:
    confidence: datasheet
    note: >-
      The slotmap and coverage grid list FANT-F, FANT-G, FANT-H (AA, BA, BB) and FANT-M as NT boards
      for the FX-16. Of those modelled for ANSI: FANT-H BB (UDS s20.3 "can be used in a Lightspan FX
      shelf") and FANT-M BA/BB (UDS s24, Figure 105 "Position of the FANT-M BA in a Lightspan FX-16
      shelf") are accepted. FANT-H BC is NOT: UDS s21.3 "can be used in a Lightspan FX (FX-8 and FX-4
      only) shelf". The ANSI FANT-F (BC/BD/BF, nokia/fant-f-bd@1) and FANT-G BA (nokia/fant-g-ba@1),
      which the coverage grid places in FX-16/8/4/12, are accepted. The ETSI builds (FANT-H AA/AC, nokia/fant-m-etsi@1) belong to the ETSI shelves.
      The NT dummy 3FE65651AA closes NT B when a single NT is fitted, as on every FX shelf.
  ntio-occupants:
    confidence: datasheet
    note: >-
      The slotmap lists FNIO-A/B/D/E for the FX-16; all four are modelled and accepted. The
      LT/NTIO dummy 3FE65651BA closes the slot when no NT I/O card is fitted.
  defaults:
    confidence: datasheet
    note: >-
      The default build is one FANT-H BB in NT A, the NT dummy in NT B, the dummy in NTIO and in all
      sixteen LT slots, and the BFAN-H. A shelf is never shipped with open slots - the dummies exist
      for airflow and EMC - and FANT-H BB is the current ANSI NT.
  power:
    confidence: datasheet
    note: >-
      The shelf itself draws nothing: every consumer is a card with its own `power-draw-max-w` and the
      fan tray's (nokia/bfan-h: 315 W at full speed). The PDBP-C takes two -48 V feeds through the
      TB1 terminals and protects each with a dual-pole breaker, 2 x 35 A = 70 A per branch (UDS
      s3.4.5.6); the voltage-monitor thresholds are in s3.4.5.4. No shelf-level power envelope is
      stated in any staged document; searched the UDS chapter 3, HIM R6.9 chapter 6 and the coverage
      grid, whose power column reads "n/a".
  airflow:
    confidence: datasheet
    note: >-
      HIM R6.9 s5.2 requires the FX-16 heat and fiber baffle kit and drip tray in a vertical-mount
      installation for NEBS preferred airflow, which it describes as front-in, rear-out; the fan tray
      sits under the cage. The path through the shelf itself is
      not stated in any staged document, so no airflow is declared.
  lifecycle:
    confidence: datasheet
    note: >-
      Searched the staged Nokia corpus for an end-of-sale notice for 3FE 65209 BA and found none; the
      shelf is still chapter 3 of the 2026 Lightspan UDS. Not searched on the web.
  ground-stud-size:
    confidence: datasheet
    note: >-
      HIM R6.9 s6.3.1 gives each of the two grounding cable connectors of the FX-16 as a 1/4 in. stud
      with 1 in. hole spacing, for a 4 AWG dual-hole lug: the `stud-size` of ground-left and
      ground-right, each of which is one pair of studs.
