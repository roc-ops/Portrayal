configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis as the SR-e guide draws it - both control pairs, every IOM-e, a ME10-10GB-SFP+ in
      every MDA-e slot, two -48/-60 VDC supplies and two PSU impedance panels,
      and the fan tray.
  ac:
    kind: orderable
    description: >-
      The same build on AC supplies (3HE09549AA) in place of the DC ones; AC and DC may also be
      mixed (p62).
    bays:
      psu-1: nokia/sr-e-psu-ac@1
      psu-2: nokia/sr-e-psu-ac@1
references:
  - {title: 'Nokia 7750 SR-1e, SR-2e, and SR-3e Chassis Installation Guide 21.10, 3HE 17927 AAAA TQZZA Edition 03', sha256: 26ba13a80c5f99585d898aa7ebdc8a773647b7c88558666490b0629d7671afde}
