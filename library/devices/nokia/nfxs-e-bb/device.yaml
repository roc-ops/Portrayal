format: 1
kind: device
name: nfxs-e-bb
version: 0.1.0
maturity: modelled
manufacturer: Nokia
model: 7360 ISAM FX-8 (NFXS-E BB)
description: >-
  The 8RU ANSI shelf of the Nokia 7360 ISAM FX (Lightspan Access Node FX) GPON/NGPON access node,
  part 3FE64936BB. The eight line-termination (LT) cards, the two network-termination (NT) cards and
  the NT I/O card lie HORIZONTALLY, stacked from the bottom: the general facilities card (NGFC-H), NT
  A, NTIO, NT B, then LT1 to LT8. The BFAN-E fan unit stands at the right-hand end behind a fan cover
  that carries the shelf's name and the slot legends. Cards are authored upright, as the Unit Data
  Sheet guides draw them, and every card bay seats its card with `rotate: 90`, which turns the
  card's top end to the right, as the shelf figure draws it. The LT slots take only the LT blank
  until the line cards are modelled (roc-ops/Portrayal#538).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Written first, before any number. (1) NFXS-E BB unit data sheet 3FE64936BBAATQZZA03 (Issue 03)
      p8 Figure 4 "NFXS-E shelf front and top view" - a VECTOR elevation (pdfimages lists only a
      187 x 96 footer image on the page), the geometry source. (2) Lightspan Access Node FX Unit Data
      Sheet Guide 3HH90279AAAATQZZA23 (25.12) chapter 6: NFXS-E BB card positions, card pitches,
      dimensions and weight, and Figure 36, the same elevation as a 150 ppi JPEG. (3) NFXS-E BB unit
      data sheet 3FE64936BBAATQZZA02, whose dimension list agrees with the UDS. (4) 7360 ISAM FX ANSI
      Hardware Installation Manual 3HH12893AAAATCZZA29 (R6.9) s10.3, Figure 103, the grounding
      connection. (5) Lightspan HW Installation Manual 3HH91853AAAARJZZA08 Figure 158, the fan cover.
      (6) the part contracts of every seated card, each with its own provenance. No photograph of
      this shelf is staged.
  model:
    confidence: datasheet
    note: >-
      3HH90279AAAATQZZA23 chapter 6 is headed "NFXS-E BB - FX-8 shelf" (ANSI), and 3FE64936BBAATQZZA03
      heads every page "NFXS-E BB". The BA build (3FE64936BAAATQZZA02) is the R4.3-R5.3 edition and
      its Figure 4 is the same art; the ETSI NFXS-E AA/AB are separate shelves with the NGFC-E.
  chassis:
    confidence: datasheet
    note: >-
      3HH90279AAAATQZZA23 s6.5.2 and 3FE64936BBAATQZZA02 s1.5.2: width 446.5 mm, overall over flanges
      480.5 mm, mounting centre distance 465 mm, depth 278.3 mm, height 355 mm; UDS s6.5.3 weight 11.2
      kg including the fan. 3FE64936BBAATQZZA03 prints width 485, mounting centre 463 and depth 278
      and dimensions its own drawing "485" over a span wider than the flanges; the Issue 02 and UDS
      figures are taken, and the 485 is not the body. The body modelled is the 446.5 between the
      flange folds; the flanges (ears) are not drawn, per the method, and their extent is
      (480.5 - 446.5) / 2 = 17 mm a side. RU 8 is derived (8 x 44.45 = 355.6), not stated.
  panel-scale:
    confidence: drawing
    note: >-
      Gate 1. 3FE64936BBAATQZZA03 Figure 4 front view rendered at 1200 dpi: the body is 4130 px between
      the outer edges of its side walls and 3296 px from top edge to bottom edge. 4130 / 446.5 = 9.250
      px/mm across and 3296 / 355 = 9.285 down, 0.4 percent apart; the flanges span 4472 px, 9.307
      px/mm against 480.5, 0.2 percent from the vertical. The figure is orthographic and positions
      below are measurements at about 0.11 mm/px, limited in practice by the drawing's 1.5 to 2 mm
      double edge strokes. The eight LT rows repeat at 230.9 px, which is 25.0 mm at 9.236 px/mm -
      the drawing's pitch runs 0.5 percent short of its own 355 mm height, the same disagreement
      the NGFC-H's modeller found in the BA copy (9.282 against 9.231).
  rows:
    confidence: drawing
    note: >-
      Card rows read off Figure 4 along the right-hand ejector column (ejector tops every 230.9 px
      from 145 px) and the rail lines, then set to the vendor's stated pitches (UDS s6.4.1 and
      3FE64936BBAATQZZA03 s1.4.1 "NT cards: 30 mm, NT I/O card: 25 mm, LT cards: 25 mm"). The LT block
      is drawn from 9.2 to 208.0 (198.8, the short pitch above) and is set as 200 mm from 9.0, so LT8
      is 9.0-34.0 and LT1 184.0-209.0. The GFC's face is drawn from 297.8 to 351.9 (502 px, the
      same count the NGFC-H's modeller took off the BA copy) with a 3 mm sill below it to the
      shelf's bottom edge; nokia/ngfc-h@1 is 53.6, so it is seated at 298.0-351.6 and the sill
      decor closes 351.6-355. The NT rows are stacked up from the GFC at their pitches: NT A
      268.0, NTIO 243.0, NT B 213.0, leaving the rail between LT1 and NT B at 209.0-213.0 (UDS s6.5.4
      "an EMC shield is provided between positions NTB and LT1"). The drawing puts the rail's lower
      line at 215.5, so NT B's top is 2.5 mm higher here than drawn: the NT rows on the figure total
      82.8 mm where the stated pitches give 85, and the stated pitches were held.
  columns:
    confidence: drawing
    note: >-
      Across: the side walls are drawn 1.8 mm (left) and 3.2 mm (right) thick. Every card's right
      end - the GFC's top line and the LT ejectors - stops at 4028-4030 px, x 409.7, so each 405 mm
      card is seated from x 4.7 to 409.7; the 4.7 mm strip at the left is the wall and the card
      guides. The fan cover's outline lines have centres 304 px apart, 32.9 mm, exactly BFAN-E's
      stated width (UDS p378), so the fan column is 411.1 to 444.0, and its top and bottom lines put
      it at y 8.8 to 352.4 (343.6, the drawing's short scale again); nokia/bfan-e@1 is 345, centred
      there at 8.1 to 353.1.
  orientation:
    confidence: drawing
    note: >-
      Cards are modelled upright in their own contracts and turned here with `rotate: 90` (clockwise),
      so the card's top end lies at the right. Figure 4 draws the ejectors and ports of every card at
      the right-hand end of its row and the latch at the left, as on the FX-4, and the NGFC-H (which
      only ever lies flat) is authored as it sits and is not rotated.
  slot-legends:
    confidence: drawing
    note: >-
      The slot legends (NTA, NTIO, NTB, 01 to 08) and the shelf name are printed on the fan cover, not
      on the frame - see nokia/fan-cover-fx8@1 - so the frame itself carries no silkscreen in this
      model. Figure 4 draws no printing anywhere else on the front frame.
  nt-occupants:
    confidence: datasheet
    note: >-
      3HH90279AAAATQZZA23 and the ANSI UDS R6.9 list FANT-F, FANT-G, FANT-H (BB and the 125 W BC) and
      FANT-M (BA/BB) as NT boards for the ANSI FX-8, as for the FX-4. FANT-F and FANT-G are not
      modelled yet and are not accepted until they are. The ETSI builds (FANT-H AA/AC,
      nokia/fant-m-etsi@1) belong to the ETSI shelves and are not accepted here. The second NT slot
      takes the NT dummy 3FE65651AA when a single NT is fitted (UDS s12.3/12.4). Accepts copied from
      nokia/nfxs-f-bb, whose note carries the same reading.
  ntio-occupants:
    confidence: datasheet
    note: >-
      FNIO-A and FNIO-D seat in the NTIO slot; the LT/NTIO dummy 3FE65651BA closes it when no NT I/O
      card is fitted.
  defaults:
    confidence: datasheet
    note: >-
      The default build is one FANT-H BB in NT A, the NT dummy in NT B, the dummy in NTIO and in all
      eight LT slots, the NGFC-H and the BFAN-E. A shelf is never shipped with open slots -
      3FE64936BBAATQZZA03 s1.5.4 "All empty slots must be covered with a dummy front plate" - and
      FANT-H BB is the current ANSI NT. The configurations below carry the other NT arrangements.
  ground:
    confidence: estimated
    note: >-
      HIM R6.9 s10.3.1: "the 7360 ISAM FX-8 includes two grounding cable connectors", each for a 4 AWG
      dual-hole lug with 1/4 in holes at 3/4 in spacing; s10.3.2 routes the cable "through an opening
      in the right side of the shelf", and Procedure 36 "to the right side of the shelf and up to the
      middle of the shelf". Figure 103 (p197, 304 ppi raster, perspective) points "Ground cable
      connector" at a two-stud seat at the right-hand front corner, about 0.64 of the way down. The
      position (x 22, centred at y 227) is estimated from that perspective view, and the one seat is
      drawn with common/ground-lug@1 as on the FX-4. Whether the seat is on the side wall or on the
      front edge of it is not settled by the figure.
  right-vents:
    confidence: estimated
    note: >-
      HIM R6.9 Figure 103 and Lightspan HIM Figure 158 draw the right side perforated from just behind a
      front strip to the rear, nearly full height; the field is placed at x 60 to 270 and y 15 to 340
      by eye from those perspective views. Hole size and pitch are not documented.
  power:
    confidence: datasheet
    note: >-
      The shelf itself draws nothing: every consumer is a card with its own `power-draw-max-w` (from
      the Safety Manuals) and the fan unit's. The shelf is powered through the NGFC-H's -48 V DC
      terminals. No shelf-level power envelope is stated in any staged document; searched the UDS
      chapter 6, 3FE64936BBAATQZZA02/A03 and HIM R6.9 chapter 10 "7360 ISAM FX-8 shelf cabling".
  airflow:
    confidence: datasheet
    note: >-
      UDS s6.4.3: the fan unit "provides forced air cooling in the card cage area and provides the
      necessary air flow in the GFC". For the horizontal installation drawn here the fan unit sits at
      the right-hand end and the air crosses the cards; the direction is not stated in any staged
      document, so no airflow is declared.
