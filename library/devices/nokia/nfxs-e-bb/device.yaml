gaps:
- what: line-cards
  scope: [lt-1, lt-2, lt-3, lt-4, lt-5, lt-6, lt-7, lt-8]
  reason: needs-drawing
  note: >-
    The LT slots accept only the LT dummy. The GPON, Multi-PON and point-to-point LT cards (FGLT-A/B/D/E,
    FWLT-A/B/C, FGUT-A, FELT-B/C/D, NELT-B, FPLT-A, FPXT-A/B) are listed in the coverage grid and are
    priority 4 of roc-ops/Portrayal#538.
  wanted: component contracts for the LT cards, authored upright at 25 x 405
- what: nt-f-g
  scope: [nt-a, nt-b]
  reason: needs-drawing
  note: FANT-F and FANT-G are valid NT boards for this shelf and are not modelled yet.
  wanted: nokia/fant-f and nokia/fant-g contracts
- what: nt-row-heights
  scope: [nt-a, ntio, nt-b]
  reason: sources-disagree
  note: >-
    Figure 4 draws the NT rows 82.8 mm tall between the rail and the GFC where the stated pitches
    (30 + 25 + 30) give 85; the pitches were held and the rail drawn 2.5 mm shallower than the figure.
  wanted: a dimensioned drawing of the NT block or a photograph with the rail in frame
- what: side-top-bottom
  scope: [left, top, bottom, rear]
  reason: needs-drawing
  note: >-
    The top view in 3FE64936BBAATQZZA03 Figure 4 draws a column of vents along the left edge and
    fittings along the right; they are not transcribed yet. No staged document draws the left side,
    the bottom or the rear face.
  wanted: the top view transcribed; a photograph of the rear and left side
- what: horizontal-airflow
  scope: [fans]
  reason: vendor-silent
  note: >-
    The direction of the air across a horizontally mounted FX-8 is not stated.
  wanted: a sentence or airflow figure for the horizontal installation
