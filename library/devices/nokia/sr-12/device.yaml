version: 0.1.0
maturity: modelled
manufacturer: Nokia
model: 7750 SR-12
aliases:
  - name: 7450 ESS-12
    kind: vendor
    note: >-
      3HE10768AA boots as ESS-12 (SR-12 guide p45); the pre-2016 ESS-12 3HE02036AA is the same
      metal (p44: "same dimensions and footprint")
description: >-
  The 14RU Nokia 7750 SR-12 service router (and the 7450 ESS-12, the same chassis booted
  as a switch), a DC-only midplane chassis with twelve VERTICAL module slots across the
  front, printed 1 2 3 4 5 A B 6 7 8 9 10: ten IOM/IMM slots with the two SF/CPM slots A and B
  in the middle. Cable-management trays with covers run above and below the card cage, each
  under a strip printing the slot numbers, and the filtered air-intake vent faceplate closes
  the bottom of the front. Rear: a grounding plate across the top carrying two studs, three
  vertical Enhanced Fan Trays and two horizontal DC PEM-3s at the bottom. Every card is
  authored horizontal and seated here at rotate 90 (clockwise), which puts MDA slot 1 at the
  top as the guide says.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Written first. (1) 7450 ESS-12 and 7750 SR-12 Chassis Installation Guide 22.7,
      3HE18644AAAATQZZA03 (the SR-12 guide; pages are the printed numbers, which are also the
      PDF pages): p47 Figure 6 (front) and p49 Figure 7 (rear) are the geometry, p44-46 the
      models and slot rules, p90-91 Tables 25-27 the chassis, environmental and PEM
      specifications, p102 Table 42 the example power budget, p108 Table 45 storage, p128
      Figure 23 the cable-management trays. Both figures are VECTOR: pdfimages -list on p47
      and p49 finds only 16-95 px icons, so a 600 dpi pdftocairo render is exact. (2) The
      owner's lab photographs of an installed SR-12, 2026-09-24
      (working/intake/nokia/7750-sr/photos/lab-2026-09-24, four 1126 x 2000 phone shots in
      perspective; read for ratios, legends and colour only). The A02 edition of the guide is
      paginated differently and is not cited.
  chassis:
    confidence: datasheet
    note: >-
      p90 Table 25: 24.5 x 17.5 x 25.4 in (62.23 x 44.45 x 64.51 cm) H x W x D without the
      cable-management unit, 30.1 in (764.5 mm) deep with it; 56.37 kg empty, about 155.4 kg
      loaded; bracket ears factory-installed to front-mount in a 19 in rack (p46). 14 RU.
      Ears are not modelled: the face is the 444.5 between the folds.
  panel-scale:
    confidence: drawing
    note: >-
      Gate 1, front. p47 Figure 6 at 600 dpi: the flanges measure 3130 px across = 482.5 mm at
      6.487 px/mm, and the body top to bottom 4042 px = 623.1 mm against the stated 622.3, so
      the figure is orthographic to 0.1 percent. Face frame: x = (px - 186.2) / 6.487 from the
      body's left fold (the body centred on the flanges), y = (px - 66) / 6.487 from the top
      edge. Positions were read off column and row profiles and a 5 mm grid laid over the
      render, good to about 0.5 mm.
  rear-scale:
    confidence: drawing
    note: >-
      Gate 1, rear. p49 Figure 7 at 600 dpi measures 6.463 px/mm across (flanges 3119 px =
      482.6) and 6.52 down (4058 px top to bottom for 622.3): the rear figure is drawn about
      1 percent tall, so y was read on its own scale, y = (px - 218) / 6.52, and x = (px -
      168.1) / 6.463.
  card-cage:
    confidence: drawing
    note: >-
      Twelve vertical slots on the family's slot unit U = 35.4 (the IOM4-e and IOM5-e figures
      are 425.45 x 35.4 exactly; the conventions' pitch). The 12 slots measure 424.2 across on
      p47, a pitch of 35.35; the boundaries read at 10.1, 45.3, 80.8, 115.4, 151.8, 186.3,
      222.8, 258.2, 293.2, 329.3, 363.9, 400.3 and 434.4, all within 0.7 mm of 9.9 + 35.4k, so
      the bays sit at x = 9.9 + 35.4k from slot 1 to slot 10 in the printed order. Card tops
      read at y 76.1 along a blank slot and bottoms at 500-501.6, so the bays are 35.4 x 425.4
      from y 75.9 (to 501.3).
  rotation:
    confidence: datasheet
    note: >-
      p46: "Module slots are vertically oriented in the front of the chassis ... MDA slot 1
      (top slot) or MDA slot 2 (bottom slot)". Cards are authored horizontal (MDA slot 1 at
      the left, the Card Stat or 7750 SR CPM5 end at the left) and every card bay is rotate
      90, clockwise: the left end goes to the TOP and the top edge to the RIGHT. The lab
      photographs agree five ways (the conventions' section 4): the IOM4-e's MDA slot 1 is on
      top; ME1-100GB-CFP2 and the IOM4-e tab legend read top to bottom; the lower MDA's Pwr is
      left of its Stat; the MDA-e screw lies near the column's right edge; 7750 SR CPM5 and
      Card Stat are at the top of their columns. A rotated bay's size is the ON-PANEL
      footprint and `at` its top-left corner; the renderer hangs the occupant at the bay
      centre.
  slot-numbering:
    confidence: datasheet
    note: >-
      p46: IOM slots are numbered 1 through 10 and "the two center module slots, labeled A
      and B, are reserved for the SF/CPMs". The chassis prints the order 1 2 3 4 5 A B 6 7 8 9
      10 twice, on a strip above the cage (y 63.1-71.6) and again below it on the lower tray
      cover (y 512.1-520.4), each numeral centred on its slot. rel-pos is the printed number
      for the card slots and 1 = A, 2 = B for the SF/CPM slots.
  slot-strip:
    confidence: photo-measured
    note: >-
      Figure 6 draws the strip grey with white numerals and, over the SF/CPM slots, a dark
      box printing A (x 197.0-205.1) and B (232.4-240.6) each followed by a white box printing
      SFM (205.1-220.4, 240.6-255.9); the strip itself stops at x 19.7 and 426.2. The lab
      photograph shows a dark strip with white numerals, an ORANGE A box and a light grey SFM
      box with dark lettering. The B box is not in frame: an orange edge at the photograph's
      right border, at the height of the A box and about one slot further on, is read as the
      B box and drawn orange too (a reading, not a sighting).
  cable-management:
    confidence: drawing
    note: >-
      Key 1 (twice): the cable-management trays above and below the cage (p128 Figure 23,
      "integral mounting brackets align with mounting holes ... above and below the module
      cage"). Drawn as decor, flat: the top cover x 2.0-442.5, y 8.5-62.0 and the bottom cover
      y 511.5-565.6, corners rounded; a label band shaded on each (x 10.2-434.3, y 19.9-42.4
      and 532.0-554.5); twelve cable slots along the rear edge of each cover, 16.3 wide at a
      32.6 pitch from x 35.2 (profiles at y 11.5 and 562.5 agree to 0.1 mm); and two round
      fasteners on each cover, at (64.7, 47.6) and (379.6, 47.6) on the top one, (64.8, 526.2)
      and (379.9, 506.5) as drawn on the bottom one. The trays stand proud of the chassis
      (Table 25: 30.1 in deep with them against 25.4 without, so up to 119 mm), but how that
      depth divides between tray and cover is not drawn, so no stand-off is modelled. See gap
      cable-tray-depth.
  legend:
    confidence: photo-measured
    note: >-
      "7750 SR-12" over "Service Router" at the upper left of the top cover: Figure 6 sets it at
      x 18.2, baselines 30.7 and 35.0, cap heights 4.9 and 2.8 mm; the photograph prints it in
      white on the charcoal bezel at the same place.
  logo-zone:
    confidence: photo-measured
    note: >-
      The photographed bezel carries an Alcatel-Lucent wordmark and glyph at the upper right
      of the top cover; the current -B chassis prints NOKIA. No vendor logo is drawn; the
      region is reserved.
  ground:
    confidence: drawing
    note: >-
      p49 key 1, "Grounding studs": two hex-nut studs on the plate across the top of the rear,
      centres (22.5, 27.9) and (37.6, 27.9), the nuts 12.4 across corners, with an earth
      symbol in a black box at x 48.5-55.9, y 23.8-31.1. The plate is y 0-49.1, x 4.4-440.1.
      Drawn as decor (chassis metalwork with no part number). Stud length is not documented.
  esd:
    confidence: drawing
    note: >-
      The front ESD plug (p47 key 9) sits in a grey box at x 413.3-438.7, y 603.0-621.5, jack
      centre (420.2, 609.5), which lies on the air-filter vent faceplate (x 3.6-440.6, y
      565.6-622.6 as drawn). The nokia/sr-12-air-filter part draws the plate and leaves its
      honeycomb clear there (x 411.6-434.8, y 37.6-55.5 in the plate's own frame, 415.3-438.5
      and 603.2-621.1 here); the chassis places common/esd-jack@1 on it, centred on the drawn
      jack. Figure 7 draws no rear ESD jack.
  fans:
    confidence: drawing
    note: >-
      Three vertical Enhanced Fan Tray slots across the rear, left to right as seen from behind,
      "The left slot is designated as fan tray #1" (p78). Bays are the tray's stated face,
      139.7 x 447.0 (p104: 17.6 x 5.5 x 8.85 in), at x 9.9 / 151.6 / 293.4 (pitch 141.7),
      y 50.1; the figure draws the plates about 430 between the handle zones and 449.4 of free
      height between the ground plate and PEM 1, which the stated 447.0 fits. p78: trays are
      interchangeable in any fan slot.
  pems:
    confidence: drawing
    note: >-
      Two horizontal DC PEM-3 slots at the bottom of the rear, "The top slot is designated slot
      1" (p46). Bays are the PEM-3's stated face, 425.7 x 51.6 (p104: 2.03 x 16.76 x 9.38 in),
      at x 11.1, y 498.6 and 551.2; drawn about 49 tall between y 500.4 and 551, the second
      ending at 602.7. The stated size is used. The plate below, y 602.8-622.3, is plain.
  defaults:
    confidence: drawing
    note: >-
      Bay defaults follow what Figure 6 draws, with current-generation stand-ins for the
      legacy cards it shows. The figure draws IOM3-XP cards with classic MDAs in slots 1, 3,
      5, 6, 8 and 10 (keys 3 and 5), slot impedance panels in 2, 4, 7 and 9 (key 4) and SF/CPM4
      in A and B. The IOM3-XP and the classic MDAs are not modelled yet, so those six slots default to
      nokia/iom4-e@1 as a PLACEHOLDER (its MDA slots carry the MDA impedance panel by the
      carrier's own default) until nokia/iom3-xp exists and takes them over; A and B default
      to nokia/sfm4-12@1, which is both the figure's card and slot A in the photograph.
  power:
    confidence: datasheet
    note: >-
      No system maximum is stated. p102 Table 42 is an EXAMPLE budget, not an envelope: 6645 W
      worst case for the chassis at high fan RPM with PEM-3s and three fan trays (1185 W), ten
      1-port 100GE CFP IMMs (4250 W), ten CFP optics (240 W) and two SFM5-12 + CPM5 (970 W).
      It is recorded here with that scope and power-max-w is not set from it; p93 notes that
      some FP4 configurations "could exceed the maximum power capability of the chassis".
      Input: DC only, -40 to -72 VDC into two load-sharing PEM-3s, each with two feeds; one
      PEM-3 carries the whole system and two give 1+1 (p77). PEM-3 ratings (p91 Table 27):
      6480 W at -40 to -72 VDC (162 A), 8050 / 8575 / 8837.5 W on narrower ranges (175 A); the
      internal breaker is 175 A. AC sites use two external rectifier shelves, one per PEM: the
      OmniOn L20 3HE20675AA with four 2725 W CP2725AC54TE rectifiers, or the legacy Eltek HM1J
      3HE04172AA with four 2500 W rectifiers (p71-72; p92 Tables 28-29); a shelf's status
      cable 3HE04173AA plugs into the PEM-3's DB-25 (p72).
  colour:
    confidence: photo-measured
    note: >-
      From the lab photographs (warm LED light, so hue relationships, not absolute values):
      a charcoal bezel and tray covers, drawn #34373c; a darker slot strip with white numerals;
      an orange A tag #e8742a and a light grey SFM tag #c8cacc; mid-grey side sheet metal. The
      rear is not photographed, so its colour is the front's, estimated.
  other-faces:
    confidence: estimated
    note: >-
      No staged figure draws a side, the top or the bottom in elevation: p128 Figure 23 is an
      isometric of the rack with the trays, and the clearance figure is a plan outline.
