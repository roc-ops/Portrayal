configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis as it ships and powers on (SR-12 guide p90 note 8: shipped with the Enhanced
      Fan Trays, the air filter tray, impedance panels and the DC PEM-3s installed): both PEM-3s,
      three fan trays, the filter, an SF/CPM4-12 in A and B, and every IOM/IMM slot closed by a
      slot impedance panel.
    part-numbers:
      7750 SR-12: {part: 3HE10768AA}
      7750 SR-12 (pre-2016 chassis): {part: 3HE00104AA}
    bays:
      slot-1: nokia/sr-7-12-slot-impedance-panel@1
      slot-2: nokia/sr-7-12-slot-impedance-panel@1
      slot-3: nokia/sr-7-12-slot-impedance-panel@1
      slot-4: nokia/sr-7-12-slot-impedance-panel@1
      slot-5: nokia/sr-7-12-slot-impedance-panel@1
      slot-6: nokia/sr-7-12-slot-impedance-panel@1
      slot-7: nokia/sr-7-12-slot-impedance-panel@1
      slot-8: nokia/sr-7-12-slot-impedance-panel@1
      slot-9: nokia/sr-7-12-slot-impedance-panel@1
      slot-10: nokia/sr-7-12-slot-impedance-panel@1
  as-drawn:
    kind: example
    description: >-
      The population SR-12 guide p47 Figure 6 draws, with a current-generation stand-in:
      IOM4-e cards in slots 1, 3, 5, 6, 8 and 10 where the figure draws IOM3-XP cards with classic
      MDAs (not modelled yet), slot impedance panels in 2, 4, 7 and 9, and SF/CPM4-12 in A and B. These are
      the bay defaults.
  lab-2026-09-24:
    kind: example
    source: owner lab photographs, working/intake/nokia/7750-sr/photos/lab-2026-09-24
    description: >-
      The owner's installed SR-12 as photographed on 2026-09-24, recording only what the
      photographs show: the 12-port 10GE SFP+ Multi-Core IMM (IMM-2PAC-FP3, 3HE07158) in slot 1;
      slots 2, 3 and 4 open, backplane visible; an SF/CPM4-12 in A and an SFM5-12 carrying a CPM5
      in B (two SF/CPM types, which Nokia does not support as a redundant pair, p46 - recorded as
      observed); and an IOM4-e in slot 6 with an ME1-100GB-CFP2 in MDA slot 1. Its MDA slot 2
      holds an MDA-e whose label is not legible; it is drawn as a second ME1-100GB-CFP2, which is
      a guess. Slots 5 and 7-10 are not in the photographs and show the bay defaults (gap
      unseen-lab-slots). The chassis is the legacy Alcatel-Lucent one, bezel printed 7750 SR-12
      Service Router.
    bays:
      slot-1: nokia/imm-2pac-fp3-p6-10g-sfp@1
      slot-2: ''
      slot-3: ''
      slot-4: ''
      sfm-a: nokia/sfm4-12@1
      sfm-b: nokia/sfm5-12@1
      sfm-b/cpm: nokia/cpm5@1
      slot-6: nokia/iom4-e@1
      slot-6/mda-1: nokia/me1-100gb-cfp2@1
      slot-6/mda-2: nokia/me1-100gb-cfp2@1
