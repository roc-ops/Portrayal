gaps:
  - what: rear-photographs
    scope: [rear]
    reason: needs-photo
    note: >-
      The lab photographs show the front only (slots 1-5, A, B and 6). The rear colour and
      finish, and the ground plate, are read off vendor line art.
    wanted: one straight-on photograph of the SR-12 rear
  - what: cable-tray-depth
    scope: [front]
    reason: needs-drawing
    note: >-
      p90 Table 25 gives the chassis 25.4 in deep without the cable-management unit and 30.1
      in with it, but no figure dimensions how far the trays or their covers stand proud of the
      card cage, so the covers are drawn flat on the face.
    wanted: a side elevation of the chassis with the cable-management trays fitted
  - what: side-top-bottom
    scope: [left, right, top, bottom]
    reason: needs-drawing
    note: >-
      Only isometrics (p125 rack mounting, p128 Figure 23) show the sides; nothing draws the
      top or the underside.
    wanted: side elevations or photographs of the sides
  - what: unseen-lab-slots
    scope: [slot-5, slot-7, slot-8, slot-9, slot-10]
    reason: needs-photo
    note: >-
      The lab photographs cover slots 1 to 6 and A/B; slot 5 is hidden behind cabling and slots
      7-10 are out of frame, so the lab-2026-09-24 configuration does not record them and they
      show the bay defaults.
    wanted: a photograph of the lab chassis's slots 5 and 7-10, and the label of slot 6's MDA 2
groups:
  card-slots:
    term: Slot
    role: traffic
    index-origin: 1
    description: >-
      the ten vertical IOM/IMM slots, printed 1-5 left of the SF/CPMs and 6-10 right of them
      (rel-pos = the printed number). An IOM carries two MDAs, MDA slot 1 at the TOP and slot
      2 at the bottom (SR-12 guide p46). IOM5-e needs fabric-speed-c, which means the -B
      chassis 3HE10768AA with SFM6-7/12 (p61-63); IOM3-XP and other FP2 cards fail at
      fabric-speed-b and -c (p57, p63). Empty slots take an impedance panel (p81).
  sfm-slots:
    term: Slot
    role: service
    index-origin: 1
    description: >-
      the two centre slots A (rel-pos 1) and B (rel-pos 2) for the switch fabric / control
      processor: SFM5-12 + CPM5, SFM6-7/12 + CPM5, or the integrated SF/CPM3-12 / SF/CPM4-12.
      One is required; two give redundancy, and in a redundant system the two SF/CPMs must be
      of the same type (p46). SFM6-7/12 needs the -B chassis 3HE10768AA (p44). An empty slot
      takes an impedance panel.
  fans:
    term: Fan Tray
    role: service
    index-origin: 1
    description: >-
      three vertical Enhanced Fan Tray slots across the rear, 1 at the left as seen from
      behind (p78); the trays are interchangeable and hot-swappable, two fans in each
    attrs:
      redundancy: none
      redundancy-note: >-
        SR-12 guide p84: "Three fan trays are required for normal operation"; p80: a single fan
        failure raises a Critical Fan Failed alarm and the whole tray must be replaced at once,
        and the chassis runs safely without a tray for up to 2 min at 35 C
  pems:
    term: PEM
    role: service
    index-origin: 1
    description: >-
      two horizontal DC PEM-3 slots at the bottom of the rear, 1 at the top (p46). Each PEM-3
      takes two -48 V feeds; the pair load-share and either carries the chassis (1+1, p77).
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        SR-12 guide p77: "One PEM -3 can support the full system's electrical current requirements
        if you are operating the chassis without power redundancy", at least one must be fitted,
        and "For redundancy, you must install two PEM-3s." p69 calls them hot-swappable,
        load-sharing PEM-3s.
  grounding:
    term: Point
    role: furniture
    index-origin: 1
    description: the front ESD plug receptacle at the bottom right, on the air-filter vent faceplate (p47 key 9)
  air-filters:
    term: Filter
    role: service
    index-origin: 1
    description: the air-filter tray at the bottom of the front, whose vent faceplate is the air intake (p81)
