format: 1
kind: device
name: fx8-vertical-air-intake-tray
version: 0.2.0
maturity: modelled
manufacturer: Nokia
model: 7360 ISAM FX-8 vertical shelf mount kit, air intake baffle and drip tray
aliases:
- {name: 3FE 65751 AA, kind: vendor, note: listed for the pre-assembly of the shelf horizontal mounting bracket and this tray; Table 1 does not say which of its two numbers is the tray}
- {name: 3FE 68132 AA, kind: vendor, note: the other number listed for that pre-assembly}
description: >-
  The air intake baffle/drip tray of the 7360 ISAM FX-8 vertical shelf mount kit: the tray that
  hangs under a vertically mounted shelf and takes two rack units of the elevation. A vertical
  mount needs one under every shelf, the bottom one included.
profile: passive
provenance:
  chassis:
    confidence: datasheet
    note: >-
      Nokia 7360 ISAM FX-8 Vertical shelf mount kit unit data sheet (3FE 67300 BAAA TQZZA
      Edition 01), Table 3: the tray is 89.02 mm high, 251.97 mm wide and 350.01 mm long. Read
      as height up the rack, depth, and width across it, which Figure 84 of the 7360 ISAM FX ANSI
      Hardware Installation Manual (3HH-12893-AAAA-TCZZA Issue 29) supports: the tray is a little
      narrower than the 355 mm the shelf stands across the opening.
  units:
    confidence: drawing
    note: >-
      two rack units, read from Figure 84 of the installation manual, where the tray fills the
      two units under the shelf and the next shelf's tray stands 15 units above it; 89.02 mm is
      2.003 units. No table prints the units.
  color:
    confidence: estimated
    note: >-
      the held figures are line art and no photograph is held, so the colour is a neutral metal
      grey and is not a reading.
  parts:
    confidence: datasheet
    note: >-
      the tray comes pre-assembled with the shelf horizontal mounting bracket (25.40 mm high,
      486.41 mm long, Table 3), which the installation manual's step 5 of Procedure 31 fixes to the
      rack; the bracket is not drawn apart from the shelf it carries.
  ears:
    confidence: drawing
    note: >-
      no ears. Figure 84 of the installation manual (printed page 168) draws the tray as an open
      box between the posts, narrower than the opening, with no ear, flange or bolt to a post. It
      hangs under the shelf's bracket.
