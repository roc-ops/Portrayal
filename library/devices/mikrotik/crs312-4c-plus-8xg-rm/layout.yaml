format: 1
kind: device
name: crs312-4c-plus-8xg-rm
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS312-4C+8XG-RM
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS312}
description: >-
  MikroTik CRS312-4C+8XG-RM is a fixed 1U Cloud Router Switch. It has eight 1G/2.5G/5G/10G RJ45 ports and four combo
  ports. Each combo port is a 10G RJ45 jack (1T to 4T) and an SFP+ cage (1F to 4F), one in use at a time. It also
  has a 10/100 management jack (MGMT/BOOT), an RJ45 serial console and a USB type A port. It runs SwOS or RouterOS.
  The front carries the eight 10G jacks in two blocks of four. Beside them are the combo jacks under a blue
  bracket and the two by two SFP+ block. Then come the CONSOLE and MGMT/BOOT jacks, the RESET button and the USB
  port. The USER, FAULT, POWER 2 and POWER 1 lamps follow. The two AC supplies and the four fans are built into
  the chassis, so there are no bays. The air passes through a vent field in the right wall. No document held shows
  the rear, so the rear is not drawn and the AC inlets are not placed.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Dimensions drawing "CRS312-4C+8XG dimensions", MikroTik, printed 20.09.2023 (file
      CRS312-4C8XG_dimensions_230944.pdf, rendered at 200 dpi): front, left side, top plan and isometric. CRS312-4C+8XG-RM
      brochure, MikroTik (file CRS312-4C8XG-RM_220517.pdf; no date is printed, the file name carries a revision stamp):
      specification table, included parts. CRS312-4C+8XG-RM product page, MikroTik
      (https://mikrotik.com/product/crs312_4c_8xg_rm, saved 2026-10-26): dimensions, AC inputs, cooling, ports. Quick
      Guide CRS312-4C+8XG-RM (file CRS312-4Cplus8XG-RM-qg_190711.pdf, revision stamp 190711): powering, ports, combo
      interface, accessories. Studio photograph 1825 (front): the printed legends, colours and counts. The block
      diagram CRS312-4C8XGr2_261038.png. NetBox read as a second opinion only. MikroTik prints no figure numbers. The
      device name spells MikroTik's + as -plus because a directory name cannot carry +; model: keeps the + as printed.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: product code CRS312-4C+8XG-RM, one 10/100 port, eight
      1G/2.5G/5G/10G RJ45 ports, four combo 10G Ethernet / SFP ports, AC 100 - 240 V with a redundant supply, USB type A,
      serial RJ45, 443 x 183 x 44 mm, -30 to +70 C, 60 W maximum power consumption, two IEC cords, a screw and feet kit
      (K57) and rack ears. The product page agrees on the dimensions, the AC input range, 60 W, the ports and the
      -30 to 70 C tested range, and adds two AC inputs and four fans. The two documents disagree on the platform: the
      brochure gives 64 MB RAM and 16 MB flash, the page 128 MB RAM, 32 MB flash and RouterOS v7; both are kept in the
      attrs as worded. The quick guide adds that each combo port has two physical connectors of which only one can be
      used at a time.
  gate-1:
    confidence: drawing
    note: >-
      The drawing's front view body is 1163 px wide in the 200 dpi render for the printed 443 (2.624 px per mm) and
      115 px tall, which reads 43.8 mm for the printed 44, 0.5 percent apart, so every x and y below is taken at 2.624
      px per mm from the body's top-left corner of the front view. The four jacks of a block read a 15.9 mm pitch.
  chassis:
    confidence: drawing
    note: >-
      443 wide, 44 high, 183 deep: the drawing dimensions 443, 183 and 44 and the brochure and the product page print
      the same. The 6 mm the plan dimensions is the two cable loops standing off the rear, an accessory and not part of
      the depth. 443 is the body between the ear folds.
  front-layout:
    confidence: drawing
    note: >-
      From the drawing's front view. Three jack plates 65.3 mm wide, 14.5 mm tall, top at 20.7 mm, at 12.8, 81.7 and
      151.0 mm (69.1 mm step), four jacks each on a 15.9 mm pitch with the first 0.8 mm inside its plate (13.6, 82.7
      and 151.8 mm), top at 21.35 mm. The SFP+ block is 30.4 x 26.7 at 221.3 mm, top 8.7 mm, two cages by two (14.5 x 10.0
      each on a 15.1 mm column pitch and 14.0 mm row pitch, as the registry cage). The console housing holds two jacks, 18.1
      mm wide at 256.3 mm, top 8.9 mm, the upper jack the CONSOLE and the lower the MGMT/BOOT, turned the other way up. The
      RESET button is at 278.8, 31.0 mm, the USB-A port stands on end centred at 287.7, 27.75 mm, and four lamp circles
      at 296.8 mm, 16.3, 21.3, 26.2 and 31.3 mm. The zigzag vent band over the jacks is the drawing's, 18.2 to 211.3 mm, 5.5 to 16.1
      mm.
  legends-and-colours:
    confidence: photo-measured
    note: >-
      Photograph 1825 prints 1 to 8 under the eight jacks, 1T to 4T under the combo jacks, 2F and 4F over the upper
      cages and 1F and 3F under the lower ones, 10G ETHERNET beside each plate, 10G COMBO over the third plate and SFP+
      beside the cages. The combo jacks and cages sit on a light blue bracket. The jack plates read #bcbdbd and the face
      #c4c4ca in the photograph's medians. The positions of the legends are taken from the photograph's proportions and
      are estimated, good to about 1 mm. The USER, FAULT, POWER 2 and POWER 1 lamps are given the lit colours the
      photograph shows (green, red, blue, blue).
  lamps:
    confidence: estimated
    note: >-
      The jacks carry their own two lamps each (the library's Ethernet jack). The quick guide holds no LED table and
      the brochure none, so what a lamp shows is a gap.
  port-numbering:
    confidence: datasheet
    note: >-
      The metal prints 1 to 8 for the 10G jacks and 1T to 4T and 1F to 4F for the combo pairs; the quick guide says
      RouterOS shows them as combo 1 to 4. The copper jacks are named copper-1 to copper-4 and the cages cage-1 to
      cage-4, with the same numbers: the group says they are one port at a time. The upper cage of the left column is
      printed 2F and the lower 1F, so cage-1 is the lower one.
  console:
    confidence: drawing
    note: >-
      The RJ45 serial port (brochure: serial port RJ45) is the upper jack of the housing under the printed CONSOLE; the
      lower jack is the 10/100 management port, printed MGMT/BOOT (brochure: one 10/100 Ethernet port).
  buttons:
    confidence: drawing
    note: >-
      One round button printed RESET (quick guide: the RouterBOOT reset button). Its centre is the drawing's.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The product page lists two AC inputs and four fans; the brochure says it has a dual power supply for redundancy;
      the quick guide says two alternating current inputs with IEC power connectors and four cooling fans with
      automatic speed control. No document held shows a removable supply module or gives a supply part number, so
      the supplies are part of the chassis and there are no bays, as on juniper/ex2300-24t. The fans are inside; the
      only opening the drawing shows for them is the vent field in the right wall.
  rear-layout:
    confidence: estimated
    note: >-
      No held document shows the rear: the drawing has no rear view, its isometric hides the rear, the one studio
      photograph looks at the front, and the NetBox files carry no rear. The rear is left empty and the two AC inlets
      are not placed; no other model's rear is used. The export therefore carries no power port, though the product
      page counts two AC inputs.
  side-layout:
    confidence: estimated
    note: >-
      The drawing's side view is the left wall (plain: a screw, two small holes, ear plate at the front). The isometric
      shows the right wall with a rectangular hexagon vent field; it is not an orthographic view, so the field is
      read as a fraction of the wall (from 25 to 119 mm behind the front, 4.4 to 27.4 mm down) and is estimated, good
      to about 5 mm. The left wall is drawn empty.
  ears:
    confidence: drawing
    note: >-
      Rack ears are in the box (brochure and product page, Included parts: Rack ears; the quick guide: 1U rackmount
      bracket, fitted to both sides with four screws). The drawing's side view shows the ear plate at the front end of
      the body, on the face, and the plan shows no ears (443 is the body), so the shipped position is flush. The K57
      kit is a screw and feet kit and not a rack kit, so no kit is listed. The ears are not drawn.
  colour:
    confidence: photo-measured
    note: >-
      median of photograph 1825's face (#c4c4ca); the jack plates are the photograph's #bcbdbd.
