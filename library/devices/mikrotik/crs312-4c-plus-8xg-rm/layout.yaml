gaps:
- what: rear-face
  scope: [rear]
  reason: needs-drawing
  note: >-
    No held document shows the rear: no rear view in the dimensions drawing, none in the one studio photograph, none
    in the NetBox files. The rear is left empty and no AC inlet is placed, so the DCIM export carries no power port.
    The product page counts two AC inputs.
  wanted: A rear photograph or drawing showing the two AC inlets.
- what: left-wall
  scope: [left]
  reason: needs-drawing
  note: >-
    The drawing's side view shows the left wall as plain (a screw and two small holes), and it is left empty.
  wanted: none
- what: right-wall-vent
  scope: [right]
  reason: needs-drawing
  note: >-
    The right wall's vent field is read off the drawing's isometric view, which is not orthographic, so its size and
    position are estimated.
  wanted: A right side view of the unit.
- what: platform-figures
  scope: [front]
  reason: sources-disagree
  note: >-
    The brochure gives 64 MB RAM and 16 MB flash; the product page gives 128 MB RAM and 32 MB flash. Both are kept in
    the attrs as worded.
  wanted: MikroTik's statement of which revision is current.
- what: usb-generation
  scope: [front]
  reason: vendor-silent
  note: >-
    The brochure and the product page say USB type A, with a 1 A maximum, and state no USB generation. The port is
    drawn with the library's USB-A part, whose tongue is its default blue; photograph 1825 shows a pale tongue, so the
    colour is not the photograph's.
  wanted: MikroTik's USB generation for the port.
- what: led-states
  scope: [front]
  reason: vendor-silent
  note: >-
    Searched the brochure, the product page and the quick guide for an LED table: none. The lamps carry the component's
    own vocabulary and no meaning is stated for the jack lamps or for USER, FAULT, POWER 2 and POWER 1.
  wanted: MikroTik's LED description for the CRS312-4C+8XG-RM.
- what: weight
  scope: [front]
  reason: vendor-silent
  note: >-
    Neither the brochure, the product page nor the quick guide gives a weight.
  wanted: MikroTik's weight.
- what: eol
  scope: [front]
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so no lifecycle is
    written.
  wanted: none
