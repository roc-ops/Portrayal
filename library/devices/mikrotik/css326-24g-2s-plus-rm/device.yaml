  controls: {term: Button, role: management, index-origin: 1, description: the RES reset button}
  status-leds: {term: LED, role: indicator, index-origin: 1, description: the PWR and USR lamps}
  furniture: {term: Item, role: furniture, index-origin: 1}
  inlets: {term: Inlet, role: service, index-origin: 1}
