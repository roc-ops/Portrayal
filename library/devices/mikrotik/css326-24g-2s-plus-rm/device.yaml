format: 1
kind: device
name: css326-24g-2s-plus-rm
version: 1.0.2
maturity: modelled
manufacturer: MikroTik
model: CSS326-24G-2S+RM
portfolio: {line: Switches, family: Cloud Smart Switch, series: CSS326}
description: >-
  MikroTik CSS326-24G-2S+RM is a fixed 1U Cloud Smart Switch. It has 24 10/100/1000 Ethernet ports and
  two SFP+ cages, and runs SwOS only. The front carries the 24 jacks in three blocks of four columns by
  two rows. They are numbered 1 to 24 as printed, with the odd number on the lower jack of a column. Port
  1 is marked POE IN for passive PoE power. A lamp with the port number printed on it sits under each
  jack. The front also has the two SFP+ cages with their ACT/LINK and 10G lamps. It has the PWR and USR
  lamps and the RES reset button, and no console jack. The rear carries the DC jack (DC 8 - 30V as printed),
  a cable-restraint slot, the earthing stud and the vents. There is no built-in mains supply: a 24 V 1.2
  A adapter ships in the box, so there are no power bays. The round opening on the rear is a stamped fan-guard
  grille with four fan-mount holes and no fan fitted. The product page lists passive cooling, so no fan
  is drawn. The CRS326-24G-2S+RM is the sibling with RouterOS and a console jack and is its own device.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Dimensions drawing "CRS/CSS326-24G-2S+ dimensions", MikroTik, printed 19.09.2023 (file CRS_CSS326-24G-2S_dimensions_230943.pdf,
      rendered at 200 dpi; the title block reads CRS/CSS326-24G-2S+ dimensions): front, side, top plan
      and isometric. Its front view prints Cloud Smart Switch and CSS326-24G-2S+RM, so it is this device's
      own front. CSS326-24G-2S+RM brochure, MikroTik (file CSS326-24G-2SRM_220222.pdf; no date is printed,
      the file name carries a revision stamp): specification table, features, included parts. CloudSmartSwitch
      326 quick guide, MikroTik (file CSS326_230404.pdf; every page prints "Document #49066 Modified on:
      26.APR.2019"): powering, extension ports, reset button. CSS326-24G-2S+RM product page, MikroTik
      (saved 2026-10-26): dimensions, powering, cooling type, included parts (rack ears). The product-page
      studio photographs 1267 (front, straight on) and 1268 (rear). No figure numbers: MikroTik prints
      none. The device name spells MikroTik's + as -plus because a directory name cannot carry +; model:
      keeps the + as printed, and every MikroTik device name in the library does the same. The port numbers
      are printed inside the lamp boxes on the metal; silkscreen is painted under a placed lamp, so they
      are drawn just under each lamp instead, 4.5 mm below its centre.
  separate-device:
    confidence: datasheet
    note: >-
      The CSS326 is its own device and not a configuration of the CRS326. MikroTik's CRS326 brochure calls
      the CRS "a special version of the CSS326-24G-2S+RM switch, with added RouterOS as a second boot
      option", and the two brochures list different hardware: switch chip 98DX3236A1 against 98DX3216A1,
      16 MB flash against 2 MB, -40 to +60 C tested against -20 to +70 C, 24 W against 19 W, and a serial
      RJ45 on the CRS only. They have their own product codes and pages. The two fronts differ in a part
      (the console jack), and one drawing and one set of metalwork serves both.
  datasheet:
    confidence: datasheet
    note: >-
      The CSS326-24G-2S+RM brochure is MikroTik's datasheet for the model (the product page's Brochure
      link): product code, 98DX3216A1 switch chip, 2 MB flash, 24 10/100/1000 ports, two SFP+ cages, SwOS,
      10 - 30 V input by jack or passive PoE, 443 x 144 x 44 mm, -20 to +70 C tested, 19 W maximum; the
      features list and the included parts (24 V 1.2 A adapter, rack ears, screw set). The 19 W is unqualified,
      so it is filed as the maximum; the quick guide states the same 19 W.
  gate-1:
    confidence: drawing
    note: >-
      The drawing's front view body is 1744 px across at 200 dpi for the printed 443 (3.937 px per mm)
      and 176 px down for 44.5 (3.955 px per mm), 0.5 percent apart, so it is orthographic and every x
      and y below is taken at 3.94 px per mm from the body's top-left corner. The jack pitch then reads
      55 px = 13.97 mm, the registry's ganged RJ-45 pitch, on a quantity the scale never saw.
  chassis:
    confidence: drawing
    note: >-
      443 wide, 44.5 high (the 1U pitch is 44.45), 144.6 deep. The side view dimensions 144.6 and the
      brochure and product page round it to 144 (443 x 144 x 44 mm); the drawing's figure is carried.
      The 11 mm the side view dimensions is the earthing stud's wing nut standing off the rear, not part
      of the depth. 443 is the body between the ear folds (the top plan shows no ears).
  front-layout:
    confidence: drawing
    note: >-
      From the drawing's front view. Three jack blocks, each a 59.9 x 25.5 plate at 36.7, 100.3 and 163.8
      mm (63.5 mm step), four columns of two jacks on 13.97 mm pitch, first jack centre 46.1 mm; the upper
      row is 13.4 mm above the lower and the upper jacks' latch notch is up, the lower's down. The SFP+
      cages are 15.7 mm wide at centres 238.5 and 260.2 mm (21.7 mm apart), top at 25.0 mm. The lamp band
      along the bottom starts at 35.4 mm. The square the drawing keeps empty at the left of the first
      block is blank on the CSS326's photograph and nothing is drawn there. Colours are medians of the
      straight-on studio photograph (plate #dadada, jack plates #bebebe, lamp band #8f8f8e).
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed numbers 1 to 24 in lamp boxes under the jacks, a pair under each column, left box first
      (1 2, 3 4 ... 23 24). Which jack takes which number is read from the POE IN bracket, which the drawing
      and the photograph both wrap round the lower left jack: port 1 is the passive PoE input (quick guide:
      the first Ethernet port accepts passive PoE input), so the lower jack of each column takes the odd
      number and the upper the even. No source prints a number on the jack itself. The pair's left lamp
      is taken as the odd port's and the right as the even port's; that pairing is estimated.
  lamps:
    confidence: photo-measured
    note: >-
      Each port has one lamp box, 3.2 mm square at 5.9 mm spacing, pair centre 0.6 mm left of the column
      centre (drawing, four pairs measured), centre 38.0 mm. PWR and USR are lamps at 17.2 and 32.8 mm.
      Each SFP+ has an ACT/LINK lamp under the cage centre and a 10G lamp 10.6 mm to its right, joined
      to the cage by a printed line. The lamp cutouts are square, as the placed common/led-sq is. The
      quick guide says the reset button is held until the lamp flashes, and gives no LED table, so no
      lamp carries states beyond the component's own.
  reset:
    confidence: photo-measured
    note: >-
      RES is a round hole at 25.0 mm, centre 38.0 mm, between PWR and USR; the quick guide's reset section
      says to hold the button during boot until the LED flashes to reset SwOS and load the backup software.
      The library's recessed pinhole is used.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - positions off the rear photograph 1268, 6.46 px per mm across the 443 mm body. It looks
      slightly down on the rear, so y is estimated: the vertical scale is 8 percent shorter than the horizontal,
      and the y values use it. Good to about 1 mm in x and 2 mm in y. The earthing stud has a wing nut
      (the drawing's 11 mm); it is drawn as chassis art at the stud's position from the photograph, because
      the library's common/ground-stud draws a hex nut and a lug seat the stud does not have; the gap
      `earth-stud-part` asks for a wing-nut stud part. The CSS prints no earth symbol. Its cable slot
      is the short one (31 mm) and the DC jack sits to its right, which is the CRS's jack inside a longer
      slot. The DC jack is the placed common/dc-barrel (`dc-in`), its bore centred on the photograph's.
  dc-input:
    confidence: photo-measured
    note: >-
      The brochure lists the input as 10 - 30 V (jack or passive PoE); the quick guide gives 11-30V DC
      for the jack and for the first Ethernet port; the product page 10-30 V; the rear prints DC 8 - 30V.
      The four disagree and none is the others' scope: the rear legend is drawn as printed and the other
      ranges are in attrs. The quick guide describes the jack as 5.5 mm outside and 2 mm inside, female,
      pin positive plug; that is the one barrel size held for any placing device, and it stays here and
      not in the interface, which claims no size. The jack is the placed common/dc-barrel (`dc-in`), positioned
      on the bore of photograph 1268.
  dc-in-rating:
    confidence: datasheet
    note: >-
      The rear prints "DC 8 - 30V" beside the jack (photograph 1268): the `input-voltage` of the dc-in
      jack, carried as printed. The brochure's Included list gives a 24 V 1.2 A adapter, the `current-max-a`.
      The brochure's 10 - 30 V and the quick guide's 11-30V are in `attrs.power`. The quick guide states
      5.5 mm outside, 2 mm inside, pin positive: a barrel size, which is not carried as an attribute,
      the jack being the library's one nominal `dc-barrel`.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Powering is by the DC jack or by passive PoE on port 1, with a 24 V 1.2 A adapter in the box (brochure,
      Included); no power supply is built in, so none is drawn and there are no power bays. The product
      page gives the cooling type as passive. The round opening on the rear is a stamped fan-guard grille
      with four fan-mount holes and no fan fitted, so it is drawn as a vent and not a fan.
  ears:
    confidence: drawing
    note: >-
      Rack ears are in the box (brochure and product page, Included: Rack ears, Screw set). The drawing's
      side view shows the ear plate at the front end of the body, on the face, so the shipped position
      is flush, and the straight-on photograph 1267 shows the ear plates flush with the face; the top
      plan shows no ears (443 is the body). The ears are not drawn.
  colour:
    confidence: photo-measured
    note: 'median of the straight-on photograph 1267: body #f5f5f5, face #dadada.'
attrs:
  power:
    power-max-w: 19
    power-input: >-
      DC jack, 10 - 30 V (brochure); 11 - 30 V (quick guide); the rear prints DC 8 - 30V. Passive PoE
      on port 1, 11 - 30 V (quick guide)
    power-adapter: 24 V 1.2 A, in the box
  thermal: {cooling: passive (product page); no fan}
  environmental: {operating-temp-c: -20 to 70 (tested)}
  platform: {switch-chip: 98DX3216A1, storage: 2 MB flash, os: SwOS}
  features:
    vlan-limit: IEEE 802.1Q, up to 250 VLANs
    optics-sfp-plus: >-
      brochure: the SFP cage supports both 1.25 Gb SFP and 10 Gb SFP+ modules; quick guide: 10G SFP+,
      1.25G optical fibre or copper Ethernet modules
  compliance: {certification: 'CE, EAC, RoHS'}
chassis:
  width: 443.0
  height: 44.5
  depth: 144.6
  ru: 1
  color: '#dadada'
  ears:
    positions:
    - {name: flush, at: 0, default: true}
  power: dc
gaps:
- what: earth-stud-part
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The earthing stud has a wing nut (photograph 1268; the drawing's 11 mm). common/ground-stud draws
    a hex nut and a lug seat, so the stud is chassis art and exports no earth. The reason is the nearest
    the schema has: the part itself is what is missing, and the library has no `needs-part` reason.
  wanted: A wing-nut earth stud part, so the stud is placed and not drawn as chassis art.
- what: led-states
  scope:
  - front
  reason: vendor-silent
  note: >-
    Searched the brochure, the CSS326 quick guide and the product page for an LED table: none. The lamps
    carry the component's own vocabulary and no colour or meaning is stated.
  wanted: MikroTik's LED description for the CSS326.
- what: rear-elevation
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The dimensions drawing has no rear view; the rear is read off studio photograph 1268, which looks
    slightly down on it, so the y positions are estimated.
  wanted: A dimensioned rear view.
- what: weight
  scope:
  - front
  reason: vendor-silent
  note: >-
    Neither the brochure, the quick guide nor the product page gives a weight; the NetBox device type
    for the CSS326 gives none either.
  wanted: MikroTik's weight.
- what: eol
  scope:
  - front
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so
    no lifecycle is written.
  wanted: none
