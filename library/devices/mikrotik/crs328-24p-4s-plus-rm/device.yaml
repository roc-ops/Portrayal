name: crs328-24p-4s-plus-rm
version: 2.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS328-24P-4S+RM
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS328}
description: >-
  MikroTik CRS328-24P-4S+RM is a fixed 1U Cloud Router Switch with PoE out. It has 24 10/100/1000 Ethernet
  ports that supply PoE (802.3af/at, or 26 V or 53 V passive, chosen per port). It also has four SFP+
  cages and an RJ45 serial console, and runs SwOS or RouterOS (dual boot). The front carries the 24 jacks
  in three blocks of four columns by two rows under an orange PoE-out band. A pair of lamps sits above
  each column and another pair below it, each lamp numbered. The four SFP+ cages are a block of two by
  two with a numbered lamp under each. The front also has the CONSOLE jack, the RESET and MODE buttons
  and the PWR, USR, FAN and PoE lamps. The 500 W AC supply and the two fans are built into the chassis,
  so there are no bays. The fans draw through grilles in the right wall. No document held shows the rear,
  so the rear is not drawn and the AC inlet is not placed.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Dimensions drawing "CRS328-24P-4S+ dimensions", MikroTik, printed 19.09.2023 (file CRS32824P4S_dimensions_230947.pdf,
      rendered at 200 dpi): front, right side, top plan and isometric. CR328-24P-4S+RM brochure, MikroTik
      (file CR328-24P-4SRM_250801.pdf; MikroTik's file name reads CR328; no date is printed, the file
      name carries a revision stamp): specification table, quick specifications. CRS328-24P-4S+RM product
      page, MikroTik (https://mikrotik.com/product/crs328_24p_4s_rm, saved 2026-10-26): AC inputs, PSU
      slots, maximum power, cooling, PoE out, included parts. Studio photographs 1493 (front, from above)
      and 1494 (three-quarter front, the right wall with a fan grille): colours, the printed legends and
      counts. The block diagram CRS328-24P-4S_240414.png (ports Ether 1-8, 9-16, 17-24 and SFP+ 1 to 4).
      The saved quick guide page for the G1 CRS series lists this model and holds no figures. NetBox read
      as a second opinion only. MikroTik prints no figure numbers. The device name spells MikroTik's +
      as -plus because a directory name cannot carry +; model: keeps the + as printed.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: product code CRS328-24P-4S+RM, CPU 98DX3236
      800 MHz, 512 MB RAM, 16 MB flash, 24 10/100/1000 ports, four SFP+ cages, SwOS / RouterOS (dual boot),
      100 - 240 V input, two fans, 443 x 300 x 44 mm, -20 to +60 C tested, 44 W, serial RJ45; a 100 -
      240 V AC 500 W built-in supply, 450 W guaranteed for PoE (3 x 150 W per eight ports), up to 30 W
      per port at high voltage and 26 W at low voltage. The brochure's 44 W is printed "without PoE devices
      connected"; the product page gives 44 W as "without attachments" and 494 W as the maximum, which
      is that 44 W plus the 450 W PoE budget. Each figure is filed as the document words it.
  gate-1:
    confidence: drawing
    note: >-
      The drawing prints no height. The front view's body is 1864 px wide in a 1.6 times enlargement of
      the 200 dpi render for the printed 443 (4.208 px per mm) and 190 px tall, which reads 45.2 mm over
      the lip lines; the side view is 1709 px for the printed 298 (5.735 px per mm) and 254 px tall, 44.3
      mm, the figure the sister drawings of the CRS354 print. The side view's 44.3 is carried and the
      brochure's 44 is its rounding. Every x and y below is taken at 4.208 px per mm from the body's top-left
      corner of the front view.
  chassis:
    confidence: drawing
    note: >-
      443 wide, 44.3 high, 298 deep. The brochure and the product page print 443 x 300 x 44 mm; the drawing's
      298 is carried and the 300 is declared a conflict, the 2 mm being the cable-management loop and
      the front lip. The 7 mm the drawing dimensions is a loop standing off the front, an accessory and
      not part of the depth. 443 is the body between the ear folds (the top plan shows no ears).
  front-layout:
    confidence: drawing
    note: >-
      From the drawing's front view. Three jack plates, each 59.9 x 26.1 at 63.0, 133.3 and 203.7 mm (70.3
      mm step), top at 11.6 mm, four columns of two jacks on the 13.97 mm registry pitch (55.9 mm for
      four, so the plate's 59.9 holds them with 2.0 mm each side), first jack at 66.05 mm; the lower row's
      jack centre line is 14.1 mm below the plate top and the upper row 13.4 mm above it; the upper jacks'
      latch notch is up, the lower's down. The SFP+ block is 30.2 x 26.4 at 274.7 mm, top 11.2 mm, two
      cages by two, each cage opening 14.5 x 10.0 (registry) on a 15.1 mm column pitch and 14.0 mm row
      pitch. The CONSOLE jack is the drawn 15.9 x 12.6 square at 311.8 mm, 25.2 mm, and the registry jack
      is centred in it. The two round buttons are drawn 4.3 mm across at centres 332.7 and 342.7 mm, 33.3
      mm. The orange PoE-out band and the plate colours are the photograph's medians (band #e9b159, plate
      #bcbdbd, face #e9e9e9).
  poe-band:
    confidence: estimated
    note: >-
      estimated - the drawing shows no band. Measured on photograph 1493 against the front plate edges,
      which the drawing fixes, at the render's 4.5 px per mm across the face; the photo looks down, so
      y is taken at the face's 0.82 compression. The band is a frame on the tops of the three plates and
      down the left of the first. Its top bar is 4.0 mm deep, from 7.6 mm to the plate tops at 11.6 mm,
      and runs from the first plate's left edge (63.0 mm) to the third plate's right edge (264.0 mm),
      across the two gaps, and the numbered upper lamps sit on its top edge. At the left it widens into
      a wing 8.9 mm wide at the top (54.1 to 63.0 mm) whose outer edge slants inward to 61.5 mm at the
      plates' foot, 37.7 mm. The wing carries the 26 V, 53 V and PoE out lamps and legends; it is drawn
      in three pieces (above the lamps, a strip behind them, below them) so no printed piece lies under
      a lamp. The edge positions are read to about 1 mm.
  lamps:
    confidence: estimated
    note: >-
      estimated - the drawing shows no lamp. They are read off photograph 1493, which looks down on the
      face (its face is 0.82 of the true height), so x is taken across the face at 4.145 px per mm and
      y is estimated. Above each column of two jacks sit two lamps, and below it two more, each printed
      with a number: 1 2 3 4 5 6 7 8 above and the same below for the first eight ports, then 9 to 16
      and 17 to 24. So every port has a lamp above and a lamp below, both numbered with the port. The
      lamp pair is 5.8 mm apart, centred 0.5 mm left of the column, the upper lamp centre at 7.0 mm and
      the lower at 41.0 mm. The numbers are printed inside the lamp boxes; silkscreen is painted under
      a placed lamp, so they are drawn just above the upper lamp (4.6 mm) and just above the lower one
      (39.0 mm). On the band's left wing are three round lamps (2.0 mm, the library's led-dot) at centres
      55.9, 58.8 and 61.6 mm, 10.4 mm down, read off photograph 1493 at 4.5 px per mm across the face:
      the first is green, the second red and the third black, under the legends 26 V, 53 V and PoE out.
      The green and red are given as the lamp's lit colour (#22c55e, #ef4444); the black one is unlit.
      The legends are 1.8 mm, turned to read upward as printed, the largest the 2.9 mm lamp pitch allows.
      The quick guide G1-b holds no LED table and the brochure none, so what the three lamps show is a
      gap. Under the console are four lamps PWR, USR, FAN and PoE at 309.9, 317.0, 323.9 and 330.9 mm,
      the FAN and PoE pair on an orange strip headed FAULT. No document held says what a lamp shows.
  port-numbering:
    confidence: estimated
    note: >-
      estimated - the metal prints a number only on the lamps. Which jack of a column takes which number
      is not printed, and no held document says (the block diagram gives only Ether 1-8, 9-16 and 17-24
      as the three blocks). The pilot's convention is followed: the lower jack of a column takes the odd
      number, the upper the even, and the left lamp of a pair is the odd port's. The four SFP+ cages are
      printed 1 and 2 under the left column and 3 and 4 under the right; which cage of a column takes
      which number is not printed either, and the upper cage is taken as the lower number.
  sfp-plus:
    confidence: drawing
    note: >-
      Four SFP+ cages (brochure: SFP+ cages 4; block diagram SFP+ 1 to 4) in a block of two by two. The
      rotated legend SFP+ is on the right of the block. The cage is the registry's std/sfp, which also
      takes 1.25 Gb SFP.
  console:
    confidence: drawing
    note: >-
      The RJ45 serial port (brochure: Serial port RJ45) is the shielded jack under the printed CONSOLE.
      The brochure and the product page list no separate 10/100 management port for this model, and the
      front has none.
  buttons:
    confidence: photo-measured
    note: >-
      Two round buttons printed RESET and MODE on the metal (the product page lists "Mode button: Yes").
      Both are drawn with the library's recessed reset-button part; the MODE one carries function mode.
      The drawing gives their centres.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The brochure says the 1U case has a 100 - 240 V AC 500 W power supply built in; the product page
      lists one AC input, one PSU slot and two fans. No document held shows a removable supply module
      or gives a supply part number, so the supply is part of the chassis and there are no bays, as on
      juniper/ex2300-24t. The two fans are the two hexagonal grilles the drawing's right side view and
      photograph 1494 show.
  rear-layout:
    confidence: estimated
    note: >-
      No held document shows the rear: the drawing has front, side, top and isometric views, the isometric
      hides the rear, and neither studio photograph looks at it. The rear is left empty and the AC inlet
      is not placed; no other model's rear is used. The export therefore carries no power port.
  side-layout:
    confidence: drawing
    note: >-
      The drawing's side view is the right wall, front at the left (the three-quarter photograph 1494
      shows the right wall with a grille). Two round hex-pattern fan grilles, each 37.5 mm across, centres
      67.3 mm and 202.8 mm from the front and 22.5 mm down. The side view is 5.735 px per mm. The screws
      and the rear plate line are not drawn.
  ears:
    confidence: drawing
    note: >-
      Rack ears are in the box (product page, Included parts: Rackmount ears; the product page also lists
      a K-54 kit and an IEC cord, and no held document says what the K-54 kit is, so no kit is placed).
      The drawing's front view and top plan show the body and the 7 mm cable loop, with no ear plate,
      so the ears are shipped flush with the face and drawn at the face plane; the ears and the loop are
      not drawn.
  colour:
    confidence: photo-measured
    note: 'medians of photograph 1493: face #e9e9e9, lid #e1e1e1. The chassis colour is the face''s.'
