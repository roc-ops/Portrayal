  note: >-
    No held document shows the rear: no rear view in the dimensions drawing, none in the two studio photographs,
    none in the NetBox files. The rear is left empty and no AC inlet is placed, so the DCIM export carries
    no power port. The product page counts one AC input.
  wanted: A rear photograph or drawing showing the AC inlet and the earthing point.
- what: left-wall
  scope:
  - left
  reason: needs-drawing
  note: >-
    The drawing's side view and photograph 1494 show the right wall. No held document shows the left wall,
    so it is left empty and not drawn from the right.
  wanted: A left side view.
- what: port-jack-numbers
  scope:
  - front
  reason: vendor-silent
  note: >-
    Which jack of a column takes which number, and which SFP+ cage takes which number, is not printed
    or stated; the pilot's lower-jack-odd order is used, estimated.
  wanted: MikroTik's port order for the jacks.
- what: led-states
  scope:
  - front
  reason: vendor-silent
  note: >-
    Searched the brochure, the product page and the saved quick guide page for an LED table: none. The
    lamps carry the component's own vocabulary and no meaning is stated. The two lamps above and below
    each port are not explained either, nor are the 26 V, 53 V and PoE out lamps; the photograph shows
    them green, red and black, and the green and red are given as lit colours on the first two.
  wanted: MikroTik's LED description for the CRS328-24P-4S+RM.
- {what: weight, scope: [front], reason: vendor-silent, note: Neither the brochure nor the product page
    gives a weight., wanted: MikroTik's weight.}
- what: eol
  scope:
  - front
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so
    no lifecycle is written.
  wanted: none
