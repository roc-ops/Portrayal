format: 1
kind: device
name: crs354-48g-4s-plus-2q-plus-rm
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS354-48G-4S+2Q+RM
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS354}
description: >-
  MikroTik CRS354-48G-4S+2Q+RM is a fixed 1U Cloud Router Switch. It has 48 10/100/1000 Ethernet ports, four SFP+
  cages, two 40G QSFP+ cages, a 10/100 management port and an RJ45 serial console, and runs RouterOS. The front
  carries the 48 jacks in four blocks of six columns by two rows. They are numbered 1 to 48 as printed, with the odd
  number on the lower jack of a column. The four SFP+ cages are numbered 1 to 4 and the two QSFP+ cages 1 and 2, each
  pair stacked, with the odd number below. The right-hand end carries the CONSOLE and MGMT jacks, the RESET button
  and the PWR 1, FAULT and PWR 2 lamps. The rear carries two AC inlets (POWER 1 and POWER 2, 100-240 V), three fans
  and two vent fields. The power supplies and the fans are built into the chassis, so there are no bays.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Dimensions drawing "CRS354-48G dimensions", MikroTik, printed 20.09.2023 (file
      CRS35448G_dimensions_230955.pdf, rendered at 200 dpi): front, side, top plan and isometric. CRS354-48G-4S+2Q+RM
      brochure, MikroTik (file CRS354-48G-4Splus2QplusRM_240947.pdf; no date is printed, the file name carries a
      revision stamp): specification table and included parts. CRS354-48G-4S+2Q+RM product page, MikroTik (saved
      2026-10-26): dimensions, number of AC inputs and PSU slots, cooling type, power. Quick Guide - CRS354-48G-4S+2Q+RM,
      help.mikrotik.com, last updated Mar 02, 2026 (saved page, no figures; document #71593): power input and technical
      specifications. The product-page studio photographs 1901 (front) and 1900 (rear), and the block diagram. The
      NetBox community device type was read as a second opinion only. No figure numbers: MikroTik prints none. The
      device name spells MikroTik's + as -plus because a directory name cannot carry +; model: keeps the + as printed.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: product code, QCA9531 CPU at 650 MHz, 128 MB RAM, 32 MB
      flash, one 100 Mbps and 48 1 GbE ports, four SFP+ and two QSFP+ cages, RouterOS licence level 5, AC supply
      100 - 240 V, redundant supply "Yes", serial port RJ45, 297 x 443 x 44 mm, -20 to +60 C, 60 W maximum. The
      product page adds the switch chip 98DX3257, two AC inputs, two PSU slots, three fans, 50 W without attachments.
      The 60 W is the brochure's and the page's "Max power consumption", unqualified, and is filed as the maximum; the
      page's 50 W is the figure without attachments.
  gate-1:
    confidence: drawing
    note: >-
      The drawing's front view body measures 1164.7 px across at 200 dpi for the printed 443 (2.629 px per mm) and
      115.2 px down for the printed 44.3 (2.60 px per mm), 1 percent apart, so it is orthographic and every x and y
      below is taken at 2.62 px per mm from the body's top-left corner. The jack pitch then reads 13.9 mm, the
      registry's ganged RJ-45 pitch of 13.97, on a quantity the scale never saw.
  chassis:
    confidence: drawing
    note: >-
      443 wide, 44.3 high, 297 deep, from the drawing (443, 44.3 and 297 on its front, side and top views). The brochure
      and the product page print "297 x 443 x 44 mm", depth first and the height rounded; the same box, and the
      drawing's figures are carried. The 7 mm the top plan dimensions is the pair of power-cord retaining loops
      standing off the rear (cable management brackets in the box), not part of the depth. 443 is the body between the
      ear folds.
  front-layout:
    confidence: drawing
    note: >-
      From the drawing's front view. Four jack blocks of six columns by two rows on the 13.97 mm pitch, the first jack
      housing at 9.9 mm and the blocks 88.4 mm apart, so the gutter is 4.58 mm. The SFP+ block is 30.3 mm wide at
      362.3 mm, two columns of 15.3 mm, two cages high with the lamp strip between; the QSFP+ block 20.9 mm wide at
      396.1 mm; the console and management jacks a 18.3 mm block at 418.6 mm. The block frames run from 12.2 to 38.7
      mm. The jack row pitch is the pilot's 13.4 mm, which the drawing's outlines (13.2 to 13.7) agree with. Colours
      are the pilot's (face #dadada, plates #bebebe): the studio render's face reads #bab8b5, darkened by its lighting.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed numbers in photograph 1901: 2 4 ... 48 above the upper row and 1 3 ... 47 below the lower row of
      jacks; SFP+ 2 and 4 above and 1 and 3 below; 40G QSFP+ 2 above and 1 below; CONSOLE above the upper right jack
      and MGMT below the lower. The brochure's one 100 Mbps port is the MGMT jack, whose two lamps the photograph
      shows; the serial console is the CONSOLE jack.
  lamps:
    confidence: photo-measured
    note: >-
      The jacks carry their own two lamps in their keyway-side corners (photograph 1901). Each SFP+ column's lamp
      strip carries four triangles in the drawing, two to each cage; they are drawn as eight arrow lamps at the
      drawing's positions, the QSFP+ strip as the two arrows at its ends with four slots between them (decor). The
      PWR 1, FAULT and PWR 2 lamps sit in the strip under the RESET button at 2.9, 7.9 and 13.0 mm from its left end
      (photograph). No document held says what a lamp shows (the brochure and the saved quick guide give no LED
      table), so none carries states beyond the component's own.
  reset:
    confidence: photo-measured
    note: >-
      RESET is a round button at the top of the right-hand end (drawing: centre 429.7, 5.0 mm, 4.2 mm across). The
      library's recessed reset part is used; the quick guide held gives no reset text.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - no rear elevation is held; the positions are read off the studio rear photograph 1900. It looks down
      on the rear, so x is taken at 3.386 px per mm across the 443 mm body and y is estimated at 3.0 px per mm, the
      photograph's vertical scale for the 44.3 mm panel. They are good to about 1.5 mm in x and 3 mm in y. As seen from
      the rear: fans at 31.9, 70.0 and 401.0 mm (36 mm across, centred 22.3 mm down), the inlets at 116.7 and 355.0 mm,
      two hex vent fields at 201.2 and 260.8 mm. The legends read POWER 1 and POWER 2 with 100-240 V ~1.5A MAX,
      50/60Hz under each inlet. The wire retaining loops over the inlets are accessories (the drawing dimensions only
      their 7 mm standoff) and are not drawn.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The product page lists two AC inputs, two PSU slots and "3 fans"; the brochure lists "Redundant supply: Yes" and
      two IEC cords in the box. The rear photograph shows a plain panel with the two inlets on it and no removable
      module, and no held document prints a supply module part number, so the supplies are built in: part of the
      chassis, not bays. The three round openings of the rear carry a fan behind each (the page counts three fans), so
      they are fans of the chassis, drawn as fan openings; the hex fields between the inlets are vents.
  ac-input-rating:
    confidence: photo-measured
    note: >-
      Each inlet prints "100-240 V ~1.5A MAX, 50/60Hz" under POWER 1 or POWER 2 (photograph 1900); the brochure's
      range is 100 - 240 V and the quick guide's "2xAC input (100-240 V AC)".
  side-walls:
    confidence: drawing
    note: >-
      The drawing's side view has its rear at the left and the chamfered front corner at the right, so it is the
      left wall seen from the left: a vent field of 34.5 x 24.5 mm at 232.7 mm from the rear, with screws. It is
      drawn on the left face (x = 0 is the rear there). The isometric shows the right wall with a vent field at the
      same distance from the front; that one is drawn mirrored, 29.7 mm from the front, and is estimated (no view
      dimensions it). Heights are from the side view at 1.6 px per mm.
  ears:
    confidence: drawing
    note: >-
      Rack ears are in the box (brochure and product page, Included: Rackmount ears, K-48 screw kit). The drawing's side
      view shows the ear plate at the front end of the body, on the face, so the shipped position is flush; the top plan
      shows no ears (443 is the body). The ears are not drawn. The cable management brackets in the box are not drawn.
  colour:
    confidence: photo-measured
    note: >-
      The pilot's face (#dadada) and plate (#bebebe) are carried: the photographs are rendered studio views whose
      face reads #bab8b5, darkened by the lighting.
attrs:
  power:
    power-max-w: 60
    power-input: 100 - 240 V AC, two inputs (redundant supply), 50 - 60 Hz
    power-without-attachments-w: 50
  thermal:
    cooling: 3 fans (product page)
  environmental:
    operating-temp-c: -20 to 60 (tested)
  platform:
    cpu: QCA9531, 650 MHz
    switch-chip: 98DX3257
    ram: 128 MB
    storage: 32 MB flash
    os: RouterOS v7 / SwitchOS (licence level 5)
  performance:
    throughput: non-blocking 168 Gbps, switching capacity 336 Gbps, forwarding rate 235 Mpps (brochure)
    port-modes-sfp-plus: 10G SFP+ (brochure); the product page's feature badge reads SFP/SFP+, and no module list is printed
    port-modes-qsfp: 40G QSFP+ (brochure); no module or breakout list is printed
  compliance:
    certification: CE, EAC, RoHS
