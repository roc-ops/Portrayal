  note: >-
    The dimensions drawing has no rear view; the rear is read off a studio photograph that looks down
    on it, so the y positions are estimated.
  wanted: A dimensioned rear view.
- what: right-side-wall
  scope:
  - right
  reason: needs-drawing
  note: >-
    The drawing's one side view is the left wall; the right wall's vent field is seen only in the isometric,
    so it is drawn mirrored from the left and its position is estimated.
  wanted: A dimensioned view of the right wall.
- what: led-states
  scope:
  - front
  reason: vendor-silent
  note: >-
    Searched the brochure and the saved quick guide for an LED table: none. The lamps carry the components'
    own vocabulary and no colour or meaning is stated for PWR 1, FAULT and PWR 2.
  wanted: MikroTik's LED description for the CRS354-48G.
- {what: weight, scope: [front], reason: vendor-silent, note: Neither the brochure nor the product page
    gives a weight., wanted: MikroTik's weight.}
- what: eol
  scope:
  - front
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so
    no lifecycle is written.
  wanted: none
