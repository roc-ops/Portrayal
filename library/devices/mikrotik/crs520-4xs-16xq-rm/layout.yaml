format: 1
kind: device
name: crs520-4xs-16xq-rm
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS520-4XS-16XQ-RM
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS520}
description: >-
  MikroTik CRS520-4XS-16XQ-RM is a fixed 1U Cloud Router Switch, 443 mm wide with rack ears in the box, with sixteen 100
  Gigabit QSFP28 cages and four 25 Gigabit SFP28 cages, two 10 Gigabit Ethernet ports printed MGMT / BOOT and an RJ45
  serial console, and runs RouterOS v7. The front carries the sixteen QSFP28 cages in eight stacked pairs with four lamps
  each, the four SFP28 cages in two stacked pairs, the console, RESET, four status lamps, the two Ethernet ports and a
  vent strip along each edge. The rear carries two hot-swap AC supply modules with their C14 inlets and four hot-swap fan
  modules. The brochure prints no part number for the supplies or the fans, so they are part of the chassis and there are
  no bays.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Dimensions drawing, MikroTik, title block "CRS520-4XS-16XQ DIMENSIONS", "Printed: 13.05.2024" (file
      CRS520-4XS_DIMENSIONS_250534.pdf; page image at 3308 px across, 2.617 px per mm on the front view): front, side and top
      plan. CRS520-4XS-16XQ-RM brochure, MikroTik (file CRS520-4XS-16XQ-RM_250549.pdf; no date is printed, the file name carries
      a revision stamp): specifications, powering and included parts. Product page, MikroTik
      (https://mikrotik.com/product/crs520_4xs_16xq_rm, saved 2026-10-26); its Dimensions field is blank and links the drawing.
      Safety and regulatory book (file QG_CRS520-4XS-16XQ-RM_240633.pdf, 26 pages): read through the converted text, whose
      English page holds the rating table (AC input 100-240 VAC, IP20, -20 to +50 C); it prints no part number, no LED table and
      no figure of the box. Studio photographs: 2352 (front, three-quarter from the left, showing the right wall), 2353 (rear, from
      slightly above) and 2354 (front, from slightly above). The block diagram CRS520-4XS-16XQ_240944.png. NetBox's device
      type as a second opinion only. MikroTik prints no figure numbers. The hardware manual page is not held.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: product code CRS520-4XS-16XQ-RM, quad-core AL52400 2 GHz ARM 64 bit, 4 GB
      DDR4 RAM, 128 MB NAND, 2 x 1G/2.5G/5G/10G Ethernet (10M, 100M, 1G and 10G speeds), 4 x 25G SFP28, 16 x 100G QSFP28, switch
      chip 98CX8410, 443 x 367 x 44 mm, RouterOS v7 only, level 5, -20 to +50 C. Powering: two AC inputs, 100-240 V, 47-63 Hz,
      nominal current 10.25 A, maximum current 12.5 A, 123 W maximum without attachments, 150 W maximum (220 W with both
      supplies). Included parts: 2 power cords, rack ears, rear support ears, a cable management bracket, a fastening set. The
      text says "two hot-swap power supplies and four hot-swap fans" and states no redundancy form. It also names the PW48V-12V150W
      hot-swap -48 V DC telecom supply, available separately. Each figure is filed as the document words it.
  gate-1:
    confidence: drawing
    note: >-
      The drawing's front view body is 1159.5 px wide between its end lines for the printed 443 mm (2.617 px per mm in the page
      image) and 44.5 mm tall, the printed 44. At that scale a pixel is 0.4 mm, so every x and y below is taken from the body's
      top-left corner of the front view to about 0.5 mm. The rear and the right wall are read off photographs scaled from the
      443 mm width.
  chassis:
    confidence: drawing
    note: >-
      443 x 367 x 44, as the drawing prints them; the brochure prints 443 x 367 x 44 and agrees. The drawing also dimensions 19.1
      mm beyond the rear (the fan and supply handles) that is not part of the 367.
  front-layout:
    confidence: drawing
    note: >-
      From the drawing's front view. Sixteen QSFP28 frames 22 mm wide and 12.3 mm tall in two rows of eight, frame centres 18.6 mm
      from the left and a 24.07 mm pitch, the upper row centred 18.1 mm down and the lower 31.6 mm; four round lamps 4.0 mm apart
      over the upper row and under the lower row of each pair. Four SFP28 frames 15.6 mm wide and 12 mm tall in two columns at
      212.9 and 232.2 mm and two rows centred 18.1 and 31.5 mm down, with two round lamps over the upper row and under the lower
      row. The console jack plate is 17.8 x 14.3 mm at 247.4 mm, 9.4 mm, over a 33.8 x 15.1 mm plate at 247.4 mm, 25.6 mm, holding
      the two Ethernet jacks. RESET is a ring at 271.4 mm, 19.1 mm. Four round lamps sit in two rows at 279.6 and 284.0 mm and
      13.3 and 17.8 mm. Rows of vent slots run along the top and bottom edges.
  lamps:
    confidence: photo-measured
    note: >-
      Photograph 2354 prints USER, POWER 2, POWER 1 and FAULT beside the four lamps. USER and FAULT have brackets that end at the
      left column, over and under it, so the left column is USER (upper) and FAULT (lower); POWER 2 and POWER 1 are on the rows of
      the right column. Each cage has the lamps the drawing draws, four for a QSFP28 and two for an SFP28; no document says what
      a lamp shows (gap `led-states`).
  port-numbering:
    confidence: photo-measured
    note: >-
      The metal prints 2 4 6 8 10 12 14 16 over the QSFP28 stacks and 1 3 5 7 9 11 13 15 under them, 2 and 4 over the SFP28
      cages and 1 and 3 under them, so the lower cage of a stack takes the odd number. The groups are printed 100G QSFP28 and
      25G SFP28, and 1 and 2 under the Ethernet ports (photograph 2354).
  management-and-console:
    confidence: photo-measured
    note: >-
      Photograph 2354 prints CONSOLE over the upper jack and 10G MGMT / BOOT between the numbers 1 and 2 under the two lower
      jacks. The brochure counts two 1G/2.5G/5G/10G Ethernet ports supporting 10M, 100M, 1G and 10G speeds; they are filed at
      10g, the highest, as the CRS312 files its 10G jacks.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The brochure says "two hot-swap power supplies and four hot-swap fans". Photograph 2353 shows two supply modules, each with
      a C14 inlet, a steel handle and a vent, and four fan modules numbered 1 to 4, each with a handle and a round fan guard. No
      held document prints a part number for the supply or the fan (the brochure, the page and the safety book were searched), so
      none is named: they are part of the chassis, as on juniper/ex2300-24t, and there are no bays (gaps `hot-swap-supplies` and
      `hot-swap-fans`). No document says what covers an empty slot. The brochure's optional PW48V-12V150W is not the supply that
      ships and no document draws it (gap `optional-dc-supply`). The legend between the supplies and the fans reads "POWER 1 /
      POWER 2" and "100-240 V ~2,5 A MAX, 50/60Hz".
  vents:
    confidence: photo-measured
    note: >-
      The front's top strip is two rows of rectangular slots (photograph 2354, the drawing's front view and the brochure's close
      view), drawn as `motif` tiles because the slots are square-cut 4.0 mm rectangles with a corner radius of about 0.15 mm,
      which `slots-h` (rounded ends) does not draw. Read off photograph 2354 at 5.33 px per mm (the face's 2365 px at y 700 for
      443 mm; the photograph looks down, the face reads 0.93 of that vertically): the slot pitch is 27.15 px (17 pitches, 461.5
      px), 5.09 mm, and every slot is the same width, 21.7 px, 4.07 mm. Measured on the photograph at 4 times enlargement the
      slots are 1.5 mm tall (6 to 7.5 px) and the rows 3.0 mm apart (14.75 px): row 1 at 0.9 mm, row 2 at 3.9 mm, each its own
      motif field with a tile 5.09 x 1.5 mm (the first reading, 2.0 mm slots 3.5 mm apart, took the drawing's 14.4 px over two
      rows). The second row has no slots where the photograph prints the legends 100G QSFP28 and 25G SFP28, so it is three
      fields that stop and start on whole slot pitches: 4.1 to 95.72, 110.99 to 212.79 and 233.15 to 438.1 mm. The bottom
      edge is not a row of slots but 54 shallow light notches, 4.0 x 1.5 mm on the same pitch (photograph 2354, 4 times
      enlargement: 8 px deep, light grey inside, #d3cac3 over three boxes of 70 to 85 pixels), drawn as plain rects so that
      they are light. The strips start 4.1 mm from the left and run 434.0 mm, and the notches 278.0 mm, the drawing's extents
      (the photograph puts the first slot 3.0 mm in; the drawing's body edge is a double line). The rear fields are hexagon
      honeycombs as the photograph shows: see `rear-layout`.
  brackets:
    confidence: photo-measured
    note: >-
      Photograph 2354 and the brochure's close view print a thin bracket line over each port group, hooked down at both ends:
      over the 100G QSFP28 cages from 7.6 to 198.1 mm and over the 25G SFP28 cages from 205.5 to 240.4 mm, 6.3 mm down, the
      hooks 3.8 mm long in the photograph (4 times enlargement at 5.33 px per mm), drawn 3.0 and 2.0 mm long so that they stop
      above the lamps, and two hooks over and under the left lamp
      column running right to USER and FAULT. They are stroked paths 0.2 mm wide. Port numerals are printed over each cage:
      QSFP28 1 to 16, SFP28 1 to 4.
  rear-layout:
    confidence: photo-measured
    note: >-
      From photograph 2353 (the rear, from slightly above), x across the 443 mm at 4.0 px per mm and y estimated (the photograph
      looks down, 3.8 px per mm). Two supply modules about 63 mm wide at 2.5 and 65.9 mm with their inlets centred 54.0 and 117.4
      mm and 22.5 mm down; four fan modules 60.4 mm wide at 158.5, 227.6, 296.2 and 364.0 mm. Read to about 2 mm, as seen
      from behind. Measured again on the photograph at 5.36 px per mm (the face's 2360 px for 443 mm): each fan's honeycomb ring
      is 204 px, 38.0 mm across the hole tips (drawn 37.5, estimated), centred 37.4 mm from its module's left edge, so right of
      the handle and not in the middle of the plate, round a solid hub 20.0 mm across (107 px); the guard's holes are 25 x 21.5
      px, 4.7 mm across the corners and 4.0 across the flats, in columns 23.3 px (4.37 mm) apart and rows 24.9 px (4.67 mm), nine
      columns across the ring. The renderer's honeycomb tile is 8.86 x 5.11 mm with holes 5.1 mm across the corners: the tile is
      scaled by 0.914 on both axes to 8.1 x 4.67 mm, which draws the hole as read and the rows as read and the columns 7 per
      cent closer than read (4.05 mm against 4.37); a regular hexagon cannot be both. The tile's phase puts a hole on each ring's
      centre. The supply vents' holes are larger, 29 x 24 px, 5.4 mm across the corners, columns 28.2 px (5.27 mm) and rows 29.9
      px (5.6 mm, not corrected for the look from above): the tile is scaled by 1.06 to 9.39 x 5.42 mm, with a hole at 10.6 mm
      and 10.3 mm down in the first supply and 63.4 mm further in the second; the field is the honeycomb's extent left of the
      handle, 27.0 x 28.4 mm. The earlier fields drew the base tile and a 36 mm guard in the middle of the plate. The photograph
      shows no honeycomb under the hub. Each fan module has a chrome handle 4.6 mm wide and 38 mm tall 12.8 mm from the
      module's left edge and a knurled thumbscrew 7.2 x 13.4 mm left of it (photograph 2353 at 5.4 px per mm, x from the
      face's left edge at 150 px, y at 0.88 of that); each supply has a handle 4.0 x 39.8 mm, two latch tabs above and below
      the inlet and a thumbscrew at its left edge. Five chassis screws 4.4 mm across (133.1, 224.8, 294.0, 363.1 and 438.3
      mm) sit between the modules and at the right end. The legend POWER 1 / POWER 2 is underlined 25.8 mm and each fan
      numeral is followed by a filled arrowhead (estimated, about 2 mm). Each inlet is turned so that its earth pin is at the
      right as seen from behind: photograph 2353 (5.36 px per mm) shows the first inlet's housing 139 x 159 px (25.9 x 29.7 mm,
      pixel box 361,709 to 500,868) with its two line pins aligned at the left and the offset middle pin at the right
      (estimated, about 1 mm); the first drawing had the earth pin at the left.
  side-layout:
    confidence: estimated
    note: >-
      Photograph 2352 shows a field of small round perforations on the right wall, near the front. The wall's four corners in
      the photograph (a perspective transform of the quad onto 367 x 44 mm, 5 px per mm) put the field 35 x 17 mm, 11 mm from
      the front and 14 mm down, good to about 3 mm; it is drawn so, as the `holes` tile scaled to 3.6 x 3.0 mm (the photograph's
      10 columns and 6 rows; the photograph staggers the rows, which the tile does not). The same unwarp (5.45 px per mm,
      good to about 1 mm along the wall) shows four small round holes 2.2 mm across, drawn as screw holes: two beside the
      field at 61.8 mm from the front, 14.8 and 29.3 mm down, and two near the rear at 314.5 and 342.0 mm, 19.9 and
      19.5 mm down; each fill is the median of its own dark pixels (about 70 to 107 pixels each, spreads 15 to 27),
      estimated. No held document shows the left wall. The drawing has no
      wall view.
  ears:
    confidence: drawing
    note: >-
      Rack ears are in the box (the brochure and the page: Rackmount ears) and the drawing's front view draws them at both ends.
      They are shipped flush with the face and are not drawn on it; no `at` is written. The rear support ears, the cable
      management bracket and the optional rail are not drawn (gaps `rear-support-ears`, `rack-rail-kit`).
  colour:
    confidence: estimated
    note: >-
      Photograph 2354, medians of plain patches: the front face #e0dcd5 over three unlit, unshaded patches (boxes 1850,760 to
      2200,860 with 35000 pixels and a spread of 4.1; 2000,700 to 2300,740 with 12000 pixels; 1780,840 to 2100,870 with 9600
      pixels, all #e0dcd5), drawn #e0dcd5; the lid reads #e3e4e3 and is a different surface. The jack plates #e6e3df (box
      1475,718 to 1483,770, 416 pixels, spread 8.5), drawn #e6e3df. The lamps rest unlit grey in the photograph, #767675 and
      #6c6d67 (boxes 1640,724 to 1645,730 and 1640,746 to 1645,752, 30 pixels each); the render draws them with the lamp
      component's own resting colour (gap `led-states`). Photograph 2353 (the rear, from above) shades the rear: its flat
      chassis patch (box 880,800 to 990,850, 5500 pixels, spread 3.1) reads #bbbbb7, 0.84 of the front's luminance. The fan
      modules read #4e3d33 on eight plain patches, one to the left of the handle and one to the right on each module, all
      between #4b3c34 and #53443b with spreads of 3 to 6 (for example box 1027,692 to 1068,740, 1968 pixels, #4e3f36; box
      1322,715 to 1336,830, 1610 pixels, #4d3b2f): the colour is the modules', not a shading gradient, and it is drawn lightened
      by the 0.84 the rear's shading takes, #5d493d. The supply modules' polished surfaces vary, but four plain patches of
      photograph 2353 (spreads 6.5 to 14.0) read #564e43 (box 175,715 to 205,745, 900 pixels, spread 9.6), #4a3a30 (box
      512,715 to 545,745, 990 pixels, spread 14.0), #4e3e33 (box 230,860 to 310,872, 960 pixels, spread 8.1) and #483629
      (box 530,860 to 640,872, 1320 pixels, spread 6.5): their per-channel median is #4c3c31, lightened the same way,
      #5a473b, estimated. The first plate's left margin reads greyer than the rest. The earlier #b9b9b9, #a89c94 and
      #736f62 were not the photograph's colours. The rear's handles, thumbscrews, latches and screws (photograph 2353): fan handle rim #776d64 (box
      1075,760 to 1078,880, 360 pixels, spread 37.9) and core #524339 (box 1076,760 to 1098,870, 2420 pixels, spread 40.8),
      fan thumbscrew #6d635c (box 1016,788 to 1054,822, 1292 pixels, spread 46.6), supply handle core #504137 (box
      320,700 to 330,880, 1800 pixels, spread 52.1), supply thumbscrew #737268 (box 165,770 to 190,800, 750 pixels, spread
      38.4), supply latches #89978e (box 405,695 to 430,715, 500 pixels, spread 30.8) and chassis screws #51453b (box
      862,704 to 876,716, 168 pixels, spread 33.0); the chrome handles reflect the bronze modules, so their medians are dark
      and unlit values are unknown (estimated). The front's bottom notches #d3cac3 (box 194,872 to 211,877 of photograph 2354,
      85 pixels, spread 8.7; 80 and 70 pixels on two more boxes).
