  power:
    power-max-w: 150
    power-envelope: fully-configured
    power-without-attachments-w: 123
    power-input: 100 - 240 V AC, 47 - 63 Hz, two inputs, two hot-swap supplies; nominal current 10.25 A, maximum current 12.5 A; 150 W maximum (220 W with both supplies)
    power-rating-label: 100-240 V ~2,5 A MAX, 50/60Hz (printed between the supplies and the fans)
  environmental:
    operating-temp-c: -20 to 50
  platform:
    cpu: Quad-Core AL52400, 2 GHz, ARM 64 bit
    switch-chip: 98CX8410
    ram: 4 GB DDR4
    storage: 128 MB NAND
    os: RouterOS v7, level 5
  features:
    optics-sfp28: >-
      brochure: four 25 Gigabit SFP28 ports supporting 1G, 2.5G, 10G and 25G, depending on the module
    optics-qsfp28: >-
      brochure: sixteen 100 Gigabit QSFP28 ports supporting 4x 1G, 4x 2.5G, 4x 10G, 4x 25G, 1x 40G, 2x 50G and 1x 100G, depending
      on the module; no module is included
chassis:
  width: 443.0
