format: 1
kind: device
name: crs520-4xs-16xq-rm
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS520-4XS-16XQ-RM
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS520}
description: >-
  MikroTik CRS520-4XS-16XQ-RM is a fixed 1U Cloud Router Switch, 443 mm wide with rack ears in the box, with sixteen 100
  Gigabit QSFP28 cages and four 25 Gigabit SFP28 cages, two 10 Gigabit Ethernet ports printed MGMT / BOOT and an RJ45
  serial console, and runs RouterOS v7. The front carries the sixteen QSFP28 cages in eight stacked pairs with four lamps
  each, the four SFP28 cages in two stacked pairs, the console, RESET, four status lamps, the two Ethernet ports and a
  vent strip along each edge. The rear carries two hot-swap AC supply modules with their C14 inlets and four hot-swap fan
  modules. The brochure prints no part number for the supplies or the fans, so they are part of the chassis and there are
  no bays.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Dimensions drawing, MikroTik, title block "CRS520-4XS-16XQ DIMENSIONS", "Printed: 13.05.2024" (file
      CRS520-4XS_DIMENSIONS_250534.pdf; page image at 3308 px across, 2.617 px per mm on the front view): front, side and top
      plan. CRS520-4XS-16XQ-RM brochure, MikroTik (file CRS520-4XS-16XQ-RM_250549.pdf; no date is printed, the file name carries
      a revision stamp): specifications, powering and included parts. Product page, MikroTik
      (https://mikrotik.com/product/crs520_4xs_16xq_rm, saved 2026-10-26); its Dimensions field is blank and links the drawing.
      Safety and regulatory book (file QG_CRS520-4XS-16XQ-RM_240633.pdf, 26 pages): read through the converted text, whose
      English page holds the rating table (AC input 100-240 VAC, IP20, -20 to +50 C); it prints no part number, no LED table and
      no figure of the box. Studio photographs: 2352 (front, three-quarter from the left, showing the right wall), 2353 (rear, from
      slightly above) and 2354 (front, from slightly above). The block diagram CRS520-4XS-16XQ_240944.png. NetBox's device
      type as a second opinion only. MikroTik prints no figure numbers. The hardware manual page is not held.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: product code CRS520-4XS-16XQ-RM, quad-core AL52400 2 GHz ARM 64 bit, 4 GB
      DDR4 RAM, 128 MB NAND, 2 x 1G/2.5G/5G/10G Ethernet (10M, 100M, 1G and 10G speeds), 4 x 25G SFP28, 16 x 100G QSFP28, switch
      chip 98CX8410, 443 x 367 x 44 mm, RouterOS v7 only, level 5, -20 to +50 C. Powering: two AC inputs, 100-240 V, 47-63 Hz,
      nominal current 10.25 A, maximum current 12.5 A, 123 W maximum without attachments, 150 W maximum (220 W with both
      supplies). Included parts: 2 power cords, rack ears, rear support ears, a cable management bracket, a fastening set. The
      text says "two hot-swap power supplies and four hot-swap fans" and states no redundancy form. It also names the PW48V-12V150W
      hot-swap -48 V DC telecom supply, available separately. Each figure is filed as the document words it.
  gate-1:
    confidence: drawing
    note: >-
      The drawing's front view body is 1159.5 px wide between its end lines for the printed 443 mm (2.617 px per mm in the page
      image) and 44.5 mm tall, the printed 44. At that scale a pixel is 0.4 mm, so every x and y below is taken from the body's
      top-left corner of the front view to about 0.5 mm. The rear and the right wall are read off photographs scaled from the
      443 mm width.
  chassis:
    confidence: drawing
    note: >-
      443 x 367 x 44, as the drawing prints them; the brochure prints 443 x 367 x 44 and agrees. The drawing also dimensions 19.1
      mm beyond the rear (the fan and supply handles) that is not part of the 367.
  front-layout:
    confidence: drawing
    note: >-
      From the drawing's front view. Sixteen QSFP28 frames 22 mm wide and 12.3 mm tall in two rows of eight, frame centres 18.6 mm
      from the left and a 24.07 mm pitch, the upper row centred 18.1 mm down and the lower 31.6 mm; four round lamps 4.0 mm apart
      over the upper row and under the lower row of each pair. Four SFP28 frames 15.6 mm wide and 12 mm tall in two columns at
      212.9 and 232.2 mm and two rows centred 18.1 and 31.5 mm down, with two round lamps over the upper row and under the lower
      row. The console jack plate is 17.8 x 14.3 mm at 247.4 mm, 9.4 mm, over a 33.8 x 15.1 mm plate at 247.4 mm, 25.6 mm, holding
      the two Ethernet jacks. RESET is a ring at 271.4 mm, 19.1 mm. Four round lamps sit in two rows at 279.6 and 284.0 mm and
      13.3 and 17.8 mm. Rows of vent slots run along the top and bottom edges.
  lamps:
    confidence: photo-measured
    note: >-
      Photograph 2354 prints USER, POWER 2, POWER 1 and FAULT beside the four lamps. USER and FAULT have brackets that end at the
      left column, over and under it, so the left column is USER (upper) and FAULT (lower); POWER 2 and POWER 1 are on the rows of
      the right column. Each cage has the lamps the drawing draws, four for a QSFP28 and two for an SFP28; no document says what
      a lamp shows (gap `led-states`).
  port-numbering:
    confidence: photo-measured
    note: >-
      The metal prints 2 4 6 8 10 12 14 16 over the QSFP28 stacks and 1 3 5 7 9 11 13 15 under them, 2 and 4 over the SFP28
      cages and 1 and 3 under them, so the lower cage of a stack takes the odd number. The groups are printed 100G QSFP28 and
      25G SFP28, and 1 and 2 under the Ethernet ports (photograph 2354).
  management-and-console:
    confidence: photo-measured
    note: >-
      Photograph 2354 prints CONSOLE over the upper jack and 10G MGMT / BOOT between the numbers 1 and 2 under the two lower
      jacks. The brochure counts two 1G/2.5G/5G/10G Ethernet ports supporting 10M, 100M, 1G and 10G speeds; they are filed at
      10g, the highest, as the CRS312 files its 10G jacks.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The brochure says "two hot-swap power supplies and four hot-swap fans". Photograph 2353 shows two supply modules, each with
      a C14 inlet, a steel handle and a vent, and four fan modules numbered 1 to 4, each with a handle and a round fan guard. No
      held document prints a part number for the supply or the fan (the brochure, the page and the safety book were searched), so
      none is named: they are part of the chassis, as on juniper/ex2300-24t, and there are no bays (gaps `hot-swap-supplies` and
      `hot-swap-fans`). No document says what covers an empty slot. The brochure's optional PW48V-12V150W is not the supply that
      ships and no document draws it (gap `optional-dc-supply`). The legend between the supplies and the fans reads "POWER 1 /
      POWER 2" and "100-240 V ~2,5 A MAX, 50/60Hz".
  rear-layout:
    confidence: photo-measured
    note: >-
      From photograph 2353 (the rear, from slightly above), x across the 443 mm at 4.0 px per mm and y estimated (the photograph
      looks down, 3.8 px per mm). Two supply modules about 63 mm wide at 2.5 and 65.9 mm with their inlets centred 54.0 and 117.4
      mm and 22.5 mm down; four fan modules 60.4 mm wide at 158.5, 227.6, 296.2 and 364.0 mm with a round guard 36 mm across
      centred in each. Read to about 2 mm, as seen from behind.
  side-layout:
    confidence: estimated
    note: >-
      Photograph 2352 shows a field of round perforations on the right wall, near the front. It is drawn 36 x 14 mm, 28 mm from the
      front and 9 mm down, read off a photograph that looks at the wall obliquely (about 8 mm). No held document shows the left
      wall. The drawing has no wall view.
  ears:
    confidence: drawing
    note: >-
      Rack ears are in the box (the brochure and the page: Rackmount ears) and the drawing's front view draws them at both ends.
      They are shipped flush with the face and are not drawn on it; no `at` is written. The rear support ears, the cable
      management bracket and the optional rail are not drawn (gaps `rear-support-ears`, `rack-rail-kit`).
  colour:
    confidence: estimated
    note: >-
      The median of photograph 2354's face is #e6e5e4; the face is drawn #dddddd so it reads on the light stage.
attrs:
  power:
    power-max-w: 150
    power-envelope: fully-configured
    power-without-attachments-w: 123
    power-input: 100 - 240 V AC, 47 - 63 Hz, two inputs, two hot-swap supplies; nominal current 10.25 A, maximum current 12.5 A; 150 W maximum (220 W with both supplies)
    power-rating-label: 100-240 V ~2,5 A MAX, 50/60Hz (printed between the supplies and the fans)
  environmental:
    operating-temp-c: -20 to 50
  platform:
    cpu: Quad-Core AL52400, 2 GHz, ARM 64 bit
    switch-chip: 98CX8410
    ram: 4 GB DDR4
    storage: 128 MB NAND
    os: RouterOS v7, level 5
  features:
    optics-sfp28: >-
      brochure: four 25 Gigabit SFP28 ports supporting 1G, 2.5G, 10G and 25G, depending on the module
    optics-qsfp28: >-
      brochure: sixteen 100 Gigabit QSFP28 ports supporting 4x 1G, 4x 2.5G, 4x 10G, 4x 25G, 1x 40G, 2x 50G and 1x 100G, depending
      on the module; no module is included
