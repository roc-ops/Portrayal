  depth: 367.0
  ru: 1
  color: '#e0dcd5'
  ears:
    positions:
    - {name: flush, default: true}
  power: ac
gaps:
- what: power-figures
  scope: [rear]
  reason: sources-disagree
  note: >-
    The brochure's powering table prints a nominal current of 10.25 A and a maximum of 12.5 A, and the photograph prints
    "100-240 V ~2,5 A MAX, 50/60Hz" between the supplies; the two are not reconciled by any held document (the brochure's pair
    may be the 12 V side). The brochure's 150 W maximum is followed in parentheses by 220 W with both supplies; 150 W is carried
    as the maximum and the 220 W is kept in the text of `power-input`. The legend is drawn as printed.
  wanted: MikroTik's statement of what the currents and the 220 W mean.
- what: hot-swap-supplies
  scope: [rear]
  reason: vendor-silent
  note: >-
    The brochure calls the two power supplies hot-swap and prints no part number; no data sheet or drawing of the supply is
    held, and no document says what covers an empty slot. They are drawn as part of the chassis with their inlets and no bay is
    added; the base configuration exports two AC power ports.
  wanted: The supply's part number and a statement of what a slot holds when empty.
- what: hot-swap-fans
  scope: [rear]
  reason: vendor-silent
  note: >-
    The brochure calls the four fans hot-swap and prints no part number; the photograph shows four numbered modules. They are
    drawn as fan guards in the chassis, with no bay, and no fan redundancy is written.
  wanted: The fan module's part number and MikroTik's redundancy statement.
- what: optional-dc-supply
  scope: [rear]
  reason: vendor-silent
  note: >-
    The brochure says the switch can also be powered by the PW48V-12V150W hot-swap -48 V DC telecom supply, available
    separately. No held document draws it or gives its size, so no module is added and no bay offers it.
  wanted: A data sheet or drawing of the PW48V-12V150W.
- what: led-states
  scope: [front]
  reason: vendor-silent
  note: >-
    Searched the brochure, the page and the safety book for an LED table: none. The four lamps of each QSFP28 cage, the two of
    each SFP28 cage and the USER, POWER 2, POWER 1 and FAULT lamps carry the component's own vocabulary and no meaning is stated.
    The lamps' resting colour comes from the lamp component and is not changed here: the photographs show the lamps unlit grey
    and the render draws them with the component's own colour.
  wanted: MikroTik's LED description for the CRS520-4XS-16XQ-RM.
- what: qsfp28-orientation
  scope: [front]
  reason: needs-drawing
  note: >-
    The sixteen QSFP28 cages are two rows, the upper row turned half a turn from the lower as the other stacked cages are.
    Photograph 2354 and the brochure's close view show each cage as a dark window with a light rim and, in the lower row, a ledge
    at the bottom of the window; they do not show which side holds the contacts or the latch tongue clearly enough to read, so
    the turn is carried as drawn and not confirmed. The SFP28 cages, whose pull tabs face each other across the rows, and the
    RJ45 jacks, whose key notches and lamps are readable, do match the photograph.
  wanted: A straight-on, close photograph of a QSFP28 cage in each row.
- what: rack-rail-kit
  scope: [front]
  reason: needs-drawing
  note: >-
    The brochure's included parts and COVERAGE name the optional 23-40 Rack Rail R0 (brochure
    3-40_RACK_RAIL_R0_260621.pdf, named for the CRS520, CRS804, CRS812, CCR2216 and RDS2216). The kit is not modelled here: the
    later CRS8xx batch adds it for all five, and the CRS520 will list it when that batch adds it. No `kind: kit` contract and no
    `chassis.kits` entry is written.
  wanted: none
- what: rear-support-ears
  scope: [rear]
  reason: needs-drawing
  note: >-
    The brochure lists "Rackmount rear support ears" and a "Cable managment bracket" among the included parts. The ear model has
    only front ears, so none is drawn, and the bracket is not drawn either; no held document dimensions either part.
  wanted: A drawing of the rear support ears and the bracket.
- what: left-wall
  scope: [left]
  reason: needs-drawing
  note: >-
    No held document shows the left wall: the drawing has no wall view and the photographs show the right wall, the front and the
    rear. It is left empty and is not drawn from the right.
  wanted: A left side view.
- what: top-and-bottom
  scope: [top, bottom]
  reason: needs-drawing
  note: >-
    The drawing's top plan shows a plain lid and no vent; the photographs show a plain lid with vent slots only along the front
    edge, which the front face carries. No document shows the underside.
  wanted: A bottom view.
- what: weight
  scope: [front]
  reason: vendor-silent
  note: Neither the brochure nor the page gives a weight.
  wanted: MikroTik's weight.
- what: eol
  scope: [front]
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so no lifecycle is
    written.
  wanted: none
