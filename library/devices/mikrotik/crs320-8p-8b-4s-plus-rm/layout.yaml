format: 1
kind: device
name: crs320-8p-8b-4s-plus-rm
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS320-8P-8B-4S+RM
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS320}
description: >-
  MikroTik CRS320-8P-8B-4S+RM is a fixed 1U Cloud Router Switch with high-power PoE out. It has 16 Gigabit Ethernet
  ports that supply PoE (Ether1-8 at 802.3af/at, Ether9-16 at 802.3bt), a Gigabit management port printed ETH / BOOT,
  four SFP+ cages and an RJ45 console, and runs RouterOS v7. The front carries the 16 jacks in two blocks of four columns
  by two rows, with a grey PoE bar printed over each column, then the console over the management port, four lamps,
  and the 2 by 2 SFP+ block with eight arrow lamps. The rear has two supply slots printed POWER 1 and POWER 2. The first
  holds the shipped 600 W supply and the second is closed by a plain cover; either takes the hot-swap G1483-0600WNB,
  which raises the power to 1150 W. The fans draw through an opening in the right wall and a hex vent in the rear.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Dimensions drawing "CRS320-8P-8B-4S+ dimensions", MikroTik, printed 13.07.2023 (file
      CRS320_8P-8B_4SDIMENSIONS_250832.pdf, rendered at 400 dpi): front and top plan, no side view. CRS320-8P-8B-4S+RM
      brochure, MikroTik (file CRS320-8P-8B-4SRM_240740.pdf; no date is printed, the file name carries a revision
      stamp): specifications, powering, included parts and the G1483-0600WNB. CRS320-8P-8B-4S+RM product page, MikroTik
      (https://mikrotik.com/product/crs320_8p_8b_4s_rm, saved 2026-10-26): AC inputs, PSU slots, cooling, PoE, included
      parts. Quick Guide - CRS320-8P-8B-4S+RM, help.mikrotik.com (https://help.mikrotik.com/docs/x/UAAaBw), last updated
      Mar 27, 2026: safety and regulatory text in many languages, no figure and no LED table. Studio photographs
      2355 (front, three-quarter from the right, showing the right wall), 2356 (rear, from above) and 2357 (front, from
      slightly above). The block diagram CRS320-8P-8B-4S_240753.png. NetBox's device type as a second opinion only.
      MikroTik prints no figure numbers. The device name spells MikroTik's + as -plus because a directory name cannot
      carry +; model: keeps the + as printed.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: product code CRS320-8P-8B-4S+RM, dual-core 800 MHz ARM 32 bit,
      256 MB DDR3, 32 MB flash, 17 Gigabit Ethernet ports (10/100/1000), four SFP+ ports (1G / 2.5G / 10G by module),
      98DX226S, RouterOS v7 only at level 5, 444 x 235 x 44 mm, -10 to +50 C, one AC input, 100-240 V, 50-60 Hz,
      nominal current 10.35 A and maximum 11 A, PoE out 802.3af/at/bt on Ether1-Ether8 (af/at) and Ether9-Ether16 (bt),
      560 (af/at) / 1667 (bt) mA per port at input above 30 V, 17.82 A and 963 W total out, 36 W without attachments
      and "600 W (1150 W with additional PSU)" maximum. Each figure is filed as the document words it. The 963 W is
      the PoE output total, not the box's draw.
  gate-1:
    confidence: drawing
    note: >-
      The drawing prints no scale. Its front view's body is 1752 px wide in a 400 dpi render for the printed 444.5
      (3.941 px per mm) and 175 px tall between the lip lines, which reads 44.4 mm, the figure the drawing prints on its
      height dimension. Every x and y below is taken at 3.941 px per mm from the body's top-left corner of the front
      view.
  chassis:
    confidence: drawing
    note: >-
      444.5 wide, 44.4 high, 235 deep. The drawing prints 444.5 across the front view, 44.4 on the height and (235) on
      the top plan; the brochure prints 444 x 235 x 44 mm. The width and the height are the drawing's, the brochure's
      figures being their roundings, and the depth agrees. The 29 mm the drawing dimensions above the top plan is a
      bracket standing off the rear edge at the left of the plan (the page lists "Cable managment brackets", an
      accessory), not part of the depth; the plan's top edge is the rear, as in the drawing's first-angle layout and
      as the CRS418's plan shows its inlet clips there. The drawing has no side view, so the height is the front view's own, scaled from the
      printed width.
  front-layout:
    confidence: drawing
    note: >-
      From the drawing's front view. Two jack plates 67.0 x 28.5 at 202.2 and 272.2 mm (70.0 mm step), top at 9.2 mm;
      four columns of two jacks at a 16.24 mm pitch (the drawn jack outlines are separate, not ganged), the first
      jack's centre at 211.1 mm and the second block's at 281.1 mm (a 5.05 mm gutter). The rows are centred in the
      plate on a 14.0 mm pitch for the registry jack's 13.2 mm; the drawn outline centres lie 15.4 mm apart, but each
      outline includes its lugs on the outer side, so the pitch is not taken from them. The latch is down on the upper
      row and up on the lower. The console and management jacks share a plate 18.0 x 26.6 at 341.4 mm, 11.1 mm, the
      console above, with the registry jack centred in the plate at 350.4 mm and 13.2 mm apart. The SFP+ block is
      30.1 x 26.5 at 370.2 mm, 10.9 mm, two cages by two on a 15.0 mm column pitch and 15.2 mm row pitch with a
      5.2 mm strip between the rows for the arrow lamps. RESET is the drawn round button, 4.7 mm over its ring, centre
      196.8 mm, 33.2 mm. The four lamps are drawn as four dots at 363.7 mm, 1.7 mm across, at 27.1, 29.85, 32.6 and
      35.35 mm. The two vent bands are the drawn chevron windows, 2.5 to 200.9 mm and 341.4 to 440.5 mm, 2.2 to 8.5 mm;
      they render as hexagons and not as chevrons, as on the earlier MikroTik devices. The plate colour #bcb0a3 and the
      face colour #dedad3 are the photograph's medians.
  poe-markings:
    confidence: photo-measured
    note: >-
      The drawing shows a grey rounded bar 10.8 x 2.4 mm over each of the eight columns of two jacks, centred on the column, 5.8 mm from
      the top. Photograph 2357 shows them as unlit grey bars. No photograph shows one lit, no document says they are
      lamps and no lit colour can be read, so they are drawn as printed bars, as the CRS354-48P draws what its
      photograph shows, and not as lamps with lit colours as the CRS328-24P does. Left of the first plate the
      photograph shows a red square over the legend af / at and a purple square over bt, which key a colour to the PoE
      class; they are drawn at x 199.2 mm, y 16.0 and 27.6 mm, read off photograph 2357 against the plate edge and
      the reset ring (x about 1 mm, y about 1.5 mm: the photo looks down on the face). The legends PoE out af / at over
      the first plate and PoE out af / at / bt over the second, and GIGABIT ETHERNET between them, are centred as in
      that photograph, 3.4 mm above the bars. The thin bracket line under those legends is not drawn.
  lamps:
    confidence: estimated
    note: >-
      The four lamps are the dots the drawing shows beside the management jack. Photograph 2357 prints the legends FAN
      FAULT, POE FAULT, USER and POWER in that order from the top, beside four outlined circles right of the SFP+
      block, and shows the four dots grey and unlit. Which dot belongs to which legend is not stated; the top-to-bottom
      order is assumed to match, estimated. The legends are drawn at the printed position, 406.5 mm, and name the
      chassis, not a lamp 43 mm away. The eight arrow lamps of the SFP+ block are read off the same photograph: a
      pair of arrows for each cage column over the strip, left half pointing down, up, down, up and right half up, down,
      up, down, at 371.7, 374.2, 378.8, 381.4, 386.0, 388.8, 393.2 and 395.8 mm (x about 1 mm); the same arrangement
      as the CRS326-4C+20G+2Q+RM, and each cage takes two lamps. No document says what a lamp shows.
  port-numbering:
    confidence: photo-measured
    note: >-
      The metal prints 1 and 2 under the first column as 1▼ and ▲2, then 3▼ ▲4 and so on to ▲16: the down arrow
      points at the lower jack and the up arrow at the upper, so the lower jack of a column takes the odd number, as on
      the earlier MikroTik devices. The four SFP+ cages are printed 1▼ ▲2 3▼ ▲4 the same way: 1 is the lower left cage, 2
      the upper left, 3 the lower right and 4 the upper right. Ether1 to Ether8 are the first plate and Ether9 to
      Ether16 the second (brochure: "#1 - #8 ... af/at, #9 - #16 ... bt").
  management-and-console:
    confidence: photo-measured
    note: >-
      Photograph 2357 prints CONSOLE over the upper jack of the shared plate and ETH / BOOT under the lower. The
      brochure counts "17 Gigabit Ethernet ports" and says "an extra Gigabit Ethernet port for management purposes",
      which is the 17th; and "a console port", RJ45 (page: Serial console port RJ45). Neither jack is 10/100 only,
      so the management jack is filed at 1g.
  buttons:
    confidence: photo-measured
    note: >-
      One round button printed RESET at the left of the first plate, drawn with the library's recessed reset-button part.
  power-and-slots:
    confidence: photo-measured
    note: >-
      Photograph 2356 (the rear, from above) shows two slots side by side, printed 2 and 1 and under them POWER 2 /
      POWER 1 with 100-240 V ~9 A MAX, 50/60 Hz. Slot 1, the right one as seen from behind, holds a hot-swap
      supply: a metal frame with captive screws, a pull handle, a round fan opening, a C14 inlet standing on end and a
      blue release tab. Slot 2, the left one, is closed by a flat grey cover with two latches. The brochure says the box
      "comes with a reliable 600 W power supply", that "we've reserved an expansion slot for an additional PSU" and that
      "G1483-0600WNB, hot-swap 600 W power supply" is "available for purchase separately"; the page lists one AC input
      and two PSU slots. So the shipped supply is a module in a slot, not part of the chassis, and the expansion slot is the
      one the cover closes. The shipped supply is not named by any held document: the brochure does not say that it is
      the G1483-0600WNB, so no part is seated in slot 1 and gap `shipped-supply-part` says so. Both slots offer the
      G1483-0600WNB. No blank part is in the library and none has a part number in a held document, so slot 2 is
      empty in the base configuration and its cover is drawn as panel paint under it (gap `slot-2-cover`). Slot
      positions are read from the photograph across the chassis width at 5.355 px per mm and down at 4.775 px per mm
      (the photo looks down at the rear, so y is estimated, about 1.5 mm and x about 2 mm): slot 1 at 357.6 mm, slot 2
      at 275.5 mm, each 74.7 x 41.9 mm, the cover plate 272.6 to 352.4 mm. The printed rating is carried as printed;
      the brochure's nominal 10.35 A and maximum 11 A are the box's whole figures, not the 9 A on each supply's label.
  rear-layout:
    confidence: photo-measured
    note: >-
      From photograph 2356: a hex vent field 101.8 x 38.3 mm at 48.6 mm, 3.6 mm (the photo shows a fan behind it), and
      the legends 2▸ and 1▸ left of the two slots and POWER 2 / POWER 1 with the rating line at 252.5 mm. The rear is
      the full 444.5 mm across, seen from behind with the first slot at the right.
  side-layout:
    confidence: estimated
    note: >-
      estimated - the drawing has no side view. Photograph 2355 shows the right wall, which carries one round fan
      opening with a honeycomb mesh near the front. It is drawn 32 mm across, centred 58 mm from the front and 22.2 mm
      down, read off the photograph, which looks at the wall obliquely (about 8 mm). The left wall is not shown by any
      held document and is left empty.
  top-layout:
    confidence: drawing
    note: >-
      The drawing's top plan, at 2.382 px per mm from the body's top-left corner, shows four slots, each 8.4 mm wide, at 26.9,
      61.7, 111.7 and 146.5 mm from the left and from 15.1 to 202.8 mm from the front, and the Cloud Switch mark (a
      brand mark, not drawn). Photograph 2357 shows them as raised grooves in the lid, not openings, so they are drawn
      as paint and not as vents.
  ears:
    confidence: drawing
    note: >-
      Rack ears are in the box (brochure, Included parts: Rackmount ears; page: Rackmount ears (CRS)). The drawing's front
      view and top plan show the body with a thin flange at each end and no ear plate, so the ears are shipped flush
      with the face and drawn at the face plane; they are not drawn. The page also lists cable-management brackets, an
      IEC cord and a K-57 kit (a screw set, per the intake notes); none is a rack kit, and the brackets, which the
      drawing shows standing 29 mm off the rear edge, are accessories and not drawn.
  colour:
    confidence: photo-measured
    note: >-
      medians of photograph 2357: face #dedad3, plate #bcb0a3. The chassis colour is the face's.
