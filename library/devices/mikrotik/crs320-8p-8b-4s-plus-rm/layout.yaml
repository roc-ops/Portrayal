configurations:
  base:
    kind: base
    description: >-
      CRS320-8P-8B-4S+RM - 16 Gigabit PoE-out ports (Ether1-8 at 802.3af/at, Ether9-16 at 802.3bt), a Gigabit
      management port, four SFP+ cages and the RJ45 console, with two hot-swap supply slots and three fans. The box holds a
      power cord, a fastening set, rack ears, cable-management brackets and a K-57 kit. No part is seated in either
      slot: no held document names the supply that ships.
    default: true
    bays: {psu-1: '', psu-2: ''}
    part-numbers:
      CRS320-8P-8B-4S+RM: {}
