gaps:
- what: size-figures
  scope: [front]
  reason: sources-disagree
  note: >-
    The drawing prints 444.5 across the front and 44.4 for the height; the brochure prints 444 x 235 x 44 mm (the page
    leaves its Dimensions field blank). The drawing's 444.5 and 44.4 are carried, the brochure's being roundings; the
    depth 235 is the same in both.
  wanted: none
- what: shipped-supply-part
  scope: [rear]
  reason: vendor-silent
  note: >-
    The brochure says the box "comes with a reliable 600 W power supply" and that the G1483-0600WNB, a "hot-swap 600 W
    power supply", is "available for purchase separately". The photograph shows the shipped supply as a hot-swap module
    in slot 1, but no held document says its part number, or that it is the G1483-0600WNB. Slot 1 seats no part in the
    base configuration, so the box's own AC inlet exports through the G1483-0600WNB module type and not through the
    device type.
  wanted: MikroTik's part number for the supply shipped in the box.
- what: slot-2-cover
  scope: [rear]
  reason: vendor-silent
  note: >-
    A flat grey cover with two latches closes slot 2 in photograph 2356. No held document names it or gives it a part
    number and the library holds no generic blank for a supply slot, so it is drawn as panel paint under the empty bay.
  wanted: The blank cover's part number.
- what: part-dimensions
  scope: [rear]
  reason: needs-drawing
  note: >-
    No held document dimensions the G1483-0600WNB: no data sheet and no drawing. Its size is estimated from the
    photograph, 74.7 x 41.9 mm, and its depth is a guess.
  wanted: A data sheet or drawing for the G1483-0600WNB.
- what: fan-count
  scope: [rear, right]
  reason: needs-photo
  note: >-
    The product page counts 3 fans. Photograph 2356 shows a fan behind the rear vent and photograph 2355 one in the
    right wall; the third is shown by nothing held, and the left wall is not shown.
  wanted: A photograph or drawing of the left wall and the interior.
- what: left-wall
  scope: [left]
  reason: needs-drawing
  note: >-
    The photographs show the right wall only and the drawing has no side view. The left wall is left empty and is not
    drawn from the right.
  wanted: A left side view.
- what: poe-lamps
  scope: [front]
  reason: vendor-silent
  note: >-
    The eight grey bars, one over each column of jacks, may be PoE lamps; the colour key (red af / at, purple bt) suggests so. No document
    says, and no held photograph shows one lit, so they are drawn as printed bars.
  wanted: MikroTik's description of the PoE bars.
- what: led-states
  scope: [front]
  reason: vendor-silent
  note: >-
    Searched the brochure, the product page and the quick guide page for an LED table: none. The guide is safety text
    only. The lamps carry the component's own vocabulary and no meaning is stated.
  wanted: MikroTik's LED description for the CRS320-8P-8B-4S+RM.
- what: status-lamp-order
  scope: [front]
  reason: vendor-silent
  note: >-
    The four lamps are the drawing's dots and the legends are printed beside four outlined circles elsewhere; which lamp
    takes which legend is assumed to follow the order top to bottom.
  wanted: MikroTik's lamp order.
- what: weight
  scope: [front]
  reason: vendor-silent
  note: >-
    Neither the brochure nor the product page gives a weight.
  wanted: MikroTik's weight.
- what: eol
  scope: [front]
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so no lifecycle is
    written.
  wanted: none
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: >-
      the 16 10/100/1000 PoE-out ports, Ether1-8 at 802.3af/at and Ether9-16 at 802.3bt (each port's own attrs say
      which); rel-pos carries the number printed on the front, the lower jack of a column takes the odd number
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      the four SFP+ cages, printed 1 to 4, 1 and 3 below and 2 and 4 above; they take 1G, 2.5G and 10G modules
  sfp-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the arrow lamps of the SFP+ block, two for each cage
  mgmt:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the Gigabit Ethernet port printed ETH / BOOT
  console:
    term: Port
    role: management
    index-origin: 1
    description: the RJ45 serial console
  controls:
    term: Button
    role: management
    index-origin: 1
    description: the RESET button
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the lamps printed FAN FAULT, POE FAULT, USER and POWER
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: capacity adds, 1150 W with both (form not stated)
      redundancy-note: >-
        Brochure: the box "comes with a reliable 600 W power supply" and has an expansion slot for an additional PSU
        to raise the output to 1150 W; the specification reads "600 W (1150 W with additional PSU)". The additional
        supply raises the output; no held document says whether either supply can carry the box alone, so no 1+1
        form is written.
    description: >-
      the two hot-swap supply slots, printed POWER 1 and POWER 2; one AC supply ships in slot 1 and slot 2 is the
      expansion slot, covered as shipped
