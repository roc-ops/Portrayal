  power:
    power-max-w: 49
    power-max-w-page: 60
    power-without-attachments-w: 31
    power-input: '100 - 240 V AC, two inputs'
    power-rating-label: 100-240 V ~1 A MAX 50/60 Hz (printed under each inlet)
  thermal:
    cooling: 2 fans (page), plus a finned heatsink block
  environmental:
    operating-temp-c: -20 to 60 (tested)
  platform:
    cpu: AL32400, 1700 MHz, 4 cores, ARM 64 bit
    ram: 4 GB DDR4
    storage: 128 MB NAND
    os: RouterOS v7, license level 6
  features:
    optics-sfp-plus: >-
      brochure: twelve 10G SFP+ ports; the brochure prints no list of optics, so none is claimed beyond the cage
    optics-sfp28: >-
      brochure: two 25G SFP28 ports; the brochure prints no list of optics, so none is claimed beyond the cage
