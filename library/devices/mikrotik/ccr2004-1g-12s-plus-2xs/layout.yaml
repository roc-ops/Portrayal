gaps:
- what: front-elevation
  scope: [front]
  reason: needs-drawing
  note: >-
    No dimensions drawing is held; the front is read off studio photograph 1937, which looks down on it, so x is
    photo-measured and y is estimated.
  wanted: A dimensioned front view.
- what: rear-elevation
  scope: [rear]
  reason: needs-drawing
  note: >-
    No rear view is held (NetBox has no rear elevation for this model); the rear is read off studio photograph 1936,
    which looks down on it, so the y positions are estimated.
  wanted: A dimensioned rear view.
- what: power-figures
  scope: [front]
  reason: sources-disagree
  note: >-
    The brochure gives 49 W maximum; the product page gives 60 W maximum and 31 W without attachments. The brochure's
    49 W is carried as the maximum, the page's 60 W is kept as power-max-w-page, and the 31 W is the page's figure
    without attachments and is not a maximum.
  wanted: MikroTik's statement of the maximum consumption.
- what: psu-slots
  scope: [rear]
  reason: vendor-silent
  note: >-
    The brochure says a dual redundant power supply is included and "Number of AC inputs 2"; the page lists no PSU
    slots; no held document prints a supply part number or shows a module. The two supplies are part of the chassis
    with their inlets and no bay is added; the base configuration exports two power ports.
  wanted: The supply's part number and a statement of what is replaceable.
- what: fan-count
  scope: [rear]
  reason: vendor-silent
  note: >-
    The page says 2 fans and the rear photograph shows two round fan openings and a finned heatsink block. The block
    is drawn as chassis art and not counted as a fan; no document says whether it is cooled by either fan, and none
    states a fan redundancy form.
  wanted: MikroTik's fan count and cooling description.
- what: vent-pattern
  scope: [front]
  reason: needs-drawing
  note: >-
    The metal's vent band over the cages is a row of slots that grow towards the right, and the schema on main has no
    such pattern (it is the zigzag family #1311 adds as `chevrons`), so the band is drawn with the nearest, `vent`.
    The band takes `chevrons` once that pattern is on main, if the owner agrees it fits.
  wanted: The `chevrons` decoration pattern, or a slot-row pattern.
- what: led-states
  scope: [front]
  reason: vendor-silent
  note: >-
    Searched the brochure, the page and both quick guides for an LED table: none. The lamps carry the component's own
    vocabulary and no meaning is stated.
  wanted: MikroTik's LED description for the CCR2004-1G-12S+2XS.
- what: right-wall
  scope: [right]
  reason: needs-drawing
  note: >-
    No held photograph shows the right wall (1935 shows the left, 1936 and 1937 are straight rear and front), so it is
    left empty.
  wanted: A photograph or drawing of the right wall.
- what: top-and-bottom
  scope: [top, bottom]
  reason: needs-drawing
  note: >-
    Photographs 1935 and 1937 show a plain lid with embossed lettering and shallow grooves; no document shows the
    underside.
  wanted: A top and a bottom view.
- what: weight
  scope: [front]
  reason: vendor-silent
  note: Neither the brochure nor the page gives a weight.
  wanted: MikroTik's weight.
- what: eol
  scope: [front]
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so no lifecycle
    is written.
  wanted: none
