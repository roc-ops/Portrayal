format: 1
kind: device
name: ccr2004-1g-12s-plus-2xs
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CCR2004-1G-12S+2XS
portfolio: {line: Routers, family: Cloud Core Router, series: CCR2004}
description: >-
  MikroTik CCR2004-1G-12S+2XS is a fixed 1U Cloud Core Router with twelve 10 Gigabit SFP+ cages, two 25 Gigabit SFP28
  cages, a gigabit management jack and an RJ45 serial console, and runs RouterOS v7. The front carries the stacked pair
  of SFP28 cages at the left with four arrow lamps, the twelve SFP+ cages each with an ACT and a 10G lamp above it,
  the console over the management jack, RESET and four status lamps. Two AC inlets, each with its supply built in,
  two fan openings and a finned heatsink block are on the rear. The brochure says the supply is dual redundant but
  prints no part number and the rear photograph shows no removable module, so the supplies are part of the chassis
  and there are no bays.
profile: networking
provenance:
  sources:
    confidence: photo-measured
    note: >-
      CCR2004-1G-12S+2XS brochure, MikroTik (file CCR2004-1G-12S2XS_250452.pdf; no date is printed, the file name
      carries a revision stamp): specifications and included parts. Its page 2 holds a product photograph that the
      conversion dropped; the PDF page could not be rendered on the host that drew this device (no PDF page
      renderer), so the studio photographs below are the faces' evidence. Product page, MikroTik (saved 2026-10-26):
      dimensions, AC inputs, power, cooling type. Quick guide (PDF CCR2004-1G-12Splus2XS-qg_200432.pdf and the saved
      help page, pageId 23396389): first steps, safety and the reset button, no LED table. Block diagram
      CCR2004-1G-12Splus2XS_200459.png (held, not used for geometry). Studio photographs, each opened: 1937 (straight
      front, from above; measured), 1936 (straight rear, from above; measured) and 1935 (front left three-quarter,
      shows the left wall). NetBox's device type and its front elevation image as a second opinion only (no rear
      elevation is held). No figure numbers: MikroTik prints none. The hardware manual page is not held.
  datasheet:
    confidence: datasheet
    note: >-
      Brochure specifications: product code CCR2004-1G-12S+2XS, AL32400 1700 MHz, 4 cores, 4 GB DDR4, 128 MB NAND,
      1 gigabit Ethernet port, 12 SFP+ ports, 2 SFP28 ports (25G), RouterOS v7 license level 6, AC power supply 100 -
      240 V, 2 AC inputs, 443 x 224 x 44 mm, -20 to +60 C tested, 49 W maximum; included: 2 IEC cords, rackmount
      bracket white, fastening set for rackmount case. The page adds 60 W maximum, 31 W without attachments and
      2 fans.
  gate-1:
    confidence: photo-measured
    note: >-
      No drawing is held. Photograph 1937's body is 1462 px across at the displayed 2000 px width for the printed 443
      (3.30 px per mm); x is taken at that scale from the body's left edge, measured on crops at 9.8 px per mm. The
      photograph looks down on the chassis, so the face is foreshortened by about 8 percent (the face is 133 px for
      44 mm, 3.02 px per mm): y is measured up from the face's bottom edge and is estimated. The SFP+ pitch reads
      19.81 mm across eleven steps (43.0 to 260.9 mm), on a quantity the scale never saw.
  chassis:
    confidence: datasheet
    note: >-
      443 x 224 x 44 mm: the brochure and the product page print the same figures. The width is the full ear-to-ear
      width as printed (the ears ship flush). No drawing is held, so it cannot be checked whether the 224 includes
      what stands off the rear: the wire retaining clips of the inlets stand off the rear edge in photographs 1935 and
      1937, and the depth is carried as printed, taken as the body with the retaining clips not counted (assumed, not
      measured).
  front-layout:
    confidence: photo-measured
    note: >-
      From photograph 1937 at 3.30 px per mm in x. SFP28 stack: cage left at 15.4 mm, upper cage top at 11.5 mm and
      lower at 27.5 mm (a 16.0 mm row pitch), with a grey strip between the cages that carries four printed arrows.
      SFP+ cages: 15.2 mm wide, first centre at 43.0 mm, 19.8 mm pitch, top at 27.4 mm. The console and management
      jacks sit in one 17.6 x 27.0 mm plate at 277.7 mm; RESET at 299.7 mm. The vent band over the cages is a row
      of slots that grow towards the right and end in a sweep over the console; it is drawn as one field.
      Face colour #dddddd (the photograph's lit median is lighter), drawn so it reads on the light stage.
  lamps:
    confidence: photo-measured
    note: >-
      Each SFP+ cage has an ACT lamp 5.2 mm left of its centre and a 10G lamp 4.4 mm right of it, both 4.6 x 2.6 mm
      as drawn on the metal, with ACT and 10G printed above. The SFP28 stack has four arrows (down, up, down, up)
      in its strip, printed with 1 and 2 beneath. The four chassis lamps (USER, FAULT, PWR 2, PWR 1) are at 307.3
      mm. No held document says what a lamp shows.
  port-numbering:
    confidence: photo-measured
    note: >-
      SFP+ 1 to SFP+ 12 are printed under the cages, left to right. The SFP28 stack prints 1 with a down arrow and 2
      with an up arrow under it, as the CRS518 prints its stacks, so the lower cage is 1 and the upper 2. MGMT/BOOT is
      printed under the lower of the two stacked jacks and CONSOLE, with an arrow, beside the upper, so the
      management jack (the brochure's one gigabit port) is the lower one and the console the upper.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - no rear elevation is held; the positions are read off photograph 1936 (crop at 4.33 px per mm).
      It looks down on the rear, so x is good to about 1.5 mm and y, from the face's bottom edge, to about 2.5 mm.
      Inlets at 31.0 and 111.6 mm with POWER 1 or 2 and the rating line under each; fan openings 37 mm across at
      170.2 and 385.5 mm; the heatsink block 161 mm wide from 203.4 mm, with 23 fins on a 7.0 mm pitch. The inlets'
      wire retaining clips are not drawn (no registry part).
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The brochure says "dual redundant power supply" and "Number of AC inputs 2"; the page says "Number of AC
      inputs 2" and lists no PSU slots. No held document prints a supply part number and photograph 1936 shows two
      plain C14 inlets with wire clips and no module, handle or latch, so the supplies are part of the chassis with
      their inlets and no bay is drawn. The page says "Cooling type 2 fans" and the photograph shows two round fan
      openings, one after the second inlet and one at the right of the heatsink; the finned heatsink block between
      them is chassis art, not a third fan (as the CRS309's is).
  side-layout:
    confidence: estimated
    note: >-
      Photograph 1935 shows the left wall plain: a screw and a few holes, no vent or grille. No held photograph shows
      the right wall.
  ears:
    confidence: datasheet
    note: >-
      Rack ears are in the box (brochure: Rackmount bracket white). They ship flush with the face and are not drawn.
  colour:
    confidence: estimated
    note: >-
      The median of photograph 1937's face is lighter than #dddddd; the face is drawn #dddddd so it reads on the
      light stage.
