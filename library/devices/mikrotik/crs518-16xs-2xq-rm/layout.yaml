configurations:
  base:
    kind: base
    description: >-
      CRS518-16XS-2XQ-RM - sixteen 25G SFP28 cages, two 100G QSFP28 cages, a 100 Megabit management port, an RJ45
      console and a USB type A port, with two hot-swap AC supplies and four hot-swap fans (all part of the chassis in
      this model). The box holds two power cords, rack ears and a fastening set.
    default: true
    part-numbers:
      CRS518-16XS-2XQ-RM: {}
