format: 1
kind: device
name: crs518-16xs-2xq-rm
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS518-16XS-2XQ-RM
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS518}
description: >-
  MikroTik CRS518-16XS-2XQ-RM is a fixed 1U Cloud Router Switch with sixteen 25 Gigabit SFP28 cages and two 100 Gigabit
  QSFP28 cages, a 100 Megabit management port, an RJ45 serial console and a USB type A port, and runs RouterOS v7. The
  front carries the two QSFP28 cages, the eight stacked pairs of SFP28 cages with four arrow lamps each, the console over
  the management port, RESET, the USB port, four status lamps and a chevron vent along the top edge. Two AC inlets, each
  with its supply built in, and four fan openings are on the rear. The brochure calls the supplies and fans hot-swap but
  prints no part number for either, so they are part of the chassis and there are no bays.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Dimensions drawing "CRS518-16XS-2XQ dimensions", MikroTik, printed 20.09.2023 (file
      CRS518_16XS_2XQ_dimensions_230916.pdf; page image at 3308 px across, about 2.63 px per mm on the front view): front,
      left side, top plan and isometric. CRS518-16XS-2XQ-RM brochure, MikroTik (file CRS518-16XS-2XQ-RM_220739.pdf; no
      date is printed, the file name carries a revision stamp): specifications, powering and included parts. Product
      page, MikroTik (https://mikrotik.com/product/crs518_16xs_2xq, saved 2026-10-26). Studio photographs 2196 (front,
      from slightly above), 2197 (rear, from slightly above) and 2198 (front left, three-quarter, showing the left wall).
      The quick guide page (Quick Guide - CRS518-16XS-2XQ-RM, help.mikrotik.com) holds no figure and no LED table. The block
      diagram CRS518-16XS-2XQr2_261026.png. NetBox's device type as a second opinion only. MikroTik prints no figure
      numbers. The hardware manual page is not held.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: product code CRS518-16XS-2XQ-RM, switch chip 98DX8525, QCA9531 650
      MHz MIPSBE, 64 MB DDR2, 16 MB flash, 1 x 100M Ethernet, 16 x 25G SFP28, 2 x 100G QSFP28, one USB type A, RouterOS v7
      only, 443 x 265 x 44.5 mm, -40 to +70 C, two AC inputs 100-240 V, nominal 12 V and 12.5 A, 45 W without
      attachments and 77 W at most with all the attachments. Included parts: 2 power cords, a fastening set, rack ears.
      The text says "dual-redundant hot-swappable power supplies and fans" and states no redundancy form. Each figure is
      filed as the document words it. NetBox lists the management port as 1000base-t where the page says 100M; the page
      is carried.
  gate-1:
    confidence: drawing
    note: >-
      The drawing's front view body is 1163 px wide in the page image for the printed 443 (2.625 px per mm) and 380
      crop px tall at 3.3 times enlargement, which reads 43.9 mm, the printed 44. Every x and y below is taken at 2.625 px per
      mm from the body's top-left corner of the front view, to about 0.4 mm.
  chassis:
    confidence: drawing
    note: >-
      443 wide, 44 high, 268 deep, as the drawing prints them. The brochure and the page print 443 x 265 x 44.5: the
      drawing's 268 reaches the front of the cages and the 44 is the body; the drawing's 268 and 44 are carried. The top plan
      also dimensions 18 mm beyond the rear (the supply and fan handles) and 8.1 mm at the right-hand end (the screw
      bosses of the rear modules); neither is part of the 268.
  front-layout:
    confidence: drawing
    note: >-
      From the drawing's front view. Two QSFP28 cages centred at 28.5 and 54.5 mm (a 26.0 mm pitch), 31.3 mm down, drawn
      21.0 x 11.2 and carried with the registry's 20.0 x 10.15 opening. Eight stacks of two SFP28 cages, column centres
      83.3 mm plus 21.2 mm a column, the two openings centred at 15.6 and 31.2 mm (a 15.6 mm row pitch) and a middle strip
      with four arrow lamps at 23.3 mm, read at -4.0, -1.3, +1.6 and +4.5 mm from the column centre (a down, up, down and up
      arrow) and carried at -4.4, -2.1, +2.1 and +4.4 mm, symmetric about the centre, 0.1 to 0.8 mm from the reading. Two lamps above each QSFP28 cage at 23.4 mm, 26.3 and 30.4 mm (cage 1) and 52.3 and 56.4 mm
      (cage 2). The console and management jacks share a plate 18.0 x 26.7 at 250.2 mm, 10.2 mm, the console above. The
      RESET button is a ring at 272.7 mm, 32.1 mm. The USB bezel is 8.5 x 15.8 at 277.3 mm, 21.2 mm, standing upright.
      The four status lamps are a column of rings at 290.6 mm, 17.6, 22.5, 27.5 and 32.4 mm. The vent along the top edge
      is a row of separate solid openings, a lambda then a V, alternating, each with its feet and top ends cut level and
      a small step on one edge (photograph 2196, brochure figure 1, and the drawing's front view). No fixed pattern draws
      them, so the band is `pattern: motif` and the tile is stated once, as `pattern-pitch`: 16.5 x 6.07 mm,
      the cells' 5.67 mm extent (the feet and tops level with each other, 2.4 to 8.07 mm down the face) with 0.2 mm clear
      above and below: a tile edge that touches ink is filtered against the ink on its opposite edge and drew a faint
      dashed line along the band's top and bottom edges. Drawn from photograph 2196 (estimated), whose face is 2490 px across at the band for the printed 443, so
      5.62 px per mm across and 5.29 px per mm down (the photograph looks slightly from above; the face reads 0.94 of its
      height); the shape is the mean of 20 periods of the dark mask (threshold 70 of 255), 92.8 px apart. The tile
      starts at a lambda's left foot and holds the lambda, the V that follows it and the part of that V's right arm that
      runs past the tile's right edge (the third cell, a 1.2 mm piece at the tile's left). The band is 27 lambdas and 26
      Vs, from a lambda to a lambda, in three rects: the first period at 2.1 mm (its own 18.4 mm tile: the lambda, the
      V and the V's arm tip, with 0.2 mm clear at the left, so the band's first mark is the lambda), 25 periods and the
      26th V's arm (413.8 mm) from 18.8 mm, and the 27th lambda in a rect at 431.3 mm, 9.5 mm wide, so no half V shows
      past the last lambda. Photograph 2196 shows no V
      before the first lambda: its left foot is cut off by the wall, so the lower part of that leg reads grey (about
      #5e5e5e, median of 64 pixels in 2196, box 169,450 to 177,458) and not black; a motif cell has one dark fill, so the foot
      is drawn black like every other. The drawing's front view, at 2.6275
      px per mm (the 443 mm body is 1164 px across, 542 to 1706), puts the first lambda's foot 2.1 mm from the left edge,
      the last lambda's foot 1.6 mm from the right and the period at 16.5 mm (ink span 1154 px less one lambda, over 26);
      the band is drawn 2.3 mm in from the left and 2.4 mm down. The rear's four fan
      openings each show a plain hub about half the opening's width, read off photograph 2197 (about 19 mm).
  lamps:
    confidence: estimated
    note: >-
      The four arrow lamps of a stack: an arrow points at the cage it belongs to, so a down arrow is the lower cage (the one
      numbered 1 of the pair, printed 1 with a down arrow under the stack) and an up arrow the upper one (printed with an up
      arrow before the 2). Which of the two pairs of a stack is the speed lamp and which the activity lamp is read from
      the legend photograph 2196 prints beside the first stack, and is not stated by a document (gap `led-states`), so the
      two pairs are not named. The two lamps over each QSFP28 cage are printed ACT and 100G, left to right. The four status
      lamps are printed USER, FAULT, PWR 2 and PWR 1 from the top; the photograph shows them as small lenses, green, red,
      blue and blue. No document says what a lamp shows.
  port-numbering:
    confidence: photo-measured
    note: >-
      The metal prints 1 and 2 under each cage of the QSFP28 pair and, under each SFP28 stack, 1 with a down arrow at its
      left and an up arrow with 2 at its right, then 3 4 to 15 16 on the stacks to the right. The lower cage of a stack
      takes the odd number, as on the CRS320's SFP+ block. The groups are printed 40G/100G and 1G/10G/25G.
  management-and-console:
    confidence: photo-measured
    note: >-
      Photograph 2196 prints CONSOLE against the upper jack and ETH / BOOT against the lower, MANAGEMENT under the plate.
      The page counts one 100M Ethernet port, the management port, filed at 100m, and the console is the RJ45 serial.
  usb:
    confidence: photo-measured
    note: >-
      One USB type A port standing upright (page: "1 (type A)", no generation printed). Photograph 2196 shows a white
      tongue, drawn with the registry's white-tongue skin as on the CRS418.
  buttons:
    confidence: photo-measured
    note: One recessed round button printed RESET, drawn with the library's reset-button part.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The brochure lists two AC inputs and "dual-redundant hot-swappable power supplies and fans". The rear photograph
      (2197) shows two supply modules at the left, each with a C14 inlet, a steel retaining clip, a handle and a vent,
      and four fan modules, each with a handle, two screws and a round hex grille. No held document prints a part number
      for the supply or the fan (the brochure, the page, the quick guide page and the drawing were searched), so none is
      named: the supplies are part of the chassis with their inlets, as on juniper/ex2300-24t, there are no bays, and the
      fans are four openings (gaps `hot-swap-supplies`, `hot-swap-fans`). The brochure says nothing of what covers an empty
      slot. Each inlet is the registry's C14 with the rating legend the rear label prints partly hidden behind the module
      edge ("POWER 1 / POWER 2", "100-24[0] V ~2.5 A MAX, 50/60 Hz"), carried as read. The brochure's 77 W is the box's
      maximum with all the attachments.
  rear-layout:
    confidence: photo-measured
    note: >-
      From photograph 2197 (the rear, from slightly above), x across the 443 mm at 4.04 px per mm and y estimated (the
      photograph looks down). Supply modules 62.9 mm wide at 3.2 and 66.1 mm, with inlets centred at 50.2 and 113.1 mm and
      21.5 mm down; fan modules 60.5 mm wide at 156.3, 226.5, 296.6 and 363.0 mm, each grille about 38 mm across,
      centred 191.8, 261.9, 332.5 and 393.8 mm and 20.5 mm down. Read to about 2 mm. The hexagon fields are measured
      on 2197 at 5.80 px per mm (the face is 2570 px across the printed 443 mm), estimated: on a fan guard (box 1165,440
      to 1395,665; 42 whole openings) an opening is 4.31 mm across its corners and 3.62 mm across its flats, the column
      step 4.23 mm and the same-column pitch 4.70 mm (the photograph looks down, so the vertical figure reads short);
      on a supply grille (box 200,455 to 360,635; 14 whole openings) 5.34 across corners, 4.66 across flats, a column
      step of 5.09 mm and a pitch of 5.82 mm. They were the renderer's plain vent tile (8.86 x 5.11 mm, hexagons 5.1 mm
      across the corners on a 4.43 mm column step), which scaled by `pattern-pitch` cannot give the metal's thick
      webs (the openings are 4.31 on a 4.23 step, not 5.1 on 4.43), so each field is a `motif` tile of one regular
      hexagon period: a fan's is 8.45 x 4.88 mm with openings 4.31 mm across the corners, a supply grille's 10.18 x
      5.88 mm with 5.34 mm openings (the nearest-neighbour distance is the measured pitch, 4.88 and 5.88 mm). A fan's
      lattice starts on a hexagon centred under the hub, as the photograph shows (a column of hexagons runs through
      the hub), and a supply grille's at a whole column 5.3 mm in and 5.1 mm down; the guard's circle cuts the outer
      ring, two to three hexagons between the hub and the edge. The `pattern-pitch` of each is its tile.
  side-layout:
    confidence: estimated
    note: >-
      The drawing's side view is the left wall (first-angle projection: the top plan sits below the front view) and shows
      screws and holes with no vent; photograph 2198 shows the same plain wall. The isometric shows a hex vent on the right
      wall near the front, drawn 30 x 20 mm, 8 mm from the front and 12 mm down, scaled off the isometric (about 4 mm).
  ears:
    confidence: drawing
    note: >-
      Rack ears are in the box (the brochure: Rack ears; also 2 power cords and a fastening set). The drawing's front view
      and top plan show the 443 mm body with no ear plate, so the ears are shipped flush with the face and are not drawn;
      no kit is listed.
  colour:
    confidence: estimated
    note: >-
      Each value is the median of a plain area, away from ports, lamps, labels and text, taken with a script over the
      photograph's pixels. Neither source holds an unshaded patch: both are lit from left to right, from #bbbbbb at the
      left end to #c9c9c9 at the right (the lit photograph reads about #c7c7c7 on its right half). The face is drawn
      #c0bfbf, the channel-wise median of three plain patches of photograph 2196 (face pixels only, ink left out):
      box 200,470 to 480,500 #bbbbbb (8398 pixels), box 1260,625 to 1560,640 #c0bfbf (4254 pixels), box 1660,470 to
      2360,500 #c7c7c7 (20980 pixels), a spread of 12 levels. The brochure's straight-on figure 1 (fig-0001) agrees on its three
      patches: box 0,42 to 200,58 #bbbbbb (3112 pixels), box 600,125 to 800,140 #bfbfbf (2673 pixels), box 1000,42 to
      1300,58 #c7c7c7 (4800 pixels). The earlier #bbbbbb was the left patch alone. The jack plate is #63625f: 2196,
      box 1563,490 to 1569,590 (600 pixels; box 1580,536 to 1635,546, 550 pixels, gives #62605e). The supply modules are
      #6f6d68: photograph 2197, box 225,460 to 320,468 (760 pixels). The fan modules are #878682: 2197, box 1393,530 to
      1413,620 (1800 pixels), and their hubs #817f7c: box 1255,535 to 1305,565 (1500 pixels). The rear's own face reads
      #cacaca in 2197 (box 2660,520 to 2700,640, 4800 pixels); a device carries one chassis colour and the front's is
      drawn. Photograph 2196's pixels are 8-bit sRGB from a studio render; no lighting is corrected.
