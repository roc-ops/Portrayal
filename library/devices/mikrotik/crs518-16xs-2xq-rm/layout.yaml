gaps:
- what: size-figures
  scope: [front]
  reason: sources-disagree
  note: >-
    The drawing prints 443 across, 44 high and 268 deep; the brochure and the page print 443 x 265 x 44.5. The drawing's
    figures are carried.
  wanted: MikroTik's statement of the body depth.
- what: hot-swap-supplies
  scope: [rear]
  reason: vendor-silent
  note: >-
    The brochure calls the two power supplies hot-swappable and "dual-redundant" and prints no part number, no data
    sheet and no drawing is held, and no document says what the box ships with or covers an empty slot with. They are
    drawn as part of the chassis with their inlets and no bay is added; the base configuration exports two power ports.
  wanted: The supply's part number and a statement of what a slot holds when empty.
- what: hot-swap-fans
  scope: [rear]
  reason: vendor-silent
  note: >-
    The brochure calls the four fans hot-swappable and prints no part number, so they are four openings in the chassis,
    each with the grille the photograph shows. No fan redundancy form is stated.
  wanted: The fan module's part number and a statement of fan redundancy.
- what: led-states
  scope: [front]
  reason: vendor-silent
  note: >-
    Searched the brochure, the page and the quick guide page for an LED table: none. The arrow lamps, the ACT and 100G
    lamps and the four status lamps carry the component's own vocabulary and no meaning is stated; which pair of a stack
    is speed and which activity is not stated, so the lamps are not named.
  wanted: MikroTik's LED description for the CRS518-16XS-2XQ-RM.
- what: top-and-bottom
  scope: [top, bottom]
  reason: needs-drawing
  note: >-
    The top plan shows a plain lid; photograph 2196 shows only embossed lettering and shallow depressions. No document
    shows the underside.
  wanted: A bottom view.
- what: weight
  scope: [front]
  reason: vendor-silent
  note: Neither the brochure nor the page gives a weight; NetBox's 4545 g is not carried.
  wanted: MikroTik's weight.
- what: eol
  scope: [front]
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so no lifecycle is
    written.
  wanted: none
