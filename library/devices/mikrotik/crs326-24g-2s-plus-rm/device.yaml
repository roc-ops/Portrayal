format: 1
kind: device
name: crs326-24g-2s-plus-rm
version: 1.0.2
maturity: modelled
manufacturer: MikroTik
model: CRS326-24G-2S+RM
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS326}
description: >-
  MikroTik CRS326-24G-2S+RM is a fixed 1U Cloud Router Switch. It has 24 10/100/1000 Ethernet ports, two
  SFP+ cages and an RJ45 serial console, and runs SwOS or RouterOS (dual boot). The front carries the
  24 jacks in three blocks of four columns by two rows. They are numbered 1 to 24 as printed, with the
  odd number on the lower jack of a column. Port 1 is marked POE IN for passive PoE power. A lamp with
  the port number printed on it sits under each jack. The front also has the two SFP+ cages with their
  ACT/LINK and 10G lamps. It has the PWR and USR lamps, the RES reset button and the CONSOLE jack. The
  rear carries the DC jack (DC 10-28V as printed), a cable-restraint slot, the earthing stud and the vents.
  There is no built-in mains supply: a 24 V 1.2 A adapter ships in the box, so there are no power bays.
  The round opening on the rear is a stamped fan-guard grille with four fan-mount holes and no fan fitted.
  The product page lists passive cooling, so no fan is drawn. The CSS326-24G-2S+RM is a separate product
  with its own hardware and is its own device.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Dimensions drawing "CRS/CSS326-24G-2S+ dimensions", MikroTik, printed 19.09.2023 (file CRS_CSS326-24G-2S_dimensions_230943.pdf,
      rendered at 200 dpi; the title block reads CRS/CSS326-24G-2S+ dimensions): front, side, top plan
      and isometric. The front view is the CSS326's (it prints Cloud Smart Switch and has no console jack)
      and is used for the shared metalwork. The port numbers are printed inside the lamp boxes on the
      metal; silkscreen is painted under a placed lamp, so they are drawn just under each lamp instead,
      4.5 mm below its centre. CRS326-24G-2S+RM brochure, MikroTik (file CRS326-24G-2SRM_211044.pdf; no
      date is printed, the file name carries a revision stamp): specification table, features, included
      parts. CRS326-24G-2S+RM product page, MikroTik (saved 2026-10-26): dimensions, powering, cooling
      type, included parts (rack ears). The product-page studio photographs 1301 (front) and 1941 (rear),
      and the saved quick guide page for the G1 CRS series (no figures saved). The NetBox community device
      type and elevations were read as a second opinion only. No figure numbers: MikroTik prints none.
      The device name spells MikroTik's + as -plus because a directory name cannot carry +; model: keeps
      the + as printed, and every MikroTik device name in the library does the same.
  datasheet:
    confidence: datasheet
    note: >-
      The CRS326-24G-2S+RM brochure is MikroTik's datasheet for the model (the product page's Brochure
      link): product code, CPU, 512 MB RAM, 16 MB flash, 98DX3236A1 switch chip, 24 10/100/1000 ports,
      two SFP+ cages, SwOS / RouterOS dual boot, 9 - 30 V input by jack or passive PoE, 443 x 144 x 44
      mm, -40 to +60 C tested, 24 W maximum, serial RJ45; the features list and the included parts (24
      V 1.2 A adapter, rack ears, screw set). The 24 W is unqualified, so it is filed as the maximum.
  gate-1:
    confidence: drawing
    note: >-
      The drawing's front view body is 1744 px across at 200 dpi for the printed 443 (3.937 px per mm)
      and 176 px down for 44.5 (3.955 px per mm), 0.5 percent apart, so it is orthographic and every x
      and y below is taken at 3.94 px per mm from the body's top-left corner. The jack pitch then reads
      55 px = 13.97 mm, the registry's ganged RJ-45 pitch, on a quantity the scale never saw.
  chassis:
    confidence: drawing
    note: >-
      443 wide, 44.5 high (the 1U pitch is 44.45), 144.6 deep. The side view dimensions 144.6 and the
      brochure and product page round it to 144 (443 x 144 x 44 mm); the drawing's figure is carried.
      The 11 mm the side view dimensions is the earthing stud's wing nut standing off the rear, not part
      of the depth. 443 is the body between the ear folds (the top plan shows no ears).
  front-layout:
    confidence: drawing
    note: >-
      From the drawing's front view. Three jack blocks, each a 59.9 x 25.5 plate at 36.7, 100.3 and 163.8
      mm (63.5 mm step), four columns of two jacks on 13.97 mm pitch, first jack centre 46.1 mm; the upper
      row is 13.4 mm above the lower and the upper jacks' latch notch is up, the lower's down. The SFP+
      cages are 15.7 mm wide at centres 238.5 and 260.2 mm (21.7 mm apart), top at 25.0 mm. The lamp band
      along the bottom starts at 35.4 mm. The CONSOLE jack position is the empty square the drawing keeps
      at the left, 15.2 x 11.5 mm; the 15.8 x 13.2 mm registry jack is centred in it, 1.7 mm taller than
      the drawn square, so its bottom edge (22.7 + 13.2 = 35.9) runs 0.5 mm into the lamp band, which
      starts at 35.4; the photograph shows the jack reaching the band the same way and the overlap is
      kept. Colours are medians of the straight-on CSS326 studio photograph (plate #dadada, jack plates
      #bebebe, lamp band #8f8f8e).
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed numbers 1 to 24 in lamp boxes under the jacks, a pair under each column, left box first
      (1 2, 3 4 ... 23 24). Which jack takes which number is read from the POE IN bracket, which the drawing
      and the photograph both wrap round the lower left jack: port 1 is the passive PoE input (brochure:
      supported input voltage jack or passive PoE; quick guide: the first Ethernet port accepts passive
      PoE), so the lower jack of each column takes the odd number and the upper the even. No source prints
      a number on the jack itself. The pair's left lamp is taken as the odd port's and the right as the
      even port's; that pairing is estimated.
  lamps:
    confidence: photo-measured
    note: >-
      Each port has one lamp box, 3.2 mm square at 5.9 mm spacing, pair centre 0.6 mm left of the column
      centre (drawing, four pairs measured), centre 38.0 mm. PWR and USR are lamps at 17.2 and 32.8 mm.
      Each SFP+ has an ACT/LINK lamp under the cage centre and a 10G lamp 10.6 mm to its right, joined
      to the cage by a printed line. No document held says what a lamp shows (the brochure and the saved
      quick guide give no LED table), so none carries states beyond the component's own.
  reset:
    confidence: photo-measured
    note: >-
      RES is a round hole at 25.0 mm, centre 38.0 mm, between PWR and USR; the quick guide's reset section
      says to hold the button at boot until the lamp flashes. The library's recessed pinhole is used.
  console:
    confidence: photo-measured
    note: >-
      The RJ45 serial port (brochure: Serial port RJ45) is the shielded jack under the printed CONSOLE,
      at the left of the front. The CSS326 has none; its drawing keeps the same square blank.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - no rear elevation is held; the positions are read off the studio rear photograph 1941.
      It looks down on the rear, so x is taken at the photograph's 3.995 px per mm across the 443 mm body
      and y is estimated: the metalwork is the CSS326's, which the straight-on rear photograph 1268 shows
      with a 8 percent shorter vertical scale, and the shared items (blank plate, three vent fields, two
      round knock-outs, the round vent, three screws) take that photograph's figures, which agree with
      the CRS's in x to 1.5 mm. They are good to about 1.5 mm in x and 2 mm in y. The CRS's cable slot
      runs on to hold the DC jack, 58 mm long against the CSS's 31 mm, and the CRS prints DC 10-28V where
      the CSS prints DC 8 - 30V. The earthing stud has a wing nut (the drawing's 11 mm). It is drawn as
      chassis art at the stud's position from the photograph, because the library's common/ground-stud
      draws a hex nut and a lug seat the stud does not have; the gap `earth-stud-part` asks for a wing-nut
      stud part. The CRS prints an earth symbol above it; the CSS prints none. The DC jack is the placed
      common/dc-barrel (`dc-in`), its bore centred on the photograph's.
  dc-input:
    confidence: photo-measured
    note: >-
      The brochure lists the supported input voltage as 9 - 30 V (jack or passive PoE); the product page
      10-30 V for both inputs; the rear prints DC 10-28V. The three disagree and none is the others' scope:
      the rear legend is drawn as printed and the brochure and page ranges are in attrs. The jack is the
      placed common/dc-barrel (`dc-in`), positioned on the bore of photograph 1941. The CRS quick guide
      is not held as text, so no barrel size is asserted for the CRS.
  dc-in-rating:
    confidence: datasheet
    note: >-
      The rear prints "DC 10-28V" beside the jack (photograph 1941): the `input-voltage` of the dc-in
      jack, carried as printed. The brochure's Included list gives a 24 V 1.2 A adapter, the `current-max-a`.
      The brochure's 9 - 30 V and the product page's 10-30 V are in `attrs.power`. The CRS326 documents
      held give no barrel size (the CSS326 quick guide states one, not this model's document); the jack
      is the library's one nominal `dc-barrel`.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Powering is by the DC jack or by passive PoE on port 1, with a 24 V 1.2 A adapter in the box (brochure,
      Included); no power supply is built in, so none is drawn and there are no power bays. The product
      page gives the cooling type as passive. The round opening on the rear is a stamped fan-guard grille
      with four fan-mount holes and no fan fitted, so it is drawn as a vent and not a fan.
  ears:
    confidence: drawing
    note: >-
      Rack ears are in the box (brochure and product page, Included: Rack ears, Screw set). The drawing's
      side view shows the ear plate at the front end of the body, on the face, so the shipped position
      is flush and the ear is drawn at the face plane; the top plan shows no ears (443 is the body). The
      ears are not drawn.
  colour:
    confidence: photo-measured
    note: >-
      median of the CSS326 straight-on photograph's body (#f5f5f5) and face (#dadada); the CRS326 is the
      same white and grey in its own photographs.
attrs:
  power:
    power-max-w: 24
    power-input: >-
      DC jack, 9 - 30 V (brochure); 10 - 30 V on both inputs (product page); the rear prints DC 10-28V.
      Passive PoE on port 1
    power-adapter: 24 V 1.2 A, in the box
  thermal: {cooling: passive (product page); no fan}
  environmental: {operating-temp-c: -40 to 60 (tested)}
  platform: {cpu: '98DX3236A1, 800 MHz', switch-chip: 98DX3236A1, ram: 512 MB, storage: 16 MB flash, os: SwOS
      / RouterOS (dual boot)}
  features:
    vlan-limit: IEEE 802.1Q, up to 4K VLANs
    optics-sfp-plus: 'brochure: the SFP cage supports both 1.25 Gb SFP and 10 Gb SFP+ modules'
  compliance: {certification: 'CE, EAC, RoHS'}
