  ru: 1
  color: '#dadada'
  ears:
    positions:
    - {name: flush, at: 0, default: true}
  power: dc
gaps:
- what: rear-elevation
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The dimensions drawing has no rear view; the rear is read off studio photographs that look down on
    it, so the y positions are estimated.
  wanted: A dimensioned rear view.
- what: earth-stud-part
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The earthing stud has a wing nut (photograph 1941; the drawing's 11 mm). common/ground-stud draws
    a hex nut and a lug seat, so the stud is chassis art and exports no earth. The reason is the nearest
    the schema has: the part itself is what is missing, and the library has no `needs-part` reason.
  wanted: A wing-nut earth stud part, so the stud is placed and not drawn as chassis art.
- what: led-states
  scope:
  - front
  reason: vendor-silent
  note: >-
    Searched the brochure, the quick guide page and the CSS326 quick guide for an LED table: none. The
    lamps carry the component's own vocabulary and no colour or meaning is stated.
  wanted: MikroTik's LED description for the CRS326.
- what: weight
  scope:
  - front
  reason: vendor-silent
  note: >-
    Neither the brochure nor the product page gives a weight; the NetBox device type says 1.08 kg, a community
    figure not carried.
  wanted: MikroTik's weight.
- what: eol
  scope:
  - front
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so
    no lifecycle is written.
  wanted: none
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: >-
      the 24 10/100/1000 ports; rel-pos carries the number printed on the front, the lower jack of a column
      takes the odd number. Port 1 takes passive PoE input
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      the two SFP+ cages, printed SFP+ 1 and SFP+ 2; they take 1.25 Gb SFP and 10 Gb SFP+ modules
  port-leds: {term: LED, role: indicator, index-origin: 1, description: 'one lamp per RJ45 port, carrying
      the port number'}
  sfp-leds: {term: LED, role: indicator, index-origin: 1, description: an ACT/LINK and a 10G lamp for
      each SFP+ cage}
  console: {term: Port, role: management, index-origin: 1, description: the RJ45 serial console}
  controls: {term: Button, role: management, index-origin: 1, description: the RES reset button}
  status-leds: {term: LED, role: indicator, index-origin: 1, description: the PWR and USR lamps}
  furniture: {term: Item, role: furniture, index-origin: 1}
  inlets: {term: Inlet, role: service, index-origin: 1}
