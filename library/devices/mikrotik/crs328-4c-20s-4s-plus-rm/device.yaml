gaps:
- what: depth-figure
  scope:
  - top
  reason: sources-disagree
  note: >-
    The drawing dimensions 193 mm; the brochure and the product page print 194 mm. The drawing's figure
    is carried.
  wanted: MikroTik's statement of the depth.
- what: right-wall-vent
  scope:
  - right
  reason: needs-drawing
  note: >-
    The right wall's field of round holes is read off the drawing's isometric view, which is not orthographic,
    so its size and position are estimated.
  wanted: A right side view of the unit.
- what: left-wall
  scope:
  - left
  reason: needs-drawing
  note: The drawing's side view shows the left wall as plain, and it is left empty.
  wanted: none
- what: rear-elevation
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The dimensions drawing has no rear view; the rear is read off studio photograph 1528, which looks
    slightly down on it, so the y positions are estimated.
  wanted: A dimensioned rear view.
- what: led-states
  scope:
  - front
  reason: vendor-silent
  note: >-
    Searched the brochure, the product page and the quick guide for an LED table: none. The lamps carry
    the component's own vocabulary and no meaning is stated for USER, FAULT, PWR 2 or PWR 1.
  wanted: MikroTik's LED description for the CRS328-4C-20S-4S+RM.
- what: weight
  scope:
  - front
  reason: vendor-silent
  note: Neither the brochure, the product page nor the quick guide gives a weight.
  wanted: MikroTik's weight.
- what: eol
  scope:
  - front
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so
    no lifecycle is written.
  wanted: none
