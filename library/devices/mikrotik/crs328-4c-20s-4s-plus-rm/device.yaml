format: 1
kind: device
name: crs328-4c-20s-4s-plus-rm
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS328-4C-20S-4S+RM
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS328}
description: >-
  MikroTik CRS328-4C-20S-4S+RM is a fixed 1U Cloud Router Switch with 20 SFP cages, four SFP+ cages and
  four combo ports. Each combo port is a gigabit RJ45 jack (1T to 4T) and an SFP cage (1F to 4F), one
  in use at a time. It also has an RJ45 serial console and runs SwOS or RouterOS (dual boot). The front
  carries the 20 SFP cages in two rows of ten, with the odd numbers on the lower row. Next come the combo
  cages and jacks under a COMBO bracket and the four SFP+ cages. The CONSOLE jack, the RESET and MODE
  buttons and the USER, FAULT, PWR 2 and PWR 1 lamps follow. The rear carries two IEC C14 inlets (POWER
  1 and POWER 2) and two fans. Two supplies are built into the chassis, so there are no bays.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Dimensions drawing "CRS328-4C-20S-4S_dimensions", MikroTik, printed 20.09.2023 (file CRS328-4C-20S-4S_dimensions_230928.pdf,
      rendered at 200 dpi): front, left side, top plan and isometric. CR328-4C-20S-4S+RM brochure, MikroTik
      (file CR328-4C-20S-4SRM_211003.pdf; MikroTik's file name reads CR328; no date is printed, the file
      name carries a revision stamp): specification table, quick specifications. CRS328-4C-20S-4S+RM product
      page, MikroTik (https://mikrotik.com/product/crs328_4c_20s_4s_rm, saved 2026-10-26): dimensions,
      AC inputs, PSU slots, cooling. Quick Guide CRS328-4C-20S-4S+ (file CRS328-4C-20S-4Splus-qgwnc_191052.pdf,
      revision stamp 191052): powering, combo ports, mode button. Studio photographs 1526 (front) and
      1528 (rear): printed legends, colours and counts, and the rear's positions. The block diagram CRS328-4C-20S-4SRM_220948.png.
      The saved help page Quick Guide G1-b lists the model and holds no figures. NetBox read as a second
      opinion only. MikroTik prints no figure numbers. The device name spells MikroTik's + as -plus because
      a directory name cannot carry +; model: keeps the + as printed.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: product code CRS328-4C-20S-4S+RM, CPU 98DX3236A1
      800 MHz, 512 MB RAM, 16 MB flash, 20 SFP cages, four SFP+ cages, four Ethernet/SFP combo ports,
      SwOS / RouterOS (dual boot), 100 - 240 V input by two power supplies with failover, 443 x 194 x
      44 mm, -20 to +60 C tested, 43 W maximum power consumption, serial RJ45, a mode button, temperature
      based fan control, two IEC power cords and rack ears. The quick guide words the 43 W as the consumption
      under maximum load, so it is filed as the maximum. The quick guide says each combo interface has
      two physical connectors of which only one can be used at a time.
  gate-1:
    confidence: drawing
    note: >-
      The drawing's front view body is 1161 px wide in the 200 dpi render for the printed 443 (2.62 px
      per mm) and 114 px tall, 43.5 mm for the side view's 44, so every x and y below is taken at 2.62
      px per mm from the body's top-left corner of the front view. The 20 SFP cages read a 14.25 mm pitch
      inside a block and a 70.2 mm block step.
  chassis:
    confidence: drawing
    note: >-
      443 wide, 44 high, 193 deep: the drawing dimensions 443, 193 and 44. The brochure and the product
      page print 443 x 194 x 44 mm; the drawing's 193 is carried and the 194 is declared a conflict. The
      6 mm the plan dimensions is the two cable loops standing off the rear, an accessory and not part
      of the depth. 443 is the body between the ear folds.
  front-layout:
    confidence: drawing
    note: >-
      From the drawing's front view. Three SFP blocks, each 58.9 x 26.6 at 18.3, 88.3 and 158.6 mm (70.2
      mm step), top at 8.65 mm, four columns of two cages on a 14.25 mm pitch; the third block holds two
      columns of SFP cages (17 to 20) and then the two columns of the combo SFP cages, which begin at
      188.15 mm. The combo copper block is 35.1 x 28.8 at 228.1 mm, top 6.4 mm, four jacks on a 16.8 mm
      column pitch and 14.6 mm row pitch. The SFP+ block is 30.0 x 26.6 at 274.0 mm, top 8.65 mm, two
      cages by two on the registry's 15.1 mm column pitch and 14.0 mm row pitch. The lamps are four circles
      at 307.9 mm, 16.2, 21.1, 26.2 and 31.0 mm. The CONSOLE jack is the 15.8 x 13.2 housing at 311.3
      mm, 22.4 mm. The two round buttons are at 332.2 and 342.4 mm, 30.8 mm. The lower cage and jack of
      each pair are turned the other way up.
  legends-and-colours:
    confidence: photo-measured
    note: >-
      Photograph 1526 prints the SFP numbers 2 4 6 8 over and 1 3 5 7 under each row (and so on to 20),
      2F 4F and 2T 4T over and 1F 3F and 1T 3T under the combo ports, 2 4 over and 1 3 under the SFP+
      cages, COMBO over the combo bracket and SFP, GIGABIT ETH and SFP+ along the blocks, rotated. Their
      positions are taken from the photograph's proportions (the face is 0.92 of its true height there),
      so they are estimated, good to about 1 mm. The USER, FAULT, PWR 2 and PWR 1 legends sit in the photograph
      above and to the right of the lamps, joined to them by a thin bracket that is not drawn. The lamps
      are given the lit colours the photograph shows (yellow, red, blue, blue). The face reads #d9d9d9
      in the photograph's median.
  lamps:
    confidence: estimated
    note: >-
      The SFP cages and the combo jacks carry no lamp the photograph shows, and the brochure counts none.
      The quick guide holds no LED table, so what the four lamps show is a gap.
  port-numbering:
    confidence: datasheet
    note: >-
      The metal prints the numbers as above. The odd number is on the lower cage of a column. The combo
      ports are printed 1T to 4T and 1F to 4F and RouterOS shows them as combo 1 to 4 (quick guide); the
      copper jacks are named copper-1 to copper-4 and the combo cages combo-sfp-1 to combo-sfp-4, with
      the same numbers: the groups say they are one port at a time. The SFP+ cages are printed 1 to 4
      under the 2 4 / 1 3 arrangement.
  console:
    confidence: drawing
    note: >-
      The RJ45 serial port (brochure: serial port RJ45; quick guide: 115200 bit/s) is the jack under the
      printed CONSOLE.
  buttons:
    confidence: drawing
    note: >-
      Two round buttons printed RESET and MODE (quick guide: the reset button, and a mode button that
      runs a RouterOS script). The drawing gives their centres. Both are drawn with the library's recessed
      reset-button part; the MODE one carries function mode.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The product page lists two AC inputs, two PSU slots and two fans; the brochure says two 100 - 240
      V power supplies with failover and temperature based fan control; the quick guide says power comes
      from two IEC connectors. No document held shows a removable supply module or gives a supply part
      number, and the rear photograph shows two bare inlets, so the supplies are built into the chassis
      and there are no bays, as on juniper/ex2300-24t. The two fans are the two hexagon grilles of the
      rear photograph. The photograph also shows a spring wire retaining clip on each inlet, which is
      a cord accessory and is not drawn.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - read off photograph 1528, which looks slightly down on the rear, so x is taken at 3.80
      px per mm across the 443 mm width and y is estimated, good to about 2 mm. The two C14 inlets are
      centred at 22.6 and 61.3 mm and carry POWER 1 and POWER 2 with 100-240 V~1 A MAX 50/60 Hz printed
      under each. The two fan grilles are 35.5 mm across, centred at 183.2 and 390.3 mm. Two of the rear's
      crosshead screws are drawn.
  side-layout:
    confidence: estimated
    note: >-
      The drawing's side view is the left wall (plain: a screw, small holes and the ear plate at the front).
      The isometric shows the right wall with a rectangular field of round holes; it is not an orthographic
      view, so the field is read as a fraction of the wall (from 27 to 122 mm behind the front, 9 to 33
      mm down) and is estimated, good to about 5 mm. The left wall is drawn empty.
  ears:
    confidence: drawing
    note: >-
      Rack ears are in the box (brochure: rack ears; the product page lists them under Included parts).
      The drawing's side view shows the ear plate at the front end of the body, on the face, and the plan
      shows no ears (443 is the body), so the shipped position is flush. The ears are not drawn.
  colour: {confidence: photo-measured, note: median of photograph 1526's face (#d9d9d9).}
