  thermal: {cooling: 'two built-in fans, temperature based fan control'}
  environmental: {operating-temp-c: -20 to 60 (tested)}
  platform: {cpu: '98DX3236A1, 800 MHz', switch-chip: 98DX3236A1, ram: 512 MB, storage: 16 MB flash, os: SwOS
      / RouterOS (dual boot)}
  features:
    vlan-limit: IEEE 802.1Q, up to 4K VLANs
    optics-sfp: 'brochure: twenty SFP cages for 1G modules and four combo SFP cages, none included'
    optics-sfp-plus: 'brochure: four SFP+ cages for 10G modules, none included'
    combo-ports: >-
      four combo ports, each a gigabit RJ45 jack and an SFP cage of which only one can be used at a time
      (quick guide)
  compliance: {certification: 'CE, EAC, RoHS'}
