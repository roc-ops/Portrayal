gaps:
- what: front-elevation
  scope:
  - front
  reason: needs-drawing
  note: >-
    No dimensions drawing is held; the front is read off studio photograph 2625, which looks slightly
    down, so x is photo-measured and y is estimated.
  wanted: A dimensioned front view.
- what: rear-elevation
  scope:
  - rear
  reason: needs-drawing
  note: >-
    No rear view is held; the rear is read off studio photograph 2116, which looks down on it, so the
    y positions are estimated.
  wanted: A dimensioned rear view.
- what: power-figures
  scope:
  - front
  reason: sources-disagree
  note: >-
    The brochure gives 72 W maximum and 60 W without attachments; the product page gives 83 W maximum
    and 60 W without attachments. The brochure's are carried and the page's maximum is kept as power-max-w-page.
    The brochure's "Power adapter nominal voltage 12 V" and "nominal current 10.8 A" are the adapter's
    nominal figures, filed as such and not as the box's input.
  wanted: MikroTik's statement of the maximum consumption.
- what: psu-slots
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The page says "Number of PSU slots 2", the brochure says a dual-redundant power supply is included,
    and no held document prints a supply part number or shows a module. The two supplies are part of the
    chassis with their inlets and no bay is added; the base configuration exports two power ports.
  wanted: The supply's part number and a statement of what a slot holds.
- what: fan-count
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The page says 4 fans and the rear photograph shows five round openings. The four in the right half
    are fans; the fifth, between the inlets, is drawn as a vent. No document says what it is, and none
    states a fan redundancy form.
  wanted: MikroTik's fan count and the opening's purpose.
- what: m2-slot
  scope:
  - front
  reason: needs-drawing
  note: >-
    The brochure lists "Number of M.2 slots 1". No photograph shows an M.2 slot on either face, so it
    is internal: nothing is drawn and no port is added for it, and the export carries no interface for
    it.
  wanted: A statement of where the slot is reached.
- what: vent-pattern
  scope:
  - front
  reason: needs-drawing
  note: >-
    The metal's vent band over the jacks is a zigzag of V shapes and the schema on main has no such pattern,
    so the band is drawn with the nearest, `vent`. The band takes `chevrons` once that pattern is on main.
  wanted: The `chevrons` decoration pattern.
- what: led-states
  scope:
  - front
  reason: vendor-silent
  note: >-
    Searched the brochure, the page and the quick guide page for an LED table: none. The lamps carry the
    component's own vocabulary and no meaning is stated.
  wanted: MikroTik's LED description for the CCR2116-12G-4S+.
- what: top-and-bottom
  scope:
  - top
  - bottom
  reason: needs-drawing
  note: >-
    Photographs 2625, 2629 and 2632 show a plain lid with embossed lettering; no document shows the underside.
  wanted: A top and a bottom view.
- {what: weight, scope: [front], reason: vendor-silent, note: Neither the brochure nor the page gives
    a weight., wanted: MikroTik's weight.}
- what: eol
  scope:
  - front
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so
    no lifecycle is written.
  wanted: none
