format: 1
kind: device
name: ccr2116-12g-4s-plus
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CCR2116-12G-4S+
portfolio: {line: Routers, family: Cloud Core Router, series: CCR2116}
description: >-
  MikroTik CCR2116-12G-4S+ is a fixed 1U Cloud Core Router with twelve gigabit Ethernet jacks, four SFP+
  cages, a thirteenth gigabit jack for management, an RJ45 serial console and a USB 3.0 type A port, and
  runs RouterOS v7. The front carries the four SFP+ cages in two stacks of two with eight arrow lamps,
  the twelve jacks in three blocks of four, the console over the management jack, USB, the MODE and RESET
  buttons and four status lamps. Two AC inlets, each with its supply built in, and five round openings,
  four of them fans, are on the rear. The brochure says the supply is dual redundant and the page counts
  two PSU slots, but no held document prints a part number and the rear photograph shows no removable
  module, so the supplies are part of the chassis and there are no bays.
profile: networking
provenance:
  sources:
    confidence: photo-measured
    note: >-
      CCR2116-12G-4S+ brochure, MikroTik (file CCR2116-12G-4S_260316.pdf; no date is printed, the file
      name carries a revision stamp): specifications, powering, included parts. Product page, MikroTik
      (saved 2026-10-26): dimensions, AC inputs, PSU slots, cooling type, power. Quick guide page (help.mikrotik.com,
      pageId 67633301): first steps and safety, no figure and no LED table. Block diagram CCR2116-12G-4S_240122.png.
      Studio photographs, each opened: 2625 (straight front, from slightly above; measured), 2116 (straight
      rear, from slightly above; measured), 2629 (front left, three-quarter, shows the left wall), 2632
      (front right, three-quarter, shows the right wall). NetBox's device type and front and rear elevation
      images as a second opinion only: its front elevation agrees with photograph 2625 on every count
      and its rear with photograph 2116. ID171_CCR2116-12G-4S_DOC_220159.pdf is the EU declaration of
      conformity (CE, Riga, 12 July 2021) and holds no dimension, port or figure. No figure numbers: MikroTik
      prints none. The hardware manual page is not held.
  datasheet:
    confidence: datasheet
    note: >-
      Brochure specifications: product code CCR2116-12G-4S+, AL73400 2 GHz ARM 64 bit, 16 cores, 16 GB
      DDR4, 128 MB NAND, 13 gigabit Ethernet ports, 4 SFP+ ports, 1 M.2 slot, 1 USB 3.0 type A, 98DX3255
      switch chip, 443 x 199 x 44 mm, -20 to +60 C; powering 2 AC inputs, 100-240 V, adapter nominal 12
      V and 10.8 A, 60 W without attachments, 72 W maximum; included: 2 power cords, rackmount bracket
      white, fastening set.
  gate-1:
    confidence: photo-measured
    note: >-
      No drawing is held. Photograph 2625's body is 1777 px across at the displayed 2000 px width for
      the printed 443 (4.01 px per mm); x is taken at that scale from the body's left edge. The photograph
      looks slightly down, so the face is foreshortened by about 5 percent: y is measured up from the
      face's bottom edge at 44 mm for the face and is estimated. The jack pitch reads 68.2 px = 17.0 mm
      on three gangs, and the same 17.0 mm across the three blocks' twelve jacks (first centres 51.4,
      123.5 and 195.8 mm) on a quantity the scale never saw.
  chassis:
    confidence: datasheet
    note: >-
      443 x 199 x 44 mm: the brochure and the product page print the same figures. The width is the full
      ear-to-ear width as printed (the ears ship flush). No drawing is held, so it cannot be checked whether
      the 199 includes what stands off the rear: the two wire retaining clips of the inlets stand off
      the lid at the rear edge in photographs 2629 and 2632, and the depth is carried as printed, taken
      as the body with the retaining clips not counted (assumed, not measured).
  front-layout:
    confidence: photo-measured
    note: >-
      From photograph 2625 at 4.01 px per mm. SFP+ cages: left column centre 15.2 mm, right 30.4 mm, upper
      cages top at 11.7 mm and lower at 27.3 mm (a 15.6 mm row pitch). Jacks: 16.5 mm frames on a 17.0
      mm pitch, jack top at 25.6 mm, in three plates of four at gutters of 4.2 mm. The console and management
      jacks sit in one 17.2 x 27.4 mm plate at 258.9 mm, USB at 282.5 mm, MODE at 291.4 mm and RESET at
      301.4 mm. Face colour #dddddd (the photograph's lit median is lighter), drawn so it reads on the
      light stage.
  lamps:
    confidence: photo-measured
    note: >-
      Each jack carries its own two small lamps (the component's, green at the left and amber at the right
      in the photograph). The eight arrows between the SFP+ cages are read as four to a stack, two per
      cage, as the CRS518's: down for the lower cage and up for the upper, estimated from the photograph.
      The four chassis lamps (USER, FAULT, PWR 2, PWR 1) are at 309.7 mm, 18.8 to 33.5 mm down. No held
      document says what a lamp shows.
  port-numbering:
    confidence: photo-measured
    note: >-
      Jacks 1 to 12 are printed under the jacks, left to right, under GIGABIT ETHERNET. The SFP+ cages
      print 1 and 3 under the stacks and 2 and 4 over them, so the lower cage of a stack is odd. ETH/BOOT
      is printed under the lower of the two stacked jacks and CONSOLE over the upper, so the management
      jack (the brochure's thirteenth gigabit port) is the lower one and the console the upper.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - no rear elevation is held; the positions are read off photograph 2116 (body 1885 px
      across a 1.05 scaled crop, 4.255 px per mm) and the NetBox rear elevation agrees on every opening.
      It looks down on the rear, so x is good to about 1.5 mm and y, from the face's bottom edge, to about
      2.5 mm. Inlets at 30.9 and 116.3 mm, each with POWER 1 or 2 and the rating line under it; round
      openings at 72.4, 223.7, 264.4, 304.4 and 345.0 mm, 37 mm across. The inlets' wire retaining clips
      are not drawn (no registry part).
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The brochure says "a dual-redundant power supply" and "Number of AC inputs 2"; the page says "Number
      of AC inputs 2" and "Number of PSU slots 2". No held document prints a supply part number and photograph
      2116 shows two plain C14 inlets with wire clips and no module, handle or latch, so the supplies
      are part of the chassis with their inlets and no bay is drawn. The page says "Cooling type 4 fans"
      and the photograph shows five round openings: the four in the right half are the fans, and the fifth,
      between the inlets, is drawn as a vent.
  side-layout:
    confidence: estimated
    note: >-
      Photograph 2632 shows the right wall with a field of round perforations at the rear half of the
      wall; it is read as a 100 x 22 mm field starting 66 mm from the front, estimated to about 10 mm
      because the wall is foreshortened. Photograph 2629 shows the left wall plain, with screws and a
      few holes.
  ears:
    confidence: datasheet
    note: >-
      Rack ears are in the box (brochure: Rackmount bracket white; page: the same). They ship flush with
      the face and are not drawn.
  colour:
    confidence: estimated
    note: >-
      The median of photograph 2625's face is lighter than #dddddd; the face is drawn #dddddd so it reads
      on the light stage.
attrs:
  power:
    power-max-w: 72
    power-max-w-page: 83
    power-without-attachments-w: 60
    power-input: '100 - 240 V AC, two inputs (page: 47 - 63 Hz)'
    power-adapter-nominal: >-
      12 V and 10.8 A, the brochure's "Power adapter nominal voltage" and "nominal current": the adapter's
      nominal figures, not the box's input
    power-rating-label: 100-240 V ~2 A MAX, 50/60 Hz (printed under each inlet)
  thermal: {cooling: 4 fans (page)}
  environmental: {operating-temp-c: -20 to 60}
  platform: {cpu: 'AL73400, 2 GHz, 16 cores, ARM 64 bit', switch-chip: 98DX3255, ram: 16 GB DDR4, storage: 128
      MB NAND, os: 'RouterOS v7, license level 6'}
  features:
    m2: one M.2 slot (brochure), not on either face
    optics-sfp-plus: >-
      brochure: four 10G SFP+ ports; the brochure prints no list of optics, so none is claimed beyond
      the cage
