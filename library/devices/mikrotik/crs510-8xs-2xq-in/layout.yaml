format: 1
kind: device
name: crs510-8xs-2xq-in
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS510-8XS-2XQ-IN
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS510}
description: >-
  MikroTik CRS510-8XS-2XQ-IN is a fixed 1U indoor Cloud Router Switch, 320 mm wide with rack ears in the box, with eight
  25 Gigabit SFP28 cages and two 100 Gigabit QSFP28 cages, a 100 Megabit management port that also takes PoE in, an RJ45
  serial console, a DC jack and a two-pin DC terminal (both drawn as chassis art, see the gaps), and runs RouterOS v7.
  Everything is on the front: two hot-swap AC
  supply modules with their C14 inlets at the left, four stacks of two SFP28 cages, the QSFP28 stack, the console over the
  management port, RESET, the two DC inputs and three status lamps. Two fan openings and an earthing stud are on the
  rear. The brochure prints no part number for the supplies, so they are part of the chassis and there are no bays.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Dimensions drawing "510-8XS-2XQ-IN", MikroTik, printed 03.10.2023 (file
      10-8XS-2XQ-INoutlineanddimensiondrawings_250549.pdf; page image at 3308 px across, 3.94 px per mm on the front
      view): front with the ears, top plan and end view. CRS510-8XS-2XQ-IN brochure, MikroTik (file
      CRS510-8XS-2XQ-IN_230826.pdf; no date is printed, the file name carries a revision stamp): specifications, powering
      and included parts. Product page, MikroTik (https://mikrotik.com/product/crs510_8xs_2xq_in, saved 2026-10-26).
      Studio photographs 2232 (front, from slightly above), 2233 (rear, from above) and 2234 (front right,
      three-quarter, showing the right wall). The quick guide page (Quick Guide - CRS510-8XS-2XQ-IN, help.mikrotik.com)
      holds no figure and no LED table. The block diagram CRS510-8XS-2XQ-IN_230330.png. NetBox's device type as a second
      opinion only. MikroTik prints no figure numbers. The hardware manual page is not held.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: product code CRS510-8XS-2XQ-IN, QCA9531 650 MHz MIPSBE, 128 MB
      RAM, 32 MB flash, 1 x 100M Ethernet, 8 x 25G SFP28, 2 x 100G QSFP28, switch chip 98DX4310, 320 x 185 x 44 mm, RouterOS
      v7 level 5, -40 to +70 C. Powering: three DC inputs (PoE-in 43-57 V passive or 802.3bt class 6; DC jack 36-57 V;
      2-pin terminal 36-57 V), two AC inputs at 100-240 V and 47-63 Hz, 31 W without attachments and 51 W at most. Included
      parts: 2 power cords, a fastening set, rack ears. The text says "dual hot-swap power supplies" and states no
      redundancy form. Each figure is filed as the document words it.
  gate-1:
    confidence: drawing
    note: >-
      The drawing's front view body is 3780 px wide at 3 times enlargement for the printed 320 (3.9375 px per mm in the page
      image) and 513 px tall between the lip lines, which reads 43.4 mm, the printed 44. Every x and y below is taken at
      3.9375 px per mm from the body's top-left corner of the front view, to about 0.4 mm.
  chassis:
    confidence: drawing
    note: >-
      320 wide, 44 high, 185 deep, as the drawing prints them; the brochure prints 320 x 185 x 44 and agrees. The drawing
      also dimensions 9 mm beyond the front (the two-pin terminal block), 8 mm beyond the rear (the earthing stud) and 210
      mm overall to the ends of the supply handles; none of these is part of the 185. The 481 mm across the ears is the
      ears' width, and the 462 mm the pitch of their holes.
  front-layout:
    confidence: drawing
    note: >-
      From the drawing's front view. Two supply modules 52.1 x 38.5 mm at 12.6 and 72.0 mm, 2.1 mm down, each with a C14
      inlet turned a quarter turn (17.7 wide by 25.5 tall, earth pin at the left) centred 49.45 and 108.85 mm and 23.5 mm
      down, a green lamp, a six-slot vent and a latch. Four stacks of two SFP28 cages, stack centres 153.6, 171.0, 192.1 and
      209.5 mm (a 17.4 mm pitch inside a pair and 21.1 mm between pairs), the openings centred 15.7 and 30.9 mm, and a
      middle strip 23.0 mm down with four arrow lamps read at -4.6, -1.9, +1.9 and +4.7 mm from the centre (a down, up, down
      and up arrow). One QSFP28 stack centred at 233.3 mm, drawn 21.0 mm wide, with a strip carrying a down and an up
      arrow, two round lamps and a down and an up arrow again, read at -7.5, -5.1, -2.0, +1.9, +5.0 and +7.3 mm. The console and
      management jacks share a plate 17.6 x 26.6 at 248.2 mm, 10.0 mm, the console above. RESET is a ring at 270.7 mm,
      31.9 mm. The two-pin terminal block is 11.4 x 11.8 at 275.4 mm and the DC jack housing 10.3 x 11.8 at 290.1 mm, both
      24.8 mm down. Three lamps are small bars under the jacks at 267.1, 274.0 and 288.2 mm, 38.6 mm.
  vent-slots:
    confidence: estimated
    note: >-
      Each supply's vent is slots, as the drawing's front view and photograph 2232 show, not round perforations: six
      tall slots (three across, two down) under the handle and a row of four short ones along the top edge, the first of
      them left of the handle and three right of it. Read at the drawing page's 3.94 px per mm (the 320 mm body is 1261 px)
      to about 0.4 mm: a tall slot 3.8 mm wide and 7.6 mm high (7.5 for the lower row) on a 5.0 mm pitch across and a 9.2 mm
      pitch down, the first 3.7 mm in from the module's left edge and 20.0 mm and 29.2 mm down; a short slot 2.5 mm high,
      5.2 mm down, 6.1 to 6.3 mm wide, at 11.0, 27.1, 34.6 and 41.9 mm from the module's left edge. The second supply is the
      first at a 59.4 mm offset. Photograph 2232, at 8.74 px per mm, shows the same grid (slots 3.4 by 6.7 mm on a 5.0 and
      8.4 mm pitch, the photograph looking slightly down on the face) and the same four short slots. The photograph hints at a
      fourth tall column behind the handle (a sliver shows at its right edge); the drawing shows nothing there, so none is drawn.
  lamps:
    confidence: estimated
    note: >-
      The four arrow lamps of a stack: an arrow points at the cage it belongs to, so a down arrow is the lower cage and an up
      arrow the upper one. They are carried symmetric about the stack centre (at -4.65, -2.05, +2.05 and +4.65 mm for the
      SFP28, 0.1 to 0.4 mm from the reading) and the QSFP28's at -7.4, -5.1, +5.1 and +7.4 mm with its two round lamps at
      -2.1 and +2.1 mm. Which pair of a stack is the speed lamp and which the activity lamp is not stated by a document, and
      the QSFP28's two round lamps name no cage that a document states (gap `led-states`); they are drawn for the
      chassis. The three bar lamps are printed USER, FAULT and POWER (photograph 2232), and show unlit grey there (#878686,
      #858584 and #898888: medians of 225, 225 and 207 pixels, boxes 2565,1028 to 2590,1037, 2625,1028 to 2650,1037 and
      2750,1028 to 2773,1037). The render draws them in the lamp component's resting colour, a dark green: common/led-rect@1
      fills its lamp from var(--led-color, #2a6b3f), no placement can change that resting value, and a component on main is
      not edited here, so the colour is left. Their place and size agree with the drawing. The green lamp on each supply
      module is lit in the photograph (#5e6d52, median of 193 pixels within 8 px of 484,831) and drawn here in the
      resting colour of common/led-dot@1, which is a dark grey, also left as the component draws it.
  port-numbering:
    confidence: photo-measured
    note: >-
      The metal prints 2 4 6 8 over the SFP28 stacks and 1 3 5 7 under them, and 2 over and 1 under the QSFP28 stack, so the
      lower cage of a stack takes the odd number. The groups are printed 25G SFP28 and 100G QSFP28 on a purple bar at the left
      of each group.
  management-and-console:
    confidence: photo-measured
    note: >-
      Photograph 2232 prints CONSOLE over the upper jack and MGMT/PoE in under the lower. The page counts one 100M Ethernet
      port, the management port, filed at 100m; the brochure lists PoE in at 43-57 V passive or 802.3bt class 6 on it, which is
      an input and is carried in the power attributes, not as a PoE out.
  dc-inputs:
    confidence: photo-measured
    note: >-
      The DC jack is drawn at the drawn housing as chassis art and not placed (gap `dc-jack`: the barrel census wants a current no
      document states); the photograph prints "36-57 V" over both DC inputs. The two-pin pluggable terminal block beside it
      is 11.4 x 11.8 mm at 275.4 mm, 24.8 mm down, read off the drawing's front view at 3.9375 px per mm (outer extent 317 x
      330 px at 7 times enlargement, less the line weight). The drawing dimensions it 9 mm proud of the front; it is drawn flat,
      as the jack is: a cap 10.4 x 3.9 over a body 11.4 x 7.9 (the part the photograph shows from above, whose bottom
      lines up with the jack's) and two wire entries 3.6 x 5.1 mm on a 5.05 mm pitch. The photograph shows no clamp
      screws, so none are drawn. The registry's common/dc-terminal-plug-2 is a 32.1 x 17.6 mm part drawn for another maker's
      box, so it is not placed (gap `dc-terminal`). The green is #82967a, the median of photograph 2232 over box 2660,955
      to 2740,961 (480 pixels) on the terminal's front top strip; the entries #051203 (box 2672,975 to 2686,995, 280
      pixels). The legends are as the photograph prints them: one bracket over both inputs, "36-57 V" centred over it
      (the earlier drawing put it over the jack alone), a circled minus then a circled plus over the terminal, and over the
      jack a circled minus, the barrel symbol with its centre pin dot joined to the circled plus: the centre pin is the
      positive pole. The legend positions are read off photograph 2232 at 34.96 px per mm across and 30.7 px per mm down
      (the jack housing is 358 px for 11.8 mm), anchored on the jack's and the terminal's lower edge, to about 0.4 mm
      across and 0.8 mm down. The jack is a barrel socket drawn flat as four entries on photograph 2232 (the face is
      2790 px across the printed 320 mm, 8.77 px per mm, estimated): the housing 10.3 x 11.8 mm, a rim ring 6.5 mm across
      (#292929, the median of 506 pixels between 25 and 28 px from the bore's centre at 2825.5,960), the bore 5.7 mm
      across (#030303, 1954 pixels under 25 px) and the centre pin 1.1 mm across (#b0b0af, 27 pixels brighter than 120 in
      box 2815,944 to 2831,958), which the photograph shows 0.3 mm left of and 1.2 mm above the bore's centre because it
      looks down on the pin's tip. The housing's #3e3e3d is the earlier sample. The earlier 3.6 mm bore was too small.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The brochure lists two AC inputs and "dual hot-swap power supplies". The drawing and photograph 2232 show two modules
      at the front, each with a C14 inlet, a steel handle, a latch and a green lamp. No held document prints a part number for
      the supply (the brochure, the page, the quick guide page and the drawing were searched), so none is named: the supplies
      are part of the chassis with their inlets, as on juniper/ex2300-24t, and there are no bays (gap `hot-swap-supplies`). No
      document says what covers an empty slot. The photograph prints "100-240 V 50/60 Hz" up the left edge of the first
      module and PSU 1 and PSU 2 beside them. The brochure's 51 W is the box's maximum power consumption. The rear photograph
      shows two fan openings, each a ring of mesh round a plain hub about 19 mm across (read at 5.3 px per mm); the brochure
      and the page give no fan count and no fan statement.
  rear-layout:
    confidence: photo-measured
    note: >-
      From photograph 2233 (the rear, from above), x across the 320 mm at 5.3 px per mm and y estimated (the photograph looks
      down). Two fan openings 36 mm across, centred 117.0 and 158.5 mm and 23.0 mm down; an earthing stud at 12.3 mm and 33.7 mm
      with its earth mark above it. Read to about 2 mm, as seen from behind. The hexagon field is measured on 2233 at
      8.84 px per mm (the face is 2830 px across the printed 320 mm), estimated: on a fan guard (box 1125,805 to
      1465,1080; 21 whole openings) an opening is 5.32 mm across its corners and 4.07 mm across its flats, the column step
      4.71 mm and the same-column pitch 5.31 mm. It was the renderer's plain vent tile (8.86 x 5.11 mm, hexagons 5.1 mm
      across the corners on a 4.43 mm column step), which `pattern-pitch` cannot give the metal's webs, so each field is
      a `motif` tile of one regular hexagon period, 9.41 x 5.43 mm with openings 5.32 mm across the corners (the
      nearest-neighbour distance is 5.43 mm), whose lattice starts on a hexagon centred under each hub, as the
      photograph shows. The `pattern-pitch` of each is its tile.
  side-layout:
    confidence: estimated
    note: >-
      Photograph 2234 shows a field of hexagonal perforations on the right wall, behind the front. It is drawn 55 x 26 mm, 33
      mm from the front and 9 mm down, read off the photograph, which looks at the wall obliquely (about 8 mm). No held
      document shows the left wall. The drawing's end view shows the front's mounting screws and the supply handles, not a wall.
  ears:
    confidence: drawing
    note: >-
      Rack ears are in the box (the brochure and the page: Rack ears). The drawing's front view draws them 80.5 mm either
      side of the 320 mm body (481 mm over the ears, holes 462 mm apart). They are shipped flush with the face and are not
      drawn on it; no `at` is written and no kit is listed.
  colour:
    confidence: estimated
    note: >-
      Each value is the median of a plain area, away from ports, lamps, labels and text, taken with a script over the
      photograph's pixels. The face is #e7e6e9: photograph 2232, box 1500,520 to 1700,560 (8000 pixels). It is drawn
      #dddddd, the library's light-stage value for a face that sample reads lighter than, and kept with this sample beside
      it. The supply modules are #a3a5a7: 2232, box 377,1031 to 562,1042 (2035 pixels). The jack plate is #949290: 2232, box
      2558,845 to 2572,930 (1190 pixels; box 2428,830 to 2438,910, 800 pixels, gives #93918f). The DC jack housing is
      #3e3e3d: 2232, box 2790,930 to 2800,990 (600 pixels). The terminal's green is #82967a (the dc-inputs note gives its box). The unlit lamps
      read #878686, #858584 and #898888 (2232, the lamps note gives the boxes). The rear's face reads #bebcbc in 2233 (box 2180,870
      to 2910,1020, 109500 pixels).
