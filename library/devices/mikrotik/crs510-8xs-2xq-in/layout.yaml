configurations:
  base:
    kind: base
    description: >-
      CRS510-8XS-2XQ-IN - eight 25G SFP28 cages, two 100G QSFP28 cages, a 100 Megabit management port with PoE in, an RJ45
      console, a DC jack and a two-pin DC terminal, with two hot-swap AC supplies (part of the chassis in this model) and
      two fans. The box holds two power cords, rack ears and a fastening set.
    default: true
    part-numbers:
      CRS510-8XS-2XQ-IN: {}
