gaps:
- what: power-figures
  scope: [front]
  reason: sources-disagree
  note: >-
    The brochure's text says the switch chip takes "only up to 27W (without attachments)" and its table prints 31 W
    maximum power consumption without attachments. The table's 31 W and its 51 W maximum are carried.
  wanted: MikroTik's statement of the figure without attachments.
- what: hot-swap-supplies
  scope: [front]
  reason: vendor-silent
  note: >-
    The brochure calls the two power supplies hot-swap and prints no part number; no data sheet or drawing of the supply is
    held, and no document says what the box ships with or what covers an empty slot. They are drawn as part of the chassis
    with their inlets and no bay is added; the base configuration exports two AC power ports.
  wanted: The supply's part number and a statement of what a slot holds when empty.
- what: dc-jack
  scope: [front]
  reason: vendor-silent
  note: >-
    The drawing and photograph 2232 show a DC barrel jack, 10.3 x 11.8 mm, rated 36-57 V (brochure and legend). The
    library's census of common/dc-barrel@1 pins a current rating beside the voltage on every placement, and no held document
    states a current for this jack, so the jack is drawn as chassis art and not placed; the device exports no power port for
    it. Placing it later is one census line and the box's current.
  wanted: MikroTik's current rating for the DC jack.
- what: dc-terminal
  scope: [front]
  reason: needs-drawing
  note: >-
    The reason is the nearest the schema has: the part itself is what is missing, and the library has no needs-part reason.
    The drawing and photograph 2232 show a two-pin pluggable DC terminal block, 11.4 x 11.8 mm, beside the DC jack. It is
    drawn as chassis art at its measured place, with its legends, the bracket and the polarity marks; no part is placed,
    and no power port is exported, because no held document names the part. The registry's only two-pole parts belong to
    other makers' boxes (common/dc-terminal-plug-2@1 is 32.1 x 17.6 mm). The brochure lists it as a DC input (36-57 V).
  wanted: The terminal block's part number and its current rating.
- what: led-states
  scope: [front]
  reason: vendor-silent
  note: >-
    Searched the brochure, the page and the quick guide page for an LED table: none. The arrow lamps, the QSFP28's two
    round lamps, the USER, FAULT and POWER lamps and the green lamp on each supply carry the component's own vocabulary and
    no meaning is stated.
  wanted: MikroTik's LED description for the CRS510-8XS-2XQ-IN.
- what: left-wall
  scope: [left]
  reason: needs-drawing
  note: >-
    No held document shows the left wall: the drawing has no wall view and the photographs show the right wall, the front and
    the rear. It is left empty and is not drawn from the right.
  wanted: A left side view.
- what: top-and-bottom
  scope: [top, bottom]
  reason: needs-drawing
  note: >-
    The top plan shows four shallow slots in the lid and the CLOUD SWITCH lettering, which photograph 2232 shows as embossed
    grooves and not as openings; no document shows the underside.
  wanted: A bottom view.
- what: fan-count
  scope: [rear]
  reason: vendor-silent
  note: >-
    The brochure and the page give no fan count and no fan statement; the rear photograph shows two openings, which are
    drawn. No fan redundancy is written.
  wanted: MikroTik's fan count and redundancy statement.
- what: weight
  scope: [front]
  reason: vendor-silent
  note: Neither the brochure nor the page gives a weight.
  wanted: MikroTik's weight.
- what: eol
  scope: [front]
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so no lifecycle is
    written.
  wanted: none
