format: 1
kind: device
name: crs326-4c-plus-20g-plus-2q-plus-rm
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS326-4C+20G+2Q+RM
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS326}
description: >-
  MikroTik CRS326-4C+20G+2Q+RM is a fixed 1U Cloud Router Switch. It has 20 2.5G RJ45 ports and four combo
  ports. Each combo port is a 2.5G RJ45 jack (1T to 4T) and a 10G SFP+ cage (1F to 4F), one in use at
  a time. It also has two 40G QSFP+ cages, a 10/100 management jack (MGMT/BOOT) and an RJ45 serial console,
  and runs RouterOS. The front carries the 24 RJ45 jacks in three blocks of four columns by two rows.
  They are numbered 1 to 20 and then 1T to 4T as printed, with the odd number on the lower jack. The 2
  by 2 SFP+ block and the stacked QSFP+ pair follow. Then come the CONSOLE and MGMT/BOOT jacks, the RESET
  button and the USER, FAULT, POWER 2 and POWER 1 lamps. The rear carries two AC inlets (POWER 1 and POWER
  2, 100-240 V) and a vent field. The left wall carries a fan opening and a vent field. The two supplies
  are built into the chassis, so there are no bays.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Dimensions drawing "CRS326-4C+20XG-2Q+", MikroTik, printed 19.10.2021 (file Dimensions_CRS326-4C-20XG-2Q_250502.pdf,
      rendered at 200 dpi; the title block reads CRS326-4C+20XG-2Q+, the product page links this file
      for the CRS326-4C+20G+2Q+RM, and its front view shows this model's port layout): front, side, top
      plan and isometric. CRS326-4C+20G+2Q+RM brochure, MikroTik (file CRS326-4C20G2QRM_240321.pdf; no
      date is printed, the file name carries a revision stamp): specification table, powering, included
      parts. CRS326-4C+20G+2Q+RM product page, MikroTik (https://mikrotik.com/product/crs326_4c_20g_2q_rm,
      saved 2026-10-26): AC inputs, PSU slots, cooling, serial console port. Safety and regulatory information
      - CRS326-4C+20G+2Q+RM, help.mikrotik.com, last updated Jun 26, 2025 (https://help.mikrotik.com/docs/x/VgDmCg;
      document #71421): power input options, temperature. Studio photographs 2321 (front, from slightly
      above), 2322 (rear, from above) and 2323 (front left, three-quarter): legends, colours, counts and
      the rear. The block diagram CRS326-4C20G2Q_240228.png. NetBox read as a second opinion only. MikroTik
      prints no figure numbers. The device name spells MikroTik's + as -plus because a directory name
      cannot carry +; model: keeps the + as printed. The drawing's title block spells the model 20XG;
      the brochure, the page and the photograph print 20G.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: product code CRS326-4C+20G+2Q+RM, QCA9531 CPU
      at 650 MHz, 128 MB RAM, 32 MB NAND, one 100M port, 20 2.5G ports, two 40G QSFP+ ports, four combo
      2.5G Ethernet / SFP+ ports, RouterOS v7 licence level 6, switch chip 98DX8332, 443 x 258 x 44 mm,
      -20 to +60 C, two AC inputs, 100-240 V, nominal 12 V and 10.8 A, 70 W maximum and 51 W without attachments,
      "Dual-redundant power supplies". The product page adds two PSU slots, two fans and the RJ45 serial
      console port.
  gate-1:
    confidence: drawing
    note: >-
      The drawing's front view body measures 1162 px across at 200 dpi for the printed 443 (2.624 px per
      mm) and 43.9 mm down by the same scale against the printed 44, so every x and y below is taken at
      2.624 px per mm from the body's top-left corner. The two-row jack pitch of the first block reads
      16.26 mm, uniform to 0.1 mm.
  chassis:
    confidence: drawing
    note: >-
      443 wide, 44 high, 230 deep. The drawing and the brochure both print 258 for the depth. The side
      view shows that 258 runs from the tips of the two wire power-cord loops to the front face: the body
      measures 965 px at 4.198 px per mm, 229.9 mm, and the loops (and the rear comb the top plan shows)
      stand 27 mm off it. The body's 230 is carried and 258 is declared in a gap. 443 is the body between
      the ear folds.
  front-layout:
    confidence: drawing
    note: >-
      From the drawing's front view. Three jack plates 67.1 mm wide, 27.9 mm tall, top at 9.0 mm, at 8.7,
      78.6 and 148.4 mm (69.85 mm step). Each plate holds four columns of two jacks on a 16.26 mm pitch,
      the first jack 1.4 mm inside its plate; the third plate holds jacks 17 to 20 and the four combo
      jacks. The SFP+ plate is 29.9 mm wide at 219.4 mm, top 10.7 mm, with two cages by two on a 15.0
      mm column pitch; the QSFP+ plate is 20.4 mm wide at 253.2 mm; the console plate holds two jacks,
      17.5 mm wide at 276.9 mm. RESET is centred at 299.2, 32.4 mm and the four lamps at 306.5 mm, 17.6,
      22.9, 28.0 and 33.0 mm. The cage and jack rows inside the plates are the registry parts' sizes placed
      against the plate edges (row pitch 13.4 mm), which the drawing's outlines agree with to about 0.5
      mm. The zigzag vent band over the plates is the drawing's, 3.4 to 312.6 mm, 2.5 to 7.3 mm.
  legends-and-colours:
    confidence: photo-measured
    note: >-
      Photograph 2321 prints, under the jacks, a down arrow and the number of the lower jack and an up
      arrow and the number of the upper jack of each column (1 and 2, 3 and 4, and so on to 19 and 20,
      then 1T 2T and 3T 4T) and 1F 2F and 3F 4F under the cages, 1 and 2 under the QSFP+ cages, with 2.5G
      ETHERNET, COMBO, SFP+ and 40G QSFP+ beside them, CONSOLE over the console jack, MGMT/BOOT under
      the management jack and RESET under the button. The arrows and the thin bracket lines under the
      legends are not drawn; the numbers are. The legends' positions are taken from the photograph's proportions
      and are estimated, good to about 1 mm. The face reads #d9d7db in the photograph's median and the
      plates #bcbdbd.
  port-numbering:
    confidence: photo-measured
    note: >-
      The numbers printed in photograph 2321 give the odd number to the lower jack of a column (the down
      arrow points at it) and the even number to the upper; the same holds for 1F to 4F and the two QSFP+
      cages. The brochure's one 100M port is the MGMT/BOOT jack and its serial console is the CONSOLE
      jack (product page: serial console port RJ45). The copper jacks are named copper-1 to copper-4 and
      the cages cage-1 to cage-4, with the same numbers: the groups say they are one port at a time. The
      2.5G jacks are port-1 to port-20.
  lamps:
    confidence: photo-measured
    note: >-
      The jacks carry their own two lamps. The SFP+ and QSFP+ strips carry arrow lamps at the drawing's
      positions: eight in the SFP+ strip (two per cage) and one at each end of the QSFP+ strip with four
      slots between them (decor). The USER, FAULT, POWER 2 and POWER 1 lamps are given the lit colours
      photograph 2321 shows (green, red, blue, blue). The brochure and the help page hold no LED table,
      so what a lamp shows is a gap.
  reset:
    confidence: drawing
    note: 'RESET is a round button (drawing: 4.2 mm across); its legend is printed under it.'
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The brochure and the page list two AC inputs, "Number of PSU slots: 2" and "Dual-redundant power
      supplies"; the page counts two fans. The rear photograph shows a plain panel with two inlets on
      it and no removable module, and no held document prints a supply module part number, so the supplies
      are part of the chassis and there are no bays, as on juniper/ex2300-24t. The drawing and photograph
      2323 show one fan opening and a vent field in the left wall. The second fan is not shown by any
      held document.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - no rear elevation is held; the positions are read off studio photograph 2322, which
      looks down on the rear. x is taken at 5.33 px per mm across the 443 mm body (as seen from the rear,
      so the left of the face is the device's right) and y is estimated from the inlet housings' proportions,
      good to about 2 mm in x and 3 mm in y. Two C14 inlets stand on end (pins vertical), centred at 15.5
      and 47.8 mm; POWER 1 and POWER 2 are printed on their right in rotated type, with "100-240 V ~3.3
      A MAX, 50/60 Hz" under a hex vent field at 66 to 119 mm. The rest of the rear is covered in the
      photograph by a comb of 14 fingers that the top plan shows standing 27 mm off the body; it is an
      accessory standing off the face and is not drawn, so the panel behind it is not known. The wire
      loops on the inlets are accessories and are not drawn.
  ac-input-rating:
    confidence: photo-measured
    note: >-
      The rear prints "100-240 V ~3.3 A MAX, 50/60 Hz" (photograph 2322); the brochure's range is 100-240
      V and the help page says 2 AC ports (100 - 240 V).
  side-walls:
    confidence: drawing
    note: >-
      The drawing's side view has the rear at its left, so it is the left wall seen from the left. It
      shows a round fan opening 38.1 mm across at 5.2 mm from the rear and 3.6 mm down, and a vent field
      59.1 x 29.5 mm at 51.2 mm from the rear, 11.9 mm down (the view at 4.198 px per mm, x from the body's
      rear edge). Photograph 2323 shows the same wall. No held document shows the right wall.
  ears:
    confidence: drawing
    note: >-
      Rack ears are in the box (brochure, Included parts: Rackmount ears, Fastening set). The drawing's
      side view shows the ear plate at the front end of the body, on the face, and the top plan shows
      no ears (443 is the body), so the shipped position is flush. The ears are not drawn.
  colour:
    confidence: photo-measured
    note: 'median of photograph 2321''s face (#d9d7db); the jack plates are #bcbdbd.'
