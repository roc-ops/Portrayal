gaps:
- what: depth-figure
  scope:
  - top
  - left
  - right
  reason: sources-disagree
  note: >-
    The brochure and the drawing print 258 mm. The drawing's side view puts that figure across the power-cord
    loops and the body together; the body alone measures 230 mm. 230 is carried.
  wanted: MikroTik's statement of whether 258 includes the loops.
- what: rear-elevation
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The dimensions drawing has no rear view; the rear is read off a studio photograph that looks down
    on it, so the y positions are estimated, and a comb of 14 fingers hides the right of the rear in that
    photograph.
  wanted: A dimensioned rear view without the comb.
- what: right-side-wall
  scope:
  - right
  reason: needs-drawing
  note: >-
    The drawing's one side view is the left wall and no held photograph shows the right wall, so it is
    left empty.
  wanted: A view of the right wall.
- what: second-fan
  scope:
  - left
  - right
  reason: needs-drawing
  note: >-
    The product page counts two fans; the one opening held documents show is in the left wall. Where the
    second fan is, is not shown.
  wanted: A view of the right wall.
- what: temperature-range
  scope:
  - front
  reason: sources-disagree
  note: >-
    The brochure gives -20 to +60 C; the help page's specification table gives 0 to +60 C. The brochure's
    is carried.
  wanted: MikroTik's statement of the operating range.
- what: led-states
  scope:
  - front
  reason: vendor-silent
  note: >-
    Searched the brochure, the product page and the help page for an LED table: none. The lamps carry
    the components' own vocabulary and no meaning is stated for the jack lamps, the arrow lamps or USER,
    FAULT, POWER 2 and POWER 1.
  wanted: MikroTik's LED description for the CRS326-4C+20G+2Q+RM.
- {what: weight, scope: [front], reason: vendor-silent, note: Neither the brochure nor the product page
    gives a weight., wanted: MikroTik's weight.}
- what: eol
  scope:
  - front
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so
    no lifecycle is written.
  wanted: none
