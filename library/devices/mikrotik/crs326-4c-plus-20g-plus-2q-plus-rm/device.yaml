configurations:
  base:
    kind: base
    description: >-
      CRS326-4C+20G+2Q+RM - 20 2.5G RJ45 ports, four combo 2.5G RJ45 / SFP+ ports, two 40G QSFP+ cages,
      the management jack and the RJ45 console. It has two built-in AC supplies. The box holds two power
      cords, rack ears and a fastening set.
    default: true
    part-numbers:
      CRS326-4C+20G+2Q+RM: {}
