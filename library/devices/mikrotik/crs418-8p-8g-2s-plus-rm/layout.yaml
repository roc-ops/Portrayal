gaps:
- what: usb-generation
  scope: [front]
  reason: sources-disagree
  note: >-
    The brochure and the product page say USB 3.0 type A. Photograph 2478 shows a white tongue with four contacts, which
    is the colour and contact count of USB 2.0. The photograph is drawn, with the registry's white-tongue skin.
  wanted: A close-up or MikroTik's statement of the port.
- what: poe-lamps
  scope: [front]
  reason: vendor-silent
  note: >-
    The two grey bars over the second jack block hold arrow windows in the drawing; no photograph shows one lit and no
    document says they are lamps, so they are drawn as printed bars. The two lit lamps beside them are placed as lamps.
  wanted: MikroTik's description of the bars.
- what: led-states
  scope: [front]
  reason: vendor-silent
  note: >-
    Searched the brochure, the product page and the safety book's one kept figure for an LED table: none. The red and
    green lamps left of the second block, the four status lamps and the ACT and 10G lamps carry the component's own
    vocabulary and no meaning is stated; the red and green lit colours are the photograph's.
  wanted: MikroTik's LED description for the CRS418-8P-8G-2S+RM.
- what: left-wall
  scope: [left]
  reason: needs-drawing
  note: >-
    The drawing has no side view and the photographs show the right wall only. The left wall is left empty and is not
    drawn from the right.
  wanted: A left side view.
- what: fan-redundancy
  scope: [rear]
  reason: vendor-silent
  note: >-
    The page counts 4 fans and the rear shows four openings. No held document says whether the fans are redundant, so no
    redundancy is written. The brochure's "redundant power inputs" describes the two AC inputs, not the fans.
  wanted: MikroTik's statement on fan redundancy.
- what: weight
  scope: [front]
  reason: vendor-silent
  note: >-
    Neither the brochure nor the product page gives a weight.
  wanted: MikroTik's weight.
- what: eol
  scope: [front]
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so no lifecycle is
    written.
  wanted: none
