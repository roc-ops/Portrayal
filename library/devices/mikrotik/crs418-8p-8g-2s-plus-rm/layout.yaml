format: 1
kind: device
name: crs418-8p-8g-2s-plus-rm
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS418-8P-8G-2S+RM
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS418}
description: >-
  MikroTik CRS418-8P-8G-2S+RM is a fixed 1U Cloud Router Switch with PoE out and a quad-core ARM CPU. It has 16 Gigabit
  Ethernet ports in two blocks of eight, of which the second block (Ether9-16) supplies PoE out (802.3af/at, or 24 V
  passive), a Gigabit management port printed MGMT/BOOT, an RJ45 serial console, two SFP+ cages and a USB type A port,
  and runs RouterOS v7. The front carries the two jack blocks, the two cages each with an ACT and a 10G lamp, the USB
  port, the console over the management port, the RESET and MODE buttons, four status lamps and a slanted vent. Two
  AC inlets, each with its own supply built in, and four fan openings are on the rear. The supplies are part of the
  chassis, so there are no bays.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Dimensions drawing "CRS418-8P-8G-2S+RM", MikroTik, printed 07.07.2025 (file
      18-8P-8G-2SRMdimensiondrawing_260907.pdf; MikroTik's file name drops the CRS4; rendered at 400 dpi): front, top
      plan and isometric. CRS418-8P-8G-2S+RM brochure, MikroTik (file CRS418-8P-8G-2SRM_250823.pdf; no date is printed,
      the file name carries a revision stamp): specifications, powering and included parts. CRS418-8P-8G-2S+RM product
      page, MikroTik (https://mikrotik.com/product/crs418_8p_8g_2s_rm, saved 2026-10-26): AC inputs, PSU slots,
      cooling, PoE, USB, included parts. Studio photographs 2478 (front, from slightly above), 2479 (rear, from above)
      and 2477 (front left, three-quarter, showing the right wall). The block diagram CRS418-8P-8G-2S_250837.png. The
      safety and regulatory book QG_CRS418-8P-8G-2SRM1_250823.pdf (27 pages, one figure kept) is not a quick guide with
      figures. NetBox's device type and its two elevation images as a second opinion only. MikroTik prints no figure
      numbers. The device name spells MikroTik's + as -plus because a directory name cannot carry +; model: keeps the +
      as printed.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: product code CRS418-8P-8G-2S+RM, quad-core IPQ-8072 2208 MHz
      ARM 64 bit, 1 GB DDR3L, 128 MB NAND, 17 Gigabit Ethernet ports, two SFP+ ports, one USB 3.0 type A, 98DX226S,
      RouterOS v7 level 5, 443 x 230 x 44 (no unit printed), -20 to +70 C, two AC inputs, 100-240 V, PoE out 802.3af/at on
      Ether9-Ether16 (the heading adds 24 V passive), 1.1 A per port at input below 30 V and 0.56 A above, 5.4 A and
      150 W total out, 28 W without attachments and 215 W maximum. The product page lists the same, two PSU slots and
      4 fans. The brochure calls the case one "with redundant power inputs" and "dual AC inputs"; it states no
      redundancy form. Each figure is filed as the document words it.
  gate-1:
    confidence: drawing
    note: >-
      The drawing's front view body is 1744 px wide in a 400 dpi render for the printed 443 (3.937 px per mm) and 173 px
      tall between the lip lines, which reads 43.9 mm, the printed 44. Every x and y below is taken at 3.937 px per mm
      from the body's top-left corner of the front view.
  chassis:
    confidence: drawing
    note: >-
      443 wide, 44 high, 230 deep, as the drawing prints them; the brochure prints 443 x 230 x 44 and agrees. The
      drawing dimensions 7 mm beyond the body at one end of its top plan, which is the pair of retaining clips of the
      two AC inlets (photograph 2478 shows them above the far edge of the lid, and photograph 2479 shows them on the
      rear), and 5.3 mm at the other end, where the SFP+ cages stand proud of the face; neither is part of the 230.
  front-layout:
    confidence: drawing
    note: >-
      From the drawing's front view. Two jack plates 60.5 x 26.7 at 19.6 and 90.1 mm (70.5 mm step), top at 10.4 mm; four
      columns of two ganged jacks on the 13.97 mm registry pitch, the first jack at 22.55 mm (plate left + 2.95), and
      a 14.62 mm gutter between the blocks. The rows are read from the drawn jack outlines at centres 17.15 and 30.2 mm,
      a 13.05 mm pitch. The two SFP+ cages are centred at 168.6 and 186.2 mm (a 17.6 mm pitch: they do not abut), 31.6
      mm down, with their 14.5 x 10.0 registry openings; the drawn bezels around them are 17.2 x 12.2. The ACT and 10G
      lamps are the four ringed circles beside the cages, at 156.3 and 198.4 mm, 28.6 and 34.0 mm. The USB bezel is 8.7 x
      16.1 at 210.9 mm, 21.0 mm, standing upright. The console and management jacks share a plate 17.9 x 26.9 at 254.9
      mm, 10.2 mm, centred at 263.8 mm and 13.7 mm apart. The RESET and MODE buttons are the two round marks at 277.2
      and 286.5 mm, 32.4 mm. The four lamps are a column of rings at 293.8 mm, 17.6, 22.7, 27.8 and 32.8 mm. The slanted
      vent is 120.2 x 19.5 mm at 313.2 mm, 15.5 mm. The face colour #d6d3d3 is the photograph's.
  poe-markings:
    confidence: photo-measured
    note: >-
      Photograph 2478 shows two lit round lamps left of the second block, a red one and under it a green one beside the
      legend 28 V, with the legend PoE out and an arrow under them. These are lamps with lit colours, as on the
      CRS328-24P, and are placed as lamps with the photograph's lit colours (#ef4444 and #22c55e). Over the second block
      it also shows two plain grey bars, each over a pair of columns, with the numbers 10 12 and 14 16 under them. The
      drawing shows arrow marks inside each bar (a down and an up arrow for each column), so they are windows, but
      no photograph shows one lit and no document says what they show, so they are drawn as printed bars, as the
      CRS354-48P draws what its photograph shows, and not as lamps (gap `poe-lamps`). Positions: the lamps and the
      legends are read off photograph 2478 at 5.46 px per mm across the face, which looks down on it (x about 1 mm, y about
      1.5 mm); the bars are the drawing's, 24.2 x 3.3 mm at 94.3 and 122.2 mm, 4.1 mm. Only the second block, Ether9
      to Ether16, supplies PoE out.
  lamps:
    confidence: estimated
    note: >-
      The four rings in a column are the status lamps; photograph 2478 prints USER, FAULT, PWR 2 and PWR 1 beside them,
      top to bottom, and shows them as small dark lenses with a green rim, unlit. The ACT and 10G lamps beside each
      cage are two rings, ACT above and 10G below, as printed. Which cage a lamp pair belongs to is read from its place
      (the left pair beside SFP+ 1, the right pair beside SFP+ 2). No document says what a lamp shows.
  port-numbering:
    confidence: photo-measured
    note: >-
      The metal prints the even numbers over the upper jacks (2 4 6 8 and 10 12 14 16) and the odd numbers under the
      lower ones (1 3 5 7 and 9 11 13 15), so the lower jack of a column takes the odd number, centred on its column.
      The cages are printed SFP+ 1 and SFP+ 2. Ether1 to Ether8 are the first block and Ether9 to Ether16 the second
      (the brochure's PoE-out ports are Ether9 - Ether16).
  management-and-console:
    confidence: photo-measured
    note: >-
      Photograph 2478 prints CONSOLE over the upper jack of the shared plate and MGMT/BOOT under the lower. The brochure
      counts "17 Gigabit Ethernet ports" and describes "a Gigabit management port with a direct CPU line", the 17th;
      the page lists a serial console port, RJ45. The management jack is filed at 1g.
  usb:
    confidence: photo-measured
    note: >-
      One USB type A port standing upright (page: USB 3.0 type A, 1 A maximum, USB power reset). Photograph 2478 shows
      a white tongue with four contacts, the colour of a USB 2.0 port, so it is drawn with the registry's white-tongue skin; the
      brochure and the page say 3.0 (gap `usb-generation`). It is the registry's std/usb-a, turned a quarter turn, in a
      dark bezel the drawing shows 8.7 x 16.1 mm.
  buttons:
    confidence: photo-measured
    note: >-
      Two round buttons printed RESET and MODE on the metal (the page lists "Mode button: Yes"), drawn with the library's
      recessed reset-button part; the MODE one carries function mode.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The brochure and the page list two AC inputs and two PSU slots. The page counts 4 fans. The rear photograph (2479)
      shows two C14 inlets, each with a steel retaining clip, and no removable supply, no handle and no part number, so
      the supplies are part of the chassis and there are no bays, as on juniper/ex2300-24t. Each inlet is the registry's
      C14 with the rating printed under it, 100-240 V ~1 A MAX 50/60 Hz, carried as printed; the brochure's 215 W is
      the box's own maximum, the 1 A a per-inlet label. The four round openings are the four fans.
  rear-layout:
    confidence: photo-measured
    note: >-
      From photograph 2479 (the rear, from above), x across the 443 mm at 5.43 px per mm and y estimated (the photo looks
      down; the face is 0.82 of its true height). Four fan openings 33 mm across, centred 41.6, 93.1, 287.1 and 351.4 mm
      and 25.0 mm down. Two inlets, centred 156.0 and 206.6 mm and 19.0 mm down. The photograph reads the two left
      fans 51.5 mm apart and the right two 64.3 mm apart; this is carried as seen. The retaining clips, the screws at
      the fans and the legends POWER 1 and POWER 2 partly hidden by the inlets are read to about 2 mm. Seen from behind the
      first inlet is at the left, as in the photograph.
  side-layout:
    confidence: estimated
    note: >-
      estimated - the drawing has no side view. The isometric and photograph 2477 show a small hex vent on the right wall,
      about a quarter of the way back. It is drawn 24 x 24 mm, 56 mm from the front and 10 mm down, read off the
      photograph, which looks at the wall obliquely (about 6 mm). The left wall is not shown by any held document.
  ears:
    confidence: drawing
    note: >-
      Rack ears are in the box (product page: Rack ears; the brochure says "Rackmount bracket"; also 2 power cords and a K-54
      kit, a screw set per the intake notes). The drawing's front view and top plan show the body and the two 7 mm inlet
      clips, with no ear plate, so the ears are shipped flush with the face and drawn at the face plane; they are not drawn.
  colour:
    confidence: photo-measured
    note: >-
      median of photograph 2478: face #d6d3d3. The chassis colour is the face's.
