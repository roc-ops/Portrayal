format: 1
kind: device
name: crs317-1g-16s-plus-rm
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS317-1G-16S+RM
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS317}
description: >-
  MikroTik CRS317-1G-16S+RM is a fixed 1U Cloud Router Switch with 16 SFP+ cages, one 10/100/1000 management
  port and an RJ45 serial console. It runs SwOS or RouterOS (dual boot). The front carries the 16 cages
  in four blocks of four. Each has an ACT lamp, a 10G lamp and its printed name, SFP+ 1 to SFP+ 16. Beside
  them sit the CONSOLE jack, the ETH/BOOT jack, the RESET button and the USR, FAULT, PWR 2 and PWR 1 lamps.
  The rear carries two IEC C14 inlets (POWER 1 and POWER 2), two fans and a finned heatsink. Two supplies
  are built into the chassis, one active at a time, so there are no bays. The left and right walls are
  not drawn.
profile: networking
provenance:
  sources:
    confidence: estimated
    note: >-
      estimated - no dimensions drawing is held for this model. CRS317-1G-16S+RM brochure, MikroTik (file
      CRS317-1G-16Splus_211004.pdf; no date is printed, the file name carries a revision stamp): specification
      table, features, included parts. CRS317-1G-16S+RM product page, MikroTik (https://mikrotik.com/product/crs317_1g_16s_rm,
      saved 2026-10-26): dimensions, AC inputs, PSU slots, cooling, included parts. Quick Guide CRS317-1G-16S+RM
      (file CRS317-1G-16S-qg_200107.pdf, revision stamp 200107): powering, cooling, ports, accessories.
      The studio photographs 1324 (front, from slightly above) and 2055 (rear, from above): every position
      and legend. The block diagram CRS317-1G-16S_220904.png (ports SFP+ 1 to 16 and Ether 1). The saved
      help page Quick Guide G1-b lists the model and holds no figures. NetBox read as a second opinion
      only (its part_number CRS317-1G-16S+ is not MikroTik's product code). MikroTik prints no figure
      numbers. The device name spells MikroTik's + as -plus because a directory name cannot carry +; model:
      keeps the + as printed.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: product code CRS317-1G-16S+RM, CPU 98DX8216B0
      800 MHz, two cores, 1 GB RAM, 16 MB flash, 16 SFP+ cages (1.25 Gb SFP and 10 Gb SFP+, none included),
      443 x 224 x 44 mm, two AC inputs of 100 - 240 V, redundant supply, 44 W maximum power consumption,
      -20 to 60 C tested, 38 LEDs, serial RJ45. The 44 W is unqualified in the brochure and the product
      page, and the quick guide words it as the consumption under maximum load, so it is filed as the
      maximum. The quick guide says the device was tested from -40 to +70 C; the brochure and the product
      page say -20 to 60 C, which is carried (the quick guide's range is a conflict declared here). The
      product page's suggested price is not carried.
  gate-1:
    confidence: estimated
    note: >-
      estimated - the face of photograph 1324 is 3130 px wide between the ear folds for the printed 443
      mm (7.065 px per mm) and 285 px tall for the printed 44 mm (6.48 px per mm), 0.92 of the horizontal
      scale, so the camera looks down and the photograph is not orthographic. Every x on the front is
      taken at 7.065 px per mm from the body's left edge; every y is taken at 6.48 px per mm from the
      face's top edge and is estimated, good to about 1 mm. The 4 x 14.25 mm SFP+ cages abut inside a
      block and read 100.7 px, 14.25 mm, on a quantity the scale never saw.
  chassis:
    confidence: datasheet
    note: >-
      443 x 44 x 224 from the brochure and the product page, which agree; no drawing is held to dimension
      them further. 443 is the body between the ear folds. The rear heatsink is part of the depth the
      sources print.
  front-layout:
    confidence: estimated
    note: >-
      estimated - read off photograph 1324 as described under gate-1. Four blocks of four SFP+ cages,
      the first cage at 13.2 mm, 14.25 mm apart inside a block and 63.5 mm block to block, top at 25.8
      mm. Each cage has its ACT lamp 2.55 mm and its 10G lamp 12.2 mm from its left edge, 22.4 mm down,
      with the legends ACT and 10G above them, and the printed SFP+ n under the cage. The CONSOLE jack
      (top) and the ETH/BOOT jack (below it) share one housing 17.7 mm wide at 266.0 mm; the RESET button
      is at 287.6 mm. The USR, FAULT, PWR 2 and PWR 1 lamps sit in a rounded bracket at 295.3 mm on a
      5.1 mm pitch. The slotted vent windows over the cages and the model text are drawn as the photograph
      shows them.
  lamps:
    confidence: estimated
    note: >-
      estimated - the brochure counts 38 LEDs: 16 cages x 2 lamps, the four status lamps and the two lamps
      of the ETH/BOOT jack. The status lamps are given the lit colours the photograph shows (USR yellow,
      FAULT red, PWR 2 and PWR 1 blue). Photograph 1324 shows the ACT and 10G lamps unlit. No held document
      says what a lamp shows; the quick guide has no LED table, so that is a gap.
  port-numbering:
    confidence: datasheet
    note: >-
      The metal prints SFP+ 1 to SFP+ 16 left to right under the cages (photograph 1324), ETH/BOOT under
      the management jack and CONSOLE over the serial jack. The block diagram names the cages SFP+ 1 to
      16 and the management port Ether 1.
  console:
    confidence: estimated
    note: >-
      The RJ45 serial port (brochure: Serial port RJ45; quick guide: RJ45 serial port, 115200 bit/s) is
      the upper jack of the housing, under the printed CONSOLE. The lower jack is the ETH/BOOT management
      Ethernet port (quick guide: Ethernet port (ETH/BOOT), can be used for network booting).
  buttons:
    confidence: estimated
    note: 'One round button printed RESET (quick guide: the RouterBOOT reset button).'
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The product page lists two AC inputs, two PSU slots and two fans; the brochure says dual redundant
      power supplies; the quick guide says the device takes power through two IEC C14 connectors and only
      one supply is active at a time, the second being for redundancy. No document held shows a removable
      supply module or gives a supply part number, and the rear photograph shows two bare inlets and no
      module handle, so the supplies are built into the chassis and there are no bays, as on juniper/ex2300-24t.
      The two fans are the two hexagon-grille openings of the rear photograph. The quick guide says the
      passive heatsinks cool the unit and the two redundant fans switch on when the ambient is above normal.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - read off photograph 2055, which looks down on the rear, so x is taken at 14.24 px per
      mm across the 443 mm width and y is estimated from a vertical scale of 12 px per mm, good to about
      3 mm. The two C14 inlets are centred at 37.2 and 102.7 mm and carry POWER 1 and POWER 2 with 100-240V~2A
      MAX 50/60Hz printed under each. The two fan grilles are 36.5 mm across, centred at 160.8 and 200.1
      mm. The heatsink fin ends fill 220 to 385.5 mm (22 fins drawn on a 7.1 mm pitch; the photograph
      shows about 23). Two of the rear's crosshead screws are drawn where the photograph shows them; the
      screws on the fan plates are not.
  ears:
    confidence: estimated
    note: >-
      Rack ears are in the box (product page, Included parts: Rack ears; the quick guide: 1U rackmount
      bracket, and the mounting section describes fitting them to both sides with four screws). Photograph
      1324 shows them flush with the face. No drawing is held, so no distance behind the face is given.
      The product page also lists a K10 screw kit, which is a fastening set and not a rack kit, so no
      kit is listed. The ears are not drawn.
  colour: {confidence: photo-measured, note: median of photograph 1324's face (#dbdbdb).}
