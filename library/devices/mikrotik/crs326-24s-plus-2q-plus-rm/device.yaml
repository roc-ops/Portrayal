format: 1
kind: device
name: crs326-24s-plus-2q-plus-rm
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS326-24S+2Q+RM
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS326}
description: >-
  MikroTik CRS326-24S+2Q+RM is a fixed 1U Cloud Router Switch. It has 24 SFP+ cages and two 40G QSFP+
  cages. It also has a 10/100 management and boot port, an RJ45 serial console and a USB type A port.
  It runs RouterOS or SwOS. The front carries the 24 SFP+ cages in three blocks of four columns by two
  rows. They are numbered 1 to 24 as printed, with the odd number on the lower cage of a column. The two
  QSFP+ cages are 1 and 2, stacked with the odd number below. Right of them are the CONSOLE and MGMT/BOOT
  jacks, the RESET button, the USB port and the USER, FAULT, PWR 2 and PWR 1 lamps. The rear carries two
  AC inlets (POWER 1 and POWER 2, 100-240 V) and three fans. The power supplies and the fans are built
  into the chassis, so there are no bays.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      CRS326-24S+2Q+RM brochure, MikroTik (file CRS326-24Splus2QplusRM_250749.pdf; no date is printed,
      the file name carries a revision stamp): specification table and included parts. CRS326-24S+2Q+RM
      product page, MikroTik (saved 2026-10-26): dimensions, switch chip, AC inputs and PSU slots, cooling
      type, power, USB. CRS326-24S+2Q+RM quick guide, MikroTik (file CRS326-24Splus2QplusRM-qg_190808.pdf;
      no date is printed, the file name carries a revision stamp): extension slots and ports, powering,
      reset. The product-page studio photographs 1831 (front) and 1832 (rear). No dimensions drawing is
      held for this model: the one held for the CRS326-24G-2S+ is a different chassis. The NetBox community
      device type was read as a second opinion only. No figure numbers: MikroTik prints none. The device
      name spells MikroTik's + as -plus because a directory name cannot carry +; model: keeps the + as
      printed.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: QCA9531 CPU at 650 MHz, 128 MB RAM, 32 MB flash,
      one 10/100 port, 24 SFP+ and two QSFP+ cages, RouterOS or SwitchOS (licence level 5), AC supply
      100 - 240 V, "Redundant supply: Yes", USB type A, serial RJ45, 443 x 200 x 44 mm, -20 to +60 C,
      "Max power consumption" 69 W. The page adds the switch chip 98DX8332, two AC inputs, two PSU slots,
      three fans, 42 W without attachments and a 1 A USB limit. The 69 W is unqualified and filed as the
      maximum; the quick guide says "up to 42 W. With attachments up to 69 W", which agrees.
  gate-1:
    confidence: estimated
    note: >-
      estimated - the front photograph 1831 (3000 x 1200 px) shows the face between the ear folds 1685
      px across in the 2000 px view for the printed 443 (3.805 px per mm) and 164 px between the ears'
      top and bottom edges for 44.45 (3.69 px per mm): 3 percent apart, so the picture is not orthographic
      enough to call photo-measured. x is taken at 3.805 px per mm from the body's left edge and y at
      3.66 px per mm from the face's top edge. The cage pitch then reads 14.37 mm against the registry's
      14.25 for a ganged SFP cage, 0.8 percent apart. Every position is good to about 1 mm in x and 1.5
      mm in y.
  chassis:
    confidence: datasheet
    note: >-
      443 wide, 44.45 high (the brochure's "44" is the 1U pitch, 44.45), 200 deep: the brochure's and
      the product page's one source for the depth, both "443 x 200 x 44 mm". No drawing is held, so no
      figure is checked against one. 443 is the body between the ear folds.
  front-layout:
    confidence: estimated
    note: >-
      estimated - read off photograph 1831 as gate-1 says. Three cage blocks of four columns by two rows
      at 15.7, 78.9 and 142.1 mm (63.2 mm apart), the cage pitch 14.37 mm, the QSFP+ block 19.8 mm wide
      at 207.0 mm, the CONSOLE and MGMT/BOOT block 17.6 mm wide at 232.1 mm. Each cage column's lamp strip
      shows four arrows; they are drawn as two lamps for each cage, as the CRS354 drawing shows.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed numbers in photograph 1831: 2 4 6 ... 24 above the upper row and 1 3 5 ... 23 below the
      lower row, 40G QSFP+ 2 above and 1 below, CONSOLE above the upper right jack and MGMT/BOOT below
      the lower. The brochure's one 10/100 port is the MGMT/BOOT jack; the serial console is the CONSOLE
      jack.
  lamps:
    confidence: photo-measured
    note: >-
      Four lamps right of the USB port, top to bottom USER (green), FAULT (red), PWR 2 (blue) and PWR
      1 (blue), as printed beside them. No document held says what a lamp shows (the brochure and the
      quick guide give no LED table, only that the reset button works with "a green LED"), so none carries
      states beyond the component's own.
  reset:
    confidence: photo-measured
    note: >-
      RESET is a round button between the MGMT/BOOT jack and the USB port; the quick guide's reset section
      says to hold it at power-up until the LED flashes.
  usb:
    confidence: photo-measured
    note: >-
      The USB type A port (brochure; product page: 1 A maximum, "USB Power Reset: Yes") is mounted with
      its long side vertical, so the library's std/usb-a is turned a quarter turn.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - no rear elevation is held; the positions are read off the studio rear photograph 1832.
      It looks down on the rear, so x is taken at 4.036 px per mm across the 443 mm body and y is estimated
      at 2.9 px per mm. They are good to about 2 mm in x and 3 mm in y. As seen from the rear: the inlets
      centred at 29.0 and 113.7 mm with POWER 1 and POWER 2 above their rating legends, and three fans
      35 mm across at 225.2, 267.4 and 336.2 mm. The fans' corner screws and the wire retaining loops
      over the inlets are not drawn (the loops are accessories).
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The product page lists two AC inputs, two PSU slots and "3 fans"; the quick guide says "Two integrated
      power supply units with AC inputs for redundancy" and "Three cooling fans with automatic speed control";
      the brochure lists "Redundant supply: Yes" and two IEC cords in the box. The rear photograph shows
      a plain panel with the two inlets on it and no removable module, and no held document prints a supply
      module part number, so the supplies are built in: part of the chassis, not bays. The three round
      openings of the rear have a fan behind each, so they are fans of the chassis.
  ac-input-rating:
    confidence: photo-measured
    note: >-
      Each inlet prints "100-240 V ~1 A MAX 50/60 Hz" under POWER 1 or POWER 2 (photograph 1832); the
      brochure's range is 100 - 240 V.
  ears:
    confidence: datasheet
    note: >-
      Rack ears are in the box (brochure and product page, Included: Rack ears; Screw and feet kit K10).
      No drawing is held, so no position is dimensioned: the shipped position is taken as flush, as on
      the other CRS in the library, and the ears are not drawn.
  colour:
    confidence: photo-measured
    note: The pilot's face (#dadada) is carried; the studio render is lit differently.
attrs:
  power: {power-max-w: 69, power-without-attachments-w: 42, power-input: '100 - 240 V AC, two inputs (redundant
      supply), 50 - 60 Hz'}
  thermal: {cooling: 3 fans (product page and quick guide)}
  environmental: {operating-temp-c: -20 to 60 (tested)}
  platform: {cpu: 'QCA9531, 650 MHz', switch-chip: 98DX8332, ram: 128 MB, storage: 32 MB flash, os: RouterOS
      or SwitchOS (licence level 5)}
  performance:
    throughput: non-blocking 320 Gbps, switching capacity 640 Gbps, forwarding rate 252 Mpps (brochure)
    port-modes-sfp-plus: 10G SFP+ (brochure); no module list is printed
    port-modes-qsfp: 40G QSFP+ (brochure); no module or breakout list is printed
  compliance: {certification: 'CE, EAC, RoHS'}
