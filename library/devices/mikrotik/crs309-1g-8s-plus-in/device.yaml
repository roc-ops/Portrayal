gaps:
- what: dimensions-drawing
  scope:
  - front
  - rear
  reason: needs-drawing
  note: >-
    No dimensions drawing is held for this model (MikroTik publishes none for it). The positions are read
    off studio photographs that look down on the unit, so every y is estimated.
  wanted: MikroTik's dimensions drawing for the CRS309-1G-8S+IN.
- what: power-max-w
  scope:
  - front
  reason: sources-disagree
  note: >-
    The brochure and the product page give a maximum power consumption of 23 W (17 W without attachments);
    the quick guide says the consumption under maximum load is up to 17 W. 23 W is carried as the maximum
    and 17 W as the figure without attachments.
  wanted: MikroTik's statement of which figure is the maximum.
- what: dc-input-range
  scope:
  - rear
  reason: sources-disagree
  note: >-
    The brochure and the product page give 12 - 57 V for the DC jack and the rear prints DC 12-57 V; the
    quick guide says 11-57 V. The metal's figure is carried.
  wanted: MikroTik's statement of the DC jack range.
- what: earth-stud-part
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The earthing stud has a wing nut (photograph 1731). common/ground-stud draws a hex nut and a lug seat,
    so the stud is chassis art and exports no earth. The reason is the nearest the schema has: the part
    itself is what is missing, and the library has no needs-part reason.
  wanted: A wing-nut earth stud part, so the stud is placed and not drawn as chassis art.
- what: led-states
  scope:
  - front
  reason: vendor-silent
  note: >-
    The quick guide's LED section says what the power, user and port lamps show, and nothing held says
    what the ACT and 10G lamps show as colours or states, or which colour each lamp lights.
  wanted: MikroTik's LED table for the CRS309-1G-8S+IN.
- what: side-walls
  scope:
  - left
  - right
  reason: needs-drawing
  note: >-
    No held document shows a side wall of the body: there is no dimensions drawing and the photographs
    show the rack ear bracket and no wall detail. They are left empty.
  wanted: A side view of the unit.
- what: weight
  scope:
  - front
  reason: vendor-silent
  note: Neither the brochure, the product page nor the quick guide gives a weight.
  wanted: MikroTik's weight.
- what: eol
  scope:
  - front
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so
    no lifecycle is written.
  wanted: none
