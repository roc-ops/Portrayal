format: 1
kind: device
name: crs309-1g-8s-plus-in
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS309-1G-8S+IN
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS309}
description: >-
  MikroTik CRS309-1G-8S+IN is a compact Cloud Router Switch, 272 mm wide. It has eight SFP+ cages, one
  10/100/1000 Ethernet port that takes PoE in, and a DE-9 serial console. It runs SwOS or RouterOS (dual
  boot). The front carries the eight cages with an ACT and a 10G lamp above each. Beside them are the
  POE/BOOT jack, the CONSOLE connector, the RESET button and the USER and PWR lamps. The rear carries
  the DC jack (DC 12-57 V as printed), a cable-restraint slot, an earthing stud and a finned heatsink
  that cools the unit. There is no fan and no built-in mains supply: a 24 V 1.2 A adapter ships in the
  box. It mounts in a rack on the ears supplied.
profile: networking
provenance:
  sources:
    confidence: estimated
    note: >-
      estimated - no dimensions drawing is held for this model. CRS309-1G-8S+IN brochure, MikroTik (file
      CRS309-1G-8SplusIN_200133.pdf; no date is printed, the file name carries a revision stamp): specification
      table, powering, included parts. CRS309-1G-8S+IN product page, MikroTik (https://mikrotik.com/product/crs309_1g_8s_in,
      saved 2026-10-26): dimensions, DC inputs, cooling. Quick Guide CRS309-1G-8S+IN (file CRS309-1G-8Splus-w_190708.pdf,
      revision stamp 190708): mounting, powering, LED indicators, accessories. The studio photographs
      1730 (front, from slightly above), 1731 (rear, from above), 1732 (rear with a rack ear) and 1733
      (front with a rack ear): every position and legend. The block diagram CRS309-1G-8S_220900.png. The
      saved help page Quick Guide G1 CRS series lists the model and holds no figures. NetBox read as a
      second opinion only. MikroTik prints no figure numbers. The device name spells MikroTik's + as -plus
      because a directory name cannot carry +; model: keeps the + as printed.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: product code CRS309-1G-8S+IN, CPU 98DX8208 800
      MHz dual core, 512 MB RAM, 16 MB flash, 272 x 191 x 44 mm, -40 to +70 C tested, one 10/100/1000
      port, eight SFP+ ports, serial port RS232, PoE in (passive and 802.3af/at), 12 - 57 V on the DC
      jack and 18 - 57 V on PoE in, one DC jack, 23 W maximum and 17 W without attachments, an included
      24 V 1.2 A adapter, a screw kit and rack ears. The brochure says "special rackmount ears" are provided.
  gate-1:
    confidence: estimated
    note: >-
      estimated - the face of photograph 1730 is 3480 px wide for the printed 272 mm (12.79 px per mm)
      and 523 px tall for the printed 44 mm (11.89 px per mm), 0.93 of the horizontal scale, so the camera
      looks down and the photograph is not orthographic. Every x on the front is taken at 12.79 px per
      mm from the body's left edge and every y at 11.89 px per mm from the face's top edge; the y values
      are estimated, good to about 1 mm. The eight cage openings read a pitch of 252.7 px, 19.76 mm, uniform
      to 0.2 mm.
  chassis:
    confidence: datasheet
    note: >-
      272 x 44 x 191 from the brochure and the product page, which agree; no drawing is held. The body
      is narrower than the rack, and the rack ears supplied carry it to the rack face (photographs 1732
      and 1733).
  front-layout:
    confidence: estimated
    note: >-
      estimated - read off photograph 1730 as described under gate-1. Eight SFP+ cages, the first centred
      at 31.3 mm, 19.76 mm apart, top at 27.1 mm; each has its ACT lamp 5.05 mm left and its 10G lamp
      4.55 mm right of its centre, 23.0 mm down, with the legends ACT and 10G above them and SFP+ n under
      the cage. The POE/BOOT jack is centred at 194.8 mm and the DE-9 CONSOLE connector at 222.6 mm. The
      RESET button is at 243.2 mm, with the USER and PWR lamps at 251 mm. The hexagon vent band over the
      cages is drawn as the photograph shows it.
  lamps:
    confidence: datasheet
    note: >-
      The quick guide's LED section says the power LED is lit when the router is powered from the DC jack
      or PoE, the user LED can be configured from RouterOS, and the port LEDs indicate the individual
      Ethernet and SFP port activity. The USER and PWR lamps are given the lit colours photograph 1730
      shows (green and blue). Nothing held says what ACT and 10G mean as colours or states, so that is
      a gap.
  port-numbering:
    confidence: datasheet
    note: >-
      The metal prints SFP+ 1 to SFP+ 8 left to right under the cages, POE/BOOT under the Ethernet jack
      and CONSOLE under the DE-9 (photograph 1730). The block diagram names the cages SFP+ 1 to 8 and
      the management port Ether 1.
  poe-in:
    confidence: datasheet
    note: >-
      The Ethernet port (Ether 1, printed POE/BOOT) accepts 802.3af/at and passive PoE power input, 18
      - 57 V DC (quick guide; brochure: 18 - 57 V on PoE in). The face marks the port only with its printed
      name, POE/BOOT: no band or lamp, so none is drawn. The port carries a poe attr.
  console:
    confidence: datasheet
    note: >-
      The brochure and the product page call the serial port RS232 and the quick guide an RS-232 serial
      port at 115200 bit/s. The metal shows a nine-pin D-sub connector with jackscrews under the printed
      CONSOLE, so it is drawn with the library's DE-9 receptacle. Its role is rs232 and not console: the
      DCIM exporter's device path exports no DE-9 as a console port, so the export carries no console
      port for it.
  buttons:
    confidence: estimated
    note: >-
      One round button printed RESET (quick guide: the reset button, for reset and Netinstall).
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The unit is powered by the DC jack or by PoE in on Ethernet 1, with a 24 V 1.2 A adapter in the
      box; no supply is built in, so there are no bays. The product page lists the cooling as passive
      and the brochure says the enclosure acts as a heatsink, so no fan is drawn; the finned heatsink
      on the rear is the cooling. The two inputs work in fail-over (quick guide: the input with the higher
      voltage is the main source).
  dc-input:
    confidence: photo-measured
    note: >-
      The rear prints "DC 12-57 V" above the jack and a polarity symbol under it (photograph 1731). The
      brochure and the product page list 12 - 57 V on the DC jack; the quick guide says it accepts 11-57
      V. The legend is drawn as printed, the polarity symbol sits clear of the jack part's footprint (3.6
      mm lower than the photograph shows it), and the quick guide's figure is declared a conflict. The
      jack is the placed common/dc-barrel (dc-in), its bore positioned on the bore of photograph 1731.
  dc-in-rating:
    confidence: datasheet
    note: >-
      The rear prints "DC 12-57 V" above the jack (photograph 1731): the `input-voltage` of the dc-in
      jack, carried as printed. The brochure's and the quick guide's included 24 V 1.2 A adapter gives
      the `current-max-a`. The quick guide states the jack as 5.5 mm outside, 2 mm inside, pin positive
      (female); that size is not part of the library's one nominal dc-barrel and is carried here. The
      quick guide's 11-57 V is a conflict declared in the gaps.
  earth:
    confidence: estimated
    note: >-
      The rear carries an earthing stud with a wing nut under an earth symbol (photograph 1731). common/ground-stud
      draws a hex nut and a lug seat the stud does not have, so the stud is chassis art and the symbol
      is placed; the gap earth-stud-part asks for a wing-nut stud part.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - read off photograph 1731, which looks down on the rear, so x is taken at 11.96 px per
      mm across the 272 mm width and y at 10.9 px per mm from the wall's top, good to about 2 mm. The
      cable-restraint slot is at 8.1 to 40.3 mm, the DC jack's bore at 65.8 mm, the heatsink fin ends
      from 85.0 to 257.7 mm (about 24 fins on a 7.1 mm pitch) and the earthing stud at 260 mm. Two of
      the rear's crosshead screws are drawn.
  ears:
    confidence: estimated
    note: >-
      Rack ears are in the box (brochure: special rackmount ears are provided; product page: rack ears;
      quick guide: the mounting kit 1U RCB 190 mm, fitted to both sides with four screws). Photographs
      1732 and 1733 show the ear bracket bolted to the side wall flush with the face, long enough to reach
      the rack face, with the body at one side of the opening. The generic ear is drawn symmetrically
      and does not show that. No drawing is held, so no distance behind the face is given. The K-37 fastening
      set is a screw set and not a rack kit, so no kit is listed. The ears are not drawn.
  colour: {confidence: photo-measured, note: median of photograph 1730's face (#d4d4d4).}
