    power-input: >-
      DC jack 12 - 57 V, or PoE in on Ethernet 1, 18 - 57 V. The quick guide says 11 - 57 V for the jack;
      the rear prints DC 12-57 V
    power-adapter: 24 V 1.2 A, in the box
    poe-standard: IEEE 802.3af/at, and passive PoE (in)
  thermal: {cooling: passive (product page); no fan}
