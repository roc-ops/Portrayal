gaps:
- what: drawing-name
  scope: [front]
  reason: sources-disagree
  note: >-
    The dimensions drawing is filed as 04-4XQ-RMoutlineanddimensiondrawings_250851.pdf, with RM in the name, and its title
    block reads "504-4XQ-IN". The IN is the model with ears in the box and the two supply modules the drawing draws; no RM
    model exists on the product pages held. The drawing is used as the IN's.
  wanted: none
- what: power-figures
  scope: [front]
  reason: sources-disagree
  note: >-
    The photograph prints "36 - 60 V" over the two DC inputs where the brochure and the quick guide say 36-57 V; the
    brochure's 43-57 V passive or 802.3bt class 6 PoE in is 42.5-57 V in the quick guide and passive 802.3af/at in the block
    diagram. The brochure's figures are carried and the legend is drawn as printed.
  wanted: MikroTik's statement of the DC and PoE in ranges.
- what: temperature-figures
  scope: [front]
  reason: sources-disagree
  note: >-
    The brochure and the page print an operating temperature of -40 to +70 C; the quick guide's specification table prints
    0 to +70 C. The brochure's is carried.
  wanted: MikroTik's statement of the operating range.
- what: hot-swap-supplies
  scope: [front]
  reason: vendor-silent
  note: >-
    The brochure calls the two power supplies hot-swap and prints no part number; no data sheet or drawing of the supply is
    held, and no document says what the box ships with or what covers an empty slot. They are drawn as part of the chassis
    with their inlets and no bay is added; the base configuration exports two AC power ports.
  wanted: The supply's part number and a statement of what a slot holds when empty.
- what: dc-jack
  scope: [front]
  reason: vendor-silent
  note: >-
    The drawing and photographs show a DC barrel jack, 9.0 x 10.8 mm, rated 36-57 V (brochure) and printed 36 - 60 V. The
    library's census of common/dc-barrel@1 pins a current rating beside the voltage on every placement, and no held document
    states a current for this jack, so the jack is drawn as chassis art and not placed; the device exports no power port for
    it. Placing it later is one census line and the box's current.
  wanted: MikroTik's current rating for the DC jack.
- what: dc-terminal
  scope: [front]
  reason: needs-drawing
  note: >-
    The reason is the nearest the schema has: the part itself is what is missing, and the library has no needs-part reason.
    The drawing and photographs show a two-pin pluggable DC terminal block, about 9.4 x 9.8 mm, beside the DC jack. The
    registry's only part, common/dc-terminal-plug-2@1, is 32.1 x 17.6 mm and belongs to another box, so the terminal is not
    placed and the device exports no power port for it. The brochure lists it as a DC input (36-57 V).
  wanted: A small two-pole pluggable terminal block part.
- what: led-states
  scope: [front]
  reason: vendor-silent
  note: >-
    Searched the brochure, the page and the quick guide page for an LED table: none. The ACT and 100G lamps of each cage, the
    USER, FAULT and POWER lamps and the green lamp on each supply carry the component's own vocabulary and no meaning is
    stated.
  wanted: MikroTik's LED description for the CRS504-4XQ-IN.
- what: rear-face
  scope: [rear]
  reason: needs-drawing
  note: >-
    No held document shows the rear: the drawing's top plan shows a stud 8 mm beyond the rear near the right edge and
    photograph 2158 shows its tip, but no view shows the rear face itself, and the studio photographs look at the front. It is
    left empty and no earthing stud is drawn.
  wanted: A rear view.
- what: left-wall
  scope: [left]
  reason: needs-drawing
  note: >-
    No held document shows the left wall: the drawing has no wall view and the photographs show the right wall and the front.
    It is left empty and is not drawn from the right.
  wanted: A left side view.
- what: top-and-bottom
  scope: [top, bottom]
  reason: needs-drawing
  note: >-
    The top plan shows four shallow slots in the lid and the CLOUD SWITCH lettering, which photograph 2157 shows as embossed
    grooves and not as openings; no document shows the underside.
  wanted: A bottom view.
- what: fan-count
  scope: [right]
  reason: vendor-silent
  note: >-
    The brochure and the page give no fan count and no fan statement; photograph 2158 shows two openings on the right wall,
    which are drawn. No fan redundancy is written.
  wanted: MikroTik's fan count and redundancy statement.
- what: weight
  scope: [front]
  reason: vendor-silent
  note: Neither the brochure nor the page gives a weight.
  wanted: MikroTik's weight.
- what: eol
  scope: [front]
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so no lifecycle is
    written.
  wanted: none
