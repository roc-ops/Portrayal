format: 1
kind: device
name: crs504-4xq-in
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS504-4XQ-IN
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS504}
description: >-
  MikroTik CRS504-4XQ-IN is a fixed 1U indoor Cloud Router Switch, 320 mm wide with rack ears in the box, with four
  100 Gigabit QSFP28 cages, a 100 Megabit management port that also takes PoE in, an RJ45 serial console, a DC jack and a
  two-pin DC terminal (both drawn as chassis art, see the gaps), and runs RouterOS v7. Everything but the fans is on the front: two
  hot-swap AC supply modules with their C14 inlets at the left, the four QSFP28 cages under a vent, the console over the
  management port, RESET, the two DC inputs and three status lamps. Two round fan guards and an earthing stud are on the
  rear. The brochure
  prints no part number for the supplies, so they are part of the chassis and there are no bays.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Dimensions drawing, MikroTik, title block "504-4XQ-IN", "Printed: 02.10.2023" (file
      04-4XQ-RMoutlineanddimensiondrawings_250851.pdf: the file name says RM, the title block says IN; page image at 3308 px
      across, 3.93 px per mm on the front view): front with the ears, top plan and end view. It is the IN's: the front view
      draws the IN's two AC supply modules, four QSFP28 cages, console and management jacks, DC terminal block and DC jack,
      and rack ears, its 320 x 185 x 44 mm agrees with the IN's brochure and page, and it shows nothing of the -OUT (whose
      page describes an IP66 weatherproof enclosure with hose clamps). CRS504-4XQ-IN brochure, MikroTik (file
      CRS504-4XQ-IN_220440.pdf; no date is printed, the file name carries a revision stamp): specifications, powering and
      included parts. Product page, MikroTik (https://mikrotik.com/product/crs504_4xq_in, saved 2026-10-26). Declaration of
      conformity ID-209.1 (file ID209.1_CRS504_4XQ_IN_DOC_231003.pdf, Riga, 17 October 2023): names the model and pictures
      it, says nothing of the drawing and holds no dimension. Studio photographs: 2156 (front, three-quarter from the left,
      above), 2157 (front, from slightly above), 2158 (front right and the right wall, from above), 2159 (front,
      three-quarter, with the ears), 2160 (front, from slightly above, with the ears), 2161 (a three-quarter that lies the
      unit on its side, showing the lid), 2162 (the block diagram) and 2163 (an application diagram); all show the IN. The quick
      guide page (Quick Guide - CRS504-4XQ-IN, help.mikrotik.com, last updated Jun 30, 2025) holds no figure and no LED table.
      The block diagram CRS504-4XQ-INr3_261029.png. NetBox's device type as a second opinion only. MikroTik prints no figure
      numbers. The hardware manual page is not held.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: product code CRS504-4XQ-IN, QCA9531 650 MHz MIPSBE, 64 MB RAM, 16 MB
      flash, 1 x 100M Ethernet, 4 x 100G QSFP28, switch chip 98DX4310, 320 x 185 x 44 mm, RouterOS v7 level 5, -40 to +70 C.
      Powering: three DC inputs (PoE-in 43-57 V passive or 802.3bt class 6; DC jack 36-57 V; 2-pin terminal 36-57 V), 25 W
      maximum without attachments and 41 W maximum. Included parts: 2 power cords, a fastening set, rack ears. The text says
      "dual hot-swap power supplies" and states no redundancy form. Each figure is filed as the document words it.
  gate-1:
    confidence: drawing
    note: >-
      The drawing's front view body is 1255 px wide between its left and right lip lines for the printed 320 mm (3.92 px per
      mm in the page image) and 44 mm tall, the printed 44. Every x and y below is taken at 3.93 px per mm from the body's
      top-left corner of the front view; cage edges were measured on the pixels (about 0.3 mm), the other features read off a
      3 times enlargement of the view (about 0.7 mm).
  chassis:
    confidence: drawing
    note: >-
      320 x 185 x 44, as the drawing prints them; the brochure and the page print 320 x 185 x 44 and agree. The drawing also
      dimensions 9 mm beyond the front (the two-pin terminal block), 8 mm beyond the rear (a stud) and 210 mm overall to the
      ends of the supply handles; none of these is part of the 185. The 481 mm across the ears is the ears' width, and the
      462 mm the pitch of their holes.
  front-layout:
    confidence: drawing
    note: >-
      From the drawing's front view. Two supply modules 52.6 x 38.2 mm at 12.2 and 72.1 mm, 2.3 mm down, each with a C14 inlet
      turned a quarter turn (18 wide by 25 tall, earth pin at the left) centred 50.2 and 110.2 mm and 24.9 mm down, a green
      lamp, a six-slot vent and a latch. Four QSFP28 cages 20.6 mm wide and 10.9 mm tall, measured on the pixels at 144.9,
      171.1, 197.3 and 223.3 mm (a 26.1 mm pitch) and 26.1 mm down, with a bracket and the cage number over each and two lamps
      under each. A woven slot vent 97.7 x 11.5 mm over the cages. The console and management jacks share a plate 18.1 x 26.8 at
      248.6 mm, 10.6 mm, the console above. RESET is a ring at 271.9 mm, 34.6 mm. The two-pin terminal is 11.4 x 12.3 mm at
      275.1 mm and the DC jack housing 10.3 x 11.9 mm at 289.8 mm. Three lamps are small bars under the jacks.
  lamps:
    confidence: estimated
    note: >-
      Each cage has two bar lamps under it, printed ACT at the left and 100G at the right (photograph 2157), centred 7.95 mm
      either side of the cage centre. The three bar lamps at the right are printed USER, FAULT and POWER. The green lamp on each
      supply module is drawn as the photograph shows it. No document says what a lamp shows (gap `led-states`).
  port-numbering:
    confidence: photo-measured
    note: >-
      The metal prints 1 2 3 4 over the cages on a bracket, left to right.
  management-and-console:
    confidence: photo-measured
    note: >-
      Photograph 2157 prints CONSOLE over the upper jack and MGMT/PoE in under the lower. The page counts one 100M Ethernet
      port, the management port, filed at 100m; the brochure lists PoE in at 43-57 V passive or 802.3bt class 6 on it, which is
      an input and is carried in the power attributes, not as a PoE out. The block diagram says 43-57 V, passive, 802.3af/at.
  dc-inputs:
    confidence: photo-measured
    note: >-
      Both DC inputs are drawn as chassis art and not placed. The jack (gap `dc-jack`: the barrel census wants a current no
      document states) is 10.3 x 11.9 mm at 289.8 mm, 25.4 mm down, a socket with a rim, a bore 5.6 mm across and a centre pin
      (photograph 2157 and the drawing). The two-pin pluggable terminal is 11.4 x 12.3 mm at 275.1 mm, 25.1 mm down: a cap 10.0
      x 4.1 mm over a housing 11.4 x 8.2 mm with two wire entries, measured on the drawing's front view at 3.94 px per mm (the
      housing from x 1799.4 to 1844.4 px and y 536 to 584.4 px of the page image, body corner at 715.5, 437), and the drawing
      dimensions it 9 mm proud of the front; it is drawn flat. That agrees with the CRS510 drawing's reading of the same
      terminal (11.4 x 11.8 at 275.4 mm); the first reading of 9.4 x 9.8 mm for this model took the housing without its cap and
      the jack at 9.0 x 10.8 mm too small. The registry's common/dc-terminal-plug-2 is a 32.1 x 17.6 mm part drawn for another
      maker's box, so no part is placed and no power port exported (gap `dc-terminal`). The metal prints "36 - 60 V" over both
      inputs (the dash is not resolved in photograph 2157, which reads "36   60 V"; the drawing prints a dash); the brochure and
      the quick guide say 36-57 V (gap `power-figures`). A bracket spans both inputs; the terminal's two marks, left to right,
      are a circled minus and a circled plus; the jack's are a circled minus, a pin symbol with its dot joined by a line to the
      circled plus: the centre pin is the positive pole, as read from the photograph.
  vents:
    confidence: photo-measured
    note: >-
      The cage vent is a woven field of slots at about plus and minus 45 degrees with small diamond holes (squares turned 45
      degrees, 1.6 mm across, one at each edge of the band, as photograph 2157 and the drawing show them), drawn as a `motif`
      tile 16.9 x 11.5 mm (the existing patterns draw no slanted slots) over a field 97.0 x 11.5 mm (the drawing's 97.7 trimmed
      by 0.7 mm so that the cut at the right end, 12.5 mm into the last period, leaves no sliver of a slot), 5.74 periods, the
      field starting at the tile's left edge with square corners. Read off photograph 2157 at 4.953 px per mm (the face's 1585 px for 320 mm):
      the period is 83.5 px (16.86 mm) from four periods of the long slot, 16.9 here (estimated). The photograph looks down on
      the face, whose 44 mm height reads 184 px (4.18 px per mm, 0.84 of the horizontal scale), and the band reads 43.5 px tall,
      9.0 mm at the face's vertical scale against the drawing's 11.5 mm: the photograph is foreshortened, the drawing is
      orthographic and wins for the field's size, and the weave is stretched vertically to it (the long slot reads 41.1 degrees in
      the photograph and 47.8 after). The drawing's front view is too small to read the weave. The supply vents are rects of
      slots measured on the drawing's front view of the first supply (3.94 px per mm; the drawing draws both alike, so the second
      is offset by the 59.9 mm between the modules): two rows of three slots 3.9 x 7.8 mm and four slots in the top row.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The brochure lists "dual hot-swap power supplies" and 2 power cords; the quick guide lists 2 AC inputs at 100-240 V. The
      drawing and photographs show two modules at the front, each with a C14 inlet, a steel handle, a latch and a green lamp. No
      held document prints a part number for the supply, so none is named: the supplies are part of the chassis with their
      inlets, as on juniper/ex2300-24t, and there are no bays (gap `hot-swap-supplies`). No document says what covers an empty
      slot. The photograph prints "100-240 V 50/60 Hz" up the left edge of the first module and PSU 1 and PSU 2 beside them.
      The brochure's 41 W is the box's maximum power consumption and its 25 W the figure without attachments. Each module's
      handle is a steel bar 6.0 x 36 mm left of the inlet (read on the drawing's front view, 3.93 px per mm), its latch a
      7.1 x 14.3 mm blue-grey grip at the module's left edge, and three screw holes sit in the face beside the modules; the
      legends are drawn at the size the drawing prints them (cap height 1.9 mm for the voltage run, 1.6 mm for PSU 1 and 2).
      Photograph 2158
      shows two fan guards on the rear; the brochure and the page give no fan count and no fan statement.
  rear-layout:
    confidence: estimated
    note: >-
      Photograph 2158 (2216 x 1279 px) looks at the rear, the 320 mm face, not at a wall. The lid's long edge above the guards
      and the short edge along the face that carries the ear's four-hole flange stand in 1.7 to 1 (the lid is 320 x 185); the
      lid's slots run parallel to that short face and the CLOUD SWITCH lettering runs along the guard face, upside down and at
      the far edge; the earthing stud shows at the left end of the guard face, which is the end the drawing's top plan puts it
      at, seen from behind. The face's four corners in the photograph (151,400 upper left, 1050,931 upper right, 1052,1126 lower
      right and 171,560 lower left, as seen from behind) were transformed onto 320 x 44 mm at 10 px per mm. The transform reads
      the guards' rings 36.8 mm wide and 40.8 mm tall, the screw-hole recesses 1.09 and the hexagon cells about 1.1 taller than
      their width (a regular cell reads 1.155 across the corners over the flats; these read 1.06 to 1.1): the face's corners pin
      its length at 320 mm, so the stretch is taken in the height, and heights are divided by 1.09 about the face's middle (the
      stud's base then reads 10.5 mm from the left end, the drawing's 11.0, and 34.1 mm down, the drawing's 9.2 mm up from the
      bottom, 34.8). Each guard is drawn round, 37.0 mm across (the corrected height reads 37.4; no held source shows an
      oval), centred 114.8 and 154.8 mm from the stud's end and 22.0 mm down, 40.0 mm apart, round a clear hub 21.0 mm
      across in the face's colour
      (#d4d4d4; the hub and the plain face both read #bababa in the shaded photograph, box 1100,190 to 1200,260 with 7000 pixels
      and box 2200,100 to 2600,300 with 80000 pixels of the transformed image). The hexagon cells are 6.3 mm apart in a column
      (66 px), so the renderer's tile 8.86 x 5.11 mm is scaled by 1.233 on both axes to 10.92 x 6.3 mm (the first drawing used
      the base tile unscaled; its holes then read 5.1 mm across the corners where the photograph's cells, walls included, are
      about 6 mm; the vertical reading is 6.05 mm after the division and the diagonal one 6.6, hence 6.3); a cell sits on each
      ring's centre (the left column of cells reads 15.5 mm from the centre, three columns of 5.46 mm, and half a row up);
      about seven columns run across a ring. Each guard has a screw hole at its upper right and its lower left, as seen from
      behind, 3.8 mm across, centred 15.4 to 18.2 mm along and 15.5 to 16.6 mm across from the ring's centre; the fill #232323 is the median of 224 pixels of the dark opening (box 1320,36 to
      1334,52 of the transformed image) and the lighter recess round it is not drawn. The cell width, the guards' height and
      the holes are estimated to about 2 mm. The left wall's two holes are read from the drawing's end view, at 3.94 px per
      mm (page image, wall from x 2494 to 2668 px, rear end at y 928, rings centred at 2585,947.7 and 2604.7,947.7): the view
      is the left wall, seen from outside with the front at the bottom of the page, because it puts the stud 9.1 mm from the
      edge that photograph 2158 shows is the bottom, so the lid is at the right of the page; its two rings are 2.8 mm across,
      5.0 mm from the rear end and 15.9 and 20.9 mm below the lid, and 2158's left wall shows the same two dots near its rear
      end. They are drawn 5.0 mm in from the left wall's rear edge (that face's x runs from the rear). Their fill #646464 is
      the median of two boxes of 64 pixels (2158, boxes 1070,986 to 1078,994 and 1069,1010 to 1077,1018) of the same holes,
      estimated, as the drawing has no colour. The right wall is not drawn: no held document shows it (gap `right-wall`).
  ears:
    confidence: drawing
    note: >-
      Rack ears are in the box (the brochure and the page: Rack ears). The drawing's front view draws them 80.5 mm either
      side of the 320 mm body (481 mm over the ears, holes 462 mm apart). They are shipped flush with the face and are not
      drawn on it; no `at` is written and no kit is listed.
  colour:
    confidence: estimated
    note: >-
      Photograph 2157, medians of plain patches: the front face #d4d4d4 over three unlit, unshaded patches (boxes 1650,590 to
      1720,650 with 4200 pixels and a spread of 0.3; 1680,550 to 1720,575 with 1000 pixels and 0.1; 1475,500 to 1600,560 with
      7500 pixels and 0.2), drawn #d4d4d4; the supply handle #a4a5a5 (box 303,587 to 311,629, 336 pixels, spread 6.2), the latch #4f566a (box
      210,529 to 232,587, 1276 pixels, spread 23.0) and the screw holes #020202 (box 196,535 to 204,543, 64 pixels); the lid
      reads #e8e8e8 (box 400,250 to 600,350) and is a different, lit surface. The
      supply module plates #9a9c9d (box 270,500 to 290,506, 120 pixels, spread 5.4; box 262,535 to 270,555, 160 pixels, #939495),
      drawn #9a9c9d. The jack plate #9a9c9c (box 1380,582 to 1460,586, 320 pixels, spread 2.9), drawn #9a9c9c. The terminal's green
      #90cc90 (box 1512,639 to 1557,642, 135 pixels, spread 5.5) and its wire entries #405a40 (box 1516,622 to 1520,635, 52
      pixels), the jack's housing #464646 (annulus 18 to 21 px round the bore, 312 pixels, spread 2.0), rim #222222 (14 to 16 px,
      148 pixels), bore #141312 (8 to 12 px, 208 pixels) and pin #a49478 (24 pixels). The lamps rest unlit grey in the photograph,
      #838383 to #858585 (boxes 1459,651 to 1472,655, 52 pixels; 1491,651 to 1504,655; 1560,651 to 1574,655); the render draws
      them with the lamp component's own resting colour (gap `led-states`). The earthing stud's end is in no photograph, so its
      #9a9c9d is the supply plates' steel and is estimated.
