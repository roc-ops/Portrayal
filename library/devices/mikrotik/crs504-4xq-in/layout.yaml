format: 1
kind: device
name: crs504-4xq-in
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS504-4XQ-IN
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS504}
description: >-
  MikroTik CRS504-4XQ-IN is a fixed 1U indoor Cloud Router Switch, 320 mm wide with rack ears in the box, with four
  100 Gigabit QSFP28 cages, a 100 Megabit management port that also takes PoE in, an RJ45 serial console, a DC jack and a
  two-pin DC terminal (drawn or left out, see the gaps), and runs RouterOS v7. Everything but the fans is on the front: two
  hot-swap AC supply modules with their C14 inlets at the left, the four QSFP28 cages under a vent, the console over the
  management port, RESET, the two DC inputs and three status lamps. Two fan openings are on the right wall. The brochure
  prints no part number for the supplies, so they are part of the chassis and there are no bays.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Dimensions drawing, MikroTik, title block "504-4XQ-IN", "Printed: 02.10.2023" (file
      04-4XQ-RMoutlineanddimensiondrawings_250851.pdf: the file name says RM, the title block says IN; page image at 3308 px
      across, 3.93 px per mm on the front view): front with the ears, top plan and end view. It is the IN's: the front view
      draws the IN's two AC supply modules, four QSFP28 cages, console and management jacks, DC terminal block and DC jack,
      and rack ears, its 320 x 185 x 44 mm agrees with the IN's brochure and page, and it shows nothing of the -OUT (whose
      page describes an IP66 weatherproof enclosure with hose clamps). CRS504-4XQ-IN brochure, MikroTik (file
      CRS504-4XQ-IN_220440.pdf; no date is printed, the file name carries a revision stamp): specifications, powering and
      included parts. Product page, MikroTik (https://mikrotik.com/product/crs504_4xq_in, saved 2026-10-26). Declaration of
      conformity ID-209.1 (file ID209.1_CRS504_4XQ_IN_DOC_231003.pdf, Riga, 17 October 2023): names the model and pictures
      it, says nothing of the drawing and holds no dimension. Studio photographs: 2156 (front, three-quarter from the left,
      above), 2157 (front, from slightly above), 2158 (front right and the right wall, from above), 2159 (front,
      three-quarter, with the ears), 2160 (front, from slightly above, with the ears), 2161 (a three-quarter that lies the
      unit on its side, showing the lid), 2162 (the block diagram) and 2163 (an application diagram); all show the IN. The quick
      guide page (Quick Guide - CRS504-4XQ-IN, help.mikrotik.com, last updated Jun 30, 2025) holds no figure and no LED table.
      The block diagram CRS504-4XQ-INr3_261029.png. NetBox's device type as a second opinion only. MikroTik prints no figure
      numbers. The hardware manual page is not held.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: product code CRS504-4XQ-IN, QCA9531 650 MHz MIPSBE, 64 MB RAM, 16 MB
      flash, 1 x 100M Ethernet, 4 x 100G QSFP28, switch chip 98DX4310, 320 x 185 x 44 mm, RouterOS v7 level 5, -40 to +70 C.
      Powering: three DC inputs (PoE-in 43-57 V passive or 802.3bt class 6; DC jack 36-57 V; 2-pin terminal 36-57 V), 25 W
      maximum without attachments and 41 W maximum. Included parts: 2 power cords, a fastening set, rack ears. The text says
      "dual hot-swap power supplies" and states no redundancy form. Each figure is filed as the document words it.
  gate-1:
    confidence: drawing
    note: >-
      The drawing's front view body is 1255 px wide between its left and right lip lines for the printed 320 mm (3.92 px per
      mm in the page image) and 44 mm tall, the printed 44. Every x and y below is taken at 3.93 px per mm from the body's
      top-left corner of the front view; cage edges were measured on the pixels (about 0.3 mm), the other features read off a
      3 times enlargement of the view (about 0.7 mm).
  chassis:
    confidence: drawing
    note: >-
      320 x 185 x 44, as the drawing prints them; the brochure and the page print 320 x 185 x 44 and agree. The drawing also
      dimensions 9 mm beyond the front (the two-pin terminal block), 8 mm beyond the rear (a stud) and 210 mm overall to the
      ends of the supply handles; none of these is part of the 185. The 481 mm across the ears is the ears' width, and the
      462 mm the pitch of their holes.
  front-layout:
    confidence: drawing
    note: >-
      From the drawing's front view. Two supply modules 52.6 x 38.2 mm at 12.2 and 72.1 mm, 2.3 mm down, each with a C14 inlet
      turned a quarter turn (18 wide by 25 tall, earth pin at the left) centred 50.2 and 110.2 mm and 24.9 mm down, a green
      lamp, a six-slot vent and a latch. Four QSFP28 cages 20.6 mm wide and 10.9 mm tall, measured on the pixels at 144.9,
      171.1, 197.3 and 223.3 mm (a 26.1 mm pitch) and 26.1 mm down, with a bracket and the cage number over each and two lamps
      under each. A chevron vent 97.7 x 11.5 mm over the cages. The console and management jacks share a plate 18.1 x 26.8 at
      248.6 mm, 10.6 mm, the console above. RESET is a ring at 271.9 mm, 34.6 mm. The two-pin terminal block is about 9.4 x
      9.8 mm at 276.5 mm and the DC jack housing 9.0 x 10.8 mm at 290.9 mm. Three lamps are small bars under the jacks.
  lamps:
    confidence: estimated
    note: >-
      Each cage has two bar lamps under it, printed ACT at the left and 100G at the right (photograph 2157), centred 7.95 mm
      either side of the cage centre. The three bar lamps at the right are printed USER, FAULT and POWER. The green lamp on each
      supply module is drawn as the photograph shows it. No document says what a lamp shows (gap `led-states`).
  port-numbering:
    confidence: photo-measured
    note: >-
      The metal prints 1 2 3 4 over the cages on a bracket, left to right.
  management-and-console:
    confidence: photo-measured
    note: >-
      Photograph 2157 prints CONSOLE over the upper jack and MGMT/PoE in under the lower. The page counts one 100M Ethernet
      port, the management port, filed at 100m; the brochure lists PoE in at 43-57 V passive or 802.3bt class 6 on it, which is
      an input and is carried in the power attributes, not as a PoE out. The block diagram says 43-57 V, passive, 802.3af/at.
  dc-inputs:
    confidence: photo-measured
    note: >-
      The DC jack is drawn as chassis art and not placed (gap `dc-jack`: the barrel census wants a current no document
      states). The photograph prints "36 - 60 V" over both DC inputs; the brochure and the quick guide say 36-57 V. The
      two-pin pluggable terminal block beside it is about 9.4 x 9.8 mm; the registry's common/dc-terminal-plug-2 is a 32.1 x 17.6
      mm part drawn for another maker's box, so it is not placed and the terminal is left out with a gap (`dc-terminal`). The
      polarity marks above the terminal are not drawn.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The brochure lists "dual hot-swap power supplies" and 2 power cords; the quick guide lists 2 AC inputs at 100-240 V. The
      drawing and photographs show two modules at the front, each with a C14 inlet, a steel handle, a latch and a green lamp. No
      held document prints a part number for the supply, so none is named: the supplies are part of the chassis with their
      inlets, as on juniper/ex2300-24t, and there are no bays (gap `hot-swap-supplies`). No document says what covers an empty
      slot. The photograph prints "100-240 V 50/60 Hz" up the left edge of the first module and PSU 1 and PSU 2 beside them.
      The brochure's 41 W is the box's maximum power consumption and its 25 W the figure without attachments. Photograph 2158
      shows two fan openings on the right wall; the brochure and the page give no fan count and no fan statement.
  side-layout:
    confidence: estimated
    note: >-
      Photograph 2158 looks down on the right wall (the PSU modules are at the left of the front, and this wall carries the
      two small holes by the front edge that the drawing's end view shows). It shows two round, hexagon-perforated fan openings
      near the rear, each about 30 mm across and touching or nearly so. They are drawn 30 mm across, centred 96 and 129 mm
      from the front and 22 mm down, read off a photograph that looks at the wall obliquely and from the front, so the
      positions are good to about 8 mm. No held document shows the left wall.
  ears:
    confidence: drawing
    note: >-
      Rack ears are in the box (the brochure and the page: Rack ears). The drawing's front view draws them 80.5 mm either
      side of the 320 mm body (481 mm over the ears, holes 462 mm apart). They are shipped flush with the face and are not
      drawn on it; no `at` is written and no kit is listed.
  colour:
    confidence: estimated
    note: >-
      The median of photograph 2157's face is #e6e6e8; the face is drawn #dddddd so it reads on the light stage.
