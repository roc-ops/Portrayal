  power:
    power-max-w: 800
    power-without-attachments-w: 85
    power-supply-w: 750
    power-input: 100 - 240 V AC, one input
    poe-budget-w: 700
    poe-standard: IEEE 802.3af/at; 26 V or 53 V passive
  thermal:
    cooling: 4 fans (product page and old quick guide)
  environmental:
    operating-temp-c: -20 to 60 (tested)
  platform:
    cpu: QCA9531, 650 MHz
    switch-chip: 98DX3257
    ram: 128 MB
    storage: 32 MB flash
    os: RouterOS v7 / SwitchOS (licence level 5)
  performance:
    throughput: non-blocking 168 Gbps, switching capacity 336 Gbps, forwarding rate 235 Mpps (brochure)
    port-modes-sfp-plus: 10G SFP+ (brochure); no module list is printed
    port-modes-qsfp: 40G QSFP+ (brochure); no module or breakout list is printed
  compliance:
    certification: CE, EAC, RoHS
