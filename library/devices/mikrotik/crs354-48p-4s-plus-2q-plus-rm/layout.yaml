format: 1
kind: device
name: crs354-48p-4s-plus-2q-plus-rm
version: 1.0.0
maturity: modelled
manufacturer: MikroTik
model: CRS354-48P-4S+2Q+RM
portfolio: {line: Switches, family: Cloud Router Switch, series: CRS354}
description: >-
  MikroTik CRS354-48P-4S+2Q+RM is a fixed 1U Cloud Router Switch with PoE out. It has 48 10/100/1000 Ethernet
  ports that all supply PoE (IEEE 802.3af/at, or 26 V / 53 V passive). It also has four SFP+ cages, two 40G QSFP+
  cages, a 10/100 management port and an RJ45 serial console, and runs RouterOS. The front carries the 48 jacks in
  four blocks of six columns by two rows. They are numbered 1 to 48 as printed, with the odd number on the lower jack
  of a column. The four SFP+ cages are numbered 1 to 4 and the two QSFP+ cages 1 and 2, each pair stacked, with the
  odd number below.
  The right-hand end carries the CONSOLE and MGMT jacks, the RESET button and the POWER and FAULT lamps. The rear
  carries one AC inlet (100-240 V, 10 A) and a vent field; two fan openings are in the left wall. The power supply
  and the fans are built into the chassis, so there are no bays.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Dimensions drawing "CRS354_48P_dimensions", MikroTik, printed 20.09.2023 (file CRS354_48P_dimensions_230946.pdf,
      rendered at 200 dpi): front, side, top plan and isometric. CRS354-48P-4S+2Q+RM brochure, MikroTik (file
      CRS354-48P-4Splus2QplusRM_240917.pdf; no date is printed, the file name carries a revision stamp):
      specification table, powering table and included parts. CRS354-48P-4S+2Q+RM product page, MikroTik (saved
      2026-10-26): dimensions, AC inputs and PSU slots, cooling type, power and PoE. The older quick guide
      CRS354-48P-4S+2Q+RM (file CRS354-48P-4Splus2QplusRM_200252.pdf; no date is printed): mounting, extension slots
      and ports, powering, reset. The product-page studio photographs 1911 (front), 1913 and 1910 (rear) and 1909
      (three-quarter front). The NetBox community device type was read as a second opinion only. No figure numbers:
      MikroTik prints none. The device name spells MikroTik's + as -plus because a directory name cannot carry +;
      model: keeps the + as printed.
  datasheet:
    confidence: datasheet
    note: >-
      The brochure is MikroTik's datasheet for the model: QCA9531 CPU at 650 MHz, 128 MB RAM, 32 MB flash, one 100 Mbps
      and 48 1 GbE ports, four SFP+ and two QSFP+ cages, RouterOS licence level 5, AC supply 100 - 240 V, serial port
      RJ45, 443 x 382 x 44 mm, -20 to +60 C. Its Powering table gives PoE-out 802.3at/af and 26 or 53 V passive on
      Ether1 - Ether48, 26 W per port at 26 V and 30 W at 53 V, 27 A total at 26 V and 13.2 A at 53 V, "Max power
      consumption" 800 W and "without attachments" 85 W; its text says the supply provides 750 W. The product page
      adds the switch chip 98DX3257, one AC input, one PSU slot, four fans and a total output power of 700 W; the old
      quick guide says "With attachments 700 W". The 800 W is filed as the maximum, the 85 W as the figure without
      attachments, 700 W as the PoE budget (page and quick guide) and the brochure's 750 W as the supply rating.
  gate-1:
    confidence: drawing
    note: >-
      The straight-on front photograph 1911 spans the 482.6 mm between the outer edges of its ears across 6400 px
      (13.26 px per mm), and its jack pitch reads 14.0 mm, the registry's ganged RJ-45 pitch of 13.97, on a quantity the
      scale never saw. The front right end (blocks at 362.3, 396.4 and 418.8 mm) and the jack start (10.1 mm) agree
      with the CRS354-48G drawing's to the photograph's 1 mm, so the two fronts share the 48G drawing's measurements
      for blocks, cages and jacks. The 48P drawing's own front view is 1.97 px per mm and is used only for that
      agreement.
  chassis:
    confidence: drawing
    note: >-
      443 wide, 44.3 high, 380 deep, from the drawing (443, 44.3 and 380 on its front, side and top views). The
      brochure and the product page print "443 x 382 x 44 mm": the depth is 2 mm longer and the height is rounded. The
      drawing's figures are carried. The 7 mm the top plan dimensions is the power-cord retaining loop standing off
      the rear. The side view also draws a bracket standing 29.5 mm behind the body at the rear: these are the rear
      support ears (below) and are not part of the 380. 443 is the body between the ear folds.
  front-layout:
    confidence: photo-measured
    note: >-
      Four jack blocks of six columns by two rows on the 13.97 mm pitch, the first jack housing at 10.1 mm and the
      blocks 88.4 mm apart (gutter 4.58 mm), the SFP+ block 30.5 mm wide at 362.3 mm, the QSFP+ block 21.1 mm wide at
      396.4 mm and the console and management block 18.4 mm wide at 418.8 mm, as measured in photograph 1911. The
      row pitch is the pilot's 13.4 mm. Colours are the pilot's (face #dadada, plates #bebebe). The grey label pads
      above the jack numbers and the plug symbol of the PoE out legend are printed marks and are not drawn.
  poe-markings:
    confidence: photo-measured
    note: >-
      Left of the first column the front prints a red square with 53V, a green square with 26V and the legend PoE out
      (photograph 1911, 5.8 mm from the face edge). The jack lamps change colour with the passive voltage, so the
      squares are drawn as a colour key and not as lamps; the brochure and the old quick guide say nothing of it.
  port-numbering:
    confidence: photo-measured
    note: >-
      As the CRS354-48G: 2 4 ... 48 above the upper row and 1 3 ... 47 below the lower row; SFP+ 2 and 4 above and 1
      and 3 below; 40G QSFP+ 2 above and 1 below; CONSOLE above and MGMT below the right-hand pair. The 10/100 port of
      the brochure is the MGMT jack, whose two lamps the photograph shows.
  lamps:
    confidence: photo-measured
    note: >-
      The jacks carry their own two lamps in their keyway-side corners. The SFP+ strip carries eight arrow lamps and
      the QSFP+ strip two arrows with four slots between them, at the CRS354-48G drawing's positions (the photograph
      shows the same strips). The strip under the RESET button holds the FAULT and POWER lamps, 2.6 and 7.9 mm from
      its left end (photograph 1911); its right end is the reset button's. No document held says what a lamp shows
      (the brochure and the quick guide give no LED table), so none carries states beyond the component's own.
  reset:
    confidence: photo-measured
    note: >-
      RESET is a round button at 430.6 mm (photograph 1911), the library's recessed reset part. The old quick guide's
      reset section says to hold the button at power-up until the lamp flashes.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - no rear elevation is held; the positions are read off the studio rear photograph 1913. It looks down
      on the rear, so x is taken at 14.72 px per mm across the 443 mm body (the photograph is 7560 px wide) and y at
      13.4 px per mm for the 44.3 mm panel. They are good to about 1.5 mm in x and 2 mm in y. As seen from the rear: one
      hex vent field 75 x 36.8 mm at 27.0 mm, and the C14 inlet centred at 403.6 mm, 23.2 mm down. The inlet is
      turned a quarter turn (its earth pin on the right) with the legend 100-240 V / ~10A MAX, 50/60 Hz to its lower
      right. The wire retaining loop on the inlet is an accessory (the drawing dimensions only its 7 mm standoff) and
      is not drawn.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      The product page lists one AC input, one PSU slot and "4 fans"; the old quick guide lists "Four cooling fans with
      automatic speed control" and the brochure a 750 W power supply. The rear photographs show a plain panel with the
      inlet on it and no removable module, and no held document prints a supply module part number, so the supply is
      built in: part of the chassis, not a bay. The two fan rings of the drawing's side view are fans of the chassis,
      drawn as fan openings. The other two fans are placed by no held document and are not drawn. The vent fields are
      vents.
  ac-input-rating:
    confidence: photo-measured
    note: >-
      The inlet prints "100-240 V ~10A MAX, 50/60 Hz" beside it (photograph 1913); the brochure's range is 100 - 240 V
      and the old quick guide's nominal amperage is 13.5 A at 53 V.
  side-walls:
    confidence: drawing
    note: >-
      The drawing's side view has its rear at the left, so it is the left wall seen from the left (x = 0 is the rear
      on the left face): two fan rings 38.8 mm across at 65.1 and 105.3 mm, centred 22.3 mm down, a vent field 37.2 x
      37.0 mm at 228.6 mm and another 33.9 x 24.4 mm at 316.4 mm. The isometric and photograph 1909 show the right
      wall with a vent field at the front end; it is drawn mirrored from the left wall's, 29.7 mm from the front, and
      is estimated. The right wall's further vent field near the rear is not dimensioned and is not drawn.
  ears:
    confidence: drawing
    note: >-
      Rack ears are in the box (brochure and product page, Included: Rackmount ears (CRS), K-68 screw kit). The front
      ear plate sits at the front end of the body, so the shipped position is flush; the top plan shows no ears (443 is
      the body). The ears are not drawn. The included "rear support ears" and the cable management brackets are not
      drawn: the library has no way to say an ear at the rear, and the drawing does not dimension them.
  colour:
    confidence: photo-measured
    note: >-
      The pilot's face (#dadada) and plate (#bebebe) are carried: the photographs are rendered studio views whose
      shading differs from the pilot's straight-on photograph.
