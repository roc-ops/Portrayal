    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp, speed: 40g}
    description: the two 40G QSFP+ cages, 1 below and 2 above
  sfp-leds: {term: LED, role: indicator, index-origin: 1, description: the arrow lamps of the SFP+ and
      QSFP+ strips}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the RJ45 serial console over the 10/100 management Ethernet RJ45 at the right-hand end.
  controls: {term: Button, role: management, index-origin: 1, description: the RESET button}
  status-leds: {term: LED, role: indicator, index-origin: 1, description: the FAULT and POWER lamps}
  inlets: {term: Inlet, role: service, index-origin: 1, description: the AC inlet}
