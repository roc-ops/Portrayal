gaps:
- what: rear-elevation
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The dimensions drawing has no rear view; the rear is read off studio photographs that look down on
    it, so the y positions are estimated.
  wanted: A dimensioned rear view.
- what: rear-support-ears
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The box holds rear support ears (brochure and product page; the old quick guide's "additional adjustable
    mounting ears"); the drawing's side view shows a bracket 29.5 mm behind the body. The ear model has
    no way to say an ear at the rear, so they are not drawn.
  wanted: A way to model rear support ears, and a drawing that dimensions them.
- what: fans-three-and-four
  scope:
  - left
  - right
  reason: needs-drawing
  note: >-
    The product page and the old quick guide count four fans; the drawing shows two fan rings, in the
    left wall. No held document places the other two.
  wanted: A drawing or photograph of the other two fans.
- what: right-side-wall
  scope:
  - right
  reason: needs-drawing
  note: >-
    The drawing's one side view is the left wall; the right wall's front vent field is seen only in the
    isometric and photograph 1909, so it is drawn mirrored from the left and its position is estimated;
    the vent field near its rear is not drawn.
  wanted: A dimensioned view of the right wall.
- what: led-states
  scope:
  - front
  reason: vendor-silent
  note: >-
    Searched the brochure and the old quick guide for an LED table: none. The lamps carry the components'
    own vocabulary and no colour or meaning is stated for POWER and FAULT.
  wanted: MikroTik's LED description for the CRS354-48P.
- {what: weight, scope: [front], reason: vendor-silent, note: Neither the brochure nor the product page
    gives a weight., wanted: MikroTik's weight.}
- what: eol
  scope:
  - front
  reason: vendor-silent
  note: >-
    The saved product page carries no Discontinued badge and MikroTik publishes no end-of-life page, so
    no lifecycle is written.
  wanted: none
