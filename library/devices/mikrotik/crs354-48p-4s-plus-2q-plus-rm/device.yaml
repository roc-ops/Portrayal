  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: >-
      the 48 10/100/1000 PoE-out ports; rel-pos carries the number printed on the front, the lower jack
      of a column takes the odd number
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: the four SFP+ cages, 1 and 3 below, 2 and 4 above
