- what: fan-power-sources
  scope:
  - casa/fan@1
  reason: sources-disagree
  note: The HIG body text states "Each fan assembly module has a maximum power consumption
    of 100W, totaling 300W across the three fan assemblies". Table A-2 of the same
    guide gives the row "Fan assembly (3)" as "330W maximum, 220W typical". Both
    are about the set of three and 300 is not 330. The contract takes 100 W because
    it is the only figure stated PER MODULE, which is the granularity a bay occupant
    needs; dividing 330 by three would be our arithmetic, not the vendor's. A chassis
    total is therefore 30 W light against the guide's own set figure, and no per-module
    typical exists at all.
