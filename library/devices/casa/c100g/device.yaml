manufacturer: Casa Systems
model: C100G
portfolio:
  family: CMTS/CCAP
description: 'Casa C100G CMTS/CCAP - 13RU, 14 paired front/rear slots. Front and rear slot N are
  two halves of one logical position: a DOCSIS line card in front N requires its I/O partner in
  rear N.'
provenance:
  decor-confidence: 'EVERY PROJECTING DECOR ENTRY ON THIS CHASSIS NOW SAYS WHERE ITS
    NUMBER CAME FROM. A device''s 3D was the one place in the library that could not: a
    component gained `confidence` on every relief feature this afternoon while a chassis
    went on extruding decor with nothing attached, which is the same asymmetry one level
    up - a projection nobody sourced looks exactly like a measured one.
    ALL THIRTY ARE `estimated` AND NOT ONE IS A MEASUREMENT. The branding faceplate is the
    owner''s unaided "sticks out almost an inch" off the real chassis - a statement from
    someone holding it, which is worth more than a guess and is still not an instrument
    reading. The twenty-eight hook entries carry that same 24.0, so they are ONE estimate
    used twenty-nine times; the 2.5 plate thickness behind lift 21.5 appears in no source
    at all; and the air grille''s 60 predates the key with its origin unrecorded.
    NOTE THE VOCABULARY HAS NO TOKEN FOR AN OWNER''S UNAIDED STATEMENT, which is a
    recurring source on this platform and sits between `estimated` and `measured`. Rather
    than invent one, each source says in words what it is. Worth a token if a third
    platform needs it.'
  front-face-relief: >-
    TWO THINGS ON THIS FACE STAND PROUD AND BOTH ARE THE OWNER'S OBSERVATION, not a
    document: the branding faceplate across the top, and the row of fourteen cable
    management fingers above the slot numbers. Neither Casa guide gives a projection
    for anything, on any part - a search of both guides for the field names returns
    power, voltage, current, airflow and port counts, and no depth of anything.
    THE ONE NUMBER IS HIS: the top faceplate "sticks out almost an inch". 24.0 mm is
    that, and it is the only measurement behind either entry.
    THE FINGERS ARE HOOKS, NOT BLOCKS, and that is the owner's photograph rather than
    anyone's inference. working/photos/casa/c100g-front-isometric.png and its crop
    crop-count.png show each one as an L - a horizontal FOOT projecting forward at the
    base, with a thin vertical PLATE standing at the FRONT of that foot. Cables rest on
    the feet and are retained between the plates. A single `out` on the outline extrudes
    a solid from the panel, so the row rendered as fourteen cubes. Each is now TWO decor
    rects: the foot at full 24.0 depth, and the plate at 21.5..24.0 using the `lift` that
    decor gained for this. THE ONLY NEW NUMBER IS THE 2.5 PLATE THICKNESS, which is an
    ESTIMATE of sheet metal and is not in the photograph.
    THE COUNT IS FOURTEEN AND IT WAS RE-COUNTED, not inherited. A high-pass column scan
    of crop-count.png finds FIFTEEN objects on a pitch that widens 74 to 97 px left to
    right with perspective; the leftmost, read at 5x, is not a hook - it is the rail's
    END RETURN, square-topped and flush to the chassis side wall, and the right end
    carries the matching return with a captive screw through it. So the row is
    return + 14 hooks + return, and the fourteen already modelled are right.
    WHAT THE PHOTOGRAPH DOES NOT GIVE IS A DIMENSION, and it must not be read as though
    it did. It is a three-quarter view: every forward projection is foreshortened by an
    unknown factor and nothing of known size is in frame. It settles SHAPE, COUNT and
    ARRANGEMENT and nothing else - which is enough to turn a cube into a hook without
    touching a single magnitude.
    THE FINGERS' PROJECTION IS TIED TO THE FACEPLATE'S RATHER THAN ESTIMATED SEPARATELY. He says they stick
    out and gives no figure. Carrying the faceplate's 24.0 across is ONE estimate used
    twice, not two readings that agree - said here because fifteen decor entries now
    read 24.0 and that must not look like fifteen measurements. A cable finger may
    well project further than a bezel; nothing here says it does.
    Closed by a dimensioned side elevation. Figure 1-5 is NOT one - it is a schematic
    airflow section with no scale, and it is the only sectional view either guide has.
  chassis: 'datasheet - Table A-1 of the C100G Hardware Installation Guide (rev 07/08/2022): 22.5in
    (571mm) H, 19in (482mm) W, 15.25in (386mm) D, 13RU'
  slots: datasheet - 14 module slots front and rear, SMM in front 6 and 7
  slot-pitch: drawing - 426.6mm card region from Fig 1-1 over 14 slots = 30.47
  card-height: drawing - Figure 1-1 puts the card band between the slot-number strip at 18.9 percent
    and the FILTER band at 79.4 percent of chassis height, so 108.1 to 453.5, a 345.5 card. An earlier
    440 was wrong and made the cards overrun the space above
  configurations: datasheet - the redundancy layouts are stated per scheme in Chapter 3 (Remote
    PHY) and Chapter 4 (BDM)
  smm-slots: datasheet - front 6 and 7 take the SMM. Modelled with the 8x10GigE variant (Fig 1-8);
    the guide also lists SMM 2x10GE, SMM 300G and SMM 300Gm, which are further skins or components
    when needed
  bands: drawing - front is air baffle above (0 to 108.1), cards, then FILTER (453.5) and the fan
    tray below. Rear is fan assemblies above (0 to 105.9), cards, then two power entry modules from
    491.4. Fig 1-1 and Fig 1-2
  card-aspect: NOTE - the isolated card figures (1-14, 1-15, 1-8) are drawn NARROWER than the real
    card. Their faceplate aspect is 13.26; the chassis front view gives 345.5 by 30.46 = 11.34,
    about 17 percent wider. Port positions taken from those figures are therefore used as FRACTIONS
    of the faceplate and stretched to this width, not as absolute geometry
  width: 'Table A-1 quotes 19in / 482, which is the rack face INCLUDING the mounting ears. Jason
    confirmed from a real chassis that the ears sit outside the body and that there is only a 1/8in
    (3.175mm) flange either side of the cards. Working back: the card region measures 426.6 in Fig
    1-1, so the BODY is 426.6 + 2x3.175 = 432.95, and the ears must protrude 24.5 each side to reach
    482. Drawn as the body only - the ears are deliberately omitted for now and can be added as
    their own part'
  airflow: Jason - air is drawn in at the rear, passes behind and through the cards, and exhausts
    at the FRONT bottom. So the grille below the filter is the fan EXHAUST, not an intake, and it
    is a coarse wire grille rather than perforation
  rear-slots: 'datasheet - C100G rear side (11+1) in Chapter 4, verbatim: slots 0-4 6+12 IO or IO2;
    slot 5 LC-BDM-SWITCH for BDM line module redundancy; slots 6 and 7 SMM-SW-BDM-A and -B respectively,
    with the guide noting that correct slot positions are indicated on the module faceplates; slot
    8 6+12 SW-IO or SW-IO2, non-redundant under 11+1; slots 9-13 6+12 IO or IO2'
  rear-order: 'Jason - the rear slot order is MIRRORED. Rear N connects to front N, so viewed from
    the back the numbering runs right to left: rear 0 sits directly behind front 0, which is on
    the far side when you walk round. Rear bay x is therefore FL + (13 - N) * pitch, not FL + N
    * pitch'
  front-furniture: photograph + drawing - the top is a sloped shroud carrying the casa systems mark
    and the model, with a row of card-guide tabs along its lower lip, then the black slot-number
    strip. Numbers run 0 to 13 with 6 and 7 in RED, which is how both the product photo and Fig
    1-1 mark the SMM pair
  captions: 'the HIG has no "Ground Strap" text anywhere - it says ESD strap receptacle,
    21 times - and no "Cable Manager" text either. Both were the modeller naming parts, so
    both have moved out of silkscreen[] (ink on the metal) into regions (author annotation),
    carrying the vendor word rather than the invented one. Fan L/C/R and Grounding Studs on
    the rear were the same species and were held back one pass for want of a rear photograph,
    since they sit beside PEM A/PEM B, which a rear panel plausibly does print. Owner
    confirmed 2026-08-25 that they are NOT printed, so they are regions too. PEM A and PEM B
    stay in silkscreen: they were not part of that question and nothing says they are absent
    from the metal'
  side-faces: 'drawing plus a stated absence. NO FIGURE IN THE GUIDE SHOWS THESE
    FOUR FACES - Figures 1-1 and 1-2 are the front and rear, 1-5 is an airflow cross-section,
    and 2-6 and 2-7 are rack elevations. So they are sized from Table A-1 ("Height:
    22.5 in. (571 mm), Depth: 15.25 in. (386 mm)"; the table''s 19 in / 482 mm width
    is the RACK face INCLUDING the mounting flanges, so the 432.95 body width the
    chassis block already carries is used instead), and they carry only what the
    guide states is on them. That is: the mounting flanges, which the guide calls
    integral - "Integrated mounting flanges are included with the chassis" - and
    fixes at four screws per side, since "You must provide the eight screws that
    attach the CMTS to the rack"; and the chassis label, which the guide locates
    precisely at "The C100G product label is affixed to the top front side of the
    chassis". The flange is integral and runs the full height at the FRONT edge,
    so it shows on every face that meets that edge - top, bottom, left and right
    - which is why the same strip appears on all four rather than being decoration
    invented per face. Orientation convention: top and bottom put the chassis front
    at y = 0, left puts it at x = 0, and right mirrors it to x = depth. NOTHING
    ELSE IS DRAWN ON THESE FACES, deliberately. The bottom is bare beyond the flange
    because the guide says nothing about it except "grab the bottom of the chassis"
    when lifting - no feet, no vents, no label. No top or bottom vents are drawn
    either: the guide and Jason disagree about which way the air goes (see the airflow
    entry), but both readings are front-to-rear or rear-to-front, and neither puts
    an opening on these two faces. An invented top plate would be the wrong-box
    outcome these four views exist to prevent'
  switch-slot-print: 'drawing - a free check that PASSES, and it comes off the
    card rather than off the chassis. Figure 1-14 of this guide, "BDM module, SMM
    Switch BDM A, B, and LC Switch BDM", draws the two SMM Switch faceplates with
    their slot assignments PRINTED ON THE PLATE: A reads "C100G Slot 6 / C40G
    Slot 2" and B reads "C100G Slot 7 / C40G Slot 3". rear-6 accepts
    casa/smm-sw-bdm-a@1 and rear-7 accepts casa/smm-sw-bdm-b@1, which is what the
    silkscreen says. This is better evidence than the slot list it agrees with:
    a chassis drawing can be redrawn wrongly, but a part that names its own slot
    on its own face is the vendor committing twice'
  protecting-slots: 'SETTLED, and the manifest was half wrong. The protecting
    rear slots take a DIFFERENT card in each redundancy scheme, and only one of
    the two was modelled. In the BDM 11+1 scheme the guide lists "Slot 5 - LC-BDM-SWITCH"
    and "Slot 8 - 6+12 SW-IO or 6+12 SW-IO2 (Slot 8 is non-redundant with 11+1 redundancy)",
    which is what bdm2m-11plus1 already had. In the classic scheme Table A-2 puts
    an LC Switch in BOTH - its RFS row reads "LC Switch in rear slots 5 and 8, SMM
    Switch in rear slots 6 and 7" - and docsis-classic was silent on rear-8, so
    it inherited the bay default and quietly showed a switched I/O where the classic
    scheme has a switch. Its own description had said "with LC Switch behind both"
    the whole time. Both cards are now in rear-8s accepts because both are cited,
    and each configuration names the one its own scheme uses'
  slot-compatibility: 'drawing - Table A-2, "C100G capacities", states it directly
    rather than leaving it to be inferred: "14 line card slots on front - 1 Switch
    and Management (SMM) module, 1 SMM redundant module, 12 DOCSIS modules (any
    combination of DS and US modules)". front-6 and front-7 are the SMM pair, which
    the guide fixes elsewhere at "full redundancy between chassis slots 6 and 7";
    the other twelve take the DS and US cards, and "any combination" is a real statement
    that every one of the twelve takes every DS and US card, so it is modelled as
    it reads. The CSC is placed by slot number in its own right - "the CSC 8x10G
    can occupy up to twelve slots on the C100G platform (using slots 0-5 and 8-13
    for up to 96 ports)" - which is exactly the same twelve. Blank face plates go
    in any unpopulated slot, front or rear: "Ensure that all unpopulated slots have
    the blank faceplate installed". Table A-2''s rear half is deliberately NOT widened
    - "14 RF I/O slots on back - 0 to 4 RF I/O switch cards for DOCSIS-module redundancy
    in rear slots 5 and 8, remaining 10 slots available for RF I/O cards" - so front
    cards stay out of rear bays, which the existing rear accepts lists already respect.
    Bay defaults are unchanged; this widens only what each bay is DECLARED to take'
attrs:
  physical:
    weight: 132 lb / 61.23 kg fully loaded
  power:
    power-max-w: '3600'
    power-envelope: fully-configured
    ac-input-provisioning: 3600 W across three 120 VAC inputs (4800 W over four
      recommended), or 4000 W across two 240 VAC inputs. This is SUPPLY to be
      provisioned, not draw - the 4000 W is what two 240 V feeds come to, and is
      not a consumption figure
    psu-dc-input: -42 to -60 VDC, 20 A nominal per feed at -48 VDC
