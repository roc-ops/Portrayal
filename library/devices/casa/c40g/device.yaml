name: c40g
version: 0.1.0
maturity: modelled
manufacturer: Casa Systems
model: C40G
portfolio:
  family: CMTS/CCAP
description: Casa C40G CMTS/CCAP - 6RU, 6 paired front/rear slots. Takes the same line cards as
  the C100G but HORIZONTALLY, so the card is one model placed at rotate 90.
provenance:
  chassis: 'datasheet - Table A-1 of the C40G Hardware Installation Guide (rev 07/07/2022): 10.47in
    (265.90mm) H, 19in (482mm) W, 15.25in (388.45mm) D, 6RU'
  width: body 432.95, the same as the C100G - both are 19in rack devices and the ears sit outside
    that. See the C100G provenance for the derivation
  orientation: Jason, confirmed against Fig 1-1 - the C40G takes the SAME line cards as the C100G
    but on their side, so every bay is rotate 90
  slot-order: drawing + photograph - slots run 5 at the TOP down to 0 at the bottom, printed on
    the chassis, with 3 and 2 in red as the SMM pair
  rear-order: NOT mirrored, unlike the C100G. Walking round a chassis flips left to right, not top
    to bottom - and these cards stack vertically, so rear 5 stays at the top where front 5 is
  rear-slots: photograph - a C40G rear shows plain 6+12 I/O in slots 0 and 5, the 6+12 SW I/O in
    slot 4, and SMM-SW-BDM B and A in 3 and 2. Slot 1 takes the LC-BDM-SWITCH that protects, per
    the 3+1 scheme
  front-furniture: 'drawing-measured - Figure 1-1, "Casa C40G CMTS front view",
    PASSES the orthographic gate. Its chassis renders 1364 x 760 px for an aspect
    of 1.795 against a true rack face of 482 / 265.9 = 1.813, agreeing to 1 percent,
    so unlike the isolated card figures it carries geometry - at 2.858 px/mm scaled
    by the exactly known 265.9 height. Measured off it in body coordinates: the
    two vertical fan strips at x 1.5-37.5 and 386.7-422.7, both running y 17-222;
    the card band x 37.5-386.4, which independently confirms the existing card bays
    at x 42.0 width 345.5; the brand band y 196.3-222.9; and the snap-on PSU cover
    y 226.7-264.9. The right fan bay is trimmed to start at x 388.0 so it does not
    overlap the card bays, which end at 387.5'
  fan-modules: 'drawing - Figure 1-7, "C40G fan module location and directional
    air flow", settles which side is which and it is NOT symmetric. The RIGHT strip
    is labelled "System fan module" and "Air filter" with "Air flow direction IN";
    the LEFT strip is labelled "Secondary fan module slot (optional with redundancy
    kit)" with "Air flow direction OUT". So fan-right defaults to a module and fan-left
    defaults to empty, which is what a chassis without the redundancy kit actually
    looks like. Both strips carry the same FAN TRAY 2 / FAN TRAY 1 / AIR FILTER
    legend printed on the CHASSIS, which is why an empty left slot still shows it
    in the guide figures'
  power-entry: 'drawing-measured - Figure 1-4, "C40G CMTS rear view (DC; non-redundant)",
    scaled by the known 265.9 height at 2.982 px/mm. The two PEM faces read x 44.8-195.7
    and 212.8-377.7 and the band runs y 194-264.5. They are bays and not placements
    because the guide carries both "Removing the DC power entry modules" and "Replacing
    the PEMs" and they slide into openings. NOTE THE VARIANT SPLIT: this is the
    DC chassis. The C40G also ships AC, with four removable 1100 W PSUs behind the
    snap-on front cover instead of these two PEMs, drawn in Figures 1-2 and 1-3.
    The AC variant is NOT modelled - it wants its own configuration and its own
    PSU component, and inventing either from the DC figures would be guessing'
  side-faces: 'drawing plus a stated absence, exactly as on the C100G. NO FIGURE
    IN THIS GUIDE SHOWS THE TOP, BOTTOM OR SIDE FACES either - Figures 1-1 through
    1-5 are front and rear elevations and 1-7 is an airflow diagram. So the four
    are sized from Table A-1 ("Height: 10.47 in. (265.90 mm), Depth: 15.25 in. (388.45
    mm)"; its 19 in / 482 mm width is the rack face including the flanges, so the
    432.95 body width is used) and carry only the integral mounting flanges and
    the chassis label, which the guide locates in the same words the C100G guide
    uses - "The C40G product label is affixed to the top front side of the chassis".
    Orientation matches the C100G: top and bottom put the front at y = 0, left puts
    it at x = 0, right mirrors it. NO SIDE VENTS ARE DRAWN, deliberately, and this
    is the judgement call worth flagging. Air goes right to left through this chassis,
    so the side panels are a plausible place for an intake and an exhaust - but
    the filter the guide describes is on the FAN MODULEs own face ("Figure 1-9 shows
    the air filter side of the fan module"), the fan modules are inserted from the
    front, and no figure shows an opening in either side panel. Drawing vents on
    a guess is the wrong-box outcome these views exist to prevent'
  protecting-slots: 'SETTLED, and the same half-fault as the C100G. The guide
    numbers this one twice over. For the classic scheme the chassis overview reads
    "Rear slots (fully redundant system) - Upstream and downstream line card I/O
    slots: 0, 5; LC Switch slots: 1, 4; SMM Switch slots: 2, 3", Table A-2 agrees
    with "Two LC Switch modules for DOCSIS-module redundancy in rear slots 1 and
    4", and Figure 1-5, the rear view OF THAT EXACT LAYOUT, is legible at 4x: slots
    5 to 0 read QAM IO, LC SWITCH, SMM SWITCH, SMM SWITCH, LC SWITCH, US IO. So
    rear-4 is an LC Switch in the classic scheme, and docsis-classic said so in
    its description while placing a switched I/O. For the BDM scheme the guide is
    equally explicit - "C40G rear side (3+1): Slot 1 - LC-BDM-SWITCH; Slot 4 - 6+12
    SW-IO or 6+12 SW-IO2" - so bdm-3plus1 was right and is unchanged. rear-4 accepts
    both, and each configuration names its own'
  slot-compatibility: 'drawing - the C40G guide numbers its own slots twice. The
    chassis overview lists "Front slots - Upstream and downstream line card slots:
    0, 1, 4 5; Active and standby SMM slots: 2 and 3", and Table A-2, "C40G capacities",
    agrees: "6 line card slots on front - 1 Switch and Management (SMM) module,
    1 SMM redundant module, 4 DOCSIS modules (any combination of DS and US modules)".
    So front-2 and front-3 take the SMM generations and the other four take every
    DS and US card, "any combination" being a real statement modelled as it reads.
    Table A-2''s DQM row names DS8x8, DS8x96 and DS8x192 and its DCU row names US16x4
    and US16x8, so all five are eligible here even though THIS guide''s Tables A-3
    and A-4 print power for only three of them - the C100G guide carries the other
    two. The CSC is placed by its data sheet, "The C40G can house 4 CSCs for a maximum
    of 32 ports", which is the same four slots. The rear is deliberately NOT widened:
    the same overview puts LC Switch in rear 1 and 4, SMM Switch in rear 2 and 3,
    and I/O cards in the rest, and it is the only place either guide says where
    blank filler plates go by number - "Rear slots (non-redundant system) - Blank
    filler plates: 2, 3". Bay defaults are unchanged'
attrs:
  power:
    power-max-w: '1800'
    power-envelope: fully-configured
  other:
    redundancy: 3+1 with BDM (slot 1 protects, slot 4 active); classic DOCSIS protects per side at 1 and
      4
