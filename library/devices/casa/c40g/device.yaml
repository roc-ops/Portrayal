configurations:
  bdm-3plus1:
    description: 'BDM "3+1". Redundancy collapses to a single protecting slot: rear 1 takes the LC-BDM-SWITCH,
      and rear 4 takes a combined 6+12 SW-IO which frees slot 4 to carry traffic.'
    default: true
    bays:
      front-0: casa/bdm2m@1
      front-1: casa/bdm2m@1
      front-2: casa/smm-8x10g@1
      front-3: casa/smm-8x10g@1
      front-4: casa/bdm2m@1
      front-5: casa/bdm2m@1
      rear-0: casa/io-6p12@1
      rear-1: casa/lc-sw-bdm@1
      rear-2: casa/smm-sw-bdm-a@1
      rear-3: casa/smm-sw-bdm-b@1
      rear-4: casa/io-6p12-sw@1
      rear-5: casa/io-6p12@1
  docsis-classic:
    description: Classic DOCSIS. Redundancy is per side - front/rear 1 and 4 - with an LC Switch behind
      both.
    bays:
      front-0: casa/bdm@1
      front-1: casa/bdm@1
      front-2: casa/smm-8x10g@1
      front-3: casa/smm-8x10g@1
      front-4: casa/bdm@1
      front-5: casa/bdm@1
      rear-0: casa/io-6p12@1
      rear-1: casa/lc-sw-bdm@1
      rear-2: casa/smm-sw-bdm-a@1
      rear-3: casa/smm-sw-bdm-b@1
      rear-4: casa/lc-sw-bdm@1
      rear-5: casa/io-6p12@1
# What no rule can find, because the manifest looks complete. Both bays are
# populated, both components render, and nothing in the model can see that the
# only power figure the vendor publishes for them is a single number covering
# the two of them together. Detectable gaps are derived from the lint rules at
# build time and must not be listed here.
gaps:
- what: paired-module-power
  scope: [casa/bdm2m@1, casa/io-6p12@1, casa/io-6p12-sw@1, casa/rfd@1, casa/rfu-16x8@1, casa/ups-32x4@1]
  reason: vendor-silent
  note: >-
    The BDM2/BDM2m datasheet states "Total Power  300 W" in a technical
    specifications table headed "BDM2/2 m with 6+12 IO Card", whose RF connector
    row describes that card's six downstream and twelve upstream ports. The
    figure is the assembly's. A BDM position is TWO modules here - casa/bdm in a
    front bay and casa/io-6p12 in the paired rear bay, which is why casa/bdm
    already carries `pairs-with` - and no document we hold divides the 300 W
    between them. Writing it onto the front module would make the chassis total
    come out right and the answer to "what does a BDM front module draw" come
    out wrong, so neither half carries a figure and the chassis total stays a
    floor. The arithmetic does not settle it either way: 12 x 300 W lands on the
    C100G's stated 3.6 kW whether the 300 W is the pair or the front half with
    small rear cards.
    THE THREE REAR RF I/O CARDS ADDED LATER FALL ON THE SAME SIDE OF THIS AS THE
    6+12. casa/rfd, casa/rfu-16x8 and casa/ups-32x4 carry NO power figure,
    because Tables A-8 and A-9 give their port counts and connector types and no
    watts at all, and every figure Casa does publish for the slot is already the
    pair's - Table A-3 heads the DQM column "Maximum consumption with I/O
    module" and Table A-4 gives "Single DCU w/ RFU I/O" 200 W against "Single
    DCU w/ RFU UPS 32x4 I/O" 220 W for the same US16x8. Subtracting one from the
    other to get a rear card's share would be our arithmetic and would also be
    the wrong subtraction - the 20 W is the difference between two PAIRINGS, not
    between two I/O cards.
  wanted: >-
    a pairable unit that can carry properties, so that a figure measured on a
    pair can be attached to the pair. The scope is now DATA - every card here
    declares `power-draw-scope: module-with-paired-io`, so a chassis sum knows
    not to add the rear partner and L30 catches it if one gains its own figure -
    but the scope says only THAT the figure covers a pair, not WHICH pair. The
    C100G HIG gives the same US16x8 200 W with the RFU I/O and 220 W with the
    RFU UPS 32x4, and the manifest can carry only one of them. Asking for "a
    per-module figure" was the wrong question: Casa states none, and one may not
    exist to be divided out. What is missing is the mechanism, and enough
    vendors doing this to design one from - Casa is the only one in the corpus.
