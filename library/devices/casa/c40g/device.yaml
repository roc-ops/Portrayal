configurations:
  base:
    kind: base
    source: >-
      derived - built from the group roles rather than from a vendor bundle: every bay
      whose group is `service` or `management` keeps its seat, every `traffic` bay takes
      a blank. This vendor publishes no base configuration for this chassis, so the
      library defines one. Where a vendor DOES publish one, follow it instead and say so
      here.
    default: true
    description: >-
      Chassis only - what you spec before deciding what goes in it. The 12 slot bays are
      EMPTY; cooling, power are populated. Enough to power on and reach the box, which
      is the question most people ask first and the one `default` used to answer with
      whatever the drawing happened to be populated with.
    bays:
      front-0: casa/blank-faceplate@1
      front-1: casa/blank-faceplate@1
      front-2: casa/blank-faceplate@1
      front-3: casa/blank-faceplate@1
      front-4: casa/blank-faceplate@1
      front-5: casa/blank-faceplate@1
      rear-0: casa/blank-faceplate@1
      rear-1: casa/blank-faceplate@1
      rear-2: casa/blank-faceplate@1
      rear-3: casa/blank-faceplate@1
      rear-4: casa/blank-faceplate@1
      rear-5: casa/blank-faceplate@1
  ac-power:
    kind: orderable
    source: >-
      vendor - CommScope C40G data sheet, C40G_DS_RevA (2024), ORDERING INFORMATION.
      Supplied by the library owner with the sheet it came from.
    description: AC power. Four 1100 W PSUs in a row across the bottom front behind the snap-on
      cover, instead of the two DC power entry modules at the bottom rear. Redundancy is
      unchanged - this axis is orthogonal to the BDM and classic schemes, and the guide draws
      the rear both ways (Figures 1-2 and 1-3 AC, 1-4 and 1-5 DC).
    part-numbers:
      C40G-CHASSIS-AC: {part: C40G-CHASSIS-AC}
    bays:
      psu-1: casa/c40g-psu-ac@1
      psu-2: casa/c40g-psu-ac@1
      psu-3: casa/c40g-psu-ac@1
      psu-4: casa/c40g-psu-ac@1
  dc-power:
    kind: orderable
    source: >-
      vendor - CommScope C40G data sheet, C40G_DS_RevA (2024), ORDERING INFORMATION.
      Supplied by the library owner with the sheet it came from.
    description: >-
      DC power. The two power entry modules at the bottom rear, where the AC chassis carries
      its inlet panel. THIS EXISTS TO CARRY A SKU THAT THE OTHER CONFIGURATIONS COULD NOT:
      the ordering sheet sells the chassis by power feed, and the three DOCSIS configurations
      happen to be drawn DC because their figures are, which made a line-card population the
      only place a power part number could have gone. It draws no cards for the same reason
      `ac-power` draws none - the power feed is orthogonal to what is in the slots.
    part-numbers:
      C40G-CHASSIS-DC: {part: C40G-CHASSIS-DC}
  bdm-3plus1:
    kind: example
    description: 'BDM "3+1". Redundancy collapses to a single protecting slot: rear 1 takes the LC-BDM-SWITCH,
      and rear 4 takes a combined 6+12 SW-IO which frees slot 4 to carry traffic.'
    bays:
      front-0: casa/bdm2m@1
      front-1: casa/bdm2m@1
      front-2: casa/smm-8x10g@1
      front-3: casa/smm-8x10g@1
      front-4: casa/bdm2m@1
      front-5: casa/bdm2m@1
      pem-1: casa/c40g-pem@1
      pem-2: casa/c40g-pem@1
      rear-0: casa/io-6p12@2
      rear-1: casa/lc-sw-bdm@1
      rear-2: casa/smm-sw-bdm-a@1
      rear-3: casa/smm-sw-bdm-b@1
      rear-4: casa/io-6p12-sw@2
      rear-5: casa/io-6p12@2
  docsis-classic:
    kind: example
    description: Classic DOCSIS. Redundancy is per side - front/rear 1 and 4 - with an LC Switch behind
      both.
    bays:
      front-0: casa/bdm@1
      front-1: casa/bdm@1
      front-2: casa/smm-8x10g@1
      front-3: casa/smm-8x10g@1
      front-4: casa/bdm@1
      front-5: casa/bdm@1
      pem-1: casa/c40g-pem@1
      pem-2: casa/c40g-pem@1
      rear-0: casa/io-6p12@2
      rear-1: casa/lc-sw-bdm@1
      rear-2: casa/smm-sw-bdm-a@1
      rear-3: casa/smm-sw-bdm-b@1
      rear-4: casa/lc-sw-bdm@1
      rear-5: casa/io-6p12@2
  docsis-non-redundant:
    kind: orderable
    description: 'Non-redundant chassis. The guide: "The Casa C40G chassis is available in both
      redundant and non-redundant versions." There are no switch modules at all - rear 2 and 3
      carry blank filler plates where the redundant schemes carry the SMM Switch pair, and rear
      1 and 4 carry I/O rather than an LC Switch. Front DS cards pair with QAM IO behind them
      and front US cards with US IO, which is the classic split architecture rather than the
      BDM one.'
    bays:
      front-0: casa/us-16x8@1
      front-1: casa/us-16x8@1
      front-2: casa/smm-8x10g@1
      front-3: casa/smm-8x10g@1
      front-4: casa/ds-8x96@1
      front-5: casa/ds-8x96@1
      pem-1: casa/c40g-pem@1
      pem-2: casa/c40g-pem@1
      rear-0: casa/rfu-16x8@1
      rear-1: casa/rfu-16x8@1
      rear-2: casa/blank-faceplate@1
      rear-3: casa/blank-faceplate@1
      rear-4: casa/rfd@1
      rear-5: casa/rfd@1
# What no rule can find, because the manifest looks complete. Both bays are
# populated, both components render, and nothing in the model can see that the
# only power figure the vendor publishes for them is a single number covering
# the two of them together. Detectable gaps are derived from the lint rules at
# build time and must not be listed here.
gaps:
- what: redundant-power-and-cooling-variants
  scope: [ac-power, dc-power, power, fans]
  reason: vendor-silent
  note: >-
    THE ORDERING SHEET SELLS FOUR CHASSIS AND THIS LIBRARY MODELS TWO. C40G_DS_RevA
    lists C40G-CHASSIS-AC and C40G-CHASSIS-DC, which are here, and C40G-CHASSIS-ACR
    and C40G-CHASSIS-DCR, described as "with Redundant Power and Cooling", which are
    not. The sheet gives the phrase and nothing else - no count, no which modules, no
    dimensions - and the installation guide never uses the word for a chassis variant.
    What the guide DOES say is that the C40G takes up to four 1100 W PSUs operating
    concurrently and that fewer than two cannot power a C40G-20, which tells you the
    supplies are redundant by population rather than by chassis. That makes the R
    variants most likely a populated bundle rather than different metal - but "most
    likely" is not a source, and inventing two configurations from a four-word
    description would put a guess where a part number goes.
  wanted: >-
    a Casa or CommScope ordering guide saying what the R bundles contain - how many
    PSUs and fan modules, and whether the chassis itself differs at all
- what: ground-stud-count
  scope: [ground-studs-rear]
  reason: sources-disagree
  note: >-
    Casa says two things about this terminal and they do not agree. The prose in
    "Connecting the chassis to ground" says it "provides two M6 screws to connect a
    double-lug ground terminal cable". Figures 1-2 and 1-4 both DRAW three studs, in a
    2x2 grid with the protective-earth mark in the fourth corner, and the two figures
    agree with each other.
    THE DRAWING IS FOLLOWED, and the model carries three. The figure is the only source
    that says anything about arrangement at all, so following the prose would mean
    inventing a layout for the two it describes; and a third stud has easy explanations
    - a spare, an alternate lug pitch - while a stud drawn twice that is not there has
    none. That is a judgement, not a reading, which is why it is filed here.
    THE PITCH IS NOT MEASURED FROM EITHER. It is borrowed from casa/ground-bolts@1,
    15.3, off Jason`s hand-built C100G rear SVG. Figure 1-4 gives 13.2 across and 14.7
    down for what must be one square grid - an 11 percent disagreement with itself,
    which is that figure`s anisotropy rather than a rectangular pattern.
  wanted: a photograph of the C40G rear lower-left corner, which would settle the count
    and the pitch together in one look
  blocks: []
- what: band-not-centred-in-chassis
  scope: [front, rear]
  reason: needs-drawing
  note: >-
    The card band runs 37.5 to 386.7 in a body 432.95 wide, so it sits 37.5 from the left
    edge and 46.25 from the right - 8.75 mm out of centre, or 4.375 on the band's own
    centreline. Everything inside the band agrees with everything else; the question is
    whether the band is really off-centre in the metal, and nothing we hold answers it.
    IT IS NOT COSMETIC, and the AC input panel is where it bites. Its four C14 inlets sit
    behind the four front power supplies. Reflect the supply centres about the PANEL and
    the inlets are 1.2 out; reflect them about the CHASSIS - which is what walking round a
    box actually does - and they are 9.95 out. The gap between those two answers IS this
    asymmetry, and no arrangement of the parts inside the band can close it, because the
    disagreement is between the band and the chassis rather than within either.
    THE SUPPORTING NUMBERS ARE ALSO ODD IN THE SAME DIRECTION. The two front fan strips
    measure 36.0 wide each - equal, as you would expect - but leave 1.5 outside them on the
    left and 10.25 on the right. Two equal strips with unequal surrounds is exactly the
    shape of a band that has been positioned from one edge.
    NOT RESOLVED BY GUESSING, deliberately. Re-centring the band would move the two fan
    strips, the card bays on both faces, the PSU row, the PSU cover and the AC panel - and
    it would be one estimate reconciled against another, which this device's
    `pem-band-top-edge` note already records going wrong twice in opposite directions.
  wanted: a dimensioned C40G front or rear elevation from Casa, or a tape measure across a
    real chassis from its left edge to the first card slot and from the last card slot to
    its right edge
  blocks: []
- what: pem-band-top-edge
  scope: [pem-1, pem-2]
  reason: needs-drawing
  note: >-
    The PEM band's BOTTOM edge at 264.5 is agreed by every source and is not in doubt. Its TOP
    edge is known only to about 2 mm, and the three candidates each have support: 194.0 is the
    direct reading of Figure 1-4 and is impossible, because the card slot above ends at 194.82;
    194.82 is flush against that slot; 196.0 is what the bays carry and is what the manifest now
    uses, on the argument that 194.82 is an accumulation of six DERIVED slot pitches (426.6 mm
    over 14 slots on the C100G, carried across) and that the front face shows a measured 1.48 mm
    margin in the equivalent position. That argument is sound but it is an argument, not a
    measurement, and the whole disagreement is six pixels at 2.982 px/mm. A tape measure on a real
    C40G, or any Casa drawing that dimensions the rear panel, would settle it in one number.
    FIGURE 1-12 HAS NOW BEEN LOOKED AT AND DOES NOT SETTLE IT, recorded so nobody spends the
    search twice. "C40G power entry module" is the only isolated drawing of this part and the
    first independent look anything has had at it. Its body measures 866 x 381 px for an aspect of
    2.273. The modelled 158.0 x 68.5 is 2.307 and the superseded 158.0 x 70.5 is 2.241, and 2.273
    lands 0.04 percent off the midpoint of those two - at 158.0 wide it implies a height of 69.51.
    IT IS EQUIDISTANT AND CONFIRMS NEITHER. This guide's isolated part drawings are in any case
    demonstrably about 10 percent wrong about their own aspect - Figure 1-20 draws a card at 12.54
    whose real aspect is 11.34 - so a 1.5 percent lean is well inside the drawing's own error. THE
    NUMBER IS THEREFORE NOT MOVED. It has been moved twice already, in both directions, and a
    third move on evidence that splits the difference would be the reconciliation loop rather than
    an escape from it. What Figure 1-12 does confirm is the ARRANGEMENT, which is what a figure is
    good for: a bolted terminal cover across the top with three fasteners, a minus pair of studs
    above a plus pair inside two outlined blocks, two release levers standing proud of the body
    top and bottom, and the yellow disconnect-power label to their right - all of which
    casa/c40g-pem draws.
    RECORDED BECAUSE THE MODULE AND THE BAY NOW AGREE, which means nothing will ever flag this
    again - the fit check that found the original 2 mm discrepancy is satisfied by both being
    wrong together as easily as by both being right.
  wanted: a dimensioned C40G rear elevation, or a tape measure on the PEM opening
- what: paired-module-power
  scope:
  - casa/bdm2@1
  - casa/bdm2m@1
  - casa/bdm@1
  - casa/ds-8x192@1
  - casa/ds-8x8@1
  - casa/ds-8x96@1
  - casa/io-6p12-io2@1
  - casa/io-6p12-sw-io2@1
  - casa/io-6p12-sw@2
  - casa/io-6p12@2
  - casa/rfd@1
  - casa/rfu-16x8@1
  - casa/ups-32x4@1
  - casa/us-16x4@1
  - casa/us-16x8@1
