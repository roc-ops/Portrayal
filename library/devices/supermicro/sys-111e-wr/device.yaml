format: 1
kind: device
name: sys-111e-wr
version: 2.0.1
maturity: modelled
manufacturer: Supermicro
model: SuperServer SYS-111E-WR
description: >-
  Supermicro's 1U single-socket WIO rack server for 4th and 5th generation
  Intel Xeon Scalable processors: ten front hot-swap 2.5 inch bays, the
  control panel and two USB ports beside them, and at the rear two 860 W
  redundant supplies, the X13SEW-F board's serial, BMC, USB, two 1GbE and VGA
  ports, and three PCIe 5.0 slots on two risers - two full-height full-length
  and one low-profile.
profile: server
provenance:
  sources:
    confidence: datasheet
    note: >-
      Read for this model: Supermicro's product page for the SYS-111E-WR
      (supermicro.com/en/products/system/wio/1u/sys-111e-wr) and its two-page datasheet,
      for dimensions, weight, ports, slots, power supply and environmentals; the User's
      Manual MNL-2490 revision 1.0d, for the front, control panel and rear figures, LED
      tables, slot and riser descriptions and Appendix B; the quick reference guide
      QRG-2490; the Lot 9 addendum to the manual; the X13SEW motherboard manual
      MNL-2413; and two near straight-on photographs from StorageReview's review of the
      server - the front
      (storagereview.com/wp-content/uploads/2023/03/StorageReview-Supermicro-Sys-111E-WR-7.jpg,
      1200 x 698) and the rear
      (storagereview.com/wp-content/uploads/2023/03/StorageReview-Supermicro-Sys-111E-WR-6.jpg,
      1200 x 677). EVERY SUPERMICRO IMAGE OF THIS SERVER IS A PERSPECTIVE VIEW WITH
      CALLOUTS (product page, datasheet, manual figures 1-1 and 1-3, 960 x 720 at most);
      they are read for what is on each face and in what order, never for position. No
      vendor 3D model is on the product page, and NetBox's devicetype-library has no
      entry for this model or its chassis.
  chassis:
    confidence: datasheet
    note: >-
      Product page, datasheet and manual Appendix B agree: 1.7 x 17.2 x 23.5 in, 43 x
      437 x 597 mm, 1U, chassis CSE-116BTS-R000WNP. 437 is the body between the ear
      folds, which is how both photographs measure, so it is the body and not the rack
      face. No document says what the depth runs between.
  ears:
    confidence: photo-measured
    note: >-
      THE EARS ARE NOT DRAWN. On the front photograph each ear with its handle runs
      about 38 px outside the fold, 18.5 mm, 474 mm ear to ear at the body's scale. The
      control panel and both front USB ports sit on the body, not the ears.
  gate-1-front:
    confidence: photo-measured
    note: >-
      The front photograph passes the panel gate only loosely. The body between the ear
      folds is 894 px for 437 mm, 2.046 px/mm across; top to bottom it is about 88 px
      for 43 mm, 2.05 px/mm, but the camera is slightly above the server and the top
      edge of the face is soft against the lid, so the height is good to two pixels, 2%.
      Positions across are read at 2.046 px/mm; positions down are read at the same
      scale from the top edge at 338 px and are the softer figures. The five drive
      columns are a check on the across scale: they start at 150.75, 314.5, 479.5, 644.5
      and 810.75 px, steps of 163.75, 165, 165 and 166.25 - an even 165 px, 80.65 mm.
  gate-1-rear:
    confidence: photo-measured
    note: >-
      The rear photograph is the same kind of image: the body is 889 px across for 437
      mm, 2.034 px/mm, and about 87 px down from 348 px. Two known sizes check it: each
      power supply measures 53.5 x 39.3 mm for the product page's 54.5 x 40.25, and the
      two full-height slot plates centre 19.9 mm apart for the standard's 20.32.
      Positions are good to about a millimetre across and a little worse down.
  front:
    confidence: photo-measured
    note: >-
      Ten hot-swap bays in five columns of two, columns starting at 1.3 on an 80.65
      pitch, rows at 10.3 and 27.3, each seating a 76.0 x 14.0 tray. Above them a strip
      of vent slots, 1.4..5.8 down, seven to a column, with the pull-out tag in place of
      the first five over column 1. Right of the drives, from 401.5, the control panel
      (lamps 8.1 down, buttons 18.4 down) and under it two USB 3.2 ports one above the
      other, centred at (418.6, 28.5) and (418.6, 36.6). The vent slot widths are read
      at 2 px/mm and are approximate.
  drive-numbering:
    confidence: datasheet
    note: >-
      Product page and datasheet front view, and the quick reference guide: bays 0 to 9,
      the lower bay of each column even and the upper odd, left to right - 1 over 0, 3
      over 2, up to 9 over 8. The group is numbered from 0 as Supermicro numbers it.
      Nothing is printed on the metal beside the bays that the photograph resolves, and
      the photograph does resolve the 1.3 mm digits under the control panel's network
      marks, so no bay numerals are drawn.
  controls:
    confidence: datasheet
    note: >-
      Manual figure 1-2 and its tables; see supermicro/control-panel-sc116b@1. The front
      USB ports are USB 3.2 Gen1 (product page, front view).
  rear:
    confidence: photo-measured
    note: >-
      From the rear photograph, left to right: the two power supplies, PWS1 at 5.2 and
      PWS2 at 62.0; from 118.1 the I/O plate - a four-row vent field, the serial port
      (centre 148.2, 32.2), the BMC LAN port (173.6, 12.3) over two USB 2.0 ports
      (173.7; 23.5 and 32.2), two more vent rows over two blue USB 3.2 ports (192.2),
      LAN1 (210.1, 30.8) and LAN2 (228.8, 30.8), VGA (256.2, 32.4) and a small vent
      block; above LAN2 and VGA the slot 3 window; from 298 the slot 1 and 2 bracket
      with its thumbscrew post; and a column of vents at the right end. Names and order
      are the manual's figure 1-3 and rear view table.
  rear-uid:
    confidence: estimated
    note: >-
      The manual's rear figure labels a Unit ID LED right of the VGA port. The
      photograph shows a small oblong lens at (287.4, 34.9), right of the vent block
      beside VGA, and that is where the lamp is drawn; the figure's arrow is the only
      thing that says this lens is it.
  rear-legends:
    confidence: estimated
    note: >-
      NO REAR LEGEND IS DRAWN. Faint marks show under the ports on the photograph at 2
      px/mm and none can be read, and nothing else printed on that face resolves at that
      scale either, so this is a limit of the image and not a reading that the plate is
      blank. See the gap.
  slots:
    confidence: datasheet
    note: >-
      Product page: 2 PCIe 5.0 x16 FHFL slots and 1 PCIe 5.0 x8 (in x16) LP slot. Manual
      section 3.9: slots 1 and 2 on the "1U LHS WIO riser card", slot 3 on the "1U RHS
      WIO riser card". The slots are bays of the two riser parts
      (supermicro/riser-wio-lhs-x13sew@1, supermicro/riser-wio-rhs-x13sew@2), each a
      standard bracket behind a window, so the library's cards seat in them.
  psus:
    confidence: datasheet
    note: >-
      Product page and manual Appendix B: two PWS-861A-1R, 860 W, redundant 1+1,
      Titanium; rear view table: PWS1 on the left, PWS2 on the right. Both are seated by
      default - the server ships with both.
  weight:
    confidence: datasheet
    note: >-
      Product page: net weight 21 lbs (9.53 kg), gross 33.5 lbs (15.2 kg). The page does
      not say what is installed at the net figure; the system is sold as a barebone,
      without processor, memory or drives.
  power:
    confidence: datasheet
    note: >-
      NO MAXIMUM SYSTEM POWER IS STATED on the product page, the datasheet, the manual
      or the quick reference guide; each gives the supply rating only. The Lot 9
      addendum states the idle state power at the higher boundary temperature of the
      operating class, 260.43 W, for its tested configuration - an idle figure under one
      regulation's test, not a maximum - and it is not written as power-max. A supply
      rating is not the server's draw.
  environmental:
    confidence: datasheet
    note: >-
      Product page and manual Appendix B: operating 10 to 35 C, non-operating -30 to 60
      C, operating relative humidity 8 to 80% non-condensing, non-operating 8 to 90%.
  lifecycle:
    confidence: datasheet
    note: >-
      Searched 2026-10-04 for an end-of-life notice (Supermicro's product page, which
      still offers the system, and the web for "SYS-111E-WR end of life"); none found.
  faces:
    confidence: datasheet
    note: >-
      Bottom, left and right are sized from the stated dimensions and declared empty: no
      document held shows any of them straight on.
  interior:
    confidence: photo-measured
    note: >-
      THE TOP VIEW IS THE CHASSIS UNDER ITS TOP COVER, rear at the top; the cover
      (supermicro/system-cover-sc116b@1) is seated and comes off in the viewer, and
      everything beneath it says it is under it. The interior is read off the top-down
      photograph of the open SYS-111E-WR embedded in its manual MNL-2490 as figure 1-5
      (856 x 1050), on which the chassis is 660 px across at the rear for 437 mm (1.510
      px/mm) and 900 px front to rear for 597 (1.508); at the front the chassis is 675
      px across, 2.4% more, so it passes the panel gate at the rear and loosens toward
      the front. Positions across are read from the image centre at a scale that runs
      from 1.510 at the rear to 1.545 at the front, and positions front to rear at
      1.508. THE BOARD IS PLACED FROM THIS IMAGE AND LAID OUT FROM A BETTER ONE: it lies
      115.0..318.0 across and 13.5..343.5 from the rear, and its own layout is
      supermicro/system-board-x13sew@2, measured off the SYS-111E-FDWTR photograph at
      twice the resolution; this image agrees with that layout to 1.5 mm across and 4 mm
      front to rear. FIVE FANS AND ONE EMPTY HOUSING stand in a black tray 370 from the
      rear: read with the image brightened, the six positions lie at 59.0, 100.1, 142.5,
      182.9, 224.0 and 264.5 across, an even 41.1 pitch, and the second from the left is
      an empty frame - the manual says five fans "plus one additional fan housing
      space". A FIRST VERSION DREW THE FIVE NEAREST THE SUPPLIES on a 45 pitch, off the
      unbrightened image, which is dark there; the SYS-511E-WR photograph, which shows
      the same arrangement plainly, is what sent this one back to be read again. The
      drive cage cover runs from 469.5 to the front. THE SUPPLIES, THE RISERS AND THE
      CARDS ARE NOT PLACED IN THIS VIEW: each is seated in its rear bay and projects
      here through that bay's `plan:`, at the bay's own position mirrored from the rear
      (a blank projects nothing, so the base build shows the risers empty and the
      `cards` example shows three cards). The supplies' tops read 6 mm outward of that
      on this image, as parts standing nearer the camera do.
attrs:
  physical:
    ru: 1
    weight-kg: 9.53
    weight-gross-kg: 15.2
  power:
    power-input: 100-240 VAC, 50-60 Hz, per supply (860 W at 200-240 VAC and 240 VDC, 800 W at 100-127 VAC)
    psu-redundancy: 1+1
  thermal:
    fans: five 40 x 40 x 56 mm counter-rotating PWM fans, with space for a sixth
  environmental:
    operating-temp-c: 10 to 35
    storage-temp-c: -30 to 60
    operating-humidity: 8 to 80% non-condensing
    storage-humidity: 8 to 90% non-condensing
  platform:
    cpu: one 4th or 5th generation Intel Xeon Scalable processor, socket E (LGA-4677), up to 300 W TDP
    memory: 8 DDR5 DIMM slots, up to 2 TB of 5600 MT/s ECC RDIMM
    chipset: Intel C741
    motherboard: X13SEW-F
    storage-controller: onboard SATA, 6 Gbps; NVMe and SAS need the optional cables or controller card
    network: two 1GbE RJ45 (Intel i210)
    bmc: dedicated 1GbE BMC LAN port
  compliance:
    regulatory: FCC, ICES, CE, UKCA, VCCI, RCM, NRTL, CB
  lifecycle:
    eol: none-announced
chassis: {width: 437.0, height: 43.0, depth: 597.0, ru: 1, color: '#c8ccd0', power: ac}
gaps:
  - what: power-max
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      no maximum system power on the product page, datasheet, manual or quick
      reference guide; the Lot 9 addendum gives only an idle figure, 260.43 W, for
      its tested configuration. The server profile's power requirement is unmet for
      that reason.
    wanted: >-
      a configured maximum power figure from Supermicro for the SYS-111E-WR
  - what: rear-legends
    scope: [rear]
    reason: needs-photo
    note: >-
      the legends printed under the rear ports are not drawn: the only straight-on
      rear image held is 2 px/mm and resolves no printing at all, so what the plate
      says is unread. The power supplies' own labels are unread for the same reason.
    wanted: >-
      a straight-on rear photograph of a SYS-111E-WR at 6 px/mm or better
  - what: riser-part-numbers
    scope: [rear]
    reason: vendor-silent
    note: >-
      the manual names the two risers only as the 1U LHS and RHS WIO riser cards and
      the product page lists neither; their RSC part numbers are not in any document
      held, so the riser parts are named for the chassis.
    wanted: >-
      the riser card part numbers from the system's parts list
  - what: front-estimated-heights
    scope: [front, rear]
    reason: needs-photo
    note: >-
      both faces are measured off photographs taken from slightly above the server
      at about 2 px/mm; positions across are good to a millimetre and positions
      down, and every part's height, somewhat worse. Vent slot and hole sizes are
      approximate.
    wanted: >-
      square-on photographs of the front and rear, or a dimensioned drawing of the
      CSE-116BTS chassis
  - what: front-bezel
    scope: [front]
    reason: needs-photo
    note: >-
      the optional black front bezel MCP-210-11601-0B (product page parts list) is
      not drawn; no image of it is held.
    wanted: >-
      a straight-on image of the bezel on this chassis
  - what: interior-estimated
    scope: [top]
    reason: needs-drawing
    note: >-
      the interior under the top cover is drawn from one top-down photograph at
      1.5 px/mm that is 2.4% wider at the front than at the rear. Drawn: the
      cover (it lifts off), the board, eight DIMMs, the heatsink, the air shroud
      and the supply cage cover (both lift off), five fans in their tray, the
      power distribution box beside them (a plain box with its warning label),
      and standing in from the rear bays the two supplies, both risers and any
      cards in their slots. Not drawn: the ten drives and their cage (a plain
      fixed cover here, as photographed), the backplane (a line) and cabling.
      THE AIR SHROUD IS ESTIMATED: it is in one angled photograph only. The two risers are
      outlines by eye, and the slot 3 riser is in neither photograph. The empty
      sixth fan housing is not a bay.
    wanted: >-
      a dimensioned plan of the CSE-116BTS interior, and the vendor's fan numbering
