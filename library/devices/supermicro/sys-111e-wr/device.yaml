configurations:
  base:
    kind: base
    default: true
    part-numbers:
      SYS-111E-WR: {part: SYS-111E-WR}
    description: >-
      The barebone as Supermicro sells it: ten drive trays, both 860 W
      supplies, both risers with all three slots blanked.
  nvme:
    kind: example
    description: >-
      Bays 0 to 3 fitted with the orange-tab NVMe tray (MCP-220-00167-0B)
      in place of the standard tray; the rest as the base.
    bay-attrs:
      drive-0: {release-color: '#e8891c'}
      drive-1: {release-color: '#e8891c'}
      drive-2: {release-color: '#e8891c'}
      drive-3: {release-color: '#e8891c'}
  cards:
    kind: example
    description: >-
      A card in each slot, to show what the windows take: two-port
      full-height cards in slots 1 and 2 and a low-profile card in slot 3
      (three of the library's ConnectX cards - not a Supermicro-qualified
      build). The photographed server carries a two-port card in slot 1.
    bays:
      riser-lhs/slot-1: nvidia/mcx516a-fh@1
      riser-lhs/slot-2: nvidia/mcx516a-fh@1
      riser-rhs/slot-3: nvidia/mcx4121a-lp@1
