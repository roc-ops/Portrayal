configurations:
  base:
    kind: base
    default: true
    part-numbers:
      SYS-511E-WR: {part: SYS-511E-WR}
    description: >-
      The barebone as Supermicro sells it: four drive trays, both 860 W
      supplies, both risers with all three slots blanked.
  gold:
    kind: orderable
    part-numbers:
      SYS-511E-WR-01-G2: {part: SYS-511E-WR-01-G2}
    description: >-
      The Gold Series version, sold with pre-configured components that the
      product page does not list; drawn as the base.
  cards:
    kind: example
    description: >-
      A card in each slot, to show what the windows take: two-port
      full-height cards in slots 1 and 2 and a low-profile card in slot 3
      (three of the library's ConnectX cards - not a Supermicro-qualified
      build).
    bays:
      riser-lhs/slot-1: nvidia/mcx516a-fh@1
      riser-lhs/slot-2: nvidia/mcx516a-fh@1
      riser-rhs/slot-3: nvidia/mcx4121a-lp@1
