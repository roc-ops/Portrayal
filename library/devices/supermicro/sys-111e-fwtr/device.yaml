format: 1
kind: device
name: sys-111e-fwtr
version: 1.0.0
maturity: modelled
manufacturer: Supermicro
model: SuperServer SYS-111E-FWTR
description: >-
  Supermicro's 1U short-depth front-I/O edge server for 4th and 5th generation
  Intel Xeon Scalable processors, the AC build, sold as the SYS-111E-FWTR
  (two 800 W Platinum supplies) and the SYS-111E-FWTR-EU (two 860 W Titanium
  supplies): everything is at the front - the supplies, the power button, the
  X13SEW-TF board's serial, BMC, USB, two 10GbE and VGA ports, and three PCIe
  5.0 x16 slots on two risers - and the rear is a vent field over six fans.
profile: server
provenance:
  sources:
    confidence: datasheet
    note: >-
      Read for this model: Supermicro's product page for the SYS-111E-FWTR
      (supermicro.com/en/products/system/iot/1u/sys-111e-fwtr), which lists both
      versions as its two product SKUs - the SYS-111E-FWTR-EU has no page of its own -
      for dimensions, weight, ports, slots, power supply and environmentals; the User's
      Manual MNL-2570 revision 1.0d, which covers these two and the DC SYS-111E-FDWTR,
      for the front and rear views, feature tables, grounding section and appendices;
      the quick reference guide QRG-2570; the SC515B chassis manual; and the X13SEW
      motherboard manual MNL-2413. The images measured are embedded in the manual at 300
      ppi: the two fronts on page 10 and the rear on page 12. THIS DEVICE IS THE
      SYS-111E-FDWTR WITH AC SUPPLIES, and is generated from it: everything but the two
      supply bays is that device's drawing, measured as its provenance says. The product
      datasheet PDF for this model was not read; the page was.
  chassis:
    confidence: datasheet
    note: >-
      Manual Appendix B: CSE-515B-R801W/R601W, 1U rackmount, 17.2 x 1.7 x 16.9 in (437 x
      43 x 429 mm), one figure for both chassis. THE PRODUCT PAGE PRINTS DIFFERENT
      MILLIMETRES for the same inches - 44.5 x 436.88 x 429.3 - and 1.7 in is 43.2, so
      the manual's are carried, as on the DC server. No document says what the depth
      runs between.
  ears:
    confidence: photo-measured
    note: >-
      THE EARS ARE NOT DRAWN. On the front image each ear with its handle runs about 70
      px outside the body, 21 mm. Everything on this face is on the body.
  gate-1-front:
    confidence: photo-measured
    note: >-
      THE FRONT IS THE SYS-111E-FDWTR FRONT WITH AC SUPPLIES IN ITS TWO BAYS, and it is
      drawn that way: the two servers are one chassis family (CSE-515B-R801W and -R601W)
      and one board, photographed one above the other on page 10 of the manual they
      share, and everything right of the supplies is supermicro/sys-111e-fdwtr's front,
      with that device's gate and its caveats. What is this server's own is read off the
      front photograph of the SYS-111E-FWTR embedded beside it on page 10 of the manual
      (1890 x 513), the same view of the same chassis with the AC supplies fitted: the
      two supply faces lie 5.9..59.9 and 63..117 across, the bays the DC server has, and
      each shows the vent grid, bail, portrait inlet, ringed lamp and red release of the
      AC supply face.
  gate-1-rear:
    confidence: photo-measured
    note: >-
      The rear image is straight on and nearly passes: 1928 px across for 437 mm (4.412
      px/mm) and 179 px down for 43 mm (4.163), 5.6% apart, which is more than the gate
      allows, so it too is read per axis. The vent columns give an even pitch right
      across it, 27.3 px, 6.19 mm.
  front:
    confidence: photo-measured
    note: >-
      Left to right: the two DC supplies, PWS2 at 5.6 and PWS1 at 62.8; from 118.3 the
      I/O plate - a vent field around the power button (centre 141.3, 12.6), the serial
      port, the BMC LAN port over two USB 2.0 ports, a second vent field over two USB
      3.2 ports, LAN1 and LAN2 (10GbE), VGA and a small vent block, with a row of slots
      along the bottom edge under all of it; above LAN2 and VGA the slot 3 window; from
      298 the slot 1 and 2 bracket; and the end bracket from 418 with a round hole.
      Names and order are the manual's figure 1-1 and System Features: Front table.
  power-button:
    confidence: photo-measured
    note: >-
      The manual calls it the Power Button with Status LED: the main power switch, with
      a lamp that is lit when the system is operating normally and flashes on drive
      activity. It is supermicro/power-button-sc515b@1, centred where the image puts it.
  ground-stud:
    confidence: estimated
    note: >-
      The manual's section 2.8 says both the AC and DC servers carry a chassis ground
      terminal marked with the protective earth symbol, and its figure 2-8 circles a
      stud in the front vent field, above the gap between the USB 3.2 ports and LAN1.
      THE FIGURE IS A CROPPED LINE DRAWING WITH NO SCALE OF ITS OWN: taking its USB port
      as 13.1 mm wide puts the stud 11.4 right of the USB 3.2 centre and 11.8 above the
      upper port, at (203.6, 11.7). The front photograph does not show a stud there -
      that field is plain vents on it - so the position rests on the drawing alone. The
      heading says studs; the figure shows one.
  rear:
    confidence: photo-measured
    note: >-
      A field of square vents, 4.8 on a 6.19 pitch across and 6.2 down, starting 7.1
      from the left and 4.05 from the top: six rows over the first 46 columns, where the
      six fans stand behind it, and the lower three rows only over the next 22, under a
      plain plate. The manual's rear figure labels the fans and a service tag. THE
      SERVICE TAG IS NOT DRAWN: only its edge shows, under the bottom of the face at
      about 365..395; see the gap.
  slots:
    confidence: datasheet
    note: >-
      Product page: 1 PCIe 5.0 x16 LP slot and 2 PCIe 5.0 x16 FHFL slots; manual
      Expansion Slot Locations table: 1 and 2 full-height full-length, 3 low-profile.
      The slots are bays of the two riser parts this server shares with the SYS-111E-WR
      (see those parts for the check). ONE DIFFERENCE IS NOT CARRIED: slot 3 here is a
      full x16, where the WR's is x8 in an x16 connector, and the shared riser part
      states x8 lanes. See the gap.
  psus:
    confidence: datasheet
    note: >-
      Product page, Product SKUs: "SYS-111E-FWTR Standard version with PWS-804P-1R
      (Platinum Level)" and "SYS-111E-FWTR-EU European version with PWS-862S-1R
      (Titanium Level)"; Power Supply: 2x 800W Redundant (1 + 1) Platinum Level, 54.5 x
      40.25 x 220 mm. Manual front table: PWS1 on the right, PWS2 on the left. THE
      MANUAL NAMES THE STANDARD SUPPLY DIFFERENTLY: its Appendix B prints PWS-804S-1R
      where the page prints PWS-804P-1R; the page is carried and the disagreement is a
      gap. The bays accept either supply and the two configurations seat a matched pair;
      the manual says to replace a supply with the same model.
  weight:
    confidence: datasheet
    note: >-
      Product page: net weight 10 lbs (4.54 kg), gross 15 lbs (6.8 kg), for the
      barebone.
  power:
    confidence: datasheet
    note: >-
      NO SYSTEM POWER FIGURE IS STATED on the product page, the manual or the quick
      reference guide; each gives the supply rating only, and no Lot 9 addendum is
      published for this model. A supply rating is not the server's draw.
  environmental:
    confidence: datasheet
    note: >-
      Product page and manual Appendix C: operating 0 to 40 C, non-operating -40 to 70 C
      on the product page and -40 to 60 C in the manual; operating relative humidity 8
      to 90% non-condensing, non-operating 5 to 95%. THE TWO DOCUMENTS DISAGREE on the
      upper non-operating temperature; the manual's lower figure is carried and the
      disagreement is a gap.
  compliance:
    confidence: datasheet
    note: >-
      Manual Appendix C: FCC, ICES, CE, UKCA, VCCI, RCM, NRTL, CB. THE NEBS STATEMENT IS
      NOT CARRIED OVER from the DC server: Supermicro's page for the SYS-111E-FDWTR
      lists "NEBS Level 3 Certified" as a key feature and its page for the SYS-111E-FWTR
      does not, though the shared manual writes about installing the AC input ports in
      NEBS environments.
  lifecycle:
    confidence: datasheet
    note: >-
      Searched 2026-10-04 for an end-of-life notice (Supermicro's product page, which
      still offers the system, and the web for "SYS-111E-FDWTR end of life"); none
      found.
  faces:
    confidence: datasheet
    note: >-
      Bottom, left and right are sized from the stated dimensions and declared empty: no
      document held shows any of them straight on.
  interior:
    confidence: photo-measured
    note: >-
      THE TOP VIEW IS THE CHASSIS UNDER ITS TOP COVER, rear at the top; the cover
      (supermicro/system-cover-sc515b@1) is seated and comes off in the viewer. The
      interior is read off the top-down photograph of the open SYS-111E-FDWTR embedded
      in its manual MNL-2570 on page 13 (1419 x 1381 at 300 ppi), on which the chassis
      is 1254 px across for 437 mm (2.870 px/mm) and 1236 px front to rear for 429
      (2.881), 0.4% apart, so it passes the panel gate. Positions are read at 2.875
      px/mm from the left wall and the rear wall. The board lies 120.6..323.6 across and
      86.8..416.8 front to rear, turned I/O-forward; the six fans stand in a row 14 from
      the rear, four together from 149.0 on a 43.1 pitch and two more at 335.4 and 378.5
      - DRAWN ON ONE PITCH WITH ONE BREAK: the six read 149.0, 192.1, 235.3, 278.4,
      335.4 and 379.9 on the photograph, and the last is drawn 1.4 nearer its neighbour
      to keep the pitch, which is inside what a fan housing edge reads to. THE GAP
      BETWEEN THE FOURTH AND FIFTH IS REAL, 17 mm of chassis with a mounting post each
      side of it on the photograph, where the others stand 3 mm apart; the two-drive
      cage is at the rear left, 2.9..110 across; the supplies run 220 back from the
      front wall. Parts that stand up off the floor are nearer the camera and read a few
      millimetres outward of where they are, so the supplies are placed from the front
      view's bays, not from this image. THE SUPPLIES, THE RISERS AND THE CARDS PROJECT
      INTO THIS VIEW from their front bays through each bay's `plan:`, turned half a
      turn (`rotate: 180`) because a plan is drawn face-at-the-top and these face the
      front.
attrs:
  physical:
    ru: 1
    weight-kg: 4.54
    weight-gross-kg: 6.8
  power:
    power-input: 100-240 VAC, 50-60 Hz, per supply (the 800 W supply also 230-240 VDC)
    psu-redundancy: 1+1
  thermal:
    fans: six 40 x 40 x 56 mm counter-rotating fans
  environmental:
    operating-temp-c: 0 to 40
    storage-temp-c: -40 to 60
    operating-humidity: 8 to 90% non-condensing
    storage-humidity: 5 to 95% non-condensing
  platform:
    cpu: one 4th or 5th generation Intel Xeon Scalable processor, socket E (LGA-4677), 85 to 350 W TDP (over 205 W only under specific conditions)
    memory: 8 DDR5 DIMM slots, up to 2 TB of 5600 MT/s ECC RDIMM
    chipset: Intel C741
    motherboard: X13SEW-TF
    storage: two internal fixed 2.5 inch SATA bays; one M.2 PCIe 3.0 x2 NVMe slot
    network: two 10GbE RJ45 (Intel X550-AT2)
    bmc: dedicated 1GbE BMC LAN port
  compliance:
    regulatory: FCC, ICES, CE, UKCA, VCCI, RCM, NRTL, CB
  lifecycle:
    eol: none-announced
chassis: {width: 437.0, height: 43.0, depth: 429.0, ru: 1, color: '#c8ccd0', power: ac}
gaps:
  - what: power-max
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      no system power figure on the product page, manual or quick
      reference guide, and no Lot 9 addendum for this model. The server profile's
      power requirement is unmet for that reason.
    wanted: >-
      a configured maximum power figure from Supermicro for the SYS-111E-FDWTR
  - what: front-not-orthographic
    scope: [front]
    reason: needs-photo
    note: >-
      no square-on image of the front exists in any document held or on any page
      searched; the face is read per axis off a photograph taken from above, 7% out
      between its two scales, and its I/O plate is drawn at the figures of the
      sibling SYS-111E-WR. Positions down, the vent fields and the end bracket are
      approximate.
    wanted: >-
      a square-on photograph of a SYS-111E-FDWTR front, or a dimensioned drawing of
      the CSE-515B chassis
  - what: psu-part-number
    scope: [front]
    reason: sources-disagree
    note: >-
      the standard version's supply is PWS-804P-1R on the product page (Platinum,
      750 W at 100-127 VAC and 800 W at 200-240 VAC) and PWS-804S-1R in the
      manual's Appendix B (800 W at both ranges). One part position, two part
      numbers with different low-line ratings. The page's is carried.
    wanted: >-
      the label of the supply fitted to a SYS-111E-FWTR
  - what: ground-stud-position
    scope: [front]
    reason: needs-photo
    note: >-
      the chassis ground stud is placed from the manual's figure 2-8, an unscaled
      line drawing; the front photograph shows no stud there. Whether there is a
      second stud, as the section heading's plural suggests, is not shown.
    wanted: >-
      a photograph of the ground stud on a real unit
  - what: front-legends
    scope: [front]
    reason: needs-photo
    note: >-
      no legend printed on the front plate is drawn. The image of the DC sibling
      resolves 3 mm lettering on its supplies and shows no printing that size on
      the I/O plate; smaller marks beside the ports and the protective earth symbol
      the manual says identifies the ground terminal are below what it resolves.
    wanted: >-
      a close photograph of the front I/O plate
  - what: slot-3-lanes
    scope: [front]
    reason: needs-drawing
    note: >-
      slot 3 is a full PCIe 5.0 x16 on this server (product page and manual) and x8
      in an x16 connector on the SYS-111E-WR; the riser part the two share states
      x8. The riser cards are different parts on the two boards and their part
      numbers are in no document held.
    wanted: >-
      the riser card part numbers for the X13SEW-TF and X13SEW-F systems
  - what: non-operating-temperature
    scope: [front]
    reason: sources-disagree
    note: >-
      the product page gives the non-operating temperature as -40 to 70 C and the
      manual's Appendix C as -40 to 60 C; the same measure and scope. The manual's
      figure is carried.
    wanted: >-
      Supermicro's confirmation of which figure is right
  - what: service-tag
    scope: [rear]
    reason: needs-photo
    note: >-
      the service tag the manual's rear figure labels (it carries the BMC password
      details) is not drawn; the rear image shows only its edge under the face.
    wanted: >-
      an image of the service tag pulled out
  - what: interior-estimated
    scope: [top]
    reason: needs-drawing
    note: >-
      the interior under the top cover is drawn from one top-down photograph.
      Drawn: the cover (it lifts off), the board, eight DIMMs, a heatsink, the
      air shroud and the supply cage cover (both lift off), six fans, one of the
      two stacked internal drives, and standing in from the front bays the two
      supplies, both risers and any cards in their slots. Not drawn: the power
      distribution board between the drive cage and the supplies (a plain panel
      here), the optional second shroud for a GPU card, and cabling. THE AIR
      SHROUD IS ESTIMATED from an isometric figure, and its mouth at the fans is
      cut short. The heatsink is the
      SYS-111E-WR part placed on the socket; this server is photographed with the
      socket empty. The two risers are the WR's outlines turned to face the
      front; this server's own bracket arm is narrower on its photograph.
    wanted: >-
      a dimensioned plan of the CSE-515B interior, and an image of this server with
      its heatsink and riser bracket fitted
groups:
  risers: {term: Riser, role: service, index-origin: 1, description: 'the left-hand-side riser bracket (PCIe slots 1 and 2) and the right-hand-side riser (slot 3); the slots are bays of the risers'}
  psus: {term: PSU, role: service, index-origin: 1, attrs: {redundancy: '1+1', redundancy-note: 'product page: 2x 800W Redundant (1 + 1); manual section 3.7: hot-swappable redundant power supplies'}}
  nics: {term: Port, role: traffic, index-origin: 1, attrs: {media: rj45, speed: 10g}}
  mgmt: {term: Port, role: management, index-origin: 1, attrs: {media: rj45, speed: 1g, role: mgmt}}
  usb: {term: Port, role: management, index-origin: 1, attrs: {media: usb-a}, description: 'two USB 2.0 and two USB 3.2 Gen1 Type-A ports'}
  video: {term: Port, role: management, index-origin: 1}
  serial: {term: Port, role: management, index-origin: 1}
  controls: {term: Button, role: management, index-origin: 1}
  grounding: {term: Stud, role: furniture, index-origin: 1}
  drives: {term: Bay, role: service, index-origin: 1, description: 'the two internal fixed 2.5 inch SATA bays, one above the other in a cage at the rear left; seen from above they are one footprint, so one is drawn'}
  memory: {term: DIMM, role: service, index-origin: 1, description: 'the eight DDR5 slots, each bay named as the board prints it (dimm-a1 is DIMMA1): seen with the I/O edge away from you, DIMMH1, G1, F1 and E1 left of the processor and DIMMA1, B1, C1 and D1 right of it, from the Motherboard Layout figure of the X13SEW manual MNL-2413. Positions run 1 to 8 left to right as this view is drawn, which on a server that carries the board I/O-forward is the reverse order'}
  fans: {term: Fan, role: service, index-origin: 1, description: 'the 40 x 40 x 56 mm counter-rotating fans, numbered here left to right as seen from above; the vendor fan numbering is not mapped'}
  processors: {term: CPU, role: service, index-origin: 1}
  interior: {term: Part, role: furniture, index-origin: 1}
  covers: {term: Cover, role: furniture, index-origin: 1, description: 'the top cover, and under it the air shroud and the supply cage cover where the chassis has them; each lifts off in the viewer'}
