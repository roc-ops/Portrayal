configurations:
  base:
    kind: base
    default: true
    part-numbers:
      SYS-111E-FWTR: {part: SYS-111E-FWTR}
    description: >-
      The standard version as Supermicro sells it: both 800 W Platinum
      supplies (PWS-804P-1R) and both risers with all three slots blanked.
  eu:
    kind: orderable
    part-numbers:
      SYS-111E-FWTR-EU: {part: SYS-111E-FWTR-EU}
    description: >-
      The European version: the same server with two 860 W Titanium supplies
      (PWS-862S-1R).
    bays:
      psu-1: supermicro/psu-pws-862s-1r@1
      psu-2: supermicro/psu-pws-862s-1r@1
  cards:
    kind: example
    description: >-
      A card in each slot, to show what the windows take: two-port
      full-height cards in slots 1 and 2 and a low-profile card in slot 3
      (three of the library's ConnectX cards - not a Supermicro-qualified
      build).
    bays:
      riser-lhs/slot-1: nvidia/mcx516a-fh@1
      riser-lhs/slot-2: nvidia/mcx516a-fh@1
      riser-rhs/slot-3: nvidia/mcx4121a-lp@1
