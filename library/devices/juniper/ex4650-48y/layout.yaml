format: 1
kind: device
name: ex4650-48y
version: 0.1.1
maturity: modelled
manufacturer: Juniper
model: EX4650-48Y
portfolio: {line: EX Series, family: EX4650}
description: >-
  Juniper EX4650-48Y, a 1RU 25 GbE campus core and aggregation switch running Junos OS. It has 48
  SFP28 ports (25, 10 or 1 GbE, set a quad at a time) and 8 QSFP28 ports (100 or 40 GbE,
  channelizable). The 56 ports and their lamps are on the port side. The rear carries two power
  supplies, five fan modules, the console, two RJ-45 management ports and a USB port. It also has the
  reset button and the four chassis lamps. It ships as one front panel in four power and airflow
  variants: AC or DC supplies, front-to-back (AIR OUT) or back-to-front (AIR IN).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper EX4650 Switch Hardware Guide, published 2025-07-16 (copyright Juniper Networks, Inc.;
      its end user licence agreement governs the software only): the front and rear figures 5, 6, 9
      and 10, Tables 3 to 8 (ports, speeds and models), Table 9 (physical specifications), the LED
      tables 10 to 14, the fan and airflow tables 15 and 16, the power tables 18 to 25 and the
      environmental table 28. Juniper's studio photographs of the 48Y, front and rear, 1500 x 230 px
      (ex4650-48y-front-high and -rear-high). Juniper EX4650 Ethernet Switch Datasheet, 1000640-008-EN,
      July 2023, 13 pages: the CPU and storage, the idle power and the ordering table. The guide is at
      juniper.net/documentation/us/en/hardware/ex4650/ex4650.pdf and the datasheet at
      juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex4650-ethernet-switch-datasheet.pdf.
      Both carry a copyright notice and no licence to reuse their drawings, so facts and measurements
      are taken and no figure or photograph is copied. No mechanical drawing and no 3D model are held
      for this family (the held Visio and 3D sets under the Juniper intake are MX only). The guide's
      figures 9 and 10 are flat drawings of the rear and figure 6 a flat drawing of the front, so no
      isometric is used.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 9: 1.72 in (4.37 cm) high, 17.36 in (44.09 cm) wide, 20.48 in (52.02 cm) deep
      excluding the fan and power supply handles, 23.69 lb (10.75 kg) with two supplies and the fans
      (23.69 lb is 10.746 kg, so the two units of the table agree). The width is the body: the table
      says the outer edges of the front mounting brackets extend it to 19 in (48.2 cm), so the
      brackets are not part of the body and are not modelled.
  gate-1:
    confidence: photo-measured
    note: >-
      The front studio photograph is orthographic enough to measure: its body, between the left rim
      and the right edge, is 1428 px wide and about 141 px high, an aspect of 10.1 against the table's
      440.9 / 43.7 = 10.09. Scale 3.24 px/mm. Guide figure 6 is a flat drawing used to count and read
      the printing. The panel is the same chassis as the QFX5120-48Y: every cage opening, fan face and
      supply handle measured on this photograph lands within 0.5 mm of the same feature on that
      device's higher-resolution photograph, so its finer figures are used where this photograph
      resolves less (its lamps are not resolved at all).
  ports:
    confidence: photo-measured
    note: >-
      Front photograph, dark cage openings along the upper row: 24 SFP28 openings in three groups of
      eight (starting at 8.0, 124.4 and 241.1 mm), then four QSFP28 openings at 358.5, 377.6, 396.4 and
      415.6 mm. The cell origins 7.5, 124.05, 240.6 and 358.35 mm and the pitches (the registry's 14.25
      SFP28 and 19.0 QSFP28) are carried from the QFX5120-48Y's finer photograph, which this one
      confirms to 0.4 mm. Counts are 48 and 8, the callouts 1 and 2 of figure 6.
  row-pitch:
    confidence: photo-measured
    note: >-
      Down the first SFP column the two openings are 11.1 to 18.8 and 25.3 to 33.0 mm; down the QSFP28
      columns 11.4 to 19.8 and 24.4 to 32.7 mm, so the row pitch is 14.0 for the SFP28 cages and 13.05
      for the QSFP28 ones, as on the QFX5120-48Y. The y origin is the photograph's top edge at row 40.
  stack-orientation:
    confidence: photo-measured
    note: >-
      The photograph shows the light latch tongues at the foot of every upper cage and at the top of
      every lower one, so both lips face the band between the rows: the upper cage upright and the
      lower one turned 180, the library's stack convention (docs/pluggables-slotting-design.md).
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed on the metal and read off the photograph and figure 6: the SFP28 ports run 0 to 47 down
      each column, even above the cage and odd below it, the numeral printed on a line above the upper
      row and another below the lower row; the QSFP28 ports are 48 and 49 down the first column, 50
      and 51, 52 and 53, 54 and 55. Interface names are not printed and go here only: SFP28 ports
      are ge-0/0/n, xe-0/0/n or et-0/0/n by speed (Table 5), and the uplink ports et-0/0/48 to
      et-0/0/55, with xe- or et- channel suffixes :0 to :3 when channelized (Table 6).
  port-lamps:
    confidence: drawing
    note: >-
      DRAWING AND PHOTOGRAPH DISAGREE, and the lamps are carried from the drawing. Figure 6 draws a
      small ring either side of every SFP28 numeral and four rings along each QSFP28 cage in both
      rows; the studio photograph shows none (unlit light pipes that do not resolve at its scale). The
      guide's text gives two lamps for each SFP28 port (Tables 12 and 13: link activity, and a status
      lamp blinking green at 1 and 10 Gbps and steady at 25 Gbps) and ONE lamp for each QSFP28 port
      (Table 14, and the sentence before Figure 15: 'one LED that shows both the link activity and
      status'). The drawing's four rings per QSFP28 port are kept because it is the only source of
      their place, the first as the port lamp and the other three as channel lamps, and the one-lamp
      statement is a conflict the owner can resolve. The lamp offsets from the numeral (3.0 mm either
      side for SFP28, 4.1 mm apart for QSFP28) are estimated from figure 6 against the QFX5120-48Y's
      identical drawing, whose scale anchor is 6.3 px/mm.
  vents:
    confidence: photo-measured
    note: >-
      The photograph shows two staggered rows of round holes along the top edge and two along the
      bottom, as on the QFX5120-48Y; drawn as two vent strips on a 3.2 by 1.85 mm pitch.
  front-bar:
    confidence: photo-measured
    note: >-
      A light bar stands at the right edge of the photograph, between about 12.6 and 33.4 mm down and
      1.8 mm wide. The guide's text does not name it; it is drawn as decor and recorded as a gap.
  rear-layout:
    confidence: photo-measured
    note: >-
      Rear photograph at 3.24 px/mm, checked against figure 9 and its callouts 1 to 12. At the left a
      63 mm panel carries the four chassis lamps, the RJ-45 console jack with the USB port beneath it
      in one shield, the two stacked RJ-45 management jacks, the ESD point and the reset pinhole; then
      five fan slots numbered 0 to 4 on a 49.0 mm pitch (orange fan faces start at 71.9, 120.7, 169.8,
      219.2 and 268.3 mm), each preceded by a strip with its fan symbol, number and lamp; then the two
      supply slots 0 and 1, each preceded by a strip with its power symbol and number, and at the right
      edge a dark strip carrying a vertical rating label. Positions are the QFX5120-48Y's, which these
      measurements confirm.
  mgmt-labels:
    confidence: photo-measured
    note: >-
      The upper management jack is printed C0 above it and the lower C1 below it, read off the
      photograph. The guide's callouts say C1 for item 3 and C0 for item 9 without saying which is on
      top; the photograph settles it.
  rear-photo-vs-drawing:
    confidence: photo-measured
    note: >-
      The guide's figures 9 and 10 draw the fan slots with AIR IN labels (a back-to-front unit); the
      studio photograph shows AIR OUT with orange handles. The photograph is the front-to-back build,
      which is the default configuration. Tables 15, 16, 18 and 24 settle the labels: AIR OUT (AFO) with
      an orange handle for front-to-back, AIR IN (AFI) with a blue handle for back-to-front. The
      photographed supplies show a black chassis with an orange handle and the AC inlet; figure 10 draws
      the DC supply with four terminals (V-, V-, V+, V+).
  modules:
    confidence: datasheet
    note: >-
      The fan modules (QFX5110-FANAFO and -FANAFI, Table 15) and the power supplies (JPSU-650W-AC-AO
      and -AI, Table 19; JPSU-650W-DC-AFO and -AFI, Table 22) are field-replaceable units in bays, each
      its own component and each reused as it is from the library by its part number. Nothing on this
      chassis is a built-in unit that is not a bay: the supplies' own fans are inside the supplies. No
      -S (empty bay) variant is named by the guide, and the supply blank panel is mentioned only in the
      installation text, so no blank is modelled and a gap says so.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide lists the rack mount kit JNP-4PST-RMK-1U-E (four-post, flush or recessed,
      racks 600 to 800 mm between the front and rear rails) and a separately orderable two-post kit;
      the library holds no kit contract for either, so `chassis.ears` and `chassis.kits` are left out
      and a gap says so. The modelled body is the 440.9 mm chassis, without brackets.
  power:
    confidence: datasheet
    note: >-
      Table 19 (AC supplies): input 100 to 240 VAC, 50 to 60 Hz, 7.8 A at 100 to 120 VAC and 3.8 A at 200
      to 240 VAC; typical 260 W, maximum 450 W. Table 25 (DC): rated -48 to -60 VDC, operating range
      -40.8 to -72 VDC, 20 A maximum, typical 260 W, maximum 450 W. The guide's Table 22 gives a DC
      supply a 4 A input rating and an operating range of -38 to -60 VDC and says one DC supply ships
      while Tables 7 and 8 and the surrounding text say two; the chassis-level Table 25 figures are
      kept and the conflict is recorded here and in the pull request. The July 2023 datasheet adds an
      idle load of 160 W and gives the same 260 W and 450 W, and states AC input as 110 to 240 V and DC
      as -44 to -72 V against the guide's 100 to 240 VAC and -40.8 to -72 VDC; the newer guide wins.
  environment:
    confidence: datasheet
    note: >-
      Table 28: 0 to 45 C (32 to 113 F) normal operation (the table prints 104 F, which is 40 C, so
      its two units disagree; the Celsius figure is kept), -40 to 70 C in the shipping container, 5 to
      90 percent noncondensing, no performance degradation to 2000 m (6562 ft). The July 2023 datasheet
      says 0 to 40 C (32 to 104 F) and up to 1829 m (6000 ft); the guide is the newer source and is used.
  colour:
    confidence: photo-measured
    note: >-
      The front plate and rear panel of this photograph read the same grey as the QFX5120-48Y's; the
      chassis colour is carried from that device. The photograph is lit warmly and the value is not a
      paint reference.
  lifecycle:
    confidence: estimated
    note: >-
      No end-of-life notice is held and the guide states none, so the device states none announced.
attrs:
  physical:
    weight-note: 23.69 lb (10.75 kg) with two power supplies and five fan modules installed (Table 9)
    depth-note: 20.48 in (52.02 cm) excluding the fan and power supply handles (Table 9)
  performance:
    sfp28-speeds: 25, 10 or 1 GbE, set a quad at a time; the default is 10 GbE (Table 4)
    qsfp28-speeds: 100 or 40 GbE; channelizes to 4 x 25 or 4 x 10 GbE (Table 4)
  power:
    power-typical-w: 260
    power-max-w: 450
    power-envelope: unstated
    power-input-ac: 100 to 240 VAC, 50 to 60 Hz, 7.8 A at 100 to 120 VAC, 3.8 A at 200 to 240 VAC
    power-input-dc: rated -48 to -60 VDC, operating range -40.8 to -72 VDC, 20 A maximum
    redundancy-note: two supplies, load-sharing and fully redundant; both should be installed
  thermal:
    fans: five fan modules, 4+1; the switch runs 30 seconds without thermal shutdown while one is replaced
  environmental:
    operating-temp: 0 to 45 C (32 to 113 F) normal operation
    storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container
    humidity: 5 to 90 percent noncondensing
    altitude: no performance degradation to 2000 m (6562 ft)
  platform:
    cpu: 2.3 GHz quad-core Intel (datasheet)
    memory: 16 GB (datasheet)
    storage: 64 GB SSD (datasheet)
    software: Junos OS
  features:
    virtual-chassis: up to 4 EX4650 switches, no other model. Two members before Junos OS 20.1R1. Any non-channelized QSFP28 port (48 to 55) can be a virtual chassis port
    optics-sfp28: 25 GbE, 10 GbE or 1 GbE; the guide gives a restriction on 1GbE copper optics other than OEM part FCLF8521P2BTL-J1
    optics-qsfp28: 100 GbE or 40 GbE; channelizes to 4 x 25 GbE or 4 x 10 GbE (guide Table 6)
  management:
    oob: two RJ-45 management ports (C0 and C1) with link and status lamps
    console: RJ-45 console port (CON)
    usb: one USB port
  lifecycle:
    eol: none-announced
chassis: {width: 440.9, height: 43.7, depth: 520.2, ru: 1, weight-kg: 10.75, color: '#8b8f96', airflow: front-to-back, power: ac}
gaps:
- what: module-depths
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The depth of the fan module and of the power supplies. The guide's figures are isometric and carry
    no scale and its tables state the supply weight only.
- what: front-bar
  scope: [front]
  reason: vendor-silent
  wanted: >-
    What the light bar at the right edge of the port side is. The guide's text and its callouts do not
    name it.
- what: usb-generation
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The USB revision. The guide names one USB port and gives no generation; it is drawn with the kit's
    neutral usb2 skin.
- what: rating-label
  scope: [rear]
  reason: needs-photo
  wanted: >-
    The vertical rating label at the right edge of the rear. It is only partly legible in the
    photograph and is not drawn.
- what: rear-label-states
  scope: [rear]
  reason: vendor-silent
  wanted: The colour and blink pattern of the fan slot lamps; the guide gives no table for them.
- what: supply-blank
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    A supply blank cover panel. The guide says a blank panel is installed over an empty supply slot but
    draws and names none, and no -S variant is listed.
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
    description: Ports 48 to 55 as printed, rel-pos carrying the printed number, since the origin token cannot express a block that starts at 48.
  sfp28-activity-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: One link-activity lamp per SFP28 port, left of the numeral (guide Table 12).
  sfp28-speed-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: 25g, color: '#22c55e'}, {name: 10g-or-1g, color: '#22c55e', behavior: blinking}]
    description: One status lamp per SFP28 port, right of the numeral - steady for 25 Gbps, blinking for 10 or 1 Gbps (guide Table 13).
  qsfp28-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The first of the four lamps drawn for each QSFP28 port (guide figure 6; Table 14 gives the port one lamp).
  qsfp28-channel-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: link, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}]
    description: The second to fourth lamps drawn for each QSFP28 port, in port then lane order (guide figure 6).
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band cluster at the left of the rear - an RJ-45 console port, two RJ-45 management
      ports, a USB port and the recessed reset button. Four kinds, one purpose: reaching and
      recovering the switch when the data plane cannot.
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The four chassis lamps ALM, SYS, MST and ID (guide Table 10).
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '4+1'
      redundancy-note: >-
        EX4650 hardware guide, Cooling System: five fan modules (4+1 redundancy) in the rear panel,
        slots 0 to 4 left to right; all five should be installed and only one removed at a time
  fan-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The round status lamp beside each fan slot (guide figure 9, callout 8).
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: two supplies, load-sharing and fully redundant; hot-removable and hot-insertable
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD point on the rear panel (guide figure 9, callout 4)
