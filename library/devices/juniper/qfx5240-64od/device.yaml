format: 1
kind: device
name: qfx5240-64od
version: 0.1.0
maturity: modelled
manufacturer: Juniper
model: QFX5240-64OD
portfolio: {line: QFX Series, family: QFX5240}
description: >-
  Juniper QFX5240-64OD, a 2RU 800G data-centre spine switch running Junos OS Evolved. It has 64 OSFP ports
  (800 GbE) in sixteen columns of four, in four groups of four columns, and two SFP+ ports (10 GbE), with
  a lamp beside each network port. The port side also carries the RJ-45 management, console and time-of-day
  ports, a USB port, the reset button, the three chassis lamps, the 1 PPS and 10 MHz connectors. The rear
  carries two 3000 W AC power supplies stacked at the left and four front-to-back fan modules. It ships
  as one front panel in one AC airflow-out build, and as a spare chassis with no supplies and no fan modules.
  Its sibling with QSFP-DD cages is the QFX5240-64QD.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      QFX5240 Switch Hardware Guide, published 2026-07-10, 147 pages (Juniper Networks, copyright 2026),
      from https://www.juniper.net/documentation/us/en/hardware/qfx5240/qfx5240.pdf: the front and rear
      figures 2 to 5, the port panel figures 6 to 13 and Tables 8 and 9 (lamps), Table 3 (hardware models),
      Tables 4 to 6 and 13 (power and cooling) and Table 7 (physical specifications). The QFX5240 line
      of Switches datasheet, a00150802ENW Rev. 2, 12 pages (Juniper Networks, published 2026-03; HPE document),
      from https://www.hpe.com/psnow/doc/a00150802enw: Table 2 (system capacity and dimensions), the power
      table and the ordering information. Juniper's studio photographs of the 64OD, front and rear (qfx5240-64od-front-high.jpg,
      2100 x 706 px, and qfx5240-64od-rear-high.jpg, 2100 x 692 px, from juniper.net's image library).
      The documents and the photographs are the maker's and public; the guide and datasheet carry a copyright
      notice and no terms of use beyond it, so only facts are transcribed. No Visio stencil, 3D model
      or mechanical drawing is held for the QFX5240. The guide's figures are half-tone thumbnails of the
      same photographs.
  chassis:
    confidence: datasheet
    note: >-
      datasheet Table 2: 17.26 x 3.46 x 25.52 in (43.8 x 8.8 x 64.8 cm), 2RU, 22 kg (48.50 lb) fully loaded
      without optics. The inch figures are used. The guide's Table 7 prints the same height and weight
      and a width of 19.03 in (48.33 cm) and a depth of 25.51 in (65 cm); 19.03 in is the width over the
      front brackets, which is the rack-face width the datasheet's 17.26 in leaves out, so the datasheet's
      body width is used and brackets are not modelled. The depth differs by 0.01 in; the datasheet's
      25.52 in is used.
  gate-1:
    confidence: photo-measured
    note: >-
      The front photograph's body, between the left and right edges, is 1929 px wide and 391 px from the
      top edge to the bottom lip, an aspect of 4.93 against the datasheet's 438.4 / 87.9 = 4.99 (1.2 percent
      out). Scale 4.40 px/mm across, used on both axes with the origin at the left edge (x 82 px) and
      the top edge (y 154 px). The rear photograph's body is 1895 px wide, 4.323 px/mm. The guide's figures
      2 to 5 are half-tone thumbnails and are used only to count and read.
  ports:
    confidence: photo-measured
    note: >-
      Front photograph: 64 OSFP openings, sixteen columns of four in four groups of four columns. The
      cages abut inside a group on a 23.1 mm pitch (the library's OSFP cage, itself measured on another
      2RU box with the same sixteen columns and four rows) and a group is 92.4 mm wide; the groups stand
      on a 97.1 mm pitch, 4.7 mm apart. The first cage starts at 8.3 mm. A column holds two rows in each
      of two bands (figures 2 and 6). The two SFP+ cages stand to the right of the last group, stacked,
      one above the other (callout 2, 14.5 mm wide).
  row-pitch:
    confidence: photo-measured
    note: >-
      The rows start at 11.4, 26.1, 47.4 and 62.2 mm from the top: 14.7 mm apart in the upper band and
      14.8 mm in the lower, the openings 13.5 mm tall with a thin metal bar between the two rows of a
      band. The two bands are centred about the chassis centre.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed on a strip above the upper band and a strip below the lower band, read off the photograph:
      over each column "N up-arrow ... down-arrow N+1" with N a multiple of four, and under each column
      the same with N+2. So a column holds ports 4c to 4c+3 from the top, the upper band's pair first;
      the SFP+ pair prints "64 up-arrow" and "down-arrow 65" under it. Interface names are not printed
      and none is stated in the guide, so they are not recorded.
  port-lamps:
    confidence: photo-measured
    note: >-
      Each network port has a single RGB lamp (guide, QFX5240 Network Port LEDs, Table 8): in the photograph
      two dots 2.0 mm across between the two numerals of a column, above the upper band for ports 4c and
      4c+1 and below the lower band for ports 4c+2 and 4c+3, read at 9.8 and 13.6 mm from the left edge
      of the column (estimated to 0.4 mm) and drawn at 9.5 and 13.9 mm, 2.05 mm either side of the cage's
      centre, so that a lamp is plainly not trying to centre on its cage. The lamps are unlit. The SFP+
      ports show no lamp and the guide describes none.
  mgmt-panel:
    confidence: photo-measured
    note: >-
      Right of the last group, from the top: the model name under the maker's logo, the RJ-45 management
      port with a USB-A port under it in one shield (MGMT, and the USB 3 symbol), the stacked SFP+ pair
      with 64 and 65 below it, a strip with the legends ID, SYS and ALM above three lamps and the RST
      pinhole, the 1PPS and 10MHz coaxial jacks, the RJ-45 console (CON) and time-of-day (TOD) jacks stacked
      in one shield, and a green serial-number tab at the foot (guide figure 6 callouts 1 to 9). The panel
      stands where the QFX5240-64QD's does, within 1 mm in the two photographs. The USB tongue is blue
      in the photograph, which is the USB-IF colour of a 3.0 port; the guide says "USB port" only.
  vents:
    confidence: estimated
    note: >-
      Hexagonal holes in the sheet: a band along the top above the cages, a band along the bottom, a column
      at the left edge, a column at the right edge and a field under the clock connectors. Drawn as vent
      decor in those positions, pitched to the photograph and estimated.
  front-green-tab:
    confidence: photo-measured
    note: >-
      The green tab at the foot of the management panel, 17.0 mm wide and 2.7 mm tall, is the chassis
      serial number pull-out (callout 8 of figure 6). It is drawn as decor, because it is a label card
      and not a part the library models.
  logo:
    confidence: photo-measured
    note: >-
      The maker's logo and its lockup are printed at the upper right of the face, above the model name
      QFX5240-64OD. The logo is not drawn: a logo-zone region is reserved where it stands, and the model
      name is drawn as plain text.
  rear-layout:
    confidence: photo-measured
    note: >-
      Rear photograph at 4.323 px/mm, checked against the guide's figure 3: two supplies stacked at the
      left end, supply 0 above supply 1, an earthing pad with two studs and the ground symbol under them,
      then four fan modules numbered 0 to 3 from the left on an 85.7 mm pitch. A fan symbol, the module
      number and an arrow are printed beside each fan opening, and a power symbol with the supply number
      beside each supply. The fan plates measure 80.3 mm wide and 80.0 mm high; the supplies 73.7 mm wide
      and 39.5 mm high.
  earthing:
    confidence: photo-measured
    note: >-
      Two threaded studs 15.5 mm apart on a pad at the left of the rear, under the ground symbol, 6.4
      mm from the left edge. The guide's grounding section (figure 1 and Ground the QFX5240 Switch) calls
      for two M6 screws with star washers and a Panduit LCDXN2-14AF-E lug, which is a two-hole lug on
      5/8 in centres; the 15.5 mm pitch of the photograph agrees. The guide's text puts the terminal "on
      the side of the chassis" and "through the left-front mounting bracket"; the photograph and the guide's
      figure 1 show it on the rear panel, and the photograph is followed.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      The guide's figures 2 and 3 are the same studio photographs at reduced size and agree with them.
      The guide calls the SFP pair "SFP28 ports" in its callouts and the text and the datasheet say SFP+
      10 GbE; the group is stated at 10g. The photograph shows the supplies' hubs carrying the supply
      maker's name; it is a third party's logo and is not drawn.
  modules:
    confidence: datasheet
    note: >-
      The four fan modules (QFX5240-2U-FANAO) and the two power supplies (QFX5240-PWR-AC-AO) are field-replaceable
      units in bays, each its own component (guide Table 6). Nothing on this chassis is a built-in unit
      that is not a bay. Each supply carries its own small fan inside.
  variants:
    confidence: datasheet
    note: >-
      Guide Table 3 and datasheet ordering information: QFX5240-64OD-AO (AC, airflow out) and the spare
      QFX5240-64OD-CHAS, "Spare chassis without PSU and fans". Both share this front panel and the rear
      bays, so each is a configuration of this device. NOT MODELLED: the QFX5241-64OD (-AO, -DO, -DO-T2,
      -CHAS, -TCHAS), a sibling the guide's note and the datasheet name with its own part numbers and
      a DC supply, which has its own hardware guide and is left to its own slice; and the DC supply the
      datasheet lists for the series (QFX5241-PWR-DC-AO), which the QFX5240 guide does not describe.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide names the rack mount kit QFX5240-2U-4PRMK (a four-post tool-less kit, Table
      6 and the datasheet's ordering table). The library holds no contract for it and none is written
      here, so `chassis.ears` and `chassis.kits` are left out and a gap says so. The modelled body is
      the 438.4 mm chassis, without brackets.
  power:
    confidence: datasheet
    note: >-
      Guide Table 13: typical 613 W and maximum 2198 W at 220 to 240 V for the QFX5240-64OD. The datasheet's
      power table says typical 613 W and maximum 2116 W (maximum measured at 40 C with DR optics, typical
      at 25 C with DACs at 50 percent load, excluding transceivers). The maxima differ (2198 and 2116
      W); the guide's is used. AC input: guide Table 4 says 200 to 240 VAC at 16 A maximum, guide Table
      13 says 200 to 277 VAC with 6 A at 200 VAC and 3.8 A at 240 VAC, and the datasheet says 180 to 264
      VAC.
  colour:
    confidence: photo-measured
    note: >-
      The front plate samples #6e7784 (a bare patch near the left edge) and the rear panel #646d79. The
      chassis colour is the front's. The photographs are lit warmly and these are their values, not a
      paint reference.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-life announcement. The guide, published 2026-07-10, and the datasheet, March
      2026, state none and no Juniper notice was found in the intake. The device states none announced.
      Estimated, because absence in the documents is not a notice from the maker.
attrs:
  physical:
    weight-note: 22 kg (48.50 lb) fully loaded without optics (guide Table 7, datasheet Table 2)
  performance:
    throughput: 51.2 Tbps unidirectional and 102.4 Tbps bidirectional (datasheet Table 2)
    forwarding-capacity: 21.2 billion packets per second (datasheet Table 2)
    packet-buffer: 165 MB (datasheet Table 2)
    breakout-ports: >-
      64 x 800 GbE, 128 x 400 GbE, 256 x 200 GbE or 256 x 100 GbE; up to 320 ports at mixed speeds (datasheet
      Table 2)
    osfp-speeds: 800 GbE; 400 GbE and lower with breakout (datasheet Table 2)
  power:
    power-typical-w: 613
    power-max-w: 2198
    power-envelope: as-tested
    power-measurement-note: >-
      Maximum at 40 C ambient with SR optics (datasheet: DR optics) at 100 percent load with IMIX traffic;
      typical at 25 C with DACs at 50 percent load with IMIX traffic, excluding transceivers (guide Table
      13, datasheet)
    power-input-ac: >-
      200 to 240 VAC, 50 to 60 Hz, 16 A maximum (guide Table 4); 200 to 277 VAC (guide Table 13); 180
      to 264 VAC (datasheet)
    redundancy-note: two supplies, 1+1, hot-removable and hot-insertable (guide, Component Redundancy)
  thermal:
    fans: four fan modules of two rotors, N+1 at rotor level; front-to-back only
    airflow-note: >-
      AO is front-to-back (port-to-FRU, airflow out); the guide describes no back-to-front module
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F) (guide Table 17)
    storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container
    humidity: 5 to 90 percent noncondensing, operating
    altitude: >-
      no performance degradation to 1828.8 m (6000 ft) at 0 to 40 C with DAC cables; sea level with optics
      (guide Table 17)
  platform: {cpu: 'Intel Ice Lake, 4 cores, 2.2 GHz', memory: 32 GB (16 GB x 2) DDR4, storage: two internal
      480 GB NVMe SSDs, switch-chip: Broadcom Tomahawk 5 (BCM78900), software: Junos OS Evolved}
  features:
    optics-osfp: >-
      800 GbE OSFP; ports 1, 2, 5, 6, 9, 10 and so on in the two middle rows take high power optics such
      as 800G-ZR and ZR+ (guide, Port Panel note)
    optics-sfp-plus: two 10 GbE ports
  management: {oob: one RJ-45 management port, console: one RJ-45 console port, tod: one RJ-45 time-of-day
      port, usb: one USB port, timing-outputs: 1 PPS and 10 MHz clock connectors}
  compliance:
    safety: >-
      UL 60950-1:2007 R10.14; CAN/CSA-C22.2 No. 60950-1-07 Amd 1:2011 Amd 2:2014; IEC 62368-1:2014 and
      2018; EN 62368-1:2014+A11:2017; UL/CSA 62368-1:2019; IEC/EN 60825-1 (datasheet)
    emc: >-
      FCC 47 CFR Part 15; ICES-003; BS EN 55032; BS EN 55035; EN 300 386; CISPR 32; CISPR 35; IEC/EN 61000
      series; VCCI-CISPR 32; BSMI CNS 15936 (datasheet)
    nebs: >-
      designed to comply with Zone 4 earthquake requirements of NEBS GR-63-CORE, Issue 3 (guide Table
      17)
    substances: RoHS; TSCA; POPs; WEEE; REACH; SCIP (datasheet)
  lifecycle: {eol: none-announced}
chassis: {width: 438.4, height: 87.9, depth: 648.2, ru: 2, weight-kg: 22, color: '#6e7784', airflow: front-to-back,
  power: ac}
gaps:
- what: osfp-cage-depth
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The depth and the registry size of the OSFP cage. The library's std/osfp has no registry entry and
    carries an estimated depth; the 23.1 by 13.5 mm opening it uses was measured on another maker's 2RU
    box and the photograph here agrees with it.
- what: module-depths
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The depth of the fan module and of the power supplies. The guide's figures 15, 16, 18 and 19 carry
    no scale and its tables state weights only for the whole chassis.
- what: chassis-width
  scope:
  - front
  - rear
  reason: sources-disagree
  wanted: >-
    The chassis width. The datasheet's Table 2 says 17.26 in (43.8 cm); the guide's Table 7 says 19.03
    in (48.33 cm), which is 17.26 in plus the front brackets (the rack-requirements table states 19 in
    over the brackets). The datasheet's 17.26 in is used because the photograph's scale is consistent
    with it; the depth differs by 0.01 in (25.52 against 25.51), and the datasheet's is used.
- what: maximum-power
  scope:
  - power
  reason: sources-disagree
  wanted: >-
    The maximum power of the QFX5240-64OD. Guide Table 13 says 2198 W; the datasheet says 2116 W. Same
    measure and same scope (maximum, 40 C, IMIX traffic). The guide's 2198 W is used.
- what: ac-input
  scope:
  - power
  reason: sources-disagree
  wanted: >-
    The AC input of the supply. Guide Table 4 says 200 to 240 VAC at 16 A maximum; guide Table 13 says
    an operating range of 200 to 277 VAC and 6 A at 200 VAC, 3.8 A at 240 VAC; the datasheet says 180
    to 264 VAC. Table 4's range is carried on the supply and every reading is kept in the device's `power-input-ac`.
- what: sfp-port-type
  scope:
  - front
  reason: sources-disagree
  wanted: >-
    The type of the two small cages. The guide's callout 2 calls them "SFP28 ports" and its text and the
    datasheet call them "2 x 10-Gbps SFP+ ports". They are modelled as SFP+ at 10 Gbps.
- what: high-power-optics
  scope:
  - front
  reason: sources-disagree
  wanted: >-
    Which ports take high power optics. The guide's note says that only the front-panel ports in the middle
    rows support them and lists 1, 2, 5, 6, 9, 10 and so on to 61 and 62, which are ports of the second
    and third rows in a column of four, counting from 0. The note is carried in `features.optics-osfp`
    and the face does not mark those ports, because the metal does not.
- what: dc-supply
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The DC supply. The datasheet's ordering table lists QFX5241-PWR-DC-AO as "QFX5240 Series-2RU DC PSU,
    Air Out"; the QFX5240 hardware guide describes AC supplies only and no photograph of a DC build is
    held.
- what: management-lamps
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The lamps of the management jack. Guide figure 14 and Table 10 describe lamps on the management port;
    the photograph shows them at the corners of the upper jack. The jack is drawn with the library's lamped
    jack.
- what: clock-connector-type
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The connector type of the 1PPS and 10MHz jacks. The guide calls them "clock input and output connectors";
    the photograph shows gold coaxial jacks 6 mm across, drawn as the library's SMA jack. Estimated.
- what: rating-labels
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    The rating label of each supply and the serial number labels (figures 45 to 48). Not drawn.
- what: ears-and-kits
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    The rack ears' positions and the rack kit's contract. The guide names QFX5240-2U-4PRMK and no kit
    contract exists in the library; none is written here.
groups:
  osfp-800g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: osfp, speed: 800g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      Ports 64 and 65 as printed, rel-pos carrying the printed number, since the origin token cannot express
      a block that starts at 64.
  osfp-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: link, color: '#22c55e'}
    - {name: activity, color: '#22c55e', behavior: blinking}
    - {name: fault, color: '#f59e0b'}
    - {name: hardware-failure, color: '#ef4444'}
    description: >-
      One RGB lamp per network port, in the strip above the upper band and below the lower band (guide
      Table 8).
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band cluster at the right of the port side - an RJ-45 console port, an RJ-45 management
      port, an RJ-45 time-of-day port, a USB port and the recessed reset button. Five kinds, one purpose:
      reaching, timing and recovering the switch when the data plane cannot.
  timing:
    term: Port
    role: management
    index-origin: 0
    description: >-
      the 1 PPS and 10 MHz connectors, a pair of coaxial jacks for the switch's timing references
  status-leds: {term: LED, role: indicator, index-origin: 0, description: 'The three chassis lamps ID,
      SYS and ALM (guide Table 9).'}
  grounding:
    term: Stud
    role: furniture
    index-origin: 0
    description: >-
      the protective earthing terminal, a pad with two M6 studs at the left of the rear (guide, Ground
      the QFX5240 Switch)
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: 3+1
      redundancy-note: >-
        QFX5240 hardware guide, Component Redundancy: four fan modules of two rotors each, N+1 redundancy
        at rotor level; the fan modules are hot-insertable and hot-removable
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        two supplies, 1+1; hot-removable and hot-insertable without shutting the switch down (guide, Component
        Redundancy)
