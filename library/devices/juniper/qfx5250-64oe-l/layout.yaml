format: 1
kind: device
name: qfx5250-64oe-l
version: 0.1.3
maturity: modelled
manufacturer: Juniper
model: QFX5250-64OE-L
portfolio: {line: QFX Series, family: QFX5250}
description: >-
  Juniper QFX5250-64OE-L, a 2OU liquid-cooled 1.6T data-centre leaf and spine switch for an Open Rack v3 (ORv3)
  rack, running Junos OS Evolved. The port side has 64 OSFP ports (1.6 TbE, for ORHS transceivers with a riding
  heat sink) in two banks of eight columns of four, with a lamp for every port. It also has two SFP28 ports (10 or
  25 GbE), the RJ-45 management and console ports, a USB port, the 10 MHz and 1 PPS connectors, the ON/OFF and
  reset buttons and the LEAKAGE, ID, SYS and ALM lamps. A switch handle stands at each end of the port bank. The
  rear has no power supplies and no fan modules. It carries a coolant outlet (hot) and inlet (cold) UQDB06 plug at
  the ends and the IT gear input connector in the middle, which blind-mates with the rack's busbar. It is the only
  model the guide describes.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper QFX5250 Switch Hardware Guide, published 2026-06-17, 140 pages (copyright Juniper Networks, 2026), from
      https://www.juniper.net/documentation/us/en/hardware/qfx5250/qfx5250.pdf: the front and rear views (figures 8
      and 9), the front panel (figure 10, Table 7) and rear panel (figure 11, Table 8) with their flat figures
      g051820 and g051821, Table 2 (key specifications), Table 4 (physical specifications), Table 5 (environmental),
      Table 6 (models), Tables 9 and 10 (power and cooling, configurations), Tables 12 to 18 (lamps and buttons), Tables
      19 and 20 (ports), the Channelization list (page 48), the section "Connect 1-PPS and 10-MHz Timing Devices" (page 85), Tables 21 to 24 (power and flow), Tables 25 and 26 (packing list) and the agency approvals.
      It is a public document of the maker. Terms: a copyright notice and an end-user licence agreement only. No
      public datasheet for the QFX5250 was found (the maker's datasheet pages and a search for one turned up
      none), and Juniper's image library has no photograph of this model at the address its other models use
      (qfx-series/QFX5250-64OE-L/QFX5250-64OE-L-front-high.jpg and -rear-high.jpg both answer 404, as do the lower
      case and the QFX5250-64OE spellings). The Juniper community post announcing the model carries only stock and
      screenshot images. So no photograph, Visio stencil or 3D model was held or found, and the guide's two flat
      figures are the only source of the faces.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 4: 3.649 in (9.27 cm) high, 21 in (53.34 cm) wide, 31.71 in (80.5 cm) deep, 105.82 lb (48.00 kg).
      The inch figures are used (92.68, 533.4 and 805.43 mm) and the centimetre ones in the same cells are rounded
      copies. Table 2 says "2 OU - for liquid-cooled model". 2 OU is two Open Rack units of 48 mm, so 96 mm of
      pitch, of which the body fills 92.7. `ru: 2` states those two units (the guide's own count): the schema has
      no Open Rack `mount` value, so the unit is the ORv3 rack's and not an EIA U, and the DCIM export writes 2
      for it. The body is the whole outline of the flat figures: no rack ears are drawn (the ORv3 tray carries
      ejector levers and handles instead).
  gate-1:
    confidence: drawing
    note: >-
      Figure 10 (g051820) is a 3144 x 1200 px raster in the PDF. Its outer frame measures 2699 x 468 px, an aspect
      of 5.767 against the table's 533.4 / 92.68 = 5.755 (0.2 percent), so it is orthographic and carries geometry.
      Scale 5.055 px/mm on both axes, origin the outer frame's top-left corner; every front position is read at that
      scale and is good to about 0.3 mm. Figure 11 (g051821, 3000 x 904 px) has an outer frame of aspect 5.80 (0.8
      percent out); its scale is taken across, 5.09 px/mm, and the rear positions are good to about 0.5 mm.
  ports:
    confidence: drawing
    note: >-
      Figure 10: 64 OSFP openings in two banks of eight columns of four. Each opening is 23.1 mm wide on a 23.1 mm
      pitch (abutting, as the registry's std/osfp). The left bank starts at 71.2 mm and ends at 256.0, the right bank
      starts at 276.2 and ends at 461.0, so the two banks sit symmetric about the face centre (266.7) to 0.7 mm.
      Row centres read 19.3, 39.2, 57.5 and 77.4 mm: rows one and two are a stacked pair 19.9 apart, rows three and
      four another 19.9 apart, 18.3 between the pairs. The openings drawn are 12.7 mm tall; the registry's 13.5 is
      used. Estimated within 0.3 mm.
  stack-orientation:
    confidence: drawing
    note: >-
      The connector slot stands at 0.55 of the opening's height in rows one and two and at 0.41 and 0.44 in rows
      three and four, so the lower pair is the upper pair turned over: rows one and two are drawn 0 and rows three and
      four 180, each pair turned alike as the OSFP MSA stacks are (lint L108). Read off the figure's cage art, not
      seen on hardware.
  port-numbering:
    confidence: drawing
    note: >-
      Printed on the metal in the bands between the rows, each column prints "n up-arrow, down-arrow n+1" between
      rows one and two and "n+2 up-arrow, down-arrow n+3" between rows three and four, so column c holds ports 4c to
      4c+3 from the top and the ports run 0 to 31 across the left bank and 32 to 63 across the right (guide
      callout 10, Table 7: 64 ports numbered 0 to 63). The two SFP28 ports print "down-arrow 64" above the upper
      and "up-arrow 65" below the lower (guide Table 2, callout 11). Interface names are not printed: the guide
      names them et-0/0/N, with N the port number as printed, so the OSFP ports are et-0/0/0 to et-0/0/63 and the
      SFP28 ports et-0/0/64 and et-0/0/65, all on FPC 0 and PIC 0 (Table 19); that is recorded here and not in an
      interfaces block, because the face does not print it.
  port-lamps:
    confidence: drawing
    note: >-
      Each OSFP port has one bicolour lamp, red and green (guide Table 17). Figure 10 draws 64 small lamps in
      sixteen stacks of four, numbered 0 to 63 beside them: 0 to 15 left of the first four columns (four stacks,
      one at each row's height), 16 to 31 and 32 to 47 either side of the gap between the banks (left stack 16 to 31,
      right 32 to 47), and 48 to 63 right of the last column. A stack is four lamps 2.8 mm apart centred on its row,
      and the lamp number is the port number it serves. Stack x positions 64.3, 264.0, 269.0 and 469.4 mm; the printed
      numbers stand on the outer side (right of the left-edge stack, left of the right-edge stack). That the lamp
      number is the port number is the guide's label under the lamp matrix ("LED lane 0 to 63") read with its
      lamp tables; the figure does not draw a leader from a lamp to a cage.
  status-and-mgmt:
    confidence: drawing
    note: >-
      Figure 10, right of the right bank: the ON/OFF button (a grey disc, callout 5) above the 10MHz and 1PPS DIN
      connectors (callout 4, a pair of round coaxial jacks 6.9 mm across, 7.9 mm apart); the MGMT jack (callout 3)
      with a Torx screw above and below it; the LEAKAGE lamp (callout 6); the CONSOLE jack (callout 9) with the ID,
      SYS and ALM lamps (callout 7) beside it, the USB 3.0 Type-A port with the SuperSpeed mark (callout 8) and the
      RST pinhole. Both jacks stand turned a quarter turn, the latch on the right; the MGMT jack shows its two
      lamps at the top and bottom of the right edge (guide Table 14: link activity and status), the console jack
      none. The lamps ID, SYS, ALM and LEAKAGE are narrow vertical slots. At the left of the face, the two SFP28
      cages are stacked (callout 11), both turned a quarter turn with the latch on the right, framed by a printed
      bracket; below them is the serial-number pull-tab with its QR code (callout 12).
  timing-connector:
    confidence: datasheet
    note: >-
      Guide section "Connect 1-PPS and 10-MHz Timing Devices" (printed page 85, PDF page 92): the ports "require 2x1
      DIN 1.0/2.3 latching plug connectors", which is the library's common/din-1-0-2-3-jack. The same section says
      the ports can serve as inputs or outputs, and that the switch "does not currently support timing features".
  handles-and-levers:
    confidence: drawing
    note: >-
      Callout 1 (two switch handles) points at the two tall capsule recesses either side of the port banks (8.9 and
      8.4 mm wide, 53 mm tall, at 52.4 and 473.5 mm); callout 2 (two ejector levers) at the grey bars along the top
      edge, 4.7 mm tall, from 11.5 to 240.7 mm and 290.6 to 522.3 mm, with a latch box at the join. They are
      decor: they are drawn as the figure draws them and estimated. The pins that stand out of the frame at each end
      of the lever line are not drawn.
  logo:
    confidence: drawing
    note: >-
      The maker's logo and its lockup are printed at the upper left of the face, above the model name. The logo is
      not drawn: a logo-zone region is reserved where it stands, and the model name is drawn as plain text. The
      figure prints the model as "QFX5250-64OE-L".
  rear:
    confidence: drawing
    note: >-
      Figure 11 (guide Table 8), seen from the rear, left to right: the coolant outlet (hot) plug at the left end
      (callout 1, "Outlet (Hot)"), the IT gear input connector in the middle (callout 2) and the coolant inlet
      (cold) plug at the right (callout 3, "Inlet (Cold)"). Each plug stands in a rounded housing 45 mm wide and 62 mm
      tall, 8.0 mm from its end, round plug 29.5 mm across at x 30.3 and 500.2, y 62.2. The IT gear connector is a
      26 mm wide blind-mate clip body with a round stud plate either side (59 mm over both) and an earth mark above
      it. Thirteen round screw heads are spaced over the plate (decor; four small cross-head screws at the plug plates are not drawn). The plugs are the guide's UQDB06
      universal quick-disconnect blind-mate plugs of the Open Compute standard, and the connector engages the busbar
      of the rack as the switch slides in.
  no-frus:
    confidence: datasheet
    note: >-
      "QFX5250-64OE-L, the liquid-cooled QFX5250 switch, does not have any FRUs" (guide, QFX5250 Field-Replaceable
      Units); Table 9 gives 0 slots for power supplies and 0 for fan modules, none shipped. There is no bay on
      either face. The three DC-to-DC 1600 W bricks the show chassis hardware output names (PSM 0 to 2, BUILTIN) are
      inside the chassis, built in, and not field-replaceable units, so they are part of the chassis and are
      recorded in the power figures and here, not as bays. The SSDs are two internal 200 GB NVMe drives reached
      from the underside under a cover plate and, on this model, a heatsink (guide figures 31 to 35); they are not
      on a face and are not modelled as a bay.
  power:
    confidence: datasheet
    note: >-
      Table 21: DC input 46 to 56 VDC (minimum 46), 110 A, maximum power output 4300 W, maximum consumption 3435 W
      and typical 3375 W, both loaded with DR optics. The guide says the switch converts the 46 to 56 V of the rack
      to a maximum output of 4300 W; Table 9 prints 4800 W for the same figure (recorded as a gap, 4300 used,
      since it is the figure in three places). The rack supplies 46 to 56 V (51 V at the bricks) and the chassis
      states power dc, the nearest word the schema has: its dc is telecom -48 V and an ORv3 busbar is a positive rail,
      recorded here and in the attrs, as celestica/ds6001 does.
  cooling:
    confidence: datasheet
    note: >-
      100 percent liquid-cooled, no fans (Table 9, "Fan modules 0"; Table 5, noise not applicable). Coolant OAT PG 25
      through UQDB06 plugs; flow 10 litres a minute, 25 to 40 PSI, coolant 7 to 45 C, ambient 0 to 40 C (Table 23).
      The rack's manifold ports are 96 mm apart (figure 16). The chassis airflow is none; the schema has no value
      for it, so `chassis.airflow` is left out.
  colour:
    confidence: estimated
    note: >-
      The figures are line drawings with no colour and no photograph is held. The chassis colour is the sampled
      sheet metal of juniper/qfx5130-32cd (#8a8a8b), borrowed as the Juniper data-centre switch finish, and is
      estimated.
  variants:
    confidence: datasheet
    note: >-
      Table 6 lists one model, QFX5250-64OE-L, for the ORv3 rack; Table 10 lists one hardware configuration with no
      spare-chassis part number; the regulatory model is also QFX5250-64OE-L. The guide describes no AC, DC, air
      cooled, four-post-rack or bays-open variant, so the device has one configuration. The table's other columns
      (AC PSU powered, DC PSU powered, air cooled, four-post rack) are empty for it.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide says rails are not provided with the switch and that standard 1OU ORv3 rails must be
      used to install the 2OU switch (note under figure 2); it names no rail kit part number. The library has no
      Open Rack mount value and no ORv3 rail kit contract, so `chassis.ears` and `chassis.kits` are left out.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-life announcement. None was found and the guide, published 2026-06-17, states none;
      the model was announced in June 2026. The device states none announced. Estimated, since a negative search
      is not the maker's statement.
attrs:
  physical:
    rack-form: 2OU, Open Rack v3 (ORv3) tray; no four-post rack variant (guide Tables 2 and 6)
    weight-note: 105.82 lb (48.00 kg) (guide Table 4)
  performance:
    throughput: 102.4 Tbps (guide Table 2)
    port-count: 64 OSFP at up to 1600 Gbps and 2 SFP28 (guide Table 2)
    breakout-ports: 1x1600G, 1x800G, 2x800G, 2x400G, 4x400G, 4x200G, 8x200G and 8x100G; up to 512 ports (guide, Channelization)
    osfp-speeds: 1600G, 800G, 400G, 200G and 100G, by transceiver (guide, Interface Naming; Table 19)
  power:
    power-typical-w: 3375
    power-max-w: 3435
    power-envelope: as-tested
    power-measurement-note: loaded with DR optics (guide Table 21)
    power-output-max-w: 4300
    power-input-dc: 46 to 56 VDC from the ORv3 busbar, 110 A (guide Table 21)
    redundancy-note: three built-in 1600 W DC-to-DC bricks with no redundancy; a brick failure disables the optics (guide, DC-to-DC Power Bricks)
  thermal:
    cooling: 100 percent liquid-cooled; OAT PG 25 coolant through two UQDB06 plugs; no fans
    coolant-flow: 10 litres per minute, 25 to 40 PSI, coolant 7 to 45 C (guide Table 23)
  environmental:
    operating-temp: 0 to 46 C (32 to 114.8 F) at sea level, 0 to 40 C up to 6000 ft (guide Table 5); recommended ambient 0 to 40 C with liquid cooling (Table 23)
    storage-temp: -40 to 70 C (-40 to 158 F) (guide Table 5)
    humidity: 10 to 90 percent noncondensing operating, 5 to 95 percent non-operating (guide Table 5)
    altitude: operating 6000 ft (1830 m); storage 15000 ft (4500 m) (guide Table 5)
  platform:
    cpu: Intel 6-core 2.8 GHz Ice Lake D, 32 GB DRAM (guide Table 2)
    storage: two internal 200 GB NVMe SSDs (guide Table 2)
    switch-chip: Broadcom Tomahawk 6, BCM78914 (guide Table 2)
    software: Junos OS Evolved
  features:
    optics-osfp: ORHS (OSFP with riding heat sink) transceivers, 1600G; see the Hardware Compatibility Tool (guide Table 19)
    optics-sfp28: ports 64 and 65 take 25G and 10G SFP28 transceivers (guide Table 19)
    leak-detection: leakage detection controller with the LEAKAGE lamp; the ON/OFF button restarts boot after a leak (guide, Leakage Detection)
  management:
    oob: one RJ-45 management port, 10 M, 100 M and 1 G (guide Table 20)
    console: one RJ-45 console port, shared between the CPU and the leakage detection controller board
    usb: one Type-A USB 3.0 port
    timing-outputs: one 1 PPS and one 10 MHz port on 2x1 DIN 1.0/2.3 latching connectors. The guide says they can be inputs or outputs. It also says the switch does not currently support timing features (guide, Connect 1-PPS and 10-MHz Timing Devices)
  compliance:
    safety: IEC 62368-1:2014, 2018 and 2023; EN 62368-1:2014+A11:2017; UL 60950-1:2007 R10.14; CAN/CSA-C22.2 No. 60950-1-07; UL/CSA 62368-1:2025; IEC/EN 60825-1 (guide, Agency Approvals)
    emc: FCC 47 CFR Part 15; ICES-003 / ICES-GEN; EN 55032; EN 55035; CISPR 32; CISPR 35; EN 300 386 V1.6.1 and V2.2.1; IEC/EN 61000-3-2 and 61000-3-3; AS/NZS CISPR 32; VCCI-CISPR 32; BSMI CNS 15936; KS C 9835, 9832 and 9610 (guide, Agency Approvals)
    class: Class A (guide, Compliance Statements)
    seismic: tested for Zone 4 earthquake requirements to NEBS GR-63-CORE (guide Table 5)
  lifecycle:
    eol: none-announced
