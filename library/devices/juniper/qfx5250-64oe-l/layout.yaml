configurations:
  orv3-liquid:
    kind: orderable
    default: true
    description: >-
      QFX5250-64OE-L, the liquid-cooled 2OU switch for an ORv3 rack: 64 OSFP ports, two SFP28 ports, powered from the
      rack busbar (46 to 56 VDC, three built-in DC-to-DC bricks) and cooled by the rack's coolant through two
      UQDB06 plugs. No power supply and no fan module is shipped or fits (guide Tables 9 and 10).
    part-numbers:
      QFX5250-64OE-L: {}
