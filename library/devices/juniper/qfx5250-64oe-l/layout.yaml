gaps:
- what: datasheet-and-photographs
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    A QFX5250 datasheet and the maker's studio photographs of the model, front and rear. None was found, so the
    chassis colour, the finish of the levers and handles, the lamp colours and the legends' ink are not read off
    hardware. The front and rear are drawn from guide figures 10 and 11 alone.
- what: open-rack-mount
  reason: vendor-silent
  wanted: >-
    An Open Rack mount value and an ORv3 rail kit contract (the library has neither; the guide names no rail
    kit). The body is a 2OU tray, 21 in wide: `ru: 2` is the guide's count of Open Rack units, and a viewer that
    treats it as two 44.45 mm EIA units draws a tray that is 21 in wide and 96 mm tall in a 19-in rack. The
    sibling celestica/ds6001 states no `ru` instead.
- what: power-output-figure
  scope: [power]
  reason: sources-disagree
  wanted: >-
    The maximum power output. Table 21 and the power text say 4300 W; Table 9 says 4800 W. 4300 W is used.
- what: lamp-to-port-assignment
  scope: [port-leds]
  reason: needs-photo
  wanted: >-
    A leader or a photograph showing which cage each of the 64 lamps serves. The lamps are numbered 0 to 63 and
    the number is taken as the port number; the figure draws no leader.
- what: sfp28-marks
  scope: [front]
  reason: needs-photo
  wanted: >-
    What the small "U" and arch marks printed beside the two SFP28 cages mean; they are not drawn. The guide's
    callout 11 names only the cages. The SFP28 role is "in-band management ports" in the front-panel text and
    network ports in Table 19.
- what: console-jack-lamps
  scope: [front]
  reason: vendor-silent
  wanted: The console jack draws no lamps in figure 10; the management jack's two lamps are described in Table 14.
- what: module-depths
  scope: [rear]
  reason: vendor-silent
  wanted: The depth of the UQDB06 plugs and the busbar connector; no figure gives one.
- what: management-port-lamp-colours
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The lamp colours of the management jack beyond "green" for link activity and "solid green" for 1 Gbps (Table
    14); the speed lamp's colours at 10 and 100 Mbps are not stated.
- what: rating-label
  scope: [rear]
  reason: needs-photo
  wanted: A rating label, if any; the rear figure draws none.
groups:
  osfp:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: osfp, speed: 1.6t}
    description: 64 OSFP ports, numbered 0 to 63 down each column of four, for ORHS transceivers (OSFP with a riding heat sink).
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
    description: Ports 64 and 65 as printed, rel-pos carrying the printed number, since the origin token cannot express a block that starts at 64. 10 or 25 GbE; the guide calls them in-band management ports.
  port-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: link, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: fault, color: '#ef4444'}, {name: disabled, color: '#f59e0b'}]
    description: One bicolour red and green lamp per OSFP port, numbered with the port (guide Table 17).
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the way into the box from the port side - an RJ-45 console port, an RJ-45 management port, a USB port,
      the ON/OFF button and the recessed reset button. Five parts, one purpose: reaching, starting and recovering
      the switch when the data plane cannot.
  timing:
    term: Port
    role: management
    index-origin: 0
    description: the 10 MHz and 1 PPS connectors, two coaxial jacks for the timing references, which the guide says can be inputs or outputs (the switch does not currently support timing features)
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The chassis lamps ID, SYS and ALM (guide Table 13) and LEAKAGE (Table 24).
  liquid-cooling:
    term: Coupler
    role: service
    index-origin: 0
    description: The two UQDB06 quick-disconnect plugs, outlet (hot) and inlet (cold), that blind-mate with the rack's coolant manifolds.
  power-input:
    term: Inlet
    role: service
    index-origin: 0
    description: The IT gear input connector that blind-mates with the ORv3 busbar.
