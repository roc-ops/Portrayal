configurations:
  base:
    kind: base
    default: true
    description: >-
      The switch as the base AC order ships: one Routing Engine (RE0), three AC power supplies, four fan trays and the
      blank panels, with both line card slots covered. Line cards are ordered separately.
    bays:
      mpc-0: juniper/ex9253-lc-blnk@1
      mpc-1: juniper/ex9253-lc-blnk@1
  base-ac:
    kind: orderable
    description: >-
      EX9253-BASE-AC: the EX9253-CHAS-3RU chassis with one Routing Engine (EX9253-RE), four fan trays (JNP-FAN-3RU), three
      AC power supplies (JNP-PWR1600-AC, in PSM0 to PSM2 as drawn), the cable management bracket and air filter unit
      (JNP-CM-3RU) and blank panels for the empty slots (EX9253-LC-BLNK). First Junos OS release 18.2R1. Front-to-back
      airflow.
    part-numbers:
      EX9253-BASE-AC: {}
  base-dc:
    kind: orderable
    power: dc
    description: >-
      EX9253-BASE-DC: as the base AC order with three DC power supplies (JNP-PWR1100-DC) in place of the AC ones.
    bays:
      psm-0: juniper/ex9253-jnp-pwr1100-dc@1
      psm-1: juniper/ex9253-jnp-pwr1100-dc@1
      psm-2: juniper/ex9253-jnp-pwr1100-dc@1
    part-numbers:
      EX9253-BASE-DC: {}
  red-ac:
    kind: orderable
    description: >-
      EX9253-RED-AC: the redundant order, with two Routing Engines (RE0 and RE1) and four AC power supplies (PSM0 to
      PSM3 as drawn); otherwise as the base AC order.
    bays:
      re-1: juniper/ex9253-re@1
      psm-3: juniper/ex9253-jnp-pwr1600-ac@1
    part-numbers:
      EX9253-RED-AC: {}
  red-dc:
    kind: orderable
    power: dc
    description: >-
      EX9253-RED-DC: the redundant order with two Routing Engines and four DC power supplies (JNP-PWR1100-DC).
    bays:
      re-1: juniper/ex9253-re@1
      psm-0: juniper/ex9253-jnp-pwr1100-dc@1
      psm-1: juniper/ex9253-jnp-pwr1100-dc@1
      psm-2: juniper/ex9253-jnp-pwr1100-dc@1
      psm-3: juniper/ex9253-jnp-pwr1100-dc@1
    part-numbers:
      EX9253-RED-DC: {}
  chas:
    kind: orderable
    description: >-
      EX9253-CHAS-3RU, the spare chassis (datasheet FRU table). It ships without Routing Engines, supplies or fan
      trays, which are ordered separately; the bays are shown open.
    bays:
      re-0: ''
      re-1: ''
      mpc-0: ''
      mpc-1: ''
      psm-0: ''
      psm-1: ''
      psm-2: ''
      psm-3: ''
      psm-4: ''
      psm-5: ''
      fan-0: ''
      fan-1: ''
      fan-2: ''
      fan-3: ''
    part-numbers:
      EX9253-CHAS-3RU: {}
