name: qfx10002-60c
version: 0.1.0
maturity: modelled
manufacturer: Juniper
model: QFX10002-60C
portfolio:
  line: QFX Series
  family: QFX10002
description: >-
  Juniper QFX10002-60C, a fixed 2RU deep-buffer spine and core switch with 60 QSFP28 ports in two bands
  of 30. Every port auto-senses a 100 GbE QSFP28 or a 40 GbE QSFP+ transceiver, and any 40 GbE port can
  be channelized to four 10 GbE interfaces with breakout cables. The management panel at the right of
  the front has an RJ-45 management port above an RJ-45 console, an SFP management port, an SFP PTP
  Ethernet port, 1PPS and 10 MHz timing connectors, a USB port and four status lamps. The rear has four
  1600 W power supply bays numbered down the columns, all filled, three fan modules of the 60C's own
  type and an ESD point. Cooling is port-to-FRU (front-to-back) only. The AC, the DC and the spare
  chassis builds are configurations.
profile: networking
