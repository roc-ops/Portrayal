configurations:
  base:
    kind: base
    source: >-
      vendor - Juniper publishes this as an orderable bundle. The hardware guide's
      'MX10008 Components and Configurations' table (MX10008-BASE) lists one RCB with one
      Routing Control Board cover, three power supplies with three power supply covers,
      and eight line card covers, over the note that line cards and the cable management
      system are not part of the base configuration. The table gives no part number for
      the RCB or power supply covers; JNP10K-RE-BLNK and JNP10K-PWR-BLNK, named for the
      same cages in the MX10004 guide, are carried over. This base draws exactly that:
      one board in RCB slot 0 and its cover in slot 1, three supplies and a cover in each
      of the other three supply slots, and a cover in each of the eight line-card slots.
      The five switch fabric boards and their cover sit inside the chassis, not visible
      from outside, and no bay for them is drawn.
    default: true
    description: >-
      The chassis as Juniper ships MX10008-BASE. One routing and control board with a
      cover over the second slot. Three power supplies with a cover over each of the
      other three, fans, and a cover in each of the eight line-card slots. Line cards are
      ordered separately.
    bays:
      cb1: juniper/jnp10k-re-blnk@1
      psu3: juniper/jnp10k-pwr-blnk@2
      psu4: juniper/jnp10k-pwr-blnk@2
      psu5: juniper/jnp10k-pwr-blnk@2
      fpc0: juniper/jnp10k-lc-blank@1
      fpc1: juniper/jnp10k-lc-blank@1
      fpc2: juniper/jnp10k-lc-blank@1
      fpc3: juniper/jnp10k-lc-blank@1
      fpc4: juniper/jnp10k-lc-blank@1
      fpc5: juniper/jnp10k-lc-blank@1
      fpc6: juniper/jnp10k-lc-blank@1
      fpc7: juniper/jnp10k-lc-blank@1
