format: 1
kind: device
name: mx10008
version: 4.0.0
maturity: modelled
manufacturer: Juniper
model: MX10008
portfolio:
  line: MX Series
  family: MX10000 Universal Routing Platform
description: >-
  Juniper MX10008 - the 13RU, eight-slot MX10000 chassis. Two JNP10K-RE1
  Routing and Control Boards stack under the badge strip beside the
  status lamp panel; eight full-width line-card slots (FPC 0-7) fill the
  front in two banks of four. The rear is a six-high PSU stack beside
  two tall fan trays covering the Switch Interface Boards.
profile: networking
provenance:
  sources:
    note: >-
      MX10008 Hardware Guide, the MX10008/MX10016 5G datasheet, the front studio photograph and
      the rear line drawing g050553
  chassis:
    confidence: datasheet
    note: >-
      datasheet-table - 22.6 x 17.4 x 32 in (574 x 442 x 813 mm chassis only), 13U; flange extends
      the rack face to 19 in. Ears NOT MODELLED by convention
  front:
    note: >-
      photo - the front photograph at ~2.99 px/mm across the 442 mm body: badge strip 0-21, RCB
      slots at y 22.0 and 60.1 (1.5 in slot height as MX10004), service band to y 117, line-card
      banks at y 117.0 + i*48.4 and y 317.6 + i*48.4 with the thin divider between them; positions
      approximate to ~2 mm
  slot-numbering:
    note: >-
      guide - FPC 0-7 top-down (the CLI terminology table maps FPC n, n 0-7, to the slots); the
      photograph's slot labels are not legible, so top-down follows the family convention
  rear:
    confidence: drawing
    note: >-
      drawing - g050553 (isometric, fractions only): one six-high stack of JNP10K-PWR supplies at
      the left, two tall fan trays right. The MX10008 rear has no usable photograph in the intake
      - see gaps. Each supply bay is 91.4 x 88.9 mm, the JNP10K-PWR-AC2 as the guide's Table 55
      gives it (3.6 in. wide, 3.5 in. high; guide page 184), and the six stand one above the next
      with no gap, as the figure draws them, the earthing terminal's strip below PSU 5. The bays
      were 84.0 x 93.5 mm, spread over the fan trays' height. The guide's Table 12 gives the fan
      trays 6.6 in. (16.8 cm, about 167.6 mm) wide and 22.4 in. (56.9 cm) high (guide page 61), and
      juniper/jnp10008-fan@2, juniper/jnp10008-fan2@2 and juniper/jnp10008-fan3@2 are drawn at that
      size; juniper/jnp10008-fan@1, juniper/jnp10008-fan2@1 and juniper/jnp10008-fan3@1, 176 x 560
      mm from the drawing, are kept for a saved rack that names them. The two fan bays are 167.6 x
      569.0 mm, the size of the QFX10008's, and stand against the supply column and against each
      other, centred in the 574 mm height (y 2.5). 91.4 + 2 x 167.6 mm is 426.6 mm of the 442 mm
      body, and no figure shows the other 15.4 mm, so it is left empty at the right edge, an estimate
  power:
    confidence: datasheet
    note: >-
      datasheet-table - JNP10K-PWR-AC2 5.5 kW each as the MX10004; the guide also lists the AC3
      unit (gap). The MX10000 and MX10008/MX10016 datasheets both state typical power consumption
      12 kW, fully loaded, naming no ambient or side - carried as power-typical-w. The guide rates
      every FRU by ambient (Table 47, including the fan trays: JNP10008-FAN 475 W, -FAN2 1207 W,
      -FAN3 1620 W) and works an example of 14,110 W for eight MX10K-LC2101 in a redundant
      configuration (2710 W + 11,400 W) - a sample, not carried
  color:
    note: >-
      photo - dark grey chassis, silver card faces, light-blue levers and accent line (as MX10004)
  other-faces:
    note: >-
      near-blank by evidence - rail bands estimated; axis conventions per viewer3d.js as the
      siblings

attrs:
  physical:
    weight-empty-kg: 65.86
    weight-base-kg: 133
  power:
    power-typical-w: 12000
    power-envelope: fully-configured
    power-typical-scope: datasheet - typical, fully loaded (MX10000 and
      MX10008/MX10016 datasheets); no ambient or side named
chassis:
  width: 442.0
  height: 574.0
  depth: 813.0
  ru: 13
  color: '#565b61'
gaps:
  - what: rcb-which-board
    scope: [res]
    reason: needs-photo
    wanted: >-
      a photograph of a real RCB's model label. The board in this chassis's own photographs
      carries four SFP cages numbered 0-3 and no BITS, ToD, RESET or Online/Offline
      hardware, which matches neither Juniper faceplate figure - not Figure 46 (JNP10K-RE1
      family, two reserved XGE cages) nor Figure 45 (JNP10K-RE3 family).
      juniper/jnp10k-re1@2 follows the figure it is named for; the detail is in
      provenance/which-board-the-photographs-show on that contract. The label does not
      resolve at the scale of any photograph held here.
  - what: rear-photo
    reason: needs-photo
    wanted: a photograph of the rear - only the isometric line drawing
      g050553 exists, so PSU stack and fan tray geometry are fractional
      readings and finish is inferred.
  - what: psu-variants
    scope: [psus]
    reason: needs-photo
    wanted: the JNP10K-PWR-AC3 (four-feed) and DC faces; only AC2 is
      modelled.
  - what: psu-ac2-face
    scope: [psus]
    reason: needs-photo
    wanted: >-
      a flat figure or square-on photograph of the JNP10K-PWR-AC2 face; the guide gives its outer
      size (Table 55) and isometric drawings, so juniper/jnp10k-pwr-ac2@2 refits the face of
      version 1 to 91.4 x 88.9 mm by estimate
  - what: line-card-catalogue
    scope: [fpcs]
    reason: needs-photo
    wanted: LC4800/LC4802 faceplates - named with dimensions and power
      in the guides but with no usable face art in the extraction.
  - what: sfb-bays
    reason: needs-photo
    wanted: the switch fabric boards (JNP10008-SF, JNP10008-SF2) and their cover
      (JNP10008-SF-BLNK2) sit inside the chassis behind the fan trays, where no face
      shows them. Vendor count is five boards and one cover on the base; none is drawn.
groups:
  res:
    term: Slot
    role: service
    index-origin: 0
    description: Routing and Control Board slots CB0 and CB1
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - mx10008 hardware guide, "MX10008 Component Redundancy": one RCB in the base configuration, two in the redundant one; with two fitted one is primary and the other backup, and the backup takes over if the primary or any part of it fails. The RCB consolidates the Routing Engine function with the control plane function in a single unit, so this one form covers both'
  fpcs:
    term: Slot
    role: traffic
    index-origin: 0
    description: line-card slots FPC 0-7, numbered top-down
  psus:
    term: PSU
    role: service
    index-origin: 0
    description: six power supply slots, one stack at the rear left
    attrs:
      redundancy: 'n+1'
      redundancy-note: 'n+1 - three power supplies for minimum operation; additional supplies provide n+1 redundancy (2n source redundancy on the feeds)'
  cooling:
    term: Tray
    role: service
    index-origin: 0
    description: two tall fan trays; SIBs sit behind them
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the chassis status lamp panel beside the RCBs
