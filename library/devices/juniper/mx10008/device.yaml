format: 1
kind: device
name: mx10008
version: 1.0.4
maturity: modelled
manufacturer: Juniper
model: MX10008
portfolio:
  line: MX Series
  family: MX10000 Universal Routing Platform
description: >-
  Juniper MX10008 - the 13RU, eight-slot MX10000 chassis. Two JNP10K-RE1
  Routing and Control Boards stack under the badge strip beside the
  status lamp panel; eight full-width line-card slots (FPC 0-7) fill the
  front in two banks of four. The rear is a six-high PSU stack beside
  two tall fan trays covering the Switch Interface Boards.
provenance:
  sources: MX10008 Hardware Guide (extracted into working/images/mx10008/),
    the MX10008/MX10016 5G datasheet, the front studio photograph and the
    rear line drawing g050553
  chassis: 'datasheet-table - 22.6 x 17.4 x 32 in (574 x 442 x 813 mm
    chassis only), 13U; flange extends the rack face to 19 in. Ears NOT
    MODELLED by convention'
  front: 'photo - the front photograph at ~2.99 px/mm across the 442 mm
    body: badge strip 0-21, RCB slots at y 22.0 and 60.1 (1.5 in slot
    height as MX10004), service band to y 117, line-card banks at
    y 117.0 + i*48.4 and y 317.6 + i*48.4 with the thin divider between
    them; positions approximate to ~2 mm'
  slot-numbering: 'guide - FPC 0-7 top-down (the CLI terminology table
    maps FPC n, n 0-7, to the slots); the photograph''s slot labels are
    not legible, so top-down follows the family convention'
  rear: 'drawing - g050553 (isometric, fractions only): one six-high
    stack of JNP10K-PWR supplies at the left, two tall fan trays right.
    The MX10008 rear has no usable photograph in the intake - see gaps'
  power: 'datasheet-table - JNP10K-PWR-AC2 5.5 kW each as the MX10004;
    the guide also lists the AC3 unit (gap)'
  color: 'photo - dark grey chassis, silver card faces, light-blue
    levers and accent line (as MX10004)'
  other-faces: 'near-blank by evidence - rail bands estimated; axis
    conventions per viewer3d.js as the siblings'
attrs:
  physical:
    weight-empty-kg: 65.86
    weight-base-kg: 133
chassis:
  width: 442.0
  height: 574.0
  depth: 813.0
  ru: 13
  color: '#565b61'
groups:
  res:
    term: Slot
    role: service
    index-origin: 0
    description: Routing and Control Board slots CB0 and CB1
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - mx10008 hardware guide, "MX10008 Component Redundancy": "The MX10008 router can have one RCB in a base configuration or two RCBs in a redundant configuration. When two RCBs are installed, one functions as the primary and the other functions as the backup. If the primary RCB (or either of its components) fails, the backup can take over as the primary RCB." The RCB consolidates the Routing Engine function with the control plane function in a single unit, so this one form covers both'
  fpcs:
    term: Slot
    role: traffic
    index-origin: 0
    description: line-card slots FPC 0-7, numbered top-down
  psus:
    term: PSU
    role: service
    index-origin: 0
    description: six power supply slots, one stack at the rear left
    attrs:
      redundancy: 'n+1'
      redundancy-note: 'n+1 - three power supplies for minimum operation; additional supplies provide n+1 redundancy (2n source redundancy on the feeds)'
  cooling:
    term: Tray
    role: service
    index-origin: 0
    description: two tall fan trays; SIBs sit behind them
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the chassis status lamp panel beside the RCBs
