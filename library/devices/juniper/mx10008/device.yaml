configurations:
  base:
    kind: base
    source: >-
      vendor - Juniper publishes this as an orderable bundle. okf juniper-mx-hw
      mx10008/033-mx10008-components-and-configurations.md lists the components of each
      configuration, and the line-card covers in this base are its own: it ships sixteen
      of them on the MX10016 in EVERY configuration, over the note that "Line cards and
      the cable management system are not part of the base or redundant configurations.
      You must order them separately." NOT YET FULLY FAITHFUL: the vendor bundle also
      ships ONE routing engine rather than two, and covers rather than modules in one
      SFB slot and one power slot. This library seats all of them, because JNP10K-PWR-BLNK
      and the SF blank are not modelled yet. The line-card half - the part that was
      drawing holes - is now right.
    default: true
    description: >-
      Chassis only - what you spec before deciding what goes in it. The 8 slot bays are
      EMPTY; cooling, psus, res are populated. Enough to power on and reach the box,
      which is the question most people ask first and the one `default` used to answer
      with whatever the drawing happened to be populated with. The line-card slots are
      drawn EMPTY rather than blanked, which is not the intent: no MX10000-series
      line-card blank is modelled, and none is named in the staged guides - they
      document power-supply cover panels only. Every other chassis in the library seats
      a blank here.
    bays:
      fpc0: juniper/jnp10k-lc-blank@1
      fpc1: juniper/jnp10k-lc-blank@1
      fpc2: juniper/jnp10k-lc-blank@1
      fpc3: juniper/jnp10k-lc-blank@1
      fpc4: juniper/jnp10k-lc-blank@1
      fpc5: juniper/jnp10k-lc-blank@1
      fpc6: juniper/jnp10k-lc-blank@1
      fpc7: juniper/jnp10k-lc-blank@1
gaps:
  - what: rear-photo
    reason: needs-photo
    wanted: a photograph of the rear - only the isometric line drawing
      g050553 exists, so PSU stack and fan tray geometry are fractional
      readings and finish is inferred.
  - what: psu-variants
    scope: [psus]
    reason: needs-photo
    wanted: the JNP10K-PWR-AC3 (four-feed) and DC faces; only AC2 is
      modelled.
  - what: line-card-catalogue
    scope: [fpcs]
    reason: needs-photo
    wanted: LC4800/LC4802 faceplates - named with dimensions and power
      in the guides but with no usable face art in the extraction.
  - what: fan-tray-power
    scope: [cooling]
    reason: vendor-silent
    wanted: per-tray power draw - not in the extraction's text layer.
