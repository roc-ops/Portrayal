portfolio: {line: EX Series, family: EX8200}
description: >-
  Juniper EX8216, the 21 U end-of-life modular Ethernet switch of the EX8200 family. The front has two Routing Engine
  slots (RE0, RE1) and sixteen horizontal line card slots (0 to 15) in two banks of nine, each bank beside one of the two
  vertical fan trays on the left, which carry the slot labels; six power supply slots (PSU 0 to PSU 5) run across the bottom
  and the LCD panel, its Menu and Enter buttons, the ALM, SYS and MST lamps and the ESD point are in a header plate across
  the top. The rear carries the eight Switch Fabric (SF) modules in slots SF7 to SF0 and exhausts the supplies' air at the
  bottom. Cooling is side to side and front to side. The base order ships one RE module, the eight SF modules, two 3000 W AC
  supplies and the cover panels; the redundant orders two RE modules and six AC supplies or four DC supplies. Line cards are
  ordered separately and are not modelled here: every line card slot shows its cover panel.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper, EX8216 Switch Hardware Guide (PDF title "EX8216 Switch Hardware Guide", created 2020-12-16, 405 pages),
      https://www.juniper.net/documentation/en_US/release-independent/junos/information-products/pathway-pages/ex-series/ex8200/ex8216.pdf:
      Table 5 (the orders), Table 7 (the chassis), Tables 8 to 13 (the FRUs and the slot numbers), Figures 1 to 7 (the front
      and rear, flat in Figures 5 to 7), Figures 8 to 11 (the LCD panel and lamps), Figures 12 to 24 (the fan tray, supplies and
      modules), Tables 17, 25, 31, 37 and 38 (the lamps) and Table 60 (power). Juniper, EX8216 Ethernet Switch Datasheet
      (1000283-021-EN, June 2015), https://www.juniper.net/assets/us/en/local/pdf/datasheets/1000283-en.pdf: the ordering table
      and the specifications. Juniper's end-of-life notice (PSN TSB17106, listed in
      https://www.juniper.net/support/pdf/eol/lod-q22017.pdf, 2017-11-09): the EX8200 line is replaced by the EX9200. The guide's
      own address in the task (.../ex-series/ex8216/ex8216.pdf) answered 404; the address above, in the ex8200 folder, is the one
      used, and the archive zip was not needed. Terms: the documents are Juniper's, published for customers, read here for facts
      only; nothing is copied into the library and every skin is drawn new. No photograph of the EX8216 was reachable and no held
      intake folder, Visio stencil or 3D model exists for this account, so the guide's figures are the only geometry.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 7: 36.5 in (92.7 cm) high, 17.3 in (43.9 cm) wide - "the outer edges of the front-mounting brackets extend the
      width to 19 in. (48.3 cm)" - and 26.5 in (67.3 cm) deep without any FRU installed, 29 in (74 cm) with them. The datasheet
      gives 17.3 x 36.5 x 26.5 in and "28.2 in / 71.6 cm depth including all hardware"; the depth without FRUs, where both agree,
      is carried (gap chassis-size). 21 U (guide, "21 rack units (1/2 rack)"); 21 U is 933.5 mm. Ears are NOT MODELLED by project
      convention.
  gate-1:
    confidence: estimated
    note: >-
      THE FRONT FIGURE CANNOT BE PROVED. Figure 5 (g020603, flat) is a composite that draws the front twice, one copy beside each
      fan tray's label column, and is cropped above the supply row, so its aspect against the 36.5 in height cannot be measured. Its
      width passes: the frame with brackets is 1320 px at 450 dpi, 2.735 px/mm on the 482.6 mm, and the body 2.753 px/mm on the
      17.3 in. Down the figure the line card pitch reads 108.8 px, which is 39.5 mm at that scale and 38.2 mm if the cards are the
      EX8208's (Figure 3 of the EX8208 guide, whose aspect is proved at 0.4 percent, and the same line cards). The EX8208's
      38.2 mm is carried, because one chassis' 18 slots at 39.5 mm would need 39.1 + 711 mm and leave less than the supply row
      and rim: 39.1 + 18 x 38.2 + 43.4 (the gap between the banks) + 42 + 104 + 9 comes to the guide's 927.1. The gap between the
      banks is derived from the height, not read off a figure.
  slots:
    confidence: estimated
    note: >-
      Figure 5, read at 2.753 px/mm across and 2.852 down (the second from the pitch above), and the fan tray (Figure 12): the first
      slot (RE0) starts 39.1 mm down; the nine slots of the top bank (RE0, RE1 and line cards 0 to 6) and the nine of the bottom
      bank (line cards 7 to 15) sit on a 38.2 mm pitch, the bottom bank starting 426.3 mm down, which is 39.1 mm under the second tray's
      top (387.2 mm). Each is a 386.9 mm wide bay from 46.1 mm across (the trays' right edge) to the header plate's right edge, 35.0
      mm high. Guide Table 11 numbers them RE0, RE1 and 0 to 15 down the front. The RE plate reads shorter than the line card
      plate in Figure 5 (about 32.6 against 35.8 mm); one slot height is carried.
  psu-row:
    confidence: estimated
    note: >-
      Figure 6 (g020641, the same drawing as the EX8208 guide's Figure 4) and the EX8208's Figure 3: six supplies 70.1 mm wide on a
      71.0 mm pitch from 9.5 mm across, 104.0 mm high from 814.1 mm down (the chassis bottom less the same 8.95 mm rim), PSU 0 to
      PSU 5 left to right, with a perforated band below. The guide says the air intake for the middle of the chassis is "just below the
      slots for the power supplies" and not to block it.
  header:
    confidence: estimated
    note: >-
      Figure 5 at 2.753 px/mm across and 2.852 down: LCD window 248.8 to 312.4 mm across and 12.6 to 28.0 down (the EX8216 figure draws it
      larger than the EX8208's, 63.6 against 38.9 mm; each figure is followed); Menu and Enter buttons centred at 327.3 mm across and 17.5
      and 24.9 down; ALM, SYS and MST lamps at 340.3 mm across and 10.9, 18.9 and 26.3 down; the ESD label 356.0 to 378.5 mm across and 13.0
      to 28.8 down; the ESD point centred at 385.4 and 20.3; "EX8216" centred at 407.4. The registry's lamp and button sizes are used on
      the figure's centres.
  rear:
    confidence: estimated
    note: >-
      Figure 7 (flat, g020604) at 3.437 px/mm on the 17.3 in body: eight SF slots 40.7 mm apart, SF7 at 21.2 mm from the left (seen from
      the rear), a label strip 85.5 to 102.4 mm down printing SF7 to SF0, and the cards from 105.3 mm down. Each card's length (614.0 mm)
      and the lower vent panel, which Figure 4 shows under the cards and the guide names as the supplies' exhaust "on the rear of the
      chassis at the bottom", are fractions of the isometric Figure 4 and good to about 15 mm. The protective earthing terminal pair and the ESD
      point are placed at the rear left from Figure 4's callouts (an isometric, good to about 15 mm); Figure 7 also shows three unlabelled round
      fittings right of SF0 near the top, which are not drawn.
  right-side:
    confidence: estimated
    note: >-
      Figures 1 and 2 (isometric, no scale) show the right wall perforated in three panels, and the lift handles low on both side walls,
      which are not drawn. The two protective earthing terminals Figure 1 calls out are at the top rear corner of the right wall; the
      guide gives no spacing for the EX8216, so the 15.86 mm of the EX8208's inserts is carried. These are fractions of an isometric,
      estimated to about 15 mm; the inserts are drawn as two plain heads, and not as the library's stud-pair part. On this face x = 0 is the front.
  color:
    confidence: estimated
    note: >-
      The guide's figures are black and white line drawings and no photograph was found, so the chassis is drawn in the EX8208's neutral
      light grey; no colour is stated by a source.
  power:
    confidence: datasheet
    note: >-
      Guide Table 60 gives each FRU's draw (carried on the components). No chassis total is stated; the datasheet gives the system capacity
      and no power figure.
  lifecycle:
    confidence: datasheet
    note: >-
      Juniper's end-of-life notice (PSN TSB17106, https://www.juniper.net/support/pdf/eol/lod-q22017.pdf, 2017-11-09) lists the EX8200-family
      XRE200 with a last order date of 2017-06-15 and names the EX9200 as the replacement for the EX8200 line. The EX8216 chassis's own
      dates were not readable (Juniper's end-of-life table is script-rendered); none is stated.
