      Guide Table 7: chassis with midplane and cover panels 160 lb (73 kg), base configuration 270 lb (123 kg), redundant configuration 278
      lb (126 kg), fully loaded 486 lb (220 kg), the last with the heaviest line cards in all sixteen slots. The datasheet gives 142 lb (64 kg),
      270 lb (122.5 kg), 318 lb (144 kg) and 422 lb (191 kg); the guide's table is carried (gap weights).
