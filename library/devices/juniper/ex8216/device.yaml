gaps:
  - what: chassis-size
    scope: [front, right]
    reason: sources-disagree
    note: >-
      Depth with the FRUs fitted: guide Table 7 gives 29 in (74 cm), the datasheet 28.2 in (71.6 cm); both give 26.5 in without them,
      which is carried. Height and width agree (36.5 in, 17.3 in).
    wanted: a mechanical drawing saying which depth includes the handles and the supplies
  - what: weights
    scope: [weight-note]
    reason: sources-disagree
    note: >-
      Chassis with midplane 160 lb (guide) against 142 lb (datasheet); base 270 against 270; redundant 278 against 318; fully loaded 486
      against 422. The guide is the newer document (2020-12-16 against June 2015) and is carried.
    wanted: a shipping-weight statement that names the configuration
  - what: slot-pitch
    scope: [slots, res]
    reason: needs-drawing
    note: >-
      The only flat front figure (Figure 5) is a composite cropped above the supplies, so the slot pitch is not proved against the height; the
      EX8208's 38.2 mm is carried and the gap between the two banks is derived from the 36.5 in height (see provenance gate-1).
    wanted: a flat drawing of the whole front, or a photograph, to measure the pitch and the gap between the banks
  - what: line-cards
    scope: [slots]
    reason: needs-drawing
    note: >-
      Left out on purpose: the twelve EX8200 line cards (EX8200-8XS, -8XS-ES, -40XS, -40XS-ES, -2XS-40P, -2XS-40T, -48PL, -48TL, -48T,
      -48T-ES, -48F, -48F-ES) are a family of their own. Each slot shows its cover panel.
    wanted: the EX8200 line card family, modelled as its own slice
  - what: dc-supply-face
    scope: [psus]
    reason: needs-drawing
    note: >-
      The DC supply is drawn only in isometric Figures 18 and 19; the DC face is built from fractions of an angled view.
    wanted: a flat drawing or photograph of the EX8200-PWR-DC3KR face
  - what: rear-lower-half
    scope: [rear]
    reason: needs-drawing
    note: >-
      Figure 7 draws only the top of the rear flat; the SF cards' length, the lower vent panel and the earthing and ESD points come from the
      isometric Figure 4 and are good to about 15 mm.
    wanted: a flat drawing or photograph of the whole rear
  - what: sides-top-bottom
    scope: [left, top, bottom]
    reason: needs-drawing
    note: >-
      No figure of the guide shows the left wall, the top or the bottom flat; the right wall is only the isometric Figures 1 and 2.
    wanted: flat drawings or photographs of the side walls and the top
  - what: cover-parts
    scope: [slots, res, psus]
    reason: vendor-silent
    note: >-
      The guide lists the line card, RE module and power supply cover panels in Table 5 and draws none, and gives no part number for any; the
      covers are drawn as plain plates at the bays' own size.
    wanted: the cover panels' part numbers and a photograph
groups:
  slots:
    term: Slot
    role: traffic
    index-origin: 0
    description: line card slots 0 to 15 in two banks of nine (with RE0 and RE1 at the top of the first); line cards are not modelled
  res:
    term: Slot
    role: service
    index-origin: 0
    description: the Routing Engine slots RE0 and RE1, one RE module in the base order and two in the redundant orders
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - guide, "Understanding EX8216 Switch Component and Functionality Redundancy": one or two RE modules; with two, one is primary and the other backup, and the Routing Engine and system control are redundant'
  sfs:
    term: Slot
    role: service
    index-origin: 0
    description: the eight Switch Fabric slots SF7 to SF0 at the rear, left to right as seen from the rear
    attrs:
      redundancy: '7+1'
      redundancy-note: '7+1 - guide, "Switch Fabric (SF) Modules in an EX8216 Switch": all eight SF modules are active at once and are recommended for normal operation; "if one SF module fails, the remaining seven SF modules still have sufficient switching capacity to maintain continuous switch operation at full wire-rate performance" with line cards of the 8-port SFP+ kind in every slot'
  cooling:
    term: Tray
    role: service
    index-origin: 0
    description: the top and bottom fan trays, identical and interchangeable; only the top tray cools the SF modules
    attrs:
      redundancy: '2+0'
      redundancy-note: '2+0 - guide, Cooling System and Fan Tray: both trays are needed and "the switch continues to operate for a limited time (2 minutes) after a fan tray has been removed"; within a tray the fans continue to cool "even when a single fan fails", so the redundancy is among the nine fans of each tray and not between the trays'
  psus:
    term: PSU
    role: service
    index-origin: 0
    description: six power supply slots PSU 0 to PSU 5, any slot in any order, all AC or all DC
    attrs:
      redundancy: 'n+1'
      redundancy-note: 'n+1 is required; n+n for dual feeds (guide, "N+1 Redundancy Configuration of AC Power Supplies"); the DC supplies carry two feeds each'
  lcd-buttons:
    term: Button
    role: management
    index-origin: 0
    description: the LCD panel's Menu and Enter buttons
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the chassis status lamps ALM, SYS and MST right of the LCD panel
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD points, front and rear
