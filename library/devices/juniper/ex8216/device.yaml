configurations:
  base:
    kind: base
    default: true
    source: >-
      vendor - Juniper ships the base configuration (AC) as EX8216-BASE-AC (guide, Table 5): the chassis with midplane, two fan trays,
      one RE module, eight SF modules, two 3000 W AC supplies with power cords, one RE module cover panel, sixteen line card cover panels
      and four power supply cover panels.
    description: >-
      The chassis as the base AC order ships it: one RE module in RE0 with its cover over RE1, the eight SF modules, both fan trays, two
      3000 W AC supplies in PSU 0 and PSU 1 with a cover over each of the other four, and a cover in each of the sixteen line card slots.
      Line cards are ordered separately. Side-to-side airflow.
    power: ac
    bays:
      lc0: juniper/ex8216-lc-cover@1
      lc1: juniper/ex8216-lc-cover@1
      lc2: juniper/ex8216-lc-cover@1
      lc3: juniper/ex8216-lc-cover@1
      lc4: juniper/ex8216-lc-cover@1
      lc5: juniper/ex8216-lc-cover@1
      lc6: juniper/ex8216-lc-cover@1
      lc7: juniper/ex8216-lc-cover@1
      lc8: juniper/ex8216-lc-cover@1
      lc9: juniper/ex8216-lc-cover@1
      lc10: juniper/ex8216-lc-cover@1
      lc11: juniper/ex8216-lc-cover@1
      lc12: juniper/ex8216-lc-cover@1
      lc13: juniper/ex8216-lc-cover@1
      lc14: juniper/ex8216-lc-cover@1
      lc15: juniper/ex8216-lc-cover@1
      re1: juniper/ex8216-re-cover@1
      psu2: juniper/ex8200-psu-cover@1
      psu3: juniper/ex8200-psu-cover@1
      psu4: juniper/ex8200-psu-cover@1
      psu5: juniper/ex8200-psu-cover@1
  base-ac:
    kind: orderable
    power: ac
    description: >-
      EX8216-BASE-AC: the base AC order with two 3000 W AC power supplies (EX8200-PWR-AC3K), one RE module (EX8216-RE320) with a cover over
      the second slot, the eight SF modules (EX8216-SF320-S), both fan trays, the line card covers and four power supply covers.
    bays:
      re1: juniper/ex8216-re-cover@1
      psu2: juniper/ex8200-psu-cover@1
      psu3: juniper/ex8200-psu-cover@1
      psu4: juniper/ex8200-psu-cover@1
      psu5: juniper/ex8200-psu-cover@1
    part-numbers:
      EX8216-BASE-AC: {}
  redundant-ac:
    kind: orderable
    power: ac
    description: >-
      EX8216-REDUND-AC: the redundant AC order, with two RE modules (RE0 and RE1), the eight SF modules and six 3000 W AC power supplies
      (EX8200-PWR-AC3K) filling every supply slot; otherwise as the base order.
    part-numbers:
      EX8216-REDUND-AC: {}
  redundant-ac2:
    kind: orderable
    power: ac
    description: >-
      EX8216-REDUND-AC2: the redundant order with six 2000 W AC power supplies (EX8200-PWR-AC2K) in place of the 3000 W ones; otherwise as
      EX8216-REDUND-AC.
    bays:
      psu0: juniper/ex8200-pwr-ac2k@1
      psu1: juniper/ex8200-pwr-ac2k@1
      psu2: juniper/ex8200-pwr-ac2k@1
      psu3: juniper/ex8200-pwr-ac2k@1
      psu4: juniper/ex8200-pwr-ac2k@1
      psu5: juniper/ex8200-pwr-ac2k@1
    part-numbers:
      EX8216-REDUND-AC2: {}
  redundant-dc:
    kind: orderable
    power: dc
    description: >-
      EX8216-REDUND-DC: the redundant DC order, with two RE modules, the eight SF modules and four 3000 W DC power supplies
      (EX8200-PWR-DC3KR) in PSU 0 to PSU 3. The datasheet adds "all necessary blank panels" and the guide's list names none for the DC order,
      so a cover is drawn over each of the two other supply slots.
    bays:
      psu0: juniper/ex8200-pwr-dc3kr@1
      psu1: juniper/ex8200-pwr-dc3kr@1
      psu2: juniper/ex8200-pwr-dc3kr@1
      psu3: juniper/ex8200-pwr-dc3kr@1
      psu4: juniper/ex8200-psu-cover@1
      psu5: juniper/ex8200-psu-cover@1
    part-numbers:
      EX8216-REDUND-DC: {}
  chas:
    kind: orderable
    power: [ac, dc]
    description: >-
      EX8216-CHAS-S, the spare chassis with midplane (datasheet ordering table). It ships without RE modules, SF modules, fan trays or
      supplies, which are ordered separately and may be all AC or all DC; every bay is shown open.
