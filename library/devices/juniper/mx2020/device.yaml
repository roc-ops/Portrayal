format: 1
kind: device
name: mx2020
version: 0.2.20
maturity: modelled
manufacturer: Juniper
model: MX2020
portfolio:
  line: MX Series
  family: MX2000 3D Universal Edge Router
description: >-
  Juniper MX2020 - the 45RU, two-metre flagship of the MX2000 family:
  the MX2010 doubled. Craft interface and EMI cover at the top, an upper
  cage of ten MPC slots (LC 10-19), the fabric cage (CB-RE 0, SFB 0-7,
  CB-RE 1) in the middle, a lower cage of ten more (LC 0-9), and the
  intake grille at the base. The rear carries two nine-module PSM walls
  between four power distribution modules, with fan trays behind the
  grilles.
profile: networking
provenance:
  sources:
    note: >-
      MX2020 Hardware Guide (960 pages), the MX2000 datasheet, and the studio front and rear
      photographs in the image library
  chassis:
    confidence: datasheet
    note: >-
      datasheet-table - 78.75 in (2000 mm) tall, 45U, same 440 mm body width and 919.5 mm depth as
      the MX2010. Ears NOT MODELLED by convention
  front:
    note: >-
      photo - the studio front photograph proportioned per-axis (~1.22 mm/px x, ~1.33 y): craft at
      y 12, EMI cover to 260, upper LC cage at y 300, the fabric cage at y 770, lower LC cage at y
      1225, intake grille at the base; positions approximate to ~5 mm on this face. All MX2000
      components are shared with the MX2010
  slot-numbering:
    note: >-
      guide + photo - the lower cage is LC 0-9 and the upper LC 10-19 (the label strips under each
      cage print them); PSM numbering across the two rear walls is not legible - see gaps
  rear:
    note: >-
      photo - fan tray 3/2 grille, PDM3 zone, the upper nine-PSM wall, the centre grille, the
      lower nine-PSM wall, the PDM0 / air filter panel and the bottom grille. The photographed
      unit is -48 V DC. The PSM bay is drawn at the family 430 mm; this photograph reads nearer
      375 and the difference is recorded here rather than silently split
  power:
    confidence: datasheet
    note: >-
      datasheet-table - the guide power overview: two -48 V pools as the MX2010 (8+1 per wall)
  color:
    note: >-
      photo - grey chassis, dark craft band, silver-grey modules
  other-faces:
    note: >-
      near-blank by evidence - rail bands estimated; axis conventions per viewer3d.js as the
      siblings

chassis:
  width: 440.0
  height: 2000.0
  depth: 919.5
  ru: 45
  color: '#565b61'
gaps:
  - what: psm-numbering-and-bay-height
    scope: [psus]
    reason: needs-photo
    wanted: the printed PSM slot numbering across the two walls, and a
      dimensioned PSM - the bay is drawn at the family 430 mm where this
      photograph reads nearer 375.
  - what: mpc-catalogue
    scope: [fpcs]
    reason: needs-photo
    wanted: as the MX2010 - vertical authors for the MPC range and the
      adapter card; the photographed MX2020 front carries blanks in
      every LC slot.
  - what: fan-trays-and-pdms
    reason: needs-photo
    wanted: the four fan trays and four PDMs as FRU bays - drawn as the
      grilles and zones they sit behind.
groups:
  craft:
    term: Panel
    role: indicator
    index-origin: 0
  res:
    term: Slot
    role: service
    index-origin: 0
    description: CB-RE slots 0 and 1 at the ends of the fabric cage
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - mx2020 hardware guide, "MX2020 Component Redundancy": each host subsystem takes one or two Routing Engines in the front vertical slots 0 and 1; with two CB-REs fitted one is primary and the other backup, and the backup takes over if the primary or any part of it fails. The same bullet adds what the form drops: configured for nonstop active routing, the backup keeps its state in step with the primary and forwarding continues through a switchover'
  sfbs:
    term: Slot
    role: service
    index-origin: 0
    description: Switch Fabric Board slots SFB 0-7
    attrs:
      redundancy: 'n+1'
      redundancy-note: 'n+1 - mx2020 hardware guide, "MX2000-SFB-S Switch Fabric Board Description": 6 Tbps with a minimum of seven SFBs fitted, and an eighth recommended for N+1. The same entry gives the slot count these eight bays come from - up to eight SFB2s, seven needed for line rate - and the fabric is all-active, so the spare is a working plane rather than a standby. RECORDED AS THE GUIDE WRITES IT: seven-plus-one would be an arithmetic reading of two sentences and the guide itself says N+1'
  fpcs:
    term: Slot
    role: traffic
    index-origin: 0
    description: MPC slots LC 0-9 (lower cage) and LC 10-19 (upper)
  psus:
    term: PSM
    role: service
    index-origin: 0
    description: eighteen power supply modules in two nine-wide walls,
      8+1 per wall
    attrs:
      redundancy: 'n+1'
      redundancy-note: 'n+1 PSM, N+N feed redundancy'
