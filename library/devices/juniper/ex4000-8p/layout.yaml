configurations:
  ac:
    kind: base
    description: >-
      The switch as shipped: eight PoE+ ports, two non-PoE ports, two SFP+ uplinks, the built-in AC power supply and no fan. EX4000-8P is the only hardware SKU the datasheet lists
      for the model (Table 1 and the ordering information); there is no DC, -S or -TAA variant.
    default: true
    part-numbers:
      EX4000-8P: {}
