format: 1
kind: device
name: ex4000-8p
version: 2.0.1
maturity: modelled
manufacturer: Juniper
model: EX4000-8P
portfolio: {line: EX Series, family: EX4000}
description: >-
  Juniper EX4000-8P, a compact fanless access switch with eight 10/100/1000BASE-T PoE+ ports (30 W per port, 120 W budget),
  two further 10/100/1000BASE-T ports without PoE and two SFP+ uplink ports that the CLI can turn into Virtual Chassis ports.
  The front also carries the RJ-45 management port over a USB 2.0 Type-A port, the RJ-45 console port, a reset pinhole and the
  SYS, MST and CLD status lamps. The rear has the AC inlet, a perforated vent field and the earthing terminal. The power supply is
  built into the chassis and the switch has no fan, so there are no bays. It stands on a desk by default; the optional two-post
  kit EX4000-2PST-RMK mounts it in a rack.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX4000 Switch Hardware Guide, Juniper Networks, published 2026-01-20 (261 pages; PDF created 2026-01-20; fetched from
      https://www.juniper.net/documentation/us/en/hardware/ex4000/ex4000.pdf, which answered): Table 3 (models), Figure 1 and Figure 2 (the
      EX4000-8P front and rear panels, flat drawings g103032 and g103033), Tables 6 and 7 (cooling, power and the physical specifications and
      ports), Table 26 (chassis), Tables 27 to 33 (the lamps), Table 34 (input), Table 35 (PoE budget), Table 5 (mounting kits) and the mounting
      topics. EX4000 Line of Ethernet Switches Datasheet, Juniper Networks (PDF created 2025-05-28, 14 pages;
      https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex4000-line-of-ethernet-switches-datasheet.pdf): Table 1 (the SKUs),
      Table 2 (maximum system power without PoE), the specifications and the ordering information. Juniper's image-library photographs
      ex4000-8p-front-high.jpg and ex4000-8p-rear-high.jpg (from
      https://www.juniper.net/us/en/company/images/image-library-logos-and-product-photos/products/ex4000-8p.html, 2100 px wide, straight on). The
      guide prints no terms of use; the image-library page prints none either. Nothing of any of them is copied here, since every face is drawn new
      from measurements. No Visio stencil and no 3D model of the EX4000 is held or published; the intake folder for Juniper EX and QFX was not
      available to this work and no held photograph, stencil or model was used. End of life was searched on 2026-10-23 and no Juniper notice for the
      EX4000 was found, so the lifecycle is recorded as none announced.
  chassis:
    confidence: datasheet
    note: >-
      Table 7 and Table 26 - height 1.75 in (4.44 cm), width 10.39 in (26.40 cm), depth 9.64 in (24.5 cm), weight 5.73 lb (2.60 kg). The datasheet gives
      the same width, a height of 1.71 in (4.34 cm), a depth of 9.57 in (24.3 cm) and a system weight of 2.55 kg. The guide's table is the table of chassis
      sizes and is carried, so the height is 44.4 mm (the 1U pitch) and the depth 245.0 mm; the photograph's face measures 43.2 mm from the top edge to the
      lower edge, the rest being the feet and the rounded lower corners, which are not drawn. The unit is 264.0 mm wide, not a rack width: the optional two-post
      kit EX4000-2PST-RMK (Table 5) carries it in a rack.
  scale:
    confidence: photo-measured
    note: >-
      Gate 1 on the front photograph (2100 x 734 px): the body runs from 186 to 1910 px, 6.53 px/mm against the 264.0 mm width. The ports are 103 px apart
      (15.8 mm, the width of the standard RJ-45 aperture, so the jacks abut). The guide's flat drawing (Figure 1, 3000 x 1038 px) was used for what is on the
      face and for the callouts. The rear photograph (2100 x 777 px) runs from 196 to 1921 px and reads at 6.53 px/mm.
  front-layout:
    confidence: estimated
    note: >-
      estimated - Figure 1 and the front photograph. The eight PoE+ jacks stand in four columns of two, abutting on the 15.8 mm width of the aperture from 86.8 mm,
      the rows 14.3 mm apart with the upper row turned 180 so that its latch and lamps face up; both lamps of a jack sit at its outer corners, 10.9 mm apart in the
      photograph, which is wider than the component's 8.3 mm, so the lamps are drawn about 1.3 mm nearer each other than on the metal. The two non-PoE jacks (0 and 1)
      stand in one column of two in their own housing at 156.6 mm. The two SFP+ cages (2 and 3) stand apart, 18.0 mm centre to centre, with a small lamp either side of each
      number. The RJ-45 management port stands over the USB 2.0 Type-A port in one housing and the console port in its own; the status pill is at the top right and the reset
      pinhole at the right end.
  port-numbering:
    confidence: photo-measured
    note: >-
      The photograph and Figure 1 print 0 and 1, 2 and 3, 4 and 5, 6 and 7 under the four PoE+ columns, each number followed by its triangle (an up triangle after the
      even number and a down triangle after the odd one), so the upper jack of a column is the even port. The two non-PoE jacks are printed 0 and 1 in white with the same triangles, and
      the two SFP+ cages are printed 2 and 3. Table 7 puts the non-PoE ports and the SFP+ ports in PIC 1 as ports 0 to 3 and the PoE+ ports in PIC 0. Port numbers are as printed on the metal; the
      two jacks printed 0 and 1 are therefore ids np-0 and np-1 here, so that they do not take the PoE+ ports' names. The guide gives no interface names, so none is recorded.
  port-lamps:
    confidence: datasheet
    note: >-
      Figures 22 to 25 and Tables 32 and 33 - each RJ-45 jack has a Link Activity lamp at one corner and a Status lamp at the other, which the photograph shows at the outer
      corners of every jack. Each SFP+ port has a Link Activity lamp and a Status lamp, the small bars either side of its number (Figure 24). Which bar is which lamp is not stated,
      so the left bar is taken as Link Activity by analogy with the jacks and is estimated. The Status lamp's colour shows speed (Table 32), so its states are not expressible as
      one vocabulary here (see gaps).
  status-block:
    confidence: estimated
    note: >-
      estimated - Figure 1 callouts 3, 4 and 5 and the photograph. The three chassis lamps SYS, MST and CLD sit in a rounded pill at the top right with a round lamp before each
      legend, as the photograph and the drawing show. Tables 27 to 30 give the lamp meanings; the CLD blink patterns are in another document and are not stated here.
  usb-reset:
    confidence: estimated
    note: >-
      estimated - Figure 1 callouts 6, 7 and 9. The USB 2.0 Type-A port under the management port, the reset pinhole (callout 7, with the reset symbol below) and the claim code label
      (callout 6, a QR code at the right of the drawing and absent from the photograph, so a region and not a part) are read off the figure and the photograph.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      The drawing and the photograph agree on what is on the face. The photograph prints the PoE+ port numbers in orange and the drawing in black, and prints EX4000 PoE+ with PoE+ in
      orange. The Juniper logo and the driven by Mist AI line are not drawn: a logo-zone is reserved. The rounded corners and the feet of the compact case are not drawn.
  rear:
    confidence: estimated
    note: >-
      estimated - Figure 2 and the rear photograph at 6.53 px/mm. From the left: a round hole for the power cord retainer (callout 1), the AC inlet in a black housing with its rating
      printed under it (callout 2), a yellow hot-surface triangle with a screw head under it, a perforated vent field 169 mm wide with a screw head under it, and the two-hole protective
      earthing terminal on a lighter plate with the earth symbol under it (callout 3). The perforation is drawn with the registry's vent pattern and not as the photograph's round holes.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Table 6 and Table 7 - the switch has an internal power supply (fixed PSU) and no fan (natural convection cooling, fan-less switch); the guide's system overview says the EX4000
      switch models have inbuilt fixed power supply units. The guide gives no replacement procedure and no part number. The supply is part of the chassis and not a bay and not a component.
  airflow:
    confidence: datasheet
    note: >-
      Table 6 and the cooling section - natural convection, no fan; the datasheet gives no airflow. The guide says not to block the vents on top of the switch.
  earthing:
    confidence: datasheet
    note: >-
      The Connect to Power topic and Figure 2 - a two-hole protective earthing terminal on the rear panel, secured with two M5 x 10 mm screws with washers (not supplied) and a lug on
      6 AWG wire. The holes are drawn as decor.
  power:
    confidence: datasheet
    note: >-
      Table 34 - input 100 to 240 VAC at 3.0 A, 50 to 60 Hz. Table 35 - system budget 30.96 W, PoE budget 120 W, total 150.96 W. The datasheet's Table 2 gives a maximum system power
      consumption, input power without PoE, of 30 W; the two are different measures (a budget and a maximum) and both are recorded. The cord is a C13 coupler (power cord topic).
  mounting:
    confidence: datasheet
    note: >-
      Table 5 and the mounting topics - on a desk by default (the quick-start topic), and with the orderable kits EX4000-2PST-RMK (two-post rack), EX4000-WMK (wall or under a desk),
      EX4000-MMK (magnet pads), EX4000-DRK (DIN rail) and the cable guard EX4000-8-CGD. No figure measures a bracket fold line, so no ear position and no kit is listed here: they are named
      in this provenance and are not modelled as kind kit contracts. The operating ambient is 0 to 50 C at sea level (0 to 40 C for under-the-desk mounting), and a rack needs 2RU of clearance above.
  color:
    confidence: photo-measured
    note: >-
      median of the bare face left of the first jack in the front photograph, #626e7a, which is darker and bluer than the 1U models'; the rear photograph's metal reads lighter under the same
      lights. One chassis colour is carried and is the front's. The numerals are the photograph's orange, #f3855a.
  guide-faces:
    confidence: datasheet
    note: >-
      The guide has flat drawings of the front (Figure 1) and rear (Figure 2) and no top, bottom or side elevations; the isometric views are not used.
attrs:
  physical:
    weight-note: 5.73 lb (2.60 kg), Table 26; 2.55 kg in the datasheet
    depth-note: 9.64 in (24.5 cm), Table 7; 9.57 in in the datasheet
  power:
    power-max-w: 30
    power-envelope: bare
    poe-budget-w: 120
    poe-standard: PoE+ (IEEE 802.3at) on the eight PoE+ ports, 30 W per port; the two ports 0 and 1 in PIC 1 do not supply PoE
    power-input: 100 to 240 VAC at 3.0 A, 50 to 60 Hz (Table 34)
  thermal:
    cooling: natural convection, no fan
  environmental:
    operating-temp: 0 to 50 C at sea level, 0 to 45 C up to 1500 m, 0 to 40 C up to 3000 m
    humidity: 5 to 90 percent at 40 C, noncondensing
    altitude: 3000 m operating, 4500 m storage
  platform:
    first-junos-release: 24.4R1-S2 (Table 6)
  features:
    virtual-chassis: up to 6 EX4000 switches; the SFP+ ports 2 and 3 can be turned into Virtual Chassis ports with the CLI, and the ports 0 and 1 do not support Virtual Chassis
    uplink-ports: two SFP+ ports take 1 GbE or 10 GbE transceivers
    optics-sfp-plus: the two uplink ports are 1GE or 10GE SFP+ ports (Table 7 and Figure 1 callout 10). Virtual Chassis is supported only with 10GE SFP+, and not with a 10GBASE-T transceiver in a Virtual Chassis port. Industrial-grade optics are required above 35 C for under-the-desk mounting and above 40 C otherwise
  management:
    oob: management Ethernet RJ-45 on the front panel, with a link activity lamp and a status lamp
    console: RJ-45 console on the front panel, labelled CON
    usb: one USB 2.0 Type-A port on the front panel
  compliance:
    seismic: tested for Zone 4 earthquake safety
  lifecycle: {eol: none-announced}
