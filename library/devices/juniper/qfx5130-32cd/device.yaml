format: 1
kind: device
name: qfx5130-32cd
version: 0.1.1
maturity: modelled
manufacturer: Juniper
model: QFX5130-32CD
portfolio: {line: QFX Series, family: QFX5130}
description: >-
  Juniper QFX5130-32CD, a 1RU 400G data-centre leaf and spine switch running Junos OS Evolved. It has
  32 QSFP-DD ports (400, 200, 100, 50, 40, 25 or 10 GbE, channelizable) in two rows of sixteen and two
  SFP+ ports (10 GbE only), all on the port side with a lamp beside each. The port side also carries the
  RJ-45 console and management ports, a USB port, the reset button, the three chassis lamps, the 10 MHz
  and 1 PPS output connectors and the ESD point. The rear carries two power supplies, one at each end,
  and six fan modules between them. It ships as one front panel in four power and airflow variants, AC
  or DC supplies with front-to-back (AIR OUT) or back-to-front (AIR IN) airflow, and as a spare chassis
  with no supplies and no fan modules.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper QFX5130 Switch Hardware Guide, published 2026-10-14, 234 pages (copyright HPE): the front
      and rear figures 14 and 15, the port panel and management panel figures 20, 22, 24 to 28, Tables
      3, 8, 9, 12, 13 (components and lamps), the cooling tables 17 and 18 and figures 33, 35 and 37,
      the power sections (Tables 19, 23 to 26, figures 41, 43 to 46, 105) and Table 31 (physical specifications).
      The QFX5130 Line of Switches Datasheet, 1000680-018-EN, July 2025, 9 pages (Juniper Networks): Tables
      2 to 4 and the ordering information. Juniper's studio photographs of the 32CD, front and rear (qfx5130-32cd-front-high.jpg,
      2100 x 383 px, and qfx5130-32cd-rear-high.jpg, 2100 x 432 px, from juniper.net's image library).
      Both documents and the photographs are the maker's and public. Nothing in the held intake folder
      could be read on this host, so no Visio stencil, no 3D model and no other photograph was available;
      no mechanical drawing or 3D model was found on juniper.net either.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 31 and datasheet Table 2: 1.72 in (4.3 cm) high, 17.26 in (43.8 cm) wide, 21.1 in (53.59
      cm) deep, 24.5 lb (11.11 kg) with power supplies and fans installed, 1RU. The inch figures are used
      and the centimetre ones in the same cell are rounded copies of them. The width is the body: the
      rack-requirements table says the outer edges of the front brackets extend it to 19 in, so the brackets
      are not part of the body and are not modelled. The table does not say whether the depth includes
      the handles of the supplies and fans.
  gate-1:
    confidence: photo-measured
    note: >-
      The front photograph's body, between the left and right edges, is 1910 px wide and 186 px from the
      top edge to the bottom lip, an aspect of 10.2 against the table's 438.4 / 43.7 = 10.03 (2 percent
      out: the top lip shows in the photograph). Scale 4.357 px/mm across, used on both axes with the
      origin at the left edge and the top edge. The rear photograph's body is 1857 px wide, 4.236 px/mm.
      The guide's figure 14 and figure 20 are half-tone thumbnails and are used only to count and read.
  ports:
    confidence: photo-measured
    note: >-
      Front photograph: 32 QSFP-DD openings in two rows of 16, 81 px (18.6 mm) wide on an 83 px pitch,
      19.05 mm against the registry's 19.0, which is used. They stand in eight pairs of columns, the pairs
      192.7 px, 44.23 mm, apart, so a gutter of 6.23 mm between pairs: the first opening starts at 38.1
      mm, so the 19.0 mm cell starts at 37.78. Counts and groups are the guide's callout 2 of figure 20
      and figure 14. Two SFP+ cages stand to the right of the last pair, an upper one at 389.7 mm and
      a lower one under it, callout 8; they are single cages, not a ganged block.
  row-pitch:
    confidence: photo-measured
    note: >-
      The two QSFP-DD openings of the first column measure 12.2 to 21.8 mm and 26.6 to 36.1 mm down, centres
      17.0 and 31.35, 14.35 apart; the SFP+ cages 12.4 to 22.2 and 26.4 to 36.3. The registry gives no
      belly-to-belly row pitch for a QSFP-DD cage, so the photograph's 14.35 is used.
  stack-orientation:
    confidence: photo-measured
    note: >-
      The photograph shows the light latch tongue at the foot of every upper cage and at the top of every
      lower one, so both lips face the band between the rows: the upper cage upright and the lower one
      turned 180, the library's stack convention, read off the device. The SFP+ pair is the same.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed on the metal in the band between the two rows, read off the photograph and figure 22: each
      column prints "n up-arrow, down-arrow n+1", the even number for the upper cage and the odd one for
      the lower, so the ports run 0 to 31 down each column and left to right, and the SFP+ pair prints
      "32 up-arrow, down-arrow 33". The guide numbers the network ports 0 through 31 and the SFP+ ports
      32 and 33 (callouts 2 and 8, Table 6). Interface names are not printed. The guide's configuration
      examples name them et-0/0/N on a single FPC and PIC, always 0 (Setting Port Speed and Channelization),
      so port N is et-0/0/N and the SFP+ pair is et-0/0/32 and et-0/0/33; that is recorded here and not
      in an interfaces block, because the face does not print it.
  port-lamps:
    confidence: photo-measured
    note: >-
      Table 8 gives each QSFP-DD port one bicolour lamp and Table 9 gives each SFP+ port two (link and
      activity at the left, status at the right). The photograph shows two small round lamp windows, stacked
      2.9 mm apart, at the left of every pair of columns in each row (2.8 mm left of the pair), and figure
      22 draws a leader from each to a cage of the pair: the upper window of a row serves the left column's
      cage and the lower window the right column's. That assignment is read off figure 22 and is estimated.
      The SFP+ lamps are two round windows above the upper cage, 5.9 mm apart, and two below the lower
      one. The lamp heights are read at 3.2 times zoom, estimated to 0.3 mm. The lamps are unlit light
      pipes in the photograph.
  mgmt-panel:
    confidence: photo-measured
    note: >-
      Right of the SFP+ pair, from the left: a stacked pair of RJ-45 jacks in one shield 16.4 mm wide,
      a USB-A port standing on its side, and under it the RESET pinhole. Above the jacks the face prints
      "CON up-arrow, down-arrow MGMT", so the upper jack is the console and the lower the management port,
      callouts 4 and 3 of figure 20. Each jack shows a green lamp at one corner and an amber one at the
      other; the guide describes lamps for the management port only (figure 28, Table 13), so the console
      jack's lamps are not drawn and are a gap. The USB mark is printed above the port. At the left of
      the face, under the logo, are the 10M OUT and PPS OUT output connectors, two gold coaxial jacks
      6.8 mm across, the round ESD point with its warning mark, and the three chassis lamps ALM, SYS and
      ID with their legends (callouts 9, 10 and 1 of figure 20).
  vents:
    confidence: photo-measured
    note: >-
      Hexagonal holes in the sheet: a band along the top above the cages (about 1.0 to 10.6 mm down),
      a band along the bottom (about 37.5 to 42.5 mm), a field at the left edge, a column of slots left
      of the first pair of columns and a field at the right edge. Drawn as vent decor in those positions,
      pitched to the photograph and estimated.
  front-blue-tab:
    confidence: photo-measured
    note: >-
      A light-blue tab at the lower right, 16.1 mm wide and 6.8 mm high, is the chassis serial number
      pull-out, callout 7 of figure 20. It is drawn as decor, because it is a label card and not a part
      the library models.
  logo:
    confidence: photo-measured
    note: >-
      The maker's logo and its lockup are printed at the upper left of the face, above the model name
      QFX5130-32CD. The logo is not drawn: a logo-zone region is reserved where it stands, and the model
      name is drawn as plain text.
  rear-layout:
    confidence: photo-measured
    note: >-
      Rear photograph at 4.236 px/mm, checked against the guide's figure 15 and figure 41: supply slot
      0 at the left end, six fan slots numbered 0 to 5 on a 48.96 mm pitch, then supply slot 1 at the
      right end, and a grey strip before each supply and fan with its power or fan symbol and number;
      below the fan number a small round lamp window. The orange fan faces measure 41.1 mm wide and 41.5
      mm high; the black supplies 55.2 mm by 41.1. A rating label for the supplies is printed vertically
      at the right end of the rear, past supply slot 1. Fan 0 is the one nearest the left; the guide's
      note numbers the fans "starting from the fan closest to the ports", which does not name a side on
      this face; the photograph numbers them 0 to 5 left to right.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      The guide's figure 15 draws the rear with orange fans and supplies, and the photograph agrees: it
      is the front-to-back AIR OUT build, which is the default configuration here. Figure 20 draws the
      management jacks without lamps; the photograph shows lamps on both, and the photograph is followed.
  modules:
    confidence: datasheet
    note: >-
      The six fan modules (QFX5220-32CD-FANAO and -FANAI, named QFX5130-32CD-FANAO and -FANAI in Table
      17) and the two power supplies (JPSU-1600W-1UACAFO and -AFI, JPSU-1600W-1UDCAFO and -AFI) are field-replaceable
      units in bays, each its own component. The guide's Table 3 names the fan modules and the supplies;
      nothing on this chassis is a built-in unit that is not a bay. Each supply carries its own small
      fan inside (the cooling system is six fan modules and a fan in each supply). The status lamp of
      each fan is on the chassis strip beside its slot (figure 39).
  variants:
    confidence: datasheet
    note: >-
      Datasheet ordering information: QFX5130-32CD-AFI and -AFO (AC) and QFX5130-32CD-D-AFI and -D-AFO
      (DC), and the spare QFX5130-32CD-CHAS "Chassis Spare for QFX5130-32CD without FAN & Power module".
      All five share this front panel and the rear bays, so each is a configuration of this device. NOT
      MODELLED: the QFX5130E-32CD (-AFI, -AFO, -D-AI, -D-AO, -CHAS), a sibling the guide lists in the
      same figures and the datasheet in the same tables, which this slice leaves out; the QFX5130-32CD
      ORv3-compliant switch with tray assembly (QFX513032CDDAFO-T2, 3.64 x 21.14 x 31.4 in), a different
      mounting for Open Rack v3 racks; and the sibling QFX5130-48C and QFX5130-48CM, whose 48 SFP56-DD
      ports need an SFP-DD cage that the library does not have (see the pull request).
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide names the rack mount kits QFX5K-4PST-RMK-E (the toolless four-post kit that
      the switch is installed with in the fast-track procedure) and QFX5220-32CD-4PRMK (a four-post kit),
      and describes mounting in a four-post rack or cabinet. The library holds no contract for either
      kit and none is written here, so `chassis.ears` and `chassis.kits` are left out and a gap says so.
      The modelled body is the 438.4 mm chassis, without brackets.
  power:
    confidence: datasheet
    note: >-
      Table 19 (AC): 100 to 240 VAC, 50 to 60 Hz, 12 A at 100 to 127 VAC and 8 A at 200 to 240 VAC, typical
      323 W and maximum 839 W. Table 26 (DC): rated -48 to -60 VDC, range -40 to -72 VDC, 35 A maximum,
      typical 341 W and maximum 871 W. The datasheet's Table 4 gives the same four wattages at 220 to
      240 V. The datasheet's note: maximum measured at 40 C ambient with SR optics at 100 percent load
      with IMIX traffic; typical at 25 C with DACs at 50 percent load with IMIX traffic, excluding transceivers.
      The AC pair is the device's, since AC is the default build; the DC pair is carried under its own
      keys.
  colour:
    confidence: photo-measured
    note: >-
      The front plate samples #8a8a8b (median of a bare patch) and the rear panel #7b7e83. The chassis
      colour is the front's. The photographs are lit warmly and these are their values, not a paint reference.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-life announcement. No Juniper notice was found and the guide, published 2026-10-14,
      states none; the third-party trackers searched list the QFX5130-32CD as supported with no dates.
      The device states none announced. Estimated, because the trackers are not the maker.
attrs:
  physical:
    weight-note: 24.5 lb (11.11 kg) with power supplies and fans installed (guide Table 31)
  performance:
    throughput: up to 12.8 Tbps unidirectional and 25.6 Tbps bidirectional (datasheet Table 2)
    forwarding-capacity: 5.3 billion packets per second (datasheet Table 2)
    packet-buffer: 132 MB shared (datasheet)
    breakout-ports: >-
      64 x 200 GbE + 2 x 10 GbE, or 128 x 100/50/25/10 GbE + 2 x 10 GbE, or 32 x 40 GbE + 2 x 10 GbE (datasheet
      Table 2)
    qsfpdd-speeds: >-
      400 GbE default; 200, 100, 50, 40, 25 or 10 GbE with the matching optic or breakout cable (guide,
      Setting Port Speed and Channelization)
  power:
    power-typical-w: 323
    power-max-w: 839
    power-envelope: as-tested
    power-measurement-note: >-
      Maximum at 40 C ambient with SR optics at 100 percent load with IMIX traffic; typical at 25 C with
      DACs at 50 percent load with IMIX traffic, excluding transceivers (datasheet Table 4)
    power-dc-typical-w: 341
    power-dc-max-w: 871
    power-input-ac: >-
      100 to 240 VAC, 50 to 60 Hz; 12 A at 100 to 127 VAC, 8 A at 200 to 240 VAC (guide Table 19)
    power-input-dc: rated -48 to -60 VDC, operating -40 to -72 VDC, 35 A maximum (guide Table 26)
    redundancy-note: >-
      two supplies, 1+1, each able to carry the whole switch; both should be installed, on feeds A and
      B
  thermal:
    fans: >-
      six fan modules, 5+1; the switch runs three minutes without thermal shutdown while one is replaced
    airflow-note: >-
      AFO is front-to-back (port-to-FRU); AFI is back-to-front (FRU-to-port); no mixing of fans and supplies
      of different direction
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F) for AFO; 0 to 30 C for AFI (guide Table 30, datasheet Table
      3)
    storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container
    humidity: 5 to 90 percent noncondensing, operating and non-operating
    altitude: >-
      no performance degradation to 1829 m (6000 ft) at 0 to 40 C for AFO and 0 to 30 C for AFI (guide
      Table 30; the datasheet's AFI row reads sea level at 30 C)
  platform: {cpu: Intel Xeon D-1500 (guide); Intel Broadwell DE (datasheet), memory: 32 GB (16 GB x 2)
      DDR4, storage: two internal 50 GB SSDs, switch-chip: Broadcom Trident4, software: 'Junos OS Evolved,
      first release 20.3R1-EVO'}
  features:
    optics-qsfp-dd: >-
      400 GbE QSFP-DD optics and DAC, 400 GbE AOC; QSFP28 100 GbE and QSFP+ 40 GbE with breakout (guide,
      Network Ports for QFX5130-32CD)
    optics-sfp-plus: ports 32 and 33 take 10 GbE modules only, not 1 GbE
    ptp: IEEE 1588 PTP transparent and boundary clock with hardware timestamping (datasheet)
  management: {oob: one RJ-45 management port with link and status lamps, console: one RJ-45 console port,
    usb: one USB 2.0/3.0 port, timing-outputs: 10 MHz and 1 PPS output connectors}
  compliance:
    safety: >-
      UL 60950-1:2007 R5.19; CAN/CSA-C22.2 No. 60950-1-07+A1:2011+A2:2014; IEC 62368-1:2014 and 2018;
      UL 62368-1:2019 R10.21; CSA C22.2 No. 62368-1:19; IEC/EN 60825-1 (datasheet Table 5)
    emc: >-
      47 CFR Part 15 (FCC) Class A; ICES-003 Class A; EN 55022/EN 55032 Class A; CISPR 22/CISPR 32 Class
      A; EN 55024; CISPR 24; EN 300 386; VCCI Class A; AS/NZS CISPR 32 Class A; KN32/KN35; BSMI CNS 13438
      Class A; EN 61000-3-2; EN 61000-3-3 (datasheet Table 5)
    substances: RoHS; WEEE (datasheet Table 5)
    nebs: >-
      designed to comply with Zone 4 earthquake requirements of NEBS GR-63-CORE, Issue 3 (guide Table
      30)
  lifecycle: {eol: none-announced}
chassis: {width: 438.4, height: 43.7, depth: 535.9, ru: 1, weight-kg: 11.11, color: '#8a8a8b', airflow: front-to-back,
  power: ac}
gaps:
- what: module-depths
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The depth of the fan module and of the power supplies. The guide's figures are isometric and carry
    no scale and its tables state weights only for the whole chassis.
- what: console-jack-lamps
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    What the green and amber windows at the corners of the upper (console) RJ-45 jack are. The photograph
    shows them on both jacks of the stacked shield; the guide describes lamps for the management port
    only (figure 28, Table 13) and none for the console. Not drawn on the console jack.
- what: management-port-speeds
  scope:
  - front
  reason: sources-disagree
  wanted: >-
    The speeds of the management jack. Callout 3 of figure 20 says "100 Mbps/1000 Mbps/10000 Mbps"; the
    lamp table (Table 13) describes 10 Mbps, 100 Mbps and 1 Gbps. The jack is modelled at 1g, the highest
    speed Table 13 describes.
- what: forwarding-rate
  scope:
  - performance
  reason: sources-disagree
  wanted: >-
    The forwarding capacity. The guide's overview says 25.6 Tbps and 5.68 billion packets per second;
    the datasheet's Table 2 says 5.3 billion packets per second. The datasheet's 5.3 is carried.
- what: fan-part-numbers
  scope:
  - rear
  reason: sources-disagree
  wanted: >-
    The part number of the fan modules. Guide Table 3 and the datasheet say QFX5220-32CD-FANAO and -FANAI;
    guide Table 17 says QFX5130-32CD-FANAO and -FANAI. Both are listed on each fan component, with the
    Table 3 and datasheet spelling as its model.
- what: dc-supply-airflow-row
  scope:
  - rear
  reason: sources-disagree
  wanted: >-
    The airflow of JPSU-1600W-1UDCAFO. Guide Table 24 prints "Airflow In (port-to-FRU)" for the 32CD row;
    Tables 3 and 25 and the part number's AFO say port-to-FRU is Airflow Out (front-to-back). Airflow
    Out is used.
- what: ac-input-range
  scope:
  - power
  reason: sources-disagree
  wanted: >-
    The lower AC input range. Guide Table 19 says 100 to 127 VAC; the datasheet's hardware table says
    115 to 127 VAC, and the rating label on the chassis reads 115-127V. The guide's range is carried.
- what: clock-connector-type
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The connector type of the 10M OUT and PPS OUT jacks. The guide calls them "output connectors" and
    does not name a type; the photograph shows gold coaxial jacks 6.8 mm across, drawn as the library's
    SMA jack. Estimated.
- what: usb-generation
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The USB revision. The guide says "USB 2.0/3.0 standard" for the one port. The port is drawn with the
    kit's neutral usb2 skin.
- what: rating-label
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    The vertical rating label at the right end of the rear (an AC input line, a DC input line). It is
    only partly legible in the photograph and is not drawn.
- what: ears-and-kits
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    The rack ears' positions and the rack kits' contracts. The guide names QFX5K-4PST-RMK-E and QFX5220-32CD-4PRMK
    and no kit contract exists in the library; none is written here.
groups:
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 400g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      Ports 32 and 33 as printed, rel-pos carrying the printed number, since the origin token cannot express
      a block that starts at 32.
  qsfpdd-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: link, color: '#22c55e'}
    - {name: activity, color: '#22c55e', behavior: blinking}
    - {name: fault, color: '#f59e0b', behavior: blinking}
    description: >-
      One bicolour lamp per QSFP-DD port, in the column of lamps left of each pair of columns (guide Table
      8).
  sfp-plus-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      Two lamps per SFP+ port - link and activity at the left, status at the right (guide Table 9).
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band cluster at the right of the port side - an RJ-45 console port, an RJ-45 management
      port, a USB port and the recessed reset button. Four kinds, one purpose: reaching and recovering
      the switch when the data plane cannot.
  timing:
    term: Port
    role: management
    index-origin: 0
    description: >-
      the 10 MHz and 1 PPS output connectors, a pair of coaxial jacks that carry the switch's timing references
      out
  status-leds: {term: LED, role: indicator, index-origin: 0, description: 'The three chassis lamps ALM,
      SYS and ID (guide Table 12).'}
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD point on the port side (guide figure 20, callout 10)
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: 5+1
      redundancy-note: >-
        QFX5130 hardware guide, QFX5130 Component Redundancy: the QFX5130-32CD has six fan modules and
        can operate with one not in operation; the failure of more than one can trigger chassis alarms
        and shutdown
  fan-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      The round status lamp beside each fan slot - green when the module is healthy, amber blinking on
      an error (guide Table 18).
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        two supplies, each able to carry the whole switch; one may be removed at a time while the switch
        runs
