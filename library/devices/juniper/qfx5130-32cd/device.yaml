configurations:
  ac-f2b:
    kind: orderable
    default: true
    description: >-
      QFX5130-32CD-AFO: two 1600 W AC supplies (JPSU-1600W-1UACAFO) and six front-to-back fan modules
      (QFX5220-32CD-FANAO). All have a Juniper gold handle and the label AIR OUT (guide Tables 3 and 17).
    part-numbers:
      QFX5130-32CD-AFO: {}
  ac-b2f:
    kind: orderable
    airflow: back-to-front
    description: >-
      QFX5130-32CD-AFI: two 1600 W AC supplies (JPSU-1600W-1UACAFI) and six back-to-front fan modules
      (QFX5220-32CD-FANAI). All have a Juniper azure blue handle and the label AIR IN (guide Tables 3
      and 17).
    bays: {psu-0: juniper/qfx5130-jpsu-1600-ac-afi@1, psu-1: juniper/qfx5130-jpsu-1600-ac-afi@1, fan-0: juniper/qfx5130-32cd-fan-afi@1,
      fan-1: juniper/qfx5130-32cd-fan-afi@1, fan-2: juniper/qfx5130-32cd-fan-afi@1, fan-3: juniper/qfx5130-32cd-fan-afi@1,
      fan-4: juniper/qfx5130-32cd-fan-afi@1, fan-5: juniper/qfx5130-32cd-fan-afi@1}
    part-numbers:
      QFX5130-32CD-AFI: {}
  dc-f2b:
    kind: orderable
    power: dc
    description: >-
      QFX5130-32CD-D-AFO: two 1600 W DC supplies (JPSU-1600W-1UDCAFO) and six front-to-back fan modules.
      Each supply has a single feed, so feeds A and B go one to each.
    bays: {psu-0: juniper/qfx5130-jpsu-1600-dc-afo@1, psu-1: juniper/qfx5130-jpsu-1600-dc-afo@1}
    part-numbers:
      QFX5130-32CD-D-AFO: {}
  dc-b2f:
    kind: orderable
    power: dc
    airflow: back-to-front
    description: >-
      QFX5130-32CD-D-AFI: two 1600 W DC supplies (JPSU-1600W-1UDCAFI) and six back-to-front fan modules.
      Each supply has a single feed, so feeds A and B go one to each.
    bays: {psu-0: juniper/qfx5130-jpsu-1600-dc-afi@1, psu-1: juniper/qfx5130-jpsu-1600-dc-afi@1, fan-0: juniper/qfx5130-32cd-fan-afi@1,
      fan-1: juniper/qfx5130-32cd-fan-afi@1, fan-2: juniper/qfx5130-32cd-fan-afi@1, fan-3: juniper/qfx5130-32cd-fan-afi@1,
      fan-4: juniper/qfx5130-32cd-fan-afi@1, fan-5: juniper/qfx5130-32cd-fan-afi@1}
    part-numbers:
      QFX5130-32CD-D-AFI: {}
  chas:
    kind: orderable
