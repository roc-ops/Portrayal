format: 1
kind: device
name: qfx3500-48s4q
version: 0.2.0
maturity: modelled
manufacturer: Juniper
model: QFX3500-48S4Q
portfolio: {line: QFX Series, family: QFX3500}
description: >-
  Juniper QFX3500-48S4Q, an end-of-life 1RU data-centre switch running Junos OS as a standalone switch,
  a member of a QFX Virtual Chassis or a Node device in a QFabric system. It has 48 SFP+ access ports and
  4 QSFP+ uplink ports. An access port takes 10 GbE; ports 6 to 41 also take 1 GbE SFP optics, and ports
  0 to 5 and 42 to 47 also take 2, 4 or 8 Gbps Fibre Channel optics. A QSFP+ port runs at 40 GbE or as four
  10 GbE ports. The ports and their lamps are on the port side. The other side carries two power supplies,
  two fan trays and the management board, with the LCD, the console, a USB port and the management ports.
  One chassis ships in three airflow builds, port-to-FRU (AFO) or FRU-to-port (AFI and ACR), and takes AC or
  DC supplies.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      QFX3500 Device Hardware Documentation, Modified 2018-07-03, Copyright 2018 Juniper Networks, 244 pages
      (Juniper Networks; terms: the guide's own copyright notice and the Juniper EULA, a reference copy kept
      outside the repository). Fetched from
      https://www.juniper.net/documentation/en_US/release-independent/junos/information-products/pathway-pages/hardware/qfx-series/qfx3500.pdf
      Read: Table 5 (physical specifications), Table 6 (FRUs), figures 1 to 7 (the two panels), figures 8 and 9 and
      Tables 7 and 8 (port lamps), figure 10 and Table 9 (chassis lamps), figures 11, 12, 14 and Tables 10, 11
      (management board), Tables 12 and 13 (airflow and the FRUs), figures 13 to 26 and Tables 14 to 18 (fan
      trays and power supplies), Tables 20 (environment), 25 and 27 (power), 23 and 24 (rack and cabinet),
      Table 34 (accessory kit). The QFX3500 and QFX3600 datasheets were searched for on juniper.net and not
      found (the product is end of life and its datasheets are no longer served); no figure is taken from a
      reseller. Juniper's image library has no photograph of this model at the address pattern
      /image-library/qfx-series/<SKU>/<SKU>-front-high.jpg for qfx3500, qfx3500-48s4q, qfx3500-afi or
      qfx3500-afo (all 404), so no photograph is held. The held-sources folders of the intake area were not
      readable from this worker, so no Visio stencil or 3D model could be looked for there, and none is named
      by the guide.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 5: 1.74 in (4.4 cm) high; 17.4 in (44.2 cm) wide excluding the mounting brackets, 19 in
      (48.3 cm) including them; 28 in (71.1 cm) deep excluding the FRU handles and locking levers, 29.2 in
      (74.2 cm) including them; 30.8 lb (14 kg) with FRUs, 23.8 lb (11 kg) without. The body is drawn:
      the brackets are not part of it. The depth carried is the 28 in without the handles. The rack
      requirements (Table 23) put the front and rear rails 28 to 36 in apart.
  gate-1:
    confidence: drawing
    note: >-
      The guide's figure 7 (page 29, drawing g050013) is a flat vector drawing of the port side. Its body
      outline measures 306.76 x 30.77 pt, an aspect of 9.97 against the table's 17.4 / 1.74 = 10.0, 0.3
      percent out, so it carries geometry at 1.4408 mm/pt. Its figure 5 (page 27, drawing g050012, the FRU
      side) measures 309.72 x 31.66 pt, an aspect of 9.78, 2.2 percent out, so each axis of that drawing is
      scaled to its own table figure (1.427 mm/pt across, 1.396 down) and the positions on the FRU side are
      good to about 1 mm. The vector coordinates were read from the PDF page itself, not from a render.
  ports:
    confidence: drawing
    note: >-
      Figure 7. 24 columns of access cages in two rows. The first cage faces are at 4.27, 66.28 and 128.29
      mm and the right half starts at 255.54, with the cages 14.13 mm wide on a column pitch of 14.62 mm in blocks
      of four, a block stride of 62.02 mm, so a gutter of 3.54 mm between blocks. The registry's 14.25 SFP
      ganged pitch is a floor for the cell, not the figure, so the drawing's 14.62 is used. The cells use the
      registry's 14.25 x 10.4 aperture centred on the drawn cage (14.13 x 9.35 mm). The four QSFP+ cages stand
      in two columns between column 11 and column 12: cage faces at 198.28 and 229.73 mm, 20.30 mm wide, a
      column pitch of 31.45 mm, the registry's 18.5 x 9.58 aperture centred on them. The drawing shows
      a column of small circles in the gap between each block of four: a dotted divider, not drawn.
  row-pitch:
    confidence: drawing
    note: >-
      Figure 7: the access cage faces centre 18.41 and 32.40 mm below the top edge, a row pitch of 14.0 mm; the
      QSFP+ faces centre 18.55 and 32.32 mm, a pitch of 13.77 mm. The registry's 15.0 SFP row pitch is not a
      conformance figure.
  stack-orientation:
    confidence: drawing
    note: >-
      Figure 7 draws the latch tongue at the foot of every upper cage and at the top of every lower one, so
      both lips face the band between the rows: the upper cage upright and the lower one turned 180, the
      library's stack convention.
  port-numbering:
    confidence: drawing
    note: >-
      Printed on the metal and read off figure 7: the access ports run 0 to 47, each column printed
      up-arrow, the even number, down-arrow, the odd number, on one baseline between the two rows; the
      uplink ports are printed Q0 and Q1, Q2 and Q3 the same way. The ports are therefore numbered as
      printed. The guide's interface names (xe-0/1/0 to xe-0/1/15 for the channelized uplinks, in its figure
      4) are not printed on the unit and are not written to the manifest. Ports 0 to 5 and 42 to 47 are shaded in
      figure 7 as the Fibre Channel capable blocks; the shading is not metal.
  port-lamps:
    confidence: drawing
    note: >-
      Figures 8 and 9 and Tables 7 and 8: two lamps on every access port and every uplink port. On an access
      port the Link/Activity lamp is at the left and the Status lamp at the right, 6.1 mm apart, above the
      upper cage of a column and below the lower one; the four lamps of a column are in the bands outside the
      cages. On an uplink port the lamps are LA above ST, a stack of two to the left of the cage, legended LA
      and ST. Link/Activity is green when a link is established and blinks with activity; the access
      Status lamp is green for an Ethernet transceiver and amber for a Fibre Channel one; the uplink Status
      lamp is green when a transceiver is installed. The lamp positions are read off figure 7 by lamp
      circle; the circles are drawn 3 mm across and carried as the library's 2 mm lamp.
  vents:
    confidence: estimated
    note: >-
      Figure 7 draws two staggered rows of hexagonal holes above the lamps and one row below them. They are
      drawn as vent strips; the hexagon pitch (4.4 mm along the strip) is estimated as the drawing's hexagons
      are too small to measure to a tenth.
  fru-side-layout:
    confidence: drawing
    note: >-
      Figure 5 (flat) with figure 6 (isometric) and Tables 12 and 13. Supply 0 at the left end, fan tray 0,
      the management board, fan tray 1 and supply 1 at the right end, the whole row symmetric about the
      centre. The supplies are 54.8 x 39.8 mm (the size of the same JPSU-650W unit in the QFX5100, which the
      drawing agrees with to 3 percent, 56 mm across the frame), the fan trays 87.3 x 40.6 mm and the board
      133.4 x 40.6 mm. Each supply and each tray has a narrow strip beside it carrying the supply's power
      symbol and number and the fan tray's fan symbol and number; the symbols are read off figure 5.
  front-and-rear:
    confidence: datasheet
    note: >-
      The guide calls the FRU side the front panel (it carries the LCD) and the port side the rear panel; the
      QFX3600 guide calls the port side the front. The library puts the ports on `front` for both, as it does
      for the QFX5100, so `front` here is the guide's rear panel and `rear` the guide's front panel. The
      guide's AFI (airflow in, FRU-to-port) is the library's back-to-front and AFO (port-to-FRU) its
      front-to-back, ports being the front.
  modules:
    confidence: datasheet
    note: >-
      The two power supplies, the two fan trays and the management board are field-replaceable units in
      bays, each its own component (Table 6). The supplies are the 650 W JPSU-650W units, reused from the
      QFX5100 by part number (juniper/qfx5100-jpsu-650w-ac-afo, -ac-afi, -dc-afo and -dc-afi: the guide
      gives the one unit to the QFX3500, QFX3600 and QFX3600-I, Table 13 and Table 15). The fan trays are
      QFX3500-FAN-AFO and QFX3500-FANAI; the management boards QFX3500-MB (RJ-45, FRU-to-port),
      QFX3500-MB-RJ45-AFO, QFX3500-MB-SFP-AFI and QFX3500-MB-SFP-AFO (Table 10). The guide says to fit a
      blank panel in an empty supply slot and gives it no part number, so no blank is modelled and no
      empty-bay configuration is offered. The two fan modules inside the management board and the fans
      inside each supply are part of those units, not bays. Nothing on this chassis is a built-in unit that
      is not a bay, apart from the ports. The guide gives no chassis model that ships with an SFP board, so every
      configuration seats an RJ-45 board of its own airflow and the SFP boards are accepted by the bay.
  models:
    confidence: datasheet
    note: >-
      guide Table 12: QFX3500-48S4Q-ACR (FRU-to-port), QFX3500-48S4Q-AFI (FRU-to-port) and QFX3500-48S4Q-AFO
      (port-to-FRU). These three are the orderable configurations. The guide does not say what -ACR adds to
      -AFI, so both seat the same units. Neither the guide nor anything held names a DC chassis model: the DC
      supplies are listed as units (Tables 13, 15, 16) and the DC power figures are given for the chassis
      (Table 27), so the two DC builds are illustrations (`example`) that do not export a device type. The
      guide's NOTE on page 4 names a QFX3500-RB-ACRB model with a four-rail kit for a recessed or
      reversed mounting; its chassis has no mounting holes in its face and no figure of it is held, so it
      is not modelled.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide mounts the switch on four posts with one of two kits supplied with it: a
      two-rail kit with two rear installation blades (the management end flush with the rack), or a
      four-rail kit (either end flush). The rails fit racks 28 to 36 in deep. No part number is given for
      either kit, so `chassis.ears` and `chassis.kits` are left out and a gap says so. The body is the 17.4 in
      chassis, without the 19 in brackets.
  power:
    confidence: datasheet
    note: >-
      guide Table 25 (AC): typical 230 W, maximum 365 W; 100 to 127 VAC at 7.8 A or 200 to 240 VAC at 3.8 A, 50
      to 60 Hz. Table 27 (DC): typical 250 W, maximum 385 W; -40 to -72 VDC, nominal -48 VDC, 7 A maximum.
      Both are chassis figures with no ambient or configuration stated.
  colour:
    confidence: estimated
    note: >-
      No photograph is held and the drawings are line art, so the colour is a neutral steel grey, not a
      reading of the metal.
  lifecycle:
    confidence: estimated
    note: >-
      Juniper's support page for the product (https://support.juniper.net/support/?p=qfx3500) labels it end of life;
      the technical bulletin that extends the end of service of its parts (TSB17796) could not be fetched from
      this worker, so no date is stated. Estimated, because the support page is read from a search result
      and the bulletin was not opened.
attrs:
  physical:
    weight-note: 30.8 lb (14 kg) with FRUs installed; 23.8 lb (11 kg) without (Table 5)
    depth-note: 28 in (71.1 cm) excluding FRU handles and locking levers; 29.2 in (74.2 cm) including them (Table 5)
  performance:
    sfp-plus-speeds: 10 GbE with SFP+ optics; 1 GbE with SFP optics in ports 6 to 41; 2, 4 or 8 Gbps Fibre Channel in ports 0 to 5 and 42 to 47
    qsfp-plus-speeds: 40 GbE; or four 10 GbE with a breakout cable (15 10 GbE interfaces by default)
  power:
    power-typical-w: 230
    power-max-w: 365
    power-envelope: unstated
    power-dc-typical-w: 250
    power-dc-max-w: 385
    power-input-ac: 100 to 127 VAC at 7.8 A or 200 to 240 VAC at 3.8 A, 50 to 60 Hz (Table 25)
    power-input-dc: nominal -48 VDC, operating range -40 to -72 VDC, 7 A maximum (Table 27)
    redundancy-note: one or two supplies; with two installed they are load-sharing and fully redundant
  thermal:
    fans: two fan trays of two fan modules, hot-swappable, and two fan modules on the management board; the supplies carry their own fans
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F) normal operation; -5 to 55 C short term
    storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container
    humidity: 5 to 85 percent noncondensing
    altitude: no performance degradation to 3048 m (10000 ft)
  platform:
    storage: 8 GB internal flash
    software: Junos OS
  features:
    virtual-chassis: up to 10 switches with QFX3500, QFX3600, QFX5100 and EX4300 members; a Virtual Chassis Fabric leaf
    qfabric: a Node device, connected to a QFX3008-I or QFX3600-I Interconnect device by the uplink ports
    fcoe: an FCoE-FC gateway or FCoE transit switch
    optics-sfp-plus: SFP+ transceivers, SFP+ direct attach copper cable, SFP transceivers in ports 6 to 41, Fibre Channel SFP+ in ports 0 to 5 and 42 to 47
    optics-qsfp: QSFP+ transceivers, QSFP+ DAC and DAC breakout cables
  management:
    oob: management ports C0 and C1, 1000BASE-T RJ-45 (RJ-45 board) or 1 Gbps SFP (SFP board), with link-speed and activity lamps
    console: RJ-45 console port (CON)
    usb: one USB port
    lcd: an LCD showing the host name and the number of active alarms
  lifecycle:
    eol: announced
    eol-announcement: https://support.juniper.net/support/?p=qfx3500
