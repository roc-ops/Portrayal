gaps:
- what: datasheet
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    The QFX3500 datasheet. Searched juniper.net for it and found only the hardware guide; the product is end
    of life. The weight, dimensions and power are the guide's.
- what: photographs
  scope: [front, rear]
  reason: needs-photo
  wanted: >-
    A photograph of either side. The image-library address pattern returns 404 for this model, so every
    measure is read from the guide's flat vector drawings and the colour is estimated.
- what: end-of-life-dates
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    The dates of the end of sale and end of service. Juniper's support page marks the product end of life and
    its technical bulletin TSB17796 lists the end-of-service dates of its parts; the bulletin could not be fetched.
- what: mounting-kit
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    The part numbers of the two-rail and four-rail kits and their depth ranges. The guide describes them in
    prose and figures 29 to 32 and gives the rack depth (28 to 36 in) and no part number.
- what: four-rail-model
  scope: [front, rear]
  reason: needs-drawing
  wanted: >-
    The QFX3500-RB-ACRB model the guide's NOTE names (four-rail mounting, no mounting holes in the chassis
    face). No figure of it, and no table row, is held.
- what: acr-difference
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    What QFX3500-48S4Q-ACR is, beyond the FRU-to-port airflow Table 12 gives it. It is seated like -AFI.
- what: dc-chassis-model
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    A DC chassis model number. The guide gives DC supplies and DC power figures and names no DC chassis.
- what: esd-point
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    The sliding panel that carries the serial number label and serves as the ESD point (figure 6, to the
    right of the fan tray). It is not marked in the flat figure 5, so it is not placed.
- what: dotted-dividers
  scope: [front]
  reason: needs-photo
  wanted: >-
    The columns of small circles between each block of four access columns in figure 7. They are not
    named by the guide and are not drawn.
- what: sfp-board-lamps
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    The lamps of the two SFP management ports on the SFP management boards. The guide says they are
    identical to those of the RJ-45 ports and draws only the RJ-45 board.
- what: junos-mark
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The Junos mark beside the lamps of the management board, which is a logo and is not drawn.
- what: usb-generation
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The USB revision. The guide names one USB port and gives no generation. It is drawn with the kit's neutral
    usb2 skin.
- what: four-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: A flat drawing or photograph of the lid, the underside and the side panels.
groups:
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: 48 access ports labelled 0 to 47, the even ports on the upper row. Each takes an SFP+ transceiver at 10 GbE, an SFP transceiver at 1 GbE in ports 6 to 41, or a Fibre Channel SFP+ in ports 0 to 5 and 42 to 47.
  qsfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp, speed: 40g}
    description: 4 uplink ports labelled Q0 to Q3, Q0 and Q2 on the upper row. Each takes a QSFP+ transceiver, a QSFP+ DAC or a DAC breakout cable.
  sfp-plus-activity-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: link, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}]
    description: The Link/Activity lamp of each access port, left of the column centre (guide Table 7).
  sfp-plus-status-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: ethernet, color: '#22c55e'}, {name: fibre-channel, color: '#f59e0b'}]
    description: The Status lamp of each access port, right of the column centre - green for an Ethernet transceiver, amber for a Fibre Channel one (guide Table 7).
  qsfp-plus-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: link, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}]
    description: The Link/Activity lamp, legended LA, of each uplink port; it is lit while any of the four 10 GbE breakout links is up (guide Table 8).
  qsfp-plus-status-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: transceiver, color: '#22c55e'}]
    description: The Status lamp, legended ST, of each uplink port - green when a transceiver is installed (guide Table 8).
  mgmt-boards:
    term: Slot
    role: management
    index-origin: 0
    description: The management board, which carries the LCD, the chassis lamps, the console, the USB port and the two management ports.
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy-note: >-
        guide, Understanding Redundancy: two fan trays and two fan modules on the management board; if a fan module
        fails and cannot keep the switch within its temperature thresholds the switch raises alarms and may shut down
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: one or two supplies; with two installed they are load-sharing and one can be removed while the switch runs
