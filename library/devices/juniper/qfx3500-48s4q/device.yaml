configurations:
  ac-f2b:
    kind: orderable
    default: true
    description: >-
      QFX3500-48S4Q-AFO: two 650 W AC supplies (JPSU-650W-AC-AFO), two fan trays (QFX3500-FAN-AFO) and
      the RJ-45 management board (QFX3500-MB-RJ45-AFO). All have port-to-FRU airflow, which the library
      calls front-to-back (guide Tables 12 and 13).
    part-numbers:
      QFX3500-48S4Q-AFO: {}
  ac-b2f:
    kind: orderable
    airflow: back-to-front
    description: >-
      QFX3500-48S4Q-AFI: two 650 W AC supplies (JPSU-650W-AC-AFI), two fan trays (QFX3500-FANAI) and the
      RJ-45 management board (QFX3500-MB). All have FRU-to-port airflow, which the library calls back-to-front
      (guide Tables 12 and 13). The supplies have blue handles lettered AFI.
    bays: {psu-0: juniper/qfx5100-jpsu-650w-ac-afi@1, psu-1: juniper/qfx5100-jpsu-650w-ac-afi@1, fan-0: juniper/qfx3500-fanai@1,
