format: 1
kind: device
name: mx480
version: 5.0.1
maturity: modelled
manufacturer: Juniper
model: MX480
portfolio:
  line: MX Series
  family: Universal Routing Platform
description: >-
  Juniper MX480 Universal Routing Platform - an 8RU, 7.5 Tbps-class modular
  edge router with horizontal cards. Eight slots under the craft interface:
  DPC/MPC slots 5 down to 0 and SCB slots 1 and 0, with the Routing Engines
  seated inside the SCBs. Up to four power supplies across the rear top, fan
  tray and air filter vertical at the rear sides.
profile: networking
provenance:
  card-slots:
    confidence: photo-measured
    note: >-
      the MX480 front photograph, re-read for #261: the body runs x px 35-1466 = 443 mm, 3.230
      px/mm across (an SFF-8433 ganged-SFP pitch of 46.05 px cross-checks 3.232), and 1139 px =
      355.6 mm down, 3.203 - isotropic to 0.8%, NOT the 5.1% the scale note used to state, which
      took the ear-inclusive 1500 px as the body. The card plates run x px 155-1435 = 396.3 mm,
      chassis x 37.15-433.4. Each slot is the 413.5 x 29.5 lever envelope of the card, centred
      on the measured plate at x 28.5-442.0, with `opening` 396.0 x 29.5 - the plate, not the
      levers, which stand proud of the face and read less reliably. SLOT PITCH 31.3, MEASURED AS
      A RANGE: the eight slots span 808 px between the outer gaps, 101.0 px each, which is 31.27
      mm at the across scale and 31.53 at the down scale; x is the better-anchored axis (two
      independent rulers agree on it), so 31.3, with 31.2-31.5 the honest range. Centred on the
      photograph's own cage centre, chassis y 216.5. Until 3.0.0 the slots were 420.9 wide at x
      11.5 on a 31.86 pitch.
  slot-tabs:
    confidence: photo-measured
    note: >-
      the MX480 front photograph: a grey strip, x px 74-146 = chassis x 12.1-34.4, carries a
      slot-number tab beside each slot (x 17.0-28.0), white for the DPC/MPC slots and blue for
      SCB 1 and SCB 0. The slot numbers are printed on those tabs, at x 22.8; until 3.0.0 they
      were drawn at x 5.6 on the dark side rail.
  sources:
    note: >-
      MX480 Universal Routing Platform Hardware Guide, HPE datasheet a00150825enw, and the Juniper
      image-library photographs mx480-front-high and mx480-rear-high. No mechanical drawing was
      available
  chassis:
    confidence: datasheet
    note: >-
      datasheet-table - guide chassis description: 14.0 x 17.45 x 24.5 in (355.6 x 443 x 622 mm),
      8RU. Ears are NOT MODELLED by project convention
  scale:
    note: >-
      photo - the rear photograph passes the orthographic gate at 0.8% (3.33 px/mm isotropic). The
      front photograph is isotropic to 0.8% (x 3.230 px/mm over the 443 mm body, px 35-1466; y
      3.203 to 355.6). Until 3.0.0 this note called it 5.1% anisotropic, anchored at x 3.379 px/mm:
      that took the ear-inclusive 1500 px as the body, so the front's x positions placed before
      3.0.0 (the vent band, the ESD point) were compressed about 4.5%; the card slots were re-placed
      at 3.0.0 (card-slots) and the vent band and ESD point at 5.0.0 (front-vent-esd). Feature sizes
      come from the registry and the shared card family
  front-vent-esd:
    confidence: photo-measured
    note: >-
      the MX480 front photograph on the body scale (x px 35-1466 = 443 mm, 3.230 px/mm; top edge
      at y px 4, 3.206 px/mm down). The hex vent field's holes run x px 98-1384 and y px 19-102:
      chassis x 19.5-417.6, y 4.7-30.6. The front ESD point is the round hole at the left end of
      that plate, below and left of the first hex column: a dark disc x px 77-97, y px 85-104,
      centre (87.1, 94.5), chassis (16.1, 28.2), about 6.3 mm across, so the 5.8 mm
      common/esd-jack@1 bezel is centred there. The hardware guide's Figure 3 (g004200, the
      front view) calls the same hole out as the ESD point and draws an "ESD" label directly above
      it; the photograph shows no printing there (its craft-panel legends resolve at the same
      scale, so that is a reading of this unit), and the ESD mark is kept above the hole where the
      figure prints it. Until 5.0.0 the band was 310 x 30 at x 20 and the point centred at (8, 20),
      laid on the ear-inclusive 3.379 px/mm scale (#892)
  front-rows:
    note: >-
      photo - vent band 0-38.6, craft 38.6-80.6, card cage 92.2-340.8 as eight 31.3 mm slots, top
      to bottom DPC 5, 4, 3, 2, 1, 0, then SCB 1 and SCB 0 (craft tabs: blue 0/1 for SCBs, white
      0-5 for DPCs; the slot-number tabs match). The slot-number tab strip runs x 12.1-34.4 and the
      card plates x 37.25-433.25 (card-slots, slot-tabs)
  populated-with:
    note: >-
      photo - slot 4 carries DPC 4x10GE (the DPC-R-4XGE-XFP face), slots 3 and 0 carry DPC 40xGE
      (DPCE-R-40GE-SFP, with transceivers seated in the photo - drawn as empty cages), slots 5/2/1
      carry blank covers, SCB 1 carries SCB-MX with RE-S-2000 and SCB 0 with RE-S-1300. Defaults
      reproduce that configuration except both SCBs default to the RE-S-1300 (the SCB contract
      carries one default; RE-S-2000 is in accepts and the photo difference is recorded here)
  rear:
    note: >-
      photo - four PSU bays across the top on a 103.9 mm pitch (dividers measured at
      110.8/214.7/318.2), AC supplies photographed; the vertical air-filter (left) and fan-tray
      (right) door strips below, estimated at 12 x 240; earthing studs and ESD placed at the
      MX240's positions and marked estimated - the AC rear photo does not resolve them
  power:
    confidence: datasheet
    note: >-
      guide power tables - base system 40 W, cooling 110/160 W normal/high (Table 91, dedicated
      tap), SCB and card figures on the shared components. The guide gives no chassis total and
      instructs a per-configuration budget; the MX Series family datasheet does give one, typical
      power draw 3470 W AC and 3150 W DC, with no configuration, ambient or side named - carried
      as power-typical-w (AC) with the DC figure in power-typical-scope, envelope unstated. Table
      95 is a worked sample by DC zone (1090 W zone 0, 850 W zone 1) and is not carried. Table 89
      states maximum thermal output AC 11,322 BTU/hour (3,318 W) and DC 9,632 BTU/hour (2,823 W)
      and marks the figures as estimates - carried under thermal as a provisioning ceiling
  lifecycle:
    note: >-
      announced - same per-SKU M/MX milestones situation as the MX240 (trackers list 2020/2026
      dates for older base bundles), searched 2026-08-27
  color:
    note: >-
      photo - as the MX240 family
  other-faces:
    note: >-
      near-blank by evidence - rail bands and the right-side exhaust field estimated as on the
      MX240. Axis conventions per viewer3d.js: LEFT x = 0 REAR, RIGHT x = 0 FRONT, top/bottom y =
      0 FRONT
  ground-stud-size:
    confidence: datasheet
    note: >-
      the hardware guide, chassis grounding points specifications: two threaded inserts (PEM nuts)
      that fit UNC 1/4-20 screws, spaced at 0.625 in. (15.86 mm) centres, for one two-hole cable lug:
      the `stud-size` of both studs.
  ground-stud-pitch:
    confidence: datasheet
    note: >-
      the hardware guide, chassis grounding points specifications: 0.625-in.
      (15.86-mm) centres, which is 5/8 in., 15.875; the guide rounds the
      conversion.
      `ground-studs` is one placement of juniper/mx-ground-stud-pair-5-8@1, which composes
      juniper/mx-ground-stud@1 twice at exactly 15.875 (L116) and presents
      `stud-pair-5-8`, so one two-hole lug (generic/two-hole-lug-5-8@1) lands across the pair
      and the ring lug still lands on either stud, `ground-studs/1` and `/2`.
      The two studs were drawn 13.2 apart; they moved symmetrically about the
      midpoint the photograph placed, (426.7, 28.8), the MX240's (gaps.rear-ground-and-esd), one stud above
      the other, so the host is placed at `rotate: 90` and a lug's wire leaves
      downward, and their cutouts with them.

attrs:
  physical:
    weight-base-kg: 29.7
    weight-max-kg: 100.26
    weight-note: Table 88 (physical specifications) gives 65.5 lb (29.7 kg) for the
      chassis with midplane, fan tray, air filter and cable management brackets,
      and 221.03 lb (100.26 kg) for the maximum configuration. The guide's own
      prose disagrees with the table and is not carried - the rack-requirements
      and lift text give "up to 163.5 lb (74.2 kg) depending on the
      configuration" (the source of the 163.5 this file used to carry, where it
      was misread as kilograms), and the mounting-shelf note gives 128 lb
      (58.1 kg), which is the MX240's Table 88 maximum.
  performance:
    throughput: 7.5 Tbps-class (datasheet family table)
  power:
    power-typical-w: 3470
    power-envelope: unstated
    power-typical-scope: AC typical power draw from the MX Series family
      datasheet, which names no configuration, ambient or side; DC 3150 W
    base-system-w: 40
    cooling-system-w: 160 W high-capacity (110 W normal); dedicated PSU tap
  thermal:
    max-thermal-output: AC 11,322 BTU/h (3318 W); DC 9,632 BTU/h (2823 W)
      (Table 89, which calls them estimates; provisioning ceiling)
  environmental:
    operating-temp: 0 C to 40 C
    storage-temp: -40 C to 70 C
    humidity: 5-90 percent noncondensing
  lifecycle:
    eol: announced
    eol-announcement: https://support.juniper.net/support/eol/product/m_series/
chassis:
  width: 443.0
  height: 355.6
  depth: 622.0
  ru: 8
  color: '#43474c'
gaps:
  - what: front-photo-anisotropy
    scope: [front]
    reason: needs-drawing
    wanted: a mechanical drawing - the DAM front photo reads 0.8%
      anisotropic against the nominal 355.6 mm height, which leaves the
      slot pitch a range, 31.2-31.5 mm (31.3 modelled on the better-anchored
      x scale). The vent band and the front ESD point were re-placed on the
      body scale at 5.0.0 (provenance.front-vent-esd).
  - what: current-generation-frus
    scope: [slots]
    reason: needs-photo
    wanted: orthographic imagery for MPC/SCBE2-3/RE-S-X6 FRUs (as on the
      MX240).
  - what: rear-ground-and-esd
    scope: [rear]
    reason: needs-photo
    wanted: a rear photograph resolving the earthing studs and ESD socket -
      placed at the MX240's positions, estimated. The studs' 5/8 in. pitch is
      the guide's (provenance.ground-stud-pitch); where the pair sits is not.
groups:
  slots:
    term: Slot
    role: traffic
    index-origin: 0
    description: DPC/MPC slots 5-0 and SCB slots 1-0; SCBs carry the Routing
      Engines in their own bays
  scbs:
    term: Slot
    role: service
    index-origin: 0
    description: dedicated Switch Control Board slots - they accept an SCB and
      nothing else, unlike the shared slots that take either an SCB or a DPC
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - mx480 hardware guide, "MX-Series Switch Control Board (SCB) Description": the MX240 and MX480 take two SCBs for 1+1, where the MX960 takes three for 2+1. ONE FORM COVERS BOTH JOBS HERE because the SCB does both: the switch fabric is integrated into the SCB and the Routing Engine installs directly into it. "MX480 Component Redundancy" states the control half the same way - a Routing Engine working with an SCB makes a host subsystem, and with two fitted one is primary and the other backup'
  craft:
    term: Panel
    role: management
    index-origin: 0
  psus:
    term: PEM
    role: service
    index-origin: 0
    attrs:
      redundancy: 'n+n'
      redundancy-note: 'high-line 2, low-line 2+2'
  cooling:
    term: Tray
    role: service
    index-origin: 0
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the protective-earthing stud pair under the rear earth
      symbol (guide, chassis grounding points specifications)
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: >-
      the wrist-strap ESD points, front and rear (the ESD procedure text: "one
      of the ESD points on the chassis"); the rear one is placed at the MX240's
      position (gaps.rear-ground-and-esd)
