configurations:
  base:
    kind: base
    source: >-
      derived - built from the group roles rather than from a vendor bundle: every bay
      whose group is `service` or `management` keeps its seat, every `traffic` bay takes
      a blank. This vendor publishes no base configuration for this chassis, so the
      library defines one. Where a vendor DOES publish one, follow it instead and say so
      here.
    default: true
    description: >-
      Chassis only - what you spec before deciding what goes in it. The 8 slot bays are
      EMPTY; cooling, craft, psus are populated. Enough to power on and reach the box,
      which is the question most people ask first and the one `default` used to answer
      with whatever the drawing happened to be populated with.
    bays:
      dpc5: juniper/mx-dpc-blank@1
      dpc4: juniper/mx-dpc-blank@1
      dpc3: juniper/mx-dpc-blank@1
      dpc2: juniper/mx-dpc-blank@1
      dpc1: juniper/mx-dpc-blank@1
      dpc0: juniper/mx-dpc-blank@1
  ac:
    kind: orderable
    description: AC-powered chassis as photographed - four normal-capacity AC
      supplies, two SCB-MX with REs, DPC 4x10GE in slot 4, DPC 40xGE in
      slots 3 and 0, blanks in 5/2/1.
  dc:
    kind: orderable
    description: DC-powered chassis - the shared MX240/MX480 DC PEM family in
      all four bays.
    bays:
      pem0: juniper/mx240-psu-dc@1
      pem1: juniper/mx240-psu-dc@1
      pem2: juniper/mx240-psu-dc@1
      pem3: juniper/mx240-psu-dc@1
