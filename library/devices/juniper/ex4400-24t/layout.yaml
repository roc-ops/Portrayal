format: 1
kind: device
name: ex4400-24t
version: 0.1.9
maturity: modelled
manufacturer: Juniper
model: EX4400-24T
portfolio:
  line: EX Series
  family: EX4400
description: >-
  Juniper EX4400-24T campus access switch, 1RU. It has 24 10/100/1000BASE-T RJ-45 ports without
  PoE. The front also holds a USB-C console port, the chassis and port mode lamps, a mode button
  and one extension module slot. The rear holds two 100GbE QSFP28 ports, console, management and
  USB-A ports, two fan modules and two power supply slots. A shipped switch carries one 550 W
  supply, two fan modules and covers on the empty slots. The configurations give the supply type
  and the airflow, and the -S spare ships with no supply and no fans.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX4400 Switch Hardware Guide, Juniper Networks, PDF created 2026-07-22 (331 pages). Taken
      from it - Table 7 and Tables 11 to 13 with Figures 8 to 13 (EX4400-24T), Table 38 to Table 40
      (chassis, fan and supply sizes), Tables 41 to 51 (lamps), Table 53 to Table 58 (power
      supplies), Table 52 (heat), Table 93 (environment), Table 105 (what ships), Table 114 (CLI
      names), Table 115 (acoustics) and the mounting procedures. Figures 8 and 9 (g022643,
      g022646) are renders of the real product and are the pictures measured here. The HPE
      datasheet a00150783enw (Juniper's own address redirects to it) was tried once and did not
      answer. The community NetBox elevations of the EX4400-48F were used only to cross-check the
      rear counts and positions. Juniper's image library
      (www.juniper.net/content/dam/www/assets/images/us/en/image-library/ex-series/) answered for
      ex4400-24x/ex4400-24x-front-high.jpg only (a JPEG, 1500 x 236). The same pattern for the
      24T, 24P, 48T and 48P (front-high and rear-high, each once) and ex4400-24x rear-high all
      returned an HTML 404 page. So there is no studio photograph of the 24T in the sources, and
      the guide's renders are the only picture of each face. The 24X photograph confirms the
      colour and finish of the face, the status block and the extension module cover. An
      end-of-life search made 2026-10-20 found no end-of-life or end-of-sale notice for the
      EX4400 line, so the lifecycle is none-announced. The one aggregator that lists an EX4400
      model shows it as supported with no date.
  gate-1:
    confidence: measured
    note: >-
      Both renders pass at low resolution. Figure 8 (g022643, 1500 x 199 px, embedded image
      extracted from the PDF) gives a face 1298 px wide and 127.5 px tall, aspect 10.18 against
      the stated 441.7 / 43.7 = 10.11, 0.7 percent out. Scaled on the stated width it is 2.94
      px per mm across and 2.92 down. The jack pitch then reads 13.95 mm over the 20 steps inside
      the blocks of one row, which is the 13.97 mm of the ganged RJ45 registry entry, measured on a
      quantity the scale never saw. Figure 9 (g022646, 2000 x 265 px) gives a face 1733.5 px by
      168.5 px, aspect 10.29, 1.8 percent out the other way, 3.92 px per mm across and 3.86
      down. Positions are taken per axis on those scales, and each reads to about half a
      millimetre on the front and a quarter on the rear.
  width:
    confidence: datasheet
    note: >-
      Table 38 gives the chassis 17.39 in (44.17 cm) wide, and says the outer edges of the
      front mounting brackets extend the width to 19 in (48.2 cm). The face is the body between
      the folds, 441.7 mm, with no ears drawn. Height is 1.72 in (4.37 cm), 1RU. Depth is 15.71 in
      (39.9 cm) with no supply, fan module or extension module fitted, 16.93 in (43 cm) with a
      supply and fan modules, 17.35 in (44.07 cm) with an extension module as well. The bare
      figure 399.0 mm is carried as the chassis depth, because every module is its own part.
      The other two are in attrs.
  ports:
    confidence: drawing
    note: >-
      Figure 8 and Figure 11 - 24 RJ-45 ports in two rows of 12, in two blocks of six columns
      with a gutter between them. Cells sit on the registry's 13.97 mm ganged pitch. The first
      cell's left edge is at 7.95 mm, the block step is 89.26 mm (so a gutter of 5.44 mm), the
      upper cells start at 9.5 mm and the lower at 24.05 mm (row step 14.55 mm). Each block is a
      single silver plate, 87.1 mm wide, 5.71 mm from the left edge for the first, drawn as decor
      because the metal strip is panel and not part. Counts confirmed by Table 12 and Table 114
      (PIC 0, 24 ports).
  port-numbering:
    confidence: photo-measured
    note: >-
      Figure 50 (g022608) at high zoom - under each column, one pair of printed numbers, an even
      number with an up arrow and the next odd number with a down arrow ("0 up 1 down", "2 up 3
      down" to "22 up 23 down"). The arrows point at the port of each number, so the upper jack
      of a column has the even number. Numbering starts at 0, as printed. CLI names (ge-0/0/0 and
      so on) are not printed on the metal, and Table 114 gives PIC 0 as the built-in ports 0 to 23.
      The legend position and arrow spacing are estimated from Figure 50 and the render. The
      legends of the non-PoE models are white on the render, and gold on the PoE models.
  rj45-orientation:
    confidence: drawing
    note: >-
      Figure 50 - upper-row jacks have their contact comb at the bottom and their lamp windows at
      the top corners, so they carry rotate 180. Lower-row jacks have the comb at the top and the
      lamps at the bottom corners, the default turn of the part. This is the stacked mirror
      the registry describes.
  port-leds:
    confidence: datasheet
    note: >-
      Figure 50 and Table 43 and Table 44 - each jack has two lamp windows, "1 Link activity LED"
      at the left and "2 Status LED" at the right, in both rows. The link activity lamp is green:
      steady for link without traffic, blinking for traffic, unlit for no link. The status lamp
      shows one port parameter at a time, chosen with the mode button: speed (SPD), duplex (DX) or
      administrative enable (EN). The jack part names its lamps led-a (left when unrotated) and
      led-b. The upper row is rotated, so left and right swap there. A single mapping for the
      group would be wrong for one row, so the part keeps its default vocabulary and this note
      holds the meaning. See the gap port-lamp-vocabulary.
  status-block:
    confidence: drawing
    note: >-
      Figure 11 callouts 2 to 5 and Figure 54 (g022614), measured on the render of Figure 8. A dark
      plate 361.2 to 439.5 across and 1.4 to 15.5 down. The model name EX4400 is printed up and to the left of the
      USB-C port, spanning 374.3 to 385.2 across (centre 379.8), with no PoE++ mark and no POE lamp. The USB-C console port is centred at
      393.7, 8.3 with the USB symbol below it. Two columns of lamps sit at 406.2 and 410.1 across: SYS,
      ALM, MST and CLD on the left with their legends, and SPD, DX and EN on the right (the CLD row
      has no right-hand lamp). The rows are at 3.8, 6.8, 9.7 and 12.8 down; the render scatters
      them by up to 0.5 mm and they are aligned. The mode button is a flush disc at 423.1, 8.6. The
      legends' type size is estimated.
  extension-slot:
    confidence: estimated
    note: >-
      Figure 11 callout 6. The slot is a recess 363.8 to 437.8 across and 17.7 to 41.2 down in the
      render of Figure 8. The slot is a bay. It takes the three extension modules the guide names
      and ships with a cover, because Table 105 lists one cover for the empty extension module
      slot. The modules are not part of this device.
  rear:
    confidence: drawing
    note: >-
      Figure 9 (g022646) and Figure 12 measured on the render, per axis, from the rear
      left edge (the chassis right side as seen from the front). CON jack centre 18.35, 13.6;
      MGMT jack centre 39.6, 13.6, both with the contact comb up; USB-A at 55.0, 12.5, vertical;
      RESET pinhole at 55.3, 24.9; ground plate 27.8 to 61.7 across and 27.6 to 39.7 down with
      two threaded holes 15.0 apart at 39.5 and 54.5; QSFP28 cages centred at 75.5 across and
      14.5 and 28.2 down, labelled 0 and 1 to their left; two columns of lamps at 89.4 and 94.3
      across, two for each cage per row; ESD socket at 101.1, 36.0. Fan module slots are at 108.2
      and 206.0 across, and power supply slots at 255.0 and 346.4 across, each with a fan
      or power icon and its number above the slot or beside it. All of these are estimated from the
      render, to about 0.3 mm.
  rear-labels:
    confidence: drawing
    note: >-
      Figure 12 callouts 1, 6, 10 and 15 are the serial number ID label, the CLEI code label, the
      power supply rating label and the claim code label. They are stickers, not metal, so each
      is a named region and is not drawn. The render shows them as blank plates, white for three
      and slate for the rating label. The guide shows no content, and none is invented.
  grounding:
    confidence: datasheet
    note: >-
      Connect Earth Ground to an EX4400 Switch - a 2-hole protective grounding terminal on the
      rear panel, used with 10-32 x 0.25 in screws and the lugs LCD10-10AF-L, LCD8-10AF-L or
      LCD6-10AF-L. The guide gives no hole spacing. The 15.0 mm spacing is measured on the
      render and is estimated. The render shows two bare holes, so they are drawn as dark holes
      on the plate and not as screws. A two-hole lug is the seat of a pair of holes, and the
      library has no pair part for 10-32 holes at this spacing, so no lug seat is offered.
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md) - a belly-to-belly pair is the
      upper cage upright and the lower turned 180, so both bails face outward. The two rear
      QSFP28 cages are stacked this way and the render at 3.9 px per mm does not resolve which
      way the latches point, so the rule decides and a photograph overturns it.
  vents:
    confidence: drawing
    note: >-
      The front has a hexagon punching in a band over and under the port blocks, from the logo
      to the status block, and none in the middle. The rear punching is two small fields above and
      below the QSFP28 cages. The fields are drawn as a repeating pattern in simplified
      outlines, not hole for hole.
  colour:
    confidence: photo-measured
    note: >-
      Median of bare face on the guide renders (#777777 at the front, #707070 at the rear), and of
      the status plate (#50575f) and the jack plate (#cccdcf). The 24X studio photograph shows
      the same mid-grey finish. The legends of the non-PoE models are near white on the render.
  power-supplies:
    confidence: datasheet
    note: >-
      Table 11 ships the 24T with a 550 W AC supply, and the text of the EX4400-24T topic says it
      takes 550 W AC or DC supplies and that AC and DC must not be mixed in one chassis. The
      guide's rear renders (Figures 9 and 10) show two supplies; the default here ships one
      supply and a cover on the second slot, as Table 105 states. Supplies, fans and covers are
      parts in bays.
  airflow:
    confidence: datasheet
    note: >-
      Table 11 and Table 13 - the 24T is sold front-to-back (AIR OUT label, orange handle) as
      EX4400-24T and EX4400-24T-DC, and back-to-front (AIR IN label, blue handle) as
      EX4400-24T-AFI and EX4400-24T-DC-AFI. The -S spare ships with no supply and no fan modules,
      and the guide says a buyer orders them separately.
  mounting:
    confidence: datasheet
    note: >-
      Mounting Options and the mounting procedures - the two-post kit EX-RMK ships in the box and
      mounts the brackets flush with the front or along the middle of the side panels. The
      separately orderable EX-4PST-RMK mounts the switch flush with the front posts of a
      four-post rack or recessed inside it. EX-WMK is a wall kit. No ear distance in
      millimetres, no rack depth range and no bracket drawing that can be measured is in the
      guide, so the positions are named without a number and no kit is listed. The library holds
      no rail kit yet.
  interface-names:
    confidence: datasheet
    note: >-
      Table 114 - the CLI addresses the switch as FPC 0, the built-in ports as PIC 0 ports 0 to
      23, the two rear QSFP28 ports as PIC 1 ports 0 and 1, and the extension module as PIC 2. The
      names are not printed on the metal, so no interfaces block is written.
attrs:
  physical:
    weight: 6.5 kg with no power supply, fan module or extension module (EX4400-24T); 5.36 kg for the -S
    depth-with-modules: 430.0 mm with power supply and fan modules; 440.7 mm with an extension module as well
    mounting: two-post kit EX-RMK in the box; four-post kit EX-4PST-RMK and wall kit EX-WMK separate
  performance:
    throughput: 324 Gbps unidirectional, 648 Gbps bidirectional
  power:
    power-redundancy: 1+1 with two supplies of one type
  thermal:
    heat-dissipation: 300.08 BTU/hr idle and 313.72 at 100 percent traffic with a 550 W AC supply; 320.54 and 337.59 with a 550 W DC supply
  environmental:
    operating-temp: 0 C to 45 C (32 F to 113 F)
    storage-temp: -40 C to 70 C (-40 F to 158 F) in the shipping container
    humidity: 5 to 90 percent noncondensing
    altitude: no performance degradation up to 1828.8 m (6000 ft) at 40 C
    acoustic-noise: 42.7 dB(A) typical with one 550 W AC supply and front-to-back airflow (ISO 7779, from the front at 23 C)
  platform:
    cpu: quad-core x86
    memory: 4 GB DDR4 with ECC
    storage: 20 GB eMMC
  features:
    virtual-chassis: up to 10 switches over the QSFP28 ports, which are Virtual Chassis ports by default
    macsec: AES-256 on all RJ-45, SFP and SFP+ network ports and the SFP28 and QSFP28 extension module ports
    optics-qsfp28: >-
      The two rear ports take 100GbE QSFP28 or 40GbE QSFP+ transceivers (40G from Junos OS 22.1R1).
      Breakout cables give 4x25G and 4x10G. The exact list is in the Hardware Compatibility Tool
    qsfp28-channelization: each QSFP28 port runs as 100G, as 40G from Junos OS 22.1R1, or channelized
    extension-slot: one slot for the EX4400-EM-4S, EX4400-EM-4Y or EX4400-EM-1C module
  management:
    console: USB-C on the front and RJ-45 (CON) on the rear
    oob: MGMT RJ-45 on the rear, 10/100/1000, with link activity and status lamps
    usb: USB-A on the rear
    cloud: Juniper Mist Wired Assurance, and the Junos CLI and J-Web
  compliance:
    seismic: Tested for Zone 4 earthquake according to NEBS GR-63-CORE, Issue 5
  lifecycle: {eol: none-announced}
chassis:
  width: 441.7
  height: 43.7
  depth: 399.0
  ru: 1
  color: '#777777'
  ears:
    positions:
      - {name: flush, label: flush with the front panel}
      - {name: mid, label: along the middle of the side panels}
      - {name: recessed, label: recessed inside a four-post rack, racks: [4-post]}
gaps:
  - what: port-lamp-vocabulary
    scope: [rj45]
    reason: vendor-silent
    note: >-
      The jack part gives led-a the vocabulary link and led-b the vocabulary activity. This
      switch's right lamp is a status lamp whose meaning follows the mode button, and the
      upper row is rotated so left and right swap. One group mapping cannot say both.
    wanted: >-
      A per-port states mapping that a block can carry, or the jack part split by row.
  - what: cld-lamp-states
    scope: [led-cld]
    reason: vendor-silent
    note: >-
      The hardware guide names the CLD lamp and sends the reader to the cloud-ready LED blink
      patterns, which are not in this guide.
    wanted: the cloud-ready LED blink patterns and their meanings
  - what: datasheet
    scope: [front]
    reason: vendor-silent
    note: >-
      The HPE datasheet a00150783enw did not answer from this host, so no datasheet is cited and
      no figure comes from it.
    wanted: the HPE PSNow EX4400 datasheet, for the ordering part numbers and mounting kit codes
  - what: fan-part-number
    scope: [fan-0, fan-1]
    reason: vendor-silent
    note: >-
      The guide prints EX4400-FAN once, in the switch-tray assembly table, with no airflow
      direction. No ordering code is stated for the fan modules.
    wanted: the ordering codes of the front-to-back and back-to-front fan modules
  - what: ground-spacing
    scope: [rear]
    reason: vendor-silent
    note: >-
      The guide states the screw size and lug codes but not the spacing of the two grounding
      holes. The 15.0 mm spacing is estimated from the render. The holes are drawn as decor, so
      no two-hole lug can be seated on them.
    wanted: the spacing of the two-hole protective earthing terminal, and a 10-32 pair part for it
  - what: supported-optics
    scope: [qsfp28, extension]
    reason: vendor-silent
    note: >-
      The guide sends the reader to the Hardware Compatibility Tool page for EX4400 for the
      transceivers and cables each port takes, and holds no table of them. The port groups
      therefore declare no interface.
    wanted: the EX4400 transceiver list from the Hardware Compatibility Tool
  - what: labels-not-drawn
    scope: [rear]
    reason: vendor-silent
    note: >-
      The ESD hazard symbol beside the ESD socket and the legends printed on the fan and power
      supply slot plates are drawn as simple marks. The air-flow word printed on the supply
      fan hub in the community elevation is not drawn, because no maker figure shows it.
    wanted: a close-up of the rear panel
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs:
      media: rj45
      speed: 1g
    description: >-
      24 ports, numbered 0 to 23 as printed, upper jack of each column even. Each port runs at
      10, 100 or 1000 Mbps
  extension:
    term: Slot
    role: traffic
    index-origin: 0
    description: the extension module slot, PIC 2 in the CLI
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: reaching and restarting the switch - USB-C console and mode button on the front,
      RJ-45 console and management, USB-A and the reset pinhole on the rear
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs:
      media: qsfp28
      speed: 100g
    description: >-
      Two rear ports numbered 0 and 1. They are Virtual Chassis ports by default and can run as
      network ports. Each takes a 100G or a 40G transceiver
  qsfp28-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      Four lamps for each QSFP28 port, in two rows of two. Table 46 - green for 100G, amber for
      40G, and all four lamps show the four channels of a channelized port
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the chassis status and port mode lamps at the right of the front panel
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Cooling System and Airflow in an EX4400 Switch - "We ship EX4400 switches with two fan
        modules (1+1 redundancy) preinstalled in the rear panel of the switch."
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Two slots, one supply shipped. The guide says a second supply gives full redundancy and
        that AC and DC supplies, and supplies with different airflow, must not be mixed
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the rear two-hole protective earthing terminal
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the rear wrist-strap socket (guide Figure 12 callout 11)
