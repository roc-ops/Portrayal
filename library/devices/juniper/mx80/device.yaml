configurations:
  base:
    kind: base
    source: >-
      derived - built from the group roles rather than from a vendor bundle: every bay
      whose group is `service` or `management` keeps its seat, every `traffic` bay takes
      a blank. This vendor publishes no base configuration for this chassis, so the
      library defines one. Where a vendor DOES publish one, follow it instead and say so
      here.
    default: true
    description: >-
      Chassis only - what you spec before deciding what goes in it. The 2 slot bays are
      EMPTY; cooling, psus are populated. Enough to power on and reach the box, which is
      the question most people ask first and the one `default` used to answer with
      whatever the drawing happened to be populated with.
    bays:
      mic-1-0: juniper/mx-mic-blank@1
      mic-1-1: juniper/mx-mic-blank@1
  mx80:
    kind: model
    description: Full-capacity MX80 - both MIC slots active, 80 Gbps class.
  mx40:
    kind: model
    description: MX40 licence tier of the same chassis - 40 Gbps class; the
      chassis and faceplate are identical (guide Figure 7).
  mx10:
    kind: model
    description: MX10 licence tier - 10 Gbps class, same chassis (Figure 6).
  mx5:
    kind: model
    description: MX5 licence tier - 5 Gbps class, same chassis (Figure 5);
      MIC slot availability grows by licence, not by hardware.
