format: 1
kind: device
name: mx80
version: 4.0.0
maturity: modelled
manufacturer: Juniper
model: MX80
portfolio:
  line: MX Series
  family: 3D Universal Edge Router
description: >-
  Juniper MX80 modular chassis (EOL) - the 2RU box the MX5, MX10, MX40 and
  MX80 all share, differing only in licensed capacity. Two MIC slots across
  the top (1/MIC 0, 1/MIC 1), and below them the two AC supplies (PS 0/PS 1),
  the fixed blue Routing Engine panel (CONSOLE/AUX, ETHERNET/USB, EXT CLK
  A/B, SYS/RE lamps) with the four fixed 10GbE XFP ports (0/MIC 0), and the
  side-pull fan tray behind the JUNIPER-branded door at the right.
profile: networking
provenance:
  sources:
    note: >-
      MX5/MX10/MX40/MX80 Hardware Guide, and the image-library photographs mx80-front-high and
      mx80-rear-high (the mx5 set is the same base asset, recorded in the photo catalogue). No
      mechanical drawing was available
  chassis:
    confidence: datasheet
    note: >-
      datasheet-table - the guide chassis description: 3.5 x 17.5 x 23.46 in (88.9 x 445 x 596
      mm), 2RU. Ears NOT MODELLED by convention
  shared-chassis:
    note: >-
      guide - the MX5, MX10, MX40 and MX80 are one chassis with different capacity licences and
      MIC entitlements (guide Figures 5-9); they are modelled as ONE device with the SKUs as
      configurations. The FIXED MX80 variant (Figure 8, 48x1GbE built in) is a different faceplate
      and is not modelled - see gaps
  scale:
    note: >-
      photo - the front photograph at 3.088 px/mm, isotropic: 1374 px between the ear wings (62 to
      1436) over the 445.0 mm frame, cross-checked on the 20x1GE MIC's ganged-SFP pitch (44.0 px),
      the chassis top at y px 9.5 (mic-bays, fixed-panel; #261, #901). Until 4.0.0 this note
      described per-axis anchoring with rows fitted to 88.9
  front:
    note: >-
      photo - MIC row y 7-41.5 with slots at x 25.0 and 193.4 (the reference unit carries the
      20x1GE SFP MIC and the 2x10GE XFP MIC); PS 0/PS 1 at x 14.7/86.2 in the lower band; the blue
      RE panel from 162.6 to 406 carrying CONSOLE over AUX (x 190), ETHERNET over USB (x 213), EXT
      CLK A over B (x 232), the SYS OK / RE lamps and ONLINE/OFFLINE button at its left, and the
      four fixed XFP cages at centres 261.6-349.7 with LINK lamps, silkscreened 0-3 over 0/MIC 0;
      the MX80 badge at 355; the fan-tray door at 407-445. SUPERSEDED for the fixed panel by fixed-panel
      below (#901)
  fixed-panel:
    confidence: photo-measured
    note: >-
      the MX80 front photograph on the frame mic-bays states (#901): x = (px - 62) / 3.088 between
      the ear wings, 445.0 mm; y = (py - 9.5) / 3.088 from the chassis top. The four fixed XFP cages
      (optics seated in the photograph, read on their duplex bodies) centre at x 267.3, 298.6, 330.1,
      361.1 - a 31.3 mm pitch - at y 71.4; each LINK lamp sits right of its cage at 282.7, 314.0,
      345.0, 376.3 (y 72.5 read, drawn level with the cage centre at 71.4), with LINK printed over it and the port digit over the cage. CONSOLE over
      AUX centre at x 195.7 (y 56.8, 71.0); ETHERNET over the horizontal USB at 219.2 (60.5) and 219.6
      (72.7); EXT CLK A over B at 241.4 (54.8, 71.0). The SYS OK and RE lamps at x 172.3 and 177.9,
      y 64.9, the ONLINE/OFFLINE button at (170.2, 73.3); the blue panel's left and top edges at x
      159.6 and y 40.6. Until 4.0.0 the cages sat on a 29.4 pitch (xe-1 7.6 mm left of the
      photograph) at y 67.0, and the jacks 5-17 mm left of theirs.
      SEEN AND NOT DRAWN, for follow-ups: two more lamps above SYS OK and RE (y 57.6), a second
      button right of ONLINE/OFFLINE (179.9, 73.3), and a fan tray running x 380.5-441.4 where the
      model's fan-tray bay is 38 wide at 407 - its width is the juniper/mx80-fan-tray contract's. The USB jack is
      horizontal, as the photograph shows it and as std/usb-a draws it unturned, 12.0 x 4.5 under
      ETHERNET; until 4.0.0 it was placed at rotate 90, upright
  rear:
    note: >-
      photo - a blank cover plate over the upper-left aperture labelled MPC 0 / MIC 1, the CLK and
      SYNC jacks at x 68/105 (y 75), the two-hole earthing plate and ESD at the right. The jacks
      are drawn as SMB (photograph resolution cannot distinguish SMB from BNC - recorded)
  power:
    confidence: datasheet
    note: >-
      guide power consumption topics - Table 14 (AC) and Table 20 (DC) give the modular chassis
      "running at high activity, with four 10-Gigabit Ethernet XFPs, two MICs, and fans running at
      high speed" 310 W on both feeds, which the guide's own worked examples call typical power
      consumption; carried as power-typical-w, OUTPUT side. Table 14 adds the AC INPUT figure at
      85% efficiency, 365 W (the family datasheet's "typical power draw (AC)" for the MX80-MX5 is
      the same 365 W, its DC 310 W); without the two MICs the base is 240 W output, 282 W input.
      Tables 13 and 19 give the fixed MX80 (not modelled) 320 W. Table 11's 610 W AC system input
      power and Table 17's 625 W DC system input (13 A at -48 VDC) are provisioning ratings, not
      draw, and are not carried. Table 32's maximum thermal output, 1705 BTU/hour (500 W), is one
      supply's maximum output (Table 12, 500 W) times 3.41 - a provisioning ceiling, carried under
      thermal and flagged so. The guide gives modules only a generalized 35 W per MIC (Table 15)
      and points at the MX Series Interface Module Reference; 13 of the 14 modules this chassis
      accepts carry a figure on their contracts, and the fan tray, which no table here rates, is
      the one L29 reports
  lifecycle:
    note: >-
      announced - the whole MX5-MX80 family is EOL (guide banners and family tables); per-SKU
      dates on the Juniper milestones page
  color:
    note: >-
      photo - dark charcoal chassis, silver MICs, dark blue RE panel and fan door (Juniper's
      MX80-era styling)
  other-faces:
    note: >-
      near-blank by evidence - rail bands estimated; axis conventions per viewer3d.js as the
      siblings
  ground-stud-size:
    confidence: datasheet
    note: >-
      the hardware guide, grounding points specifications: two threaded holes that fit SAE 10-32
      screws, spaced at 0.625 in. (15.86 mm) centres, for one two-hole cable lug: the `stud-size` of
      both studs.
  ground-stud-pitch:
    confidence: datasheet
    note: >-
      the hardware guide, grounding points specifications: 0.625-in. (15.86-mm)
      centres, which is 5/8 in., 15.875; the guide rounds the conversion.
      `ground-studs` is one placement of juniper/mx-ground-stud-pair-5-8@1, which composes
      juniper/mx-ground-stud@1 twice at exactly 15.875 (L116) and presents
      `stud-pair-5-8`, so one two-hole lug (generic/two-hole-lug-5-8@1) lands across the pair
      and the ring lug still lands on either stud, `ground-studs/1` and `/2`.
      The two studs were drawn 14.0 apart; they moved symmetrically about the
      midpoint the photograph placed, (394.75, 19.75), one stud above the other, so the host is placed at
      `rotate: 90` and a lug's wire leaves downward, and their cutouts with them.

  mic-bays:
    confidence: photo-measured
    note: >-
      the two MIC bays are the MIC plate, 168.8 x 29.2 (#261), placed off the front photograph at 3.088
      px/mm - the ganged-SFP pitch of the 20x1GE MIC, 44.0 px, which also gives 445.0 mm for the 1374 px
      between the ear wings (62 to 1436 px), the frame this device is drawn in. The plates run 150.7 to
      672.5 and 674.5 to 1197.0 px (x 28.7 and 198.3, a 169.6 pitch, which leaves 0.8 mm between 168.8 plates; the 2 px
      gap in the photograph reads 0.6, its plates reading 169.0
      wide there, within a pixel of 168.8) and 29.5 to 120.0
      px down from a chassis top at 9.5 px (y 6.5). Until 3.0.0 they were 168 x 27 at x 25.0 and 193.4, y
      11. The fixed panel was re-measured on the same frame at 4.0.0 (fixed-panel).
attrs:
  physical:
    weight-note: Table 31 gives 30 lb (13.6 kg) for the modular chassis with fan
      tray, power supplies and MICs (28 lb, 12.7 kg, for the fixed chassis);
      not yet carried as a weight figure
  power:
    power-typical-w: 310
    power-envelope: fully-configured
    power-typical-scope: OUTPUT side, AC and DC alike - modular chassis at high
      activity with the four fixed XFPs, two MICs and fans at high speed
      (Tables 14 and 20); AC input 365 W at 85% efficiency
  thermal:
    max-thermal-output: 1705 BTU/hour (500 W) (Table 32; provisioning ceiling -
      one supply's 500 W maximum output times 3.41, not the 310 W draw)
  lifecycle:
    eol: announced
    eol-announcement: https://support.juniper.net/support/eol/product/m_series/
chassis:
  width: 445.0
  height: 88.9
  depth: 596.0
  ru: 2
  color: '#2b2f36'
gaps:
  - what: fixed-panel-extras
    reason: needs-photo
    wanted: a close photograph of the RE panel and fan tray - the front
      photograph shows two lamps above SYS OK and RE and a second button
      right of ONLINE/OFFLINE, none identified, and a fan tray x 380.5-441.4
      where the fan-tray contract is 38 wide at 407. The rest of the fixed
      panel was re-placed at 4.0.0 (provenance.fixed-panel, #901).
  - what: ethernet-port-speed
    scope: [ethernet]
    reason: sources-disagree
    note: >-
      The MX5/MX10/MX40/MX80 hardware guide says two things about the one management jack. Its
      Routing Engine description gives one 1-Gbps Ethernet port for the management network; its
      ETHERNET port pinout section calls the same jack an autosensing 10/100-Mbps RJ-45
      receptacle. Neither is carried. The EXT CLK A and B jacks are the two BITS clock inputs the
      same description lists, so they are `rj48`.
    wanted: >-
      a third source - a datasheet, or a photograph of the jack lamps with a legend - that settles
      the ETHERNET port at 100M or 1G.
  - what: mx80-fixed-variant
    reason: needs-photo
    wanted: the fixed MX80 faceplate (Figure 8, built-in 48x1GbE) - a
      different front panel that would be a second device or configuration;
      only the modular chassis is modelled.
  - what: dc-power-variant
    scope: [psus]
    reason: needs-photo
    wanted: the DC supply face (guide Figure 16 is isometric line art).
  - what: rear-clock-jack-type
    scope: [timing]
    reason: needs-photo
    wanted: confirmation whether the rear CLK/SYNC jacks are SMB or BNC -
      drawn SMB, photo resolution insufficient.
groups:
  mics:
    term: Slot
    role: traffic
    index-origin: 0
    description: MIC slots 1/MIC 0 and 1/MIC 1 across the top
  xe:
    term: Port
    role: traffic
    index-origin: 0
    attrs:
      media: xfp
      speed: 10g
    description: The four fixed 10GbE XFP ports (0/MIC 0), silkscreened 0-3
  xe-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: LINK lamp beside each fixed XFP port
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: the fixed Routing Engine panel - CONSOLE/AUX, ETHERNET/USB, the
      EXT CLK A/B jacks and the SYS OK / RE lamps with the ONLINE/OFFLINE
      button
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
  timing:
    term: Port
    role: management
    index-origin: 0
    description: the rear CLK and SYNC clock jacks
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - when two power supplies are present they share power almost equally within a fully populated system, and if one in a redundant configuration fails the other carries the router'
  cooling:
    term: Tray
    role: service
    index-origin: 0
  service-covers:
    term: Cover
    role: furniture
    index-origin: 0
    description: the rear MPC 0 / MIC 1 service cover plate
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the protective-earthing stud pair under the rear earth
      symbol (guide Figure 23)
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: >-
      the wrist-strap ESD point at the rear right (guide Figure 64, ESD Points; the
      grounding points are Figure 23)
