format: 1
kind: device
name: mx80
version: 1.0.6
maturity: modelled
manufacturer: Juniper
model: MX80
portfolio:
  line: MX Series
  family: 3D Universal Edge Router
description: >-
  Juniper MX80 modular chassis (EOL) - the 2RU box the MX5, MX10, MX40 and
  MX80 all share, differing only in licensed capacity. Two MIC slots across
  the top (1/MIC 0, 1/MIC 1), and below them the two AC supplies (PS 0/PS 1),
  the fixed blue Routing Engine panel (CONSOLE/AUX, ETHERNET/USB, EXT CLK
  A/B, SYS/RE lamps) with the four fixed 10GbE XFP ports (0/MIC 0), and the
  side-pull fan tray behind the JUNIPER-branded door at the right.
profile: networking
provenance:
  sources: MX5/MX10/MX40/MX80 Hardware Guide, and the image-library photographs
    mx80-front-high and mx80-rear-high (the mx5 set is the same base asset,
    recorded in the photo catalogue). No mechanical drawing was available
  chassis: 'datasheet-table - the guide chassis description: 3.5 x 17.5 x
    23.46 in (88.9 x 445 x 596 mm), 2RU. Ears NOT MODELLED by convention'
  shared-chassis: 'guide - the MX5, MX10, MX40 and MX80 are one chassis with
    different capacity licences and MIC entitlements (guide Figures 5-9);
    they are modelled as ONE device with the SKUs as configurations. The
    FIXED MX80 variant (Figure 8, 48x1GbE built in) is a different faceplate
    and is not modelled - see gaps'
  scale: 'photo - per-axis anchoring of the front photograph (body between
    the ear wings anchored to 445 mm; rows to 88.9). Positions are
    single-pass readings approximate to ~2 mm'
  front: 'photo - MIC row y 7-41.5 with slots at x 25.0 and 193.4 (the
    reference unit carries the 20x1GE SFP MIC and the 2x10GE XFP MIC);
    PS 0/PS 1 at x 14.7/86.2 in the lower band; the blue RE panel from
    162.6 to 406 carrying CONSOLE over AUX (x 190), ETHERNET over USB
    (x 213), EXT CLK A over B (x 232), the SYS OK / RE lamps and
    ONLINE/OFFLINE button at its left, and the four fixed XFP cages at
    centres 261.6-349.7 with LINK lamps, silkscreened 0-3 over 0/MIC 0;
    the MX80 badge at 355; the fan-tray door at 407-445'
  rear: 'photo - a blank cover plate over the upper-left aperture labelled
    MPC 0 / MIC 1, the CLK and SYNC jacks at x 68/105 (y 75), the two-hole
    earthing plate and ESD at the right. The jacks are drawn as SMB
    (photograph resolution cannot distinguish SMB from BNC - recorded)'
  power: 'NOT STATED at chassis level in the extraction; per-module rows
    were not captured either. The L27/L29 warnings stand as the record'
  lifecycle: 'announced - the whole MX5-MX80 family is EOL (guide banners
    and family tables); per-SKU dates on the Juniper milestones page'
  color: 'photo - dark charcoal chassis, silver MICs, dark blue RE panel and
    fan door (Juniper''s MX80-era styling)'
  other-faces: 'near-blank by evidence - rail bands estimated; axis
    conventions per viewer3d.js as the siblings'
attrs:
  physical:
    weight-note: not captured in this extraction (see gaps)
  lifecycle:
    eol: announced
    eol-announcement: https://support.juniper.net/support/eol/product/m_series/
chassis:
  width: 445.0
  height: 88.9
  depth: 596.0
  ru: 2
  color: '#2b2f36'
gaps:
  - what: mx80-fixed-variant
    reason: needs-photo
    wanted: the fixed MX80 faceplate (Figure 8, built-in 48x1GbE) - a
      different front panel that would be a second device or configuration;
      only the modular chassis is modelled.
  - what: dc-power-variant
    scope: [psus]
    reason: needs-photo
    wanted: the DC supply face (guide Figure 16 is isometric line art).
  - what: chassis-weight-and-power
    reason: vendor-silent
    wanted: the weight and power tables - outside this extraction's text
      layer; L27/L29 warnings stand on the modules.
  - what: rear-clock-jack-type
    scope: [timing]
    reason: needs-photo
    wanted: confirmation whether the rear CLK/SYNC jacks are SMB or BNC -
      drawn SMB, photo resolution insufficient.
groups:
  mics:
    term: Slot
    role: traffic
    index-origin: 0
    description: MIC slots 1/MIC 0 and 1/MIC 1 across the top
  xe:
    term: Port
    role: traffic
    index-origin: 0
    attrs:
      media: xfp
      speed: 10g
    description: The four fixed 10GbE XFP ports (0/MIC 0), silkscreened 0-3
  xe-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: LINK lamp beside each fixed XFP port
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: the fixed Routing Engine panel - CONSOLE/AUX, ETHERNET/USB, the
      EXT CLK A/B jacks and the SYS OK / RE lamps with the ONLINE/OFFLINE
      button
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
  timing:
    term: Port
    role: management
    index-origin: 0
    description: the rear CLK and SYNC clock jacks
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - when two power supplies are present they share power almost equally within a fully populated system, and if one in a redundant configuration fails the other carries the router'
  cooling:
    term: Tray
    role: service
    index-origin: 0
  service-covers:
    term: Cover
    role: furniture
    index-origin: 0
    description: the rear MPC 0 / MIC 1 service cover plate
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the protective-earthing stud pair under the rear earth
      symbol
