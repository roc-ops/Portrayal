configurations:
  ac:
    kind: base
    description: >-
      EX2300-24T - 24 10/100/1000 ports without PoE and four SFP+/SFP uplinks, built-in AC supply and
      one built-in fan, front-to-back airflow. Table 1, no Virtual Chassis licence.
    default: true
    part-numbers:
      EX2300-24T: {}
  dc:
    kind: orderable
    description: >-
      EX2300-24T-DC - the same front with a built-in DC supply (Table 1, Figure 13). A four-pole terminal
      block replaces the AC inlet on the rear, and the fan is in another place. The weight is 3.55 kg.
    views: {rear: rear-dc}
    part-numbers:
      EX2300-24T-DC: {}
  taa:
    kind: orderable
    description: >-
      EX2300-24T-TAA - the same chassis sold as Trade Agreements Act compliant (Table 1); the front panel
      and rear are those of the EX2300-24T.
    part-numbers:
      EX2300-24T-TAA: {}
  vc:
    kind: orderable
    description: >-
      EX2300-24T-VC - the same chassis with the Virtual Chassis licence (Table 1). The packing list adds
      a paper licence. The front panel and rear are those of the EX2300-24T.
    part-numbers:
      EX2300-24T-VC: {}
