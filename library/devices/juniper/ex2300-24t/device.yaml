format: 1
kind: device
name: ex2300-24t
version: 0.4.0
maturity: modelled
manufacturer: Juniper
model: EX2300-24T
portfolio: {line: EX Series, family: EX2300}
description: >-
  Juniper EX2300-24T is a fixed 1RU Gigabit Ethernet access switch. It has 24 10/100/1000BASE-T ports
  without PoE and four built-in 10-Gigabit SFP+/SFP uplink ports. The front carries the 24 jacks in two
  stacked rows numbered 0 to 23, and the upper jack of a column takes the even number. It also carries
  the four uplinks numbered 0 to 3, three status lamps, three port-mode lamps, a Factory Reset/Mode button
  and a mini-USB console port. The rear carries the management Ethernet port with a USB port under it,
  the RJ-45 console port, a two-hole earthing terminal and an ESD point. It also carries one exhaust fan
  and the AC power cord inlet. The power supply and the fan are built into the chassis, so there are no
  bays. The -TAA and -VC part numbers are the same chassis. The -DC part number is the same front with
  a DC terminal block on the rear. The EX2300-24P is the same front with PoE.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX2300 Switch Hardware Guide, Juniper Networks, published 2025-08-12 (314 pages; https://www.juniper.net/documentation/us/en/hardware/ex2300/ex2300.pdf):
      Figure 3 and Figure 4 (front panels), Figure 9 to Figure 13 (rear panels), Table 1 (models), Table
      3 (chassis size and weight), Tables 4 to 12 (LEDs), the cooling system section, Tables 14 to 16
      (power) and Table 34 (parts list). Juniper's own straight-on studio photographs of the EX2300-24P
      and EX2300-48P fronts, of the EX2300-48P rear, and of a DC-powered 24-port rear (file named ex2300-24p-rear-high.jpg,
      which shows the DC terminal block and a single fan, so it is the EX2300-24T-DC rear and not the
      24P). The maker's image library holds no photograph of the EX2300-24T itself (the 48T front address
      was tried and returned a page, not an image). The HPE PSNow datasheet (a00151236enw) did not answer
      when fetched, so no datasheet is cited. The held NetBox elevations of the 24T (juniper-ex2300-24t.front.png,
      530 x 49 px, and juniper-ex2300-24t.rear.png, 530 x 50 px) are the only pictures held of the EX2300-24T
      itself: the front confirms the 24-port jacks-on-the-right layout and the rear the AC arrangement
      and its edge screws. They are too small to measure from and no position is read off the front.
  gate-1:
    confidence: measured
    note: >-
      The 24P front photograph is 1500 x 190 px with the body 1446 px across and 143 down: 10.11 against
      the stated 441.9 / 44.45 = 9.94, 1.7 percent out, so x is taken at 3.272 px per mm from the width
      and y at 3.217 px per mm from the height. The ganged jack pitch then reads 45.7 px = 13.96 mm, the
      0.550 in pitch the registry records for the ganged RJ-45 cell, on a quantity the scale never saw.
      The 48P photograph agrees on every feature both show to within 0.7 mm in x and 1.4 mm in y; the
      y values here are the mean of the two. The DC rear photograph (1455 px across, 3.293 px per mm,
      3.217 down) and the 48P rear (3.234 across, 3.09 down) give the rear positions. Every position is
      estimated and good to about a millimetre.
  chassis:
    confidence: datasheet
    note: >-
      Table 3: height 1.75 in (4.45 cm), width 17.4 in (44.19 cm) and 19 in (48.26 cm) with the mounting
      brackets attached, depth 10.2 in (25.9 cm) for models without PoE capability, weight 7.25 lb (3.29
      kg) and 7.83 lb (3.55 kg) for the EX2300-24T-DC. 441.9 x 44.45 x 259.0 is carried: the metric as
      printed for width and depth and the height as the 1U pitch Table 35 gives (1.75 in, 4.45 cm). The
      photographs show no ears, and the jack pitch closing on the registry at that width says the figure
      is the body.
  front-layout:
    confidence: estimated
    note: >-
      estimated - the 24-port front is the 24P photograph's, without the PoE items: the guide says the
      PoE lamp is present only on models with PoE capability, so three port-mode lamps (SPD, DX, EN) and
      no POE legend, and the red PoE+ mark beside the model name is not drawn. No photograph of a non-PoE
      front exists, so the model name is printed EX2300 as on the PoE units. The 24 jacks stand in two
      shells of six columns, the first jack at 187.0 mm and the shell step 88.8 mm (6 x 13.97 plus a 5.0
      gutter), right-aligned so that the last shell ends where the uplink block begins at 364.6; the rows
      are 14.8 mm apart and the upper row is turned 180 so its lamps and keyway are above, as the photograph
      shows. The four SFP+ cages abut on the registry pitch of 14.25 at 364.6, one row. A darker plate
      carries the model legend and lamps at the top right and runs down the far right edge. The hexagonal
      vent fields along the top edge and above the uplinks, and the slotted row along the bottom edge,
      are read off the same photographs.
  port-numbering:
    confidence: photo-measured
    note: >-
      photo-measured - the photograph prints each column's two numbers in orange under the shell, the
      even number up and left and the odd number down and right (0 and 1, 2 and 3, ... 22 and 23), so
      the upper jack takes the even number; the uplinks print 0 to 3 in white between their two lamps.
      Port numbers are as printed on the metal, from 0. The Junos interface names are not printed: the
      guide's Table 2 gives PIC 0 as 24x10/100/1000 Base-T and PIC 1 as 4x10G SFP/SFP+, i.e. ge-0/0/0
      to ge-0/0/23 and xe-0/1/0 to xe-0/1/3; they are recorded here and not in an interfaces block because
      the faceplate does not print them. Table 11 notes that on the EX2300-24T only the ports labelled
      0/0 through 0/15 support half-duplex.
  lamps:
    confidence: datasheet
    note: >-
      Hardware guide, Tables 4 to 12 and Figures 24, 26 and 27. Each RJ-45 port and uplink has two lamps,
      Link/Activity and Status; Figure 24 puts Link/Activity on one corner of the jack and Status on the
      other. The Status lamp reads out whichever of SPD, DX and EN the Factory Reset/Mode button has selected
      (PoE too on a PoE model), shown by which port-mode lamp is lit. SYS is green, ALM red or yellow
      and MST green. The jack lamps keep the component's link and activity vocabulary because a block
      cannot override it per lamp. On the uplinks the left slot is taken as Link/Activity and the right
      as Status by analogy with the jacks, which no figure confirms, so it is estimated.
  uplinks:
    confidence: photo-measured
    note: >-
      photo-measured - one row of four SFP+/SFP cages numbered 0 to 3 with a pair of lamp slots flanking
      each numeral; the guide gives 4x10G SFP/SFP+ and says the ports can be Virtual Chassis ports with
      SFP+ transceivers but not with SFP.
  front-console:
    confidence: estimated
    note: >-
      estimated - the mini-USB console port (guide Figure 3, callout 5, printed CON) is the placed std/mini-usb
      (`console-usb`), centred on the 7.9 x 4.6 mm shell this device was drawn with, which was read off
      the 24P and 48P photographs (25 x 14 px and 24 x 14 px at 3.27 px per mm). The part draws the registry's
      7.7 x 3.9 mm Mini-B shell, which stands in for the maker's own (gap `mini-usb-console-shell`). The
      guide names the connector: "Mini-USB Type-B (5-pin)" (Console Ports, p4; Mini-USB Port Pinout Specifications,
      p86).
  rear-layout:
    confidence: estimated
    note: >-
      estimated - positions off the 48P rear photograph (3.234 px per mm across, 3.09 px per mm down)
      for the management and console jacks, USB port, earthing terminal, ESD point and AC inlet, which
      Figure 11 shows at the same places on the 24-port non-PoE AC model. The single exhaust fan sits
      at 0.308 of the width (136.1 mm) in Figure 11, read off the drawing. The guide's drawing puts a
      serial number label and a CLEI label on the rear; the studio photographs show neither, so none is
      drawn. The nine edge screws are read off Figure 11 (the body 874 px across at 1.978 px per mm; the
      first at 51.6 mm, the last at 424.7 mm, centres, drawn at y 37.4 as on the DC rear) and are estimated.
      The held NetBox 24T rear elevation (juniper-ex2300-24t.rear.png, 530 x 50 px, the only picture held
      of this AC rear) draws the same nine in the same grouping, two left of the fan, five between the
      fan and the label area and two beside the inlet, with each within about 8 mm of Figure 11 except
      the second, which is about 18 mm further left; the figure's positions are kept because the elevation
      is too small to measure closer. Figure 11 prints 12A Max above the inlet where Table 15 gives 2.5
      A at 100 VAC for the 24T; the legend is drawn as 2.5A Max, the 12A Max being likely a copy of the
      48P legend in the figure.
  rear-dc:
    confidence: photo-measured
    note: >-
      photo-measured - the EX2300-24T-DC rear from the studio photograph named ex2300-24p-rear-high.jpg
      at 3.293 px per mm: the same management and console cluster and earthing plate as the AC rear, the
      ESD symbol and point lower and to the right of the plate (64.4 and 77.5 mm, 21 mm down) instead
      of beside it, the single fan at 115.7 mm, nine screws along the lower edge, no earth symbol left
      of the plate, and a four-pole DC terminal block 52.6 mm wide at 377.3 mm in place of the AC inlet.
      Figure 13 draws the earth symbol beside the plate while the photograph does not, so the two disagree
      on that one mark and the photograph won; the rest of Figure 13's arrangement matches the photograph.
      The block is drawn as chassis art (a plate, a dark strip, two mounting screws and four terminals,
      sized off the photograph) and is not a component, because the DCIM export has no row for a part
      of that kind and a placed part would export nothing. The legend printed over the block reads DC
      INPUT : -44V- -72V, a DC symbol, 3.7A Max; the guide's Table 16 gives -48 through -60 VDC at 2.8
      A maximum (the printed range is the wider), both are recorded and the printed text is drawn with
      the DC symbol the photograph and Figure 13 both print. The guide's figure labels the poles INPUT
      1 and INPUT 2 under the block; the photograph shows no label there and none is drawn.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Hardware guide, Power Supply in EX2300 Switches: "The power supply in EX2300 switches is built in
      along the rear panel of the chassis"; Table 34 lists "Switch with built-in power supply"; the cooling
      system is "two fans built-in along the rear of the chassis" and the non-PoE rears (Figures 11 to
      13) show a single exhaust opening. Nothing in the guide describes removing or replacing either.
      They are part of the chassis, not bays and not components. The guide's CLI inventory examples name
      the supply JPSU-170W-AC and JPSU-450W-AC-AFO as built-in items of the EX2300-C-12P and EX2300-24P.
  airflow:
    confidence: datasheet
    note: >-
      the cooling system provides front-to-back chassis cooling (Figure 38 for models without PoE).
  power:
    confidence: datasheet
    note: >-
      Table 14: maximum power consumed 55 W for the EX2300-24T and for the EX2300-24T-DC, no PoE; Table
      15: 100 through 240 VAC, 50/60 Hz, 2.5 A at 100 VAC and 1.25 A at 240 VAC; Table 16: DC input -48
      through -60 VDC, 2.8 A maximum, power supply output 100 W, holdup 5 ms minimum. The AC legend on
      the rear is drawn from Table 15 (2.5A) and not read off a figure.
  colour:
    confidence: photo-measured
    note: >-
      median of the bare front plate in the 24P photograph (#919599); the plate at the top right #6e7276.
  ground-stud-pitch:
    confidence: estimated
    note: >-
      INFERRED, NOT STATED. Table 36 names two 10-32 x .25 in. screws with #10 split-lock washers and
      a Panduit LCC10-14AW-L lug or equivalent (not provided) for the EX2300 and EX2300-C, and gives no
      spacing. The rear photograph puts the two holes 15.9 mm apart: 5/8 in. (15.875) and not 3/4 in.
      (19.05). The lug's own code is not in the library's registry, so it is the photograph that carries
      the pitch. The terminal is `common/ground-hole-pair-5-8-10-32@1`: two bare 10-32 holes on 5/8 in.
      centres, presenting `stud-pair-5-8`, so one two-hole lug (`generic/two-hole-lug-5-8@1`) lands across
      them and a ring lug still lands on either hole. The holes stay bare, as the photograph shows them;
      the screws that hold the lug are not part of the switch. The holes were drawn 15.9 apart as decor
      and the pair stands on their midpoint.
attrs:
  physical:
    weight-note: 7.25 lb (3.29 kg); the EX2300-24T-DC 7.83 lb (3.55 kg), Table 3
  power:
    power-max-w: 55
    power-envelope: bare
    power-input: 100 through 240 VAC, 50/60 Hz; the -DC part number -48 through -60 VDC
    power-current-max: 2.5 A at 100 VAC; 1.25 A at 240 VAC; -DC 2.8 A
  thermal: {cooling: 'one built-in fan, front-to-back'}
  environmental: {operating-temp-c: 0 to 45, humidity: '10 to 85 percent, noncondensing', altitude-ft: '13,000
      at 40 C'}
  features:
    optics-sfp-plus: >-
      hardware guide, Uplink Ports: the four uplink ports take SFP and SFP+ transceivers. A Virtual Chassis
      can be formed with SFP+ and not with SFP
    virtual-chassis: >-
      up to four switches; the -VC part number ships with the Virtual Chassis licence on paper, the other
      part numbers do not
chassis: {width: 441.9, height: 44.45, depth: 259.0, ru: 1, weight-kg: 3.29, color: '#919599', airflow: front-to-back,
  power: ac}
gaps:
- what: mini-usb-console-shell
  scope:
  - console-usb
  reason: needs-photo
  note: >-
    The part is the registry's Mini-B receptacle (Molex drawing SD-54819-026, 7.7 x 3.9 mm). The front
    photographs show the console shell at about 25 x 14 px at 3.27 px per mm, 7.6 x 4.3 mm, and no close-up
    is held, so the drawn shell and its place are estimates and the maker's own shell may differ by a
    few tenths.
  wanted: >-
    A straight-on close-up of the console port with a scale, or the maker's dimensioned drawing of it.
- what: rack-ears
  scope:
  - front
  reason: needs-drawing
  note: >-
    Table 35 lists the supplied two-post mounting brackets and a separately orderable four-post rack-mount
    kit (EX-4PST-RMK, named in the clearance section); no figure measures a bracket position, so no ear
    position is stated and no kit is listed.
  wanted: A dimensioned drawing of the bracket positions.
- what: eol
  scope:
  - front
  reason: vendor-silent
  note: >-
    Searched for an end-of-life notice: only third-party lifecycle trackers answered; Juniper's own bulletin
    was not found, so no lifecycle is written.
  wanted: Juniper's end-of-life bulletin for the EX2300 line.
- what: front-photograph
  scope:
  - front
  reason: needs-photo
  note: >-
    The maker's image library holds no EX2300-24T photograph; the front is the 24P's without the PoE items.
  wanted: A straight-on studio photograph of the EX2300-24T front.
- what: ac-rear-photograph
  scope:
  - rear
  reason: needs-photo
  note: >-
    No photograph of the non-PoE AC rear exists in the maker's library; its rear is the 48P's photographed
    parts at the positions of the guide's Figure 11, without the second fan, and the edge screws placed
    from that figure (estimated; the held NetBox elevation agrees on their count and grouping).
  wanted: A straight-on studio photograph of the EX2300-24T AC rear.
- what: jack-lamp-meaning
  scope:
  - rj45
  reason: vendor-silent
  note: >-
    The jack lamps carry the component's link and activity vocabulary; the guide's Status lamp switches
    meaning with the mode button and no per-lamp state list fits the component.
  wanted: none beyond the component's own vocabulary.
- what: ground-pair-pitch
  scope:
  - ground-pair
  reason: vendor-silent
  note: >-
    The guide names the screws and the lug and gives no spacing for the two holes; `ground-stud-pitch`
    says what the pair is drawn at and why.
  wanted: a drawing that dimensions the two holes, or the lug's own datasheet
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g}
    description: >-
      the 24 built-in 10/100/1000BASE-T ports; rel-pos carries the number printed on the faceplate, the
      upper jack of a column takes the even number
  uplink:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: the four built-in SFP+/SFP uplink ports, numbered 0 to 3
  uplink-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: two lamps beside each uplink numeral, Link/Activity and Status
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      how the switch is reached out of band - the mini-USB console port on the front, the RJ-45 console
      port, the management Ethernet port and the USB port on the rear
  controls: {term: Button, role: management, index-origin: 0, description: the Factory Reset/Mode button}
  status-leds: {term: LED, role: indicator, index-origin: 0, description: 'the SYS, ALM and MST chassis
      status lamps'}
  mode-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the SPD, DX and EN port-mode lamps; the one lit says what each Status lamp shows
  power-input: {term: Inlet, role: service, index-origin: 0}
  esd: {term: Point, role: furniture, index-origin: 0}
  furniture: {term: Item, role: furniture, index-origin: 0}
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the earthing terminal, two bare 10-32 holes for a two-hole lug (Table 36)
