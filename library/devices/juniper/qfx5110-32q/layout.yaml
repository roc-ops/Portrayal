format: 1
kind: device
name: qfx5110-32q
version: 0.1.1
maturity: modelled
manufacturer: Juniper
model: QFX5110-32Q
portfolio: {line: QFX Series, family: QFX5110}
description: >-
  Juniper QFX5110-32Q, a 1RU data-centre spine and leaf switch running Junos OS. It has 28 QSFP+ ports and
  4 QSFP28 ports. A QSFP+ port runs at 40 GbE, or as four 10 GbE ports with a breakout cable. A QSFP28 port
  runs at 100 GbE or 40 GbE. The port side also carries the RJ-45 grandmaster clock port and the 10 MHz and
  1 PPS outputs. The rear carries two power supplies, five fan modules, the console, two management ports,
  a USB port, the reset button and the four chassis lamps. One front panel ships in four power and airflow
  variants. They have AC or DC supplies, with airflow front-to-back (AIR OUT) or back-to-front (AIR IN). A
  spare chassis ships without supplies or fan modules.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper QFX5110 Switch Hardware Guide, published 2026-09-24, 228 pages (Juniper Networks, address
      below; terms: the guide's copyright notice and the Juniper EULA it names, a reference copy kept
      outside the repository). Tables 3 (models and part numbers), 5, 6, 8 to 10 (lamps), 11 (fan modules),
      13 and 14 (AC supplies), 18 to 20 (DC supplies), 22 (environment), 24 (physical specification);
      figures 13 and 15 (port panel), 16 to 19 (rear and management panel), 20 to 27 (fan modules, airflow
      and supplies). Juniper's studio photograph of the 32Q front (image library, qfx5110-32q-front-high,
      2100 x 497 px). The datasheet is at a Juniper address that redirects to an HPE document viewer
      (a00150813enw); it did not answer, so no datasheet figure is used and none is cited.
      The studio photograph of the rear (qfx5110-32q-rear-high) returned an HTML 404 page, so the rear has
      only the guide's drawings. No Visio stencil or 3D model was available, and none is named by the guide.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 24: 1.72 in (4.3 cm) high, 17.36 in (44.1 cm) wide, 20.48 in (52.02 cm) deep excluding the
      fan and power supply handles, 24.6 lb (11.16 kg) with two power supplies. 1.72 in is 43.7 mm and 4.3 cm
      is 43 mm; the inch figure is carried, as the 1RU height. The width is the body: the mounting brackets
      are not part of it and are not modelled.
  gate-1:
    confidence: photo-measured
    note: >-
      Front: the studio photograph. Its body is 1942 px wide (columns 91 to 2033) and 192.5 px high (rows 137.0
      to 329.5), an aspect of 10.09 against the table's 440.9 / 43.7 = 10.09. Scale 4.405 px/mm both ways. The
      photograph is turned about 0.15 degrees: the port rows sit about 1.1 mm higher at the right end than at
      the left. Positions are read at the middle of the face and the bracket round the 100G ports, read at
      the right end, is carried 0.55 mm down. Rear: figure 16, a raster drawing 1500 px wide whose body
      outline is 1449 x 146.5 px, an aspect of 9.89, 2 percent out; the positions along the width are taken
      at 3.286 px/mm and those down the height at 3.35 px/mm. Figure 15 is a 1500 px flat drawing of the
      front used only to count and to read the printing.
  ports:
    confidence: photo-measured
    note: >-
      Front photograph, dividers between cages found as bright columns across the opening: 32 cages in four
      groups of four columns, each column a pair, on a pitch of 83.7 px, 19.0 mm, which is the registry's
      qsfp-ganged pitch. The groups start at 394, 798, 1202.5 and 1606.5 px, a stride of 404.2 px, 91.76 mm,
      so the gutter is 91.76 - 4 x 19.0 = 15.76 mm, and the first cage starts at 68.8 mm from the left edge.
      Ports 0 to 27 are QSFP+ and 28 to 31 QSFP28 (the guide's callouts 5 and 6 of figure 15); the last
      group holds QSFP+ ports 24 to 27 and QSFP28 ports 28 to 31 on one pitch. The cells use the registry's
      18.5 x 9.58 aperture for both; the photographed cage faces are 8.9 mm high because they include the
      bezel. QSFP+ and QSFP28 share a cage size and are told apart by their legends and the bracket.
  row-pitch:
    confidence: photo-measured
    note: >-
      Down the columns the cage faces run from row 185 to 224 and 243 to 282 px, centres 15.3 and 28.5 mm
      below the top edge, a row pitch of 13.2 mm. y is good to about 0.5 mm because of the tilt.
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md): the upper cage upright and the lower one
      turned 180, so both lips face the band between the rows. The photograph shows the latch lip at the top
      of the upper cages' openings and the foot of the lower ones; the convention is applied.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed on the metal and read off the photograph and figure 15: ports run 0 to 31, even above the upper
      row and odd below the lower row, the numeral centred over or under each cage between the cage and its
      four lamps. The guide's text numbers the QSFP+ ports 0 through 27 and the QSFP28 ports 28 through 31.
      Interface names are not printed on the unit and the guide's front-panel text does not state them, so
      none is written to the manifest.
  port-lamps:
    confidence: photo-measured
    note: >-
      Four dots stand at 4.1 mm pitch above each upper cage and below each lower one, centred on the cage and
      7.6 mm and 37.3 mm below the top edge (Tables 5, 6 and 8, bi-colour). The first lamp of a port is the
      link lamp of an unchannelized port; the other three are channel lamps (Table 6).
  hundred-gig:
    confidence: photo-measured
    note: >-
      A box is printed round ports 28 to 31: a line above 28 and 30 and below 29 and 31, broken for the
      numerals, closed at the right end and lettered 100G beside it. It is drawn from the photograph as a
      printed path and a legend.
  vents:
    confidence: estimated
    note: >-
      Two staggered rows of hexagonal holes along the top edge (0.9 to 5.4 mm) and one along the bottom (40.4
      to 43.5 mm), the length of the port field, and a patch of hexagons in each of the three gutters between
      the groups, 9.4 mm wide and 27.6 mm high. They are drawn as vent strips; the hexagon pitch is estimated
      from the photograph at 3 times, as the pattern is a rectangular approximation of a staggered hexagon
      field.
  front-left:
    confidence: photo-measured
    note: >-
      Left of the port block, read off the photograph at 3 times and scaled at 4.405 px/mm: the RJ-45
      grandmaster jack (GM, callout 2) centred 17.4 mm from the left and 14.4 mm below the top; two gold
      coaxial jacks 7.5 mm across, 10M OUT centred at 34.7 mm and PPS OUT at 49.5 mm from the left, both
      16.7 mm below the top; the ESD symbol at 7.2 mm, 31.6 mm and the ESD jack below it at 7.2 mm, 38.8 mm.
      The lamps in the corners of the GM jack are green in the photograph; the guide names no function for
      them, so they are not modelled as lamps (see gaps).
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      On this model the guide's figure 15 and the photograph agree: 10M OUT is the left jack and PPS OUT the
      right one (callouts 3 and 4). The guide's text calls the pair "SubMiniature B (SMB)" connectors; the
      photograph shows threaded SMA-style jacks 7.5 mm across, drawn as the registry's SMA (see gaps). The
      guide's figure 15 prints "GM" under the RJ-45 jack, as the photograph does.
  rear-layout:
    confidence: estimated
    note: >-
      Figure 16, the flat drawing of the FRU end, with figure 17 for the management panel, both read at 3.5
      times; the rear is the same for both models of the family. There is no photograph of the rear: the
      studio rear photograph returned a 404 page. At the left a 63.2 mm panel carries the QFX5110 and RUNNING
      JUNOS chip and the logo (not drawn), the four chassis lamps ALM, SYS, MST and ID, two stacked SFP cages
      (C0 above C1), the console and C0 jacks stacked in one shield, the USB port and the reset pinhole. Then
      five fan slots on a 48.95 mm pitch, each preceded by a fan icon, its number 0 to 4 and a status lamp,
      then two supply slots on a 60.8 mm pitch, each preceded by a power icon and its number 0 or 1. The
      fan and supply slots measure 40.9 x 41.6 mm and 54.8 x 39.8 mm, which are the sizes of the components
      that seat there. Every position is estimated from a drawing 2 percent out in aspect.
  mgmt:
    confidence: drawing
    note: >-
      Figure 17 and its key: em0 is the RJ-45 management port C0 (callout 2, lower jack), and the key's
      callout 2 also names an additional SFP management port, "the second C0" (upper SFP cage); em1 is the SFP
      management port C1 (callout 5, lower SFP cage); callout 3 is the RJ-45 console port CON (upper jack).
      The guide says that if both C0 ports are cabled the copper one takes priority. Table 9 gives the lamps.
      The drawing shows no lamps on the SFP cages.
  rear-drawing-vs-text:
    confidence: drawing
    note: >-
      Figure 16 draws back-to-front fans (AIR IN) beside supplies lettered AFO. The two cannot be mixed
      (Tables 11, 13 and 18), so the drawing mixes two builds. The default configuration here is
      front-to-back with Juniper Gold handles per Tables 13 and 18; the AFI configuration is the blue
      build. Figure 16 is not followed for the lettering.
  modules:
    confidence: datasheet
    note: >-
      The fan modules (QFX5110-32Q-FANAFO and QFX5110-32Q-FANAFI, juniper/qfx5110-32q-fanafo and
      qfx5110-32q-fanafi) and the 650 W power supplies (JPSU-650W-AC-AFO, -AFI, -DC-AFO and -DC-AFI, reused
      from juniper/qfx5100-jpsu-650w-*) are field-replaceable units in bays, each its own component.
      Nothing on this chassis is a built-in unit that is not a bay. Guide Table 11 (pp. 40-41) names a
      fan module for each model and airflow, and p. 44 says to use only the one designed for the product
      number, so the 48S has its own. The guide says to fit a blank panel over an empty power
      supply slot but names no part number for it, so no blank is modelled. The spare chassis
      QFX5110-32Q-CHAS ships without supplies or fan modules (Table 3), so its configuration shows every bay
      open.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide names the rack mount kit JNP-4PST-RMK-1U-E (a partial toolless four-post kit:
      a pair of front and rear mounting rails, a pair of mounting brackets and sixteen M4 x 6 mm screws,
      orderable as a spare), for rails 23.5 to 30.6 in (59.7 to 77.7 cm) apart front to back (Table 25),
      flush with the front of the rack or recessed 2 in (5 cm) with the extension bracket. Rack kits are
      recorded here and not modelled in this slice, so `chassis.ears` and `chassis.kits` are left out. The
      modelled body is the 440.9 mm chassis, without brackets. Figure 71 shows a supply installed in a
      32Q with an EMI gasket; the guide does not otherwise describe the gasket.
  power:
    confidence: datasheet
    note: >-
      guide Table 14 (AC): 90 to 264 VAC, 50 to 60 Hz, 3.6 A at 90 VAC, typical 132 W and maximum 200 W for
      the 32Q. Table 19 (DC): rated -39 to -60 VDC, operating range -40 through -72 VDC, -8.2 A at 39 VDC,
      the same 132 W typical and 200 W maximum. The guide's note: maximum measured at 40 C ambient with SR
      optics at 100 percent load with IMIX traffic; typical at 25 C with DACs at 50 percent load with IMIX
      traffic, excluding transceivers. The AC pair is the device's, since AC is the default build; the DC
      feed is carried under its own keys.
  colour:
    confidence: photo-measured
    note: >-
      The front plate samples #767b82 (a 15 by 20 px mean on the plate left of the port block, #81868c at the
      right end) in the studio photograph. The photograph is lit and these are its values, not a paint
      reference. The rear has no photograph and carries the same chassis colour.
  lifecycle:
    confidence: estimated
    note: >-
      Searched the guide for an end-of-life notice and found none; the guide is dated 2026-09-24. No
      announcement for the QFX5110-32Q was looked for at Juniper's end-of-life pages, so the
      device states none announced, estimated.
attrs:
  physical:
    weight-note: 24.6 lb (11.16 kg) with two power supplies (Table 24)
    depth-note: 20.48 in (52.02 cm) excluding fan and power supply handles (Table 24)
  performance:
    switching-capacity: 2.56 Tbps aggregate throughput (guide, QFX5110-32Q Hardware)
    latency: 550 ns (guide, Benefits of QFX5110, for the line)
    qsfp-plus-speeds: 40 GbE; or four 10 GbE with a breakout cable
    qsfp28-speeds: 100 GbE or 40 GbE
    system-modes: default, and non-oversubscribed (ports 0 to 23 only, 960 Gbps). In default mode a 100 GbE optic in a QSFP28 port disables ports 20 to 27
  power:
    power-typical-w: 132
    power-max-w: 200
    power-envelope: unstated
    power-dc-typical-w: 132
    power-dc-max-w: 200
    power-input-ac: 90 to 264 VAC, 50 to 60 Hz, 3.6 A at 90 VAC (guide Table 14)
    power-input-dc: rated -39 to -60 VDC, operating range -40 to -72 VDC, -8.2 A at 39 VDC (guide Table 19)
    redundancy-note: two supplies, load-sharing and fully redundant; one may be removed and replaced while the switch runs
  thermal:
    fans: five fan modules, hot-swappable; the switch runs 30 seconds without thermal shutdown while one is replaced
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F) normal operation
    storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container
    humidity: 5 to 90 percent noncondensing; 5 to 93 percent short term
    altitude: no performance degradation to 2000 m (6562 ft)
  platform:
    cpu: 1.8 GHz quad-core Intel
    memory: 16 GB
    storage: 64 GB SSD
    software: Junos OS
  features:
    timing: RJ-45 grandmaster clock port (GM), 10 MHz output, 1 PPS output
    virtual-chassis: up to 10 switches in a ring with QFX5110 or QFX5100 members; also a Virtual Chassis Fabric spine or leaf
    optics-qsfp: 40 GbE QSFP+, direct attach and active optical cables, breakout cables to SFP+
    optics-qsfp28: 100 GbE QSFP28, direct attach and active optical cables
  management:
    oob: management port C0 (RJ-45, em0, with a second C0 SFP cage) and C1 (SFP, em1)
    console: RJ-45 console port (CON)
    usb: one USB port for image updates
  lifecycle:
    eol: none-announced
chassis: {width: 440.9, height: 43.7, depth: 520.2, ru: 1, weight-kg: 11.16, color: '#767b82', airflow: front-to-back, power: ac}
gaps:
- what: dc-operating-voltage
  scope: [rear]
  reason: sources-disagree
  wanted: >-
    Table 19 gives the rated operating voltage as -39 to -60 VDC and the operating range as -40 through
    -72 VDC, with the current rated at 8.2 A at 39 VDC. Both are transcribed as printed.
- what: datasheet
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    The QFX5110 datasheet (the token is the nearest the schema offers: the document exists but was not readable).
    Its address redirects to an HPE document viewer (a00150813enw) that did not answer in three
    tries, so its ordering table, weight and power were not read.
- what: usb-generation
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The USB revision. The guide names one USB port "for image updates" and gives no generation. It is drawn
    with the kit's neutral usb2 skin.
- what: clock-connector-type
  scope: [front]
  reason: sources-disagree
  wanted: >-
    The guide's text calls the 10 MHz and 1 PPS connections SubMiniature B (SMB); the photograph shows
    threaded jacks 7.5 mm across, drawn as the registry's SMA. The photograph is followed, estimated.
- what: gm-jack-lamps
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The studio photograph shows a green lamp in each upper corner of the GM jack. The guide's tables do not
    name them, so they are not modelled.
- what: rear-photograph
  scope: [rear]
  reason: needs-photo
  wanted: >-
    A photograph of the rear. The guide's drawing is the only picture: the fan numbers, the fan and power
    icons and the model chip are read from it, and the chip text is that of the drawing, not a confirmed print.
- what: laser-label
  scope: [front]
  reason: needs-photo
  wanted: >-
    The laser-safety triangle at the lower right of the port side and the corner mark at the upper right.
    They are labels, not features of the metal, and are not drawn.
- what: four-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: A flat drawing or photograph of the lid, the underside and the side panels.
groups:
  qsfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp, speed: 40g}
    description: Ports 0 to 27, the even ports on the upper row. Each runs at 40 GbE, or as four 10 GbE ports with a breakout cable.
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
    description: Ports 28 to 31 as printed, rel-pos carrying the printed number, since the origin token cannot express a block that starts at 28. Each runs at 100 GbE or 40 GbE.
  qsfp-plus-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The first of the four lamps of each QSFP+ port - used for a 40 GbE link (guide Tables 6 and 8).
  qsfp-plus-channel-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The second to fourth lamps of each QSFP+ port, in port then lane order - used when the port runs as four 10 GbE ports (guide Table 6).
  qsfp28-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The first of the four lamps of each QSFP28 port - used for a 100 GbE or unchannelized 40 GbE link (guide Table 6).
  qsfp28-channel-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The second to fourth lamps of each QSFP28 port, in port then lane order - used when the port runs as four 10 GbE ports (guide Table 6).
  timing:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the grandmaster clock cluster at the left of the port side - an RJ-45 grandmaster clock jack and the 10 MHz
      and 1 PPS output connectors. Two kinds, one purpose: carrying the time reference to and from the switch.
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band cluster at the left of the rear - an RJ-45 console port, an RJ-45 management port,
      two SFP management ports, a USB port and the recessed reset button. Four kinds, one purpose:
      reaching and recovering the switch when the data plane cannot.
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The four chassis lamps ALM, SYS, MST and ID (guide Table 10).
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: n+0
      redundancy-note: >-
        QFX5110 hardware guide (2026-09-24), Cooling System and Airflow Description: "All fan modules must be
        installed for optimal operation of the switch" and the switch runs 30 seconds without thermal shutdown
        while one is replaced. The guide states no N+1 form, so no spare fan is claimed.
  fan-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The status lamp at the left of each fan slot - green when the module works, blinking amber on an error (guide Table 12).
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: two supplies, load-sharing; one may be removed at a time while the switch runs
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD terminal on the port side (guide figure 15, callout 1)
