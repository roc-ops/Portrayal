format: 1
kind: device
name: ex2300-24mp
version: 0.1.1
maturity: modelled
manufacturer: Juniper
model: EX2300-24MP
portfolio: {line: EX Series, family: EX2300}
description: >-
  Juniper EX2300-24MP is a fixed 1RU Multigigabit access switch. It has 24 PoE+ ports, all with 380 W
  available: eight 100/1000/2500BASE-T ports and sixteen 10/100/1000BASE-T ports, and four built-in
  10-Gigabit SFP+/SFP uplink ports. The front carries the 24 jacks in three shells of two stacked rows,
  numbered 0 to 23 with the upper jack of a column taking the even number (the first shell, ports 0 to 7,
  is the Multigigabit one), the four uplinks in two stacked pairs numbered 0 to 3, the three system lamps
  (MGT, FAN, PW), the management Ethernet port with the RJ-45 console port under it, and a USB port. The
  rear carries the earthing terminal and the AC power cord inlet. The power supply and the three fans are
  built into the chassis (the fans along the right side panel, moving air from side to side), so there are
  no bays. It has no mini-USB console port and no mode button. The -TAA and -VC part numbers are not listed
  for it in the guide.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX2300 Switch Hardware Guide, Juniper Networks, published 2025-08-12 (314 pages;
      https://www.juniper.net/documentation/us/en/hardware/ex2300/ex2300.pdf): Figure 5 (front panel),
      Figure 14 (rear panel), Figures 18, 22, 28 and 30 (LEDs), Table 1 (models), Table 3 (chassis size and
      weight), Tables 5, 8, 9 and 13 (LED states), the cooling system section with Figures 33 and 34,
      Tables 14 and 15 (power), Table 34 (parts list), Table 35 (mounting methods) and Table 36 (earthing).
      Juniper's own straight-on studio photograph of the EX2300-24MP front (ex2300m-poe24-front-high.jpg) and
      its view with the top (ex2300m-poe24-frontwtop-high.jpg), from the maker's image library
      (https://www.juniper.net/us/en/company/images/image-library-logos-and-product-photos/products/ex2300-24mp.html),
      which holds no rear or side photograph of this model. The English datasheet addresses tried (the
      EX2300 line datasheet under datasheets/us/en/switches) did not answer, so no datasheet is cited.
  gate-1:
    confidence: measured
    note: >-
      The guide's Figure 5 is 1501 x 453 px and its body outline 1449 px across (x 13 to 1462) and 143 down
      (y 142 to 285): 3.286 px per mm across against the 440.9 mm of Table 3 and 3.30 down against the
      43.3 mm, an aspect of 10.13 against the table's 10.18, half a percent out, so the figure is
      orthographic and carries geometry. The photograph (1500 x 230 px, body 1447 px across) gives 3.282 px
      per mm across; its jack pitch reads 51.5 to 51.7 px = 15.7 to 15.8 mm in both, and the shells are 69.4
      mm apart in both. The figure's jack rows read 13.4 mm apart (the openings) and the photograph's 14.6
      mm (the whole cells, latch tab included); cell tops are taken from the photograph and the figure is
      used for x. Every position is estimated and good to about a millimetre.
  chassis:
    confidence: datasheet
    note: >-
      Table 3: height 1.7 in (4.33 cm) for the EX2300-24MP, width 17.36 in (44.09 cm) and 18.95 in (48.13
      cm) with the mounting brackets attached, depth 10 in (25.4 cm), weight 8.8 lb (4 kg). 440.9 x 43.3 x
      254.0 is carried, the metric as printed. The other EX2300 devices are 17.4 in wide and 1.75 in high;
      the MP models are the guide's own exception.
  mounting:
    confidence: datasheet
    note: >-
      Table 34: two mounting brackets and eight screws are provided; Table 35: two-post rack or cabinet with
      those brackets, four-post rack with the separately orderable four-post rack-mount kit
      (EX-4PST-RMK), recessed 2 in from the front with that kit's recess brackets, and on a desk on the
      four preinstalled rubber feet. The MP models cannot be wall mounted. No figure measures a bracket
      position and the kit is not modelled here, so no ear position is stated and no kit is listed.
  front-layout:
    confidence: estimated
    note: >-
      estimated - read off Figure 5 (x) and the photograph (y) as described under gate-1. Three shells of
      four columns: the first jack at 196.1 mm, 15.8 mm apart, the shells 69.4 mm apart (a 6.2 mm gutter),
      the rows 14.6 mm apart (cell tops) with the upper row turned 180 so its latch tab is above, as the
      photograph shows. The four uplink cages stand in two columns 18.4 mm apart with the registry's 15.0
      mm between the stacked rows, the upper cage upright and the lower turned as the library's stack
      convention (docs/pluggables-slotting-design.md) has it; the photograph shows the cages as a
      stacked pair in one frame per column. Each port has one small rectangular lamp above the shell, the
      even port's at the left of its column and the odd port's at the right, with the port's number beside
      it. The management jack sits above the console jack at the left of the jack block with ACT and LINK
      printed over the two green windows in its housing, and the USB-A port, upright, stands to its left.
      The photograph carries two small corner marks (a sticker frame) beside the system lamps that the
      guide's Figure 5 does not draw; they carry no printing and are not drawn. The photograph shows a
      light-blue strip along the lower edge of the face, drawn as chassis art, and the Running Junos badge
      under the model name, a maker's logo that is not drawn (as the Juniper lockup, reserved by the
      logo-zone region, is not).
  port-numbering:
    confidence: photo-measured
    note: >-
      photo-measured - the photograph prints each port's number in orange beside its lamp over the jack
      shells (0 to 7 over the first, 8 to 15 over the second and 16 to 23 over the third, the even number
      at the left lamp), so the upper jack takes the even number; the uplinks print 0 to 3 in white beside
      their lamps. Port numbers are as printed on the metal, from 0. The Junos interface names are not
      printed: the guide's Table 2 gives PIC 0 as 16x10M/100M/1G Base-T and 8x100M/1G/2.5G Base-T and PIC 1
      as 4x1G/10G SFP/SFP+, recorded here and not in an interfaces block because the faceplate does not
      print them.
  multigig-ports:
    confidence: datasheet
    note: >-
      Hardware guide, Front Panel of an EX2300 Switch: eight 100/1000/2500BASE-T ports with PoE/PoE+ and
      sixteen 10/100/1000BASE-T ports with PoE/PoE+; Figure 5 callout 4 marks the first shell (ports 0 to 7)
      as the 100/1000/2500 one and callout 5 the other two. The photograph carries an orange frame round
      the first shell only: it is a marketing overlay and not on the metal, so it is not drawn.
  lamps:
    confidence: datasheet
    note: >-
      Hardware guide, Tables 5, 8, 9 and 13 and Figures 18, 22, 28 and 30. The system lamps are MGT, FAN
      and PW (Table 5; the SYS, ALM and MST lamps of the other EX2300 models are not on this one); each
      RJ-45 port and each uplink has one Link/Activity lamp (Table 13), and the management jack has a Link
      lamp and an Activity lamp (Figure 22, Tables 8 and 9), printed LINK and ACT on the photograph.
      Speed, duplex, administrative status and PoE are read with show commands (the guide's note under
      Table 13), so there are no mode lamps and no mode button.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - positions off Figure 14 (1501 x 327 px, body 1449 px across at 3.286 px per mm and 143 down
      at 3.30): the AC inlet, its legend, the five screws and the earthing terminal. No photograph of this
      rear is held. The guide's drawn serial number and CLEI rectangles (callouts 1 and 2) are left out:
      they are paper labels carrying real serial numbers. Figure 14 calls the ring at the right "ESD point"
      (callout 3) but prints the earth symbol under it, and Table 36 lists an earthing terminal on the rear
      panel of the EX2300-24MP (a 14-10 AWG lug on one M4 screw), while the guide's list of rear
      components for this model names no earthing terminal and no ESD point on the front: it is drawn as the
      earthing terminal.
  side-fans:
    confidence: estimated
    note: >-
      estimated - the guide's cooling section says three fans built in along the right side panel give
      side-to-side cooling, and Figure 34 shows them on the right panel in perspective. Their places along
      the depth are read off the plan in Figure 33 (the box 645 px for 254 mm, 2.54 px per mm; the fans'
      centres 128.0, 176.4 and 224.4 mm from the front; on the right view x = 0 is the front), a 40 mm
      fan each. Figure 33 draws the fans on the
      left of the plan, in the picture with the front at the top and the arrows leaving there, while the
      text and Figure 34 put them on the right panel: the text and Figure 34 are followed, so the exhaust is
      on the right panel and the intake on the left. A flat side elevation would settle it.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Hardware guide, Power Supply in EX2300 Switches: "The power supply in EX2300 switches is built in
      along the rear panel of the chassis"; Table 2 lists "Switch with built-in power supply" and, for the
      fans, "Fan". The cooling system section says "three fans built in along the right side panel" and
      Figure 34 is captioned "Fans Built-in". Nothing in the guide describes removing or replacing either.
      They are part of the chassis, not bays and not components.
  airflow:
    confidence: datasheet
    note: >-
      the cooling system provides side-to-side chassis cooling (Figures 33 and 45).
  power:
    confidence: datasheet
    note: >-
      Table 14: maximum power consumed by the switch 55 W when no PoE power is drawn, maximum PoE/PoE+
      power available 380 W; Table 15: 100 through 240 VAC, 50/60 Hz, 5.4 A at 100 VAC and 2.5 A at 240 VAC
      (the rear legend of Figure 14 prints 5.4-2.5A).
  colour:
    confidence: photo-measured
    note: >-
      median of the bare front plate in the photograph (#656d74); the strip along the lower edge #b4e0f0.
