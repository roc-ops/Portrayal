format: 1
kind: device
name: qfx10002-36q
version: 0.1.2
maturity: modelled
manufacturer: Juniper
model: QFX10002-36Q
portfolio:
  line: QFX Series
  family: QFX10002
description: >-
  Juniper QFX10002-36Q, a fixed 2RU deep-buffer spine and core switch with 36 QSFP+ ports in two
  rows of 18. Every port runs at 40 GbE by default, 12 of them (every second and sixth cage position of each
  six-port cage) take QSFP28 and run at 100 GbE, and any group of three can be channelized to
  twelve 10 GbE interfaces with breakout cables. The management panel at the right of the front has
  an RJ-45 management port, an RJ-45 console, an SFP management port, an SFP PTP Ethernet port, 1PPS
  and 10 MHz timing connectors, a USB port and four status lamps. The rear has four power supply
  bays, of which the 36Q fills two with 1600 W supplies and covers two, three fan modules and an ESD
  point. Cooling is port-to-FRU (front-to-back) only. The AC, the DC and the spare chassis builds
  are configurations.
profile: networking
stack-exceptions:
  - pairs: [[port-0, port-1], [port-2, port-3], [port-4, port-5], [port-6, port-7], [port-8, port-9],
            [port-10, port-11], [port-12, port-13], [port-14, port-15], [port-16, port-17],
            [port-18, port-19], [port-20, port-21], [port-22, port-23], [port-24, port-25],
            [port-26, port-27], [port-28, port-29], [port-30, port-31], [port-32, port-33],
            [port-34, port-35]]
    reason: >-
      Photo-measured, in provenance.stack-orientation. In the 36Q front photograph both cages of a column
      are the same way up - the dark module bar sits high in each opening and the silver latch low. Taken
      from a 4x crop of the first two groups, the bar centres of the upper and lower cage are 15.5 mm apart,
      which is what two cages the same way round give (the 16.0 mm row pitch); a lower cage turned 180 would put
      its bar low in the opening, the two about 17.4 mm apart (the bar sits 4.1 mm below its cage's top edge). Figures 7 and 19 of the guide draw the two
      rows alike too. Neither row is turned.
provenance:
  sources:
    confidence: datasheet
    note: >-
      QFX10002 Switch Hardware Guide, Juniper Networks, published 2026-02-11 (PDF, 214 pages;
      copyright Juniper Networks, all rights reserved, read here as data and nothing copied).
      Taken from it - Tables 1, 2 and 3 (product numbers, port capacities, spare numbers),
      Tables 4 and 5 and the redundancy text (power supply bays), Table 6 and Table 7 (port groups
      and which ports take 100 GbE), Tables 13 to 16 and 18 and 19 (lamps), Tables 17, 20, 21, 24
      and 25 (modules and power), Tables 29 and 30 (environment and physical specifications), Table 45
      (what ships), and Figures 1, 4, 5, 6 and 17 to 23. Figure 19 (g050400) is the flat front
      elevation of the 36Q, Figure 21 (g050373) the management panel callouts, Figures 4 and 5
      (g050372 and g050404) the flat rear elevations of the 72Q and the 36Q. Juniper's studio
      photographs qfx10002-36q-front-high and qfx10002-36q-rear-high (JPEGs, 2100 x 681 and
      2100 x 785) were opened and compared with every figure. The HPE PSNow datasheet a00150807enw
      was tried once and the transfer failed, so no datasheet is cited and no figure comes from
      one. The NetBox community elevations of the 36Q (739 x 137 px, a community drawing and not
      the maker's) were used only to count the cages and the supplies, and no dimension comes from
      them. The held intake folder of earlier work was not readable from the account that built
      this device, so none of it was used. No mechanical drawing, 3D model or Visio stencil of the
      QFX10002 was found in the sources that could be read.
  gate-1:
    confidence: measured
    note: >-
      Both flat figures pass at low resolution. Figure 19 (g050400, 1505 x 602 px, embedded image
      extracted from the PDF) gives a frame 1469 px wide (x 9.5 to 1478.5) and 293.5 px tall (y 149.5
      to 443.0), aspect 5.005 against the stated 441.0 / 88.0 = 5.011, 0.1 percent out. Scaled on the
      width it is 3.331 px per mm across and 3.335 down. The cage pitch then reads 19.0 mm over the
      groups, the 19.0 mm of the QSFP ganged registry entry, a quantity the scale never saw. Figure 5
      (g050404, rear, body 1464 x 294 px) is 0.7 percent out the other way, 3.320 px per mm across and
      3.341 down. Positions are taken per axis on those scales and read to about half a millimetre.
  envelope:
    confidence: datasheet
    note: >-
      Table 30, Physical Specifications for the QFX10002: 3.46 in. (8.8 cm) high, 17.36 in. (44.1 cm)
      wide, 31 in. (78.7 cm) deep "without handles for fans or power supplies". The height is carried
      as 88.0 mm, the 8.8 cm of the table (3.46 in. is 87.9 mm), 2RU. The face is the body between
      the folds with no ears drawn. The installation text gives 19 in. (48.26 cm) over the front
      mounting brackets. The depth 787.0 mm is the 78.7 cm of the table. The table gives the 36Q
      54 lb (24.5 kg) with its supplies and fans fitted, and 53.6 lb (24.3 kg) for the DC build. The
      install topic gives the 36Q 54 lb (24.5 kg) too and the 72Q the same figures as the table, so
      no weight disagrees.
  ports:
    confidence: drawing
    note: >-
      Figure 19 and Figure 6, counted - 36 QSFP+ cages in two rows of 18 columns, in six groups of
      three columns, each group one six-port (6XQSFP+) cage, with a 5.65 mm gutter between
      groups (the 62.65 mm group step less three 19.0 mm columns), carrying a column of hexagonal
      vent holes. Cells sit on the registry's 19.0 mm ganged QSFP pitch. The first column's left edge is
      at 6.85 mm and the upper row at 52.3 mm, the lower at 68.3 mm (row step 16.0 mm, which leaves 6.4
      mm between a cage's bottom edge and the next cage's top for the lamp strip). The 36Q
      photograph agrees to a millimetre or two on the first cage (5.4 mm from the left edge, within
      the photograph's own perspective). Counts confirmed by Table 6 and by the NetBox elevation.
  port-numbering:
    confidence: photo-measured
    note: >-
      Figure 19 prints 0, 6, 12, 18, 24, 30 and 34 above the upper row (above the first column of each
      group and the last column) and 1, 7, 13, 19, 25, 31 and 35 below the lower row, so a column holds
      the even port above the odd one and the ports run left to right, 0 to 35. THE PHOTOGRAPH PRINTS
      FEWER NUMBERS THAN THE DRAWING. In qfx10002-36q-front-high a "1" is printed under the first
      lower cage and "34" and "35" at the right end, and nothing at 6, 7, 12, 13 and so on, at the
      place where the drawing prints them and where "1" is plainly legible. The photograph is the
      real device, so only 1, 34 and 35 are printed here. "0" is not seen in the photograph (the place
      above the first cage shows vent holes) and is not printed. Numbering starts at 0, as the guide's
      CLI examples count (port 0 to port 35). Interface names are not printed on the metal and the guide
      does not state them, so none is carried.
  stack-orientation:
    confidence: photo-measured
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md) turns the lower cage of a belly to
      belly pair by 180 degrees. It is not applied here, because both rows are drawn alike. In Figure 7
      and Figure 19 the two cages of a column are drawn with the same face, the latch bar low in the
      opening, and the studio photograph shows the same: the dark module bar high and the silver
      latch low in both rows. The convention is an estimate and the photograph overturns it, so both
      rows carry no rotation. The lamp strip lies between the rows.
  port-leds:
    confidence: datasheet
    note: >-
      Figure 17 and Table 13 - each QSFP+ port has one bicolour LED, "triangle shaped". The strip between
      the two cages of a column draws an up triangle at its left, four small slots and a down triangle
      at its right. The up triangle is the upper port's lamp and the down triangle the lower port's,
      as the triangles point at their ports and as the library's SFP+ stacks draw them. The lamp
      centres are 7.0 mm left and 7.4 mm right of the column centre in the drawing, which the
      drawing keeps unequal, and 65.1 mm down. The slots are drawn as a vent pattern and are not
      hole for hole. Table 13 gives the states: green steady is a link (all four sub-channels up when
      channelized), green blinking is activity, slow green is the beacon, amber steady is some but
      not all sub-channels up (Junos 15.1X53-D21 and CPLD 1.16 and later) and amber blinking is
      activity on some sub-channels.
  hundred-gig-marks:
    confidence: datasheet
    note: >-
      Table 6 and the 100-Gbps text - "ports marked with a fine black line underneath the socket"
      take QSFP28 and run at 100 GbE, which disables the two neighbours (Table 7 - port 1 disables 0
      and 2, port 5 disables 3 and 4, port 7 disables 6 and 8, and so on). The line is drawn under the lower cage
      of the first and third column of each group, ports 1, 5, 7, 11, 13, 17, 19, 23, 25, 29, 31
      and 35 (12 ports, as the table says). Figure 19 draws a "100G" legend at the left end of the row
      and the photograph prints neither the legend nor a visible line at 4 px per mm, so the legend is
      not drawn and the lines are drawn thin, as the text says and the drawing shows.
  mgmt-panel:
    confidence: drawing
    note: >-
      Figure 21 (g050373) callouts 1 to 9 and Figure 19, measured on Figure 19 per axis. Callout 1 is the
      em0 RJ-45 (1000BASE-T) management port centred at 392.4, 54.1; callout 2 the RJ-45 console (CON)
      at 412.1, 53.9; callout 3 the reset button, a round recess at 412.0, 63.2 below the console;
      callout 4 the four status lamps at 424.9 and 430.0 across and 51.9 and 56.9 down; callout 5 the
      em1 SFP management port (MGMT) at 380.4 across and 68.0 down; callout 6 the PTP Ethernet SFP port
      (the drawing labels it ETH, the photograph PTP) right of it at 395.4; callout 7 the PPS SMB at 414.2,
      72.5; callout 8 the 10 MHz SMB at 422.2, 72.5; callout 9 the USB port, upright, at 430.9, 70.9
      with the USB symbol below it. Two small round lamps above the two SFP cages at 392.2 and 398.0
      across and 65.1 down are the SFP port lamps (Table 15 - one link and activity lamp). The two
      cages are 14.25 mm wide on a 15.0 mm pitch. Jack sizes come from the registry; the drawing's
      housing outlines are not used for size.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      sources-disagree, and the real device wins for everything printed. Figure 19 and Figure 21 print
      PWR, MAJ, STS and MIN with the word ALARM in a bracket, the SFP legends MGMT and ETH, and 10MHz;
      the 36Q photograph prints PWR, MJR, STA and MNR, the legends MGMT and PTP, and 10M, with no
      bracket and no ALARM. The guide's own text (Table 16) names the lamps PWR, STA, MJR and MIN. The
      silkscreen follows the photograph. The drawing puts a laser-radiation label as a white box with
      printed words at the left end of the vent field; the photograph shows it yellow, so the plate is
      drawn yellow and its words, which cannot be read at this resolution, are not drawn.
  usb-and-slots:
    confidence: photo-measured
    note: >-
      The guide names no USB revision (Figure 21 callout 9, "USB port"), and the photograph shows a black
      tongue, which is neither colour the library's skins carry, so the white USB 2.0 skin is used and no 3.0
      is claimed. The four small slots between the two lamps of each column are drawn as one dark plate
      9.3 x 2.8 mm (the drawing shows two rows of four), centred 0.3 mm right of the column centre.
  gold-strip:
    confidence: photo-measured
    note: >-
      Under the lower row the photograph shows a row of gold-coloured hexagonal dots from the left
      edge to the end of the cage block (median colour #cab284 and #e1ca9e) over a row of black vent holes.
      Figure 19 draws plain hexagon holes there. It is drawn as a gold band 2.6 mm tall at 78.6 mm
      down, estimated from the photograph, and is not drawn dot for dot.
  rear:
    confidence: drawing
    note: >-
      Figure 5 (g050404, the 36Q) and Figure 4 (g050372, the 72Q), measured per axis from the rear left
      edge (the chassis right side as seen from the front). Power supply bays are 74.1 x 40.6 mm at x
      8.8 and 90.4 across and y 1.7 and 43.5 down. Fan module faces are 81.0 x 81.7 mm at x 172.0, 260.9 and
      349.8 and y 3.7, on an 88.9 mm pitch. The ESD socket is centred at 436.6, 24.1 with the ESD
      symbol below it. Fan numbers 0, 1 and 2 with a fan icon and a lamp are printed at 3.8 mm left of each face, the lamp
      at y 77.9. Power symbols are printed at x 86.9 between the supply columns and x 168.2 between the right
      column and the first fan, at y 9.0 and 49.8. Two round fixings sit between the supply columns at
      y 20.8 and 61.4. A vertical legend at the left edge reads "AC INPUT:100-240V ~ 60-50Hz 12A" and
      "DC INPUT:-48V TO-60V = 40A (FOR EACH POWER SUPPLY)" in Figure 5.
  rear-photo:
    confidence: photo-measured
    note: >-
      qfx10002-36q-rear-high shows FOUR supplies, with ACDC 1600W Platinum labels on the fan hubs and
      the legend ending in 14A, which is the 72Q's figure (Figure 4 prints 14A and Figure 5, the
      36Q, 12A). The 36Q ships with two supplies and two blanks (Table 30, Figure 5), so the photograph is
      of a fully populated unit or of another model, and it is used for colour, finish and the
      layout of a supply, not for the count. The legend follows Figure 5 for the 36Q.
  power-supplies:
    confidence: datasheet
    note: >-
      Table 30 - the 36Q ships "3 fans and 2 AC power supplies installed, 2 blanks", and Figure 5 draws the two supplies in the
      LOWER bays and the covers in the upper. Tables 4 and 5 and the redundancy text give four bays
      for every model and number them across from the top left. The bays here are psu-0 and psu-1 on the upper
      row and psu-2 and psu-3 on the lower, so the 36Q's supplies are in psu-2 and psu-3. Figure 5 prints the power
      symbols and the digits 0 and 1 beside the LOWER bays only, and Figure 4 prints 0 to 3 beside
      the four of the 72Q. The guide's text and Figure 5 therefore disagree on whether the
      36Q's lower bays are 2 and 3 or 0 and 1; the legends are printed as Figure 5 draws them and the
      bay ids follow the text. See the gap psu-bay-numbering. The 36Q AC build runs on one supply at 100 to 120 VAC or at 220 VAC and the
      DC build on one DC supply (Table 4). Mixing AC and DC supplies is not supported.
  airflow:
    confidence: datasheet
    note: >-
      Description and Table 17 - every QFX10002 has port-to-FRU airflow (airflow out, AFO, front-to-back):
      air enters through the vents of the port panel and leaves through the FRU panel. The guide lists no
      back-to-front fan module or supply, so the device has no airflow configuration. The module
      handles are gold in the guide's tables and orange in the photograph (the photograph wins; see
      the module contracts).
  mounting:
    confidence: datasheet
    note: >-
      Mounting a QFX10002 in a Rack and Table 45 - a four-post kit ships in the box (two front mounting
      rails, two rear mounting blades, 24 flathead screws) and spare kits are ordered as EX4500-4PST-RMK.
      The rails fit the sides of the chassis (Figure 34) and the front rails may be flush with
      either end of the switch. The rack must have its rails 28 to 31 in. (71.1 to 78.7 cm)
      apart front to back. The guide gives no ear distance in millimetres and no rail drawing that can be measured
      and says the chassis must be supported at all four corners, so no ear position and no kit is
      written. EX4500-4PST-RMK is not listed under chassis.kits here (it is a shared four-post kit and
      follows in a later slice). See the gap rack-mounting.
  grounding:
    confidence: datasheet
    note: >-
      Connect the QFX10002 to Ground and Figure 36 (g050389) - a two-hole protective grounding
      terminal on the chassis, for two 10-32 UNF x 0.25 in. screws and a Panduit LCD6-14BH-L lug. Figure 36 is
      a perspective view that shows it on a side panel, and no flat figure places it, so it is not modelled.
      See the gap grounding-terminal.
  colour:
    confidence: photo-measured
    note: >-
      Median of the bare front face in the 36Q photograph (#c4c5c7 at the left margin, #bebfc1 and #cfcfcf
      near the right). The rear chassis reads #75777a in the rear photograph. The fan faces and
      the supply handles read #ec640e and #f94e16 in the photograph.
  vents:
    confidence: drawing
    note: >-
      Figure 19 and the photograph - a hexagonal punching above the cages and below them across the width of the
      block (the field above is 47 mm tall, the one below two rows), a column of seven hexagons in each gutter, and
      fields beside and below the management panel. They are drawn as repeating patterns inside simplified
      outlines and not hole for hole, and the outline of the field next to the logo (stepped in the
      photograph) is simplified to two rectangles.
  logo:
    confidence: photo-measured
    note: >-
      The maker's logo at the top right is not drawn. It is reserved as the region logo-zone, 22.0 x 8.4
      mm, read off the photograph (the logo spans 409.5 to 434.2 across and 1.3 to 7.4 down).
      The model name below it is plain text and is drawn.
  lifecycle:
    confidence: estimated
    note: >-
      Searched 2026-10-22. Juniper's own end-of-life pages (support.juniper.net/support/eol) were not
      read. An aggregator (router-switch.com EOL checker, QFX10002-36Q and -72Q) lists an end-of-life
      announcement of 2025-07-15, end of sale of 2026-01-15 and end of service life of 2031-01-15. It is
      not the maker, and the dates are carried as announced and flagged as unverified against Juniper.
  held-sources:
    confidence: estimated
    note: >-
      The intake folder for the Juniper exqfx documents (COVERAGE.md, SOURCES.md and INVENTORY.md and its
      photographs) is under a path this account cannot read (permission denied), so the check for a
      held photograph, Visio stencil or 3D model could not be made. Only the public sources named above
      were used. If a held model exists it may refine the estimated positions.
attrs:
  physical:
    weight: 24.5 kg (54 lb) with two AC supplies, two blanks and three fan modules fitted; 24.3 kg (53.6 lb) for the DC build (Table 30)
    mounting: four-post rack kit in the box; spare kits EX4500-4PST-RMK
  performance:
    throughput: 2.88 Tbps and 1 Bpps of forwarding capacity (Q5 ASICs); 144 x 10 GbE, 36 x 40 GbE or 12 x 100 GbE ports (Table 2)
    packet-buffer: deep buffer from hybrid memory cubes (HMC)
  power:
    power-typical-w: 560
    power-max-w: 800
    power-envelope: fully-configured
    psu-ac-input: 100 to 127 VAC and 200 to 240 VAC at 50 to 60 Hz, 9.5 A at 100-120 VAC (Table 21); each supply has one input
    psu-dc-input: -48 to -60 VDC rated, -40 to -72 VDC operating range, 40 A maximum; a 40 A breaker is recommended
    psu-redundancy: four bays, 2N recommended; one supply runs the 36Q at 110 VAC or 220 VAC
  thermal:
    heat-dissipation: 1,911 BTU/hr typical and 2,730 BTU/hr maximum (Tables 21 and 25)
    airflow: port-to-FRU (airflow out, front-to-back); three 80 W fan modules at 150 CFM each, and fans in the supplies
  environmental:
    operating-temp: 0 C to 40 C (32 F to 104 F)
    storage-temp: -40 C to 70 C (-40 F to 158 F) in the shipping container
    humidity: 5 to 90 percent noncondensing; short term 5 to 93 percent
    altitude: no performance degradation to 1828.8 m (6000 ft)
  platform:
    cpu: 2.5-GHz quad-core Intel
    memory: 16 GB SDRAM
    storage: two 25 GB SSDs (the hardware inventory text also names a 25 GB NAND flash drive)
    asic: Q5 packet forwarding ASICs with hybrid memory cubes
  features:
    timing: 1PPS and 10 MHz SMB connectors and a PTP Ethernet SFP port
  management:
    oob: MGMT RJ-45 (em0), 10/100/1000BASE-T, and MGMT SFP (em1), 1000BASE-X
    console: RJ-45 console (CON), RS-232
    usb: one USB port
  compliance:
    seismic: Designed to comply with Zone 4 earthquake requirements per NEBS GR-63-CORE, Issue 3
  lifecycle:
    eol: announced
    eol-announcement: https://support.juniper.net/support/eol/product/qfx_series/
    end-of-sale: '2026-01-15'
    end-of-support: '2031-01-15'
chassis:
  width: 441.0
  height: 88.0
  depth: 787.0
  ru: 2
  color: '#c4c5c7'
  airflow: front-to-back
gaps:
  - what: datasheet
    scope: [front]
    reason: vendor-silent
    note: >-
      The HPE PSNow datasheet a00150807enw was tried once and the transfer failed (HTTP/2 stream error), so no
      datasheet is cited and no figure comes from one.
    wanted: the HPE PSNow QFX10002 datasheet, for the bundle part numbers
  - what: photograph-72q
    scope: [front, rear]
    reason: needs-photo
    note: >-
      The 72Q studio photographs (qfx10002-72q-front-high and -rear-high, tried once each) returned an
      HTML 404 page, so the 72Q has no studio photograph. This 36Q is checked against its own photographs.
    wanted: straight-on photographs of the QFX10002-72Q
  - what: psu-bay-numbering
    scope: [psu-0, psu-1, psu-2, psu-3]
    reason: sources-disagree
    note: >-
      The text says the bays of the 36Q and 72Q are numbered horizontally from the top left to the bottom
      right (0 to 3), but Figure 5 prints the digits 0 and 1 beside the two lower bays of the 36Q, where the
      switch ships its supplies, and prints nothing beside the upper bays that carry blanks. The bays take
      the text's numbers, the printing follows the figure.
    wanted: the supply numbers printed on a 36Q, or the CLI names of its supplies
  - what: rack-mounting
    scope: [left, right]
    reason: vendor-silent
    note: >-
      The guide's four-post procedure names no ear distance in millimetres and draws the rails only in
      perspective (Figures 33 to 35), so no ears position is written, and the spare kit EX4500-4PST-RMK is
      left out of chassis.kits in this slice.
    wanted: the rail drawing and ear distances, and the four-post kit as a kit contract
  - what: grounding-terminal
    scope: [left, right]
    reason: needs-drawing
    note: >-
      The two-hole protective grounding terminal is shown in perspective on a side panel in Figure 36 and
      no flat view places it, so it is not placed. The guide states the screws (10-32 UNF x 0.25 in.) and the
      lug (Panduit LCD6-14BH-L) but not the hole spacing.
    wanted: a flat side elevation with the terminal, and its hole spacing
  - what: dc-connector-3w3
    scope: [psu-0, psu-1, psu-2, psu-3]
    reason: needs-drawing
    note: >-
      The DC supply takes a D-sub 3W3 connector and the library has no 3W3 standard, so the DC supply draws
      the shell in its skin and offers no seat for the cable plug.
    wanted: a D-sub 3W3 connector in the connector registry
  - what: console-lamp
    scope: [con]
    reason: vendor-silent
    note: >-
      The text under Figure 21 says "the LED below the port indicates status and link" for the console, but no
      figure draws such a lamp: below CON is the reset button (callout 3). No console lamp is placed.
    wanted: a close-up of the management panel
  - what: sfp-lamp-assignment
    scope: [led-mgmt-sfp, led-ptp-sfp]
    reason: vendor-silent
    note: >-
      Table 15 gives one link and activity lamp for the SFP management port and the guide does not say which
      of the two lamps above the cages belongs to which cage. Each is tied to the cage under it, left
      to left.
    wanted: the lamp assignment of the two SFP ports
  - what: supported-optics
    scope: [qsfp, mgmt-sfp, ptp-sfp]
    reason: vendor-silent
    note: >-
      The guide lists in prose what each port takes (QSFP+, QSFP28, DAC, AOC and breakout cables) but no
      transceiver table, so the port groups declare no interface.
    wanted: the QFX10002 transceiver list from the Hardware Compatibility Tool
  - what: rear-label
    scope: [rear]
    reason: vendor-silent
    note: >-
      Figure 5 draws a narrow vertical plate near the right edge below the ESD point, x 432 to 440 and y 47 to 65,
      that the guide does not name. It is not drawn.
    wanted: the name of that plate (a serial number label?)
groups:
  qsfp:
    term: Port
    role: traffic
    index-origin: 0
    attrs:
      media: qsfp
      speed: 40g
    description: >-
      36 QSFP+ ports numbered 0 to 35, the even port above the odd. All run at 40 GbE by default; ports 1, 5, 7,
      11, 13, 17, 19, 23, 25, 29, 31 and 35 (a thin line under them) take QSFP28 at 100 GbE and disable their two
      neighbours; ports 0 and 3 of each six-port cage channelize a group of three to 10 GbE
  qsfp-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      One bicolour triangle lamp for each port, in the strip between the rows - the up triangle for the upper port
      and the down triangle for the lower (Table 13)
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: reaching and restarting the switch - the RJ-45 management port, the RJ-45 console, the SFP
      management port, the USB port and the reset button
  mgmt-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the link and activity lamps of the two SFP ports (Table 15)
  timing:
    term: Port
    role: management
    index-origin: 0
    mixed: the timing block - the PTP Ethernet SFP port and the 1PPS and 10 MHz SMB connectors
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the four chassis status lamps PWR, STA, MJR and MNR (Table 16)
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: n+n
      redundancy-note: >-
        Four bays, numbered across from the top left. The 36Q ships two supplies in the lower bays and two covers
        in the upper. A single supply runs the 36Q, and the guide recommends twice what is needed, "also called
        2N" (QFX10002 Component Redundancy)
    description: the four power supply bays (Table 4)
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy-note: >-
        Cooling System and Airflow - "Each fan module is a redundant unit containing two fans" and "All fan
        modules must be installed for optimal operation of the switch". The guide says how long the switch runs
        with one module out (30 seconds) and not how many it can lose, so no n+1 form is written. A removed
        module raises a minor alarm
  fan-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: ok, color: '#22c55e'}, {name: fault, color: '#f59e0b'}]
    description: >-
      The ST lamp on the chassis at the left of each fan module slot - green steady means the module is
      present and operating normally, amber steady means it is absent or has failed (Tables 18 and 19)
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the rear wrist-strap ESD point (Figure 4 callout 3)
  furniture:
    term: Item
    role: furniture
    index-origin: 0
    description: the front laser-radiation warning
