configurations:
  base:
    kind: base
    source: >-
      derived - built from the group roles rather than from a vendor bundle: every bay
      whose group is `service` or `management` keeps its seat, every `traffic` bay takes
      a blank. This vendor publishes no base configuration for this chassis, so the
      library defines one. Where a vendor DOES publish one, follow it instead and say so
      here.
    default: true
    description: >-
      Chassis only - what you spec before deciding what goes in it. The 10 slot bays are
      EMPTY; psus, res, sfbs are populated. Enough to power on and reach the box, which
      is the question most people ask first and the one `default` used to answer with
      whatever the drawing happened to be populated with.
    bays:
      fpc0: juniper/mx2000-mpc-blank-v@1
      fpc1: juniper/mx2000-mpc-blank-v@1
      fpc2: juniper/mx2000-mpc-blank-v@1
      fpc3: juniper/mx2000-mpc-blank-v@1
      fpc4: juniper/mx2000-mpc-blank-v@1
      fpc5: juniper/mx2000-mpc-blank-v@1
      fpc6: juniper/mx2000-mpc-blank-v@1
      fpc7: juniper/mx2000-mpc-blank-v@1
      fpc8: juniper/mx2000-mpc-blank-v@1
      fpc9: juniper/mx2000-mpc-blank-v@1
  photographed:
    kind: example
    source: >-
      photo - the Juniper image-library MX2010 front (#261): every lower slot holds an adapter and
      an MX240-form MPC. LC0 an MPC with two 4-port XFP MICs; LC2 to LC5 the 32x10GE MPC4E (dense
      SFP+ columns); LC6 a 4-port XFP MIC over a 2-port one; LC8 a 2-port XFP MIC over an 8-SFP MIC;
      LC9 two 2-port XFP MICs. The carrier of the XFP MICs is drawn as the MPC2E, the base carrier
      that takes both. LC1 holds a dual-wide 40-port RJ45 MIC, which no bay can seat yet, and LC7
      and LC8's 8-SFP MICs are not identifiable at about 1 px/mm, so those windows carry blanks.
    description: >-
      The MX2010 as the vendor photographed its front, as far as the photograph identifies the cards.
      LC7 and LC8 are UNCERTAIN at about 1 px/mm: LC7 may be an MPC-3D-16XGE-SFPP rather than an MPC2E,
      and LC8's lower MIC a 20GE SFP MIC; they are drawn as an MPC2E with blank MIC windows and a
      blank lower window rather than as a guess.
    bays:
      fpc0: juniper/mx2000-lc-adapter@1
      fpc0/mpc: juniper/mpc2e-3d@3
