format: 1
kind: device
name: mx2010
version: 3.0.0
maturity: modelled
manufacturer: Juniper
model: MX2010
portfolio:
  line: MX Series
  family: MX2000 3D Universal Edge Router
description: >-
  Juniper MX2010 - the 34RU half-height member of the MX2000 family.
  Craft interface and EMI cover at the top; an upper cage with a CB-RE
  at each end and eight Switch Fabric Boards between them; a lower cage
  of ten vertical MPC slots (LC 0-9, each seated through an adapter
  card); and at the rear a nine-module PSM wall between the two power
  distribution modules, with fan trays behind the grilles at both ends.
profile: networking
provenance:
  sources:
    note: >-
      MX2010 Hardware Guide (963 pages), the MX2000 datasheet, and the studio front and rear
      photographs in the image library
  chassis:
    confidence: datasheet
    note: >-
      datasheet-table - 59.50 x 19 x 36.20 in (1511.3 x 482.6 x 919.5 mm); the 19 in figure is the
      rack face, and the body is drawn at 440 mm. Ears NOT MODELLED by convention
  front:
    note: >-
      photo - the studio front photograph at ~1 px/mm vertically and ~1.1 horizontally: craft at y
      15, EMI cover to 255, the upper cage (CB-RE0, SFB 0-7, CB-RE1) at y 269.9 over the guides'
      412.1 mm, ten 43.18 mm slots over the line-card slots (#902; it was y 275 over ~405), the
      divider, the ten-slot lower cage at y 730 over ~425 mm, the LC 0-9 label strip, and the
      intake grille at the bottom. Cards are VERTICAL: authored tall with rotated jacks (the
      ASR-9010 pattern)
  upper-cage:
    note: >-
      guide - two CB-REs flank eight SFBs (slots 0-7); the guide states eight SFBs install with
      seven required for line rate
  rear:
    note: >-
      photo - the rear studio photograph: fan tray 2/3 grille at the top, the PDM1 zone, nine PSM
      bays across the middle, the PDM0 zone, the air filter panel (with the fan tray 0/1 lamps)
      and the bottom grille. The photographed unit is -48 V DC
  power:
    confidence: datasheet
    note: >-
      datasheet-table - the guide power overview: the -48 V pool is 22.5 kW with 2.5 kW reserved
      for PSM redundancy (8+1 across nine PSMs). No chassis draw is carried, because the guide
      contradicts itself - see the chassis-power-figure gap
  color:
    note: >-
      photo - grey chassis, dark craft band with the light-blue accent, silver-grey modules
  other-faces:
    note: >-
      near-blank by evidence - rail bands estimated; axis conventions per viewer3d.js as the
      siblings

  lc-slots:
    confidence: datasheet
    note: >-
      each LC slot is the line-card adapter's face, 43.18 x 449.8 (1.7 x 17.71 in, the guide's ADC row),
      on its own width as pitch: ten slots, 431.8 mm, centred on the chassis at x 4.1 (#261). Four
      readings put the pitch there: the MX2010 front gives 41.36 px between slots against a 379.5 px MPC
      plate, 43.3 mm on the card's 396.0; the MX2008 front, isotropic at 1.264 px/mm once its flanges are
      taken as the 19 in, gives 54.7 px, 43.3 mm; the MX2020 front gives 31.9 px at 0.744 px/mm, 43.4 mm.
      Until #261 the slots were an estimated 41.0 x 425.0 on a 41.0 pitch, which no adapter fits. The
      native MX2K cards and the blank keep their estimated 41 x 425 and are centred in the wider slot.
      Down: the slot is centred on the photograph's adapters, whose frame and handle blocks run 724 to
      1163 px (729 to 1177 mm on the chassis scale, 0.981 px/mm from a 1483 px height): y 728.1. The
      divider above now ends at 728.1 and the LC label strip, its legends and the cover below move down to
      clear it, the strip at 1179.0 as the photograph has it (1181 to 1204).
attrs:
  power:
    pool-w: 22500
    note: -48 V telecom pool, 2.5 kW of it reserved for PSM redundancy
chassis:
  width: 440.0
  height: 1511.3
  depth: 919.5
  ru: 34
  color: '#565b61'
gaps:
  - what: mpc-catalogue
    scope: [fpcs]
    reason: needs-photo
    wanted: the MICs in the photographed unit's LC7 and LC8 (eight SFP
      cages each) are not identifiable at about 1 px/mm, and LC1's dual-wide
      40-port RJ45 MIC cannot be seated until a module can fill two bays.
      Since roc-ops/Portrayal#261 the MX240-form MPCs seat here through the adapter card
      (juniper/mx2000-lc-adapter@1), so the range is the MX960's.
  - what: cb-re-face-detail
    scope: [res]
    reason: needs-photo
    wanted: a close photograph of the CB-RE faceplate - the jack stack
      is summarised from a ~1 px/mm image and the per-jack legends are
      unreadable. At 3.0.0 the CB-RE took the guides' 43.18 x 412.1 (#902)
      and its jack column moved 5.9 mm left to stay centred; the photograph
      shows CB-RE 0's stack left of its plate's centre and CB-RE 1's right
      of it, which a close photograph would settle.
  - what: fan-trays-and-pdms
    reason: needs-photo
    wanted: the four fan trays and two PDMs as FRU bays - they sit
      behind the rear grilles and zones drawn as decor; tray/PDM face
      photographs would let them become bays.
  - what: psu-variants
    scope: [psus]
    reason: needs-photo
    wanted: the AC, 240V-China and HVAC/HVDC PSM faces; the photographed
      unit is -48 V DC.
  - what: chassis-power-figure
    scope:
    - fact:peak-power-w
    - fact:typical-power-w
    reason: sources-disagree
    note: >-
      The guide states a figure and it does not hold together, so none is carried. Table 60 gives
      the base system (no MPCs, ADCs or MICs) 9,439 W at 55 C and 2,142 W typical, identical to
      the MX2020 base row (MX2020 guide Table 65) for a different base system: this row lists two
      fan trays and four PSMs, the MX2020 row four and eight. 2,142 W is also exactly Table 71's
      typical INPUT power per PSM. The row's two fan trays disagree with Table 61, which lists
      four (two upper, two lower). And the DC thermal example (Table 84) assumes 34.5 kW of output
      for a loaded chassis, more than the 22.5 kW Table 82 gives the whole system, and its input
      line divides 16.5 by 0.91 to reach 37.9 kW; the MX2020 guide uses the same 34.5 kW. Table
      80's sample counts 5.5 kW for the CB-REs, SFBs and fan trays alone.
    wanted: >-
      an MX2010 power-planning page or datasheet that states a chassis draw for this chassis
      rather than one shared with the MX2020.
groups:
  craft:
    term: Panel
    role: management
    index-origin: 0
  res:
    term: Slot
    role: service
    index-origin: 0
    description: CB-RE slots 0 and 1 at the ends of the upper cage
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - mx2010 hardware guide, "MX2010 Component Redundancy": the host subsystem is a combined Control Board and Routing Engine (CB-RE); with two fitted one is primary and the other backup, and the backup takes over if the primary or any part of it fails. Fabric is NOT on this card on this chassis - it is on the eight SFBs, see `sfbs`'
  sfbs:
    term: Slot
    role: service
    index-origin: 0
    description: Switch Fabric Board slots SFB 0-7
    attrs:
      redundancy: 'n+1'
      redundancy-note: 'n+1 - mx2010 hardware guide, "MX2000-SFB-S Switch Fabric Board Description": 6 Tbps with a minimum of seven SFBs fitted, and an eighth recommended for N+1. The same entry gives the slot count these eight bays come from - up to eight SFBs in an MX2000 - and its redundancy row says seven are needed for line rate and fewer degrades forwarding. The fabric is all-active, so the spare is a working plane. RECORDED AS THE GUIDE WRITES IT: seven-plus-one would be an arithmetic reading of two sentences and the guide itself says N+1'
  fpcs:
    term: Slot
    role: traffic
    index-origin: 0
    description: lower-cage MPC slots LC 0-9 (each MPC seats through an
      adapter card)
  psus:
    term: PSM
    role: service
    index-origin: 0
    description: nine power supply modules, 8+1 load-sharing
    attrs:
      redundancy: 'n+1'
      redundancy-note: 'n+1 PSM, N+N feed redundancy'
