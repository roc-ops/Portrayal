configurations:
  ac-f2b:
    kind: orderable
    default: true
    description: >-
      QFX5220-128C-AFO: four 1600 W AC supplies (JPSU-1600W-AC-AFO) and six front-to-back fan modules
      (QFX5220-128C-FANAO). All have a Juniper gold handle and the label AIR OUT (guide Tables 3, 16 and 18).
    part-numbers:
      QFX5220-128C-AFO: {}
  dc-f2b:
    kind: orderable
    power: dc
    description: >-
      QFX5220-128C-D-AFO: four 1600 W DC supplies (JPSU-1600W-DC-AFO) and six front-to-back fan modules.
      The DC supplies take a D-Sub 3W3 connector (guide, QFX5220-128C DC Power Cable Specification).
    bays:
      psu-0: juniper/qfx10002-jpsu-1600w-dc-afo@1
      psu-1: juniper/qfx10002-jpsu-1600w-dc-afo@1
      psu-2: juniper/qfx10002-jpsu-1600w-dc-afo@1
      psu-3: juniper/qfx10002-jpsu-1600w-dc-afo@1
    part-numbers:
      QFX5220-128C-D-AFO: {}
  chas:
    kind: orderable
    description: >-
      QFX5220-128C-CHAS, the spare chassis, shipped without power supplies or fan modules. Either AC or DC
      supplies are ordered separately, and supplies and fans of one airflow only go in. The supply and fan
      bays are shown open.
    bays: {psu-0: '', psu-1: '', psu-2: '', psu-3: '', fan-0: '', fan-1: '', fan-2: '', fan-3: '', fan-4: '', fan-5: ''}
    part-numbers:
      QFX5220-128C-CHAS: {}
