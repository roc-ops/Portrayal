manufacturer: Juniper
model: QFX5220-128C
portfolio: {line: QFX Series, family: QFX5220}
description: >-
  Juniper QFX5220-128C, a 4RU 100G data-centre spine switch that runs Junos OS Evolved. It has 128 QSFP28
  ports (100 or 40 GbE, 32 of them channelizable to 4 x 25 GbE) and two SFP+ ports (10 GbE only). The
  QSFP28 ports stand in four rows of 32, as stacked pairs, and each port has four lamps. The port side
  also carries an RJ-45 time-of-day port and four clock connectors (PPS and 10 MHz, in and out). It has an
  RJ-45 console port, an RJ-45 management port, a USB port, the reset button, three chassis lamps and the
  ESD point. The rear carries four power supplies and six two-fan modules. It ships in AC and DC builds with
  front-to-back (AIR OUT) airflow only. A spare chassis has no supplies and no fan modules.
