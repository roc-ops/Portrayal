format: 1
kind: device
name: ex3200-48t
version: 0.1.0
maturity: modelled
manufacturer: Juniper
model: EX3200-48T
portfolio: {line: EX Series, family: EX3200}
description: >-
  Juniper EX3200-48T - a fixed 1RU Gigabit Ethernet access switch with 48 10/100/1000BASE-T ports, the
  first eight of them Power over Ethernet. The front carries the 48 jacks in two stacked rows, an LCD
  panel with Menu and Enter buttons, three chassis status lamps and a slot for an optional uplink module,
  which ships covered. The rear carries the management and console jacks, a USB port, a temperature
  shutdown lamp, an ESD point, the earthing terminal, a fan tray and one power supply slot holding a 320 W
  AC supply. Air moves side to rear. The -DC build carries a 190 W DC supply and gives no PoE.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX3200 Switch Hardware Guide, Juniper Networks, published 2020-12-15 (PDF in Juniper's EX Series
      documentation archive): Table 3 (models), Table 5 (chassis size and weight), Figures 1 and 2 (the
      48-port and 24-port front panels), Figure 3 (rear panel), Figures 4 to 8 (LCD panel, uplink modules
      and chassis lamps), Figures 14 and 15 (fan tray and airflow), Figures 16 to 18 (supplies), Tables 11
      to 15 (PoE budget and power) and Table 33 (earthing terminal). EX3200 Ethernet Switches datasheet
      (Juniper Networks, 12 pages, 1000216-013-EN, Nov 2011): Table 1 (models), specifications, per-model
      weights and noise, ordering information, and the four product photographs on page 4 (one image of
      2175 x 654 px, greyscale). No quick-start figure and no studio photograph is used. Terms of use:
      the guide and datasheet are Juniper's, published for customers; none is copied into the library, only
      transcribed facts and new drawings. The guide's front and rear figures are vector line drawings with
      the top face in perspective and the datasheet photographs are perspective views from above, so every
      position is a measurement of a projection and is estimated, as the entries below say.
  gate-1-front:
    confidence: estimated
    note: >-
      The datasheet photographs of the 48-port switches (page 4) are perspective views from above and a
      little front-on, 6 percent shorter than orthographic down. The guide's Figure 1 (g020081) is a vector
      drawing of the 48-port front whose face is 1380 px wide at the resolution it was read and gives the
      four jack blocks, the module panel, LCD and lamps; they are read from it and from the photograph
      together. No figure dimensions the face, so every front position is estimated and carries the same
      positions the EX4200 photographs give, which this front matches.
  gate-1-rear:
    confidence: estimated
    note: >-
      Guide Figure 3 (g020052) is a vector rear view with the top face in perspective: the chassis outline
      is 1407 px across for 438.2 mm (3.211 px per mm) and its face is 137 px high for 44.45 mm, so it is 4
      percent foreshortened vertically. Positions across are read at 3.211 px per mm and heights at 0.325
      mm per px from the top edge of the face. Every rear position is good to about 2 mm. Figure 3 is shared
      by all EX3200 models.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 5: height 1.75 in (4.45 cm) = 44.45 mm; width 17.25 in (43.82 cm) = 438.2 mm, "19 in.
      (48.2 cm) with mounting brackets attached", so 438.2 is the body between the bracket flanges; depth 17
      in (43.18 cm) with no supply, with the 320 W AC supply or with the 190 W DC supply, and 19.25 in (48.9
      cm) with a 600 W or 930 W AC supply (they extend 2.25 in). This model ships with the 320 W supply, so
      the modelled depth is 431.8 mm. THE DATASHEET DISAGREES: it gives 17.41 x 1.72 x 16.43 in (44.21 x 4.32
      x 41.73 cm) and 18.8 in (47.8 cm) with the 600 W or 930 W supply. They are different measures of the
      same chassis (the datasheet's width is the desktop width), and the hardware guide is the newer and the
      more specific document, so the guide's figures are used; the datasheet's are in attrs. 1RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The datasheet ships a 19-inch rack mount kit with each switch, and orders the four-post
      rack mount kit (EX-4PST-RMK) and the wall mount kit (EX-WMK) separately. The guide's mounting topics
      give the post and recess options, and no figure dimensions the bracket positions, so no ear position is
      written and no rail kit is listed in chassis.kits. The kit part numbers are recorded here for the later
      dedupe.
  front-ports:
    confidence: estimated
    note: >-
      48 jacks in two stacked rows, four blocks of six columns across the face (guide Figure 1). The block
      starts read 8.9, 95.6, 182.9 and 269.8 mm from the left edge in the guide's drawing; the jacks are
      placed on the registry's 13.97 mm ganged-jack pitch with the blocks 88.0 mm apart, as the EX4200 front
      does, which agrees with the drawing to 1.3 mm at the second block and 3 mm at the fourth. Row centres
      read 16.8 and 31.6 mm down. The top row is the same part turned 180 so that its keyway is up.
  port-numbering:
    confidence: photo-measured
    note: >-
      The photograph prints the numbers in pairs above the top row of each column: 0 and 1 over the first
      column, 2 and 3 over the second, up to 46 and 47, the even number set higher and to the left, the odd
      lower and to the right (Figure 1 prints the same pairs). The even number belongs to the upper jack and
      the odd to the lower, so numbering runs down each column and then across. The numerals are drawn white
      at 2.2 mm type, estimated, and 2.2 mm either side of the column centre, because a mark that lands
      within 2 mm of the centre of the jack it names reads to lint as a slip at centring. The photograph is
      greyscale and shows no colour difference for the PoE ports. The guide's CLI interface names (ge-0/0/0 to
      ge-0/0/47) are not printed on the metal and are not modelled.
  poe-legend:
    confidence: estimated
    note: >-
      The model plate prints the PoE count after "EX3200". The 24-port photographs show it ("8PoE" and
      "24PoE"); the 48-port plates are too small to read in the image held, so this model carries the count
      Table 3 gives, "8PoE", in the form of the 24-port plates. The -DC build carries no PoE (guide Table 3;
      datasheet Table 1: 0 PoE ports), so the `ac` configuration places the "8PoE" legend as a small part with
      `only-in` and `dc` leaves it off. No source shows the -DC face itself; see the gaps.
  port-lamps:
    confidence: datasheet
    note: >-
      Guide, Network Port LEDs in EX3200 Switches, Figure 10 and Tables 9 and 10: each 10/100/1000BASE-T port
      has two lamps, a Link/Activity lamp (green, blinking with activity, steady when linked) and a Status
      lamp whose meaning is chosen with the LCD Enter button (ADM, DPX, POE or SPD). The lamps are the jack
      housing's two corner windows (common/rj45-ganged-eth) and carry that component's default vocabulary;
      no source pairs the windows of the lower row, so the pairing is the component's.
  front-right:
    confidence: estimated
    note: >-
      Read off the guide's Figure 1 and the datasheet photograph (the EX3200 module panel is the EX4200's):
      the raised right-hand module panel 362.5 to 438.2 mm; the LCD window 375.5 to 411.2 x 10.3 to 19.9 mm;
      the Menu button centre (420.7, 12.5) and the Enter button (420.7, 20.7), 6.1 mm across; the three
      chassis lamps at x 427.8, y 9.05, 12.85 and 16.75; a face screw each side at (366.5, 22.0) and (429.9,
      22.0); the uplink slot 366.9 to 429.9 x 26.5 to 41.0 mm. The model plate (296.5 to 344.0 x 0.9 to 5.0
      mm) carries "EX3200" centred at 304.5 and the PoE count centred at 334.3, where the photograph prints
      them; Figure 1 draws the model name at the left of the top strip, beside the Juniper mark, which the
      photograph does not show. The top strip also carries the Juniper logo at the left, 6.4 to 22.2 x 1.0 to
      5.1 mm, reserved as a logo zone and not drawn.
  lamp-legends:
    confidence: estimated
    note: >-
      drawing-vs-photo: guide Figures 2 and 8 print ALM, SYS and MST beside the three lamps, to their right.
      The photograph cannot resolve type of that size, so it neither confirms nor contradicts the drawing. The
      legends are drawn as the guide draws them. Table 6 says the MST lamp "is meaningful only on EX4200
      switches"; the lamp is on the face and is drawn.
  lcd:
    confidence: photo-measured
    note: >-
      The LCD panel shows two lines of 16 characters (guide, LCD Panel in EX3200 Switches). It is drawn as a
      window; no library component exists for a display and none is added, so it is a decor rectangle and not
      a part. Its colour is the EX4200's: the EX3200 photograph is greyscale.
  uplink-slot:
    confidence: estimated
    note: >-
      Every EX3200 has one front-panel uplink module slot under a flip-up door held by screws; "Uplink
      modules are not part of the standard package and must be ordered separately", and installing one
      begins by removing "the blanking panel covering the empty uplink module slot". The slot is a bay that
      takes the cover here. THE MODULES ARE NOT MODELLED, because none is in the library: the guide names
      three, EX-UM-4SFP (4 SFP ports), EX-UM-2X4SFP (2 SFP+ ports, or 4 SFP in 1-gigabit mode; its MACsec
      variant has no part number in the guide) and the XFP module (2 XFP ports; the datasheet orders it as
      EX-UM-2XFP). The datasheet photographs show the slot with modules fitted, so they give the opening
      and not the cover.
  rear:
    confidence: estimated
    note: >-
      Guide Figure 3, rear seen from behind with x = 0 at the left of the drawing: the two earthing holes
      centred at (26.2, 14.0) and (45.8, 14.0) with the earth symbol below them at (35.2, 31.5); the
      temperature shutdown lamp centred at (48.0, 25.7); the management jack at 64.4 to 80.2 and the console
      jack at 88.3 to 104.1, each 27.9 to 41.1 mm down; the USB port at 121.7 to 133.7; the ESD point centred
      at (170.4, 11.4); the fan tray plate from 198.0 to 338.8 mm and 2.3 to 42.2 mm down; and the power supply
      slot from 339.0, 90.0 mm wide and 41.5 mm high from 2.5 mm down. The figure labels the supply "Power
      supply" and draws no second slot and no redundant power system port. The small round screws beside the
      earthing holes, the console jack and the USB port are not named by any callout and are not drawn.
  rear-legends:
    confidence: estimated
    note: >-
      Guide Figure 3 prints MGMT and CON above the two jacks, as horizontal words about 1.4 mm high. They
      are drawn so, with the earth symbol (a circle holding the earth mark) 12.5 mm across under the holes.
  rear-temperature-lamp:
    confidence: datasheet
    note: >-
      Guide, Rear Panel of an EX3200 Switch: "Temperature shutdown LED", lit when the system shuts down
      because the chassis temperature has risen above the permitted level. No colour is stated.
  rear-ground:
    confidence: datasheet
    note: >-
      Guide Table 33: for the EX3200 the earthing terminal is on the "Rear panel of the chassis", two 10-32 x
      0.25 in screws with a Panduit LCC10-14BWL lug or equivalent. Figure 3 draws two holes 19.6 mm apart,
      which disagrees with the 5/8 in pitch of a two-hole lug; juniper/ex3400-ground-pair is reused, as the
      EX3300 does, set on the midpoint of the two holes.
  fru-bays:
    confidence: datasheet
    note: >-
      One power supply bay and one fan tray bay, each seating the guide's FRU parts (Field-Replaceable Units
      in EX3200 Switches; the fan tray, uplink module and transceivers are hot-removable). The guide says
      the supply "is not redundant". Nothing is built into the chassis.
  psu-seating:
    confidence: datasheet
    note: >-
      Guide Table 3 (the supply is "Power Supply (Minimum)") and Table 4 (PS 320W AC, PS 600W AC, PS 930W AC,
      PS 190W DC); the datasheet prints the codes EX-PWR-320-AC, EX-PWR-600-AC, EX-PWR-930-AC and
      EX-PWR-190-DC, the same codes the EX4200 uses, so those parts are reused. The guide does not say in so
      many words that a larger supply is accepted in place of the minimum, so this model's bay takes every
      supply at or above its minimum, and the DC supply for the -DC build; a configuration seats the one
      shipped.
  airflow:
    confidence: datasheet
    note: >-
      Guide, Airflow Direction in the EX3200 Switch Chassis and Figure 15: the fan tray "provides
      side-to-rear chassis cooling"; the datasheet gives 23.5 cfm. The chassis airflow enumeration has no
      side-to-rear, so `side` is written, the nearest answer.
  power:
    confidence: datasheet
    note: >-
      Guide Table 11: the 320 W supply of this model leaves a 130 W PoE budget for its 8 PoE ports, at up to
      15.4 W each (up to 18.6 W with enhanced PoE from Junos OS 11.1). Table 14 gives 4 A for a switch with 8
      PoE ports. Table 15 gives the DC supply 36 through 72 VDC, 7 A maximum and 190 W output. The guide and
      the datasheet give no typical or maximum draw of the switch itself.
  colour:
    confidence: estimated
    note: >-
      The datasheet photograph is greyscale and shows a black face: the blank face of the 24-port view reads
      59 of 255 in luminance and the top strip 50. The face is drawn #3b3b3b, neutral. The jack shells are
      drawn as the EX4200 draws them, the LCD green and the supply and fan faces are estimated; no photograph
      of the rear is held and the guide's figures are uncoloured line art.
  interface-names:
    confidence: datasheet
    note: >-
      Not printed and not modelled. The guide's Table 4 names the built-in ports PIC 0 and the uplink module
      PIC 1 and its examples name the network ports ge-0/0/0 and up and the uplink module's ports ge-0/1/0 and
      up. No table gives the numbering rule for every model, so the names stay out of the file as a block and
      go here.
  other-faces:
    confidence: drawing
    note: >-
      No source draws the top, bottom or sides flat: the guide's figures show them in perspective with
      mounting holes in the sides. Each carries an `empty` sentence.
attrs:
  physical:
    weight: 15.7 lb (7.1 kg) with the 320 W AC supply (datasheet); 15-17 lb (6.8-7.7 kg) with one supply (guide Table 5)
    weight-chassis-parts: 320 W AC and 190 W DC supplies 2.5 lb (1.1 kg); 600 W and 930 W AC supplies 3.1 lb (1.4 kg) (guide Table 5)
    depth-with-large-psu: 489 mm (19.25 in, 48.9 cm) with a 600 W or 930 W AC supply (guide Table 5); 18.8 in (47.8 cm) in the datasheet
    datasheet-dimensions: 17.41 x 1.72 x 16.43 in (44.21 x 4.32 x 41.73 cm) W x H x D; the guide's Table 5 is used for the envelope
    width-with-brackets: 482 mm (19 in, 48.2 cm) with the mounting brackets attached
  performance:
    switching-capacity: 136 Gbps packet switching, 64-byte packets (datasheet)
    throughput: 101 Mpps wire speed (datasheet)
    mac-addresses-max: 32000
    vlans-max: 4096
    airflow-cfm: 23.5 (datasheet)
  power:
    poe-ports: 8
    poe-budget-w: 130
    psu-redundancy: none; the guide says the supply "is not redundant"
  thermal:
    airflow-direction: side to rear (guide, Figure 15)
  environmental:
    acoustic-noise: 53.4 dBA with the 320 W AC supply (datasheet, ISO 7779 at 23 C)
    operating-temp: 0 to 45 C (32 to 113 F)
    storage-temp: -40 to 70 C
    humidity: 10 to 85 percent noncondensing operating; 0 to 95 percent non-operating
    altitude: up to 3048 m operating (10,000 ft); 4877 m non-operating
  platform:
    cpu: 600 MHz PowerPC
    memory: 512 MB DRAM
    storage: 1 GB flash
  features:
    uplink-module: one slot; EX-UM-4SFP, EX-UM-2X4SFP or the XFP module (not part of the shipping configuration)
    poe: IEEE 802.3af on the first eight ports, 15.4 W each, up to 18.6 W with enhanced PoE
  management:
    console: RJ-45 on the rear
    oob: RJ-45 management port on the rear, 100 Mbps full duplex, with link/activity and status lamps
    lcd: 2 lines of 16 characters with Menu and Enter buttons
    usb: one USB port on the rear
  compliance:
    nebs: NEBS certified (datasheet Table 1 marks the -24T, -48T and DC models; its compliance section says all models except EX3200-24P and EX3200-48P)
    safety: UL 60950-1, C-UL, TUV/GS EN 60950-1, CB IEC 60950-1
    emc: FCC 47 CFR Part 15 Class A, EN 55022 Class A, ICES-003, VCCI Class A
chassis:
  width: 438.2
  height: 44.45
  depth: 431.8
  ru: 1
  color: '#3b3b3b'
  airflow: side
  power: ac
gaps:
  - what: rear-photograph
    scope: [rear]
    reason: needs-photo
    wanted: >-
      A straight-on photograph of the rear. None is held, so the rear is read off the guide's line drawing
      and the supply and fan art follows the isometric drawings.
  - what: front-photograph
    scope: [front]
    reason: needs-photo
    wanted: >-
      A straight-on colour photograph of the front. The datasheet's photographs are greyscale perspective
      views from above, so the vertical positions carry a 6 percent foreshortening, every front position is
      estimated and no PoE colouring can be read.
  - what: dc-front-legends
    scope: [front]
    reason: needs-photo
    wanted: >-
      What the -DC build prints on its model plate. The guide shows the same front for it and the datasheet
      photographs are of the PoE builds. Because the build gives no PoE, the `dc` face is drawn without the
      "8PoE" legend; the "EX3200" line is kept.
  - what: rear-blank-plate
    scope: [rear]
    reason: needs-drawing
    wanted: >-
      The plate with a screw at each end between the USB port and the fan tray in Figure 3, 138.6 to 198 mm
      across. No callout or text names it, so it is not drawn.
  - what: side-faces
    scope: [left, right]
    reason: needs-drawing
    wanted: >-
      A flat drawing or photograph of the two side panels, which carry the bracket holes; the guide draws no
      side elevation.
  - what: rack-ears
    scope: [front]
    reason: needs-drawing
    wanted: >-
      The bracket positions of the front, centre and rear mounting and of the 2-in-recess brackets: no
      figure in the guide measures them, so no ear position or kit is listed.
  - what: lcd-component
    scope: [front]
    reason: vendor-silent
    wanted: A library component for an LCD display; the LCD panel is a decor rectangle until one exists.
  - what: uplink-modules
    scope: [front]
    reason: needs-drawing
    wanted: >-
      The EX-UM-4SFP, EX-UM-2X4SFP and XFP uplink modules and their ports, left for a later uplink-module
      slice; the bay takes only the cover panel here.
  - what: fan-power
    scope: [rear]
    reason: vendor-silent
    wanted: >-
      The fan tray's power draw: neither the guide nor the datasheet states it.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g}
    description: >-
      The 48 built-in 10/100/1000BASE-T ports; the first eight (0 to 7) are PoE ports. rel-pos carries the
      number printed on the faceplate; the upper jack of a column takes the even number
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      how the switch is reached out of band - the RJ-45 management Ethernet port, the RJ-45 console port and
      the USB port on the rear
  lcd-buttons:
    term: Button
    role: management
    index-origin: 0
    description: the LCD panel's Menu and Enter buttons
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the three chassis status lamps right of the LCD panel
  temp-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the temperature shutdown lamp on the rear panel
  uplink:
    term: Slot
    role: traffic
    index-origin: 0
    description: the front-panel uplink module slot
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: n+0
      redundancy-note: >-
        Hardware guide, EX3200 Cooling System: one fan tray with one fan; the system raises an alarm if the fan
        fails and shuts down if the chassis overheats. The guide claims no tolerance of a failed fan
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: n+0
      redundancy-note: >-
        Hardware guide, Power Supply in EX3200 Switches: "The power supply in EX3200 switches is not
        redundant"
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the rear earthing terminal, two 10-32 screws for a two-hole lug (Table 33)
  esd:
    term: Point
    role: furniture
    index-origin: 0
  furniture:
    term: Item
    role: furniture
    index-origin: 0
