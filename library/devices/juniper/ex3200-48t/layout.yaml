configurations:
  ac:
    kind: orderable
    description: >-
      EX3200-48T as shipped - one 320 W AC power supply in the supply slot, the fan tray, and the uplink
      slot covered. Side-to-rear airflow.
    default: true
    part-numbers:
      EX3200-48T: {}
  dc:
    kind: orderable
    power: dc
    description: >-
      EX3200-48T-DC - one 190 W DC power supply and the fan tray: DC powered, with no PoE (the guide:
      "EX3200 switches with a DC power supply installed do not provide PoE").
    bays:
      psu-0: juniper/ex4200-pwr-190-dc@1
    part-numbers:
      EX3200-48T-DC: {}
