configurations:
  ac-f2b:
    kind: orderable
    default: true
    description: >-
      QFX3600-16Q-AFO: two 650 W AC supplies (JPSU-650W-AC-AFO) and three fan trays (QFXC01-FANBO). All
      have port-to-FRU airflow, which the library calls front-to-back (guide Tables 11 and 12).
    part-numbers:
      QFX3600-16Q-AFO: {}
  ac-b2f:
    kind: orderable
    airflow: back-to-front
    description: >-
      QFX3600-16Q-AFI: two 650 W AC supplies (JPSU-650W-AC-AFI) and three fan trays (QFXC01-FANBI). All
      have FRU-to-port airflow, which the library calls back-to-front (guide Tables 11 and 12). The supplies
      have blue handles lettered AFI.
    bays: {psu-0: juniper/qfx5100-jpsu-650w-ac-afi@1, psu-1: juniper/qfx5100-jpsu-650w-ac-afi@1, fan-0: juniper/qfx3600-qfxc01-fanbi@1,
      fan-1: juniper/qfx3600-qfxc01-fanbi@1, fan-2: juniper/qfx3600-qfxc01-fanbi@1}
    part-numbers:
      QFX3600-16Q-AFI: {}
  dc-f2b:
    kind: example
    power: dc
    description: >-
