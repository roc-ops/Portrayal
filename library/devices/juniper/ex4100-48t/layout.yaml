gaps:
- what: datasheet
  scope: [psus]
  reason: vendor-silent
  wanted: >-
    The HPE PSNow datasheet for the EX4100 line (a00150781enw) did not answer when fetched. It would carry the maximum power
    consumption and the thermal output that the hardware guide does not state.
- what: studio-photograph
  scope: [front, rear]
  reason: needs-photo
  wanted: >-
    A straight-on photograph of the EX4100-48T. Juniper's image-library paths returned a 404. The faces are drawn from the guide's
    renders (Figures 1 and 2), which are the only straight-on views held.
- what: port-status-lamp-states
  scope: [rj45, sfp28, sfp-plus]
  reason: vendor-silent
  wanted: >-
    A per-port vocabulary for the Status lamp. Table 25 gives it meanings that depend on the mode the Factory Reset/Mode button chose
    (speed, duplex, administrative status), so the jack keeps the component's default off, link and activity states, and the
    mode lamps carry the meaning.
- what: label-plate
  scope: [rear, front]
  reason: needs-drawing
  wanted: >-
    The size of the CLEI code label, the serial number label and the claim code label (Figure 17 callouts 2, 5 and 8). They
    are drawn as regions and not as parts.
- what: interface-names
  scope: [rj45, sfp28, sfp-plus]
  reason: vendor-silent
  wanted: >-
    The Junos interface names (ge-0/0/n, xe-0/1/n and xe-0/2/n). This guide names only the PIC numbers in Table 64, 0 for the RJ-45
    ports, 1 for the SFP28 Virtual Chassis ports and 2 for the SFP+ uplink ports.
- what: four-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: A flat drawing or photograph of the lid, the underside and the side panels.
- what: reset-pinhole-size
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The diameter and depth of the Reset pinhole (callout 9). The guide names the Reset button and gives no size, so the hole is
    drawn at 2.0 mm as an estimate.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g}
    description: 48 ports with no PoE labelled 0 to 47 in three blocks of eight columns. The even ports are on the upper row
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
    description: Four Virtual Chassis ports labelled 0 to 3, 10GE or 25GE SFP28, in two columns of two
  sfp28-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: 'on', color: '#22c55e'}, {name: blinking, color: '#22c55e', behavior: blinking}]
    description: >-
      A Link Activity lamp and a Status lamp for each Virtual Chassis port, arrows in the band between the two cage rows (Table 24 and
      Table 25). Link Activity is steady with a link and blinking with traffic. Status shows speed: steady 10 Gbps, blinking 1000
      Mbps, three blinks a second 25 Gbps
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: Four uplink ports labelled 0 to 3 under UPLINK, 1GE or 10GE SFP+ with MACsec, in two columns of two
  sfp-plus-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: 'on', color: '#22c55e'}, {name: blinking, color: '#22c55e', behavior: blinking}]
    description: >-
      A Link Activity lamp and a Status lamp for each uplink port, arrows in the band between the two cage rows (Table 24 and
      Table 25). Link Activity is steady with a link and blinking with traffic. Status shows speed: steady 10 Gbps, blinking 1000 Mbps
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the management ports and buttons - the out-of-band RJ-45, the RJ-45 console, the USB port, the Type-C console, the Factory
      Reset/Mode button and the reset pinhole
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: SYS, ALM, MST and CLD chassis lamps (Table 22)
  mode-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: SPD, DX and EN port mode lamps (Table 25; the PoE lamp is not on this model). The Factory Reset/Mode button chooses which one shows
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: 1+1 - the switch ships with one supply and takes a second, load sharing (Table 29)
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        1+1 - the switch ships with two fan modules (1+1 redundancy, fan module topic). Install both for optimal
        cooling, and when the switch runs remove only one at a time: it runs 60 seconds without thermal shutdown
  fan-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: One status lamp per fan module, green when the module works and unlit when it is absent, failed or of the wrong direction (Table 28)
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the rear wrist-strap ESD point (Figure 17 callout 9)
