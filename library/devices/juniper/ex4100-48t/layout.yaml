- {title: 'EX4100 Switch Hardware Guide (Juniper Networks, PDF created 2026-10-01)', url: 'https://www.juniper.net/documentation/us/en/hardware/ex4100/ex4100.pdf', sha256: 75ddb2a517639d63ca27b8fe1889037c0574ce313a742ce0d650c2de9af153a4}
