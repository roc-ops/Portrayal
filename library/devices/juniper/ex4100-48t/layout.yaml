format: 1
kind: device
name: ex4100-48t
version: 1.0.1
maturity: modelled
manufacturer: Juniper
model: EX4100-48T
portfolio:
  line: EX Series
  family: EX4100
description: >-
  Juniper EX4100-48T, a 1U access switch with 48 10/100/1000BASE-T ports and no PoE. The front also has four SFP28
  Virtual Chassis ports, four SFP+ uplink ports and an RS232 to USB Type-C console port. The rear has an RJ-45
  management port, an RJ-45 console port, a USB 2.0 Type-A port, two fan modules and two power supply slots. It ships
  with one 150 W AC supply, and a cover panel closes the second slot. Airflow is front to back. The EX4100-48T-AFI is the
  same switch with back-to-front airflow, and the EX4100-48T-DC has a 150 W DC supply.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX4100 Switch Hardware Guide, Juniper Networks (HPE), PDF created 2026-10-01, 281 pages, fetched from
      juniper.net/documentation/us/en/hardware/ex4100/ex4100.pdf: Tables 13 and 14 (the EX4100-48T, -AFI and -DC
      models and specifications), Table 19 (chassis), Table 20 (module sizes and weights), Tables 26 and 27 (fan modules and
      airflow), Tables 29 to 31 and 34 (AC supplies), Tables 37 to 39 (the DC supply), Figures 14 to 18 (the front and rear of
      the EX4100-48T), Figures 29 to 32 (the lamps) and Figures 50 to 61 (mounting). The guide is copyright
      Juniper Networks and Hewlett Packard Enterprise; no terms of use are printed in it. Nothing of it is copied
      here, since every face is drawn new from measurements. The HPE PSNow datasheet (a00150781enw) did not answer
      (an HTTP/2 stream error on the one try), so no datasheet figure is used and the guide is the only
      maker source for the numbers. Juniper's image-library paths (ex4100-48t-front-high.jpg and the rear and the
      same for the 24P, 24T and 48P) all returned a 404 page, so no studio photograph is held. The community NetBox elevation of the
      EX4100-48T front and rear was fetched and used only to cross-check the three blocks of eight columns; no
      dimension is taken from it. End of life was searched on 2026-10-22 and no Juniper notice for
      the EX4100 was found, so the lifecycle is recorded as none announced.
  chassis:
    confidence: datasheet
    note: >-
      Table 14 and Table 19 - height 1.72 in (4.37 cm), depth 13.78 in (35 cm) with no power supply and fan module and
      15.05 in (38.24 cm) with them installed, width 17.36 in (44.09 cm) with the power supply and fan module installed
      and for all models (Table 19 note). 38.24 cm against 15.05 in (382.3 mm) differ by 0.1 mm and the cm figure is
      carried. The depth carried is the 350.0 mm of the bare chassis, and the modules add the rest, as for the
      EX3400. The body of 440.9 mm is the metal between the bracket fold lines. Weight is 6010 g with the supply and
      fan modules (Table 14) and 11.7 lb (5.3 kg) in Table 19; the two differ by 0.7 kg and Table 19 is carried
      because it is the table of chassis weights.
  scale:
    confidence: estimated
    note: >-
      estimated - Gate 1 passed on Figure 14 (g022751), the 1500 px wide render of the EX4100-48T front. The body is 1310 px
      across (70 to 1379.5) and 129 px high, against 440.9 by 43.7 mm: aspects 10.15 and 10.09. So the figure is orthographic
      and is read at 2.97 px/mm. The rear render, Figure 15 (g022752), reads about 2.957 px/mm. The 48-port panel was measured
      on this figure.
  ports:
    confidence: estimated
    note: >-
      estimated - Figure 16 callout 2 and Figure 14 give 48 RJ-45 ports in three blocks of two rows and eight columns.
      Cavity edges were found along a pixel row of Figure 14: the columns are 41.3 px, 13.96 mm, apart, which is the
      registry's 13.97 mm ganged pitch, and the blocks start 117.5 mm apart (a 5.7 mm gutter after eight columns). The
      two rows are 14.31 mm apart (cavity centres 15.8 and 30.1 mm down) with the upper row turned 180 so that its lamp
      tabs face up, as rendered. The four SFP28 cages at 359.7 mm and the four SFP+ cages at 391.0 mm abut on
      the registry's 14.25 mm pitch, in two stacked rows on the jack rows' centres, the lower row turned 180 so that
      both lips face the band between them.
  port-numbering:
    confidence: datasheet
    note: >-
      Figures 14 and 16 print 0 and 1, 2 and 3, up to 46 and 47 under the column pairs, with an up triangle after the even
      number and a down triangle before the odd one, so the upper jack of a column is the even port. The cages are
      printed 0 to 3 under each block the same way, and the uplink block is bracketed and labelled UPLINK. Table 64
      names the PIC numbers - 0 for the RJ-45 ports, 1 for the SFP28 ports and 2 for the SFP+ uplink ports - and
      the interface names (ge-0/0/n and so on) are not printed on the metal and are not stated, so none is recorded.
  port-lamps:
    confidence: datasheet
    note: >-
      Figures 29 to 31 and Table 24 - each RJ-45 jack has a Link Activity lamp at one corner and a Status lamp at the
      other; the common/rj45-ganged-eth@1 housing carries both. Each SFP28 and SFP+ port has a Link Activity lamp and a
      Status lamp, drawn as arrows in the band between the two cage rows. Figure 30 numbers them 1, 1, 2, 2 across a
      column: down arrow, up arrow, down arrow, up arrow, so the down arrows belong to the lower port and the up arrows
      to the upper one. The pitch of the arrows within a column is read off the EX4100-24P render, whose right-hand block is the same. The Status lamp's colour
      shows speed (Table 25), so its states are not expressible as one vocabulary here (see gaps).
  status-block:
    confidence: estimated
    note: >-
      estimated - Figure 14 and Figure 27. The four chassis lamps SYS, ALM, MST and CLD are in the left column of the dark
      panel at the right and the three port mode lamps SPD, DX and EN in the right column, each lamp above its legend,
      at 4.6 mm pitch. The PoE mode lamp is not on this model (Table 25 note) and its place is blank. The Factory Reset/Mode button is a light-blue disc below them with a list symbol to its right
      (Figure 32), and the RS232 to USB Type-C console port, labelled CON, is below the button. Table 22 and Table 25 give
      the lamp meanings. The reset pinhole (callout 9 of the 48P Figure 12) is the dot printed between ports 44 and 45.
  drawing-vs-photo:
    confidence: estimated
    note: >-
      No photograph of the real device is held. The guide's renders (Figures 14 and 15) are used for what is printed and
      where, and the line drawings (Figures 16 to 18) for the callouts. The render prints the port numbers in light grey
      on this non-PoE model, as the PoE models print them in salmon red; the line drawings print them black. The render
      wins.
  rear:
    confidence: estimated
    note: >-
      estimated - Figure 15 and Figure 17 (Figure 18 for the DC supply). From the left, a lighter plate holds the MGMT RJ-45 over a USB 2.0 Type-A
      port in one housing, the CON RJ-45 and a claim code label area. Then come fan 0 and fan 1, each with a fan icon, its number and a round status
      lamp to its left, a plate with the earthing terminal (two holes on a lighter strip, with the earth symbol), the ESD point
      and two label areas (the CLEI code and the serial number), and power supply slots 0 and 1, each with a power icon and its
      number to its left. Measured at 2.957 px/mm from the 441.0 mm body. The 48-port models carry the claim code label
      on the rear (Figure 17 callout 2), where the 24-port models have it on the front.
  rear-modules:
    confidence: estimated
    note: >-
      estimated - the fan faces measure 124 by 125 px, 41.9 by 42.3 mm, 49.4 mm apart (82.3 and 131.7 mm from the left).
      The power supply faces measure 72.4 by 40.1 mm, 83.1 mm apart. The guide's module sizes (Table 20 note) are used for
      the bays (73.0 by 40.0 for a supply, 41.9 by 41.8 for a fan), centred on the measured faces. The second supply slot
      holds a cover panel, which the guide says to keep in an empty slot (the replacement procedures); the render shows
      two supplies fitted and Figure 17 shows the slot empty, so the default carries one. The render's supplies are
      the 920 W unit of the 24P and are used here for the 150 W unit, whose face Figure 43 draws the same.
  earthing:
    confidence: datasheet
    note: >-
      Table 59 and Figure 71 - a two-hole protective earthing terminal on the rear panel, with two M5 by 10 mm screws with
      washers, orderable separately, and a Panduit LCD8-14A-L lug or equivalent. The holes are 16.9 mm apart on the render (the
      lug pitch is not stated in the guide). The two tapped holes are drawn as decor and the separately ordered screws are not drawn.
  ears:
    confidence: datasheet
    note: >-
      Figure 50 shows the two-post front-mounting brackets that ship (EX-RMK, Table 5, supplied) fitted flush with the front, and the
      guide's mounting topics give a 2 in. recessed position with the 2 in. recessed front-mounting brackets of the four-post rack-mounting
      kit EX-4PST-RMK (Table 5, orderable). The recess is 2 in. (50.8 mm). The wall-mount kit EX-WMK (Table 5, orderable) is a third
      mount. The kits are not listed under kits in this slice: the guide's parts are named but not modelled as kind kit
      contracts, and the figures place the brackets without a measurable fold line, so only the recess has an at.
  color:
    confidence: estimated
    note: >-
      estimated - median of the bare face between the logo and the first jack block in Figure 14, #9397a0, and of the status panel,
      #434c59. Sampled from the guide's render, which may not match the metal.
  power:
    confidence: datasheet
    note: >-
      Table 31 - the 150 W AC supply takes 3 A at 100 to 127 VAC and 1.5 A at 200 to 240 VAC. The EX4100-48T has no PoE (Table 14). The guide gives no maximum power consumption for the switch, and its datasheet did not answer,
      so none is stated and the module power warning stands.
  fru-bays:
    confidence: datasheet
    note: >-
      Table 13 and Table 53 - the switch ships with two fan modules and one 150 W AC supply (150 W DC on the -DC model), preinstalled. The supplies are fully redundant,
      load sharing and hot-removable and hot-insertable when the second supply is installed and running. The fan modules are hot-removable
      and hot-insertable and one is removed at a time. Do not mix AC and DC supplies, or supplies and fans of different airflow. Both
      supplies and fans are bays here; nothing in the chassis is built in. Transceivers are the third kind of FRU the guide names.
attrs:
  physical:
    weight: 5.3 kg (11.7 lb) with the power supply and fan modules, 6010 g in Table 14 (Table 19)
    depth-with-modules: 382.4 mm (15.05 in., 38.24 cm) with the power supply and fan modules installed (Tables 14 and 19)
    width-with-brackets: 482 mm (19 in.) with the mounting brackets attached (rack requirements)
  power:
    power-input-ac: 100 through 127 VAC or 200 through 240 VAC, 50 or 60 Hz (Table 31)
  thermal:
    airflow: front to back, both fan modules and the supply marked AIR OUT; back to front, marked AIR IN, on the -AFI model (Table 27)
  environmental:
    operating-temp: 0 to 45 C (32 to 113 F), 40 C with 10GBASE-T transceivers (environmental requirements)
    altitude: no performance degradation up to 1524 m (5,000 ft)
    humidity: 10 to 85 percent, noncondensing
  platform:
    first-junos-release: 22.2R1 (Table 7)
  features:
    poe: none, the switch has no PoE ports (Table 14)
    virtual-chassis: up to 10 EX4100 switches. The four SFP28 ports are dedicated Virtual Chassis ports
    uplink-ports: four SFP+ ports take 1 GbE or 10 GbE transceivers, with MACsec
    macsec: the SFP+ uplink ports are MACsec-enabled
    optics-sfp28: the four Virtual Chassis ports are 10GE or 25GE SFP28 ports (Table 8). VC formation is not supported with a 10GBASE-T transceiver in them
    optics-sfp-plus: the four uplink ports are 1GE or 10GE SFP+ ports (Table 8). With a 10GBASE-T transceiver the maximum ambient is 40 C
  management:
    oob: management Ethernet RJ-45 on the rear panel, with a link activity lamp and a status lamp
    console: RJ-45 console on the rear panel and RS232 to USB Type-C console on the front, both labelled CON
    usb: one USB 2.0 Type-A port on the rear panel
  compliance:
    acoustic: 39.1 dB maximum with one supply and 39.2 with two, no typical figure (Table 4); 38.4 and 38.2 on the -AFI, 37.5 and 37.7 on the -DC
    seismic: tested for Zone 4 earthquake safety
  lifecycle: {eol: none-announced}
