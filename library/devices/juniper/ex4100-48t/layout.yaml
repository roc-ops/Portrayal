configurations:
  ac:
    kind: orderable
    description: >-
      The switch as shipped: one 150 W AC supply in slot 0, a cover panel over slot 1 and two front-to-back fan modules, all marked
      AIR OUT.
    default: true
    part-numbers:
      EX4100-48T: {}
  afi:
    kind: orderable
    description: >-
      The EX4100-48T-AFI (Table 13): one 150 W AC supply marked AIR IN in slot 0, a cover panel over slot 1 and two back-to-front
      fan modules marked AIR IN, with blue handles. Cold air enters at the rear and leaves at the front, so the rear faces the cold aisle.
      The front panel is the same.
    airflow: back-to-front
    bays:
      fan-0: juniper/ex4100-fan-afi@1
      fan-1: juniper/ex4100-fan-afi@1
      psu-0: juniper/ex4100-jpsu-150-ac-afi@1
    part-numbers:
      EX4100-48T-AFI: {}
  dc:
    kind: orderable
    description: >-
      The EX4100-48T-DC (Table 13): one 150 W DC supply in slot 0, a cover panel over slot 1 and two front-to-back fan modules, all marked
      AIR OUT. The front panel is the same. The DC PSU terminal connector ships with it (Table 53). The EX4100-48T-DC-T1, the same switch
      on an ORv3 tray, is a different mount and is not modelled.
    power: dc
    bays:
      psu-0: juniper/ex4100-jpsu-150-dc-afo@1
    part-numbers:
      EX4100-48T-DC: {}
