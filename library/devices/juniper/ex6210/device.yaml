gaps:
- what: chassis-size
  scope: [front, rear]
  reason: sources-disagree
  note: >-
    Height: 24.3 in in the guide's Table 7, which is 617.2 mm, and 61.1 cm in the same row; the datasheet gives 24.3 in and 61.6 cm.
    Width: 17.3 in (43.9 cm) and 19 in (48.3 cm) with the brackets in both. Depth: 15.5 in (39.3 cm) in both. The task gave 9 U; the guide
    and the datasheet give 14 U, and 24.3 in is 13.9 U. The inch figures are carried: 439.4 x 617.2 x 393.7 mm.
  wanted: a mechanical drawing of the chassis, or Juniper's confirmation of the height in centimetres
- what: line-cards
  scope: [front]
  reason: needs-drawing
  wanted: >-
    The EX6200-48T (48-port RJ-45), EX6200-48P (48-port PoE+) and EX6200-48F (48-port SFP) line cards (guide Tables 3 and 36 to 40, Figures
    25 to 30). Each has 48 ports in a block, two lamps per port and the ON, ST and (for the PoE card) PoE lamps. A line card family is a
    separate piece of work. The two cards each shipping order includes are not shown; every line card slot shows its cover panel, and the
    guide says which slots the cards take nowhere.
- what: cover-part-numbers
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The part numbers of the line card cover panel and the SRE module cover panel. Juniper's end-of-life table lists EX6200-BLNK-LC and
    EX6200-BLNK-SRE-LC without descriptions and the guide gives the panels no number, so none is written. EX6200-BLNK-PWR-1U is listed there
    too and the guide's Table 21 has no 1U cover.
- what: dc-cover-panel
  scope: [rear]
  reason: sources-disagree
  note: >-
    Table 5 lists three 2500 W AC power supply cover panels for the DC order and Table 51 three 2100 W DC power supply cover panels; Table 21
    names a cover for the two AC supplies only. The 2U cover (EX6200-BLNK-PWR-2U) is seated over the DC slots.
  wanted: the cover panel part number for the 2100 W DC supply
- what: psu-faces
  scope: [front]
  reason: needs-drawing
  wanted: >-
    A flat drawing or photograph of the 5000 W AC and the 2100 W DC supply faces. The guide draws both only in isometric (Figures 17, 23, 24, 66
    and 68), so their lamps, switch, handle and terminals are fractions, and the 5000 W supply's 3U height is the guide's "approximately 3 U".
    The DC supply is drawn with two positive and two negative studs as Figure 23 shows; the text names one pair of input lugs.
- what: psu-population
  scope: [front]
  reason: vendor-silent
  wanted: >-
    Which power supply slot the single shipped supply takes. Every figure draws four supplies (Figure 5) and the guide says power supplies
    need not be installed in serial order, so PSU 0 is shown seated and PSU 1 to PSU 3 covered.
- what: rear-face
  scope: [rear]
  reason: needs-photo
  wanted: >-
    A straight-on drawing or photograph of the rear. Figure 2 is an isometric, so the fan tray, the rectangular opening in the plate, the exhaust
    band and the two earthing and ESD points are fractions of it; the opening's purpose is not stated.
- what: side-faces
  scope: [left, right, top, bottom]
  reason: needs-drawing
  wanted: >-
    The sides, top and bottom. Figures 1 and 2 show the sides in isometric with rows of screws, the bracket and a handle plate and no dimension;
    no flat figure of any of them exists.
- what: air-filter
  scope: [front]
  reason: needs-photo
  wanted: >-
    The optional air filter (EX6210-FLTR, six captive screws over the intake strip at the front right; the datasheet lists it as a spare and the
    guide does not ship it). It bolts onto the front and is drawn in no flat figure, so it is not drawn.
- what: earthing-terminal
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    The protective earthing terminal as a part that seats a ring lug. The guide gives a pair of threaded inserts for UNC 1/4-20
    screws, 0.625 in (15.86 mm) apart, and a lug (Panduit LCD2-14A-L) with two screws, but draws them only in isometric (Figures 2 and
    13). The pair is drawn as two plain insert heads, not as the library's stud-pair part: that part presents lug seats, which the library's
    pinned census of default lug turns (spec/tests/test_occupant_turn.py) counts, and an open pull request edits that test.
- what: photo-view
  scope: [front, rear]
  reason: needs-photo
  wanted: >-
    A straight-on photograph of the front and the rear. Every position comes from the guide's drawings and none from a photograph, so the colour
    and finish are not known.
groups:
  slots:
    term: Slot
    role: traffic
    index-origin: 0
    description: >-
      The eight line card only slots on the front, numbered 0 to 3 and 6 to 9 from the top (guide Table 10 and Figure 4)
  sre-slots:
    term: Slot
    role: service
    index-origin: 0
    description: >-
      The two slots numbered 4 and 5, which take an SRE module or a line card (guide Table 10 and Figure 4)
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        1+1 for the SRE modules: one is the primary and the other the backup; at least one is required (guide,
        Understanding EX6210 Switch Component and Functionality Redundancy)
  psus:
    term: PSU
    role: service
    index-origin: 0
    description: the four power supply slots PSU 0 to PSU 3 at the foot of the front (guide Table 11 and Figure 5)
    attrs:
      redundancy: 'n+1'
      redundancy-note: >-
        n+1 by default and n+n (2+2) by configuration (guide, Understanding EX6210 Switch Component and Functionality Redundancy); a shipping
        order has one supply
  cooling:
    term: Tray
    role: service
    index-origin: 0
    description: the single vertical fan tray at the rear (guide, EX6210 Switch Cooling System)
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD points, one at the front top right and one at the rear lower left (guide Figures 1 and 2)
