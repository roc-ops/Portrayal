configurations:
  base:
    kind: base
    default: true
    description: >-
      The switch as every shipping order is built, less the line cards: one SRE module in slot 4 and its cover panel over slot 5, one
      2500 W AC power supply in PSU 0 with covers over PSU 1 to PSU 3 and the blank shelf, the fan tray, and a cover panel in each line
      card slot. Line cards are ordered separately.
    bays:
      slot-0: juniper/ex6200-lc-cover@1
      slot-1: juniper/ex6200-lc-cover@1
      slot-2: juniper/ex6200-lc-cover@1
      slot-3: juniper/ex6200-lc-cover@1
      slot-6: juniper/ex6200-lc-cover@1
      slot-7: juniper/ex6200-lc-cover@1
      slot-8: juniper/ex6200-lc-cover@1
      slot-9: juniper/ex6200-lc-cover@1
  redundant:
    kind: example
    description: >-
      The base build with a second SRE module in slot 5, as the guide describes the redundant configuration (one SRE module is the primary and
      the other the backup). An illustration, not an order code: the guide gives the second module no bundle.
    bays:
      slot-5: juniper/ex6200-sre64-4xs@1
  ac-2500-t:
    kind: orderable
    description: >-
      EX6210-S64-96T-A25: the 96-port RJ-45 system with a 2500 W AC power supply. It ships with two 48-port RJ-45 line cards
      (EX6200-48T), which are not modelled, so every line card slot shows its cover panel.
    part-numbers:
      EX6210-S64-96T-A25: {}
  ac-2500-p:
    kind: orderable
    description: >-
      EX6210-S64-96P-A25: the 96-port PoE+ system with a 2500 W AC power supply. It ships with two 48-port PoE+ line cards
      (EX6200-48P), which are not modelled, so every line card slot shows its cover panel.
    part-numbers:
      EX6210-S64-96P-A25: {}
  ac-5000-p:
    kind: orderable
    description: >-
      EX6210-S64-96P-A50: the 96-port PoE+ system with a 5000 W AC power supply, which has two inlets and is about 3 U high.
      The shelf is left out and the slots are the 3U ones. It ships with two 48-port PoE+ line cards, which are not modelled.
    part-numbers:
      EX6210-S64-96P-A50: {}
  dc-2100-t:
    kind: orderable
    power: dc
    description: >-
      EX6210-S64-96T-D21: the 96-port RJ-45 system with a 2100 W DC power supply and two DC lugs (Panduit LCD4-14A-L). It ships
      with two 48-port RJ-45 line cards, which are not modelled.
    bays:
      psu-0: juniper/ex6200-pwr-dc2100@1
    part-numbers:
      EX6210-S64-96T-D21: {}
  chassis:
    kind: orderable
    description: >-
      EX6210-CHAS, the spare chassis with backplane (datasheet ordering table). It ships without an SRE module, line cards, supplies or
      fan tray, which are ordered separately; the bays are shown open.
    bays:
      slot-0: ''
      slot-1: ''
      slot-2: ''
      slot-3: ''
      slot-4: ''
      slot-5: ''
      slot-6: ''
      slot-7: ''
      slot-8: ''
      slot-9: ''
      psu-0: ''
      psu-1: ''
      psu-2: ''
      psu-3: ''
      fan-0: ''
    part-numbers:
      EX6210-CHAS: {}
