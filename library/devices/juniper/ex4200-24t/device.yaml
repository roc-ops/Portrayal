format: 1
kind: device
name: ex4200-24t
version: 0.2.0
maturity: modelled
manufacturer: Juniper
model: EX4200-24T
portfolio: {line: EX Series, family: EX4200}
description: >-
  Juniper EX4200-24T - a fixed 1RU Gigabit Ethernet access switch with 24 10/100/1000BASE-T ports, the
  first eight of them Power over Ethernet. The front carries the 24 jacks in two stacked rows, an LCD
  panel with Menu and Enter buttons, three chassis status lamps and a slot for an optional uplink module,
  which ships covered. The rear carries a fan tray, two Virtual Chassis ports, a USB port, a temperature
  shutdown lamp, the management and console jacks, an ESD point and two power supply slots; as shipped
  it holds one 320 W AC power supply and a cover panel over the second slot. Air moves side to rear. The
  -DC build carries a 190 W DC supply and gives no PoE. The EX4200-48T is the same panel with 48 ports.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX4200 Switch Hardware Guide, Juniper Networks, published 2022-01-16 (341 pages; PDF created 2022-01-16;
      Juniper keeps it in its EX Series documentation archive, https://www.juniper.net/documentation/en_US/release-independent/downloads/ex-series/ex-series-doc-archives.zip,
      member ex-series-doc-archives/ex4200.pdf): Table 1 (models), Table 3 (chassis size and weight),
      Figure 2 (24-port front panel drawing), Figure 4 (rear panel), Figure 5 (LCD panel and chassis lamps),
      Figures 6 to 8 (uplink modules), Figures 9 to 14 (lamps), Figures 15 and 16 (fan tray and airflow),
      Figures 17 to 19 (supplies), Tables 4 to 13 (lamps and power), Table 37 (packing list) and the installation
      and replacement procedures. EX4200 Ethernet Switch with Virtual Chassis Technology Datasheet (Juniper
      Networks, 13 pages, document 1000215-026-EN, Feb 2019; PDF created 2019-02-11, https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex4200-ethernet-switch-with-vitual-chassis-technology.pdf):
      Table 1 (models), specifications, per-model weights and noise, ordering information and the product
      photographs on page 6 (2175 x 811 px; the 24-port views are captioned EX4200-24T and EX4200-24P/24PX).
      Juniper's image-library photographs (www.juniper.net/content/dam/www/assets/images/us/en/image-library/ex-series/<SKU>/<SKU>-front-high.jpg
      for EX4200-24T, -24P, -24PX, -24F, -48T, -48P and -48PX, and the -rear-high.jpg names) were requested
      on 2026-10-23 and every address answered 404, so no studio photograph is held. No EX4200 quick start
      is in the archive zip. Terms of use: the guide, datasheet and photographs are Juniper's, published
      for customers; none is copied into the library, only transcribed facts and new drawings. The guide's
      front and rear figures are isometric drawings and the datasheet photographs are perspective views
      from above, so every position is a measurement of a projection and is estimated, as the entries
      below say.
  gate-1-front:
    confidence: estimated
    note: >-
      The datasheet photograph of the 24T (page 6, middle right) is a perspective view from above and
      a little front-on. Its face spans 826 px across for the guide's 438.2 mm and is 4.5 percent shorter
      than orthographic down, as the 48-port views are (2.04 px per mm across and 1.95 up). So columns
      are read at the across scale, and heights at the face's own scale counted up from the bottom edge,
      which is the edge every photograph shows cleanly. The 24P/24PX photograph reads the same columns
      within a millimetre, which is the second image the figures are checked against. The guide's own
      figure of the 24-port front (Figure 2, g020054) is 604 px wide in the PDF and gives counts and order
      only.
  gate-1-rear:
    confidence: estimated
    note: >-
      Guide Figure 4 (g020084, 609 x 252 px as embedded) is a rear view with the top face in perspective:
      the chassis outline is 557 px across for 438.2 mm (1.271 px per mm) and its face is 53.7 px high
      for 44.45 mm, so it is 5 percent foreshortened vertically. Positions across are read at 1.271 px
      per mm and heights at 0.828 mm per px, from the top edge of the face. It is a low resolution raster,
      so every rear position is good to about 2 mm. Figure 4 is shared by all the EX4200 models.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 3: height 1.75 in (4.45 cm) = 44.45 mm; width 17.25 in (43.82 cm) = 438.2 mm, "19 in.
      (48.2 cm) with mounting brackets attached", so 438.2 is the body between the bracket flanges; depth
      17 in (43.18 cm) with no supply, with the 320 W AC supply or with the 190 W DC supply, and 19.25
      in (48.9 cm) with a 600 W or 930 W AC supply (they extend 2.25 in). This model ships with the 320
      W supply, so the modelled depth is 431.8 mm. THE DATASHEET DISAGREES: it gives 17.41 x 1.72 x 16.43
      in (44.21 x 4.32 x 41.73 cm) and 18.8 in (47.8 cm) with the 600 W or 930 W supply. They are different
      measures of the same chassis (the datasheet's width is the desktop width and its figures are 0.16
      in wider, 0.03 in lower and 0.57 in shallower), and the hardware guide is the newer and the more
      specific document, so the guide's figures are used; the datasheet's are in attrs. 1RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's packing list ships two mounting brackets and eight screws, and the guide
      says the switch mounts on two posts with those, on four posts with the separately orderable four-post
      rack-mount kit (datasheet EX-4PST-RMK), recessed 2 in from the front with the 2-in-recess front
      brackets of that kit, on a desk on its rubber feet, or on a wall with the separately orderable wall-mount
      kit (EX-WMK); the datasheet also lists EX-RMK. The brackets align "along the front, rear, or center
      of the side panels". No figure dimensions the bracket positions, so no ear position is written and
      no rail kit is listed in chassis.kits. The kit part numbers are recorded here for the later dedupe.
  front-ports:
    confidence: estimated
    note: >-
      24 jacks in two stacked rows, two blocks of six columns. Read off the 24-port datasheet photographs
      with the face's left edge at 0: the top-row cavities are centred at 15.8, 30.0, 43.9, 57.8, 71.7
      and 85.5 mm in the first block and 104.0 in the second, the same columns as the 48-port panel. The
      column pitch is 13.94, the registry's 13.97 ganged-jack pitch (0.550 in); the blocks start 88.0
      mm apart, so the gutter is 88.0 - 6 x 13.97 = 4.2 mm. Row centres read 16.8 and 31.6 mm down, a
      14.8 step, the same step as the EX4300. The top row is the same part turned 180 so that its keyway
      is up. Past the second block the plate is bare to the right-hand block, as the guide's Figure 2
      shows.
  port-numbering:
    confidence: photo-measured
    note: >-
      The photograph prints the numbers in pairs above the top row of each column: 0 and 1 over the first
      column, 2 and 3 over the second, up to 22 and 23, the even number set higher and the odd lower and
      to its right. The even number belongs to the upper jack and the odd to the lower, so numbering runs
      down each column and then across. The numerals are 2.2 mm high on the photograph and are drawn at
      2.2 mm type, estimated. The pair is read at 2.1 mm left (even) and 0.7 to 1.3 mm right (odd) of
      the column centre; it is drawn 2.2 mm either side of it, because a mark that lands within 2 mm of
      the centre of the jack it names reads to lint as a slip at centring. The guide's CLI interface names
      (ge-0/0/0 to ge-0/0/23) are not printed on the metal and are not modelled.
  poe-numerals:
    confidence: photo-measured
    note: >-
      The datasheet's 24T view prints the numerals of ports 0 to 7 in orange and the others in white,
      and its model plate reads "EX4200" in white and "8PoE" in orange. The -DC build carries no PoE (guide
      Table 1, pp. 4-5; datasheet Table 1: 0 PoE ports), so the `ac` configuration places the "8PoE" legend
      and the orange numerals as two small parts with `only-in`, and `dc` places white numerals and no
      legend. No source shows the -DC face itself; see the gaps.
  port-lamps:
    confidence: datasheet
    note: >-
      Guide, Network Port LEDs in EX4200 Switches, Figure 11 and Tables 7 and 8: each 10/100/1000BASE-T
      port has two lamps, a Link/Activity lamp (green, blinking with activity, steady when linked) and
      a Status lamp whose meaning is chosen with the LCD Enter button (ADM, DPX, POE or SPD). The lamps
      are the jack housing's two corner windows (common/rj45-ganged-eth) and carry that component's default
      vocabulary; no source pairs the windows of the lower row, so the pairing is the component's.
  front-right:
    confidence: estimated
    note: >-
      Read off the datasheet photographs at 2.04 px per mm across and 1.95 px per mm up from the bottom
      edge, and checked against the 24F photograph (the LCD centre at 15.05 and 15.2 mm): the raised right-hand
      module panel 362.5 to 438.2 mm; the LCD window 375.5 to 411.2 x 10.3 to 19.9 mm (35.7 x 9.6); the
      Menu button centre (420.7, 12.5) and the Enter button (420.7, 20.7), 6.1 mm across; the three chassis
      lamps at x 427.8, y 9.05, 12.85 and 16.75; a face screw each side at (366.5, 22.0) and (429.9, 22.0);
      the uplink slot 366.9 to 429.9 x 26.5 to 41.0 mm. The model plate (296.5 to 344.0 x 0.9 to 5.0 mm)
      carries "EX4200" centred at 304.5 and the PoE count centred at 334.3. The top strip also carries
      the Juniper logo at the left, 6.4 to 22.2 x 1.0 to 5.1 mm, reserved as a logo zone and not drawn.
  lamp-legends:
    confidence: estimated
    note: >-
      drawing-vs-photo: guide Figures 5 and 9 print ALM, SYS and MST beside the three lamps, to their
      right, with a bracket. The datasheet photograph resolves a dark vertical bar at the right of the
      lamps and cannot resolve type of that size (1.4 mm against 2.04 px per mm, while the 2.2 mm numerals
      resolve), so it neither confirms nor contradicts the drawing. The legends are drawn as the guide
      draws them. The order top to bottom is the guide's order of naming (ALM, SYS, MST).
  lcd:
    confidence: photo-measured
    note: >-
      The LCD panel shows two lines of 16 characters (guide, LCD Panel in EX4200 Switches). It is drawn
      as the green window the photograph shows; no library component exists for a display and none is
      added, so it is a decor rectangle and not a part.
  uplink-slot:
    confidence: estimated
    note: >-
      Every EX4200 has one front-panel uplink module slot, under a flip-up door held by screws; "Uplink
      modules are not part of the standard package and must be ordered separately", and the packing list
      ships an uplink module cover panel (the blanking panel under the door), preinstalled. The slot is
      a bay that takes the cover here. THE MODULES ARE NOT MODELLED, by the task's rule: the guide names
      four, EX-UM-4SFP (4 SFP ports), EX-UM-2X4SFP (2 SFP+ ports, or 4 SFP in 1-gigabit mode), EX-UM-2X4SFP-M
      (the same with MACsec) and EX-UM-2XFP (2 XFP ports), and the datasheet orders them under those names.
      The datasheet photographs show the slot with modules fitted, so they give the opening and not the
      cover.
  rear:
    confidence: estimated
    note: >-
      Guide Figure 4, rear seen from behind with x = 0 at the left of the drawing: the fan tray plate
      from 0.6 to 245.6 mm and 2.7 to 26.9 mm down (honeycomb band, thumbscrew at each end); on the chassis
      below it VCP-0 at 18.9 to 55.1 x 29.6 to 37.9 and VCP-1 at 67.9 to 103.9, the USB port at 121.6
      to 136.4, the temperature shutdown lamp centred at (145.3, 35.2), the management jack at 153.7 to
      170.0, the console jack at 180.5 to 195.8 and the ESD point centred at (218.0, 36.2); power supply
      slot 1 from 249.8 and slot 0 from 340.5, each 90.0 mm wide and 41.5 mm high from 2.5 mm down. The
      figure labels the left supply "Power Supply 1" and the right "Power Supply 0". The small round screws
      between the Virtual Chassis ports and beside the USB port are not named by any callout and are not
      drawn.
  rear-legends:
    confidence: estimated
    note: >-
      Guide Figure 10 draws the management jack with the letters M, G, M, T stacked upright to its right
      and the legends VCP-0 and VCP-1 under the Virtual Chassis ports; Figure 4 draws a similar vertical
      legend beside the console jack that is too small to read. The management legend is drawn as the
      word MGMT turned to read top to bottom (the library's form for printing that runs sideways, where
      the figure stacks upright letters), the VCP legends as printed, and the console legend as the turned
      word CON, an estimate of the unreadable one.
  rear-vcp:
    confidence: datasheet
    note: >-
      Two Virtual Chassis ports (VCP-0 and VCP-1), "68-pin connector" (guide, Virtual Chassis Ports Connector
      Pinout Information), joined with the Virtual Chassis cable that ships with the switch (datasheet:
      128 Gbps backplane, up to 10 switches). No document names the connector, and the library's VHDCI
      receptacle is another shape, so a part of the family (juniper/ex4200-vcp-port) is drawn from Figure
      4's 36.2 x 8.3 mm opening.
  rear-temperature-lamp:
    confidence: datasheet
    note: >-
      Guide, Rear Panel of an EX4200 Switch: "Temperature shutdown LED", lit when the system shuts down
      because the chassis temperature has risen above the permitted level. No colour is stated.
  rear-ground:
    confidence: datasheet
    note: >-
      The protective earthing terminal is on the SIDE PANEL (Figure 4's callout "Protective earthing terminal
      (on side panel)"), a two-hole terminal. No figure gives its position or hole pitch, so the side
      faces carry an `empty` sentence and it is a gap. The ESD point on the rear is modelled.
  fru-bays:
    confidence: datasheet
    note: >-
      Two power supply bays (slot 0, slot 1) and one fan tray bay, each seating the guide's FRU parts.
      The guide calls the supply "fully redundant" (a second supply in the other slot), and one supply
      carries a fully loaded chassis (datasheet). The cover panel the guide ships for an empty supply
      slot is seated in slot 1 as shipped and the supply in slot 0. The guide says mixing AC and DC supplies
      in one chassis is not supported; that is left to the configurations. The fan tray and the supplies
      are FRUs, hot-swappable; nothing is built into the chassis.
  psu-seating:
    confidence: datasheet
    note: >-
      Guide, Power Supply in EX4200 Switches and Table 1 (the supply is "Power Supply (Minimum)"): the
      320 W AC supply is the minimum for this model and the 190 W DC supply is the one its -DC build ships
      with; "All EX4200 switches support EX-PWR2-930-AC and EX-PWR3-930-AC". The guide does not say in
      so many words that the 600 W and EX-PWR-930-AC supplies are accepted in place of the minimum, so
      this model's bays take every supply at or above its minimum and a configuration seats the one shipped.
  airflow:
    confidence: datasheet
    note: >-
      Guide, Airflow Direction in the EX4200 Switch Chassis and Figure 16: the fan tray "provides side-to-rear
      chassis cooling"; the datasheet gives 20.3 cfm. The chassis airflow enumeration has no side-to-rear,
      so `side` is written, the nearest answer; there is no back-to-front build and no handle colour to
      follow.
  power:
    confidence: datasheet
    note: >-
      Guide Table 9: the 320 W supply of this model leaves a 130 W PoE budget for its 8 PoE ports, at
      up to 15.4 W each (up to 18.6 W with enhanced PoE from Junos OS 11.1). The guide and the datasheet
      give no typical or maximum draw of the switch itself.
  colour:
    confidence: estimated
    note: >-
      The datasheet photograph shows a black face with a navy top strip: the strip reads #191f32 (median
      of 800 px) and the lower plate #504e57 where a highlight crosses it. The face is drawn #2b2f3d,
      between the two. The supply and fan faces are a tone lighter and are estimated; no photograph of
      the rear is held.
  interface-names:
    confidence: datasheet
    note: >-
      Not printed and not modelled. The guide's examples name the network ports ge-0/0/0 and up, the uplink
      module's ports ge-0/1/0 and up, and the Virtual Chassis ports vcp-0 and vcp-1. No table gives the
      numbering rule for every model, so the names stay out of the file as a block and go here.
  lifecycle:
    confidence: estimated
    note: >-
      Searched on 2026-10-23. Juniper's own milestones page was not reachable; third-party trackers (eol.network,
      parkplacetechnologies.com, relutech.com, serviceexpress.com) and resellers give an end-of-life announcement
      of 2019-02-01 for the EX2200, EX3300, EX4200, EX4500 and EX4550, last order 2019-06-30 and last
      day of support 2024-06-30. The 2019 dates are written, from a tracker and not from the maker.
  other-faces:
    confidence: drawing
    note: >-
      No source draws the top, bottom or sides flat: the guide's figures show them in perspective with
      mounting holes in the sides and a protective earthing terminal on a side panel. Each carries an
      `empty` sentence.
attrs:
  physical:
    weight: >-
      16.5 lb (7.5 kg) with the 320 W AC supply (datasheet); 16-18 lb (7.2-8.2 kg) with one supply (guide
      Table 3)
    weight-chassis-parts: >-
      320 W AC and 190 W DC supplies 2.5 lb (1.1 kg); 600 W and 930 W AC supplies 3.1 lb (1.4 kg) (guide
      Table 3)
    depth-with-large-psu: >-
      489 mm (19.25 in, 48.9 cm) with a 600 W or 930 W AC supply (guide Table 3); 18.8 in (47.8 cm) in
      the datasheet
    datasheet-dimensions: >-
      17.41 x 1.72 x 16.43 in (44.21 x 4.32 x 41.73 cm) W x H x D; the guide's Table 3 is used for the
      envelope
    width-with-brackets: 482 mm (19 in, 48.2 cm) with the mounting brackets attached
  performance:
    switching-capacity: 88 Gbps packet switching, 216 Gbps aggregate, 64-byte packets (datasheet)
    throughput: 65 Mpps wire speed (datasheet)
    mac-addresses-max: 32000
    vlans-max: 4096
    airflow-cfm: 20.3 (datasheet)
  power:
    poe-ports: 8
    poe-budget-w: 130
    psu-redundancy: one supply carries a fully loaded chassis; a second gives redundancy (datasheet)
  thermal: {airflow-direction: 'side to rear (guide, Figure 16)'}
  environmental:
    acoustic-noise: 51.6 dBA with the 320 W AC supply (datasheet, ISO 7779 at 23 C)
    operating-temp: 0 to 45 C (32 to 113 F)
    storage-temp: -40 to 70 C
    humidity: 10 to 85 percent noncondensing operating; 0 to 95 percent non-operating
    altitude: up to 3049 m operating (10,000 ft); 4877 m non-operating
  platform: {cpu: 1 GHz PowerPC, memory: 1 GB DRAM with ECC, storage: 1 GB flash}
  features:
    virtual-chassis: up to 10 members over the 128 Gbps backplane; two rear Virtual Chassis ports
    uplink-module: >-
      one slot; EX-UM-4SFP, EX-UM-2X4SFP, EX-UM-2X4SFP-M or EX-UM-2XFP (not part of the shipping configuration)
    poe: IEEE 802.3af on the first eight ports, 15.4 W each, up to 18.6 W with enhanced PoE
  management:
    console: RJ-45 on the rear
    oob: >-
      RJ-45 management port on the rear, 100 Mbps full duplex, with link/activity and status lamps
    lcd: 2 lines of 16 characters with Menu and Enter buttons
    usb: one USB port on the rear
  compliance:
    nebs: >-
      NEBS certified (datasheet Table 1 marks the -24T, -48T, -24F and DC models; its compliance section
      says all models except EX4200-24P and EX4200-48P)
    safety: UL 60950-1, C-UL, TUV/GS EN 60950-1, CB IEC 60950-1
    emc: FCC 47 CFR Part 15 Class A, EN 55022 Class A, ICES-003, VCCI Class A
  lifecycle: {eol: announced, eol-announcement: 'https://eol.network/juniper/ex', end-of-sale: '2019-06-30',
    end-of-life: '2024-06-30'}
chassis: {width: 438.2, height: 44.45, depth: 431.8, ru: 1, color: '#2b2f3d', airflow: side, power: ac}
gaps:
- what: rear-photograph
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    A straight-on photograph of the rear. The maker's image library returned 404 for every EX4200 address
    tried, so the rear is read off the low-resolution callout figure and the supply and fan art follows
    the isometric drawings.
- what: front-photograph
  scope:
  - front
  reason: needs-photo
  wanted: >-
    A straight-on studio photograph of the front. The datasheet's photographs are perspective views from
    above, so the vertical positions carry a 4.5 percent foreshortening and every front position is estimated.
- what: dc-front-legends
  scope:
  - front
  reason: needs-photo
  wanted: >-
    What the -DC build prints on its model plate. The guide shows the same front for it and the datasheet
    photographs are of the PoE builds. Because the build gives no PoE, the `dc` face is drawn without
    the "8PoE" legend and with white numerals; the "EX4200" line is kept.
- what: side-earthing-terminal
  scope:
  - left
  - right
  reason: needs-drawing
  wanted: >-
    Where the two-hole protective earthing terminal sits on the side panel and its hole pitch; the guide
    names it on a side panel and draws no side elevation.
- what: rack-ears
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    The bracket positions of the front, centre and rear mounting and of the 2-in-recess brackets: no figure
    in the guide measures them, so no ear position or kit is listed.
- what: lcd-component
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    A library component for an LCD display; the LCD panel is a decor rectangle until one exists.
- what: uplink-modules
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    The EX-UM-4SFP, EX-UM-2X4SFP, EX-UM-2X4SFP-M and EX-UM-2XFP uplink modules and their ports, left for
    a later uplink-module slice; the bay takes only the cover panel here.
- what: fan-power
  scope:
  - rear
  reason: vendor-silent
  wanted: 'The fan tray''s power draw: neither the guide nor the datasheet states it.'
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g}
    description: >-
      The 24 built-in 10/100/1000BASE-T ports; the first eight (0 to 7) are PoE ports. rel-pos carries
      the number printed on the faceplate; the upper jack of a column takes the even number
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      how the switch is reached out of band - the RJ-45 console port, the management Ethernet port and
      the USB port on the rear
  lcd-buttons: {term: Button, role: management, index-origin: 0, description: the LCD panel's Menu and
      Enter buttons}
  status-leds: {term: LED, role: indicator, index-origin: 0, description: the three chassis status lamps
      right of the LCD panel}
  temp-leds: {term: LED, role: indicator, index-origin: 0, description: the temperature shutdown lamp
      on the rear panel}
  uplink: {term: Slot, role: traffic, index-origin: 0, description: the front-panel uplink module slot}
  vcp:
    term: Port
    role: traffic
    index-origin: 0
    description: >-
      The two rear Virtual Chassis ports, VCP-0 and VCP-1, 68-pin connectors for the Virtual Chassis cable
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: n+0
      redundancy-note: >-
        Hardware guide, EX4200 Cooling System: one fan tray with three fans, "load-sharing redundancy
        that can tolerate a single fan failure at room temperature (below 45 C) to still provide sufficient
        cooling"; the tray itself has no spare
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: n+n
      redundancy-note: >-
        Hardware guide, Power Supply in EX4200 Switches: an internal redundant power supply, so a second
        supply in the other slot makes the power fully redundant; one supply carries the switch
  esd: {term: Point, role: furniture, index-origin: 0}
  furniture: {term: Item, role: furniture, index-origin: 0}
