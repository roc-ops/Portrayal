  reason: >-
    Photo-measured on the QFX10002-36Q, which has the same cages, and drawn alike in the 72Q's own Figure
    12; see provenance.stack-orientation. In the 36Q front photograph both cages of a column are the same
    way up - the dark module bar sits high in each opening - and their bars are 15.5 mm apart, what two
    cages the same way round give, where a turned lower cage would give about 17.4 mm. No photograph of
    the 72Q was found, so for this model the reading is carried from the 36Q and from Figure 12, and is
    estimated.
provenance:
  sources:
    confidence: datasheet
    note: >-
      QFX10002 Switch Hardware Guide, Juniper Networks, published 2026-02-11 (PDF, 214 pages; copyright
      Juniper Networks, all rights reserved, read here as data and nothing copied). Taken from it - Tables
      1, 2 and 3 (product numbers, port capacities, spare numbers), Tables 4 and 5 and the redundancy
      text (power supply bays), Tables 11 and 12 (port groups and which ports take 100 GbE), Tables 13
      to 16 and 18 and 19 (lamps), Tables 17, 20, 21, 24 and 25 (modules and power), Tables 29 and 30
      (environment and physical specifications), Table 45 (what ships), and Figures 2, 4, 12 and 17 to
      23. Figure 12 (g050366) is the flat front elevation of the 72Q, Figure 21 (g050373) the management
      panel callouts, Figure 4 (g050372) the flat rear elevation of the 72Q. THE 72Q HAS NO STUDIO PHOTOGRAPH:
      Juniper's image-library addresses qfx10002-72q-front-high and qfx10002-72q-rear-high were tried
      once each and returned an HTML 404 page. The 36Q photographs (qfx10002-36q-front-high and -rear-high,
      which share the management panel, the cages and the rear panel) were used to check what is printed
      and how it is coloured. The HPE PSNow datasheet a00150807enw was tried once and the transfer failed,
      so no datasheet is cited and no figure comes from one. The NetBox community elevations of the 36Q
      were used only to count and are not the maker's. The held intake folder of earlier work was not
      readable from the account that built this device, so none of it was used. No mechanical drawing,
      3D model or Visio stencil of the QFX10002 was found in the sources that could be read.
  gate-1:
    confidence: measured
    note: >-
      Both flat figures pass at low resolution. Figure 12 (g050366, 1505 x 591 px, embedded image extracted
      from the PDF) gives a frame 1469 px wide (x 6.5 to 1475.5) and 293.5 px tall (y 149.5 to 443.0),
      aspect 5.005 against the stated 441.0 / 88.0 = 5.011, 0.1 percent out. Scaled on the width it is
      3.331 px per mm across and 3.335 down. The cage pitch then reads 19.0 mm over the groups, the 19.0
      mm of the QSFP ganged registry entry, a quantity the scale never saw. Figure 4 (g050372, rear, body
      1464 x 294 px) is 0.7 percent out the other way, 3.320 px per mm across and 3.341 down. Positions
      are taken per axis on those scales and read to about half a millimetre.
  envelope:
    confidence: datasheet
    note: >-
      Table 30, Physical Specifications for the QFX10002: 3.46 in. (8.8 cm) high, 17.36 in. (44.1 cm)
      wide, 31 in. (78.7 cm) deep "without handles for fans or power supplies". The height is carried
      as 88.0 mm, the 8.8 cm of the table (3.46 in. is 87.9 mm), 2RU. The face is the body between the
      folds with no ears drawn. The installation text gives 19 in. (48.26 cm) over the front mounting
      brackets. The depth 787.0 mm is the 78.7 cm of the table. The table gives the 72Q 68.6 lb (31.1
      kg) with four AC supplies and three fans, and 67.8 lb (30.8 kg) with DC supplies. The install topic
      gives the same figures, so no weight disagrees.
  ports:
    confidence: drawing
    note: >-
      Figure 12 and Table 11, counted - 72 QSFP+ cages in four rows of 18 columns: two bands, each two
      rows of 18 columns in six groups of three, each group one six-port (6XQSFP+) cage, with a 5.65 mm
      gutter between groups (the 62.65 mm group step less three 19.0 mm columns) carrying a column of
      hexagonal vent holes. Cells sit on the registry's 19.0 mm ganged QSFP pitch. The first column's
      left edge is at 8.19 mm. The upper band's rows are at 11.4 and 27.4 mm and the lower band's at 52.3
      and 68.3 mm (row step 16.0 mm, which leaves 6.4 mm between a cage's bottom edge and the next cage's
      top for the lamp strip). The lower band is the 36Q's row positions exactly. Figure 12 sits 3 px
      (0.9 mm) further right inside its frame than the 36Q's Figure 19 does, for the cage block and the
      management panel alike, and each device is measured on its own figure. Counts confirmed by Table
      11.
  port-numbering:
    confidence: drawing
    note: >-
      Figure 12 prints 0, 6, 12, 18, 24, 30 and 34 above the upper row of the upper band and 1, 7, 13,
      19, 25, 31 and 35 below it, and 36, 42, 48, 54, 60, 66 and 70 above the lower band's upper row and
      37, 43, 49, 55, 61, 67 and 71 below it. Each column holds the even port above the odd one and the
      ports run left to right, and the upper band holds 0 to 35 and the lower band 36 to 71. THE 36Q PHOTOGRAPH
      PRINTS FEWER NUMBERS THAN ITS DRAWING (only 1, 34 and 35 - see the 36Q's port-numbering), so the
      72Q may print fewer than Figure 12 draws. With no photograph of the 72Q, Figure 12 (guide page 25),
      the maker's drawing, is the evidence and is followed, so the confidence is drawing, with that risk
      noted. Numbering starts at 0, as the guide's CLI examples count (port 0 to port 71). Interface names
      are not printed on the metal and the guide does not state them, so none is carried.
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md) turns the lower cage of a belly to
      belly pair by 180 degrees. It is not applied here, because the 36Q photograph shows both cages of
      a column the same way up (the dark module bar high and the silver latch low in each opening, 15.5
      mm apart) and Figures 7, 12 and 19 of the guide draw both rows alike. No photograph of the 72Q exists,
      so the reading is carried from the 36Q, whose cages and panel art the 72Q shares, and is estimated.
      The lamp strip lies between the rows.
  port-leds:
    confidence: datasheet
    note: >-
      Figure 17 and Table 13 - each QSFP+ port has one bicolour LED, "triangle shaped". The strip between
      the two cages of a column draws an up triangle at its left, four small slots and a down triangle
      at its right. The up triangle is the upper port's lamp and the down triangle the lower port's, as
      the triangles point at their ports and as the library's SFP+ stacks draw them. The lamp centres
      are 7.0 mm left and 7.4 mm right of the column centre in the drawing, which the drawing keeps unequal.
      The slots are drawn as one dark plate per column. Table 13 gives the states: green steady is a link
      (all four sub-channels up when channelized), green blinking is activity, slow green is the beacon,
      amber steady is some but not all sub-channels up (Junos 15.1X53-D21 and CPLD 1.16 and later) and
      amber blinking is activity on some sub-channels.
  hundred-gig-marks:
    confidence: datasheet
    note: >-
      Table 11 and the 100-Gbps text - "ports marked with a fine black line underneath the socket" take
      QSFP28 and run at 100 GbE, which disables the two neighbours (Table 12). The line is drawn under
      the lower cage of the first and third column of each group, in both bands, 24 ports in all as the
      table says (1, 5, 7, 11 and so on to 35, then 37, 41, 43, 47 and so on to 71). Figure 12 draws a
      "100G" legend at the left end of each band. The 36Q photograph prints neither the legend nor a visible
      line, so the legend is not drawn and the lines are drawn thin, as the text says and the drawing
      shows.
  mgmt-panel:
    confidence: drawing
    note: >-
      Figure 21 (g050373) callouts 1 to 9 and Figure 12, the same panel as the 36Q's, measured on Figure
      12 per axis. Callout 1 is the em0 RJ-45 (1000BASE-T) management port centred at 393.3, 54.1; callout
      2 the RJ-45 console (CON) at 413.0, 53.9; callout 3 the reset button, a round recess at 412.9, 63.2
      below the console; callout 4 the four status lamps at 425.8 and 430.9 across and 51.9 and 56.9 down;
      callout 5 the em1 SFP management port (MGMT) at 381.3 across and 68.0 down; callout 6 the PTP Ethernet
      SFP port (the drawing labels it ETH, the 36Q photograph PTP) right of it at 396.3; callout 7 the
      PPS SMB at 415.1, 72.5; callout 8 the 10 MHz SMB at 423.1, 72.5; callout 9 the USB port, upright,
      at 431.8, 70.9 with the USB symbol below it. Two small round lamps above the two SFP cages at 393.1
      and 398.9 across and 65.1 down are the SFP port lamps (Table 15 - one link and activity lamp). The
      two cages are 14.25 mm wide on a 15.0 mm pitch. Jack sizes come from the registry; the drawing's
      housing outlines are not used for size.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      sources-disagree, checked on the 36Q photograph because the 72Q has none, and the real device wins
      for everything printed. Figures 12 and 21 print PWR, MAJ, STS and MIN with the word ALARM in a bracket,
      the SFP legends MGMT and ETH, and 10MHz; the 36Q photograph prints PWR, MJR, STA and MNR, the legends
      MGMT and PTP, and 10M, with no bracket and no ALARM. The guide's own text (Table 16) names the lamps
      PWR, STA, MJR and MIN. The silkscreen follows the photograph, on the reading that the 72Q's management
      panel is the 36Q's. Figure 12 draws a laser-radiation label as a white box with printed words at
      the left end of the upper band; the 36Q photograph shows its label yellow, so the plate is drawn
      yellow and its words, which cannot be read at this resolution, are not drawn.
  usb-and-slots:
    confidence: photo-measured
    note: >-
      The guide names no USB revision (Figure 21 callout 9, "USB port"), and the 36Q photograph shows
      a black tongue, which is neither colour the library's skins carry, so the white USB 2.0 skin is
      used and no 3.0 is claimed. The four small slots between the two lamps of each column are drawn
      as one dark plate 9.3 x 2.8 mm (the drawing shows two rows of four), centred 0.3 mm right of the
      column centre.
  rear:
    confidence: drawing
    note: >-
      Figure 4 (g050372, the 72Q) and Figure 5 (g050404, the 36Q), measured per axis from the rear left
      edge (the chassis right side as seen from the front). Power supply bays are 74.1 x 40.6 mm at x
      8.8 and 90.4 across and y 1.7 and 43.5 down. Fan module faces are 81.0 x 81.7 mm at x 172.0, 260.9
      and 349.8 and y 3.7, on an 88.9 mm pitch. The ESD socket is centred at 436.6, 24.1 with the ESD
      symbol below it. Fan numbers 0, 1 and 2 with a fan icon and a lamp are printed at 3.8 mm left of
      each face, the lamp at y 77.9. Power symbols with the digits 0 and 2 are printed at x 86.9 between
      the supply columns and 1 and 3 at x 168.2 between the right column and the first fan, at y 9.0 and
      49.8 (the digits 4.6 mm lower). Two round fixings sit between the supply columns at y 20.8 and 61.4.
      A vertical legend at the left edge reads "AC INPUT:100-240V ~ 60-50Hz 14A" and "DC INPUT:-48V TO-60V
      = 40A (FOR EACH POWER SUPPLY)" in Figure 4.
  rear-photo:
    confidence: photo-measured
    note: >-
      qfx10002-36q-rear-high is labelled as the 36Q and shows four supplies, ACDC 1600W Platinum labels
      on the fan hubs and a legend ending in 14A, which is what Figure 4 prints for the 72Q. It is used
      here for colour, finish, the layout of a supply and the numbering 0 and 1 over 2 and 3, and it agrees
      with Figure 4 on all of them.
  power-supplies:
    confidence: datasheet
    note: >-
      Tables 4 and 5, Table 30 and the redundancy text - the 72Q has four bays numbered horizontally from
      the top left to the bottom right, ships with four 1600 W supplies, and the guide's example output
      lists the supplies as Power Supply 2 and 3 on a 72Q running two. At 220 VAC one supply runs the
      switch and at 110 VAC two are needed. The guide recommends twice what is needed (2N), with feed
      A on supplies 0 or 1 and feed B on 2 or 3, and the remaining slots covered with QFX10002-PWR-BLNK.
      Mixing AC and DC supplies is not supported.
  airflow:
    confidence: datasheet
    note: >-
      Description and Table 17 - every QFX10002 has port-to-FRU airflow (airflow out, AFO, front-to-back):
      air enters through the vents of the port panel and leaves through the FRU panel. The guide lists
      no back-to-front fan module or supply, so the device has no airflow configuration. The module handles
      are gold in the guide's tables and orange in the photograph (the photograph wins; see the module
      contracts).
  mounting:
    confidence: datasheet
    note: >-
      Mounting a QFX10002 in a Rack and Table 45 - a four-post kit ships in the box (two front mounting
      rails, two rear mounting blades, 24 flathead screws) and spare kits are ordered as EX4500-4PST-RMK.
      The rails fit the sides of the chassis (Figure 34) and the front rails may be flush with either
      end of the switch. The rack must have its rails 28 to 31 in. (71.1 to 78.7 cm) apart front to back.
      The guide gives no ear distance in millimetres and no rail drawing that can be measured and says
      the chassis must be supported at all four corners, so no ear position and no kit is written. EX4500-4PST-RMK
      is not listed under chassis.kits here (it is a shared four-post kit and follows in a later slice).
      See the gap rack-mounting.
  grounding:
    confidence: datasheet
    note: >-
      Connect the QFX10002 to Ground and Figure 36 (g050389) - a two-hole protective grounding terminal
      on the chassis, for two 10-32 UNF x 0.25 in. screws and a Panduit LCD6-14BH-L lug. Figure 36 is
      a perspective view that shows it on a side panel, and no flat figure places it, so it is not modelled.
      See the gap grounding-terminal.
  colour:
    confidence: photo-measured
    note: >-
      Median of the bare front face in the 36Q photograph (#c4c5c7 at the left margin, #bebfc1 and #cfcfcf
      near the right). The rear chassis reads #75777a in the rear photograph. The fan faces and the supply
      handles read #ec640e and #f94e16 in the photograph.
  vents:
    confidence: drawing
    note: >-
      Figure 12 - a hexagonal punching above the upper band, between the two bands and below the lower
      band, a column of seven hexagons in each gutter of each band, and fields beside and below the management
      panel. They are drawn as repeating patterns inside simplified outlines and not hole for hole, and
      the stepped outline of the field next to the logo is simplified to two rectangles.
  logo:
    confidence: photo-measured
    note: >-
      The maker's logo at the top right is not drawn. It is reserved as the region logo-zone, 26.0 x 8.0
      mm, read off the 36Q photograph (the logo spans 409.5 to 434.2 across and 1.3 to 7.4 down) and shifted
      0.9 mm with the panel. The model name below it is plain text and is drawn.
  lifecycle:
    confidence: estimated
    note: >-
      Searched 2026-10-22. Juniper's own end-of-life pages (support.juniper.net/support/eol) were not
      read. An aggregator (router-switch.com EOL checker, QFX10002-36Q and -72Q) lists an end-of-life
      announcement of 2025-07-15, end of sale of 2026-01-15 and end of service life of 2031-01-15. It
      is not the maker, and the dates are carried as announced and flagged as unverified against Juniper.
  held-sources:
    confidence: estimated
    note: >-
      The intake folder for the Juniper exqfx documents (COVERAGE.md, SOURCES.md and INVENTORY.md and
      its photographs) is under a path this account cannot read (permission denied), so the check for
      a held photograph, Visio stencil or 3D model could not be made. Only the public sources named above
      were used. If a held model or a 72Q photograph exists it may refine the estimated positions.
attrs:
  physical:
    weight: >-
      31.1 kg (68.6 lb) with four AC supplies and three fan modules fitted; 30.8 kg (67.8 lb) for the
      DC build (Table 30)
    mounting: four-post rack kit in the box; spare kits EX4500-4PST-RMK
  performance:
    throughput: >-
      5.76 Tbps and 2 Bpps of forwarding capacity (Q5 ASICs); 288 x 10 GbE, 72 x 40 GbE or 24 x 100 GbE
      ports (Table 2)
    packet-buffer: deep buffer from hybrid memory cubes (HMC)
  power:
    power-typical-w: 1050
    power-max-w: 1425
    power-envelope: fully-configured
    psu-ac-input: >-
      100 to 127 VAC and 200 to 240 VAC at 50 to 60 Hz, 12.9 A at 100-120 VAC (Table 21); each supply
      has one input
    psu-dc-input: >-
      -48 to -60 VDC rated, -40 to -72 VDC operating range, 40 A maximum; a 40 A breaker is recommended
    psu-redundancy: four bays, 2N recommended; one supply at 220 VAC or two at 110 VAC run the 72Q
  thermal:
    heat-dissipation: 3,583 BTU/hr typical and 4,862 BTU/hr maximum (Tables 21 and 25)
    airflow: >-
      port-to-FRU (airflow out, front-to-back); three 80 W fan modules at 150 CFM each, and fans in the
      supplies
  environmental: {operating-temp: 0 C to 40 C (32 F to 104 F), storage-temp: -40 C to 70 C (-40 F to 158
      F) in the shipping container, humidity: 5 to 90 percent noncondensing; short term 5 to 93 percent,
    altitude: no performance degradation to 1828.8 m (6000 ft)}
  platform:
    cpu: 2.5-GHz quad-core Intel
    memory: 16 GB SDRAM
    storage: two 25 GB SSDs (the hardware inventory text also names a 25 GB NAND flash drive)
    asic: Q5 packet forwarding ASICs with hybrid memory cubes
  features: {timing: 1PPS and 10 MHz SMB connectors and a PTP Ethernet SFP port}
  management:
    oob: MGMT RJ-45 (em0), 10/100/1000BASE-T, and MGMT SFP (em1), 1000BASE-X
    console: RJ-45 console (CON), RS-232
    usb: one USB port
  compliance:
    seismic: Designed to comply with Zone 4 earthquake requirements per NEBS GR-63-CORE, Issue 3
  lifecycle: {eol: announced, eol-announcement: 'https://support.juniper.net/support/eol/product/qfx_series/',
    end-of-sale: '2026-01-15', end-of-support: '2031-01-15'}
chassis: {width: 441.0, height: 88.0, depth: 787.0, ru: 2, color: '#c4c5c7', airflow: front-to-back}
gaps:
- what: datasheet
  scope:
  - front
  reason: vendor-silent
  note: >-
    The HPE PSNow datasheet a00150807enw was tried once and the transfer failed (HTTP/2 stream error),
    so no datasheet is cited and no figure comes from one.
  wanted: the HPE PSNow QFX10002 datasheet, for the bundle part numbers
- what: photograph-72q
  scope:
  - front
  - rear
  reason: needs-photo
  note: >-
    The 72Q studio photographs (qfx10002-72q-front-high and -rear-high, tried once each) returned an HTML
    404 page, so the 72Q has no studio photograph. What it prints, its colour and its cage orientation
    are read from the guide's figures and from the 36Q photographs, which share the panel art.
  wanted: straight-on photographs of the QFX10002-72Q
- what: rack-mounting
  scope:
  - left
  - right
  reason: vendor-silent
  note: >-
    The guide's four-post procedure names no ear distance in millimetres and draws the rails only in perspective
    (Figures 33 to 35), so no ears position is written, and the spare kit EX4500-4PST-RMK is left out
    of chassis.kits in this slice.
  wanted: the rail drawing and ear distances, and the four-post kit as a kit contract
- what: grounding-terminal
  scope:
  - left
  - right
  reason: needs-drawing
  note: >-
    The two-hole protective grounding terminal is shown in perspective on a side panel in Figure 36 and
    no flat view places it, so it is not placed. The guide states the screws (10-32 UNF x 0.25 in.) and
    the lug (Panduit LCD6-14BH-L) but not the hole spacing.
  wanted: a flat side elevation with the terminal, and its hole spacing
- what: dc-connector-3w3
  scope:
  - psu-0
  - psu-1
  - psu-2
  - psu-3
  reason: needs-drawing
  note: >-
    The DC supply takes a D-sub 3W3 connector and the library has no 3W3 standard, so the DC supply draws
    the shell in its skin and offers no seat for the cable plug.
  wanted: a D-sub 3W3 connector in the connector registry
- what: console-lamp
  scope:
  - con
  reason: vendor-silent
  note: >-
    The text under Figure 21 says "the LED below the port indicates status and link" for the console,
    but no figure draws such a lamp: below CON is the reset button (callout 3). No console lamp is placed.
  wanted: a close-up of the management panel
- what: sfp-lamp-assignment
  scope:
  - led-mgmt-sfp
  - led-ptp-sfp
  reason: vendor-silent
  note: >-
    Table 15 gives one link and activity lamp for the SFP management port and the guide does not say which
    of the two lamps above the cages belongs to which cage. Each is tied to the cage under it, left to
    left.
  wanted: the lamp assignment of the two SFP ports
- what: supported-optics
  scope:
  - qsfp-0-35
  - qsfp-36-71
  - mgmt-sfp
  - ptp-sfp
  reason: vendor-silent
  note: >-
    The guide lists in prose what each port takes (QSFP+, QSFP28, DAC, AOC and breakout cables) but no
    transceiver table, so the port groups declare no interface.
  wanted: the QFX10002 transceiver list from the Hardware Compatibility Tool
- what: rear-label
  scope:
  - rear
  reason: vendor-silent
  note: >-
    Figure 4 draws a narrow vertical plate near the right edge below the ESD point, x 432 to 440 and y
    47 to 65, that the guide does not name. It is not drawn.
  wanted: the name of that plate (a serial number label?)
groups:
  qsfp-0-35:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp, speed: 40g}
    description: >-
      The upper band, 36 QSFP+ ports numbered 0 to 35, the even port above the odd. All run at 40 GbE
      by default; ports 1, 5, 7, 11, 13, 17, 19, 23, 25, 29, 31 and 35 (a thin line under them) take QSFP28
      at 100 GbE and disable their two neighbours; ports 0 and 3 of each six-port cage channelize a group
      of three to 10 GbE
  qsfp-36-71:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp, speed: 40g}
    description: >-
      The lower band, 36 QSFP+ ports numbered 36 to 71, the even port above the odd (rel-pos carries the
      printed number, since the origin token cannot express a block that starts at 36). Ports 37, 41,
      43, 47, 49, 53, 55, 59, 61, 65, 67 and 71 (a thin line under them) take QSFP28 at 100 GbE and disable
      their two neighbours
  qsfp-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      One bicolour triangle lamp for each port, in the strip between the rows of a band - the up triangle
      for the upper port and the down triangle for the lower (Table 13)
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      reaching and restarting the switch - the RJ-45 management port, the RJ-45 console, the SFP management
      port, the USB port and the reset button
  mgmt-leds: {term: LED, role: indicator, index-origin: 0, description: the link and activity lamps of
      the two SFP ports (Table 15)}
  timing:
    term: Port
    role: management
    index-origin: 0
    mixed: the timing block - the PTP Ethernet SFP port and the 1PPS and 10 MHz SMB connectors
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the four chassis status lamps PWR, STA, MJR and MNR (Table 16)
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: n+n
      redundancy-note: >-
        Four bays, numbered across from the top left, all filled. One supply runs the 72Q at 220 VAC and
        two at 110 VAC, and the guide recommends twice what is needed, "also called 2N" (QFX10002 Component
        Redundancy), with feed A on supplies 0 or 1 and feed B on 2 or 3
    description: the four power supply bays (Table 4)
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy-note: >-
        Cooling System and Airflow - "Each fan module is a redundant unit containing two fans" and "All
        fan modules must be installed for optimal operation of the switch". The guide says how long the
        switch runs with one module out (30 seconds) and not how many it can lose, so no n+1 form is written.
        A removed module raises a minor alarm
  fan-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: ok, color: '#22c55e'}
    - {name: fault, color: '#f59e0b'}
    description: >-
      The ST lamp on the chassis at the left of each fan module slot - green steady means the module is
      present and operating normally, amber steady means it is absent or has failed (Tables 18 and 19)
  esd: {term: Point, role: furniture, index-origin: 0, description: the rear wrist-strap ESD point (Figure
      4 callout 3)}
  furniture: {term: Item, role: furniture, index-origin: 0, description: the front laser-radiation warning}
