description: >-
  Juniper QFX10002-72Q, a fixed 2RU deep-buffer spine and core switch with 72 QSFP+ ports in four rows
  of 18. Every port runs at 40 GbE by default, 24 of them (every second and sixth cage position of each
  six-port cage) take QSFP28 and run at 100 GbE, and any group of three can be channelized to twelve 10
  GbE interfaces with breakout cables. The management panel at the right of the front has an RJ-45 management
  port, an RJ-45 console, an SFP management port, an SFP PTP Ethernet port, 1PPS and 10 MHz timing connectors,
  a USB port and four status lamps. The rear has four 1600 W power supply bays, all filled, three fan
  modules and an ESD point. Cooling is port-to-FRU (front-to-back) only. The AC, the DC and the spare
  chassis builds are configurations.
