configurations:
  ac:
    kind: orderable
    description: >-
      The QFX10002-72Q as shipped (Table 1 and Table 30): four 1600 W AC supplies and three fan modules,
      all with port-to-FRU airflow.
    default: true
    power: ac
    part-numbers:
      QFX10002-72Q: {}
  dc:
    kind: orderable
    description: >-
      The DC build QFX10002-72Q-DC (Table 1): four 1600 W DC supplies. Mixing AC and DC supplies in one
      chassis is not supported.
    power: dc
    bays: {psu-0: juniper/qfx10002-jpsu-1600w-dc-afo@1, psu-1: juniper/qfx10002-jpsu-1600w-dc-afo@1, psu-2: juniper/qfx10002-jpsu-1600w-dc-afo@1,
      psu-3: juniper/qfx10002-jpsu-1600w-dc-afo@1}
    part-numbers:
      QFX10002-72Q-DC: {}
  s:
    kind: orderable
    description: >-
      The spare chassis QFX10002-72Q-CHAS-S (Table 3). The guide lists the chassis, the fan module and
      the supplies as separate spares and does not say what a spare chassis ships with, so it is read
      as the chassis alone with every bay open (estimated). It takes either feed once supplies are fitted.
    power:
    - ac
    - dc
    bays: {psu-0: '', psu-1: '', psu-2: '', psu-3: '', fan-0: '', fan-1: '', fan-2: ''}
    part-numbers:
      QFX10002-72Q-CHAS-S: {}
