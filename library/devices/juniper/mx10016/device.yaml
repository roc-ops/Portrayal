format: 1
kind: device
name: mx10016
version: 4.0.0
maturity: modelled
manufacturer: Juniper
model: MX10016
portfolio:
  line: MX Series
  family: MX10000 Universal Routing Platform
description: >-
  Juniper MX10016 - the 21RU, sixteen-slot flagship of the MX10000
  family. Two JNP10K-RE1 Routing and Control Boards under the badge
  strip beside the status lamp panel; sixteen full-width line-card
  slots (FPC 0-15) in four banks of four. The rear is a full-height
  ten-slot PSU column beside two full-height fan trays covering the
  Switch Fabric Boards.
profile: networking
provenance:
  sources:
    note: >-
      MX10016 Hardware Guide, the MX10008/MX10016 5G datasheet, the front studio photograph and
      the rear line drawing g050702
  chassis:
    confidence: datasheet
    note: >-
      datasheet-table - 36.6 x 17.4 x 35 in (930 x 442 x 889 mm), 21U; flange extends the rack
      face to 19 in. Ears NOT MODELLED by convention
  front:
    note: >-
      photo - the front photograph proportioned per-axis against the 442 mm body: badge strip
      0-14, RCB slots at y 14.0 and 52.1 (1.5 in slot height as the family), service band to y
      110.2, then four four-slot banks on a 48.4 mm pitch with 7 mm dividers; positions
      approximate to ~3 mm on this tall face
  slot-numbering:
    note: >-
      guide - FPC 0-15; drawn top-down to match the family convention (no legible slot print in
      any source - see gaps)
  rear:
    confidence: drawing
    note: >-
      drawing - g050702 (isometric, fractions only): one full-height column of ten JNP10K-PWR
      supplies at the left, two full-height fan trays right. Base configuration ships five
      supplies; all ten bays are drawn. Each supply bay is 91.4 x 88.9 mm, the JNP10K-PWR-AC2 as the
      guide's Table 39 gives it (3.6 in. wide, 3.5 in. high; guide page 107), and the ten stand one
      above the next with no gap, as Figure 2 draws them, the earthing terminal's strip below PSU 9.
      The bays were 84.0 x 91.0 mm, spread over the fan trays' height. The guide's Table 7 gives the fan
      trays 6.6 in. (16.8 cm, about 167.6 mm) wide and 36.6 in. (92.97 cm) high (guide pages 32 to
      33), and juniper/jnp10016-fan@2 and juniper/jnp10016-fan2@2 are drawn at that size; juniper/jnp10016-fan@1
      and juniper/jnp10016-fan2@1, 176 x 924 mm from the drawing, are kept for a saved rack that
      names them. The two fan bays are 167.6 x 929.6
      mm and stand against the supply column and against each other, centred in the 930 mm height (y
      0.2). 91.4 + 2 x 167.6 mm is 426.6 mm of the 442 mm body, and no figure shows the other 15.4
      mm, so it is left empty at the right edge, an estimate
  power:
    confidence: datasheet
    note: >-
      datasheet-table - JNP10K-PWR-AC2 5.5 kW each as the family guides; the AC/AC3/DC variants
      are gaps. The MX10008/MX10016 datasheet states typical power consumption 23 kW, fully
      loaded, naming no ambient or side - carried as power-typical-w. The guide works an example
      of 28,000 W for sixteen MX10K-LC2101 in a redundant configuration (5200 W + 22,800 W) - a
      sample, not carried
  color:
    note: >-
      photo - dark grey chassis, silver card faces, light-blue levers (as the family)
  other-faces:
    note: >-
      near-blank by evidence - rail bands estimated; axis conventions per viewer3d.js as the
      siblings

attrs:
  physical:
    weight-empty-kg: 99.79
    weight-base-kg: 236.78
  power:
    power-typical-w: 23000
    power-envelope: fully-configured
    power-typical-scope: datasheet - typical, fully loaded (MX10008/MX10016
      datasheet); no ambient or side named
chassis:
  width: 442.0
  height: 930.0
  depth: 889.0
  ru: 21
  color: '#565b61'
gaps:
  - what: rcb-which-board
    scope: [res]
    reason: needs-photo
    wanted: >-
      a photograph of a real RCB's model label. The board in this chassis's own photographs
      carries four SFP cages numbered 0-3 and no BITS, ToD, RESET or Online/Offline
      hardware, which matches neither Juniper faceplate figure - not Figure 46 (JNP10K-RE1
      family, two reserved XGE cages) nor Figure 45 (JNP10K-RE3 family).
      juniper/jnp10k-re1@2 follows the figure it is named for; the detail is in
      provenance/which-board-the-photographs-show on that contract. The label does not
      resolve at the scale of any photograph held here.
  - what: rear-photo
    reason: needs-photo
    wanted: a photograph of the rear - only the isometric drawing g050702
      exists, so PSU column and fan geometry are fractional readings.
  - what: psu-variants
    scope: [psus]
    reason: needs-photo
    wanted: the JNP10K-PWR-AC (first generation), AC3 and DC faces; only
      AC2 is modelled.
  - what: psu-ac2-face
    scope: [psus]
    reason: needs-photo
    wanted: >-
      a flat figure or square-on photograph of the JNP10K-PWR-AC2 face; the guide gives its outer
      size (Table 39) and isometric drawings, so juniper/jnp10k-pwr-ac2@2 refits the face of
      version 1 to 91.4 x 88.9 mm by estimate
  - what: line-card-catalogue
    scope: [fpcs]
    reason: needs-photo
    wanted: the LC9600 is not listed for the MX10016 in the extracted
      guide (LC2101/LC480 are), so the accepts list stays narrow; a
      compatibility table would widen it.
  - what: slot-label-print
    scope: [fpcs]
    reason: needs-photo
    wanted: legible FPC slot labels - top-down 0-15 follows the family
      convention.
  - what: sfb-bays
    reason: needs-photo
    wanted: the switch fabric boards (JNP10016-SF, JNP10016-SF2) and their cover
      (JNP10016-SF-BLNK) sit mid-chassis behind the fan trays, where no face shows
      them. Vendor count is five boards and one cover on the base and six boards on
      the redundant configuration; none is drawn.
groups:
  res:
    term: Slot
    role: service
    index-origin: 0
    description: Routing and Control Board slots CB0 and CB1
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - mx10016 hardware guide, "MX10016 Component Redundancy": one RCB in the base configuration, two in the redundant one; with two fitted one is primary and the other backup, and the backup takes over if the primary or any part of it fails. The RCB consolidates the Routing Engine function with the control plane function in a single unit, so this one form covers both'
  fpcs:
    term: Slot
    role: traffic
    index-origin: 0
    description: line-card slots FPC 0-15, numbered top-down
  psus:
    term: PSU
    role: service
    index-origin: 0
    description: ten power supply slots, one full-height stack at the
      rear left (five populated in the base configuration)
    attrs:
      redundancy: 'n+1'
      redundancy-note: 'n+1 - size for a non-redundant system and add one supply for redundancy (2n source redundancy on the feeds)'
  cooling:
    term: Tray
    role: service
    index-origin: 0
    description: two full-height fan trays; SFBs sit behind them
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the chassis status lamp panel beside the RCBs
