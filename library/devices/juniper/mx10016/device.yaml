configurations:
  base:
    kind: base
    source: >-
      vendor - Juniper publishes this as an orderable bundle. The hardware guide's
      'MX10016 Components and Configurations' table (MX10016-BASE) lists one RCB, five
      power supplies with five power supply slot covers, and sixteen line-card covers,
      over the note that line cards and the cable management system are not part of the
      base configuration. This base draws exactly that: one board in RCB slot 0, five
      supplies and a cover in each of the other five supply slots, and a cover in each of
      the sixteen line-card slots. The table lists no cover for the second RCB slot and no
      part number for the supply covers; the slot is covered with JNP10K-RE-BLNK, named
      for the same cage in the MX10004 guide, and the supply covers are JNP10K-PWR-BLNK,
      named in the same guide. The five switch fabric boards and their cover
      (JNP10016-SF-BLNK) sit inside the chassis, not visible from outside, and no bay for
      them is drawn.
    default: true
    description: >-
      The chassis as Juniper ships MX10016-BASE. One routing and control board with a
      cover over the second slot. Five power supplies with a cover over each of the
      other five, fans, and a cover in each of the sixteen line-card slots. Line cards
      are ordered separately.
    bays:
      cb1: juniper/jnp10k-re-blnk@1
      psu5: juniper/jnp10k-pwr-blnk@2
      psu6: juniper/jnp10k-pwr-blnk@2
      psu7: juniper/jnp10k-pwr-blnk@2
      psu8: juniper/jnp10k-pwr-blnk@2
      psu9: juniper/jnp10k-pwr-blnk@2
      fpc0: juniper/jnp10k-lc-blank@1
      fpc1: juniper/jnp10k-lc-blank@1
