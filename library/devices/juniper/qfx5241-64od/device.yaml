format: 1
kind: device
name: qfx5241-64od
version: 0.1.2
maturity: modelled
manufacturer: Juniper
model: QFX5241-64OD
portfolio: {line: QFX Series, family: QFX5240}
description: >-
  Juniper QFX5241-64OD, a 2RU 800G data-centre spine switch running Junos OS Evolved, the sibling of the
  QFX5240-64OD with its own AC and DC builds. It has 64 OSFP ports (800 GbE) in sixteen columns of four,
  in four groups of four columns, and two SFP ports (10 GbE), with a lamp beside each network port. The
  port side also carries the RJ-45 management, console and time-of-day ports, a USB port, the reset button,
  the three chassis lamps, the 1 PPS and 10 MHz connectors. The rear carries two 3000 W power supplies
  stacked at the left and four front-to-back fan modules. It ships as one front panel in an AC and a DC
  airflow-out build, and as a spare chassis with no supplies and no fan modules. Its sibling with QSFP-DD
  cages is the QFX5241-64QD.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      QFX5241-64OD and QFX5241-64QD Switches Hardware Guide, published 2026-09-28, 223 pages (Hewlett
      Packard Enterprise, for Juniper Networks), from https://www.juniper.net/documentation/us/en/hardware/qfx5241-64odqd/qfx5241-64odqd.pdf:
      the front and rear figures 4 to 10, the port panel figures 12 to 15 and Table 10 (lamps), Table
      4 (variants), Tables 6 to 8 (power and cooling), Table 9 (physical specifications) and figures 21
      and 22 (the AC and DC FRU panels). The QFX5241-32OD Switch Hardware Guide, published 2026-10-11,
      199 pages, from https://www.juniper.net/documentation/us/en/hardware/qfx5241-32od/qfx5241-32od.pdf,
      for its Table 10 body width of 17.26 in. Juniper's studio photographs of the 64OD, front and rear
      (qfx5241-64od-front-high.jpg, 2100 x 706 px, and qfx5241-64od-rear-high.jpg, 2100 x 692 px, from
      juniper.net's image library). The documents and the photographs are the maker's and public; the
      guides carry a copyright notice and no terms of use beyond it, and the image library page carries
      none, so only facts are transcribed. The QFX5240 line datasheet, which covers the QFX5241, could
      not be fetched: its address redirects to an HPE document server that refused every request made
      for this change, so no figure here is the datasheet's. No Visio stencil, 3D model or mechanical
      drawing is held for the QFX5241. The guide's figures 4 to 6 are line-drawn isometric views and figures
      12, 21 and 22 are flat drawings; the flat drawings are used to count and read and the photographs
      to measure.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 9: 3.46 in (8.78 cm) high, 25.51 in (65 cm) deep and 48.50 lb (22 kg) fully loaded without
      optics, for the -AO and -DO builds alike. The inch figures are used: 87.9 x 648.0 mm. The table
      prints a width of 19.03 in (48.33 cm). That is the width over the front brackets and the rack-face
      width, as the QFX5240 sibling's datasheet and the 32OD guide's Table 10 (17.26 in for the 1U body)
      show; the photograph agrees (see gate-1), so the body is 17.26 in, 438.4 mm, and brackets are not
      modelled.
  gate-1:
    confidence: photo-measured
    note: >-
      The front photograph's body, between the left and right edges, is 1930 px wide and about 396 px
      from the top edge to the bottom lip, an aspect of 4.87 against 438.4 / 87.9 = 4.99 (2 percent out;
      the lower edge is lifted by the photograph's soft shadow). Had 19.03 in been the body width the
      aspect would be 5.5. Scale 4.40 px/mm across, used on both axes with the origin at the left edge
      (x 83 px) and the top edge (y 154 px). The rear photograph's body is 1902 px wide, 4.34 px/mm, which
      includes the soft shadow at its right. The front photograph is the same size and geometry as the
      QFX5240-64OD's (the body 83 to 2012 px against 82 to 2011), so the positions of the QFX5240-64OD
      are carried and each was checked against this photograph.
  ports:
    confidence: photo-measured
    note: >-
      Front photograph: 64 OSFP openings, sixteen columns of four in four groups of four columns. The
      cages abut inside a group on a 23.1 mm pitch (the library's OSFP cage) and a group is 92.4 mm wide;
      the groups stand on a 97.1 mm pitch, 4.7 mm apart. The first cage starts at 8.3 mm. A column holds
      two rows in each of two bands (guide figure 12). The two SFP cages stand to the right of the last
      group, stacked, one above the other (callout 2, 14.5 mm wide).
  row-pitch:
    confidence: photo-measured
    note: >-
      The rows start at 11.4, 26.1, 47.4 and 62.2 mm from the top: 14.7 mm apart in the upper band and
      14.8 mm in the lower, the openings 13.5 mm tall with a thin metal bar between the two rows of a
      band. The two bands are centred about the chassis centre.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed on a strip above the upper band and a strip below the lower band, read off the photograph:
      over each column "N up-arrow ... down-arrow N+1" with N a multiple of four, and under each column
      the same with N+2. So a column holds ports 4c to 4c+3 from the top, the upper band's pair first;
      the SFP pair prints "64 up-arrow" and "down-arrow 65" under it. Interface names are not printed
      and none is stated in the guide, so they are not recorded.
  port-lamps:
    confidence: photo-measured
    note: >-
      Each network port has a single RGB lamp (guide, Network Port LEDs, Table 10): in the photograph
      two dots 2.0 mm across between the two numerals of a column, above the upper band for ports 4c and
      4c+1 and below the lower band for ports 4c+2 and 4c+3, read at 9.8 and 13.6 mm from the left edge
      of the column (estimated to 0.4 mm) and drawn at 9.5 and 13.9 mm, 2.05 mm either side of the cage's
      centre, so that a lamp is plainly not trying to centre on its cage. The lamps are unlit. The photograph
      shows no lamp at the SFP ports, while the guide's Table 13 gives each SFP28 port one link-activity
      lamp; none is drawn.
  mgmt-panel:
    confidence: photo-measured
    note: >-
      Right of the last group, from the top: the model name under the maker's logo, the RJ-45 management
      port with a USB-A port under it in one shield (MGMT, and the USB 3 symbol), the stacked SFP pair
      with 64 and 65 below it, a strip with the legends ID, SYS and ALM above three lamps and the RST
      pinhole, the 1PPS and 10MHz coaxial jacks, the RJ-45 console (CON) and time-of-day (TOD) jacks stacked
      in one shield, and a green serial-number tab at the foot (guide figure 12 callouts 1 to 9). The
      USB tongue is blue in the photograph, which is the USB-IF colour of a 3.0 port, and the guide says
      "USB 3.0 port".
  vents:
    confidence: estimated
    note: >-
      Hexagonal holes in the sheet: a band along the top above the cages, a band along the bottom, a column
      at the left edge, a column at the right edge and a field under the clock connectors. Drawn as vent
      decor in those positions, pitched to the photograph and estimated.
  front-green-tab:
    confidence: photo-measured
    note: >-
      The green tab at the foot of the management panel, 17.0 mm wide and 2.7 mm tall, is the chassis
      serial number pull-out (callout 8 of figure 12). It is drawn as decor, because it is a label card
      and not a part the library models.
  logo:
    confidence: photo-measured
    note: >-
      The maker's logo and its lockup are printed at the upper right of the face, above the model name
      QFX5241-64OD. The logo is not drawn: a logo-zone region is reserved where it stands, and the model
      name is drawn as plain text.
  rear-layout:
    confidence: photo-measured
    note: >-
      Rear photograph at 4.323 px/mm (the body width as on the QFX5240 sibling), checked against the guide's
      figure 21: two supplies stacked at the left end, supply 0 above supply 1, an earthing pad with two
      studs and the ground symbol under them, then four fan modules numbered 0 to 3 from the left on an
      85.7 mm pitch. A fan symbol, the module number and an arrow are printed beside each fan opening,
      and a power symbol with the supply number beside each supply. The fan plates measure 80.3 mm wide
      and 80.0 mm high; the supplies 73.7 mm wide and 39.5 mm high. The photograph is of the AC build.
      The guide's figure 22 (DC FRU panel, flat) draws the DC build with the same bays, fan plates and
      legends and a different supply face; no photograph of the DC build is held.
  earthing:
    confidence: photo-measured
    note: >-
      Two threaded studs 15.5 mm apart on a pad at the left of the rear, under the ground symbol, 6.4
      mm from the left edge, as the QFX5240 sibling's photograph shows and this one repeats.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      The guide's figures 4 to 6 are line drawings of the same chassis; the photograph is followed for
      what is printed. The guide calls the SFP pair "SFP28 ports" in its callouts and text with a speed
      of 10 Gbps; the group is stated at sfp-plus and 10g, as on the sibling. The photograph shows the
      AC supplies' hubs carrying the supply maker's name; it is a third party's logo and is not drawn.
  modules:
    confidence: datasheet
    note: >-
      The four fan modules and the two power supplies are field-replaceable units in bays, each its own
      component (guide Table 8): QFX5240-2U-FANAO and QFX5240-PWR-AC-AO for the AC build, which are the
      QFX5240 components reused as they are, and QFX524X-2RU-FAN-O and QFX524X-2RU-PWR-DO for the DC build,
      which are new. Nothing on this chassis is a built-in unit that is not a bay. Each supply carries
      its own small fan inside.
  variants:
    confidence: datasheet
    note: >-
      Guide Table 4 and the spare chassis table: QFX5241-64OD-AO (AC, airflow out), QFX5241-64OD-DO (DC,
      airflow out) and the spare QFX5241-64OD-CHAS, "Spare chassis without PSUs and fans". They share
      this front panel and the rear bays, so each is a configuration of this device. NOT MODELLED: the
      ORv3 build QFX5241-64OD-DO-T2 and its spare QFX5241-64OD-TCHAS. They are the same switch in a 2
      OU Open Rack V3 switch-tray assembly, 21.14 x 3.65 x 31.71 in and 31.2 kg (Table 9), a different
      envelope that a configuration cannot state, drawn in the guide only in isometric (figure 7), with
      fans and supplies that cannot be changed while operating.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide names the rack mount kit QFX5240-2U-4PRMK (a four-post tool-less kit, Table
      8). The library holds no contract for it and none is written here, so `chassis.ears` and `chassis.kits`
      are left out and a gap says so. The modelled body is the 438.4 mm chassis, without brackets.
  power:
    confidence: datasheet
    note: >-
      Guide, Power System: typical 613 W and maximum 2198 W for the QFX5241-64OD (616 W and 2258 W for
      the 64QD), with 1+1 supplies. AC input: Table 6 says 200 to 240 VAC at 16 A for the QFX5240-PWR-AC-AO,
      3000 W from 215 to 240 VAC and 2800 W from 200 to 214 VAC. DC: Table 6 and Table 17 say -48 to -60
      VDC, 80 A maximum a supply, 3000 W out at 12.2 V.
  colour:
    confidence: photo-measured
    note: >-
      The front plate samples #6e7784 (a bare patch near the left edge, the value the QFX5240-64OD's identical
      photograph gives) and the rear panel #646d79. The chassis colour is the front's. The photographs
      are lit warmly and these are their values, not a paint reference.
  lifecycle:
    confidence: estimated
    note: >-
      The guide, published 2026-09-28, states no end-of-life announcement and none was found. The device
      states none announced. Estimated, because absence in the documents is not a notice from the maker.
attrs:
  physical: {weight-note: 22 kg (48.50 lb) fully loaded without optics (guide Table 9)}
  performance: {throughput: 51.2 Tbps (guide Table 3), breakout-ports: 64 x 800 GbE (guide Table 3), osfp-speeds: 800
      GbE (guide Table 3)}
  power:
    power-typical-w: 613
    power-max-w: 2198
    power-envelope: as-tested
    power-measurement-note: >-
      Typical and maximum power consumption of the QFX5241-64OD, guide Power System section; the guide
      gives no test conditions
    power-input-ac: 200 to 240 VAC, 50 to 60 Hz, 16 A (guide Table 6)
    power-input-dc: -48 to -60 VDC, 80 A maximum a supply (guide Tables 6 and 17)
    redundancy-note: two supplies, 1+1, hot-removable and hot-insertable (guide, Component Redundancy)
  thermal:
    fans: four fan modules of two rotors, N+1 at rotor level; front-to-back only
    airflow-note: >-
      AO is front-to-back (port-to-FRU, airflow out); the guide describes no back-to-front module
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F) (guide Table 22)
    storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container
    humidity: 5 to 90 percent noncondensing, operating
    altitude: >-
      no performance degradation to 1828.8 m (6000 ft) at 0 to 40 C with DAC cables; sea level with optics
      (guide Table 22)
  platform: {cpu: 'Intel Ice Lake D, 4 cores, 2.2 GHz', storage: two internal 480 GB NVMe SSDs, switch-chip: Broadcom
      Tomahawk 5 (BCM78900), software: Junos OS Evolved}
  features:
    optics-osfp: >-
      800 GbE OSFP; ports 1, 2, 5, 6, 9, 10 and so on in the two middle rows take high power optics such
      as 800G-ZR and ZR+ (guide, Ports Panel note)
    optics-sfp-plus: two SFP28 ports at 10 GbE
  management: {oob: one RJ-45 management port, console: one RJ-45 console port, tod: one RJ-45 time-of-day
      port, usb: one USB 3.0 port, timing-outputs: 1 PPS and 10 MHz clock connectors}
  compliance:
    acoustic: 86.02 dBA for the QFX5241-64OD-AO (guide Table 22)
    nebs: >-
      designed to comply with Zone 4 earthquake requirements of NEBS GR-63-CORE, Issue 3 (guide Table
      22)
  lifecycle: {eol: none-announced}
chassis: {width: 438.4, height: 87.9, depth: 648.0, ru: 2, weight-kg: 22, color: '#6e7784', airflow: front-to-back,
  power: ac}
gaps:
- what: datasheet
  scope:
  - front
  - rear
  reason: needs-photo
  wanted: >-
    The QFX5240 line datasheet, which covers the QFX5241. Its address redirects to an HPE document server
    that refused every request made for this change. Nothing here is the datasheet's; the figures are
    the guide's.
- what: osfp-cage-depth
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The depth and the registry size of the OSFP cage. The library's std/osfp has no registry entry and
    carries an estimated depth; the 23.1 by 13.5 mm opening it uses was measured on another maker's 2RU
    box and the photograph here agrees with it.
- what: module-depths
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The depth of the fan module and of the power supplies. The guide's figures 21 to 28 carry no scale
    and its tables state weights only for the whole chassis.
- what: chassis-width
  scope:
  - front
  - rear
  reason: sources-disagree
  wanted: >-
    The chassis width. The guide's Table 9 says 19.03 in (48.33 cm), which is 17.26 in plus the front
    brackets; the 32OD guide's Table 10 says 17.26 in (43.84 cm) for its 1U body, and the QFX5240-64OD
    sibling carries 17.26 in. The body is 17.26 in because the photograph's aspect fits it and 19.03 in
    would not.
- what: dc-photo
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    A photograph of the DC build. The guide's figure 6 is an isometric drawing and figure 22 a flat drawing
    of the DC FRU panel with no scale and no colour, so the DC supply is drawn from figure 22 and estimated.
- what: orv3-builds
  scope:
  - front
  - rear
  reason: needs-drawing
  wanted: >-
    The ORv3 switch-tray assembly QFX5241-64OD-DO-T2 and its spare QFX5241-64OD-TCHAS: 21.14 x 3.65 x
    31.71 in (Table 9), drawn only in isometric (figure 7), a different envelope from this device. Not
    modelled.
- what: sfp-port-type
  scope:
  - front
  reason: sources-disagree
  wanted: >-
    The type of the two small cages. The guide's callout 2 and text call them "SFP28 ports" with a speed
    of 10 Gbps, which an SFP28 cage can run at 25 Gbps. They are modelled as sfp-plus at 10 Gbps as on
    the sibling, and no rate is printed on the metal.
- what: high-power-optics
  scope:
  - front
  reason: sources-disagree
  wanted: >-
    Which ports take high power optics. The guide's note says that only the front-panel ports in the middle
    rows support them (first and fourth rows do not) and lists 1, 2, 5, 6, 9, 10 and so on to 61 and 62,
    which are ports of the second and third rows in a column of four, counting from 0. The note is carried
    in `features.optics-osfp` and the face does not mark those ports, because the metal does not.
- what: management-lamps
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The lamps of the management jack. Guide figure 20 and Table 12 describe lamps on the management port;
    the photograph shows them at the corners of the upper jack. The jack is drawn with the library's lamped
    jack.
- what: sfp28-lamps
  scope:
  - front
  reason: needs-photo
  wanted: >-
    The lamp of each SFP28 port. The guide's Table 13 gives each of the two ports one link-activity lamp;
    neither the photograph nor the guide's figures show where it is.
- what: clock-connector-type
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The connector type of the 1PPS and 10MHz jacks. The guide calls them "clock input and output connectors";
    the photograph shows gold coaxial jacks 6 mm across, drawn as the library's SMA jack. Estimated.
- what: rating-labels
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    The rating label of each supply and the serial number labels (figures 88 to 90). Not drawn.
- what: ears-and-kits
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    The rack ears' positions and the rack kit's contract. The guide names QFX5240-2U-4PRMK and no kit
    contract exists in the library; none is written here.
groups:
  osfp-800g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: osfp, speed: 800g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      Ports 64 and 65 as printed, rel-pos carrying the printed number, since the origin token cannot express
      a block that starts at 64.
  osfp-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: link, color: '#22c55e'}
    - {name: activity, color: '#22c55e', behavior: blinking}
    - {name: fault, color: '#f59e0b'}
    - {name: hardware-failure, color: '#ef4444'}
    description: >-
      One RGB lamp per network port, in the strip above the upper band and below the lower band (guide
      Table 10).
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band cluster at the right of the port side - an RJ-45 console port, an RJ-45 management
      port, an RJ-45 time-of-day port, a USB port and the recessed reset button. Five kinds, one purpose:
      reaching, timing and recovering the switch when the data plane cannot.
  timing:
    term: Port
    role: management
    index-origin: 0
    description: >-
      the 1 PPS and 10 MHz connectors, a pair of coaxial jacks for the switch's timing references
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The three chassis lamps ID, SYS and ALM (guide, Chassis Status LEDs).
  grounding:
    term: Stud
    role: furniture
    index-origin: 0
    description: the protective earthing terminal, a pad with two M6 studs at the left of the rear
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: 3+1
      redundancy-note: >-
        QFX5241-64OD and QFX5241-64QD hardware guide, Component Redundancy: four fan modules of two rotors
        each, N+1 redundancy; the fan modules are hot-insertable and hot-removable
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        two supplies, 1+1; hot-removable and hot-insertable without shutting the switch down (guide, Component
        Redundancy)
