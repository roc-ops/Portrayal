configurations:
  ac-f2b:
    kind: orderable
    default: true
    description: >-
      QFX5241-64OD-AO: two 3000 W AC supplies (QFX5240-PWR-AC-AO) and four front-to-back fan modules (QFX5240-2U-FANAO),
      airflow out (guide Tables 4 and 8).
    part-numbers:
      QFX5241-64OD-AO: {}
  dc-f2b:
    kind: orderable
    power: dc
    description: >-
      QFX5241-64OD-DO: two 3000 W DC supplies (QFX524X-2RU-PWR-DO) and four front-to-back fan modules
      (QFX524X-2RU-FAN-O), airflow out (guide Tables 4 and 8). Each supply has a single feed, so feeds
      A and B go one to each.
    bays: {psu-0: juniper/qfx524x-2ru-pwr-do@1, psu-1: juniper/qfx524x-2ru-pwr-do@1, fan-0: juniper/qfx524x-2ru-fan-o@1,
      fan-1: juniper/qfx524x-2ru-fan-o@1, fan-2: juniper/qfx524x-2ru-fan-o@1, fan-3: juniper/qfx524x-2ru-fan-o@1}
    part-numbers:
      QFX5241-64OD-DO: {}
  chas:
    kind: orderable
    description: >-
      QFX5241-64OD-CHAS, the spare chassis, shipped without power supplies or fan modules ("Spare chassis
      without PSUs and fans"). The supply and fan bays are shown open.
    bays: {psu-0: '', psu-1: '', fan-0: '', fan-1: '', fan-2: '', fan-3: ''}
    part-numbers:
      QFX5241-64OD-CHAS: {}
