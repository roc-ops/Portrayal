configurations:
  ac-f2b:
    kind: orderable
    default: true
    description: >-
      QFX5110-48S-AFO: two 650 W AC supplies (JPSU-650W-AC-AFO) and five front-to-back fan modules
      (QFX5110-48S-FANAFO). All have a Juniper Gold handle and the label AIR OUT or AFO (guide Tables 11 and 13).
    part-numbers:
      QFX5110-48S-AFO: {}
  ac-b2f:
    kind: orderable
    airflow: back-to-front
    description: >-
      QFX5110-48S-AFI: two 650 W AC supplies (JPSU-650W-AC-AFI) and five back-to-front fan modules
      (QFX5110-48S-FANAFI). All have a Juniper Azure Blue handle and the label AIR IN or AFI (guide Tables 11 and 13).
    bays:
      psu-0: juniper/qfx5100-jpsu-650w-ac-afi@1
      psu-1: juniper/qfx5100-jpsu-650w-ac-afi@1
      fan-0: juniper/qfx5110-48s-fanafi@1
      fan-1: juniper/qfx5110-48s-fanafi@1
      fan-2: juniper/qfx5110-48s-fanafi@1
      fan-3: juniper/qfx5110-48s-fanafi@1
      fan-4: juniper/qfx5110-48s-fanafi@1
    part-numbers:
      QFX5110-48S-AFI: {}
  dc-f2b:
    kind: orderable
    power: dc
    description: >-
      QFX5110-48S-DC-AFO: two 650 W DC supplies (JPSU-650W-DC-AFO) and five front-to-back fan modules
      (QFX5110-48S-FANAFO). The front panel is the same.
    bays:
      psu-0: juniper/qfx5100-jpsu-650w-dc-afo@1
      psu-1: juniper/qfx5100-jpsu-650w-dc-afo@1
    part-numbers:
      QFX5110-48S-DC-AFO: {}
  dc-b2f:
    kind: orderable
    power: dc
    airflow: back-to-front
    description: >-
      QFX5110-48S-DC-AFI: two 650 W DC supplies (JPSU-650W-DC-AFI) and five back-to-front fan modules
      (QFX5110-48S-FANAFI). The front panel is the same.
    bays:
      psu-0: juniper/qfx5100-jpsu-650w-dc-afi@1
      psu-1: juniper/qfx5100-jpsu-650w-dc-afi@1
      fan-0: juniper/qfx5110-48s-fanafi@1
      fan-1: juniper/qfx5110-48s-fanafi@1
      fan-2: juniper/qfx5110-48s-fanafi@1
