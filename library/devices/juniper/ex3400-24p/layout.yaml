format: 1
kind: device
name: ex3400-24p
version: 0.1.2
maturity: modelled
manufacturer: Juniper
model: EX3400-24P
portfolio:
  line: EX Series
  family: EX3400
description: >-
  Juniper EX3400-24P, a 1U access switch with 24 10/100/1000BASE-T ports that all supply PoE+. It
  has four SFP or SFP+ uplink ports and a Mini-USB console port on the front. The rear has two QSFP+
  uplink ports, a management port, an RJ-45 console port, a USB port, two fan modules and two power
  supply slots. It ships with one 600 W AC supply, and a blank panel covers the second slot.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX3400 Switch Hardware Guide, Juniper Networks, published 2026-01-09 (317 pages): Tables 1 to 3,
      10 to 13 and 19, Figures 1 to 4 and 7 to 10, the packing list (Table 36) and the mounting
      topics. The only photograph of the EX3400-24P is a top-angle shot (ex3400-24p-frontwtop-high),
      which is not a straight elevation. It is used only to confirm what is printed and to count
      the ports. No straight-on photograph of the 24-port front exists (the EX3400-24T address
      returned a 404), so the front and the rear are read from the EX3400-48P studio photographs
      (ex3400-48p-front-high and ex3400-48p-rear-high), which show the same right-hand block and
      the same rear. The HPE PSNow datasheet (a50014095enw) did not answer from this host, so no
      datasheet figure is used. The guide is copyright Juniper Networks, 2026, all rights reserved,
      and the studio photographs come from the maker's public image library; no terms of use are
      stated on the files. Nothing of either is copied here, since every face is drawn new from
      measurements. End of life was searched on 2026-10-21: only reseller pages for Juniper support
      bundles (the B-EX3400-...-E part numbers, announced 2020 and 2023) came up and no Juniper
      notice for the hardware, so the lifecycle is recorded as none announced.
  chassis:
    confidence: datasheet
    note: >-
      Table 3 - height 1.72 in. (4.37 cm), width 17.4 in. (44.1 cm), or 19 in. (48.2 cm) with the
      mounting brackets attached, depth 13.78 in. (35 cm) with no power supply installed and 15.05
      in. (38.24 cm) with one. The table gives one chassis for the whole family. The body of 441.0
      mm is the metal between the bracket fold lines, and the 43.7 mm height is the metric figure
      as printed. The depth carried is the 350.0 mm of the bare chassis, and the supply adds the
      rest. Weight is 9.97 lb (4.52 kg) without supplies or fan modules.
  scale:
    confidence: estimated
    note: >-
      estimated - there is no straight-on photograph of this front. The ports are placed by
      carrying the EX3400-48P measurement (3.327 px/mm, Gate 1 passed on that photograph) to this
      model: the right-hand block is identical, and the 24 jacks are the last two of the 48-port
      face's four blocks, so they start 177.5 mm after the first block. The top-angle photograph
      puts the first jack column 178 mm left of the uplink cage block against 177.1 mm here, within
      the 1 percent its perspective allows.
  ports:
    confidence: estimated
    note: >-
      Table 1 and Figure 1 give 24 RJ-45 ports in two blocks of 6 columns by 2 rows, and four uplink
      cages. Positions follow the EX3400-48P: a block step of 88.8 mm, the registry's 13.97 mm
      ganged pitch, two rows 14.0 mm apart with the upper row turned 180 so that its keyway and
      lamp tabs face up, as photographed. The four SFP cages start at 363.7 mm and abut on the
      registry's 14.25 mm pitch.
  port-numbering:
    confidence: photo-measured
    note: >-
      The top-angle photograph prints 0 and 1, then 2 and 3, up to 22 and 23 under the column
      pairs, so the upper jack of a column is the even port and the lower the odd one. The guide
      labels the ports 0 through 23. The uplink cages are printed 0 to 3 under the cages on the
      front, and the rear QSFP+ ports 0 and 1. Interface names such as ge-0/0/0 are not printed on
      the metal and are not stated in this guide, so none is recorded.
  port-lamps:
    confidence: datasheet
    note: >-
      Figure 7 - each RJ-45 jack has two lamps, a Link/Activity lamp at the left corner and a Status
      lamp at the right corner of its keyway side. The common/rj45-ganged-eth@1 housing carries both.
      Figure 8 - each SFP+ uplink has a Link/Activity lamp left of its number and a Status lamp right of
      it. The photographs show them as tall light-pipe slots, drawn as common/led-rect@1 turned 90.
      The Status lamp on a jack shows speed, duplex, enabled or PoE state according to the mode
      lamps, so its states are not expressible as one vocabulary here (see gaps).
  status-block:
    confidence: photo-measured
    note: >-
      Figure 5 and Table 4 give the chassis lamps SYS, ALM and MST. Figure 10 and Table 8 give the
      port mode lamps SPD, DX, EN and PoE and the Factory Reset/Mode button that switches them.
      The lamps are read off the EX3400-48P photograph at the right end (x 426.1 and 432.2 mm, y
      5.0 to 18.5 step 4.5). The top-angle photograph of the 24P prints the same four mode legends.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      The guide's Figure 1 draws the printing too small to read, so the photographs win for every
      legend. The top-angle photograph of the EX3400-24P prints "EX3400 PoE+" beside the Junos badge.
  rear:
    confidence: estimated
    note: >-
      estimated - Figure 3 and the EX3400-48P rear photograph, read at 3.327 px/mm across and 3.30
      px/mm down; Table 3 gives one chassis for the family and the guide's rear figures serve every
      model. From the left, the management corner holds the MGMT RJ-45 over a USB-A port, then
      the CON RJ-45, a lighter plate with two earthing holes, the earth symbol, two QSFP+ cages
      marked 0 and 1 with a lamp slot pair under each, and the ESD socket. Then come fan 0 at
      133.7 mm and fan 1 at 182.0 mm, a label plate for the CLEI code and serial number labels,
      power supply slot 0 at 271.7 mm and slot 1 at 354.4 mm.
  rear-modules:
    confidence: estimated
    note: >-
      Both power supply bays are drawn at the supply's own 71.2 by 39.0 mm face, measured on slot 0
      of the EX3400-48P. The blank panel in slot 1 is photographed 76.6 by 41.0 mm because it
      overlaps the frame of the slot, and is drawn at the supply size so that it fills the same bay.
      Slot 1's position is the slot 0 position plus the 82.7 mm spacing of the two numerals. The
      600 W supply is drawn like the 920 W one that the photograph shows, since no photograph of
      it is held.
  earthing:
    confidence: datasheet
    note: >-
      Table 41 - the EX3400 earthing terminal is on the rear panel, with two 10-32 screws and a
      two-hole lug. Figure 3 callout 4. The hole spacing is not stated in the guide; the photograph
      puts the two holes 16.0 mm apart. They are juniper/ex3400-ground-pair@1, two 10-32 screws on
      the 5/8 in. (15.875 mm) pitch of a two-hole lug, on the lighter plate that the photograph shows.
  ears:
    confidence: datasheet
    note: >-
      Mounting topics - two brackets and eight screws ship in the box and mount along the front or
      the rear of the side panels. The separately orderable four-post rack-mount kit holds
      flush and 2-in.-recess front-mounting brackets, side rails and rear blades. The recess is 2 in.
      (50.8 mm). The guide gives no part number for the four-post kit or for the wall-mount kit,
      so neither is listed under kits, and the guide's figures place the brackets without a
      measurable fold line, so only the recess has an `at`.
  color:
    confidence: photo-measured
    note: >-
      photo-measured - median of the bare face between the port block and the bottom edge in the
      EX3400-48P front photograph, #9ea1a5, darkened to #8c9094 for the face as a whole; the
      uplink plate is darker (#6b6f73). The rear and the fan and supply colours are sampled the same way.
  power:
    confidence: datasheet
    note: >-
      Table 11 - the EX3400-24P consumes at most 110 W, and offers 720 W for PoE with two 600 W
      supplies or 370 W with one. Table 19 gives 8.5 A at 100 VAC and 4.25 A at 240 VAC. The 110 W is
      the switch's own maximum, and the PoE budget is a separate figure and is not added to it.
  fru-bays:
    confidence: datasheet
    note: >-
      Table 2 and the guide's field-replaceable units topic - power supplies and fan modules are
      hot-removable and hot-insertable FRUs seated in bays, as are transceivers. The switch ships
      with one power supply and two fan modules (Table 36). With one supply the switch must be powered off before the supply is
      removed. Both fan modules must be installed for normal cooling. A supply and the fans must have
      the same airflow direction.
attrs:
  physical:
    weight: 4.52 kg (9.97 lb) without power supplies or fan modules (Table 3)
    weight-fru: JPSU-600-AC-AFO 0.83 kg, fan module 0.72 kg (Table 3)
    depth-with-power-supply: 382.4 mm (15.05 in.) with a power supply installed (Table 3)
    width-with-brackets: 482 mm (19 in.) with the mounting brackets attached (Table 3)
  power:
    power-max-w: 110
    power-envelope: unstated
    poe-budget-w: 720 W with two 600 W supplies, 370 W with one (Table 1)
    poe-standard: PoE+ on all 24 ports, at most 30 W per port (Table 11)
    power-input-ac: 100 through 240 VAC, 50 or 60 Hz (Table 19)
    power-current-max: 8.5 A at 100 VAC and 4.25 A at 240 VAC (Table 19)
  environmental:
    operating-temp: 0 to 45 C (32 to 113 F) (Table 22)
    altitude: no performance degradation up to 3048 m (10,000 ft) (Table 22)
    humidity: 10 to 85 percent, noncondensing (Table 22)
  platform:
    first-junos-release: 15.1X53-D50 (Table 1)
  features:
    macsec: IEEE 802.1AE MACsec on all Gigabit and 10 Gigabit Ethernet ports, 88 Gbps of encryption
    virtual-chassis: up to 10 switches. The QSFP+ ports are Virtual Chassis ports by default
    uplink-ports: four SFP or SFP+ ports on the front and two QSFP+ ports on the rear
    optics-sfp-plus: the front uplink ports take SFP and SFP+ transceivers, singly or mixed. The supported list is in Juniper's Hardware Compatibility Tool, which the guide names and which is not held here
    optics-qsfp: the rear uplink ports take QSFP+ transceivers. The supported list is in Juniper's Hardware Compatibility Tool, which the guide names and which is not held here
  management:
    oob: management Ethernet RJ-45 on the rear panel, with a Link/Activity lamp and a Status lamp
    console: RJ-45 console on the rear panel and Mini-USB Type-B console on the front, both labelled CON
    usb: one USB port on the rear panel
  compliance:
    seismic: Complies with Zone 4 earthquake requirements per GR-63, Issue 4 (Table 22)
  lifecycle: {eol: none-announced}
chassis:
  width: 441.0
  height: 43.7
  depth: 350.0
  ru: 1
  weight-kg: 4.52
  color: '#8c9094'
  silk: '#eef0f2'
  airflow: front-to-back
  power: ac
  ears:
    positions:
    - {name: flush, label: front-mount, at: 0, default: true}
    - {name: recessed, label: 2-in. recess, at: 50.8}
    - {name: rear, label: rear-mount}
gaps:
- what: mini-usb-console-port
  scope: [front]
  reason: needs-drawing
  wanted: >-
    The front Mini-USB Type-B console, labelled CON, is drawn as decor and not placed as a port. The
    DCIM exporter has no route for a Mini-USB console part, and the guard test that holds every port
    part to the exporter fails until it has one. A change to dcim_export.py that exports
    a Mini-B console as a usb-mini-b console port would let the port be placed.
- what: straight-on-front
  scope: [front]
  reason: needs-photo
  wanted: >-
    A straight-on photograph of the EX3400-24P or EX3400-24T front. The jack block is carried
    from the EX3400-48P and checked against a top-angle photograph to about 1 percent.
- what: port-status-lamp-states
  scope: [rj45]
  reason: vendor-silent
  wanted: >-
    A per-port vocabulary for the Status lamp. Table 8 gives it four meanings that depend on the
    mode the Factory Reset/Mode button chose, so the jack keeps the component's default
    off, link and activity states, and the mode lamps carry the meaning.
- what: label-plate
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    The size of the CLEI code label and the Serial Number ID Label on the rear plate between fan 1
    and power supply 0 (Figure 3 callouts 8 and 9). The plate and its corner marks are drawn as
    one grey rectangle.
- what: power-supply-depth
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The depth of a power supply and of a fan module. Table 3 gives a chassis depth of 350.0 mm with
    no supply and 382.4 mm with one, and the guide gives no dimension for the modules.
- what: rear-photograph
  scope: [rear]
  reason: needs-photo
  wanted: >-
    A photograph of the EX3400-24P rear and of the 600 W supply. The rear is drawn from the
    EX3400-48P photograph.
- what: interface-names
  scope: [rj45, sfp-plus, qsfp-plus]
  reason: vendor-silent
  wanted: >-
    The Junos interface names (ge-0/0/n, xe-0/2/n and the QSFP+ names). This guide names only the
    PIC numbers in Table 2, 0 for the RJ-45 ports, 1 for the QSFP+ ports and 2 for the SFP+ ports.
- what: four-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: A flat drawing or photograph of the lid, the underside and the side panels.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g, poe: 802.3at}
    description: 24 PoE+ ports labelled 0 to 23, the even ports on the upper row
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: Four front uplink ports labelled 0 to 3. Each takes an SFP or an SFP+ transceiver
  uplink-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: 'on', color: '#22c55e'}, {name: blinking, color: '#22c55e', behavior: blinking}]
    description: >-
      A Link/Activity lamp and a Status lamp beside each front uplink port. Table 7 - the
      Link/Activity lamp blinks green with traffic and is steady green with a link and no traffic.
      Table 9 - the Status lamp is steady at 10 Gbps, blinking at 1000 Mbps, and unlit when the port is down
  qsfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp, speed: 40g}
    description: Two rear QSFP+ uplink ports labelled 0 and 1. They are Virtual Chassis ports by default
  qsfp-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: 'on', color: '#22c55e'}, {name: blinking, color: '#22c55e', behavior: blinking}]
    description: >-
      A Link/Activity lamp and a Status lamp under each rear QSFP+ port. Table 7 - the Link/Activity
      lamp blinks green with traffic and is steady green with a link and no traffic. Table 9 - the
      Status lamp is steady when the 40-Gigabit port is up and unlit when it is down
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: the management corner - the out-of-band RJ-45, the RJ-45 console, the USB port and the Factory Reset/Mode button
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: SYS, ALM and MST chassis lamps (Table 4)
  mode-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: SPD, DX, EN and PoE port mode lamps (Table 8). The Factory Reset/Mode button chooses which one shows
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        1+1 - the switch ships with one supply and takes a second. In the EU, Egypt, Nigeria, Saudi
        Arabia, Serbia, South Korea and South Africa the guide requires the redundant supply (Table 11 note)
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy-note: Both fan modules must be installed and working for normal cooling (fan removal topic)
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the rear earthing terminal, two 10-32 screws for a two-hole lug (Table 41)
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the rear wrist-strap ESD point (Figure 3 callout 6)
