name: ex2300-48mp
version: 0.1.1
maturity: modelled
manufacturer: Juniper
model: EX2300-48MP
portfolio: {line: EX Series, family: EX2300}
description: >-
  Juniper EX2300-48MP is a fixed 1RU Multigigabit access switch. It has 48 PoE+ ports, all with 740 W
  available: sixteen 100/1000/2500BASE-T ports and thirty-two 10/100/1000BASE-T ports, and six built-in
  10-Gigabit SFP+/SFP uplink ports. The front carries the 48 jacks in three shells of two stacked rows,
  numbered 0 to 47 with the upper jack of a column taking the even number (the middle shell, ports 16 to
  31, is the Multigigabit one), the six uplinks in three stacked pairs numbered 0 to 5, the three system
  lamps (MGT, FAN, PW), the management Ethernet port with the RJ-45 console port under it, and a USB
  port. The rear carries the earthing terminal and the AC power cord inlet. The power supply and the four
  fans are built into the chassis (the fans along the right side panel, moving air from side to side), so
  there are no bays. It has no mini-USB console port and no mode button.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX2300 Switch Hardware Guide, Juniper Networks, published 2025-08-12 (314 pages;
      https://www.juniper.net/documentation/us/en/hardware/ex2300/ex2300.pdf): Figure 6 (front panel),
      Figure 15 (rear panel), Figures 19, 23, 29 and 31 (LEDs), Table 1 (models), Table 3 (chassis size and
      weight), Tables 5, 8, 9 and 13 (LED states), the cooling system section with Figures 36 and 37,
      Tables 14 and 15 (power), Table 34 (parts list), Table 35 (mounting methods) and Table 36 (earthing).
      Juniper's own straight-on studio photograph of the EX2300-48MP front (ex2300m-poe48-front-high.jpg)
      from the maker's image library
      (https://www.juniper.net/us/en/company/images/image-library-logos-and-product-photos/products/ex2300-48mp.html),
      which holds no rear or side photograph of this model. The English datasheet addresses tried (the
      EX2300 line datasheet under datasheets/us/en/switches) did not answer, so no datasheet is cited.
  gate-1:
    confidence: measured
    note: >-
      The guide's Figure 6 is 1501 x 413 px; the photograph is 1500 x 230 px with the body 1440 px across
      (x 30 to 1470): 3.266 px per mm across against the 440.9 mm of Table 3. The photograph's jack pitch
      reads 46.4 px = 14.2 mm and the shells 117.6 mm apart (a 3.8 mm gutter after eight columns). The
      photograph is 1440 px across and 163 down including the reflection; its body (face top at 43 px) is
      read at the same px per mm, the body 43.3 mm high being 141 px. The rear Figure 15 passes the aspect
      check in x (1449 px, 3.286 px per mm) and is 147 px (44.5 mm) down against 43.3, 2.8 percent out, so
      its y is taken from the body's centre line. Every position is estimated and good to about a
      millimetre.
  chassis:
    confidence: datasheet
    note: >-
      Table 3: height 1.7 in (4.33 cm) for the EX2300-48MP, width 17.36 in (44.09 cm) and 18.95 in (48.13
      cm) with the mounting brackets attached, depth 14.45 in (36.71 cm), weight 14.33 lb (6.5 kg). 440.9 x
      43.3 x 367.1 is carried, the metric as printed. The other EX2300 devices are 17.4 in wide and 1.75 in
      high; the MP models are the guide's own exception.
  mounting:
    confidence: datasheet
    note: >-
      Table 34: two mounting brackets and eight screws are provided; Table 35: two-post rack or cabinet with
      those brackets, four-post rack with the separately orderable four-post rack-mount kit
      (EX-4PST-RMK), recessed 2 in from the front with that kit's recess brackets, and on a desk on the
      four preinstalled rubber feet. The MP models cannot be wall mounted. No figure measures a bracket
      position and the kit is not modelled here, so no ear position is stated and no kit is listed.
  front-layout:
    confidence: estimated
    note: >-
      estimated - read off the photograph as described under gate-1. Three shells of eight columns: the first
      jack at 36.65 mm, 14.22 mm apart, the shells 117.6 mm apart, the rows 14.4 mm apart (cell tops, latch
      tab included) with the upper row turned 180 so its latch tab is above, as the photograph shows. The six
      uplink cages stand in three columns (the first two abutting at 14.7 mm, the third 2.8 mm clear of them)
      with the registry's 15.0 mm between the stacked rows, the upper cage upright and the lower turned, as
      the library's stack convention has it. Each port has one small rectangular lamp above its shell, the
      even port's at the left of its column and the odd port's at the right, with the column's two numbers
      printed above them in orange, the even number high and left and the odd one low and right. The
      management jack sits above the console jack at the left, in one housing 17.2 mm wide; its two lamps,
      ACT and LINK, are separate dots over the housing, printed beside their legends, with MGT, FAN and PW on
      the line above, and the USB-A port, upright, stands under them. The photograph shows one corner mark
      beside the USB port that the guide's Figure 6 does not draw; it carries no printing and is not drawn.
      The photograph shows a light-blue strip along the lower edge of the face, drawn as chassis art. The
      third uplink column in the photograph has a transceiver seated in its lower cage; the cages are drawn
      empty.
  port-numbering:
    confidence: photo-measured
    note: >-
      photo-measured - the photograph prints each column's two numbers in orange over the lamps (0 and 1, 2
      and 3, ... 46 and 47), so the upper jack takes the even number; the uplinks print 0 to 5 in white the
      same way. Port numbers are as printed on the metal, from 0. The Junos interface names are not printed:
      the guide's Table 2 gives PIC 0 as 32x10/100/1G Base-T and 16x100M/1G/2.5G Base-T and PIC 1 as 6x1G/10G
      SFP/SFP+, recorded here and not in an interfaces block because the faceplate does not print them.
  multigig-ports:
    confidence: datasheet
    note: >-
      Hardware guide, Front Panel of an EX2300 Switch: sixteen 100/1000/2500BASE-T ports with PoE/PoE+ and
      thirty-two 10/100/1000BASE-T ports with PoE/PoE+; Figure 6 callout 4 marks the middle shell (ports 16
      to 31) as the 100/1000/2500 one and callout 3 the first and third. The photograph carries an orange
      frame round the middle shell only: it is a marketing overlay and not on the metal, so it is not drawn.
  lamps:
    confidence: datasheet
    note: >-
      Hardware guide, Tables 5, 8, 9 and 13 and Figures 19, 23, 29 and 31. The system lamps are MGT, FAN and
      PW (Table 5); each RJ-45 port and each uplink has one Link/Activity lamp (Table 13), and the
      management jack has a Link lamp and an Activity lamp (Figure 23, Tables 8 and 9), printed LINK and
      ACT on the photograph. Speed, duplex, administrative status and PoE are read with show commands (the
      guide's note under Table 13), so there are no mode lamps and no mode button.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - positions off Figure 15 (1501 x 331 px, body 1449 px across at 3.286 px per mm, y from the
      body's centre line at 3.30 px per mm): the AC inlet and its legend, the earthing terminal, the plate
      near the right with its two large screws, and the model name. No photograph of this rear is held. The
      guide's drawn serial number and CLEI rectangles (callouts 1 and 2) are left out: they are paper labels
      carrying real serial numbers. The Running Junos badge Figure 15 draws and the Juniper lockup are
      maker's logos and are not drawn (the lockup is reserved). Figure 15 calls the ring at the right "ESD
      point" (callout 4) but prints the earth symbol under it, and Table 36 lists an earthing terminal on
      the rear panel of the EX2300-48MP (a 14-10 AWG lug on one M4 screw): it is drawn as the earthing
      terminal. The figure also draws two ring bosses beside the plate and a ring beside the first screw,
      which the guide names nowhere, and a small slotted screw; the bosses are not drawn.
  side-fans:
    confidence: estimated
    note: >-
      estimated - the guide's cooling section says four fans built in along the right side panel give
      side-to-side cooling, and Figure 37 shows them on the right panel in perspective. Their places along
      the depth are read off the plan in Figure 36 (the box 736 px for 367.1 mm, 2.005 px per mm; the fans'
      centres 158.6, 199.5, 276.8 and 319.7 mm from the front; on the right view x = 0 is the front), a 40
      mm fan each. Figure 36 draws the fans on the left of the plan, with the front at the top and the
      arrows leaving there, while the text and Figure 37 put them on the right panel: the text and Figure
      37 are followed, so the exhaust is on the right panel and the intake on the left.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Hardware guide, Power Supply in EX2300 Switches: "The power supply in EX2300 switches is built in
      along the rear panel of the chassis"; Table 2 lists "Switch with built-in power supply" and, for the
      fans, "Fan". The cooling system section says "four fans built in along the right side panel" and
      Figure 37 is captioned "Fans Built-in". Nothing in the guide describes removing or replacing either.
      They are part of the chassis, not bays and not components.
  airflow:
    confidence: datasheet
    note: >-
      the cooling system provides side-to-side chassis cooling (Figures 36 and 47).
  power:
    confidence: datasheet
    note: >-
      Table 14: maximum power consumed by the switch 90 W when no PoE power is drawn, maximum PoE/PoE+
      power available 740 W; Table 15: 100 through 240 VAC, 50/60 Hz, 10.6 A at 100 VAC and 4.8 A at 240 VAC
      (the rear legend of Figure 15 prints 10.6-4.8A).
  colour:
    confidence: photo-measured
    note: >-
      median of the bare front plate in the 24-port photograph (#656d74); the 48-port photograph's plate
      reads about #81868d near its top edge, lighter under the studio lights; the strip along the lower
      edge #bbe4f2.
