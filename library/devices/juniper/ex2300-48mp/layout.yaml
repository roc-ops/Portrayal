gaps:
- what: rack-ears
  scope: [front]
  reason: needs-drawing
  note: >-
    Table 35 lists the supplied two-post mounting brackets and a separately orderable four-post rack-mount
    kit (EX-4PST-RMK, named in the rack requirements); no figure measures a bracket position, so no ear
    position is stated and no kit is listed.
  wanted: A dimensioned drawing of the bracket positions.
- what: eol
  scope: [front]
  reason: vendor-silent
  note: >-
    Searched for an end-of-life notice: only third-party lifecycle trackers answered; Juniper's own
    bulletin was not found, so no lifecycle is written.
  wanted: Juniper's end-of-life bulletin for the EX2300 line.
- what: rear-photograph
  scope: [rear]
  reason: needs-photo
  note: >-
    The maker's image library holds no EX2300-48MP rear photograph; its rear is drawn from Figure 15.
  wanted: A straight-on studio photograph of the EX2300-48MP rear.
- what: side-elevations
  scope: [left, right]
  reason: needs-drawing
  note: >-
    The right panel carries the fans (drawn as grilles at the places read off Figure 36); no flat figure
    shows its mounting holes or the left panel's intake.
  wanted: A flat drawing of both side panels.
