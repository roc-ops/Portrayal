  physical:
    weight-note: 14.33 lb (6.5 kg), Table 3
  power:
    power-max-w: 90
    power-envelope: bare
    poe-budget-w: 740
    poe-standard: IEEE 802.3af/at
    power-input: 100 through 240 VAC, 50/60 Hz
    power-current-max: 10.6 A at 100 VAC; 4.8 A at 240 VAC
  thermal:
    cooling: four built-in fans, side-to-side
  environmental:
    operating-temp-c: 0 to 45
    humidity: 10 to 85 percent, noncondensing
    altitude-ft: 13,000 at 40 C
  features:
    optics-sfp-plus: >-
      hardware guide, Uplink Ports: the six uplink ports take SFP and SFP+ transceivers.
      A Virtual Chassis can be formed with SFP+ and not with SFP
