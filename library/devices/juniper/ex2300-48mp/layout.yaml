    attrs: {media: rj45, speed: 1g, poe: 802.3at}
    description: >-
      the thirty-two built-in 10/100/1000BASE-T PoE+ ports (the first and third shells, ports 0 to 15 and 32
      to 47); rel-pos carries the number printed on the faceplate, the upper jack of a column takes the even
      number
  rj45-mgig:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 2.5g, poe: 802.3at}
    description: >-
      the sixteen built-in 100/1000/2500BASE-T PoE+ ports (the middle shell, ports 16 to 31); rel-pos carries
      the number printed on the faceplate, the upper jack of a column takes the even number
  rj45-b:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g, poe: 802.3at}
    description: >-
      the third shell's sixteen 10/100/1000BASE-T PoE+ ports (32 to 47), a block of its own because the
      middle shell's Multigigabit ports stand between it and the first; rel-pos carries the number printed
      on the faceplate
