format: 1
kind: device
name: ex4550-32f
version: 0.2.0
maturity: modelled
manufacturer: Juniper
model: EX4550-32F
portfolio: {line: EX Series, family: EX4550}
description: >-
  Juniper EX4550-32F, a 1RU 10 GbE aggregation and data-centre top-of-rack switch that runs Junos OS.
  The port side has 32 SFP+ ports in two rows, each taking a 10 GbE SFP+ or a 1 GbE SFP. It also
  has a module slot with a cover panel. The LCD panel has two buttons and three lamps. There are a
  management port and two console ports. The other side carries a second module slot, three fan
  modules and two power supply slots. One panel serves five models. Four have an AC or DC supply,
  with air in or air out. The fifth is a spare chassis without supplies or fans.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper EX4550 Switch Hardware Guide, published 2020-12-15, 333 pages (Juniper Networks,
      copyright 2020; the PDF is the EX4550 guide of the EX Series documentation archive): Table 3
      (the modules), Table 4 (the models), Table 6 (the chassis), Figures 1 to 6 (the panels), the
      lamp Tables 11 to 16, Table 17 (the fan modules), Tables 18 to 26 (the airflow, the supplies
      and their power). The guide for the EX4500 is a separate document. No datasheet of the EX4550
      is held; the product page is retired. The held intake folders for the EX and QFX lines were
      read: they hold no studio photograph, stencil or 3D model of the EX4550, and the guide's
      figures are the only drawings. Terms: the document is Juniper's, read here for facts only, and
      nothing of it is copied into the library.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 6: 1.72 in (4.37 cm) high, 17.35 in (44.07 cm) wide, 18.50 in (46.99 cm) deep, 19.4 lb
      (8.8 kg) with one power supply, 2.4 lb a supply, 0.74 lb an SFP+ module. So the height is 43.7
      mm, the width 440.7 mm and the depth 469.9 mm. The width is the body: the front mount brackets
      extend it to 19 in, so they are not modelled.
  gate-1:
    confidence: drawing
    note: >-
      Figure 4 (the flat front drawing of the 32F) was rendered at 1200 dpi. Its body measures 4866 px
      wide and 488 px high, an aspect of 9.97 against the table's 440.7 / 43.7 = 10.08, 1.1 percent
      out, so it is read as orthographic at 0.0906 mm per pixel across and 0.0896 down. The lower
      callout bracket under the ports is not part of the body. Figure 6 (the rear) measures 5197 x
      526 px, 9.88, 2 percent out, read at 0.0848 across and 0.0831 down. No photograph is held. Every
      position read off a figure is estimated, to about 0.3 mm on the front and 0.5 mm on the rear.
  ports:
    confidence: drawing
    note: >-
      Figure 4, callout 11: 32 SFP+ ports in four blocks of four columns, each column a stacked pair.
      The cage dividers measure 159.5 px, 14.45 mm, apart, which is the registry's 14.25 mm pitch to
      1.4 percent, so the registry pitch is used. The blocks start 708 px apart: the cells start at
      104.4, 168.5, 232.7 and 296.8 mm, a stride of 64.15 mm, so the gutter is 64.15 - 4 x 14.25 = 7.15
      mm. The cage rows are 15.2 mm apart at the opening centres, the registry's 15.0 mm to 1.3
      percent; the upper cell starts at 9.4 mm and the lower at 24.4 mm. The cells use the registry's
      aperture, 14.25 x 10.4.
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md): a row pair is the upper cage
      upright over the lower turned 180, so both lips face the band between the two cages. Figure 4
      is a line drawing that draws the release tab at the foot of both cages, and a line drawing of a
      cage cannot say which way the metal faces, so the convention is kept and a photograph of the
      real panel would overturn it.
  port-numbering:
    confidence: drawing
    note: >-
      Printed on the metal and read off Figure 4: the numerals sit below the lower cage. In each column
      the upper port's even numeral is at the left, 4.4 mm from the column edge and 37.8 mm down, and the
      lower port's odd numeral is at the right, 10.0 mm from it and 40.0 mm down, so a block reads
      0 1 2 3 4 5 6 7 with the pairs sitting across the columns. The ports are 0 to 31 as printed.
      Interface names are not printed on the unit. The guide's default configuration names the network
      ports xe-0/0/0 to xe-0/0/31 (and ge-0/0/0 to ge-0/0/31 on a 1 GbE SFP) and the expansion module
      ports xe-0/1/0 to xe-0/1/7 and xe-0/2/0 to xe-0/2/7; they go here and not in the manifest.
  port-lamps:
    confidence: drawing
    note: >-
      Figure 4, Figure 16 and Table 14: four triangular lamps in the band between the two cages of each
      column, each pointing at its port: two up-pointing for the upper port and two down-pointing for the
      lower. The guide says every port has a link and activity lamp and a status lamp (Figure 18, Tables
      14 and 15). Which of a pair is which is not stated in words; the link and activity lamp is taken
      as the first of each pair, at the left, and the status lamp as the second. This is estimated. The
      centres are 2.8, 5.7, 9.5 and 12.3 mm from the column edge and 22.4 mm down, and the lamp is
      2.25 x 2.0 mm, the library's small triangle.
  vents:
    confidence: drawing
    note: >-
      Figure 4: a honeycomb band along the top from 127.0 to 355.0 mm and 0.7 to 8.5 mm down, a column of
      five hexagons at each end of the port field (at 95.7 and 355.8 mm, 10.9 to 35.5 mm down) and a row
      of small hexagons over the management jacks. They are declared vents. The guide's Table 4 gives
      the air intake as the front vents for front-to-back and the rear vents for back-to-front.
  front-controls:
    confidence: drawing
    note: >-
      Figure 4, callouts 3 to 10: the LCD panel on a plate at the right, 360.4 to 435.9 mm, with the
      window 372.5 to 409.0 mm and 9.4 to 19.9 mm down; the Menu button above the Enter button at 417.3
      mm, centres 11.1 and 20.1 mm down; the three chassis lamps ALM, SYS and MST at 424.2 mm, 8.9, 12.8 and
      16.5 mm down; then below the plate the management port, the RJ-45 console port, the USB port and
      the mini-USB console port at 371.7, 393.4, 414.0 and 428.5 mm. The legends MGMT and CON are printed
      with their letters stacked, and CON again under the mini-USB port. The names are the guide's: the
      jack beside the lamps is the management port and the next the RJ-45 console. The guide says the
      mini-USB console port is the active one and the RJ-45 console is passive on the EX4550.
  junos-mark:
    confidence: drawing
    note: >-
      Figure 4 prints a logo of the Junos operating system on the LCD plate and the maker's mark above the
      port field. Both are marks of Juniper, so neither is drawn: the maker's mark has a reserved logo
      zone, the Junos mark has a region, and the plain model name EX4550 is drawn as text.
  module-slots:
    confidence: drawing
    note: >-
      Figures 1 to 6: the switch has two module slots, one on the front panel at the left and one on the
      rear panel, and Table 3 lists the four modules each takes, EX4550-EM-8XSFP, EX4550-EM-8XT,
      EX4550-EM-2QSFP and EX4550-VC-128G. Every model ships with a cover panel in each slot; the modules
      are ordered separately. THE MODULES ARE NOT MODELLED. This slice builds no module family, so each
      slot is a bay that accepts the cover panel alone, and the four modules are named here and in a gap.
      The slot is 86.5 mm wide: Figure 6 gives 86.2 mm and Figure 4 gives 88.9 mm; 86.5 is used.
  rear-layout:
    confidence: drawing
    note: >-
      Figure 6, read at 0.0848 mm across: at the left a recessed power supply slot 0 with its legend 0 and
      the supply in it (Figure 6 callout 1), then slot 1 with its cover panel (callout 2), then a plate
      with the ESD point (callout 3), the slot 1 legend, the rating label and the ESD warning mark, then the
      rear module slot with its cover panel (callout 4), then three fan slots numbered 1 to 3 from left to
      right, each preceded by a strip with its fan symbol, number and a status lamp (callouts 5 to 7). The
      supply bays are 54.7 x 40.5 mm, the size of the supply this chassis takes, at 11.0 and 74.5 mm; the
      figure reads the supply body at 56.3 mm and the slot pitch at 63.4 mm. The fan modules measure about
      41.6 x 40.0 mm on a 55.1 mm pitch and start at 286.9, 342.0 and 397.0 mm.
  rear-marks:
    confidence: drawing
    note: >-
      Figure 6 also draws three round holes and a slot in the strip at the left end of the rear, a small
      lamp hole above the rating label and a captive screw in each fan strip. The guide names none of them
      and they are not drawn; a gap records them.
  fans-and-supplies:
    confidence: datasheet
    note: >-
      The three fan modules (EX4550-FAN-AFO and EX4550-FAN-AFI, Table 17) and the two supply slots
      (JPSU-650W-AC-AFO and -AFI, Table 20; JPSU-650W-DC-AFO and -AFI, Table 24) are field-replaceable
      units in bays. The supplies are the part numbers the library already holds for the EX4600, so they
      are reused as they are. The cover panel of slot 1 is a component of its own. Nothing on this chassis
      is a built-in unit that is not a bay; the fan in each supply is inside the supply.
  airflow-colours:
    confidence: estimated
    note: >-
      Tables 17, 20 and 24 give the label of each unit (AIR OUT or AFO for front-to-back, AIR IN or AFI for
      back-to-front) and the guide gives no handle colour for the EX4550. The reused supplies carry the
      orange and blue of the EX4600 guide, and the new fan modules take the same two for the same airflow.
      The figures are line drawings in grey.
  variants:
    confidence: datasheet
    note: >-
      Table 4: one front panel serves EX4550-32F-AFI, -AFO, -DC-AFI, -DC-AFO and -S, so each is an orderable
      configuration. The AC or DC supply and the airflow differ, and the panel does not. The -S ships with
      no supply and no fan modules; the other four ship with one supply in slot 0, a cover panel in slot 1
      and three fan modules. The 32T is a separate device because its panel carries jacks.
  power:
    confidence: datasheet
    note: >-
      Table 22 (AC): 100 to 120 VAC and 200 to 240 VAC, 50 to 60 Hz, 7.8 A and 3.8 A, 650 W output; the
      system maximum of an EX4550-32F with two EX4550-EM-8XT modules is 336 W and 1146 BTU an hour. Table 26
      (DC): operating range -36 to -72 VDC, 7 A at -48 VDC, 650 W output. The 336 W is the fully
      configured scope: two EX4550-EM-8XT modules installed. The guide gives no typical figure and
      no figure for the bare chassis. A fan module needs 4.8 W at normal speed and 16.8 W at high speed.
  environment:
    confidence: datasheet
    note: >-
      Table 28: 0 to 45 C (32 to 113 F) for the 32F, up to 10,000 ft (3,048 m) with no loss of
      performance, 10 to 85 percent relative humidity noncondensing, GR-63 Zone 4 earthquake.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide says the switch mounts in a two-post, a four-post or an enclosed
      cabinet rack with the front mount brackets (Table 6) and shows the brackets in its mounting
      chapter. It prints no part number for the mounting kit and the library holds no contract for
      it, so chassis.ears and chassis.kits are left out and a gap says so.
  colour:
    confidence: estimated
    note: >-
      The figures are line drawings and no photograph is held, so the chassis colour is a mid grey taken
      from the same maker's EX switches. It is not a paint reference.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-life notice. Juniper's own page was not reached and the guide, dated
      2020-12-15, states none. A reseller notice of 2019-03-08 gives 2019-06-30 as the last order date of
      the EX4550, and a third-party tracker (endoflife.ai) gives 2024-06-30 as the end of life. Both are
      estimated.
attrs:
  physical:
    weight-note: 19.4 lb (8.8 kg) with one power supply (Table 6)
    depth-note: 18.50 in (46.99 cm) (Table 6)
  performance:
    sfp-plus-speeds: 10 GbE or 1 GbE on each fixed SFP+ port
    expansion-ports: up to 48 10 GbE ports with two 8-port modules, or 2 x 40 GbE with a QSFP+ module
  power:
    power-max-w: 336
    power-envelope: fully-configured
    power-input-ac: 100 to 120 VAC and 200 to 240 VAC, 50 to 60 Hz; 7.8 A and 3.8 A
    power-input-dc: operating range -36 to -72 VDC, nominal -48 VDC, 7 A maximum
    redundancy-note: two supplies, load sharing; do not mix AC and DC, or AFI and AFO
  thermal:
    fans: three fan modules and a fan in each supply; the switch runs 30 seconds while one fan module is replaced
    heat-btu-h: 1146 BTU an hour at the maximum system power (Table 22)
  environmental:
    operating-temp: 0 to 45 C (32 to 113 F)
    humidity: 10 to 85 percent noncondensing
    altitude: no loss of performance to 10,000 ft (3,048 m)
  platform:
    software: Junos OS, first release 12.2R1 for the 32F and 12.3R5 for the -S
  features:
    virtual-chassis: up to 10 switches, mixed with EX4200 and EX4500
    optics-sfp-plus: 10 GbE SFP+ and 1 GbE SFP in any port, in any combination
    expansion: two module slots (front and rear), EX4550-EM-8XSFP, EX4550-EM-8XT, EX4550-EM-2QSFP and EX4550-VC-128G
  management:
    oob: one RJ-45 management port with link and status lamps
    console: mini-USB console port (active) and RJ-45 console port (passive)
    usb: one USB port
  compliance:
    seismic: GR-63, Issue 4, Zone 4 (guide Table 28)
  lifecycle:
    eol: announced
    eol-announcement: https://www.nomios.com/news-blog/juniper-announces-end-of-life-of-popular-ex-switches/
    end-of-sale: '2019-06-30'
    end-of-life: '2024-06-30'
chassis: {width: 440.7, height: 43.7, depth: 469.9, ru: 1, weight-kg: 8.8, color: '#a3a7ac', airflow: front-to-back, power: ac}
gaps:
- what: ears-and-kits
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    The part number of the mounting kit and the ear positions. The guide describes the front mount
    brackets and prints no part number for them.
- what: expansion-modules
  scope: [front, rear]
  reason: needs-drawing
  wanted: >-
    The four modules a slot takes (EX4550-EM-8XSFP, EX4550-EM-8XT, EX4550-EM-2QSFP and EX4550-VC-128G) are
    not modelled. Each slot accepts its cover panel only. A later slice can add the modules as
    components that this bay then accepts.
- what: datasheet
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    The datasheet of the EX4550. The product page is retired and none is held, so the throughput,
    the typical power and the compliance list are not stated.
- what: handle-colour
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The handle colour of the fan modules and supplies. The guide's Tables 17, 20 and 24 give the labels
    only, and its figures are grey line drawings. The orange and blue of the EX4600 guide are used.
- what: ac-input-rating
  scope: [rear]
  reason: sources-disagree
  note: >-
    The rating label in Figure 6 prints an AC input of 3 A (100-240V, 60-50Hz). Table 22 gives 7.8 A at the
    low line and 3.8 A at the high line. The label is drawn as printed and the attribute carries Table 22.
  wanted: which figure the real label prints, from a photograph of the rear plate
- what: front-cover-width
  scope: [front]
  reason: sources-disagree
  note: >-
    Figure 6 gives the module cover 86.2 mm wide and Figure 4 gives 88.9 mm. The rear reading is used for
    the one component, 86.5 mm, and the front bay is placed centred on the figure's cover.
  wanted: the module slot width from Juniper
- what: rear-marks
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The three round holes and the slot at the left end of the rear, the small lamp hole over the rating
    label and the captive screw in each fan strip. The guide's figure draws them and names none.
- what: usb-generation
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The USB revision. The guide names one USB port. It is drawn with the neutral usb2 skin.
- what: labels-not-drawn
  scope: [front, rear]
  reason: needs-photo
  wanted: >-
    The serial number label and the hazard marks, which the figures do not draw. The ESD warning mark is
    drawn as an outline of its triangle, since the hand inside it is too small to read in the figure.
- what: four-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A flat drawing or photograph of the lid, the underside and the side panels. The guide shows the
    protective earthing terminal on the left side and draws no flat side.
groups:
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: Ports 0 to 31 as printed; each takes a 10 GbE SFP+ or a 1 GbE SFP
  sfp-plus-activity-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The link and activity lamp of each SFP+ port, the first triangle of its pair (guide Table 14)
  sfp-plus-status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The status lamp of each SFP+ port, the second triangle of its pair (guide Table 15)
  expansion:
    term: Slot
    role: traffic
    index-origin: 1
    description: >-
      The two module slots. Slot 1 is on the front panel (PIC 1) and slot 2 on the rear panel (PIC 2)
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the management cluster at the right of the front: an RJ-45 management port, an RJ-45 console, a
      mini-USB console and a USB port. Four kinds, one purpose: reaching and recovering the switch
      when the data plane cannot.
  lcd-buttons:
    term: Button
    role: management
    index-origin: 0
    description: the LCD panel's Menu and Enter buttons
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The three chassis lamps ALM, SYS and MST (guide Table 11)
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy-note: >-
        Three fan modules in slots 1 to 3 from left to right. The guide says all three must be installed
        for optimal functioning, and the switch runs 30 seconds while one is replaced
  fan-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      The status lamp (ST) in the strip at the left of each fan slot: green when the module works,
      unlit when it is absent or failed (guide Table 19)
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Two supply slots; the switch ships with one supply and a cover panel in slot 1. Do not mix AC and
        DC supplies, or supplies of different airflow
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD point on the rear panel (guide Figure 6, callout 3)
