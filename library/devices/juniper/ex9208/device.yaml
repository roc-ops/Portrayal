format: 1
kind: device
name: ex9208
version: 0.1.2
maturity: modelled
manufacturer: Juniper
model: EX9208
portfolio:
  line: EX Series
  family: EX9200
description: >-
  Juniper EX9208, an 8 U modular Ethernet switch of the EX9200 family that runs Junos OS. It is built on the MX480
  chassis. Eight horizontal slots sit under the craft interface: line card slots 5 down to 0, then Switch Fabric slots
  SF1 and SF0. Each Switch Fabric module carries a Routing Engine. Four power supply bays sit across the top of the rear,
  with the air filter and the fan tray at the rear sides. The EX9200 line cards are a family of their own and are not
  modelled: their slots show blank panels.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX9208 Switch Hardware Guide, Juniper Networks, published 2025-07-28, https://www.juniper.net/documentation/us/en/hardware/ex9208/ex9208.pdf.
      Taken from it: Table 5 (the switch configurations), Table 6 (the CLI terms), Table 7 (the physical specifications), Figures 5 to 7 (the front
      and rear, in isometric), Figure 12 (the craft interface, flat), Tables 9 to 14 (the lamps), Figures 20 to 25 (fan tray, air filter and
      supplies), the power chapter and the host subsystem chapter. EX9200 Ethernet Switch Datasheet, 1000432-022-EN, Aug 2022,
      https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex9200-ethernet-switch-datasheet.pdf: Table 1 (features), Table 4
      (supply capacity), Table 7 (chassis), maximum thermal output and the ordering information, which names the spare chassis EX9208-CHAS3-S, the
      blank EX9200-LC-SF-BLANK, the supplies, the fan tray FFANTRAY-MX480-HC-S and the air filter FLTR-KIT-MX480-S. The EX9208 studio front, rear and
      front-with-top photographs from Juniper's image library (1000 px, the EX9208 front body 584 px across). The guide and the datasheet are
      Juniper's documents, read here for facts only, and nothing of them is copied into the library; no drawing or photograph is reproduced. The
      EX9208 is the MX480 chassis (juniper/mx480), and that device's measurements are used where they are said to be.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 7: 14.0 in (35.6 cm) high, 17.5 in (44.5 cm) wide and 24.5 in (62.2 cm) deep from the front to the chassis rear, 27.75 in (70.5 cm) with
      the cable management brackets. 14.0 in is 355.6 mm, 17.5 in is 444.5 mm and 24.5 in is 622.3 mm. The MX480 guide gives the same sheet metal
      17.45 in (443 mm) wide (see the gap chassis-width). Chassis with midplane, craft interface, fan tray and cable management brackets 65.5 lb
      (29.7 kg); maximum configuration 163.6 lb (74.2 kg). 8 U is the datasheet's. Ears are NOT MODELLED by project convention.
  ears-and-kits:
    confidence: datasheet
    note: >-
      Guide, Moving the Mounting Brackets for Center-Mounting an EX9200 Switch (Figure 48): two removable mounting brackets ship attached to the holes
      closest to the front of the chassis, so the switch front-mounts flush by default, and the pair moves to the side of the chassis for
      center-mounting. No figure gives the distance of either from the faceplate, so neither position has an `at`. The mounting shelf is included in
      the shipping container; the guide gives it no part number. Rack kits go in provenance only, so chassis.kits is not written.
  scale:
    confidence: estimated
    note: >-
      Gate 1. The EX9208 front photograph's body runs 206 to 789 px across (584 px) and 11 to 481 px down (471 px): 1.314 px/mm across for 444.5 mm
      and 1.325 down for 355.6, 0.8 percent apart. The rear photograph reads 1.440 across and 1.448 down, 0.5 percent apart. So the photographs are
      near-orthographic and resolve 0.8 mm (front) and 0.7 mm (rear) to the pixel; a position read off them is estimated to about 1.5 mm.
  card-slots:
    confidence: estimated
    note: >-
      The eight slots are the MX480's (juniper/mx480 provenance card-slots): the plates run 396.0 mm, each slot is the 413.5 x 29.5 lever envelope with
      an `opening` of 396.0 x 29.5, the pitch is 31.3 and the first slot starts 92.2 mm down. They are moved 0.75 mm right, to centre the cage in the
      444.5 mm body. The EX9208 photograph reads the first plate's top edge at 90.9 mm, 1.3 mm above the MX480's reading, inside its pixel.
  slot-tabs:
    confidence: estimated
    note: >-
      EX9208 front photograph: a grey strip at the left of the cage carries a tab beside each slot, the six line card tabs light grey and the two Switch
      Fabric tabs blue. The MX480's strip is carried, moved 0.75 mm right. The slot numbers are printed on the tabs and the craft interface prints the
      same numbers: line cards 5 to 0 from the top, then SF1 and SF0.
  front-top:
    confidence: estimated
    note: >-
      EX9208 front photograph: a hex vent field runs across the top band from about 30 to 430 mm across, with the ESD warning label at its left and the
      ESD point under the label. The MX480 device's point is carried (juniper/mx480 provenance front-vent-esd), moved 0.75 mm right. The guide's Figure 5
      calls out the ESD point at the front top left.
  craft:
    confidence: estimated
    note: >-
      The craft interface is the part juniper/ex9208-craft@1, 420.9 x 42.0 mm at 11.0 mm across and 38.8 mm down. The EX9208 photograph reads its top
      edge at 38.8 mm and its left edge at 10.5 mm; the MX480 places it at 38.6.
  populated-with:
    confidence: estimated
    note: >-
      EX9208 front photograph: SF0 and SF1 carry an EX9200-SF with an EX9200-RE seated in each, one slot above them carries a blank panel, and the
      other five carry line cards that the photograph does not name. The line cards are not modelled. Every configuration seats the generation its
      Table 5 row names. The device's default configuration is `base`; the redundant EX9200-SF3 build with four AC supplies (EX9208-RED3C-AC) is the newest configuration.
  rear:
    confidence: estimated
    note: >-
      EX9208 rear photograph (1.44 px/mm), read on a millimetre grid: four supply bays across the top, 101.6 mm wide on a 103.7 mm pitch from 8.5 mm
      across (the left edges read 8.4, 112.9, 216.7 and 320.7 mm), 13.8 mm down and 89.7 mm high with the screw flange; a plate below them with a light
      label from 44.0 to 384.2 mm across and 122.1 to 184.1 mm down, which prints PEM 0 to PEM 3 (starting at 49.3, 151.6, 255.3 and 359.2 mm), AIR
      FILTER (49.3 mm) and FAN TRAY (367.5 mm), and a caution text that is not transcribed; the air filter handle plate at 18 to 35 mm across and the fan
      tray handle plate at 395 to 410 mm, both from about 175 to 251 mm down; a dark door strip at the right from 396 mm across with FANTRAY-MX480-HC
      printed up it; a dark steel-blue plate at 56 to 94 mm across and 226 to 318 mm down that no text names; the rear ESD point (352.6 mm across,
      207.2 down) with its yellow ESD label to its right; the earthing pair at the upper right (431.1 mm across, 24.9 and 41.6 down).
  esd:
    confidence: estimated
    note: >-
      Guide Figure 5 and Figure 6 call out an ESD point at the front top left and one on the rear plate. The photographs show both.
  ground-stud-size:
    confidence: datasheet
    note: >-
      Guide, power supply description: a separate protective earthing terminal sized for UNC 1/4-20 ground lugs sits on the chassis. Guide Figure 42 gives
      the lug. The MX480 guide gives the terminal as two threaded inserts at 0.625 in (15.86 mm) centres, which `juniper/mx-ground-stud-pair-5-8@1` draws
      at 15.875. The size is the pair placement's `stud-size`.
  airflow:
    confidence: datasheet
    note: >-
      Guide, "Airflow Direction in the EX9208 Switch Chassis" and Figure 22: air enters at the side of the chassis next to the air filter, is pulled
      through the chassis towards the fan tray and leaves through the other side. The supplies take air from the front of the chassis and exhaust at
      the rear. The chassis is side-to-side. There is no back-to-front build, so no handle colour follows from airflow and none is written.
  fan-and-filter:
    confidence: datasheet
    note: >-
      The fan tray is `juniper/mx480-fan-tray@1`: the datasheet's ordering table names "FFANTRAY-MX480-HC-S EX9208 fan tray, spare", the EX9208 rear
      photograph prints FANTRAY-MX480-HC up the fan door, and the MX480 guide names FFANTRAY-MX480-HC the high-capacity fan tray. The air filter is
      `juniper/mx480-air-filter@1`: the datasheet names "FLTR-KIT-MX480-S EX9208 Air Filter, spare" and the MX480 guide names FLTR-KIT-MX480. Neither
      component is edited.
  psus:
    confidence: estimated
    note: >-
      Table 5: three or four 2520 W AC supplies, or four DC supplies. The two supply parts are `juniper/ex9200-pwr-mx480-2520-ac@1` and
      `juniper/ex9200-pwr-mx480-2400-dc@1`; the datasheet's ordering table names PWR-MX480-2520-AC-S and PWR-MX480-2400-DC-S as the EX9208 spares. Table 5
      lists the empty bay as holding a blank panel; no figure or part number for a supply blank is held, so an empty bay is shown open. See the gap psu-blank.
  covers:
    confidence: datasheet
    note: >-
      Table 5: blank panels for the line card slots in every configuration, and "cover panels" for empty supply slots and one EX9200-SF module cover
      panel in the older ones. The datasheet's ordering table names EX9200-LC-SF-BLANK, "EX9200 line card, switch fabric blank cover panel, spare",
      which is `juniper/ex9200-lc-sf-blank@1`; the EX9208 photograph shows one in the slot above the Switch Fabric modules.
  configurations:
    confidence: datasheet
    note: >-
      Guide Table 5 lists twelve shipping configurations, the datasheet adds the TAA builds EX9208-BASE3B-AC-T and EX9208-RED3B-AC-T and the spare
      chassis EX9208-CHAS3-S. They differ in the Switch Fabric generation (EX9200-SF, -SF2 or -SF3), the Routing Engine generation, the supply type
      and the supply count, and in nothing else on the face, so each is a configuration of this one device. The TAA builds are the same chassis as
      their base build, and each is a configuration of its own with the same bays, so that each part number exports as a device type. Table 5 captions EX9208-RED3C-DC and EX9208-RED3B-DC "with 2520 W AC power supplies" and
      lists four DC supplies in each; the DC supplies are followed.
  other-faces:
    confidence: estimated
    note: >-
      Guide Figures 5 to 7 draw the right side as a round-hole air exhaust and intake field and the left side as plain metal. The MX480 device carries
      the same estimate and so does this one. Axis conventions per viewer3d.js: LEFT view x = 0 is the REAR, RIGHT view x = 0 is the FRONT, top and
      bottom y = 0 at the FRONT.
  power:
    confidence: datasheet
    note: >-
      Guide Table 24: base system 560 W typical and reserved, redundant system 800 W; Switch Fabric modules and line cards are on their own contracts.
      Datasheet: maximum power draw 4,831 W (AC) and 4,388 W (DC) and maximum thermal output AC 16,473 BTU per hour (4,831 W), DC 14,963 BTU per hour
      (4,388 W).
  lifecycle:
    confidence: datasheet
    note: >-
      The datasheet (Aug 2022) lists the EX9208 as current. A web search made on 2026-10-24 found no Juniper end-of-life or end-of-sale notice for the chassis;
      two third-party trackers disagree about an end-of-service date, and none is carried (see the gap eol).
  color:
    confidence: estimated
    note: >-
      EX9208 photographs: dark charcoal chassis bands and card faces, a grey craft panel with a light blue accent line, light blue ejector levers,
      bright aluminium rear plate and supplies.
