configurations:
  base:
    kind: base
    default: true
    source: >-
      derived - built from the group roles rather than from a vendor bundle: every bay whose group is `service` or `management` keeps its seat, and
      every `traffic` bay takes a blank. This vendor publishes no base configuration for this chassis under that name, so the library defines one.
    description: >-
      Chassis only, as every shipping order is built before line cards. The six line card slots hold blank panels. The Switch Fabric modules, the craft
      interface, the four supplies, the fan tray and the air filter keep their seats. Line cards are ordered separately.
    bays:
      lc5: juniper/ex9200-lc-sf-blank@1
      lc4: juniper/ex9200-lc-sf-blank@1
      lc3: juniper/ex9200-lc-sf-blank@1
      lc2: juniper/ex9200-lc-sf-blank@1
      lc1: juniper/ex9200-lc-sf-blank@1
      lc0: juniper/ex9200-lc-sf-blank@1
    power: ac
  base3c-ac:
    kind: orderable
    power: ac
    description: >-
      EX9208-BASE3C-AC: one EX9200-SF3 module with one EX9200-RE2 in SF0, one fan tray and three 2520 W AC supplies in PEM0 to PEM2. Blank panels
      fill the line card slots and SF1.
    bays:
      sf1: juniper/ex9200-lc-sf-blank@1
      pem3: ''
    part-numbers:
      EX9208-BASE3C-AC: {}
  red3c-ac:
    kind: orderable
    power: ac
    description: >-
      EX9208-RED3C-AC: two EX9200-SF3 modules with two EX9200-RE2, one fan tray, four 2520 W AC supplies and blank panels for the line card slots.
    part-numbers:
      EX9208-RED3C-AC: {}
  red3c-dc:
    kind: orderable
    power: dc
    description: >-
      EX9208-RED3C-DC: two EX9200-SF3 modules with two EX9200-RE2, one fan tray, four DC supplies and blank panels for the line card slots. Table 5
