format: 1
kind: device
name: ex3400-48t
version: 0.2.1
maturity: modelled
manufacturer: Juniper
model: EX3400-48T
portfolio: {line: EX Series, family: EX3400}
description: >-
  Juniper EX3400-48T, a 1U access switch with 48 10/100/1000BASE-T ports and no PoE. It has four SFP or
  SFP+ uplink ports and a Mini-USB console port on the front. The rear has two QSFP+ uplink ports, a management
  port, an RJ-45 console port, a USB port, two fan modules and two power supply slots. It ships with one
  150 W AC supply, and a blank panel covers the second slot. The back-to-front EX3400-48T-AFI and the
  DC-powered EX3400-48T-DC have the same front panel, so they are configurations of this device.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX3400 Switch Hardware Guide, Juniper Networks, published 2026-01-09 (317 pages): Tables 1 to 3,
      10 to 13 and 19, Figures 1 to 4 and 7 to 10, the packing list (Table 36) and the mounting topics.
      Juniper image-library studio photograph ex3400-48t-front-high, straight on, which supplies the front
      positions. No studio photograph of the EX3400-48T rear was found, so the rear is read from the EX3400-48P
      rear photograph (ex3400-48p-rear-high), and the community NetBox rear elevation of the EX3400-48T
      was used only to confirm that the rear panel and the 150 W supply look the same. The HPE PSNow datasheet
      (a50014095enw) did not answer from this host, so no datasheet figure is used. The guide is copyright
      Juniper Networks, 2026, all rights reserved, and the studio photographs come from the maker's public
      image library; no terms of use are stated on the files. Nothing of either is copied here, since
      every face is drawn new from measurements. End of life was searched on 2026-10-21: only reseller
      pages for Juniper support bundles (the B-EX3400-...-E part numbers, announced 2020 and 2023) came
      up and no Juniper notice for the hardware, so the lifecycle is recorded as none announced.
  chassis:
    confidence: datasheet
    note: >-
      Table 3 - height 1.72 in. (4.37 cm), width 17.4 in. (44.1 cm), or 19 in. (48.2 cm) with the mounting
      brackets attached, depth 13.78 in. (35 cm) with no power supply installed and 15.05 in. (38.24 cm)
      with one. The body of 441.0 mm is the metal between the bracket fold lines, and the 43.7 mm height
      is the metric figure as printed. The depth carried is the 350.0 mm of the bare chassis, and the
      supply adds the rest. Weight is 10.23 lb (4.64 kg) without supplies or fan modules.
  scale:
    confidence: photo-measured
    note: >-
      Gate 1 - the front photograph is a straight-on studio shot. The face measures about 1460 px across
      in the 1500 px wide file. Against 441.0 mm that is 3.31 px/mm, and the right-hand block of the EX3400-48P
      and EX3400-48T photographs lands at the same millimetre positions (the uplink cage block starts
      at 363.7 and 363.9 mm), so the two faces are one design and the EX3400-48P positions are used at
      3.327 px/mm. The photograph is orthographic and carries geometry. Every figure read off a picture
      is estimated and good to about 0.4 mm.
  ports:
    confidence: photo-measured
    note: >-
      Table 1 and Figure 2 give 48 RJ-45 ports in four blocks of 6 columns by 2 rows, and four uplink
      cages. The jack and cage positions are those of the EX3400-48P, which the 48T photograph confirms
      to within a pixel or two: block starts 9.0 mm and a block step of 88.8 mm, the registry's 13.97
      mm ganged pitch, two rows 14.0 mm apart with the upper row turned 180 so that its keyway and lamp
      tabs face up. The four SFP cages start at 363.7 mm and abut on the registry's 14.25 mm pitch.
  port-numbering:
    confidence: photo-measured
    note: >-
      The legends under each column pair read 0 and 1, then 2 and 3, up to 46 and 47, so the upper jack
      of a column is the even port and the lower the odd one. The guide labels the ports 0 through 47.
      The uplink cages are printed 0 to 3 under the cages on the front, and the rear QSFP+ ports 0 and
      1. Interface names such as ge-0/0/0 are not printed on the metal and are not stated in this guide,
      so none is recorded.
  port-lamps:
    confidence: datasheet
    note: >-
      Figure 7 - each RJ-45 jack has two lamps, a Link/Activity lamp at the left corner and a Status lamp
      at the right corner of its keyway side. The common/rj45-ganged-eth@1 housing carries both. Figure
      8 - each SFP+ uplink has a Link/Activity lamp left of its number and a Status lamp right of it.
      The photograph shows them as tall light-pipe slots, drawn as common/led-rect@1 turned 90. The Status
      lamp on a jack shows speed, duplex or enabled state according to the mode lamps, so its states are
      not expressible as one vocabulary here (see gaps).
  status-block:
    confidence: photo-measured
    note: >-
      Figure 5 and Table 4 give the chassis lamps SYS, ALM and MST. Figure 10 and Table 8 give the port
      mode lamps SPD, DX, EN and PoE and the Factory Reset/Mode button that switches them. The lamps are
      read off the EX3400-48P photograph at the right end (x 426.1 and 432.2 mm, y 5.0 to 18.5 step 4.5),
      and the 48T photograph shows the same four mode legends.
  front-console:
    confidence: photo-measured
    note: >-
      Figures 1 and 2, callout 5, and Console Ports (p4): the front-panel Mini-USB Type-B console, printed
      CON, which accepts a Mini-B plug (5-pin). It is the placed std/mini-usb (`console-usb`), centred
      on the 7.6 x 3.0 mm shell this device was drawn with from the EX3400-48T front photograph (ex3400-48t-front-high).
      The part draws the registry's 7.7 x 3.9 mm Mini-B shell, which stands in for the maker's own (gap
      `mini-usb-console-shell`).
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      The guide's Figure 2 draws the printing too small to read, so the photograph wins for every legend.
      The EX3400-48T photograph prints "EX3400", with no PoE+ mark, and still prints the POE mode legend
      and lamp. Figure 1 and the front panel topic say the PoE lamp is present only on models with PoE,
      and Table 8 says it is not available without PoE. The legend and lamp are drawn as photographed,
      and the lamp is never lit on this model. The port numerals print light grey on this photograph,
      not orange as on the PoE models: #c1bcba, the median of the 20 brightest pixels in the numeral row
      below the jacks (193, 188, 186; the surrounding face is about 150, 152, 155). The ink is thin, so
      the sample is a floor on its true value.
  rear:
    confidence: photo-measured
    note: >-
      Figure 3 and the EX3400-48P rear photograph, read at 3.327 px/mm across and 3.30 px/mm down. From
      the left, the management corner holds the MGMT RJ-45 over a USB-A port, then the CON RJ-45, a lighter
      plate with two earthing holes, the earth symbol, two QSFP+ cages marked 0 and 1 with a lamp slot
      pair under each, and the ESD socket. Then come fan 0 at 133.7 mm and fan 1 at 182.0 mm, a label
      plate for the CLEI code and serial number labels, power supply slot 0 at 271.7 mm and slot 1 at
      354.4 mm.
  rear-modules:
    confidence: estimated
    note: >-
      Both power supply bays are drawn at the supply's own 71.2 by 39.0 mm face, measured on slot 0 of
      the EX3400-48P. The blank panel in slot 1 is photographed 76.6 by 41.0 mm because it overlaps the
      frame of the slot, and is drawn at the supply size so that it fills the same bay. Slot 1's position
      is the slot 0 position plus the 82.7 mm spacing of the two numerals. The 150 W supply is drawn like
      the 920 W one that the photograph shows.
  earthing:
    confidence: datasheet
    note: >-
      Table 41 - the EX3400 earthing terminal is on the rear panel, with two 10-32 screws and a two-hole
      lug. Figure 3 callout 4. The hole spacing is not stated in the guide; the photograph puts the two
      holes 16.0 mm apart. They are juniper/ex3400-ground-pair@1, two 10-32 screws on the 5/8 in. (15.875
      mm) pitch of a two-hole lug, on the lighter plate that the photograph shows.
  ears:
    confidence: datasheet
    note: >-
      Mounting topics - two brackets and eight screws ship in the box and mount along the front or the
      rear of the side panels. The separately orderable four-post rack-mount kit holds flush and 2-in.-recess
      front-mounting brackets, side rails and rear blades. The recess is 2 in. (50.8 mm). The guide gives
      no part number for the four-post kit or for the wall-mount kit, so neither is listed under kits,
      and the guide's figures place the brackets without a measurable fold line, so only the recess has
      an `at`.
  color:
    confidence: photo-measured
    note: >-
      photo-measured - median of the bare face between the port block and the bottom edge in the EX3400-48P
      front photograph, #9ea1a5, darkened to #8c9094 for the face as a whole; the uplink plate is darker
      (#6b6f73). The rear and the fan and supply colours are sampled the same way.
  power:
    confidence: datasheet
    note: >-
      Table 11 - the EX3400-48T consumes at most 120 W and has no PoE. Table 19 gives 3 A at 100 VAC and
      1.5 A at 240 VAC.
  fru-bays:
    confidence: datasheet
    note: >-
      Table 2 and the guide's field-replaceable units topic - power supplies and fan modules are hot-removable
      and hot-insertable FRUs seated in bays, as are transceivers. The switch ships with one power supply
      and two fan modules (Table 36). With one supply the switch must be powered off before the supply
      is removed. Both fan modules must be installed for normal cooling. A supply and the fans must have
      the same airflow direction.
attrs:
  physical:
    weight: 4.64 kg (10.23 lb) without power supplies or fan modules (Table 3)
    weight-fru: JPSU-150-AC-AFO 0.65 kg, fan module 0.72 kg (Table 3)
    depth-with-power-supply: 382.4 mm (15.05 in.) with a power supply installed (Table 3)
    width-with-brackets: 482 mm (19 in.) with the mounting brackets attached (Table 3)
  power: {power-max-w: 120, power-envelope: unstated, power-input-ac: '100 through 240 VAC, 50 or 60 Hz
      (Table 19)', power-current-max: 3 A at 100 VAC and 1.5 A at 240 VAC (Table 19)}
  environmental:
    operating-temp: 0 to 45 C (32 to 113 F) (Table 22)
    altitude: no performance degradation up to 3048 m (10,000 ft) (Table 22)
    humidity: 10 to 85 percent, noncondensing (Table 22)
  platform: {first-junos-release: 15.1X53-D50 (Table 1)}
  features:
    macsec: IEEE 802.1AE MACsec on all Gigabit and 10 Gigabit Ethernet ports, 88 Gbps of encryption
    virtual-chassis: up to 10 switches. The QSFP+ ports are Virtual Chassis ports by default
    uplink-ports: four SFP or SFP+ ports on the front and two QSFP+ ports on the rear
    optics-sfp-plus: >-
      the front uplink ports take SFP and SFP+ transceivers, singly or mixed. The supported list is in
      Juniper's Hardware Compatibility Tool, which the guide names and which is not held here
    optics-qsfp: >-
      the rear uplink ports take QSFP+ transceivers. The supported list is in Juniper's Hardware Compatibility
      Tool, which the guide names and which is not held here
  management:
    oob: management Ethernet RJ-45 on the rear panel, with a Link/Activity lamp and a Status lamp
    console: >-
      RJ-45 console on the rear panel and Mini-USB Type-B console on the front, both labelled CON
    usb: one USB port on the rear panel
  compliance:
    seismic: Complies with Zone 4 earthquake requirements per GR-63, Issue 4 (Table 22)
  lifecycle: {eol: none-announced}
