  color: '#8c9094'
  silk: '#eef0f2'
  airflow: front-to-back
  power: ac
  ears:
    positions:
    - {name: flush, label: front-mount, at: 0, default: true}
    - {name: recessed, label: 2-in. recess, at: 50.8}
    - {name: rear, label: rear-mount}
gaps:
- what: mini-usb-console-shell
  scope:
  - console-usb
  reason: needs-photo
  note: >-
    The part is the registry's Mini-B receptacle (Molex drawing SD-54819-026, 7.7 x 3.9 mm). The EX3400-48T
    front photograph shows the console at 3.3 px per mm, too small to give the maker's shell to better
    than a few tenths of a millimetre, and no close-up is held, so the drawn shell and its place are estimates.
  wanted: >-
    A straight-on close-up of the console port with a scale, or the maker's dimensioned drawing of it.
- what: dc-input-current
  scope:
  - psus
  reason: sources-disagree
  wanted: >-
    Which DC input rating to provision. Table 20 gives 4.7 A maximum at -48 VDC, and its note advises
    a 10 A breaker. The connection topic (Connecting DC Power to an EX3400 Switch) says to terminate on
    a source that supplies at least 7.5 A at -48 VDC. Neither rating is modelled as a figure on the supply;
    Table 20's 4.7 A is carried.
- what: ex3400-48t-dc-t1
  scope:
  - dc
  reason: needs-drawing
  wanted: >-
    The EX3400-48T-DC-T1, the 1 OU ORv3 switch-tray assembly (Table 38), is not modelled. It mounts on
    a tray in an ORv3 rack, which is not a 19 in. rack mount, and the guide gives no drawing of its faces.
- what: afi-photographs
  scope:
  - psus
  - fans
  reason: needs-photo
  wanted: >-
    A photograph of the back-to-front power supply and fan module, to say whether their handles are a
    different colour from the front-to-back ones. The guide states no handle colour.
- what: port-status-lamp-states
  scope:
  - rj45
  reason: vendor-silent
  wanted: >-
    A per-port vocabulary for the Status lamp. Table 8 gives it three meanings that depend on the mode
    the Factory Reset/Mode button chose, so the jack keeps the component's default off, link and activity
    states, and the mode lamps carry the meaning.
- what: label-plate
  scope:
  - rear
  reason: needs-drawing
  wanted: >-
    The size of the CLEI code label and the Serial Number ID Label on the rear plate between fan 1 and
    power supply 0 (Figure 3 callouts 8 and 9). The plate and its corner marks are drawn as one grey rectangle.
- what: power-supply-depth
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The depth of a power supply and of a fan module. Table 3 gives a chassis depth of 350.0 mm with no
    supply and 382.4 mm with one, and the guide gives no dimension for the modules.
- what: rear-photograph
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    A studio photograph of the EX3400-48T rear, and a photograph of the 150 W supply. The rear is drawn
    from the EX3400-48P photograph.
- what: interface-names
  scope:
  - rj45
  - sfp-plus
  - qsfp-plus
  reason: vendor-silent
  wanted: >-
    The Junos interface names (ge-0/0/n, xe-0/2/n and the QSFP+ names). This guide names only the PIC
    numbers in Table 2, 0 for the RJ-45 ports, 1 for the QSFP+ ports and 2 for the SFP+ ports.
- what: four-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: A flat drawing or photograph of the lid, the underside and the side panels.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g}
    description: 48 ports labelled 0 to 47, the even ports on the upper row
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: Four front uplink ports labelled 0 to 3. Each takes an SFP or an SFP+ transceiver
  uplink-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: 'on', color: '#22c55e'}
    - {name: blinking, color: '#22c55e', behavior: blinking}
    description: >-
      A Link/Activity lamp and a Status lamp beside each front uplink port. Table 7 - the Link/Activity
      lamp blinks green with traffic and is steady green with a link and no traffic. Table 9 - the Status
      lamp is steady at 10 Gbps, blinking at 1000 Mbps, and unlit when the port is down
  qsfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp, speed: 40g}
    description: Two rear QSFP+ uplink ports labelled 0 and 1. They are Virtual Chassis ports by default
  qsfp-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: 'on', color: '#22c55e'}
    - {name: blinking, color: '#22c55e', behavior: blinking}
    description: >-
      A Link/Activity lamp and a Status lamp under each rear QSFP+ port. Table 7 - the Link/Activity lamp
      blinks green with traffic and is steady green with a link and no traffic. Table 9 - the Status lamp
      is steady when the 40-Gigabit port is up and unlit when it is down
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the management corner - the out-of-band RJ-45, the RJ-45 console, the Mini-USB console, the USB
      port and the Factory Reset/Mode button
  status-leds: {term: LED, role: indicator, index-origin: 0, description: 'SYS, ALM and MST chassis lamps
      (Table 4)'}
  mode-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      SPD, DX, EN and PoE port mode lamps (Table 8). The Factory Reset/Mode button chooses which one shows
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        1+1 - the switch ships with one supply and takes a second. In the EU, Egypt, Nigeria, Saudi Arabia,
        Serbia, South Korea and South Africa the guide requires the redundant supply (Table 11 note)
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy-note: Both fan modules must be installed and working for normal cooling (fan removal
        topic)
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the rear earthing terminal, two 10-32 screws for a two-hole lug (Table 41)
  esd: {term: Point, role: furniture, index-origin: 0, description: the rear wrist-strap ESD point (Figure
      3 callout 6)}
