configurations:
  ac:
    kind: orderable
    description: >-
      The switch as shipped: one 150 W AC supply in slot 0, a blank panel over slot 1 and two fan modules.
      Airflow is front to back.
    default: true
    part-numbers:
      EX3400-48T: {}
  ac-afi:
    kind: orderable
    description: >-
      The back-to-front switch (Table 1) - one 150 W JPSU-150-AC-AFI supply in slot 0, a blank panel over
      slot 1, and two airflow-in fan modules. Air enters at the rear and leaves at the front. The front
      panel is the same.
    airflow: back-to-front
    part-numbers:
      EX3400-48T-AFI: {}
    bays: {psu-0: juniper/ex3400-jpsu-150-ac-afi@1, fan-0: juniper/ex3400-fan-afi@1, fan-1: juniper/ex3400-fan-afi@1}
  dc:
    kind: orderable
    description: >-
      The DC-powered switch (Table 1) - one 150 W JPSU-150-DC-AFO supply in slot 0 and a blank panel over
      slot 1. Airflow is front to back. The front panel is the same.
    power: dc
    part-numbers:
      EX3400-48T-DC: {}
    bays: {psu-0: juniper/ex3400-jpsu-150-dc-afo@1}
references:
- title: EX3400 Switch Hardware Guide, Juniper Networks, published 2026-01-09
  url: https://www.juniper.net/documentation/us/en/hardware/ex3400/ex3400.pdf
