format: 1
kind: device
name: mx960
version: 4.0.0
maturity: modelled
manufacturer: Juniper
model: MX960
portfolio:
  line: MX Series
  family: 3D Universal Edge Router
description: >-
  Juniper MX960 - the 16RU chassis that turns the MX240/MX480 family
  vertical: fourteen card slots stand side by side in the cage (six line
  slots, SCB0/SCB1, then six more, the first of which doubles as SCB2 in
  redundant fabric configurations). The craft interface spans the top
  with one status cluster per slot; fan trays sit horizontally above and
  below the cage behind bezels, and the standard cable manager hangs
  under it. Four tall AC supplies fill the rear under the inlet strip.
profile: networking
provenance:
  card-slots:
    confidence: photo-measured
    note: >-
      the MX960 front photograph, re-read for #261: the fourteen slots hold the SAME card as the
      MX240 and MX480, turned 90 - the guide states an MPC/DPC/SCB as one 17 x 22 x 1.25 in part
      in all three books, and the photograph reads each card's model label top to bottom with
      OK/FAIL upright, which is the horizontal card at rotate 90. So each slot seats the
      horizontal @2 card at `rotate: 90`, footprint 29.5 x 413.5 with `opening` 29.5 x 396.0,
      and the 21 vertical twins are gone. The plates run y px 322-1136.5 = 396.6 mm at the
      photograph's 2.054 px/mm down the 704.9 mm height (393.0-396.6 depending on the scale
      taken), centred at chassis y 353.15; lever tip to lever tip reads about 860 px,
      411.7-414.6 mm. The slot pitch is 31.0: the gaps between the plates sit 64.25-64.5 px
      apart, 30.8-31.1 mm, so the fourteen slots span 434.0 of the 441.1 width, centred. Until
      2.0.0 the slots were 30.1 x 405.0 on a 30.1 pitch.
  sources:
    note: >-
      MX960 Hardware Guide (868 pages), the MX portfolio datasheet, and the studio front and rear
      photographs in the image library
  chassis:
    confidence: datasheet
    note: >-
      datasheet-table - 27.75 x 17.37 x 23.0 in (704.9 x 441.1 x 584.2 mm), 16RU; the standard
      cable manager extends depth to 711 mm. Ears NOT MODELLED by convention
  front:
    note: >-
      photo - the studio front photograph at ~2.07 px/mm: craft interface ~48 mm tall over the
      upper fan bezel, a card cage of fourteen 31.0 mm slots, the lower fan bezel and the
      cable-manager grille. Cards stand VERTICAL: each slot seats the horizontal MX240/MX480
      card turned 90 (card-slots)
  slot-order:
    note: >-
      guide + photo - line slots 0-5, SCB0, SCB1, then 6-11; the craft interface prints the SCB
      positions blue, and slot 6 accepts either a line card or SCB2 (redundant fabric takes a line
      slot)
  rear:
    note: >-
      photo - the rear studio photograph at ~1.55 px/mm: exhaust grille top, the chassis inlet
      strip (four C20 inlets with their switches, one per supply), a vent band, four ~103 x 480 mm
      supply bays and the lower tray with its four cable spools
  power:
    confidence: datasheet
    note: >-
      guide power requirements, Table 95 - base system 50 W (maximum and typical), normal-capacity
      cooling 600 W maximum at full fan speed and 400 W typical at normal speed, high-capacity
      cooling 640 W and 450 W; the guide defines typical as power under certain temperatures and
      normal operating conditions. Table 96 rates the FRUs, and every module this chassis accepts
      carries a figure on its contract except the craft interface (L29). The guide gives no
      chassis total and instructs a per-configuration budget; the MX Series family datasheet does
      give one, typical power draw 6520 W AC and 6670 W DC, with no configuration, ambient or side
      named - carried as power-typical-w (AC) with the DC figure in power-typical-scope, envelope
      unstated. Table 98 is a worked sample (eleven MPC-3D-16XGE-SFPP, three SCBE2, 6265 W
      output on normal-capacity AC) and is not carried. Table 84 states maximum thermal output AC
      27,007 BTU/hour (7920 W) and DC 18,987 BTU/hour (5568 W) - carried under thermal as a
      provisioning ceiling
  color:
    note: >-
      photo - dark charcoal chassis and craft, silver cards and supplies, light-blue craft accent
      line
  other-faces:
    note: >-
      near-blank by evidence - rail bands estimated; axis conventions per viewer3d.js as the
      siblings

attrs:
  physical:
    weight-max-kg: 169.64
  power:
    power-typical-w: 6520
    power-envelope: unstated
    power-typical-scope: AC typical power draw from the MX Series family
      datasheet, which names no configuration, ambient or side; DC 6670 W
    base-system-w: 50
    cooling-system-w: 640 W high-capacity at full speed (450 W typical at
      normal speed); normal-capacity 600 W (400 W typical) - Table 95
  thermal:
    max-thermal-output: AC 27,007 BTU/h (7920 W); DC 18,987 BTU/h (5568 W)
      (Table 84; provisioning ceiling)
chassis:
  width: 441.1
  height: 704.9
  depth: 584.2
  ru: 16
  color: '#3a3e43'
gaps:
  - what: card-catalogue
    scope: [fpcs]
    reason: needs-photo
    wanted: the rest of the MX960 card range - the slots seat the shared
      MX240/MX480 card catalogue turned 90, and the photographed unit also
      shows a 4-port tunnel-services card that is not identified in the
      extraction. The shared cards it seats took the MX240 and MX480
      photographs' corrections at 4.0.0 (DPC-R-4XGE ports, SCB-MX Routing
      Engine bay, DPCE-R-40GE OK/FAIL lamp) in issue 891; none was re-read on
      this chassis's own photograph.
  - what: fan-trays
    reason: needs-photo
    wanted: the two horizontal fan trays - they sit behind the front
      bezels above and below the cage and are drawn as the bezels, not
      as FRU bays; a tray face photograph would let them become bays.
  - what: dc-power-variant
    scope: [psus]
    reason: needs-photo
    wanted: the DC PEM and high-capacity variants; only the photographed
      AC unit is modelled.
groups:
  craft:
    term: Panel
    role: management
    index-origin: 0
  fpcs:
    term: Slot
    role: traffic
    index-origin: 0
    description: vertical line-card slots 0-11 (slot 6 doubles as SCB2)
  scbs:
    term: Slot
    role: service
    index-origin: 0
    description: Switch Control Board slots SCB0 and SCB1
    attrs:
      redundancy: '2+1'
      redundancy-note: '2+1 - mx960 hardware guide, "The MX-Series SCB": the MX240 and MX480 take two SCBs for 1+1, where the MX960 takes three for 2+1. THE FORM COUNTS THREE CARDS AND THIS GROUP HOLDS TWO BAYS: SCB0 and SCB1 are the dedicated ones, and the third SCB seats in line-card slot 6 (see `fpcs`), which is why the count here does not match the form. One form covers control and fabric together because the SCB does both - the fabric is integrated into the SCB and the Routing Engine installs directly into it - and "MX960 Component Redundancy" gives the control half as a primary/backup host-subsystem pair'
  psus:
    term: PEM
    role: service
    index-origin: 0
    description: four AC supplies at the rear, PEM 0-3
    attrs:
      redundancy: '2+2'
      redundancy-note: '2+2 for the high-voltage second-generation universal supply, per its Redundancy row. Earlier high-capacity supplies are zoned and run 3+1 per system, three sharing the load evenly with a fourth providing full redundancy - the figure here is the second-generation one'
  inlets:
    term: Inlet
    role: service
    index-origin: 0
    description: >-
      the four C20 receptacles at the rear, one per PEM. A separate group from
      `psus` because they are separate objects - the inlet is the cord's end and
      stays with the chassis while a PEM comes out - and because sharing `psus`
      would put two things at every rel-pos 0-3.
