configurations:
  ac:
    kind: base
    description: >-
      EX2300-C-12P - 12 PoE+ ports and two SFP+/SFP uplinks, built-in AC supply, fanless. Table 1, no
      Virtual Chassis licence.
    default: true
    part-numbers:
      EX2300-C-12P: {}
  taa:
    kind: orderable
    description: >-
      EX2300-C-12P-TAA - the same chassis sold as Trade Agreements Act compliant (Table 1); the front
      panel and rear are those of the EX2300-C-12P.
    part-numbers:
      EX2300-C-12P-TAA: {}
  vc:
    kind: orderable
    description: >-
      EX2300-C-12P-VC - the same chassis with the Virtual Chassis licence (Table 1). The packing list
      adds a paper licence. The front panel and rear are those of the EX2300-C-12P.
    part-numbers:
      EX2300-C-12P-VC: {}
