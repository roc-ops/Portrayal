format: 1
kind: device
name: ex4000-12mp
version: 2.0.1
maturity: modelled
manufacturer: Juniper
model: EX4000-12MP
portfolio: {line: EX Series, family: EX4000}
description: >-
  Juniper EX4000-12MP, a compact fanless multigigabit access switch with 12 PoE++ ports (60 W per port,
  240 W budget): four 100 Mbps/1 Gbps/2.5 Gbps ports (labelled 0 to 3 and bracketed MG) and eight 10/100/1000BASE-T
  ports. The front carries the 12 jacks in two rows, four SFP+ cages (the first two are Virtual Chassis
  ports and the other two uplinks), the RJ-45 management port over a USB 2.0 Type-A port, the RJ-45 console
  port, a reset pinhole and the SYS, MST and CLD status lamps. The rear has the AC inlet, two finned heat-sink
  vents and the earthing terminal. The power supply is built into the chassis and the switch has no fan,
  so there are no bays. It stands on a desk by default; the optional two-post kit EX4000-2PST-RMK mounts
  it in a rack.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX4000 Switch Hardware Guide, Juniper Networks, published 2026-01-20 (261 pages; PDF created 2026-01-20;
      fetched from https://www.juniper.net/documentation/us/en/hardware/ex4000/ex4000.pdf, which answered):
      Table 3 (models), Figure 7 and Figure 8 (the EX4000-12MP front and rear panels, flat drawings),
      Tables 12 and 13 (cooling, power and the physical specifications and ports), Table 26 (chassis),
      Tables 27 to 33 (the lamps), Table 34 (input), Table 35 (PoE budget), Table 5 (mounting kits) and
      the mounting topics. EX4000 Line of Ethernet Switches Datasheet, Juniper Networks (PDF created 2025-05-28,
      14 pages; https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex4000-line-of-ethernet-switches-datasheet.pdf):
      Table 1 (the SKUs), Table 2 (maximum system power without PoE), the specifications and the ordering
      information. Juniper's image-library photographs ex4000-12mp-front-high.jpg and ex4000-12mp-rear-high.jpg
      (from https://www.juniper.net/us/en/company/images/image-library-logos-and-product-photos/products/ex4000-12mp.html,
      2100 px wide, straight on). The guide prints no terms of use; the image-library page prints none
      either. Nothing of any of them is copied here, since every face is drawn new from measurements.
      No Visio stencil and no 3D model of the EX4000 is held or published; the intake folder for Juniper
      EX and QFX was not available to this work and no held photograph, stencil or model was used. End
      of life was searched on 2026-10-23 and no Juniper notice for the EX4000 was found, so the lifecycle
      is recorded as none announced.
  chassis:
    confidence: datasheet
    note: >-
      Table 13 and Table 26 - height 1.75 in (4.44 cm), width 10.39 in (26.40 cm), depth 9.99 in (25.37
      cm), weight 6.94 lb (3.2 kg). The datasheet gives the same width, a height of 1.71 in (4.34 cm),
      a depth of 9.99 in (25.37 cm) with the power supply fins and a system weight of 3.15 kg. The guide's
      table is the table of chassis sizes and is carried, so the height is 44.4 mm (the 1U pitch); the
      photograph's face measures 43.2 mm from the top edge to the lower edge, the rest being the feet
      and the rounded lower corners, which are not drawn. The unit is 264.0 mm wide, not a rack width:
      the optional two-post kit EX4000-2PST-RMK (Table 5) carries it in a rack.
  scale:
    confidence: photo-measured
    note: >-
      Gate 1 on the front photograph (2100 x 675 px): the body runs from 191 to 1910 px, 6.51 px/mm against
      the 264.0 mm width, and the jack-label pitch reads the registry's 13.97 mm ganged pitch to within
      a percent. The guide's flat drawing (Figure 7, 2538 x 888 px) was used for what is on the face and
      for the callouts. The rear photograph (2100 x 607 px) was shot at a different size and is read between
      its own edges.
  front-layout:
    confidence: estimated
    note: >-
      estimated - Figure 7 and the front photograph. The 12 jacks stand in one shell of six columns and
      two rows, the first cell at 61.05 mm, the column pitch 13.97 mm (shell edges at 59.2 and 147.3 mm),
      the rows 14.3 mm apart with the upper row turned 180 so that its latch and lamps face up; the face
      is 1.0 mm higher than the 12P's in the photograph and the rows follow it. Four SFP+ cages abut on
      the registry's 14.25 mm pitch from 153.1 mm in one row at 23.6 mm, each with a small lamp either
      side of its number. The RJ-45 management port stands over the USB 2.0 Type-A port in one housing
      and the console port in its own. The status pill is at the top right and the reset pinhole at the
      right end.
  port-numbering:
    confidence: photo-measured
    note: >-
      The photograph and Figure 7 print 0 and 1, 2 and 3, up to 10 and 11 under the column pairs, each
      number followed by its triangle (an up triangle after the even number and a down triangle after
      the odd one), so the upper jack of a column is the even port. Ports 0 to 3 are inside an orange
      rounded outline with MG on its lower edge (Figure 7 callout 1: four 100 Mbps/1 Gbps/2.5 Gbps ports);
      the rest are plain. The four SFP+ cages are printed 0, 1, 2 and 3, with 0 and 1 inside a light rounded
      outline: the Virtual Chassis ports are 0 and 1 and the uplink ports 2 and 3 (Figure 7 callout 11).
      Port numbers are as printed on the metal, from 0. The guide gives no interface names, so none is
      recorded.
  port-lamps:
    confidence: datasheet
    note: >-
      Figures 22 to 25 and Tables 32 and 33 - each RJ-45 jack has a Link Activity lamp at one corner and
      a Status lamp at the other; the common/rj45-ganged-eth@1 housing carries both. Each SFP+ port has
      a Link Activity lamp and a Status lamp, the small bars either side of its number (Figure 25). Which
      bar is which lamp is not stated, so the left bar is taken as Link Activity by analogy with the jacks
      and is estimated. The Status lamp's colour shows speed (Table 32: amber 2.5 Gbps), so its states
      are not expressible as one vocabulary here (see gaps).
  status-block:
    confidence: estimated
    note: >-
      estimated - Figure 7 callouts 4, 5 and 6 and the photograph. The three chassis lamps SYS, MST and
      CLD sit in a rounded pill at the top right with a round lamp before each legend, as the photograph
      and the drawing show. Tables 27 to 30 give the lamp meanings; the CLD blink patterns are in another
      document and are not stated here.
  usb-reset:
    confidence: estimated
    note: >-
      estimated - Figure 7 callouts 7, 8 and 10. The USB 2.0 Type-A port under the management port, the
      reset pinhole (callout 8, with the reset symbol below) and the claim code label (callout 7, a QR
      code at the right of the drawing and absent from the photograph, so a region and not a part) are
      read off the figure and the photograph.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      The drawing and the photograph agree on what is on the face. The photograph prints the port numbers
      and the MG outline in orange, the drawing in black, and prints EX4000 MG PoE++ with MG PoE++ in
      orange. The Juniper logo and the driven by Mist AI line are not drawn: a logo-zone is reserved.
      The rounded corners and the feet of the compact case are not drawn.
  rear:
    confidence: estimated
    note: >-
      estimated - Figure 8 and the rear photograph. From the left: a round hole for the power cord retainer
      (callout 1), the AC inlet in a black housing with its rating printed under it (callout 2), a yellow
      hot-surface triangle, two finned black heat-sink vents with a screw head between them, and the two-hole
      protective earthing terminal on a lighter plate with the earth symbol under it (callout 3). The
      fins are drawn as vent openings without the ribs, and the triangle is drawn to the right of the
      photograph and 1 mm shorter so that it clears the standard 28 by 20 mm inlet aperture and the first
      screw head.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Table 12 and Table 13 - the switch has an internal power supply (fixed PSU) and no fan (natural
      convection cooling, fan-less switch); the guide's system overview says the EX4000 switch models
      have inbuilt fixed power supply units. The guide gives no replacement procedure and no part number.
      The supply is part of the chassis and not a bay and not a component.
  airflow:
    confidence: datasheet
    note: >-
      Table 12 and the cooling section - natural convection, no fan; the datasheet gives no airflow. The
      guide says not to block the vents on top of the switch.
  earthing:
    confidence: datasheet
    note: >-
      The Connect to Power topic and Figure 8 - a two-hole protective earthing terminal on the rear panel,
      secured with two M5 x 10 mm screws with washers (not supplied) and a lug on 6 AWG wire. The holes
      are drawn as decor.
  power:
    confidence: datasheet
    note: >-
      Table 34 - input 100 to 240 VAC at 4.0 A, 50 to 60 Hz. Table 35 - system budget 41.82 W, PoE budget
      240 W, total 281.82 W. The datasheet's Table 2 gives a maximum system power consumption, input power
      without PoE, of 40 W; the two are different measures (a budget and a maximum) and both are recorded.
      The cord is a C13 coupler (power cord topic).
  mounting:
    confidence: datasheet
    note: >-
      Table 5 and the mounting topics - on a desk by default (the quick-start topic), and with the orderable
      kits EX4000-2PST-RMK (two-post rack), EX4000-WMK (wall or under a desk), EX4000-MMK (magnet pads),
      EX4000-DRK (DIN rail) and the cable guard EX4000-12-CGD. No figure measures a bracket fold line,
      so no ear position and no kit is listed here: they are named in this provenance and are not modelled
      as kind kit contracts. The operating ambient is 0 to 45 C at sea level (0 to 40 C for under-the-desk
      mounting), and a rack needs 2RU of clearance above.
  color:
    confidence: photo-measured
    note: >-
      median of the bare face left of the first jack shell in the front photograph, #626e7a, which is
      darker and bluer than the 1U models'; the rear photograph's metal reads lighter under the same lights.
      One chassis colour is carried and is the front's. The numerals are the photograph's orange, #f3855a.
  guide-faces:
    confidence: datasheet
    note: >-
      The guide has flat drawings of the front (Figure 7) and rear (Figure 8) and no top, bottom or side
      elevations; the isometric views are not used.
attrs:
  physical: {weight-note: '6.94 lb (3.2 kg), Table 26; 3.15 kg in the datasheet', depth-note: '9.99 in
      (25.37 cm), Table 13'}
  power: {power-max-w: 40, power-envelope: bare, poe-budget-w: 240, poe-standard: 'PoE++ (IEEE 802.3bt)
      on all 12 ports, 60 W per port', power-input: '100 to 240 VAC at 4.0 A, 50 to 60 Hz (Table 34)'}
  thermal: {cooling: 'natural convection, no fan'}
  environmental:
    operating-temp: 0 to 45 C at sea level, 0 to 40 C up to 1500 m, 0 to 35 C up to 3000 m
    humidity: 5 to 90 percent at 40 C, noncondensing
    altitude: 3000 m operating, 4500 m storage
  platform: {first-junos-release: 24.4R1 (Table 12)}
  features:
    virtual-chassis: >-
      up to 6 EX4000 switches; the two Virtual Chassis ports are SFP+ and VC formation is not supported
      with a 10GBASE-T transceiver in them
    uplink-ports: two SFP+ ports take 1 GbE or 10 GbE transceivers
    optics-sfp-plus: >-
      the two Virtual Chassis ports and the two uplink ports are 1GE or 10GE SFP+ ports (Table 13 and
      Figure 7 callout 11). Virtual Chassis is supported only with 10GE SFP+, and not with a 10GBASE-T
      transceiver in a Virtual Chassis port. Industrial-grade optics are required above 35 C for under-the-desk
      mounting and above 40 C otherwise
  management:
    oob: >-
      management Ethernet RJ-45 on the front panel, with a link activity lamp and a status lamp
    console: RJ-45 console on the front panel, labelled CON
    usb: one USB 2.0 Type-A port on the front panel
  compliance: {seismic: tested for Zone 4 earthquake safety}
  lifecycle: {eol: none-announced}
chassis: {width: 264.0, height: 44.4, depth: 253.7, mount: desktop, weight-kg: 3.2, color: '#6a7380',
  silk: '#e4e6e9', power: ac}
gaps:
- what: rack-kits
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    The brackets of EX4000-2PST-RMK (the two-post rack kit, orderable, Table 5) are named in the mounting
    topics and are not modelled as a kit contract in this slice. A dimensioned drawing of the bracket
    fold lines would give the switch ear positions; none is stated here.
- what: port-status-lamp-states
  scope:
  - mg
  - rj45
  - vcp
  - uplink
  reason: vendor-silent
  wanted: >-
    A per-port vocabulary for the Status lamp. Table 32 gives its colour by speed (off 10 Mbps, blinking
    green 100 Mbps, green 1000 Mbps, amber 2.5 Gbps), which the jack's own lamp states do not carry, so
    the jack keeps the component's default off, link and activity states.
- what: label-plate
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    The size of the claim code label (Figure 7 callout 7). It is drawn as a region and not as a part,
    and the photograph does not show it.
- what: interface-names
  scope:
  - mg
  - rj45
  - vcp
  - uplink
  reason: vendor-silent
  wanted: >-
    The Junos interface names. The hardware guide gives the PIC numbering only inside the Junos configuration
    topics, which this slice does not read.
- what: four-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: A flat drawing or photograph of the lid, the underside and the side panels.
- what: reset-pinhole-size
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The diameter and depth of the pinhole reset button (Figure 7 callout 8). The guide names the button
    and gives no size; the hole is drawn at 2.0 mm as an estimate.
groups:
  mg:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 2.5g, poe: 802.3bt}
    description: >-
      Four PoE++ 100 Mbps/1 Gbps/2.5 Gbps ports labelled 0 to 3 inside the MG outline, in two columns.
      The even ports are on the upper row
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g, poe: 802.3bt}
    description: >-
      Eight PoE++ 10/100/1000BASE-T ports labelled 4 to 11. The even ports are on the upper row. The rel-pos
      carries the printed number
  vcp:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      Two SFP+ Virtual Chassis ports labelled 0 and 1, 1 GbE or 10 GbE, side by side inside a rounded
      outline
  vcp-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: 'on', color: '#22c55e'}
    - {name: blinking, color: '#22c55e', behavior: blinking}
    description: >-
      A Link Activity lamp and a Status lamp for each Virtual Chassis port, the small bars either side
      of its number (Table 33). Link Activity is steady with a link and blinking with traffic. Status
      shows speed: steady 10 Gbps, blinking 1 Gbps
  uplink:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      Two SFP+ uplink ports labelled 2 and 3, 1 GbE or 10 GbE, beside the Virtual Chassis ports. The rel-pos
      carries the printed number
  uplink-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: 'on', color: '#22c55e'}
    - {name: blinking, color: '#22c55e', behavior: blinking}
    description: >-
      A Link Activity lamp and a Status lamp for each uplink port, the small bars either side of its number
      (Table 33). Link Activity is steady with a link and blinking with traffic. Status shows speed: steady
      10 Gbps, blinking 1 Gbps
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      how the switch is reached out of band and reset - the RJ-45 management port, the USB port, the RJ-45
      console port and the reset pinhole, all on the front
  status-leds: {term: LED, role: indicator, index-origin: 0, description: 'SYS, MST and CLD chassis lamps
      (Tables 27 to 30)'}
  power-input: {term: Inlet, role: service, index-origin: 0, description: the AC inlet of the built-in
      power supply}
  furniture: {term: Item, role: furniture, index-origin: 0}
