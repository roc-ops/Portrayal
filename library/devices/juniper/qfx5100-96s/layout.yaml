format: 1
kind: device
name: qfx5100-96s
version: 0.2.0
maturity: modelled
manufacturer: Juniper
model: QFX5100-96S
portfolio: {line: QFX Series, family: QFX5100}
description: >-
  Juniper QFX5100-96S, a 2RU high-density data-centre access switch running Junos OS. It has 96 SFP+
  ports and 8 QSFP+ ports. An SFP+ port takes 10 GbE, 1 GbE or 100 Mbps optics. A QSFP+ port runs at 40
  GbE or as four 10 GbE ports. The ports and their lamps are on the port side. The rear carries two
  power supplies in two stacked slots and three fan modules. It also has the console, two management
  ports, a USB port, the reset button and the four chassis lamps. One front panel ships in four
  variants. They have AC or DC supplies, with airflow front-to-back (AIR OUT) or back-to-front (AIR IN).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper QFX5100 Switch Hardware Guide, published 2023-02-26, 254 pages (Juniper Networks; terms: the
      guide's own copyright notice and the Juniper EULA, a reference copy kept outside the repository): Table
      1 (models), Table 3 (physical specifications), Figure 10 and Figure 16 (the port panel), Figures 21 and
      23 (the fan end and its management panel, drawn flat), Tables 8 to 12 (lamps), Tables 13 and 14 and 16
      (AC supplies), Table 17 (DC supplies), Tables 19 to 21 (fan modules). QFX5100 Ethernet Switch Datasheet,
      1000480-022-EN, July 2024: the ordering table (variants, the 850 W supplies, the 2RU fan modules),
      weight, dimensions, power. Juniper's studio photograph of the QFX5100-96S port side, 1500 x 366 px
      (image library, qfx5100-96s-front-high). No photograph of the 96S fan end is held (the intake folder
      has the front and the front-with-top views only), so the rear is read off the guide's flat Figure 21
      alone. The held intake folders for the Juniper EX, QFX and MX lines were searched (COVERAGE.md,
      SOURCES.md and INVENTORY.md of exqfx and mx, and the Visio and photo folders): none holds a Visio
      stencil or 3D model of a QFX5100. No drawing or photograph is copied.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 3: 3.46 in (8.8 cm) high, 17.36 in (44.1 cm) wide, 22.44 in (57 cm) deep not including
      the handles of the fans and supplies, 32 lb (14.5 kg) with FRUs. The datasheet gives 8.8 x 44.09 x 57
      cm and 32.5 lb (14.74 kg). The two weights disagree by 0.5 lb and the guide's is carried. The height is
      3.46 in, 87.9 mm, which is the 2RU box without the 1.0 mm a rack unit leaves. The width is the body:
      the mounting brackets are not part of it and are not modelled.
  gate-1:
    confidence: estimated
    note: >-
      The front studio photograph's body runs from column 35.5 to 1464, 1428.5 px, and from row 29 to
      313, 284 px, an aspect of 5.03 against the table's 440.9 / 87.9 = 5.02, 0.2 percent out. Scale 3.240
      px/mm across and 3.231 down. The guide's flat Figure 21 (rear) is 1787 x 356 px at 400 dpi, an aspect of
      5.02, 0.1 percent out, at 4.053 px/mm. Every position read off them is good to a pixel (0.3 mm for the
      photograph, 0.25 mm for the figure) and is estimated.
  ports:
    confidence: estimated
    note: >-
      Front photograph. The numerals and lamp pairs of the SFP+ ports give each column centre: 24 columns
      per band on the registry's 14.25 mm pitch, in four groups of six. The first centre is 17.2 mm from the
      left edge and the groups stand 89.3 mm apart, so the gutter is 89.3 - 6 x 14.25 = 3.8 mm and the cells
      start at 10.1 mm. The two bands are 43.85 mm apart. Eight QSFP+ cages stand at the right in two
      columns, 25.4 mm apart, and four rows (two pairs), on a 14.4 mm row pitch, the first cage face from
      387.2 mm. Counts are 96 and 8, callouts 2 and 3 of figure 16. The cells use the registry's apertures
      (14.25 x 10.4 and 18.5 x 9.58); the photographed cage faces are larger because they include the bezel.
  row-pitch:
    confidence: estimated
    note: >-
      Down the first SFP+ column of the upper band the cage faces, 11.9 mm high with the bezel, start at row
      63.9 and 105.6, 41.7 px, 12.9 mm apart, so the cell rows (10.4 mm) are centred at 16.75 and 29.65 mm
      and the cells start at 11.55 mm; the lower band starts 43.9 mm below. The QSFP+ faces are 14.4 mm
      apart (the comparison of the render with the photograph at 3 times: 46.7 px at 3.23 px/mm). The
      registry's 15.0 mm SFP row pitch is measured on a different cage and is not a conformance figure, so
      the photograph's figures are used. y is good to about 0.5 mm.
  stack-orientation:
    confidence: estimated
    note: >-
      The photograph shows the latch tongue at the foot of every upper cage and at the top of every lower
      one, so both lips face the band between the rows: the upper cage upright and the lower one turned 180,
      the library's stack convention. The QSFP+ pairs show the same.
  port-numbering:
    confidence: estimated
    note: >-
      Printed on the metal and read off the photograph: in the upper band the SFP+ ports run 0 to 47, even
      above the upper row and odd below the lower row, the numeral between its two lamps; the lower band
      runs 48 to 95 the same way. The QSFP+ ports are 96 and 97 down the first column, 98 and 99 down the
      second, then 100 and 101, 102 and 103 in the lower pair, the numeral at the left of each lamp row. The
      guide's text gives ports 96 through 103. Interface names are not printed on the unit and the guide
      names no xe or et port, so none is written.
  port-lamps:
    confidence: estimated
    note: >-
      Two dots flank each SFP+ numeral, 5.7 mm apart, centred on the cage: the Link/Activity lamp (left) and
      the Status lamp (right) of the guide's Tables 8 and 9, as on the 48S. Four dots stand at 4.1 mm
      pitch beside each QSFP+ cage, above the upper cages and below the lower ones (guide Table 10, as on the
      48S). The photograph resolves them, and the numerals beside them resolve at the same scale.
  vents:
    confidence: estimated
    note: >-
      Two staggered rows of hexagonal holes along the top edge (0.5 to 4.8 mm) and one band along the
      bottom (84.0 to 87.4 mm), a wide band of larger hexagons between the two port bands (40.0 to 49.2 mm)
      and a vertical strip, 13.1 mm wide, between the SFP+ and QSFP+ blocks. They are drawn as vent
      strips. The hexagon pitch is read off the photograph at 3.6 times and is estimated, as the pattern is
      a rectangular approximation of a staggered hexagon field.
  esd:
    confidence: estimated
    note: >-
      Guide Figure 16 callout 1, the electrostatic discharge terminal, is the round jack at the lower left,
      centred 7.3 mm across and 82.7 mm down, with the ESD mark above it at 74.0 mm (photograph).
  rear-layout:
    confidence: estimated
    note: >-
      Guide Figure 21, the flat drawing, at 4.053 px/mm. At the left the management panel is the 1U panel
      of the QFX5100-48S placed 44.0 mm lower: the four chassis lamps ALM, SYS, MST and ID at 62.4, 67.4,
      72.5 and 77.5 mm down (the 48S's 18.4 and so on plus 44.0), the C1 SFP cage with two lamps above it,
      the console and C0 jacks stacked in one shield, the USB port and the reset pinhole; each reads within
      1.0 mm of the 48S's position plus 44.0 mm, so the 48S's measured positions are carried, moved down.
      Then three fan slots, 85.1 mm wide and 82.2 mm high on a 96.9 mm pitch, the first from 70.8 mm; at
      the right a rating legend and two supply slots one above the other, 56.4 x 41.2 mm, numbered 1 above
      and 0 below, the upper from 3.2 mm and the lower from 45.9 mm down, at the right edge from 375.2
      mm. The slot size agrees with the 1U supply's, so the 1U-sized 850 W supplies fit.
  rear-photo-vs-drawing:
    confidence: estimated
    note: >-
      No photograph of the fan end is held, so the drawing is the only reference and nothing is checked
      against a real unit. Figure 21 prints QFX5100-96S as the model and no RUNNING JUNOS line, where the
      1U figure and photographs print both; the drawing is followed. The drawing is the front-to-back
      build (supplies lettered AFO); the default configuration is that build and the back-to-front one
      takes the AIR IN fan modules and the AFI supplies with the colours of Tables 13 and 19. The guide's
      Figure 21 draws two small circles and a fan symbol beside the first fan only, and none beside the
      others, where the text gives one lamp at the left of every fan slot; a lamp is placed beside each.
  fan-lamps:
    confidence: estimated
    note: >-
      One status lamp at the left of each fan slot (guide, Fan Module LED: "a Status LED (labeled ST) for each
      fan module on the left side of the corresponding fan"). Figure 21 draws the marks only beside the
      first slot, as two small circles at 71.1 and 74.3 mm down; one lamp is placed at 72.7 mm down for each
      slot, in the strip left of it (the second and third in the 10.7 and 11.0 mm gaps between slots).
  modules:
    confidence: datasheet
    note: >-
      The fan modules (QFX5100-96S-FANAFO and -FANAFI, Table 19 and the datasheet) and the 850 W power
      supplies (JPSU-850W-AC-AFO, -AFI, and the DC -AFO and -AFI of the datasheet's ordering table) are
      field-replaceable units in bays, each its own component. The supplies are reused from the library by
      part number (the AC pair from the QFX5120, the DC pair from the QFX5200); the fans are new, as the
      1RU fan modules are a different part. Nothing on this chassis is a built-in unit that is not a bay. The
      guide says to fit a blank cover over an empty supply slot but names no part number for it, so no
      blank is modelled and no empty-bay configuration is offered.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide says all QFX5100 switches are designed for four-post racks and gives the
      96S a different mounting rail kit (twenty-four screws; Table 32 lists it for the 96S only), with no
      part number; the datasheet says only "versatile four post mounting options". The library holds no kit
      contract for it, so `chassis.ears` and `chassis.kits` are left out and a gap says so. The modelled
      body is the 440.9 mm chassis, without brackets.
  power:
    confidence: datasheet
    note: >-
      guide Table 14 (AC): typical 315 W, maximum 470 W for the 96S; Table 17 (DC): typical 315 W and
      maximum 470 W. The datasheet's "Power Consumption" prints 263 W for the 96S-AFO/AFI with a footnote
      mark and no measure in the text held. 263 W is below the guide's typical 315 W, so the two disagree
      and are recorded as a gap, not reconciled. The guide's figures are filed as the device's.
  colour:
    confidence: estimated
    note: >-
      The front plate around the ports samples #5b5c5f (8 by 10 px mean at the left edge between two cages) and
      #66676a above the lower band. The photograph is lit warmly and these are its values, not a paint
      reference. The first is carried.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-life announcement. The guide and the datasheet (July 2024) state none. Reseller
      trackers list announcements of 2020 to 2022 for the QFX5100-96S part numbers, which the maker's
      documents do not repeat, so the device states none announced and a gap records the trackers' claim.
      Estimated, because the trackers are not the maker.
attrs:
  physical:
    weight-note: 32 lb (14.5 kg per the guide, 32.5 lb or 14.74 kg per the datasheet) with FRUs installed (Table 3)
    depth-note: 22.44 in (57 cm), not including the handles of the fans and supplies (Table 3)
  performance:
    switching-capacity: 2.56 Tbps, 1.44 Bpps (datasheet)
    shared-packet-buffer: 12 MB shared packet buffer (datasheet)
    sfp-plus-speeds: 10 GbE with SFP+ optics; 1 GbE or 100 Mbps with SFP optics
    qsfp-plus-speeds: 40 GbE; or four 10 GbE with a breakout cable
  power:
    power-typical-w: 315
    power-max-w: 470
    power-envelope: unstated
    power-dc-typical-w: 315
    power-dc-max-w: 470
    power-input-ac: 100 to 240 VAC single phase, 50 to 60 Hz (the legend in guide Figure 21 reads 4.5 A, 2 A). The guide's table gives no value.
    power-input-dc: rated -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum (guide Table 17)
    redundancy-note: two 850 W supplies, load-sharing and fully redundant; both should be installed
  thermal:
    fans: three fan modules, hot-swappable; the switch runs 30 seconds without thermal shutdown while one is replaced
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F) normal operation
    storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container
    humidity: 5 to 90 percent noncondensing; 5 to 93 percent short term
    altitude: no performance degradation to 2000 m (6562 ft)
  platform:
    cpu: 1.5 GHz dual-core Intel
    memory: 8 GB
    storage: 32 GB SSD
    software: Junos OS
  features:
    virtual-chassis: up to 10 switches in a ring; also a Virtual Chassis Fabric leaf or spine
    optics-sfp-plus: 10 GbE SFP+, 1 GbE and 100 Mbps SFP, SFP+ direct attach cable and active optical cable
    optics-qsfp: 40 GbE QSFP+, QSFP+ direct attach and active optical cable, breakout cables to SFP+
    channelization: up to 104 logical 10 GbE ports with the QSFP+ ports broken out (guide, Port Panel of a QFX5100-96S Device)
  management:
    oob: management port C0 (RJ-45, em0) and C1 (SFP, em1) with link and status lamps
    console: RJ-45 console port (CON)
    usb: one USB port for image updates
  lifecycle:
    eol: none-announced
chassis: {width: 440.9, height: 87.9, depth: 570.0, ru: 2, weight-kg: 14.5, color: '#5b5c5f', airflow: front-to-back, power: ac}
gaps:
- what: power-consumption
  scope: [front, rear]
  reason: sources-disagree
  wanted: >-
    The datasheet prints 263 W (with a footnote mark) for the QFX5100-96S-AFO/AFI under "Power Consumption", the guide
    315 W typical and 470 W maximum (Table 14). Same device, no measure or scope stated for the 263 W. The guide's
    figures are carried.
- what: weight
  scope: [front, rear]
  reason: sources-disagree
  wanted: >-
    The guide's Table 3 gives 32 lb (14.5 kg) with FRUs, the datasheet 32.5 lb (14.74 kg). The guide's is carried.
- what: dc-operating-voltage
  scope: [rear]
  reason: sources-disagree
  wanted: >-
    The datasheet gives -36 to -72 V DC; the guide's Table 17 gives -40 through -72 VDC (rated -48 to -60).
    The guide's range is carried.
- what: ac-input-rating
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The guide's Table 14 prints no value for AC input voltage, line frequency or current in the PDF held. The
    datasheet gives 110-240 V single phase and Figure 21's legend reads 100-240 V, 50-60 Hz, 4.5 A, 2 A.
- what: mounting-kit
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    The part number of the four-post mounting kit for the 96S, and its depth ranges. The guide describes the kit and
    flush or recessed mounting in prose and a figure per chassis but gives no part number.
- what: usb-generation
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The USB revision. The guide names one USB port "for image updates" and gives no generation. It is drawn with
    the kit's neutral usb2 skin.
- what: rating-label
  scope: [rear]
  reason: needs-photo
  wanted: >-
    The vertical rating legend between the third fan and the supplies. Figure 21 prints it small; it is not
    drawn.
- what: rear-photo
  scope: [rear]
  reason: needs-photo
  wanted: >-
    A photograph of the QFX5100-96S fan end. None is held, so every rear position is read off the flat Figure 21
    and checked against the 48S's panel only; the fan-slot marks, the strips beside the slots, and the screw
    rings drawn at the slots' ends are not checked and the screw rings are not drawn.
- what: lifecycle
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    Reseller trackers list end-of-life announcements of 2020 to 2022 for the QFX5100-96S part numbers. The guide and
    the datasheet (July 2024) state none and the Juniper bulletin was not reached, so none is recorded.
- what: laser-label
  scope: [front]
  reason: needs-photo
  wanted: >-
    The photograph shows no laser-safety label on the port side, where the 48S's has one at the lower right.
- what: four-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: A flat drawing or photograph of the lid, the underside and the side panels.
groups:
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: 96 ports labelled 0 to 95, the even ports on the upper row of each band. Each takes an SFP or an SFP+ transceiver, at 10 GbE, 1 GbE or 100 Mbps.
  qsfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp, speed: 40g}
    description: Ports 96 to 103 as printed, rel-pos carrying the printed number, since the origin token cannot express a block that starts at 96.
  sfp-plus-activity-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: link, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: beacon, color: '#f59e0b', behavior: blinking}]
    description: The Link/Activity lamp of each SFP+ port, left of the numeral (guide Table 9).
  sfp-plus-status-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: 10g, color: '#22c55e'}, {name: 1g, color: '#22c55e', behavior: blinking}, {name: beacon, color: '#f59e0b', behavior: blinking}]
    description: The Status lamp of each SFP+ port, right of the numeral - steady green for a 10 GbE transceiver, blinking green for 1 GbE (guide Table 9).
  qsfp-plus-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: link, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: beacon, color: '#f59e0b', behavior: blinking}]
    description: The first of the four lamps of each QSFP+ port - used for a 40 GbE link (guide Table 10).
  qsfp-plus-channel-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: link, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: beacon, color: '#f59e0b', behavior: blinking}]
    description: The second to fourth lamps of each QSFP+ port, in port then lane order - used when the port runs as four 10 GbE ports (guide Table 10).
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band cluster at the left of the rear - an RJ-45 console port, an RJ-45 management port,
      an SFP management port, a USB port and the recessed reset button. Four kinds, one purpose:
      reaching and recovering the switch when the data plane cannot.
  mgmt-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The two lamps above the C1 management SFP cage.
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The four chassis lamps ALM, SYS, MST and ID (guide Table 12).
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: n+1
      redundancy-note: >-
        QFX5100 datasheet (July 2024), Power Supply and Fan Modules: "Redundant (N+1) and hot-pluggable fan modules".
        The hardware guide gives three fan modules for the 96S, slots 0 to 2 left to right; all should be installed
        and the switch runs 30 seconds with one removed
  fan-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The status lamp at the left of each fan slot - green when the module is present and healthy, blinking amber when absent or in error (guide Tables 20 and 21).
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: two supplies, load-sharing; one may be removed at a time while the switch runs
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD terminal on the port side (guide figure 16, callout 1)
