configurations:
  ac-f2b:
    kind: orderable
    default: true
    description: >-
      QFX5100-96S-AFO: two 850 W AC supplies (JPSU-850W-AC-AFO) and three front-to-back fan modules (QFX5100-96S-FANAFO).
      All have a Juniper Gold handle and the label AIR OUT or AFO (guide Tables 13 and 19).
    part-numbers:
      QFX5100-96S-AFO: {}
  ac-b2f:
    kind: orderable
    airflow: back-to-front
    description: >-
      QFX5100-96S-AFI: two 850 W AC supplies (JPSU-850W-AC-AFI) and three back-to-front fan modules (QFX5100-96S-FANAFI).
      All have a Juniper Azure Blue handle and the label AIR IN or AFI (guide Tables 13 and 19).
    bays: {psu-0: juniper/jpsu-850w-ac-afi@1, psu-1: juniper/jpsu-850w-ac-afi@1, fan-0: juniper/qfx5100-96s-fanafi@1,
      fan-1: juniper/qfx5100-96s-fanafi@1, fan-2: juniper/qfx5100-96s-fanafi@1}
    part-numbers:
      QFX5100-96S-AFI: {}
  dc-f2b:
    kind: orderable
    power: dc
    description: >-
      QFX5100-96S-DC-AFO: two 850 W DC supplies (JPSU-850W-DC-AFO) and three front-to-back fan modules
      (QFX5100-96S-FANAFO). The front panel is the same.
    bays: {psu-0: juniper/qfx5200-jpsu-850w-dc-afo@1, psu-1: juniper/qfx5200-jpsu-850w-dc-afo@1}
    part-numbers:
      QFX5100-96S-DC-AFO: {}
  dc-b2f:
    kind: orderable
    power: dc
