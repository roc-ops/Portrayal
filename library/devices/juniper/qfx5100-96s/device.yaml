    bays: {psu-0: juniper/qfx5200-jpsu-850w-dc-afi@1, psu-1: juniper/qfx5200-jpsu-850w-dc-afi@1, fan-0: juniper/qfx5100-96s-fanafi@1,
      fan-1: juniper/qfx5100-96s-fanafi@1, fan-2: juniper/qfx5100-96s-fanafi@1}
    part-numbers:
