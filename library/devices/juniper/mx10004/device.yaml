format: 1
kind: device
name: mx10004
version: 1.0.10
maturity: modelled
manufacturer: Juniper
model: MX10004
portfolio:
  line: MX Series
  family: MX10000 Universal Routing Platform
description: >-
  Juniper MX10004 - the 7RU, four-slot member of the MX10000 family. Two
  slim Routing and Control Boards stack under the badge strip beside the
  system status lamp panel; four full-width horizontal line-card slots
  (FPC 0-3) fill the lower front. The rear is a three-high PSU stack
  (PSU 0-2) beside two large fan trays whose removal exposes the six
  Switch Fabric Boards.
provenance:
  sources: MX10004 Hardware Guide (424 pages, 182 figures), the shared MX10000 datasheet, the frontwtop
    studio photograph and the rear studio figure g101087
  chassis: 'datasheet-table - 12.2 x 17.4 x 36.7 in (310 x 442 x 932 mm
    with fan trays), 7U; flange extends the rack face to 19 in. Ears NOT
    MODELLED by convention'
  front: 'photo - the frontwtop photograph at ~3.11 px/mm across the
    442 mm body: badge strip 0-20, RCB slots at y 20.0 and 58.1 (guide
    FRU listing gives the 1.5 in slot height), blank service band to
    y 118, then four 48 mm line-card rows at y 118/166/214/262 (the
    1.89 in card height is the vendor FRU table). The status lamp panel
    at the right of the RCB block is chassis metal, drawn as decor with
    its lamp column'
  slot-numbering: 'guide - FPC 0-3; drawn top-down 0-3 to match the
    MX10000-family convention, but no extracted figure prints the slot
    labels legibly - see gaps'
  rear: 'photo - the rear studio figure g101087 anchored per-axis to the
    442 mm body: PSU stack ~84 mm wide at the left (PSU 0 top, PSU 2
    bottom, as the printed arrows in the figure), two ~176 mm fan trays
    filling the rest'
  power: 'datasheet-table - the guide capacity table: two JNP10K-PWR-AC2
    at high power deliver 11,000 W, three 16,500 W'
  color: 'photo - dark grey chassis, silver card faces, light-blue levers
    and accent line under the badge strip'
  other-faces: 'near-blank by evidence - rail bands estimated; axis
    conventions per viewer3d.js as the siblings'
attrs:
  physical:
    weight-base-kg: 99
    weight-premium-kg: 113
chassis:
  width: 442.0
  height: 310.0
  depth: 932.0
  ru: 7
  color: '#565b61'
gaps:
  - what: psu-variants
    scope: [psus]
    reason: needs-photo
    wanted: the JNP10K-PWR-AC3, DC2 and DC3 faces (AC3 adds four feeds
      A0/A1/B0/B1 and six LEDs; only AC2 is photographed usably).
  - what: line-card-catalogue
    scope: [fpcs]
    reason: needs-photo
    wanted: LC2101, LC4800 and LC4802 faceplates - the guide names them
      and gives dimensions and power, but the extraction has no usable
      face art; only LC9600 and LC480 are modelled.
  - what: slot-label-print
    scope: [fpcs]
    reason: needs-photo
    wanted: legible FPC slot labels - the top-down 0-3 order follows the
      family convention, not a readable print.
  - what: rcb-vendor-width
    scope: [res]
    reason: vendor-silent
    wanted: a vendor dimension for the RCB face - the FRU table covers
      chassis, cards and PSUs but not the RCB; 389 mm is photo-derived.
  - what: fan-tray-power
    scope: [cooling]
    reason: vendor-silent
    wanted: per-tray power draw - not in the extraction's text layer.
groups:
  res:
    term: Slot
    role: service
    index-origin: 0
    description: Routing and Control Board slots RE0 and RE1
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - mx10004 hardware guide, "MX10004 Component Redundancy": one or two RCBs; with two fitted one is primary and the other backup, and the backup takes over if the primary or any part of it fails. The RCB consolidates the Routing Engine function with the control plane function in a single unit, so this one form covers both'
  fpcs:
    term: Slot
    role: traffic
    index-origin: 0
    description: line-card slots FPC 0-3, numbered top-down
  psus:
    term: PSU
    role: service
    index-origin: 0
    description: power supply slots PSU 0-2, top-down at the rear left
    attrs:
      redundancy: 'n+1'
      redundancy-note: 'n+1 - maintain n+1 power supplies in the router at all times'
  cooling:
    term: Tray
    role: service
    index-origin: 0
    description: fan trays FAN 0 and FAN 1
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the chassis status lamp panel beside the RCBs
