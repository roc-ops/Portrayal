format: 1
kind: device
name: ex2300-48p
version: 0.1.2
maturity: modelled
manufacturer: Juniper
model: EX2300-48P
portfolio: {line: EX Series, family: EX2300}
description: >-
  Juniper EX2300-48P is a fixed 1RU Gigabit Ethernet access switch. It has 48 10/100/1000BASE-T ports,
  all with PoE+ and 740 W available, and four built-in 10-Gigabit SFP+/SFP uplink ports. The front carries
  the 48 jacks in two stacked rows numbered 0 to 47, and the upper jack of a column takes the even number.
  It also carries the four uplinks numbered 0 to 3, three status lamps, four port-mode lamps, a Factory
  Reset/Mode button and a mini-USB console port. The rear carries the management Ethernet port with a
  USB port under it, the RJ-45 console port, a two-hole earthing terminal and an ESD point. It also carries
  two exhaust fans and the AC power cord inlet. The power supply and both fans are built into the chassis,
  so there are no bays. The -TAA and -VC part numbers are the same chassis. The EX2300-48T is the same
  front without PoE.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX2300 Switch Hardware Guide, Juniper Networks, published 2025-08-12 (314 pages; https://www.juniper.net/documentation/us/en/hardware/ex2300/ex2300.pdf):
      Figure 3 and Figure 4 (front panels), Figure 9 to Figure 13 (rear panels), Table 1 (models), Table
      3 (chassis size and weight), Tables 4 to 12 (LEDs), the cooling system section, Tables 14 to 16
      (power) and Table 34 (parts list). Juniper's own straight-on studio photographs of the EX2300-48P
      front (ex2300-48p-front-high.jpg) and rear (ex2300-48p-rear-high.jpg), and of the EX2300-24P front,
      and the held NetBox elevations juniper-ex2300-48p.front.png (1427 x 136 px) and juniper-ex2300-48p.rear.png
      (1428 x 141 px), which agree with the studio photographs on the jack layout, the five rear screws,
      the two fans and the 12A Max legend and add no position of their own. The HPE PSNow datasheet (a00151236enw)
      did not answer when fetched, so no datasheet is cited.
  gate-1:
    confidence: measured
    note: >-
      The 48P front photograph is 1500 x 300 px with the body 1432 px across and about 142 down (the lower
      edge carries a shadow): 10.1 against the stated 441.9 / 44.45 = 9.94, so x is taken at 3.24 px per
      mm from the width and y at 3.19 px per mm from the height. The ganged jack pitch reads 13.96 mm,
      the 0.550 in pitch the registry records for the ganged RJ-45 cell, on a quantity the scale never
      saw. The 24P photograph agrees on every feature both show to within 0.7 mm in x and 1.4 mm in y;
      the y values here are the mean of the two. The 48P rear photograph reads 3.234 px per mm across
      and 3.09 down. Every position is estimated and good to about a millimetre.
  chassis:
    confidence: datasheet
    note: >-
      Table 3: height 1.75 in (4.45 cm), width 17.4 in (44.19 cm) and 19 in (48.26 cm) with the mounting
      brackets attached, depth 12.2 in (30.98 cm) for models with PoE capability, weight 11.06 lb (5.02
      kg). 441.9 x 44.45 x 309.8 is carried: the metric as printed for width and depth and the height
      as the 1U pitch Table 35 gives (1.75 in, 4.45 cm). The photographs show no ears, and the jack pitch
      closing on the registry at that width says the figure is the body.
  front-layout:
    confidence: estimated
    note: >-
      estimated - read off the front photographs as described under gate-1. The 48 jacks stand in four
      shells of six columns, the first jack at 9.36 mm and the shell step 88.8 mm (6 x 13.97 plus a 5.0
      gutter), so the last shell ends where the uplink block begins at 364.6, at the same place as on
      the 24-port front; the rows are 14.8 mm apart and the upper row is turned 180 so its lamps and keyway
      are above, as the photograph shows. The four SFP+ cages abut on the registry pitch of 14.25 at 364.6,
      one row. A darker plate carries the model legend and lamps at the top right and runs down the far
      right edge. The hexagonal vent fields along the top edge and above the uplinks, and the slotted
      row along the bottom edge, are read off the same photographs. The 48P photograph prints RUNNING
      over a large JUNOS beside a flower mark, where the 24P photograph prints one line RUNNING JUNOS;
      each is drawn as photographed and the flower mark, a logo, is not drawn.
  port-numbering:
    confidence: photo-measured
    note: >-
      photo-measured - the photograph prints each column's two numbers in orange under the shell, the
      even number up and left and the odd number down and right (0 and 1, 2 and 3, ... 46 and 47), so
      the upper jack takes the even number; the uplinks print 0 to 3 in white between their two lamps.
      Port numbers are as printed on the metal, from 0. The Junos interface names are not printed: the
      guide's Table 2 gives PIC 0 as 48x10/100/1000 Base-T and PIC 1 as 4x10G SFP/SFP+, i.e. ge-0/0/0
      to ge-0/0/47 and xe-0/1/0 to xe-0/1/3; they are recorded here and not in an interfaces block because
      the faceplate does not print them.
  lamps:
    confidence: datasheet
    note: >-
      Hardware guide, Tables 4 to 12 and Figures 24, 26 and 27. Each RJ-45 port and uplink has two lamps,
      Link/Activity and Status; Figure 24 puts Link/Activity on one corner of the jack and Status on the
      other. The Status lamp reads out whichever of SPD, DX, EN and PoE the Factory Reset/Mode button
      has selected, shown by which port-mode lamp is lit. SYS is green, ALM red or yellow and MST green.
      The jack lamps keep the component's link and activity vocabulary because a block cannot override
      it per lamp. On the uplinks the left slot is taken as Link/Activity and the right as Status by analogy
      with the jacks, which no figure confirms, so it is estimated.
  uplinks:
    confidence: photo-measured
    note: >-
      photo-measured - one row of four SFP+/SFP cages numbered 0 to 3 with a pair of lamp slots flanking
      each numeral; the guide gives 4x10G SFP/SFP+ and says the ports can be Virtual Chassis ports with
      SFP+ transceivers but not with SFP.
  front-console:
    confidence: estimated
    note: >-
      estimated - the mini-USB console port (guide Figure 4, callout 5, printed CON) is drawn as chassis
      art, a 7.9 x 4.6 mm shell with its opening, read off the 24P and 48P photographs (25 x 14 px and
      24 x 14 px at 3.27 px per mm). It is not a component: the library has no mini-USB receptacle and
      its DCIM export has no row for one, so a placed part would export nothing. The rear RJ-45 console
      port is a component and exports.
  rear-layout:
    confidence: photo-measured
    note: >-
      photo-measured - the 48P rear photograph at 3.234 px per mm across and 3.09 down: the management
      Ethernet port with a USB port under it in one recess, the RJ-45 console port, the two-hole earthing
      terminal (holes 15.9 mm apart, the 5/8 in spacing) with the earth symbol left of it, the ESD symbol
      and point right of it, two exhaust fans 61.1 mm apart, five screws along the lower edge and the
      AC inlet with its retaining clip tabs and the legend over it, which prints 12A Max. The guide's
      drawing puts a serial number label and a CLEI label on the rear; the studio photograph shows neither,
      so none is drawn. The photograph's rear plate is lighter than the front (#a1a4a9); one chassis colour
      is carried.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Hardware guide, Power Supply in EX2300 Switches: "The power supply in EX2300 switches is built in
      along the rear panel of the chassis"; Table 34 lists "Switch with built-in power supply"; the cooling
      system is "two fans built-in along the rear of the chassis". Nothing in the guide describes removing
      or replacing either. They are part of the chassis, not bays and not components. The guide's CLI
      inventory example for the EX2300-24P names JPSU-450W-AC-AFO and two Fan Module, Airflow Out (AFO)
      items as built-in chassis items.
  airflow:
    confidence: datasheet
    note: the cooling system provides front-to-back chassis cooling (Figure 35).
  power:
    confidence: datasheet
    note: >-
      Table 14: maximum power consumed by the switch 100 W when no PoE power is drawn, maximum PoE/PoE+
      power available 740 W; Table 15: 100 through 240 VAC, 50/60 Hz, 12 A at 100 VAC and 6 A at 240 VAC,
      which is also what the rear legend prints.
  colour:
    confidence: photo-measured
    note: >-
      median of the bare front plate in the 24P photograph (#919599); the plate at the top right #6e7276.
attrs:
  physical: {weight-note: '11.06 lb (5.02 kg), Table 3'}
  power: {power-max-w: 100, power-envelope: bare, poe-budget-w: 740, poe-standard: IEEE 802.3af/at, power-input: '100
      through 240 VAC, 50/60 Hz', power-current-max: 12 A at 100 VAC; 6 A at 240 VAC}
  thermal: {cooling: 'two built-in fans, front-to-back'}
  environmental: {operating-temp-c: 0 to 45, humidity: '10 to 85 percent, noncondensing', altitude-ft: '13,000
      at 40 C'}
  features:
    optics-sfp-plus: >-
      hardware guide, Uplink Ports: the four uplink ports take SFP and SFP+ transceivers. A Virtual Chassis
      can be formed with SFP+ and not with SFP
    virtual-chassis: >-
      up to four switches; the -VC part number ships with the Virtual Chassis licence on paper, the other
      part numbers do not
chassis: {width: 441.9, height: 44.45, depth: 309.8, ru: 1, weight-kg: 5.02, color: '#919599', airflow: front-to-back,
  power: ac}
gaps:
- what: rack-ears
  scope:
  - front
  reason: needs-drawing
  note: >-
    Table 35 lists the supplied two-post mounting brackets and a separately orderable four-post rack-mount
    kit (EX-4PST-RMK, named in the clearance section); no figure measures a bracket position, so no ear
    position is stated and no kit is listed.
  wanted: A dimensioned drawing of the bracket positions.
- what: eol
  scope:
  - front
  reason: vendor-silent
  note: >-
    Searched for an end-of-life notice: only third-party lifecycle trackers answered (a 2026 end-of-sale
    for the EX2300-48P is reported); Juniper's own bulletin was not found, so no lifecycle is written.
  wanted: Juniper's end-of-life bulletin for the EX2300 line.
- what: jack-lamp-meaning
  scope:
  - rj45
  reason: vendor-silent
  note: >-
    The jack lamps carry the component's link and activity vocabulary; the guide's Status lamp switches
    meaning with the mode button and no per-lamp state list fits the component.
  wanted: none beyond the component's own vocabulary.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g, poe: 802.3at}
    description: >-
      the 48 built-in 10/100/1000BASE-T PoE+ ports; rel-pos carries the number printed on the faceplate,
      the upper jack of a column takes the even number
  uplink:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: the four built-in SFP+/SFP uplink ports, numbered 0 to 3
  uplink-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: two lamps beside each uplink numeral, Link/Activity and Status
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      how the switch is reached out of band - the mini-USB console port on the front, the RJ-45 console
      port, the management Ethernet port and the USB port on the rear
  controls: {term: Button, role: management, index-origin: 0, description: the Factory Reset/Mode button}
  status-leds: {term: LED, role: indicator, index-origin: 0, description: 'the SYS, ALM and MST chassis
      status lamps'}
  mode-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the SPD, DX, EN and PoE port-mode lamps; the one lit says what each Status lamp shows
  power-input: {term: Inlet, role: service, index-origin: 0}
  esd: {term: Point, role: furniture, index-origin: 0}
  furniture: {term: Item, role: furniture, index-origin: 0}
