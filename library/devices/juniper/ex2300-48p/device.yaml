configurations:
  ac:
    kind: base
    description: >-
      EX2300-48P - 48 PoE+ ports and four SFP+/SFP uplinks, built-in AC supply and two built-in fans,
      front-to-back airflow. Table 1, no Virtual Chassis licence.
    default: true
    part-numbers:
      EX2300-48P: {}
  taa:
    kind: orderable
    description: >-
      EX2300-48P-TAA - the same chassis sold as Trade Agreements Act compliant (Table 1); the front panel
      and rear are those of the EX2300-48P.
    part-numbers:
      EX2300-48P-TAA: {}
  vc:
    kind: orderable
    description: >-
      EX2300-48P-VC - the same chassis with the Virtual Chassis licence (Table 1). The packing list adds
      a paper licence. The front panel and rear are those of the EX2300-48P.
    part-numbers:
      EX2300-48P-VC: {}
