format: 1
kind: device
name: mx104
version: 5.0.0
maturity: modelled
manufacturer: Juniper
model: MX104
portfolio:
  line: MX Series
  family: Universal Routing Platform
description: >-
  Juniper MX104 - a 3.5RU ETSI-depth modular edge router (EOL) for space- and
  temperature-constrained deployments. Fixed top panel with four 10GbE SFP+
  ports, alarm connector, timing block (EXT REF CLOCK and ToD RJ45s, 1PPS and
  10 MHz SMB in/out); four MIC slots in two rows (1/0, 1/1 above 0/0, 0/1);
  two slim Routing Engines stacked at the lower right and two DC power
  supplies at the lower left. The fan tray is side-mounted; the rear is a
  plain panel with the earthing plate.
profile: networking
provenance:
  sources:
    note: >-
      MX104 Hardware Guide, the MX104 datasheet, and the image-library photographs
      mx104-front-high and mx104-rear-high. No mechanical drawing was available
  chassis:
    confidence: datasheet
    note: >-
      datasheet-table - physical table: 6.09 in (154.7 mm) high, 17.22 in (437 mm) wide, 9.461 in
      (240 mm) deep; 9 kg bare / 14.5 kg configured. NOTE the same table scrambles
      width/depth/height axes on the module rows - the chassis row is self-consistent and carried;
      ears NOT MODELLED (19.2 in is over the brackets)
  scale:
    note: >-
      photo - the front photograph is isotropic, 3.090 px/mm across (body px 74.5-1425.0) and
      3.067 down (px 8.5-483.0), cross-checked on the ganged-SFP pitch (#261, #901). Rows: fixed
      panel 0-42.4, the MIC rows (mic-bays), and the PSU/RE band from 105.5 (pem-re-band). A FIRST READING put the RE rows at
      13.9 mm - too thin to hold their photographed RJ45s - and the row boundary was re-derived;
      positions are single-pass and approximate to ~2 mm throughout
  fixed-panel:
    confidence: photo-measured
    note: >-
      the MX104 front photograph on the checked scale (#901): x = (px - 74.5) / 3.090 over the 437.0
      mm body, y = (px - 8.5) / 3.067 down the 154.7 mm height (the issue's 3.061 is the same reading
      from a different edge pixel). The panel's lower edge meets the upper MIC plates at y 42.4. ALARM
      DB-15 shell 36.0-55.4 x 21.6-32.4. The four XE SFP+ cages are DISCRETE cages on a 17.2 mm pitch,
      each in its own bezel, not a ganged row: centres 98.0, 115.3, 132.4, 149.5 at y 28.2 (bezels
      90.4-157.1 by 22.9-33.5), legends 2/0/0-2/0/3 above each and XE over a bracket at 123.8, so they
      are std/sfp, not std/sfp-ganged. ONLINE/OFFLINE button at (166.8, 30.0) with its legend under it,
      SYS OK lamp at (176.5, 24.6) under its legend. EXT REF CLOCK and TOD RJ45s centred at 271.0 and
      286.9, y 12.3. The 1PPS and 10 MHz SMBs at 307.8, 315.7, 323.9, 331.7, y 13.2. Until 5.0.0 the
      cages were ganged at 14.25 from 97.8 (the last 8.9 mm left of the photograph's) at y 25.2, and
      the button and lamp sat about 11 and 20 mm left of where the photograph puts them.
      NOT DRAWN, and seen at the panel's right end: an ESD jack at about (379, 5) and a two-hole
      plate at about (406-422, 5) - follow-ups, not part of this re-placement
  populated-with:
    note: >-
      photo - slot 1/0 and 0/1 carry MIC-3D-20GE-SFP, slot 1/1 the MIC-3D-4CHOC3-1OC12-CE, slot
      0/0 the MIC-3D-2XGE-XFP; both RE bays carry the slim MX104 RE and both PSU bays the DC
      supply. Defaults reproduce that configuration
  rear:
    note: >-
      photo - a plain panel with the two-hole earthing plate at the bottom centre; nothing else.
      The fan tray and air filter are SIDE-mounted per the guide (Figure 7/8) and appear on the
      left face as an estimated band
  power:
    confidence: datasheet
    note: >-
      guide power consumption topic, Table 6 - 600 W for the AC router and 625 W for the DC
      router, measured from the power source (INPUT side) on a system with redundant supplies,
      redundant Routing Engines and the fan tray, fully loaded with MICs; 325 W AC and 350 W DC
      without MICs. The guide labels all four rows typical; the MX104 datasheet labels the loaded
      pair fully loaded (max) and the no-MIC pair typical. Carried as power-max-ac-w and
      power-max-dc-w with that disagreement in power-max-scope; the no-MIC rows stay here and are
      not carried. The guide has no per-module power table: the MIC and supply contracts carry
      their own figures, and the Routing Engine has none (see gaps)
  lifecycle:
    note: >-
      announced - MX104 is EOL (TSB seen in the family tables; image-library page redirects).
      Per-SKU dates on the Juniper milestones page
  color:
    note: >-
      photo - medium grey face and rear
  other-faces:
    note: >-
      left face carries the estimated fan-tray band (side-mounted cooling per the guide); other
      faces rail-band estimates. Axis conventions per viewer3d.js as the siblings
  ground-stud-size:
    confidence: datasheet
    note: >-
      the hardware guide, grounding points specifications: two threaded holes that fit SAE 10-32
      screws, spaced at 0.625 in. (15.86 mm) centres, for one two-hole cable lug: the `stud-size` of
      both studs.
  ground-stud-pitch:
    confidence: datasheet
    note: >-
      the hardware guide, grounding points specifications: 0.625-in. (15.86-mm)
      centres, which is 5/8 in., 15.875; the guide rounds the conversion.
      `ground-studs` is one placement of juniper/mx-ground-stud-pair-5-8@1, which composes
      juniper/mx-ground-stud@1 twice at exactly 15.875 (L116) and presents
      `stud-pair-5-8`, so one two-hole lug (generic/two-hole-lug-5-8@1) lands across the pair
      and the ring lug still lands on either stud, `ground-studs/1` and `/2`.
      The two studs were drawn 16.0 apart; they moved symmetrically about the
      midpoint the photograph placed, (205.0, 136.0), side by side, so a lug's wire leaves to the right, and their cutouts with them.

  pem-re-band:
    confidence: photo-measured
    note: >-
      the MX104 front photograph on the scale above (#901). The band starts at y 105.5 (the issue read
      105.2). The supply plates run x 7.0-113.8 and 114.7-221.5, y 105.5-153.7; the 103.7 x 45.0 supply
      contract is centred on each (pem0 at 8.55, pem1 at 116.25, y 107.1), which leaves the contract
      about 3 mm smaller than the photographed plate each way - a matter for juniper/mx104-psu-dc, not
      the bays. The Routing Engines run x 222.2-363.9 (141.7 against the 145.0 contract, centred at
      220.55), RE1 from y 105.6 and RE0 from 129.0, RE legends at x 366.5 beside them; the plain side
      cover takes the rest of the right end, x 365.5-437.0 from the fixed panel down. Until 5.0.0 pem1
      sat 8 mm right of its plate, both REs 36 mm right of theirs (over the side cover), and the band
      started at 108.7.
  mic-bays:
    confidence: photo-measured
    note: >-
      the four MIC bays are the MIC plate, 168.8 x 29.2 (#261), placed off the front photograph. Across,
      at 3.090 px/mm (body 74.5 to 1425.0 px over 437.0 mm, confirmed by the ganged-SFP pitch at 3.091):
      the left plates start at 129.0 to 129.5 px, 17.8 mm, and the right at 652.5 px, 187.1 mm, a pitch of
      523 px or 169.3 mm, which leaves a 0.5 mm seam between 168.8 plates. Down, on the chassis-height scale (473.5 px over 154.7 mm,
      3.061, the top at 9.0 px): the upper plates run 138.75 to 229.5 px (42.4 to 72.0) and the lower
      235.5 to 325.5 px (74.0 to 103.4), and a 29.2 plate centred in each gives y 42.6 and 74.1. The slot
      legends sit beside the plates' upper thirds, as printed. Until 4.0.0 the bays were 168 x 27 at x
      17.8 and 193.0, y 49 and 81 - a 175.2 pitch and rows 6 to 7 mm low. The rest of the front's vertical
      frame is not re-measured here: the fixed XE row centre reads 28.3 against a modelled 25.2, and the
      PEM/RE band starts at 105.2 against 108.7.
attrs:
  physical:
    weight: 9 kg bare; 14.5 kg with power supplies, fan tray and MICs
  power:
    power-max-ac-w: 600
    power-max-dc-w: 625
    power-envelope: fully-configured
    power-max-scope: INPUT side, measured from the power source - redundant
      supplies and Routing Engines, fan tray, fully loaded with MICs (guide
      Table 6, which calls both figures typical; the datasheet calls them fully
      loaded max)
  environmental:
    operating-temp: -40 C to 65 C (datasheet - environmentally hardened)
  lifecycle:
    eol: announced
    eol-announcement: https://support.juniper.net/support/eol/product/m_series/
chassis:
  width: 437.0
  height: 154.7
  depth: 240.0
  ru: 3.5
  color: '#8b8f94'
gaps:
  - what: fixed-panel-right-end
    reason: needs-photo
    wanted: a close photograph of the fixed panel's right end - the front
      photograph shows an ESD jack at about (379, 5) and a two-hole plate at
      about x 406-422, y 5, neither drawn; the fixed panel was otherwise
      re-placed at 5.0.0 (provenance.fixed-panel, #901).
  - what: vendor-table-axes
    reason: sources-disagree
    wanted: a corrected MX104 physical table - the module rows scramble
      width/depth/height (a MIC listed 15.9 cm wide when the photographed
      face measures 168.8 mm, roc-ops/Portrayal#261; PSU axes likewise); faces are photo-sized and marked
      approximate.
  - what: ac-power-variant
    scope: [psus]
    reason: needs-photo
    wanted: the AC supply face (guide Figure 9 is isometric line art only);
      only the photographed DC variant is modelled.
  - what: routing-engine-power
    scope: [res]
    reason: vendor-silent
    note: >-
      The MX104 guide publishes chassis totals only (Table 6) and no per-module table; the MICs
      and supplies carry figures on their own contracts. No document in the intake rates the
      RE-S-MX104, which is the module L29 reports.
    wanted: a power figure for the RE-S-MX104 Routing Engine.
  - what: alarm-connector
    scope: [mgmt]
    reason: needs-drawing
    wanted: a DB-15 standard part - the ALARM connector is drawn as a plain
      cutout with its legend.
groups:
  xe:
    term: Port
    role: traffic
    index-origin: 0
    attrs:
      media: sfp-plus
      speed: 10g
    description: The four fixed 10GbE ports on the top panel, silkscreened
      2/0/0 to 2/0/3
  mics:
    term: Slot
    role: traffic
    index-origin: 0
    description: MIC slots 1/0 and 1/1 (upper row), 0/0 and 0/1 (lower row)
  res:
    term: Slot
    role: service
    index-origin: 0
    description: Two slim Routing Engine bays, RE0 below RE1
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - mx104 hardware guide, "MX104 Component Redundancy": with two Routing Engines fitted one is primary and the other backup, and the backup takes over if the primary fails. The same section opens by calling the hardware fully redundant across power supplies, Routing Engines and cooling'
  timing:
    term: Port
    role: management
    index-origin: 0
    mixed: the timing block - EXT REF CLOCK and ToD RJ45s plus the 1PPS and
      10 MHz SMB in/out quad
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: the ALARM DB-15 and the SYS OK lamp / ONLINE-OFFLINE button
      cluster on the fixed panel
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
  psus:
    term: PEM
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - the power supplies sit at the front of the chassis and offer 1+1 redundancy; when two are present they share power almost equally within a fully populated system'
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the protective-earthing stud pair under the rear earth
      symbol
