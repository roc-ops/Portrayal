configurations:
  base:
    kind: base
    source: >-
      derived - built from the group roles rather than from a vendor bundle: every bay
      whose group is `service` or `management` keeps its seat, every `traffic` bay takes
      a blank. This vendor publishes no base configuration for this chassis, so the
      library defines one. Where a vendor DOES publish one, follow it instead and say so
      here.
    default: true
    description: >-
      Chassis only - what you spec before deciding what goes in it. The 4 slot bays are
      EMPTY; psus, res are populated. Enough to power on and reach the box, which is the
      question most people ask first and the one `default` used to answer with whatever
      the drawing happened to be populated with.
    bays:
      mic-1-0: juniper/mx-mic-blank@1
      mic-1-1: juniper/mx-mic-blank@1
      mic-0-0: juniper/mx-mic-blank@1
      mic-0-1: juniper/mx-mic-blank@1
gaps:
  - what: vendor-table-axes
    reason: sources-disagree
    wanted: a corrected MX104 physical table - the module rows scramble
      width/depth/height (a MIC listed 15.9 cm wide when the photographed
      face is ~168 mm, PSU axes likewise); faces are photo-sized and marked
      approximate.
  - what: ac-power-variant
    scope: [psus]
    reason: needs-photo
    wanted: the AC supply face (guide Figure 9 is isometric line art only);
      only the photographed DC variant is modelled.
  - what: per-module-power
    scope: [mics, res, psus]
    reason: vendor-silent
    wanted: the remaining per-module wattage rows - only the 20x1GE MIC's
      26 W was inside this extraction's text layer.
  - what: alarm-connector
    scope: [mgmt]
    reason: needs-drawing
    wanted: a DB-15 standard part - the ALARM connector is drawn as a plain
      cutout with its legend.
