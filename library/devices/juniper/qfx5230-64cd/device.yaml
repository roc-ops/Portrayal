format: 1
kind: device
name: qfx5230-64cd
version: 0.3.0
maturity: modelled
manufacturer: Juniper
model: QFX5230-64CD
portfolio: {line: QFX Series, family: QFX5230}
description: >-
  Juniper QFX5230-64CD, a 2RU 400G data-centre leaf and spine switch running Junos OS Evolved. It has
  64 QSFP-DD ports (400, 200, 100, 50, 40, 4x25 or 4x10 GbE) in two bands of sixteen stacked pairs and
  two SFP+ ports (10 GbE), all on the port side with a lamp beside each network port. The port side also
  carries the RJ-45 management and console ports, a USB port, the reset button, the three chassis lamps,
  the 10 MHz and 1 PPS output connectors and the ESD point. The rear carries four fan modules at the left
  and two power supplies stacked at the right. It ships as one front panel in four power and airflow variants,
  AC or DC supplies with front-to-back (AIR OUT) or back-to-front (AIR IN) airflow, and as a spare chassis
  with no supplies and no fan modules.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      QFX5230-64CD Switch Hardware Guide, published 2026-04-28, 146 pages (Juniper Networks, copyright
      2026), from https://www.juniper.net/documentation/us/en/hardware/qfx5230/qfx5230.pdf: the front
      and rear figures 9 and 10, the port panel figures 11 to 14 and Tables 9 and 10 (lamps), Table 3
      (hardware models), the cooling system (Tables 5, 6 and 11, figures 15 to 18), the power system (Tables
      4, 12, 13, 16 to 22, figures 19 to 23) and Table 8 (physical specifications). The guide is Juniper's
      and public; its terms of use were not found in the document beyond the copyright notice and the
      end user licence agreement, so only facts are transcribed. Juniper's studio photographs of the 64CD,
      front and rear (qfx5230-64cd-front-high.jpg, 2100 x 710 px, and qfx5230-64cd-rear-high.jpg, 2100
      x 765 px, from juniper.net's image library). No datasheet for the QFX5230 is held on the intake
      host (it is an HPE document, a00150804enw, listed in the intake notes as not fetched), no Visio
      stencil, no 3D model and no mechanical drawing was found in the intake folder or on juniper.net.
      The converted drawings of the guide are half-tone thumbnails: figures 9 and 10 are the same studio
      photographs at reduced size.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 8: 3.43 in (8.7 cm) high, 17.4 in (44.2 cm) wide, 25.6 in (65 cm) deep, 55 lb (25 kg)
      with power supplies and fans installed, 2RU. The inch figures are used and the centimetre ones in
      the same cell are rounded copies of them. The table does not say whether the width is over the brackets:
      the guide's rack figures show brackets bolted to the sides and the photographs show a body 4.150
      px/mm wide with no brackets, so the width is the body and brackets are not modelled. The table does
      not say whether the depth includes the handles of the supplies and fans.
  gate-1:
    confidence: photo-measured
    note: >-
      The front photograph's body, between the left and right edges, is 1834 px wide and 361 px from the
      top edge to the bottom lip, an aspect of 5.08 against the table's 441.96 / 87.12 = 5.07 (0.2 percent
      out, so the photograph is near-orthographic). Scale 4.150 px/mm across, used on both axes with the
      origin at the left edge (x 123 px) and the top edge (y 169 px). The rear photograph's body is 1829
      px wide, 4.138 px/mm. The guide's figures 9 to 13 are half-tone thumbnails and are used only to
      count and read.
  ports:
    confidence: photo-measured
    note: >-
      Front photograph: 64 QSFP-DD openings in two bands, each a row of 16 stacked pairs, the openings
      78 px (18.8 mm) wide on a 104.5 px pitch, 25.19 mm. The cage cell is the registry's 19.0 mm, set
      so the opening centres agree; the first cell starts at 13.15 mm. Counts and the order are the guide's
      figures 9, 11 and 12 and the printed numerals. The two SFP+ cages stand to the right of the last
      column, one above the other, and are turned a quarter turn (callout 5 of figure 12; 10.3 mm wide
      and 15.3 mm tall in the photograph).
  row-pitch:
    confidence: photo-measured
    note: >-
      Down column 3 the four openings centre at 21.3, 36.9, 51.8 and 67.3 mm, so the rows are 15.5 mm
      apart inside a band (the registry gives no belly-to-belly pitch for a QSFP-DD cage) and the bands
      are 30.5 mm apart.
  stack-orientation:
    confidence: estimated
    note: >-
      The photograph shows the grey latch mesh between the two cages of every pair, so both lips face
      the band between the rows: the upper cage upright and the lower one turned 180, the library's stack
      convention. The convention is applied, not observed: the cages are dark openings in the photograph
      and the lip is not resolved.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed on the metal beside each column, read off the photograph: each numeral is followed by a
      short dash that points at its cage (the dash is not drawn) and stands left of the column, the even
      number below a lamp for the upper cage and the odd number above a lamp for the lower one. The ports
      run 0 to 31 down each column and left to right in the upper band and 32 to 63 in the lower band;
      the SFP+ pair prints 64 above the upper cage and 65 above the lower one. The guide's figure 12 numbers
      the network ports as one group (callouts 1 and 2) and its note names ports 33 through 63. Interface
      names are not printed and none is stated in the guide's text held on this host, so they are not
      recorded.
  zr-ports:
    confidence: photo-measured
    note: >-
      The 16 ports marked in green, 33 to 63 (the odd numbers of the lower band), take 400G-ZR and 400G-ZRM
      optics and trigger an alarm if one goes in another port (figure 9 note). On the metal their numerals
      sit on a green chip, 3.5 mm wide and 2.5 mm tall in the photograph, drawn here as decor in the logo
      green, 3.8 by 2.6 mm, sampled from the photograph's serial-number tab.
  port-lamps:
    confidence: photo-measured
    note: >-
      Each QSFP-DD network port has a single bicolour lamp (guide, QFX5230-64CD Network LEDs, Table 9)
      on the left of its column: a round window 2.0 mm across at the height of its cage's centre, 2.8
      mm left of the cell. The lamps are unlit in the photograph. The SFP+ ports show no lamp in the photograph
      and the guide describes none.
  mgmt-panel:
    confidence: photo-measured
    note: >-
      Right of the last column, from the top: the RJ-45 management and console jacks side by side in one
      shield under the maker's logo, labelled MGMT and CON, the SFP+ pair with 64 and 65 above it, the
      three chassis lamps ALM, SYS and ID in a column with their legends below them and the green serial-number
      tab beside them, the 10M and PPS coaxial jacks, the round ESD point, the USB-A port with the reset
      hole and the model name. The jacks are turned a quarter turn, so the latch faces a side edge; which
      side is not seen and 90 is used. The shield is 23.9 mm wide and holds two jacks, 11.9 mm each; the
      library's jack is 13.2 mm across when turned, so the two are placed 13.4 mm apart and overhang the
      shield by 1.5 mm on the left (estimated). Guide figure 12 names the clock connectors "10MHz and
      1PPS"; the metal prints 10M and PPS.
  vents:
    confidence: estimated
    note: >-
      Hexagonal holes in the sheet: a band along the top above the cages (about 1.5 to 13 mm down), a
      band along the bottom (about 75 to 86 mm) and a column of holes left of the SFP+ pair. Drawn as
      vent decor in those positions, pitched to the photograph and estimated. Five dark slots at the left
      edge are the windows of the mounting ear and are drawn as dark decor; three round dimples at the
      right edge are not drawn.
  front-green-tab:
    confidence: photo-measured
    note: >-
      The green tab at the right edge, 3.8 mm wide and 17.1 mm tall, is the serial-number pull-out. It
      is drawn as decor, because it is a label card and not a part the library models. Guide figure 12
      shows no callout for it on the QFX5230.
  logo:
    confidence: photo-measured
    note: >-
      The maker's logo and its lockup are printed at the upper right of the face, above the model name
      QFX5230-64CD. The logo is not drawn: a logo-zone region is reserved where it stands, and the model
      name is drawn as plain text.
  rear-layout:
    confidence: photo-measured
    note: >-
      Rear photograph at 4.138 px/mm, checked against the guide's figure 10: four fan modules numbered
      0 to 3 from the left on an 86.7 mm pitch, then two supplies stacked at the right end, supply 0 above
      supply 1. A fan symbol and the module number are printed beside the lower left corner of each fan
      opening, and a power symbol with the supply number to the left of each supply. The fan frames measure
      80.9 mm wide and 80.0 mm high; the supplies 74.8 mm wide and 40.2 mm high.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      The guide's figure 10 is the same studio photograph at reduced size, the AIR OUT AC build with orange
      handles, and the photograph agrees with it. The guide shows no AIR IN, DC or empty-bay rear, and
      no photograph of one is held, so those configurations are drawn from the component art.
  modules:
    confidence: datasheet
    note: >-
      The four fan modules (QFX5230-64CD-FANAO and -FANAI) and the two power supplies (JNP-3000W-AC-AFO,
      JNP-2700W-AC-AFI, JNP-3000W-DC-AFO and JNP-2400W-DC-AFI) are field-replaceable units in bays, each
      its own component. Table 6 names them with their handle colours. Nothing on this chassis is a built-in
      unit that is not a bay. Each supply carries its own small fan inside (the cooling system is four
      fan modules of two rotors and a fan in each supply). The guide's figure 18 shows the fan module
      lamp but gives no place for it on the chassis, so it is not drawn.
  variants:
    confidence: datasheet
    note: >-
      Table 3: QFX5230-64CD-AFO and -AFI (AC) and QFX5230-64CD-D-AFO and -D-AFI (DC), and the spare QFX5230-64CD-CHAS
      "Spare Chassis without PSU and Fans". All five share this front panel and the rear bays, so each
      is a configuration of this device. The handle colour of an AIR OUT module is Juniper gold and of
      an AIR IN module green, and the supplies of one airflow never mix with the fans of the other. The
      AIR IN AC supply is 2700 W and the AIR IN DC supply 2400 W; the AIR OUT supplies are 3000 W (Table
      4).
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's installation figures 1 to 7 (side mounting brackets, mounting rails, front
      and rear rails) and its switch-tray assembly (figures 25 to 37, Tables 37 to 40, an Open Rack v3
      mounting) are kit procedures. The guide gives the kit part numbers only in its sample inventory
      (Table 36). The library holds no contract for either kit and none is written here, so `chassis.ears`
      and `chassis.kits` are left out and a gap says so. The modelled body is the 441.96 mm chassis, without
      brackets.
  power:
    confidence: datasheet
    note: >-
      Table 13 (AC): 220 to 240 V, typical 498 W and maximum 1396 W. Table 17 (DC models): typical 487
      W and maximum 1446 W, printed with "(AC)" after each figure although the table is headed DC; they
      are carried as the DC models' figures. Both tables say the maximum is measured at 40 C ambient with
      SR optics at 100 percent load with IMIX traffic and the typical at 25 C with DACs at 50 percent
      load, excluding transceivers. The AC pair is the device's, since AC is the default build; the DC
      pair is carried under its own keys. AC input 180 to 305 VAC at 50 or 60 Hz (Table 4); DC input -40
      to -72 VDC, rated -48 to -60 VDC (Table 18).
  colour:
    confidence: photo-measured
    note: >-
      The front plate samples #dbdcde (median of a bare patch between two cages) and the rear panel #595a61.
      The chassis colour is the front's, because a device has one colour for every face; the rear is therefore
      drawn light where the real rear is dark grey, and its legends are drawn dark to stay readable on
      that. The photographs are lit warmly and these are their values, not a paint reference.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-life announcement. The guide, published 2026-04-28, states none and no Juniper
      notice was found in the intake. The device states none announced. Estimated, because absence in
      the guide is not a notice from the maker.
attrs:
  physical:
    weight-note: 55 lb (25 kg) with power supplies and fans installed (guide Table 8)
  performance:
    throughput: 25.6 Tbps (guide, QFX5230-64CD Switch Description)
    breakout-ports: >-
      up to 64 x 400 GbE, 128 x 200 GbE, 256 x 100 GbE, 256 x 40 GbE, 256 x 25 GbE or 256 x 10 GbE (guide,
      QFX5230-64CD Switch Description)
    qsfpdd-speeds: >-
      400, 200, 100, 50, 40 GbE, 4 x 25 GbE or 4 x 10 GbE per port (guide, Port Panel overview)
  power:
    power-typical-w: 498
    power-max-w: 1396
    power-envelope: as-tested
    power-measurement-note: >-
      Maximum at 40 C ambient with SR optics at 100 percent load with IMIX traffic; typical at 25 C with
      DACs at 50 percent load with IMIX traffic, excluding transceivers (guide Table 13)
    power-dc-typical-w: 487
    power-dc-max-w: 1446
    power-input-ac: 180 to 305 VAC, 50 to 60 Hz (guide Table 4)
    power-input-dc: rated -48 to -60 VDC, operating -40 to -72 VDC (guide Table 18)
    redundancy-note: two supplies, 1+1, hot-removable and hot-insertable while the second supply is installed
  thermal:
    fans: >-
      four fan modules of two rotors, 7+1 at rotor level; the switch runs 120 seconds without thermal
      shutdown while one module is replaced
    airflow-note: >-
      AFO is front-to-back (port-to-FRU); AFI is back-to-front (FRU-to-port); no mixing of fans and supplies
      of different direction
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F) for AFO and AFI (guide Table 24)
    storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container
    humidity: 5 to 90 percent noncondensing, operating
    altitude: >-
      no performance degradation to 1828.8 m (6000 ft) at 0 to 40 C for AFO; for AFI the figure is 0 ft
      (guide Table 24)
  platform: {cpu: 'Intel Hewitt Lake D-1637, 6 cores', storage: two internal 100 GB SSDs, switch-chip: Broadcom
      Tomahawk 4 (BCM56990), software: Junos OS Evolved}
  features:
    optics-qsfp-dd: >-
      400 GbE QSFP-DD optics; 400G-ZR and 400G-ZRM only in ports 33 to 63 (the odd ones of the lower band)
    optics-sfp-plus: two SFP+ ports at 10 GbE
    ptp: 10 MHz and 1 PPS clock connectors
  management: {oob: 'one RJ-45 management port, 10/100/1000 Mbps', console: one RJ-45 console port, usb: one
      USB 2.0 port, timing-outputs: 10 MHz and 1 PPS SMB connectors}
  compliance:
    safety: >-
      UL 60950-1:2007 R10.14; CAN/CSA-C22.2 No. 60950-1-07 Amd 1:2011 Amd 2:2014; IEC 62368-1:2014 and
      2018; EN 62368-1:2014+A11:2017; UL/CSA 62368-1:2019; IEC/EN 60825-1 (guide, Compliance Statements)
    emc: >-
      FCC 47 CFR Part 15; ICES-003; BS EN 55032; BS EN 55035; EN 300 386; CISPR 32; CISPR 35; IEC/EN 61000
      series (guide, Compliance Statements for EMC Requirements)
    nebs: >-
      designed to comply with Zone 4 earthquake requirements of NEBS GR-63-CORE, Issue 3 (guide Table
      24)
  lifecycle: {eol: none-announced}
chassis: {width: 442.0, height: 87.1, depth: 650.2, ru: 2, weight-kg: 25, color: '#dbdcde', airflow: front-to-back,
  power: ac}
gaps:
- what: rear-colour
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The rear panel's own colour. The photograph shows a dark grey rear (#595a61) behind a silver front
    (#dbdcde); the format has one chassis colour, so the rear is drawn in the front's silver.
- what: module-depths
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The depth of the fan module and of the power supplies. The guide's figures 15, 20 and 22 carry no
    scale and its tables state weights only for the whole chassis.
- what: dc-and-air-in-rear
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    A photograph or flat figure of the DC supply (the guide's figure 22 is an isometric), of the AIR IN
    supplies and of the AIR IN fan module. Their faces are drawn from the AIR OUT AC art with the guide's
    handle colour and label and are estimated.
- what: dc-power-table
  scope:
  - power
  reason: sources-disagree
  wanted: >-
    The DC models' power figures. Guide Table 17, headed DC, prints 487 W typical and 1446 W maximum at
    220-240 V followed by "(AC)". They are carried as the DC models' figures; whether they are AC input
    figures for the DC models is not stated.
- what: dc-rated-cell
  scope:
  - power
  reason: sources-disagree
  wanted: >-
    The rated input of the AFO DC 3000 W supply. Guide Table 18 prints "50-60 Hz" in the rated column
    for it, where the AFI row prints -48 to -60 VDC; the supply is a DC unit (-40 to -72 VDC), so -48
    to -60 VDC is carried.
- what: earthing-terminal
  scope:
  - left
  - right
  reason: needs-photo
  wanted: >-
    The protective earthing terminal. The guide's figure 8 and Ground the QFX5230-64CD Switch (two 10-32
    screws with the lug's posts pointing right) show it on the side of the chassis, which no figure draws
    flat and no photograph shows. It is not drawn.
- what: console-and-mgmt-lamps
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The lamps of the RJ-45 jacks. The guide's management panel lists the three chassis lamps and the network
    lamps only (figure 14, Table 10); the photograph shows lamp windows at the corners of the management
    jack. The management jack is drawn with the library's lamped jack and the console jack bare.
- what: clock-connector-type
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The connector type of the 10M and PPS jacks. The guide calls them "SMB" connectors in the specification
    list and "clock input and output connectors" in figure 12; the photograph shows gold coaxial jacks
    6 mm across, drawn as the library's SMA jack. Estimated.
- what: rating-label
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    The rating label printed on each supply (an AC input line, a DC input line) and the guide's serial
    number labels (figures 55 to 58). Not drawn.
- what: port-dash
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The short dash after each port numeral on the metal, which points at the cage. Not drawn: the numerals
    are drawn alone.
- what: ears-and-kits
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    The rack ears' positions and the rack kits' contracts. The guide names rack kits only in its inventory
    and its installation figures; no kit contract exists in the library and none is written here.
groups:
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 400g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      Ports 64 and 65 as printed, rel-pos carrying the printed number, since the origin token cannot express
      a block that starts at 64.
  qsfpdd-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: link, color: '#22c55e'}
    - {name: activity, color: '#22c55e', behavior: blinking}
    - {name: fault, color: '#f59e0b', behavior: blinking}
    - {name: transceiver-fault, color: '#ef4444'}
    description: >-
      One bicolour lamp per QSFP-DD port, in the column of lamps left of each column of cages (guide Table
      9).
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band cluster at the right of the port side - an RJ-45 console port, an RJ-45 management
      port, a USB port and the recessed reset button. Four kinds, one purpose: reaching and recovering
      the switch when the data plane cannot.
  timing:
    term: Port
    role: management
    index-origin: 0
    description: >-
      the 10 MHz and 1 PPS output connectors, a pair of coaxial jacks that carry the switch's timing references
      out
  status-leds: {term: LED, role: indicator, index-origin: 0, description: 'The three chassis lamps ALM,
      SYS and ID (guide Table 10).'}
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD point on the port side (guide figure 12, callout 7)
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: 3+1
      redundancy-note: >-
        QFX5230-64CD hardware guide, Component Redundancy: eight fans in four fan modules of two rotors,
        with 7+1 redundancy at rotor level (stated per module here as 3+1); the switch can handle a single
        rotor failure, and any additional fan or rotor failure triggers alarms and shuts the switch down
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        two supplies, load-sharing; one may be removed at a time while the switch runs (guide, Component
        Redundancy)
