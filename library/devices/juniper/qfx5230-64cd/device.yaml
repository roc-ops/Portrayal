configurations:
  ac-f2b:
    kind: orderable
    default: true
    description: >-
      QFX5230-64CD-AFO: two 3000 W AC supplies (JNP-3000W-AC-AFO) and four front-to-back fan modules (QFX5230-64CD-FANAO).
      All have a Juniper gold handle and the label AIR OUT (guide Tables 3 and 6).
    part-numbers:
      QFX5230-64CD-AFO: {}
  ac-b2f:
    kind: orderable
    airflow: back-to-front
    description: >-
      QFX5230-64CD-AFI: two 2700 W AC supplies (JNP-2700W-AC-AFI) and four back-to-front fan modules (QFX5230-64CD-FANAI).
      All have a green handle and the label AIR IN (guide Tables 3 and 6).
    bays: {psu-0: juniper/qfx5230-jnp-2700w-ac-afi@1, psu-1: juniper/qfx5230-jnp-2700w-ac-afi@1, fan-0: juniper/qfx5230-64cd-fan-afi@1,
      fan-1: juniper/qfx5230-64cd-fan-afi@1, fan-2: juniper/qfx5230-64cd-fan-afi@1, fan-3: juniper/qfx5230-64cd-fan-afi@1}
    part-numbers:
      QFX5230-64CD-AFI: {}
  dc-f2b:
    kind: orderable
    power: dc
    description: >-
      QFX5230-64CD-D-AFO: two 3000 W DC supplies (JNP-3000W-DC-AFO) and four front-to-back fan modules.
      Each supply has a single feed, so feeds A and B go one to each.
    bays: {psu-0: juniper/qfx5230-jnp-3000w-dc-afo@1, psu-1: juniper/qfx5230-jnp-3000w-dc-afo@1}
    part-numbers:
      QFX5230-64CD-D-AFO: {}
  dc-b2f:
    kind: orderable
    power: dc
    airflow: back-to-front
    description: >-
      QFX5230-64CD-D-AFI: two 2400 W DC supplies (JNP-2400W-DC-AFI) and four back-to-front fan modules.
      Each supply has a single feed, so feeds A and B go one to each.
    bays: {psu-0: juniper/qfx5230-jnp-2400w-dc-afi@1, psu-1: juniper/qfx5230-jnp-2400w-dc-afi@1, fan-0: juniper/qfx5230-64cd-fan-afi@1,
      fan-1: juniper/qfx5230-64cd-fan-afi@1, fan-2: juniper/qfx5230-64cd-fan-afi@1, fan-3: juniper/qfx5230-64cd-fan-afi@1}
    part-numbers:
      QFX5230-64CD-D-AFI: {}
  chas:
    kind: orderable
    description: >-
      QFX5230-64CD-CHAS, the spare chassis, shipped without power supplies or fan modules ("Spare Chassis
      without PSU and Fans"). Either AC or DC supplies and AIR OUT or AIR IN fan modules are ordered separately,
      and supplies and fans of one airflow only go in. The supply and fan bays are shown open.
    bays: {psu-0: '', psu-1: '', fan-0: '', fan-1: '', fan-2: '', fan-3: ''}
    part-numbers:
      QFX5230-64CD-CHAS: {}
