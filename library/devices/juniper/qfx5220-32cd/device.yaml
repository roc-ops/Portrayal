format: 1
kind: device
name: qfx5220-32cd
version: 0.1.1
maturity: modelled
manufacturer: Juniper
model: QFX5220-32CD
portfolio: {line: QFX Series, family: QFX5220}
description: >-
  Juniper QFX5220-32CD, a 1RU 400G data-centre spine and leaf switch that runs Junos OS Evolved. It has
  32 QSFP-DD ports (400, 100, 40, 25 or 10 GbE, channelizable) in two rows of sixteen and two SFP+ ports
  (10 GbE only). All ports are on the port side, and each has a lamp beside it. The port side also carries
  an RJ-45 time-of-day port and four clock connectors (PPS and 10 MHz, in and out). It has an RJ-45 console
  port, an RJ-45 management port, a USB port, the reset button, three chassis lamps and the ESD point.
  The rear carries two power supplies, one at each end, and six fan modules between them. It ships as
  one front panel in four power and airflow variants, AC or DC supplies with front-to-back (AIR OUT) or
  back-to-front (AIR IN) airflow. A spare chassis has no supplies and no fan modules.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper QFX5220 Switch Hardware Guide, published 2026-10-14, 321 pages (copyright Hewlett Packard
      Enterprise), from juniper.net. Used here: the front and FRU panel figures 14 and 15, the port panel
      and management panel figures 22 and 24, Tables 3 and 5 to 7 (components, speeds and port lamps),
      Tables 14 and 15 (chassis and management lamps), the cooling tables 16 and 17 and figures 28 to
      31, the power sections (Tables 18, 19, 25, 26, 29 and figures 33, 34, 37, 39), Table 32 (physical
      specifications) and Table 31 (environment). The figures 14 and 15 are photographs of the real unit
      (1500 x 199 px in the PDF, g100343 and g100344). They are read for counts and positions and are
      not copied. The QFX5220 datasheet could not be read: the maker's address for it (juniper.net/content/dam/www/assets/datasheets
      and the older assets/us/en/local/pdf/datasheets/1000653-en.pdf) redirects to an hpe.com PSNow page
      that did not answer when tried, so no datasheet is registered and the datasheet-only figures (forwarding
      rate, buffer, latency) are left out. The part numbers of the orderable variants come from Juniper's
      Hardware Compatibility Tool page for the QFX5220-32CD (apps.juniper.net/hct), the maker's own tool.
      No studio photograph was found on juniper.net, and no Visio stencil or 3D model was found, so the
      guide's photographs are the only photographs. The guide and the tool are the maker's and public.
      The guide is copyrighted and nothing in it is copied.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 32: 1.72 in (4.3 cm) high, 17.26 in (43.8 cm) wide, 21.1 in (53.59 cm) deep, 24.5 lb
      (11.11 kg) with power supplies and fans installed, 1RU. The inch figures are used and the centimetre
      ones in the same cell are rounded copies of them. Juniper's Hardware Compatibility Tool gives the
      same figures (4.3688 x 43.8404 x 53.594 cm). The width is the body: Table 34 says the outer edges
      of the front brackets extend it to 19 in, so the brackets are not part of the body and are not modelled.
      The table does not say whether the depth includes the handles of the supplies and fans.
  gate-1:
    confidence: photo-measured
    note: >-
      The front photograph (figure 14), between its left and right edges, is 1311 px wide and 128 px from
      the top edge to the bottom edge, an aspect of 10.24 against the table's 438.4 / 43.7 = 10.03 (2.1
      percent out: the top lip shows in the photograph). Scale 2.990 px/mm across, used on both axes with
      the origin at the left edge and the top edge. The rear photograph (figure 15) is 1309 px wide, 2.986
      px/mm. Both photographs are small, so every position read from them is good to about 0.3 mm and
      is estimated.
  ports:
    confidence: photo-measured
    note: >-
      Figure 14: 32 QSFP-DD openings in two rows of 16, each about 56 px (18.7 mm) wide on a 57 px (19.0
      mm) pitch, 19.0 mm being the registry's pitch, which is used. They stand in eight pairs of columns,
      every pair 132 px, 44.15 mm, after the last, so the gutter between pairs is 6.15 mm. The first opening
      starts at 38.1 mm, so the 19.0 mm cell starts at 37.8. Counts and groups are callout 3 of figure
      22 and figure 14. Two SFP+ cages stand to the right of the last pair, an upper one at 388.6 mm and
      a lower one under it, callout 9. They are single cages, not a ganged block. The upper SFP+ opening
      measures 11.4 to 21.9 mm down and the lower 26.1 to 35.5, read at 2.99 px/mm.
  row-pitch:
    confidence: photo-measured
    note: >-
      The two QSFP-DD openings of the first column read 12.0 to 20.4 mm and 26.8 to 35.1 mm down (dark
      bore only, centres 16.2 and 31.0). The registry gives no belly-to-belly row pitch for a QSFP-DD
      cage. The row pitch 14.35 mm and the top at 12.0 mm come from the same two rows read on the QFX5130-32CD
      photograph at 4.36 px/mm, which this figure agrees with to 0.5 mm. That is a relative's reading
      used because this figure is too small to improve on it, and it is estimated.
  stack-orientation:
    confidence: estimated
    note: >-
      The light latch tongue shows at the foot of the upper cages and at the top of the lower ones in
      figure 14, so both lips face the band between the rows. The upper cage is upright and the lower
      one turned 180, the library's stack convention. The figure is too small to settle the tongue on
      every cage, so this is read from a few cages and carried to all.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed on the metal in the band between the two rows, read off figure 14 and checked on figure
      22: each column prints "n up-arrow, down-arrow n+1", the even number for the upper cage and the
      odd one for the lower, so the ports run 0 to 31 down each column and left to right. The SFP+ pair
      prints "32 up-arrow, down-arrow 33". The guide numbers the network ports 0 to 31 and the SFP+ ports
      32 and 33 (Table 5 and the Network Ports text). Interface names are not printed. The guide's configuration
      examples name them et-0/0/N on one FPC and one PIC, both 0, and the show chassis led output lists
      et-0/0/0 to et-0/0/33. Port N is therefore et-0/0/N, kept here and not in an interfaces block, because
      the face does not print it.
  port-lamps:
    confidence: photo-measured
    note: >-
      Table 6 gives each QSFP-DD port one bicolour lamp. Table 7 gives each SFP+ port two lamps (link
      and activity at the left, status at the right). Figure 14 shows two small round lamp windows, 2.8
      mm apart, at the left of every pair of columns in each row, centred 3.4 mm left of the first cage
      of the pair. The upper window of a row serves the left column's cage and the lower window serves
      the right column's cage. That assignment is carried over from the QFX5130-32CD, whose guide draws
      a leader from each window, because this guide draws none, so it is estimated. The lamp heights read
      17.4, 20.2, 27.9 and 30.9 mm down. The heights written are 17.0, 19.9, 28.45 and 31.35 mm, the QFX5130-32CD's,
      which agree to 0.45 mm (about one pixel here) and centre the first and last lamp on their cages.
      The SFP+ lamps are two round windows above the upper cage, 5.9 mm apart, and two below the lower
      one. The lamps are unlit in the photograph.
  clock-connectors:
    confidence: photo-measured
    note: >-
      Left of the first pair of columns, under the RJ-45 time-of-day jack: four gold coaxial jacks 6.7
      mm across in two columns and two rows. The left column prints PPS and the right column 10M. The
      upper row prints OUT between the columns and the lower row IN. Guide figure 22 callout 10 says "PTP
      and external clock connections" and the guide's text says "Clock input and output connectors (10
      MHz and 1 PPS)". The columns sit at 17.1 and 28.1 mm and the rows at 29.8 and 37.6 mm (centres).
  tod-jack:
    confidence: photo-measured
    note: >-
      Callout 1 of figure 22, "RJ-45 grandmaster time-of-day connection", is the RJ-45 jack at the upper
      left, printed TOD above it. The shield measures 16.7 mm wide and 13.7 mm high from 8.7 mm and 8.0
      mm. The latch slot is at the top, so the jack is the library's housing turned 180 degrees. It shows
      no lamps.
  mgmt-panel:
    confidence: photo-measured
    note: >-
      Right of the SFP+ pair, from the left: a stacked pair of RJ-45 jacks in one shield 17.1 mm wide,
      a USB-A port standing on its side, and under it the RESET pinhole. Above the jacks the face prints
      "CON up-arrow, down-arrow MGMT", so the upper jack is the console and the lower the management port
      (callouts 5 and 4 of figure 22). Each jack shows a green lamp at one corner and an amber one at
      the other. The guide describes lamps for the management port only (Table 15), so the console jack's
      lamps are not drawn and are a gap. The USB mark is printed above the port. At the left of the face
      are the three chassis lamps ALM, SYS and ID with their legends (callout 2) and the round ESD point
      with its warning mark (callout 11). The lamps stand in a column at 31.8 mm, 5.0, 8.0 and 11.0 mm
      down. The ESD socket is at 8.7 mm and 33.4 mm down and is 3.8 mm across.
  vents:
    confidence: photo-measured
    note: >-
      Hexagonal holes in the sheet: a band along the top above the cages (about 1.0 to 10.6 mm down),
      a band along the bottom (about 37.4 to 42.6 mm), a field at the left edge, a column of slots left
      of the first pair of columns and a field at the right edge. Drawn as vent decor in those positions.
      Figure 14 shows flat-topped hexagonal holes about 2.9 mm across the points, 6.1 mm apart along a
      row, with the next row shifted 3.05 mm and 1.72 mm down. The decor tile is set to that pitch, with
      the lattice phase read at the top band (a hole centre at 39.9 mm across and 2.3 mm down). The positions
      and the pitch are read at 2.99 px/mm, so the whole feature is estimated.
  front-blue-tab:
    confidence: photo-measured
    note: >-
      A light-blue tab at the lower right, 16.8 mm wide and about 3.4 mm high, is the chassis serial number
      slide-out tab, callout 8 of figure 22. It is drawn as decor, because it is a label card and not
      a part the library models.
  logo:
    confidence: photo-measured
    note: >-
      The maker's logo and its lockup are printed at the lower right of the face, above the model name
      QFX5220-32CD. The logo is not drawn: a logo-zone region is reserved where it stands, and the model
      name is drawn as plain text.
  rear-layout:
    confidence: photo-measured
    note: >-
      Figure 15 at 2.986 px/mm, checked against figure 33: supply slot 0 at the left end, six fan slots
      numbered 0 to 5 on a 48.96 mm pitch, then supply slot 1 at the right end, and a grey strip before
      each supply and fan with its power or fan symbol and number. A small round lamp window stands under
      the fan number. The supply bay measures 54.4 mm by 41 mm from 11.9 mm, the first fan 40.3 mm wide
      from 76.4 mm on a 146 px pitch, and the right supply starts at 371.4 mm. These agree with the QFX5130-32CD
      rear to the width of one pixel, and the QFX5130-32CD positions, measured at 4.24 px/mm, are used.
      The orange fan faces and the black supplies are the library's existing parts. The right end carries
      a vertical rating label. Fan 0 is the one nearest the left; Table 16 says the fan modules are numbered
      0 to 5 counting from left to right.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      Figure 14 and figure 22 are the same photograph of the real unit, so the printing in them agrees.
      The figure 15 rear shows orange fans and supplies with AIR OUT chips, the front-to-back build, which
      is the default configuration here. The management jacks show lamps on both jacks in the photograph,
      while the guide's text describes lamps for the management port only. The photograph is followed.
  modules:
    confidence: datasheet
    note: >-
      The six fan modules (QFX5220-32CD-FANAO and -FANAI, Table 16) and the two power supplies (JPSU-1600W-1UACAFO
      and -AFI, JPSU-1600W-1UDCAFO and -AFI, Tables 3, 18 and 25) are field-replaceable units in bays,
      each its own component. Nothing on this chassis is a built-in unit that is not a bay. Each supply
      carries its own small fan inside (the cooling system is six fan modules and a single fan in each
      supply). The status lamp of each fan is on the chassis strip beside its slot (figure 31). All four
      supply components and both fan components already exist in the library under the QFX5130 family
      names, because the part numbers are the same, and are reused as they are.
  variants:
    confidence: datasheet
    note: >-
      Juniper's Hardware Compatibility Tool lists QFX5220-32CD-AFI and -AFO (AC) and QFX5220-32CD-D-AFI
      and -D-AFO (DC) with the chassis QFX5220-32CD-CHAS, and guide Table 3 names the spare chassis QFX5220-32CD-CHAS
      "without fan and power module". All five share this front panel and the rear bays, so each is a
      configuration of this device. The guide also names the DC variant QFX5220-32CD-D (for example in
      the Junos release note, 19.3R1). NOT MODELLED: the QFX5220-32CD ORv3-compliant switch with tray
      assembly (QFX522032CDDAFO-T2, 3.65 x 21.14 x 31.5 in, 41 lb), a different mounting for Open Rack
      v3 racks.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED, provenance only. The guide names the rack mount kits QFX5K-4PST-RMK-E (four-post rails,
      brackets and spacers, shipped in the box) and QFX5220-32CD-4PRMK (a spare four-post kit with front
      and rear mounting rails), and says the front and rear rails must be 28 in (71.1 cm) to 36 in (91.4
      cm) apart. The guide's site section says 23.6 to 36 in. The two ranges disagree. No kit contract
      is written here and `chassis.ears` and `chassis.kits` are left out. The modelled body is the 438.4
      mm chassis, without brackets.
  power:
    confidence: datasheet
    note: >-
      Table 19 (AC): 100 to 240 VAC, 50 to 60 Hz, 12.7 A at 100 to 127 VAC and 9.4 A at 200 to 240 VAC,
      typical 310 W and maximum 834 W at 220 to 240 V. Table 26 (DC): rated -48 to -60 VDC, range -40
      to -72 VDC, 40 A maximum, typical 328 W and maximum 860 W. The guide's note: maximum measured at
      40 C ambient with SR optics at 100 percent load with IMIX traffic; typical at 25 C with DACs at
      50 percent load with IMIX traffic, excluding transceivers. Juniper's Hardware Compatibility Tool
      prints 378 W average and 730 W maximum for AC and 383 W and 877 W for DC. Those differ from the
      guide in both measures, and the guide's tables are used. The AC pair is the device's, since AC is
      the default build, and the DC pair is carried under its own keys.
  colour:
    confidence: photo-measured
    note: >-
      The front plate samples #8a8a8b (the colour the QFX5130-32CD photograph gave) and is kept, because
      figure 14 is a small JPEG with a warm cast. The photographs are lit warmly and these are their values,
      not a paint reference.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-life announcement. No Juniper notice was found and the guide, published 2026-10-14,
      states none. The third-party trackers searched list nothing for the QFX5220. The device states none
      announced. Estimated, because the trackers are not the maker.
attrs:
  physical:
    weight-note: 24.5 lb (11.11 kg) with power supplies and fans installed (guide Table 32)
  performance:
    throughput: 12.8 Tbps (guide, QFX5220-32CD Switch Description)
    qsfpdd-speeds: >-
      400 GbE default; 100, 40, 25 or 10 GbE with the matching optic or breakout cable (guide, Setting
      Port Speed and Channelization)
  power:
    power-typical-w: 310
    power-max-w: 834
    power-envelope: as-tested
    power-measurement-note: >-
      Maximum at 40 C ambient with SR optics at 100 percent load with IMIX traffic. Typical at 25 C with
      DACs at 50 percent load with IMIX traffic, excluding transceivers (guide Table 19)
    power-dc-typical-w: 328
    power-dc-max-w: 860
    power-input-ac: >-
      100 to 240 VAC, 50 to 60 Hz; 12.7 A at 100 to 127 VAC, 9.4 A at 200 to 240 VAC (guide Table 19)
    power-input-dc: rated -48 to -60 VDC, operating -40 to -72 VDC, 40 A maximum (guide Table 26)
    redundancy-note: >-
      two supplies, 1+1, each able to carry the whole switch; both should be installed, on feeds A and
      B
  thermal:
    fans: >-
      six fan modules, 5+1; the switch runs three minutes without thermal alarm while one is replaced
    airflow-note: >-
      AFO is front-to-back (port-to-FRU); AFI is back-to-front (FRU-to-port); no mixing of fans and supplies
      of different direction
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F) for AFO; 0 to 25 C (32 to 77 F) for AFI (guide Table 31)
    storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container
    humidity: 5 to 90 percent noncondensing, operating
    altitude: >-
      no performance degradation to 1828.8 m (6000 ft) at 0 to 40 C for AFO and 0 to 25 C for AFI (guide
      Table 31)
  platform: {cpu: Intel Xeon D-1500 (guide), storage: two internal 50 GB SSDs, software: 'Junos OS Evolved,
      first release 19.1R1 (the DC build 19.3R1)'}
  features:
    optics-qsfp-dd: >-
      400 GbE QSFP-DD DAC, 400 GbE AOC, QSFP28 100 GbE, QSFP+ 40 GbE with breakout (guide, Network Ports)
    optics-sfp-plus: ports 32 and 33 take 10 GbE modules only, not 1 GbE
    ptp: clock input and output connectors for 10 MHz and 1 PPS, and an RJ-45 time-of-day port
  management:
    oob: one RJ-45 management port with link and status lamps
    console: one RJ-45 console port
    usb: one USB 2.0/3.0 port
    timing-outputs: PPS and 10 MHz clock connectors, in and out, and an RJ-45 time-of-day port
  compliance:
    safety: >-
      CAN/CSA-C22.2 No. 60950-1; UL 62368-1; IEC 62368-1:2014; IEC 60950-1:2005/A2:2013 (CB scheme); EN
      60825-1 (guide, Agency Approvals for the QFX Series)
    emc: >-
      FCC 47 CFR Part 15 Class A. EN 55022 Class A. VCCI Class A. BSMI CNS 13438 Class A. AS/NZS CISPR
      22 Class A. EN 55024. CISPR 24. EN 300 386. EN 61000-3-2. EN 61000-3-3. (guide, Agency Approvals
      for the QFX Series)
    nebs: >-
      designed to comply with Zone 4 earthquake requirements of NEBS GR-63-CORE, Issue 3 (guide Table
      31)
  lifecycle: {eol: none-announced}
chassis: {width: 438.4, height: 43.7, depth: 535.9, ru: 1, weight-kg: 11.11, color: '#8a8a8b', airflow: front-to-back,
  power: ac}
gaps:
- what: datasheet-figures
  scope:
  - performance
  reason: vendor-silent
  wanted: >-
    Packet rate, buffer size and latency. The guide states none of them. They are in the QFX5220 datasheet,
    and Juniper's addresses for it redirect to an hpe.com PSNow page that did not answer when tried, so
    the datasheet was not read.
- what: module-depths
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The depth of the fan module and of the power supplies. The guide's figures are photographs and isometrics
    with no scale, and its tables state weights only for the whole chassis.
- what: console-jack-lamps
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    What the green and amber windows at the corners of the upper (console) RJ-45 jack are. The photograph
    shows them on both jacks of the stacked shield. The guide describes lamps for the management port
    only (Table 15) and none for the console. They are not drawn on the console jack.
- what: management-port-speeds
  scope:
  - front
  reason: sources-disagree
  wanted: >-
    The speeds of the management jack. Callout 4 of figure 22 says "100 Mbps/1000 Mbps/10000 Mbps". The
    lamp table (Table 15) describes 10 Mbps, 100 Mbps and 1 Gbps. The jack is modelled at 1g, the highest
    speed Table 15 describes.
- what: tod-jack-lamps
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    Whether the time-of-day RJ-45 jack has lamps. The photograph shows none, and the guide describes none.
- what: clock-connector-type
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The connector type of the four clock jacks. The guide calls them "clock input and output connectors"
    and "PTP and external clock connections" and names no type. The photograph shows gold coaxial jacks
    6.7 mm across, drawn as the library's SMA jack. Estimated. The QFX5220-128C figure 17 calls its equivalent
    jacks "SMB", and the 128C text calls them PPS and 10 MHz connectors, so the type may be SMB.
- what: usb-generation
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The USB revision. The guide says "USB 2.0/3.0 standard" for the one port. The port is drawn with the
    kit's neutral usb2 skin.
- what: rating-label
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    The vertical rating label at the right end of the rear. It is not legible in the guide's photograph
    and is not drawn.
- what: ac-power-figures
  scope:
  - power
  reason: sources-disagree
  wanted: >-
    The AC and DC power draw. The guide's Tables 19 and 26 say typical 310 W and maximum 834 W (AC) and
    328 W and 860 W (DC). Juniper's Hardware Compatibility Tool says 378 W average and 730 W maximum (AC)
    and 383 W and 877 W (DC). The guide's figures are carried.
- what: ears-and-kits
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    The rack ears' positions and the rack kits' contracts. The guide names QFX5K-4PST-RMK-E and QFX5220-32CD-4PRMK
    and gives two different rail spacings. No kit contract exists in the library and none is written here.
groups:
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 400g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      Ports 32 and 33 as printed, rel-pos carrying the printed number, since the origin token cannot express
      a block that starts at 32.
  qsfpdd-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: link, color: '#22c55e'}
    - {name: activity, color: '#22c55e', behavior: blinking}
    - {name: fault, color: '#f59e0b', behavior: blinking}
    description: >-
      One bicolour lamp per QSFP-DD port, in the column of lamps left of each pair of columns (guide Table
      6).
  sfp-plus-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      Two lamps per SFP+ port - link and activity at the left, status at the right (guide Table 7).
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band cluster at the right of the port side - an RJ-45 console port, an RJ-45 management
      port, a USB port and the recessed reset button. Four kinds, one purpose: reaching and recovering
      the switch when the data plane cannot.
  timing:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the time and frequency block at the left of the port side - an RJ-45 time-of-day port and four clock
      connectors (PPS and 10 MHz, in and out). Five jacks of two kinds, one purpose: moving a timing reference
      into or out of the switch.
  status-leds: {term: LED, role: indicator, index-origin: 0, description: 'The three chassis lamps ALM,
      SYS and ID (guide Table 14).'}
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD point on the port side (guide figure 22, callout 11)
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: 5+1
      redundancy-note: >-
        QFX5220 hardware guide, QFX5220 Component Redundancy: the QFX5220-32CD has six fan modules and
        can operate with one not in operation; the failure of more than one can trigger chassis alarms
        and shutdown
  fan-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      The round status lamp beside each fan slot - green when the module is healthy, amber blinking on
      an error (guide Table 17).
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        two supplies, each able to carry the whole switch; one may be removed at a time while the switch
        runs
