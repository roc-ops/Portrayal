configurations:
  base:
    kind: base
    default: true
    power: ac
    source: >-
      vendor - Juniper publishes this as an orderable bundle, QFX10016-BASE. The hardware guide's Table 3
      lists the chassis with its power bus, one RCB with one RCB cover and SSD cover, two fan tray
      controllers, two fan trays, five QFX10000-PWR-AC supplies with five power supply covers, five SIBs
      with one SIB cover, sixteen line card covers and a front panel, over the note that line cards, the
      cable management system and the SATA SSD are not part of the base or redundant configurations. This
      base draws exactly that: one board in RCB slot 0 and a cover in slot 1, five supplies in slots 0 to
      4 and a cover in each of the other five, and a cover in each of the sixteen line-card slots; the
      controllers and boards are inside and not drawn
    description: >-
      QFX10016-BASE (guide Table 3, datasheet ordering information). One QFX10000-RE with its RCB cover
      over the second slot. Five QFX10000-PWR-AC supplies, with a cover over each of the other five
      supply slots. Two QFX10016-FAN trays and sixteen line card covers. Two fan tray controllers
      and five QFX10016-SF boards sit inside. Line cards and cable management are ordered separately.
    bays:
      cb1: juniper/qfx10000-re-cover@1
      psu5: juniper/qfx10000-pwr-cover@1
      psu6: juniper/qfx10000-pwr-cover@1
      psu7: juniper/qfx10000-pwr-cover@1
      psu8: juniper/qfx10000-pwr-cover@1
      psu9: juniper/qfx10000-pwr-cover@1
      fpc0: juniper/qfx10000-lc-cover@1
      fpc1: juniper/qfx10000-lc-cover@1
      fpc2: juniper/qfx10000-lc-cover@1
      fpc3: juniper/qfx10000-lc-cover@1
      fpc4: juniper/qfx10000-lc-cover@1
      fpc5: juniper/qfx10000-lc-cover@1
      fpc6: juniper/qfx10000-lc-cover@1
      fpc7: juniper/qfx10000-lc-cover@1
      fpc8: juniper/qfx10000-lc-cover@1
      fpc9: juniper/qfx10000-lc-cover@1
      fpc10: juniper/qfx10000-lc-cover@1
      fpc11: juniper/qfx10000-lc-cover@1
      fpc12: juniper/qfx10000-lc-cover@1
      fpc13: juniper/qfx10000-lc-cover@1
      fpc14: juniper/qfx10000-lc-cover@1
      fpc15: juniper/qfx10000-lc-cover@1
    part-numbers:
      QFX10016-BASE: {}
  redund:
    kind: orderable
    power: ac
    description: >-
      QFX10016-REDUND (guide Table 3, datasheet): two QFX10000-RE boards, ten QFX10000-PWR-AC supplies,
      two QFX10016-FAN trays and sixteen line card covers; six QFX10016-SF boards inside.
    part-numbers:
      QFX10016-REDUND: {}
  redund-dc:
    kind: orderable
    power: dc
    description: >-
      QFX10016-REDUND-DC (guide Table 3, datasheet): the redundant build with ten QFX10000-PWR-DC
