configurations:
  base:
    kind: base
    default: true
    description: >-
      The switch as it ships with AC power: two AC power supplies and three fan trays in, no slot left
      empty. The EX9251 has no traffic slots, so the base is the AC order below without its part number.
  ac:
    kind: orderable
    description: >-
      EX9251-8X4C: the chassis with two AC power supplies (the guide's Table 2 calls them AC AFO 650W
      PSU) and three fan trays (JNP-FAN-1RU), with the blank panels the datasheet says ship with it. Front-to-back
      airflow.
    part-numbers:
      EX9251-8X4C: {}
  dc:
    kind: orderable
    power: dc
    description: >-
      EX9251-8X4C-DC: the chassis with two DC power supplies (JPSU-650W-DC-AFO) and three fan trays (JNP-FAN-1RU).
      Front-to-back airflow.
    bays: {psu-0: juniper/ex4600-jpsu-650-dc-afo@1, psu-1: juniper/ex4600-jpsu-650-dc-afo@1}
    part-numbers:
      EX9251-8X4C-DC: {}
  chas:
    kind: orderable
    description: >-
      EX9251-CHAS, the spare chassis (guide Table 3). It is listed as a spare part; the guide does not
      say what it ships with, so the bays are shown open, with no supplies and no fan trays. The blank
      panel JNP-PWR-BLNK-1 is a separate spare.
    bays: {psu-0: '', psu-1: '', fan-0: '', fan-1: '', fan-2: ''}
    part-numbers:
      EX9251-CHAS: {}
  single-psu:
    kind: example
    description: >-
      The EX9251-8X4C with one supply and the blank panel JNP-PWR-BLNK-1 over slot 1, as the guide allows
      ("a single power supply provides the maximum configuration"). An illustration, not an order code.
    bays: {psu-1: juniper/jnp-pwr-blnk-1@1}
