configurations:
  base:
    kind: base
    default: true
    power: ac
    source: >-
      derived - the chassis with the engine, supplies and fans in and the line-card slots under their blanks, which is what the vendor's
      QFX5700-BASE-AC ships. It carries no part number of its own: the orderable builds below do.
    description: >-
      The AC chassis as a first look: one routing board, two supplies, two fan trays, every line-card slot blanked.
    bays: {fpc-0: juniper/qfx5700-fpc-blnk@1, fpc-1: juniper/qfx5700-fpc-blnk@1, fpc-2: juniper/qfx5700-fpc-blnk@1,
      fpc-3: juniper/qfx5700-fpc-blnk@1, fpc-4: juniper/qfx5700-fpc-blnk@1, fpc-5: juniper/qfx5700-fpc-blnk@1,
      fpc-6: juniper/qfx5700-fpc-blnk@1, fpc-7: juniper/qfx5700-fpc-blnk@1, fpc-8: juniper/qfx5700-fpc-blnk@1}
  ac:
    kind: orderable
    power: ac
    description: >-
      QFX5700-BASE-AC: the base configuration with AC/HVDC supplies - one QFX5700-RCB (slot 0) with the blank for the other RCB slot, one
      QFX5700-FEB, two JNP-3000W-AC-AFO supplies with blanks over the other two power slots, two JNP5700-FAN trays and a blank (JNP5K-FPC-BLNK) over
      every FPC slot (guide Table 27; datasheet "mit 1 5700-FEB, 1 RCB, redundanten Luefter, 2 AC-Netzteilen, Front-to-Back-Luftstrom"). Airflow is
      front to back only. The line cards and the cable manager ship separately.
    part-numbers:
      QFX5700-BASE-AC: {}
  dc:
    kind: orderable
    power: dc
    description: >-
      QFX5700-BASE-DC: the base configuration with DC supplies - two JNP-3000W-DC-AFO supplies in PSU 0 and PSU 1, the rest as the AC build. Each
      supply has a single feed, so feeds A and B go one to each.
    bays: {psu-0: juniper/qfx5230-jnp-3000w-dc-afo@1, psu-1: juniper/qfx5230-jnp-3000w-dc-afo@1}
    part-numbers:
      QFX5700-BASE-DC: {}
  e-ac:
    kind: orderable
    power: ac
    description: >-
      QFX5700E-BASE-AC: the QFX5700E with AC/HVDC supplies. It has the same front and rear as the QFX5700 and differs in its internal forwarding engine
      board, QFX5700E-FEB in place of QFX5700-FEB, which is not drawn on either face (datasheet ordering information; guide Table 18). The datasheet's
      software scale differs for the E (96,000 MAC addresses against 160,000).
    part-numbers:
      QFX5700E-BASE-AC: {}
  e-dc:
    kind: orderable
    power: dc
    description: >-
      QFX5700E-BASE-DC: the QFX5700E with DC supplies, as QFX5700E-BASE-AC but with two JNP-3000W-DC-AFO supplies in PSU 0 and PSU 1.
    bays: {psu-0: juniper/qfx5230-jnp-3000w-dc-afo@1, psu-1: juniper/qfx5230-jnp-3000w-dc-afo@1}
    part-numbers:
      QFX5700E-BASE-DC: {}
  chas:
    kind: orderable
    power: [ac, dc]
    description: >-
      QFX5700-CHAS, the spare chassis (datasheet: "QFX5700/QFX5700E - spare chassis"). What it ships with is not stated, so every bay is shown open: no
      Routing and Control Board, no line-card blank, no power supply and no fan tray.
    bays: {rcb-0: '', rcb-1: '', fpc-0: '', fpc-1: '', fpc-2: '', fpc-3: '', fpc-4: '', fpc-5: '', fpc-6: '', fpc-7: '', fpc-8: '',
      psu-0: '', psu-1: '', psu-2: '', psu-3: '', fan-0: '', fan-1: ''}
    part-numbers:
      QFX5700-CHAS: {}
