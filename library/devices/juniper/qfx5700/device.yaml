gaps:
  - what: spare-chassis-contents
    scope: [chas]
    reason: vendor-silent
    wanted: >-
      what QFX5700-CHAS ships with. The datasheet calls it a spare chassis ("QFX5700/QFX5700E - Ersatzgehaeuse") and the guide's Table 27 lists only
      the base configuration. It is modelled with every bay open; whether it ships with the FPC blanks, the midplane only or the front brackets
      is not stated.
  - what: redundant-build
    scope: [psus]
    reason: vendor-silent
    wanted: >-
      a redundant (four supply) build. Neither the guide nor the datasheet lists an orderable one: the base configuration has two supplies, and
      the guide says all four must be fitted for power redundancy. The four-supply population is a population of the PSU bays, not a SKU.
  - what: empty-rcb-slot-print
    scope: [res]
    reason: needs-photo
    wanted: a photograph or figure of an empty RCB slot or of the JNP5K-RCB-BLNK blank, and of the power-slot blank (which the guide gives no code);
      both blanks are drawn plain from the openings they cover.
  - what: dc-supply-face
    scope: [psus]
    reason: needs-photo
    wanted: a flat figure or photograph of the QFX5700 DC supply face (the guide's figure 33 is an isometric); the reused part draws it from the AC
      supply's outline.
  - what: environmental-tolerances
    scope: [storage-temp, humidity]
    reason: sources-disagree
    wanted: >-
      the guide's Table 21 (storage -40 to 85 C, humidity 55 to 70 percent) against the datasheet (storage -40 to 70 C, humidity 5 to 90 percent
      operating and 5 to 95 percent not operating). The guide's are carried.
  - what: slot-8-blank-print
    scope: [fpcs]
    reason: sources-disagree
    wanted: the photograph prints nothing on the slot 8 blank and the drawing shows the same latches and screws as a card; the blank is drawn from the drawing.
groups:
  res:
    term: Slot
    role: service
    index-origin: 0
    description: Routing and Control Board slots RCB 0 and RCB 1, the boards upside down in the top row
    attrs:
      redundancy: n+0
      redundancy-note: >-
        n+0 - guide, Routing and Control Board: the QFX5700 supports no RCB or FEB redundancy, so a system has one of each, in slot 0 or slot 1,
        and the RCB and the FEB go in the same slot number. The second slot is not a standby
  fpcs:
    term: Slot
    role: traffic
    index-origin: 0
    description: FPC (line card) slots 0 to 7 and the unsupported slot 8 on the port side, left to right
  psus:
    term: PSU
    role: service
    index-origin: 0
    description: four power supply slots PSU 0 to PSU 3 across the top of the rear
    attrs:
      redundancy: n+1
      redundancy-note: >-
        n+1 - datasheet: "up to four AC or DC power supplies, providing N+N feed redundancy or N+1 PSU redundancy when all power supplies are
        present"; guide: the base configuration requires 1+1 redundancy, and "to provide power redundancy to the system, all the four PSUs must be
        installed". The supplies are load-sharing and take any slot
  fans:
    term: Tray
    role: service
    index-origin: 0
    description: fan trays 0 (lower) and 1 (upper), four fans each
    attrs:
      redundancy: n+1
      redundancy-note: >-
        n+1 - datasheet: "N+1 fan rotor redundancy at chassis level"; guide: the switch continues to operate with one failed rotor, and a second
        rotor failure or a removed tray raises an alarm and shuts the system down in 240 seconds
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the two M6 earthing studs at the left of the rear row
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD points, one on the port side and one on the rear
