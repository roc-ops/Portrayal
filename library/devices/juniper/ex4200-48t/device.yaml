configurations:
  ac:
    kind: orderable
    description: >-
      EX4200-48T as shipped - one 320 W AC power supply in slot 0 with a cover panel over slot 1, the
      fan tray, and the uplink slot covered. Side-to-rear airflow. The datasheet also orders the Trade
      Agreements Act build EX4200-48T-TAA, the same hardware.
    default: true
    part-numbers:
      EX4200-48T: {}
      EX4200-48T-TAA: {}
  dc:
    kind: orderable
    power: dc
    description: >-
      EX4200-48T-DC - one 190 W DC power supply in slot 0 and the fan tray: DC powered, with no PoE (the
      guide: "EX4200 switches with a DC power supply installed do not provide PoE").
    bays: {psu-0: juniper/ex4200-pwr-190-dc@1}
    part-numbers:
      EX4200-48T-DC: {}
  s:
    kind: orderable
    description: >-
      EX4200-48T-S - the spare chassis, shipped with no power supply and no fan tray: "Power supplies
      for this model are not shipped by default; you must order them separately", and so is the fan tray.
      The supply and fan bays are shown open.
    bays: {psu-0: '', psu-1: '', fan-0: ''}
    part-numbers:
      EX4200-48T-S: {}
