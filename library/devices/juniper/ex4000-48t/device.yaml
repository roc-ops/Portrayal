configurations:
  ac:
    kind: base
    description: >-
      The switch as shipped: 48 non-PoE ports, the built-in AC power supply and one built-in front-to-back
      fan. EX4000-48T is the only hardware SKU the datasheet lists for the model (Table 1 and the ordering
      information); there is no DC, back-to-front, -S or -TAA variant.
    default: true
    part-numbers:
      EX4000-48T: {}
