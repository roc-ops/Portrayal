format: 1
kind: device
name: ex4000-48t
version: 1.0.2
maturity: modelled
manufacturer: Juniper
model: EX4000-48T
portfolio: {line: EX Series, family: EX4000}
description: >-
  Juniper EX4000-48T, a fixed 1U access switch with 48 10/100/1000BASE-T ports and no PoE. The front also
  has two SFP+ Virtual Chassis ports and two SFP+ uplink ports, a USB 2.0 Type-A port, a reset pinhole
  and the SYS, MST and CLD status lamps. The rear has an RJ-45 management port, an RJ-45 console port,
  one exhaust fan, an earthing terminal and the AC inlet. The power supply and the fan are built into
  the chassis, so there are no bays. Airflow is front to back. The EX4000-48P has the same front without
  PoE legends and the PoE budget.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX4000 Switch Hardware Guide, Juniper Networks, published 2026-01-20 (261 pages; PDF created 2026-01-20;
      fetched from https://www.juniper.net/documentation/us/en/hardware/ex4000/ex4000.pdf, which answered):
      Table 3 (models), Figure 17 and Figure 18 (the EX4000-48T front and rear panels, flat drawings),
      Tables 22 and 23 (cooling, power and the physical specifications and ports), Table 26 (chassis),
      Tables 27 to 33 (the lamps), Table 34 (input), Table 5 (mounting kits) and the mounting topics.
      EX4000 Line of Ethernet Switches Datasheet, Juniper Networks (PDF created 2025-05-28, 14 pages;
      https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex4000-line-of-ethernet-switches-datasheet.pdf):
      Table 1 (the SKUs), Table 2 (maximum system power without PoE), the specifications and the ordering
      information. Juniper's image-library photographs ex4000-48t-front-high.jpg and ex4000-48t-rear-high.jpg
      (from https://www.juniper.net/us/en/company/images/image-library-logos-and-product-photos/products/ex4000-48t.html,
      2100 px wide, straight on). The guide prints no terms of use; the image-library page prints none
      either. Nothing of any of them is copied here, since every face is drawn new from measurements.
      No Visio stencil and no 3D model of the EX4000 is held or published; the intake folder for Juniper
      EX and QFX was not available to this work and no held photograph, stencil or model was used. End
      of life was searched on 2026-10-23 and no Juniper notice for the EX4000 was found, so the lifecycle
      is recorded as none announced.
  chassis:
    confidence: datasheet
    note: >-
      Table 23 and Table 26 - height 1.71 in (4.34 cm), width 17.36 in (44.10 cm), depth 10.16 in (25.8
      cm), weight 7.9 lb (3.6 kg). The datasheet gives the same width and height, a depth of 10.16 in
      (25.80 cm) and a system weight of 3.56 kg; the guide's chassis weight is carried because Table 26
      is the table of chassis weights. The width of 441.0 mm is the metal between the bracket fold lines:
      the photograph shows no ears and the jack pitch closes on the registry at that width.
  scale:
    confidence: photo-measured
    note: >-
      Gate 1 on the front photograph (2100 x 555 px): the body is read at 4.247 px/mm from the jack-label
      pitch, which is 13.97 mm to the registry's ganged pitch, on a quantity the scale never saw. The
      guide's flat drawing (Figure 17) does not pass: its ports are drawn about 3.5 percent close (its
      jack pitch is 13.5 mm against the body's 441.0 mm), so it is used for what is on the face and for
      the callouts, and the photograph for positions. The rear photograph (2100 x 569 px) reads at 4.252
      px/mm.
  front-layout:
    confidence: estimated
    note: >-
      estimated - Figure 17 and the front photograph. The face is the EX4000-48P's: 48 jacks in four shells
      of six columns and two rows, the first cell at 11.2 mm, the column pitch 13.97 mm and the shell
      step 87.8 mm (6 x 13.97 plus a 3.98 mm gutter), the rows 14.3 mm apart with the upper row turned
      180 so that its latch and lamps face up. The two SFP+ columns abut on the registry's 14.25 mm pitch
      from 365.2 mm in two stacked rows, the lower row turned 180. The vent fields, the status pill, the
      USB port and the reset pinhole are read off the photograph and checked against the 48P's by overlay.
  port-numbering:
    confidence: photo-measured
    note: >-
      The photograph and Figure 17 print 0 and 1, 2 and 3, up to 46 and 47 under the column pairs, each
      number followed by its triangle (an up triangle after the even number and a down triangle after
      the odd one), so the upper jack of a column is the even port. The numbers are white on this non-PoE
      model, orange on the PoE models. The four SFP+ cages are printed 0 and 1 inside a rounded outline
      (the Virtual Chassis ports) and 2 and 3 outside it (the uplink ports). Port numbers are as printed
      on the metal, from 0. The guide gives no interface names, so none is recorded.
  port-lamps:
    confidence: datasheet
    note: >-
      Figures 22 to 26 and Tables 32 and 33 - each RJ-45 jack has a Link Activity lamp at one corner and
      a Status lamp at the other; the common/rj45-ganged-eth@1 housing carries both. Each SFP+ port has
      a Link Activity lamp and a Status lamp, the triangles in the band between the two cage rows. The
      order down, up, down, up across a column is the EX4100's (down arrows for the lower port, up arrows
      for the upper one); the guide does not say which triangle is which lamp, so that order is estimated.
      The Status lamp's colour shows speed (Table 32), so its states are not expressible as one vocabulary
      here (see gaps).
  status-block:
    confidence: estimated
    note: >-
      estimated - Figure 17 callouts 3, 4 and 5 and the photograph. The three chassis lamps SYS, MST and
      CLD sit in a rounded pill at the top right; the guide's drawing puts a round lamp before each legend
      and the photograph shows the legends only, so the lamps are drawn 2.6 mm before each legend. Tables
      27 to 30 give the lamp meanings; the CLD blink patterns are in another document and are not stated
      here.
  usb-reset:
    confidence: estimated
    note: >-
      estimated - Figure 17 callouts 6 and 8. The USB 2.0 Type-A port with the USB symbol below it and
      the reset pinhole (callout 6, with the reset symbol below) are read off the photograph. The claim
      code label (callout 7) is a QR code printed at the right of the face in the drawing and is absent
      from the photograph, so it is a region and not a part.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      The drawing and the photograph agree on what is on the face. The photograph prints the port numbers
      in white on this non-PoE model, the drawing in black, and prints only EX4000 as the model legend.
      The drawing draws a round lamp before each of SYS, MST and CLD where the photograph shows none.
      The photograph of the real device wins for the lettering and the drawing for the lamps. The rear
      photograph shows a round hole beside the AC inlet (the power cord retainer slot) which the guide's
      Figure 18 callouts do not number, although the cord retainer topic uses it. The Juniper logo and
      the driven by Mist AI line are not drawn: a logo-zone is reserved.
  rear:
    confidence: estimated
    note: >-
      estimated - Figure 18 and the rear photograph. From the left: the RJ-45 management port over the
      RJ-45 console port in one housing, printed MGMT and CON with a triangle each, a lighter plate with
      the two-hole protective earthing terminal and the earth symbol, one round exhaust fan, a round hole
      for the power cord retainer and the AC inlet in a black housing with its rating printed under it.
      Five screw heads sit along the lower edge.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Table 22 and Table 23 - the switch has an internal power supply (fixed PSU) and one inbuilt fixed
      fan with front-to-back airflow; the guide's system overview says the EX4000 switch models have inbuilt
      fixed fans and power supply units. The guide gives no replacement procedure for either, and no part
      number. They are part of the chassis and not bays and not components.
  airflow:
    confidence: datasheet
    note: >-
      Table 22, Figure 31 and the cooling section - front to back (air out), the fan at the rear. The
      datasheet gives 10 CFM.
  earthing:
    confidence: datasheet
    note: >-
      The Connect to Power topic and Figure 18 - a two-hole protective earthing terminal on the rear panel,
      secured with two M5 x 10 mm screws with washers (not supplied) and a lug on 6 AWG wire. The holes
      are drawn as decor.
  power:
    confidence: datasheet
    note: >-
      Table 34 - input 100 to 240 VAC at 1.5 A, 50 to 60 Hz. The datasheet's Table 2 gives a maximum system
      power consumption of 63 W with no PoE. The guide's PoE budget table (Table 35) has no row for the
      non-PoE models. The cord is a C13 coupler (power cord topic).
  ears:
    confidence: datasheet
    note: >-
      The guide's quick-start topic says the two-post rack mounting kit EX-RMK (Table 5, provided) ships
      in the box with brackets that bolt flush with the front, and the mounting topics give a 2 in. recessed
      position with the 2-in. recessed front-mounting brackets of the four-post kit EX-4PST-RMK (Table
      5, orderable; also a flush four-post mount). The enhanced toolless four-post kit JNP-4PST-RMK-1U-E
      (orderable) is a further kit. The recess is 2 in. (50.8 mm). No figure measures a bracket fold line,
      so only the recess has an at (the flush at: 0 is the datum of the face), and the kits are not listed
      under kits in this slice: they are named here and not modelled as kind kit contracts.
  color:
    confidence: photo-measured
    note: >-
      median of the bare face between the logo zone and the first jack shell in the front photograph,
      #7d838e. Sampled from a studio photograph, whose white balance may differ from the metal. The numerals
      are the photograph's white, #e4e6e9.
  guide-faces:
    confidence: datasheet
    note: >-
      The guide has flat drawings of the front (Figure 17) and rear (Figure 18) and no top, bottom or
      side elevations; the isometric views are not used.
attrs:
  physical: {weight-note: '7.9 lb (3.6 kg), Table 26; 3.56 kg in the datasheet', depth-note: '10.16 in
      (25.8 cm), Table 23'}
  power: {power-max-w: 63, power-envelope: bare, power-input: '100 to 240 VAC at 1.5 A, 50 to 60 Hz (Table
      34)'}
  thermal:
    cooling: one inbuilt fixed fan, front-to-back airflow, 10 CFM (datasheet)
  environmental:
    operating-temp: 0 to 50 C at sea level, 0 to 45 C up to 1500 m, 0 to 40 C up to 3000 m
    humidity: 5 to 90 percent at 40 C, noncondensing
    altitude: 3000 m operating, 4500 m storage
  platform: {first-junos-release: 24.4R1-S2 (Table 22)}
  features:
    virtual-chassis: >-
      up to 6 EX4000 switches; the two Virtual Chassis ports are SFP+ and VC formation is not supported
      with a 10GBASE-T transceiver in them
    uplink-ports: two SFP+ ports take 1 GbE or 10 GbE transceivers
    optics-sfp-plus: >-
      the two Virtual Chassis ports and the two uplink ports are 1GE or 10GE SFP+ ports (Table 23 and
      Figure 17 callout 2). Virtual Chassis is supported only with 10GE SFP+, and not with a 10GBASE-T
      transceiver in a Virtual Chassis port
  management:
    oob: management Ethernet RJ-45 on the rear panel, with a link activity lamp and a status lamp
    console: RJ-45 console on the rear panel, labelled CON
    usb: one USB 2.0 Type-A port on the front panel
  compliance: {acoustic: '24.2 dBA (guide Table 4, no PoE load applies)', seismic: tested for Zone 4 earthquake
      safety}
  lifecycle: {eol: none-announced}
