format: 1
kind: device
name: ex2300-c-12t
version: 0.3.0
maturity: modelled
manufacturer: Juniper
model: EX2300-C-12T
portfolio: {line: EX Series, family: EX2300}
description: >-
  Juniper EX2300-C-12T is the compact, fanless, non-PoE member of the EX2300 line: a 1RU-high Gigabit
  Ethernet access switch 279 mm wide with 12 10/100/1000BASE-T ports and two built-in 10-Gigabit SFP+/SFP
  uplink ports. The front carries the 12 jacks in two stacked rows numbered 0 to 11 (the upper jack of a
  column takes the even number), the two uplinks numbered 0 and 1, a USB port, the management Ethernet port
  with the RJ-45 console port under it, a mini-USB console port, three status lamps, three port-mode lamps,
  a Factory Reset/Mode button and an ESD point. The rear carries the earthing terminal and the AC power
  cord inlet; there are no fans and no heatsink. The power supply is built into the chassis, so there are
  no bays. It ships standing on its rubber feet; it can also be fixed under a desk, to a wall or a ferrous
  surface, or on two posts of a rack with the separately orderable brackets. The -TAA and -VC part numbers
  are the same chassis. The EX2300-C-12P is the same front with PoE.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX2300 Switch Hardware Guide, Juniper Networks, published 2025-08-12 (314 pages;
      https://www.juniper.net/documentation/us/en/hardware/ex2300/ex2300.pdf): Figure 2 (front panel),
      Figure 8 (rear panel), Table 1 (models), Table 3 (chassis size and weight), Tables 4 to 12 (LEDs and
      Figures 16, 20, 24, 25, 27), the cooling system section, Tables 14 and 15 (power), Table 34 (parts
      list) and Table 35 (mounting methods). The EX2300-C Compact Ethernet Switch datasheet, Juniper
      Networks, document 1000580-017-JP, September 2021 (the Japanese edition,
      https://www.juniper.net/content/dam/www/assets/datasheets/jp/ja/switches/ex2300-c-compact-ethernet-switch-datasheet.pdf):
      its Table 1 and physical specifications. Juniper's own straight-on studio photograph of the
      EX2300-C-12T front (ex2300-12t-front-high.jpg) from the maker's image library
      (https://www.juniper.net/us/en/company/images/image-library-logos-and-product-photos/products/ex2300-12t.html),
      which holds no rear photograph of this model: its rear is drawn from the guide's Figure 8, with the
      earthing holes and the end caps taken from the EX2300-C-12P rear photograph (ex2300-12p-rear-high.jpg)
      because Figure 8 draws them the same. The English datasheet address tried
      (ex2300-ethernet-switch-datasheet.pdf under the same datasheets/us/en/switches path) did not answer,
      so no English datasheet is cited.
  gate-1:
    confidence: measured
    note: >-
      The front photograph is 1500 x 300 px with the body (bumper to bumper) 1449 px across: 5.194 px per mm
      against the 279 mm of Table 3, and the jack pitch reads 72.8 px = 14.02 mm against the registry's
      13.97. The photograph is 6.14 across to down (bumpers included, 1449 by 236 px) against the table's
      279 / 43.6 = 6.40, so y is taken at the same px per mm with the body centred on the bumper extent;
      the guide's Figure 2 shows the same aspect, so neither passes the aspect check and Figure 2 is used
      for what is on the face, not for absolute y. The 12T's face is the 12P's to within a millimetre in
      every feature both photographs show (the first jack reads 38.1 mm here against 38.4 there), so the
      positions other than the jack block are shared. Every position is therefore estimated and good to
      about a millimetre.
  chassis:
    confidence: datasheet
    note: >-
      Table 3: height 1.72 in (4.36 cm), width 10.98 in (27.9 cm), 18.86 in (47.9 cm) with the mounting
      brackets attached, depth 9.45 in (23.8 cm), weight 5.45 lb (2.48 kg). 279.0 x 43.6 x 238.0 is carried,
      the metric as printed. The datasheet (Table 1 and physical specifications) gives 27.9 x 4.4 x 23.9 cm
      (10.98 x 1.72 x 9.4 in) and 1 RU; the guide's depth is used, 1 mm shallower, because the guide's own
      metric and inch figures disagree (9.45 in is 240 mm) and the printed metric is the one the other
      EX2300 devices carry.
  mounting:
    confidence: datasheet
    note: >-
      Table 35 and Table 34: the switch ships standing on four preinstalled rubber feet; it mounts on or
      under a desk or level surface, on a wall by screws, on or under a ferrous surface with the separately
      orderable magnet-mount kit, and on two posts of a 19 in rack or cabinet (also a four-post one) with
      mounting brackets and screws that are "separately orderable for EX2300-C switches"; it cannot be
      mounted recessed. The guide gives no part number for the EX2300-C bracket kit, the wall screws, the
      magnet-mount kit, the cable guard kit or the cable lock kit, so none is listed and no ear position is
      stated; the datasheet states a height of 1 RU, so the chassis is a rack device of 1 RU and a viewer
      that asks for ears gets the generic pair.
  front-layout:
    confidence: estimated
    note: >-
      estimated - read off the front photograph as described under gate-1. The same arrangement as the
      EX2300-C-12P: one shell of six jack columns, the first jack at 38.1 mm, 13.97 apart, the rows 14.1 mm
      apart with the upper row turned 180; two SFP+ cages 33.9 mm apart with LINK over ST on their left;
      an upright USB-A port; the stacked management and console housing with the management jack on top
      turned 180; the mini-USB console port as chassis art; the two ribbed end caps. The photograph shows
      two small corner marks beside the uplinks and above the USB port that carry no printing and are not
      drawn. The mode glyph is printed on the button's cap; the library's button has none, so the glyph
      stands beside it as on the other EX2300 devices.
  port-numbering:
    confidence: photo-measured
    note: >-
      photo-measured - the photograph prints each column's two numbers in grey under the shell (orange on
      the PoE model), the even number up and left and the odd number down and right (0 and 1, ... 10 and
      11), so the upper jack takes the even number; the two uplinks print 0 and 1 under their cages. Port
      numbers are as printed on the metal, from 0. The Junos interface names are not printed: the guide's
      Table 2 gives PIC 0 as 12x10/100/1000 Base-T and PIC 1 as 2x10G SFP/SFP+, i.e. ge-0/0/0 to ge-0/0/11
      and xe-0/1/0 and xe-0/1/1; they are recorded here and not in an interfaces block because the
      faceplate does not print them.
  lamps:
    confidence: datasheet
    note: >-
      Hardware guide, Tables 4 to 12 and Figures 16, 20, 24, 25 and 27. Each RJ-45 port and uplink has two
      lamps, Link/Activity and Status; the Status lamp reads out whichever of SPD, DX and EN the Factory
      Reset/Mode button has selected, shown by which port-mode lamp is lit. The guide's Figure 2 and
      callout 5 give three port-mode lamps on a model without PoE ("The LED labeled PoE is present only on
      models with PoE capability"). The photograph prints a PoE legend at the fourth place all the same, in
      grey and with no lamp, so the legend is drawn and no lamp is placed: the photograph of the real unit
      wins on what is printed, the guide on what is lit. SYS is green, ALM red or yellow and MST green. The
      jack lamps keep the component's link and activity vocabulary because a block cannot override it per
      lamp.
  uplinks:
    confidence: photo-measured
    note: >-
      photo-measured - two SFP+/SFP cages numbered 0 and 1, each with LINK over ST beside it; the guide
      gives 2x10G SFP/SFP+ and says the ports can be Virtual Chassis ports with SFP+ transceivers but not
      with SFP.
  front-console:
    confidence: estimated
    note: >-
      estimated - the mini-USB console port (guide Figure 2, callout 7) is the placed std/mini-usb
      (`console-usb`), centred on the 7.9 x 4.6 mm shell this device was drawn with. The part draws the
      registry's 7.7 x 3.9 mm Mini-B shell, which stands in for the maker's own (gap `mini-usb-console-shell`).
      The guide names the connector: "Mini-USB Type-B (5-pin)" (Console Ports, p4; Mini-USB Port Pinout
      Specifications, p86).
  esd-point:
    confidence: photo-measured
    note: >-
      photo-measured - Figure 2 callout 10: the ESD point is a banana jack on the left of the face with the
      ESD triangle beside it, drawn as a stroked triangle mark. A second, smaller hole under it in the
      photograph carries no printing and is not named by the guide, so it is not drawn.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - positions off the guide's Figure 8 (1500 x 327 px, body 1342 px across at 4.81 px per
      mm) for the AC inlet and the two screws, and off the EX2300-C-12P rear photograph for the earthing
      holes and symbol, which Figure 8 draws in the same place. The inlet sits 21 mm nearer the middle than
      on the 12P because there is no heatsink beside it. The guide's drawn serial number and CLEI
      rectangles (callouts 1 and 2) are left out: they are paper labels carrying real serial numbers. No
      studio photograph of this rear is held.
  rear-legend:
    confidence: drawing
    note: >-
      Figure 8 prints "AC INPUT : 100-240V~ 50-60Hz : 2.5A Max" beside the inlet. Table 15 gives the
      EX2300-C-12T 1 A at 100 VAC and 0.5 A at 240 VAC, so the legend and the table disagree (2.5 A is the
      12P's figure in Table 15); the legend is drawn as the figure prints it, the table's figure is
      carried in attrs, and the conflict is recorded rather than settled.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Hardware guide, Power Supply in EX2300 Switches: "The power supply in EX2300 switches is built in
      along the rear panel of the chassis"; Table 2 lists "Switch with built-in power supply" and, for the
      fan, "EX2300-C switches are fanless models". Nothing in the guide describes removing or replacing the
      supply. It is part of the chassis, not a bay and not a component, and there are no fans.
  airflow:
    confidence: datasheet
    note: >-
      The cooling system "consists of the vents on the top of the chassis"; there are no fans, so the
      chassis is passive.
  power:
    confidence: datasheet
    note: >-
      Table 14: maximum power consumed by the switch 20 W, no PoE; Table 15: 100 through 240 VAC, 50/60 Hz,
      1 A at 100 VAC and 0.5 A at 240 VAC. The datasheet's power rating (40 W AC) is recorded and not
      carried.
  colour:
    confidence: photo-measured
    note: >-
      median of the bare front plate in the photograph (#686d71).
  ground-stud-pitch:
    confidence: estimated
    note: >-
      INFERRED, NOT STATED. Table 36 names two 10-32 x .25 in. screws with #10 split-lock washers and a Panduit
      LCC10-14AW-L lug or equivalent (not provided) for the EX2300 and EX2300-C, and gives no spacing. The rear
      photograph puts the two holes 15.9 mm apart: 5/8 in. (15.875) and not 3/4 in. (19.05). The lug's own code is not
      in the library's registry, so it is the photograph that carries the pitch. The terminal is
      `common/ground-hole-pair-5-8-10-32@1`: two bare 10-32 holes on 5/8 in. centres, presenting `stud-pair-5-8`, so
      one two-hole lug (`generic/two-hole-lug-5-8@1`) lands across them and a ring lug still lands on either hole. The
      holes stay bare, as the photograph shows them; the screws that hold the lug are not part of the switch. The
      holes were drawn 15.9 apart as decor and the pair stands on their midpoint.
attrs:
  physical:
    weight-note: 5.45 lb (2.48 kg), Table 3
  power:
    power-max-w: 20
    power-envelope: bare
    power-input: 100 through 240 VAC, 50/60 Hz
    power-current-max: 1 A at 100 VAC; 0.5 A at 240 VAC
  thermal:
    cooling: fanless, passive
  environmental:
    operating-temp-c: 0 to 40
    humidity: 10 to 85 percent, noncondensing
    altitude-ft: 5,000
  features:
    optics-sfp-plus: >-
      hardware guide, Uplink Ports: the two uplink ports take SFP and SFP+ transceivers.
      A Virtual Chassis can be formed with SFP+ and not with SFP
    virtual-chassis: >-
      up to four switches; the -VC part number ships with the Virtual Chassis licence on paper, the
      other part numbers do not
chassis:
  width: 279.0
  height: 43.6
  depth: 238.0
  ru: 1
  weight-kg: 2.48
  color: '#686d71'
  airflow: passive
  power: ac
gaps:
- what: mini-usb-console-shell
  scope: [console-usb]
  reason: needs-photo
  note: >-
    The part is the registry's Mini-B receptacle (Molex drawing SD-54819-026, 7.7 x 3.9 mm). The shell this
    device was drawn with, 7.9 x 4.6 mm, is the size the other EX2300 devices carry, and no close-up of this
    console is held, so the drawn shell and its place are estimates and the maker's own shell may differ.
  wanted: A straight-on close-up of the console port with a scale, or the maker's dimensioned drawing of it.
- what: rack-ears
  scope: [front]
  reason: needs-drawing
  note: >-
    Tables 34 and 35 say the two-post mounting brackets and their screws are separately orderable for the
    EX2300-C and name no part number; no figure measures a bracket position, so no ear position is
    stated and no kit is listed.
  wanted: The EX2300-C bracket kit's part number and a dimensioned drawing of the bracket positions.
- what: eol
  scope: [front]
  reason: vendor-silent
  note: >-
    Searched for an end-of-life notice: only third-party lifecycle trackers answered; Juniper's own
    bulletin was not found, so no lifecycle is written.
  wanted: Juniper's end-of-life bulletin for the EX2300 line.
- what: jack-lamp-meaning
  scope: [rj45]
  reason: vendor-silent
  note: >-
    The jack lamps carry the component's link and activity vocabulary; the guide's Status lamp
    switches meaning with the mode button and no per-lamp state list fits the component.
  wanted: none beyond the component's own vocabulary.
- what: rear-photograph
  scope: [rear]
  reason: needs-photo
  note: >-
    The maker's image library holds no EX2300-C-12T rear photograph; its rear follows Figure 8 and the
    12P's photographed parts.
  wanted: A straight-on studio photograph of the EX2300-C-12T rear.
- what: top-and-sides
  scope: [top, bottom, left, right]
  reason: needs-drawing
  note: >-
    The guide shows the top, the right panel (with its security slot) and the underside (with its
    rubber feet) only in perspective.
  wanted: A flat drawing of the top and of the right panel.
- what: ground-pair-pitch
  scope: [ground-pair]
  reason: vendor-silent
  note: >-
    The guide names the screws and the lug and gives no spacing for the two holes; `ground-stud-pitch` says what the
    pair is drawn at and why.
  wanted: a drawing that dimensions the two holes, or the lug's own datasheet
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g}
    description: >-
      the 12 built-in 10/100/1000BASE-T ports; rel-pos carries the number printed on the faceplate, the
      upper jack of a column takes the even number
  uplink:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: the two built-in SFP+/SFP uplink ports, numbered 0 and 1
  uplink-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: two lamps beside each uplink numeral, Link/Activity (LINK) and Status (ST)
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      how the switch is reached out of band - the management Ethernet port, the RJ-45 console port, the
      mini-USB console port and the USB port on the front
  controls:
    term: Button
    role: management
    index-origin: 0
    description: the Factory Reset/Mode button
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the SYS, ALM and MST chassis status lamps
  mode-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the SPD, DX and EN port-mode lamps; the one lit says what each Status lamp shows
  power-input:
    term: Inlet
    role: service
    index-origin: 0
  esd:
    term: Point
    role: furniture
    index-origin: 0
  furniture:
    term: Item
    role: furniture
    index-origin: 0
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the earthing terminal, two bare 10-32 holes for a two-hole lug (Table 36)
