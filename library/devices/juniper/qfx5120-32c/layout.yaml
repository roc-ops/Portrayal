      QFX5120-32C-DC-AFI: two 650 W DC supplies (QFX520048Y-DPSU-AI) and six back-to-front fan modules
      (QFX520048Y-FAN-AI). The front panel is the same (guide Tables 7 and 36).
    bays:
      psu-0: juniper/qfx5200-48y-dpsu-ai@1
      psu-1: juniper/qfx5200-48y-dpsu-ai@1
      fan-0: juniper/qfx5200-48y-fan-afi@1
      fan-1: juniper/qfx5200-48y-fan-afi@1
      fan-2: juniper/qfx5200-48y-fan-afi@1
      fan-3: juniper/qfx5200-48y-fan-afi@1
      fan-4: juniper/qfx5200-48y-fan-afi@1
      fan-5: juniper/qfx5200-48y-fan-afi@1
    part-numbers:
      QFX5120-32C-DC-AFI: {}
