configurations:
  ac-f2b:
    kind: orderable
    default: true
    description: >-
      QFX5120-32C-AFO: two 650 W AC supplies (QFX520048Y-APSU-AO) and six front-to-back fan modules (QFX520048Y-FAN-AO).
      All have a red handle or ejector lever and the label F2B (guide Tables 7, 23 and 26).
    part-numbers:
      QFX5120-32C-AFO: {}
  ac-b2f:
    kind: orderable
    airflow: back-to-front
    description: >-
      QFX5120-32C-AFI: two 650 W AC supplies (QFX520048Y-APSU-AI) and six back-to-front fan modules (QFX520048Y-FAN-AI).
      All have a blue handle or ejector lever and the label B2F (guide Tables 7, 23 and 26).
    bays: {psu-0: juniper/qfx5200-48y-apsu-ai@1, psu-1: juniper/qfx5200-48y-apsu-ai@1, fan-0: juniper/qfx5200-48y-fan-afi@1,
      fan-1: juniper/qfx5200-48y-fan-afi@1, fan-2: juniper/qfx5200-48y-fan-afi@1, fan-3: juniper/qfx5200-48y-fan-afi@1,
      fan-4: juniper/qfx5200-48y-fan-afi@1, fan-5: juniper/qfx5200-48y-fan-afi@1}
    part-numbers:
      QFX5120-32C-AFI: {}
  dc-f2b:
    kind: orderable
    power: dc
    description: >-
      QFX5120-32C-DC-AFO: two 650 W DC supplies (QFX520048Y-DPSU-AO) and six front-to-back fan modules
      (QFX520048Y-FAN-AO). The front panel is the same (guide Tables 7 and 36).
    bays: {psu-0: juniper/qfx5200-48y-dpsu-ao@1, psu-1: juniper/qfx5200-48y-dpsu-ao@1}
    part-numbers:
      QFX5120-32C-DC-AFO: {}
  dc-b2f:
    kind: orderable
    power: dc
    airflow: back-to-front
    description: >-
      QFX5120-32C-DC-AFI: two 650 W DC supplies (QFX520048Y-DPSU-AI) and six back-to-front fan modules
      (QFX520048Y-FAN-AI). The front panel is the same (guide Tables 7 and 36).
    bays: {psu-0: juniper/qfx5200-48y-dpsu-ai@1, psu-1: juniper/qfx5200-48y-dpsu-ai@1, fan-0: juniper/qfx5200-48y-fan-afi@1,
      fan-1: juniper/qfx5200-48y-fan-afi@1, fan-2: juniper/qfx5200-48y-fan-afi@1, fan-3: juniper/qfx5200-48y-fan-afi@1,
      fan-4: juniper/qfx5200-48y-fan-afi@1, fan-5: juniper/qfx5200-48y-fan-afi@1}
    part-numbers:
      QFX5120-32C-DC-AFI: {}
