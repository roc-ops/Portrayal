format: 1
kind: device
name: ex4000-24p
version: 1.0.2
maturity: modelled
manufacturer: Juniper
model: EX4000-24P
portfolio: {line: EX Series, family: EX4000}
description: >-
  Juniper EX4000-24P, a fixed 1U access switch with 24 10/100/1000BASE-T ports that all supply PoE+ (30 W per port, 370 W
  budget). The front also has two SFP+ Virtual Chassis ports and two SFP+ uplink ports, a USB 2.0 Type-A port, a reset
  pinhole and the SYS, MST and CLD status lamps. The rear has an RJ-45 management port, an RJ-45 console port, two exhaust
  fans, an earthing terminal and the AC inlet. The power supply and the two fans are built into the chassis, so there are
  no bays. Airflow is front to back.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX4000 Switch Hardware Guide, Juniper Networks, published 2026-01-20 (261 pages; PDF created 2026-01-20; fetched from
      https://www.juniper.net/documentation/us/en/hardware/ex4000/ex4000.pdf, which answered): Table 3 (models), Figure 9 and
      Figure 10 (the EX4000-24P front and rear panels, flat drawings), Tables 14 and 15 (cooling, power and the physical
      specifications and ports), Table 26 (chassis), Tables 27 to 33 (the lamps), Table 34 (input), Table 35 (PoE budget), Table 5
      (mounting kits) and the mounting topics. EX4000 Line of Ethernet Switches Datasheet, Juniper Networks (PDF created 2025-05-28, 14
      pages; https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex4000-line-of-ethernet-switches-datasheet.pdf):
      Table 1 (the SKUs), Table 2 (maximum system power without PoE), the specifications and the ordering information. Juniper's
      image-library photographs ex4000-24p-front-high.jpg and ex4000-24p-rear-high.jpg (from
      https://www.juniper.net/us/en/company/images/image-library-logos-and-product-photos/products/ex4000-24p.html, 2100 px wide,
      straight on). The guide prints no terms of use; the image-library page prints none either. Nothing of any of them is copied
      here, since every face is drawn new from measurements. No Visio stencil and no 3D model of the EX4000 is held or published; the
      intake folder for Juniper EX and QFX was not available to this work and no held photograph, stencil or model was used. End of
      life was searched on 2026-10-23 and no Juniper notice for the EX4000 was found, so the lifecycle is recorded as none announced.
  chassis:
    confidence: datasheet
    note: >-
      Table 15 and Table 26 - height 1.71 in (4.34 cm), width 17.36 in (44.10 cm), depth 10.16 in (25.8 cm), weight 9.2 lb (4.2 kg).
      The datasheet gives the same width, height and depth and a system weight of 4.00 kg; the guide's chassis weight is carried because
      Table 26 is the table of chassis weights. The width of 441.0 mm is the metal between the bracket fold lines: the photograph shows no
      ears and the jack pitch closes on the registry at that width.
  scale:
    confidence: photo-measured
    note: >-
      Gate 1 on the front photograph (2100 x 546 px): the body runs from 119 to 2002 px, 4.27 px/mm, and the jack-label pitch of 59.9 px then reads
      14.0 mm, the registry's 13.97 mm ganged pitch, on a quantity the scale never saw. The guide's flat drawing (Figure 9) does not pass: its ports
      are drawn about 3.5 percent close, so it is used for what is on the face and for the callouts, and the photograph for positions. The rear
      photograph (2100 x 454 px) runs from 116 to 1989 px and reads at 4.25 px/mm between its own edges.
  front-layout:
    confidence: estimated
    note: >-
      estimated - Figure 9 and the front photograph. The 24 jacks stand in two shells of six columns and two rows, the first cell at 178.4 mm and the
      column pitch 13.97 mm; the shells are 10.1 mm further apart than the jacks (shell edges at 176.6 and 270.5 mm, a gap of about 6 mm between
      them), unlike the 48-port models, whose four shells nearly abut. The rows are 14.3 mm apart with the upper row turned 180 so that its latch and
      lamps face up. The two SFP+ columns, the status pill, the USB port and the reset pinhole sit exactly where the EX4000-48P has them (the photograph
      puts the SFP+ block at 364.4 mm and the status pill at 396.0 mm in both), and the plain left half of the face carries the model legend and two
      slot-vent strips along the top and bottom edges (17.1 to 101.2 mm).
  port-numbering:
    confidence: photo-measured
    note: >-
      The photograph and Figure 9 print 0 and 1, 2 and 3, up to 22 and 23 under the column pairs, each number followed by its triangle (an up triangle
      after the even number and a down triangle after the odd one), so the upper jack of a column is the even port. The four SFP+ cages are printed 0 and
      1 inside a rounded outline (the Virtual Chassis ports) and 2 and 3 outside it (the uplink ports). Port numbers are as printed on the metal, from 0.
      The guide gives no interface names, so none is recorded.
  port-lamps:
    confidence: datasheet
    note: >-
      Figures 22 to 26 and Tables 32 and 33 - each RJ-45 jack has a Link Activity lamp at one corner and a Status lamp at the other; the
      common/rj45-ganged-eth@1 housing carries both. Each SFP+ port has a Link Activity lamp and a Status lamp, the triangles in the band between the two
      cage rows. The order down, up, down, up across a column is the EX4100's (down arrows for the lower port, up arrows for the upper one); the guide does
      not say which triangle is which lamp, so that order is estimated. The Status lamp's colour shows speed (Table 32), so its states are not
      expressible as one vocabulary here (see gaps).
  status-block:
    confidence: estimated
    note: >-
      estimated - Figure 9 callouts 2, 3 and 4 and the photograph. The three chassis lamps SYS, MST and CLD sit in a rounded pill at the top right; the guide's
      drawing puts a round lamp before each legend and the photograph shows the legends only, so the lamps are drawn 2.6 mm before each legend. Tables 27 to 30
      give the lamp meanings; the CLD blink patterns are in another document and are not stated here.
  usb-reset:
    confidence: estimated
    note: >-
      estimated - Figure 9 callouts 5 and 7. The USB 2.0 Type-A port with the USB symbol below it and the reset pinhole (callout 5, with the reset symbol
      below) are read off the photograph. The claim code label (callout 6) is a QR code printed at the right of the face in the drawing and is absent from
      the photograph, so it is a region and not a part.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      The drawing and the photograph agree on what is on the face. The photograph prints the port numbers in orange on this PoE+ model and the drawing in
      black, and prints EX4000 PoE+ with PoE+ in orange. The drawing draws a round lamp before each of SYS, MST and CLD where the photograph shows none. The
      photograph of the real device wins for the lettering and the drawing for the lamps. The Juniper logo and the driven by Mist AI line are not drawn: a
      logo-zone is reserved.
  rear:
    confidence: estimated
    note: >-
      estimated - Figure 10 and the rear photograph. From the left: the RJ-45 management port over the RJ-45 console port in one housing, printed MGMT and CON
      with a triangle each, the first round exhaust fan, a lighter plate with the two-hole protective earthing terminal and the earth symbol, the second fan, a
      round hole for the power cord retainer (callout 5) and the AC inlet in a black housing with its rating printed under it. Five screw heads sit along the
      lower edge. The fan, earthing and inlet positions are read off the photograph at 4.25 px/mm.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Table 14 and Table 15 - the switch has an internal power supply (fixed PSU) and two inbuilt fans with front-to-back airflow; the guide's system overview
      says the EX4000 switch models have inbuilt fixed fans and power supply units. The guide gives no replacement procedure for either, and no part number.
      They are part of the chassis and not bays and not components.
  airflow:
    confidence: datasheet
    note: >-
      Table 14, Figure 27 and the cooling section - front to back (air out), the two fans at the rear. The datasheet gives 16 CFM.
  earthing:
    confidence: datasheet
    note: >-
      The Connect to Power topic and Figure 10 - a two-hole protective earthing terminal on the rear panel, secured with two M5 x 10 mm screws with washers (not
      supplied) and a lug on 6 AWG wire. The holes are drawn as decor.
  power:
    confidence: datasheet
    note: >-
      Table 34 - input 100 to 240 VAC at 8.5 A, 50 to 60 Hz. Table 35 - system budget 45.44 W, PoE budget 370 W, total 415.44 W. The datasheet's Table 2 gives a
      maximum system power consumption, input power without PoE, of 51 W; the two are different measures (a budget and a maximum) and both are recorded. The
      cord is a C13 coupler (power cord topic).
  ears:
    confidence: datasheet
    note: >-
      The guide's quick-start topic says the two-post rack mounting kit EX-RMK (Table 5, provided) ships in the box with brackets that bolt flush with the front, and
      the mounting topics give a 2 in. recessed position with the 2-in. recessed front-mounting brackets of the four-post kit EX-4PST-RMK (Table 5, orderable; also a
      flush four-post mount). The enhanced toolless four-post kit JNP-4PST-RMK-1U-E (orderable) is a further kit. The recess is 2 in. (50.8 mm). No figure measures a
      bracket fold line, so only the recess has an at (the flush at: 0 is the datum of the face), and the kits are not listed under kits in this slice: they are named here and not modelled as kind kit contracts.
  color:
    confidence: photo-measured
    note: >-
      median of the bare face left of the first jack shell in the front photograph, #7d838e. Sampled from a studio photograph, whose white balance may differ from
      the metal. The numerals are the photograph's orange, #f3855a.
  guide-faces:
    confidence: datasheet
    note: >-
      The guide has flat drawings of the front (Figure 9) and rear (Figure 10) and no top, bottom or side elevations; the isometric views are not used.
attrs:
  physical:
    weight-note: 9.2 lb (4.2 kg), Table 26; 4.00 kg in the datasheet
    depth-note: 10.16 in (25.8 cm), Table 15
  power:
    power-max-w: 51
    power-envelope: bare
    poe-budget-w: 370
    poe-standard: PoE+ (IEEE 802.3at) on all 24 ports, 30 W per port
    power-input: 100 to 240 VAC at 8.5 A, 50 to 60 Hz (Table 34)
  thermal:
    cooling: two inbuilt fixed fans, front-to-back airflow, 16 CFM (datasheet)
  environmental:
    operating-temp: 0 to 50 C at sea level, 0 to 45 C up to 1500 m, 0 to 40 C up to 3000 m
    humidity: 5 to 90 percent at 40 C, noncondensing
    altitude: 3000 m operating, 4500 m storage
  platform:
    first-junos-release: 24.4R1-S2 (Table 14)
  features:
    virtual-chassis: up to 6 EX4000 switches; the two Virtual Chassis ports are SFP+ and VC formation is not supported with a 10GBASE-T transceiver in them
    uplink-ports: two SFP+ ports take 1 GbE or 10 GbE transceivers
    optics-sfp-plus: the two Virtual Chassis ports and the two uplink ports are 1GE or 10GE SFP+ ports (Table 15 and Figure 9 callout 8). Virtual Chassis is supported only with 10GE SFP+, and not with a 10GBASE-T transceiver in a Virtual Chassis port
  management:
    oob: management Ethernet RJ-45 on the rear panel, with a link activity lamp and a status lamp
    console: RJ-45 console on the rear panel, labelled CON
    usb: one USB 2.0 Type-A port on the front panel
  compliance:
    acoustic: 24.6 / 24.4 / 24.5 dBA at 0 / 50 / 100 percent PoE load (guide Table 4); 24.4 dBA in the datasheet
    seismic: tested for Zone 4 earthquake safety
  lifecycle: {eol: none-announced}
