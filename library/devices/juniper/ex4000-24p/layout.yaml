gaps:
- what: rack-kits
  scope: [front]
  reason: needs-drawing
  wanted: >-
    The brackets of EX-RMK (provided), EX-4PST-RMK and JNP-4PST-RMK-1U-E (orderable) are named in Table 5 and the mounting topics and are
    not modelled as kit contracts in this slice. A dimensioned drawing of the bracket fold lines would give the flush position an at.
- what: port-status-lamp-states
  scope: [rj45, vcp, uplink]
  reason: vendor-silent
  wanted: >-
    A per-port vocabulary for the Status lamp. Table 32 gives its colour by speed (off 10 Mbps, blinking green 100 Mbps, green 1000 Mbps,
    amber 2.5 Gbps), which the jack's own lamp states do not carry, so the jack keeps the component's default off, link and activity states.
- what: label-plate
  scope: [front]
  reason: needs-drawing
  wanted: >-
    The size of the claim code label (Figure 9 callout 6). It is drawn as a region and not as a part, and the photograph does not show it.
- what: interface-names
  scope: [rj45, vcp, uplink]
  reason: vendor-silent
  wanted: >-
    The Junos interface names. The hardware guide gives the PIC numbering only inside the Junos configuration topics, which this slice does
    not read.
- what: four-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: A flat drawing or photograph of the lid, the underside and the side panels.
- what: reset-pinhole-size
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The diameter and depth of the pinhole reset button (Figure 9 callout 5). The guide names the button and gives no size; the hole is drawn
    at 2.0 mm as an estimate.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g, poe: 802.3at}
    description: 24 PoE+ 10/100/1000BASE-T ports labelled 0 to 23 in two shells of six columns. The even ports are on the upper row
  vcp:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: Two SFP+ Virtual Chassis ports labelled 0 and 1, 1 GbE or 10 GbE, in one column of two. They are bracketed by a rounded outline
  vcp-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: 'on', color: '#22c55e'}, {name: blinking, color: '#22c55e', behavior: blinking}]
    description: >-
      A Link Activity lamp and a Status lamp for each Virtual Chassis port, triangles in the band between the two cage rows (Table 33).
      Link Activity is steady with a link and blinking with traffic. Status shows speed: steady 10 Gbps, blinking 1 Gbps
  uplink:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: Two SFP+ uplink ports labelled 2 and 3, 1 GbE or 10 GbE, in one column of two. The rel-pos carries the printed number
  uplink-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: 'on', color: '#22c55e'}, {name: blinking, color: '#22c55e', behavior: blinking}]
    description: >-
      A Link Activity lamp and a Status lamp for each uplink port, triangles in the band between the two cage rows (Table 33). Link Activity is
      steady with a link and blinking with traffic. Status shows speed: steady 10 Gbps, blinking 1 Gbps
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      how the switch is reached out of band and reset - the RJ-45 management port and the RJ-45 console port on the rear, the USB port on the front
      and the reset pinhole
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: SYS, MST and CLD chassis lamps (Tables 27 to 30)
  power-input:
    term: Inlet
    role: service
    index-origin: 0
    description: the AC inlet of the built-in power supply
  furniture:
    term: Item
    role: furniture
    index-origin: 0
