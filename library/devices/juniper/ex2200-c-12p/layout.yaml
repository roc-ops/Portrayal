format: 1
kind: device
name: ex2200-c-12p
version: 0.3.0
maturity: modelled
manufacturer: Juniper
model: EX2200-C-12P
portfolio: {line: EX Series, family: EX2200}
description: >-
  Juniper EX2200-C-12P is the compact, fanless member of the EX2200 line: a 1RU-high Gigabit Ethernet access
  switch 269 mm wide with 12 10/100/1000BASE-T ports, all with PoE+ and 100 W available, and two dual-purpose
  uplink ports, each an RJ-45 port beside an SFP port of which only one is active at a time. The front carries
  the 12 jacks in two stacked rows numbered 0 to 11 (the upper jack of a column takes the even number), the
  two dual-purpose uplinks numbered 0 and 1, a USB port, the management Ethernet port with the RJ-45 console
  port above it, a mini-USB console port, two chassis status lamps, four port-mode lamps and a Factory
  Reset/Mode button. The rear carries the earthing terminal, an ESD point, a heatsink and the AC power cord
  inlet; there are no fans. The power supply is built into the chassis, so there are no bays. The EX2200-C-12T
  is the same front without PoE.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX2200 and EX2200-C Switches Hardware Guide, Juniper Networks, published 2022-02-02 (268 pages), the copy
      held in Juniper's EX documentation archive
      (https://www.juniper.net/documentation/en_US/release-independent/downloads/ex-series/ex-series-doc-archives.zip,
      member ex-series-doc-archives/ex2200.pdf): Figure 3 (EX2200-C PoE+ front), Figure 6 (rear with heatsink),
      Table 3 (models), Table 5 (chassis size and weight), Tables 6 to 10 (LEDs and Figures 8, 10 and 13),
      the cooling system section, Tables 11 and 12 (power) and Table 16 (environment). The guide is the only
      source held for the EX2200-C: Juniper's datasheet is dehosted, the held photograph set has no EX2200 or
      EX2200-C photograph and the maker's image library no longer carries one. The guide carries Juniper's
      copyright and reserves its rights, so its figures were read for what is on each face and where, and none
      was copied; every skin here is drawn from those measurements.
  gate-1:
    confidence: measured
    note: >-
      Figure 3 was rendered at 600 dpi and measured with a pixel ruler. Its front face is 2801 px across and
      445 px down: 10.41 px per mm across from the 269.2 mm of Table 5 and 10.01 down from 44.45 mm, a 4 percent
      aspect error, so x and y are each taken from their own dimension and every position is estimated and good
      to about a millimetre. The jack width reads 12.7 mm, the registry's 12.7 for the ganged RJ-45 cell, on a
      quantity the scale never saw. The figure is a perspective view from slightly above and its front face is
      the near rectangle. Figure 6 (rear) is a perspective view too: its face is 2304 px across and 360 down,
      8.56 px per mm across and 8.10 down, a 5 percent aspect error.
  chassis:
    confidence: datasheet
    note: >-
      Table 5: height 1.75 in (4.4 cm), width 10.6 in (26.92 cm) and 19 in (48.26 cm) with the mounting brackets
      attached, depth 9.4 in (23.8 cm) for the EX2200-C-12P, weight 6.4 lb (2.9 kg). 269.2 x 44.45 x 238.0 is
      carried: width and depth as the printed metric and the height as the 1U pitch (1.75 in), the printed 4.4 cm
      being that rounded down. The figures show the end caps inside the width and no ears.
  front-layout:
    confidence: estimated
    note: >-
      estimated - read off Figure 3 as described under gate-1. The 12 jacks stand in one shell of six columns,
      the first jack at 8.1 mm and a pitch of 15.75 mm (the figure's; the registry's 13.97 is for ganged blocks
      that abut and the jacks here stand apart, their width reading the registry's 12.7), the rows 14.85 mm
      apart and the upper row turned 180 so its lamp tabs are above. Each dual-purpose uplink is an RJ-45 jack
      (105.9 and 149.2 mm) 43.3 mm from an SFP cage (centres 137.1 and 180.4 mm), the pair joined by a printed
      bracket carrying its number, and between them a column of four triangular lamps with LINK and ST legends
      (Figure 3, Figure 13). The USB port is upright (turned 90). The console and management jacks are one
      stacked housing, the console jack above and its keyway up, the management jack below with MGMT printed
      under it. The mini-USB console port (CON) is chassis art. The figure draws no ESD point on the front. The
      Juniper logo and the Running Junos mark are not drawn; both have a reserved logo zone. The chassis
      and shell colours are borrowed (see colour).
  port-numbering:
    confidence: drawing
    note: >-
      drawing - Figure 3 prints each column's two numbers under its shell, the even number up and left and the
      odd number down and right (0 and 1, 2 and 3, ... 10 and 11), and the two uplinks 0 and 1 in their
      brackets. Which jack takes which is by analogy with the EX2300 faceplate (the upper jack takes the even
      number), estimated. The even numeral is drawn 2.05 mm left of its jack's centre and the odd one 2.05 mm
      right of it; the figure puts the even one 1.55 mm left and the odd one 0.65 mm right (8.15 for the
      two-digit 11), and the drawn offsets are the smallest that keep each legend plainly off the centre it
      would otherwise nearly share and keep 10 and 11 apart. Port numbers are as printed,
      from 0. The Junos interface names are not printed: Table 4 gives PIC 0 as 12x10/100/1000BASE-T and PIC 1
      as 2x 10/100/1000BASE-T or GE SFP, i.e. ge-0/0/0 to ge-0/0/11 and ge-0/1/0 and ge-0/1/1; they are
      recorded here and not in an interfaces block because the faceplate does not print them.
  lamps:
    confidence: datasheet
    note: >-
      Hardware guide, Tables 6 to 10 and Figures 8, 10 and 13. Each RJ-45 port has two lamps, Link/Activity and
      Status, on the tabs of the jack (Figure 11); each dual-purpose uplink has two pairs of lamps, LINK and ST,
      one pair for each of its two ports (Figure 13), drawn as triangles pointing at their port: the pair
      pointing right is taken as the SFP port's and the pair pointing left as the RJ-45 port's, which the guide
      does not state, so it is estimated. The management port has a LINK and an ST lamp beside it, and no lamp
      in the jack (Figure 10). The Status lamps read out whichever of speed (SPD), duplex (DX), administrative
      status (EN) and PoE the Factory Reset/Mode button has selected, shown by which port-mode lamp is lit.
      The jack lamps keep the component's link and activity vocabulary because a block cannot override it per
      lamp.
  uplinks:
    confidence: drawing
    note: >-
      drawing - two dual-purpose uplink ports numbered 0 and 1, each an RJ-45 port and an SFP port of which only
      one can be active at a time (Uplink Ports; Table 4 gives 2x 10/100/1000BASE-T or GE SFP). The RJ-45 port is
      a placement in the uplink-rj45 group and the SFP port one in the uplink-sfp group, so each exports as its
      own interface. Figure 3 draws the SFP port as a rectangular opening with a stepped lower edge, taken as an
      SFP cage.
  front-console:
    confidence: estimated
    note: >-
      estimated - the mini-USB console port (Figure 3, callout Mini USB port, printed CON) is the placed
      std/mini-usb (`console-usb`), centred on the 8.6 x 5.1 mm shell this device was drawn with, read off the
      figure. The part draws the registry's 7.7 x 3.9 mm Mini-B shell, which stands in for the maker's own (gap
      `mini-usb-console-shell`). The guide names the connector: "Mini-USB Type-B console port" that accepts a
      Mini-B plug (5-pin) (EX2200 guide, p20, and Mini-USB Port Pinout Specifications, p62). The RJ-45 console
      port is a component and exports. The guide says one console port is active at a time, the RJ-45 by default.
  mode-lamps-nonpoe:
    confidence: datasheet
    note: >-
      the guide lists 4 port status mode LEDs on the PoE+ model and 3 on the non-PoE one; the EX2200-C-12T
      drawing (Figure 4) nonetheless prints the PoE legend and lamp. This model is the PoE one and carries
      four.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - positions read off Figure 6 as described under gate-1: the oblong slotted plate at the left
      (about 22 x 6 mm, drawn as a plain darker plate; the slot itself is not cut through), the two earthing holes 20 mm apart with
      the earth symbol over the second, the finned heatsink from 51.7 to 209.3 mm with one screw beside it, the
      AC inlet at 238.4 mm centre with its two-line legend (100-120V and 2.2A, 200-240V and 1.0A, as the figure
      prints; Table 12 gives 7 A and 2.9 A for PoE switches generally, a different thing, and is carried in the
      attributes), and the ESD symbol over the ESD point at the right. The heatsink is drawn as a solid
      finned block, a plain darker plate and not a vent, because Figure 6 shows a solid block and the guide says
      EX2200-C switches have no exhaust openings, so nothing is cut through the rear; the fin slots are not drawn. The serial number ID label (an empty rounded rectangle in the figure) is a paper label
      carrying a real serial number and is not drawn.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Hardware guide, Power Supply in EX2200 Switches: "The power supply in EX2200 switches is built in along
      the rear panel of the chassis"; Table 4 lists "Built-in power supply" and, for the fan, "EX2200-C switches
      are fanless models". Nothing in the guide describes removing or replacing the supply. It is part of the
      chassis, not a bay and not a component, and there are no fans.
  airflow:
    confidence: datasheet
    note: >-
      the cooling system consists of the vents on the top and sides of the chassis and, on PoE+ models, the
      heatsink in the rear panel; there are no fans, so the chassis is passive.
  power:
    confidence: datasheet
    note: >-
      Table 11: maximum power consumed by the switch 30 W when no PoE power is drawn, 102.3 BTU/hour, and
      maximum PoE power available 100 W; Table 12: AC input 100 through 240 VAC, 50/60 Hz, 7 A at 100 VAC and
      2.9 A at 230 VAC for switches with ports equipped for PoE.
  colour:
    confidence: borrowed
    note: >-
      borrowed - the chassis #919599 and the jack shell #b1b2b5 are the EX2300 front photograph's medians. The
      guide's figures are line drawings with no colour and no EX2200-C photograph is held, so these are a
      relative's and not a reading of this device.
  ground-stud-pitch:
    confidence: estimated
    note: >-
      INFERRED, NOT STATED. Table 32 (parts for connecting an EX Series switch to earth ground) has a row for the
      EX2200 (two 10-32 x .25 in. screws, a Panduit LCC10-14BWL lug or equivalent, not provided) and none for the
      EX2200-C; its `EX2300-C` row names a Panduit LCC10-14AW-L. No spacing is given. The compact rear's own figure
      reads the two holes 20.0 mm apart, which is the .75 in. (19.05) of the LCC10-14BW-L pattern the library
      registers and not the 5/8 in. (15.875), so the EX2200 row is taken for it. The terminal is
      `common/ground-hole-pair-3-4-10-32@1`: two bare 10-32 holes on 3/4 in. centres, presenting `stud-pair-3-4`, so
      one two-hole lug (`generic/two-hole-lug-3-4@1`) lands across them and a ring lug still lands on either hole. The
      holes were drawn 20.0 apart as decor and the pair stands on their midpoint.
attrs:
  physical:
    weight-note: 6.4 lb (2.9 kg), Table 5
  power:
    power-max-w: 30
    power-envelope: bare
    poe-budget-w: 100
    poe-standard: IEEE 802.3af/at
    power-input: 100 through 240 VAC, 50/60 Hz
    power-current-max: 7 A at 100 VAC; 2.9 A at 230 VAC
  thermal:
    cooling: fanless, passive; heatsink in the rear panel
    thermal-output-btu-h: 102.3
  environmental:
    operating-temp-c: 0 to 40
    humidity: 10 to 85 percent, noncondensing
    altitude-ft: 5,000
  features:
    optics-sfp: >-
      hardware guide, Uplink Ports: the SFP half of each dual-purpose uplink takes 1-gigabit SFP transceivers,
      fibre or copper, and can be configured as a Virtual Chassis port
    dual-purpose-uplinks: >-
      hardware guide, Uplink Ports: each of the two uplinks is an RJ-45 port and an SFP port, one active at a
      time; a copper cable in the RJ-45 port makes it active unless the SFP port is linked, and a transceiver
      in the SFP port always wins unless a media type is configured
    virtual-chassis: up to four EX2200 switches, including EX2200-C, from Junos OS 12.2
chassis:
  width: 269.2
  height: 44.45
  depth: 238.0
  ru: 1
  weight-kg: 2.9
  color: '#919599'
  airflow: passive
  power: ac
gaps:
- what: mini-usb-console-shell
  scope: [console-usb]
  reason: needs-photo
  note: >-
    The part is the registry's Mini-B receptacle (Molex drawing SD-54819-026, 7.7 x 3.9 mm). Figure 3 draws the
    console shell 8.6 x 5.1 mm and no photograph or close-up is held, so the drawn shell and its place are
    estimates and the maker's own shell may differ.
  wanted: A straight-on close-up of the console port with a scale, or the maker's dimensioned drawing of it.
- what: rack-ears
  scope: [front]
  reason: needs-drawing
  note: >-
    Tables 30 and 31 say the two-post mounting brackets and their screws are separately orderable for the
    EX2200-C and name no part number, and list a separately orderable four-post rack-mount kit, a wall-mount
    kit, a magnet sheet and a cable guard, none with a part number; no figure measures a bracket position, so
    no ear position is stated and no kit is listed.
  wanted: The EX2200-C bracket kit's part number and a dimensioned drawing of the bracket positions.
- what: eol
  scope: [front]
  reason: vendor-silent
  note: >-
    Searched for an end-of-life notice: only third-party lifecycle trackers answered (an end-of-sale in 2019
    is reported); Juniper's own bulletin was not found, so no lifecycle is written.
  wanted: Juniper's end-of-life bulletin for the EX2200 line.
- what: photographs
  scope: [front, rear]
  reason: needs-photo
  note: >-
    No photograph of any EX2200-C is held and the maker's image library no longer carries one; both faces are
    read from the guide's figures alone, which are line drawings, so colour, finish and the printing on the
    face (as opposed to the figure's) are not confirmed.
  wanted: Straight-on studio photographs of the EX2200-C-12P front and rear.
- what: jack-lamp-meaning
  scope: [rj45]
  reason: vendor-silent
  note: >-
    The jack lamps carry the component's link and activity vocabulary; the guide's Status lamp switches
    meaning with the mode button and no per-lamp state list fits the component.
  wanted: none beyond the component's own vocabulary.
- what: top-and-sides
  scope: [top, bottom, left, right]
  reason: needs-drawing
  note: >-
    The guide shows the top (with vents), the sides (with security slots) and the underside (with its rubber
    feet) only in perspective.
  wanted: A flat drawing of the top and of the side panels.
- what: ground-pair-pitch
  scope: [ground-pair]
  reason: vendor-silent
  note: >-
    The guide names the screws and the lug and gives no spacing for the two holes; `ground-stud-pitch` says what the
    pair is drawn at and why.
  wanted: a drawing that dimensions the two holes, or the lug's own datasheet
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g, poe: 802.3at}
    description: >-
      the 12 built-in 10/100/1000BASE-T PoE+ ports; rel-pos carries the number printed on the faceplate, the
      upper jack of a column takes the even number
  uplink-rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g}
    description: >-
      the RJ-45 half of each dual-purpose uplink, numbered 0 and 1; only one of an uplink's two ports is active
      at a time
  uplink-sfp:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp, speed: 1g}
    description: >-
      the SFP half of each dual-purpose uplink, numbered 0 and 1; only one of an uplink's two ports is active
      at a time
  uplink-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: four lamps between each uplink's two ports, LINK and ST for each of the two
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      how the switch is reached out of band - the management Ethernet port, the RJ-45 console port, the
      mini-USB console port and the USB port
  mgmt-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the LINK and ST lamps of the management port
  controls:
    term: Button
    role: management
    index-origin: 0
    description: the Factory Reset/Mode button
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the SYS and ALM chassis status lamps
  mode-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the SPD, DX, EN and PoE port-mode lamps; the one lit says what each Status lamp shows
  power-input:
    term: Inlet
    role: service
    index-origin: 0
  esd:
    term: Point
    role: furniture
    index-origin: 0
  furniture:
    term: Item
    role: furniture
    index-origin: 0
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the earthing terminal, two bare 10-32 holes for a two-hole lug (Table 32)
