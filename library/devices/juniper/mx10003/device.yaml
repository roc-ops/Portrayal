format: 1
kind: device
name: mx10003
version: 0.2.16
maturity: modelled
manufacturer: Juniper
model: MX10003
portfolio:
  line: MX Series
  family: Universal Routing Platform
description: >-
  Juniper MX10003 - a 3RU, 2.4 Tbps edge router. Two Routing and Control
  Boards run side by side across the top; below them two full-width MPCs
  (JNP10003-LC2103), each with a JNP-MIC1 12xQSFP28 MIC in its left half
  and six fixed QSFP+ ports with a GM/PTP jack at the right. The rear is
  two three-high PSM stacks flanking four vertical fan modules (FT 0-3).
profile: networking
provenance:
  sources:
    note: >-
      MX10003 Hardware Guide (223 pages, 66 figures), the MX10003 datasheet, the vendor front and
      rear line drawings (g009800/g009801) and the 'frontwtop' (front-with-top) studio photograph
      in the image library
  chassis:
    confidence: datasheet
    note: >-
      datasheet-table - 5.21 x 17.6 x 30 in (132.3 x 447 x 762 mm), 3RU; the guide physical table
      repeats it. Ears NOT MODELLED by convention (the rack face is 19 in / 482.6 mm)
  fru-sizes:
    confidence: datasheet
    note: >-
      datasheet-table - the guide carries a full FRU dimension table (RCB 202.7 x 42.1, MPC 419.1
      x 41.9, MIC 197.3 x 41.9, fan module 62.5 x 126.7, PSU 86.7 face); every component size is
      vendor-stated
  front:
    note: >-
      photo - the frontwtop photograph measured at ~2.95 px/mm across the 447 mm body: RCBs at x
      17.0 and 227.4 over rows y 2.0; MPCs at x 14.0 (centred 419.1 in 447), rows y 46.0 and 89.5;
      positions approximate to ~2 mm. The photograph and drawing g009800 agree on arrangement; the
      photograph wins on finish
  rear:
    confidence: drawing
    note: >-
      drawing - g009801: three-high PSM stacks at both rear corners and four vertical fan trays
      between them (FT 0-3). The drawing is schematic, so the stacks are anchored to the vendor
      PSU and fan module dimensions, not to drawing pixels. PSM slot numbering is not legible in
      any source - see gaps
  power:
    confidence: datasheet
    note: >-
      datasheet-table - the guide power example: fully loaded AC router 1676 W (4 fans 80 W + 2
      MPCs 1320 W + 2 MICs 160 W + 2 RCBs 116 W)
  color:
    note: >-
      photo - medium grey chassis and modules, light-blue ejector levers and SSD carrier (Juniper
      cloud-era styling)
  other-faces:
    note: >-
      near-blank by evidence - rail bands estimated; axis conventions per viewer3d.js as the
      siblings

attrs:
  physical:
    weight-full-ac-kg: 71.4
    weight-full-dc-kg: 74.1
    weight-empty-kg: 22.68
  power:
    typical-draw-w: 1676
    note: guide example - fully loaded AC chassis, idle at 25 C
chassis:
  width: 447.0
  height: 132.3
  depth: 762.0
  ru: 3
  color: '#6a6f75'
gaps:
  - what: dc-power-variant
    scope: [psus]
    reason: needs-photo
    wanted: the DC PSM face (the guide's DC figures are isometric line art;
      the DC supply is also deeper - 274.3 vs 235.2 mm).
  - what: psm-slot-numbering
    scope: [psus]
    reason: needs-photo
    wanted: the printed PSM slot labels - the rear drawing's edge legends
      are not legible in any source, so left-stack-top-down 0-2 /
      right-stack 3-5 is an assumption.
  - what: side-earthing-bracket
    reason: vendor-silent
    wanted: the position of the two-hole protective earthing bracket on the
      side rail (M4 studs at 19.1 mm centres per the guide, location not
      drawn).
  - what: rear-photo
    reason: needs-photo
    wanted: a photograph of the rear - only the schematic line drawing
      g009801 exists in the intake, so rear finish is inferred.
groups:
  res:
    term: Slot
    role: service
    index-origin: 0
    description: Routing and Control Board slots RE0 and RE1
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - mx10003 hardware guide, "MX10003 Component Redundancy": the host subsystem is a pair of Routing and Control Boards; with two fitted one is primary and the other backup, the backup takes over if the primary or any part of it fails, and the RCB in slot 0 is primary by default. So the pair is primary/backup and not load-sharing'
  mpcs:
    term: Slot
    role: traffic
    index-origin: 0
    description: MPC slots 0 and 1 (MPC0 below MPC1)
  psus:
    term: PSM
    role: service
    index-origin: 0
    description: six power supply modules in two three-high rear stacks
    attrs:
      redundancy: 'n+n'
      redundancy-note: 'n+n - six supply bays. Minimum for NON-redundant operation is 2 for AC high line, 3 for DC and 4 for AC low line; with additional supplies the system provides N+1 and N+N, and n+n is the fully redundant mode where one supply carries the router indefinitely'
  cooling:
    term: Tray
    role: service
    index-origin: 0
    description: fan modules FT 0-3
