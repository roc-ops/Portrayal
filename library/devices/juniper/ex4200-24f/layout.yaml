configurations:
  ac:
    kind: orderable
    description: >-
      EX4200-24F as shipped - one 320 W AC power supply in slot 0 with a cover panel over slot 1, the fan
      tray, and the uplink slot covered, with 24 dust covers for the SFP ports in the box. Side-to-rear
      airflow. The datasheet also orders the Trade Agreements Act build EX4200-24F-TAA, the same hardware.
    default: true
    part-numbers:
      EX4200-24F: {}
      EX4200-24F-TAA: {}
  dc:
    kind: orderable
    power: dc
    description: >-
      EX4200-24F-DC - one 190 W DC power supply in slot 0 and the fan tray: DC powered.
    bays:
      psu-0: juniper/ex4200-pwr-190-dc@1
    part-numbers:
      EX4200-24F-DC: {}
  s:
    kind: orderable
    description: >-
      EX4200-24F-S - the spare chassis, shipped with no power supply and no fan tray: "Power supplies for
      this model are not shipped by default; you must order them separately", and so is the fan tray. The
      supply and fan bays are shown open.
    bays:
      psu-0: ''
      psu-1: ''
      fan-0: ''
    part-numbers:
      EX4200-24F-S: {}
