configurations:
  ac:
    kind: orderable
    description: >-
      EX4300-24P as shipped - one 715 W AC power supply (AIR OUT) in slot 0 with a cover panel over slot
      1, two EX4300-FAN (AIR OUT) fan modules, and the uplink slot covered. Front-to-back airflow.
    default: true
    part-numbers:
      EX4300-24P: {}
  s:
    kind: orderable
    description: >-
      EX4300-24P-S - the spare chassis, shipped with no power supply and no fan module; either AC or DC
      supplies and AIR OUT or AIR IN fans are ordered separately, and the datasheet's spare-chassis matrix
      says which combinations are supported. The supply and fan bays are shown open.
