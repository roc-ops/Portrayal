      lc9: juniper/ex9200-lc-sf-blank@1
      lc10: juniper/ex9200-lc-sf-blank@1
      lc11: juniper/ex9200-lc-sf-blank@1
    power: ac
  base3c-ac:
    kind: orderable
    power: ac
    description: >-
      EX9214-BASE3C-AC: three EX9200-SF3 modules with one EX9200-RE2 in SF0, two fan trays and two 4100 W AC supplies in PEM0 and PEM1. Blank panels fill the
      line card slots.
