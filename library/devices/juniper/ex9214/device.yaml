format: 1
kind: device
name: ex9214
version: 0.3.0
maturity: modelled
manufacturer: Juniper
model: EX9214
portfolio:
  line: EX Series
  family: EX9200
description: >-
  Juniper EX9214, a 16 U modular Ethernet switch of the EX9200 family that runs Junos OS. It is built on the MX960 chassis. Fourteen
  vertical slots stand side by side in the card cage. These are line cards 0 to 5, the Switch Fabric slots SF0 and SF1, the shared slot
  2|6 and line cards 7 to 11. The shared slot takes a line card or a third Switch Fabric module. Each Switch Fabric module carries a
  Routing Engine. The craft interface spans the top. A fan tray sits above the cage and one below it, and the air filter tray sits
  under the cage. Four tall power supplies fill the rear under the inlet strip. The EX9200 line cards are a family of their own and are
  not modelled: their slots show blank panels.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX9214 Switch Hardware Guide, Juniper Networks, published 2025-07-28, https://www.juniper.net/documentation/us/en/hardware/ex9214/ex9214.pdf. Taken
      from it: Table 5 (the switch configurations), Table 6 (the CLI terms), Table 7 (the physical specifications), Figures 4 to 6 (the front and rear, in
      isometric), Figure 12 (the craft interface, flat), Tables 9 to 14 (the lamps), Figures 18 to 23 (fan tray, air filter and supplies), the power
      chapter and the host subsystem chapter. EX9200 Ethernet Switch Datasheet, 1000432-022-EN, Aug 2022,
      https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex9200-ethernet-switch-datasheet.pdf: Table 1 (features), Table 4 (supply
      capacity), Table 7 (chassis), maximum thermal output and the ordering information, which names the spare chassis EX9214-CHAS3-S, the blank
      EX9200-LC-SF-BLANK, the supplies PWR-MX960-4100-AC-S and PWR-MX960-4100-DC-S, the fan tray FFANTRAY-MX960-HC-S and the air filter FLTR-KIT-MX960-S.
      The EX9214 studio front, rear and front-with-top photographs from Juniper's image library (671 x 1000 and 616 x 1000 px). The guide and the
      datasheet are Juniper's documents, read here for facts only, and nothing of them is copied into the library; no drawing or photograph is
      reproduced. The EX9214 is the MX960 chassis (juniper/mx960); that device's slot cage is used where it is said to be.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 7: 27.8 in (70.5 cm) high, 17.5 in (44.5 cm) wide excluding the mounting flanges, and a depth of 31.08 in (78.94 cm) with the AC supplies or
      32.65 in (82.93 cm) with the DC supplies. 27.8 in is 706.1 mm, 17.5 in is 444.5 mm and 31.08 in is 789.4 mm. The datasheet gives 17.5 x 27.8 x
      27.75 in with the standard cable manager (704.9 mm deep), and the MX960 guide gives the same sheet metal 17.37 x 27.75 x 23.0 in. See the gaps
      chassis-width and chassis-depth. Chassis with midplane, two fan trays, air filter and cable management bracket 150 lb (68.04 kg); maximum configuration
      350 lb (158.8 kg). 16 U is the datasheet's. Ears are NOT MODELLED by project convention.
  ears-and-kits:
    confidence: datasheet
    note: >-
      Guide, Moving the Mounting Brackets for Center-Mounting an EX9200 Switch (Figure 49): two removable mounting brackets ship attached to the holes closest to
      the front of the chassis, so the switch front-mounts flush by default, and the pair moves to the side of the chassis for center-mounting. No figure
      gives the distance of either from the faceplate, so neither position has an `at`. The mounting shelf is included in the shipping container; the guide
      gives it no part number. The cable management bracket (Figure 17, 4.1 lb) is a bolt-on accessory and is not drawn. Rack kits go in provenance only,
      so chassis.kits is not written.
  scale:
    confidence: estimated
    note: >-
      Gate 1. The EX9214 front photograph is 671 x 1000 px and shows the mounting flanges, so its body is not its overall width. The 14 card levers stand 30.72
      mm apart, the tabs on the craft interface agree, and the card envelope reads 399.5 mm tall against 413.5 across the same photograph, so its two scales
      differ by about 3.5 percent; the readings are taken at 1.38 px/mm both ways and every one is estimated to about 2 mm. The rear photograph reads 1.33 px/mm
      across and 1.357 down, 2 percent apart. Every position here is read off the photographs on a millimetre grid; no MX960 measurement is carried except the card
      envelope.
  card-slots:
    confidence: estimated
    note: >-
      Each of the fourteen slots seats the horizontal 413.5 x 29.5 card turned 90 degrees, as the MX960 device does (juniper/mx960 provenance card-slots), with an
      `opening` of 29.5 x 396. The EX9214 photograph reads the card levers 30.72 mm apart from 19.7 mm across, so the slots are placed on a 30.72 mm pitch from 4.95 mm.
      The MX960 reads its pitch as 31.0. The card envelope runs from 141.5 to 541 mm down on the photograph (399.5 mm); the bays are 413.5 mm tall and centred on that
      span, at 134.6 mm down. Slot order left to right is line cards 0 to 5, SF0, SF1, the shared slot 2|6, then line cards 7 to 11 (guide Figure 12).
  craft:
    confidence: estimated
    note: >-
      The craft interface is the part juniper/ex9214-craft@1, 423.4 x 52.3 mm at 8.0 mm across and 6.2 mm down, read on the photograph's grid. The MX960's craft is
      441 x 48 mm and a different part.
  upper-band:
    confidence: estimated
    note: >-
      EX9214 front photograph: under the craft interface a dark plate (60.7 to 97.2 mm down) carries the yellow ESD warning label at 386.7 to 405.1 mm across and the ESD
      point at 411 mm across and 87.1 mm down; under that plate the upper fan tray bezel (98.8 to 135.5 mm down) prints FFANTRAY-MX960-HC. The MX960 device draws the plate and
      the bezel as one dark band; here the bezel is the fan tray bay.
  lower-band:
    confidence: estimated
    note: >-
      EX9214 front photograph, below the card cage: the air filter tray (554.5 to 586.3 mm down) printing FFILTER TRAY-MX960-HC, the lower fan tray bezel (589.5 to 620 mm
      down) printing FFANTRAY-MX960-HC, and the air intake grille from 625 to 697.6 mm down. The grille is the air intake of the lower fan tray (guide, airflow).
  populated-with:
    confidence: estimated
    note: >-
      EX9214 front photograph: SF0 and SF1 carry an EX9200-SF with a Routing Engine each, the shared slot 2|6 carries a third EX9200-SF with no Routing Engine, and nine slots
      carry line cards that the photograph does not name. Two slots, the sixth and the tenth from the left, carry blank panels. The line cards are not modelled. Every configuration seats the
      generation its Table 5 row names. The device's default configuration is `base`; the redundant EX9200-SF3 build with four AC supplies (EX9214-RED3C-AC) is the newest configuration.
  rear:
    confidence: estimated
    note: >-
      EX9214 rear photograph, read on a millimetre grid: an exhaust grille across the top (to 100 mm down), an inlet strip with four right-angle C20 inlets and their
      switches (111 to 160 mm down) over a caution strip and a hex vent band (160 to 205 mm), four upright supplies 102 mm wide on a 105.2 mm pitch from 1.4 mm across, 212 mm down
      and 368 mm tall, and a beige plate under them (594.5 to 703 mm down) with the legends PEM0 to PEM3, four cable spools and an exhaust grille. A steel strip runs up the right
      edge, with the yellow ESD label at its foot (428 mm across, 691 mm down). Guide Figure 5 adds the four supply ejectors and the vented plate behind each, and two grounding points
      on the lower plate; both are drawn from the figure, the ejector and vent sizes read off the isometric. The guide's text puts the earthing pair on the upper rear at 15.86 mm centres, the
      figure labels it on the lower plate and the photograph shows none; the pair follows the figure's plate and the text's pitch (gap earthing-terminal).
  ground-stud-size:
    confidence: datasheet
    note: >-
      Guide, "Grounding Points Specifications for an EX9200 Switch": two threaded inserts that fit UNC 1/4-20 screws, on 0.625 in (15.86 mm) centres, which
      `juniper/mx-ground-stud-pair-5-8@1` draws at 15.875. The size is the pair placement's `stud-size`.
  airflow:
    confidence: datasheet
    note: >-
      Guide, "Airflow Direction in the EX9214 Switch Chassis" and Figure 20: air enters at the front below the lower fan tray, is pulled through the chassis, rises through the
      line card slots and leaves through the upper fan tray; the guide calls it front-to-rear cooling and the datasheet front-to-back airflow. There is no back-to-front build, so
      no handle colour follows from airflow and none is written.
  fan-and-filter:
    confidence: datasheet
    note: >-
      Two fan trays and one air filter. The fan tray is `juniper/ex9214-ffantray-mx960-hc@1` and the air filter `juniper/ex9214-fltr-kit-mx960@1`, new parts: the MX960 device
      draws neither as a component. The datasheet names FFANTRAY-MX960-HC-S and FLTR-KIT-MX960-S, and the photograph prints FFANTRAY-MX960-HC and FFILTER TRAY-MX960-HC. Each tray holds
      six fans.
  psus:
    confidence: estimated
    note: >-
      Two to four 4100 W supplies stand upright in PEM0 to PEM3, in two zones: PEM0 and PEM2 feed the lower fan tray, line cards 6 to 11 and SF slots 1 and 2, and PEM1 and PEM3 feed the upper fan
      tray, line cards 0 to 5 and SF slot 0 (guide, redundancy and power chapters). At least one supply is needed in each zone. The supply parts are
      `juniper/ex9214-pwr-mx960-4100-ac@1` and `juniper/ex9214-pwr-mx960-4100-dc@1`. Table 5 lists the empty bays as holding blank panels; no figure or part number for a supply blank
      is held, so an empty bay is shown open.
  inlets:
    confidence: estimated
    note: >-
      The four C20 inlets on the strip above the supplies are the chassis's, one over each supply: the AC supply has an inlet of its own (AC-1) and takes its second feed (AC-2) from
      the strip (guide, AC power supply description). They are placements of `std/c20-inlet@1` at 37.2, 136.3, 241.5 and 345.5 mm across and 139 mm down. The four switches beside
      them are not drawn; see the gap inlet-switches.
  covers:
    confidence: datasheet
    note: >-
      Table 5: blank panels for the line card slots in every configuration. The datasheet's ordering table names EX9200-LC-SF-BLANK, "EX9200 line card, switch fabric blank cover panel,
      spare", which is `juniper/ex9200-lc-sf-blank@1` turned 90 degrees; the MX960's own blank, `juniper/mx960-blank@1`, is DPC-SCB-BLANK and does not carry the part number.
  configurations:
    confidence: datasheet
    note: >-
      Guide Table 5 lists fourteen shipping configurations, the datasheet adds the TAA builds EX9214-BASE3B-AC-T and EX9214-RED3B-AC-T, the build EX9214-RED-3B-AC and the spare chassis
      EX9214-CHAS3-S. They differ in the Switch Fabric generation (EX9200-SF, -SF2 or -SF3), the Routing Engine generation, the supply type and the supply count, and in nothing
      else on the face, so each is a configuration of this one device. The TAA builds and the build EX9214-RED-3B-AC are the same chassis as EX9214-BASE3B-AC and EX9214-RED3B-AC, and
      each is a configuration of its own with the same bays, so that each part number exports as a device type. Table 5 gives the EX9214-BASE3C-AC two supplies and a blank for "the empty power supply slot", where two bays are empty; two supplies are seated
      in PEM0 and PEM1, one per zone.
  other-faces:
    confidence: estimated
    note: >-
      Guide Figures 4 to 6 show the sides as plain metal with the mounting brackets and a row of holes. The MX960 device carries a rail band on each side; so does this one, estimated.
      Axis conventions per viewer3d.js: LEFT view x = 0 is the REAR, RIGHT view x = 0 is the FRONT, top and bottom y = 0 at the FRONT.
  power:
    confidence: datasheet
    note: >-
      Guide Table 24: base system 1290 W typical and 1670 W reserved, redundant system 1530 W typical and 1910 W reserved; Switch Fabric modules and line cards are on their own contracts.
      Datasheet: maximum power draw 9,318 W (AC) and 9,534 W (DC) in Table 1 and maximum thermal output AC 31,774 BTU per hour (9,318 W), DC 32,510 BTU per hour (9,354 W). The datasheet's DC
      figures disagree between its two places, 9,534 W and 9,354 W; each is carried where it is printed.
  lifecycle:
    confidence: datasheet
    note: >-
      The datasheet (Aug 2022) lists the EX9214 as current. A web search made on 2026-10-24 found no Juniper end-of-life or end-of-sale notice for the chassis;
      two third-party trackers disagree about an end-of-service date, and none is carried (see the gap eol).
  color:
    confidence: estimated
    note: >-
      EX9214 photographs: dark charcoal chassis, craft and cards, a grey craft panel with a light blue accent line, light blue ejector levers, bronze inlet strip, grey supplies and
      a beige rear plate.
