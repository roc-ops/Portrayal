gaps:
- what: chassis-width
  scope: [front, rear]
  reason: sources-disagree
  note: >-
    The EX9214 guide's Table 7 and the EX9200 datasheet give 17.5 in (44.5 cm), the guide adding "excluding the mounting flanges or brackets"; the MX960 guide gives the same sheet metal
    17.37 in (441.1 mm) and the juniper/mx960 device carries 441.1. The EX guide's figure is carried here, 444.5 mm; the difference is 3.4 mm.
  wanted: a mechanical drawing of the chassis
- what: chassis-depth
  scope: [left, right, top, bottom]
  reason: sources-disagree
  note: >-
    The guide's Table 7 gives a depth of 31.08 in (789.4 mm) with the AC supplies and 32.65 in (829.3 mm) with the DC supplies; 789.4 is carried, so the DC build's extra 39.9 mm is not
    modelled. The datasheet gives 27.75 in (704.9 mm) with the standard cable manager, the same for all three chassis, and that figure is carried in attrs physical.depth-total-mm. The
    MX960 guide gives the sheet metal 23.0 in (584.2 mm) deep.
  wanted: a mechanical drawing of the chassis, and which depth the datasheet's 27.75 in means
- what: line-cards
  scope: [front]
  reason: needs-drawing
  wanted: >-
    The EX9200 line cards: EX9200-2C-8XS, EX9200-4QS, EX9200-6QS, EX9200-MPC (with the MICs EX9200-10XS-MIC, EX9200-20F-MIC and EX9200-40T-MIC),
    EX9200-12QS, EX9200-15C, EX9200-32XS, EX9200-40T, EX9200-40F, EX9200-40F-M and EX9200-40XS (guide Table 7). They are a family of their own. No MX
    card on main carries a part number the EX9214 guide names for a slot occupant, so no MX card is accepted. The twelve line card slots show blanks.
- what: sf3-width
  scope: [front]
  reason: sources-disagree
  note: >-
    Table 7 gives every other Switch Fabric module 1.25 x 17 x 22 in and the EX9200-SF3 1.2 x 15.7 x 21.2 in, which is 1.3 in (33 mm) narrower. No figure
    shows whether the SF3's plate is narrower. It is drawn at the cage's 396 mm plate.
  wanted: a flat drawing or photograph of the EX9200-SF3 face
- what: dc-supply-face
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    A flat drawing or photograph of the DC supply. The guide draws it once, in an isometric (Figure 23), and Figure 9 draws four of them. The face is drawn from
    fractions of that figure and estimated to about 5 mm; it is not corrected for the angle of view.
- what: dc-terminal-studs
  scope: [rear]
  reason: needs-photo
  wanted: >-
    A photograph of the DC supply's terminal strip with its clear cover off. Figures 23 and 58 print the legends -48V, RTN, RTN and -48V and draw no stud, and no document
    dimensions the studs or says how high on the face they stand. The four poles are placed at the legends, two studs each on the lug's 5/8 in. pitch, and their height is estimated.
- what: psu-blank
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The supply blank panel. Table 5 lists blank panels for empty supply slots, the MX960 guide names PWR-BLANK-MX960 and the EX documents give no part number. No
    figure shows one, so an empty bay is shown open.
- what: inlet-switches
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    The four small input switches beside the C20 inlets on the strip above the supplies, and the cable spools on the beige plate. The photograph shows them; no figure
    or text names them and no component draws them, so they are not drawn. (Figure 5 labels one input mode switch, on the supply itself, not on this strip.)
- what: earthing-terminal
  scope: [rear]
  reason: needs-photo
  wanted: >-
    The position of the protective earthing pair. The guide's text puts the two threaded inserts on the upper rear of the chassis at 15.86 mm centres; Figure 5 labels the two
    grounding points on the lower plate under the supplies, apart; the rear photograph shows no studs. The pair is drawn on the lower plate, following the figure's place
    and the text's pitch, and its position is estimated. A flat photograph of the plate would settle it.
- what: eol
  scope: [front, rear]
  reason: vendor-silent
  wanted: an end-of-life notice for the EX9214 chassis, if Juniper publishes one
groups:
  slots:
    term: Slot
    role: traffic
    index-origin: 0
    description: >-
      The line card slots 0 to 5 and 7 to 11 (guide Table 6 and Figure 12)
  sf-slots:
    term: Slot
    role: service
    index-origin: 0
    description: >-
      The Switch Fabric slots SF0 and SF1, which take a Switch Fabric module and nothing else, and the shared slot 2|6, which takes a line card or a third Switch Fabric
      module. Routing Engines seat inside the Switch Fabric modules in SF0 and SF1
    attrs:
      redundancy: '2+1'
      redundancy-note: >-
        2+1 - EX9200-SF3 interoperability text, "EX9200-SF3 Fabric Bandwidth Performance and Redundancy": with three Switch Fabric modules installed the EX9214 provides 2 + 1
        redundancy; the third seats in the shared slot, which is why this group holds the shared slot beside SF0 and SF1
  craft:
    term: Panel
    role: management
    index-origin: 0
  psus:
    term: PEM
    role: service
    index-origin: 0
    description: the four upright supplies PEM0 to PEM3, in two zones (PEM0 and PEM2, PEM1 and PEM3)
    attrs:
      redundancy: 'n+n'
      redundancy-note: 'one to two supplies per zone, each supply the redundant of its zone partner; four supplies give full redundancy (guide, redundancy and power chapters)'
  inlets:
    term: Inlet
    role: service
    index-origin: 0
    description: >-
      The four C20 receptacles on the strip above the supplies, one per PEM. A separate group from `psus` because the inlet stays with the chassis while a supply comes out
  cooling:
    term: Tray
    role: service
    index-origin: 0
    description: the upper fan tray, the lower fan tray and the air filter tray
    attrs:
      redundancy: 'n+1'
      redundancy-note: >-
        n+1 inside each fan tray - guide, "Understanding EX9214 Switch Component and Functionality Redundancy": each tray holds six fans, and if one fails the host subsystem raises
        the speed of the others to cool the switch indefinitely. A single fan cannot be replaced; the whole tray is replaced
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD points, one on the front plate under the craft interface and a label at the rear lower right (guide Figures 4 and 5)
  grounding:
    term: Stud
    role: furniture
    index-origin: 0
    description: the protective earthing pair, two UNC 1/4-20 threaded inserts on 15.86 mm centres, drawn on the lower rear plate where guide Figure 5 labels them
