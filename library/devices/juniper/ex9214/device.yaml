configurations:
  base:
    kind: base
    default: true
    source: >-
      derived - built from the group roles rather than from a vendor bundle: every bay whose group is `service` or `management` keeps its seat, and
      every `traffic` bay takes a blank. This vendor publishes no base configuration for this chassis under that name, so the library defines one.
    description: >-
      Chassis only, as every shipping order is built before line cards. The twelve line card slots hold blank panels. The Switch Fabric modules, the craft interface, the
      four supplies, the two fan trays and the air filter tray keep their seats. Line cards are ordered separately.
    bays:
      lc0: juniper/ex9200-lc-sf-blank@1
      lc1: juniper/ex9200-lc-sf-blank@1
      lc2: juniper/ex9200-lc-sf-blank@1
