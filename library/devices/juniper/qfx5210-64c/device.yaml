format: 1
kind: device
name: qfx5210-64c
version: 0.1.4
maturity: modelled
manufacturer: Juniper
model: QFX5210-64C
portfolio: {line: QFX Series, family: QFX5210}
description: >-
  Juniper QFX5210-64C, a 2RU data-centre spine and leaf switch. It has 64 QSFP28 ports, numbered 0 to
  63 in sixteen columns of four, and two SFP+ ports. The QSFP28 ports run at 100 GbE by default, at 40
  GbE by transceiver, and at 50, 25 or 10 GbE by channelization. The port side also carries an RJ45 management
  port, an RJ45 console port, a USB port, a reset pinhole and four chassis lamps. The FRU side carries
  four fan modules, two power supplies and a two-hole protective earthing terminal. It ships as one front
  panel in several builds: AC or DC supplies, front-to-back (AIR OUT) or back-to-front (AIR IN).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper QFX5210 Switch Hardware Guide, published 2026-03-09, 187 pages (copyright 2026 Juniper Networks),
      https://www.juniper.net/documentation/us/en/hardware/qfx5210/qfx5210.pdf: the port panel figures
      9 and 10 and the callout figures that enlarge them, the management panel figure 11 and the chassis
      status lamp figure 12, the FRU panel figure 8, the fan and supply figures 13, 16 to 19 and 21, the
      specification tables 3, 15, 17, 18, 21, 25 and 26, and the mounting chapter. Juniper's studio photographs
      of the 64C, port side and FRU side, 2100 x 700 and 2100 x 654 px (image library, qfx5210-64c-front-high
      and qfx5210-64c-rear-high). THE HPE DATASHEET (a00150817enw) IS NOT HELD (the intake lists it for
      a human to fetch), so no datasheet figure is used and the guide's tables stand in for it. No mechanical
      drawing, Visio stencil or 3D model is held for the QFX5210: the intake's MX stencil folder has none
      for it. A third-party elevation of the same box (a NetBox library PNG, held in the intake photo
      folder) was looked at to confirm what is on the FRU side and was not measured or copied. The guide
      and photographs are Juniper's and are used for reference; no drawing or photograph is copied into
      the library, every skin is drawn new from measurements.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 26: 3.5 in (8.89 cm) high, 17.25 in (43.82 cm) wide, 22.83 in (57.99 cm) deep; 23.44
      lb (10.63 kg) without power supplies and fans, 31.09 lb (14.1 kg) with them. 2RU (the guide says
      so, and 3.5 in is the 2U pitch of 88.9 mm). The inch figures are converted (88.9, 438.15 and 579.88
      mm); the centimetre figures agree to the rounding. The width is the body between the ear folds:
      the guide says the front brackets of the rack kit make it 19 in, so the brackets are not modelled.
  gate-1:
    confidence: photo-measured
    note: >-
      Figure 10 (a 1501 x 511 px raster of the port side, colour-coded by channelization block) is orthographic
      enough to measure across: its outline measures 1424 px between stroke centres (x 21 to 1445) against
      the table's 438.15 mm, 3.25 px/mm, and 285 px (y 30 to 315) against 88.9 mm, 3.21 px/mm. The aspect
      is 4.99 against 4.93, 1.3 percent out, so fractions are taken on both axes and the horizontal scale
      is used for x. Figure 8 (the FRU side, 1501 x 578 px) reads 1424 by 285 px as well. The studio photograph
      agrees on the repeating pitch (gang pitch 189 px at 4.14 px/mm is 45.7 mm against 45.45 from the
      figure), and its own body measures about 1811 px across, so it is read at 4.14 px/mm and checked
      against the figures. Figure 9 is the same side with callouts, 10 percent short in height, and was
      not measured.
  ports:
    confidence: drawing
    note: >-
      Figure 10: 64 QSFP28 cages as sixteen columns, each column a stack of two cages above a stack of
      two (four cages), in eight gangs of two columns. A column holds ports 2k and 2k+1 in the upper stack
      and 32+2k and 33+2k in the lower stack (k = 0 to 15), as the printed numerals read. The colours
      of figure 10 are the guide's port blocks (channelization groups, Figure 10 "Block 0" to "Block 3")
      and not hardware. The cells are on the registry's qsfp-ganged pitch of 19.0 mm, the gangs are 45.6
      mm apart (figure 45.45, photograph 45.7), so the gutter is 7.6 mm, and the first cage's left edge
      is 31.5 mm in (figure 31.1, photograph 32.4) and the last cage's right edge 388.2 mm (figure 387.7,
      photograph 387.8). The cage rows are 15.9 mm apart within a stack (figure 15.9) and the stacks 29.6
      mm apart; the upper stack's top row is 18.6 mm down. THE FIGURE IS 1.3 PERCENT OUT IN ASPECT AND
      THE Y POSITIONS ARE FITTED TO THE TABLE'S HEIGHT, so they are estimated to about 0.5 mm.
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4, as juniper/mx204 applies it):
      in each stack the upper cage is upright and the lower one turned 180, so both cage lips face the
      band between them. The photograph shows the bright lip of the lower cage of the upper stack on its
      upper edge and the upper cage's on its lower edge, which agrees, but at 4 px a cage it does not
      overturn the rule. The same for the two SFP+ cages.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed on the metal and read off the photograph and the enlargements of figure 9: a numeral above
      the top cage of each column (the even ports 0 to 30), a numeral below the bottom cage (the odd ports
      33 to 63), and between the two stacks a pair on one baseline, `N` and an up triangle at the left
      of the column centre for the odd port 2k+1 and a down triangle and `N` at the right for the even
      port 32+2k, so each triangle points at the cage its numeral names. Interface names are not printed
      and are not written (see the gap).
  sfp-plus-numbering:
    confidence: photo-measured
    note: >-
      DRAWING AND PHOTOGRAPH DISAGREE. The guide's figures 9 to 11 print 64 above the SFP+ pair and 65
      below it. The studio photograph of the real device prints 0 above and 1 below, so THE PHOTOGRAPH
      WINS: the legends are 0 and 1, and the two cages are `tengig-0` and `tengig-1` (the ids are named
      for the job and not the connector, which would collide with `port-0`). The guide's text calls them
      "two dedicated SFP+ ports" and, for interface numbering, 64 and 65 follow the 64 QSFP28 ports; that
      is kept here and not as a printed legend.
  port-lamps:
    confidence: drawing
    note: >-
      Figure 9 and its enlargement draw four round lamps on a 4.1 mm pitch (44 px at 10.7 px/mm) centred
      on each cage column, above the top row (centres 4.4 mm above the cage's top edge, 14.2 mm down the
      face) and below the bottom row (4.4 mm below its foot, 78.1 mm), with the port numeral between the
      lamps and the cage on top and below the lamps at the foot. Table 10 says four bi-colour lamps for
      each QSFP28 port, only the first lit at 100 GbE and all four when the port is channelized to 10
      or 25 GbE; Tables 11 and 12 give the colours (green steady for a link, green blinking for activity,
      amber blinking for beacon on the SFP+ lamps). THE FIGURES DRAW LAMPS ONLY AT THE OUTER EDGES OF
      THE FOUR-CAGE COLUMN, so the lamp groups are filed against ports 0 to 30 (even) and 33 to 63 (odd),
      the ones whose numerals they stand beside; the inner ports (1 to 31 odd, 32 to 62 even) have no
      lamps of their own in any figure, and the guide does not say which lamps serve them (see the gap).
      The band between the two cages of a stack carries six round marks per column, drawn in the figures
      as small circles; the photograph shows them as bright ringed holes in the cage bezel and not as
      lamps, so they are not modelled as lamps.
  mgmt-panel:
    confidence: drawing
    note: >-
      Figure 11 and the enlargement of figure 12: at the right of the port side, an RJ45 management port
      (MGMT, em0, C0, 1000BASE-T) stacked over an RJ45 console port (CON) in one housing, a two-cage stacked
      SFP+ block (legends 0 and 1, see sfp-plus-numbering) and a USB 2.0 port beneath it. The housing
      is 17.8 mm wide (figure 58 px at 3.25 px/mm), the jacks are drawn as two std/rj45 jacks of 15.8
      x 13.2 touching, so the pair is 26.4 mm tall against about 25 mm in the figure; the 1.4 mm excess
      is accepted. The management jack has its lamps at the top corners and its keyway at the top, the
      console jack the keyway at the foot, as the figure draws them. The jack positions are the figure's,
      2.6 mm left of the photograph's. Table 13: the status lamp is green at 1000 M and amber at 100 M,
      the link/activity lamp green steady with a link and blinking with traffic. The USB port is USB 2.0
      by the guide's callout, so it is drawn with the usb2 skin.
  status-lamps:
    confidence: drawing
    note: >-
      Figure 12 and its enlargement: four chassis lamps ALM, SYS, MST and ID in a column at the left of
      the port side with their legends to the left, 3.5 mm apart on a pitch read at 10.7 px/mm and checked
      at 3.56 mm on the photograph, with the RESET pinhole above them and its legend beneath (figure 9
      callout 1, 7). Table 14: ALM red for a major alarm and amber for a minor one, SYS green when Junos
      OS is loaded, MST green for a standalone switch (the guide's text says "three LEDs" once; it draws
      and names four), ID blue blinking for the beacon.
  esd-and-labels:
    confidence: photo-measured
    note: >-
      The ESD point is the hex-nut-like jack at the left edge, 6.5 mm in and 38.5 down, with the ESD symbol
      beside it at 15.5 mm; the figure draws the same and the photograph shows a ring (a banana receptacle
      in a bezel). The photograph also shows a yellow pull tab at the right of the foot, 31 x 3.9 mm at
      384.5 and 83.4 mm, which figure 10 draws as an outlined tab; it is drawn as a plain yellow plate
      and not as a label, since no text on it resolves. The guide draws no laser or hazard triangle and
      the photograph shows none.
  logo-and-text:
    confidence: photo-measured
    note: >-
      The maker's name and wordmark and the Junos OS mark are printed on the plate below the USB port,
      with the model text QFX5210-64C between them. The wordmark and the mark are logos and are NOT DRAWN,
      not even as text: two logo-zone regions hold their place (guide figure 10, photograph, 397 to 423
      mm across). The model text is drawn.
  vents:
    confidence: photo-measured
    note: >-
      Hexagonal perforations: a band along the top edge (1.6 to 11.6 mm down, 29.5 to 411.5 mm across),
      a half band along the foot (83.6 to 87.6 mm, 8 to 384 mm), a block at each side (2.5 to 10.5 mm
      and 430 to 436.5 mm across, 44 to 85 mm down), and a perforated strip in the gutter between every
      two gangs (7 strips, 4.6 mm wide). The guide's figure 10 draws the same fields as outlines. Drawn
      as vent strips on a 3.3 mm pitch; positions are read at 3.25 px/mm and 4.14 px/mm and are estimated.
  rear-layout:
    confidence: photo-measured
    note: >-
      Figure 8 (a 1501 x 578 px flat raster of the FRU side) and the studio photograph (2100 x 654 px,
      AIR OUT build, 4.1 px/mm across the body) agree to 1.5 mm: four fan slots on a 69.0 mm pitch from
      85.0 mm (figure 84.3, photograph 85.7), the supplies 52.0 mm wide at 18.0 mm (slot 0, photograph
      18.4, figure 17.5) and 368.0 mm (slot 1, photograph 367.7, figure 368.0), the supplies' tops at
      45.2 mm and the fan tops at 23.5 mm. The earthing terminal is at 366.5 mm, 22.0 down. The photograph's
      vertical scale reads about 2 percent short of its horizontal one (the body is 87 mm tall on it at
      4.10 px/mm, against 88.9), so heights are taken from the figure's 3.21 px/mm and checked on the
      photograph, where the supply's foot sits 1.7 mm above the figure's and the fan modules' 1.2 mm above;
      the supply is seated 0.8 mm higher than the figure puts it as a compromise between the two. Rear
      positions are estimated to about 1.5 mm.
  rear-printing:
    confidence: photo-measured
    note: >-
      DRAWING AND PHOTOGRAPH DISAGREE on the supply rating legend. The guide's figure 8 prints "AC INPUT
      : 100-240V ; 50-60HZ ; 12-6A Max" and "DC INPUT : -48V- -60V ; 25A Max"; the photograph of the real
      device prints "12-7A" and "34A Max", so THE PHOTOGRAPH WINS and is the legend drawn. Table 18 and
      Table 21 give 12 A at 100 VAC and 6 A at 240 VAC, and 25 A for DC; they are the figures in attrs,
      and the 7 A and 34 A of the metal are a conflict between the guide's tables and the printed legend,
      recorded as a gap. Also printed: the model plate QFX5210-64C at the left (the wordmark above it
      and the Junos OS mark beneath are logos, not drawn), a power symbol and the slot number (0, 1) beside
      each supply, a fan symbol and the slot number (0 to 3) at the top right corner of each fan slot
      (THE LEGEND IS DRAWN 5 TO 9 MM HIGHER, just above the slot, because the module paints the whole
      slot, bracket strip included, and would cover it), four small arrows along the top rim (at 150 mm
      and each 69 mm on) and the earth symbol beside the terminal. The photograph's five small ring screws
      above the fans and two beside the supplies, and the two corner thumbscrews, are not drawn.
  modules:
    confidence: datasheet
    note: >-
      The fan modules and the power supplies are field-replaceable units in bays, each its own component.
      Nothing on this chassis is a built-in unit that is not a bay: the supplies' own fans are inside
      the supplies, and the lamp the guide describes beside each fan slot (Table 16) is not drawn in any
      figure. Four fan modules (guide Table 3: QFX5210-FANAFI and QFX5210-FANAFO; Table 15 spells them
      QFX5210-64C-FANAFI and -FANAFO, the longer spelling is used) and two supplies (JPSU-1100W-AC-AFI
      and -AFO, JPSU-1100W-DC-AFI and -AFO, Table 3). They are the library's new components juniper/qfx5210-fan-afo,
      -afi and juniper/qfx5210-jpsu-1100w-ac-afo, -afi, -dc-afo, -dc-afi; the one existing supply with
      a similar rating, juniper/ex4300-jpsu-1100-ac-afo, is a different part number (JPSU-1100-AC-AFO,
      an EX4300 part) and is not reused.
  airflow-and-colour:
    confidence: photo-measured
    note: >-
      Guide Tables 15 and 17: AIR OUT (front-to-back, port-to-FRU) units are Juniper Gold, AIR IN (back-to-front,
      FRU-to-port) units Juniper Azure Blue. The studio photograph of the AIR OUT build shows the fan
      handles and the supply handles orange, so orange is drawn for AIR OUT; no photograph of the AIR
      IN build is held and the blue is a plain azure. The guide's prose once swaps the two colours in
      a sentence about FRU-to-port fan handles; its tables and the photograph are used.
  ears-and-kits:
    confidence: datasheet
    note: >-
      The guide describes mounting on four posts only, with a front mounting bracket on each side and
      a rear blade that slides into the rail, rails between 28 in and 36 in (71.1 to 91.4 cm) front to
      back in the mounting text and 23.6 to 36 in in the rack-requirements table. Table 3 and Table 36
      name the kit QFX5210-4PST-RMK (front mounting brackets, rear mounting blades, twelve M4 flathead
      screws), shipped with the switch. The kit is NOT MODELLED and is not in `chassis.kits`, and no ear
      position is written: no figure measures where the bracket sits (figure 22 shows it in perspective).
  power:
    confidence: datasheet
    note: >-
      Table 18 (AC): 357 W typical and 655 W maximum, input 90 to 264 VAC at 50 to 60 Hz, 12 A at 100
      VAC and 6 A at 240 VAC. Table 21 (DC): 383 W typical and 696 W maximum, -48 to -60 VDC rated, -40
      to -72 VDC range, 25 A maximum. Maximum is measured at 40 C with SR optics and 100 percent IMIX
      load, typical at 25 C with DACs and 50 percent load, excluding transceivers. The AC figures are
      filed as the device's.
  colour:
    confidence: photo-measured
    note: >-
      The front plate samples about #939aa2 on bare patches of the studio photograph; the chassis colour
      is #949aa2, as the QFX5200 does. The photograph is lit warmly and these are its values, not a paint
      reference.
attrs:
  physical:
    weight-note: >-
      23.44 lb (10.63 kg) without power supplies and fans, 31.09 lb (14.1 kg) with them (Table 26)
  performance:
    port-speeds: >-
      QSFP28 ports 0 to 63 run at 100 GbE by default and at 40 GbE with a QSFP+ transceiver. They run
      at 50, 25 or 10 GbE by channelization or breakout cable (up to 128 logical ports). The SFP+ ports
      run at 1 or 10 GbE
  power:
    power-typical-w: 357
    power-max-w: 655
    power-typical-dc-w: 383
    power-max-dc-w: 696
    power-envelope: as-tested
    power-input-ac: 90 to 264 VAC, 50 to 60 Hz, 12 A at 100 VAC or 6 A at 240 VAC
    power-input-dc: rated -48 to -60 VDC, operating range -40 to -72 VDC, 25 A maximum
    redundancy-note: >-
      two supplies, 2N, each carrying the whole load; one may be removed at a time while the switch runs
  thermal:
    fans: >-
      four fan modules and the fans in the two supplies; the switch runs 30 seconds without thermal shutdown
      while one fan module is replaced
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container
    humidity: 5 to 90 percent noncondensing (up to 93 percent short term)
    altitude: >-
      AFO builds no performance degradation to 1828.8 m (6000 ft); AFI builds none at sea level
  platform: {cpu: 2.2 GHz quad-core Intel Xeon, memory: 16 GB, storage: 100 GB SSD, software: Junos OS
      18.1R1 and later}
  features:
    optics-qsfp28: >-
      100 GbE QSFP28 and 40 GbE QSFP+ transceivers. DAC and breakout cables (QSFP+ to SFP+ DACBO, QSFP28
      to QSFP+ DACBO). High-wattage optics (above 3.5 W) only in ports 32 to 63 on the AFI builds (guide,
      QFX5210-64C Port Panel Overview and Table 25)
    optics-sfp-plus: 1 GbE or 10 GbE SFP+ transceivers (guide, QFX5210-64C Port Panel Overview)
    channelization: >-
      ports 0 to 31 take 4 x 10, 4 x 25 and 2 x 50 GbE breakouts. Ports 32 to 63 take 2 x 50 GbE before
      Junos OS 19.1R1. From 19.1R1 on, any port
  management: {oob: 'RJ45 1000BASE-T management port (em0, MGMT)', console: 'RJ-45 console port (CON,
      RS-232)', usb: one USB 2.0 port}
  compliance:
    seismic: Designed to comply with Zone 4 earthquake requirements per GR-63, Issue 4
chassis: {width: 438.2, height: 88.9, depth: 579.9, ru: 2, weight-kg: 14.1, color: '#949aa2', airflow: front-to-back,
  power: ac}
gaps:
- what: datasheet
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    The HPE datasheet a00150817enw, which the intake lists for a human to fetch. No datasheet figure is
    used.
- what: inner-port-lamps
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    Which lamps serve the inner ports of each column (1 to 31 odd, 32 to 62 even). The guide's Table 10
    says four lamps for each QSFP28 port and its figures draw four lamps at the outer edges only, so the
    inner ports carry no lamp in the model.
- what: stack-band-marks
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The six round marks per column in the band between the two cages of a stack. The figures draw them
    as circles and the photograph shows ringed holes; the guide names them nowhere, so they are not drawn.
- what: sfp-plus-lamps
  scope:
  - front
  reason: needs-photo
  wanted: >-
    The two bi-colour lamps for each SFP+ port that Table 10 describes. No figure draws them and the photograph
    does not resolve any.
- what: fan-lamps
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    The bi-colour lamp the guide says is next to each fan module (Table 16). No figure or photograph shows
    where it is, so none is drawn.
- what: rating-legend
  scope:
  - rear
  reason: sources-disagree
  wanted: >-
    The supply rating legend. Figure 8 prints 12-6A and 25A; the photograph of the real device prints
    12-7A and 34A (Max); Tables 18 and 21 give 12 A at 100 VAC and 6 A at 240 VAC, and 25 A. The photograph's
    wording is drawn as printed; the tables' figures are in attrs.
- what: interface-names
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    Interface names are not printed on the metal and the guide's channelization text names none for this
    switch, so none are written.
- what: dc-and-afi-part-numbers
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The orderable part numbers of the DC and the AIR IN builds. The guide names the chassis spare QFX5210-64C-CHAS,
    the builds QFX5210-64C-AFI and QFX5210-64C-AFO (in its cautions), and the units but gives no SKU for
    the DC builds or any -S build, so the two DC builds are examples and not orderable.
- what: eol
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    An end-of-life announcement. None was searched for in this pass, and the guide states none, so the
    device states no lifecycle.
- what: fan-redundancy
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    How many fan modules the switch can lose. The guide's Component Redundancy section says only that
    the switch has four fan modules and that a failed module that cannot keep the switch within its thresholds
    raises chassis alarms and can shut the switch down. Table 4 lists the fan modules as removable without
    action, and the cooling text says the switch runs 30 seconds without thermal shutdown while one is
    replaced. No N+1 form is claimed.
- what: fan-module-power
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    A power figure for a fan module. Table 3 and the cooling chapter give the airflow and the part numbers
    only; searched the cooling and power chapters and found whole-switch figures only.
- what: module-depths
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The depth of the fan modules and of the supplies. The guide's figures are isometric and carry no scale
    and its tables state weights only.
- what: ears
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The position of the front mounting brackets of the rack kit QFX5210-4PST-RMK. Figure 22 shows them
    in perspective with no scale; no position is written.
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
  qsfp28-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: link, color: '#22c55e'}
    - {name: activity, color: '#22c55e', behavior: blinking}
    description: >-
      The four lamps above each column of QSFP28 ports 0 to 30 (even) and below each column of ports 33
      to 63 (odd), only the first lit at 100 GbE and all four for a 10 or 25 GbE channelized port (guide
      Tables 10 and 11).
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band panel at the right of the port side - an RJ45 management port, an RJ45 console port,
      a USB port and the recessed reset button. Four kinds, one purpose: reaching and recovering the switch
      when the data plane cannot.
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD terminal at the left edge of the port side (guide figure 12)
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The four chassis lamps ALM, SYS, MST and ID (guide Table 14).
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: >-
      the protective earthing terminal on the FRU side, two screws for a two-hole lug (guide figure 8
      callout 2, Connecting the QFX5210 to Ground)
  fans:
    term: Fan
    role: service
    index-origin: 0
    description: >-
      QFX5210 hardware guide, Component Redundancy: four fan modules in the FRU panel, slots 0 to 3 left
      to right; all must be installed for optimal operation. The guide states no spare-fan form (N+1)
      for them.
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        two supplies, 2N, each carrying the whole load; one may be removed at a time while the switch
        runs
