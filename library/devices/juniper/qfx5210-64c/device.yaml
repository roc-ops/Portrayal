configurations:
  ac-afo:
    kind: orderable
    default: true
    description: >-
      QFX5210-64C-AFO: two 1100 W AC supplies (JPSU-1100W-AC-AFO) and four front-to-back fan modules (QFX5210-64C-FANAFO).
      All carry the label AIR OUT and a Juniper Gold handle (guide Tables 15 and 17).
    part-numbers:
      QFX5210-64C-AFO: {}
  ac-afi:
    kind: orderable
    airflow: back-to-front
    description: >-
      QFX5210-64C-AFI: two 1100 W AC supplies (JPSU-1100W-AC-AFI) and four back-to-front fan modules (QFX5210-64C-FANAFI).
      All carry the label AIR IN and a Juniper Azure Blue handle (guide Tables 15 and 17).
    bays: {psu-0: juniper/qfx5210-jpsu-1100w-ac-afi@1, psu-1: juniper/qfx5210-jpsu-1100w-ac-afi@1, fan-0: juniper/qfx5210-fan-afi@1,
      fan-1: juniper/qfx5210-fan-afi@1, fan-2: juniper/qfx5210-fan-afi@1, fan-3: juniper/qfx5210-fan-afi@1}
    part-numbers:
      QFX5210-64C-AFI: {}
  dc-afo:
    kind: example
    power: dc
    description: >-
      Two 1100 W DC supplies (JPSU-1100W-DC-AFO) and four front-to-back fan modules (QFX5210-64C-FANAFO).
      The guide names the DC supplies (Table 3) but no chassis part number for the build. AC and DC supplies
      are never mixed in one chassis.
    bays: {psu-0: juniper/qfx5210-jpsu-1100w-dc-afo@1, psu-1: juniper/qfx5210-jpsu-1100w-dc-afo@1}
  dc-afi:
    kind: example
    power: dc
    airflow: back-to-front
    description: >-
      Two 1100 W DC supplies (JPSU-1100W-DC-AFI) and four back-to-front fan modules (QFX5210-64C-FANAFI).
      The guide names these units but no chassis part number for the build.
    bays: {psu-0: juniper/qfx5210-jpsu-1100w-dc-afi@1, psu-1: juniper/qfx5210-jpsu-1100w-dc-afi@1, fan-0: juniper/qfx5210-fan-afi@1,
      fan-1: juniper/qfx5210-fan-afi@1, fan-2: juniper/qfx5210-fan-afi@1, fan-3: juniper/qfx5210-fan-afi@1}
  chas:
    kind: orderable
    description: >-
      QFX5210-64C-CHAS, the chassis spare of guide Table 3: the switch with its two power supply bays
      and four fan module bays open, nothing seated.
    bays: {psu-0: '', psu-1: '', fan-0: '', fan-1: '', fan-2: '', fan-3: ''}
    part-numbers:
      QFX5210-64C-CHAS: {}
