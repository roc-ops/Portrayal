format: 1
kind: device
name: ex4400-24x
version: 0.1.4
maturity: modelled
manufacturer: Juniper
model: EX4400-24X
portfolio:
  line: EX Series
  family: EX4400
description: >-
  Juniper EX4400-24X campus and distribution switch, 1RU. It has 24 SFP/SFP+ ports that take 1GbE
  or 10GbE optics, in 12 columns of two cages. The front also holds two 100GbE QSFP28 ports and
  the console, management and USB-A ports. It has a USB-C console port, the chassis and port mode
  lamps, a mode button and one extension module slot. The rear holds two fan modules and two power supply
  slots. A shipped switch carries one 550 W supply, two fan modules and covers on the empty slots.
  The configurations give the supply type and the airflow.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX4400 Switch Hardware Guide, Juniper Networks, PDF created 2026-07-22 (331 pages), fetched
      from www.juniper.net/documentation/us/en/hardware/ex4400/ex4400.pdf. Taken from it - Table 4
      and Table 7 (the model list), Tables 14 to 16 with Figures 14 to 18 (EX4400-24X), Table 5
      (extension modules), Table 38 to Table 40 (chassis, fan and supply sizes), Tables 41 to 51
      (lamps), Tables 52 to 58 (heat and supplies), Table 93 (environment), Table 114 (CLI
      names) and Table 115 (acoustics). Figures 14 and 15 (g022907, g022897) are renders of the
      real product and are the pictures measured here. Figures 16 and 17 (g022898, g022899) are
      the flat callout drawings, used for the callout list and the label regions. Juniper's image
      library, www.juniper.net/content/dam/www/assets/images/us/en/image-library/ex-series/ex4400-24x/ex4400-24x-front-high.jpg
      (a JPEG, 1500 x 236), is a studio view of the same face. The same pattern for the 48F, 24MP
      and 48MP returned an HTML 404 page, and no rear photograph exists for any of the four. The
      EX4400 datasheet on juniper.net (a French-language PDF of 2025-10-14, the only one the site
      answers for) names the 24X as 24 SFP+ 10GbE ports and lists the ten base models; no figure
      here comes from it. Terms - Juniper's documentation pages state no licence for the guide, so
      the facts are transcribed and nothing is copied; no drawing or photograph is in the
      repository. The held intake folder was not readable by this account, so no earlier
      photograph, stencil or 3D model could be used. An end-of-life search made 2026-10-20 found
      no notice for the EX4400 line, so the lifecycle is none-announced.
  gate-1:
    confidence: measured
    note: >-
      Figure 14 (g022907, 1500 x 199 px, embedded image extracted from the PDF) gives a face 1297
      px wide (83 to 1379.5) and about 127 px tall, which is 2.936 px per mm across on the stated
      441.7 mm and 2.92 down on 43.7 mm, 0.5 percent apart. The SFP cage width, measured on a
      quantity the scale never saw, is 13.96 mm against the registry's 14.25 pitch less its wall.
      The studio photograph (1500 x 236, the face 1434 px wide, 3.25 px per mm) puts the first
      column at 62.8 mm and the QSFP28 block at 317.0 mm, against 63.4 and 316.7 from Figure 14.
      Positions are taken per axis on those scales and each reads to about half a millimetre.
  width:
    confidence: datasheet
    note: >-
      Table 15 gives the chassis 17.39 in (44.17 cm) wide, and says the outer edges of the front
      mounting brackets extend the width to 19 in (48.2 cm). The face is the body between the
      folds, 441.7 mm, with no ears drawn. Height is 1.72 in (4.37 cm), 1RU. Depth is 15.71 in
      (39.9 cm) with no supply, fan module or extension module fitted, 16.93 in (43 cm) with a
      supply and fan modules, 17.35 in (44.07 cm) with an extension module as well. The bare
      figure 399.0 mm is carried as the chassis depth, because every module is its own part. The
      other two are in attrs.
  ports:
    confidence: drawing
    note: >-
      Figure 14 and Figure 16 - 24 SFP/SFP+ ports in 12 columns of two stacked cages, numbered 0
      to 23 as printed with the upper cage of a column even. Unlike the 48F, each column is its
      own cage pair with a column of vent holes between, so the columns sit 21.03 mm apart (63.69
      to 295.64 mm over 11 steps) and the block is declared as 12 gangs of one, with the registry's
      14.25 pitch and a 6.78 mm gutter. The first column's cage opens at 63.4 mm. The upper cage
      starts 9.9 mm down and the lower 14.9 mm below it, read off the render at the cage frames, so
      the belly row is 14.9 and not the registry's 15.0. Counts confirmed by Table 15 (1/10GbE
      ports 24) and Table 114 (PIC 0, 24 ports, 1G/10G SFP/SFP+).
  port-numbering:
    confidence: photo-measured
    note: >-
      Figure 14 and the studio photograph - under each column one pair, an even number with an up
      arrow and the next odd number with a down arrow ("0 up 1 down" to "22 up 23 down"). Numbering
      starts at 0, as printed. The legend sits 28.1 mm below the upper cage's top, the arrows 5.9
      and 11.0 mm from the column's left edge; both are estimated from the render. CLI names are not
      printed on the metal and Table 114 gives the ports as PIC 0 ports 0 to 23.
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md) - a belly-to-belly pair is the
      upper cage upright and the lower turned 180. The render shows the latch bars in the belly
      between the cages, which agrees. The SFP cages are stacked this way. The two QSFP28 ports
      are side by side in one row, so none applies to them.
  port-leds:
    confidence: datasheet
    note: >-
      Figure 51 (g022904) and Tables 43 and 44 - each port has a link activity lamp and a status
      lamp, four small triangles in the belly between the two cages. From the left they are the
      lower port's link lamp, the upper port's link lamp, the lower port's status lamp and the upper
      port's status lamp (callouts 4, 1, 3 and 2). The upper port's triangles point up and the lower
      port's down. They sit 2.6, 5.3, 8.95 and 11.65 mm from the column's left edge, 11.0 mm below
      the top of the upper cage, read off the render and estimated. The link lamp is green, steady
      for a link without traffic and blinking for traffic. The status lamp shows one parameter at a
      time, chosen with the mode button - for these ports 10 Gbps steady and 1000 Mbps blinking on SPD.
  qsfp28:
    confidence: drawing
    note: >-
      Figure 14 and Figure 16 callout 9 - two QSFP28 ports side by side in one row, numbered 0 and 1
      on the face, with four lamps above each. The cage openings are 18.9 mm apart centre to centre
      on the render, which is the registry's 19.0 mm ganged pitch, so the pair is a ganged block of
      std/qsfp-ganged and not two single cages. The first opening starts at 316.7 mm and 25.9 mm
      down. The lamps are 2.9, 6.8, 10.7 and 14.7 mm from each cage's left edge and 22.1 mm down.
      Table 114 lists them as PIC 1 ports 0 and 1, and the guide says they can be Virtual Chassis
      ports with the request virtual-chassis mode hgoe command. Figures 57 and 58 and Table 46 give
      the lamps - the leftmost is the Virtual Chassis lamp, green steady for 100 Gbps, amber for 40 Gbps.
  mgmt-ports:
    confidence: drawing
    note: >-
      Figure 14 and Figure 16 callouts 1, 2, 10 and 11 - on this model the console (CON), management
      (MGMT), USB-A and reset pinhole are on the front, left of the cages. CON centre 14.3, 29.6;
      MGMT 33.3, 29.6; USB-A 47.4, 28.1, vertical; RESET pinhole 56.9, 33.9, with the legends under
      them. Figure 49 draws the two management lamps, link activity and status, as on the other
      models. All read off the render and estimated to half a millimetre.
  status-block:
    confidence: drawing
    note: >-
      Figure 16 callouts 4 to 7 and the studio photograph. A dark plate 361.2 to 439.5 across and
      1.4 to 15.5 down, the same as the other EX4400 faces. The model name EX4400-24X is printed
      at the left from 367.7 to 386.1 mm, which at 3.0 mm type is 10 characters. The USB-C console
      port is centred at 393.7, 8.3 with the USB symbol below it. Two columns of lamps sit at
      406.2 and 410.1 across - SYS, ALM, MST and CLD on the left, SPD, DX and EN on the right, with
      no POE lamp on a non-PoE model. The rows are at 3.8, 6.8, 9.7 and 12.8 down; the render
      scatters them by up to 0.5 mm and they are aligned. The mode button is a flush disc at 423.1, 8.6.
  extension-slot:
    confidence: estimated
    note: >-
      Figure 16 callout 8. The slot is a recess 363.8 to 437.8 across and 17.7 to 41.2 down in the
      render of Figure 14, the same place as on the other EX4400 faces. The slot is a bay. It
      takes the three extension modules the guide names and ships with a cover, because the
      shipped-components statement under Table 15 names one cover for the empty extension module slot.
  rear:
    confidence: drawing
    note: >-
      Figure 15 and Figure 17 (g022897, g022899) measured on the render, per axis, from the rear
      left edge (the chassis right side as seen from the front). The rear has no console,
      management, USB or QSFP28 port, because the front holds them. Ground plate 27.8 to 61.7 across
      and 27.6 to 39.7 down with two holes 15.0 apart; ESD socket at 101.1, 36.0. Fan module slots
      are at 108.2 and 206.0 across and power supply slots at 255.0 and 346.4, with the fan or
      power icon and its number above each slot. These are the same positions as the other EX4400
      rears, and the render agrees to 0.3 mm.
  rear-labels:
    confidence: drawing
    note: >-
      Figure 17 callouts 1, 2, 6 and 9 are the serial number ID label, the CLEI code label, the
      power supply rating label and the claim code label. The claim code label is a QR code. They
      are stickers, not metal, so each is a named region and is not drawn. The serial number strip
      at the left edge is estimated from the callout drawing, which is a different scale from the render.
  grounding:
    confidence: datasheet
    note: >-
      Connect Earth Ground to an EX4400 Switch - a 2-hole protective grounding terminal on the rear
      panel, used with 10-32 x 0.25 in screws and the lugs LCD10-10AF-L, LCD8-10AF-L or LCD6-10AF-L.
      The guide gives no hole spacing. The 15.0 mm spacing is measured on the render and is
      estimated. The render shows two bare holes, so they are drawn as dark holes on the plate.
  vents:
    confidence: drawing
    note: >-
      The front has a hexagon punching in a band over and under the cage block, a column of holes
      beside each cage column, and a field above the QSFP28 ports. The fields are drawn as repeating
      patterns in simplified outlines, not hole for hole. The rear of this model has no punching.
  colour:
    confidence: photo-measured
    note: >-
      Median of bare face on the guide renders (#777777) and of the status plate (#50575f), and of
      the ground plate on the rear render (#aab4b7, silver here where the other EX4400 rears draw
      it dark). The studio photograph shows the same mid-grey finish. The legends of the non-PoE models are near
      white on the render.
  power-supplies:
    confidence: datasheet
    note: >-
      Table 14 ships the 24X with a 550 W AC supply, and Table 16 gives the same for the other
      builds. The text under Figure 16 says the 24X takes 550 W AC or DC supplies, and that AC and
      DC must not be mixed. The rear render shows two supplies; the default here ships one supply
      and a cover on the second slot, as the text under Table 15 states. A bay cannot say that
      supplies of one chassis must match.
  airflow:
    confidence: datasheet
    note: >-
      Tables 14 and 16 - the 24X is sold front-to-back (AIR OUT label, orange handle) as EX4400-24X
      and EX4400-24X-DC, and back-to-front (AIR IN label, blue handle) as EX4400-24X-AFI and
      EX4400-24X-DC-AFI. The handle colour of each fan module and supply follows the guide.
  spare:
    confidence: datasheet
    note: >-
      The weight list under Table 15 prints EX4400-24X-S at 5.52 kg, but Tables 14 and 16 list no
      -S model and give no shipped-components or supply row for it. No -S configuration is modelled;
      see the gap spare-model.
  mounting:
    confidence: datasheet
    note: >-
      Mounting Options and the mounting procedures - the two-post kit EX-RMK ships in the box and
      mounts the brackets flush with the front or along the middle of the side panels. The separately
      orderable EX-4PST-RMK mounts the switch flush with the front posts of a four-post rack or
      recessed inside it. EX-WMK is a wall kit. No ear distance in millimetres, no rack depth range
      and no bracket drawing that can be measured is in the guide, so the positions are named
      without a number and no kit is listed. The library holds no rail kit for them.
  interface-names:
    confidence: datasheet
    note: >-
      Table 114 - the CLI addresses the switch as FPC 0, the built-in ports as PIC 0 ports 0 to 23,
      the two QSFP28 ports as PIC 1 ports 0 and 1, and the extension module as PIC 2. The names are
      not printed on the metal, so no interfaces block is written.
attrs:
  physical:
    weight: 6.7 kg with no power supply, fan module or extension module (EX4400-24X and -24X-AFI); 6.65 kg for the -DC builds
    depth-with-modules: 430.0 mm with power supply and fan modules; 440.7 mm with an extension module as well
    mounting: two-post kit EX-RMK in the box; four-post kit EX-4PST-RMK and wall kit EX-WMK separate
  performance:
    throughput: 540 Gbps unidirectional, 1080 Gbps bidirectional
  thermal:
    heat-dissipation: 422.84 BTU/hr idle and 470.58 at 100 percent traffic with a 550 W AC supply; 463.76 and 497.86 with a 550 W DC supply
  environmental:
    operating-temp: 0 C to 45 C (32 F to 113 F)
    storage-temp: -40 C to 70 C (-40 F to 158 F) in the shipping container
    humidity: 5 to 90 percent noncondensing
    altitude: no performance degradation up to 1828.8 m (6000 ft) at 40 C
    acoustic-noise: 42.71 dB(A) typical with one 550 W AC supply and front-to-back airflow (Table 115)
  platform:
    cpu: quad-core x86
    memory: 4 GB DDR4 with ECC
    storage: 20 GB eMMC
  features:
    virtual-chassis: up to 10 switches; the front QSFP28 ports are Virtual Chassis ports only after request virtual-chassis mode hgoe
    macsec: AES-256 on all SFP and SFP+ network ports, on the native QSFP28 ports and on the extension module ports
    optics-sfp-plus: 10 GbE SFP+ and 1 GbE SFP transceivers; the exact list is in the Hardware Compatibility Tool
    optics-qsfp28: >-
      The two front ports take 100GbE QSFP28 or 40GbE QSFP+ transceivers (40G from Junos OS 22.1R1).
      Breakout cables give 4x25G and 4x10G. The exact list is in the Hardware Compatibility Tool
    extension-slot: one slot for the EX4400-EM-4S, EX4400-EM-4Y or EX4400-EM-1C module
  management:
    console: USB-C and RJ-45 (CON), both on the front
    oob: MGMT RJ-45 on the front, 10/100/1000, with link activity and status lamps
    usb: USB-A on the front
    cloud: Juniper Mist Wired Assurance, and the Junos CLI and J-Web
  compliance:
    seismic: Tested for Zone 4 earthquake according to NEBS GR-63-CORE, Issue 5
  lifecycle: {eol: none-announced}
chassis:
  width: 441.7
  height: 43.7
  depth: 399.0
  ru: 1
  color: '#777777'
  ears:
    positions:
      - {name: flush, label: flush with the front panel}
      - {name: mid, label: along the middle of the side panels}
      - {name: recessed, label: recessed inside a four-post rack, racks: [4-post]}
gaps:
  - what: spare-model
    scope: [ac]
    reason: sources-disagree
    note: >-
      The weight list under Table 15 prints EX4400-24X-S, but Tables 14 and 16 list only the AC and
      DC builds. No -S spare is modelled for the 24X.
    wanted: the maker's ordering information for an EX4400-24X-S
  - what: cld-lamp-states
    scope: [led-cld]
    reason: vendor-silent
    note: >-
      The hardware guide names the CLD lamp and sends the reader to the cloud-ready LED blink
      patterns, which are not in this guide.
    wanted: the cloud-ready LED blink patterns and their meanings
  - what: datasheet
    scope: [front]
    reason: vendor-silent
    note: >-
      The English EX4400 datasheet did not answer from juniper.net and the HPE copy a00150783enw
      did not either. The French-language datasheet of 2025-10-14 is cited and no figure comes from it.
    wanted: the English EX4400 datasheet, for the ordering part numbers and mounting kit codes
  - what: fan-part-number
    scope: [fan-0, fan-1]
    reason: vendor-silent
    note: >-
      The guide prints EX4400-FAN once, in the switch-tray assembly table, with no airflow
      direction. No ordering code is stated for the fan modules.
    wanted: the ordering codes of the front-to-back and back-to-front fan modules
  - what: ground-spacing
    scope: [rear]
    reason: vendor-silent
    note: >-
      The guide states the screw size and lug codes but not the spacing of the two grounding
      holes. The 15.0 mm spacing is estimated from the render. The holes are drawn as decor, so
      no two-hole lug can be seated on them.
    wanted: the spacing of the two-hole protective earthing terminal, and a 10-32 pair part for it
  - what: supported-optics
    scope: [qsfp28, sfp-plus, extension]
    reason: vendor-silent
    note: >-
      The guide sends the reader to the Hardware Compatibility Tool page for EX4400 for the
      transceivers and cables each port takes, and holds no table of them. The port groups
      therefore declare no interface.
    wanted: the EX4400 transceiver list from the Hardware Compatibility Tool
  - what: labels-not-drawn
    scope: [rear]
    reason: vendor-silent
    note: >-
      The ESD hazard symbol beside the ESD socket and the legends printed on the fan and power
      supply slot plates are drawn as simple marks. The legends under the CON and MGMT jacks and
      the lamp legends are drawn from the render, which is too coarse to read the type size.
    wanted: a close-up of the front and rear panels
groups:
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs:
      media: sfp-plus
      speed: 10g
    description: >-
      24 ports, numbered 0 to 23 as printed, upper cage of each column even. Each cage takes a 1GbE
      SFP or a 10GbE SFP+ transceiver
  sfp-plus-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      Two lamps for each port in the belly between the cages - link activity and status, as in guide
      Figure 51
  extension:
    term: Slot
    role: traffic
    index-origin: 0
    description: the extension module slot, PIC 2 in the CLI
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: reaching and restarting the switch - USB-C console, RJ-45 console, management, USB-A, the reset pinhole and the mode button, all on the front
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs:
      media: qsfp28
      speed: 100g
    description: >-
      Two front ports numbered 0 and 1, PIC 1 in the CLI. They can be Virtual Chassis ports or
      network ports. Each takes a 100G or a 40G transceiver
  qsfp28-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      Four lamps above each QSFP28 port. Table 46 - green for 100G, amber for 40G, and all four
      lamps show the four channels of a channelized port
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the chassis status and port mode lamps at the right of the front panel
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Cooling System and Airflow in an EX4400 Switch - "We ship EX4400 switches with two fan
        modules (1+1 redundancy) preinstalled in the rear panel of the switch."
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Two slots, one supply shipped. The guide says a second supply gives full redundancy and
        that AC and DC supplies, and supplies with different airflow, must not be mixed
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the rear two-hole protective earthing terminal
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the rear wrist-strap socket (guide Figure 17 callout 7)
