format: 1
kind: device
name: mx2008
version: 0.3.0
maturity: modelled
manufacturer: Juniper
model: MX2008
portfolio:
  line: MX Series
  family: MX2000 3D Universal Edge Router
description: >-
  Juniper MX2008 - the 24RU MX2000 with the fabric moved up top: a short
  upper cage holds an integrated RCB at each end with eight short SFBs
  (7+1) between them, above ten full-height MPC slots (LC 0-9, seated
  through adapter cards). The rear is one nine-module PSM wall between
  the two PDMs, with the fan trays behind their access door below.
profile: networking
provenance:
  sources:
    note: >-
      MX2008 Hardware Guide, the MX2008 datasheet, the studio front photograph and the rear line
      drawing g009401
  chassis:
    confidence: datasheet
    note: >-
      datasheet-table - 42 x 19 x 30.90 in (1066.8 x 482.6 x 784.9 mm), 24U; the 19 in is the rack
      face and the body is drawn at 440 mm. Ears NOT MODELLED by convention
  front:
    note: >-
      photo - the studio front photograph at ~1.39 px/mm: craft at y 48, the short upper cage (RCB
      0, SFB 0-7, RCB 1) at y 143 over ~170 mm, the double label strip, ten MPC slots at y 352
      over ~425 mm, the LC strip, the cable-manager panel and the intake grille. The photographed
      unit carries MX2000-LC-BLANK covers in every slot, so the MPC catalogue rides on the MX2000
      gap
  rear:
    confidence: drawing
    note: >-
      drawing - g009401 (isometric, fractions only): exhaust grille, PDM1, the nine-PSM wall (AC
      PSMs in the drawing; the DC author is the default as the family), PDM0, the fan-tray access
      door and the fold-down tray. No rear photograph exists in the intake - see gaps
  power:
    confidence: datasheet
    note: >-
      datasheet-table - the guide power overview: nine PSMs at 2500 W each, 8+1, over a 22.5 kW
      pool with 2.5 kW held for redundancy
  color:
    note: >-
      photo - grey chassis, dark craft band, silver-grey modules
  other-faces:
    note: >-
      near-blank by evidence - rail bands estimated; axis conventions per viewer3d.js as the
      siblings

attrs:
  power:
    pool-w: 22500
    note: 2.5 kW of the pool reserved for PSM redundancy
chassis:
  width: 440.0
  height: 1066.8
  depth: 784.9
  ru: 24
  color: '#565b61'
gaps:
  - what: rear-photo
    reason: needs-photo
    wanted: a photograph of the rear - only the isometric drawing
      g009401 exists, so the PSM wall, PDMs and fan door are fractional
      readings and finish is inferred; the drawing shows AC PSMs while
      the shared author is the DC face.
  - what: mpc-catalogue
    scope: [fpcs]
    reason: needs-photo
    wanted: as the MX2000 siblings - the photographed unit carries
      blanks in every LC slot.
  - what: rcb-face-detail
    scope: [res]
    reason: needs-photo
    wanted: a close photograph of the MX2008 RCB faceplate - the jack
      stack is summarised from a ~1.4 px/mm image.
  - what: fan-trays-and-pdms
    reason: needs-photo
    wanted: the two fan trays and two PDMs as FRU bays - drawn as the
      zones and door they sit behind.
groups:
  craft:
    term: Panel
    role: management
    index-origin: 0
  res:
    term: Slot
    role: service
    index-origin: 0
    description: RCB slots 0 and 1 at the ends of the upper cage
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - mx2008 hardware guide, "MX2008 Component Redundancy": the host subsystem is a pair of Routing and Control Boards, each an integrated board and a single FRU carrying both Routing Engine and Control Board functions; with two fitted one is primary and the other backup. The guide''s "System Overview" adds that all major components including the RCBs are fully redundant'
  sfbs:
    term: Slot
    role: service
    index-origin: 0
    description: Switch Fabric Board slots SFB 0-7, 7+1 redundant
    attrs:
      redundancy: '7+1'
      redundancy-note: '7+1 - mx2008 hardware guide, "System Overview": eight Switch Fabric Boards giving 7+1 redundancy. Unlike the RCB pair this is not a standby: the MX2000 fabric is all-active, so the spare is a working plane whose loss costs no throughput. The 9-PSM figure quoted alongside it in the same paragraph is 8+1 and belongs to `psus`, not here'
  fpcs:
    term: Slot
    role: traffic
    index-origin: 0
    description: MPC slots LC 0-9 (each MPC seats through an adapter
      card)
  psus:
    term: PSM
    role: service
    index-origin: 0
    description: nine power supply modules, 8+1 load-sharing
    attrs:
      redundancy: 'n+1'
      redundancy-note: 'n+1 PSM, N+N feed redundancy'
