format: 1
kind: device
name: mx2008
version: 2.0.0
maturity: modelled
manufacturer: Juniper
model: MX2008
portfolio:
  line: MX Series
  family: MX2000 3D Universal Edge Router
description: >-
  Juniper MX2008 - the 24RU MX2000 with the fabric moved up top: a short
  upper cage holds an integrated RCB at each end with eight short SFBs
  (7+1) between them, above ten full-height MPC slots (LC 0-9, seated
  through adapter cards). The rear is one nine-module PSM wall between
  the two PDMs, with the fan trays behind their access door below.
profile: networking
provenance:
  sources:
    note: >-
      MX2008 Hardware Guide, the MX2008 datasheet, the studio front photograph and the rear line
      drawing g009401
  chassis:
    confidence: datasheet
    note: >-
      datasheet-table - 42 x 19 x 30.90 in (1066.8 x 482.6 x 784.9 mm), 24U; the 19 in is the rack
      face and the body is drawn at 440 mm. Ears NOT MODELLED by convention
  front:
    note: >-
      photo - the studio front photograph at ~1.39 px/mm: craft at y 48, the short upper cage (RCB
      0, SFB 0-7, RCB 1) at y 109-291 on the 1.264 px/mm scale, ten 43.18 mm slots over the line-card
      slots (#902; it was at y 143 over ~170 mm), the double label strip, ten MPC slots at y 352
      over ~425 mm, the LC strip, the cable-manager panel and the intake grille. The photographed
      unit carries MX2000-LC-BLANK covers in every slot, so the MPC catalogue rides on the MX2000
      gap
  rear:
    confidence: drawing
    note: >-
      drawing - g009401 (isometric, fractions only): exhaust grille, PDM1, the nine-PSM wall (AC
      PSMs in the drawing; the DC author is the default as the family), PDM0, the fan-tray access
      door and the fold-down tray. No rear photograph exists in the intake - see gaps
  power:
    confidence: datasheet
    note: >-
      datasheet-table - the guide power overview: nine PSMs at 2500 W each, 8+1, over a 22.5 kW
      pool with 2.5 kW held for redundancy. Table 25 (base AC power requirements) gives the base
      system - excluding MPCs, ADCs and MICs, and listing seven SFBs, one RCB, two fan trays, the
      craft interface, three PSMs and two PDMs - 1,520 W typical at 25 C and 4,420 W at 55 C;
      carried as power-typical-w and power-max-w, envelope bare. The row names no side. It does
      not reconcile with the FRU tables: Table 41 rates each MX2000-FANTRAY-S at 1500 W typical,
      so two trays alone exceed the 1,520 W base - recorded, not resolved. The DC and HVAC/HVDC
      thermal examples (Tables 112 and 117) assume 34.5 kW of output for a loaded chassis, which
      is the MX2020 figure and exceeds this chassis's own 22.5 kW pool; it is not carried
  color:
    note: >-
      photo - grey chassis, dark craft band, silver-grey modules
  other-faces:
    note: >-
      near-blank by evidence - rail bands estimated; axis conventions per viewer3d.js as the
      siblings

  lc-slots:
    confidence: datasheet
    note: >-
      each LC slot is the line-card adapter's face, 43.18 x 449.8 (1.7 x 17.71 in, the guide's ADC row),
      on its own width as pitch: ten slots, 431.8 mm, centred on the chassis at x 4.1 (#261). Four
      readings put the pitch there: the MX2010 front gives 41.36 px between slots against a 379.5 px MPC
      plate, 43.3 mm on the card's 396.0; the MX2008 front, isotropic at 1.264 px/mm once its flanges are
      taken as the 19 in, gives 54.7 px, 43.3 mm; the MX2020 front gives 31.9 px at 0.744 px/mm, 43.4 mm.
      Until #261 the slots were an estimated 41.0 x 425.0 on a 41.0 pitch, which no adapter fits. The
      native MX2K cards and the blank keep their estimated 41 x 425 and are centred in the wider slot.
      Down: the slot is centred on the photograph's LC cage, 331.5 to 791.9 mm (476 to 1058 px at 1.264
      px/mm from the chassis top at 57 px): y 336.8. The band above it, which carries the RCB/SFB and LC
      legends, closes up to 313.0 to 336.8, and the band below to 788.0 to 806.0.
attrs:
  power:
    power-typical-w: 1520
    power-max-w: 4420
    power-envelope: bare
    power-typical-scope: base system excluding MPCs, ADCs and MICs, at 25 C
      (Table 25); side not named
    power-max-scope: base system excluding MPCs, ADCs and MICs, at 55 C
      (Table 25); side not named
    pool-w: 22500
    note: 2.5 kW of the pool reserved for PSM redundancy
chassis:
  width: 440.0
  height: 1066.8
  depth: 784.9
  ru: 24
  color: '#565b61'
gaps:
  - what: rear-photo
    reason: needs-photo
    wanted: a photograph of the rear - only the isometric drawing
      g009401 exists, so the PSM wall, PDMs and fan door are fractional
      readings and finish is inferred; the drawing shows AC PSMs while
      the shared author is the DC face.
  - what: mpc-catalogue
    scope: [fpcs]
    reason: needs-photo
    wanted: a photograph of a populated LC slot on this chassis - the
      photographed front carries blanks in every LC slot. Since roc-ops/Portrayal#261 the
      MX240-form MPCs seat through the adapter card
      (juniper/mx2000-lc-adapter@1), as on the MX2010.
  - what: rcb-face-detail
    scope: [res]
    reason: needs-photo
    wanted: a close photograph of the MX2008 RCB faceplate - the jack
      stack is summarised from a ~1.4 px/mm image. At 2.0.0 the RCB took
      the 1.7 in slot width (#902) and its two jack columns moved 6.9 mm
      left to stay centred; their positions were not re-read.
  - what: fan-trays-and-pdms
    reason: needs-photo
    wanted: the two fan trays and two PDMs as FRU bays - drawn as the
      zones and door they sit behind.
groups:
  craft:
    term: Panel
    role: management
    index-origin: 0
  res:
    term: Slot
    role: service
    index-origin: 0
    description: RCB slots 0 and 1 at the ends of the upper cage
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - mx2008 hardware guide, "MX2008 Component Redundancy": the host subsystem is a pair of Routing and Control Boards, each an integrated board and a single FRU carrying both Routing Engine and Control Board functions; with two fitted one is primary and the other backup. The guide''s "System Overview" adds that all major components including the RCBs are fully redundant'
  sfbs:
    term: Slot
    role: service
    index-origin: 0
    description: Switch Fabric Board slots SFB 0-7, 7+1 redundant
    attrs:
      redundancy: '7+1'
      redundancy-note: '7+1 - mx2008 hardware guide, "System Overview": eight Switch Fabric Boards giving 7+1 redundancy. Unlike the RCB pair this is not a standby: the MX2000 fabric is all-active, so the spare is a working plane whose loss costs no throughput. The 9-PSM figure quoted alongside it in the same paragraph is 8+1 and belongs to `psus`, not here'
  fpcs:
    term: Slot
    role: traffic
    index-origin: 0
    description: MPC slots LC 0-9 (each MPC seats through an adapter
      card)
  psus:
    term: PSM
    role: service
    index-origin: 0
    description: nine power supply modules, 8+1 load-sharing
    attrs:
      redundancy: 'n+1'
      redundancy-note: 'n+1 PSM, N+N feed redundancy'
