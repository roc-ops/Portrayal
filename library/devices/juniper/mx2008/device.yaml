configurations:
  base:
    kind: base
    source: >-
      derived - built from the group roles rather than from a vendor bundle: every bay
      whose group is `service` or `management` keeps its seat, every `traffic` bay takes
      a blank. This vendor publishes no base configuration for this chassis, so the
      library defines one. Where a vendor DOES publish one, follow it instead and say so
      here.
    default: true
    description: >-
      Chassis only - what you spec before deciding what goes in it. The 10 slot bays are
      EMPTY; psus, res, sfbs are populated. Enough to power on and reach the box, which
      is the question most people ask first and the one `default` used to answer with
      whatever the drawing happened to be populated with.
    bays:
      fpc0: juniper/mx2000-mpc-blank-v@1
      fpc1: juniper/mx2000-mpc-blank-v@1
      fpc2: juniper/mx2000-mpc-blank-v@1
      fpc3: juniper/mx2000-mpc-blank-v@1
      fpc4: juniper/mx2000-mpc-blank-v@1
      fpc5: juniper/mx2000-mpc-blank-v@1
      fpc6: juniper/mx2000-mpc-blank-v@1
      fpc7: juniper/mx2000-mpc-blank-v@1
      fpc8: juniper/mx2000-mpc-blank-v@1
      fpc9: juniper/mx2000-mpc-blank-v@1
