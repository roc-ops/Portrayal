configurations:
  base:
    kind: base
    default: true
    source: >-
      derived - built from the group roles rather than from a vendor bundle: every bay whose group is `service` or `management` keeps its seat, and
      every `traffic` bay takes a blank. This vendor publishes no base configuration for this chassis under that name, so the library defines one.
    description: >-
      Chassis only, as every shipping order is built before line cards. The three line card slots hold blank panels. The Switch Fabric in slot 0,
      the craft interface, the four supplies, the fan tray and the air filter keep their seats. Line cards are ordered separately.
    bays:
      lc2: juniper/ex9200-lc-sf-blank@1
      lc1: juniper/ex9200-lc-sf-blank@1
      sf1-lc0: juniper/ex9200-lc-sf-blank@1
    power: ac
  base3c-ac:
    kind: orderable
    power: ac
    description: >-
      EX9204-BASE3C-AC: one EX9200-SF3 module with one EX9200-RE2, one fan tray and two 2520 W AC supplies in PEM0 and PEM1 for low line.
      Blank panels fill the line card slots and slot 1|0.
    bays:
      sf1-lc0: juniper/ex9200-lc-sf-blank@1
      pem2: ''
      pem3: ''
    part-numbers:
      EX9204-BASE3C-AC: {}
  red3c-ac:
    kind: orderable
    power: ac
    description: >-
      EX9204-RED3C-AC: two EX9200-SF3 modules with two EX9200-RE2, one fan tray, four 2520 W AC supplies and blank panels for the line card slots.
    part-numbers:
      EX9204-RED3C-AC: {}
  red3c-dc:
    kind: orderable
    power: dc
    description: >-
      EX9204-RED3C-DC: two EX9200-SF3 modules with two EX9200-RE2, one fan tray and two 2520 W DC supplies in PEM0 and PEM2. Blank panels fill
      the line card slots.
    bays:
      pem0: juniper/ex9200-pwr-mx480-2400-dc@1
      pem1: ''
      pem2: juniper/ex9200-pwr-mx480-2400-dc@1
