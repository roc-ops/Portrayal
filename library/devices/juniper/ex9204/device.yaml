gaps:
- what: chassis-width
  scope: [front, rear]
  reason: sources-disagree
  note: >-
    The EX9204 guide's Table 7 and the EX9200 datasheet give 17.5 in (44.5 cm); the MX240 guide gives the same sheet metal 17.45 in (44.3 cm,
    443 mm) and the juniper/mx240 device carries 443.0. The EX guide's figure is carried here, 444.5 mm, because it is the table of this device's
    own guide; the difference is 1.5 mm.
  wanted: a mechanical drawing of the chassis
- what: chassis-depth
  scope: [left, right, top, bottom]
  reason: sources-disagree
  note: >-
    The guide's Table 7 gives 24.5 in (62.2 cm) from the front to the chassis rear, 622.3 mm, which is carried. The datasheet gives 27.75 in
    (70.5 cm) and says it includes the cable manager. Both are the MX240's own figures (622 and 705 mm).
  wanted: nothing more; both figures are carried, the second in attrs physical.depth-total-mm
- what: line-cards
  scope: [front]
  reason: needs-drawing
  wanted: >-
    The EX9200 line cards: EX9200-2C-8XS, EX9200-4QS, EX9200-6QS, EX9200-MPC (with the MICs EX9200-10XS-MIC, EX9200-20F-MIC and EX9200-40T-MIC),
    EX9200-12QS, EX9200-15C, EX9200-32XS, EX9200-40T, EX9200-40F, EX9200-40F-M and EX9200-40XS (guide Table 7 and Figures 27 to 40). They are a
    family of their own. No MX card on main carries a part number the EX9204 guide names for a slot occupant, so no MX card is accepted. Slots 1 and 2
    show blanks.
- what: sf3-width
  scope: [front]
  reason: sources-disagree
  note: >-
    Table 7 gives every other Switch Fabric module 1.25 x 17 x 22 in and the EX9200-SF3 1.2 x 15.7 x 21.2 in, which is 1.3 in (33 mm) narrower.
    No figure shows whether the SF3's plate is narrower. It is drawn at the cage's 396 mm plate.
  wanted: a flat drawing or photograph of the EX9200-SF3 face
- what: psu-output
  scope: [rear]
  reason: sources-disagree
  note: >-
    The supply is named 2520 W. Guide Table 16 and Table 17 give 1167 W per supply at low line and 2050 W at high line; the same chapter says the
    enhanced AC supply gives 2400 W at high line from Junos OS Release 18.4R1. The datasheet gives 2,050 W on the EX9204 and 2,400 W on the DC supply.
    The component carries 2400 W high line and 1167 W low line.
  wanted: the supply's nameplate rating
- what: dc-supply-count
  scope: [rear]
  reason: sources-disagree
  note: >-
    The DC supplies chapter says the EX9204 comes with two DC supplies in PEM0 and PEM2. Table 5 gives four for EX9204-RED3B-DC and two for
    EX9204-RED3C-DC, and Figure 8 draws four. Each configuration follows Table 5.
  wanted: confirmation of the shipped DC supply count
- what: dc-supply-face
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    A flat drawing or photograph of the DC supply. The guide draws it once, in a small isometric (Figure 21), and Figure 8 draws four of them
    the same way. The face is drawn from fractions of that figure on the AC supply's outline.
- what: psu-blank
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The supply blank panel. Table 5 lists blank or cover panels for the empty supply slots, the MX240 guide names PWR-BLANK-MX480 and the EX
    documents give no part number. No figure shows one, so an empty bay is shown open.
- what: rear-opening
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The purpose of the dark rectangular opening across the lower middle of the rear plate, which the studio photograph shows and the guide's
    isometric Figures 6 to 8 draw as a recessed plate. No text names it.
- what: eol
  scope: [front, rear]
  reason: vendor-silent
  wanted: an end-of-life notice for the EX9204 chassis, if Juniper publishes one
groups:
  slots:
    term: Slot
    role: traffic
    index-origin: 0
    description: >-
      The line card slots 2 and 1 and the shared slot 1|0, which takes a line card or an EX9200 Switch Fabric module (guide, "Host Subsystem" and
      Figure 9)
  sf-slots:
    term: Slot
    role: service
    index-origin: 0
    description: the dedicated Switch Fabric slot SF0, which takes a Switch Fabric module and nothing else; Routing Engines seat inside the Switch Fabric modules
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        1+1 - guide, "Understanding EX9204 Switch Component and Functionality Redundancy": a host subsystem is a Routing Engine module installed
        directly in a Switch Fabric module; one or two are installed, and with two one is the primary and the other the backup
  craft:
    term: Panel
    role: management
    index-origin: 0
  psus:
    term: PEM
    role: service
    index-origin: 0
    attrs:
      redundancy: 'n+n'
      redundancy-note: 'low line 2+2 (two or four supplies); high line 1+1 (one or two supplies); DC 1+1 (guide, power chapter)'
  cooling:
    term: Tray
    role: service
    index-origin: 0
    attrs:
      redundancy: 'n+1'
      redundancy-note: >-
        n+1 inside the one fan tray - guide, "EX9204 Cooling System": the tray holds three fans, and if one fails the host subsystem raises
        the speed of the other two to cool the switch indefinitely. A single fan cannot be replaced; the whole tray is replaced
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the protective earthing stud pair at the rear upper right (guide Figures 6 to 8)
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD points, one at the front top left and one on the rear plate (guide Figures 5 and 6)
