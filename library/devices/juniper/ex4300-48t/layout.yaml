configurations:
  ac:
    kind: orderable
    description: >-
      EX4300-48T as shipped - one 350 W AC power supply (AIR OUT) in slot 0 with a cover panel over
      slot 1, two EX4300-FAN (AIR OUT) fan modules, and the uplink slot covered. Front-to-back airflow.
    default: true
    part-numbers:
      EX4300-48T: {}
  afi:
    kind: orderable
    airflow: back-to-front
    description: >-
      EX4300-48T-AFI - one 350 W AC power supply (AIR IN) in slot 0 and two EX4300-FAN-AFI (AIR IN)
      fan modules: back-to-front airflow, air entering at the rear and leaving through the front.
    bays:
      psu-0: juniper/ex4300-jpsu-350-ac-afi@1
      fan-0: juniper/ex4300-fan-afi@1
      fan-1: juniper/ex4300-fan-afi@1
    part-numbers:
      EX4300-48T-AFI: {}
  dc:
    kind: orderable
    power: dc
    description: >-
      EX4300-48T-DC - one 550 W DC power supply (AIR OUT) in slot 0 and two EX4300-FAN (AIR OUT) fan
      modules: front-to-back airflow, DC powered. The DC supply does not provide PoE.
    bays:
      psu-0: juniper/ex4300-jpsu-550-dc-afo@1
    part-numbers:
      EX4300-48T-DC: {}
  dc-afi:
    kind: orderable
    power: dc
    airflow: back-to-front
    description: >-
      EX4300-48T-DC-AFI - one 550 W DC power supply (AIR IN) in slot 0 and two EX4300-FAN-AFI (AIR
      IN) fan modules: back-to-front airflow, DC powered.
    bays:
      psu-0: juniper/ex4300-jpsu-550-dc-afi@1
      fan-0: juniper/ex4300-fan-afi@1
      fan-1: juniper/ex4300-fan-afi@1
    part-numbers:
      EX4300-48T-DC-AFI: {}
  s:
    kind: orderable
    description: >-
      EX4300-48T-S - the spare chassis, shipped with no power supply and no fan module; either AC or
      DC supplies and AIR OUT or AIR IN fans are ordered separately, and the datasheet's spare-chassis
      matrix says which combinations are supported. The supply and fan bays are shown open.
    bays:
      psu-0: ''
      psu-1: ''
      fan-0: ''
      fan-1: ''
    part-numbers:
      EX4300-48T-S: {}
