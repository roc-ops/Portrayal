format: 1
kind: device
name: ex3300-24p
version: 0.1.1
maturity: modelled
manufacturer: Juniper
model: EX3300-24P
portfolio: {line: EX Series, family: EX3300}
description: >-
  Juniper EX3300-24P, a 1U access switch with 24 10/100/1000BASE-T PoE+ ports. The ports sit at the right
  of the front panel. Beside them are four SFP or SFP+ uplink ports, an LCD panel with Menu and Enter
  buttons and three chassis lamps. The left half of the panel is plain vented metal. The rear has a management
  port, a USB port, an RJ-45 console port and a redundant power system port. It also has an earthing terminal,
  a built-in fan and an AC power cord inlet. The power supply and the fan are built into the chassis.
  Its non-PoE sibling, the EX3300-24T, is a separate device.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX3300 Switch Hardware Guide, Juniper Networks, published 2020-12-15 (263 pages, PDF creation date
      2020-12-16): Tables 3 to 5 and 13 to 16 and 19 and 32, Figures 1 to 4 and 6 to 11, the mounting
      topics and Table 33 of the earth ground topic. The guide is the maker's, taken from Juniper's EX
      Series documentation archive zip (ex-series-doc-archives.zip, file ex3300.pdf), which holds it and
      a letter of volatility and no quick start. Juniper's image-library photographs of the EX3300 (the
      paths named for the other EX lines, with the SKU in upper and in lower case) answer 404, and the
      maker's datasheet is no longer on juniper.net (the numbered datasheet path answers 404), so no photograph
      and no datasheet figure is used; the datasheet exists only as reseller and archive mirrors, which
      are not used. The guide is copyright Juniper Networks, 2020, all rights reserved, and the archive
      states no terms of use. Nothing of it is copied here; every face is drawn new from measurements.
      End of life was searched on 2026-10-23, and only reseller and tracker pages carry dates (see lifecycle).
  chassis:
    confidence: datasheet
    note: >-
      Table 5 - height 1.75 in. (4.45 cm), width 17.5 in. (44.5 cm), or 19 in. (48.2 cm) with the mounting
      brackets attached, depth 12 in. (30.5 cm), weight 11.6 lb (5.3 kg) for the EX3300-24P. The body
      of 444.5 mm is the metal between the bracket fold lines, the 44.5 mm height is the metric figure
      as printed, and the 305.0 mm depth is the 12 in. as printed. The depth carries no allowance for
      the power cord retainer, which the rear panel topic says extends 3 in. (7.62 cm) out of the chassis.
  scale:
    confidence: drawing
    note: >-
      Gate 1 - Figures 1 and 2 (pages 25 and 26) are vector drawings, read as PDF paths. Figure 2, the
      24-port face, is drawn flat and straight on: its width is 292.03 pt and its height 29.05 pt, an
      aspect of 10.05 against 9.99 for 444.5 by 44.5 mm, which is 0.6 percent. So the face carries geometry
      at 0.657 pt/mm, and positions are taken from the paths of the drawing, not from pixels. The jacks
      of Figure 2 land at the same positions as the right two blocks of Figure 1 to 0.01 mm. The rear
      figures (Figures 3 and 4, pages 26 and 27) are drawn flat too but at their own scale: the face is
      326.81 pt wide and 31.89 pt high, an aspect of 10.25 against 9.99, which is 2.6 percent out. The
      width anchors the scale there, 0.735 pt/mm, and the rear heights are good to about 3 percent. The
      photograph that would settle both is not held.
  ports:
    confidence: drawing
    note: >-
      Figure 2 draws 24 jacks in two blocks of 6 columns by 2 rows at the right of the face, each jack
      12.51 by 10.32 mm, the first at 189.46 mm and the block step 89.74 mm (starts 189.46 and 279.20
      mm; the same figures as the third and fourth blocks of the 48-port face). The columns inside a block
      stand 14.16 mm apart, which is used as the pitch, and the two rows 14.15 mm apart with the upper
      row at 12.86 mm. The four SFP+ cages sit in a frame 58.22 mm wide at 366.60 mm, which is the SFF-8433
      width of four cages (4 x 14.25 + 1.2 = 58.2), so the cages start at 367.2 mm on the registry's 14.25
      mm pitch. The upper row of jacks is turned 180 so that its keyway and lamp tabs face up, as Figure
      8 shows them. The left of the face, from the logo to the first jack at 189 mm, carries no port,
      only the vented band along the top and the vent strip along the foot.
  port-numbering:
    confidence: drawing
    note: >-
      Table 4 and the front panel topic label the ports 0 through 23 and the uplinks 0 through 3. Figure
      8 is the 24-port panel and prints each pair of numerals over its column, even over odd, above the
      upper row of jacks, 0 and 1 over the first column and 22 and 23 over the last, so the upper jack
      of a column is the even port and the lower the odd one. The uplink numerals 0 to 3 are drawn between
      the two lamp slots of each uplink, under the cages (Figures 2 and 9). Interface names are not printed
      on the metal: the guide names ge-0/0/n for the 24 built-in ports (PIC 0), and ge-0/1/n or xe-0/1/n
      for the four uplinks (PIC 1, Table 4 and the Uplink Ports topic). They go here only.
  port-lamps:
    confidence: drawing
    note: >-
      Figure 8 - each network port has two lamps, a Link/Activity lamp at one keyway-side corner and a
      Status lamp at the other, on the corners of the jack that face outward (the upper jack's at its
      top, the lower jack's at its foot). The common/rj45-ganged-eth@1 housing carries both. Figure 9
      - each uplink port has a Link/Activity lamp and a Status lamp, drawn in Figure 2 as two tall slots
      2.12 by 3.70 mm on a 7.19 mm pitch under the cage, with the numeral between them; they are drawn
      as common/led-rect@1 turned 90. The Status lamp shows speed, administrative state, duplex or PoE
      according to the mode the LCD Enter button chose (Tables 11 and 12), so its states are not expressible
      as one vocabulary here (see gaps).
  status-block:
    confidence: drawing
    note: >-
      Figure 6 and Table 7 give the chassis lamps ALM, SYS and MST, in that order from the top, at the
      far right of the panel. Figure 2 draws three circles 2.63 mm across at x 430.94 mm and y 5.89, 9.70
      and 13.51 mm, with the legends at x 435.43 mm. The LCD panel is a window 36.92 by 10.73 mm at (379.18,
      8.25) mm, with the Menu button at (421.5, 7.64) and the Enter button at (421.7, 15.6) mm, both about
      6 by 5 mm (Figure 5 and Table 6). The LCD panel is drawn as a window and not as a component: no
      library component for an LCD display exists.
  drawing-vs-photo:
    confidence: estimated
    note: >-
      No photograph is held, so no drawing was checked against the real device. Figure 1 is captioned
      for a switch with 48 ports and prints "EX3300 PoE+" over the LCD panel, which is the legend used
      on this PoE model, and Figure 2 is captioned for 24 ports and prints "EX3300" with no PoE+ mark.
      The guide does not say which model either figure shows, so a 24-port PoE model that prints "EX3300
      PoE+" is an inference from the 48-port figure. A PoE mode lamp and a POE legend like those of other
      EX lines are not drawn: the guide shows no such lamp, only the LCD menu that chooses the Status
      lamp mode.
  rear:
    confidence: drawing
    note: >-
      Figure 3 (page 26), flat, at 0.735 pt/mm across. From the left: the MGMT RJ-45 over a USB-A port
      in one stack at 10.7 mm, the CON RJ-45 at 31.4 mm, the RPS port plate at 50.2 mm (67.8 by 14.1 mm),
      a lighter plate with two earthing holes at 34.1 mm over the RPS port and an earth symbol at 88.5
      mm, the ESD socket at 109.7 mm, the round grille of the rear fan at 127.6 mm, the serial number
      ID label at 281.9 mm and a smaller label at 354.3 mm, five screw heads along the foot, and the AC
      power cord inlet at 400 mm. The EX3300-24P rear is taken from the same figure as the other AC models:
      the guide draws one AC rear panel and one DC rear panel for the whole family.
  rear-modules:
    confidence: datasheet
    note: >-
      Table 4 and the power supply topic - the power supply and the fan tray are built in ("Built-in power
      supply", "Built-in fan tray"), the packing list (Table 32) lists a "Switch with built-in power supply",
      and the Troubleshooting topic does not list either as a replaceable unit. So the switch has no power
      supply bay and no fan bay: the inlet and the fan grille are part of the chassis, drawn as placements.
      There is no handle colour to record, and no blank.
  earthing:
    confidence: datasheet
    note: >-
      Table 33 - the EX3300 earthing terminal is on the rear panel, with two 10-32 by 0.25 in. screws
      with #10 split-lock washers (not provided), two #10 flat washers and a Panduit LCC10-14BWL lug or
      equivalent, as for the EX3200 and EX3400. Figure 3 draws the plate as 45.0 by 12.65 mm with two
      holes 19.8 mm apart, which disagrees with the 5/8 in. pitch of a two-hole lug; juniper/ex3400-ground-pair@1
      is reused (33.1 by 12.1 mm, screws on 15.875 mm), set at the centre of the drawn plate.
  ears:
    confidence: datasheet
    note: >-
      Mounting topics - two brackets and eight screws ship in the box (Table 32) and mount along the front
      or the rear of the side panels, for a two-post mount; four rubber feet ship for a desk. The separately
      orderable four-post rack-mount kit holds flush and 2-in.-recess front-mounting brackets, side mounting
      rails and rear mounting blades, and the separately orderable wall-mount kit holds the wall brackets
      and a baffle. The guide names no part number for either kit, so neither is listed under kits, and
      its figures place the brackets without a measurable fold line, so only the recess (2 in., 50.8 mm)
      has an `at`.
  color:
    confidence: estimated
    note: >-
      The face colour #8c9094 and the lettering #eef0f2 are borrowed from the EX3400 family, whose photographs
      were sampled. No photograph or colour description of the EX3300 is held; the drawings are line art.
  power:
    confidence: datasheet
    note: >-
      Table 14 - the EX3300-24P consumes at most 60 W when no PoE power is drawn, with 405 W available
      for PoE across 24 PoE-enabled ports, and Table 3 gives the same 405 W. The maximum power on a PoE+
      port is 30 W and the guaranteed power is 25.5 W (the power supply topic). Table 15 - AC input 100
      through 240 VAC at 50 or 60 Hz, 7 A at 100 VAC and 2.9 A at 230 VAC for switches with ports enabled
      for PoE.
  fru-bays:
    confidence: datasheet
    note: >-
      Table 4 and the power supply topic - the power supply and the fan tray are built in; there are no
      field-replaceable power or fan units. Transceivers in the uplink cages are the only seated modules,
      and the guide lists them under Pluggable Transceivers Supported on EX3300 Switches (page 61).
attrs:
  physical:
    weight: 5.3 kg (11.6 lb) (Table 5)
    width-with-brackets: 482 mm (19 in.) with the mounting brackets attached (Table 5)
  power:
    power-max-w: 60
    power-envelope: bare
    power-input-ac: 100 through 240 VAC, 50 or 60 Hz (Table 15)
    power-current-max: 7 A at 100 VAC and 2.9 A at 230 VAC for a switch with PoE ports (Table 15)
    poe-budget-w: 405 W available for PoE (Tables 3 and 14)
    poe-standard: >-
      PoE+ (IEEE 802.3at) on all 24 ports, at most 30 W per port and 25.5 W guaranteed (Power Supply in
      EX3300 Switches)
  thermal:
    cooling: two fans, one along the rear and one along the left side of the chassis (Cooling System)
  environmental:
    operating-temp: 0 to 45 C (32 to 113 F) (Table 19)
    altitude: no performance degradation up to 3048 m (10,000 ft) (Table 19)
    humidity: 10 to 85 percent, noncondensing (Table 19)
  platform: {first-junos-release: 11.3R1 (Table 3)}
  features:
    virtual-chassis: >-
      up to 10 switches. Uplink ports 2 and 3 are Virtual Chassis ports by default and ports 0 and 1 are
      network ports
    uplink-ports: four SFP or SFP+ ports on the front
    optics-sfp-plus: >-
      the uplink ports take SFP and SFP+ transceivers, singly or mixed (Pluggable Transceivers Supported
      on EX3300 Switches, page 61)
  management:
    oob: management Ethernet RJ-45 on the rear panel, with a Link/Activity lamp and a Status lamp
    console: RJ-45 console on the rear panel
    usb: one USB port on the rear panel
    lcd: LCD panel with two lines of 16 characters and Menu and Enter buttons
  compliance:
    seismic: Complies with Zone 4 earthquake requirements as per GR-63, Issue 4 (Table 19)
  lifecycle: {eol: announced, end-of-sale: '2019-06-30', end-of-support: '2024-06-30'}
chassis:
  width: 444.5
  height: 44.5
  depth: 305.0
  ru: 1
  weight-kg: 5.3
  color: '#8c9094'
  silk: '#eef0f2'
  airflow: front-to-back
  power: ac
  ears:
    positions:
    - {name: flush, label: front-mount, at: 0, default: true}
    - {name: recessed, label: 2-in. recess, at: 50.8}
