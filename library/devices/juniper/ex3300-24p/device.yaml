gaps:
- what: lifecycle-source
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    Juniper's own end-of-life notice for the EX3300. The end-of-sale and end-of-support dates (2019-06-30
    and 2024-06-30) are those that reseller and tracker pages give for the end-of-life announcement of
    2019-02-01, which Juniper's page keeps behind a login; the maker's page was not reachable.
- what: photographs
  scope:
  - front
  - rear
  reason: needs-photo
  wanted: >-
    A straight-on photograph of the front and of the rear. Juniper's image library holds none at the paths
    its other EX lines use. Face colour, finish, the legends the real faceplate prints (the port numerals,
    the uplink numbers, the lamp legends) and the colour of the lamps' windows are drawn from the guide's
    line art only.
- what: datasheet
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    The EX3300 datasheet, which would state the power and thermal figures a second time. It is no longer
    on juniper.net.
- what: lcd-component
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    A library component for an LCD display; the LCD panel is a decor window until one exists.
- what: port-status-lamp-states
  scope:
  - rj45
  - uplink-leds
  reason: vendor-silent
  wanted: >-
    A per-port vocabulary for the Status lamp. Table 11 gives it four meanings that depend on the mode
    the LCD Enter button chose (speed, administrative status, duplex, PoE), so the jack keeps the component's
    default off, link and activity states.
- what: rps-port-connector
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The connector type and pinout of the redundant power system port, and the model of the external power
    system. The guide names the port and nothing else, and this part is drawn as a plate and an opening.
- what: rear-label-rectangles
  scope:
  - rear
  reason: needs-drawing
  wanted: >-
    The text of the serial number ID label and the other label rectangles on the rear. Figure 51 of the
    guide prints a sample serial number ID label, which is not transcribed.
- what: side-fan
  scope:
  - left
  reason: needs-drawing
  wanted: >-
    The second fan, along the left side of the chassis (Cooling System). No figure draws the side panel
    flat.
- what: four-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: A flat drawing or photograph of the lid, the underside and the side panels.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g, poe: 802.3at}
    description: 24 PoE+ ports labelled 0 to 23, the even ports on the upper row
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      Four uplink ports labelled 0 to 3. Each takes an SFP or an SFP+ transceiver. Ports 2 and 3 are Virtual
      Chassis ports by default
  uplink-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: 'on', color: '#22c55e'}
    - {name: blinking, color: '#22c55e', behavior: blinking}
    description: >-
      A Link/Activity lamp and a Status lamp beside each uplink port. Table 10 - the Link/Activity lamp
      blinks green with traffic and is steady green with a link and no traffic. Table 12 - the Status
      lamp is unlit at 10 or 100 Mbps, blinking at 1000 Mbps and steady at 10 Gbps
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the management corner - the out-of-band RJ-45, the USB port and the RJ-45 console, with the RPS
      port
  lcd-buttons: {term: Button, role: management, index-origin: 0, description: the LCD panel's Menu and
      Enter buttons}
  status-leds: {term: LED, role: indicator, index-origin: 0, description: 'ALM, SYS and MST chassis lamps
      (Table 7)'}
  power-in:
    term: Inlet
    role: service
    index-origin: 0
    description: the built-in power supply's input, an AC power cord inlet or a DC terminal block
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy-note: >-
        The fan along the rear is built in and not replaceable. If a fan fails the others run faster and
        the switch raises an alarm (Cooling System)
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the rear earthing terminal, two 10-32 screws for a two-hole lug (Table 33)
  esd: {term: Point, role: furniture, index-origin: 0, description: the rear wrist-strap ESD point (Figure
      3)}
  furniture: {term: Item, role: furniture, index-origin: 0, description: screw heads on the rear panel}
