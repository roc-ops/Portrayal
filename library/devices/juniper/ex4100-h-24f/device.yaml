format: 1
kind: device
name: ex4100-h-24f
version: 0.2.2
maturity: modelled
manufacturer: Juniper
model: EX4100-H-24F
portfolio: {line: EX Series, family: EX4100-H}
description: >-
  Juniper EX4100-H-24F is a hardened (industrial), fanless 1RU fibre access switch with 24 1 Gbps SFP
  ports, four 1/10 Gbps SFP/SFP+ Virtual Chassis or uplink ports and four 1/10 Gbps SFP/SFP+ MACsec uplink
  ports. It has no PoE. The front carries the 24 SFP cages in two banks of six columns numbered 0 to 23,
  a USB Type-C console port, a reset pinhole, a Mode button, a plug-in dry contact alarm connector, the
  management Ethernet port over a USB Type-A port over an RJ-45 console port, the chassis and port mode
  lamps, the two cage groups, the PSU lamps, and at the right a terminal door over the power input terminals
  of both power supply slots. The rear carries a two-hole earthing terminal, an ESD point, a physical
  security lock slot and two field-replaceable power supply slots, a 90 W AC or DC supply in the first
  and a blank over the second. There is no fan. The EX4100-H-24MP is the same box with 24 PoE++ jacks
  in place of the SFP ports and a 340 W supply.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX4100-H Switch Hardware Guide, Juniper Networks (copyright Hewlett Packard Enterprise Development
      LP), published 2026-10-01, 299 pages, https://www.juniper.net/documentation/us/en/hardware/ex4100-h/ex4100-h.pdf
      (sha256 recorded under references): Tables 3 to 8, 12 to 15, 16 to 22, 25, 28, 32, 35, 36 and 42,
      Figures 5, 6, 8, 10, 12, 14, 16, 18, 20, 22, 26, 30 and 32, the mounting topics (Figures 67 to 79),
      the power connection steps and the packing list (Table 67). The guide's flat front and rear figures
      (Figures 5 and 6, 3000 px wide) are the pictures measured. Juniper's studio photographs of the model,
      front and rear (2100 px wide), from the maker's public image library (https://www.juniper.net/content/dam/www/assets/images/us/en/image-library/ex-series/ex4100-h-24f/ex4100-h-24f-front-high.jpg
      and ex4100-h-24f-rear-high.jpg), confirm the colours, the lamps, what is printed and the seated
      supply; neither is copied here. The EX4100 datasheet (https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex4100-line-of-ethernet-switches-datasheet.pdf)
      redirects to an HPE PSNow document that did not answer, so no datasheet figure is used. No Visio
      stencil or 3D model of the EX4100-H was found. Nothing is taken from a reseller. End of life was
      searched 2026-10-23 and no Juniper notice for the EX4100-H was found, so the lifecycle is none announced.
  chassis:
    confidence: datasheet
    note: >-
      Tables 13 and 14 - height 1.7 in (4.33 cm), width 17.28 in (43.90 cm), depth 14.96 in (37.99 cm),
      weight 17.79 lb (8.07 kg) with no supply, 20.28 lb (9.20 kg) with one AC supply and 20.24 lb (9.23
      kg) with one DC supply. The inch and centimetre figures of the height disagree by 0.2 mm (1.7 in
      is 43.18 mm); the centimetre figure, 43.3 mm, is used. Unlike the EX4100-H-24MP, the guide gives
      one depth for both supplies. The width is the body between the bracket fold lines: the guide says
      the front mounting brackets extend it to 19 in (Table 56), and the figures show no ears.
  scale:
    confidence: measured
    note: >-
      Gate 1 - Figure 5 is 3000 px wide; the body outline is 2883.5 px across, 6.568 px/mm against 439.0
      mm, and 284.5 px high, 6.57 px/mm against 43.3 mm: 0.1 percent apart, so it is orthographic and
      carries geometry. Figure 6 (the rear) is 2860 px across and 283 px high: its aspect, 10.1, agrees
      with the table's 10.14 to 0.5 percent, but its body reads 3.3 mm short of 439.0 at the front's scale,
      so the figure is drawn about 0.8 percent small. Positions from the left of the rear figure are taken
      at the front's scale; those right of the blank are measured from the right edge of the figure and
      carried 3.3 mm so that they sit from the right edge of the 439.0 mm body. The photographs (2100
      px wide, 4.17 px/mm) agree with the figures to about a millimetre. Every position is estimated,
      good to about 0.3 mm across and 0.2 down on the front and 0.6 across on the rear.
  ears:
    confidence: datasheet
    note: >-
      Table 7 and the mounting topics (Figures 67 to 79) - two-post rack mounting is the default, with
      the EX4100-H-2P-RMK kit provided in the box: a pair of side brackets that hang on shoulder screws
      and slide toward the rear, with M4 by 6 mm screws, mounting the switch flush with the front posts.
      The orderable four-post kits are EX4100-H-4P-RMK (screws, with rear mounting blades) and EX4100-H-4P-TL-RMK
      (toolless rails). No position other than flush is stated and none is measured. No kit contract is
      written: the guide gives no rack-depth range, preset or rail depth for any of the three kits (Table
      56 states only a 27 in minimum cabinet depth, which is a cabinet figure and not a kit range), and
      a kit configuration needs one of the two, so a contract would carry an invented range. The kits
      stay in provenance only. The guide asks for 1 RU clear above and below.
  ports:
    confidence: photo-measured
    note: >-
      Table 13 and Figure 5 - 24 SFP cages in two rows in two banks of six columns: ports 0 to 11 from
      10.0 mm across and ports 12 to 23 from 103.1 mm. The columns are on a 14.7 mm step, not the registry's
      14.25, which is the cage's width and leaves no gap; the cages are the registry's 14.25 mm wide and
      are placed on the measured step. The rows are 14.3 mm apart, upper cell at 9.2 mm and lower at 23.5,
      the upper row turned 180 as in a stacked cage. Then two groups of four SFP/SFP+ cages, each two
      columns by two rows: the Virtual Chassis ports (callout 11, VCP) and the uplink ports (callout 7,
      UPLINK), with rows 12.6 mm apart.
  port-numbering:
    confidence: photo-measured
    note: >-
      Figure 5 and the photograph - the legends over the upper row read 0, 2, 4 and on to 22 and under
      the lower row 1, 3 and on to 23, so the upper cage of a column is the even port. The cage groups
      print 0 and 2 over the upper row and 1 and 3 under the lower row, with the group's name, VCP or
      UPLINK, over it. The numbers are as printed, from 0. Interface names are not printed on the metal,
      and the guide's factory-default configuration is for the 12MP, so none is recorded.
  port-lamps:
    confidence: datasheet
    note: >-
      Figures 14, 16 and 18 and Table 19 - every cage has a Link Activity lamp and a Status lamp: two
      round lamps beside the cage's number, above the upper row and below the lower row. The Status lamp
      shows what the mode lamps select (Table 20), so its states cannot be one vocabulary here.
  status-block:
    confidence: photo-measured
    note: >-
      Figures 5, 8 and 20 and Tables 16 and 20 - two columns of lamps: the chassis lamps SYS, ALM, MST
      and CLD at 265.5 mm across and the port mode lamps SPD, DX and EN at 271.4 mm (the PoE lamp is not
      fitted to a model without PoE ports, the note under Figure 19), each legend over its lamp and each
      lamp 7.1 mm below the one above. The three dry contact alarm lamps (IN 0, IN 1 and OUT, Tables 21
      and 22) are at 259.5 mm with a bell mark and the legend over each, and the PSU 0 and PSU 1 lamps
      at 341.5 mm beside the cage groups. The lamps are round, 2.4 mm across in the figure; common/led-dot@1
      is 2.0 and is used.
  management:
    confidence: photo-measured
    note: >-
      Figure 5 - the management Ethernet port (MGMT, callout 4, with its two lamps), the USB 2.0 Type-A
      host port (callout 12) and the RJ-45 RS232 console port (CON, callout 13) are stacked in one metal
      housing 14.4 mm wide, upside down for the management port as the keyway shows. The housing is too
      narrow for the full RJ-45 jack and holds ganged cells, 12.7 by 11.0. The USB Type-C console port
      (callout 2, CON), the RESET pinhole (callout 3) and the round Mode button (callout 14, the Factory
      Reset/Mode button) are in a row to the left of it. The claim code label (callout 9) is a sticker.
  alarm:
    confidence: datasheet
    note: >-
      Table 4 and Figure 22 - the dry contact connector (callout 15) is a six-pole plug on a 3.5 mm pitch
      at 195.2 mm across and 26.9 mm down, with GND, IN 0, IN 1, NO, COM and NC printed at 45 degrees
      over it, each with a tick to its pole. The alarm input threshold is 5 V and the plug is preassembled
      (Table 67).
  power-input:
    confidence: datasheet
    note: >-
      Figure 5, callout 10, and the connection steps - behind a terminal door at the right of the front,
      two sections, PSU 0 and PSU 1, each with six terminals: L, N and G above and DC+, DC- and G below,
      the AC row over an AC symbol and the DC row under a DC symbol. The terminals of a section serve
      the supply in the rear slot of the same number. The door has a Phillips screw at its right end and
      the legends are printed inside it. The guide asks for an external 2-pole or 4-pole circuit breaker
      rated 20 A minimum for AC and a 2-pole 25 A, 80 VDC breaker for DC. Torque and tool belong to provenance
      only.
  earthing:
    confidence: photo-measured
    note: >-
      Table 68 and Figure 100 - a two-hole protective earthing terminal on the rear panel for a Panduit
      LCD6-14A-L lug on two M5 by 10 mm screws with washers (the grounding kit is JNP-GL-2H6-M5-RA, separately
      orderable). The figure shows two holes 15.9 mm apart (the 5/8 in lug pitch) on a lighter plate at
      the right end. They are drawn as bare holes on the plate, now parts: one two-hole seat on that pitch
      (`ground-stud-pitch` says how the pitch is read).
  rear:
    confidence: photo-measured
    note: >-
      Figure 6 and the photograph - from the left, the serial number label, the supply in slot 0 with
      its retaining thumbscrew on a tab at the left end, a bracket with a second screw, the slot 1 blank
      with a captive screw at each end, then the ESD point (callout 3), the physical security lock slot
      (callout 5) with its padlock mark and the earthing plate (callout 4) with its symbol. PSU 0 is printed
      above the first tab and PSU 1 at the right end of the blank. This is the reverse of the EX4100-H-24MP's
      rear, which has the earthing plate, ESD point and lock slot at the left.
  power-modules:
    confidence: datasheet
    note: >-
      Table 12, Tables 25, 28, 35 and 42, Figure 6 and the removal and installation topics - the two supply
      slots take JPSU-H-90W-AC (90 W AC) and EX4100-H-24F-DC-PSU (90 W DC), field-replaceable and hot
      swappable, N+1 redundant, in any combination of one or two. The switch ships with one preassembled
      (Table 67) and the guide describes a blank on the second slot (callout 2 of Figure 6). The guide
      gives no airflow direction: the switch is fanless and convection cooled, so there is no airflow
      variant, and the handle colour on the photograph is green. The supplies are components in the bays.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      The legends are drawn from Figure 5 and the photograph, which agree: the model line reads EX4100-H
      24F in light grey (the figure prints it dark, as it prints every legend), and there is no orange
      frame or orange numeral on a model with no PoE. The maker's logo and Mist AI mark are not drawn
      and are reserved as a logo-zone. Figure 6 draws a DC supply in the first slot where the photograph
      shows an AC one; the outlines are the same and both supplies are modelled.
  colour:
    confidence: photo-measured
    note: >-
      The face colour is the photograph's median of the bare front and rear, #6a727f, which Figure 5 agrees
      with.
  power:
    confidence: datasheet
    note: >-
      Tables 12, 25, 28 and 35 - 90 W AC or DC supplies, 100 to 240 VAC and 20.4 to 72 VDC. The guide
      gives no PoE budget (there is no PoE) and no maximum input power for the chassis.
  ground-stud-pitch:
    confidence: estimated
    note: >-
      INFERRED, NOT STATED. Table 68 names two M5 x 10 mm stainless steel screws with washer (separately
      orderable; the grounding kit JNP-GL-2H6-M5-RA holds the lug and screws) and a Panduit LCD6-14A-L
      lug or equivalent (not provided), and gives no spacing. The figure puts the two holes 15.9 mm apart,
      which is the 5/8 in. (15.875) of the library's two-hole lug for the same hole-spacing code (Panduit
      LCD6-10A-L: '.63 hole spacing'). The terminal is `common/ground-hole-pair-5-8-m5@1`: two bare M5
      holes on 5/8 in. centres, presenting `stud-pair-5-8`, so one two-hole lug (`generic/two-hole-lug-5-8@1`)
      lands across them and a ring lug still lands on either hole. The holes stay bare, as the photograph
      shows them; the screws are fitted with the lug. The holes were drawn 15.9 apart as decor and the
      pair stands on their midpoint.
attrs:
  physical:
    weight: >-
      8.07 kg (17.79 lb) with no supply; 9.20 kg with one AC supply and 9.23 kg with one DC supply, Table
      13
  power:
    power-input-ac: 100 through 240 VAC, 50/60 Hz (Table 28)
    power-input-dc: 20.4 through 72 VDC at the terminal block, nominal +24, -48 or -60 VDC (Table 36)
  thermal:
    cooling: fanless, convection cooled (Table 12); one rack unit clear above and below
  environmental:
    operating-temp: >-
      -40 to 60 C in a sealed enclosure, -40 to 70 C in a ventilated enclosure (40 LFM) and -40 to 75
      C in a blower-equipped enclosure (200 LFM), up to 15000 ft; safety certified at 60 C
    storage-temp: -40 to 85 C in the shipping container
    humidity: 5 to 95 percent, noncondensing
    altitude: no performance degradation up to 15000 ft (4572 m)
  platform: {first-junos-release: 24.4R1 (Table 12)}
  features:
    virtual-chassis: >-
      up to 10 EX4100, EX4100-F and EX4100-H switches; the four VCP cages are the Virtual Chassis ports
      (HiGig or HGoE mode, or uplink ports) and the four uplink cages support HGoE only. A 10GBASE-T transceiver
      cannot form a Virtual Chassis in a VCP
    macsec: the four uplink ports are MACsec capable
    dry-contact-alarm: two alarm inputs (5 V threshold) and one alarm relay output (NO, COM, NC), Table
      4
    optics-sfp: >-
      the 24 front cages take 1 Gbps SFP transceivers; Tables 49 and 50 list the industrial-grade 1 G
      optics against the ambient they allow. The supported list is in Juniper's Hardware Compatibility
      Tool, which the guide names and which is not held here
    optics-sfp-plus: >-
      the eight group cages take 1 Gbps SFP and 10 Gbps SFP+ transceivers; Tables 45 to 48 list the industrial-grade
      10 G and 10GBASE-T optics against the ambient they allow. The supported list is in Juniper's Hardware
      Compatibility Tool, which the guide names and which is not held here
  compliance: {seismic: tested for Zone 4 earthquake safety}
  lifecycle: {eol: none-announced}
