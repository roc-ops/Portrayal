configurations:
  ac:
    kind: orderable
    description: >-
      EX4100-H-24F as shipped with an AC supply (Tables 12 and 67): one 90 W AC supply in power supply
      slot 0, a blank over slot 1 and no fan. The guide's redundant build has a second supply in slot
      1.
    default: true
    power: ac
    part-numbers:
      EX4100-H-24F: {}
  dc:
    kind: example
    power: dc
    description: >-
      EX4100-H-24F with a 90 W DC supply in slot 0 and a blank over slot 1 (Table 12 lists the DC supply).
      The guide names no switch part number for this build.
    bays: {psu-0: juniper/ex4100-h-24f-dc-psu@1, psu-1: juniper/ex4100-h-psu-blank@1}
