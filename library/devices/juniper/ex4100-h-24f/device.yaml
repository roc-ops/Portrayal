gaps:
- what: dc-build-sku
  scope:
  - dc
  reason: vendor-silent
  note: >-
    Table 12 lists a 90 W AC and a 90 W DC FRU supply for the one model EX4100-H-24F and the packing list
    (Table 67) says the supply is "AC or DC", specific to the SKU, but the guide names no switch part
    number for the DC build. The DC build is drawn as an example configuration and is not exported as
    a device type.
  wanted: the orderable part number of the EX4100-H-24F with a DC supply
- what: supply-depth
  scope:
  - psu-0
  - psu-1
  reason: vendor-silent
  note: >-
    The guide gives no dimension for a supply, and Table 13 gives one chassis depth for both builds.
  wanted: the supplies' dimensions
- what: port-status-lamp-states
  scope:
  - sfp
  - vcp
  - uplink
  reason: vendor-silent
  note: >-
    The Status lamp changes meaning with the Mode button (Table 20), so the cage lamps keep the component's
    link and activity vocabulary and the mode lamps carry the meaning.
  wanted: none beyond the component's own vocabulary
- what: cld-lamp-states
  scope:
  - led-cld
  reason: vendor-silent
  note: >-
    The guide names the CLD lamp and sends the reader to the cloud-ready blink patterns, which it does
    not hold.
  wanted: the cloud-ready LED blink patterns
- what: label-plates
  scope:
  - front
  - rear
  reason: needs-drawing
  note: >-
    The claim code label (front) and the serial number label (rear) are stickers with no content in any
    figure; they are named regions and are not drawn.
  wanted: none; stickers
- what: four-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: A flat drawing or photograph of the lid, the underside and the side panels.
- what: ground-pair-pitch
  scope:
  - ground-pair
  reason: vendor-silent
  note: >-
    The guide names the screws and the lug and gives no spacing for the two holes; `ground-stud-pitch`
    says what the pair is drawn at and why.
  wanted: a drawing that dimensions the two holes, or the lug's own datasheet
groups:
  sfp:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp, speed: 1g}
    description: >-
      24 SFP ports numbered 0 to 23 as printed, in two banks of six columns, the upper cage of a column
      even
  sfp-leds: {term: LED, role: indicator, index-origin: 0, description: 'Two lamp windows for each SFP
      port, Link Activity and Status'}
  vcp:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      Four SFP/SFP+ Virtual Chassis or uplink ports numbered 0 to 3, in two columns of two cages, the
      upper cage of a column even
  vcp-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: Two lamp windows for each Virtual Chassis port, Link Activity and Status
  uplink:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      Four SFP/SFP+ MACsec uplink ports numbered 0 to 3, in two columns of two cages, bracketed and labelled
      UPLINK
  uplink-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: Two lamp windows for each uplink port, Link Activity and Status
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      how the switch is reached and restarted - the management Ethernet port, the USB Type-A port, the
      RJ-45 console, the USB Type-C console, the reset pinhole and the Mode button
  alarm:
    term: Terminal
    role: management
    index-origin: 0
    mixed: >-
      the dry contact alarm connector, two alarm inputs and a relay output with its three poles
  alarm-leds: {term: LED, role: indicator, index-origin: 0, description: 'the IN 0, IN 1 and OUT dry contact
      alarm lamps'}
  status-leds: {term: LED, role: indicator, index-origin: 0, description: 'the SYS, ALM, MST and CLD chassis
      lamps'}
  mode-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the SPD, DX and EN port mode lamps; the lit one says what each Status lamp shows
  psu-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the PSU 0 and PSU 1 lamps, which show whether each supply slot's output is good
  power-input:
    term: Terminal
    role: service
    index-origin: 0
    description: >-
      the power input terminals behind the terminal door, six for each supply slot - L, N and G for AC,
      DC+, DC- and G for DC
  psus:
    term: Slot
    role: service
    index-origin: 0
    attrs:
      redundancy: n+1
      redundancy-note: >-
        Table 12 and the field-replaceable units section - the supplies are "redundant N+1 hot swappable
        power supply"; the switch ships with one and takes a second
    description: >-
      the two field-replaceable power supply slots, PSU 0 then PSU 1, N+1 redundant and hot swappable
  esd: {term: Point, role: furniture, index-origin: 0}
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the earthing terminal, two bare M5 holes for a two-hole lug (Table 68)
