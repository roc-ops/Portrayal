configurations:
  base:
    kind: base
    source: >-
      derived - built from the group roles rather than from a vendor bundle: every bay
      whose group is `service` or `management` keeps its seat, every `traffic` bay takes
      a blank. This vendor publishes no base configuration for this chassis, so the
      library defines one. Where a vendor DOES publish one, follow it instead and say so
      here.
    default: true
    description: >-
      Chassis only - what you spec before deciding what goes in it. The 2 slot bays are
      EMPTY; fans, psus, res are populated. Enough to power on and reach the box, which
      is the question most people ask first and the one `default` used to answer with
      whatever the drawing happened to be populated with.
    bays:
      lmic0: juniper/jnp304-blnk@1
      lmic1: juniper/jnp304-blnk@1
  dual-re-ac:
    kind: example
    description: Two Routing Engines, two LMIC16s, AC power - the fully
      redundant configuration the guide photographs. 3.2 Tbps of installed
      capacity.
  one-re-3lmic-ac:
    kind: example
    description: One Routing Engine and three LMIC16s (the third in the
      RE 1/LMIC2 slot) - the maximum-capacity 4.8 Tbps configuration of guide
      Figure 3.
    bays:
      re1-lmic2: juniper/mx304-lmic16@1
  dc:
    kind: orderable
    description: DC-powered chassis - two 2200 W DC PSUs, dual Routing
      Engines.
    bays:
      psu-0: juniper/mx304-psu-dc@1
      psu-1: juniper/mx304-psu-dc@1
  hvac-dc:
    kind: orderable
    description: High-voltage AC/DC universal power - two 2200 W HVAC/DC
      PSUs, dual Routing Engines.
    bays:
      psu-0: juniper/mx304-psu-hvacdc@1
      psu-1: juniper/mx304-psu-hvacdc@1
