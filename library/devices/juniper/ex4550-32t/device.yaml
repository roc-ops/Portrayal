configurations:
  ac-f2b:
    kind: orderable
    default: true
    description: >-
      EX4550-32T-AFO: one AC supply (JPSU-650W-AC-AFO) in slot 0, a cover panel in slot 1 and three front-to-back
      fan modules (EX4550-FAN-AFO). The labels are AFO and AIR OUT (guide Table 4).
    part-numbers:
      EX4550-32T-AFO: {}
  ac-b2f:
    kind: orderable
    airflow: back-to-front
    description: >-
      EX4550-32T-AFI: one AC supply (JPSU-650W-AC-AFI) in slot 0, a cover panel in slot 1 and three back-to-front
      fan modules (EX4550-FAN-AFI). The labels are AFI and AIR IN.
    bays: {psu-0: juniper/ex4600-jpsu-650-ac-afi@1, fan-1: juniper/ex4550-fan-afi@1, fan-2: juniper/ex4550-fan-afi@1,
      fan-3: juniper/ex4550-fan-afi@1}
    part-numbers:
      EX4550-32T-AFI: {}
  dc-f2b:
    kind: orderable
    power: dc
    description: >-
      EX4550-32T-DC-AFO: one DC supply (JPSU-650W-DC-AFO) in slot 0, a cover panel in slot 1 and three
      front-to-back fan modules (EX4550-FAN-AFO).
    bays: {psu-0: juniper/ex4600-jpsu-650-dc-afo@1}
    part-numbers:
      EX4550-32T-DC-AFO: {}
  dc-b2f:
    kind: orderable
    power: dc
    airflow: back-to-front
    description: >-
      EX4550-32T-DC-AFI: one DC supply (JPSU-650W-DC-AFI) in slot 0, a cover panel in slot 1 and three
      back-to-front fan modules (EX4550-FAN-AFI).
    bays: {psu-0: juniper/ex4600-jpsu-650-dc-afi@1, fan-1: juniper/ex4550-fan-afi@1, fan-2: juniper/ex4550-fan-afi@1,
      fan-3: juniper/ex4550-fan-afi@1}
    part-numbers:
      EX4550-32T-DC-AFI: {}
  two-psu:
    kind: example
    description: >-
      The EX4550-32T-AFO with a second AC supply in slot 1, as the guide allows. An illustration, not
      an order code.
    bays: {psu-1: juniper/ex4600-jpsu-650-ac-afo@1}
