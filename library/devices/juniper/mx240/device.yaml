configurations:
  base:
    kind: base
    default: true
    description: >-
      Chassis only - what you spec before deciding what goes in it. The 4 slot bays are
      EMPTY; cooling, craft, psus are populated. Enough to power on and reach the box,
      which is the question most people ask first and the one `default` used to answer
      with whatever the drawing happened to be populated with.
    bays:
      dpc2: ''
      dpc1: ''
      scb1-dpc0: ''
      scb0: ''
  dc:
    kind: orderable
    description: DC-powered chassis as photographed - four normal-capacity DC
      PEMs, two SCB-MX with RE-S-1300, DPC 40xGE in slot 2 and DPC-R-4XGE in
      slot 1.
  ac:
    kind: orderable
    description: AC-powered chassis - normal-capacity AC supplies (high-line
      uses PEM0/PEM2; the four-bay low-line form is drawn).
    bays:
      pem0: juniper/mx240-psu-ac@1
      pem1: juniper/mx240-psu-ac@1
      pem2: juniper/mx240-psu-ac@1
      pem3: juniper/mx240-psu-ac@1
gaps:
  - what: current-generation-frus
    scope: [slots]
    reason: needs-photo
    wanted: orthographic imagery for the current MPC/SCBE2-SCBE3/RE-S-X6
      generation - the intake holds their figures and power tables but no
      straight-on photography, so the EOL FRUs the reference photograph
      carries are what is modelled. The power tables for the newer FRUs are
      already transcribed in the guide extraction for when they are built.
  - what: high-capacity-psus
    scope: [psus]
    reason: needs-photo
    wanted: faces for the high-capacity AC/DC supplies (figures 15/17 are
      isometric line art only).
  - what: craft-and-card-dimensions
    scope: [craft, slots]
    reason: vendor-silent
    wanted: vendor dimensions for the craft panel and cards - no physical
      dimension for either exists in the intake, so faces are sized to the
      photographed apertures.
  - what: supported-optics
    scope: [slots]
    reason: vendor-silent
    wanted: transceiver lists per DPC/MPC (external compatibility tool).
