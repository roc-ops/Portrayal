configurations:
  ac:
    kind: orderable
    description: >-
      EX4300-48MP as shipped - one 1400 W AC power supply (AIR OUT) in slot 0 with a cover panel over
      slot 1, two EX4300-48MP-FAN (AIR OUT) fan modules, and the uplink slot covered. Front-to-back airflow.
    default: true
    part-numbers:
      EX4300-48MP: {}
  s:
    kind: orderable
    description: >-
      EX4300-48MP-S - the spare chassis, shipped with no power supply and no fan module; AC supplies are
      ordered separately, with AIR OUT fans, and the datasheet's spare-chassis matrix says which combinations
      are supported. The supply and fan bays are shown open.
    bays: {psu-0: '', psu-1: '', fan-0: '', fan-1: ''}
    part-numbers:
      EX4300-48MP-S: {}
