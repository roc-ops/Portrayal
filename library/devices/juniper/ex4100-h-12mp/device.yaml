  std:
    kind: orderable
    description: >-
      EX4100-H-12MP as shipped (Table 8 and the packing list, Table 65): the switch with its two PSU connectors
      and alarm connector preassembled, one external 340 W AC or DC supply in the box (specific to the
      SKU) and no fan. The supplies are external and are not modelled.
