format: 1
kind: device
name: ex4100-h-12mp
version: 0.1.2
maturity: modelled
manufacturer: Juniper
model: EX4100-H-12MP
portfolio: {line: EX Series, family: EX4100-H}
description: >-
  Juniper EX4100-H-12MP is a hardened (industrial), fanless multigigabit PoE++ access switch in a small
  upright box, 111.7 mm wide and 152.4 mm high, with twelve RJ-45 ports (four 100M/1/2.5 Gbps and eight
  10M/100M/1 Gbps, all PoE++ at 90 W by default), two 1/10 Gbps SFP/SFP+ MACsec uplink ports and two 1/10
  Gbps SFP/SFP+ Virtual Chassis ports. Everything is on the front: the jacks in two blocks, the cages
  in a column, a management Ethernet port with a USB Type-A port and an RJ-45 console port in one housing,
  a USB Type-C console port, two plug-in PSU connectors, a plug-in dry contact alarm connector, the chassis
  and port mode lamps, a Mode button, a reset pinhole, an ESD point and a two-hole protective earthing
  terminal. It is powered by one or two external 340 W AC or DC supplies, which are separate boxes wired
  to the PSU connectors, so the chassis has no power supply bay and no fan. The rear is a vented plate
  between two plates with mounting holes. The guide's default mounting is desktop or any flat surface
  in a certified cabinet; DIN rail, magnet, wall and two-post rack kits are orderable.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX4100-H Switch Hardware Guide, Juniper Networks (copyright Hewlett Packard Enterprise Development
      LP), published 2026-10-01, 299 pages, https://www.juniper.net/documentation/us/en/hardware/ex4100-h/ex4100-h.pdf
      (sha256 recorded under references): Tables 3 to 9, 14 and 15, 18 to 23, 26, 29, 31, 33 and 36, Figures
      1, 2, 7, 9, 11, 13, 15, 17, 19, 21 and 23 to 28, the mounting topics (Figures 39 to 66), the earthing
      steps (Table 68 and Figure 98) and the packing list (Table 65). The guide's flat front figure (Figure
      1, 3000 px wide) is the picture measured. Juniper's studio photographs of the model, front and rear
      (2100 px high), from the maker's public image library (https://www.juniper.net/content/dam/www/assets/images/us/en/image-library/ex-series/ex4100-h-12mp/ex4100-h-12mp-front-high.jpg
      and ex4100-h-12mp-rear-high.jpg), confirm the colours, the lamps and what is printed; neither is
      copied here. The EX4100 datasheet (https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex4100-line-of-ethernet-switches-datasheet.pdf)
      redirects to an HPE PSNow document that did not answer, so no datasheet figure is used. No Visio
      stencil or 3D model of the EX4100-H was found. Nothing is taken from a reseller. End of life was
      searched 2026-10-23 and no Juniper notice for the EX4100-H was found, so the lifecycle is none announced.
  chassis:
    confidence: datasheet
    note: >-
      Tables 9 and 14 - height 6 in (15.24 cm), depth 5.3 in (13.40 cm), width 4.4 in (11.17 cm), weight
      5.22 lb (2.37 kg). The inch and centimetre figures of the depth disagree by 0.6 mm (5.3 in is 134.6
      mm); the centimetre figure, 134.0 mm, is used, and the width and height agree to the 0.1 mm in either
      unit. The body is the metal between the top and bottom; the footpads under it (callout 12) are not
      in the height and are not drawn.
  scale:
    confidence: measured
    note: >-
      Gate 1 - Figure 1 is 3000 px wide; the body outline is 1685 px across, 15.085 px/mm against 111.7
      mm, and 2296 px high, 15.07 px/mm against 152.4 mm: 0.1 percent apart, so the figure is orthographic
      and carries geometry. The photograph (1836 px wide, the body 1231 px across, 11.02 px/mm) agrees
      with the figure on every feature the two share to within 0.6 mm. Every position is estimated, read
      off the figure with a millimetre grid laid over it, good to about 0.3 mm.
  mounting:
    confidence: datasheet
    note: >-
      Table 7 and the mounting topics - desktop mounting, on a desk or any flat level surface inside a
      certified cabinet, is the default for the EX4100-H-12MP (the Fast Track chapter and the topic on
      the desktop orientation). The orderable kits are EX4100-H-12-DRK (DIN rail), EX4100-H-12-MMK (magnet
      pads, not for use near power substations or railway tracks), EX4100-H-12-RMK (two-post rack, screws),
      EX4100-H-12-WMK (wall) and EX4100-H-12-RM-DRK (two-post rack with a DIN rail channel); each holds
      the switch and its external supply side by side. The chassis mounts as `desktop`, the guide's default.
      The library's mount vocabulary has one value per device and no way to say that a desktop box also
      takes DIN rail, wall and rack kits, so the other four are in provenance only and are named as a
      gap. No kit contract is written.
  ports:
    confidence: photo-measured
    note: >-
      Table 9 and Figure 1 - twelve RJ-45 jacks in two blocks of two columns: ports 0 to 3 (the four 100M/1/2.5
      Gbps PoE++ MACsec ports, callout 15, in an orange frame) and ports 4 to 11 (the eight 10M/100M/1
      Gbps PoE++ ports, callout 14). Every jack is turned a quarter, the contacts toward the middle of
      the face: the left column's contacts face right (rotate 90) and the right column's face left (rotate
      270), with the lamps in the keyway corners at the outer edge as the photograph shows. The jacks
      centre on 23.85 and 38.6 mm across (a 14.75 step, not the registry's 13.97, which is a pitch between
      abutting cells and not between two shells) and the rows 14.0 mm apart down, from 49.9 to 63.9 and
      from 84.9 to 126.9. The cages are four SFP cages in one column (callouts 9 and 11), turned the same
      way, on the registry's 14.25 mm pitch from 73.15 mm down: the upper two are the uplink ports, the
      lower two the Virtual Chassis ports.
  port-numbering:
    confidence: photo-measured
    note: >-
      Figure 1 and the photograph - the left column prints a number and an arrow for each row, orange:
      0 with an arrow pointing left, 1 with an arrow pointing right, 2 left, 3 right, and on to 10 and
      11. The arrow says which jack of the row the number belongs to, so the left jack of a row is the
      even port and the right jack the odd. The cages print UPLINK 0 and 1 and VCP 0 and 1 beside their
      lamps. The numbers are as printed, from 0. Interface names are not printed on the metal; the guide's
      factory-default configuration (Table 73 and the listing under "EX4100-H Default Configuration")
      names the 2.5 Gbps ports mge-0/0/0 to mge-0/0/3, the 1 Gbps ports ge-0/0/4 to ge-0/0/11 and the
      two uplink ports xe-0/2/0 and xe-0/2/1, and is recorded here only.
  port-lamps:
    confidence: datasheet
    note: >-
      Figures 13, 15 and 17 and Table 19 - every jack and every cage has a Link Activity lamp and a Status
      lamp. The jacks carry theirs in the keyway corners. The cages' lamps are round and sit in a bordered
      box to the right of the cage column, two for each cage with the cage's number between them, 14.25
      mm apart from cage to cage. The UPLINK box is outlined and the VCP box is a light panel in the photograph.
      The Status lamp shows what the mode lamps select (Table 20), so its states cannot be one vocabulary
      here.
  status-block:
    confidence: photo-measured
    note: >-
      Figures 1, 2 and 19 and Tables 16, 18 and 20 - two columns of lamps right of the PSU connectors:
      the chassis lamps SYS, ALM, MST and CLD at 76.6 mm and the port mode lamps SPD, DX, EN and POE at
      84.8 mm, each lamp with its legend to its right, 7.0 mm apart down from 45.6. The PSU 0 and PSU
      1 lamps are at 68.4 mm above and below the first PSU connector's foot, each with its legend over
      or under it. The three dry contact alarm lamps (IN 0, IN 1 and OUT, Table 21 and 22) are at 55.9
      mm with a bell mark and the legend to their right. The lamps are round, 2.4 mm across in the figure;
      common/led-dot@1 is 2.0 and is used.
  management:
    confidence: photo-measured
    note: >-
      Figure 1 - one metal housing, 33.2 by 17.7 mm, at the top left holds the RJ-45 management port (MGMT,
      callout 16, with its two lamps), the USB 2.0 Type-A host port (callout 1) and the RJ-45 RS232 console
      port (CON, callout 2), all turned a quarter. The USB Type-C console port (callout 4, CON) stands
      upright at 69.5 mm across, with the RESET pinhole (callout 5) under it and the round Mode button
      (callout 7) under that; the legends are as printed. The claim code label (callout 6) is a sticker.
  alarm:
    confidence: datasheet
    note: >-
      Table 4 and Figure 21 - the dry contact connector is a six-pole plug on a 3.5 mm pitch, upright
      at 58.9 mm across and 103.8 to 135.9 mm down, with GND, IN 0, IN 1, NO, COM and NC printed at 45
      degrees on its left, each with a dash to its pole. The alarm input threshold is 5 V and the plug
      is preassembled (Table 65).
  power-input:
    confidence: datasheet
    note: >-
      Figure 1 callouts 3 and 8, the connection steps and Table 65 - two upright PSU connectors, PSU 0
      above PSU 1, preassembled to the switch. Each has a screw at each end and five positions: the first
      two are 54 V (+ and -), the last two 12 V (- and +), as the legends print, and the guide connects
      its interconnecting wire to four of them (red to 54 V +, black to 54 V -, brown to 12 V +, gray
      to 12 V -). One supply per connector; a 12 V-only third-party supply is supported with `set chassis
      fpc N ignore-poe-feed`. The supplies are external boxes with their own input terminals and are not
      part of the chassis (see the external-power-supplies gap).
  earthing:
    confidence: photo-measured
    note: >-
      Table 68 and Figure 98 - a two-hole protective earthing terminal on the front panel for a Panduit
      LCD6-14A-L lug on two M5 by 10 mm screws with washers (the grounding kit is JNP-GL-2H6-M5-RA, separately
      orderable). The figure shows two round threaded bosses 15.8 mm apart (the 5/8 in lug pitch) in rings
      11.2 mm across, at 100.5 mm across, under the earth symbol and above the ESD point. They are drawn
      as rings and holes; the library has no pair part for M5 holes on that pitch, so no lug seat is offered.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      The legends are drawn from the photograph and Figure 1, which agree: the model line reads EX4100-H
      in light grey and MG PoE++ in orange, the port numbers and arrows are orange, and an orange frame
      surrounds ports 0 to 3. The maker's logo and Mist AI mark above the model line are not drawn and
      are reserved as a logo-zone. The photograph adds what the figure does not draw: the yellow hazard
      labels, the lime green line along the bottom edge, the green plugs (drawn as such by the components)
      and the lime green Mode button. The figure's callouts are not printed on the metal.
  rear:
    confidence: photo-measured
    note: >-
      Juniper's rear photograph (the guide has no rear figure for the 12MP) - a full-height plate in the
      middle, 42.2 mm wide, perforated with hexagonal holes, with a screw at each end and one more at
      each of the two cross lines (six in all), and a plain plate each side with two round mounting holes.
      A small corner mark and an L mark on the left plate frame a label position. Scale 10.46 px/mm from
      the body width. The holes are the screws of the mounting kits (Figures 39 to 66 show the brackets
      bolted to the switch with M5 L8 screws). The perforation is drawn as a hexagonal pattern, as in
      the photograph.
  colour:
    confidence: photo-measured
    note: >-
      The face colour is the photograph's median of the bare front, #686f7d, which Figure 1's outline
      agrees with; the rear median is #5a606d.
  power:
    confidence: datasheet
    note: >-
      Tables 8, 9, 29 and the PoE sections - PoE++ (90 W by default) on all twelve ports. The PoE budget
      is 240 W with one supply and 360 W with two, on a 66 W system budget, 306 W and 426 W in all against
      340 W and 680 W of supply. The budgets are separate figures and the guide states no maximum input
      power for the chassis.
attrs:
  physical:
    weight: >-
      2.37 kg (5.22 lb), Table 9; the external AC supply is 2.05 kg (4.52 lb) and the DC supply 1.85 kg
      (4.07 lb), Table 15
  power:
    poe-budget-w: 240 W with one 340 W supply and 360 W with two (system budget 66 W), Table 29
    poe-standard: PoE++ (90 W by default) on all 12 ports
    power-input-ac: 100 through 240 VAC, 50/60 Hz, to the external 340 W AC supply (Table 26)
    power-input-dc: >-
      20.4 through 72 VDC at the external 340 W DC supply's terminal block, nominal +24, -48 or -60 VDC
      (Table 36)
  thermal:
    cooling: >-
      fanless, convection cooled (Table 8); at least 2 in of clearance around the switch except the mounting
      side
  environmental:
    operating-temp: >-
      -40 to 60 C in a sealed enclosure, -40 to 70 C in a ventilated enclosure (40 LFM) and -40 to 75
      C in a blower-equipped enclosure (200 LFM), up to 15000 ft; safety certified at 60 C
    storage-temp: -40 to 85 C in the shipping container
    humidity: 5 to 95 percent, noncondensing
    altitude: no performance degradation up to 15000 ft (4572 m)
  platform: {first-junos-release: 24.3R1 (Table 8)}
  features:
    virtual-chassis: >-
      up to 10 EX4100, EX4100-F and EX4100-H switches; the two VCP cages are the Virtual Chassis ports
      (HiGig or HGoE mode) and the two uplink cages support HGoE only. A 10GBASE-T transceiver cannot
      form a Virtual Chassis in a VCP
    macsec: the four 2.5 Gbps ports and the two uplink ports are MACsec capable
    dry-contact-alarm: two alarm inputs (5 V threshold) and one alarm relay output (NO, COM, NC), Table
      4
    optics-sfp-plus: >-
      the two uplink and two Virtual Chassis cages take 1 Gbps SFP and 10 Gbps SFP+ transceivers; Tables
      44 to 53 list the industrial-grade optics against the ambient they allow. The supported list is
      in Juniper's Hardware Compatibility Tool, which the guide names and which is not held here
  compliance: {seismic: tested for Zone 4 earthquake safety}
  lifecycle: {eol: none-announced}
chassis: {width: 111.7, height: 152.4, depth: 134.0, mount: desktop, weight-kg: 2.37, color: '#686f7d',
  silk: '#dfe2e6'}
gaps:
- what: external-power-supplies
  scope:
  - front
  reason: needs-drawing
  note: >-
    The EX4100-H-12MP is powered by one or two EXTERNAL supplies - JPSU-H-340W-E-AC (Table 23) and EX4100-H-12MP-DC-PSU
    (Table 33), 340 W each, with CBL-PWR-RGD-SYS as the interconnecting wire - which are separate boxes
    with their own inputs, earth terminal and lamp, mounted beside the switch on the same kit. The guide
    draws them in Figures 23, 24, 28 and 123. The library has no way to seat an external supply on a front
    connector, and the supplies are not part of the chassis, so neither is modelled.
  wanted: a separate device or a module that wires to the PSU connector
- what: mounting-kits
  scope:
  - rear
  reason: needs-drawing
  note: >-
    Table 7 lists EX4100-H-12-DRK (DIN rail), EX4100-H-12-MMK (magnet), EX4100-H-12-RMK (two-post rack),
    EX4100-H-12-WMK (wall) and EX4100-H-12-RM-DRK (rack with DIN rail channel) as orderable kits for the
    EX4100-H-12MP. The chassis is `mount: desktop`, the guide's default, and the library holds one mount
    value per device, so a box that also mounts on DIN rail, a wall or a rack has no way to say so. The
    kits are in provenance only and no kit contract is written.
  wanted: a way to list the other mounting forms of a desktop device
- what: ground-hole-seat
  scope:
  - front
  reason: needs-drawing
  note: >-
    The earthing terminal is two threaded holes for M5 screws on a 5/8 in pitch. The library has no pair
    part for M5 holes, so they are drawn as rings and holes and no lug seat is offered.
  wanted: a two-hole M5 earth terminal part
- what: port-status-lamp-states
  scope:
  - rj45-mg
  - rj45-gbe
  - vcp
  - uplink
  reason: vendor-silent
  note: >-
    The Status lamp changes meaning with the Mode button (Table 20), so the jack lamps keep the component's
    link and activity vocabulary and the mode lamps carry the meaning.
  wanted: none beyond the component's own vocabulary
- what: cld-lamp-states
  scope:
  - led-cld
  reason: vendor-silent
  note: >-
    The guide names the CLD lamp and sends the reader to the cloud-ready blink patterns, which it does
    not hold.
  wanted: the cloud-ready LED blink patterns
- what: hazard-icons
  scope:
  - front
  reason: needs-drawing
  note: >-
    The yellow label at the top of the face prints two icons, a hazard triangle with a bolt and a second
    pictogram (a cord and a hand) that the guide does not name. The first is the kit's bolt mark in a
    triangle; the second is drawn as a simplified hand over a cord, estimated from the photograph (centre
    76.4 mm across, about 4.8 mm wide, read off the 2100 px photograph at 11.02 px/mm). No kit mark fits
    it and the guide gives no figure for it, so the shape is approximate.
  wanted: the second icon's meaning and a figure of it
- what: label-plates
  scope:
  - front
  - rear
  reason: needs-drawing
  note: >-
    The claim code label (front) and the serial number label (rear) are stickers with no content in any
    figure; they are named regions and are not drawn.
  wanted: none; stickers
- what: studio-photograph-sides
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-photo
  note: >-
    The four faces that are not the front and the rear are not drawn flat by any source held; the mounting
    figures show them in perspective only.
  wanted: a flat drawing or photograph of the top, the underside and the sides
groups:
  rj45-mg:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 2.5g, poe: 802.3bt 90 W}
    description: >-
      Four PoE++ ports numbered 0 to 3 as printed, in an orange frame; the left jack of a row takes the
      even number
  rj45-gbe:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g, poe: 802.3bt 90 W}
    description: >-
      Eight PoE++ ports numbered 4 to 11 as printed; the left jack of a row takes the even number
  uplink:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: Two SFP/SFP+ MACsec uplink ports numbered 0 and 1, the upper pair of the cage column
  uplink-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: Two lamp windows for each uplink port, Link Activity and Status
  vcp:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: Two SFP/SFP+ Virtual Chassis ports numbered 0 and 1, the lower pair of the cage column
  vcp-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: Two lamp windows for each Virtual Chassis port, Link Activity and Status
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      how the switch is reached and restarted - the management Ethernet port, the USB Type-A port, the
      RJ-45 console, the USB Type-C console, the reset pinhole and the Mode button
  alarm:
    term: Terminal
    role: management
    index-origin: 0
    mixed: >-
      the dry contact alarm connector, two alarm inputs and a relay output with its three poles
  alarm-leds: {term: LED, role: indicator, index-origin: 0, description: 'the IN 0, IN 1 and OUT dry contact
      alarm lamps'}
  status-leds: {term: LED, role: indicator, index-origin: 0, description: 'the SYS, ALM, MST and CLD chassis
      lamps'}
  mode-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the SPD, DX, EN and POE port mode lamps; the lit one says what each Status lamp shows
  psu-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      the PSU 0 and PSU 1 lamps, which show whether each external supply's output is connected and good
  power-input:
    term: Connector
    role: service
    index-origin: 0
    description: the two PSU connectors, PSU 0 above PSU 1, each taking one external supply
  esd: {term: Point, role: furniture, index-origin: 0}
