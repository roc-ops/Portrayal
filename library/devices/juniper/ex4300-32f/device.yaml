configurations:
  ac:
    kind: orderable
    description: >-
      EX4300-32F as shipped - one 350 W AC power supply (AIR OUT) in slot 0 with a cover panel over slot
      1, two EX4300-FAN (AIR OUT) fan modules, and the uplink slot covered. Front-to-back airflow. EX4300-32F-TAA
      is the same hardware as a Trade Agreement Act SKU.
    default: true
    part-numbers:
      EX4300-32F: {}
      EX4300-32F-TAA: {}
  dc:
    kind: orderable
    power: dc
    description: >-
      EX4300-32F-DC - one 550 W DC power supply (AIR OUT) in slot 0 with a cover panel over slot 1, two
      EX4300-FAN (AIR OUT) fan modules, and the uplink slot covered. Front-to-back airflow. EX4300-32F-DC-TAA
      is the same hardware as a Trade Agreement Act SKU.
    bays: {psu-0: juniper/ex4300-jpsu-550-dc-afo@1}
    part-numbers:
      EX4300-32F-DC: {}
      EX4300-32F-DC-TAA: {}
  s:
    kind: orderable
    description: >-
      EX4300-32F-S - the spare chassis, shipped with no power supply and no fan module; either AC or DC
      supplies and AIR OUT or AIR IN fans are ordered separately, and the datasheet's spare-chassis matrix
      says which combinations are supported. The supply and fan bays are shown open.
    bays: {psu-0: '', psu-1: '', fan-0: '', fan-1: ''}
    part-numbers:
      EX4300-32F-S: {}
