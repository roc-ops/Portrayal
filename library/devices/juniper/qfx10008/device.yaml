configurations:
  base:
    kind: base
    default: true
    power: ac
    source: >-
      vendor - Juniper publishes this as an orderable bundle, QFX10008-BASE. The hardware guide's Table 2
      lists one RCB with one RCB/SSD cover, two fan tray controllers, two fan trays, three QFX10000-PWR-AC
      supplies with three power supply covers, five SIBs with one SIB cover, eight line card covers and a
      front door, over the note that line cards and the cable management system are not part of the base or
      redundant configurations. This base draws exactly that: one board in RCB slot 0 and a cover in slot 1,
      three supplies in slots 0 to 2 and a cover in each of the other three, and a cover in each of the
      eight line-card slots; the controllers and boards are inside and not drawn
    description: >-
      QFX10008-BASE (guide Table 2, datasheet ordering information). One QFX10000-RE with its RCB/SSD
      cover over the second slot. Three QFX10000-PWR-AC supplies, with a cover over each of the other
      three supply slots. Two QFX10008-FAN trays and eight line card covers. Two fan tray controllers
      and five QFX10008-SF boards sit inside. Line cards and cable management are ordered separately.
    bays:
      cb1: juniper/qfx10000-re-cover@1
      psu3: juniper/qfx10000-pwr-cover@1
      psu4: juniper/qfx10000-pwr-cover@1
      psu5: juniper/qfx10000-pwr-cover@1
      fpc0: juniper/qfx10000-lc-cover@1
      fpc1: juniper/qfx10000-lc-cover@1
      fpc2: juniper/qfx10000-lc-cover@1
      fpc3: juniper/qfx10000-lc-cover@1
      fpc4: juniper/qfx10000-lc-cover@1
      fpc5: juniper/qfx10000-lc-cover@1
      fpc6: juniper/qfx10000-lc-cover@1
      fpc7: juniper/qfx10000-lc-cover@1
    part-numbers:
      QFX10008-BASE: {}
  base-h:
    kind: orderable
    power: [ac, hvdc]
    description: >-
      QFX10008-BASE-H (guide Table 2, datasheet): the base with three JNP10K-PWR-AC2 supplies in place of
      the QFX10000-PWR-AC, which take AC, high-voltage AC or high-voltage DC. The same front panel and
      covers as QFX10008-BASE.
    bays:
      cb1: juniper/qfx10000-re-cover@1
      psu0: juniper/jnp10k-pwr-ac2@2
      psu1: juniper/jnp10k-pwr-ac2@2
      psu2: juniper/jnp10k-pwr-ac2@2
      psu3: juniper/qfx10000-pwr-cover@1
      psu4: juniper/qfx10000-pwr-cover@1
      psu5: juniper/qfx10000-pwr-cover@1
    part-numbers:
      QFX10008-BASE-H: {}
  redund:
    kind: orderable
    power: ac
    description: >-
      QFX10008-REDUND (guide Table 2, datasheet): two QFX10000-RE boards, six QFX10000-PWR-AC supplies, two
      QFX10008-FAN trays and eight line card covers; six QFX10008-SF boards inside.
    part-numbers:
      QFX10008-REDUND: {}
  redund-h:
    kind: orderable
    power: [ac, hvdc]
    description: >-
      QFX10008-REDUND-H (guide Table 2, datasheet): the redundant build with six JNP10K-PWR-AC2 supplies,
      which take AC, high-voltage AC or high-voltage DC. The guide's table lists two RCB/SSD covers for it
      although two RCBs are fitted; no cover is drawn.
    bays:
      psu0: juniper/jnp10k-pwr-ac2@2
      psu1: juniper/jnp10k-pwr-ac2@2
      psu2: juniper/jnp10k-pwr-ac2@2
      psu3: juniper/jnp10k-pwr-ac2@2
      psu4: juniper/jnp10k-pwr-ac2@2
      psu5: juniper/jnp10k-pwr-ac2@2
    part-numbers:
      QFX10008-REDUND-H: {}
  redund-dc:
    kind: orderable
    power: dc
    description: >-
      QFX10008-REDUND-DC (guide Table 2, datasheet): the redundant build with six QFX10000-PWR-DC supplies,
      2,500 W each, shipped only in the redundant configuration.
    bays:
      psu0: juniper/qfx10000-pwr-dc@1
      psu1: juniper/qfx10000-pwr-dc@1
      psu2: juniper/qfx10000-pwr-dc@1
      psu3: juniper/qfx10000-pwr-dc@1
      psu4: juniper/qfx10000-pwr-dc@1
      psu5: juniper/qfx10000-pwr-dc@1
    part-numbers:
      QFX10008-REDUND-DC: {}
