format: 1
kind: device
name: qfx5120-48y
version: 0.1.2
maturity: modelled
manufacturer: Juniper
model: QFX5120-48Y
portfolio: {line: QFX Series, family: QFX5120}
description: >-
  Juniper QFX5120-48Y, a 1RU data-centre leaf switch running Junos OS. It has 48 SFP28 ports (25, 10
  or 1 GbE, set a quad at a time) and 8 QSFP28 ports (100 or 40 GbE, channelizable). The 56 ports and
  their lamps are on the port side. The rear carries two power supplies, five fan modules, the
  console, two RJ-45 management ports and a USB port. It also has the reset button and the four
  chassis lamps. It ships as one front panel in four power and airflow variants: AC or DC supplies,
  front-to-back (AIR OUT) or back-to-front (AIR IN).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper QFX5120 Switch Hardware Guide, published 2026-09-30, 339 pages (copyright HPE): the
      front and rear figures 30 to 34, Table 7 (models and variants), Table 9 (physical
      specifications), the LED sections (Tables 11, 13, 18, 19, 24, 34), the airflow tables 23 and 26
      and the power tables 29 and 39. Juniper's studio photographs of the 48Y, front and rear, 2100 x
      541 and 2100 x 567 px (image library, qfx5120-48y-front-high and -rear-high). THE HPE
      DATASHEET (a00150810enw) DID NOT ANSWER, a transport error on the one attempt, so no datasheet
      figure is used; every figure here is the guide's or is read off a photograph. No mechanical
      drawing and no 3D model were found.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 9: 1.72 in (4.37 cm) high, 17.36 in (44.09 cm) wide, 20.48 in (52.02 cm) deep
      excluding the fan and power supply handles, 23.7 lb (10.75 kg) with two supplies and the fans.
      The width is the body: the table says the outer edges of the front mounting brackets extend it
      to 19 in, so the brackets are not part of the body and are not modelled. Table 9 gives the 48T,
      48Y and 48YM one set of figures.
  gate-1:
    confidence: photo-measured
    note: >-
      The front studio photograph is orthographic enough to measure: its body, between the left rim
      and the right edge, is 1888 px wide and 187 px high, an aspect of 10.04 against the table's
      440.9 / 43.7 = 10.09 (0.5 percent out, inside a pixel of edge placement). Scale 4.282 px/mm
      across, and the same down. The rear photograph reads 1880 x 186, 10.1, at 4.264 px/mm. The
      guide's own figure 30 is a half-tone thumbnail and is used only to count and to read the
      printing.
  ports:
    confidence: photo-measured
    note: >-
      Front photograph, dark cage openings along the upper row: 24 columns of 13.78 mm openings on a
      14.24 mm pitch, which is the registry's 14.25 SFP28 pitch to 0.01 mm, in three groups of
      eight with gutters of 2.5 and 2.55 mm (the openings start at 7.71, 124.24 and 240.78 mm, so
      the cells start at 7.5, 124.05 and 240.6). Then four QSFP28 openings 18.68 mm wide at 358.24,
      377.39, 396.31 and 415.46, a 19.07 mm pitch against the registry's 19.0, which is used.
      Counts are 48 and 8, the guide's callouts 1 and 2 of figure 32.
  row-pitch:
    confidence: photo-measured
    note: >-
      Down the first SFP column the two openings are 10.98 to 19.15 and 24.99 to 33.16 mm, centres
      15.07 and 29.07, 14.0 apart; down the first QSFP28 column 11.44 to 19.85 and 24.52 to 32.93,
      centres 15.65 and 28.7, 13.05 apart. THE REGISTRY'S 15.0 SFP ROW PITCH IS MEASURED ON A
      DIFFERENT CAGE and is not a conformance figure, so the photograph's 14.0 is used; the 10.4 mm
      cell fits it without overlap. The y origin of the photograph is its top edge at 151 px, so
      each y is as accurate as that edge to about 0.25 mm.
  stack-orientation:
    confidence: photo-measured
    note: >-
      The photograph shows the light latch tongues at the foot of every upper cage and at the top of
      every lower one, so both lips face the band between the rows: the upper cage upright and the
      lower one turned 180, the library's stack convention, here read off the device for the SFP
      rows. The QSFP28 pairs show the same.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed on the metal and read off the photograph: the SFP28 ports run 0 to 47 down each
      column, even above the cage and odd below it, the numeral printed on a line above the upper row
      and another below the lower row, one beside each lamp pair; the QSFP28 ports are 48 and 49
      down the first column, 50 and 51, 52 and 53, 54 and 55, printed at the left of each cage. The
      guide's figure 32 prints the same numerals. Interface names are not printed and the guide
      held does not state them; none is written here.
  port-lamps:
    confidence: drawing
    note: >-
      DRAWING AND PHOTOGRAPH DISAGREE, and the lamps are carried from the drawing. Guide figure 32
      draws a small ring either side of every SFP28 numeral and four rings along each QSFP28 cage; the
      studio photograph shows none (the lamps are unlit light pipes and do not resolve at its
      scale), and a control confirms it: the numerals the rings sit beside resolve at the same
      scale. Table 18 states two lamps for each SFP28 port, link activity and status, and Table 19
      four for each QSFP28 port, the first for the unchannelized link and the other three for
      channels. The lamp offsets from the numeral (3.0 mm either side for SFP28; 4.1 mm apart for
      QSFP28) are read off figure 32 at 6.3 px/mm and are estimated. Figure 54 captions the QSFP28
      lamps as those of the top row, while figure 32 draws them in both rows; both rows are drawn,
      following the table's four lamps per port.
  vents:
    confidence: photo-measured
    note: >-
      The photograph shows two staggered rows of round holes along the top edge (centres about 3.3 and
      5.1 mm down) and two along the bottom (about 40.1 and 41.9 mm), 3.2 mm apart along a row, which
      agrees with the guide's figure 32; drawn as two vent strips on a 3.2 by 1.85 mm pitch. The
      vertical profile through one column (holes at 3.0 to 4.7 and 39.2 to 40.9 mm) sees only one row of
      the stagger, which is why the pitch is read across the strip and not down one column.
  front-blue-bar:
    confidence: photo-measured
    note: >-
      A light-blue bar stands at the right edge, 1.8 mm wide, between 12.6 and 33.4 mm down. The
      guide's text does not name it; it is drawn as decor and recorded as a gap. The photographed unit
      is the front-to-back build.
  rear-layout:
    confidence: photo-measured
    note: >-
      Rear photograph at 4.264 px/mm, checked against the guide's figure 31 and callouts 1 to 12 of
      figure 33. At the left a 63.4 mm panel carries the four chassis lamps, the RJ-45 console jack
      with the USB port beneath it in one shield, the two stacked RJ-45 management jacks, the ESD
      point and the reset pinhole; then five fan slots numbered 0 to 4 on a 49.0 mm pitch, each
      preceded by a strip with its fan symbol, number and lamp; then the two supply slots 0 and 1,
      each preceded by a strip with its power symbol and number, and at the right edge a dark strip
      carrying a vertical rating label. The orange fan faces measure 40.8 to 41.0 mm wide and
      41.5 mm high.
  mgmt-labels:
    confidence: photo-measured
    note: >-
      The upper management jack is printed C0 above it and the lower C1 below it on this device. The
      guide's callouts say C1 for item 3 and C0 for item 9 without saying which is on top; the photograph
      settles it. The QFX5120-48YM prints them the other way up.
  rear-photo-vs-drawing:
    confidence: photo-measured
    note: >-
      The guide's figure 33 draws the fan slots with AIR IN labels (a back-to-front unit); the
      studio photograph shows AIR OUT with orange (Juniper Gold) handles. The photograph is the
      front-to-back build, which is the default configuration here. Table 7 (the fan airflow table)
      and Table 26 settle the labels: AIR OUT with Gold handles for front-to-back, AIR IN with Azure
      Blue handles for back-to-front.
  modules:
    confidence: datasheet
    note: >-
      The fan modules (QFX5110-FANAFO and -FANAFI) and the power supplies (JPSU-650W-AC-AO and -AI) are
      field-replaceable units in bays, each its own component. Nothing on this chassis is a built-in
      unit that is not a bay: the supplies' own fans are inside the supplies. The guide's Table 23 names
      the fan part numbers and Table 25 the supply part numbers.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide lists the rack mount kit JNP-4PST-RMK-1U-E (shipped with the switch; also
      sold as EX-4PST-RMK) and describes flush, recessed and two-post mounting with the brackets; the
      library holds no kit contract for it and none is written here, so `chassis.ears` and
      `chassis.kits` are left out and a gap says so. The modelled body is the 440.9 mm chassis,
      without brackets.
  power:
    confidence: datasheet
    note: >-
      Table 29 (AC supplies, QFX5120-48Y): 155 W typical, 283 W maximum, input 100 to 240 VAC at 6 A.
      Table 39 (DC supplies): 319 W typical and 342 W maximum, 10.5 A, rated -48 to 60 VDC. The two
      tables carry different figures for the same box and the guide states no ambient or scope for
      either, so both are kept and the AC pair is filed as the device's, since AC is the default build.
      The guide's maximum-power note about 3.5 W optics is printed under the 32C only.
  colour:
    confidence: photo-measured
    note: >-
      The front plate samples #8a8e97 (median of three bare patches) and the rear panel about #78787c;
      the fan strips and chassis rear read #929296. The chassis colour is the front's. The photograph is
      lit warmly and these are its values, not a paint reference.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-life announcement. No Juniper notice was found and the guide states none.
      Third-party trackers (router-switch.com, serviceexpress.com) list an announcement of 2021-01-20 and
      end of sale of 2021-10-04 for the earlier QFX5120-48Y-AFO, -AFI, -DC-AFO and -DC-AFI part numbers,
      not for the -AFO2 and -AFI2 numbers this guide lists, so the device states none announced. Estimated,
      because the trackers are not the maker.
attrs:
  physical:
    weight-note: 23.7 lb (10.75 kg) with two power supplies and five fan modules installed (Table 9)
    depth-note: 20.48 in (52.02 cm) excluding the fan and power supply handles (Table 9)
  performance:
    aggregate-throughput: 4 Tbps, bidirectional (Table 4)
    sfp28-speeds: 25, 10 or 1 GbE, set a quad at a time; the default is 10 GbE
    qsfp28-speeds: 100 or 40 GbE; channelizes to 4 x 25, 4 x 10 or 2 x 50 GbE
  power:
    power-typical-w: 155
    power-max-w: 283
    power-envelope: unstated
    power-dc-typical-w: 319
    power-dc-max-w: 342
    power-input-ac: 100 to 240 VAC, 50 to 60 Hz, 6 A
    power-input-dc: rated -48 to -60 VDC, operating range -40.8 to -72 VDC, 10.5 A
    redundancy-note: two supplies, load-sharing and fully redundant; both should be installed
  thermal:
    fans: five fan modules, 4+1; the switch runs 30 seconds without thermal shutdown while one is replaced
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F) normal operation
    storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container
    humidity: 5 to 90 percent noncondensing
    altitude: no performance degradation to 1829 m (6000 ft)
  platform:
    cpu: 2.2 GHz quad-core Intel
    memory: 16 GB
    storage: 50 GB SSD
    software: Junos OS, first release 18.3R1
  features:
    virtual-chassis: up to 2 switches; any non-channelized QSFP28 port (48 to 55) can be a virtual chassis port
    optics-sfp28: 25 GbE, 10 GbE or 1 GbE; the guide gives a restriction on 1GbE copper optics on older OEM part numbers
    optics-qsfp28: 100 GbE or 40 GbE; channelizes to 4 x 25 GbE, 4 x 10 GbE or 2 x 50 GbE (guide Table 5)
  management:
    oob: two RJ-45 management ports (C0 and C1) with link and status lamps
    console: RJ-45 console port (CON)
    usb: one USB port
  lifecycle:
    eol: none-announced
chassis: {width: 440.9, height: 43.7, depth: 520.2, ru: 1, weight-kg: 10.75, color: '#8b8f96', airflow: front-to-back, power: ac}
gaps:
- what: module-depths
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The depth of the fan module and of the power supplies. The guide's figures are isometric and carry
    no scale and its tables state weights only.
- what: front-blue-bar
  scope: [front]
  reason: vendor-silent
  wanted: >-
    What the light-blue bar at the right edge of the port side is. The guide's text and its callouts do
    not name it; the chassis ID lamp is on the rear.
- what: usb-generation
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The USB revision. The guide names one USB port and gives no generation. The port is drawn with the
    kit's neutral usb2 skin because the tongue colour follows the photograph (qfx5120-48y-rear-high.jpg),
    which shows a black tongue, not the blue of a USB 3.0 port.
- what: rating-label
  scope: [rear]
  reason: needs-photo
  wanted: >-
    The vertical rating label at the right edge of the rear (an AC input line, a DC input line and a
    line about each power supply). It is only partly legible in the photograph and is not drawn.
- what: rear-label-states
  scope: [rear]
  reason: vendor-silent
  wanted: The colour and blink pattern of the fan slot lamps beyond the guide's Table 24 (green and amber).
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
    description: Ports 48 to 55 as printed, rel-pos carrying the printed number, since the origin token cannot express a block that starts at 48.
  sfp28-activity-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: One link-activity lamp per SFP28 port, left of the numeral (guide Table 18).
  sfp28-speed-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: 25g, color: '#22c55e'}, {name: 10g-or-1g, color: '#22c55e', behavior: blinking}]
    description: One status lamp per SFP28 port, right of the numeral - steady for 25 Gbps, blinking for 10 or 1 Gbps (guide Table 18).
  qsfp28-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The first of the four lamps of each QSFP28 port - lit when the port is not channelized (guide Table 19).
  qsfp28-channel-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: link, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: beacon, color: '#f59e0b', behavior: blinking}]
    description: The second to fourth lamps of each QSFP28 port, in port then lane order - lit for the channels of a channelized port (guide Table 19).
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band cluster at the left of the rear - an RJ-45 console port, two RJ-45 management
      ports, a USB port and the recessed reset button. Four kinds, one purpose: reaching and
      recovering the switch when the data plane cannot.
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The four chassis lamps ALM, SYS, MST and ID (guide Table 11).
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '4+1'
      redundancy-note: >-
        QFX5120 hardware guide, Fan Modules for QFX5120 Switches: the 48T, 48Y and 48YM ship with five
        fan modules (4+1 redundancy) in the rear panel, slots 0 to 4 left to right; all five should be
        installed and only one removed at a time
  fan-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The round status lamp beside each fan slot - green when the module is engaged and healthy, amber blinking on an error (guide Table 24).
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: two supplies, load-sharing; one may be removed at a time while the switch runs
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD point on the rear panel (guide figure 33, callout 4)
