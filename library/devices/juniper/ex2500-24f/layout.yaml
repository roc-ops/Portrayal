configurations:
  fb:
    kind: base
    default: true
    description: >-
      EX2500-24F-FB: the 24-port switch with front-to-back airflow (guide Table 12 and Table 15).
    part-numbers:
      EX2500-24F-FB: {}
  bf:
    kind: orderable
    airflow: back-to-front
    description: >-
      EX2500-24F-BF: the same panels with back-to-front airflow, so the ports face the hot aisle (guide Table 12
      and Table 15).
    part-numbers:
      EX2500-24F-BF: {}
