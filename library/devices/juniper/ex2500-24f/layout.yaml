format: 1
kind: device
name: ex2500-24f
version: 0.1.0
maturity: modelled
manufacturer: Juniper
model: EX2500-24F
portfolio: {line: EX Series, family: EX2500}
description: >-
  Juniper EX2500-24F, a fixed 1RU 10 GbE top-of-rack switch with 24 SFP+ ports. The front carries the 24
  ports in six gangs of four, four system lamps, two management jacks, a mini-USB serial console and a
  reset button. The rear carries two AC power inlets beside a vented panel. The two supplies and six fans
  are built in, so there are no bays. One panel serves both models: the -FB moves air front to back and
  the -BF back to front.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX2500 Ethernet Switch Hardware Guide (Juniper Networks, 61 pages), read via mirror: the copy held is
      a ManualsLib reproduction of Juniper's manual, the only copy found, since Juniper no longer hosts it.
      Used: Figures 1 and 2 (the front and rear panels), Figure 3 (the lamps), Tables 4 to 11 (ports, console
      and lamps), Table 12 (envelope and weight), Table 13 (environment), Table 14 (power) and Table 15
      (part numbers). EX2500 Ethernet Switches datasheet (Juniper Networks, 1000282-001-EN, Apr 2009, 4
      pages): the cover photograph, the specifications and the ordering information. No studio photograph,
      stencil or 3D model of the EX2500 is held. Terms: both documents are Juniper's and are read for
      facts only; nothing of either is copied into the library.
  gate-1:
    confidence: drawing
    note: >-
      Figures 1 and 2 are vector line drawings and were rendered at 600 dpi and measured with a pixel ruler.
      The front figure's body is 3607 px across and 295 px down: 0.1217 mm per px across from the 439 mm of
      Table 12 and 0.1492 down from its 44.0 mm. The drawing is not at one scale, 22 percent tighter down than
      across, and the check is the cage opening: it reads 10.4 mm down on that scale, the registry's 10.4,
      on a quantity the scale never saw. The rear figure is 3622 px across and 341 px down: 0.1212 across
      and 0.1287 down, a 7 percent aspect error. Every position read off a figure is estimated, to about
      a millimetre across and 1.5 mm down. The mirror's raster is the figure as printed, so a dimension it
      could not give was not read from it.
  chassis:
    confidence: datasheet
    note: >-
      Table 12: 4.4 x 43.9 x 38.1 cm (1.73 x 17.3 x 15.0 in), 6.4 kg (14.1 lb), the same for the -FB and the
      -BF. THE DATASHEET DISAGREES on the weight: it gives 14.9 lb (6.8 kg), and 1.7 x 17.3 x 15 in. The
      guide's figures are used because Table 12 gives them per model; the datasheet's weight is kept in
      attrs. 1RU. The width is the body: the drawings show no mounting brackets.
  ports:
    confidence: drawing
    note: >-
      Figure 1: 24 SFP+ ports in one row, printed 1 to 24, in six gangs of four. The cage frames start 62.8 mm
      apart from 16.9 mm in; within a gang the frames are 14.76 mm apart, 3.6 percent over the registry's
      14.25 mm pitch, so the drawn pitch is used with the gutter between gangs at 62.8 - 4 x 14.76 = 3.76 mm.
      The cage opening is 10.4 mm high and its top is 25.6 mm down. The numerals stand under each cage,
      their centres 40.1 mm down. The guide says the ports take approved SFP+ transceivers and direct access
      cables, and the datasheet says each runs at 1 GbE or 10 GbE.
  port-lamps:
    confidence: drawing
    note: >-
      Figure 1 and Figure 3: two round lamps over each cage, centred on it and 6.1 mm apart, 20.7 mm down. The
      leader lines of Figure 3 put L/A on the left lamp and SP on the right. Table 10: L/A is solid green with
      a link and no activity, blinking green with activity, and off with no link; SP is solid green at 10 Gbps
      and off at 1 Gbps.
  chassis-lamps:
    confidence: drawing
    note: >-
      Figure 3 and Table 8: four round lamps in a column at the left, SYS, FAN, ST-A and ST-B, 10.4 mm from
      the left edge and 16.8, 21.9, 26.9 and 32.1 mm down. Table 9: SYS is solid green with both supplies
      good and blinking green with one failed or one cord connected; FAN is solid green with the fans good
      and blinking with a failure. ST-A is a status lamp whose meaning the guide does not give, and ST-B is
      reserved for future use.
  management:
    confidence: drawing
    note: >-
      Figure 1: two RJ-45 jacks stacked in one frame at the right, B above A, 424.1 mm across and 14.8 and
      29.0 mm down, with their letters at 436 mm. Table 11 gives their lamps: link (solid green with a link,
      blinking with activity) and speed (solid green at 100 or 1000 Mbps, off at 10). Below them are the
      mini-USB console CON, centred at 396 mm and 33.2 mm down, and the RESET button, centred at 408.9 mm
      and 32.9 mm down. The guide: "1 RS-232 console port (mini-USB)", and an external cable converts it to
      D9. The datasheet's list says "RS-232 DB9 console port", which the guide corrects for the unit.
  vents:
    confidence: drawing
    note: >-
      Figure 1: a hexagonal vent field over the whole width of the face from 1.9 to 17.5 mm down, a smaller
      one at the right of port 24 above the console, and in the figure the lamps and the maker's logo sit
      in it at the left. Figure 2: a vented panel between the two inlets, 51.5 to 386.7 mm across, its
      hexagon field from 67.6 to 370.6 mm, with two cross-head screws at its right end. The panel is where the
      six fans exhaust or draw in. The fans themselves are not drawn: no figure shows a fan face.
  rear-layout:
    confidence: drawing
    note: >-
      Figure 2: an inlet at each end, centred 24.0 and 414.9 mm across and 20.5 mm down, each drawn
      portrait, 22 mm across by 35 mm high with its three pins stacked, so it is the library's C14 inlet turned a
      quarter. Guide, Power Supplies: two internal 275 W supplies, each with its own IEC 320 inlet on the
      rear and no power switch. The supplies are internal and the guide gives no part number for them.
  fans:
    confidence: datasheet
    note: >-
      Guide, Fans: six internal fans, and fans are not customer replaceable. The datasheet says redundant,
      variable-speed. They are not field-replaceable units, so there is no bay, and the guide gives no
      part number or face for them.
  airflow:
    confidence: datasheet
    note: >-
      Table 12 and the datasheet: the EX2500-24F-FB moves air front to back and the EX2500-24F-BF back to front;
      the datasheet's Figure 1 draws both. One panel serves both, so each model is a configuration.
  colour:
    confidence: estimated
    note: >-
      The figures are line drawings. The body is a near black read from the datasheet's cover photograph, a
      perspective view of the front right corner, with silver cages and white printing. A photograph that
      is not in perspective would settle the shade.
  power:
    confidence: datasheet
    note: >-
      Table 14: two supplies, 1+1 redundant, 275 W each, 100 to 240 VAC universal, 50 to 60 Hz, 2.75 A at 100 VAC
      and 1.15 A at 240 VAC, system dissipation 200 W typical. The datasheet gives 192 W average at full line
      rate. Table 13: 1100 BTU an hour maximum.
  environment:
    confidence: datasheet
    note: >-
      Table 13: operating 0 to +40 C, 0 to +35 C with a fan or supply failed, storage -20 to +70 C, 10 to 90
      percent humidity operating, altitude 3,050 m operating, under 65 dB. THE DATASHEET DISAGREES on the
      operating minimum: it gives -10 C (14 F). The guide's range is used.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. Tables 16 and 17 and Figures 4 to 9 describe a standard two-post kit and a four-post kit,
      and Table 15 and the datasheet order the generic four-post kit as EX2500-RMK-4POST. The drawings of the
      panels show no ear, so no ear position is stated, and no kit is listed in chassis.kits.
  ordering-codes:
    confidence: datasheet
    note: >-
      Table 15 prints EX2500-24F-FB and EX2500-24F-BF. The datasheet's ordering table prints the first as
      EX2500-2F-FB, which is read as a misprint of the guide's code.
  lifecycle:
    confidence: estimated
    note: >-
      The product is end of life and Juniper no longer hosts its documents. No end-of-life notice is held,
      so no lifecycle is written.
attrs:
  physical:
    weight-note: 6.4 kg (14.1 lb) in the guide's Table 12; 14.9 lb (6.8 kg) in the datasheet
    depth-note: 38.1 cm (15.0 in) (Table 12)
  performance:
    throughput: 480 Gbps full duplex, non-blocking on all ports (datasheet)
    latency: about 700 ns (datasheet)
    vlans-max: 1024
    sfp-plus-speeds: 10 GbE or 1 GbE on each SFP+ port (datasheet)
  power:
    power-typical-w: 200
    power-envelope: unstated
    power-input-ac: 100 to 240 VAC, 50 to 60 Hz
    power-current-max: 2.75 A at 100 VAC; 1.15 A at 240 VAC
    redundancy-note: two internal 275 W supplies in 1+1, load sharing at about half load each
  thermal:
    thermal-output-btu-h: 1100
    cooling: six internal fans, not customer replaceable; front-to-back in the -FB and back-to-front in the -BF
  environmental:
    operating-temp: 0 to +40 C, +35 C maximum with a fan or supply failed
    storage-temp: -20 to +70 C
    humidity: 10 to 90 percent noncondensing operating, 10 to 95 percent storage
    altitude: 3,050 m operating, 4,573 m storage
    acoustic-noise: under 65 dB
  features:
    optics-sfp-plus: SFP+ 10GBASE-SR and 10GBASE-LR transceivers and 1 m and 3 m direct access cables
  management:
    oob: two 10/100/1000BASE-T RJ-45 management ports
    console: one RS-232 serial console port, a mini-USB connector with an external cable to D9
  compliance:
    emc: FCC Part 15 Class A, EN 55022 Class A, VCCI Class A, ICES-003, AS/NZS CISPR 22 Class A
chassis: {width: 439.0, height: 43.9, depth: 381.0, ru: 1, weight-kg: 6.4, color: '#232528', airflow: front-to-back, power: ac}
gaps:
- what: rack-ears-and-kits
  scope: [front]
  reason: needs-drawing
  wanted: >-
    The dimensions and positions of the two-post and four-post kits. Tables 16 and 17 and Figures 4 to 9 list
    and draw the parts, and the panel figures show no ear.
- what: photographs
  scope: [front, rear]
  reason: needs-photo
  wanted: >-
    A straight-on studio photograph of each side. The only photograph is the datasheet's cover picture, a
    perspective view of the front right corner, so every position is read from the figures.
- what: supplies-and-fans
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The part numbers and faces of the two internal supplies and the six fans. The guide names them by role
    only and says they are built in.
- what: console-cable
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The part number of the mini-USB to D9 console cable. The guide gives its wiring in Table 7 and no code.
- what: lamp-st-a
  scope: [front]
  reason: vendor-silent
  wanted: What the ST-A lamp shows. Table 8 calls it a status LED and gives no states.
- what: mgmt-lamps
  scope: [front]
  reason: needs-photo
  wanted: >-
    The position of the two management jacks' own lamps. The figure draws small squares at the jack corners,
    and the photograph shows a green one at the lower left of jack A.
- what: rear-earth-mark
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    The earth symbol at the left of the rear panel in Figure 2 is not placed: the guide names no terminal and
    no hardware is drawn.
- what: four-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: A flat drawing or photograph of the lid, the underside and the side panels.
groups:
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: The 24 SFP+ ports as printed, 1 to 24, each taking a 10 GbE SFP+ or direct access cable, or a 1 GbE optic
  sfp-plus-activity-leds:
    term: LED
    role: indicator
    index-origin: 1
    states: ['off', {name: link, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}]
    description: The L/A lamp of each SFP+ port, the left of the pair over the cage (Table 10)
  sfp-plus-speed-leds:
    term: LED
    role: indicator
    index-origin: 1
    states: ['off', {name: 10g, color: '#22c55e'}]
    description: The SP lamp of each SFP+ port, the right of the pair over the cage; lit at 10 Gbps, off at 1 Gbps (Table 10)
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the management cluster at the right of the front: two RJ-45 management ports, A and B, and a mini-USB
      serial console. Two kinds, one purpose: reaching the switch when the data ports cannot.
  controls:
    term: Button
    role: management
    index-origin: 0
    description: the recessed RESET button
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The four system lamps SYS, FAN, ST-A and ST-B (Table 8)
  power-input:
    term: Inlet
    role: service
    index-origin: 0
    description: The two IEC 320 inlets, one for each internal supply
  furniture:
    term: Item
    role: furniture
    index-origin: 0
    description: screws on the rear panel
