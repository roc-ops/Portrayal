configurations:
  fb:
    kind: orderable
    default: true
    description: >-
      EX4500-40F-FB: one AC supply with a green lever and a front-to-back fan tray with the green EXHAUST
      label. It has a cover panel in the second supply slot, two uplink module cover panels and the intraconnect
      module (guide Table 3).
    part-numbers:
      EX4500-40F-FB: {}
  bf:
    kind: orderable
    airflow: back-to-front
    description: >-
      EX4500-40F-BF: one AC supply with an orange lever and a back-to-front fan tray with the orange INTAKE
      label. The rest is as the -FB.
    bays: {psu-0: juniper/ex4500-psu-ac-bf@1, fan-tray: juniper/ex4500-fan-tray-bf@1}
    part-numbers:
      EX4500-40F-BF: {}
  fb-c:
    kind: orderable
    description: >-
      EX4500-40F-FB-C: the -FB with hardware that supports Data Center Bridging. The panels are the same.
    part-numbers:
      EX4500-40F-FB-C: {}
  bf-c:
    kind: orderable
    airflow: back-to-front
    description: >-
      EX4500-40F-BF-C: the -BF with hardware that supports Data Center Bridging. The panels are the same.
    bays: {psu-0: juniper/ex4500-psu-ac-bf@1, fan-tray: juniper/ex4500-fan-tray-bf@1}
    part-numbers:
      EX4500-40F-BF-C: {}
  dc-c:
    kind: orderable
    power: dc
    description: >-
      EX4500-40F-DC-C: one DC supply with a green lever and a front-to-back fan tray, with Data Center
      Bridging. The guide lists no back-to-front DC supply.
    bays: {psu-0: juniper/ex4500-psu-dc-fb@1}
    part-numbers:
      EX4500-40F-DC-C: {}
  vc1-fb:
    kind: orderable
    description: >-
      EX4500-40F-VC1-FB: the -FB-C with a Virtual Chassis module in the rear slot instead of the intraconnect
      module. The front panel prints VIRTUAL CHASSIS.
    bays: {module-3: juniper/ex4500-vc1@1}
    part-numbers:
      EX4500-40F-VC1-FB: {}
  vc1-bf:
    kind: orderable
    airflow: back-to-front
    description: >-
      EX4500-40F-VC1-BF: the -BF-C with a Virtual Chassis module in the rear slot. The front panel prints
      VIRTUAL CHASSIS.
    bays: {psu-0: juniper/ex4500-psu-ac-bf@1, fan-tray: juniper/ex4500-fan-tray-bf@1, module-3: juniper/ex4500-vc1@1}
    part-numbers:
      EX4500-40F-VC1-BF: {}
  vc1-dc:
    kind: orderable
    power: dc
    description: >-
      EX4500-40F-VC1-DC: the -DC-C with a Virtual Chassis module in the rear slot. The front panel prints
      VIRTUAL CHASSIS.
    bays: {psu-0: juniper/ex4500-psu-dc-fb@1, module-3: juniper/ex4500-vc1@1}
    part-numbers:
      EX4500-40F-VC1-DC: {}
  two-psu:
    kind: example
    description: >-
      The EX4500-40F-FB with a second AC supply in slot 1, as the guide allows. An illustration, not an
      order code.
    bays: {psu-1: juniper/ex4500-psu-ac-fb@1}
