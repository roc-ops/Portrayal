configurations:
  ac-afo:
    kind: orderable
    default: true
    description: >-
      QFX5200-48Y: two 650 W AC supplies (QFX520048Y-APSU-AO) and six front-to-back fan modules (QFX520048Y-FAN-AO).
      All carry the guide's red colour for airflow out (Tables 17 and 19). The guide names no chassis part number for the other
      builds, so they are examples.
    part-numbers:
      QFX5200-48Y: {}
  ac-afi:
    kind: example
    airflow: back-to-front
    description: >-
      Two 650 W AC supplies (QFX520048Y-APSU-AI) and six back-to-front fan modules (QFX520048Y-FAN-AI), blue for airflow in (guide
      Tables 17 and 19). The guide names these modules but no chassis part number for the build.
    bays:
      psu-0: juniper/qfx5200-48y-apsu-ai@1
      psu-1: juniper/qfx5200-48y-apsu-ai@1
      fan-0: juniper/qfx5200-48y-fan-afi@1
      fan-1: juniper/qfx5200-48y-fan-afi@1
      fan-2: juniper/qfx5200-48y-fan-afi@1
      fan-3: juniper/qfx5200-48y-fan-afi@1
      fan-4: juniper/qfx5200-48y-fan-afi@1
      fan-5: juniper/qfx5200-48y-fan-afi@1
  dc-afo:
    kind: example
    power: dc
    description: >-
      Two 650 W DC supplies (QFX520048Y-DPSU-AO) and six front-to-back fan modules (QFX520048Y-FAN-AO). The guide names these
      modules but no chassis part number for the build. AC and DC supplies of one airflow may be mixed in the 48Y.
    bays:
      psu-0: juniper/qfx5200-48y-dpsu-ao@1
      psu-1: juniper/qfx5200-48y-dpsu-ao@1
  dc-afi:
    kind: example
    power: dc
    airflow: back-to-front
    description: >-
      Two 650 W DC supplies (QFX520048Y-DPSU-AI) and six back-to-front fan modules (QFX520048Y-FAN-AI). The guide names these
      modules but no chassis part number for the build.
    bays:
      psu-0: juniper/qfx5200-48y-dpsu-ai@1
      psu-1: juniper/qfx5200-48y-dpsu-ai@1
      fan-0: juniper/qfx5200-48y-fan-afi@1
      fan-1: juniper/qfx5200-48y-fan-afi@1
      fan-2: juniper/qfx5200-48y-fan-afi@1
