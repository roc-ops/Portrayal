format: 1
kind: device
name: qfx5200-48y
version: 0.1.1
maturity: modelled
manufacturer: Juniper
model: QFX5200-48Y
portfolio: {line: QFX Series, family: QFX5200}
description: >-
  Juniper QFX5200-48Y, a 1RU data-centre leaf switch running Junos OS. It has 48 SFP28 ports (10 GbE by
  default, 25 GbE in groups of four) numbered 0 to 47, and six QSFP28 ports (100 or 40 GbE) numbered 48 to 53.
  The port side also carries the RJ45 management port and console, a USB port, the reset button and the five
  chassis status lamps. The FRU side carries six fan modules between two power supplies. It ships as one
  front panel with AC or DC supplies, front-to-back (AIR OUT) or back-to-front (AIR IN).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper QFX5200 Switch Hardware Guide, published 2026-03-09, 236 pages (copyright 2026 Juniper
      Networks): the port panel figures 13, 16, 17, 18 and 21, the management and status figures 22 and 24, the FRU
      panel figure 26, the fan and power supply figures 28, 35, 38 and 40 to 44, the specification tables 3, 8 to 10,
      13, 14, 16, 17, 19, 20, 24, 25, 30 and 31 and the mounting chapter. Juniper's studio photographs of the 48Y,
      front and rear, 2100 x 464 and 2100 x 424 px (image library, qfx5200-48y-front-high and -rear-high). THE HPE
      DATASHEET (a00150814enw) DID NOT ANSWER, a transport error on the one attempt, so no datasheet figure is used.
      No mechanical drawing and no 3D model were found. The held intake folders (SOURCES.md, COVERAGE.md) are on
      another machine and could not be read from this one, so no held photograph, stencil or model was available to
      use.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 31: 1.71 in (4.34 cm) high, 17.25 in (43.81 cm) wide, 20.27 in (51.48 cm) deep, 30.00 lb
      (13.60 kg). The inch figures are converted (43.43, 438.15 and 514.86 mm). The width is the body between
      the ear folds; the guide says the outer edges of the brackets make 19 in, so the brackets are not
      modelled. THE WEIGHT CONFLICTS with the installation safety text, which says the 48Y weighs 20.78 to
      21.16 lb (9.43 to 9.6 kg) with the power supplies and fans installed; Table 31 is used and the conflict is
      a gap. The 32C's two sources agree at 23.5 lb.
  gate-1:
    confidence: photo-measured
    note: >-
      Figure 16 (a 3000 x 868 px raster of the port side) is orthographic enough to measure: its outline
      measures 2853 px between stroke centres (x 23.5 to 2876.5) and 282 px (y 288.5 to 570.5), an aspect of 10.12
      against the table's 438.15 / 43.43 = 10.09, at 6.51 px/mm. The studio photograph agrees (body 62 to 2018 px,
      4.467 px/mm, 43 mm high). The rear figure 26 (1501 x 319 px) reads 1426.5 x 142 px, 10.05, at 3.256 px/mm, and
      the rear photograph 1948 x 192 px, 10.1, at 4.446 px/mm.
  ports:
    confidence: drawing
    note: >-
      Figure 16, 48 SFP28 cages in two rows of 24 columns, in three gangs of eight columns on the registry's 14.25
      mm pitch (a gang measures 742 px, 114.0 mm), 3.1 mm apart; the first gang starts 14.7 mm from the left and the
      QSFP28 block 365.2 mm. The rows are 14.6 mm apart (cells from 2.6 and 17.2 mm down); the photograph's cage
      openings are about 8 mm high with a metal lamp tray 8.6 mm tall between them, narrower than the registry's 10.4
      mm cell, so THE CELLS ARE THE REGISTRY'S AND THE OPENINGS ARE ESTIMATED. The six QSFP28 cages are two columns
      on the registry's 19.0 pitch in THREE rows: a stacked pair with a lamp band between them (centres 7.5 and 23.6
      mm down, ports 48 and 49 on the left, 51 and 52 on the right) and a single cage below each (36.5 mm, ports 50
      and 53), which figure 16 shows as callouts 2 (four cages) and 5 (two cages).
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention: an upper cage upright over a lower one turned 180, so both lips face the band
      between the rows. The photograph's cages are too dark to confirm it at the SFP28 rows, so the rule decides
      and a photograph overturns it. The single QSFP28 cages in the third row are upright.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed on the metal and read off the photograph and figure 16: the SFP28 ports run 0 to 47, even above odd, as
      "0 up-arrow, down-arrow 1" legends under each column (the arrows point at the lamps between the rows); the
      QSFP28 ports print 48 and 49, 51 and 52 under the stacked pairs and 50 and 53 in lane-legend boxes at the lower right.
      Interface names are not printed and are not written. The 12 port groups of four SFP28 ports (Table 8) are
      not printed.
  port-lamps:
    confidence: drawing
    note: >-
      One lamp a SFP28 port, an up arrow for the even port and a down arrow for the odd one, between the rows
      (figure 18, Table 10: amber steady for link, amber blinking for activity). THE FIRST THREE COLUMNS ARE
      DIFFERENT: the photograph prints PS0, PS1, Diag, Fan and Loc under their lamps, and guide Table 16 lists five
      chassis status LEDs on the port side, so those five are drawn as the chassis lamps and the sixth (under port
      5) as port 5's lamp, which the guide does not name. Each QSFP28 column has a band of four lamps (arrow,
      two rings, arrow); the guide says only that the QSFP28 ports have four blue and amber lamps, that only the first
      is used, and that the arrow lamps of 48, 49, 51 and 52 are not used. The mapping of the rings to ports and the
      two lamps in each lower cage are READ OFF THE PHOTOGRAPH AND ESTIMATED.
  chassis-lamps:
    confidence: datasheet
    note: >-
      Table 16: PS1 and PS2 (green working, amber faulty, unlit absent), Diag (always green), FAN (green normal,
      amber faulty, unlit powered off) and LOC (amber flashing on a remote command). The photograph prints them as
      PS0 and PS1, Diag, Fan and Loc, so those legends are drawn.
  vents:
    confidence: photo-measured
    note: >-
      Hexagonal perforations: a column at the left end (3 to 36 mm down), a band along the foot (37.6 to 42.6 mm,
      interrupted by the USB port and the QSFP28 cages) and a column at the right end. A dark label plate runs under
      the SFP28 block. Positions are read at 4.467 px/mm and are estimated.
  mgmt-panel:
    confidence: photo-measured
    note: >-
      At the right, in a silver housing: the RJ45 management port above (Mgmt) and the RJ45 console below (Console),
      with the legend "Mgmt up-arrow, down-arrow Console" and "RUNNING JUNOS" under them; the guide's callouts 3 and 4
      do not say which is which and the photograph's legend settles it. They are 12.7 mm cells, 14.0 apart, mirrored
      (the upper has its contacts at the foot). The USB port is under the SFP28 block at 326.9 mm (figure 16,
      callout 6) and the reset pinhole at 51.7 mm with its legend (callout 7 is the lamp row).
  rear-layout:
    confidence: photo-measured
    note: >-
      Rear photograph at 4.446 px/mm and figure 26 at 3.256 px/mm: a power supply at each end (frame 50.4 mm wide, its
      red latch overhanging the frame by 3.9 mm on the left), six fan modules between them on a 48.6 mm pitch (face
      39.9 mm wide from 77.6 mm, with an 8.3 mm flange carrying the captive screw to its left), and a ground screw at each
      end of the panel. The photograph and the figure agree to 1 mm everywhere both can be measured except the
      latch (the photograph magnifies the proud latch). The panel carries no connectors and no lamps: the 48Y has no
      fan lamps (guide) and its power supplies carry their own.
  rear-photo-vs-drawing:
    confidence: photo-measured
    note: >-
      The photograph shows front-to-back (AIR OUT) fan modules with red handles lettered F2B. Table 17 gives the label
      as AIR OUT; the photograph wins for that module. The guide's flat figure 26 draws the modules without labels.
  modules:
    confidence: datasheet
    note: >-
      The fan modules (QFX520048Y-FAN-AO and -AI) and the power supplies (QFX520048Y-APSU-AO and -AI) are
      field-replaceable units in bays, each its own component of this family. The 48Y's supplies are NOT the
      JPSU-650W-AC-AO and -AI of the QFX5120: different part number, one lamp and not three, a different face
      (guide figures 35 and 38 against the QFX5120's). Nothing on this chassis is a built-in unit that is not a bay.
  ears-and-kits:
    confidence: datasheet
    note: >-
      The guide mounts the 48Y flush with the front of a four-post 19 in rack with the standard brackets (recessed
      mounting is named for the 32C only). One flush position is written, with no kit. The rack mount kit is NOT
      MODELLED and is not in `chassis.kits`: QFX520048Y-RMKT (front mounting brackets, rear mounting brackets,
      flat-head M4 x 6 mm and washer-head screws), also the spare's order number. Rack rail spacing 23.5 to 30.6 in.
  power:
    confidence: datasheet
    note: >-
      Table 20 (AC): 382 W typical and 430 W maximum, input 100 to 240 VAC at 7.8 A (100 to 120 V) or 3.8 A (200 to 240
      V). Table 25 (DC): 315 W typical and 470 W maximum, -48 to -60 VDC rated, 21 A. The AC pair is filed as the
      device's, since AC is the default build.
  colour:
    confidence: photo-measured
    note: >-
      The front plate samples #696769 on the top-left corner and #6d6c6f at the right end; the chassis colour is
      #6b6d71. The rear panel samples #666465. The photographs are lit warmly and these are their values, not a
      paint reference.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-life announcement. No Juniper notice was found and the guide states none, so the
      device states none announced. Estimated, because no maker page was searched beyond the guide.
attrs:
  physical:
    weight-note: 30.00 lb (13.60 kg) in Table 31; the installation safety text says 20.78 to 21.16 lb (9.43 to 9.6 kg) with supplies and fans
  performance:
    aggregate-throughput: '3.6 Tbps, full duplex (guide)'
    sfp28-speeds: '10 GbE by default; 25 GbE in groups of four ports (12 groups)'
    qsfp28-speeds: '100 or 40 GbE, auto-detected from the optic; channelizes to 4 x 10 GbE at 40 GbE'
  power:
    power-typical-w: 382
    power-max-w: 430
    power-envelope: unstated
    power-dc-typical-w: 315
    power-dc-max-w: 470
    power-input-ac: 100 to 240 VAC, 50 to 60 Hz, 7.8 A at 100 to 120 VAC or 3.8 A at 200 to 240 VAC
    power-input-dc: rated -48 to -60 VDC, 21 A (25 A to 11 A across -36 to -72 VDC)
    redundancy-note: two supplies, load-sharing; AC and DC of one airflow may be mixed in the 48Y
  thermal:
    fans: six fan modules; the switch runs 30 seconds without thermal shutdown while one is replaced
  environmental:
    operating-temp: 0 to 45 C for airflow-out models, 0 to 40 C for airflow-in models
    storage-temp: -40 to 70 C in the shipping container
    humidity: 5 to 93 percent noncondensing for airflow out, 10 to 93 percent for airflow in
    altitude: no performance degradation to 3962 m (13000 ft)
  platform:
    cpu: 2.2 GHz quad-core Intel
    memory: 16 GB
    storage: 32 GB SSD
    software: 'Junos OS, first release 18.1R1'
  features:
    virtual-chassis: not supported (standalone only)
    optics-sfp28: 25 GbE SFP28 and 10 GbE SFP+ transceivers and DAC cables; 25 GbE AOC on the QSFP28 side
    optics-qsfp28: 100 GbE QSFP28, 40 GbE QSFP+, AOC and DACBO (40 GbE to 4 x 10 GbE)
  management:
    oob: one RJ-45 management port (Mgmt, 10/100/1000 BASE-T)
    console: RJ-45 console port
    usb: one USB port
  compliance:
    seismic: Designed to comply with Zone 4 earthquake requirements per NEBS GR-63-CORE, Issue 3 (Table 30 wording)
  lifecycle: {eol: none-announced}
chassis: {width: 438.1, height: 43.4, depth: 514.9, ru: 1, weight-kg: 13.6, color: '#6b6d71', airflow: front-to-back,
  power: ac, ears: {positions: [{name: flush, at: 0, default: true}]}}
gaps:
- what: weight
  scope: [weight-note]
  reason: sources-disagree
  wanted: >-
    The 48Y's weight. Table 31 gives 30.00 lb (13.60 kg); the installation safety text gives 20.78 to 21.16 lb
    (9.43 to 9.6 kg) with the power supplies and fans installed. Same measure and scope as far as either says, so
    it is a conflict; Table 31's figure is used.
- what: chassis-lamp-5
  scope: [front]
  reason: vendor-silent
  wanted: >-
    What the lamp under the unlabelled sixth position (port 5's down arrow) is. The photograph prints PS0, PS1, Diag,
    Fan and Loc under five lamps and nothing under the sixth; it is drawn as port 5's lamp.
- what: qsfp28-lamp-mapping
  scope: [front]
  reason: vendor-silent
  wanted: >-
    Which port each of the four lamps in a QSFP28 column band, and the two lamps in each lower cage, belongs to. The
    guide says four blue and amber lamps a port and that only the first is used.
- what: lane-legend-boxes
  scope: [front]
  reason: needs-photo
  wanted: >-
    The coloured boxes and brackets of the lane legends under SFP28 ports 16 to 39 and the 50 and 53 boxes under ports
    46 and 47; only their numerals are drawn, and the guide does not say what they mean.
- what: usb-generation
  scope: [front]
  reason: vendor-silent
  wanted: The USB revision. The guide names one USB port and gives no generation.
- what: module-depths
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The depth of the fan module and of the power supplies. The guide's figures are isometric and carry no scale and its
    tables state weights only.
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
    description: Ports 48 to 53 as printed, rel-pos carrying the printed number, since the origin token cannot express a block that starts at 48.
  sfp28-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: link, color: '#f59e0b'}, {name: activity, color: '#f59e0b', behavior: blinking}]
    description: One lamp per SFP28 port, between the rows - amber steady for a link at 10 or 25 Gbps, amber blinking for activity (guide Table 10).
  qsfp28-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: link, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}]
    description: The first lamp of each QSFP28 port - green steady for a link at 40 or 100 Gbps, blinking for activity (guide Table 10); the arrow lamps of 48, 49, 51 and 52 are not used.
  qsfp28-channel-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: link, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}]
    description: The other lamps of a QSFP28 port; the guide says only the first is used (Table 9).
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The five chassis lamps PS0, PS1, Diag, Fan and Loc (guide Table 16).
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band cluster at the right of the port side - an RJ-45 management port, an RJ-45 console port, a USB port and
      the recessed reset button. Four kinds, one purpose: reaching and recovering the switch when the data plane cannot.
  fans:
    term: Fan
    role: service
    index-origin: 0
    description: >-
      QFX5200 hardware guide, Component Redundancy: the 48Y has six fan modules in the FRU panel, slots 0 to 5 left to right;
      all must be installed for optimal operation. The guide states no spare-fan form (N+1) for them.
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: two supplies, load-sharing; one may be removed at a time while the switch runs
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the protective earthing screws at the two ends of the FRU panel (guide, Connect the QFX5200 to Earth Ground)
