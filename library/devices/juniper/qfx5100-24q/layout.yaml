format: 1
kind: device
name: qfx5100-24q
version: 0.1.1
maturity: modelled
manufacturer: Juniper
model: QFX5100-24Q
portfolio: {line: QFX Series, family: QFX5100}
description: >-
  Juniper QFX5100-24Q, a 1RU data-centre switch running Junos OS. It has 24 QSFP+ ports. Each runs at 40
  GbE or as four 10 GbE ports with a breakout cable. Two expansion module bays stand at the right of the
  port panel. The bays hold a QFX-EM-4Q, an EX4600-EM-8F or a cover panel. The rear carries two power
  supplies, five fan modules, the console, the management ports, a USB port, the reset button and the
  four chassis lamps. One front panel ships in eight variants. They have AC or DC supplies, airflow
  front-to-back (AIR OUT) or back-to-front (AIR IN), and two or three management ports.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper QFX5100 Switch Hardware Guide, published 2023-02-26, 254 pages (Juniper Networks; terms: the
      guide's own copyright notice and the Juniper EULA, a reference copy kept outside the repository): Table
      1 (models), Table 3 (physical specifications), Figure 5 and Figures 6 and 7 (the switch and its two
      expansion modules), Figure 11 and Table 4 (the port panel and its lamps), Figures 22 and 24 and 25
      (management panel and lamps), Tables 12 to 14 and 17 (lamps, AC and DC supplies), Tables 19 to 21 (fan
      modules). QFX5100 Ethernet Switch Datasheet, 1000480-022-EN, July 2024: the ordering table (variants,
      the expansion modules and the blank), weight, dimensions, power and the interface options. Juniper's
      studio photographs of the QFX5100-24Q, front and rear, 1500 x 251 and 1500 x 215 px (image library,
      qfx5100-24q-front-high and qfx5100-24q-rear-high), taken with a QFX-EM-4Q in each bay and the
      back-to-front build. The held intake folders for the Juniper EX, QFX and MX lines were searched
      (COVERAGE.md, SOURCES.md and INVENTORY.md of exqfx and mx, and the Visio and photo folders): none
      holds a Visio stencil or 3D model of a QFX5100, so every position is read off the photographs and
      the guide's flat figures. The guide's pictures are thumbnails and no drawing is copied.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 3: 1.72 in (4.3 cm) high, 17.36 in (44.1 cm) wide, 20.48 in (52 cm) deep, 22 lb (9.97
      kg) with FRUs installed. The datasheet gives 4.37 x 44.09 x 52.02 cm, the same size, and 21.6 lb
      (9.8 kg). The two weights disagree by 0.4 lb and the guide's is carried. The width is the body: the
      mounting brackets are not part of it and are not modelled.
  gate-1:
    confidence: estimated
    note: >-
      The front studio photograph is orthographic enough to measure. Its body runs from column 21 to 1465,
      1445 px, and from row 41 to 184.5, 143.5 px, an aspect of 10.07 against the table's 440.9 / 43.7 =
      10.09, 0.2 percent out. Scale 3.277 px/mm across and 3.284 down. The rear photograph reads 1440 x
      143 px (columns 34 to 1473, rows 29.5 to 172.7), 10.07, 0.2 percent out, at 3.266 px/mm across. Every
      position read off them is good to a pixel, 0.3 mm, and is estimated.
  ports:
    confidence: estimated
    note: >-
      Front photograph. The 24 cages stand in four groups of three columns and two rows. The centres of
      the upper cages of column 0 to 11 read 76, 140, 202; 285, 347.5, 412.5; 495, 558, 620.5; 703, 766 and
      829 px, a pitch of 63.1 px inside a group (19.25 mm, scale 3.277) and a group stride of 209.0 px
      (63.78 mm), so the gutter is 63.78 - 3 x 19.25 = 6.0 mm. The first cage centre is 16.78 mm from the
      left edge, so the 18.5 mm cells start at 7.53 mm. The registry's pitch for a ganged QSFP+ block is
      19.0 mm; these are separate cages on a slightly wider pitch, so the photograph's 19.25 is used. Count
      is 24, callout 2 of figure 11.
  row-pitch:
    confidence: estimated
    note: >-
      The cage faces of column 0 run from row 70.5 to 112 and from 117.5 to 158, centres 15.3 mm and 29.5 mm
      below the top edge, a row pitch of 14.2 mm. The EX4600's QSFP+ cages, drawn from its own photograph,
      are 14.3 mm apart. The registry's 15.0 mm is not a conformance figure.
  stack-orientation:
    confidence: estimated
    note: >-
      The photograph shows the latch tongue at the foot of every upper cage and at the top of every lower
      one, so both lips face the band between the rows: the upper cage upright and the lower one turned
      180, the library's stack convention.
  port-numbering:
    confidence: estimated
    note: >-
      The ports are 0 to 23 (guide Figure 11 callout 2 and the text, "ports 0 through 23"). The photograph
      prints no numeral beside the lamps of the 24 fixed ports, though the numerals of the module ports (0 and
      2 above, 1 and 3 below) resolve in the same photograph, which is the control, so nothing is printed
      for the fixed ports and no numeral is drawn. The guide's Figure 12 draws a numeral 48 at the left of
      the lamps, but it is the figure of the 48S's uplink port and not of this panel. The order of the ports
      is not given by the guide; they run down each column, 0 above 1 and 2 above 3, as the modules' ports
      do. Interface names are not printed on the unit and the guide's examples give none for the QSFP+ ports,
      so none is written.
  port-lamps:
    confidence: estimated
    note: >-
      Four dots stand above every upper cage and below every lower one, at 4.15 mm pitch, the second dot
      under the cage centre (guide Figure 12: the first lamp 10G/40G and the other three 10G; Table 4). The
      photograph resolves all 96 of them.
  vents:
    confidence: estimated
    note: >-
      Two staggered rows of hexagonal holes along the top edge (0.4 to 4.8 mm) and one band along the
      bottom (39.8 to 43.7 mm), from the left end of the ports to the expansion bays. They are drawn as vent
      strips with the hexagon pitch of the 48S (4.4 mm along the strip), an estimate.
  esd:
    confidence: estimated
    note: >-
      Guide Figure 11 callout 1, the electrostatic discharge terminal, is the round jack at the lower left,
      centred 6.4 mm across and 38.8 mm down in the photograph, with the ESD mark drawn above it in the
      figure.
  stickers:
    confidence: estimated
    note: >-
      The yellow laser hazard label at the lower right of the last port group, 8 x 7.6 mm centred 253.6 across
      and 37.8 down, is an applied label and is reserved as a region, not drawn.
  modules:
    confidence: datasheet
    note: >-
      The two bays at the right of the port panel (guide Figure 11 callout 3, "Expansion module bays with
      cover panels (2)"). The photograph shows a QFX-EM-4Q in each, whose faces start at 261 mm, with the seam
      at 348.5 mm. The two bays are the EX4600's, 86.7 x 43.2 mm at 262.4 and 349.1 mm, of the same module
      (the QFX-EM-4Q and the blank are the same parts as the EX4600's, and the guide's Figures 6 and 7 are
      the same modules) and the same size; the library's modules for them are reused. The guide numbers no
      bay, so they are em-0 and em-1 from the left. The guide says the switch is "configured for the QFX-EM-4Q
      by default" and the datasheet lists the QFX5100-EM-BLNK blank module, so the shipped state is the cover
      panel and the modules are ordered separately. The QFX5100-24Q-AA, whose bay takes the double-wide
      QFX-PFA-4Q, is a different front panel and is not modelled here.
  rear-layout:
    confidence: estimated
    note: >-
      Rear photograph, read at 4.5 times and compared with the QFX5100-48S's: the management panel (four chassis
      lamps, the C1 SFP cage with two lamps above it, the console and C0 jacks stacked in one shield, the
      USB port, the reset pinhole), five fan slots whose first edge is at 71.6 mm and whose pitch is 48.95
      mm, two supply slots, and at the right edge the rating strip. Every position agrees with the 48S's to
      0.5 mm (the lamps 0.45 mm, the C1 cage 0.5 mm, the USB port 0.4 mm), so the 48S's measured positions are
      used and the rear is the same panel. The photograph is of the back-to-front build.
  mgmt:
    confidence: datasheet
    note: >-
      Table 1: the AFO, AFI and DC-AFO and DC-AFI models have two management ports, the 3AFO, 3AFI,
      D-3AFO and D-3AFI models three. The photograph shows the two-port panel: C1 is the SFP cage (em1) and C0
      the lower of the two stacked RJ-45 jacks (em0); the upper jack is the console. The guide's Figure 22 also
      draws a three-port panel (a second SFP cage, C0, above C1), which is the `rear-3mgmt` view. Its
      arrangement is the 48S's, taken from the QFX5100-48T photograph, because no 24Q photograph of it is held.
  rear-photo-vs-drawing:
    confidence: estimated
    note: >-
      The rear studio photograph is the back-to-front (AFI) build, with blue fan handles lettered AIR IN (AFI)
      and blue supply handles lettered AFI. The default configuration here is front-to-back (AFO) with Juniper
      Gold handles per Tables 13 and 19; the AFI configuration matches the photograph. The photograph's chip
      reads QFX5100-24Q and RUNNING JUNOS.
  modules-fru:
    confidence: datasheet
    note: >-
      The fan modules (QFX5100-FAN-AFO and -AFI) and the 650 W power supplies (JPSU-650W-AC-AFO, -AFI, and the DC
      -AFO and -AFI named by the datasheet) are field-replaceable units in bays, each its own component, reused
      from the QFX5100-48S by part number. Nothing on this chassis is a built-in unit that is not a bay. The
      guide says to fit a blank cover over an empty supply slot but names no part number for it, so no blank
      is modelled for the supply slots.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide says the switch mounts flush or recessed 2 in (5 cm) in a four-post rack with the
      mounting kit shipped with it (a pair of front rails and two rear blades; twelve screws), and gives no
      part number for the kit; the datasheet says only "versatile four post mounting options". The library
      holds no kit contract for it, so `chassis.ears` and `chassis.kits` are left out and a gap says so. The
      modelled body is the 440.9 mm chassis, without brackets.
  power:
    confidence: datasheet
    note: >-
      guide Table 14 (AC): typical 230 W, maximum 365 W for the 24Q; Table 17 (DC): typical 300 W and maximum
      385 W for the 24Q, 48S and 48T. The datasheet's "Power Consumption" prints 161 W for the 24Q-AFO/AFI
      without a measure or a scope. 161 W is below the guide's typical 230 W, so the two disagree and are
      recorded as a gap, not reconciled. The guide's figures are filed as the device's.
  colour:
    confidence: estimated
    note: >-
      The front plate around the ports samples #55585f (a 8 by 4 px mean between two lamps) and the rear panel
      #6c7076. The photograph is lit warmly and these are its values, not a paint reference. The front is
      carried.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-life announcement. The guide and the datasheet (July 2024) state none. Reseller
      trackers list announcements of 2020 to 2022 for the QFX5100-24Q part numbers, which the maker's documents
      do not repeat, so the device states none announced and a gap records the trackers' claim. Estimated,
      because the trackers are not the maker.
attrs:
  physical:
    weight-note: 22 lb (9.97 kg per the guide, 21.6 lb or 9.8 kg per the datasheet) with FRUs installed (Table 3)
    depth-note: 20.48 in (52 cm) (Table 3)
  performance:
    switching-capacity: 2.56 Tbps, 1.44 Bpps (datasheet)
    shared-packet-buffer: 12 MB shared packet buffer (datasheet)
    qsfp-plus-speeds: 40 GbE; or four 10 GbE with a breakout cable
  power:
    power-typical-w: 230
    power-max-w: 365
    power-envelope: unstated
    power-dc-typical-w: 300
    power-dc-max-w: 385
    power-input-ac: 110 to 240 VAC single phase (datasheet); the guide's table gives no value
    power-input-dc: rated -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum (guide Table 17)
    redundancy-note: two supplies, load-sharing and fully redundant; both should be installed
  thermal:
    fans: five fan modules, hot-swappable; the switch runs 30 seconds without thermal shutdown while one is replaced
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F) normal operation
    storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container
    humidity: 5 to 90 percent noncondensing; 5 to 93 percent short term
    altitude: no performance degradation to 2000 m (6562 ft)
  platform:
    cpu: 1.5 GHz dual-core Intel
    memory: 8 GB
    storage: 32 GB SSD
    software: Junos OS
  features:
    virtual-chassis: up to 10 switches in a ring; also a Virtual Chassis Fabric spine or leaf and a QFabric node or interconnect
    optics-qsfp: 40 GbE QSFP+, QSFP+ direct attach and active optical cable, breakout cables to SFP+
    expansion: two bays, QFX-EM-4Q (4 x 40 GbE QSFP+) and EX4600-EM-8F (8 x 10 GbE SFP+), 32 QSFP+ ports at most
  management:
    oob: management port C0 (RJ-45, em0) and C1 (SFP, em1) with link and status lamps
    console: RJ-45 console port (CON)
    usb: one USB port for image updates
  lifecycle:
    eol: none-announced
chassis: {width: 440.9, height: 43.7, depth: 520.2, ru: 1, weight-kg: 9.97, color: '#55585f', airflow: front-to-back, power: ac}
gaps:
- what: power-consumption
  scope: [front, rear]
  reason: sources-disagree
  wanted: >-
    The datasheet prints 161 W for the QFX5100-24Q-AFO/AFI under "Power Consumption", the guide 230 W typical and
    365 W maximum (Table 14). Same device, no measure or scope stated for the 161 W. The guide's figures are carried.
- what: weight
  scope: [front, rear]
  reason: sources-disagree
  wanted: >-
    The guide's Table 3 gives 22 lb (9.97 kg) with FRUs, the datasheet 21.6 lb (9.8 kg). The guide's is carried.
- what: dc-operating-voltage
  scope: [rear]
  reason: sources-disagree
  wanted: >-
    The datasheet gives -36 to -72 V DC; the guide's Table 17 gives -40 through -72 VDC (rated -48 to -60).
    The guide's range is carried.
- what: ac-input-rating
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The guide's Table 14 prints no value for AC input voltage, line frequency or current in the PDF held. The
    datasheet gives 110-240 V single phase.
- what: mounting-kit
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    The part number of the four-post mounting kit, and its depth ranges. The guide describes the kit and flush or
    recessed mounting in prose and a figure per chassis but gives no part number.
- what: usb-generation
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The USB revision. The guide names one USB port "for image updates" and gives no generation. It is drawn with
    the kit's neutral usb2 skin.
- what: rating-label
  scope: [rear]
  reason: needs-photo
  wanted: >-
    The vertical rating label at the right edge of the rear is only partly legible in the photograph and is not
    drawn.
- what: laser-label
  scope: [front]
  reason: needs-photo
  wanted: The yellow laser hazard label at the lower right of the last port group. It is a label, not a feature of the metal, and is reserved as a region.
- what: fan-and-supply-marks
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The photograph shows no fan numerals, fan icons or supply symbols on the strips beside the slots. The guide
    numbers the fan slots 0 to 4 and its figure draws the marks. They are not drawn on this device.
- what: rear-3mgmt-geometry
  scope: [rear]
  reason: needs-photo
  wanted: >-
    A photograph or flat drawing of the three-port management panel on a 24Q. The guide's Figure 22 draws it without
    scale, and the only photograph of it is the 48T's. The rear-3mgmt view takes the 48S's arrangement.
- what: lifecycle
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    Reseller trackers list end-of-life announcements of 2020 to 2022 for the QFX5100-24Q part numbers. The guide and the
    datasheet (July 2024) state none and the Juniper bulletin was not reached, so none is recorded.
- what: fixed-port-numerals
  scope: [front]
  reason: needs-photo
  wanted: >-
    Whether the 24 fixed ports carry printed numerals. The photograph shows none beside their lamps while the
    module ports' numerals resolve in it; no larger image is held, and the guide's drawing is a thumbnail.
- what: four-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: A flat drawing or photograph of the lid, the underside and the side panels.
groups:
  qsfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp, speed: 40g}
    description: 24 ports numbered 0 to 23, down each column, 0 above 1. Each runs at 40 GbE or as four 10 GbE ports with a breakout cable.
  qsfp-plus-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: link, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: beacon, color: '#f59e0b', behavior: blinking}]
    description: The first of the four lamps of each QSFP+ port - used for a 40 GbE link (guide Table 4).
  qsfp-plus-channel-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: link, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: beacon, color: '#f59e0b', behavior: blinking}]
    description: The second to fourth lamps of each QSFP+ port, in port then lane order - used when the port runs as four 10 GbE ports (guide Table 4).
  expansion:
    term: Bay
    role: traffic
    index-origin: 0
    description: The two expansion module bays at the right of the port panel, numbered from the left
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band cluster at the left of the rear - an RJ-45 console port, an RJ-45 management port,
      an SFP management port, a USB port and the recessed reset button. Four kinds, one purpose:
      reaching and recovering the switch when the data plane cannot.
  mgmt-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The two lamps above the C1 management SFP cage.
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The four chassis lamps ALM, SYS, MST and ID (guide Table 12).
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: n+1
      redundancy-note: >-
        QFX5100 datasheet (July 2024), Power Supply and Fan Modules: "Redundant (N+1) and hot-pluggable fan modules".
        The hardware guide gives five fan modules, slots 0 to 4 left to right; all should be installed and the
        switch runs 30 seconds with one removed
  fan-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The status lamp at the left of each fan slot - green when the module is present and healthy, blinking amber when absent or in error (guide Tables 20 and 21).
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: two supplies, load-sharing; one may be removed at a time while the switch runs
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD terminal on the port side (guide figure 11, callout 1)
