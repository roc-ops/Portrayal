format: 1
kind: device
name: ex4600-40f
version: 0.1.1
maturity: modelled
manufacturer: Juniper
model: EX4600-40F
portfolio: {line: EX Series, family: EX4600}
description: >-
  Juniper EX4600-40F, a 1RU 10 GbE campus aggregation and small data-centre switch that runs Junos
  OS. The port side has 24 SFP+ ports (10 or 1 GbE) and 4 QSFP+ ports (40 GbE). It also has two
  expansion module bays, which hold a QFX-EM-4Q or an EX4600-EM-8F or a cover panel. The other side
  carries the management panel, five fan modules and two power supplies. One panel serves five
  models. Four have AC or DC supplies, with air in or air out. The fifth is a spare chassis without
  supplies or fans.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper EX4600 Switch Hardware Guide, published 2025-08-12, 197 pages (Juniper Networks,
      copyright 2025): Table 3 (the models), Table 4 (the chassis), the port panel (Figure 9), the
      port lamps (Figures 10 and 11, Tables 6 and 7), the management panel (Figures 12 to 14, Table
      8), the expansion modules (Figures 15 and 16, Tables 9 and 10), the cooling system (Figure 17,
      Tables 11 to 13) and the power system (Figures 21 to 26, Tables 14 to 19). Juniper EX4600
      Ethernet Switch Datasheet, 1000511-016-EN, Sep 2021 (PDF produced 2022-07-25): the
      specifications, the power consumption by model and the ordering table. Juniper's own studio
      photographs of the front and the rear, 1500 x 163 and 1500 x 151 px (image library,
      ex4600-front-high.jpg and ex4600-rear-high.jpg). The held intake folders for the EX and QFX
      lines were not readable from this work, so no held photograph, stencil or 3D model was used;
      the public documents above are the only sources. Terms: the documents and photographs are
      Juniper's, read here for facts only, and nothing of them is copied into the library.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 4: 1.72 in (4.3 cm) high, 17.36 in (44.1 cm) wide, 20.48 in deep, 21.7 lb (9.84 kg)
      with the power supplies and fan modules installed. The table prints the depth as "20.48 in.
      (4.37 cm)", a slip; the datasheet gives 1.72 x 17.36 x 20.48 in (4.37 x 44.09 x 52.02 cm), so
      the height is 43.7 mm, the width 440.9 and the depth 520.2. The width is the body: the
      brackets extend it to 19 in (Table 23), so they are not modelled.
  gate-1:
    confidence: photo-measured
    note: >-
      The front photograph's body, between its edges, is 1483 x 148 px, an aspect of 10.02 against
      the table's 440.9 / 43.7 = 10.09 (0.7 percent out); the rear photograph's is 1454 x 145 px,
      10.03 (0.6 percent out). So both are read as orthographic, the front at 3.363 px/mm across and
      3.393 down, the rear at 3.298 across and 3.318 down. A pixel is 0.3 mm, so every position
      read off them is estimated to about 0.5 mm. Guide Figures 9 and 12 are line drawings at 1.66
      px/mm and are used to count and to read the printing.
  ports:
    confidence: photo-measured
    note: >-
      Front photograph: the SFP+ dot pairs, which are flat on the metal, centre at 22.7, 27.0, 31.2,
      35.5, 39.7 and 44.0 mm and again from 114.8 mm on a 14.25 mm pitch, the registry's, to 0.1 mm.
      The two blocks of six columns have a 6.6 mm gutter. The cage fronts sit 1.2 mm left of the
      numeral and lamp pair, so the cells start at 14.4 and 106.5 mm. The four QSFP+ cages stand in
      two columns of two, centred at 209.1 and 238.0 mm, 28.9 mm apart, with the laser warning label
      to their right. The counts, 24 and 4, are callouts 2 and 3 of figure 9. The QSFP+ pitch is
      not the registry's 19.0 mm, which is the pitch of a ganged block: these are two columns.
  row-pitch:
    confidence: photo-measured
    note: >-
      The two SFP+ cages measure 11.8 and 10.9 mm high with the module bodies in them, tops 13.0 mm
      apart, so 13.0 mm is the row pitch. The registry's 15.0 mm is measured on another cage and is
      not a conformance figure. The QSFP+ cages are 14.3 mm apart. Both rows are read off cages
      with transceivers seated, which hide the openings, so the cell positions are estimated.
  stack-orientation:
    confidence: photo-measured
    note: >-
      The photograph shows the latch tongues at the foot of every upper SFP+ and QSFP+ cage and at
      the top of every lower one, so both lips face the band between the rows: the upper cage
      upright and the lower one turned 180, the library's stack convention.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed on the metal: the SFP+ ports are 0 to 23, even above the cage and odd below it, the
      numeral between its two lamps, above the upper row and below the lower one; the QSFP+ ports are
      24 and 25 in the left column and 26 and 27 in the right, printed at the left of the lamps.
      Guide figure 9 numbers 0 to 23 and 24 to 27 as well. Interface names are not printed and the
      guide does not give the xe or et names, so none is written. The guide names the management
      ports em0 (C0) and em1 (C1), which are written.
  port-lamps:
    confidence: photo-measured
    note: >-
      Guide Figure 10 and Table 6: two lamps on each SFP+ port, link and activity at the left and
      status at the right. Figure 11 and Table 7: four lamps on each QSFP+ port, above the upper cage
      and below the lower one. The photograph shows the same dots; they are 5.8 mm apart on an SFP+
      pair and 4.2 mm apart on a QSFP+ row, centred on the printed numeral and on the cage. Lamp
      positions are estimated; a pixel is 0.3 mm.
  vents:
    confidence: photo-measured
    note: >-
      The photograph shows a honeycomb strip along the top edge, 0.4 to 4.8 mm down, and another along
      the bottom edge, 40.0 to 43.5 mm, both from 20.3 mm to 246.0 mm, and four hexagonal holes in a
      column at the left, 8.9 to 13.1 mm across, centred 10.9, 15.9, 21.1 and 26.0 mm down. They are
      declared vents.
  esd:
    confidence: photo-measured
    note: >-
      Guide Figure 9 callout 1, the electrostatic discharge terminal, is the round jack at the lower
      left, centred 7.2 mm across and 38.4 mm down, with the ESD mark above it at 31.0 mm.
  stickers:
    confidence: photo-measured
    note: >-
      The yellow laser warning label, 5.1 x 26.0 mm at 251.1 across and 6.6 down, and the hazard
      triangle below it, 7.7 x 7.4 mm at 251.1 and 34.3, are applied labels. They are reserved as
      regions and not drawn.
  modules:
    confidence: datasheet
    note: >-
      The two bays at the right of the port panel (guide Figure 9 callout 4, "Expansion module bays
      with cover panels (2)"). The first bay starts at 890 px, 262.4 mm, the seam is at 349.1 mm and
      the second ends at 435.8 mm; each module face is 86.7 x 43.2 mm. The guide numbers no bay, so
      they are em-0 and em-1 from the left. The bays ship with cover panels (QFX5100-EM-BLNK in the
      datasheet); the modules are ordered separately. The guide says the EX4600 "is configured for the
      QFX-EM-4Q by default" and also says the modules "are not shipped with the switch", so the
      shipped state is the cover panel and the 4Q is the module the software expects.
  rear-layout:
    confidence: photo-measured
    note: >-
      Rear photograph at 3.298 px/mm, checked against guide Figures 12 to 14: at the left a 63 mm
      management panel with the four chassis lamps, the SFP management cage C1 with its two lamps,
      the RJ-45 console jack above the RJ-45 management jack C0 in one shell, the USB port, and the
      reset pinhole; then five fan slots numbered 0 to 4 on a 49.3 mm pitch, each preceded by a strip
      carrying its fan symbol, number and lamp; then two supply slots, 0 and 1, the first preceded
      by its power symbol and number, and at the right edge a strip with the rating legend. The fan
      modules measure 40.9 x 41.5 mm and the supplies 54.7 mm wide.
  mgmt-labels:
    confidence: photo-measured
    note: >-
      The photograph prints CON above the upper RJ-45 jack and C0 below the lower one, with the
      legend C1 above the SFP cage; guide Figure 13 calls the upper jack the console (CON) and the
      lower one em0 (C0), and the SFP cage em1 (C1). The photograph and the figure agree.
  rear-photo-vs-drawing:
    confidence: photo-measured
    note: >-
      Figure 13 prints EX4600-40F on the label plate and the photograph prints EX4600; the photograph
      is followed, and the plate carries the words RUNNING JUNOS in both. The photograph is of a
      back-to-front build (AIR IN fan modules, a supply labelled AFI) with one supply and a cover
      panel in slot 1, and Figure 12 is the same build with two supplies. The default
      configuration here is the front-to-back AC build; the fan and supply faces are drawn from the
      AIR IN units and given the AIR OUT legend and orange handles that Tables 11 and 14 state.
  fans-and-supplies:
    confidence: datasheet
    note: >-
      The five fan modules (QFX5100-FAN-AFO and QFX5100-FAN-AFI, Table 11) and the two supplies
      (JPSU-650W-AC-AFO and -AFI, Table 14; JPSU-650W-DC-AFO and -AFI, datasheet ordering table) are
      field-replaceable units in bays, each its own component. The cover panel for an empty supply
      slot is a component too. Nothing on this chassis is a built-in unit that is not a bay; the
      fan in each supply is inside the supply.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide describes flush and 2 in recessed mounting in a four-post rack with
      front mounting rails, rear mounting blades and extension brackets (Table 32), and the datasheet
      lists a four-post rack mount kit with each model. Neither prints a part number for the kit, the
      library holds no contract for it and none is written, so chassis.ears and chassis.kits are
      left out and a gap says so. The modelled body is the 440.9 mm chassis without brackets.
  power:
    confidence: datasheet
    note: >-
      Guide Table 16 (AC): 100 to 240 VAC, 50 to 60 Hz, 4.5 A at 100 to 120 VAC and 2.0 A at 200 to 240
      VAC, typical 230 W and maximum 365 W. Table 19 (DC): rated -48 to -60 VDC, operating -40 to -72
      VDC, 10 A maximum, typical 300 W and maximum 385 W. The datasheet gives a power consumption for
      one stated load, which is a different scope: 279 W (AFO), 285 W (AFI), 392 W (DC-AFO) and 320 W
      (DC-AFI) with every fixed port forwarding at line rate with optics, a QSFP+ module and an
      8 x 10 GbE module, and two supplies. The tables' typical and maximum are the device's; the
      datasheet figures are kept as attributes.
  colour:
    confidence: photo-measured
    note: >-
      The front plate samples #6a6d71 to #76797d (median of bare patches) and the rear panel #7a7f85.
      The chassis colour is a mid grey between them. The photographs are lit and these are their
      values, not a paint reference.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-life notice. Two third-party trackers (endoflife.ai, eol.network) report
      a Juniper notice of 2026-06-29 (TSB109286) with a last order date of 2026-12-29 and end of
      support on 2031-12-29. The Juniper bulletin itself was not reached, so the dates are
      estimated.
attrs:
  physical:
    weight-note: 21.7 lb (9.84 kg) with power supplies and fan modules installed (Table 4)
    depth-note: 20.48 in (52.02 cm); Table 4 prints 4.37 cm in the metric column, a slip
  performance:
    switching-capacity: 720 Gbps unidirectional, 1.44 Tbps bidirectional (datasheet)
    forwarding-rate: 1,071 Mpps at 64 byte packets, wire speed (datasheet)
    buffers: 12 MB shared, 25 percent dedicated (guide, Benefits of the EX4600 Switch)
    sfp-plus-speeds: 10 or 1 GbE on each SFP+ port
    qsfp-plus-speeds: 40 GbE, or 4 x 10 GbE with a breakout cable
  power:
    power-typical-w: 230
    power-max-w: 365
    power-envelope: unstated
    power-dc-typical-w: 300
    power-dc-max-w: 385
    power-datasheet-load-w: 279 W AFO, 285 W AFI, 392 W DC-AFO, 320 W DC-AFI at the datasheet's stated load
    power-input-ac: 100 to 240 VAC, 50 to 60 Hz; 4.5 A at 100 to 120 VAC, 2.0 A at 200 to 240 VAC
    power-input-dc: rated -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum
    redundancy-note: two supplies, 1+1; the switch runs on one
  thermal:
    fans: five fan modules and a fan in each supply; the switch runs 30 seconds while one fan module is replaced
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -40 to 70 C (-40 to 158 F)
    humidity: 5 to 90 percent noncondensing in operation, 0 to 95 percent out of operation
    altitude: up to 2,000 (datasheet, unit not printed)
    mtbf: 150,000 hours predicted, FIT rate 4,987 (datasheet)
  platform:
    cpu: 1.5 GHz dual-core Intel
    storage: 32 GB SSD
    software: Junos OS, first release 13.2X51-D25
  features:
    virtual-chassis: up to 10 switches in a ring; mixed with EX4300 switches
    optics-sfp-plus: 10 GbE SFP+ and 1 GbE SFP in any port; a restriction on 1 GbE copper SFP stacked above or below another (guide, Port Panel)
    optics-qsfp: 40 GbE QSFP+, or 4 x 10 GbE with a breakout cable
    expansion: two bays, QFX-EM-4Q (4 x 40 GbE QSFP+) and EX4600-EM-8F (8 x 10 GbE SFP+), 72 ports at most
  management:
    oob: one RJ-45 (C0, em0) and one SFP (C1, em1) management port
    console: RJ-45 console port (CON)
    usb: one USB port
  compliance:
    safety: UL 60950-1, CAN/CSA-C22.2 No. 60950-1, EN 60950-1, IEC 60950-1, EN 60825-1
    emc: FCC 47 CFR Part 15 Class A, EN 55022 Class A, VCCI Class A, BSMI CNS 13438, AS/NZS CISPR22
    nebs: GR-63-Core, GR-1089-Core, SR-3580 NEBS Criteria Level 3 (as the datasheet lists them)
    materials: RoHS 6/6, China RoHS, REACH, WEEE, 80 Plus Silver supply efficiency
  lifecycle:
    eol: announced
    eol-announcement: https://endoflife.ai/article-juniper-ex4300-48mp-ex4600-eol
    end-of-sale: '2026-12-29'
    end-of-life: '2031-12-29'
chassis: {width: 440.9, height: 43.7, depth: 520.2, ru: 1, weight-kg: 9.84, color: '#74777c', airflow: front-to-back, power: ac}
gaps:
- what: ears-and-kits
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    The part number of the four-post rack mount kit and the ear positions. The guide names front
    mounting rails, rear mounting blades and extension brackets (Table 32) and the datasheet lists
    a four-post kit with every model, and neither prints a part number.
- what: interface-names
  scope: [sfp-plus, qsfp-plus]
  reason: vendor-silent
  wanted: >-
    The Junos names of the SFP+ and QSFP+ ports and of the module ports. The guide held names only
    em0 and em1 and refers the reader to the Hardware Compatibility Tool for transceivers.
- what: power-input-range-dc
  scope: [dc-f2b, dc-b2f]
  reason: sources-disagree
  note: >-
    The datasheet (Sep 2021) says "-36 to -72 V DC power"; the guide (2025-08-12), Table 19, says
    the operating range is -40 VDC through -72 VDC. The guide is the newer and is carried.
  wanted: which lower bound the hardware is rated to, from Juniper
- what: dc-handle-colour
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The handle colour and airflow label of the DC supplies. The guide's Table 14 covers the AC
    pair; the DC supplies take the same orange and blue by relation, not by reading, and no
    photograph of one is held.
- what: front-airflow-photo
  scope: [rear]
  reason: needs-photo
  wanted: >-
    A photograph of a front-to-back build. The rear photograph is a back-to-front build; the AIR
    OUT fan modules and the AFO supply are drawn from it with the legend and colour of Tables 11
    and 14. The photographed AFI supply has a dark handle, not the blue the table gives.
- what: usb-generation
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The USB revision. The guide names one USB port for image updates. It is drawn with the neutral
    usb2 skin, because the photograph shows a dark tongue with four contacts.
- what: c1-lamps
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    What the two small lamps above the C1 SFP cage show. Figure 13 and the photograph draw them,
    and the guide's text and tables do not describe them.
- what: labels-not-drawn
  scope: [front, rear]
  reason: needs-photo
  wanted: >-
    The laser warning label and its hazard mark at the front, the serial number label and the
    vertical rating legend at the right of the rear are applied or printed small. The rating legend
    is drawn as read, and the two front labels are reserved as regions.
- what: module-depths
  scope: [rear, front]
  reason: vendor-silent
  wanted: >-
    The depth of the fan modules, the supplies and the expansion modules. The guide's figures are
    isometric with no scale and its tables give weights of the chassis only.
groups:
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: Ports 0 to 23 as printed; each takes a 10 GbE SFP+ or a 1 GbE SFP
  qsfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp, speed: 40g}
    description: >-
      Ports 24 to 27 as printed, rel-pos carrying the printed number, since the origin token cannot
      express a block that starts at 24. Each runs as one 40 GbE port or as 4 x 10 GbE
  sfp-plus-activity-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      The link and activity lamp of each SFP+ port, left of the numeral (guide Table 6)
  sfp-plus-status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      The status lamp of each SFP+ port, right of the numeral (guide Table 6)
  qsfp-plus-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The first of the four lamps of each QSFP+ port, used for a 40 GbE link (guide Table 7)
  qsfp-plus-channel-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The second to fourth lamps of each QSFP+ port, used for the links of a 4 x 10 GbE breakout (guide Table 7)
  expansion:
    term: Bay
    role: traffic
    index-origin: 0
    description: The two expansion module bays at the right of the port panel, numbered from the left
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the management cluster at the left of the rear: an RJ-45 console, an RJ-45 and an SFP
      management port, a USB port and the recessed reset button. Four kinds, one purpose:
      reaching and recovering the switch when the data plane cannot.
  mgmt-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the two small lamps above the C1 management SFP cage
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The four chassis lamps ALM, SYS, MST and ID (guide Table 8)
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '4+1'
      redundancy-note: >-
        Datasheet, Power Supply and Fan Modules - "Redundant (N+1) and hot-pluggable fan modules" -
        and the guide, Cooling System and Airflow: five fan modules in slots 0 to 4 from left to
        right, so N is four. All must be installed for the best cooling, and the switch runs 30
        seconds while one is replaced
  fan-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      The status lamp (ST) in the strip at the left of each fan slot: green when the module is
      present and healthy, amber blinking on an error (guide Tables 12 and 13)
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Two supplies, each able to carry the load; one may be removed while the other runs. Do not mix
        AC and DC supplies, or supplies of different airflow
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD terminal at the lower left of the port panel (guide Figure 9, callout 1)
