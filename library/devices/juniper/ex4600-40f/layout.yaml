configurations:
  ac-f2b:
    kind: orderable
    default: true
    description: >-
      EX4600-40F-AFO: two 650 W AC supplies (JPSU-650W-AC-AFO) and five front-to-back fan modules
      (QFX5100-FAN-AFO), the expansion bays covered. All carry an orange handle and the label AFO or
      AIR OUT (guide Tables 3, 11 and 14).
    part-numbers:
      EX4600-40F-AFO: {}
  ac-b2f:
    kind: orderable
    airflow: back-to-front
    description: >-
      EX4600-40F-AFI: two 650 W AC supplies (JPSU-650W-AC-AFI) and five back-to-front fan modules
      (QFX5100-FAN-AFI). All carry a blue handle and the label AFI or AIR IN.
    bays:
      psu-0: juniper/ex4600-jpsu-650-ac-afi@1
      psu-1: juniper/ex4600-jpsu-650-ac-afi@1
      fan-0: juniper/ex4600-fan-afi@1
      fan-1: juniper/ex4600-fan-afi@1
      fan-2: juniper/ex4600-fan-afi@1
      fan-3: juniper/ex4600-fan-afi@1
      fan-4: juniper/ex4600-fan-afi@1
    part-numbers:
      EX4600-40F-AFI: {}
  dc-f2b:
    kind: orderable
    power: dc
    description: >-
      EX4600-40F-DC-AFO: two 650 W DC supplies (JPSU-650W-DC-AFO) and five front-to-back fan modules
      (QFX5100-FAN-AFO).
    bays:
      psu-0: juniper/ex4600-jpsu-650-dc-afo@1
      psu-1: juniper/ex4600-jpsu-650-dc-afo@1
    part-numbers:
      EX4600-40F-DC-AFO: {}
  dc-b2f:
    kind: orderable
    power: dc
    airflow: back-to-front
    description: >-
      EX4600-40F-DC-AFI: two 650 W DC supplies (JPSU-650W-DC-AFI) and five back-to-front fan modules
      (QFX5100-FAN-AFI).
    bays:
      psu-0: juniper/ex4600-jpsu-650-dc-afi@1
      psu-1: juniper/ex4600-jpsu-650-dc-afi@1
      fan-0: juniper/ex4600-fan-afi@1
      fan-1: juniper/ex4600-fan-afi@1
      fan-2: juniper/ex4600-fan-afi@1
      fan-3: juniper/ex4600-fan-afi@1
      fan-4: juniper/ex4600-fan-afi@1
    part-numbers:
      EX4600-40F-DC-AFI: {}
  s:
    kind: orderable
    description: >-
      EX4600-40F-S, the spare chassis. It ships with no power supplies and no fan modules, which are
      ordered separately (guide Table 3). The datasheet says front-to-back airflow. The bays are open.
    bays:
      psu-0: ''
      psu-1: ''
      fan-0: ''
      fan-1: ''
      fan-2: ''
      fan-3: ''
      fan-4: ''
    part-numbers:
      EX4600-40F-S: {}
