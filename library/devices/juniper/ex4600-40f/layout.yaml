    kind: example
    description: >-
      The EX4600-40F-AFO with a QFX-EM-4Q in each bay, 12 QSFP+ ports in all. An illustration, not an
      order code.
    bays:
      em-0: juniper/ex4600-em-4q@1
      em-1: juniper/ex4600-em-4q@1
  em-8f:
    kind: example
    description: >-
      The EX4600-40F-AFO with an EX4600-EM-8F in each bay, 16 more SFP+ ports. An illustration, not an
      order code.
    bays:
