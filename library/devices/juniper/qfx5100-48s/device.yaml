format: 1
kind: device
name: qfx5100-48s
version: 0.1.4
maturity: modelled
manufacturer: Juniper
model: QFX5100-48S
portfolio: {line: QFX Series, family: QFX5100}
description: >-
  Juniper QFX5100-48S, a 1RU data-centre access switch running Junos OS. It has 48 SFP+ ports and 6 QSFP+
  ports. An SFP+ port takes 10 GbE, 1 GbE or 100 Mbps optics. A QSFP+ port runs at 40 GbE or as four 10
  GbE ports. The ports and their lamps are on the port side. The rear carries two power supplies, five
  fan modules, the console, two management ports, a USB port, the reset button and the four chassis lamps.
  One front panel ships in four power and airflow variants. They have AC or DC supplies, with airflow
  front-to-back (AIR OUT) or back-to-front (AIR IN).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper QFX5100 Switch Hardware Guide, published 2023-02-26, 254 pages (Juniper Networks; terms:
      the guide's own copyright notice and the Juniper EULA, a reference copy kept outside the repository):
      Tables 1 (models), 3 (physical specifications), 8 to 12 (lamps), 13 and 14 and 16 (AC supplies),
      17 and 18 (DC supplies), 19 to 21 (fan modules); figures 14 and 15 (port panels), 20 to 25 (management
      panel), 26 to 40 (supplies, fans and airflow). QFX5100 Ethernet Switch Datasheet, 1000480-022-EN,
      July 2024: the ordering table (variants, the DC supplies, the fan modules), weight and dimensions,
      power. Juniper's studio photographs of the 48S, front and rear, 1500 x 256 and 1500 x 228 px (image
      library, qfx5100-48s-front-high and -rear-high), and of the 48T. The held-sources folders of the
      intake area were not readable from this worker (permission denied), so no Visio stencil or 3D model
      could be looked for there; none is named by the guide or the datasheet either.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 3: 1.72 in (4.3 cm) high, 17.36 in (44.1 cm) wide, 20.48 in (52 cm) deep, 21.8 lb (9.8
      kg) with FRUs. The datasheet gives 4.37 x 44.09 x 52.02 cm and 21.8 lb (9.9 kg); the two weights
      are one figure rounded two ways (21.8 lb is 9.89 kg), so 9.9 is carried. The width is the body:
      the mounting brackets are not part of it and are not modelled.
  gate-1:
    confidence: photo-measured
    note: >-
      The front studio photograph is orthographic enough to measure. Its body is 1442 px wide and 143.5
      px high (top edge row 43, bottom row 186.5), an aspect of 10.05 against the table's 440.9 / 43.7
      = 10.09, 0.4 percent out. Scale 3.270 px/mm across and 3.284 down. The rear photograph reads 1457
      x 143.3, an aspect of 10.17 (0.8 percent out), at 3.305 px/mm across and 3.28 down. The guide's
      flat figure 14 is a 761 x 135 px thumbnail and is used to count and to read the printing only.
  ports:
    confidence: photo-measured
    note: >-
      Front photograph. The lamp dots above the upper row give each cage centre: 24 columns on a pitch
      of 46.5 px, 14.22 mm, which is the registry's 14.25 SFP+ ganged pitch, in four groups of six columns.
      The first cage centres are at 17.28, 106.05, 194.8 and 283.5 mm, a group stride of 88.77 mm, so
      the gutter is 88.77 - 6 x 14.25 = 3.27 mm; the cells start at 10.15 mm. Then six QSFP+ cages in
      three columns on a pitch of 62 to 62.5 px, 18.96 to 19.1 mm (the registry's 19.0 is used), the first
      cage face from 377.2 mm. Counts are 48 and 6, the guide's callouts 2 and 3 of figure 14. The cells
      use the registry's apertures (14.25 x 10.4 and 18.5 x 9.58); the photographed cage faces are larger
      (about 11.8 mm and 12.7 mm high) because they include the bezel.
  row-pitch:
    confidence: photo-measured
    note: >-
      Down the first SFP+ column the cage faces run from 75.0 to 113.5 and 117.5 to 155.5 px, centres
      94.3 and 136.5 px, which is 15.6 and 28.5 mm below the top edge, a row pitch of 12.9 mm. The QSFP+
      cage faces centre 14.4 and 29.4 mm below the top edge, a row pitch of 15.0 mm. The registry's 15.0
      SFP row pitch is measured on a different cage and is not a conformance figure, so the photograph's
      12.9 is used; the 10.4 mm cell fits it. y is good to about 0.3 mm.
  stack-orientation:
    confidence: photo-measured
    note: >-
      The photograph shows the latch tongue at the foot of every upper cage and at the top of every lower
      one, so both lips face the band between the rows: the upper cage upright and the lower one turned
      180, the library's stack convention. The QSFP+ pairs show the same.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed on the metal and read off the photograph and figure 14: the SFP+ ports run 0 to 47, even
      above the upper row and odd below the lower row, the numeral between its two lamps; the QSFP+ ports
      are 48 and 49 down the first column, 50 and 51, 52 and 53, the numeral at the left of each cage.
      Interface names are not printed on the unit. The guide's examples use xe-0/0/n for the 10 GbE ports
      and the Junos names of the QSFP+ ports are not given in the guide held; none is written to the manifest.
  port-lamps:
    confidence: photo-measured
    note: >-
      Two dots flank each SFP+ numeral, 5.86 mm apart, centred on the cage; the guide's Table 8 and figure
      g050235 name them the Link/Activity lamp (left) and the Status lamp (right), and Table 9 gives their
      states. Four dots stand at 4.07 mm pitch beside each QSFP+ cage, above the upper cages and below
      the lower ones (Table 10, figure g050236, bi-colour). The photograph resolves all of them (the numerals
      beside them resolve at the same scale), so none is carried from the drawing alone. The first lamp
      of a QSFP+ port is the link lamp of an unchannelized port; the other three are channel lamps (Table
      10).
  vents:
    confidence: photo-measured
    note: >-
      Two staggered rows of hexagonal holes along the top edge (0.2 to 4.6 mm) and one band along the
      bottom (39.5 to 43.5 mm), and a vertical strip of hexagons, 9.0 mm wide, between the SFP+ and QSFP+
      blocks. They are drawn as vent strips; the hexagon pitch (about 4.4 mm along the strip) is read
      off the photograph at 3.5 times and is estimated, as the pattern is a rectangular approximation
      of a staggered hexagon field.
  rear-layout:
    confidence: photo-measured
    note: >-
      Rear photograph, read at 3.5 times and checked against the guide's figures 20 and 22 (the figure
      20 drawing is lettered EX4600-40F: a drawing of a sibling, used for the arrangement only). At the
      left a 63.5 mm panel carries the four chassis lamps ALM, SYS, MST and ID, the C1 SFP cage with two
      lamps above it, the console and C0 jacks stacked in one shield, the USB port and the reset pinhole.
      Then five fan slots on a 48.95 mm pitch, each preceded by a strip with a small dark status lamp,
      then two supply slots on a 61.1 mm pitch, and at the right edge a dark strip carrying a vertical
      rating label. The fan and supply slots measure 41.5 x 41.3 mm and 54.8 x 39.8 mm.
  mgmt:
    confidence: photo-measured
    note: >-
      The 48S photograph shows the two-port panel of Table 1 (QFX5100-48S-AFO, -AFI, -DC-AFO and -DC-AFI
      have two management ports): C1 is the SFP cage (em1) and C0 the lower of the two stacked RJ-45 jacks
      (em0); the upper jack is the console. The status and link lamps of C0 sit in the lower corners of
      its jack. The guide's figure 22 also draws a three-port panel (a second SFP cage, C0, above C1),
      which Table 1 gives the -3AFO and -3AFI models and the 48SH. That panel is the `rear-3mgmt` view.
      Its arrangement is read off the 48T photograph, which has the same three-port panel, because no
      48S photograph of it is held.
  rear-photo-vs-drawing:
    confidence: photo-measured
    note: >-
      The guide's figure 20 draws the rear of an EX4600-40F; the studio photograph is the real QFX5100-48S
      and wins. The photograph is the back-to-front (AFI) build with blue fan handles lettered AIR IN
      (AFI) and blue supply handles lettered AFI. The default configuration here is front-to-back (AFO)
      with Juniper Gold handles per Tables 13 and 19; the AFI configuration matches the photograph.
  modules:
    confidence: datasheet
    note: >-
      The fan modules (QFX5100-FAN-AFO and -AFI) and the 650 W power supplies (JPSU-650W-AC-AFO, -AFI,
      and the DC -AFO and -AFI named by the datasheet) are field-replaceable units in bays, each its own
      component. Nothing on this chassis is a built-in unit that is not a bay. The guide says to fit a
      blank cover over an empty supply slot but names no part number for it, so no blank is modelled and
      no empty-bay configuration is offered.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide says the switch mounts flush or recessed 2 in (5 cm) in a four-post rack
      with the mounting kit shipped with it (a pair of front rails and two rear blades; twelve screws),
      and gives no part number for the kit; the datasheet says only "versatile four post mounting options".
      The library holds no kit contract for it and none is written here, so `chassis.ears` and `chassis.kits`
      are left out and a gap says so. The modelled body is the 440.9 mm chassis, without brackets.
  power:
    confidence: datasheet
    note: >-
      guide Table 14 (AC): typical 230 W, maximum 365 W for the 48S and 48SH; Table 17 (DC): typical 300
      W and maximum 385 W for the 48S, 48T and 24Q. The datasheet's "Power Consumption" prints 150 W for
      the 48S-AFO/AFI without a measure or a scope. 150 W is below the guide's typical 230 W under the
      same unqualified reading, so the two disagree and are recorded as a gap, not reconciled. The guide's
      figures are filed as the device's.
  colour:
    confidence: photo-measured
    note: >-
      The front plate around the ports samples #727580 (5 by 5 px means at two bare patches) and the rear
      panel #80858b. The photograph is lit warmly and these are its values, not a paint reference.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-life announcement. The guide and the datasheet (July 2024) state none. Reseller
      trackers (router-switch.com) list announcements of 2020 to 2022 for the QFX5100-24Q, -24Q-AA and
      -96S part numbers and none for the 48S, so the device states none announced. Estimated, because
      the trackers are not the maker.
attrs:
  physical:
    weight-note: 21.8 lb (9.8 kg per the guide, 9.9 kg per the datasheet) with FRUs installed (Table 3)
    depth-note: 20.48 in (52 cm) (Table 3)
  performance: {switching-capacity: '1.44 Tbps, 1.08 Bpps (datasheet)', shared-packet-buffer: 12 MB shared
      packet buffer (datasheet), sfp-plus-speeds: 10 GbE with SFP+ optics; 1 GbE or 100 Mbps with SFP
      optics, qsfp-plus-speeds: 40 GbE; or four 10 GbE with a breakout cable}
  power:
    power-typical-w: 230
    power-max-w: 365
    power-envelope: unstated
    power-dc-typical-w: 300
    power-dc-max-w: 385
    power-input-ac: 110 to 240 VAC single phase (datasheet); the guide's table gives no value
    power-input-dc: rated -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum (guide Table 17)
    redundancy-note: two supplies, load-sharing and fully redundant; both should be installed
  thermal:
    fans: >-
      five fan modules, hot-swappable; the switch runs 30 seconds without thermal shutdown while one is
      replaced
  environmental: {operating-temp: 0 to 40 C (32 to 104 F) normal operation, storage-temp: -40 to 70 C
      (-40 to 158 F) in the shipping container, humidity: 5 to 90 percent noncondensing; 5 to 93 percent
      short term, altitude: no performance degradation to 2000 m (6562 ft)}
  platform: {cpu: 1.5 GHz dual-core Intel, memory: 8 GB, storage: 32 GB SSD, software: Junos OS}
  features:
    virtual-chassis: >-
      up to 10 switches in a ring; also a Virtual Chassis Fabric leaf or spine and a QFabric node
    optics-sfp-plus: 10 GbE SFP+, 1 GbE and 100 Mbps SFP, SFP+ direct attach cable and active optical
      cable
    optics-qsfp: 40 GbE QSFP+, QSFP+ direct attach and active optical cable, breakout cables to SFP+
  management:
    oob: management port C0 (RJ-45, em0) and C1 (SFP, em1) with link and status lamps
    console: RJ-45 console port (CON)
    usb: one USB port for image updates
  lifecycle: {eol: none-announced}
chassis: {width: 440.9, height: 43.7, depth: 520.2, ru: 1, weight-kg: 9.9, color: '#727580', airflow: front-to-back,
  power: ac}
gaps:
- what: power-consumption
  scope:
  - front
  - rear
  reason: sources-disagree
  wanted: >-
    The datasheet prints 150 W for the QFX5100-48S-AFO/AFI under "Power Consumption", the guide 230 W
    typical and 365 W maximum for the 48S and 48SH (Table 14). Same device, no measure or scope stated
    for the 150 W. The guide's figures are carried.
- what: dc-operating-voltage
  scope:
  - rear
  reason: sources-disagree
  wanted: >-
    The datasheet gives -36 to -72 V DC; the guide's Table 17 gives -40 through -72 VDC (rated -48 to
    -60). The guide's range is carried.
- what: ac-input-rating
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The guide's Table 14 prints no value for AC input voltage, line frequency or current in the PDF held.
    The datasheet gives 110-240 V single phase; the chassis label in the photograph reads 100-240 V.
- what: mounting-kit
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    The part number of the four-post mounting kit, and its depth ranges. The guide describes the kit and
    flush or recessed mounting in prose and a figure per chassis but gives no part number.
- what: usb-generation
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The USB revision. The guide names one USB port "for image updates" and gives no generation. It is
    drawn with the kit's neutral usb2 skin.
- what: rating-label
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    The vertical rating label at the right edge of the rear (an AC input line and a DC input line). It
    is only partly legible in the photograph and is not drawn.
- what: laser-label
  scope:
  - front
  reason: needs-photo
  wanted: >-
    The yellow laser-safety triangle at the lower right of the port side. It is a label, not a feature
    of the metal, and is not drawn.
- what: fan-and-supply-marks
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The 48S photograph shows no fan numerals, fan icons or supply symbols on the strips beside the slots,
    where the 48T photograph shows them. The guide numbers the fan slots 0 to 4 and its figure draws the
    marks. They are not drawn on this device.
- what: rear-3mgmt-geometry
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    A photograph or flat drawing of the three-port management panel on a 48S. The guide's figure 22 draws
    it (the right-hand panel: a stacked pair of SFP cages, then console, C0 and USB) without scale, and
    the only photograph of it is the 48T's. The rear-3mgmt view takes the 48T photograph's arrangement
    and positions, and the model chip reads QFX5100-48S, which is an assumption for the 48SH, whose chip
    text is not shown anywhere held.
- what: dc-three-port
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The datasheet's ordering table lists QFX5100-48S-D-3AFI and -D-3AFO (DC supplies, three management
    ports); the guide's Table 1 lists no such 48S model. They are not modelled.
- what: four-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: A flat drawing or photograph of the lid, the underside and the side panels.
groups:
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      48 ports labelled 0 to 47, the even ports on the upper row. Each takes an SFP or an SFP+ transceiver,
      at 10 GbE, 1 GbE or 100 Mbps.
  qsfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp, speed: 40g}
    description: >-
      Ports 48 to 53 as printed, rel-pos carrying the printed number, since the origin token cannot express
      a block that starts at 48.
  sfp-plus-activity-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: link, color: '#22c55e'}
    - {name: activity, color: '#22c55e', behavior: blinking}
    - {name: beacon, color: '#f59e0b', behavior: blinking}
    description: The Link/Activity lamp of each SFP+ port, left of the numeral (guide Table 9).
  sfp-plus-status-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: 10g, color: '#22c55e'}
    - {name: 1g, color: '#22c55e', behavior: blinking}
    - {name: beacon, color: '#f59e0b', behavior: blinking}
    description: >-
      The Status lamp of each SFP+ port, right of the numeral - steady green for a 10 GbE transceiver,
      blinking green for 1 GbE (guide Table 9).
  qsfp-plus-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: link, color: '#22c55e'}
    - {name: activity, color: '#22c55e', behavior: blinking}
    - {name: beacon, color: '#f59e0b', behavior: blinking}
    description: >-
      The first of the four lamps of each QSFP+ port - used for a 40 GbE link (guide Table 10).
  qsfp-plus-channel-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: link, color: '#22c55e'}
    - {name: activity, color: '#22c55e', behavior: blinking}
    - {name: beacon, color: '#f59e0b', behavior: blinking}
    description: >-
      The second to fourth lamps of each QSFP+ port, in port then lane order - used when the port runs
      as four 10 GbE ports (guide Table 10).
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band cluster at the left of the rear - an RJ-45 console port, an RJ-45 management port,
      an SFP management port, a USB port and the recessed reset button. Four kinds, one purpose: reaching
      and recovering the switch when the data plane cannot.
  mgmt-leds: {term: LED, role: indicator, index-origin: 0, description: The two lamps above the C1 management
      SFP cage.}
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The four chassis lamps ALM, SYS, MST and ID (guide Table 12).
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: n+1
      redundancy-note: >-
        QFX5100 datasheet (July 2024), Power Supply and Fan Modules: "Redundant (N+1) and hot-pluggable
        fan modules". The hardware guide gives five fan modules, slots 0 to 4 left to right; all should
        be installed and the switch runs 30 seconds with one removed
  fan-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      The status lamp at the left of each fan slot - green when the module is present and healthy, blinking
      amber when absent or in error (guide Tables 20 and 21).
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: 1+1
      redundancy-note: two supplies, load-sharing; one may be removed at a time while the switch runs
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD terminal on the port side (guide figure 14, callout 1)
