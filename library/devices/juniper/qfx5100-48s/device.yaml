configurations:
  ac-f2b:
    kind: orderable
    default: true
    description: >-
      QFX5100-48S-AFO: two 650 W AC supplies (JPSU-650W-AC-AFO) and five front-to-back fan modules (QFX5100-FAN-AFO).
      All have a Juniper Gold handle and the label AIR OUT or AFO (guide Tables 13 and 19).
    part-numbers:
      QFX5100-48S-AFO: {}
  ac-b2f:
    kind: orderable
    airflow: back-to-front
    description: >-
      QFX5100-48S-AFI: two 650 W AC supplies (JPSU-650W-AC-AFI) and five back-to-front fan modules (QFX5100-FAN-AFI).
      All have a Juniper Azure Blue handle and the label AIR IN or AFI (guide Tables 13 and 19).
    bays: {psu-0: juniper/qfx5100-jpsu-650w-ac-afi@1, psu-1: juniper/qfx5100-jpsu-650w-ac-afi@1, fan-0: juniper/qfx5100-fan-afi@1,
      fan-1: juniper/qfx5100-fan-afi@1, fan-2: juniper/qfx5100-fan-afi@1, fan-3: juniper/qfx5100-fan-afi@1,
      fan-4: juniper/qfx5100-fan-afi@1}
    part-numbers:
      QFX5100-48S-AFI: {}
  dc-f2b:
    kind: orderable
    power: dc
    description: >-
      QFX5100-48S-DC-AFO: two 650 W DC supplies (JPSU-650W-DC-AFO) and five front-to-back fan modules
      (QFX5100-FAN-AFO). The front panel is the same.
    bays: {psu-0: juniper/qfx5100-jpsu-650w-dc-afo@1, psu-1: juniper/qfx5100-jpsu-650w-dc-afo@1}
    part-numbers:
      QFX5100-48S-DC-AFO: {}
  dc-b2f:
    kind: orderable
    power: dc
    airflow: back-to-front
    description: >-
      QFX5100-48S-DC-AFI: two 650 W DC supplies (JPSU-650W-DC-AFI) and five back-to-front fan modules
      (QFX5100-FAN-AFI). The front panel is the same.
    bays: {psu-0: juniper/qfx5100-jpsu-650w-dc-afi@1, psu-1: juniper/qfx5100-jpsu-650w-dc-afi@1, fan-0: juniper/qfx5100-fan-afi@1,
      fan-1: juniper/qfx5100-fan-afi@1, fan-2: juniper/qfx5100-fan-afi@1, fan-3: juniper/qfx5100-fan-afi@1,
      fan-4: juniper/qfx5100-fan-afi@1}
    part-numbers:
      QFX5100-48S-DC-AFI: {}
  ac-3mgmt-f2b:
    kind: orderable
    views: {rear: rear-3mgmt}
    description: >-
      QFX5100-48S-3AFO: the 48S-AFO with the three-port management panel (a second SFP port, C0, above
      C1). The supplies and fan modules are those of the AFO build.
    part-numbers:
      QFX5100-48S-3AFO: {}
  ac-3mgmt-b2f:
    kind: orderable
    airflow: back-to-front
    views: {rear: rear-3mgmt}
    description: >-
      QFX5100-48S-3AFI: the 48S-AFI with the three-port management panel (a second SFP port, C0, above
      C1). The supplies and fan modules are those of the AFI build.
    bays: {psu-0: juniper/qfx5100-jpsu-650w-ac-afi@1, psu-1: juniper/qfx5100-jpsu-650w-ac-afi@1, fan-0: juniper/qfx5100-fan-afi@1,
      fan-1: juniper/qfx5100-fan-afi@1, fan-2: juniper/qfx5100-fan-afi@1, fan-3: juniper/qfx5100-fan-afi@1,
      fan-4: juniper/qfx5100-fan-afi@1}
    part-numbers:
      QFX5100-48S-3AFI: {}
  sh-ac-f2b:
    kind: orderable
    views: {rear: rear-3mgmt}
    description: >-
      QFX5100-48SH-AFO: the 48S for Junos Fusion, which ships with the Satellite Network Operating System
      in place of Junos OS. The front panel and the supplies are those of the 48S, AC only, with the three-port
      management panel of Table 1. Airflow is front-to-back.
    part-numbers:
      QFX5100-48SH-AFO: {}
  sh-ac-b2f:
    kind: orderable
    airflow: back-to-front
    views: {rear: rear-3mgmt}
    description: >-
