      placements:
      - ref: common/led-dot@1
        id: led-alm
        at: [7.35, 17.4]
        group: status-leds
        rel-pos: 0
        for: chassis
        states:
        - 'off'
        - {name: major, color: '#ef4444'}
        - {name: minor, color: '#f59e0b'}
        description: >-
          Table 12 - red: major hardware fault, the switch halted; amber: minor alarm; unlit: no alarm
          or halted
      - ref: common/led-dot@1
        id: led-sys
        at: [7.35, 22.7]
        group: status-leds
        rel-pos: 1
        for: chassis
        states:
        - 'off'
        - {name: junos, color: '#22c55e'}
        - {name: virtual-chassis-member, color: '#22c55e', behavior: blinking}
        description: >-
          Table 12 - green steady: Junos OS loaded; green blinking: member of a Virtual Chassis or Virtual
          Chassis Fabric; unlit: off or halted
      - ref: common/led-dot@1
        id: led-mst
        at: [7.35, 27.7]
        group: status-leds
        rel-pos: 2
        for: chassis
        states:
        - 'off'
        - {name: primary, color: '#22c55e'}
        - {name: backup, color: '#22c55e', behavior: blinking}
        description: >-
          Table 12 - green steady: standalone switch or the primary; green blinking: backup primary; unlit:
          a line card member
      - ref: common/led-dot@1
        id: led-id
        at: [7.35, 32.7]
        group: status-leds
        rel-pos: 3
        for: chassis
        states:
        - 'off'
        - {name: beacon, color: '#3b82f6', behavior: blinking}
        description: >-
          Table 12 - blue blinking: the beacon feature is enabled (request chassis beacon); unlit: not
          enabled
      - ref: std/sfp@1
        id: mgmt-c1
        at: [13.1, 26.2]
        group: mgmt
        rel-pos: 0
        attrs: {media: sfp, speed: 1g, role: mgmt}
      - {ref: common/led-dot@1, id: led-c1-a, at: [16.9, 20.7], for: mgmt-c1, group: mgmt-leds, rel-pos: 0}
      - {ref: common/led-dot@1, id: led-c1-b, at: [22.8, 20.7], for: mgmt-c1, group: mgmt-leds, rel-pos: 1}
      - ref: std/rj45-ganged@2
        id: console
        at: [35.25, 11.2]
        rotate: 180
        group: mgmt
        rel-pos: 1
        attrs: {media: rj45-serial, role: console}
      - ref: common/rj45-ganged-eth@1
        id: mgmt-c0
        at: [35.25, 25.1]
        group: mgmt
        rel-pos: 2
        attrs: {media: rj45, speed: 1g, role: mgmt}
        states:
          led-a:
          - 'off'
          - {name: 1000m, color: '#22c55e'}
          - {name: 100m, color: '#f59e0b'}
          led-b:
          - 'off'
          - {name: activity, color: '#22c55e', behavior: blinking}
        description: >-
          Table 11 - the status lamp is green at 1000 Mbps and amber at 100 Mbps, unlit at 10 Mbps or
          link down; the link activity lamp is green steady with a link and blinking with traffic
      - ref: std/usb-a@1
        id: usb
        at: [51.6, 26.15]
        rotate: 90
        skin: usb2
        group: mgmt
        rel-pos: 3
        attrs: {media: usb-a}
      - ref: common/reset-button@1
        id: reset-btn
        at: [39.4, 37.4]
        group: mgmt
        rel-pos: 4
        for: chassis
        attrs: {function: reset}
      - {ref: common/led-dot@1, id: led-fan-0, at: [66.7, 29.5], for: fan-0, group: fan-leds, rel-pos: 0}
      - {ref: common/led-dot@1, id: led-fan-1, at: [115.65, 29.5], for: fan-1, group: fan-leds, rel-pos: 1}
      - {ref: common/led-dot@1, id: led-fan-2, at: [164.6, 29.5], for: fan-2, group: fan-leds, rel-pos: 2}
      - {ref: common/led-dot@1, id: led-fan-3, at: [213.55, 29.5], for: fan-3, group: fan-leds, rel-pos: 3}
      - {ref: common/led-dot@1, id: led-fan-4, at: [262.5, 29.5], for: fan-4, group: fan-leds, rel-pos: 4}
