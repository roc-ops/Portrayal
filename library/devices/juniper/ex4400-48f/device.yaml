configurations:
  ac:
    kind: orderable
    description: >-
      One 550 W AC supply, two front-to-back fan modules and covers on the empty slots, the switch as
      shipped (EX4400-48F).
    default: true
    power: ac
    airflow: front-to-back
    part-numbers:
      EX4400-48F: {}
  afi:
    kind: orderable
    description: >-
      One 550 W AC supply and two fan modules with back-to-front airflow (AIR IN label, blue handle) and
      covers on the empty slots (EX4400-48F-AFI).
    power: ac
    airflow: back-to-front
    bays: {fan-0: juniper/ex4400-fan-afi@1, fan-1: juniper/ex4400-fan-afi@1, psu-0: juniper/jpsu-550-c-ac-afi@1}
    part-numbers:
      EX4400-48F-AFI: {}
  dc:
    kind: orderable
    description: >-
      One 550 W DC supply with a D-sub 3W3 input and two front-to-back fan modules, and covers on the
      empty slots (EX4400-48F-DC).
    power: dc
    airflow: front-to-back
    bays: {psu-0: juniper/jpsu-550-c-dc-afo@1}
    part-numbers:
      EX4400-48F-DC: {}
  dc-afi:
    kind: orderable
    description: >-
      One 550 W DC supply and two fan modules with back-to-front airflow (AIR IN label, blue handle) and
      covers on the empty slots (EX4400-48F-DC-AFI).
    power: dc
    airflow: back-to-front
    bays: {fan-0: juniper/ex4400-fan-afi@1, fan-1: juniper/ex4400-fan-afi@1, psu-0: juniper/jpsu-550-c-dc-afi@1}
    part-numbers:
      EX4400-48F-DC-AFI: {}
  s:
    kind: orderable
    description: >-
      The spare chassis EX4400-48F-S. It ships with no power supply and no fan modules, which are ordered
      separately. The guide gives it a 550 W VDC supply, which has no part here.
    power:
    - ac
    - dc
    bays: {fan-0: '', fan-1: '', psu-0: '', psu-1: ''}
    part-numbers:
      EX4400-48F-S: {}
  em-4y:
    kind: example
    description: >-
      The EX4400-48F as shipped, with an EX4400-EM-4Y extension module in the extension slot in place
      of the cover. An illustration, not an order code.
    power: ac
    bays: {ext-module: juniper/ex4400-em-4y@1}
  dual-psu:
    kind: example
    description: >-
      The EX4400-48F with a second 550 W supply in slot 1, for the 1+1 redundancy the guide describes.
      An illustration, not an order code.
    power: ac
    bays: {psu-1: juniper/jpsu-550-c-ac-afo@1}
