configurations:
  ac:
    kind: orderable
    description: >-
      One 1600 W AC supply, two front-to-back fan modules and covers on the empty slots, the switch as
      shipped (EX4400-48MP).
    default: true
    power: ac
    part-numbers:
      EX4400-48MP: {}
  s:
    kind: orderable
    description: >-
      The spare chassis EX4400-48MP-S. It ships with no power supply and no fan modules, and they are
      ordered separately. The guide lists 2000 W DC as its supply and the AFO fan module.
    power:
    - ac
    - dc
    bays: {fan-0: '', fan-1: '', psu-0: '', psu-1: ''}
    part-numbers:
      EX4400-48MP-S: {}
  em-4y:
    kind: example
    description: >-
      The EX4400-48MP as shipped, with an EX4400-EM-4Y extension module in the extension slot in place
      of the cover. An illustration, not an order code.
    power: ac
    bays: {ext-module: juniper/ex4400-em-4y@1}
  dual-psu:
    kind: example
    description: >-
      The EX4400-48MP with a second 1600 W supply in slot 1, for the 1+1 redundancy the guide describes.
      An illustration, not an order code.
    power: ac
    bays: {psu-1: juniper/jpsu-1600-c-ac-afo@1}
