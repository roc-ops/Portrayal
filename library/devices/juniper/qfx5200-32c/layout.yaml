format: 1
kind: device
name: qfx5200-32c
version: 0.1.1
maturity: modelled
manufacturer: Juniper
model: QFX5200-32C
portfolio: {line: QFX Series, family: QFX5200}
description: >-
  Juniper QFX5200-32C, a 1RU data-centre spine and leaf switch with 32 QSFP28 ports (100 GbE by
  default; 50, 40, 25 or 10 GbE by configuration or breakout cable), numbered 0 to 31 in two rows. The
  port side also carries an RJ45 grand master clock jack and two clock outputs, PPS OUT and 10M OUT.
  The FRU side carries the management panel (four chassis lamps, two SFP management cages C0 and C1,
  an RJ45 console, an RJ45 management port, a USB port and a reset button), five fan modules and two
  power supplies. It ships as one front panel in several builds: AC or DC supplies, front-to-back (AIR
  OUT) or back-to-front (AIR IN), and the QFX5200-32C-L, which runs Junos OS Evolved on the same panel.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper QFX5200 Switch Hardware Guide, published 2026-03-09, 236 pages (copyright 2026 Juniper
      Networks): the port panel figures 12 and 14 and the LED figure 15, the management panel figures
      19 and 20, the FRU panel figure 25, the fan and power supply figures 27, 34, 36, 37 and 39 to 44, the
      specification tables 20, 25, 30 and 31, the fan and airflow tables 3, 17 and 19 and the mounting
      chapter. Juniper's studio photograph of the 32C port side, 2100 x 450 px (image library,
      qfx5200-32c-front-high). THE HPE DATASHEET (a00150814enw) DID NOT ANSWER, a transport error on the
      one attempt, so no datasheet figure is used. NO PHOTOGRAPH OF THE 32C FRU SIDE WAS FOUND: the
      suggested qfx5200-32c-rear-high address answered 404, so the FRU side is drawn from the guide's
      figures 19, 20 and 41 alone. No mechanical drawing and no 3D model were found. The held intake
      folders (SOURCES.md, COVERAGE.md) are on another machine and could not be read from this one, so no
      held photograph, stencil or model was available to use.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 31: 1.72 in (4.3 cm) high, 17.36 in (44.1 cm) wide, 20.48 in (52 cm) deep, 23.5 lb
      (10.66 kg), for the QFX5200-32C and the QFX5200-32C-L. The inch figures are converted
      (43.69, 440.94 and 520.19 mm) because the centimetre figures are rounded to one digit; the
      centimetre figures agree to the rounding. The width is the body between the ear folds: the guide
      says the front mounting brackets extend it to 19 in, so the brackets are not modelled.
  gate-1:
    confidence: photo-measured
    note: >-
      Figure 14 (a 3559 x 650 px raster of the port side) is orthographic enough to measure: its outline
      measures 3420 px between stroke centres (x 50.5 to 3470.5) and 338.5 px (y 279.5 to 618), an aspect
      of 10.10 against the table's 440.94 / 43.69 = 10.09, at 7.755 px/mm both ways. The studio photograph
      agrees (body 51 to 2063 px, 4.56 px/mm, 199 px high, 43.6 mm) and was used to confirm the figure.
      Figure 19 (the FRU side, a 756 px raster) reads 716.5 px between its side edges, 1.625 px/mm, but
      only 67.5 px high, 5 percent short of the table, so its horizontal scale is used and its vertical
      scale is fitted to the table's height.
  ports:
    confidence: drawing
    note: >-
      Figure 14, 32 QSFP28 cages in two rows of 16, in four gangs of four columns. The lamp rings sit on a
      19.0 mm pitch (147.3 px), which is the registry's qsfp-ganged pitch, and the gangs are 82.0 mm apart
      (the studio photograph reads 82.0 as well), so the gutter is 6.0 mm. The first cage's centre is at
      78.40 mm and its cell therefore starts at 69.15; the last cage's right edge falls at 391.4 mm in the
      figure and in the model. The rows are 13.05 mm apart on their centres (17.96 and 31.0 mm); the
      figure's drawn junction lines between cages read 19.5 mm, which is the drawn cage bezel and not the
      pitch, and the lamps and numerals are used instead because they are flat. The upper row is 13.17
      mm down the face. The photograph reads 13.05 for the same edge.
  stack-orientation:
    confidence: photo-measured
    note: >-
      The photograph shows the bright lip along the foot of every upper cage and along the top of every
      lower one, so both lips face the band between the rows: the upper cage upright and the lower one
      turned 180, the library's stack convention.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed on the metal and read off the photograph and figure 14: ports 0 to 31, even above the cage
      on the upper row and odd below it on the lower, one numeral centred on each cage, between the cage and
      its lamps. Interface names are not printed and are not written; the guide's channelization text
      names no interface names for this switch.
  port-lamps:
    confidence: drawing
    note: >-
      Four lamps a port, as figure 15 shows and Table 7 says (four bi-colour lamps for each QSFP+ port;
      the first is used and the rest are not used when the port is 100 GbE with a QSFP28 module, all four when
      the port is channelized). They are 4.17 mm apart (32.3 px) and centred on the cage, the upper row
      at 9.5 mm and the lower at 39.8 mm down the face (figure 14 reads 9.7 and 40.0, the photograph 9.3 and
      39.7). Their size is the library's 2.0 mm lamp, as the photograph resolves them at about 1.8 mm. The
      guide's colours are green (link, steady; blinking for activity) and amber (blinking for beacon);
      Table 6 and Table 7 give them.
  clock-block:
    confidence: photo-measured
    note: >-
      The RJ45 grand master clock jack GM, the PPS OUT jack and the 10M OUT jack, at the left. Figure 14
      and the photograph agree on the housing (16.8 x 14.0 mm over the jack's 15.8 x 13.2), 8.9 mm down and 18.8
      mm in. The two outputs are 15.0 mm apart, 8.1 mm across their nuts, with the legends above. The
      guide names them only as 1PPS output and 10 MHz output; THE CONNECTOR FAMILY IS ESTIMATED AS SMA from the
      photograph (knurled barrel and hex nut of about 8 mm), not stated by any document. The photograph also
      shows two green lamps in the corners of the GM jack; the guide describes no lamp there, so none is drawn.
  vents:
    confidence: photo-measured
    note: >-
      Hexagonal perforations: two staggered rows along the top edge (3.3 and 6.5 mm down), a block of five rows
      at the lower left (27.3 to 38.4 mm down, 7.8 to 65.3 mm across), a half row along the foot, and three columns
      at the right of the ports (393 to 402 mm). Drawn as vent strips on a 3.3 mm pitch; the guide's figure 14
      draws the same fields. Positions are read at 4.56 px/mm and are estimated.
  esd-and-labels:
    confidence: photo-measured
    note: >-
      At the right: the ESD terminal (callout 5), a 4.4 mm hole centred 417.5 mm across and 16.7 down, with the
      ESD symbol beneath at 25.1 mm; a laser hazard triangle at about 412.6 and 27.4, which is 8.5 mm across on the
      photograph and is drawn with the library's 5.4 mm part; and a yellow LASER RADIATION label 24.1 x 5.1 mm at
      the foot. The guide draws two blank label areas and no triangle, so THE PHOTOGRAPH WINS and the
      triangle and the label are drawn from it. The label's small print is not transcribed.
  rear-layout:
    confidence: estimated
    note: >-
      From figure 19 alone (no photograph): a 63.4 mm management panel at the left, five fan slots on a 49.2 mm
      pitch from 71.4 mm with a strip before each (fan symbol, number, lamp), then two supply slots at 316.3
      and 377.8 mm. These agree to 1.3 mm or better with the slot geometry the QFX5120-48Y rear
      photograph gives for the same chassis family (fans from 71.8 on a 49.0 pitch, supplies at 315.0
      and 376.6), so the finer figures of that photograph are used for the bays, and the panel's contents are
      read from figure 19 and the closer figures 20 and 41. The panel contents are ESTIMATED: figure 41 is a
      close-up with its own scale (it is not square to the panel), so only figure 19's x scale is used and
      its y scale is fitted to the face height.
  mgmt-panel:
    confidence: drawing
    note: >-
      Figures 20 and 41: four chassis lamps (ALM, SYS, MST, ID) at the left; two stacked SFP cages at the
      centre left, the upper marked C0 (callout 2, with the RJ45 C0 sharing the name: for C0 the copper
      jack has priority over the fibre cage) and the lower the C1 cage (callout 5); an RJ45 console port at the
      upper right (CON, callout 3) and an RJ45 management port C0 beneath it (callout 2); a USB port; and a
      recessed RESET at the foot. The printed legends read from the figure are C0 above the upper cage, CON
      beside the console and C0 under the lower jack; no C1 legend is legible. The model plate reads
      QFX5200-32C and RUNNING JUNOS. The 32C-L does not support the second management interface (C1).
  modules:
    confidence: datasheet
    note: >-
      The fan modules and the power supplies are field-replaceable units in bays, each its own component. Nothing
      on this chassis is a built-in unit that is not a bay: the supplies' own fans are inside the supplies. The
      supplies JPSU-850W-AC-AFO and JPSU-850W-AC-AFI are the library's existing components, reused as they
      are (same part number, same arrangement of lamps AC, DC and !, handle, inlet and cord retainer as figure
      40 shows); their size is the bay's, an estimate recorded on those components. The fan modules are this
      family's own, qfx5200-32c-fan-afo and -afi, drawn from figures 19 and 27.
  ears-and-kits:
    confidence: datasheet
    note: >-
      The guide describes mounting flush with the front of a four-post 19 in rack with the standard brackets, or
      recessed 2 in (5 cm) with the extension bracket, for the 32C and 32C-L only. Both are written as ear
      positions with no kit. The rack mount kits the guide names are NOT MODELLED and are not in
      `chassis.kits`: JNP-4PST-RMK-1U-E, shipped with the switch (a pair of front and rear rails, a pair of
      brackets, sixteen M4 x 6 mm screws), whose spare is also sold as EX-4PST-RMK. The guide's rail spacing
      is 23.5 to 30.6 in (59.7 to 77.7 cm) front to back. The recessed position's -50.8 mm is the guide's
      2 in; no figure measures it.
  power:
    confidence: datasheet
    note: >-
      Table 20 (AC): 200 W typical and 312 W maximum for the QFX5200-32C, 195 W typical for the 32C-L (312
      maximum), input 100 to 240 VAC at 4.5 A (100 to 120 V) or 2.0 A (200 to 240 V), 50 to 60 Hz. Table 25
      (DC): 200 W typical and 312 W maximum, -48 to -60 VDC rated, 10 A maximum. The 32C figures are filed as the
      device's; the 32C-L's 195 W is recorded in `attrs`.
  colour:
    confidence: photo-measured
    note: >-
      The front plate samples #9399a1 and #959ca4 on two bare patches of the right-hand plate; the chassis
      colour is #949aa2. The photograph is lit warmly and these are its values, not a paint reference.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-life announcement. No Juniper notice was found and the guide states none. A
      third-party tracker (router-switch.com) lists an announcement of 2021-01-20 and end of sale of
      2021-10-04 for the QFX5200-32C-AFO, -AFI and -T builds and 2024-11-15 for the -SAFO, -SAFI, -DCSAFO
      and -DCSAFI builds, so the device states none announced. Estimated, because the tracker is not the maker.
attrs:
  physical:
    weight-note: 23.5 lb (10.66 kg) fully loaded, QFX5200-32C and QFX5200-32C-L (Table 31)
  performance:
    port-speeds: >-
      QSFP28 ports 0 to 31, 100 GbE by default; 50, 40, 25 or 10 GbE by configuration or with a breakout
      cable (up to 128 logical ports)
  power:
    power-typical-w: 200
    power-max-w: 312
    power-envelope: unstated
    power-32c-l-typical-w: 195
    power-input-ac: 100 to 240 VAC, 50 to 60 Hz, 4.5 A at 100 to 120 VAC or 2.0 A at 200 to 240 VAC
    power-input-dc: rated -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum
    redundancy-note: two supplies, load-sharing; one may be removed at a time while the switch runs
  thermal:
    fans: five fan modules; the switch runs 30 seconds without thermal shutdown while one is replaced
  environmental: {operating-temp: 0 to 40 C (32 to 104 F), storage-temp: -40 to 70 C (-40 to 158 F) in the shipping
      container, humidity: 5 to 90 percent noncondensing (up to 93 percent short term), altitude: no performance
      degradation to 2000 m (6562 ft)}
  platform: {cpu: 1.8 GHz quad-core Intel, memory: 16 GB, storage: two 32 GB SSDs, software: 'Junos OS (32C); Junos OS
      Evolved (32C-L)'}
  features:
    virtual-chassis: up to three QFX5200-32C members (not the 32C-L)
    timing: RJ45 grand master clock jack (GM), 1 PPS output, 10 MHz output
    optics: >-
      100 GbE QSFP28, 40 GbE QSFP+, AOC, DAC and breakout cables; a QSFP+ to SFP+ adapter (QSA) from
      Junos OS 19.3R1
  management:
    oob: SFP management cages C0 and C1 and an RJ45 C0 (10/100/1000 BASE-T); the 32C-L has no second management
      interface
    console: RJ-45 console port (CON)
    usb: one USB port
  compliance:
    seismic: Designed to comply with Zone 4 earthquake requirements per NEBS GR-63-CORE, Issue 3 (Table 30 wording)
  lifecycle: {eol: none-announced}
chassis: {width: 440.9, height: 43.7, depth: 520.2, ru: 1, weight-kg: 10.66, color: '#949aa2', airflow: front-to-back,
  power: ac, ears: {positions: [{name: flush, at: 0, default: true}, {name: recessed, label: recessed 2 in (5 cm), at: -50.8}]}}
gaps:
- what: gm-lamps
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The two green lamps in the corners of the GM jack that the studio photograph shows. The guide's port panel
    text describes none.
- what: clock-connector
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The connector family of PPS OUT and 10M OUT (drawn as SMA from the photograph). The guide names the
    outputs and no connector.
- what: c1-legend
  scope: [rear]
  reason: needs-photo
  wanted: >-
    Whether a C1 legend is printed at the lower SFP cage, and which of C0 and C1 each cage is. No photograph of the
    FRU side exists and figure 41's legends are small.
- what: rear-photo
  scope: [rear]
  reason: needs-photo
  wanted: >-
    A straight-on photograph of the FRU side. The suggested studio address answered 404. The FRU side is drawn
    from the guide's raster figures alone, estimated.
- what: usb-generation
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The USB revision. The guide names one USB port and gives no generation, so the port is drawn with the kit's neutral usb2
    skin and no colour is claimed.
- what: module-depths
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The depth of the fan module and of the power supplies. The guide's figures are isometric and carry no scale and its
    tables state weights only.
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
  qsfp28-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The first of the four lamps of each QSFP28 port, green when a link is up (guide Table 6).
  qsfp28-channel-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: link, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: beacon, color: '#f59e0b', behavior: blinking}]
    description: The second to fourth lamps of each QSFP28 port, in port then lane order - lit for the channels of a channelized port (guide Table 7).
  timing:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the timing block at the left of the port side - an RJ45 grand master clock jack and the 1 PPS and 10 MHz
      outputs. One job (clock), two media
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD terminal on the port side (guide figure 14, callout 5)
  furniture:
    term: Item
    role: furniture
    index-origin: 0
    description: the laser hazard triangle beside the ESD terminal
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band panel at the left of the FRU side - two SFP management cages, an RJ45 console port, an RJ45
      management port, a USB port and the recessed reset button. Five kinds, one purpose: reaching and recovering
      the switch when the data plane cannot.
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The four chassis lamps ALM, SYS, MST and ID (guide Table 15).
  fans:
    term: Fan
    role: service
    index-origin: 0
    description: >-
      QFX5200 hardware guide, Component Redundancy: the 32C and 32C-L have five fan modules in the FRU panel, slots 0
      to 4 left to right; all must be installed for optimal operation. The guide states no spare-fan form (N+1) for them.
  fan-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The round status lamp beside each fan slot - green when the module is operating normally, amber blinking on an error (guide Table 18).
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: two supplies, load-sharing; one may be removed at a time while the switch runs
