configurations:
  ac-afo:
    kind: orderable
    default: true
    description: >-
      QFX5200-32C-AFO: two 850 W AC supplies (JPSU-850W-AC-AFO) and five front-to-back fan modules
      (QFX5200-32C-FANAFO). All carry the label AIR OUT and a Juniper Gold handle (guide Tables 17 and 19).
    part-numbers:
      QFX5200-32C-AFO: {}
  ac-afi:
    kind: orderable
    airflow: back-to-front
    description: >-
      QFX5200-32C-AFI: two 850 W AC supplies (JPSU-850W-AC-AFI) and five back-to-front fan modules
      (QFX5200-32C-FANAFI). All carry the label AIR IN and a Juniper Azure Blue handle (guide Tables 17 and 19).
    bays:
      psu-0: juniper/jpsu-850w-ac-afi@1
      psu-1: juniper/jpsu-850w-ac-afi@1
      fan-0: juniper/qfx5200-32c-fan-afi@1
      fan-1: juniper/qfx5200-32c-fan-afi@1
      fan-2: juniper/qfx5200-32c-fan-afi@1
      fan-3: juniper/qfx5200-32c-fan-afi@1
      fan-4: juniper/qfx5200-32c-fan-afi@1
    part-numbers:
      QFX5200-32C-AFI: {}
  dc-afo:
    kind: orderable
    power: dc
    description: >-
      QFX5200-32C-DC: two DC supplies (JPSU-850W-DC-AFO) and five front-to-back fan modules (QFX5200-32C-FANAFO). The guide
      names the DC build QFX5200-32C-DC and does not say its airflow; the front-to-back supply is the one seated, like the
      AC default. AC and DC supplies are never mixed in one 32C.
    bays:
      psu-0: juniper/qfx5200-jpsu-850w-dc-afo@1
      psu-1: juniper/qfx5200-jpsu-850w-dc-afo@1
    part-numbers:
      QFX5200-32C-DC: {}
  dc-afi:
    kind: example
    power: dc
    airflow: back-to-front
    description: >-
      Two DC supplies (JPSU-850W-DC-AFI) and five back-to-front fan modules (QFX5200-32C-FANAFI). The guide names these units
      but no chassis part number for the build.
    bays:
      psu-0: juniper/qfx5200-jpsu-850w-dc-afi@1
      psu-1: juniper/qfx5200-jpsu-850w-dc-afi@1
      fan-0: juniper/qfx5200-32c-fan-afi@1
      fan-1: juniper/qfx5200-32c-fan-afi@1
      fan-2: juniper/qfx5200-32c-fan-afi@1
      fan-3: juniper/qfx5200-32c-fan-afi@1
      fan-4: juniper/qfx5200-32c-fan-afi@1
  l-ac-afo:
    kind: orderable
    description: >-
      QFX5200-32C-LAFO: the QFX5200-32C-L, the same port panel running Junos OS Evolved, with two 850 W AC supplies
      (JPSU-850W-AC-AFO) and five front-to-back fan modules (QFX5200-32C-FANAFO, shared with the -AFO build). The -32C-L takes
      AC supplies only and has no second management interface (C1).
    component-attrs:
      mgmt-sfp-c1:
        support: not supported on the QFX5200-32C-L (no second management interface)
    part-numbers:
      QFX5200-32C-LAFO: {}
  l-ac-afi:
    kind: orderable
    airflow: back-to-front
    description: >-
      QFX5200-32C-LAFI: the QFX5200-32C-L with two 850 W AC supplies (JPSU-850W-AC-AFI) and five back-to-front fan modules
      (QFX5200-32C-FANAFI, shared with the -AFI build). The -32C-L takes AC supplies only and has no second management
      interface (C1).
    bays:
      psu-0: juniper/jpsu-850w-ac-afi@1
      psu-1: juniper/jpsu-850w-ac-afi@1
      fan-0: juniper/qfx5200-32c-fan-afi@1
      fan-1: juniper/qfx5200-32c-fan-afi@1
      fan-2: juniper/qfx5200-32c-fan-afi@1
      fan-3: juniper/qfx5200-32c-fan-afi@1
      fan-4: juniper/qfx5200-32c-fan-afi@1
    component-attrs:
      mgmt-sfp-c1:
        support: not supported on the QFX5200-32C-L (no second management interface)
    part-numbers:
      QFX5200-32C-LAFI: {}
