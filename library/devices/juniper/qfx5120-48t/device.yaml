  ac-f2b:
    kind: orderable
    default: true
    description: >-
      QFX5120-48T-AFO: two 650 W AC supplies (JPSU-650W-AC-AO) and five front-to-back fan modules (QFX5110-FANAFO).
      All have a Juniper Gold handle and the label AIR OUT (guide Table 7).
    part-numbers:
      QFX5120-48T-AFO: {}
  ac-b2f:
    kind: orderable
    airflow: back-to-front
    description: >-
      QFX5120-48T-AFI: two 650 W AC supplies (JPSU-650W-AC-AI) and five back-to-front fan modules (QFX5110-FANAFI).
      All have a Juniper Azure Blue handle and the label AIR IN (guide Table 7).
    bays: {psu-0: juniper/jpsu-650w-ac-ai@1, psu-1: juniper/jpsu-650w-ac-ai@1, fan-0: juniper/qfx5110-fanafi@1,
      fan-1: juniper/qfx5110-fanafi@1, fan-2: juniper/qfx5110-fanafi@1, fan-3: juniper/qfx5110-fanafi@1,
      fan-4: juniper/qfx5110-fanafi@1}
    part-numbers:
      QFX5120-48T-AFI: {}
  dc-f2b:
    kind: orderable
