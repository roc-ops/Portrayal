format: 1
kind: device
name: qfx5120-48t
version: 0.1.1
maturity: modelled
manufacturer: Juniper
model: QFX5120-48T
portfolio: {line: QFX Series, family: QFX5120}
description: >-
  Juniper QFX5120-48T, a 1RU data-centre access switch running Junos OS. It has 48 10GBASE-T ports (10
  or 1 GbE) and 6 QSFP28 ports (100 or 40 GbE, channelizable). The 54 ports and their lamps are on the
  port side. The rear carries two power supplies, five fan modules, the console and one RJ-45 management
  port. It also has a USB port, the PPS OUT and 10M OUT timing ports, the reset button and the four chassis
  lamps. It ships as one front panel in four power and airflow variants. They have AC or DC supplies,
  with airflow front-to-back (AIR OUT) or back-to-front (AIR IN). An 850 W high-voltage supply is orderable
  separately and is not modelled.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper QFX5120 Switch Hardware Guide, published 2026-09-30, 339 pages (copyright Hewlett Packard
      Enterprise Development LP; the PDF states no terms of use beyond the copyright notice, and a reference
      copy is kept outside the repository), from https://www.juniper.net/documentation/us/en/hardware/qfx5120/qfx5120.pdf:
      the front and rear figures 24 to 29 (the flat views are g051223 and g051224), Table 4 (release and
      features), Table 5 (channelization), Table 6 (Virtual Chassis), Table 7 (models and variants), Table
      9 (physical specifications), Tables 11, 13, 16 and 17 (the lamps), Tables 23 to 26 (fan modules
      and AC supplies), Tables 28, 35, 36 and 38 (power and the DC supplies), Tables 43 to 46 (the high-voltage
      supplies), Table 50 (environment) and the section on connecting 1-PPS and 10-MHz measurement devices.
      Juniper's studio photographs of the 48T, front and rear, 2100 x 541 and 2100 x 567 px (image library,
      www.juniper.net/content/dam/www/assets/images/us/en/image-library/qfx-series/qfx5120-48t/ qfx5120-48t-front-high.jpg
      and -rear-high.jpg; no terms of use are stated on the files, and nothing of either is copied here,
      since every skin is drawn new from measurements). THE QFX5120 ETHERNET SWITCH DATASHEET (juniper.net/content/dam/www/assets/datasheets/us/en/switches/qfx5120-ethernet-switch-datasheet.pdf)
      DID NOT ANSWER: both attempts to fetch it timed out with no bytes received, so no datasheet figure
      is used and every figure here is the guide's or is read off a photograph. No mechanical drawing,
      Visio stencil or 3D model was found for the QFX5120-48T. The intake folders held for the Juniper
      EX and QFX lines were not readable from the host this was built on (permission denied), so none
      could be looked in.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 9: 1.72 in (4.37 cm) high, 17.36 in (44.09 cm) wide, 20.48 in (52.02 cm) deep excluding
      the fan and power supply handles, 24.25 lb (11 kg) with two supplies and the fans. The width is
      the body: the table says the outer edges of the front mounting brackets extend it to 19 in, so the
      brackets are not part of the body and are not modelled. Table 9 gives the 48T, 48Y and 48YM one
      set of dimensions (the 48T's weight is its own).
  gate-1:
    confidence: estimated
    note: >-
      The front studio photograph is orthographic enough to measure: its body, between the left rim and
      the right edge, is 1887 px wide and about 187 px high (top edge row 151.5, bottom row 338.5), an
      aspect of 10.09 against the table's 440.9 / 43.7 = 10.09. Scale 4.28 px/mm across and down. The
      rear photograph reads 1878 px across (4.26 px/mm); its bounding box also catches the drop shadow,
      so its top edge was read on a 5 times crop (row 178.5) and the height taken from the table at the
      same scale. The guide's own flat figures 24 and 25 are the same pictures at 1500 px wide and agree
      with the photographs on every count and legend.
  ports:
    confidence: estimated
    note: >-
      Front photograph, dark jack openings across the upper row: 24 columns of 54 px (12.6 mm) openings
      on a pitch of 60.2 px, which is 14.07 mm, in four blocks of six columns. THE PITCH IS 0.7 PERCENT
      OVER THE REGISTRY'S 13.97 mm (0.550 in) for a ganged RJ-45 jack and the measured figure is used:
      the same photograph reads the 48Y's SFP28 pitch to 0.01 mm of the registry, so the scale is not
      the cause. The block starts are at 169, 558, 1213 and 1603 px, so the cells start at 11.45, 102.3,
      255.4 and 346.5 mm: a stride of 90.9 mm inside each pair of blocks, a gutter of 6.5 mm, and the
      six QSFP28 ports between the pairs. The six QSFP28 ports are three columns of two, openings 81 px
      (18.9 mm) wide on a pitch of 84 px, which is 19.63 mm: THE REGISTRY'S 19.0 MM PITCH IS NOT USED,
      because the cages share one frame and the photograph reads 19.4 to 19.9 mm across it. They start
      at 939 px, 191.4 mm. Counts are 48 and 6, the guide's callouts 1 and 2 of figure 26. The cells use
      the registry's apertures (12.7 x 11.0 and 18.5 x 9.58).
  row-pitch:
    confidence: estimated
    note: >-
      Down the first jack column the openings (latch slot included) are 191 to 239 px and 254 to 299 px,
      which are 9.3 mm and 23.9 mm below the top edge, a row pitch of 14.7 mm. The QSFP28 cages read 193
      to 231 px and 261 to 300 px, centres 14.1 and 30.0 mm below the top edge, a row pitch of 15.9 mm,
      with the cell height 9.58. y is good to about 0.25 mm.
  jack-shell:
    confidence: estimated
    note: >-
      Each block of jacks sits in a bright metal frame, 88.8 mm wide and 26.6 mm high, and the six QSFP28
      cages in one of 59.3 by 26.0 mm: panel and not part, drawn as five decor rectangles. In the upper
      row the contacts of each jack are at the foot of its opening and the latch slot at the top; in the
      lower row they are the other way up, the library's stacked-jack convention. The QSFP28 cages show
      a perforated plate between the rows and the latch tongue of each lower cage at its top; the lower
      cage is turned 180.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed on the metal and read off the photograph at 3 to 5 times and figure 24: all the jack numerals
      are above the upper row. Each column carries two, each beside its lamp triangle: the left numeral
      is the upper jack (even) with a lamp pointing up to its right, the right numeral the lower jack
      (odd) with a lamp pointing down to its left, so a block reads 0, 1 2, 3 4 ... 22, 23 from left to
      right, the pairs sitting across the column boundaries. The QSFP28 ports are 48 and 49 down the first
      column, 50 and 51, 52 and 53, printed in one line under the cages: an up arrow, the even number
      and its lamp, then a down arrow, the odd number and its lamp. Interface names are not printed and
      the guide held does not state them; none is written here.
  port-lamps:
    confidence: estimated
    note: >-
      Each BASE-T port has one lamp (guide Table 16): an arrow-shaped window, the up-pointing one for
      the upper jack, centred 2.95 mm and 9.55 mm from the column's left edge and 7.4 mm below the top
      edge, read at 4 times and good to 0.3 mm. Each QSFP28 port has one lamp (Table 17), a round window
      to the right of its numeral in the strip under the cages, at 38.7 mm. Table 16 gives green for 10
      Gbps and yellow for 1 Gbps, steady with no activity and blinking with it, and yellow blipping for
      the beacon; the lamps are unlit in the photograph, so the colours are the table's. Table 17 gives
      green for 100 or 40 Gbps (and for four 25 or 10 Gbps channels) and yellow blipping for the beacon
      on a channelized port; "blipping" is written as blinking.
  vents:
    confidence: estimated
    note: >-
      Hexagonal holes in two staggered rows along the top edge (0.3 to 5.2 mm down) and along the foot
      (38.6 to 43.5 mm), from 9.6 to 431.7 mm, 3.28 mm apart along a row; the foot strip is drawn in three
      parts so that the lamps and numerals under the QSFP28 cages do not print on air (190.0 to 251.0
      mm carries only the lower, half-hole row). Each is a vent strip on the pitch read at 4 times, estimated:
      the pattern is a rectangular approximation of a hexagon field.
  front-blue-bar:
    confidence: estimated
    note: >-
      A light blue bar stands at the right edge, 2.2 mm wide, between 12.3 and 32.7 mm down. The guide's
      text does not name it; it is drawn as decor and recorded as a gap. The photographed unit is the
      front-to-back build.
  rear-layout:
    confidence: estimated
    note: >-
      Rear photograph at 4.26 px/mm, checked against the guide's figure 25 and the callouts 1 to 13 of
      figures 27 to 29. At the left a 63.2 mm panel carries the four chassis lamps, the stacked RJ-45
      pair (MGMT above, console below, in one shield), the USB port with its trident under it, the PPS
      OUT and 10M OUT jacks one above the other, the ESD point with its symbol, the maker's logo (not
      drawn: a logo-zone is reserved), the CON and RESET legends with the reset pinhole, and the model
      chip. Then five fan slots numbered 0 to 4 on a 49.0 mm pitch, each preceded by a strip with its
      fan symbol, number and lamp, then the two supply slots, each preceded by a strip with its power
      symbol and number, and at the right edge a dark strip carrying a vertical rating label. The fan
      and supply slots are those of the 48Y and 48YM (the photographs agree to the pixel).
  mgmt-ports:
    confidence: photo-measured
    note: >-
      One RJ-45 management port, labeled MGMT (callout 2; figures 28 and 29 print no label), above the
      console jack, with two lamp windows at its top corners (Table 13: a link activity lamp and a status
      lamp). It is not printed C0 or C1, the labels of the 48Y and 48YM. The console jack below it has
      two lamp windows at its foot in the photograph though it has no lamp.
  timing-jacks:
    confidence: estimated
    note: >-
      Guide, Connecting 1-PPS and 10-MHz Measurement Devices to the QFX5120 Switch: the 48T and 48YM carry
      one 2x1 DIN 1.0/2.3 connector set with a PPS OUT and a 10M OUT port, TTL (5 V) and a cable up to
      3 m. Two 1.0/2.3 jacks are placed, PPS OUT above 10M OUT, as on the 48YM. The photograph shows gold-centred
      round connectors, 5.6 mm across.
  rear-photo-vs-drawing:
    confidence: photo-measured
    note: >-
      Figure 25 and the photograph agree, and both show the front-to-back (AIR OUT) build, orange (Juniper
      Gold) handles: it is the default configuration. Table 7 and Table 26 settle the colours: AIR OUT
      with Juniper Gold for front-to-back, AIR IN with Juniper Azure Blue for back-to-front.
  modules:
    confidence: datasheet
    note: >-
      The fan modules (QFX5110-FANAFO and -FANAFI, Table 23) and the power supplies (AC JPSU-650W-AC-AO
      and -AI, Table 25; DC JPSU-650W-DC-AFO and -AFI, Table 35) are field-replaceable units in bays,
      each its own component. THE LIBRARY ALREADY HOLDS EACH BY ITS PART NUMBER, so they are reused as
      they are and none is added: the fans and the AC supplies are the QFX5120-48Y's (juniper/qfx5110-fanafo@1,
      -fanafi@1, jpsu-650w-ac-ao@1, -ai@1), and the DC supplies are the QFX5100's, which carries the same
      part numbers (juniper/qfx5100-jpsu-650w-dc-afo@1 and -afi@1; the face is that of the QFX5100's photograph,
      with its estimated size, and whether the same hardware is photographed in two chassis cannot be
      settled from the documents held). The 48T also takes two 850 W high-voltage supplies with AC or
      DC input, JPSU-850W-HV-AFO and -AFI (Tables 43 and 44), which are ordered separately: the library
      holds no component for them, none is written here, and the bays do not list them. Nothing on this
      chassis is a built-in unit that is not a bay. The guide says to fit a blank cover over an empty
      supply slot but names no part number for it, so no blank is modelled and no empty-bay configuration
      is offered. The guide lists no -S variant.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide lists the rack mount kit JNP-4PST-RMK-1U-E (shipped with the switch; also
      sold as EX-4PST-RMK) and describes flush, recessed and two-post mounting with the brackets; the
      library holds no kit contract for it and none is written here, so `chassis.ears` and `chassis.kits`
      are left out and a gap says so. The modelled body is the 440.9 mm chassis, without brackets.
  power:
    confidence: datasheet
    note: >-
      Table 28 (AC supplies, QFX5120-48T): 202 W typical, 251 W maximum, input 100 to 240 VAC at 5 A.
      Table 38 (DC supplies): 222 W typical and 227 W maximum, 10 A, rated -48 to 60 VDC, operating range
      -44 to 72 VDC. The two tables carry different figures for the same box and the guide states no ambient
      or scope for either, so both are kept and the AC pair is filed as the device's, since AC is the
      default build. The high-voltage supplies (Tables 45 and 46) give 290 W typical and 440 W maximum
      with AC input; they are not modelled.
  colour:
    confidence: estimated
    note: >-
      The front plate samples #95959d (median of a bare patch between the blocks) and the rear panel #757a81.
      The chassis colour is the front's. The photograph is lit warmly and these are its values, not a
      paint reference.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-life announcement on 2026-10-22. No Juniper notice was found and the guide
      states none. Third-party trackers list an announcement of 2021-01-20 and end of sale of 2021-10-04
      for QFX5120-48Y part numbers only, and none for the 48T, so the device states none announced. Estimated,
      because the trackers are not the maker.
attrs:
  physical:
    weight-note: 24.25 lb (11 kg) with two power supplies and five fan modules installed (Table 9)
    depth-note: 20.48 in (52.02 cm) excluding the fan and power supply handles (Table 9)
  performance:
    aggregate-throughput: 2.16 Tbps, bidirectional (Table 4)
    rj45-speeds: 10 or 1 GbE (guide Table 16)
    qsfp28-speeds: >-
      100 or 40 GbE. Ports 50 and 51 channelize to 4 x 25 or 4 x 10 GbE. Ports 48 to 53 channelize to
      2 x 50 GbE (Table 5)
  power:
    power-typical-w: 202
    power-max-w: 251
    power-envelope: unstated
    power-dc-typical-w: 222
    power-dc-max-w: 227
    power-input-ac: 100 to 240 VAC, 50 to 60 Hz, 5 A
    power-input-dc: rated -48 to -60 VDC, operating range -44 to -72 VDC, 10 A maximum
    redundancy-note: two supplies, load-sharing and fully redundant; both should be installed
  thermal:
    fans: >-
      five fan modules, 4+1; the switch runs 30 seconds without thermal shutdown while one is replaced
  environmental: {operating-temp: 0 to 40 C (32 to 104 F) normal operation, storage-temp: -40 to 70 C
      (-40 to 158 F) in the shipping container, humidity: 5 to 90 percent noncondensing, altitude: no
      performance degradation to 1829 m (6000 ft)}
  platform: {cpu: 2.2 GHz quad-core Intel, memory: 16 GB, storage: 100 GB SSD, software: 'Junos OS, first
      release 20.2R1'}
  features:
    virtual-chassis: >-
      up to 2 switches of the same model; any non-channelized QSFP28 port (48 to 53) can be a virtual
      chassis port, from 20.2R1
    timing: PPS OUT and 10M OUT measurement ports (DIN 1.0/2.3, TTL 5 V); PTP supported
    optics-qsfp28: 100 GbE or 40 GbE; channelizes as in guide Table 5
  management:
    oob: one RJ-45 management port (MGMT) with link activity and status lamps
    console: RJ-45 console port (CON)
    usb: one USB port
  lifecycle: {eol: none-announced}
chassis: {width: 440.9, height: 43.7, depth: 520.2, ru: 1, weight-kg: 11.0, color: '#95959d', airflow: front-to-back,
  power: ac}
gaps:
- what: mounting-kit
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    The depth ranges of the JNP-4PST-RMK-1U-E and EX-4PST-RMK kits and the positions of their brackets.
    The guide describes the kits in prose and gives figures per step but no dimension; the library holds
    no kit contract for them.
- what: high-voltage-supplies
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    The JPSU-850W-HV-AFO and -AFI supplies the guide lists for the 48T (Tables 43 to 47), ordered separately.
    The library holds no component for them and no photograph or dimension of them was found.
- what: front-blue-bar
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    What the light-blue bar at the right edge of the port side is. The guide's text and its callouts do
    not name it; the chassis ID lamp is on the rear.
- what: usb-generation
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The USB revision. The guide names one USB port and gives no generation. The port is drawn with the
    kit's neutral usb2 skin because the tongue colour follows the photograph (qfx5120-48t-rear-high.jpg),
    which shows a pale tongue, not the blue of a USB 3.0 port.
- what: module-depths
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The depth of the fan module and of the power supplies. The guide's figures are isometric and carry
    no scale and its tables state weights only.
- what: rating-label
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    The vertical rating label at the right edge of the rear (an AC input line, a DC input line and a line
    about each power supply). It is only partly legible in the photograph and is not drawn.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 10g}
    description: >-
      48 ports labelled 0 to 47, the even ports on the upper row. Each runs at 10 GbE or 1 GbE (guide
      Table 7, Table 16).
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      Ports 48 to 53 as printed, rel-pos carrying the printed number, since the origin token cannot express
      a block that starts at 48.
  rj45-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: 10g, color: '#22c55e'}
    - {name: 10g-activity, color: '#22c55e', behavior: blinking}
    - {name: 1g, color: '#f59e0b'}
    - {name: 1g-activity, color: '#f59e0b', behavior: blinking}
    - {name: beacon, color: '#f59e0b', behavior: blinking}
    description: >-
      The one lamp of each 10GBASE-T port, an arrow over the column (guide Table 16; yellow blipping is
      the beacon).
  qsfp28-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: link, color: '#22c55e'}
    - {name: activity, color: '#22c55e', behavior: blinking}
    - {name: beacon, color: '#f59e0b', behavior: blinking}
    description: The one lamp of each QSFP28 port, in the strip beneath the cages (guide Table 17).
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band cluster at the left of the rear - an RJ-45 console port, an RJ-45 management port,
      a USB port and the recessed reset button. Four kinds, one purpose: reaching and recovering the switch
      when the data plane cannot.
  timing:
    term: Port
    role: management
    index-origin: 0
    description: >-
      the two measurement outputs, 1-PPS and 10-MHz, on 1.0/2.3 coaxial jacks - a reference for test equipment
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The four chassis lamps ALM, SYS, MST and ID (guide Table 11).
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: 4+1
      redundancy-note: >-
        QFX5120 hardware guide, Fan Modules for QFX5120 Switches: the 48T, 48Y and 48YM ship with five
        fan modules (4+1 redundancy) in the rear panel, slots 0 to 4 left to right; all five should be
        installed and only one removed at a time
  fan-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      The round status lamp beside each fan slot - green when the module is engaged and healthy, amber
      blinking on an error (guide Table 24).
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: 1+1
      redundancy-note: two supplies, load-sharing; one may be removed at a time while the switch runs
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD point on the rear panel (guide figure 27, callout 4)
