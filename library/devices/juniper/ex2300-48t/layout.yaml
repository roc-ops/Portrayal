format: 1
kind: device
name: ex2300-48t
version: 0.4.0
maturity: modelled
manufacturer: Juniper
model: EX2300-48T
portfolio: {line: EX Series, family: EX2300}
description: >-
  Juniper EX2300-48T is a fixed 1RU Gigabit Ethernet access switch. It has 48 10/100/1000BASE-T ports
  without PoE and four built-in 10-Gigabit SFP+/SFP uplink ports. The front carries the 48 jacks in two
  stacked rows numbered 0 to 47, and the upper jack of a column takes the even number. It also carries the
  four uplinks numbered 0 to 3, three status lamps, three port-mode lamps, a Factory Reset/Mode button and a
  mini-USB console port. The rear carries the management Ethernet port with a USB port under it, the RJ-45
  console port, a two-hole earthing terminal and an ESD point. It also carries one exhaust fan and the AC
  power cord inlet. The power supply and the fan are built into the chassis, so there are no bays. The -TAA
  and -VC part numbers are the same chassis. The EX2300-48P is the same front with PoE.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX2300 Switch Hardware Guide, Juniper Networks, published 2025-08-12 (314 pages;
      https://www.juniper.net/documentation/us/en/hardware/ex2300/ex2300.pdf): Figure 3 and Figure 4 (front
      panels), Figure 9 to Figure 13 (rear panels), Table 1 (models), Table 3 (chassis size and weight), Tables 4
      to 12 (LEDs), the cooling system section, Tables 14 to 16 (power) and Table 34 (parts list). Juniper's own
      straight-on studio photographs of the EX2300-48P front and rear and of the EX2300-24P front. The maker's
      image library holds no photograph of the EX2300-48T (the address the brief gave returned a page, not an
      image). The HPE PSNow datasheet (a00151236enw) did not answer when fetched, so no datasheet is cited.
  gate-1:
    confidence: measured
    note: >-
      The 48P front photograph is 1500 x 300 px with the body 1432 px across and about 142 down (the lower edge
      carries a shadow): 10.1 against the stated 441.9 / 44.45 = 9.94, so x is taken at 3.24 px per mm from the
      width and y at 3.19 px per mm from the height. The ganged jack pitch reads 13.96 mm, the 0.550 in pitch the
      registry records for the ganged RJ-45 cell, on a quantity the scale never saw. The 24P photograph agrees on
      every feature both show to within 0.7 mm in x and 1.4 mm in y; the y values here are the mean of the two.
      The 48P rear photograph reads 3.234 px per mm across and 3.09 down. Every position is estimated and good to
      about a millimetre.
  chassis:
    confidence: datasheet
    note: >-
      Table 3: height 1.75 in (4.45 cm), width 17.4 in (44.19 cm) and 19 in (48.26 cm) with the mounting brackets
      attached, depth 10.2 in (25.9 cm) for models without PoE capability, weight 8.28 lb (3.76 kg). 441.9 x
      44.45 x 259.0 is carried: the metric as printed for width and depth and the height as the 1U pitch Table 35
      gives (1.75 in, 4.45 cm). The photographs show no ears, and the jack pitch closing on the registry at that
      width says the figure is the body.
  front-layout:
    confidence: estimated
    note: >-
      estimated - the 48-port front is the 48P photograph's without the PoE items: the guide says the PoE lamp is
      present only on models with PoE capability, so three port-mode lamps (SPD, DX, EN) and no POE legend, and the
      red PoE+ mark beside the model name is not drawn. No photograph of a non-PoE front exists, so the model name
      is printed EX2300 as on the PoE units. The 48 jacks stand in four shells of six columns, the first jack at
      9.36 mm and the shell step 88.8 mm (6 x 13.97 plus a 5.0 gutter), so the last shell ends where the uplink block
      begins at 364.6; the rows are 14.8 mm apart and the upper row is turned 180 so its lamps and keyway are
      above, as the photograph shows. The four SFP+ cages abut on the registry pitch of 14.25 at 364.6, one row. A
      darker plate carries the model legend and lamps at the top right and runs down the far right edge. The
      hexagonal vent fields along the top edge and above the uplinks, and the slotted row along the bottom edge, are
      read off the same photographs. The flower mark beside JUNOS, a logo, is not drawn.
  port-numbering:
    confidence: photo-measured
    note: >-
      photo-measured - the photograph prints each column's two numbers in orange under the shell, the even number
      up and left and the odd number down and right (0 and 1, 2 and 3, ... 46 and 47), so the upper jack takes the
      even number; the uplinks print 0 to 3 in white between their two lamps. Port numbers are as printed on the
      metal, from 0. The Junos interface names are not printed: the guide's Table 2 gives PIC 0 as 48x10/100/1000
      Base-T and PIC 1 as 4x10G SFP/SFP+, i.e. ge-0/0/0 to ge-0/0/47 and xe-0/1/0 to xe-0/1/3; they are recorded here
      and not in an interfaces block because the faceplate does not print them. Table 11 notes that on the
      EX2300-48T only the ports labelled 0/0 through 0/15 and 0/24 through 0/39 support half-duplex.
  lamps:
    confidence: datasheet
    note: >-
      Hardware guide, Tables 4 to 12 and Figures 24, 26 and 27. Each RJ-45 port and uplink has two lamps,
      Link/Activity and Status; Figure 24 puts Link/Activity on one corner of the jack and Status on the other. The
      Status lamp reads out whichever of SPD, DX and EN the Factory Reset/Mode button has selected (PoE too on a
      PoE model), shown by which port-mode lamp is lit. SYS is green, ALM red or yellow and MST green. The jack
      lamps keep the component's link and activity vocabulary because a block cannot override it per lamp. On the
      uplinks the left slot is taken as Link/Activity and the right as Status by analogy with the jacks, which no
      figure confirms, so it is estimated.
  uplinks:
    confidence: photo-measured
    note: >-
      photo-measured - one row of four SFP+/SFP cages numbered 0 to 3 with a pair of lamp slots flanking each
      numeral; the guide gives 4x10G SFP/SFP+ and says the ports can be Virtual Chassis ports with SFP+
      transceivers but not with SFP.
  front-console:
    confidence: estimated
    note: >-
      estimated - the mini-USB console port (guide Figure 4, callout 5, printed CON) is the placed std/mini-usb
      (`console-usb`), centred on the 7.9 x 4.6 mm shell this device was drawn with, which was read off the 24P
      and 48P photographs (25 x 14 px and 24 x 14 px at 3.27 px per mm). The part draws the registry's 7.7 x 3.9 mm
      Mini-B shell, which stands in for the maker's own (gap `mini-usb-console-shell`). The guide names the
      connector: "Mini-USB Type-B (5-pin)" (Console Ports, p4; Mini-USB Port Pinout Specifications, p86).
  rear-layout:
    confidence: estimated
    note: >-
      estimated - positions off the 48P rear photograph (3.234 px per mm across, 3.09 px per mm down) for the
      management and console jacks, USB port, earthing terminal and AC inlet, which Figure 12 shows at the same
      places on the 48-port non-PoE model. Figure 12 draws the ESD point lower and to the right of the earthing
      plate and the single exhaust fan at 0.263 of the width (116.2 mm), as the DC rear photograph does, so the
      ESD symbol and point and the fan take that photograph's positions; no earth symbol is drawn because the DC
      photograph shows none and no photograph shows this rear. The guide's drawing puts a serial number label and a CLEI label on the
      rear; the studio photographs show neither, so none is drawn. The five edge screws are read off Figure 12
      (the body 874 px across at 1.978 px per mm, the first at 52.1 mm and the last at 386.7 mm, centres, drawn
      at y 37.4 as on the DC rear) and are estimated; no photograph of this rear is held, and the held NetBox 24T
      rear elevation shows the 24-port non-PoE rear, which carries nine. The AC legend is drawn from the
      guide's Table 15 (1.2 A at 100 VAC for this model) and not read off a figure.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Hardware guide, Power Supply in EX2300 Switches: "The power supply in EX2300 switches is built in along the
      rear panel of the chassis"; Table 34 lists "Switch with built-in power supply"; the cooling system is "two
      fans built-in along the rear of the chassis" and the non-PoE rears (Figures 11 to 13) show a single exhaust
      opening. Nothing in the guide describes removing or replacing either. They are part of the chassis, not bays
      and not components.
  airflow:
    confidence: datasheet
    note: >-
      the cooling system provides front-to-back chassis cooling (Figure 38 for models without PoE).
  power:
    confidence: datasheet
    note: >-
      Table 14: maximum power consumed by the switch 70 W, no PoE; Table 15: 100 through 240 VAC, 50/60 Hz, 1.2 A at
      100 VAC and 0.6 A at 240 VAC.
  colour:
    confidence: photo-measured
    note: >-
      median of the bare front plate in the 24P photograph (#919599); the plate at the top right #6e7276.
  ground-stud-pitch:
    confidence: estimated
    note: >-
      INFERRED, NOT STATED. Table 36 names two 10-32 x .25 in. screws with #10 split-lock washers and a Panduit
      LCC10-14AW-L lug or equivalent (not provided) for the EX2300 and EX2300-C, and gives no spacing. The rear
      photograph puts the two holes 15.9 mm apart: 5/8 in. (15.875) and not 3/4 in. (19.05). The lug's own code is not
      in the library's registry, so it is the photograph that carries the pitch. The terminal is
      `common/ground-hole-pair-5-8-10-32@1`: two bare 10-32 holes on 5/8 in. centres, presenting `stud-pair-5-8`, so
      one two-hole lug (`generic/two-hole-lug-5-8@1`) lands across them and a ring lug still lands on either hole. The
      holes stay bare, as the held photographs of the EX2300-24P and -48P show them; the screws that hold the lug
      are not part of the switch. The holes were drawn 15.9 apart as decor and the pair stands on their midpoint.
attrs:
  physical:
    weight-note: 8.28 lb (3.76 kg), Table 3
  power:
    power-max-w: 70
    power-envelope: bare
    power-input: 100 through 240 VAC, 50/60 Hz
    power-current-max: 1.2 A at 100 VAC; 0.6 A at 240 VAC
  thermal:
    cooling: one built-in fan, front-to-back
  environmental:
    operating-temp-c: 0 to 45
    humidity: 10 to 85 percent, noncondensing
    altitude-ft: 13,000 at 40 C
  features:
    optics-sfp-plus: >-
      hardware guide, Uplink Ports: the four uplink ports take SFP and SFP+ transceivers.
      A Virtual Chassis can be formed with SFP+ and not with SFP
    virtual-chassis: >-
      up to four switches; the -VC part number ships with the Virtual Chassis licence on paper, the other part
      numbers do not
chassis:
  width: 441.9
  height: 44.45
  depth: 259.0
  ru: 1
  weight-kg: 3.76
  color: '#919599'
  airflow: front-to-back
  power: ac
gaps:
- what: mini-usb-console-shell
  scope: [console-usb]
  reason: needs-photo
  note: >-
    The part is the registry's Mini-B receptacle (Molex drawing SD-54819-026, 7.7 x 3.9 mm). The front
    photographs show the console shell at about 25 x 14 px at 3.27 px per mm, 7.6 x 4.3 mm, and no close-up is
    held, so the drawn shell and its place are estimates and the maker's own shell may differ by a few tenths.
  wanted: A straight-on close-up of the console port with a scale, or the maker's dimensioned drawing of it.
- what: rack-ears
  scope: [front]
  reason: needs-drawing
  note: >-
    Table 35 lists the supplied two-post mounting brackets and a separately orderable four-post rack-mount kit
    (EX-4PST-RMK, named in the clearance section); no figure measures a bracket position, so no ear position is
    stated and no kit is listed.
  wanted: A dimensioned drawing of the bracket positions.
- what: eol
  scope: [front]
  reason: vendor-silent
  note: >-
    Searched for an end-of-life notice: only third-party lifecycle trackers answered; Juniper's own bulletin was
    not found, so no lifecycle is written.
  wanted: Juniper's end-of-life bulletin for the EX2300 line.
- what: front-photograph
  scope: [front]
  reason: needs-photo
  note: >-
    The maker's image library holds no EX2300-48T photograph; the front is the 48P's without the PoE items.
  wanted: A straight-on studio photograph of the EX2300-48T front.
- what: rear-photograph
  scope: [rear]
  reason: needs-photo
  note: >-
    No photograph of the 48-port non-PoE rear exists in the maker's library; its rear is the 48P's photographed
    parts at the positions of the guide's Figure 12, with one fan; the edge screws are placed from that figure (estimated).
  wanted: A straight-on studio photograph of the EX2300-48T rear.
- what: jack-lamp-meaning
  scope: [rj45]
  reason: vendor-silent
  note: >-
    The jack lamps carry the component's link and activity vocabulary; the guide's Status lamp switches meaning
    with the mode button and no per-lamp state list fits the component.
  wanted: none beyond the component's own vocabulary.
- what: ground-pair-pitch
  scope: [ground-pair]
  reason: vendor-silent
  note: >-
    The guide names the screws and the lug and gives no spacing for the two holes; `ground-stud-pitch` says what the
    pair is drawn at and why.
  wanted: a drawing that dimensions the two holes, or the lug's own datasheet
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g}
    description: >-
      the 48 built-in 10/100/1000BASE-T ports; rel-pos carries the number printed on the faceplate, the upper
      jack of a column takes the even number
  uplink:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: the four built-in SFP+/SFP uplink ports, numbered 0 to 3
  uplink-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: two lamps beside each uplink numeral, Link/Activity and Status
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      how the switch is reached out of band - the mini-USB console port on the front, the RJ-45 console port, the
      management Ethernet port and the USB port on the rear
  controls:
    term: Button
    role: management
    index-origin: 0
    description: the Factory Reset/Mode button
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the SYS, ALM and MST chassis status lamps
  mode-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the SPD, DX and EN port-mode lamps; the one lit says what each Status lamp shows
  power-input:
    term: Inlet
    role: service
    index-origin: 0
  esd:
    term: Point
    role: furniture
    index-origin: 0
  furniture:
    term: Item
    role: furniture
    index-origin: 0
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the earthing terminal, two bare 10-32 holes for a two-hole lug (Table 36)
