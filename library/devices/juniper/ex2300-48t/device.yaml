    description: >-
      EX2300-48T - 48 10/100/1000 ports without PoE and four SFP+/SFP uplinks, built-in AC supply and
      one built-in fan, front-to-back airflow. Table 1, no Virtual Chassis licence.
    default: true
    part-numbers:
      EX2300-48T: {}
  taa:
    kind: orderable
    description: >-
      EX2300-48T-TAA - the same chassis sold as Trade Agreements Act compliant (Table 1); the front panel
      and rear are those of the EX2300-48T.
    part-numbers:
      EX2300-48T-TAA: {}
  vc:
    kind: orderable
    description: >-
      EX2300-48T-VC - the same chassis with the Virtual Chassis licence (Table 1). The packing list adds
      a paper licence. The front panel and rear are those of the EX2300-48T.
    part-numbers:
      EX2300-48T-VC: {}
