format: 1
kind: device
name: ex4100-h-24mp
version: 0.2.0
maturity: modelled
manufacturer: Juniper
model: EX4100-H-24MP
portfolio: {line: EX Series, family: EX4100-H}
description: >-
  Juniper EX4100-H-24MP is a hardened (industrial), fanless 1RU multigigabit PoE++ access switch with 24 RJ-45 ports (eight 1/2.5 Gbps
  and sixteen 1 Gbps, all PoE++ at 90 W by default), four 1/10 Gbps SFP/SFP+ Virtual Chassis or uplink ports and four 1/10 Gbps SFP/SFP+
  MACsec uplink ports. The front carries the jacks in two shells numbered 0 to 23, a USB Type-C console port, a reset pinhole, a Mode
  button, a plug-in dry contact alarm connector, the management Ethernet port over a USB Type-A port over an RJ-45 console port, the chassis
  and port mode lamps, the two cage groups, the PSU lamps, and at the right a terminal door over the power input terminals of both power
  supply slots. The rear carries an ESD point, a two-hole earthing terminal, a physical security lock slot and two field-replaceable power
  supply slots, a 340 W AC or DC supply in the first and a blank over the second. There is no fan. The EX4100-H-24F is the same box with
  24 SFP ports in place of the jacks and no PoE.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX4100-H Switch Hardware Guide, Juniper Networks (copyright Hewlett Packard Enterprise Development LP), published 2026-10-01, 299 pages,
      https://www.juniper.net/documentation/us/en/hardware/ex4100-h/ex4100-h.pdf (sha256 recorded under references): Tables 3 to 8, 10, 11, 14,
      15, 16 to 22, 24, 27, 30, 32, 34, 36 and 41, Figures 3, 4, 8, 10, 12, 14, 16, 18, 20, 22, 25, 29 and 32, the mounting topics (Figures 67
      to 79), the power connection steps and the packing list (Table 66). The guide's flat front and rear figures (Figures 3 and 4, 3000 px
      wide) are the pictures measured. Juniper's studio photographs of the model, front and rear (2100 px wide), from the maker's public image
      library (https://www.juniper.net/content/dam/www/assets/images/us/en/image-library/ex-series/ex4100-h-24mp/ex4100-h-24mp-front-high.jpg
      and ex4100-h-24mp-rear-high.jpg), confirm the colours, the lamps, what is printed and the seated supply; neither is copied here. The EX4100
      datasheet (https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex4100-line-of-ethernet-switches-datasheet.pdf)
      redirects to an HPE PSNow document that did not answer, so no datasheet figure is used. No Visio stencil or 3D model of the EX4100-H was
      found. Nothing is taken from a reseller. End of life was searched 2026-10-23 and no Juniper notice for the EX4100-H was found, so
      the lifecycle is none announced. Table 68 (the earthing parts) lists an EX4100-H-48MP beside the 12MP and the 24MP; no other table, figure or
      listing in the guide has a 48-port model, so none is modelled.
  chassis:
    confidence: datasheet
    note: >-
      Tables 11 and 14 - height 1.7 in (4.33 cm), width 17.28 in (43.90 cm), depth 14.96 in (37.99 cm) with an AC supply and 15.35 in (38.99 cm)
      with a DC supply, weight 15.25 lb (6.92 kg) with no supply, 18.40 lb (8.35 kg) with one AC supply and 18.45 lb (8.37 kg) with one DC
      supply. The inch and centimetre figures disagree by 0.2 mm in the height (1.7 in is 43.18 mm); the centimetre figure, 43.3 mm, is used. The
      depth carried is the AC figure, 379.9 mm, which is the shipped build; the DC build is 10 mm deeper. The width is the body between the bracket
      fold lines: the guide says the front mounting brackets extend it to 19 in (Table 56), and the figures show no ears.
  scale:
    confidence: measured
    note: >-
      Gate 1 - Figure 3 is 3000 px wide; the body outline is 2883.5 px across, 6.568 px/mm against 439.0 mm, and 284.5 px high, 6.57 px/mm against
      43.3 mm: 0.1 percent apart, so it is orthographic and carries geometry. Figure 4 (the rear) is 6.567 px/mm across and 6.58 down, the same. The
      photograph (2100 px wide, the body 1745 px across, 3.98 px/mm) agrees with Figure 3 on every feature the two share to within 0.8 mm. Every
      position is estimated, read off the figure with a millimetre grid laid over it, good to about 0.3 mm across and 0.2 down.
  ears:
    confidence: datasheet
    note: >-
      Table 7 and the mounting topics (Figures 67 to 69) - two-post rack mounting is the default, with the EX4100-H-2P-RMK kit provided in the box:
      a pair of side brackets that hang on shoulder screws and slide toward the rear, with M4 by 6 mm screws, mounting the switch flush with the
      front posts. The orderable four-post kits are EX4100-H-4P-RMK (screws, with rear mounting blades; the front brackets mount the switch flush
      with the front posts) and EX4100-H-4P-TL-RMK (toolless rails). No position other than flush is stated and none is measured. No kit contract is written: the guide gives
      no rack-depth range, preset or rail depth for any of the three kits (Table 56 states only a 27 in minimum cabinet depth, which is a cabinet
      figure and not a kit range), and a kit configuration needs one of the two, so a contract would carry an invented range. The kits stay in
      provenance only. The guide asks for 1 RU clear above and below.
  ports:
    confidence: photo-measured
    note: >-
      Table 11 and Figure 3 - 24 RJ-45 ports in two rows in two shells: ports 0 to 7 (the eight 1/2.5 Gbps PoE++ ports, callout 1, in an orange frame
      on the photograph) in four columns and ports 8 to 23 (the sixteen 1 Gbps PoE++ ports, callout 2) in eight columns. Both shells are on the
      registry's 13.97 pitch from 16.5 and 79.5 mm across; the upper row is turned 180 so its keyway and lamps face up, as the figure shows. The rows
      are 16.0 mm apart, upper at 7.4 and lower at 23.4, not the 14.0 that other EX faces carry: the figure's jacks are 11.3 mm high and the gap between
      the rows 4.7. Then two groups of four SFP/SFP+ cages, each two columns by two rows: the Virtual Chassis ports (callout 12, VCP) and the uplink ports
      (callout 8, UPLINK). The cages' rows are 12.6 mm apart, not the registry's 15.0 (which no device is held to), as the frames in the figure show.
  port-numbering:
    confidence: photo-measured
    note: >-
      Figure 3 and the photograph - the legends over the upper row read 0, 2, 4 and on to 22 and under the lower row 1, 3 and on to 23, so the upper
      jack of a column is the even port; the numbers are orange. The cages print 0 and 2 over the upper row and 1 and 3 under the lower row of each group,
      with the group's name, VCP or UPLINK, over it. The numbers are as printed, from 0. Interface names are not printed on the metal; the guide's
      factory-default configuration is for the 12MP and is not carried, so none is recorded.
  port-lamps:
    confidence: datasheet
    note: >-
      Figures 13, 14, 16 and 18 and Table 19 - every jack and every cage has a Link Activity lamp and a Status lamp. The jacks carry them in their keyway
      corners. The cages' lamps are round and sit in a strip above the upper row and below the lower row of each group, two for each cage with the
      cage's number between them. The Status lamp shows what the mode lamps select (Table 20), so its states cannot be one vocabulary here.
  status-block:
    confidence: photo-measured
    note: >-
      Figures 3, 8 and 20 and Tables 16 and 20 - two columns of lamps: the chassis lamps SYS, ALM, MST and CLD at 265.5 mm across and the port mode lamps
      POE, SPD, DX and EN at 271.4 mm, each legend over its lamp and each lamp 7.1 mm below the one above, from 17.5 mm down. The three dry contact
      alarm lamps (IN 0, IN 1 and OUT, Tables 21 and 22) are at 259.5 mm with a bell mark and the legend over each, and the PSU 0 and PSU 1 lamps at 341.5 mm
      beside the cage groups. The lamps are round, 2.4 mm across in the figure; common/led-dot@1 is 2.0 and is used.
  management:
    confidence: photo-measured
    note: >-
      Figure 3 - the management Ethernet port (MGMT, callout 5, with its two lamps), the USB 2.0 Type-A host port (callout 13) and the RJ-45 RS232 console
      port (CON, callout 14) are stacked in one metal housing 14.4 mm wide, upside down for the management port as the keyway shows. The housing is
      too narrow for the full RJ-45 jack and holds ganged cells, 12.7 by 11.0. The USB Type-C console port (callout 3, CON), the RESET pinhole (callout 4) and
      the round Mode button (callout 15, the Factory Reset/Mode button) are in a row to the left of it. The claim code label (callout 10) is a sticker.
  alarm:
    confidence: datasheet
    note: >-
      Table 4 and Figure 22 - the dry contact connector (callout 16) is a six-pole plug on a 3.5 mm pitch at 195.2 mm across and 26.9 mm down, with GND, IN 0,
      IN 1, NO, COM and NC printed at 45 degrees over it, each with a tick to its pole. The alarm input threshold is 5 V and the plug is preassembled
      (Table 66).
  power-input:
    confidence: datasheet
    note: >-
      Figure 3, callout 11, and the connection steps - behind a terminal door at the right of the front, two sections, PSU 0 and PSU 1, each with six terminals:
      L, N and G above and DC+, DC- and G below, the AC row over an AC symbol and the DC row under a DC symbol. The terminals of a section serve the supply in
      the rear slot of the same number: a supply in slot 0 is wired to PSU 0 on the front. The door has a Phillips screw at its right end and the legends are
      printed inside it. Terminals are 4.0 mm across on a 9.6 mm pitch in the figure. Torque and tool belong to provenance only: 4.5 lb.in on the door
      screw, 7 lb.in on the terminal screws.
  earthing:
    confidence: photo-measured
    note: >-
      Table 68 and Figure 99 - a two-hole protective earthing terminal on the rear panel for a Panduit LCD6-14A-L lug on two M5 by 10 mm screws with washers
      (the grounding kit is JNP-GL-2H6-M5-RA, separately orderable). The figure shows two holes 16.0 mm apart (the 5/8 in lug pitch) on a lighter plate at
      32.3 mm across. They are drawn as bare holes on the plate, now parts: one two-hole seat on that pitch (`ground-stud-pitch` says how the pitch is read).
  rear:
    confidence: photo-measured
    note: >-
      Figures 4 and 32 and the photograph - from the left, the serial number label, the ESD point (callout 2), the earthing plate with its symbol, the physical
      security lock slot (callout 8) with its padlock mark, the power supply slot 0 with its supply (callout 3) and its retaining thumbscrew on a tab at the
      left end, a bracket with a second screw, and the slot 1 blank (callout 4) with a captive screw at each end. PSU 0 and PSU 1 are printed under the first
      tab and at the right end. A corner mark frames each label position in the photograph.
  power-modules:
    confidence: datasheet
    note: >-
      Table 10, Tables 24, 27, 34 and 41, Figure 4 and the removal and installation topics - the two supply slots take JPSU-H-340W-AC (340 W AC) and
      EX4100-H-24MP-DC-PSU (340 W DC), field-replaceable and hot swappable, N+1 redundant, in any combination of one or two (Table 10, "One AC and one DC"). The
      switch ships with one preassembled (Table 66) and the guide describes a blank on the second slot (callout 4 of Figure 4). The guide gives no airflow
      direction: the switch is fanless and convection cooled, so there is no airflow variant, and the handle colour on the photograph is green. The supplies
      are components in the bays.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      The legends are drawn from Figure 3 and the photograph, which agree: the model line reads EX4100-H in light grey and MG PoE++ in orange, the jack
      numbers are orange and an orange frame surrounds ports 0 to 7. The maker's logo and Mist AI mark are not drawn and are reserved as a logo-zone. The
      guide's Figure 25, captioned as the 340 W AC supply, draws a DC supply; the photograph's AC supply reads AC INPUT 100-240V~ 2.5-5A 50-60Hz and that is what
      the AC component draws. The guide's figures omit the hot-surface mark on the supply, which the photograph shows.
  colour:
    confidence: photo-measured
    note: >-
      The face colour is the photograph's median of the bare front and rear, #6a727f, which Figure 3 agrees with.
  power:
    confidence: datasheet
    note: >-
      Tables 10, 11, 27 and 30 - PoE++ (90 W by default) on all 24 ports; 340 W AC or DC supplies. The PoE budget is 240 W with one supply and 370 W with two, on an
      81 W system budget, 321 W and 451 W in all against 340 W and 680 W of supply. The budgets are separate figures and the guide states no maximum input power for
      the chassis.
  ground-stud-pitch:
    confidence: estimated
    note: >-
      INFERRED, NOT STATED. Table 68 names two M5 x 10 mm stainless steel screws with washer (separately orderable;
      the grounding kit JNP-GL-2H6-M5-RA holds the lug and screws) and a Panduit LCD6-14A-L lug or equivalent (not
      provided), and gives no spacing. The figure puts the two holes 16.0 mm apart, which is the 5/8 in. (15.875) of
      the library's two-hole lug for the same hole-spacing code (Panduit LCD6-10A-L: '.63 hole spacing'). The terminal
      is `common/ground-hole-pair-5-8-m5@1`: two bare M5 holes on 5/8 in. centres, presenting `stud-pair-5-8`, so one
      two-hole lug (`generic/two-hole-lug-5-8@1`) lands across them and a ring lug still lands on either hole. The
      holes stay bare, as the photograph shows them; the screws are fitted with the lug. The holes were drawn 16.0
      apart as decor and the pair stands on their midpoint.
attrs:
  physical:
    weight: 6.92 kg (15.25 lb) with no supply; 8.35 kg with one AC supply and 8.37 kg with one DC supply, Table 11
  power:
    poe-budget-w: 240 W with one 340 W supply and 370 W with two (system budget 81 W), Table 30
    poe-standard: PoE++ (90 W by default) on all 24 ports
    power-input-ac: 100 through 240 VAC, 50/60 Hz (Table 27)
    power-input-dc: 20.4 through 72 VDC at the terminal block, nominal +24, -48 or -60 VDC (Table 36)
  thermal:
    cooling: fanless, convection cooled (Table 10); one rack unit clear above and below
  environmental:
    operating-temp: -40 to 60 C in a sealed enclosure, -40 to 70 C in a ventilated enclosure (40 LFM) and -40 to 75 C in a blower-equipped enclosure (200 LFM), up to 15000 ft; safety certified at 60 C
    storage-temp: -40 to 85 C in the shipping container
    humidity: 5 to 95 percent, noncondensing
    altitude: no performance degradation up to 15000 ft (4572 m)
  platform:
    first-junos-release: 24.4R1 (Table 10)
  features:
    virtual-chassis: up to 10 EX4100, EX4100-F and EX4100-H switches; the four VCP cages are the Virtual Chassis ports (HiGig or HGoE mode, or uplink ports) and the four uplink cages support HGoE only. A 10GBASE-T transceiver cannot form a Virtual Chassis in a VCP
    macsec: the eight 2.5 Gbps ports and the four uplink ports are MACsec capable
    dry-contact-alarm: two alarm inputs (5 V threshold) and one alarm relay output (NO, COM, NC), Table 4
    optics-sfp-plus: the eight cages take 1 Gbps SFP and 10 Gbps SFP+ transceivers; Tables 52 and 53 list the industrial-grade optics against the ambient they allow. The supported list is in Juniper's Hardware Compatibility Tool, which the guide names and which is not held here
  compliance:
    seismic: tested for Zone 4 earthquake safety
  lifecycle: {eol: none-announced}
