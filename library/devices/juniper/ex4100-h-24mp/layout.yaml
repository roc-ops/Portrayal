gaps:
- what: dc-build-sku
  scope: [dc]
  reason: vendor-silent
  note: >-
    Table 10 lists a 340 W AC and a 340 W DC FRU supply for the one model EX4100-H-24MP and the packing list (Table 66) says the supply is "AC or DC", specific to the SKU, but the
    guide names no switch part number for the DC build. The DC build is drawn as an example configuration and is not exported as a device type.
  wanted: the orderable part number of the EX4100-H-24MP with a DC supply
- what: supply-depth
  scope: [psu-0, psu-1]
  reason: vendor-silent
  note: >-
    The guide gives no dimension for a supply. Table 11 gives the chassis 10 mm deeper with a DC supply than with an AC one, which is the only depth difference stated.
  wanted: the supplies' dimensions
- what: port-status-lamp-states
  scope: [rj45-mg, rj45-gbe, vcp, uplink]
  reason: vendor-silent
  note: >-
    The Status lamp changes meaning with the Mode button (Table 20), so the jack lamps keep the component's link and activity vocabulary and the mode lamps carry
    the meaning.
  wanted: none beyond the component's own vocabulary
- what: cld-lamp-states
  scope: [led-cld]
  reason: vendor-silent
  note: The guide names the CLD lamp and sends the reader to the cloud-ready blink patterns, which it does not hold.
  wanted: the cloud-ready LED blink patterns
- what: label-plates
  scope: [front, rear]
  reason: needs-drawing
  note: >-
    The claim code label (front) and the serial number label (rear) are stickers with no content in any figure; they are named regions and are not drawn.
  wanted: none; stickers
- what: four-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: A flat drawing or photograph of the lid, the underside and the side panels.
- what: ground-pair-pitch
  scope: [ground-pair]
  reason: vendor-silent
  note: >-
    The guide names the screws and the lug and gives no spacing for the two holes; `ground-stud-pitch` says what the
    pair is drawn at and why.
  wanted: a drawing that dimensions the two holes, or the lug's own datasheet
