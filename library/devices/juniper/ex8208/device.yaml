manufacturer: Juniper
model: EX8208
portfolio: {line: EX Series, family: EX8200}
description: >-
  Juniper EX8208, the 14 U end-of-life modular Ethernet switch of the EX8200 family. Everything is on the front.
  Eight horizontal line card slots (0 to 7) are split around three control slots, SRE0, SF and SRE1; the Switch Fabric
  and Routing Engine (SRE) modules and the Switch Fabric (SF) module sit between line card slots 3 and 4. A vertical fan
  tray runs down the left of the front and carries the slot numbers; six power supply slots (PSU 0 to PSU 5) run across
  the bottom, and the LCD panel, its Menu and Enter buttons, the ALM, SYS and MST lamps and the ESD point are in a
  header plate across the top. Cooling is side to side. The base order ships one SRE module, the SF module, two AC
  supplies and the cover panels; the redundant orders two SRE modules and six AC supplies or four DC supplies. Line cards
  are ordered separately and are not modelled here: every line card slot shows its cover panel.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper, EX8208 Switch Hardware Guide (PDF title "EX8208 Switch Hardware Guide", created 2020-12-16, 404 pages),
      https://www.juniper.net/documentation/en_US/release-independent/junos/information-products/pathway-pages/ex-series/ex8200/ex8208.pdf:
      Table 5 (the orders), Table 7 (the chassis), Tables 8 to 12 (the FRUs and the slot numbers), Figures 1, 2, 3 and 4 (the
      front, flat in Figures 3 and 4), Figures 5 to 7 (the LCD panel and lamps), Figures 8 to 19 (the fan tray, supplies and
      modules), Tables 14, 25, 31, 34 and 35 (the lamps) and Table 57 (power). Juniper, EX8208 Ethernet Switch Datasheet
      (1000261-022-EN, June 2015),
      https://www.juniper.net/content/dam/www/assets/datasheets/us/en/switches/ex8208-ethernet-switch.pdf: the ordering
      table and the specifications. Juniper's end-of-life notice (PSN TSB17106, listed in
      https://www.juniper.net/support/pdf/eol/lod-q22017.pdf, 2017-11-09): the EX8200 line is replaced by the EX9200. The
      guide's own address in the task (.../ex-series/ex8208/ex8208.pdf) answered 404; the address above, in the ex8200
      folder, is the one used, and the archive zip was not needed. Terms: the documents are Juniper's, published for
      customers, read here for facts only; nothing is copied into the library and every skin is drawn new. No photograph
      of the EX8208 was reachable: Juniper's image library was not searched successfully and no held intake folder,
      Visio stencil or 3D model exists for this account, so the guide's flat figures are the only geometry.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 7: 24.25 in (61.6 cm) high, 17.25 in (43.82 cm) wide - "the outer edges of the front-mounting brackets
      extend the width to 19 in. (48.3 cm)" - and 20 in (50.8 cm) deep, 20.69 in (52.6 cm) from the front-mounting bracket
      to the rear. The datasheet gives 17.25 x 24.25 x 21 in (43.82 x 61.6 x 53 cm); the 21 in is the guide's 20.69 in
      with the handles, and the guide's chassis depth is carried (gap chassis-size). 14 U (guide, "14 rack units (1/3
      rack)"); 14 U is 622.3 mm, so the 24.25 in body sits inside it. Ears are NOT MODELLED by project convention.
  gate-1:
    confidence: drawing
    note: >-
      THE FRONT FIGURE PASSES. Figure 3 (g020565, flat) rendered at 450 dpi: the frame with its brackets is 1675 px wide
      and the body between the fold lines 1524 px, which is 17.25 in at 3.479 px/mm (0.4 percent from the aspect of the
      24.25 in height, 3.466 px/mm down: the outline is 617 px at 130 dpi for 616 mm). Positions are good to about a
      millimetre. Figure 4 draws the same supply row (g020641).
  slots:
    confidence: estimated
    note: >-
      Figure 3 at 3.479 px/mm across and 3.466 down. The slot-number boxes on the fan tray show the slot pitch: boxes at
      41.7 mm (slot 0) to 423.2 mm (slot 7), a mean 38.2 mm (the 1.5 in of an EX8200 line card is 38.1), the card plates
      inside them 374.2 mm wide (53.2 to 427.4 mm across). The slots are modelled as 395.3 mm wide bays from 42.8 mm (the
      tray's right edge) to the body's right edge, 36.0 mm high on a 38.2 mm pitch, at slot top + 1.5 mm, in the order of
      guide Table 11: line cards 0 to 3, SRE0, SF, SRE1, line cards 4 to 7. The SRE and SF slot boxes read a little
      different in height from the line card boxes (37.3 and 33.7 mm against 35.7); one pitch is carried.
  psu-row:
    confidence: estimated
    note: >-
      Figure 3 and Figure 4 (g020641): six supplies 70.1 mm wide on a 71.0 mm pitch from 9.5 mm across, 104.0 mm high
      from 503.0 mm down, with PSU 0 to PSU 5 printed above each at 55.4 mm from the supply's left edge, left to right.
      A perforated band runs under the row, 6.0 mm high from 608.5 mm down.
  header:
    confidence: estimated
    note: >-
      Figure 3 at 3.479 px/mm: the header plate runs 42.8 to 438.1 mm across and 0 to 36.2 down. LCD window 273.6 to 312.5 mm
      across and 11.4 to 23.8 down; Menu and Enter buttons centred at 321.2 mm across and 14.9 and 22.1 down; ALM, SYS and
      MST lamps at 340.5 mm across and 10.3, 18.1 and 25.6 down with their legends to the right; the ESD caution label
      356.4 to 375.6 mm across and 12.4 to 25.6 down; the ESD point centred at 380.0 and 19.0; the model name "EX8208" centred
      at 405.9. Where the figure draws the lamps and buttons larger than the registry's parts, the registry's size is used
      on the same centre.
  rear:
    confidence: estimated
    note: >-
      No figure of the guide shows the rear; the isometric Figures 1 and 2 show only the front and the right wall. The rear
      is declared empty, with a reason. The guide says the supplies' hot air "exhausts from the rear of the chassis".
  right-side:
    confidence: estimated
    note: >-
      Figure 1 (isometric, no scale) shows the right wall perforated over most of its area; the lift handles on either side, which
      the guide says are for an empty chassis only, are not drawn. The guide's "Grounding Cable and Lug Specifications" place two threaded inserts (PEM nuts, UNC 1/4-20, 0.625 in. or
      15.86 mm apart) "on the right side toward the top rear corner". The vent field and the insert positions
      are fractions of that isometric, estimated to about 10 mm; the inserts are drawn as two plain heads and not as the
      library's stud-pair part. On this face x = 0 is the front.
  color:
    confidence: estimated
    note: >-
      The guide's figures are black and white line drawings and no photograph was found, so the chassis is drawn in a neutral
      light grey; no colour is stated by a source.
  power:
    confidence: datasheet
    note: >-
      Guide Table 57 gives each FRU's draw (carried on the components) and Tables 58 and 59 give the chassis base power by
      redundancy and Junos release. No chassis total is stated; the datasheet gives 6.2 Tbps capacity and no power figure.
  lifecycle:
    confidence: datasheet
    note: >-
      Juniper's end-of-life notice (PSN TSB17106, https://www.juniper.net/support/pdf/eol/lod-q22017.pdf, 2017-11-09) lists the
      EX8200-family XRE200 with a last order date of 2017-06-15 and names the EX9200 as the replacement for the EX8200 line.
      The EX8208 chassis's own dates were not readable (Juniper's end-of-life table is script-rendered); none is stated.
attrs:
  physical:
    weight-chassis-kg: 41
    weight-base-kg: 68
    weight-redundant-kg: 85
    weight-max-kg: 129
    weight-note: >-
      Guide Table 7: chassis with backplane 89 lb (41 kg), base configuration 149 lb (68 kg), redundant 187 lb (85 kg), fully
      loaded 284 lb (129 kg), the last with the heaviest line cards in all eight slots. The datasheet gives 115 lb (52.5 kg), 176
      lb (80 kg), 216 lb (98 kg) and 328 lb (149 kg); the guide's table is carried (gap weights).
  performance:
    switching-capacity: up to 6.2 Tbps (datasheet and guide, "Benefits of the EX8208 Switch")
  environmental:
    operating-temp: 0 C to 40 C
    humidity: 10-85 percent noncondensing
    altitude-max: 10,000 ft (3048 m)
  lifecycle:
    eol: announced
    eol-announcement: https://www.juniper.net/support/pdf/eol/lod-q22017.pdf
