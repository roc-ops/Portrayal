configurations:
  base:
    kind: base
    default: true
    source: >-
      vendor - Juniper ships the base configuration (AC with 2000 W AC power supplies) as EX8208-BASE-AC (guide, Table 5): the chassis
      with backplane, one fan tray, one SRE module, one SF module, two 2000 W AC supplies with power cords, eight line card cover
      panels and four power supply cover panels. The slots not listed are left empty: the guide's base list has no cover for SRE1.
