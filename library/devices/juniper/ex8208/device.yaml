gaps:
  - what: chassis-size
    scope: [front, right]
    reason: sources-disagree
    note: >-
      Depth: guide Table 7 gives 20 in (50.8 cm) and 20.69 in (52.6 cm) from the front-mounting bracket; the datasheet gives
      21 in (53 cm). Height and width agree (24.25 in, 17.25 in). The guide's 20 in is carried as the chassis depth.
    wanted: a mechanical drawing, or a measured chassis, saying which depth includes the handles
  - what: weights
    scope: [weight-note]
    reason: sources-disagree
    note: >-
      Chassis with backplane 89 lb (guide) against 115 lb (datasheet); base 149 against 176; redundant 187 against 216; fully
      loaded 284 against 328. The guide is the newer document (2020-12-16 against June 2015) and is carried.
    wanted: a shipping-weight statement that names the configuration
  - what: line-cards
    scope: [slots]
    reason: needs-drawing
    note: >-
      Left out on purpose: the twelve EX8200 line cards (EX8200-8XS, -8XS-ES, -40XS, -40XS-ES, -2XS-40P, -2XS-40T, -48PL,
      -48TL, -48T, -48T-ES, -48F, -48F-ES) are a family of their own. Each slot shows its cover panel.
    wanted: the EX8200 line card family, modelled as its own slice
  - what: dc-supply-face
    scope: [psus]
    reason: needs-drawing
    note: >-
      The DC supply is drawn only in isometric Figures 13 and 14, and Figure 3 shows only AC supplies installed; the DC face
      is built from fractions of an angled view.
    wanted: a flat drawing or photograph of the EX8200-PWR-DC2KR face
  - what: rear-and-sides
    scope: [rear, left, top, bottom]
    reason: needs-drawing
    note: >-
      No figure of the guide shows the rear, the left wall, the top or the bottom flat; the right wall is only the isometric
      Figure 1.
    wanted: flat drawings or photographs of the rear and the side walls
  - what: sre-lamp-legend
    scope: [sres]
    reason: sources-disagree
    note: >-
      Figure 3 prints the SRE lamp legends as ST MS over ON SF and the SF module's as ST over ON; Tables 34 and 35 name the
      SF module's lamps ST and SF. The SRE lamps follow the printed order; the SF module's second lamp is called SF.
    wanted: a photograph of an SRE320 and an SF320 faceplate
  - what: cover-parts
    scope: [slots, psus]
    reason: vendor-silent
    note: >-
      The guide lists the line card, power supply and (EX8216) RE cover panels in Table 5 and draws none, and gives no part
      number for any; the covers are drawn as plain plates at the bays' own size.
    wanted: the cover panels' part numbers and a photograph
groups:
  slots:
    term: Slot
    role: traffic
    index-origin: 0
    description: line card slots 0 to 7, four above and four below the SRE and SF slots; line cards are not modelled
  sres:
    term: Slot
    role: service
    index-origin: 0
    description: the Switch Fabric and Routing Engine slots SRE0 and SRE1, one SRE module in the base order and two in the redundant orders
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - guide, "Understanding EX8208 Switch Component and Functionality Redundancy": one or two SRE modules; with two, one is primary and the other backup, and the Routing Engine and control are redundant'
  sfs:
    term: Slot
    role: service
    index-origin: 0
    description: the Switch Fabric slot SF, keyed for the SF module only
  cooling:
    term: Tray
    role: service
    index-origin: 0
    description: the single fan tray of 12 fans, side to side
  psus:
    term: PSU
    role: service
    index-origin: 0
    description: six power supply slots PSU 0 to PSU 5, any slot in any order, all AC or all DC
    attrs:
      redundancy: 'n+1'
      redundancy-note: 'n+1 is required; n+n for dual feeds (guide, "N+1 Redundancy Configuration of AC Power Supplies"); the DC supplies carry two feeds each'
  lcd-buttons:
    term: Button
    role: management
    index-origin: 0
    description: the LCD panel's Menu and Enter buttons
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the chassis status lamps ALM, SYS and MST right of the LCD panel
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD point in the header plate
