format: 1
kind: device
name: qfx5100-48t
version: 0.1.4
maturity: modelled
manufacturer: Juniper
model: QFX5100-48T
portfolio: {line: QFX Series, family: QFX5100}
description: >-
  Juniper QFX5100-48T, a 1RU data-centre access switch running Junos OS. It has 48 10GBASE-T ports
  and 6 QSFP+ ports. A 10GBASE-T port runs at 10 GbE, 1 GbE or 100 Mbps. A QSFP+ port runs at
  40 GbE or as four 10 GbE ports. The ports and their lamps are on the port side. The rear carries
  two power supplies, five fan modules, the console, three management ports, a USB port, the reset
  button and the four chassis lamps. One front panel ships in four power and airflow variants. They
  have AC or DC supplies, with airflow front-to-back (AIR OUT) or back-to-front (AIR IN).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper QFX5100 Switch Hardware Guide, published 2023-02-26, 254 pages (Juniper Networks;
      terms: the guide's own copyright notice and the Juniper EULA, a reference copy kept outside the
      repository): Tables 1 (models), 3 (physical specifications), 8 to 12 (lamps), 13, 14 and 16
      (AC supplies), 17 and 18 (DC supplies), 19 to 21 (fan modules); figures 15 (the port panel),
      20 to 25 (management panel), 26 to 40 (supplies, fans and airflow). QFX5100 Ethernet Switch
      Datasheet, 1000480-022-EN, July 2024: the ordering table, weight and dimensions, power.
      Juniper's studio photographs of the 48T, front and rear, 1500 x 230 px each (image library,
      qfx5100-48t-front-high and -rear-high), and of the 48S. The held-sources folders of the intake
      area were not readable from this worker (permission denied), so no Visio stencil or 3D model
      could be looked for there; none is named by the guide or the datasheet either.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 3: 1.72 in (4.3 cm) high, 17.36 in (44.1 cm) wide, 21.47 in (54.5 cm) deep, 24.79 lb
      (11.2 kg) with FRUs. The datasheet gives 4.37 x 44.09 x 54.54 cm and 24.8 lb (11.2 kg); the two
      agree to 0.1 mm. The 48T is 0.99 in deeper than the 48S, which Table 3 gives its own row. The
      width is the body: the mounting brackets are not part of it and are not modelled.
  gate-1:
    confidence: photo-measured
    note: >-
      The front studio photograph is orthographic enough to measure. Its body is 1440 px wide and
      142 px high (top edge row 36.5, bottom row 178.5), an aspect of 10.14 against the table's
      440.9 / 43.7 = 10.09, 0.5 percent out. Scale 3.266 px/mm across and 3.25 down. The rear
      photograph reads 1441 x 140.5, an aspect of 10.26 (1.7 percent out, so only the across axis is
      trusted there), at 3.268 px/mm across. The guide's flat figure 15 is a 754 x 140 px thumbnail
      and is used to count and to read the printing only.
  ports:
    confidence: photo-measured
    note: >-
      Front photograph, dark jack openings: 24 columns of 40.5 px (12.4 mm) openings on a pitch of
      45.7 px, 13.99 mm, which is the registry's 13.97 ganged-jack pitch (0.550 in), in three blocks
      of eight columns. The block starts are 392 px apart: the cells start at 13.7, 133.9 and 254.4 mm,
      a stride of 120.35 mm, so the gutter is 120.35 - 8 x 13.97 = 8.6 mm. Then six QSFP+ cages in
      three columns, centres 384.4, 403.5 and 423.0 mm (a pitch of 19.1 to 19.5 mm; the registry's
      19.0 is used), the first cell from 375.1 mm. Counts are 48 and 6, the guide's callouts 2 and 3 of
      figure 15. The cells use the registry's apertures (12.7 x 11.0 and 18.5 x 9.58).
  row-pitch:
    confidence: photo-measured
    note: >-
      Down the first jack column the openings are 72 to 102 and 119 to 151 px, centres 87 and 135 px,
      which is 15.5 and 30.3 mm below the top edge, a row pitch of 14.8 mm. The QSFP+ cage faces centre
      14.5 and 30.05 mm below the top edge, a row pitch of 15.5 mm, and 15.4 is used with the cell
      height. y is good to about 0.3 mm.
  jack-shell:
    confidence: photo-measured
    note: >-
      Each block of jacks sits in a bright metal frame, 115.5 mm wide and 26.8 mm high, which is panel
      and not part: it is drawn as three decor rectangles from 11.8, 132.0 and 252.5 mm. In the upper
      row the contacts of each jack are at the foot of its opening and the latch slot at the top; in
      the lower row they are the other way up, the library's stacked-jack convention.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed on the metal and read off the photograph at 7 times and figure 15: all the jack numerals
      are above the upper row. Each column carries two, over its two lamp triangles: the left numeral
      is the upper jack (even), the right numeral the lower jack (odd), so a block reads 0, 1 2, 3 4 ...
      14 15 from left to right, the pairs sitting across the column boundaries. The QSFP+ ports are 48 and
      49 down the first column, 50 and 51, 52 and 53; the photograph resolves the three lower numerals
      (49, 51, 53) and not the upper three, which figure 15 prints (48, 50, 52) and are carried from
      it. Interface names are not printed on the unit; none is written to the manifest.
  port-lamps:
    confidence: photo-measured
    note: >-
      Each column has two triangular lamp windows above its upper jack, an up-pointing one at the left
      and a down-pointing one at the right, one lamp for each of the two jacks of the column (guide
      Table 8: a Link/Activity lamp and no Status lamp for the 48T; Table 9 gives the states). Centres
      are 1.4 and 10.8 mm from the column's left edge and 12.0 mm below the top edge, read at 3 times
      and estimated. THEY ARE DRAWN 3.1 MM HIGHER, at 8.9 mm, with the numerals 2.3 mm higher, because in
      the photograph the windows sit inside the top rim of each jack housing and a lamp over another port's
      cell is an overlap (L13) that the model cannot say; the numerals keep their order above the lamps.
      THE QSFP+ LAMPS ARE NOT MODELLED. Table 10 gives four lamps a QSFP+
      port; the 48T photograph shows six pair-windows in the strip below the QSFP+ cages and no lamp
      above or between them, and neither the photograph nor figure 15 says which port each window
      serves or how four lamps fit two windows. The six windows are drawn as decor and a gap records it.
  vents:
    confidence: photo-measured
    note: >-
      One band of large hexagonal holes along the top edge (0.5 to 7.2 mm in the photograph, drawn only to
      4.8 mm so that the numerals, which the model keeps clear of the lamps, do not print on air) and one of small ones along
      the bottom (40.5 to 43.5 mm), drawn as vent strips; the hexagon pitch (about 4.9 mm) is read off the
      photograph and is estimated, as the pattern is a rectangular approximation of a hexagon field.
  rear-layout:
    confidence: photo-measured
    note: >-
      Rear photograph, read at 3.5 times and checked against the guide's figures 20 and 22 (the figure 20
      drawing is lettered EX4600-40F: a drawing of a sibling, used for the arrangement only). At the left
      a 63.7 mm recessed panel carries the four chassis lamps, the stacked pair of SFP management cages
      (C0 above, C1 below), the console and C0 jacks stacked in one shield, the USB port and the reset
      pinhole. Then five fan slots, each preceded by a strip with a fan symbol, its number and a small
      status lamp, then two supply slots, and at the right edge a dark strip carrying a vertical rating
      label. The fan and supply slots are placed from the 48S measurements (the same parts); this
      photograph reads the fan pitch at 48.65 mm against 48.95 mm there, within its error.
  mgmt:
    confidence: photo-measured
    note: >-
      The 48T photograph shows the three-port panel (Table 1 gives every QFX5100-48T three management
      ports): C0 is the RJ-45 jack (em0), and two SFP cages stand one above the other, labelled C0 above
      and C1 below (em1 is the SFP management port C1; the second C0 is the additional SFP port, and the
      guide says the copper C0 has priority over the fibre one). The upper jack of the stacked pair is the
      console.
  rear-photo-vs-drawing:
    confidence: photo-measured
    note: >-
      The guide's figure 20 draws the rear of an EX4600-40F; the studio photograph is the real
      QFX5100-48T and wins. The photograph is the back-to-front (AFI) build: blue fan handles lettered
      AIR IN (AFI), and black supply handles lettered AFI, where Table 13 says the AFI handle is Juniper
      Azure Blue (the 48S photograph shows it blue). The default configuration here is front-to-back
      (AFO) with Juniper Gold handles per Tables 13 and 19; the AFI configuration matches the fans in
      the photograph and uses the table's blue for the supplies.
  modules:
    confidence: datasheet
    note: >-
      The fan modules (QFX5100-FAN-AFO and -AFI) and the 650 W power supplies (JPSU-650W-AC-AFO,
      -AFI, and the DC -AFO and -AFI named by the datasheet) are field-replaceable units in bays, each
      its own component. Nothing on this chassis is a built-in unit that is not a bay. The guide says to
      fit a blank cover over an empty supply slot but names no part number for it, so no blank is
      modelled and no empty-bay configuration is offered.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide says the switch mounts flush or recessed 2 in (5 cm) in a four-post rack
      with the mounting kit shipped with it (a pair of front rails and two rear blades; twelve
      screws), and gives no part number for the kit; the datasheet says only "versatile four post
      mounting options". The library holds no kit contract for it and none is written here, so
      `chassis.ears` and `chassis.kits` are left out and a gap says so. The modelled body is the 440.9
      mm chassis, without brackets.
  power:
    confidence: datasheet
    note: >-
      guide Table 14 (AC): typical 322 W, maximum 395 W for the 48T and 48TH; Table 17 (DC): typical 300 W
      and maximum 385 W for the 48S, 48T and 24Q. The datasheet's "Power Consumption" prints 335 W for the
      48T-AFO/AFI with no measure or scope. It lies between the guide's typical and maximum figures, so it is
      a different measure and not a conflict; both are kept.
  colour:
    confidence: photo-measured
    note: >-
      The front plate samples #a7abb0 (5 by 5 px means at two bare patches, above and below the jacks) and the
      rear panel #86898e. The photograph is lit warmly and these are its values, not a paint reference.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-life announcement. The guide and the datasheet (July 2024) state none.
      Reseller trackers (router-switch.com) list announcements of 2020 to 2022 for the QFX5100-24Q,
      -24Q-AA and -96S part numbers and none for the 48T, so the device states none announced.
      Estimated, because the trackers are not the maker.
attrs:
  physical:
    weight-note: 24.79 lb (11.2 kg) with FRUs installed (Table 3)
    depth-note: 21.47 in (54.5 cm) (Table 3)
  performance:
    switching-capacity: 1.44 Tbps, 1.08 Bpps (datasheet); the guide gives 720 Gbps full duplex
    shared-packet-buffer: 12 MB shared packet buffer (datasheet)
    rj45-speeds: 10 GbE, 1 GbE or 100 Mbps over shielded twisted pair, up to 100 m
    qsfp-plus-speeds: 40 GbE; or four 10 GbE with a breakout cable
  power:
    power-typical-w: 322
    power-max-w: 395
    power-envelope: unstated
    power-datasheet-w: 335
    power-dc-typical-w: 300
    power-dc-max-w: 385
    power-input-ac: 110 to 240 VAC single phase (datasheet); the guide's table gives no value
    power-input-dc: rated -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum (guide Table 17)
    redundancy-note: two supplies, load-sharing and fully redundant; both should be installed
  thermal:
    fans: five fan modules, hot-swappable; the switch runs 30 seconds without thermal shutdown while one is replaced
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F) normal operation; the room must not change by more than 2 C a minute
    storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container
    humidity: 5 to 90 percent noncondensing; 5 to 93 percent short term
    altitude: no performance degradation to 2000 m (6562 ft)
  platform:
    cpu: 1.5 GHz dual-core Intel
    memory: 8 GB
    storage: 32 GB SSD
    software: Junos OS
  features:
    virtual-chassis: up to 10 switches in a ring; also a Virtual Chassis Fabric leaf and a QFabric node
    optics-qsfp: 40 GbE QSFP+, QSFP+ direct attach and active optical cable, breakout cables to SFP+
  management:
    oob: management port C0 (RJ-45, em0), C1 (SFP, em1) and a second SFP port C0, with link and status lamps
    console: RJ-45 console port (CON)
    usb: one USB port for image updates
  lifecycle:
    eol: none-announced
chassis: {width: 440.9, height: 43.7, depth: 545.3, ru: 1, weight-kg: 11.2, color: '#a3a7ac', airflow: front-to-back, power: ac}
gaps:
- what: dc-operating-voltage
  scope: [rear]
  reason: sources-disagree
  wanted: >-
    The datasheet gives -36 to -72 V DC; the guide's Table 17 gives -40 through -72 VDC (rated -48 to -60).
    The guide's range is carried.
- what: ac-input-rating
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The guide's Table 14 prints no value for AC input voltage, line frequency or current in the PDF
    held. The datasheet gives 110-240 V single phase; the chassis label in the photograph reads
    100-240 V.
- what: qsfp-plus-lamps
  scope: [front]
  reason: needs-photo
  wanted: >-
    Where the four lamps of each QSFP+ port are (guide Table 10) and which port each of the six pair-windows
    in the strip under the cages serves. The 48T photograph resolves the windows but not their ports. A
    close photograph of the strip would settle it.
- what: qsfp-upper-numerals
  scope: [front]
  reason: needs-photo
  wanted: >-
    The numerals 48, 50 and 52 above the upper QSFP+ cages. The guide's figure 15 prints them; the 48T
    photograph does not resolve them although it resolves the lower three.
- what: mounting-kit
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    The part number of the four-post mounting kit, and its depth ranges. The guide describes the kit
    and flush or recessed mounting in prose and a figure per chassis but gives no part number.
- what: usb-generation
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The USB revision. The guide names one USB port "for image updates" and gives no generation. It is drawn
    with the kit's neutral usb2 skin.
- what: rating-label
  scope: [rear]
  reason: needs-photo
  wanted: >-
    The vertical rating label at the right edge of the rear (an AC input line and a DC input line). It is
    only partly legible in the photograph and is not drawn.
- what: rear-marks
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The three hexagon marks beside the model chip, and the symbol and number printed at the left of the
    first supply slot, which the photograph shows and the guide does not name. They are not drawn.
- what: th-chip-text
  scope: [rear]
  reason: needs-photo
  wanted: >-
    What the model chip reads on a QFX5100-48TH. The guide's figure 4 reuses the 48T drawing (the same g-number
    as figure 3) and no photograph of a 48TH is held, so the chip is drawn as the 48T's and the two
    configurations differ only in part number and software, which the guide states.
- what: four-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: A flat drawing or photograph of the lid, the underside and the side panels.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 10g}
    description: 48 ports labelled 0 to 47, the even ports on the upper row. Each runs at 10 GbE, 1 GbE or 100 Mbps.
  qsfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp, speed: 40g}
    description: Ports 48 to 53 as printed, rel-pos carrying the printed number, since the origin token cannot express a block that starts at 48.
  rj45-leds:
    term: LED
    role: indicator
    index-origin: 0
    states: ['off', {name: link, color: '#22c55e'}, {name: activity, color: '#22c55e', behavior: blinking}, {name: fault, color: '#f59e0b', behavior: blinking}]
    description: The Link/Activity lamp of each 10GBASE-T port, a triangle over the column (guide Table 9; amber blinking is a fault on the 48T).
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band cluster at the left of the rear - an RJ-45 console port, an RJ-45 management port,
      two SFP management ports, a USB port and the recessed reset button. Four kinds, one purpose:
      reaching and recovering the switch when the data plane cannot.
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The four chassis lamps ALM, SYS, MST and ID (guide Table 12).
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: n+1
      redundancy-note: >-
        QFX5100 datasheet (July 2024), Power Supply and Fan Modules: "Redundant (N+1) and hot-pluggable fan modules".
        The hardware guide gives five fan modules, slots 0 to 4 left to right; all should be installed and the
        switch runs 30 seconds with one removed
  fan-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The status lamp at the left of each fan slot - green when the module is present and healthy, blinking amber when absent or in error (guide Tables 20 and 21).
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: two supplies, load-sharing; one may be removed at a time while the switch runs
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD terminal on the port side (guide figure 15, callout 1)
