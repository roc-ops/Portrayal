format: 1
kind: device
name: ex4100-f-24p
version: 0.2.1
maturity: modelled
manufacturer: Juniper
model: EX4100-F-24P
portfolio: {line: EX Series, family: EX4100-F}
description: >-
  Juniper EX4100-F-24P is a fixed 1RU access switch with 24 10/100/1000BASE-T ports that all supply PoE+
  (30 W by default), four 1/10GbE SFP+ Virtual Chassis ports and four 10GbE SFP+ uplink ports. The front
  carries the jacks in two stacked rows numbered 0 to 23, the two 2x2 cage groups, the chassis and port
  mode lamps, a Factory Reset/Mode button, a reset pinhole and a USB Type-C console port; the left of
  the face is blank apart from the claim code label. The rear carries the management port with a USB port
  under it, the RJ-45 console port, the earthing terminal, an ESD point, two fans and the AC inlet. The
  450 W supply and both fans are built into the chassis, so there are no bays. The EX4100-F-24T is the
  same front without PoE and with a shallower chassis.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX4100-F Switch Hardware Guide, Juniper Networks, PDF created 2026-10-01 (271 pages; https://www.juniper.net/documentation/us/en/hardware/ex4100-f/ex4100-f.pdf):
      Tables 3 to 5, 10, 11, 18, 21 to 27, 30 and 45, Figures 12 to 15 (the front and rear views and their
      callouts) and the mounting topics. Figures 12 and 13 are 1500 px wide studio images of the real
      unit and are the pictures measured here, extracted from the PDF. The maker's image library holds
      no photograph of the EX4100-F-24P (ex4100-f-24p-front-high.jpg returned an HTML 404 page, tried
      once), so the 48P's photographs were used only to cross-check the parts the two share. The HPE PSNow
      datasheet (a00150781enw) was tried once and did not answer, so no datasheet figure is used. Nothing
      of the guide is copied here: every face is drawn new from measurements. No Visio stencil, 3D model
      or other held photograph of the EX4100-F was available, so none was used. End of life was searched
      2026-10-22: no Juniper notice for the EX4100-F was found (a reseller tracker lists the EX4100 family
      as supported with no dates), so the lifecycle is none announced.
  chassis:
    confidence: datasheet
    note: >-
      Tables 11 and 18 - height 1.72 in (4.37 cm), width 17.36 in (44.09 cm), depth 12.2 in in Table 11
      and 12.26 in (31.13 cm) in Table 18, weight 4745 g. The centimetre figure 31.13 is printed in both
      tables, and 12.2 in (309.9 mm) is its rounding, so 311.3 mm is carried. The width is the body between
      the bracket fold lines; the guide gives no 19 in figure and the images show no ears.
  scale:
    confidence: measured
    note: >-
      Gate 1 - Figure 12 is 1500 px wide with the face 1306 px across, 2.962 px/mm against 440.9 mm, and
      130 px high, 2.97 px/mm against 43.7 mm: 0.3 percent apart, so it is orthographic and carries geometry.
      The jack pitch of the right-hand shell reads 41.4 px, 13.98 mm, the registry's 13.97 mm on a quantity
      the scale never saw. Horizontal positions are measured from the centre of the face. The 48P photograph
      (3.26 px/mm) agrees with this figure on every feature the two share to within 0.6 mm, so the vertical
      positions are the 48P's. Every position is estimated, good to about half a millimetre across and
      one down.
  ports:
    confidence: photo-measured
    note: >-
      Table 11 and Figure 14 - 24 RJ-45 ports in two rows of 12 columns, then two 2x2 groups of SFP+ cages.
      The columns are in two shells. The right shell has eight columns on the registry's 13.97 pitch,
      the first cell at 244.15 mm, which is where the 48P's third shell stands. The left shell has four
      columns and they are NOT on that pitch: their cavities centre at 183.3, 199.2, 214.9 and 230.8 mm,
      a step of 15.8 mm, against 13.98 in the right shell. The four are placed on 15.83 mm (the 5/8 in
      step), cell edge at 177.15 mm. The rows centre 14.0 mm apart, the upper row turned 180 so that its
      keyway and lamps face up, as the image shows. The cages are two columns by two rows, abutting on
      the registry's 14.25 pitch, at 360.1 and 391.8 mm; the registry's 15.0 row pitch is used.
  port-numbering:
    confidence: photo-measured
    note: >-
      The legends under each column read 0 up-arrow, down-arrow 1, then 2 and 3 up to 22 and 23, so the
      upper jack of a column is the even port; the jack numbers are orange and the cage numbers white.
      The cages print 0 up-arrow, down-arrow 1, 2 up-arrow, down-arrow 3 under each group, and the right
      group is bracketed and labelled UPLINK. The left group is the Virtual Chassis ports. The numbers
      are as printed, from 0. Interface names are not printed on the metal and the guide's Junos listing
      is for a 48-port model, so none is recorded for this one beyond the cage numbering.
  port-lamps:
    confidence: datasheet
    note: >-
      Figures 30 to 32 and Table 24 - each jack and each cage has a Link Activity lamp and a Status lamp.
      The jacks carry them in their keyway corners. The image shows four small triangular windows per
      cage column in the metal band between the two cage rows, two pointing down and two up; they are
      read as the two lamps of the upper port (the down-pointing ones, at 2.05 and 9.46 mm from the column
      edge) and of the lower port (the up-pointing ones, at 5.0 and 12.4), the left one of each pair being
      Link Activity by analogy with the jacks. No figure says which window is which, so the assignment
      is estimated. The Status lamp shows what the mode lamps select (Table 25), so its states cannot
      be one vocabulary here.
  status-block:
    confidence: photo-measured
    note: >-
      Figures 14 and 28 and Tables 22 and 25 - a dark plate at the right end holds the chassis lamps SYS,
      ALM, MST and CLD (left column) and the port mode lamps SPD, DX, EN and PoE (right column), each
      lamp above its legend, a round blue Factory Reset/Mode button with a list icon and the USB Type-C
      console (CON). The columns centre at 425.9 and 431.6 mm. The lamps are very faint and are placed
      from their legends.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      The legends are drawn from Figure 12: the model line reads EX4100-F in white and PoE+ in orange,
      the jack numbers are orange and the cage numbers white. The maker's logo and Mist AI mark beside
      the model line are not drawn and are reserved as a logo-zone. The top vent field runs from 256.9
      mm to the status plate's neighbour, as on the 48P, and the lower slot row runs under the jacks and
      the left cage group.
  claim-label:
    confidence: photo-measured
    note: >-
      Figure 14 callout 10 - the claim code label is a sticker at the left of the face, marked by two
      corner marks at 3.9 to 20.8 mm across and 24.3 to 39.5 down. It is a region and is not drawn.
  reset:
    confidence: photo-measured
    note: >-
      Figure 14 callout 9 - the reset button is the small round pinhole between the legends of the two
      jacks of column 10, at 334.3 mm, below the jacks. It sits between two legend arrows closer than
      the library's 4 mm button part is wide, so it is drawn as a pinhole in the metal and not placed
      as a part. The Factory Reset/Mode button (callout 5) is the blue one and is a part.
  lamp-size:
    confidence: estimated
    note: >-
      The cage lamp windows are placed as common/led-arrow-sm@1 (2.25 by 2.0 mm). The image shows triangles
      about 2.8 by 2.6 mm, which common/led-arrow@1 (3.6 by 3.2) would match, but two of those overlap
      at the 2.95 mm step the image gives, so the smaller part is used.
  rear:
    confidence: photo-measured
    note: >-
      Figures 13 and 15 and the 48P's rear photograph for the parts the two share. From the left - the
      MGMT RJ-45 over a USB 2.0 Type-A port in one housing, the CON RJ-45, the earth symbol, a lighter
      plate with two bare holes, the ESD symbol and the ESD socket, a fan at 135.4 mm, a label field,
      a second fan at 360.9 mm and the AC inlet at 402.1 mm with its legend above (AC INPUT 100-240V 50-60Hz
      7A Max, printed on the metal). Five screws stand along the lower edge. The label corner marks across
      the middle frame the serial number and CLEI labels (callouts 4 and 6). Stickers are regions and
      are not drawn.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Tables 3, 10 and 26 and the rear callouts name a built-in 450 W AC power supply and two built-in
      fans, and Table 45 lists the switch "with in-built fans and power supply". The cooling overview
      says once that the fan modules are hot-removable field-replaceable units, but the guide has no removal
      or replacement procedure for a fan or a supply (its Maintain Components chapter covers transceivers
      and fibre only), names no part number for either, the rear callouts call them built in, and the
      image shows round grilles flush with the panel with no handle, latch or module outline. They are
      taken as part of the chassis, not bays and not components.
  airflow:
    confidence: datasheet
    note: >-
      Table 26 and Table 10 - two built-in fans with front-to-back (AFO) cooling, cold air entering the
      front vents and leaving the rear. The overview says back-to-front can be ordered but the guide lists
      no part number or figure for it, so no back-to-front configuration is modelled.
  earthing:
    confidence: photo-measured
    note: >-
      Table 46 and Figure 96 - a protective earthing terminal on the rear panel for a Panduit LCD10-14A-L
      lug on two M5 by 10 mm screws, which are separately orderable. The image shows two bare holes on
      a lighter plate 15.7 mm apart (the 5/8 in lug pitch is 15.9) and no screws, so they were drawn as
      holes on the plate. They are still drawn as bare holes, now parts: one two-hole seat on that lug's
      5/8 in. pitch (`ground-stud-pitch` says how the pitch is read).
  mounting:
    confidence: datasheet
    note: >-
      Table 4 and the mounting topics - the 2-post kit SRX34X-RMK ships in the box (front-mounting brackets,
      two in Table 45), the four-post kit EX-4PST-RMK and the wall kit EX-WMK are orderable. The four-post
      kit also holds 2 in recessed front brackets, so a recess of 50.8 mm is the one measured position.
      No kit is listed under chassis.kits in this change, and none of the kit part numbers is modelled.
  colour:
    confidence: photo-measured
    note: >-
      The face colour is the 48P photograph's median of the bare front, #acb1b6, carried at #a3a8af, a
      little under the studio light, as the library does; Figure 12 reads the same.
  power:
    confidence: datasheet
    note: >-
      Tables 10, 27 and 30 - a 450 W AC supply, 100 to 240 V, 50/60 Hz; at most 80 W input without PoE;
      the PoE budget is 370 W with a 73 W system budget, 443 W in all against the supply's 450. The budget
      is a separate figure and is not added to the 80 W. The rear legend prints 7A Max.
  ground-stud-pitch:
    confidence: estimated
    note: >-
      INFERRED, NOT STATED. Table 46 names two M5 x 10 mm screws with washer (separately orderable) and
      a Panduit LCD10-14A-L lug or equivalent (not provided) for the 24 and 48 port models, and gives
      no spacing. The image puts the two holes 15.7 mm apart, which is the 5/8 in. (15.875) of the library's
      two-hole lug for the same hole-spacing code (Panduit LCD6-10A-L: '.63 hole spacing'). The terminal
      is `common/ground-hole-pair-5-8-m5@1`: two bare M5 holes on 5/8 in. centres, presenting `stud-pair-5-8`,
      so one two-hole lug (`generic/two-hole-lug-5-8@1`) lands across them and a ring lug still lands
      on either hole. The holes stay bare, as the held photograph of the EX4100-F-48P shows them; the
      screws are fitted with the lug. The holes were drawn 15.7 apart as decor and the pair stands on
      their midpoint.
attrs:
  physical: {weight: '4.745 kg (4745 g), Table 11'}
  power:
    power-max-w: 80
    power-envelope: bare
    poe-budget-w: 370 W (system budget 73 W, total 443 W of the 450 W supply), Table 30
    poe-standard: PoE+ on all 24 ports, 30 W by default (Table 11)
    power-input-ac: 100 through 240 VAC, 50/60 Hz (Table 28)
    power-current-max: 7 A, as printed on the rear panel
  thermal:
    heat-dissipation: 272.8 BTU/hr at the 80 W maximum input without PoE (Table 27)
    cooling: two built-in fans, front-to-back airflow (Table 26)
  environmental:
    acoustic-noise: 40.1 dB typical and 45.1 dB maximum LpA with 450 W AC AFO (Table 21)
    operating-temp: 0 to 45 C (32 to 113 F); 40 C with a 10GBASE-T pluggable
    storage-temp: -40 to 70 C (-40 to 158 F) in the shipping container
    humidity: 10 to 85 percent, noncondensing
    altitude: no performance degradation up to 1524 m (5000 ft)
  platform: {first-junos-release: 22.2R1 (Table 10)}
  features:
    virtual-chassis: >-
      up to 10 EX4100 and EX4100-F switches; the four left cages are the Virtual Chassis ports. The uplink
      ports cannot be used as Virtual Chassis ports, and a 10GBASE-T transceiver cannot form a Virtual
      Chassis in a Virtual Chassis port
    uplink-ports: four front SFP+ ports taking 1G SFP and 10G SFP+ singly or mixed
  compliance: {seismic: tested for Zone 4 earthquake safety}
  lifecycle: {eol: none-announced}
