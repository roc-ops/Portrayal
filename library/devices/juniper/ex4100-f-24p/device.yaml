gaps:
- what: vcp-speed
  scope:
  - vcp
  reason: sources-disagree
  note: >-
    Table 11 and the callouts give the four Virtual Chassis ports as 1GbE/10GbE SFP+, while Figure 32,
    Table 25 and the Junos listing name them SFP+/SFP28 and give a 25 Gbps speed indication. The tables
    are used (10g); the cages are the same SFP-family cage either way.
  wanted: Juniper's statement of the Virtual Chassis port speeds.
- what: port-status-lamp-states
  scope:
  - rj45
  - vcp
  - uplink
  reason: vendor-silent
  note: >-
    The Status lamp changes meaning with the mode button (Table 25), so the jack lamps keep the component's
    link and activity vocabulary and the mode lamps carry the meaning.
  wanted: none beyond the component's own vocabulary.
- what: cld-lamp-states
  scope:
  - led-cld
  reason: vendor-silent
  note: >-
    The guide names the CLD lamp and sends the reader to the cloud-ready blink patterns, which it does
    not hold.
  wanted: the cloud-ready LED blink patterns
- what: label-plates
  scope:
  - front
  - rear
  reason: needs-drawing
  note: >-
    The claim code, serial number and CLEI labels are stickers with no content in any figure; they are
    named regions and are not drawn.
  wanted: none; stickers
- what: studio-photograph
  scope:
  - front
  - rear
  reason: needs-photo
  note: >-
    The maker's image library holds no photograph of this model, so the front and rear are read from the
    guide's Figures 12 and 13 and cross-checked against the 48P.
  wanted: a straight-on studio photograph of the EX4100-F-24P
- what: interface-names
  scope:
  - rj45
  - vcp
  - uplink
  reason: vendor-silent
  note: >-
    The numbers are not printed on the metal and the guide's Junos listing is for a 48-port model, so
    no interfaces block is written.
  wanted: none
- what: four-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: A flat drawing or photograph of the lid, the underside and the side panels.
- what: ground-pair-pitch
  scope:
  - ground-pair
  reason: vendor-silent
  note: >-
    The guide names the screws and the lug and gives no spacing for the two holes; `ground-stud-pitch`
    says what the pair is drawn at and why.
  wanted: a drawing that dimensions the two holes, or the lug's own datasheet
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g, poe: 802.3at}
    description: >-
      24 PoE+ ports numbered 0 to 23 as printed, the upper jack of a column takes the even number
  vcp:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      Four SFP+ Virtual Chassis ports numbered 0 to 3, in two columns of two cages, the upper cage of
      a column even
  vcp-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: Two lamp windows for each Virtual Chassis port, Link Activity and Status
  uplink:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: Four SFP+ uplink ports numbered 0 to 3, bracketed and labelled UPLINK
  uplink-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: Two lamp windows for each uplink port, Link Activity and Status
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      how the switch is reached and restarted - the USB Type-C console and the mode button on the front,
      the RJ-45 console, the management Ethernet port and the USB port on the rear
  status-leds: {term: LED, role: indicator, index-origin: 0, description: 'the SYS, ALM, MST and CLD chassis
      lamps'}
  mode-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the SPD, DX, EN and PoE port mode lamps; the lit one says what each Status lamp shows
  power-input: {term: Inlet, role: service, index-origin: 0}
  esd: {term: Point, role: furniture, index-origin: 0}
  furniture: {term: Item, role: furniture, index-origin: 0}
  grounding:
    term: Point
    role: furniture
    index-origin: 0
    description: the earthing terminal, two bare M5 holes for a two-hole lug (Table 46)
