format: 1
kind: device
name: ex2200-24t
version: 0.2.0
maturity: modelled
manufacturer: Juniper
model: EX2200-24T
portfolio: {line: EX Series, family: EX2200}
description: >-
  Juniper EX2200-24T is a fixed 1RU Gigabit Ethernet access switch. It has 24 10/100/1000BASE-T ports
  without PoE and four built-in 1-Gigabit SFP uplink ports. The front carries the 24 jacks in two stacked
  rows numbered 0 to 23 on the right half of the face (the upper jack of a column takes the even number), the
  four uplinks numbered 0 to 3, two chassis status lamps, four port-mode lamps and a Factory Reset/Mode
  button; the left half is blank. The rear carries the management Ethernet port with a USB port under it, the
  RJ-45 console port, the redundant power system (RPS) port, a two-hole earthing terminal, an ESD point, two
  exhaust fans with a sealed third opening and the AC power cord inlet. The power supply and the fans are
  built into the chassis, so there are no bays. The EX2200-24T-DC is the same chassis with a DC supply, whose
  four-terminal block replaces the AC inlet; it is the dc configuration. The EX2200-24P is the same front
  with PoE.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX2200 and EX2200-C Switches Hardware Guide, Juniper Networks, published 2022-02-02 (268 pages), the copy
      held in Juniper's EX documentation archive
      (https://www.juniper.net/documentation/en_US/release-independent/downloads/ex-series/ex-series-doc-archives.zip,
      member ex-series-doc-archives/ex2200.pdf): Figure 2 (24-port front), Figure 5 (rear), Figure 48 (DC
      terminals), Table 3 (models), Table 5 (chassis size and weight), Tables 6 to 10 (LEDs), the cooling system
      section with Figures 14 and 15, Tables 11 to 13 (power) and Table 16 (environment). The guide is the only
      source held for the EX2200: Juniper's datasheet is dehosted, and the maker's image library and the held
      photograph set have no EX2200 photograph. The guide carries Juniper's copyright and reserves its rights,
      so its figures were read for what is on each face and where, and none was copied; every skin here is
      drawn from those measurements.
  gate-1:
    confidence: measured
    note: >-
      Figure 2 was rendered at 600 dpi and measured with a pixel ruler, together with Figure 1 whose front face
      it shares. The 48-port figure's front face is 2430 px across and 237 px down: 5.467 px per mm across from
      the 445 mm of Table 5 and 5.34 down from 44.45 mm, a 2.4 percent aspect error, so x and y are each taken
      from their own dimension and every position is estimated and good to about a millimetre. The jack width
      reads 12.7 mm, the registry's 12.7 for the ganged RJ-45 cell, on a quantity the scale never saw. The
      figures are perspective views from above and the front face is the near rectangle; Figure 5 (rear) is a
      flat elevation, 2722 px across and 266 down: 6.124 px per mm across and 5.99 down, a 2.2 percent aspect
      error. Figure 2's two shells stand where the last two of Figure 1 do (186.8 mm measured, 187.3 drawn).
  chassis:
    confidence: datasheet
    note: >-
      Table 5: height 1.75 in (4.45 cm), width 17.5 in (44.5 cm) and 19 in (48.2 cm) with the mounting brackets
      attached, depth 10.5 in (26.7 cm), weight 6 lb (2.7 kg) for the EX2200-24T and the EX2200-24T-DC. 445.0 x
      44.45 x 267.0 is carried: width and depth as the printed metric, the height as the 1U pitch Table 31 gives
      (1.75 in). The figures draw no ears, and the jack pitch closing on the registry at that width says the
      figure is the body.
  front-layout:
    confidence: estimated
    note: >-
      estimated - read off Figure 2 as described under gate-1. The 24 jacks stand in two shells of six columns
      at 187.3 and 277.4 mm, the first jack at 190.6 mm, the jack pitch the registry's 13.97 and a 6.27 gutter
      (shell step 90.1 mm), the shell boxes 89.0 mm wide, rows 14.85 mm apart, the upper row turned 180 so its
      lamp tabs are above as the figure shows. The four uplink cages abut on the registry's 14.25 pitch from
      366.1 mm and stand 27.4 mm down. The left half of the face is blank in the figure. A long recessed slot
      runs along the top edge from 7.1 to 438.1 mm; it carries no printing. The guide's figure draws four small
      oval marks along the top edge, no vents, no model name and no logo on the front, so none is drawn and no
      logo zone is reserved: the real unit's printing is not known from any source held. The chassis and shell
      colours are borrowed from the EX2300 photographs (see colour).
  port-numbering:
    confidence: drawing
    note: >-
      drawing - Figure 2 prints each column's two numbers above its shell, the even number up and left of a
      short divider and the odd number down and right (0 and 1, 2 and 3, ... 22 and 23), and the four
      uplinks 0 to 3 between their two lamps. Both numbers of a column are printed above the upper jack, so
      which jack takes which is by analogy with the EX2300 faceplate (the upper jack takes the even number),
      estimated. The even numeral is drawn 2.55 mm left of its jack's centre and the odd one on its centre, as
      measured on Figure 1; the small divider lines between them are not drawn. Port numbers are as printed,
      from 0. The Junos interface names are not printed: Table 4 gives PIC 0 as 24x10/100/1000BASE-T and PIC 1
      as 4x GE SFP, i.e. ge-0/0/0 to ge-0/0/23 and ge-0/1/0 to ge-0/1/3; they are recorded here and not in an
      interfaces block because the faceplate does not print them.
  lamps:
    confidence: datasheet
    note: >-
      Hardware guide, Tables 6 to 10 and Figures 7, 11 and 12. Each RJ-45 port and uplink has two lamps,
      Link/Activity and Status; Figure 11 puts them on the two tabs of the jack. The Status lamp reads out
      whichever of speed (SPD), duplex (DX), administrative status (EN) and PoE (POE) the Factory Reset/Mode
      button has selected, shown by which port-mode lamp is lit; the guide lists four port-mode lamps on
      every non-compact model, PoE or not. SYS is green and ALM unlit, amber or red. The jack lamps keep the
      component's link and activity vocabulary because a block cannot override it per lamp. Figure 12 draws
      the uplink lamps as two circles either side of each numeral; the left is taken as Link/Activity and the
      right as Status, which no figure confirms, so it is estimated. The SYS and ALM lamps are drawn as the
      figure draws them, oblong, and their legends tilted in the figure are printed level here.
  uplinks:
    confidence: drawing
    note: >-
      drawing - one row of four built-in SFP cages numbered 0 to 3 (Figure 2); the guide gives 1-gigabit SFP
      transceivers for fibre and copper and says an SFP uplink can be configured as a Virtual Chassis port.
  rear-layout:
    confidence: estimated
    note: >-
      estimated - positions read off Figure 5 (labelled EX2200-24-4G) as described under gate-1: the management
      jack with the USB port under it in one housing, the RJ-45 console port, the RPS port (a rounded plate
      with a slotted opening and four screws), the two-hole earthing plate with the earth symbol, the ESD
      point, three round exhaust openings, the two small slots at 270 mm and the AC inlet, which the guide
      names in that order. The three openings are drawn at 142.0, 192.2 and 236.9 mm; their uneven spacing is
      the figure's. The guide says the two left openings have fans and the third has none and is closed on
      non-PoE models, so the third is drawn sealed here. The serial number ID label is a paper label carrying a
      real serial number and is not drawn; the power cord retainer clips are accessories and are not drawn.
      Figure 5 prints no legend near the inlet, so none is drawn. The jack housing is one dark recess behind
      the management and USB ports.
  rear-dc:
    confidence: estimated
    note: >-
      estimated - no flat figure of the DC rear exists in the guide: Figure 48 is a close view of the terminals
      and Figure 5 is the AC rear, whose inlet the guide says is replaced by "DC power terminals" ("AC power
      cord inlet or DC power terminals"). The DC rear is Figure 5's with the inlet replaced by a block of four
      terminals labelled, left to right, B-, A-, B+ and A+ (Figure 48) under a clear plastic cover, centred on
      the inlet's centre (419.2 mm) and drawn 36.0 x 18.4 mm; the size has no scale anchor and is estimated.
      The block is chassis art and not a component: the library has no four-pole DC terminal block
      (common/dc-terminal-24 has three poles) and the DCIM export has no row for such a part. A and B are two
      inputs of one supply; the guide says a DC-powered switch provides no PoE.
  rps-port:
    confidence: estimated
    note: >-
      estimated - the RPS port (Figure 5 callout, guide list of rear panel components) is the part
      juniper/ex2200-rps-port@1, placed at 50.1 mm with its four screws placed beside it; the plate and its
      opening are read off Figure 5 as gate-1 describes. The part presents no interface: the guide names no
      RPS connector type and the registered key ex3300-rps covers the EX3300 only, so nothing mates the port
      and it is not usable yet. The guide names no RPS part number and no document of the RPS is held.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Hardware guide, Power Supply in EX2200 Switches: "The power supply in EX2200 switches is built in along
      the rear panel of the chassis", with an AC power cord inlet or DC power terminals on it; Table 4 lists
      "Built-in power supply" and the cooling system is two fans along the rear. Nothing in the guide describes removing
      or replacing either. They are part of the chassis, not bays and not components.
  airflow:
    confidence: datasheet
    note: >-
      the cooling system provides side-to-rear chassis cooling (Figure 14 for models without PoE): air enters
      by the side vents and leaves by the rear openings. The chassis enum has no side-to-rear value, so the side
      value is carried.
  power:
    confidence: datasheet
    note: >-
      Table 11: maximum power consumed 50 W for the EX2200-24T and for the EX2200-24T-DC, no PoE, 170.5
      BTU/hour; Table 12: AC input 100 through 240 VAC, 50/60 Hz, 1.8 A at 100 VAC and 0.5 A at 230 VAC for
      switches with no PoE ports; Table 13: DC input 36 through 75 VDC, 3.5 A maximum, power supply output 100
      W, output holdup time 1 ms minimum (the guide recommends 3.5 A at 48 VDC and a 10 A breaker; its DC
      wiring text asks for a source of at least 7.5 A at -48 VDC, which is a facility figure and is not
      carried).
  colour:
    confidence: borrowed
    note: >-
      borrowed - the chassis #919599 and the jack shells #b1b2b5 are the EX2300 front photograph's medians. The
      guide's figures are line drawings with no colour and no EX2200 photograph is held, so these are a
      relative's and not a reading of this device.
attrs:
  physical:
    weight-note: 6 lb (2.7 kg), the same for the EX2200-24T-DC, Table 5
  power:
    power-max-w: 50
    power-envelope: bare
    power-input: 100 through 240 VAC, 50/60 Hz; the -DC part number 36 through 75 VDC
    power-current-max: 1.8 A at 100 VAC; 0.5 A at 230 VAC; -DC 3.5 A
  thermal:
    cooling: two built-in fans, side-to-rear
    thermal-output-btu-h: 170.5
  environmental:
    operating-temp-c: 0 to 45
    humidity: 10 to 85 percent, noncondensing
    altitude-ft: 10,000
  features:
    optics-sfp: >-
      hardware guide, Uplink Ports: the four uplink ports take 1-gigabit SFP transceivers, fibre or copper, and
      can be configured as Virtual Chassis ports
    virtual-chassis: up to four EX2200 switches, including EX2200-C, from Junos OS 12.2
