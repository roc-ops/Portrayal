  color: '#919599'
  airflow: side
  power: ac
gaps:
- what: rack-ears
  scope: [front]
  reason: needs-drawing
  note: >-
    Table 31 lists the supplied two-post mounting brackets (EX2200: provided) and a separately orderable
    four-post rack-mount kit with 2-inch recess front brackets, and gives no part number for the kit; no figure
    measures a bracket position, so no ear position is stated and no kit is listed.
  wanted: The four-post rack-mount kit's part number and a dimensioned drawing of the bracket positions.
- what: eol
  scope: [front]
  reason: vendor-silent
  note: >-
    Searched for an end-of-life notice: only third-party lifecycle trackers answered (an end-of-sale in 2019
    is reported); Juniper's own bulletin was not found, so no lifecycle is written.
  wanted: Juniper's end-of-life bulletin for the EX2200 line.
- what: photographs
  scope: [front, rear]
  reason: needs-photo
  note: >-
    No photograph of any EX2200 is held and the maker's image library no longer carries one; the faces are
    read from the guide's figures alone, which are line drawings, so colour, finish, the printing on the
    front (model name, logo, port numerals) and the legends on the rear are not confirmed, and the DC rear
    has no flat figure at all.
  wanted: Straight-on studio photographs of the EX2200-24T front, its AC rear and its DC rear.
- what: dc-terminal-block-part
  scope: [rear]
  reason: vendor-silent
  note: >-
    The four-terminal DC block of the -DC part number is chassis art; no library component has four poles and
    no document held gives its part, its pole pitch or its legend.
  wanted: The DC terminal block's dimensions and printed legend.
- what: jack-lamp-meaning
  scope: [rj45]
  reason: vendor-silent
  note: >-
    The jack lamps carry the component's link and activity vocabulary; the guide's Status lamp switches
    meaning with the mode button and no per-lamp state list fits the component.
  wanted: none beyond the component's own vocabulary.
- what: rps-port-connector
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The connector type and pinout of the redundant power system port, and the model of the external
    power system. The guide labels the port and says nothing else, so the part presents no interface
    and nothing mates it.

groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g}
    description: >-
      the 24 built-in 10/100/1000BASE-T ports; rel-pos carries the number printed on the faceplate, the upper
      jack of a column takes the even number
  uplink:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp, speed: 1g}
    description: the four built-in SFP uplink ports, numbered 0 to 3
  uplink-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: two lamps either side of each uplink numeral, Link/Activity and Status
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the management corner of the rear - how the switch is reached out of band (the management Ethernet
      port, the USB port and the RJ-45 console port), with the RPS port beside them
  controls:
    term: Button
    role: management
    index-origin: 0
    description: the Factory Reset/Mode button
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the SYS and ALM chassis status lamps
  mode-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: the SPD, DX, EN and POE port-mode lamps; the one lit says what each Status lamp shows
  power-input:
    term: Inlet
    role: service
    index-origin: 0
  esd:
    term: Point
    role: furniture
    index-origin: 0
  furniture:
    term: Item
    role: furniture
    index-origin: 0
