configurations:
  ac:
    kind: base
    description: >-
      EX2200-24T-4G - 24 10/100/1000 ports without PoE and four SFP uplinks, built-in AC supply and two
      built-in fans, side-to-rear airflow (Table 3).
    default: true
    part-numbers:
      EX2200-24T-4G: {}
  dc:
    kind: orderable
    description: >-
      EX2200-24T-4G-DC - the same front with a built-in DC supply (Table 3, Table 13, Figure 48): a block of
      four terminals (B-, A-, B+, A+) replaces the AC inlet on the rear. The guide gives the same weight (2.7 kg)
      and says a DC-powered switch provides no PoE, as this model has none.
    power: dc
    views:
      rear: rear-dc
    part-numbers:
      EX2200-24T-4G-DC: {}
