format: 1
kind: device
name: ex4100-f-48t
version: 0.2.0
maturity: modelled
manufacturer: Juniper
model: EX4100-F-48T
portfolio: {line: EX Series, family: EX4100-F}
description: >-
  Juniper EX4100-F-48T is a fixed 1RU access switch with 48 10/100/1000BASE-T ports without PoE, four
  1/10GbE SFP+ Virtual Chassis ports and four 10GbE SFP+ uplink ports. The front carries the jacks in
  two stacked rows numbered 0 to 47, the two 2x2 cage groups, the chassis and port mode lamps, a Factory
  Reset/Mode button, a reset pinhole and a USB Type-C console port. The rear carries the management port
  with a USB port under it, the RJ-45 console port, the earthing terminal, an ESD point, one fan and the
  AC inlet. The 90 W supply and the fan are built into the chassis, so there are no bays. The EX4100-F-48P
  is the same front with PoE+ and a deeper chassis.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      EX4100-F Switch Hardware Guide, Juniper Networks, PDF created 2026-10-01 (271 pages; https://www.juniper.net/documentation/us/en/hardware/ex4100-f/ex4100-f.pdf):
      Tables 3 to 5, 16, 17, 18, 21 to 27 and 45, Figures 24 to 27, the mounting topics and the Junos
      CLI listing of the chassis hardware. Juniper's own straight-on studio photographs ex4100-f-48t-front-high.jpg
      and ex4100-f-48t-rear-high.jpg (1500 px wide JPEGs from the maker's public image library, no terms
      of use stated on the files), which supply every position below. The HPE PSNow datasheet (a00150781enw)
      was tried once and did not answer, so no datasheet figure is used. Nothing of the guide or the photographs
      is copied here: every face is drawn new from measurements. No Visio stencil, 3D model or other held
      photograph of the EX4100-F was available, so none was used. End of life was searched 2026-10-22:
      no Juniper notice for the EX4100-F was found (a reseller tracker lists the EX4100 family as supported
      with no dates), so the lifecycle is none announced.
  chassis:
    confidence: datasheet
    note: >-
      Tables 17 and 18 - height 1.72 in (4.37 cm), width 17.36 in (44.09 cm), depth 10.1 in (25.65 cm),
      weight 3885 g. The width is the body between the bracket fold lines; the guide gives no 19 in figure
      and the photographs show no ears. The depth 256.5 mm is the centimetre figure.
  scale:
    confidence: photo-measured
    note: >-
      Gate 1 - both photographs are straight-on studio shots. The front face is 1405 px across and the
      rear 1426, against 440.9 mm that is 3.187 and 3.234 px/mm. The rear's height of 144.5 px against
      43.7 mm is 3.31 px/mm, 2.2 percent above the width, so y is read at 3.307 there and x at 3.234.
      The jack pitch reads 44.3 px, 13.9 mm, the registry's 13.97 mm on a quantity the scale never saw.
      Horizontal positions are measured from the centre of the face (the left and right edges disagree
      by up to a millimetre in the bevel) and every position is estimated, good to about half a millimetre
      across and one down.
  ports:
    confidence: photo-measured
    note: >-
      Table 17 and Figure 26 - 48 RJ-45 ports in two rows of 24, in three shells of eight columns, then
      two 2x2 groups of SFP+ cages. The in-shell step is the registry's 13.97 and the shell step reads
      117.5 mm, a gutter of 5.6. The rows centre 13.8 mm apart on this photograph and 14.1 on the 48P's;
      14.0 is used for both. The upper row is turned 180 so that its keyway and lamps face up, as photographed.
      The cages are two columns by two rows, abutting on the registry's 14.25 pitch, at 360.1 and 391.8
      mm; the registry's 15.0 row pitch is used for the two rows.
  port-numbering:
    confidence: photo-measured
    note: >-
      The legends under each column read 0 up-arrow, down-arrow 1, then 2 and 3 up to 46 and 47, so the
      upper jack of a column is the even port; all are white on this model. The cages print 0 up-arrow,
      down-arrow 1, 2 up-arrow, down-arrow 3 under each group, and the right group is bracketed and labelled
      UPLINK. The left group is the Virtual Chassis ports. The numbers are as printed, from 0. Interface
      names are not printed on the metal. The guide's Junos listing for a 48-port model gives ge-0/0/0
      to ge-0/0/47 for the jacks, et-0/1/n, ge-0/1/n and xe-0/1/n for the four Virtual Chassis ports (PIC
      1, 4x1G/10G/25G SFP/SFP+/SFP28) and ge-0/2/n and xe-0/2/n for the four uplinks (PIC 2, 4x1G/10G
      SFP/SFP+).
  port-lamps:
    confidence: datasheet
    note: >-
      Figures 30 to 32 and Table 24 - each jack and each cage has a Link Activity lamp and a Status lamp.
      The jacks carry them in their keyway corners. The photograph shows four small triangular windows
      per cage column in the metal band between the two cage rows, two pointing down and two up; they
      are read as the two lamps of the upper port (the down-pointing ones, at 2.05 and 9.46 mm from the
      column edge) and of the lower port (the up-pointing ones, at 5.0 and 12.4), the left one of each
      pair being Link Activity by analogy with the jacks. No figure says which window is which, so the
      assignment is estimated. The Status lamp shows what the mode lamps select (Table 25), so its states
      cannot be one vocabulary here.
  status-block:
    confidence: photo-measured
    note: >-
      Figures 26 and 28 and Tables 22 and 25 - a dark plate at the right end holds the chassis lamps SYS,
      ALM, MST and CLD (left column) and the port mode lamps SPD, DX and EN (right column, three rows:
      the PoE lamp is not available on a model without PoE, Table 25 note, and the photograph prints no
      PoE legend), each lamp above its legend, a round blue Factory Reset/Mode button with a list icon
      and the USB Type-C console (CON). The columns centre at 425.9 and 431.6 mm. The lamps are very faint
      in the photograph and are placed from their legends.
  drawing-vs-photo:
    confidence: photo-measured
    note: >-
      The guide's Figure 24 is the same studio photograph. The legends are drawn from the photograph:
      the model line reads EX4100-F in white with no PoE mark, and the jack and cage numbers are white.
      The maker's logo and Mist AI mark beside the model line are not drawn and are reserved as a logo-zone.
      This model's top vent field is shorter than the 48P's and its lower vent runs only under the right
      end.
  reset:
    confidence: photo-measured
    note: >-
      Figure 26 callout 9 - the reset button is the small round pinhole between the legends of the two
      jacks of column 22, at 334.3 mm, below the jacks. It sits between two legend arrows closer than
      the library's 4 mm button part is wide, so it is drawn as a pinhole in the metal and not placed
      as a part. The Factory Reset/Mode button (callout 5) is the blue one and is a part.
  lamp-size:
    confidence: estimated
    note: >-
      The cage lamp windows are placed as common/led-arrow-sm@1 (2.25 by 2.0 mm). The photograph shows
      triangles about 2.8 by 2.6 mm, which common/led-arrow@1 (3.6 by 3.2) would match, but two of those
      overlap at the 2.95 mm step the photograph gives, so the smaller part is used.
  rear:
    confidence: photo-measured
    note: >-
      Figures 25 and 27 and the rear photograph. From the left - the MGMT RJ-45 over a USB 2.0 Type-A
      port in one housing, the CON RJ-45, a lighter plate with two bare holes and the earth symbol to
      its right, the ESD socket and symbol below the plate, one round fan at 115.3 mm, a label field and
      the AC inlet at 401.9 mm with its legend above (AC INPUT 100-240V 50-60Hz 1.2A Max, printed on the
      metal). Five screws stand along the lower edge. This rear differs from the 48P's: the earth symbol
      is beside the plate and not above the console, the ESD socket is below the plate, and there is one
      fan. The label corner marks across the middle frame the serial number and CLEI labels (callouts
      4 and 6); the claim code label (callout 8) has no corner marks in the photograph. Stickers are regions
      and are not drawn.
  built-in-power-and-fans:
    confidence: datasheet
    note: >-
      Tables 3, 16 and 26 and the rear callouts name a built-in 90 W AC power supply and a built-in fan,
      and Table 45 lists the switch "with in-built fans and power supply". The cooling overview says once
      that the fan modules are hot-removable field-replaceable units, but the guide has no removal or
      replacement procedure for a fan or a supply (its Maintain Components chapter covers transceivers
      and fibre only), names no part number for either, the rear callouts call them built in, and the
      photograph shows a round grille flush with the panel with no handle, latch or module outline. They
      are taken as part of the chassis, not bays and not components. The Junos listing in the guide shows
      a JPSU-920W-AC-AFO and fan trays for an EX4100-48P, which is a different box.
  airflow:
    confidence: datasheet
    note: >-
      Table 26 and Table 16 - one built-in fan with front-to-back (AFO) cooling, cold air entering the
      front vents and leaving the rear. The overview says back-to-front can be ordered but the guide lists
      no part number or figure for it, so no back-to-front configuration is modelled.
  earthing:
    confidence: photo-measured
    note: >-
      Table 46 and Figure 96 - a protective earthing terminal on the rear panel for a Panduit LCD10-14A-L
      lug on two M5 by 10 mm screws, which are separately orderable. The photograph shows two bare holes
      on a lighter plate 15.7 mm apart (the 5/8 in lug pitch is 15.9) and no screws, so they were drawn
      as holes on the plate. They are still drawn as bare holes, now parts: one two-hole seat on that
      lug's 5/8 in. pitch (`ground-stud-pitch` says how the pitch is read).
  mounting:
    confidence: datasheet
    note: >-
      Table 4 and the mounting topics - the 2-post kit SRX34X-RMK ships in the box (front-mounting brackets,
      two in Table 45), the four-post kit EX-4PST-RMK and the wall kit EX-WMK are orderable. The four-post
      kit also holds 2 in recessed front brackets, so a recess of 50.8 mm is the one measured position.
      No kit is listed under chassis.kits in this change, and none of the kit part numbers is modelled.
  colour:
    confidence: photo-measured
    note: >-
      Median of the bare front face in the photograph, #acb2bc, and of the rear, #9da4ae; the status plate
      reads #4c5668. The face is carried at #a3a8af, a little under the studio light, as the library does.
  power:
    confidence: datasheet
    note: >-
      Tables 16, 21 and 27 - a 90 W AC supply, 100 to 240 V, 50/60 Hz; at most 70 W input. The model has
      no PoE. The rear legend prints 1.2A Max.
  ground-stud-pitch:
    confidence: estimated
    note: >-
      INFERRED, NOT STATED. Table 46 names two M5 x 10 mm screws with washer (separately orderable) and
      a Panduit LCD10-14A-L lug or equivalent (not provided) for the 24 and 48 port models, and gives
      no spacing. The image puts the two holes 15.7 mm apart, which is the 5/8 in. (15.875) of the library's
      two-hole lug for the same hole-spacing code (Panduit LCD6-10A-L: '.63 hole spacing'). The terminal
      is `common/ground-hole-pair-5-8-m5@1`: two bare M5 holes on 5/8 in. centres, presenting `stud-pair-5-8`,
      so one two-hole lug (`generic/two-hole-lug-5-8@1`) lands across them and a ring lug still lands
      on either hole. The holes stay bare, as the photograph shows them; the screws are fitted with the
      lug. The holes were drawn 15.7 apart as decor and the pair stands on their midpoint.
attrs:
  physical: {weight: '3.885 kg (3885 g), Table 17'}
  power: {power-max-w: 70, power-envelope: bare, power-input-ac: '100 through 240 VAC, 50/60 Hz (Table
      28)', power-current-max: '1.2 A, as printed on the rear panel'}
  thermal: {heat-dissipation: 238.7 BTU/hr at the 70 W maximum input (Table 27), cooling: 'one built-in
      fan, front-to-back airflow (Table 26)'}
  environmental: {acoustic-noise: 37.1 dB maximum LpA with 90 W AC AFO (Table 21), operating-temp: 0 to
      45 C (32 to 113 F); 40 C with a 10GBASE-T pluggable, storage-temp: -40 to 70 C (-40 to 158 F) in
      the shipping container, humidity: '10 to 85 percent, noncondensing', altitude: no performance degradation
      up to 1524 m (5000 ft)}
  platform: {first-junos-release: 22.2R1 (Table 16)}
  features:
    virtual-chassis: >-
      up to 10 EX4100 and EX4100-F switches; the four left cages are the Virtual Chassis ports. The uplink
      ports cannot be used as Virtual Chassis ports, and a 10GBASE-T transceiver cannot form a Virtual
      Chassis in a Virtual Chassis port
    uplink-ports: four front SFP+ ports taking 1G SFP and 10G SFP+ singly or mixed
  compliance: {seismic: tested for Zone 4 earthquake safety}
  lifecycle: {eol: none-announced}
