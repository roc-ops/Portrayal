format: 1
kind: device
name: qfx5120-48ym
version: 0.1.2
maturity: modelled
manufacturer: Juniper
model: QFX5120-48YM
portfolio: {line: QFX Series, family: QFX5120}
description: >-
  Juniper QFX5120-48YM, a 1RU data-centre leaf switch running Junos OS. It has 48 SFP28 ports (25, 10
  or 1 GbE, set a quad at a time) and 8 QSFP28 ports (100 or 40 GbE, channelizable). All have MACsec.
  The ports sit in three blocks on the port side: 24 SFP28, then the 8 QSFP28 in four columns, then 24
  more SFP28. A strip beneath them holds one lamp per port. The rear carries two power supplies, five
  fan modules, the console, two RJ-45 management ports and a USB port. It also has the 10M OUT and PPS
  OUT timing ports, the reset button and the four chassis lamps. It ships as one front panel in four power
  and airflow variants: AC or DC supplies, front-to-back (AIR OUT) or back-to-front (AIR IN).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Juniper QFX5120 Switch Hardware Guide, published 2026-09-30, 339 pages (copyright HPE): the front
      and rear figures 35 to 40, Table 7 (models and variants), Table 9 (physical specifications), the
      LED sections (Tables 11, 13, 20, 21, 24, 34), the airflow tables 23 and 26 and the power tables
      30 and 40, and the section on connecting 1-PPS and 10-MHz measurement devices. Juniper's studio
      photographs of the 48YM, front and rear, 1500 x 216 and 1500 x 228 px (image library, qfx5120-48ym-front-high
      and -rear-high): LOW RESOLUTION, 3.2 px/mm, so every position read off them is good to about 0.3
      mm. THE HPE DATASHEET (a00150810enw) DID NOT ANSWER, a transport error on the one attempt, so no
      datasheet figure is used. No mechanical drawing and no 3D model were found. No end-of-sale announcement
      for the QFX5120-48YM was found on the manufacturer's pages, and the guide states none.
  chassis:
    confidence: datasheet
    note: >-
      guide Table 9: 1.72 in (4.37 cm) high, 17.36 in (44.09 cm) wide, 20.48 in (52.02 cm) deep excluding
      the fan and power supply handles, 24.8 lb (11.25 kg) with two supplies and the fans. The width is
      the body: the table says the outer edges of the front mounting brackets extend it to 19 in, so the
      brackets are not part of the body and are not modelled.
  gate-1:
    confidence: photo-measured
    note: >-
      The front photograph measures 1416 x 140 px between the body edges, an aspect of 10.1 against the
      table's 440.9 / 43.7 = 10.09; scale 3.21 px/mm across. The rear measures 1427 px wide, 3.237 px/mm.
      The photographs are low resolution, so the vertical positions are the weaker axis, anchored on the
      cage block: its 25.0 mm height between the first row's top and the second row's bottom agrees with
      the 48Y's 24.4 on the sharper photograph.
  ports:
    confidence: photo-measured
    note: >-
      Front photograph: three blocks. 24 SFP28 in twelve columns on the registry's 14.25 mm pitch from
      x 6.9 to 177.9; then the eight QSFP28 in four columns on the registry's 19.0 pitch in two pairs,
      the first pair starting at 180.5 and the second at 221.6 (a 3.1 mm gutter between the pairs); then
      24 more SFP28 from 262.5 to 433.5. The block starts are fitted to the lamp strip beneath, whose
      48 dark lamps fall on a pitch of 7.12 mm (7.11 over the first block and 7.14 over the last) with
      the first at 10.44 and the right block's first at 266.04, and to the cage openings' edges. The 48Y,
      a different front panel with the same cages, reads its SFP28 pitch to 0.01 mm of the registry's
      on its sharper photograph.
  row-pitch:
    confidence: estimated
    note: >-
      SFP28 rows are 14.0 mm apart, the figure read on the 48Y's sharper photograph; this photograph's
      cage block, 9.3 to 34.3 mm, agrees. The QSFP28 pairs show a mesh divider between their rows (the
      photograph), so they are placed 15.0 mm apart, the registry's belly-to-belly figure, which closes
      the block on the same 34.3 mm bottom edge. The y origin is the top edge of the face at 36 px, good
      to about 0.3 mm.
  stack-orientation:
    confidence: photo-measured
    note: >-
      The light latch tongues sit at the foot of each upper cage and at the top of each lower, so both
      lips face the band between the rows: upper cage upright, lower turned 180, the library's stack convention,
      read off the device. The QSFP28 pairs show the same, with the mesh divider between.
  port-numbering:
    confidence: photo-measured
    note: >-
      Printed on the metal, read off the photograph and matching guide figure 37: the SFP28 ports run
      0 to 23 down each column of the left block (even in the upper cage, odd in the lower), then the
      QSFP28 ports 48 to 55 in the middle block (48 and 49 in the first column, and so on), then the SFP28
      ports 24 to 47 in the right block. All numerals are printed in ONE strip beneath the lower row,
      each with a lamp before it and an up or down arrow naming the cage it belongs to - an up arrow for
      the upper cage, a down arrow for the lower - two entries to a column. Interface names are not printed
      and the guide held does not state them; none is written here.
  port-lamps:
    confidence: photo-measured
    note: >-
      One lamp per port, in that strip, before its arrow (Tables 20 and 21: one lamp for each SFP28 port
      and each QSFP28 port, green steady with a link and blinking with activity, yellow blinking for the
      beacon). The 48Y has two to four per port; the 48YM has one. The entries sit at half the cage pitch
      for SFP28 (7.12 mm), the upper cage's lamp 3.5 mm into the cage's cell and the lower cage's 3.5
      mm into its half; the QSFP28 entries are 8.9 mm apart within a column (the first lamp 5.0 mm into
      the cell) and 10.0 between columns, with the gutter between the pairs. A lamp is followed 2.1 mm
      on by its arrow (1.25 mm wide) and 4.2 mm on by its numeral. Positions are read off the photograph
      at 3.2 px/mm and are estimated to 0.3 mm.
  vents:
    confidence: photo-measured
    note: >-
      A row of round holes along the top edge (2.2 to 5.0 mm down, about 3.2 mm on pitch) and a row cut
      by the bottom edge (40.6 to 43.4 mm). Drawn as two vent strips.
  front-labels:
    confidence: photo-measured
    note: >-
      A yellow rectangular label at the right (407.8 to 430.5 mm, 2.8 to 8.1 mm down) and the laser hazard
      triangle beside it, and a light-blue bar at the right edge (437.0 to 438.8 mm, 12.1 to 34.9 mm down).
      The label's text is not legible at this resolution and is not drawn. The guide's text names none
      of the three; the 48Y front photograph shows none, so they are this panel's.
  rear-layout:
    confidence: photo-measured
    note: >-
      Rear photograph at 3.237 px/mm, checked against guide figure 36 and the callouts of figure 38. A
      63.5 mm panel at the left carries the four chassis lamps, the RJ-45 console jack with the USB port
      beneath it in one shield, the two stacked RJ-45 management jacks, the ESD point, the PPS OUT and
      10M OUT jacks and the reset pinhole; then five fan slots numbered 0 to 4 on a 49.0 mm pitch and
      the two supply slots, as on the 48Y. The orange fan faces measure 41.4 to 41.7 mm wide here against
      40.8 to 41.0 on the 48Y's sharper photograph; the 48Y's are used for both, since the module is one
      part.
  mgmt-labels:
    confidence: photo-measured
    note: >-
      The upper management jack is printed C1 above it and the lower C0 below it on this device, the reverse
      of the 48Y. The guide's callouts name them without saying which is on top.
  timing-jacks:
    confidence: datasheet
    note: >-
      Guide, Connecting 1-PPS and 10-MHz Measurement Devices to the QFX5120 Switch: the 48T and 48YM carry
      one 2x1 DIN 1.0/2.3 connector set with a PPS OUT and a 10M OUT port, TTL (5 V) and a cable up to
      3 m. Two 1.0/2.3 jacks are placed, PPS OUT above 10M OUT. The photograph shows gold connectors with
      a round nut about 7 mm across, which agrees with that jack's nut.
  rear-photo-vs-drawing:
    confidence: photo-measured
    note: >-
      The studio rear photograph is a DC-powered, front-to-back unit (terminal-block supplies, AIR OUT,
      Juniper Gold handles). The default configuration is the AC front-to-back build, whose supply is
      drawn from the guide's figure 71 and 75 because no photograph of an AC 48YM was found: see the supply's
      own contract. The DC supplies are not modelled.
  modules:
    confidence: datasheet
    note: >-
      The 48YM takes 850 W supplies (JPSU-850W-AC-AFO and -AFI for AC), NOT the 650 W supplies of the
      48T and 48Y (guide Table 25 and Table 7). The fan modules (QFX5110-FANAFO and -FANAFI) are the same
      as the 48Y's. All are bays; nothing on the chassis is a built-in unit that is not a bay.
  ears-and-kits:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide lists the rack mount kit JNP-4PST-RMK-1U-E (shipped with the switch; also
      sold as EX-4PST-RMK) and flush, recessed and two-post mounting; the library holds no kit contract
      for it and none is written here, so `chassis.ears` and `chassis.kits` are left out. The modelled
      body is the 440.9 mm chassis, without brackets.
  power:
    confidence: datasheet
    note: >-
      Table 30 (AC supplies, QFX5120-48YM): 280 W typical, 291 W with MACsec, and 446 W maximum, 460 W
      with MACsec; the maximum is measured at 40 C with SR optics and 100 percent IMIX load, the typical
      at 25 C with DACs at 50 percent load, excluding transceivers. Input 100 to 240 VAC at 7.5 A (100
      V) or 3 A (240 V). Table 40 (DC supplies): 333 W typical and 356 W maximum, 16 A, rated -48 to 60
      VDC. The device states the non-MACsec pair of the AC table, the default build's, and keeps the rest
      as text. The two tables carry different figures for one box and neither names its scope beyond the
      note above, so both are kept.
  colour:
    confidence: estimated
    note: >-
      The same face colour as the 48Y, #8b8f96, whose photograph is sharper; this photograph's plate is
      a similar cool grey. The rear panel's #7a7c82 is the 48Y's.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-life announcement for the QFX5120-48YM. No Juniper notice was found and the
      guide states none; the third-party trackers consulted list dates only for the QFX5120-48Y. Estimated,
      because an absence of notices on the pages searched is not the maker's statement.
attrs:
  physical:
    weight-note: 24.8 lb (11.25 kg) with two power supplies and five fan modules installed (Table 9)
    depth-note: 20.48 in (52.02 cm) excluding the fan and power supply handles (Table 9)
  performance: {aggregate-throughput: '4 Tbps, bidirectional (Table 4)', sfp28-speeds: '25, 10 or 1 GbE,
      set a quad at a time; the default is 10 GbE', qsfp28-speeds: '100 or 40 GbE; channelizes to 4 x
      25, 4 x 10 or 2 x 50 GbE'}
  power:
    power-typical-w: 280
    power-max-w: 446
    power-envelope: unstated
    power-macsec-note: 291 W typical and 460 W maximum with MACsec (Table 30)
    power-dc-typical-w: 333
    power-dc-max-w: 356
    power-input-ac: 100 to 240 VAC, 50 to 60 Hz, 7.5 A at 100 VAC or 3 A at 240 VAC
    power-input-dc: rated -48 to -60 VDC, operating range -43.2 to -69 VDC, 16 A
    redundancy-note: two supplies, load-sharing and fully redundant; both should be installed
  thermal:
    fans: >-
      five fan modules, 4+1; the switch runs 30 seconds without thermal shutdown while one is replaced
  environmental: {operating-temp: 0 to 40 C (32 to 104 F) normal operation, storage-temp: -40 to 70 C
      (-40 to 158 F) in the shipping container, humidity: 5 to 90 percent noncondensing, altitude: no
      performance degradation to 1829 m (6000 ft)}
  platform: {cpu: 2.9 GHz quad-core Intel, memory: 16 GB, storage: 100 GB SSD, software: 'Junos OS, first
      release 20.4R1'}
  features:
    macsec: IEEE 802.1AE MACsec AES-256 on all ports
    virtual-chassis: >-
      up to 4 switches (Junos 23.1R1); any non-channelized QSFP28 port (48 to 55) can be a virtual chassis
      port
    timing: PPS OUT and 10M OUT measurement ports (DIN 1.0/2.3, TTL 5 V); PTP supported
    optics-sfp28: 25 GbE, 10 GbE or 1 GbE with MACsec
    optics-qsfp28: >-
      100 GbE or 40 GbE with MACsec; channelizes to 4 x 25 GbE, 4 x 10 GbE or 2 x 50 GbE (guide Table
      5)
  management:
    oob: two RJ-45 management ports (C0 and C1) with link and status lamps
    console: RJ-45 console port (CON)
    usb: one USB port
  lifecycle: {eol: none-announced}
chassis: {width: 440.9, height: 43.7, depth: 520.2, ru: 1, weight-kg: 11.25, color: '#8b8f96', airflow: front-to-back,
  power: ac}
gaps:
- what: module-depths
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The depth of the fan module and of the power supplies. The guide's figures are isometric and carry
    no scale and its tables state weights only.
- what: ac-supply-photograph
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    A photograph of the AC-powered 48YM and its JPSU-850W-AC supply. The studio photograph is of a DC
    unit; the AC supply is drawn from the guide's figures and the 650 W supply's photograph, and its size
    is the bay's.
- what: front-labels
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    What the yellow label, its hazard triangle and the light-blue bar at the right of the port side say.
    The guide's text names none; the label's text does not resolve at 3.2 px/mm.
- what: usb-generation
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The USB revision. The guide names one USB port and gives no generation. The port is drawn with the
    kit's neutral usb2 skin because the tongue colour follows the photograph (qfx5120-48ym-rear-high.jpg),
    which shows a black tongue, not the blue of a USB 3.0 port.
- what: rating-label
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    The vertical rating label at the right edge of the rear (an AC input line, a DC input line and a line
    about each power supply). It is only partly legible in the photograph and is not drawn.
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      Ports 48 to 55 as printed, rel-pos carrying the printed number, since the origin token cannot express
      a block that starts at 48.
  sfp28-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: link, color: '#22c55e'}
    - {name: activity, color: '#22c55e', behavior: blinking}
    - {name: beacon, color: '#f59e0b', behavior: blinking}
    description: One lamp per SFP28 port, in the strip beneath the lower row (guide Table 20).
  qsfp28-leds:
    term: LED
    role: indicator
    index-origin: 0
    states:
    - 'off'
    - {name: link, color: '#22c55e'}
    - {name: activity, color: '#22c55e', behavior: blinking}
    - {name: beacon, color: '#f59e0b', behavior: blinking}
    description: One lamp per QSFP28 port, in the strip beneath the lower row (guide Table 21).
  furniture: {term: Item, role: furniture, index-origin: 0, description: the laser hazard triangle on
      the port side}
  mgmt:
    term: Port
    role: management
    index-origin: 0
    mixed: >-
      the out-of-band cluster at the left of the rear - an RJ-45 console port, two RJ-45 management ports,
      a USB port and the recessed reset button. Four kinds, one purpose: reaching and recovering the switch
      when the data plane cannot.
  timing:
    term: Port
    role: management
    index-origin: 0
    description: >-
      the two measurement outputs, 1-PPS and 10-MHz, on 1.0/2.3 coaxial jacks - a reference for test equipment
  status-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: The four chassis lamps ALM, SYS, MST and ID (guide Table 11).
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: 4+1
      redundancy-note: >-
        QFX5120 hardware guide, Fan Modules for QFX5120 Switches: the 48T, 48Y and 48YM ship with five
        fan modules (4+1 redundancy) in the rear panel, slots 0 to 4 left to right; all five should be
        installed and only one removed at a time
  fan-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: >-
      The round status lamp beside each fan slot - green when the module is engaged and healthy, amber
      blinking on an error (guide Table 24).
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: 1+1
      redundancy-note: two supplies, load-sharing; one may be removed at a time while the switch runs
  esd:
    term: Point
    role: furniture
    index-origin: 0
    description: the wrist-strap ESD point on the rear panel (guide figure 38, callout 4)
