  ac-f2b:
    kind: orderable
    default: true
    description: >-
      QFX5120-48YM-AFO: two 850 W AC supplies (JPSU-850W-AC-AFO) and five front-to-back fan modules (QFX5110-FANAFO).
      All have a Juniper Gold handle and the label AIR OUT (guide Table 7).
    part-numbers:
      QFX5120-48YM-AFO: {}
  ac-b2f:
    kind: orderable
    airflow: back-to-front
    description: >-
      QFX5120-48YM-AFI: two 850 W AC supplies (JPSU-850W-AC-AFI) and five back-to-front fan modules (QFX5110-FANAFI).
      All have a Juniper Azure Blue handle and the label AIR IN (guide Table 7).
    bays: {psu-0: juniper/jpsu-850w-ac-afi@1, psu-1: juniper/jpsu-850w-ac-afi@1, fan-0: juniper/qfx5110-fanafi@1,
      fan-1: juniper/qfx5110-fanafi@1, fan-2: juniper/qfx5110-fanafi@1, fan-3: juniper/qfx5110-fanafi@1,
      fan-4: juniper/qfx5110-fanafi@1}
    part-numbers:
      QFX5120-48YM-AFI: {}
