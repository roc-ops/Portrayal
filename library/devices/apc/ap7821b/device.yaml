  physical:
    weight-kg: 1.74
    construction: metal
  power:
    input-ac: 200/208/230 V, 16 A rated (limit 20 A), 3300 VA, 50/60 Hz
    input-inlet: iec-60320-c20
    input-voltage-v: 230
    input-current-a: 16
    output-voltage: 208 V; 230 V
    frequency: 50/60 Hz
  management:
    metering-scope: input
    outlet-switching: false
    metering: two-digit display on the outlet face
chassis:
  width: 444
  height: 44
  depth: 102
  ru: 1
  color: '#2c2e30'
  airflow: passive
  weight-kg: 1.74
  ears:
    color: '#2c2e30'
    positions:
      - {name: flush, label: 'rack mounting brackets, position not stated (datasheet p.1)', default: true}
gaps:
- what: face-names
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    the datasheet says "Mounting location Front Rear" and names no face as the front. The face with the outlets is
    drawn as `rear` and the plain face as `front`, the usual way a horizontal PDU is racked; no held document says
    so.
  wanted: the installation guide's mounting figure.
- what: face-positions
  scope: [rear]
  reason: needs-drawing
  note: >-
    every position on the outlet face is borrowed from a reading of the AP7921B's photograph and is an estimate good to
    a few millimetres; none is measured on this model.
  wanted: a dimensioned drawing or a straight-on photograph of this model with a scale.
- what: metering-scope
  scope: [display]
  reason: vendor-silent
  note: >-
    the datasheet sells the unit as metered and says nothing of what is metered or where; the display is one window,
    so the input is the scope drawn.
  wanted: the user manual's description of the metering.
- what: lamp-marks
  scope: [lamps]
  reason: needs-photo
  note: >-
    The count and place of the lamps are read off a 369 px photograph and the states come from the guide of an older
    series. The printed legends are named as shown and not drawn. They are the OK, Warning and Overload rings beside
    the round button, the Status check and cross marks, Amps, Reset and the logo. They belong to the later marks part.
  wanted: the guide of the B models (990-5569E) or a straight-on photograph of the display end with a scale.
- what: jack-function
  scope: [jack-1, jack-2]
  reason: vendor-silent
  note: >-
    The datasheet names no port. The older series' guide names the upper jack the 10/100 Base-T connector and the
    lower the RJ-12 serial port, so the match is by position.
  wanted: the guide of the B models (990-5569E).
- what: jack-speed
  scope: [rear]
  reason: vendor-silent
  note: >-
    The older series' guide gives the network jack as 10/100 Base-T. It gives the serial port no speed, and none is
    stated for either jack.
  wanted: the port specification in the guide of the B models.
- what: ears
  scope: [front, rear, left, right]
  reason: needs-drawing
  note: >-
    the datasheet lists rack mounting brackets and a cord retention bracket and gives no figure; no photograph shows
    them.
  wanted: the installation guide's mounting figures.
- what: sides
  scope: [top, bottom, right]
  reason: needs-photo
  note: >-
    no held photograph shows the bottom or the inlet end, and the top is a plain lid in the angled photograph. The
    display end (`left`, seen from behind) draws the marks the angled photograph shows, borrowed from the AP7921B.
  wanted: straight-on photographs of the top, the bottom and the inlet end.
groups:
