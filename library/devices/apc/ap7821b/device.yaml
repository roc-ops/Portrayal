format: 1
kind: device
name: ap7821b
version: 1.0.0
maturity: modelled
manufacturer: APC
model: AP7821B
description: >-
  APC by Schneider Electric NetShelter metered rack PDU, 1U horizontal: a 444 mm black metal box, 102 mm deep.
  It hands a 200 to 230 V feed (a C20 inlet; 16 A rated, 3300 VA) on to eight IEC C13 outlets in one row. It has no
  breaker and no switching. The outlet face has the inlet at the left end. At the right end it has a two-digit
  display, a round button, two jacks, five small lamps and a small Reset hole. The other face is plain, with a logo
  and a ground mark. A cord retention bracket and rack mounting brackets are supplied.
profile: power
provenance:
  method:
    confidence: estimated
    note: >-
      NO DRAWING EXISTS AND THE ONLY PICTURES ARE 369 PX DATASHEET PHOTOGRAPHS, so every position is an estimate. Searched:
      the APC AP7821B datasheet (6 pp), the Schneider Electric release notes for the network card (990-6391K, no figure
      of a PDU) and the intake's coverage report; none dimensions a face, and no installation guide, drawing, stencil or
      CAD file is held. The datasheet's p.5 outlet-face photograph is taken at an angle, so no pitch can be measured on
      it. The datasheet's p.1 photograph of this model's outlet face is near front-on, but it was used only to check
      order and the pitch roughly, not to re-read each position. The positions here are the ones read off the AP7921B's
      near-front-on photograph (see apc/ap7921b), checked against this model's photographs for order: inlet, eight
      outlets, display, button, two jacks, logo. THE POSITIONS ARE BORROWED, NOT MEASURED ON THIS MODEL
      (gaps: face-positions); a re-reading of the right-hand end on the p.1 photograph is still to do.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - AP7821B datasheet: Height 44 mm, Width 444 mm, Depth 102 mm, net weight 1.74 kg (p.1); 1U. Colour
      read off the p.5 photographs at the median of the face, #33323a, estimated as black matte; no document names
      one. The drawn colour, #2c2e30, is the library's black-matte estimate for the sibling AP7921B (whose face reads
      #272d2d in another photograph) and is not taken from this photograph; the lighter reading is lighting.
  ears:
    confidence: estimated
    note: >-
      NOT DRAWN. The datasheet lists rack mounting brackets and a cord retention bracket as supplied (p.1) and states
      "Mounting location Front Rear", "Mounting position Horizontal". No document says where the brackets bolt, so one
      `flush` position is written without a figure and it is a stand-in (gaps: ears).
  front:
    confidence: estimated
    note: >-
      estimated - the plain face, read off the datasheet's p.5 photograph (near front-on, the better of the two views
      of it): a small round hole near the left end with an earth mark under it, the APC logo with its web address at
      the right end and a small label under it reading "Metered Rack PDU" in part, the rest not legible. Positions read
      off the photograph, good to about 3 mm. Which face is the rack front is not stated (gaps: face-names).
  rear:
    confidence: estimated
    note: >-
      estimated - the outlet face, mm from the face's left and top, borrowed from the AP7921B photograph reading (see
      `method`): the inlet's centre at 17, eight outlets from 55 on a 36.1 pitch, numbered 1 to 8 under their mouths as
      printed, the display's window from 333 to 355 across, the round button centred at 376, two jacks centred at 397,
      the logo right of them, five small lamps and a Reset hole (see `lamps`). The inlet is empty in this photograph.
  outlets:
    confidence: datasheet
    note: >-
      datasheet - "Number of power socket outlets 8 IEC 60320 C13" (p.1); each is std/c13-outlet@1. "Protection type
      Without circuit breaker" (p.1). No per-outlet rating and no bank is stated.
  input:
    confidence: datasheet
    note: >-
      datasheet - "Input Connection Type IEC 60320 C20", input 200 V 208 V 230 V, output 208 V 230 V, 50/60 Hz, input
      current limit 20 A, rated current 16 A, max current draw 20 A, load capacity 3300 VA, cable 2.4 m (p.1). The
      datasheet lists no cord among what is provided, so none is drawn and none is stated.
  display:
    confidence: estimated
    note: >-
      estimated - apc/ap78-display@1. The datasheet's text names no display; the photograph shows the window. The
      Metered Rack PDU guide's figure calls it the digital display, item 7 (PDF p.11 and p.15).
  jacks:
    confidence: estimated
    note: >-
      estimated - two jacks shaped like RJ45 jacks at the right end (p.1 photograph). By position they match the
      Metered Rack PDU guide's figure (PDF p.11). The upper is the 10/100 Base-T network connector, item 3. The lower
      is the RJ-12 serial port, item 6 (PDF p.15). That guide is for an older series. Each is std/rj45@2, without a
      role.
  lamps:
    confidence: estimated
    note: >-
      estimated - five lamps and a Reset hole at the display end, read off the 369 px p.1 photograph. The display
      window, 22 mm across, is the scale, about 1.4 mm per pixel. Each lamp is drawn in its off state, and its on
      states carry the colours of the guide and the photograph; the viewer lights it. The Metered Rack PDU guide
      (AP7800 series, 2012) gives the identities and states. Its front panel is PDF p.11 and its items PDF p.15. Its
      Link-RX/TX and Status tables are PDF p.16 and its load indicator table PDF p.17. That guide is for an older
      series and the B models' own guide, 990-5569E, is not held. The count and place of the lamps come from the
      photograph and are estimated. The guide's top single-phase figure shows one load lamp above the display. The
      photograph shows three lit points in one column above the right digit. It cannot tell one lamp with three
      colours from three lamps, so three are placed and each carries one load colour. No B1, B2 or TOTAL lamps are
      shown. Each sample is a count and a mean over the pixels under a colour mask. The mask for green is G of at
      least 90 and at least R and B plus 30. The mask for yellow is R and G of at least 150 and B at most R minus 80.
      The mask for red is R of at least 150, G under 90 and B under R minus 60. Green, count 3, mean #509049, is the
      colour of `lamp-status`, the green load lamp. Yellow, count 2, mean #cad314, is the colour of `lamp-load-warning`. Red, count 2,
      mean #d92244, is the colour of `lamp-load-overload`. The Link-RX/TX and Status windows at the right edge of the
      upper jack are pale and unlit in the photograph. They use the library's green #39b54a and orange #f5a623, as
      nokia/sr-1-ac does. The upper lamp, `lamp-jack-1`, is Link-RX/TX, item 5. The lower, `lamp-jack-2`, is Status, item 4, as in the figure.
      Status states: off, green valid TCP/IP, flashing green not valid, orange hardware failure, flashing orange
      BOOTP, alternating orange and green DHCP. Link-RX/TX states: off, flashing green 10 Mbps, flashing orange 100
      Mbps, and solid green or orange with no traffic. Load states: green normal, yellow near overload, red overload.
      The Reset hole is item 8. It is a dark dot of about 2.5 mm at the lower left of the display, good to about 3 mm.
  dcim:
    confidence: datasheet
    note: >-
      datasheet - the input is a C20 power port (`iec-60320-c20`) and each outlet an `iec-60320-c13` power outlet fed
      by it. The outlets are named as the unit prints them, 1 to 8.
  capability:
    confidence: datasheet
    note: >-
      datasheet - sold as a metered rack PDU (title, p.1). What it meters is not stated; `metering-scope: input` is the
      scope the single display could carry and is a stand-in until a source says (gaps: metering-scope). The unit
      has no switching in any held document: `outlet-switching: false`.
