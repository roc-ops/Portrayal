format: 1
kind: device
name: ap9571a
version: 0.1.0
maturity: modelled
manufacturer: APC
model: AP9571A
description: >-
  APC by Schneider Electric NetShelter basic rack PDU, 1U horizontal: a 445 mm box, 77 mm deep. It hands
  a 200 to 230 V feed on to ten IEC C13 outlets in two banks of five. The feed comes through a fixed 3.65 m cord with
  a NEMA L6-30P plug, 24 A rated, 4992 VA. A rocker circuit breaker stands before each bank in the photograph. It has no display, no
  network port and no switching. The other face is plain, with a logo. Rack mounting brackets are supplied.
profile: power
provenance:
  method:
    confidence: estimated
    note: >-
      NO DRAWING EXISTS AND THE ONLY PICTURES ARE TWO 369 PX PRODUCT PHOTOGRAPHS, so every position on the outlet face
      is an estimate. Searched: the AP9571A data sheet (two copies, 4 pp) and the generic 2006 installation booklet
      for basic rack PDUs. The booklet has 16 pp, no model number and no dimension. No dimensioned drawing, installation guide for this model,
      stencil or CAD file is held. The outlet-face photograph is taken at an angle with strong perspective. An outlet
      reads about 10 px apart at the cord end and about 17 to 19 px apart at the far end. The positions were read by
      fitting one perspective map along the face to the two ends of the face (445 mm) and to those spacings. It puts the
      ten outlets on a 24 mm pitch, a figure no document states. The library's c13 part, turned upright, is 22 mm wide.
      So the outlets fit as the photograph shows them. THE POSITIONS ARE GOOD TO ABOUT 10 MM (gaps: face-positions).
  chassis:
    confidence: datasheet
    note: >-
      datasheet - the 5 Nov copy (sha256 8f932e6e) prints Height 44 mm, Width 445 mm and Depth 77 mm (p.1). It also
      prints Net weight 2.55 kg and Number of rack unit 1U (p.1). The 10 Nov copy (sha256 d8ed048a) adds Height 1.7 in,
      Width 17.5 in and Depth 3.03 in (p.1). It also adds Net weight 5.62 lb(US) (2.55 kg) (p.1). Colour: the plain-face
      photograph is a gradient, about #353535 at its left end and #787878 as the median of the whole face. The outlet-face
      photograph reads #555555 between the banks. Both are lit and lifted, and no document names a colour. The drawn colour,
      #2c2e30, is the library's estimate for the maker's other 1U PDUs. No document names the chassis material either,
      so the description and the attributes name none.
  ears:
    confidence: estimated
    note: >-
      NOT DRAWN. Both data sheet copies list rack mounting brackets as supplied (p.1) and state "Mounting position
      Horizontal". The 5 Nov copy states "Mounting location Front Rear" (p.1). The 2006 booklet draws an L-shaped bracket with no dimension and no position on
      the PDU. One `flush` position is written without a figure and it is a stand-in (gaps: ears).
  front:
    confidence: estimated
    note: >-
      estimated - the plain face, read off the product photograph SPD_MMAE-7UVSK6_B_H (369 px, near front-on). It is a
      plain slab with the red APC logo and a small label under it at the right end. The label text cannot be read. The
      logo and label are named and not drawn. The face spans 15 to 349.8 px for 445 mm, so 0.75 px per mm. The logo spans
      325.3 to 345 px and rows 175.8 to 184.4. The label text spans 328 to 342 px and rows 184.4 to 192. That places the two
      named regions at 412.5 to 439 mm and 416 to 435 mm along the face. Which face is the rack front is not stated (gaps: face-names).
  rear:
    confidence: estimated
    note: >-
      estimated - the outlet face, mm from the face's left and top as the photograph shows it, the cord at the left. The cord
      boot stands at 4 to 23 and 10 mm below the face top. Its two cord lines leave it to the left from its middle and lower part. Two round marks stand at
      46 and two at 87, with a rocker breaker centred at 66.5 between them. A thin light strip stands at 50.5 to 53.5, with a
      short light shelf above it. Five C13 outlets stand on a 24 mm pitch centred at 115, 139, 163, 187 and 211, in a
      recessed panel. Two round marks stand at 242, a rocker breaker centred at 262 and two round marks at 282. A thin dark
      strip stands at 271.5 to 274.5, right of that breaker. Five more outlets stand centred at 312, 336, 360, 384 and 408,
      in a second recessed panel. Two round marks stand at 434. Each
      breaker stands in the upper half of the face, 3.5 and 4.0 mm from its top (gaps: face-positions). The outlets are
      numbered 1 to 10 from the left as seen from the outlet face; no number can be read in the image. Twenty-three small
      notches stand along the lower edge, 19 mm apart. The count is good to 4 (gaps: face-positions).
  outlets:
    confidence: datasheet
    note: >-
      datasheet - both copies print "Number of power socket outlets 10 IEC 60320 C13" (p.1); each is std/c13-outlet@1. The
      image shows two groups of five. No per-outlet rating is stated.
  breakers:
    confidence: estimated
    note: >-
      datasheet - the 5 Nov copy prints "Protection type Circuit breaker" (p.1). The number, rating and the outlets each one
      protects are not stated. The photograph shows one rocker block before each bank of five. So two breakers are drawn,
      apc/pdu-breaker-rocker@1, the first feeding outlets 1 to 5 and the second outlets 6 to 10. That is read from the
      photograph (gaps: breaker-banks). PLACEMENT: each block's top and bottom were read against the face's own top and
      bottom edges, at the block's position. The outlet-face photograph was enlarged 14 to 16 times. The face reads 22 px
      high at the first breaker and 30 px at the second, which gives 0.5 and 0.7 px per mm. The first block spans 3 to
      22 mm from the face top and the second 5 to 23 mm. The outlet row centres about 23 mm down, the breakers 12 to
      13 mm. They are drawn 13 mm wide and 18 mm high at 3.5 and 4.0 mm, good to about 3 mm. The width was read at 7 and 8
      px, 14 and 11 mm. Each block is centred between the round marks either side of it, as the photograph shows them.
  input:
    confidence: datasheet
    note: >-
      datasheet - both copies (sha256 8f932e6e and d8ed048a) print "Input Connection Type NEMA L6-30P" (p.1). Both print
      input 200 V 208 V 230 V, output 208 V and 50/60 Hz (p.1). Both print input current limits 30 A and rated current
      24 A (p.1). Both print max current draw 24 A, max line current 30 A and load capacity 4992 VA (p.1). Both print
      "Number of cables 1" (p.1). The 5 Nov copy prints
      "Cable length 3.65 m" and the 10 Nov copy prints "Cable length 11.98 ft (3.65 m)" (p.1). The cord leaves the left
      end of the outlet face through a squared boot. The boot and the first 4 mm of the cord's two lines are drawn
      (gaps: cord).
  dcim:
    confidence: datasheet
    note: >-
      datasheet - the input is a NEMA L6-30P power port (`nema-l6-30p`) and each outlet an `iec-60320-c13` power outlet fed
      by it. The outlets are named 1 to 10 from the left of the outlet face, as the image shows no number.
  capability:
    confidence: datasheet
    note: >-
      datasheet - sold as a basic PDU (p.1): no metering and no outlet switching in any held document.
