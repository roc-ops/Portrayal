    input-plug: nema-l6-30p
    input-voltage-v: 208
    input-current-a: 24
    output-voltage: 208 V
    frequency: 50/60 Hz
    breakers: circuit breaker, number and rating not stated
  management:
    metering-scope: none
    outlet-switching: false
chassis:
  width: 445
  height: 44
  depth: 77
  ru: 1
  color: '#2c2e30'
  airflow: passive
  weight-kg: 2.55
  ears:
    color: '#2c2e30'
    positions:
      - {name: flush, label: 'rack mounting brackets, position not stated (data sheet p.1)', default: true}
gaps:
- what: face-names
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    the data sheet says "Mounting location Front Rear" and names no face as the front. The face with the outlets is
    drawn as `rear` and the plain face as `front`, the usual way a horizontal PDU is racked. No held document says so.
  wanted: the installation guide's mounting figure.
- what: face-positions
  scope: [rear]
  reason: needs-drawing
  note: >-
    every position on the outlet face is read off a 369 px photograph taken at an angle. It is good to about 10 mm.
    The 24 mm outlet pitch is a result of that reading and no document states it.
  wanted: a dimensioned drawing or a straight-on photograph of the outlet face with a scale.
- what: breaker-banks
  scope: [rear]
  reason: vendor-silent
  note: >-
    the data sheet names a circuit breaker and no count, rating or bank. Two rocker blocks are seen, one before each group
    of five outlets. So two breakers each feed one group. That is a reading of the photograph.
  wanted: the installation or user guide's description of the breakers.
- what: outlet-numbers
  scope: [rear]
  reason: needs-photo
  note: >-
    the outlets are numbered 1 to 10 from the left as seen from the outlet face. No number or label can be read at
    369 px, so none is drawn.
  wanted: a straight-on photograph of the outlet face.
- what: marks
  scope: [front, rear]
  reason: needs-photo
  note: >-
    the APC logo and its label on the plain face, the small mark beside the second breaker and any breaker legend are
    named as shown. They are not drawn. Marks and printed text are left to a later touch.
  wanted: a straight-on photograph of each face.
- what: ears
  scope: [front, rear, left, right]
  reason: needs-drawing
  note: >-
    the data sheet lists rack mounting brackets and no figure. The 2006 booklet draws a bracket with no dimension. It
    does not say where the bracket bolts to this unit.
  wanted: the installation guide's mounting figures.
- what: sides
  scope: [top, bottom, left]
  reason: needs-photo
  note: >-
    no held photograph shows the top straight on, the bottom or the cord end. The cord end is built as the documented
    right end, as no document shows this one.
  wanted: straight-on photographs of the top, the bottom and the cord end.
