gaps:
- what: face-names
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    the data sheet says "Mounting location Front Rear" and names no face as the front. The face with the outlets is
    drawn as `rear` and the plain face as `front`. The 2006 booklet lets a horizontal unit face out either way. No held
    document says which way this one is racked.
  wanted: the installation guide's mounting figure.
- what: face-positions
  scope: [rear]
  reason: needs-drawing
  note: >-
    every position on the outlet face is read off a 369 px photograph taken at an angle. It is good to about 10 mm.
    The 24 mm outlet pitch is a result of that reading and no document states it. The lower edge is a smooth slope in both photographs.
    No notch is resolved, so none is drawn. The method is a 12x crop and a grey-level dump along the edge.
    Its grey dips repeat every 7 pixels, the pixel stair of a slope of 0.14.
  wanted: a dimensioned drawing or a straight-on photograph of the outlet face with a scale.
- what: breaker-banks
  scope: [rear]
  reason: vendor-silent
  note: >-
    the data sheet names a circuit breaker and no count, rating or bank. Two rocker blocks are seen, one before each group
    of five outlets. So two breakers each feed one group. That is a reading of the photograph.
  wanted: the installation or user guide's description of the breakers.
- what: outlet-numbers
  scope: [rear]
  reason: needs-photo
  note: >-
    the outlets are numbered 1 to 10 from the left as seen from the outlet face. No number or label can be read at
    369 px, so none is drawn.
  wanted: a straight-on photograph of the outlet face.
- what: marks
  scope: [front, rear]
  reason: needs-photo
  note: >-
    the APC logo and its label on the plain face, the small mark beside the second breaker and any breaker legend are
    named as shown. They are not drawn. Marks and printed text are left to a later touch.
    The two front regions `logo-zone` and `label-zone` are data only and are not drawn. They are read at 0.75 px per mm along the plain face.
    Every position on the outlet face is an estimate read from the 369 px photograph.
    The cord end is read from the 1500 px photograph.
    It is good to about 3 mm unless a gap says otherwise. Each figure names its own scale.
    A thin dark strip stands right of the second breaker. A light strip with a shelf stands left of the first breaker, and
    a light strip stands left of the second. All three are drawn as thin decor, read from 20 times enlargements of the 369 px
    photograph. The dark strip reads 2 px wide and 14 px high, about 3 by 20 mm. The first light strip reads 1 to 2 px wide
    and 5 px high, about 4 by 8.5 mm, drawn 3 by 10 mm. The second light strip reads 2 px wide and 7 px high, about 3 by 10 mm.
    The strips are read at 0.41 to 0.7 px per mm, so a pixel of a strip is 1.4 to 2.4 mm. Each place is good to about 4 mm.
    The dark strip's width is good to about 2.5 mm: 2 px at 0.62 px per mm along the face is 3.2 mm, and a pixel is 1.6 mm.
    The first light strip's width is good to about 3.7 mm: 1 to 2 px at 0.41 px per mm is 2.4 to 4.9 mm.
    That is half the spread, 1.2 mm, plus a pixel, 2.4 mm. The second light strip's width is good to about 2.5 mm:
    2 px at 0.62 px per mm is 3.2 mm, and a pixel is 1.6 mm.
    The shelf reads 1 px high, directly below the dark top row, and is the least certain. It could not be told from the face's
    top-edge highlight. It is drawn because it reads as a separate light row. Its length was read along row 164 at 0.41 px per mm,
    so a pixel is 2.4 mm. At grey 100, 90 and 80 it spans 6.1, 7.3 and 8.7 px. Grey 90 is halfway between the shelf and the face.
    At grey 90 it runs from column 117.1 to 124.4. The three lengths are 14.9, 17.8 and 21.2 mm, a mean of 18.0 mm.
    The length is good to about 6 mm: half that spread, 3.2 mm, plus a pixel, 2.4 mm. It starts 0.9 px, 2.2 mm,
    left of the light strip's column 118, so it keeps its start at 48 mm. A pixel high is 1.7 mm at 0.59 px per mm, so the 1.5 mm height stays.
    It is drawn 18 mm long and 1.5 mm high, from 48 to 66 mm. Breaker 1 stands at 60 mm and hides the last 6 mm, so 12 mm shows.
    A 0.5 mm sliver of the hidden part shows above the block.
    Their small size is the tolerance, not a reason to leave them out.
  wanted: a straight-on photograph of each face.
- what: cord
  scope: [rear, left]
  reason: needs-photo
  note: >-
    the 1500 px outlet-face photograph from the maker's page shows the cord leaving the face's left end through a round
    boss. The photograph shows a round cable running out of it to the left. The 369 px photograph is its small copy and cannot tell round from
    squared. The photograph is a perspective view from the front left, so the angle the cord shows in it belongs to the
    camera. The base and the cord are taken to stand perpendicular to the face. Straight on, they show as a circle and an
    end-on circle. At the base the face reads 95.3 px for 44 mm, so the scale is 2.17 px per mm across it. The scale is
    1.506 px per mm along the face, which is 0.37 px per mm at 369 px times 4.07. The base's footprint on the face is read
    from the shank's flat top, the shank's straight right side and the boss's lower edge. The round outline was read by
    eye in a crop enlarged 14 times. The flat top is at row 673.5, 9.7 mm below the face top, good to about 1 mm: 2 px.
    The right side is at column 448.5, 33 mm from the face edge, read on rows 695 to 720, good to about 3.5 mm. That is
    2 px, 1.3 mm, plus 2.0 mm for the scale spread. The boss's front face spans rows 673.2 to 744.3, which is 9.5 to 42.5
    mm below the face top. It is 33 mm high, good to about 3 mm: 2 px at each end, 0.9 mm each, plus 1 mm for the dark
    lower arc. The shank's own lower edge is dark on dark below row 729, 35.3 mm below the face top, and is not read. So
    the base is a circle 33 mm across, centred 16.5 mm from the face edge and 26.0 mm below the face top. Each is good to
    about 3.5 mm. The circle reaches the face edge and does not pass it, so it is not cut. A base that stands out of the
    face shows its front face shifted by its depth in an oblique picture. The front face's right extreme reads 19.5 mm and
    the footprint's right side 33 mm, a shift of 13.5 mm. The cord is 22 mm across, good to about 2 mm. Its outer edges
    are the first and last crossing of grey level 200 against the white background. It reads 46.5 px at columns 200 to
    280, which is 21.4 mm, and 49.7 px near the boss, which is 22.9 mm. The drawn diameter is the mean of the two
    readings, rounded. The cord's centre reads 29.5 mm below the face top at the face edge, and the boss's centre reads
    26.0 mm. That is an offset of 3.5 mm, inside the 5 mm that the cord's 2 mm and the boss's 3 mm add up to. The
    picture's angle explains it. The two end-on circles share one centre, so the cord is drawn at 26.0 mm below the face
    top. Along the cord the centre falls to 34.9 mm at column 260. That is read as the cord's bend and is not drawn. The
    photograph shows a straight-sided shank, like a nut. Some features belong only to the oblique view and are not seen
    straight on. The shank's top and side faces and the lit vertical edge are not drawn. The bright arc on the boss's rim,
    the cord's highlight stripes and the nub on the boss are not drawn. The photograph also shows the cord entering a dark
    opening in a lighter ring. Straight on, that is a darker disc in a ring. Its diameter cannot be read from the oblique
    view, so no inner circle is drawn. A round mark stands right of the shank in the photograph. It is left to the marks.
    The base's depth cannot be read. The cord's perpendicular stand is the direction taken, not a reading.
    The plain-face photographs show no cord.
    The kit draws the face view only: the cord's run in the photograph is the camera's angle and is not drawn.
    No held picture shows the left end face, so it has no cord opening and is built as the documented right end.
  wanted: a straight-on photograph of the left end, showing where the cord leaves.
- what: ears
  scope: [front, rear, left, right]
  reason: needs-drawing
  note: >-
    the data sheet lists rack mounting brackets and no figure. The 2006 booklet draws a bracket with no dimension. It
    does not say where the bracket bolts to this unit.
  wanted: the installation guide's mounting figures.
- what: sides
  scope: [top, bottom, left]
  reason: needs-photo
  note: >-
    no held photograph shows the top straight on, the bottom or the cord end. The cord end is built as the documented
    right end, as no document shows this one.
  wanted: straight-on photographs of the top, the bottom and the cord end.
