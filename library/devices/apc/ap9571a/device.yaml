format: 1
kind: device
name: ap9571a
version: 0.1.0
maturity: modelled
manufacturer: APC
model: AP9571A
description: >-
  APC by Schneider Electric NetShelter basic rack PDU, 1U horizontal: a 445 mm black metal box, 77 mm deep. It hands
  a 200 to 230 V feed on to ten IEC C13 outlets in two banks of five. The feed comes through a fixed 3.65 m cord with
  a NEMA L6-30P plug, 24 A rated, 4992 VA. Each bank has a rocker circuit breaker beside it. It has no display, no
  network port and no switching. The other face is plain, with a logo. Rack mounting brackets are supplied.
profile: power
provenance:
  method:
    confidence: estimated
    note: >-
      NO DRAWING EXISTS AND THE ONLY PICTURES ARE TWO 369 PX PRODUCT PHOTOGRAPHS, so every position on the outlet face
      is an estimate. Searched: the AP9571A data sheet (two copies, 4 pp) and the generic 2006 installation booklet
      for basic rack PDUs. The booklet has 16 pp, no model number and no dimension. No dimensioned drawing, installation guide for this model,
      stencil or CAD file is held. The outlet-face photograph is taken at an angle with strong perspective. An outlet
      reads about 10 px apart at the cord end and about 19 px apart at the far end. The positions were read by fitting
      one perspective map along the face to the two ends of the face (445 mm) and to those spacings. It puts the ten
      outlets on a 24 mm pitch, a figure no document states. A C13 outlet turned upright is 22 mm wide, so they fit as
      the photograph shows them. THE POSITIONS ARE GOOD TO ABOUT 10 MM (gaps: face-positions).
  chassis:
    confidence: datasheet
    note: >-
      datasheet - AP9571A data sheet: Height 1.7 in (44 mm), Width 17.5 in (445 mm), Depth 3.03 in (77 mm), net weight
      5.62 lb (2.55 kg), 1U (p.1). Colour: the plain-face photograph reads #4a4a4a at the median of the face. The
      outlet-face photograph reads #5e5e5e between the banks. Both are lit and lifted, and no document names a colour.
      The drawn colour, #2c2e30, is the library's black-matte estimate for the maker's other 1U PDUs.
  ears:
    confidence: estimated
    note: >-
      NOT DRAWN. The data sheet lists rack mounting brackets as supplied (p.1) and states "Mounting location Front Rear",
      "Mounting position Horizontal". The 2006 booklet draws an L-shaped bracket with no dimension and no position on
      the PDU. One `flush` position is written without a figure and it is a stand-in (gaps: ears).
  front:
    confidence: estimated
    note: >-
      estimated - the plain face, read off the product photograph SPD_MMAE-7UVSK6_B_H (369 px, near front-on). It is a
      plain slab with the red APC logo and a small label under it at the right end. The label text cannot be read. The
      logo and label are named and not drawn. Which face is the rack front is not stated (gaps: face-names).
  rear:
    confidence: estimated
    note: >-
      estimated - the outlet face, mm from the face's left and top as the photograph shows it, the cord at the left. The cord
      relief is centred at 12. Two screws stand at 46 and two at 87, with a rocker breaker at 72 between them. Five C13
      outlets stand on a 24 mm pitch centred at 115, 139, 163, 187 and 211, in a recessed panel. Two screws stand at 242,
      a rocker breaker at 269 and two screws at 282. Five more outlets stand centred at 312, 336, 360, 384 and 408, in a
      second recessed panel. Two screws stand at 434. The outlets are numbered 1 to 10 from the left as seen from the
      outlet face; no number can be read in the image. Twenty-three small notches stand along the lower edge, 19 mm
      apart. The count is good to 4 (gaps: face-positions).
  outlets:
    confidence: datasheet
    note: >-
      datasheet - "Number of power socket outlets 10 IEC 60320 C13" (p.1); each is std/c13-outlet@1. The image shows two
      groups of five. No per-outlet rating is stated.
  breakers:
    confidence: estimated
    note: >-
      datasheet - "Protection Type Circuit breaker" (p.1); the number, rating and the outlets each one protects are
      not stated. The photograph shows one rocker block before each bank of five. So two breakers are drawn,
      apc/pdu-breaker-rocker@1, the first feeding outlets 1 to 5 and the second outlets 6 to 10. That is read from the
      photograph (gaps: breaker-banks).
  input:
    confidence: datasheet
    note: >-
      datasheet - "Input Connection Type NEMA L6-30P", input 200 V 208 V 230 V, output 208 V, 50/60 Hz (p.1). Input current
      limit 30 A, rated current 24 A, max current draw 24 A, max line current 30 A, load capacity 4992 VA (p.1). One
      cable of 11.98 ft (3.65 m) (p.1). The cord leaves the left end of the outlet face. Only its strain relief is drawn.
  dcim:
    confidence: datasheet
    note: >-
      datasheet - the input is a NEMA L6-30P power port (`nema-l6-30p`) and each outlet an `iec-60320-c13` power outlet fed
      by it. The outlets are named 1 to 10 from the left of the outlet face, as the image shows no number.
  capability:
    confidence: datasheet
    note: >-
      datasheet - sold as a basic PDU (p.1): no metering and no outlet switching in any held document.
