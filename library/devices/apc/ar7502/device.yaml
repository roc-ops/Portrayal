  reason: needs-drawing
  note: The figure shows each opening without a dimension. Sizes and places are read off the pages rendered at 600 dpi and
    estimated to within about 2 mm.
  wanted: a dimensioned drawing of the channel
- what: rear-hooks
  scope:
  - rear
  reason: vendor-silent
  note: The installation sheet says three hooks stand on the back. No held picture shows the back, so their size and places
    are not drawn.
  wanted: a picture of the back of the channel
- what: set-or-single
  scope:
  - front
  reason: vendor-silent
  note: The data sheet's title says set of 2, but its figures describe one channel. The weight may be one channel or both.
  wanted: the maker's statement of what a pack holds
- what: cable-capacity
  scope:
  - front
  reason: vendor-silent
  note: The data sheet states no cable capacity, so none is recorded and none is estimated.
  wanted: a capacity figure and the cable it is stated for
- what: cabinet-fit
  scope:
  - rear
  reason: vendor-silent
  note: The data sheet is titled for the NetShelter SX 42U cabinet and lists no model number. The installation sheet is
    shared with three other part numbers.
  wanted: the maker's compatibility list
