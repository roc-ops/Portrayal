format: 1
kind: device
name: ar7502
version: 1.0.0
maturity: modelled
manufacturer: APC
model: AR7502
description: Rear cable channel for a 42U NetShelter SX cabinet, APC AR7502. It is a perforated black plate, 117 mm wide
  and 1930 mm tall. It has large mesh windows, hanger marks and a column of rack-unit slots down each edge. It hangs on
  the cabinet's rear side braces and takes no rack unit.
profile: passive
provenance:
  mount:
    confidence: datasheet
    note: 'datasheet - `rack-side`: "Number of rack unit 0U" and "Mounting Location Rear". The installation sheet 990-2243C
      says three hooks on its back hook onto the cabinet''s side braces.'
  method:
    confidence: datasheet
    note: FIGURES FROM THE MAKER'S OWN DOCUMENTS, read as data. They are the AR7502 data sheet and the installation sheet
      990-2243C. That sheet also names the AR7511, AR7552 and AR7572. Width, height, depth and weight are `datasheet`. The
      perforations are read off the sheet's figure and estimated. No drawing or photograph is copied.
  chassis:
    confidence: datasheet
    note: 'datasheet - 117 x 1930 x 13: "Width 4.6 in (117 mm)", "Height 76.0 in (1930 mm)", "Depth 0.5 in (13 mm)". The
      data sheet''s title prints 130 mm, which 0.5 in does not support; 13 mm is drawn.'
  depth:
    confidence: datasheet
    note: datasheet - "Depth 0.5 in (13 mm)"; the title says 130.
  shell:
    confidence: estimated
    note: estimated - a flat plate; no view sections the channel.
  thickness:
    confidence: estimated
    note: estimated - no document states a gauge.
  weight:
    confidence: datasheet
    note: datasheet - "Net Weight 5.004 lb(US) (2.27 kg)". The title says set of 2; the sheet does not say if the weight
      is one channel or the set. Packed 7.57 kg.
  front:
    confidence: estimated
    note: estimated - the face the installation sheet draws. It has 4 mesh windows, 3 hanger marks and 8 rectangular slots.
      It has 6 pairs of keyholes with 3 hook slots under each, and a slot column down each edge. Positions are scaled off
      the figure.
  rear:
    confidence: estimated
    note: 'estimated - the back of the plate, plain: no held picture shows it or its three hooks.'
  top:
    confidence: estimated
    note: estimated - the plate's edge.
  bottom:
    confidence: estimated
    note: estimated - the plate's edge.
  left:
    confidence: estimated
    note: estimated - the plate's edge down the part.
  right:
    confidence: estimated
    note: estimated - the plate's edge down the part.
  capacity:
    confidence: datasheet
    note: datasheet - no cable capacity is stated (see `gaps`).
  attrs:
    confidence: datasheet
    note: 'datasheet - "Color: Black" and the provided equipment (installation guide, mounting hardware).'
  color:
    confidence: estimated
    note: 'estimated - "Color: Black". The shade is the library''s render of black steel.'
