format: 1
kind: device
name: ap7900b
version: 0.1.0
maturity: modelled
manufacturer: APC
model: AP7900B
description: >-
  APC by Schneider Electric NetShelter switched rack PDU, 1U horizontal: a 445 mm black metal box, 108 mm deep. A fixed
  3.65 m cord with a NEMA 5-15P plug takes in 100 to 120 V at 15 A. Eight NEMA 5-15R outlets stand in one row. The
  outlet face has the cord at the left end. At the right end it has a two-digit current display, a round button, two jacks and small
  lamps. The other face is plain. Rack mounting brackets are supplied.
profile: power
provenance:
  method:
    confidence: estimated
    note: >-
      NO DRAWING EXISTS AND THE ONLY PICTURES ARE 369 PX DATASHEET PHOTOGRAPHS, so every position is an estimate read off a
      photograph. Searched: the APC AP7900B data sheet (4 pp, all pages looked at); no installation guide, drawing, stencil
      or CAD file is held. The outlet face is the data sheet's p.1 photograph, near front-on: the face spans about 293 of
      its 369 px for 445 mm (1.52 mm per pixel across) and about 29 px for 44 mm (1.53 down), the two agreeing to under one
      percent, so a position is good to about 3 mm. The eight outlets repeat at about 36.2 mm; that pitch is measured on
      this face only. The p.4 photograph of the same face at an angle agrees with the order, count and kind of the parts.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - AP7900B data sheet: Height 1.7 in (44 mm), Width 17.5 in (445 mm), Depth 4.3 in (108 mm), net weight 5.004
      lb (2.27 kg), 1U (p.1 and p.2). Colour estimated: the photograph reads about #3a3a3a on the outlet face and #494949
      on the plain face, lit and lifted, and #2c2e30 is drawn as for the maker's other 1U PDUs; no document names a colour.
  ears:
    confidence: estimated
    note: >-
      NOT DRAWN. The data sheet lists "Horizontal mounting brackets" and "Cord retention bracket(s)" as supplied and states
      "Mounting Location Front Rear", "Mounting position Horizontal" (p.1). No document says where on the body the brackets
      bolt, how they are shaped or how many positions there are, so one `flush` position is written without a figure, as
      the generic ear is drawn, and it is a stand-in (gaps: ears).
  front:
    confidence: estimated
    note: >-
      estimated - the plain face, the data sheet's p.4 photograph at the foot of the page, front-on: the slab spans about 333
      by 33 px, an aspect of 10.1 against 10.11 for 445 by 44, and shows an unmarked dark face with nothing on it. The
      photograph has no feature of known printing to test that against, so what it cannot resolve (a mark, a label, a logo) is
      not read as absent (gaps: plain-face-marks). Nothing is drawn on it.
  rear:
    confidence: estimated
    note: >-
      estimated - the outlet face, read off the data sheet's p.1 photograph, mm from the face's left and top: the cord's
      strain relief centred at 22.8 across and 19.1 down, eight outlets with their left edges from 39.2 on a 36.2 pitch and
      their tops at 5.5, numbered 1 to 8 under their mouths as printed, the display's window from 343.8 to 365.1 across and
      10.2 to 28.0 down, the round button centred at 375.5 across, two jacks at 387.6 across, the logo right of them, and
      small lamps. Every figure is an estimate.
  outlets:
    confidence: datasheet
    note: >-
      datasheet - "Number of power socket outlets 8 NEMA 5-15R" (p.1); each is std/nema-5-15r@1, drawn with the earth hole to
      the right and two slots to its left as the photograph shows them. The data sheet gives no per-outlet rating, no bank
      and no breaker ("Protection type" is not listed for this model).
  input:
    confidence: datasheet
    note: >-
      datasheet - "Input Connection Type NEMA 5-15P", input 100 V 120 V, 50/60 Hz, input current limit 15 A, rated current
      12 A, max current draw 15 A, load capacity 1440 VA, one cable of 3.65 m (p.1). The photograph shows the cord leaving
      the left end of the outlet face; only the strain relief is drawn.
  display:
    confidence: estimated
    note: >-
      estimated - apc/ap78-display@1; the data sheet's prose names "a local current monitoring display" (p.1). The p.1
      photograph shows a pale two-digit window with the legend "Amps" under it.
  buttons:
    confidence: estimated
    note: >-
      estimated - apc/ap78-button@1, placed on the centre of the round grey disc beside the display. The disc reads about
      12 mm across in the p.1 photograph and the part is 7 mm, a difference of two estimates (gaps: button-size).
  jacks:
    confidence: estimated
    note: >-
      estimated - two jacks shaped like RJ45 jacks at the right end (p.1 photograph); their labels are not legible and the
      data sheet says only "Network management capabilities" (p.1), so what each is for is not stated. Each is std/rj45@2,
      without a role.
  dcim:
    confidence: datasheet
    note: >-
      datasheet - the input is a NEMA 5-15P power port and each outlet a `nema-5-15r` power outlet fed by it. The outlets are
      named as the unit prints them, 1 to 8.
  capability:
    confidence: datasheet
    note: >-
      datasheet - sold as a switched rack PDU with "remote individual outlet control" and a local current monitoring
      display (p.1): `outlet-switching: true`. Nothing says outlets or banks are metered, so `metering-scope: input` is the
      finest level the display could carry; a source naming per-outlet metering would change it.
attrs:
  physical:
    weight-kg: 2.27
    construction: metal
  power:
    input-ac: 100/120 V, 12 A rated (limit 15 A), 1440 VA, 50/60 Hz
    input-plug: nema-5-15p
    input-cord: fixed
    input-voltage-v: 120
    input-current-a: 12
    output-voltage: 120 V
    frequency: 50/60 Hz
  environmental:
    operating-temp: 0 to 45 C (32 to 113 F)
    storage-temp: -25 to 65 C (-13 to 149 F)
    humidity: 0 to 95 %
  management:
    metering-scope: input
    outlet-switching: true
    metering: local current monitoring display
    network-interface: network management capabilities (datasheet p.1)
  compliance:
    certifications: cUL Listed, UL Listed, FCC Part 15 class A, ICES-003
chassis:
  width: 445
  height: 44
  depth: 108
  ru: 1
  color: '#2c2e30'
  airflow: passive
  weight-kg: 2.27
  ears:
    color: '#2c2e30'
    positions:
      - {name: flush, label: 'rack mounting brackets, position not stated (datasheet p.1)', default: true}
gaps:
- what: face-names
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    the data sheet says "Mounting Location Front Rear" and names no face as the front. The face with the outlets is drawn as
    `rear` and the plain face as `front`, the usual way a horizontal PDU is racked; no held document says so.
  wanted: the installation guide's mounting figure.
- what: face-positions
  scope: [rear]
  reason: needs-drawing
  note: >-
    every position on the outlet face is read off a 369 px photograph and is an estimate good to about 3 mm.
  wanted: a dimensioned drawing or a straight-on photograph with a scale.
- what: plain-face-marks
  scope: [front]
  reason: needs-photo
  note: >-
    the plain face is a front-on photograph of an unmarked dark slab with nothing of known printing in it to test against, so
    a hole, a mark or a label too small for 369 px would not show. Nothing is drawn.
  wanted: a close photograph of the plain face.
- what: lamp-colours
  scope: [lamps]
  reason: needs-photo
  note: >-
    small lamps stand over the display and beside the upper jack, some lit in the photograph; their count, colours and
    meanings were not read off the pixels and no document names them, so three are drawn unlit and uncoloured.
  wanted: the user manual's description of the status lamps.
- what: button-size
  scope: [button]
  reason: needs-photo
  note: >-
    the round disc beside the display reads about 12 mm across in this photograph; apc/ap78-button@1 is 7 mm, an estimate
    made for the AP7821B and AP7921B, and is not changed here.
  wanted: a close photograph of the button or the user manual.
- what: jack-function
  scope: [jack-1, jack-2]
  reason: vendor-silent
  note: >-
    the labels under the two jacks are not legible and the data sheet names no port; neither is stated as an Ethernet,
    console or sensor port.
  wanted: the user manual, or a close photograph of the jacks.
- what: jack-speed
  scope: [rear]
  reason: vendor-silent
  note: >-
    no document held names the two rear jacks or prints a speed for them, so none is stated.
  wanted: the user manual's port specification.
- what: end-screws
  scope: [rear]
  reason: needs-photo
  note: >-
    a small ring stands near each end of the outlet face, two at each end, 2 to 3 mm across. They are drawn as unidentified
    marks; nothing says whether they are fixings of the brackets.
  wanted: the installation guide.
- what: ears
  scope: [front, rear, left, right]
  reason: needs-drawing
  note: >-
    the data sheet lists horizontal mounting brackets and a cord retention bracket and gives no figure; no photograph shows
    them.
  wanted: the installation guide's mounting figures.
- what: sides
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: >-
    no held document shows the top, the bottom or an end.
  wanted: straight-on photographs of the top, the bottom and an end.
