format: 1
kind: device
name: ap7921b
version: 1.0.0
maturity: modelled
manufacturer: APC
model: AP7921B
description: >-
  APC by Schneider Electric NetShelter switched rack PDU, 1U horizontal: a 445 mm black metal box, 108 mm deep.
  It hands a 200 to 230 V feed (a C20 inlet; 16 A rated, 3680 VA) on to eight IEC C13 outlets in one row. The outlet
  face has the inlet at the left end. At the right end it has a two-digit current display, a round button, two
  jacks, five small lamps and a small Reset hole. The other face is plain, with a logo and a ground mark. Rack
  mounting brackets are supplied.
profile: power
provenance:
  method:
    confidence: estimated
    note: >-
      NO DRAWING EXISTS AND THE ONLY PICTURES ARE 369 PX DATASHEET PHOTOGRAPHS, so every position is an estimate read
      off a photograph. Searched: the APC AP7921B datasheet (6 pp), the Schneider Electric release notes for the
      network card (990-6391K, four pages, no figure of a PDU) and the intake's coverage report; none dimensions a
      face, and no installation guide, drawing, stencil or CAD file is held. The outlet face is the datasheet's p.6
      photograph, near front-on: the face spans about 280 of its 369 px for 445 mm, so about 1.6 mm per pixel and
      a position is good to about 2 mm along the face and about 3 mm down it. The eight outlet mouths repeat at about
      36 mm; that pitch is measured on this face only, and the plain face has nothing to measure it against.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - AP7921B datasheet: Height 44 mm (p.1), Width 445 mm and Depth 108 mm (p.2), net weight 2.27 kg
      (p.2); 1U. Colour read off the photographs at the median of the face, #272d2d, estimated as the black matte the
      datasheet photographs show; no document names a colour.
  ears:
    confidence: estimated
    note: >-
      NOT DRAWN. The datasheet lists rack mounting brackets as supplied (p.1) and states "Mounting location Front
      Rear", "Mounting position Horizontal" (p.1). No document says where on the body the brackets bolt, how they are
      shaped or how many positions there are, so one `flush` position is written without a figure, as the generic ear
      is drawn, and it is a stand-in (gaps: ears).
  front:
    confidence: estimated
    note: >-
      estimated - the plain face, read off the datasheet's p.5 photographs (two angled views; the AP7821B's p.5
      photograph is the same face front-on and is the better of them). A small round hole near the left end with an
      earth mark under it, the APC logo with its web address at the right end, and a small label under the logo whose
      text is not legible. Positions read off the photographs, good to about 3 mm. Which face is the rack front is not
      stated (gaps: face-names).
  rear:
    confidence: estimated
    note: >-
      estimated - the outlet face, read off the datasheet's p.6 photograph, mm from the face's left and top.
      The inlet's centre is at 17. Eight outlets are centred from 55 on a 36.1 pitch, numbered 1 to 8 under their
      mouths as printed. The display's window runs from 333 to 355 across and 10 to 27 down. The round button is
      centred at 376 and the two jacks at 397, with the logo right of them. It also has five small lamps and a Reset
      hole (see `lamps`). Every figure is an estimate.
  outlets:
    confidence: datasheet
    note: >-
      datasheet - "Number of power socket outlets 8 IEC 60320 C13" (p.1); each is std/c13-outlet@1. The datasheet gives
      no per-outlet rating, no bank and no breaker ("Protection type" is not listed for this model).
  input:
    confidence: datasheet
    note: >-
      datasheet - "Input Connection Type IEC 60320 C20", input 200 V 208 V 230 V, 50/60 Hz, input current limit 20 A,
      rated current 16 A, max current draw 16 A, load capacity 3680 VA, one cable of 2.49 m (p.1). The overview prose
      on the same page says "The output and input connections are (8)C13", which disagrees with the specification
      row; the specification is followed and the disagreement is recorded (gaps: inlet-statement). The p.6 photograph
      shows a cord plug seated in the inlet; the cord is not drawn.
  display:
    confidence: estimated
    note: >-
      estimated - apc/ap78-display@1; the datasheet's prose names "local current monitoring display" (p.1). The
      Switched Rack PDU guide's figure calls it the digital display, item 7 (PDF p.11 and p.13).
  jacks:
    confidence: estimated
    note: >-
      estimated - two jacks shaped like RJ45 jacks at the right end (p.6 photograph). By position they match the
      Switched Rack PDU guide's figure (PDF p.11). The upper is the 10/100 Base-T network connector, item 3. The
      lower is the RJ-12 serial port, item 6 (PDF p.13). That guide is for an older series. Each is std/rj45@2, without a
      role.
  lamps:
    confidence: estimated
    note: >-
      estimated - five lamps and a Reset hole at the display end, read off the 369 px p.6 photograph. The display
      window, 22 mm across, is the scale, about 1.65 mm per pixel. Each lamp is drawn in its off state, and its on
      states carry the colours of the guide and the photograph; the viewer lights it. The Switched Rack PDU guide
      (AP7900 series, 2008) gives the identities and states. Its front panel is PDF p.11 and its items PDF p.13. Its
      Link-RX/TX and Status tables are PDF p.14 and its load indicator table PDF p.15. That guide is for an older series and the B models' own
      guide, 990-5569E, is not held. The count and place of the lamps come from the photograph and are estimated.
      The panel matches the guide's upper single-phase figure: one group of load lamps above the display, and no B1,
      B2 or TOTAL lamps. The photograph shows three lit points in one column above the right digit. The third is one
      pixel. Each sample is a count and a mean over the pixels under a colour mask. The mask for green is G of at
      least 90 and at least R and B plus 30. The mask for yellow is R and G of at least 150 and B at most R minus 80.
      The mask for orange is R of at least 150, G from 90 to 149 and B at most 100. Green, count 3, mean #507a3d, is
      the colour of `lamp-load-ok`, the green load lamp. Yellow, count 1, mean #a7b047, is one pixel. The orange third, count 1, mean
      #ac8e20, is one pixel. So `lamp-load-warning` and `lamp-load-overload` use the library's yellow #e5d800 and red
      #e02020. The Link-RX/TX and Status windows at the right edge of the upper jack are pale and unlit in the
      photograph. They use the library's green #39b54a and orange #f5a623, as nokia/sr-1-ac does. The guide draws both
      windows as small upright rectangles, so they use the rectangular part common/led-rect-sm@2, turned a quarter.
      The rectangles measure about 1.8 x 3.2 mm in the guide's figure at 600 dpi, scaled from the jack frame's 15.8
      mm. The part is 2.8 x 1.6 mm, within 13 percent of that, and the larger common/led-rect is 44 percent off. The
      window heights follow the figure. The guide's place falls inside the library's wider jack, and the overlap
      check refuses it. So each lamp stands just outside the jack's right edge, as the photograph shows. The upper
      lamp, `lamp-jack-1`, is Link-RX/TX, item 5. The lower, `lamp-jack-2`, is Status, item 4, as in the figure.
      Status states: off, green valid TCP/IP,
      flashing green not valid, orange hardware failure, flashing orange BOOTP, alternating orange and green DHCP.
      Link-RX/TX states: off, flashing green 10 Mbps, flashing orange 100 Mbps, and solid green or orange with no
      traffic. Load states: green normal, yellow near overload, red overload. The Reset hole is item 8. It is a dark
      dot of about 2.5 mm at the lower left of the display, good to about 3 mm.
  dcim:
    confidence: datasheet
    note: >-
      datasheet - the input is a C20 power port (`iec-60320-c20`) and each outlet an `iec-60320-c13` power outlet fed
      by it. The outlets are named as the unit prints them, 1 to 8.
  capability:
    confidence: datasheet
    note: >-
      datasheet - sold as a switched rack PDU with a local current monitoring display (p.1): `outlet-switching: true`.
      Nothing says outlets or banks are metered, so `metering-scope: input` is the finest level the display could
      carry and is the class the device library calls switched-metered-input; a source naming per-outlet metering
      would change it.
attrs:
  physical:
    weight-kg: 2.27
    construction: metal
  power:
    input-ac: 200/208/230 V, 16 A rated (limit 20 A), 3680 VA, 50/60 Hz
    input-inlet: iec-60320-c20
    input-voltage-v: 230
    input-current-a: 16
    output-voltage: 208 V; 230 V
    frequency: 50/60 Hz
  management:
    metering-scope: input
    outlet-switching: true
    metering: local current monitoring display
    network-interface: network management capabilities (datasheet p.1)
chassis:
  width: 445
  height: 44
  depth: 108
  ru: 1
  color: '#272d2d'
  airflow: passive
  weight-kg: 2.27
  ears:
    color: '#272d2d'
    positions:
      - {name: flush, label: 'rack mounting brackets, position not stated (datasheet p.1)', default: true}
gaps:
- what: face-names
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    the datasheet says "Mounting location Front Rear" and names no face as the front. The face with the outlets is
    drawn as `rear` and the plain face as `front`, the usual way a horizontal PDU is racked; no held document says
    so.
  wanted: the installation guide's mounting figure.
- what: face-positions
  scope: [rear]
  reason: needs-drawing
  note: >-
    every position on the outlet face is read off a 369 px photograph and is an estimate good to a few millimetres.
  wanted: a dimensioned drawing or a straight-on photograph with a scale.
- what: inlet-statement
  scope: [input]
  reason: vendor-silent
  note: >-
    the datasheet's overview says "The output and input connections are (8)C13" and its specification says "Input
    Connection Type IEC 60320 C20"; the p.6 photograph shows a plug seated at the left end. The specification is
    followed and the inlet is drawn as a C20.
  wanted: the installation guide or the maker's product page, to say which statement is right.
- what: lamp-marks
  scope: [lamps]
  reason: needs-photo
  note: >-
    The count and place of the lamps are read off a 369 px photograph and the states come from the guide of an older
    series. The printed legends are named as shown and not drawn. They are the OK, Warning and Overload rings above
    the display, Amps, Reset and the logo. The photograph shows a green and an orange dot beside the Status label. It
    shows a fainter green and orange pair near the Link label, read as a colour key. The guide draws a check and a
    cross icon beside Status. The dots are read as printed icons, not lamps, and that reading is an estimate. No lamp
    moved for them. They are not drawn, because the maintainer has left marks to a later touch.
  wanted: the guide of the B models (990-5569E) or a straight-on photograph of the display end with a scale.
- what: jack-function
  scope: [jack-1, jack-2]
  reason: vendor-silent
  note: >-
    The datasheet names no port. The older series' guide names the upper jack the 10/100 Base-T connector and the
    lower the RJ-12 serial port, so the match is by position.
  wanted: the guide of the B models (990-5569E).
- what: jack-speed
  scope: [rear]
  reason: vendor-silent
  note: >-
    The older series' guide gives the network jack as 10/100 Base-T. It gives the serial port no speed, and none is
    stated for either jack.
  wanted: the port specification in the guide of the B models.
- what: ears
  scope: [front, rear, left, right]
  reason: needs-drawing
  note: >-
    the datasheet lists rack mounting brackets and gives no figure; no photograph shows them.
  wanted: the installation guide's mounting figures.
- what: sides
  scope: [top, bottom, right]
  reason: needs-photo
  note: >-
    no held photograph shows the bottom or the inlet end (the cord plug covers it). The top is a plain lid in the
    angled photograph. The display end (`left`, seen from behind) draws the six marks the angled photograph shows.
  wanted: straight-on photographs of the top, the bottom and the inlet end.
groups:
  outlets: {term: Outlet, role: traffic, index-origin: 1, attrs: {outlet: iec-60320-c13}, description: 'the eight C13 outlets, numbered 1 to 8 from the left as seen from the outlet face, as printed; each switchable'}
  display: {term: Display, role: indicator, index-origin: 1}
  buttons: {term: Button, role: service, index-origin: 1}
  jacks: {term: Port, role: management, index-origin: 1, description: 'the two jacks at the right end of the outlet face: the upper the 10/100 Base-T network port, the lower the RJ-12 serial port'}
  lamps: {term: LED, role: indicator, index-origin: 1}
  power-input: {term: Input, role: service, index-origin: 1}
