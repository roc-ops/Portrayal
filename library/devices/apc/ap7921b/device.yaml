format: 1
kind: device
name: ap7921b
version: 0.1.0
maturity: modelled
manufacturer: APC
model: AP7921B
description: >-
  APC by Schneider Electric NetShelter switched rack PDU, 1U horizontal: a 445 mm black metal box, 108 mm deep.
  It hands a 200 to 230 V feed (a C20 inlet; 16 A rated, 3680 VA) on to eight IEC C13 outlets in one row. The outlet
  face has the inlet at the left end. At the right end it has a two-digit current display, a round button, two
  jacks and three small lamps. The other face is plain, with a logo and a ground mark. Rack mounting brackets are
  supplied.
profile: power
provenance:
  method:
    confidence: estimated
    note: >-
      NO DRAWING EXISTS AND THE ONLY PICTURES ARE 369 PX DATASHEET PHOTOGRAPHS, so every position is an estimate read
      off a photograph. Searched: the APC AP7921B datasheet (6 pp), the Schneider Electric release notes for the
      network card (990-6391K, four pages, no figure of a PDU) and the intake's coverage report; none dimensions a
      face, and no installation guide, drawing, stencil or CAD file is held. The outlet face is the datasheet's p.6
      photograph, near front-on: the face spans about 280 of its 369 px for 445 mm, so about 1.6 mm per pixel and
      a position is good to about 2 mm along the face and about 3 mm down it. The eight outlet mouths repeat at about
      36 mm; that pitch is measured on this face only, and the plain face has nothing to measure it against.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - AP7921B datasheet: Height 44 mm (p.1), Width 445 mm and Depth 108 mm (p.2), net weight 2.27 kg
      (p.2); 1U. Colour read off the photographs at the median of the face, #272d2d, estimated as the black matte the
      datasheet photographs show; no document names a colour.
  ears:
    confidence: estimated
    note: >-
      NOT DRAWN. The datasheet lists rack mounting brackets as supplied (p.1) and states "Mounting location Front
      Rear", "Mounting position Horizontal" (p.1). No document says where on the body the brackets bolt, how they are
      shaped or how many positions there are, so one `flush` position is written without a figure, as the generic ear
      is drawn, and it is a stand-in (gaps: ears).
  front:
    confidence: estimated
    note: >-
      estimated - the plain face, read off the datasheet's p.5 photographs (two angled views; the AP7821B's p.5
      photograph is the same face front-on and is the better of them). A small round hole near the left end with an
      earth mark under it, the APC logo with its web address at the right end, and a small label under the logo whose
      text is not legible. Positions read off the photographs, good to about 3 mm. Which face is the rack front is not
      stated (gaps: face-names).
  rear:
    confidence: estimated
    note: >-
      estimated - the outlet face, read off the datasheet's p.6 photograph, mm from the face's left and top:
      the inlet's centre at 17, eight outlets centred from 55 on a 36.1 pitch, numbered 1 to 8 under their mouths as
      printed, the display's window from 333 to 355 across and 10 to 27 down, the round button centred at 376, two
      jacks centred at 397 with the logo right of them, and three small lamps. Every figure is an estimate.
  outlets:
    confidence: datasheet
    note: >-
      datasheet - "Number of power socket outlets 8 IEC 60320 C13" (p.1); each is std/c13-outlet@1. The datasheet gives
      no per-outlet rating, no bank and no breaker ("Protection type" is not listed for this model).
  input:
    confidence: datasheet
    note: >-
      datasheet - "Input Connection Type IEC 60320 C20", input 200 V 208 V 230 V, 50/60 Hz, input current limit 20 A,
      rated current 16 A, max current draw 16 A, load capacity 3680 VA, one cable of 2.49 m (p.1). The overview prose
      on the same page says "The output and input connections are (8)C13", which disagrees with the specification
      row; the specification is followed and the disagreement is recorded (gaps: inlet-statement). The p.6 photograph
      shows a cord plug seated in the inlet; the cord is not drawn.
  display:
    confidence: estimated
    note: >-
      estimated - apc/ap78-display@1; the datasheet's prose names "local current monitoring display" (p.1).
  jacks:
    confidence: estimated
    note: >-
      estimated - two jacks shaped like RJ45 jacks at the right end (p.6 photograph); their labels are not legible and
      the datasheet says only "Network management capabilities" (p.1), so what each is for is not stated. Each is
      std/rj45@2, without a role.
  dcim:
    confidence: datasheet
    note: >-
      datasheet - the input is a C20 power port (`iec-60320-c20`) and each outlet an `iec-60320-c13` power outlet fed
      by it. The outlets are named as the unit prints them, 1 to 8.
  capability:
    confidence: datasheet
    note: >-
      datasheet - sold as a switched rack PDU with a local current monitoring display (p.1): `outlet-switching: true`.
      Nothing says outlets or banks are metered, so `metering-scope: input` is the finest level the display could
      carry and is the class the device library calls switched-metered-input; a source naming per-outlet metering
      would change it.
attrs:
  physical:
    weight-kg: 2.27
    construction: metal
  power:
    input-ac: 200/208/230 V, 16 A rated (limit 20 A), 3680 VA, 50/60 Hz
    input-inlet: iec-60320-c20
    input-voltage-v: 230
    input-current-a: 16
    output-voltage: 208 V; 230 V
    frequency: 50/60 Hz
  management:
    metering-scope: input
    outlet-switching: true
    metering: local current monitoring display
    network-interface: network management capabilities (datasheet p.1)
chassis:
  width: 445
  height: 44
  depth: 108
  ru: 1
  color: '#272d2d'
  airflow: passive
  weight-kg: 2.27
  ears:
    color: '#272d2d'
    positions:
      - {name: flush, label: 'rack mounting brackets, position not stated (datasheet p.1)', default: true}
gaps:
- what: face-names
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    the datasheet says "Mounting location Front Rear" and names no face as the front. The face with the outlets is
    drawn as `rear` and the plain face as `front`, the usual way a horizontal PDU is racked; no held document says
    so.
  wanted: the installation guide's mounting figure.
- what: face-positions
  scope: [rear]
  reason: needs-drawing
  note: >-
    every position on the outlet face is read off a 369 px photograph and is an estimate good to a few millimetres.
  wanted: a dimensioned drawing or a straight-on photograph with a scale.
- what: inlet-statement
  scope: [input]
  reason: vendor-silent
  note: >-
    the datasheet's overview says "The output and input connections are (8)C13" and its specification says "Input
    Connection Type IEC 60320 C20"; the p.6 photograph shows a plug seated at the left end. The specification is
    followed and the inlet is drawn as a C20.
  wanted: the installation guide or the maker's product page, to say which statement is right.
- what: lamp-colours
  scope: [lamps]
  reason: needs-photo
  note: >-
    three small lamps stand over the display and beside the jacks; their colours and meanings are not legible in the
    photograph and no document names them, so they are drawn unlit and uncoloured.
  wanted: the user manual's description of the status lamps.
- what: jack-function
  scope: [jack-1, jack-2]
  reason: vendor-silent
  note: >-
    the labels under the two jacks are not legible and the datasheet names no port; neither is stated as an Ethernet,
    console or sensor port.
  wanted: the user manual, or a close photograph of the jacks.
- what: jack-speed
  scope: [rear]
  reason: vendor-silent
  note: >-
    no document held names the two rear jacks or prints a speed for them, so none is stated.
  wanted: the user manual's port specification.
- what: ears
  scope: [front, rear, left, right]
  reason: needs-drawing
  note: >-
    the datasheet lists rack mounting brackets and gives no figure; no photograph shows them.
  wanted: the installation guide's mounting figures.
- what: sides
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: >-
    no held document shows the top, the bottom or an end.
  wanted: straight-on photographs of the top, the bottom and an end.
