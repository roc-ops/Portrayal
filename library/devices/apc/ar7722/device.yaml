format: 1
kind: device
name: ar7722
version: 1.0.0
maturity: modelled
manufacturer: APC
model: AR7722
description: 'Vertical cable manager for a 600 mm wide, 45U NetShelter SX cabinet, APC AR7722: a 23U length and
  a 20U length, each a rail with a smooth plastic loop to every rack unit, stood end to end down one side of the
  cabinet''s zero-U space. It takes no rack unit.'
profile: passive
provenance:
  mount:
    confidence: datasheet
    note: 'datasheet - `rack-side`: "Number of rack unit 0U", "Mounting Location Side" and the installation sheet
      (990-5140A) hooks it onto the side of the cabinet, in the zero-U space. `ru: 43` is the 23U and the 20U length
      it is made of. Which side is a placement''s to say.'
  method:
    confidence: datasheet
    note: 'FIGURES FROM THE MAKER''S OWN DOCUMENTS, read as data: the AR7722 data sheet and the installation sheet
      990-5140A. The data sheet''s height, width, depth and weight are `datasheet`. The sheet''s 1911 mm is the
      two lengths end to end: the installation sheet labels them 20U and 23U, 20 x 44.45 + 23 x 44.45 = 1911.35.
      Everything read off the sheet''s figures is estimated and said so. No drawing or photograph is copied.'
  chassis:
    confidence: datasheet
    note: 'datasheet - 107 x 1911 x 45: "Width 4.2 in (107 mm)", "Height 75.2 in (1911 mm)", "Depth 1.8 in (45 mm)",
      for the set of two lengths. The height is drawn 1911.35, the 43 rack units of the two lengths, so they stand
      end to end with no overlap; the sheet prints whole millimetres.'
  depth:
    confidence: datasheet
    note: datasheet - "Depth 1.8 in (45 mm)".
  shell:
    confidence: estimated
    note: estimated - the loops are drawn as slabs the depth of the part; no view sections a loop.
  thickness:
    confidence: estimated
    note: estimated - no document states a gauge; the parts carry their own depths.
  weight:
    confidence: datasheet
    note: datasheet - "Net Weight 5.004 lb(US) (2.27 kg)" for the set of two; packed 2.73 kg.
  front:
    confidence: estimated
    note: 'estimated - the face the installation sheet draws: the 23U length above the 20U, a rail down the left
      edge and a loop to each of 43 rack units.'
  rear:
    confidence: estimated
    note: estimated - the back of the same loops, the rail on the right.
  top:
    confidence: estimated
    note: 'estimated - the plan: the rail and the top loop''s edge.'
  bottom:
    confidence: estimated
    note: estimated - the plan again; the two ends are alike.
  left:
    confidence: estimated
    note: estimated - the rail's edge down the part, read from the plan.
  right:
    confidence: estimated
    note: estimated - the loops' ends down the part.
  guides:
    confidence: estimated
    note: estimated - the duct is the run down the loops, at one rack unit pitch, the gap the pitch less the 31
      mm loop.
  capacity:
    confidence: datasheet
    note: datasheet - no cable capacity is stated (see `gaps`).
  attrs:
    confidence: datasheet
    note: 'datasheet - "Color: Black", the provided equipment (2 x vertical cable organizers, installation guide);
      the installation sheet lists six nylon spacers and six 8-32 screws.'
  color:
    confidence: estimated
    note: 'estimated - "Color: Black". The shade is the library''s render of black plastic.'
attrs:
  physical:
    weight-kg: 2.27
    color: Black
    mounting-hardware: Nylon spacer x6 and 8-32 screw x6 (installation sheet)
chassis:
  width: 107.0
