format: 1
kind: device
name: ar7580a
version: 0.1.0
maturity: modelled
manufacturer: APC
model: AR7580A
description: 'Vertical cable manager for a 750 mm wide, 42U NetShelter SX cabinet, APC AR7580A: a back plate 1778
  mm tall with a column of 40 smooth plastic fingers down each side of one cable channel, a finger to each rack
  unit, made of two 20U lengths. It stands in the cabinet''s zero-U space and takes no rack unit.'
profile: passive
provenance:
  mount:
    confidence: datasheet
    note: 'datasheet - `rack-side`: "Number of rack unit 0U", "Mounting Location Front, Rear". The installation
      sheet hooks the plate onto the cabinet''s accessory channel with support plate and screws. `ru: 40` is the
      1778 mm in rack units. Which side is a placement''s to say.'
  method:
    confidence: datasheet
    note: 'FIGURES FROM THE MAKER''S OWN DOCUMENTS, read as data: the AR7580A data sheet and its installation sheet.
      Height, width, depth and weight are `datasheet`; the finger size and the split of the depth are ESTIMATED.
      No drawing or photograph is copied.'
  chassis:
    confidence: datasheet
    note: 'datasheet - 97 x 1778 x 160: "Width 3.8 in (97 mm)", "Height 70 in (1778 mm)", "Depth 6.3 in (160 mm)".'
  depth:
    confidence: estimated
    note: estimated - the 160 is the data sheet's; it is drawn as a 20 back plate zone and a 140 well. No view sections
      the part.
  shell:
    confidence: estimated
    note: 'estimated - a hollow channel, not a box: the back plate as a well, the 80 fingers standing off its floor.'
  thickness:
    confidence: estimated
    note: estimated - no document states a gauge; the parts carry their own.
  weight:
    confidence: datasheet
    note: datasheet - "Net Weight 9.02 lb(US) (4.09 kg)" for the part as sold (two lengths); packed 4.91 kg.
  front:
    confidence: estimated
    note: 'estimated - the working face: the back plate with its 40 fingers a side in two lengths of 20, and the
      channel between.'
  rear:
    confidence: estimated
    note: estimated - the back of the plate, which stands against the cabinet; plain (see `gaps`).
  top:
    confidence: estimated
    note: 'estimated - the plan: the back plate zone and the two finger columns.'
  bottom:
    confidence: estimated
    note: estimated - the plan again.
  left:
    confidence: estimated
    note: estimated - the back plate and the finger zone along it.
  right:
    confidence: estimated
    note: estimated - the left view turned round.
  guides:
    confidence: estimated
    note: estimated - the duct is the channel between the two finger columns, run down the height; the pitch is
      the rack unit of the data sheet's "1U increments", the gap the pitch less the 31 mm finger.
  capacity:
    confidence: datasheet
    note: datasheet - no cable capacity is stated (see `gaps`).
  attrs:
    confidence: datasheet
    note: 'datasheet - "Color: Black", the provided equipment (installation guide, mounting hardware, six cable
      retainers with snap hinges, top securing bracket).'
  color:
    confidence: estimated
    note: 'estimated - "Color: Black". The shade is the library''s render of black plastic.'
