gaps:
- what: finger-shape
  scope:
  - front
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  note: the installation sheet draws each finger in an isometric or face-on figure that is not dimensioned. Its
    height, length and the shape of its tip are read off the figure and estimated.
  wanted: a section through a finger and the rail or back plate
- what: cable-capacity
  scope:
  - front
  reason: vendor-silent
  note: the data sheet states no cable capacity, so none is recorded and none is estimated.
  wanted: a capacity figure and the cable it is stated for
- what: cabinet-fit
  scope:
  - rear
  reason: vendor-silent
  note: which NetShelter SX cabinets take this manager is stated only by the data sheet's title and the installation
    sheet's; no cabinet model number is listed, and the library has no NetShelter SX enclosure to place it in.
  wanted: the maker's compatibility list, and the cabinet's accessory channel drawing
- what: mounting-interface
  scope:
  - rear
  reason: needs-drawing
  note: the installation sheet shows the manager hooked onto keyhole slots in the cabinet's accessory channel and
    held by screws; the slots' pitch and the hooks are not dimensioned and are not drawn.
  wanted: a dimensioned drawing of the manager fitted to the channel
- what: cable-retainers
  scope:
  - front
  reason: needs-drawing
  note: the data sheet lists six cable retainers with snap hinges, shown in the installation sheet's inventory only;
    their size and places are not given and they are not drawn.
  wanted: the retainers' size and where they clip on
- what: top-bracket-and-support-plate
  scope:
  - front
  - rear
  reason: needs-drawing
  note: the top securing bracket and the support plate are listed and drawn in the inventory, not dimensioned, and
    are not drawn.
  wanted: their sizes and places on the plate
- what: length-seam
  scope:
  - front
  - rear
  reason: vendor-silent
  note: 'the part is two 20U lengths (the installation sheet''s inventory: Vertical Cable Manager (2)); the joint
    is not dimensioned and the plate is drawn as one length.'
  wanted: a drawing of the joint
