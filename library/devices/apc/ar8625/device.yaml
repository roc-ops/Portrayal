gaps:
  - what: door-hinge
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      each door "opens to left or right" on hinge pins and lifts off; the instruction sheet shows a
      quarter-turn latch and a door swinging off the finger tips either way, but no view dimensions a hinge.
      Each door is drawn as one fitted plate that is either on or off.
    wanted: a drawing or a close render of the door's hinge pins and latch
  - what: tie-off-points
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the data sheet advertises "multiple internal cable tie-off locations". The instruction sheet draws the
      slots and punches in the central plate that they are, but dimensions none, and the format has no place
      to state a tie point on a duct (#1009 states them only on the FS tray). They are not drawn or stated.
    wanted: the plate's slots dimensioned, and a place in the format for a duct's tie points
  - what: grounding-point
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the instruction sheet shows an optional grounding and bonding point, a tab with a hole bent up at the
      foot of the plate, "Hardware and cable not provided". No thread or hole size is stated, and a grounding
      point in the format is a stud or screw with a thread, so none is stated.
    wanted: the size of the hole and the screw it takes
  - what: cable-capacity
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      APC states "high capacity" and no figure on the data sheet, the instruction sheet or the brochure, so
      none is recorded and none is estimated.
    wanted: a capacity figure and the cable it is stated for
  - what: finger-shape
    scope: [front, rear, top, bottom, left, right]
    reason: needs-drawing
    note: >-
      the instruction sheet's isometric figure draws each finger as a smooth tongue with a rolled root. It is
      built as an arm 12 across and a hooked tip 22 across, 31 high, 296 long; the size, the length and the
      count (44, counted at constant pitch on the single-sided figure) are read off a figure that is not
      dimensioned.
    wanted: a section through a finger and the back plate
  - what: finger-alignment
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      where the first finger stands against the rack's units is not stated: the fingers are centred on the
      2134 mm height, and which hole of the upright each bolt takes is not dimensioned, so whether they sit
      on the rack's units is not known.
    wanted: the heights of the three bolt holes against the rack's first unit
  - what: midspan-brackets
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      three midspan brackets ship with the part and divide the interior space between the two channels
      (the brochure: 40-60, 50-50 or 60-40); the spine between the channels is drawn as a 60 mm plate zone
      and the brackets are not drawn, nor is the division moved by them.
    wanted: the bracket (AR8681 is its 6 in spare) dimensioned
  - what: door-oval
    scope: [front, rear]
    reason: needs-drawing
    note: the doors have an oval opening near their top in the instruction sheet's figure; it is not drawn.
    wanted: its size and place
  - what: bracket-stand-off
    scope: [left, right]
    reason: vendor-silent
    note: >-
      how far the manager stands from the upright when it is bolted on is not dimensioned; the part is drawn
      alone.
    wanted: a dimensioned drawing of the manager fitted to an upright
