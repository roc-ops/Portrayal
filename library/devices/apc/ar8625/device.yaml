format: 1
kind: device
name: ar8625
version: 0.1.0
maturity: modelled
manufacturer: APC
model: AR8625
description: >-
  Double-sided vertical cable manager, 6 in wide, APC Performance AR8625 for 2 and 4 post open frame
  racks: a steel back plate 2134 mm tall with a cable channel on both faces, a column of 44 smooth plastic
  fingers down each side of each channel, a finger to each rack unit, and a full-length door with two
  quarter-turn latches over each face that ships fitted. It stands beside the rack on three hex bolts
  through the upright and takes no rack unit.
profile: passive
provenance:
  mount:
    confidence: datasheet
    note: >-
      datasheet - `rack-side`: "Mounting Mode: Not rack-mountable" on the data sheet, and the instruction
      sheet "Vertical Cable Manager Installation for Open Frame Racks" (990-4576A-001) bolts it to the side
      of the rack's upright with three hex bolts, nuts and washers. It occupies no rack unit. `ru: 44` is
      the rack height it runs beside: the data sheet's 84.02 in (2134 mm) is the whole part, top and bottom
      brackets included, and the fingers are 44 rack units; 44 is the height of the AR203A and one short of
      the AR201's 45, so one figure places it beside either (lint L154 judges a part by `ru`). Which side
      of the rack is a lab placement to say (docs/vertical-cable-managers-design.md).
  method:
    confidence: datasheet
    note: >-
      FIGURES FROM THE MAKER'S OWN DOCUMENTS, read as data: the AR8625 product data sheet (fetched from
      se.com), the instruction sheet 990-4576A-001 (1/2016), which covers all six parts and draws the
      double-sided one, and the brochure "Enclosure and Rack Systems, Cable Management". THE FIGURES THE
      DATA SHEET PRINTS ARE `datasheet`; EVERYTHING READ OFF THE INSTRUCTION SHEET'S FIGURES (the fingers'
      count and size, the doors, the split of the depth) IS ESTIMATED and said so in the part that carries
      it. APC publishes no drawing or CAD for these parts. No drawing or photograph is copied. The part is
      the single-sided AR8615 on both faces of one back plate (see ar8615).
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 152 x 2134 x 660, doors fitted: "Width 6.0 in (152 mm)", "Height 84.02 in (2134 mm)",
      "Depth 26.0 in (660 mm)".
  depth:
    confidence: estimated
    note: >-
      estimated - the 660 is the data sheet's. It is drawn as two wells of 300 and a 60 back plate zone
      between them: the single-sided AR8615 is 14.2 in (360 mm), one well and a back plate zone, and the
      two figures solve to 300 and 60. No view sections the part.
  shell:
    confidence: estimated
    note: >-
      estimated - TWO HOLLOW CHANNELS BACK TO BACK, NOT A BOX. The body is a sheet body and its six views
      are elevations; the solid is what its parts build: on each face the back plate as a well 300 deep, its
      88 fingers standing off its floor and a door over their tips, which pulls off and opens the channel.
  thickness:
    confidence: estimated
    note: >-
      estimated - no APC document states a gauge. 1.5 is a sheet of this kind; the parts carry their own
      thicknesses.
  weight:
    confidence: datasheet
    note: 'datasheet - "Net Weight 65.9 lb(US) (29.9 kg)"; packed 39 kg.'
  front:
    confidence: estimated
    note: >-
      estimated - the front face with its door fitted: the door, and under it the back plate with 44 fingers
      a side in four sections of 11, centred on the height. The `duct` guide is the channel between the two
      finger columns, run down the height, ESTIMATED from the instruction sheet's figure.
  rear:
    confidence: estimated
    note: >-
      estimated - the rear face, the same parts placed the same way: the instruction sheet's figure draws
      the finger columns and a door on each side of the central plate, and the data sheet says "double-sided
      cable channel". `rear-duct` is the rear channel.
  top:
    confidence: estimated
    note: >-
      estimated - the plan, rear at y=0: the rear fingers, the back plate zone and the front fingers, from
      the finger length above.
  bottom:
    confidence: estimated
    note: >-
      estimated - the top view again: the two ends of the manager are alike.
  left:
    confidence: estimated
    note: >-
      estimated - no side view of the manager without its doors is dimensioned: the back plate between the
      two finger zones, built from the plan and the finger columns' extent.
  right:
    confidence: estimated
    note: >-
      estimated - the left view turned round.
  guides:
    confidence: estimated
    note: >-
      estimated - each duct is the channel between the two finger columns of its face, run down the height
      (`run: y`). The finger pitch is the rack unit, 44.45, as the data sheet's "1U increments"; the gap is
      the pitch less the 31 mm finger, 13.45, ESTIMATED from the finger's drawn thickness.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - the AR8625 data sheet and the brochure state no cable capacity, only "high capacity". None
      is estimated here (see `gaps`).
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the colour, the plastic fingers, the hardware (three hex bolts, nuts and washers, split
      washers), the provided doors, installation guide and three midspan brackets, UL Listed and EU RoHS
      compliant are the data sheet and the instruction sheet.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". Every image APC publishes of the part is a render; it is drawn black, the
      doors a shade lighter than the back plate.
