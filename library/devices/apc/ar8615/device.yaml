format: 1
kind: device
name: ar8615
version: 0.1.0
maturity: modelled
manufacturer: APC
model: AR8615
description: >-
  Single-sided vertical cable manager, 6 in wide, APC Performance AR8615 for 2 and 4 post open frame
  racks: a steel back plate 2134 mm tall with a column of 44 smooth plastic fingers down each side of
  one cable channel, a finger to each rack unit, and a full-length door with two quarter-turn latches
  that ships fitted. It stands beside the rack on three hex bolts through the upright and takes no
  rack unit.
profile: passive
provenance:
  mount:
    confidence: datasheet
    note: >-
      datasheet - `rack-side`: "Mounting Mode: Not rack-mountable" on the data sheet, and the
      instruction sheet "Vertical Cable Manager Installation for Open Frame Racks" (990-4576A-001)
      bolts it to the side of the rack's upright with three hex bolts, nuts and washers. It occupies
      no rack unit. `ru: 44` is the rack height it runs beside: the data sheet's 84.02 in (2134 mm)
      is the height of the whole part, top and bottom brackets included, and the fingers are 44 rack
      units; 44 is the height of the AR203A and one short of the AR201's 45, so one figure places it
      beside either (lint L154 judges a part by `ru`). Which side of the rack is a lab placement to
      say (docs/vertical-cable-managers-design.md).
  method:
    confidence: datasheet
    note: >-
      FIGURES FROM THE MAKER'S OWN DOCUMENTS, read as data: the AR8615 product data sheet (fetched
      from se.com), the instruction sheet 990-4576A-001 (1/2016), which covers all six parts, and the
      brochure "Enclosure and Rack Systems, Cable Management". THE FIGURES THE DATA SHEET PRINTS (height,
      width, depth, weight) ARE `datasheet`; EVERYTHING READ OFF THE INSTRUCTION SHEET'S FIGURES (the
      fingers' count and size, the door, the split of the depth) IS ESTIMATED and said so in the part
      that carries it. APC publishes no drawing or CAD for these parts: the product page lists the
      instruction sheet, the brochure and environmental declarations only. No drawing or photograph is
      copied.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 152 x 2134 x 360, door fitted: "Width 6.0 in (152 mm)", "Height 84.02 in (2134 mm)",
      "Depth 14.2 in (360 mm)".
  depth:
    confidence: estimated
    note: >-
      estimated - the 360 is the data sheet's. It is drawn as a 60 back plate zone and a 300 well: the
      double-sided AR8625 is 26.0 in (660 mm), two wells and one back plate zone, and the two figures
      solve to 300 and 60. No view sections the part.
  shell:
    confidence: estimated
    note: >-
      estimated - A HOLLOW CHANNEL, NOT A BOX. The body is a sheet body and its six views are
      elevations; the solid is what its parts build: the back plate as a well 300 deep, the 88 fingers
      standing off its floor and the door over their tips, which pulls off and opens the channel.
  thickness:
    confidence: estimated
    note: >-
      estimated - no APC document states a gauge. 1.5 is a sheet of this kind; the parts carry their
      own thicknesses.
  weight:
    confidence: datasheet
    note: 'datasheet - "Net Weight 60.0 lb(US) (27.2 kg)"; packed 33.1 kg.'
  front:
    confidence: estimated
    note: >-
      estimated - the working face with the door fitted: the door, and under it the back plate with
      its 44 fingers a side in four sections of 11, centred on the height. The `duct` guide is the
      channel between the two finger columns, run down the height: the width less the 6 mm margin and
      22 mm finger on each side, ESTIMATED from the instruction sheet's figure.
  rear:
    confidence: estimated
    note: >-
      estimated - the back of the single-sided part is its back plate, the face that stands against the
      rack's upright. The instruction sheet draws it slotted and punched; no document dimensions the
      slots, so it is drawn plain (see `gaps`).
  top:
    confidence: estimated
    note: >-
      estimated - the plan, rear at y=0: the back plate zone and the two finger columns, from the finger
      length above.
  bottom:
    confidence: estimated
    note: >-
      estimated - the top view again: the two ends of the manager are alike.
  left:
    confidence: estimated
    note: >-
      estimated - no side view of the manager without its door is dimensioned: the back plate, and the
      finger zone along it, built from the plan and the finger columns' extent.
  right:
    confidence: estimated
    note: >-
      estimated - the left view turned round.
  guides:
    confidence: estimated
    note: >-
      estimated - the duct is the channel between the two finger columns, run down the height
      (`run: y`). The finger pitch is the rack unit, 44.45, as the data sheet's "1U increments"; the
      gap is the pitch less the 31 mm finger, 13.45, ESTIMATED from the finger's drawn thickness.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - the AR8615 data sheet and the brochure state no cable capacity, only "high capacity".
      None is estimated here (see `gaps`).
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the colour, the plastic fingers, the hardware (the instruction sheet's three hex
      bolts, nuts and washers, split washers), the provided doors and installation guide, UL Listed
      and EU RoHS compliant are the data sheet and the instruction sheet.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". Every image APC publishes of the part is a render; it is drawn black,
      the door a shade lighter than the back plate.
