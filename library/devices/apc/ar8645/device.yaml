format: 1
kind: device
name: ar8645
version: 0.1.0
maturity: modelled
manufacturer: APC
model: AR8645
description: >-
  Double-sided vertical cable manager, 10 in wide, APC Performance AR8645 for 2 and 4 post open frame
  racks: a steel back plate 2134 mm tall with a cable channel on both faces, a column of 44 smooth plastic
  fingers down each side of each channel, a finger to each rack unit, and a full-length door with two
  quarter-turn latches over each face that ships fitted. It stands beside the rack on three hex bolts
  through the upright and takes no rack unit.
profile: passive
provenance:
  mount:
    confidence: datasheet
    note: >-
      datasheet - `rack-side`, as the AR8625 (see ar8625): "Mounting Mode: Not rack-mountable" on the data
      sheet, bolted to the side of the upright by the instruction sheet's three hex bolts. It occupies no
      rack unit. `ru: 44` is the rack height it runs beside, the fingers' 44 units: the height of the AR203A
      and one short of the AR201's 45, so one figure places it beside either (lint L154 judges a part by
      `ru`; the 2134 mm of the data sheet is the whole part). Which side of the rack is a lab placement
      to say.
  method:
    confidence: datasheet
    note: >-
      FIGURES FROM THE MAKER'S OWN DOCUMENTS, read as the AR8625's are (see ar8625): the AR8645 data sheet,
      the instruction sheet 990-4576A-001 and the brochure. THE FIGURES THE DATA SHEET PRINTS ARE
      `datasheet`; EVERYTHING READ OFF THE INSTRUCTION SHEET'S FIGURES IS ESTIMATED and said so in the part
      that carries it. No drawing or photograph is copied.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 253 x 2134 x 660, doors fitted: "Width 10.0 in (253 mm)" (10 in is 254.0; drawn as
      printed), "Height 84.02 in (2134 mm)", "Depth 26.0 in (660 mm)".
  depth:
    confidence: estimated
    note: >-
      estimated - the 660 is the data sheet's, drawn as two wells of 300 and a 60 back plate zone between
      them (see ar8625).
  shell:
    confidence: estimated
    note: >-
      estimated - TWO HOLLOW CHANNELS BACK TO BACK, NOT A BOX (see ar8625): a sheet body whose solid is a
      well on each face with its 88 fingers and its door.
  thickness:
    confidence: estimated
    note: >-
      estimated - no APC document states a gauge; 1.5 is a sheet of this kind.
  weight:
    confidence: datasheet
    note: 'datasheet - "Net Weight 75.0 lb(US) (34 kg)"; packed 43.1 kg.'
  front:
    confidence: estimated
    note: >-
      estimated - the front face with its door fitted, placed as the AR8625's with the right finger column
      at 225. The `duct` guide is the 197 between the finger columns.
  rear:
    confidence: estimated
    note: >-
      estimated - the rear face, the same parts placed the same way; `rear-duct` is the rear channel.
  top:
    confidence: estimated
    note: estimated - the plan, rear at y=0, as the AR8625's at this width.
  bottom:
    confidence: estimated
    note: estimated - the top view again.
  left:
    confidence: estimated
    note: estimated - the back plate between the two finger zones, as the AR8625's.
  right:
    confidence: estimated
    note: estimated - the left view turned round.
  guides:
    confidence: estimated
    note: >-
      estimated - each channel between the two finger columns of its face, run down the height (`run: y`);
      pitch the rack unit, 44.45, as the data sheet's "1U increments", gap the pitch less the 31 mm finger,
      13.45.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - the AR8645 data sheet and the brochure state no cable capacity. None is estimated.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the colour, the plastic fingers, the hardware, the provided doors, installation guide and
      three midspan brackets, UL Listed and EU RoHS compliant are the data sheet and the instruction sheet.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black"; every image APC publishes is a render, so it is drawn black.
