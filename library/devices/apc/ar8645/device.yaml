  physical:
    weight-kg: 34.0
    finger-material: plastic
    color: Black
    mounting-hardware: 'Hex bolt x3, nut x3, washer x6 and split washer x3 (instruction sheet); midspan bracket x3'
  compliance:
    rohs: EU RoHS compliant
    ul: UL Listed
chassis:
  width: 253.0
  height: 2134.0
  depth: 660.0
  ru: 44
  mount: rack-side
  shell: sheet
  thickness: 1.5
  weight-kg: 34.0
  color: '#232527'
gaps:
  - what: door-hinge
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      each door "opens to left or right" on hinge pins and lifts off; no view dimensions a hinge. Each door is
      drawn as one fitted plate that is either on or off.
    wanted: a drawing or a close render of the door's hinge pins and latch
  - what: tie-off-points
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the data sheet advertises "multiple internal cable tie-off locations"; the instruction sheet draws the
      plate's slots but dimensions none, and the format has no place to state a tie point on a duct (#1009
      states them only on the FS tray). They are not drawn or stated.
    wanted: the plate's slots dimensioned, and a place in the format for a duct's tie points
  - what: grounding-point
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the instruction sheet shows an optional grounding and bonding point, a tab with a hole, "Hardware and
      cable not provided". No thread or hole size is stated, and a grounding point in the format is a stud
      or screw with a thread, so none is stated.
    wanted: the size of the hole and the screw it takes
  - what: cable-capacity
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      APC states "high capacity" and no figure on the data sheet, the instruction sheet or the brochure, so
      none is recorded and none is estimated.
    wanted: a capacity figure and the cable it is stated for
  - what: finger-shape
    scope: [front, rear, top, bottom, left, right]
    reason: needs-drawing
    note: >-
      the instruction sheet's figure draws each finger as a smooth tongue with a rolled root; it is built as
      an arm 12 across and a hooked tip 22 across, 31 high, 296 long, and the 44 are counted, none of it
      dimensioned.
    wanted: a section through a finger and the back plate
  - what: finger-alignment
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      where the first finger stands against the rack's units is not stated; the fingers are centred on the
      2134 mm height and whether they sit on the rack's units is not known.
    wanted: the heights of the three bolt holes against the rack's first unit
  - what: midspan-brackets
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      three midspan brackets ship with the part and divide the interior space between the two channels
      (the brochure: 40-60, 50-50 or 60-40); the spine is drawn as a 60 mm plate zone and the brackets are
      not drawn.
    wanted: the bracket (AR8682 is its 10 in spare) dimensioned
  - what: door-oval
    scope: [front, rear]
    reason: needs-drawing
    note: the doors have an oval opening near their top in the instruction sheet's figure; it is not drawn.
    wanted: its size and place
  - what: bracket-stand-off
    scope: [left, right]
    reason: vendor-silent
    note: >-
      how far the manager stands from the upright when bolted on is not dimensioned; the part is drawn alone.
    wanted: a dimensioned drawing of the manager fitted to an upright
