format: 1
kind: device
name: ar7710
version: 1.0.0
maturity: modelled
manufacturer: APC
model: AR7710
description: Cable containment bracket for NetShelter SX, SV and VX racks, APC AR7710. It is a black sheet-steel cup, 80 mm
  wide, 112 mm tall and 45 mm deep, open at both ends. A keyhole opens in each of its three faces. It takes no rack unit.
profile: passive
provenance:
  mount:
    confidence: datasheet
    note: 'datasheet - `rack-side`: "Number of rack unit 0U", "Mounting Location Side" and "Mounting Mode Rack-mounted". The
      installation sheet 990-3113A hangs it on a plate screwed to the rack frame.'
  method:
    confidence: datasheet
    note: FIGURES FROM THE MAKER'S OWN DOCUMENTS, read as data. They are the AR7710 data sheet and the installation sheet
      990-3113A. Width, height, depth and weight are `datasheet`. Every drawn feature is read off the sheets' pictures and
      estimated. No drawing or photograph is copied.
  chassis:
    confidence: datasheet
    note: 'datasheet - 80 x 112 x 45 mm: "Width 3.1 in (80 mm)", "Height 4.4 in (112 mm)", "Depth 1.8 in (45 mm)". Every held
      picture shows the part lying with its 112 mm side across. It is drawn standing, 112 mm tall, as the data sheet labels it
      and as a rack-side part is drawn (see the `installed-orientation` gap).'
  ru:
    confidence: estimated
    note: estimated - 112 mm is 2.52 rack units of 44.45 mm, so the part runs beside three. The data sheet prints "0U".
  depth:
    confidence: datasheet
    note: datasheet - "Depth 1.8 in (45 mm)".
  shell:
    confidence: estimated
    note: estimated - a solid box in 3D. The part is a hollow cup open at both ends. Its open ends are drawn on the left and
      right faces only.
  weight:
    confidence: datasheet
    note: 'datasheet - "Net Weight 0.99 lb(US) (0.45 kg)". The sheet does not say whether this is one bracket or the six in the
      pack. The packed weight is 2.27 kg, and six brackets of 0.45 kg would weigh more than that.'
  front:
    confidence: estimated
    note: estimated - the long face of the cup as the installation sheet draws it, turned a quarter turn to stand 112 mm tall.
      It has two keyholes, one in each piece, and the open slot between the pieces with the hook of one piece in it.
      Positions are read off the figure at 800 dpi, fitting the face to the printed 112 x 80 mm.
  rear:
    confidence: estimated
    note: estimated - the plate the data sheet shows on page 4, six times. It has two screws and one small pale stud. It is turned
      the same quarter turn. No page says how the plate joins the cup (see the `plate-joint` gap). One screw shank and one
      small pin are raised from it, read off the page 1 photograph (see the `screw-shanks` and `shank-length` gaps).
  top:
    confidence: estimated
    note: estimated - the end face the installation sheet draws at the right of the cup, with one keyhole, turned the same
      quarter turn.
  bottom:
    confidence: estimated
    note: built as the documented side, as no document shows this one. It is the top face seen from below, with its keyhole
      mirrored left to right. The installation sheet's cable figure shows cables leaving the cup at this end.
  left:
    confidence: estimated
    note: estimated - the open end of the cup. The wall is 1.5 mm, which no page states. The tab of the left piece closes the
      joint slot at this end.
  right:
    confidence: estimated
    note: estimated - the other open end of the cup. The joint slot cuts the front wall here, 1.5 mm deep. x = 0 is the front.
  capacity:
    confidence: datasheet
    note: datasheet - no cable capacity is stated (see `gaps`).
  attrs:
    confidence: datasheet
    note: 'datasheet - "Color: Black" and the provided equipment (installation guide).'
  color:
    confidence: estimated
    note: 'estimated - "Color: Black". The shade is the library''s render of black steel. The photographs are lit and read
      lighter, from #15161a in place to #383a47 on the white page.'
