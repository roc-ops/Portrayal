  physical:
    weight-kg: 0.45
    color: Black
chassis:
  width: 80.0
  height: 112.0
  depth: 45.0
  ru: 3
  mount: rack-side
  weight-kg: 0.45
  color: '#232527'
gaps:
- what: set-or-single
  scope:
  - front
  reason: vendor-silent
  note: The installation sheet is titled "Wire Management Bracket (6)" and the data sheet's photograph shows six. The data
    sheet prints one size and one weight and counts one piece in the package. One bracket is drawn.
  wanted: the maker's statement of what the pack holds and what the weight covers
- what: installed-orientation
  scope:
  - front
  - rear
  - top
  - bottom
  reason: needs-photo
  note: Every held picture shows the cup with its 112 mm side across and its keyholes upright. The part is drawn standing
    112 mm tall, as the data sheet labels it, so each keyhole lies on its side. L152 asks a rack-side front to be taller
    than wide.
  wanted: a photograph or drawing that shows how the bracket stands on the rack frame
- what: plate-joint
  scope:
  - rear
  reason: needs-drawing
  note: The data sheet shows six plates, each with two screws and a small pale stud. The installation sheet shows a plate with
    two screws on the rack frame. No page says how a plate joins a cup, or whether the plate is sold with the bracket.
  wanted: a dimensioned drawing of the plate and of the bracket fitted to it
- what: screw-shanks
  scope:
  - rear
  reason: needs-photo
  note: The data sheet photograph shows one threaded shank at the right-hand piece of each of three brackets. It shows a small
    pin at each piece of the other three. One shank and one pin are drawn. The left-hand piece of the lower three shows no shank.
  wanted: a photograph of the open end of one bracket that shows every screw
- what: shank-length
  scope:
  - rear
  reason: needs-photo
  note: The photograph is a perspective view and no page gives a shank length. The drawn 15 mm is read off it within a range
    of about 10 to 35 mm.
  wanted: the maker's drawing of the plate and its screws
- what: keyhole-function
  scope:
  - front
  - top
  - bottom
  reason: vendor-silent
  note: The sheets draw a keyhole in each face. No page says what lands in a keyhole or gives its size. The keyholes are drawn
    as openings and carry no connector.
  wanted: the maker's statement of what the keyholes take, with their sizes
- what: perforation-shapes
  scope:
  - front
  - rear
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  note: No page dimensions the cup, its keyholes, the joint slot, the hook, the plate or the wall. Sizes and places are read off
    the figures and estimated. The corners are drawn rounded 3 mm all round. The figure rounds only the end corners.
  wanted: a dimensioned drawing of the bracket and the plate
- what: hollow-body
  scope:
  - top
  - bottom
  reason: needs-drawing
  note: The cup is hollow and open at both ends. The body is a solid box in 3D, and the open ends are drawn on the left and
    right faces only.
  wanted: a section drawing of the bracket
- what: cable-capacity
  scope:
  - front
  reason: vendor-silent
  note: The data sheet states no cable capacity, so none is recorded and none is estimated.
  wanted: a capacity figure and the cable it is stated for
- what: cabinet-fit
  scope:
  - rear
  reason: vendor-silent
  note: The data sheet is titled for NetShelter SX, SV and VX racks and the installation sheet shows an SX frame. No page
    lists a cabinet model number.
  wanted: the maker's compatibility list
