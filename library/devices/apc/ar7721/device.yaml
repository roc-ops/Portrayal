format: 1
kind: device
name: ar7721
version: 1.0.0
maturity: modelled
manufacturer: APC
model: AR7721
description: Vertical cable manager for a 600 mm wide, 42U NetShelter SX cabinet, APC AR7721. It is two 20U lengths, each
  a plate with a plastic crossbar to every rack unit, stood end to end. They stand in the cabinet's zero-U space and take
  no rack unit.
profile: passive
provenance:
  mount:
    confidence: datasheet
    note: 'datasheet - `rack-side`: "Number of rack unit 0U" and "Mounting Location Side". The installation sheet (990-5121A,
      page 1) shows the two lengths one above the other on one side of the cabinet. `ru: 40` is the two 20U lengths.'
  method:
    confidence: datasheet
    note: 'FIGURES FROM THE MAKER''S OWN DOCUMENTS, read as data: the AR7721 data sheet and the installation sheet 990-5121A.
      Width, depth and weight are `datasheet`. The data sheet''s 889 mm is one length, as the 20 loops counted on page 5
      show. The device is the set of two, 1778 mm. No drawing or photograph is copied.'
  chassis:
    confidence: datasheet
    note: 'datasheet - 107 x 889 x 45 for one length: "Width 4.2 in (107 mm)", "Height 35 in (889 mm)", "Depth 1.8 in (45
      mm)". The set is drawn 1778, two lengths of 20 x 44.45 end to end.'
  depth:
    confidence: datasheet
    note: datasheet - "Depth 1.8 in (45 mm)".
  shell:
    confidence: estimated
    note: estimated - the crossbars are drawn as solids the depth of the part; no view sections one.
  thickness:
    confidence: estimated
    note: estimated - no document states a gauge; the parts carry their own depths.
  weight:
    confidence: datasheet
    note: datasheet - "Net Weight 4.81 lb(US) (2.18 kg)" for the set of two; packed 2.59 kg.
  front:
    confidence: estimated
    note: estimated - the face the installation sheet and the photographs show. A rail and a loop to each rack unit, in
      two lengths of 20.
  rear:
    confidence: estimated
    note: estimated - the back of the same crossbars, with the plate on the left. Three screw heads to a length stand on
      the plate, as the second photograph on data sheet page 5 shows.
  top:
    confidence: estimated
    note: 'estimated - the plan: the plate and the top crossbar.'
  bottom:
    confidence: estimated
    note: estimated - the plan again; the two ends are alike.
  left:
    confidence: estimated
    note: estimated - the outer ends of the 40 crossbars, each with its lip.
  right:
    confidence: estimated
    note: estimated - the plate's edge down the part. It carries 8 hook windows, 4 slots and 2 tabs to a length, as the
      edge photograph on data sheet page 5 shows.
  guides:
    confidence: estimated
    note: estimated - the duct is the run down the crossbars, at one rack unit pitch, the gap the pitch less the 7 mm crossbar.
  capacity:
    confidence: datasheet
    note: datasheet - no cable capacity is stated (see `gaps`).
  attrs:
    confidence: datasheet
    note: 'datasheet - "Color: Black" and the provided equipment (2 x vertical cable organizers, installation guide).'
  color:
    confidence: estimated
    note: 'estimated - "Color: Black". The shade is the library''s render of black plastic.'
attrs:
  physical:
    weight-kg: 2.18
    color: Black
chassis:
  width: 107.0
  height: 1778.0
  depth: 45.0
  ru: 40
  mount: rack-side
  shell: sheet
  thickness: 1.5
  weight-kg: 2.18
  color: '#232527'
gaps:
- what: set-length
  scope:
  - front
  - rear
  reason: vendor-silent
  note: The data sheet prints 889 mm for "Height" and 2.18 kg for the set of two. Its carton is 848 mm long, shorter than
    one 889 mm length. No page says how the lengths lie in the carton.
  wanted: the maker's statement of the length of each piece and of the set
- what: finger-shape
  scope:
  - front
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  note: The photographs show each finger without a dimension. Its height, length and the shape of its tip are read off the
    figure and estimated.
  wanted: a section through a finger and the rail
- what: cable-capacity
  scope:
  - front
  reason: vendor-silent
  note: The data sheet states no cable capacity, so none is recorded and none is estimated.
  wanted: a capacity figure and the cable it is stated for
- what: cabinet-fit
  scope:
  - rear
  reason: vendor-silent
  note: The installation sheet is titled for the NetShelter SX 600 mm 42U cabinet and lists no model number. No page lists
    which cabinet models take it.
  wanted: the maker's compatibility list
- what: length-seam
  scope:
  - front
  - rear
  reason: vendor-silent
  note: The two lengths are drawn end to end and the joint is not dimensioned. The installation sheet shows them one above
    the other.
  wanted: a drawing of the two lengths fitted to one side
