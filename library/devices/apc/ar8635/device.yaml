format: 1
kind: device
name: ar8635
version: 0.1.0
maturity: modelled
manufacturer: APC
model: AR8635
description: >-
  Single-sided vertical cable manager, 10 in wide, APC Performance AR8635 for 2 and 4 post open frame
  racks: a steel back plate 2134 mm tall with a column of 44 smooth plastic fingers down each side of
  one cable channel, a finger to each rack unit, and a full-length door with two quarter-turn latches
  that ships fitted. It stands beside the rack on three hex bolts through the upright and takes no
  rack unit.
profile: passive
provenance:
  mount:
    confidence: datasheet
    note: >-
      datasheet - `rack-side`, as the AR8615 (see ar8615): "Mounting Mode: Not rack-mountable" on the data
      sheet, bolted to the side of the upright by the instruction sheet's three hex bolts. It occupies no
      rack unit. `ru: 44` is the rack height it runs beside, the fingers' 44 units: the height of the AR203A
      and one short of the AR201's 45, so one figure places it beside either (lint L154 judges a part by
      `ru`; the 2134 mm of the data sheet is the whole part). Which side of the rack is a lab placement
      to say.
  method:
    confidence: datasheet
    note: >-
      FIGURES FROM THE MAKER'S OWN DOCUMENTS, read as the AR8615's are (see ar8615): the AR8635 data sheet,
      the instruction sheet 990-4576A-001 and the brochure. THE FIGURES THE DATA SHEET PRINTS ARE
      `datasheet`; EVERYTHING READ OFF THE INSTRUCTION SHEET'S FIGURES IS ESTIMATED and said so in the part
      that carries it. No drawing or photograph is copied.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 253 x 2134 x 360, door fitted: "Width 10.0 in (253 mm)" (10 in is 254.0; drawn as
      printed), "Height 84.02 in (2134 mm)", "Depth 14.2 in (360 mm)".
  depth:
    confidence: estimated
    note: >-
      estimated - the 360 is the data sheet's, drawn as a 60 back plate zone and a 300 well (see ar8615).
  shell:
    confidence: estimated
    note: >-
      estimated - A HOLLOW CHANNEL, NOT A BOX (see ar8615): a sheet body whose solid is the well, the 88
      fingers standing off its floor and the door over their tips.
  thickness:
    confidence: estimated
    note: >-
      estimated - no APC document states a gauge; 1.5 is a sheet of this kind.
  weight:
    confidence: datasheet
    note: 'datasheet - "Net Weight 65.04 lb(US) (29.5 kg)"; packed 35.4 kg.'
  front:
    confidence: estimated
    note: >-
      estimated - the working face with the door fitted, placed as the AR8615's with the right finger column
      at 225: the door, and under it the back plate with 44 fingers a side in four sections of 11. The
      `duct` guide is the 197 between the finger columns.
  rear:
    confidence: estimated
    note: >-
      estimated - the back plate, the face that stands against the rack's upright; drawn plain (see ar8615).
  top:
    confidence: estimated
    note: estimated - the plan, rear at y=0, as the AR8615's at this width.
  bottom:
    confidence: estimated
    note: estimated - the top view again.
  left:
    confidence: estimated
    note: estimated - the back plate and the finger zone along it, as the AR8615's.
  right:
    confidence: estimated
    note: estimated - the left view turned round.
  guides:
    confidence: estimated
    note: >-
      estimated - the channel between the two finger columns, run down the height (`run: y`); pitch the rack
      unit, 44.45, as the data sheet's "1U increments", gap the pitch less the 31 mm finger, 13.45.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - the AR8635 data sheet and the brochure state no cable capacity. None is estimated.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the colour, the plastic fingers, the hardware, the provided doors and installation guide,
      UL Listed and EU RoHS compliant are the data sheet and the instruction sheet.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black"; every image APC publishes is a render, so it is drawn black.
