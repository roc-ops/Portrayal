format: 1
kind: device
name: cmhook1un
version: 0.1.0
maturity: modelled
manufacturer: StarTech.com
model: CMHOOK1UN
description: >-
  1U narrow vertical D-ring hook, StarTech.com CMHOOK1UN: a steel strip that bolts to the face of
  one rack rail through its two slots, carrying a flat loop 45 mm across that stands 101.3 mm out
  of the rail. The loop has an 11 mm opening in its far end that a bundle is slipped in through,
  and a cable runs up and down the rail through it. It takes no rack unit of its own.
profile: passive
provenance:
  mount:
    confidence: drawing
    note: >-
      drawing - `rack-face`, as the CMHOOK1U. The datasheet says the hook "mounts vertically to
      2-post and 4-post racks and supports both 10-inch and 19-inch rack systems"; its plate is
      the same 44.6 mm strip with two slots 32.0 apart. It is narrower than the opening, so a lab
      places it with a `side`; a hook on each rail of one unit do not conflict
      (docs/vertical-cable-managers-design.md section 3.4). `ru: 1` is the unit its 44.6 spans.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S OWN DRAWING. StarTech.com publishes CMHOOK1UN_Diagram.pdf (third
      angle projection, millimetres, 6/15/2022): a plan, a side view, a front view and an
      isometric, with the dimensions 101.3, 45.0, 11.0, 3.2, 2.3, 44.6, 10.0, 32.0, 19.0, 15.8
      and "2-phi6.0x12.0". The datasheet (cmhook1un_datasheet.pdf) lists "Product Length 4.0 in
      [10.1 cm]", "Product Width 1.8 in [45.0 mm]", "Product Height 1.8 in [44.6 mm]", "Internal
      Width 1.5 in [38.6 mm]" and "Internal Depth 3.6 in [92.6 mm]"; the drawing's figures agree.
      It is the CMHOOK1U 12 mm narrower with a wider opening.
  chassis:
    confidence: drawing
    note: >-
      drawing - 45.0 x 44.6 x 101.3: the ring's width across the rail, the plate's height and the
      projection from the rail's face.
  thickness:
    confidence: drawing
    note: >-
      drawing - 2.3, the plate on the side view; the ring's wall is 3.2 on the plan.
  weight:
    confidence: datasheet
    note: datasheet - "Weight of Product 2.5 oz [70.0 g]" (cmhook1un_datasheet.pdf).
  hand:
    confidence: drawing
    note: >-
      drawing - the front view draws the plate 6.3 mm in from the ring's right end, 15.8 from its
      end to the slots' middle. The drawing does not say which rail it is drawn for, nor whether
      the loop stands inboard or outboard of it. The hook is drawn as that view draws it, with
      the plate on the right, which is how a part stands on the left rail (as `fs/cmv-5u3w` is
      drawn); on the right rail the kit turns it end over end (kit/rack/solids.js and route.js
      mirror a narrow rack-face part there).
  front:
    confidence: drawing
    note: >-
      drawing - the front view: the loop's far end, 10.0 high, in two pieces with the 11.0 opening
      between them in the middle of its 45.0, and the plate behind it with its two slots.
  rear:
    confidence: drawing
    note: >-
      drawing - the back of the plate, the face that lies on the rail, with the two slots, and the
      loop's closed end showing past it.
  top:
    confidence: drawing
    note: >-
      drawing - an elevation, rear at the top: the plate 2.3 thick and the loop's outline, a wall
      3.2 thick all round, open by 11.0 in the middle of its far end. The bottom is the same.
  left:
    confidence: drawing
    note: >-
      drawing - the side view: the plate and the loop's 10.0 high band standing out of it. The
      right is the same, turned round.
  rings:
    confidence: drawing
    note: >-
      drawing - the loop is the ring: a component with a `ring` guide whose opening is the
      datasheet's 38.6 by 92.6 (see its contract), cables passing up and down the rail through it.
  capacity:
    confidence: estimated
    note: >-
      no document states a cable capacity: the datasheet and the drawing are silent, so none is
      stated and a gap says so.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material (steel), colour, the standard (EIA RS310-D) and the racks it fits
      (2-post and 4-post, 10 in and 19 in) are the datasheet's.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". The drawing is line work, so the shades are this library's
      render of black steel, the ring a little lighter than the plate.
attrs:
  physical:
    weight-kg: 0.07
    material: Steel
    color: Black
  features:
    standards: EIA RS310-D
    racks: 2-post and 4-post racks, 10 in and 19 in (datasheet)
chassis:
  width: 45.0
  height: 44.6
  depth: 101.3
  ru: 1
  mount: rack-face
  shell: sheet
  thickness: 2.3
  weight-kg: 0.07
  color: '#232527'
gaps:
  - what: cable-capacity
    reason: vendor-silent
    note: >-
      the datasheet and the drawing state no cable capacity, no fill and no cable count.
    wanted: a cable capacity table, or a stated fill, for the hook
  - what: hook-opening
    scope: [front, top, bottom]
    reason: needs-drawing
    note: >-
      the 11.0 gap in the far end of the loop is the "wide front opening for quick cable
      insertion", drawn in the relief; the format's ring `slit` is a range of height along a leg
      and cannot state a gap across the far bar, so the ring is declared with its clear opening
      and no slit, and a route is not told the loop can be entered through its end.
    wanted: a format key for a gap in a ring's far end, or a route kit that reads the opening
