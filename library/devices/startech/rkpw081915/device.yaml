gaps:
  - what: rear
    scope: [rear]
    reason: needs-photo
    note: >-
      no document shows the rear of this model: the data sheet has one photograph, of the front. The eight outlets and the cord are drawn on the rear because the data
      sheet counts them and the front shows none; their positions are an estimate borrowed from the same maker's 8NS8-RACK-MOUNT-PDU, and which end the cord leaves by is not shown.
    wanted: a photograph of the rear, or the installation document.
  - what: switch-and-breaker
    scope: [front]
    reason: vendor-silent
    note: >-
      the data sheet lists a built-in circuit breaker, a reset switch and an illuminated power/reset switch, and the photograph shows one rocker. Which control is which, and
      where the breaker stands, is not stated.
    wanted: the installation document.
  - what: ear-positions
    scope: [front]
    reason: needs-drawing
    note: >-
      the data sheet gives no ear, bracket or hole dimension; it lists four M5 screws and four M5 cage nuts. The body width between the folds is an estimate.
    wanted: a dimensioned drawing.
  - what: sides
    scope: [top, bottom, left, right]
    reason: needs-photo
    note: >-
      the photograph sees the top at a shallow angle and shows no end; nothing can be measured.
    wanted: straight-on photographs of the top, the bottom and an end, with a scale.
