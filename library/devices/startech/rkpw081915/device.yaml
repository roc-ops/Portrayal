maturity: modelled
manufacturer: StarTech.com
model: RKPW081915
description: >-
  StarTech.com RKPW081915, a 1U horizontal rack PDU with eight NEMA 5-15 outlets, 120 V, 15 A (12 A derated), single phase. It has 1800 J
  surge protection, a built-in circuit breaker and an illuminated power switch. A black steel box with a mounting bracket at each end.
  The front carries a SURGE lamp and a GROUND lamp at the left. At the right it carries the maker's logo, the model number and a red
  illuminated rocker switch. A fixed 6 ft (1.8 m) cord with a NEMA 5-15P plug leaves the unit. No document shows the rear. The eight outlets
  and the cord are placed there from the data sheet's counts, at estimated positions.
profile: power
provenance:
  method:
    confidence: estimated
    note: >-
      ESTIMATED. NO DIMENSIONED DRAWING EXISTS. The front is read off the one product photograph on page 1 of the RKPW081915 data sheet (a 400 x 400
      pixel image, taken nearly straight on but drawn about 1.4 times too wide for its height), so x is read as a fraction of the ear-to-ear length (ear tips at
      10 and 395 px, 483 mm) and y as a fraction of the face height (200 to 225 px, 42.7 mm). The body between the folds is taken as 440 mm, the figure
      the 8NS8-RACK-MOUNT-PDU guide's diagram gives for the same maker's 1U strip. Every front position is good to about 3 mm, except the logo and model text (about 10 mm). THE REAR IS NOT SHOWN: the outlet
      row and the cord are placed from the data sheet's counts, at the pitch the 8NS8-RACK-MOUNT-PDU guide's rear diagram gives, and are an estimate.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - RKPW081915 data sheet, page 2: "Product Length 19.0 in [48.3 cm]", "Product Width 3.8 in [95.5 mm]", "Product Height 1.7 in [42.7 mm]",
      "Weight of Product 4.3 lb [2.0 kg]", "Color Black", "Material Steel", "Form Factor Horizontal". The height is 42.7 where the other two
      StarTech 1U strips give 44. The width is read as the depth of a horizontal unit.
  front:
    confidence: photo-measured
    note: >-
      photo-measured - millimetres from the body's left edge and its top, read off the photograph. SURGE lamp at 76.5 across and GROUND lamp at 97.8, both 19.4 down, their
      legends 8.8 down. Rocker centre at 421.2 across, 22.9 down; logo at 379.8 across. The lamp colours (#e5392e, #3ddc3a) and the rocker's red (#d0212b) are STAND-INS read by eye from the photograph; no pixel count was taken. The logo and model text are good to about 10 mm across (the photograph reads about 387 to 391 mm across for the logo's centre; the drawing keeps 379.8).
  rear:
    confidence: estimated
    note: >-
      estimated - no document shows the rear. The data sheet gives "Number of Power Outlets 8" and "8 NEMA 5-15 outlets" and the front photograph shows none, so
      they are placed on the rear. Centres 30.6 across then every 38.8 mm, 22.2 down (the outlet row of the 8NS8-RACK-MOUNT-PDU's rear diagram); the cord relief centre at 413.0 across, 23.7 down, borrowed from that unit's placement (its guide's rear figure reads nearer 20 to 21 mm down; an estimate, good to about 3 mm).
  outlets:
    confidence: datasheet
    note: >-
      datasheet - data sheet, page 1 and 2: "eight 120V 15A power ports/outlets", "Number of Power Outlets 8", "Connector 2 (Quantity) 8, NEMA 5-15 (125V AC, 15A)".
      std/nema-5-15r@1 is the library's 5-15R face, borrowed from the 5-20R.
  input:
    confidence: datasheet
    note: >-
      datasheet - "Cable Length 6.0 ft [1.8 m]", "Connector 1 NEMA 5-15 (125V AC, 15A)", "Input Voltage 120 AC", "Regulatory Derated Input Current (North America)
      12A", "Maximum Total Current 15A".
  indicators:
    confidence: datasheet
    note: >-
      datasheet - "two LEDs to indicate proper ground and surge detection", "LED Indicators 1 - Ground, 1 - Surge". The photograph prints SURGE (a red lamp) and
      GROUND (a green lamp). Which lamp colour means which condition is not stated.
  switch:
    confidence: datasheet
    note: >-
      datasheet - "control the power state with an illuminated power/reset switch", "a built-in circuit breaker and reset switch". The photograph shows one red
      rocker at the right of the front, drawn with common/rocker-switch@1 tinted red. Whether this rocker is the power switch, the reset switch or the breaker is not stated.
