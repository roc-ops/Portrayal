format: 1
kind: device
name: cmduct1ux
version: 0.1.0
maturity: modelled
manufacturer: StarTech.com
model: CMDUCT1UX
description: >-
  1U horizontal finger duct, StarTech.com CMDUCT1UX: a black steel plate the full width of the
  rack carrying a duct 71.6 mm deep. A wall of fifteen fingers runs along its top and another
  along its bottom, and a removable cover latches across their tips. Three oval pass-through
  holes in the plate lead cables through to the other side.
profile: passive
provenance:
  ears:
    confidence: drawing
    note: >-
      drawing - `positions` states where the ears bolt, for the Rack Builder. The ears are the
      flat ends of the plate, and the duct stands out of the other face of it: the drawing's
      side view puts the plate at one end of the 71.60 and the cover at the other, and the
      datasheet says "Front Mount (Front Only)". So the plate is the ear plane, nothing stands
      behind the rail, and `at` is 71.6. This states a placement; no dimension changed.
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the whole duct stands in front of the rail, 71.6 mm, so the rear
      face of its rack unit stays free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S OWN DRAWING. StarTech.com publishes CMDUCT1UX_Diagram.pdf (third
      angle projection, "DO NOT SCALE", millimetres, uploaded 3/18/2025): a front, a rear, a
      side view and an isometric, with the dimensions 482.60, 435.00, 71.60, 44.00, 465.00,
      31.50, 13.00, 11.00 and "phi 6.50". The datasheet (cmduct1ux_datasheet.pdf) lists the same
      body as "Product Length 19.0 in [48.3 cm]", "Product Width 2.8 in [71.6 mm]" and "Product
      Height 1.7 in [44.0 mm]", and the quick-start guide (CMDUCT1UX_QSG.pdf) names the parts.
      The drawing is the one used where they differ; the reseller figures #1098 quotes (61 x
      482 x 47) are neither, and are not used. What the drawing does not dimension - the slot
      pitch and the pass-through holes - is scaled off it at 2.2 to 2.6 px/mm against its own
      dimensions, and is estimated.
  chassis:
    confidence: drawing
    note: >-
      drawing - 482.6 x 44.0 x 71.6. The plate is the whole width of the rack, its two ends the
      ears, so the face is drawn whole with its four slots (L43 stands down above 480 mm). The
      duct between the ears is 435.00. The datasheet's "Product Length 19.0 in" and "Width 2.8
      in" are the 482.6 and the 71.6; its "Height 1.7 in" is the 44.0.
  thickness:
    confidence: estimated
    note: >-
      estimated - no document states a gauge. 1.0 mm is taken for the plate, the walls and the
      cover; the side view draws them as thin sheet.
  weight:
    confidence: datasheet
    note: datasheet - "Weight of Product 25.7 oz [728.0 g]" (cmduct1ux_datasheet.pdf).
  front:
    confidence: drawing
    note: >-
      drawing - the duct from its open side: the cover over the duct and the plate behind it,
      the ear slots at the four corners. The cover ships fitted, as the datasheet and the
      quick-start guide picture it, and is a part that comes off (`cover-off`).
  rear:
    confidence: drawing
    note: >-
      drawing - the back of the plate, the view with the ear slots 465.00 apart and 31.50 apart
      and three oval holes between them. The data sheet calls them "pass-through holes at the
      back"; the quick-start guide's rear view labels them "Pass-through Holes". The holes are
      not dimensioned: scaled at 2.269 px/mm against the 465.00, three obrounds 100 by 25 mm on
      a 140 pitch, centred on the plate (estimated).
  top:
    confidence: drawing
    note: >-
      drawing - an elevation, rear at the top of the drawing: the plate, the finger wall with
      fifteen slots and the cover over the front 21.7 mm. The slots are 11.00 wide, the
      dimension the drawing gives; their pitch (27.84) is counted and scaled off it at 2.607
      px/mm against the 435.00 and is estimated. The drawing shows one wall in plan; the end
      view shows two, the quick-start guide says the fingers are "available along the length
      on both sides", and the datasheet "a series of fingers on either side". Both walls
      are therefore the same, so the bottom is the top again. "Either side" is read as the top
      and the bottom of the one open face, and not as two faces: the plate has no fingers
      and the cover is at one end only.
  left:
    confidence: drawing
    note: >-
      drawing - the end view: the plate at the rear, the two finger walls standing out of it
      and the cover's face and lips over their tips. The right is the same, turned round.
  guides:
    confidence: drawing
    note: >-
      drawing - the duct is the channel between the two finger walls, run across the rack, the
      435.00 between the ears and 42.0 clear between the walls; its finger gap is the 11.00 the
      drawing dimensions and its pitch the 27.84 estimated above.
  cover:
    confidence: datasheet
    note: >-
      datasheet - "a removable top cover that makes it easy to add or remove bundled cables
      quickly"; the quick-start guide says the cover "can be removed for installation or
      upgrades" and latches with four latches, one in each corner. It is drawn fitted in `base`
      and absent in `cover-off`.
  passes:
    confidence: estimated
    note: >-
      estimated - the three oval holes, 100 by 25 mm, scaled off the drawing's rear view. They
      lie under the cover, which is a lid, so they are declared where the cover can be taken
      off. The datasheet states no limit on the cable that fits; the maker's note "Power cables
      may not fit through the holes" is on CABLMANAGERH's datasheet only, not this one.
  capacity:
    confidence: estimated
    note: >-
      no document states a cable capacity: the datasheet, the drawing and the quick-start guide
      are silent, so none is stated and a gap says so.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material, colour, standard (EIA RS310-D) and what is in the box are the
      datasheet's; the quick-start guide lists four screws, four cage nuts and four washers,
      the datasheet two M6x15 and four M6x12 screws, four cage nuts and four plastic washers.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". The drawing is line work, so the shades are this library's
      render of black steel, the cover a little lighter than the duct.
attrs:
  physical:
    weight-kg: 0.728
    material: Steel
    color: Black
    mounting-hardware: M6 screws, M6 cage nuts and M6 plastic washers, four of each
  features:
    standards: EIA RS310-D
chassis:
  width: 482.6
  height: 44.0
  depth: 71.6
  ru: 1
  full-depth: false
  ears:
    positions:
      - {name: proud, at: 71.6, default: true}
  shell: sheet
  thickness: 1.0
  weight-kg: 0.728
  color: '#232527'
gaps:
  - what: cable-capacity
    reason: vendor-silent
    note: >-
      the datasheet, the drawing and the quick-start guide state no cable capacity, no fill and
      no cable count.
    wanted: a cable capacity table, or a stated fill, for the finger duct
  - what: cover-latches
    scope: [front, top, bottom, left, right]
    reason: needs-drawing
    note: >-
      the quick-start guide says each corner has a latch that keeps the cover in place, and the
      drawing marks a small tab at each end of the cover; no view dimensions a latch, and the
      format has no latch, so the cover is on or off.
    wanted: a drawing of a cover latch, fitted and released
  - what: cover-section
    scope: [front, top, bottom, left, right]
    reason: needs-drawing
    note: >-
      the drawing's end view shows the cover's edges notched where they meet the walls; no
      section is dimensioned and no gauge is stated, so the cover is drawn as a plate with two
      straight lips 1.0 mm thick (estimated).
    wanted: a section through the cover and a finger tip
