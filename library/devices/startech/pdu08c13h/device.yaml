name: pdu08c13h
version: 0.1.0
maturity: modelled
manufacturer: StarTech.com
model: PDU08C13H
description: >-
  StarTech.com PDU08C13H, a 1U horizontal basic rack PDU with eight IEC C13 outlets, single phase. It takes 16 A at 120 V or 20 A at 240 V.
  It has 3600 J surge protection and a resettable circuit breaker. A black steel box with a mounting bracket at each end. The front carries
  the eight C13 outlets in a row from the left and two round push buttons. At the right is an IEC C20 power inlet. The 10 ft C19 to NEMA 5-20P
  cord in the box is not part of the unit and is not drawn. No document shows the rear.
profile: power
provenance:
  method:
    confidence: estimated
    note: >-
      ESTIMATED. NO DIMENSIONED DRAWING AND NO STRAIGHT-ON PICTURE EXISTS. Every position is read off the one product photograph on page 1 of the
      PDU08C13H data sheet (a 400 x 400 pixel image, taken from the front left and above), so it is NOT orthographic: x is read as a fraction of the
      ear-to-ear length along the face (ear tips at 20 and 348 px, 484 mm) and corrected by eye for perspective, which spreads the nearer, right-hand side;
      y is read at the face's own scale. The outlets sit on a near-constant pitch, which supports one pitch across the row, but the two push
      buttons and the inlet lie in the stretched part of the view, and every position is good to about 10 mm across and 3 mm down.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - PDU08C13H data sheet, page 2: "Product Length 19.1 in [48.4 cm]", "Product Width 3.9 in [98.8 mm]", "Product Height 1.7 in
      [44.0 mm]", "Weight of Product 3.4 lb [1.5 kg]", "Color Black", "Material Steel", "Form Factor Horizontal". The length includes the
      brackets; the body between the folds is taken as 440 mm, the figure the 8NS8-RACK-MOUNT-PDU guide's diagram gives for the same
      maker's 1U strip (ESTIMATED for this model). The width is read as the depth of a horizontal unit.
  front:
    confidence: estimated
    note: >-
      estimated - millimetres from the body's left edge and its top, read off the photograph (see method). Outlet centres 17.7 across and every 40.0 mm to
      297.7, all 22.0 down; the two push buttons centre at 331.0 across, 15.0 and 30.0 down; the inlet centre at 403.0 across, 22.0 down. The turn of each outlet (270) and of the inlet is ESTIMATED: the photograph shows the faces too small to settle which way each is turned, and the data sheet does not say (gaps: orientation).
  outlets:
    confidence: datasheet
    note: >-
      datasheet - data sheet, page 1 and 2: "8 POWERFUL NEMA C13 OUTLETS", "Number of Power Outlets 8", "Connector 2 (Quantity) 8, IEC C13 Receptacle
      (250V AC, 10A)". The photograph shows all eight on the front; the data sheet does not say which face. The outlets are std/c13-outlet@1's size.
  input:
    confidence: datasheet
    note: >-
      datasheet - "Connector 1 IEC C20 (250V AC, 16A)", "C20 Power Cord Input", "Input Voltage 110V-240V AC", "Regulatory Derated Input Current (North
      America) 16A", "Maximum Total Current 20A", "Load cap. @ 120V/16A (1920VA) Load cap. @240V/20A (4800VA)". The sheet's own text calls the included cord both
      "C19 to NEMA5-20p" and the unit's input a C20; the inlet is a C20. The photograph shows the inlet at the right end of the front.
  breaker:
    confidence: datasheet
    note: >-
      datasheet - "Built-in resettable circuit breaker that acts as a surge protector or shields from unintentional overloads", "Surge Protection: 3600 Joules".
      The sheet does not say where the breaker is. The photograph shows two round chrome push buttons between the outlets and the inlet; they are drawn
      with common/breaker-push-reset@1 on that reading (gaps: breaker-buttons).
