gaps:
  - what: rear
    scope: [rear]
    reason: needs-photo
    note: >-
      no document shows the rear of this model: the data sheet has one photograph, of the front, and the manual is not held. All eight outlets and the inlet stand on
      the front in the photograph, so nothing is known to stand on the rear.
    wanted: a photograph of the rear, or the instruction manual.
  - what: orientation
    scope: [front]
    reason: needs-photo
    note: >-
      the outlets are drawn turned 270 and the C20 inlet as the library's part is turned, as `cyberpower/pdu30bhvt8r` and `eaton/pdumv20hvnetlx` place theirs. The photograph is too
      small to show which way each receptacle's earth pin points, so the turn is an estimate.
    wanted: a larger photograph of the front, or the instruction manual.
  - what: breaker-buttons
    scope: [front]
    reason: vendor-silent
    note: >-
      the photograph shows two round chrome push buttons between the outlets and the inlet and no label is legible. The data sheet names one "built-in resettable circuit
      breaker". Whether the two buttons are two breakers, or one breaker and one other control, is not stated.
    wanted: the instruction manual.
  - what: ear-positions
    scope: [front]
    reason: needs-drawing
    note: >-
      the data sheet gives no ear, bracket or hole dimension; it lists four M5 screws and four M5 cage nuts. The body width between the folds is an estimate.
    wanted: a dimensioned drawing.
  - what: sides
    scope: [top, bottom, left, right]
    reason: needs-photo
    note: >-
      the photograph sees the top, with a printed rating label, and the right end at a steep angle; nothing of either can be measured.
    wanted: straight-on photographs of the top, the bottom and an end, with a scale.
