format: 1
kind: device
name: nsc-t48s
version: 0.1.0
maturity: modelled
manufacturer: ZPE Systems
model: NSC-T48S
aliases:
- {name: Nodegrid Serial Console S, kind: marketing}
- {name: NSC-T48S-STND-DAC-B-SFP, kind: variant}
portfolio: {line: Nodegrid, family: Serial Console, series: Serial Console S}
description: >-
  48-port auto-sensing serial console server, 1RU, with 14 USB-A serial ports. The data sheet's
  Front carries HDMI, a USB-A port, two lamps and a reset button. It also has two fan modules
  and twelve USB-A ports in six stacked pairs. The Rear carries the 48 RJ45 serial ports in
  two rows of 24, in three blocks of eight columns, odd numbers above even. It also has two
  SFP cages, the console RJ45 with a USB-A port beneath it, and two AC inlets each with a
  rocker switch. Modelled as the dual-AC, SFP build, NSC-T48S-STND-DAC-B-SFP, the one the held
  photographs show.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Three documents and two photographs. ZPE Systems, Datasheet: Nodegrid Serial Console - S
      Series, April 15, 2026, page 2 (specifications, power), page 3 (interfaces, physical,
      ordering table, the Front and Rear figures); the same data sheet's page 1 (14 USB serial
      ports). ZPE Systems, Fixed Rail Mounting Kit For 4-Post Racks (RAIL-180-395), November 18,
      2024. Photographs from the maker's pages: the T48S front (T48S-4.jpg) and the T48S dual-AC
      rear with SFP (T48S-DAC-SFP-2.jpg), each 1024 px wide. No installation guide, drawing,
      CAD model or stencil is held.
  face-names:
    confidence: datasheet
    note: >-
      THE DATA SHEET'S WORDS ARE KEPT. Page 3 captions the face with HDMI, one USB-A port, three
      lamps and the fan modules "Front", and the face with the 48 RJ45 ports, the inlets and the
      SFP cages "Rear". The ports are on the Rear, as on the maker's other serial consoles.
  size:
    confidence: datasheet
    note: >-
      Page 3, "Size (L X W X H): 443 X 312 X 43 mm", 1U. The labels read length, width, height,
      and 443 is plainly the body's width and 312 its depth; the maker's Serial Console R
      ear drawing agrees on 312.0 and 43. 443 is the body between the ears: the photographs show no
      ears. Weight 4.9 kg, "depending on options".
  scale:
    confidence: photo-measured
    note: >-
      EVERY POSITION IS READ OFF A 1024 PX PHOTOGRAPH, and the face is 857 px wide in each, so
      about 1.93 px per mm and a reading good to about 0.5 mm in the best case and 1 mm in
      most. The photographs are slightly off square: the rear's RJ45 pitch reads 14.16 mm
      (27.4 px) where the registry's ganged-jack pitch is 13.97. The registry value is used in
      the block and the block starts and gutters are fitted to the measured block edges, so
      the sum agrees with the photograph to 1 mm and the interior of a block to half a column.
  serial-ports:
    confidence: photo-measured
    note: >-
      Rear photograph and data sheet page 3: 48 RJ45 serial ports, numbered 1 to 48, odd above
      even, the numeral printed above the top row and below the bottom row, in three blocks of
      eight columns, with a printed gap between blocks (230.5 px, or 119.2 mm, from one block start to the
      next; eight pitches are 111.8 mm, so the gutter is 7.4). Each jack shows a yellow and a green lamp
      in its corners. The photograph does not name what the lamps mean and the data sheet has no LED
      table, so the lamps are drawn as the lamped jack part gives them and no meaning is stated.
  usb:
    confidence: datasheet
    note: >-
      Data sheet page 3: "1X USB 3.0 Host & 13 USB 2.0 Hosts on Type A connector", and page 1
      "14X USB serial ports". The photographs show one blue USB-A on the Rear (USB 3.0, by the
      blue tongue), and on the Front one lone USB-A and twelve in six stacked pairs: 13 white
      ports, the 13 USB 2.0. The datasheet does not say which port is the 3.0 one; the colour
      is the reading, and the stacked pairs' own numbering is not printed.
  power:
    confidence: datasheet
    note: >-
      Page 2: "Power consumption 45 W typical", "Single or Dual AC: 100-240 VAC, 50/60 Hz",
      "40V-63 VDC dual power input (redundant)". The Rear photograph's inlets are two IEC C14,
      turned a quarter turn (earth pin to the left), each with a rocker switch above it. The data
      sheet states no maximum draw and no fuse or current rating.
  gate-1:
    confidence: photo-measured
    note: >-
      Both photographs pass at low resolution: the front 854 px for 443 mm, 84 px tall for 43,
      aspect 10.2 against 10.3; the rear 857 by 84 px, 10.2. They show perspective at the edges. The
      Rear's SFP pair steps 15.1 mm and the registry says 15.0, which is the cross-check used.
  fans:
    confidence: photo-measured
    note: >-
      Two fan modules on the Front, in both photographs (the T48S photograph and the data sheet's
      Front figure). The data sheet's ordering table says "Fanless" on both SKU rows and "z-Fan
      Configuration" on the SFP row; the photograph and the Front figure show the fans. The
      two modules are drawn seated and the disagreement is a gap. Their size is read off the photograph.
  colour:
    confidence: photo-measured
    note: >-
      The face is the median of bare plate in each photograph, #44606c (front) and #44606b
      (rear), a slate blue-grey. Lettering is white.
  console-usb-bezel:
    confidence: photo-measured
    note: >-
      The console RJ45 and the USB-A port beneath it sit in one bright metal frame, 16.7 by 21.0 mm.
      The jack's lamps are at its top, so the jack is turned 180 as the top row of the serial block is.
