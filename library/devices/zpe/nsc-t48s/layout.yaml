gaps:
- what: rack-ears
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    The rack ears and their positions. The data sheet says only "Front-Rear mounting brackets",
    and the rail kit sheet that "This kit replaces the Rack Mount Ears that are provided with each
    unit". No S document dimensions an ear or says where it bolts. The R data sheet's page 4
    drawing is another model's. The rear photograph on the rail sheet shows the ears folded
    back at the Rear, not measurable. `chassis.ears` is left out.
- what: other-skus
  scope: [front, rear]
  reason: needs-photo
  wanted: >-
    A Rear photograph of the single-AC and dual-DC builds and of the builds without SFP (two RJ45
    Ethernet, ETH0 and ETH1, are named by the maker's text and drawn by no held figure). The 16 and
    32-port builds have no photograph at all. The device is modelled as the one build the photographs show,
    and each other build is a configuration to add when its face is held.
- what: fanless-or-fans
  scope: [front]
  reason: sources-disagree
  wanted: >-
    The data sheet's ordering rows say "Fanless", the SFP row also "z-Fan Configuration", and the
    Front figure and the photograph show two fan modules. Which builds carry the modules, and whether they can
    be absent, is not stated.
- what: dots-above-columns
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    A small black dot is printed or set above and left of each odd-numbered column, 24 in all. The
    photograph is too small to say if it is a lamp, a hole or a mark, and no document names it.
    Drawn as a dot of decor, with no meaning.
- what: jack-lamps
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    What the yellow and the green lamp of each serial jack and of the console jack show. The data sheet has
    no LED table; no guide is held.
- what: front-lamps-and-reset
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The colours and meaning of PWR and SYS, and the reset button's behaviour. The Front figure
    prints the legends PWR, SYS and RST and nothing else.
- what: screw-above-hdmi
  scope: [front]
  reason: vendor-silent
  wanted: >-
    A cross-head screw stands above the HDMI port. It is drawn as a screw head; no document names it.
- what: usb-numbering
  scope: [front]
  reason: vendor-silent
  wanted: >-
    How the 13 USB-A ports on the Front are numbered, which is the data sheet's "USB serial
    ports". No numeral is printed; the ports are counted in reading order, left to right, upper
    before lower.
- what: usb-orientation
  scope: [front]
  reason: needs-photo
  wanted: >-
    Which way the lower USB-A port of each stacked pair faces. The photograph's lower ports look
    flipped; at 165 px tall it cannot be settled, so all twelve are drawn alike.
- what: sides-and-top
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    Any photograph or drawing of the lid, the base and the sides. None is held.
