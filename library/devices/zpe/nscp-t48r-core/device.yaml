format: 1
kind: device
name: nscp-t48r-core
version: 0.1.0
maturity: modelled
manufacturer: ZPE Systems
model: NSCP-T48R-CORE
aliases:
- {name: Nodegrid Serial Console Plus - Core Edition, kind: marketing}
- {name: NSCP-T48R-CORE-DAC, kind: variant}
portfolio: {line: Nodegrid, family: Serial Console, series: Serial Console Plus Core Edition}
description: >-
  48-port serial console server, 1RU. The Front is a blank plate carrying two stacked USB-A ports, the
  console RJ45 and the SYS and PWR lamps. The Rear carries the 48 RJ45 serial ports in two rows of 24,
  in three blocks of eight columns, odd numbers above even. It also has two Ethernet RJ45 ports, two SFP
  cages and two AC inlets each with a rocker switch. Modelled as the dual-AC build with no 5G or analog-modem
  option, NSCP-T48R-CORE-DAC, the one the data sheet shows.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      One document and one photograph. ZPE Systems, Nodegrid Serial Console Plus - Core Edition data sheet,
      June 19, 2025, page 1 (the pictures "Front" and "Back"), page 2 (interfaces, physical, power) and
      pages 3 and 4 (the ordering table). Photograph from the maker's pages: the Core Edition Front (NSCP-CE-Front-Side-1.webp),
      1010 px wide, the same picture the data sheet prints on page 1. The Rear is the data sheet's own
      picture on page 1, 1010 px wide. No installation guide, drawing or CAD model is held.
  face-names:
    confidence: datasheet
    note: >-
      THE DATA SHEET'S WORDS ARE KEPT. Page 1 captions the plate with the console and the USB ports "Front"
      and the face with the 48 RJ45 ports "Back"; the device calls the second the Rear, as the maker's
      other serial consoles do.
  size:
    confidence: datasheet
    note: >-
      Page 2, "Size (L x W x H): 443 x 312 x 43 mm", 1U. 443 is the body's width and 312 its depth. Weight
      5.265 kg, "depending on options".
  scale:
    confidence: photo-measured
    note: >-
      EVERY POSITION IS READ OFF A 1010 PX PICTURE, whose face is 1008 px wide, about 2.28 px per mm horizontally
      and about 2.1 px per mm vertically (the pictures are slightly off square), good to about 2 mm. The
      Rear's serial block is placed as the Rear of nsc-t48s places its block, which the picture agrees
      with to about 2 mm. The Ethernet pair, the SFP pair and the Front's parts are read off the pictures.
  serial-ports:
    confidence: photo-measured
    note: >-
      Rear picture and data sheet page 2: 48 RJ45 serial ports, numbered 1 to 48, odd above even, the
      numeral above the top row and below the bottom row, in three blocks of eight columns; "Cisco Rolled"
      in the ordering table.
  usb:
    confidence: datasheet
    note: >-
      Page 2, "2X USB 3.0 Host on Type A connector". The Front picture shows two USB-A ports stacked at
      its left end, each with a blue tongue, with USB printed above and beneath them.
  power:
    confidence: datasheet
    note: >-
      Page 2: "Dual AC: 100-240 VAC, 50/60 Hz", "40V-63 VDC dual power input (redundant)", "Power consumption
      45 W typical". The Rear picture's inlets are two IEC C14, each with a rocker switch above it. No
      maximum draw, fuse or current rating is stated.
  colour:
    confidence: photo-measured
    note: >-
      The Rear is the median of bare plate along the lower edge of the data sheet's picture, #454d63.
      The Front picture reads #131c34, a much darker navy: one chassis is drawn in one colour, the Rear's,
      and the difference is the pictures' lighting or a darker front plate, which no document says.
attrs:
  physical: {weight-kg: 5.265, weight-note: '5.265 kg (11.6 lb), depending on options', shipping-weight-kg: 8.745,
    shipping-dimensions-mm: 533 x 497 x 209}
  performance: {serial-ports-max: 48, serial-rate: 'RS-232 on RJ45, 230,400 bps max per port'}
  power: {power-typical-w: 45, power-input-ac: '100-240 VAC, 50/60 Hz', power-input-dc: '40-63 VDC dual
      (redundant) input, on the DC builds'}
  environmental: {operating-temp: '0 to 60 C (32 to 140 F), 5-95% RH, non-condensing', storage-temp: '-20
      to 67 C (-4 to 153 F), 5-95% RH, non-condensing'}
  platform: {processor: Intel x86_64 quad-core, memory: 4GB DDR4, storage: 32GB SSD}
  features: {optics-sfp-plus: 'SFP+ cages, 10Gb'}
  lifecycle: {eol: none-announced}
chassis: {width: 443, height: 43, depth: 312, ru: 1, weight-kg: 5.265, color: '#454d63', power: ac}
gaps:
- what: hdmi
  scope:
  - front
  - rear
  reason: sources-disagree
  wanted: >-
    The ordering rows say "1 HDMI" and the interface list on page 2 does not. The Front picture shows
    no HDMI port and the Rear picture shows none, so none is drawn and no face is said to carry it.
- what: other-skus
  scope:
  - front
  - rear
  reason: needs-photo
  wanted: >-
    A Rear photograph of the single-AC and dual-DC builds, of the 5G and analog-modem builds (-5G, -AM),
    where their antenna connectors, SIM slots and telephone jack stand, and of the 16 and 32-port builds.
    The device is modelled as the one build the pictures show.
- what: front-round-caps
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    Two round dark features stand at the Front's two ends, 12 mm across, and a small dark ring stands
    beneath the left one. No document names them; they are drawn as decor.
- what: reset-and-lamp-meaning
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The Front prints SYS, PWR and RST. The picture shows the two lamps and no separate reset opening,
    so no reset button is drawn. The lamps' colours and meaning are not held.
- what: rack-ears
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    The data sheet says only "Front-Rear Mounting Brackets". No Core Edition document dimensions an ear
    or says where it bolts, so `chassis.ears` is left out.
- what: jack-lamps
  scope:
  - rear
  - front
  reason: vendor-silent
  wanted: >-
    What the lamps of each serial jack and of the console jack show. The data sheet has no LED table;
    no guide is held.
- what: ethernet-and-sfp-lamps
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    The Ethernet jacks and the SFP cages show no lamp at the picture's size; the parts' own lamp windows
    are drawn as the parts give them, with no meaning stated.
- what: sides-and-top
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: Any photograph or drawing of the lid, the base and the sides. None is held.
