gaps:
- what: hdmi
  scope: [front, rear]
  reason: sources-disagree
  wanted: >-
    The ordering rows say "1 HDMI" and the interface list on page 2 does not. The Front picture
    shows no HDMI port and the Rear picture shows none, so none is drawn and no face is said to
    carry it.
- what: other-skus
  scope: [front, rear]
  reason: needs-photo
  wanted: >-
    A Rear photograph of the single-AC and dual-DC builds, of the 5G and analog-modem builds (-5G,
    -AM), where their antenna connectors, SIM slots and telephone jack stand, and of the 16 and
    32-port builds. The device is modelled as the one build the pictures show.
- what: front-round-caps
  scope: [front]
  reason: vendor-silent
  wanted: >-
    Two round dark features stand at the Front's two ends, 12 mm across, and a small dark ring
    stands beneath the left one. No document names them; they are drawn as decor.
- what: reset-and-lamp-meaning
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The Front prints SYS, PWR and RST. The picture shows the two lamps and no separate reset
    opening, so no reset button is drawn. The lamps' colours and meaning are not held.
- what: rack-ears
  scope: [front, rear]
  reason: vendor-silent
  wanted: >-
    The data sheet says only "Front-Rear Mounting Brackets". No Core Edition document dimensions
    an ear or says where it bolts, so `chassis.ears` is left out.
- what: jack-lamps
  scope: [rear, front]
  reason: vendor-silent
  wanted: >-
    What the lamps of each serial jack and of the console jack show. The data sheet has no LED
    table; no guide is held.
- what: ethernet-and-sfp-lamps
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    The Ethernet jacks and the SFP cages show no lamp at the picture's size; the parts' own lamp
    windows are drawn as the parts give them, with no meaning stated.
- what: sides-and-top
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    Any photograph or drawing of the lid, the base and the sides. None is held.
