  depth: 212
  ru: 1
  color: '#d2d4d7'
  airflow: passive
  silk: '#2f3a66'
gaps:
- what: width-sources-disagree
  scope: [front, rear, top, bottom]
  reason: sources-disagree
  note: >-
    The data sheet gives 443 wide and the manual 436 "without mounting brackets". Both
    of the face's own images measure 443 x 44 to about 1% and 436 x 44 to 2-3%, so the
    faces are drawn 443. The reconciliation - a front plate a little wider than the body
    - is read from one three-quarter render, not measured.
  wanted: >-
    a mechanical drawing of the chassis, or a ruler across a real unit's front and
    across its sides.
- what: side-detail
  scope: [left, right, top, bottom]
  reason: needs-photo
  note: >-
    The product-page three-quarter render shows each flank with two fields of round vent
    holes and three pairs of screws, two of them the bracket positions the manual
    describes; it is at an angle that measures none of it. The top and bottom are shown
    by nothing. These four views carry the envelope only.
  wanted: a square-on photograph of one flank and of the lid.
- what: blank-plates
  scope: [lc-1, psu-1, psu-2]
  reason: needs-photo
  note: >-
    Manual p46 - blank plates "must be installed in unused PSU or expansion slots",
    each with a captive thumbscrew on the right. No image of either blank is held. The
    expansion-slot blank is modelled from that text alone (oscilloquartz/osa542x-lc-blank@1,
    art estimated); the PSU blank is not modelled, so a pulled supply draws as its opening.
  wanted: a photograph or drawing of the expansion-slot and PSU blank plates.
- what: optical-irig-connector
  scope: [lc-1]
  reason: vendor-silent
  note: >-
    The IRIG-B card's optical output is a round barrel 7.4 across in a 375 px render;
    no document names the connector type.
  wanted: the IRIG-B card's own data sheet or a newer install manual.
- what: card-and-psu-part-numbers
  scope: [psu-1, psu-2, lc-1]
  reason: vendor-silent
  note: >-
    The manual gives part numbers for the BTOH-16, CPOH-16 and PTOH-16 and defers the
    PSUs, the GE-4S and everything else to the OSA 5420/5421 System Description, which
    is not held. The IRIG-B card postdates the manual.
  wanted: the OSA 5420/5421 System Description.
groups:
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        data sheet - "Hot-swappable redundant PSU"; manual p43 - both supplies in one
        chassis must be of the same capacity.
    description: two hot-swappable supplies, AC or DC, 90 W each on the OSA 5421.
  lc-slots:
    term: Slot
    role: traffic
    index-origin: 1
    description: >-
      the one expansion slot, LC1 as the face prints it. It takes one timing fan-out
      card - 16x BITS, 16x CLK/PPS, 16x PPS+ToD, 4x 1G or IRIG - and is
      hot-insertable (data sheet).
  eth-copper:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: >-
      the electrical halves of the two combo ports, NET-1 and ACCESS-1, 100/1000BaseT.
      Each is one interface with the cage of the same name in `sfp`; only one of the
      pair is used at a time (manual p13).
  sfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
    description: >-
      four 100/1000BaseX cages, NET-1, ACCESS-1, NET-2 and ACCESS-2, hardware
      timestamping for PTP and NTP and Sync-E on each. NET-1 and ACCESS-1 are the
      optical halves of the combo ports whose copper halves are in `eth-copper`.
  sfp-leds:
    term: LED
    role: indicator
    index-origin: 1
  timing:
    term: Port
    role: traffic
    index-origin: 1
    mixed: >-
      the onboard synchronisation interfaces, which are the work a grandmaster is bought
      to do: BITS IN and BITS OUT (E1, T1 or 2.048 MHz, RJ-48c), ToD+PPS (RS-422 on
      RJ-45), CLK IN and CLK (10 MHz, SMA), PPS IN and PPS (SMA), and the GNSS antenna
      input (SMA, +5 VDC to the antenna). Three connector families in one block because
      the manual's Table 1 lists them as one Synchronization section.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the local management interfaces: MGMT LAN (10/100BaseT), the RS-232 console on
      RJ-45, and the USB port the manual reserves for a 3G modem.
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
  grounding:
    term: Ground
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
