configurations:
  base:
    kind: base
    default: true
    source: >-
      derived - both supplies populated (AC) and the expansion slot blanked, since the
      cards are ordered separately and the manual requires a blank in an unused slot.
    description: >-
      The OSA 5421 Rubidium with two 90 W AC supplies and a blank plate in LC1,
      which is how the manual (p46) says an unused slot must be left. The blank's art is
      estimated (see the blank-plates gap).
    bays:
      lc-1: oscilloquartz/osa542x-lc-blank@1
  dc-power:
    kind: orderable
    description: >-
      Both supplies DC (-48 to -60 VDC). The two supply slots take either type, and the
      manual asks only that both be of the same capacity.
    bays:
      psu-1: oscilloquartz/osa542x-psu-dc-90w@1
      psu-2: oscilloquartz/osa542x-psu-dc-90w@1
      lc-1: oscilloquartz/osa542x-lc-blank@1
  manual-figure-6:
    kind: example
    description: >-
      As the manual's Figure 6 draws the OSA 5421 Rubidium - a DC supply in PSU1, an AC
      supply in PSU2, and a BITS-OUT HD (BTOH-16) card in LC1. Illustrative.
    bays:
      psu-1: oscilloquartz/osa542x-psu-dc-90w@1
      psu-2: oscilloquartz/osa542x-psu-ac-90w@1
      lc-1: oscilloquartz/btoh-16@1
