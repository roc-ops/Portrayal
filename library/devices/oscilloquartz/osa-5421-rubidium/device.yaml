format: 1
kind: device
name: osa-5421-rubidium
version: 0.1.2
maturity: modelled
manufacturer: Oscilloquartz
model: OSA 5421 Rubidium
portfolio:
  family: PTP grandmaster
  series: OSA 5420 Series (edgeSync+)
description: >-
  Compact 1RU PTP grandmaster, boundary clock, NTP server and GNSS receiver with a
  a rubidium oscillator (Stratum 2 / G.812 Type II). Fanless. Everything is on the front:
  two hot-swappable AC or DC supplies, one expansion slot for a timing fan-out card,
  four 1G Ethernet ports (two of them combo RJ-45/SFP), BITS, ToD, clock and PPS I/O,
  and the GNSS antenna input.
profile: networking
provenance:
  model:
    confidence: datasheet
    note: >-
      data sheet - 2023 OSA 5420 Series, Product variants: "OSA 5421 rubidium", Rubidium, 1 expansion line card, hot-swappable
      redundant PSU. The manual's Figure 6 is captioned "OSA 5421 Rubidium" and its label strip
      prints "OSA 5421" over "RUBIDIUM".
  sources:
    confidence: datasheet
    note: >-
      FOUR DOCUMENTS, EACH FOR ITS OWN QUESTION. The 2023 OSA 5420 Series data sheet (8 pp,
      Adtran) for dimensions, weight, power per variant and the interface inventory, and
      its p1 front render (1462 x 226 px) for the front face. The OSA 5420/5421
      Installation and Commissioning Manual R9.5.1 Issue A, doc 80000045125 (2017, 98 pp)
      for the chassis text, the front connector table, the LED tables, the variant fronts
      (Figures 3-6), the expansion cards and the rear (p42 Figure 8). The 2015 and 2016
      data sheets and the manufacturer's product-page renders for corroboration only.
  chassis:
    confidence: datasheet
    note: >-
      THE FRONT IS 443 WIDE, AND THE MANUAL SAYS 436. The data sheet (2023): "443mm x
      44mm x 219mm / 17.44 x 1.73 x 8.62 in (W x H x D), ETSI-compliant", weight 3.2 kg.
      The manual (p11): width "without mounting brackets" 436, height 44, depth "without
      IEC and optical connectors" 212, weight "approximately 3 kg". Two independent
      measurements settle the face: the data sheet's front render is 1440.5 x 142.5 px
      between its edge lines, aspect 10.11 against 10.07 for 443 x 44 (0.4%) and 9.91
      for 436 x 44 (2.0%); and the manual's own rear drawing (p42 Figure 8), a line
      drawing from a different source, is 1043 x 102.5 px, 10.18 (1.1% and 2.7%). The
      product-page three-quarter render shows the front plate standing a little proud of
      the side walls, which is where a 436 body and a 443 front can both be true. So the
      faces are 443 x 44 and the body depth is the manual's 212: the data sheet's 219 is
      the same box with its connectors, by the manual's own scoping. The disagreement is
      also filed under `gaps:`.
  front-layout:
    confidence: photo-measured
    note: >-
      photo-measured - 2023 data sheet p1 render at 3.252 px/mm across (1440.5 px for
      443) and 3.239 down (142.5 px for 44), which agree to 0.4%. Every position on the
      front is off that render. Two checks against things of known size: the IRIG-B
      card's D-sub shell reads 16.2 against the 16.30 of TE C-747905, and the four SFP
      cages repeat on a 17.9 pitch. The manual's Figures 3-6 are schematic (their pixel
      aspect is about 16% taller than the face's) and were used for arrangement only - which card
      sits in which slot, what the 5421 has where the 5420's second slot is.
  variant-face:
    confidence: borrowed
    note: >-
      borrowed - osa-5420-quartz, whose front was measured off the 2023 data sheet's
      render. NO RENDER OF THIS MODEL'S FRONT PASSES GATE 1: the manual's Figure 6 is the
      only straight view of it, 742 px across and schematic in aspect, and it shows the
      same face as the OSA 5420 Quartz's Figure 3 - supplies, management pair, ports,
      timing jacks and SMAs in the same places - with ONE expansion slot, and plain metal where the OSA 5420's second slot is. The label strip is the
      difference and it reads "OSA 5421" over "RUBIDIUM". So every position is the
      Quartz's, and the strip's second line is this model's.
  psu-bays:
    confidence: photo-measured
    note: >-
      photo-measured, same render. The two supply plates start at x 7.9 and 93.2 (pitch
      85.3), each 71.8 x 35.0 from y 6.55, with the thumbscrew tab running on to 81.0
      and 1.0 below. The bays take the whole 81 x 36 envelope because a bay is a
      rectangle; see oscilloquartz/osa542x-psu-ac-40w@1 for the notch. Manual p43: the
      two left-most rectangular slots, stencilled PSU1 and PSU2. PSU1 in the data sheet
      render is the DC module and PSU2 the AC; in the manual's Figures 3-6 likewise.
  psu-rating:
    confidence: datasheet
    note: >-
      manual p43 - "The OSA 5420 uses 40 Watt AC/DC PSUs, and the OSA 5421 requires 90 Watt
      AC/DC PSUs", and both supplies in one chassis must match. So this chassis accepts
      only the 90 W modules.
  lc-bays:
    confidence: borrowed
    note: >-
      borrowed - osa-5420-quartz's LC1, at 194.9-308.4 x 2.8-23.4 with the vertical "L C 1"
      legend in the gap to its left. Manual p11: the OSA 5421 has "one expansion slot", and
      p47 "One slot is available in the OSA 5421 and two slots are available in the OSA
      5420". The manual's Figure 6 draws that slot where the OSA 5420's LC1 is, a
      BITS-OUT HD card in it, and plain metal with no legend across the OSA 5420's LC2.
  front-ports:
    confidence: photo-measured
    note: >-
      manual Table 1, "OSA 542x Front Panel Connectors (Left to Right)", for what each
      opening is; the render for where. Left to right after the supplies: MGMT LAN over
      RS-232 (RJ-45, stacked), the STA lamp and the USB port (3G modem), NET-1 and
      ACCESS-1 copper RJ-45 in one shell, four SFP cages NET-1, ACCESS-1, NET-2,
      ACCESS-2 each with a lamp above, BITS IN, BITS OUT and ToD (RJ-45) in one shell,
      then five SMA jacks CLK IN, PPS IN, CLK, PPS, GNSS. Jack centres: 182.05 for the
      stacked pair (rows 19.9 and 33.25), 226.1 and 242.9 for the copper pair, 261.6,
      279.5, 297.4 and 315.1 for the cages, 336.8, 353.6 and 370.4 for the timing
      jacks, and 384.8 to 432.7 on a 12.0 pitch for the SMAs.
  combo-ports:
    confidence: datasheet
    note: >-
      manual p13 - NET-1/NET-2 "operate in optical mode (1000BaseX) via SFP or electrical
      mode (100/1000BaseT) via RJ45", and ACCESS-1/ACCESS-2 the same, with one electrical
      jack each for NET and ACCESS; the data sheet says "Two combo 100/1000BaseT or
      100/1000BaseX (SFP) ports. Two additional 100/1000BaseX (SFP) ports". So NET-1 and
      ACCESS-1 each appear TWICE on the face, as a copper jack and as a cage, and only one
      of each pair is used at a time. They are drawn as the two receptacles they are, and
      the groups say which pairs are one interface.
  jack-orientation:
    confidence: photo-measured
    note: >-
      photo-measured and manual. The render shows the lamp windows of MGMT LAN at the TOP
      of the jack and those of every other RJ-45 at the bottom; the manual's Table 3 draws
      the management port's two lamps at the top and Table 5 the access/network jacks'
      at the bottom. common/rj45-eth@1 carries its lamps at the bottom unrotated, so MGMT
      LAN is rotated 180 and the rest are not. RS-232, BITS and ToD are bare jacks (no link
      lamps; L76 and the RJ45 family design), and the render's lighter corners on them are
      the shield, not lamps.
  lamps:
    confidence: datasheet
    note: >-
      manual - Table 2 (STA and the PSU and expansion card lamps), Table 3 (the management
      LAN jack), Table 4 (the optical access port facility lamp), Tables 5 and 6 (the
      access and network copper jacks). The optical NETWORK ports are described in prose
      as having "two LEDs (Link and Rate)", but the render and every figure show ONE lamp
      per cage, as for the access ports; that lamp is drawn and its states are left
      generic, because the manual tables no single optical network lamp.
  shells:
    confidence: photo-measured
    note: >-
      photo-measured - the copper jacks sit in bright rectangular shells, one per group
      (the stacked management pair, the NET/ACCESS pair, the three timing jacks), and the
      USB in its own. Drawn as `port-shell` decor behind the jacks, per the pitfall that a
      dark jack on a bright face otherwise reads as floating.
  label-strip:
    confidence: photo-measured
    note: >-
      photo-measured on the Quartz's strip (see variant-face) - the blue strip at the top
      right reads "OSA 5421" over "RUBIDIUM" in white in the manual's Figure 6, with a
      blue rule running down the right edge of the face to y 41.7. Drawn as decor and
      silkscreen; the variant name is the chassis', not a module's.
  logos:
    confidence: photo-measured
    note: >-
      TWO MARKS ARE RESERVED, NOT DRAWN. The OSCILLOQUARTZ wordmark with its waveform above
      MGMT LAN (165.5-193.6 x 1.9-7.0) and the Syncjack badge under the label strip
      (426.9-436.2 x 12.8-23.8) are both trademarks set as artwork; each is a `regions`
      logo zone, per the library's rule that vendor logos are not reproduced.
  esd-sticker:
    confidence: photo-measured
    note: >-
      photo-measured - read at 10x, a black triangle with a yellow border carrying the
      IEC 61340-5-1 hand, "ESD" beneath it, at 165.4-173.1 x 15.1-23.6. It sits in PSU2's
      notch, the chassis metal above that supply's thumbscrew tab, which is inside the
      bay's rectangle; so it is a placement `for: psu-2` and paints over the supply.
  caution-mark:
    confidence: photo-measured
    note: >-
      photo-measured - a yellow general-warning triangle at 323.6-327.1 x 40.5-43.3 beside
      the ACCESS-2 legend, read at 10x as an exclamation mark, not a laser burst. Drawn
      with common/warning-triangle@1, which is 5.4 x 4.8 against the 3.5 x 2.8 printed:
      the library part is 60% larger than the mark and the placement centres it on the
      mark's centre x and sits it on the face's bottom edge.
  rear:
    confidence: drawing
    note: >-
      drawing - manual p42 Figure 8, "OSA 5420 / OSA 5421 Rear Panel Frame Ground Point",
      a line drawing at 2.354 px/mm across and 2.33 down (1043 x 102.5 px for 443 x 44).
      Drawn as the figure presents it, looking at the rear. From its left: a plain margin
      with one screw at x 6.2; a finned heatsink from x 9.1 to 213.9 on a 5.6 fin pitch,
      carrying six screws at x 44.4, 111.5 and 178.6 top and bottom; the earth terminal
      at (206.9, 7.7) with the earth symbol at 217.1 and a screw below it; a field of
      hexagonal perforations at 226.6-430.5 x 6.0-26.4; and a strip along the bottom
      right from y 31.5 carrying three screws at x 260.6, 341.3 and 422.5.
  earth:
    confidence: datasheet
    note: >-
      manual p41 - "An optional Earth (Frame Ground) connection may be attached to the Earth
      terminal point, located at the rear of the unit", with an M4x6 screw and a lock
      washer from the Earth Terminal Kit.
  cooling:
    confidence: datasheet
    note: >-
      manual p11 and p36 - "convection cooled (no fans or filters)", "designed for passive
      (fanless) air cooling". Units stack four high in a commercial-temperature
      environment and one high, with a rack unit free above and below, in an industrial one.
  ears:
    confidence: datasheet
    note: >-
      manual p38-40 - the rack brackets are a separate kit, part number 1013902002, screwed
      to the chassis sides with two countersunk M4 each: 19-inch standard, 19-inch
      extension (recessed), 23-inch standard, ETSI standard, ETSI extension and a wall
      bracket, each fitted flush or recessed. None is dimensioned in the manual, so no ear
      is drawn; the body stands alone, as it does on a desk.
  power:
    confidence: datasheet
    note: >-
      data sheet (2023) - "Power consumption (without LC or SFP; Vin=48V)": OSA 5421 Rubidium
      28W typical, 41W max. Recorded as the vendor's figure for the bare chassis;
      the expansion cards publish no figure anywhere in the corpus (L27 on each card is
      that record).
  environmental:
    confidence: datasheet
    note: >-
      data sheet (2023) - operating ambient for Rubidium -40 to +45 C, against -40 to +50
      (AC) and +65 (DC) for the quartz variants; storage -40 to +70 C (GR-63-CORE);
      humidity 5 to 100% with condensation.
attrs:
  physical:
    weight-kg: 3.2
    weight-note: data sheet 3.2 kg; the manual says approximately 3 kg
    overall-mm: 443 x 44 x 219 (data sheet, W x H x D, with connectors)
    body-mm: 436 x 44 x 212 (manual, without brackets and without connectors)
  performance:
    ptp-clients: up to 1024 unicast at 128 pps
    ntp-transactions: up to 8000 per second (NTP server without PTP/Syncjack)
    holdover-16ppb: more than 5 years (typical)
  power:
    power-typical-w: 28
    power-max-w: 41
    power-envelope: bare
    power-envelope-note: without line cards or SFPs, Vin 48 V (data sheet)
    psu-rating: 90 W AC or DC per module, two hot-swappable
    input-voltage: 100-240 VAC 47-63 Hz, or -48 to -60 VDC (tolerates -36 to -72)
  thermal:
    cooling: passive convection, no fans or filters
  environmental:
    operating-temp: -40 to +45 C
    storage-temp: -40 to +70 C
    humidity: 5 to 100 percent, with condensation
  platform:
    oscillator: rubidium, Stratum 2 / G.812 Type II
    oscillator-aging: +/-5e-12 per day after 30 days
    expansion-slots: 1
  features:
    gnss: GPS, GLONASS, BeiDou, Galileo; L1, 32 channels
    optics-sfp: 100/1000BaseX; SM/MM coloured or non-coloured SFP and copper SFP on every cage (data sheet); 1000BASE-SX/LX/ZX named for the network ports and 1000BASE-LX10/LH and BX10 for the access ports (manual p13)
    operation-modes: PTP grandmaster, boundary clock, slave, probe; NTP server; SSU; GNSS fan-out
    ptp-profiles: G.8265.1, G.8275.1, G.8275.2, enterprise, IEEE 1588 default, IEC/IEEE 61850-9-3, C37.238, SMPTE ST2059-2, AES67
    syncjack: clock and PTP probes, TE/TIE/MTIE monitoring
  management:
    local: RS-232 console on RJ-45, 10/100 management LAN on RJ-45
    protocols: CLI, SNMP v1/v2c/v3, Web GUI, Telnet, SSH, HTTP/HTTPS, RADIUS, TACACS+
  compliance:
    nebs: NEBS level 3 compliance
    safety: EN 60950-1, 21CFR1040.10, EN 60825
    emi: EN 55022 2010 Class A, EN 61000-3-2, EN 61000-3-3, EN 300 386, FCC Part 15 Class A, ICES-002 Class A
    regulatory: CE, RoHS
  lifecycle:
    eol: none-announced
