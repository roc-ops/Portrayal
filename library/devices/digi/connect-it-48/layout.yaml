format: 1
kind: device
name: connect-it-48
version: 1.0.0
maturity: draft
manufacturer: Digi
model: Connect IT 48
portfolio: {line: Console Servers, family: Connect IT, series: Connect IT 16/48}
description: >-
  Digi Connect IT 48 is a 1U rack-mount serial server (console server) with forty-eight RJ-45 RS-232
  serial ports and a console jack. It also has two 10/100/1000 Ethernet ports, two SFP+ cages and
  two USB 3.1 Gen 1 Type A ports. The front carries the console jack and the USB ports in one
  housing. The Ethernet jacks and the SFP+ cages are stacked in pairs. The forty-eight serial jacks
  are in two rows of three blocks. The rear carries two field-replaceable power supplies and a system
  fan. It also has the CORE module plate with two WWAN antenna openings, an SD slot, a reset pinhole
  and a column of status lamps. One power supply kit is mandatory, ITPS-PSEK (port-side exhaust) or
  ITPS-PSIK (port-side intake).
profile: networking
provenance:
  sources:
    confidence: photo-measured
    note: >-
      Digi Connect IT 16/48 product page (digi.com, read 2026-11-05): ports, lamps, power, size,
      weight and part numbers. The Connect IT 48 front photograph and the shared rear photograph
      (800 px wide each, straight on): every position, legend and colour below. No data sheet or
      user guide is held; the data sheet is behind a form on the maker's site and the user guide is
      a link to a document not held. No dimension model is held.
  chassis:
    confidence: datasheet
    note: >-
      The product page prints "444 mm x 300 mm x 44 mm (17.48 in x 11.81 in x 1.73 in)" labelled
      L x W x H, one row for both sizes. Read with the photographs and the 1U height, 444 is the
      width of the body between the ear folds, 300 the depth and 44 the height. The label's order
      does not say so, and no drawing confirms it.
  ears:
    confidence: photo-measured
    note: >-
      The front photograph shows a rack ear on each side, flush with the face and holding two
      slotted holes. The page says nothing of ears or a rail kit. No position other than the one
      photographed is stated, and no distance behind the face is measured.
  gate-1:
    confidence: photo-measured
    note: >-
      The front photograph spans 678 px for the 444 mm body between the ears (1.53 px/mm) and the
      rear 731 px for the 444 mm body (1.65 px/mm). The photographs include the top edge of the box,
      so across is read at the scale above and down is a fraction of the face's own height (44 mm)
      read off its top and bottom edges. Every position is good to about 2 mm.
  front-layout:
    confidence: photo-measured
    note: >-
      From the front photograph: two Ethernet jacks stacked at 24.1, two SFP+ cages stacked at 43.0,
      the console jack and two USB Type A ports in one housing centred at 69.4, and forty-eight serial
      jacks in two rows, the odd numbers below, in three blocks of eight columns from 83.85 on a 14.2
      pitch with 5.9 between the blocks (the blocks start 119.5 apart). The pitch was read off the
      numerals of the 16-port front, which has the same layout, and sits 1.6 per cent above the
      registry's 13.97. The last numeral stands 2 mm short of where this photograph puts it. The row
      of round vents along the top runs from 82 to 429 on a 4.15 pitch. The power and status lamps are
      at 19.0, 18.5 and 24.3 down; the round button below them is at 10.5, 34.3 down.
  rear-layout:
    confidence: photo-measured
    note: >-
      From the rear photograph, which both sizes share: the power supply bays are 94 wide at each
      end, the CORE plate 96 to 301, the system fan grille 40 across centred at 322.5, the SD slot
      and reset pinhole on a cover plate at 233.6, and five lamps at 295.5 from 13.3 down on a 5.2
      pitch. The two WWAN openings are centred at 116.3 and 208.0, 31.4 down, about 7 mm across.
  ports:
    confidence: datasheet
    note: >-
      The product page lists "(48) RS-232 serial RJ-45 (support standard or reversed mode)", "(1)
      RS-232 serial RJ-45 console port", "(2) 10/100/1000 Ethernet", "(2) 10 Gb capable SFP+
      sockets", "(2) USB 3.1 Gen 1 (Type A)" and an SD socket. The standard or reversed setting is
      a pinout setting and is not drawn.
  power:
    confidence: datasheet
    note: >-
      "Redundant 100-240 V ~ 50-60 Hz 2.4 A max for each power supply" and "POWER CONSUMPTION 39 W"
      for this size. The page does not say whether the figure is typical or maximum, so it is filed
      as the maximum. The mandatory kit supplies the two replaceable supplies.
  weight:
    confidence: datasheet
    note: >-
      "5.28 kg (11.65 lbs) with power supply kit installed" for this size.
  lamps:
    confidence: datasheet
    note: >-
      The page lists "Front: device power, status; (2) Ethernet (link/active) console (Tx/Rx); 16/48
      (Tx/Rx); Back: (2) PSU, status, WWAN signal/service". The rear photograph prints WWAN Signal,
      WWAN Service, PSU1, PSU2 and Status. Nothing states a colour or a state, so the system lamps
      carry on and off only.
  colour:
    confidence: photo-measured
    note: >-
      The front and rear are black, the jacks have bright metal shields, the USB tongues are blue,
      the rack ears are black and the thumbscrews have a blue ring.
attrs:
  physical:
    weight-kg: 5.28
  power:
    power-max-w: 39
    power-input: Redundant 100-240 V ~ 50-60 Hz 2.4 A max for each power supply
  environmental:
    operating-temp-c: 0 to 50
    humidity: 5% to 95% (non-condensing)
  platform:
    memory: 2GB RAM, 8GB flash
  features:
    optics-sfp-plus: >-
      product page: "(2) 10 Gb capable SFP+ sockets"; the page names no optic and none is included
  lifecycle: {eol: none-announced}
chassis:
  width: 444.0
  height: 44.0
  depth: 300.0
  ru: 1
  color: '#1f2226'
  power: ac
  ears:
    positions:
    - {name: flush, default: true}
gaps:
- what: side-top-bottom-faces
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: >-
    The held photographs show the front and the rear only. The four other faces are sized from the
    product page and drawn empty.
  wanted: A photograph or drawing of the sides, the top and the underside.
- what: rear-fittings
  scope: [rear]
  reason: needs-photo
  note: >-
    The rear photograph shows the two WWAN openings as plain dark circles. No document says what
    connector is behind them; SMA, the type the maker lists on the CORE plug-in modem of the Connect
    EZ 16/32, is drawn. The SD slot is the library's full-size SD slot, sized from another maker's photograph
    (the page lists "(1) SD/SDHC/SDXC socket" and no size). The system fan is drawn as a grille and a thumbscrew, not as a replaceable
    part, because no held document says it is one. The right-hand power supply's second thumbscrew,
    the PSU1 and PSU2 legends on the supplies' outer tabs, and the cover plate's small screws are
    not all drawn.
  wanted: Digi's hardware guide, or a close photograph of the rear.
- what: power-supply-kit
  scope: [rear]
  reason: needs-photo
  note: >-
    The page makes one of two kits mandatory, ITPS-PSEK (port-side exhaust) or ITPS-PSIK (port-side
    intake), and the rear photograph does not say which it shows. Both bays seat one supply part
    that states neither kit and no airflow.
  wanted: A photograph of each kit, or the hardware guide's description of the two.
- what: front-fittings
  scope: [front]
  reason: needs-photo
  note: >-
    The round button under the power and status lamps carries a symbol that does not resolve at
    800 px and no document names its function, so it is drawn as a plain button and not as a part.
    The marks under the Ethernet, SFP+ and USB housings (a number and an arrow each) do not resolve
    and are not drawn. The bright metal frame that joins the serial jacks of each block is not drawn.
  wanted: Digi's hardware guide, or a higher resolution photograph of the front.
- what: legend-text
  scope: [front, rear]
  reason: needs-photo
  note: >-
    The photographs are 800 px wide. The legends that resolve are drawn; the rating text beside the
    power supply inlets is drawn as it reads, and the small marks that do not resolve are not.
  wanted: A higher resolution photograph of each face.
- what: led-states
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    The page names the lamps and no colour or state of any of them.
  wanted: Digi's lamp table.
- what: rack-kit
  scope: [front]
  reason: vendor-silent
  note: >-
    The page lists no rail or mounting kit for the unit and no document held describes the rack ears.
  wanted: Digi's installation guide.
- what: power-draw
  scope: [rear]
  reason: vendor-silent
  note: >-
    The page gives one consumption figure for the unit and none for a supply, the fan or the CORE
    modem, so no module states one.
  wanted: The data sheet's per-module figures.
groups:
  serial:
    term: Port
    role: traffic
    index-origin: 1
    description: the forty-eight RJ-45 RS-232 serial ports, printed 1 to 48, the odd numbers in the lower row
  console:
    term: Port
    role: management
    index-origin: 1
    description: the RJ-45 RS-232 serial console
  eth:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the two 10/100/1000 Ethernet jacks, upper and lower
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: the two SFP+ cages, upper and lower
  usb:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-a, usb: '3.0'}
    description: the two USB 3.1 Gen 1 Type A ports
  sdcard:
    term: Slot
    role: management
    index-origin: 1
    description: the SD card slot on the rear
  antennas:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: coax-sma}
    description: the two WWAN antenna openings of the CORE module plate, printed WWAN1 and WWAN2
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the lamps, power and status on the front and WWAN Signal, WWAN Service, PSU1, PSU2 and Status on the rear
  psus:
    term: Bay
    role: service
    index-origin: 1
    description: the two power supply bays, PSU1 on the left of the rear and PSU2 on the right
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Digi Connect IT 16/48 product page: "dual power supply kit provides dual replaceable
        redundant internal power". It does not say whether the pair shares the load or one stands
        by, so 1+1 is read as one supply with one spare and the sharing is not stated.
  controls:
    term: Button
    role: management
    index-origin: 1
    description: the reset pinhole
