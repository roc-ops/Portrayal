format: 1
kind: device
name: connect-it-4
version: 1.0.1
maturity: draft
manufacturer: Digi
model: Connect IT 4
portfolio: {line: Console Servers, family: Connect IT, series: Connect IT 4}
description: >-
  Digi Connect IT 4 is a desktop serial server. It has four RJ-45 RS-232 serial ports and two RJ-45 10/100
  Ethernet ports, printed WAN and LAN. The front is a white plate with a row of status lamps: power, online
  and backup, LTE/3G, five signal strength lamps and two SIM lamps. The rear carries the DC power jack,
  an erase button, the WAN and LAN jacks, the four serial jacks and a SIM select button.
profile: networking
provenance:
  sources:
    confidence: photo-measured
    note: >-
      Digi Connect IT 4 product page (digi.com, read 2026-11-05): ports, lamps, power, size and weight.
      The Connect IT 4 front photograph and rear photograph (800 px wide each, straight on): every position,
      legend and colour below. No data sheet or user guide is held; the data sheet is behind a form on
      the maker's site and the user guide is a link to a document not held.
  chassis:
    confidence: datasheet
    note: >-
      The product page prints "228 mm x 127 mm x 25 mm (9.0 in x 5.0 in x 1.0 in)" labelled L x W x H.
      Read with the photographs, 228 is the width of the faces, 127 the depth and 25 the height.
  gate-1:
    confidence: photo-measured
    note: >-
      The front photograph spans 713 px for the 228 mm width (3.13 px/mm) and the rear 727 px (3.19 px/mm);
      the two differ by 2 per cent, so each face is read at its own scale across. Down, the photographs
      include the top edge of the box, so every y is a fraction of the face's own height (25 mm) read
      off the plate's top and bottom edges. Every position is good to about 1.5 mm.
  front-layout:
    confidence: photo-measured
    note: >-
      From the front photograph: the lamps on one centreline 12.5 from the top, power at 77.1, online
      at 86.7, backup at 96.9, LTE/3G at 162.4, the five signal lamps from 172.3 on a 5.0 pitch, and the
      two SIM lamps at 202.3 and 207.2. The legends sit 6.5 below the lamps, the SIM numerals above them.
      A thin vertical rule stands at 70.7 and another at 213.6.
  rear-layout:
    confidence: photo-measured
    note: >-
      From the rear photograph: the power jack centred at 12.2, the erase button at 30.7, the WAN jack
      centred at 49.9, the LAN jack at 72.5, four serial jacks from 96.9 on a 16.3 pitch, and the SIM
      select button at 162.4. The jacks are on one centreline 10.6 from the top. The serial jacks sit
      in one metal frame. It is drawn from 88.9 to 153.6 across and 4.5 to 17.5 down. Each opening is
      the library's ganged RJ-45 cell, 12.7 wide. The erase and SIM select buttons are small round marks
      in the photograph, drawn as the library's recessed pinhole button; the page does not describe either.
  front-panel:
    confidence: photo-measured
    note: >-
      The front photograph shows a rounded inner panel inside the plate, read at the face's scale across
      and as a fraction of its height down: 6.1 from the left, 2.4 from the top, 216.0 wide, 20.7 high,
      corner radius about 2. It is good to about 1.5 mm.
  ports:
    confidence: datasheet
    note: >-
      The product page lists "(4) Serial ports RJ-45 RS-232" and "(2) RJ-45; 10/100 Mbps (auto-sensing)".
      The rear photograph prints WAN over the first jack, LAN over the second and "RS232 SERIAL" under
      the four serial jacks.
  power:
    confidence: datasheet
    note: >-
      The product page prints "18 V DC, .66 A; 100-240 AC" as the power input; the rear photograph prints
      "18V 1.0A" under the jack. The two are stated as printed and are not reconciled: the page's figure
      may be the supply's output and the legend the jack's rating. The jack is the library's barrel jack,
      which claims no diameter. No power consumed by the unit is stated.
  lamps:
    confidence: datasheet
    note: >-
      The product page lists "Power, online, and LTE status, (5) signal strength and (2) SIM selection".
      The front photograph prints PWR, ONLINE, BACKUP, LTE/3G, SIGNAL and SIM 1 and 2, so a backup lamp
      is drawn that the page's list does not name. Nothing states a colour or a state, so the lamps carry
      on and off only.
  colour:
    confidence: photo-measured
    note: >-
      The front and rear are off-white (244, 245, 243 read off the photographs) with dark legends and
      grey-green lamps. The jacks have bright metal shields.
attrs:
  physical: {weight-kg: 0.73}
  power: {power-input: '18 V DC, .66 A; 100-240 AC'}
  environmental: {operating-temp-c: 0 to 40}
  lifecycle: {eol: none-announced}
chassis: {width: 228.0, height: 25.0, depth: 127.0, mount: desktop, color: '#f4f5f3', power: dc}
gaps:
- what: side-top-bottom-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-photo
  note: >-
    The held photographs show the front and the rear only. The four other faces are sized from the product
    page and drawn empty.
  wanted: A photograph or drawing of the sides, the top and the underside.
- what: rear-jack-orientation
  scope:
  - rear
  reason: sources-disagree
  note: >-
    The rear photograph shows each RJ-45 jack with its latch notch at the top and its contacts at the
    bottom. It also shows the WAN and LAN lamps in the top corners. The shared jack parts draw the contacts
    at the top and the lamps at the bottom. No part is changed here.
  wanted: A decision on the shared RJ-45 parts, or a second photograph of the rear.
- what: cellular-antennas-and-sims
  scope:
  - front
  - rear
  reason: needs-photo
  note: >-
    The product page lists a Digi CORE plug-in LTE modem and the front prints two SIM lamps and a SIM
    select button on the rear. No held photograph shows an antenna connector or a SIM slot, so none is
    drawn.
  wanted: A photograph or the hardware guide showing where the antennas and SIM slots are.
- what: wall-mount
  scope:
  - bottom
  reason: vendor-silent
  note: >-
    The product page lists no mounting kit for the unit and no document held shows a mounting hole.
  wanted: The user guide's installation chapter.
- what: legend-text
  scope:
  - front
  - rear
  reason: needs-photo
  note: >-
    The photographs are 800 px wide. The legends that resolve are drawn; the fine print on the rear near
    the power jack does not resolve and is not drawn.
  wanted: A higher resolution photograph of each face.
- what: led-states
  scope:
  - front
  reason: vendor-silent
  note: >-
    The page names the lamps and no colour or state of any of them. The two lamps in each Ethernet jack
    are not described.
  wanted: Digi's lamp table.
- what: power-draw
  scope:
  - rear
  reason: vendor-silent
  note: The page states an input rating and no power consumed by the unit.
  wanted: The data sheet's power figure.
