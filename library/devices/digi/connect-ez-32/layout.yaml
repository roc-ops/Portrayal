  serial-upper:
    term: Port
    role: traffic
    index-origin: 1
    description: the upper row of sixteen RJ45 10-pin serial ports, printed 17 to 32 over it
  console:
    term: Port
    role: management
    index-origin: 1
    description: the RJ45 10-pin RS-232 serial console
  eth:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the two 10/100/1000 Ethernet jacks, printed ETH 1 (upper) and 2 (lower)
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: the two SFP+ cages, printed SFP+ 1 (upper) and 2 (lower)
  usb:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-a, usb: '3.0'}
    description: the two USB 3.1 Gen 1 Type A ports
  sdcard:
    term: Slot
    role: management
    index-origin: 1
    attrs: {media: microsd}
    description: the micro-SD socket
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system lamps, Fan1, Fan2, Sys Fan, PSU1, PSU2, User, WWAN Signal and WWAN Service
  psus:
    term: Bay
    role: service
    index-origin: 1
    description: the two power supply bays, PSU1 on the right of the rear and PSU2 on the left
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Digi Connect EZ 16/32 product page: "Product supports redundant replaceable power supplies".
        Its FAQ: "optional dual AC or dual DC power supplies". Neither states a form or whether the
        pair shares the load or one stands by, so 1+1 is read as one supply with one spare and the
        sharing is not stated.
  fans:
    term: Bay
    role: service
    index-origin: 1
    description: the system fan
  modules:
    term: Bay
    role: service
    index-origin: 1
    description: the CORE module socket
  controls:
    term: Button
    role: management
    index-origin: 1
    description: the reset pinhole
  grounding:
    term: Stud
    role: furniture
    index-origin: 1
    description: the earth stud
  furniture:
    term: Item
    role: furniture
    index-origin: 1
