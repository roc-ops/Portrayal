format: 1
kind: device
name: connect-ez-32
version: 1.0.2
maturity: draft
manufacturer: Digi
model: Connect EZ 32
portfolio: {line: Console Servers, family: Connect EZ, series: Connect EZ 16/32}
description: >-
  Digi Connect EZ 32 is a 1U rack-mount serial server (console server) with thirty-two RJ45 10-pin
  serial ports and a console jack. It also has two 10/100/1000 Ethernet ports, two SFP+ cages and
  two USB 3.1 Gen 1 Type A ports. There is a micro-SD socket and a socket for a Digi CORE plug-in
  LTE modem. The front carries the console jack, the USB ports and the SFP+ and Ethernet jacks
  stacked in pairs. It also has the thirty-two serial jacks in two rows of four blocks of four and
  a lamp cluster. The rear carries two field-replaceable power
  supply bays, a system fan, the CORE module bay with its two SMA antenna jacks and an earth stud.
  The EZ32-A100-GLB and -C100-GLB carry one AC supply, the -A200-GLB and -C200-GLB two, and the
  -AD00 and -CD00 two DC supplies. The C models add software-selectable RS-232/422/485 to the
  RS-232 of the A models. It ships with attachable 19-inch rack ears.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      Digi Connect EZ 16/32 product page (digi.com, read 2026-11-05): ports, power, dimensions,
      lamps, part numbers and accessories. Digi Connect EZ 16 and Connect EZ 32 dimension models ("footprint" STEP
      files EZ16-A000 and EZ32-A000, SolidWorks 2022, 2024-03-22): the EZ 32 file holds the same
      body solid as the EZ 16 file and its other solids are not placed in the body, so every position
      and size below marked drawing is the EZ 16 file's. The Connect EZ 32 front photograph and the
      shared rear photograph (800 px wide each): colours, legends, lamps and the counts the models
      do not name; the EZ 32 front photograph shows the same x for the console jack, the stacked
      jacks, the four serial blocks and the lamp cluster as the EZ 16 front photograph, to about 2 px. Digi's cable guide for PortServer TS, Digi One and
      Connect products: the pin counts of its cables. No data sheet or user guide is held; both are
      behind a form on the maker's site.
  chassis:
    confidence: drawing
    note: >-
      444.0 x 44.0 x 255.0 from the body solid of the dimension model, the same in the EZ 16 and the EZ 32 files. The product page prints
      "25.5 cm x 44.5 cm x 4.445 cm (10.04 in x 17.5 in x 1.75 in)" labelled L x W x H, which agrees
      with the solid to 0.5 mm on every axis (255 mm depth, 444.5 mm width, 44.45 mm height in the
      nominal inches). The EZ 16 model's overall box is wider and deeper (476 x 269 mm) because it adds
      the rack ears (16 mm each side) and the thumbscrews and antenna jacks that stand 12 mm past
      the rear; those are drawn as parts and ears.
  ears:
    confidence: drawing
    note: >-
      The product page says the unit "ships with attachable 19-inch rack ears". The model draws a
      bracket 16.0 wide, 43.5 high and 32.5 deep on each side, flush with the front face (its front
      plate in the plane of the face), with three slotted holes in the front plate (the photographs
      show them). No document states a position other than flush. No rail or mounting kit is
      listed on the product page.
  gate-1:
    confidence: drawing
    note: >-
      The EZ 32 front photograph is 800 px wide for the 476 mm of the face with its ears (1.53
      px/mm across); every x on the front is the EZ 16 model's, which the photograph corroborates to
      about 2 mm (the console jack, the stacked jacks, the first and last serial jacks and the lamp
      cluster all fall within that). The model is orthographic, so this device is not measured off a
      photograph where the model has the feature; the photograph is a check and the source of the
      lamps, legends and colours. y is the model's height measured from the top (44.0 less its y).
  front-layout:
    confidence: drawing
    note: >-
      From the model: the console jack 15.9 wide centred at 34.0; the micro-SD socket 16.1 wide
      at 6.95; two USB Type A at 55.2 and 72.2 (centres, standing portrait); two SFP+ cages stacked
      at 89.1; two RJ45 jacks stacked at 112.6; two rows of four blocks of four serial jacks, each jack 16.0
      wide on a 16.0 pitch, the blocks 70.0 apart from 130.3, the lower row at the EZ 16 model's y and
      the upper row stacked directly above it, which the EZ 16 model cannot show: the photograph puts
      its top edge about 3 mm lower than that, so its y is estimated; three columns of lamp light pipes at
      410.5, 420.5 and 430.5. Whether the Ethernet jacks stack as drawn (14.6 each) is the model's.
  lamp-layout:
    confidence: photo-measured
    note: >-
      The three light-pipe columns are the model's; which lamp is in which is read off the front
      photograph: Fan1, Fan2 and Sys Fan in the first, PSU1, PSU2 and User in the second, WWAN
      Signal and WWAN Service in the third with a blue legend badge each. Good to about 1 mm.
  vent-row:
    confidence: photo-measured
    note: >-
      A row of round perforations runs along the top of the front, 4.15 mm apart and about 2.8 mm
      across, from 79 to 431 mm; read off the front photograph and not in the model. It is drawn as
      the photograph shows it, with 85 holes. Good to about 1 mm.
  rear-layout:
    confidence: drawing
    note: >-
      From the model, mirrored (a rear view reads left to right as the model's x runs right to
      left): the second power supply bay 95.0 x 41.5 at 4.5, the CORE module plate 133.2 x 22.8
      at 99.5 (the model's plate is 136.5 wide and overlaps the supply's bay by 3.3 mm, so it is cut
      to the bay), the earth stud at 112 and 11 down, the system fan 54.7 x 41.8 at 289.8 (the model's
      is 58.1 and overlaps the first supply's bay by 3.4 mm) and the first supply 95.0 x 41.5 at
      344.5. The antenna jacks, the reset pinhole, the warning legend and the earth symbol are read
      off the rear photograph (1.64 px/mm across, stretched about 1.2 times down) and are
      photo-measured.
  side-layout:
    confidence: drawing
    note: >-
      From the model, the wall's own holes. The left wall has a block of 13 x 9 square holes 2.0 across
      on a 3.0 pitch behind the front, and the right wall has the first two rows of the same block and
      a window 38.0 x 15.5 under it. Each wall has three round holes 3.0 across for the ear screws and
      the lid has two 5.9 holes per side and three 5.6 holes along its rear edge. Left view x = 0 is the
      rear and right view x = 0 is the front. On the top and the bottom view y = 0 is the rear and the
      bottom view mirrors left and right. No held document shows the Connect EZ 32's own walls.
      They are built identical to the Connect EZ 16's, the documented side, as the documents say nothing else.
  bottom-layout:
    confidence: drawing
    note: >-
      From the model: two square holes 10.0 across, six slots 5.6 x 2.8, eight round holes 4.0 across
      and twelve 5.5 across. The model does not say what they are for. Bottom view x is mirrored.
  lamps:
    confidence: datasheet
    note: >-
      The product page lists the system lamps "Power 1, Power 2, Fan 1, Fan 2, Sys Fan, User, WWAN
      Signal, WWAN Service" and per port "Ethernet, Serial, Console, USB". It says nothing of what a
      colour or a blink means, so the lamps carry on and off only.
  ports:
    confidence: datasheet
    note: >-
      "SERIAL PORTS (RJ45 10-pin)": 32, RS-232 on the A models and RS-232/422/485 software selectable
      on the C (MEI) models; "CONSOLE (RJ45 10-pin)" RS-232; two 10/100/1000 Ethernet; two 10 Gb capable
      SFP+ sockets; two USB 3.1 Gen 1 Type A; a micro-SD socket that takes SD, SDHC and SDXC. The
      sockets are placed as parts with the mate each has in the library.
  power:
    confidence: datasheet
    note: >-
      "AC: Single or dual AC input (C13 connector)"; "100 - 240 VAC, ~50 - 60 Hz, 2.4 A max for each
      power supply"; "DC: Dual DC power with EZ-AD00/EZ-CD00 models, with supplied Phoenix
      connectors"; "48 VDC, 2.9 A max for each power supply". Both are replaceable ("Product
      supports redundant replaceable power supplies"). No figure of power consumed by the unit is
      stated.
  skus:
    confidence: datasheet
    note: >-
      The page lists six SKUs of this size: EZ32-A100-GLB (RS-232, global power cords), EZ32-A200-GLB
      (dual AC), EZ32-AD00 (dual DC), EZ32-C100-GLB (RS-232/422/485), EZ32-C200-GLB (dual AC) and
      EZ32-CD00 (dual DC). The photographs show one supply fitted and one bay covered, so the single
      AC build is the one pictured; the dual AC and dual DC builds are not pictured.
  colour:
    confidence: photo-measured
    note: >-
      The front and rear are black, the jacks have bright metal shields, the ears are black and the
      USB tongues are blue. Taken from the front and rear photographs.
attrs:
  physical:
    package-dimensions: 37.5 cm x 57.5 cm x 15.24 cm (14.76 in x 22.64 in x 6 in)
    package-weight-kg: 5.26
  power:
    power-input: >-
      AC, single or dual, C13 connector: 100 - 240 VAC, 50 - 60 Hz, 2.4 A max for each supply (A100,
      A200, C100, C200). Dual DC with supplied Phoenix connectors: 48 VDC, 2.9 A max for each supply
      (AD00, CD00)
    power-redundancy: replaceable power supplies, redundant
  environmental:
    operating-temp-c: 0 to 50
    storage-temp-c: 0 to 70
    humidity: 5% to 95% (non-condensing)
  platform:
    memory: 2 GB RAM, 8 GB Flash
  features:
    optics-sfp-plus: >-
      product page: "(2) 10 Gb capable SFP+ sockets"; the page names no optic and none is included
    serial-modes: RS-232 (A models); RS-232, RS-422 and RS-485 software selectable (C models, MEI)
  compliance:
    safety: IEC 62368-1, IEC 60950-1, CB, EN 62311, UL 62368-1, UL 60950-1
    emissions: CE; RED; FCC Part 15, Subpart B; ICES-003; AS/NZS; CISPR 32, CISPR 35
  lifecycle: {eol: none-announced}
chassis:
  width: 444.0
  height: 44.0
  depth: 255.0
  ru: 1
  color: '#1f2226'
  ears:
    h: 43.5
    y: 0.25
    positions:
    - {name: flush, at: 0, default: true}
gaps:
- what: dc-supply-face
  scope: [rear]
  reason: needs-photo
  note: >-
    No photograph or drawing of the DC supply is held. The EZ32-AD00 and -CD00 builds seat the library part
    ez-psu-dc, the AC supply's face with a two-position pluggable terminal header where the inlet is. The page
    says only "Phoenix connectors", and nothing about their positions, pitch, polarity or direction.
  wanted: A photograph or drawing of the Connect EZ DC power supply.
- what: dual-ac-and-core-builds
  scope: [rear]
  reason: needs-photo
  note: >-
    The rear photograph shows one AC supply fitted, the second bay covered and the CORE module fitted. A
    dual AC rear and a rear with the CORE socket covered are not pictured. The cover over an empty CORE
    socket is drawn as the module's plate without its jacks.
  wanted: Photographs of the dual AC build and of a unit without the CORE modem.
- what: legend-text
  scope: [front, rear]
  reason: needs-photo
  note: >-
    The photographs are 800 px wide. Small marks beside the USB ports and the SFP+ cages (a trident
    symbol above each USB, a number beside each), the symbol under the warning triangle on the rear, the
    PSU1 and PSU2 legends with their rotated "Caution Shock hazard" labels, the model legend under the
    micro-SD socket and the rating legend printed by the AC inlet do not resolve. The legends that do are
    drawn; the rest are not.
  wanted: A higher resolution photograph of each face, or Digi's hardware guide.
- what: rack-kit
  scope: [front]
  reason: vendor-silent
  note: >-
    The page lists no rail or mounting kit for the unit and says only that it ships with attachable
    19-inch rack ears, so none is listed.
  wanted: Digi's installation guide.
- what: power-draw
  scope: [rear]
  reason: vendor-silent
  note: >-
    Digi states each supply's input (2.4 A at 100 - 240 VAC, 2.9 A at 48 VDC) and no power consumed by the unit,
    the supplies, the fan or the CORE modem, so none is stated.
  wanted: The data sheet's power figure.
- what: unit-weight
  scope: [front]
  reason: vendor-silent
  note: >-
    The page gives a package weight (5.26 kg for the EZ 32) and no weight for the unit.
  wanted: The data sheet's weight.
- what: led-states
  scope: [front]
  reason: vendor-silent
  note: >-
    The page names the lamps and no colour or state of any of them. The Ethernet and serial jacks'
    lamps' colours do not resolve in the 800 px photographs.
  wanted: Digi's lamp table.
- what: usb-port-numbers
  scope: [front]
  reason: needs-photo
  note: >-
    The USB ports are drawn without a number because the photograph's marks beside them do not resolve.
  wanted: A higher resolution photograph of the front.
