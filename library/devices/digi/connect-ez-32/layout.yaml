configurations:
  single-ac:
    kind: orderable
    description: >-
      One AC supply in the first bay and a cover over the second, the CORE socket covered. This is the
      build the rear photograph shows apart from the modem. RS-232 on the A100 and RS-232/422/485 on the C100.
    default: true
    power: ac
    bays: {psu-1: 'digi/ezps-ac@1', psu-2: 'digi/ez-psu-blank@1', core: 'digi/core-blank@1'}
    part-numbers:
      EZ32-A100-GLB: {}
      EZ32-C100-GLB: {}
  dual-ac:
    kind: orderable
    description: Two AC supplies; RS-232 on the A200 and RS-232/422/485 on the C200.
    power: ac
    bays: {psu-1: 'digi/ezps-ac@1', psu-2: 'digi/ezps-ac@1', core: 'digi/core-blank@1'}
    part-numbers:
      EZ32-A200-GLB: {}
      EZ32-C200-GLB: {}
  dual-dc:
    kind: orderable
    description: Two DC supplies with Phoenix connectors; RS-232 on the AD00 and RS-232/422/485 on the CD00.
    power: dc
    bays: {psu-1: 'digi/ez-psu-dc@1', psu-2: 'digi/ez-psu-dc@1', core: 'digi/core-blank@1'}
    part-numbers:
      EZ32-AD00: {}
      EZ32-CD00: {}
  with-lte-modem:
    kind: example
    description: >-
      The single AC build with a Digi CORE plug-in LTE modem (1002-CMG4-GLB, an accessory) in the CORE
      socket, as the rear photograph shows it.
    power: ac
    bays: {psu-1: 'digi/ezps-ac@1', psu-2: 'digi/ez-psu-blank@1', core: 'digi/core-lte-modem@1'}
