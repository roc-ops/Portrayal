format: 1
kind: device
name: hlx-tgv
version: 2.0.10
maturity: modelled
manufacturer: Halny
model: HLX-TGV
description: XGS-PON ONT (SFU/HGU) - 1x 10G RJ45, 1x GbE RJ45, 2x FXS, SC/APC PON, VoIP
profile: networking
provenance:
  chassis:
    confidence: datasheet
    note: >-
      datasheet (Dimension WxDxH 172 x 115 x 40mm; DC +12V/1.0A). Mount `desktop`: the reference
      front and rear views show the box standing on four corner feet with its LEDs on the top face.
  dc-in-rating:
    confidence: datasheet
    note: >-
      datasheet (DC +12V/1.0A): the `input-voltage` and `current-max-a` of the dc-in jack. The
      datasheet states no barrel size; the jack is the library's one nominal `dc-barrel`.
  rear-layout:
    confidence: photo-measured
    note: >-
      photo-measured (stock rear photo, labels ON/OFF POWER 10G LAN RESET TEL2 TEL1)
  top-layout:
    confidence: photo-measured
    note: >-
      photo-measured (owner capture with ruler; 8 labeled LEDs + 1 unlabeled position)
  bottom-layout:
    note: >-
      hand-tuned by owner against the physical unit (Inkscape round-trip of the compiled SVG,
      2026-08-15)
  pon-caption:
    note: >-
      the white plastic underside carries NO printing beside the fibre bay (IMG_2095, IMG_2096).
      PON SC/APC was therefore never silkscreen: it is the modeller naming a part, and
      silkscreen[] means ink on the moulding. It is now a region, which is what this project has
      for author annotation, so the drawing no longer claims the vendor printed something it did
      not

