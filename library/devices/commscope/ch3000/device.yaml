  half-depth-mix:
    kind: example
    description: >-
      Half-depth modules front and rear in every slot from 3 to 16 - the chassis data
      sheet's "32 half-depth slots (16 front-loaded and 16 rear-loaded)" - beside the one
      PS3006D. Slots 3-6: the switches and the NP35 DWDM family (NP35M08 over NP35D08,
      OS32M2B with AB32S1G, NP35M04 over NP35D04, NP35F01 with NP35F04S). Slots 7-11: the
      NP34/OP34 CWDM filters and multiplexers (NP34M08 with NP34B10S, OP34M8C over
      OP34M10C, NP34M05 over OP34D5x, OP34M5x with NP34C01, NP34F01D with OP34F1D). Slots
      12-16: NP33F01 with OP35D8-CF, the NP34S04 / OP34S4S splitters, NP35C0x with OP31M2D,
      OP35F1 with OP35F1D, and OP35F4S with OP35D4x. Part and channel numbers are the
      photographs'. Illustrative.
