configurations:
  base:
    kind: base
    default: true
    description: >-
      One PS3006D power supply and controller in slots 1-2 with its BP-P1 back plate, and
      every other slot empty - the chassis powered and manageable before any optics are
      chosen. Empty slots are drawn open: the one front blank named in any document held,
      the BP3000, is neither drawn nor photographed (see gaps).
    bays:
      slot-3: ''
      slot-4: ''
      slot-5: ''
      slot-6: ''
      slot-7: ''
      slot-8: ''
      slot-9: ''
      slot-10: ''
      slot-11: ''
      slot-12: ''
      slot-13: ''
      slot-14: ''
      slot-15: ''
      slot-16: ''
      rear-3: ''
      rear-4: ''
      rear-5: ''
      rear-6: ''
      rear-7: ''
      rear-8: ''
      rear-9: ''
      rear-10: ''
      rear-11: ''
      rear-12: ''
      rear-13: ''
      rear-14: ''
      rear-15: ''
      rear-16: ''
      slot-3-4: ''
      slot-5-6: ''
      slot-7-8: ''
      slot-9-10: ''
      slot-11-12: ''
      slot-13-14: ''
      rear-3-4: ''
      rear-3-6: ''
      rear-5-6: ''
      rear-7-8: ''
      rear-9-10: ''
      rear-11-12: ''
      rear-13-14: ''
  redundant-power:
    kind: example
    description: >-
      A second supply for redundancy - the PS3006 data sheet "Supports redundant power
      supplies" - placed as the HT3580H sheet's chassis photograph places it: a PS3006N in
      slots 15-16, with a BP-P1 behind it. The PS3006N's B/U PS lamp is what reports it.
  ar3002e-x14:
    kind: example
    description: >-
      Fourteen AR3002E forward receivers in slots 3-16, each on its own BP-A5 back plate,
      beside the one PS3006D - the "up to 14 receivers in one 3RU chassis" of the AR3002E
      data sheet. Illustrative: modules and back plates are ordered separately.
    bays:
      slot-3: commscope/ar3002e@1
      slot-4: commscope/ar3002e@1
      slot-5: commscope/ar3002e@1
      slot-6: commscope/ar3002e@1
