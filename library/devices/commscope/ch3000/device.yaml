configurations:
  base:
    kind: base
    default: true
    description: >-
      One PS3006D power supply and controller in slots 1-2 with its BP-P1 back plate, and
      every other slot empty - the chassis powered and manageable before any optics are
      chosen. Empty slots are drawn open: no front blanking panel for a CH3000 slot is
      named in any document held (see gaps).
    bays:
      slot-3: ''
      slot-4: ''
      slot-5: ''
      slot-6: ''
      slot-7: ''
      slot-8: ''
      slot-9: ''
      slot-10: ''
      slot-11: ''
      slot-12: ''
      slot-13: ''
      slot-14: ''
      slot-15: ''
      slot-16: ''
      rear-3: ''
