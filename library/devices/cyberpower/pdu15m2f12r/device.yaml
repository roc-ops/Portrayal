gaps:
- what: rear-outlet-layout
  scope: [rear]
  reason: needs-drawing
  note: >-
    the data sheet says twelve rear outlets. The only rear drawing, the user manual's PDF page 22, is the series figure with eight. The twelve are
    placed evenly across the span of the drawing's eight and are an estimate; their pitch and the margins are not stated anywhere held.
  wanted: a rear photograph or a dimensioned drawing of this model.
- what: front-angled-photograph
  scope: [front]
  reason: needs-photo
  note: >-
    the front is read off one angled photograph, so every position is a fraction of the plate and good to about 2 mm. The user manual's front view
    (PDF page 22) is a straight-on line drawing of the series and shows the same arrangement, but its scale is not stated.
  wanted: a straight-on photograph of the front, with a scale.
- what: meter-type-wording
  scope: [front]
  reason: sources-disagree
  note: >-
    the data sheet's first paragraph says the amps are shown "on the front LCD"; the manual calls it an "LED Meter Readout" and the photograph
    shows a red seven-segment readout. The photograph is followed.
  wanted: the maker's word on the meter.
- what: ratings-wording
  scope: [front, rear]
  reason: sources-disagree
  note: >-
    the data sheet says 100 to 125 V, operating 0 to 35 C and 0 to 3048 m, and the user manual's series table says 100 to 120 V, 0 to 50 C and 4000 m.
    Its input current is "12A UL (Derated)" there and 15 A maximum, 12 A derated, in the data sheet. The data sheet is followed.
  wanted: the maker's word on the ratings.
- what: mounting-brackets
  scope: [front, rear, left, right]
  reason: needs-drawing
  note: >-
    the data sheet lists "Adjustable Mounting Brackets 2 sets (L-Short, L-Long)" and the user manual (PDF pages 5 to 10) shows horizontal and
    vertical installs. No document dimensions an ear or its holes, so only the flush position the photograph shows is named, without a figure.
  wanted: a dimensioned drawing of the PDU with its brackets.
- what: sides
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: >-
    no document shows the top, the bottom or an end of this model.
  wanted: straight-on photographs of the top, the bottom and an end, with a scale.
