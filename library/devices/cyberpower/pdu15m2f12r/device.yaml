format: 1
kind: device
name: pdu15m2f12r
version: 0.1.0
maturity: modelled
manufacturer: CyberPower
model: PDU15M2F12R
description: >-
  CyberPower PDU15M2F12R metered rack PDU, 1U, 100 to 125 V, 15 A, single phase. A black metal strip 445 mm wide, 57 mm deep
  and 44 mm high with a mounting ear at each end. The front carries a breaker button, a two-digit red amp meter and two NEMA
  5-15R outlets. The rear carries twelve more NEMA 5-15R outlets, an external site ground and a fixed 15 ft cord with a NEMA
  5-15P plug. The twelve rear outlets are placed by estimate: no document shows them.
profile: power
provenance:
  method:
    confidence: estimated
    note: >-
      ESTIMATED. NO DIMENSIONED DRAWING EXISTS, NO STRAIGHT-ON PICTURE OF THE FRONT, AND NO DRAWING OF THIS MODEL'S REAR. The front is read off the one
      product photograph on page 1 of the PDU15M2F12R data sheet, taken from the right and above, so it is NOT orthographic: x is read as a
      fraction of the body's width (1595 px for 445 mm, the ears excluded) corrected for the strip's perspective by the face's own height
      (173 px at the left end, 215 at the right), and y as a fraction of the face's height at that column (44 mm). Each position is good to
      about 2 mm. The rear is read off the PDU15M2F12R-series rear view in the user manual K01-0000742-01, PDF page 22 (printed 21), which
      draws EIGHT rear outlets, the series figure, and not this model's twelve. The Visio stencils held for other models were not opened.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - CyberPower PDU15M2F12R data sheet, page 2: "445 x 44 x 57 mm" and "17.5 x 1.75 x 2.25 in." (W x H x D), "Rack Height 1U",
      weight 1.81 kg. The user manual, PDF page 22, gives the same size ("1.75 x 17.5 x 2.25 in." H x W x D). THE EARS ARE NOT IN IT: the
      photograph shows an ear at each end outside the body, so 445 is read as the body between the folds. The finish is black.
  front:
    confidence: photo-measured
    note: >-
      photo-measured - millimetres from the body's left edge and its top. Breaker button centre 35.5 across and 22.9 down; the maker's name
      from 18.0 across, 9.8 down, and the model name from 24.8 across, 38.3 down. Meter bezel 294.7 to 335.3 across and 3.1 to 41.6 down,
      its lit window 298.7 to 330.3 across and 8.4 to 36.7 down. Outlets centre at 368.4 and 402.9 across (a 34.5 pitch) and 22.65 down.
      Every position comes off an angled photograph and is a fraction of the plate (gaps: front-angled-photograph).
  rear:
    confidence: estimated
    note: >-
      estimated - the rear view of the manual, PDF page 22, is a straight-on line drawing of the series' eight-outlet strip. Its body is 1687 px
      across for 445 mm (3.79 px per mm) and the eight outlets stand on a 184 px (48.55 mm) pitch from 36.5 mm across, 22.0 mm down, with the
      external site ground at 403.8 and the cord boss at 420.1, and a pair of cord retention tray screw holes at 9.0 and 435.6 across, 15.0 and
      35.1 down. THIS MODEL HAS TWELVE REAR OUTLETS, AND NO HELD DOCUMENT SHOWS WHERE. They are drawn evenly across the same span the drawing's
      eight cover (36.5 to 376.5 mm, a 30.9 pitch, 11 gaps), earth hole to the left as the drawing shows it, and are an estimate (gaps:
      rear-outlet-layout). The ground, the cord and the tray holes are the drawing's.
  outlets:
    confidence: datasheet
    note: >-
      datasheet - the data sheet, pages 1 and 2: "14 x NEMA 5-15R", "Outlets - Front 2", "Outlets - Rear 12", "Outlets - Total 14". The unit prints no
      outlet numbers: here the two front outlets are 1 and 2 from the left, and the twelve rear outlets 3 to 14 from the left as seen from
      behind. std/nema-5-15r@1 is the library's 5-15R face, borrowed from the 5-20R (no 15 A face is dimensioned), so the outlets are the part's size
      and not a reading of the photograph.
  breaker:
    confidence: datasheet
    note: >-
      datasheet - "Overload Protection 15 A" (data sheet page 1) and "Circuit Breaker 15 A", user manual, PDF page 22, callout 2 on the front view.
      The photograph shows a red round button in a black bezel, which is what a push-to-reset breaker looks like; the manual's drawing shows
      concentric rings. common/breaker-push-reset@1 draws a nickel nut and a dark plunger, so its colours differ from the photograph's red button.
      The one breaker protects the whole strip: no bank is stated.
  meter:
    confidence: datasheet
    note: >-
      datasheet - "Meter Readout Amperage" and "Digital meter: Displays Amperage" (page 1). The data sheet's text says "front LCD" and the manual
      calls it an "LED Meter Readout" (callout 3); the photograph shows a red two-digit seven-segment readout with an AMP legend, which is followed
      (gaps: meter-type-wording). common/seven-segment-dual@1 is the library's two-digit window (17.4 x 12.1), smaller than the photograph's digits.
  input:
    confidence: datasheet
    note: >-
      datasheet - "Input Plug Type NEMA 5-15P", "Plug Style Straight", "Cord Length (ft.) 15 ft (4.6 m)", derated input current 12 A and maximum
      15 A. The manual, PDF page 22, draws the cord boss at the right end of the rear (callout 7). Only the strain relief is drawn.
  ground:
    confidence: datasheet
    note: >-
      datasheet - "External Site Ground Pin Yes" (page 2) and the user manual, PDF page 22, callout 6 "External Site Ground", drawn as a small
      screw with an earth symbol under it, right of the last outlet. The box lists "Ground Screw M4 X 6 or M5 X 6 (1pcs)" (manual, PDF page 5, printed 4):
      which size fits is not stated and no lug is named, so the library's nominal screw is placed, with no size claimed.
