format: 1
kind: device
name: pdu41021
version: 0.1.0
maturity: modelled
manufacturer: CyberPower
model: PDU41021
description: >-
  CyberPower PDU41021 switched rack PDU, 1U, 100 to 120 V, 15 A, single phase. A black metal box 433 mm wide, 215 mm deep
  and 44 mm high with a mounting ear at each end. The front has a fixed 12 ft cord with a NEMA 5-15P plug at the left end.
  It also has eight NEMA 5-15R outlets, each with a lamp. A control panel holds a status lamp, Select and Enter buttons and
  a display. The panel also holds an Ethernet jack, In/ENV, Out and Serial jacks and a USB jack. The eight rear outlets are
  not shown by any document and are not drawn.
profile: power
provenance:
  method:
    confidence: estimated
    note: >-
      ESTIMATED. NO DIMENSIONED DRAWING, NO STRAIGHT-ON PICTURE AND NO MANUAL EXISTS. Every position on the front is read off the one product
      photograph on page 1 of the PDU41021 data sheet, taken from the left and above, so it is NOT orthographic: x is read as a fraction of the
      body's width (1260 px for 433 mm, the ears excluded) corrected for the strip's perspective by the face's own height (140 px at the left
      end, 150 at the right), and y as a fraction of the face's height at that column (44 mm). Each position is good to about 2 mm. The Visio
      stencil held for this model was not opened.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - CyberPower PDU41021 data sheet, page 2: "433 x 44 x 215 mm" and "17.05 x 1.75 x 8.45 in." (W x H x D), "Rack Height 1U",
      "Style Horizontal Rackmount", weight 3.81 kg. THE EARS ARE NOT IN IT: the photograph shows an ear at each end outside the body, so 433 is read
      as the body between the folds. The finish is black.
  front:
    confidence: photo-measured
    note: >-
      photo-measured - millimetres from the body's left edge and its top. Outlets: centres at 46.4 across and every 30.46 after it (the first and
      eighth read 46.4 and 259.6) and 19.0 down; lamps 3.2 right of each centre and 37.3 down; numerals 1 to 8 beside the lamps. Cord at 21.3
      across, 18.1 down. Control panel from 292.0 across. Status lamp 304.9 across, 5.6 down; Select 304.9, 16.1 and Enter 304.9, 33.7. Display 324.8 to 352.8 across,
      6.7 to 37.3 down. The Ethernet jack centres at 365.7, 13.1; In/ENV at 386.3, 12.1 and Out at 386.3, 31.5; USB at 401.4, 12.4 and Serial at 404.1, 31.5.
      Every position comes off an angled photograph and is a fraction of the plate (gaps: front-angled-photograph).
  outlets:
    confidence: datasheet
    note: >-
      datasheet - the data sheet, pages 1 and 2: "16 x NEMA 5-15R", "Outlets - Front 8", "Outlets - Rear 8", "Outlet Total 16". The eight on the front are
      numbered 1 to 8 from the left in the photograph. std/nema-5-15r@1 is the library's 5-15R face, borrowed from the 5-20R (no 15 A face is
      dimensioned), so the outlets are the part's size and not a reading of the photograph. The eight rear outlets are not drawn (gaps: rear).
  input:
    confidence: datasheet
    note: >-
      datasheet - "Input Plug Type NEMA 5-15P", "Plug Style Straight", "Cord Length 12 ft (3.7 m)", derated input current 12 A and maximum 15 A.
      The photograph shows the cord leaving the left end of the front.
  banks:
    confidence: datasheet
    note: >-
      datasheet - "Outlet - Number of Banks 2" and "Overload Protection (Each Bank) 15 A". Which outlets belong to which bank is not stated, and no
      breaker is shown, so no bank or breaker is drawn (gaps: banks).
  controller:
    confidence: datasheet
    note: >-
      datasheet - page 1 "Power Control Display", page 2 "LCD Multifunction LCD", "Hardware Connection Port RJ45 Universal (RJ45)", "Environmental Sensor
      Optional, vai RJ45" [sic], "Modular Expandability (Cascading) Yes, via RJ45", LED indicators "Tx/Rx", "LINK", "Outlets", "Status", "Load". NO MANUAL IS
      HELD: the port labels In/ENV, Out, Serial, USB, Tx/Rx and Link are read off the photograph alone, and what each jack carries is not stated
      (gaps: port-labels). The RJ45 Ethernet port for network connection is the silver jack with a green and a yellow lamp.
  capability:
    confidence: datasheet
    note: >-
      datasheet - "Outlet Switching Yes" and "Switched PDU: SNMP Network Interface and Switchable Outlets" (pages 1 and 2), so `outlet-switching: true`, and each
      outlet states on and off. "Meter Readout Power Control Display" says the unit meters; at which level is not stated. The photograph's display
      reads "Device" over amps, watts, volts and hertz, so the metering is read as the input (`metering-scope: input`) from the photograph alone.
attrs:
  physical:
    weight-kg: 3.81
    construction: metal
  power:
    input-plug: nema-5-15p
    input-cord: fixed
    input-phase: single
    input-voltage-v: 120
    input-current-a: 15
    input-range: 100-120 V
    frequency: 50/60 Hz
    breakers: two 15 A, one for each bank
  environmental:
    operating-temp: 0 to 60 C (32 to 140 F)
    humidity: 0 to 95 % non-condensing
    altitude: 0 to 3500 m (0 to 11483 ft)
    storage-temp: -15 to 65 C (5 to 149 F)
  management:
    metering-scope: input
    outlet-switching: true
  compliance:
    certifications: UL62368, FCC Class A
  lifecycle: {eol: none-announced}
chassis:
  width: 433
  height: 44
  depth: 215
  ru: 1
  color: '#34353e'
  ears:
    color: '#383842'
    positions:
      - {name: flush, default: true}
gaps:
- what: rear
  scope: [rear]
  reason: needs-photo
  note: >-
    no document shows the rear of this model. The data sheet says eight of the sixteen outlets are on the rear and shows none of them, and states an
    "External Site Ground Pin" and a cord retention tray without a position. The rear is left unshown and its eight outlets are not drawn, so the
    outlet list holds the eight front outlets only.
  wanted: a photograph of the rear, or the installation guide.
- what: front-angled-photograph
  scope: [front]
  reason: needs-photo
  note: >-
    the front is read off one angled photograph, so every position is a fraction of the plate and good to about 2 mm.
  wanted: a straight-on photograph of the front, with a scale.
- what: port-labels
  scope: [front]
  reason: vendor-silent
  note: >-
    no manual is held for this model. The photograph prints Tx/Rx and Link beside the silver Ethernet jack, In / ENV beside the upper black RJ45 jack, Out beside
    the lower one, Serial beside the right-hand one and USB beside the USB jack. The black jacks are typed `rj45-serial`, the media the lint vocabulary has
    for a jack that is not Ethernet, because the data sheet calls the port "Universal (RJ45)" and an "Environmental Sensor ... via RJ45"; no role, speed
    or pinout is given, and the legends are not drawn, since the photograph prints them turned on their side.
  wanted: the installation guide's port table.
- what: banks
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    the data sheet says two banks, each with a 15 A overload protection, and does not say which outlets each holds or where a breaker is. Neither is drawn.
  wanted: the installation guide.
- what: control-panel-parts
  scope: [front]
  reason: needs-drawing
  note: >-
    the Select and Enter buttons are plain rings in the photograph; the library part drawn for them is the PDU81001G's navigation button with four arrows,
    and the display is that unit's graphic display part, light grey, where the photograph's screen is black with a pale header. Neither is a reading of this unit.
  wanted: a straight-on photograph of the control panel.
- what: ear-positions
  scope: [front, left, right]
  reason: needs-drawing
  note: >-
    the data sheet lists "Adjustable Mounting Brackets 1 set" and gives no ear, bracket or hole dimension; the photograph shows an ear at each end with three
    holes in the left one. Only the flush position the photograph shows is named, without a figure.
  wanted: a dimensioned drawing.
- what: stencil
  scope: [front, rear]
  reason: needs-drawing
  note: >-
    a Visio stencil is held (its internal title reads PDU41002) and was not opened.
  wanted: the stencil opened and compared with the front.
- what: sides
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: >-
    no document shows the top, the bottom or an end of this model. The photograph sees the top and the right end at a steep angle, with holes along the side,
    which cannot be measured.
  wanted: straight-on photographs of the top, the bottom and an end, with a scale.
