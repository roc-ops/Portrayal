gaps:
- what: rear
  scope: [rear]
  reason: needs-photo
  note: >-
    no document shows the rear of this model: the data sheet has one photograph, of the front, and no manual is held. The data sheet's eight
    outlets are all on the front in the photograph, so nothing is known to stand on the rear.
  wanted: a photograph of the rear, or the installation guide.
- what: env-serial-labels
  scope: [front]
  reason: vendor-silent
  note: >-
    the photograph prints "ENV" and "Serial/Link" between the two black RJ45 jacks. Whether each label names the jack nearest it or the two read
    as one legend is not stated by any held document, and what each jack carries is not stated. Both are typed `rj45-serial`, the media the lint
    vocabulary has for a jack that is not Ethernet (the Ethernet jacks are the two green-framed ones), because the labels say Serial and ENV and the
    data sheet calls the port "Universal (RJ45)"; no role, speed or pinout is given.
  wanted: the installation guide's port table.
- what: ear-positions
  scope: [front, left, right]
  reason: needs-drawing
  note: >-
    the data sheet gives no ear, bracket or hole dimension; the photograph shows an ear at each end with two holes visible on the right one.
    Only the flush position the photograph shows is named, without a figure.
  wanted: a dimensioned drawing.
- what: stencil
  scope: [front]
  reason: needs-drawing
  note: >-
    a Visio stencil is held (its internal title reads PDU81001) and was not opened.
  wanted: the stencil opened and compared with the front.
- what: sides
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: >-
    no document shows the top, the bottom or an end of this model. The photograph sees the top and the right end at a steep angle with
    ventilation holes along the side, which cannot be measured.
  wanted: straight-on photographs of the top, the bottom and an end, with a scale.
