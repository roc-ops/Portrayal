format: 1
kind: device
name: pdu81001g
version: 0.1.0
maturity: modelled
manufacturer: CyberPower
model: PDU81001G
description: >-
  CyberPower PDU81001G gigabit switched metered-by-outlet rack PDU, 1U, 100 to 120 V, 15 A, single phase. A black metal
  box 433 mm wide, 112 mm deep and 44 mm high with a mounting ear at each end. The front carries a fixed 12 ft cord with a
  NEMA 5-15P plug at the left end. It has eight NEMA 5-15R outlets, each with a lamp. A controller block holds a reset
  button, a navigation button and a graphic display. It also holds two USB jacks, an environment jack, a serial and link
  jack and two gigabit Ethernet jacks. No document shows the rear.
profile: power
provenance:
  method:
    confidence: estimated
    note: >-
      ESTIMATED. NO DIMENSIONED DRAWING AND NO STRAIGHT-ON PICTURE EXISTS. Every position on the front is read off the one
      product photograph on page 1 of the PDU81001G data sheet, taken from the right and above, so it is NOT orthographic:
      x is read as a fraction of the body's width (1145 px for 433 mm, 0.378 mm per px, the ears excluded) and y at the
      face's own vertical scale (3.17 px per mm, 44 mm of face between the top edge and the bottom edge). The eight outlets
      sit on a near-constant 77.6 px pitch, which supports a common pitch across the block, but the controller block lies
      farther along the foreshortened direction and its positions are good to about 2 mm. The Visio stencil held for this model
      was not opened.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - CyberPower PDU81001G data sheet, page 2: "433 x 44 x 112 mm" and "17.05 x 1.75 x 4.41 in." (W x H x D), "Rack
      Height 1U", weight 2.6 kg. THE EARS ARE NOT IN IT: the photograph shows an ear at each end outside the body, so 433 is read
      as the body between the folds. The finish is black.
  front:
    confidence: photo-measured
    note: >-
      photo-measured - millimetres from the body's left edge and its top. Outlets: centres at 44.5, 73.8, 103.2, 132.5, 161.9, 191.2,
      220.6 and 249.9 across (a 29.35 pitch) and 17.1 down; lamps 3.5 right of each centre and 36.4 down; numerals 1 to 8 beside
      the lamps. Cord at 17.8 across, 24.4 down. Reset dot 11.0 down and the navigation button 23.6 down, both at 303.0. Display 317.3
      to 345.4 across, 10.4 to 42.2 down. USB 1 and USB 2 centre at 352.0 and 363.8 across, 14.2 down. The environment jack and the
      serial and link jack centre at 380.0, 14.2 and 35.6 down. ETH 1 and ETH 2 centre at 399.4, 15.6 and 34.7 down.
  outlets:
    confidence: datasheet
    note: >-
      datasheet - the data sheet, pages 1 and 2: "8 x NEMA 5-15R", "Number of Outlets 8", "Outlets - Total 8". The data sheet does not
      say whether they are front or rear; the photograph shows all eight on the front, numbered 1 to 8 from the left. std/nema-5-15r@1
      is the library's 5-15R face, borrowed from the 5-20R (no 15 A face is dimensioned), so the outlets are the part's size and not
      a reading of the photograph, where the face reads about 25 mm across.
  input:
    confidence: datasheet
    note: >-
      datasheet - "Input Plug Type NEMA 5-15P", "Cord Length (ft.) 12 ft (3.7 m)", derated input current 12 A, maximum 15 A. The plug style is
      not stated. The photograph shows the cord leaving the left end of the front.
  controller:
    confidence: datasheet
    note: >-
      datasheet - page 1 features "Dual Network Gigabit 10/100/1000 Ethernet Ports"; page 2 "Hardware Connection Port RJ45 Universal
      (RJ45)", "Environmental Sensor Optional, via RJ45" and "LCD Multifunction LCD". The photograph labels USB 1, USB 2, ETH 1 and
      ETH 2 (10/100/1000), prints "ENV" under the upper black RJ45 jack and "Serial/Link" above the lower one, and a RESET legend
      over a dot above the navigation button. Which of the two black jacks is the environment jack is read from where the labels stand
      (gaps: env-serial-labels).
  capability:
    confidence: datasheet
    note: >-
      datasheet - "Outlet switching Yes" and "Switchable Metered-by-Outlets", so `outlet-switching: true`, each outlet states on and off, and the
      metering is per outlet (`metering-scope: outlet`).
