kind: device
name: pdu31116
version: 0.1.0
maturity: modelled
manufacturer: CyberPower
model: PDU31116
description: CyberPower PDU31116 monitored rack PDU, 0U, 100 to 120 V, 15 A, single phase. A black metal strip 1349 mm long, 48 mm wide and 56 mm deep for
  a rack's vertical channel. Twenty NEMA 5-15R outlets run along the front in two groups of ten, with a display module between them. The module holds a
  display, Select and Enter buttons, lamps, an Ethernet jack, three RJ45 jacks and a USB jack. A fixed 10 ft cord with a NEMA 5-15P plug leaves one end.
  No document shows the rear.
profile: power
provenance:
  method: {confidence: estimated, note: 'ESTIMATED. The data sheet holds two pictures, no drawing and no manual. Page 1 is an angled photograph of the
      whole strip, 1915 x 404 px. Page 2 is an orthographic view of the display module, 1887 x 1802 px at 435 ppi. Along the strip every position comes
      from page 1. It is taken from the right and above, so it is NOT orthographic. The left edges of the outlet blocks were read twice on 2x and 4x
      crops. A one-axis projective map was fitted to them, with one pitch inside each group of ten (rms 0.4 px). The length of the front, 1349 mm,
      fixes the scale and gives a pitch of 33.2 mm. Each position along the strip is good to about 2 mm. The module and everything on it is refitted
      from page 2. Its edges were read twice: 988 px along by 326.5 px across, which is 3.03 to 1. The scale on page 2 is 7.55 px/mm, from the RJ45
      contact pitch, the USB-A shell and the 5-15R face in the same picture. That gives a module 130.9 mm long, and page 1 reads 130.9 and 131.4 mm
      along. The same scale gives a front band 56.6 mm across, against the 48 mm the data sheet states (gaps: front-width). The front is drawn 48 mm
      wide, so across the strip each position is good to about 3 mm. The strip is drawn standing, cord end down, as the library draws a rack-side
      strip. Both pictures show it lying with the cord at the left.'}
  mount: {confidence: datasheet, note: 'datasheet - CyberPower PDU31116 data sheet, page 2: "Rack Height 0U", "Vertical Rackmount", "Wallmount", "Adjustable
      Mounting Brackets 1 set". No bracket is shown or dimensioned (gaps: mounting-brackets).'}
  chassis: {confidence: datasheet, note: 'datasheet - CyberPower PDU31116 data sheet, page 2: "48 x 1349 x 56 mm" (W x H x D). The same page gives "1.9
      x 53.1 x 2.2 in.", "Rack Height 0U" and weight 5.22 kg. The finish is black.'}
  front: {confidence: photo-measured, note: 'photo-measured - millimetres along the strip from the cord end of the front, then across from the lid side.
      Outlet blocks 1 to 10 start at 357.0 and then every 33.2. Blocks 11 to 20 start at 1007.0 on the same pitch. Each block is 29 mm long. The display
      module runs from 854.0 to 985.0 along and 2.4 to 45.6 across (131.0 x 43.2). The Select and Enter ring centres are at 866.3 along and 18.0 and 35.2
      across. That is 1.2 mm nearer the cord end than page 2 reads, so that their boxes clear the box of the Critical lamp. The display centres at 900.6 along and 24.0 across. Positions along come off page 1 and positions on the module off page 2 (gaps:
      front-width).'}
  outlets: {confidence: datasheet, note: 'datasheet - the data sheet, pages 1 and 2: "20 x NEMA 5-15R", "Outlet Total 20 Front, 0 Rear", "Outlet Banks 1".
      The photograph numbers them 1 to 20 from the cord end. The library''s 5-15R face (std/nema-5-15r@1) sets the outlet size (gaps: outlet-size).'}
  input: {confidence: datasheet, note: 'datasheet - "Input Plug Type NEMA 5-15P", "Plug Style Straight", "Cord Length 10 ft (3.0 m)", derated input current
      12 A and maximum 15 A. The photograph shows the cord leaving one end.'}
  controller: {confidence: datasheet, note: 'datasheet - page 1 "Meter Readout" lists kilowatts, voltage, amperage and IP address. Page 2 lists "Hardware
      Connection Port RJ45" and "Serial", and the lamps "Load", "Tx/Rx", "LINK" and "Outlets". Page 2 shows the module and its legends (gaps: port-labels).'}
  capability: {confidence: datasheet, note: 'datasheet - "Monitored PDU: SNMP Network Interface" and a meter readout, so the input is metered. No outlet
      switching is stated, so `outlet-switching: false`.'}
