gaps:
- what: rear
  scope: [rear]
  reason: needs-photo
  note: no document shows the rear. The data sheet states 0 rear outlets, so none is drawn. It also states an external site ground and a cord retention
    tray without a position. The rear is left unshown.
  wanted: a photograph of the back, or the installation guide.
- what: mounting-brackets
  scope: [rear, left, right]
  reason: needs-drawing
  note: the data sheet lists one set of adjustable mounting brackets and vertical and wall mounting. No document shows a bracket, a keyhole or a button,
    or gives a hole spacing. So none is drawn and the mount is stated without a figure.
  wanted: the installation guide, or a photograph of the back.
- what: ends
  scope: [top, bottom]
  reason: needs-photo
  note: the photograph sees each end at a steep angle, about 24 px wide for 56 mm. It shows a seam and a notch at each edge of the cap. The notches are
    drawn as two slots at estimated positions. The cord's position on its end is not shown, so the cord is centred on the end.
  wanted: straight-on photographs of both ends, with a scale.
- what: other-side
  scope: [right]
  reason: needs-photo
  note: built as the documented side, as no document shows this one. The photograph shows the upper long side only, and the lower side is drawn as its mirror.
  wanted: a photograph of the lower long side.
- what: front-angled-photograph
  scope: [front]
  reason: needs-photo
  note: the front is read off one angled photograph, so every position is good to about 2 mm. The across positions are less certain than those along the
    strip.
  wanted: a straight-on photograph of the front, with a scale.
- what: outlet-size
  scope: [front]
  reason: needs-drawing
  note: the photograph reads each outlet block about 29 mm along the strip and 25.5 mm across. The library's 5-15R face is 27 mm square, and it is used.
  wanted: a dimensioned drawing of the outlet block.
- what: port-labels
  scope: [front]
  reason: vendor-silent
  note: no manual is held. The photograph prints Tx/Rx Link beside the silver Ethernet jack. It prints In/ENV beside the upper black jack, Out beside the
    lower one, Serial beside the right-hand one and USB beside the USB jack. The black jacks are typed rj45-serial, as on the PDU41021. What each carries
    is not stated.
  wanted: the installation guide's port table.
- what: control-panel-parts
  scope: [front]
  reason: needs-drawing
  note: the Select and Enter buttons are plain rings about 10 mm across in the photograph, each printed with its name. The part drawn for them is the PDU81001G's
    navigation button, 14 mm square with four arrows. It paints over a legend, so the two names are not drawn. It stands 3.0 mm nearer the cord end than
    the ring, so that it clears the lamps. The display is that unit's graphic display part, light grey where the photograph's screen is black.
  wanted: a straight-on photograph of the control panel.
- what: lamp-colours
  scope: [front]
  reason: vendor-silent
  note: 'the lamps are drawn off. The photograph shows them lit. Each declared colour is the mean of the lit pixels in a 7 by 7 patch. The round lamp is
    #def22d (10 pixels), Normal #edef0e (5), Warning #ead70f (6) and Critical #f9090b (4). The Normal lamp reads yellow there, which may be exposure. No
    document states a colour or a meaning.'
  wanted: the installation guide's lamp table.
- what: numbering-direction
  scope: [front]
  reason: vendor-silent
  note: the photograph prints 1 to 20 from the cord end to the far end. The strip is drawn standing with the cord end down. No document says which way it
    is installed.
  wanted: the installation guide.
- what: manual
  scope: [front, rear]
  reason: needs-drawing
  note: no manual is held for this model, and neither held family manual names it. The breaker or protection, the bank wiring and the ground pin are not
    stated.
  wanted: the PDU31116 user manual from the maker's page.
