gaps:
- what: rear
  scope: [rear]
  reason: needs-photo
  note: no document shows the rear. The data sheet states 0 rear outlets, so none is drawn. It also states an external site ground and a cord retention
    tray without a position. The rear is left unshown.
  wanted: a photograph of the back, or the installation guide.
- what: mounting-brackets
  scope: [rear, left, right]
  reason: needs-drawing
  note: the data sheet lists one set of adjustable mounting brackets and vertical and wall mounting. No document shows a bracket, a keyhole or a button,
    or gives a hole spacing. So none is drawn and the mount is stated without a figure.
  wanted: the installation guide, or a photograph of the back.
- what: ends
  scope: [top, bottom]
  reason: needs-photo
  note: page 1 sees each end at a steep angle, about 34 px wide for the 48 mm depth. It shows a seam and a notch at each edge of the cap. The notches
    are drawn as two slots at estimated positions, read as fractions of the face. The cord leaves the cord end about 0.9 mm above its middle height,
    which is 1.2 px of a 71 px face. Then it curves down. How far into the 48 mm depth it leaves is not shown, so the cord is placed at mid-depth.
  wanted: end-on photographs of both ends, with a scale.
- what: other-side
  scope: [right]
  reason: needs-photo
  note: built as the documented side, as no document shows this one. The photograph shows the upper long side only, and the lower side is drawn as its mirror.
  wanted: a photograph of the lower long side.
- what: vent-slits
  scope: [left, right]
  reason: needs-photo
  note: page 1 shows the louvre slits about 3 px apart along the strip, about 36 of them in a 110 px stretch. At about 1 px per mm that is a 3.0 mm pitch,
    good to about 0.4 mm. The slit is drawn 1.4 mm thick and 6.0 mm long, estimated from 12x crops as a fraction of the 48 mm depth. The small dot at the far end sits about
    16.0 mm from the front and is about 1.6 mm across, estimated from one 8x crop.
  wanted: a photograph of the lid taken square on, with a scale.
- what: dimension-labels
  scope: [front, top, bottom, left, right]
  reason: sources-disagree
  note: 'the data sheet prints "48 x 1349 x 56 mm" as W x H x D. That puts 48 on the front. Both pictures read the front face
    as 56. Page 2 reads the band 56.6 mm at 7.55 px per mm. Page 1 reads 56.0, 56.7 and 55.0 mm against the module and the two holes. A 48 mm front
    would make the module 36.7 mm wide, which page 2 does not show. The picture, not the label order, decides it. The front is drawn 56 wide and 48
    deep, so both sheet figures are kept and only their assignment changes. No picture reads the 48 mm depth.'
  wanted: a dimensioned drawing of the end, or the installation guide dimension table.
- what: outlet-size
  scope: [front]
  reason: needs-drawing
  note: the photograph reads each outlet block about 29 mm along the strip and 25.5 mm across. The library's 5-15R face is 27 mm square, and it is used.
  wanted: a dimensioned drawing of the outlet block.
- what: port-labels
  scope: [front]
  reason: vendor-silent
  note: no manual is held. Page 2 prints Tx/Rx and Link beside the silver Ethernet jack. It prints In / ENV beside the upper black jack and Out beside
    the lower one. Serial is printed beside the right-hand one and USB beside the USB jack. The black jacks are typed rj45-serial, as on the PDU41021. What each carries
    is not stated.
  wanted: the installation guide's port table.
- what: display-and-marks
  scope: [front]
  reason: needs-drawing
  note: 'page 2 shows a black screen with a pale grey header, four white readout lines and 1/2. The shared display part draws a pale screen and carries
    no text. It is used as it is. Page 2 also prints Select and Enter on the two rings, and a dark surround and silver tongue on the USB jack. The ring
    names are not drawn. The USB part draws a silver ring and the blue tongue of USB 3.0, which the data sheet does not state.
    The two module screws are drawn as discs with an upright cross slot. Page 2 shows the slot turned 45 degrees, which a decor box cannot draw.'
  wanted: a display part with a black screen and its text, and a USB part with a dark surround, if the maintainer wants them.
- what: lamp-meanings
  scope: [front]
  reason: vendor-silent
  note: 'the lamps are drawn off. Page 2 shows them lit. The power lamp is #9de916 (533 lit pixels), Normal #fbfb04 (111), Warning #faba04 (77) and
    Critical #f90304 (113). The two Ethernet lamps are #bfe387 and #e7e31c, each a 7 by 7 patch of 49 pixels. The legends are printed with a dash
    before them, and Tx/Rx and Link sit beside the two Ethernet lamps. The lamp legends are drawn at 1.9 mm, a little under their printed size, so that they clear the display part. No held document says what a lamp state means or whether a lamp blinks.'
  wanted: the installation guide's lamp table.
- what: numbering-direction
  scope: [front]
  reason: vendor-silent
  note: the photograph prints 1 to 20 from the cord end to the far end. The strip is drawn standing with the cord end down. No document says which way it
    is installed.
  wanted: the installation guide.
- what: manual
  scope: [front, rear]
  reason: needs-drawing
  note: no manual is held for this model, and neither held family manual names it. The breaker or protection, the bank wiring and the ground pin are not
    stated.
  wanted: the PDU31116 user manual from the maker's page.
