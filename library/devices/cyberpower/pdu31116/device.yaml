name: pdu31116
version: 0.1.0
maturity: modelled
manufacturer: CyberPower
model: PDU31116
description: CyberPower PDU31116 monitored rack PDU, 0U, 100 to 120 V, 15 A, single phase. A black metal strip 1349 mm long, 56 mm wide and 48 mm deep for
  a rack's vertical channel. Twenty NEMA 5-15R outlets run along the front in two groups of ten, with a display module between them. The module holds a
  display, Select and Enter buttons, lamps, an Ethernet jack, three RJ45 jacks and a USB jack. A fixed 10 ft cord with a NEMA 5-15P plug leaves one end.
  No document shows the rear.
profile: power
provenance:
  method: {confidence: estimated, note: 'ESTIMATED. The data sheet holds two pictures, no drawing and no manual. Page 1 is an angled photograph of the
      whole strip, 1915 x 404 px. Page 2 is an orthographic view of the display module, 1887 x 1802 px at 435 ppi. Along the strip every position comes
      from page 1. It is taken from the right and above, so it is NOT orthographic. The left edges of the outlet blocks were read twice on 2x and 4x
      crops. A one-axis projective map was fitted to them, with one pitch inside each group of ten (rms 0.4 px). The length of the front, 1349 mm,
      fixes the scale and gives a pitch of 33.2 mm. Each position along the strip is good to about 2 mm. Page 2 reads outlet 11 and the holes 1.9
      and 1.1 mm further along than drawn, inside that figure. The module and every feature page 2 shows across the face are placed from page 2.
      Its edges were read twice: 988 px along by 326.5 px across, which is 3.03 to 1. The scale on page 2 is 7.55 px/mm, from the RJ45
      contact pitch, the USB-A shell and the 5-15R face in the same picture. That gives a module 130.9 mm long, and page 1 reads 130.9 and 131.4 mm
      along. The same scale gives a front band 56.6 mm across. Page 1 reads the front 56.0, 56.7 and 55.0 mm across (gaps: dimension-labels). So the
      front is drawn 56 mm wide and 48 mm deep, centred on the band at 28 mm across. The large logo and the end details are read from page 1 as
      fractions of the face. Across the strip each position is good to about 1 mm where page 2 shows it and about 3 mm where only page 1 does.
      The strip is drawn standing, cord end down, as the library draws a rack-side strip. Both pictures show it lying with the cord at the left.'}
  mount: {confidence: datasheet, note: 'datasheet - CyberPower PDU31116 data sheet, page 2: "Rack Height 0U", "Vertical Rackmount", "Wallmount", "Adjustable
      Mounting Brackets 1 set". No bracket is shown or dimensioned (gaps: mounting-brackets).'}
  chassis: {confidence: photo-measured, note: 'photo-measured - CyberPower PDU31116 data sheet, page 2: "48 x 1349 x 56 mm", printed as W x H x D. Both
      pictures read the front as 56 mm, so the front is drawn 56 wide and 48 deep (gaps: dimension-labels). The same page gives "1.9 x 53.1 x 2.2 in.",
      "Rack Height 0U" and weight 5.22 kg. The finish is black.'}
  front: {confidence: photo-measured, note: 'photo-measured - millimetres along the strip from the cord end of the front, then across from the lid side of
      a 56 mm front. Outlet blocks 1 to 10 start at 357.0 and then every 33.2. Blocks 11 to 20 start at 1007.0 on the same pitch. Each block is 29 mm
      long. Across, page 2 reads outlet 11 from 5.1 to 32.5 mm, so every outlet face is placed at 5.3. The numerals stand 4.1 mm tall with their
      baseline 41.8 mm across. The eight holes are 2.6 mm across and centred 20.2 and 35.4 mm across. The display module runs from 854.0 to 985.0 along
      and 6.4 to 49.6 across (131.0 x 43.2), centred on the front. The Select and Enter ring centres are at 866.3 along and 22.0 and 39.2
      across. That is 1.2 mm nearer the cord end than page 2 reads, so that their boxes clear the box of the Critical lamp. The display centres at 900.6
      along and 28.0 across. Positions along come off page 1. Positions across come off page 2, except the large logo and the end details
      (gaps: dimension-labels).'}
  outlets: {confidence: datasheet, note: 'datasheet - the data sheet, pages 1 and 2: "20 x NEMA 5-15R", "Outlet Total 20 Front, 0 Rear", "Outlet Banks 1".
      The photograph numbers them 1 to 20 from the cord end. The library''s 5-15R face (std/nema-5-15r@1) sets the outlet size (gaps: outlet-size).'}
  input: {confidence: datasheet, note: 'datasheet - "Input Plug Type NEMA 5-15P", "Plug Style Straight", "Cord Length 10 ft (3.0 m)", derated input current
      12 A and maximum 15 A. The photograph shows the cord leaving one end.'}
  controller: {confidence: datasheet, note: 'datasheet - page 1 "Meter Readout" lists kilowatts, voltage, amperage and IP address. Page 2 lists "Hardware
      Connection Port RJ45" and "Serial", and the lamps "Load", "Tx/Rx", "LINK" and "Outlets". Page 2 shows the module and its legends (gaps: port-labels).'}
  capability: {confidence: datasheet, note: 'datasheet - "Monitored PDU: SNMP Network Interface" and a meter readout, so the input is metered. No outlet
      switching is stated, so `outlet-switching: false`.'}
