format: 1
kind: device
name: pdu31116
version: 0.1.0
maturity: modelled
manufacturer: CyberPower
model: PDU31116
description: CyberPower PDU31116 monitored rack PDU, 0U, 100 to 120 V, 15 A, single phase. A black metal strip 1349 mm long, 48 mm wide and 56 mm deep for
  a rack's vertical channel. Twenty NEMA 5-15R outlets run along the front in two groups of ten, with a display module between them. The module holds a
  display, Select and Enter buttons, lamps, an Ethernet jack, three RJ45 jacks and a USB jack. A fixed 10 ft cord with a NEMA 5-15P plug leaves one end.
  No document shows the rear.
profile: power
provenance:
  method: {confidence: estimated, note: 'ESTIMATED. NO DIMENSIONED DRAWING, NO STRAIGHT-ON PICTURE AND NO MANUAL EXISTS. Every position on the front is
      read off the one product photograph on page 1 of the PDU31116 data sheet. It is taken from the right and above, so it is NOT orthographic. The strip
      lies along the picture. The left edges of the twenty outlet blocks were read on 4x crops. A one-axis perspective u = A + B / s was fitted to them,
      with one pitch inside each group of ten (rms 0.35 px). The length between the two ends of the front, 1349 mm, fixes the scale, and gives a pitch of
      33.2 mm. The ends of the front were read by eye at columns 207 and 1770. That is good to about 1 percent of the length. Across the strip the vertical
      scale is the front''s own height, 113 px for 48 mm at the right end. Each position is good to about 2 mm. The strip is drawn standing, cord end down,
      as the library draws a rack-side strip. The picture shows it lying with the cord at the left.'}
  mount: {confidence: datasheet, note: 'datasheet - CyberPower PDU31116 data sheet, page 2: "Rack Height 0U", "Vertical Rackmount", "Wallmount", "Adjustable
      Mounting Brackets 1 set". No bracket is shown or dimensioned (gaps: mounting-brackets).'}
  chassis: {confidence: datasheet, note: 'datasheet - CyberPower PDU31116 data sheet, page 2: "48 x 1349 x 56 mm" (W x H x D). The same page gives "1.9
      x 53.1 x 2.2 in.", "Rack Height 0U" and weight 5.22 kg. The finish is black.'}
  front: {confidence: photo-measured, note: 'photo-measured - millimetres along the strip from the cord end of the front, then across from the photograph''s
      upper edge. Outlet blocks 1 to 10 start at 357.0 and then every 33.2. Blocks 11 to 20 start at 1007.0 on the same pitch. Each block is 29 mm long.
      Display module from 853.2 to 985.9 along and 5.5 to 42 across. The Select and Enter buttons centre at 864.8 along and 18.4 and 33.1 across. The display
      centres at 901.5 along. Each position comes off an angled photograph (gaps: front-angled-photograph).'}
  outlets: {confidence: datasheet, note: 'datasheet - the data sheet, pages 1 and 2: "20 x NEMA 5-15R", "Outlet Total 20 Front, 0 Rear", "Outlet Banks 1".
      The photograph numbers them 1 to 20 from the cord end. The library''s 5-15R face (std/nema-5-15r@1) sets the outlet size (gaps: outlet-size).'}
  input: {confidence: datasheet, note: 'datasheet - "Input Plug Type NEMA 5-15P", "Plug Style Straight", "Cord Length 10 ft (3.0 m)", derated input current
      12 A and maximum 15 A. The photograph shows the cord leaving one end.'}
  controller: {confidence: datasheet, note: 'datasheet - page 1 "Meter Readout" lists kilowatts, voltage, amperage and IP address. Page 2 lists "Hardware
      Connection Port RJ45" and "Serial", and the lamps "Load", "Tx/Rx", "LINK" and "Outlets". The photograph shows the module and its legends (gaps: port-labels).'}
  capability: {confidence: datasheet, note: 'datasheet - "Monitored PDU: SNMP Network Interface" and a meter readout, so the input is metered. No outlet
      switching is stated, so `outlet-switching: false`.'}
