  width: 440
  height: 43.5
  depth: 302
  ru: 1
  weight-kg: 4.75
gaps:
- what: port-led-semantics
  scope: [rj45-1g, sfp-plus, sfp28, qsfp28, port-leds]
  reason: vendor-silent
  note: >-
    HIG section 10 tables the five system lamps (GNSS, SYNC, STAT, FAN, PWR), the PSU and
    Fan FRU lamps and the management jack, and gives no table at all for the port lamps.
    Figure 9 draws an up/down green pair in the web of every SFP+ and SFP28 column and two
    lamps in the QSFP28 web, so which port each lamp belongs to is clear from the arrows;
    what its colours and behaviours MEAN is not stated. Every port lamp therefore keeps
    common/led-dot's off/on default rather than an invented link/activity vocabulary. The
    same guide annotates nine rows of the system-lamp tables 'need NOS to activate this
    feature', so these may be NOS-defined rather than merely undocumented - which is a
    different fix, and the reason this is vendor-silent rather than nos-dependent.
  wanted: >-
    a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a live unit with
    ports in known states
- what: port-block-height
  scope: [sfp-plus, sfp28, rj45-1g, qsfp28]
  reason: sources-disagree
  note: >-
    HIG Figure 9 draws the ganged shells 25.5 mm tall, which cannot hold two 10.4 mm SFP
    openings on any manufacturable belly-to-belly pitch; the front photograph and
    std/sfp-ganged's own TE-measured 15.00 mm row pitch require 27.6 mm. The manifest
    carries 27.6 and the 15.0 mm pitch, and the whole port band therefore sits 1.05 mm
    higher at the top and 1.05 mm lower at the bottom than the guide figure draws it. The
    figure had already failed the aspect gate by 2.1 percent in the same direction, which
    is why the photograph was preferred rather than split the difference.
  wanted: a vendor mechanical drawing of the faceplate, or a caliper on the shell
- what: fan-numbering
  scope: [fans]
  reason: needs-photo
  note: >-
    Each fan carries a two-line legend on the chassis web beside it - the word FAN over an
    arrow and one digit - in the same position and the same form as the S9301-32D's rear.
    At the rear render's 1.168 px/mm the digit is not legible at any zoom, so the numbering
    is carried 0-based to match this device's own port table (0~3, 4~11, 12~19, 20~21) and
    the S9301-32D's rear rail, and NOT the sibling S9510-28DC, which prints FAN-1 to FAN-5
    and is 1-based. Two house precedents disagree and no held image of this device settles
    it. The legend is also not DRAWN on the faceplate: it sits inside the module's own
    flange area and the chassis web between bays is 0.9 mm, so a chassis mark there would
    be painted over by the seated fan. The group numbering carries the fact; the drawing
    does not.
  wanted: a legible photograph of the rear fan bays, or a rear elevation figure
- what: fru-power-unpublished
  scope: [ufispace/fan-402825@1, fans]
  reason: vendor-silent
  note: >-
    Searched and absent, and this is the SAME silence the sibling S9510-28DC already
    records for the same fan rather than a second independent reading: the HIG dimensions
    and weighs the fan FRU (51.5 x 57.8 x 42.2 mm, 90 g) and tables its LED without ever
    stating a wattage, and this device's own datasheet names FAN-402825-HD only as an
    ordering line. The PSUs are sourced from their model numbers (PSU-201, 200 W); the fan
    has no equivalent, so L29 stands and the chassis module total is a floor.
  wanted: a photograph of the fan module's label, or a UfiSpace FRU datasheet
- what: chassis-sku
  scope: [ac, dc]
  reason: vendor-silent
  note: >-
    No held document prints an orderable chassis part number - the datasheet and the HIG
    name only S9500-22XST, and the Available to Order section names only PSU-201-DISB,
    PSU-201-AISB and FAN-402825-HD. Per the S9510-28DC precedent in this library, whose
    -BN0B and -BR1B SKUs surfaced from the owner and from no PDF, orderable SKUs for the
    AC and DC builds exist somewhere; the configurations therefore carry no part-numbers
    rather than invented ones.
  wanted: a UfiSpace ordering guide or a quote naming the chassis SKUs
- what: system-lamp-size
  scope: [status-leds]
  reason: needs-hardware
  note: >-
    The five system lamps measure 3.3 x 3.0 mm in Figure 9 and the library's nearest part,
    common/led-rect@1, is 4.6 x 2.6 - wider and shorter than the drawn lamp. It is used
    here because it is what the sibling S9510-28DC carries for the identical five-lamp row
    and because this device may not add components, but on the measured 6.85 mm pitch it
    closes the printed gap between neighbours from 3.5 mm to 2.25 mm.
  wanted: a square ~3.2 mm indicator component, or a caliper on the lamp window
groups:
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 hot-swappable'
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '2+1'
      redundancy-note: '2+1 - 2+1 hot-swappable (attrs fan-redundancy)'
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the timing block at the centre of the faceplate - a GNSS antenna input, 1PPS in and
      out and 10MHz in and out all on SMA, BITS on RJ48 and ToD on RJ45. Five media, one
      job, and the vendor draws and labels them as one block
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster - the out-of-band RJ45, the USB 2.0 service port, and the
      RS-232 console, which the datasheet lists as one port on two connectors (an RJ45 and
      a micro-USB), plus the recessed reset button
  rj45-1g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g}
    description: the four 100M/1G copper ports, vendor numbers 0-3 (HIG port table)
