format: 1
kind: device
name: s9500-22xst
version: 0.2.3
maturity: modelled
manufacturer: UfiSpace
model: S9500-22XST
portfolio:
  line: Telecoms
  family: Disaggregated Cell Site Gateway Router
  series: S9500 Series
description: >-
  UfiSpace S9500-22XST disaggregated cell site gateway router - 1RU temperature-hardened
  white box, 4x 100M/1G RJ45 plus 8x SFP+ 10G, 8x SFP28 25G and 2x QSFP28 100G, a full
  timing block (GNSS, 1PPS and 10MHz on SMA, BITS on RJ48, ToD on RJ45) with a Stratum 3E
  OCXO and an internal GNSS receiver, Broadcom Qumran-AX at 300 Gbps; two front-service
  1+1 PSUs and three rear 2+1 fans
provenance:
  sources: >-
    UfiSpace S9500-22XST datasheet (working/intake/ufispace/converted/s9500-22xst-datasheet)
    for dimensions, weight, port inventory, platform, timing, power, environment,
    compliance and the FRU ordering lines; S9500-22XST Hardware Installation Guide
    (s9500-22xst-hig) for the Port Overview elevation, the Component Physical Information
    table, the Figure 5 overview drawing, the LED tables, grounding and rack mounting;
    three vendor product renders (photos/s9500-22xst-1-angle, -2-front, -3-rear) for
    colour, counts, construction, and for two measurements the drawings could not settle.
    FIGURE QUALITY WAS GATED FIRST AND ONE FIGURE FAILED. The HIG Port Overview (Figure 9,
    page 12 of the PDF at 600 dpi) measures 3766 x 380 px across the 440 x 43.5 mm face:
    aspect 9.90 against a true 10.115, 2.1 percent out, so it is NOT orthographic and its
    absolute vertical scale is not used. Its horizontal scale is trusted, and was
    validated rather than assumed - at 8.559 px/mm the SFP+ ganged shell measures
    59.52 mm, which is 4 x 14.25 (the SFF-8433 port pitch) plus a 1.26 mm flange each
    side, and the PSU latch-to-latch pitch comes out at 58.77 mm against the 58.7 mm the
    sibling S9510-28DC carries for the same PSU form factor. The Figure 5 top-view
    drawing on page 10 DOES pass: 2182 x 1488 px against 440 x 302 mm is aspect 1.466
    versus a true 1.457, 0.6 percent, so the top face is measured rather than
    proportioned.
  chassis: >-
    datasheet - 'Chassis (W x D x H) 1RU, 440 x 302 x 43.5 mm', weight 4.75 kg without
    FRU; the HIG Component Physical Information table repeats the same triple
    (17.32" x 11.89" x 1.71") and gives 4.75 kg. NOTE the sibling S9510-28DC carries
    4.9 kg for the same 440 x 302 x 43.5 body - that is a different product's figure, not
    a disagreement about this one. 440 is the body: the HIG ships a separate 50.4 x 43 x
    20 mm rack mount bracket as accessory 3, so the 19 inch mounting hardware is
    additional to 440 and is not drawn. The Figure 5 depth dimension confirms 302 mm for
    the chassis and calls out 327.4 mm over the projecting PSU handles (27 mm).
  front-vertical: >-
    THE FIGURE AND THE PHOTOGRAPH DISAGREE HERE AND THE PHOTOGRAPH WINS. All four port
    blocks share one vertical band. Figure 9 draws the ganged shells spanning y 9.4-34.9
    (25.5 mm), which leaves room for two 10.4 mm SFP openings only on a 12.7 mm
    belly-to-belly pitch - a 2.3 mm web, which no stacked SFP cage has. The front
    photograph, whose apertures are real holes rather than drawn module faces, shows the
    silver web between the rows spanning 5.1 mm and the openings centred 14.6 mm apart;
    5.1 mm of web with 10.4 mm openings IS the standard 15.0 mm pitch that
    std/sfp-ganged's own contract records as measured from a TE 2007562-6 cage. So the
    rows are modelled at a 15.0 mm pitch and the shells are 27.6 mm tall - 2.1 mm taller
    than Figure 9 draws them, which is the same 2 percent the aspect gate already caught,
    in the same direction. The other three blocks are centred on the same two row centres
    because the photograph shows one continuous silver band across all four. THE WHOLE
    BAND WAS THEN MOVED DOWN 0.8 mm by the matched-scale comparison: rendered at the
    photograph's own 8 px/mm, the first draft's apertures sat 0.5, 0.95 and 1.0 mm high on
    the RJ45, SFP+ and QSFP28 blocks respectively - three independent blocks, all the same
    direction - so 0.8 mm was taken off the whole band rather than any one block. Final
    openings: SFP rows at y 10.35 and 25.25, the 1G jacks at 10.05 and 24.95, the QSFP28
    pair at 10.48 and 25.38, shells 9.2-36.8. The residual is about 0.85 mm, which is one
    pixel of the photograph and the honest limit of this face's vertical placement.
  front-layout: >-
    drawing - HIG Figure 9 at 8.559 px/mm, measured on the 600 dpi page render; x
    positions good to about 0.3 mm, y taken from the photograph per the front-vertical
    note. Left to right: PSU0 and PSU1 front-service bays on a measured 58.77 mm pitch;
    the system-lamp row and the timing block (five SMA jacks, the BITS/ToD stack); the
    management stack (RJ45 out-of-band, USB 2.0 Type-A, RJ45 console) with a micro-USB
    console beside it; then the four port blocks, each in its own silver ganged shell,
    with honeycomb vent fields above, below and between them. Shell extents measured off
    the silver mask: RJ45 215.10-246.73, SFP+ 259.22-318.74, SFP28 333.45-392.97, QSFP28
    409.43-430.32. Every block's flange comes out at 1.2-1.3 mm per side against the
    standard opening it holds, which is the check that the shells and the parts agree.
  rj45-pitch: >-
    measured, AND IT IS NOT THE PART'S OWN PITCH. The four 100M/1G jacks sit two wide in a
    31.63 mm shell; taking the same 1.27 mm flange the other blocks show leaves 29.09 mm
    for two columns, so the vendor's column pitch is 14.55 mm. std/rj45-ganged is 12.7 mm
    wide - the per-port aperture of a block whose instances abut - so the two jacks here
    do NOT abut: they are centred in their columns at 217.30 and 231.84, leaving 1.85 mm
    of shell between them. That was cross-checked against the drawn jack faces in Figure 9
    at 3.5x (218.5-230.7 and 232.5-244.7), which agree to 1.2 mm. The silver strips are
    drawn as panel.decor per the S9510-28DC precedent, because std/rj45-ganged draws the
    opening only.
  jack-orientation: >-
    THE FIRST DRAFT HAD THIS BACKWARDS ON THE 1G BLOCK AND THE MATCHED-SCALE RENDER CAUGHT
    IT, so both readings are recorded. std/rj45-ganged draws the latch keyway DOWN and its
    gold contacts at the TOP, and on a real jack the integrated lamps sit at the contact
    end, opposite the latch. The four 100M/1G jacks show their lamps at the TOP corners on
    the upper row and the BOTTOM corners on the lower, so the UPPER row is unrotated and
    the LOWER carries rotate: 180 - the reverse of what this file first said, which had
    reasoned from common/rj45-port@4 (a different part, which composes std/rj45 already
    turned 180) and got the sense inverted. What settled it was measuring the rendered
    contact band against the photograph's at 8 px/mm: the vendor's upper jacks have their
    contacts high and the lower jacks low, and the first draft rendered the opposite. The
    two stacked TIMING jacks were read directly from the silhouette at 7x and are
    genuinely mirrored the other way - BITS above with its latch notch UP (rotate: 180),
    ToD below with it down - as is the management stack, whose top out-of-band RJ45 is
    keyway-up with its green lamp at the top right and whose bottom console RJ45 is
    keyway-down.
  cage-mirroring: >-
    photo-measured, and it says the stacked optical rows are NOT belly-to-belly. Rotating
    a std/sfp-ganged moves its drawn cavity 1.13 mm across the 10.4 mm opening, so the
    apparent pitch between the two rows' dark cavities is 15.0 mm if the rows share an
    orientation and 12.7 or 17.3 mm if they mirror. The front photograph rendered to the
    same 8 px/mm as the model gives 15.4 mm; the first draft, with the lower row turned
    180, rendered 12.65. Both SFP+ and SFP28 rows are therefore drawn unmirrored, which is
    also what the sibling S9510-28DC carries for its stacked SFP28 rows. The QSFP28 pair
    cannot be tested this way - std/qsfp28's cavity is symmetric, so rotation is invisible
    - and is left unrotated rather than asserting a mirroring the two testable blocks
    both contradict.
  timing-block: >-
    drawing - five SMA jacks, measured from the gold mask as three columns at x 125.30,
    140.20 and 155.20 (14.95 mm pitch, 9.8 mm outside diameter against common/sma-jack's
    9.5) on two rows at y centres 16.98 and 29.93. The left column carries only the lower
    jack, which is GNSS ANT; the other two columns carry 1PPS IN/OUT above and 10MHZ
    IN/OUT below, exactly as the printed legends run - IN, 1PPS, OUT under the top row and
    GNSS ANT, IN, 10MHZ, OUT under the bottom. The datasheet's timing list (1x GNSS input
    SMA, 1x 1PPS input/output SMA, 1x 10MHz input/output SMA) reads as three interfaces
    and the faceplate has five jacks, because the in/out pairs are two connectors each;
    that is not a conflict and both are recorded. BITS is on RJ48 and ToD on RJ45 per the
    datasheet, stacked in one 15.07 mm shell under the printed 'BITS (up)(down) TOD'.
  mgmt-block: >-
    drawing - one 15.77 mm silver shell at x 184.17 holding, top to bottom, the
    100/1000M out-of-band RJ45, a USB 2.0 Type-A and the RS-232 console RJ45; the silver
    cross-bars inside it were measured at y 6.41-7.10, 16.60-19.00, 24.38-27.13 and
    35.60-36.97 and the three parts are centred in the openings between them. The
    micro-USB console sits separately at x 166.10 under its own IOIO legend, with the
    network symbol beside it; the datasheet lists it as one port - '1 x RJ45 & Micro USB
    serial console port' - so the RJ45 console and the micro-USB are two connectors on one
    interface and are grouped together. Legends 'IOIO' above and the USB/arrow/IOIO line
    below the stack are transcribed as printed.
  system-lamps: >-
    drawing - five lamps on a regularised 6.85 mm pitch at x centres 134.37, 141.22,
    148.07, 154.92 and 161.77, y centre 9.62, under the printed RST GNSS SYNC STAT FAN PWR
    row at baseline 6.2. The individual measured pitches ran 6.66-6.95 and were put on one
    pitch rather than drawn staggered, per the house rule for a lamp row that shares a
    baseline on the real device. THE LAMPS ARE DRAWN WIDER THAN THEY MEASURE: the green
    fill measures 3.3 x 3.0 mm and common/led-rect@1 is 4.6 x 2.6, which is the closest
    part in the library and the one the sibling S9510-28DC uses for this same five-lamp
    row; on a 6.85 mm pitch it leaves a 2.25 mm gap rather than the drawn 3.5 mm. Said
    here because nothing else records it. LED semantics from the HIG section 10 tables.
  port-numbers: >-
    drawing - the HIG port table numbers the faceplate 0~3 RJ45, 4~11 SFP+, 12~19 SFP28,
    20~21 QSFP28, and Figure 9 prints each number twice: once LARGE on the drawn module
    face, where a seated transceiver would cover it, and once SMALL on the metal above or
    below its block. The small marks are the silkscreen and are what is modelled, at
    baselines 7.9 (upper row) and 37.9 (lower). On the SFP28 block those marks sit on
    yellow printed bands - measured at x 334.5-392.7, y 6.2-8.4 and 36.0-38.2 - which are
    faceplate paint and are drawn as panel.decor so the numbers print over them. The other
    three blocks have no band and their numbers are white on bare metal.
  port-lamps: >-
    drawing - each SFP+ and SFP28 column carries a green up/down lamp PAIR in the silver
    web between its two rows (four pairs per block, read at 2.2x), so one lamp serves the
    upper port and one the lower; the QSFP28 stack carries two lamps in the same position.
    What they mean is not stated anywhere - see the port-led-semantics gap - so every one
    keeps common/led-dot's off/on default. The four 100M/1G jacks carry their lamps inside
    the jack, which is why they are not placed separately.
  rear-layout: >-
    photo-measured - no held figure draws the rear elevation, so it is taken from the rear
    product render at 1.168 px/mm (width-derived; that photograph's own aspect is 11
    percent out because the panel detection catches its drop shadow, so only x is used
    from it and the module height comes from the HIG table). Three fan faces measured at
    71.7-123.7, 124.4-175.8 and 176.5-228.6 mm - 51.4 to 52.1 mm wide against the HIG
    table's 51.5 mm fan module, on a 52.4 mm pitch - with plain chassis to their left and a
    honeycomb vent field at 285-422 mm, flat chassis either side of it. That vent extent
    was re-measured against the photograph at matched scale after the first render put its
    left edge 45 mm too far in; the flat panel left of fan 0 carries a faint vertical seam
    that no held document identifies, so nothing is drawn there rather than guessing at a
    cover. The three measured
    pitches came out at 52.7 and 52.1 mm, a 0.6 mm disagreement at a photograph resolving
    0.86 mm per pixel - noise, not a stagger - so the bays sit on one 52.4 mm pitch rather
    than recording an unevenness the source cannot support. Each fan's airflow tag,
    captive screw and status lamp sit on the module, as ufispace/fan-402825@1 draws them.
    NO FAN LEGEND IS DRAWN as chassis silkscreen: the 'FAN <n>' mark sits inside the
    module's own right-hand flange area on the hardware, and the chassis web between bays
    measures 0.9 mm, so there is nowhere on the metal to print it that a seated module
    would not paint over. See the fan-numbering gap.
  views: >-
    Six views. TOP: y = 0 is the REAR, per the house convention and the HIG Figure 5
    drawing, which prints the projecting red fan handles at its top edge and the blue PSU
    latches at its bottom; that drawing passes the aspect gate at 0.6 percent, so the two
    long stadium reliefs and the four short ones are measured from it rather than
    proportioned. BOTTOM mirrors left-right and carries the compliance sticker at an
    estimated position. LEFT (x = 0 is the REAR) and RIGHT (x = 0 is the FRONT): the HIG
    section 8 puts the grounding lug on the side of the chassis and the Figure 5 callout
    inset shows it on the RIGHT side near the front, which is where the two-hole lug is
    drawn - the one asymmetric feature on either side face, and the reason the depth-axis
    convention on those two views is load-bearing here rather than merely stated. Screw
    positions on both side faces are estimated; no drawing dimensions them.
  attrs: >-
    datasheet - Physical, Performance, Environmental, Regulatory Compliance, Timing and
    Accessories sections, transcribed into sections. Compliance strings kept verbatim and
    semicolon-separated, untidied. The datasheet's key-features list prints 'IEEE 1558v2'
    where every other line in the same document and the timing row itself print
    IEEE 1588v2; the obvious typo is not propagated and 1588v2 is carried.
  power: >-
    datasheet 'Typical power: 111.8 Watts (no transceiver)' - the vendor's own scope, so
    power-envelope is bare. NO MAXIMUM IS PUBLISHED: the HIG's Connecting Power section
    gives wiring and breaker instructions and states no system wattage, and the datasheet
    prints only the typical figure and the per-feed input ratings (AC 100-240 V 3 A, DC
    -36 to -75 V 8 A). power-max-w is therefore absent rather than derived from the input
    ratings, which would be a supply-side number wearing a draw-side key.
  part-numbers: >-
    The FRU ordering lines are the datasheet's own: PSU-201-DISB (200 W DC, intake air
    flow), PSU-201-AISB (200 W AC, intake air flow) and FAN-402825-HD (exhaust air flow).
    Only ONE fan SKU is listed, so unlike the vendor's data-centre boxes this product line
    offers no back-to-front airflow variant in any held document. NO ORDERABLE CHASSIS SKU
    appears anywhere in the datasheet or the HIG; per the S9510-28DC precedent in this
    library - whose -BN0B and -BR1B SKUs came from the owner and from no PDF - that is
    recorded as a gap rather than as 'no SKU exists'.
  lifecycle: >-
    searched 2026-08-28: 'UfiSpace S9500-22XST end of life end of sale' - no announcement
    found; the vendor product page and the datasheet PDF are live and distributor
    listings carry it. none-announced is a real finding here, not an absence of looking.
attrs:
  performance:
    switching-capacity: 300 Gbps
    packet-buffer: 2 GB deep buffer
  power:
    power-typical-w: '111.8'
    power-envelope: bare
    input-ac: 100 to 240 V, 3 A per feed
    input-dc: -36 to -75 V, 8 A per feed
    psu-redundancy: 1+1 hot-swappable
  thermal:
    fan-redundancy: 2+1 hot-swappable
  environmental:
    operating-temp: -40 to 65 C (temperature hardened)
    operating-humidity: 5 to 85% RH non-condensing
    storage-temp: -40 to 70 C
    storage-humidity: 5 to 93% RH non-condensing
  platform:
    asic: Broadcom Qumran-AX BCM88470
    cpu: Intel Broadwell-DE 4-core @ 1.5 GHz
    memory: 8 GB DDR4 (up to 32 GB)
    storage: 32 GB SSD (up to 128 GB)
    bmc: Aspeed AST2400
  features:
    timing: >-
      Stratum 3E OCXO with optional holdover; ITU-T SyncE; IEEE 1588v2 default, G.8265.1,
      G.8275.1, G.8275.2, SMPTE ST 2059-2 (extra licence), T-GM, T-BC/OC, T-TC; Class C
      accuracy. NOS integration is required to activate the timing features
    gnss: internal receiver for master clock implementations
    timing-interfaces: >-
      GNSS in on SMA, 1PPS in/out on SMA, 10MHz in/out on SMA, ToD in on RJ45, BITS in on
      RJ48 (datasheet Timing Interfaces)
    optics-qsfp28: 100G SR4/LR4/ER4 (datasheet compatible transceiver list)
    optics-sfp28: 25G SR/LR/ER
    optics-sfp-plus: 10G SR/LR/ER/ZR, 1G SX/LX/EX/ZX
    timing-cables: >-
      50 ohm SMA coaxial with 1/4-36UNS-2B for GNSS, 1PPS and 10MHz; shielded RJ45 for
      ToD; shielded RJ48 for BITS (datasheet Compatible Timing Cable Types)
  management:
    console: RJ45 RS-232 and micro-USB, one interface on two connectors (labelled IOIO)
    oob: 1x RJ45 100/1000M out-of-band management
  compliance:
    safety: UL 62368-1; IEC 60950-1; IEC 62368-1; BSMI
    emc: >-
      FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 55024;
      EN 55035; EN 62479; EN 50663; EN 300 386; EN 301 489; EN 303 413; BSMI; VCCI CISPR
      32, Class A
    environment: RoHS; WEEE
  lifecycle:
    eol: none-announced
