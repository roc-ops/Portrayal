configurations:
  base:
    kind: base
    description: >-
      The router as HIG Figure 7 draws it - four FAN-803816-HI exhaust fans and two
      PSU-162-AESR 1600 W AC supplies at the rear, and the thirty-six traffic ports
      empty. No orderable chassis part number appears in any held document; see the
      chassis-sku gap.
    default: true
  ac:
    kind: orderable
    description: >-
      Dual 1600 W AC supplies (PSU-162-AESR), 100 to 240 V at 13 A, 1+1 redundant.
      The build HIG Figure 7 draws; its maximum system power consumption is 621.3 W
      at 45 C with optics fully populated and 100% traffic. The accessory list ships
      two IEC power cords and one grounding lug with this build.
    bays:
      psu-0: ufispace/psu-162-ac@1
      psu-1: ufispace/psu-162-ac@1
  dc:
    kind: orderable
    description: >-
      Dual 1600 W DC supplies (PSU-162-DESR), -40 to -72 V at 50 A, 1+1 redundant,
      each with a 60 A fast-acting fuse and a screw-type two-hole lug terminal block
      behind a plastic cover. Maximum system power consumption 609 W at 45 C with
      optics fully populated and 100% traffic. The accessory list ships five
      grounding lugs and no power cord with this build. See the
      dc-psu-face-mirrored gap: the vendor's rear render shows this face the other
      way round from the component that draws it.
    bays:
      psu-0: ufispace/psu-162-dc@1
      psu-1: ufispace/psu-162-dc@1
  breakout:
    kind: example
    description: >-
      The AC build with the four SFP28 breakout ports fitted with 25G optics. QSFP28
      port 0 is disabled while they are enabled, which is a software state the
      drawing cannot show - the cage is still there and still empty.
    occupants:
      sfp-0: common/sfp-lc-duplex@1
      sfp-1: common/sfp-lc-duplex@1
      sfp-2: common/sfp-lc-duplex@1
      sfp-3: common/sfp-lc-duplex@1
datasheet:
  title: UfiSpace S9600-32X Open Aggregation Router datasheet
  url: https://www.ufispace.com/products/telco/aggregation/s9600-32x-25g-100g-aggregation-router
