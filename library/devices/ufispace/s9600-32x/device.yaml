format: 1
kind: device
name: s9600-32x
version: 2.0.7
maturity: modelled
manufacturer: UfiSpace
model: S9600-32X
portfolio:
  line: Telecoms
  family: Open Aggregation Router
  series: S9600 Series
description: >-
  UfiSpace S9600-32X open aggregation router - 2RU disaggregated white box on
  Broadcom Qumran2c with 2.4 Tbps of switching and 4 GB of deep buffer, carrying
  32x QSFP28 40/100G in eight two-high stacked columns plus 4x SFP28 1/10/25G
  that break out from 100G port 0, and a full timing block (GNSS on SMA, 1PPS and
  10MHz on SMB, ToD on RJ45, Stratum 3E OCXO, SyncE, 1588v2 Class C and TSN);
  four hot-swap fans (3+1) and dual 1600W supplies (1+1) at the rear
profile: networking
provenance:
  sources: >-
    UfiSpace S9600-32X datasheet
    for dimensions, weight, port inventory, platform, timing, power, environment,
    compliance and the FRU ordering lines; S9600-32X Hardware Installation Guide
    (s9600-32x-hig) for the overview figure (Fig 4), the port overview elevation
    (Fig 8), the PSU and fan figures (Figs 5-7), the Component Physical Information
    table, the two maximum-power sentences, the space-clearance paragraph, the
    grounding section and the section 10 LED tables; three vendor product renders
    (photos/s9600-32x-1-view, -2-view, -3-view - unlabelled, identified by content
    as an isometric, a front and a rear) for colour, counts and the DC build.
    Checked for a vendor 3D model before trusting any figure, per the skill: the
    intake stages GLBs for ReadyLinks only and none for UfiSpace.
  scale-gate: >-
    BOTH GUIDE ELEVATIONS PASS GATE 1, which is why this model takes absolute
    geometry off them rather than only fractions. HIG Figure 8's port overview
    (extracted as fig-0014) has a front face of 1289 x 261 px against the stated
    436 x 87.7 mm chassis - aspect 4.939 against a true 4.9715, 0.65% out - giving
    2.9564 px/mm across and 2.976 px/mm down. HIG Figure 7's rear elevation
    (fig-0013) measures 1292 x 261 px, aspect 4.950, 0.44% out, at 2.9633 and 2.976
    px/mm. The two scales are derived independently from two figures and agree to
    0.2%. The three product renders do NOT pass: the front render is 520 px wide,
    a sixth of the guide figure's resolution, and is used for colour and for the
    DC build only.
  chassis: >-
    datasheet - 'Chassis (W x D x H) 2RU, 436 x 762 x 87.7 mm', weight 17.73 kg
    without FRU; the HIG Component Physical Information table repeats both
    ('S9600-32X (W x D x H) 17.16 x 30 x 3.45 in (436 x 762 x 87.7mm)' and 'Chassis
    without FRU 39.09lb (17.73kg)'). 436 is the BODY and not a rack face: the HIG's
    Space Clearance section says 'The S9600-32X width is 17.16 inches (43.6cm) and
    shipped with a rack mount brackets suitable for 19 inch (48.3cm) wide racks', so
    the ears are additional to 436 and are not drawn. 762 mm is the chassis without
    FRUs; the same section projects the fan handles 29 mm and the PSU handles 30 mm
    beyond it, which is why the clearance figure is larger than the depth.
  port-pitch: >-
    drawing - AND TAKEN FROM THE LAMPS, NOT THE CAGE FILLS. Figure 8 draws a
    transceiver face inside every aperture, and those fills are wider than the port
    pitch; measuring between them puts a gutter down each block. The ruler used here
    is the lane-lamp cluster, which repeats once per PORT COLUMN: colour detection
    finds 32 lamps per row in the upper band at centres 294.5 to 763.0 px, in eight
    groups of four on a 11.83 px (4.00 mm) lamp pitch. The eight group centres give
    a within-block column pitch of 19.11, 19.11, 18.95 and 19.11 mm and a
    block-to-block pitch of 42.45, 42.53 and 42.37 mm. 19.0 mm is the ganged QSFP
    pitch std/qsfp-ganged records from a TE 2322551-4 cage, so the measurement
    corroborates the standard rather than the other way round, and the manifest
    carries 19.00 within a block and 42.45 between blocks. Column 0's left edge
    lands at 94.00 mm.
  row-grid: >-
    drawing - four aperture rows on ONE 15.00 mm grid, and the SFP28 quad sits on
    rows 1 and 2 of it. Profiling a column strictly inside a cage gives bezel
    separators at py 131.5, 177 and 221.5 with the block running 89 to 265, i.e.
    row centres 44.67 px (15.01 mm) apart - 15.0 to a hundredth, which is also the
    belly-to-belly pitch std/sfp-ganged records from a TE 2007562-6. Aperture tops
    are therefore 17.05, 32.05, 47.05 and 62.05 mm. The SFP28 shell measures
    16.13 to 42.34 mm vertically; putting its two 10.4 mm apertures on grid rows 1
    and 2 predicts a shell bottom of 42.45, which is 0.11 mm from the measurement,
    so the quad is placed on the same grid rather than on a second one of its own.
  port-numbering: >-
    drawing - NUMBERING RUNS DOWN EACH COLUMN and the numbers are printed on the
    LAMP BAND, not on the cages. Figure 8 prints '0 2 / 1 3', '4 6 / 5 7' and so on
    across the upper half and '16 18 / 17 19' across the lower, so column c carries
    port 2c over 2c+1 in the upper pair and 16+2c over 17+2c in the lower - eight
    columns, thirty-two ports, matching the guide's Port Overview table ('0 ~ 31,
    QSFP28, 40/100G'). But those numerals are drawn on the schematic module faces,
    where a seated transceiver would cover them. The panel's own numbering is on the
    eight white lozenges in the lamp band, one per column, each split into an upper
    and a lower half: colour detection puts them at 94.0, 132.2, 136.3, 174.9,
    178.9, 217.3, 221.6 and 260.3 mm - a single lozenge at each end of the port
    block and a pair at each of the three inter-block webs, which is exactly eight
    for eight columns, and each sits on the OUTER edge of its own column. The
    numerals inside them are 2 px tall in the best figure held and cannot be read;
    they are drawn here from the column assignment above, which the module-face
    numerals and the NDX interface list (ce0-ce31, xe0-xe3) both give independently.
  sfp28-breakout: >-
    drawing/guide - the four SFP28 ports are ports 0-3 in their own run and they are
    the four lanes of QSFP28 port 0. The guide's Port Overview says so in words:
    'The ports 0 to 3 (labelled in yellow) breakout from the 100G port 0 (labelled
    in green). If the ports 0 to 3 (labelled in yellow) are enabled, then the 100G
    port 0 (labelled in green) will be disabled.' The faceplate says it in paint:
    the quad's legend band is yellow, and the yellow continues right past the quad
    to cover the lamp rows of the FIRST QSFP column and only that column, with an
    orange strip under its lower row. Every other column's lamps sit on green.
    Counting settles that the yellow-and-orange lamps belong to the QSFP column and
    not to the quad: eight lamp groups are drawn and there are eight QSFP columns,
    so none is spare for the SFP28 ports, which carry no lamp of their own. The
    lamps are therefore attached to port-0 and port-1 and the sharing is described
    rather than asserted as a wiring fact; see the sfp28-lamp-sharing gap.
  left-cluster: >-
    drawing - measured on Figure 8 at 2.9564 px/mm across and 2.976 down, and
    cross-read at 4x. Down the left edge, three gold jacks on one centreline
    (x 11.7-12.2): 1PPS SMB at y 6.4-13.4, 10MHZ SMB at 20.8-27.9 and the larger
    GNSS ANT SMA at 33.9-43.0, measuring 7.1, 7.1 and 9.5 mm across the nut - the
    datasheet's own split of '1 x GNSS input SMA, 1 x 1PPS input/output SMB, 1 x
    10MHz input/output SMB', not a family assumption. To their right the ToD RJ45
    (x 22.2-38.5, y 26.7-41.7) and a PORTRAIT USB 3.0 A receptacle (x 42.3-49.5,
    y 27.7-41.3), with the reset pinhole at (30.4, 46.6) below them. Along the
    bottom: the six-lamp status block at x 11.16-13.87 on a 2.45 mm pitch inside a
    white legend panel at x 6.4-10.2, then the micro-USB console slot at x
    18.2-26.2, the RJ45 console at 29.4-44.7 and the RJ45 management jack at
    49.4-65.3, the last identified by the two green lamps colour detection finds in
    its lower corners.
  panel-metal: >-
    drawing - THE BRIGHT SHELLS ARE PANEL, NOT PART. std/qsfp-ganged and
    std/sfp-ganged draw the aperture and what is behind it and stop at the metal, so
    the light shell each ganged block sits in is drawn here as panel.decor: one
    39.0 x 56.3 mm plate per two-column QSFP block at x 93.25, 135.70, 178.15 and
    220.60, and one 30.8 x 26.6 plate under the SFP28 quad at 53.1. Without them
    thirty-six dark apertures sit on a dark faceplate and vanish. The thin dark seam
    at y 43.9 is the join between each block's upper and lower two-high cage, which
    the figure draws as a 1-2 px line. The same rule puts a silver pill behind the
    portrait USB-A and the micro-USB, whose std/ parts draw only the opening.
  lamp-band: >-
    drawing - the port lamps sit on a painted band above and below the cage block,
    py 71-88 and 262-280, i.e. 8.6-15.9 mm and 72.2-79.5 mm. Each band carries two
    rows of lamps, the upper row serving the upper port of every stacked pair and
    the lower row the lower: row centres measure 10.58 and 14.28 mm at the top and
    73.80 and 77.11 at the bottom. Each row is four lamps on a 4.00 mm pitch, so
    ufispace/lane-led-quad@1 (14.4 x 2.6, four 2.4 mm lamps on 3.94) is placed
    unchanged - its pitch is within 1.5% of the measurement and its lamp diameter is
    a 3 px feature in this figure and is not independently resolvable.
  rear-layout: >-
    drawing, and it passes the same gate the front does. Figure 7's rear elevation
    measures 1292 x 261 px, 0.44% from the stated aspect. The four fan modules
    repeat on a measured 84.42 mm pitch, taken from the status lamp, which is a
    feature that repeats once per module: lamp centres at 18.39, 102.76, 187.29 and
    271.65 mm, y 23.5. ufispace/fan-803816@1 carries its lamp at (16.2, 18.5) in a
    82.5 x 81.5 face, which puts the bay origins at x 0.90 + 84.42k and y 3.70. The
    PSU stack is anchored the same way: its two lamps sit at x 384.0 and y 7.9 and
    50.4, and ufispace/psu-162-ac@1 carries its lamp at (7.0, 3.4) in a 50.5 x 40.0
    face, giving bay origins (375.5, 3.0) and (375.5, 45.5) and a 42.5 mm stack
    pitch. NOTE this is a SECOND, INDEPENDENT reading of the same chassis: the
    S9600-30DX model measured its own guide's Figure 7 and got an 84.4 mm fan pitch
    and a 43 mm PSU pitch. The agreement is corroboration because the two
    measurements were taken from two different documents, not copied.
  fan-part: >-
    ufispace/fan-803816@1 is reused rather than a third near-duplicate built, and
    the reason is recorded because the tables disagree. THIS guide's Component
    Physical Information table gives the fan 81.5 x 122 x 81 mm (W x D x H); the
    S9600-30DX guide gives the same part number 81 x 113 x 81.5 and the S9600-28DX
    guide 80 x 113 x 81.5. Three chassis guides, one SKU, three tables. The library
    part is 82.5 x 81.5, measured off the S9600-30DX rear elevation, and my own
    elevation puts the repeating unit at 84.42 mm, which is that face plus a ~1.9 mm
    web - the same reading. The differences between the three tables are 1.5 mm and
    smaller, which is under a pixel and a half at this figure's 2.96 px/mm, so they
    cannot be resolved by measuring harder. See the fan-dimensions gap.
  psu-build: >-
    THE GUIDE DRAWS AC AND THE PRODUCT RENDER SHOWS DC, and the two are not blended.
    HIG Figure 7's rear elevation - the only orthographic rear the intake holds -
    draws both bays with an appliance inlet, a mesh grille to its left, a green lamp
    and a red bail, which is ufispace/psu-162-ac@1 exactly. The vendor's rear
    product render (photos/s9600-32x-3-view) shows a DC build instead: two two-hole
    lug pads behind a cover where the inlet is, and the whole face MIRRORED, grille
    on the right. The manifest models the documented build - AC, from the figure
    that passes the gate - and the dc configuration swaps in ufispace/psu-162-dc@1,
    whose own contract records that no figure of a seated DC unit was available to
    it. That render is such a figure and it disagrees with that part's layout; the
    part is not edited from here. See the dc-psu-face-mirrored gap.
  grounding: >-
    HIG section 8 - 'The location for securing the grounding lug is at the rear of
    the case and is covered with a protective label.' Figure 7 draws a silver plate
    with two round pads at x 348.0-358.5, y 6.0-38.6, an earth symbol beside it and
    a third round hole below, on the chassis strip between the fan bank and the PSU
    stack; HIG Figure 4's overview names it 'Ground Lug' with a leader to that
    strip. The plate is drawn as decor and the symbol as a placement: the lug itself
    ships loose in the accessory kit (5 lugs on the DC build, 1 on AC) and the pad
    is bare metal under a label until somebody bolts one on, so seating a lug
    component here would draw hardware the shipped chassis does not wear.
  views: >-
    Six views. TOP: y = 0 is the REAR, per the house convention and HIG Figure 4's
    footprint drawing, which prints the fan handles along its top edge; six long
    stadium recesses run across the lid, proportioned off that drawing (which is 2%
    out in aspect, so only proportions are taken from it). BOTTOM carries the
    compliance sticker at an estimated position - no held figure shows the
    underside; a bottom view mirrors left and right, and this face carries nothing
    asymmetric, so nothing exposes that. LEFT (x = 0 is the REAR) and RIGHT (x = 0
    is the FRONT) carry the five rail attachment pins per side that the HIG's rack
    mounting section counts by name - 'The chassis has 5 attachment pins on each
    side, for a total of 10 pins' - at estimated depths, since no figure dimensions
    them along the chassis. Both side faces otherwise carry only symmetric content,
    so the depth-axis conventions are stated here rather than proved by a feature.
  attrs: >-
    datasheet - Specifications, Performance, Environmental, Regulatory Compliance
    and Accessories sections, transcribed into sections. Compliance strings kept
    verbatim, semicolon-separated, untidied.
  power: >-
    datasheet 'Typical power: 335 Watts (no transceiver)' - the vendor's own scope,
    so power-envelope is bare. The HIG states the maximum twice, once per build:
    'The maximum system power consumption is 609 watts' in the DC section and
    '621.3 watts' in the AC section, and unusually BOTH are qualified - 'Testing
    criteria for maximum power are as follows: Temperature 45C, Optics: full
    populated, Traffic: 100% load' appears under each. 621.3 is carried as
    power-max-w because max means the highest, and the 12.3 W difference is recorded
    here rather than as a conflict: they are two builds, not two readings. The
    1600 W that appears beside them is a provisioning instruction ('a reserve of at
    least 1600 watts on each power circuit') and is the supply's rating, not a draw.
    These are the vendor's figures as the vendor states them and are NOT reconciled
    against the module set; the fans publish no draw, so any total built from the
    modelled modules is a floor.
  second-party: >-
    NetBox Labs NDX carries this device type (netboxlabs.com/ndx/ufispace/
    ufispace-s9600-32x, last verified 4 April 2026) and was read for COMPLETENESS
    only. Its field list is 2U full-depth, 17.73 kg, front-to-rear airflow, 32x
    100gbase-x-qsfp28 (ce0-ce31), 4x 25gbase-x-sfp28 (xe0-xe3), 1x 1000base-t
    management, one RJ45 console, four fan bays FAN0-FAN3 and two PSU bays
    PSU0-PSU1. Every one of those is present here. They carry nothing this model
    lacks; this model additionally carries the timing block, the USB and micro-USB
    ports, the reset button, the six status lamps, the port lamps and the grounding
    pad. Their interface names corroborate the 0-31 and 0-3 numbering independently.
  vent-islands: >-
    derived - a vent field is a perforation and the drawing said so, but the marks
    printed inside one were floating on air (L64). The vendor interrupts the
    perforation where it prints, so each of those marks now has a solid patch under it
    in the chassis colour, drawn over the vent the way ufispace/s9600-72xc paints its
    port bands over one. The patch is the printing's own footprint plus 0.4 mm, which is
    what the S9610-36D's front render measures: its slots stop 0.4 mm outside each lamp
    cluster and resume 0.4 mm past it. Where a vent is simply measured wider than the
    metal it reaches, this states the metal that the printing proves is there without
    re-measuring the field.
  lifecycle: >-
    searched 28 August 2026 - 'UfiSpace S9600-32X end of life end of sale
    announcement'. No notice from UfiSpace or any reseller appears; the vendor's
    product page, the FAQ page and the S9600 brochure are all live. NDX advertises
    lifecycle dates behind its commercial tiers and publishes none. none-announced
    is a real finding rather than an absence of looking.
attrs:
  performance:
    switching-capacity: 2.4 Tbps
    packet-buffer: 4 GB deep buffer
  power:
    power-typical-w: '335'
    power-max-w: '621.3'
    power-envelope: bare
    power-max-scope: 45 C, optics fully populated, 100% traffic load (HIG, both builds)
    input-ac: 100 to 240 V, 13 A
    input-dc: -40 to -72 V, 50 A
    psu-redundancy: 1+1 hot-swappable
  thermal:
    fan-redundancy: 3+1 hot-swappable
    airflow: front-to-back (exhaust fans and supplies at the rear)
  environmental:
    operating-temp: 0 to 45 C
    operating-humidity: 5 to 85% RH non-condensing
    storage-temp: -40 to 70 C
    storage-humidity: 5 to 93% RH non-condensing
  platform:
    asic: Broadcom Qumran2c BCM88820
    cpu: Intel Skylake-D 8-core @ 1.9 GHz
    memory: 32 GB DDR4
    storage: 128 GB SSD
    bmc: ASPEED AST2400
  features:
    timing: >-
      Stratum 3E OCXO with optional holdover; ITU-T Synchronous Ethernet (SyncE);
      IEEE 1588v2 default, G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2
      (additional licence), T-GM, T-BC/OC, T-TC; Time Sensitive Networking (TSN);
      Class C timing accuracy. NOS integration is required to activate the specific
      feature, which the datasheet states with an asterisk against the whole block
    gnss: >-
      internal receiver for master clock implementations, supporting GPS/QZSS L1
      C/A, GLONASS L10F, BeiDou B1, SBAS L1 C/A (WAAS, EGNOS, MSAS, GAGAN) and
      Galileo E1B/C at a minimum RF sensitivity of -166 dBm; passive and active
      antennas are auto-detected and an active antenna is fed up to 5 V DC / 150 mA
    routing: full Segment Routing over IPv6 (SRv6)
    breakout: >-
      the four SFP28 ports break out from 100G port 0; enabling them disables
      port 0
    compliance-programme: IEEE 802.1CM fronthaul; ITU-T G.8273.2 T-BC Class C
    optics-qsfp28: 100G QSFP28 SR4/LR4/ER4/ZR4, up to 40 km
    optics-sfp28: 25G SFP28 SR/LR/ER and 10G SFP+ SR/LR/ER, up to 40 km
    timing-interfaces: >-
      GNSS in on SMA; 1PPS in/out on SMB; 10MHz in/out on SMB; ToD in/out on RJ45.
      Cable types the datasheet specifies: 50 ohm SMA coax with a 1/4-36UNS-2B
      connector for GNSS, 50 ohm SMB coax with a 10-32UNF-2A connector for 1PPS and
      10MHz, shielded RJ45 for ToD
  management:
    console: RJ45 RS-232 at 115200 8N1 plus a micro-USB serial console (CP210x)
    oob: 1x RJ45 100/1000M management port
    service-port: 1x USB 3.0 Type-A maintenance port
  compliance:
    safety: UL 62368-1; IEC 62368-1; IEC 60950-1; BSMI
    emc: >-
      FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A;
      EN 55024; EN 55035; EN 62479; EN 50663; EN 300 386; EN 301 489; EN 303 413;
      BSMI; VCCI CISPR 32, Class A
    environment: ETSI 300 132-2; ETSI 300 019; RoHS; WEEE
  lifecycle:
    eol: none-announced
chassis:
  width: 436
  height: 87.7
  depth: 762
  ru: 2
  color: '#3c3f42'
  weight-kg: 17.73
  airflow: front-to-back

gaps:
- what: port-led-semantics
  scope: [qsfp28, sfp28, port-leds]
  reason: vendor-silent
  note: >-
    HIG section 10 tables the six front-panel lamps (SYNC, SYS, FAN, PS0, PS1, ID),
    the PSU FRU lamp and the Fan FRU lamp, and gives NO table for the port lamps.
    The sixty-four lane lamps drawn here therefore keep ufispace/lane-led-quad@1's
    off/on default rather than an invented link/activity vocabulary. Nothing states
    whether the four lamps above a cage are four lanes, or a link/activity pair per
    breakout, or something else; the component's own provenance reaches the same
    conclusion from a different platform's guide.
  wanted: >-
    a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a live unit
    with ports in known states
- what: sfp28-lamp-sharing
  scope: [sfp28, port-leds]
  reason: vendor-silent
  note: >-
    The four SFP28 ports have no lamp of their own. Eight lamp groups are drawn in
    each band and there are eight QSFP columns, so none is spare, and the guide
    never mentions an SFP28 indicator. What the faceplate does say is that the first
    QSFP column's two lamp rows are painted yellow and orange, continuous with the
    SFP28 legend band, where every other column's are green - and the guide says
    those four ports are the breakout of port 0. The natural reading is that port
    0's four lane lamps are the four SFP28 ports' lamps in breakout mode. It is a
    reading and not a statement, so the lamps here are attached to port-0 and
    port-1 and the SFP28 group carries no indicator.
  wanted: >-
    a NOS LED table naming the breakout lamps, or a photograph of a unit with the
    breakout enabled and one SFP28 port linked
- what: fan-dimensions
  scope: [ufispace/fan-803816@1, fans]
  reason: sources-disagree
  note: >-
    Three UfiSpace chassis guides dimension the same fan SKU three ways. This one's
    Component Physical Information table says 'Fan (W x D x H) 3.21 x 4.8 x 3.19 in
    (81.5 x 122 x 81 mm)'; the S9600-30DX guide says 81 x 113 x 81.5 and the
    S9600-28DX guide 80 x 113 x 81.5. The library part is 82.5 x 81.5, measured off
    a rear elevation, and my own elevation independently puts the repeating unit at
    84.42 mm - face plus web - which supports it. The spread across the four numbers
    is 2.5 mm on width and 0.5 on height, under a pixel and a half at this figure's
    2.96 px/mm, so no amount of re-measuring these figures resolves it. Reused
    rather than duplicated; the depth disagreement (122 against 113) is larger and
    is not measurable from any elevation at all.
  wanted: a vendor mechanical drawing of FAN-803816-HI, or a caliper on the FRU
- what: dc-psu-face-mirrored
  scope: [ufispace/psu-162-dc@1, psus]
  reason: sources-disagree
  note: >-
    ufispace/psu-162-dc@1 records that no held figure showed a DC unit seated in a
    chassis, and built its face from the AC unit's with a terminal block on the
    inlet's footprint - grille left, connector right. This device's intake HAS such
    a figure: the vendor rear product render (photos/s9600-32x-3-view) shows two DC
    supplies with two-hole lug pads behind a cover, and their whole face is MIRRORED
    relative to Figure 7's AC unit - connector on the left, grille and lamp and bail
    on the right. So the DC face is probably not the AC face with a substitution,
    and the existing component draws it the wrong way round. The component is not
    edited from here; the render is 520 px wide and is evidence of arrangement, not
    of geometry.
  wanted: >-
    an orthographic rear elevation or a close-up photograph of a DC-configured
    S9600-32X, good enough to dimension the terminal block
- what: port-number-glyphs
  scope: [qsfp28, front]
  reason: needs-drawing
  note: >-
    The panel numbers its ports inside the eight white lozenges in each lamp band,
    and at the best resolution the intake holds those numerals are two pixels tall
    and cannot be read. The numbers printed here are the column assignment the
    module-face numerals give, placed at the measured lozenge positions - the
    positions are measured and the digits are inferred. If the lozenges turn out to
    carry something else (a lane letter, a pair label), the positions stay right and
    the text is wrong.
  wanted: a high-resolution front photograph, or a dimensioned faceplate drawing
- what: chassis-sku
  scope: [base, ac, dc]
  reason: vendor-silent
  note: >-
    No held document prints an orderable chassis part number. The datasheet names
    the product only as S9600-32X and its Available to Order block names only the
    two PSUs (PSU-162-DESR, PSU-162-AESR) and the one fan (FAN-803816-HI); the HIG
    prints no number anywhere. The S9510-28DC precedent applies - that model's SKUs
    came from the owner and from no held PDF - so the configurations here carry no
    part-numbers rather than invented ones.
  wanted: a UfiSpace ordering guide
- what: orange-marker-meaning
  scope: [front]
  reason: vendor-silent
  note: >-
    At the junction between the yellow SFP28 legend band and the green QSFP28 band
    the faceplate prints a black up-triangle on the yellow and a white down-triangle
    on an orange strip, and the orange strip runs under the first column's lower
    lamp row. Both bands and both markers are drawn here because they are on the
    metal. Neither document explains the colour coding or the two triangles beyond
    the Port Overview sentence about the breakout, so what the orange specifically
    marks - the disabled port, the shared lanes, the lower row - is not stated.
  wanted: a legend or key for the faceplate colour coding
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      ports 0-31, the datasheet's '32 x 40/100G QSFP28 ports', in eight columns of
      two two-high stacked cages. Numbering runs DOWN each column, which is why
      port 1 sits under port 0 rather than beside it, and the lower half of the
      faceplate continues at 16 rather than interleaving
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
    description: >-
      ports 0-3 in their own run, the datasheet's '4 x 1/10/25G SFP28 ports (In-band
      port share with 100GE Port 0)' - a 2x2 quad in one shell at the left of the
      port block, under a yellow legend band. They are the breakout of QSFP28 port
      0 and enabling them disables it
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the timing block down the left edge - a GNSS antenna on SMA, 1PPS and 10MHz on
      SMB and ToD on RJ45. Three media, four jacks, one job: this is the block that
      makes an aggregation router a Class C grandmaster
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster along the bottom left - the out-of-band RJ45, the
      RS-232 console RJ45, the micro-USB serial console, the USB 3.0 maintenance
      port and the recessed reset button
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      the six chassis indicators the faceplate legends SYNC, SYS, FAN, PS0, PS1 and
      ID, each with its own vocabulary from HIG section 10's Front Panel LED table
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      every indicator that belongs to a particular port - one four-lamp cluster per
      QSFP28 port, in the band above or below its own cage
  psus:
    term: PSU
    role: service
    index-origin: 0
    description: the two rear supplies, which the rear panel numbers PSU0 and PSU1
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 hot-swappable'
  fans:
    term: Fan
    role: service
    index-origin: 0
    description: the four rear fans, which the rear panel numbers 0 to 3
    attrs:
      redundancy: '3+1'
      redundancy-note: '3+1 - 3+1 hot-swappable (attrs fan-redundancy)'
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
