configurations:
  ac:
    kind: base
    description: >-
      The chassis as the datasheet's own rear product photograph shows it - four
      FAN-808012-HCE exhaust fans and two PSU-202-AESR 2000 W AC supplies with IEC C20
      inlets and red latches, front-to-back airflow, and the fifty-six traffic and
      management ports empty. The HIG rates the feed at 200-240 V and notes that on a
      single 110 VAC source each supply delivers 1000 W. No orderable chassis part number
      appears in any held document; see the chassis-variants gap.
    default: true
    airflow: front-to-back
    component-attrs:
      psu-202-ac:
        model: PSU-202-AESR
      fan-808012:
        model: FAN-808012-HCE
  dc:
    kind: orderable
    description: >-
      Dual 2000 W DC supplies (PSU-202-DESR, two-post screw terminal under a hinged
      plastic cover, red latch) with the same FAN-808012-HCE exhaust fans, drawn by HIG
      Figures 6, 17 and 18. Datasheet input -40 to -72 V at 60 A; the HIG's DC section
      gives the maximum system consumption as 1220 W under 400G optics MSA standards and
      1524 W with OpenZR+, against the AC build's 1212 W and 1510 W.
    airflow: front-to-back
    bays:
      psu-0: ufispace/psu-202-dc@1
      psu-1: ufispace/psu-202-dc@1
    component-attrs:
      psu-202-dc:
        model: PSU-202-DESR
      fan-808012:
        model: FAN-808012-HCE
datasheet:
  title: UfiSpace S9610-48DX 7.2T 100G/400G Open Aggregation Router Datasheet
