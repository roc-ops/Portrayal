                   {name: sync-fail, color: '#f59e0b', behavior: blinking}],
           description: 'HIG Front Panel LED table, SYNC row - Off (system timing/clock synchronization is disabled or in free-run mode), Solid Green (timing core synchronized to PTP packet phase or an external phase source and frequency locked), Blinking Green (synchronized to PTP packet frequency or an external frequency source), Solid Yellow (acquiring state or holdover), Blinking Yellow (synchronization fail, or acquiring/holdover time out)',
           group: status-leds, rel-pos: 1}
