gaps:
- what: unidentified-front-panel-opening
  scope: [furniture]
  reason: vendor-silent
  note: >-
    a third round opening the size of the two SMB timing bezels sits directly above
    them at (6.79, 32.9) on the front panel, 6.8 mm across, drawn black where they are
    yellow. No callout in HIG Figure 4 names it, the datasheet lists only two timing
    interfaces, and no held image resolves what is behind it. It is drawn as a dark
    decor circle so the panel is not silently missing a hole, and it is named here so
    the circle is a recorded unknown rather than an unexplained mark.
  wanted: a photograph of the front panel's timing column, or a mechanical drawing
    of the front bezel.
- what: qsfp-dd-port-led-semantics
  scope: [port-leds]
  reason: vendor-silent
  note: >-
    every one of the 64 QSFP-DD ports and both SFP28 ports carries a lamp on the strip
    beside it, and the HIG's front-panel LED section defines only the six system lamps
    (SYNC, SYS, FAN, PS0, PS1, ID) plus the management port pair. It gives no colour
    vocabulary at all for the port lamps, so the 66 placements here carry positions and
    no states.
  wanted: a NOS LED table, or photographs of a live unit with known ports up and down.
- what: front-panel-led-legends
  scope: [status-leds]
  reason: needs-photo
  note: >-
    the five system lamps and the ID lamp each sit beside a printed white legend box,
    but the best resolution the intake reaches on that block is HIG Figure 8 at 8.6
    px/mm over an embedded raster of far less, where the glyphs are a grey smear. The
    names carried here (SYNC, SYS, FAN, PS0, PS1, ID) are the HIG front-panel LED
    table's own, in the table's order, which the lamp order matches.
  wanted: a straight-on photograph of the left end of the front panel.
- what: dc-psu-face-not-measured
  scope: [psus]
  reason: needs-drawing
  note: >-
    HIG Figure 4's rear elevation and both vendor rear renders show the AC build, so
    ufispace/psu-302-dc's face layout is estimated from HIG Figure 6's isometric and
    from its AC sibling, which shares the 68 x 40.6 envelope. The terminal block's size
    and position on the face are the weakest numbers in this model. The AC unit's face
    is measured; the DC one's is not, and the two must not be read as equally sourced.
  wanted: a straight-on drawing or photograph of the PSU-302-DESR face.
- what: fan-position-legends
  scope: [fans]
  reason: needs-hardware
  note: >-
    'FAN 0 1 2 3' is printed once on the chassis strip between the fan bank and the
    PSUs, which is modelled - but it is a single legend naming four bays rather than a
    per-bay mark, so nothing on the drawing ties bay 2 to the digit 2. Whether the
    hardware also prints a digit on or beside each bay is not resolvable from the
    elevation, where the fan modules cover whatever is behind them.
  wanted: a photograph of the rear with one or more fan modules removed.
- what: fru-power-unpublished
  scope: [fans]
  reason: vendor-silent
  note: >-
    ufispace/fan-808012 states no draw and its own contract records the search: the
    datasheet names FAN-808012-HCE only as an ordering line, and the HIG dimensions the
    fan FRU, weighs it and tables its LED without a wattage. Every watt figure in
    either document belongs to the PSU ordering lines or to the two system maxima.
    L29's standing warning is the live count of how much of the chassis total is a
    floor rather than a total.
  wanted: a photograph of the fan module's label, or a UfiSpace FRU datasheet.
- what: osfp-sibling-not-modelled
  scope: [qsfpdd-800g]
  reason: needs-drawing
  note: >-
    the S9321-64EO is the same chassis with 64 OSFP cages instead of QSFP-DD, drawn
    beside this device on the same HIG page, and it is a different left-cluster layout
    as well (its 1PPS and 10MHz sit above the model name, its console block below).
    It is not modelled here for two reasons worth separating: it is a different SKU
    with its own weight and its own per-port power split (16 red ports at 30 W, 48 at
    16 W, against this device's 32/32 at 16 and 23 W), and the library has no std/osfp
    cage to seat in it.
  wanted: an OSFP cage in std/, sized from the OSFP MSA.
groups:
  qsfpdd-800g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 800g}
    description: the 64 200/400/800G QSFP-DD ports, 0-63, in two bands of 16 columns x
      2 belly-to-belly rows; ports 0-31 are budgeted at 16 W of optics and 32-63 at 23 W
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
    description: the two 10/25G SFP28 management uplinks, stacked in one ganged shell
      left of the QSFP-DD field; the vendor numbers them 64 and 65, continuing the
      QSFP-DD range rather than restarting, which is what rel-pos carries
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: one lamp per traffic port - 32 on the strip above the upper QSFP-DD
      band, 32 on the strip below the lower one, and a pair under the SFP28 legend
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the six front-panel system lamps - SYNC SYS FAN PS0 PS1 in a column
      beside their legend box, and ID standing alone higher up the panel
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the management and timing cluster at the left-hand end - OOB RJ45, USB-A,
      RJ45 and micro-USB console, 1PPS and 10MHz SMB - plus the RESET button
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 redundant, hot-swappable, active-active'
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '3+1'
      redundancy-note: '3+1 - 3+1 hot-swap fans (the device description)'
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
