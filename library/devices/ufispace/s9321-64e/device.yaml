    components:
      placements:
        - {ref: common/reset-button@1, id: reset, at: [18.6, 7.3], for: chassis, group: mgmt, rel-pos: 1}
        - {ref: common/led-dot@1, id: led-id, at: [12.59, 27.11], for: chassis,
           states: ['off', {name: reserved, color: '#3b82f6'},
                    {name: beacon, color: '#3b82f6', behavior: blinking}],
           description: 'HIG ID row - Off (no power), Solid Blue (reserved - the
             vendor''s own word, so the state is carried without a meaning),
             Blinking Blue (enabled beacon feature)',
           group: status-leds, rel-pos: 6}
        - {ref: std/smb@1, id: pps, at: [6.88, 40.78], group: mgmt, rel-pos: 2,
           attrs: {role: timing},
           description: '1PPS input/output, 50 ohm SMB, Premium build only; HIG
             Connecting the 1PPS Interface - cable no longer than 3 m, BNC via the
             accessory converter cable'}
        - {ref: std/smb@1, id: mhz, at: [6.88, 54.66], group: mgmt, rel-pos: 3,
           attrs: {role: timing},
           description: '10MHz input/output, 50 ohm SMB, Premium build only; HIG
             Connecting the 10MHz Interface - cable no longer than 3 m'}
        - {ref: common/led-dot@1, id: led-sync, at: [10.08, 63.18], for: chassis,
           states: ['off', {name: locked, color: '#22c55e'},
                    {name: freq-locked, color: '#22c55e', behavior: blinking},
                    {name: acquiring, color: '#f59e0b'},
                    {name: sync-fail, color: '#f59e0b', behavior: blinking}],
           description: 'HIG SYNC row - Off (timing/clock synchronization disabled or
             free-run), Solid Green (timing core synchronized to PTP packet (Phase) or
             an external timing source (Phase) and frequency locked), Blinking Green
             (synchronized to PTP packet (Frequency) or an external timing source
             (Frequency)), Solid Amber (acquiring state or holdover), Blinking Amber
             (synchronization fail, or acquiring/holdover time out)',
           group: status-leds, rel-pos: 1}
        - {ref: common/led-dot@1, id: led-sys, at: [10.08, 65.61], for: chassis,
           states: ['off', {name: boot-complete, color: '#22c55e'},
                    {name: boot-failed, color: '#f59e0b'}],
           description: 'HIG SYS row - Off (no power), Solid Green (Host CPU/BMC boot
             complete), Solid Amber (power is up but Host CPU/BMC boot failed)',
           group: status-leds, rel-pos: 2}
        - {ref: common/led-dot@1, id: led-fan, at: [10.08, 68.05],
           for: [rear/fan-0, rear/fan-1, rear/fan-2, rear/fan-3],
           states: ['off', {name: ok, color: '#22c55e'},
                    {name: fault, color: '#f59e0b', behavior: blinking}],
           description: 'HIG FAN row - Off (fans are not initialized), Solid Green (all
             FAN modules are working normal), Blinking Amber (FAN fail: one or more FAN
             module(s) need service)', group: status-leds, rel-pos: 3}
        - {ref: common/led-dot@1, id: led-ps0, at: [10.08, 70.48], for: rear/psu-0,
           states: ['off', {name: ok, color: '#22c55e'},
                    {name: fail, color: '#f59e0b'}],
           description: 'HIG PS0 row - Off (no power), Solid Green (PSU0 is working
             normal), Solid Amber (PSU0 fail, PSU0 need service)',
           group: status-leds, rel-pos: 4}
        - {ref: common/led-dot@1, id: led-ps1, at: [10.08, 72.91], for: rear/psu-1,
           states: ['off', {name: ok, color: '#22c55e'},
                    {name: fail, color: '#f59e0b'}],
           description: 'HIG PS1 row - Off (no power), Solid Green (PSU1 is working
             normal), Solid Amber (PSU1 fail, PSU1 need service)',
           group: status-leds, rel-pos: 5}
        - {ref: std/rj45-ganged@1, id: mgmt, at: [20.73, 47.15], rotate: 180, group: mgmt, rel-pos: 4,
           attrs: {role: mgmt, speed: 100m-1g},
           description: 'the OOB management jack (HIG Figure 4 callout ''RJ45 OOB''); its
             two integrated lamps - left green for 1G link and activity, right amber for
             10M/100M, per the HIG Management port LED table - sit inside this aperture
             and are not drawn'}
        - {ref: std/usb-a@1, id: usb, at: [21.08, 60.1], group: mgmt, rel-pos: 5,
           attrs: {role: maintenance},
           description: 'USB 3.0 Type-A; the HIG calls it a maintenance port and prints
             the usbreset and 5V-restart commands beside it'}
        - {ref: std/rj45-ganged@1, id: console, at: [20.73, 66.0], group: mgmt, rel-pos: 6,
           attrs: {media: rj45-serial, role: console}}
        - {ref: std/micro-usb@1, id: console-usb, at: [7.35, 77.2], group: mgmt, rel-pos: 7,
           attrs: {role: console},
           description: 'the second console port, labelled IOIO like the RJ45 one; needs
             the Silicon Labs CP210x USB-to-UART driver (HIG Initial System Setup)'}
