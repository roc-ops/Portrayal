format: 1
kind: device
name: s9510-30xc
version: 3.0.6
maturity: modelled
manufacturer: UfiSpace
model: S9510-30XC
portfolio:
  line: Telecoms
  family: Disaggregated Cell Site Gateway Router
  series: S9500 Series
description: UfiSpace S9510-30XC - 1RU FlexE/TSN disaggregated cell site gateway router
  with 28x 1/10/25G SFP28 and 2x 40/100G QSFP28; Broadcom Qumran2u BCM88284 at 360 Gbps
  with a 2 GB deep buffer, Intel Denverton-NS, full timing (GNSS/1PPS/10MHz/ToD/BITS)
  on a Stratum 3E OCXO, 1+1 hot-swap 400W PSUs, 4+1 hot-swap fans, NEBS, -40 to 65 C
  hardened
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the rule, not an observation,
      so a photograph of the stack overturns it: the 1 QSFP pair (port-0/port-1), the 14 SFP pairs
      (port-2/port-3 to port-28/port-29). 15 of these were drawn with the upper cage turned before
      the std cage art moved its lip to the bottom of the opening; turning them keeps the lips in
      the middle band where they were drawn and seats every optic bail-outward. common/qsfp-cage@3
      draws its bezel flange on the belly side with the opening centred across it; every opening
      stays where it was measured, the boxes moving by 0.075 across. The numerals and the round
      lamps between the cages stay where the drawing prints them, so L61 now reports them against
      the moved boxes, and that is recorded rather than moved.
  sibling:
    note: >-
      THE S9510-28DC IS THE SAME CHASSIS SHELL AND IS ALREADY IN THIS LIBRARY, so every number
      below says whether it was measured here or taken from there. Both are 440 x 302 x 43.5 with
      two front PSU bays, five rear fan bays and the same timing cluster, and both order
      PSU-401-DISB-1 / PSU-401-AISB and FAN-402825-HD - so ufispace/psu-401-dc,
      ufispace/psu-401-ac and ufispace/fan-402825 are reused unchanged. What is NOT taken from the
      sibling is the front geometry: this device has a different port field (28 SFP28 + 2 QSFP28
      against 24 SFP28 + 2 QSFP28 + 2 QSFP-DD) and its own vendor render, and the sibling's own
      provenance calls its layout 'drawing-inferred ... pending photo overlay calibration -
      marketing photos are low resolution'. Where the two disagree, this file uses its own
      measurement and says so at the number.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 'Chassis (W x D x H) 1 RU, 440 x 302 x 43.5mm or 17.32' x 11.89' x 1.713"
      Weight: 4.5kg or 9.92lb (without FRU)'. HIG Figure 5's top view dimensions the same W =
      17.32" (440 mm) and D = 11.89" (302 mm), and separately D = 12.89" (325 mm) over the
      projecting handles, D = 1" (25 mm) for the fan handles at the rear and D = 1.06" (27 mm) for
      the PSU handles at the front. chassis.depth carries the 302 body; the two projections belong
      to the FRU contracts. Note the weight differs from the sibling S9510-28DC's 4.9 kg - same
      shell, different board and port field, and both are the vendors' own figures for their own
      device.
  front-layout:
    confidence: photo-measured
    note: >-
      photo-measured - the vendor front render s9510-30xc-2-view.png. GATE 1: the chassis in it
      measures 1648 x 164 px, aspect 10.049 against the datasheet's 10.115 (440/43.5) - 0.65% out,
      at 3.745 px/mm. Every front number below is measured on it. HIG Figure 5's front elevation
      and its callout strip (GNSS, 10MHz, 1PPS, Mgt. Port, USB, LED, Reset, BITS, TOD, Console,
      100G QSFP28, 25G SFP28, 2 x AC or DC PSUs, Grounding Lug) corroborate the arrangement and
      name every block.
  psu-bays:
    confidence: measured
    note: >-
      measured, AND IT MOVES THE SIBLING'S NUMBERS. Cross-correlating the two identical PSU faces
      on the front render gives a step of 58.738 mm (correlation 0.968), and the two blue intake
      latches independently give 58.74 - the sibling S9510-28DC has 58.7, so the pitch is
      confirmed. The ABSOLUTE anchor differs: ufispace/psu-401-dc draws its latch at local x
      0.6-4.2 (centre 2.4) and the render puts PSU 0's latch centre at 8.14, which places the bay
      at x 5.74 against the sibling's 4.5. The sibling's front layout is 'drawing-inferred ...
      pending photo overlay calibration' by its own provenance and this is a photograph that
      passed Gate 1 at 0.65%, so the photograph is used: bays at 5.7 and 64.44, y 1.6, 50.5 x
      40.2. Whoever revisits the S9510-28DC should check its 4.5 against this.
  port-grid:
    confidence: measured
    note: >-
      measured - the 28 green ▲▼ lamp pairs are the ruler. Block A (ports 2-17, eight columns)
      gives centres 231.94 to 331.655 on a pitch of 14.245; block B (ports 18-29, six columns)
      gives 351.155 to 422.405 on 14.25. Both land on SFF-8433's 14.25 Basic, which is as close as
      a 3.745 px/mm image comes to the standard. Ports sit at each centre minus half of
      std/sfp-ganged's 14.25. The printed yellow number bands independently span x 224.00-338.81
      and 342.82-429.32, bracketing the computed block extents (224.22-339.42 and 343.43-430.13)
      to within 0.8 mm at each end.
  port-rows:
    confidence: measured
    note: >-
      measured - the silver centre band between the two cage rows runs y 19.0-25.1 across both
      blocks, and at 9x zoom on the render the top cage reads 9.9-19.2 and the bottom 25.5-34.7.
      std/sfp-ganged's 10.4 mm opening is seated against those edges: top row at y 8.8, bottom at
      25.5.
  port-leds:
    confidence: measured
    note: >-
      measured - one lamp per port, a ▲▼ pair in each column's centre silver band at y 21.9-22.3,
      the ▲ at the column centre minus 1.69 and the ▼ at plus 1.69. THREE LIBRARY INDICATOR PARTS
      WERE TRIED AND ALL THREE ARE TOO BIG FOR THIS PANEL, which is worth recording as one finding
      rather than three excuses: common/sfp-led-pair puts its two lamps 8 mm apart inside a 12 mm
      part against a measured 3.38 mm pair spacing; common/led-arrow, which the sibling S9510-28DC
      uses for exactly this job at a 5.9 mm spacing, is 3.6 mm wide and two of them at 3.38 apart
      overlap; and common/qsfp-lane-leds is one 19.5 mm part that swallows the two round lamps
      measured inside the QSFP band. All 38 port lamps are therefore placed individually with
      common/led-dot (2.0 mm), which fits every measured pitch on this face. The cost is shape -
      the real lamps are triangles - and it is paid deliberately: a part at the right pitch in the
      wrong shape is closer to the hardware than a part in the right shape at the wrong pitch, and
      only the second kind collides with its neighbour.
  port-orientation:
    note: >-
      REASONED, NOT MEASURED, and the distinction matters. At 9x the render draws both cage rows
      as plain rectangles with a faint centre line and does not resolve the latch, so no held
      image of THIS device settles which way the cages face. They are drawn mirrored - the
      bottom row rotate 180, both latches toward the centre band - on the physical argument that
      a belly-to-belly stacked SFP block mirrors so both bails stay reachable, which the
      S6301-56STP, S9321-64E and S9502-12SM all show at resolutions that do resolve it, and which
      is the library's stack convention (docs/pluggables-3d-design.md, S3: upper rotate 0 over lower 180, both bails outward). The sibling S9510-28DC now
      draws its stacked rows the same way, by its port lamps.
  qsfp-block:
    confidence: measured
    note: >-
      measured - the two QSFP28 ports are stacked in one silver block at x 199.90-218.86, y
      9.61-34.17, with a silver lamp band across its middle at y 18.7-25.0 and a green number band
      printed above ('0') and below ('1') at x 206.3-212.3. common/qsfp-cage@3 (19.5 x 10.18) is
      seated top and bottom, the bottom one rotate 180 as the sibling does. The lamp band carries
      FOUR green triangles at x 202.04, 204.34, 214.40 and 216.70 with TWO round dark lamps
      between them at about 207.3 and 211.3; a second set of four triangles sits in two small
      boxes below the block at y 39.72. Read as port 0's four lane lamps in the band and port 1's
      four below it. common/qsfp-lane-leds was tried first, as the sibling S9510-28DC uses it, and
      DOES NOT FIT: it is one 19.5 mm part spanning the whole band, so the two round lamps
      measured at 207.3 and 211.3 land inside it and lint reported the collision. The real
      arrangement is four triangles clustered 2 + 2 at the ends of the band with the round pair
      between them, on a 2.3 mm within-pair pitch, so all ten lamps are placed individually with
      common/led-dot - the nearest part that fits a 2.3 mm pitch. The shape is wrong (the lane
      lamps are triangles) and that is the cost of fitting the pitch; the two round lamps' meaning
      and ownership are NOT resolved - see gaps.
  timing-cluster:
    confidence: measured
    note: >-
      measured - GNSS ANT is a 9.9 mm yellow SMA bezel centring (123.94, 8.51), 10MHz a 6.4 mm SMB
      centring (135.96, 8.62) and 1PPS a 6.7 mm SMB centring (146.90, 8.64). common/sma-jack (9.5)
      and common/smb-jack (7.0) are seated on those centres, which puts GNSS at x 119.19 against
      the sibling's 119.2 and 1PPS at 143.40 against its 143.5 - independent agreement on the two
      ends of the cluster. BITS and ToD are two jacks stacked in a shared silver plate measured at
      x 134.76-149.71, y 16.29-38.71.
  mgmt-cluster:
    confidence: measured
    note: >-
      measured, AND THE SIBLING'S COMPONENTS DO NOT FIT. The plate holding the OOB jack, the USB
      and the console measures x 153.71-169.47, y 5.87-36.84 - 15.76 wide and 30.97 tall - with
      apertures at y 5.9-17.0, 18.5-24.0 and 25.5-36.8. The S9510-28DC uses common/rj45-eth@1,
      15.8 x 13.2, and common/usb-a-bezel@1 at 17.0 x 9.3: three of those need 35.7 mm of height and are
      0.04 mm too wide for this plate. So this device uses std/rj45-ganged (12.7 x 11.0) for the
      OOB and console jacks and std/usb-a (12.0 x 4.5) for the USB, which fit the measured
      apertures. The OOB jack's two integrated lamps, visible in the render at x 156.06 and 166.67
      and tabled in full by the HIG, now draw as led-a/led-b of the jack.
  system-leds:
    confidence: measured
    note: >-
      measured - five lamps in a column at x 122.94-125.87, y bands 18.96-20.83, 21.36-23.23,
      23.76-25.63, 26.43-28.30 and 28.83-30.70, beside a printed white legend box at x
      117.40-122.48, y 18.69-30.97. Those are the five the HIG front-panel LED table defines -
      GNSS, SYNC, STAT, FAN, PWR - in the table's order, and the labels are printed to the LEFT of
      the lamps inside the box. Each lamp is 2.93 x 1.87 on a 2.47 mm pitch, so common/led-rect
      (4.6 x 2.6) - which the sibling uses at its own 2.9 pitch - CANNOT be stacked here without
      adjacent lamps overlapping. common/led-dot (2.0) is used instead and the shape difference is
      recorded rather than forced. The lamp states are transcribed from the HIG table on each
      placement, and they are the same five vocabularies the sibling carries because it is the
      same table in the same guide family - said here so the agreement reads as a shared source
      and not as a second reading.
  vents:
    confidence: measured
    note: >-
      measured - one hex vent strip on the front, x 211.46-430.39, y 0.8-6.2, read as dark-hole
      density on the render. The other perforated areas on this face belong to the two PSU
      modules' own grilles and are drawn by ufispace/psu-401-dc, not here.
  rear:
    confidence: drawing
    note: >-
      drawing+photo - HIG Figure 8's rear strip and the vendor rear render s9510-30xc-3-view.png.
      NEITHER PASSES GATE 1 (9.27 and 9.29 against a true 10.115) because both include a
      perspective view of the top cover above the face, so the y axis is not taken from either.
      The x axis is: the five red 'E' airflow badges are flat on the face, keep a constant 8.1-8.8
      mm drawn width across the frame, and give a step of 52.49 in the figure and 52.45 in the
      photograph - two independent sources agreeing to 0.04. THE HANDLES DO NOT AGREE and that is
      the tell: they measure 10.4, 8.8, 6.6, 5.0 and 4.7 wide across the same five modules,
      shrinking monotonically, because they project 25 mm out of the face and are seen at
      increasing angle. A step read from them would have been 54.4 and wrong. Bays are placed on
      the badge step at x 18.9, 71.4, 123.9, 176.4 and 228.9, which puts the last module's right
      edge at 280.4 against a vent field measured to start at 285.7 - the sibling S9510-28DC has
      its five bays at 8.0 on a 53.2 step, which this measurement does not support.
  fan-legends:
    note: >-
      NOT DRAWN, and lint is why the first pass had them wrong. 'FAN ◄0' through 'FAN ◄4' are
      printed once per module in both rear sources, at x 63.4 + 52.49n - which is INSIDE each
      module's own 51.5 mm face, not on the chassis behind it. Put on the device's silkscreen they
      sat 1.56 mm inside their bays and L21 reported that the module would paint over them, which
      is the correct answer for the wrong reason: they are not chassis printing at all. Text on a
      module's faceplate belongs in that module's skin, and ufispace/fan-402825 is shared with the
      S9510-28DC and cannot carry a per-position digit. Removed rather than nudged clear - see
      gaps.
  fan-fru:
    note: >-
      ufispace/fan-402825@1 reused - the datasheet's Fan Types line is 'FAN-402825-HD, exhaust air
      flow', the same ordering line the S9510-28DC carries, so it is the same part and not a
      lookalike. Two skin-level deltas were seen in the matched-scale comparison and are recorded
      rather than fixed: this device's modules show a large red LOOP handle where the component
      draws a straight red bar, and a red 'E' airflow badge with a 'FAN ◄n' legend on the
      right-hand strip that the component does not draw at all. Both belong to the shared
      component's art, and changing them would move the S9510-28DC too.
  top:
    confidence: drawing
    note: >-
      drawing - HIG Figure 5's top view, which carries its own W = 440 and D = 302 dimension
      lines. GATE 1 FAILS: the drawn cover measures 922 x 687 px for a 440 x 302 object, aspect
      1.342 against a true 1.457, 7.9% out, so nothing absolute is taken from it and every
      position is a fraction of the dimensioned 440 and 302. Two long recessed grooves at y
      42.6-56.3 and 172.8-185.9 from the rear; a row of six screw holes at y 10.85 (x 109.8 to
      372.9 on a 52.6 pitch, one per fan bay) and a row of five at y 81.4 (x 114.5 to 325.1 on
      52.65). The grooves' x extent is the weak number - their rims resolve top and bottom but not
      at the ends - and is ESTIMATED at 15-420. AXIS: y = 0 is the REAR, which this figure states
      rather than implies: the fan handles project from its top edge and the PSU handles from its
      bottom.
  sides:
    confidence: estimated
    note: >-
      estimated, and thinner than this device deserves. No orthographic side elevation exists in
      the intake for the S9510-30XC. HIG Figure 5's callout inset shows the grounding lug on the
      RIGHT side wall near the front, and HIG section 8's figures show the lug and its two screws
      in isolation without placing them on a dimensioned side. The right view therefore carries
      the grounding lug and its GND legend near the front and the left view carries the
      rack-bracket screw positions, both taken from the sibling S9510-28DC's own side faces -
      which are themselves unsourced in that file - and both marked estimated here. AXIS
      CONVENTION: on the RIGHT view x = 0 is the FRONT; on the LEFT view x = 0 is the REAR
      (renderer convention). The lug is at the front of the right side, so this face is asymmetric
      and the convention matters.
  bottom:
    note: >-
      deliberately size-only. The sibling S9510-28DC puts a compliance sticker on its bottom face;
      no figure or photograph in THIS device's intake shows the underside, so copying that sticker
      would be asserting a label position from another model's file. L45's size-only warning
      stands as the record.
  attrs:
    confidence: datasheet
    note: >-
      datasheet Specifications, Performance, Regulatory Compliance and Accessories sections. The
      timing rows carry the vendor's own footnotes - '*NOS integration is necessary to activate
      the specific feature' and '**Additional license is required' (which attaches to SMPTE ST
      2059-2) - because dropping them would turn a conditional capability into an unconditional
      one. The NEBS rows are transcribed as the three standards the datasheet names and no level
      is claimed, because the datasheet claims none.
  power:
    confidence: datasheet
    note: >-
      datasheet gives 'Typical power: 126 Watts (no transceiver)' and the inputs 'AC input: 100 to
      240V, 6A' and 'DC input: -36 to -75V, 16A'. NO MAXIMUM IS PUBLISHED for this device in
      either document - the HIG's Connecting Power sections give provisioning instructions and
      fuse ratings but no system maximum, unlike the S6301, S9321 and S9502 guides, and unlike the
      sibling S9510-28DC, whose 306 W DC / 301.2 W AC figures belong to a different board and are
      NOT borrowed here. So power-typical-w is the only draw figure and power-envelope is
      `unstated`: the vendor gives no ambient, optics population or traffic load with the 126 W
      either.
  lifecycle:
    note: >-
      searched 2026-08-28, 'UfiSpace S9510-30XC end of life' - no announcement. The vendor lists
      the product on its telecom access pages as a current FlexE/TSN cell site gateway.
      none-announced is a checked state, not an absence.
  ground-stud-size:
    confidence: datasheet
    note: >-
      the hardware installation guide lists, in its package contents, a screw kit for the grounding
      lug of 2 x M4*L8.0mm screws, and its grounding steps lock the grounding lug to the designated
      grounding location with 2 M4 screws: the `stud-size` of ground-1 and ground-2. The accessory lug
      is one two-hole lug held by both screws.

attrs:
  performance:
    switching-capacity: 360 Gbps
    packet-buffer: 2 GB deep buffer
  power:
    power-typical-w: '126'
    power-envelope: unstated
    input-ac: '100 to 240V, 6A'
    input-dc: '-36 to -75V, 16A'
  environmental:
    operating-temp: -40 to 65 C (temperature hardened)
    operating-humidity: 5% to 85% RH non-condensing
    storage-temp: -40 to 70 C
    storage-humidity: 5% to 93% RH non-condensing
  platform:
    asic: Broadcom Qumran2u BCM88284
    cpu: Intel Denverton-NS 4-core @ 1.6GHz
    memory: 8 GB DDR4
    storage: 32 GB SSD
    bmc: ASPEED AST2620
  features:
    optics-sfp28: 25G SFP28 SR/LR/ER, 10G SFP+ SR/LR/ER/ZR (datasheet Compatible
      Transceiver Types; HIG Port Overview gives 1/10/25G on these ports)
    optics-qsfp28: 100G QSFP28 SR4/LR4/ER4 (datasheet Compatible Transceiver Types;
      40/100G with FlexE support)
    timing: Stratum 3E OCXO; SyncE; IEEE 1588v2 (default, G.8265.1, G.8275.1, G.8275.2,
      SMPTE ST 2059-2, T-GM, T-BC/OC, T-TC); TSN; Class C accuracy - NOS integration
      required to activate, and SMPTE ST 2059-2 needs an additional licence (the
      vendor's own footnotes)
    gnss: internal receiver for master clock implementations
    flexe: OIF FlexE 1.1 and 2.0, 200G total bandwidth
    srv6: full Segment Routing over IPv6
  management:
    console: RJ45 RS-232 serial, 115200 8N1 (port labelled IOIO)
    oob: 1x 100M/1G RJ45 management port
    usb: 1 x USB 3.0 Type-A port
    timing-inputs: GNSS SMA in, 10MHz SMB in/out, 1PPS SMB in/out, ToD RJ45 in,
      BITS RJ48 in/out
  compliance:
    safety: UL 62368-1, IEC 62368-1
    emc: FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class A; EN 300 386;
      EN 55035; EN 301 489; EN 303 413; EN 62479; EN 50663; VCCI CISPR 32 Class A
    nebs: 'NEBS GR-63, GR-1089 and GR-3108 named in the datasheet''s Regulatory
      Compliance section; no NEBS level is claimed there and none is claimed here'
    environment: WEEE
  lifecycle: {eol: none-announced}
chassis:
  width: 440
  height: 43.5
  depth: 302
  ru: 1
  weight-kg: 4.5
  airflow: front-to-back

gaps:
- what: port-led-semantics
  scope: [sfp28, qsfp28, port-leds]
  reason: vendor-silent
  note: >-
    the HIG's front-panel LED section tables the GNSS, SYNC, STAT, FAN and PWR system
    lamps and the management port's pair, and gives no table at all for the port lamps.
    The fourteen sfp-led-pair and two qsfp-lane-leds placements therefore carry
    positions and no states. The sibling S9510-28DC files the same gap against the same
    silence in the same guide family, and several rows in those tables read 'need NOS to
    activate this feature', so these may be NOS-defined rather than simply
    undocumented - which is why this is vendor-silent and not nos-dependent.
  wanted: a per-NOS LED table, or photographs of a live unit with ports in known states.
- what: qsfp-centre-lamp-ownership
  scope: [port-leds]
  reason: vendor-silent
  note: >-
    the silver band between the two QSFP28 cages carries four green lane triangles with
    TWO round dark lamps between them, at about x 207.3 and 211.3. Port 1's four lane
    triangles sit in two boxes below the block, so the four in the band are port 0's -
    but nothing states what the two round lamps are, or whether they belong to port 0,
    to port 1 or one to each. They are drawn as two common/led-dot placements attached
    to the two ports one apiece, which is a guess at attachment and is said so here.
  wanted: a NOS LED table, or a labelled faceplate drawing of the QSFP28 block.
- what: sfp-cage-orientation-unresolved
  scope: [sfp28]
  reason: needs-photo
  note: >-
    no held image of this device resolves which way the stacked SFP28 cages face: at 9x
    the vendor render draws both rows as plain rectangles. They are modelled mirrored
    (bottom row rotate 180) on the physical argument that a belly-to-belly block keeps both
    bails reachable, which three other devices in this library show at resolutions that
    do resolve it - the rule, not an observation. The sibling S9510-28DC is drawn the same
    way on its port lamps, and one photograph of either settles both.
  wanted: a straight-on photograph of the SFP28 field at better than 8 px/mm.
- what: fan-position-legends
  scope: [fans]
  reason: needs-hardware
  note: >-
    'FAN ◄0' through 'FAN ◄4' are printed on each fan module's own right-hand strip in
    both the HIG Figure 8 rear strip and the vendor rear render, alongside the red 'E'
    airflow badge. They are module printing, not chassis printing, so they cannot be
    device silkscreen - and ufispace/fan-402825 is shared with the S9510-28DC, so it
    cannot carry a per-position digit either. Five legends exist on the hardware and
    none in the drawing.
  wanted: a per-placement legend mechanism for module skins, or a photograph of an empty
    fan bay showing whether the chassis behind carries the digit too.
- what: fru-power-unpublished
  scope: [fans]
  reason: vendor-silent
  note: >-
    ufispace/fan-402825 states no power draw and its own contract records the search
    across eight UfiSpace datasheets. This device's datasheet names FAN-402825-HD only
    as an ordering line and its HIG dimensions and weighs the fan FRU without a wattage;
    the only watt figures in either document are the 126 W typical and the input
    ratings. L29's standing warning is the live count of how much of the chassis total
    is a floor rather than a total.
  wanted: a photograph of the fan module's label, or a UfiSpace FRU datasheet.
- what: side-faces-estimated
  scope: [grounding, furniture]
  reason: needs-drawing
  note: >-
    no orthographic side elevation of the S9510-30XC exists in the intake. HIG Figure 5
    shows the grounding lug on the right side wall in a callout inset and section 8
    shows the lug and its screws in isolation, but nothing places them against a
    dimensioned side. The lug and the bracket screws are positioned from the sibling
    S9510-28DC's side faces, which are themselves unsourced in that file - so this is an
    estimate resting on an estimate, and it is said plainly rather than inherited
    quietly.
  wanted: a side elevation, or a photograph of either side with a known feature in frame.
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
    description: the 28 1/10/25G SFP28 ports, 2-29, in two blocks of belly-to-belly
      rows - eight columns then six
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
    description: the two 40/100G QSFP28 ports with FlexE support, 0 and 1, stacked in
      one block left of the SFP28 field
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: every indicator that belongs to a particular port - the ▲▼ pair in each
      SFP28 column's centre band, and the four-lane strips on the two QSFP28 ports
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the five front-panel system lamps beside their printed legend box -
      GNSS SYNC STAT FAN PWR
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: the timing block at the centre of the faceplate - a GNSS antenna on SMA,
      10MHz and 1PPS on SMB, BITS on RJ48 and ToD on RJ45. Five media, one job
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the management block - the out-of-band RJ45, a USB 3.0 service port and the
      RS-232 console in one bezel plate - plus the RESET button
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 redundancy, AC and DC versions alike'
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '4+1'
      redundancy-note: '4+1 - 4+1 hot-swap fans (the device description)'
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
