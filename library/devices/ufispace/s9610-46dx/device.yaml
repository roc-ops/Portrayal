                   {name: service, color: '#f59e0b', behavior: blinking}],
           description: 'HIG Front Panel LED table, FAN row - Off (fans are not initialized), Solid Green (all FAN modules working normally), Blinking Amber (FAN fail: one or more FAN modules need service). The blink on the fault state is this guide''s, not the S9600-56DX''s solid amber',
