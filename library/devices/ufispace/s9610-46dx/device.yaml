configurations:
  ac:
    kind: base
    description: >-
      The chassis as HIG Figure 7's rear elevation and the vendor rear product render both
      draw it - four FAN-808012-HCE exhaust fans and two PSU-202-AESR 2000 W AC supplies
      with a large C20 inlet and a red cord clip, front-to-back airflow, and the fifty-four
      traffic and management ports empty. The HIG rates the feed at 200-240 V and mates it
      with an IEC60320 C19 cord; on a single 110 VAC source each supply delivers 1000 W.
      Maximum system consumption 1263 W under 400G MSA optics, 1534 W with OpenZR+. No
      orderable chassis part number appears in any held document; see the chassis-sku gap.
    default: true
    airflow: front-to-back
    component-attrs:
      psu-202-ac:
        model: PSU-202-AESR
      fan-808012:
        model: FAN-808012-HCE
  dc:
    kind: orderable
    description: >-
      Dual 2000 W DC supplies (PSU-202-DESR, a two-post screw terminal under a hinged
      plastic cover, red latch) with the same FAN-808012-HCE exhaust fans. HIG Figure 4's
      callout says '2x AC or DC PSUs', so this build is orderable, but no held elevation or
      photograph shows it seated in this chassis - the DC PSU appears only in its own
      mechanical drawing (Figure 6) and the cabling figures (26-28). Datasheet input -40 to
      -72 V at 60 A; maximum system consumption 1220 W under 400G MSA optics and 1524 W
      with OpenZR+, both below the AC build's figures.
    airflow: front-to-back
    bays:
      psu-0: ufispace/psu-202-dc@1
      psu-1: ufispace/psu-202-dc@1
    component-attrs:
      psu-202-dc:
        model: PSU-202-DESR
      fan-808012:
        model: FAN-808012-HCE
