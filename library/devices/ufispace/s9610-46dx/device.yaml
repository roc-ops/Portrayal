                   {name: boot-failed, color: '#f59e0b'}],
           description: 'HIG Front Panel LED table, SYS row - Off (no power), Solid Green (Host CPU/BMC boot complete), Solid Amber (power is up but Host CPU/BMC boot failed)',
           group: status-leds, rel-pos: 2}
        - {ref: common/led-dot@1, id: led-fan, for: [rear/fan-0, rear/fan-1, rear/fan-2, rear/fan-3], at: [9.94, 62.35],
