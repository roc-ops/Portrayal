                   {name: acquiring, color: '#eab308'},
                   {name: sync-fail, color: '#eab308', behavior: blinking}],
           description: 'HIG Front Panel LED table, SYNC row - Off (system timing/clock synchronization is disabled or in free-run mode), Solid Green (timing core synchronized to PTP packet (Phase) or one of the external timing sources (Phase) and frequency locked), Blinking Green (synchronized to PTP packet (Frequency) or one of the external timing sources (Frequency)), Solid Yellow (acquiring state or holdover mode), Blinking Yellow (synchronization fail or acquiring/holdover time out). Five rows: this table is longer than the S9600-56DX''s three-row SYNC block and is transcribed as it stands',
