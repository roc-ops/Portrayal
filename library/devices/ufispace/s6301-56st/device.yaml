  width: 440
  height: 43.8
  depth: 440
  ru: 1
  weight-kg: 5.62
gaps:
- what: rj45-port-lamps-not-drawn
  scope: [ge]
  reason: needs-drawing
  note: >-
    the datasheet's LED row promises 'Link and Activity LEDs per port' and the
    front elevation shows lit corners inside every RJ45 aperture;
    std/rj45-ganged draws the bare opening and any lamp sits inside that
    aperture, so 48 jacks' worth of lamps exist on the hardware and none in the
    drawing - the MX150 and S6301-56STP treatment, recorded so the absence is a
    decision rather than an oversight.
  wanted: an rj45-ganged variant (or overlay mechanism) that can draw a corner
    lamp inside the aperture without colliding with the placement.
- what: front-panel-led-legends
  scope: [status-leds]
  reason: needs-photo
  note: >-
    the five front lamps are printed with legends beside them, but the highest
    resolution any held image reaches on that strip is HIG Figure 5 at 4.864
    px/mm on an embedded raster of about 1.8 px/mm of real data, where the
    glyphs are a grey smear. The names carried here (SYS, FAN, PSU0, PSU1, ID)
    are the HIG front-panel LED table's own, in the table's order, which the
    lamp order matches; the sibling S6301-56STP prints 'PS0'/'PS1' where its
    table says the same thing, so the printed strings on this device could
    differ from its table too.
  wanted: a straight-on photograph of the left end of the front panel at
    something better than 5 px/mm.
- what: fan-position-legends
  scope: [fans]
  reason: needs-hardware
  note: >-
    'FAN ◄0' / 'FAN ◄1' appear at the top of each fan module's right-hand strip
    in both rear renders and in HIG Figure 5. If they are chassis printing they
    are hidden behind the modules; if module printing, the shared fan-402825
    component cannot carry a per-position digit. A photo of the bay with the
    module out would settle which metal carries the ink.
  wanted: photograph of an empty S6301-56ST fan bay.
- what: second-grounding-location
  scope: [grounding]
  reason: needs-photo
  note: >-
    the HIG says 'there are two locations on the case in which the grounding lug
    may be fixed' and its Figure 23 shows one under a peel-off label on a side
    wall, but no held source locates it measurably; only the rear location,
    photographed, is modelled.
  wanted: a photograph or drawing locating the second lug position.
- what: fru-power-unpublished
  scope: [fans]
  reason: vendor-silent
  note: >-
    ufispace/fan-402825 states no draw and its own contract records the search:
    eight UfiSpace datasheets name the part only as an ordering line, with no
    wattage anywhere near it; this device's HIG likewise dimensions and weighs
    the fan FRU and tables its LED without a power figure. L29's standing
    warning is the live count of how much of the chassis total is a floor.
  wanted: a photograph of the fan module's label, or a UfiSpace FRU datasheet.
- what: intake-airflow-skins-not-drawn
  scope: [fans, psus]
  reason: needs-drawing
  note: >-
    the datasheet orders both directions - FAN-402825-HDN / -CDN and
    PSU-151-DESR / -DISB / -AESR / -AISB - and the HIG says the two are told
    apart by handle colour, red for front-to-back and blue for back-to-front.
    The rear render s6301-56st-3-rear.png shows the blue set. Every held
    component draws only the red exhaust unit, so the back-to-front build can be
    ordered but cannot be skinned, and no configuration is declared for it
    rather than declare one that would render identically to the red.
  wanted: blue-handle skins on ufispace/fan-402825, psu-151-dc and psu-151-ac.
groups:
  ge:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g}
    description: the 48 10M/100M/1G RJ45 access ports, ports 0-47; every jack
      carries integrated link and activity lamps inside its aperture, not drawn
      (see gaps)
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: the eight 1G/10G SFP+ uplinks, ports 48-55
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the SFP+ column lamp pairs in the centre band - left lamp
      upper port, right lamp lower port - plus the two management-port lamps
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the five front-panel system lamps - SYS FAN PSU0 PSU1 in a row
      with ID below the last
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the management cluster at the left-hand end - OOB RJ45, USB-A and
      RS-232 console in one bezel plate - plus the RESET button above it
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 redundant, hot-swappable'
  fans:
    term: Fan
    role: service
    index-origin: 0
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
