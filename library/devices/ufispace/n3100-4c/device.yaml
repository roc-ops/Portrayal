gaps:
- what: rear-edge-connector
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    Identity of the SFP-cage-like connector standing on the card's rear
    edge near the left corner (visible in datasheet fig-0002 and HIG
    fig-0003 angled renders, ~15 mm wide silver shell with a black
    slot face). The interface list (GNSS SMA, 1PPS/10MHz SMB, 4x SFP28)
    does not include it and no document names it; not drawn until
    identified.
- what: micro-usb-function
  scope: [usb-mgmt]
  reason: vendor-silent
  wanted: >-
    The function of the micro-USB receptacle on the left edge near the
    faceplate (datasheet fig-0002) - likely a console/debug port, but no
    document mentions it. Its position is also only estimated from an
    angled render; a straight-on side drawing or a caliper would settle
    both.
- what: storage-temp
  scope: [storage-temp-c]
  reason: sources-disagree
  wanted: >-
    Storage temperature upper bound: the datasheet environmental table
    says -40 to 70 C, the installation guide's requirements list says
    -40 to 65 C - same measure, same scope, different value. The manifest
    carries the datasheet 70; a vendor errata or newer revision would
    settle it.
