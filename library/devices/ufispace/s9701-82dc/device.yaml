configurations:
  base:
    kind: base
    description: >-
      Four FAN-803816-HI exhaust fans and two PSU-132-DESR 1300 W DC supplies,
      front-to-back, with all eighty-two ports empty. The DC build is what the vendor's own
      rear render shows seated - the two-post screw terminal block behind its hinged cover -
      so this is read rather than chosen. No orderable chassis part number appears in any
      held document.
    default: true
    airflow: front-to-back
    component-attrs:
      psu-132-dc:
        model: PSU-132-DESR
        airflow: exhaust
  dc:
    kind: orderable
    description: >-
      Dual 1300 W DC supplies, PSU-132-DESR, exhaust air flow (datasheet Available to
      Order). Input -40 to -75 V at 40 A maximum per feed, with a 60 A fast-acting fuse in
      each supply.
    airflow: front-to-back
