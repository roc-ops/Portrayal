configurations:
  base:
    kind: base
    power: ac
    description: >-
      Four FAN-803816-HC exhaust fans in a 3+1 set and two PSU-202-AESR 2000 W AC
      supplies in a 1+1 active-active set, front-to-back, with all forty-eight fabric
      ports empty. THE AC SUPPLY IS THE BASE BECAUSE IT IS WHAT THE HARDWARE SHOWS: both
      the HIG's rear elevation (Figure 7) and the vendor's rear render draw the supply
      with a C20 appliance inlet, a cord clip and a pull strap, which is the AC unit, not
      the DC terminal block. No orderable chassis part number appears in any held
      document.
    default: true
  ac:
    kind: orderable
    power: ac
    description: >-
      Dual 2000 W AC supplies, PSU-202-AESR, exhaust air flow (datasheet Available to
      Order). Input 200 to 240 V at 12.5 A per feed; the HIG notes that on a 110 V feed
      each supply delivers only 1000 W and the pair cannot then be swapped live. Maximum
      system consumption 1229 W at 45 C with optics fully populated and traffic at 100%.
    bays:
      psu-0: ufispace/psu-202-ac@1
      psu-1: ufispace/psu-202-ac@1
  dc:
    kind: orderable
    power: dc
    description: >-
      Dual 2000 W DC supplies, PSU-202-DESR, exhaust air flow (datasheet Available to
      Order). Input -40 to -72 V at 60 A per feed through a two-hole lug on a screw
      terminal block, with an 80 A fast-acting fuse in each supply. Maximum system
      consumption 1433 W at 45 C with optics fully populated and traffic at 100%. No held
      image shows this build; the face drawn is ufispace/psu-202-dc as built for the
      S9600-56DX, which orders the same PSU-202-DESR part number at the same rating.
    bays:
      psu-0: ufispace/psu-202-dc@1
      psu-1: ufispace/psu-202-dc@1
