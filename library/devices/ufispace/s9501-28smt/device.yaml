                   {name: acquiring, color: '#eab308'},
                   {name: sync-fail, color: '#eab308', behavior: blinking}],
           description: 'HIG SYNC row - Off (system timing synchronization disabled or in
             free-run mode), Solid Green (timing core, 1588 and SyncE, synchronized to an
             external source such as GNSS, 1PPS, PTP or BITS), Blinking Green (synchronized
             in SyncE mode), Solid Yellow (acquiring state or holdover), Blinking Yellow
