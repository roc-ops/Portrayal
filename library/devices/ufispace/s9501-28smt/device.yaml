    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: ports 26-27, the MACsec pair - the same 1/10G SFP+ as 20-25, given
      their own cyan band on the faceplate and their own row in the HIG port table,
      and bracketed '2 x 10G SFP+ MACsec' in HIG Figure 5
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: the timing block left of the lamp column - a GNSS antenna on SMA, 1PPS and
      10MHz on SMB, BITS on RJ48 and ToD on RJ45. Five media, one job
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the management cluster - the OOB RJ45, the USB-A maintenance port, the
      RJ45 serial console and the recessed reset button
