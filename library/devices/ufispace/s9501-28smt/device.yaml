                   {name: learning, color: '#22c55e', behavior: blinking},
                   {name: no-satellite, color: '#eab308'},
                   {name: antenna-short, color: '#eab308', behavior: blinking}],
           description: 'HIG GNSS row - Off (GNSS is not configured), Solid Green (normal
             state, self-survey complete), Blinking Green (learning state, self-survey not
             completed), Solid Yellow (power up, not tracking any satellite), Blinking
             Yellow (antenna short to ground). Every row but Solid Yellow is annotated
