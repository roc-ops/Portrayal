format: 1
kind: device
name: s9600-56dx
version: 3.0.5
maturity: modelled
manufacturer: UfiSpace
model: S9600-56DX
portfolio:
  line: Telecoms
  family: Open Aggregation Router
  series: S9600 Series
description: >-
  UfiSpace S9600-56DX 100G/400G open disaggregated aggregation router - 2RU white
  box on Broadcom Qumran2c at 4.8 Tbps with an 8 GB deep buffer, 48x QSFP28
  40/100G in two blocks of six four-high columns, 8x QSFP-DD 100/400G with
  400ZR/OpenZR+ in the middle, and 4x SFP28 1/10/25G that share in-band with
  QSFP28 port 0; a full timing block (GNSS on SMA, 10MHz and 1PPS on SMB, ToD on
  RJ45) with a Stratum 3E OCXO, an internal GNSS receiver and Class C 1588v2; four
  hot-swap fans (3+1) and dual 2000 W PSUs (1+1) at the rear, orderable AC or DC,
  exhaust airflow
provenance:
  sources: >-
    UfiSpace S9600-56DX datasheet
    for dimensions, weight, port inventory, platform, power, environment, compliance and
    the FRU ordering lines; S9600-56DX Hardware Installation Guide (s9600-56dx-hig) for
    the faceplate and rear figures, the FRU dimension table, the LED tables, the rack
    attachment-pin count, the space clearances and grounding; three vendor product images
    (photos/s9600-56dx-1-angle, -2-front, -3-rear) for colour, counts and construction.
    Figure quality was gated before anything was measured. HIG Figure 8 (the port
    overview, fig-0015) measures 1373 x 273 px body against the datasheet's 436 x 87.7 mm
    - aspect 5.029 against a true 4.9715, 1.16% out - so it is orthographic enough to
    carry geometry and is the front ruler at 3.1491 px/mm across and 3.113 px/mm down,
    the two axes taken separately so the 1.16% anisotropy is absorbed rather than
    ignored. HIG Figure 7 (fan overview, fig-0014) carries the rear elevation above two
    fan isometrics; its rear FACE (below the lid band, y 55-318) measures 1325 x 264 px,
    aspect 5.019, 0.96% out, and is the rear ruler at 3.039 / 3.010 px/mm. The 549 px
    datasheet front render (fig-0003) is 1.243 px/mm and the 520 px front photograph
    1.19 px/mm; both were used for colour, counts, construction and confirmation only.
  chassis: >-
    datasheet - 'Chassis (W x D x H) 2RU, 436 x 762 x 87.7 mm or 17.17" x 30" x 3.45"',
    'Weight: 19.26kg or 42.46lb (without FRU)'; the HIG's Component Physical Information
    table repeats the same triple and the same weight. 436 is the body and not a rack
    face: the HIG's Space Clearance paragraph states both numbers in one sentence - 'The
    S9600-56DX width is 17.16 inches (43.6cm) and shipped with a rack mount brackets
    suitable for 19 inch (48.3cm) wide racks' - so the ears are the 46.7 mm difference and
    are not drawn. Figure 8 corroborates it by drawing two small bracket tabs standing
    OUTSIDE the full-height body on each side (px 6-10 and 1384-1390 against a body of
    11-1383). 87.7 mm is 1.98 rack units, which is why the datasheet calls it 2RU. The
    762 mm depth is the chassis without FRUs; the HIG adds that the fan handles project
    29 mm and the PSU handles 30 mm, which is clearance rather than body and is carried
    on those components' relief instead.
  front-grid: >-
    drawing - the whole faceplate sits on ONE four-row grid, which is the finding that
    made the rest of this face cheap. Taking the pitch from a feature that repeats once
    per PORT rather than from the drawn cage bezels: a column profile through the left
    block (figure x 303-312) reads a flat luminance-150 module face at y 53-77, 102-126,
    151-174 and 199-222, so row centres are 65, 113.5, 162 and 210.5 px - a uniform
    48.5 px, 15.58 mm, with no interval more than 0.5 px off it. The BANDS that the eye
    reads (rows 1-2 as one assembly, rows 3-4 as another) are the white EMI strip between
    the first pair and the dark chassis web between the second and third rows; the pitch
    does not change. In millimetres the four row centres are 19.276, 34.856, 50.436 and
    66.016. THE QSFP-DD PORTS SHARE THE SAME GRID: their flat faces read 115 and 161.5 px
    against the grid's 113.5 and 162, half a millimetre, so they are carried on rows 2
    and 3 rather than given a second set of numbers.
  qsfp28-layout: >-
    drawing - twelve columns in two blocks of six. Cage bezel edges read off a clean band
    at figure y 80 give left-block centres 330.0, 393.0, 457.5, 521.0, 585.5 and 648.5 px
    (least-squares 329.72 + 63.814k, no residual over 1.5 px) and right-block centres
    1009, 1073, 1137.5, 1201, 1265.5 and 1330 px (1008.90 + 64.171k). In millimetres that
    is 101.21 + 20.264k and 316.88 + 20.377k. THE PITCH IS ITS OWN CHECK: 20.3 mm is the
    published ganged-QSFP cage pitch, arrived at here from a figure that was not set by
    it. The drawn bezel is 19.8 mm wide, so the registry's 18.5 mm std/qsfp-ganged
    aperture is centred on each column and the 1.3 mm of bright shell either side is drawn
    as panel decor - see panel-metal. Numbering is COLUMN-MAJOR and is Figure 8's own:
    port = 4 x column + row, so the left block's first column carries 0, 1, 2, 3 top to
    bottom and the last column of the right block carries 44, 45, 46, 47.
  qsfpdd-layout: >-
    drawing - two 2x2 assemblies in the middle of the panel, column centres 728, 792, 868
    and 931 px (227.68, 248.01, 272.14 and 292.14 mm), on rows 2 and 3 of the shared grid.
    Within an assembly the pitch is 20.3 and 20.0 mm, matching the QSFP28 blocks; between
    the two assemblies there is a 24.1 mm step with a vented chassis web in it. Numbering
    is Figure 8's: port = 48 + 2 x column + row, giving 48/50 over 49/51 in the left
    assembly and 52/54 over 53/55 in the right. std/qsfp-dd (19.0 x 10.0) is centred on
    each cell.
  connector-orientation: >-
    photo/drawing, measured rather than assumed, and it comes out OPPOSITE to the
    S9311-64D's. Each 2x2 assembly is one belly-to-belly ganged cage: the luminance
    profile at figure x 303-312 shows the upper port's graded bezel band BELOW its face
    (y 78-84) and the lower port's ABOVE its face (y 90-100), with the white perforated
    EMI strip between them at y 85-89. The two rows therefore mirror, detail facing the
    strip. std/qsfp-ganged, std/qsfp-dd and std/sfp-ganged all draw their cage lip near
    the TOP of the opening, so the UPPER port of every pair is rotate: 180 and the lower
    is unrotated - that is grid rows 1 and 3 rotated, and rows 2 and 4 not, which is the
    reverse of ufispace/s9311-64d and is stated here so nobody 'fixes' one to match the
    other. The USB 3.0 socket is PORTRAIT (its drawn silver shell is 6.0 wide by 13.2
    tall) so std/usb-a is rotated 90.
  panel-metal: >-
    THE BRIGHT SHELL AROUND EACH GANGED BLOCK IS PANEL, NOT PART. The datasheet's product
    render (fig-0003) shows the real thing with the cages EMPTY: six dark apertures per
    block sitting inside a bright bezel frame with a perforated EMI strip between the
    rows. std/ parts draw the opening and stop, so each 2x2 assembly is drawn here as one
    light decor rectangle with the apertures placed on it - upper QSFP28 band y
    13.49-39.51, lower 45.29-71.31, QSFP-DD 28.59-54.61, each 26.02 mm tall, with x and
    width per assembly measured off the same figure y 80 band. Without them the cages sit
    invisibly on a dark faceplate. The same reasoning puts a gold disc behind each coax
    jack (std/sma and std/smb draw the bore, not the knurled nut), a silver shell behind
    the portrait USB 3.0 socket and behind the micro-USB, and a white rectangle under the
    six system-lamp legends, which the figure prints dark on a printed white block.
  port-leds: >-
    drawing - and the arrangement differs per family, which is why it was counted rather
    than assumed. QSFP28: a green printed band runs above the upper assemblies and below
    the lower ones, carrying FOUR round lamps per port in TWO rows per column - colour
    detection returns 4 lamps per column at figure y 30-33 and 4 more at y 41-44, on a
    12.8 px (4.07 mm) pitch, repeated in the bottom band at y 233-236 and 244-247. That
    is one four-lamp cluster per port, so ufispace/lane-led-quad (14.4 x 2.6, 3.94 mm
    pitch) is placed 48 times: grid rows 1 and 2 in the upper band's two lamp rows, rows
    3 and 4 in the lower band's. QSFP-DD: four blue light-pipe strips instead, at figure
    x 684-695 and 965-976 and split into an upper and a lower element per side, each
    carrying two green lamps (y 115.5/125 and 151.5/161.5). Eight lamps for eight ports,
    which is the count this model uses - WHICH lamp serves which of the two ports in a
    strip's row is NOT stated anywhere and is recorded in the port-led-semantics gap.
    White diamond light pipes stand at each cage assembly's ends inside the green bands
    (figure x 414-422 and 427-435 at the first internal boundary, singles at the block
    ends) and are drawn as decor.
  legends: >-
    drawing, positions measured, wording read where it resolves and taken from the HIG's
    own callouts where it does not. Readable at 4-6x: 1PPS, 10MHZ, GNSS ANT, TOD, RESET,
    the S9600-56DX wordmark at the bottom right and the 0/1..0/4 pair legends on the
    yellow band. Not readable and taken from HIG Figure 4's callout list instead: the two
    IOIOI console marks and the network symbol under the management jack. The six system
    lamps' names are the HIG Front Panel LED table's own row order - SYNC, SYS, FAN, PS0,
    PS1, ID - printed on a white block at x 6.67-10.16, y 55.90-70.99 with the lamps in a
    column immediately to its right at 2.51 mm pitch, the same construction the S9311-64D
    uses. THE YELLOW AND ORANGE BANDS ARE REAL PAINT, not figure highlighting: the
    datasheet's product render shows the same yellow band with the same orange sub-band
    under it. What they MEAN is not stated - the datasheet's only related sentence is
    that the four SFP28 ports are 'In-band port share with 100GE Port 0' - so they are
    drawn and not interpreted. A small hazard triangle sits at the yellow/orange boundary
    in both images and is NOT drawn, because nothing states what it warns of.
  port-numbers: >-
    NOT DRAWN, deliberately, and this is a positive finding rather than an omission.
    HIG Figure 8 numbers every port - 0-47 in green, 48-55 in blue, 0/1-0/4 in orange -
    but prints each numeral ON the schematic module face, where a seated transceiver
    would cover it. The datasheet's product render of the same panel with the cages EMPTY
    (fig-0003) shows no numeral anywhere on the metal: the bright bezel frames and the
    EMI strips are unmarked at 7x. So the NUMBERING is certain and is used for every id
    and rel-pos here; where the vendor prints it is recorded as a gap. The 0/1..0/4 pair
    legends ARE on the metal - they sit on the yellow band above the SFP28 block, outside
    the cages - and are drawn.
  sfp28-block: >-
    drawing - a 2x2 assembly at figure x 169-283, y 46-128 with a white cross divider at
    x 227 and y 87, so column centres 59.22 and 77.64 mm and row centres 19.60 and 33.09
    mm. THE DRAWN CELL IS 18.1 x 12.8 mm AND THE STANDARD OPENING IS 14.25 x 10.4, which
    is not reconciled and should not be: std/sfp-ganged is the registry part and is placed
    centred on the measured centres, so the block's outer extent and each port's centre
    are the figure's while the aperture is the standard's. The 27% surplus in the drawn
    width is the one place on this face where the figure and the registry disagree by more
    than a millimetre, and the registry wins for an opening size. Numbering is
    column-major like the rest: 0/1 over 0/2 in the left column, 0/3 over 0/4 in the
    right.
  scale-crosscheck: >-
    the two front images were measured independently and agree on SPAN but not on ORIGIN,
    and both readings are recorded rather than one being quietly preferred. HIG Figure 8
    puts the four port-LED lamp rows at 8.51, 12.05, 73.72 and 77.26 mm from its own top
    edge; the datasheet render puts them at 9.74, 12.99, 75.11 and 78.36. Top-to-bottom
    span 68.75 against 68.62 mm - 0.13 mm across 436 mm of panel, which is as close as
    two independently drawn figures get. The whole difference is a 1.2 mm constant offset,
    which is 1.5 px at the render's own 1.243 px/mm and therefore inside its edge
    uncertainty, so the HIG figure's origin is the one carried here. A reader who
    re-measures the render and finds everything 1.2 mm low has found this sentence, not
    an error.
  rear-layout: >-
    drawing - HIG Figure 7's rear elevation at 3.039 px/mm across and 3.010 down. Four fan
    faces on an 84.47 mm pitch, read off the four green status lamps (figure x 71.6, 328.0,
    585.0, 841.7 - three intervals of 256.5, 257.0, 256.5 px), and anchored through
    ufispace/fan-803816-hi's own lamp position (9.1, 20.5 within its 80 x 81.5 face) to put
    the first bay at x 9.20, y 2.56. THE PITCH WAS THEN MEASURED AGAIN IN A DIFFERENT
    IMAGE: the rear photograph, 948 px across the body at 2.174 px/mm, puts the same four
    lamps on an 84.4 mm pitch. Then a 5 mm chassis strip, the grounding column (a silver
    two-hole plate, an earth symbol, a captive screw and the FAN 0|1|2|3 position key), and
    the two PSU bays stacked at x 375.0, 50.5 wide and 40.2 tall, with PSU0 over PSU1. The
    bay legends PSU0 and PSU1 are chassis silkscreen: which bay is 0 is a position fact and
    cannot live on an interchangeable FRU.
  psu-build: >-
    THE GUIDE DRAWS ONE BUILD AND THE PHOTOGRAPH SHOWS THE OTHER, and both are modelled.
    HIG Figure 7's rear elevation draws the AC supply (a portrait C20 inlet with a cord
    clip, vent grid on the LEFT, lamp 8.5 mm from the bay's left edge); the rear product
    photograph shows the DC supply (a two-post screw terminal under a hinged plastic cover
    on the LEFT, vent grid and lamp on the RIGHT at 37.5 mm). They are not two readings of
    one face - they are two faces, laid out opposite ways round, and the datasheet orders
    both: PSU-202-AESR and PSU-202-DESR, 2000 W each, exhaust airflow. The AC build is the
    default here because it is the one the vendor's own elevation draws, and the DC build
    is a configuration. Neither is a gap; what IS a gap is the PSU depth, which the HIG's
    table and the HIG's own PSU drawing state differently.
  grounding: >-
    HIG section 8 - the router is grounded through a #6 AWG two-hole lug and M4 screws
    supplied in the kit, and the guide says 'The location for securing the grounding lug is
    at the rear of the case and is covered with a protective label' and later 'remove the
    protective label'. ONE location, not two. The rear elevation and the rear photograph
    both show that location as a bare silver two-hole plate with an earth symbol beside it
    - no yellow label on either, unlike the S9311-64D whose figure draws the label in place
    - so the plate is drawn as the metal both images show and the label's absence is noted
    here rather than invented onto the panel. Plate at x 348.6-357.8, y 4.98-38.87 with its
    two holes at y centres 9.0 and 25.2; the earth symbol at x 361.6-366.6, y 17.6-22.3.
  views: >-
    Six views. TOP: y = 0 is the REAR, per the house convention and HIG Figure 4's
    footprint drawing, which prints the fan handles at the top of the panel. Seven long
    stadium recesses run across the lid; their spacing is proportioned off that drawing and
    is ESTIMATED, because the drawing's own aspect (370 x 739 px against 436 x 762 mm,
    12.5% out) fails the figure gate and only fractions along one axis may be taken from
    it. BOTTOM mirrors left-right and carries the compliance sticker at an estimated
    position - no held figure shows the underside. LEFT (x = 0 is the REAR) and RIGHT
    (x = 0 is the FRONT): each side carries the five rail attachment pins the HIG's rack
    mounting section counts - 'The chassis has 5 attachment pins on each side, for a total
    of 10 pins' - plus the M4 screw that locks the inner rail, 'two M4 screws (one on each
    chassis side)'. The COUNT is the vendor's; every POSITION on both side faces is
    ESTIMATED, because no held figure dimensions them. Both side faces carry only symmetric
    content, so the depth-axis conventions are stated here rather than exposed by any
    asymmetric feature.
  attrs: >-
    datasheet - Specifications, Environmental, Performance, Regulatory Compliance and
    Accessories sections, transcribed into sections. Compliance strings kept verbatim,
    semicolon-separated, untidied.
  power: >-
    datasheet 'Typical power: 481 Watts (no transceiver)' - the vendor's own scope, so
    power-envelope is bare. The HIG's Connecting Power sections state the maximum twice,
    once per build: 1497 W for DC and 1483.3 W for AC, and unlike the typical figure these
    ARE qualified, in a note printed beside them - 'Temperature: 45C, Optics: fully
    populated, Traffic: 100% load', with OpenZR+ transceivers on selected ports. 1497 is
    carried as power-max-w because max means the highest of the two builds, and the 13.7 W
    difference is recorded here rather than as a conflict: they are two builds, not two
    readings. Note that power-envelope therefore describes the TYPICAL figure's scope and
    not the maximum's, which is fully-configured and says so in this sentence. These are
    the vendor's figures as the vendor states them and are NOT reconciled against the
    module set: the fans publish no draw at all, so any total built from the modelled
    modules is a floor. Provisioning reserve 2000 W per circuit (HIG). PSU rating 2000 W
    per supply from the ordering lines; on a single 110 VAC feed the HIG derates each
    supply to 1000 W.
  vent-islands: >-
    derived - a vent field is a perforation and the drawing said so, but the marks
    printed inside one were floating on air (L64). The vendor interrupts the
    perforation where it prints, so each of those marks now has a solid patch under it
    in the chassis colour, drawn over the vent the way ufispace/s9600-72xc paints its
    port bands over one. The patch is the printing's own footprint plus 0.4 mm, which is
    what the S9610-36D's front render measures: its slots stop 0.4 mm outside each lamp
    cluster and resume 0.4 mm past it. Where a vent is simply measured wider than the
    metal it reaches, this states the metal that the printing proves is there without
    re-measuring the field.
  lifecycle: >-
    searched 2026-08-28: 'UfiSpace S9600-56DX end of life' - no announcement found; the
    vendor's telco aggregation product page and the hardware installation guide are both
    live. none-announced is a real finding, not an absence.
attrs:
  performance:
    switching-capacity: 4.8 Tbps
    packet-buffer: 8 GB
  power:
    power-typical-w: '481'
    power-max-w: '1497'
    power-envelope: bare
    input-ac: 200 to 240 V, 12.5 A
    input-dc: -40 to -72 V, 60 A
    psu-redundancy: 1+1 hot-swappable
  thermal:
    fan-redundancy: 3+1 hot-swappable
    airflow: front-to-back (exhaust fans and exhaust PSUs)
  environmental:
    operating-temp: 0 to 45 C
    operating-humidity: 5 to 85% RH non-condensing
    storage-temp: -40 to 70 C
    storage-humidity: 5 to 93% RH non-condensing
  platform:
    asic: Broadcom Qumran2c BCM88820
    cpu: Intel Icelake-D 8-core @ 2.1 GHz
    memory: 32 GB DDR4
    storage: 128 GB SSD
    bmc: Aspeed AST2620
  features:
    timing: >-
      Stratum 3E OCXO, ITU-T SyncE, IEEE 1588v2 (default, G.8265.1, G.8275.1, G.8275.2,
      SMPTE ST 2059-2 with an additional licence), T-GM, T-BC/OC, T-TC, Time Sensitive
      Networking; NOS integration is required to activate any of it
    gnss: internal GNSS receiver for master-clock implementations; edge Grandmaster with PRTC
    optics-qsfp-dd: 400G QSFP-DD SR/LR/ER/ZR/OpenZR+, up to 600 km (datasheet port table)
    optics-qsfp28: 100G QSFP28 SR/LR/ER/ZR, up to 80 km; 40G
    optics-sfp28: 25G SFP28 SR/LR/ER up to 40 km; 10G SFP+ SR/LR/ER; 1G SFP SX/LX/EX
    sfp28-sharing: the four SFP28 ports are in-band port share with 100GE port 0 (datasheet)
    timing-cable: >-
      50 ohm SMA coaxial with a 1/4-36UNS-2B connector for GNSS, 50 ohm SMB coaxial with a
      10-32UNF-2A connector for 1PPS and 10MHz, shielded RJ45 for ToD (datasheet Compatible
      Timing Cable Types)
    antenna: >-
      an active GNSS antenna is required - 50 ohm impedance match, 5 V DC, noise figure
      1.5 dB maximum, internal LNA gain 35-42 dB (HIG Installing an Antenna)
    timing-interfaces: GNSS in on SMA, 10MHz in/out on SMB, 1PPS in/out on SMB, ToD in/out on RJ45
  management:
    console: RJ45 RS-232 plus a micro-USB serial console
    oob: 1x RJ45 100/1000M
  compliance:
    safety: UL 62368-1; IEC 62368-1
    emc: >-
      FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386;
      EN 55035; EN 301 489; EN 303 413; EN 62479; EN 50663
    environment: RoHS; WEEE
  lifecycle:
    eol: none-announced
chassis:
  width: 436
  height: 87.7
  depth: 762
  ru: 2
  color: '#3c3c3c'
  weight-kg: 19.26
# What no rule can find, because the manifest looks complete.
gaps:
- what: port-led-semantics
  scope: [qsfp28, qsfpdd-400g, sfp28, port-leds]
  reason: vendor-silent
  note: >-
    HIG section 10 tables the six front-panel lamps (SYNC, SYS, FAN, PS0, PS1, ID), the PSU
    FRU lamp and the Fan FRU lamp, and gives no table at all for the port lamps. Each QSFP28
    port carries a four-lamp cluster in the printed band above or below its block and each
    QSFP-DD port a lamp in one of the four blue light-pipe strips; nothing states what any
    of them means, nor - for the QSFP-DD strips - which of a strip's two lamps serves which
    of the two ports on that row. The lamp-to-port pairing written here is derived from the
    count alone (eight lamps, eight ports, taken left to right) and is the one thing in this
    device's LED model that is not read off a source. Every lamp keeps the component default
    of off/on rather than an invented link/activity vocabulary.
  wanted: >-
    a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a live unit with
    known ports up, down and passing traffic
- what: mgmt-jack-led-semantics
  scope: [oob]
  reason: vendor-silent
  note: >-
    The two lamps in the out-of-band jack's aperture are drawn green in HIG Figure 8 and are
    modelled, but THIS guide tables them nowhere. The link/activity vocabulary they carry is
    borrowed from the S9510-28DC and S9311-64D hardware guides, whose Management Port LED
    tables give 1G green on the left and 10M/100M amber on the right for the same class of
    jack on the same vendor's boxes. That is an inference from a sibling document and is
    recorded as one rather than being left to look sourced.
  wanted: a management-port LED table in a later revision of this guide
- what: port-number-printing
  scope: [qsfp28, qsfpdd-400g]
  reason: needs-photo
  note: >-
    HIG Figure 8 prints every port numeral on the schematic module face, where a seated
    transceiver would cover it, and the datasheet's product render of the same panel with
    the cages empty shows no numeral anywhere on the metal at 7x. The NUMBERING is certain
    and is used throughout; where the vendor actually prints it - on the bezel frame, on the
    EMI strip, or nowhere at all - is not established, so no numerals are drawn.
  wanted: a straight-on high-resolution photograph of the faceplate with the cages empty
- what: psu-depth-disagreement
  scope: [ufispace/psu-202-ac@1, ufispace/psu-202-dc@1]
  reason: sources-disagree
  note: >-
    Same measure, same scope, two values, so it is filed rather than reconciled. The HIG's
    Component Physical Information table gives the PSU 321 mm deep; HIG Figures 5 and 6, the
    vendor's own mechanical drawings of the AC and DC units, both dimension the body at
    360.0 mm and 369.8 mm over the handle. Nothing in this model depends on it - a module's
    `size` is its face - but a rack depth budget would.
  wanted: a UfiSpace PSU-202 datasheet, or a revision of the HIG that reconciles its own table
- what: fan-dimension-disagreement
  scope: [ufispace/fan-803816-hi@1]
  reason: sources-disagree
  note: >-
    FAN-803816-HI is ordered by both this router and the S9600-28DX and the two guides
    dimension it differently: the S9600-28DX HIG gives 80 x 113 x 81.5 mm and this one gives
    80 x 122 x 80 mm for the same part number. Width agrees; depth differs by 9 mm and face
    height by 1.5 mm. The component carries the 28DX figures because that is where it was
    built and where its art was measured, and this device reuses it unchanged rather than
    forking a second contract off a one-line table difference.
  wanted: a UfiSpace FRU datasheet for FAN-803816-HI
- what: grounding-label
  scope: [ground-mark, rear]
  reason: sources-disagree
  note: >-
    HIG section 8 says the grounding location 'is covered with a protective label' and step 5
    says to remove it, but neither the rear elevation nor the rear product photograph shows a
    label there - both draw a bare silver two-hole plate. The plate is modelled as the two
    images show it. Whether the shipped unit has a label over it, and what colour, is not
    established here.
  wanted: a photograph of an unopened unit's rear panel
- what: chassis-sku
  scope: [ac, dc]
  reason: vendor-silent
  note: >-
    No orderable chassis part number appears in any held document. The datasheet's Available
    to Order block lists the PSU and fan SKUs only, and the HIG names the product S9600-56DX
    in its title, its overview and its dimensions table without printing a number. The
    configurations here therefore carry no `part-numbers`. The S9510-28DC's history is the
    warning: 'no SKU exists' was written there on exactly this evidence and was false, so
    this says only that we hold no document naming one.
  wanted: a UfiSpace ordering guide or price list for the S9600 aggregation line
groups:
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the timing block down the left edge - a GNSS antenna input on SMA, 10MHz and 1PPS
      each in/out on SMB, and ToD in/out on RJ45. Four media, one job, and the datasheet
      groups them under one heading, Timing Interfaces
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management block at the left of the faceplate - the RS-232 console RJ45, the
      micro-USB serial console, the USB 3.0 service port, the out-of-band RJ45 and the
      recessed reset button. Same block, and the same word for it, as the library's other
      UfiSpace white boxes
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
    description: >-
      the 2x2 SFP28 quad, '4 x 1/10/25G SFP28 (In-band port share with 100GE Port 0)' in
      the datasheet's physical list. The vendor numbers them 0/1 to 0/4 - a port-0 subport
      notation rather than a run of its own - so rel-pos is 1 to 4 and index-origin is 1
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 400g}
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      the six chassis indicators the HIG's Front Panel LED table names - SYNC, SYS, FAN,
      PS0, PS1 and the blue ID beacon
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      every indicator that belongs to a particular port - the forty-eight QSFP28 lane
      clusters in the printed bands, the eight QSFP-DD lamps in the blue light-pipe
      strips, and the two lamps in the out-of-band jack's own aperture
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 hot-swappable'
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '3+1'
      redundancy-note: '3+1 - 3+1 hot-swappable (attrs fan-redundancy)'
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
