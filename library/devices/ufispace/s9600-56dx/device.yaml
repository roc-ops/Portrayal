configurations:
  ac:
    kind: base
    description: >-
      The chassis as HIG Figure 7's rear elevation draws it - four FAN-803816-HI exhaust
      fans and two PSU-202-AESR 2000 W AC supplies with portrait C20 inlets and red
      latches, front-to-back airflow, and the sixty traffic and management ports empty.
      The HIG rates the feed at 200-240 V and notes that on a single 110 VAC source each
      supply delivers 1000 W. No orderable chassis part number appears in any held
      document; see the chassis-sku gap.
    default: true
    airflow: front-to-back
    component-attrs:
      psu-202-ac:
        model: PSU-202-AESR
      fan-803816-hi:
        model: FAN-803816-HI
  dc:
    kind: orderable
    description: >-
      Dual 2000 W DC supplies (PSU-202-DESR, two-post screw terminal under a hinged
      plastic cover, red latch) with the same FAN-803816-HI exhaust fans. This is the
      build the vendor's rear product photograph shows. Datasheet input -40 to -72 V at
      60 A; the HIG's DC section gives the maximum system consumption as 1497 W against
      the AC build's 1483.3 W.
    airflow: front-to-back
    bays:
      psu-0: ufispace/psu-202-dc@1
      psu-1: ufispace/psu-202-dc@1
    component-attrs:
      psu-202-dc:
        model: PSU-202-DESR
      fan-803816-hi:
