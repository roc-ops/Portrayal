configurations:
  ac:
    kind: base
    description: >-
      Dual 1300W AC PSUs with front-to-back airflow fans (FAN-405637-HD, red handles) -
      the build both vendor rear renders show. The back-to-front build (blue handles and
      latches, FAN-405637-CD) is orderable and is not modelled; no held document ties a
      PSU part number to a latch colour (see the psu-airflow-sku-mapping gap) and none
      prints a chassis SKU (see chassis-sku)
    default: true
    airflow: front-to-back
  dc:
    kind: orderable
    description: >-
      Dual 1300W DC PSUs (-40 to -75 V, screw-terminal input) with front-to-back airflow
      fans; the HIG's rear elevation on page 13 is this build
    airflow: front-to-back
    bays:
      psu-0: ufispace/psu-132-dc@1
      psu-1: ufispace/psu-132-dc@1
