           description: 'HIG section 10, Front Panel LED table, SYS row - OFF (no power), Solid Green (host CPU/BMC is up), Blinking Green (reserved), Solid Amber (power is up but host CPU/BMC boot failed), Blinking Amber (reserved). The two reserved rows are transcribed as reserved rather than invented into states',
