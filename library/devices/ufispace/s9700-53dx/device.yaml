configurations:
  ac:
    kind: base
    description: >-
      The chassis as HIG Figure 7's rear elevation and the vendor's own rear product render
      both draw it - four FAN-803816-HC exhaust fans and two PSU-202-AESR 2000 W AC supplies
      with C20 appliance inlets and red latches, front-to-back airflow, and the fifty-five
      traffic, fabric and management ports empty. The HIG rates the feed at 200-240 V and
      notes that on a single 110 VAC source each supply delivers only 1000 W, at which point
      hot-swapping a supply is no longer supported. No orderable chassis part number appears
      in any held document; see the chassis-sku gap.
    default: true
    component-attrs:
      psu-202-ac:
        model: PSU-202-AESR
      fan-803816-hc:
        model: FAN-803816-HC
  dc:
    kind: orderable
    description: >-
      Dual 2000 W DC supplies (PSU-202-DESR, two-post screw terminal under a hinged plastic
      cover) with the same FAN-803816-HC exhaust fans. Datasheet input -40 to -72 V at 60 A;
      the HIG's DC section gives the maximum system consumption as 1434 W against the AC
      build's 1422 W. No held image of THIS device shows a DC supply - see the
      dc-build-unphotographed gap.
    bays:
      psu-0: ufispace/psu-202-dc@1
      psu-1: ufispace/psu-202-dc@1
    component-attrs:
      psu-202-dc:
        model: PSU-202-DESR
      fan-803816-hc:
        model: FAN-803816-HC
