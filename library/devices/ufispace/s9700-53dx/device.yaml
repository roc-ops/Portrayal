format: 1
kind: device
name: s9700-53dx
version: 4.0.0
maturity: modelled
manufacturer: UfiSpace
model: S9700-53DX
portfolio:
  line: Telecoms
  family: Disaggregated Core and Edge Router
  series: S9700 Series
description: >-
  UfiSpace S9700-53DX 100G open disaggregated core and edge router - 2RU white box on
  Broadcom Jericho2 with an OP2 external TCAM and an 8 GB deep buffer, 4.8 Tbps, built
  to run standalone or as a line node in a distributed disaggregated chassis behind an
  S9705-48D or S9725-64E fabric switch. Forty 40/100G QSFP28 service ports in ten
  four-high columns, of which ports 0-19 break out to 4x25GE or 4x10GE; thirteen 400G
  QSFP-DD fabric ports on a pink band at the right; two 10G SFP+ management ports, an
  RJ45 and a micro-USB console, a USB 2.0 Type-A service port, a 100/1000M out-of-band
  RJ45, a recessed reset and a two-digit beacon display. Four hot-swap fans (3+1) and
  dual 2000 W PSUs (1+1) at the rear, orderable AC or DC, front-to-back airflow
profile: networking
stack-exceptions:
- pairs: [[fab-0, fab-1], [fab-2, fab-3], [fab-4, fab-5], [fab-6, fab-7], [fab-8, fab-9],
    [fab-10, fab-11]]
  reason: >-
    Measured, in provenance.connector-orientation. The QSFP-DD rows are two separate
    single-height ganged shells, and at 7x they are drawn identically - the same bright lip
    inside the same edge - unlike the mirrored QSFP28 columns on the same faceplate. Neither
    QSFP-DD row is turned.
provenance:
  stack-orientation:
    confidence: drawing
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the reading of the cages
      recorded in this provenance: the 20 QSFP pairs (port-0/port-1 to port-38/port-39), the 1 SFP
      pair (mgmt-sfp-0/mgmt-sfp-1). 21 of these were drawn with the upper cage turned before the
      std cage art moved its lip to the bottom of the opening; turning them keeps the lips in the
      middle band where they were drawn and seats every optic bail-outward. Declared in
      stack-exceptions with the reading that keeps them otherwise: the 6 QSFP-DD pairs
      (fab-0/fab-1 to fab-10/fab-11).
  sources:
    note: >-
      UfiSpace S9700-53DX datasheet for dimensions, weight, port inventory, platform, power,
      environment and compliance and the FRU ordering lines; S9700-53DX Hardware Installation
      Guide (s9700-53dx-hig) for the faceplate and rear figures, the FRU dimension table, the LED
      tables, the port table, the rack attachment-pin count, the space clearances and grounding;
      three vendor product images (photos/s9700-53dx-1-view angle, -2-view front, -3-view rear)
      for colour, counts and construction. THE MODEL NAME PRINTED IN THE ARTWORK WAS READ BEFORE
      ANYTHING WAS MEASURED, because this vendor ships near-twins: HIG Figure 8 and the unnumbered
      figure beside it both letter the faceplate 'S9700-53DX' at the bottom right, and both draw
      40 QSFP28 in ten columns plus 13 QSFP-DD, which is this model's datasheet inventory and not
      the S9700-23D's. The rear elevation (Figure 7) carries no model name and is the same
      four-fan, two-PSU rear the whole S9700 family shares; it is used here for the rear and that
      reuse is stated rather than hidden. Figure quality was gated before anything was measured.
      The FRONT ruler is the unnumbered port figure on HIG page 11 (fig-0016), the one drawn with
      every cage EMPTY, which is what makes the metal readable: its body measures 1365 x 267 px
      against the datasheet's 436 x 87.7 mm - aspect 5.112 against a true 4.9715, 2.8% out - so it
      is NOT orthographic enough to carry absolute scale on both axes, and only FRACTIONS of each
      axis anchored to its own datasheet dimension are taken from it: 3.1307 px/mm across and
      3.0445 px/mm down. HIG Figure 8 (fig-0015), the same panel with modules seated, is the
      independent second reading. The REAR ruler is HIG Figure 7 (fig-0014), body x 16.5-1348.5 px
      and face y 50.5-317.5 px, 3.0550 / 3.0445 px/mm, aspect 4.989 - 0.35% out, which is
      orthographic. The TOP view is the left drawing of HIG Figure 4 (fig-0010), body 338 x 589 px
      against 436 x 762 mm, aspect 0.5738 against 0.5722, 0.28% out - also orthographic, which is
      why the lid recesses are measured and not estimated. The three product renders are 520 px
      wide and were used for colour, counts and construction only.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 'Chassis (W x D x H) 2RU, 436 x 762 x 87.7 mm or 17.17" x 30" x 3.45"', 'Weight:
      21.14 kg or 46.61 lb (Without FRU)'; the HIG's Component Physical Information table repeats
      the same triple and the same weight. 436 is the BODY and not a rack face: the HIG's Space
      Clearance paragraph states both numbers in one sentence - 'The S9700-53DX chassis width is
      17.16 inches (43.6cm) and is shipped with an adjustable mounting rail kit suited for
      standard 19 inch (48.3cm) wide racks' - so the ears are the 46.7 mm difference and are not
      drawn. 87.7 mm is 1.98 rack units, which is why the datasheet calls it 2RU. The 762 mm depth
      is the chassis without FRUs; the HIG adds that the fan handle projects 1 inch (25 mm) and
      the PSU handle 1.5 inches (38 mm), which is clearance rather than body and is carried on
      those components' relief.
  front-grid:
    confidence: drawing
    note: >-
      drawing - the QSFP28 field sits on ONE four-row grid and the pitch was taken from a feature
      that repeats once per PORT, never from the drawn cage shells. Row centres are the black cage
      openings measured down a single column of fig-0016 (x 368-412): 77-99, 126-147, 172-194 and
      220-241 px, centres 88, 136.5, 183 and 230.5, which least-squares to 18.20 + 15.57k mm with
      no residual over 0.35 mm. The four rows read as two visual bands only because the two upper
      rows share one cage shell and the two lower rows share another; the pitch does not change
      across the gap between them. THE QSFP-DD PORTS SHARE THE SAME GRID: their own openings read
      34.32 and 48.78 mm against the grid's 33.77 and 49.34, half a millimetre, so they are
      carried on rows 2 and 3 rather than given a second set of numbers. Note that the row centres
      here are the BLACK OPENING centres; including each cage's graded bezel band moves an
      aperture centre by about a millimetre, which is three pixels at 3.04 px/mm and is inside
      what this figure resolves.
  qsfp28-layout:
    confidence: drawing
    note: >-
      drawing, measured twice in two different images and agreeing to one pixel. In fig-0016 the
      black cage openings of columns 4-10 sit at 391.0, 465.5, 539.0, 612.0, 685.5, 758.5 and
      832.0 px (columns 1-3 are under the yellow breakout highlight and were not used); in
      fig-0015 the white ▲/▼ pairs printed in the green band give column centres of 170.0, 243.0,
      316.75, 390.0, 463.0, 536.75, 610.0, 683.25, 757.0 and 830.0 px, which after the one-pixel
      origin difference between the two figures land within 1 px of the openings everywhere they
      overlap. Least squares over the openings gives a uniform 73.5 px = 23.478 mm pitch and a
      first column at 52.54 mm. The drawn opening is 17.6 mm wide against the registry's 18.5 mm
      std/qsfp-ganged aperture, and the registry wins for an opening size; the bright shell around
      each column measures 19.8 mm and is drawn as panel decor - see panel-metal. Numbering is
      Figure 8's own and is COLUMN-MAJOR within each band: the upper band carries 0/1 in column 1
      through 18/19 in column 10, the lower band 20/21 through 38/39. The HIG's port table
      confirms it - 'Port ID 0 ~ 19 ... 40GE/100GE (10GE/25GE in breakout)' and '20 ~ 39 ...
      40GE/100GE'.
  qsfpdd-layout:
    confidence: drawing
    note: >-
      drawing - thirteen 400G fabric ports at the right of the panel, in three 2x2 groups plus one
      odd port, which is the shape the count forces and is drawn exactly so. Black opening centres
      in fig-0016 are 921.5, 981.0, 1055.0, 1114.5, 1188.0, 1246.5 and 1322.0 px = 292.43, 311.43,
      335.06, 354.07, 377.55, 396.24 and 420.35 mm. The pitch INSIDE a pair is 19.00, 19.01 and
      18.69 mm and BETWEEN pairs 23.64 and 23.48; the 19.0 is carried uniformly - the third pair's
      second column is written 396.55 rather than the measured 396.24, one pixel over, because
      19.0 is the registry's own std/qsfp-dd width and three readings of one pitch that come out
      19.00, 19.01 and 18.69 are one pitch measured three times, not three pitches. Ports 0-11 are
      the three pairs, upper row even and lower row odd, and port 12 sits alone in the UPPER row
      at the right with no partner below it - the pink band prints '▲12' and a single lamp there
      and stops, which is a rule ending where the hardware ends rather than a rule left
      unfinished.
  connector-orientation:
    confidence: measured
    note: >-
      measured, not assumed, and it differs between the two cage families on this one panel.
      QSFP28: each column is a 1x2 belly-to-belly ganged cage and the two rows MIRROR - a column
      profile through fig-0016 shows the upper port's graded bezel band BELOW its black face (y
      102-107) and the lower port's ABOVE its face (y 122-123), with the perforated EMI strip
      between them at y 108-121. std/qsfp-ganged draws its cage lip at the BOTTOM of an upright
      opening, so the LOWER port of every pair is rotate: 180 and the upper is unrotated - grid
      rows 2 and 4 rotated, rows 1 and 3 not. The stacked SFP+ pair and the stacked RJ45 pair mirror the same
      way. QSFP-DD: the two rows are SEPARATE single-height ganged shells and, at 7x, they are
      drawn IDENTICALLY rather than mirrored - both show the same bright lip inside the same edge
      - so both rows are placed unrotated. That difference between the two families on one
      faceplate is the reason it is written down. The RJ45 pair was read in a zoomed crop before
      being trusted: the upper jack's latch notch is at the TOP of its opening and the lower
      jack's at the BOTTOM, and the lower jack is the one carrying two green lamps in its bottom
      corners, which is what makes it the out-of-band port rather than the console. The USB 2.0
      Type-A socket is PORTRAIT (5.2 wide by 11.9 tall) so std/usb-a is rotated 90.
  panel-metal:
    note: >-
      THE BRIGHT SHELL AROUND EACH GANGED BLOCK IS PANEL, NOT PART, AND ITS COLOUR WAS SAMPLED
      RATHER THAN ASSUMED - the median of the shell pixels in fig-0016 is #cecece, a neutral light
      grey, and #c8cacc is carried here. std/ parts draw the opening and stop, so every ganged
      block is drawn as a light decor rectangle with the apertures placed on it: twenty QSFP28
      column shells 19.8 x 26.6 (ten in the upper band at y 12.68, ten in the lower at y 43.82),
      three QSFP-DD pair shells 41.5 x 10.9 per row plus one 19.8 wide single for port 12, a 15.9
      x 26.6 shell behind the stacked SFP+ pair and a 16.3 x 25.0 shell behind the stacked RJ45
      pair. Without them a dark cage on a dark faceplate is simply invisible. The same reasoning
      puts a white printed block under the four system lamp legends, which fig-0015 prints
      dark-on-white at x 10.54-14.37, y 27.92-39.09.
  bands:
    confidence: drawing
    note: >-
      drawing - the two coloured bands are real paint and both were sampled: the QSFP28 band is
      #4a692e green and runs x 44.7-274.0, y 8.2-12.8, ABOVE the upper block only; the QSFP-DD
      band is #d68998 pink and runs x 282.4-429.7, y 23.6-29.6, above the upper fabric row. The
      HIG says what they mean in as many words - the service ports (green in its figure) are
      packet-based Ethernet ports, and the fabric ports (red) connect only to the fabric ports
      of the S9705-48D fabric switch - so the
      colour is a legend and is drawn as one.
  band-legends:
    note: >-
      A RULE THAT STOPS PARTWAY WAS SPECIFICALLY LOOKED FOR HERE, AND IT DOES STOP - twice, and
      both times the metal really stops it. (1) The green band covers the UPPER QSFP28 block and
      there is no band under the lower block: ports 20-39 carry the same ▲ numeral lamp lamp
      numeral ▼ legend, printed white directly on the black metal at y 73.6. The legend rule is
      carried to the end; the PAINT is not, and that is the vendor's doing. (2) The pink band's
      per-column legend ends after port 12 with an up-arrow, a numeral and one lamp, because there
      is no thirteenth partner port. Both readings were taken against a control in the same image:
      the '20', '21' ... '39' numerals under the lower block are the same white ink at the same
      size and the same distance from the lens as the area under it that carries nothing, and they
      resolve cleanly at 7x, so the blank metal below them is a reading and not a resolution
      limit. Within a column the offsets from the column centre are ▲ -7.8, upper numeral -5.2,
      lamp -1.93, lamp +1.93, lower numeral +5.2, ▼ +8.0 mm, measured once on columns 1 and 2 of
      the green band and reused; the QSFP-DD band reads -7.7 / -5.0 / ±1.88 / +5.0 / +8.4 on its
      tighter 19 mm pitch. The arrows are drawn as `path:` marks because U+25B2 and U+25BC
      rasterise as empty boxes.
  port-leds:
    confidence: drawing
    note: >-
      drawing - the arrangement is ONE lamp per port, in the band that labels its block, and it
      was counted rather than assumed. Every column of every block prints two round lamps between
      its two numerals, so ten columns x two lamps x two QSFP28 blocks is forty lamps for forty
      ports, and six columns x two plus port 12's single lamp is thirteen for thirteen. Lamp
      diameter reads about 1.7 mm and common/led-dot@1 at 2.0 is the closest part that fits the
      3.86 mm lamp pitch. WHICH lamp of a pair serves which port is NOT stated anywhere and is
      recorded in the port-led-semantics gap; the left-lamp-is-the- upper-port reading used here
      is taken from the printed order '▲n lamp lamp m▼' alone.
  mgmt-block:
    confidence: drawing
    note: >-
      drawing - the left column of the faceplate, top to bottom: the '0 ▲ ▼ 1' legend at y 10.2,
      the stacked 10G SFP+ management pair (shell x 22.4-38.3, ports at y 19.42 and 32.56), the
      white four-legend lamp block with its lamps in a column at x 15.88, the reset pinhole, the
      'IOIOI' legend over the micro-USB console socket, the portrait USB 2.0 Type-A socket with
      its trident symbol under it, and the stacked RJ45 pair (console above, out-of-band below)
      with the 'IOIOI ▲ ▼ network' legend under it at y 75.4. Every one of those is a Figure 4
      callout by name. The RJ45 pair's row pitch is 12.46 mm, which is BELOW std/rj45's 14 mm
      bezel, so std/rj45-ganged (12.7 x 11.0) is the part - the same finding this library has made
      on every other stacked UfiSpace jack. RESET IS NOT LETTERED ON THE METAL: at 20x the panel
      carries a white ring around a dark pinhole and no word, so none is printed here; 'Reset' is
      Figure 4's callout, not silkscreen. common/reset-button@1 is 4.0 mm against that measured
      2.4 mm ring - the component's own size is `estimated` and this figure is the better
      measurement - so the placed part laps about 0.9 mm onto the left edge of the printed
      lamp-label block. That is a known cosmetic compromise, recorded rather than fixed by moving
      a measured number.
  system-leds:
    note: >-
      HIG section 10 and Figure 27. The Front Panel LED table names FOUR lamps - SYS, FAN, PS0,
      PS1 - in that order, with a full state vocabulary for each, and Figure 27 draws them as a
      white legend block with the lamps in a column to its RIGHT, which is exactly what fig-0015
      shows on the panel at 20x. There is no SYNC row and no ID beacon row in this table, unlike
      the S9600-56DX's six-lamp block: this device has no timing block at all and its beacon is
      the numeric display, not a lamp. Legend row centres y 29.23, 31.86, 34.49 and 37.13 on a
      2.63 mm pitch, one gap measured once and reused for all four.
  beacon:
    confidence: drawing
    note: >-
      drawing plus a named callout, which is the part the S9600-72XC could not get. A two-digit
      seven-segment display sits at the top right, bezel x 412.3-427.9 and y 5.6-14.5 measured off
      fig-0016, and HIG Figure 4's callout list names it in as many words: 'Beacon LED'. The
      datasheet's LED list also carries a 'Beacon' row. So it is modelled as
      ufispace/seg7-status-2@1, the 17.2 x 9.5 contract measured on the S9600-72XC - 1.6 mm wider
      and 0.6 mm taller than the bezel measured here, which is the closest of the three UfiSpace
      seven-segment parts (seg7-beacon-s9611 and seg7-status-2-sm are both 12.8 wide, a fifth too
      small). What the digits actually SHOW is still unstated and is recorded in the
      beacon-semantics gap.
  colour:
    note: >-
      photo/drawing - the chassis is a very dark neutral grey. Sampled from fig-0016 the bare
      metal between the port blocks is #2b2b28 and the left field #2a2a2a; #33332e is carried, a
      touch lighter than the sample so the black cage apertures still read against it, and the
      vendor's angle render agrees it is grey rather than true black. THE GANGED-CAGE SHELLS WERE
      SAMPLED SEPARATELY RATHER THAN ASSUMED SILVER: the median of the shell pixels is #cecece, a
      neutral light grey with no blue in it, and #c8cacc is used. The bright shell behind the
      portrait USB socket is drawn as its own decor pill, because std/usb-a draws the opening and
      its blue tongue and nothing around it, and a dark connector on a dark faceplate is
      invisible.
  vents:
    confidence: drawing
    note: >-
      drawing - hexagonal perforation, boundaries read off fig-0016 at 3.13 / 3.04 px/mm and drawn
      as six rectangular patches: a band across the top (y 0.8-7.6) and another across the bottom
      (y 77.0-86.8), a field down the left of the panel (x 1.0-20.0) that the reset, micro-USB,
      USB and lamp block are punched into, and a large field to the right of the QSFP28 block that
      wraps the fabric ports above (y 7.6-23.2) and below (y 55.2-77.0) with a 6 mm strip between
      them. The patches are rectangles where the real perforation is hexagonal and follows the
      port cut-outs; that simplification is the figure's resolution, not a finding.
  rear-layout:
    confidence: drawing
    note: >-
      drawing - HIG Figure 7's rear elevation at 3.0550 px/mm across and 3.0445 down, which is the
      most nearly orthographic figure in this intake. Four fan faces on an 84.44 mm pitch, read
      off the four green status lamps (figure x 73.6, 331.5, 589.5 and 847.6 px - three intervals
      of 258.0, 258.0 and 258.1 px, a flat feature painted on the face rather than the red release
      tabs, which project and shrink across the frame) and anchored through
      ufispace/fan-803816-hc@1's own lamp position (18.5, 21.0 within its 81 x 81.5 face) to put
      the first bay at x 0.20, y 2.75. Fan 0 is flush with the chassis's left edge - the leftmost
      red release tab starts at the body edge itself - and the 3.44 mm between an 81 mm module and
      the next bay is the chassis web. Then the grounding column (a silver two-hole plate at x
      348.1-359.7, y 6.4-39.3, an earth symbol at 362.5-368.7, a captive screw knob 7.5 mm across
      centred at 358.8, 45.4, and the FAN 0|1|2|3 position key at y 56.7 and 62.6) and the two PSU
      bays at x 372.7, 50.5 wide and 40.2 tall, PSU0 over PSU1 with their tops at y 4.4 and 46.5.
      The bay legends PSU0 and PSU1 are chassis silkscreen at x 430: which bay is 0 is a position
      fact and cannot live on an interchangeable FRU.
  psu-build:
    note: >-
      BOTH THE GUIDE AND THE PHOTOGRAPH SHOW THE AC BUILD HERE, which is the opposite of the
      S9600-56DX's situation and is stated so nobody reads the two devices as contradicting each
      other. HIG Figure 7's rear elevation and the vendor's own rear product render
      (photos/s9700-53dx-3-view) both draw the same face: a square-grid intake vent on the left
      under the status lamp, the C20 appliance inlet with its cord clip to its right and a red
      latch at the top right. The HIG's AC section names the cable as 'IEC60320 C19', which is the
      plug a C20 inlet takes. The datasheet orders both builds - PSU-202-AESR and PSU-202-DESR,
      2000 W each, exhaust airflow - so the DC build is modelled as a configuration using
      ufispace/psu-202-dc@1, whose artwork was measured on the S9600-56DX's DC photograph and NOT
      on any image of this device; no held image of this device shows a DC supply, and that is
      recorded in the dc-build-unphotographed gap rather than left to look sourced.
  fru-reuse:
    note: >-
      The fan is FAN-803816-HC, named in this datasheet's Available to Order block, and
      ufispace/fan-803816-hc@1 already carries exactly the dimensions this HIG's Component
      Physical Information table gives - 'Fan (W x D x H) 3.19" x 4.45" x 3.21" (81 x 113 x 81.5
      mm)', so an 81 x 81.5 face - and the same 25 mm handle projection this guide publishes. It
      is used unchanged. That component was built from the S9700-23D's guide by another author;
      this device corroborates its size table and its ordering line independently rather than
      restating them from it. The PSUs are PSU-202-AESR/DESR and ufispace/psu-202-ac@1 / -dc@1 are
      50.5 x 40.2 against this HIG's 'PSU (W x D x H) 1.99 x 14.17" x 1.58" (50.5 x 360 x 40 mm)'
      - the 0.2 mm on the face height is the 56DX's own measurement against this table's rounded
      40, and is not worth a second contract.
  views:
    note: >-
      Six views, all six drawn. TOP: y = 0 is the REAR, per the house convention and HIG Figure
      4's own footprint drawing, which prints the fan handles at the top. Six long stadium
      recesses run across the lid at y centres 138.4, 243.2, 348.0, 453.4, 558.2 and 662.4 mm on a
      104.8 mm pitch, x 18.7 to 418.7, 18 mm deep - MEASURED, not proportioned, because that
      drawing's aspect is 0.28% from the datasheet's and passes the figure gate outright. BOTTOM
      mirrors left-right and carries the compliance sticker at an ESTIMATED position - no held
      figure shows the underside. LEFT (x = 0 is the REAR) and RIGHT (x = 0 is the FRONT): each
      side carries the five rail attachment pins the HIG's rack mounting section counts - 'The
      chassis has 5 attachment pins on each side, for a total of 10 pins' - plus the M4 screw that
      locks the inner rail, 'two M4 screws (one on each chassis side)'. The vendor's angle render
      shows those pins as silver mushroom studs along the side and confirms the count and the
      kind; every POSITION on both side faces is ESTIMATED, because no held figure dimensions
      them. Both side faces carry only symmetric content, so the depth-axis conventions are stated
      here rather than exposed by any asymmetric feature.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - Specifications, Environmental, Performance, Regulatory Compliance and
      Accessories sections, transcribed into sections. Compliance strings kept verbatim,
      semicolon-separated, untidied; note that the NEBS claim is split across two places in the
      datasheet and both wordings are carried.
  power:
    confidence: datasheet
    note: >-
      datasheet 'Typical power: 563 Watts (no transceiver)' - the vendor's own scope, so
      power-envelope is bare. The HIG states the maximum twice, once per build: 'The maximum
      system power consumption is 1434 watts' in the DC section and 1422 in the AC section, and
      unlike the typical figure these ARE qualified, in a note printed beside each - 'Temperature:
      45C, Optics: full populated, Traffic: 100% load'. 1434 is carried as power-max-w because max
      means the highest of the two builds, and the 12 W difference is recorded here rather than as
      a conflict: they are two builds, not two readings. Note that power-envelope therefore
      describes the TYPICAL figure's scope and not the maximum's, which is fully-configured and
      says so in this sentence. These are the vendor's figures as the vendor states them and are
      NOT reconciled against the module set: the fans publish no draw at all, so any total built
      from the modelled modules is a floor. Provisioning reserve 2000 W per circuit (HIG). PSU
      rating 2000 W per supply from the ordering lines; on a single 110 VAC feed the HIG derates
      each supply to 1000 W and warns that hot-swap is then no longer supported.
  vent-islands:
    note: >-
      derived - a vent field is a perforation and the drawing said so, but the marks printed
      inside one were floating on air (L64). The vendor interrupts the perforation where it
      prints, so each of those marks now has a solid patch under it in the chassis colour, drawn
      over the vent the way ufispace/s9600-72xc paints its port bands over one. The patch is the
      printing's own footprint plus 0.4 mm, which is what the S9610-36D's front render measures:
      its slots stop 0.4 mm outside each lamp cluster and resume 0.4 mm past it. Where a vent is
      simply measured wider than the metal it reaches, this states the metal that the printing
      proves is there without re-measuring the field.
  lifecycle:
    note: >-
      searched 2026-08-28: 'UfiSpace S9700-53DX end of life end of sale announcement' - no
      announcement found; the vendor's telco core-edge product page, the Open Compute Project's
      S9700-53DX specification listing and the hardware installation guide are all live.
      none-announced is a real finding, not an absence.

attrs:
  performance:
    switching-capacity: 4.8 Tbps
    packet-buffer: 8 GB
  power:
    power-typical-w: '563'
    power-max-w: '1434'
    power-envelope: bare
    input-ac: 200 to 240 V, 12.5 A
    input-dc: -40 to -72 V, 60 A
    psu-redundancy: 1+1 hot-swappable, active-active
  thermal:
    fan-redundancy: 3+1 hot-swappable
    airflow: front-to-back (exhaust fans and exhaust PSUs)
  environmental:
    operating-temp: 0 to 45 C
    operating-humidity: 5 to 85% RH non-condensing
    storage-temp: -40 to 70 C
    storage-humidity: 5 to 93% RH non-condensing
  platform:
    asic: Broadcom Jericho2 BCM88690
    tcam: Broadcom OP2 BCM16K external TCAM for additional table sizes
    cpu: Intel Broadwell-DE 8-core @ 2.0 GHz
    memory: 64 GB DDR4
    storage: 128 GB SSD
    bmc: Aspeed AST2400
    oem-alias: >-
      DriveNets NCP-40C (Network Cloud Packet forwarder, 40x100 NIF + 13x400 FIF). NOT A
      UFISPACE CLAIM - no UfiSpace document mentions DriveNets. The mapping is internal analysis matching DriveNets' NCP-40C (J2 4T) to this chassis on
      published silicon and port configuration. DriveNets' product photograph matches this chassis rather
      than the Edgecore COR550, which publishes the identical 40x100 + 13x400 J2
      configuration. Recorded so a search for either name finds this box; no DriveNets figure
      or artwork is transcribed anywhere in this file.
  features:
    deployment: >-
      functions standalone or as a node in a cluster from 4 Tbps up to 192 Tbps;
      interoperable with the rest of the S9700 series using an S9705-48D or S9725-64E as
      the fabric (datasheet Key Features). Keyed `deployment` rather than `role`, which
      is reserved for the structural role each GROUP carries
    fabric-ports: >-
      the thirteen 400G QSFP-DD ports are FABRIC ports and are for connecting to the fabric
      ports of an S9705-48D fabric switch only, not for service traffic (HIG Port Overview)
    breakout: >-
      service ports 0-19 can individually break out into 4x25GE or 4x10GE; if any of ports
      0-19 is in breakout mode the corresponding lower-column port is disabled (HIG Port
      Overview). Ports 20-39 are 40GE/100GE only
    routing: full Segment Routing over IPv6 (SRv6) support (datasheet Key Features)
    optics-qsfp28: 100GE QSFP28 SR4, LR4, ER4 and ZR4, up to 80 km (datasheet Compatible Transceiver Types)
    optics-sfp-plus: >-
      NOT STATED. The datasheet's Compatible Transceiver Types block lists 100GE QSFP28
      SR4/LR4/ER4/ZR4 only and its Compatible Fabric Cable Types block lists 400GE QSFP-DD
      DAC/AEC/AOC; neither names anything for the two 10G SFP+ management ports, and the
      HIG's Connecting the Transceiver section names no part either. The cage takes what an
      SFP+ cage takes; which optics UfiSpace qualifies in it is unrecorded here rather than
      inferred - see the sfp-plus-optics gap
    optics-qsfp-dd: >-
      400GE QSFP-DD DAC, AEC and AOC up to 100 m - the fabric ports take cables, and the
      datasheet's Compatible Fabric Cable Types list carries no optical transceiver
  management:
    console: RJ45 RS-232 plus a micro-USB serial console, both lettered IOIOI
    oob: 1x RJ45 100/1000M out-of-band
    inband-mgmt: 2x 10G SFP+ management ports numbered 0 and 1
    service-port: 1x USB 2.0 Type-A
  compliance:
    safety: UL 62368-1; IEC 62368-1; BSMI; NOM
    emc: >-
      FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 55024;
      EN 55035; EN 62479; EN 50663; EN 300 386; EN 301 489; EN 303 413; BSMI;
      VCCI CISPR 32, Class A; AS/NZS CISPR 32, Class A; Anatel; NEBS GR-1089
    environment: RoHS; WEEE; NEBS GR-63
    nebs: >-
      the Regulatory Compliance table lists NEBS GR-1089 under EMC and NEBS GR-63 under
      Environment; separately the datasheet's Key Benefits line reads 'Ideal for Core,
      Edge, and Central Office deployments (NEBS Level 3)'. Both wordings are carried
      because they are different claims and neither document reconciles them
  lifecycle:
    eol: none-announced
chassis:
  width: 436
  height: 87.7
  depth: 762
  ru: 2
  color: '#33332e'
  weight-kg: 21.14
# What no rule can find, because the manifest looks complete.
  airflow: front-to-back

gaps:
- what: port-led-semantics
  scope: [qsfp28, qsfpdd-400g, port-leds]
  reason: vendor-silent
  note: >-
    HIG section 10 tables the four front-panel lamps (SYS, FAN, PS0, PS1), the PSU FRU lamp,
    the Fan FRU lamp and the management-port lamps, and gives no table at all for the port
    lamps. Every QSFP28 and QSFP-DD column prints two round lamps between its two port
    numerals and nothing states what they mean, nor which lamp of a pair serves which of the
    two ports. The pairing written here is derived from the printed order alone - the legend
    reads '▲n lamp lamp m▼', so the left lamp is taken to serve the upper port n - and port
    12's single lamp is placed where a pair's left lamp sits for the same reason. That is the
    one thing in this device's LED model that is not read off a source. Every port lamp keeps
    the component default of off/on rather than an invented link/activity vocabulary.
  wanted: >-
    a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a live unit with
    known ports up, down and passing traffic
- what: beacon-semantics
  scope: [ufispace/seg7-status-2@1, status-display]
  reason: vendor-silent
  note: >-
    HIG Figure 4 names the two-digit seven-segment display 'Beacon LED' and the datasheet's
    LED list carries a 'Beacon' row, so unlike the S9600-72XC's identical-looking display
    this one at least has a name. What it DISPLAYS is still unstated: section 10's Verifying
    System Operation covers the four panel lamps and the two FRU lamps and never mentions it,
    so whether the digits show a chassis or cluster ID, a POST code or a fault code is not
    established. The component therefore carries no state vocabulary and its skin draws the
    all-segments '88' the vendor's own artwork draws.
  wanted: a NOS or BMC reference that documents the front-panel beacon display
- what: seg7-size-mismatch
  scope: [ufispace/seg7-status-2@1, status-display]
  reason: needs-drawing
  note: >-
    The bezel measured on this faceplate is 15.6 x 8.9 mm; ufispace/seg7-status-2@1 is
    17.2 x 9.5, measured on the S9600-72XC, and is the closest of the three UfiSpace
    seven-segment contracts (the other two are 12.8 wide, a fifth too small). The part is
    used as it stands rather than forking a fourth contract off a 1.6 mm difference read from
    a 3.13 px/mm figure, but the placed display is about a millimetre larger than the metal.
  wanted: an orthographic vendor front elevation of the S9700-53DX, or a square-on photograph
- what: reset-button-size
  scope: [common/reset-button@1, reset]
  reason: needs-drawing
  note: >-
    The reset feature on the panel is a white printed ring about 2.4 mm across around a dark
    pinhole about 1 mm across, measured at 20x on HIG Figure 8. common/reset-button@1 is
    4.0 x 4.0 with `size: estimated` in its own provenance, so the library part is the softer
    number - but it is the part a person can name and it is used. The consequence is visible:
    the placed button laps roughly 0.9 mm onto the left edge of the printed system-lamp label
    block. Fixing it by moving the label block would move a measured number to suit an
    estimated one, so it is filed instead.
  wanted: a UfiSpace mechanical drawing of the front panel, or a resized reset component
- what: dc-build-unphotographed
  scope: [dc, ufispace/psu-202-dc@1]
  reason: needs-photo
  note: >-
    The datasheet orders PSU-202-DESR and the HIG has a full DC power section with its own
    maximum (1434 W), so the DC build certainly exists - but every image held for THIS device
    shows the AC supply: HIG Figure 7's rear elevation, HIG Figures 5 and 6 (which are the
    AC unit's own drawings), and the vendor's rear product render. The DC configuration here
    seats ufispace/psu-202-dc@1, whose face was measured on the S9600-56DX's rear
    photograph, and that is an inference from a sibling chassis rather than a reading of this
    one. The two routers order the same PSU part numbers, which is why it is reasonable; it
    is recorded because it is still not sourced here.
  wanted: a rear photograph or elevation of an S9700-53DX with DC supplies fitted
- what: rear-figure-provenance
  scope: [rear]
  reason: sources-disagree
  note: >-
    HIG Figure 7 carries no model name anywhere in it, and the S9700-23D's guide is
    illustrated with a rear elevation of the same fan and PSU arrangement. This family is
    exactly where a vendor reuses artwork, so the rear here cannot be certified as a picture
    of THIS model the way the front can - the front figures letter 'S9700-53DX' and draw this
    model's own port inventory. What supports the rear is not the figure: the FRU part
    numbers (FAN-803816-HC, PSU-202-AESR/DESR) and their dimensions come from this device's
    own datasheet and its own Component Physical Information table, the 4-fan and 2-PSU
    counts from Figure 4's callouts, and the vendor's rear product render of this SKU shows
    the same face. The geometry is the figure's; the inventory is this document's.
  wanted: a rear elevation that letters the model, or a dimensioned rear mechanical drawing
- what: side-and-bottom-positions
  scope: [left, right, bottom]
  reason: needs-drawing
  note: >-
    The HIG counts the rail hardware exactly - five attachment pins per side, ten in total,
    plus one M4 inner-rail screw per side - and the vendor's angle render shows those pins as
    silver studs, so the COUNT and the KIND are sourced. No held figure dimensions them
    along the depth, and no held figure shows the underside at all, so every position on the
    two side faces and the compliance sticker on the bottom is ESTIMATED. They are drawn
    rather than left blank so the faces carry honest content, and this entry is what says
    which part of that content is a measurement.
  wanted: a UfiSpace mechanical drawing of the chassis sides and underside
- what: sfp-plus-optics
  scope: [sfp-plus, mgmt-sfp-0, mgmt-sfp-1]
  reason: vendor-silent
  note: >-
    Neither held document names an optic for the two 10G SFP+ management ports. Searched the
    datasheet for 'SFP+' - three hits, all of them the port count in the physical list, the
    LED list and the Key Features - and its Compatible Transceiver Types and Compatible
    Fabric Cable Types blocks cover QSFP28 and QSFP-DD and stop; searched the HIG for
    'transceiver' - its Connecting the Transceiver section is a procedure with no part
    numbers. So the group carries a sentence recording the silence rather than a list
    borrowed from a sibling datasheet.
  wanted: a UfiSpace qualified-optics list for the S9700 series
- what: chassis-sku
  scope: [ac, dc]
  reason: vendor-silent
  note: >-
    No orderable chassis part number appears in any held document. The datasheet's Available
    to Order block lists the PSU and fan SKUs only, and the HIG names the product S9700-53DX
    in its title, its overview and its dimensions table without printing a number. The
    configurations here therefore carry no `part-numbers`. The S9510-28DC's history is the
    warning: 'no SKU exists' was written there on exactly this evidence and was false, so
    this says only that we hold no document naming one.
  wanted: a UfiSpace ordering guide or price list for the S9700 core-edge line
- what: fan-power
  scope: [ufispace/fan-803816-hc@1]
  reason: vendor-silent
  note: >-
    Neither this datasheet nor this HIG publishes a per-FRU wattage for FAN-803816-HC. The
    datasheet names it only as an ordering line and the HIG's power sections give the SYSTEM
    maxima (1434 W DC, 1422 W AC, both at 45 C with optics fully populated and 100% traffic)
    and the 2000 W per-circuit provisioning reserve - all three are the box, not the module.
    Searched this HIG for 'watt', 'Power' and 'consumption': every hit belongs to the system
    figures or to the PSU-202 ordering lines. So the module total for this chassis is a
    floor, and L27/L29 standing on the fan is the record of that.
  wanted: a UfiSpace FRU datasheet for FAN-803816-HC
groups:
  sfp-plus:
    term: Port
    role: management
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      the stacked pair at the top of the management column, '2 x 10G SFP+ management ports'
      in the datasheet's physical list and '2 x SFP+' in HIG Figure 4's callouts. The panel
      numbers them 0 and 1 with an up arrow and a down arrow, so index-origin is 0
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      the forty 40/100G service ports, '40 x 40/100G QSFP28 service ports' in the datasheet
      and green-labelled in the HIG's port figure. Ports 0-19 break out to 4x25GE or 4x10GE
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 400g}
    description: >-
      the thirteen 400G FABRIC ports, red-labelled in the HIG's port figure and reserved for
      connecting to an S9705-48D fabric switch. They carry their own numbering from 0, which
      is why their ids are fab-N and not port-N
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster down the left of the faceplate - the RS-232 console RJ45, the
      micro-USB serial console, the USB 2.0 Type-A service port, the out-of-band RJ45 and the
      recessed reset. Four media, one job, and Figure 4 calls them out as one group
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      the four chassis indicators HIG section 10's Front Panel LED table names - SYS, FAN,
      PS0 and PS1, in that order. There is no SYNC row and no ID row: this device has no
      timing block and its beacon is the numeric display
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      every indicator that belongs to a particular port - the forty QSFP28 lamps in the green
      and white legend bands, the thirteen fabric lamps in the pink band, and the two lamps in
      the out-of-band jack's own aperture
  display:
    term: Display
    role: indicator
    index-origin: 1
    description: the two-digit seven-segment beacon HIG Figure 4 calls out as 'Beacon LED'
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 hot-swappable, active-active'
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '3+1'
      redundancy-note: '3+1 - 3+1 hot-swappable (attrs fan-redundancy)'
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
