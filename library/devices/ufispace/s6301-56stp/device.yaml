gaps:
- what: rj45-port-lamps-not-drawn
  scope: [ge-poe]
  reason: needs-drawing
  note: >-
    every RJ45 jack carries one integrated corner lamp (mode-switched LNK/SPD
    or PoE per the HIG table); std/rj45-ganged draws the bare opening and the
    lamp sits inside the aperture, so 48 lamps exist on the hardware and none
    in the drawing - the MX150 treatment, recorded so the absence is a decision
    rather than an oversight.
  wanted: an rj45-ganged variant (or overlay mechanism) that can draw a corner
    lamp inside the aperture without colliding with the placement.
- what: fan-position-legends
  scope: [fans]
  reason: needs-hardware
  note: >-
    'FAN ◄0' / 'FAN ◄1' appear at the top of each fan module's right strip in
    both the HIG rear figure and the photograph. If they are chassis printing
    they are hidden behind the modules; if module printing, the shared
    fan-402825 component cannot carry a per-position digit. A photo of the bay
    with the module out would settle which metal carries the ink.
  wanted: photograph of an empty S6301-56STP fan bay.
- what: second-grounding-location
  scope: [grounding]
  reason: needs-photo
  note: >-
    the HIG says 'there are two locations on the case in which the grounding
    lug may be fixed' and Figure 20 shows one under a yellow peel-off label on
    a side wall, but no held source shows its position measurably; only the
    rear location (Figure 21, photographed) is modelled.
  wanted: a photograph or drawing locating the second lug position.
- what: fru-power-unpublished
  scope: [fans]
  reason: vendor-silent
  note: >-
    ufispace/fan-402825 states no draw and its own contract records the search:
    eight UfiSpace datasheets name the part only as an ordering line, with no
    wattage anywhere near it; this device's HIG likewise dimensions and weighs
    the fan FRU and tables its LED without a power figure. L29's standing
    warning is the live count of how much of the chassis total is a floor.
  wanted: a photograph of the fan module's label, or a UfiSpace FRU datasheet.
- what: usb-version
  scope: [usb]
  reason: sources-disagree
  note: >-
    datasheet '1 x USB 1.0 Type-A port'; HIG cabling section 'Connect the USB
    2.0 A Type plug'; HIG accessory list ships a 'USB 3.0 cable'. Same port,
    three versions. The manifest carries the datasheet's line and says so.
  wanted: vendor confirmation of the actual USB controller version.
- what: sfp-port-led-semantics
  scope: [port-leds]
  reason: vendor-silent
  note: >-
    the HIG front-panel table defines only the MODE-level meaning ('LED on each
    network port indicates the link & speed status' / 'the PoE status') and no
    per-colour vocabulary for the SFP+ lamps; the sfp-led-pair placements carry
    that mode-switched reading and nothing finer. PoE mode is meaningless for
    the SFP+ ports and the vendor does not say what they show then.
  wanted: a NOS LED table or photographs of a live unit in known port states.
groups:
  ge-poe:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g}
    description: the 48 10M/100M/1G RJ45 access ports, PoE 802.3af/at up to
      30 W each; every jack carries one integrated mode-switched lamp inside
      its aperture, not drawn (see gaps)
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: the eight 1G/10G SFP+ uplinks, ports 48-55
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the SFP+ column lamp pairs in the centre band - left lamp
      upper port, right lamp lower port, mode-switched like the jack lamps
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the seven front-panel system lamps - SYS FAN PS0 PS1 over
      LNK/SPD POE ID
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the management cluster at the left-hand end - OOB RJ45, USB-A and
      RS-232 console in one bezel plate - plus the MODE and RESET buttons above
      the first jack block
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 active-active, hot-swappable'
  fans:
    term: Fan
    role: service
    index-origin: 0
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
