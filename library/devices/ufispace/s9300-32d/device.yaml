format: 1
kind: device
name: s9300-32d
version: 1.0.7
maturity: modelled
manufacturer: UfiSpace
model: S9300-32D
portfolio:
  line: 'Cloud & Data Centers'
  family: Data Center Switch
description: >-
  UfiSpace S9300-32D 400G data center spine switch - 1RU white box, 32x QSFP-DD
  400G in two rows plus 2x SFP+ 1/10G and a 2x SFP+ 10G / RJ45 out-of-band
  management block, Broadcom Trident4-X11 at 12.8 Tbps; six hot-swap fans (5+1)
  and dual 1300W PSUs (1+1) at the rear, orderable in AC or DC and in
  front-to-back or back-to-front airflow
profile: networking
provenance:
  sources:
    note: >-
      UfiSpace S9300-32D datasheet for dimensions, weight, port inventory, platform, power,
      environment and compliance; S9300-32D Hardware Installation Guide (s9300-32d-hig) for the
      faceplate figures, FRU dimensions, LED tables and grounding; three vendor product renders
      (photos/s9300-32d-1-angle, -2-front, -3-rear) for colour, counts and construction. Figure
      quality was gated before measuring: the HIG Figure 11 port overview measures 1316 x 131 px
      against the 436 x 43.8 mm face - aspect within 1% - and is the horizontal ruler for the
      front at 3.02 px/mm; the HIG Figure 10 fan-overview rear elevation (3.39 px/mm, aspect
      within 1.6%) is the ruler for the rear. The datasheet front/rear views are 6% off in aspect
      and the photographs are small (520 px) - both used for fractions and confirmation only.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 'Chassis (WxDxH) 1RU, 436 x 645 x 43.8 mm', weight 11.34 kg without FRU; the HIG
      component table repeats the same triple. 436 is the body between the ear planes, not a rack
      face - the HIG Space Clearance section says the S9300-32D 'width is 17.17 inches (43.6cm)
      and shipped with rack mount brackets suitable for 19 inch racks', so the mounting hardware
      is additional to 436 and is not drawn. Depth 645 is the chassis without FRUs; fan handles
      add 25 mm and PSU handles 38 mm beyond it (HIG Space Clearance).
  front-layout:
    confidence: drawing
    note: >-
      drawing - HIG Figure 11 at 3.02 px/mm (the Gate-1-passing figure), cross-checked against the
      front render: management cluster at the left edge (reset, five system lamps over a vent
      field, console RJ45 / USB 3.0 / OOB RJ45 in a vertical stack), then two stacked SFP+
      columns, then the 32 QSFP-DD in eight 2x2 groups. Positions read off the figure are good to
      ~0.5 mm and carried as drawing confidence; the RJ45/USB stack is composed from 17 mm library
      parts, slightly wider than the ~19 mm drawn bezel that frames all three.
  qsfp-layout:
    confidence: drawing
    note: >-
      drawing - the nine blue lane-LED strips per row sit on a measured 45.1 mm group pitch (strip
      centres 69.0 + 45.1k, k=0..8, from Figure 11; interior strip centres
      114.0/159.0/204.1/249.2/294.2/339.5/384.5 measured, end strips extrapolated on the same
      pitch because port digits contaminate their pixel runs). Between adjacent strips the two
      19.0 mm std/qsfp-dd cages sit with 0.5 mm margins (cage lefts 72.3 + 45.1k and 91.8 +
      45.1k). Rows: cage tops at y 8.75 and 26.05, from the strip blocks' vertical extents
      (7.4-20.1 and 24.7-37.4) centred on each cage row. The BOTTOM row is drawn rotate: 180 - the
      vent/heatsink dashes sit above the top row and below the bottom row in both the figure and
      the datasheet render, the belly-to-belly pattern. Numbering from Figure 11: top row even
      0..30, bottom row odd 1..31, left to right.
  port-numbers:
    confidence: drawing
    note: >-
      drawing-inferred - Figure 11 prints each port's number in blue ON the schematic module face,
      where a seated module would cover it; the datasheet render shows small printed marks in the
      inter-row web under each top cage and below each bottom cage, which is where they are drawn
      here (baselines y 23.6 and 39.5). Exact glyph position unverified against a close-up
      photograph.
  sfp-block:
    confidence: drawing
    note: >-
      drawing/photo - two stacked SFP+ columns at x 36.2 and 50.9 (photo fractions agree with
      Figure 11 within 1 mm), rows aligned with the QSFP rows (cage tops y 8.6 and 26.0). The LEFT
      column is the out-of-band pair (marked with the network symbol; HIG 'Connecting the OOB
      Management Cables' - two 10G SFP+ that reach the x86), the RIGHT column is the pair the
      vendor prints the orange MGMT band over and numbers 0/1 (HIG 'Connecting the Management
      Cables'; datasheet '2 x 1/10G SFP+ ports', port table rows 0~1). Stacked cages are NOT
      mirrored here: the keyway direction is not resolvable in any held image, and the sibling
      S9510-28DC models its stacked SFP rows unmirrored - re-check against hardware. Each column
      carries an up/down lamp pair above the top cage, per the render.
  mgmt-block:
    confidence: drawing
    note: >-
      drawing - reset pinhole at (9.1, 4.9 centre) with RESET legend; five system lamps (SYS, FAN,
      PSU0, PSU1, ID) beside a printed white legend block at x 2.9-6.2, y 12-26.3; vent field
      below; console RJ45 at the top of the stack (labelled IOIOI), USB 3.0 between, OOB RJ45 at
      the bottom (network symbol below, integrated green lamps per the render). LED semantics from
      the HIG Front Panel LED table, page 24, transcribed onto each lamp.
  rear-layout:
    confidence: drawing
    note: >-
      drawing - HIG Figure 10 rear elevation at 3.39 px/mm: grounding column at the left edge (two
      M4 lug holes and the earth symbol - HIG Figures 27/28 show the two-hole grounding lug seated
      here), six fan bays from x 12.5 spanning to 321 (handle centres measured at 23.6 + 51.9k,
      LED centres 61.1 + 51.3k; bays drawn at the shared component's 50.7 mm face on a 51.56 mm
      pitch so six faces fill the measured 311 mm span - see the fan-face-width gap), then PSU0 at
      x 321.0 and PSU1 at 381.4 (latch centres 322.3 and 382.5, a 60.2 mm pitch; the 9.9 mm
      chassis strips after each PSU carry the vertical PSU0/PSU1 legends). FAN and PSU legends
      printed as chassis silkscreen; the fan numbers 0-5 and PSU 0/1 are position facts and cannot
      live on the interchangeable FRU.
  views:
    note: >-
      Six views. TOP: y = 0 is the REAR, per the house convention and the HIG Figure 5 footprint
      drawing (which prints the rear at the top); the three shallow stadium recesses are
      proportioned off that drawing (its depth axis is not to scale - the footprint draws 436 x
      645 at aspect 1.03 against a true 0.676 - so their y extents are fractions, estimated).
      BOTTOM mirrors left-right; it carries the compliance sticker at an estimated position. LEFT
      (x = 0 is the REAR) and RIGHT (x = 0 is the FRONT): each side carries the five rail
      attachment pins the HIG rack-mounting section describes ('5 attachment pins on each side'),
      positions estimated - no drawing dimensions them; the left side near the rear carries the
      second designated grounding location (HIG Figure 27 shows the yellow REMOVE LABEL FOR SYSTEM
      GROUNDING tag there), hole positions estimated. Both side faces otherwise carry only
      symmetric content, so the depth-axis conventions are stated here rather than exposed by any
      asymmetric feature.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - Specifications, Performance, Environmental, Regulatory Compliance and Supported
      Accessories sections, transcribed into sections. Compliance strings kept verbatim,
      semicolon-separated, untidied.
  power:
    confidence: datasheet
    note: >-
      datasheet 'Typical power: 403 Watts (no transceiver)' - the vendor's own scope, so
      power-envelope is bare; the HIG's connecting-power section states 'The maximum system power
      consumption is 1246 watts' for both AC and DC versions, unqualified as to optics, carried as
      power-max-w. The two figures are two documents' claims and are not reconciled against each
      other or against the module set. PSU rating 1300 W per supply (ordering lines); at a 110 V
      AC input each supply delivers only 1000 W and hot-swap redundancy is not guaranteed (HIG
      note).
  part-numbers:
    note: >-
      The FRU part numbers (PSU-132-AISB1/AESR-3N/DISB1/DESR-3N, FAN-405637-HD/CD) are datasheet
      ordering lines and live on the FRU contracts and configurations. NO ORDERABLE CHASSIS SKU
      appears in any held document - the datasheet and HIG name the product only as S9300-32D. The
      S9510-28DC lesson applies: such SKUs exist at the owner even when no held PDF prints one, so
      this is recorded as a gap rather than as 'no SKU exists'. The back-to-front airflow variants
      (blue handles/latches: FAN-405637-CD, PSU-132-AESR-3N/DESR-3N) are orderable and not
      modelled as configurations - the PSU components carry only red-latch skins.
  lifecycle:
    note: >-
      searched 2026-08-28: 'UfiSpace S9300-32D end of life' - no announcement found; the product
      page and distributor listings are live. none-announced is a real finding, not an absence.

attrs:
  performance:
    switching-capacity: 12.8 Tbps
    packet-buffer: 132 MB
  power:
    power-typical-w: '403'
    power-max-w: '1246'
    power-envelope: bare
    input-ac: 200 to 240 V, 7.5 A per feed
    input-dc: -40 to -75 V, 40 A per feed
    psu-redundancy: 1+1 hot-swappable
  thermal:
    fan-redundancy: 5+1 hot-swappable
  environmental:
    operating-temp: 0 to 40 C
    operating-humidity: 5 to 95% RH non-condensing
    storage-temp: -40 to 70 C
    storage-humidity: 5 to 95% RH non-condensing
  platform:
    asic: Broadcom Trident4-X11 BCM56880
    cpu: Intel Skylake-D 8-core @ 1.9 GHz
    memory: 32 GB DDR4
    storage: 1x 128 GB SSD
    bmc: Aspeed AST2400
  features:
    programmability: NPL (open source) runtime programmability
    optics-qsfp-dd: >-
      400GE ZR/ER4/LR4/SR8/FR4/DR4/DR4+/PLR4 and 400G ZR/ZR+ support; 200GE QSFP56
      SR4/FR4; 100GE QSFP28 ZR4/ER4/LR4/SR4 (datasheet compatible transceiver list)
    optics-sfp-plus: 1/10G on the data pair, 10G on the OOB pair (datasheet port list)
    zr-capacity: >-
      up to 8x 400G ZR in ZR-only use, or up to 6 total if any OpenZR+ is mixed in;
      ZR/OpenZR+ modules must not sit in adjacent ports (HIG port overview)
  management:
    console: RJ45 RS-232, 115200 8N1 (labelled IOIOI)
    oob: 1x RJ45 100/1000M plus 2x SFP+ 10G, both reaching the x86 (HIG)
  compliance:
    safety: UL 62368-1; IEC 60950-1; IEC 62368-1; BSMI; MTCTE
    emc: >-
      FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300
      386; EN 55024; EN 55035; BSMI; VCCI CISPR 32, Class A; AS/NZS CISPR 32, Class A;
      MTCTE
    environment: RoHS; WEEE
  lifecycle:
    eol: none-announced
chassis:
  width: 436
  height: 43.8
  depth: 645
  ru: 1
  weight-kg: 11.34
  airflow: front-to-back

gaps:
- what: port-led-semantics
  scope: [qsfpdd-400g, sfp-plus-oob, sfp-plus-mgmt, port-leds]
  reason: vendor-silent
  note: >-
    The HIG's section 10 tables the five system lamps, the PSU and Fan FRU lamps and
    the RJ45 management jack, and says nothing about the port lamps: not what the 2x4
    grids in the blue QSFP-DD strips mean, not which strip column serves which
    neighbouring cage (nine strips per row against sixteen same-row ports supports
    one-column-per-port with single-column end strips, but no document states it), and
    not what the SFP+ up/down lamp pairs signal. Every port lamp keeps the off/on
    component default; each strip's `for` lists the two cages it stands between,
    which is adjacency, not an asserted mapping.
  wanted: >-
    a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a live unit
    with ports in known states
- what: fan-face-width
  scope: [ufispace/fan-405637@1, fans]
  reason: sources-disagree
  note: >-
    The HIG component table gives the fan module 43.4 x 100 x 40 mm (W x D x H); every
    rear elevation and render shows six equal fan faces (grille plus tab/screw/LED
    rail, the rail travelling with the FRU per HIG Figure 21) filling 12.5-321 mm -
    a ~51.6 mm pitch with no visible chassis web, and the shared component (built from
    the S9110-32X's identical figures) measures the face at 50.7 mm. The likely
    resolution is that 43.4 measures the fan BODY behind the face, but that is an
    inference; the manifest carries the 50.7 face on a 51.56 mm bay pitch.
  wanted: a vendor mechanical drawing of FAN-405637, or a caliper on the FRU
- what: ac-inlet-standard
  scope: [ufispace/psu-132-ac@1]
  reason: needs-photo
  note: >-
    The HIG specifies the AC cord as IEC60320 C15 (250 VAC 15 A), and a C15 cord mates
    a C16 appliance inlet - the notched high-temperature variant of the C14 the model
    composes (std/c14-inlet, the closest standard part in the library; no held image
    resolves the notch).
  wanted: a close-up photograph or drawing of the PSU-132 AC inlet
- what: chassis-sku
  scope: [configurations]
  reason: vendor-silent
  note: >-
    No held document prints an orderable chassis part number - the datasheet and HIG
    name only S9300-32D, and the FRU ordering lines name only the PSUs and fans. Per
    the S9510-28DC precedent (whose -BN0B/-BR1B SKUs surfaced from the owner, not from
    any PDF), orderable SKUs for the AC/DC and airflow variants exist somewhere; the
    configurations therefore carry no part-numbers rather than invented ones.
  wanted: a UfiSpace ordering guide or a quote naming the chassis SKUs
groups:
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster at the left edge of the face - the RS-232 console RJ45,
      the USB 3.0 service port, the out-of-band RJ45 and the recessed reset button.
      Same cluster, and the same word for it, as the library's other white boxes
  sfp-plus-oob:
    term: Port
    role: management
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      the left stacked SFP+ pair, marked with the network symbol - the second
      out-of-band path to the x86 (HIG Connecting the OOB Management Cables)
  sfp-plus-mgmt:
    term: Port
    role: management
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      the right stacked SFP+ pair under the orange MGMT band, the vendor's ports 0-1
      (1/10G per the datasheet port table)
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 400g}
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the chassis indicators - SYS, FAN, PSU0, PSU1 and the blue ID beacon
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      every indicator that belongs to particular ports - the eighteen blue QSFP-DD
      lane strips and the four SFP+ lamps
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 hot-swappable'
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '5+1'
      redundancy-note: '5+1 - 5+1 hot-swappable (attrs fan-redundancy)'
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
