configurations:
  ac:
    kind: orderable
    description: >-
      Dual 1300W AC PSUs (PSU-132-AISB1) with front-to-back airflow fans
      (FAN-405637-HD, red handles) - the build the vendor renders show. The
      back-to-front (blue, PSU-132-AESR-3N / FAN-405637-CD) variant is orderable and
      not modelled; no chassis SKU appears in any held document (see the chassis-sku
      gap)
    default: true
    component-attrs:
      psu-132-ac:
        model: PSU-132-AISB1
      fan-405637:
        model: FAN-405637-HD
  dc:
    kind: orderable
    description: >-
      Dual 1300W DC PSUs (PSU-132-DISB1, screw-terminal input, 60A internal fuse)
      with front-to-back airflow fans (FAN-405637-HD)
    bays:
      psu-0: ufispace/psu-132-dc@1
      psu-1: ufispace/psu-132-dc@1
    component-attrs:
      psu-132-dc:
        model: PSU-132-DISB1
      fan-405637:
        model: FAN-405637-HD
