  width: 440
  height: 43.5
  depth: 250
  ru: 1
  airflow: passive
  weight-kg: 4.32
gaps:
- what: port-led-semantics
  scope: [rj45-1g, sfp-1g, sfp-plus, port-leds]
  reason: vendor-silent
  note: >-
    HIG section 8 tables the four system lamps (SYNC, STAT, PSU, PWR) and the management
    jack, and gives no table at all for the port lamps. The Port Overview draws an up/down
    green pair in the web of every SFP and SFP+ column, so which port each lamp belongs to
    is clear from the arrows; what its colours and behaviours mean is not. Every port lamp
    therefore keeps common/led-dot's off/on default rather than an invented link/activity
    vocabulary. Nine rows of the system-lamp tables are annotated 'need NOS to activate
    this feature', so these may be NOS-defined rather than merely undocumented - a
    different fix, and the reason this is vendor-silent rather than nos-dependent.
  wanted: >-
    a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a live unit with
    ports in known states
- what: ac-feed-faceplate
  scope: [ac, dc]
  reason: needs-drawing
  note: >-
    Both held elevations and all three photographs show the DC build: two three-post screw
    terminal blocks under RTN / -36 - -75V legends. The datasheet offers a '120W AC PSU,
    fixed dual feed' and the HIG has an AC Version PSU Overview section, but its figure is
    a close-up of the inlet rather than a faceplate elevation, so where the two AC inlets
    sit on the 440 mm face and what replaces the terminal legends is not established. The
    ac configuration therefore changes no geometry and says so; it is not a skin of the
    dc one.
  wanted: an AC-version front elevation, or a photograph of the AC faceplate
- what: power-feed-not-addressable
  scope: [status-leds]
  reason: needs-hardware
  note: >-
    The two fixed supply feeds are real, distinguishable things - the HIG's PSU lamp table
    tells PSU1-good-PSU2-bad apart from PSU1-bad-PSU2-good - but they are not addressable
    in this manifest. A fixed supply seats nothing, so there is no bay; the six screw
    terminal posts are panel metal and are drawn as decor; and the library has no terminal
    block component to place over them. The PSU lamp therefore points at the chassis and
    the PSU 0 / PSU 1 legends are chassis silkscreen, which loses the per-feed link a
    consumer would want. Recorded rather than papered over with a group nothing joins.
  wanted: a terminal-block or power-inlet component that a fixed feed can be placed as
- what: system-lamp-size
  scope: [status-leds]
  reason: needs-hardware
  note: >-
    The four system lamps measure about 4.1 x 2.5 mm on a 2.47 mm centre pitch and the
    library's nearest part, common/led-rect@1, is 4.6 x 2.6 - taller than the pitch allows.
    Placed on their measured pitch the four parts overlap by 0.13 mm each, which L13 is
    right to reject, so the column is stretched to a 2.62 mm pitch and is 0.6 mm taller
    than the vendor prints it.
  wanted: a ~4.1 x 2.5 mm indicator component, or a caliper on the lamp window
- what: sfp-row-pitch
  scope: [sfp-1g, sfp-plus]
  reason: sources-disagree
  note: >-
    The stacked optical rows measure a 15.8 mm belly-to-belly pitch here - 14.05 to 29.85
    in the front photograph, 14.7 to 30.7 in the guide figure once its vertical error is
    removed - where std/sfp-ganged's own contract records 15.00 mm measured from a TE
    2007562-6 cage and the sibling S9500-22XST's photograph gave 15.0. Row pitch is not
    governed by any spec, so a vendor is free to differ and this may simply be a different
    cage; but two of this library's devices now carry two different numbers for the same
    nominal assembly and neither has been checked against hardware.
  wanted: a caliper on the cage, or a vendor mechanical drawing of the faceplate
- what: rear-fastener-positions
  scope: [furniture]
  reason: needs-drawing
  note: >-
    Five screws are visible along the lower edge of the rear photograph on roughly a
    100 mm pitch and are drawn there, but no figure dimensions them and the photograph
    resolves 0.27 mm per pixel only in x - its vertical is compressed by the drop shadow.
    The six grilles either side of them ARE measured; the fasteners are not.
  wanted: a rear mechanical drawing
- what: chassis-sku
  scope: [ac, dc]
  reason: vendor-silent
  note: >-
    No held document prints an orderable chassis part number - the datasheet and the HIG
    name only S9502-16SMT, and with a fixed supply and no fans there are no FRU ordering
    lines either, so this device has no part number of any kind in the intake. Per the
    S9510-28DC precedent in this library, whose SKUs surfaced from the owner and from no
    PDF, orderable SKUs for the AC and DC builds exist somewhere.
  wanted: a UfiSpace ordering guide or a quote naming the chassis SKUs
groups:
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the timing block - 1PPS and 10MHz on SMB and ToD on RJ45, each one connector
      carrying both directions. Three media, one job, and Figure 5 calls them out together
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster - the out-of-band RJ45, the USB 2.0 service port, the RS-232
      console and the recessed reset button
  rj45-1g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g}
    description: the four 100M/1G copper ports, vendor numbers 0-3 (HIG port table)
  sfp-1g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp, speed: 1g}
    description: the eight 100M/1G SFP ports, vendor numbers 4-11
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      the four 1/10G SFP+ ports, vendor numbers 12-15, on the printed blue ground the
      vendor uses to separate them from the 1G SFP block beside them
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the four chassis indicators - SYNC, STAT, PSU and PWR
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: every indicator that belongs to a particular port, ordered by that port
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
