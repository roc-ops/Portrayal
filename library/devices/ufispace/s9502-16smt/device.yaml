configurations:
  dc:
    kind: base
    power: dc
    description: >-
      Fixed 1+1 120 W DC supply, dual feed, -36 to -75 V on the two three-post screw
      terminal blocks the faceplate carries. This is the build every held elevation and
      photograph shows, and the one the drawing is measured from
    default: true
  ac:
    kind: orderable
    power: ac
    description: >-
      Fixed 1+1 120 W AC supply, dual feed, 100 to 240 V. NO GEOMETRY CHANGES HERE and
      that is deliberate: no held document shows the AC faceplate, so where its two inlets
      sit and what replaces the RTN legends is unknown. See the ac-feed-faceplate gap
