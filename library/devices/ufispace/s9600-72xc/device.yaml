gaps:
- what: port-led-semantics
  scope: [qsfp28, port-leds]
  reason: vendor-silent
  note: >-
    HIG section 10 tables the five front-panel lamps, the PSU FRU lamp and the fan FRU
    lamp in full, and says nothing at all about the port lamps. So the eight
    four-lamp strips beside the QSFP28 block are drawn because the figure draws them,
    at a pitch that matches ufispace/lane-led-quad's own to a hundredth, but what the
    four dots mean - four lanes, link and activity pairs, something else - is not
    stated, and neither is which of the two rows in each strip belongs to which port
    of the pair. The binding written here (upper row to the upper port) is the
    natural reading and is an inference. Every lamp keeps the component's off/on
    default rather than a vocabulary borrowed from a sibling guide.
  wanted: >-
    a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a live unit
    with ports in known states
- what: sfp28-port-led-semantics
  scope: [sfp28, port-leds]
  reason: vendor-silent
  note: >-
    THE 64 SFP28 LAMPS ARE THE TRIANGLES IN THE YELLOW BAND, and this gap used to say
    they did not exist. It said the hardware almost certainly had them, that HIG Figure
    8's pale strip UNDER each module resolved to about two pixels at 9.585 px/mm, and
    that rather than invent 128 positions no reading supported, none were drawn. The
    search was in the wrong place: the lamps are above the modules, not below them, and
    the drawing already carried them - as 32 silkscreen marks reading `▲▼`, one per port
    pair, printed on the band. An up triangle for the top-row port and a down triangle
    for the bottom, which is the idiom the sibling S8901-54XC models correctly with
    common/led-arrow.
    Measured off the same figure, from the dark ink inside the yellow band rather than
    from a green cast beside it: each triangle is 2.35 x 1.47 mm, the two of a pair sit
    2.79 mm apart, and the pairs repeat on a 14.37 mm pitch which is the port pitch.
    What remains unknown is only what they MEAN. HIG section 10 tables SYNC, SYS, FAN,
    PS0 and PS1 in full and says nothing about any port lamp, so all 64 keep
    common/led-arrow-sm's own off/on default rather than a link/activity or speed
    vocabulary borrowed from a sibling guide.
  wanted: >-
    a UfiSpace statement of what the S9600-72XC's port triangles indicate - link,
    activity, speed, or the pair together
- what: seg7-semantics
  scope: [ufispace/seg7-status-2@1, display]
  reason: vendor-silent
  note: >-
    The two-digit seven-segment display at x 411.8-429.0 is drawn in every figure and
    named in none. Figure 4's callout list ends at QSFP28 and section 10's Verifying
    System Operation covers the five panel lamps and the two FRU lamps only. Whether
    it shows a POST code, a chassis or stack ID, or a fault code is unstated, so the
    component carries no state vocabulary and its skin draws the all-segments '88'
    the vendor's own artwork draws.
  wanted: a NOS or BMC reference that documents the front-panel numeric display
- what: fan-face-width
  scope: [ufispace/fan-803816@1, fans]
  reason: sources-disagree
  note: >-
    The HIG's Component Physical Information table gives the fan module 81 x 113 x
    81.5 mm. This guide's own rear elevation puts the flat red airflow badge on an
    84.3 mm pitch across the four modules, so the repeating unit is 84.3 and the
    visible face is that less a small web. The manifest carries the 82.5 mm face of
    ufispace/fan-803816@1 on an 84.3 mm pitch. Two library components claim this part
    number at two widths (82.5 and 80) and the three UfiSpace guides that describe it
    state three (81 here, 81 on the S9600-30DX, 80 on the S9600-28DX). The likely
    resolution is that the table measures the fan BODY behind a wider flange, which
    is an inference and which no document states.
  wanted: a vendor mechanical drawing of FAN-803816-HI, or a caliper on the FRU
- what: rear-perspective
  scope: [rear, psus, fans]
  reason: needs-drawing
  note: >-
    The only held view of the rear is HIG Figure 4's three-quarter render. Its face
    is 341 px tall at the left edge and 357 at the right, so there is no single
    vertical scale, and the right-hand third is magnified: the PSU's own drawn width
    exceeds the 50.5 mm its component table states. The fan bank is safe because it
    sits in the middle of the frame and its flat badges repeat, and it independently
    reproduces the S9600-30DX's 84.4 mm pitch. Everything to the right of x 340 - the
    grounding plate, the vent column, the PSU stack's left edge - is anchored on the
    latch position and is good to a few millimetres, not to a tenth, and the 13.3 mm
    of blank metal the manifest leaves right of the PSU stack is what that anchoring
    gives rather than something the figure shows.
  wanted: a dimensioned rear elevation, or an orthographic rear photograph
- what: psu-latch-colour
  scope: [ufispace/psu-132-ac@1, ufispace/psu-132-dc@1, psus]
  reason: sources-disagree
  note: >-
    ufispace/psu-132-ac@1's provenance records a vendor convention that a supply built
    for front-to-back (intake) airflow carries a RED release latch and a back-to-front
    one BLUE, and that component draws the red-latched PSU-132-AISB1. This device's
    datasheet orders only the EXHAUST SKUs, PSU-132-AESR and PSU-132-DESR, and its own
    Figure 4 draws their latches RED. Either the colour convention does not hold across
    the range, or Figure 4 reuses the intake unit's art. The manifest seats the existing
    components and corrects the part numbers per configuration; it does not repaint the
    latch, because that would assert a colour on no better evidence than the figure it
    contradicts.
  wanted: a photograph of a PSU-132-AESR, or a UfiSpace ordering guide that states the code
- what: ac-inlet-standard
  scope: [ufispace/psu-132-ac@1, psus]
  reason: needs-hardware
  note: >-
    The HIG names the cord exactly - '250VAC 15A, IEC60320 C15' - and a C15 cord mates a
    C16 appliance inlet, not the C14 the modelled PSU composes. The library holds no
    std/c16; C14 and C16 differ by a notch below the earth pin and are the same 24 x 16
    body, so at faceplate scale the drawing is right and the part reference is not.
    Recorded on the S9300-32D component too.
  wanted: a std/c16-inlet component, or a close-up photograph of the PSU-132 inlet
- what: chassis-sku
  scope: [base, ac, dc]
  reason: vendor-silent
  note: >-
    No held document prints an orderable chassis part number - the datasheet and the HIG
    name the product only as S9600-72XC, and the Available to Order block names only the
    two PSUs and one fan. The datasheet's own footnote says 'OP2 available for premium
    SKU only' and its ASIC row lists the OP2 BCM16K as '(Premium)', so at least two
    SKUs exist and neither is named; the memory row's 'up to 64GB' implies another
    option with no part number either. The S9510-28DC precedent applies: that model's
    SKUs surfaced from the owner and from no held PDF, so the configurations carry no
    part numbers rather than invented ones.
  wanted: a UfiSpace ordering guide, or the premium-TCAM and memory option SKUs
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
    description: >-
      ports 0-63, the datasheet's '64 x 1/10/25G SFP28 ports' and the HIG port table's
      '0 ~ 63', in four ganged blocks of four columns. Numbering runs DOWN each column
      and the upper shell (0-31) is a separate run from the lower (32-63), so port 1
      sits under port 0 and port 32 under neither
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      ports 64-71, the datasheet's '8 x 40/100G QSFP28 ports', two columns of four at
      the right of the faceplate - the uplinks, and the only ports on this box the
      guide gives an 80 km reach for
  sfp-plus:
    term: Port
    role: management
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      the stacked SFP+ pair at the left of the faceplate, numbered 0 and 1 in their own
      run on the panel's own '0 ▲▼ 1' legend - the datasheet's '2 x 10G SFP+ management
      ports'
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the timing block across the top left - a GNSS antenna on SMA, 1PPS and 10MHz on
      SMB and ToD on RJ45. Three media, four jacks, one job: this is the block that
      makes an aggregation router a Class C boundary clock. Note there is no BITS jack
      here, unlike the S9600-30DX
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management block down the left of the faceplate - the out-of-band RJ45, the
      RS-232 console RJ45, the micro-USB serial console, the USB 3.0 service port and
      the recessed reset button
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      the five chassis indicators the faceplate legends SYNC, SYS, FAN, PS0 and PS1,
      each with a published state table in HIG section 10
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      the four-lamp light-pipe strips above and below the QSFP28 block, one row per
      port, and the 64 arrow lamps in the yellow bands - an up triangle for each
      top-row SFP28 and a down triangle for the bottom-row one it is paired with
  display:
    term: Display
    role: indicator
    index-origin: 1
    description: the two-digit seven-segment readout at the right of the faceplate
  psus:
    term: PSU
    role: service
    index-origin: 0
    description: the two rear supplies, which the front panel legends PS0 and PS1
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 hot-swappable'
  fans:
    term: Fan
    role: service
    index-origin: 0
    description: the four rear fans, which the rear panel numbers 0 to 3
    attrs:
      redundancy: '3+1'
      redundancy-note: '3+1 - 3+1 hot-swappable (attrs fan-redundancy)'
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
