configurations:
  base:
    kind: base
    description: >-
      The router as HIG Figure 4 draws it - four FAN-803816-HI exhaust fans and two
      1300 W AC supplies at the rear, and the seventy-two traffic ports empty. No
      orderable chassis part number appears in any held document; see the chassis-sku
      gap.
    default: true
  ac:
    kind: orderable
    description: >-
      Dual 1300 W AC supplies (PSU-132-AESR, exhaust airflow) with four FAN-803816-HI
      fans. The datasheet's AC input rating is 100 to 240 V at 12 A; the HIG's maximum
      system consumption is 685 W and it specifies a 250 VAC 15 A IEC60320 C15 cord,
      with a 16 A fast-acting fuse built into each supply.
    component-attrs:
      psu-132-ac:
        model: PSU-132-AESR
      fan-803816:
        model: FAN-803816-HI
  dc:
    kind: orderable
    description: >-
      Dual 1300 W -48 V DC supplies (PSU-132-DESR, exhaust airflow) with four
      FAN-803816-HI fans. The datasheet's DC input rating is -40 to -75 V at 40 A and
      each supply carries a 60 A fast-acting fuse; the DC build ships four #8 AWG input
      lugs in addition to the grounding lug kit (HIG accessory list). The HIG publishes
      no separate maximum for the DC build.
    bays:
      psu-0: ufispace/psu-132-dc@1
      psu-1: ufispace/psu-132-dc@1
    component-attrs:
      psu-132-dc:
        model: PSU-132-DESR
      fan-803816:
        model: FAN-803816-HI
datasheet:
  title: UfiSpace S9600-72XC 25G/100G Open Aggregation Router Datasheet
  url: https://www.ufispace.com/products/telco/aggregation/s9600-72xc-25g-100g-open-aggregation-router-tcam
references:
  - {title: UfiSpace S9600-72XC Hardware Installation Guide}
