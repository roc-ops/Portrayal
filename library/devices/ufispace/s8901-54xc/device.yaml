configurations:
  base:
    kind: base
    default: true
    description: DC chassis as it powers on - five fans and both 400W DC PSUs
      seated, every cage empty; front-to-back airflow (red-latch FRUs)
    airflow: front-to-back
    component-attrs:
      psu-401-dc:
        model: PSU-401-DESR
      fan-402825:
        model: FAN-402825-HD
  dc:
    kind: orderable
    description: Dual 400W DC PSUs (PSU-401-DESR) and FAN-402825-HD fans,
      front-to-back airflow; no chassis SKU published (see gaps)
    airflow: front-to-back
    component-attrs:
      psu-401-dc:
        model: PSU-401-DESR
      fan-402825:
        model: FAN-402825-HD
  ac:
    kind: orderable
    description: Dual 400W AC PSUs (PSU-401-AESR) and FAN-402825-HD fans,
      front-to-back airflow; no chassis SKU published (see gaps)
    airflow: front-to-back
    bays:
      psu-0: ufispace/psu-401-ac@1
      psu-1: ufispace/psu-401-ac@1
    component-attrs:
      psu-401-ac:
        model: PSU-401-AESR
      fan-402825:
        model: FAN-402825-HD
