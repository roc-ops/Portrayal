           states: {led-a: ['off', {name: link-100m, color: '#f59e0b'},
                            {name: activity-100m, color: '#f59e0b', behavior: blinking}],
                    led-b: ['off', {name: link-1g, color: '#22c55e'},
                            {name: activity-1g, color: '#22c55e', behavior: blinking}]},
           description: 'HIG Management Port LED table - left lamp Off (no power), Solid Green
             (1G link-up), Blinking Green (1G TX/RX activity); right lamp Off, Solid Amber
             (10M/100M link-up), Blinking Amber (10M/100M TX/RX activity). Declared per
             element because the two lamps do not share a vocabulary. No per-device
             corner evidence overrides the tool''s rotate: 180 (preserving the pre-sweep
             common/rj45-port@4 render), so at this rotate the component-local left
             window (led-a) renders on screen-right: led-a carries the physical-right/
             amber pair and led-b the physical-left/green pair, the same physical
             assignment as before the sweep'}
