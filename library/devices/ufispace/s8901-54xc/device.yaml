format: 1
kind: device
name: s8901-54xc
version: 2.0.5
maturity: modelled
manufacturer: UfiSpace
model: S8901-54XC
portfolio:
  line: 'Cloud & Data Centers'
  family: Data Center Switch
description: >-
  UfiSpace S8901-54XC data center ToR/leaf switch - 1RU, 48x SFP28 25G + 6x QSFP28
  100G, Broadcom Trident3-X5, rear 5x hot-swap fans (4+1) and 2x hot-swap 400W
  PSUs (1+1), AC or DC, both airflow directions orderable
provenance:
  sources: >-
    datasheet (UfiSpace S8901-54XC Data Center ToR Switch) for dimensions, port counts, silicon, power,
    environment and compliance; hardware installation guide R1.8 (s8901-54xc-hig)
    for FRU dimensions, LED tables, grounding and the system overview Figure 5;
    vendor product renders s8901-54xc-2-front.png (1776x177) and
    s8901-54xc-3/4-rear.png for layout measurement and colour. The front render's
    aspect is 10.034 against the datasheet's 440/43.8 = 10.046 - 0.1% out, so it
    was measured at 4.036 px/mm as an orthographic elevation. The rear renders are
    9.86 - 1.8% out - so only x-fractions anchored on the 52.5 mm fan-handle pitch
    and the 51.5 mm fan module width were taken from them.
  chassis: datasheet (440 x 440 x 43.8 mm W x D x H, 1RU, 8.7 kg without FRU;
    HIG Space Clearance repeats 44.0 cm width and says the rack brackets suit
    19-inch racks, so 440 is the body between the bolt-on ears, not a rack face)
  front-layout: photo-measured (front render at 4.036 px/mm - SFP28 block A
    apertures 26.3 to 197.1, block B 200.4 to 371.4, QSFP28 columns at 375.6/
    394.7/413.7; all x positions read off aperture edges, then regularized to the
    standard 14.25 SFP and 19.05 QSFP pitches, which the render matches to 0.1 mm)
  sfp-pitch: registry (SFF-8433 14.25 mm; photo-measured 14.23-14.24 over 11
    columns in each block, so the standard figure is used. The two 12-column
    blocks are separated by an extra 3.3 mm of panel)
  qsfp-pitch: registry (TE 2322551 ganged pitch 19.0; photo-measured 19.07,
    modelled at 19.05 so three columns land on the measured aperture edges)
  rows: photo-measured (SFP aperture centres y 14.97 and 30.44 - a 15.5 mm row
    pitch, against the TE reference 15.0 belly-to-belly, which is not governed by
    any spec; QSFP centres 15.1 and 30.56)
  mgmt-stack: >-
    photo-measured centres, COMPRESSED TO FIT THE REUSED PARTS: the render's
    bezels are mgmt RJ45 6.5-18.5, USB 18.6-26.0, console 26.3-37.8 (31.3 mm
    total), while the three parts placed here stack to 35.7 mm
    (common/rj45-eth@1 13.2 + common/usb-a@3 9.3 + std/rj45@2 13.2; before the
    RJ45 sweep the same trio - common/rj45-port@4, common/usb-a@3,
    common/rj45-bezel@2 - stacked to 39.1). They are placed at y 1.6 / 16.9 /
    26.4 - the USB lands on its measured centre, the two jacks are pulled up
    to 2.7 mm off theirs. The same trade the S9510-28DC made with the same
    three roles. THE TWO JACKS MIRROR - in a 10x crop the mgmt jack's pins are
    at the bottom and the console's at the top. Before the sweep this fell out
    of the two components' own defaults (rj45-port@4 composed std/rj45 rotated
    internally, pins down/LEDs top; rj45-bezel@2 drew pins up) with neither
    placement carrying a device-level rotate. The RJ45 sweep's FLIP_ORIGIN
    rule now carries a rotate: 180 on the mgmt placement (common/rj45-eth@1's
    own unrotated default is keyway-down, the opposite of rj45-port@4's) to
    preserve this same pins-down/LEDs-top appearance; the console
    (std/rj45@2) stays unrotated, still pins-up. A first draft rotated the
    console 180 and the render pass caught it.
  led-positions: photo-measured (SYS/FAN/PS0/PS1 rect lamps at x centres 53.4/
    60.1/67.0/73.7, y centre 3.84, ID below PS1 at y 6.31 - RE-PITCHED in the
    model from the measured 6.8 mm to 7.7 mm, centres 52.5/60.2/67.9/75.6,
    because common/led-rect is 4.6 mm wide against the render's 2.7 mm lamp and
    the printed legends must land between the lamps; SFP arrow pairs on the
    ganged strip at y centre 22.64, up at column+4.9, down at column+8.5 centre;
    QSFP lane lamps 4 per port, above the block at y centre 7.55 for the top row
    and below the number band at 39.47 for the bottom row)
  led-semantics: >-
    HIG section 10 page 21 Front Panel LED table, transcribed onto the lamps: SYS
    off/green boot complete/amber boot failed; FAN off/green all normal/blinking
    amber fan fail; PS0 and PS1 off/green/blinking amber, each tied to its own
    rear PSU bay; ID off/blinking blue beacon. The PSU FRU and Fan FRU tables
    live in the ufispace/psu-401-* and fan-402825 contracts. The management jack
    is declared per element from the Management Port LED table - left lamp green
    1G link/activity, right lamp amber 10M/100M link/activity. The HIG gives NO
    table for the port lamps, so the 48 led-arrow and 24 led-dot placements
    keep their component off/on default; see gaps.
  silkscreen: >-
    photo (6x crops of the front render). Port numbering runs '▲ even odd ▼' per
    ganged column - even on top - printed dark on the olive-yellow band under the
    SFP blocks and light on the olive-green band under the QSFP block; wordmark
    S8901-54XC and RESET on the black label field; SYS/FAN/PS0/PS1/ID legends
    right of their lamps; the USB/arrows/console icon row printed at the panel
    foot is transcribed as 'SS⚡ ▲▼ IOIOI' and sits 2.5 mm lower than the render
    because the console jack component overruns the real bezel (see mgmt-stack).
    The OOB tree icon printed above the management jack is NOT drawn - the
    oversized jack stack leaves no panel between the plate and the top edge.
  rear-layout: >-
    photo-measured as fractions (rear renders, blue-handle and red-handle
    variants agree): five fan handles at x centres 27.6/80.3/132.6/185.1/237.5 -
    a 52.5 mm bay pitch - with module seams at 14.9 and 66.5 fixing bay 0's left
    edge at 14.9; PSU latches (contract cx 2.4) at 323.8 and 383.6 putting the
    50.5 mm PSU bays at 321.4 and 381.2 with the PSU0 legend on the 9.3 mm rib
    between them and PSU1's on the right edge. Fan bays at y 0.8 (42.2 in 43.8),
    PSUs at y 1.8 (40.2). Vendor art prints 'FAN ◀n' on each module face, not on
    the chassis - the fan component carries no numeral, so the numbering lives
    only in rel-pos; a chassis mark would be painted under the module.
  grounding: >-
    HIG section 8 and Figure 24 - the ground lug bolts to two M4 holes at the
    rear left, drawn as decor rings at x 6.9, y centres 7.2 and 23.2
    (photo-measured), with the earth symbol below them at y 36.2. The HIG says
    there are TWO designated lug locations on the case; only this rear one is
    photographed, the second is registered in gaps.
  top-face: >-
    estimated (HIG Fig 5 top drawing, front at the drawing's top edge -
    four stiffening grooves and seven screw heads placed from its fractions
    anchored to the 440 x 440 datasheet footprint; the drawing is schematic so
    positions are estimated. AXIS: y = 0 is the REAR, per house convention)
  side-faces: >-
    estimated (angle render s8901-54xc-1-view.png shows two rows of
    rivets along each side; ten drawn per side at estimated positions. AXIS:
    RIGHT view x = 0 is the FRONT, LEFT view x = 0 is the REAR, per viewer3d
    orientation)
  bottom-face: >-
    estimated (no bottom photograph; compliance sticker centred per
    house pattern. A bottom view mirrors left-right; all content here is
    symmetric, recorded so the axis is known to have been considered)
  colors: >-
    photo-measured medians (panel #2c2f32, ganged strips #b6b6b6, SFP
    number band #808041, QSFP number band #52663c, bezel plate #bdc1cf, label
    field #292929)
  power: >-
    datasheet 'Typical power: 120 Watts (no transceiver)' - the vendor's own
    scope, hence power-envelope: bare; HIG Connecting Power, both DC and AC
    sections: 'The maximum system power consumption is 396.5 watts'. The vendor
    does not say what population the maximum covers. AC 100-240V 6A, DC -36 to
    -75V 16A, both from the datasheet, 20A DC / 12A AC internal PSU fuses from
    the HIG.
  part-numbers: >-
    vendor-silent in the intake - neither the datasheet nor HIG R1.8 prints an
    orderable chassis SKU (the S9510-28DC's SKUs came from the owner, not its
    documents; the same may exist here). FRU part numbers are real and belong to
    the FRU contracts: PSU-401-DESR/DISB-1/AESR/AISB and FAN-402825-HD/CD, from
    the datasheet's Available to Order section. The -E*/-H* suffixes are the
    exhaust (front-to-back, red latch) parts and -I*/-C* the intake
    (back-to-front, blue latch) parts, per the HIG's latch-colour convention.
  eol: searched 2026-08-28 ('UfiSpace S8901-54XC end of life') - no announcement;
    the product page is live at ufispace.com. Hence lifecycle eol none-announced.
attrs:
  performance:
    switching-capacity: 2.0 Tbps
    packet-buffer: 32 MB
    port-modes-sfp28: 1/10/25G
    port-modes-qsfp28: 40/100G
  power:
    power-typical-w: '120'
    power-max-w: '396.5'
    power-envelope: bare
    input-ac: 100 to 240V AC, 6A max per feed
    input-dc: -36 to -75V DC, 16A max per feed
    psu-options: PSU-401-DESR / PSU-401-DISB-1 (400W DC), PSU-401-AESR /
      PSU-401-AISB (400W AC); exhaust or intake airflow
  thermal:
    fan-redundancy: 4+1 hot-swappable
    fan-options: FAN-402825-HD (exhaust) / FAN-402825-CD (intake)
  environmental:
    operating-temp: 0 to 45 C
    storage-temp: -40 to 70 C
    humidity: 5 to 95% RH non-condensing
  platform:
    asic: Broadcom Trident3-X5 BCM56770
    cpu: Intel Denverton 4-core @ 1.6 GHz
    memory: 8 GB DDR4 (up to 32 GB)
    storage: 32 GB SSD
    bmc: ASPEED AST2620
  features:
    optics-qsfp28: 100G SR/LR/ER
    optics-sfp28: 25G SR/LR/ER, per datasheet Compatible Transceivers
  management:
    console: RJ45 serial, 115200 8N1
  compliance:
    emc: FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class A;
      EN 300 386; EN 55035; VCCI CISPR 32 Class A; AS/NZS CISPR 32 Class A
    safety: UL 62368-1; IEC 62368-1
    environment: WEEE
    other-approvals: MTCTE; NOM
  lifecycle:
    eol: none-announced
chassis:
  width: 440
  height: 43.8
  depth: 440
  ru: 1
  weight-kg: 8.7
  color: '#2c2f32'
gaps:
- what: port-led-semantics
  scope: [sfp28, qsfp28, port-leds]
  reason: vendor-silent
  note: >-
    HIG section 10 tables the SYS/FAN/PS0/PS1/ID system lamps, the PSU and Fan
    FRU lamps and the management jack, and gives no table for the port lamps.
    The 48 led-arrow and 24 per-lane led-dot placements therefore keep their
    component default of off/on rather than an invented link/activity
    vocabulary. As on the S9510-28DC, these may be NOS-defined rather than
    undocumented; we do not know which.
  wanted: a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a
    live unit with ports in known states
- what: second-grounding-location
  scope: [ground-mark]
  reason: needs-photo
  note: >-
    HIG section 8: 'there are two locations on the case in which the grounding
    lug may be fixed'. The rear-left two-hole location is photographed and
    modelled; Figure 23 shows the other only as an interior corner view with a
    yellow 'REMOVE LABEL FOR SYSTEM GROUNDING' sticker, which cannot be placed
    on a face from the figures held.
  wanted: a photograph or drawing locating the second lug position on its face
- what: fru-power-unpublished
  scope: [ufispace/fan-402825@1]
  reason: vendor-silent
  note: >-
    Same finding the S9510-28DC records: the HIG dimensions and weighs the fan
    FRU (51.5 x 42.2 x 57.8 mm, 185 g) and tables its LED, and no UfiSpace
    document in the intake gives a wattage for it. The PSUs carry their 400 W
    rating from their own ordering lines.
  wanted: a photograph of the fan module's label, or a UfiSpace FRU datasheet
- what: chassis-sku
  scope: [base, dc, ac]
  reason: vendor-silent
  note: >-
    No orderable chassis part number appears in the datasheet or HIG R1.8, so
    the orderable configurations carry no part-numbers map. The S9510-28DC's
    SKUs (S9510-28DC-BN0B/-BR1B) were supplied by the owner, not by its
    documents; equivalents likely exist for this box.
  wanted: a UfiSpace ordering guide or a quote naming the DC and AC chassis SKUs
groups:
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the chassis indicators - SYS, FAN, PS0, PS1 and the blue ID beacon
  port-leds:
    term: LED
    role: indicator
    index-origin: 0
    description: every indicator that belongs to a particular port, indexed by that port
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 redundant, hot-swappable'
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '4+1'
      redundancy-note: '4+1 - 4+1 hot-swappable (attrs fan-redundancy)'
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the management block at the left-hand end - the out-of-band RJ45, a
      USB 3.0 service port, the RS-232 console and the recessed reset button.
      The same cluster, and the same word for it, as the other devices in the
      library that have one
