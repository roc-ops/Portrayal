configurations:
  base:
    kind: base
    description: >-
      The chassis as every held rear figure draws it - four FAN-808012-HC fans and two
      PSU-302-DESR 3000 W DC supplies, red handles and latches throughout, exhaust
      (front-to-back) airflow, and the thirty-eight traffic and management ports empty.
      No orderable chassis part number appears in any held document; see the chassis-sku
      gap.
    default: true
  dc:
    kind: orderable
    description: >-
      Dual 3000 W -40 V to -72 V DC supplies (PSU-302-DESR, two-stud screw terminal block
      under a plastic cover) with FAN-808012-HC fans. This is the build both the HIG's
      rear elevation and the vendor rear render draw. The HIG rates the feed for operation
      up to 5000 m and notes a 150 A fast-acting fuse built into each supply; system
      maximum 1752 W on MSA optics and 2073 W with OpenZR+.
    component-attrs:
      psu-302-dc:
        model: PSU-302-DESR
      fan-808012:
        model: FAN-808012-HC
  ac:
    kind: orderable
    description: >-
      Dual 3000 W 200-240 V AC supplies (PSU-302-AESR, IEC 60320 C20 inlet fed by a C19
      cable) with FAN-808012-HC fans; system maximum 1728 W on MSA optics and 2049 W with
      OpenZR+, and a 25 A fast-acting fuse per supply. No held figure shows this build
      seated in the chassis - see the ac-build-rear-face gap.
    bays:
      psu-0: ufispace/psu-302-ac@1
      psu-1: ufispace/psu-302-ac@1
    component-attrs:
      psu-302-ac:
        model: PSU-302-AESR
      fan-808012:
        model: FAN-808012-HC
datasheet:
  title: UfiSpace S9611-36D 400G Open Core and Aggregation Router Datasheet
  url: https://www.ufispace.com/products/telco/aggregation
