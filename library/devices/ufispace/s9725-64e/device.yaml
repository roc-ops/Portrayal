    components:
      placements:
        - {ref: common/reset-button@1, id: reset, at: [17.72, 7.58], for: chassis, group: mgmt, rel-pos: 1}
        - {ref: ufispace/seg7-beacon-s9611@1, id: beacon, at: [9.29, 16.05], for: chassis,
           description: 'the two-digit seven-segment readout HIG Figure 4 calls the
             Beacon LED; what the digits show is stated nowhere, so no states are
             claimed - see gaps', group: status-leds, rel-pos: 6}
        - {ref: std/smb@1, id: pps, at: [7.77, 41.97], group: mgmt, rel-pos: 2,
           attrs: {role: timing},
           description: '1PPS input/output, 50 ohm SMB, Premium build only; HIG
             Connecting the 1PPS Interface'}
        - {ref: std/smb@1, id: mhz, at: [7.77, 56.25], group: mgmt, rel-pos: 3,
           attrs: {role: timing},
           description: '10MHz input/output, 50 ohm SMB, Premium build only; HIG
             Connecting the 10MHz Interface'}
        - {ref: common/led-dot@1, id: led-sync, at: [10.03, 64.89], for: chassis,
           states: ['off', {name: locked, color: '#22c55e'},
                    {name: freq-locked, color: '#22c55e', behavior: blinking},
                    {name: acquiring, color: '#f59e0b'},
                    {name: sync-fail, color: '#f59e0b', behavior: blinking}],
           description: 'HIG SYNC row - Off (system timing/clock synchronization is
             disable or in free-run mode), Solid Green (system timing core is
             synchronized to PTP packet (Phase) or one of the external timing sources
             (Phase) and frequency is locked), Blinking Green (system timing is
             synchronized to PTP packet (Frequency) or one of the external timing
             (Frequency) sources), Solid Amber (system timing core is in acquiring state
             or holdover mode), Blinking Amber (system timing synchronization fail or
             acquiring/holdover time out)',
           group: status-leds, rel-pos: 1}
        - {ref: common/led-dot@1, id: led-sys, at: [10.03, 67.49], for: chassis,
           states: ['off', {name: boot-complete, color: '#22c55e'},
                    {name: boot-failed, color: '#f59e0b'}],
           description: 'HIG SYS row - Off (no power), Solid Green (Host CPU/BMC boot
             complete), Solid Amber (power is up but Host CPU/BMC boot failed)',
           group: status-leds, rel-pos: 2}
        - {ref: common/led-dot@1, id: led-fan, at: [10.03, 70.09],
           for: [rear/fan-0, rear/fan-1, rear/fan-2, rear/fan-3],
           states: ['off', {name: ok, color: '#22c55e'},
                    {name: fault, color: '#f59e0b', behavior: blinking}],
           description: 'HIG FAN row - Off (fans are not initialized), Solid Green (all
             FAN modules are working normal), Blinking Amber (FAN fail: one or more FAN
             module(s) need service)', group: status-leds, rel-pos: 3}
        - {ref: common/led-dot@1, id: led-ps0, at: [10.03, 72.69], for: rear/psu-0,
           states: ['off', {name: ok, color: '#22c55e'},
                    {name: fail, color: '#f59e0b'}],
           description: 'HIG PS0 row - Off (no power), Solid Green (PSU0 is working
             normal), Solid Amber (PSU0 fail, PSU0 need service)',
           group: status-leds, rel-pos: 4}
        - {ref: common/led-dot@1, id: led-ps1, at: [10.03, 75.29], for: rear/psu-1,
           states: ['off', {name: ok, color: '#22c55e'},
                    {name: fail, color: '#f59e0b'}],
           description: 'HIG PS1 row - Off (no power), Solid Green (PSU1 is working
             normal), Solid Amber (PSU1 fail, PSU1 need service)',
           group: status-leds, rel-pos: 5}
        - {ref: common/rj45-ganged-eth@1, id: mgmt, at: [20.95, 48], rotate: 180, group: mgmt, rel-pos: 4,
           attrs: {role: mgmt, speed: 100m-1g},
           description: 'the OOB management jack (HIG Figure 4 callout RJ45 OOB); its two
             integrated lamps - left green for 1G link and activity, right amber for
             10M/100M, per the HIG Management port LED table - are drawn as led-a/led-b
             of this jack'}
        - {ref: std/usb-a@1, id: usb, at: [21.39, 61.93], group: mgmt, rel-pos: 5,
           attrs: {role: maintenance},
