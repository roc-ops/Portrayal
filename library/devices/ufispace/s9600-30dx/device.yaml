configurations:
  base:
    kind: base
    description: >-
      The router as HIG Figure 7 draws it - four FAN-803816-HI exhaust fans and two
      PSU-162-AESR 1600W AC supplies at the rear, and the thirty traffic ports empty. No
      orderable chassis part number appears in any held document; see the chassis-sku
      gap.
    default: true
    airflow: front-to-back
  ac:
    kind: orderable
    description: >-
      Dual 1600W AC supplies (PSU-162-AESR, exhaust airflow) with four FAN-803816-HI
      fans. The datasheet's AC input rating is 200 to 240 V at 10 A; the HIG's maximum
      system consumption for this build is 1300 W, and on a single 110 V feed both
      supplies derate to 1000 W each. The AC build ships one grounding lug.
    airflow: front-to-back
    component-attrs:
      psu-162-ac:
        model: PSU-162-AESR
      fan-803816:
        model: FAN-803816-HI
  dc:
    kind: orderable
    description: >-
      Dual 1600W -48V DC supplies (PSU-162-DESR, exhaust airflow) with four
      FAN-803816-HI fans. The datasheet's DC input rating is -40 to -72 V at 50 A and
      the HIG's maximum system consumption for this build is 1276 W. The DC build ships
      five grounding lugs where the AC build ships one (HIG accessory list).
    airflow: front-to-back
    bays:
      psu-0: ufispace/psu-162-dc@1
      psu-1: ufispace/psu-162-dc@1
    component-attrs:
      psu-162-dc:
        model: PSU-162-DESR
      fan-803816:
        model: FAN-803816-HI
