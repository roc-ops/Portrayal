gaps:
- what: model-badge
  scope: [front]
  reason: needs-photo
  note: >-
    The badge printed at the bottom right of the faceplate reads S9600-104BC in HIG
    Figure 8 at 600 dpi - five glyphs before the hyphen, the last of them a round 0 the
    same width as the one before it, against an unmistakably narrow 1 after the hyphen.
    No UfiSpace product is called S9600-104BC. The guide, the datasheet and the product
    page all title the unit S9601-104BC, so the badge is drawn S9601-104BC and this
    entry records that the only legible rendering of it says otherwise. The two vendor
    photographs are 520 and 650 px wide and cannot resolve the character.
  wanted: a straight-on high-resolution front photograph of the badge, or the unit
- what: qsfp-plate
  scope: [front]
  reason: vendor-silent
  note: >-
    The QSFP block sits between two perforated plates, and each is magenta over the
    left-hand column and green over the right-hand one. By position the magenta half
    covers the QSFP28 ports and the green half the QSFP56 ports, which is exactly what a
    media colour code looks like - but the plate appears in no callout, no table and no
    procedure, and nothing in either document mentions a colour convention. It is drawn
    as vent-patterned panel decor because that is what it looks like; if it is in fact
    part of the QSFP cage assembly it belongs in a component instead, and if the colours
    do encode media then the boundary belongs on the cage-column line at 412.5 rather
    than at the 414.2 where it is drawn.
  wanted: a UfiSpace exploded view, a close photograph of the QSFP block, or any vendor
    statement about the colour code
- what: qsfp-port-legend
  scope: [qsfp28, qsfp56]
  reason: needs-photo
  note: >-
    The SFP28 blocks print their port numbers on the yellow and cream bands and those are
    transcribed. The QSFP block has no such band - the coloured plates occupy that
    space - and no printed numeral is legible on it at the only resolution available.
    Ports 96-103 are numbered here from the HIG's Port Overview table and from Figure 8's
    large annotation overlay, which is the figure's own labelling rather than the panel's
    ink, so no silkscreen mark is written for them.
  wanted: a straight-on high-resolution front photograph, or a vendor 3D model
- what: qsfp-lane-lamp-ownership
  scope: [led-port-96, led-port-97, led-port-98, led-port-99, led-port-100,
    led-port-101, led-port-102, led-port-103]
  reason: vendor-silent
  note: >-
    The land between each QSFP pair carries a dot matrix that resolves as dots but not as
    countable rows and not as wiring. The upper strip is assigned to the upper port and
    the lower strip to the lower port BY POSITION ONLY; the HIG tables no port lamp of any
    kind. ufispace/lane-led-quad's four lamps are taken as the arrangement because that
    component was built for this vendor's QSFP blocks, not because four were counted here.
  wanted: a lit-unit photograph, or a UfiSpace port-LED table
- what: port-led-semantics
  scope: [sfp28, qsfp28, qsfp56, sfp-plus-mgmt, port-leds]
  reason: vendor-silent
  note: >-
    HIG section 10 tables the six system lamps (SYNC, SYS, FAN, PS0, PS1, ID), the PSU FRU
    lamp and the Fan FRU lamp, and gives no table at all for the port lamps. The
    ninety-eight arrow lamps, eight lane-lamp strips and two management-jack lamps
    therefore keep their component default of off/on rather than an invented
    link/activity vocabulary. Unlike the S9510-28DC's tables, not one row here is
    annotated 'need NOS to activate', so there is no evidence either way about whether
    these are NOS-defined.
  wanted: a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a live unit
    with ports in known states
- what: sfp-row-mirroring
  scope: [sfp28, sfp-plus-mgmt]
  reason: needs-photo
  note: >-
    A two-high ganged SFP block normally mirrors so that both rows' bail latches stay
    reachable, and std/sfp-ganged draws an asymmetric aperture that would show it. The only
    elevation that resolves these cages is HIG Figure 8, and Figure 8 prints its large
    annotation numerals ON the cages, covering exactly the detail that would settle it. The
    rows are drawn belly-to-belly, the lower row rotate 180, because the port lamps between
    the rows point up over down and that is the library's stack convention
    (docs/pluggables-3d-design.md, S3: upper rotate 0 over lower 180, both bails outward) - lamps and the rule, not a measurement of the metal.
  wanted: a straight-on high-resolution front photograph, or a vendor 3D model
- what: fan-face-width
  scope: [fan-0, fan-1, fan-2, fan-3]
  reason: sources-disagree
  note: >-
    Two UfiSpace hardware guides give the same ordering name two different faces. This
    device's HIG tables 'Fan (W x D x H) 81*138.80*81.5mm' and its datasheet orders
    'FAN-803816-HI'; the S9600-28DX HIG tables that same part number at
    '80 x 113 x 81.5mm'. Width 81 against 80 and depth 138.8 against 113 - the depths
    differ by 23 percent, which is more than a rounding, so these may be two builds
    sharing an ordering name. The bays here are drawn 81.0 x 81.5 from THIS device's own
    table and seat ufispace/fan-808012@1, whose contract is exactly that face; the part
    number FAN-803816-HI is carried in the configurations. ufispace/fan-803816-hi@1
    exists in the library at 80.0 x 81.5 and is deliberately not used here.
  wanted: a UfiSpace fan FRU datasheet, or a photograph of the module's own label
- what: datasheet-compliance-empty
  scope: [compliance]
  reason: vendor-silent
  note: >-
    The datasheet prints a REGULATORY COMPLIANCE block with the headings Safety, EMC and
    Environment and NOTHING under any of them. This was confirmed by rendering page 2 at
    600 dpi and looking at it, not only by extracting the text, because outlined glyphs
    would look the same to an extractor - the block is genuinely blank. Every compliance
    value carried here therefore comes from HIG section 13, which gives FCC, ICES, CISPR,
    VCCI and NEBS statements but names no safety standard beyond the laser class and no
    environmental directive at all. In particular there is NO UL 62368-1 or IEC 62368-1
    claim in the intake for this model, and none is inferred from the sibling S9600-102XC.
  wanted: a revision of the datasheet with the compliance block filled in, or a UfiSpace
    declaration of conformity
- what: fru-power-unpublished
  scope: [ufispace/fan-808012@1]
  reason: vendor-silent
  note: >-
    ufispace/fan-808012 states no draw and its own contract records the search. This HIG is
    the same - it weighs the fan FRU at 1.14 lb (520 g) and tables its lamp, and its only
    wattages are the two system maxima (811 W DC, 808 W AC), the 1300 W per-circuit reserve
    and the PDU fuse suggestions, none of which is a fan's draw. L29's standing warning is
    the live count of how much of the chassis module total is a floor. With four fans in a
    2RU 104-port chassis this is a material hole, not a rounding one.
  wanted: a photograph of the fan module's label, or a UfiSpace FRU datasheet
- what: side-faces-unsourced
  scope: [left, right]
  reason: needs-drawing
  note: >-
    No figure or photograph in the intake shows a flank square-on. The five rail
    attachment pins per side and the single M4 locking screw per side are drawn because
    HIG section 5 states their count and says the locking screw is at the front, but their
    heights and pitch are estimated. The isometric photograph shows a flank foreshortened
    and confirms that the pins exist and that the face is otherwise plain metal; it cannot
    be measured.
  wanted: a mechanical drawing or an orthographic side elevation
- what: qsfp-plate-lower-extent
  scope: [front]
  reason: needs-photo
  note: >-
    The upper coloured plate is cleanly bounded at y 7.6-11.5 and x 392.4-435.0. The lower
    one sits at y 75.6-79.6 where it overlaps the bottom perforated field, and its right
    edge could not be separated from that field by colour; it is drawn the same width as
    the upper plate on the assumption that they are a pair, which the figure supports
    visually and does not resolve.
  wanted: a straight-on high-resolution front photograph
groups:
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the chassis indicators - SYNC, SYS, FAN, PS0, PS1, ID as printed on the
      white strip beside them
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: every indicator that belongs to a particular port, ordered by that port
  psus:
    term: PSU
    role: service
    index-origin: 0
    description: vendor spells the rear bays PSU0 (upper) and PSU1 (lower) on the strip
      beside them; the front panel's PS0 and PS1 lamps use the same numbering
    attrs:
      redundancy: '1+1'
      redundancy-note: '2x 1300 W 1+1 redundant, hot-swappable (exhaust airflow)'
  fans:
    term: Fan
    role: service
    index-origin: 0
    description: vendor numbers the modules 0 1 2 3 on the rear face, left to right, on
      the same strip as the PSU labels
    attrs:
      redundancy: '3+1'
      redundancy-note: '3+1 - hot swappable fan modules with 3+1 redundancy support (UfiSpace datasheet, staged intake)'
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
    description: ports 0-95, '96 x 1/10/25G SFP28 ports', up to 40 km (HIG Port Overview)
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
    description: ports 96, 97, 100 and 101 - the left column of each QSFP block,
      '4 x 40/100G QSFP28 ports', up to 80 km (HIG Port Overview)
  qsfp56:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp56, speed: 200g}
    description: ports 98, 99, 102 and 103 - the right column of each QSFP block,
      '4 x 40/100/200G QSFP56 ports', up to 80 km (HIG Port Overview)
  sfp-plus-mgmt:
    term: Port
    role: management
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: the pair the datasheet calls '2 x 10G SFP+ management ports', printed
      0 and 1 in their own sequence above their own two-row block
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: the timing interfaces - a GNSS antenna on SMA, 1PPS and 10MHz on SMB and ToD
      on RJ45. Four media, one job; the three coaxial jacks run in a row along the top of
      the faceplate and the ToD jack sits below them
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the management cluster in one silver bezel - the out-of-band 100/1000M RJ45, a
      USB 3.0 Type-A maintenance port and the RS-232 console on RJ45 - plus the recessed
      reset button beside it. Same cluster, and the same word for it, as the other
      UfiSpace boxes in the library
