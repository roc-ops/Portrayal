version: 3.0.5
maturity: modelled
manufacturer: UfiSpace
model: S9601-104BC
portfolio:
  line: Telecoms
  family: Open Aggregation Router
  series: S9600 Series
description: UfiSpace S9601-104BC 25G/100G/200G Disaggregated Open Aggregation Router -
  2RU, 96x 1/10/25G SFP28 + 4x 40/100G QSFP28 + 4x 40/100/200G QSFP56 + 2x 10G SFP+
  management, full timing (GNSS/1PPS/10MHz/ToD) with Stratum 3E OCXO and Class C
  accuracy, SRv6, an Intel Denverton CPU behind a Broadcom Qumran2c, dual 1300W
  hot-swap PSUs and four hot-swap fans, rear-service power and cooling
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the port lamps, which point up
      over down: the 49 SFP pairs (mport-0/mport-1 to port-94/port-95). Decided by the rule, not
      an observation, so a photograph of the stack overturns it: the 4 QSFP pairs (port-96/port-97
      to port-102/port-103).
  sources:
    confidence: datasheet
    note: >-
      datasheet (s9601-104bc-datasheet.pdf, converted) and Hardware Installation Guide R1.7
      (s9601-104bc-hig.pdf, converted, Figures 1-33), plus three vendor images:
      s9601-104bc-1-view.jpg (650x278, a three-quarter isometric), -2-view.jpg and -3-rear.jpg
      (both 520x150, front and rear elevations). ALL THREE PHOTOGRAPHS ARE TOO SMALL TO MEASURE -
      at 520 px across a 440 mm face they resolve 1.2 px/mm, so the 14.25 mm port pitch is
      seventeen pixels - and they were used for colour, counts and confirmation only. No
      mechanical drawing of the CHASSIS exists in the intake; there are mechanical drawings of the
      two power supplies (HIG Figures 5 and 6). Front, rear and top geometry comes from the HIG's
      own pages re-rendered at 600 dpi with pdftocairo, not from the extracted figure PNGs, which
      are the embedded rasters at their native resolution.
  front-figure-scale:
    confidence: drawing
    note: >-
      drawing - HIG page 12, the Figure 8 port-overview elevation, re-rendered at 600 dpi. GATE 1:
      the drawn faceplate measures 3636 x 724 px (x 904.5-4540.5, y 1973.3-2697.5), which is 8.264
      px/mm against 440 mm and 8.255 px/mm against 87.7 mm - 0.1% apart. The figure is
      orthographic and every front coordinate below is measured on it at 8.2636 px/mm. TWO EDGES
      HAVE TO BE EXCLUDED OR THE GATE FAILS: the caption rule 88 px below the panel, and the
      rack-mount ear tabs that stick out past both ends at the top and bottom of the face (x
      885-904 and 4541-4559, about 100 px tall against the panel's 724). Neither is metal between
      the ear folds.
  chassis:
    confidence: datasheet
    note: >-
      datasheet '2 RU, 440 x 440 x 87.7 mm or 17.32" x 17.32" x 3.45"', 'Weight: 14.73kg or
      32.47lb (without FRU)', with the HIG's Component Physical Information table repeating both
      to the same precision ('S9601-104BC (W x D x H) 17.32 x 17.32 x 3.45 in (440 x 440 x
      87.7mm)', 'Chassis without FRU 32.47.49lb (14.73kg)' - the weight cell has a typo in the
      pound figure and the kilogram figure is used). 440 IS THE BODY, NOT THE RACK FACE: the HIG's
      Space Clearance section says 'The S9601-104BC width is 17.32 inches (44.0cm) and shipped
      with a rack mount brackets suitable for 19 inch (48.3cm) wide racks'. The brackets are
      visible in Figure 8 as tabs beyond both ends of the face and are not drawn. Depth 440 is
      likewise 'without the field replaceable units (FRUs)'; Space Clearance adds that the fan
      handle stands 29 mm proud and the PSU handle 30 mm, and asks for 6 inches of clearance at
      each end.
  port-pitch:
    confidence: drawing
    note: >-
      drawing-measured, AND MEASURED FROM FEATURES THAT REPEAT ONCE PER PORT rather than from the
      filled rectangles the figure draws for the module faces. Three independent per-port rulers
      agree. (1) The bright vertical separator lines between cages in the upper-left block fall at
      45.62, 59.96, 74.18, 88.52, 102.62, 131.12, 145.22, 159.37, 202.09 and 216.49 - eight
      interior lines plus both block edges, spanning twelve columns in 170.87, a pitch of 14.239.
      (2) The same lines in the right-hand block run 219.46, 234.04, 248.50, 262.60, 276.76,
      291.04, 305.25, 319.41, 333.57, 347.97, 362.07, 376.23 - eleven intervals in 156.77, a pitch
      of 14.252. (3) The black up/down arrow pairs printed on the yellow band repeat at 14.222.
      14.25 mm is also exactly std/sfp-ganged's contract width (SFF-8433 port pitch B04), so the
      standard part fits with no gutter, and 14.25 is what is used. ONE THING IN THE FIGURE
      DISAGREES AND IS NOT FOLLOWED: the black vertical divider the figure draws between the two
      blocks occupies x 219.7-221.5, which overlaps the right-hand block's first cage by 1.7 mm.
      The lattice is fixed by eleven intervals of a repeated feature and the divider by one drawn
      bar, so the lattice wins and the divider here is the 1.1 mm gap the two block shells leave
      between them.
  sfp28-blocks:
    confidence: drawing
    note: >-
      drawing-measured - the 96 SFP28 ports are FOUR blocks of twelve columns by two rows, not one
      field: an upper pair at x 45.6-216.6 and 219.5-390.5, and a lower pair on the same two x
      ranges. NUMBERING RUNS DOWN COLUMNS AND ACROSS BLOCKS: 0-23 upper-left, 24-47 upper-right,
      48-71 lower-left, 72-95 lower-right, even on the top row of each, which is what Figure 8's
      own numerals show. Rows measured from the drawn module faces at 17.39-25.62 and 32.27-40.38
      (upper) and 47.40-55.87 and 62.41-70.51 (lower); the port OPENING is 10.4 tall against that
      8.2 mm face, so the cages sit at y 16.3 / 31.1 and 46.4 / 61.2 - a 14.8 mm row pitch within
      a block and 30.1 between them. The whole port field is ONE continuous light shell per block
      from y 11.8 to 77.6, not two shells with a dark gap: the band between the upper and lower
      rows reads #bdbfbc, the same grey as the cage rows, and never goes dark.
  sfp28-legend:
    confidence: drawing
    note: >-
      drawing-measured - each block carries one printed band on its OUTER edge: yellow above the
      upper blocks (y 12.1-15.7, #cccc4d) and cream below the lower ones (y 72.2-75.7, #d6d4c0).
      The band prints, per column, the even port number, a solid up triangle, a solid down
      triangle and the odd port number - the legend that says which of the two lamps in the
      central land belongs to which row. Measured against the cage lattice the even numeral starts
      at cage + 1.2 and the odd numeral ENDS at cage + 12.9, which is why they are anchored start
      and end rather than centred: single digits sit at 1.5 and 12.6 and two-digit numbers open at
      1.5 and close at 12.5, so the numerals are edge-aligned and not centred. The triangles fall
      at cage + 5.6 and + 8.4. The numerals are transcribed here; the triangles are not, because
      they are a legend FOR the lamps and the lamps are modelled as parts.
  sfp28-lamps:
    confidence: drawing
    note: >-
      drawing-measured - two pale arrow lamps per column in the light land between the rows, up
      serving the top (even) port and down the bottom (odd) one. Found as brightness minima across
      the land and reduced to offsets from the cage lattice: thirteen readings cluster at 5.14
      (scatter 4.67-5.41) and thirteen at 8.85 (8.42-9.16), so the pair sits 3.71 mm apart. Land y
      26.0-32.3 (upper) and 55.9-62.4 (lower) with the lamp centres at 28.75 and 58.75. Drawn with
      common/led-arrow-sm (2.25 x 2.0) rather than common/led-arrow (3.6 x 3.2), which would be
      twice the drawing's arrow and would fill the land; that choice, and the 3.70 mm pair
      separation it has to sit on, are the same as ufispace/s9600-102xc, which is the same
      vendor's same block idiom - but the 5.14 / 8.85 offsets here are measured on THIS figure and
      differ from that model's 5.60 / 9.30 by half a millimetre.
  qsfp-blocks:
    confidence: drawing
    note: >-
      drawing-measured - EIGHT QSFP cages in two blocks of two columns by two rows, not six as on
      the S9600-102XC. Cage columns at x 393.7 and 412.8, from bright separators at 393.59, 412.77
      and 431.53, a 19.1 mm pitch against std/qsfp-ganged's 18.5 contract width so the cages do
      not abut. The rows are CENTRED ON THE SFP ROWS: the land between the QSFP rows reads
      25.98-32.27 and 55.51-62.41, the same lands as the SFP blocks to a tenth, so the QSFP cages
      sit at y 16.71 / 31.51 and 46.81 / 61.61, each 9.58 tall and on the same row centres as
      their SFP neighbours. Port identity is the HIG Port Overview table read against Figure 8's
      own numerals: the LEFT column is 96 over 97 and 100 over 101, all QSFP28; the RIGHT column
      is 98 over 99 and 102 over 103, all QSFP56. ALL EIGHT ARE DRAWN WITH std/qsfp-ganged,
      INCLUDING THE FOUR QSFP56: std/qsfp56 is 20.0 wide and cannot sit on a 19.1 mm measured
      pitch, and its own provenance says that 20.0 is 'assumed = QSFP28 bezel opening' while
      qsfp-ganged's 18.5 is measured off a real ganged cage. The right pitch beats the right name
      here, and the media is carried by the group rather than by the part.
  qsfp-lamps:
    confidence: drawing
    note: >-
      drawing-measured - the land between each QSFP pair carries a dense dot matrix rather than
      the SFP blocks' two arrows. At 8.26 px/mm it resolves as dots but not as rows that can be
      counted with confidence, so ufispace/lane-led-quad (14.4 x 2.6, four round lamps on a 3.94
      pitch, built for this vendor's QSFP blocks) is used, one strip per port, stacked in the land
      at y 26.3 and 29.3 (upper) and 56.2 and 59.2 (lower), inset 2.05 mm from each cage's left
      edge so the strip is centred in the 18.5 mm column. WHICH STRIP SERVES WHICH PORT IS BY
      POSITION ONLY - see the qsfp-lane-lamp-ownership gap.
  qsfp-plate:
    confidence: drawing
    note: >-
      drawing-measured - the QSFP block sits between two perforated plates, one above (y 7.6-11.5)
      and one below (y 75.6-79.6), and EACH PLATE IS TWO COLOURS: magenta from x 392.4 to 414.2
      and green from 414.2 to 435.0, sampled at #623a46 and #365927 in the figure and drawn a
      little brighter here so they read at faceplate scale. By position the magenta half sits over
      the QSFP28 column and the green half over the QSFP56 column, which is what a media colour
      code would look like - but no document says so, and the colour boundary reads 414.2 against
      a cage-column boundary at 412.5, so the two are drawn where they were measured rather than
      reconciled. See the qsfp-plate gap.
  mgmt-sfp-plus:
    confidence: drawing
    note: >-
      drawing-measured - the two 10G SFP+ management ports are a one-column, two-row ganged block
      of their own at x 27.5-43.6, y 15.6-41.6, sharing the upper blocks' rows exactly (cage
      aperture measured 28.50-42.54 across at y 19-24, and the block has the same
      two-row-plus-land structure). Cage at x 28.45. It carries no yellow band; its '0 up down 1'
      legend is printed white on the bare faceplate above it at y 12.7-14.7, with the two
      triangles measured at x 32.6 and 38.3. The vendor numbers these ports 0 and 1 in their own
      sequence, which is why they are a separate group: the traffic ports also start at 0.
  timing-block:
    confidence: drawing
    note: >-
      drawing-measured by colour (the three jacks are the only bright yellow features on the
      face). GNSS ANT centre (24.26, 7.71) and 9.56 mm across; 10MHZ centre (41.81, 7.71) and 7.14
      across; 1PPS centre (59.18, 7.77) and 7.26 across. They run in a ROW along the top of the
      faceplate, as on the S9600-102XC and unlike the S9501-18SMT's column, and each label is
      printed to the LEFT of its jack - measured ends at 17.1, 37.1 and 53.5. The measured
      diameters confirm SMA, SMB, SMB and agree with common/sma-jack (9.5) and common/smb-jack
      (7.0) to within 0.26 mm; the components' own contract sizes are used, not the measurements.
      ToD is a single RJ45 low on the left, bezel measured x 9.14-24.51 y 28.52-41.47, a 15.5 x
      13.1 bezel, which is the IEC 60603-7 single-port 16 x 14 cutout, so it is std/rj45 and not
      the ganged part.
  mgmt-cluster:
    confidence: drawing
    note: >-
      drawing-measured - one silver bezel at x 24.26-39.99, y 49.34-80.44 holding three things in
      a column, measured by scanning down its middle: the out-of-band RJ45 (drawn face x
      26.08-38.30, y 50.43-60.11, with green link lamps in its TOP corners so it is keyway-up and
      rotated 180), a USB 3.0 Type-A socket whose blue tongue measures x 27.41-37.57 y 63.37-64.83
      - the datasheet's '1 x USB 3.0 Type-A port', and the HIG calls it 'a maintenance port' - and
      the RS-232 console RJ45 keyway-down at y 70.03-78.62, labelled IOIOI below at y 82.7-83.6,
      which is the HIG's own spelling ('The console can be connected with the IOIO port'). Both
      RJ45s are std/rj45-ganged (12.7 x 11): the bezel is 15.7 wide and 31.1 tall, which will not
      take two 16 x 14 IEC cutouts and a USB. Three icons are printed above the bezel at y
      44.4-47.4 - a network glyph at x 23.9-26.6, an up/down arrow pair at 28.7-33.6 and the USB
      SuperSpeed trident at 35.2-37.2. The recessed RESET button is a ring centred (16.76, 46.74)
      about 2.5 mm across, drawn with common/reset-button at its own 4.0 contract size, with RESET
      printed under it.
  status-leds:
    confidence: drawing
    note: >-
      drawing-measured - six lamps in one column at x 14.82-17.85 (3.03 wide, 1.57 tall each) with
      tops at y 62.53, 64.95, 67.61, 70.03, 72.57 and 75.11, a mean pitch of 2.52 mm, and the
      legends printed dark on a white strip beside them at x 18.70-22.57 y 61.92-77.29. Order top
      to bottom SYNC SYS FAN PS0 PS1 ID, which is exactly the order of HIG section 10's Front
      Panel LED table; the bottom lamp is drawn blue in the figure and the table's only ID row is
      'Blinking Blue - Beacon is enabled'. DRAWN WITH common/led-dot (2.0 x 2.0) ON THE MEASURED
      2.52 PITCH, NOT WITH common/led-rect: led-rect is 4.6 x 2.6 and cannot sit on a 2.52 pitch
      without L13 firing, and stretching the column to fit it - which is what ufispace/s9600-102xc
      and ufispace/s9501-18smt did with their own tighter pitches - moves six lamps to keep one
      shape. The real lamp is a 3.0 x 1.6 rectangle and the dot is a compromise; the pitch is not.
  vents:
    confidence: drawing
    note: >-
      drawing-measured by darkness - the faceplate carries a perforated field above and below the
      port shells. The top field runs y 1.9-11.4 and starts at x 65.5, just clear of the 1PPS
      jack; the bottom field runs y 77.9-82.8 from x 45. The left-hand service area has two
      smaller fields of its own, a single row of three holes at x 11.2-24.5 y 16.2-19.8 and a
      taller block at x 6.6-14.3 y 51.0-77.8 beside the status lamps. THE TWO MAIN FIELDS DO NOT
      REACH THE SAME LEFT EDGE and that asymmetry is what the figure draws: the top field is
      stopped by the timing jacks and the bottom one by the console bezel.
  model-badge:
    note: >-
      THE FIGURE'S OWN BADGE READS S9600-104BC AND THE MODEL IS DRAWN S9601-104BC. At 600 dpi the
      badge at x 346-364, y 81.7-83.9 resolves letter by letter as S 9 6 0 0 - 1 0 4 B C: the
      character after the hyphen is unmistakably a narrow 1 and the fifth character before it is a
      round 0 the same width as the fourth. S9600-104BC names no UfiSpace product - the S9600
      series is the 102XC, 28DX, 32X, 56DX, 64X and 72XC - while the guide is titled S9601-104BC
      on every page, the datasheet is titled S9601-104BC and the product page is S9601-104BC.
      Printing the badge as drawn would put a model that does not exist on the chassis, so the
      badge is drawn with the model both documents title and the discrepancy is filed as the
      model-badge gap rather than silently corrected.
  rear:
    confidence: drawing
    note: >-
      drawing-measured, and this rear figure PASSES the aspect gate where the S9600-102XC's did
      not. HIG page 10, Figure 4's rear elevation re-rendered at 600 dpi: the body measures 1591 x
      323 px, and the two scales are settled by two features of KNOWN size rather than by the
      outline. The PSU face is tabled 73.5 x 40 and measures 263 x 145 px, giving 3.578 and 3.625
      px/mm; the outline would give 3.616 across and 3.683 down. 3.6159 px/mm is used on both
      axes, which is the width scale, and it puts the PSU within 0.4 percent on both of its own
      axes while the height scale would put it 2 percent out. The 6 px the height then over-runs
      is the drawn outline stroke. Fan bays at x 4.4 / 88.4 / 172.4 / 256.4, from bright seams
      measured at 4.4, 88.6, 173.4 and 257.0 and evened to an 84.0 mm pitch - the scatter is +/-
      0.6 mm, which is two pixels, and an uneven fan row is a failed measurement rather than a
      finding. THAT 84.0 PITCH IS INDEPENDENTLY THE SAME as the 84.2 and 84.1 two other UfiSpace
      chassis already use for this fan (ufispace/s9600-102xc and ufispace/fan-803816-hi's own
      provenance), which is corroboration and not a borrowed number. PSUs stacked at x 350.9, y
      2.8 and 46.2, size 73.5 x 40 from the HIG table and confirmed on the figure. The narrow
      strip right of the supplies carries, top to bottom, PSU0, an earth symbol with the grounding
      studs at the chassis edge beside it, 0123 over FAN, and PSU1.
  rear-fan-height:
    note: >-
      THE TABLE AND THE FIGURE DISAGREE ABOUT THE FAN AND THE TABLE IS FOLLOWED. The HIG's
      Component Physical Information table gives 'Fan (W x D x H) 81*138.80*81.5mm', so the face
      is 81.0 x 81.5 and the bays are drawn that size, centred vertically at y 3.1. Figure 4 draws
      the fan face filling the chassis height, y 0.3 to 87.7 at the scale above - 87.4 mm, six
      millimetres more than the table. The two are the module envelope and the bezel flange in its
      slot, the same disagreement ufispace/fan-803816-hi records for its own family, and the table
      wins for size.
  top:
    confidence: drawing
    note: >-
      drawing-measured, and the top view PASSES the aspect gate: HIG Figure 4's plan view measures
      1355 x 1360 px for a body the same figure dimensions W = 17.32 in (440 mm) and D = 17.32 in
      (440 mm), which is 3.0795 and 3.0909 px/mm, 0.37 percent apart. AXIS: y = 0 is the REAR, per
      the house convention and per the figure, which prints the fan handles at the top of the
      view. Three long recessed slots read at y 125.1-144.6, 230.1-249.6 and 335-355, spanning x
      20 to 423. A row of three screws crosses at y 90 (x 110, 221, 331) and a second row runs
      along the front edge at y 429. Slot DEPTH is dimensioned nowhere and the sink value is
      estimated.
  bottom:
    confidence: estimated
    note: >-
      estimated - no source in the intake shows the underside. The compliance sticker is the house
      convention at an estimated position. A bottom view mirrors LEFT and RIGHT; the sticker is
      the only content, so the axis was checked and does not bite.
  left:
    confidence: drawing
    note: >-
      drawing-fraction and estimated. HIG section 5's rack-mounting text is the only source that
      says anything about a flank: 'The chassis has 5 attachment pins on each side, for a total of
      10 pins' for the inner rail, plus 'two M4 screws (one on each chassis side)'. Five pins per
      side are drawn on an even pitch across the depth at an estimated height, because no figure
      in the intake shows a flank square-on and nothing dimensions them. AXIS: x = 0 is the REAR
      on a left view (viewer3d.js convention). This face carries only content that is symmetric
      front to back apart from the locking screw, which HIG section 5 places 'at the front of the
      chassis' - so the axis is load-bearing here and was checked rather than happening not to
      matter.
  right:
    confidence: drawing
    note: >-
      drawing-fraction and estimated - the mirror of the left, and deliberately the same content,
      because the guide describes the two sides identically ('one on each chassis side'). THE
      GROUNDING POINT IS NOT ON A FLANK ON THIS CHASSIS: HIG section 8 says 'The location for
      securing the grounding lug is at the rear of the case and is covered with a protective
      label', and Figure 4's rear elevation prints the earth symbol on the strip right of the
      supplies, so both flanks are plain. AXIS: x = 0 is the FRONT on a right view, so the locking
      screw sits at the opposite end of this face from where it sits on the left one.
  power:
    note: >-
      three figures, two measures, no conflict. The datasheet's Environmental block gives 'Typical
      power: 282.2 Watts (no transceiver)' - a typical, explicitly with the cages empty, which on
      a 104-port box is a large qualifier. The HIG's Connecting Power section gives a maximum
      twice, once per input type: 'The maximum system power consumption is 811 watts' in the DC
      section and '808 watts' in the AC section. Those are not two readings of one number - they
      are the same measure of two different builds, three watts apart, and 811 is recorded as
      power-max-w because it is the higher and the one a budget has to carry, with the AC figure
      named here. NEITHER MAXIMUM IS QUALIFIED - no ambient, no optics population, no traffic load
      - so power-envelope is 'unstated' rather than 'bare': the typical declares its scope and the
      maxima do not, and no single envelope word covers both. The suggested PDU fuse ratings (30 A
      DC, 15 A AC) and the 1300 W per-circuit reserve are provisioning instructions and PSU
      nameplates respectively, not draws, and are not recorded as any. Per-PSU rating lives on the
      ufispace/psu-132-crps-* contracts.
  attrs:
    confidence: datasheet
    note: >-
      datasheet (Physical / Environmental / Performance) and HIG (the Port Overview table for
      reach and speed, section 11 for the console settings, section 12 for the GNSS receiver's
      frequencies and antenna requirements, section 13 for compliance). THE DATASHEET'S REGULATORY
      COMPLIANCE BLOCK IS EMPTY IN THIS REVISION - the headings Safety, EMC and Environment are
      printed with nothing under any of them, confirmed by rendering page 2 at 600 dpi and
      looking, not only by extracting its text - so every compliance value here comes from HIG
      section 13 and is transcribed as printed. See the datasheet-compliance-empty gap.
  led-semantics:
    note: >-
      HIG section 10, pages 22-23, transcribed rather than only cited. The Front Panel LED table
      is the S9600-102XC's six-lamp table (SYNC, SYS, FAN, PS0, PS1, ID) with the same states, and
      the PSU FRU and Fan FRU tables belong to the modules and are transcribed in
      ufispace/psu-132-crps-ac, psu-132-crps-dc and ufispace/fan-808012. Not one row anywhere in
      this guide is annotated 'need NOS to activate', unlike the S9510-28DC's, so there is no
      evidence either way about NOS dependence.
  fru-components:
    note: >-
      reuses ufispace/fan-808012 and adds two new supplies, and the match is dimensional rather
      than nominal in both directions. FANS: this HIG's Component Physical Information table gives
      the fan an 81 x 138.80 x 81.5 mm envelope, so the face is 81.0 x 81.5, which is exactly
      ufispace/fan-808012's contract size; ufispace/fan-803816-hi carries the part number this
      datasheet orders (FAN-803816-HI) but a face of 80.0 x 81.5, taken from the S9600-28DX HIG's
      table for the same part number. Two UfiSpace guides therefore give the same ordering name
      two widths a millimetre apart - recorded as the fan-face-width gap - and the component that
      matches THIS device's own table is the one seated, with the part number carried in the
      configurations' component-attrs where a FRU model belongs. That is the same treatment, for
      the same split, as ufispace/s9600-102xc. SUPPLIES: none of the ten existing ufispace/psu-*
      contracts fits. The 1300 W parts in the library (psu-132-ac, psu-132-dc) are 50.5 x 40 faces
      from a 321 mm-long supply; the 73.5 x 40 faces in the library (psu-242-*) are 2400 W CRPS
      units with a C20 inlet. This chassis wants a 1300 W supply on a 73.5 x 40 CRPS face with a
      C14 inlet, so ufispace/psu-132-crps-ac and ufispace/psu-132-crps-dc were built for it.
  lifecycle:
    note: >-
      searched 2026-08-28, 'UfiSpace S9601-104BC end of life end of sale' - no announcement found;
      the product page is live and the unit is actively distributed (EPS Global lists it).
      none-announced is a real finding, not an omission.
  ground-stud-size:
    confidence: datasheet
    note: >-
      the hardware installation guide lists, in its package contents, a screw kit for the grounding
      lug of 2 x M4*L8.0mm screws, and its grounding steps lock the grounding lug to the designated
      grounding location with 2 M4 screws: the `stud-size` of ground-1, the upper of the two holes and
      the only one placed. The accessory lug is one two-hole lug held by both screws.

attrs:
  performance:
    switching-capacity: 2.4 Tbps
    packet-buffer: 4 GB
    reach-sfp28: 40 km max (HIG Port Overview, ports 0-95)
    reach-qsfp28: 80 km max (HIG Port Overview, ports 96/97/100/101)
    reach-qsfp56: 80 km max (HIG Port Overview, ports 98/99/102/103)
  power:
    power-typical-w: 282.2
    power-max-w: 811
    power-envelope: unstated
    psus: 2x 1300 W 1+1 redundant, hot-swappable (exhaust airflow)
    input-ac: 100-240 VAC, 12 A max per supply
    input-dc: -48 to -60 VDC, 37 A max per supply
    power-max-w-ac: 808 (HIG AC section; the DC build's 811 is the figure carried as
      power-max-w)
    pdu-fuse-suggested: 30 A DC, 15 A AC (HIG provisioning guidance, not a draw)
  thermal:
    fans: 4x hot-swappable 3+1 redundant, exhaust airflow; system front-to-back
  environmental:
    operating-temp: 0 to 50 C
    storage-temp: -40 to 70 C
    operating-humidity: 5% to 85% RH, non-condensing
    storage-humidity: 5% to 93% RH, non-condensing
    altitude: rated for operation up to 5000 m (HIG Connecting Power, both input
      types)
  platform:
    cpu: Intel Denverton 8-core @ 1.7 GHz
    memory: 32 GB DDR4
    storage: 128 GB SSD
    asic: Broadcom Qumran2c BCM88820
    lookup-engine: Broadcom OP2 BCM16K
    bmc: ASPEED AST2620
  features:
    timing: Stratum 3E OCXO, ITU-T SyncE, IEEE 1588v2 (G.8265.1 default, G.8275.1,
      G.8275.2, SMPTE ST 2059-2 with additional licence; T-GM, T-BC/OC, T-TC), Time
      Sensitive Networking, ITU-T G.8273.2 T-BC Class C accuracy, IEEE 802.1CM
    timing-interfaces: GNSS SMA in, 1PPS SMB in/out, 10MHz SMB in/out, ToD RJ45 in/out
    gnss: internal receiver for master clock implementations - GPS/QZSS L1 C/A,
      GLONASS L1OF, BeiDou B1, SBAS L1 C/A (WAAS, EGNOS, MSAS, GAGAN), Galileo E1B/C;
      minimum RF sensitivity -166 dBm, and the port supplies up to 5 V DC / 150 mA to
      an active antenna
    gnss-exclusivity: the platform supports either GNSS or SMA-10MHz input at a time;
      the 10MHz input is disabled when the GNSS antenna is connected (HIG section 12)
    timing-cables: 50 ohm SMA coax with 1/4-36UNS-2B for GNSS; 50 ohm SMB coax with
      10-32UNF-2A for 1PPS and 10MHz; shielded RJ45 for ToD, 3 m maximum
    routing: full Segment Routing over IPv6 (SRv6); programmable as a Broadband
      Network Gateway
    nos: NOS integration is necessary to activate the timing features
    optics-sfp28: 25G SFP28 SR, LR, ER; 10G SFP+ SR, LR, ER; 1G SFP SX, LX, EX
      (datasheet compatible transceiver types)
    optics-qsfp28: 100G QSFP28 SR4, LR4, ER4, ZR4 (datasheet compatible transceiver
      types)
    optics-qsfp56: 200G QSFP56 SR4, FR4 (datasheet compatible transceiver types; the
      QSFP56 cages also take the QSFP28 optics at 40/100G)
    optics-sfp-plus: 10G SFP+ SR, LR, ER (datasheet compatible transceiver types; the
      two 10G management ports take the same optics as the SFP28 cages do at 10G)
  management:
    console: RJ45 serial, 115200 8N1
    boot-time: approx 80 s from power-on under Ubuntu Linux; OOB Ethernet relinks in
      approx 40 s (HIG NEBS statements, both qualified as NOS-dependent)
  compliance:
    safety: IEC/EN 60825-1 laser Class 1 pluggables only (UL/CSA recognised modules);
      installation restricted to service personnel, indoors only
    emc: FCC Part 15 Subpart B Class A; CAN ICES-003 (A)/NMB-003(A); CISPR 32 Class A;
      VCCI Class A
    nebs: 'NEBS statements only, not a stated certification level: suitable for
      installation as part of the Common Bonding Network (CBN); installable in Network
      Telecommunications Facilities where the National Electric Code applies; DC input
      terminals are DC-I (isolated DC return) and the RTN terminal is to be isolated
      from the chassis or rack; the intra-building OOB Ethernet port is for unexposed
      intra-building wiring only (GR-1089 Type 2, 4 or 4a) and must not be metallically
      connected to OSP wiring for more than 6 m. An external Surge Protection Device
      must be used with AC powered equipment, installed at the AC service entrance.'
    installation: suitable for Information Technology Rooms per NEC Article 645 and
      NFPA 75
  lifecycle:
    eol: none-announced
