  rear:
    size:
      w: 440
      h: 87.7
    panel:
      decor:
        # The strip right of the supplies: the grounding pad, shipped covered with a
        # protective label, and the plain metal the PSU and FAN legends are printed on.
        - {at: [426.0, 27.0], size: [13.5, 16.0], fill: '#b0b5bb', rx: 0.6}
    silkscreen:
      - {text: PSU0, at: [433.7, 24.2], font-size: 2.0, anchor: middle, for: psu-0}
      - {text: PSU1, at: [433.7, 65.0], font-size: 2.0, anchor: middle, for: psu-1}
      - {text: '0123', at: [433.7, 48.0], font-size: 2.0, anchor: middle, for: [fan-0, fan-1, fan-2, fan-3]}
      - {text: FAN, at: [433.7, 51.8], font-size: 2.0, anchor: middle, for: [fan-0, fan-1, fan-2, fan-3]}
    components:
      bays:
        - {id: fan-0, at: [4.4, 3.1], size: {w: 81.0, h: 81.5}, accepts: [ufispace/fan-808012@1], group: fans, rel-pos: 0, default: ufispace/fan-808012@1}
        - {id: fan-1, at: [88.4, 3.1], size: {w: 81.0, h: 81.5}, accepts: [ufispace/fan-808012@1], group: fans, rel-pos: 1, default: ufispace/fan-808012@1}
        - {id: fan-2, at: [172.4, 3.1], size: {w: 81.0, h: 81.5}, accepts: [ufispace/fan-808012@1], group: fans, rel-pos: 2, default: ufispace/fan-808012@1}
        - {id: fan-3, at: [256.4, 3.1], size: {w: 81.0, h: 81.5}, accepts: [ufispace/fan-808012@1], group: fans, rel-pos: 3, default: ufispace/fan-808012@1}
        - {id: psu-0, at: [350.9, 2.8], size: {w: 73.5, h: 40.0}, accepts: [ufispace/psu-132-crps-dc@1, ufispace/psu-132-crps-ac@1], group: psus, rel-pos: 0, default: ufispace/psu-132-crps-dc@1}
        - {id: psu-1, at: [350.9, 46.2], size: {w: 73.5, h: 40.0}, accepts: [ufispace/psu-132-crps-dc@1, ufispace/psu-132-crps-ac@1], group: psus, rel-pos: 1, default: ufispace/psu-132-crps-dc@1}
      placements:
        - {ref: common/ground-symbol@1, id: ground-mark, at: [426.5, 31.7], group: grounding, rel-pos: 1,
           description: 'the earth symbol printed on the strip right of the supplies, at
             the height HIG Figure 4 draws it. HIG section 8 - the designated grounding
             location is at the rear of the case and ships covered with a protective
             label, and takes a #6 AWG lug on two M4 screws with four washers'}
        - {ref: common/ground-lug@1, id: ground-1, at: [433.0, 28.0], group: grounding, rel-pos: 2,
           description: 'the upper of the two tapped M4 holes of that rear grounding
             location. THE STUDS THEMSELVES STAND PROUD OF THE RIGHT-HAND CHASSIS EDGE in
             Figure 4 and are drawn inside it here, because the ear-fold body is 440 mm
             and anything beyond it is not metal this drawing carries', attrs: {stud-size: M4}}
