  left:
    size:
      w: 440
      h: 87.7
    panel:
      decor:
        # AXIS: x = 0 is the REAR on a left view. HIG section 5 - 'The chassis has 5
        # attachment pins on each side, for a total of 10 pins'; heights and pitch are
        # estimated because no figure in the intake shows a flank square-on.
        - {at: [70, 42], size: [5.0, 5.0], rx: 2.5, fill: '#1a1d20'}
        - {at: [148, 42], size: [5.0, 5.0], rx: 2.5, fill: '#1a1d20'}
        - {at: [226, 42], size: [5.0, 5.0], rx: 2.5, fill: '#1a1d20'}
        - {at: [304, 42], size: [5.0, 5.0], rx: 2.5, fill: '#1a1d20'}
        - {at: [382, 42], size: [5.0, 5.0], rx: 2.5, fill: '#1a1d20'}
    components:
      placements:
        - {ref: common/screw-head@1, id: screw-l1, at: [416, 42],
           description: 'HIG section 5 - the inner rail''s M4 locking screw, which the
             guide says must be positioned at the FRONT of the chassis. On a left view
             x = 0 is the rear, so the front is the far end of this face', group: furniture, rel-pos: 9}
  right:
    size:
      w: 440
      h: 87.7
    panel:
      decor:
        # AXIS: x = 0 is the FRONT on a right view - the mirror of the left face, so the
        # same five rail pins appear in the reversed order along the depth. The grounding
        # point is on the REAR of this chassis, not on a flank.
        - {at: [53, 42], size: [5.0, 5.0], rx: 2.5, fill: '#1a1d20'}
        - {at: [131, 42], size: [5.0, 5.0], rx: 2.5, fill: '#1a1d20'}
        - {at: [209, 42], size: [5.0, 5.0], rx: 2.5, fill: '#1a1d20'}
        - {at: [287, 42], size: [5.0, 5.0], rx: 2.5, fill: '#1a1d20'}
        - {at: [365, 42], size: [5.0, 5.0], rx: 2.5, fill: '#1a1d20'}
    components:
      placements:
        - {ref: common/screw-head@1, id: screw-r1, at: [19, 42],
           description: 'the same M4 inner-rail locking screw on the other flank. On a
             right view x = 0 is the FRONT, so it sits at the near end of this face -
             the mirror of screw-l1, not a copy of its coordinate', group: furniture, rel-pos: 10}
configurations:
  dc:
    kind: base
    power: dc
    description: Dual 1300W DC PSUs (PSU-132-DEGR-NN, exhaust airflow) with four
      FAN-803816-HI exhaust fans - the DC build, which is also the bare working chassis,
      since the traffic cages ship empty
    default: true
    component-attrs:
      psu-132-crps-dc:
        model: PSU-132-DEGR-NN
      fan-808012:
        model: FAN-803816-HI
  ac:
    kind: orderable
    power: ac
    description: Dual 1300W AC PSUs (PSU-132-AEAR-NN, exhaust airflow) with four
      FAN-803816-HI exhaust fans
    bays:
      psu-0: ufispace/psu-132-crps-ac@1
      psu-1: ufispace/psu-132-crps-ac@1
    component-attrs:
      psu-132-crps-ac:
        model: PSU-132-AEAR-NN
      fan-808012:
        model: FAN-803816-HI
