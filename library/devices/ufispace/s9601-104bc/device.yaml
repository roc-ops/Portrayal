  front:
    size:
      w: 440
      h: 87.7
    panel:
      decor:
        # Perforated fields. The top one is stopped on the left by the 1PPS jack and the
        # bottom one by the console bezel; that asymmetry is what Figure 8 draws.
        - {at: [65.5, 1.9], size: [370.5, 9.5], pattern: vent, vent: 30}
        - {at: [45.0, 77.9], size: [391.0, 4.9], pattern: vent, vent: 30}
