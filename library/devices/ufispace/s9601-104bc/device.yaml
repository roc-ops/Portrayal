           attrs: {role: oob, speed: 1g}, states: {led-a: ['off', {color: '#22c55e', name: link}], led-b: ['off', {behavior: blinking, color: '#22c55e', name: activity}]}, description: 'led-mgmt-l: the management jack''s left corner lamp, drawn lit green in HIG Figure 8 - which is also how the jack is known to be keyway-up, since a ganged RJ45 puts its lamps on the latch side. THE HIG TABLES NO MANAGEMENT-PORT LED for this platform, so the states here are the component default (led-a link, led-b activity, the green of Figure 8) and not a transcription; led-mgmt-r: the management jack''s right corner lamp; same absence of a vendor table as its left-hand twin, and the same component default'}
        - {ref: std/usb-a@1, id: usb, at: [26.2, 61.35], group: mgmt, rel-pos: 2, attrs: {role: maintenance, usb: '3.0'}}
        - {ref: std/rj45-ganged@2, id: console, at: [25.84, 68.83], group: mgmt, rel-pos: 3, attrs: {media: rj45-serial, role: console}}
        - {ref: common/led-dot@1, id: led-sync, at: [15.34, 62.32], for: chassis,
           states: ['off',
                   {name: locked, color: '#22c55e'},
                   {name: synce, color: '#22c55e', behavior: blinking},
                   {name: acquiring, color: '#f59e0b'},
                   {name: sync-fail, color: '#f59e0b', behavior: blinking}],
           description: 'HIG SYNC row - OFF (system timing synchronization disabled or in
             free-run mode), Solid Green (timing core synchronized to a PTP phase packet
             or an external timing source and frequency also locked), Blinking Green
             (synchronized with a PTP frequency-profile packet or an external SyncE
             source), Solid Amber (timing core acquiring or in holdover), Blinking Amber
             (synchronization fail, or acquiring/holdover timed out)',
           group: status-leds, rel-pos: 1}
        - {ref: common/led-dot@1, id: led-sys, at: [15.34, 64.84], for: chassis,
           states: ['off',
                   {name: boot-complete, color: '#22c55e'},
                   {name: boot-failed, color: '#f59e0b'}],
           description: 'HIG SYS row - OFF (no power), Solid Green (host CPU/BMC boot
             complete), Solid Amber (power is up but host CPU/BMC boot failed). Three
             rows only: this table has no blinking state for SYS',
           group: status-leds, rel-pos: 2}
        - {ref: common/led-dot@1, id: led-fan, at: [15.34, 67.36],
           for: [rear/fan-0, rear/fan-1, rear/fan-2, rear/fan-3],
           states: ['off',
                   {name: ok, color: '#22c55e'},
                   {name: fault, color: '#f59e0b', behavior: blinking}],
           description: 'HIG FAN row - OFF (fan modules are not initialized), Solid Green
             (all fan modules working normal), Blinking Amber (fan fail: one or more fans
             need service)', group: status-leds, rel-pos: 3}
        - {ref: common/led-dot@1, id: led-ps0, at: [15.34, 69.88], for: rear/psu-0,
           states: ['off',
                   {name: ok, color: '#22c55e'},
                   {name: fault, color: '#f59e0b', behavior: blinking}],
           description: 'HIG PS0 row - OFF (no power), Solid Green (PSU0 is working
             normal), Blinking Amber (PSU0 fail, PSU0 needs service). This platform gives
             each supply its own lamp rather than sharing one PWR lamp',
           group: status-leds, rel-pos: 4}
        - {ref: common/led-dot@1, id: led-ps1, at: [15.34, 72.40], for: rear/psu-1,
           states: ['off',
                   {name: ok, color: '#22c55e'},
                   {name: fault, color: '#f59e0b', behavior: blinking}],
           description: 'HIG PS1 row - OFF (no power), Solid Green (PSU1 is working
             normal), Blinking Amber (PSU1 fail, PSU1 needs service)',
           group: status-leds, rel-pos: 5}
        - {ref: common/led-dot@1, id: led-id, at: [15.34, 74.92], for: chassis,
           states: ['off',
                   {name: beacon, color: '#3b82f6', behavior: blinking}],
           description: 'HIG ID row - OFF (no power), Blinking Blue (beacon is enabled).
             Two rows, and the blue is the only colour this lamp is documented to show',
           group: status-leds, rel-pos: 6}
