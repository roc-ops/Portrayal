description: UfiSpace S9510-28DC Disaggregated Cell Site Gateway Router - 1RU, 2x QSFP-DD 400G
  + 2x QSFP28 100G + 24x SFP28 25G, full timing (GNSS/1PPS/ 10MHz/ToD/BITS), temperature hardened,
  front-service
provenance:
  part-numbers: >-
    CORRECTED TWICE, and the second correction reverses part of the first, so both
    are kept. This device listed `PSU-401-DISB-1` / `PSU-401-AISB` and
    `FAN-402825-HD` here - FRU part numbers in a field whose schema is "orderable
    SKUs for this CONFIGURATION: model -> {part, power-cord}", meaning the CHASSIS.
    They were a duplicate too: ufispace/psu-401-dc, psu-401-ac and fan-402825 each
    carry their own in `attrs.model`, which is where a FRU part number belongs.
    IT WAS NOT HARMLESS. A DCIM exporter reading the first key as the chassis model
    filed this router as a device type called FAN-402825-HD in both target
    libraries, and the S9510-28DC appeared in neither under its own name - see
    roc-ops/Portrayal#21. A field carrying the wrong KIND of value is worse than an empty
    one, because every consumer has to guess which kind it got.
    THE FIRST FIX SAID NO CHASSIS SKU EXISTS AND THAT WAS WRONG. It is a true
    statement about the HARDWARE INSTALLATION GUIDE - R1.9 names the product
    `S9510-28DC` in its title, its overview and its dimensions table and prints no
    orderable number anywhere - and a false one about the world. Two exist and the maintainer
    supplied them: `S9510-28DC-BN0B` for DC and `S9510-28DC-BR1B` for AC. Searching
    one document and concluding the fact does not exist is the same error the gaps
    register records against the XFP bezel opening, made again here.
    THE TWO DC CONFIGURATIONS SHARE A SKU because they are one chassis differently
    populated - `dc-populated` fits optics into the first four SFP28 cages and is
    not a different thing to order. AC is, and carries its own. That is exactly the
    distinction #21 collapses on, so the two DC entries should fold into one device
    type and the AC one should stand alone.
    SOURCE IS THE OWNER, NOT A DOCUMENT WE HOLD, and that is recorded rather than
    dressed up: no UfiSpace PDF held contains either string. If a
    UfiSpace ordering guide ever lands, it should confirm these two and may add the
    regional variants the Edgecore SKUs show for the same class of box.
    than merely coping.
  chassis: datasheet (440 x 302 x 43.5mm, 4.9kg without FRU)
  layout: drawing-inferred (HIG Fig 5/9 front drawing measured at 4.5 px/mm; pending photo overlay
    calibration - marketing photos are low resolution)
  sfp-pitch: drawing-inferred (~14.45mm ganged - std/sfp cutouts shoulder to shoulder; verify against
    physical unit)
  bits-tod-jacks: estimated (drawing shows compact stacked jacks ~11.5mm tall; modeled as two standard
    14mm cutout ports which slightly exceeds the drawn stack - verify against physical unit)
  timing-labels: 'drawing - BITS, the up-down pair and TOD are printed in the gutter to the
    LEFT of the stacked jacks and RIGHT-aligned against them, and the S9510-28DC wordmark
    ends on the same edge, one line below the lamp stack. Read off the datasheet front
    figure (1701px embedded image, the one legible source for this panel). Re-anchored to
    end at 130.8; left-anchored at 128.2, BITS and the wordmark ran under the jacks - which
    are themselves modelled ~5mm oversize, see bits-tod-jacks above'
  qsfpdd-port-numbers: 'PAID, by fixing the component rather than the labels. Ports 0-3
    keep their numbers at baselines 38.1 and 8.8, where the datasheet front figure puts
    them: the digit is printed on a coloured band just outside each aperture. The band
    is faceplate paint - vendor-confirmed - so it is now four rects in panel.decor and
    common/qsfp-cage@2 is 10.18 tall (0.6 flange + the 9.58 std/qsfp-ganged opening)
    instead of 13.0. Silkscreen paints over decor and under components, so the numbers
    now read. The cages for ports 0, 1 and 3 did not move. Port-2 is rotate: 180, so its
    at: is the box top and shortening the box does not free the digit; its at: was
    recomputed from the new height and lands at 8.8, which puts its aperture 0.08mm
    lower than the v1 model had it - 0.4 px at the figure''s 4.5 px/mm, and the figure
    is not self-consistent to better than that: it draws the port-2 digit sitting on the
    aperture edge rather than clear of it. The band is still NARROWER than the aperture
    (17.1 against 18.5); it is no longer drawn overlapping it'
  attrs: datasheet (Specifications/Performance/Accessories sections)
  led-semantics: 'HIG section 10, pages 20-21, transcribed rather than only cited - the citation was here and
    the tables were not, so nobody could interpret two of these lamps. Each front-panel lamp
    carries its own vocabulary: GNSS, SYNC and PWR each draw four distinct meanings out of two
    colours and two behaviours, which is why a state carries a behavior as well as a color. On
    PWR, Solid Green is "system power good" and Blinking Green is "power good but BMC power
    fail"; a model carrying only colour collapses them into one. The management jack is declared
    per element because its left lamp is green for 1G and its right amber for 10M/100M. The PSU
    FRU and Fan FRU tables belong to the modules and are transcribed in their own contracts. The
    HIG gives NO table for the port lamps, so the twenty-four led-arrow, four led-dot and two
    qsfp-lane-leds placements keep the component default of off/on rather than an invented
    link/activity vocabulary. Corrected after review: qsfp-lane-leds did NOT carry that
    default when this was written - it still declared off/link/activity, unsourced, and
    "link" had neither a colour nor a base stylesheet rule so it rendered identically to
    "off". Fixed in common/qsfp-lane-leds v1.2.0'
attrs:
  performance:
    switching-capacity: 800 Gbps
    packet-buffer: 2 GB
    port-modes-qsfp-dd: 100/400G, OpenZR+ and 400ZR
    port-modes-qsfp28: 40/100G
    port-modes-sfp28: 1/10/25G
  power:
    power-typical-w: '137'
    power-max-dc-w: '306'
    power-max-ac-w: '301.2'
    psus: 2x 400 W 1+1 redundant, hot-swappable (intake)
  environmental:
    operating-temp: -40 to 65 C (temperature hardened)
  thermal:
    fans: 4+1 redundant, hot-swappable (exhaust)
  platform:
    asic: Broadcom Qumran2a BCM88483
    cpu: Intel Denverton-NS 4-core @ 1.6 GHz (premium SKU 8-core @ 1.7 GHz)
    memory: 8 GB DDR4 (premium 16 GB)
    storage: 32 GB SSD (premium 128 GB)
    bmc: ASPEED AST2620
    software: ONIE (NOS required for timing/GNSS features)
  features:
    timing: Stratum 3E OCXO, SyncE, IEEE 1588v2 (T-GM, T-BC/OC, T-TC), Class C, TSN
    timing-interfaces: GNSS SMA in, 10MHz SMB in/out, 1PPS SMB in/out, ToD RJ45 in, BITS RJ48 in/out
    gnss: internal receiver for master clock
    flexe: OIF FlexE 1.1 and 2.0, 400G total bandwidth
    optics-qsfp-dd: 400G SR4/LR4/FR4/ZR4/OpenZR+
    optics-qsfp28: 100G SR4/LR4/ER4
    optics-sfp28: 25G SR/LR/ER, 10G SFP+ SR/LR/ER/ZR
chassis:
  width: 440
  height: 43.5
  depth: 302
  ru: 1
  weight-kg: 4.9
# What no rule can find, because the manifest looks complete. The port lamps
# carry the component default of off/on, which is indistinguishable from a
# genuine two-state lamp - the absence is invisible by construction, so it has
# to be asserted. Detectable gaps are derived from the lint rules at build time
# and must not be listed here.
gaps:
- what: fan-position-legends
  scope: [fan-1, fan-2, fan-3, fan-4, fan-5]
  reason: needs-drawing
  wanted: >-
    The FAN-1..FAN-5 legends were carried here as device silkscreen and are
    not: HIG Figure 8 - the same figure that corrected ufispace/fan-402825's
    art - shows that text printed on each module's own flange, not on the
    chassis behind it. Lint had reported all five as sitting inside their own
    bays, which was the symptom. Removed rather than nudged clear. The shared
    fan component cannot carry a per-position digit, so drawing them at all
    needs either a per-position skin or a component that takes its index from
    the bay.
- what: port-led-semantics
  scope: [sfp28, qsfp28, qsfpdd-400g, port-leds]
  reason: vendor-silent
  note: >-
    HIG section 10 (pages 20-21) tables the GNSS, SYNC, STAT, FAN and PWR system
    lamps, the PSU and Fan FRU lamps and the management jack, and gives no table
    at all for the port lamps. The twenty-four led-arrow, four led-dot and two
    qsfp-lane-leds placements therefore keep their component default of off/on
    rather than an invented link/activity vocabulary. Nine rows elsewhere in
    those same tables read "need NOS to activate this feature", so these may be
    NOS-defined rather than simply undocumented - which is a different fix, and
    the reason this is filed as vendor-silent rather than nos-dependent: we do
    not know which, and guessing would put an answer where the unknown belongs.
  wanted: >-
    a per-NOS LED table from UfiSpace or from a NOS vendor, or photographs of a
    live unit with the ports in known states (down, 1G/10G/25G link, traffic)
- what: fru-power-unpublished
  scope: [ufispace/fan-402825@1]
  reason: vendor-silent
  note: >-
    Searched and absent. The S9510-28DC hardware installation guide dimensions
    and weighs the fan FRU (51.5 x 57.8 x 42.2 mm) and tables its LED, and gives
    no power figure for it. The guide's only wattage is a provisioning
    instruction - "a reserve of at least 400 watts on each power circuit" -
    which is supply to be provided and not a fan's draw. The PSUs are sourced
    from their own model numbers (PSU-401); the fan has no equivalent.
  wanted: >-
    a photograph of the fan module's label, or a UfiSpace FRU datasheet
  blocks: []
groups:
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the chassis indicators, which report the unit rather than any one port
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: every indicator that belongs to a particular port, ordered by that port
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: '2x 400 W 1+1 redundant, hot-swappable (intake)'
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 400g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: the timing block at the centre of the faceplate - a GNSS antenna on SMA,
      10MHz and 1PPS on SMB, BITS on RJ48 and ToD on RJ45. Five media, one job.
      The author already drew it as `region:timing` with exactly these five
      members and had nowhere else to say it
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the management block at the right-hand end - the out-of-band RJ45, a
      USB-A service port and the RS-232 console. Same cluster, and the same word
      for it, as the seven other devices in the library that have one
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '4+1'
      redundancy-note: '4+1 - hot swappable fan modules with 4+1 redundancy support (UfiSpace datasheet, staged intake)'
