format: 1
kind: device
name: s9500-30xs
version: 2.0.6
maturity: modelled
manufacturer: UfiSpace
model: S9500-30XS
portfolio:
  line: Telecoms
  family: Disaggregated Cell Site Gateway Router
  series: S9500 Series
description: >-
  UfiSpace S9500-30XS disaggregated cell site gateway router - 1RU
  temperature-hardened white box for outside-plant cell-site backhaul, with 20x
  SFP+ 100M/1/10G, 8x SFP28 1/10/25G and 2x QSFP28 40/100G on a Broadcom
  Qumran-AX at 300 Gbps, a full timing block (GNSS, 1PPS and 10MHz on SMA, ToD
  on RJ45, BITS on RJ48, Stratum 3E OCXO, SyncE and 1588v2), front-serviced
  1+1 400W supplies at the left of the faceplate and five 4+1 hot-swap fans at
  the rear
provenance:
  sources: >-
    UfiSpace S9500-30XS datasheet
    for dimensions, weight, port inventory, platform, timing, power, environment,
    compliance and the FRU ordering lines; S9500-30XS Hardware Installation Guide
    (s9500-30xs-hig) for the faceplate and rear figures, the FRU dimension table, the LED
    tables and grounding; three vendor product renders (photos/s9500-30xs-1-angle,
    -2-front, -3-rear) for colour, counts and confirmation. Checked for a vendor 3D
    model before trusting any figure, per the skill: the intake stages GLBs for
    ReadyLinks only, and the S9500-30XS product page embeds no model-viewer and offers
    no .glb/.gltf/.usdz or CAD download - so this model rests on figures and the gates
    below apply in full.
  scale-gate: >-
    THE FRONT FIGURE FAILS A NAIVE ASPECT GATE AND IS STILL USABLE, and the reason is
    worth writing down because it decides every number on this face. The HIG's port
    overview (fig-0015) measures 1436 x 150 px body against a stated 440 x 43.5 mm
    chassis: aspect 9.57 against a true 10.115, 5.7% out. So does the front photograph,
    independently, at 9.49. Two images agreeing with each other and disagreeing with the
    spec table is not two bad drawings; it is both of them drawing something the spec
    table does not measure. What they draw is the chassis's top and bottom lips as well
    as its front face - the strip is taller than the faceplate.
    The axes were therefore calibrated separately, each against an object whose real
    size the vendor states, and each confirmed twice:
    X - the panel width 1436 px = 440 mm gives 3.2636 px/mm. On that scale the SFP
    column pitch measures 14.32 mm against the 14.25 mm std/sfp-ganged standard, and
    PSU1's metal face measures 50.8 mm against the HIG component table's 50.5. Neither
    of those numbers set the scale, and both land on it.
    Y - the PSU face is the only object on this face whose height the vendor states
    (40.2 mm). It measures 131 px, so 3.259 px/mm - within 0.1% of the X scale, which is
    what an orthographic drawing should be, and which the panel-height reading (3.448)
    is not. Vertical positions are therefore y = 1.6 + (py - 11) / 3.259, anchoring the
    PSU face's top edge at 1.6 mm; that puts its bottom edge at 41.8 in a 43.5 chassis,
    a symmetric 1.6/1.7 mm margin, which is the check that the anchor is right.
    Both scales are carried as `drawing` confidence and are good to about 0.3 mm.
  chassis: >-
    datasheet - 'Chassis (W x D x H) 1 RU, 440 x 302 x 43.5 mm', weight 4.76 kg without
    FRU; the HIG Component Physical Information table repeats the same triple and the
    same weight. 440 is the body and not a rack face: the HIG's accessory list ships
    'Rack Mount Bracket ... 50.4 x 43 x 20mm (19' width rack)' as two separate parts, so
    the mounting hardware is additional to 440 and is not drawn here.
  psus: >-
    drawing - the two supplies are on the FRONT of this chassis, at the left of the
    faceplate, which is what makes it a front-service telco box. PSU1's metal face
    measures x 64.96-115.70 (50.74 mm against the stated 50.5) and y 1.6-41.8 (40.2);
    PSU0 sits one pitch left at 6.22, so the bay pitch is 58.74 mm. That pitch was
    derived here from this figure alone and lands within 0.1% of the 58.7 the
    S9510-28DC carries - the same chassis, the same PSU-401, measured by somebody else
    from a different document - which is corroboration rather than a copied number.
    The blue release latch is drawn OUTSIDE the face to its left, in the gutter that
    carries the vertical PSU0/PSU1 legend; ufispace/psu-401-dc draws its latch inside
    its own 50.5 width, and that difference is the component's business, not the bay's.
  timing-block: >-
    drawing - five SMA jacks in two rows, read off HIG fig-0015 at 8x: 1PPS IN and OUT
    on the upper row at x 140.18 and 155.05, y 16.64; GNSS ANT, 10MHZ IN and 10MHZ OUT
    on the lower row at x 124.83, 139.60 and 155.05, y 31.98. The IN and OUT columns
    line up between the two rows, which is the check that the five centres are read
    right. The datasheet calls all five SMA ('1 x GNSS input SMA, 1 x 1PPS input/output
    SMA, 1 x 10MHz input/output SMA'). All five are ROUND: common/sma-jack was not used,
    even though it is the library's panel SMA part and the S9510-28DC uses it for the
    same job, because it draws a HEX nut and both the figure at 8x and the front
    photograph show a circular knurled ring here. Each jack is therefore std/sma - the
    6.35 mm registry bore, round - on a gold decor disc for the nut, the same
    construction the S9311-64D uses for its round SMB jacks. The disc sizes carry a real
    difference in the artwork rather than averaging it away: the figure draws the 1PPS
    pair 9.6 mm across the nut and the other three only 7.1, a 35% difference well above
    what this figure resolves.
    Then BITS over ToD in their own silver frame (RJ48 over RJ45, an 12.58 mm stack
    pitch), then the out-of-band RJ45, the USB-A and the console RJ45 in a third frame.
  connector-sizes: >-
    std/rj45-ganged (12.7 x 11.0) is used for all four RJ45/RJ48 jacks rather than
    std/rj45@2 (15.8 x 13.2), which the S9510-28DC used for the same block and
    recorded a gap about because it 'slightly exceeds the drawn stack'. The reason is
    measured, not stylistic: the BITS/ToD apertures are drawn 12.26 mm wide on a
    12.58 mm vertical pitch, and a 15.8 mm part cannot sit on that pitch at all. The same
    applies to the USB - the drawn aperture is 13.2 x 5.5, so std/usb-a (12.0 x 4.5)
    fits where common/usb-a@3 (17.0 x 9.3) does not.
  sfp-layout: >-
    drawing - fourteen columns of two, in two runs with ONE chassis web between them:
    eight columns then the web at x 319.6, then six more. Column centres are
    210.35 + 14.32k for k=0..7 and 328.47 + 14.32k for k=0..5, taken from the
    twenty-eight green port arrows in the band between the rows (28 blobs, one pair per
    column, pair centres regressing on a 14.32 mm pitch with no residual over 0.8 mm)
    and cross-checked against the bright column separators. Rows: std/sfp-ganged tops at
    8.83 and 26.48, each centred on the drawn module face (the figure draws SEATED
    modules, whose faces measure 8.9 and 9.2 mm tall inside a 10.4 mm cage opening -
    a module is smaller than its cage, which is why the face is not the aperture).
    Ports 0-19 are the SFP+ run and 20-27 the SFP28 run, per the datasheet's counts and
    the yellow band, which starts exactly at column 11's left edge.
  port-numbers: >-
    drawing - the numbers ARE printed on the panel, on a painted band just outside each
    aperture, and they are drawn here. HIG fig-0015 prints each port's number twice:
    large, on the schematic module face, where a seated module would cover it, and
    small, on the coloured band above the top row and below the bottom row. The band is
    faceplate paint - the S9510-28DC records that as vendor-confirmed for the same
    family - so the small number is the one the metal carries. Even numbers on the top
    row and odd on the bottom, left to right, 0-27 across the SFP columns and a separate
    0-1 for the two QSFP28.
  port-arrows: >-
    drawing, and the figure is not self-consistent about ONE detail of it. Every column
    carries two small green arrows in the white band between its two apertures - one per
    port, up for the upper and down for the lower, the same idiom as the S9510-28DC.
    What the figure disagrees with itself about is their spread and order: the six
    right-hand columns draw a tight up-then-down pair at +/-2.1 mm about the column
    centre, legibly in that order at 14x; the eight left-hand columns draw them at
    +/-4.9 mm and, as far as much fainter marks can be read, down-then-up. Both cannot
    be the same faceplate. The right-hand block is the legible one and agrees with the
    sibling, so up-left/down-right at the sibling's +/-2.95 mm is used throughout, and
    the disagreement is recorded here rather than split.
  led-semantics: >-
    HIG section 10 Front Panel LED table, transcribed rather than only cited. Five lamps
    - GNSS, SYNC, STAT, FAN, PWR - each with its own vocabulary, and three of them draw
    four distinct meanings out of two colours and two behaviours, which is why a state
    carries a behavior as well as a colour. The out-of-band jack is declared per element
    because its left lamp is green for 1G and its right amber for 10M/100M. The PSU FRU
    and Fan FRU tables belong to the modules and are already transcribed in their
    contracts. The guide gives NO table for the port lamps; see the port-led-semantics
    gap.
  rear-layout: >-
    drawing/photo - five fan bays across the left and a hex vent field filling the right.
    HIG fig-0014's rear elevation and the rear photograph are the same artwork at
    different scales and agree on the one number that anchors everything: fan 0's face
    starts at x 18.1 mm (18.0 from the figure at 3.182 px/mm, 18.2 from the photograph
    at 3.782 px/mm). The pitch is 52.6 mm, the mean of three repeated features measured
    in both images - the airflow tag, the status lamp and the thumbscrew - which
    individually give 52.25 to 53.43 because both images carry slight perspective (the
    handles' bounding boxes shrink measurably from left to right). The vent field runs
    from 285.8 to 435.2. NOTE THIS DISAGREES WITH THE S9510-28DC, which places the same
    five fans on the same chassis starting at x 8.0: both images here put the first fan
    ten millimetres further right, and the light chassis border they both draw between
    2.2 and 17.6 mm is where that model puts fan metal.
  fan-numbering: >-
    The rear panel numbers its fans 0-4, printed 'FAN <0' through 'FAN <4' at the top of
    each fan's right-hand flange in both the figure and the photograph. Those legends
    are NOT drawn, and the reason is structural rather than an oversight: a fan-position
    number cannot live on an interchangeable FRU, so it would have to be chassis
    silkscreen - and there is no chassis metal to carry it, because the 42.2 mm fan face
    fills all but 1.3 mm of the 43.5 mm rear panel. Drawn as chassis silkscreen it would
    be painted under the fan modules and invisible. The numbering itself is certain and
    is what the bay ids and rel-pos carry.
  top-face: >-
    drawing, and this is the one figure that passes the aspect gate outright. HIG
    fig-0011's footprint drawing measures 901 x 618 px against 440 x 302 mm - aspect
    1.458 against a true 1.457, 0.07% out - so it is orthographic and carries absolute
    geometry at 2.047 px/mm on both axes. y = 0 is the REAR, per the house convention
    and the drawing itself, which puts the fan handles at the top edge and the front
    bezel at the bottom. Two full-width stadium recesses at y 45.9 and 187.2, four short
    ones in two pairs at y 109.0 and 271.2, and two rows of lid screws at y 6.8 and 85.0
    on a 52.8 mm pitch that matches the fan pitch below them.
  side-faces: >-
    estimated. No held figure dimensions either side wall. The HIG's rack-mounting
    section fixes the chassis to the posts through the two 50.4 x 43 mm brackets and
    says nothing about side features, and the grounding section puts the lug on the
    RIGHT side wall (HIG Figures 19-22 and the fig-0011 inset, which magnifies a
    two-hole lug on the chassis's right rear corner). Both side faces therefore carry
    only the bracket screws and, on the right, the grounding lug - positions estimated,
    and LEFT has x = 0 at the REAR while RIGHT has x = 0 at the FRONT, stated here
    because both faces carry only symmetric content and nothing else would expose the
    convention.
  attrs: >-
    datasheet - Specifications, Performance, Environmental, Regulatory Compliance and
    Accessories sections, transcribed into sections. Compliance strings kept verbatim,
    semicolon-separated, untidied; the NEBS line in particular is kept as the datasheet
    prints it. The datasheet's own typo in the timing block ('IEEE 1558v2' in the key
    features list, IEEE 1588v2 in the specification table) is not reproduced.
  power: >-
    datasheet 'Typical power: 153.8 Watts (no transceiver)' - the vendor's own scope, so
    power-envelope is bare. No maximum is published for this platform in either held
    document: the HIG's Connecting Power section gives provisioning instructions and an
    input rating and never a system maximum, unlike the S9311-64D's, so power-max-w is
    absent rather than guessed. The PSU rating is 400 W per supply from the ordering
    lines. These are the vendor's figures as the vendor states them and are NOT
    reconciled against the module set; the fans publish no draw at all, so any total
    built from the modelled modules is a floor.
  lifecycle: >-
    searched 2026-08-28: 'UfiSpace S9500-30XS end of life', and the vendor's own product
    page fetched and read for a notice. No announcement found; the product page is live
    and carries active downloads. none-announced is a real finding, not an absence.
attrs:
  performance:
    switching-capacity: 300 Gbps
    packet-buffer: 3 GB deep buffer
  power:
    power-typical-w: '153.8'
    power-envelope: bare
    input-ac: 100 to 240 V, 6 A
    input-dc: -36 to -75 V, 16 A
    psu-redundancy: 1+1 hot-swappable
  thermal:
    fan-redundancy: 4+1 hot-swappable
    airflow: front-to-back (intake supplies, exhaust fans)
  environmental:
    operating-temp: -40 to 65 C (temperature hardened)
    operating-humidity: 5 to 85% RH non-condensing
    storage-temp: -40 to 70 C
    storage-humidity: 5 to 93% RH non-condensing
  platform:
    asic: Broadcom Qumran-AX BCM88470
    cpu: Intel Broadwell-DE 4-core @ 1.5 GHz
    memory: 8 GB DDR4 (premium SKU 16 GB, up to 32 GB)
    storage: 32 GB SSD (premium SKU 128 GB)
    bmc: ASPEED AST2400
  features:
    timing: >-
      Stratum 3E OCXO with optional holdover; SyncE (ITU-T); IEEE 1588v2 default,
      G.8265.1, G.8275.1, G.8275.2, SMPTE ST 2059-2 (additional licence), T-GM,
      T-BC/OC, T-TC. NOS integration is required to activate these, which the datasheet
      states with an asterisk against the whole timing block
    gnss: internal receiver for master clock implementations
    optics-qsfp28: 100G SR4/LR4/ER4
    optics-sfp28: 25G SR/LR/ER
    optics-sfp-plus: 10G SR/LR/ER/ZR; 1G SX/LX/EX/ZX
    macsec: MACsec on the backhaul uplinks, up to 120 km long-reach applications
    compliance-programme: OCP Accepted and TIP DCSG compliant
    timing-interfaces: GNSS SMA in; 1PPS SMA in/out; 10MHz SMA in/out; ToD RJ45 in; BITS RJ48 in
  management:
    console: RJ45 RS-232 plus a micro-USB serial console
    oob: 1x RJ45 100/1000M
  compliance:
    safety: UL 62368-1; IEC 60950-1; IEC 62368-1; BSMI
    emc: >-
      FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 55024;
      EN 55035; EN 62479; EN 50663; EN 300 386; EN 301 489; EN 303 413; BSMI; VCCI
      CISPR 32, Class A; Anatel
    nebs: NEBS GR-1089, GR-3108; NEBS GR-63; TP76200, GR-3108 Class 2 OSP (NEBS Level 3)
    environment: RoHS; WEEE
  lifecycle:
    eol: none-announced
chassis:
  width: 440
  height: 43.5
  depth: 302
  ru: 1
  color: '#3c3f42'
  weight-kg: 4.76
  airflow: front-to-back

gaps:
- what: port-led-semantics
  scope: [sfp-plus, sfp28, qsfp28, port-leds]
  reason: vendor-silent
  note: >-
    HIG section 10 tables the five front-panel lamps, the PSU and Fan FRU lamps and the
    out-of-band jack, and gives no table at all for the port lamps. The twenty-eight
    SFP arrows and the two QSFP28 lane strips therefore keep their components' off/on
    default rather than an invented link/activity vocabulary. Note that several rows
    elsewhere in those same tables are annotated as needing NOS integration to activate,
    so these may be NOS-defined rather than simply undocumented - which would be a
    different fix, and is why this is vendor-silent rather than nos-dependent.
  wanted: >-
    a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a live unit
    with ports in known states
- what: fan-402825-face
  scope: [ufispace/fan-402825@1, fans]
  reason: sources-disagree
  note: >-
    THIS IS A DEFECT IN A SHARED COMPONENT, NOT IN THIS DEVICE, and it is recorded here
    because this device is where the evidence turned up - specifically in the matched-
    scale comparison of the rendered rear against the rear photograph, which is the only
    check that could have found it. ufispace/fan-402825@1 places its status lamp at
    [2.0, 1.6] - top left of the face - and its own provenance cites 'HIG Fig 8 drawing'
    for the geometry. This device's HIG Figure 8 (fig-0014) and this device's rear
    photograph both put the lamp at the BOTTOM of the fan's right-hand flange, below a
    knurled thumbscrew and a red 'E' airflow tag that the component does not draw at
    all; the component also draws a plain round rotor where both images show a hex
    grille, and a straight handle bar where both show a curved tube. The two guides'
    Figure 8 is byte-for-byte the same image, so the component contradicts the figure it
    names. It was reused unchanged rather than forked or edited, because it is shared
    with the S9510-28DC and a correction would change that device's rendering on this
    device's reading.
  wanted: >-
    a decision on ufispace/fan-402825's element positions and face art, or a photograph
    of the FRU out of the chassis
- what: rear-fan-origin
  scope: [fans, rear]
  reason: sources-disagree
  note: >-
    The S9510-28DC - the same 440 x 302 x 43.5 chassis, the same five FAN-402825, the
    same rear artwork - places its first fan bay at x 8.0 with a 53.2 mm pitch. Measured
    here from that artwork and from this device's rear photograph independently, fan 0's
    face starts at 18.0 and 18.2 respectively, on a 52.6 mm pitch, and both images draw
    a plain chassis border across 2.2-17.6 where the sibling puts fan metal. The bank's
    total span agrees (265.5 against 266.0); only its origin does not. This manifest
    carries the measured 18.1, and the sibling's 8.0 is either a different anchor or an
    error that should be checked before either is trusted.
  wanted: a dimensioned rear drawing, or a tape on a real unit
- what: sfp-plus-blue-band
  scope: [sfp-plus]
  reason: vendor-silent
  note: >-
    The faceplate paints its first four SFP columns - ports 0 through 7 - in a blue band
    and the remaining six SFP+ columns in a plain dark one, while the datasheet lists all
    twenty as one thing, '20 x 100M/1/10G SFP+ ports'. Nothing in either document says
    what the blue marks. It could be a MACsec-capable subset, a 1G-capable subset, or
    housekeeping. The band is drawn because it is on the metal; no port carries an
    attribute derived from it.
  wanted: a UfiSpace port-capability matrix, or a NOS port map for this platform
- what: power-max-unpublished
  scope: [power]
  reason: vendor-silent
  note: >-
    Neither held document states a maximum system power for this platform. The datasheet
    gives 'Typical power: 153.8 Watts (no transceiver)' and the input ratings, and the
    HIG's Connecting Power section gives provisioning instructions without a figure -
    unlike the same vendor's S9311-64D guide, which prints a maximum twice. power-max-w
    is therefore absent rather than estimated, and a reader budgeting a circuit has only
    the 400 W per-supply rating and the typical figure to work from.
  wanted: a UfiSpace power calculator or a maximum-consumption line in a later guide
    revision
- what: chassis-sku
  scope: [base, dc, ac]
  reason: vendor-silent
  note: >-
    No held document prints an orderable chassis part number - the datasheet and the HIG
    name the product only as S9500-30XS, and the Available to Order block names only the
    two PSUs and one fan. The datasheet does say the platform has 'a standard SKU and a
    premium SKU', differing in memory and storage, without naming either. The
    S9510-28DC precedent applies: that model's -BN0B/-BR1B SKUs surfaced from the owner
    and from no held PDF, so orderable SKUs almost certainly exist. The configurations
    carry no part-numbers rather than invented ones.
  wanted: a UfiSpace ordering guide, or the standard/premium SKU strings
groups:
  psus:
    term: PSU
    role: service
    index-origin: 0
    description: >-
      the two front-serviced 400W supplies; the faceplate prints PSU0 and PSU1 in the
      gutter beside each bay, which is why this group is origin 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 hot-swappable'
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the timing block at the centre of the faceplate - a GNSS antenna, 1PPS in and out
      and 10MHz in and out on SMA, BITS on RJ48 and ToD on RJ45. Three media, seven
      jacks, one job: this is the block that makes the box a cell site gateway
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management block at the right of the timing block - the out-of-band RJ45, a
      USB 2.0 service port, the RS-232 console RJ45, the micro-USB serial console and
      the recessed reset button. Same cluster, and the same word for it, as the other
      UfiSpace boxes in the library
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      ports 0-19, the datasheet's '20 x 100M/1/10G SFP+ ports'. The first eight sit on a
      painted blue band whose meaning no document gives - see the sfp-plus-blue-band gap
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
    description: >-
      ports 20-27, the datasheet's '8 x 1/10/25G SFP28 ports', the four columns the
      faceplate paints yellow. The vendor numbers them 20-27 as a continuation of the
      SFP+ run rather than restarting, so the rel-pos values are 20-27; index-origin is
      0 because the schema allows only 0 or 1 there
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      the two 40/100G uplinks at the right-hand end, numbered 0 and 1 in their own run
      on a magenta band
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the five chassis indicators - GNSS, SYNC, STAT, FAN and PWR
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      every indicator that belongs to a particular port - one arrow per SFP port and a
      lane strip per QSFP28 - ordered by that port
  fans:
    term: Fan
    role: service
    index-origin: 0
    description: the five rear fans, which the rear panel numbers 0 to 4
    attrs:
      redundancy: '4+1'
      redundancy-note: '4+1 - 4+1 hot-swappable (attrs fan-redundancy)'
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
