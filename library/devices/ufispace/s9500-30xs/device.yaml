configurations:
  base:
    kind: base
    description: >-
      The router as every figure draws it - two PSU-401-DISB 400W DC supplies in the
      front bays, five FAN-402825-HD exhaust fans at the rear, and the thirty traffic
      ports empty. No orderable chassis part number appears in any held document; see
      the chassis-sku gap.
    default: true
  dc:
    kind: orderable
    description: >-
      Dual 400W DC supplies (PSU-401-DISB, screw-terminal input, intake airflow) with
      five FAN-402825-HD exhaust fans. The datasheet's DC input rating is -36 to -75 V
      at 16 A.
    component-attrs:
      psu-401-dc:
        model: PSU-401-DISB
      fan-402825:
        model: FAN-402825-HD
  ac:
    kind: orderable
    description: >-
      Dual 400W AC supplies (PSU-401-AISB, C14 inlet, intake airflow) with five
      FAN-402825-HD exhaust fans. The datasheet's AC input rating is 100 to 240 V at 6 A.
    bays:
      psu-0: ufispace/psu-401-ac@1
      psu-1: ufispace/psu-401-ac@1
    component-attrs:
      psu-401-ac:
        model: PSU-401-AISB
      fan-402825:
        model: FAN-402825-HD
