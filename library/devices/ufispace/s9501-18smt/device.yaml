  front:
    size:
      w: 440
      h: 43.5
    panel:
      decor:
        # The chassis metal between the two PSU bays; the PSU0/PSU1 legends are printed
        # on it and are silkscreen, not part of this rect.
        - {at: [56.0, 1.7], size: [8.2, 40.2], fill: '#1e2124', rx: 0.4}
