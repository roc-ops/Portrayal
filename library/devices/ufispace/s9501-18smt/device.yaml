        # The blue bands above and below the SFP+ housings. Vendor paint, not part of
        # the cage assembly, which is why they live here: silkscreen paints over decor
        # and under components, so the numerals printed on them stay readable.
        - {at: [364.9, 6.6], size: [30.6, 2.3], fill: '#1f7fc4', rx: 0.3}
        - {at: [364.9, 35.6], size: [30.6, 2.3], fill: '#1f7fc4', rx: 0.3}
