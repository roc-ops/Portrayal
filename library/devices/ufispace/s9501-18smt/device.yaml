        - {at: [138.1, 17.9], size: [5.0, 13.6], fill: '#f0f2f4', rx: 0.3}
        # Silver connector shells. These are PANEL, not part of any component: a
        # std/ port draws its opening and stops, and without the bright metal around
        # it a dark jack on a dark faceplate is simply invisible.
        - {at: [165.2, 13.9], size: [16.8, 21.3], fill: '#b0b5bb', rx: 0.8}
        - {at: [186.7, 9.6], size: [16.4, 25.6], fill: '#b0b5bb', rx: 0.8}
