configurations:
  dc:
    kind: base
    description: >-
      Dual-feed fixed DC supply, -36 to -72 V on the two three-post screw terminal blocks
      under INPUT0 and INPUT1, with four fixed 3+1 fans. THE ONLY BUILD: no AC variant
      appears in the datasheet, whose Power Specs row gives a DC input only, nor in the
      HIG, whose Connecting Power section has a DC Version subsection and no AC one
    default: true
