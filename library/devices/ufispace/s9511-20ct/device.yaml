format: 1
kind: device
name: s9511-20ct
version: 2.0.2
maturity: modelled
manufacturer: UfiSpace
model: S9511-20CT
portfolio:
  line: Telecoms
  family: Disaggregated Cell Site Gateway Router
  series: S9500 Series
description: >-
  UfiSpace S9511-20CT disaggregated cell site gateway router - 1RU temperature-hardened
  white box, 20 interfaces in three colour-coded blocks: four 1G RJ45/SFP combo ports in
  brown, eight 1/10G SFP+ in blue and eight 1/10/25G SFP28 in olive, behind a Broadcom
  Qumran2n at 100 Gbps with a Stratum 3E OCXO, an internal GNSS receiver and GNSS, 1PPS,
  10MHz, ToD and BITS timing interfaces. Both the dual-feed DC supply and the 3+1 fans are
  FIXED, so the chassis has no bays at all
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the rule, not an observation,
      so a photograph of the stack overturns it: the 10 SFP pairs (port-0-sfp/port-1-sfp to
      port-18/port-19). Its cage-mirroring note says a cavity-pitch test was run but records no
      figure or number, so it is not a reading and the rows take the rule; the question is open.
  sources:
    note: >-
      UfiSpace S9511-20CT datasheet for dimensions, weight, port inventory, platform, timing,
      power, environment and compliance; S9511-20CT Hardware Installation Guide (s9511-20ct-hig)
      for the Figure 8 Port Overview and Figure 7 rear elevations on page 10, the Component
      Physical Information table, the port table, the LED tables and grounding; three vendor
      product renders (photos/s9511-20ct-1-view, -2-front, -3-rear) for colour and confirmation.
      BOTH ELEVATIONS PASS THE ASPECT GATE AND THEY ARE THE BEST THIS VENDOR HAS GIVEN. The front
      measures 4048 x 402 px across the 440 x 43.5 mm face - aspect 10.07 against a true 10.115,
      0.45 percent - and the rear 3930 x 391, aspect 10.051, 0.6 percent. Both are therefore
      orthographic enough to carry geometry directly, in x AND in y, which is why this device's
      vertical band is taken from the guide rather than anchored to a photograph as the last three
      were. The photographs (520 px wide, 1.18 px/mm) are used for colour and counts only.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 'Chassis (W x D x H) 1RU, 440 x 250 x 43.5 mm', weight 4.2 kg; the HIG Component
      Physical Information table repeats the same triple (17.32" x 9.84" x 1.71") and the same
      weight, and heads its weight row simply 'Chassis' rather than 'Chassis without FRU' - which
      is correct here, because this device has no FRU of any kind. 440 is the body: the HIG ships
      a separate rack mount bracket as an accessory, so the 19 inch mounting hardware is
      additional to 440 and is not drawn.
  fixed-everything:
    note: >-
      NEITHER THE SUPPLY NOR THE FANS IS FIELD-REPLACEABLE, and that is the structural fact about
      this device. The datasheet's Redundancy rows read 'Dual-feed one power stage PSU' and
      'Fixed, 3+1 redundant Fans'; the HIG's PSU Overview section says 'Dual-feed one power stage
      fixed PSU' and its Fan Overview heading is '3+1 Redundant, fixed fans.' So there are no
      components.bays anywhere in this manifest. The two DC feeds are the six screw terminal posts
      on the front, drawn as panel decor under INPUT0 and INPUT1 silkscreen; the four fans are the
      four circular grilles on the rear, drawn as panel decor under FAN0-FAN3 silkscreen. Neither
      is addressable - see the fixed-fru-not-addressable gap - and the front FAN lamp therefore
      points at the chassis rather than at four fan ids. THAT IS TRUE OF THE DOCUMENTED BUILD, AND
      THE PHOTOGRAPH SHOWS ANOTHER ONE - see the ac-psu-variant gap, found by the matched-scale
      comparison and not by reading.
  front-vertical:
    note: >-
      ONE BAND, ONE PITCH - AND THE FIRST DRAFT SAID TWO. All four port blocks share the band:
      ganged shells at y 8.6-35.5, coloured grounds behind them at 7.0-37.4, openings centred on y
      14.15 and 29.89 for a 15.74 mm belly-to-belly pitch. That figure is the mean of two readings
      - the guide's drawn optical cell centres at 14.34/29.92 (pitch 15.58) and the front
      photograph's real apertures at 13.95/29.85 (pitch 15.90) - which agree to a third of a
      millimetre. THE COPPER BLOCK WAS THE TRAP. Its drawn cell centres read 15.60 and 29.06, a
      13.46 mm pitch, and this file first recorded that as a second, tighter pitch on the same
      band. It is not: an RJ45 cell is inset from its opening by different amounts top and bottom,
      so cell centres are not opening centres for that part. The matched-scale render settled it -
      at a 13.46 mm pitch the rendered contact bands fell at 13.6-21.1 and 23.2-30.8 against the
      photograph's 12.2-19.9 and 24.5-32.0, out by 1.4 and 1.3 mm in OPPOSITE directions, which is
      the signature of a pitch error rather than an offset. Putting the copper openings on the
      same 15.74 mm band as the optical ones reproduces the photograph to 0.25 mm. This is the
      same lesson as the guide's filled cells being module faces, in a second disguise: a drawn
      cell is not an aperture, and where the two are inset asymmetrically it will not even give
      you the pitch.
  port-pitch:
    confidence: measured
    note: >-
      MEASURED FROM THE WEB LAMPS, WHICH REPEAT ONCE PER PORT, and not from the filled cells the
      guide draws for module faces. Each optical column carries a green up/down lamp pair in the
      silver web between its rows; taking the pair centres gives 14.27 mm on the combo SFP block
      and 14.26/14.32/14.16 - mean 14.25 - across the SFP28 block, which is the SFF-8433 port
      pitch exactly. That was the check that mattered: cell-to-cell centres would have given the
      module pitch and drifted a gutter into every block. Column positions are then anchored on
      the ganged shells, whose extents were measured off the light mask (combo RJ45 243.91-274.46,
      combo SFP 278.37-308.15, SFP+ 310.11-370.98, SFP28 372.07-433.26) and which give a symmetric
      0.6-2.1 mm flange against four or two standard openings. NOTE the lamp pairs sit about 1.3
      mm LEFT of their column centres rather than on them, so the lamps fix the pitch and the
      shells fix the origin.
  combo-ports:
    note: >-
      Ports 0-3 are combo ports and are drawn as EIGHT apertures for FOUR logical ports. The HIG
      port table gives '0 ~ 3, SFP/RJ45 combo, 1G' and adds 'Ports 0 to 3 (labeled in brown) are
      SFP/RJ45 combo ports, configurable to support either connection type', and the faceplate
      shows both: a 2x2 RJ45 block numbered 0/2 over 1/3 and, immediately to its right inside the
      same brown frame, a 2x2 SFP block numbered the same way. They are modelled as two groups -
      combo-1g-rj45 and combo-1g-sfp - each carrying the vendor's numbers 0-3, rather than as one
      group with duplicated positions, so that both faces keep the number the vendor prints on
      them and neither pretends to be a separate port. Only one of each pair can be used at a
      time; the manifest cannot say that and the group descriptions do.
  colour-coding:
    note: >-
      THE VENDOR COLOUR-CODES THE THREE PORT GROUPS AND THE COLOURS ARE MODELLED. Each block sits
      on a printed ground that shows as a border around its silver ganged shell, sampled from the
      figure: brown/orange (206,130,45) for the combo ports - the HIG's own words are 'labeled in
      brown' - blue (51,133,175) for the SFP+ block and olive (187,183,60) for the SFP28 block.
      The port numerals are printed in the matching colour on each ground. This is the same
      faceplate idiom as the S9500-22XST's yellow SFP28 band and it carries the same meaning to
      whoever ordered the box, so it is drawn as panel decor under the shells rather than dropped
      as decoration.
  timing-block:
    confidence: drawing
    note: >-
      drawing - three coaxial jacks in one column at x centre 125.55, top to bottom 1PPS, 10MHz
      and GNSS ANT. The first two measure about 6.1 mm across the drawn hex against
      common/smb-jack's 7.0 and the datasheet calls them SMB; the third measures 9.57 mm against
      common/sma-jack's 9.5 and the datasheet calls it SMA - so the drawing and the spec table
      agree about which connector is which, which is worth saying because the three are drawn in
      one column and look alike at page scale. BITS (RJ48) and ToD (RJ45) are the stacked pair at
      x 145.43-160.22, BITS above and ToD below.
  jack-orientation:
    note: >-
      std/rj45-ganged draws the latch keyway DOWN with its gold contacts at the TOP, and on a real
      jack the integrated lamps sit at the contact end. On the 2x2 copper block the upper row's
      lamps are at the TOP corners and the lower row's at the BOTTOM, so the upper row is
      unrotated and the lower carries rotate: 180. BITS (upper of its pair) has the keyway up and
      is turned; ToD below it is not. The management RJ45 at the top of its stack is turned; the
      console at the bottom is not. That sense was got backwards on the S9500-22XST and caught by
      the matched-scale render; it is applied the corrected way round here and re-checked the same
      way.
  cage-mirroring:
    note: >-
      The render-against-photograph cavity-pitch test that the S9500-22XST and S9502-16SMT
      record (rotating a std/sfp-ganged moves its drawn cavity 1.13 mm, so a mirrored pair reads
      a cavity pitch 2.26 mm away from the opening pitch) was said to have been run here after
      rendering, but no figure, pitch or confidence was recorded, so it is not a reading. The
      stacked rows therefore follow the library's stack convention, the lower row rotate 180
      (docs/pluggables-3d-design.md, S4) - the rule, not an observation - and the question is
      open until the test is re-run and its numbers written down, or a photograph settles it.
  system-lamps:
    confidence: drawing
    note: >-
      drawing - five lamps at x 135.43 on a measured 2.545 mm pitch with centres at y 22.99,
      25.54, 28.03, 30.62 and 33.11, beside a printed legend block at 138.04-143.26. The HIG
      section 8 table names them GNSS, SYNC, STAT, FAN and PWR and gives each its own vocabulary,
      transcribed onto each lamp. THE COLUMN IS DRAWN 0.4 mm TALLER THAN IT MEASURES:
      common/led-rect@1 is 2.6 mm tall and four gaps of 2.545 will not hold five of them, so they
      are placed on a 2.62 mm pitch centred on the measured block. Same compromise, same reason,
      as the S9502-16SMT.
  rear-layout:
    confidence: drawing
    note: >-
      drawing - HIG Figure 7 at 8.932 px/mm, which passes the aspect gate at 0.6 percent. Four
      circular convection grilles over the four fixed fans, each about 38 mm across, with FAN0,
      FAN1 and FAN2 grouped at 75.7, 124.9 and 175.8 mm on a roughly 50 mm pitch and FAN3 alone at
      373.0 mm. That asymmetry is the drawing's, not a mis-measurement: the figure prints
      FAN0-FAN3 legends with arrows and the fourth sits by itself at the right-hand end, which is
      what a 3+1 layout looks like when the spare is not in line. Five screws along the lower edge
      on a roughly 100 mm pitch.
  views:
    note: >-
      Six views. TOP and BOTTOM carry only size and a compliance sticker: no held figure draws
      either face on this device - Figure 5's overview shows front and rear only - and inventing
      lid reliefs from a sibling would be borrowing geometry, so the top is left honestly empty
      and says so here. LEFT (x = 0 is the REAR) and RIGHT (x = 0 is the FRONT): the HIG section 6
      puts the grounding lug on the side of the chassis and its Figure 12 inset shows it on the
      RIGHT near the FRONT, which is where the two-hole lug is drawn - the one asymmetric feature
      on either side face, so the depth-axis convention is load-bearing here rather than merely
      stated. Screw positions on both side faces are estimated.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - Physical, Performance, Environmental, Regulatory Compliance, Timing and
      Accessories sections, transcribed into sections. DC ONLY: the datasheet's Power Specs row
      gives a DC input and no AC input, the HIG's Connecting Power section has a DC Version
      subsection and no AC one, and no AC PSU appears anywhere, so this device carries one
      configuration rather than the AC/DC pair its siblings have. The datasheet's key-features
      list prints 'IEEE 1558v2' where the timing row prints IEEE 1588v2; the obvious typo is not
      propagated.
  power:
    confidence: datasheet
    note: >-
      datasheet 'Typical power: 63 Watts (no transceiver)' - the vendor's own scope, so
      power-envelope is bare. No maximum is published in either document, and the per-feed input
      rating (-36 to -72 V, 8 A) is supply-side and is not converted into a draw figure. Note the
      input range is -36 to -72 V here where the S9500-22XST and S9502-16SMT both read -36 to -75;
      that is this datasheet's own number, not a transcription slip.
  lifecycle:
    note: >-
      searched 2026-08-28: 'UfiSpace S9511-20CT end of life end of sale' - no announcement found;
      the vendor product page and the datasheet PDF are live. none-announced is a real finding
      here, not an absence of looking.

attrs:
  performance:
    switching-capacity: 100 Gbps
    packet-buffer: 1 GB deep buffer
  power:
    power-typical-w: '63'
    power-envelope: bare
    input-dc: -36 to -72 V, 8 A per feed
    psu-redundancy: dual-feed one power stage, fixed (not field-replaceable)
  thermal:
    fan-redundancy: 3+1 fixed (not field-replaceable)
  environmental:
    operating-temp: -40 to 70 C (temperature hardened)
    operating-humidity: 5 to 95% RH non-condensing
    storage-temp: -40 to 70 C
    storage-humidity: 5 to 93% RH non-condensing
  platform:
    asic: Broadcom Qumran2n BCM88295
    cpu: Intel Denverton-NS 4-core @ 1.6 GHz
    memory: 8 GB DDR4
    storage: 32 GB eMMC
  features:
    timing: >-
      Stratum 3E OCXO with optional holdover; ITU-T SyncE; IEEE 1588v2 default, G.8265.1,
      G.8275.1, G.8275.2, SMPTE ST 2059-2 (extra licence), T-GM, T-BC/OC, T-TC; Class C
      accuracy. NOS integration is required to activate the timing features
    gnss: internal receiver for master clock implementations
    timing-interfaces: >-
      GNSS in on SMA, 10MHz in/out on SMB, 1PPS in/out on SMB, ToD in/out on RJ45, BITS in
      on RJ48 (datasheet Timing Interfaces)
    routing: full Segment Routing over IPv6 (SRv6)
    combo-ports: >-
      ports 0-3 are 1G RJ45/SFP combo, configurable to either connection type; the
      faceplate presents both an RJ45 and an SFP aperture for each (HIG Port Overview)
    optics-sfp28: 25G SR/LR/ER (datasheet compatible transceiver list)
    optics-sfp-plus: 10G SR/LR/ER/ZR
    optics-sfp: 1G SX/LX/EX/ZX
    timing-cables: >-
      50 ohm SMA coaxial with 1/4-36UNS-2B for GNSS; 50 ohm SMB coaxial with 10-32UNF-2A
      for 1PPS and 10MHz; shielded RJ45 for ToD; shielded RJ48 for BITS
  management:
    console: RJ45 RS-232 (labelled IOIOI)
    oob: 1x RJ45 100/1000M out-of-band management
  compliance:
    safety: UL 62368-1; IEC 60950-1; IEC 62368-1; BSMI
    emc: >-
      FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386;
      EN 301 489; EN 303 413; EN 55035; EN 50663; EN 62479; BSMI
  lifecycle:
    eol: none-announced
chassis:
  width: 440
  height: 43.5
  depth: 250
  ru: 1
  weight-kg: 4.2
gaps:
- what: port-led-semantics
  scope: [combo-1g-rj45, combo-1g-sfp, sfp-plus, sfp28, port-leds]
  reason: vendor-silent
  note: >-
    HIG section 8 tables the five system lamps (GNSS, SYNC, STAT, FAN, PWR) and the
    management jack, and gives no table at all for the port lamps. The Port Overview draws
    an up/down green pair in the web of every optical column, so which port each lamp
    belongs to is clear from the arrows; what its colours and behaviours mean is not. Every
    port lamp therefore keeps common/led-dot's off/on default rather than an invented
    link/activity vocabulary. Rows of the system-lamp tables are annotated 'need NOS to
    activate this feature', so these may be NOS-defined rather than merely undocumented - a
    different fix, and the reason this is vendor-silent rather than nos-dependent.
  wanted: >-
    a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a live unit with
    ports in known states
- what: ac-psu-variant
  scope: [dc, front]
  reason: needs-drawing
  note: >-
    THE FRONT PHOTOGRAPH IS NOT THE DOCUMENTED BUILD, and the matched-scale comparison is
    what found it. Both text sources describe one fixed supply - the datasheet's Redundancy
    row reads 'Dual-feed one power stage PSU' and the HIG's PSU Overview says 'Dual-feed
    one power stage fixed PSU' - and both HIG elevations draw two three-post screw terminal
    blocks under INPUT0 and INPUT1. The vendor's own front render instead shows, in the
    same 0-115 mm of faceplate, a REMOVABLE AC PSU: silver face, blue release latch, hex
    grille, black handle, green status lamp and a C14-family IEC inlet, in a bay with a
    vertical PSU legend beside it, and a second bay carrying a blank filler. Everything to
    the right of 115 mm is identical in both - the timing column, the lamp block, the
    stacked jacks and all three colour-coded port blocks with the same numbering - so this
    is the same product with a different power end, not a different product. The DC build
    is modelled because it is the one two documents describe and draw; the AC build is not,
    because no held source dimensions its bays, and guessing them from a 1.18 px/mm render
    would put invented bay geometry in the manifest.
  wanted: >-
    an AC-version front elevation or a PSU module drawing, which would also settle whether
    the AC supply is 1+1 removable where the DC one is fixed
- what: fixed-fru-not-addressable
  scope: [status-leds, furniture]
  reason: needs-hardware
  note: >-
    This chassis has no bays, so neither its two DC feeds nor its four fans is addressable.
    They are real, distinguishable things - the HIG's FAN lamp reports one or more fans
    failed, and the rear legends number them FAN0 to FAN3 - but a fixed part seats nothing,
    the terminal posts and the grilles are panel metal drawn as decor, and the library has
    no terminal-block or fan-grille component to place over them. The FAN and PWR lamps
    therefore point at the chassis. Recorded rather than papered over with groups nothing
    joins. This is the same shortfall the S9502-16SMT records for its fixed supply; that
    device needed a terminal block, this one needs a fan grille as well.
  wanted: >-
    a terminal-block or power-inlet component and a fixed-fan-grille component that a
    non-removable part can be placed as
- what: system-lamp-size
  scope: [status-leds]
  reason: needs-hardware
  note: >-
    The five system lamps sit on a measured 2.545 mm centre pitch and the library's nearest
    part, common/led-rect@1, is 2.6 mm tall - taller than the pitch allows, so five of them
    placed as measured would overlap by 0.055 mm each and L13 would rightly reject it. The
    column is stretched to a 2.62 mm pitch and is 0.4 mm taller than the vendor prints it.
  wanted: a ~4.6 x 2.4 mm indicator component, or a caliper on the lamp window
- what: lid-faces-undrawn
  scope: [top, bottom]
  reason: needs-drawing
  note: >-
    No held figure draws the top or bottom of this chassis - Figure 5's overview gives
    front and rear elevations only, unlike the S9500-22XST and S9502-16SMT guides which
    both include a dimensioned top view. Those two devices' stadium lid reliefs are
    therefore NOT borrowed here, because this lid does not have them: the angle render
    shows a plain sheet-metal lid with no reliefs at all, only small fasteners scattered
    near its two long edges. Six of those are drawn, three per edge, at ESTIMATED
    positions - the photograph is a three-quarter view and its perspective will not give
    coordinates, so what is carried is the fact that they exist and roughly where, not a
    measurement. The bottom face carries only the compliance sticker, also estimated.
  wanted: a top view in a revised HIG, or a photograph of the lid
- what: chassis-sku
  scope: [dc]
  reason: vendor-silent
  note: >-
    No held document prints an orderable chassis part number - the datasheet and the HIG
    name only S9511-20CT - and with a fixed supply and fixed fans there are no FRU ordering
    lines either, so this device has no part number of any kind in the intake. Per the
    S9510-28DC precedent, whose SKUs surfaced from the owner and from no PDF, an orderable
    SKU exists somewhere.
  wanted: a UfiSpace ordering guide or a quote naming the chassis SKU
groups:
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the timing block - GNSS on SMA, 1PPS and 10MHz on SMB, ToD on RJ45 and BITS on RJ48.
      Five media, one job, and the datasheet lists them together as Timing Interfaces
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster - the out-of-band RJ45, the USB 3.0 service port, the RS-232
      console and the recessed reset button
  combo-1g-rj45:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: rj45, speed: 1g}
    description: >-
      the copper face of the four 1G combo ports, vendor numbers 0-3. Each of these shares
      its port with the SFP aperture of the same number in combo-1g-sfp and only one of the
      two can be used at a time (HIG Port Overview)
  combo-1g-sfp:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp, speed: 1g}
    description: >-
      the optical face of the four 1G combo ports, vendor numbers 0-3, sharing each port
      with the RJ45 of the same number in combo-1g-rj45
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: the eight 1/10G SFP+ ports, vendor numbers 4-11, on the printed blue ground
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
    description: the eight 1/10/25G SFP28 ports, vendor numbers 12-19, on the printed olive ground
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the five chassis indicators - GNSS, SYNC, STAT, FAN and PWR
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: every indicator that belongs to a particular port, ordered by that port
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
