    components:
      placements:
        - {ref: common/reset-button@1, id: reset, at: [13.20, 7.40], for: chassis,
   group: mgmt, rel-pos: 1,
   description: 'recessed RESET pinhole; the drawn white ring measures 2.4 mm
     across and common/reset-button is 4.0, the nearest library part'}
        - {ref: ufispace/seg7-status-2-sm@1, id: status-display, at: [4.68, 16.05],
   for: chassis, group: display, rel-pos: 1,
   description: 'two-digit seven-segment readout; the drawn bezel measures
     13.55 x 8.57 and this contract is 12.8 x 6.8, the closer of the two
     library sizes. HIG Figure 4 draws it and its callout list does not name
     it, so what the digits show is not published'}
        - {ref: std/smb@1, id: pps, at: [6.68, 40.62], group: mgmt, rel-pos: 2,
   attrs: {role: timing, signal: 1pps},
   description: '1PPS input/output; the 7.6 mm yellow washer around it is
     drawn as decor because the registry sizes the connector, not the ring'}
        - {ref: std/smb@1, id: mhz, at: [6.52, 54.46], group: mgmt, rel-pos: 3,
   attrs: {role: timing, signal: 10mhz}}
        - {ref: common/led-dot@1, id: led-sync, at: [9.91, 62.96], for: chassis,
   states: ['off', {name: locked, color: '#22c55e'}, {name: freq-locked, color: '#22c55e', behavior: blinking}, {name: acquiring, color: '#f59e0b'}, {name: sync-fail, color: '#f59e0b', behavior: blinking}],
   description: 'HIG section 10 Front Panel LED table, SYNC row - Off (timing synchronization disabled or free-run), Solid Green (timing core synchronized to PTP packet phase or an external timing source, frequency also locked), Blinking Green (synchronized to PTP packet frequency or an external frequency source), Solid Amber (acquiring or holdover), Blinking Amber (synchronization fail, or acquiring/holdover time out)',
   group: status-leds, rel-pos: 1}
        - {ref: common/led-dot@1, id: led-sys, at: [9.91, 65.60], for: chassis,
   states: ['off', {name: ok, color: '#22c55e'}, {name: boot-failed, color: '#f59e0b'}],
   description: 'HIG section 10 Front Panel LED table, SYS row - Off (no power), Solid Green (host CPU/BMC boot complete), Solid Amber (power is up but host CPU/BMC boot failed)',
   group: status-leds, rel-pos: 2}
        - {ref: common/led-dot@1, id: led-fan, at: [9.91, 68.24], for: chassis,
   states: ['off', {name: ok, color: '#22c55e'}, {name: fault, color: '#f59e0b', behavior: blinking}],
   description: 'HIG section 10 Front Panel LED table, FAN row - Off (fan modules are not initialized), Solid Green (all fan modules working normally), Blinking Amber (fan failed, one or more fans need service)',
   group: status-leds, rel-pos: 3}
        - {ref: common/led-dot@1, id: led-ps0, at: [9.91, 70.71], for: rear/psu-0,
   states: ['off', {name: ok, color: '#22c55e'}, {name: fault, color: '#f59e0b', behavior: blinking}],
   description: 'HIG section 10 Front Panel LED table, PS0 row - Off (no power), Solid Green (PSU 0 working normally), Blinking Amber (PSU 0 fail, needs service)',
   group: status-leds, rel-pos: 4}
        - {ref: common/led-dot@1, id: led-ps1, at: [9.91, 73.18], for: rear/psu-1,
   states: ['off', {name: ok, color: '#22c55e'}, {name: fault, color: '#f59e0b', behavior: blinking}],
   description: 'HIG section 10 Front Panel LED table, PS1 row - Off (no power), Solid Green (PSU 1 working normally), Blinking Amber (PSU 1 fail, needs service)',
   group: status-leds, rel-pos: 5}
        - {ref: std/rj45-ganged@1, id: mgmt, at: [20.40, 47.00], group: mgmt, rel-pos: 4,
   attrs: {role: mgmt, speed: 100m-1g},
   description: 'the 100/1000M RJ45 OOB management port, top of the three-high
     ganged stack, under an Ethernet icon. Its two integrated lamps sit inside
     this aperture at (21.3, 48.9) and (32.1, 48.8) on the elevation and are not
     drawn separately; HIG section 10 tables them as Left LED (1G link and
     activity, green) and Right LED (10M/100M link and activity, amber). The
     ganged part is used rather than std/rj45 because the stack pitch is 11.4 mm
     and a moulded 14 mm bezel cannot sit on it'}
        - {ref: std/usb-a@1, id: usb, at: [20.75, 59.95], group: mgmt, rel-pos: 5,
   attrs: {role: maintenance},
   description: 'USB 3.0 Type-A maintenance port under the SS trident, mounted
     landscape in the middle of the ganged stack; HIG section 12 calls it a
     maintenance port and gives the i2c reset sequence for it'}
        - {ref: std/rj45-ganged@1, id: console, at: [20.40, 67.05], group: mgmt, rel-pos: 6,
   attrs: {media: rj45-serial, role: console}}
        - {ref: std/micro-usb@1, id: console-usb, at: [6.80, 77.00], group: mgmt, rel-pos: 7,
   attrs: {role: console},
   description: 'the micro-USB console port, labelled IOIOI like the RJ45 one;
     HIG section 11 says both carry that legend and either may be used, and that
     the micro-USB path needs a Silicon Labs CP210x driver'}
