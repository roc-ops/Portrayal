  width: 436
  height: 87.7
  depth: 762
  ru: 2
  color: '#373737'
  weight-kg: 25.8
gaps:
- what: port-led-semantics-unpublished
  scope: [port-leds]
  reason: vendor-silent
  note: >-
    none of the 60 port lamps has a documented meaning. The HIG's section 10 tables the
    five front-panel system lamps (SYNC, SYS, FAN, PS0, PS1), the PSU FRU Input and
    Output lamps, the fan FRU lamp and the RJ45 management jack's Left/Right pair, and
    stops. The 56 QSFP-DD lamps and the four above the SFP shell are drawn in every
    figure and named in none, so they carry positions and no states. Copying a state
    vocabulary across from a sibling SKU would assert this platform's behaviour from
    another platform's document.
  wanted: a NOS LED table, or a revision of the HIG with a per-port LED section.
- what: management-legend-triangles
  scope: [mgmt]
  reason: vendor-silent
  note: >-
    the legend row above the three-high console stack prints an Ethernet icon, a solid
    up-triangle, a solid down-triangle and the USB SuperSpeed trident. The icon and the
    trident are unambiguous. NOTHING IN THE GUIDE EXPLAINS THE TRIANGLE PAIR - Figure 4's
    callout list names the ports and not the printing, and section 10 tables no such
    indicator. They are drawn attached to the RJ45 OOB jack and the USB port on the
    reading that they are this vendor's stacked-pair up/down convention, the same one the
    SFP shell's own legends use two centimetres away; that reading is a judgement and is
    recorded here rather than left to look like something the guide says.
  wanted: a callout figure covering the printing rather than the ports, or a straight-on
    photograph of a real faceplate at high zoom.
- what: display-semantics
  scope: [ufispace/seg7-status-2-sm@1, display]
  reason: vendor-silent
  note: >-
    the two-digit seven-segment readout at x 4.30-17.85, y 15.17-23.74 is drawn in
    Figure 4, Figure 8 and Figure 9 and named in none of them. Figure 4's callout list
    runs Reset, 1PPS, 10MHz, System LED, Micro USB Console, RJ45 OOB, USB 3.0, RJ45
    Console, 2x 10G SFP+ Management, 2x 25G SFP28, the two QSFP-DD banks, Ground Lug,
    the PSUs and the fans - it does not reach the display - and section 10 tables the
    five front-panel lamps and nothing else. So what the digits show is unpublished.
    The part is placed rather than drawn as decor because it is a thing a person can
    point at and a readout a NOS can drive.
  wanted: a UfiSpace NOS or BMC reference naming the front-panel readout.
- what: unidentified-panel-openings
  scope: [furniture]
  reason: vendor-silent
  note: >-
    four unlabelled openings on the front - a 3.96 x 3.30 round one at (5.95, 70.2), two
    2.3 mm round ones at (431.55, 21.80) and (431.55, 71.70), and a 2.65 x 31.3 slot at
    x 432.69-435.34. No legend, no entry in Figure 4's callout list, nothing in the
    datasheet. The S9321-64E and the S9620-32E carry the identical arrangement and both
    of those models leave them unidentified too, so three models have now failed to name
    the same UfiSpace 2RU family feature. Drawn as dark decor and named here so the marks
    are recorded unknowns rather than unexplained ink.
  wanted: a hardware installation guide front-panel figure with callouts covering the
    bezel, or a photograph of the chassis end from an angle.
- what: fru-power-unpublished
  scope: [fans, psus]
  reason: vendor-silent
  note: >-
    neither FRU states a draw. ufispace/fan-808012's own contract records the search that
    established the vendor publishes no wattage for the 808012 family, and this device's
    documents add nothing: grepping the S9720-56ED datasheet and HIG for 'watt', 'W)' and
    'power consumption' returns the two PSU-302 ordering lines (3000W each), the 887 W
    typical and the four system maxima, and nothing per module. The supplies state
    power-output-w and correctly say nothing about their own draw. L29's standing warning
    is the live record that the chassis module total is a floor rather than a total.
  wanted: a UfiSpace FRU datasheet, or a photograph of the fan module's rating label.
- what: top-cover-scale
  scope: [top]
  reason: needs-drawing
  note: >-
    the only view of the cover is inside HIG Figure 4's three-view overview and its aspect
    is 8.7% from the stated 436 x 762, so it fails Gate 1 and carries no absolute scale.
    The six stiffening grooves, the two rear screws, the three mid screws and the six
    front-edge screws are placed from FRACTIONS taken along each axis against that axis's
    own known dimension, which survives an anisotropic scale but not a projective one.
    The count and the arrangement are the vendor's; the millimetres are a fraction of a
    figure known to be wrong about its own aspect.
  wanted: a top elevation with dimension lines.
- what: side-standoff-spacing-estimated
  scope: [left, right]
  reason: needs-drawing
  note: >-
    HIG section 5 states the count - 'The chassis has 5 attachment pins on each side, for
    a total of 10 pins' - and Figure 11 numbers them front to rear with the single M4 rail
    screw at the front. Neither dimensions them. The five pins per side are drawn evenly
    over the 762 mm depth at an estimated height up the wall; the count and the ordering
    are the vendor's and the pitch is mine. Nothing else appears on either side face in
    any held image.
  wanted: a dimensioned side elevation, or the rail-kit drawing.
- what: bottom-face-unseen
  scope: [bottom]
  reason: needs-photo
  note: >-
    the underside appears in none of the guide's 41 figures, neither product render, nor
    the isometric. The face is sized from the spec table and left deliberately blank, and
    this is what caps the device's drawn-face coverage.
  wanted: a photograph or drawing of the chassis underside.
- what: front-figures-carry-baked-in-annotation
  scope: [front]
  reason: needs-drawing
  note: >-
    neither front figure is a clean panel. Figure 8 lays translucent grey boxes with large
    numerals over every cage; Figure 9 paints a blue highlight over one cage row per band
    and a red dot-and-line overlay on every service column, and both are baked into the
    embedded raster rather than drawn as PDF vector over it. The consequence recorded here
    is specific: the SERVICE port label patches could not be colour-sampled anywhere,
    because a red dot sits on every one of them. Their fill is taken as the vendor blue the
    S9620-32E's unobstructed patches sample, and their GEOMETRY - which the overlay does
    not move - is taken from the fabric patches, which nothing covers.
  wanted: an unannotated front elevation, or a straight-on photograph of a real faceplate.
groups:
  qsfpdd-service:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 800g}
    description: the 36 service QSFP-DD cages, numbered 00-35 on blue label patches, in
      ten columns of two rows across the upper band and eight columns of two rows across
      the lower one; the even port of each column is the upper one. The vendor pairs them
      in the NOS - each pair runs as one 800G port or as two 400G ports - which is why the
      datasheet says '18 x 800G or 36 x 400G' for the same 36 cages
  qsfpdd-fabric:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 800g}
    description: the 20 fabric QSFP-DD cages, numbered 00-19 in their own namespace on
      magenta label patches, five columns of two rows in each band at the right-hand end.
      They cable to an S9705-48D or S9725-64E fabric router to build a DDC cluster and
      take AEC/DAC/ACC/AOC assemblies up to 300 m
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
    description: the two 1/10/25G SFP28 uplinks, numbered 36 and 37 on a yellow legend
      patch that continues the service range, in the right column of the 2 x 2 shell
  sfp-plus-mgmt:
    term: Port
    role: management
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: the two 10G SFP+ management uplinks in the left column of the same
      shell, numbered 0 and 1 in their own namespace under an Ethernet icon, which is
      what makes them management rather than the 36-37 traffic pair beside them
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: one lamp per cage - 56 on the QSFP-DD label patches and four above the
      SFP shell, two under each of its legends
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the five front-panel system lamps in a column beside their printed
      legend box - SYNC, SYS, FAN, PS0 and PS1, in the order HIG section 10 tables them
  display:
    term: Display
    role: indicator
    index-origin: 1
    description: the two-digit seven-segment readout under the model legend
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the management, console and timing cluster at the left-hand end - RESET, the
      1PPS and 10MHz SMB bulkheads, the RJ45 OOB jack, the USB 3.0 Type-A maintenance
      port and the RJ45 and micro-USB consoles
  psus:
    term: PSU
    role: service
    index-origin: 0
  fans:
    term: Fan
    role: service
    index-origin: 0
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
