configurations:
  ac:
    kind: base
    description: Dual 3000W AC PSUs (PSU-302-AESR) 1+1 hot-swap with IEC 60320 C20
      inlets, four FAN-808012-HCE fan modules 3+1, front-to-back airflow - the build
      HIG Figure 7's rear elevation and the vendor rear render both show. Maximum
      system power 2035 W with MSA optics and 2280 W with Open ZR+
    default: true
    airflow: front-to-back
  dc:
    kind: orderable
    description: Dual 3000W DC PSUs (PSU-302-DESR) 1+1 hot-swap with two-stud
      screw-terminal blocks under a plastic cover, four FAN-808012-HCE fan modules
      3+1, front-to-back airflow. Maximum system power 2088 W with MSA optics and
      2339 W with Open ZR+; each supply carries a 150 A fast-acting fuse
    airflow: front-to-back
    bays:
      psu-0: ufispace/psu-302-dc@1
      psu-1: ufispace/psu-302-dc@1
