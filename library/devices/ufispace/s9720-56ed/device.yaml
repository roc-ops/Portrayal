format: 1
kind: device
name: s9720-56ed
version: 0.1.0
maturity: modelled
manufacturer: UfiSpace
model: S9720-56ED
description: >-
  UfiSpace S9720-56ED - 2RU 800G disaggregated core and edge router with 56 QSFP-DD
  cages in two bands: 36 service ports numbered 00-35, configurable in pairs as 18 x
  800G or 36 x 100/200/400G with ZR/ZR+ support, and 20 x 800G fabric ports numbered
  00-19 that make the box a line-card element of a distributed disaggregated chassis
  scaling to 921.6 Tbps. Two 1/10/25G SFP28 uplinks (36-37) and two 10G SFP+
  management uplinks sit in one 2 x 2 shell beside the console cluster. Broadcom
  Jericho 3 BCM88860 at 14.4 Tbps with a 16 GB deep buffer, Intel Ice Lake-D 8-core at
  2.1 GHz with an AST2620 BMC, Stratum 3E OCXO with SyncE and 1588v2, 1+1 hot-swap
  3000 W AC or DC PSUs, 3+1 hot-swap fans, front-to-back airflow.
provenance:
  sources: >-
    two vendor documents and three vendor product renders. (1) the S9720-56ED
    datasheet, which carries the spec table, the ordering lines and the typical power;
    (2) the S9720-56ED Hardware Installation Guide, which carries the Component
    Physical Information table, the Port Overview table, the front-panel and FRU LED
    tables, the rack-mount pin count, the grounding section and the maximum system
    power with its test conditions - 41 kept figures across 35 pages; (3) the three
    photos staged as s9720-56ed-1-view / -2-front / -3-rear, which are the vendor's own
    520 x 150 renders of the same artwork the guide embeds, so they are NOT an
    independent second reading of the front and are used here only as a coarse check.
    Unlike the S9620 family this platform HAS a hardware installation guide, and almost
    every number below rests on it rather than on inference.
  extraction: >-
    docling recovered doc.md and 41 figures; the two that carry the front elevation
    (Figure 8, port overview, and Figure 9, the ZR/ZR+ overlay) are downsamples of the
    PDF's own embedded rasters, so `pdfimages -f 12 -l 12` was used to pull the
    originals at 1286 x 264 and 1345 x 290. BOTH FIGURES CARRY BAKED-IN ANNOTATION and
    neither is a clean panel: Figure 8 lays translucent grey boxes with large numerals
    over every cage, and Figure 9 paints a blue highlight over one cage row per band and
    a red dot-and-line overlay on every service column. That is why the SERVICE port
    label patches could not be colour-sampled where the red dots sit, and why the
    fabric patches - which no overlay touches - are the ones the patch geometry is
    measured from. Figure 9's raster is the base for the front because it draws the
    cages EMPTY; Figure 8 draws modules in them.
  front-gate1: >-
    measured - Figure 9's embedded raster (1345 x 290 px) puts the chassis body at
    x 13-1331, y 15-280: 1319 x 266 px for a stated 436 x 87.7 mm. Aspect 4.9586
    against a true 4.9715, 0.26% out, so it is orthographic and carries geometry at
    3.0252 px/mm across and 3.0331 down - one pixel is 0.331 mm across and 0.330 mm
    down, and every front number below is quantised to that. Figure 8's raster gives
    4.9685, 0.06% out, and corroborates the column positions to within 0.5 mm. Narrow
    stubs project past the body at x 5-12 and 1332-1339 for only 40 px of the 266 px
    height; they are rail furniture of the kind the S9321-64E and S9620-32E carry, not
    ears, and they are not drawn. 436 is the body: the HIG's Space Clearance paragraph
    says 'the S9720-56ED chassis width is 17.16 inches (43.6cm) and is shipped with an
    adjustable mounting rail kit suited for standard 19 inch (48.3cm) wide racks', so
    the 46 mm difference is the rail kit and there is no ear fold to subtract.
  chassis: >-
    datasheet and HIG agree exactly - 'S9720-56ED (W x D x H) 17.16' x 30' x 3.45'
    (436 x 762 x 87.7mm)', weight 25.8 kg without FRU. The HIG adds the scope the depth
    figure needs: 762 mm is 'without the field replaceable units (FRUs)', and 'the
    handle of fan FRU is 1 inch (2.5cm) and the handle of the PSU FRU is 1.5 inches
    (3.8cm)' project beyond it. Those projections are carried on the FRU contracts, not
    in this number. The face samples #373737 on the elevation and that is what
    chassis.color carries.
  port-count: >-
    HIG Port Overview table plus the elevation, and the two agree. The table gives
    '00 ~ 35 (Blue) QSFP-DD, 100/200/400/800G', '36 ~ 37 SFP28, 1/10/25G' and
    '00 ~ 19 (Red) QSFP-DD, 800G', with the sentence 'The ports labelled in blue
    function as service ports. The ports labelled in red function as fabric ports.'
    Counting cages on Figure 9 gives exactly that: 36 blue and 20 red QSFP-DD, which is
    the 56 in the model name, plus the two SFP28. The datasheet's '18 x
    100/200/400/800G or 36 x 100/200/400G QSFP-DD service ports' is the same 36 cages
    counted as pairs - HIG Figure 9: 'each blue-labeled port represents an 800G port,
    which can be individually reconfigured into two 400G ports'. THIRTY-SIX CAGES ARE
    MODELLED, not eighteen; the pairing is a configuration of the same metal and is
    recorded in the group description rather than drawn.
  port-grid: >-
    measured, and THE RULER IS THE CAGE APERTURE, which repeats once per port. Sub-pixel
    centroids of the dark apertures were taken in three different cage rows and agree to
    0.03 mm, so the scatter below is in the artwork and not in the reading. The ten
    SERVICE columns of the upper band sit at 34.03 + 26.819 j, and that straight line
    fits every measured centroid to within 0.32 mm (one pixel); the raw steps run
    27.02, 26.79, 27.02, 26.32 and repeat that quartet once more, which is a
    quarter-millimetre wobble in a 3 px/mm render and is NOT carried. The five FABRIC
    columns sit at 302.93 + 27.98 k with residuals under 0.1 mm. THE TWO BANKS ARE ON
    DIFFERENT PITCHES - 26.82 for service, 27.98 for fabric - and that is a real 1.16 mm
    difference, not noise: it is 3.5 px per step, it holds across four consecutive
    fabric steps and nine service steps, and it was checked in both rasters. The lower
    band's eight service columns land on the upper band's columns 2-9 to within 0.3 mm,
    which is what leaves room for the management cluster underneath columns 0-1.
    The drawn cage bezel measures 17.85 wide and 8.57 tall; std/qsfp-dd's registry
    19.0 x 10.0 opening is seated on the measured centre rather than resized, because
    the drawing under-draws every aperture on this face by about the same fraction.
    THE QSFP-DD CAGES CARRY NO BRIGHT SHARED SHELL and that negative has a control in the
    same image: the three-high console stack and the two SFP rows are wrapped in bright
    silver metal that resolves unmistakably at this scale and a few centimetres away, and
    nothing of that brightness appears anywhere in either QSFP-DD band - each cage has only
    its own thin light bezel line. So no ganged shell is drawn there, and the absence is a
    reading rather than the image's limit.
  port-rows: >-
    measured - four cage rows in two bands, each row's aperture 8.57 mm tall in the
    drawing. Aperture tops read 10.22, 23.08 (upper band) and 52.09, 66.93 (lower band),
    so the two rows of the UPPER band are 12.86 mm apart and the two of the LOWER band
    are 14.84. That difference is 6 px, it reads identically in the service and the
    fabric region of the same band, and the apertures themselves are the same height in
    all four rows - so the bands really are laid out differently and the wider gap is
    not a mis-read. The std/qsfp-dd apertures are placed centred on the measured row
    centres, giving tops 9.51, 22.37, 51.38 and 66.22. The rows are NOT mirrored: the
    label patch sits at the left of every cage in all four rows and the cage art is
    symmetric top to bottom, so no port carries rotate: 180.
  port-numbering: >-
    measured off Figure 9 at 22x, and it agrees with the HIG's Port Overview ranges.
    Each cage carries a narrow coloured label patch on its left - blue for service,
    magenta for fabric - printing the port numeral above a single lamp. The even numeral
    is always in the upper row of its band, so a service column j of the upper band is
    ports 2j and 2j+1 (0-19) and the lower band continues 20-35 across its eight
    columns; the fabric columns run 0-9 in the upper band and 10-19 in the lower. The
    fabric ports restart at 00 in their own namespace, which is why they are modelled as
    fabric-N rather than folded into the service range. The patch measures 3.3 x 9.9 and
    its right edge abuts the cage; its left edge is 13.1 mm inboard of the column centre.
  port-leds: >-
    measured - one lamp per port, on that port's own label patch, 5.7 mm below the patch
    top and centred in its 3.3 mm width. The lamp reads about 1.6 mm across in the
    render; drawn with common/led-dot (2.0 mm, the nearest library part, and a
    compromise recorded here rather than hidden). Four more lamps sit above the SFP
    shell, one per cage, at y 48.9. WHAT ANY OF THESE 60 LAMPS SHOWS IS NOT PUBLISHED -
    the HIG's section 10 tables the five front-panel system lamps, the PSU FRU lamps,
    the fan FRU lamp and the RJ45 management jack's pair, and nothing for the port
    lamps. They carry positions and no states; see gaps.
  sfp-block: >-
    measured - FOUR cages in a 2 x 2 arrangement, two columns wide and two rows high,
    in two silver ganged shells one per row. THE CONTROL FOR THAT NEGATIVE MATTERS AND IS
    IN THE SAME IMAGE: the metal between the two rows samples #373737, the panel's own
    colour, while the shell metal 2 mm above and below it samples the bright silver the
    shell is drawn in - so the bright metal resolves at this scale and its absence between
    the rows is a reading, not the image's limit. It is two shells, not one tall one.
    Aperture edges give
    a column pitch of 14.2 mm, which is std/sfp-ganged's own 14.25 to within a pixel, and
    a row pitch of 15.2. The LEFT column is the management pair and the RIGHT column the
    SFP28 pair, and the legends say so: a white legend '0 (up-triangle) (down-triangle) 1'
    under an Ethernet icon spans the left column, and a yellow legend patch printing
    '36 (up-triangle) (down-triangle) 37' spans the right one, with two lamps under each
    legend straddling its column. The triangles are the vendor's stacked-pair convention -
    up is the top cage, down is the bottom - which is the same construction the S9620-32E
    carries on its own SFP shell. So the top-left cage is management port 0, bottom-left
    is 1, top-right is SFP28 port 36 and bottom-right is 37.
  mgmt-cluster: >-
    measured, and named from the HIG's own Figure 4 callout list rather than guessed:
    Reset, 1PPS, 10MHz, System LED, Micro USB Console Ports, RJ45 OOB, USB 3.0, RJ45
    Console Ports, 2x 10G SFP+ Management, 2x 25G SFP28. Down the left end: a RESET
    pinhole with a 2.4 mm white ring centred (15.2, 9.4) under a printed RESET; the model
    name S9720-56ED across x 1.32-21.16 with a 4.95 mm cap height; a two-digit
    seven-segment display in a bezel measuring 13.55 x 8.57 at (4.30, 15.17); two yellow
    SMB bulkheads with 7.6 and 7.9 mm washers centred (9.09, 43.03) and (8.93, 56.87),
    each under its printed legend; a column of five green lamps at x 10.91 beside a white
    legend box at x 12.56-17.19, y 63.63-74.84; a micro-USB shell at x 6.6-14.5, y
    77.2-79.5 under IOIOI; and a single unlabelled round opening at (5.95, 70.2).
    Middle: a THREE-HIGH GANGED SILVER SHELL at x 18.5-35.0, y 46.3-78.2 holding, top to
    bottom, the RJ45 OOB management jack (aperture y 47.3-57.7, two integrated green
    lamps inside it), the USB 3.0 Type-A (aperture y 59.4-65.0, blue tongue) and the
    RJ45 console jack (aperture y 66.9-78.2). The apertures are 11.9 x 10.4 and 11.4
    tall on an 11.4 mm stack pitch, so std/rj45 (16.0 x 14.0, full moulded bezel) CANNOT
    sit here and std/rj45-ganged (12.7 x 11.0) is what the pitch allows; the bright metal
    around all three is the shell and is drawn as panel decor.
  mgmt-legend-row: >-
    measured at 22x, and one of the four marks is UNEXPLAINED. The row above the ganged
    stack prints, left to right at y 42.5-45.5: an Ethernet icon centred x 21.0, a solid
    up-triangle at 26.0, a solid down-triangle at 29.2, and the USB SuperSpeed trident
    SS at 34.5. The Ethernet icon and the SS mark are unambiguous and are attached to the
    OOB jack and the USB port. THE TRIANGLE PAIR IS NOT EXPLAINED ANYWHERE IN THE GUIDE:
    Figure 4's callout list names the ports and not the printing, and section 10 tables
    no such indicator. The reading carried here - that it is this vendor's stacked-pair
    up/down convention saying the Ethernet jack is the upper opening and the USB the one
    below, the same convention the SFP shell's own legends use two centimetres to the
    right - is a JUDGEMENT and is filed as a gap rather than asserted as the vendor's.
    The triangles are drawn as path marks; U+25B2 and U+25BC rasterise as empty boxes.
  vents: >-
    measured - three honeycomb bands across the face and one column down the left.
    The top band runs x 23.1-424.4, y 3.3-8.6; the central band x 76.7-426.7,
    y 33.3-50.1, narrowing to y 33.3-40.6 for x 23.1-76.7 where the SFP legends need the
    metal; the bottom band x 76.7-424, y 77.1-80.8, dropping to y 78.1-85.4 for
    x 41-76.7 and to y 83.7-85.4 further left where the IOIOI legends sit. A single hex
    column runs x 36.8-40.0 from y 43.5 to 85.4, between the console stack and the SFP
    shell, and a further left-hand band runs x 7.9-41.0 at y 82.5-85.4 under the two IOIOI
    legends. The bands are drawn CONTINUOUS; the real ones are interrupted by a 0.3-0.7 mm
    rib at each cage column, which is below what the renderer's hex cell can express and
    is recorded here rather than faked. The hex cell geometry is the renderer's, not the
    vendor's.
  unidentified-openings: >-
    UNIDENTIFIED, recorded not resolved. One round opening 3.96 x 3.30 centred (5.95,
    70.2) at the left, two 2.3 mm ones at (431.55, 21.80) and (431.55, 71.70) at the
    right, and a 2.65 x 31.3 dark slot at x 432.69-435.34. No legend, no callout in
    Figure 4's list, and nothing in the datasheet names them. The S9321-64E and the
    S9620-32E carry the same arrangement - one unlabelled circle at the left, two at the
    right and a narrow right-hand slot - and both of those models' provenance also leaves
    them unidentified, so this is a UfiSpace 2RU family feature that three models have now
    failed to name. Drawn as dark decor so the panel is not silently missing them.
  rear-gate1: >-
    measured - HIG Figure 7's rear elevation (the orthographic drawing above the fan
    isometrics, fig-0013) puts the body at 1203 x 243 px for 436 x 87.7 mm. Aspect 4.9506
    against a true 4.9715, 0.42% out, so 2.7592 px/mm across and 2.7708 down. The vendor
    rear render s9720-56ed-3-rear.png measures 506 x 102 px, aspect 4.961, 0.2% out, and
    is used as the second reading: its fan badge pitch of 85.0 and lamp pitch of 84.2
    bracket the elevation's 84.44 and no feature disagrees by more than a millimetre.
  rear-fans: >-
    measured, and the pitch is corroborated three ways on flat features. The red 'E'
    airflow badges step 84.44, 84.45, 84.44; the red release tabs 84.80, 84.09, 84.44;
    the red loop handles 84.81, 84.44, 84.09 - so the fan pitch is 84.44 mm. The module
    faces very nearly touch: the seam between fans 1 and 2 reads x 172.2-172.5 and the
    flange edges either side of it 171.8 and 173.0, which puts the drawn FLANGE at 83.2
    wide on an 84.44 pitch. THAT IS ufispace/fan-808012 and the identification is the
    HIG's own table, not a shape match: 'Fan (W x D x H) 3.19' x 6.09' x 3.21' (81 x
    154.8 x 81.5mm)' is that component's stated size to the tenth, and the datasheet's
    Fan Types line orders FAN-808012-HCE, which is that component's model exactly. The
    81 mm body is seated centred in the 83.2 mm flange, giving bay lefts 5.22, 89.66,
    174.10 and 258.54 and a face height of 81.5 starting at y 3.4 - which is what the
    elevation's own fan face reads (y 3.5 to 85.0). NOTE A 2 mm DISAGREEMENT recorded
    rather than averaged: laying fan-808012's own element offsets (badge 2.2/3.7, handle
    23.0/22.4, tab 0.5/30.6, measured by another agent off the S9321-64E HIG) over this
    elevation puts the module origin 1.9-2.7 mm right of where the flange seams put it,
    consistently for badge and handle alike. The seam fit is used because it is geometry
    on this device's own drawing; the element offsets are a different drawing's reading
    of a different chassis.
  rear-psus: >-
    measured - two supplies stacked at the right, faces x 360.0-428.0, tops 3.2 and 45.5,
    so 68 x 40.6 on a 42.3 mm pitch. That is ufispace/psu-302-ac / psu-302-dc exactly:
    the HIG's Component Physical Information table gives 'PSU (W x D x H) 2.67 x 17.66' x
    1.60' (68 x 448.7 x 40.6mm)' and its Figure 5 dimensions the AC face 68 x 40.6 with
    the C20 inlet named, both of which are those contracts' own stated numbers, and the
    datasheet orders PSU-302-AESR and PSU-302-DESR, their two model strings. The bay
    origin is fitted on the supplies' own Input and Output lamps, which are flat: the four
    lamps read x centre 366.4 against the contract's local 6.0, giving a module left of
    360.4, and the chassis strip's right edge reads 359.9 in the same drawing, so 360.0 is
    used. The elevation draws the AC build with C20 inlets, and Figures 6, 18 and 19 draw
    the DC build's two-stud terminal block; both are modelled and selected by configuration.
  rear-legends: >-
    measured - the chassis strip between the fans and the supplies (x 341-360) carries
    two round grounding-screw holes 4.5 and 4.4 mm across centred (350.0, 11.8) and
    (350.0, 27.3), an earth symbol at about (350.7, 50.7), then FAN with 0 1 2 3 beneath
    it at y 62.3 and 68.5. PSU0 and PSU1 are printed vertically at the far right edge,
    x about 431.5, spanning y 18.9-41.3 and 48.1-71.5. The vendor rear render shows a
    bright protective label over the grounding holes, which HIG section 8 describes -
    'The location for securing the grounding lug is at the rear of the case and is
    covered with a protective label' - and the elevation shows it removed; the elevation
    is what is drawn. The airflow badge, the status lamp and the model plate on each FRU
    belong to that FRU's own skin and are not repeated here.
  top: >-
    FRACTIONS ONLY, and the reason is stated because it changes what the numbers are
    worth. The only view of the cover is inside HIG Figure 4's three-view overview, where
    it measures 349 x 668 px for a stated 436 x 762 mm: aspect 0.5225 against a true
    0.5722, 8.7% out, so Gate 1 FAILS and no absolute scale may be taken from it. What
    survives an anisotropic scale is a fraction along each axis measured against that
    axis's own known dimension, and that is all that is used here. Six long recessed
    stiffening grooves run across the width with their outlines at y 148.3, 239.0, 330.2,
    420.4, 511.6 and 601.7 on a 90.68 mm pitch, each 17.7 deep and spanning x 15.0-421.0;
    two screws at (119.9, 42) and (316.7, 42); three at y 120.5, x 108.05, 218.0, 327.95;
    and six along the front edge at y 681, x 3.7, 17.5, 98.1, 214.3, 313.6 and 406.0.
    AXIS: y = 0 is the REAR - the fan handles project from the top of that figure - which
    is the convention the other UfiSpace top faces in this library use.
  sides: >-
    COUNT from the guide, SPACING estimated, and the two are different confidences. HIG
    section 5 step 2.1 states it outright: 'The chassis has 5 attachment pins on each
    side, for a total of 10 pins', and Figure 11 numbers them 1-5 running front to rear
    along the upper part of the side wall with a single M4 rail screw at the front
    ('Make sure the locking screw of the inner rail is positioned at the front of the
    chassis'). So the count, the ordering and the screw's end are the vendor's; the
    PITCH and the height up the wall are mine, laid out evenly over the 762 mm depth,
    and are estimated. AXIS CONVENTION, recorded because it is the error this class of
    face hides: on a RIGHT view x = 0 is the FRONT and on a LEFT view x = 0 is the REAR,
    so the left face's pins are placed at 762 - d - w and are not a copy of the right
    face's coordinates.
  bottom: >-
    deliberately size-only. The underside appears in no held image - not in the guide's
    41 figures, not in the isometric render, not in either product photograph - and the
    rail figures show the sides rather than the base. Sized from the spec table so the 3D
    box is right. AXIS NOTE: a bottom view mirrors left and right, not front and back;
    nothing asymmetric is drawn on it, so the convention is recorded rather than exercised.
  attrs: >-
    datasheet SPECIFICATIONS, ENVIRONMENTAL, PERFORMANCE, REGULATORY COMPLIANCE and
    ACCESSORIES blocks. The timing row's own footnotes are carried into the attr rather
    than dropped: '*NOS integration is necessary to activate the specific feature' and
    '**Additional license is required' qualify SMPTE ST 2059-2, and the difference
    between a profile the box supports and one an order has to license is exactly what a
    compliance-shaped field must not quietly lose. TWO SOURCES DIFFER ON THE SFP UPLINK
    PAIR and it is a scope difference rather than a conflict: the datasheet's Interfaces
    list says '2 x 10G SFP+ management ports' and the HIG's Port Overview table says
    '36 ~ 37 SFP28, 1/10/25G'. They are DIFFERENT PORTS - four cages sit in that shell,
    the left column carries the Ethernet icon and the numbers 0 and 1, the right column
    carries the yellow 36/37 legend - so both statements are true of their own pair and
    both are recorded.
  power: >-
    datasheet for the typical, HIG for the maxima, and the vendor states its own test
    conditions. Datasheet ENVIRONMENTAL: 'Typical power: 887 Watts (no transceiver)', and
    the scope is the vendor's own parenthesis. HIG section 9 gives FOUR maxima, two per
    input type: DC 'maximum system power consumption is 2088 watts under MSA standards.
    With Open ZR+ transceivers ... 2339 watts'; AC 2035 W under MSA and 2280 W with Open
    ZR+. The note beside them states the criteria - '45 C, Optics: full populated,
    Traffic: 100% load' - so these are fully-configured maxima and power-envelope says so.
    power-max-w carries 2339, the highest of the four, which is what max means; the other
    three are recorded beside it because the spread between them is 304 W and a budget
    built from the wrong one is wrong by that much. The feed figures 'AC input: 200 to
    240V, 16A' and 'DC input: -40 to -72V, 80A' are the INPUT to provision per supply and
    are recorded as input, not as draw. Nothing here adds the two 3000 W supply
    nameplates or the fan modules to any of these numbers.
  lifecycle: >-
    searched 2026-08-28, 'UfiSpace S9720-56ED end of life' - no announcement. UfiSpace
    lists the platform as current on both its Telecom Core/Edge and its AI Networking
    800G DDC product pages. none-announced is a checked state, not an absence.
attrs:
  physical:
    redundancy: 1+1 hot-swappable active-active PSUs and 3+1 hot-swappable fan modules
      (datasheet Redundancy row and HIG Installation Environment Requirements)
  performance:
    switching-capacity: 14.4 Tbps
    packet-buffer: 16 GB deep buffer
    cluster-capacity: up to 921.6 Tbps as a DDC cluster of S9720-56ED line-card elements
      with an S9705-48D or S9725-64E fabric
  power:
    power-typical-w: 887
    power-max-w: 2339
    power-envelope: fully-configured
    power-max-conditions: HIG section 9 - 2339 W is the DC build with Open ZR+ optics;
      the vendor's other three published maxima for the same chassis are DC 2088 W and
      AC 2035 W under MSA optics and AC 2280 W with Open ZR+. All four are measured at
      45 C ambient, fully populated optics and 100% traffic load
    input: AC 200 to 240V, 16A; DC -40 to -72V, 80A. At 110V AC each supply delivers only
      1500 W and hot-swap redundancy is lost, so 220V is required for 1+1 operation
  thermal:
    airflow: front-to-back; all FRUs are the exhaust build
  environmental:
    operating-temp: 0 to 45 C
    operating-humidity: 5% to 85% RH non-condensing
    storage-temp: -40 to 70 C
    storage-humidity: 5% to 93% RH non-condensing
  platform:
    asic: Broadcom Jericho 3 BCM88860
    cpu: Intel Ice Lake-D 8-core @ 2.1GHz
    memory: 64 GB DDR4 (up to 128 GB)
    storage: 2 x 256 GB M.2 SSD
    bmc: ASPEED AST2620
  features:
    optics-qsfp-dd: 800GE QSFP-DD OpenZR+/ZR/2xLR4/2xFR4/DR8+/DR8/SR8; 400GE QSFP-DD
      OpenZR+/ZR/ER4/LR4/FR4/SR8/DR4/DR4+/PLR4; 200GE QSFP56 SR4/FR4; 100GE QSFP28
      ZR4/ER4/SR4/LR4 (datasheet Compatible Transceiver Types). HIG Port Overview gives
      the reach as up to 500 km on the service ports
    fabric-cabling: the 20 fabric ports take 800GE QSFP-DD AEC, DAC, ACC and AOC cable
      assemblies (datasheet Compatible Fabric Cable Types); HIG Port Overview caps their
      link length at 300 m, which is why they are cabled rather than optical
    optics-sfp28: the HIG's Port Overview lists ports 36-37 as SFP28 1/10/25G with up to
      40 km reach; the datasheet's Compatible Transceiver Types block covers only the
      QSFP-DD field, so no module list is published for them and none is inferred
    optics-sfp-plus: the datasheet lists the management pair only as '2 x 10G SFP+
      management ports' and publishes no module list for them
    timing: Stratum 3E OCXO; SyncE; IEEE 1588v2 (Default, G.8265.1, G.8275.1, G.8275.2,
      SMPTE ST 2059-2), T-BC/OC, T-TC; timing synchronization over fabric. The datasheet
      footnotes the whole row 'NOS integration is necessary to activate the specific
      feature' and marks SMPTE ST 2059-2 'Additional license is required'
    forwarding: full Segment Routing over IPv6 (SRv6), flexibly configured fabric pipes
      for upstream connectivity, automatic fault detection and recovery, nonstop routing
      for control and data plane (datasheet KEY BENEFITS and KEY FEATURES)
  management:
    console: 1x RJ45 RS-232 and 1x micro-USB, both labelled IOIOI; 115200 8N1, no flow
      control. The micro-USB path needs a Silicon Labs CP210x driver
    oob: 1x 100/1000M RJ45 management port
    oob-sfp: 2x 10G SFP+ management uplinks, numbered 0 and 1 under an Ethernet icon,
      separate from the 36-37 SFP28 traffic ports beside them
    usb: 1x USB 3.0 Type-A maintenance port
    timing-inputs: 1x 1PPS input/output SMB and 1x 10MHz input/output SMB; the datasheet's
      Compatible Timing Cable Types names 'SMB coaxial cable with 10-32UNF-2A connector',
      and the HIG caps either cable at 3 m and the 1PPS coax at 50 ohms
  compliance:
    safety: UL 62368-1, IEC 62368-1
    emc: FCC Part 15 Subpart B Class A
    environment: WEEE
  lifecycle: {eol: none-announced}
