configurations:
  base:
    kind: base
    description: >-
      Five FAN-405636-HD exhaust fans and two PSU-751-DESR-1C 750 W DC supplies,
      front-to-back, with all fifty-four ports empty. WHICH SUPPLY SHIPS AS THE BASE IS
      NOT KNOWN: both are orderable and no held image shows either one seated, because
      UfiSpace publishes no rear view of this model. The DC unit is seated arbitrarily;
      see the base-configuration-supply gap. No orderable chassis part number appears in
      any held document.
    default: true
    airflow: front-to-back
    component-attrs:
      fan-405637:
        model: FAN-405636-HD
      psu-751-dc:
        model: PSU-751-DESR-1C
  dc:
    kind: orderable
    description: >-
      Dual 750 W DC supplies, PSU-751-DESR-1C, exhaust air flow (datasheet Available to
      Order). Input -40 to -75 V at 28 A per feed.
    airflow: front-to-back
    bays:
      psu-0: ufispace/psu-751-dc@1
      psu-1: ufispace/psu-751-dc@1
    component-attrs:
      psu-751-dc:
        model: PSU-751-DESR-1C
      fan-405637:
        model: FAN-405636-HD
  ac:
    kind: orderable
    description: >-
      Dual 750 W AC supplies, PSU-751-AESR-1C, exhaust air flow (datasheet Available to
      Order). Input 100 to 240 V at 10 A per feed. No held image shows this build; the
      face drawn is ufispace/psu-751-ac as built for the S9110-32X, which orders the same
      base part number at the same rating and the same 50.5 x 40.2 envelope.
    airflow: front-to-back
    bays:
      psu-0: ufispace/psu-751-ac@1
      psu-1: ufispace/psu-751-ac@1
    component-attrs:
      psu-751-ac:
        model: PSU-751-AESR-1C
      fan-405637:
        model: FAN-405636-HD
