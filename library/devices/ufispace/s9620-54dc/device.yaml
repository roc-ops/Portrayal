format: 1
kind: device
name: s9620-54dc
version: 3.0.5
maturity: modelled
manufacturer: UfiSpace
model: S9620-54DC
portfolio:
  line: Telecoms
  family: Open Aggregation Router
  series: S9600 Series
description: >-
  UfiSpace S9620-54DC 400G open aggregation router - a 1RU 440 x 480 mm white box
  on Broadcom Qumran3u BCM88400 at 1.2 Tbps with 4 GB of deep buffer, carrying 54
  ports on one face: forty 1/10/25G SFP28 and eight 1/10/25/50G SFP56 in twenty-four
  belly-to-belly ganged columns, then four 100G and two 400G QSFP-DD in three more.
  A timing block down the left edge takes a GNSS SMA, 1PPS and 10MHz SMB and a ToD
  RJ45 against a Stratum 3E OCXO with SyncE, 1588v2 and an internal GNSS receiver;
  the management RJ45, serial console and USB 3.0 the datasheet lists appear nowhere
  on this face. Five hot-swap fans (4+1) and dual 750 W supplies (1+1) at the rear,
  orderable AC or DC, front-to-back
profile: networking
provenance:
  sources: >-
    UfiSpace S9620-54DC datasheet
    for dimensions, weight, the port inventory, platform, power,
    environment, compliance and the FRU ordering lines; two vendor renders
    (photos/s9620-54dc-2-front, -1-angle) for everything else. THERE IS NO HARDWARE
    INSTALLATION GUIDE. UfiSpace has published none for the S9620 family, so this
    model has no faceplate figure, no callout list, no LED table, no FRU dimension
    table and no rear elevation - every one of which the S9610-36D and S7801-54XS
    models leaned on. What that costs is recorded feature by feature below and in
    the gaps register.
    THE DATASHEET SETS ITS SPEC TEXT AS OUTLINED GLYPHS: pdftotext returns 1471
    bytes of bullet characters and headings, and the docling doc.md is the same
    headings with no values, so a reader who trusted either would conclude the
    vendor published nothing. The figures were recovered by rendering both pages at
    200 and 1200 dpi with pdftocairo and reading them; every number in attrs comes
    off that render.
  gate-1: >-
    the front render PASSES and it is the only thing here that does. Body measures
    495 x 50 px (x 14-508, y 50-99) against the datasheet's 440 x 44 mm: aspect
    9.900 against a true 10.000, 1.0% out, so it is orthographic and reads at 1.1250
    px/mm across and 1.1364 down. It is also TINY. 520 x 150 px is the largest image
    UfiSpace serves - /image/5e/ and /image/5g/ were probed against every other size
    token on the product page and nothing above 650 px exists - so one pixel is
    0.89 mm and no legend on this faceplate is legible. The datasheet's own 'Front
    and Back Views' strip is the same raster at 158 px native and shows the FRONT
    only; there is no back view in it despite the caption. The angle render
    (650 x 278) is a 45-degree view and fails Gate 1 outright; it is used for
    construction, counts and colour, never for a dimension.
  chassis: >-
    datasheet - '1RU, 440.0 mm(W) x 480.0 mm(D) x 44 mm(H) or 17.32" x 18.89" x
    1.73"', 'Weight: 10.76 kg (without FRU)'. 440 is the body, not a rack face: it is
    17.32 inches, and the render draws two small bracket tabs standing outside the
    full-height body on each side (px 8-13 against a body of 14-508), which are the
    mounting hardware and are not drawn. No document states the ear extent or the
    handle projection, because there is no installation guide.
  front-layout: >-
    photo-measured at 1.125 / 1.136 px/mm, quoted to 0.1 mm because that is what the
    arithmetic gives and NOT because the image resolves it - one pixel is 0.89 mm, so
    every front coordinate here is good to about +/-0.5 mm and no better. Left to
    right: the timing block (GNSS SMA, two SMB jacks, a reset pinhole, the model
    legend, an unnamed round icon, the six-lamp status tile, and one RJ45 in a bright
    bezel with two small unidentified circles under it), then twenty-four ganged SFP
    columns in two twelve-column shells, then two 100G QSFP-DD columns and one 400G
    QSFP-DD column.
  sfp-layout: >-
    photo-measured, and THE PITCH WAS TAKEN FROM THE SHELL SEPARATORS, which repeat
    once per column, not from any filled module face. A local-maximum scan of the
    upper cage band finds 25 separators from x 41 to x 428 px at a uniform 16.125 px,
    which is 14.33 mm - the SFF-8433 ganged pitch of 14.25 to 0.6%, or 0.09 px per
    port. The standard pitch is therefore used and anchored at the measured left
    edge, and the check is what happens at the far end: twelve columns of 14.25 from
    24.0 mm reach 195.0 against a measured shell break at 234.5 px (195.1 mm), and
    twelve more from the measured 197.3 reach 368.3 against a measured last separator
    at 428 px (368.0 mm). Two independent 171 mm runs landing within 0.3 mm is what
    says the pitch is right. Row pitch is measured at 17 px = 15.0 mm, which is
    std/sfp-ganged's own 15.00 belly-to-belly figure, so the two rows are placed on
    it exactly. The drawn dark aperture is only 9 px (7.9 mm) tall against the
    standard's 10.4 - that is the render's black area inside a grey wall, not a
    smaller cage - so the standard height is used, centred on the measured aperture
    centres at y 15.0 and 29.9 mm.
  port-media: >-
    THE PRINTED COLOUR BAND UNDER THE PORTS IS WHAT ASSIGNS THE MEDIA, and it is the
    one thing on this faceplate that a 520 px image reads unambiguously. Sampling the
    band per column gives twenty yellow columns (RGB 104,104,53), four teal
    (39,94,92), then olive (64,79,48) under two QSFP-DD columns and steel blue
    (56,93,118) under the last. That is exactly the datasheet's inventory - 40 x
    1/10/25G SFP28, 8 x 1/10/25/50G SFP56, 4 x 100G QSFP-DD, 2 x 400G QSFP-DD - in
    the order the datasheet lists it, and it is what fixes which port is which.
  port-numbers: >-
    THE FACEPLATE PRINTS THEM AND THIS RENDER CANNOT READ THEM. The yellow, teal and
    blue bands each carry two dark glyph clusters per column at 1.8-2.0 mm cap height,
    which is two pixels; the olive band carries none at all, which is a reading and not a
    miss - see the qsfp-100g-unnumbered gap for the side-by-side that establishes it. So
    the NUMERALS
    DRAWN HERE ARE A RECONSTRUCTION, not a transcription: 0-53 left to right, even
    along the top row and odd along the bottom, which is the numbering every UfiSpace
    box in this library uses (S7801-54XS 0-53 on the same 48+6 shape, S9610-36D 0-35,
    S9510-28DC) and which the up/down lamp pair in each column corroborates. Whether
    UfiSpace numbers the 400G pair first on this SKU is not knowable from any held
    document; see the port-numbering gap. The olive band's four ports are left
    unlabelled because nothing is printed there to label them with.
  port-leds: >-
    photo-measured. Each SFP column carries ONE UP-TRIANGLE AND ONE DOWN-TRIANGLE on
    the silver inter-row strip - 48 green marks counted by colour, exactly two per
    column, at x offsets 5.8 and 9.3 mm from the column edge and y 22.0-23.8 mm. Up
    names the top-row port and down the bottom, the arrangement the S9510-28DC HIG
    figure documents and the S7801-54XS reuses. They sit 3.56 mm apart, so
    common/led-arrow (3.6 mm wide) COLLIDES and common/led-arrow-sm (2.25) is used
    instead: the right pitch in a smaller shape. Flanking each pair are two small dark
    squares, 1.8 mm, at offsets 2.7 and 12.0 mm - 48 of those as well. They are drawn
    as decor because nothing identifies them and a dark square is not a lamp shape;
    see the shell-dimples gap.
    The QSFP-DD lamps are arranged differently, as they are on every UfiSpace box:
    each 100G column carries four round lamps ABOVE it (green in the render, measured
    at x 375.1/379.1/383.1/387.1 and 393.8/397.8/401.8/405.8, a 4.0 mm pitch, in a
    strip that visibly interrupts the vent perforation) for its top-row port, and four
    BELOW it on the olive band for its bottom-row port. The 400G column has NO lamp
    row above it - the vent perforation runs unbroken across x 478-500 at the same
    rows - and two lamps below, at 418.2 and 426.2 mm. That asymmetry is measured, not
    assumed; what the lamps MEAN is nowhere stated, see the port-led-semantics gap.
  timing-block: >-
    photo-measured. Three round gold jacks across the top of the left block, isolated
    by colour: one 10.2 mm across centred at (12.9, 7.0) and two 8.0 mm at (29.3, 5.3)
    and (44.4, 5.3). The big one is the GNSS SMA - the datasheet's Timing Interfaces
    row lists exactly one SMA and two SMB, and an SMA nut is the larger - and the two
    small ones are the SMB pair. WHICH SMB IS WHICH IS NOT READ: a legend sits beside
    each jack and is four pixels tall. They are assigned 10MHz then 1PPS in the
    datasheet's own listing order, which is a convention and not a reading; see the
    smb-assignment gap. Construction follows the S9311-64D and S9610-36D: a gold decor
    disc for the knurled nut with the registry bore (std/sma, std/smb) on top, rather
    than common/smb-jack, which draws a hex nut this hardware does not have.
  rj45-and-unknowns: >-
    ONE RJ45 on this face, in a bright bezel measured at x 8.0-20.4, y 17.6-34.3 mm
    (12.4 wide x 16.7 tall) with a 9.8 x 13.2 mm opening. It is the ToD jack: the
    datasheet's Timing Interfaces row names a ToD input/output RJ45, it sits inside
    the timing block, and the three OTHER RJ45/USB connectors the datasheet lists are
    not on this face at all (see the rear-management-ports gap). No library RJ45 fits
    a 12.4 mm bezel - std/rj45 is 16.0 wide, common/rj45-shielded 15.8 - so
    std/rj45-ganged (12.7 x 11.0) is placed on the measured width and centre with the
    bright bezel drawn as panel decor behind it, per the rule that a std/ port draws
    the opening and the metal shell around it is panel. The jack's LATCH DIRECTION IS
    NOT READABLE at 1.1 px/mm; it is drawn in the component's own orientation and the
    question is recorded.
    Three small dark circles on the left block are drawn because the render puts them
    there and are NOT named: one 2.7 mm at (6.2, 14.5) above the jack, which reads as
    a recessed reset button and is placed as common/reset-button on that reading, and
    two more at (6.2, 37.4) and (16.9, 37.4) below it, drawn as decor. A 4.4 mm round
    icon at (72.4, 5.7) between the model legend and the lamp tile is likewise drawn
    and unnamed. With no guide there is no callout list to resolve any of them.
  status-lamps: >-
    photo-measured and DELIBERATELY UNLABELLED. A dark recessed tile at x 78.2-105.5,
    y 2.6-8.8 mm carries six lamps: four green on the top row at x 79.6, 86.2, 92.9,
    99.6 (y 4.4) and two on the bottom row (y 7.0), green at 79.6 and BLUE at 100.0.
    A printed legend sits beside each and is two pixels tall. The 4+2 shape with a
    blue lamp under the last of the four is the S7801-54XS's HIG-documented cluster
    exactly (SYS, FAN, PS0, PS1 with ID beneath PS1), and the extra green lamp is
    where a timing box's SYNC would go - but that is a pattern match, not a reading,
    so NO LEGEND IS PRINTED HERE and the lamps carry positional ids. The blue lamp
    keeps a blue beacon state because its colour is measured. See the
    status-lamp-legends gap.
  panel-decor: >-
    photo-measured. The perforated vent field above the ports runs x 108.4-433.8 at
    y 1.8-8.8 (it starts where the lamp tile ends, not at the chassis edge), and a
    second perforated row runs x 24.0-367.1 at y 40.5-43.1 - under the SFP block only,
    stopping where the QSFP shells begin, which is measured rather than tidied. The
    silver ganged-cage shells are drawn as decor behind the ports, per the S9510-28DC
    and S7801-54XS precedent: without them a dark cage on a dark faceplate is
    invisible. Band colours are the peak pixel of each band, not its mean, because the
    printed glyphs and lamps drag the mean down.
  rear-layout: >-
    ESTIMATED IN EVERY COORDINATE, and the inventory is the only sourced part. The
    datasheet gives 'Hot swappable, 1+1 redundant PSUs' and 'Hot swappable, 4+1
    redundant Fans' with front-to-back airflow and names the orderable parts
    (PSU-751-AESR-1C / PSU-751-DESR-1C at 750 W, FAN-405636-HD), so five fan bays and
    two supply bays at the rear is a fact. WHERE THEY SIT IS NOT: UfiSpace publishes
    no rear render for this model and no installation guide, so there is no image and
    no drawing of this face anywhere in the intake. The five fans are laid left to
    right on an even 52.0 mm pitch from x 12.0 and the two supplies at the right, which
    is the arrangement every 1RU box in this library has and is a GUESS about this one.
    Nothing is drawn that a photograph would be needed to place - no grounding pad, no
    position legends, no vent field - because inventing those would be worse than
    leaving the face plain. See the rear-geometry gap.
  views: >-
    Six views, all with drawn content, and four of them estimated throughout. TOP:
    y = 0 is the REAR, per the house convention. The angle render shows three long
    shallow stiffening ribs running ACROSS the width (they are parallel to the front
    edge in the image, not to the side edge) and a scatter of small fastener dimples;
    the count is read from the render and the positions are spread evenly, estimated.
    BOTTOM mirrors left-right and carries a compliance sticker at an estimated
    position - no image shows the underside. LEFT (x = 0 is the REAR) and RIGHT (x = 0
    is the FRONT) each carry three countersunk ear-mount screws in a column near the
    front and four rail features along the length, both visible in the angle render's
    left side face and neither dimensioned anywhere. Both side faces carry only
    symmetric content, so the depth-axis conventions are stated here rather than
    exposed by an asymmetric feature.
  attrs: >-
    datasheet - the Physical, Environmental, Performance and Regulatory Compliance
    tables and the Supported Accessories block, read off a 200 dpi page render because
    the text is outlined. Compliance strings kept verbatim and semicolon-separated.
  power: >-
    datasheet 'Typical power: 125 Watts (no transceiver)' - the vendor's own scope, so
    power-envelope is bare. NO MAXIMUM IS PUBLISHED. The S9610-36D's HIG states its
    maximum four times over; this platform has no HIG, so there is no max figure to
    carry and none is invented. Inputs are the datasheet's: 100-240 V 10 A AC,
    -40 to -75 V 28 A DC. Each supply is 750 W from its own ordering line
    ('PSU-751-AESR-1C, 750W AC'). The fans publish no draw at all, so the L27/L29
    warning stands and any total built from the modules is a floor.
  part-numbers: >-
    The datasheet's Available to Order block names PSU-751-AESR-1C and PSU-751-DESR-1C;
    the library's ufispace/psu-751-ac and -dc were drawn for the S9110-32X, which orders
    PSU-751-AESR and -DESR at the same 750 W on the same 50.5 x 40.2 face. The base
    configuration overrides the model attribute to this product's own -1C spelling. The
    fan is worse: this datasheet says FAN-405636-HD and the library's component is
    FAN-405637-HD from the S9110-32X, one digit apart in a number that encodes the
    rotor, so it is probably the same face and possibly not. It is reused with the
    model overridden and the disagreement filed rather than resolved. Neither part's
    face was re-measured here, because there is no guide to measure it against.
  vent-islands: >-
    derived - a vent field is a perforation and the drawing said so, but the marks
    printed inside one were floating on air (L64). The vendor interrupts the
    perforation where it prints, so each of those marks now has a solid patch under it
    in the chassis colour, drawn over the vent the way ufispace/s9600-72xc paints its
    port bands over one. The patch is the printing's own footprint plus 0.4 mm, which is
    what the S9610-36D's front render measures: its slots stop 0.4 mm outside each lamp
    cluster and resume 0.4 mm past it. Where a vent is simply measured wider than the
    metal it reaches, this states the metal that the printing proves is there without
    re-measuring the field.
  lifecycle: >-
    searched 2026-08-28: 'UfiSpace S9620-54DC end of life' - no announcement found. The
    vendor's aggregation-router product page and the datasheet (revision 20260811V01)
    are both live. none-announced is a real finding, not an absence.
attrs:
  performance:
    switching-capacity: 1.2 Tb/s
    deep-buffer: 4 GB
  power:
    power-typical-w: '125'
    power-envelope: bare
    input-ac: 100 to 240 V, 10 A
    input-dc: -40 to -75 V, 28 A
    psu-redundancy: 1+1 hot-swappable
  thermal:
    fan-redundancy: 4+1 hot-swappable
    airflow: front-to-back
  environmental:
    operating-temp: -40 to 65 C
    operating-humidity: 5 to 85% RH non-condensing
    storage-temp: -40 to 70 C
    storage-humidity: 5 to 93% RH non-condensing
  platform:
    asic: Broadcom Qumran3u BCM88400
    cpu: Intel Xeon D 4-core @ 2.4 GHz (Standard) or 8-core @ 1.9 GHz (Premium)
    memory: 2x 16 GB DDR4 SO-DIMM with ECC (Standard) or 2x 32 GB (Premium)
    storage: 1x 160 GB SSD (Standard) or 2x 160 GB SSD with VROC RAID (Premium)
    bmc: Aspeed AST2620
    oscillator: Stratum 3E OCXO
  features:
    optics-sfp28: >-
      25G SFP28 SR/LR/ER; 10G SFP+ SR/LR/ER; 1G SFP SX/LX (datasheet compatible
      transceiver list)
    transceivers-sfp56: >-
      50G SFP56 SR/LR/ER (datasheet compatible transceiver list). Recorded under this
      key rather than the house `optics-sfp56` because `sfp56` is not yet one of the
      pluggable-cage media tokens the L40 harvest recognises, and an `optics-` key that
      joins to no group is worse than one filed plainly
    optics-qsfp-dd: >-
      400G QSFP-DD OpenZR+/ZR/ER4/LR4/FR4/SR8/DR4/DR4+; 100G QSFP-DD ZR+/DR4/LR4;
      100G QSFP28 ZR4/ER4/LR4 (datasheet compatible transceiver list)
    coherent: >-
      the platform is optimised for 400ZR and OpenZR+ coherent optics for direct metro
      aggregation without external transponders (datasheet Key Benefits); which of the
      six QSFP-DD ports accept them is not stated
    macsec: hardware-based MACsec on all ports
    segment-routing: full Segment Routing over IPv6 (SRv6)
    tsn: Time Sensitive Networking for low packet loss and low delay variation
    gnss: internal GNSS receiver for master clock implementations
    timing-cable: >-
      50 ohm SMA coaxial with a 1/4-36UNS-2B connector for GNSS; 50 ohm SMB coaxial
      with a 10-32UNF-2A connector for 1PPS and 10MHz; shielded RJ45 for ToD
    timing: >-
      GNSS SMA, 1PPS and 10MHz SMB and a ToD RJ45, each input/output; SyncE and IEEE
      1588v2 with the Default, G.8265.1, G.8275.1 and G.8275.2 profiles, T-TC, T-BC/OC
      and T-GM, Class C accuracy
  management:
    console: RJ45 serial console (datasheet port list; not on the front face)
    oob: 1x RJ45 100/1000M (datasheet port list; not on the front face)
  compliance:
    safety: UL 62368-1; IEC 62368-1
    emc: >-
      FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386;
      EN 55035; EN 301 489; EN 303 413; VCCI CISPR 32, Class A
    environment: WEEE
  lifecycle:
    eol: none-announced
chassis:
  width: 440
  height: 44
  depth: 480
  ru: 1
  color: '#404244'
  weight-kg: 10.76
gaps:
- what: no-hardware-installation-guide
  scope: [front, rear, left, right, top, bottom]
  reason: vendor-silent
  note: >-
    UfiSpace has published no hardware installation guide for the S9620 family - the
    intake's own coverage sheet records the miss for all three S9620 models - so this
    device is modelled from a datasheet and two product renders and nothing else.
    Everything a guide normally supplies is therefore absent here: no faceplate figure
    with numbered callouts, so no callout audit was possible and any feature the render
    does not show is not merely unmodelled but unknown; no front-panel or FRU LED table,
    so no lamp on this device carries a state vocabulary; no component dimension table,
    so the fan and PSU faces are the library's from a sibling platform; no rear
    elevation; no rail or grounding section. This is the single largest limitation on
    the model and every other gap here descends from it.
  wanted: the S9620-54DC Hardware Installation Guide, when UfiSpace publishes it
- what: front-render-resolution
  scope: [front]
  reason: needs-photo
  note: >-
    The largest front image UfiSpace serves is 520 x 150 px, which is 1.125 px/mm and
    0.89 mm per pixel. Every size token on the product page was probed (/image/5e/,
    /image/5g/ and eighteen others) and nothing larger exists; the datasheet's own copy
    of the same picture is 158 px native. The render passes Gate 1 on aspect (9.900
    against 10.000) so its PROPORTIONS are trustworthy and the standard pitches confirm
    them across 24 columns to 0.3 mm - but no printed legend on this faceplate is
    legible, no connector keyway is readable, and every coordinate quoted here to a
    tenth is really good to about half a millimetre.
  wanted: a straight-on photograph of a real S9620-54DC faceplate at 2000 px or better
- what: rear-management-ports
  scope: [timing, front, rear]
  reason: needs-photo
  note: >-
    The datasheet lists a 100/1000M RJ-45 management port, an RJ45 serial console port
    and a USB 3.0 Type-A port. NONE OF THE THREE IS ON THE FRONT FACE - the front render
    shows exactly one RJ45, inside the timing block, and no USB opening anywhere, and
    the whole left block is only 24 mm wide. They are therefore on the rear, which
    UfiSpace publishes no image of. So three documented ports exist on this device and
    are modelled nowhere, and the mgmt group is not declared at all rather than being
    declared empty.
  wanted: a rear photograph or the hardware installation guide
- what: rear-geometry
  scope: [rear, fans, psus]
  reason: needs-photo
  note: >-
    No rear image of this model exists - the vendor publishes a front and a 45-degree
    front angle and nothing else, and there is no installation guide. The inventory is
    sourced (five hot-swap fans in a 4+1 set, two hot-swap 750 W supplies in a 1+1 set,
    all exhaust, front-to-back) but EVERY REAR COORDINATE IN THIS FILE IS INVENTED: the
    52.0 mm fan pitch, the x 12.0 start, the supplies at the right, the vertical
    centring. They are laid out the way the library's other UfiSpace 1RU boxes are laid
    out, which is a plausible arrangement and not this chassis's. Nothing else is drawn
    on that face for the same reason.
  wanted: a rear photograph of an S9620-54DC, or the hardware installation guide
- what: status-lamp-legends
  scope: [status-leds]
  reason: needs-photo
  note: >-
    The tile at x 78.2-105.5 carries six lamps - four green across the top, one green
    and one blue below - and a printed legend beside each. At 1.125 px/mm those legends
    are two pixels tall and cannot be read, so NO legend is printed in this drawing and
    the lamps carry positional ids. The arrangement is the S7801-54XS's exactly (four
    lamps with a blue ID lamp beneath the fourth), whose HIG names them SYS, FAN, PS0,
    PS1 and ID, and the extra green lamp under the first is where a timing platform's
    SYNC lamp sits on the S9610-36D. That reading is recorded here so the next reader
    has it; it is not written into the artwork, and no lamp carries a state vocabulary
    because no LED table exists for this platform.
  wanted: the S9620-54DC HIG's front-panel LED table, or a legible faceplate photograph
- what: port-numbering
  scope: [sfp28, sfp56, qsfpdd-100g, qsfpdd-400g]
  reason: needs-photo
  note: >-
    The faceplate prints port numerals on the yellow, teal and blue bands - two glyph
    clusters per column are visible - and this render cannot resolve a single digit.
    The numerals drawn are reconstructed as 0-53 left to right, even on the top row and
    odd on the bottom, which is what every UfiSpace box in this library does and what
    the per-column up/down lamp pair implies. Two things are genuinely open: whether
    UfiSpace numbers the 400G pair first on this SKU rather than last, and whether the
    run starts at 0 or 1. The olive band under the four 100G ports carries no printing
    at all, so those four are drawn unlabelled.
  wanted: a legible faceplate photograph, or the HIG's port map
- what: qsfp-100g-unnumbered
  scope: [qsfpdd-100g]
  reason: vendor-silent
  note: >-
    PORTS 48-51 ARE DRAWN WITHOUT NUMERALS ON PURPOSE, AND THEY ARE THE ONLY FOUR OF
    FIFTY-FOUR THAT ARE. The olive band under the two 100G QSFP-DD columns carries no
    printing: crop the three bands side by side at 26x and the teal band to its left is
    packed with dark glyph clusters, two per column, while the olive band holds a white
    up-triangle at each end, a white down-triangle at each end, eight round lamps along
    its lower edge and nothing else, and the steel-blue band to its right carries light
    glyphs at both ends. The blue band is the control that makes this a reading rather
    than a resolution artefact: it is the same darkness as the olive one and its printing
    survives, so a legend on the olive band would have survived too. Numerically the
    olive band's upper half (rows y 91-93 px) is uniform where the teal and blue bands
    vary. The vent strip above the shell was checked as well and carries only the lamp
    row and its two triangles.
    So this faceplate appears to identify its 100G pair by band colour and row triangle
    rather than by number. Printing 48-51 would put ink on the drawing that is not on the
    metal, which is the one thing silkscreen must never do - so they are left off, and
    this entry exists so that a reader comparing the render against the photograph can
    tell a deliberate absence from an unfinished model. If a legible photograph ever
    shows numerals there, they belong on the band in the light fill the blue band uses,
    which is what is legible on an olive ground.
  wanted: a legible faceplate photograph, or the HIG's port map
- what: qsfp-inter-row-marks
  scope: [qsfpdd-100g, qsfpdd-400g]
  reason: needs-photo
  note: >-
    The silver strip between the upper and lower cage rows on all three QSFP-DD shells is
    FINELY MARKED, not blank, and this render cannot separate the marks. Rows y 73-78 px
    read 190 / 84 / 152 / 130 / 96 / 186, so there are two darker rows at 21.1 and
    23.8 mm inside a lighter band - that much is solid, and it is what the drawing
    reproduces, as decor. What it will not do is name a count. A local-minimum scan finds
    a 4.44 mm rhythm, but the two 100G columns - which are identical hardware - put that
    rhythm at offsets 1.7/6.2/10.6/15.1 mm in one column and 4.1/8.5/13.0/17.4 in the
    next, asymmetric in opposite directions and disagreeing by 2.4 mm. Two identical
    columns cannot really differ; that is the signature of sampling a pattern finer than
    the pixel grid, and the residual darkness between the minima says the true pitch is
    about half, near 2.2 mm, which 0.89 mm per pixel cannot resolve.
    So it is not decided whether these are indicators or the ganged cage's gasket comb.
    Against them being lamps: each 100G port already carries four round lamps that DO
    resolve, four above the shell and four on the olive band below it, so strip lamps
    would give one port twelve indicators; and the pattern continues across the 400G
    column, which has no lamp row above it at all. Nothing is drawn as an LED here on
    that reasoning, and no lane count is asserted in either direction.
  wanted: >-
    a faceplate photograph at 2000 px or better, or the HIG's port-LED figure
- what: smb-assignment
  scope: [timing]
  reason: needs-photo
  note: >-
    Two identical 8.0 mm SMB jacks sit at (29.3, 5.3) and (44.4, 5.3) with a printed
    legend beside each that this render cannot read. They are assigned 10MHz and 1PPS in
    the order the datasheet's Timing Interfaces row lists them, which is a convention,
    not a reading - and the S9610-36D prints its pair the other way up in a vertical
    stack, so there is no house order to fall back on either. The GNSS SMA is identified
    independently, by being the larger connector and the only SMA the datasheet lists.
  wanted: a legible faceplate photograph
- what: connector-orientation
  scope: [tod]
  reason: needs-photo
  note: >-
    The ToD RJ45's latch direction cannot be determined: the opening is eleven pixels
    across and the notch that would settle it is one. The jack is drawn in
    std/rj45-ganged's own orientation. On a single jack this is cosmetic; it is recorded
    because the library has been caught by mirrored stacked pairs before and the check
    was genuinely run here rather than skipped.
  wanted: a legible faceplate photograph
- what: shell-dimples
  scope: [sfp28, sfp56]
  reason: vendor-silent
  note: >-
    Each of the twenty-four SFP columns carries two small dark 1.8 mm squares on the
    silver inter-row strip, at 2.7 and 12.0 mm from the column edge, flanking the
    up/down lamp pair - 48 of them, counted. They are drawn as decor because nothing
    identifies them: they could be a second lamp per port drawn unlit, a shell fastener
    or a gasket feature, and with no LED table and no faceplate figure there is no way to
    choose. Drawing them as lamps would assert a per-port indicator this device may not
    have.
  wanted: the HIG's front-panel figure, or a legible faceplate photograph
- what: port-led-semantics
  scope: [port-leds]
  reason: vendor-silent
  note: >-
    No document held states what any port lamp means. The geometry is read: one
    up-triangle and one down-triangle per SFP column, four round lamps above and four
    below each 100G QSFP-DD column, and two lamps below the 400G column with none above
    it. The last of those is measured rather than assumed - the vent perforation runs
    unbroken above the 400G shell where it is visibly interrupted above the 100G shell -
    but whether the 400G pair really has one lamp each, or a lane row this render cannot
    separate, is open. Every lamp keeps its component's plain off/on default.
    The strip between the two QSFP-DD rows is finely marked rather than blank and is drawn
    as a banded decor field of the measured tone; its marks could not be separated and are
    deliberately not modelled as lamps. See the qsfp-inter-row-marks gap, which carries the
    measurement that decides it.
  wanted: the S9620-54DC HIG's LED tables, or a NOS LED reference
- what: fan-part-number
  scope: [ufispace/fan-405637@1, fans]
  reason: vendor-silent
  note: >-
    This datasheet's Fan Types line reads 'FAN-405636-HD, exhaust air flow'. The library
    has ufispace/fan-405637, built from the S9110-32X's guide, at 50.7 x 40.0 mm. One
    digit apart in a number that encodes the rotor, so the two are probably one family
    and possibly not one face. There is no S9620-54DC guide to measure the real module
    against and no image of it, so the component is reused with its model attribute
    overridden to FAN-405636-HD and the substitution recorded here rather than hidden. If
    the faces differ, five bays on the rear are the wrong width.
  wanted: a UfiSpace fan ordering guide, or the S9620-54DC HIG's component table
- what: fan-power-draw
  scope: [ufispace/fan-405637@1, fans]
  reason: vendor-silent
  note: >-
    No wattage for the fan module appears anywhere. The datasheet's Fan Types line reads
    'FAN-405636-HD, exhaust air flow' with no figure beside it, and there is no
    installation guide to carry a component table. Both datasheet pages were searched at
    200 dpi for every occurrence of 'W', 'Watt' and 'power': the only hits are the two
    PSU ordering lines (750W), the AC/DC input ratings and the single system figure
    (125 W typical, no transceiver). The L29 warning this device carries is therefore
    left standing, and the modelled module total is a floor rather than a total.
  wanted: a UfiSpace FAN-405636 specification, or a measured figure from a live unit
- what: psu-part-suffix
  scope: [ufispace/psu-751-ac@1, ufispace/psu-751-dc@1, psus]
  reason: vendor-silent
  note: >-
    This datasheet orders PSU-751-AESR-1C and PSU-751-DESR-1C; the library's psu-751
    components were drawn for the S9110-32X, which orders PSU-751-AESR and -DESR at the
    same 750 W and the same input ranges. The '-1C' suffix is undocumented in any held
    file. The faces are assumed identical and the model attribute is overridden per
    configuration.
  wanted: a UfiSpace power-supply ordering guide
- what: base-configuration-supply
  scope: [base, psus]
  reason: needs-photo
  note: >-
    Both supplies are orderable and no held image shows either one seated, because there
    is no rear image. The base configuration seats the DC unit, which is an arbitrary
    choice recorded as arbitrary - on the S9610-36D the same choice was settled by
    reading a terminal block out of the rear elevation, and here there is nothing to
    read.
  wanted: a rear photograph of a shipped unit
- what: side-and-top-geometry
  scope: [left, right, top, bottom, furniture]
  reason: needs-drawing
  note: >-
    The angle render shows the left side face carrying a column of countersunk
    ear-mount holes near the front and a run of rail features along its length, and the
    lid carrying three long transverse stiffening ribs and a scatter of fastener
    dimples. The counts are read off that render at 45 degrees; NOT ONE POSITION IS
    DIMENSIONED ANYWHERE, so every coordinate on the four non-port faces is estimated
    and evenly spread. The bottom face is not shown in any image at all and carries only
    a compliance sticker at an estimated position.
  wanted: a mechanical drawing, or straight-on side and underside photographs
- what: left-block-unknowns
  scope: [front, timing]
  reason: vendor-silent
  note: >-
    Three features on the left block are drawn because two independent images put them
    there and are not named, because with no guide there is no callout list to name them
    with: a 4.4 mm round icon at (72.4, 5.7) carrying a diamond-shaped glyph, between
    the model legend and the lamp tile, and two 2.7 mm dark circles at (6.2, 37.4) and
    (16.9, 37.4) under the ToD jack. A third, the 2.7 mm circle at (6.2, 14.5), is
    placed as common/reset-button on the reading that a recessed pinhole above a
    management jack is a reset - which every other UfiSpace box in this library has -
    and that reading is a guess too.
  wanted: the S9620-54DC HIG's front-panel callout list
- what: chassis-sku
  scope: [base, ac, dc]
  reason: vendor-silent
  note: >-
    No held document prints an orderable chassis part number; the datasheet's Available
    to Order block covers only the two supplies and the one fan. The configurations
    therefore carry no part numbers rather than invented ones, as on the S9610-36D.
  wanted: a UfiSpace ordering guide or a quote naming the chassis SKUs
groups:
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the timing block down the left edge - the GNSS SMA antenna input, the 1PPS and
      10MHz SMB jacks and the ToD RJ45, which the datasheet groups under one Timing
      Interfaces row and which share one job: disciplining the Stratum 3E OCXO
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
    description: >-
      '40 x 1/10/25G SFP28 ports' - the twenty columns over the yellow printed band
  sfp56:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp56, speed: 50g}
    description: >-
      '8 x 1/10/25/50G SFP56 ports' - the four columns over the teal printed band
  qsfpdd-100g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 100g}
    description: >-
      '4 x 100G QSFP-DD ports' - the two columns over the olive printed band
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 400g}
    description: >-
      '2 x 400G QSFP-DD ports' - the single column over the steel-blue printed band
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      the six chassis lamps in the recessed tile beside the model legend, five green and
      one blue. Their printed legends are illegible in the only published render, so they
      are numbered by position; see the status-lamp-legends gap
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      every indicator that belongs to a particular port - the forty-eight SFP
      up/down triangles on the inter-row strips and the QSFP-DD lane lamps above and
      below their shells
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 hot-swappable'
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '4+1'
      redundancy-note: '4+1 - 4+1 hot-swappable (attrs fan-redundancy)'
  furniture:
    term: Item
    role: furniture
    index-origin: 1
