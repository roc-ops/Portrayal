gaps:
- what: port-number-legends-unresolved
  scope: [qsfpdd-fabric, qsfpdd-service]
  reason: needs-photo
  note: >-
    whether the faceplate metal prints a numeral beside each cage is not resolvable from
    anything held. HIG Figure 8a's large red and blue numerals are guide art laid over
    the cages and the vendor front render shows bare cages; the bright seam band between
    the two cage rows carries faint regular marks at roughly 1.5-2 mm, and the control in
    the same image - the 3.4 mm model name resolves, the 2.0 mm timing legends resolve
    only as shapes - says that size is below what this 2.9 px/mm raster can show. No
    numerals are printed here rather than printing ink the device may not carry.
  wanted: a straight-on photograph of one cage block at 10 px/mm or better.
- what: port-led-semantics
  scope: [port-leds]
  reason: vendor-silent
  note: >-
    all 76 QSFP-DD ports and both SFP+ ports carry lamps, and the HIG's section 10
    defines only the five system lamps (SYNC, SYS, FAN, PS0, PS1), the PSU and Fan FRU
    lamps and the management jack's pair. It gives no colour vocabulary for the port
    lamps at all, so the 38 clusters and the two SFP+ lamps here carry positions and no
    states. Nor does anything say what the pair of small round green lamps between each
    cluster's two windows is for; they are drawn because they are there. And three
    service clusters in the lower strip (ports 1/3, 21/23, 33/35) show an amber upper
    cell over a blue lower cell in the vendor render where every other cluster shows
    blue over blue - a lit state on the ordinary blue lens rather than a different lens,
    and one that matches no set the guide names, the OP2 ports included. What amber in
    the upper cell means is exactly the vocabulary the vendor does not publish.
  wanted: a NOS LED table, or photographs of a live unit with known ports up and down.
- what: unidentified-front-panel-mark
  scope: [furniture]
  reason: vendor-silent
  note: >-
    a small dark rectangle 2.5 x 3.1 mm sits at (7.74, 28.26), between the seven-segment
    display and the 1PPS legend. HIG Figure 4's callouts name Reset, 1PPS, 10MHz, System
    LED, Micro USB, the RJ45/USB block and the SFP+ ports and stop; the front-panel LED
    table names five lamps, all of which are accounted for in the column lower down. The
    sibling S9321-64E carries an ID lamp in the equivalent position, which is a reason to
    suspect and not a reason to assert. It is drawn as a dark decor rectangle so the face
    is not silently missing a feature, and named here so the rectangle is a recorded
    unknown rather than an unexplained mark.
  wanted: a photograph of the front panel's left-hand column, or a bezel drawing.
- what: seven-segment-display-semantics
  scope: [furniture]
  reason: vendor-silent
  note: >-
    the two-digit display under the model name is drawn in every figure and named in
    none: HIG Figure 4's callout list skips it and section 10's Verifying System
    Operation tables the five front-panel lamps and the FRU lamps without mentioning it.
    Whether it shows a POST code, a stack or cluster id, or a beacon digit is unstated,
    so ufispace/seg7-status-2-sm is placed with no semantics attached.
  wanted: a NOS or BMC reference that names the front-panel display.
- what: fan-part-number-suffix
  scope: [fans]
  reason: sources-disagree
  note: >-
    the S9710-76D datasheet's Available to Order section names the fan 'FAN-808012-HC,
    exhaust air flow'; ufispace/fan-808012, built from the S9321-64E's documents, carries
    model FAN-808012-HCE. Same 81 x 154.8 x 81.5 envelope, same 741 g, same exhaust
    flow, same face - the two guides' Component Physical Information tables agree to the
    tenth - so this is one part under two spellings of its suffix rather than two parts,
    and the component is reused unchanged. Which suffix is the orderable one is not
    resolvable from either document.
  wanted: a UfiSpace FRU price list or a photograph of the fan module's own label.
- what: fru-power-unpublished
  scope: [fans]
  reason: vendor-silent
  note: >-
    ufispace/fan-808012 states no draw and its own contract records the search that
    found none. Searched this device's datasheet and HIG for 'watt', 'W)' and 'power
    consumption' as well: every hit belongs either to the PSU-302 ordering lines
    (3000W), to the four system maxima (2173 / 2204 / 2314 / 2351 W), to the 1500 W
    110 V derating or to the 3000 W circuit reserve. L29's standing warning is the live
    record that the module total for this chassis is a floor rather than a total.
  wanted: a photograph of the fan module's label, or a UfiSpace FRU datasheet.
- what: dc-psu-face-not-measured
  scope: [psus]
  reason: needs-drawing
  note: >-
    HIG Figure 4's rear elevation and the vendor rear render both show the AC build, and
    this guide's Figures 19 and 20 draw the DC unit only in isometric, so
    ufispace/psu-302-dc's face layout is estimated from its AC sibling and from those
    isometrics. The terminal block's size and position are the weakest numbers reachable
    from this device. The AC unit's face is measured; the DC one's is not, and the two
    must not be read as equally sourced.
  wanted: a straight-on drawing or photograph of the PSU-302-DESR face.
- what: fan-position-legends
  scope: [fans]
  reason: needs-hardware
  note: >-
    'FAN 0 1 2 3' is printed once on the chassis strip between the fan bank and the PSUs,
    which is modelled - but it is one legend naming four bays rather than a per-bay mark,
    so nothing on the drawing ties bay 2 to the digit 2. Whether the metal also prints a
    digit on or beside each bay cannot be seen in an elevation where the modules cover
    it.
  wanted: a photograph of the rear with one or more fan modules removed.
- what: bottom-face-not-drawn
  scope: [bottom]
  reason: needs-photo
  note: >-
    the bottom view carries its 436 x 762 size and nothing else. No document in the
    intake looks at the underside: HIG Figure 4 draws top, front and rear, the rack
    mounting figures show the chassis from above and from the front, and the grounding
    figures show the rear. This class of device usually carries a regulatory label field
    and rubber feet down there, and drawing either would be invention. L45's size-only
    warning stands as the record.
  wanted: a photograph of the underside, or a mechanical drawing.
- what: front-panel-cutouts-not-declared
  scope: [qsfpdd-fabric, qsfpdd-service, mgmt]
  reason: needs-drawing
  note: >-
    no panel.cutouts are declared on any face. The apertures the guide draws are the
    cage BORES (about 8.1 x 17.9 mm on the QSFP-DD field) rather than the bezel openings
    the metal is punched to, and the difference between the two - the EMI gasket band and
    the bezel lip - is exactly what this raster cannot separate at 2.9 px/mm. Declaring
    holes at the drawn bore would punch the panel smaller than every part seated in it.
    The ports carry the registry openings instead, which is where the truth about a
    standard aperture is.
  wanted: a mechanical drawing of the front bezel.
groups:
  qsfpdd-fabric:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 400g}
    description: the forty 400G QSFP-DD fabric ports, 0-39, in five blocks of four
      columns x two rows across the upper band; they carry the DDC link to an S9705-48D
      or S9725-64E fabric router, and take loopback modules when the box runs standalone
  qsfpdd-service:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 400g}
    description: the thirty-six 40/100/200/400G QSFP-DD service ports, 0-35, in blocks
      of 2+4+4+4+4 columns x two rows across the lower band; 22 of them support OpenZR+
      and ZR, and four (01, 17, 19, 35) are taken for statistics when OP2 is enabled
  sfp-plus:
    term: Port
    role: management
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: the two 10G SFP+ management uplinks, stacked in one shell between the
      management cluster and the service band; the vendor numbers them 0 and 1
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the thirty-eight QSFP-DD lamp clusters - one in each gutter between a
      pair of cage columns, above and below both bands - and the two lamps above the
      SFP+ pair
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the five front-panel system lamps, SYNC SYS FAN PS0 PS1, in a column
      beside their printed legend box
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the management and timing cluster at the left-hand end - OOB RJ45, USB-A,
      RJ45 and micro-USB console, 1PPS and 10MHz SMB - plus the RESET button
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 redundant, hot-swappable, active-active'
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '3+1'
      redundancy-note: '3+1 - 3+1 hot-swap fans (the device description)'
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
