format: 1
kind: device
name: s9610-36d
version: 3.0.0
maturity: modelled
manufacturer: UfiSpace
model: S9610-36D
portfolio:
  line: Telecoms
  family: Open Aggregation Router
  series: S9600 Series
description: >-
  UfiSpace S9610-36D 400G open core and aggregation router - 2RU white box, 36x
  QSFP-DD 40/100/200/400G in two rows of eighteen (one 2-wide and four 4-wide
  belly-to-belly cage banks) with OpenZR+/ZR on the whole upper row, plus a
  stacked 10G SFP+ management pair, an RJ45 out-of-band port over a USB 3.0 over
  an RJ45 console, a micro-USB console, 1PPS and 10MHz SMB timing jacks and a
  two-digit status display, on Broadcom Jericho2c+ at 14.4 Tbps with 16 GB of
  deep buffer, an OP2 external TCAM and a Stratum 3E OCXO; four hot-swap fans
  (3+1) and dual 3000 W PSUs (1+1) at the rear, orderable AC or DC
provenance:
  sources: >-
    UfiSpace S9610-36D datasheet
    (working/intake/ufispace/converted/s9610-36d-datasheet) for dimensions, weight,
    port inventory, platform, power, environment, compliance and the FRU ordering
    lines; S9610-36D Hardware Installation Guide (s9610-36d-hig) for the faceplate
    and rear figures, the FRU dimension table, the port map, the LED tables, the
    rail pin count and grounding; three vendor renders
    (photos/s9610-36d-1-angle, -2-front, -3-rear) for colour, counts and
    construction. Figure quality was gated before anything was measured. THE FRONT
    RULER IS THE VENDOR FRONT ELEVATION, not a guide figure: its body measures
    1668 x 337 px against the datasheet's 436 x 87.7 mm, aspect 4.9496 against a
    true 4.9715 - 0.44% out - so it is orthographic and reads at 3.826 px/mm across
    and 3.842 down, which is 40% finer than the best HIG figure. HIG Figure 9a
    (fig-0017) is the second reading at 2.734 px/mm (body 1192 x 243 px) and HIG
    Figure 9b (fig-0018) the third at 2.702 (1178 x 238, aspect 4.9496); the
    eighteen column centres measured on the guide figure and on the render agree
    to better than 0.5 mm anywhere across 436 mm. The rear ruler is HIG Figure 4's
    rear elevation (inside fig-0010, body 637 x 128 px, aspect 4.977 against 4.9715
    - 0.1% out) at 1.461 px/mm; the rear RENDER fails the gate outright (aspect
    4.51, its lid in frame) and is used only for colour, counts and confirmation.
    The top view is the left panel of the same fig-0010, body 372 x 647 px, aspect
    1.739 against a true 1.748, 0.5% out.
  chassis: >-
    datasheet - '2RU, 436 x 762 x 87.7 mm', 'Weight: 24.12kg or 53.18lb (without
    FRU)'; the HIG Component Physical Information table repeats the same triple and
    the same weight, and the HIG's Space Clearance paragraph separates the two
    numbers explicitly - 'The S9610-36D width is 17.16 inches (43.6cm) and shipped
    with a rack mount brackets suitable for 19 inch (48.3cm) wide racks'. 436 is
    therefore the body between the ear planes and not a rack face, which is also
    what the front elevation draws: two small bracket tabs stand OUTSIDE the
    full-height body on each side (px 6-11 and 1204-1210 in fig-0017 against a body
    of 12-1203), and those are the mounting hardware, which is not drawn here. The
    762 mm depth is the chassis without FRUs; the HIG adds that the fan handle
    extends 29 mm and the PSU handle 30 mm beyond it.
  front-layout: >-
    photo-measured on the vendor front elevation at 3.826 / 3.842 px/mm, corroborated
    on HIG Figures 8a/8b/9a/9b. Left to right: a management and timing block down the
    left edge (a reset pinhole, the model legend, the two-digit display, two SMB
    jacks, five system lamps beside a white legend block, a micro-USB console at the
    foot), then the ganged RJ45 / USB 3.0 / RJ45 stack, then the stacked SFP+ pair,
    then the eighteen QSFP-DD columns. Positions read off that image are good to
    about 0.3 mm and are carried as photo-measured confidence.
  qsfp-layout: >-
    photo-measured. PITCH WAS TAKEN FROM THE CAGE APERTURES, which repeat once per
    port, not from any filled module face: the eighteen drawn openings measure 68 px
    (17.8 mm) wide on centres that a least-squares fit resolves to
    69.801 + 19.0897k + 5.620b, where b is the number of cage banks to the left -
    residual 0.14 mm at worst anywhere across the row. The 19.09 mm port pitch is
    what decides the part: the registry's 19.0 mm std/qsfp-dd fits it with 0.09 mm
    to spare, which is what a shared-shell bezel-less block looks like, and the last
    column's right edge lands at 426.3 of 436. The banks are 2 + 4 + 4 + 4 + 4
    columns, read off the aperture runs in both the render and HIG Figure 9a and
    confirmed by the drawn shell outlines. Two rows, cage tops 51.20 and 66.20: the
    aperture lip-to-lip spans measure y 51.27-61.16 and 66.62-75.73, centres 56.21
    and 71.18, so the row pitch is 14.97 mm and the 10 mm registry cage is centred on
    each. THE TWO ROWS ARE NOT MIRRORED. A 14x crop of one column shows the EMI
    gasket strip running along the top inside edge of BOTH apertures and the same
    thin strip along the bottom of both, so the pair is drawn the same way up and
    neither row carries rotate: 180 - unlike the SFP+ pair beside it, which does
    mirror and is visibly different in the same crop. What sits between the two rows
    is a plain dark web with one small rounded black tab pocket centred under each
    column, drawn here as decor.
  port-numbers: >-
    photo-measured, and they ARE printed on the metal. Between every second pair of
    columns the faceplate carries a printed indicator block: a blue tile bearing a
    white left-pointing triangle over a white right-pointing triangle, two round
    lamps, then a second blue tile bearing two port numerals. A 22x crop of the first
    block reads unambiguously - the left tile's triangles, then two green lamps, then
    '0' over '2' - and the arrows are what assign them: the left-pointing triangle
    and the upper numeral belong to the LEFT column of the pair, the right-pointing
    triangle and the lower numeral to the RIGHT column. So block j carries 4j over
    4j+2 above the upper row and 4j+1 over 4j+3 below the lower one, which reproduces
    HIG Figure 8a's numbering exactly (even numbers along the top row, odd along the
    bottom, 0-35 left to right). All thirty-six numerals are drawn. The tiles for
    ports 1, 17, 19 and 35 are YELLOW rather than blue in every image held, including
    the vendor product render, and those are precisely the four ports HIG Figure 8b
    captions 'Ports disabled when statistics counter is enabled' - see the
    op2-tile-colour gap for the one thing that cannot be settled from images.
  port-leds: >-
    photo-measured - nine indicator blocks above the upper row and nine below the
    lower, one per pair of columns, each carrying two round lamps between its arrow
    tile and its numeral tile. The lamp centres measure y 45.41 and 48.79 in the upper
    band and 79.40 and 83.02 in the lower, on x centres that land within 0.4 mm of
    each column pair's midpoint (79.47 against 79.35 for the first, and so on for all
    nine). Each lamp is drawn as common/led-dot and carries `for:` the ONE port the
    arrow beside it names - upper lamp to the left column, lower lamp to the right -
    so all thirty-six ports have a lamp of their own. What the lamp MEANS is not
    stated anywhere; see the port-led-semantics gap. The out-of-band RJ45 carries two
    more lamps in the top corners of its own aperture, and the SFP+ pair two above the
    upper cage; nothing is drawn below the lower SFP+ cage because nothing is there.
  connector-orientation: >-
    photo-measured in 14x and 8x crops rather than assumed. The stacked RJ45 pair
    MIRRORS - the upper jack's latch notch is at the TOP of its aperture, between its
    two green lamps, and the lower jack's is at the BOTTOM - so with std/rj45-ganged
    drawing its keyway at the bottom, the OOB jack is rotate: 180 and the console jack
    is unrotated. The stacked SFP+ pair mirrors too: the upper cage's bright latch tab
    hangs DOWN into the silver band between the two and the lower cage's points UP, so
    sfp-0 is rotate: 180 and sfp-1 is not. The QSFP-DD rows do NOT mirror; see
    qsfp-layout. std/rj45-ganged (12.7 x 11) is used rather than std/rj45 (16 mm
    bezel) because the two jacks sit on a 19.4 mm stack pitch with a USB 3.0 socket
    between them, which a 16 mm bezel cannot do. The USB socket is LANDSCAPE here -
    its aperture measures 12.5 wide by 4.8 tall - so std/usb-a is placed unrotated.
  ganged-shells: >-
    photo-measured - the bright metal around the RJ45/USB stack (x 18.3-35.8,
    y 46.4-78.4) and around the SFP+ pair (x 41.4-56.8, y 51.2-76.7) is PANEL, not
    part: std/rj45-ganged, std/usb-a and std/sfp-ganged each draw their own aperture
    and stop, and without those two decor fills three dark connectors would sit
    invisible on a dark faceplate. The flange was measured, not the connector body -
    the strip is 17.5 mm wide against a 12.7 mm jack - so the lamps just inside the
    top of the OOB aperture are not swallowed by it.
  system-lamps: >-
    photo-measured - five lamps in a column at x 10.19-11.50 on a 2.51 mm pitch,
    centres y 64.02 / 66.53 / 69.04 / 71.55 / 74.06, with a white printed legend block
    immediately to their right at x 12.55-17.51, y 62.98-74.95 carrying five rows of
    text on the same pitch. The order is the HIG Front Panel LED table's - SYNC, SYS,
    FAN, PS0, PS1 - which is also the legend block's row order, and that table gives
    every state written here. common/led-dot is used rather than common/led-rect
    because the drawn lamp is 1.3 mm across on a 2.51 mm pitch and led-rect's 4.6 x 2.6
    would overlap its neighbours.
  smb-jacks: >-
    photo-measured - the two timing jacks are ROUND, 7.9 mm across the knurled nut, on
    centres (9.15, 43.05) and (9.15, 56.95). common/smb-jack was NOT used: it draws a
    HEX nut, which is the S9510-28DC's hardware and not this one's. The jack is
    std/smb (the 4.83 mm registry bore) on a gold decor disc for the nut, which is the
    construction the S9311-64D established for the same pair of jacks.
  display: >-
    photo-measured - the two-digit seven-segment readout under the model legend
    measures 12.81 x 6.77 at x 4.70, y 16.66. It is placed as a component
    (ufispace/seg7-status-2-sm@1, built for this device) rather than as decor because
    it is a part a person can point at and a lamp a NOS can drive. It is NOT
    ufispace/seg7-status-2@1: that contract is 17.2 x 9.5, measured on the S9600-72XC
    off a 600 dpi page render, and 9.5 mm will not fit in the 8.4 mm of clear metal
    between the model legend and the vent slots here. See the display-semantics gap
    for what the digits mean, which no held document says.
  left-block-unknowns: >-
    Three features on the left block are drawn because two independent images put them
    in the same place, and are NOT named because no callout reaches them: a blank
    circle 3.7 mm across at (7.3, 8.5), a small square perforated patch at x 7.2-9.3,
    y 28.6-32.5 with a plain 2.6 mm circle beside it at (13.5, 30.5), and two short
    oval slots at y 25.1-26.2. HIG Figure 4's callout list runs RJ45, Reset, Beacon
    LED, 1PPS, 10MHz, USB, System LED, Micro USB, RJ45, 2 x SFP, 36 x QSFP-DD and stops.
    The circle-and-mesh pair reads like an unpopulated GNSS antenna position - the
    S9600-72XC has an SMA there and this SKU does not list GNSS - but that is a guess,
    so it is drawn as decor and not written into a part name. The long narrow recess in
    the right margin at x 433.0-434.8, y 35.5-64.0 is the same unnamed feature the
    S9311-64D carries in the same place; it reads as a finger pull for the rails and is
    likewise drawn as decor.
  rear-layout: >-
    drawing - HIG Figure 4's rear elevation at 1.461 px/mm. The fan pitch is 83.96 mm,
    and WHICH FEATURE IT WAS TAKEN FROM IS THE WHOLE POINT: the four status lamps give
    steps of 84.18 / 83.85 / 83.85 and the four printed 'E' airflow badges 84.19 /
    83.84 / 85.90, while the four release tabs give 85.56 / 85.55 / 85.90 and the four
    handles 85.6 / 85.9 / 86.6. The lamps and badges are printed FLAT on the face; the
    tabs and handles stand proud of it, and a proud feature is projected outward from
    the frame centre, which inflates its apparent pitch. The vendor rear render
    reproduces the same split independently at its own scale (lamps 292 / 293 / 293 px,
    tabs 297.5 / 297.5 / 299.5), which is what confirms it is projection and not two
    real spacings. So the flat series wins. The lamp centre measures 17.80 mm on the
    first module and ufispace/fan-808012@1 puts its lamp 9.5 mm from the module's own
    left edge, so fan 0 sits at x 8.30 and fan 3's right edge at 341.18 - which leaves
    8.30 mm of chassis at the left and 8.5 at the right, a symmetry nothing was fitted
    to and which is the check on the anchor. Fan tops are 4.0 from the same lamp
    (measured centre y 23.64 against the contract's 19.6), leaving 4.0 above and 2.2
    below; centring them instead would give 3.1, a difference of 1.3 px in this figure,
    and the measurement is used rather than the tidier number. The two PSU bays are at
    x 360.0 - the PSU lamp measures 366.5 and the contract puts it 6.0 from the module
    edge - and at y 3.5 and 45.5, the seam between them profiling as a hard minimum at
    44.5-45.2. Between the fans and the supplies is an 18.5 mm chassis strip carrying
    the grounding pad, the earth symbol and the FAN 0|1|2|3 position key; past the
    supplies is an 8.5 mm strip carrying the rotated PSU 0 and PSU 1 legends. Those
    legends are chassis silkscreen: which bay is 0 is a position fact and cannot live
    on an interchangeable FRU.
  psu-build: >-
    THE DOCUMENTED BUILD AND THE PHOTOGRAPHED BUILD AGREE HERE, which is worth saying
    because they often do not. HIG Figure 4's rear elevation and the vendor rear render
    both show the SAME supply, and a 4x crop of it shows a two-stud screw-terminal block
    under a hinged cover marked + and -, not an IEC inlet: that is the DC unit,
    PSU-302-DESR. The AC unit exists and is orderable (PSU-302-AESR, and HIG section 9's
    AC subsection describes plugging a C19 cable into it) but no held image shows one
    seated, so the base configuration seats the DC supply and the AC build is a
    configuration that swaps the component. ufispace/psu-302-ac@1 and -dc@1 were drawn
    for the S9321-64E/EO, which orders the same two part numbers at the same 3000 W and
    the same 68 x 40.6 face; nothing about them was re-measured here beyond confirming
    the face size against this HIG's own component table, which gives 68 x 458.8 x 40.6.
  grounding: >-
    HIG section 8 - the router is grounded through a two-hole #4 AWG lug and two M4
    screws, and the guide says the location 'is at the rear of the case and is covered
    with a protective label'. Both rear images show that strip with the label already
    removed and the bare pad and its two holes visible, at x 344.5-353.5, y 2.5-39.0,
    with the earth symbol printed below it. The pad and holes are drawn as decor and the
    symbol as a common/ground-symbol placement; the LUG itself is an accessory-kit part
    (41.91 x 36.83 x 13.97 mm per the HIG accessory list) and is not drawn, because a
    lug is fitted by the installer and is not a face of the chassis.
  views: >-
    Six views, all with drawn content. TOP: y = 0 is the REAR, per the house convention
    and per HIG Figure 4's own footprint drawing, which prints the fan handles across
    the top of the panel and the front bezel at the bottom. Six long stadium ribs run
    across the lid on a 105.8 mm pitch (measured edge pairs at 131.9/151.9, 236.7/257.9,
    342.7/363.9, 448.7/471.1, 554.7/575.9, 660.7/681.9 at 0.849 px/mm) with three small
    bosses in a row 84.8 mm from the rear. BOTTOM mirrors left-right and carries the
    compliance sticker at an ESTIMATED position - no held figure shows the underside.
    LEFT (x = 0 is the REAR) and RIGHT (x = 0 is the FRONT) each carry the five rail
    attachment pins the HIG rack-mounting section counts ('The chassis has 5 attachment
    pins on each side, for a total of 10 pins') plus the M4 screw that locks the inner
    rail ('two M4 screws, one on each chassis side'). HIG Figure 11 draws them numbered
    1-5 front to rear with the screw hole (a) behind pin 5 and dimensions none of them,
    so EVERY position on both side faces is estimated and spread evenly. Both side faces
    carry only symmetric content, so the depth-axis conventions are stated here rather
    than exposed by any asymmetric feature.
  attrs: >-
    datasheet - Specifications, Performance, Environmental, Regulatory Compliance and
    Accessories sections, transcribed into sections. Compliance strings kept verbatim,
    semicolon-separated, untidied.
  power: >-
    datasheet 'Typical power: 767 Watts (no transceiver)' - the vendor's own scope, so
    power-envelope is bare. The HIG states the maximum FOUR times, once per build and
    once per optic class: DC 'is 1752 watts under 400G optics MSA standards. With Open
    ZR+ transceivers (on selected ports...) the maximum power consumption is 2073
    watts'; AC 1728 and 2049 for the same two cases. Those are four scopes, not four
    readings, and 2073 is carried as power-max-w because max means the highest of them.
    The 24 W AC/DC difference and the ~320 W ZR+ premium are recorded here rather than
    as a conflict. These are the vendor's figures as the vendor states them and are NOT
    reconciled against the modelled module set: the fans publish no draw at all, so any
    total built from the modules is a floor. PSU rating 3000 W per supply from the
    datasheet's Available to Order lines.
  lifecycle: >-
    searched 2026-08-28: 'UfiSpace S9610-36D end of life' - no announcement found; the
    vendor's aggregation-router product page, the datasheet and the hardware guide are
    all live, and STORDIS still lists it. none-announced is a real finding, not an
    absence.
attrs:
  performance:
    switching-capacity: 14.4 Tbps
    deep-buffer: 16 GB
  power:
    power-typical-w: '767'
    power-max-w: '2073'
    power-envelope: bare
    input-ac: 200 to 240 V, 16 A
    input-dc: -40 to -72 V, 80 A
    psu-redundancy: 1+1 hot-swappable
  thermal:
    fan-redundancy: 3+1 hot-swappable
    airflow: front-to-back
  environmental:
    operating-temp: 0 to 45 C
    operating-humidity: 5 to 85% RH non-condensing
    storage-temp: -40 to 70 C
    storage-humidity: 5 to 93% RH non-condensing
  platform:
    asic: Broadcom Jericho2c+ BCM88850
    tcam: Broadcom OP2 BCM16K
    cpu: Intel Skylake-D 8-core @ 1.9 GHz
    memory: 64 GB DDR4, expandable to 128 GB
    storage: 1x 128 GB SSD, expandable to 2x 128 GB
    bmc: Aspeed AST2620
    oscillator: Stratum 3E OCXO with optional holdover
    oem-alias: >-
      DriveNets NCP-36CD-S-SA (Network Cloud Packet forwarder, 36x400 NIF standalone). NOT A
      UFISPACE CLAIM - no UfiSpace document mentions DriveNets. The mapping is internal
      analysis: the okf `drivenets-ddc` bundle's 'DriveNets NCF/NCP to white-box hardware map
      (shipping platforms)' matches the roadmap slide's NCP-36CD-S-SA (J2C+ 12.8T) to this
      chassis on published silicon and port configuration. The map names this model OR the
      S9611-36D refresh for the same DriveNets name, so the alias is not unique to one of the
      pair. Recorded so a search for either name finds this box; no DriveNets figure or
      artwork is transcribed anywhere in this file.
  features:
    optics-qsfp-dd: >-
      400G QSFP-DD OpenZR+/ZR/SR8/FR4/LR4/ER4/DR4/DR4+/PLR4; 200G QSFP56 SR4/FR4;
      100G QSFP28 SR4/LR4/ER4/ZR4 (datasheet compatible transceiver list); the HIG's
      port table gives a maximum supported distance of 600 km
    optics-sfp-plus: 10G SFP+ (datasheet port list, 2 x 10G SFP+ management ports)
    zr-ports: >-
      the eighteen EVEN-numbered ports, 0 to 34, are the OpenZR+/ZR set - HIG Figure 9a
      shades exactly the upper row and captions it 'The ports highlighted in brown
      support OpenZR+ and ZR'
    op2-disabled-ports: >-
      ports 1, 17, 19 and 35 lose their service-port function when the OP2 statistics
      counter is enabled, leaving 32 service ports (HIG Figure 8b)
    segment-routing: full Segment Routing over IPv6 (SRv6)
    macsec: point-to-point MACsec
    timing-cable: 50 ohm SMB coaxial with a 10-32UNF-2A connector, for 1PPS and 10MHz
    timing: >-
      1PPS and 10MHz SMB, each input/output; SyncE and IEEE 1588v2 with the G.8265.1,
      G.8275.1, G.8275.2, SMPTE ST 2059-2, T-BC/OC and T-TC profiles, Class C accuracy
  management:
    console: RJ45 RS-232 plus a micro-USB serial console, 115200 8N1
    oob: 1x RJ45 100/1000M
  compliance:
    safety: UL 62368-1; IEC 62368-1
    emc: >-
      FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386;
      EN 55035; VCCI CISPR 32, Class A
    environment: WEEE
  lifecycle:
    eol: none-announced
chassis:
  width: 436
  height: 87.7
  depth: 762
  ru: 2
  color: '#474749'
  weight-kg: 24.12
gaps:
- what: port-led-semantics
  scope: [qsfpdd-400g, sfp-plus, port-leds]
  reason: vendor-silent
  note: >-
    The HIG's section 10 tables the five front-panel lamps, the PSU and Fan FRU lamps
    and nothing else. It says nothing about the thirty-six port lamps, nothing about
    the two lamps in the out-of-band jack, and nothing about the two above the SFP+
    pair. Which port each QSFP-DD lamp serves IS known - the arrow printed beside it
    says so - but what green, amber or blinking mean there is not, so every lamp keeps
    common/led-dot's plain off/on default rather than an invented vocabulary. The two
    SFP+ lamps sit above the UPPER cage with nothing below the lower one, so they
    cannot be one-per-port by position; they carry `for:` both ports, which is
    adjacency and not an asserted mapping.
  wanted: >-
    a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a live unit
    with ports in known states
- what: op2-tile-colour
  scope: [qsfpdd-400g, port-leds]
  reason: needs-photo
  note: >-
    The numeral tiles for ports 1, 17, 19 and 35 are drawn yellow and the other
    thirty-two blue, because every image held shows them that way - HIG Figures 8b and
    9b, which are marked-up, AND the vendor front and angle product renders, which are
    not captioned as marked up. Those four are exactly the set HIG Figure 8b calls
    'Ports disabled when statistics counter is enabled'. The open question is whether
    the yellow is really on the metal or whether the product render is the same
    marked-up artwork with its caption removed, which is a thing this vendor does. The
    drawing is correct either way about WHICH ports they are; only the colour of four
    tiles is at stake.
  wanted: a photograph of a real S9610-36D faceplate, or the vendor's artwork sheet
- what: display-semantics
  scope: [ufispace/seg7-status-2-sm@1, display]
  reason: vendor-silent
  note: >-
    The two-digit seven-segment readout at x 4.70-17.51 is drawn in every figure and
    named in none. HIG Figure 4's callout list runs RJ45, Reset, Beacon LED, 1PPS,
    10MHz, USB, System LED, Micro USB, RJ45, 2 x SFP and 36 x QSFP-DD; the nearest
    callout, 'Beacon LED', points into this block but is a lamp's name, and section
    10's LED table has no row for a numeric display. Whether the digits show a POST
    code, a chassis or stack ID or a fault code is unstated, so the component carries
    no state vocabulary and its skin draws the all-segments '8.8.' the vendor's own
    artwork draws.
  wanted: a NOS or BMC reference that documents the front-panel numeric display
- what: fan-power-draw
  scope: [ufispace/fan-808012@1, fans]
  reason: vendor-silent
  note: >-
    Neither this datasheet nor this HIG gives the fan module a wattage. The datasheet's
    Available to Order block names it as 'FAN-808012-HC, exhaust air flow' with no
    figure beside it; the HIG weighs it (737 g), dimensions it (81 x 151.3 x 81.5 mm)
    and tables its lamp without one. Searched both documents for 'watt', 'W)' and
    'power consumption': every hit belongs either to the PSU-302 ordering lines
    (3000W), to the system maxima (1728 / 1752 / 2049 / 2073 W) or to the typical
    figure (767 W). The L27/L29 warning this device carries for the fans is therefore
    left standing, and the modelled module total is a floor rather than a total.
  wanted: a UfiSpace FAN-808012 specification, or a measured figure from a live unit
- what: fan-model-suffix
  scope: [ufispace/fan-808012@1, fans]
  reason: sources-disagree
  note: >-
    This datasheet's Available to Order line reads 'FAN-808012-HC'; the S9321-64E
    datasheet the component was built from reads 'FAN-808012-HCE', and the two HIGs
    give the module different depths for the same face - 151.3 mm here against 154.8
    there, with the same 81 x 81.5 face and near-identical weight (737 g against 741).
    The base configuration therefore overrides the component's model attribute to
    FAN-808012-HC, which is what this product's own ordering line says, and the
    disagreement is recorded here rather than resolved: it is not knowable from the
    documents whether -HC and -HCE are one part under two spellings or two builds of
    one family.
  wanted: a UfiSpace fan ordering guide covering both platforms
- what: chassis-sku
  scope: [base, ac, dc]
  reason: vendor-silent
  note: >-
    No held document prints an orderable chassis part number - the datasheet and the
    HIG name the product only as S9610-36D, and the Available to Order block names only
    the two PSUs and the one fan. The S9510-28DC precedent applies: that model's
    -BN0B/-BR1B SKUs surfaced from the owner and from no held PDF, so orderable SKUs
    for the AC and DC builds almost certainly exist. The configurations therefore carry
    no part numbers rather than invented ones.
  wanted: a UfiSpace ordering guide or a quote naming the chassis SKUs
- what: side-face-geometry
  scope: [left, right, furniture]
  reason: needs-drawing
  note: >-
    The HIG counts the rail hardware exactly - 'The chassis has 5 attachment pins on
    each side, for a total of 10 pins', plus 'two M4 screws (one on each chassis side)'
    - and Figure 11 draws all six numbered 1-5 and (a), front to rear, without a single
    dimension. The six positions on each side face are therefore spread evenly over the
    middle of the 762 mm depth and are ESTIMATED. The count and the order are the
    vendor's; the spacing is not.
  wanted: a mechanical drawing of the chassis side, or a straight-on side photograph
- what: airflow-variant
  scope: [base, fans, psus]
  reason: vendor-silent
  note: >-
    The datasheet lists ONE fan and TWO supplies for this platform and all three are
    'exhaust air flow', and the HIG's Cooling paragraph says 'The S9610-36D airflow
    direction is front-to-back' with no alternative. Unlike the S6301 and S9510
    families there is no intake-flow sibling named anywhere, so no back-to-front
    configuration is modelled and the red handles and latches are not a variant marker
    here. Whether UfiSpace builds one to order is not something these documents answer.
  wanted: a UfiSpace ordering guide listing intake-flow FRUs for this platform
groups:
  timing:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: coax-smb}
    description: >-
      the 1PPS and 10MHz SMB jacks on the left block, each an input/output
      (datasheet Timing Interfaces)
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management block down the left edge - the out-of-band RJ45, the USB 3.0
      maintenance port, the RS-232 console RJ45, the micro-USB serial console and the
      recessed reset button. Same block, and the same word for it, as the library's
      other UfiSpace white boxes
  sfp-plus:
    term: Port
    role: management
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      the stacked SFP+ pair, '2 x 10G SFP+ management ports' in the datasheet's
      interface list. The faceplate numbers them 0 and 1 in their own run - the printed
      legend above them reads 0, up-triangle, down-triangle, 1 - rather than continuing
      the QSFP-DD numbering
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 400g}
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      the five chassis indicators the HIG's Front Panel LED table names - SYNC, SYS,
      FAN, PS0 and PS1
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      every indicator that belongs to a particular port - the thirty-six QSFP-DD lamps,
      the two above the SFP+ pair and the two in the out-of-band jack's own aperture
  display:
    term: Display
    role: indicator
    index-origin: 1
    description: the two-digit seven-segment readout under the model legend
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 hot-swappable'
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '3+1'
      redundancy-note: '3+1 - 3+1 hot-swappable (attrs fan-redundancy)'
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
