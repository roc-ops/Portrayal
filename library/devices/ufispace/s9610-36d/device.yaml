configurations:
  base:
    kind: base
    description: >-
      The chassis as both rear images draw it - four FAN-808012-HC fans and two
      PSU-302-DESR 3000 W DC supplies with their two-stud terminal blocks, red handles
      and latches throughout, front-to-back airflow, and the thirty-eight traffic and
      management ports empty. No orderable chassis part number appears in any held
      document; see the chassis-sku gap.
    default: true
    airflow: front-to-back
    component-attrs:
      fan-808012:
        model: FAN-808012-HC
  dc:
    kind: orderable
    description: >-
      Dual 3000 W -40 to -72 V DC supplies (PSU-302-DESR), which is the build every
      figure and render shows. The HIG rates the feed at 80 A maximum per circuit for
      operation up to 5000 m and notes a 150 A fast-acting fuse built into each supply;
      the terminal block takes two-hole #4 AWG lugs at 50 kgf.cm.
    airflow: front-to-back
    bays:
      psu-0: ufispace/psu-302-dc@1
      psu-1: ufispace/psu-302-dc@1
    component-attrs:
      psu-302-dc:
        model: PSU-302-DESR
      fan-808012:
        model: FAN-808012-HC
  ac:
    kind: orderable
    description: >-
      Dual 3000 W 200-240 V AC supplies (PSU-302-AESR, IEC 60320 C20 inlet, 16 A per
      circuit, 25 A internal fuse). The HIG describes this build in prose and shows it
      in no figure - both rear images carry the DC unit - so the AC face here is
      ufispace/psu-302-ac@1 as drawn for the S9321-64E/EO, which orders the same part
      number at the same rating and the same 68 x 40.6 envelope.
    airflow: front-to-back
    bays:
      psu-0: ufispace/psu-302-ac@1
      psu-1: ufispace/psu-302-ac@1
    component-attrs:
      psu-302-ac:
        model: PSU-302-AESR
      fan-808012:
        model: FAN-808012-HC
