             placement''s rotate: 180 (preserving the pre-sweep common/rj45-port@4
             render, which the mgmt-stack provenance ties to the photographed
             green corner lamps) the component-local left window (led-a) renders on
             screen-right, so led-a carries the physical-right/amber pair and led-b
             the physical-left/green pair, keeping the same physical lamp assignment'}
