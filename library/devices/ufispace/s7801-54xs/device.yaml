format: 1
kind: device
name: s7801-54xs
version: 2.0.0
maturity: modelled
manufacturer: UfiSpace
model: S7801-54XS
portfolio:
  line: 'Cloud & Data Centers'
  family: Data Center Switch
description: >-
  UfiSpace S7801-54XS data center ToR/leaf switch - 1RU, 48x 1/10G SFP+ +
  6x 40/100G QSFP28, Broadcom Trident3-X5, rear-serviced 4+1 fans and 1+1
  400 W PSUs, airflow selectable by FRU choice
profile: networking
provenance:
  sources: >-
    datasheet (working/intake/ufispace/datacenter/s7801-54xs-datasheet.pdf,
    docling-converted) for dimensions, weight, port counts, power, platform and
    compliance; hardware installation guide (s7801-54xs-hig.pdf, same directory)
    for the component physical table, FRU part numbers, LED tables and the port
    overview figure (Figure 11 / fig-0020); four photographs
    (working/intake/ufispace/photos/s7801-54xs-*) for colour, counts,
    orientation and the rear layout. FRU components ufispace/psu-401-ac,
    psu-401-dc and fan-402825 already existed from the S9510-28DC (same FRU
    family, same part numbers, HIG dimensions identical) and are reused, not
    rebuilt.
  chassis: >-
    datasheet - 440 x 440 x 43.8 mm (W x D x H), 1RU, 8.9 kg without FRUs. The
    HIG component table repeats the same triple. The 440 body is the metal
    between the bolt-on rack brackets (HIG: "shipped with a rack mount brackets
    suitable for 19 inch racks", brackets are accessory items 2/3), so no ear
    subtraction applies; ears are not drawn per house rule.
  layout-x: >-
    drawing - the HIG port-overview faceplate figure (fig-0020, 1474 px wide,
    read at 3.350 px/mm against the 440 mm width). Its aspect is 9.70 against a
    true 10.05 (3.5% squashed vertically), so per Gate 1 only x-fractions were
    taken from it. Measured on the two SFP+ blocks' silver mid-strips:
    block 1 x 26.3-197.0, block 2 x 200.3-371.0 - each 170.7 mm for 12 columns,
    which is the std/sfp-ganged 14.25 mm pitch to 0.2%, so the columns are laid
    at exactly 14.25 (block 1 from 26.3, block 2 from 200.4, 3.1 mm inter-block
    gap). QSFP28 block measured x 375.2-432.2; modelled as three 18.5 mm
    std/qsfp-ganged columns on a 19.0 pitch from 375.4. Management bezel
    measured x 6.3-23.0.
  layout-y: >-
    photo-measured - the straight-on front photograph (s7801-54xs-2-front.png,
    51 px of face height for 43.8 mm, so coarse at 0.86 mm/px; the schematic
    figure is 3.5% wrong in y and was not used for this axis). Photo puts the
    top cage flange at ~8.6-9.5, the inter-row strip at ~19-25, and the blue
    numbering band at ~34.4-38.7. Modelled with the standard cage heights: SFP+
    rows at y 9.0 and 24.4 (10.4 tall), silver strip 19.4-24.4, number bands
    35.2-38.4; QSFP28 rows at 9.42 and 25.2 (9.58 tall). Row positions are
    photo-anchored, cage heights are registry values.
  mgmt-stack: >-
    photo - the left-end management column, top to bottom: OOB RJ45 with
    integrated lamps (network-tree symbol printed above), blue USB 3.0 Type-A,
    RJ45 serial console (legend 'SS/arrows/IOIOI' printed below), all on a
    light bezel plate measured x 6.3-23.0 in the faceplate figure. Vertical
    positions estimated to fit the photographed stack into the 43.8 face using
    the components' own contract heights, 35.7 mm total
    (common/rj45-eth@1 13.2 + common/usb-a@3 9.3 + std/rj45@2 13.2; before the
    RJ45 sweep the same trio - common/rj45-port@4, common/usb-a@3,
    common/rj45-shielded@2 - stacked to 36.7); the photo shows the jacks
    nearly touching, as modelled. Both RJ45s are keyway-down in the zoomed
    angle photograph (s7801-54xs-1-view.png). The console (std/rj45@2) draws
    its contacts at the top, unrotated, matching the photo. The OOB
    (common/rj45-eth@1) carries a device-level rotate: 180, the RJ45 sweep's
    FLIP_ORIGIN rule preserving the appearance the pre-sweep unrotated
    common/rj45-port@4 placement drew - CAVEAT, checked in a zoomed crop per
    the gate: the photographed OOB jack is keyway-down, so its contacts face
    UP, while an unrotated lamped jack in this family draws lamps-top/
    contacts-DOWN and cannot show both; the pre-sweep modelling judged that
    putting the lamps at the bottom (which an unrotated common/rj45-port@4,
    and now an unrotated common/rj45-eth@1, would not do) would be a larger
    error than the contact side, and its lamp pair matches the photographed
    green corner lamps - so lamps-top is kept and the rotate stays. The
    S9510-28DC uses the same component the same way.
  system-leds: >-
    drawing - lamp x positions read off the faceplate figure at 3.35 px/mm
    (SYS 52.4, FAN 59.2, PS0 66.0, PS1 72.8, ID below PS1), arrangement
    confirmed by HIG Figure 28 (SYS FAN PS0 PS1 in a row, ID on a second row
    under PS1). The real lamps are ~2.4 x 1.2 mm rounded rectangles; modelled
    as common/led-dot (2 mm round) because no 2.4 mm rect lamp component
    exists and led-rect at 4.6 mm would not fit the 6.8 mm label pitch.
  port-numbers: >-
    photo - the real device prints port numbers only on the coloured bands
    under each block (steel-blue for SFP+ '▲0 1▼' pairs, olive for QSFP28
    '▲48 49▼' pairs; up-arrow names the top-row port, down-arrow the bottom).
    The HIG figure additionally paints large numerals on the cage faces, but
    the photographs show open dark cages with no numerals - guide art is a
    mock-up, the real device wins, so the big numerals are not drawn. Band
    colours sampled from the photographs (#6b9cbd blue, #4a5441 olive).
  port-leds: >-
    photo - each SFP+ column carries one up/down triangle-lamp pair on the
    silver inter-row strip (up = even/top port, down = odd/bottom port),
    matching the S9510-28DC arrangement, so common/led-arrow is reused at the
    same in-column offsets. Each QSFP28 port carries four lane lamps: the
    top-row ports' four sit in the perforated row above the block (y 6.6), the
    bottom-row ports' four below the olive band (y 38.9), confirmed by
    counting dots in the zoomed angle photograph (4 per column above and
    below). Modelled as four common/led-dot per port rather than
    common/qsfp-lane-leds because that strip is 19.5 mm wide and would collide
    on this 19.0 mm column pitch.
  led-semantics: >-
    HIG section 10 (pages 21-22), transcribed onto the placements rather than
    only cited: the SYS/FAN/PS0/PS1/ID tables onto the five status lamps, the
    Management Port LED table onto the OOB jack's two elements (left lamp
    green 1G link/activity, right lamp amber 10/100M link/activity - the two
    lamps do not share a vocabulary, so states are per element). The PSU FRU
    and Fan FRU tables belong to the modules and are already transcribed in
    ufispace/psu-401-* and ufispace/fan-402825. The HIG gives NO table for the
    SFP+ arrow lamps or the QSFP28 lane lamps, so those keep their component
    default of off/on - see gaps.
  rear-layout: >-
    photo-measured - straight-on rear photograph (s7801-54xs-3-rear.png,
    1568 px for the 440 mm face, 3.56 px/mm). Fan handles repeat on a 52.5 mm
    pitch; the 51.5 mm bays (HIG fan module 51.5 x 57.8 x 42.2) are laid from
    x 14.7, matching the photographed module edges to ~1 px. PSU bays (HIG PSU
    50.5 x 211 x 40) at x 322.3 and 381.9, read from the handle and divider
    edges; each PSU's vertical 'PSU0/PSU1' legend with a left-pointing
    triangle sits on the chassis strip to its right (376.6 and 435.8). Order
    left to right: FAN 0-4, PSU0, PSU1. The 'FAN N' legends with left-pointing
    triangles are printed at the top-right of each fan opening; like the
    S9510-28DC's they render under the seated module and show only with the
    bay empty. The red 'E' (exhaust) badge and airflow-colour handle are
    properties of the FRU face, not the chassis, and the existing fan/PSU
    skins do not draw the badge - noted, not modelled. The psu-401 skins were
    drawn from the S9510-28DC's blue-latch intake variants, so in the
    front-to-back configurations the rendered latch colour is blue where the
    photographed DESR/AESR units have red latches; one skin per component,
    noted rather than redrawn.
  grounding: >-
    photo + HIG - the rear-left plate carries two M4 grounding holes with the
    earth symbol below (HIG Figure 24 shows the lug and screws landing exactly
    there; positions photo-measured at (6.3, 7.9) and (6.3, 23.1), symbol
    centre (6.3, 35.5)). The HIG names a second designated location on the
    side of the switch under a yellow 'REMOVE LABEL FOR SYSTEM GROUNDING'
    label (Figure 23); it is drawn on the left face near the rear as a yellow
    decor rect, position estimated from the isometric figure.
  top: >-
    estimated from HIG Figure 5 (top view, dimensioned 440 x 440) and the
    datasheet's angled render: four pressed stiffening grooves (the upper two,
    nearer the rear, start right of centre; the lower two run most of the
    width) and screw heads along the rear and front edges. Groove and screw
    positions are estimated - the figure is a photograph-like view with no
    internal dimensions. AXIS CONVENTION: y = 0 is the REAR edge, per the
    house top-view rule; the grooves are nearer the front, so they sit at
    large y. Content is symmetric left-right except the groove stagger, which
    was checked against the angled photo (short grooves toward the rear).
  bottom: >-
    no photograph or figure of the underside exists in the intake. The face is
    sized from the datasheet and carries only the compliance/serial sticker
    that every unit of this class has, position and size estimated
    (common/compliance-sticker). See gaps.
  sides: >-
    estimated - HIG Figure 13 (rack-bracket positions) shows both sides as
    rows of screw/rivet heads on two lines with bracket hole clusters at the
    front, rear and a middle position 220.5 mm from the front face. Rivet
    positions are estimated off that figure; only count and the two-row
    arrangement were taken. AXIS CONVENTION: on the LEFT view x = 0 is the
    REAR; on the RIGHT view x = 0 is the FRONT (renderer convention). The
    yellow grounding label sits on the left face near the rear, i.e. at small
    x in the left view.
  attrs: >-
    datasheet (Key Features, Specifications, Environmental, Performance,
    Regulatory Compliance and Accessories sections). Compliance strings are
    transcribed as printed, not tidied. The '80 km maximum support distance'
    rows of the HIG port table describe optic reach, not the switch, and are
    not device attrs.
  power: >-
    datasheet - 'Typical power: 111.3 Watts (no transceiver)' is explicitly a
    bare-optics figure, hence power-envelope: bare. HIG Connecting Power
    section (both DC and AC versions) - 'The maximum system power consumption
    is 203.3 watts'; the vendor does not qualify what population that maximum
    assumes, so per the capture rule it is filed as power-max-w with this
    sentence as the record that the qualifier is the vendor's silence, not a
    measurement scope we chose. Inputs: AC 100-240 V 6 A, DC -36 to -75 V
    16 A (datasheet Power Specs; HIG repeats both and adds the per-PSU fuse
    ratings 12 A AC / 20 A DC and the 5000 m power-source altitude rating).
  part-numbers: >-
    FRU part numbers are the datasheet's own ordering list (PSU-401-DESR /
    PSU-401-AESR exhaust, PSU-401-DISB-1 / PSU-401-AISB intake,
    FAN-402825-CD intake / FAN-402825-HD exhaust; exhaust FRUs pair with
    front-to-back system airflow and red latches, intake with back-to-front
    and blue, per HIG sections 4 and the airflow caution). NO orderable
    chassis SKU appears in either document - after the S9510-28DC lesson this
    is recorded as a statement about these two documents, not about the world;
    see gaps. Configuration FRU models are set per configuration via
    component-attrs.
  eol: >-
    searched 2026-08-28, "UfiSpace S7801-54XS end of life" - no announcement
    found; the product remains listed on ufispace.com and distributor pages
    (stordis.com). Hence lifecycle eol none-announced.
attrs:
  performance:
    switching-capacity: 1.28 Tbps
    packet-buffer: 32 MB
    port-modes-sfp-plus: 1G/10G
    port-modes-qsfp28: 40G/100G
  power:
    power-typical-w: '111.3'
    power-max-w: '203.3'
    power-envelope: bare
    ac-input: 100 to 240V, 6A
    dc-input: -36 to -75V, 16A
    psu-redundancy: 1+1 active-active, hot-swappable
  thermal:
    fan-redundancy: 4+1, hot-swappable
  environmental:
    operating-temp: 0C to 45C (32F to 113F)
    operating-humidity: 5% to 95% (RH), non-condensing
    storage-temp: -40C to 70C (-40F to 158F)
    storage-humidity: 5% to 95% (RH), non-condensing
  platform:
    asic: Broadcom Trident3-X5 BCM56771
    cpu: Intel Denverton 4-Core @ 1.6GHz
    memory: 8 GB DDR4 (Up to 32GB)
    storage-ssd: 32 GB SSD
    bmc: AST2620
  features:
    optics-sfp-plus: 10G SFP+ SR/LR/ER
    optics-qsfp28: 100G QSFP28 SR/LR/ER
  compliance:
    safety: UL 62368-1; IEC 62368-1
    emc: FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A;
      EN 300 386; EN 55035; VCCI CISPR 32, Class A
    environment: WEEE
    other-approvals: MTCTE; NOM
  lifecycle:
    eol: none-announced
chassis:
  width: 440
  height: 43.8
  depth: 440
  ru: 1
  weight-kg: 8.9
gaps:
- what: port-led-semantics
  scope: [sfp-plus, qsfp28, port-leds]
  reason: vendor-silent
  note: >-
    HIG section 10 tables the five system lamps, the PSU and Fan FRU lamps and
    the management jack, and gives no table for the SFP+ arrow lamps or the
    QSFP28 lane lamps. The 48 led-arrow and 24 led-dot lane placements
    therefore keep their component default of off/on rather than an invented
    link/activity vocabulary. Same finding, same shape, as the S9510-28DC.
  wanted: >-
    a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a
    live unit with ports in known states
- what: chassis-part-numbers
  scope: [dc-front-to-back, ac-front-to-back, dc-back-to-front, ac-back-to-front]
  reason: vendor-silent
  note: >-
    Neither the datasheet nor the HIG prints an orderable chassis SKU - the
    datasheet's Available to Order section lists only PSU and fan FRU part
    numbers. The S9510-28DC had the same silence and two real SKUs existed
    anyway (supplied by Jason), so this is a statement about the two documents
    held, not a claim that no SKU exists.
  wanted: a UfiSpace ordering guide or a quote naming the chassis SKUs
- what: bottom-face
  scope: [bottom]
  reason: needs-photo
  note: >-
    No underside photograph or figure exists in the intake; the bottom carries
    only an estimated compliance sticker.
  wanted: a photograph of the underside on a bench
- what: side-face-detail
  scope: [left, right]
  reason: needs-drawing
  note: >-
    HIG Figure 13 shows the sides only as isometric bracket-position art;
    rivet rows and bracket hole clusters are drawn at estimated positions, and
    the yellow grounding-label location on the left face is estimated from
    Figure 23.
  wanted: a straight-on side photograph or a mechanical drawing
groups:
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the front-panel unit indicators - SYS, FAN, PS0, PS1 and the ID beacon
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: every indicator that belongs to a particular port, ordered by that port
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the management block at the left-hand end of the faceplate - the
      out-of-band RJ45, a USB 3.0 Type-A service port and the RS-232 console,
      plus the recessed reset button. Same cluster, and the same word for it,
      as the other devices in the library that have one
  psus:
    term: PSU
    role: service
    index-origin: 0
    description: vendor numbers them PSU0 and PSU1 on the faceplate
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 active-active, hot-swappable'
  fans:
    term: Fan
    role: service
    index-origin: 0
    description: vendor numbers them FAN 0-4 on the rear silkscreen
    attrs:
      redundancy: '4+1'
      redundancy-note: '4+1 - 4+1, hot-swappable (attrs fan-redundancy)'
