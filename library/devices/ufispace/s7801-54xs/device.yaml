    airflow: front-to-back
    component-attrs:
      psu-401-dc:
        model: PSU-401-DESR
      fan-402825:
        model: FAN-402825-HD
  dc-front-to-back:
    kind: orderable
    description: DC power (2x PSU-401-DESR, exhaust), front-to-back airflow, FAN-402825-HD fans
    airflow: front-to-back
    component-attrs:
      psu-401-dc:
        model: PSU-401-DESR
      fan-402825:
        model: FAN-402825-HD
