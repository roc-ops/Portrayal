format: 1
kind: device
name: m3000-14xc
version: 3.0.1
maturity: modelled
manufacturer: UfiSpace
model: M3000-14XC
portfolio:
  line: Telecoms
  family: Fronthaul Multiplexer
  series: Fronthaul Series
description: UfiSpace M3000-14XC 25G/100G Fronthaul Multiplexer - 1RU O-RAN
  shared-cell FHM, 12x SFP+ 10G (8 to O-RU, 4 to O-DU) + 2x QSFP28 (reserved),
  full timing (GNSS/1PPS/10MHz/ToD/BITS), Stratum 3E OCXO, dual 200W PSUs,
  4 fixed fans, front-to-back airflow
profile: networking
provenance:
  stack-orientation:
    confidence: drawing
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the port lamps, which point up
      over down: the 2 SFP pairs (port-8/port-9 and port-10/port-11). Decided by the reading of
      the cages recorded in this provenance: the 1 QSFP pair (port-12/port-13). 1 of these were
      drawn with the upper cage turned before the std cage art moved its lip to the bottom of the
      opening; turning them keeps the lips in the middle band where they were drawn and seats
      every optic bail-outward. common/qsfp-cage@3 draws its bezel flange on the belly side with
      the opening centred across it; every opening stays where it was measured, the boxes moving
      by 0.075 across. The QSFP28 pair's four lamps are all drawn pointing up, but the recorded
      photo reading - mirrored about the band - outranks them.
  sources:
    confidence: datasheet
    note: >-
      datasheet (m3000-14xc-datasheet.pdf, converted) and Hardware Installation Guide
      (m3000-14xc-hig.pdf, converted, Figures 1-35), plus three vendor renders/photos:
      m3000-14xc-2-front.jpg (6717x669 straight-on front), m3000-14xc-3-rear.jpg (6715x669
      straight-on rear), m3000-14xc-1-angle.png (three-quarter view). No mechanical drawing of the
      chassis exists in the intake; the PSU has one (HIG Fig 6).
  chassis:
    confidence: datasheet
    note: >-
      datasheet - '1 RU, 440 x 250 x 43.5 mm', 'Net weight: 4.18 kg', repeated by the HIG's
      Component Physical Information table ('M3000-14XC (W x D x H) 440 x 250 x 43.5mm', 'Chassis
      without FRU 4.18kg'). The 440 mm is the BODY, not a rack face: the HIG's Space Clearance
      section says 'width is 17.32 inches (44cm) and shipped with rack mount brackets suitable for
      19 inch racks' - the bolt-on brackets (50.4 x 43 x 20 mm each, accessory item 3) make up the
      difference and are not drawn. Depth 250 is 'without the field replaceable units'; the PSU
      handles stand 10 mm proud (HIG Fig 6, 221 vs 211 mm).
  front-photo-scale:
    confidence: photo-measured
    note: >-
      photo-measured - the front photo is 6717 x 669 px for a 440 x 43.5 mm face: aspect 10.04
      against a true 10.11 (0.8% out), so it passes the aspect gate and positions were taken from
      it at 15.27 px/mm. All front placement coordinates below are photo-measured at that scale
      unless marked otherwise. The rear photo (6715 x 669, aspect 10.04) was used the same way.
      The HIG's Figure 5/9 faceplate figures agree on arrangement and supplied the callout names.
  psu-bays:
    confidence: photo-measured
    note: >-
      photo-measured positions (psu-0 face at x 6.4, psu-1 at 64.2, both y 1.6); bay size 50.5 x
      40.2 from the HIG Component Physical Information table and Fig 6 drawing. Between them a
      black divider strip printed PSU0 / PSU1 vertically with a pair of pointer triangles - the
      strip is decor, the legends silkscreen. Vendor spells the bays PSU0 and PSU1, so the psus
      group is index-origin 0.
  timing-block:
    confidence: photo-measured
    note: >-
      photo-measured - 1PPS SMB centre (127.4, 9.1), 10MHZ SMB centre (127.5, 20.8), GNSS ANT SMA
      centre (127.8, 31.9), each labelled above its jack; M3000-14XC wordmark baseline at y 39.8
      starting x 119.7. Jack outline sizes are the common/sma-jack and common/smb-jack components'
      own (registry-derived), not re-measured.
  status-leds:
    confidence: photo-measured
    note: >-
      photo-measured - six lamps in one column at x 144.9-147.5, centres y 19.3 to 31.8 on a 2.5
      mm pitch, labels printed dark on a white strip to their right (decor at x 148.3).
      Top-to-bottom order GNSS SYNC SYS FAN PWR ID as printed. State vocabularies transcribed from
      HIG section 10 Front Panel LED tables; the ID lamp's blue beacon row included.
      common/led-rect is 4.6 mm wide against ~2.6 in the photo and its skin draws a bezel slightly
      past its contract, so the column is drawn at x 143.6 (0.8 left of measured) and the labels
      at 149.8 to keep both clear of the bezel; pitch drawn at 2.7 rather than the measured 2.5
      because the contract's 2.6 mm lamp cannot sit on a 2.5 pitch without overlapping (L13).
  bits-tod-stack-jacks:
    confidence: photo-measured
    note: >-
      photo-measured - BITS/TOD are one silver ganged shell x 156.9-174.2, y 9.4-36.4 with two
      8P8C jacks on a ~13.8 mm vertical pitch; the OOB/STACK pair is a second shell x 207.5-224.8,
      y 9.8-35.2 on a 13.2 mm pitch. Both pitches are under the 16 mm std/rj45 bezel, so all four
      jacks are std/rj45-ganged (12.7 x 11) with the shells drawn as panel decor per the
      s9510-28dc precedent. ORIENTATION READ AT 6x ZOOM: in each stacked pair the TOP jack is
      keyway-up (rotate: 180) and the BOTTOM jack keyway-down - the rows mirror, as ganged stacks
      do. The management jacks carry corner lamps (top pair at y 9.9 unlit, bottom pair
      photo-detected at (210.1, 33.7) and (221.9, 33.7) lit green); semantics from the HIG
      Management port LED table.
  console-usb:
    confidence: photo-measured
    note: >-
      photo-measured - one silver bezel x 181.2-199.6, y 12.0-35.2 holding the RJ45 console
      (keyway-up, rotate: 180; labelled IOIOI above) over a USB-A socket (labelled with the USB
      trident below, drawn as a path mark). The HIG calls the RJ45 'the RJ45 port labelled IOIO'
      and the USB 'a maintenance port', USB 2.0 by the accessory cable. THE TONGUE FOLLOWS THAT
      READING AND IT IS THE WEAKEST ONE HELD: the placement asks std/usb-a@1 for its `usb2` skin,
      so the drawing no longer paints the USB-3 blue, but the version behind it is inferred from a
      shipped cable rather than stated of the port. A line in the HIG naming the port's version
      would settle it either way.
  sfp-row:
    confidence: photo-measured
    note: >-
      photo-measured - eight cages in two ganged blocks of four; the per-port lamps above them
      were colour-detected at x 240.09, 254.32, 268.57, 282.80 / 305.84, 320.08, 334.30, 348.56 (y
      21.7): pitch 14.24 mm within a block, which is the std/sfp-ganged 14.25 contract to 0.1%, so
      cages sit at lamp-centre minus 7.125. Block gap 8.7 mm. Cage tops at y 24.6 (aperture
      24.8-35.0 in the photo). Port numbers 0-7 printed dark on an olive-yellow band (decor) under
      each block, numeral centred per cage.
  sfp-2x2:
    confidence: photo-measured
    note: >-
      photo-measured - ports 8-11 are a 2x2 ganged block, columns at x 364.0 and 378.25 (numeral
      centres 371.1 and 385.4 on the blue bands above and below), top row y 8.8, bottom row y 24.5
      and MIRRORED about the central silver band, checked at 4x zoom - belly-to-belly, so the
      bottom row is rotate: 180 under the library's stack convention. The
      band (y 19.2-24.4) carries an up/down lamp pair per column: up = top port, down = bottom
      port, photo-detected at x 369.5/373.3/383.8/387.6, y centre 22.8. Numbering runs down
      columns (8 over 9, 10 over 11), the vendor's own print. Blue bands are faceplate paint,
      drawn as decor so the numerals stay readable.
  qsfp28:
    confidence: photo-measured
    note: >-
      photo-measured - one stacked pair x 400.9-421.0 (common/qsfp-cage@3 19.5 wide + shell), port
      12 top (y 9.4) and port 13 bottom (y 25.5, rotate: 180), mirrored about the band like the
      s9510 pair - which under the library's stack convention is the lower cage turned. Central silver band y 19.7-25.5 carries, left to right, two small up triangles, two
      dark round holes, two more up triangles (lamp centres ~403.4/406.0 and 416.0/418.1, y 22.6);
      the holes are drawn as dark decor dots. Green '12'/'13' label pads above and below (decor,
      numerals silkscreen). Below the block two small dark pads (y 38.0) each hold two more unlit
      triangles - drawn as lamps assigned left pad to port 12, right pad to port 13 BY SYMMETRY
      ONLY; see the qsfp28-led-ownership gap.
  vents-front:
    confidence: photo-measured
    note: >-
      photo-measured - hex vent field x 228.5-357.0, y 3.6-17.8, its left edge actually a
      hex-follow staircase drawn here as a straight edge; above it and running on to x 420 a 2.4
      mm strip of short dark slots (y 1.0-3.4) modelled with the slots-h pattern, pattern-offset
      chosen so a slot row lands inside the strip.
  ground-mark:
    confidence: photo-measured
    note: >-
      photo-measured - earth symbol in a circle printed at (430.1, 21.6) at the far right of the
      faceplate. No connector: the bonding points are on the right flank (HIG section 8); this
      mark is taken as pointing at them.
  rear:
    confidence: photo-measured
    note: >-
      photo-measured - four circular hex fan grilles, centres x 44.5/94.5/144.5/194.5 on an
      exactly 50.0 mm pitch (edge pairs colour-thresholded from the rear photo), ~36 mm diameter,
      drawn as rx-18 vent-pattern decor. THE FANS ARE FIXED, NOT FRUs - '4 Fixed Fans' (datasheet
      and HIG Fig 8) - so there are no fan bays and no fan module components; the FAN lamp's for:
      is the chassis. Right-hand hex vent field x 320-423, y 3.5-25. Five case screws
      photo-measured (the centre one at (214, 34) is a larger cross-recess feature, drawn with the
      same screw-head part). No rear silkscreen is printed.
  top:
    confidence: estimated
    note: >-
      estimated - no drawing dimensions the lid. Three shallow oval recesses per row, two rows,
      positions taken as fractions of the HIG Fig 5 top view (aspect not verified against 440 x
      250, so treated as schematic): rows at y 64 and 182, ovals starting x 14.8/74.2/125. AXIS: y
      = 0 is the REAR, per the house top-view convention; the Fig 5 top view prints the front (PSU
      edge) at the bottom. Four perimeter screws estimated from the angle photo. Content is
      deliberately sparse - the lid is plain metal.
  bottom:
    confidence: estimated
    note: >-
      estimated - no source shows the underside; the compliance sticker placement is the house
      convention (every shipped unit carries one), position estimated. A bottom view mirrors left
      and right; the sticker is the only content, so the axis does not bite.
  left:
    confidence: estimated
    note: >-
      estimated - the left flank appears in the angle photo as plain metal with perimeter screws;
      three screw heads drawn at estimated positions. AXIS: x = 0 is the REAR on a left view
      (viewer3d.js convention). Content is honestly sparse rather than blank.
  right:
    confidence: drawing
    note: >-
      drawing-fraction estimates - HIG Fig 22 shows this flank (the timing jacks appear at its
      left edge, so the front is at the figure's left): two hex vent fields at roughly 0.29-0.44
      and 0.67-0.84 of the depth from the front, and the designated grounding location (two tapped
      holes for the accessory lug, M4 screws) ~37-82 mm behind the front face, drawn as two
      common/ground-lug holes at x 45/58. The figure's aspect was not verifiable against 250 x
      43.5, so all x positions are fractions, not measurements. AXIS: x = 0 is the FRONT on a
      right view (viewer3d.js convention).
  power:
    confidence: datasheet
    note: >-
      datasheet - 'Max power: 103.9 Watts', with no configuration or ambient stated, so
      power-envelope is unstated. THE HIG DISAGREES: its Connecting Power section (both DC and AC)
      says 'The maximum system power consumption is 197 watts' - same measure, same scope,
      different value; recorded as a sources-disagree gap and the datasheet figure carried per the
      source-role table. PSU inputs from the datasheet (AC 100-240 V 3 A, DC -36 to -75 V 8 A);
      per-PSU rating on the ufispace/psu-201-* contracts.
  environment:
    confidence: datasheet
    note: >-
      datasheet - operating -40 to 70 C, storage -40 to 70 C, operating humidity 5-95% RH, storage
      5-93% RH (the datasheet's OCR splits the digits; the ranges reassemble unambiguously). THE
      HIG's preparation checklist instead says 'working temperature is -40 to 65 C' - recorded as
      a sources-disagree gap, datasheet carried.
  attrs:
    confidence: datasheet
    note: >-
      datasheet (Specifications / Performance / Regulatory Compliance / Supported Accessories
      sections) and HIG (port overview table for reach, section 11 for the console settings,
      Installing an Antenna for GNSS constellations and active-antenna limits). Port roles: '8 x
      10G SFP+ ports to O-RU', '4 x 10G SFP+ ports to O-DU; only port 8 is available for now,
      ports 9-11 are reserved', '2 x 100G QSFP28 (Reserved)'. Compliance transcribed verbatim, not
      tidied.
  part-numbers:
    note: >-
      none stated - neither the datasheet nor the HIG prints an orderable chassis SKU (the
      accessory list names only the PSUs, PSU-201-DISB/PSU-201-AISB). No SKU is invented; the
      configurations carry none.
  vent-islands:
    note: >-
      derived - a vent field is a perforation and the drawing said so, but the marks printed
      inside one were floating on air (L64). The vendor interrupts the perforation where it
      prints, so each of those marks now has a solid patch under it in the chassis colour, drawn
      over the vent the way ufispace/s9600-72xc paints its port bands over one. The patch is the
      printing's own footprint plus 0.4 mm, which is what the S9610-36D's front render measures:
      its slots stop 0.4 mm outside each lamp cluster and resume 0.4 mm past it. Where a vent is
      simply measured wider than the metal it reaches, this states the metal that the printing
      proves is there without re-measuring the field.
  lifecycle:
    note: >-
      searched 2026-08-28, 'UfiSpace M3000-14XC end of life' - no announcement found; the product
      page is live and the unit is actively marketed. none-announced is a real finding, not an
      omission.

attrs:
  performance:
    coverage: One FHM supports up to 8 RUs; cascading can be used to extend coverage
    jumbo-frame: up to 9000 bytes
    reach-sfp-plus: 80 km max (HIG port overview, ports 0-11)
    reach-qsfp28: 10 km max at 40/100G (HIG port overview, ports 12-13)
  power:
    power-max-w: 103.9
    power-envelope: unstated
    psus: 2x 200 W 1+1 active-active, hot-swappable (intake airflow)
    psu-ac-input: 100-240 VAC, 3 A max
    psu-dc-input: -36 to -75 VDC, 8 A max
  thermal:
    fans: 4 fixed fans, front-to-back airflow
  environmental:
    operating-temp: -40 to 70 C (datasheet; HIG checklist says -40 to 65 C - see gaps)
    storage-temp: -40 to 70 C
    operating-humidity: 5% to 95% RH, non-condensing
    storage-humidity: 5% to 93% RH, non-condensing
  platform:
    cpu: ARM Cortex-A53 4-core 64-bit @ 1.0 GHz
    memory: 4 GB DDR4
    fpga: Intel Stratix 10 TX (O-RAN shared cell function)
  features:
    oran: O-RAN shared cell, Cascade-FHM mode
    fronthaul: various fiber length delay compensation; configurable data compression
      mode, IQ data width and U/C plane VLAN ID
    timing: Stratum 3E OCXO, ITU-T SyncE, IEEE 1588v2 T-TC (G.8275.1; T-BC, T-GM and
      G.8264 ESMC available with future premium versions), Class C
    timing-interfaces: GNSS SMA in, 1PPS SMB in/out, 10MHz SMB in/out, BITS RJ48
      in/out, ToD RJ45 in/out
    gnss: GPS L1C/A, GLONASS L1OF, BeiDou B1, Galileo E1B/C; passive or active antenna
      auto-detected (active supply 5 V DC / 150 mA, min RF sensitivity -166 dBm);
      activated with a software license key on future premium versions
    optics-sfp-plus: 10G SFP+ SR, LR, ER (datasheet supported accessories)
    optics-qsfp28: none published - the QSFP28 ports are reserved and the datasheet's
      supported-accessories list carries only 10G SFP+ optics
  management:
    protocols: CLI, SNMP, NETCONF
    console: RJ45 serial, 115200 8N1, no flow control
  compliance:
    safety: UL 62368-1; IEC 62368-1; BSMI
    emc: FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class A; EN 300 386;
      EN 55035; EN 303 413; EN 301 489; BSMI; VCCI CISPR 32 Class A; KS C 9832 Class A;
      KS C 9835
  lifecycle:
    eol: none-announced
