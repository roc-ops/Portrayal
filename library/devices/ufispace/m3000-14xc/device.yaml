gaps:
- what: system-power-figure
  scope: [power-max-w]
  reason: sources-disagree
  note: >-
    The datasheet's Environmental section prints 'Max power: 103.9 Watts'; the HIG's
    Connecting Power section says, for both DC and AC versions, 'The maximum system
    power consumption is 197 watts'. Same measure (maximum system consumption), same
    scope (the whole box), values 1.9x apart. The manifest carries the datasheet
    figure because the datasheet is authoritative for the box's own power figure;
    the HIG number may be a provisioning ceiling tied to the 200 W PSU rating, but
    the HIG states it as consumption, so that reading cannot be assumed.
  wanted: a nameplate photo, or a UfiSpace clarification of which figure is the draw
- what: psu-rating
  scope: [psu-0, psu-1]
  reason: sources-disagree
  note: >-
    The datasheet's accessory list rates the orderable PSUs at 200 W ('PSU-201-DISB,
    200W DC PSU' / 'PSU-201-AISB, 200W AC PSU') and the HIG recommends 'a reserve of
    at least 200 watts on each power circuit'; the HIG's Figure 5 callout instead
    prints '2 x 120W AC or DC PSU'. The components carry 200 W because that line
    names the exact part numbers.
  wanted: a PSU label photo or a UfiSpace PSU-201 datasheet
- what: operating-temperature
  scope: [operating-temp]
  reason: sources-disagree
  note: >-
    Datasheet operating range -40 to 70 C; HIG preparation checklist 'working
    temperature is -40 to 65 C'. attrs carry the datasheet range.
  wanted: the vendor's thermal specification note stating which bound applies
- what: port-led-semantics
  scope: [sfp-plus-ru, sfp-plus-du, qsfp28, port-leds]
  reason: vendor-silent
  note: >-
    HIG section 10 tables the system lamps (GNSS, SYNC, SYS, FAN, PWR, ID), the PSU
    FRU lamp and the management jack lamps, and gives no table for the port lamps -
    the eight dots over the SFP row, the four up/down triangles in the 2x2 band and
    the triangle arrays around the QSFP28 block all keep their component default of
    off/on rather than an invented link/activity vocabulary.
  wanted: a per-NOS LED table, or photographs of a live unit with ports in known states
- what: qsfp28-led-ownership
  scope: [led-port-12-a, led-port-12-b, led-port-13-a, led-port-13-b, led-port-12-c, led-port-12-d, led-port-13-c, led-port-13-d]
  reason: vendor-silent
  note: >-
    The QSFP28 band prints two triangle pairs separated by two round holes, and two
    more pairs sit on dark pads below the block. Which pair belongs to which port is
    not documented anywhere in the intake; the assignment here (left to port 12,
    right to port 13) is symmetry, not a source.
  wanted: a vendor faceplate legend or a lit-unit photograph
- what: second-grounding-location
  scope: [ground-1, ground-2]
  reason: needs-photo
  note: >-
    HIG section 8 says 'there are two locations on the case in which the grounding
    lug may be fixed' and Figure 22 shows one, on the right flank behind the front
    face. The second is shown in no figure and no photo in the intake reaches it.
    Only the documented one is drawn.
  wanted: a photograph or figure of the second designated grounding location
- what: fixed-fan-detail
  scope: [rear]
  reason: vendor-silent
  note: >-
    The fans are fixed ('4 Fixed Fans') so no FRU contract exists to carry size or
    power; the vendor publishes neither a fan power figure nor a grille dimension.
    Grille diameter and pitch here are photo-measured; nothing else is stated.
  wanted: a UfiSpace service note or internal drawing
groups:
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the chassis indicators - GNSS, SYNC, SYS, FAN, PWR, ID as printed
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: every indicator that belongs to a particular port, ordered by that port
  psus:
    term: PSU
    role: service
    index-origin: 0
    description: vendor spells the bays PSU0 and PSU1 on the divider strip
    attrs:
      redundancy: '1+1'
      redundancy-note: '2x 200 W 1+1 active-active, hot-swappable (intake airflow)'
  sfp-plus-ru:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: ports 0-7, the O-RU-facing fronthaul ports (datasheet '8 x 10G SFP+
      ports to O-RU, support for up to 4T/4R antenna setups')
  sfp-plus-du:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: ports 8-11, the O-DU-facing ports - 'only port 8 is available to use
      for now, ports 9-11 are reserved' (datasheet)
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
    description: ports 12-13, '2 x 100G QSFP28 (Reserved)' - 40/100G per the HIG port
      overview
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: the timing block left of the lamp column - GNSS antenna on SMA, 1PPS and
      10MHz on SMB, BITS on RJ48 and ToD on RJ45. Five media, one job, exactly the
      cluster the s9510-28dc carries
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the management cluster - RJ45 serial console, USB-A maintenance port, the
      OOB and STACK RJ45 pair, and the recessed reset button
