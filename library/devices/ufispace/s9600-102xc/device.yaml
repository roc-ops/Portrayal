format: 1
kind: device
name: s9600-102xc
version: 3.0.1
maturity: modelled
manufacturer: UfiSpace
model: S9600-102XC
portfolio:
  line: Telecoms
  family: Open Aggregation Router
  series: S9600 Series
description: UfiSpace S9600-102XC 25G/100G Disaggregated Open Aggregation Router - 2RU,
  96x 1/10/25G SFP28 + 6x 40/100G QSFP28 + 2x 10G SFP+ management, full timing
  (GNSS/1PPS/10MHz/ToD) with Stratum 3E OCXO, SRv6, dual 1300W hot-swap PSUs and four
  hot-swap fans, rear-service power and cooling
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the port lamps, which point up
      over down: the 49 SFP pairs (mport-0/mport-1 to port-94/port-95). Decided by the rule, not
      an observation, so a photograph of the stack overturns it: the 3 QSFP pairs (port-96/port-97
      to port-100/port-101).
  sources:
    confidence: datasheet
    note: >-
      datasheet (s9600-102xc-datasheet.pdf, converted) and Hardware Installation Guide
      (s9600-102xc-hig.pdf, converted, Figures 1-26), plus three vendor images:
      s9600-102xc-1-view.png (520x237), -2-front.jpg and -3-rear.png (both 520x150). ALL THREE
      PHOTOS ARE TOO SMALL TO MEASURE - at 520 px across a 436 mm face they resolve 1.2 px/mm, so
      a 14.25 mm port pitch is seventeen pixels. They were used for colour and confirmation only.
      No mechanical drawing of the chassis exists in the intake. Front and rear geometry comes
      from the HIG's own pages re-rendered at 600 dpi (pdftocairo), not from the extracted figure
      PNGs.
  front-figure-scale:
    confidence: drawing
    note: >-
      drawing - HIG page 11, the Figure 8 port-overview elevation, re-rendered at 600 dpi. GATE 1:
      the drawn faceplate measures 3749 x 754 px (x 832-4580, y 1736-2490), which is 8.599 px/mm
      against 436 mm and 8.598 px/mm against 87.7 mm - 0.01% apart. This is the most orthographic
      figure in the UfiSpace intake and every front coordinate below is measured on it at 8.5985
      px/mm. TWO EDGES HAVE TO BE EXCLUDED OR THE GATE FAILS: the horizontal caption rule 70 px
      below the panel (including it gives 4.49 against a true 4.97, a 9.6% error that reads as a
      schematic figure), and the rack-mount ear tabs that stick out past both ends at the top and
      bottom of the face. Neither is metal between the ear folds.
  chassis:
    confidence: datasheet
    note: >-
      datasheet '2 RU, 436 x 609 x 87.7 mm', 'Weight: 15.19kg (without FRU)', with the HIG
      Component Physical Information table giving the depth to a decimal - 'S9600-102XC (W x D x
      H) 17.16 x 24 x 3.45 in (436 x 609.6 x 87.7mm)' - and the same weight ('Chassis without FRU
      33.49lb (15.19kg)'). 436 IS THE BODY, NOT THE RACK FACE: the HIG Space Clearance section
      says 'The S9600-102XC width is 17.16 inches (43.6cm) and shipped with a rack mount brackets
      suitable for 19 inch (48.3cm) wide racks'. The brackets are visible in Figure 8 as tabs
      beyond both ends of the face and are not drawn. Depth 609.6 is 'without the field
      replaceable units'; Space Clearance adds that the fan handle stands 29 mm proud and the PSU
      handle 30 mm.
  port-pitch:
    confidence: drawing
    note: >-
      drawing-measured, AND MEASURED FROM A FEATURE THAT REPEATS ONCE PER PORT rather than from
      the filled rectangles the figure draws for the module faces. Those fills are 8.4 mm tall and
      about 13.5 wide - the transceiver's own face, not the port's share of the bezel - and
      centre-to-centre they would have given a pitch a fraction wide, which drifts a whole column
      across twelve of them. Three independent per-port rulers were used instead and all three
      agree: the bright vertical separator lines between cages in block A sit at 58.03, 72.33,
      86.46, 100.71, 115.07, 129.38, 143.56, 157.69, 172.12, 186.30 and 200.55 (ten intervals,
      mean 14.25); the black printed up/down arrow pairs on the yellow band above them repeat at
      14.253; and twelve columns of 14.25 span 171.0, which lands block A's right edge on 214.7
      against a measured shell edge of 214.69 and block B's on 388.5 against 388.79. 14.25 mm is
      also exactly std/sfp-ganged's contract width (SFF-8433 port pitch B04), so the standard part
      fits with no gutter.
  sfp28-blocks:
    confidence: drawing
    note: >-
      drawing-measured - the 96 SFP28 ports are FOUR blocks of twelve columns by two rows, not one
      field: an upper pair at x 41.3-214.7 and 216.9-388.8, and a lower pair on the same two x
      ranges. First cage of the left blocks at x 43.70, of the right blocks at 217.50. Rows
      measured from the module faces at 16.86-25.24 and 32.10-40.59 (upper) and 46.98-55.01 and
      61.99-70.13 (lower); the port OPENING is 10.4 tall against that 8.4 mm face, so the cages
      sit at y 15.90 / 31.10 and 46.00 / 61.20 - a 15.2 mm row pitch, which is std/sfp-ganged's
      own measured 15.00 belly-to-belly to within the figure. NUMBERING RUNS DOWN COLUMNS AND
      ACROSS BLOCKS: 0-23 upper-left, 24-47 upper-right, 48-71 lower-left, 72-95 lower-right, even
      on the top row of each.
  sfp28-legend:
    confidence: drawing
    note: >-
      drawing-measured - each block carries one printed band on its OUTER edge: yellow above the
      upper blocks (y 11.4-14.5) and cream below the lower ones (y 72.8-75.9). The band prints,
      per column, the even port number, a solid up triangle, a solid down triangle and the odd
      port number - the legend that says which of the two lamps in the central land belongs to
      which row. Read at 5x zoom on the upper band, where the sequence '...11 12 up down 13 14...'
      is unambiguous. The numerals are transcribed here; the triangles are not, because they are a
      legend FOR the lamps and the lamps are modelled as parts.
  sfp28-lamps:
    confidence: drawing
    note: >-
      drawing-measured by colour - two pale-green arrow lamps per column in the light land between
      the rows, up serving the top (even) port and down the bottom (odd) one. Detected centres sit
      5.4-5.6 and 8.9-9.3 mm from each cage's left edge, and the triangles themselves read about
      1.5 mm across. Drawn with common/led-arrow-sm (2.25 x 2.0) rather than common/led-arrow (3.6
      x 3.2): AT MATCHED SCALE THE LARGER PART WAS TWICE THE DRAWING'S ARROW and dominated every
      land on the face, which is the kind of thing only the side-by-side shows. Anchored so the
      lamp centres stay on the measured 5.60 and 9.30. Land y 26.3-31.1 (upper) and 56.4-61.2
      (lower), lamps centred in it.
  qsfp28:
    confidence: drawing
    note: >-
      drawing-measured - six QSFP28 in TWO blocks, not one: a two-column pair at x 391.4-430.5
      carrying 96/98 on the top row and 97/99 on the bottom, and a single column at x 391.4-411.4
      carrying 100 over 101. Cage columns at 392.30 and 411.30, a 19.0 mm pitch against
      std/qsfp-ganged's 18.5 contract width, so the cages do not abut. The QSFP rows are CENTRED
      ON THE SFP ROWS, not aligned to their tops: the drawn faces span 16.1-25.9 and 31.3-40.7
      against the SFP faces' 16.9-25.2 and 32.1-40.6, same centres, taller port. Cages therefore
      sit at y 16.31 / 31.51 and 46.41 / 61.61, each 9.58 tall and centred on the same row centre
      as its SFP neighbours.
  qsfp28-lamps:
    confidence: drawing
    note: >-
      drawing-measured - the land between each QSFP pair carries a dense dot matrix rather than
      the SFP blocks' two arrows: four lamps per port, drawn with ufispace/lane-led-quad (14.4 x
      2.6, four round lamps on a 3.94 pitch, built for exactly this family). One strip per port,
      stacked in the 5.62 mm land at y 26.0 and 28.8 (upper block) and 56.1 and 58.9 (lower).
      WHICH STRIP SERVES WHICH PORT IS BY POSITION ONLY - the figure resolves the dots but not
      their wiring - see the qsfp-lane-lamp-ownership gap.
  qsfp28-plate:
    confidence: drawing
    note: >-
      drawing-measured - each QSFP block sits against an olive-green perforated plate, x
      391.3-433.1 y 7.5-14.5 above the upper block and a shorter one below the lower block, with
      two rows of round holes and one bright vertical clip at the right-hand edge of each cage
      column. Drawn as vent-patterned decor with the clips as light pads. WHAT IT IS, IS NOT
      STATED anywhere in the guide - see the qsfp-green-plate gap.
  mgmt-sfp-plus:
    confidence: drawing
    note: >-
      drawing-measured - the two 10G SFP+ management ports are a one-column, two-row ganged block
      of their own at x 25.6-40.5, sharing the upper blocks' rows exactly (drawn faces at
      16.1-25.4 and 31.0-41.0), with their own up/down lamp pair in the land and their own printed
      '0 up down 1' legend above at y 13.7. Cage at x 26.00. The vendor numbers them 0 and 1 in
      their own sequence, which is why they are a separate group: the traffic ports also start at
      0.
  timing-block:
    confidence: drawing
    note: >-
      drawing-measured by colour (the three jacks are the only yellow features on the face). GNSS
      ANT SMA centre (21.9, 7.2) and 9.8 mm across; 10MHZ SMB centre (39.3, 7.1) and 7.2 across;
      1PPS SMB centre (56.9, 7.2). They run in a ROW along the top of the faceplate here, not in a
      column as on the S9501-18SMT and S9510-28DC, and each label is printed to the LEFT of its
      jack rather than above or below it. Measured diameters confirm SMA, SMB, SMB and agree with
      common/sma-jack (9.5) and common/smb-jack (7.0); the components' own contract sizes are
      used, not the measurements. ToD is a single RJ45 low on the left at x 6.3-22.1, y 26.5-41.4
      - a 15.8 x 14.9 bezel, which is the IEC 60603-7 single-port 16 x 14 cutout, so it is
      std/rj45 and not the ganged part.
  mgmt-cluster:
    confidence: drawing
    note: >-
      drawing-measured - one silver bezel at x 21.3-38.7, y 48.7-81.0 holding three things in a
      column: the out-of-band RJ45 (drawn face 23.1-36.9 x 49.9-59.8, green link lamps in its TOP
      corners so it is keyway-up, rotate 180), a USB 3.0 Type-A socket with the blue tongue the
      datasheet's '1 x USB 3.0 Type-A port' implies (61.8-67.8), and the RS-232 console RJ45
      keyway-down at 69.3-80.7, labelled IOIOI below - the HIG's own spelling, 'The console can be
      connected with the IOIO port'. Both RJ45s are std/rj45-ganged (12.7 x 11): the bezel is 17.4
      wide and 32.3 tall, which will not take two 16 x 14 IEC cutouts and a USB. Three icons are
      printed above the bezel at y 44.5-47.1 - a network glyph over the RJ45, an up/down pair, and
      the USB SuperSpeed trident. The recessed RESET button is at (13.9, 46.0), about 2.4 mm
      across, drawn with common/reset-button at its own 4.0 contract size.
  status-leds:
    confidence: drawing
    note: >-
      drawing-measured - six lamps in one column at x 12.5-15.7, rows starting y 62.0 on a 2.24 mm
      pitch, with the legends printed dark on a white strip at x 16.2-19.2. Order top to bottom
      SYNC SYS FAN PS0 PS1 ID as printed, which is exactly the order of HIG section 10's Front
      Panel LED table; the ID lamp is drawn blue in the figure and the table's only ID row is
      'Blinking Blue - Enable beacon feature'. DRAWN AT A 2.7 PITCH, NOT THE MEASURED 2.24:
      common/led-rect is 4.6 x 2.6 and cannot sit on a 2.24 pitch without L13 firing, so the
      column is 2.3 mm taller than the drawing's. The same part is also 1.4 mm WIDER than the 3.2
      mm lamp it stands for, so the white legend strip is drawn at x 17.1 rather than the measured
      16.2 to clear it. Same deviations, same reason, as m3000-14xc and s9501-18smt.
  vents-front:
    confidence: drawing
    note: >-
      drawing-measured - a perforated band along the top of the faceplate at y 2.0-9.1 (two
      visible hex rows) and one row along the bottom at y 75.9-79.1, plus two hex fields in the
      left-hand service area (x 4.7-23.3 y 11.6-20.0, and x 4.5-11.7 y 50.5-77.1). THE BOTTOM BAND
      IS ONE ROW WHERE THE TOP IS TWO, and that asymmetry is what the figure draws: the field
      continues up behind the port blocks and only its outermost row clears them.
  rear:
    confidence: drawing
    note: >-
      drawing-fraction, and the figure is worse than the front's. HIG Figure 4's rear elevation on
      page 9 is a mild three-quarter render - its own top surface is visible above the face - and
      it is 2.4% anisotropic: the face measures 1650 x 340 px, which is 3.784 px/mm on 436 mm but
      3.877 px/mm on 87.7 mm. WHICH SCALE TO BELIEVE WAS SETTLED BY A FEATURE OF KNOWN SIZE: the
      four fan modules' red badges repeat at 318.7 px, which is 84.2 mm under the width scale and
      82.2 under the height scale, and 84.2 is what the two other UfiSpace chassis carrying this
      same 81.0 x 81.5 fan already use (s9321-64e at 84.3, s9321-64eo at 84.0). X is therefore
      taken at 3.784 px/mm and Y at 3.877. Fan bays at x 8.8 / 93.0 / 177.3 / 261.5, y 4.0, size
      81 x 81.5 from the HIG table. Grounding plate x 345.9-361.8. PSUs stacked at x 371.8, y 4.2
      and 45.7, size 50.5 x 39.9 from the HIG table. Two faint horizontal legends sit on the metal
      strip to the RIGHT of the supplies, at x 425 and y 26.3 and 75.6 - too small in this render
      to read letter by letter, but in the right places and the right shape for PSU0 and PSU1,
      which is what the front panel's PS0 and PS1 lamps already imply. They are transcribed as
      those. Positions on this face carry roughly a millimetre of uncertainty; the module sizes do
      not, because they are tabled rather than measured.
  top:
    confidence: estimated
    note: >-
      estimated from a schematic figure. HIG Figure 4's top view measures 1294 x 1602 px, which is
      2.968 px/mm on 436 and 2.628 on 609.6 - 13% apart, so it FAILS the aspect gate and only
      fractions may be taken from it. Five long recessed slots read at y 118, 215, 309, 405 and
      500 with a 25 mm height and a 95.5 mm pitch; their x extent is taken as the full width less
      a margin. AXIS: y = 0 is the REAR, per the house convention and per the figure, which prints
      the fan handles at the top of the view. Slot depth is dimensioned nowhere and the sink
      values are estimated.
  bottom:
    confidence: estimated
    note: >-
      estimated - no source in the intake shows the underside. The compliance sticker is the house
      convention at an estimated position. A bottom view mirrors LEFT and RIGHT; the sticker is
      the only content, so the axis was checked and does not bite.
  left:
    confidence: estimated
    note: >-
      estimated - no figure or photograph in the intake resolves a flank. Perimeter screws at
      estimated positions; the face is honestly sparse rather than blank. AXIS: x = 0 is the REAR
      on a left view (viewer3d.js convention). This face carries only symmetric content, which is
      recorded so that the axis reads as checked rather than as not having mattered.
  right:
    confidence: estimated
    note: >-
      estimated - same as the left, and deliberately the same content. THE GROUNDING POINT IS NOT
      ON A FLANK ON THIS CHASSIS: HIG section 8 says 'The location for securing the grounding lug
      is at the rear of the case and is covered with a protective label', and Figure 4 callouts
      the Ground Lug on the rear elevation, so both flanks are plain. That is the difference from
      the S9501-18SMT and M3000-14XC, whose lugs are on a side. AXIS: x = 0 is the FRONT on a
      right view.
  power:
    note: >-
      two figures, two measures, no conflict. Datasheet Environmental: 'Typical power: 379 Watts
      (no transceiver)' - a typical, explicitly with the cages empty, which on a 102-port box is a
      large qualifier. The HIG states no system consumption figure at all; its only wattage is the
      provisioning instruction 'a reserve of at least 1300 watts on each power circuit', which is
      the PSU rating and not a draw, and is not recorded as one. NO MAXIMUM IS PUBLISHED ANYWHERE
      IN THE INTAKE, so none is invented and power-envelope is 'bare' - the one figure carried
      does declare its scope. PSU inputs from the datasheet (AC 100-240 V 12 A, DC -40 to -75 V 40
      A); per-PSU rating lives on the ufispace/psu-132-* contracts.
  attrs:
    confidence: datasheet
    note: >-
      datasheet (Specifications / Accessories / Environmental / Performance / Regulatory
      Compliance) and HIG (the Port Overview table for reach and speed, section 11 for the console
      settings). Compliance transcribed as printed and not tidied - note that this datasheet lists
      ETSI 300 019 and ETSI 300 132-2 under Environment beside WEEE, which are an
      environmental-conditions and a power-interface standard rather than a materials one; they
      are carried where the vendor put them.
  led-semantics:
    note: >-
      HIG section 10, pages 22-23, transcribed rather than only cited. THIS FAMILY'S TABLE IS NOT
      THE S9510'S: there is no GNSS lamp, SYS replaces STAT with only three rows and no blinking
      green, the two PSUs get a lamp each (PS0, PS1) instead of sharing one PWR lamp, and an ID
      beacon is added whose only documented state is Blinking Blue. The PSU FRU and Fan FRU tables
      belong to the modules and are transcribed in ufispace/psu-132-ac, psu-132-dc and fan-808012.
  part-numbers:
    note: >-
      none stated. Neither the datasheet nor the HIG prints an orderable chassis SKU; the
      datasheet's 'Available to Order' section names only the PSUs (PSU-132-DESR, PSU-132-AESR)
      and the fan (FAN-803816-HI). No SKU is invented, so the configurations carry none - the same
      finding, and the same treatment, as m3000-14xc and s9501-18smt.
  fru-components:
    note: >-
      reuses ufispace/psu-132-ac, ufispace/psu-132-dc and ufispace/fan-808012, and the match is
      dimensional rather than nominal. The HIG's Component Physical Information table gives this
      chassis a 50.5 x 321 x 39.9 mm PSU and an 81 x 113 x 81.5 mm fan; psu-132-* are 50.5 x 40.0
      and fan-808012 is 81.0 x 81.5. The PSU bays are drawn 40.0 tall, following the component,
      rather than the 39.9 this HIG tables: two vendor tables round the same supply's face
      differently in the first decimal, which is a rounding difference rather than a disagreement
      worth recording as one - and a bay a tenth shorter than its own occupant is a fit error L33
      is right to catch. The part numbers differ from the ones those contracts carry -
      PSU-132-DESR / -AESR here against the S9300-32D's PSU-132-DISB1 / -AISB1, and FAN-803816-HI
      against the S9321-64E's FAN-808012-HCE - which is a suffix naming the airflow and the
      chassis family, not a different face. The per-device part numbers are carried in the
      configurations' component-attrs, which is where a FRU model belongs.
  vent-islands:
    note: >-
      derived - a vent field is a perforation and the drawing said so, but the marks printed
      inside one were floating on air (L64). The vendor interrupts the perforation where it
      prints, so each of those marks now has a solid patch under it in the chassis colour, drawn
      over the vent the way ufispace/s9600-72xc paints its port bands over one. The patch is the
      printing's own footprint plus 0.4 mm, which is what the S9610-36D's front render measures:
      its slots stop 0.4 mm outside each lamp cluster and resume 0.4 mm past it. Where a vent is
      simply measured wider than the metal it reaches, this states the metal that the printing
      proves is there without re-measuring the field.
  lifecycle:
    note: >-
      searched 2026-08-28, 'UfiSpace S9600-102XC end of life end of sale' - no announcement found;
      the product page is live and the unit is actively distributed. none-announced is a real
      finding, not an omission.

attrs:
  performance:
    switching-capacity: 2.4 Tbps
    packet-buffer: 4 GB
    reach-sfp28: 40 km max (HIG Port Overview, ports 0-95)
    reach-qsfp28: 80 km max (HIG Port Overview, ports 96-101)
  power:
    power-typical-w: 379
    power-envelope: bare
    psus: 2x 1300 W 1+1 redundant, hot-swappable (exhaust airflow)
    psu-ac-input: 100-240 VAC, 12 A max
    psu-dc-input: -40 to -75 VDC, 40 A max
  thermal:
    fans: 4x hot-swappable 3+1 redundant, exhaust airflow; system front-to-back
  environmental:
    operating-temp: 0 to 45 C
    storage-temp: -40 to 70 C
    operating-humidity: 5% to 85% RH, non-condensing
    storage-humidity: 5% to 93% RH, non-condensing
  platform:
    cpu: Intel Skylake-D 8-core @ 1.9 GHz
    memory: 32 GB DDR4
    storage: 128 GB SSD
    asic: Broadcom Qumran2c BCM88820
    lookup-engine: Broadcom OP2 BCM16K
    bmc: ASPEED AST2620
    oem-alias: >-
      DriveNets NCP-96X6C-S (Network Cloud Packet forwarder, 96x1/10/25 + 6x100). NOT A
      UFISPACE CLAIM - no UfiSpace document mentions DriveNets. The mapping is internal analysis matching DriveNets' NCP-96X6C-S (Q2C 2.4T) to this
      chassis on published silicon and port configuration. The map names this model OR the
      S9601-102XC Ice Lake refresh for the same DriveNets name, so the alias is not unique to
      one of the pair. Recorded so a search for either name finds this box; no DriveNets
      figure or artwork is transcribed anywhere in this file.
  features:
    timing: Stratum 3E OCXO, ITU-T SyncE, IEEE 1588v2 (G.8265.1 default, G.8275.1,
      G.8275.2, SMPTE ST 2059-2 with additional licence; T-GM, T-BC/OC, T-TC), Time
      Sensitive Networking, Class C accuracy
    timing-interfaces: GNSS SMA in, 1PPS SMB in/out, 10MHz SMB in/out, ToD RJ45 in/out
    gnss: internal receiver for master clock implementations
    timing-cables: 50 ohm SMA coax with 1/4-36UNS-2B for GNSS; 50 ohm SMB coax with
      10-32UNF-2A for 1PPS and 10MHz; shielded RJ45 for ToD
    routing: full Segment Routing over IPv6 (SRv6)
    nos: NOS integration is necessary to activate the timing features
    optics-sfp28: 25G SFP28 SR, LR, ER; 10G SFP+ SR, LR, ER; 1G SFP SX, LX, EX
      (datasheet compatible transceiver types)
    optics-qsfp28: 100G QSFP28 SR4, LR4, ER4, ZR4 (datasheet compatible transceiver types)
    optics-sfp-plus: 10G SFP+ SR, LR, ER (datasheet compatible transceiver types; the
      two 10G management ports take the same optics as the SFP28 cages do at 10G)
  management:
    console: RJ45 serial, 115200 8N1
  compliance:
    safety: UL 62368-1; IEC 62368-1
    emc: FCC Part 15 Subpart B Class A; ICES-003 Class A; EN 55032 Class A; EN 55035;
      EN 300 386; EN 301 489; EN 303 413
    environment: WEEE; ETSI 300 019; ETSI 300 132-2
  lifecycle:
    eol: none-announced
chassis:
  width: 436
  height: 87.7
  depth: 609.6
  ru: 2
  weight-kg: 15.19
  airflow: front-to-back

gaps:
- what: qsfp-green-plate
  scope: [front]
  reason: vendor-silent
  note: >-
    Both QSFP28 blocks sit against an olive-green perforated plate carrying two rows of
    round holes and one bright vertical clip per cage column. It appears in Figure 8 and
    in the front photograph and is named in no callout, no table and no procedure; the
    guide's only rear-panel green is the PSU connector housing, which this is not. It is
    drawn as vent-patterned panel decor because that is what it looks like; if it is in
    fact part of the QSFP cage assembly it belongs in a component instead.
  wanted: a UfiSpace exploded view or a close photograph of the QSFP block
- what: qsfp-port-legend
  scope: [qsfp28]
  reason: needs-photo
  note: >-
    The SFP28 blocks print their port numbers on the yellow band and those are
    transcribed. The QSFP28 blocks have no such band - the green plate occupies that
    space - and no printed numeral is legible on them at the only resolution available.
    Ports 96-101 are numbered here from the HIG's Port Overview table and from Figure 8's
    large annotation overlay, which is the figure's own labelling rather than the panel's
    ink, so no silkscreen mark is written for them.
  wanted: a straight-on high-resolution front photograph, or a vendor 3D model
- what: qsfp-lane-lamp-ownership
  scope: [led-port-96, led-port-97, led-port-98, led-port-99, led-port-100, led-port-101]
  reason: vendor-silent
  note: >-
    The land between each QSFP pair carries a dot matrix that resolves as two stacked
    rows of lamps but not as wiring. The upper strip is assigned to the upper port and
    the lower strip to the lower port BY POSITION ONLY; the HIG tables no port lamp of
    any kind. The same figure is too coarse to count the dots per row with confidence,
    so ufispace/lane-led-quad's four lamps are taken as the arrangement because that
    component was built for this vendor's QSFP28 blocks.
  wanted: a lit-unit photograph, or a UfiSpace port-LED table
- what: port-led-semantics
  scope: [sfp28, qsfp28, sfp-plus-mgmt, port-leds]
  reason: vendor-silent
  note: >-
    HIG section 10 tables the six system lamps (SYNC, SYS, FAN, PS0, PS1, ID), the PSU
    FRU lamp and the Fan FRU lamp, and gives no table at all for the port lamps. The
    ninety-eight arrow lamps and six lane-lamp strips therefore keep their component
    default of off/on rather than an invented link/activity vocabulary. Unlike the
    S9510-28DC's tables, not one row here is annotated 'need NOS to activate', so there
    is no evidence either way about whether these are NOS-defined.
  wanted: a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a live
    unit with ports in known states
- what: sfp-row-mirroring
  scope: [sfp28, sfp-plus-mgmt]
  reason: needs-photo
  note: >-
    A two-high ganged SFP block normally mirrors so that both rows' bail latches stay
    reachable, and std/sfp-ganged draws an asymmetric aperture that would show it. The
    only elevation that resolves these cages is HIG Figure 8, and Figure 8 prints its
    large annotation numerals ON the cages, covering exactly the detail that would settle
    it. The rows are drawn belly-to-belly, the lower row rotate 180, because the port
    lamps between the rows point up over down and that is the library's stack convention
    (docs/pluggables-3d-design.md, S3: upper rotate 0 over lower 180, both bails outward) - lamps and the rule, not a measurement of the metal.
  wanted: a straight-on high-resolution front photograph, or a vendor 3D model
- what: rear-face-anisotropy
  scope: [rear]
  reason: needs-drawing
  note: >-
    The only rear elevation in the intake is a three-quarter render whose face measures
    3.784 px/mm across and 3.877 px/mm down - a 2.4% yaw. Sizes on that face are the
    HIG's tabled FRU dimensions and are sound; POSITIONS carry about a millimetre of
    uncertainty, and the fan pitch in particular was resolved by borrowing the value two
    sibling chassis already use for this fan rather than by measuring it here.
  wanted: an orthographic rear elevation or a mechanical drawing
- what: fru-power-unpublished
  scope: [ufispace/fan-808012@1]
  reason: vendor-silent
  note: >-
    ufispace/fan-808012 states no draw and its own contract records the search. This HIG
    is the same - it weighs the fan FRU at 498 g and tables its lamp, and its only
    wattage is the 1300 W per-circuit reserve, which is the PSU rating and not a fan's
    draw. L29's standing warning is the live count of how much of the chassis total is a
    floor. On a box with four fans in a 2RU 102-port chassis this is a material hole,
    not a rounding one.
  wanted: a photograph of the fan module's label, or a UfiSpace FRU datasheet
groups:
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the chassis indicators - SYNC, SYS, FAN, PS0, PS1, ID as printed on the
      white strip beside them
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: every indicator that belongs to a particular port, ordered by that port
  psus:
    term: PSU
    role: service
    index-origin: 0
    description: vendor spells the rear bays PSU0 (upper) and PSU1 (lower); the front
      panel's PS0 and PS1 lamps use the same numbering
    attrs:
      redundancy: '1+1'
      redundancy-note: '2x 1300 W 1+1 redundant, hot-swappable (exhaust airflow)'
  fans:
    term: Fan
    role: service
    index-origin: 0
    description: vendor numbers the modules FAN 0 1 2 3 on the rear face, left to right
    attrs:
      redundancy: '3+1'
      redundancy-note: '3+1 - hot swappable fan modules with 3+1 redundancy support (UfiSpace datasheet, staged intake)'
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
    description: ports 0-95, '96 x 1/10/25G SFP28 ports', up to 40 km (HIG Port Overview)
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
    description: ports 96-101, '6 x 40/100G QSFP28 ports', up to 80 km (HIG Port Overview)
  sfp-plus-mgmt:
    term: Port
    role: management
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: the pair the datasheet calls '2 x 10G SFP+ management ports', printed
      0 and 1 in their own sequence above their own two-row block
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: the timing interfaces - a GNSS antenna on SMA, 1PPS and 10MHz on SMB and ToD
      on RJ45. Four media, one job; the three coaxial jacks run along the top of the
      faceplate and the ToD jack sits below them
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the management cluster in one silver bezel - the out-of-band RJ45, a USB 3.0
      Type-A service port and the RS-232 console on RJ45 - plus the recessed reset
      button beside it. Same cluster, and the same word for it, as the other UfiSpace
      boxes in the library
