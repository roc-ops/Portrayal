gaps:
- what: port-led-semantics
  scope: [qsfpdd-400g, sfp-plus, port-leds]
  reason: vendor-silent
  note: >-
    The HIG's section 10 tables the six front-panel lamps, the PSU and Fan FRU lamps and
    the RJ45 management jack, and says nothing about the port lamps. Each QSFP-DD column
    carries a four-part cluster - a two-window light pipe at each end of the cage width
    with a round lamp inboard of each - and nothing states which half serves the upper
    port and which the lower, nor what the pipe's two windows mean against the round
    lamp. Every lamp keeps the component's off/on default; each cluster's `for` lists the
    two ports of the column it stands over, which is adjacency and not an asserted
    mapping. The SFP+ pair has no lamps drawn beside it at all.
  wanted: >-
    a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a live unit with
    ports in known states
- what: fan-face-width
  scope: [ufispace/fan-805616@1, fans]
  reason: sources-disagree
  note: >-
    The HIG Component Physical Information table gives the fan module 81 x 176.53 x
    81.5 mm (W x D x H). HIG Figure 9's rear elevation, which passes the aspect gate at
    0.45%, draws four identical faces abutting from x 17 to x 837 px with no chassis web
    between them, and four independent repeated features on that face - the airflow tag,
    the status lamp, the handle and the release tab - all sit on a 205.33 px pitch, which
    is 83.84 mm. The face is 83.7 x 80.0 and the table's number is 81 x 81.5. The likely
    resolution is the S9300-32D's: 81 measures the fan BODY behind the flange and the
    face is wider. That is an inference and not something either document says, so the
    manifest carries the measured face and this entry carries the disagreement.
  wanted: a vendor mechanical drawing of FAN-805616, or a caliper on the FRU
- what: port-number-print
  scope: [qsfpdd-400g, sfp-plus]
  reason: needs-photo
  note: >-
    The ports ARE numbered 0-63 and 64-65 - HIG Figure 10 prints every numeral - but it
    prints them on the schematic module faces, where a seated module would cover them,
    so the figure does not say where the metal carries them. Nothing was found on the
    metal: the dark chassis web between the two cage bands profiles flat with no bright
    marks, and the 520 px front photograph is 1.19 px/mm, far too coarse for a 2 mm
    digit. No numerals are therefore drawn, rather than 66 of them being placed by
    guesswork.
  wanted: a straight-on front photograph at 4 px/mm or better, or a vendor faceplate
    artwork sheet
- what: front-legend-glyphs
  scope: [mgmt, timing, status-leds]
  reason: needs-photo
  note: >-
    Every small legend on the left-hand block is 4-6 px tall in the only orthographic
    front figure held, and does not resolve at 20x with autocontrast. Their positions and
    extents are measured; their WORDING is the HIG Figure 4 callout list and the Front
    Panel LED table's row names, which is a strong inference and still an inference. Four
    glyphs ARE legible and are drawn as seen: an up and a down triangle above the SFP+
    block and another pair beside the RJ45 stack, plus the three-box network symbol to
    the right of the second pair. Three legends that certainly exist are NOT drawn,
    because nothing identifies them: a roughly 6 mm word between the USB symbol and the
    lower up-triangle at x 18.7-24.7 y 77-80, and two small marks flanking the SFP+
    triangles at x 20.3-22.7 and x 32.9-35.4, y 12.7-15.3.
  wanted: a straight-on front photograph at 4 px/mm or better
- what: psu-110v-derating
  scope: [power, psus]
  reason: sources-disagree
  note: >-
    The HIG states the 110 V AC per-supply output twice and differently. Section 7 says
    'If power input for AC power supply is only 110V, there will only be 1000 watts per
    power supply and will not be enough power for the power supply to be changed while
    the switch is in operation.' Section 9's AC note says 'If only a 110V AC power source
    is available, the S9311-64D can still be powered with both PSUs providing 1200 watts
    each for a total output of 2400 watts.' Same measure, same scope, two values. Neither
    is the number this manifest carries - power-output-w on the PSU contracts is the
    2400 W nameplate from the datasheet's ordering lines, at the 200-240 V input the
    datasheet specifies - but a reader budgeting a 110 V feed needs to know the guide
    contradicts itself.
  wanted: the PSU-242 supply datasheet, or a UfiSpace erratum for HIG R1.2
- what: dc-psu-face
  scope: [ufispace/psu-242-dc@1, psus]
  reason: needs-drawing
  note: >-
    No held figure shows a DC build seated in the chassis. HIG Figure 9 and the datasheet
    rear render both show the AC unit with its C20 inlet, so the DC contract's fan frame,
    pull bar, latch and lamp positions are carried over from the AC unit rather than
    measured on a DC face. What is specific to the DC unit - a two-row input block, V+
    over V-, with two lug/screw holes above it - comes from HIG Figure 6's CAD front
    view, whose own scale is only good to a couple of percent, so the block is drawn on
    the AC inlet's measured footprint instead of on that sheet's scale. The datasheet
    also names the connector for the INTAKE variant only ('CRPS TE 2204535-3 ELON Mini')
    and names none for the exhaust variant modelled here.
  wanted: a rear photograph or elevation of a DC-configured S9311-64D, or the Delta
    drawing for PSU-242-DEERN at a stated scale
- what: zr-port-set
  scope: [qsfpdd-400g]
  reason: vendor-silent
  note: >-
    The HIG says 'The 400G QSFP-DD ports highlighted support both ZR+ transceivers up to
    32 units' above Figure 12, and Figure 12 renders the lower band of 32 ports (32-63)
    pale against the upper band's normal dark. 32 is exactly one band, so the count and
    the shading agree - but the guide never says whether the pale band is the highlighted
    set or the excluded one, and the sentence's 'highlighted' is not defined anywhere in
    the document. No port is therefore given a per-port ZR attribute; the capability is
    recorded on the device as 'up to 32' without naming which 32.
  wanted: a UfiSpace optics compatibility matrix, or a Figure 12 revision with a legend
- what: second-ground-location
  scope: [grounding]
  reason: vendor-silent
  note: >-
    HIG section 8 says 'there are two locations on the case in which the grounding lug
    may be fixed' and then shows one, on the rear panel's right-hand strip under the
    yellow label (Figures 22 and 23). The prose calls that location 'the side of the
    switch', which the strip arguably is, so it is not even certain the two sentences
    describe two different places. Only the located one is drawn; nothing is placed on a
    side face by inference.
  wanted: a figure or photograph showing the second grounding location
- what: chassis-sku
  scope: [base, ac, dc]
  reason: vendor-silent
  note: >-
    No held document prints an orderable chassis part number - the datasheet and the HIG
    name the product only as S9311-64D, and the Available to Order block names only the
    four PSUs and two fans. The S9510-28DC precedent applies: that model's -BN0B/-BR1B
    SKUs surfaced from the owner and from no held PDF, so orderable SKUs for the AC/DC
    and airflow builds almost certainly exist. The configurations therefore carry no
    part-numbers rather than invented ones.
  wanted: a UfiSpace ordering guide or a quote naming the chassis SKUs
groups:
  timing:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: coax-smb}
    description: >-
      the 1PPS and 10MHz SMB jacks at the top of the left-hand block, each an
      input/output on the Premium timing build (datasheet Timing Interfaces)
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management block down the left edge - the RS-232 console RJ45, the micro-USB
      serial console, the USB 3.0 service port, the out-of-band RJ45 and the recessed
      reset button. Same block, and the same word for it, as the library's other
      UfiSpace white boxes
  sfp-plus:
    term: Port
    role: management
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      the stacked SFP+ pair, '2 x 1/10G SFP+ ports' in the datasheet's physical list.
      The vendor numbers them 64 and 65 - HIG Figure 10 prints those two numerals in
      orange, continuing the QSFP-DD run rather than starting a second one - so the
      rel-pos values are 64 and 65 and index-origin is 0 because the schema allows only
      0 or 1 there
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp-dd, speed: 400g}
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      the six chassis indicators the HIG's Front Panel LED table names - SYNC, SYS, FAN,
      PS0, PS1 and the blue ID beacon
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      every indicator that belongs to a particular port - the thirty-two QSFP-DD lamp
      clusters, one above each column of the upper cage band and one below each column of
      the lower, and the two lamps in the out-of-band jack's own aperture
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 hot-swappable'
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '3+1'
      redundancy-note: '3+1 - 3+1 hot-swappable (attrs fan-redundancy)'
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
views:
  front:
    size:
      w: 436
