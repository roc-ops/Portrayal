configurations:
  base:
    kind: base
    description: >-
      The chassis as it ships and as every rear figure draws it - four
      FAN-805616-HCE fans and two PSU-242-AECRN 2400W AC supplies, red handles and
      latches throughout, front-to-back airflow, and the sixty-six traffic and
      management ports empty. No orderable chassis part number appears in any held
      document; see the chassis-sku gap.
    default: true
    airflow: front-to-back
  ac:
    kind: orderable
    description: >-
      Dual 2400W AC supplies (PSU-242-AECRN, C20 inlet, red latch) with
      front-to-back fans (FAN-805616-HCE). The back-to-front build swaps both for
      their blue-latched intake counterparts - PSU-242-AICB-NN and FAN-805616-CCD -
      which are orderable and are modelled only as the fan's blue skin, because no
      held figure shows the intake PSU's face.
    airflow: front-to-back
    component-attrs:
      psu-242-ac:
        model: PSU-242-AECRN
      fan-805616:
        model: FAN-805616-HCE
  dc:
    kind: orderable
    description: >-
      Dual 2400W -48V DC supplies (PSU-242-DEERN, two-row V+/V- input block, red
      latch) with front-to-back fans (FAN-805616-HCE). The HIG rates the DC feed at
      -48V to -60V for operation up to 5000 m and notes a 120 A fast-acting fuse
      built into each supply.
    airflow: front-to-back
    bays:
      psu-0: ufispace/psu-242-dc@1
      psu-1: ufispace/psu-242-dc@1
    component-attrs:
      psu-242-dc:
        model: PSU-242-DEERN
      fan-805616:
        model: FAN-805616-HCE
