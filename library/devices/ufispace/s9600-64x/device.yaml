    console-usb-driver: Silicon Labs CP210x USB-to-UART bridge
    boot-time-s: 100
    oob-link-time-s: 40
  compliance:
    emc: FCC Part 15 Subpart B Class A, ICES-003 Class A, EN 55032 Class A, EN 55024, EN 55035,
      EN 62479, EN 50663, EN 300 386, EN 301 489, EN 303 413, BSMI, VCCI CISPR 32 Class A
    safety: UL 62368-1, IEC 60950-1, IEC 62368-1, BSMI
    environment: RoHS, WEEE
    nebs: 'NEBS statements only - the guide carries the Common Bonding Network, SPD, DC-I return
      and intra-building OOB wording, and states no Level. It is not a certification claim'
