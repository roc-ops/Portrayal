    fans: 4 modules, 3+1 redundant, hot-swappable
  environmental:
    operating-temp: 0 to 45 C
    storage-temp: -40 to 70 C
    operating-humidity: 5% to 85% RH, non-condensing
    storage-humidity: 5% to 93% RH, non-condensing
  platform:
    asic: Broadcom Qumran2c BCM88820
    cpu: Intel Skylake-D 8-core @ 1.9 GHz
    memory: 32 GB DDR4
    storage: 128 GB SSD
    bmc: ASPEED AST2400
  features:
    timing: Stratum 3E OCXO, SyncE, IEEE 1588v2 (G.8265.1, G.8275.1, G.8275.2, T-GM, T-BC/OC, T-TC)
    timing-profiles-licensed: SMPTE ST 2059-2 requires an additional license
    timing-interfaces: GNSS SMA in, 1PPS SMB in/out, 10MHz SMB in/out, ToD RJ45 in/out
    gnss: internal receiver for master clock implementations
    timing-cables: 50 ohm SMA coax with 1/4-36UNS-2B for GNSS, 50 ohm SMB coax with 10-32UNF-2A
      for 1PPS and 10MHz, shielded RJ45 for ToD
