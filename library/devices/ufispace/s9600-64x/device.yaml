      # the Ethernet icon over the management jack, drawn rather than set as a glyph:
      # a crossbar with a stem up to the host node and three drops to the leaves. Split
      # into straight segments because an L-shaped path is measured by its bounding box.
      # PATH COORDINATES ARE RELATIVE TO `at` - the renderer emits translate(at) around
      # them - so each of these starts at 0 0. Written absolute the first time, which put
      # the whole icon at twice its coordinates and off the bottom of the panel.
      - {at: [55.40, 78.40], path: 'M 0 0 L 4.0 0', for: mgmt}
      - {at: [57.40, 77.00], path: 'M 0 0 L 0 1.4', for: mgmt}
      - {at: [55.40, 78.40], path: 'M 0 0 L 0 1.2', for: mgmt}
      - {at: [57.40, 78.40], path: 'M 0 0 L 0 1.2', for: mgmt}
      - {at: [59.40, 78.40], path: 'M 0 0 L 0 1.2', for: mgmt}
      # the SFP quad's own row legend, printed on the yellow band: number, up-arrow for the
      # top row, down-arrow for the bottom, number. This is the legend that says what the
      # arrows on the QSFP bands mean.
      # the triangles are drawn rather than set: the renderer's font has no U+25B2/U+25BC
      # and put a tofu box where each one belongs. A path mark is stroked, not filled, so
      # these come out as outlines of the solid triangles the panel prints.
      - {text: '0', at: [55.70, 11.49], font-size: 2.4, anchor: middle, fill: '#17191c', for: sfp-0}
      - {at: [58.20, 9.40], path: 'M 0 2.0 L 1.0 0 L 2.0 2.0 L 0 2.0', filled: true, for: sfp-0}
      - {at: [61.70, 9.40], path: 'M 0 0 L 2.0 0 L 1.0 2.0 L 0 0', filled: true, for: sfp-1}
