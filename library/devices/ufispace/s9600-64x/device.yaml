chassis:
  width: 436
  height: 87.7
  depth: 762
  ru: 2
  weight-kg: 19.15
  color: '#363636'
# What no rule can find, because the manifest looks complete.
  airflow: front-to-back

gaps:
- what: port-led-semantics
  scope: [qsfp28, sfp28, port-leds]
  reason: vendor-silent
  note: >-
    HIG section 10 tables the six front-panel system lamps, the PSU FRU lamp and the Fan FRU
    lamp, and gives no table at all for the port lamps. Every QSFP28 column carries a
    four-dot cluster above and below it and the SFP quad carries the same, but whether those
    four dots are four lanes, or link and activity for two ports, or something a NOS defines,
    is nowhere stated. The sixty-four lane-led-quad placements therefore keep the component's
    off/on default. The datasheet's own footnote - "NOS integration is necessary to activate
    the specific feature" - is about timing, not lamps, so it does not even license calling
    this nos-dependent.
  wanted: >-
    a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a live unit with
    ports in known states
- what: port-numeral-ink
  scope: [front, qsfp28]
  reason: needs-photo
  note: >-
    The sixty-four numerals drawn on the port badges are placed from a measured badge
    position and numbered from the guide's annotation of the apertures - not read off the
    badges, which at fig-0015's 3.0 px/mm are two pixels of grey per digit. So the geometry
    is measured and the VALUES are inferred: what nobody has verified is that the badge over
    a column prints the same two numbers the guide writes inside that column's apertures.
    Every internal consistency check that can be run does pass - sixteen badges per band, two
    bulges each, one column each, and a numbering that closes at 63 - which is why they are
    drawn rather than left off. A single legible photograph of one block settles it.
  wanted: >-
    a straight-on photograph of the front panel at 600 px per block or better, or a vendor
    mechanical drawing of the faceplate artwork
- what: fan-module-dimensions
  scope: [ufispace/fan-803816-hi@1, rear]
  reason: sources-disagree
  note: >-
    One orderable part number, FAN-803816-HI, dimensioned three different ways by three
    UfiSpace hardware guides. This device's Component Physical Information table says
    81.5 x 122 x 81 mm (W x D x H); the S9600-30DX guide says 81 x 113 x 81.5, and
    ufispace/fan-803816@1 was built from it at a face of 82.5 x 81.5; the S9600-28DX guide
    says 80 x 113 x 81.5, and ufispace/fan-803816-hi@1 was built from it at 80 x 81.5. The
    depth alone varies by 9 mm, which is not a rounding. Measured on THIS device's rear
    elevation the bay pitch is 83.87 mm and the module 80.9 mm high, which supports this
    guide's 81 for the height and is silent about the other two axes. fan-803816-hi@1 is
    seated here because its name matches the SKU; the bay is authored 81.5 x 81.5 so the
    sibling also fits. No third component was minted for a part that already has two.
  wanted: >-
    a photograph of the fan module's own label, or calipers on a real FAN-803816-HI
- what: chassis-part-numbers
  scope: [dc, ac]
  reason: vendor-silent
  note: >-
    Neither document names an orderable number for the chassis. The datasheet's "Available to
    Order" block lists only the FRUs - PSU-162-DESR, PSU-162-AESR and FAN-803816-HI - and the
    HIG names the product "S9600-64X" in its title, its overview and its dimensions table and
    prints no SKU anywhere. Searched both documents for the string 'S9600-64X-' and for any
    hyphenated suffix pattern; nothing. The AC and DC builds are listed as configurations
    without part numbers rather than invented, and note that the sibling S9510-28DC's SKUs
    (-BN0B / -BR1B) came from the owner and not from any PDF we hold, so a suffix guessed from
    that pattern would be a fabrication.
  wanted: a UfiSpace ordering guide or a quotation naming the chassis SKUs
- what: fru-power-unpublished
  scope: [ufispace/fan-803816-hi@1]
  reason: vendor-silent
  note: >-
    Searched and absent. The datasheet names the fan only as an ordering line
    ("FAN-803816-HI, exhaust air flow") with no wattage; the HIG dimensions and weighs the
    module (498 g) and tables its LED, and gives no power figure. Every watt figure in either
    document belongs to the box (565 typical, 1140 DC max, 1160.2 AC max), to a supply
    nameplate (1600, and the 1000-each 110 V derating) or to the provisioning reserve (1600
    per circuit). L27/L29 stand for this module and the chassis total is a floor.
  wanted: a photograph of the fan module's label, or a UfiSpace FRU datasheet
- what: rail-pin-positions
  scope: [left, right]
  reason: needs-drawing
  note: >-
    The guide states the count and the kind - five key-shaped attachment pins per side, ten in
    all, plus one M4x5.5 screw per side locking the inner rail - and draws them in Figures 9
    and 10, but every one of those figures is an isometric of the chassis with a rail beside
    it and none is dimensioned or orthographic. The five drawn here are spread evenly over the
    middle 600 mm of the 762 mm depth with the screw behind the last: the number is sourced,
    the spacing is not, and it is almost certainly not even in reality since rail pins cluster
    where the standoffs land.
  wanted: a mechanical drawing of either side wall, or a photograph of a side taken square on
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    physical-context: NetworkingDevice
    attrs: {media: qsfp28, speed: 100g}
    description: the sixty-four 40/100G cages, eight ganged blocks of eight, numbered along
      the top pair of rows and then along the bottom pair
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    physical-context: NetworkingDevice
    attrs: {media: sfp28, speed: 25g}
    description: the 1/10/25G quad in its own ganged block, which breaks out of QSFP28 port 0 -
      enabling these four disables that port, so they are alternatives and not additions
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: every indicator that belongs to a particular port, ordered by that port
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the chassis indicators, which report the unit rather than any one port
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: the timing block at the left-hand end - a GNSS antenna on SMA, 1PPS and 10MHz on
      SMB and ToD on RJ45. Four media, one job, and the vendor's own overview figure brackets
      them together
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the out-of-band and console cluster - the management RJ45, the RJ45 console, the
      micro-USB console that reaches the same UART through a CP210x bridge, and the USB 3.0
      maintenance port. Same cluster, and the same word for it, as the other devices in this
      library that have one
  psus:
    term: PSU
    role: service
    index-origin: 0
    physical-context: PowerSupply
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 redundant, hot-swappable'
  fans:
    term: Fan
    role: service
    index-origin: 0
    physical-context: Fan
    attrs:
      redundancy: '3+1'
      redundancy-note: '3+1 - hot swappable fan modules with 3+1 redundancy support (UfiSpace datasheet, staged intake)'
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
views:
