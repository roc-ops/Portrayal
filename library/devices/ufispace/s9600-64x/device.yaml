configurations:
  base:
    kind: base
    description: the chassis as it powers on - four fans and two 1600 W AC supplies, no optics
    default: true
  dc:
    kind: orderable
    description: DC build, 2x PSU-162-DESR 1600 W -40 to -72 V, exhaust supplies, front-to-back airflow
    bays:
      psu-0: ufispace/psu-162-dc@1
      psu-1: ufispace/psu-162-dc@1
    component-attrs:
      psu-162-dc:
        model: PSU-162-DESR
      fan-803816-hi:
        model: FAN-803816-HI
  ac:
    kind: orderable
    description: AC build, 2x PSU-162-AESR 1600 W 200-240 V on IEC C19 cords, front-to-back airflow
    component-attrs:
      psu-162-ac:
        model: PSU-162-AESR
      fan-803816-hi:
        model: FAN-803816-HI
  dc-populated:
    kind: example
    # the same box with optics in it. SFP28 0-3 are shown fitted because they are the
    # break-out of QSFP28 port 0, which is the one relationship on this panel a picture
    # explains better than a sentence: port-0 is drawn EMPTY here on purpose.
    description: DC build fitted with 25G optics on the four SFP28 break-out ports
    bays:
      psu-0: ufispace/psu-162-dc@1
      psu-1: ufispace/psu-162-dc@1
    occupants:
      sfp-0: common/sfp-lc-duplex@1
      sfp-1: common/sfp-lc-duplex@1
      sfp-2: common/sfp-lc-duplex@1
      sfp-3: common/sfp-lc-duplex@1
