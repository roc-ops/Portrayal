    components:
      placements:
        - {ref: common/reset-button@1, id: reset, at: [7.40, 4.10], for: chassis, group: mgmt, rel-pos: 4}
        - {ref: common/led-rect@1, id: led-sys, for: chassis, at: [7.60, 12.35],
           states: ['off',
                   {name: ok, color: '#22c55e'},
                   {name: boot-failed, color: '#f59e0b'}],
           description: 'HIG Front Panel LED table, SYS row - Off (no power), Solid Green (host
             CPU/BMC boot complete), Solid Amber (power is up but host CPU/BMC boot failed)',
           group: status-leds, rel-pos: 1}
        - {ref: common/led-rect@1, id: led-fan,
           for: [rear/fan-0, rear/fan-1, rear/fan-2, rear/fan-3, rear/fan-4, rear/fan-5], at: [7.60, 15.05],
           states: ['off',
                   {name: ok, color: '#22c55e'},
                   {name: fault, color: '#f59e0b', behavior: blinking}],
           description: 'HIG Front Panel LED table, FAN row - Off (fans are not initialized),
             Solid Green (all fans are work normal), Blinking Amber (fan fail: one or more fans
             need service)',
           group: status-leds, rel-pos: 2}
        - {ref: common/led-rect@1, id: led-ps0, for: rear/psu-0, at: [7.60, 17.75],
           states: ['off',
                   {name: ok, color: '#22c55e'},
                   {name: fault, color: '#f59e0b', behavior: blinking}],
           description: 'HIG Front Panel LED table, PSU0 row - Off (no power), Solid Green
             (PSU0 working normal), Blinking Amber (PSU0 fail, PSU0 needs service). The panel
             silkscreen abbreviates the row to PS0',
           group: status-leds, rel-pos: 3}
        - {ref: common/led-rect@1, id: led-ps1, for: rear/psu-1, at: [7.60, 20.45],
           states: ['off',
                   {name: ok, color: '#22c55e'},
                   {name: fault, color: '#f59e0b', behavior: blinking}],
           description: 'HIG Front Panel LED table, PSU1 row - Off (no power), Solid Green
             (PSU1 working normal), Blinking Amber (PSU1 fail, PSU1 needs service). The panel
             silkscreen abbreviates the row to PS1',
           group: status-leds, rel-pos: 4}
        - {ref: common/led-rect@1, id: led-id, for: chassis, at: [7.60, 23.15],
           states: ['off',
                   {name: beacon, color: '#3b82f6', behavior: blinking}],
           description: 'HIG Front Panel LED table, ID row - Off (no power), Blinking Blue
             (beacon feature is enabled on the switch)',
           group: status-leds, rel-pos: 5}
        - {ref: common/rj45-hd-plain@1, id: console, at: [15.95, 6.50], rotate: 180, group: mgmt, rel-pos: 1,
           attrs: {media: rj45-serial, role: console},
           description: 'HIG Initial System Setup - the console is the RJ45 port labelled IOIO,
             115200 8N1, no flow control. Drawn rotate 180 because this jack shows its latch
             keyway up and its contacts down, the mirror of the OOB jack below it'}
        - {ref: common/usb-a@2, id: usb, at: [14.45, 18.95], group: mgmt, rel-pos: 2,
           attrs: {role: storage, speed: usb3}}
        - {ref: common/rj45-hd@1, id: oob, at: [15.95, 26.40], group: mgmt, rel-pos: 3,
           attrs: {role: mgmt, speed: 100m-1g},
           states: {led-a: ['off', {name: link-1g, color: '#22c55e'},
                            {name: activity-1g, color: '#22c55e', behavior: blinking}],
                    led-b: ['off', {name: link-10-100m, color: '#f59e0b'},
                            {name: activity-10-100m, color: '#f59e0b', behavior: blinking}]},
           description: 'HIG Management Port LED table - left lamp Off (no power), Solid Green
             (1G link-up), Blinking Green (1G TX/RX activity); right lamp Off (no power), Solid
             Amber (10M/100M link-up), Blinking Amber (10M/100M TX/RX activity). The two lamps
             do not share a vocabulary, so they are declared per element'}
