configurations:
  base:
    kind: base
    source: >-
      derived - built from the group roles rather than from a vendor bundle: the service
      bays (six fans, two PSUs) keep their seats and every traffic cage is empty, which is
      how this switch ships before optics are chosen. UfiSpace publishes no base
      configuration for this chassis, so the library defines one. The AC supply is the
      seat because the bay defaults name it; see the ac and dc configurations for the
      orderable variants.
    default: true
    airflow: front-to-back
  ac:
    kind: orderable
    description: >-
      Dual 1300W AC PSUs (PSU-132-AISB) with front-to-back airflow fans (FAN-405637-HD, red
      handles) - the build the vendor's -4-view render shows. The back-to-front build
      (FAN-405637-CD with PSU-132-AESR, blue handles, photographed in -3-view) is orderable
      and not modelled, because the shared PSU and fan components carry only red-latch
      skins; no chassis SKU appears in any held document (see the chassis-sku gap)
    airflow: front-to-back
    component-attrs:
      psu-132-ac:
        model: PSU-132-AISB
      fan-405637:
        model: FAN-405637-HD
  dc:
    kind: orderable
    description: >-
      Dual 1300W DC PSUs (PSU-132-DISB, screw-terminal input, 60A fast-acting internal
      fuse per the HIG DC procedure) with front-to-back airflow fans (FAN-405637-HD)
    airflow: front-to-back
    bays:
      psu-0: ufispace/psu-132-dc@1
      psu-1: ufispace/psu-132-dc@1
    component-attrs:
      psu-132-dc:
        model: PSU-132-DISB
      fan-405637:
        model: FAN-405637-HD
