           group: status-leds, rel-pos: 2}
        - {ref: common/led-rect@1, id: led-fan,
           for: [rear/fan-0, rear/fan-1, rear/fan-2, rear/fan-3], at: [7.40, 65.04],
           states: ['off',
                   {name: ok, color: '#22c55e'},
                   {name: fault, color: '#f59e0b', behavior: blinking}],
           description: 'HIG Front Panel LED table, FAN row - Off (fans are not initialized),
             Solid Green (all FAN modules are working normal), Blinking Amber (FAN fail: one or
             more FAN modules need service)',
           group: status-leds, rel-pos: 3}
        - {ref: common/led-rect@1, id: led-ps0, for: rear/psu-0, at: [7.40, 67.66],
           states: ['off',
                   {name: ok, color: '#22c55e'},
                   {name: fault, color: '#f59e0b'}],
           description: 'HIG Front Panel LED table, PS0 row - Off (no power), Solid Green (PSU0 is
             working normal), Solid Amber (PSU0 fail, PSU0 needs service). Note the fault state is
             SOLID amber here where the FAN row blinks - two different rows of the same table',
           group: status-leds, rel-pos: 4}
        - {ref: common/led-rect@1, id: led-ps1, for: rear/psu-1, at: [7.40, 70.28],
