format: 1
kind: device
name: s9321-64eo
version: 1.0.0
maturity: modelled
manufacturer: UfiSpace
model: S9321-64EO
portfolio:
  line: AI Networking
  family: Datacenter Switch for AI/ML
  also-listed-in:
  - 'Cloud & Data Centers'
description: >-
  UfiSpace S9321-64EO 800G AI/ML data center switch - 2RU white box, 64x OSFP
  200/400/800G in four rows of sixteen plus a stacked SFP28 management pair, 1PPS and
  10MHz SMB timing inputs and an RJ45/micro-USB console, Broadcom Tomahawk 5 at
  51.2 Tbps; four hot-swap fans (3+1) and dual 3000W PSUs (1+1) at the rear, orderable
  in AC or DC, front-to-back airflow only. The OSFP faceplate is what separates this
  from the S9321-64E, which is the same chassis with 64 QSFP-DD
provenance:
  sources: >-
    UfiSpace S9321-64EO datasheet (working/intake/ufispace/converted/s9321-64eo-datasheet)
    for dimensions, weight, port inventory, platform, timing, power, environment and
    compliance; S9321-64E/EO Hardware Installation Guide (s9321-64eo-hig) - one document
    covering both variants - for the system overview, the EO's own front elevation, the
    port and optic-power tables, the FRU dimension drawings, the LED tables, grounding and
    rack mounting; three vendor renders (photos/s9321-64eo-1-view isometric, -2-view front,
    -3-view rear) for colour, orientation and construction. WHERE THE GUIDE DRAWS BOTH
    VARIANTS THE EO ELEVATION WAS USED, never the E: the two differ in cage type and in
    how the left cluster is arranged, and Figure 4 gives them different callout lists.
  figure-gating: >-
    HIG Figure 8 carries an elevation of each variant. The EO one spans 1365 x 273 px
    across the 436 x 87.7 mm face - aspect 5.000 against a true 4.971, 0.57% out - so it
    is orthographic enough to carry geometry, and it is the ruler for the whole front at
    3.131 px/mm. The front RENDER was gated too and passes better (501 x 101 px, aspect
    4.960, 0.22% out) but resolves only 1.15 px/mm, so it is used for colour, counts,
    connector orientation and one plausibility check, not for positions. HIG Figure 7's
    rear elevation FAILS the gate - 1195 x 269 px is aspect 4.44 against 4.971, 10.6% out,
    because the drawing carries a perspective bevel along its top edge - so nothing on the
    rear is scaled off it; see the rear-layout note.
  chassis: >-
    datasheet - 'Chassis (W x D x H) 2RU, 436 x 762 x 87.7 mm', weight 23.74 kg without
    FRU for the EO specifically (the HIG's Component Physical Information table lists the
    two variants separately: S9321-64E 23.72 kg, S9321-64EO 23.74 kg, and this model
    carries the EO figure). 436 is the body between the ear planes, not a rack face - the
    HIG Space Clearance section says the 'chassis width is 17.16 inches (43.6cm) and is
    shipped with an adjustable mounting rail kit suited for standard 19 inch (48.3cm) wide
    racks', so the rack hardware is additional to 436 and is not drawn. Depth 762 is the
    chassis without FRUs; the same section adds 29 mm for the fan handle and 30 mm for the
    PSU handle beyond it.
  port-grid: >-
    drawing - HIG Figure 8, EO elevation at 3.131 px/mm. THE PORTS ARE IN FOUR ROWS OF
    SIXTEEN, not two rows of thirty-two: sixteen cage columns, each carrying two OSFP in
    the upper bank and two in the lower. Column geometry came from the thirty-two green
    port lamps above the upper bank, which resolve as sixteen evenly spaced PAIRS - column
    0 centre 56.20 mm, column pitch 23.10 mm inside a group of four, group pitch 95.70 mm,
    fitted across all sixteen with a maximum residual of 0.25 mm. The sixteen drawn cage
    faces agree (first 44.7-67.1, last 400.9-424.5 against 44.65 and 424.15 predicted).
    Rows: the four cage bands measure 12.21-25.70, 27.31-41.12, 48.51-62.00 and
    63.93-77.42 mm, read off the bright bezel divider between each pair, so the parts are
    laid at 12.20, 27.55, 48.50 and 63.85, and each band is 13.5 mm tall - which is the
    OSFP module's own 13.0 mm height plus a cage bezel, a second reason to believe the
    reading. THE ROWS WERE MEASURED TWICE. The front render's black cage openings put the
    four row centres at 18.24, 32.99, 55.14 and 69.90 against the figure's 18.96, 34.22,
    55.26 and 70.68 - agreement to 0.12 mm on the third row and 1.23 mm at worst on the
    second. The figure's numbers are the ones carried: it resolves 3.131 px/mm against the
    render's 1.149, where one render pixel is already 0.87 mm, and what the render shows is
    the dark hole inside the cage rather than the aperture the figure draws. The residual
    is recorded rather than split, because splitting two readings is a third number neither
    source states. Numbering from the elevation's own blue
    numerals and the HIG Port Overview table ('Port ID 0~63 QSFP-DD or OSFP'): each column
    carries an even port above the odd one below it, left to right, 0..31 in the upper
    bank and 32..63 in the lower.
  cage-part: >-
    drawing/registry - the ports are OSFP, not QSFP-DD: the HIG states it twice, in the
    Port Overview note ('The S9321-64E features 64x800G QSFP-DD ports, while the
    S9321-64EO is equipped with 64x800G OSFP ports') and in Figure 4's callout '64x 800G
    OSFP'. spec/schemas/standards.yaml HAS NO OSFP KEY and the library had no OSFP part,
    so std/osfp@1 was built for this device: 23.10 x 13.50 mm measured off Figure 8, which
    brackets the OSFP MSA module envelope of 22.58 x 13.0 mm. It declares `interface: osfp`
    rather than `conforms:`, which is the honest form while the registry entry does not
    exist. See the osfp-registry gap.
  port-leds: >-
    drawing - two round lamps per column in the band above each bank, the left lamp
    belonging to the even (upper) port and the right one to the odd (lower) port, at the
    column centre -/+ 1.90 mm. Lamp rows measured at y 9.93-12.50 above the upper bank
    (centre 11.2) and 80.57-82.50 below the lower one (centre 81.6). The blue port numeral
    sits outboard of each lamp with a white triangle between them - the triangle points up
    for the even port and down for the odd, which is how the vendor disambiguates the pair.
    THE TRIANGLES ARE NOT MODELLED: sixty-four more silkscreen marks whose whole content
    is already carried by the numerals they sit under. Recorded here rather than left
    silent.
  optic-power-map: >-
    drawing - HIG Figure 9 marks sixteen ports in red on the EO panel and says '16 ports
    marked in red support 30W, while the remaining 48 ports support 16W'. The red blocks
    were measured against the column fit rather than counted by eye: they fall at
    44.9-68.4, 116.0-163.7, 211.3-259.6, 306.5-355.5 and 402.5-425.9 mm in the FIRST and
    the FOURTH cage row and nowhere else, which is columns 0, 3, 4, 7, 8, 11, 12 and 15 -
    eight columns, two rows, sixteen ports, matching the vendor's own count. That resolves
    to ports 0, 6, 8, 14, 16, 22, 24, 30, 33, 39, 41, 47, 49, 55, 57 and 63. This is a
    fact about the ports that no structure in the schema can hold, so it is carried as an
    attr string as well as here.
  mgmt-block: >-
    drawing/photo - the EO's left cluster is arranged DIFFERENTLY from the E's and was
    read off the EO elevation, not borrowed. Top to bottom: the 1PPS SMB jack centred
    (14.85, 9.80) and the 10MHz SMB centred (14.87, 24.04), both 7.4 mm across, in a
    honeycomb vent field, with a plain 5.9 mm round hole punched through that field at
    (6.6, 32.7) which no callout in Figure 4 names and which is drawn as decor rather than
    guessed at; the reset pinhole under a RESET legend; the model name; the
    micro-USB console; then a white six-row legend block at x 2.28-6.75, y 59.8-74.6 with
    its lamp column beside it at x 7.7-10.9 - SYNC, SYS, FAN, PS0, PS1 and a blue ID,
    which is HIG Figure 28's EO panel exactly (the E puts its lamps on the LEFT of the
    legend and its ID lamp separately above). The vertical USB 3.0 sits right of the lamps
    and the two RJ45s are stacked in a silver bezel at x 22.5-38.4, y 51.5-75.6, openings
    measured 53.78-61.49 and 65.67-73.38.
  jack-orientation: >-
    photo - at 26x on the front render the upper RJ45 shows its latch keyway UP with the
    eight contacts below, and the lower one shows the contacts UP with the keyway below,
    so the pair mirrors and the upper is drawn rotate: 180. WHICH IS WHICH WAS SETTLED BY
    THE LAMPS, not by the callout order: the lower jack carries a green lamp at its
    bottom-left and an amber one at its bottom-right, which is the HIG's Management port
    LED table (left green 1G, right amber 10M/100M), so the lower jack is the OOB port and
    the upper is the console. The panel legend agrees once read that way - 'IOIOI' with an
    up triangle for the console and a down triangle beside the network symbol for the OOB.
    common/rj45-ganged-eth@1 draws its two integrated lamps on the keyway side already,
    matching this device's photo; the mismatch common/rj45-hd@1 used to force (lamps drawn
    on the CONTACT side) is gone, and the jack stays unrotated because the contacts and
    keyway are geometry, unaffected by the lamp side.
  sfp-block: >-
    drawing - one stacked SFP28 pair in a silver ganged frame at x 24.15-39.80,
    y 12.50-44.62, the vendor's ports 64 and 65 printed in orange inside it. The two drawn
    module faces sit at y 17.67-25.70 and 32.77-41.12, so the 10 mm std/sfp apertures are
    centred on 21.69 and 36.95. The datasheet calls them '2 x 10/25G SFP28 ports' and the
    HIG Port Overview table gives ports 64~65 as SFP28, 1G/10G/25G, up to 40 km, while
    Figure 4's callout calls the same pair '2x 10G SFP+ Management'; the table's wider
    range is what the group carries. The lower cage is drawn rotate: 180 on the same
    belly-to-belly reasoning as the RJ45 pair, but the latch direction is NOT resolvable
    in any held image at this block's size - see the sfp-cage-orientation gap. THE 64 AND
    65 NUMERALS ARE MOVED OFF THE CAGES: Figure 8 prints them on the drawn module faces,
    where a seated transceiver would cover them, so they are placed in the frame bands
    immediately above each cage - the only spans of that frame a module does not fill.
    Their exact printed position is not resolvable in the 1.15 px/mm render.
  rear-layout: >-
    measured on the REAR RENDER, not on HIG Figure 7. That figure is a three-quarter view
    with a perspective bevel along its top edge and is 10.6% wrong in aspect, so it gives
    only what is on the face and in what order; the render (-3-view) spans 508 x 101 px
    across the 436 x 87.7 mm face, aspect 5.03 against a true 4.971 and 1.2% out, so it
    carries geometry at 1.165 px/mm. THE FAN BAY PITCH IS 84.0 mm AND NOT THE 81.0 mm THE
    HIG TABLES: two independent feature families on that render agree on it - the red
    airflow tags at x 11.2, 95.3, 179.4 and 265.2 and the fan status lamps at 18.5, 102.6,
    186.3 and 270.0, whose successive gaps run 83.7 to 85.8 and average 84.0 - and the
    fourth grille ends at 337, which 4 x 84 from x 4.0 reproduces exactly. The 81.0 mm the
    HIG's Component Physical Information table gives the fan module is drawn as the module
    FACE, leaving a 3 mm chassis web between bays, which is the same body-versus-face split
    the S9300-32D family shows and which the render's thin dark seams support. The PSU
    faces are the tabled 68 x 40.6 - Figure 5 prints those two numbers on the drawing - and
    sit at x 358.0 with their top edges at y 3.0 and 45.0, read off the render's PSU lamps
    at x 359.5 and its release tabs at 426.6-430.9. Between fan 3 and PSU0 the 21 mm strip
    carries the silver grounding plate with two M4 lug holes at (350, 10) and (350, 25),
    the earth symbol and the FAN 0 1 2 3 legend, which is where the render puts them and
    where the HIG's grounding section says the lug goes ('located on the rear of the
    router').
  frus: >-
    ufispace/psu-302-ac@1, ufispace/psu-302-dc@1 and ufispace/fan-808012@1 are REUSED, not
    built here: they were created for the sibling S9321-64E from the same shared
    S9321-64E/EO installation guide, and their 68 x 40.6 and 81 x 81.5 faces are the same
    numbers this model measured out of that guide's tables independently. Saying so
    matters - two files agreeing is evidence only when they were derived separately, and
    here the SOURCE is common even though the readings were not.
  views: >-
    Six views. TOP: y = 0 is the REAR, per the house convention and HIG Figure 4, whose
    footprint drawing prints the fan handles at the top; six long stadium recesses run
    across the cover on a measured 90 mm pitch from 161 mm, and their depth positions are
    ESTIMATED because that drawing is 8.4% stretched in its depth axis (it draws 436 x 762
    at aspect 0.524 against a true 0.572) - the x extents are fractions of a width the
    same drawing gets right. BOTTOM mirrors left-right and carries the compliance sticker
    at an estimated position. LEFT (x = 0 is the REAR) and RIGHT (x = 0 is the FRONT):
    each carries the five rail attachment pins the HIG rack-mounting section describes
    ('The chassis has 5 attachment pins on each side, for a total of 10 pins'), evenly
    spaced and ESTIMATED - no held drawing dimensions them. Both side faces carry only
    symmetric content, so the depth-axis conventions are stated here rather than exposed
    by any asymmetric feature.
  attrs: >-
    datasheet - Specifications, Performance, Environmental and Regulatory Compliance
    sections, transcribed into sections; timing from the datasheet's Timing and Timing
    Support rows and the HIG's 1PPS and 10MHz cabling sections. Compliance strings kept
    verbatim, semicolon-separated, untidied. THE NEBS STATEMENTS ARE THE HIG'S OWN WORDS
    and are a set of installation conditions, not a certification claim: the guide heads
    them 'Cautions and regulatory compliance statements for NEBS' and never says the
    product is certified to any NEBS level, so the attr says exactly that and no more.
  power: >-
    datasheet 'Typical power: 925 Watts (no transceiver)' - the vendor's own scope, so
    power-envelope is bare. The HIG gives TWO maxima, one per input type - 'The maximum
    system power consumption is 2279 watts' in the DC procedure and '2545 watts' in the AC
    one - and unusually it QUALIFIES them: 'Testing criteria for maximum power are as
    follows: Temperature 40 C, Optics: full populated, Traffic: 100% load'. That is a
    fully-configured measurement, and it is a different scope from the bare typical figure,
    so the two are carried as two facts and not reconciled. power-max-w takes the AC
    figure, 2545, because max means the highest; the DC figure is recorded beside it. PSU
    rating 3000 W per supply; at a 110 V AC input each supply delivers only 1500 W and
    hot-swap redundancy is lost (HIG note).
  part-numbers: >-
    The FRU part numbers (PSU-302-AESR, PSU-302-DESR, FAN-808012-HCE) are datasheet
    ordering lines and live on the configurations and the FRU contracts. Only ONE fan type
    and ONE airflow direction are offered - the HIG says 'The S9321-64E/EO airflow
    direction is front-to-back' with no alternative, and the datasheet lists a single fan
    ordering line - so unlike the 1RU boxes in this library there is no blue/red airflow
    pair to model. NO ORDERABLE CHASSIS SKU appears in any held document; the datasheet
    says only 'Contact our sales team for current configuration options'.
  lifecycle: >-
    searched 2026-08-28: 'UfiSpace S9321-64EO end of life' - no announcement found; the
    UfiSpace product page and distributor listings are live. none-announced is a real
    finding, not an absence.
attrs:
  performance:
    switching-capacity: 51.2 Tbps
    packet-buffer: 165.2 MB
  power:
    power-typical-w: '925'
    power-max-w: '2545'
    power-max-dc-w: '2279'
    power-envelope: bare
    power-max-scope: >-
      HIG Connecting Power - measured at 40 C ambient, optics fully populated and 100%
      traffic load; 2545 W is the AC figure and 2279 W the DC one
    input-ac: 200 to 240 V, 16 A per feed
    input-dc: -40 to -72 V, 80 A per feed
    psu-redundancy: 1+1 active-active hot-swappable
  thermal:
    fan-redundancy: 3+1 hot-swappable
    airflow: front-to-back only
  environmental:
    operating-temp: 0 to 40 C
    operating-humidity: 5 to 95% RH non-condensing
    storage-temp: -40 to 70 C
    storage-humidity: 5 to 95% RH non-condensing
  platform:
    asic: Broadcom Tomahawk 5 BCM78900
    cpu: Intel Xeon-D 4-core @ 1.9 GHz
    memory: 32 GB DDR4
    storage: 1x 128 GB M.2 SSD
    bmc: Aspeed AST2620
  features:
    optics-osfp: >-
      800GE OSFP OpenZR+/ZR/2xLR4/2xFR4/DR8+/DR8/SR8 and 400GE OSFP
      OpenZR+/ZR/ER4/LR4/FR4/SR8/DR4/DR4+/PLR4 (datasheet compatible transceiver list);
      the HIG port table gives ports 0~63 as 400G/800G up to 2 km
    optics-sfp28: >-
      1G/10G/25G on the management pair, up to 40 km per the HIG Port Overview table; the
      datasheet calls the same pair '2 x 10/25G SFP28 ports' and no module list is
      published for it
    optic-power-classes: >-
      sixteen ports take a 30 W optic and the other forty-eight take 16 W (HIG Figure 9).
      The 30 W ports are 0, 6, 8, 14, 16, 22, 24, 30, 33, 39, 41, 47, 49, 55, 57 and 63 -
      the first and fourth cage rows of columns 1, 4, 5, 8, 9, 12, 13 and 16 counting from
      the left
    timing: >-
      1PPS and 10MHz SMB input/output (premium), 50 ohm, cable not to exceed 3 m; Stratum
      3E OCXO holdover and ITU-T Synchronous Ethernet (SyncE). The datasheet's compatible
      cable row names 'SMB coaxial cable with 10-32UNF-2A connector for 1PPS and 10MHz',
      and the HIG offers a converter where the far end is BNC
  management:
    console: >-
      RJ45 RS-232 and micro-USB, both labelled IOIO, 115200 8N1 no flow control; the
      micro-USB needs a Silicon Labs CP210x driver (HIG Initial System Setup)
    oob: 1x RJ45 100/1000M plus the 2x SFP28 management pair
  compliance:
    safety: UL 62368-1; IEC 62368-1
    emc: >-
      FCC Part 15, Subpart B, Class A; ICES-003, Class A; EN 55032, Class A; EN 300 386;
      EN 55035; VCCI CISPR 32, Class A
    environment: WEEE
    nebs: >-
      NOT A CERTIFICATION - the HIG carries 'Cautions and regulatory compliance statements
      for NEBS': suitable for installation as part of the Common Bonding Network (CBN); an
      external Surge Protection Device must be used with AC powered equipment, installed
      at the AC power service entrance; can be installed in Network Telecommunications
      Facilities where the National Electric Code applies; the DC input terminals are DC-I
      (isolated DC return) and the RTN terminal should be isolated from the chassis or
      rack; the intra-building OOB Ethernet port is suitable for connection to
      intra-building or unexposed wiring only (Type 2, 4 or 4a per GR-1089). No NEBS level
      is claimed anywhere in the held documents
    installation: >-
      restricted-access server or computer room only; suitable for Information Technology
      Rooms per Article 645 of the National Electrical Code and NFPA 75
  lifecycle:
    eol: none-announced
chassis:
  width: 436
  height: 87.7
  depth: 762
  ru: 2
  weight-kg: 23.74
  color: '#404244'
gaps:
- what: osfp-registry
  scope: [osfp-800g]
  reason: needs-drawing
  note: >-
    spec/schemas/standards.yaml carries no `osfp` key, so std/osfp@1 - built for this
    device - declares `interface: osfp` instead of `conforms:`, and L9 therefore never
    checks its 23.10 x 13.50 mm aperture against anything. The number is measured off HIG
    Figure 8 and corroborated by the OSFP MSA module envelope (22.58 x 13.0 mm), which is
    not the same thing as the MSA's own faceplate-opening figure. The cage DEPTH, 47 mm,
    is a straight estimate: no held document dimensions an OSFP receptacle.
    The same absence shows up a second time in the tooling: lint's own PLUGGABLE_CAGES set
    lists eleven cage media and not osfp, so L40 skips the osfp-800g group and then reports
    `attrs.optics-osfp` as naming no group's media. THAT WARNING IS LEFT STANDING because
    it is true and it is this gap's own record - the optics list is correct and nothing in
    the toolchain can currently reach it through the media name.
  wanted: >-
    the OSFP MSA faceplate cutout and receptacle-depth figures, so the key can be added to
    the registry and std/osfp@1 can carry `conforms:`; and `osfp` added to lint's
    PLUGGABLE_CAGES so L40 can resolve the optics prose
- what: port-led-semantics
  scope: [osfp-800g, sfp28-mgmt, port-leds]
  reason: vendor-silent
  note: >-
    The HIG's section 10 tables the six system lamps, the PSU and Fan FRU lamps and the
    RJ45 management jack, and says nothing about the port lamps: not what the single lamp
    beside each OSFP means, and nothing at all about the SFP28 pair. Every port lamp keeps
    the off/on component default rather than an invented vocabulary.
  wanted: >-
    a per-NOS LED table from UfiSpace or a NOS vendor, or photographs of a live unit with
    ports in known states
- what: sfp-cage-orientation
  scope: [sfp28-mgmt]
  reason: needs-photo
  note: >-
    The two SFP28 cages are drawn belly-to-belly, the lower one rotate: 180, by analogy
    with the RJ45 pair four rows below it whose mirror IS resolvable in the front render.
    The SFP block itself is 15.7 mm wide in a 1.15 px/mm render and the guide draws
    modules seated in it, so neither image resolves the latch direction. If the pair is
    NOT mirrored the lower cage is drawn upside down.
  wanted: a square-on close-up of the SFP28 block, or the unit in hand
- what: rear-strip-width
  scope: [rear, fans, psus]
  reason: needs-drawing
  note: >-
    sources-disagree on the fan, and the disagreement is recorded rather than reconciled
    away: the HIG Component Physical Information table gives the fan module 81.0 mm wide,
    while the rear render puts the bays on a measured 84.0 mm pitch (two independent
    feature families agreeing to 0.3 mm). The manifest carries the tabled 81.0 face on the
    measured 84.0 pitch, which reads as a 3 mm chassis web - the same resolution the
    S9300-32D family's fan needed, and an inference either way. HIG Figure 7, which would
    settle it, fails the aspect gate at 10.6% out and cannot be measured.
  wanted: >-
    an orthographic rear elevation or a vendor mechanical drawing of FAN-808012, or a
    caliper across two adjacent fan bays
- what: fru-face-detail
  scope: [ufispace/psu-302-ac@1, ufispace/psu-302-dc@1, ufispace/fan-808012@1]
  reason: needs-photo
  note: >-
    The only images of the PSU and fan faces in place are HIG Figure 7 at roughly
    2.9 px/mm and a 520 px product render. The FRU components those bays seat were built
    from the same material for the sibling S9321-64E; their outlines are the vendor's
    tabled dimensions but their face artwork - vent fields, handle, latch and lamp
    positions - is proportioned, not measured.
  wanted: square-on photographs of a PSU-302 and a FAN-808012 out of the chassis
- what: chassis-sku
  scope: [base, ac, dc]
  reason: vendor-silent
  note: >-
    No held document prints an orderable chassis part number. The datasheet's
    configuration row says only 'Contact our sales team for current configuration options'
    and the HIG names the product as S9321-64E/EO throughout. Per the S9510-28DC
    precedent, orderable SKUs exist at the owner even when no PDF prints one, so the
    configurations carry no part-numbers rather than invented ones.
  wanted: a UfiSpace ordering guide or a quote naming the chassis SKUs
- what: side-and-underside-detail
  scope: [left, right, bottom, top]
  reason: needs-drawing
  note: >-
    The five rail attachment pins per side are described in words by the HIG and drawn
    without dimensions, so they are placed evenly and marked estimated, as is the
    compliance label on the underside. The six top-cover recesses come from a footprint
    drawing that is 8.4% stretched in its depth axis, so their y positions and heights are
    estimates on an even fit rather than measurements.
  wanted: a UfiSpace mechanical drawing, or square-on photographs of the sides and underside
groups:
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster at the left edge - the RS-232 console RJ45, the micro-USB
      console that reaches the same UART, the USB 3.0 maintenance port, the out-of-band
      RJ45 and the recessed reset button
  timing:
    term: Port
    role: management
    index-origin: 1
    description: >-
      the two SMB timing interfaces, 1PPS and 10MHz, both input/output and 50 ohm; they
      discipline the Stratum 3E OCXO that SyncE runs from
  sfp28-mgmt:
    term: Port
    role: management
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
    description: >-
      the stacked SFP28 pair the vendor numbers 64 and 65 - a second out-of-band path,
      1G/10G/25G and up to 40 km per the HIG Port Overview table
  osfp-800g:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: osfp, speed: 800g}
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the chassis indicators - SYNC, SYS, FAN, PS0, PS1 and the blue ID beacon
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      one lamp per OSFP port, in the band above the upper bank and below the lower one
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 active-active hot-swappable'
  fans:
    term: Fan
    role: service
    index-origin: 0
