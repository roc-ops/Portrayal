configurations:
  base:
    kind: base
    source: >-
      derived - built from the group roles rather than from a vendor bundle: the service
      bays (four fans, two PSUs) keep their seats and every traffic cage is empty, which is
      how this switch ships before optics are chosen. UfiSpace publishes no base
      configuration for this chassis - the datasheet's configuration row says only
      'Contact our sales team for current configuration options' - so the library defines
      one. The AC supply is the seat because the bay defaults name it.
    default: true
    airflow: front-to-back
  ac:
    kind: orderable
    description: >-
      Dual 3000W AC PSUs (PSU-302-AESR, IEC 60320 C20 inlet, 200-240 V) with the single
      offered fan type (FAN-808012-HCE). At 110 V each supply delivers only 1500 W and 1+1
      redundancy is lost (HIG note). No chassis SKU appears in any held document (see the
      chassis-sku gap)
    airflow: front-to-back
    component-attrs:
      psu-302-ac:
        model: PSU-302-AESR
      fan-808012:
        model: FAN-808012-HCE
  dc:
    kind: orderable
    description: >-
      Dual 3000W DC PSUs (PSU-302-DESR, two-hole lug terminal block, -40 to -72 V, 150 A
      fast-acting internal fuse per the HIG DC procedure) with FAN-808012-HCE fans
    airflow: front-to-back
    bays:
      psu-0: ufispace/psu-302-dc@1
      psu-1: ufispace/psu-302-dc@1
    component-attrs:
      psu-302-dc:
        model: PSU-302-DESR
      fan-808012:
        model: FAN-808012-HCE
