configurations:
  ac:
    kind: base
    description: >-
      The chassis as HIG Figure 7's rear elevation and the vendor's rear product
      photograph both show it - four FAN-803816-HC exhaust fans and two PSU-202-AESR
      2000 W AC supplies with portrait appliance inlets and red latches, front-to-back
      airflow, and the twenty-five traffic and management ports empty. The HIG rates the
      feed at 200-240 V and notes that on a single 110 VAC source each supply delivers
      1000 W and cannot then be swapped while the router is running. No orderable
      chassis part number appears in any held document; see the chassis-sku gap.
    default: true
    airflow: front-to-back
    component-attrs:
      psu-202-ac:
        model: PSU-202-AESR
      fan-803816-hc:
        model: FAN-803816-HC
  dc:
    kind: orderable
    description: >-
      Dual 2000 W DC supplies (PSU-202-DESR, a two-post screw terminal under a hinged
      plastic cover, red latch, drawn in HIG Figure 6) with the same FAN-803816-HC
      exhaust fans. Datasheet input -40 to -72 V at 60 A; the HIG's DC section gives the
      maximum system consumption as 993 W against the AC build's 987 W, and notes an 80 A
      fast-acting fuse built into each supply against the AC build's 15 A.
    airflow: front-to-back
