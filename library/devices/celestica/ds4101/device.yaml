format: 1
kind: device
name: ds4101
version: 0.1.0
maturity: modelled
manufacturer: Celestica
model: DS4101
description: >-
  Celestica DS4101 - a 1RU 32-port 800G data-centre switch on a Broadcom Tomahawk 4-100 (25.6 Tbps): thirty-two
  OSFP ports in four blocks of four stacked columns across a black front panel, with the system lamps
  and one silver housing stacking an RJ45 console, a USB 3.0 Type-A and an RJ45 1000BASE-T management
  port at the LEFT end, and a stacked pair of 10G SFP+ cages (M1/M2) at the right. The rear carries two
  2000 W hot-swap AC supplies at the ends and seven hot-swap black fan modules between them (6+1). The
  mirror image of its sibling celestica/ds4100's layout, which puts the management housing at the right.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Two documents and two vendor renders. The DS4101 installation guide (Celestica documentation portal,
      HTML) carries the Product Specifications table, four Product Overview figures (front elevation,
      side view, rear elevation, rear three-quarter), the PSU and fan removal figures, the What's in the
      Box SKU table and the Ground Lug Installation photographs. It has NO LED table. The DS4101 datasheet
      carries the features, silicon, power, dimensions and approvals. cls.celestica.com/hardware-platforms/
      ds4101/ serves three-quarter renders saved as working/intake/celestica/photos/ds4101-A.png, -AB.png
      and -social.png; they are perspective and are used for colour, legends and counts only.
  gate-1:
    confidence: measured
    note: >-
      BOTH OVERVIEW ELEVATIONS ARE ORTHOGRAPHIC. Figure 1 (front) is 8246 x 2225 px and its face box reads
      6836 x 673 px (x 1049-7884, y 1016-1688): aspect 10.158 against the stated 438.5 x 43.1 mm, 0.16%
      out, 15.59 px/mm across and 15.62 down. Figure 3 (rear) reads 5986 x 589 px, aspect 10.163, 0.11%
      out, 13.65 px/mm. Both JPEGs are upscales - edges are two to three pixels soft - so positions are
      good to roughly 0.2 mm, not to the pixel.
  the-guide-figure-is-untextured-cad:
    confidence: photo-measured
    note: >-
      THE GUIDE DRAWS A LIGHT GREY FACE AND THE PRODUCT IS BLACK. Figure 1 is a flat-shaded CAD render:
      pale grey plate (#c3c1be sampled), no printing at all, not even port numbers. The product-page render
      draws the same face black (#080808 in the flat bands) with white legends. The CAD carries the geometry
      and the render the finish: the chassis colour and every legend on this face are the render's, and
      every position is the CAD's. DS4100's own guide figure is textured and black, which is what the
      DS4101 render shows too.
  the-osfp-wall:
    confidence: measured
    note: >-
      FOUR BLOCKS OF FOUR STACKED COLUMNS. Profiling the thin cage walls inside the lower openings (y
      27) puts the inner dividers at 54.88, 78.10, 101.32 | 150.97, 174.19, 197.41 | 247.41, 270.60, 293.82
      | 343.50, 366.69, 389.91: an in-block pitch of 23.214 (23.22, 23.22, 23.205, 23.205 per block) and
      a block pitch of 96.197 from the middle dividers (96.09, 96.41, 96.09), a 3.34 mm gutter. Column
      1 is centred at 43.27, its left cage wall reading 31.59. Aperture rows read 5.89-18.00 and 24.27-36.38
      (12.1 tall), so std/osfp@1 is centred at y 11.95 and 30.33, a row pitch of 18.38. Odd ports upper,
      even lower, left to right - the render prints `1 (up)(down) 2` through `31 (up)(down) 32`. Upper
      cages rotate 0 and lower 180 by the library's belly-to-belly rule (L108).
  the-port-lamp-windows:
    confidence: measured
    note: >-
      SIXTY-THREE SMALL WINDOWS IN THE BAND BETWEEN THE ROWS. Figure 1 draws dark 2.0 x 1.5 mm squares
      at y 20.37-21.90, two each side of every column wall on a 3.03 mm pitch - groups of four straddling
      each divider, two at each block end - and the render shows the same squares, unlit, beside its legends.
      Column 1's left end has one where every other column end has two; the render prints the USB SuperSpeed
      mark in the missing one's place, so it is recorded as absent, not added. WHAT THEY MEAN IS NOT DOCUMENTED
      - the DS4101 guide has no LED table. Two windows per port fits the SKU's "32x 2x400GbE" description
      (one lamp per 400G half), and each column's left pair is assigned to its upper (odd) port and its
      right pair to the lower (even) port. THAT ASSIGNMENT IS AN ASSUMPTION, recorded in the port-lamp-meaning
      gap. common/led-rect-sm@1 (2.8 x 1.6) is seated on each measured centre; the windows are 2.0 x 1.5,
      and the library's nearest part is used at the right pitch rather than a new part drawn for a guess.
  legends:
    confidence: estimated
    note: >-
      FROM THE PERSPECTIVE RENDER, SO POSITIONS ARE ESTIMATED. ds4101-A.png prints `N (up)(down) N+1`
      between each column's cages (it appears right of centre, but the cages stand proud of the plate
      and the render looks from the left, and a right-shifted legend would sit on the column's right-hand
      windows - so it is centred); STAT, FAN, PWR and ALM beside the four lamps, printed on a slant (about
      45-50 degrees, read through the render's shear); the Celestica wordmark across the top-left corner;
      a serial "IOIOI" console mark under it; the USB SuperSpeed mark at the left end of the band; a network-tree
      mark under the ALM lamp for the management jack; and `M1 (up)(down) M2` between the SFP+ cages.
      The trident beside SS is not drawn. Sizes are scaled from the render against the columns.
  the-management-housing:
    confidence: measured
    note: >-
      ONE SILVER HOUSING, x 11.7-28.3 by y 6.5-38.6 on Figure 1, stacking console (top, keyway up), USB
      Type-A and MGMT (bottom, latch and its two lamps at the bottom - two green-white squares at (15.3,
      37.1) and (26.1, 37.1) on the figure) - the guide's callout reads "Top: 1xConsole Serial, Middle:
      1xUSB Type A 3.0, Bottom: 1xEthernet RJ45". Jacks are std/rj45-ganged@2 cells and std/usb-a@1 centred
      on the housing; the console cell is turned 180 so its latch slot is at the top, as drawn, and MGMT
      is common/rj45-ganged-eth@1 upright, whose lamps sit in its latch-side (bottom) corners.
  the-system-lamps:
    confidence: measured
    note: >-
      Four green domes 3.6 mm across at x 7.70, y 11.79, 16.82, 21.84 and 26.99 (5.07 pitch), callouts
      Sys, Fan, PSU and Alarm Status; the render prints STAT, FAN, PWR and ALM. common/led-indicator@1
      on the centres. With no LED table in this guide the states are off/on only; the DS4100's table (SYS/FAN/PSU/ALM)
      is a different panel and is not borrowed.
  the-sfp-pair:
    confidence: measured
    note: >-
      Two SFP+ cages at x 416.5-431.4 - openings x 418.36- 429.23 - frames about y 9.3-20.0 and 22.6-33.3;
      std/sfp@1 centred on x 423.8, y 14.65 and 27.95, upper 0 and lower 180. BOTH LAMPS ARE ABOVE THE
      UPPER CAGE, green, at (420.86, 7.91) and (426.76, 7.91), 2.4 mm across; the render prints M1 under
      the left one and M2 under the right, so left is M1's and right M2's. Below the pair a two-row vent
      patch and, at the foot, the LUG TAG - celestica/lug-tag-ridge-16@1, the top-ridge card, printed
      DS4101; the render prints LUG TAG on the PANEL just above it, not on the card.
  vent-fields:
    confidence: measured
    note: >-
      A row of short slots along the top edge (y 1.2-2.0, about 1.6 long on a 2.5 pitch) and another along
      the bottom (y 40.7-41.6), a 3 x 3 patch below the lamps (x 2.5-10.3, y 29.5-40.5), a column down
      the right edge (x 432.6-437.6) and short rows above and below the SFP+ pair. The render draws the
      same bands as larger square perforations; the CAD's extents are used.
  rear:
    confidence: measured
    note: >-
      Figure 3 at 13.65 px/mm. Two supplies, same orientation, frames x 10.4-66.6 and 376.8-433.0 by y
      1.8-41.8 - see celestica/psu-2000-ac@1. Seven black fan faces: across the handle bar they read 69.23-110.25,
      113.18-154.20 ... 333.16-374.33 (41.0 wide) on a 43.99 pitch, and y 1.83-40.61; the green lamps
      at upper left read x 73.65, 117.69 ... 337.67 at y 5.86. Bays use celestica/fan-40@1's 39.3 x 39.0
      centred on those - the same fan module as the DS4000's and the DS4100's (lamp at module (3.6, 4.2)
      against the part's (3.7, 3.6), pitch 43.99 against 43.96), in its default black. THE LATCH IS SET
      BLACK, NOT THE PART'S BLUE: the Fan Removal figure names a "blue latch", but it is recessed under
      the handle and the rear elevation shows none at the handle band's end - sampled #000002 to #020202
      there, with at most a sub-millimetre dark-blue sliver on edge - so latch-finish is #050506 on this
      face (reviewer's call). At the far left two empty round holes (x 6.0, y 23.8 and 33.6), the ground-lug
      bracket's two M3 holes; the AC build ships without the bracket.
  power:
    confidence: datasheet
    note: >-
      Datasheet Power and Cooling: "1+1 redundant, hot swappable 2000W PSUs", "AC 47~63Hz, 100~240 V nominal,
      90~264V max", "6+1 redundant fans, front to back". THE GUIDE'S POWER CONSUMPTION CELL IS EMPTY (it
      reads "\") and the datasheet gives no chassis draw, so no power-draw figure is recorded.
  colour:
    confidence: photo-measured
    note: >-
      Front #161718 from the product render's flat bands (the guide's CAD is untextured grey). Rear sheet
      metal #c3c5c8 from Figure 3's frame, which the rear render agrees is silver.
  lifecycle:
    confidence: datasheet
    note: >-
      Listed as a current platform on cls.celestica.com/hardware-platforms/ds4101/ when fetched on 2026-09-26;
      no end-of-life notice was found there or on the documentation portal.
attrs:
  physical:
    dimensions-note: W 438.5 x D 657.5 x H 43.1 mm (datasheet and guide)
  performance:
    switching-capacity: 25.6 Tbps
    port-speeds: 10/25/40/50/100/200/400GbE capable; SKU text 32 x 2x400GbE
  power:
    psu-rating-note: 1+1 redundant hot-swap 2000 W PSUs
    input-ac: 100 ~ 240 VAC (50-60 Hz) (guide); 100-240 V nominal, 90-264 V max, 47-63 Hz (datasheet)
  thermal:
    airflow-options: front-to-back only
  environmental:
    operating-temp: 0 to 40 C at 950 m
    humidity: 5% to 85% (guide); 5% to 95% non-condensing (datasheet)
  platform:
    switch-silicon: Broadcom StrataXGS Tomahawk 4-100 (TH4-100)
    cpu: Intel Hewitt Lake (Xeon D) 4-core or 8-core, 2.9 GHz
    memory: up to 32 GB ECC DDR4
    storage: 128 GB or 256 GB SSD
    bmc: RunBMC option (OpenBMC)
    software: SONiC; ONIE installer; ONL; Redfish
  features:
    optics-osfp: >-
      up to 20 W transceivers, up to 28 W on ports 1, 2, 31 and 32 (guide); up to 20 W / 26 W (datasheet)
    timing: >-
      IEEE 1588 1-step and 2-step time stamping; transparent and boundary clock; SyncE clock recovery
      (option)
  compliance:
    emc: CN (GB9254-2008), EU (EN55022, EN55024), FCC, VCCI
    safety: UL/CSA/IEC/EN 60950-1/62368-1
    environment: EU RoHS, SVHC requirements of REACH, China RoHS
  lifecycle:
    eol: none-announced
chassis: {width: 438.5, height: 43.1, depth: 657.5, ru: 1, color: '#161718', airflow: front-to-back, power: ac}
gaps:
- what: port-lamp-meaning
  scope: [front]
  reason: vendor-silent
  wanted: >-
    What the sixty-three windows between the port rows show and which port each serves. The DS4101 guide
    has no LED table; the sibling DS4100's table gives one bicolour lamp per OSFP port and the DS4100
    face has no such windows at all, so it is no guide here. Each column's left pair is assigned to its
    upper port and its right pair to the lower port as an assumption, and column 1 has a single left window.
    A port-LED table or a photograph of a powered unit settles it.
- what: psu-artwork-disagrees
  scope: [rear]
  reason: sources-disagree
  wanted: >-
    Which supply the DS4101 ships. The overview rear elevation draws a black grip, a C20 inlet and a yellow
    latch, and the box ships a C20-C21 cord; the same guide's PSU Removal figures draw a silver module
    with a grey grip, a black latch and a C14. The overview and the cord agree and are modelled; see celestica/psu-2000-ac@1.
- what: humidity-and-optics-power
  scope: [front]
  reason: sources-disagree
  wanted: >-
    The guide gives 5-85% humidity and 20 W optics (28 W on ports 1, 2, 31, 32); the datasheet gives 5-95%
    and "20W/26W". Both are recorded in attrs; neither is preferred.
- what: fan-and-psu-numbering
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    Which end FAN1 and PSU1 are. No figure labels a bay and this guide has no LED table naming them. Bays
    are numbered left to right as seen from the rear; nothing is printed.
- what: the-four-undrawn-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    Orthographic drawings of the lid, underside and side walls. Figure 2 is a side view in perspective
    and the renders show a plain lid with a recessed plate towards the rear; neither can be measured.
groups:
  osfp:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the thirty-two 800G OSFP ports, four blocks of four stacked columns on a 23.214 mm pitch with a
      3.34 mm gutter, odd ports the upper row and even the lower, as the render's `N (up)(down) N+1` legends
      say; sold as 32 x 2x400GbE.
    attrs: {media: osfp, speed: 800g}
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      the sixty-three unlabelled lamp windows between the port rows - two per side of each column wall;
      which port each serves is assumed, see the port-lamp-meaning gap.
  sfp-leds:
    term: LED
    role: indicator
    index-origin: 1
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band ports: the RJ45 console, the USB 3.0 Type-A and the 1GbE RJ45 management jack in
      one stacked housing at the left, and the two 10GbE SFP+ cages at the right that the panel legends
      M1 and M2.
  leds:
    term: LED
    role: indicator
    index-origin: 1
  furniture:
    term: Part
    role: furniture
    index-origin: 1
    description: the pull-out LUG TAG under the SFP+ pair.
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        datasheet: "1+1 redundant, hot swappable 2000W PSUs", and the guide: "1+1 redundant, hot swappable
        2000W PSUs"; the rear figure counts two.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 6+1
      redundancy-note: >-
        datasheet and guide: "6+1 redundant fans"; the rear figure counts seven ("Fan Module 7x").
