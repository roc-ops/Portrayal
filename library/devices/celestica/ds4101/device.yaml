configurations:
  ac-f2b:
    kind: base
    default: true
    description: >-
      Two 2000 W AC supplies and seven fan modules, front-to-back - the only airflow the DS4101 is sold
      in - with the COMe 4C / 32 GB DDR4 / 128 GB SSD control plane (R4030-F9001-A1).
    component-attrs:
      fan-40: {latch-finish: '#050506'}
    part-numbers:
      R4030-F9001-A1: {part: R4030-F9001-A1}
  ac-f2b-16g:
    kind: orderable
    description: >-
      The same chassis, supplies and fans with the COMe 4C / 16 GB DDR4 / 64 GB SSD control plane (R4030-F9003-A1).
      The faces are identical; only the ordering code differs.
    component-attrs:
      fan-40: {latch-finish: '#050506'}
    part-numbers:
      R4030-F9003-A1: {part: R4030-F9003-A1}
