format: 1
kind: device
name: es1050
version: 1.0.0
maturity: modelled
manufacturer: Celestica
model: ES1050
description: >-
  Celestica ES1050 - 1U 48-port access switch with 16 x 2.5GbE and 32 x 1GbE RJ45 ports (PoE++ 802.3bt
  Type 4 Class 8 on the -48CP) and 4 x 1/10/25G SFP28 uplinks, Broadcom TD3.X2, 2+1 fixed fans, 1+1
  hot-swap AC supplies, F2B or B2F airflow. Four orderable builds on one chassis.
profile: networking
provenance:
  own-device:
    confidence: datasheet
    note: >-
      ONE DEVICE, NOT A LISTING OF celestica/es1010. The guide's Front Panel Table 1 gives the ES1010 builds
      48 x 1GbE and the ES1050 builds 32 x 1GbE + 16 x 2.5GbE; it prints separate front figures (figure 1
      ES1010, figure 2 ES1050) that differ in the green stripe under ports 1-16 and the plate text; the
      LEDs Table 3 gives the 2.5GbE link lamp its own meaning; and the ES1050 datasheet orders its own part
      numbers (R4048-F90L2-A1, -F91L2-A1, -F90L3-A1, -F91L3-A1) where the ES1010 orders R4048-F90LA-A1 and
      its siblings. The chassis (438.2 x 43.4 x 371.6, 2 supplies, 3 fans, 4 SFP28, one management
      cluster) and the rear are the same for the family: guide System Overview and Rear Panel figure 1,
      captioned 'ES1010 and ES1050'.
  chassis:
    confidence: datasheet
    note: >-
      datasheet PHYSICAL DIMENSIONS: height 43.4 mm, width 438.2 mm, depth 371.6 mm; the guide's Key System
      Specifications agrees and gives 8 +/- 0.5 kg with two supplies. 438.2 is the body between the ear
      folds: the guide's front figure draws the grey ears outside it.
  front-figure:
    confidence: measured
    note: >-
      Guide Front Panel figure 2 (ES1050-48C and ES1050-48CP, an orthographic CAD render, 3090 x 340 px).
      Two independent edges fix the scale: the left edge of the first RJ45 block (218 px) and the left edge
      of the management RJ45 shell (2722 px) lie 2504 px apart, where the measured celestica/es1000 front
      puts them 399.44 mm apart, 6.269 px/mm; the body between the ear folds measures 2747 px for 438.2 mm,
      6.267 px/mm. The four RJ45 blocks start at 218, 794, 1370 and 1942 px (92.0 mm pitch), the block shells
      run y 124 to 269 px, and the uplink cluster and lamp column sit where es1000's do, so the ports,
      cluster and lamps use the es1000 front's measured positions (checked, none taken from any other
      pending work). A constant 1.8 mm offset between the ear-fold edge as detected and as es1000 frames it
      is the ear bevel, the same at both ends. Resolution is 0.16 mm per pixel; the positions are good to
      about 0.5 mm.
  port-layout:
    confidence: measured
    note: >-
      column pitch 13.96, block pitch 92.00, column 1 centred 15.86 from the left body edge; upper jacks
      keyway-up (rotate 180) and lower keyway-down, the lamp windows on the keyway side, as measured on
      es1000's close-ups. The ES1050 figure shows the same two rows of six columns per block.
  port-speeds:
    confidence: datasheet
    note: >-
      guide Ports Tables 3 and 4: ports 1-16 are 100/1000 Mbps/2.5 Gbps auto-negotiation, ports 17-48 are
      10/100/1000 Mbps; the datasheet FEATURES says 32 ports 1000Base-T and 16 ports 1000Base-T / 2500Base-T.
      The four SFP28 are 1/10/25G (datasheet). The management RJ45 is 10/100/1000 and the management SFP
      1000 Mbps (Ports Tables 3 and 4), one combo interface.
  poe:
    confidence: datasheet
    note: >-
      IEEE 802.3bt Type 4 Class 8, 90 W per port, on the -48CP builds only: guide Ports Table 4 ('Port 1-48
      support PoE++') against Table 3 for the -48C, which has no PoE line; datasheet ORDER INFORMATION lists
      'POE++' on R4048-F90L3-A1 and R4048-F91L3-A1 only. The guide's System Overview sentence that all data
      ports support Class 8 is read with its SKU table, where the PoE++ column says 'No' for the -48C.
  stripe:
    confidence: estimated
    note: >-
      the green stripe under ports 1-16, drawn on the faceplate under the RJ45 blocks and carrying the
      numbers 1 to 16 in dark print; ports 17-48 print white on the black faceplate. Extent read on figure 2:
      x 215 to 979 px and y 273 to 287 px, that is 9.0 to 130.9 mm by 39.9 to 42.1 mm in the es1000 frame.
      Colour sampled from the stripe fill away from the digits (median 105, 148, 4 = #699404); the
      colour is the JPEG's, so estimated. The stripe is the drawing's mark for the 2.5GbE ports; the
      guide's text gives no name for it.
  port-leds:
    confidence: datasheet
    note: >-
      guide LEDs Table 3: the right lamp is green activity with PoE off, amber with PoE on, amber then green
      alternating when PoE power is denied; the left link lamp is green at 2.5GbE and amber at 10/1000M for
      the ES1050 builds. Ports 17-48 run at 1GbE at most, so the guide's 2.5GbE colour reading is not
      carried to them (gap port-lamp-meaning-1g-ports). The management RJ45 follows Table 2 (green 2.5GbE,
      amber 10/100M, green activity). Each SFP28 port has one bi-colour lamp (green 25G, amber 1/10G),
      drawn as the triangles between the stacked cages as on es1000.
  stack-orientation:
    confidence: estimated
    note: >-
      rule, not a reading: the SFP28 pairs (upper 0 over lower 180) follow the library's belly-to-belly
      convention (L108). The figure draws the cage lips in the lamp band between the rows, which is what
      the convention draws; nothing seen overturns it.
  uplink-cluster:
    confidence: measured
    note: >-
      positions as measured on es1000's close-ups (SFP28 bezel 375.0 to 403.5, management SFP, USB-A shells,
      the stacked management shell, status lamps), confirmed on figure 2 by the management RJ45 left edge
      (407.3 against 407.0 mm, in the frame of the detected edge) and the system lamp (x 2368 to 2385 px).
  vents:
    confidence: measured
    note: >-
      the same two lattices and fields as es1000's 48-port panel: figure 2 shows the perforation above RJ45
      blocks 1-2, a plain field above block 3, perforation again above block 4 and around the uplinks, and
      flat metal at every port, lamp and legend. The holes drawn are larger than the real ones.
  legends:
    confidence: measured
    note: >-
      every legend as printed in figure 2: port pairs 'N ▲▼ N+1' centred under each column (dark on the
      stripe for 1-16, white for 17-48), SFP28 pairs under the bezel, MGMT COMBO with its bracket, IOIOI
      under the console, STAT FAN PWR ALM beside the lamps, the SuperSpeed mark by both USB-A ports. The plate
      reads ES1050 with LUG TAG under it.
  lug-tag:
    confidence: measured
    note: >-
      celestica/lug-tag-ridge-23@1, label ES1050, at the position es1000 measured for the same plate; figure
      2 shows the dark pull-out tab at the same place (x 205 to 275 px display, y 30 to 45) printed ES1050.
  rear-figure:
    confidence: measured
    note: >-
      guide Rear Panel figure 1 (5736 x 634 px, 11.5 px/mm, one drawing captioned 'ES1010 and ES1050').
      The fans, the two supply bays, the divider, the right strip, the earth points and the bosses are the
      positions celestica/es1000 took off this same figure (supply edges 256.0, 329.5, 346.3, 419.8; fan
      centres 50.14, 105.59, 161.09), re-read here by eye on the figure: fan left to right 1 to 3, a
      supply with its inlet portrait at the right of each, the black release tab beside each inlet, two
      green lamps at the foot of each supply, PSU 1 labelled left of its bay and PSU 2 in the strip at the
      right edge.
  fans:
    confidence: datasheet
    note: >-
      '2+1 fixed fans' (datasheet); 'three fixed fans' (guide Rear Panel, Fans). Not field-replaceable,
      so decor plus a region each, as on es1000. No fan power figure is published.
  psu:
    confidence: datasheet
    note: >-
      guide System Overview SKU table: 2 x 550 W on the ES1050-48C and 2 x 1600 W on the ES1050-48CP, both
      F2B and B2F; the supplies drawn in Rear Panel figure 1 are the CRPS form, so celestica/psu-crps-550-ac@1
      and celestica/psu-crps-1600-ac@1, whose contracts were measured off the same figure. Neither document
      gives a supply part number (gap psu-part-numbers).
  power:
    confidence: datasheet
    note: >-
      guide Key System Specifications: 'ES1050-48CP ... <3200W, ES1050-48C ... <550W'. Stated as upper
      bounds with no ambient or load, filed as max for the family because a configuration cannot carry its
      own attrs.
  sides-top-bottom:
    confidence: estimated
    note: >-
      the guide's System Overview figure 1 is a three-quarter render of the ES1050: a plain silver lid with
      two pressed rounded-square pads (one near the front on the left, one near the rear on the right), a
      rectangular label outline beside the rear pad, small round screws on the lid and along the visible
      side. The chassis is the family's (same 438.2 x 43.4 x 371.6). Pads, label outline and side screws are
      placed by proportion from that render and from the ES1010 and ES1000 drawings of the same chassis, so
      every position is estimated: the four side screws on the left side (x 40, 150, 260, 340) follow the
      ES1010 drawing, the right side mirrors them because no figure shows it, and the pads and outline
      each carry their own source. The underside is shown nowhere.
attrs:
  physical:
    weight-kg: '8'
    weight-note: 8 +/- 0.5 kg with two PSUs
  performance:
    switching-capacity: 172 Gbps
    port-modes-rj45: 100/1000BASE-T and 2500BASE-T on ports 1-16; 10/100/1000BASE-T on ports 17-48
    port-modes-sfp28: 1/10/25G
  power:
    power-max-w: '3200'
    power-max-no-poe-w: '550'
    input-ac: 100-240 VAC, 50-60 Hz
    psus: 1+1 hot-swap AC (550 W on the -48C, 1600 W on the -48CP), 0:1 / 1:1 modes
  thermal:
    fans: 2+1 fixed (not field-replaceable)
  environmental:
    operating-temp: 0 to 45 C at 900 m; derate 1 C per 175 m above 900 m
    storage-temp: -40 to 70 C
    humidity-operating: 5 to 85 percent non-condensing
    humidity-storage: 5 to 95 percent
    altitude: 3050 m maximum
  platform:
    asic: Broadcom TD3.X2
    cpu: Intel Denverton x86, 4C 2.1 GHz (8C 2.2 GHz option)
    memory: 16 GB DDR4 (32 GB option)
    storage: 64 GB M.2 SSD (up to 256 GB)
  features:
    encryption: 256b MACsec
    timing: optional IEEE 1588 and SyncE
    poe: IEEE 802.3bt Type 4 Class 8, 90 W per port, persistent PoE - on the -48CP builds only
  management:
    mgmt-ports: >-
      RJ45 console (115200 default, 8N1), out-of-band combo pair (RJ45 in the stack and SFP left of the
      uplinks, one interface), 2 x USB 3.0 Type A (data only)
chassis:
  width: 438.2
  height: 43.4
  depth: 371.6
  ru: 1
  weight-kg: 8
  color: '#c9ccd0'
  power: ac
gaps:
- what: psu-part-numbers
  scope: [psu-1, psu-2]
  reason: vendor-silent
  wanted: >-
    The vendor part numbers of the 550 W and 1600 W supplies. Neither the guide nor the datasheet names
    them; the ordering table lists chassis builds only.
- what: psu-550-lamp-count
  scope: [psu-1, psu-2]
  reason: sources-disagree
  wanted: >-
    Whether the 550 W supply has one lamp or two. The PSU LEDs table describes one lamp for the 550 W and a
    pair for the 1600 W; Rear Panel figure 1 draws two windows on each supply. A photograph of a 550 W
    supply closes it.
- what: port-lamp-meaning-1g-ports
  scope: [port-17, port-48]
  reason: vendor-silent
  wanted: >-
    The link-lamp colours for ports 17-48. The guide gives one reading for the ES1050 series (green at
    2.5GbE, amber at 10/1000M), which cannot hold for ports that top out at 1GbE; only the activity and
    PoE lamp is described for them here.
- what: rear-bosses
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    What the two round bosses left of fan labels 2 and 3 are. The guide documents no fan lamps; they are
    drawn as outlines only.
- what: side-top-bottom-geometry
  scope: [top, left, right]
  reason: needs-drawing
  wanted: >-
    A mechanical drawing or square-on photographs of the lid and sides. The pads, label outline and screws
    are placed by proportion from one three-quarter render, and the lid screws it shows are not drawn.
groups:
  rj45-2p5g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 2.5g}
  rj45-1g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
  sfp28-leds:
    term: LED
    role: indicator
    index-origin: 1
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster - two USB-A service ports, the out-of-band RJ45 and its combo SFP (one
      interface, either medium), and the RJ45 console. Four media, one job
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
  marks:
    term: Mark
    role: furniture
    index-origin: 1
    description: the printed USB tridents beside the two USB-A ports
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: '0:1 / 1:1 modes, 2 x 550 W (-48C) or 2 x 1600 W (-48CP)'
  grounding:
    term: Point
    role: furniture
    index-origin: 1
    description: >-
      the rear grounding point - two screws beside an earth symbol at the left edge - and the second
      earth symbol with its screw in the right-hand strip
  furniture:
    term: Item
    role: furniture
    index-origin: 1
    description: the lug tag, fan screws, the rear standoff and the side screws
