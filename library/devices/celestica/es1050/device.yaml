configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis as it ships: two supplies and three fixed fans in, the 48 RJ45 ports and four SFP28
      cages on the front. The orderable builds below differ in powering the ports, supply rating and airflow.
  48c-f2b:
    kind: orderable
    description: ES1050-48C, 1U, 32x1GbE + 16x2.5GbE, no PoE, COMe 4C/16GB-DDR/64GB-SSD, 2 x 550 W AC, F2B (R4048-F90L2-A1)
    airflow: front-to-back
    part-numbers:
      R4048-F90L2-A1: {part: R4048-F90L2-A1}
    bays: {psu-1: celestica/psu-crps-550-ac@1, psu-2: celestica/psu-crps-550-ac@1}
  48c-b2f:
    kind: orderable
    description: ES1050-48C, 1U, 32x1GbE + 16x2.5GbE, no PoE, COMe 4C/16GB-DDR/64GB-SSD, 2 x 550 W AC, B2F (R4048-F91L2-A1)
    airflow: back-to-front
    part-numbers:
      R4048-F91L2-A1: {part: R4048-F91L2-A1}
    bays: {psu-1: celestica/psu-crps-550-ac@1, psu-2: celestica/psu-crps-550-ac@1}
  48cp-f2b:
    kind: orderable
    description: ES1050-48CP, 1U, 32x1GbE + 16x2.5GbE, PoE++, COMe 4C/16GB-DDR/64GB-SSD, 2 x 1600 W AC, F2B (R4048-F90L3-A1)
