    bays: {psu-1: celestica/psu-crps-1600-ac@1, psu-2: celestica/psu-crps-1600-ac@1}
  48cp-b2f:
    kind: orderable
    description: ES1050-48CP, 1U, 32x1GbE + 16x2.5GbE, PoE++, COMe 4C/16GB-DDR/64GB-SSD, 2 x 1600 W AC, B2F (R4048-F91L3-A1)
    airflow: back-to-front
