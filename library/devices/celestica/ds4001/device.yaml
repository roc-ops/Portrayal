  f2b:
    kind: base
    default: true
    description: >-
      Front-to-back airflow, two 1500 W AC supplies and seven fans - R3240-F9102-A0 (4C D1627,
      1x16 GB DDR4, 64 GB SSD). The build the renders show.
    part-numbers:
      R3240-F9102-A0: {part: R3240-F9102-A0}
  b2f:
    kind: orderable
    airflow: back-to-front
    description: >-
      Back-to-front airflow - R3240-F9103-A0 (same control plane). QSFP-DD power drops to 24 x 5 W
      + 8 x 12 W (ports 25-32). No held document shows whether the fans or supply latches change
      colour for this build, so the art is the f2b art (see the b2f-finish gap).
    region-context:
      exhaust: Intake
    part-numbers:
      R3240-F9103-A0: {part: R3240-F9103-A0}
