format: 1
kind: device
name: ds4001
version: 0.2.1
maturity: modelled
manufacturer: Celestica
model: DS4001
portfolio:
  family: Data Center Switch
description: >-
  Celestica DS4001 1U 32-port 400GbE data center switch - 32 QSFP-DD in two
  belly-to-belly rows of sixteen (ports 1, 2, 31 and 32 printed '-HP', the 20 W
  high-power positions), a stacked pair of 10G SFP+ management ports (M1/M2) at
  the LEFT end, and at the right four status lamps and a vertical console RJ45 /
  USB-A / management RJ45 stack; at the rear two 1500 W supplies (1+1) either side
  of seven hot-swap fans (6+1). 12.8 Tbps, 70 MB buffer. The DS4000 shares its
  installation guide and rear but has a different faceplate.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      DS4001 datasheet (cls_datasheet_DS4001.pdf, 2 pp) for dimensions, interfaces, power, cooling,
      environment, approvals and ordering lines; the shared DS4000/DS4001 Installation Guide (docs
      portal pages staged in the intake, and the 49-page PDF rev 1.4.0, 2/2026) for the
      specifications table, the rear elevation (Product Overview Figure 4), the LED tables, the
      QSFP-DD LED locations and power classes, and What's in the Box; and the vendor's product
      renders for the FRONT - the Foleon page's ds4001_front.png (3840 x 1688, three-quarter view,
      pull tab printed 'DS4001'), the DS4001 datasheet's embedded render (992 x 603) and the
      Foleon ds4001-side-by-side (front and rear). No photograph of a real unit is held.
  model-split:
    note: >-
      The guide's three front elevations are the DS4000's faceplate (SFP+ at the right, beside the
      lamps; see celestica/ds4000). Every DS4001 image held - its datasheet render, the Foleon
      ds4001_front render and the Foleon side-by-side - shows a different faceplate: the SFP+
      pair at the LEFT end with a green lamp above and below it, legends 'M1 up-down M2',
      '1-HP up-down 2-HP' and '31-HP up-down 32-HP', a hexagon-perforated black face, and the
      lug tag printed 'DS4001'. So this front is modelled from the renders and carries no
      guide front figure at all.
  front-geometry:
    confidence: photo-measured
    note: >-
      THE FRONT IS FROM A PERSPECTIVE RENDER, MEASURED THROUGH A ONE-DIMENSIONAL HOMOGRAPHY. On
      ds4001_front.png the face recedes to the left, so no scale can be taken straight off it (a
      straight-line fit of the sixteen column centres leaves 16.2 px rms). Positions along the
      face were measured on FLAT features only - the white port-lamp dots, which sit on the face
      plane, not the cage bezels, which stand proud: each column's upper-left and upper-right dot
      pair was located by connected-component search in the black face and its midpoint taken as
      the column centre. A projective map x = (a i + b)/(c i + 1) over column index i fits those
      sixteen centres to 0.10 px rms. Mapping the face's two outer edges through it gives a face
      19.147 pitches wide, so the pitch is 438.5 / 19.147 = 22.902 mm - against 22.894 measured
      square-on on the DS4000's orthographic guide elevation, 0.03 percent apart. That agreement
      is the check: a wrong geometry does not reproduce the sibling's pitch from the face width.
      With the DS4000 pitch: column 1 centre 39.19 mm from the left edge (the DS4000's is 24.33,
      so the whole QSFP-DD block sits 14.86 mm further right, making room for the SFP+ pair);
      SFP+ lamp 16.93, so SFP+ centre 20.06 using the DS4000's lamp-to-cage offset (3.13 mm; the
      protruding cage's own blob centroid gives 20.1-21.1, biased right by its visible side
      wall); status lamps 400.4; management plate 403.6-420.65; lug tag centred 427.3. Image
      x was corrected for the face's vertical lean (0.0625 px per px, from the left edge at two
      heights) before mapping features measured off the dot line. Vertical positions are NOT
      measured on the render; they are carried from the DS4000's orthographic elevation (same
      cages on the same pitch), which is recorded as borrowed.
  front-vertical:
    confidence: borrowed
    note: >-
      borrowed from celestica/ds4000's qsfp-layout, port-leds, sfp-and-status and mgmt
      provenance (guide front elevation, y as a fraction of 43.1 mm): QSFP-DD openings at y 9.36
      (top row) and 22.97 (bottom), lamp windows at 4.54/7.26 and 35.16/37.85, SFP+ cages at 9.45
      and 22.9, SFP+ lamps at 6.73 and 35.8, status lamps from 11.9 on 5.0 mm, management plate
      6.73-38.63. The render agrees with this ordering and with the lamps being above and below
      the SFP+ pair, but is not measured for it.
  port-leds:
    confidence: photo-measured
    note: >-
      The render shows the same arrangement the guide's QSFP-DD Port LED Locations page draws -
      two lamps stacked at the upper left and two at the upper right of each top-row cage, the
      same below each bottom-row cage - and the dot-pair spacing is 0.70 of the column pitch
      on the render (e.g. 80.0 of 115.5 px at column 4) against 0.70 on the DS4000 elevation
      (55.65 of 79.67 px), so the DS4000's +/-8.0 mm is used. Four tri-colour lamps per port per
      the guide; lower-port lamp numbering follows the upper port's reading order (inference, as
      on the DS4000). THE -HP COLUMNS DIFFER, AND THIS IS A READING, NOT A GUESS: at 5x on the
      native render, columns 1 and 16 (ports 1, 2, 31, 32) show ONE white window at each side
      above the top cage and one at each side below the bottom cage, where every other column
      shows a stacked pair; on the rectified render they sit at column centre -11.3 and +11.3 mm,
      y 5.8 and 36.4, outside the cage bezel. The -HP cages are also drawn flush where the others
      stand proud with spring fingers - a different cage. So those four ports carry two lamp
      windows each here (ids -1 left, -2 right), against the guide's general 'four tri-color
      LEDs' per port, which its own close-up shows on the DS4000's port 31; see the
      hp-port-lamps gap.
  legends:
    confidence: photo-measured
    note: >-
      read off ds4001_front at 3x: '1-HP up-down 2-HP', '3 up-down 4' ... '29 up-down 30',
      '31-HP up-down 32-HP' between the rows, solid triangles; 'M1 up-down M2' between the SFP+
      cages; 'STAT', 'FAN', 'PWR', 'ALM' set diagonally left of the four lamps; 'IOIOI', a USB
      trident and a network symbol to the right of the jacks; 'Celestica' set in plain type
      above the jacks (a wordmark in text, not a logo); 'DS4001' along the lug tag. The -HP
      ports are the guide's high-power positions (QSFP-DD Port Power Outputs: F2B 20 W on ports
      1, 2, 31 and 32).
  mgmt:
    confidence: photo-measured
    note: >-
      render - a silver plate holding, top to bottom, an RJ45 with its keyway UP (console, IOIOI),
      a USB-A, and an RJ45 with its keyway DOWN and two lamp windows in its lower corners
      (management, network symbol) - the DS4000's arrangement. Jack cells std/rj45-ganged@2 as
      on the DS4000. The USB is USB 2.0 (datasheet), so std/usb-a@1 is seated with its usb2
      skin.
  vents:
    confidence: estimated
    note: >-
      The render's face is perforated with hexagonal cells - a column at each end, and a cluster
      between each column's lamp pairs above and below the cages. Drawn with the library's
      hexagon vent pattern over a backing plate (left x 0.8-9.4, right 430.4-437.6, and an
      11.6 x 5.4 patch per column above and below) - the right area and cell shape, the cell
      count and exact outline estimated.
  colour:
    confidence: photo-measured
    note: >-
      render - black face, white legends, silver cage bezels and jack plate; light grey sheet
      metal. So chassis.color is the sheet metal (#c4c8cc, which the top, bottom, sides and the
      rear frame between the modules wear - the rear webs are grey in the guide CAD and silver in the
      DS4001 rear render), and the black front bezel is a full-face decor rect under everything
      else on the front, since a view carries no colour of its own.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - height 43.1 mm (1.73 in, 1 EIA unit), width 438.5 mm (17.3 in), depth 657.5 mm
      (25.8 in); the guide's specifications table agrees. No weight stated in any held document.
  rear:
    confidence: measured
    note: >-
      the shared guide's Figure 4 rear elevation, measured exactly as recorded on celestica/ds4000
      (3.8404 px/mm across, 3.898 down): ground strip with an earth symbol and two screws at the
      left, PSU2, seven fans on 43.96 mm with FAN7 leftmost, PSU1 at the right. The DS4001 rear
      render (Foleon ds4001-side-by-side) agrees in every count and arrangement and supplies the
      colours: black fans with blue latches, silver supplies with black U-handles and orange
      latches. Positions are the guide figure's, not the render's.
  views:
    confidence: estimated
    note: >-
      TOP (y = 0 at the rear), BOTTOM, LEFT (x = 0 rear) and RIGHT (x = 0 front) as on
      celestica/ds4000 - the DS4001 renders show the same lid (two perforated fields at the side
      edges, perforated strips along the front third of each side edge, a recessed lid-release
      plate on the centreline in the rear third), positions estimated from the renders; side rail
      fasteners at estimated positions.
  power:
    confidence: datasheet
    note: >-
      datasheet - '1+1 redundant, hot swap PSUs, 1500W each'; 'AC 47~63Hz, 100 ~ 240 V nominal,
      90~264V max'. Unlike the DS4000's, the DS4001 datasheet states no system consumption
      figure, so no power-max-w is carried. The guide's What's in the Box (docs-portal HTML) lists
      a DC build, R3240-F9104-A1 'DC PSU 2x1500W', which the PDF revision 1.4.0 no longer lists;
      no DC supply is drawn anywhere held, so it is a gap, not a configuration.
  port-power:
    confidence: datasheet
    note: >-
      guide, QSFP-DD Port Power Outputs (shared) - F2B 28 x 15 W + 4 x 20 W (ports 1, 2, 31, 32);
      B2F 24 x 5 W + 8 x 12 W (ports 25-32). DS4001 datasheet: 'Up to 12W in Back to Front
      airflow', 'Up to 20W in Front to Back airflow'.
  environment:
    confidence: datasheet
    note: >-
      datasheet 'Temperature: 0 C to 45 C @ 900m, Humidity: 5% to 90%, non-condensing'; the shared
      guide's table says 5 - 40 C for either airflow and 40 - 60 % operating humidity, 5 - 95 %
      storage. Both carried, as on the DS4000.
  part-numbers:
    confidence: datasheet
    note: >-
      R3240-F9102-A0 (front-to-back) and R3240-F9103-A0 (back-to-front), both 4C D1627, 1 x 16 GB DDR4,
      64 GB SSD - the datasheet's ordering lines and the guide's What's in the Box Table 2 agree. One per
      configuration, so the DCIM exporter makes a device type for each. The DC build R3240-F9104-A1 has
      no configuration; see the dc-build gap.
  lifecycle:
    note: >-
      searched 2026-09-26 for a DS4000/DS4001 end-of-life or end-of-sale announcement; none found.
attrs:
  performance:
    switching-capacity: 12.8 Tbps
    packet-buffer: 70 MB
    latency: low-latency cut-through mode supported
  power:
    input-ac: 100-240 V nominal (90-264 V max), 47-63 Hz
    psu-redundancy: 1+1 hot-swappable, 1500 W each
  thermal:
    fan-redundancy: 6+1 hot-swappable
    port-power-f2b: 28 x 15 W + 4 x 20 W (ports 1, 2, 31, 32)
    port-power-b2f: 24 x 5 W + 8 x 12 W (ports 25-32)
  environmental:
    operating-temp: 0 to 45 C at 900 m
    operating-humidity: 5 to 90% non-condensing
    operating-temp-guide: 5 to 40 C, either airflow
    operating-humidity-guide: 40 to 60% RH
    storage-humidity: 5 to 95% RH
  platform:
    cpu: Intel Xeon D, 4-core D-1627 on a COMe module (both SKUs); up to 8 cores per datasheet
    memory: 16 GB DDR4 ECC (both SKUs; up to 32 GB per datasheet)
    storage: 64 GB M.2 SSD (both SKUs)
    bmc: BMC with 1 GB DDR4, dual 32 MB flash, NC-SI shared port, SOL, IPMI 2.0
  features:
    breakout: >-
      168 x 50GbE, 128 x 100GbE or 64 x 200GbE using breakout cables
    optics-qsfp-dd: >-
      10GBASE-CR/SR/LR/ER, 25GBASE-CR/SR/LR/ER, 40GBASE-CR4/SR4/LR4/ER4, 100GBASE-CR4/SR4/LR4/ER4/DR1/PSM4/CWDM4,
      400GBASE-CR4/SR4/FR4/DR4/LR8 (shared guide Port Descriptions); DAC up to 3 m (datasheet)
    optics-sfp-plus: 10GbE (shared guide Port Descriptions)
    tunnelling: IPinIP, IPinGRE, VXLAN
  management:
    console: RJ45 RS-232, 115200 8N1, flow control XON/XOFF (labelled IOIOI)
    oob: RJ45 10/100/1000, CPU/BMC shared
    usb: USB 2.0 type A, data only (does not supply power)
  compliance:
    emc: CN (GB/T9254-2008 Class A), EU (EN550032, EN55035, EN300386), FCC, VCCI, CCC
    safety: UL/CSA/IEC/EN60950-1/62368-1, UL, CB, CCC (GB4943.1-2011)
    environment: RoHS
  lifecycle:
    eol: none-announced
chassis:
  width: 438.5
  height: 43.1
  depth: 657.5
  ru: 1
  color: '#c4c8cc'
  airflow: front-to-back
  power: ac
gaps:
- what: dc-build
  scope: [psus]
  reason: needs-photo
  note: >-
    The docs-portal What's in the Box lists R3240-F9104-A1, '1U,32X400GBE,DC PSU 2x1500W,COMe
    4C/16G DDR4/64G SSD,F2B', and the Ground Lug Installation page exists because a DC build does
    ('The GLA is not applicable to the AC SKU versions'). The PDF revision 1.4.0 of the same
    guide lists only the two AC SKUs, and no held image shows the DC supply's face, so no DC
    supply component or configuration is drawn.
  wanted: a rear image of the DC build and its supply's input connector
- what: front-vertical-measure
  scope: [qsfpdd-400g, sfp-plus-mgmt, mgmt, status-leds]
  reason: needs-photo
  note: >-
    Every vertical position on this front is carried from the DS4000's orthographic guide
    elevation; the DS4001 is known only from three-quarter renders, which give x through a
    homography but were not used for y. A square-on DS4001 front photograph or elevation would
    settle it.
  wanted: a square-on front image of a DS4001
- what: hp-port-lamps
  scope: [port-leds]
  reason: sources-disagree
  note: >-
    The shared guide says each QSFP-DD port has four tri-colour LEDs; the DS4001 render shows two
    windows per port on the four -HP ports (1, 2, 31, 32) and four on the rest. Modelled as the
    render shows; which of LED1-LED4 the two windows carry is not stated.
  wanted: a DS4001 LED table or a front photograph of a lit unit
- what: b2f-finish
  scope: [fans, psus, b2f]
  reason: needs-photo
  note: >-
    The one rear render held (black fans, blue latches, orange PSU latches) does not state its
    airflow. The DS4100 rear, from the same vendor, is orange-faced, which may be an airflow
    colour code; no held DS4000/DS4001 document says so.
  wanted: a rear photograph of each airflow build
- what: system-led-signs
  scope: [status-leds]
  reason: sources-disagree
  note: >-
    The artwork prints STAT, FAN, PWR, ALM top to bottom; the shared guide's Front Panel Status
    LEDs table signs the four SYS, ALM, PSU, FAN. The silkscreen follows the artwork and each
    lamp takes the table row for its function.
  wanted: a front photograph of a DS4001
- what: psu-and-fan-part-numbers
  scope: [psus, fans]
  reason: vendor-silent
  note: >-
    No held document names the FRU part numbers of the 1500 W supply or the fan module; the
    components are named for their form (celestica/psu-1500-ac, celestica/fan-40).
  wanted: a Celestica FRU list
- what: asic
  scope: [qsfpdd-400g]
  reason: vendor-silent
  note: >-
    Neither the DS4001 datasheet nor the shared guide names the switching silicon.
  wanted: a Celestica document naming the ASIC
groups:
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
  sfp-plus-mgmt:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: the M1/M2 SFP+ pair at the left end of the face - 10GbE per the shared guide's port table
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management stack - RS-232 console RJ45, USB 2.0 port and the CPU/BMC shared Ethernet
      management RJ45, on one silver plate
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the four chassis lamps - STAT, FAN, PWR, ALM
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      four tri-colour lamps per QSFP-DD port (LED1-LED4) and one per SFP+. Shared guide LED table:
      8x10G amber (or white), 8x25G green (or white), 2x40G amber on LED1 and LED3, 4x40G amber,
      4x50G green, 8x50G blue (or white), 2x100G green on LED1 and LED3, 4x100G blue, 2x200G blue
      on LED1 and LED3, 1x400G blue on LED1.
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - DS4001 datasheet, Power and Cooling: ''1+1 redundant, hot swap PSUs, 1500W each''; two bays at the rear ends'
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '6+1'
      redundancy-note: '6+1 - DS4001 datasheet, Power and Cooling: ''6+1 Redundant/Hot-Swappable fans, front to back and back to front airflow''; seven bays'
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
