format: 1
kind: device
name: ds3000
version: '0.1.0'
maturity: modelled
manufacturer: Celestica
model: DS3000
description: >-
  Celestica DS3000 - 1RU 32 x 100G QSFP28 data-center leaf/spine switch with one SFP+, an RJ-45
  console, USB-A and RJ-45 management stack at the right, and two CRPS AC supplies and four hot-swap
  fans on the rear; front-to-back and back-to-front builds.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      TWO ORTHOGRAPHIC CAD RENDERS FROM THE VENDOR'S DOCUMENTATION PORTAL, AND TWO THREE-QUARTER
      MARKETING RENDERS FOR WHAT THEY PRINT. The DS3000 installation guide on
      documentationportal.celestica.com (Product Overview page) carries a front and a rear
      elevation. The rear was staged as ds3000--product-overview-1.jpg (2194 x 251). The FRONT was
      an inline SVG wrapper whose Heretto JWT had expired by modelling time, so it was re-fetched
      from the live page on 2026-09-26 as ds3000--product-overview-front.png (2053 x 233). Both are
      CAD renders with no legends. The vendor product page
      (cls.celestica.com/hardware-platforms/ds3000/) serves two three-quarter renders, staged as
      photos/ds3000-A.png (3840 x 1627) and ds3000-AA.png (front and rear side by side); they cannot
      be measured but they carry the printed legends, which is what they are used for. No square-on
      photograph exists on either site. The datasheet (ds3000-datasheet.pdf) carries the spec table
      and ordering codes. THE GUIDE'S FAN AND PSU PAGES ARE COPIED FROM A STORAGE ENCLOSURE - they
      speak of drives, canisters, DC-DC modules and 'five (5) fan modules ... for drive cooling',
      and their four figures show a different product - so only the Product Overview page's facts
      are taken from the guide.
  gate-1:
    confidence: measured
    note: >-
      FRONT: the body reads 1831 x 181 px between the side-wall edges (x 108-1939) and the top and
      bottom lips (y 22.5-203.5), aspect 10.12 against the datasheet's 438 x 44 = 9.955, 1.6% out.
      That is at the edge of usable, so the two axes are calibrated separately: 4.180 px/mm across
      from the stated width and 4.114 down from the stated height. THE ACROSS SCALE IS THEN PROVED
      BY A SECOND QUANTITY IT DID NOT USE: the dark QSFP openings read 77-78 px wide, 18.5 mm at
      4.180 - std/qsfp-ganged@1's registry opening exactly - and the in-gang port pitch fits at
      19.003 mm, the 19.0 of a ganged QSFP cage. REAR: the body reads 1954 x 196 px (x 115.5-2069.5,
      y 28.5-224.5), aspect 9.969 against 9.955, 0.15% - orthographic - so one scale, 4.461 px/mm,
      serves both axes. The ears are not drawn: they stand outside those edges on both faces.
  face-colour:
    confidence: photo-measured
    note: >-
      THE TWO VENDOR IMAGES DISAGREE ON THE FACE COLOUR AND THE BLACK ONE IS DRAWN. The docs-portal
      CAD render draws a plain grey face with no legends; the vendor's product-page renders draw the
      production face - black, legends in white, the Celestica wordmark above the management stack
      and DS3000 on the pull tab - over exactly the same layout: one SFP+ at the far left, eight
      blocks of four QSFP28, four lamps and a stacked RJ45 / USB / RJ45 at the right. Geometry is
      taken from the orthographic grey render, colour and printing from the black one. The grey
      render reads as an unbranded engineering render of the same chassis rather than a second
      build; see the face-colour gap. The housing colour is the grey sheet metal every other face
      shows (rear render, and the lid and side walls of the three-quarter renders); the black front
      is a full-face decor plate painted first, because a chassis carries one housing colour.
  port-block:
    confidence: measured
    note: >-
      EIGHT BLOCKS OF TWO GANGED CAGES OVER TWO, FIT ON ALL SIXTEEN COLUMNS. The dark openings'
      centres read 307.5, 387.5, 487.5, 567, 667.5, 746.5, 846.5, 926.5, 1026.5, 1105.5, 1206,
      1285.5, 1385.5, 1465, 1565.5, 1644.5 px on both rows. A least-squares fit x = first + block*k
      + pitch*j gives first column 47.82 mm, in-gang pitch 19.003 mm and block pitch 42.968 mm,
      worst residual 0.09 mm. Rows: the upper openings centre at y 13.98 and the lower at 27.83,
      read as the middle of the dark interior (y 62-98 and 119-155 px); the drawn interiors are
      about 9.0 mm tall against the registry's 9.58, so the registry height is drawn about the
      measured centre. Each ganged pair sits in a thin bright cage flange about 38.7 x 10.1 mm (x
      267-429 px), drawn as a panel decor shell under the two apertures because std/qsfp-ganged@1
      draws only the opening and a dark opening on a black face is otherwise invisible.
  port-numbering:
    confidence: photo-measured
    note: >-
      Odd over even down each column, 1 to 32 left to right: the product-page three-quarter render
      prints '1 (up) (down) 2' in the band between the rows under the first column, '3 (up) (down)
      4' under the second, and so on; the guide says only '32 QSFP28 ports'. The legend's x is the
      column centre and its y the middle of the band between the two rows, because the render it is
      read from is not orthographic; its size (1.6 mm type) is scaled from the same render against
      the 9.58 mm opening beside it.
  stack-orientation:
    confidence: drawing
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): upper cage upright
      (rotate 0) over the lower turned 180. Here it is also what the render draws: the upper row's
      connector card slot is at the BOTTOM of each opening and the lower row's at the TOP, a
      mirrored pair about the band between them, on all sixteen columns.
  port-lamps:
    confidence: measured
    note: >-
      FOUR LAMPS PER QSFP28 PORT, above the upper row and below the lower. The render draws each as
      a ring about 10 px (2.4 mm) across; the upper row centres at y 6.08 and the lower at 35.73,
      and port 1's four read at x 283, 299.5, 316.3 and 333 px - a 3.98 mm pitch centred 0.1 mm off
      the port's own centre - so every port's lamps are drawn at -6, -2, +2 and +6 mm from its
      centre. The guide's Table 4 says what they mean: first lamp green for 100 GbE, all four green
      for 4x25G and all four amber for 4x10G, blinking with activity - one lamp per lane. Lane 1 is
      taken as the LEFT lamp; the guide's 'first' does not say which end. common/led-dot@1 (2.0 mm,
      1.4 mm window) is the part; the drawn ring is 0.4 mm larger, a compromise recorded rather than
      a new part cut.
  sfp-plus:
    confidence: measured
    note: >-
      ONE SFP+ CAGE AT THE FAR LEFT, with one lamp above it and to its left. Opening centre x 24.76,
      y 13.86 (dark 183-240 px across, 63-96 down); the bright flange around it reads x 180-245 px
      and y 60-103, 15.6 x 10.5 mm, drawn as a shell decor under std/sfp@1. The lamp is at x 21.89,
      y 6.08 - 2.9 mm left of the cage centre, not over it. THE PANEL LETTERS IT 'M1' - the product
      render prints 'M1 (up)' beneath it. The guide's Table 4 gives it 10 GbE green and 1 GbE amber,
      and its port table calls it simply 'SFP+'. The datasheet says '1-2 SFP+ 10G'; both images show
      exactly one cage, so one is drawn and the second is a gap.
  management:
    confidence: measured
    note: >-
      ONE STACKED MOULDING: RJ-45 OVER USB-A OVER RJ-45, in a bright shell x 1772-1843 px, y 48-183
      (17.0 x 32.7 mm). Column 1806 px crosses the top jack's dark interior at y 53-96, the USB
      tongue at 105-117 and the lower jack at 134-178; each std housing is centred on those. THE TOP
      JACK IS THE CONSOLE AND THE BOTTOM ONE THE MANAGEMENT ETHERNET: the product render prints
      IOIOI beside the upper jack, the USB trident beside the middle and the network mark beside the
      lower, and only the lower jack has link lamps (two green windows along its bottom edge, in
      both renders). The console's latch keyway is at the TOP - std/rj45@2 turned 180, since the std
      housing draws its keyway at the bottom when unturned - and the management jack's at the bottom
      with its two lamps on that side, which is common/rj45-eth@1 unturned. Both were checked
      against the render at 8x after placing. The guide: console RJ-45 asynchronous, 8-N-1, 115200
      baud; the Ethernet port 10/100/1000 auto-negotiating; the datasheet adds that it is CPU/BMC
      shared (NC-SI) and the USB is Type A. No stacked RJ-45/USB part exists in this library, so the
      shell is decor under three standard parts.
  status-lamps:
    confidence: measured
    note: >-
      FOUR LAMPS IN A COLUMN LEFT OF THE STACK, x 393.03, at y 11.55, 16.65, 21.88 and 27.10 (the
      green centres at 1751 px across, 70 / 91 / 112.5 / 134 down). The product render prints STAT,
      FAN, PWR and ALM against them top to bottom, set on end and reading upward to the left of each
      lamp, which is how they are drawn. THE GUIDE'S TABLE 2 NAMES A DIFFERENT SET - PSU 'P1/P2',
      ALM and STAT, with no FAN - which is also four lamps. The printed legends are drawn and the
      conflict is a gap.
  vents:
    confidence: measured
    note: >-
      TWO ROWS OF SLOTS ALONG THE TOP AND BOTTOM EDGES, read off the render as dark runs rather than
      drawn as a pattern. Top: 68 slots about 4.0 x 1.7 mm on a 5.0 mm pitch, whose dark cores sit
      at y 24-31 px; bottom: 80 slots about 2.9 x 1.9 mm on a 4.0 mm pitch at y 187-195. Each is one
      decor rect at its measured x, so the irregular gaps the render draws (over the SFP+ and
      between some blocks) are kept rather than smoothed. The product render draws the same rows as
      bracket-shaped louvres; the outline is not reproduced. The 8 mm cavity depth is not measured -
      it only makes the slots read as holes in 3D.
  wordmark-and-tag:
    confidence: photo-measured
    note: >-
      'Celestica' is printed as a plain-text wordmark above the management stack and 'DS3000' on the
      pull tab (product render). The wordmark is set in sans-serif text, never traced (no logo mark
      is drawn). The pull tab is celestica/lug-tag@1 turned on end (rotate 270, so its text reads
      upward, as rendered, which puts the part's grip end at the top), in a slot at x 429.39, y
      17.14-40.48 on the grey render.
  rear:
    confidence: measured
    note: >-
      PSU, TWO FANS, A BLANK, TWO FANS, PSU - symmetric in kind but not in position. At 4.461 px/mm:
      the left supply's face spans x 17.4-90.2 and y 1.5-41.8, the 73.5 x 40 CRPS face; its lamp
      reads at x 490.5 px and the right supply's at 1988.5, 335.8 mm apart, which places the right
      bay. The four orange fan faces segment cleanly on colour (R-B): x 591-766, 803-977, 1227-1401
      and 1438-1613 px, y 41-214, which is 39.2-39.4 x 38.8 mm faces at 106.59, 154.11, 249.15 and
      296.45: two pairs on a 47.4 mm pitch, the block centred at 221.15 against the face's 219.0.
      Between the pairs a plain plate (201.2-240.9, y 2.2-42.2) with tabs top and bottom and no
      handle, screw or latch; drawn as panel decor, see the rear-blank gap. The datasheet: '3+1
      redundant fans, front to back and back to front system cooling', '1+1 redundant, hot swap
      PSUs'.
  fan-finish:
    confidence: photo-measured
    note: >-
      ORANGE, SAMPLED OFF THE ORTHOGRAPHIC REAR. On each of the four fans the face surround reads a
      median #9e440e-#a1460f (bottom strip, rows 205-212 px) and #8f3d0b-#953f0c in the shaded top
      corner, and the handle band across the middle #cc550f-#ce5510 (rows 118-138) along its whole
      length, the right-hand segments included. No latch of any other colour is drawn at the band's
      left end (it reads #a3430c-#a9470d, the face in shadow). celestica/fan-40@1's fields are set
      from those readings: face-finish #9f450f, handle-finish #ce5510, and latch-finish #ce5510 so
      no blue shows. The product page's rear render shows black fans with blue handles instead; see
      the airflow-finish gap.
  rear-numbering:
    confidence: estimated
    note: >-
      Neither rear render prints a bay number that can be read, and the guide's P1/P2 and FAN1-FAN4
      (Tables 2 and 3) name the lamps without placing them. Supplies and fans are numbered 1 upward
      from the LEFT of the rear face as seen from behind, which is what the DS3001's own rear prints
      for its supplies. A reading of the real rear overturns it.
  grounding:
    confidence: measured
    note: >-
      A SCREW OVER AN EARTH SYMBOL in the strip left of the left supply: a large pan-head screw at
      (11.5, 12.3) about 6.7 mm across, an earth-in-circle printed below it at (11.8, 19.4) and a
      round hole at (11.8, 35.8). The screw is common/screw-head@1 (3.6 mm) - the only fastener part
      - and the symbol common/ground-symbol@1. The guide's Ground Lug Installation page describes a
      two-stud lug assembly for DC builds only ('not applicable to the AC SKU versions'); both
      orderable SKUs are AC, so the lug is not drawn.
  power:
    confidence: datasheet
    note: >-
      Datasheet: 'Under 500W peak consumption with maximum optics, 1+1 redundant, hot swap PSUs',
      '100-240VAC auto-ranging, 47-63Hz or 180-300VDC auto input'. The guide's spec table gives
      'Power Consumption (W) 500W' and 'Power Input (VAC) 90~264VAC(50~60Hz)', and its rear-panel
      line says 'dual 500W power supplies'. The supply seated is celestica/psu-r3059-f8001@1, the
      CRPS face the DS1000 and DS2000 share, whose contract states 550 W from the DS1000 datasheet -
      see the psu-rating gap.
attrs:
  performance:
    switching-capacity: 3.2 Tbps
    packet-buffer: 32 MB
    latency: under 500 ns port to port (cut-through)
    forwarding-tables: 'up to 48K MPLS labels, 324K LPM, up to 128K ACL'
  power:
    power-max-w: 500
    power-envelope: fully-configured
    input-ac: '100-240 VAC auto-ranging, 47-63 Hz (datasheet); 90-264 VAC, 50-60 Hz, 3.4-7.1 A (guide)'
    input-hvdc: 180-300 VDC auto input (datasheet)
  thermal: {fans: '3+1 redundant hot-swap fans, front-to-back or back-to-front'}
  environmental:
    operating-temp: 0 to 45 C at 900 m
    storage-temp: '-40 to 70 C'
    humidity: 'operating 5% to 90% non-condensing; storage 5% to 95%'
    mtbf: 'in excess of 150,000 hours'
  platform:
    cpu: Intel Atom C x86 (up to 8 core) on a COM-Express module
    memory: 8-32 GB ECC DDR4
    storage: configurable M.2 SSD
    bmc: 'BMC with IPMI 2.0, NC-SI shared management port, Serial over LAN'
    nos-installer: ONIE
  features:
    breakout: >-
      each QSFP28 port breaks out to 4x25G or 4x10G; system maximums 128 x 10/25GbE or 64 x 50GbE
      (datasheet)
    transceiver-power: QSFP28 up to 4.5 W / 5.5 W (partial) power; DAC to 5 m passive
    timing: IEEE 1588 and SyncE timing option (datasheet)
    optics-qsfp28: >-
      guide Table 1: 100GBASE-SR4 over OM3/OM4 parallel multimode, 100GBASE-LR4 (10 km) over
      single-mode, 100GBASE-CR4 copper DAC at 1 m 30AWG, 3 m 28AWG and 5 m 26AWG; 4x25G breakout by
      cable without a reboot
    optics-sfp-plus: >-
      guide Table 1 (as printed): 10GBASE-SR over OM3/OM4, 10GBASE-LR (10 km) single-mode, 10G
      copper DAC at 1, 3, 5 and 7 m; the table writes the SFP+ modules as SR4/LR4/CR4, which is the
      QSFP row's wording copied
  management: {console: 'RJ-45, asynchronous, 8-N-1, 115200 baud (guide)'}
  compliance:
    emc: 'CN (GB9254-2008), EU (EN55022, EN55024), FCC, VCCI'
    safety: 'IEC60950-1, GB4943, UL/CSA, CB'
  lifecycle: {eol: none-announced}
chassis: {width: 438.0, height: 44.0, depth: 520.0, ru: 1, weight-kg: 10.0, color: '#b4b8bc', power: ac}
gaps:
- what: psu-rating
  scope: [rear]
  reason: sources-disagree
  wanted: >-
    Whether the DS3000's supply is the 550 W unit its face matches or a 500 W part. The DS3000 guide
    says 'dual 500W power supplies' and 'two 500W redundant power supply units'; the seated
    celestica/psu-r3059-f8001@1 is 550 W per the DS1000 datasheet's FRU line. The faces agree to
    about 0.5 mm feature by feature (DS3000 rear render against the DS2000's), which is why that
    part is seated, but the DS3000 documents never name a supply part number. The guide's '500W' may
    be the chassis draw ('Under 500W peak consumption') restated.
- what: status-lamp-names
  scope: [front]
  reason: sources-disagree
  wanted: >-
    Which four indicators the front column is. The product render prints STAT, FAN, PWR, ALM; the
    guide's Table 2 lists PSU P1/P2, ALM and STAT. The printed set is drawn; a close photograph of a
    shipping unit settles it.
- what: second-sfp-plus
  scope: [front]
  reason: sources-disagree
  wanted: >-
    The datasheet's feature list says '1-2 SFP+ 10G'; the guide says '1 SFP+ port' and both renders
    draw one cage, lettered M1. Whether any build carries a second SFP+ is not stated.
- what: face-colour
  scope: [front]
  reason: sources-disagree
  wanted: >-
    The docs-portal CAD render draws a grey, unlettered face and the product page's renders a black
    lettered one over the same layout. Black is drawn. A photograph of a shipping unit confirms it.
- what: rear-blank
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    What the plate between the two fan pairs is - a fixed part of the chassis or a filler over an
    unused fifth fan position. It has no handle, latch or screw in the render and the datasheet
    counts four fans (3+1), so it is drawn as panel decor.
- what: airflow-finish
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    How the F2B and B2F builds differ on the outside. The docs-portal rear render draws orange fans;
    the product page's three-quarter rear render draws black fans with blue handles. Neither says
    which airflow it is. Both configurations are drawn orange, from the orthographic figure (see the
    fan-finish provenance); a documented B2F or F2B finish would change one of them.
- what: side-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, underside and side walls. Only three-quarter renders show them; see each
    face's empty sentence.
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the thirty-two QSFP28 ports, eight blocks of two ganged cages over two, odd over even down
      each column from 1 at the top left to 32 at the bottom right.
    attrs: {media: qsfp28, speed: 100g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the single SFP+ cage at the far left, lettered M1 on the panel.
    attrs: {media: sfp-plus, speed: 10g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  status-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band stack at the right-hand end - an RJ-45 serial console over a USB-A over a
      1000BASE-T RJ-45 management port, in one moulding.
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs: {redundancy: 1+1, redundancy-note: 'datasheet: 1+1 redundant, hot swap PSUs'}
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs: {redundancy: 3+1, redundancy-note: 'datasheet: 3+1 redundant fans'}
  grounding: {term: Point, role: furniture, index-origin: 1}
  furniture:
    term: Item
    role: furniture
    index-origin: 1
    description: the pull-out lug tag and the printed port-type marks
