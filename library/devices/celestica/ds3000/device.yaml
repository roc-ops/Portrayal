configurations:
  b2f:
    kind: base
    default: true
    airflow: back-to-front
    description: >-
      R4039-F9002-A0: DS3000, 1U, 32x 100GbE, COMe 4C/16GB-DDR/64GB-SSD, back-to-front airflow
      (datasheet ordering information; the guide's What's in the Box repeats it). Listed first by
      both documents, so it is the default. Fan and supply finish for this airflow are not
      documented - see the airflow-finish gap.
    component-attrs:
      fan-40: {face-finish: '#9f450f', handle-finish: '#ce5510', latch-finish: '#ce5510'}
    part-numbers: {R4039-F9002-A0: {part: R4039-F9002-A0}}
  f2b:
    kind: orderable
    airflow: front-to-back
    description: >-
      R4039-F9005-A0: DS3000, 1U, 32x 100GbE, COMe 4C/16GB-DDR/64GB-SSD, front-to-back airflow.
    component-attrs:
      fan-40: {face-finish: '#9f450f', handle-finish: '#ce5510', latch-finish: '#ce5510'}
    part-numbers: {R4039-F9005-A0: {part: R4039-F9005-A0}}
