configurations:
  ac-f2b:
    kind: orderable
    power: ac
    default: true
    description: >-
      Four 3200 W AC supplies, front-to-back airflow, COMe 8C / 64 GB DDR4 / 256 GB SSD. The
      build both rear renders show: red fan bars, fan latches, supply bails and supply latches.
    part-numbers:
      R4087-F9004-A1: {part: R4087-F9004-A1}
  ac-b2f:
    kind: orderable
    power: ac
    airflow: back-to-front
    region-context: {exhaust: Intake}
    description: >-
      Four 3200 W AC supplies, back-to-front airflow. NO RENDER OF THIS BUILD EXISTS, so it is
      drawn with the front-to-back build's modules unchanged: the handle colour that usually
      marks the reverse-airflow FRUs is unseen and is not assumed (see the b2f-rear gap).
    part-numbers:
      R4087-F9013-A1: {part: R4087-F9013-A1}
  dc-f2b:
    kind: orderable
    power: dc
    description: >-
      Four 3200 W DC supplies (40-72 VDC), front-to-back airflow. NO RENDER OF THE DC SUPPLY
      EXISTS and no component draws it, so the four supply bays are left empty in this build
      rather than showing an AC inlet on a DC order (see the dc-psu-face gap).
    bays: {psu-1: '', psu-2: '', psu-3: '', psu-4: ''}
    part-numbers:
      R4087-F9005-A1: {part: R4087-F9005-A1}
