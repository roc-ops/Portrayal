format: 1
kind: device
name: ds6000
version: 0.1.0
maturity: modelled
manufacturer: Celestica
model: DS6000
portfolio: {line: Data Center Networking, family: '1.6TbE Data Center Switch', series: DS6000}
description: >-
  Celestica DS6000 - 3U, 64-port 1.6TbE OSFP224 data centre switch on a Broadcom Tomahawk 6
  (102.4 Tbps) with an Intel Xeon-D COM Express CPU and a RunBMC/OpenBMC service processor.
  The front is a black perforated bezel carrying sixteen columns of OSFP224 cages, each
  column two belly-to-belly stacked pairs numbered top to bottom, with a management and
  timing cluster across the top right: two RJ45 consoles (CON0, CON1), two 50GbE SFP56
  management ports, an RJ45 GbE MGMT port, an RJ45 ToD port, 1PPS and 10 MHz SMA jacks, a
  USB 3.0 Type-A, a USB-C console, a reset pinhole and four system lamps. The rear carries
  five fan modules (4+1, dual-rotor) across the top and four 3200 W supplies (2+2) across the
  bottom between two legend panels, the left one with the grounding point. No installation
  guide exists for this model; it is drawn from the datasheet and from vendor renders.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      A DATASHEET AND VENDOR RENDERS, AND NO INSTALL GUIDE. Celestica DS6000 datasheet rev
      100725 (2 pp, Foleon, byte-identical to the STORDIS mirror) is the only document; the
      intake confirmed that Celestica's documentation portal stops at the DS5000 and every
      DS6000 install-guide URL pattern returns 404. Six images are staged: the square-on front
      (ds6000-F, 1200 x 800, and ds6000-F-2, the same render with a STORDIS callout) and
      square-on rear (ds6000-B, 1200 x 661, labelled front-to-back, with STORDIS callout
      discs over the supplies and the middle fan) from the STORDIS product page, and three
      Foleon three-quarter renders (ds6000-A 3626 px, ds6000-A-2, ds6000-A-3 front and rear
      stacked). Positions come from the square-on pair; the three-quarter renders were used
      for identity, legends and counts only (counting-is-not-measuring). No vendor 3D model
      was found on either product page.
  gate-1:
    confidence: photo-measured
    note: >-
      MARGINAL ON THE FRONT, FAILS ON THE REAR, SO EACH AXIS IS SCALED BY ITS OWN DATASHEET
      DIMENSION. The front bezel reads 938 x 275 px (x 131.5-1069.5, y 260.5-535.5 by
      threshold on the black plate), aspect 3.411 against 438/129.8 = 3.374, 1.1% out. The
      rear body reads 916 x 266.5 px (x 140.5-1056.5, y 83.8-350.3), aspect 3.437, 1.9% out.
      Both renders run SHORT in height by the same sense, which says the difference is in
      the renders or in what the datasheet height includes (feet, a lid lip) rather than in
      either edge reading, and neither image has a feature of independently known size to
      settle it. So x is taken as a fraction of 438 and y as a fraction of 129.8, and every
      position is quoted to +/-0.5 mm, the size of one render pixel. The front's column
      pitch was then checked for perspective: fifteen cage-frame left edges fit a straight
      line at 26.616 mm with residuals under 0.25 mm and no trend, so the render is
      orthographic across the row.
  chassis:
    confidence: datasheet
    note: >-
      Height 129.8 mm, width 438 mm, depth 712.2 mm, 35 kg, 3U - datasheet PHYSICAL
      DIMENSIONS. 438 is the body between the rack-ear folds: the square-on renders show the
      ears (front: pale handle brackets with green thumbscrews; rear: grey brackets) standing
      outside a body whose own width is what scales to 438. Ears and handles are not drawn.
      COLOUR follows the ruling for every Celestica switch - a black faceplate on an otherwise
      silver chassis: chassis.color is the sheet metal (#c4c8cc, which the rear, lid and sides
      show on every render) and the front's black is a full-face `bezel` decor (#16181b).
  the-osfp-wall:
    confidence: photo-measured
    note: >-
      SIXTEEN COLUMNS OF TWO STACKED PAIRS, NUMBERED DOWN EACH COLUMN. Each column holds two
      blocks, each block a 2x1 stacked OSFP cage: a bright metal shell 24.3 mm wide and 35.0
      tall with a white perforated band 7.5 mm tall between its two apertures. The three-
      quarter render ds6000-A shows the band and the two openings clearly at 3.6k px; on the
      square-on render the band reads as the lighter strip mid-block. Shell frames fit
      x = 7.15 + 26.616 i (i = 0..15), so column centres are 19.3 + 26.616 i, symmetric about
      the face centre to 0.2 mm; blocks span y 35.4-70.4 and 78.1-113.1. The OSFP apertures
      are std/osfp@1's 23.1 x 13.5 centred in each shell half, which the 35.0 block height
      carries with 0.25 mm to spare at each end. ORDER, from the legend printed between the
      blocks and legible on ds6000-A: `1 (bar-triangle-up) 2 (up)(down) 3 (down-triangle-bar) 4`
      - port 1 is the top aperture of the upper block, 2 its bottom, 3 the top of the lower
      block, 4 its bottom; column 2 is 5-8, and so on to 61-64. STACKS are upper 0 / lower
      180 per block, following the library precedent for OSFP pairs (edgecore/ais800-64o);
      L108 does not check OSFP, and no tab reading was possible at 2 px/mm.
  the-port-legends:
    confidence: photo-measured
    note: >-
      One legend row per column on a baseline at 75.1 mm between the two blocks, 2.2 mm type,
      averaged over all sixteen columns on ds6000-F: the first port's numeral and bar-topped
      up-triangle span -10.3 to -6.5 mm from the column centre, the middle pair's numerals and
      up/down triangles -4.2 to +4.2, the last port's bar-bottomed down-triangle and numeral
      +6.5 to +10.7. The bars are drawn as short strokes over the first triangle and under the
      last. The rule runs to the last column: ds6000-A shows "61 62 63 64" in the same form.
  the-port-lamps:
    confidence: photo-measured
    note: >-
      FOUR ROUND LENSES PER COLUMN, TWO ABOVE THE UPPER BLOCK AND TWO BELOW THE LOWER, at the
      column centre +/-9.8 mm and y 31.7 / 116.7. ds6000-A shows each as a round window with a
      bright dot, sitting at the ends of the perforated strip over each block; on ds6000-F
      they are the small bright marks at the ends of those strips. Four per column is one per
      port, but WHICH PORT EACH SERVES IS NOT PUBLISHED: with no install guide there is no LED
      table, and position alone cannot say whether the left lens above a block serves its top
      or its bottom port. Each lamp therefore names its block's two ports collectively, and
      the port-lamp-assignment gap records the question. led-dot@1 at 2 mm is the size read.
  the-management-cluster:
    confidence: photo-measured
    note: >-
      Bright-object bounding boxes on ds6000-F, x 205-430 mm, y 3-26 mm: CON0 211.1-227.4 and
      CON1 234.4-251.2 (white RJ45 housings), SFP56 M1 259.2-274.1 and M2
      281.1-296.0 (bezel 12.3-24.5 down) with a green lamp and "SFP56" above each and "M1",
      "M2" below, MGMT 304.0-320.8 (dark jack with lamps in its upper corners), TOD
      327.8-344.1 (white), 1PPS and 10MHz SMA nuts 7.0 mm across at 355.1 and 367.7 (silver,
      drawn as panel decor round std/sma@1 because common/sma-jack@1's nut is gold), the
      USB-A and USB-C shells drawn as panel decor round their std/ openings. ALL FOUR RJ45s ARE
      KEYWAY UP: on ds6000-A at 3.6k px every jack's opening is narrow at the top (the latch
      slot) and wide at the bottom where the contacts show, and MGMT's lamps sit in the
      keyway-side corners, so all four are std/rj45@2 / common/rj45-eth@1 at rotate 180.
      Continuing: the USB-A shell standing vertical at 381.5
      with its SuperSpeed "SS" mark beside it, the USB-C console vertical at 394.6, RST at
      406.4 and the four lamps ALM/FAN over SYS/PSU at 417.2/424.2 by 15.0/20.4. The RJ45s
      are placed on one centreline (15.95); the render's scatter is 0.2 mm. Identities are
      confirmed by the legible legends on ds6000-A. The render shows a small oval outline just
      left of the USB-C that no document explains; it is not drawn (see gaps).
  the-esd-jack-and-wordmark:
    confidence: photo-measured
    note: >-
      "Celestica" is printed at the top left of the bezel, x 3.4-26.6, cap band 5.9-9.8, and
      set here as plain text, which the no-logos rule permits for a wordmark. The ESD jack
      below it is visible only on ds6000-A (the square-on render is black there); its "ESD"
      legend reads at (8.7, 20.0) on ds6000-F and the jack is placed centred above the legend
      by proportion from ds6000-A, so its y is estimated to about a millimetre.
  the-vent-fields:
    confidence: estimated
    note: >-
      The bezel is perforated with small square holes almost everywhere the ports and jacks
      are not; ds6000-A resolves them as roughly 2 mm squares on about 2.6 mm. Three fields
      are drawn - above the OSFP wall left of the management cluster, and the strip under it,
      split round the LUG TAG - each on a backing rect (vent-field-needs-backing-rect). Their
      extents are the areas the square-on render shows as textured, not measured hole by hole.
  lug-tag:
    confidence: photo-measured
    note: >-
      A pull-out luggage tag at the bottom right, "LUG TAG" printed above it at (393.5, 123.4)
      and the model name on the tab itself, 381.8-405.2 across at the bottom edge on ds6000-F.
      celestica/lug-tag@1 (23.0 x 4.0) is placed centred on it, LANDSCAPE (rotate 0) because
      this tag lies along the bottom edge rather than standing on end as on the DS3000/DS4000.
      The label is "DS6000", legible on ds6000-A and as a blur on ds6000-F. Which end carries the
      pull lip does not resolve on either render; the part's own lip-right is kept.
  the-rear:
    confidence: photo-measured
    note: >-
      ds6000-B, x as a fraction of 438 over 916 px and y of 129.8 over 266.5 px. FIVE FAN
      MODULES across the top on an 85.47 mm pitch from x 7.56, each 81.8 x 83.4 from y 3.0.
      FOUR SUPPLIES across the bottom on a 77.49 mm pitch from x 65.9, y 88.0-129.4 frame; the
      crps-1u 73.5 x 40 envelope is centred in each frame. Two fixed legend panels flank the
      supplies, 5.5-62.6 and 375.6-432.7 across. The left panel prints the earth symbol,
      "fan 1 up, fan 2 right-right, fan 3 right-right-right" on its top row and "PSU 1 right,
      PSU 2 right-right" below; the right panel "fan 4 left-left, fan 5 up" and "PSU 3
      left-left, PSU 4 left" - arrows pointing from the panel to the module each names, which
      is how the modules are numbered 1-5 and 1-4 left to right as seen from the rear. The
      fan-1 legend and the earth symbol are legible only on ds6000-A-3 (the square-on render
      shows that corner as a blank patch) and are placed by proportion from it. Two stud holes
      at (10.1, 109.2) and (10.1, 119.0) on ds6000-B take a two-hole lug, which ds6000-A-3
      shows fitted. A yellow two-symbol hazard label sits under the legends on each panel.
  airflow-colour:
    confidence: photo-measured
    note: >-
      STORDIS names the rear render "Rear_Front_To_Back", and its fan bars, fan latches, supply
      bails and supply latches are all red; ds6000-A-3 agrees. This is the F2B AC build
      (R4087-F9004-A1). The B2F build's handle colour is unseen and is not assumed; see gaps.
  power:
    confidence: datasheet
    note: >-
      "2+2 redundant, hot swappable AC/DC 3200W PSUs", "180-240VAC auto-ranging, 47-63Hz
      /40-72VDC input". The datasheet gives NO chassis power figure - no typical, no maximum -
      so power-max-w is not written, and no per-fan figure either. "Up to 32W / 40W
      transceivers" is recorded as the optics budget.
  lifecycle:
    confidence: datasheet
    note: >-
      Launched 2025-10 (datasheet rev 100725, press release 2025-10-10). The Foleon product
      page is live and carries the datasheet; no end-of-sale or end-of-life notice was found
      on it, on the STORDIS page or in the intake's searches, so none-announced.
attrs:
  physical:
    weight-kg-note: '35 kg (datasheet; configuration not stated)'
    rail-kit: 'optional rail kit (Foleon product page)'
  performance:
    switching-capacity: '102.4 Tbps'
    port-modes-osfp224: '64 x 1.6TbE; 50/100/200/400/800GbE with breakouts; 128 x 800GbE, 256 x 400GbE, 512 x 200GbE'
    serdes: '224 Gbps'
  power:
    psus: '2+2 redundant hot-swap 3200 W, AC or DC'
    input-ac: '180-240 VAC auto-ranging, 47-63 Hz'
    input-dc: '40-72 VDC'
  thermal:
    fans: '4+1 field-replaceable fan modules, dual-rotor, 9+1 rotor redundancy'
  environmental:
    operating-temp: '0 to 40 C'
    humidity: '5% to 95% non-condensing'
    mtbf: 'in excess of 150,000 hours'
  platform:
    switch-silicon: 'Broadcom Tomahawk 6'
    cpu: 'Intel Xeon-D x86, 4C / 8C / 10C (COM Express)'
    memory: 'up to 64 GB DDR4'
    storage: 'up to 512 GB M.2 SSD'
    bmc: 'RunBMC, 2 GB DDR4, dual 128 MB flash for dual boot, OpenBMC, serial over LAN'
    software: 'SONiC; ONIE for compatible open-source and commercial NOS'
  features:
    optics-osfp: 'Up to 32 W / 40 W transceivers, up to 1 m DAC (datasheet OPTICS / Cables; not split by port type)'
    timing: 'IEEE 1588 1-step and 2-step time stamping; transparent and boundary clock; SyncE clock recovery; 1PPS, 10 MHz and ToD interfaces'
  management:
    mgmt-ports: '2 x 50GbE SFP56 management, RJ45 console (CON0, CON1), RJ45 GbE OOB, USB 3.0 Type-A, USB-C console'
  compliance:
    emissions: 'AS/NZS CISPR32:2015+A1:2020 Class A; ICES-003 Issue 7:2020 Class A; EN55032:2015/AC:2016 Class A; VCCI-CISPR 32:2016 Class A; TEC/SD/DD/EMC-221/05/OCT-16 Class A; FCC CFR 47 Part 15 Subpart B Class A; EN/IEC61000-3-2; EN/IEC61000-3-3'
    immunity: 'EN 300 386 V1.6.1; EN 300 386 V2.2.1; EN 55035:2017/AC:2019; EN 61000-4-2/-3/-4/-5/-6/-8/-11'
    safety: 'IEC 62368-1:2014, :2018 and 2023 (CB Scheme, all country deviations); EN 62368-1:2014+A11:2017; EN IEC 62368-1:2020+A11:2020; EN IEC 62368-1:2024/A11:2024; UL 62368-1:2025; CSA C22.2 No. 62368-1:2025'
    green: 'WEEE 2012/19/EU; EU RoHS 2011/65/EU and 2015/863/EU; REACH (EC) 1907/2006; China RoHS'
  lifecycle: {eol: none-announced}
chassis: {width: 438.0, height: 129.8, depth: 712.2, ru: 3, weight-kg: 35, color: '#c4c8cc', silk: '#f2f4f6'}
gaps:
- what: install-guide
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    Celestica's documentation portal lists families up to the DS5000; /en/networking/ds6000
    404s, a portal search returns nothing, and every install-guide URL pattern that resolves
    for the DS5000 404s for the DS6000 (intake probe, 2026-09-26).
  wanted: >-
    The DS6000 hardware installation guide - for the LED tables, the port-lamp mapping, the
    per-FRU power figures and a dimensioned elevation to replace the 2 px/mm renders.
- what: port-lamp-assignment
  scope: [port-leds]
  reason: vendor-silent
  note: >-
    Four lenses per column, two above and two below; neither the datasheet nor the renders
    say which port each serves or what colours it shows.
  wanted: >-
    The port LED table from an install guide, or a photograph of a live unit with a known
    port lit, to assign each lens to one port and give it its states.
- what: b2f-rear
  scope: [rear, fans, psus]
  reason: needs-photo
  note: >-
    Only the front-to-back rear is rendered anywhere (STORDIS ds6000-B, Foleon ds6000-A-3).
    R4087-F9013-A1 (AC, B2F) is drawn with the F2B modules.
  wanted: >-
    A rear render or photograph of the back-to-front build, to set its fan and supply handle
    colour (and confirm the modules are otherwise the same).
- what: dc-psu-face
  scope: [psus]
  reason: needs-photo
  note: >-
    R4087-F9005-A1 ships DC supplies (40-72 VDC); no image of a DC supply exists and no
    component is drawn, so the DC build leaves its supply bays empty.
  wanted: >-
    A render or photograph of the DS6000 DC supply face (input terminal type and layout) to
    build its component.
- what: chassis-power
  reason: vendor-silent
  note: >-
    The datasheet gives supply ratings only - no typical or maximum system power, and no
    per-fan figure.
  wanted: 'The DS6000 typical and maximum power consumption, and the fan module draw.'
- what: psu-inlet-identity
  scope: [psus]
  reason: vendor-silent
  note: >-
    The inlet is read as IEC C20 from the pin layout in ds6000-A-3; no document names it.
  wanted: 'The supply datasheet or the install guide power-cord table naming the inlet.'
- what: usb-c-oval
  scope: [front]
  reason: needs-photo
  note: >-
    A small oval outline sits just left of the USB-C console on both front renders; it could
    be a lamp or a moulding. Not drawn.
  wanted: 'A close photograph of the management cluster, or the guide LED table, to say what it is.'
- what: render-height
  scope: [front, rear]
  reason: sources-disagree
  note: >-
    Both square-on renders run short in height against the datasheet: front aspect 3.411
    and rear 3.437 against 438/129.8 = 3.374 (1.1% and 1.9%). y is scaled to 129.8.
  wanted: >-
    A dimensioned drawing, or a photograph with a known dimension in frame, to say whether the
    renders or the 129.8 mm figure (which may include feet or a lid lip) is the face height.
groups:
  osfp224:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      64 x 1.6TbE OSFP224, sixteen columns of two stacked pairs, numbered down each column
      (1-4, 5-8 ... 61-64). Breakout to 2 x 800, 4 x 400 or 8 x 200 GbE is a NOS mode, not a
      port.
    attrs: {media: osfp, speed: 1.6t}
  sfp56:
    term: Port
    role: management
    index-origin: 1
    description: 'Two 50GbE SFP56 management ports, printed M1 and M2'
    attrs: {media: sfp56, speed: 50g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band reach into the box - two RJ45 serial consoles, the RJ45 GbE MGMT port, a
      USB-C console and a USB 3.0 storage port, with the reset pinhole and the ESD jack beside
      them. Five media, one job: a person at the rack getting in.
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: 'the three external timing interfaces the datasheet names together - 1PPS, 10 MHz and ToD'
  leds: {term: LED, role: indicator, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs: {redundancy: '2+2'}
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs: {redundancy: '4+1'}
  earth: {term: Ground, role: service, index-origin: 1}
  furniture:
    term: Item
    role: furniture
    index-origin: 1
    description: the luggage tag and the two hazard labels
