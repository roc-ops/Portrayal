format: 1
kind: device
name: ds5000
version: 0.1.1
maturity: modelled
manufacturer: Celestica
model: DS5000
portfolio: {line: Hardware Platform Solutions, family: 800G Data Center Switch, series: DS}
description: >-
  Celestica DS5000 - a 2RU 64 x 800G OSFP data centre and AI fabric switch on a Broadcom
  Tomahawk 5 (51.2 Tbps) with an Intel Xeon D COM Express CPU and an optional BMC. All
  sixty-four OSFP cages are on the FRONT in TWO BANKS of sixteen stacked columns, the columns
  GANGED IN FOURS - four shells of four per bank - and numbered DOWN EACH COLUMN ACROSS BOTH
  BANKS: column 1 carries ports 1 and 2 in the upper bank and 3 and 4 in the lower. Each
  column has a legend row of four round lamps between `(up) N` and `N+1 (down)`, above the
  upper bank and below the lower. At the right of the wall sit a console and a management
  RJ-45 on their sides in one shell, a USB 3.0 Type-A, a reset button, two SFP28 ports
  numbered 65 and 66 with four triangular lamps between them, and four system lamps (STAT,
  ALM, PSU, FAN). The rear carries FOUR 2000 W supplies, two stacked at each end, and THREE
  fan modules between them; the front panel is black and the rear and body bright metal.
profile: networking
stack-exceptions:
- pairs: [[port-1, port-2], [port-5, port-6], [port-9, port-10], [port-13, port-14], [port-17,
    port-18], [port-21, port-22], [port-25, port-26], [port-29, port-30], [port-33, port-34],
    [port-37, port-38], [port-41, port-42], [port-45, port-46], [port-49, port-50], [port-53,
    port-54], [port-57, port-58], [port-61, port-62], [port-3, port-4], [port-7, port-8], [port-11,
    port-12], [port-15, port-16], [port-19, port-20], [port-23, port-24], [port-27, port-28],
    [port-31, port-32], [port-35, port-36], [port-39, port-40], [port-43, port-44], [port-47,
    port-48], [port-51, port-52], [port-55, port-56], [port-59, port-60], [port-63, port-64]]
  reason: >-
    HELD AS DRAWN, NOT A READING OF THIS TURN (#799). The installation guide's Figure 1 (an
    orthographic CAD elevation, 5.5 px/mm) draws both cages of each bank alike and the two banks
    mirrored: the card slot low in both openings of the upper bank (ports 1 and 2, vents across the
    top of port 1) and high in both of the lower bank (3 and 4, vents across the bottom of port 4) -
    a stacked 2x1 cage on each face of one board (OSFP MSA rev 5.22 sections 7.1 and 7.6). That
    reading wants 0/0 in the upper bank and 180/180 in the lower, which is neither the 0/180 drawn
    here nor the 0/0 throughout that #799 first proposed, so the geometry is held until it is
    decided; the gap stacked-osfp-orientation says what settles it.
provenance:
  sources:
    confidence: datasheet
    note: >-
      TWO SOURCES AND TWO PRODUCT RENDERS. The DS5000 hardware guide on Celestica's
      documentation portal (22 pages converted to markdown, 31 figures), whose "DS5000 System
      Overview" page carries the spec table and four figures - Figure 1 Front View (2965 x
      783), Figure 2 Rear View (3121 x 663), Figure 3 Side View and an untitled rear
      three-quarter view - plus the FRU removal pages and the breakout table; and the
      DS5000 datasheet (cls_branded_datasheet_DS5000_100925, 2 pages, 2025-10-09), which
      repeats the spec table and adds the ordering code, the fan redundancy and the software
      list. Figures 1 and 2 are CAD elevations, not photographs, with callouts and red port
      numerals drawn over them.
      NO SQUARE-ON PHOTOGRAPH EXISTS in anything found. Celestica's product page
      (cls.celestica.com/hardware-platforms/ds5000/) carries two three-quarter renders - the
      front alone and front plus rear side by side - fetched and kept as intake photos; they
      fail any face-on check and were used for COLOUR and COUNTS only. www.celestica.com
      answered HTTP 429 and was not retried.
  gate-1:
    confidence: measured
    note: >-
      PASSES ON BOTH FACES. Figure 1's chassis body, between the ear fold lines (the ears are
      drawn and are NOT modelled), spans x 152.2-2579.0 and y 107.0-590.8 px by half-maximum
      edge reads - 2426.8 x 483.8 px against the stated 438.5 x 87 mm, 5.534 px/mm across and
      5.561 down, 0.48% apart. Figure 2 spans x 393.0-2810, y 47.5-529.5 - 5.512 and 5.540,
      0.51% apart. Each axis is measured on its own scale.
      AND THE FACE IS ORTHOGRAPHIC, NOT MERELY THE RIGHT SHAPE: fitting the sixteen OSFP
      column centres on each of the four rows to x = first + (i//4)*B + (i%4)*p gives an rms
      of 0.021-0.052 mm, and adding a quadratic term moves the ends of the row by at most
      0.14 mm - there is no perspective in it. The pitch the fit returns, 23.23, is within
      0.01 mm of the 23.2353 the AIS800-64O measured independently on Edgecore's own drawing
      of a Tomahawk 5 OSFP wall, which is a scale check the figure did not supply.
  the-optical-wall:
    confidence: measured
    note: >-
      FOUR GANGS OF FOUR COLUMNS PER BANK. Dark-opening runs scanned along the four cage rows
      and fitted to x = first + floor(i/4)*B + (i mod 4)*p give, on the two cleanest rows,
      first 30.171 / 30.227, B 96.209 / 96.213, p 23.227 / 23.226, rms 0.023 / 0.021 mm, worst
      residual 0.047. 30.20 / 96.21 / 23.23 are used; the gutter is B - 4p = 3.29 mm.
      std/osfp@1's 23.1 x 13.5 aperture is seated centred on each column, so adjacent cages in
      a gang stand 0.13 apart.
      ROWS. The column-wall profile averaged over all sixteen columns puts the upper bank's
      shell at y 16.3-45.9 and the lower's at 51.5-80.8. Inside the upper shell the two
      openings read 17.2-30.3 and 32.3-45.0 with a 2 mm perforated band between them, centres
      23.75 and 38.65 - a 14.90 row pitch, the same 14.897 the AIS800-64O measured - and
      inside the lower 52.6-65.2 and 67.4-80.4, centres 58.9 and 73.9. The registry
      apertures are centred on each bank at 31.15 and 66.25 with the 14.90 row pitch, so the
      cages sit at y 16.95, 31.85, 52.05 and 66.95.
      EACH GANG IS ONE SHELL: a bright frame 93.9 wide round each four-column block, gasket
      fingers along its top and bottom and a perforated band between the rows. The inter-bank
      strip (45.9-51.5) is plain black panel with no hole in it.
      WHICH WAY THE CAGES FACE IS HELD, NOT SETTLED (#799). Each bank pair is drawn upper 0 /
      lower 180. Figure 1 reads otherwise: both openings of the upper bank have the card slot low
      (vents across the top of port 1), both of the lower bank have it high (vents across the
      bottom of port 4) - each bank a stacked 2x1 cage seating its two modules the same way up,
      the lower bank on the underside of the board (OSFP MSA rev 5.22 sections 7.1, 7.6). That is
      0/0 over 180/180, which is not what #799 first proposed (0/0 throughout), so the turn is
      left as drawn, every pair is named in stack-exceptions, and the gap
      stacked-osfp-orientation says what settles it.
  the-numbering-runs-down-each-column:
    confidence: drawing
    note: >-
      READ OFF THE FIGURE, NOT INFERRED. Figure 1 prints red callout numerals 1, 2, 3, 4 down
      the first column, 33-36 down the ninth and 61-64 down the last, and the panel's own
      legend rows say the same - `(up)1 ... 2(down)` over the upper bank of column 1 and
      `(up)3 ... 4(down)` under its lower bank, `(up)5 ... 6(down)` over column 2. The guide's
      30 W note corroborates it independently: "top four leftmost (1,5,9,13) and four
      rightmost (49,53,57,61) and bottom four leftmost (4,8,12,16)" is exactly a four-per-column
      numbering. So port n sits in column ceil(n/4), odd ports are the upper cage of their
      bank and even the lower.
  the-port-lamps-are-four-per-column:
    confidence: measured
    note: >-
      FOUR ROUND LENSES PER COLUMN IN THE LEGEND ROW, i.e. TWO PER PORT. Bright blobs on the
      legend baselines, binned by offset from their column centre across all sixteen columns,
      put lenses at -6.08 (n=33), -1.82 (n=43), +1.95 (n=40) and +6.00 (n=31), sd 0.26-0.33;
      they are seated symmetric at -6.0, -1.9, +1.9, +6.0 on centres y 14.85 above the upper
      bank and 82.55 below the lower (see the-legends for why not 15.10 / 82.75). The lens reads 1.2-1.6 across; common/led-dot@1 (2.0) is
      seated on the measured centres.
      OWNERSHIP IS NOT PUBLISHED. The left pair is given to the port whose `(up)` arrow and
      numeral are on the left (the upper cage) and the right pair to the lower, which is what
      the legend's layout suggests and nothing states. No document describes a port lamp at
      all - see the port-lamp-meaning gap.
  the-legends:
    confidence: measured
    note: >-
      READ AT MATCHED SCALE, AND THE FIRST READING WAS WRONG. A thresholded blob sweep first put
      the arrows at +/-10.2 and the numerals at +/-8.9; laid over the render at 6x (33 px/mm) the
      figure's own arrows sit at -9.37/-9.4 and +9.6 and the one-digit numerals' centres at
      -7.86/-7.6 and +7.8 - the blob sweep had merged each arrow with the gasket fingers beside
      it. So the arrows are at +/-9.5 and the numerals hug them from inside: the odd numeral
      STARTS at -8.25 and the even one ENDS at +8.25, so a two-digit numeral grows towards the
      lamps, as the figure's "10" and "14" do. Arrows, numerals and lamps share one centreline,
      y 14.85 above the upper bank and 82.55 below the lower (the lamps first read 15.10 and
      82.75). Cap height about 0.9 mm, so font-size 1.3. At 5.5 px/mm a numeral is five pixels
      tall: positions are measured, glyph weight is not.
  the-management-cluster:
    confidence: drawing
    note: >-
      Read on a 3x and an 8x crop of Figure 1 in chassis millimetres. A silver shell x
      407.4-420.6, y 5.3-36.2 holds two RJ-45 jacks ON THEIR SIDES - contacts drawn down the
      left, keyway notch on the right, each 10.8 wide and 12.3-12.6 tall - centred at x 414.9,
      y 14.03 (CONSOLE) and 27.97 (MGMT), a 13.94 pitch against std/rj45-ganged@2's 13.97,
      so that cell turned 270 is what is seated. The MGMT jack takes
      common/rj45-ganged-eth@1, the same cell with the two keyway-corner lamps the library
      gives every Ethernet jack (L76); Figure 1 draws a round feature inside MGMT's face and
      resolves no lamps, so the lamps are the family rule and not a reading. A USB-A in its own shell x 407.4-420.6, y
      39.5-44.9. RST, a small dark button at (420.2, 48.9), legended to its left. Two SFP28
      cages in one shell x 401.9-417.6, y 51.5-77.0, centred 56.4 and 71.4, with a 4.5 mm
      band between them carrying four green triangles, legended 65 above and 66 below. Four
      rectangular yellow-green lenses at x 420.4, y 56.3, 63.7, 71.2 and 78.65 (a 7.45 pitch),
      about 1.3 x 2.7, legended STAT, ALM, PSU and FAN on their sides to the right. CONSOLE,
      MGMT and SS are printed on their sides to the left of their ports.
  the-sfp28-lamps:
    confidence: drawing
    note: >-
      FOUR TRIANGLES, POINTING down-up-down-up from left to right, at x 405.07, 407.97, 411.57
      and 414.47 on y 63.9 (the drawn offsets from the cage centre, -4.52/-1.80/+1.81/+4.83,
      are symmetrised to +/-1.8 and +/-4.7). The up-pointing pair is given to port 65 above
      and the down-pointing pair to 66 below, on the arrows' say-so; nothing documents them.
  the-system-lamps-and-between-them:
    confidence: drawing
    note: >-
      BETWEEN STAT/ALM, ALM/PSU AND PSU/FAN THE FIGURE DRAWS THREE SMALL LIGHT SQUARES that no
      callout names and no legend marks. They could be unlit lenses, light pipes or screw
      heads; at 5.5 px/mm they are four pixels across. They are not drawn and not punched -
      see the unlabelled-system-windows gap.
  the-vent-fields:
    confidence: measured
    note: >-
      THE TOP FIELD: three rows of vertical slots about 1.1 x 2.0 across x 46.1-403.1 on a
      2.973 mm pitch (121 slots, first to last), rows centred at about 4.9, 8.0 and 11.1 -
      drawn as the `slots` tile scaled to 2.9732 x 3.1. The field stops short of the CONSOLE
      legend. THE EDGE LATTICES: at each end of the face two columns of square windows about
      2.7 wide on a 6.12 mm vertical pitch (bars measured at y 6.7, 12.95, 19.06 ... 80.2 on
      both columns), x 6.7-9.9 and 11.2-14.4 on the left and the mirror on the right. The
      figure shows the chassis interior through them, which is what makes them openings and
      not paint. OUTBOARD OF THEM, x 0-5.4 and 433.1-438.5, is a band of silver framing and
      further openings partly hidden behind the rack-mount latch; it is left as body metal.
  colour:
    confidence: photo-measured
    note: >-
      THE FRONT PANEL IS BLACK and the body, rear and FRU frames are bright metal - Celestica's
      two product renders sample the front at RGB 27-33 and the rear strips at 215. The guide's
      CAD elevation renders the panel mid-grey (68, 73, 79) and was not used for colour. The
      front's black is drawn as a `faceplate` decor plate between the side lattices, because a
      chassis has one colour and the DS5000's is the bright one.
  the-rear:
    confidence: drawing
    note: >-
      Read on Figure 2 at 5.512 x 5.540 px/mm. From the left: a 10.4 mm strip carrying two
      bosses, the PSU-3 and PSU-4 legends, an earth symbol and the grounding bracket; PSU-3
      over PSU-4 at x 10.4-66.6 (read 10.1-66.9 including the frame lines; seated at the
      supply's 56.2 width, see celestica/psu-2000-ac@1); a 14.55 mm strip with five bosses and a black screw; FAN-3,
      FAN-2 and FAN-1 at x 81.25, 178.55 and 275.85 (97.3 pitch, 81.4 wide, the block centred
      on the chassis) with a 16 mm strip after each carrying its FAN-n legend and four bosses;
      a 14.55 mm strip with five bosses and a black screw; PSU-1 over PSU-2 at x 371.9-428.1;
      and a 10.4 mm strip with three bosses and the PSU-1 and PSU-2 legends. The two supply
      pairs are one face drawn four times, not mirrored. Bosses are drawn as the dark rings
      the figure shows; whether they are standoffs, PEM nuts or plugged holes is not stated.
  the-grounding-point:
    confidence: drawing
    note: >-
      Figure 2's "Ground lug" callout points at a copper bracket on the left strip, x 0.4-9.5,
      y 42.4-71.0, under a circled earth symbol at (4.95, 38.9): a ring lug at its top and two
      black Phillips screws at y 57.3 and 66.6. The guide's Ground Lug Installation page says
      that bracket is the ground lug assembly (GLA), shipped in the accessory kit and "not
      applicable to the AC SKU versions". SO THE BRACKET AND LUG ARE NOT DRAWN - they are a
      kit part with a cable on it, the same class as a cord retainer - and the two screws that
      fix it and the printed earth mark are.
  the-lug-tag:
    confidence: drawing
    note: >-
      Figure 1's "Lug tag" callout is celestica/lug-tag@1, Celestica's slide-out information
      card, standing on end in a slot in the inner left lattice column. READ AT 14x (77.5 px/mm)
      THE FIRST DESCRIPTION WAS WRONG: I had called it a tag hanging on a loop. The close-up
      shows a black card x 11.8-14.5, y 56.4-78.8 (22.4 long) in a slot x 11.5-14.7, y
      56.1-79.2 (3.2 x 23.1), the model name printed along it reading bottom to top, and the
      panel printing LUG TAG beside it, x 15.4-17.4, y 61.9-74.1, also bottom to top - the
      DS3001's arrangement. The part's 23.0 x 4.0 slot matches to 0.1 mm on the long axis. It
      is seated rotate 270 (lip up) centred on the slot at (13.1, 67.65), label DS5000.
  power:
    confidence: datasheet
    note: >-
      The guide's spec table and the datasheet both give "Power Consumption (W) <4000W",
      unqualified as to measure, scope or ambient; it is filed as power-draw-max-w per the
      library's rule for an unqualified figure. Four 2000 W supplies in a 2+2 arrangement is
      4000 W with two failed, which is the vendor's own ceiling. No per-fan figure is
      published anywhere; the L27 warning on the fan module stands.
  lifecycle:
    confidence: datasheet
    note: >-
      Searched 2026-09-26: Celestica's product page for the DS5000 carries a "now shipping"
      banner and no end-of-sale notice; the datasheet is dated 2025-10-09. None announced.
attrs:
  physical:
    weight-note: '30 kg (datasheet and guide spec table; configuration not stated)'
  performance:
    switching-capacity: '51.2 Tbps IO bandwidth'
  power:
    power-draw-max-w: 4000
    power-input: '100-240 VAC auto-ranging 47-63 Hz, or 180-300 VDC auto input'
  environmental:
    operating-temp: '0 to 40 C (front-to-back airflow)'
    humidity: '5% to 85% non-condensing'
    mtbf: 'in excess of 150,000 hours'
  platform:
    switch-silicon: 'Broadcom StrataXGS Tomahawk 5'
    cpu: 'Intel Xeon D x86, 4-core (up to 8-core), 2.9 GHz, COM Express'
    memory: '2 x 16 GB DDR4 with ECC'
    storage: '128 GB / 256 GB M.2 SSD'
    software: 'SONiC; ONIE; ONL; Redfish'
    bmc: 'optional BMC system management - RunBMC, OpenBMC'
  features:
    breakout: >-
      guide, System Breakout Capabilities: 1 x 800G, 2 x 400G, 4 x 200G, 2 x 200G, 8 x 100G,
      1 x 400G and 4 x 100G modes; odd-numbered front ports support up to 8x breakout and
      even-numbered up to 2x ("due to ASIC limitation").
    timing: 'IEEE 1588 1-step and 2-step time stamping; transparent and boundary clock; SyncE clock recovery (timing option)'
    optics-osfp: >-
      OSFP 800G optics and DAC: up to 20 W / 30 W transceivers, up to 4 m DAC, ZR/ZR+ coherent
      modules supported; up to 16 ports of 30 W optics on ports 1, 5, 9, 13, 49, 53, 57, 61
      (upper row) and 4, 8, 12, 16, 52, 56, 60, 64 (bottom row). Tested in the guide's
      breakout table: OSFP 2x FR4 (dual duplex LC), OSFP 2x VR4 and 2x DR4 (dual MPO-8),
      OSFP DR8 (MPO-16) and a 400G OSFP AOC.
    optics-sfp28: >-
      SFP28 25G optics; the guide notes 1G transceivers are supported once speed and FEC are
      configured. No SFP28 module is listed in the tested table.
  compliance:
    emc: 'CE EMC, VCCI, FCC, ICES003'
    safety: 'UL, CB, CCC'
  lifecycle: {eol: none-announced}
