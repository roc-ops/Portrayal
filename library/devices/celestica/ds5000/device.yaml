  airflow: front-to-back, power: ac}
gaps:
- what: port-lamp-meaning
  scope: [front]
  reason: vendor-silent
  wanted: >-
    What the four lenses in each column's legend row mean and which port each serves. Neither
    the guide nor the datasheet has an LED section: the guide's overview callouts name the
    ports, the management jacks and the four system lamps and stop, and the datasheet
    mentions no LED at all. Two lamps per port is drawn, left pair to the upper port.
- what: psu-lamp-legend
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    What the two lamps on each supply and the one on each fan module mean. The supplies'
    lamps carry tiny rotated legends that Figure 2 does not resolve; no document names them.
- what: unlabelled-system-windows
  scope: [front]
  reason: needs-drawing
  wanted: >-
    What the three small light squares between the STAT, ALM, PSU and FAN lamps are. A
    drawing or photograph of the cluster at 15 px/mm or better settles whether they are
    lenses and whether anything should be punched there.
- what: fru-part-numbers
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    Orderable part numbers for the 2000 W supply and the fan module. The datasheet's ordering
    table lists only the system (R4028-F9002-A1) and the guide's FRU pages give removal steps
    without part numbers, so both components are named for their form rather than their PN.
- what: the-four-undrawn-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    Orthographic drawings of the lid, the underside and the two side walls. The guide's Side
    View and rear three-quarter view and the two product renders show all four at an angle:
    a plain lid with two stamped handles and two long pressings, and side walls carrying
    rail screws. Each face carries an `empty:` sentence.
- what: stacked-osfp-orientation
  scope: [front]
  reason: needs-photo
  wanted: >-
    Which way each OSFP bank faces. Figure 1 reads as 0/0 in the upper bank and 180/180 in the lower
    (a stacked 2x1 cage on each face of one board), the drawing here keeps 0/180 in both, and #799
    first proposed 0/0 throughout. A photograph of the front, or a decision on the elevation's
    reading, settles it; until then every pair is held in stack-exceptions.
groups:
  osfp800:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the sixty-four 800G OSFP ports, in TWO BANKS of sixteen stacked columns ganged in fours
      (23.23 mm in-gang pitch, 96.21 mm gang pitch, 3.29 mm gutter), numbered DOWN EACH
      COLUMN ACROSS BOTH BANKS - column c holds ports 4c-3 and 4c-2 in the upper bank and
      4c-1 and 4c in the lower. Odd ports take up to 8x breakout and even ports up to 2x.
    attrs: {media: osfp, speed: 800g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the two 25G SFP28 ports, printed 65 and 66 (rel-pos 1 and 2 here, since a group counts
      from 0 or 1) - they continue the front-port numbering,
      which is why they are in their own traffic group and not the management cluster. The
      datasheet lists them among the interfaces with no role.
    attrs: {media: sfp28, speed: 25g}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster at the right of the port wall - an RJ-45 serial console, a
      1GbE RJ-45 management port, a USB 3.0 Type-A port and the reset button.
  leds: {term: LED, role: indicator, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '2+2'
      redundancy-note: >-
        datasheet and guide: "2+2 redundant, hot swappable 2000W PSUs". The rear prints PSU-1
        and PSU-2 on the right pair and PSU-3 and PSU-4 on the left.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '2+1'
      redundancy-note: >-
        the guide's Hardware Overview says "2+1 redundant fans" and the datasheet "N+1
        redundant fans"; three modules, numbered FAN-1 at the right to FAN-3 at the left.
  earth: {term: Ground, role: service, index-origin: 1}
  fasteners: {term: Screw, role: furniture, index-origin: 1}
  furniture: {term: Item, role: furniture, index-origin: 1}
