configurations:
  ac-f2b:
    kind: base
    default: true
    description: >-
      The one ordering code the datasheet lists: 2U, 64 x 800GbE, COM Express 4-core CPU,
      32 GB DDR, 128 GB SSD, front-to-back airflow. This is a fixed switch, so the base
      configuration is the box as it is bought - four 2000 W supplies and three fan modules
      in, as the rear elevation draws them, and the cages empty.
    part-numbers:
      R4028-F9002-A1: {part: R4028-F9002-A1}
