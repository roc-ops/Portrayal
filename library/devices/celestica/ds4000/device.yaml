configurations:
  f2b:
    kind: base
    default: true
    description: >-
      Front-to-back airflow, two 1500 W AC supplies and seven fans, with the one-SFP+ front
      (M1 fitted, the M2 lanes routed as 10GBASE-KR - guide Figure 2), which is the build the
      DS4000 datasheet render shows. Ordered as R4023-F9102-A0 (4C D1627, 1x16 GB, 64 GB SSD),
      -F9103-A0 (2x16 GB, 128 GB) or -F9104-A0 (8C D1649N, 2x16 GB, 256 GB); which front build
      each SKU ships with is not stated (see the front-build-sku gap).
  b2f:
    kind: orderable
    airflow: back-to-front
    description: >-
      Back-to-front airflow - R4023-F9003-A0, -F9004-A0 or -F9005-A0 (the same three control-plane
      options). QSFP-DD power drops to 24 x 5 W + 8 x 12 W (ports 25-32). No held document shows
      whether the fans or supply latches change colour for this build, so the art is the f2b art
      (see the b2f-finish gap).
    region-context:
      exhaust: Intake
  f2b-2sfp:
    kind: example
    description: >-
      The two-SFP+ front (guide Figure 3, 'DS4000/DS4001 (2x SFP+)'): M1 over M2 at the right of
      the QSFP-DD block. An illustration of a build the guide draws; no SKU is tied to it.
    views: {front: front-2sfp}
  f2b-kr:
    kind: example
    description: >-
      The no-SFP+ front (guide Figure 1, 'DS4000/DS4001 (2x 10GKR)'): both SFP+ positions are
      blank panel and their lanes are routed internally as 10GBASE-KR. An illustration of a
      build the guide draws; no SKU is tied to it.
    views: {front: front-kr}
