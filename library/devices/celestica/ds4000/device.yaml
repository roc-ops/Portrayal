format: 1
kind: device
name: ds4000
version: 0.1.0
maturity: modelled
manufacturer: Celestica
model: DS4000
portfolio:
  family: Data Center Switch
description: >-
  Celestica DS4000 1U 32-port 400GbE data center switch - 32 QSFP-DD in two
  belly-to-belly rows of sixteen, up to two 10G SFP+ management ports (M1/M2)
  beside a vertical console RJ45 / USB-A / management RJ45 stack at the right of
  the front, and at the rear two 1500 W AC supplies (1+1) at either end of seven
  hot-swap fans (6+1). 12.8 Tbps, COMe Xeon D control plane. Sold front-to-back
  (R4023-F9102/F9103/F9104-A0) and back-to-front (R4023-F9003/F9004/F9005-A0).
  The DS4001 is a separate device with a different faceplate.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      DS4000 datasheet (cls_datasheet_DS4000.pdf, 2 pp) for dimensions, interfaces, power, cooling,
      environment, approvals and ordering lines; the DS4000/DS4001 Installation Guide, both as the
      docs-portal HTML pages staged in the intake and as the 49-page PDF revision 1.4.0 (2/2026) at
      www.celestica.com/DS4000-installation-guide-v1, for the specifications table, the three front
      elevations (Product Overview Figures 1-3), the rear elevation (Figure 4), the LED tables, the
      QSFP-DD LED-location figure and table, the QSFP-DD power-class table, the What's in the Box
      SKU tables and the grounding pages; and three vendor product renders for colour and for
      telling the two models apart - the DS4000 datasheet's own three-quarter render (embedded
      1005 x 477 px), and the Foleon product page's ds4001.png (a DS4000-layout render despite its
      name, untextured) and ds4001-side-by-side (the rear). No photograph of a real unit is held,
      and no square-on vendor photo of either face exists on the Foleon page.
  model-split:
    note: >-
      THE GUIDE'S FRONT FIGURES ARE THIS DEVICE, NOT THE DS4001, although they are captioned
      'DS4000/DS4001'. The guide covers both models and draws one front, with the SFP+ position at
      the RIGHT of the QSFP-DD block beside the status lamps. The DS4000 datasheet render and the
      Foleon ds4001.png render both show that layout; the DS4001 datasheet render and the Foleon
      ds4001_front render (pull tab printed 'DS4001') show an SFP+ pair at the LEFT end instead,
      a hexagon-vented face and 'HP' port legends. So the guide front is modelled here and the
      DS4001 is modelled from its own renders. The rear, the LED tables and the specifications
      table are the guide's shared ones and apply to both.
  gate-1:
    confidence: measured
    note: >-
      The guide's front elevations are 1531-1532 x 156 px CAD exports (the same rasters are
      embedded in the PDF at 218 dpi, so the PDF holds no better image). The face spans x 2-1527
      (1526 px) and y 2.5-154.5 (152 px): against 438.5 x 43.1 mm that is 3.4800 px/mm across and
      3.527 down, 1.3 percent apart, the drawn height carrying the lid and base flange lines. The
      rear elevation (1686 x 172) gives 3.8404 and 3.898, 1.5 percent apart in the same
      direction. The figure is ORTHOGRAPHIC by the test that matters: the sixteen QSFP-DD column
      centres (cage outline edges found on dark-column runs at rows 40-68) fit a straight line at
      0.36 px rms (0.10 mm) with a quadratic term worth 0.8 px across the whole row. So x is
      measured at 3.480 px/mm from the left face edge, and y is taken as a fraction of the drawn
      height scaled to 43.1 mm.
  chassis:
    confidence: datasheet
    note: >-
      datasheet and guide specifications table agree - height 43.1 mm (1.73 in, 1 EIA unit), width
      438.5 mm (17.3 in), depth 657.5 mm (25.8 in). 438.5 is the body; the front elevation's face
      measures the same 438.5 at the scale its own cage pitch implies, and the rack brackets
      (R3240-F0301-01, 'ASSY,FIXED BRACKET,L-BRACKET' in What's in the Box) are not drawn. No
      weight is stated in any held document.
  qsfp-layout:
    confidence: measured
    note: >-
      measured - Figure 2 (and identically Figures 1 and 3): sixteen cage columns, outline
      centres at 24.33 + 22.894k mm (k = 0..15), outline width 19.95 mm; top-row cage outline y
      9.33-19.39, bottom-row 22.84-33.14, i.e. 10.06 and 10.3 mm tall and 13.6 mm apart centre to
      centre. std/qsfp-dd@1 (19.0 x 10.0 registry opening) is centred in each outline and the
      outline itself is drawn as a silver cage-shell decor rect 20.0 x 10.3, because the std part
      draws only the opening. Numbering from the legends printed between the rows ('1 up 2 down'
      at column 1 through '31 up 32 down' at column 16): odd ports on the top row, even on the
      bottom, left to right. Rows follow the library stack rule, upper rotate 0 and lower 180; the
      CAD draws the upper cage's latch window at its top and the lower cage's at its bottom, which
      is the belly-to-belly pattern and so needs no exception.
  port-leds:
    confidence: measured
    note: >-
      The guide's QSFP-DD Port LED Locations page: 'Each QSFP-DD port has four tri-color LEDs
      Blue/Green/Amber', with a close-up of port 31 labelling LED1 over LED2 at the cage's upper
      left and LED3 over LED4 at its upper right. Measured on the front elevation at 8x: round
      windows 2.0 mm across at x = column centre -8.0 and +8.0 mm, at y 4.54 and 7.26 above the
      top-row cage and y 35.16 and 37.85 below the bottom-row cage, the same four per port on all
      sixteen columns. Drawn as common/led-dot@1. WHICH window is LED1 for a BOTTOM-row port is
      not shown - the close-up is of an upper port - so the lower port's windows are numbered in
      the same reading order (left column top to bottom, then right), which is an inference. The
      LED table maps each colour to a breakout mode (8x10G through 1x400G); the colours are
      carried as states and the mode table is summarised in the port-leds group description.
  sfp-and-status:
    confidence: measured
    note: >-
      measured - Figure 3 draws two SFP+ cages stacked at x 380.7-396.3 (15.55 wide), y 9.04-19.85
      and 22.68-33.14, one green lamp above the top cage and one below the bottom cage at x
      385.4, and the legend 'M1 up-down M2' between them; Figure 2 draws the top cage only with
      'M1 up'; Figure 1 draws neither. common/sfp-plus-cage@2 (16 x 10) is centred on 388.5. The
      four status lamps are 3.6 mm windows at x 401.9 on a 5.0 mm pitch from y 11.9 (measured
      11.88, 16.84, 21.80, 26.93, set on one pitch), their legends set diagonally at about 60
      degrees to their left. The legends read STAT, FAN, PWR, ALM at 14x zoom - the artwork's
      words; the guide's Table 1 signs them SYS, ALM, PSU, FAN in a different order. The lamps
      carry Table 1's meanings matched by function and the silkscreen carries the artwork's words.
  mgmt:
    confidence: measured
    note: >-
      measured - a silver plate at x 406.9-423.8, y 6.73-38.63 holding, top to bottom, an RJ45
      with its latch keyway UP (console: the 'IOIOI' legend beside it, and the guide's Connecting
      a Console page), a USB-A (USB 2.0 host, data only - Product Overview note), and an RJ45 with
      its keyway DOWN and two lamp windows in its lower corners (management; network symbol
      beside it). Jack openings 12.9 mm wide, matching std/rj45-ganged@2's 12.7 cell rather than
      the 15.8 mm single housing; the console is rotate 180 because the std part draws the keyway
      down. The USB is USB 2.0 (guide port table), so std/usb-a@1 is seated with its usb2 skin. To their right a vertical pull-out lug tag (celestica/lug-tag@1, turned on end) in a slot, x 430.5-433.5, y 16.1-39.3.
      The 'Celestica' wordmark over the plate is not in the CAD; it is printed there on the
      DS4000 datasheet render and the DS4001 render, set here as plain text, not a logo.
  vents:
    confidence: measured
    note: >-
      The CAD face is perforated almost everywhere there is no port. Drawn cell by cell as dark
      rects in the CAD's own shape: three 3.0 mm square cells between each column's lamp pairs,
      above the top row (y 3.9-6.9) and below the bottom row (y 35.3-38.3), at column centre
      -5.5, -1.55 and +2.4 mm (measured on column 1 at 8x and repeated on the pitch); a
      three-column grid of cells at the left end (x 1.0-12.3, nine rows on 4.0 mm) and one
      column at the right end (x 434.6-437.2). The cell grid at the ends is regularised - the
      CAD's cells there vary in width - and the rows of small cells along the lid and base
      edges and around the SFP and lamp area are not drawn. The small coloured vertical pips
      the CAD draws between cage columns are left out: no held document says what they are.
  colour:
    confidence: photo-measured
    note: >-
      photo - the DS4000 datasheet render shows a BLACK face with white legends and silver cage
      shells; the guide's light grey is CAD shading. Chassis sheet metal is light grey in every
      render. So chassis.color is the sheet metal (#c4c8cc, which the top, bottom, sides and the
      rear frame between the modules wear - the rear webs are grey in the guide CAD and silver in the
      DS4001 rear render), and the black front bezel is a full-face decor rect under everything
      else on the front, since a view carries no colour of its own.
  rear:
    confidence: measured
    note: >-
      measured - Figure 4 at 3.8404 px/mm across, 3.898 down. Left to right: a chassis strip x
      0-10.9 carrying an earth symbol at y 16.4 and two pan-head screws with copper washers at y
      24.2 and 33.35 (the Grounding page: 'Attach grounding bracket to designated location on
      the chassis using the provided hardware', and its figure shows exactly these two screws
      taking the bracket); PSU2 at x 10.95-66.15; a web printed 'PWR2' with a triangle pointing at
      it; seven fans on 43.96 mm from x 70.21, each followed by a web printed 'FANk' with a
      triangle pointing LEFT at the fan it names, so FAN7 is leftmost and FAN1 beside PSU1; PSU1
      at x 377.3-432.5, and 'PWR1' in the 6 mm strip after it. Both supplies face the same way
      (not mirrored). The module geometry is on celestica/psu-1500-ac@1 and celestica/fan-40@1.
      An independent reading of the same guide's rear callout by the DS4100 modeller put the
      PSUs at 10.5-66.4 and 377.2-432.9 and the fans at 70.5 + 44.02k, within 0.4 mm.
  views:
    confidence: estimated
    note: >-
      TOP: y = 0 is the REAR (house convention). The guide's isometric (Product Overview, first
      figure) and all three renders show two perforated fields on the lid - one against the left
      edge a little forward of mid-depth, one against the right edge a little behind it - rows of
      perforation along both side edges of the front third, and a recessed lid-release plate in
      the rear third on the centreline. Their positions are FRACTIONS off a perspective
      isometric and are estimated; the triangular fields are drawn as rectangles. BOTTOM carries
      the library's compliance-sticker placeholder, position estimated. LEFT (x = 0 is the rear)
      and RIGHT (x = 0 is the front) carry four rail fasteners each at estimated positions - the
      isometric shows a row of fasteners along the side, and the Chassis Installation page
      secures the outer rail bracket with M4 screws, but no figure dimensions them.
  power:
    confidence: datasheet
    note: >-
      datasheet - '1100W peak consumption with 12W QSFP-DD, 1+1 redundant, hot swap PSUs';
      '100-240VAC auto-ranging, 47-63Hz or 180-300VDC auto input'. The 1100 W is the vendor's
      figure with its own scope ('with 12W QSFP-DD', i.e. optics fitted) and is carried as
      power-max-w with envelope fully-configured;
      it is not reconciled against the supplies. PSU rating 1500 W each (What's in the Box).
  port-power:
    confidence: datasheet
    note: >-
      guide, QSFP-DD Port Power Outputs - front-to-back builds 28 x 15 W + 4 x 20 W (ports 1, 2,
      31, 32 at 20 W); back-to-front builds 24 x 5 W + 8 x 12 W (ports 25-32 at 12 W). The DS4000
      datasheet says 'Up to 12W in Back to Front airflow' and 'Up to 20W in Front to Back
      airflow', which agrees.
  environment:
    confidence: datasheet
    note: >-
      The datasheet and the guide state different operating envelopes and both are carried: the
      datasheet 'Temperature: 0 C to 45 C @ 900m, Humidity: 5% to 90% non-condensing'; the
      guide's specifications table 'Operating Temperature (airflow front to back) 5 - 40 C',
      the same for back to front, 'Operating Relative Humidity 40 - 60 %', 'Storage Relative
      Humidity 5 - 95 %'. The operating-temp attr takes the datasheet's; the guide's narrower
      figures are in operating-temp-guide and operating-humidity-guide.
  lifecycle:
    note: >-
      searched 2026-09-26 for a DS4000/DS4001 end-of-life or end-of-sale announcement; none found.
      The Foleon product page, both datasheets and the documentation portal are live and the
      guide was revised in 2/2026.
attrs:
  performance:
    switching-capacity: 12.8 Tbps
    packet-buffer: 64 MB
    latency: less than 700 ns port to port (cut-through)
  power:
    power-max-w: 1100
    power-envelope: fully-configured
    input-ac: 100-240 VAC auto-ranging, 47-63 Hz
    input-dc: 180-300 VDC auto input
    psu-redundancy: 1+1 hot-swappable, 1500 W each
  thermal:
    fan-redundancy: 6+1 hot-swappable
    port-power-f2b: 28 x 15 W + 4 x 20 W (ports 1, 2, 31, 32)
    port-power-b2f: 24 x 5 W + 8 x 12 W (ports 25-32)
  environmental:
    operating-temp: 0 to 45 C at 900 m
    operating-humidity: 5 to 90% non-condensing
    operating-temp-guide: 5 to 40 C, either airflow
    operating-humidity-guide: 40 to 60% RH
    storage-humidity: 5 to 95% RH
    mtbf: in excess of 150,000 hours
  platform:
    cpu: Intel Xeon D-1627 4-core or D-1649N 8-core on a COMe module (per SKU)
    memory: 16 or 32 GB DDR4 ECC (per SKU)
    storage: 64, 128 or 256 GB M.2 SSD (per SKU)
    bmc: BMC management option (DDR3, SPI flash dual boot, NC-SI shared port, IPMI 2.0)
  features:
    breakout: >-
      144 sub-rate ports maximum (10/25/50GbE) or 128 at 40/100GbE using breakout cables
    timing: IEEE 1588 1-step and 2-step, TC and BC, SyncE (timing option)
    optics-qsfp-dd: >-
      10GBASE-CR/SR/LR/ER, 25GBASE-CR/SR/LR/ER, 40GBASE-CR4/SR4/LR4/ER4, 100GBASE-CR4/SR4/LR4/ER4/DR1/PSM4/CWDM4,
      400GBASE-CR4/SR4/FR4/DR4/LR8 (guide Port Descriptions); DAC up to 3 m (datasheet)
    optics-sfp-plus: 10GbE (guide Port Descriptions)
  management:
    console: RJ45 RS-232, 115200 8N1, flow control XON/XOFF (labelled IOIOI)
    oob: RJ45 10/100/1000, CPU/BMC shared
    usb: USB 2.0 host type A, data only (does not supply power)
  compliance:
    emc: CN (GB9254-2008), EU (EN55022, EN55024), FCC, VCCI
    safety: IEC60950-1, GB4943, UL/CSA, CB
  lifecycle:
    eol: none-announced
chassis:
  width: 438.5
  height: 43.1
  depth: 657.5
  ru: 1
  color: '#c4c8cc'
  airflow: front-to-back
  power: ac
gaps:
- what: front-build-sku
  scope: [sfp-plus-mgmt, f2b-2sfp, f2b-kr]
  reason: vendor-silent
  note: >-
    The guide draws three fronts (2x 10GKR, 1x SFP+ plus 1x 10GKR, 2x SFP+) and lists six
    chassis SKUs whose descriptions differ only in CPU, memory, SSD and airflow. Nothing held ties
    a front to a SKU. The base follows the datasheet render (one SFP+); the other two are
    `example` configurations.
  wanted: a Celestica ordering guide or SKU description naming the SFP+ build
- what: b2f-finish
  scope: [fans, psus, b2f]
  reason: needs-photo
  note: >-
    The only rear render held is of a DS4001 (black fans, blue latches, orange PSU latches) and its
    airflow is not stated. The DS4100 rear, from the same vendor, is orange-faced, which may be an
    airflow colour code; no held DS4000/DS4001 document says so.
  wanted: a rear photograph of each airflow build
- what: system-led-signs
  scope: [status-leds]
  reason: sources-disagree
  note: >-
    The artwork prints STAT, FAN, PWR, ALM top to bottom; the guide's Front Panel Status LEDs
    table signs the same four SYS, ALM, PSU, FAN. The silkscreen follows the artwork and each lamp
    takes the table row for its function.
  wanted: a front photograph of a DS4000
- what: psu-and-fan-part-numbers
  scope: [psus, fans]
  reason: vendor-silent
  note: >-
    No held document names the FRU part numbers of the 1500 W supply or the fan module; the
    components are named for their form (celestica/psu-1500-ac, celestica/fan-40).
  wanted: a Celestica FRU list
- what: asic
  scope: [qsfpdd-400g]
  reason: vendor-silent
  note: >-
    Neither the DS4000 datasheet nor the guide names the switching silicon. Distributor pages
    (Stordis) name Broadcom Tomahawk 3; that is not a Celestica document and is not carried as an
    attr.
  wanted: a Celestica document naming the ASIC
groups:
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
  sfp-plus-mgmt:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      the M1/M2 SFP+ position at the right of the QSFP-DD block - 10GbE per the guide's port
      table. Built as one SFP+ (M1, the datasheet render's build), two (Figure 3) or none, the
      lanes then routed internally as 10GBASE-KR (Figure 1); see the configurations.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management stack - RS-232 console RJ45, USB 2.0 host port and the CPU/BMC shared
      Ethernet management RJ45, on one silver plate
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the four chassis lamps - STAT, FAN, PWR, ALM
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      four tri-colour lamps per QSFP-DD port (LED1-LED4, one per lane group in a 4-way breakout)
      and one per SFP+. Guide LED table: 8x10G amber (or white), 8x25G green (or white), 2x40G
      amber on LED1 and LED3, 4x40G amber, 4x50G green, 8x50G blue (or white), 2x100G green on
      LED1 and LED3, 4x100G blue, 2x200G blue on LED1 and LED3, 1x400G blue on LED1.
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: '1+1 - What''s in the Box describes every DS4000 chassis SKU with ''2X1500W AC PSU'', and the DS4000 datasheet says ''1+1 redundant, hot swap PSUs''; two bays at the rear ends'
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '6+1'
      redundancy-note: '6+1 - DS4000 datasheet, Power and Cooling: ''6+1 redundant fans, front to back and back to front system cooling''; seven bays, and the SKU descriptions say ''7 FAN'''
  grounding:
    term: Point
    role: furniture
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
