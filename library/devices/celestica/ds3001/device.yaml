format: 1
kind: device
name: ds3001
version: '0.1.1'
maturity: modelled
manufacturer: Celestica
model: DS3001
description: >-
  Celestica DS3001 - 2RU 64 x 100G QSFP28 data-center switch (sixteen columns of 2-high stacked
  cages) with two SFP+, an RJ-45 management / USB / console stack and a reset button at the right,
  and two 1300 W CRPS supplies and four hot-swap fan trays on the rear; front-to-back, back-to-front
  and DC builds.
profile: networking
provenance:
  sources:
    confidence: drawing
    note: >-
      THE DOCUMENTATION PORTAL'S FRONT AND REAR ELEVATIONS ARE ORTHOGRAPHIC CAD RENDERS WITH THE
      PANEL PRINTING ON THEM, and they are the model. The DS3001 installation guide on
      documentationportal.celestica.com draws the front (Front Panel, Figure 1,
      ds3001--front-panel-1.jpg, 3840 x 1953) and the rear (Rear Panel, Figure 1,
      ds3001--rear-panel-1.jpg, 3840 x 2375) of a shipping build: black front, every port numeral,
      the lamp legends, MGMT / CONSOLE / RST and the LUG TAG legend are all legible at 5.4 px/mm.
      The fan-removal and PSU-removal figures (7680 px wide three-quarter renders) confirm
      construction, and the vendor product page (cls.celestica.com/hardware-platforms/ds3001/)
      serves two three-quarter renders, staged as photos/ds3001-A.png and ds3001-AA.png, which agree
      on every feature and were not measured. The datasheet (ds3001-datasheet.pdf) carries
      dimensions, power and ordering codes; the guide's What's in the Box table adds a DC build.
  gate-1:
    confidence: measured
    note: >-
      BOTH ELEVATIONS PASS AT ONE SCALE PER FACE. Front: the black body spans x 847.5-3232.5 px and
      y 703-1177 (the lower lip included), 2385 x 474 px - aspect 5.032 against the datasheet's
      438.5 x 87 = 5.040, 0.2% - so 5.4390 px/mm on both axes. Rear: x 510.5-3368.5, y 836.5-1403.5,
      2858 x 567 px, aspect 5.0406 against 5.0402 - 6.5177 px/mm. THE FRONT SCALE IS PROVED BY A
      SECOND QUANTITY IT DID NOT USE: every QSFP opening's dark interior reads 101 px across, 18.57
      mm against std/qsfp-ganged@1's 18.5. The ears (with their pull handles) stand outside both
      bodies and are not drawn.
  port-block:
    confidence: measured
    note: >-
      SIXTEEN COLUMNS, EACH TWO 2-HIGH STACKED CAGES. The bright perforated band between each
      stack's two openings segments cleanly on row 862 (8-row mean): sixteen 105-106 px runs centred
      972.5, 1101, 1230, 1359, 1487.5, 1616.5, 1745.5, 1874.5, 2003.5, 2132.5, 2261.5, 2390, 2519,
      2648, 2776.5, 2905.5 px, a linear fit giving first column 22.93 mm and pitch 23.698 mm, worst
      residual 0.06 mm. Down column 940 px the upper stack's frame runs 801-936 px and the lower's
      961-1096; aperture centres read 827, 909.5, 986.5 and 1069.5 px, 22.80, 37.97, 52.12, 67.38
      mm. Each stack is a silver cage body 19.5 x 24.8 mm with the perforated EMI band between its
      apertures; std/qsfp-ganged@1 draws only an opening, so the body and the band are panel decor
      under each pair, as ufispace/s9311-64d draws its 2-high QSFP-DD stacks.
  port-numbering:
    confidence: photo-measured
    note: >-
      Read off the front render, which prints every number: each column carries two lamp rows above
      its upper stack numbered N and N+1 (1 and 2 on the first column) and two below its lower stack
      numbered N+32 and N+33 (33 and 34), and the band between the two stacks reads '1 (barred up) 2
      (up)(down) 33 (barred down) 34'. So down each column the four ports are 2c+1, 2c+2, 2c+33,
      2c+34 - the upper stack carries 1-32 and the lower stack 33-64. The barred triangles are drawn
      as a triangle with a stroked bar; each numeral and triangle is its own mark at its measured
      offset from the column centre.
  stack-orientation:
    confidence: estimated
    note: >-
      DECIDED BY THE RULE, AND THE RENDER MAY SAY OTHERWISE. The library's stack convention
      (docs/pluggables-3d-design.md, S1-S4) is applied to every stack: upper cage upright (rotate 0)
      over the lower turned 180. THE RENDER READS DIFFERENTLY, AND COHERENTLY. At 20x on column 1
      the upper stack draws its connector card slot at the BOTTOM of both openings, with the latch
      windows along the stack's top edge; the lower stack is the same drawing turned over -
      connector slots at the TOP of both openings, windows along its bottom edge. On the DS3000's
      render a connector-at-bottom cage is the upright (rotate 0) one, so read that way ports 1 and
      2 are both upright, 33 and 34 both inverted, the two STACKS are belly-to-belly about the
      printed band, and every bail faces outward - which is how a 2x1 stacked QSFP connector is
      built. That is a reading of the connector slot and the window rows, not of the cage lip
      itself, and only a lip or tab reading may override the rule, so the rule is drawn and the
      reading is the stacked-cage-orientation gap for the reviewer. The SFP+ pair is mirrored in the
      render (upper slot at the bottom, lower at the top) and follows the rule without question.
  port-lamps:
    confidence: measured
    note: >-
      FOUR LAMPS PER QSFP28 PORT, in a row beside the port's printed number. Column 940 crosses port
      1's row at y 766 px and port 2's at 786, and port 33's and 34's at 1110.5 and 1130, 11.58,
      15.26, 74.92, 78.51 mm; port 1's four lamps read 940, 961.5, 982.5 and 1004 px across, a 3.93
      mm pitch centred on the column. The guide's Table 3: 1x100G uses the first lamp, 2x50G the
      first and third, 4x25G all four, green; 40G / 4x10G amber; blinking with traffic. Lane 1 is
      taken as the left lamp. common/led-dot@1 is the part.
  sfp-plus:
    confidence: measured
    note: >-
      TWO SFP+ CAGES STACKED BETWEEN THE PORT BLOCK AND THE MANAGEMENT CLUSTER, numbered 65 over 66:
      centres x 398.33, y 38.70 and 51.57 (frames 886-941 and 957-1010 px), each lamp a single dot
      beside its numeral, 65 above the pair at y 30.61 and 66 below at 59.57, and '65 (up)(down) 66'
      printed between them. Guide: 2 x SFP+ at 10GbE; Table 3 gives one green lamp each (on = link
      up, blinking = activity).
  management:
    confidence: measured
    note: >-
      ONE STACKED MOULDING, RJ-45 OVER USB-A OVER RJ-45, labelled on the panel MGMT, the USB trident
      and CONSOLE, set on end to its left and reading upward. Shell x 3113.75-3203 px, y
      778.75-952.5 (16.4 x 31.9 mm); the upper jack 782.5-845, the USB 850-881, the lower jack
      885-950. The upper jack carries two green lamps along its top edge with its latch keyway at
      the top, which is common/rj45-eth@1 turned 180 (the std housing draws its keyway at the bottom
      when unturned); the console's keyway is at the bottom, std/rj45@2 unturned. Both were checked
      against the render at 7x after placing. Guide: 10/100/1000Base-T Ethernet, an RJ-45 serial
      console (9600 and 115200 baud, 8-N-1), a USB 2.0 host Type-A that 'cannot be used for charging
      devices', and a reset button - 'press for about 5 seconds and then release' to restart without
      removing power.
  status-lamps:
    confidence: measured
    note: >-
      FOUR LAMPS AND THE RESET PINHOLE IN ONE COLUMN at x 410.92, labelled FAN, PSU, ALM, STAT and
      RST top to bottom (text on end, reading upward, to their left): centres y 10.94, 17.37, 23.81,
      30.24 and the reset at 37.83, read at 4x on the render. Guide Table 1 agrees on the four: FAN
      and PSU green / amber / off, ALM green / amber and amber at 1 Hz and 4 Hz, STAT green-amber
      alternating.
  vents:
    confidence: measured
    note: >-
      Three perforations, each drawn as the individual openings the render shows rather than as a
      pattern: a row of 101 shallow notches along the top edge (bright runs on row 714 px, about 2.2
      x 1.8 mm on a 4.0 mm pitch) with 76 dark slots under them (row 735, 2.9 x 2.8 mm, from x 1020
      px so they stop short of the wordmark), a row of 77 slots near the bottom edge (dark runs on
      row 1151, about 3 x 2.2 mm) with 94 notches in the bottom lip under them (row 1174), and a 9 x
      11 grid of 1.84 mm square holes on a 3.0 mm pitch below the management stack (x 3077.7-3208
      px, y 969.5-1133.5). The cavity depths are not measured.
  wordmark-and-tag:
    confidence: measured
    note: >-
      'Celestica' is printed top left as a text wordmark (set as sans-serif text; no logo mark is
      drawn). The LUG TAG legend sits to the right of the pull tab at the bottom right, which is
      celestica/lug-tag@1 printed DS3001, x 3019-3143 px and y 1149-1171. It is seated unturned, so
      the text reads left to right as printed and the part's grip end lands on the right. The render
      cannot confirm the grip end: at 8x the card is a symmetric paddle, stepping out of its slot
      equally at both ends, with no lip drawn at either end.
  rear:
    confidence: measured
    note: >-
      TWO SUPPLIES ON END AT THE LEFT, FOUR FAN TRAYS. At 6.5177 px/mm the supplies' faces run x
      552-806 and 823-1077 px between dark seams, y 901-1381 - 39.0 x 73.5 mm, the CRPS face on end
      - at 6.37 and 47.95; their green lamps read 611 and 882.5 px across at 925 down. A legend
      strip above them prints a power mark, '1' or '2' and an open down-triangle for each. The fan
      trays' faces start at 1109, 1662, 2214 and 2770 px (91.83, 176.67, 261.37, 346.67 mm), 79.9
      wide on an 84.85 mm pitch, y 859-1387. At the right-hand end an earth symbol at y 50.4 over
      two hex-nut ground studs at y 69.3 and 78.0, x 432.1. The datasheet: '1+1 redundant, hot swap
      PSUs, 1300W each', '3+1 Redundant/Hot-Swappable Fans, front to back and back to front
      airflow'; the guide numbers the rear lamps P-1 / P-2 and FAN1-FAN4.
  rear-numbering:
    confidence: estimated
    note: >-
      The supplies are numbered as printed, 1 left and 2 right. The fan trays carry no legible
      number on the render; they are numbered 1 to 4 from the left as seen from behind, the same way
      as the supplies. A reading of the real rear overturns it.
  power:
    confidence: datasheet
    note: >-
      No chassis consumption figure is published in the datasheet or guide; only the supplies' 1300
      W output each, and the input: AC 47-63 Hz, 100~127 V / 200~240 V nominal (datasheet), 100-240
      VAC (guide), 240 VDC in China only (guide). The DC build R3250-F9103-A1 ('DC PSU 2x1300W') is
      in the guide's What's in the Box table and has no drawing.
attrs:
  performance:
    switching-capacity: 6.4 Tbps
    packet-buffer: 70 MB
    latency: low-latency cut-through mode support
  power:
    power-envelope: unstated
    input-ac: 'AC 47-63 Hz, 100~127 V / 200~240 V nominal (datasheet); 100-240 VAC (guide)'
    input-hvdc: '240 VDC, China only (guide)'
  thermal:
    fans: >-
      3+1 redundant hot-swap fan trays, front-to-back or back-to-front (four in the standard
      configuration)
  environmental:
    operating-temp: '0 to 45 C at 900 m (datasheet); 15-35 C long term, 0-45 C short term (guide)'
    humidity: '5% to 90% non-condensing (datasheet); 40-65% long term, 10-90% short term (guide)'
  platform:
    cpu: 'Intel Denverton / Hewitt Lake-DE, 4 or 8 core, on a COM-Express module'
    memory: up to 32 GB ECC DDR4
    storage: up to 1 TB M.2 SSD
    bmc: 'BMC with 1 GB DDR4, dual 32 MB flash, NC-SI shared management port, IPMI 2.0'
    nos-installer: ONIE
  features:
    breakout: >-
      each QSFP28 splits to 4x25G; system maximum 168 x 10/25GbE, physically 128 x 50GbE or 64 x
      100GbE (datasheet)
    transceiver-power: QSFP28 modules up to 5 W; DAC to 5 m (guide) or 3 m (datasheet)
    optics-qsfp28: >-
      guide Port Description: 100GBASE-CR4/SR4/LR4 and 40GBASE-CR4/SR4/LR4, any QSFP28-compliant
      module up to 5 W; qualified list Avago AFBR-89CDDZ and Innolight TR-FC85S-N00 (100GBASE-SR4),
      Molex and TE DAC at 1, 3 and 5 m
    optics-sfp-plus: 10GbE (guide Port Description); no module list
  management:
    console: 'RJ-45 serial, 9600 and 115200 baud, 8-N-1; cable G400-10199-01 RJ45 to DB9'
    usb: 'USB 2.0 host, Type A, not for charging'
  compliance:
    acoustic: EN300753
    weee: Directive 2012/19/E (as printed)
    rohs: '2011/65/EU & 2015/863'
    reach: (EC) No. 1907/2006
    emc: 'Class A - USA, Canada, Europe, China, Japan'
    safety: UL/CSA/IEC/EN 60950-1/62368-1
    psu-approvals: 'CE, CCC, KC, TUV, UL/cUL, BIS and BSMI'
  lifecycle: {eol: none-announced}
chassis: {width: 438.5, height: 87.0, depth: 520.0, ru: 2, color: '#c3c7cb'}
gaps:
- what: stacked-cage-orientation
  scope: [front]
  reason: needs-photo
  wanted: >-
    Whether each 2-high QSFP28 stack is belly-to-belly (the library rule, drawn: 2c+1 at 0, 2c+2 at
    180, 2c+33 at 0, 2c+34 at 180) or, as the render reads, both ports of a stack the same way up
    with the two stacks mirrored (2c+1 and 2c+2 at 0, 2c+33 and 2c+34 at 180). A photograph of the
    cage lips, or of modules seated in one stack, settles it; if the render's reading is confirmed
    the change is sixty-four rotations and a stack-exceptions entry.
- what: dc-build
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    The DC supply of R3250-F9103-A1 (2U, 64x100GbE, DC PSU 2x1300W, F2B). No figure of it is held,
    so no DC supply part exists and the build is declared without one.
- what: fan-and-psu-power
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    Per-fan draw and a chassis consumption figure. Neither document gives either.
- what: airflow-finish
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    How the F2B and B2F builds differ on the outside. Every render held shows orange fan latches and
    nothing says which airflow that is.
- what: psu-legend-mark
  scope: [rear]
  reason: needs-photo
  wanted: >-
    The small power symbol printed before each supply's number in the legend strip is about 1.5 mm
    across on the render and is not drawn; the numeral and the triangle are.
- what: side-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, underside and side walls; only three-quarter renders show them.
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the sixty-four QSFP28 ports, sixteen columns of two 2-high stacks: 1-32 in the upper stacks
      and 33-64 in the lower, two to a stack, numbered along the columns left to right.
    attrs: {media: qsfp28, speed: 100g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the two SFP+ cages, 65 over 66, stacked right of the port block.
    attrs: {media: sfp-plus, speed: 10g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  status-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band stack at the right-hand end - a 10/100/1000 RJ-45 management port over a USB
      2.0 Type-A over an RJ-45 serial console in one moulding, and the reset button beside it.
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs: {redundancy: 1+1, redundancy-note: 'datasheet: 1+1 redundant, hot swap PSUs, 1300W each'}
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs: {redundancy: 3+1, redundancy-note: 'datasheet: 3+1 Redundant/Hot-Swappable Fans'}
  grounding: {term: Point, role: furniture, index-origin: 1}
  furniture:
    term: Item
    role: furniture
    index-origin: 1
    description: the pull-out lug tag and the printed port-type marks
