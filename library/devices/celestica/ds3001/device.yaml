configurations:
  f2b:
    kind: base
    default: true
    airflow: front-to-back
    power: ac
    description: >-
      R3250-F9101-A0: DS3001, 2U, 64x 100GbE, COMe 4C/16GB-DDR/64GB-SSD, front-to-back airflow, two
      1300 W AC supplies and four fan trays (datasheet ordering information and the guide's What's
      in the Box).
    part-numbers: {R3250-F9101-A0: {part: R3250-F9101-A0}}
  b2f:
    kind: orderable
    airflow: back-to-front
    power: ac
    description: >-
      R3250-F9102-A0: the same, back-to-front airflow. How its fans and supplies differ on the
      outside is not documented (airflow-finish gap).
    part-numbers: {R3250-F9102-A0: {part: R3250-F9102-A0}}
  dc-f2b:
    kind: orderable
    airflow: front-to-back
    power: dc
    description: >-
      R3250-F9103-A1: 2U, 64X100GBE, DC PSU 2x1300W, COMe 4C/16G DDR4/64G SSD, F2B (guide What's in
      the Box). NO DC SUPPLY IS DRAWN - no figure of it is held - so this build still seats the AC
      part in the drawing; see the dc-build gap.
    part-numbers: {R3250-F9103-A1: {part: R3250-F9103-A1}}
references:
- title: >-
    Celestica DS3001 Installation Guide, documentationportal.celestica.com/en/networking/ds3001
- {title: Celestica DS3001 2U 64-Port 100GbE Data Center Switch datasheet}
- {title: 'Celestica DS3001 product page, cls.celestica.com/hardware-platforms/ds3001/'}
