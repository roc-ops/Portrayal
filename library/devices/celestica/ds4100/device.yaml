configurations:
  ac-f2b:
    kind: base
    default: true
    description: >-
      Two 1500 W AC supplies, front-to-back airflow - the build every figure draws, with orange fan modules.
    component-attrs:
      fan-40: {face-finish: '#dd8817', handle-finish: '#dd8817', latch-finish: '#dd8817'}
      psu-1500-ac: {latch-finish: '#1f2124'}
    part-numbers:
      R4035-F9001-A1: {part: R4035-F9001-A1}
  ac-b2f:
    kind: orderable
    airflow: back-to-front
    description: >-
      Two 1500 W AC supplies, back-to-front airflow. No document draws this build, so it is drawn like
      the F2B one; see the b2f-finish gap.
    region-context: {exhaust: Intake}
    component-attrs:
      fan-40: {face-finish: '#dd8817', handle-finish: '#dd8817', latch-finish: '#dd8817'}
      psu-1500-ac: {latch-finish: '#1f2124'}
    part-numbers:
      R4035-F9005-A1: {part: R4035-F9005-A1}
