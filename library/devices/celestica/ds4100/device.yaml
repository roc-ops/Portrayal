format: 1
kind: device
name: ds4100
version: 0.1.0
maturity: modelled
manufacturer: Celestica
model: DS4100
description: >-
  Celestica DS4100 - a 1RU 16-port 800G data-centre switch: sixteen OSFP ports in two blocks of four stacked
  columns across the middle of a black front panel, a stacked pair of 10G SFP+ management cages (M1/M2)
  to their left, and at the right four system lamps beside one silver housing that stacks an RJ45 console,
  a USB 3.0 Type-A and an RJ45 1000BASE-T management port. The rear carries two 1500 W hot-swap AC supplies
  at the ends and seven hot-swap orange fan modules between them (6+1). A COM-E x86 control plane, an
  optional RunBMC and 12.8 Tbps of switching.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Two documents and two vendor renders. The DS4100 installation guide (Celestica documentation portal,
      HTML, release 1.3.1 3/2026) carries the System Specifications table, a front elevation and a rear
      elevation (system-overview-1/-3, 2.3-2.5 px/mm), a Front Panel Callouts figure with the LED and
      port tables, a Rear Panel Callouts figure with its LED table, the What's in the Box SKU table and
      the Ground Lug Installation photographs. The DS4100 datasheet carries the features, power, dimensions
      and approvals. cls.celestica.com/hardware-platforms/ds4100/ serves two three-quarter renders (front,
      and front+rear side by side), saved as working/intake/celestica/photos/ds4100-A.png and -AB.png;
      they are perspective and are used only for colour, counts and legends, never for position.
  gate-1:
    confidence: measured
    note: >-
      BOTH CALLOUT FIGURES ARE ORTHOGRAPHIC. The Front Panel Callouts figure's dark face box reads 1789
      x 176 px (x 20-1808, y 196-371) against the stated 438.5 x 43.1 mm: aspect 10.165 against 10.174,
      0.09% out, 4.080 px/mm across and 4.083 down. The Rear Panel Callouts figure reads 1710 x 169 px
      (x 15-1724, y 111-279), aspect 10.118, 0.55% out, 3.900 and 3.921 px/mm. Both are about 1.7x the
      resolution of the System Overview elevations of the same faces (2.34 and 2.50 px/mm), so every position
      on this device is read off the two callout figures. The side thumbscrew knobs drawn beyond both
      ends of the front are outside the body box and are not modelled; no ear is drawn.
  the-osfp-wall:
    confidence: measured
    note: >-
      TWO BLOCKS OF FOUR STACKED COLUMNS. The bright cage walls inside the openings, profiled across the
      face at y 8, 12, 16, 28 and 34 mm, put the inner dividers of block 1 at 144.49, 167.66 and 190.94
      and of block 2 at 245.85, 269.13 and 292.36 - an in-block pitch of 23.24 (23.225 and 23.255 per
      block) and a block pitch of 101.48, which leaves an 8.5 mm gutter between blocks. Column 1 is centred
      at 132.87. The aperture rows read 6.12-19.10 and 24.98-37.96 on a vertical profile through column
      1, so 12.98 mm tall against std/osfp@1's 23.1 x 13.5 registry-drawn aperture, which is seated centred
      on each (the part owns the aperture, the device owns the pitch, as on edgecore/ais800-32o). Row
      pitch 18.86. At 4.08 px/mm every figure here is good to about a quarter of a millimetre. NUMBERING:
      the panel prints `1 (up) (down) 2` between each column's two cages and on to `15 (up) (down) 16`,
      so odd ports are the upper row and even the lower, numbering left to right. Upper cages are rotate
      0 and lower 180, the library's belly-to-belly rule (L108) - the drawing is consistent with it (each
      cage's dark latch notches hang into the band between the rows) but that is the rule, not a separate
      reading.
  legends:
    confidence: measured
    note: >-
      Read on the Front Panel Callouts figure and confirmed as printed on the three-quarter render: `N
      (up)(down) N+1` centred on each column in the band between the rows, digits about 1.6 mm tall (cap)
      - column 1's spans x 129.2-136.2 centred 21.9; `M1 (up)(down) M2` between the SFP+ cages; SYS, FAN,
      PSU and ALM to the left of the four system lamps; CONSOLE, the USB SuperSpeed mark and MGMT printed
      vertically to the right of the management housing, reading bottom to top; LUG TAG above the pull-out
      tag; and the Celestica wordmark as plain text at upper left (x 17.5-40.5). The SS mark is drawn
      as the letters SS only - the trident beside it is not drawn. The triangles are drawn as ink, not
      lamps: they are the same white as the numerals on both the figure and the render, and the SFP+ legend
      carries the same triangles while its lamps are separate green domes.
  the-sfp-pair-and-its-lamps:
    confidence: measured
    note: >-
      A stacked 1x2 SFP cage at x 93.63-108.58, frames y 10.29-20.82 and 23.26-33.55; std/sfp@1 (14.5
      x 10) is centred on each, upper 0 and lower 180. One green lamp above (98.17, 7.72) and one below
      (98.17, 36.61), each 2.2 mm across - common/led-dot@1. The guide's callout names them "Indicator
      LED - SFP28" and the LED table's SFP+ rows give Green 10GbE / Amber 1GbE, on and blinking. The upper
      lamp is taken as M1's and the lower as M2's by position; no document says so. THE FIGURE ALSO DRAWS
      A GREY DOT at (104.3, 7.6), right of the upper lamp, 1.8 mm across. The render shows a vent cell
      there, not a dot. It is not drawn; see the grey-dot gap.
  the-management-housing:
    confidence: measured
    note: >-
      ONE SILVER HOUSING, x 328.4-345.2 by y 7.4-40.0, stacking console (top, latch slot up), USB Type-A
      (middle) and MGMT (bottom, its latch slot and lamps at the bottom) - the guide's callout: "Top -
      1 x Console, Middle - 1 x USB Type A 3.0, Bottom - 1 x Ethernet RJ45". The housing is panel decor
      (the metal shell the jacks sit in); the jacks are std/rj45-ganged@2 cells (12.7 x 11.0, which is
      what a stacked shell's cells measure - about 11 mm per jack here) and std/usb-a@1, centred on the
      housing at x 336.8. the console cell is turned 180 so its latch slot is at the top, as drawn, and
      MGMT is common/rj45-ganged-eth@1 upright, whose lamps sit in the latch-side (bottom) corners, where
      the figure draws two small light squares; the LED table names them (right: green 1000M / amber 10-100M;
      left: green link / blinking activity).
  the-system-lamps:
    confidence: measured
    note: >-
      Four green domes 3.4 mm across at x 324.15, y 12.25, 17.39, 22.53 and 27.68 - a 5.14 mm pitch. common/led-indicator@1
      (4 x 4, 2 mm lamp) is seated on the centres. States from the guide's LED Descriptions table: SYS
      green/amber alternate blinking = normal, off = no power; FAN and PSU green = all normal, amber =
      one absent or abnormal; ALM green = no alarm, amber = critical, amber 4 Hz = major, amber 1 Hz =
      minor. The alternate green/amber blink is recorded as green blinking; the table gives no rate for
      it.
  vent-fields:
    confidence: measured
    note: >-
      Extents read on the Front Panel Callouts figure: a left column x 1.0-13.4, a two-row strip x 15.0-75.5
      by y 3.0-7.8, a field x 20.8-59.4 by y 15.0-35.6 under the wordmark, a two-row patch x 79.0-92.0
      by y 26.5-31.6 beside the SFP+ cages, and on the right a band x 350-425 by y 1.5-10.5, a field x
      378-416.5 by y 15-35.5 and a column x 424-433. The cells are drawn with the grille pattern (dark
      square cells; the slots pattern paints its cells lighter than this plate) at the measured pitches
      (about 2.45 x 3.0); the true cells are narrower rectangles than the pattern draws, so the texture
      is indicative and the extents are the measurement.
  rear:
    confidence: measured
    note: >-
      Rear Panel Callouts figure at 3.90 px/mm. Two supplies in the SAME orientation (not mirrored): frames
      x 10.5-66.4 and 377.2-432.9, about 55.7 wide and 40.5 tall; each carries a lattice grille at left
      with two lamps at its foot - "!" over a check mark, the callout's "Top - alarm, Bottom - OK" - a
      black U-grip, a C14 inlet turned a quarter and a latch at the far right. Bays are drawn at celestica/psu-1500-ac@1's
      own 55.2 x 39.0 (read by the DS4000 modeller on that guide) centred on the frames measured here.
      Seven orange fan modules: the orange faces at y 3 run 70.52-108.73, 114.63-152.83 ... 334.64- 372.85,
      a 44.02 mm pitch; across the handle bar they read 40.26 wide and top to bottom 2.30 to 40.80. Bays
      use celestica/fan-40@1's 39.3 x 39.0 centred on those. At the far left two round screw heads (x
      5.7, y 24.1 and 33.4, about 5 mm across) - the two M3 holes the Ground Lug Installation page fixes
      the ground-lug bracket to at this corner.
  fans-and-supplies-are-shared-with-the-ds4000:
    confidence: measured
    note: >-
      THE SAME SHAPES, MEASURED ON THIS DEVICE'S OWN FIGURE. celestica/psu-1500-ac@1 and celestica/fan-40@1
      were drawn off the DS4000 guide. Checked against the DS4100 rear here: PSU lamps at module (6.65,
      25.55) and (6.65, 31.75) against the part's (6.5, 25.4) and (6.5, 32.1); the fan lamp at module
      (3.05, 3.55) against (3.7, 3.6); fan pitch 44.02 against 43.96. Faces here measure 0.5 wider than
      the parts on both (55.7 against 55.2, and the orange tray about 40 against 39.3), which is the frame
      gap being read as module at 3.9 px/mm and is recorded, not reconciled. THE FAN IS ORANGE HERE AND
      BLACK ON THE DS4000. Face and handle are sampled at #dd8817 on the figure and on the render; they
      are fan-40's face-finish and handle-finish fields, set by the configuration, not a second part.
      The supplies' latch at the far right is drawn black on this figure where the DS4000 part defaults
      to orange, so latch-finish is set #1f2124 too.
  power:
    confidence: datasheet
    note: >-
      The datasheet's Power and Cooling: "1+1 redundant, hot swap PSUs, 1500W", "AC 47~63Hz, 100~240 V
      nominal, 90~264V max", "6+1 redundant fans, front to back and back to front airflow", "Power consumption,
      Max 1310W". The guide's table repeats 1310 W max. 1310 W is the chassis maximum and is recorded
      as the vendor's figure; it is not reconciled against module draws.
  airflow:
    confidence: datasheet
    note: >-
      The What's in the Box table lists R4035-F9001-A1 (F2B), R4035-F9005-A1 (B2F) and R4035-F9007-A1
      (DC PSU 2x1500W, F2B). Every figure shows the F2B build's orange fans; no document shows what the
      B2F build's trays or latches look like, so the B2F configuration is drawn identically and says so.
  colour:
    confidence: photo-measured
    note: >-
      Front plate #2a2a2a sampled between features on the Front Panel Callouts figure; the three-quarter
      render agrees (black). Rear sheet metal #a7a9ac sampled on the rear figure's left strip.
  lifecycle:
    confidence: datasheet
    note: >-
      Listed as a current platform on cls.celestica.com/hardware-platforms/ds4100/ when fetched on 2026-09-26;
      no end-of-life notice was found there or on the documentation portal, whose guide was last revised
      3/2026.
attrs:
  physical:
    dimensions-note: W 438.5 x D 657.5 x H 43.1 mm (datasheet and guide)
  performance:
    switching-capacity: 12.8 Tbps
    packet-buffer: 56.83 MB integrated SmartBuffer
    serdes: 112G PAM4
    jumbo-frames: up to 9416 bytes
    breakout: 8 x 100GbE, 4 x 200GbE or 2 x 400GbE per 800G port
  power:
    power-draw-max-w: 1310
    psu-rating-note: 1+1 redundant hot-swap 1500 W PSUs
    input-ac: AC 100 ~ 127 V / 200 ~ 240 V nominal (90-264 V max) at 47-63 Hz
  thermal:
    airflow-options: front-to-back and back-to-front (separate SKUs)
  environmental:
    operating-temp: 0 to 40 C at 900 m (datasheet); 0 to 40 C at 950 m (guide)
    humidity: 5% to 95% non-condensing
  platform:
    cpu: Intel Xeon-D class, 4 or 8 core, on a COM-E module
    memory: up to 32 GB ECC DDR4
    storage: 128 GB or 256 GB SSD
    bmc: RunBMC option (OpenBMC, 2 GB DDR4, dual 128 MB flash)
    software: ONIE installer for third-party NOS
  features:
    optics-osfp: up to 30 W OSFP optics; LPO/LRO support; DAC up to 2.5 m
    timing: precise timing option (datasheet, unspecified)
  compliance:
    emc: EMC CN (GB9254-2008), EU (EN55022, EN55024), FCC, VCCI
    safety: UL/CSA/IEC/EN 60950-1/62368-1
    environment: EU RoHS, SVHC requirements of REACH, China RoHS
  lifecycle:
    eol: none-announced
chassis: {width: 438.5, height: 43.1, depth: 657.5, ru: 1, color: '#2a2a2a', airflow: front-to-back, power: ac}
gaps:
- what: osfp-port-lamps
  scope: [front]
  reason: needs-drawing
  wanted: >-
    Where the OSFP ports' own lamps are. The guide's Port Descriptions table gives every OSFP port a lamp
    (green 100G per lane, amber 50G or lower, on or blinking) and the Front Panel callout points "Indicator
    LED - OSFP" at the port block, but neither the figure nor the render shows a window for one: the band
    between the rows carries only the printed legend and the cages' latch notches, and the triangles are
    ink. No lamp is placed rather than one guessed at. A photograph of a powered unit settles it.
- what: grey-dot-beside-the-sfp-lamp
  scope: [front]
  reason: sources-disagree
  wanted: >-
    What the round grey dot at (104.3, 7.6) on the Front Panel figure is. It sits beside the upper SFP+
    lamp, the size of the lamp but grey; the three-quarter render draws a vent cell there. It could be
    an unlit lamp, a reset pinhole or a drawing artefact. Two small dark squares above the SYS lamp (about
    319.8 and 322.2, y 7.2) are equally unexplained. Neither is drawn.
- what: dc-supply-face
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    The DC build's supply. The What's in the Box table lists R4035-F9007-A1, "DC PSU 2x1500W, F2B", and
    the Ground Lug Installation page exists for it ("not applicable to the AC SKU versions"), but no figure
    draws a DC supply's face, so the DC build is not offered as a configuration.
- what: fan-and-psu-numbering
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    Which end FAN1 and PSU1 are. The Rear Panel LEDs table names FAN1-FAN7 and PSU1/PSU2 and no figure
    labels a bay. The bays are numbered left to right as seen from the rear because a view has to order
    them somehow; no numeral is printed.
- what: b2f-finish
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    What colour the back-to-front build's fan handles and latches are. Only the F2B build is drawn anywhere;
    many vendors mark B2F modules in a second colour, and whether this one does is not shown.
- what: the-four-undrawn-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    Orthographic drawings of the lid, underside and side walls. The three-quarter renders show a plain
    grey lid with a recessed label or handle plate towards the rear and slide-rail screw heads along the
    sides, which cannot be measured from a perspective render.
groups:
  osfp:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the sixteen 800G OSFP ports, two blocks of four stacked columns on a 23.24 mm pitch with an 8.5
      mm gutter, odd ports the upper row and even the lower, as the panel's `N (up)(down) N+1` legends
      say. Each breaks out to 2 x 400G, 4 x 200G or 8 x 100G.
    attrs: {media: osfp, speed: 800g}
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band ports: the RJ45 console, the USB 3.0 Type-A and the 1000BASE-T management jack in
      one stacked housing, and the two 10G SFP+ cages the panel legends M1 and M2 and the datasheet calls
      the "2x10G SFP+ Traffic Management port".
  leds:
    term: LED
    role: indicator
    index-origin: 1
  furniture:
    term: Part
    role: furniture
    index-origin: 1
    description: >-
      the pull-out LUG TAG at the foot of the front panel and the two ground-lug bracket screws at the
      rear left corner - things you neither connect to nor read.
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        datasheet: "1+1 redundant, hot swap PSUs, 1500W", against a 1310 W maximum draw, and the rear
        figure counts two.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 6+1
      redundancy-note: >-
        datasheet: "6+1 redundant fans", and the rear figure and the LED table (FAN1-FAN7) count seven
        bays.
