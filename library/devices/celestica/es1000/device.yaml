  color: '#c9ccd0'
  power: ac
gaps:
- what: usb-generation
  scope: [usb-1, usb-2]
  reason: sources-disagree
  wanted: >-
    WHICH USB GENERATION THE -24, -24P, -48 AND -48P CARRY. The guide's Table of Ports and Port
    Descriptions give USB 2.0 on those four and USB 3.0 on the -48C/-48CP; the datasheet FEATURES says
    '2x USB 3.0 Type A' with no SKU split. The one 48-port front figure (captioned for all four 48-port
    SKUs) prints the SuperSpeed 'SS' mark and the 24-port figure does not. Modelled per the guide table;
    the front panel's SS legend is drawn on all four 48-port builds because only one 48-port panel
    exists. A photograph of an ES1000-48 or -48P front closes it.
- what: config-scoped-device-attrs
  scope: [24-f2b, 24-b2f, 48-f2b, 48-b2f, 48c-f2b, 48c-b2f]
  reason: vendor-silent
  wanted: >-
    A way to carry the per-SKU power maximum (<3200 W PoE, <550 W non-PoE), the PoE budget and the CPU
    per configuration. Today they are device attrs stated for the whole family with the split in words,
    as on cisco/asr-9001's gap of the same name.
- what: psu-part-numbers
  scope: [psu-1, psu-2]
  reason: vendor-silent
  wanted: >-
    The vendor part numbers of the 550 W, 920 W and 1600 W supplies. Neither the guide nor the datasheet
    names them, and the ordering table lists only chassis SKUs. Whether the 1600 W supply is the same
    Gospower G1482-1600WRA already modelled for the ES1010 (celestica/psu-1600@1, drawn from bench photos
    with a purple latch and one lamp, against this guide's black tab and two lamps) is the open question.
- what: psu-550-lamp-count
  scope: [psu-1, psu-2]
  reason: sources-disagree
  wanted: >-
    Whether the 550 W supply has one lamp or two. The PSU LEDs table describes one bi-colour lamp for the
    550 W and a DC OK / AC OK pair for the 920 W and 1600 W; the rear figures draw two windows on every
    supply and the guide says the rear of all ES1000 systems is visually identical. A photograph of a
    550 W supply closes it.
- what: rear-bosses
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    What the two round bosses left of fan labels 2 and 3 are (light pipes for per-fan lamps, or plugged
    holes). The guide documents no fan lamps; they are drawn as outlines only.
- what: side-top-bottom-geometry
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A mechanical drawing or square-on photographs of the lid, underside and sides. Everything on those
    faces is placed by proportion from three-quarter renders.
groups:
  rj45-1g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
  sfp28-leds:
    term: LED
    role: indicator
    index-origin: 1
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster - two USB-A service ports, the out-of-band RJ45 and its combo SFP (one
      interface, either medium), and the RJ45 console. Four media, one job
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
  marks:
    term: Mark
    role: furniture
    index-origin: 1
    description: the printed USB tridents beside the two USB-A ports
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        0:1 / 1:1 modes; 'the PSUs would not support 1+1 redundancy' when the total demand exceeds one
        supply (guide PSU Power Options)
  grounding:
    term: Point
    role: furniture
    index-origin: 1
    description: >-
      the rear grounding point - two screws beside an earth symbol at the left edge - and the second
      earth symbol with its screw in the right-hand strip
  furniture:
    term: Item
    role: furniture
    index-origin: 1
    description: fan screws, the rear standoff and the side screws
