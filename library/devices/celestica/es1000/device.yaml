format: 1
kind: device
name: es1000
version: 1.0.0
maturity: modelled
manufacturer: Celestica
model: ES1000
description: >-
  Celestica ES1000 - 1U enterprise access switch, 24 or 48 x 1000BASE-T RJ45 (PoE++ 802.3bt Type 4
  Class 8 on the -P builds) and 4 x 1/10/25G SFP28 uplinks, Marvell AC5X, integrated ARM A55 CPU (Intel
  Denverton x86 on the -48C/-48CP), 2+1 fixed fans, 1+1 hot-swap CRPS AC supplies, F2B or B2F airflow.
  Six SKUs on one chassis: the 24-port builds wear the front-24 panel, the 48-port builds the front
  panel, and all share one rear.
profile: networking
provenance:
  sku-split:
    confidence: datasheet
    note: >-
      ONE DEVICE, TWELVE ORDERABLE CONFIGURATIONS. The six SKUs (ES1000-24, -24P, -48, -48P, -48C, -48CP)
      share one datasheet column (438.2 x 43.4 x 371.6, one weight), one rear ('The rear panel of all
      ES1000 systems are identical', guide Rear Panel) and one management/uplink cluster, measured
      identical to 0.5 mm on the 24-port and 48-port close-ups. They differ in front port count, PoE,
      CPU and supply wattage. PoE-or-not and airflow are configurations as on celestica/es1010 (ES1010-48C
      and -48CP are configurations of one device there). The 24-port front is a different panel on the
      same chassis, so it is a VARIANT VIEW (`front-24`, `face: front`) bound by the 24-port
      configurations - the dell/r740xd precedent, where the 12 x 3.5 in front is `front-lff-12` bound by
      the lff12 configurations. dcim_export.views_for makes each configuration export only the front it
      wears.
  chassis:
    confidence: datasheet
    note: >-
      datasheet PHYSICAL DIMENSIONS: height 43.4 mm, width 438.2 mm, depth 371.6 mm. The hardware guide's
      Key System Specifications gives 371.7 deep; 0.1 mm, recorded here and not filed. Weight 7.6 +/- 0.3
      kg with two PSUs (guide). 438.2 is the body between the ear folds: both guide front figures draw the
      grey ears outside it, and the body measures 438.2 against its own height to 0.1 and 0.4 percent.
  front-figures:
    confidence: measured
    note: >-
      GATE 1. Four ES1000 guide figures, all orthographic CAD renders: Front Panels fig 1 (24-port, 1725
      x 193, body 1506.5 x 149 px, aspect 10.111 against 438.2/43.4 = 10.097, +0.14 percent, 3.438 px/mm)
      and its close-up (1537 x 465, body 440.5 px tall, 10.15 px/mm, anchored on the right body edge);
      fig 2 (48-port, 1421 x 163, body 1247 x 124 px, aspect 10.056, -0.4 percent, 2.846 px/mm) and its
      close-up (1281 x 365, 7.823 px/mm, byte-identical to the System Status LEDs figure 2). No
      perspective: the RJ45 wall positions fit one pitch across all four blocks with no drift (block
      starts 15.8, 107.8, 199.6, 291.7 on the 48-port figure), and the right-hand cluster measured on
      the two close-ups agrees to 0.5 mm.
  port-layout:
    confidence: measured
    note: >-
      measured on the shared walls of the RJ45 blocks (a flat feature, one per port) on both full front
      figures: column pitch 13.96 (the 13.97 of std/rj45-ganged@2), block pitch 92.00 (so 8.04 extra
      between blocks), column 1 centred 15.86 from the left body edge. Both figures agree to 0.2 mm on
      every wall. Rows: the bright block shell runs y 16.1 to 39.5 with the bar between rows centred at
      27.75, so the two 11.0 cells sit at 16.25 and 28.25. Each block is one bright shell 86.8 x 23.4
      drawn as panel decor behind its jacks.
  rj45-orientation:
    confidence: measured
    note: >-
      read off the 24-port close-up at 10 px/mm: every UPPER jack shows its two lamp windows in its TOP
      corners and its contact comb below the plug bar, every LOWER jack the mirror - windows at the
      bottom. The lamps sit on the keyway side (common/rj45-ganged-eth@1 which-is-which), so upper jacks
      are keyway-up (rotate 180) and lower keyway-down (rotate 0), tab-up over tab-down. Same reading on
      the stacked management jack (windows top, rotate 180) and console (latch notch at the bottom, no
      windows, rotate 0). NOTE this is the opposite of celestica/es1010's data ports (upper 0, lower 180),
      which were read off an oblique photograph; the ES1010 guide's own front figure has not been checked
      against it.
  port-leds:
    confidence: datasheet
    note: >-
      guide Port LEDs table: RJ45 data ports carry a left bi-colour link lamp (green 1000M, amber 10/100M)
      and a right bi-colour activity/PoE lamp - led-a and led-b of common/rj45-ganged-eth@1, whose windows
      the figure shows in each housing. The combo RJ45 management port: left bi-colour link, right green
      activity. Each SFP28 port one bi-colour lamp (green 25G, amber 1/10G) - drawn as the up/down
      triangles in the band between the stacked cages, which the figures show one per port (the System
      Status LEDs table's 'two bi-colored LEDs' per SFP28 port disagrees with the Port LEDs table and the
      drawing; the drawing and the Port LEDs table are followed). The combo SFP management port has one
      lamp: the green round lamp left of its cage with a printed arrowhead pointing at it.
  uplink-cluster:
    confidence: measured
    note: >-
      measured on the 24-port close-up (10.15 px/mm) and confirmed on the 48-port close-up (7.82 px/mm):
      SFP28 2 x 2 bezel 375.0 to 403.6 x 10.5 to 35.1 (28.5 wide = two std/sfp-ganged@1), cages at y 10.5
      and 24.7 with a 3.8 mm lamp band between; management SFP cage 355.6 to 370.7 x 2.6 to 12.3
      (std/sfp@1 14.5 x 10 centred on it); its lamp centred (352.1, 9.5); USB-A shell 329.1 to 342.2 x
      5.5 to 11.4; the stacked management shell 407.0 to 423.6 x 5.4 to 35.4 holding the RJ45 (7.9 to
      16.5 opening), USB-A (19.2 to 23.4) and console (26.3 to 35.2); status lamps centred on x 428.79 at y 17.68,
      22.71, 27.83, 32.96 (bright-blob centres), 2.5 across; their legends centred on x 425.3. The lamp component is common/led-indicator@1 (a 2 mm lens in a 4 mm
      box), smaller than the drawn 2.5 lens; right pitch, compromise shape.
  stack-orientation:
    confidence: estimated
    note: >-
      rule, not a reading: the SFP28 pairs (upper 0 over lower 180) follow the library's belly-to-belly
      convention (L108). The figures draw the cage lips in the lamp band between the rows, which is what
      the convention draws; nothing seen overturns it.
  vents:
    confidence: measured
    note: >-
      the face is perforated with square holes, and the perforation STOPS at flat metal around every
      port, lamp and legend. Fields measured on contrast-stretched copies of the two close-ups (10.15
      and 7.82 px/mm) and the full 48-port figure: two lattices, 3.2 x 3.2 mm left of the uplinks
      (holes centred on x 323.9 + 3.2n, y 3.9 + 3.2n) and 4.0 x 3.2 around them (x 374.0 + 4.0n,
      y 6.65 + 3.2n), drawn as the grille pattern with pattern-pitch and pattern-offset on those
      lattices; the pattern's holes are about 85 percent of the pitch, larger than the real 2.2 to
      2.5 mm. Fields: a top-edge row and the block above RJ45 blocks 1-2 (x 47.5 to 186.5, beside the
      lug tag); above block 4 to x 325.3 and two rows over the USB on the 48-port panel; on the
      24-port panel a left column at 322.2, the two rows over the USB and the full-height field below
      y 15.3 to x 371.2; around the uplinks a top-edge row, one row between MGMT COMBO and the SFP28
      bezel, a block over the status lamps, a column right of them and the bottom rows (under the SFP28
      legends from y 37.9, under IOIOI from 40.6). Flat: the USB 1 plate (325.3 to the management SFP,
      y 4.4 to 15.3), the lamp and management SFP, the MGMT COMBO band, the SFP28 bezel and its
      legends, the stacked management shell and the lamp column. The 24-port panel is plain metal from
      x 187 to 322.2 where blocks 3 and 4 would be. The renders show interior parts through the holes
      in places; those are not drawn.
  legends:
    confidence: measured
    note: >-
      every legend as printed: port pairs 'N ▲▼ N+1' centred under each column, 1.4 mm tall at baseline
      41.7; SFP28 pairs under the bezel; MGMT COMBO with its bracket joining the management SFP and the
      management RJ45; the arrowhead over the management SFP lamp; IOIOI under the console; STAT, FAN, PWR,
      ALM set at about 60 degrees beside the lamps; a USB trident under USB 1 and one turned vertical
      beside USB 2. The 48-port close-up prints the SuperSpeed 'SS' with both tridents, the 24-port
      close-up does not. The Celestica wordmark is plain text, no logo art. The lug tag is the dark
      pull-out tab printed ES1000 with LUG TAG under it; it is the seated
      celestica/lug-tag-ridge-23@1 (the top-ridge card, label ES1000) - see lug-tag.
  lug-tag:
    confidence: measured
    note: >-
      celestica/lug-tag-ridge-23@1 (#700), the top-ridge card in its 23.3 x 3.8 length, label ES1000,
      at (23.1, 3.1). Re-read on Front Panels figure 1 (3.438 px/mm, 8x grid): the dark slot runs x
      23.1 to 46.4 and y 3.1 to 6.9, the lighter ridge along its top edge from about x 26.9 to 43.5
      (3.8 to 20.4 in the part's frame, against the part's 3.6 to 19.6), and ES1000 centred on x 34.7;
      the 48-port figure 2 (2.846 px/mm) agrees within 0.3 mm (slot 22.8 to 46.1, y 3.1 to 7.0). The
      Foleon es1000-A render shows the same top-edge ridge over ES1000, reading left to right. This
      replaces the #690 stopgap, celestica/lug-tag@1, whose grip is a block at one end, and closes its
      lug-tag-lip gap.
  usb:
    confidence: datasheet
    note: >-
      SOURCES DISAGREE, see the usb-generation gap. The guide's Table of Ports gives USB 2.0 on the -24,
      -24P, -48 and -48P and USB 3.0 on the -48C/-48CP; the datasheet FEATURES says '2x USB 3.0 Type A'
      for all. Placements carry the guide's figure for each panel's own art (2.0 on front-24, 3.0 on
      front, whose figure prints SS) and component-attrs sets 2.0 on usb-1/usb-2 for the -48 and -48P
      configurations, which also wear std/usb-a@1's usb2 skin (black tongue) through `skins:`; the
      front-24 placements name that skin directly. The guide notes the ports carry data only, no power.
  rear-figures:
    confidence: measured
    note: >-
      ES1000 guide Rear Panel figure 2 (1681 x 182, body 1470 x 145 px, aspect 10.14, +0.4 percent, 3.35
      px/mm) is the device's own; the positions are taken off the ES1010/ES1050/EG1050 guide's Rear Panel
      figure 1 (5736 x 634, 11.5 px/mm), which is the same rear art at 3.4 times the resolution - checked
      by overlaying both at matched scale (supply edges 256.0/329.5/346.3/419.8, fan centres, labels, all
      within 0.5 mm). x is taken as a fraction of the body between the outer seams, y as a fraction of its
      height, because that figure's seams make it 1.7 percent wide against its height. This borrowing is
      of a sibling guide's figure; the ES1000 figure is the check.
  rear-layout:
    confidence: measured
    note: >-
      three fixed fans behind round honeycomb grilles centred at 50.14, 105.59 and 161.09 (55.47 pitch),
      y 22.1, about 38.5 across, each labelled with an arrowhead, a fan glyph and its number to its left;
      two CRPS bays at 256.0 and 346.3 (73.5 x 40), PSU 1 labelled to its left and PSU 2 in the strip at
      the right edge (arrowhead pointing at it, a boxed lightning glyph, the number); a fixed divider
      panel 330.2 to 345.6 between the supplies. Left edge: a standoff at the top and two cross-head
      screws beside an earth symbol - the grounding point; the right strip carries a second earth symbol
      over one screw. Two round bosses sit left of fan labels 2 and 3; the guide does not say what they
      are, so they are outlines only. The fan and PSU glyphs are drawn as simple strokes, not traced.
  fans:
    confidence: datasheet
    note: >-
      '2+1 fixed fans' (datasheet); 'three fixed fans' (guide Rear Panel). Not FRUs, so decor plus a
      region each, as on celestica/es1010. No fan power figure is published.
  psu:
    confidence: datasheet
    note: >-
      guide PSU Power Options and Table of Attributes: 2 x 550 W on the -24, -48 and -48C; 2 x 920 W on the
      -24P; 2 x 1600 W (1000 W at 100-127 V) on the -48P and -48CP; all F2B and B2F. 'The airflow of the
      PSUs and Fans must be same F2B or B2F.' The three supplies share one face in every figure, so the
      three contracts share one skin.
  power:
    confidence: datasheet
    note: >-
      guide Key System Specifications, Power Consumption: 'ES1000-24P, ES1000-48P, ES1000-48CP: <3200W,
      ES1000-24, ES1000-48, ES1000-48C: <550W'. Stated as upper bounds with no ambient or load; filed as
      max. The per-SKU figure cannot be carried per configuration (config-scoped-device-attrs gap), so the
      PoE maximum is power-max-w and the non-PoE one power-max-no-poe-w, the edgecore/eps112 spelling.
      PoE budgets from the guide's power distribution tables: 1550 W (24P, 2 x 920), 2910 W high line /
      1710 W low line (48P/48CP, 2 x 1600).
  sides-top-bottom:
    confidence: estimated
    note: >-
      no document draws the sides, top or bottom square-on. The three-quarter renders (datasheet page 1,
      the cls.celestica.com product-page renders) show a plain silver lid with two pressed rounded pads
      and a label outline, and screws along the sides. Counted from the renders, placed by proportion,
      every position estimated.
attrs:
  physical:
    weight-kg: '7.6'
    weight-note: 7.6 +/- 0.3 kg with two PSUs
  performance:
    switching-capacity: 148 Gbps
    port-modes-rj45: 10/100/1000BASE-T
    port-modes-sfp28: 1/10/25G
  power:
    power-max-w: '3200'
    power-max-no-poe-w: '550'
    input-ac: 100-240 VAC, 50-60 Hz
    psus: 1+1 hot-swap AC CRPS (550 W, 920 W or 1600 W by SKU), 0:1 / 1:1 modes
    poe-budget-w: '2910'
    poe-budget-note: >-
      high line, two supplies: 1550 W on the -24P (up to 17 ports at 90 W), 2910 W on the -48P/-48CP (up
      to 32 ports at 90 W); low line 1550 W and 1710 W
  thermal:
    fans: 2+1 fixed (not field-replaceable)
  environmental:
    operating-temp: 0 to 45 C (front to back airflow), 900 m; derate 1 C per 175 m above 900 m
    storage-temp: -40 to 70 C (guide); -40 to 60 C (datasheet)
    humidity-operating: 5 to 85 percent non-condensing
    humidity-storage: 5 to 95 percent
    altitude: 3050 m maximum
  platform:
    asic: Marvell AC5X
    cpu: integrated ARM A55, 2C 1.5 GHz; Intel Denverton x86 4C 2.1 GHz (COMe) on the -48C/-48CP
    memory: 8 GB DDR4 (16 GB option on the -48C/-48CP)
    storage: 32 GB eMMC (ARM builds); 32 or 64 GB M.2 SSD (-48C/-48CP)
  features:
    encryption: 256b MACsec
    poe: IEEE 802.3af/at/bt Type 4 Class 8, 90 W per port, persistent PoE - on the -24P, -48P and -48CP
  management:
    mgmt-ports: >-
      RJ45 console (9600 / 115200 default, 8N1), out-of-band combo pair (RJ45 in the stack and SFP left of
      the uplinks - one interface, not usable together), 2 x USB-A (data only)
  compliance:
    acoustic: ISO 7779, ISO 3744
    environment: EU RoHS, SVHC requirements of REACH directive
    emc: Class B - USA, Canada, Europe, Japan, China
    safety: UL / CSA / IEC / EN 60950-1 / 62368-1
    psu-approvals: CE, FCC, CCC, KC, TUV, UL / cUL, BIS and BSMI
  lifecycle:
    eol: none-announced
