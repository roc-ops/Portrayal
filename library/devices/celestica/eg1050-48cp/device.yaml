format: 1
kind: device
name: eg1050-48cp
version: 1.0.1
maturity: draft
manufacturer: Celestica
model: EG1050-48CP
description: >-
  Celestica EG1050-48CP - 1U edge gateway with 48 PoE++ RJ45 ports (16 x 2.5GbE, 32 x 1GbE), 4 x 1/10/25G
  SFP28 uplinks, six detachable SMA antennas (2 Wi-Fi 6, 4 5G NR/LTE), Broadcom TD3.X2, 2+1 fixed fans and
  1+1 hot-swap 1600 W AC supplies, F2B or B2F airflow.
profile: networking
provenance:
  chassis:
    confidence: datasheet
    note: >-
      datasheet PHYSICAL DIMENSIONS: 43.4 x 438.2 x 371.6 mm. The guide's Key System Specifications agrees
      (371.6 deep) and gives 8 +/- 0.5 kg with two supplies. 438.2 is the body between the ear folds: the
      guide's front figure draws the grey ears outside it.
  front-figure:
    confidence: measured
    note: >-
      Guide Front Panel figure 3 (EG1050-48CP, an orthographic CAD render, 5436 x 2417 px): the body
      measures 4855 px across for 438.2 mm, 11.08 px/mm, and 477 px high for 43.4 mm. The same face as the
      48-port front of celestica/es1000: the RJ45 column pitch (13.96), block pitch (92.0), the uplink and
      management cluster and the lamp column agree with that device's measured front to 0.5 mm, so its
      positions are used. The face differs in the EG1050 model plate, the green stripe under ports 1-16 and
      the six antenna connectors.
  port-speeds:
    confidence: datasheet
    note: >-
      guide Ports Table 5 and datasheet FEATURES: ports 1-16 are 100/1000/2500BASE-T (the figure marks them
      with the green stripe under their numbers), ports 17-48 are 10/100/1000BASE-T, all 48 with PoE++; four
      SFP28 at 1/10/25G; management RJ45 10/100/1000 and management SFP 1000 Mbps, one combo interface.
  poe:
    confidence: datasheet
    note: >-
      guide System Overview: 'All Ethernet data ports support 802.3bt Type 4 Class 8 (90W) PoE'; datasheet
      FEATURES lists the same as an option and 'persistent PoE'. Per-port budget with two supplies is not
      printed for this model.
  antenna-connectors:
    confidence: estimated
    note: >-
      guide Front Panel Table 1 and Ports Table 5: 2 detachable Wi-Fi and 4 detachable 5G NR/LTE antennas,
      all SMA. In Front Panel figure 3 each is hidden behind its antenna base, so the connector centres are
      the antenna base centres read off the figure (x 61.6, 112.6, 163.6, 214.6, 265.7, 316.7 mm, a 51 mm
      pitch) and the height is set level with the ANT legends (6.0 mm). Drawn as std/sma@1, the library's
      SMA jack. The legends ANT1 and ANT2 (with the Wi-Fi mark) and 5G ANT1 to ANT4 sit to the left of
      each antenna (the figure stacks '5G' over 'ANT1'; one line is drawn). The vent fields around the
      antenna row are hidden behind the antenna bases in the figure, so the band holding the connectors and
      their legends (y 2.0 to 9.6 above RJ45 blocks 1-2 and 4) is drawn as flat metal, an estimate. See the
      antenna-connector-positions gap.
  uplink-cluster:
    confidence: measured
    note: >-
      Front Panel figure 3 against celestica/es1000's measured cluster: SFP28 2 x 2 bezel 375.0 to 403.5 x
      10.5 to 35.1, management SFP 355.6 to 370.7, USB-A 329.1 to 342.2, the stacked management RJ45 /
      USB-A / console shell 407.0 to 423.6 and four round lamps at x 428.8 (STAT, FAN, PWR, ALM). The
      figure shows the SFP28 up/down lamp triangles in the band between the stacked cages.
  stack-orientation:
    confidence: estimated
    note: >-
      rule, not a reading: the SFP28 pairs (upper 0 over lower 180) follow the library's belly-to-belly
      convention. The figure draws the cage lips in the lamp band between the rows, which is what the
      convention draws.
  legends:
    confidence: measured
    note: >-
      every legend as printed in Front Panel figure 3: port pairs 'N ▲▼ N+1' centred under each column,
      those of ports 1-16 inside the green stripe; MGMT COMBO with its bracket; the arrowhead over the
      management SFP lamp; IOIOI under the console; STAT, FAN, PWR, ALM beside the lamps; the SuperSpeed
      mark beside each USB-A. The Celestica wordmark is plain text. The model plate is the dark pull-out tab
      printed EG1050 with LUG TAG under it, the seated celestica/lug-tag-ridge-23@1.
  port-leds:
    confidence: datasheet
    note: >-
      guide LEDs Table 3: each data port has a left link lamp (green at 2.5GbE on ports 1-16, amber at the
      lower speeds) and a right activity lamp that is amber while PoE power is enabled; each SFP28 port has
      one bi-colour lamp (green 25G, amber 1/10G); STAT, FAN, PWR and ALM are Table 1.
  rear:
    confidence: measured
    note: >-
      Guide Rear Panel figure 2 (EG1050) is the same rear art as figure 1 (ES1010 and ES1050) with the six
      front antennas standing behind the chassis. It is drawn as celestica/es1000's rear, which was
      measured off the same art: three fixed fans with round honeycomb grilles at 50.14, 105.59 and 161.09
      mm, two CRPS bays at 256.0 and 346.3 (73.5 x 40), the divider between them, the earth screws at the
      left edge and in the right strip. Two round bosses beside fan labels 2 and 3 are outlines only. The
      rear carries no connector of its own.
  fans:
    confidence: datasheet
    note: >-
      '2+1 fixed fans' (datasheet FEATURES); 'three (3) fans' (guide Rear Panel). Not field-replaceable, so
      decor plus a region each, as on celestica/es1010 and es1000.
  psu:
    confidence: datasheet
    note: >-
      guide System Overview table: PSU 2 x 1600W for the EG1050-48CP, F2B and B2F. The rear figure draws
      the supply with a black tab and two lamps, which is the face of celestica/psu-crps-1600-ac. Neither
      the guide nor the datasheet names a supply part number.
  power:
    confidence: datasheet
    note: >-
      guide Key System Specifications, Power Consumption: 'EG1050-48CP, ES1050-48CP, ES1010-48CP: <3200W',
      an upper bound with no ambient or load, filed as max.
attrs:
  physical:
    weight-kg: '8'
    weight-note: 8 +/- 0.5 kg with two PSUs
  performance:
    switching-capacity: 172 Gbps
    port-modes-rj45: 10/100/1000BASE-T (ports 17-48), 100/1000/2500BASE-T (ports 1-16)
    port-modes-sfp28: 1/10/25G
  power:
    power-max-w: '3200'
    input-ac: 100-240 VAC, 50-60 Hz
    psus: 1+1 hot-swap AC 1600 W, 0:1 / 1:1 modes
  thermal:
    fans: 2+1 fixed (not field-replaceable)
  environmental:
    operating-temp: 0 to 45 C, 900 m; derate 1 C per 175 m above 900 m
    storage-temp: -40 to 70 C
    humidity-operating: 5 to 85 percent non-condensing
    humidity-storage: 5 to 95 percent
    altitude: 3050 m maximum
  platform:
    asic: Broadcom TD3.X2
    cpu: Intel Denverton x86, 8C at 2.2 GHz (4C at 2.1 GHz option)
    memory: DDR4 up to 32 GB
    storage: M.2 SSD, 128 GB or up to 256 GB
  features:
    wifi: Wi-Fi 6, 2 x detachable SMA antennas
    cellular: 5G NR/LTE sub-6 GHz, 4 x detachable SMA antennas, dual SIM and eSIM
    encryption: 256b MACsec
    timing: optional IEEE 1588 and SyncE
    poe: IEEE 802.3af/at/bt Type 4 Class 8, 90 W per port, persistent PoE
  management:
    mgmt-ports: >-
      RJ45 console (9600 / 115200, 8N1), out-of-band combo pair (RJ45 in the stack and SFP left of the
      uplinks, one interface), 2 x USB-A 3.0 (data only)
chassis:
  width: 438.2
  height: 43.4
  depth: 371.6
  ru: 1
  weight-kg: 8
  color: '#c9ccd0'
  power: ac
gaps:
- what: antenna-connector-positions
  scope: [wifi-ant-1, wifi-ant-2, ant-5g-1, ant-5g-2, ant-5g-3, ant-5g-4]
  reason: needs-drawing
  wanted: >-
    A front view with the antennas removed. Every figure of the front draws the six detachable antennas on
    their connectors, so the connector centres and their height are read from the antenna bases and the
    legends and are estimated.
- what: antennas
  scope: [front]
  reason: needs-drawing
  wanted: >-
    The antennas the guide names, Y0RGK0MA0AA for Wi-Fi and YECN009AA for 5G/LTE ('no other antennas are
    qualified'), as accessories: no document held gives their length or a dimensioned drawing, and the
    schema has no place for an accessory part number, so they are not drawn.
- what: side-top-bottom-geometry
  reason: needs-drawing
  wanted: >-
    A mechanical drawing or square-on photographs of the lid, underside and two sides. The guide and the
    datasheet draw none of them, so those four faces are not drawn.
- what: psu-part-numbers
  scope: [psu-1, psu-2]
  reason: vendor-silent
  wanted: >-
    The vendor part number of the 1600 W supply. Neither the guide nor the datasheet names it, and the
    ordering table lists only chassis SKUs.
- what: rear-bosses
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    What the two round bosses left of fan labels 2 and 3 are. The guide documents no fan lamps; they are
    drawn as outlines only.
groups:
  rj45-2p5g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 2.5g, poe: 'IEEE 802.3bt Type 4 Class 8, 90 W per port'}
  rj45-1g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g, poe: 'IEEE 802.3bt Type 4 Class 8, 90 W per port'}
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
  sfp28-leds:
    term: LED
    role: indicator
    index-origin: 1
  wifi-antenna:
    term: Antenna
    role: service
    index-origin: 1
    attrs: {media: coax-sma, role: antenna, band: wifi}
  cellular-antenna:
    term: Antenna
    role: service
    index-origin: 1
    attrs: {media: coax-sma, role: antenna, band: 5g-lte}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster - two USB-A service ports, the out-of-band RJ45 and its combo SFP (one
      interface, either medium), and the RJ45 console. Four media, one job
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
  marks:
    term: Mark
    role: furniture
    index-origin: 1
    description: the printed USB tridents beside the two USB-A ports
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: 0:1 / 1:1 modes, 2 x 1600 W hot-swap
  grounding:
    term: Point
    role: furniture
    index-origin: 1
    description: >-
      the rear grounding point - two screws beside an earth symbol at the left edge - and the second
      earth symbol with its screw in the right-hand strip
  furniture:
    term: Item
    role: furniture
    index-origin: 1
    description: fan screws, the rear standoff and the model plate
