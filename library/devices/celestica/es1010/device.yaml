format: 1
kind: device
name: es1010
version: 0.7.0
manufacturer: Celestica
model: ES1010
description: Celestica ES1010 - 1U 48-port 1GbE (PoE++) access switch with 4x 25G SFP28 uplinks;
  Broadcom TD3.X2, fixed 2+1 fans, 1+1 hot-swap AC PSUs
provenance:
  chassis: datasheet (438.2 x 371.6 x 43.4 mm)
  layout: measured from a square-on product photo (working/celestica/product-front.png), calibrated
    on two independent references - the 438.2mm chassis body and the 482.6mm rack width - which
    agree to 99.6 percent. Column pitch 13.99mm, extra 8.0mm between the four blocks, first column
    centre 8.46mm from the faceplate edge. Supersedes the earlier oblique-photo reading (order and
    grouping are reliable, mm positions are NOT calibrated; column pitch 14.5mm estimated from the
    front photo and from fitting 24 columns plus the uplink and management clusters into 438.2mm).
    Needs caliper verification or a square-on photo before the geometry can be trusted.
  port-apertures: ganged block openings via std/rj45-ganged (estimated)
  psu: photo (Gospower G1482-1600WRA FRU, six faces)
  fans: datasheet (2+1 FIXED fans - not FRUs; three grilles seen on the rear photo)
attrs:
  performance:
    switching-capacity: 148 Gbps
    port-modes-rj45: 1000Base-T
    port-modes-sfp28: 1/10/25G
  power:
    psus: 2x 1600 W hot-swap AC, 0:1 / 1:1 redundancy
  thermal:
    fans: 2+1 fixed (not field-replaceable)
  platform:
    asic: Broadcom TD3.X2
    cpu: Intel Denverton x86, 4C @ 2.1 GHz (8C @ 2.2 GHz option)
    memory: 16 GB DDR4 (32 GB option)
    storage: 64 GB M.2 SSD (up to 256 GB)
  features:
    encryption: 256b MACsec
    timing: optional IEEE 1588 and SyncE
    poe: optional IEEE 802.3af/at/bt Type 4 Class 8, 90 W per port, persistent PoE
  management:
    mgmt-ports: 1x RJ45 console, OOB management as a combo pair (RJ45 at the mgmt stack and SFP in the
      top band share one interface), 2x USB 3.0 Type A
chassis:
  width: 438.2
  height: 43.4
  depth: 371.6
  ru: 1
groups:
  rj45-1g:
    term: Port
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
  sfp28:
    term: Port
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
  psus:
    term: PSU
    index-origin: 1
