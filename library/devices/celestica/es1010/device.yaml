format: 1
kind: device
name: es1010
version: 3.0.0
maturity: modelled
manufacturer: Celestica
model: ES1010
description: Celestica ES1010 - 1U 48-port 1GbE (PoE++) access switch with 4x 25G SFP28 uplinks;
  Broadcom TD3.X2, fixed 2+1 fans, 1+1 hot-swap AC PSUs
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the rule, not an observation,
      so a photograph of the stack overturns it: the 2 SFP pairs (port-49/port-50 and
      port-51/port-52).
  chassis:
    confidence: datasheet
    note: >-
      datasheet (438.2 x 371.6 x 43.4 mm)
  layout:
    confidence: measured
    note: >-
      measured from a square-on product photo (the vendor's front product photograph), calibrated
      on two independent references - the 438.2mm chassis body and the 482.6mm rack width - which
      agree to 99.6 percent. Column pitch 13.99mm, extra 8.0mm between the four blocks, first
      column centre 8.46mm from the faceplate edge. Supersedes the earlier oblique-photo reading
      (order and grouping are reliable, mm positions are NOT calibrated; column pitch 14.5mm
      estimated from the front photo and from fitting 24 columns plus the uplink and management
      clusters into 438.2mm). Needs caliper verification or a square-on photo before the geometry
      can be trusted.
  console-symbol:
    note: >-
      photo - the IOIOI console mark is printed BELOW the console jack, near the panel lower lip
      and below the port-pair legend row (a chassis-front photograph, shot upside down). It was at
      baseline 35.6, inside the jack. The x is unchanged - the photograph is not orthographic
      enough to re-derive it
  port-apertures:
    confidence: measured
    note: >-
      measured - the ganged cell is 12.7 x 11.0 on a 13.97 pitch, read off this device's own
      square-on photo and confirmed against the TE 2497310-1 2x6 magjack CAD; the twenty-four data
      jacks are common/rj45-ganged-eth@1 and the console is the bare std/rj45-ganged@2
      (docs/rj45-family-design.md). The figure was carried as estimated until #125 sourced it
  port-leds:
    note: >-
      photo - the two link and activity lamps moulded into each RJ45's own housing, one pair per
      port. They were twenty-four pairs of separate common/led-dot placements in a port-leds group
      until #125; they are now led-a and led-b of common/rj45-ganged-eth@1, which is what the
      housing actually carries. No vendor table gives their colours, so none is claimed
  psu:
    note: >-
      photo (Gospower G1482-1600WRA FRU, six faces)
  fans:
    confidence: datasheet
    note: >-
      datasheet (2+1 FIXED fans - not FRUs; three grilles seen on the rear photo)
  vent-islands:
    note: >-
      derived - a vent field is a perforation and the drawing said so, but the marks printed
      inside one were floating on air (L64). The vendor interrupts the perforation where it
      prints, so each of those marks now has a solid patch under it in the chassis colour, drawn
      over the vent the way ufispace/s9600-72xc paints its port bands over one. The patch is the
      printing's own footprint plus 0.4 mm, which is what the S9610-36D's front render measures:
      its slots stop 0.4 mm outside each lamp cluster and resume 0.4 mm past it. Where a vent is
      simply measured wider than the metal it reaches, this states the metal that the printing
      proves is there without re-measuring the field.

attrs:
  performance:
    switching-capacity: 148 Gbps
    port-modes-rj45: 1000Base-T
    port-modes-sfp28: 1/10/25G
  power:
    psus: 2x 1600 W hot-swap AC, 0:1 / 1:1 redundancy
  thermal:
    fans: 2+1 fixed (not field-replaceable)
  platform:
    asic: Broadcom TD3.X2
    cpu: Intel Denverton x86, 4C @ 2.1 GHz (8C @ 2.2 GHz option)
    memory: 16 GB DDR4 (32 GB option)
    storage: 64 GB M.2 SSD (up to 256 GB)
  features:
    encryption: 256b MACsec
    timing: optional IEEE 1588 and SyncE
    poe: optional IEEE 802.3af/at/bt Type 4 Class 8, 90 W per port, persistent PoE
  management:
    mgmt-ports: 1x RJ45 console, OOB management as a combo pair (RJ45 at the mgmt stack and SFP in the
      top band share one interface), 2x USB 3.0 Type A
chassis:
  width: 438.2
  height: 43.4
  depth: 371.6
  ru: 1
groups:
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
  furniture:
    term: Item
    role: furniture
    index-origin: 1
    description: the eight flange screws and the two chassis labels
  rj45-1g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the uplink and management block at the right-hand end - two USB-A
      service ports, the out-of-band RJ45 and its combo SFP, and the RS-232
      console. Four media, one job. The group and the RJ45 placement inside it are
      both called `mgmt`, which collides with nothing - a group heading is a fold
      rather than a thing, carrying no data-path and selecting nothing, so the
      name is only ever a label beside the row that owns it
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: '0:1 / 1:1 redundancy, 2x 1600 W hot-swap'
