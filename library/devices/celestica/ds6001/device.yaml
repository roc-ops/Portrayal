gaps:
- what: install-guide
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    Celestica's documentation portal stops at the DS5000; no DS6001 guide URL resolves
    (intake probe 2026-09-26).
  wanted: >-
    The DS6001 installation guide: LED tables, port-lamp mapping, coupler supply/return and
    size, bus-bar connector part, fan numbering, and a dimensioned elevation.
- what: face-geometry
  scope: [front, rear]
  reason: needs-drawing
  note: >-
    Both square-on renders read aspect 5.88 against 537/94 = 5.713 (2.9%), so no position here
    is measured; every one is a fraction of a datasheet dimension.
  wanted: >-
    A dimensioned drawing, a 3D model, or a photograph with a known dimension in frame, to fix
    the face height and take positions to better than estimated. This is what holds the device
    at draft.
- what: port-lamp-assignment
  scope: [port-leds]
  reason: vendor-silent
  note: 'Four lenses per column; which port each serves and their colours are unpublished.'
  wanted: 'The port LED table, or a photograph of a live unit with a known port lit.'
- what: hp-ports
  scope: [osfp224]
  reason: vendor-silent
  note: >-
    Ports 1-10 print "-HP"; the datasheet gives "Up to 32W / 40W transceivers" without a port
    split.
  wanted: 'Which ports take 40 W optics, from the guide or a Celestica optics support note.'
- what: qd-coupler-identity
  scope: [liquid-cooling]
  reason: vendor-silent
  note: >-
    STORDIS labels them "QD Direct Liquid Cooling"; the datasheet says only 35 C facility
    water inlet. Standard (UQD, ORv3 blind-mate), size, and which are supply and which return
    are not held.
  wanted: 'The coupler specification and supply/return assignment, and the coolant flow rate.'
- what: busbar-connector-part
  scope: [power-input]
  reason: vendor-silent
  note: 'The datasheet says "48VDC Bus bar input"; no connector part or current rating is given.'
  wanted: 'The bus-bar clip part number and rating, and the tray''s power consumption.'
- what: chassis-power
  reason: vendor-silent
  note: 'No typical or maximum power, and no fan draw, anywhere in the datasheet.'
  wanted: 'The DS6001 typical and maximum power, and the split between air and liquid heat load.'
- what: fan-numbering
  scope: [fans]
  reason: needs-photo
  note: >-
    No fan legend is printed on either rear render; fans are numbered left to right as seen
    from the rear by convention.
  wanted: 'A photograph of the rear showing fan labels, or the guide''s fan-replacement figure.'
- what: jack-orientation
  scope: [mgmt, timing]
  reason: needs-photo
  note: >-
    The left-cluster RJ45s' keyway side does not resolve at 1.9 px/mm; they are drawn
    unrotated. On the DS6000 the same vendor's jacks are keyway up.
  wanted: 'A close photograph of the DS6001 left cluster.'
groups:
  osfp224:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      64 x 1.6TbE OSFP224, two banks of eight columns, four rows, numbered down each column;
      ports 1-10 are printed "-HP".
    attrs: {media: osfp, speed: 1.6t}
  sfp56:
    term: Port
    role: management
    index-origin: 1
    description: 'Two 50GbE SFP56 management ports, printed "SFP56 65" and "SFP56 66"'
    attrs: {media: sfp56, speed: 50g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band reach into the box - CPU and BMC RJ45 consoles, the RJ45 GbE MGMT port,
      a USB-C console and a USB 3.0 storage port, with the reset pinhole. A person at the rack
      getting in.
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: 'the three external timing interfaces the datasheet names together - 1PPS, 10 MHz and ToD'
  leds: {term: LED, role: indicator, index-origin: 1}
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs: {redundancy: '3+1'}
  liquid-cooling:
    term: Coupler
    role: service
    index-origin: 1
    description: 'Four direct-liquid-cooling quick-disconnect couplers, two at each end of the rear'
  power-input: {term: Inlet, role: service, index-origin: 1}
  furniture:
    term: Item
    role: furniture
    index-origin: 1
    description: the luggage tag
