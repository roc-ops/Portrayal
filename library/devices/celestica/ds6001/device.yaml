format: 1
kind: device
name: ds6001
version: 0.1.0
maturity: draft
manufacturer: Celestica
model: DS6001
portfolio: {line: Data Center Networking, family: '1.6TbE Data Center Switch', series: DS6000}
description: >-
  Celestica DS6001 - 2OU Open Rack v3, 64-port 1.6TbE OSFP224 hybrid liquid-cooled data
  centre switch on a Broadcom Tomahawk 6 (102.4 Tbps), fed from the rack's 48 VDC bus bar.
  The front is a black bezel with two banks of eight OSFP224 columns, four rows each (two
  belly-to-belly pairs), the system lamps, USB-C console and reset in the gutter between the
  banks, 1PPS/10 MHz, MGMT, USB, CPU and BMC consoles and ToD at the left and two stacked
  SFP56 management ports (numbered 65 and 66) at the right. The rear carries a liquid
  quick-disconnect pair at each end, four fan modules (3+1) in two pairs, and the ORv3 bus-bar
  connector in the middle. No installation guide exists; this is a DRAFT from the datasheet
  and vendor renders whose only square-on images fail the aspect gate.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      A DATASHEET AND VENDOR RENDERS, AND NO INSTALL GUIDE. Celestica DS6001 datasheet rev
      120325 (Foleon; the earlier STORDIS rev 100925 differs only in title and order-code
      memory). Celestica's documentation portal stops at the DS5000 (intake probe 2026-09-26).
      Images: STORDIS square-on front (ds6001-F, 1200 x 800; ds6001-F-2 with a callout) and
      rear (ds6001-B, 1200 x 554, with callouts 1 QD couplers, 2 "3+1 FANS", 3 BUS BAR), and
      three Foleon three-quarter renders (ds6001-A 3781 px, -A-2, -A-3 front and rear
      stacked), used for identity, legends and counts only.
  gate-1:
    confidence: estimated
    note: >-
      FAILS, SO THIS DEVICE STAYS AT DRAFT. The front bezel reads 1032.4 x 175.6 px (x
      84.6-1117.0, y 314.4-490.0) and the rear body 1003.3 x 170.7 px; both give aspect
      5.88 against the datasheet's 537/94 = 5.713, 2.9% out, identically on two independent
      renders. With x scaled to 537 the face comes out about 91.3 mm tall, so the datasheet
      height evidently includes something the face does not (a tray rail or lip); with y
      scaled to 94 the face would be 552 mm wide, wider than the stated overall width, which
      is impossible. Neither image has a feature of independently known size to settle it
      (the OSFP apertures read 22.9 wide, which agrees with the x scale, but their drawn
      height of 10.7 mm is the render's inset, not the cage). Every position here is x as a
      fraction of 537 and y as a fraction of 94, and is estimated.
  width-and-flanges:
    confidence: estimated
    note: >-
      THE BLACK BEZEL IS THE 537 MM BODY; THE ORv3 FURNITURE IS OUTSIDE IT. On ds6001-F the
      bezel spans 1032.4 px; outside it sit small grey tabs (about 4 mm at the left, 3 mm at
      the right, at mid-height) and black rail bars along the bottom reaching 10-17 mm past
      each edge, which are the tray's rack latches and slides. 537 mm is the Open Rack v3 IT
      tray width and the datasheet's overall width, and it is the bezel that scales to it with
      the ports symmetric about the face centre to 0.1 mm (bank midpoint 600.8 px against a
      face centre of 600.8). The tabs, rails and the two blue lifting handles folded along the
      top edge (with their "DO NOT LIFT BY HANDLE" labels on ds6001-A-3) are not drawn, as ears
      are not. COLOUR follows the Celestica ruling - black faceplate, otherwise silver chassis -
      and the DS6001 renders agree with it: chassis.color is the sheet metal (#c4c8cc; the rear,
      lid and sides are silver on ds6001-B and ds6001-A-3) and the front's black is a
      full-face `bezel` decor (#16181b).
  the-osfp-wall:
    confidence: estimated
    note: >-
      TWO BANKS OF EIGHT COLUMNS, FOUR ROWS, NUMBERED DOWN EACH COLUMN. Column centres fit
      71.16 + 23.30 k (left bank) and 302.7 + 23.30 k (right bank) - cages abutting at 23.3,
      0.2 mm over std/osfp@1's 23.1 - and row centres read 16.06, 36.4, 55.2 and 75.6. The
      legends between rows 1-2 and 3-4 read `1-HP (up)(down) 2-HP` and `3-HP (up)(down) 4-HP`
      in column 1, so column k holds ports 4k+1 to 4k+4 top to bottom and the right bank
      starts at 33; ds6001-A-3 confirms "33 34" and "35 36" at its first column and "-HP" on
      ports 1 to 10 only. Rows 1-2 and 3-4 are each a belly-to-belly pair (upper 0 / lower
      180, the library's OSFP precedent). The drawn aperture on the render is 22.9 x 10.7;
      the std/osfp@1 13.5 mm height is used and fits between the rows with 6.8 mm for legends.
  the-hp-ports:
    confidence: photo-measured
    note: >-
      Ports 1-10 are printed with an "-HP" suffix; the datasheet says "Up to 32W / 40W
      transceivers" without saying which ports take which. That -HP marks the higher-power
      positions is the natural reading and is NOT stated anywhere held; see the hp-ports gap.
  the-port-lamps:
    confidence: estimated
    note: >-
      Four round lenses per column, two above row 1 and two below row 4, at the column centre
      +/-8.0 mm, y 6.0 and 85.4 - one per port, but which port each serves is unpublished, so
      each names its pair collectively (as on the DS6000, whose wall is laid out the same way).
  the-clusters:
    confidence: estimated
    note: >-
      Left: 1PPS and 10 MHz SMA jacks at (12.7, 36.1) and (24.7, 36.1); a bright shell 10.2-26.9
      across holding MGMT (RJ45 with lamps), USB and CPU CONSOLE top to bottom; a second shell
      holding BMC CONSOLE over TOD at x 40.0; each legend printed slanting beside its jack. The
      jacks' keyway side is not resolved at 1.9 px/mm and they are drawn unrotated. Centre gutter:
      PWR, ALM, STAT, FAN lamps at x 269.7, y 22.9-41.6 with legends to their left, the USB-C
      console standing vertical at (265.0, 54.0) and RST at 67.5. Right: the luggage tag lying landscape at
      the top (celestica/lug-tag@1, rotate 0, label "DS6001" as ds6001-A-3 prints it) with "LUG TAG"
      printed under it, and the two SFP56 cages stacked at x 509.9 (upper 0 / lower 180,
      per L108), printed "SFP56 65" above and "SFP56 66" below. Honeycomb vent fields fill the
      corners, drawn as estimated extents on backing rects.
  the-rear:
    confidence: estimated
    note: >-
      ds6001-B: a coupler plate at each end (0-67.8 and 471.0-537 mm) each carrying two QD
      couplers in dished recesses centred x 30.8 and 504.4, y 21.5 and 72.0 (a first read
      from a gridded crop put them at 28.5 / 509.4; the matched-scale overlay moved them); four fan modules 61.6 x 66.2 at x 88.3,
      157.8, 320.2 and 389.8 under grey cover plates; the bus-bar connector on its plate in the
      middle at 240.9-301.6 x 39.3-74.7. The fans carry no printed numbers on either render,
      so fan-1 to fan-4 run left to right as seen from the rear by convention only.
  cooling:
    confidence: datasheet
    note: >-
      "Hybrid cooling technology", "Liquid cool: 35 C liquid inlet with data center facility
      water" (datasheet rev 120325); the title calls it "Hybrid Liquid Cooled". STORDIS's rear
      legend adds "QD Direct Liquid Cooling" for the four couplers and "3+1 FANS". What is
      liquid-cooled (the switch ASIC's cold plate is the likely reading) and how the heat
      splits between air and water are not stated.
  power:
    confidence: datasheet
    note: >-
      "48VDC Bus bar input" - the tray has no supplies of its own; the rack's power shelf feeds
      the bus bar. chassis.power is `dc`, the nearest word the schema has: its `dc` is described
      as telecom -48 V, and an ORv3 bus bar is a positive 48-54 V rail, which is recorded here
      and in attrs rather than bent into the vocabulary. No power figure of any kind is given.
  lifecycle:
    confidence: datasheet
    note: >-
      Datasheet rev 120325 is current on the Foleon page; no end-of-sale or end-of-life notice
      found there or on the STORDIS page, so none-announced.
