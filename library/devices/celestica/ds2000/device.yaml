format: 1
kind: device
name: ds2000
version: 0.1.0
maturity: modelled
manufacturer: Celestica
model: DS2000
description: >-
  Celestica DS2000 - a 1U 2.0 Tbps top-of-rack switch with 48 x 10/25G SFP28 in three ganged
  blocks of sixteen and 8 x 100G QSFP28 in four stacked pairs, all on a black front bezel with
  a lamp above or below every port and nothing else. Management is on the REAR: an RJ45 CPU/BMC
  management jack, a USB 2.0 port and an RJ45 console with the four system lamps and a reset
  pinhole, between two pairs of hot-swap fan modules, with a 550 W CRPS supply at each end.
  Ports number 1-48 down each column, odd on the top row, and 49-56 the same way. Front-to-back
  and back-to-front builds.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Four sources, each used for what it can answer. (1) DS2000 datasheet, two revisions:
      the 091024 one Celestica serves at www.celestica.com/hps/ds2500_ds2000 (the file its
      product page links as the datasheet) and the 011524 one on the STORDIS mirror
      (DS2000_R4041-F900x_Datasheet.pdf) - identical specifications, used for dimensions,
      ports, power, fans and order codes. (2) DS2000 installation guide on Celestica's
      documentation portal (11 pages, revision 1.4.0, 2/2026): spec table, LED tables, port
      table, PSU and fan paragraphs, what's-in-the-box SKUs, and Figure 1 Front Panel View
      (3696 x 447 px) and Figure 2 Rear Panel View (3600 x 444 px), orthographic CAD renders
      without callouts. (3) The Foleon product page renders (cls.celestica.com hardware-platforms
      ds2000: ds2000_front 3575 x 1417 and ds2000-side-by-side-b 2374 x 588), three-quarter,
      used for colour and counts only. (4) The datasheet's own three-quarter picture (992 x 489).
  panel:
    confidence: measured
    note: >-
      Gate 1. Front: body 3610 x 363 px (x 33-3642, y 50-412) against the stated 438 x 44 mm -
      8.240 and 8.227 px/mm, aspect 9.945 against 9.955, 0.1 percent. Rear: 3521 x 355 px -
      8.037 and 8.045 px/mm, 0.4 percent. Both figures pass as orthographic and carry geometry
      at those scales. No ears: the tabs below each end of the front figure sit under the body
      and are rail feet. The lamp rings read 2.43 x 2.43 mm on the front, round, which is the
      second check the scale does not fit.
  sfp28-block:
    confidence: measured
    note: >-
      Front figure: the per-port lamp rings, segmented as dark connected blobs in the bands
      5.5-9.0 and 34-37.3 mm, give the 24 column centres 12.50 ... 112.26 | 129.49 ... 229.37 |
      246.60 ... 346.36. A least-squares line per block with the pitch held at 14.251 fits every
      lamp within 0.062 mm (half a pixel) and puts the blocks' first columns at 12.50, 129.55 and
      246.59; the cells are placed on that line, so neighbours abut rather than overlapping by
      the measurement's jitter - a pitch of 14.251 inside each block (the registry's 14.25 ganged
      SFP cell) and blocks repeating on 117.05 mm, eight pitches plus a 3.05 mm gutter. Lamp
      centres and cage centres agree: column 1's opening reads 5.6-19.5, centre 12.55.
      Openings 10.1-19.0 and 23.6-32.4 down, so the std/sfp-ganged cells sit at y 9.35 and
      22.8; the silver cage frames run 9.5-19.7 and 22.9-33.2 around each row of eight.
  qsfp28-block:
    confidence: measured
    note: >-
      Front figure: four lamp rings per port at 4.00 mm spacing, port centres 365.66, 384.65,
      403.64 and 422.70 (a 19.0 mm pitch); openings 10.0-18.7 and 23.8-32.4 down. Each is the
      registry's std/qsfp-ganged cell (18.5 x 9.58) centred on its lamps. Each port has its own
      silver cage in the figure, which the renders show standing proud of the bezel.
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention: the upper SFP28 and QSFP28 cages upright (rotate 0), the
      lower turned 180, belly-to-belly with both cage lips in the band between the rows. Decided
      by the rule, not an observation - the figures draw the openings and not the tabs.
  port-leds:
    confidence: datasheet
    note: >-
      Guide Table 2: 'One Port Link/Activity status Green/Amber bi-colored LED is provided for
      each front panel port' - one ring above each upper SFP28 port and one below each lower,
      at y 7.05 and 35.55. Table 1: four LEDs per QSFP28, all four used in 4x25G or 4x10G mode
      - four rings above each upper QSFP28 at y 6.69 and four below each lower at 35.86. Drawn
      as common/led-dot@1 (2 mm) at the measured centres; the rings measure 2.4-2.55 mm.
  front-legends:
    confidence: measured
    note: >-
      Front figure at 2x: every column pair is labelled '1 ▲▼ 2' in the band between the rows,
      centred on the column (baseline about 22.1), SFP28 and QSFP28 alike. Nothing else is
      printed on the front in the figure. The Foleon render adds the 'Celestica' wordmark at the
      top left, over the vent row; it is not drawn because its position cannot be taken from an
      angled view without landing on the vents.
  lug-tag:
    confidence: measured
    note: >-
      Front figure: a black pull tab at 390.6-413.0 x 38.7-42.5 mm interrupting the bottom vent
      row, which the Foleon render prints 'DS2000'; seated as celestica/lug-tag@1 (the card the
      DS3000/DS3001 modeller measured at 23.0 x 4.0) with that label. The rear has a second slot
      under the management cluster, 216.2-237.0 x 40.4-42.6 at 6x, printed 'L.T' at its left; the
      same card is seated there, centred on it, with no label, because none is legible. Both
      are seated unrotated, lip at the right as the part draws it: at 6x the front tab and the
      rear slot are symmetric end to end, so no lip is resolved and the orientation is the
      part's default, not a reading.
  vents:
    confidence: measured
    note: >-
      Front figure: one row of slots along the top edge (8.8-426, y 1.1-2.8, 4.97 mm pitch) and
      one along the bottom (5.8-428, y 40.2-42.2, about 4.0 mm pitch) broken by the lug tag.
  rear:
    confidence: measured
    note: >-
      Rear figure at 1.6-4x. Supplies at 16.0-89.5 and 352.4-425.9 (73.5 each), y 2.0-42.0.
      Fan modules: the four red latch blocks centre on 137.06, 184.77, 280.20 and 327.98 and
      sit 28.2 mm into each face, so the faces start at 106.12, 153.77, 249.20 and 296.98, 39.1
      x 39.0 at y 2.95 (the rightmost read directly at 297.0-336.05 x 2.95-41.9). Management
      cluster 205.5-222.8 x 2.6-35.5: the MGMT jack 206.5-222 x 3.5-13.5 with green windows in
      both upper corners (a lamped jack, keyway up - `rotate: 180` on a part that draws keyway
      down), the USB-A 207-221.5 x 15.8-21.5, the CONSOLE jack 22.8-32.8 with its keyway at the
      bottom. Beside them, printed on end, MGMT, the USB trident and CONSOLE; then four lamps
      at x 228.7, y 14.9 / 19.9 / 25.0 / 30.2, labelled on end PSU, FAN, ALM, STAT from the
      top; a RST pinhole at (235.0, 32.4). A captive screw at (243.5, 7.5) over a lever
      240-247 x 12-35 closes the cluster; which part that lever releases is not documented.
      Round guide holes between the modules are drawn as dark decor.
  status-lamps:
    confidence: datasheet
    note: >-
      Guide Table 3 'Front Panel Status LEDs' lists PWR, FAN, ALM and STAT - but the front
      figure carries no status lamps at all and the rear figure prints PSU, FAN, ALM and STAT
      beside four lamps, and the datasheet says management is on the rear. The table's own
      heading is taken to be carried over from a sibling; the lamps are drawn where the figure
      shows them and named as printed. See the status-lamp-table gap.
  rear-numbering:
    confidence: estimated
    note: >-
      Table 4 names the fan lamps FAN1-FAN4 and the supply lamps P-1 / P-2; neither figure prints
      a numeral at a fan or supply bay legibly. Numbered left to right as seen from the rear.
  ground-lug:
    confidence: datasheet
    note: >-
      The guide's Ground Lug Installation fits a two-hole lug bracket (R1004-F0104-01) to the
      side wall at the rear corner and says 'The GLA is not applicable to the AC SKU versions';
      every SKU listed is AC. It is an accessory screwed on outside the panel and is not drawn.
  colour:
    confidence: photo-measured
    note: >-
      Black bezel and black fan faces in the Foleon renders and the datasheet picture; the
      guide's CAD shades everything grey; lid, walls and rear are bright metal. As on the DS1000
      and DS4000, chassis.color is the sheet metal (#c4c8cc) and the black front is a full-face
      bezel plate at the bottom of the front decor - a black faceplate on a silver chassis.
  power:
    confidence: datasheet
    note: >-
      datasheet POWER AND COOLING: 'DS2000 power consumption < 500W maximum', 'DS2000 typical
      power < 350W at 25 C', '100 - 240VAC auto-ranging, 47-63Hz or, 180-300VDC auto input 1+1
      redundant, hot swap PSUs', '3+1 redundant fans'. The guide's spec table leaves Power
      Consumption blank. The datasheet does not say what optics population either figure
      assumes, so the envelope is unstated. Each supply is 550 W output (guide PSU page).
  environment:
    confidence: datasheet
    note: >-
      Both documents: 0 - 45 C at 900 m, either airflow. Humidity: datasheet 5 % to 90 %
      non-condensing, guide spec table 5 % - 95 %; see the humidity-disagree gap. Weight 9.1 kg
      is the guide's; the datasheet gives none.
  ds2500:
    confidence: datasheet
    note: >-
      The issue that requested this device lists 'DS2000 / DS2500'. Every held source was
      searched for DS2500: the guide's 11 pages and 17 figures (0 hits), the 091024 datasheet
      text (0 hits in its text, though Celestica's URL for it is /hps/ds2500_ds2000), and the
      011524 STORDIS copy,
      whose page-2 running header reads 'DS2500/DS2000 1U 48-port 25GbE Data Center Switch' and
      whose trademark line names 'DS2500/DS2000'. Neither revision gives a DS2500 order code,
      specification or figure; both order tables list only R4041 DS2000 codes. The Foleon page
      and the documentation portal have no DS2500. So DS2500 is a NAME that appears alongside
      DS2000 on one datasheet revision and in a URL, with no separate hardware documented;
      nothing here models it, and no alias is recorded because no document says it is this box.
attrs:
  performance:
    switching-capacity: 2.0 Tbps
    packet-buffer: 32 MB
    latency: less than 500 ns port to port (cut-through)
  power:
    power-max-w: 500
    power-typical-w: 350
    power-envelope: unstated
    psus: 2 x 550 W AC hot-swap CRPS, 1+1 redundant
    input-ac: 100-240 VAC auto-ranging, 47-63 Hz
    input-dc: 180-300 VDC auto input (datasheet; no DC SKU is listed)
  thermal:
    fans: 4 hot-swap fan modules, 3+1 redundant
  environmental:
    operating-temp: 0 to 45 C at 900 m
    humidity: 5% to 90% non-condensing
    mtbf: in excess of 150,000 hours
  platform:
    cpu: Intel Denverton x86 (up to 8-core), 8-32 GB ECC DDR4, configurable M.2 SSD
    bmc: DDR3 1-4 Gb, SPI flash 8-64 Mb dual boot, NC-SI shared management port, IPMI 2.0, SOL
    onie: ONIE installer for third-party network operating systems
  features:
    optics-sfp28: >-
      datasheet 'Transceivers: SFP28 upto 2W'; guide Table 6 lists 10GBASE SR/LR optics and
      copper DAC 1 m 30 AWG, 3 m 28 AWG, 5 m 26 AWG.
    optics-qsfp28: >-
      datasheet 'QSFP28 upto 5.5W power, DAC (to 5m passive)'; guide Table 6: 100GBASE-SR4 over
      OM3/OM4, 100GBASE-LR4 (10 km), 100GBASE-CR4 1/3/5 m, and 4 x 25G breakout by cable
      without a reboot.
    timing: IEEE 1588 1-step and 2-step, TC and BC mode, SyncE recovery (option)
    routing-tables: up to 48K MPLS labels, up to 324K L3 LPM, up to 18K ACLs
    eee: 802.3az
  management:
    mgmt-ports: >-
      rear: 1 x RJ45 CPU/BMC shared Ethernet management (10/100/1000), 1 x RJ45 serial console
      (9600-115200 8N1), 1 x USB 2.0 Type A host (data only)
  compliance:
    emc: CN (GB9254-2008), EU (EN55022, EN55024), FCC, VCCI, CCC
    safety: IEC60950-1, GB4943, UL/CSA, CB, CCC
  lifecycle: {eol: none-announced}
chassis: {width: 438, height: 44, depth: 520, ru: 1, weight-kg: 9.1, color: '#c4c8cc', airflow: front-to-back, power: ac}
gaps:
- what: four-undrawn-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, underside and side walls. The guide's three-quarter chassis figure and
    the Foleon renders show the lid (two finger recesses, a label panel, a long pressed rib) and
    the right wall (rail screws) at an angle - visible, not measurable. Sized and left bare.
- what: status-lamp-table
  scope: [rear]
  reason: sources-disagree
  wanted: >-
    Which face the system lamps are on, and what the first one is called. Guide Table 3 is
    headed 'Front Panel Status LEDs' and lists Power (PWR), Fan, Alarm and System (STAT); the
    front figure has no status lamps and the rear figure prints PSU, FAN, ALM, STAT beside four
    lamps in the management cluster. Drawn as the figure shows and prints them.
- what: fan-latch-colour
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    Which airflow each latch colour marks. The guide's rear figure draws the fan latches red;
    the Foleon rear render draws them blue. No document says which build is which, so both
    configurations draw the guide's red.
- what: humidity-disagree
  scope: [front]
  reason: sources-disagree
  wanted: >-
    Operating humidity: datasheet 5 % to 90 % non-condensing, guide spec table 5 % - 95 %.
    attrs carries the datasheet's.
- what: wordmark
  scope: [front]
  reason: needs-drawing
  wanted: >-
    An orthographic view with the printing. The Foleon render prints 'Celestica' at the top
    left of the bezel, apparently over the vent row; the guide's CAD prints nothing there.
    Not drawn.
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
  sfp28-leds: {term: LED, role: indicator, index-origin: 1}
  qsfp28-leds: {term: LED, role: indicator, index-origin: 1}
  status-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the rear management cluster - the CPU/BMC shared RJ45 management jack, a USB 2.0 Type A
      port, the RJ45 RS-232 console and the reset pinhole. Three media and a button, one
      purpose: reaching and resetting the box when the data plane cannot.
  furniture: {term: Item, role: furniture, index-origin: 1, description: 'the two lug tags, the USB glyph and the rear screws'}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        datasheet: '1+1 redundant, hot swap PSUs'. Each supply is 550 W output against a
        chassis maximum under 500 W, so one carries the box.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 3+1
      redundancy-note: >-
        datasheet: '3+1 redundant fans'; the guide: 'DS2000 switch contains four fan modules in
        the standard configuration'. Four bays, and the figure and the redundancy agree.
