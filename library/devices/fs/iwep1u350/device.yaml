format: 1
kind: device
name: iwep1u350
version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: IWEP1U350
aliases:
- {name: '175749', kind: vendor, note: FS shop product ID}
description: >-
  1U 19in vented cantilever shelf with a rear lip, FS IWEP1U350: a black SPCC steel tray 441.4
  mm wide reaching 350 mm behind the front rails, its side walls 28 mm high at the front and full
  height at the rear and folded out into ears that bolt to the front rails, with a lip along the
  back that stops equipment sliding off. Twenty-five diagonal vent slots; it carries 60 kg on
  2- or 4-post racks.
profile: passive
provenance:
  chassis:
    confidence: datasheet
    note: >-
      the specification gives 44.0 x 482.6 x 350 mm over the ears, which is the part: the ears
      are built in (provenance.ears). The tray between them is 441.4 (see provenance.tray-width).
  ears:
    confidence: drawing
    note: >-
      THE EARS ARE BUILT IN: each is the side wall's front end folded out flat, one piece with
      the tray (the renders g1 and g4 of SKU 175749), so under the owner's rule of 2026-10-09
      they are part of the face and always drawn - 20.6 each side, the face the full 482.6, with
      their slots.
  sheet:
    confidence: estimated
    note: >-
      `shell: sheet`, 1.2: the shelf is bent sheet steel and open air (docs/cable-managers-design.md
      section 4); FS states the material and not its gauge. Its solid in 3D is the floor (a well
      on the top view, 42 deep in the 44 envelope - the deepest a sheet body builds, so the floor
      is drawn 2 thick where the sheet is about 1.2), the two side walls standing on it to their
      profile, and any rear lip; the six views are elevations.
  hosting:
    confidence: datasheet
    note: >-
      the surface a device stands on is the floor between the two walls, 439.0 x 350 mm (the body
      less two 1.2 walls), recorded in `attrs.physical` as usable-width-mm and usable-depth-mm;
      the load is the datasheet's "Weight Capacity - Stationary" 60 kg. Hosting devices on it
      is #935's.
  mount-depth:
    confidence: datasheet
    note: >-
      cantilever: the shelf bolts to the FRONT rails only through its two ears (2 or 4 post racks)
      and nothing supports its rear; its depth is the tray's reach behind the front rails, not
      a rail-to-rail span.
  eia:
    confidence: registry
    note: >-
      EIA-310 hole positions: the rail holes of each rack unit stand 6.35, 22.225 and 38.1 mm
      up from its bottom, and the two rails' holes are 465.1 mm apart across the rack. The part
      is taken as centred in the rack units it fills.
  color:
    confidence: photo-measured
    note: >-
      black powder-coated steel, as every render shows.
  lifecycle:
    confidence: estimated
    note: >-
      checked 2026-10-09 against what the intake holds: the FS documentation portal's Accessories
      tree, read on 2026-10-08, carries no end-of-sale notice for this part. The product page
      (SKU 175749) was live on 2026-10-08. No web search beyond FS's own pages was made.
  method:
    confidence: drawing
    note: >-
      the IWEP1U350 datasheet (portal 4870) for the figures and its three-view drawing in mm;
      the gallery renders, which IWEP1U350 and IWEP1U550 share byte for byte (so no render tells
      the two apart; depth comes only from the datasheets); FS's Visio stencil (master IWEP1U350).
      There is no quick start guide.
  tray-width:
    confidence: photo-measured
    note: >-
      441.4 between the walls: the datasheet's top view is not to scale across (its tray reads
      wider than the 482.6 front view), so the width is taken from the plan render at the scale
      its stated 350 depth gives.
