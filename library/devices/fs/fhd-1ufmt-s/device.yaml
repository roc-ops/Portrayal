format: 1
kind: device
name: fhd-1ufmt-s
version: 1.0.0
maturity: modelled
manufacturer: FS.com
model: FHD-1UFMT-S
description: >-
  1U 19in fiber enclosure with a sliding and tilt-down drawer. FS SKU 145167 - the
  front plate and its four FHD modules slide out and tip down for access; up to four
  adapter panels, MTP/MPO cassettes or splice trays, 144 fibres (LC) in 1U.
profile: optical
provenance:
  method:
    confidence: drawing
    note: >-
      FROM THE VENDOR'S VECTOR DRAWING, p4 of fhd-1ufmt-s-fiber-enclosure-datasheet.pdf
      (front, top and side views), measured at 2400 dpi where it needs measuring.
  chassis:
    confidence: drawing
    note: >-
      top view: body 17.6in [448] across (17.5in [444] inside), 11.2in [283.2] deep behind
      the front plate; 12.1in [307.6] and the side view's 12.2in [311] include the front
      plate, knobs and the rear bracket. The spec table's 44.0 x 482.6 x 311.0 is that
      overall depth; `chassis.depth` takes the body, as fs/fhd-1ufce's does.
  cutouts:
    confidence: drawing
    note: >-
      front view at 2400 dpi, 19.17 px/mm on the 482.6 plate, stroke centres: openings 90.0
      wide at 31.30-121.32, 141.32-231.31, 251.32-341.30, 361.31-451.30 of the plate - an
      exact 110.0 pitch, centred - and FS prints 3.5in [90] x 1.42in [36]. Drawn 90.0 x 36.0
      centred on the plate's height; the drawing's lower edge line is the tray lip, not the
      opening.
  bays:
    confidence: drawing
    note: >-
      THE MODULES MOUNT ON THE FRONT PLATE, NOT INSIDE IT. The front view punches four
      openings 3.54in [90] across and 1.42in [36] tall; a module's 108.97 plate covers its
      opening, its thumb-knobs landing in the pair of holes either side (3.91in, 99.4 apart
      on the panel drawings), and only the adapter block behind passes through. So each bay
      is the module plate's 108.97 x 35.05, centred on its opening, and `opening` is the
      hole an empty slot shows. Adjacent plates stand about 1.0 apart. every FHD cassette
      and adapter panel this library models is in every bay's `accepts`. FS states it on
      this datasheet's features list ('Compatible with all FHD cassettes and panels') and
      prints the same loading list with every one of them as fs/fhd-1ufce does; the module
      face is one 4.29 x 1.38in (108.97 x 35.05) envelope.
  ears:
    confidence: drawing
    note: >-
      drawn as common/rack-ear@1 outside the 448 body under `ears`.
  envelope-faces:
    confidence: drawing
    note: >-
      rear, top, bottom, left and right are the envelope; the tilt hinge and slide rails are
      not drawn. See `gaps`.
chassis:
  width: 448.0
  height: 44.0
  depth: 283.2
  ru: 1
  color: '#1b1e21'
  airflow: passive
gaps:
  - what: face-detail
    scope: [front, rear, top, bottom, left, right]
    reason: needs-photo
    note: >-
      the drawing gives the openings and the envelope; the drawer's rails, the tilt hinge,
      the rear cable management and any printing are not located anywhere held. FS's gallery
      for 145167 is three-quarter renders.
    wanted: >-
      a square-on photograph of the front and of the drawer pulled and tilted.
groups:
  furniture:
    term: Item
    role: furniture
    index-origin: 1
  slots:
    term: Slot
    role: service
    index-origin: 1
    description: >-
      four slots, each taking one FHD module - an adapter panel or an MTP/MPO cassette -
      numbered left to right. The datasheet's capacity row reads 4 ports, 144 fibres (LC).
