format: 1
kind: device
name: fanp3u3f
version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: FANP3U3F
aliases:
- {name: '173817', kind: vendor, note: FS shop product ID}
description: >-
  3U 19in rack fan panel, FS FANP3U3F: one black die-cast plate 130 x 483 mm carrying three 120
  mm fans behind stamped grilles, a red rocker switch, and a fixed mains cord with a US plug out
  of the back. Mounted low in the rack, it moves 240 CFM from front to back; 110-120 V, 15 W.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      the FS Cooling Fan datasheet (portal 6624) and the product page (SKU 173817) for every figure;
      the straight-on gallery renders g1 (front) and g5 (rear) for the layout; the quick start
      guide V1.0 (portal 5035) for the cord, the plug and the screw kit. FS publishes no drawing
      of the part and no Visio stencil.
  chassis:
    confidence: datasheet
    note: >-
      130 x 483 x 44, the product page's HxWxD (the datasheet prints 483x130x44 under the same
      heading, axes scrambled). THE FACE IS ONE DIE-CAST PLATE WITH ITS EARS IN IT: the slots
      at the four corners are in the same sheet as the grilles (g1, x3), so the face is drawn
      at its full 483 (the owner's rule of 2026-10-09; lint L43 stands down for a body this wide).
      The 44 is the fans' depth behind the plate; the 3D body is one 483 x 130 x 44 box, where
      the real fans are three 120 mm boxes behind the plate.
  height:
    confidence: photo-measured
    note: >-
      the straight-on render g1 measures the plate 132.3 tall at its 2.888 px/mm across the 483;
      the dimensioned render x2 prints 5.12 in (130 mm), and a 3U opening is 133.35. 130 is drawn;
      see gaps.
  grilles:
    confidence: photo-measured
    note: >-
      three stamped grilles 114 across, centred 85.9, 221.8 and 357.9 in from the left end on
      the plate's middle (g1 at 2.888 px/mm, each centre the midpoint of a pair of opposite spokes;
      pitch 136.0), the fans' four screws 105 apart each way around each. The library's `grille`
      vent pattern stands in for FS's concentric slots and spokes.
  slots:
    confidence: photo-measured
    note: >-
      four slots 10.4 x 6.6, 8.9 in from each end (g1). Their heights are EIA-310's top hole of
      the upper unit and bottom hole of the lower unit; on the render they stand 5.7 below the
      top and 8.2 above the bottom, an asymmetry a 130 mm plate cannot have and still meet the
      rail holes, so the render is not taken for the heights.
  eia:
    confidence: registry
    note: >-
      EIA-310 hole positions: the rail holes of each rack unit stand 6.35, 22.225 and 38.1 mm
      up from its bottom, and the two rails' holes are 465.1 mm apart across the rack. The part
      is taken as centred in the rack units it fills.
  switch:
    confidence: photo-measured
    note: >-
      a red rocker switch (common/rocker-switch@1, turned 90 so its I end is at the top as the
      close-up x5 shows) in a black bezel 18.8 x 23.2, centred 446.0 in and 94.5 down (g1, scaled
      to the 130 mm height). The QSG's last step draws the same switch.
  switch-colour:
    confidence: known-wrong
    note: >-
      the rocker is red on every render (g1, x5); it is drawn in the library rocker's dark grey,
      because common/rocker-switch@1 has no colour field.
  cord:
    confidence: drawing
    note: >-
      the quick start guide draws the power cord leaving the back of the panel at its switch end
      and ending in a two-blade grounded US plug (fs/fan-cord-5-15p@1, NEMA 5-15P); the rear render
      g5 shows it leaving a white terminal block at that end. Its position on the back is estimated.
  rear:
    confidence: photo-measured
    note: >-
      the rear render g5: the plate's back, three fans in square frames with wire finger guards,
      the terminal block and the cord at the switch end. Drawn seen from behind, so the switch
      end is at the left.
  airflow:
    confidence: datasheet
    note: >-
      the product page: "Air Flow 240CFM, Front-to-Back" and "The fans move hot air out of the
      rack at 240 CFM from the front to the rear".
  attrs:
    confidence: datasheet
    note: >-
      the FS Cooling Fan datasheet (portal 6624), one table for FANS1U2F, FANS1U4F and FANP3U3F,
      and the FANP3U3F product page. The datasheet prints every model's dimensions as "HxWxD 483x170x44"
      and the like, its axes scrambled. The 15 W is "Input Power 15W" with no qualifier, filed
      as the maximum.
  mark:
    confidence: drawing
    note: >-
      FS prints its mark beside the switch; it is a logo and is not drawn.
  color:
    confidence: photo-measured
    note: >-
      black painted die-cast aluminium, as every render shows.
  sides:
    confidence: estimated
    note: >-
      the plate's edge and the end fan's body behind it; no image shows a side square-on.
  lifecycle:
    confidence: estimated
    note: >-
      checked 2026-10-09 against what the intake holds: the FS documentation portal's Accessories
      tree, read on 2026-10-08, carries no end-of-sale notice for this part. The product page
      (SKU 173817) was live on 2026-10-08. No web search beyond FS's own pages was made.
