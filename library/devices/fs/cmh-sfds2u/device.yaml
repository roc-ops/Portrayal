format: 1
kind: device
name: cmh-sfds2u
version: 0.1.1
maturity: modelled
manufacturer: FS.com
model: CMH-SFDS2U
aliases:
  - {name: '315743', kind: vendor}
description: >-
  2U single-sided high-capacity steel horizontal cable manager, FS SKU #315743: a black
  steel backbone between the rack ears carries ten moulded T-shaped fingers along its top
  edge and ten along its bottom, and a steel cover on four hinge clips closes the channel
  between the rows. Three rounded pass-through windows in the backbone lead cables to the
  other side.
profile: passive
provenance:
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the backbone is the mounting plane and the duct stands 116 mm in
      front of it (the plan of the datasheet), so the rear face of its two rack units stays
      free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. The FS High Capacity Horizontal Cable Managers
      datasheet (portal id 7671) draws CMH-SFDS2U as a plan and a front view, dimensioned
      482.60, 465.00, 88.03, 76.20 and 116.02. The embedded image is small (543 x 425,
      carrying a watermark): 0.666 px/mm across the 482.6, 0.668 down the 116.02 and 0.648
      down the 88.03, so it is near orthographic but resolves only about 1.5 mm. The
      straight-on renders of #315743 (front and back) are the second reading.
  chassis:
    confidence: drawing
    note: >-
      drawing - THE BODY BETWEEN THE EARS. 482.6 over the ears; the cover between them reads
      293 of 321 px, 440, the body every steel duct of this family shares. The ears, 20.6
      each, are not drawn. Height 88.0 is the cover, the same height as the ears on the
      front view, and the spec table; depth 116.0 the plan and the spec table (116.02).
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW DUCT. A sheet body whose six views are elevations; the solid is the
      backbone as a well 114 deep with its three windows open, the two rows of fingers in
      it, and the cover, which comes off. The rear view builds the back of the backbone as
      sunk plates round the windows.
  thickness:
    confidence: estimated
    note: >-
      estimated - no FS document states the gauge; 1.2 is taken, as for the other FS steel
      managers in the library.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 0.85 kg, the FS product page specification for #315743, as read at intake.
      It is less than the 1.04 kg of the 1U CMH-SFDS1U; recorded as FS states it.
  front:
    confidence: drawing
    note: >-
      drawing - the cover, fitted, as the front view draws it: 440 x 88 with four hinge
      clips, two on the top edge at 75.0 and 341.8 from the left end and two on the bottom
      at 119.4 and 297.0, the stagger CMH-SFDS1U carries. The finger rows are 9.0 thick and
      4.7 in from the top and bottom, ESTIMATED: the drawing has no side view, and they are
      taken from the same moulding on CMH-SFDS1U and CMH-DFDS2U.
  fingers:
    confidence: drawing
    note: >-
      drawing - ten fingers a row on the plan, in a three-finger and a seven-finger
      moulding, the same T-shaped finger as CMH-SFDS1U at the same pitch; 44.0 is taken so
      that ten fill the 440 body. The fork of each stem is drawn as the stem.
  top:
    confidence: drawing
    note: >-
      drawing - the plan, rear at y=0: backbone, blocks to 31.8, stems, heads from 95.4, and
      the cover edge.
  bottom:
    confidence: drawing
    note: >-
      drawing - the bottom row of fingers is the top row again.
  left:
    confidence: estimated
    note: >-
      estimated - no side view is drawn; the end elevation is built from the plan depths and
      the estimated rows. The duct is open at both ends.
  rear:
    confidence: photo-measured
    note: >-
      photo-measured - the back from gallery image 3, a straight-on render, at 3.015 px/mm
      across the 482.6 between the ear ends: three rounded rectangular windows 300 to 304 px
      wide, 100 mm, and 103 px high, 35 mm at the 88 of the plate, 50 apart, drawn symmetric
      about the middle from 20 to 420 across the body; the corner radius, 6, is estimated.
  guides:
    confidence: drawing
    note: >-
      drawing - the duct on the front view is the channel between the finger rows, run
      across the rack.
  capacity:
    confidence: estimated
    note: >-
      not stated - no capacity is carried: the high capacity datasheet has no capacity figure and
      the cable managers portfolio gives dimensions only, so the figure is the
      `cable-capacity` gap below, not a datasheet fact.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - style, sides, material and the UL 94 V-0 rating of the finger ducts are
      the Technical Specification table and overview of the FS High Capacity Horizontal
      Cable Managers datasheet (portal id 7671); indoor its Environment row.
  color:
    confidence: estimated
    note: >-
      estimated - no colour row in the datasheet; every render is black, drawn in the shades
      CMH-SFDS1U reads off its renders.
