format: 1
kind: device
name: uscmh-sfdabsb2u
version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: USCMH-SFDABSB2U
description: >-
  2U single-sided horizontal cable manager, FS USCMH-SFDABSB2U: a black ABS finger duct the full width of the rack, standing in front of the rails on a mounting plate behind it, with a double-hinged cover that opens upward or downward. Eleven fingers along the top edge and eleven along the bottom - seven straight two-rib fingers and two flat walls at each end - and the cover clips over their tips to close the channel.
profile: passive
provenance:
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the whole duct, mounting plate included, is the 168.5 of the
      side view in front of the rails, so the rear face of its rack units stays free for
      another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. The FS Horizontal Single Sided Manager datasheet
      (USCMH-SFDABSB1U and -B2U) has a specification table and, for the 2U part, a top
      view, a front view and a side view in millimetres on its third page, lettered
      CMH-SFDABSB2U. They are vector art, not embedded images, so the page was rendered
      at 600 dpi. The top view is 5.309 px/mm across its 482.59 and 5.41 down its 169.9
      (Ref), a 2 per cent difference; the front view 5.379 across and 5.46 down its
      88.81; the side view 3.436 along its 168.5 and 5.24 up its 84.33 and 74.33, which
      agree with each other - the side view is not to scale vertically, as on the 1U
      part. So widths come from the top and front views across, depths from the side
      view along, and heights from the dimensions and the side view's own vertical
      scale, never from one view's scale applied to another's axis. The part is
      portal-only: FS publishes no product page and no image of it, so there is no
      second reading.
  chassis:
    confidence: drawing
    note: >-
      drawing - THE DUCT IS THE RACK WIDTH. The specification table gives 2U as 88.8 x
      482.6 x 169.0 mm (3.49 x 19.00 x 6.65 in); the top view draws the duct 482.59 wide
      over its whole depth and the front view 88.81 high and the same width, so its
      front is the part itself and not a rack face with ears on (`ears: behind`). The
      depth is the side view's toleranced 168.5; the table's 169.0 and the top view's
      169.9 (Ref) are recorded in `gaps`.
  ears:
    confidence: drawing
    note: >-
      drawing - THE EAR FLANGE IS BEHIND THE DUCT, NOT AT ITS ENDS. The 1U part's front
      view draws ear folds 23.1 mm in from each end and holes 464.47 apart; the 2U part's
      draws neither - the duct runs the full 482.59 - and its top view draws a plate
      across the whole width at the very rear, where the screws stand, with the base
      rails in front of it. The side view draws that plate 74.33 high behind the 84.33
      finger walls. It is a different moulding, not the 1U part made taller: it bolts
      to the face of the rails through the ends of that plate and stands entirely in
      front of them, so `ears: behind`.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW DUCT, NOT A BOX, built as the USCMH-SFDABSB1U is: the base on
      the front view as a well 138.0 deep whose floor is the fronts of the two base rails
      behind the finger rows, the fingers standing in it, the cover in it across their
      tips, which lifts off and opens the channel, and the rails and mounting plate
      behind the well closed by plates sunk just inside the rear, top, bottom and side
      faces. The channel, the slots between the fingers and the two ends are open air.
  depth:
    confidence: drawing
    note: >-
      drawing - along the side view at 3.436 px/mm: the cover over the first 17.5 mm,
      the finger walls on to 138.0, the base rails behind them to 162.7, and the
      mounting plate at the rear, 74.33 high, from about 165.5 to the 168.5; the plate
      is taken as 3 thick. Between the rails the channel runs back to the plate. The
      top and bottom views draw the rails and plate as one 30.5 mm band, as the top
      view shows them.
  thickness:
    confidence: drawing
    note: >-
      drawing - 9.5, the finger walls' thickness across the height of the duct in the
      side view at its own 5.24 px/mm (50 px); no FS document states a wall gauge.
  front:
    confidence: drawing
    note: >-
      drawing - the cover, fitted, over the whole face: its shoulders a band 11.5 high at
      top and bottom and a hinge clip in each corner, read off the front view. The
      finger rows stand 2.24 to 11.74 and 77.07 to 86.57 down the face, the side view's
      84.33 finger walls centred on the 88.81 and 9.5 thick. The `duct` guide is the
      channel between them over the full width.
  fingers:
    confidence: drawing
    note: >-
      drawing - the top view at 5.309 px/mm: seven straight fingers on a 48.5 mm pitch,
      the middle one on the middle of the duct, each two ribs 8.3 wide with a 9 mm slot
      between them, 25.4 across over the straight run and flaring to 28.4 at the rail,
      which is not drawn; and two flat walls at each end, from the end of the duct to
      19.2 and from 40.5 to 60.1, drawn as one 19.4-wide part at 0 and 40.6. The gaps
      come out even, 23.1 between every pair. They are straight, where the 1U part's
      fingers have T-shaped tips. The hooked cable retainers the top view draws near the
      cover are not drawn. The top view shows one row; the bottom row is taken as the
      same, as the side view's two equal walls draw it.
  top:
    confidence: drawing
    note: >-
      drawing - the top view, rear at y=0: the mounting plate and base rails 30.5 deep,
      the fingers over the channel to the back of the cover, and the cover over the last
      17.5. The bottom is the top again.
  left:
    confidence: drawing
    note: >-
      drawing - the side view along the depth: the mounting plate at the rear, the ends
      of the two base rails, the two finger walls and the cover's edges over their tips.
      The duct is open at both ends, between the rails as well, and nothing is built
      across it. The right is the same, turned round.
  rear:
    confidence: drawing
    note: >-
      drawing - the mounting plate, 74.33 high and centred, across the full width, with
      the backs of the two base rails above and below it to the 84.33; built as plates
      sunk 0.05 inside the rear face. No window or pass-through is drawn in any view,
      and none is declared.
  guides:
    confidence: drawing
    note: >-
      drawing - the duct on the front view is the channel between the finger walls, run
      across the rack; the pitch and the gap are the top view's 48.5 and 23.1.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - style, material, colour, environment and the included accessories are
      the specification table of the FS Horizontal Single Sided Manager datasheet
      (USCMH-SFDABSB1U, USCMH-SFDABSB2U); RoHS and ISO 9001 are its Standards Compliance
      list.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". FS publishes no image of the part; it is drawn in the
      USCMH-SFDABSB1U's shades, the cover a little lighter than the duct.
