gaps:
  - what: depth
    reason: sources-disagree
    note: >-
      the side view dimensions the duct 168.5 +/- 1.00 deep, the specification table
      gives 169.0 (6.65 in), and the top view 169.9 (Ref). The side view's figure, the
      toleranced one, is drawn; the three agree to 1.4 mm.
    wanted: the FS product page specification table, or a ruler on the part
  - what: weight
    reason: vendor-silent
    note: >-
      neither the datasheet, the product portfolio nor the selector states a weight for
      USCMH-SFDABSB2U, and FS publishes no product page for it.
    wanted: the FS product page specification table
  - what: cable-capacity
    reason: vendor-silent
    note: >-
      FS states no cable capacity for USCMH-SFDABSB2U in any document held; the
      CMH-SFD1U family has a Cable Capacity Reference Guide table and this line does not.
    wanted: a capacity table for the USCMH finger ducts
  - what: mounting-holes
    scope: [rear]
    reason: vendor-silent
    note: >-
      the top view draws screws along the rear of the mounting plate but no view
      dimensions where it meets the rails or where its four floating nuts go; the plate
      is drawn plain.
    wanted: a rear view of the mounting plate, dimensioned
  - what: cover-hinge
    scope: [front]
    reason: vendor-silent
    note: >-
      the datasheet calls the cover double-hinged, opening upward or downward; the front
      view draws a clip in each corner but no view draws the hinge, and the cover is drawn
      as one fitted plate.
    wanted: a drawing of the cover's section
