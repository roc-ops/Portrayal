format: 1
kind: device
name: cmv-dfd45u5w
version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: CMV-DFD45U5W
aliases:
  - {name: '63030', kind: vendor}
description: >-
  45U dual-sided vertical cable manager, FS SKU #63030: a black ABS finger duct with a
  hinged PVC cover on each face, 2108 mm tall in two 22.5U sections, that stands beside a
  45U open-frame rack on four L-brackets. A moulded spine with eight oval pass-throughs
  carries a wall of fingers down each edge of each face, 23 a section at one rack unit
  apart, so it is two CMV-SFD45U5W channels back to back, one opening to the front of the
  rack and one to the rear, each 93 mm wide and closed by its own covers. It takes no
  rack unit.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. The FS Vertical Cable Managers with Finger Ducts
      datasheet (page 5) draws ONE 22.5U section of CMV-DFD45U5W three ways - a back view,
      a side view and a cover back view - and notes that the part is two of them, 83 in
      (2108mm) high. Its back view and its cover back view are the page 4 rasters of
      CMV-SFD45U5W byte for byte (the same embedded image twice, the same hash). The side
      view is a new raster, 800 x 1600, and orthographic: 1.169 px/mm across its 302 and
      1.170 down its 1022.4. The product-page renders of #63030 are the second reading (g4
      straight-on with the covers off, x1 dimensioned, g2 and g3 with the covers on, g5 and
      g6 close up on the channel).
  mount:
    confidence: drawing
    note: >-
      drawing - `rack-side`, as CMV-SFD45U5W: the datasheet lists the same four brackets,
      eight M6 screws and eight nuts, the Quick Start Guide V3.0 covers both parts, and FS
      compatibility matrix accepts it on the APC AR201 45U two-post only. Here the keyed
      bracket slots are in the spine between the two channels, where the side view draws
      them, so the brackets go in from the side of the duct that faces the upright. It
      occupies no rack unit; `ru: 45` is the height it runs beside. Which side of the
      rack is a lab placement to say (docs/vertical-cable-managers-design.md).
  chassis:
    confidence: drawing
    note: >-
      drawing - THE DUCT AS IT STANDS, covers fitted: `width` across the rack face
      direction, `height` the height it runs, `depth` front to back. 138.8 wide is the
      cover over the 125.4 body, both read off the back and cover back views that this
      page shares with CMV-SFD45U5W (the table gives 4.9 in, 125). 2108 high is the table
      and the note on the drawing, 83 in. 302 deep is the side view, 11.89 in [302mm],
      clip face to clip face; see `depth`.
  depth:
    confidence: drawing
    note: >-
      drawing - 302 SETTLED FROM THE DRAWING. The specification table and the dimensioned
      render (x1) give 12 in and 12.20 in (310); the side view prints 11.89 in [302mm]
      overall and 10.83 in [275.1mm] between the finger tips, and both land on its
      features at one scale, so the drawing wins and the 8 mm is a `gaps:` entry. The
      single-sided duct agrees with its drawing (165 stated, 165.1 drawn), which is why
      the dual figure in the table is the one taken as rounded or wrong.
  reuse:
    confidence: drawing
    note: >-
      drawing - EVERY PART IS THE CMV-SFD45U5W PART, ON BOTH FACES. The back view and the
      cover back view are the same rasters, so the back plate with its four ovals a section
      (fs/cmv-sfd45u5w-base@1) and the cover with its two hinge rails (-cover@1) are the
      same drawing. Measured on the side view against the page 4 side view, each half of
      the dual duct lands on the single-sided figures from its own clip face inward: the
      clip face to the tip front 13.7 against 13.6, to the back of the tip 25.7 against
      25.4, to the slot roots 114.6 against 114.8, all within half a millimetre; the
      fingers (-finger@1), clips (-clip@1) and walls (-wall@1) are the same parts, placed
      exactly as on CMV-SFD45U5W, front view and rear view alike. The clips are on the
      3rd, 5th, 11th, 13th, 19th and 21st fingers of a section on both faces, as there.
  sections:
    confidence: estimated
    note: >-
      estimated - THE TWO SECTIONS ARE DRAWN AS ONE LENGTH, the joint between them a seam,
      exactly as on CMV-SFD45U5W: each section half the 2108, 1054, its back plate 1022.4
      centred in it and its covers 1054 high, so they meet at the joint.
  shell:
    confidence: drawing
    note: >-
      drawing - TWO HOLLOW CHANNELS BACK TO BACK, NOT A BOX, as the horizontal dual duct
      fs/cmh-dfd1u is built. The body is a sheet body and its six views are elevations;
      the solid is what its parts build: on each working face the back plate as a well
      138.2 deep, its floor open at the eight pass-throughs, the two finger walls, 46
      fingers a wall standing in it, 24 clips and two covers that pull off and open that
      channel. The two floors stand 25.6 apart in the middle of the part (see `spine`);
      plates sunk 0.05 inside the top, bottom and side faces close the spine between them,
      and the ovals run through it from one channel to the other.
  spine:
    confidence: drawing
    note: >-
      drawing - the side view draws a spine down the middle, its two faces 24.8 apart at
      the scale of the view (138.6 and 163.4 from one clip face). Two wells of the
      single-sided 138.2 inside the 302 leave 25.6, which is taken; the 0.8 between the
      two is under one pixel of the source. The spine carries two keyed bracket slots a
      section, 18.8 deep and 48.7 high on the side view, centred 177.4 and 844.2 below the
      top of the section plate (26.25 in [666.8mm] apart, the figure the view prints), and
      two pairs of round bosses either side of it, 19 across and 21 in [533.4mm] apart,
      centred 246.2 and 779.7 below the plate top; they are painted on the side faces.
  thickness:
    confidence: estimated
    note: >-
      estimated - no FS document states a wall gauge. 1.5 is the cover plate, as on
      CMV-SFD45U5W; the parts carry their own thicknesses.
  front:
    confidence: drawing
    note: >-
      drawing - the front channel with its covers fitted, placed exactly as the CMV-SFD45U5W
      front: walls at 6.7 and 116.1, 23 fingers a section 44.44 apart, the first arm 13.03
      below the top of the section plate. Pulled, a cover opens the 93.4 channel with the
      ovals in its floor.
  rear:
    confidence: drawing
    note: >-
      drawing - the rear channel, the same parts placed the same way: the side view is
      symmetric about the spine, finger for finger and clip for clip, and the back view is
      symmetric about its centre line, so the rear channel seen from behind is the front
      channel seen from the front. Render g4 shows both rows of fingers with their covers
      edge-on. No `passes:` entry is declared on either face: the ovals join the two
      channels through the spine and reach neither outer face, as on fs/cmh-dfd1u.
  top:
    confidence: drawing
    note: >-
      drawing - the end of the duct seen from above, rear at y=0: the CMV-SFD45U5W plan
      for the front half, shifted 136.9 back, and the same plan turned round for the rear
      half, with the spine 138.2 to 163.8 between them. No view draws the end; it is the
      side view figures laid across the back view widths.
  bottom:
    confidence: drawing
    note: >-
      drawing - the bottom end is the top end again: the side view is the same at both
      ends of a section.
  left:
    confidence: drawing
    note: >-
      drawing - the side view of page 5, both sections, rear at x=0: the spine with its
      bracket slots and bosses, and each half the CMV-SFD45U5W side view (wall roots, 46
      arms and tips, twelve clips and the edge of the two covers), the rear half mirrored,
      with the joint a seam.
  right:
    confidence: drawing
    note: >-
      drawing - the left view mirrored: the duct is the same on both sides.
  guides:
    confidence: drawing
    note: >-
      drawing - each channel is the 93.4 between its two finger walls, run down the height
      (`run: y`); its finger pitch is the 44.44 of the side view and its gap the 25.5
      between arms, as on CMV-SFD45U5W.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - the cable capacity table of the same datasheet gives CMV-DFD45U5W per
      cable type and notes the copper figures are theoretical, for reference only; it
      states no fill. The figure stated is the Cat6 24AWG 6.1 mm row, 5490, twice the
      single-sided 2745: FS states it for the manager, both channels together, and it is
      not divided between them.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 16.80 kg, the FS product page specification table for #63030, and
      RECORDED AS SUSPICIOUS: it is 3.5 times the 4.75 kg of CMV-SFD45U5W, which is the
      same moulding, fingers and covers on one face. Two of those would weigh about 9.5.
      Nothing else FS publishes states a weight for #63030; see `gaps:`.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - style, materials (ABS backbone, PVC cover), colour, the detachable
      covers, the included brackets and fixings, the 45U open rack it matches and RoHS and
      ISO 9001 are the specification table and Standards Compliance list of the datasheet.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". Every image FS publishes of the part is a render; it is
      drawn in the CMV-SFD45U5W shades, the covers a shade lighter than the duct.
attrs:
  physical:
    weight-kg: 16.8
    material: ABS
    cover-material: PVC
    color: Black
    mounting-hardware: Brackets x4, M6*15mm Screw x8 and M6 Nut x8
  performance:
    cable-capacity: 5490
    cable-capacity-basis: >-
      Cat6 24AWG, 6.1 mm - a theoretical value for reference (FS Vertical Cable Managers
      with Finger Ducts datasheet), both channels together, which states no fill
  compliance:
    rohs: RoHS Compliant
    iso: ISO9001 Certificate
chassis:
  width: 138.8
  height: 2108.0
  depth: 302.0
  ru: 45
  mount: rack-side
  shell: sheet
  thickness: 1.5
  weight-kg: 16.8
  color: '#2a2c2e'
gaps:
  - what: depth
    scope: [top, bottom, left, right]
    reason: sources-disagree
    note: >-
      the specification table gives 12 in and the dimensioned render 12.20 in (310); the
      side view prints 11.89 in [302mm], which is drawn. If the covers stand proud of the
      clips the extra 4 mm a face would explain it, but no view shows that.
    wanted: a dimensioned drawing of the duct with its covers fitted, or a ruler on one
  - what: weight
    scope: [front]
    reason: needs-hardware
    note: >-
      16.80 kg (product page) is 3.5 times the single-sided 4.75 kg for what is, by the
      drawings, the same parts twice; about 9.5 would be expected. Possibly a shipping
      weight or a typing error. Stated as FS gives it.
    wanted: the part weighed, or FS confirming the figure
  - what: section-joint
    scope: [front, rear, left, right]
    reason: sources-disagree
    note: >-
      two 1050 covers on the drawing make 2100; the table and the drawing note give 2108,
      as on CMV-SFD45U5W. No document says where the 8 mm is.
    wanted: a dimensioned drawing of the assembled duct, or a ruler on a real one
  - what: bracket-stand-off
    scope: [left, right]
    reason: vendor-silent
    note: >-
      where the L-brackets put the duct relative to the upright is not dimensioned for
      either 45U duct; the bracket sheet (VRTCMB, 45.2 wide) is the only figure. The duct
      is drawn without its brackets, which FS sells and draws as a separate part.
    wanted: the AR201 upright and a dimensioned drawing of the bracket fitted
