format: 1
kind: device
name: cmh-uhd-sfdabs1u
version: 1.0.0
maturity: modelled
manufacturer: FS.com
model: CMH-UHD-SFDABS1U
description: >-
  1U single-sided UHD horizontal cable manager: a black ABS finger duct
  175 mm deep with a hinged cover. A back plate between the rack ears carries a
  wall of ten T-shaped fingers along its top edge and another along its bottom, each
  wall five moulded blocks of two, and the cover latches over the finger heads to close
  a channel that runs the width of the rack. The cover is 52 mm high, taller than the
  44 mm ears. Three pass-through windows in
  the plate lead cables to the other side.
profile: passive
provenance:
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the plate is the mounting plane and everything else stands in
      front of it, 175 mm on the plan, so the rear face of its rack unit stays free for
      another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. FS publishes one datasheet for the part
      (datasheet 12088, published 2026-10-06) with a front, plan, side and rear view;
      there is no product page, gallery, render or stencil, so the drawing is the only
      picture of it. The plan reads 3.682 px/mm across the 482.6 of the front and rear views and 3.69 down the 175 of the side view, so the views are orthographic. Its
      drawing is embedded as a 60 dpi raster, about 0.8 px/mm on the part, and every figure
      here is good to a millimetre and a half; the converted figures were measured, which
      are the same raster upsampled.
  chassis:
    confidence: drawing
    note: >-
      drawing - THE BODY BETWEEN THE EARS. The table gives 1.73"x19"x6.89" (44.0x482.6x175mm)
      overall. The ears are the ends of the flat back plate, 44 high with two slotted
      holes each, 465 between hole centres; they are not drawn, and they take 19.6 mm at
      each end. Height 52 is the cover, dimensioned on the front view over the 44 of the
      ear (51.7 measured; the side view reads 52.8 across the cover and 45.8 across the
      plate and the finger walls, at 3.69 px/mm). The cover overhangs the rack unit by 4
      mm above and 4 below, the plate and walls centred on it; the table's 44.0 is the
      plate and the rack unit, not the part. The five finger blocks span 443.4 between them on the plan (443.4 and 442.9
      on two drawings), and that is the width. `depth` is the vendor 175, all of it in
      front of the mounting plane.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW DUCT, NOT A BOX. Cables lie in the channel between the two finger
      walls, so the body is a sheet body (docs/cable-managers-design.md section 4) and its
      six views are elevations. The solid is what its parts build: the back plate on the
      front view as a well 172.4 deep, its floor the plate and open at the
      windows; the two walls of fingers standing in it; and the cover in it across the
      finger heads, which lifts off and opens the channel. The plate is built as the floor,
      inside the 175 envelope. The channel and its two ends are open air.
  thickness:
    confidence: estimated
    note: >-
      estimated - no FS document states a gauge for the ABS moulding. 2.6 is the back
      plate, drawn as two lines 10 px apart on the plan at 3.75 px/mm; the walls and the
      cover carry their own figures in their parts.
  front:
    confidence: drawing
    note: >-
      drawing - the cover, fitted, with its four latches, from the front view. The `duct`
      guide is the channel between the inner faces of the two finger walls, the side view, 3.69 px/mm down the 175: the two walls 9.5 thick stand flush with the top and bottom edges of the plate, 4 inside the edges of the cover, 26.8 apart; at the 9.8 of the line the channel is 24.4.
  top:
    confidence: drawing
    note: >-
      drawing - the plan, rear at y=0: the back plate, the solid root of the finger blocks,
      the ten stems on a 44.34 pitch and their T heads, and the cover across the front. The
      arms of the Y between each root and stem are not drawn on this elevation; the root of
      each finger builds them in 3D. The gaps between the stems are open air.
  bottom:
    confidence: drawing
    note: >-
      drawing - the side view draws two equal walls and the rear view two equal rows of
      blocks; the bottom is the plan again.
  left:
    confidence: drawing
    note: >-
      drawing - the side view: the plate, the two finger walls standing to the T heads, the
      hinge rails over them and the cover face, 52 high over the 44 of the plate and walls. The duct is open at both ends, and a cable
      runs out of it there: nothing is built across the ends.
  rear:
    confidence: drawing
    note: >-
      drawing - the back of the plate from the rear view, with its three pass-through
      windows (three obround windows 137.6 x 17.7 on a 150.0 pitch, 13.0 from the top edge: three rounded slots in the rear view, 506.5 px wide at 3.682 px/mm). The windows are drawn here square-cornered, as the
      plate round them; the floor of the well, which is what 3D builds, carries the corners.
      The rear view also draws the latches of the cover and the seams of the finger blocks
      through and past the windows; they are the parts behind, not marks on the plate.
  guides:
    confidence: drawing
    note: >-
      drawing - the duct on the front view is the channel between the finger walls, run
      across the rack. Its finger pitch is 44.34 and its gap the 33.14 between two
      stems; the neck between two T heads, where a cable is pressed in, is 4.14.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - "Cable Capacity (Theoretical Value)" in the specification table, 96
      pcs (Cat6 24AWG). FS gives one cable type and no fill basis for this part. Not
      divided between the walls: FS states it for the manager.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - material, colour, style, the mounting hardware, the operating temperature
      and humidity, and the indoor environment are the specification table; the UL 94V-0
      rating of the finger ducts is stated in the overview of the same datasheet.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". FS publishes no photograph or render of the part; the
      shades are the ones the CMH-SFD1U renders give the sibling ABS duct, base, walls and
      cover.
attrs:
  physical:
    material: ABS
    color: Black
    mounting-hardware: M6*15mm Screw x4 and M6 Nut x4
  performance:
    cable-capacity: 96
    cable-capacity-basis: >-
      Cat6 24AWG, a theoretical value - FS CMH-UHD-SFDABS1U datasheet specification table, which
      states no fill basis
  environmental:
    operating-temp: -10 to 60°C (14 to 140°F)
    operating-humidity: 95% Relative Humidity (max.), Non-condensing
  compliance:
    environment: Indoor
    flammability: UL 94V-0 (finger ducts)
  lifecycle: {eol: none-announced}
