format: 1
kind: device
name: fhd-cmp5dr
version: 1.0.0
maturity: modelled
manufacturer: FS.com
model: FHD-CMP5DR
aliases:
  - {name: '72911', kind: vendor}
description: >-
  Horizontal single-sided lacer panel that takes no rack unit of its own. FS SKU #72911,
  sold as "0RU": a black steel tray with five detachable polycarbonate D-rings that bolts
  to the rack rails in front of, or behind, another 1U device and stands 110 mm out from
  the rail face. FS gives its capacity as 30 Cat6 24AWG cables, theoretical.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FIRST, FROM THE VENDOR'S OWN DIMENSIONED DRAWING. The three-view drawing in
      FS's 0U/1U Horizontal Cable Manager Datasheet (updated 2025-05-11) is a 1142 x 767 px
      raster, the size it is embedded at, so nothing is gained by rendering the page. Its
      scale is 1.331 px/mm from the 483 dimension line (643 px), and the 465 (619 px), 110
      (146 px), 44 (58 px) and 31.5 (42 px) lines all agree with it to a pixel, on both
      axes: the drawing is orthographic and carries geometry, to 0.75 mm.
  chassis:
    confidence: drawing
    note: >-
      drawing - the same three-view: 483 overall and 44 high on the front view, 110 deep on
      the plan. The datasheet's table gives 44 x 482.6 x 109 mm (1.73 x 19.00 x 4.29 in);
      the depth taken is the drawing's 110, which measures 109.7, and the table's 109 is
      4.29 in. `ru: 1` is the rack unit the ears span, from the 44 and the table's
      "Number of Rack Units: 0U" read as what it occupies. The 483 INCLUDES THE EARS, as
      it must on a part that is a bracket: the tray's body is 448.4 between them.
  mount:
    confidence: drawing
    note: >-
      drawing - FS's Horizontal Cable Managers Quick Start Guide V2.0 draws the part's ear
      laid over the ear of an FHD fibre enclosure, one fastener each side, with the tray
      hanging in front of the enclosure's face. Not dimensioned, and the only host drawn
      is that enclosure. The datasheet says it mounts "on either the front or rear".
  thickness:
    confidence: datasheet
    note: >-
      datasheet - FS's product page for #72911: "rugged 1.5mm cold-rolled steel".
  weight:
    confidence: datasheet
    note: datasheet - "Weight 1.05lbs (0.52kg)" in the 0U/1U datasheet's table.
  top:
    confidence: drawing
    note: >-
      drawing - the plan view. Rings centred 35.7, 131.1, 241.5, 351.9 and 447.3 mm along
      the 483, so 95.4 between the outer pairs and 110.4 between the inner, symmetric
      about the middle. The front view of the same drawing puts the five posts at the same
      five places; it is a second view of one model and not a second source.
  rear:
    confidence: drawing
    note: >-
      drawing - the front view: an ear at each end, 17.3 wide and 44 high, with fixing
      holes 9 mm in from the end (the 465 between centres) and 31.5 apart. A third hole
      between them is in the quick start guide's figure and FS's close-up render. The
      ear part draws all three on its own centreline, 8.65, and their sizes are
      estimated; its contract says so.
  front:
    confidence: drawing
    note: >-
      drawing - an elevation: the ears, the edge of the tray and the five rings end-on,
      projected from the plan and ring-profile views. None of it lies in the front plane,
      and none of it is built in 3D from this view.
  top-arms:
    confidence: drawing
    note: >-
      drawing - each arm sweeps up from the flat tray into the upright ear, and the
      ring-profile view draws that as a sloped web. Built as a flat strip of floor, an
      upright ear, and a web on the arm's outer edge: one plate whose top edge follows
      the slope.
  top-rings:
    confidence: drawing
    note: >-
      drawing - each ring is an open loop: the slit at its top front corner, 3.8 mm, is
      where a cable is laid in. It also turns through 360 degrees and lifts out, and is
      drawn fitted, across the tray. FS's mark, stamped on the tray by the right-hand
      ring, is not drawn: a vendor mark never is.
  ears:
    confidence: drawing
    note: >-
      drawing - THE EARS ARE DRAWN, where every other device in the library leaves them
      off. They are not something added to this part: they are the same sheet as the
      tray, and the part is nothing but them and what hangs off them.
  views:
    confidence: drawing
    note: >-
      drawing - left and right are the ring-profile view of the same drawing. The bottom
      is the plan again from underneath - the strip, the arms and the slots - without
      the fillets where the arms meet the strip.
  color:
    confidence: estimated
    note: >-
      estimated - "Steel, Powder-coated Black" and "Color: Black". Every image FS
      publishes of the part is a render.
