format: 1
kind: device
name: fhd-2ufce
version: 1.0.0
maturity: modelled
manufacturer: FS.com
model: FHD-2UFCE
description: >-
  2U 19in slide-out fiber enclosure. FS SKU 73205 - the FHD-1UFCE's sliding drawer
  at twice the height, eight FHD adapter panels or MTP/MPO cassettes in two rows of
  four behind a removable door, up to 288 fibres (LC).
profile: optical
provenance:
  method:
    confidence: drawing
    note: >-
      from the family datasheet fhd-slide-out-fiber-enclosure-datasheet.pdf: p2 spec table,
      p7 front view and assembly illustration, p8 top view.
  chassis:
    confidence: drawing
    note: >-
      p7 front view: body 17.6in [447.0] across within 19in [482.6], 3.46in [88.0] tall. p8
      top view: body 16.96in [430.7] deep, 18.19in [462.1] overall. The spec table's 431.7
      is the same body to rounding.
  bays:
    confidence: estimated
    note: >-
      the front view is the closed door, so nothing dimensions a slot. The assembly
      illustration (p7) shows two rows of four FHD modules side by side in the drawer, as
      the 1UFCE carries one; each bay is the module envelope 108.97 x 35.05, the four
      abutting and centred across the 447 body as fs/fhd-1ufce's are across 448 (margins
      5.56), and the two rows spaced evenly in the 88 height (5.97 above, between and
      below). The spacing is ESTIMATED. every FHD cassette and adapter panel this library
      models is in every bay's `accepts`. FS states it on this datasheet's features list
      ('Compatible with all FHD cassettes and panels') and prints the same loading list with
      every one of them as fs/fhd-1ufce does; the module face is one 4.29 x 1.38in (108.97 x
      35.05) envelope.
  ears:
    confidence: drawing
    note: >-
      not drawn: the library's generic ear is 1U, and a 2U ear would be a new part with no
      source. The rack width is recorded here, 482.6.
  front-is-a-door:
    confidence: drawing
    note: >-
      the drawn front is the populated face behind the door, as fs/fhd-1ufce draws it; the
      door (p7 front view, two latches, the FS mark and FHD-2UFCE printed) is not drawn.
  rear-opening:
    confidence: estimated
    note: >-
      CARRIED FROM fs/fhd-1ufce, NOT SEEN HERE. The owner of the model reports the 1U slide-
      out's drawer open behind its slots (that device's provenance.rear-opening), and this
      is the same drawer at twice the height in the same datasheet, whose p7 illustration
      shows the trunk cables leaving through strain-relief brackets at the back. One hole
      per front slot, mirrored, running the 430.7 less an estimated 1.0 front plate.
  envelope-faces:
    confidence: drawing
    note: >-
      top, bottom, left and right are the envelope. No photograph of 73205 is held.
chassis:
  width: 447.0
  height: 88.0
  depth: 430.7
  ru: 2
  color: '#1b1e21'
  airflow: passive
gaps:
  - what: slot-layout
    scope: [front]
    reason: needs-photo
    note: >-
      the eight slots are placed by analogy with the 1UFCE and the assembly illustration; no
      view dimensions them, and FS's gallery for 73205 was not reached (the product page
      answered FS's human-verification check on 2026-09-25 and was not pursued).
    wanted: >-
      a square-on photograph of the open drawer front, or FS's gallery for 73205.
  - what: face-detail
    scope: [rear, top, bottom, left, right]
    reason: needs-photo
    note: >-
      the envelope faces carry nothing; the rear strain-relief brackets and grommets the
      illustration shows are undimensioned.
    wanted: >-
      a rear photograph.
groups:
  slots:
    term: Slot
    role: service
    index-origin: 1
    description: >-
      eight slots in two rows of four, each taking one FHD module, numbered left to right
      along the upper row and then the lower (the order is this model's; FS prints none).
      The datasheet's capacity row reads 8 ports, 288F.
