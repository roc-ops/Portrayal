gaps:
- what: datasheet
  reason: vendor-silent
  note: >-
    the data sheet FS links for this SKU is the FS-GR42U-PDUBK sheet, which is the cabinet bracket and no
    part of this one. The quick start guide carries no dimension and no weight.
  wanted: a data sheet or a drawing of FS-PDUBK from FS
- what: weight
  reason: vendor-silent
  note: >-
    no document held states the bracket's weight.
  wanted: the product page weight
- what: sheet-gauge
  reason: vendor-silent
  note: >-
    FS states the material, SPCC, and no thickness for any part of the bracket.
  wanted: the gauge of the sheet
- what: plate-lip
  scope: [left, right, top, bottom]
  reason: needs-drawing
  note: >-
    the far end of the plate turns back into a short lip, and three triangular gussets join the plate to
    the foot (the product page's photographs). No view dimensions either, so neither is drawn.
  wanted: a dimensioned drawing of the bracket from the side and from above
- what: slot-size
  scope: [left]
  reason: needs-drawing
  note: >-
    the guide gives no keyhole size and the dimensioned render gives only the pitch. The width scaled off
    it, 11.5, meets what the connectors registry states for `pdu-button` and is not confirmed by a figure.
  wanted: the keyhole dimensions
