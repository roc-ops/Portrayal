gaps:
- what: datasheet
  reason: vendor-silent
  note: >-
    the data sheet FS links for this SKU is the FS-GR42U-PDUBK sheet, which is the cabinet bracket and no
    part of this one. The quick start guide carries no dimension and no weight.
  wanted: a data sheet or a drawing of FS-PDUBK from FS
- what: weight
  reason: vendor-silent
  note: >-
    no document held states the bracket's weight.
  wanted: the product page weight
- what: sheet-gauge
  reason: vendor-silent
  note: >-
    FS states the material, SPCC, and no thickness for any part of the bracket.
  wanted: the gauge of the sheet
- what: slot-size
  scope: [left]
  reason: needs-drawing
  note: >-
    the guide gives no keyhole size and the dimensioned render gives only the pitch. The width scaled off
    it, 11.5, meets what the connectors registry states for `pdu-button` and is not confirmed by a figure.
  wanted: the keyhole dimensions
- what: lip-and-gusset-sizes
  reason: needs-drawing
  note: >-
    the lip and the gusset sizes are estimates read from the photographs. The bends at the foot and at
    the two lips are rounded, about 2 to 4 mm radius (x7, g2, g3), and are drawn square. The gussets and
    the lips are not drawn in 3D. `relief.features` with `shape: true` was tried on the gusset and the lip.
    The blocks stood outside the top and bottom faces, because the shape extrudes outward, so it was reverted.
  wanted: a dimensioned side or top drawing of the bracket
- what: lip-end-tabs
  scope: [left, right, top, bottom]
  reason: needs-drawing
  note: >-
    each lip ends in a small hook past the plate's free end, one at each long edge (x6, g5, x7, g2, g3).
    Each hook reaches 3.2 to 3.5 mm past the plate end and stands 2.4 to 2.7 mm high.
    The reach is read on the two plan pictures, each at the scale of a dimension in it.
    On x6 it reads 20 to 21 px at 6.04 to 6.18 px per mm, from its printed 135 line and its printed 31.5 pitch.
    On g5 it reads 21 to 22 px at 6.52 to 6.56 px per mm, from the plate's 135 and the same pitch.
    The perspective pictures x7, g2 and g3 show the hooks but give no usable reach.
    A dark band about 1.2 mm wide runs down the end edge between them.
    In the built views the plate and its lips end flush at 135.
    The printed 135 line on x6 ends 1.5 mm short of the plate's end edge, so a reading from that line gives 140.
    The 135 is printed on x6, the product page's dimensioned drawing, as 5.3" (135mm). The quick start guide prints no dimension.
    The kit can hold the hooks if the four views and the chassis depth all read 139.
    A trial with the depth and the four views at 139 printed "HEAD level 4 addressable" then "working tree level 4 addressable".
    The device lint passed. The device lock asked for a major version beyond 1.0.0 for the depth and view change alone, and no id was lost.
    The built views were not tested.
    Widening only the four views to 138 dropped the bracket from level 4 to level 2.
    It printed "blocked 3 solid - chassis depth disagrees: left.w=138, right.w=138, top.h=138, bottom.h=138, chassis.depth=135".
    A test asserts "an inconsistent box must not reach solid".
    The depth stays at the printed 135 and the hooks are not drawn, because a stated dimension is the maintainer's to change.
  wanted: the maintainer's yes that the stated depth may read 139 so the hooks can be drawn, or a drawing that dimensions the hooks
