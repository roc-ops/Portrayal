format: 1
kind: device
name: cmh-bs-dfdabs2u
version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: CMH-BS-DFDABS2U
description: >-
  2U dual-sided horizontal cable manager: a black ABS finger duct 176 mm deep with a
  channel on each side of the rack rail. A spine in the middle carries the rack ears and
  two walls of fingers on each side, top and bottom, twelve slots in each a cable is laid
  in through, and a detachable cover on each side clips over the finger tips to close its
  channel.
profile: passive
provenance:
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the duct reaches 99.6 mm in front of its ears and 76.4 behind
      them (the plan), so it serves the face it is bolted to and the space just behind the
      rail, and leaves the far face of its rack unit free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. FS publishes one datasheet for the part (datasheet
      12085, published 2026-10-06) with a front view, a plan and a rear view, millimetre
      dimensions; there is no product page, gallery, render or stencil, so the drawing is
      the only picture of it. The plan is 5.551 px/mm across the 482.6 and 5.582 down the
      176, the front view 5.626 down the 87: one to one and a half per cent apart, so the
      views are near orthographic and carry geometry to about a millimetre. The drawing is
      embedded as a 60 dpi raster, about 1.5 px/mm on the part; the converted figure that
      was measured is the same raster upsampled.
  sides:
    confidence: drawing
    note: >-
      drawing - DUAL-SIDED, FROM THE DRAWING. The datasheet is titled Single Sided, and its
      overview calls the design single-sided, while its specification table says Dual
      Sided; the plan settles it: a spine in the middle with a wall of fingers, a slotted
      channel and a cover on each side, symmetric about the middle of the 176. Both sides
      are built, each with its own fingers and its own cover, and the disagreement is a gap.
  chassis:
    confidence: drawing
    note: >-
      drawing - THE BODY BETWEEN THE EARS. The table gives 3.43"x19"x6.93"
      (87x482.6x176mm) overall. The ears are a flange at the rear face of the spine, 87
      high with six slotted holes each, 465 between hole centres; they are not drawn, and
      they take 24.3 mm at each end. The duct between them reads 433.3 on the front view
      and 434.7 on the plan, and 434.0 is taken. `depth` is the vendor 176, on both sides
      of the ear plane.
  shell:
    confidence: drawing
    note: >-
      drawing - TWO HOLLOW DUCTS BACK TO BACK, NOT A BOX. Each side is a well 87.9 deep to
      just short of the middle of the spine, whose floor is that half of the spine; half
      the spine stands 12.2 on each floor, the finger walls stand on it, and the cover lies
      across the finger tips and lifts off to open the channel. The channels and their ends
      are open air.
  thickness:
    confidence: estimated
    note: >-
      estimated - no FS document states a wall gauge for the ABS moulding. 7.3 is the
      finger wall of the CMH-SFD1U side view, the sibling ABS duct; no view of this part
      draws the section of a wall.
  front:
    confidence: drawing
    note: >-
      drawing - the front cover, fitted, from the front view, which draws a plain cover
      between the ear ends. The `duct` guide is the channel between the inner faces of the
      two finger walls; where the walls stand in the 87 is estimated, at the 1.2 from the
      edge of the CMH-SFD1U side view.
  rear:
    confidence: drawing
    note: >-
      drawing - the rear cover, fitted, from the rear view, the front side again: the plan
      is symmetric, and the same base, spine, fingers and cover are placed. The rear view
      draws the cover 441 wide with a 2.5 mm rim inside its outline, against 433.3 on the
      front view; the rim reads as the end lips of the cover, and the cover is drawn the
      width of the duct on both sides.
  top:
    confidence: drawing
    note: >-
      drawing - the plan, rear at y=0: the rear cover, the rear finger tips and stems, the
      roots, the spine, then the front side mirrored. Slots 18.3 wide, fingers 16.3, on a
      34.61 pitch; the slots are open air. The two rows of cells and the two bolts the plan
      draws in the spine are not drawn.
  bottom:
    confidence: drawing
    note: >-
      drawing - the front and rear views draw equal walls top and bottom; the bottom is the
      plan again.
  left:
    confidence: estimated
    note: >-
      estimated - no side view is published. The section is built from the plan depths and
      the CMH-SFD1U side view: each wall 7.3 thick, 1.2 from the edge, the spine through the
      middle and a cover at each face. Both channels are open at the ends.
  guides:
    confidence: drawing
    note: >-
      drawing - one duct on each face, the channel between that side of the finger walls,
      run across the rack, at the plan pitch and slot.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - "Cable Capacity (Theoretical Value)" in the specification table, 192 pcs
      (Cat6 24AWG). FS gives one cable type and no fill basis, and does not say whether the
      figure is per side or for both; it is stated for the manager.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - material, colour, style, the mounting hardware, the operating temperature
      and humidity, and the indoor environment are the specification table.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". FS publishes no photograph or render of the part; the
      shades are the ones the CMH-SFD1U renders give the sibling ABS duct.
attrs:
  physical:
    material: ABS
    color: Black
    mounting-hardware: M6*15mm Screw x4 and M6 Nut x4
  performance:
    cable-capacity: 192
    cable-capacity-basis: >-
      Cat6 24AWG, a theoretical value - FS CMH-BS-DFDABS2U datasheet specification table,
      which states no fill basis and does not divide it between the two sides
  environmental:
    operating-temp: -10 to 60°C (14 to 140°F)
    operating-humidity: 95% Relative Humidity (max.), Non-condensing
  compliance:
    environment: Indoor
  lifecycle: {eol: none-announced}
chassis:
  width: 434
  height: 87
  depth: 176
  ru: 2
  full-depth: false
  shell: sheet
  thickness: 7.3
  color: '#2a2c2e'
gaps:
  - what: sided-ness
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      the FS CMH-BS-DFDABS2U datasheet is titled Single Sided Manager and its overview says
      the single-sided design keeps wiring simple; its specification table says Product
      Type Dual Sided. The plan draws two channels back to back, and the part is modelled
      dual-sided.
    wanted: FS to correct the title or the table
  - what: weight
    scope: [base]
    reason: vendor-silent
    note: >-
      the FS CMH-BS-DFDABS2U datasheet, the only document FS publishes for the part, states
      no weight, and the part has no product page.
    wanted: the weight from FS, or the part on a scale
  - what: wall-section
    scope: [fingers]
    reason: needs-drawing
    note: >-
      the datasheet has no side view, so the thickness of a finger wall and where it stands
      in the 87 are estimated from the CMH-SFD1U side view.
    wanted: a side view or a photograph of the end of the duct
  - what: cover-overhang
    scope: [cover]
    reason: sources-disagree
    note: >-
      the specification table gives 87 high and the front view draws the cover 93.8 over an
      87 ear (93.5 on the rear view), 3.4 mm into the rack unit above and the one below. The
      model is the 87 of the rack units, and the cover is drawn that high.
    wanted: a photograph of the part fitted in a rack
  - what: cover-hinge
    scope: [cover]
    reason: vendor-silent
    note: >-
      the datasheet calls the cover dual hinged, opening upward or downward; no view draws a
      hinge, and each cover is drawn as one fitted plate.
    wanted: a drawing or a close photograph of the cover end
