format: 1
kind: device
name: cmh-dfds2u
version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: CMH-DFDS2U
aliases:
  - {name: '220087', kind: vendor}
description: >-
  2U dual-sided steel horizontal cable manager, FS SKU #220087: a black SPCC backbone
  between the rack ears with a finger duct on each side of it - ten moulded T-shaped fingers
  along the top and ten along the bottom of each channel - and a steel cover on four hinge
  clips closing each channel, one to the front and one to the rear.
profile: passive
provenance:
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - a dual-sided duct bolts to the front rails with its fingers
      facing both ways: it stands 116 mm to each side of its backbone (the side view, 232
      over both covers), so it serves the face it is bolted to and the space just behind
      the rails, and at 232 mm it does not reach the rear rails of a rack. The rear face of
      its two rack units stays free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. The FS Horizontal Cable Managers with Finger Duct
      datasheet (steel, portal id 6867) carries a technical drawing of CMH-DFDS2U: a plan,
      an isometric, the front and a side view. The embedded image (1437 x 779) is 1.2205
      px/mm across the 482.6, 1.216 down the 88, 1.224 along the 232 and 1.225 down the 84.1
      of the cover: orthographic, to about a millimetre. The renders of #220087 are the
      second reading; their backgrounds are transparent and were laid on white before
      measuring.
  chassis:
    confidence: drawing
    note: >-
      drawing - THE BODY BETWEEN THE EARS. 482.6 over the ears, 465 between the hole
      centres; the cover and the duct between the ears read 537 px, 440.0. The ears, 20.5
      each with three holes, are not drawn. Height 84.1 is the cover and the spec table, 103
      px on both the front and the side view; the ears are 88 (2U). Depth 232 is the side
      view over both covers and the spec table.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW DUCT ON EACH SIDE. The body is a sheet body and its six views are
      elevations. The front view and the rear view each carry the backbone as a well 115.4
      deep, whose floor is the backbone, the two rows of fingers standing in it and a cover
      that comes off; the two floors stand 1.2 apart, the gauge of the backbone. Both
      channels are open at their ends.
  thickness:
    confidence: estimated
    note: >-
      estimated - no FS document states the gauge. 1.2 is taken, the gauge of the other FS
      steel managers in the library.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 2.08 kg, the FS product page specification for #220087, as read at intake;
      the datasheet states no weight.
  backbone:
    confidence: drawing
    note: >-
      drawing - the side view puts the backbone 117 from one cover (its dimension) and so
      115 from the other; it is drawn centred, 115.4 + 1.2 + 115.4, 1.6 mm from the
      dimension, so that one finger part serves both channels.
  front:
    confidence: drawing
    note: >-
      drawing - the cover, fitted, as the front view draws it: 440 x 84.1 with four hinge
      clips, two on the top edge at 75.4 and 342.5 from the left end and two on the bottom
      below them. The finger rows are 9.0 thick, 4.7 in from the top and bottom of the
      cover, read off the side view (rails 4.9 to 13.9 and 70.5 to 80.3 from the top) and
      made symmetric. The `duct` guide is the 56.7 between the rows.
  fingers:
    confidence: drawing
    note: >-
      drawing - ten fingers a row, the plan dimensioning 44.5 between the windows of two
      fingers and drawing the stems 54.3 px apart, 44.5; ten at that pitch run past the 440
      cover, so 44.0 is taken and the row fills the body, as on CMH-SFDS1U. The moulding is
      the one CMH-SFDS1U carries: a 10.2 stem forking into two legs over a moulded block, a
      T head 39.4 wide. The fork is drawn as the stem.
  top:
    confidence: drawing
    note: >-
      drawing - the plan, rear cover at y=0: rear cover, heads, stems and blocks, the
      backbone at the middle, then the front channel to the front cover.
  bottom:
    confidence: drawing
    note: >-
      drawing - the bottom row of fingers is the top row again.
  left:
    confidence: drawing
    note: >-
      drawing - the side view: two finger rows each side of the backbone, the covers at both
      ends. Both channels are open at the ends.
  rear:
    confidence: drawing
    note: >-
      drawing - the rear channel is the front channel turned round, as the plan draws it:
      the same fingers and an identical cover with its clips.
  backbone-holes:
    confidence: photo-measured
    note: >-
      photo-measured - whether the backbone of the dual duct is pierced: the drawing draws
      it edge-on only, and gallery image 3 shows it dark through the open channel but for
      one light patch near the left end. Drawn solid; see the gap.
  guides:
    confidence: drawing
    note: >-
      drawing - one duct on each of the front and rear views, the channel between the finger
      rows, run across the rack.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - searched: the steel finger duct datasheet carries no capacity table, and
      the cable managers portfolio gives dimensions only. Recorded as a gap.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - style, sides, backbone and cover material, colour and the detachable cover
      are the specification table of the FS Horizontal Cable Managers with Finger Duct
      datasheet (steel, portal id 6867); RoHS and ISO 9001 its Standards Compliance list;
      the four screws and cage nuts are step 1 of the FS Horizontal Cable Managers quick
      start guide V1.0 for CMH-SFDS1U and CMH-DFDS2U.
  color:
    confidence: estimated
    note: >-
      estimated - Color: Black, drawn in the shades CMH-SFDS1U reads off its renders.
attrs:
  physical:
    weight-kg: 2.08
    material: 'Steel/SPCC backbone and cover, plastic fingers'
    color: Black
    mounting-hardware: screws and cage nuts x4
  compliance:
    rohs: RoHS Compliant
    iso: ISO9001 Certificate
chassis:
  width: 440.0
  height: 84.1
  depth: 232.0
  ru: 2
  full-depth: false
  shell: sheet
  thickness: 1.2
  weight-kg: 2.08
  color: '#1b1c1e'
gaps:
  - what: cable-capacity
    scope: [base]
    reason: vendor-silent
    note: >-
      no FS document held states a cable capacity for CMH-DFDS2U: the datasheet that covers
      it has no Cable Capacity Reference Guide, and the cable managers portfolio lists only
      dimensions. The product page could not be read (403 from the shop front).
    wanted: the capacity row of the product page, or a capacity table in a later datasheet
  - what: backbone-pass-through
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the drawing draws the backbone of the dual duct only edge-on. Gallery image 3 of
      #220087 shows one light patch through it near the left end, which may be a
      pass-through hole like those of the single-sided part; no view gives its size, and the
      backbone is drawn solid.
    wanted: a straight view of the backbone with a cover off
groups:
  body:
    term: Duct
    role: furniture
    index-origin: 1
    description: the backbone, seen from the front channel and from the rear one
  fingers:
    term: Finger
    role: furniture
    index-origin: 1
    description: >-
      the fingers, 10 a row: front channel upper row, front lower, then rear upper and rear
      lower
  cover:
    term: Cover
    role: furniture
    index-origin: 1
    description: the two covers, front then rear
