format: 1
kind: device
name: dinrail4u
version: 0.1.1
maturity: modelled
manufacturer: FS.com
model: DINRAIL4U
aliases:
- {name: '376695', kind: vendor, note: FS shop product ID}
description: >-
  4U 19in adjustable DIN rail bracket, FS DINRAIL4U: two black steel side brackets 360 mm deep
  whose front ends fold out into ears, joined by a rail panel carrying a 400 mm TS35 DIN rail
  that slides back along slots in the brackets, so DIN-rail equipment - industrial switches, media
  converters, power supplies, breakers - can stand in a 19in rack.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      the FS 2/4U DIN Rail Bracket datasheet (portal 9718), its DINRAIL4U front, top, side and
      isometric views in mm, rendered at 300 dpi; the gallery renders of SKU 376695; the DINRAIL4U
      quick start guide (portal 9719) for the assembly and the hardware; the FS DIN Visio stencil
      (master DINRAIL2U.4).
  chassis:
    confidence: datasheet
    note: >-
      165.1 x 483.7 x 360 (HxWxD) over the ears, which is the part. THE EARS ARE BUILT IN: each
      is the front end of a side bracket folded out flat, one piece with the bracket that forms
      the frame's side (the datasheet's front and isometric views; renders g1 and g2 of SKU 376695),
      so under the owner's rule of 2026-10-09 they are part of the face and always drawn, 30.5
      each side: the front is the 483.7 face, and the chassis is the 422.7 between the side brackets,
      which is what the other five faces and the side brackets in 3D are (as the FHD-1UFMT-N draws
      its plate). On the 300 dpi front view the outer edges stand 483.7 apart at 1.37 px/mm and
      the folds 30.5 in from each.
  sheet:
    confidence: estimated
    note: >-
      `shell: sheet`, 1.5: an open frame of bent steel - two side brackets, a rail panel and a
      rail - which a solid box would hide. In 3D the side brackets are built from the side views,
      standing their thickness off them. The panel is a well on the front view whose floor is
      the plate at its setback, black with its cut-outs open, and the rail stands 7.5 off that
      floor with its face art - flanges, crown, slots - on its front. The six views are elevations.
  rail:
    confidence: drawing
    note: >-
      a TS35 x 7.5 rail 400 long (fs/din-rail-ts35-400@1) centred on the panel's height, its centre
      line 82.55 below the top: the datasheet's front views draw it across the whole 400 panel
      at mid-height (the 4U's measures 82.2 down on the 300 dpi render, the 165.1 face's middle
      being 82.55).
  setback:
    confidence: drawing
    note: >-
      the rail panel's front face can stand from 50.5 to 269.4 mm behind the ears, and is drawn
      at 159.9, the middle of that travel; the rail's face stands 7.5 in front of the panel's.
      The panel slides along the two long slots in each 360 mm side bracket ("the adjustable rails
      can be easily set back"; QSG: adjust the rail panel's position to suit the device). On the
      datasheet's side view (p3, an embedded 435 x 279 px raster, about 1.2 mm a pixel, read
      on a 600 dpi upsampled render at 3.258 px/mm along the 360) the slots run 65.7 to 289.8
      and are about 5.2 wide, so a screw's centre travels from 68.3 to 287.2; the panel's tab spans 128.6 to 164.8 with its screw at 146.4, so the panel face stands 17.8
      in front of the screw. The face travel is the screw travel less that. The gallery renders
      show it at both ends of that travel: g3 about 62 and g4 about 284 behind the ears, each
      read along the near side bracket as a fraction of its 360 (a three-quarter render, so to
      perhaps 10 per cent). With no single photographed position, the middle of the travel is
      the default; the range is in attrs and the format cannot offer the other positions (see
      gaps).
  hosting:
    confidence: datasheet
    note: >-
      for #935: one TS35 x 7.5 rail, 400 mm long, centred 82.55 mm below the top of the 165.1
      mm face, its panel's face 50.5 to 269.4 behind the ears; the width between the side brackets
      is 419.7; the space available behind the rail runs to the 360 mm depth. FS states no load
      rating. Recorded in `attrs.physical`.
  eia:
    confidence: registry
    note: >-
      EIA-310 hole positions: the rail holes of each rack unit stand 6.35, 22.225 and 38.1 mm
      up from its bottom, and the two rails' holes are 465.1 mm apart across the rack. The part
      is taken as centred in the rack units it fills.
  color:
    confidence: photo-measured
    note: >-
      black steel and a silver zinc-plated rail, as every render shows.
  lifecycle:
    confidence: estimated
    note: >-
      checked 2026-10-09 against what the intake holds: the FS documentation portal's Accessories
      tree, read on 2026-10-08, carries no end-of-sale notice for this part. The product page
      (SKU 376695) was live on 2026-10-08. No web search beyond FS's own pages was made.
