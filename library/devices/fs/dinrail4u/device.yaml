    din-profile: ts35x7.5
    din-rail-count: 1
    din-rail-length-mm: 400
    din-rail-centre-from-top-mm: 82.55
    din-rail-setback-mm: 159.9
    din-rail-setback-min-mm: 50.5
    din-rail-setback-max-mm: 269.4
    usable-width-mm: 419.7
  lifecycle:
    eol: none-announced
chassis:
  width: 422.7
  height: 165.1
