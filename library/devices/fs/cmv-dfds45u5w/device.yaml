model: CMV-DFDS45U5W
aliases:
  - {name: '220091', kind: vendor}
description: >-
  45U dual-sided vertical cable manager, FS SKU #220091: a black SPCC steel finger duct,
  2000.25 mm (45 rack units) tall in two sections, that stands beside a 45U open-frame
  rack on quick-release brackets bolted to the side of the upright. A steel spine with
  seven windows carries a channel on each face, each with a row of 44 moulded T-shaped
  fingers down each edge at one rack unit apart and two detachable steel covers over their
  heads, closing a channel 141.52 mm wide to the front and another to the rear. It takes
  no rack unit.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. The FS Vertical Cable Managers with Finger
      Ducts datasheet for the steel managers (portal id 6868) draws CMV-DFDS45U5W on
      page 4 four ways in millimetres - a side view, a cover view, section A-A through
      the spine and an end view - laid on its side in one embedded raster (1341 x
      689). Measured at native size: 842 px along the dimensioned 2000.25 (0.4209
      px/mm) and 128.5 px across the dimensioned 307.66 on the end view (0.4177),
      about 2.4 mm a pixel. The dual is the single section of page 3 on both faces of
      one spine, and the single drawing, at the finer scale, gives the figures the two
      share. The steel quick start guide (steps 1 and 4) and the renders of #220091
      (gallery images 2 to 5) are the second reading.
  mount:
    confidence: drawing
    note: >-
      drawing - `rack-side`. The steel quick start guide step 3 bolts quick-release
      brackets to the side of the upright with screws and cage nuts and the duct
      stands beside the rack, outside the rails; step 1 draws the dual with its
      brackets on the spine between the two channels. The datasheet says it matches a
      45U open rack. It occupies no rack unit; `ru: 45` is the height it runs beside.
  chassis:
    confidence: drawing
    note: >-
      drawing - THE DUCT AS IT STANDS, covers fitted: `width` across the face of the
      rack, `height` the height it runs, `depth` front to back. 169 wide is the cover,
      dimensioned 169 on the cover view of both drawings; the back view measures the
      same 72 px at the 0.4247 px/mm of the 2000.25, and the end view draws the cover
      line across the same 72 px, over finger rows 160 apart outside. The
      specification table, the portfolio and the page title give 141.52 (5.5 in) wide:
      the end view of the dual dimensions 141.52 between the inner faces of the two
      rows, so that figure is the channel, not the part, and the single end view
      dimensions 145.76 across the same rows. The two renders read 159 and 164 for the
      cover once the turn of the camera is solved, at about five per cent; the
      dimensioned 169 is taken. 2000.25 high is the drawing (45 x 44.45); the table
      rounds it to 2000.
  depth:
    confidence: drawing
    note: >-
      drawing - 307.66 is the end view and the specification table, from one cover to
      the other. It is 2.4 more than two singles of 152.63, so the spine is drawn 2.4
      and each channel well 152.63 deep from its cover to the face of the spine; the
      single back plate is 1.2 deep, so the dual covers stand 1.2 further from the
      fingers, estimated.
  cover:
    confidence: drawing
    note: >-
      drawing - covers on both faces. The datasheet table (Finger Duct with Cover,
      Detachable Cover: Yes), the cover view, the renders (gallery images 2, 4 and 5)
      and the quick start guide step 4 show them. The product page heads its
      description Single Sided, an FS copy error: its title, the datasheet, the
      portfolio and the drawing say Dual Sided.
  sections:
    confidence: drawing
    note: >-
      drawing - two sections a face. The cover view dimensions an upper cover 976.95
      and a lower one 1021.4 (the single page draws 976.45); together they leave 1.9
      of the 2000.25, put at the joint. Section A-A draws the joint of the spine at
      the same 977.2 as the single.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW DUCT ON EACH SIDE, NOT A BOX. A sheet body whose views are
      elevations. The front and rear views each carry the spine as a well 152.63 deep,
      its floor the face of the spine and open at its seven windows through to the
      other channel, with two steel returns, 88 fingers and two covers that come off.
      The windows join the two channels and reach neither outer face, so no face
      declares a `passes:` entry; they are the holes in each floor.
  thickness:
    confidence: estimated
    note: >-
      estimated - no FS document states the gauge of the SPCC; 1.2 is taken, as for
      the FS horizontal steel managers in the library, and the spine is the 2.4 the
      depths leave.
  front:
    confidence: drawing
    note: >-
      drawing - each working face is the single face: the rows 9.0 thick with their
      inner faces 141.52 apart (dimensioned on this end view), 44 fingers a row at
      44.45 with the top rack unit empty, and the two covers over them. The finger is
      the single one, the same moulding (fs/cmv-fds45u5w-finger).
  rear:
    confidence: drawing
    note: >-
      drawing - the rear channel is the front channel turned round, as the end view
      and the side view draw it, symmetric about the spine.
  spine:
    confidence: drawing
    note: >-
      drawing - section A-A draws the spine as the single back view: the same seven
      openings, six pairs of keyholes 311 apart (the outer pair 1555, dimensioned) and
      the square holes. The keyholes and squares are not drawn on the dual: no face
      shows the spine except through the open windows of its floors.
  top:
    confidence: drawing
    note: >-
      drawing - the end view, rear cover at y=0: the rear channel, the 2.4 spine at
      the middle of the 307.66, the front channel, each half from the spine outward
      the single stack (return 37.7, block to 62.4, stem to 141.3, head to 148.43,
      cover 150.83 to 152.03).
  bottom:
    confidence: drawing
    note: >-
      drawing - the bottom end is the top end again.
  left:
    confidence: drawing
    note: >-
      drawing - the side view, rear at x=0: both channels, each with its return, 44
      blocks, stems and heads, six clips and two covers, the spine at the middle. The
      bracket plates the side view draws on the spine are not drawn (see the bracket
      gap).
  right:
    confidence: drawing
    note: >-
      drawing - the left view mirrored: the duct is the same on both sides.
  guides:
    confidence: drawing
    note: >-
      drawing - one duct on each of the front and rear views, the channel between the
      finger rows, 141.52 wide, run down the height; pitch 44.45, gap 34.25 between
      stems.
  capacity:
    confidence: estimated
    note: >-
      not stated - no capacity is carried: neither the steel datasheet nor the guide
      nor the portfolio gives a cable capacity for CMV-DFDS45U5W, so the figure is the
      `cable-capacity` gap below, not a datasheet fact.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 19.2 kg, the FS product page specification for #220091 as read at
      intake, twice the single; the datasheet states no weight.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - style, sides, backbone and cover material (Steel/SPCC), colour, the
      detachable covers, the 45U open rack it matches and RoHS and ISO 9001 are the
      specification table and Standards Compliance list of the datasheet. The fixings
      are the guide step 2 for the dual, twice the single list of the product page.
      The ABS of the features list is copied from the plastic datasheet; the fingers
      are given as plastic and the body as steel.
  color:
    confidence: estimated
    note: >-
      estimated - Color: Black. Every image FS publishes of the part is a render; it
      is drawn in the shades the FS horizontal steel ducts read off theirs.
