format: 1
kind: device
name: fhd-1ufce
version: 3.0.0
maturity: modelled
manufacturer: FS.com
model: FHD-1UFCE
description: >-
  1U 19in slide-out fiber enclosure. FS SKU #70361 - a sliding drawer with front
  access to patch cords and rear access to cable entry, holding up to four FHD
  fiber adapter panels or MTP/MPO cassettes for up to 144 fibers in 1U.
profile: optical
provenance:
  method:
    note: >-
      FIGURES FIRST, FROM THE VENDOR'S OWN DIMENSIONED DRAWING. Every number in `chassis` below is
      read directly off page 7 of
      working/intake/fs/fhd/datasheets/fhd-1ufce-fiber-enclosure-datasheet.pdf, which carries a
      dimensioned front view and a dimensioned top view of this exact part - the only page in the
      corpus that dimensions anything. Nothing else about this device is measured; what is not on
      that page is estimated and said so below, or left undrawn.
  model:
    note: >-
      the datasheet's own "Fiber Enclosure Capacity" table names #70361 as the ordering ID for
      "FHD 1U slide-out rack mount enclosure", model FHD-1UFCE, "4 ports", "144F". The features
      list on page 1 adds "Mounts to standard EIA 19" rack rails, holds up to 4x FAPs or MTP®
      Cassettes."
  chassis:
    note: >-
      page 7, front view: 448.0mm (17.64in) body width, dimensioned on its own line below the
      482.6mm (19in) rack-width line - two separate dimensions, not one measured against the
      other. 44.0mm (1.73in) height, the only figure on that view's right edge. Page 7, top view:
      432.8mm (17.04in) depth. All three also appear in the spec table on the same page -
      "Dimensions (HxWxD): 1.73"x19"x17.04" (44x482.6x432.8mm)" - which is what corroborates the
      drawing rather than the other way round. `ru: 1` from that same table's "No. of Rack Spaces:
      1U".
  overall-depth:
    note: >-
      the top view carries a second, larger depth line outside the 432.8mm body - 467.2mm
      (18.39in). That is the envelope INCLUDING whatever projects from the rear (the drawer's
      cable-management arm, most likely), not the body depth, and the spec table's own HxWxD row
      confirms 432.8 as the figure it means by "depth". Recorded here because the drawing shows
      it; not used as `chassis.depth`, which the two agreeing sources both give as 432.8.
  ears:
    note: >-
      482.6mm (19in) on the same front-view dimension line as the 448.0mm body - the standard
      EIA-310 rack width. Drawn as common/rack-ear@1 outside the body under the optional tag
      `ears`, the same generic ear every other 19in device in this library uses; its own 14.0mm
      width is that component's convention, not a second measurement of this drawing.
  bays:
    note: >-
      FOUR IS COUNTED, NOT MEASURED. The capacity table's "4 ports" and the features list's "holds
      up to 4x FAPs or MTP® Cassettes" agree on the number; no page in this datasheet dimensions
      an empty bay opening. Each bay is sized at 108.97 x 35.05 - the FHD module envelope, a
      FAMILY CONSTANT common to every cassette this format admits, not a figure this device
      measures itself or that belongs to any one cassette. It was first measured off FS's own
      render for fs/fhd-1mtp6lcd-os2-a@3 (SKU 57016), and `panel_measure` refuses to scale ANY FHD
      face-on render at all unless that scale reproduces the same 35.05mm height - which is what
      makes this a constant worth carrying rather than a per-cassette reading. THE RULE, NOT A
      COUNT: every FHD cassette this library models seats in every bay's `accepts`, because the
      FHD format defines one shared envelope for the slot rather than a per-cassette one - see
      each bay's own `accepts` list below for which cassettes that is today. The bay geometry does
      not depend on which of them seats in it, because every FHD module this plan might still add
      shares this one envelope by definition of the format (the format's own name for it). The
      four bays sit contiguous across the panel: (448.0 - 4 x 108.97) / 2 = 6.06mm margin each
      side, centred top-to-bottom in the 44.0mm face: (44.0 - 35.05) / 2 = 4.475mm.
  front-panel-detail:
    confidence: estimated
    note: >-
      ESTIMATED BY OMISSION. Page 1's product photograph shows two extraction handles near the
      panel ends and an FS logo left of centre, but page 7's dimensioned drawing - the only source
      this device transcribes figures from - locates none of them, and a three-quarter photograph
      is not a source panel_measure can rectify. None of that detail is drawn; see `gaps` below.
  envelope-faces:
    note: >-
      rear, top, bottom, left and right carry the ENVELOPE ONLY, the same treatment dcp-2 gives
      the four sides no photograph resolved. Top and bottom are 448.0 x 432.8 and left/right are
      432.8 x 44.0 - both pairs built from the same `chassis` figures already sourced above, not a
      second measurement. No surface detail (screws, the slide rail, the cable-management arm the
      467.2mm overall depth implies) is drawn on any of the five; see `gaps` below. THE REAR
      IS NOW THE EXCEPTION: it carries the open back behind each slot - see `rear-opening`.
  rear-opening:
    confidence: estimated
    note: >-
      REPORTED, NOT PHOTOGRAPHED. The owner of this model reports that the drawer's back is
      open behind the slots, a hole roughly the size of a cassette faceplate through which the
      cassettes' backs and MTP trunks are seen and reached - which is what the trunk cables
      leaving from the back of the drawer need. No image held shows the rear; every FS
      photograph of 70361 is of the front, the door or the pulled-out drawer. So the four holes
      are each the front bay's own 108.97 x 35.05 at the bay's own height, mirrored left to
      right because the back is seen from behind; their real outline, and whether it is one
      hole or four, is still open (the `envelope-face-detail` gap). Each runs 431.8 in - the
      432.8 drawer less a 1.0 front plate, which is ESTIMATED - so the slot is a passage the
      cassette's own 117.86 mm body stands in, open front to back when it is out.

chassis:
  width: 448.0
  height: 44.0
  depth: 432.8
  ru: 1
  color: '#1b1e21'
  airflow: passive
gaps:
  - what: front-panel-detail
    scope: [front]
    reason: needs-photo
    note: >-
      the extraction handles and FS logo visible in the page-1 product
      photograph are real but undimensioned anywhere in the corpus - no page
      gives their position, and a perspective product shot is not a source
      panel_measure can rectify the way the FHD cassettes' face-on renders
      were. The front view here draws the four bays and the rack ears only.
      RE-READ when fs/fhd-splice-12-lc@1 joined every bay's `accepts`: that
      addition names a cassette that seats inside a bay, not the enclosure's
      own front panel, so it neither closes this gap nor opens a new one.
      RE-READ AGAIN when fs/fhd-2mtp12-lc-os2-a@1 joined every bay's
      `accepts`: same reasoning - a two-MTP cassette still seats inside a
      bay the same 108.97 x 35.05 way its one-MTP sibling does, so it
      neither closes this gap nor opens a new one either.
      RE-READ A THIRD TIME when fs/fhd-1mtp12-sc-os2-a@1 joined every bay's
      `accepts`: an SC cassette seats in the same 108.97 x 35.05 bay opening
      its LC and splice siblings do - its front connector family is
      different, its body is 7.62 mm deeper, but neither changes what the
      enclosure's own front panel around the bay looks like - so the gap
      stands unchanged a third time.
      RE-READ A FOURTH TIME when fs/fhd-1mtp24-lc-os2-a@1 joined every bay's
      `accepts`: an MTP-24 cassette seats in the same 108.97 x 35.05 bay
      opening its MTP-12 sibling does - its front is the identical twelve
      LC-duplex layout fs/fhd-2mtp12-lc-os2-a@1 already uses, and its rear
      carries a wider MPO ferrule the front panel never sees - so the gap
      stands unchanged a fourth time.
      RE-READ when every FHD LC and SC cassette's adapter row moved 1.4-1.8
      mm right (fs/fhd-1mtp6lcd-os2-a@3 and its siblings), once
      `panel_measure` framed FS's renders on the plate's real edge rather than
      its rounded corner: the rows sit inside each cassette's own plate, not
      on the enclosure's front panel, so the gap stands unchanged.
    wanted: >-
      a square-on, face-on photograph of the closed FHD-1UFCE front, the same
      kind of image that let the cassettes' own faceplates be measured.
  - what: envelope-face-detail
    scope: [rear, top, bottom, left, right]
    reason: needs-photo
    note: >-
      these five faces carry the bare envelope box from the dimensioned
      `chassis` figures and nothing else - no slide rail, no cable-management
      arm, no screws, no rear opening for the cassettes' MTP trunks to pass
      through. Page 7 dimensions only the front and top outlines, and even
      the top view resolves no surface detail beyond its own outline.
      RE-READ when fs/fhd-splice-12-lc@1 joined every bay's `accepts`: a
      splice cassette's trunk fibres still leave through the same
      undimensioned rear opening this gap already names, so the gap stands
      unchanged rather than needing a second one for the new cassette.
      RE-READ AGAIN when fs/fhd-2mtp12-lc-os2-a@1 joined every bay's
      `accepts`: its two MTP trunks leave through the same undimensioned
      rear opening too - twice the trunks, not a different opening - so the
      gap stands unchanged a second time.
      RE-READ A THIRD TIME when fs/fhd-1mtp12-sc-os2-a@1 joined every bay's
      `accepts`: its single MTP trunk leaves through the same undimensioned
      rear opening its LC and splice siblings use - a deeper cassette body
      (117.86 mm against 110.24, as was then believed; every FHD cassette here
      is 117.86, the 110.24 having been a misreading corrected in
      fs/fhd-1mtp6lcd-os2-a@2), not a different rear opening - so the gap
      stands unchanged a third time.
      RE-READ A FOURTH TIME when fs/fhd-1mtp24-lc-os2-a@1 joined every bay's
      `accepts`: its single MTP-24 trunk leaves through the same
      undimensioned rear opening its MTP-12 siblings use - a wider ferrule
      on one trunk instead of two narrower ones, not a different opening,
      and the same 117.86 mm body depth fs/fhd-2mtp12-lc-os2-a@1 already
      carries - so the gap stands unchanged a fourth time.
      NARROWED, NOT CLOSED, when the rear gained its opening: the owner of
      the model reports the back is open behind the slots, so the rear now
      draws one hole per bay and the cassettes' backs through it (see
      `provenance.rear-opening`). What the report cannot give is the
      opening's real outline - four holes or one, the bay's size or not -
      and nothing held shows the rear, so the photograph is still wanted.
      RE-READ when the Type AF and universal cassettes (57037, 68540, 68549,
      182641, 182643) joined every bay's `accepts`: they are their Type A
      twins' bodies with different internal wiring and rear labels, so their
      trunks leave through the same undimensioned opening - the gap stands.
      RE-READ when every FHD LC and SC cassette's adapter row moved 1.4-1.8
      mm right on its faceplate: a front-plate change, which none of these
      five faces shows - the gap stands.
    wanted: >-
      a rear photograph (the cassettes seat from the front but the trunk
      cables leave from the back of the drawer) and a lid/side photograph,
      the same kind of source dcp-2's own equivalent gap asks for.
