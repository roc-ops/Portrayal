configurations:
  base:
    kind: base
    default: true
    description: >-
      The enclosure as FS ships #70361: an empty tray, all four bays open.
      Fiber adapter panels and MTP/MPO cassettes are separate SKUs from the
      datasheet's own "Fiber Enclosure Loading List", ordered and fitted
      afterwards.
  populated:
    kind: example
    description: >-
      All four bays carrying fs/fhd-1mtp6lcd-os2-a@3, chosen as one
      representative cassette from the FHD catalogue this same bay format
      accepts - see `provenance.bays` for the rest. Illustrative, like every
      `example` in this library: the cassettes are ordered separately from
      the enclosure, and later tasks in this plan add the rest of the
      catalogue this same bay format accepts.
    bays:
      bay-1: fs/fhd-1mtp6lcd-os2-a@3
      bay-2: fs/fhd-1mtp6lcd-os2-a@3
      bay-3: fs/fhd-1mtp6lcd-os2-a@3
      bay-4: fs/fhd-1mtp6lcd-os2-a@3
