version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: FHU-BPAD-2U
aliases:
- {name: '284589', kind: vendor, note: FS shop product ID}
- {name: FHU-BPAD-2U-5, kind: vendor, note: 'the five-pack of this panel (datasheet, QSG note
    1)'}
description: >-
  2U 19in tool-less ABS blanking panel, FS FHU-BPAD-2U: one black moulded plate 88 x 482.6 mm,
  scored into 1U strips that snap apart, with a straight and a wave rib across the back of each
  unit and an E-shaped clip at each end that pushes into the rail holes. Also sold as the five-pack
  FHU-BPAD-2U-5.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      the FS Plastic Blanking Panel Datasheet (portal 7735), FHU-BPAD-2U and FHU-BPAD-2U-5 columns,
      and the product page, for the size, material and weight; the face from the FS Blanking Panel
      Visio stencil, master FHU-BPAD-2U, and the straight-on gallery renders of SKU 284589 (g2
      front, g3 back); the depth from the dimensioned render (x3); the quick start guide (portal
      7736) for the packs and the snapping apart.
  chassis:
    confidence: datasheet
    note: >-
      the plate is the part: "88 x 482.6 mm", one moulded ABS plate the width of the rack with
      its clips at the ends of its back, so the face is drawn at 482.6 (the owner's rule of 2026-10-09;
      lint L43 stands down for a body this wide).
  depth:
    confidence: drawing
    note: >-
      14: FS's dimensioned render (x3) prints about 14 mm at the end of the plate, which is the
      plate and the ribs behind it. The 3D body is one box that deep across the full width.
  units:
    confidence: datasheet
    note: >-
      the plate snaps apart into 1U strips (datasheet: "Snappable Design"; QSG: "you can manually
      take the blanking panels apart"); the score lines between the units are drawn at every 44
      mm, the stencil's and the render's single line on the 2U.
  badge:
    confidence: photo-measured
    note: >-
      a recessed badge near the left end of each unit carries FS's mark: 19.7 to 54.5 across and
      5.1 to 14.3 down the unit on the render g2 at 2.74 px/mm. The recess is drawn; the mark
      in it is a logo and is not.
  clips:
    confidence: photo-measured
    note: >-
      each unit carries an E-shaped ABS clip at each end of its back (render x4), whose rounded
      head shows past the plate's end at the middle of the unit, 23.8 tall and about 4.6 across
      on g2; the clip's body behind the plate and its metal pin (g3) are drawn 4 x 6 and 2 across,
      estimated.
  ribs:
    confidence: photo-measured
    note: >-
      the back (g3, g5) carries, per unit, a straight rib along the middle of the unit and a wave
      rib crossing it, from about 18 mm in from each end: the wave is drawn as a cosine of 6.5
      mm amplitude and 152 mm period, lowest at 86 mm from the left end, in 6 mm steps: the straight-on
      rear render (g3, 2.73 px/mm) has its low runs centred near 86, 247 and 390 and swings about
      6.5 either side of the straight rib - an estimate of the shape, not a measurement of it.
  mark:
    confidence: drawing
    note: >-
      FS's mark in each badge is a logo and is not drawn.
  color:
    confidence: photo-measured
    note: >-
      black textured ABS, as the renders and "Color: Black".
  weight:
    confidence: datasheet
    note: >-
      the datasheet: 142 g a panel, 710 g the five-pack FHU-BPAD-2U-5.
  sides:
    confidence: estimated
    note: >-
      the plate's end edge-on and the ends of the ribs behind it.
  lifecycle:
    confidence: estimated
    note: >-
      searched 2026-10-09: the FS product page for this SKU was live and orderable when the intake
      read it on 2026-10-08, and no FS end-of-sale notice for it was found in the intake's portal
      tree or by name.
