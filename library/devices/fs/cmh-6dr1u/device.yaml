format: 1
kind: device
name: cmh-6dr1u
version: 1.0.0
maturity: modelled
manufacturer: FS.com
model: CMH-6DR1U
aliases:
  - {name: '64184', kind: vendor}
description: >-
  1U horizontal cable manager with end rings, FS SKU #64184: a flat black steel panel on
  the rack rails with four steel D-rings standing 88 mm out of it for horizontal runs,
  and a larger steel ring bolted to each ear that reaches out past the rack rail for
  vertical runs, reaching 43 mm past the rack's width on each side.
profile: passive
provenance:
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the rings stand 88 mm in front of the panel, and nothing but
      the panel's folded edges stands behind it, so the rear face of its rack unit stays
      free for another part (#854).
  method:
    confidence: drawing
    note: >-
      FIGURES FIRST, FROM THE VENDOR'S OWN DIMENSIONED DRAWING. The part has no
      datasheet of its own, but FS's Horizontal Cable Managers with D-rings datasheet
      covers it: a column of its specification table, a row of its capacity guide, and
      a page of drawings - a side view of a D-ring, a plan of an end ring and a front
      view, dimensioned in inches with millimetres in brackets. The front view is 1.861
      px/mm across from the 482.6 line (898 px) and 1.98 down from the 44 (87 px), a 6 %
      difference between the axes; the 430, 102, 62, 43 and 26.3 lines agree with the
      across scale to under a millimetre. Positions are read across and heights down.
      The product page's 13 renders were used for the ring's orientation and to confirm
      the folded edges.
  chassis:
    confidence: estimated
    note: >-
      drawing for 430 x 44, estimated for the 100. The plate is flat over the whole 19 in
      [482.6mm] and its top and bottom edges fold back over 16.9 in [430mm], 1.04 in
      [26.3mm] in from each end; the flat ends outside the folds are the ears, so the body
      is the 430. The front is drawn at the 482.6 rack face with the ears on it, because
      the ears carry the end rings (#865), as the R740xd's front carries its ports. The datasheet's 3.46 in (88 mm)
      depth is the ring's longer arm from the face of the plate. The renders (gallery
      image 2, the back) show the edges folded back, as on the CMH-5DR1U-N, but this
      part's drawing does not dimension them; they are taken as the CMH-5DR1U-N's 12, and
      the folded edge is that part's flange. The product page's 88 for the depth agrees
      with the datasheet's table.
  thickness:
    confidence: estimated
    note: >-
      estimated - 1.2 mm, the sheet FS dimensions on the CMH-4DRB1U drawing of the same
      datasheet. No view of this part dimensions its sheet.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 0.66 kg in the specification table of FS's product page for #64184.
      The D-rings datasheet states no weight for any of its four managers. The page is
      not a held document.
  front:
    confidence: drawing
    note: >-
      drawing - the front view: the plate between the folds and the four D-rings, centred
      62 mm from the left fold and 102 apart: the drawing dimensions 1.04 in [26.3mm]
      plus 2.4 in [62mm] to the first ring's centre and 4 in [102mm] between centres, and
      the four read 102 mm apart, symmetric about the middle. Each ring is 12.4 wide on
      this drawing and 12.7 on the CMH-5DR1U-N one, the same ring; its contract has the
      rest. The face is the 482.6 rack face, the panel 26.3 in from each end and an ear
      either side of it, with the end rings bolted across the ears and reaching past
      them. FS's mark, printed on the left ear, is not drawn.
  rings:
    confidence: drawing
    note: >-
      drawing - the D-rings are the CMH-5DR1U-N's: the same 12.4 to 12.7 mm strip, the
      same 3 in [77mm] and 3.4 in [88mm] arms, and 1.7 in [42mm] high, which that part's
      ring reads 41.3. This part's side view draws the long arm on top, curling down; FS's
      renders (feature image 1, gallery image 5) show the short arm on top hooking down,
      as on the CMH-5DR1U-N, and the renders are taken.
  end-rings:
    confidence: drawing
    note: >-
      drawing - a steel loop bolted to the front of each ear, lying flat at mid-height with
      its strip 12 mm deep, so that cables run vertically through it beside the rack posts
      (fs/cmh-6dr1u-end-ring@1, whose contract has the plan). The front view puts each
      86 mm span from 1.7 in [43mm] outside the end of the 482.6 to 43 mm inside it, which
      is 16.7 mm onto the plate past the fold, so the part is 568.6 mm across with both
      rings. They stand in the plane of the ears, like the D-rings in the panel's, and the
      right ring is the left one turned half round. Which side of the plan lies against
      the ear is not drawn, and is estimated in the ring's contract.
  overhang:
    confidence: drawing
    note: >-
      drawing - 43 each side: the front view's 1.7 in [43mm] from the end of the 19 in
      [482.6mm] to the outer leg of each end ring (#865). The rings are placed at x -43 and
      439.6 on the 482.6 face.
  ears:
    confidence: drawing
    note: >-
      drawing - the ears are the plate's flat ends outside the folds, 26.3 wide, with an
      oval rack-screw slot near the top and the bottom of each, read off the front view
      (fs/cmh-6dr1u-ear@1). They are drawn because they carry the end rings.
  mount:
    confidence: datasheet
    note: >-
      datasheet - the D-rings datasheet notes that the part cannot be used with a
      vertical cable manager in the same cabinet, and that the distance between the posts
      and the mounting rails should be more than 1.97 in: the end rings take that space.
  top:
    confidence: drawing
    note: >-
      drawing - an elevation: the folded edge behind the plate, and the four rings'
      upper arms from above to 77 mm, with the lower arms reaching on to 88. The bottom
      is the same from underneath, where the lower arms are seen whole.
  rear:
    confidence: photo-measured
    note: >-
      photo-measured - the back of the plate, plain, as FS's render of the back (gallery
      image 2) shows it.
  left:
    confidence: drawing
    note: >-
      drawing - an elevation, the ring's profile in front of the plate and the folded
      edges behind it. The right is the same, turned round.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - style, panel and ring material, rack units and the mounting hardware
      are the D-rings datasheet's specification table.
  cable-capacity:
    confidence: datasheet
    note: >-
      datasheet - 87 Cat6 24AWG 6.1 mm cables at 100 % fill, 26 at the recommended 30 %,
      for the D-rings, in the Cable Capacity Reference Guide of FS's D-rings datasheet.
      The same guide gives the end rings 153 and 46 on the same basis; they hold a
      vertical run, a different path from the horizontal one, and are not added to it.
  color:
    confidence: estimated
    note: >-
      estimated - "Steel, Powder-coated Black" and "Color: Black". Every image FS
      publishes of the part is a render.
attrs:
  physical:
    weight-kg: 0.66
    material: Steel, Powder-coated Black
    ring-material: Steel, Powder-coated Black
    mounting-hardware: M6*15mm Screw x4 and M6Nut x4
  performance:
    cable-capacity: 87
    cable-capacity-basis: >-
      Cat6 24AWG (6.1 mm) cables at 100 % fill through the four D-rings, theoretical; 26
      at the recommended 30 %. The two end rings are stated apart, 153 (46 at 30 %), for
      vertical runs - FS Horizontal Cable Managers with D-rings datasheet, Cable Capacity
      Reference Guide
