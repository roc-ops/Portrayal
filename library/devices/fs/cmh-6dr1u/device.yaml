gaps:
  - what: end-rings
    scope: [base]
    reason: needs-drawing
    note: >-
      the two end rings are dimensioned by the vendor but cannot be drawn: each stands
      on the front of an ear, 86 x 78 mm in plan, reaching 43 mm past the end of the 19
      in width at mid-height, and a rack device is drawn between its ear folds. What is
      missing is a way to draw a part outside the rails' envelope, not a source.
    wanted: a way for a rack device to carry parts outside its ears
  - what: flange-depth
    scope: [top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the drawing of this part does not show the panel's folded edges; they are taken
      as the CMH-5DR1U-N's 12 mm, which the renders show this part shares.
    wanted: a side view with the folds dimensioned, or a ruler on the part
