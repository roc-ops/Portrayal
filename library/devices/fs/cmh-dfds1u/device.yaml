format: 1
kind: device
name: cmh-dfds1u
version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: CMH-DFDS1U
aliases:
  - {name: '315741', kind: vendor}
description: >-
  1U dual-sided high-capacity steel horizontal cable manager, FS SKU #315741: a steel
  backbone between the rack ears with a finger duct on each side - ten moulded T-shaped
  fingers along the top and ten along the bottom of each channel - and a steel cover on four
  hinge clips over each. The covers are 57.8 mm high, taller than the 1U rack unit the ears
  fill.
profile: passive
provenance:
  full-depth:
    confidence: drawing
    note: >-
      FULL DEPTH, the default - the duct stands 115.3 mm to each side of its backbone (the
      plan, 230.6 over both covers), so it reaches the face behind the mounting plane as
      well as the front.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. the FS High Capacity Horizontal Cable Managers
      datasheet (portal id 7671) draws CMH-DFDS1U as a plan and a front view, dimensioned
      482.61, 465.11, 57.81, 32.00 and 230.60. The embedded image is small (647 x 529,
      watermarked): 0.873 px/mm across the 482.61 and 0.872 along the 230.6, and resolves
      about 1.2 mm. The straight-on render of the front (gallery image 5) and the plan
      render (image 4) are the second reading.
  chassis:
    confidence: drawing
    note: >-
      drawing - THE BODY BETWEEN THE EARS. 482.61 over the ears; the cover between them
      reads 388 of 421.5 px, 444, which at this resolution is the 440 of the family to two
      pixels a side; 440 is taken. The ears are not drawn. Depth 230.6 is the plan and the
      spec table.
  height:
    confidence: drawing
    note: >-
      drawing - 57.8, AS THE DRAWING DIMENSIONS IT, TALLER THAN ITS RACK UNIT. The front
      view puts the 57.81 dimension on the cover, from its top edge to its bottom edge, and
      draws the ears inside it, top and bottom; the ear holes are dimensioned 32.00 apart.
      The spec table and the portfolio state 57.8. So the covers overhang the ears and the
      1U they fill by about 7 mm above and below, and the chassis is drawn 57.8 high in a 1U
      part. Two readings disagree with the figure and are not taken: the same front view,
      scaled off its own ear holes, draws the cover 54.2; the straight-on render reads 49 to
      51.5 against the 440 width, as CMH-SFDS1U reads its own 51 by the same method.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW DUCT ON EACH SIDE. A sheet body whose views are elevations. The
      front and rear views each carry the backbone as a well 114.7 deep, its floor the
      backbone, the two rows of fingers standing in it and a cover that comes off; the two
      floors stand 1.2 apart.
  thickness:
    confidence: estimated
    note: >-
      estimated - no FS document states the gauge; 1.2 is taken, as for the other FS steel
      managers in the library.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 1.65 kg, the FS product page specification for #315741, as read at intake.
  backbone:
    confidence: estimated
    note: >-
      estimated - the backbone is drawn 44 high, centred, the height of the ears it runs
      into; no view shows it end-on. The plan puts it at the middle of the 230.6.
  front:
    confidence: drawing
    note: >-
      drawing - the cover, fitted, 440 x 57.8, with four hinge clips staggered as on the
      front view: two on the top edge at 77.9 and 343.6 from the left end and two on the
      bottom at 121.4 and 300.0. The finger rows are 9.0 thick and 4.7 in from the top and
      bottom, ESTIMATED: there is no side view, and they are taken from the same moulding on
      CMH-SFDS1U and CMH-DFDS2U.
  fingers:
    confidence: drawing
    note: >-
      drawing - ten fingers a row each side on the plan, stems 38.8 px apart, 44.4, the
      moulding of the other steel ducts; 44.0 is taken so that ten fill the 440 body. The
      fork of each stem is drawn as the stem.
  top:
    confidence: drawing
    note: >-
      drawing - the plan, rear cover at y=0: the rear channel, the backbone at the middle,
      the front channel.
  bottom:
    confidence: drawing
    note: >-
      drawing - the bottom row of fingers is the top row again.
  left:
    confidence: estimated
    note: >-
      estimated - no side view is drawn; the end elevation is built from the plan depths and
      the estimated rows. Both channels are open at the ends.
  rear:
    confidence: drawing
    note: >-
      drawing - the rear channel is the front channel turned round, as the plan draws it.
  backbone-holes:
    confidence: photo-measured
    note: >-
      photo-measured - gallery image 3 of #315741 shows light through the backbone in two
      places across the open front channel, so it may be pierced as the single-sided
      backbones are; no view gives the openings. Drawn solid; see the gap.
  guides:
    confidence: drawing
    note: >-
      drawing - one duct on each of the front and rear views, the channel between the finger
      rows.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - searched: the high capacity datasheet carries no capacity figure, and the
      cable managers portfolio gives dimensions only. Recorded as a gap.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - style, sides, material and the UL 94 V-0 rating of the finger ducts are
      the Technical Specification table and overview of the FS High Capacity Horizontal
      Cable Managers datasheet (portal id 7671); indoor its Environment row.
  color:
    confidence: estimated
    note: >-
      estimated - no colour row in the datasheet; every render is black, drawn in the shades
      CMH-SFDS1U reads off its renders.
attrs:
  physical:
    weight-kg: 1.65
    material: Steel
  compliance:
    flammability: UL 94 V-0 (the finger ducts)
    environment: Indoor
chassis:
  width: 440.0
  height: 57.8
  depth: 230.6
  ru: 1
  shell: sheet
  thickness: 1.2
  weight-kg: 1.65
  color: '#1b1c1e'
gaps:
  - what: cable-capacity
    scope: [base]
    reason: vendor-silent
    note: >-
      no FS document held states a cable capacity for CMH-DFDS1U: the datasheet that covers
      it has no Cable Capacity Reference Guide, and the cable managers portfolio lists only
      dimensions. The product page could not be read (403 from the shop front).
    wanted: the capacity row of the product page, or a capacity table in a later datasheet
  - what: backbone-pass-through
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      no view draws the backbone face. Gallery image 3 of #315741 shows light through it in
      two places across the open front channel; the openings are not drawn, and the backbone
      is drawn solid.
    wanted: a straight view of the backbone with a cover off
groups:
  body:
    term: Duct
    role: furniture
    index-origin: 1
    description: the backbone, seen from the front channel and from the rear one
  fingers:
    term: Finger
    role: furniture
    index-origin: 1
    description: >-
      the fingers, 10 a row: front channel upper row, front lower, then rear upper and rear
      lower
  cover:
    term: Cover
    role: furniture
    index-origin: 1
    description: the two covers, front then rear
