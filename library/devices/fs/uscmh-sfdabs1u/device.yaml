name: uscmh-sfdabs1u
version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: USCMH-SFDABS1U
aliases:
  - {name: '317015', kind: vendor}
description: >-
  1U single-sided horizontal cable manager, FS SKU #317015: a black ABS finger duct with a double-hinged cover that opens upward or downward. A base plate between the rack ears carries a row of nine fingers along its top edge and another along its bottom, eight slots in each, and the curved cover clips on the finger tips to close the channel; behind the plate a ribbed moulding stiffens it.
profile: passive
provenance:
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the fingers and cover stand 61.46 mm in front of the plane of
      the ears and the base 35.54 behind it (the top view), so the rear face of its rack
      unit stays free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. The FS 1&2RU Horizontal Single Sided Manager datasheet (USCMH-SFDABS1U and -2U) has a specification table and, per model, a top view, a front view and a side view in millimetres. Rendered at 600 dpi, the front view is
      4.28 px/mm across the 482.22 and 4.38 down the 44.3, 2 per cent apart, and the top view 4.26
      across and 4.27 down its 97.00, so both carry geometry to about a millimetre. The side view
      does not: its 65.81 dimension reads 4.35 px/mm along the depth, but its height reads 58.5 mm
      against the 44.3 of the front view, so nothing is taken up its height. The renders of
      #317015 on the FS product page are the second reading; gallery image 5 is the front with
      the cover off.
  chassis:
    confidence: drawing
    note: >-
      drawing - THE BODY BETWEEN THE EARS. The specification table gives 44.0 x 482.2 x 97.0
      mm (1.73 x 18.98 x 3.81 in); the front view dimensions 44.3 high, 482.22 wide and the ear
      holes 31.74 apart, and draws the ear folds 23.0 mm in from each end, so the duct between
      them is 436.3. The ears are the ends of the base plate and are not drawn. 44.3 is taken
      for the height, the drawing over the table's rounded 44.0. `depth` STATES THE VENDOR
      OVERALL 97.00 (the top view's Ref figure): the fingers and the cover stand 61.46 in front
      of the plane of the ears (2.42 in on the dimensioned render) and the ribbed base 35.54
      behind it at its deepest.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW DUCT, NOT A BOX, built as CMH-SFD1U is: the base plate on the front
      view as a well 61.26 deep whose floor is open at the pass-through windows, the two
      rows of fingers standing in it, the cover in it across the finger tips, which lifts off
      and opens the channel, and the base behind the ears closed by plates sunk just inside
      the rear, top, bottom and side faces. The channel, the slots between the fingers and the
      two ends are open air.
  base-shape:
    confidence: drawing
    note: >-
      drawing - THE BASE BEHIND THE EARS IS BOWED in the top view, 35.5 deep at the middle and
      about 24 at 40 mm from each end, and tapers toward the back in the side view. It is drawn
      as a straight box the full 35.5 deep and the full height: a curved back is not something
      the sheet body's plates can express. The X-ribs on it are not drawn.
  thickness:
    confidence: estimated
    note: >-
      estimated - no FS document states a wall gauge for the ABS moulding; 10 is the estimated
      thickness of a finger across the height of the duct, and the plates and the cover are
      thinner, each in its own part.
  front:
    confidence: drawing
    note: >-
      drawing - the cover, fitted, 12.37 deep, the 61.46 to the front less the 49.09 (Ref) the top view gives from the ears to the back of the cover. The finger walls are placed 1.0 inside
      the top and bottom of the duct and 10 thick, estimated: the renders show the upper row's
      roots in the top quarter of the plate. The `duct` guide is the channel between them over
      the full width, on the top view's pitch and gap.
  fingers:
    confidence: drawing
    note: >-
      drawing - the top view: nine fingers a row, the middle seven on a 53.9 mm pitch with the
      middle one on the middle of the duct, 19.5 wide, and the two end fingers centred 207.8
      from the middle at mid-length. The end fingers are swept toward the middle in the top
      view; they are drawn straight, centred 202.15 from the middle so that their 32 mm tips
      end flush with the ends of the duct, 5.65 inside where their mid-length reads.
  top:
    confidence: drawing
    note: >-
      drawing - the top view, rear at y=0: the base 35.54 deep behind the plane of the
      ears, the fingers to the back of the cover with the slots dark between them, and the
      cover over the last 12.37.
  bottom:
    confidence: drawing
    note: >-
      drawing - the renders draw the same fingers along the bottom as along the top; the
      bottom is the top again.
  left:
    confidence: drawing
    note: >-
      drawing - the side view along the depth: the base, the two rows of fingers, and the
      cover's edges over their tips. The duct is open at both ends, and nothing is built
      across them.
  rear:
    confidence: photo-measured
    note: >-
      photo-measured - the back of the base with the pass-through windows of the front, which
      the renders show the background through: 85.7 x 12 at [67.45, 14.7]; 85.7 x 12 at [283.15, 14.7]. The back is built as plates round
      them, sunk 0.05 inside the rear face, as CMH-SFD1U 0.1.2 builds its back. The window
      heights are estimated where the fingers hide their lower edges.
  guides:
    confidence: estimated
    note: >-
      estimated - the duct on the front view is the channel between the finger walls, run
      across the rack; the finger pitch and gap are the top view figures, the channel height
      the estimated wall placement above.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - style, material, colour, environment and the included accessories are the
      specification table of the FS 1&2RU Horizontal Single Sided Manager datasheet; RoHS and ISO 9001 are its Standards Compliance
      list.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". Every image FS publishes of the part is a render; it is drawn
      in CMH-SFD1U's shades, the cover a little lighter than the duct.
