gaps:
  - what: weight
    reason: vendor-silent
    note: >-
      neither datasheet, the product portfolio nor the selector states a weight for
      USCMH-SFDABS1U.
    wanted: the FS product page specification table
  - what: cable-capacity
    reason: vendor-silent
    note: >-
      FS states no cable capacity for USCMH-SFDABS1U in any document held; the CMH-SFD1U family
      has a Cable Capacity Reference Guide table and this line does not.
    wanted: a capacity table for the USCMH finger ducts
  - what: cover-hinge
    scope: [front]
    reason: vendor-silent
    note: >-
      the datasheet calls the cover double-hinged, opening upward or downward; no view draws
      the hinge, and the cover is drawn as one fitted plate.
    wanted: a drawing of the cover's section
