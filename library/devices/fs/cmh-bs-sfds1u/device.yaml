format: 1
kind: device
name: cmh-bs-sfds1u
version: 0.1.1
maturity: modelled
manufacturer: FS.com
model: CMH-BS-SFDS1U
description: >-
  1U single-sided horizontal cable manager, FS CMH-BS-SFDS1U: a steel channel between the
  rack ears whose top and bottom walls are cut into sixteen ABS fingers by fifteen slots, a
  cover clipped over the hooked tips of the walls, and two long pass-through holes in the
  base. 70 mm deep. FS publishes no shop page and no image of it, only a datasheet with a
  three-view drawing.
profile: passive
provenance:
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the base is the mounting plane and the duct stands 70 mm in
      front of it (the end view), so the rear face of its rack unit stays free.
  sources:
    confidence: drawing
    note: >-
      drawing - FS published three datasheets titled CMH-BS-SFDS1U on 2026-10-06 (portal ids
      12082, 12083 and 12084), with the same specification table. 12083 and 12084 embed a
      byte-identical drawing of this part (a plan, the back and an end view, dimensioned
      483, 465, 43.8, 31.7 and 70); 12082 embeds a drawing of a 2U dual-sided duct 176 deep
      (482.6, 465, 87, 176), the numbers of CMH-BS-DFDABS2U, and is not used here. The prose
      of 12082 and 12083 calls the part ABS plastic, that of 12084 steel; the table of all
      three says steel with ABS fingers, and 12084 is cited as the datasheet.
  method:
    confidence: drawing
    note: >-
      drawing - the embedded drawing (1011 x 565) is 1.2547 px/mm across the 483, 1.256 down
      the 43.8 and 1.257 along the 70: orthographic, but coarse, about 1.6 mm. No render or
      photograph of the part is published.
  chassis:
    confidence: drawing
    note: >-
      drawing - THE BODY BETWEEN THE EARS. The back view gives 483 over the ears and 465
      between the hole centres; the plan draws the duct 546 px wide, 435.2, between ears of
      23.9, which are not drawn. Height 43.8 and depth 70, as dimensioned and as the spec
      table states them.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW DUCT. A sheet body whose views are elevations; the solid is the
      base as a well 68 deep, open at its two holes, the fingers of the two slotted walls
      standing in it, and the cover, which comes off. The rear view builds the back of the
      base as sunk plates round the holes.
  thickness:
    confidence: estimated
    note: >-
      estimated - no gauge is stated; 1.2 is taken, as for the other FS steel managers in
      the library.
  front:
    confidence: estimated
    note: >-
      estimated - the cover, fitted, over the full face. The fingers are the two slotted
      walls end-on, 6.0 thick, ESTIMATED: no view draws the wall section, and the back view
      bounds it, its holes starting 8.3 in from the edge.
  fingers:
    confidence: drawing
    note: >-
      drawing - the plan, at 1.2547 px/mm: fifteen slots 13.5 px wide, 10.8, on a pitch of
      34.9 px, 27.8, so fourteen fingers 16.9 wide between them and an end block of 17.6 at
      each end, 435.2 in all. Each slot runs from a round root 19 mm from the back to the
      shoulder of the wall, 56 from the back, and is open there toward the cover. The
      shoulder, where the end view steps the wall in by about 5 mm to the hooks the cover
      clips to, is not drawn: the fingers run straight to the cover.
  top:
    confidence: drawing
    note: >-
      drawing - the plan, rear at y=0: the base, the root of the wall to 19, the fingers and
      the slots between them, and the cover edge.
  bottom:
    confidence: drawing
    note: >-
      drawing - the end view draws the bottom wall as the top one, mirrored.
  left:
    confidence: drawing
    note: >-
      drawing - the end view, 70 x 43.8: base, the two walls, the cover across the front.
      The hooks are drawn as the walls; the duct is open at both ends.
  rear:
    confidence: drawing
    note: >-
      drawing - the back view: two obround holes 193 to 194 px long, 154.2, and 34 px high,
      27.2, 46.6 apart and symmetric about the middle, from 40.1 to 395.1 across the body.
  guides:
    confidence: drawing
    note: >-
      drawing - the duct is the channel between the two walls, run across the rack; finger
      pitch 27.8 and the 10.8 slot.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - Cable Capacity (Theoretical Value) 48pcs (Cat6 24AWG), the specification
      table of all three datasheets. No fill basis is stated.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - material, finger material, colour, temperature, humidity, the environment
      and the M6 screws and nuts are the specification table of the CMH-BS-SFDS1U datasheet.
  color:
    confidence: estimated
    note: >-
      estimated - Color: Black. No image of the part exists; drawn in the shades of the
      other steel ducts.
