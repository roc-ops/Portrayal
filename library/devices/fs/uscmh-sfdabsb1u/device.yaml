manufacturer: FS.com
model: USCMH-SFDABSB1U
aliases:
  - {name: '317023', kind: vendor}
description: >-
  1U single-sided horizontal cable manager, FS SKU #317023: the deep USCMH-SFDABS1U, a black ABS finger duct whose fingers stand 127 mm in front of the rack ears, with a double-hinged cover that opens upward or downward. Nine fingers along the top edge of the base plate and nine along the bottom, and the curved cover clips on their tips to close the channel; a ribbed moulding stiffens the plate behind.
profile: passive
provenance:
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the fingers and cover stand 127.26 mm in front of the plane of
      the ears and the base 35.57 behind it (the top view), so the rear face of its rack
      unit stays free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. The FS Horizontal Single Sided Manager datasheet (USCMH-SFDABSB1U and -B2U) has a specification table and, per model, a top view, a front view and a side view in millimetres. The model is lettered CMH-SFDABSB1U on the
      drawing page. Rendered at 600 dpi, the front view is 4.29 px/mm across the 482.22 and 4.63
      down the 44.3, 7.7 per cent tall; its side view reads 48.5 mm up the height at the scale
      of its 131.61 dimension, and its top view 3.97 px/mm down the 162.83 against 4.30 across,
      8 per cent short. The page is not to scale down, so heights and depths are taken from
      its dimensions only and widths at 4.30 px/mm. Along the depth the side view's 131.61 and 121.09 are the
      127.26 of the top view plus the 4.35 the 1U side view also adds, so the cover is 10.5 deep.
      The top view repeats the USCMH-SFDABS1U plan, nine fingers on the same pitch, with the
      fingers 2.4 times as long. The renders of #317023 are the second reading.
  chassis:
    confidence: drawing
    note: >-
      drawing - THE BODY BETWEEN THE EARS. The specification table gives 44.3 x 482.2 x 162.8
      mm (1.74 x 18.98 x 6.4 in) and the front view 44.3 high, 482.22 wide and the ear holes 464.47
      apart across and 31.75 up; its ear folds stand 23.1 mm in from each end, so the duct is
      436.3 wide, and the ears are not drawn. `depth` STATES THE VENDOR OVERALL 162.83: THE
      PRODUCT SELECTOR'S 5.01 in [127 mm] IS THE PROJECTION IN FRONT OF THE EARS, the 127.26 of
      the top view and the 5.01 in of the dimensioned render, and the table's 6.4 in and the
      drawing's 162.83 agree; the ribbed base stands 35.57 behind the ears.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW DUCT, NOT A BOX, built as CMH-SFD1U is: the base plate on the front
      view as a well 127.06 deep whose floor is open at the pass-through windows, the two
      rows of fingers standing in it, the cover in it across the finger tips, which lifts off
      and opens the channel, and the base behind the ears closed by plates sunk just inside
      the rear, top, bottom and side faces. The channel, the slots between the fingers and the
      two ends are open air.
  base-shape:
    confidence: drawing
    note: >-
      drawing - THE BASE BEHIND THE EARS IS BOWED in the top view, as on USCMH-SFDABS1U, 35.6
      deep at the middle. It is drawn as a straight box the full 35.6 deep and the full height;
      the X-ribs on it are not drawn.
  thickness:
    confidence: estimated
    note: >-
      estimated - no FS document states a wall gauge for the ABS moulding; 10 is the estimated
      thickness of a finger across the height of the duct, and the plates and the cover are
      thinner, each in its own part.
  front:
    confidence: drawing
    note: >-
      drawing - the cover, fitted, 10.5 deep, from the side view: 131.61 to the front of the cover less the 121.09 to its back. The finger walls are placed 1.0 inside
      the top and bottom of the duct and 10 thick, estimated: the renders show the upper row's
      roots in the top quarter of the plate. The `duct` guide is the channel between them over
      the full width, on the top view's pitch and gap.
  fingers:
    confidence: drawing
    note: >-
      drawing - the top view: nine fingers a row, the middle seven on a 53.9 mm pitch with the
      middle one on the middle of the duct, 19.5 wide, and the two end fingers centred 207.8
      from the middle at mid-length. The end fingers are swept toward the middle in the top
      view; they are drawn straight, centred 202.15 from the middle so that their 32 mm tips
      end flush with the ends of the duct, 5.65 inside where their mid-length reads. The V-shaped cable retainers the top view draws on the sides of the fingers near their tips are not drawn.
  top:
    confidence: drawing
    note: >-
      drawing - the top view, rear at y=0: the base 35.57 deep behind the plane of the
      ears, the fingers to the back of the cover with the slots dark between them, and the
      cover over the last 10.5.
  bottom:
    confidence: drawing
    note: >-
      drawing - the renders draw the same fingers along the bottom as along the top; the
      bottom is the top again.
  left:
    confidence: drawing
    note: >-
      drawing - the side view along the depth: the base, the two rows of fingers, and the
      cover's edges over their tips. The duct is open at both ends, and nothing is built
      across them.
  rear:
    confidence: photo-measured
    note: >-
      photo-measured - the back of the base with the pass-through windows of the front, which
      the renders show the background through: 85.7 x 12 at [67.45, 14.7]; 85.7 x 12 at [283.15, 14.7]. The back is built as plates round
      them, sunk 0.05 inside the rear face, as CMH-SFD1U 0.1.2 builds its back. The window
      heights are estimated where the fingers hide their lower edges.
  guides:
    confidence: estimated
    note: >-
      estimated - the duct on the front view is the channel between the finger walls, run
      across the rack; the finger pitch and gap are the top view figures, the channel height
      the estimated wall placement above.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - style, material, colour, environment and the included accessories are the
      specification table of the FS Horizontal Single Sided Manager datasheet (USCMH-SFDABSB1U, USCMH-SFDABSB2U); RoHS and ISO 9001 are its Standards Compliance
      list.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". Every image FS publishes of the part is a render; it is drawn
      in CMH-SFD1U's shades, the cover a little lighter than the duct.
