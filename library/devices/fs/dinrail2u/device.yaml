format: 1
kind: device
name: dinrail2u
version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: DINRAIL2U
aliases:
- {name: '178163', kind: vendor, note: FS shop product ID}
description: >-
  2U 19in adjustable DIN rail bracket, FS DINRAIL2U: two black steel side brackets 360 mm deep
  whose front ends fold out into ears, joined by a rail panel carrying a 400 mm TS35 DIN rail
  that slides back along slots in the brackets, so DIN-rail equipment - industrial switches, media
  converters, power supplies, breakers - can stand in a 19in rack.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      the FS 2/4U DIN Rail Bracket datasheet (portal 9718), its DINRAIL2U front, top, side and
      isometric views in mm, rendered at 300 dpi; the gallery renders of SKU 178163; the DINRAIL2U
      quick start guide (portal 5940) for the assembly and the hardware; the FS DIN Visio stencil
      (master DINRAIL2U).
  chassis:
    confidence: datasheet
    note: >-
      87.5 x 484 x 360 (HxWxD) over the ears, which is the part. THE EARS ARE BUILT IN: each is
      the front end of a side bracket folded out flat, one piece with the bracket that forms the
      frame's side (the datasheet's front and isometric views; renders g1 and g2 of SKU 178163),
      so under the owner's rule of 2026-10-09 they are part of the face and always drawn, 29.9
      each side: the front is the 484 face, and the chassis is the 424.2 between the side brackets,
      which is what the other five faces and the side brackets in 3D are (as the FHD-1UFMT-N draws
      its plate). On the 300 dpi front view the outer edges stand 484 apart at 1.37 px/mm and
      the folds 29.9 in from each.
  sheet:
    confidence: estimated
    note: >-
      `shell: sheet`, 1.5: an open frame of bent steel - two side brackets, a rail panel and a
      rail - which a solid box would hide. In 3D the side brackets are built from the side views
      and the panel and rail from the front view, each standing its thickness off its face; the
      six views are elevations. The panel is built at the front plane; on the real bracket it
      is set back and slides.
  rail:
    confidence: drawing
    note: >-
      a TS35 x 7.5 rail 400 long (fs/din-rail-ts35-400@1) centred on the panel's height, its centre
      line 43.75 below the top: the datasheet's front views draw it across the whole 400 panel
      at mid-height (the 4U's measures 82.2 down on the 300 dpi render, the 165.1 face's middle
      being 82.55).
  setback:
    confidence: drawing
    note: >-
      the rail panel slides along the two long slots in each 360 mm side bracket ("the adjustable
      rails can be easily set back"; QSG: adjust the rail panel's position to suit the device),
      from about 66 to 290 mm behind the ears on the side view. It is drawn at the front.
  hosting:
    confidence: datasheet
    note: >-
      for #935: one TS35 x 7.5 rail, 400 mm long, centred 43.75 mm below the top of the 87.5 mm
      face, set back adjustably along the 360 mm side brackets; the width between the side brackets
      is 421.2; the space available behind the rail runs to the 360 mm depth. FS states no load
      rating. Recorded in `attrs.physical`.
  eia:
    confidence: registry
    note: >-
      EIA-310 hole positions: the rail holes of each rack unit stand 6.35, 22.225 and 38.1 mm
      up from its bottom, and the two rails' holes are 465.1 mm apart across the rack. The part
      is taken as centred in the rack units it fills.
  color:
    confidence: photo-measured
    note: >-
      black steel and a silver zinc-plated rail, as every render shows.
  lifecycle:
    confidence: estimated
    note: >-
      searched 2026-10-09: no FS end-of-sale notice for this part was found in the intake's portal
      tree or by name. The product page (SKU 178163) was live on 2026-10-08.
