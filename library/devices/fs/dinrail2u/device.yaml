format: 1
kind: device
name: dinrail2u
version: 1.0.0
maturity: modelled
manufacturer: FS.com
model: DINRAIL2U
aliases:
- {name: '178163', kind: vendor, note: FS shop product ID}
description: >-
  2U 19in adjustable DIN rail bracket, FS DINRAIL2U: two black steel side brackets 360 mm deep
  whose front ends fold out into ears, joined by a rail panel carrying a 400 mm TS35 DIN rail
  that slides back along slots in the brackets, so DIN-rail equipment - industrial switches, media
  converters, power supplies, breakers - can stand in a 19in rack.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      the FS 2/4U DIN Rail Bracket datasheet (portal 9718), its DINRAIL2U front, top, side and
      isometric views in mm, rendered at 300 dpi; the gallery renders of SKU 178163; the DINRAIL2U
      quick start guide (portal 5940) for the assembly and the hardware; the FS DIN Visio stencil
      (master DINRAIL2U).
  chassis:
    confidence: datasheet
    note: >-
      87.5 x 484 x 360 (HxWxD) over the ears, which is the part. THE EARS ARE BUILT IN: each is
      the front end of a side bracket folded out flat, one piece with the bracket that forms the
      frame's side (the datasheet's front and isometric views; renders g1 and g2 of SKU 178163),
      so under the owner's rule of 2026-10-09 they are part of the face and always drawn, 29.9
      each side: the front is the 484 face, and the chassis is the 424.2 between the side brackets,
      which is what the other five faces and the side brackets in 3D are (as the FHD-1UFMT-N draws
      its plate). On the 300 dpi front view the outer edges stand 484 apart at 1.37 px/mm and
      the folds 29.9 in from each.
  sheet:
    confidence: estimated
    note: >-
      `shell: sheet`, 1.5: an open frame of bent steel - two side brackets, a rail panel and a
      rail - which a solid box would hide. In 3D the side brackets are built from the side views,
      standing their thickness off them. The panel is a well on the front view whose floor is
      the plate at its setback, black with its cut-outs open, and the rail stands 7.5 off that
      floor with its face art - flanges, crown, slots - on its front. The six views are elevations.
  rail:
    confidence: drawing
    note: >-
      a TS35 x 7.5 rail 400 long (fs/din-rail-ts35-400@1) centred on the panel's height, its centre
      line 43.75 below the top: the datasheet's front views draw it across the whole 400 panel
      at mid-height (the 4U's measures 82.2 down on the 300 dpi render, the 165.1 face's middle
      being 82.55).
  setback:
    confidence: drawing
    note: >-
      the rail panel's front face can stand from 51.2 to 271.2 mm behind the ears, and is
      drawn at 161.2, the middle of that travel; the rail's face stands 7.5 in front of the
      panel's. The panel slides along the two long slots in each 360 mm side bracket ("the
      adjustable rails can be easily set back"; QSG: adjust the rail panel's position to
      suit the device). On the datasheet's side view (p2, an embedded 461 x 212 px raster,
      about 1.1 mm a pixel, read on a 600 dpi upsampled render at 3.342 px/mm along the 360)
      the slots run 64.4 to 292 and are about 5.2 wide. The slot's front end is hidden under
      the screw head drawn at 69.4, so the front stop is taken at that screw rather than at
      64.4 + 2.6 = 67.0; a screw's centre travels from 69.4 to 289.4, the front end good to
      about 1.5 mm. The panel's tab spans 51.2 to 87.1 with its screw at 69.4, so the panel
      face stands 18.2 in front of the screw. The face travel is the screw travel less that.
      The gallery renders show it at both ends of that travel: g4 about 85 and g3 about 227
      behind the ears, each read along the near side bracket as a fraction of its 360 (a
      three-quarter render, so to perhaps 10 per cent). With no single photographed
      position, the middle of the travel is the default; the range is in attrs and the
      format cannot offer the other positions (see gaps).
  joint:
    confidence: drawing
    note: >-
      for #971: how the rail panel meets the side brackets. The panel (fs/dinrail2u-panel@2) is the
      421.2 between the brackets' inner faces: the datasheet's 400.00 is the rail, and
      on its top view its plate runs from bracket to bracket, the rail stopping short of each. At each end the panel
      folds back along the bracket's inner face as a flange, and a tab at its top and bottom
      lies on the bracket's edge, which is lowered 6.1 between the bracket's ends to
      take it (the side view, p2; gallery render g4 of SKU 178163). Two M5 screws a
      side (the quick start guide: "the M5 screws and nuts"; the side view draws two) pass through the bracket's
      two slots into the flange, which is how the panel slides and is fixed (#950). At the
      default setback the tab and flange run 161.2 to 197.1 behind the ears and the
      screws stand at 179.4, the offsets the setback note reads; the screws are
      common/pan-screw-m5@1, the pan head render g4 shows. The flange is drawn under the side
      bracket, seen through its slots and window; its depth is taken as the tab's. In the plan
      views the tab reaches 15.6 in from the bracket's inner face and overhangs its outer
      face by 8.9 (the top view, 1.116 mm a pixel); the overhang lies outside the plan views,
      which stop at the brackets, so only the 3D tab on the side views (standing 10.4 off the
      side, the plate's 1.5 and the overhang) carries it. The screw heads are drawn over the
      bracket, whole, on its outer face over the slot, as render g4 shows them (the bracket is
      `under` them), standing the plate's 1.5 off the face.
      WHAT IS ESTIMATED in this note, the rest being read from the drawings: the tab's 3.9
      height on the side views, which no view dimensions (it is drawn to end on the lowered
      edge, inside the 6.1 step); the flange's depth along the bracket, taken as the tab's,
      and its height, taken as the whole span between the two tabs; the tab's 15.6 reach and
      8.9 overhang, each about 14 and 8 pixels of a raster at 1.1 mm a pixel, so good to a
      millimetre or so at best; and the 6.1 of the lowered edge, 5.5 pixels of the
      side view's raster at 1.1 mm a pixel.
  hosting:
    confidence: datasheet
    note: >-
      for #935: one TS35 x 7.5 rail, 400 mm long, centred 43.75 mm below the top of the 87.5 mm
      face, its panel's face 51.2 to 271.2 behind the ears; the width between the side brackets
      is 421.2; the space available behind the rail runs to the 360 mm depth. FS states no load
      rating. Recorded in `attrs.physical`.
  eia:
    confidence: registry
    note: >-
      EIA-310 hole positions: the rail holes of each rack unit stand 6.35, 22.225 and 38.1 mm
      up from its bottom, and the two rails' holes are 465.1 mm apart across the rack. The part
      is taken as centred in the rack units it fills.
  color:
    confidence: photo-measured
    note: >-
      black steel and a silver zinc-plated rail, as every render shows.
  lifecycle:
    confidence: estimated
    note: >-
      checked 2026-10-09 against what the intake holds: the FS documentation portal's Accessories
      tree, read on 2026-10-08, carries no end-of-sale notice for this part. The product page
      (SKU 178163) was live on 2026-10-08. No web search beyond FS's own pages was made.
