gaps:
- what: load-rating
  reason: vendor-silent
  note: >-
    no FS document states what the DINRAIL2U or its rail may carry.
  wanted: a load rating from FS
- what: din-profile
  reason: vendor-silent
  note: >-
    FS does not name the rail's profile; TS35 x 7.5 is read off the close-up render.
  wanted: the profile from FS or a ruler on the rail
- what: setback
  reason: vendor-silent
  note: >-
    the rail panel's face can stand from 51.2 to 271.2 mm behind the ears; it is drawn at 161.2,
    the middle, and no configuration offers the other positions, because the format has no way
    to move a part along a slot per configuration.
  wanted: a setback field or configuration key for adjustable parts
- what: panel-flange
  reason: needs-photo
  note: >-
    the rail panel's flange, folded back along each bracket's inner face, is drawn as long as the
    tab above it, and the tab's inward reach is read off one coarse top view (about 1.1 mm a
    pixel); no view shows the flange whole, and the tab's 8.9 overhang outside the bracket is
    built in 3D but lies outside the plan views. The tab's 3.9 height on the side views is
    estimated too: no view dimensions it.
  wanted: a photograph of the panel's end from inside the bracket, or the panel's flat pattern
