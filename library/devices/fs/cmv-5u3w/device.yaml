description: >-
  5U vertical finger bracket, FS SKU #64186: a black ABS comb that screws to the front of
  one rack rail through the same holes as the equipment's ears and stands forward of it,
  at that rail's side of the opening. Six fingers one rack unit apart project 84 mm from
  the rail, each capped at its front end so a cable pressed between two of them is held;
  brackets stack to make a vertical manager of any height. It takes no rack unit of its
  own.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. The FS Vertical Cable Managers with Finger Ducts
      datasheet (page 6) draws CMV-5U3W twice, a side view and a top view, in inches with
      millimetres in brackets. Measured on the embedded rasters at native size: the side
      view is 11.86 px/mm across its 84 and 11.85 down its 222, the top view 11.86 across
      the 84 and 11.88 across the 26 - all orthographic, good to a tenth of a millimetre.
      The renders of #64186 on the product page (64186.g6 straight-on from the side,
      64186.g2 from behind, 64186.x2 dimensioned) are the second reading, and the Quick
      Start Guide V3.0 step 3 shows it fitted.
  mount:
    confidence: drawing
    note: >-
      drawing - `rack-face`. The Quick Start Guide V3.0 step 3 screws the bracket to the
      front of a rail with M6 screws and cage nuts (the product page: "for 2~3mm bracket
      ears thickness", so through the equipment's own ears), its flange flat on the rail
      and its fingers standing forward of it, on the left rail and on the right. It is
      narrower than the opening and stands at one rail's side of it, so a lab places it
      with a `side` (docs/vertical-cable-managers-design.md section 3.4); two on one unit,
      one each side, do not conflict. `ru: 5` is the rack units its 222 spans.
  chassis:
    confidence: drawing
    note: >-
      drawing - WIDTH AND DEPTH SETTLED FROM THE DRAWING. FS prints the part two ways: the
      product page 222 x 26 x 84 (HxWxD), the datasheet table 222 x 84 x 25.3 with a "Rack
      System Width" of 3.0 in. The top view settles it: an L whose long arm is a finger, 84
      (3 in) long and 11 thick (0.43 in), and whose short arm is the flange, 26 (1.02 in)
      across and 4.8 thick. The guide's step 3 puts the flange on the rail face and the
      fingers standing out of it, so the part is 26 wide across the rack's face, 222 high,
      and 84 deep, its outward projection - the product page's figures. The datasheet's
      25.3 is no dimension on the drawing; it reads as the 26 of the flange.
  shell:
    confidence: drawing
    note: >-
      drawing - an open comb, not a box: a sheet body (docs/cable-managers-design.md
      section 4) whose six views are elevations. The solid is the flange as a well 79.2 deep
      on the front view, and the spine and the six fingers standing in it; the back of the
      flange is a plate sunk 0.05 inside the rear face.
  thickness:
    confidence: drawing
    note: >-
      drawing - 4.8, the flange on the top view (57 px at 11.86 px/mm).
  hand:
    confidence: estimated
    note: >-
      estimated - the fingers stand along one edge of the flange, 3.6 to 14.6 of its 26
      (the top view), and the guide's step 3 shows them at the outer edge of the left
      rail, with the screws inward of them. The bracket is drawn as it stands on the left
      rail, fingers at the left of its front; on the right rail it is the same part turned
      end over end, which nothing in a lab placement turns yet.
  front:
    confidence: drawing
    note: >-
      drawing - the bracket from the front of the rack: the flange 26 wide, the spine and
      the six fingers end-on along its left edge, their caps in front. The figures are the
      side view's heights and the top view's widths.
  rear:
    confidence: drawing
    note: >-
      drawing - the back of the flange, the face that lies on the rail: plain in the render
      from behind (64186.g2) apart from the comb of small tabs along the spine, which is not
      drawn. Mirrored, the spine is at the right.
  rear-not-drawn:
    confidence: drawing
    note: >-
      drawing - the comb of tabs along the back of the spine (64186.g2, and the guide's step
      3), where the screws pass, is not drawn: no view dimensions it, and the fixing points
      are a gap.
  top:
    confidence: drawing
    note: >-
      drawing - the top view of the datasheet, rear at y=0: the flange 4.8 deep across the
      26, the spine to 12.9 at its left edge, the topmost finger 11 thick from the spine to
      80.3 and its cap to 84.
  bottom:
    confidence: drawing
    note: >-
      drawing - the bottom is the top again: the side view draws the end fingers alike.
  left:
    confidence: drawing
    note: >-
      drawing - the side view of the datasheet, rear at x=0: the flange, the spine, the six
      fingers and their caps.
  right:
    confidence: drawing
    note: >-
      drawing - the left view mirrored; nothing stands beyond the fingers on the right but
      the flange.
  guides:
    confidence: drawing
    note: >-
      drawing - the duct on the front view is the column of fingers, run down the bracket;
      its finger pitch is the 44.4 between finger centres on the side view and its gap
      the 22.8 (0.9 in) between the middle fingers. Cables cross it through the gaps and
      run up and down beside it.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - the cable capacity table of the datasheet and of the Quick Start Guide
      V3.0 gives CMV-5U3W per cable type, theoretical values for reference only, with no
      fill stated. The figure stated is the Cat6 24AWG 6.1 mm row.
  weight:
    confidence: datasheet
    note: datasheet - 0.54 kg, the FS product page specification table for #64186.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - style, material (ABS, UL94V-0 on the product page), colour, the included
      fixings and the racks it matches are the specification table of the datasheet; RoHS
      and ISO 9001 its Standards Compliance list.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black"; every image FS publishes of the part is a render.
