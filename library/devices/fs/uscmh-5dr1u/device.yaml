format: 1
kind: device
name: uscmh-5dr1u
version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: USCMH-5DR1U
aliases:
  - {name: '317013', kind: vendor}
description: >-
  1U horizontal cable manager, FS SKU #317013: a flat black SPCC steel panel on the rack
  rails with five polycarbonate frames clipped into it and a detachable cover over their
  fronts, which closes an 80 mm channel across the rack. Each frame is open at the front
  in a slit between its turned-in ends, and four obround windows in the panel lead
  cables through to the back.
profile: passive
provenance:
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the frames and cover stand 82 mm in front of the panel's
      back, and only the panel's folded edges stand behind it, so the rear face of its
      rack unit stays free for another part (#854).
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR'S DRAWING, WHICH IS COARSE. FS's 0U/1U Horizontal Cable
      Manager datasheet draws this part on its last page: a front view of the panel
      (482 x 44), the frame's profile (80 x 43.5), the frame from the front (10) and an
      exploded view with the cover. The front view is 1.0726 px/mm across from the 482
      (517 px) and 1.068 down from the 44 (47 px), 0.4 % apart, so it is orthographic;
      at that scale a pixel is a millimetre. FS's renders (gallery images 1 to 6 and
      feature images 1 to 4) were used for what the drawing does not dimension.
  chassis:
    confidence: estimated
    note: >-
      estimated for the 430 and the 88.8; drawing for the 44. The drawing gives 482
      overall and does not mark the folds; the body is taken as the 430 between the
      folded edges that FS dimensions on its other three flat 1U D-ring panels, which
      leaves the outer frames 10.8 mm inside the folds. THE DEPTH SOURCES DISAGREE, and
      the drawing settles them: the 0U/1U datasheet's table and the product page's
      title say 3.14 in (80 mm), the product page's specification table says 3.23 in (82
      mm), and the drawing dimensions the frame alone 80. So 80 is the frame without
      the cover and 82 is the part with it; FS's dimensioned render (gallery image 4)
      gives both, 3.14 in at the frames and 3.23 in to the face of the cover. The panel's
      folded edges stand behind that, taken as 8 (estimated, in the flange contract), so
      the envelope is 88.8.
  thickness:
    confidence: estimated
    note: >-
      estimated - 1.2 mm, the sheet FS dimensions on the CMH-4DRB1U drawing. Nothing
      dimensions this part's sheet; the material is "SPCC" on the product page.
  weight:
    confidence: datasheet
    note: >-
      datasheet - "Weight 0.9lbs (0.41kg)" in the third column of the 0U/1U datasheet's
      table. That column is headed CMH-5DR1U, a second time, but carries this part's
      3.14 in depth and its weight, and the drawing on the same datasheet's last page is
      this part's: it is the USCMH-5DR1U column misheaded.
  front:
    confidence: drawing
    note: >-
      drawing - the front view: four obround windows 71.1 x 30, centred 51 and 153 mm
      either side of the middle, and a frame at the middle and every 102 mm either side
      of it, where the drawing puts a pair of clip slots and a round hole; the slot pairs
      read 102 apart at 1.07 px/mm. The cover is placed over the frames; pulling it shows
      the channel. FS's mark, printed on the left ear, is outside the body.
  rear:
    confidence: estimated
    note: >-
      estimated - the back of the plate with the four windows through it. FS publishes
      no image of the back.
  top:
    confidence: estimated
    note: >-
      estimated - an elevation: the folded edge behind the plate, the frames' upper arms
      from above and the cover's lip across their fronts. The bottom is the same from
      underneath, without the lip.
  left:
    confidence: drawing
    note: >-
      drawing - an elevation, the drawing's frame profile in front of the plate with the
      cover across its front, and the folded edges behind it. The right is the same,
      turned round.
  passes:
    confidence: drawing
    note: >-
      drawing - the four windows, open; the renders show them through to the back.
      Declared on the rear view, where they open onto the back of the plate: on the
      front the cover stands 80 mm in front of them, and a pass-through may not lie
      under a part on its face (L136), which reads the face in two dimensions.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the ring material, the mounting hardware, the capacity and "Indoor"
      are the third column of the 0U/1U datasheet's table. "SPCC" for the panel is FS's
      product page for #317013, which is not a held document.
  cable-capacity:
    confidence: datasheet
    note: >-
      datasheet - "Cable Capacity (Theoretical Value) 55pcs (Cat6 24AWG)" in the third
      column of the 0U/1U datasheet's table, for the whole manager. Stated once, here,
      and not divided among the frames.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". Every image FS publishes of the part is a render.
attrs:
  physical:
    weight-kg: 0.41
    material: SPCC
    ring-material: PC, UL 94V-2
    mounting-hardware: M6*15mm Screw x4 and M6 Nut x4
  performance:
    cable-capacity: 55
    cable-capacity-basis: >-
      Cat6 24AWG cables, theoretical - FS 0U/1U Horizontal Cable Manager datasheet,
      specification table, third column
  compliance:
    environment: Indoor
