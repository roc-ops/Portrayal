    scope: [front, rear, top, bottom]
    reason: needs-drawing
    note: >-
      FS's drawing gives 482 overall and does not mark where the panel's edges fold;
      the 430 between the folds is FS's figure for its three other flat 1U D-ring
      panels.
    wanted: a drawing that dimensions the folds, or a ruler on the part
  - what: cover
    scope: [front, top, left, right]
    reason: needs-drawing
    note: >-
      the cover is drawn in an exploded view and in renders only; its length, height,
      thickness and lip are estimated, and so is how deep the panel's folded edges run.
    wanted: a dimensioned section of the cover and the panel
