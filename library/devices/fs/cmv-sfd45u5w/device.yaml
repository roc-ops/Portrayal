maturity: modelled
manufacturer: FS.com
model: CMV-SFD45U5W
aliases:
  - {name: '63033', kind: vendor}
description: >-
  45U single-sided vertical cable manager, FS SKU #63033: a black ABS finger duct with a
  hinged PVC cover, 2108 mm tall in two 22.5U sections, that stands beside a 45U open-frame
  rack on four L-brackets bolted to the side of the upright. A moulded back plate with
  eight oval pass-throughs carries a wall of fingers down each edge, 23 a section at one
  rack unit apart, and the cover clips over their tips to close a channel 93 mm wide that
  runs the height of the rack. It takes no rack unit.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. The FS Vertical Cable Managers with Finger Ducts
      datasheet (page 4) draws ONE 22.5U section of CMV-SFD45U5W three ways - a back view,
      a side view and a cover back view - in inches with millimetres in brackets, and notes
      that the part is two of them, 83 in (2108mm) high. Measured on the embedded rasters at
      native size: the side view is 1.612 px/mm across its 165.1 and 1.612 down its 1022.4,
      the back view 1.276 across the 125.4 and 1.2715 down the 1022.4 (0.4 per cent apart),
      so both are orthographic and carry geometry to about a millimetre. The product-page
      renders of #63033 are the second reading (63033.g2 straight-on, 63033.x2 dimensioned,
      cover on and cover open), and the Quick Start Guide V3.0 steps 4 and 5 show how it
      mounts.
  mount:
    confidence: drawing
    note: >-
      drawing - `rack-side`. The Quick Start Guide V3.0 step 4 slots four L-brackets into
      keyed holes in the back of the duct ("The bracket is keyed to be installed in the two
      orientations") and step 5 bolts them with M6 screws and cage nuts to the side of the
      rack's upright, so the duct stands beside the rack, outside the rails, its fingers
      facing forward; the bracket's own datasheet (VRTCMB) says it also mounts a manager
      between two racks. The guide says the part suits 45U open-frame racks, and FS's
      compatibility matrix accepts it on the APC AR201 45U two-post only. It occupies no
      rack unit; `ru: 45` is the height it runs beside. Which side of the rack is a lab
      placement's to say (docs/vertical-cable-managers-design.md).
  chassis:
    confidence: drawing
    note: >-
      drawing - THE DUCT AS IT STANDS, cover fitted: `width` across the rack's face
      direction, `height` the height it runs, `depth` front to back. 138.8 wide is the
      cover (5.46 in [138.8mm] on the cover back view; 139 on the dimensioned render), over
      a 125.4 body (4.94 in [125.4mm] on the back view; the table's 4.9 in, 125) centred
      under it - the cover is the widest thing on the part, as the 52 mm cover of the
      CMH-UHD-SFDABS1U is over its 44 mm ear. 165.1 deep is the side view's 6.5 in
      [165.1mm] from the back plate to the cover clips, the table's 6.5 in. 2108 high is
      the table and the drawing's note, 83 in.
  sections:
    confidence: estimated
    note: >-
      estimated - THE TWO SECTIONS ARE DRAWN AS ONE LENGTH, the joint between them a seam.
      The drawing gives a section's back plate 1022.4 (40.25 in) and its cover 1050 (41.34
      in), and two covers make 2100 against the stated 2108; no document places the 8 mm or
      says how far apart the two back plates stand. Each section is drawn as half the 2108,
      1054, with its back plate centred in it (15.8 at each end) and its cover 1054 high, so
      the covers meet at the joint. The guide's step 5 inset shows the upper section lowered
      onto a peg on the lower one; the peg (18 mm on the side view) is not drawn.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW DUCT, NOT A BOX, as every FS finger duct in the library is
      (docs/cable-managers-design.md section 4). The body is a sheet body and its six views
      are elevations; the solid is what its parts build: the back plate as a well 138.2
      deep on the front view, its floor open at the eight pass-throughs; the two finger
      walls and 92 fingers standing in it; twelve cover clips a wall; and the two covers,
      which pull off and open the channel. The back of the plate is built as plates sunk
      0.05 inside the rear face, round the pass-throughs.
  thickness:
    confidence: estimated
    note: >-
      estimated - no FS document states a wall gauge. 1.5 is the cover plate, drawn as a
      thin moulding; the parts carry their own thicknesses.
  floor:
    confidence: drawing
    note: >-
      drawing - the floor of the well is the front of the back plate, 26.9 from the rear
      face: the side view puts the keyed bracket slots and the plate that carries them in
      the last 43 px of its 266 (26.7 mm). The box section of the plate behind the floor
      is not built; the plate's back is the rear view's plates.
  front:
    confidence: drawing
    note: >-
      drawing - the covers, fitted. With them off the front is the channel between the two
      finger walls, the tips of the fingers end-on along each edge and the back plate with
      its pass-throughs at the bottom of it. The walls are the outer 16 mm of the 125.4
      each side on the back view (21 px), so the channel is 93.4 wide. The 23 fingers of a
      section stand 44.44 apart (71.64 px over 22 pitches on the side view: one rack unit);
      an arm is 18.9 high and the gap between arms 25.5, the tip rises 21.1 above its arm
      and leaves a 12.4 neck to the next arm. Measured from the back plate's top on the
      side view, the first arm's top is 13.03 down.
  fingers-shape:
    confidence: drawing
    note: >-
      drawing - the side view draws each finger as a bar with a hooked tip, and the slot
      between two fingers as a loop rounded at its root, 43.4 from the rear; laid over the
      render at matched scale every arm, slot, tip and clip of the section lands within
      2 px (1.2 mm). A finger is drawn as a square bar 16 wide with a square tip; the
      small ribs along the wall roots on the back view are not drawn.
  clips:
    confidence: drawing
    note: >-
      drawing - the side view draws a block in front of the tips of six fingers a section
      (the 3rd, 5th, 11th, 13th, 19th and 21st), reaching the 165.1 overall: the clips the
      cover's hinge rails snap over. The view draws one wall; the cover opens to either
      side (the catalogue: opens left or right), so both walls carry them, estimated.
  rear:
    confidence: drawing
    note: >-
      drawing - the back view: the back plate 125.4 wide, with four ovals a section on its
      centre line, 56 wide (2.2 in), the end two 71.8 high (2.83 in), the middle two 137.8
      high (5.43 in), centred 66.1, 377.9, 644.5 and 956.3 below the top of the section's
      plate; each is a declared pass-through, open, through into the channel. The two
      keyed bracket slots a section the L-brackets hook into are painted, two blocks 37.7
      wide either side of the centre line and 70.8 high, centred 176.6 and 852.9 below the
      plate's top. The view is symmetric about its centre line, so the rear is the back
      view unmirrored.
  rear-not-drawn:
    confidence: drawing
    note: >-
      drawing - the two moulded arrows a section on the back view (the direction the
      section stands) and the rims round the ovals are not drawn: a moulded mark is not
      drawn, and the rims are relief nobody has measured.
  top:
    confidence: drawing
    note: >-
      drawing - the end of the duct seen from above, rear at y=0, from the side view's
      depths: the back plate to 26.9, the wall roots to 43.4, the topmost finger's arm to
      142.7 and its tip to 152.0, the cover rails to 163.6 and the cover to 165.1. No view
      draws the end; it is the side view's figures laid across the back view's widths.
  bottom:
    confidence: drawing
    note: >-
      drawing - the bottom end is the top end again: the side view is the same at both
      ends of a section.
  left:
    confidence: drawing
    note: >-
      drawing - the side view of the datasheet, both sections, rear at x=0: the back plate,
      the wall root, 46 arms and tips, twelve clips and the edge of the two covers, with
      the joint a seam.
  right:
    confidence: drawing
    note: >-
      drawing - the left view mirrored: the duct is the same on both sides.
  guides:
    confidence: drawing
    note: >-
      drawing - the duct on the front view is the channel between the two finger walls,
      93.4 wide, run down the height (`run: y`); its finger pitch is the 44.44 of the side
      view and its gap the 25.5 between arms.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - the cable capacity table of the same datasheet (and of the Quick Start
      Guide V3.0) gives CMV-SFD45U5W per cable type and notes the copper figures are
      theoretical, for reference only; it states no fill. The figure stated is the Cat6
      24AWG 6.1 mm row, as for every FS manager in the library. Not divided among the
      fingers: FS states it for the manager.
  weight:
    confidence: datasheet
    note: datasheet - 4.75 kg, the FS product page specification table for #63033.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - style, materials (ABS backbone, PVC cover), colour, the detachable
      cover, the included brackets and fixings, the 45U open rack it matches and RoHS and
      ISO 9001 are the specification table and Standards Compliance list of the datasheet.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". Every image FS publishes of the part is a render; the
      cover is drawn a shade lighter than the duct, as the renders show it.
attrs:
  physical:
    weight-kg: 4.75
    material: ABS
    cover-material: PVC
    color: Black
    mounting-hardware: Brackets x4, M6*15mm Screw x8 and M6 Nut x8
  performance:
    cable-capacity: 2745
    cable-capacity-basis: >-
      Cat6 24AWG, 6.1 mm - a theoretical value for reference (FS Vertical Cable Managers
      with Finger Ducts datasheet), which states no fill
  compliance:
    rohs: RoHS Compliant
    iso: ISO9001 Certificate
