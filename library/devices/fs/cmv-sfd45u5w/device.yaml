  ru: 45
  mount: rack-side
  shell: sheet
  thickness: 1.5
  weight-kg: 4.75
  color: '#2a2c2e'
gaps:
  - what: section-joint
    scope: [front, rear, left, right]
    reason: sources-disagree
    note: >-
      two 1050 covers on the drawing make 2100; the table and the drawing's note give
      2108. No document says where the 8 mm is or how far apart the two back plates stand.
    wanted: a dimensioned drawing of the assembled duct, or a ruler on a real one
  - what: bracket-stand-off
    scope: [rear]
    reason: vendor-silent
    note: >-
      how far the duct stands from the upright on its L-brackets, and whether it overlaps
      the rail, is drawn in the guide but never dimensioned; the bracket's own sheet
      (VRTCMB, 45.2 wide) is the only figure. The duct is drawn without its brackets, which
      FS sells and draws as a separate part.
    wanted: the AR201 upright and a dimensioned drawing of the bracket fitted
