format: 1
kind: device
name: fhd-1ube
version: 1.0.1
maturity: modelled
manufacturer: FS.com
model: FHD-1UBE
aliases:
  - {name: FHD-FPP5DRL, kind: vendor, note: 'the part number FS prints in this datasheet header'}
description: >-
  1U 19in blank fiber enclosure. FS SKU 72910 - a punched patch plate for four FHD
  adapter panels, a front lacer panel with five detachable D-rings and a rear lacer
  bar, no enclosure around them; up to 144 fibres (LC).
profile: optical
provenance:
  method:
    confidence: drawing
    note: >-
      from fhd-1ube-fiber-enclosure-datasheet.pdf: p3 front view, p4 top view, p2 spec
      table. The patch plate is the fixed-plate family's stamping, as on the modular frame.
  model:
    confidence: datasheet
    note: >-
      FS's product page calls 72910 the FHD 1U rack mount blank enclosure; the datasheet
      title reads FHD-1UBE and its header FHD-FPP5DRL. `model` takes the title; the header
      is an alias.
  chassis:
    confidence: drawing
    note: >-
      spec table: 1.73 x 19.00 x 8.93in (44 x 482.6 x 227). The top view gives 17.64in [448]
      across the patch plate, 4.29in [107] in front of it to the D-rings and 4.64in [120]
      behind it to the lacer bar - 227 overall, the depth taken.
  cutouts:
    confidence: drawing
    note: >-
      the fixed-plate family's four 90.0 x 36.0 openings on the 110.0 pitch
      (fs/fhd-1ufmt-s@1), less 17.3 into this 448 face; p3 prints 3.54in [90].
  bays:
    confidence: drawing
    note: >-
      THE MODULES MOUNT ON THE FRONT PLATE, NOT INSIDE IT. The front view punches four
      openings 3.54in [90] across and 1.42in [36] tall; a module's 108.97 plate covers its
      opening, its thumb-knobs landing in the pair of holes either side (3.91in, 99.4 apart
      on the panel drawings), and only the adapter block behind passes through. So each bay
      is the module plate's 108.97 x 35.05, centred on its opening, and `opening` is the
      hole an empty slot shows. Adjacent plates stand about 1.0 apart. every FHD cassette
      and adapter panel this library models is in every bay's `accepts`. FS states it on
      this datasheet's features list ('Compatible with all FHD cassettes and panels') and
      prints the same loading list with every one of them as fs/fhd-1ufce does; the module
      face is one 4.29 x 1.38in (108.97 x 35.05) envelope.
  d-rings:
    confidence: drawing
    note: >-
      the five D-rings and the lacer panel stand 107 in front of the plate; they are cable
      management, which the modelling guide does not draw. Noted, not placed.
  ears:
    confidence: drawing
    note: >-
      drawn as common/rack-ear@1 outside the body under `ears`.
  rear-opening:
    confidence: drawing
    note: >-
      THE BACK IS OPEN: the assembly illustration (p3) shows a patch plate, a front lacer
      panel and a rear lacer bar and no enclosure, so a module's back is seen from behind.
      One hole per front slot in the rear view, mirrored, running the 227 less a 1.0 plate,
      with the backs projected into them where each module's own body stands, as
      fs/fhd-1ufce's are; the real opening is the whole back.
  envelope-faces:
    confidence: drawing
    note: >-
      top, bottom, left and right are the envelope; the lacer bar and D-rings are not drawn.
chassis:
  width: 448.0
  height: 44.0
  depth: 227.0
  ru: 1
  color: '#1b1e21'
  airflow: passive
gaps:
  - what: face-detail
    scope: [front, rear, top, bottom, left, right]
    reason: needs-photo
    note: >-
      no photograph of 72910 is held - its product page answered FS's human-verification
      check on 2026-09-25 and was not pursued - so colour, finish and anything the drawing
      does not dimension are the siblings'.
    wanted: >-
      FS's gallery for 72910, fetched by a person with a browser.
