format: 1
kind: device
name: cmh-sfds1u
version: 0.1.1
maturity: modelled
manufacturer: FS.com
model: CMH-SFDS1U
aliases:
  - {name: '220085', kind: vendor}
description: >-
  1U single-sided steel horizontal cable manager, FS SKU #220085: a black SPCC backbone
  between the rack ears carries ten moulded T-shaped fingers along its top edge and ten
  along its bottom, and a steel cover hangs on four hinge clips over the finger heads to
  close the channel between the rows. The cover is 51 mm high, taller than the 43.6 mm ears.
  Three long pass-through holes in the backbone lead cables to the other side.
profile: passive
provenance:
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the backbone is the mounting plane and the duct stands 113.3 mm
      in front of it (the side view of the datasheet), so the rear face of its rack unit
      stays free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. The FS Horizontal Cable Managers with Finger Duct
      datasheet (steel, portal id 6867) carries a technical drawing of CMH-SFDS1U: the back,
      a plan, an end view and the front, with dimensions in millimetres. The embedded image
      (1228 x 770) is 1.567 px/mm across the 483 and the 440, 1.566 down the 106 and 1.571
      down the 113.3: it is orthographic and carries geometry to about a millimetre. The
      renders of #220085 on the FS product page are the second reading, one of them a
      straight-on view of the back.
  chassis:
    confidence: drawing
    note: >-
      drawing - THE BODY BETWEEN THE EARS. The drawing gives 483.00 over the ears and 440.00
      for the cover; the backbone runs flat into the ears, 21.5 mm each, which are not
      drawn. Height 51.00 is the cover, dimensioned on the front view, and the end view
      measures 51.7 across the cover; the ears are 43.60 and the backbone 44, centred. The
      FS product page height of 44.45 is the rack unit, not the part. Depth 113.3 is the end
      view overall, cover included, and the spec table states 113.3 and 106; 106 is the
      backbone to the finger tips on the plan.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW DUCT. The body is a sheet body and its six views are elevations.
      The solid is what its parts build: the backbone on the front view as a well 111.3 deep
      whose floor is the backbone and is open at the three pass-through holes; the two rows
      of fingers standing in it; and the cover across the finger heads, which comes off and
      opens the channel. The rear view builds the back of the backbone as sunk plates round
      the holes. The channel and its two ends are open air.
  thickness:
    confidence: estimated
    note: >-
      estimated - no FS document states the gauge of the SPCC backbone or cover. 1.2 is
      taken, the gauge of the other FS steel managers in the library; the plan draws the
      backbone edge two pixels thick, 1.3 mm.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 1.04 kg, the FS product page specification for #220085, as read at intake;
      the datasheet states no weight.
  front:
    confidence: drawing
    note: >-
      drawing - the cover, fitted, as the front view of the drawing draws it: 440 x 51 with
      four hinge clips, two on the top edge and two on the bottom, staggered. The fingers
      stand in two rows 9.0 thick, 4.7 in from the top and bottom of the cover, read off the
      end view, which draws the two finger walls 14 px thick with their outer faces 66 px
      apart. The `duct` guide is the 23.6 mm between the rows.
  fingers:
    confidence: drawing
    note: >-
      drawing - ten fingers a row. The plan draws their stems 69.6 px apart, 44.4 mm, and
      five two-finger mouldings 443.5 over all; ten at 44.4 would run past the 440 cover, so
      the pitch is taken as 44.0 and the row fills the body between the ears, 0.4 mm a pitch
      short of the drawing. A finger is a stem 10.2 wide and a T head 39.4 wide, leaving a
      4.6 neck between heads. On the plan the stem forks into two legs that meet the moulded
      block 28 mm from the back; the fork is drawn as the stem running straight to the
      block. The square windows in the blocks are not drawn.
  top:
    confidence: drawing
    note: >-
      drawing - the plan, rear at y=0: the backbone, the moulded blocks to 28, the stems,
      the heads from 96.4 and the cover edge at the front. Open air between the fingers is
      drawn dark.
  bottom:
    confidence: drawing
    note: >-
      drawing - the bottom row of fingers is the top row again; the front view draws the
      clips staggered but the fingers in line.
  left:
    confidence: drawing
    note: >-
      drawing - the end view: the backbone, the two finger rows 9 thick with 23.6 between
      them, and the cover across the heads. The hinge knuckles on the heads are drawn as the
      heads. The duct is open at both ends.
  rear:
    confidence: drawing
    note: >-
      drawing - the back of the backbone from the back view of the drawing: three obround
      pass-through holes 216 px long, 137.8 mm, and 28 px high, 17.9, 19 px apart, running
      1.3 mm short of each end of the body, centred on the backbone. The straight -on render
      of the back (gallery image 4) confirms three holes and the fingers seen through them.
      The sunk plates round the holes are rectangles; the holes in the floor in front of
      them keep their round ends.
  guides:
    confidence: drawing
    note: >-
      drawing - the duct on the front view is the channel between the finger rows, run
      across the rack; finger pitch 44.0 and the 33.8 between stems, from the plan.
  capacity:
    confidence: estimated
    note: >-
      not stated - no capacity is carried: the steel finger duct datasheet has no capacity
      table and the cable managers portfolio gives dimensions only, so the figure is the
      `cable-capacity` gap below, not a datasheet fact.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - style, sides, backbone and cover material, colour and the detachable cover
      are the specification table of the FS Horizontal Cable Managers with Finger Duct
      datasheet (steel, portal id 6867), which also says the part is made of SPCC and
      plastic; RoHS and ISO 9001 are its Standards Compliance list. The four screws and cage
      nuts are step 1 of the FS Horizontal Cable Managers quick start guide V1.0 for
      CMH-SFDS1U and CMH-DFDS2U.
  color:
    confidence: estimated
    note: >-
      estimated - Color: Black. Every image FS publishes of the part is a render; the cover
      reads a median of 39 on each channel on gallery image 1 and the back of the backbone
      27 on gallery image 4.
