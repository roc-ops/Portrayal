format: 1
kind: device
name: fs-cfs-1u
version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: FS-CFS-1U
aliases:
- {name: '71024', kind: vendor, note: FS shop product ID}
description: >-
  1U 19in vented cantilever fixed shelf, FS FS-CFS-1U: a black SGCC steel tray 443.2 mm wide and
  250.2 mm deep, its two side walls sloping from the full 44 mm at the front to the rear and folded
  out into ears that bolt to the front rails. Fifteen diagonal vent slots in the floor; it carries
  10 kg on 2- or 4-post racks.
profile: passive
provenance:
  chassis:
    confidence: datasheet
    note: >-
      the specification gives 44.0 x 483.0 x 250.2 mm over the ears, which is the part: the ears
      are built in (provenance.ears). The drawing's top view dimensions the tray between them
      17.45 in [443.2 mm].
  ears:
    confidence: drawing
    note: >-
      THE EARS ARE BUILT IN: each is the side wall's front end folded out flat, one piece with
      the tray and not removable (the datasheet's front view and the gallery render g1, SKU 71024),
      so under the owner's rule of 2026-10-09 they are part of the face and always drawn - 19.9
      each side, the face the full 483.0, with their slots.
  sheet:
    confidence: estimated
    note: >-
      `shell: sheet`, 1.2: the shelf is bent sheet steel and open air (docs/cable-managers-design.md
      section 4); FS states the material and not its gauge. Its solid in 3D is the floor (a well
      on the top view, 42 deep in the 44 envelope - the deepest a sheet body builds, so the floor
      is drawn 2 thick where the sheet is about 1.2), the two side walls standing on it to their
      profile, and any rear lip; the six views are elevations.
  hosting:
    confidence: datasheet
    note: >-
      the surface a device stands on is the floor between the two walls, 440.8 x 250.2 mm (the
      body less two 1.2 walls), recorded in `attrs.physical` as usable-width-mm and usable-depth-mm;
      the load is the datasheet's "Weight Capacity - Stationary" 10 kg. Hosting devices on it
      is #935's.
  mount-depth:
    confidence: datasheet
    note: >-
      cantilever: the shelf bolts to the FRONT rails only through its two ears (2 or 4 post racks)
      and nothing supports its rear; its depth is the tray's reach behind the front rails, not
      a rail-to-rail span.
  eia:
    confidence: registry
    note: >-
      EIA-310 hole positions: the rail holes of each rack unit stand 6.35, 22.225 and 38.1 mm
      up from its bottom, and the two rails' holes are 465.1 mm apart across the rack. The part
      is taken as centred in the rack units it fills.
  color:
    confidence: photo-measured
    note: >-
      black powder-coated steel, as every render shows.
  lifecycle:
    confidence: estimated
    note: >-
      searched 2026-10-09: no FS end-of-sale notice for this part was found in the intake's portal
      tree or by name. The product page (SKU 71024) was live on 2026-10-08.
  method:
    confidence: drawing
    note: >-
      the FS-CFS-1U datasheet (portal 1041; the shop-link revision has the same table and drawing)
      for the figures and the three-view drawing in inches and mm; the gallery renders of SKU
      71024 for colour and the slots' look; the quick start guide V1.0 (portal 444, vector, read
      from its 300 dpi page render) for the hardware and the note on what the shelf may carry.
      FS publishes a Visio stencil (master FS-CFS-1U), which agrees.
  qsg-note:
    confidence: datasheet
    note: >-
      the quick start guide's note: a device on the shelf should weigh under 10 kg and be under
      10 in deep, and its own mounting ears need not be fixed to the rack. The product page adds
      that it holds only devices narrower than 440 mm.
