format: 1
kind: device
name: cmh-5dr1u
version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: CMH-5DR1U
aliases:
  - {name: '120680', kind: vendor}
description: >-
  1U horizontal cable manager, FS SKU #120680: a flat black steel panel on the rack
  rails with five detachable polycarbonate D-rings that twist into round seats in it and
  stand 85.5 mm out. Each ring is a long braced loop whose front end curls back under
  itself, and a cable is laid in through the slit the curl leaves.
profile: passive
provenance:
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the rings stand 85.5 mm in front of the panel and the
      panel's folded edges reach only 12.2 behind it (the vendor's side view), so the
      rear face of its rack unit stays free for another part (#854).
  method:
    confidence: drawing
    note: >-
      FIGURES FIRST, FROM THE VENDOR'S OWN DIMENSIONED DRAWINGS. Two FS datasheets draw
      the part. The Horizontal Cable Managers with D-rings datasheet has a side view and
      a front view dimensioned in inches with millimetres in brackets: the front view is
      2.161 px/mm across from the 482.6 line (1043 px) and 2.205 down from the 44 (97
      px), a 2 % difference between the axes, and its 430, 90 and 35.1 lines agree with
      the across scale to under a millimetre. FS's 0U/1U Horizontal Cable Manager
      datasheet draws the same part with 482.4, 465, 31.5 and 97.4; the 0.3 mm between
      the two is drawing, not part, and the D-rings datasheet's figures are taken.
  chassis:
    confidence: drawing
    note: >-
      drawing - 430 x 44 x 97.7. The plate is flat over the whole 19 in [482.6mm] and its
      top and bottom edges fold back over 16.93 in [430mm], 1.04 in [26.3mm] in from each
      end; the flat ends outside the folds are the ears, which this library does not
      draw, so the body is the 430. Both datasheets' tables give the depth as 3.37 in
      (85.5 mm): the D-rings datasheet's side view shows that this is the ring from the
      face of the plate, and dimensions 3.85 in [97.7mm] from the back of the folded
      edges to the front of the ring, which is the envelope.
  thickness:
    confidence: estimated
    note: >-
      estimated - 1.2 mm, the sheet FS dimensions on the CMH-4DRB1U drawing of the
      D-rings datasheet. No view of this part dimensions its sheet.
  weight:
    confidence: datasheet
    note: datasheet - "Weight 1.01lbs (0.46kg)" in the 0U/1U datasheet's table.
  front:
    confidence: drawing
    note: >-
      drawing - the front view of the D-rings datasheet: the plate between the folds and
      the five rings on their seats. Rings centred 35 mm from the left fold and 90 apart:
      the drawing dimensions 1.04 in [26.3mm] plus 1.38 in [35.1mm] to the first ring's
      centre and 3.54 in [90mm] between centres, and the five read 90.0 mm apart,
      symmetric about the middle. The ring's contract has the rest. FS's mark, printed
      on the plate just inside the left fold, is not drawn: a vendor mark never is.
  rear:
    confidence: photo-measured
    note: >-
      photo-measured - the back of the plate, plain, as FS's render of the back (gallery
      image 2) shows it: the ring seats' backs and the folded edges and nothing else.
      The seats' backs are not drawn.
  top:
    confidence: drawing
    note: >-
      drawing - an elevation: the folded edge behind the plate, and the five rings' top
      members from above. The bottom is the same from underneath, where each ring's
      bottom member stops short of its curled foot.
  left:
    confidence: drawing
    note: >-
      drawing - an elevation, the D-rings datasheet's side view: the folded edges behind
      the plate and the ring's profile in front of it, without its bracing. The right is
      the same, turned round.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the weight, the ring material, the mounting hardware and "Indoor" are
      the 0U/1U datasheet's table; "Steel, Powder-coated Black" for the panel is the
      D-rings datasheet's.
  cable-capacity:
    confidence: datasheet
    note: >-
      datasheet - "Cable Capacity (Theoretical Value) 55pcs (Cat6 24AWG)" in the 0U/1U
      datasheet's table, and 55 Cat6 24AWG 6.1 mm cables at 100 % fill, 17 at the
      recommended 30 %, in the D-rings datasheet's Cable Capacity Reference Guide. Stated
      once, here, and not divided among the rings.
  color:
    confidence: estimated
    note: >-
      estimated - "Steel, Powder-coated Black" and "Color: Black". Every image FS
      publishes of the part is a render.
attrs:
  physical:
    weight-kg: 0.46
    material: Steel, Powder-coated Black
    ring-material: PC, UL 94V-2
    mounting-hardware: M6*15mm Screw x4 and M6 Nut x4
  performance:
    cable-capacity: 55
    cable-capacity-basis: >-
      Cat6 24AWG (6.1 mm) cables at 100 % fill, theoretical; 17 at the recommended 30 %
      - FS 0U/1U Horizontal Cable Manager datasheet table, and the Cable Capacity
      Reference Guide of the Horizontal Cable Managers with D-rings datasheet
  compliance:
    environment: Indoor
