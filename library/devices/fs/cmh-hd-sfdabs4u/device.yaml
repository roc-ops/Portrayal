gaps:
  - what: weight
    scope: [base]
    reason: vendor-silent
    note: >-
      the FS CMH-HD-SFDABS4U datasheet, the only document FS publishes for the part, states no
      weight, and the part has no product page.
    wanted: the weight from FS, or the part on a scale
  - what: cover-hinge
    scope: [cover]
    reason: vendor-silent
    note: >-
      the datasheet calls the cover dual hinged, opening upward or downward; the side view
      draws a knuckle over each finger wall, and the cover is drawn as one fitted plate with
      a rail along each.
    wanted: a drawing or a photograph of the hinge
