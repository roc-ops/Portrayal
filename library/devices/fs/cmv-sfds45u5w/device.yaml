model: CMV-SFDS45U5W
aliases:
  - {name: '220089', kind: vendor}
description: >-
  45U single-sided vertical cable manager, FS SKU #220089: a black SPCC steel finger duct,
  2000.25 mm (45 rack units) tall in two sections, that stands beside a 45U open-frame
  rack on quick-release brackets bolted to the side of the upright. A steel back plate
  with seven openings carries a row of 44 moulded T-shaped fingers down each edge at one
  rack unit apart, and two detachable steel covers clip over their heads to close a
  channel 141.52 mm wide that runs the height of the rack. It takes no rack unit.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. The FS Vertical Cable Managers with Finger
      Ducts datasheet for the steel managers (portal id 6868) draws CMV-SFDS45U5W on
      page 3 four ways in millimetres - a side view, a cover view, a back view and an
      end view - laid on its side in one embedded raster (1397 x 626). Measured at
      native size: the side view is 849.5 px along the dimensioned 2000.25 (0.4247
      px/mm) and 64.5 px across the dimensioned 152.63 (0.4226), and the cover view 72
      px across the dimensioned 169 (0.426), so the views are orthographic and carry
      geometry to about 2.4 mm, one pixel. The steel quick start guide is a reference
      (steps 1, 3 and 4), and the product renders of #220089 are the second reading
      (gallery image 1 straight-ish, 2 the side lying down, 3 and 4 close-ups).
  mount:
    confidence: drawing
    note: >-
      drawing - `rack-side`. The steel quick start guide step 3 bolts quick-release
      brackets to the side of the upright of a two-post rack with screws and cage
      nuts, eight a side, and the duct stands beside the rack, outside the rails, its
      fingers facing forward; step 1 draws the brackets on the side of the duct. The
      datasheet says it matches a 45U open rack, and the FS compatibility matrix fits
      it to none of the FS cabinets. It occupies no rack unit; `ru: 45` is the height
      it runs beside. Which side of the rack is a lab placement decision
      (docs/vertical-cable-managers-design.md).
  chassis:
    confidence: drawing
    note: >-
      drawing - THE DUCT AS IT STANDS, covers fitted: `width` across the face of the
      rack, `height` the height it runs, `depth` front to back. 169 wide is the cover,
      dimensioned 169 on the cover view of both drawings; the back view measures the
      same 72 px at the 0.4247 px/mm of the 2000.25, and the end view draws the cover
      line across the same 72 px, over finger rows 160 apart outside. The
      specification table, the portfolio and the page title give 141.52 (5.5 in) wide:
      the end view of the dual dimensions 141.52 between the inner faces of the two
      rows, so that figure is the channel, not the part, and the single end view
      dimensions 145.76 across the same rows. The two renders read 159 and 164 for the
      cover once the turn of the camera is solved, at about five per cent; the
      dimensioned 169 is taken. 2000.25 high is the drawing (45 x 44.45); the table
      rounds it to 2000.
  depth:
    confidence: drawing
    note: >-
      drawing - 152.63 is the side and end views, from the back of the back plate to
      the front of the cover clips; the table rounds it to 152.6 (6.0 in).
  cover:
    confidence: drawing
    note: >-
      drawing - THE PART HAS A COVER, two of them. The product page gives the style as
      Finger Duct with no cover; the datasheet table (Finger Duct with Cover,
      Detachable Cover: Yes, Cover Material: Steel/SPCC), the cable managers
      portfolio, the cover view of the drawing, the renders (gallery images 1, 2 and
      4, one cover lifted on 4) and the quick start guide step 4 (open, remove, close)
      all show one, so the page is wrong and the covers are drawn.
  sections:
    confidence: drawing
    note: >-
      drawing - two sections. The cover view dimensions an upper cover 976.45 and a
      lower one 1021.4, the upper taken as the top as the datasheet page stands;
      together they leave 2.4 of the 2000.25, put at the joint between them. The back
      view draws the joint of the back plate at 977.2, across the middle window.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW DUCT, NOT A BOX, as every FS finger duct in the library is
      (docs/cable-managers-design.md section 4). The body is a sheet body and its six
      views are elevations; the solid is what its parts build: the back plate as a
      well 151.43 deep, its floor open at its seven openings; two steel returns and 88
      fingers standing in it; and the two covers, which pull off and open the channel.
      The back of the plate is built as plates sunk 0.05 inside the rear face, round
      the openings.
  thickness:
    confidence: estimated
    note: >-
      estimated - no FS document states the gauge of the SPCC; 1.2 is taken, as for
      the FS horizontal steel managers in the library.
  front:
    confidence: drawing
    note: >-
      drawing - the covers, fitted. With them off the front is the channel between the
      two finger rows, the heads of the fingers end-on along each edge and the back
      plate with its openings behind. The rows are 9.0 thick, their inner faces 141.52
      apart (the end view), so they stand 4.74 in from each edge of the 169. 44
      fingers a row stand 44.45 apart, one rack unit (18.88 px on the side view); the
      first centre is 65.9 below the top and the last 22.4 above the bottom, so the
      top rack unit carries no finger, as the side view draws it, and the other 44
      carry one each.
  fingers-shape:
    confidence: drawing
    note: >-
      drawing - the side view draws each finger as a stem with a forked root on a
      block and a T-shaped head, the same moulding as the FS horizontal steel ducts;
      the stems measure about 10.6 and the heads about 40, and the figures of those
      ducts (10.2 and 39.4) are taken. The fork is drawn as the stem. The small slots
      along both long edges of the back view, where the blocks are fixed, are not
      drawn.
  rear:
    confidence: drawing
    note: >-
      drawing - the back view at 0.4247 px/mm: the back plate 169 wide with seven
      openings on its centre line, each a declared pass-through, open, through into
      the channel: a 68.2 by 60 opening at the top end, five windows 150.7 long and 60
      wide (60 dimensioned on the bottom one) starting 257.8, 568.6, 879.4, 1190.2 and
      1501.0 from the top, and the dimensioned 150 opening at the bottom end. Six
      pairs of keyholes (R11 head, R6.78 slot below it) stand 311 apart, the slots
      ending 215.4 below the top and on, 56 apart across (dimensioned), the outer pair
      1555 apart (dimensioned); six square holes about 28 stand between them. Keyholes
      and squares are painted; the joint is a seam.
  top:
    confidence: drawing
    note: >-
      drawing - the end of the duct seen from above, rear at y=0, from the side view
      depths: the back plate to 1.2, the steel return to 38.9, the finger block to
      63.6, the stem to 142.5, the head to 149.63 and the cover sheet to 150.83, the
      clips to 152.63. The end view draws the rows where they are taken.
  bottom:
    confidence: drawing
    note: >-
      drawing - the bottom end is the top end again: the end view is the same at both
      ends.
  left:
    confidence: drawing
    note: >-
      drawing - the side view of the datasheet, rear at x=0: the back plate, the steel
      return, 44 blocks, stems and heads, the six clips and the edges of the two
      covers, with the joint of the return a seam. The quick-release bracket plates
      the side view draws are not drawn (see the bracket gap).
  right:
    confidence: drawing
    note: >-
      drawing - the left view mirrored: the duct is the same on both sides.
  guides:
    confidence: drawing
    note: >-
      drawing - the duct on the front view is the channel between the two finger rows,
      141.52 wide, run down the height (`run: y`); its finger pitch is the 44.45 of
      the side view and its gap the 34.25 between stems.
  capacity:
    confidence: estimated
    note: >-
      not stated - no capacity is carried: neither the steel datasheet nor the steel
      quick start guide nor the cable managers portfolio gives a cable capacity for
      CMV-SFDS45U5W, so the figure is the `cable-capacity` gap below, not a datasheet
      fact.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 9.6 kg, the FS product page specification for #220089 as read at
      intake; the datasheet states no weight.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - style, sides, backbone and cover material (Steel/SPCC), colour, the
      detachable cover, the 45U open rack it matches and RoHS and ISO 9001 are the
      specification table and Standards Compliance list of the datasheet; the fixings
      are the product page list. The features list of the same datasheet says the part
      is made of ABS, copied from the plastic datasheet; the table says steel, and the
      renders show plastic fingers on a steel body, so the fingers are given as
      plastic and the body as steel.
  color:
    confidence: estimated
    note: >-
      estimated - Color: Black. Every image FS publishes of the part is a render; it
      is drawn in the shades the FS horizontal steel ducts read off theirs.
