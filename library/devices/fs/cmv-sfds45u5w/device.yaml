gaps:
  - what: cable-capacity
    scope: [base]
    reason: vendor-silent
    note: >-
      no FS document held states a cable capacity for CMV-SFDS45U5W: the steel
      datasheet has no capacity table (the plastic one has), and the portfolio and the
      guide give none.
    wanted: a capacity row on the product page or in a later datasheet
  - what: bracket-stand-off
    scope: [rear, left, right]
    reason: vendor-silent
    note: >-
      the four quick-release bracket plates bolt to the side of the duct and hook onto
      L-brackets on the upright; the side view draws them straddling the rear face,
      about 18 in front of it and 23 behind, and the guide draws them fitted on
      whichever side meets the upright (step 1 the left, step 3 the right). How far
      the duct then stands from the upright is drawn but never dimensioned. The duct
      is drawn without the brackets, which ship loose.
    wanted: a dimensioned drawing of the brackets fitted to an AR201 upright
  - what: top-end
    scope: [front, rear, left, right]
    reason: vendor-silent
    note: >-
      the drawing leaves one rack unit without a finger at one end and puts the 976.45
      cover there; it is taken as the top because that is how the datasheet page
      stands, and no view says which end is up.
    wanted: a photograph of an installed duct with its top end in view
