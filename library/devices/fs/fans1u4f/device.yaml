format: 1
kind: device
name: fans1u4f
version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: FANS1U4F
description: >-
  1U 19in rack fan tray, FS FANS1U4F: a black aluminium box 330 mm deep with 4 120 mm fans that
  blow down through the rack, a temperature controller with a two-digit display, LOAD and SET
  lamps and four keys on the front, a power switch, and a fixed mains cord out of the back; 110-120
  V, 15 W, 320 CFM. Mounting ears bolt to each end.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      the FS Cooling Fan datasheet (portal 6624) for the figures; the FANS1U2F/FANS1U4F Quick
      Start Guide V2.0 (portal 6672) for the face - its labelled front view (fig-0011, the 2F
      drawn) and its overview of both trays (fig-0003) - and the controller's user manual (portal
      6761). FS has no product page for FANS1U4F and no render or photograph of it; the guide's
      line drawings are the only images. The FANS1U4F is portal-only and probably discontinued.
  chassis:
    confidence: drawing
    note: >-
      44 x 330: the datasheet's "483x330x44 mm" read as width over the ears, depth and height
      (its HxWxD heading is scrambled). THE EARS ARE SEPARATE BRACKETS: the guide's front view
      draws an L bracket with three oblong holes bolted to each end of a narrower box, so the
      body between them is modelled and the ears are optional (`chassis.ears`, drawn by the generic
      ear). On fig-0011 the tray spans 627 px over its ears for the 483 (1.298 px/mm) and the
      ears' inner fold lines stand 38.5 px from each end, 29.6 mm, which leaves a body of 424
      (the figure's 58 px height reads 44.7 at that scale, so it is orthographic to 1.5 per cent).
  ears:
    confidence: drawing
    note: >-
      two L brackets with three oblong holes each, 29.6 mm wide outside the body (fig-0011); the
      datasheet's 483 is over them. Not drawn by default; the generic ear (#909) draws them on
      request.
  controller:
    confidence: drawing
    note: >-
      fs/fan-temp-controller@1 at 173.4 in and 5.0 down: fig-0011's bezel spans 267.5 to 368.75
      px and 10.5 to 55.5 px, measured from the body's left fold at 42.5 px and its top edge at
      4 px.
  switch:
    confidence: drawing
    note: >-
      the power switch in its square bezel, 383.3 to 409.9 in and 6.2 to 37.8 down (fig-0011),
      the rocker inside it drawn as common/rocker-switch@1 turned upright; the guide calls it
      the Power Switch. The rocker's 15 x 21 is the library part's, a little smaller than the
      guide's 19.3 square window.
  fans:
    confidence: estimated
    note: >-
      4 fans of 120 mm, blowing down ("Pre-installed Fans Push Hot Air Down through Rack"): fig-0003
      draws the 2F's two on the lid, at about a quarter and three quarters of the width. They
      are drawn there, in two rows, and on the base below them; no figure dimensions them, and
      the base is not drawn anywhere.
  rear:
    confidence: estimated
    note: >-
      the datasheet and guide put the power cord and the controller's ambient sensor lead at the
      back; no figure shows the back, so both are placed at the switch end, estimated.
  airflow:
    confidence: datasheet
    note: >-
      the fans push air DOWN through the rack (datasheet benefits); `chassis.airflow` has no value
      for a downward flow, so none is stated (see gaps).
  attrs:
    confidence: datasheet
    note: >-
      the FS Cooling Fan datasheet (portal 6624), one table for FANS1U2F, FANS1U4F and FANP3U3F,
      and the FANP3U3F product page. The datasheet prints every model's dimensions as "HxWxD 483x170x44"
      and the like, its axes scrambled. The 15 W is "Input Power 15W" with no qualifier, filed
      as the maximum.
  sides:
    confidence: estimated
    note: >-
      plain painted aluminium; no figure shows a side.
  color:
    confidence: estimated
    note: >-
      "Die-Cast Aluminum Painted"; drawn black as the FANP3U3F, the one fan part FS photographs.
  lifecycle:
    confidence: estimated
    note: >-
      checked 2026-10-09 against what the intake holds: the FS documentation portal's Accessories
      tree, read on 2026-10-08, carries no end-of-sale notice for this part. FS publishes no product
      page for it; fs.com search finds nothing. No web search beyond FS's own pages was made.
