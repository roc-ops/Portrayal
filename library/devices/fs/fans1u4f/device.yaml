gaps:
- what: airflow
  reason: vendor-silent
  note: >-
    the fans blow down through the rack, and `chassis.airflow` offers front-to-back, back-to-front,
    side and passive; no value is stated.
  wanted: a downward value in the airflow vocabulary
- what: face-detail
  reason: needs-photo
  note: >-
    FS has no product page or render for FANS1U4F; the face is the quick start guide's line drawing,
    and the top, bottom, rear and sides are not drawn anywhere.
  wanted: a photograph of the tray
- what: rear-mounting
  reason: vendor-silent
  note: >-
    the screw kit has eight M6 screws to the 2F's four, which suggests rear brackets for the 330
    mm tray; no figure shows them.
  wanted: the 4F installation figure
