format: 1
kind: device
name: fhd-1ume
version: 1.0.1
maturity: modelled
manufacturer: FS.com
model: FHD-1UME
aliases:
  - {name: FHD-1U-CMP400, kind: vendor, note: 'the part number FS prints in this datasheet header and in the 1UFCE loading list'}
description: >-
  1U 19in modular fiber enclosure. FS SKU 70419 - an open steel frame: a punched
  front plate for four FHD adapter panels or cassettes and a rear cable manager
  behind it, no cover; up to 144 fibres (LC), and the only one of the family FS
  pairs with its multimedia modular panel.
profile: optical
provenance:
  method:
    confidence: drawing
    note: >-
      from the datasheet fhd-1ume-fiber-enclosure-datasheet.pdf: p3 front view (vector), p4
      top view, p2 spec table. The front plate is the same stamping as the fixed and tilt-
      down 1Us - four 3.54in [90] openings on a 110 pitch, read off p3 at about 2.9 px/mm
      and agreeing with the tilt-down's 2400 dpi measurement to 0.5.
  model:
    confidence: datasheet
    note: >-
      the product page and the enclosure selector call 70419 the FHD 1U modular enclosure;
      the datasheet's header prints FHD-1U-CMP400 and its title FHD-1UME. The cabling guide
      lists FHD-1UME. `model` takes the datasheet title and the header name is an alias.
  chassis:
    confidence: drawing
    note: >-
      spec table: 1.73 x 19.00 x 7.67in (44 x 482.6 x 194.8). The top view dimensions the
      frame 17.45in [443.2] across and 7.67in [194.8] deep.
  cutouts:
    confidence: drawing
    note: >-
      the fixed-plate family's four 90.0 x 36.0 openings on the 110.0 pitch centred on the
      482.6 plate (see fs/fhd-1ufmt-s@1's provenance.cutouts), less 19.7 into this 443.2
      face.
  bays:
    confidence: drawing
    note: >-
      THE MODULES MOUNT ON THE FRONT PLATE, NOT INSIDE IT. The front view punches four
      openings 3.54in [90] across and 1.42in [36] tall; a module's 108.97 plate covers its
      opening, its thumb-knobs landing in the pair of holes either side (3.91in, 99.4 apart
      on the panel drawings), and only the adapter block behind passes through. So each bay
      is the module plate's 108.97 x 35.05, centred on its opening, and `opening` is the
      hole an empty slot shows. Adjacent plates stand about 1.0 apart. every FHD cassette
      and adapter panel this library models is in every bay's `accepts`. FS states it on
      this datasheet's features list ('Compatible with all FHD cassettes and panels') and
      prints the same loading list with every one of them as fs/fhd-1ufce does; the module
      face is one 4.29 x 1.38in (108.97 x 35.05) envelope.
  ears:
    confidence: drawing
    note: >-
      drawn as common/rack-ear@1 outside the body under `ears`.
  rear-opening:
    confidence: drawing
    note: >-
      THE BACK IS OPEN: the datasheet's assembly illustration (p3) and FS's renders
      (70419.p2-p5) show a punched front plate and a slotted rear cable manager with nothing
      between them, so a module's back is seen from behind. The rear view carries one hole
      per front slot, the bay's own size, mirrored because it is seen from behind, running
      the frame's 194.8 less a 1.0 plate; the modules' backs are projected into them where
      each module's own body stands, as fs/fhd-1ufce's are. The real opening is the whole
      back, not four holes - the holes are where a back is seen.
  envelope-faces:
    confidence: drawing
    note: >-
      top, bottom, left and right are the envelope. The frame is OPEN - no cover, a rear
      cable manager with slots - which the envelope does not show; see `gaps`.
chassis:
  width: 443.2
  height: 44.0
  depth: 194.8
  ru: 1
  color: '#1b1e21'
  airflow: passive
gaps:
  - what: open-frame-detail
    scope: [rear, top, bottom, left, right]
    reason: needs-photo
    note: >-
      the frame has no cover and its rear cable manager is slotted steel, so from above and
      behind the modules' backs are seen; this model draws closed envelope faces. The top
      view (p4) dimensions the outline and draws the slots, undimensioned.
    wanted: >-
      a square-on photograph from above and from behind, or dimensions for the cable
      manager's slots.
groups:
  furniture:
    term: Item
    role: furniture
    index-origin: 1
  slots:
    term: Slot
    role: service
    index-origin: 1
    description: >-
      four slots, each taking one FHD module - an adapter panel or an MTP/MPO cassette -
      numbered left to right. The datasheet's capacity row reads 4 ports, 144 fibres (LC).
