configurations:
  base:
    kind: base
    default: true
    description: >-
      The frame as FS ships 70419, empty. Panels and cassettes are separate SKUs.
  multimedia:
    kind: example
    description: >-
      LC and MTP adapter panels either side of two multimedia modular panels - the fibre-
      and-copper use the datasheet names for this frame. Illustrative; every module is a
      separate SKU.
    bays:
      bay-1: fs/fhd-fap12lcd-os2@1
      bay-2: fs/fhd-fapm6@1
      bay-3: fs/fhd-fapm6@1
      bay-4: fs/fhd-fap12mtp-a@1
