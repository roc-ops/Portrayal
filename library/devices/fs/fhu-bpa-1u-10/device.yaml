description: >-
  1U 19in tool-less ABS blanking panel, FS FHU-BPA-1U-10: one black moulded plate 44 x 482 mm
  with a raised panel across its face and a channel 22 mm deep behind it, held to the rails by
  pegs and magnets at each end (FS's "self-attaching, magnetic design"). Sold ten to a pack.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      the FS Blanking Panel Datasheet (portal 2125), FHU-BPA-1U-10 column, and the product page
      for the size, material and weight; the face from the FS Blanking Panel Visio stencil, master
      FHU-BPA-1U-10, checked against the straight-on gallery render of SKU 133347 (g3); the depth
      and the back from the dimensioned render (x8), the close-up (x9) and the quick start guide
      (QSG V1.0, portal 422).
  chassis:
    confidence: datasheet
    note: >-
      the plate is the part: "1.73 x 19.00 in (44 x 482 mm)", one moulded ABS plate the width
      of the rack, its ends carrying the pegs and magnets that hold it, so the face is drawn at
      482 (the owner's rule of 2026-10-09; lint L43 stands down for a body this wide).
  depth:
    confidence: drawing
    note: >-
      22: FS's dimensioned render (x8) prints 22 mm for the moulding's depth and 482 and 44 for
      its length and height. The 3D body is that box across the full width; the real ends are
      only the plate.
  walls:
    confidence: photo-measured
    note: >-
      the moulding's top and bottom walls run 20.9 to 461.1: the straight-on render (g3) at 2.97
      px/mm puts their ends 20.9 in from each end of the plate. Their 2 mm thickness, and the
      plate's, are estimated.
  face:
    confidence: drawing
    note: >-
      the moulded panel on the face - wide at the ends, narrowing over the middle third - is the
      stencil's outline (16.0 to 466.3 across; 8.4 to 37.7 high at the ends, 14.2 to 32.3 over
      the middle), drawn as three fields without the slanted transitions; the render (g3) shows
      the same shape in relief.
  fixing:
    confidence: drawing
    note: >-
      the quick start guide draws two pegs at each end of the back entering the rail's square
      holes from the front, on the unit's top and bottom holes (EIA-310); the close-up (x9) shows
      a round metal disc at each end, which is the "Magnetic Design" of the product page title.
      The datasheet calls the part tool-less and says nothing of magnets. The pegs are drawn 5
      mm and the magnets 10 mm across, both estimated, the magnets centred on the end of the plate's
      back.
  eia:
    confidence: registry
    note: >-
      EIA-310 hole positions: the rail holes of each rack unit stand 6.35, 22.225 and 38.1 mm
      up from its bottom, and the two rails' holes are 465.1 mm apart across the rack. The plate
      is taken as centred in the rack units it fills, so a hole's height on the plate is its height
      in the units less half the difference between the units and the plate.
  mark:
    confidence: photo-measured
    note: >-
      FS's mark is moulded into the left of the panel; it is a logo and is not drawn. Its place is
      reserved as the region `logo-zone`. The mark is tone on tone, so it is read by eye on a
      contrast-stretched crop of the straight-on gallery render of SKU 133347 (g3) under a
      millimetre grid at 2.975 px/mm, not segmented: x 27.5 to 40.5 and y 11.0 to 17.5, good to
      about a millimetre. The left moulded panel is the check: the same grid puts its corner at x 16
      and y 9.5, against the 16.0 and 8.5 this file draws, and the reading down is shifted by that
      millimetre.
  color:
    confidence: photo-measured
    note: >-
      black textured ABS ("Fine Texture Design"), slightly lighter on the moulded panel in the
      render.
  weight:
    confidence: datasheet
    note: >-
      the datasheet and product page: 1.108 kg for the pack of ten, so 0.111 a panel (derived).
  sides:
    confidence: estimated
    note: >-
      the plate's end edge-on, the moulding's walls and the open channel between them, as the
      render x8 shows the end.
  lifecycle:
    confidence: estimated
    note: >-
      checked 2026-10-09 against what the intake holds: the FS product page for this SKU was live
      when the intake read it on 2026-10-08, and the FS documentation portal's Accessories tree,
      read the same day, carries no end-of-sale notice for it. No web search beyond FS's own pages
      was made.
