format: 1
kind: device
name: uscmh-sfdabs2u
version: 0.1.1
maturity: modelled
manufacturer: FS.com
model: USCMH-SFDABS2U
aliases:
  - {name: '317017', kind: vendor}
description: >-
  2U single-sided horizontal cable manager, FS SKU #317017: a black ABS finger duct with a double-hinged cover that opens upward or downward, the two-unit USCMH-SFDABS1U. A base plate between the rack ears carries a row of nine fingers along its top edge and another along its bottom, and the curved cover clips on the finger tips to close the channel; two rows of pass-through windows lead through the plate, and a ribbed moulding stiffens it behind.
profile: passive
provenance:
  capacity:
    confidence: estimated
    note: >-
      estimated - 116 cables, FS states none for the USCMH finger ducts. The channel
      clear cross-section, 66.8 mm high (the duct guide) by 69.75 mm deep (the well floor
      to the underside of the cover), divided by 39.9 mm2 a cable: the pooled ratio of the
      three FS ABS finger ducts whose capacity FS does state (CMH-SFD1U 48 in 1850 mm2,
      CMH-DFD1U 96 in 3700, CMH-SFD2U 124 in 5143). Those agree to within 8%, which is
      this figure's uncertainty at best; this is a different moulding. Across every FS
      manager the ratio runs 38.5 to 82.8 (the HD and UHD lines scale per rack unit), so
      it is fitted on the ABS ducts only.
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the fingers and cover stand 71.45 mm in front of the plane of
      the ears and the base 35.55 behind it (the top view), so the rear face of its rack
      unit stays free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. The FS 1&2RU Horizontal Single Sided Manager datasheet (USCMH-SFDABS1U and -2U) has a specification table and, per model, a top view, a front view and a side view in millimetres. Rendered at 600 dpi, the front view is
      4.14 px/mm across its 484.84 and 4.17 down its 88.8, under 1 per cent apart, so it is
      orthographic. The top view is the USCMH-SFDABS1U top view with a deeper cover: 107.00 (Ref)
      overall, 71.45 in front of the plane of the ears and 49.09 (Ref) from the ears to the back
      of the cover; the side view's 75.80 is the 71.45 plus the same 4.35 as on the 1U. The renders
      of #317017 are the second reading; gallery image 5 is the front with the cover off, straight
      on, and its ear holes 76 mm apart read 3.16 px/mm down against 3.16 across.
  chassis:
    confidence: drawing
    note: >-
      drawing - THE BODY BETWEEN THE EARS. The specification table gives 88.0 x 482.2 x 107.0
      mm (3.46 x 18.98 x 4.21 in) and the front view 88.8 high and 484.84 across the cover; 88.8
      is taken. The width between the ear folds is the USCMH-SFDABS1U's 436.3, whose top view
      this one repeats; the ears are not drawn. `depth` STATES THE VENDOR OVERALL 107.0: THE
      PRODUCT SELECTOR'S 2.81 in [71 mm] IS THE PROJECTION IN FRONT OF THE EARS, the 71.45 of
      the top view and the 2.81 in on the dimensioned render, not the depth; the table's 4.21 in
      and the drawing's 107.00 agree, and the ribbed base stands 35.55 behind the ears.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW DUCT, NOT A BOX, built as CMH-SFD1U is: the base plate on the front
      view as a well 71.25 deep whose floor is open at the pass-through windows, the two
      rows of fingers standing in it, the cover in it across the finger tips, which lifts off
      and opens the channel, and the base behind the ears closed by plates sunk just inside
      the rear, top, bottom and side faces. The channel, the slots between the fingers and the
      two ends are open air.
  base-shape:
    confidence: drawing
    note: >-
      drawing - THE BASE BEHIND THE EARS IS BOWED in the top view, as on USCMH-SFDABS1U, 35.5
      deep at the middle. It is drawn as a straight box the full 35.5 deep and the full height;
      the X-ribs on it are not drawn.
  thickness:
    confidence: estimated
    note: >-
      estimated - no FS document states a wall gauge for the ABS moulding; 10 is the estimated
      thickness of a finger across the height of the duct, and the plates and the cover are
      thinner, each in its own part.
  front:
    confidence: drawing
    note: >-
      drawing - the cover, fitted, 22.36 deep, the 71.45 to the front less the 49.09 (Ref) from the ears to the back of the cover. The finger walls are placed 1.0 inside
      the top and bottom of the duct and 10 thick, estimated: the renders show the upper row's
      roots in the top quarter of the plate. The `duct` guide is the channel between them over
      the full width, on the top view's pitch and gap.
  fingers:
    confidence: drawing
    note: >-
      drawing - the top view: nine fingers a row, the middle seven on a 53.9 mm pitch with the
      middle one on the middle of the duct, 19.5 wide, and the two end fingers centred 207.8
      from the middle at mid-length. The end fingers are swept toward the middle in the top
      view; they are drawn straight, centred 202.15 from the middle so that their 32 mm tips
      end flush with the ends of the duct, 5.65 inside where their mid-length reads.
  top:
    confidence: drawing
    note: >-
      drawing - the top view, rear at y=0: the base 35.55 deep behind the plane of the
      ears, the fingers to the back of the cover with the slots dark between them, and the
      cover over the last 22.36.
  bottom:
    confidence: drawing
    note: >-
      drawing - the renders draw the same fingers along the bottom as along the top; the
      bottom is the top again.
  left:
    confidence: drawing
    note: >-
      drawing - the side view along the depth: the base, the two rows of fingers, and the
      cover's edges over their tips. The duct is open at both ends, and nothing is built
      across them.
  rear:
    confidence: photo-measured
    note: >-
      photo-measured - the back of the base with the pass-through windows of the front, which
      the renders show the background through: 101.3 x 15.8 at [66.25, 20.6]; 101.3 x 15.8 at [268.75, 20.6]; 101.3 x 15.8 at [66.25, 52.2]; 101.3 x 15.8 at [268.75, 52.2]. The back is built as plates round
      them, sunk 0.05 inside the rear face, as CMH-SFD1U 0.1.2 builds its back. The window
      heights are estimated where the fingers hide their lower edges.
  guides:
    confidence: estimated
    note: >-
      estimated - the duct on the front view is the channel between the finger walls, run
      across the rack; the finger pitch and gap are the top view figures, the channel height
      the estimated wall placement above.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - style, material, colour, environment and the included accessories are the
      specification table of the FS 1&2RU Horizontal Single Sided Manager datasheet; RoHS and ISO 9001 are its Standards Compliance
      list.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". Every image FS publishes of the part is a render; it is drawn
      in CMH-SFD1U's shades, the cover a little lighter than the duct.
