  physical:
    material: ABS
    color: Black
    mounting-hardware: M6*15mm Screw x4 and M6 Nut x4
  performance:
    cable-capacity: 116
    cable-capacity-basis: 'ESTIMATE, not stated by FS - Cat6 24AWG (6.1 mm) at 100% fill: a channel cross-section of 66.8 x 69.75 mm (4659 mm2, the duct guide height by the depth from the floor to the cover) at 39.9 mm2 a cable, the ratio in the Cat6 24AWG capacities FS states for the CMH-SFD1U, CMH-DFD1U and CMH-SFD2U (38.5 to 41.5)'
  compliance:
    environment: Indoor
    rohs: RoHS Compliant
    iso: ISO9001 Certificate
