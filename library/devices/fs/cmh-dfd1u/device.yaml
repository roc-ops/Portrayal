format: 1
kind: device
name: cmh-dfd1u
version: 0.1.2
maturity: modelled
manufacturer: FS.com
model: CMH-DFD1U
aliases:
  - {name: '29040', kind: vendor}
description: >-
  1U dual-sided horizontal cable manager, FS SKU #29040: two CMH-SFD1U black ABS finger
  ducts back to back on one pair of rack ears, one channel facing the front of the rack
  and one facing the rear. Each has a row of fingers along its top edge and another along
  its bottom, twelve slots in each, and its own detachable cover over the finger tips; two
  pass-through holes through the joined bases lead cables from one channel to the other.
profile: passive
provenance:
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - a dual-sided duct bolts to the front rails with its fingers
      facing both ways: the front duct stands 75.7 mm in front of the plane of the ears and
      the rear duct 98.3 behind it (the top view, 174 overall), so it serves the face it is
      bolted to and the space just behind the rails, and at 174 mm it does not reach the
      rear rails of a rack. The rear face of its rack unit stays free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. FS publishes one datasheet for CMH-SFD1U, CMH-SFD2U
      and CMH-DFD1U (Horizontal Cable Managers with Finger Duct), with a front view and a
      top and side view of each. The front view of CMH-DFD1U is the CMH-SFD1U front view
      line for line (the same ears, holes 3.03 in [77mm], 6.74 in apart, the 0.98 in
      [25mm] channel). The top view is two CMH-SFD1U plans back to back, 6.85 in [174mm]
      overall, each half 3.43 in [87mm] with its 0.47 in [12mm] base, 2.36 in [60mm]
      fingers and 33.6 mm pitch label; the side view reads 6.7 in [170mm] between the
      finger tips. So each half is drawn with the four CMH-SFD1U parts, the front half on
      the front view and the rear half on the rear view.
  chassis:
    confidence: drawing
    note: >-
      drawing - THE BODY BETWEEN THE EARS. The datasheet table gives 44 x 482.6 x 174 mm
      (1.73 x 19 x 6.85 in). The ears are the ends of the front duct's base plate, as on
      CMH-SFD1U; the rear duct's base carries none (the top view draws the ear flange once,
      at the back of the front half). They are not drawn, and the duct between them is
      CMH-SFD1U's 433 x 42. `depth` STATES THE VENDOR OVERALL 174: the front cover 75.7 in
      front of the ear plane, the two bases 22.6 behind it, and the rear duct behind them.
  shell:
    confidence: drawing
    note: >-
      drawing - TWO HOLLOW DUCTS, NOT A BOX. Each half is built as CMH-SFD1U: its base on
      its own face as a well 75.5 deep whose floor is open at the two pass-through holes,
      the two rows of fingers standing in it and the cover across the finger tips, which
      lifts off and opens that channel. The two floors stand 23 apart in the middle of the
      part; plates sunk just inside the top, bottom and side faces close the joined bases
      between them, and the holes run through from one channel to the other. Both channels
      and their ends are open air.
  thickness:
    confidence: estimated
    note: >-
      estimated - no FS document states a wall gauge; 7.3 is the CMH-SFD1U finger wall,
      and the side view of CMH-DFD1U draws the same walls, 27 mm apart across 42.
  weight:
    confidence: datasheet
    note: datasheet - 0.88 kg, the FS product page specification table for #29040.
  front:
    confidence: drawing
    note: >-
      drawing - the front duct with its cover fitted, the CMH-SFD1U front view: the front
      view of the datasheet draws it with the cover off, the finger tips end-on and the
      pass-through holes at the back of the channel. The `duct` guide is the 25 mm between
      the finger walls, dimensioned 0.98 in [25mm].
  rear:
    confidence: drawing
    note: >-
      drawing - the rear duct, the same four parts placed the same way: the part is
      symmetric about its middle, so the rear duct seen from behind is the front duct seen
      from the front. The straight-on render (x1) and the dual render (g2) show both
      channels with the same thirteen fingers a row and their own covers. Its own `duct`
      guide is the same 25 mm channel.
  passes:
    confidence: drawing
    note: >-
      drawing - the two pass-through holes join the two channels through the middle of the
      part and reach neither outer face, so no face declares a `passes:` entry; they are
      the holes in each duct's floor.
  top:
    confidence: drawing
    note: >-
      drawing - the top view, rear at y=0: the rear duct's cover 0 to 15, its fingers to
      75.7 and its base to 87, then the front duct's base to 98.3, the ear plane, its
      fingers to 159 and its cover to 174 - the CMH-SFD1U plan and the same plan turned
      round, as the datasheet draws it. Twelve slots in each half on the CMH-SFD1U 34.1
      pitch, 16 wide, each narrowing to a 4 mm neck under its cover.
  bottom:
    confidence: drawing
    note: >-
      drawing - the front view draws the same finger tips along the bottom as along the
      top, and the side view draws two equal walls in each half; the bottom is the top
      again.
  left:
    confidence: drawing
    note: >-
      drawing - the side view of CMH-DFD1U: the two joined bases in the middle, two finger
      walls 27 apart in each half, and the hooked tips each cover clips to, drawn as the
      cover lips. Both ducts are open at both ends.
  rear-not-drawn:
    confidence: drawing
    note: >-
      drawing - the moulded marks on the bases and the ribs between them are not drawn.
  guides:
    confidence: drawing
    note: >-
      drawing - each duct is the channel between its finger walls, run across the rack;
      finger pitch and gap are the top view figures above.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - the Cable Capacity Reference Guide table of the same datasheet gives
      CMH-DFD1U per cable type at 30 per cent and 100 per cent fill, and notes that the
      copper figures are theoretical, for reference only. The figure stated is the Cat6
      24AWG 6.1 mm row, as for CMH-SFD1U; FS states it for the manager, both channels
      together, and it is not divided between them.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - material, colour, the mounting hardware, the two pass-through holes, the
      detachable cover and the 2.87 in finger duct are the specification table of the
      finger duct datasheet; RoHS and ISO 9001 are its Standards Compliance list.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". Every image FS publishes of the part is a render; it is
      drawn in CMH-SFD1U's shades.
attrs:
  physical:
    weight-kg: 0.88
    material: ABS
    color: Black
    mounting-hardware: M6*15mm Screw x4 and M6 Nut x4
  performance:
    cable-capacity: 96
    cable-capacity-basis: >-
      Cat6 24AWG, 6.1 mm, at 100% (maximum) fill, both channels - a theoretical value for
      reference (FS finger duct datasheet), which recommends 30% fill, 29 cables
  compliance:
    rohs: RoHS Compliant
    iso: ISO9001 Certificate
