format: 1
kind: device
name: cmh-sfd2u
version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: CMH-SFD2U
aliases:
  - {name: '29039', kind: vendor}
description: >-
  2U single-sided horizontal cable manager, FS SKU #29039: a black ABS finger duct with a
  detachable cover, the two-unit CMH-SFD1U. A base plate between the rack ears carries a
  row of fingers along its top edge and another along its bottom, twelve slots in each a
  cable is laid in through, and the cover clips over the finger tips to close a channel
  about 70 mm high that runs the width of the rack. Two pass-through holes in the base
  lead cables to the other side.
profile: passive
provenance:
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the fingers stand 60 mm in front of the mounting plane and the
      base 11.3 behind it (the top view), as on CMH-SFD1U, so the rear face of its rack
      units stays free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. FS publishes one datasheet for CMH-SFD1U, CMH-SFD2U
      and CMH-DFD1U (Horizontal Cable Managers with Finger Duct), with a front view and a
      top and side view of each, inch dimensions with millimetres in brackets. Its embedded
      raster of the CMH-SFD2U front view is 5.91 px/mm across the 482.6 and 5.90 down the
      88.5, so it is orthographic. The top view of CMH-SFD2U is the CMH-SFD1U top view
      line for line (the same twelve slots, 1.32 in [33.6mm] pitch label, 0.63 in [16mm]
      gap, 2.36 in [60mm] fingers and 0.47 in [12mm] base): the 2U part is the 1U part
      made taller, not deeper, and its fingers are the CMH-SFD1U fingers.
  chassis:
    confidence: drawing
    note: >-
      drawing - THE BODY BETWEEN THE EARS. The datasheet table gives 88.5 x 482.6 x 87 mm
      (3.48 x 19 x 3.43 in), and the front view dimensions 3.48 in [88.5mm]; the 89 in an
      older listing is that figure rounded, and 88.5 is taken for the ears. The ears are
      the ends of the moulded base plate, five holes each, and are not drawn; the duct
      between them is the CMH-SFD1U's 433, 24.8 mm of ear each end. Its 86.5 is the side
      view across the two finger walls, 3.4 in [86.5mm], with 2.8 in [71.5mm] between
      them; the front view reads the walls 2.5 and 2.0 mm inside the ear edges, 1 mm each
      side. `depth` STATES THE VENDOR OVERALL 87, the base 11.3 behind the plane of the
      ears and the fingers and cover in front of it.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW DUCT, NOT A BOX, built as CMH-SFD1U is: the base plate on the
      front view as a well 75.5 deep whose floor is open at the two pass-through holes, the
      two rows of fingers standing in it, the cover in it across the finger tips, which
      lifts off and opens the channel, and the back of the base closed by plates sunk just
      inside the rear, top, bottom and side faces. The channel and its two ends are open
      air.
  thickness:
    confidence: estimated
    note: >-
      estimated - no FS document states a wall gauge for the ABS moulding. 7.3 is the
      finger wall of CMH-SFD1U; the CMH-SFD2U side view reads (86.5 - 71.5) / 2 = 7.5 a
      wall, within its line weight of the same moulding.
  weight:
    confidence: datasheet
    note: datasheet - 0.85 kg, the FS product page specification table for #29039.
  front:
    confidence: drawing
    note: >-
      drawing - the cover, fitted. The front view of the datasheet draws the duct with the
      cover off - the two rows of finger tips end-on and the pass-through holes at the back
      of the channel. The finger walls are placed 1.2 inside the top and bottom of the duct,
      as on CMH-SFD1U, 7.3 thick, which leaves 69.5 between them: the front view reads
      68.5 between the finger tips and the side view 71.5 between the walls' outer
      faces. The `duct` guide is that 69.5 over the full width of the duct.
  top:
    confidence: drawing
    note: >-
      drawing - the top view, rear at y=0, drawn as CMH-SFD1U's because the datasheet's
      two top views are the same drawing: the base 11.3 deep behind the ear plane, then the
      finger wall, then the cover from 72 to the front; twelve slots on a 34.1 pitch (the
      drawing, not the 33.6 label, as CMH-SFD1U settles it), 16 wide, each narrowing to a
      4 mm neck under the cover.
  bottom:
    confidence: drawing
    note: >-
      drawing - the front view draws the same finger tips along the bottom as along the
      top, and the side view draws two equal walls; the bottom is the top again.
  left:
    confidence: drawing
    note: >-
      drawing - the side view of CMH-SFD2U: the base, the two finger walls with 71.5
      between them, and the hooked tips the cover clips to, drawn as the cover lips over
      them. The duct is open at both ends, and nothing is built across them.
  rear:
    confidence: drawing
    note: >-
      drawing - the back of the base with the two pass-through holes of the front view,
      75 x 37.5, 172 apart, 322 over both, centred. The straight-on render of the back
      (gallery image 5) confirms two holes, the fingers seen through them, and a round
      boss in the middle. The back is built as five plates round the two holes, sunk 0.05
      inside the rear face, as CMH-SFD1U 0.1.2 builds its back.
  rear-not-drawn:
    confidence: drawing
    note: >-
      drawing - the boss in the middle of the back reads as a vendor mark and is not drawn;
      the ribs on the back of the base are not drawn.
  guides:
    confidence: drawing
    note: >-
      drawing - the duct on the front view is the channel between the finger walls, run
      across the rack; finger pitch and gap are the top view figures above.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - the Cable Capacity Reference Guide table of the same datasheet gives
      CMH-SFD2U per cable type at 30 per cent and 100 per cent fill, and notes that the
      copper figures are theoretical, for reference only. The figure stated is the Cat6
      24AWG 6.1 mm row, as for CMH-SFD1U.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - material, colour, the mounting hardware, the two pass-through holes, the
      detachable cover and the 2.87 in finger duct are the specification table of the
      finger duct datasheet; RoHS and ISO 9001 are its Standards Compliance list.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". Every image FS publishes of the part is a render; it is
      drawn in CMH-SFD1U's shades, the cover a little lighter than the duct.
attrs:
  physical:
    weight-kg: 0.85
    material: ABS
    color: Black
    mounting-hardware: M6*15mm Screw x4 and M6 Nut x4
  performance:
    cable-capacity: 124
    cable-capacity-basis: >-
      Cat6 24AWG, 6.1 mm, at 100% (maximum) fill - a theoretical value for reference (FS
      finger duct datasheet), which recommends 30% fill, 37 cables
  compliance:
    rohs: RoHS Compliant
    iso: ISO9001 Certificate
