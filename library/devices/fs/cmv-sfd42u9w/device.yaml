gaps:
  - what: material
    scope: [front, rear, left, right]
    reason: sources-disagree
    note: >-
      the product page gives the body as SPCC; the datasheet gives the backbone as
      Plastic (ABS) and the page and datasheet headings call it plastic. The renders show
      a folded steel channel with plastic fingers, which is what is stated.
    wanted: FS confirming the material, or a real unit
  - what: cover
    scope: [front]
    reason: sources-disagree
    note: >-
      the product page style is Finger Duct and the specification table lists no cover;
      the drawing has a Cover Back View and the renders show a hinged cover, which is
      drawn.
    wanted: FS confirming whether #188944 ships with its covers
  - what: cable-capacity
    scope: [front]
    reason: vendor-silent
    note: >-
      no FS document states a cable capacity for this part; the capacity table of its
      datasheet covers only the 45U and 5U ducts.
    wanted: an FS capacity figure for CMV-SFD42U9W
  - what: finger-width
    scope: [front, top, bottom]
    reason: needs-drawing
    note: >-
      the back view prints no width, the views are anisotropic, and no view draws the
      duct end-on, so the 13 mm walls and fingers across the face and the 30 mm
      crossbars are estimated.
    wanted: an end view of the duct, or a ruler on a real one
  - what: bracket-stand-off
    scope: [left, right]
    reason: vendor-silent
    note: >-
      the side view draws four brackets behind the channel but dimensions only their
      spacing; how far the duct stands from the upright is not given, and no install
      guide is published for this part.
    wanted: an install guide, or a dimensioned drawing of a bracket fitted
