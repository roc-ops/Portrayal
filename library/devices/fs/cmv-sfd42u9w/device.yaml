description: >-
  42U single-sided vertical cable manager, FS SKU #188944: a black finger duct 3.5 in wide
  and 1866.9 mm tall (exactly 42U) in two 21U sections, that stands beside a 42U or 45U
  open-frame rack on brackets bolted to the side of the upright. A folded steel channel
  punched with six rectangular windows carries a row of moulded T fingers down each
  flange, 21 a section at one rack unit apart, and a hinged cover a section latches over
  the crossbars to close a channel 63 mm wide. It takes no rack unit.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING, AT THE RESOLUTION IT HAS. The FS 42U Vertical
      Cable Managers with Finger Ducts datasheet (page 5) draws the whole duct three ways
      - a back view, a side view and a cover back view - in millimetres, and notes that
      it is two equal parts, 73.5 in (1866.9mm) high. The embedded rasters are about 100
      by 720 px, so every figure is read on the 600 dpi page render, where each native
      pixel is a 5 px block, and only as a fraction of a figure the same view prints: the
      side view 152.6 across (283 px) and 1866.9 down (3090 px), the back view its 311,
      1555 and 228.2 down and the stated 88.9 across. The two axes of one view differ by
      up to 10 per cent, so nothing is carried between axes. The product-page renders of
      #188944 are the second reading (x1 dimensioned, cover closed and open; g2 straight
      on; g4, g5, g7 the channel; g6 and g8 the fingers and the cover hinge; g9 the
      included brackets and fixings).
  mount:
    confidence: drawing
    note: >-
      drawing - `rack-side`. The side view hangs four brackets off the back of the duct,
      622, 311 and 622 apart, and FS compatibility matrix accepts the part on the APC
      AR201 45U two-post and the AR203A 44U four-post open frames; the specification
      table says it matches 42U and 45U open racks. No install guide is published for
      it. The brackets (Quick Release Brackets x4 and Brackets x4, render g9 and x2) are
      hardware and are not drawn. It occupies no rack unit; `ru: 42` is the height it
      runs beside, and which side of the rack is a lab placement to say
      (docs/vertical-cable-managers-design.md).
  chassis:
    confidence: datasheet
    note: >-
      datasheet - THE DUCT AS IT STANDS, cover fitted: `width` across the rack face
      direction, `height` the height it runs, `depth` front to back. 1866.9 x 88.9 x 152.6
      is the specification table (73.5 x 3.5 x 6.00 in), and 1866.9 is 42 x 44.45. The
      side view prints 152.6 from the back of the channel to the front of the cover; the
      render x1 dimensions 3.5 in across the cover and 6.00 in along the side, and a
      section 36.75 in [933mm].
  sections:
    confidence: drawing
    note: >-
      drawing - THE TWO SECTIONS ARE DRAWN AS ONE LENGTH, each 933.45, half the 1866.9,
      with the joint a seam. The cover back view draws the two covers meeting at the
      joint, and the render x1 dimensions a section 933 mm.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW DUCT, NOT A BOX, as every FS finger duct in the library is
      (docs/cable-managers-design.md section 4). The body is a sheet body and its six views
      are elevations; the solid is what its parts build: the web of the channel as a well
      151.1 deep on the front view, its floor open at the six windows; the two finger walls
      and 84 fingers standing in it; and the two covers, which pull off and open the
      channel. The back is built as plates sunk 0.05 inside the rear face, round the
      windows.
  thickness:
    confidence: estimated
    note: >-
      estimated - no FS document states a gauge. 1.5 is the web and the cover plate; the
      parts carry their own thicknesses.
  floor:
    confidence: estimated
    note: >-
      estimated - the floor of the well is the front of the web, taken 1.5 from the rear:
      the side view draws the web at the back of the 152.6 as a single line.
  front:
    confidence: drawing
    note: >-
      drawing - the covers, fitted. With them off the front is the channel between the two
      finger walls, the crossbars of the fingers end-on along each edge and the web with
      its windows and keyholes at the bottom of it. The walls are taken 13 wide (the back
      view draws a strip of small square windows down each edge about that wide), so the
      channel is 62.9. The 42 fingers stand at one rack unit, centred in each section.
  fingers-shape:
    confidence: drawing
    note: >-
      drawing - the side view draws each finger as a T: a V widening to its root at the
      wall, a stem 12.7 high, and a crossbar along the duct at its front end; renders g6,
      g8 and x4 show the same T, moulded, clipped into square windows along the channel
      flange. The V is drawn as a block, and the crossbar is estimated at 30 high.
  material:
    confidence: drawing
    note: >-
      drawing - THE SOURCES DISAGREE AND THE RENDERS ARE TAKEN. The product page gives the
      body material as SPCC; the datasheet gives the backbone as Plastic (ABS), and both
      the datasheet heading and the page title call it a plastic manager. The renders
      g4, g5 and g7 show a folded sheet channel with punched square holes, countersunk
      screws and sheared edges, and moulded T fingers clipped into it, so the backbone is
      stated as SPCC and the fingers as plastic. The disagreement is a `gaps:` entry.
  cover:
    confidence: drawing
    note: >-
      drawing - THE SOURCES DISAGREE AND THE DRAWING IS TAKEN. The product page style is
      Finger Duct, with no cover, and the specification table lists none; the drawing has
      a Cover Back View, the render x1 shows the cover closed and swung open, and renders
      g2, g3 and g6 to g8 show it fitted. The cover is drawn, one a section, and the
      disagreement is a `gaps:` entry.
  rear:
    confidence: drawing
    note: >-
      drawing - the back view: the web 88.9 wide with six rectangular windows on its
      centre line, 47.3 wide and 146.4 high, each a declared pass-through, open, through
      into the channel; a keyhole above each (R11 over R6.78), the first 83.7 below the
      top and 311 apart, and a small window 26.8 by 31.6 below each of the first five large ones, painted.
      The view is symmetric about its centre line, so the rear is the back view
      unmirrored.
  rear-not-drawn:
    confidence: drawing
    note: >-
      drawing - the rows of small square windows down both edges of the web, the screw
      holes and the brackets are not drawn: the windows are the clips of the finger bases
      seen through the web, under one native pixel each, and the brackets are hardware.
  top:
    confidence: drawing
    note: >-
      drawing - the end of the duct seen from above, rear at y=0, from the side view
      depths: the web, the channel flanges to 37.2, the finger bases to 65.2, the V root,
      stem and crossbar to 143.4, the cover lips and the cover plate to 152.6. No view
      draws the end; it is the side view figures laid across the back view widths.
  bottom:
    confidence: drawing
    note: >-
      drawing - the bottom end is the top end again: the side view is the same at both
      ends.
  left:
    confidence: drawing
    note: >-
      drawing - the side view of the datasheet, rear at x=0: the channel flange, the row
      of finger bases, 42 fingers and the edge of the two covers, with the joint a seam.
      The bracket plates the view hangs behind the channel are not drawn.
  right:
    confidence: drawing
    note: >-
      drawing - the left view mirrored: the duct is the same on both sides.
  guides:
    confidence: estimated
    note: >-
      estimated - the duct on the front view is the channel between the two finger walls,
      62.9 wide on the estimated 13 walls, run down the height (`run: y`); its finger
      pitch is the rack unit of the side view and its gap the 31.75 between stems.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - NOT STATED. The cable capacity table of the datasheet lists CMV-5U3W,
      CMV-SFD45U5W and CMV-DFD45U5W and not this part, and the product page gives none; no
      cable-capacity is stated, and the absence is a `gaps:` entry.
  weight:
    confidence: datasheet
    note: datasheet - 10 kg, the FS product page specification table for #188944.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - style, colour, the included brackets and fixings, the open racks it
      matches and RoHS and ISO 9001 are the specification table and Standards Compliance
      list of the datasheet and the product page; the materials are under `material`.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". Every image FS publishes of the part is a render; it is
      drawn in the shades of the FS ABS ducts, the cover a shade lighter.
