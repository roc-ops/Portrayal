format: 1
kind: device
name: fhu-bps-2u
version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: FHU-BPS-2U
aliases:
- {name: '168824', kind: vendor, note: FS shop product ID}
description: >-
  2U 19in steel blanking panel, FS FHU-BPS-2U: one flat black SPCC plate 88 x 482.6 mm, screwed
  to the front rails through two slots at each end, its top and bottom edges folded back between
  the ends. It fills an unused rack space so cold air is not drawn round the equipment.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      the FS Blanking Panel Datasheet (portal 2125) is the 1U sheet; the "2U/4U Blanking Panel
      Datasheet" the portal serves (4737) is byte-identical to it, so this part has NO datasheet
      of its own and its figures are the product page's. Height and width are the specification
      ("Dimensions (HxW) 88 x 482.6 mm"); the layout of the face is the FS Blanking Panel Visio
      stencil, master FHU-BPS-2U, rendered at 10 px/mm against its 482.6 width, checked against
      the straight-on gallery render of SKU 168824 (g4) and the dimensioned render (x3); the slot
      positions are EIA-310's, which both agree with.
  chassis:
    confidence: datasheet
    note: >-
      the plate is the part: 88 x 482.6 per the specification, one steel plate the full width
      of the rack with its two mounting ends (the ears) in the same sheet, so the face is drawn
      at 482.6 with its slots (the owner's rule of 2026-10-09: ears built into the face are part
      of the face; lint L43 stands down for a body this wide). Behind the middle of the plate
      its top and bottom edges are folded back into short returns, which is the depth.
  depth:
    confidence: estimated
    note: >-
      9.8: no FS document states the returns' depth for the screw-on blanks. The tool-less steel
      blanks (FHU-BPSTL) dimension theirs 0.39 in (9.8 mm) and the gallery renders of the two
      families show returns of the same proportion, so 9.8 is drawn. The 3D body is the plate
      and its returns as one 9.8-deep box across the full width; the real ends are a single 1
      mm sheet.
  returns:
    confidence: photo-measured
    note: >-
      the returns run 26.5 to 456.1 across the plate: the straight-on gallery render of SKU 72753
      (g4) at 3.18 px/mm puts the return edge 25.8 and 456.7 in from the left end, the stencil's
      outline notches 27.1 and 457; the mean, made symmetric.
  thickness:
    confidence: estimated
    note: >-
      1 mm sheet, drawn as the slots' `vent` depth and the plate edge; FS states the material
      (SPCC) and not its gauge.
  slots:
    confidence: drawing
    note: >-
      2 slots at each end, 11 x 7 with round ends, centred 8.89 in from each end: FS's dimensioned
      render (SKU 72753 x3) prints 18.3 in (464.82 mm) between the slot centres across and 1.24
      in (31.5 mm) between the 1U plate's two slots, EIA-310's 465.1 and 31.75 to within 0.3.
      The slot size is the gallery renders' (11.0 x 7.2 on the 1U, 10.6 x 6.8 on the 2U and 4U)
      and the stencil's (11.4 x 7.1). Heights are EIA's, the top and bottom rail holes of the
      units the plate fills; the renders put them within 0.5 of those.
  eia:
    confidence: registry
    note: >-
      EIA-310 hole positions: the rail holes of each rack unit stand 6.35, 22.225 and 38.1 mm
      up from its bottom, and the two rails' holes are 465.1 mm apart across the rack. The plate
      is taken as centred in the rack units it fills, so a hole's height on the plate is its height
      in the units less half the difference between the units and the plate.
  mark:
    confidence: drawing
    note: >-
      FS prints its mark near the left end of the face (the stencil and every render); it is a
      logo and is not drawn.
  color:
    confidence: photo-measured
    note: >-
      black powder-coated steel, "Color: Black" in the specification; drawn in the shade of the
      FS cable managers.
  weight:
    confidence: datasheet
    note: >-
      the product page specification: 1.10 lbs (0.5 kg)
  packs:
    confidence: estimated
    note: >-
      FS sells this panel singly: inferred from the product page, whose title names one panel
      and whose variant selector offers no pack SKU; no datasheet exists for it to say so.
  rear:
    confidence: drawing
    note: >-
      the back of the plate as the rear three-quarter renders (g5) show it: plain, the two returns
      seen edge-on along its top and bottom between the ends, and the slots through it.
  sides:
    confidence: estimated
    note: >-
      the plate's end edge-on at the front, the two returns behind it, and the open channel between
      them; drawn from the renders' profile, which no document dimensions.
  hardware:
    confidence: datasheet
    note: >-
      the product page: "Mounting Hardware is Included for Easy Installation" (2U, 4U; the 1U
      page's description says the same). The cage nuts and screws (render x4) are not drawn; they
      are not part of the plate.
  lifecycle:
    confidence: estimated
    note: >-
      checked 2026-10-09 against what the intake holds: the FS product page for this SKU was live
      when the intake read it on 2026-10-08, and the FS documentation portal's Accessories tree,
      read the same day, carries no end-of-sale notice for it. No web search beyond FS's own pages
      was made.
