format: 1
kind: device
name: cmh-sfd1u
version: 0.1.0
maturity: modelled
manufacturer: FS.com
model: CMH-SFD1U
aliases:
  - {name: '29038', kind: vendor}
description: >-
  1U single-sided horizontal cable manager, FS SKU #29038: a black ABS finger duct with a
  detachable cover. A base plate between the rack ears carries a row of fingers
  along its top edge and another along its bottom, twelve slots in each a cable is laid
  in through, and the cover clips over the finger tips to close a 25 mm channel that runs
  the width of the rack. Two pass-through holes in the base lead cables to the other side.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR DRAWING. FS publishes one datasheet for CMH-SFD1U,
      CMH-SFD2U and CMH-DFD1U (Horizontal Cable Managers with Finger Duct), with a front
      view and a top and side view of each part, inch dimensions with millimetres in
      brackets. The front view is 2.671 px/mm across the 482.6 and 2.68 down the 44; the
      top view 2.192 across and 2.207 down the 87, 0.7 per cent apart: both are
      orthographic and carry geometry to about half a millimetre. The renders of #29038 on
      the FS product page are the second reading, and one of them is a straight-on plan.
  chassis:
    confidence: drawing
    note: >-
      drawing - THE BODY BETWEEN THE EARS, as every rack device in the library is modelled.
      The datasheet gives 44 x 482.6 x 87 mm (1.73 x 19 x 3.43 in) overall. The ears are
      the ends of the moulded base plate, 44 high, with a slot, a round hole and a slot
      each; they are not drawn, and they take 24.8 mm at each end. The duct between them
      reads 431.6 on the front view, 433.4 on the top view and 434.2 on the straight-on
      render, and 433.0 is taken. Its 42 is the side view, across the two finger walls.
      `depth` STATES THE VENDOR OVERALL 87, AND IT IS NOT ALL ON ONE SIDE OF THE RAIL: the
      base stands 11.3 mm behind the plane of the ears, the fingers 60 mm in front of it,
      and the cover clips on over their tips. The rear view is the back of the base; the
      front view is the cover.
  weight:
    confidence: datasheet
    note: datasheet - 0.45 kg, the FS product page specification table for #29038.
  front:
    confidence: drawing
    note: >-
      drawing - the cover, fitted. The front view of the datasheet draws the duct with
      the cover off - the two rows of finger tips end-on, the channel between them and the
      pass-through holes at the back of it. The `duct` guide is the 25 mm between the inner
      faces of the finger walls on that view, dimensioned 0.98 in [25mm], over the full
      width of the duct.
  top:
    confidence: drawing
    note: >-
      drawing - the top view, rear at y=0: the base 11.3 deep behind the ear plane, then
      the finger wall, then the cover from 72 to the front. Twelve slots: their centres
      run 74.77 px apart over eleven pitches, 34.1 mm, where the dimension line prints
      1.32 in [33.6mm]; over eleven pitches that is 5.5 mm, twelve pixels, and the front
      view agrees with the drawing at 91.3 px, 34.2 mm, so the pitch is the drawing and the
      label is not taken. The gap prints 0.63 in [16mm] and measures 16.4 between the
      centres of its outlines, so 16.0 is taken. Each slot is round at its root, 22.2 from
      the rear, and narrows to a 4 mm neck under the cover - the flared tips of the
      fingers that hold a cable in. The slot depth reads 47.8 against the dimensioned 46.6
      from the neck. The finger in the middle is centred on the duct, on both views and in
      the straight-on render, whose twelve openings agree.
  bottom:
    confidence: drawing
    note: >-
      drawing - the front view draws the same finger tips along the bottom as along the
      top, and the side view draws two equal walls; the bottom is the top again.
  left:
    confidence: drawing
    note: >-
      drawing - the side view of CMH-SFD1U, 2.45 px/mm across its 42: the base, the two
      finger walls 7.3 thick with 25 between them, and the hooked tips the cover clips to.
      The duct is open at both ends; a cable runs out of it there. The opening is built as
      a recess 18 deep, which stops short of the first slot; the channel really runs the
      width of the duct.
  rear:
    confidence: drawing
    note: >-
      drawing - the back of the base with the two pass-through holes, from the front view
      of the datasheet, which draws them through the channel: 76.4 wide (3.03 in [77mm]),
      25 high, 171.2 apart (6.74 in), 325.2 over both (12.8 in), symmetric about the middle.
      The render of the back confirms two holes, the fingers seen through them, and a
      round boss in the middle. The recess is built 60 deep, which is estimated; through a
      hole the real part shows the inside of the channel up to the cover.
  rear-not-drawn:
    confidence: drawing
    note: >-
      drawing - the boss in the middle of the base and the moulded recycling and material
      marks at its left end in the render of the back are not drawn: the boss reads as a
      vendor mark, and a mark is never drawn. The ribs on the back of the base are not drawn.
  base:
    confidence: drawing
    note: >-
      drawing - the base behind the ear plane reads 440.7 wide on the top view, 3.9 mm
      wider each side than the duct it carries. The body is one box, the width of the duct,
      so the base is drawn that width.
  guides:
    confidence: drawing
    note: >-
      drawing - the duct on the front view is the channel between the finger walls, run
      across the rack; finger pitch and gap are the top view figures above.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - the Cable Capacity Reference Guide table of the same datasheet gives
      CMH-SFD1U per cable type at 30 per cent and 100 per cent fill, and notes that the
      copper figures are theoretical, for reference only, with 30 per cent the recommended
      fill and 100 per cent the maximum. The figure stated is the Cat6 24AWG 6.1 mm row,
      the cable the FHD-CMP5DR datasheet states its own capacity in. Not divided among the
      slots: FS states it for the manager.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - material, colour, the mounting hardware, the two pass-through holes, the
      detachable cover and the 2.87 in finger duct are the specification table of the
      finger duct datasheet; RoHS and ISO 9001 are its Standards Compliance list.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". Every image FS publishes of the part is a render; their
      medians read 37 to 40 on each channel on the base and 45 on the cover, so the cover
      is drawn a shade lighter than the duct.
