  physical:
    weight-kg: 0.45
    material: ABS
    color: Black
    mounting-hardware: M6*15mm Screw x4 and M6 Nut x4
  performance:
    cable-capacity: 48
    cable-capacity-basis: >-
      Cat6 24AWG, 6.1 mm, at 100% (maximum) fill - a theoretical value for reference (FS
      finger duct datasheet), which recommends 30% fill, 14 cables
  compliance:
    rohs: RoHS Compliant
    iso: ISO9001 Certificate
