maturity: modelled
manufacturer: FS.com
model: FHU-BPSTL-4U
aliases:
- {name: '181856', kind: vendor, note: FS shop product ID}
description: >-
  4U 19in tool-less steel blanking panel, FS FHU-BPSTL-4U: one black SPCC plate 177.15 x 482.6
  mm with two ABS clips at each end whose hooks snap into the rail holes, so it fits without screws;
  its top and bottom edges fold back 9.8 mm between the ends.
profile: passive
provenance:
  method:
    confidence: drawing
    note: >-
      the FS Tool-less Blanking Panel Datasheet (portal 5057), FHU-BPSTL-4U column, for the height,
      width, material and weight; the layout of the face from the FS Blanking Panel Visio stencil,
      master FHU-BPSTL-4U, rendered at 10 px/mm against its 482.6 width, checked against the straight-on
      gallery render of SKU 181856 (g4) and the dimensioned render (x3), which agree on the number
      and places of the clips.
  chassis:
    confidence: datasheet
    note: >-
      the plate is the part: "Dimensions (HxW) 177.15 x 482.6 mm" (datasheet and product page),
      one steel plate the width of the rack with its ends in the same sheet, so the face is drawn
      at 482.6 with its clips (the owner's rule of 2026-10-09; lint L43 stands down for a body
      this wide). Behind the middle of the plate its top and bottom edges fold back into returns,
      which is the depth.
  depth:
    confidence: drawing
    note: >-
      9.8: FS's dimensioned render of SKU 181854 (x3) prints 0.39 in (9.8 mm) for the return,
      and that of 181856 the same. The 3D body is the plate and its returns as one box across
      the full width; the real ends are a single sheet.
  returns:
    confidence: photo-measured
    note: >-
      the returns run 17.9 to 464.7: the straight-on render of SKU 181854 (g4) at 3.13 px/mm puts
      the return's top edge 16.9 to 18.9 in from the left end and 463.4 to 465.3 from it on the
      right; the middle, symmetric.
  thickness:
    confidence: estimated
    note: >-
      1 mm sheet; FS states the material (SPCC) and not its gauge.
  clips:
    confidence: drawing
    note: >-
      2 ABS clip(s) at each end (fs/bpstl-clip@1), the bezel 16.8 in from the end: the stencil's
      left clip at 16.8, its right at 435.3, 0.5 off symmetric, drawn symmetric. Each sits on
      the middle rail hole of its rack unit (EIA-310), where the stencil and the renders put it;
      the right-hand clip is the part turned 180, its point and arrow toward the middle as drawn.
  hooks:
    confidence: photo-measured
    note: >-
      a 6.7 x 8.1 window centred 9.5 in from each end at the height of each rail hole the clip
      engages, the clip's hook showing grey in it. The straight-on render of SKU 181855 (g4, 3.104
      px/mm, its aspect within 0.1 per cent of the stated 88.25 x 482.6) centres both windows
      9.5 from their ends, near the rail hole's 8.75; the stencil draws them 11.95 in, and is
      not taken. The size is the stencil's. On the 2U the one clip sits between two windows, at
      the middle holes of the upper and lower unit.
  eia:
    confidence: registry
    note: >-
      EIA-310 hole positions: the rail holes of each rack unit stand 6.35, 22.225 and 38.1 mm
      up from its bottom, and the two rails' holes are 465.1 mm apart across the rack. The plate
      is taken as centred in the rack units it fills, so a hole's height on the plate is its height
      in the units less half the difference between the units and the plate.
  mark:
    confidence: drawing
    note: >-
      FS prints its mark beside the left clip; it is a logo and is not drawn.
  color:
    confidence: photo-measured
    note: >-
      black steel, black ABS clips with a grey slider, as every render shows; "Color: Black".
  weight:
    confidence: datasheet
    note: >-
      the datasheet: 1.68 lbs (0.76 kg)
  rear:
    confidence: estimated
    note: >-
      the back of the plate with the two returns edge-on between the ends and the back of each
      clip behind its window; no render shows the back square-on and the clips' backs are drawn
      as plain blocks.
  sides:
    confidence: estimated
    note: >-
      the plate's end edge-on, the returns behind it and the open channel between them.
  lifecycle:
    confidence: estimated
    note: >-
      checked 2026-10-09 against what the intake holds: the FS product page for this SKU was live
      and orderable when the intake read it on 2026-10-08, and the FS documentation portal's Accessories
      tree, read the same day, carries no end-of-sale notice for it. No web search beyond FS's
      own pages was made.
