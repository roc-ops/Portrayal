manufacturer: FS.com
model: CMH-5DR1U-N
aliases:
  - {name: '177305', kind: vendor}
description: >-
  1U horizontal cable manager, FS SKU #177305: a flat black steel panel on the rack
  rails with five steel D-rings standing 88 mm out of it. Each ring is an open loop, its
  short upper arm hooking down in front of the longer lower arm, and a cable is laid in
  through the slit between them.
profile: passive
provenance:
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the rings stand 88 mm in front of the panel and the panel's
      folded edges reach only 12 behind it (the vendor's side view), so the rear face
      of its rack unit stays free for another part (#854).
  method:
    confidence: drawing
    note: >-
      FIGURES FIRST, FROM THE VENDOR'S OWN DIMENSIONED DRAWING. FS's Horizontal Cable
      Managers with D-rings datasheet draws the CMH-5DR1U-N in a side view and a front
      view, dimensioned in inches with millimetres in brackets. Its front view is
      2.161 px/mm across from the 482.6 line (1043 px) and 2.227 px/mm down from the 44
      (98 px), a 3 % difference between the axes; the 430, 90 and 35 lines agree with
      the across scale to under a millimetre. Positions are read across and heights
      down.
  chassis:
    confidence: drawing
    note: >-
      drawing - 430 x 44 x 100. The plate is flat over the whole 19 in [482.6mm] and its
      top and bottom edges fold back over 16.9 in [430mm], 1.04 in [26.3mm] in from each
      end; the flat ends outside the folds are the ears, which this library does not
      draw, so the body is the 430. The datasheet's 3.46 in (88 mm) depth is the ring's
      lower arm from the face of the plate; the side view adds the folded edges, 12 mm
      behind it (3.5 in [89mm] from their back edge to the end of the upper arm, less
      the arm's 3 in [77mm]), so the envelope is 100 deep.
  thickness:
    confidence: estimated
    note: >-
      estimated - 1.2 mm, the sheet FS dimensions on the CMH-4DRB1U drawing of the same
      datasheet. No view of this part dimensions its sheet.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 0.64 kg in the specification table of FS's product page for #177305.
      The D-rings datasheet states no weight for any of its four managers. The page is
      not a held document.
  front:
    confidence: drawing
    note: >-
      drawing - the front view: the plate between the folds and the five rings. Rings
      centred 35 mm from the left fold and 90 apart: the drawing dimensions 1.04 in
      [26.3mm] plus 1.4 in [35mm] to the first ring's centre and 3.5 in [90mm] between
      centres, and the five read 90.0 mm apart at 2.161 px/mm, symmetric about the
      middle. Each ring is 12.7 wide; its contract has the rest. FS's mark, printed on
      the plate just inside the left fold, is not drawn: a vendor mark never is.
  rear:
    confidence: estimated
    note: >-
      estimated - the back of the plate, plain. FS publishes one render of the back
      (gallery image 2), which shows the plate and its folded edges and nothing else.
  top:
    confidence: drawing
    note: >-
      drawing - an elevation: the folded edge behind the plate, and the five rings'
      upper arms from above to 77 mm, with the lower arms reaching on to 88. The bottom
      is the same from underneath, where the lower arms are seen whole.
  left:
    confidence: drawing
    note: >-
      drawing - an elevation, the datasheet's side view: the folded edges behind the
      plate and the ring's profile in front of it, its hook and its curled lip. The
      right is the same, turned round.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - style, panel and ring material, rack units and the mounting hardware
      are the D-rings datasheet's specification table.
  cable-capacity:
    confidence: datasheet
    note: >-
      datasheet - 83 Cat6 24AWG 6.1 mm cables at 100 % fill, and 25 at the recommended
      30 %, in the Cable Capacity Reference Guide of FS's D-rings datasheet. Stated once,
      here, and not divided among the rings.
  color:
    confidence: estimated
    note: >-
      estimated - "Steel, Powder-coated Black" and "Color: Black". Every image FS
      publishes of the part is a render.
