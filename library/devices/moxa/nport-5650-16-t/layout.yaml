format: 1
kind: device
name: nport-5650-16-t
version: 0.1.0
maturity: modelled
manufacturer: Moxa
model: NPort 5650-16-T
description: Moxa NPort 5650-16-T 16-port RS-232/422/485 rackmount serial device server. The front has a Reset button and the Ready, LAN and PWR
  lamps. It also has a Tx and an Rx lamp for each serial port. The wide-temperature model has no LCD panel or push buttons. The rear has a ground
  screw, an AC inlet with a rocker switch and one LAN jack. It also has 16 RJ45 serial ports in two groups of eight.
profile: networking
provenance:
  sources: {confidence: datasheet, note: 'Two Moxa documents. NPort 5600 Series data sheet v1.9 (updated Aug 22, 2026): pages 1 to 3 (features,
      interfaces and serial ports), page 4 Physical Characteristics, Power Parameters and Environmental Limits, page 6 Dimensions, page 7 Ordering
      Information, page 8 Rack-Mounting Kits. NPort 5600 quick installation guide Version 5.4: page 2 Hardware Introduction with the front and
      rear panel figures. No photograph, stencil or CAD model is read.'}
  size: {confidence: datasheet, note: 'Data sheet page 4, dimensions without ears for all models but the NPort 5650-8: 440 x 45.5 x 198.25 mm.
      The page 6 ''All Other Models'' drawing agrees on width 440 and height 45.5 and draws the depth as 197.85 and 194.25, without the 198.25
      figure. The text figure is used, and the difference is the line art''s. The 480 mm with-ears width is not used: the body is the metal between
      the ear folds.'}
  ru: {confidence: estimated, note: No held document states a rack-unit height. The data sheet says '19-inch rack mounting' and the rack kit plates
      are 45 mm high. The 45.5 mm body is taken as one rack unit.}
  scale: {confidence: drawing, note: 'Every position is read off the page 6 ''All Other Models'' drawings of the data sheet, rendered at 600 dpi.
      The front and rear elevations are drawn to the 440 mm body: 1480 px across and 153 px high, 3.364 px/mm in both directions, so the figures
      pass the aspect check and carry geometry. Readings are good to about 0.5 mm. The top view is read from the same page at the same scale,
      y = 0 at the rear edge as the figure draws it.'}
  front: {confidence: drawing, note: 'Data sheet page 6, Standard Model and Wide Temp. Model front elevations, and quick installation guide page
      2, ''Front panel of the NPort 5600 Series'' (which prints ''NPort 5650-16''). Left to right: end cap with the maker mark, no LCD panel or
      push buttons on this wide-temperature model, the NPort 5650-16 nameplate, two rows of 16 lamps (Tx above Rx) under the port numerals, a
      Ready lamp, a LAN lamp and a PWR lamp. The window and push-button sizes are read off the line art; the lamps (2.0 mm) and the Reset button
      (4.0 mm) take the shared parts'' sizes, and the rings the line art draws are larger. The lamp colours and what each lamp shows are not in
      a held document.'}
  serial-ports: {confidence: drawing, note: 'Data sheet page 3: 16 ports on an 8-pin RJ45 for the NPort 5650-16 models, RS-232/422/485. The page
      6 and guide page 2 rear figures draw two blocks of eight, numbered 1 to 8 and 9 to 16, with a ground-screw-like hole under the middle of
      each block. The jacks are placed at the registry''s ganged pitch of 13.97 mm and the blocks are centred on the drawn frames: the drawn frame
      is 8 x 14.7 mm, wider than the jacks it holds, so the drawing is not read for a jack pitch. The jack''s latch side is the line art''s, up.'}
  lan: {confidence: datasheet, note: 'Data sheet page 2: one 10/100BaseT(X) RJ45 port with 1.5 kV magnetic isolation. The rear figures label it
      LAN. Data sheet page 1 says the Ethernet LEDs are ''located on the RJ45 connector'', so the lamped Ethernet jack part is placed, although
      the line art draws no lamp on it.'}
  front-lamps: {confidence: drawing, note: 'The 32 Tx and Rx lamps are in two rows in port order, but a lamp cannot name a port on the other face,
      so each lamp is `for: chassis` and its number is its id. Data sheet page 1 says the Tx/Rx lamps are for the serial ports.'}
  power: {confidence: datasheet, note: 'Data sheet page 4: AC models 100 to 240 VAC, 47 to 63 Hz; input current 158 mA @ 100 VAC for the NPort
      5650-16 and 5650-16-T. The rear figures draw an IEC inlet with a rocker switch below it, labelled ''AC Power 100-240 VAC 47-63 Hz''. No
      held document states a power draw in watts, and a current is not converted to one.'}
  colour: {confidence: estimated, note: 'The body and plate colours are read from the printed render on data sheet page 1, which shows a DC model
      and is not a calibrated photograph: a dark blue-grey front, a lighter end cap and a near-black rear. The line art of the guide draws the
      rear black. No photograph of the unit is held, so no colour is compared with one.'}
  ground: {confidence: drawing, note: 'A round screw at the left end of the rear, in both rear figures and the data sheet''s ''Ground'' callout
      on page 2. Its size is not stated; the nominal unsized ground screw is placed. A small dot above it is drawn in the figure and not named.'}
  top: {confidence: drawing, note: 'Data sheet page 6, top view of the ''All Other Models'' drawing: three sets of louvre openings and three screws
      along the front edge. Each set is one vent field, its openings read off the figure as polygons.'}
attrs:
  physical: {weight-kg: 2.51, weight-note: '2,510 g; the data sheet does not say whether the package is included'}
  performance: {serial-standards: 'RS-232, RS-422, RS-485', serial-connector: 8-pin RJ45, serial-rate-max: 921.6 kbps}
  power: {power-input-ac: '100 to 240 VAC, 47 to 63 Hz', power-input-current: 158 mA @ 100 VAC}
  environmental: {operating-temp-c: -40 to 75, storage-temp-c: -40 to 75, humidity: 5 to 95% non-condensing}
  compliance: {safety: UL 62368-1, emc: EN 55032/35, emi: 'CISPR 32, FCC Part 15B Class A'}
chassis: {width: 440, height: 45.5, depth: 198.25, ru: 1, color: '#3a3e47', power: ac}
gaps:
- what: rack-ears-and-kit
  scope: [front, rear]
  reason: vendor-silent
  wanted: an installation guide for the rack-mounting kit WK-45-01 with its ear positions and the racks it takes.
  note: The data sheet lists WK-45-01 as two L-shaped plates, 8 screws, 45 x 57 x 2.5 mm, for this model, and '19-inch rack mounting'. The quick
    installation guide calls the same kit a DIN-rail/wall kit. No guide is held, so no ear position and no kit is written.
- what: colour-photograph
  scope: [front, rear]
  reason: needs-photo
  wanted: a photograph of the front and of the AC rear.
  note: The only colour is the data sheet's printed render of a DC model, which is not compared with a photograph.
- what: lamp-meaning
  scope: [front]
  reason: vendor-silent
  wanted: the quick installation guide's or the manual's table of what the Ready, Tx, Rx, LAN and PWR lamps show.
  note: The lamps are drawn and labelled as the figure prints them. This order does not read the lamp tables of the NPort 5000 manual and states
    no lamp behaviour.
- what: unnamed-dot-by-ground-screw
  scope: [rear]
  reason: vendor-silent
  wanted: a name for the small dot above the ground screw.
  note: The rear figures draw it and no held document names it; it is not drawn.
- what: dip-switches
  scope: [bottom]
  reason: vendor-silent
  wanted: a drawing of the bottom panel with the DIP switches for RS-485 termination and pull resistors.
  note: Data sheet page 1 says the NPort 5650-8/16 has them on the bottom panel; no figure shows them.
- what: lifecycle
  scope: [front, rear]
  reason: vendor-silent
  wanted: the maker's product-lifecycle statement.
  note: No held document announces or denies an end of life, and no source outside the held ones was looked at.
- what: depth-figures-differ
  scope: [top, left, right]
  reason: sources-disagree
  wanted: which depth is the body's.
  note: Data sheet page 4 gives 198.25 mm; the page 6 drawing gives 197.85 and 194.25 mm and no 198.25. The text figure is used.
