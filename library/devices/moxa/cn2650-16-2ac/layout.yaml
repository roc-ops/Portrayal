gaps:
- what: rack-kit
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: an installation guide for the rack-mounting kit WK-45-01 with its parts and the racks it takes.
  note: The data sheet lists WK-45-01 as two L-shaped plates, 8 screws, 45 x 57 x 2.5 mm. No guide is held, so no kit is written; the ears are
    stated as the CAD sheet draws them.
- what: colour-photograph
  scope:
  - front
  - rear
  reason: needs-photo
  wanted: a photograph of the front and of the rear.
  note: The only colour is the data sheet's printed render, which is not compared with a photograph.
- what: lamp-meaning
  scope:
  - front
  reason: vendor-silent
  wanted: the guide's or the manual's table of what the Ready, Tx, Rx, LAN and PWR lamps show.
  note: The lamps are drawn and labelled as the figure prints them, and no lamp behaviour is stated.
- what: console-pinout
  scope:
  - rear
  reason: sources-disagree
  wanted: which pinout the console jack has.
  note: The data sheet lists three signals for the console port and the guide's table lists eight.
- what: depth-figures-differ
  scope:
  - top
  - bottom
  - left
  - right
  reason: sources-disagree
  wanted: which depth is the body's.
  note: Data sheet page 5 gives 198 mm; the page 7 drawing and the CAD sheet give 197.85 and 194.25 mm. The text figure is used.
- what: front-lamps-keys
  scope:
  - front
  reason: sources-disagree
  wanted: which source the front follows for the lamps and the keys.
  note: The CAD sheet draws eight lamp rings in two rows of four and no keys. The data sheet draws four keys and four lamps and no bar.
    The data sheet's page 7 and page 1 render are followed, and the sheet's dark bar is drawn as an unnamed label.
- what: rear-inlets
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: a ruling on drawing the AC inlets that stand about 3 mm past the rear edge in the sheet's top, underside, left and right views.
  note: The CAD sheet draws each inlet past the rear edge in the top and underside views. It draws a strip past it in the left and right views.
    The schema allows a reach beyond a face "Only on a `rack` device (L125)." Widening the top and underside views to 202 mm passed lint.
    The module's size test refused it, because it asserts the top view is 440 x 198 mm and the left view 198 x 45.5 mm. The views stay that size and the inlets are not drawn.
- what: lifecycle
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: the maker's product-lifecycle statement.
  note: No held document announces or denies an end of life.
