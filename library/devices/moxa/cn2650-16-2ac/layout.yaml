format: 1
kind: device
name: cn2650-16-2ac
version: 0.1.0
maturity: modelled
manufacturer: Moxa
model: CN2650-16-2AC
description: Moxa CN2650-16-2AC 16-port RS-232, RS-422, RS-485 rackmount terminal server. The front has an LCD panel, four push buttons and a
  Reset button. It also has the Ready, LAN and PWR lamps and a Tx and an Rx lamp for each serial port. The rear has a ground screw and two AC
  inlets, each with a rocker switch. It also has a console jack, two LAN jacks and 16 RJ45 serial ports in two groups of eight.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: 'Three Moxa documents. CN2600 Series data sheet v2.0: page 4 serial interface, page 5 power, dimensions and environment, page 6 safety and package.
      Its page 7 has the dimensions and ordering table. CN2600 Series quick installation guide v6.4: page 3 rear panels. The maker''s 2D CAD sheet from the
      CN2600 downloads. No photograph or stencil is read.'
  size:
    confidence: datasheet
    note: 'Data sheet page 5: 440 x 198 x 45.5 mm without ears. The page 7 drawing and the CAD sheet print 440.00 and 45.50 and draw the depth
      as 197.85 and 194.25. The text figure is used, and the difference is the line art''s.'
  ru:
    confidence: estimated
    note: No held document states a rack-unit height. The data sheet says '19-inch rack mounting' and the body is 45.5 mm. The 45.5 mm body is
      taken as one rack unit.
  scale:
    confidence: drawing
    note: The maker's 2D CAD sheet is a vector PDF in the CN2600 downloads. Its views are read from the line coordinates at 1.4173 pt/mm, the
      scale of the printed 440.00 mm body width. Readings are good to about 1 mm. The rear agrees with the NPort 5650-16 rear to that, apart from
      the second inlet, the console jack and the second LAN jack.
  front:
    confidence: drawing
    note: 'Data sheet page 7 front view at 300 dpi, whose nameplate reads CN2650-16-2AC. Left to right: end cap, the LCD panel, the Reset button,
      four push buttons and the nameplate. Then come two rows of 16 lamps under the port numerals, a Ready lamp, LAN2 over LAN1 and PWR2 over
      PWR1. The LCD and Reset are read from the CAD sheet. The lamps and keys fall within 1 mm of the NPort 5650-16 front. The model name on each
      device is its own, an estimate. The CAD sheet''s front also draws a dark bar at the right, which no document names, and it is drawn as an
      unnamed label. That front draws no push buttons and eight rings in the lamp group, so the data sheet''s four buttons and four lamps are
      followed.'
  serial-ports:
    confidence: drawing
    note: 'Data sheet page 4: 16 ports on an 8-pin RJ45, RS-232/422/485. The rear figures draw two blocks of eight, numbered 1 to 8 and 9 to 16.
      The CAD sheet''s jack pitch is 13.97 mm, the registry''s ganged pitch, and the jack''s latch side is down. The data sheet''s rear view draws it down as well.'
  console:
    confidence: datasheet
    note: 'Data sheet page 4: an RS-232 console port on an 8-pin RJ45. The rear figures label the left jack of the three Console. Its pinout differs
      between the data sheet and the guide, and this device states none.'
  lan:
    confidence: datasheet
    note: 'Data sheet page 2 and the rear figures: two 10/100 RJ45 ports labelled LAN 1 and LAN 2. The lamped Ethernet jack part is placed, as
      in the NPort 5650-16.'
  front-lamps:
    confidence: drawing
    note: 'The 32 Tx and Rx lamps are in two rows in port order. A lamp cannot name a port on the other face, so each lamp is `for: chassis` and
      its number is its id. They are drawn off, with an on state.'
  power:
    confidence: datasheet
    note: 'Data sheet page 5: 100 to 240 VAC, 50/60 Hz, 130 mA @ 110 VAC, two power inputs. The rear figures draw an IEC inlet with a rocker switch.
      No held document states a power draw in watts.'
  colour:
    confidence: estimated
    note: The body colours are the NPort 5650-16's, read from the data sheet's printed render of the same family. The CN2600 render on page 1
      is dark charcoal. No photograph is held, so no colour is compared with one.
  ground:
    confidence: drawing
    note: A round screw at the left end of the rear, in the data sheet and CAD sheet rear views. The data sheet and the guide print a ground symbol above it and the CAD sheet does not. Its size is not
      stated; the nominal unsized ground screw is placed. The data sheet also draws a dashed ring about 9 mm across round it. The kit has no dash, so it is not drawn.
  top:
    confidence: drawing
    note: The CAD sheet's top view draws three sets of louvre openings and three screws. The NPort 5650-16 top has the same, so it is reused.
  sides:
    confidence: estimated
    note: The CAD sheet's left and right views. Each shows at the front a plate 57 mm long with two rows of three holes and a fold, read from
      the line coordinates. Toward the rear each shows two rows of two holes, a larger dot and two small holes at the edge. Those positions are
      the figures of the NPort 5610-16 sheet, which agree with this sheet to about 1 mm. The right side is the left one mirrored in depth.
  bottom:
    confidence: estimated
    note: The CAD sheet's underside view shows four round holes and six tabs on the front edge. It also shows a plate near the rear with two screws
      and a tab. The positions are read from the front edge and put on the 198 mm face, good to about 1 mm there. The view is turned to the library's
      underside, rear at the top.
  ears:
    confidence: estimated
    note: The CAD sheet's front view draws a flat ear on each end, the full height of the body. Its top view puts the flange about 7.9 mm behind
      the front face. The printed 31.80 is the spacing of the two slots of an ear.
attrs:
  physical:
    weight-kg: 2.64
    weight-note: 2,640 g; the data sheet does not say whether the package is included
  performance:
    serial-standards: RS-232, RS-422, RS-485
    serial-connector: 8-pin RJ45
    serial-rate-max: 921.6 kbps
  power:
    power-input-ac: 100 to 240 VAC, 50/60 Hz
    power-input-current: 130 mA @ 110 VAC
  environmental:
    operating-temp-c: 0 to 55
    storage-temp-c: 0 to 55
    humidity: 5 to 95% non-condensing
  compliance:
    safety: UL 60950-1
    emc: EN 55032/24
    emi: CISPR 32, FCC Part 15B Class A
