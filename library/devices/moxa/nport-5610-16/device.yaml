  width: 440
  height: 45.5
  depth: 198.25
  ru: 1
  color: '#3a3e47'
  power: ac
  ears:
    positions:
    - {name: proud, label: ears as drawn on the maker's CAD sheet, at: 7.9, default: true}
gaps:
- what: rack-kit
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: >-
    an installation guide for the rack-mounting kit WK-45-01 with its parts and the racks it takes.
  note: >-
    The data sheet lists WK-45-01 as two L-shaped plates, 8 screws, 45 x 57 x 2.5 mm. The quick installation
    guide calls the same kit a DIN-rail/wall kit. No guide is held, so no kit is written; the ears are
    stated as the CAD sheet draws them.
- what: colour-photograph
  scope:
  - front
  - rear
  reason: needs-photo
  wanted: a photograph of the front and of the AC rear.
  note: >-
    The only colour is the data sheet's printed render of a DC model, which is not compared with a photograph.
- what: lamp-meaning
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    the quick installation guide's or the manual's table of what the Ready, Tx, Rx, LAN and PWR lamps
    show.
  note: >-
    The lamps are drawn and labelled as the figure prints them. This order does not read the lamp tables
    of the NPort 5000 manual and states no lamp behaviour.
- what: unnamed-dot-by-ground-screw
  scope:
  - rear
  reason: vendor-silent
  wanted: a name for the small dot above the ground screw.
  note: The rear figures draw it and no held document names it; it is not drawn.
- what: lifecycle
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: the maker's product-lifecycle statement.
  note: >-
    No held document announces or denies an end of life, and no source outside the held ones was looked
    at.
- what: depth-figures-differ
  scope:
  - top
  - bottom
  - left
  - right
  reason: sources-disagree
  wanted: which depth is the body's.
  note: >-
    Data sheet page 4 gives 198.25 mm; the page 6 drawing and the CAD sheet give 197.85 and 194.25 mm
    and no 198.25. The text figure is used, and the sides and underside are read against it.
