format: 1
kind: device
name: nport-5610-16
version: 0.1.0
maturity: modelled
manufacturer: Moxa
model: NPort 5610-16
description: >-
  Moxa NPort 5610-16 16-port RS-232 rackmount serial device server. The front has an LCD panel, four push
  buttons and a Reset button. It also has the Ready, LAN and PWR lamps and a Tx and an Rx lamp for each
  serial port. The rear has a ground screw, an AC inlet with a rocker switch and one LAN jack. It also
  has 16 RJ45 serial ports in two groups of eight.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Two Moxa documents. NPort 5600 Series data sheet v1.9 (updated Aug 22, 2026): pages 1 to 3 (features,
      interfaces and serial ports), page 4 Physical Characteristics, Power Parameters and Environmental
      Limits, page 6 Dimensions, page 7 Ordering Information, page 8 Rack-Mounting Kits. NPort 5600 quick
      installation guide Version 5.4: page 2 Hardware Introduction with the front and rear panel figures.
      No photograph, stencil or CAD model is read.
  size:
    confidence: datasheet
    note: >-
      Data sheet page 4, dimensions without ears for all models but the NPort 5650-8: 440 x 45.5 x 198.25
      mm. The page 6 'All Other Models' drawing agrees on width 440 and height 45.5 and draws the depth
      as 197.85 and 194.25, without the 198.25 figure. The text figure is used, and the difference is
      the line art's. The 480 mm with-ears width is not used: the body is the metal between the ear folds.
  ru:
    confidence: estimated
    note: >-
      No held document states a rack-unit height. The data sheet says '19-inch rack mounting' and the
      rack kit plates are 45 mm high. The 45.5 mm body is taken as one rack unit.
  scale:
    confidence: drawing
    note: >-
      Every position is read off the page 6 'All Other Models' drawings of the data sheet, rendered at
      600 dpi. The front and rear elevations are drawn to the 440 mm body: 1480 px across and 153 px high,
      3.364 px/mm in both directions, so the figures pass the aspect check and carry geometry. Readings
      are good to about 0.5 mm. The top view is read from the same page at the same scale, y = 0 at the
      rear edge as the figure draws it.
  front:
    confidence: drawing
    note: >-
      Data sheet page 6, Standard Model and Wide Temp. Model front elevations, and quick installation
      guide page 2, 'Front panel of the NPort 5600 Series' (which prints 'NPort 5650-16'; this nameplate
      takes this model's number, an estimate). Left to right: end cap with the maker mark, the LCD panel,
      the Reset button, four push buttons, the NPort 5650-16 nameplate, two rows of 16 lamps (Tx above
      Rx) under the port numerals, a Ready lamp, a LAN lamp and a PWR lamp. The window and push-button
      sizes are read off the line art; the lamps (2.0 mm) and the Reset button (4.0 mm) take the shared
      parts' sizes, and the rings the line art draws are larger. The lamp colours and what each lamp shows
      are not in a held document.
  serial-ports:
    confidence: drawing
    note: >-
      Data sheet page 3: 16 ports on an 8-pin RJ45 for the NPort 5610 models, RS-232. The page 6 and guide
      page 2 rear figures draw two blocks of eight, numbered 1 to 8 and 9 to 16, with a ground-screw-like
      hole under the middle of each block. The jacks are placed at the registry's ganged pitch of 13.97
      mm and the blocks are centred on the drawn frames: the drawn frame is 8 x 14.7 mm, wider than the
      jacks it holds, so the drawing is not read for a jack pitch. The jack's latch side is the line art's,
      up.
  lan:
    confidence: datasheet
    note: >-
      Data sheet page 2: one 10/100BaseT(X) RJ45 port with 1.5 kV magnetic isolation. The rear figures
      label it LAN. Data sheet page 1 says the Ethernet LEDs are 'located on the RJ45 connector', so the
      lamped Ethernet jack part is placed, although the line art draws no lamp on it.
  front-lamps:
    confidence: drawing
    note: >-
      The 32 Tx and Rx lamps are in two rows in port order, but a lamp cannot name a port on the other
      face, so each lamp is `for: chassis` and its number is its id. Data sheet page 1 says the Tx/Rx
      lamps are for the serial ports.
  power:
    confidence: datasheet
    note: >-
      Data sheet page 4: AC models 100 to 240 VAC, 47 to 63 Hz; input current 141 mA @ 100 VAC for the
      NPort 5610-16. The rear figures draw an IEC inlet with a rocker switch below it, labelled 'AC Power
      100-240 VAC 47-63 Hz'. No held document states a power draw in watts, and a current is not converted
      to one.
  colour:
    confidence: estimated
    note: >-
      The body and plate colours are read from the printed render on data sheet page 1, which shows a
      DC model and is not a calibrated photograph: a dark blue-grey front, a lighter end cap and a near-black
      rear. The line art of the guide draws the rear black. No photograph of the unit is held, so no colour
      is compared with one.
  ground:
    confidence: drawing
    note: >-
      A round screw at the left end of the rear, in both rear figures and the data sheet's 'Ground' callout
      on page 2. Its size is not stated; the nominal unsized ground screw is placed. A small dot above
      it is drawn in the figure and not named.
  top:
    confidence: drawing
    note: >-
      Data sheet page 6, top view of the 'All Other Models' drawing: three sets of louvre openings and
      three screws along the front edge. Each set is one vent field, its openings read off the figure
      as polygons.
  cad-drawing:
    confidence: drawing
    note: >-
      The maker's 2D CAD sheet for the NPort 5650-16-T, 5610-16, 5630-16 and 5650-16 (one sheet, one title
      block for the four). It dimensions the body at 440.00 wide and 45.50 high and the top view at 197.85
      and 194.25 deep, as the data sheet page 6 drawing does, so the body, the front, the rear and the
      top are the ones of the NPort 5650-16. It also draws the left and right sides, the underside and
      the ears, read below.
  sides:
    confidence: estimated
    note: >-
      The sheet's left and right views, rendered at 300 dpi: the body is 1163 px for 198.25 mm and 268
      px for 45.5 mm, 5.87 and 5.89 px/mm. The sheet prints no hole position on a side, so every position
      is read at that scale and is good to about 1 mm. Each side shows a plate 56.9 mm long at the front
      with two rows of three holes at a 20.1 mm pitch, two rows of two holes and one larger dot toward
      the rear, and two small holes at the rear edge. The right side is the left one mirrored in depth.
      What the holes take (rivet nuts, screws or bare holes) is not stated, so they are drawn as holes.
  bottom:
    confidence: estimated
    note: >-
      The sheet's underside view, rendered at 200 dpi: 440 mm is 1726 px, 3.92 px/mm, and the body is
      760 px deep, 193.7 mm against the sheet's 194.25. Positions are read from the front edge of that
      view and put on the 198.25 mm face, so they are good to about 1.5 mm. The view is drawn with the
      front at the top, so it is turned to the library's underside, rear at the top and left and right
      mirrored. It shows four round holes 14.8 mm across, six tabs on the front edge at a 72.2 mm pitch
      and a plate near the rear with two screws and a tab. The sheet's coloured corner and edge marks
      are drawing marks and are not drawn. What the plate covers is not stated.
  ears:
    confidence: estimated
    note: >-
      The sheet's front view draws a flat ear on each end, the full height of the body, 481 mm over both
      ears at the sheet's scale, which agrees with the data sheet's 480 mm over the ears. Each ear has
      two slots 12.2 x 7.2 mm. The printed 31.80 is the distance between the two slot centres of an ear,
      and 457.00 and 468.20 are the spans between the slot end centres across the unit. The top view puts
      the back of the flange about 7.9 mm behind the front face, read at 400 dpi against the 440 mm width.
      The sheet's 57 mm plate is drawn on the sides. The ears are stated as an ear position and not drawn
      on the faces.
