  performance: {serial-standards: RS-232, serial-connector: 8-pin RJ45, serial-rate-max: 921.6 kbps}
  power: {power-input-ac: '100 to 240 VAC, 47 to 63 Hz', power-input-current: 141 mA @ 100 VAC}
  environmental: {operating-temp-c: 0 to 60, storage-temp-c: -20 to 70, humidity: 5 to 95% non-condensing}
  compliance: {safety: UL 62368-1, emc: EN 55032/35, emi: 'CISPR 32, FCC Part 15B Class A'}
