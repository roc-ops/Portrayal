format: 1
kind: device
name: p42g20g
version: 0.1.0
maturity: modelled
manufacturer: Panduit
model: P42G20G
description: >-
  Panduit P42G20G G6 intelligent rack PDU, monitored and switched per outlet, 0U: a 1780 mm strip for a cabinet's
  vertical channel. It has a fixed 3 m cord ending in an IEC 60309 3P+E 9h 60 A plug, three-phase delta, 200-240 V.
  It has 42 outlets in two rows: 21 C13/C15 combination sockets and 21 C13/C15/C19 combination sockets, in six
  blocks. Each block is on a 20 A double-pole breaker across two of the three lines, as the drawing's labels read.
  A G6 controller with a display, three buttons, two lamps, five RJ45 jacks and a USB-A port sits between the two halves.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S VECTOR DRAWING. Panduit customer drawing P42G20G-XXYZ_DC rev 00A (11/03/2023), two
      sheets, has a front, rear, left, right and bottom view. Its scale was taken from its own 1780.0 overall dimension,
      which is 609.9 pt on the sheet, so 2.918 mm to the point. The 1555.0 between the buttons agrees. Positions were
      read off renderings of the front view at 200 and 300 dpi and off the vector paths, to about 1 mm. The library
      draws the PDU STANDING, cord end down, so a position along the drawing becomes 1780 minus that, and a position
      across becomes x. No photograph and no 3D model of the part is held.
  mount:
    confidence: drawing
    note: >-
      `rack-side`: the strip stands beside a rack's upright on two mounting buttons on its back, 1555.0 apart and
      40.5 from the cord end (rear view). The drawing says 'VERTICAL, 0U FULL' and gives no count of units. The maker's
      product page says 40 rack units, which is the whole units the 1780 mm length covers (40.04).
  chassis:
    confidence: drawing
    note: >-
      drawing - 1780.0 long (front view) and 56.0 and 75.0 on the bottom view. The maker's product page prints 56 mm
      wide, 1,780 mm high and 75 mm deep, and agrees. The sheet PUSP97 lists a 0U FULL form at 52 by 53 by 1750 and
      no form at 1780 (gaps: body-size). The drawing's figures are used. Weight 11.5 kg is on sheet 2's part table only.
  front:
    confidence: drawing
    note: >-
      drawing - the front view. From the cord end: a plate with the external ground, three breaker plates B1 to B3, and three
      blocks of four columns of two outlets. Then come a blank plate with six marks, the controller and breaker plates
      B4 to B6. Three blocks of three columns run to the far end. Plate, block and outlet positions match the P42G20M's
      to 1 mm, checked against the 300 dpi rendering. The outlet pitch is not dimensioned. The column pitch is 37.1
      in the first half, as on the P42G20M, and kept in the second.
  outlets:
    confidence: drawing
    note: >-
      drawing - '(21)C13/C15, (21)C13/C15/C19'. The receptacle block draws each as ONE SOCKET named 'C13/C15 COMBO 10A'
      and 'C13/C15/C19 COMBO 16A', so each is one outlet. The maker's page prints the second as C13/C15/C19/C21. The
      upper row of the front view is the C13/C15 and the lower row the C13/C15/C19 (x = 4 and 28). The outlets are
      numbered 1 to 42 column by column from the cord end, the upper socket first. THE NUMBERING IS AN ASSUMPTION, as
      the drawing prints no outlet numeral (gaps: outlet-numerals). THE WAY UP OF EACH SOCKET IS NOT READ.
  banks:
    confidence: drawing
    note: >-
      drawing - the front view labels the six blocks with a colour each. They read 'B1 [DARK GRAY]', 'B2 [LIGHT GRAY]' and 'B3 [WHITE]',
      then 'B4 [DARK GRAY]', 'B5 [LIGHT GRAY]' and 'B6 [WHITE]'. The labels sit above the blocks, left to right from the cord end.
      A second row of labels below the blocks pairs B3 with the second block and B1 with the third (gaps:
      bank-colour-labels). The six breaker plates are B1 to B6, each printing its lines: L1-L2, L2-L3, L3-L1, L1-L2,
      L2-L3, L3-L1. THAT BLOCK Bk IS FED BY BREAKER Bk IS A READING OF THE LABELS. The three greys are drawn as #55585c,
      #9a9da1 and #e4e5e7 and are estimates of the words.
  colour:
    confidence: drawing
    note: >-
      drawing - sheet 2 gives BLACK (RAL 9005) for the plain part number P42G20G, and the maker's page says Black. It is
      drawn here as the RAL's #0e0e10 on the body. THE PLATE, MOULDING AND SCREW COLOURS ARE NOT CHECKED against any
      source. No photograph is held, and the page's loaded images were all under 200 px, so no colour is sampled.
  controller:
    confidence: drawing
    note: >-
      drawing - the controller plate is drawn between the blank plate and the fourth breaker plate, about 142 along
      against the component's 127.8. The bay is centred on it. P42G20G is composed with panduit/g6-controller@1 in a bay
      because the sheet PUSP97 calls the controller hot swappable. The maker's page counts one RJ45 network, two sensor
      and two daisy-chain jacks and a USB port. The plate prints other labels, and the part names each jack by its label.
  lamps:
    confidence: datasheet
    note: >-
      datasheet - the maker's page says 'Green LED indicates outlet is on', one per outlet. The outlet parts carry
      no lamp, so none is drawn on the strip. No photograph is held, so no lit colour is sampled.
  input:
    confidence: drawing
    note: >-
      drawing - 'INPUT PLUG: IEC 60309 3P+E (IP44)' and plug 'IEC 60309, 3P 4W, 9H', 'INPUT VOLTAGE: 200-240VAC',
      'INPUT CURRENT: 60A (48A DERATED)', 'INPUT PHASE: THREE-PHASE, DELTA', 'RATED POWER: 17.3 kVA'. Sheet 2 gives the
      plain part number a 3 m cord. The cord is one part at the cord end; its length and the plug's face are not drawn.
  capability:
    confidence: datasheet
    note: >-
      datasheet - the drawing's unit type is MONITORED & SWITCHED PER OUTLET, and the maker's page lists it the
      same way. So `metering-scope: outlet` and `outlet-switching: true`.
  rear:
    confidence: drawing
    note: >-
      drawing - the rear view: two buttons 40.5 from the cord end and 1555.0 apart, on the strip's centre line. Two marks
      5.5 across sit 24.0 from the buttons ('2X 24.0') and a 7.1 ring near the far end. The callout 'TOOLESS MOUNTING
      BUTTON LOCATIONS (12) PL' names twelve locations, and the view draws the two buttons and no other (gaps: rear-marks).
  sides:
    confidence: estimated
    note: >-
      ESTIMATED from the vector paths of sheet 1 (2.918 mm to the point, scaled on the 1780.0 overall dimension). The
      sheet stacks FRONT, RIGHT, REAR and LEFT upward and puts BOTTOM beside FRONT, as the P42G20M's sheet does. The
      library stands the strip cord end down, a half turn in the plane. The sheet's RIGHT VIEW is the library's left
      face and its LEFT VIEW the library's right face. The pairs of marks 24.0 apart agree in both views. Dot lattices:
      RIGHT VIEW holds 1748 closed 0.6 pt marks, 1.75 mm across. One is drawn twice, so 1747 dots in 17 blocks
      on a 4.96 mm pitch. LEFT VIEW holds 1659 dots in 16 blocks on the same pitch. Counted twice, by bounding box and by
      distinct centres. Also drawn: 12 and 24 round screws 7.1 across, and four marks 5.5 across in two pairs 24.0 apart
      on each face. Each face also has 42 small tabs along its outlet-side edge. The LEFT VIEW's window is 157.6 by 32.1,
      with two corner marks. Each position is good to about 1 mm. No function is stated for any mark.
  ends:
    confidence: estimated
    note: >-
      ESTIMATED from the vector paths. The sheet's BOTTOM VIEW is the far end, the library's top face. It holds a 10 by 10
      lattice of 100 dots on a 4.96 mm pitch, placed to about 2 mm. Its flange tabs are not drawn (gaps: side-marks). No
      view shows the cord end as an end view, so the bottom face is the cord gland alone (gaps: cord-end-face).
attrs:
  physical: {length-mm: 1780, weight-kg: 11.5}
  power: {input-ac: 'three-phase delta, 200-240 V, 60 A (48 A derated), 17.3 kVA (drawing note 1)', input-plug: other, input-cord: fixed,
    input-phase: three, input-wiring: delta, input-current-a: 48, plug-rating-a: 60, breakers: six 20 A double-pole electromechanical
      switches and breakers}
  management: {metering-scope: outlet, outlet-switching: true, network-module: G6 controller}
chassis: {width: 56, height: 1780, depth: 75, ru: 40, mount: rack-side, color: '#0e0e10', airflow: passive, weight-kg: 11.5}
gaps:
- what: body-size
  scope: [front]
  reason: sources-disagree
  note: >-
    the drawing and the maker's page give 56 by 75 by 1780. The sheet PUSP97 lists a 0U FULL form at 52 by 53 by 1750.
    The drawing's figures are used.
  wanted: the maker's statement of which form the P42G20G is.
- what: photographs
  scope: [front, rear, top, bottom, left, right]
  reason: needs-photo
  note: no photograph of any face is held, so no colour, finish, printing or plate shape is checked against a photograph.
  wanted: a photograph of each face of the P42G20G.
- what: outlet-pitch
  scope: [front]
  reason: needs-drawing
  note: no dimension of an outlet or a plate on the front view is stated. The positions are read off the drawing at its own 1780.0 scale.
  wanted: a dimensioned front view.
- what: outlet-numerals
  scope: [front]
  reason: needs-drawing
  note: the drawing prints no outlet numeral that is text, so none is drawn. The numbering is column by column from the cord end.
  wanted: a front view whose outlet numerals are text.
- what: c15-notch
  scope: [front]
  reason: vendor-silent
  note: >-
    the 10 A 'C13/C15 COMBO' socket is a C13 outlet with the C15 extension its name states. It presents the C13 key
    and no C15 plug is registered. The 16 A socket presents the combination key. The drawing dimensions neither.
  wanted: a dimensioned drawing of the socket.
- what: cord-end-face
  scope: [bottom]
  reason: needs-drawing
  note: no view of the sheet is an end view from the cord end, so the bottom face is the cord gland alone.
  wanted: an end view of the cord end.
- what: rear-marks
  scope: [rear]
  reason: vendor-silent
  note: >-
    the rear view's callout names twelve toolless button locations, and the view draws two buttons. No document says
    where the other ten are.
  wanted: the maker's installation drawing.
- what: side-marks
  scope: [left, right, top]
  reason: vendor-silent
  note: >-
    the dot lattices, screws, tabs, window and corner marks of the sides and the far end are drawn from the
    sheet as unnamed decor. No document names any of them. The far end's flange tabs are not drawn.
  wanted: a photograph of each long side.
- what: breaker-plate-size
  scope: [front]
  reason: needs-drawing
  note: >-
    the breaker plates are drawn about 56 along the strip against panduit/g5-breaker-20a's 70.2. The part is reused and
    the plates are placed on their drawn centres.
  wanted: a dimensioned front view.
- what: bank-colour-labels
  scope: [front]
  reason: sources-disagree
  note: >-
    the front view's second row of labels pairs B3 [WHITE] with the second block and B1 [DARK GRAY] with the third. The
    row above pairs B1, B2 and B3 with the blocks in order, and that row is used.
  wanted: the maker's statement of each block's colour.
- what: wordmark-and-legends
  scope: [front]
  reason: needs-photo
  note: the wordmark, the external-ground legend and the legends beside the sockets, other than the breaker legends, are not drawn.
  wanted: a photograph of the cord end.
- what: part-number-variants
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    sheet 2 of the drawing lists the plain P42G20G only; its key lists six colours, three cord lengths and a
    bottom-end-fed cord. The device states the plain part's 3 m cord and 11.5 kg only.
  wanted: an order for each variant that has a held photograph or a dimensioned drawing.
