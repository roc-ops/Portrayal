format: 1
kind: device
name: p32e06m
version: 0.1.0
maturity: modelled
manufacturer: Panduit
model: P32E06M
description: >-
  Panduit P32E06M G5 intelligent rack PDU, monitored and switched, 0U full: a 1750 mm strip for a cabinet's vertical
  channel. It has a fixed 3 m cord ending in an IEC 60309 2P+E 6h 32 A plug, single-phase, 200-240 V. It has 32
  outlets, 24 IEC C13 and 8 IEC C19, in four blocks of eight. Two blocks are on each of two 20 A single-pole breakers.
  A controller with a display, indicators, five RJ45 jacks and a USB-A port sits between the two halves.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S VECTOR DRAWING. Panduit customer drawing P32E06M_DC rev 06A (12/16/2022), two sheets,
      is a vector sheet drawn to no stated scale, with a front, rear, left, right and bottom view. Its scale was
      taken from its own 1750.0 overall dimension (the 1555.0 between the buttons agrees), and every position was
      read off renderings of the front view at 400 and 800 dpi, to about 1 mm across and 3 mm along the strip. The
      library draws the PDU STANDING, cord end down, so a position along the drawing becomes 1750 minus that, and
      a position across becomes x. No photograph and no 3D model of the part is held.
  mount:
    confidence: drawing
    note: >-
      `rack-side`: the strip stands beside a rack's upright on two mounting buttons on its back, 1555.0 apart and
      40.5 from the cord end (rear view). The drawing says 'VERTICAL, 0U, FULL' and gives no count of units; `ru:
      39` is the whole units the 1750 mm length covers (39.4) and is not stated by any document.
  chassis:
    confidence: drawing
    note: >-
      drawing - 1750.0 long and 53.0 deep (right view, at the far end); the bottom view dimensions 52.0 and 75.0,
      and FBSP28 gives 2.0 in (50.8) wide and 2.1 in (53.34) deep. The width is taken as 52.0 and the depth as 53.0;
      which drawn figure is the body's width, and what the 75.0 measures, is not said (gaps: body-width). Weight
      6.5 kg is the sheet-2 table's for the plain part number.
  front:
    confidence: drawing
    note: >-
      drawing - the front view. From the cord end: a plate with the earth screw, one plate with two breakers, four
      outlet blocks of eight with the controller between the second and the third, and the far end. Outlet positions
      are the centres of each outlet as drawn; the outlet pitch is not dimensioned.
  outlets:
    confidence: drawing
    note: >-
      drawing - '(24) C13, (8) C19', numbered 1 to 8 in each block as the front view prints them; each block is
      a C19, three C13, three C13 and a C19, the C13s staggered across the face. Each outlet is std/c13-outlet@1
      or std/c19-outlet@1. The way up of each outlet is read off the front view.
  banks:
    confidence: drawing
    note: >-
      drawing - the front view labels the first two blocks 'B1 [DARK GRAY]' and the last two 'B2 [LIGHT GRAY]',
      over breakers B1 and B2. THAT B1 FEEDS THE FIRST TWO BLOCKS IS A READING OF THE LABELS: no sentence held says
      it. The two greys are drawn as #55585c and #9a9da1 and are estimates of the words: no photograph is held.
  colour:
    confidence: drawing
    note: >-
      drawing - sheet 2 gives BLACK (RAL 9005) for the plain part number P32E06M, drawn here as the RAL's #0e0e10
      on the body. THE PLATE, MOULDING, SCREW AND LAMP-WINDOW COLOURS ARE NOT CHECKED against any source; no photograph
      is held.
  controller:
    confidence: drawing
    note: >-
      drawing - the controller plate is between the second and third block, 127.8 along. P32E06M is composed with
      panduit/g5-controller@1 in a bay because the FBSP28 sheet calls the controller hot swappable. Its jacks' functions
      are not read (see the component's provenance).
  input:
    confidence: drawing
    note: >-
      drawing - 'INPUT PLUG: IEC 60309 2P+E 6H 32A/30A(24A DERATED)', 'INPUT VOLTAGE: 200-240VAC', 'INPUT PHASE:
      SINGLE-PHASE', 'RATED POWER: 7.4 / 5.8kVA (DUAL RATED)', 'PDU TO BE WIRED LINE TO NEUTRAL'. Sheet 2 gives
      the plain part number a 3 m cord. The cord is one part at the cord end; its length and the plug's face are
      not drawn.
  capability:
    confidence: datasheet
    note: >-
      datasheet - sheet 2 of the drawing titles the plain part MONITORED SWITCHED and FBSP28 lists it under the
      MS series: 'aggregate power monitoring and outlet level switching', so `metering-scope: input` and `outlet-switching:
      true` (the class `switched-metered-input`), and each outlet declares [on, off].
  rear:
    confidence: drawing
    note: >-
      drawing - the rear view: two buttons 40.5 from the cord end and 1555.0 apart, on the strip's centre line.
      '(2) PL 24.0' locates two further marks and '(2) PL O18.4' the buttons; the further marks are not drawn (gaps:
      rear-marks).
  sides:
    confidence: drawing
    note: >-
      drawing - the left and right views draw rows of small marks and, near the cord end of the left view, a rectangle;
      none is read here (gaps: side-marks).
  ends:
    confidence: drawing
    note: >-
      drawing - the cord end carries the gland and cord; the far end is a plain closed line. The cord end is drawn
      as the gland alone.
attrs:
  physical: {length-mm: 1750, weight-kg: 6.5}
  power:
    input-ac: >-
      single-phase, 200-240 V, 32 A / 30 A (24 A derated), 7.4 / 5.8 kVA dual rated (drawing note 1)
    input-plug: other
    input-cord: fixed
    input-phase: single
    input-current-a: 24
    plug-rating-a: 32
    breakers: two 20 A single-pole electromechanical switches and breakers
  management: {metering-scope: input, outlet-switching: true, network-module: G5 controller}
chassis: {width: 52, height: 1750, depth: 53, ru: 39, mount: rack-side, color: '#0e0e10', airflow: passive, weight-kg: 6.5}
gaps:
- what: body-width
  scope: [front]
  reason: sources-disagree
  note: >-
    the bottom view dimensions 52.0 and 75.0, the right view 53.0, and the sheet gives 2.0 in (50.8) wide and 2.1
    in (53.34) deep; no document says which drawn figure is the body's width or what the 75.0 measures. The strip
    is drawn 52 wide and 53 deep.
  wanted: a dimensioned end view of the strip, or a measured unit.
- what: photographs
  scope: [front, rear, top, bottom, left, right]
  reason: needs-photo
  note: >-
    no photograph of any face is held, so no colour, finish, printing or plate shape is checked against a photograph.
  wanted: a photograph of each face of the P32E06M.
- what: outlet-pitch
  scope: [front]
  reason: needs-drawing
  note: >-
    no dimension of an outlet, a lamp window or a plate on the front view is stated; the positions are read off
    the drawing at its own 1750.0 scale.
  wanted: a dimensioned front view.
- what: rear-marks
  scope: [rear]
  reason: vendor-silent
  note: >-
    the rear view's '(2) PL 24.0' and '(4) PL 32.0' locate marks beside the buttons, and no document says what they
    are.
  wanted: the maker's installation drawing.
- what: side-marks
  scope: [left, right]
  reason: vendor-silent
  note: >-
    the left and right views draw rows of small marks and a rectangle near the cord end; no document names them
    and the model does not read their positions.
  wanted: a photograph of each long side.
- what: wordmark-and-legends
  scope: [front]
  reason: needs-photo
  note: >-
    the wordmark, the earth symbol and the legends beside the lamp windows, other than the outlet numbers and the
    breaker legends, are not drawn.
  wanted: a photograph of the cord end and the controller.
- what: breaker-lines
  scope: [front]
  reason: vendor-silent
  note: >-
    the plate prints L-N for each breaker; which line each is across is not stated, so the breakers state no `lines`.
  wanted: the maker's wiring diagram.
groups:
  outlets:
    term: Outlet
    role: traffic
    index-origin: 1
    mixed: >-
      the PDU's 32 outlets, numbered 1 to 8 in each of four blocks as printed - 24 IEC C13 and 8 IEC C19, each switchable
  breakers:
    term: Breaker
    role: service
    index-origin: 1
    description: >-
      two 20 A single-pole breakers, B1 and B2, on one plate; B1 feeds the first two blocks and B2 the last two
  controller: {term: Module, role: management, index-origin: 1}
  grounding: {term: Ground, role: furniture, index-origin: 1}
  power-input: {term: Cord, role: service, index-origin: 1}
  mounting: {term: Button, role: furniture, index-origin: 1}
