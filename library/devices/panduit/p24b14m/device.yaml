    role: traffic
    index-origin: 1
    mixed: >-
      the PDU's 24 outlets, numbered 1 to 24 from the cord end - twelve IEC C13 and twelve IEC C19 in six blocks
      of four, each block on its own breaker
  breakers: {term: Breaker, role: service, index-origin: 1, description: 'six 20 A double-pole breakers, B1 to B6,
      each feeding one block of four outlets'}
  grounding: {term: Ground, role: furniture, index-origin: 1}
  power-input: {term: Cord, role: service, index-origin: 1}
  mounting: {term: Button, role: furniture, index-origin: 1}
