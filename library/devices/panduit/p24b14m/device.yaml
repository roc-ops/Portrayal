format: 1
kind: device
name: p24b14m
version: 0.1.0
maturity: modelled
manufacturer: Panduit
model: P24B14M
description: >-
  Panduit P24B14M basic rack PDU, 0U full: a 1750 mm strip for a cabinet's vertical channel. It has a fixed 3 m
  cord ending in an IEC 60309 3P+E 9h 60 A plug, three-phase delta, 200-240 V. It has 24 outlets, 12 IEC C13 and
  12 IEC C19, in six blocks of four. Each block is on a 20 A double-pole breaker across two of the three lines.
  It has no display, no network jack and no metering.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S VECTOR DRAWING. Panduit customer drawing P24B14M_DC rev 01B (08/21/2017) is a vector
      sheet drawn to no stated scale, with a front, rear, top (long side) and side (cord) view. Its scale was taken
      from its own 1750.0 overall dimension (the 1555.0 between the buttons agrees), and every position was read
      off renderings of the front view at 600 and 800 dpi, to about 1 mm across and 3 mm along the strip. The library
      draws the PDU STANDING, cord end down, so a position along the drawing becomes 1750 minus that, and a position
      across becomes x. No photograph and no 3D model of the part is held.
  mount:
    confidence: drawing
    note: >-
      `rack-side`: the strip stands beside a rack's upright on two mounting buttons on its back, 1555.0 apart and
      40.5 from the cord end (rear view). The drawing says 'VERTICAL, 0U FULL' and gives no count of units; `ru:
      39` is the whole units the 1750 mm length covers (39.4) and is not stated by any document.
  chassis:
    confidence: drawing
    note: >-
      drawing - 1750.0 long (top view) and 53.0 deep (top view, beside the far end); the sheet's 'Basic Power Distribution
      Units' table gives 2.0 in (50.8 mm) wide and 2.1 in (53.34) deep, and the drawing's 52.0 is dimensioned on
      the cord's side view. The width is taken as the 52.0 and the depth as the 53.0; the drawing does not say which
      of its figures is the body width (gaps: body-width). Weight 10.8 kg is the drawing's.
  front:
    confidence: drawing
    note: >-
      drawing - the front view. From the cord end: a plate with the maker's wordmark, two small screws and the earth
      screw with its symbol; then, in three pairs, two breaker plates followed by two outlet blocks of four. Each
      block is a moulding with a lamp window beside every outlet. The outlet and plate positions are read from the
      front view; the outlet pitch is not dimensioned.
  outlets:
    confidence: drawing
    note: >-
      drawing - 'OUTLET QTY&TYPE: (12) C13, (12) C19' and the receptacle block, 'IEC 60320/C19 16 A' and 'IEC 60320/C13
      10 A'. Each outlet is std/c13-outlet@1 or std/c19-outlet@1. The kind and the way up of each is read off the
      front view; the C19s of the first block of a pair are drawn earth side to the left and those of the second
      block earth side to the right. THE DRAWN OUTLET SYMBOLS ARE SMALLER THAN THE REGISTRY'S WELLS (a drawn C19
      pair is 32.9 apart against a 35.6 well, a drawn C13 27 across against a 30.4 well), so the library's wells
      cannot all stand on the drawn centres: the C19 pairs are drawn 35.7 apart, the C13 pairs 0.1 to 1.6 mm from
      their drawn centres, an ESTIMATE of the drawing's own reading error and not a source (gaps: outlet-size).
  banks:
    confidence: drawing
    note: >-
      drawing - the front view labels each of the six outlet blocks 'B1' to 'B6' with a colour, [DARK GRAY], [LIGHT
      GRAY], [WHITE], [DARK GRAY], [LIGHT GRAY], [WHITE], and each of the six breaker plates 'B1' to 'B6'. THAT
      BLOCK Bk IS FED BY BREAKER Bk IS A READING OF THE LABELS: no sentence held says it. Each plate prints the
      lines it is across: L1-L2, L2-L3, L3-L1, L1-L2, L2-L3, L3-L1. The three greys are drawn as #55585c, #9a9da1
      and #e4e5e7 and are estimates of the words: no photograph is held.
  colour:
    confidence: estimated
    note: >-
      estimated - the drawing's title block says MATERIAL/COLOR: N/A and the sheet states no housing colour, so
      the body is drawn a dark neutral. THE PLATE, MOULDING, SCREW AND LAMP-WINDOW COLOURS ARE NOT CHECKED against
      any source; no photograph is held.
  input:
    confidence: drawing
    note: >-
      drawing - 'INPUT PLUG: IEC 60309 3P+E 9H 60A', 'INPUT CORD LENGTH: 3m [10']', 'INPUT VOLTAGE: 200-240VAC,
      DELTA', 'INPUT CURRENT: 60A (48A DERATED)', 'RATED POWER: 17.3kVA'. The cord is one part at the cord end;
      its length and the plug's face are not drawn. A kW figure (note 5, 'MAXIMUM ALLOWABLE INPUT POWER = 17.3 kW')
      and the kVA figure differ in unit and are not reconciled, so no capacity is stated.
  capability:
    confidence: datasheet
    note: >-
      datasheet - the drawing's unit type is BASIC and the 'Basic Power Distribution Units (PDUs)' sheet lists no
      metering or switching for the basic line, so `metering-scope: none` and `outlet-switching: false`.
  rear:
    confidence: drawing
    note: >-
      drawing - the rear view: two buttons 40.5 from the cord end and 1555.0 apart, on the strip's centre line.
      '(2) PL 24.0' locates two further marks and '(2) PL O18.4' the buttons; the further marks are not drawn (gaps:
      rear-marks).
  sides:
    confidence: drawing
    note: >-
      drawing - the top view is the long side; it draws a row of small marks, not read here. The side view is the
      cord's, not the strip's.
  ends:
    confidence: drawing
    note: >-
      drawing - the cord end carries the gland and cord; the far end is a plain closed line. The cord end is drawn
      as the gland alone.
attrs:
  physical: {length-mm: 1750, weight-kg: 10.8}
  power: {input-ac: 'three-phase delta, 200-240 V, 60 A (48 A derated), 17.3 kVA (drawing note 1)', input-plug: other,
    input-cord: fixed, input-phase: three, input-wiring: delta, input-current-a: 48, plug-rating-a: 60, breakers: six
      20 A double-pole electromechanical switches and breakers}
  management: {metering-scope: none, outlet-switching: false}
chassis: {width: 52, height: 1750, depth: 53, ru: 39, mount: rack-side, color: '#232528', airflow: passive, weight-kg: 10.8}
gaps:
- what: body-width
  scope: [front]
  reason: sources-disagree
  note: >-
    the drawing dimensions 52.0 on the cord's side view and 53.0 on the top view, and the Basic PDU sheet gives
    2.0 in (50.8) wide and 2.1 in (53.34) deep; no document says which drawn figure is the body's width. The strip
    is drawn 52 wide and 53 deep.
  wanted: a dimensioned end view of the strip, or a measured unit.
- what: photographs
  scope: [front, rear, top, bottom, left, right]
  reason: needs-photo
  note: >-
    no photograph of any face is held, so no colour, finish, printing or plate shape is checked against a photograph.
  wanted: a photograph of each face of the P24B14M.
- what: outlet-pitch
  scope: [front]
  reason: needs-drawing
  note: >-
    no dimension of an outlet, a lamp window or a plate on the front view is stated; the positions are read off
    the drawing at its own 1750.0 scale.
  wanted: a dimensioned front view.
- what: outlet-size
  scope: [front]
  reason: needs-drawing
  note: >-
    the drawn outlet symbols are smaller than the registry's C13 and C19 wells, so the drawn centres could not be
    kept for four C19 and eight C13 outlets; they are moved by 0.1 to 1.6 mm. No document dimensions Panduit's own
    outlet.
  wanted: a dimensioned outlet drawing from Panduit.
- what: rear-marks
  scope: [rear]
  reason: vendor-silent
  note: >-
    the rear view's '(2) PL 24.0' and '(8) PL 32.0' locate marks beside the buttons and along the strip, and no
    document says what they are.
  wanted: the maker's installation drawing for the basic line.
- what: wordmark-and-earth-symbol
  scope: [front]
  reason: needs-photo
  note: the wordmark, the earth symbol and the legends beside the lamp windows are not drawn.
  wanted: a photograph of the cord end.
groups:
