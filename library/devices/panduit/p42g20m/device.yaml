  physical: {length-mm: 1780, weight-kg: 6.8}
  power: {input-ac: 'three-phase delta, 200-240 V, 60 A (48 A derated), 17.3 kVA (drawing note 1)', input-plug: other, input-cord: fixed,
    input-phase: three, input-wiring: delta, input-current-a: 48, plug-rating-a: 60, breakers: six 20 A double-pole electromechanical
      switches and breakers}
  management: {metering-scope: outlet, outlet-switching: true, network-module: G5 controller}
chassis: {width: 56, height: 1780, depth: 75, ru: 40, mount: rack-side, color: '#0e0e10', airflow: passive, weight-kg: 6.8}
gaps:
- what: body-width
  scope: [front]
  reason: sources-disagree
  note: the bottom view dimensions 56.0 and 75.0 without saying which is the width; FBSP28 gives 2.2 in (55.88) wide and
    2.9 in (73.66) deep, and the strip is drawn 56 wide and 75 deep on that reading.
  wanted: a dimensioned end view of the strip, or a measured unit.
- what: photographs
  scope: [front, rear, top, bottom, left, right]
  reason: needs-photo
  note: no photograph of any face is held, so no colour, finish, printing or plate shape is checked against a photograph.
  wanted: a photograph of each face of the P42G20M.
- what: outlet-pitch
  scope: [front]
  reason: needs-drawing
  note: no dimension of an outlet or a plate on the front view is stated; the positions are read off the drawing at its
    own 1780.0 scale.
  wanted: a dimensioned front view.
- what: outlet-numerals
  scope: [front]
  reason: needs-drawing
  note: 'sheet 1 of P42G20M-XXYZ_DC is a vector page, and `pdftotext -bbox` of it gives no outlet numeral: the only digits
    in its text layer are the sheet zones 1 and 2, the dimension 20 of the 20 A callout and the part-number table, so there
    is no numeral to read and none is drawn. The numbering is column by column from the cord end.'
  wanted: a front view whose outlet numerals are text.
- what: c15-notch
  scope: [front]
  reason: vendor-silent
  note: the 10 A 'C13/C15 COMBO' socket is a C13 outlet with the C15 extension its name states; it presents the C13 key
    and takes a C14 plug, and no C15 plug is registered, so the extension is stated here and not as a key. The drawing dimensions
    neither.
  wanted: a dimensioned drawing of the socket.
- what: cord-end-face
  scope: [bottom]
  reason: needs-drawing
  note: 'no view of either sheet is an end view from the cord end: the sheet''s BOTTOM VIEW is the far end and the other
    views show the cord leaving the strip. The bottom face is the gland alone.'
  wanted: an end view of the cord end.
- what: outlet-count
  scope: [front]
  reason: sources-disagree
  note: FBSP28's row counts 48 outlets, its configuration cells and the drawing add to 42; 42 are drawn and each of the
    drawing's 42 sockets is one outlet.
  wanted: the maker's statement of the count.
- what: rear-marks
  scope: [rear]
  reason: vendor-silent
  note: the rear view's callout 'TOOLESS MOUNTING BUTTON LOCATIONS (12) PL' names twelve button locations; only the two
    dimensioned ones are drawn. The '2X 24.0' and '(4) PL 48.0' dimensions locate marks beside the buttons, and no document
    says what those are.
  wanted: the maker's installation drawing.
- what: side-marks
  scope: [left, right, top]
  reason: vendor-silent
  note: the dot lattices, round marks, ringed marks and L-shaped strokes of the long sides and the far end's lattice are
    drawn from the sheet as unnamed decor and no document names any of them; the outline's small tabs, its edge lines and
    the end view's front flange are not drawn.
  wanted: a photograph of each long side.
- what: breaker-plate-size
  scope: [front]
  reason: needs-drawing
  note: the breaker plates are drawn about 56 along the strip against panduit/g5-breaker-20a's 70.2, which was read for
    the P24B14M; the part is reused, and the plates are placed on their drawn centres, 74 apart.
  wanted: a dimensioned front view.
- what: wordmark-and-legends
  scope: [front]
  reason: needs-photo
  note: the wordmark, the external-ground legend and the legends beside the sockets, other than the breaker legends, are
    not drawn.
  wanted: a photograph of the cord end and the controller.
- what: part-number-variants
  scope: [front, rear]
  reason: vendor-silent
  note: sheet 2 of the drawing lists the plain P42G20M only; the key lists six colours, three cord lengths and a bottom-end-fed
    cord, and note 5 says the views show the top-end-fed cord. The device states the plain part's 3 m cord and 6.8 kg only.
  wanted: an order for each variant that has a held photograph or a dimensioned drawing.
