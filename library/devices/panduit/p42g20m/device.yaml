manufacturer: Panduit
model: P42G20M
description: 'Panduit P42G20M G5 intelligent rack PDU, monitored and switched per outlet, 0U: a 1780 mm strip for a cabinet''s
  vertical channel. It has a fixed 3 m cord ending in an IEC 60309 3P+E 9h 60 A plug, three-phase delta, 200-240 V. It has
  42 outlets in two rows: 21 C13/C15 combination sockets and 21 C13/C15/C19 combination sockets, in six blocks. Each block
  is on a 20 A double-pole breaker across two of the three lines. A controller with a display, indicators, five RJ45 jacks
  and a USB-A port sits between the two halves.'
profile: power
provenance:
  method: {confidence: drawing, note: 'FIGURES FROM THE MAKER''S VECTOR DRAWING. Panduit customer drawing P42G20M-XXYZ_DC
      rev 01A (12/22/2022), two sheets, has a front, rear, left, right and bottom view. Its scale was taken from its own
      1780.0 overall dimension (the 1555.0 between the buttons agrees) and every position was read off renderings of the
      front view at 400 dpi, to about 1 mm across and 3 mm along the strip. The library draws the PDU STANDING, cord end
      down, so a position along the drawing becomes 1780 minus that, and a position across becomes x. No photograph and
      no 3D model of the part is held.'}
  mount: {confidence: drawing, note: '`rack-side`: the strip stands beside a rack''s upright on two mounting buttons on
      its back, 1555.0 apart and 40.5 from the cord end (rear view). The drawing says ''VERTICAL, 0U'' and gives no count
      of units; `ru: 40` is the whole units the 1780 mm length covers (40.04) and is not stated by any document.'}
  chassis: {confidence: drawing, note: 'drawing - 1780.0 long (front view), 56.0 and 75.0 on the bottom view; FBSP28 gives
      2.2 in (55.88) wide and 2.9 in (73.66) deep, which supports 56.0 as the width and 75.0 as the depth, though the drawing
      does not label them (gaps: body-width). Weight 6.8 kg is the sheet-2 table''s only row.'}
  front: {confidence: drawing, note: 'drawing - the front view. From the cord end: a plate with the external ground, three
      breaker plates B1 to B3, three blocks of four columns of two outlets, the controller, three breaker plates B4 to B6,
      and three blocks of three columns, to the far end. Plate and outlet positions are the centres as drawn; the outlet
      pitch is not dimensioned. The column pitch is 37.1, read off the first half, and is kept in the second where the drawing
      reads about 39.'}
  outlets: {confidence: drawing, note: 'drawing - ''(21)C13/C15, (21)C13/C15/C19''; the receptacle block draws each as ONE
      SOCKET named ''C13/C15 COMBO 10A'' and ''C13/C15/C19 COMBO 16A'', so each is one outlet. The upper row of the front
      view is the C13/C15 and the lower row the C13/C15/C19 (x = 4 and 28). FBSP28 counts 48 outlets in its row and lists
      the C21 as well; the drawing''s 21 and 21 are used. The outlets are numbered 1 to 42 column by column from the cord
      end, the upper socket first: THE NUMBERING IS AN ASSUMPTION, the sheet''s text layer holds no outlet numeral (gaps:
      outlet-numerals). THE WAY UP OF EACH SOCKET IS NOT READ: both are drawn unturned.'}
  banks: {confidence: drawing, note: 'drawing - the front view labels the six blocks ''B1 [WHITE]'', ''B2 [LIGHT GRAY]'',
      ''B3 [DARK GRAY]'', ''B4 [WHITE]'', ''B5 [LIGHT GRAY]'', ''B6 [DARK GRAY]'' and the six breaker plates B1 to B6, each
      printing the lines it is across: L1-L2, L2-L3, L3-L1, L1-L2, L2-L3, L3-L1. THAT BLOCK Bk IS FED BY BREAKER Bk IS A
      READING OF THE LABELS: no sentence held says it. The three greys are drawn as #e4e5e7, #9a9da1 and #55585c and are
      estimates of the words: no photograph is held.'}
  colour: {confidence: drawing, note: 'drawing - sheet 2 gives BLACK (RAL 9005) for the plain part number P42G20M, drawn
      here as the RAL''s #0e0e10 on the body. THE PLATE, MOULDING AND SCREW COLOURS ARE NOT CHECKED against any source;
      no photograph is held.'}
  controller: {confidence: drawing, note: 'drawing - the controller plate (''NMC SHOWN IN DEFAULT ORIENTATION'') is drawn
      between the third and fourth breaker plate, about 137 along against the component''s 127.8; the bay is centred on
      it. P42G20M is composed with panduit/g5-controller@1 in a bay because the FBSP28 sheet calls the controller hot swappable.
      Its jacks'' functions are not read.'}
  input: {confidence: drawing, note: 'drawing - ''INPUT PLUG: IEC 60309 3P+E 9H 60A (IP44)'', ''INPUT VOLTAGE: 200-240VAC'',
      ''INPUT CURRENT: 60A (48A DERATED)'', ''INPUT PHASE: THREE-PHASE, DELTA'', ''RATED POWER: 17.3 KVA''. Sheet 2 gives
      the plain part number a 3 m cord. The cord is one part at the cord end; its length and the plug''s face are not drawn.'}
  capability: {confidence: datasheet, note: 'datasheet - the drawing''s unit type is MONITORED & SWITCHED PER OUTLET and
      FBSP28 lists it under the MSPO series, so `metering-scope: outlet` and `outlet-switching: true`, and each outlet declares
      [on, off].'}
  rear: {confidence: drawing, note: 'drawing - the rear view: two buttons 40.5 from the cord end and 1555.0 apart, on the
      strip''s centre line. The callout ''TOOLESS MOUNTING BUTTON LOCATIONS (12) PL'' names twelve button locations and
      only the two dimensioned ones are drawn (gaps: rear-marks).'}
  sides: {confidence: estimated, note: 'ESTIMATED from the vector paths of sheet 1 of P42G20M-XXYZ_DC (3.1801 mm to the
      sheet point, scaled on the 1780.0 overall dimension, which is 559.74 pt between its extension lines). The sheet''s
      LEFT VIEW is the library''s right face and its RIGHT VIEW the library''s left face, because the sheet draws the strip
      standing cord end up; the two views agree on the 62.9 mm line of single marks and on the 48.0 of the four ringed marks
      that the sheet dimensions ''(4) PL 48.0'', which checks the mapping. Drawn as unnamed decor: the dot lattices as rectangles
      of 4.0 mm dots on a 5.0 mm pitch (1662 dots on the right face, 1748 on the left, in 32 and 30 rectangles), the round
      marks 9.3 mm across (single and paired), the four ringed marks 7.8 mm across, the three 4.1 mm dots of the left face
      and the two L-shaped strokes of the right face. Each position is good to about 1 mm. No function is stated for any
      mark. The sheet''s small tabs along the front edge, the edge lines and the cord gland are the strip''s outline and
      are not drawn (gaps: side-marks).'}
  ends: {confidence: estimated, note: 'ESTIMATED from the vector paths - the sheet''s BOTTOM VIEW is the far end, the library''s
      top face: a 10 by 10 lattice of 4.0 mm dots on a 5.0 mm pitch and a 26 mm plate along the rear edge, drawn as unnamed
      decor. No sheet or view shows the cord end as an end view (the cord leaves the strip in the other views), so the bottom
      face is the cord gland alone (gaps: cord-end-face).'}
