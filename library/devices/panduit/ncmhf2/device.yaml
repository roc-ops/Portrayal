format: 1
kind: device
name: ncmhf2
version: 0.1.0
maturity: modelled
manufacturer: Panduit
model: NCMHF2
description: >-
  2RU front-only horizontal cable manager, Panduit NetManager NCMHF2: a polycarbonate moulding
  on the rack rails with a channel 82 mm deep standing out of its front, a wall of twelve
  fingers along its top and another along its bottom, and a hinged cover across the finger tips
  that ships fitted. Two windows in the plate behind the channel pass cable to the back of the
  rack. The single-sided 3.7 in sibling of the NCMH2.
profile: passive
provenance:
  ears:
    confidence: drawing
    note: >-
      drawing - `positions` states where the ears bolt, for the Rack Builder. The NCMHF2 drawing
      (Panduit 00787-10) dimensions the plan "3.74 REF [95.10]" overall and the front section "3.24
      REF [82.40]"; the NCMH2 drawing's front section is 82.27, and the two manager share one
      front moulding, so `at` is 82.27 as on the NCMH2 and the plate and flange are the 12.83 behind.
      This states a placement; the 0.13 between the two drawings is taken as drawing error.
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the part is 95.1 deep and 82.27 of it stands in front of the rails, so
      the rear face of its rack units stays free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S OWN DRAWING, read as the NCMH2's are (see ncmh2): the NCMHF2 customer
      drawing (PDF 00787-10), the NetManager Horizontal Cable Managers specification sheet RKSP225
      and the Cable Capacity Calculator. The parts are the NCMH2's front moulding.
  chassis:
    confidence: drawing
    note: >-
      drawing - 444.83 x 88.14 x 95.1. The NCMHF2 drawing dimensions 482.59 [19.00 in] over the
      ears, 465.07 [18.31 in] between the fixing holes, 88.14 [3.47 in] high, 444.83 [17.51 in]
      across the body between the ears and 95.10 [3.74 in] deep (RKSP225 says 95.3). The ears are
      not drawn.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW CHANNEL, NOT A BOX (see ncmh2): the plate on the front view as a well 82.27
      deep with two open windows, the two walls of fingers standing in it, the cover across their
      tips and the back of the plate standing 12.83 proud of the rear face.
  thickness:
    confidence: estimated
    note: >-
      estimated - no Panduit document states a wall gauge for the polycarbonate moulding. 2.5 is a
      moulded wall of this size; the parts carry their own thicknesses.
  weight:
    confidence: drawing
    note: >-
      drawing - 381.02 g [0.84 lb], the weight table of the NCMHF2 customer drawing (00787-10).
  front:
    confidence: drawing
    note: >-
      drawing - the front with the hinged cover fitted, as the NCMH2's: the NCMHF2 drawing's front
      view shows the cover removed, the two rows of twelve arched fingers and the two windows.
  rear:
    confidence: drawing
    note: >-
      drawing - the back of the plate with its two windows, from the front view, which draws them
      through the channel; five plates round them, sunk 0.05 inside the rear face. The windows are
      open.
  top:
    confidence: drawing
    note: >-
      drawing - the plan view, rear at y=0: the plate and flange 12.83 deep, then the twelve fingers
      70 mm long. Read at 300 dpi; the fingers' lengths are estimated.
  bottom:
    confidence: drawing
    note: >-
      drawing - the front view draws the same finger arches along the bottom as along the top; the
      bottom is the top again.
  left:
    confidence: estimated
    note: >-
      estimated - no side view is drawn; built from the plan view and the front view.
  right:
    confidence: estimated
    note: >-
      estimated - the left view turned round.
  guides:
    confidence: drawing
    note: >-
      drawing - the duct is the channel between the two finger rows, run across the rack, pitch
      34.925 and gap 9.5 as on the NCMH2.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - Panduit's Cable Capacity Calculator (V14) gives the NCMHF2's front usable area as 6
      sq in and, for its entered cable (0.185 in, 4.70 mm, Cat 6A 28 AWG) at the 30 per cent
      recommended fill, 66 (111 at the 50 per cent maximum).
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material, colour, standards and what is in the box are the NCMHF2 product page
      and the specification sheet (RKSP225); the screws are the drawing's note 2.
  color:
    confidence: estimated
    note: >-
      estimated - "The manager is black" on the product page. Every image Panduit publishes of the
      part is a render; the cover is drawn a shade lighter than the moulding.
attrs:
  physical:
    weight-kg: 0.381
    material: polycarbonate
    cover-material: polycarbonate
    color: Black
    mounting-hardware: 'four 12-24 x 1 in screws'
  performance:
    cable-capacity: 66
    cable-capacity-basis: >-
      front channel: 0.185 in (4.70 mm, Cat 6A 28 AWG) cable at the 30% recommended fill of its
      6 sq in usable area; 111 at the 50% maximum fill - Panduit Cable Capacity Calculator V14
  features:
    bend-radius-front: '1/2 in (12.7 mm) at the front fingers, transitions and pass-throughs'
    finger-spacing: '3/8 in (9.5 mm)'
    standards: 'RoHS Compliant, UL 2416, CSA C22.2'
chassis:
  width: 444.83
  height: 88.14
  depth: 95.1
  ru: 2
  full-depth: false
  ears:
    positions:
      - {name: proud, at: 82.27, default: true}
  shell: sheet
  thickness: 2.5
  weight-kg: 0.381
  color: '#2a2c2e'
gaps:
  - what: cover-hinge
    scope: [front]
    reason: vendor-silent
    note: >-
      the specification sheet says the hinged front cover opens 180 degrees up or down; no view
      draws a hinge, and the cover is drawn as one fitted plate that is either on or off.
    wanted: a drawing or a close render of the cover's hinge
  - what: cover-section
    scope: [top, left, right]
    reason: needs-drawing
    note: >-
      no view sections the cover or the fingers: their thickness is estimated and the elevations
      draw the body without the cover's edge.
    wanted: a section through a cover and a finger tip
