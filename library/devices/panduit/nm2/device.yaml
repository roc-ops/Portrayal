format: 1
kind: device
name: nm2
version: 0.1.1
maturity: modelled
manufacturer: Panduit
model: NM2
aliases:
  - {name: NM2WH, kind: vendor}
description: >-
  2RU front-and-rear horizontal cable manager, Panduit NetManager High Capacity NM2: an ABS
  moulding on the rack rails with a channel 140 mm deep standing out of its front, a wall of
  twelve T-shaped inset fingers along its top and another along its bottom, and a rear channel
  175 mm deep behind the plate with five open D-rings. A hinged PVC cover across each channel
  ships fitted. Two windows in the plate pass cable from the front channel to the rear one.
profile: passive
provenance:
  ears:
    confidence: drawing
    note: >-
      drawing - `positions` states where the ears bolt, for the Rack Builder. The NM2 customer
      drawing (Panduit 10404-20) dimensions the front channel "5.5 REF [140]" from the front of
      the cover to the end of the finger zone and the whole manager "13.1 REF [332]"; the NMF2's
      "6.2 REF [157]" puts the plate and flange 17.3 behind the channel, and the rear channel is
      the 175 behind that. `at` is 139.7, so the ears bolt to the front face of the plate. This
      states a placement; no dimension changed.
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the part is 332 deep with 139.7 of it in front of the rails and 192.3
      behind them; it does not reach the rear rails of a rack 600 mm deep or more, so the rear face
      of its rack units stays free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S OWN DOCUMENTS. Panduit publishes the NM2 as a customer drawing (PDF
      10404-20, with a DXF and a DWG that hold only a trimetric projection of the model, not
      orthographic views, so they give no measurement), the NetManager High Capacity specification
      sheet RKSP237, a product page, the Space-Saving bulletin RKCB46 and the Cable Capacity
      Calculator. The customer drawing's front view and plan are read at 300 dpi against its own
      482 [19.0 in] dimension. THE FIGURES THE DRAWING DIMENSIONS ARE `drawing`; EVERYTHING READ OFF
      THE PICTURE (the finger and ring counts and pitch, the crossbar, the windows) IS ESTIMATED and
      said so in the part that carries it.
  chassis:
    confidence: estimated
    note: >-
      estimated - 444.83 x 88 x 332. The drawing dimensions 482 [19.0 in] over the ears, 465 [18.3 in]
      between the fixing holes, 88 [3.5 in] high and 332 [13.1 in] deep; the body between the ears is
      the NCMH2 drawing's 444.83 [17.51 in] for the same moulding, which the NM2 drawing does not
      give. The ears are not drawn.
  shell:
    confidence: drawing
    note: >-
      drawing - TWO HOLLOW CHANNELS BACK TO BACK, NOT A BOX. The body is a sheet body
      (docs/cable-managers-design.md section 4) and its six views are elevations. The solid is what
      its parts build: the plate on the front view as a well 139.7 deep with the two fingers walls
      and the cover in it; on the rear view the plate's back as a well 175 deep with the five D-rings
      and the rear cover in it; both floors open at the two windows.
  thickness:
    confidence: estimated
    note: >-
      estimated - no Panduit document states a wall gauge for the ABS moulding. 2.5 is a
      moulded wall of this size; the parts carry their own thicknesses.
  weight:
    confidence: drawing
    note: >-
      drawing - 1134 g [2.5 lb], the weight table of the NM2 customer drawing (10404-20).
  front:
    confidence: drawing
    note: >-
      drawing - the front with the cover fitted: the cover, and under it the two rows of T fingers
      end-on, the channel between them and the two windows in the plate at the back of it. The `duct`
      guide is the channel between the finger rows, 68 high (the 88 less two 10 mm rows, estimated).
  rear:
    confidence: estimated
    note: >-
      estimated - the rear channel from behind: the rear cover, and under it the five D-rings
      standing out of the plate's back, 107 apart with the middle one on the centre line, each a loop
      with a hook at the far end. The plan view draws the five posts; their cross section is not
      drawn (see `gaps:`). The two windows are open in its floor.
  top:
    confidence: drawing
    note: >-
      drawing - the plan view, rear at y=0: the five posts 175 long, the plate and flange 17.3
      deep, then the front channel's twelve stems 100 mm long with a crossbar on each tip. Read at
      300 dpi; the stem and crossbar sizes are estimated.
  bottom:
    confidence: drawing
    note: >-
      drawing - the front view draws the same finger tips along the bottom as along the top; the
      bottom is the top again.
  left:
    confidence: estimated
    note: >-
      estimated - no side view is drawn. The end of the manager is the rear loops' top and bottom
      bars and hook, the plate, and the front finger rows' walls, built from the plan view and the
      front view.
  right:
    confidence: estimated
    note: >-
      estimated - the left view turned round.
  guides:
    confidence: estimated
    note: >-
      estimated - the front duct is the channel between the two finger rows, run across the rack,
      pitch 34.925 and gap 5.4 as on the NMF2; each rear ring's opening is the rear usable area
      Panduit's calculator gives (11.1 sq in) divided by the 68 clear height.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - the Cable Capacity Charts of the Space-Saving bulletin (RKCB46) give the NM2 per
      cable at the 30 per cent recommended fill and the 50 per cent maximum, the front and the rear
      separately; the figures stated are the Cat 6 24 AWG 0.235 in (5.97 mm) column at 30 per
      cent: 67 front (112 at 50 per cent) and 76 rear (127). The Cable Capacity Calculator gives the
      usable areas, 9.8 and 11.1 sq in. The bulletin notes the rear section may be partially blocked
      by rack posts.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material, colour, standards and what is in the box are the NM2 product page and
      the specification sheet (RKSP237); the temperatures are the customer drawing's.
  color:
    confidence: estimated
    note: >-
      estimated - "The manager is black" on the product page. Every image Panduit publishes of the
      part is a render; the covers are drawn a shade lighter than the moulding.
attrs:
  physical:
    weight-kg: 1.134
    material: ABS
    cover-material: PVC
    color: Black
    mounting-hardware: '#12-24 mounting screws, as shipped with the covers'
  performance:
    cable-capacity: 67
    cable-capacity-basis: >-
      front channel: Cat 6 24 AWG, 0.235 in (5.97 mm), at the 30% recommended fill of its 9.8 sq in
      usable area; 112 at the 50% maximum fill - Panduit Space-Saving Cable Management Rack
      Systems bulletin RKCB46, Cable Capacity Charts
    cable-capacity-media: cat6
    cable-capacity-rear: 76
    cable-capacity-rear-basis: >-
      rear channel: Cat 6 24 AWG, 0.235 in (5.97 mm), at the 30% recommended fill of its 11.1 sq in
      usable area; 127 at the 50% maximum fill - the same bulletin, which notes the rear section
      may be partially blocked by rack posts
  environmental:
    operating-temp: '60 C maximum'
    storage-temp: '65 C maximum'
  compliance:
    rohs: RoHS Compliant
    ul: UL 2416
    csa: CSA C22.2
chassis:
  width: 444.83
  height: 88.0
  depth: 332.0
  ru: 2
  full-depth: false
  ears:
    positions:
      - {name: proud, at: 139.7, default: true}
  shell: sheet
  thickness: 2.5
  weight-kg: 1.134
  color: '#2a2c2e'
gaps:
  - what: cover-hinge
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the specification sheet says the dual hinged covers open 110 degrees to the top or bottom
      without being removed; no view draws a hinge. Each cover carries five stand-in hinge knuckles on
      its top edge and on its bottom edge (their count, size and place are estimated) and is drawn as
      one fitted plate that is either on or off.
    wanted: a drawing or a close render of a cover's hinge
  - what: ring-section
    scope: [rear, top, left, right]
    reason: needs-drawing
    note: >-
      the plan view draws the five rear posts but no view draws the loop they belong to: the bars'
      thickness and the hook's extent are estimated, and so is the ring's opening, from the usable
      area the calculator states.
    wanted: a side view or a section through the rear channel
  - what: blanking-panel
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the NM2B front-to-rear pass-through blanking panel is a separate accessory (V10404BT-DC) that
      closes the two windows; it is not drawn and the windows are open.
    wanted: a drawing of the blanking panel fitted
  - what: cover-section
    scope: [top, left, right]
    reason: needs-drawing
    note: >-
      no view sections the covers or the fingers: their thickness is estimated and the elevations
      draw the body without the covers' edges.
    wanted: a section through a cover and a finger tip
