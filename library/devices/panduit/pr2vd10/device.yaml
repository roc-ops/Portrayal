gaps:
  - what: door-hinge
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the doors are "dual-hinging" and open to the left or the right on hinge pins; no view draws a
      hinge, and each door is drawn as one fitted plate that is either on or off.
    wanted: a drawing or a close render of a door's hinge and latch
  - what: finger-shape
    scope: [front, rear, top, bottom, left, right]
    reason: needs-drawing
    note: >-
      the front view draws each finger as a loop; it is built as a solid block 30 across and 33 high,
      and its length (260 front, 175 rear) is estimated from the calculator's channel areas.
    wanted: a section through a finger and the backbone
  - what: free-standing-base
    scope: [front, rear, left, right]
    reason: vendor-silent
    note: >-
      the drawing's "free standing base", the integrated door brackets and the stand-off from a rack
      are not drawn or dimensioned.
    wanted: a drawing of the base and its fixing to a rack
  - what: dxf-geometry
    scope: [front, rear, top, bottom, left, right]
    reason: needs-hardware
    note: >-
      the maker's PR2VD DXF (68 MB) and DWG were not read: the figures here come from the PDF drawing's
      table and views.
    wanted: the DXF read for the finger, hole and door measurements
