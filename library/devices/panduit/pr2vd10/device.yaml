format: 1
kind: device
name: pr2vd10
version: 0.1.0
maturity: modelled
manufacturer: Panduit
model: PR2VD10
aliases:
  - {name: PR2VD10WH, kind: vendor}
description: >-
  45RU dual-sided vertical cable manager, 10 in wide, Panduit PatchRunner 2 PR2VD10: a steel
  backbone with a column of 45 inset ABS fingers down each side of its front channel and of its
  rear channel, one finger to each rack unit, four 3.0 in round pass-through holes through the
  backbone, and a full-length dual-hinging push-to-close steel door on the front and another on the
  rear that ship fitted. It stands on a free-standing base beside a rack and takes no rack unit.
profile: passive
provenance:
  mount:
    confidence: drawing
    note: >-
      drawing - `rack-side`, as the FS vertical ducts and the PR2VD08: the PR2VD drawing (Panduit
      14V455LV-DC) draws a "free standing base" and "integrated door brackets". It occupies no rack
      unit; `ru: 45` is the height it runs beside (the 83.88 in of the table is a 7 ft, 45 RU manager).
      Which side of the rack is a lab placement to say (docs/vertical-cable-managers-design.md).
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S OWN DOCUMENTS, read as the PR2VD08's are (see pr2vd08): the PR2VD**
      customer drawing (PDF 14V455LV-DC, with a 68 MB DXF and a DWG that were not read), the
      PatchRunner 2 Vertical Cable Managers specification sheet RKSP172, the product page, the
      Space-Saving bulletin RKCB46 and the Cable Capacity Calculator. THE FIGURES THE TABLE GIVES ARE
      `drawing`; EVERYTHING READ OFF THE PICTURES (the split of the depth between the channels, the
      finger's size, the holes' places) IS ESTIMATED and said so in the part that carries it.
  chassis:
    confidence: drawing
    note: >-
      drawing - 254.0 x 2130.4 x 526.4, covers fitted: the PR2VD table's A 10.00 in [254.0], B 83.88
      in [2130.4] and C 20.7 in [526.4] for the PR2VD10; the product page gives the same. The
      Space-Saving bulletin states 10.0 x 84.0 x 20.6 in (254 x 2130 x 523 mm).
  depth:
    confidence: estimated
    note: >-
      estimated - the 526.4 is overall. It is drawn as a 303 front channel, a 20.4 backbone and a 203 rear
      channel (see pr2vd08): the plan view puts the backbone about 41 per cent of the way from the
      back, and the calculator's areas for the PR2VD10 (82.31 and 52.21 sq in) are in the ratio 1.6:1.
  shell:
    confidence: drawing
    note: >-
      drawing - TWO HOLLOW CHANNELS BACK TO BACK, NOT A BOX (see pr2vd08): the backbone as a well 303
      deep on the front view and 203 deep on the rear view, each with its fingers and door; both
      floors open at the four 3.0 in holes.
  thickness:
    confidence: estimated
    note: >-
      estimated - no Panduit document states the steel's gauge. 1.5 is a sheet of this kind; the parts
      carry their own thicknesses.
  weight:
    confidence: drawing
    note: >-
      drawing - 27.7 kg [61.15 lb], the manager and doors unpacked, the weight column of the PR2VD
      table; 28.6 kg [63.15 lb] shipped.
  front:
    confidence: drawing
    note: >-
      drawing - the front with the door fitted: the door, and under it the backbone with 45 fingers a
      side in three sections of 15 and the four holes. The `duct` guide is the channel between the
      finger columns, run down the height: 224.8 across, the 10 in less the 29.2 the calculator's front
      area per inch of width (9.3 sq in) leaves, ESTIMATED.
  rear:
    confidence: drawing
    note: >-
      drawing - the rear with the door fitted, as the front: the PR2VD drawing is titled "front and
      rear fingers and doors". The `duct` is 212.8 across, the 10 in less the 41.2 that the
      calculator's rear area per inch of width (6.23 sq in) leaves, ESTIMATED.
  top:
    confidence: estimated
    note: >-
      estimated - the plan, rear at y=0: the rear fingers, the backbone and the front fingers, built
      from the plan view of the drawing and the finger lengths above.
  bottom:
    confidence: estimated
    note: >-
      estimated - the top view again: the two ends of the manager are alike.
  left:
    confidence: estimated
    note: >-
      estimated - no side view of the manager without its doors is dimensioned: the backbone, and the
      two finger zones along it, built from the plan view and the finger columns' extent.
  right:
    confidence: estimated
    note: >-
      estimated - the left view turned round.
  guides:
    confidence: estimated
    note: >-
      estimated - each duct is the channel between the two finger columns of its face, run down the
      height (`run: y`), with the rack unit's 44.45 pitch and the 11.45 left between 33 mm fingers.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - the Cable Capacity Charts of the Space-Saving bulletin (RKCB46) give the PR2VD10 per
      cable at the 30 per cent recommended fill and the 50 per cent maximum, the front and the rear
      separately; the figures stated are the Cat 6 24 AWG 0.235 in (5.97 mm) column at 30 per cent:
      569 front (948 at 50 per cent) and 361 rear (601). The Cable Capacity Calculator gives the usable
      areas, 82.31 and 52.21 sq in. The bulletin notes that slack spools reduce the capacity.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material, colour, standards and what is in the box are the PR2VD10 product page
      and the specification sheet (RKSP172); the materials are the drawing's.
  color:
    confidence: estimated
    note: >-
      estimated - "The manager is black" on the product page. Every image Panduit publishes of the
      part is a render; the doors are drawn a shade lighter than the backbone.
attrs:
  physical:
    weight-kg: 27.74
    material: steel
    finger-material: ABS
    cover-material: steel doors with ABS ends and knobs
    color: Black
    mounting-hardware: 'hardware kit, as shipped'
  performance:
    cable-capacity: 569
    cable-capacity-basis: >-
      front channel: Cat 6 24 AWG, 0.235 in (5.97 mm), at the 30% recommended fill of its 82.31 sq in
      usable area; 948 at the 50% maximum fill - Panduit Space-Saving Cable Management Rack Systems
      bulletin RKCB46, Cable Capacity Charts
    cable-capacity-media: cat6
    cable-capacity-rear: 361
    cable-capacity-rear-basis: >-
      rear channel: Cat 6 24 AWG, 0.235 in (5.97 mm), at the 30% recommended fill of its 52.21 sq in
      usable area; 601 at the 50% maximum fill - the same bulletin
  compliance:
    rohs: RoHS Compliant
    ul: UL 2416
    csa: CSA C22.2
