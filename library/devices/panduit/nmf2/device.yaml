format: 1
kind: device
name: nmf2
version: 0.1.1
maturity: modelled
manufacturer: Panduit
model: NMF2
aliases:
  - {name: NMF2WH, kind: vendor}
description: >-
  2RU front-only horizontal cable manager, Panduit NetManager High Capacity NMF2: an ABS
  moulding on the rack rails with a channel 140 mm deep standing out of its front, a wall of
  twelve T-shaped inset fingers along its top and another along its bottom, and a hinged PVC
  cover across the finger tips that ships fitted. Two windows in the plate behind the channel
  pass cable to the back of the rack.
profile: passive
provenance:
  ears:
    confidence: drawing
    note: >-
      drawing - `positions` states where the ears bolt, for the Rack Builder. The NMF2 customer
      drawing (Panduit 10404-16) dimensions the channel "5.5 REF [140]" from the front of
      the cover to the end of the finger zone and the whole manager "6.2 REF [157]"; the
      mounting plate and its flange are the 17.3 behind. `at` is 139.7, so the ears bolt to the
      front face of the plate. This states a placement; no dimension changed.
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the part is 157 deep and 139.7 of it stands in front of the rails, so
      the rear face of its rack units stays free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S OWN DOCUMENTS. Panduit publishes the NMF2 as a customer drawing
      (PDF 10404-16, with a DXF and a DWG that hold only a trimetric projection of the model,
      not orthographic views, so they give no measurement), the NetManager High Capacity
      specification sheet RKSP237, a product page and the Cable Capacity Calculator. The
      customer drawing's plan view is a vector drawing read at 300 dpi against its own 482
      [19.0 in] dimension; the front view gives the windows. THE FIGURES THE DRAWING
      DIMENSIONS ARE `drawing`; EVERYTHING READ OFF THE PICTURE (the finger count and
      pitch, the crossbar, the windows) IS ESTIMATED and said so in the part that carries it.
  chassis:
    confidence: estimated
    note: >-
      estimated - 444.83 x 88 x 157. The drawing dimensions 482 [19.0 in] over the ears, 465 [18.3 in]
      between the fixing holes, 88 [3.5 in] high and 157 [6.2 in] deep; the body between the
      ears is the 444.83 [17.51 in] that the NCMH2 drawing (00787-07) dimensions for the same
      moulding, which the NMF2 drawing does not, so the width is estimated by that likeness. The
      ears are not drawn.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW CHANNEL, NOT A BOX, as the FS finger ducts are built. The body is a
      sheet body (docs/cable-managers-design.md section 4) and its six views are elevations.
      The solid is what its parts build: the plate on the front view as a well 139.7 deep, whose
      floor is open at the two windows; the two walls of fingers standing in it; the cover in
      it across the finger tips, which opens and uncovers the channel; and the back of the
      plate standing 17.3 proud of the rear face.
  thickness:
    confidence: estimated
    note: >-
      estimated - no Panduit document states a wall gauge for the ABS moulding. 2.5 is a
      moulded wall of this size; the parts carry their own thicknesses.
  weight:
    confidence: drawing
    note: >-
      drawing - 730 g [1.6 lb], the weight table of the NMF2 customer drawing (10404-16).
  front:
    confidence: drawing
    note: >-
      drawing - the front with the cover fitted: the cover, and under it the two rows of T
      fingers end-on, the channel between them, and the two windows in the plate at the back of
      it. The `duct` guide is the channel between the finger rows. Its height is the 88 less
      the two 10 mm rows, 68, estimated; its depth is not drawn (Panduit's calculator gives
      the usable area, 9.8 sq in, which is 93 mm over that height).
  rear:
    confidence: drawing
    note: >-
      drawing - the back of the plate with its two windows, from the front view of the NMF2
      drawing, which draws them through the channel; five plates round them, sunk 0.05 inside
      the rear face so the plate closes the well within the 157 mm envelope. The windows are open: no
      Panduit document fits a cover to them except the blanking panel NM2B, which is sold
      separately (see `gaps:`).
  top:
    confidence: drawing
    note: >-
      drawing - the plan view, rear at y=0: the plate and flange 17.3 deep behind the ear
      plane, twelve stems 100 mm long with a crossbar on each tip, and the cover over the
      front 12.6 mm. Read at 300 dpi; the stem and crossbar sizes are estimated.
  bottom:
    confidence: drawing
    note: >-
      drawing - the front view draws the same finger tips along the bottom as along the top;
      the bottom is the top again.
  left:
    confidence: estimated
    note: >-
      estimated - no side view is drawn. The end of the manager is the plate, the two finger
      rows' walls and the cover's edge, built from the plan view and the front view.
  right:
    confidence: estimated
    note: >-
      estimated - the left view turned round.
  guides:
    confidence: estimated
    note: >-
      estimated - the duct is the channel between the two finger rows, run across the rack;
      its finger pitch is the 34.925 [1.375 in] that the NCMH2's finger and spacing add up to
      (25.4 + 9.5, its specification sheet RKSP225) and that the NetManager plan views
      measure at 34.7 to 34.9. The gap, 5.4, is the slot between two crossbar tips, read off
      the plan.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - the Cable Capacity Charts of Panduit's Space-Saving Cable Management Rack
      Systems bulletin (RKCB46) give the NMF2 per cable at the 30 per cent recommended fill
      and the 50 per cent maximum; the figure stated is the Cat 6 24 AWG 0.235 in (5.97 mm) column
      at 30 per cent, 67 (112 at 50 per cent), the cable the FS managers state theirs in. The
      Cable Capacity Calculator gives the usable area, 9.8 sq in.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material, colour, standards and what is in the box are the NMF2 product page
      and the specification sheet (RKSP237); the temperatures are the customer drawing's.
  color:
    confidence: estimated
    note: >-
      estimated - "The manager is black" on the product page. Every image Panduit publishes of the
      part is a render; the cover is drawn a shade lighter than the moulding.
attrs:
  physical:
    weight-kg: 0.73
    material: ABS
    cover-material: PVC
    color: Black
    mounting-hardware: '#12-24 mounting screws, as shipped with the cover'
  performance:
    cable-capacity: 67
    cable-capacity-basis: >-
      Cat 6 24 AWG, 0.235 in (5.97 mm), at the 30% recommended fill of the front channel's
      9.8 sq in usable area; 112 at the 50% maximum fill - Panduit Space-Saving Cable
      Management Rack Systems bulletin RKCB46, Cable Capacity Charts
    cable-capacity-media: cat6
  environmental:
    operating-temp: '60 C maximum'
    storage-temp: '65 C maximum'
  compliance:
    rohs: RoHS Compliant
    ul: UL 2416
    csa: CSA C22.2
chassis:
  width: 444.83
  height: 88.0
  depth: 157.0
  ru: 2
  full-depth: false
  ears:
    positions:
      - {name: proud, at: 139.7, default: true}
  shell: sheet
  thickness: 2.5
  weight-kg: 0.73
  color: '#2a2c2e'
gaps:
  - what: cover-hinge
    scope: [front]
    reason: vendor-silent
    note: >-
      the specification sheet says the dual hinged cover opens 110 degrees to the top or bottom
      without being removed; no view draws a hinge. The cover carries five stand-in hinge knuckles on
      its top edge and on its bottom edge (their count, size and place are estimated) and is drawn as
      one fitted plate that is either on or off.
    wanted: a drawing or a close render of the cover's hinge
  - what: blanking-panel
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the NM2B front-to-rear pass-through blanking panel is a separate accessory
      (V10404BT-DC) that closes the two windows; it is not drawn and the windows are open.
    wanted: a drawing of the blanking panel fitted
  - what: cover-section
    scope: [top, left, right]
    reason: needs-drawing
    note: >-
      no view sections the cover or the fingers: the cover's plate and lips and the stems and
      crossbars are drawn from the plan view's outline, with their thickness estimated, and the
      elevations draw the body without the cover's edge.
    wanted: a section through a cover and a finger tip
