format: 1
kind: device
name: p24b32m
version: 0.1.0
maturity: modelled
manufacturer: Panduit
model: P24B32M
description: >-
  Panduit P24B32M basic rack PDU, 0U half: a 915 mm strip for a cabinet's vertical channel. It has a fixed 3 m
  cord ending in an IEC 60309 3P+E 9h 60 A plug, three-phase delta, 200-240 V. It has 24 outlets, 18 IEC C13 and
  6 IEC C19, in six banks of four. Each bank is on a 20 A double-pole breaker across two of the three lines.
  It has no display, no network jack and no metering.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S VECTOR DRAWING. Panduit customer drawing P24B32M_DC rev 01B (08/21/2017) is a vector
      sheet drawn to no stated scale, with a front, rear, top (long side) and side (cord) view. Its scale was taken from
      its own 915.0 overall dimension, which is 449.3 pt, so 2.037 mm to the point, and the 622.0 between the buttons
      agrees at 2.031. Positions were read off renderings of the front, rear and top views at 300 and 400 dpi and off
      the vector paths, to about 1 mm across and 3 mm along the strip. The library draws the PDU STANDING, cord end
      down, so a position along the drawing becomes 915 minus that. A position across becomes x. No photograph and no 3D
      model of the part is held.
  mount:
    confidence: drawing
    note: >-
      `rack-side`: the strip stands beside a rack's upright on two mounting buttons, 137.6 from the cord end and 622.0
      apart (top view). The drawing says 'VERTICAL, 0U HALF, 2-SIDED' and gives no count of units. The maker's page says
      0U MID, and the drawing is used for the part's own record. `ru: 20` is the whole units the 915 mm length covers (20.6) and is not stated by any document.
  chassis:
    confidence: drawing
    note: >-
      drawing - 915.0 long and 112.0 deep (top view), and the SIDE VIEW prints 52.0 [2.05"] beside the body, at the lower
      right of the sheet. The width is 52.0, dimensioned. The maker's page prints 52 mm and agrees. The sheet PUSP26 (page 3)
      gives 2.0 in (50.8) for the 0U MID, HALF and FULL forms, which is the family's nominal figure and not this part's width.
      Weight 9.6 kg is the drawing's.
  front:
    confidence: drawing
    note: >-
      drawing - the front view. From the cord end: a plate with the maker's wordmark, then six C19 sockets and three
      mouldings of six C13 sockets in the order C19, moulding, C19, C19, moulding, C19, C19, moulding, C19. Each moulding
      is a staggered arrangement of three columns and two rows. The outlet positions are read from the front view
      and the outlet pitch is not dimensioned. Recounted from the page twice: 6 C19 and 18 C13.
  outlets:
    confidence: drawing
    note: >-
      drawing - 'OUTLET QTY&TYPE: (18) C13, (6) C19' and the receptacle block, 'IEC 60320/C19 16 A' and 'IEC 60320/C13 10 A'.
      The maker's page heading says (12)C13, (12)C19 and its own table says (18)C13, (6)C19; the drawing and the table are used.
      Each outlet is std/c13-outlet@1 or std/c19-outlet@1, unturned for the C19 sockets of the odd banks and turned a half
      turn for the even banks, as the lamp windows sit on the outer side. THE DRAWN OUTLET SYMBOLS ARE SMALLER THAN THE
      REGISTRY'S WELLS, so the drawn centres are an estimate (gaps: outlet-pitch). The outlets are numbered 1 to 24 along
      the strip from the cord end. THE NUMBERING IS AN ASSUMPTION.
  banks:
    confidence: drawing
    note: >-
      drawing - the front view labels six spans B1 to B6 with [DARK GRAY], [DARK GRAY], [LIGHT GRAY], [LIGHT GRAY], [WIHTE]
      and [WIHTE]. The drawing spells the last two WIHTE, and they are drawn white. A span is one C19 and half a moulding. The rear
      view labels the six breaker plates B1 to B6, each with its line legend. THAT SPAN Bk IS FED BY BREAKER Bk IS A READING
      OF THE LABELS. The three greys are drawn as #55585c, #9a9da1 and #e4e5e7 and are estimates of the words.
  colour:
    confidence: estimated
    note: >-
      estimated - the title block says MATERIAL/COLOR: N/A and the maker's page states no colour, so the body is drawn a
      dark neutral. THE PLATE, MOULDING, SCREW AND LAMP-WINDOW COLOURS ARE NOT CHECKED against any source. No photograph is held.
  lamps:
    confidence: drawing
    note: >-
      drawing - paired small windows sit beside each outlet: three above and three below each moulding, and two beside each C19.
      They are drawn as dark decor. No document gives their purpose or colour.
  input:
    confidence: drawing
    note: >-
      drawing - 'INPUT PLUG: IEC 60309 3P+E 9H 60A', 'INPUT VOLTAGE: 200-240VAC, DELTA', 'INPUT CURRENT: 60A (48A DERATED)',
      'RATED POWER: 17.3kVA'. The title block says the cord is 3m [10'] and the callout says 2921-3302 [115.0'-130.0'];
      both are stated. A kW figure (note 5) and the kVA figure differ in unit and are not reconciled.
  capability:
    confidence: datasheet
    note: >-
      datasheet - the drawing's unit type is BASIC and the 'Basic Power Distribution Units (PDUs)' sheet lists no
      metering or switching for the basic line, so `metering-scope: none` and `outlet-switching: false`.
  rear:
    confidence: drawing
    note: >-
      drawing - the rear view: six breaker plates B1 to B6, each with four crosshair screws, a vertical line legend and a rocker,
      and the earth screw with its symbol near the cord end. The plate is drawn about 58.6 along by 39 across and the part
      is 70.2 by 46.6 (gaps: breaker-plate-size). The plate's vertical legend and crosshair screws differ from the part (gaps: breaker-plate-design).
  sides:
    confidence: estimated
    note: >-
      ESTIMATED from the vector paths of the sheet's TOP VIEW, the view above the front view, which is the library's left
      face by the same unfold the P42G20M's sheet uses. The face is 112 deep: a 36 mm band with a field of 101 square
      dots and a lower band of 76 mm that carries the two buttons. The dots are 0.9 pt, 1.83 mm, on an 8.0 mm pitch,
      in 4 rows of 26 with three missing in the first row. Counted twice, by bounding box and by distinct centres. Also drawn: four
      screws 6.5 across, three 6.9 across, and two small marks 5.5 across beside the buttons. The sheet shows no other
      long side. The right face is built as the documented side, as no document shows this one, without the buttons.
  ends:
    confidence: drawing
    note: >-
      drawing - the cord end carries the gland and cord. The far end is a plain closed line. The cord end is drawn as the gland alone.
