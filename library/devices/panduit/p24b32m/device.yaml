  physical: {length-mm: 915, weight-kg: 9.6}
  power: {input-ac: 'three-phase delta, 200-240 V, 60 A (48 A derated), 17.3 kVA (drawing note 1)', input-plug: other,
    input-cord: fixed, input-phase: three, input-wiring: delta, input-current-a: 48, plug-rating-a: 60, breakers: six
      20 A double-pole electromechanical switches and breakers}
  management: {metering-scope: none, outlet-switching: false}
chassis: {width: 52, height: 915, depth: 112, ru: 20, mount: rack-side, color: '#232528', airflow: passive, weight-kg: 9.6}
gaps:
- what: photographs
  scope: [front, rear, top, bottom, left, right]
  reason: needs-photo
  note: no photograph of any face is held, so no colour, finish, printing or plate shape is checked against a photograph.
  wanted: a photograph of each face of the P24B32M.
- what: outlet-pitch
  scope: [front]
  reason: needs-drawing
  note: >-
    no dimension of an outlet, a lamp window or a plate on the front view is stated; the positions are read off the
    drawing at its own 915.0 scale. The drawn symbols are smaller than the registry's wells.
  wanted: a dimensioned front view.
- what: breaker-plate-size
  scope: [rear]
  reason: needs-drawing
  note: >-
    the plates are drawn about 58.6 along the strip and 39 across against panduit/g5-breaker-20a's 70.2 by 46.6, which was
    read for the P24B14M. The part is reused and placed on the drawn centres.
  wanted: a dimensioned rear view.
- what: breaker-plate-design
  scope: [rear]
  reason: vendor-silent
  note: >-
    the rear plates carry a vertical line legend and four crosshair screws, and the part draws the legend and screws of
    the P24B14M's front plates. No held page dimensions the rear plate.
  wanted: a dimensioned drawing of the rear plate.
- what: side-marks
  scope: [left, right]
  reason: vendor-silent
  note: >-
    the perforation field, screws and small marks of the long side are drawn from the sheet as unnamed decor and no
    document names any of them. The edge profile of the lower band is not drawn. The right face is not shown by any view.
  wanted: a photograph of each long side.
- what: lamp-windows
  scope: [front]
  reason: vendor-silent
  note: no document says what the paired windows beside the outlets are, so they are decor and no lamp is modelled.
  wanted: the maker's description of the windows.
- what: wordmark-and-legends
  scope: [front]
  reason: needs-photo
  note: the earth symbol and the legends beside the lamp windows are not drawn. The wordmark is drawn at an estimated size.
  wanted: a photograph of the cord end.
