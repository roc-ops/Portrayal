format: 1
kind: device
name: nmf4
version: 0.1.0
maturity: modelled
manufacturer: Panduit
model: NMF4
aliases:
  - {name: NMF4WH, kind: vendor}
description: >-
  4RU front-only horizontal cable manager, Panduit NetManager High Capacity NMF4: an ABS
  moulding on the rack rails with a channel 140 mm deep standing out of its front, a wall of
  twelve T-shaped inset fingers along its top and another along its bottom, and a hinged PVC
  cover across the finger tips that ships fitted. Two windows in the plate behind the channel
  pass cable to the back of the rack.
profile: passive
provenance:
  ears:
    confidence: drawing
    note: >-
      drawing - `positions` states where the ears bolt, for the Rack Builder. The NMF4 customer
      drawing (Panduit 10404-18) dimensions the channel "5.5 REF [140]" from the front of the
      cover to the end of the finger zone and the whole manager "6.2 REF [157]"; the mounting
      plate and its flange are the 17.3 behind. `at` is 139.7, so the ears bolt to the front face
      of the plate. This states a placement; no dimension changed.
  full-depth:
    confidence: drawing
    note: >-
      `full-depth: false` - the part is 157 deep and 139.7 of it stands in front of the rails, so
      the rear face of its rack units stays free for another part.
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S OWN DOCUMENTS, read as the NMF2's are (see nmf2): the customer
      drawing (PDF 10404-18, with a DXF and a DWG that hold only a trimetric projection, so no
      measurement), the NetManager High Capacity specification sheet RKSP237, the product page,
      the Space-Saving bulletin RKCB46 and the Cable Capacity Calculator. THE FIGURES THE DRAWING
      DIMENSIONS ARE `drawing`; EVERYTHING READ OFF THE PICTURE (the finger count and pitch, the
      crossbar, the windows) IS ESTIMATED and said so in the part that carries it.
  chassis:
    confidence: estimated
    note: >-
      estimated - 444.83 x 177 x 157. The drawing dimensions 482 [19.0 in] over the ears, 465
      [18.3 in] between the fixing holes, 177 [7.0 in] high and 157 [6.2 in] deep; the body between
      the ears is the NCMH2 drawing's 444.83 [17.51 in] for the same moulding, which this drawing
      does not give. The ears are not drawn.
  shell:
    confidence: drawing
    note: >-
      drawing - A HOLLOW CHANNEL, NOT A BOX (see nmf2): the plate on the front view as a well
      139.7 deep with two open windows, the two walls of fingers standing in it, the cover across
      their tips and the back of the plate standing 17.3 proud of the rear face.
  thickness:
    confidence: estimated
    note: >-
      estimated - no Panduit document states a wall gauge for the ABS moulding. 2.5 is a
      moulded wall of this size; the parts carry their own thicknesses.
  weight:
    confidence: drawing
    note: >-
      drawing - 1179 g [2.6 lb], the weight table of the NMF4 customer drawing (10404-18).
  front:
    confidence: drawing
    note: >-
      drawing - the front with the cover fitted: the cover, and under it the two rows of T
      fingers end-on, the channel between them (157 high on the 177, estimated) and the two
      windows in the plate at the back of it, 129 high (estimated: carried from the NMF3).
  rear:
    confidence: drawing
    note: >-
      drawing - the back of the plate with its two windows; five plates round them, sunk 0.05
      inside the rear face. The windows are open; the blanking panel NM4B is a separate accessory.
  top:
    confidence: drawing
    note: >-
      drawing - the plan view, rear at y=0: the plate and flange 17.3 deep, twelve stems 100 mm
      long with a crossbar on each tip, and the cover over the front 12.6 mm.
  bottom:
    confidence: drawing
    note: >-
      drawing - the front view draws the same finger tips along the bottom as along the top;
      the bottom is the top again.
  left:
    confidence: estimated
    note: >-
      estimated - no side view is drawn; built from the plan view and the front view.
  right:
    confidence: estimated
    note: >-
      estimated - the left view turned round.
  guides:
    confidence: estimated
    note: >-
      estimated - the duct is the channel between the two finger rows, run across the rack; pitch
      34.925 and gap 5.4 as on the NMF2.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - the Cable Capacity Charts of the Space-Saving bulletin (RKCB46) give the NMF4
      per cable at 30 per cent recommended fill and 50 per cent maximum; the figure stated is the
      Cat 6 24 AWG 0.235 in (5.97 mm) column at 30 per cent, 168 (280 at 50 per cent). The Cable
      Capacity Calculator gives the usable area, 24.3 sq in.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material, colour, standards and what is in the box are the NMF4 product page
      and the specification sheet (RKSP237); the temperatures are the customer drawing's.
  color:
    confidence: estimated
    note: >-
      estimated - "The manager is black" on the product page. Every image Panduit publishes of the
      part is a render; the cover is drawn a shade lighter than the moulding.
attrs:
  physical:
    weight-kg: 1.179
    material: ABS
    cover-material: PVC
    color: Black
    mounting-hardware: '#12-24 mounting screws, as shipped with the cover'
  performance:
    cable-capacity: 168
    cable-capacity-basis: >-
      Cat 6 24 AWG, 0.235 in (5.97 mm), at the 30% recommended fill of the front channel's
      24.3 sq in usable area; 280 at the 50% maximum fill - Panduit Space-Saving Cable
      Management Rack Systems bulletin RKCB46, Cable Capacity Charts
    cable-capacity-media: cat6
  environmental:
    operating-temp: '60 C maximum'
    storage-temp: '65 C maximum'
  compliance:
    rohs: RoHS Compliant
    ul: UL 2416
    csa: CSA C22.2
chassis:
  width: 444.83
  height: 177.0
  depth: 157.0
  ru: 4
  full-depth: false
  ears:
    positions:
      - {name: proud, at: 139.7, default: true}
  shell: sheet
  thickness: 2.5
  weight-kg: 1.179
  color: '#2a2c2e'
gaps:
  - what: cover-hinge
    scope: [front]
    reason: vendor-silent
    note: >-
      the specification sheet says the dual hinged cover opens 110 degrees to the top or bottom
      without being removed; no view draws a hinge, and the cover is drawn as one fitted plate
      that is either on or off.
    wanted: a drawing or a close render of the cover's hinge
  - what: blanking-panel
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the NM4B front-to-rear pass-through blanking panel is a separate accessory (V10404BV-DC)
      that closes the two windows; it is not drawn and the windows are open.
    wanted: a drawing of the blanking panel fitted
  - what: cover-section
    scope: [top, left, right]
    reason: needs-drawing
    note: >-
      no view sections the cover or the fingers: their thickness is estimated and the elevations
      draw the body without the cover's edge.
    wanted: a section through a cover and a finger tip
