kind: device
name: p36g18m
version: 0.1.0
maturity: modelled
manufacturer: Panduit
model: P36G18M
description: 'Panduit P36G18M G5 intelligent rack PDU, monitored and switched per outlet, 0U full: a 1750 mm strip for a
  cabinet''s vertical channel. It has a fixed 3 m cord ending in a NEMA L6-30P plug, single-phase, 200-240 V, 30 A. It has
  36 outlets, 30 IEC C13 and 6 IEC C19, in six blocks of six. Three blocks are on each of two 20 A double-pole breakers.
  A controller with a display, indicators, five RJ45 jacks and a USB-A port sits between the two halves.'
profile: power
provenance:
  method: {confidence: drawing, note: 'FIGURES FROM THE MAKER''S DRAWING. Panduit customer drawing P36G18M_DC rev 02A (06/07/2018),
      two sheets, has a front, rear, left, right and bottom view; sheet 1 is a SCAN, not a vector drawing. Its scale was
      taken from its own 1750.0 overall dimension (the 1555.0 between the buttons agrees) and every position was read off
      renderings of the front view at 400 and 1600 dpi, to about 1 mm across and 3 mm along the strip. The library draws
      the PDU STANDING, cord end down, so a position along the drawing becomes 1750 minus that, and a position across becomes
      x. No photograph and no 3D model of the part is held.'}
  mount: {confidence: drawing, note: '`rack-side`: the strip stands beside a rack''s upright on two mounting buttons on
      its back, 1555.0 apart and 40.5 from the cord end (rear view). The drawing says ''VERTICAL, 0U FULL'' (its text layer
      ''OU'') and gives no count of units; `ru: 39` is the whole units the 1750 mm length covers (39.4) and is not stated
      by any document.'}
  chassis: {confidence: drawing, note: 'drawing - 1750.0 long and 53.0 deep (right view, at the far end); the bottom view
      dimensions 52.0 and 75.0, and FBSP28 gives 2.0 in (50.8) wide and 2.1 in (53.34) deep. The width is taken as 52.0
      and the depth as 53.0, as for the P32E06M; which drawn figure is the body''s width, and what the 75.0 measures, is
      not said (gaps: body-width). Weight 9.9 kg is the sheet-2 table''s for the plain part number.'}
  front: {confidence: drawing, note: 'drawing - the front view. From the cord end: a plate with the earth screw, two breaker
      plates, three outlet blocks of six, the controller, and three more blocks of six to the far end. Each block is a moulding
      with a lamp window beside every outlet. Outlet and plate positions are the centres as drawn; the outlet pitch is not
      dimensioned.'}
  outlets: {confidence: drawing, note: 'drawing - ''(30)C13, (6)C19'', ''MONITORED & SWITCHED PER OUTLET''. Each block is
      a C19 followed by five C13, the C13s staggered across the face. Each outlet is std/c13-outlet@1 or std/c19-outlet@1.
      They are numbered 1 to 36 along the strip from the cord end, as the few numerals legible in the scan suggest (1 to
      6 in the first block); the numerals are blobs of a 150 ppi scan, not read and not drawn (gaps: outlet-numerals). THE
      DRAWN OUTLET SYMBOLS ARE SMALLER THAN THE REGISTRY''S WELLS, so the C13 are placed at a pitch of 22.1 along the strip,
      0.1 over the well''s own length, where the drawing reads 21.8: an ESTIMATE of the reading error and not a source (gaps:
      outlet-size).'}
  banks: {confidence: drawing, note: 'drawing - the front view labels the first three blocks ''B1 [DARK GRAY]'' and the
      last three ''B2 [LIGHT GRAY]'', over breakers B1 and B2. THAT B1 FEEDS THE FIRST THREE BLOCKS IS A READING OF THE
      LABELS: no sentence held says it. The two greys are drawn as #55585c and #9a9da1 and are estimates of the words: no
      photograph is held.'}
  colour: {confidence: drawing, note: 'drawing - sheet 2 gives BLACK (RAL 9005) for the plain part number P36G18M, drawn
      here as the RAL''s #0e0e10 on the body. THE PLATE, MOULDING, SCREW AND LAMP-WINDOW COLOURS ARE NOT CHECKED against
      any source; no photograph is held.'}
  controller: {confidence: drawing, note: 'drawing - the controller plate is drawn between the third and fourth block. P36G18M
      is composed with panduit/g5-controller@1 in a bay because the FBSP28 sheet calls the controller hot swappable; the
      bay is where the P32E06M''s is, which the drawing of this one agrees with to about 3 mm. Its jacks'' functions are
      not read (see the component''s provenance).'}
  input: {confidence: drawing, note: 'drawing - ''INPUT PLUG: NEMA L6-30P'', ''INPUT VOLTAGE: 200-240VAC'', ''INPUT CURRENT:
      30A (24A DERATED)'', ''INPUT PHASE: SINGLE-PHASE'', ''RATED POWER: 5.0 kVA''. Sheet 2 gives the plain part number
      a 3 m cord. The cord is one part at the cord end; its length and the plug''s face are not drawn.'}
  capability: {confidence: datasheet, note: 'datasheet - the drawing''s unit type is MONITORED & SWITCHED PER OUTLET and
      FBSP28 lists it under the MSPO series, so `metering-scope: outlet` and `outlet-switching: true`, and each outlet declares
      [on, off].'}
  rear: {confidence: drawing, note: 'drawing - the rear view: two buttons 40.5 from the cord end and 1555.0 apart, on the
      strip''s centre line. The callout ''TOOLESS MOUNTING BUTTON LOCATIONS (12) PL'' names twelve button locations and
      only the two dimensioned ones are drawn (gaps: rear-marks).'}
  sides: {confidence: estimated, note: 'ESTIMATED from sheet 1 of P36G18M_DC, a 150 ppi scan, rendered at 300 dpi (one pixel
      is 0.585 mm of the strip, scaled on the 1750.0 dimension). The sheet''s LEFT VIEW is the library''s right face and
      its RIGHT VIEW the library''s left face, because the sheet draws the strip standing cord end up. Each mark is a dark
      blob: 24 on the right face and 20 on the left, each drawn as an unnamed round mark 8.5 mm across (the blob is 14 px)
      at its pixel centre, good to about 1 mm; the four blobs that carry a crosshair (24.0 and 40.5 from each button) are
      drawn as the same round mark without the crosshair. On the right face the drawing also shows a rectangle near the
      cord end, 160 by 36 mm: its two ends and its rear edge are drawn as thin bars, and its front edge, which lies 3.5
      mm beyond the face''s front line in the housing that stands proud there, is not. No function is stated for any mark.
      The small notches in the strip''s outline are the profile of the outlet blocks and are not drawn (gaps: side-marks).'}
  ends: {confidence: estimated, note: 'ESTIMATED - the sheet''s BOTTOM VIEW is the far end, the library''s top face: a rounded
      rectangle 52 across with one screw head 7.6 mm across, 5.9 from the rear edge and centred across, drawn as an unnamed
      round mark; the plate that stands 5 mm proud of the rear edge there lies outside the face and is not drawn. No sheet
      or view shows the cord end as an end view (the sheet''s views leave the cord end as the cord leaving the strip), so
      the bottom face is the cord gland alone (gaps: cord-end-face).'}
attrs:
  physical: {length-mm: 1750, weight-kg: 9.9}
  power: {input-ac: 'single-phase, 200-240 V, 30 A (24 A derated), 5.0 kVA (drawing note 1)', input-plug: other, input-cord: fixed,
    input-phase: single, input-current-a: 24, plug-rating-a: 30, breakers: two 20 A double-pole electromechanical switches
      and breakers}
  management: {metering-scope: outlet, outlet-switching: true, network-module: G5 controller}
chassis: {width: 52, height: 1750, depth: 53, ru: 39, mount: rack-side, color: '#0e0e10', airflow: passive, weight-kg: 9.9}
gaps:
- what: body-width
  scope: [front]
  reason: sources-disagree
  note: the bottom view dimensions 52.0 and 75.0, the right view 53.0, and the sheet gives 2.0 in (50.8) wide and 2.1 in
    (53.34) deep; no document says which drawn figure is the body's width or what the 75.0 measures. The strip is drawn
    52 wide and 53 deep.
  wanted: a dimensioned end view of the strip, or a measured unit.
- what: photographs
  scope: [front, rear, top, bottom, left, right]
  reason: needs-photo
  note: no photograph of any face is held, so no colour, finish, printing or plate shape is checked against a photograph.
  wanted: a photograph of each face of the P36G18M.
- what: outlet-pitch
  scope: [front]
  reason: needs-drawing
  note: no dimension of an outlet, a lamp window or a plate on the front view is stated; the positions are read off the
    drawing at its own 1750.0 scale.
  wanted: a dimensioned front view.
- what: outlet-size
  scope: [front]
  reason: needs-drawing
  note: 'the drawn outlet symbols are smaller than the registry''s C13 and C19 wells, so the drawn centres could not all
    be kept: the C13 of a block are 22.1 apart where the drawing reads about 21.8. No document dimensions Panduit''s own
    outlet.'
  wanted: a dimensioned outlet drawing from Panduit.
- what: outlet-numerals
  scope: [front]
  reason: needs-drawing
  note: sheet 1 of P36G18M_DC is a 150 ppi scan (one page raster, 2700 by 1800 px) with no text layer for the front view;
    the numeral beside each outlet is a blob a few pixels high, 3 to 4 mm of the strip, at 1.2 mm a pixel, so none can be
    read and none is drawn. The numbering is the order along the strip.
  wanted: a vector copy of the front view.
- what: cord-end-housing
  scope: [front, left, right]
  reason: needs-drawing
  note: 'the sheet''s left and right views and its bottom view show the first 335 mm from the cord end, where the breakers
    sit, standing about 22 mm proud of the strip''s front: the bottom view''s two figures are 52.0 and 75.0, and 53.0 +
    22 is 75. The device is a plain box 53 deep and does not draw that housing; the 75.0 is most likely its depth, which
    is not stated by any note.'
  wanted: a dimensioned side view of the cord end.
- what: cord-end-face
  scope: [bottom]
  reason: needs-drawing
  note: 'no view of either sheet is an end view from the cord end: the sheet''s BOTTOM VIEW is the far end and the other
    views show the cord leaving the strip. The bottom face is the gland alone, a 32.0 round that is an estimate.'
  wanted: an end view of the cord end.
- what: rear-marks
  scope: [rear]
  reason: vendor-silent
  note: the rear view's callout 'TOOLESS MOUNTING BUTTON LOCATIONS (12) PL' names twelve button locations; only the two
    dimensioned ones are drawn. The '(2) PL 24.0' and '(4) PL 32.0' dimensions locate marks beside the buttons, and no document
    says what those are.
  wanted: the maker's installation drawing.
- what: side-marks
  scope: [left, right, top]
  reason: vendor-silent
  note: 'the long sides'' marks and the rectangle near the cord end are drawn from the sheet as unnamed decor and no document
    names any of them; what the scan does not resolve is not drawn: the outline''s small notches, the crosshair strokes,
    the rectangle''s front edge (3.5 mm beyond the face) and the plate on the far end''s rear edge. The scan is 150 ppi,
    1.2 mm a pixel at the strip''s scale.'
  wanted: a photograph of each long side.
- what: wordmark-and-legends
  scope: [front]
  reason: needs-photo
  note: the wordmark, the earth symbol and the legends beside the lamp windows, other than the breaker legends, are not
    drawn.
  wanted: a photograph of the cord end and the controller.
- what: part-number-variants
  scope: [front, rear]
  reason: vendor-silent
  note: sheet 2 of the drawing lists more part numbers of this strip (five more colours, 1 m and 2 m cords and a bottom-end-fed
    cord), and note 5 says the views show the top-end-fed cord; the device states the plain P36G18M's 3 m cord and 9.9 kg
    only, and no variant is a configuration.
  wanted: an order for each variant that has a held photograph or a dimensioned drawing.
