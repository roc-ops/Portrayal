gaps:
  - what: door-face
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the PR2VSD is "dual-sided with one door": the product page and the drawing's note 4 say one door
      and no document says which face it closes. It is drawn on the front.
    wanted: a render of the PR2VSD06 with its door fitted
  - what: cable-capacity
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the bulletin's charts and Panduit's calculator state capacities for the PR2VD06 and PR2VFD06 and
      not for the PR2VSD06, so none is stated.
    wanted: a capacity row for the PR2VSD06
  - what: door-hinge
    scope: [front]
    reason: vendor-silent
    note: >-
      the door is "dual-hinging" and opens to the left or the right on hinge pins; no view draws a
      hinge, and the door is drawn as one fitted plate that is either on or off.
    wanted: a drawing or a close render of a door's hinge and latch
  - what: finger-shape
    scope: [front, rear, top, bottom, left, right]
    reason: needs-drawing
    note: >-
      the front view draws each finger as a loop; it is built as a solid block 30 across and 33 high,
      and its length (260 front, 175 rear) is estimated from the calculator's channel areas.
    wanted: a section through a finger and the backbone
  - what: free-standing-base
    scope: [front, rear, left, right]
    reason: vendor-silent
    note: >-
      the drawing's "free standing base", the integrated door brackets and the stand-off from a rack
      are not drawn or dimensioned.
    wanted: a drawing of the base and its fixing to a rack
