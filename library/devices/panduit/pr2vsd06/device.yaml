format: 1
kind: device
name: pr2vsd06
version: 0.1.0
maturity: modelled
manufacturer: Panduit
model: PR2VSD06
aliases:
  - {name: PR2VSD06WH, kind: vendor}
description: >-
  45RU dual-sided vertical cable manager with one door, 6 in wide, Panduit PatchRunner 2
  PR2VSD06: a steel backbone with a column of 45 inset ABS fingers down each side of its front
  channel and of its rear channel, one finger to each rack unit, four 3.0 in round pass-through
  holes through the backbone, and one full-length dual-hinging push-to-close steel door that
  ships fitted on the front. The rear channel is open. It stands on a free-standing base beside a
  rack and takes no rack unit.
profile: passive
provenance:
  mount:
    confidence: drawing
    note: >-
      drawing - `rack-side`, as the FS vertical ducts and the PR2VD08: the PR2VSD drawing (Panduit
      14V455MW-DC) is the PR2VD drawing's manager with one door. It occupies no rack unit; `ru: 45`
      is the height it runs beside (the 83.88 in of the table is a 7 ft, 45 RU manager). Which side of
      the rack is a lab placement to say (docs/vertical-cable-managers-design.md).
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S OWN DOCUMENTS, read as the PR2VD08's are (see pr2vd08): the PR2VSD**
      customer drawing (PDF 14V455MW-DC), the PR2VD** drawing (14V455LV-DC) whose views it repeats, the
      PatchRunner 2 Vertical Cable Managers specification sheet RKSP172, the product page and the
      Space-Saving bulletin RKCB46 (which lists the part's width only). THE FIGURES THE TABLE GIVES ARE
      `drawing`; EVERYTHING READ OFF THE PICTURES (the split of the depth between the channels, the
      finger's size, the holes' places) IS ESTIMATED and said so in the part that carries it.
  chassis:
    confidence: drawing
    note: >-
      drawing - 152.4 x 2130.4 x 526.4, covers fitted: the PR2VSD table's A 6.00 in [152.4], B 83.88 in
      [2130.4] and C [526.4] for the PR2VSD06 (the table prints 20.2 in beside the 526.4 mm, and 20.7 in
      for the same mm on the PR2VD sheet: the millimetres are taken). The Space-Saving bulletin states
      6.0 x 84.0 x 20.6 in (152 x 2130 x 523 mm).
  depth:
    confidence: estimated
    note: >-
      estimated - the 526.4 is overall. It is drawn as a 303 front channel, a 20.4 backbone and a 203 rear
      channel (see pr2vd08): the PR2VSD drawing shares the PR2VD's plan view.
  shell:
    confidence: drawing
    note: >-
      drawing - TWO HOLLOW CHANNELS BACK TO BACK, NOT A BOX (see pr2vd08): the backbone as a well 303
      deep on the front view and 203 deep on the rear view, each with its fingers; the front has the
      door; both floors open at the four 3.0 in holes.
  thickness:
    confidence: estimated
    note: >-
      estimated - no Panduit document states the steel's gauge. 1.5 is a sheet of this kind; the parts
      carry their own thicknesses.
  weight:
    confidence: drawing
    note: >-
      drawing - 18.7 kg [41.19 lb], the manager and door unpacked, the weight column of the PR2VSD
      table; 19.6 kg [43.19 lb] shipped.
  front:
    confidence: drawing
    note: >-
      drawing - the front with the door fitted: the door, and under it the backbone with 45 fingers a
      side in three sections of 15 and the four holes. The `duct` guide is the channel between the
      finger columns, run down the height: 123.2 across, the 6 in less the 29.2 the calculator's front
      area per inch of width (9.3 sq in, from the PR2VD06 to PR2VD12) leaves, ESTIMATED.
  rear:
    confidence: estimated
    note: >-
      estimated - the rear with no door: the PR2VSD drawing is "front and rear fingers" and the part
      includes one door (see `gaps:` for which face has it). The `duct` is 111.2 across, the 6 in less
      the 41.2 that the calculator's rear area per inch of width (6.23 sq in) leaves, ESTIMATED.
  top:
    confidence: estimated
    note: >-
      estimated - the plan, rear at y=0: the rear fingers, the backbone and the front fingers, built
      from the plan view of the drawing and the finger lengths above.
  bottom:
    confidence: estimated
    note: >-
      estimated - the top view again: the two ends of the manager are alike.
  left:
    confidence: estimated
    note: >-
      estimated - no side view of the manager without its door is dimensioned: the backbone, and the
      two finger zones along it, built from the plan view and the finger columns' extent.
  right:
    confidence: estimated
    note: >-
      estimated - the left view turned round.
  guides:
    confidence: estimated
    note: >-
      estimated - each duct is the channel between the two finger columns of its face, run down the
      height (`run: y`), with the rack unit's 44.45 pitch and the 11.45 left between 33 mm fingers.
  capacity:
    confidence: estimated
    note: >-
      no Panduit document states a capacity for the PR2VSD06: the bulletin's charts and the
      calculator list the PR2VD and PR2VFD parts of the same width and not the PR2VSD. It is left out
      (`gaps:`); the PR2VD06's figures are not carried over.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material, colour, standards and what is in the box are the PR2VSD06 product
      page and the specification sheet (RKSP172); the materials are the drawing's.
  color:
    confidence: estimated
    note: >-
      estimated - "The manager is black" on the product page. Every image Panduit publishes of the
      part is a render; the door is drawn a shade lighter than the backbone.
