format: 1
kind: device
name: vp7553
version: 0.1.0
maturity: modelled
manufacturer: Vertiv
model: VP7553
description: >-
  Vertiv Geist basic rack PDU, vertical, 230 V, 32 A, 7.3 kW. It has a fixed 3 m input cord with an IEC 60309 2P+E plug. Twenty IEC
  C13 and four IEC C19 outlets sit on the front, in two circuits of ten C13 and two C19. Each circuit has one 16 A single-pole
  magnetic breaker at the cord end.
profile: power
provenance:
  method:
    confidence: photo-measured
    note: >-
      NO DRAWING EXISTS, SO EVERY POSITION ALONG THE STRIP IS READ OFF THE FIGURE ON PAGE 2 OF THE DATA SHEET, 876 BY 88 PX. The strip's
      1683 mm reads 845 px (1.99 mm per px). Its 51 mm width reads 25 px (2.04), so the scale agrees two ways. Each position is good to
      2 to 3 mm and each size across the strip to about 3 mm. No 3D model and no stencil of any Vertiv rack PDU is held.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - the page 2 line "Dimensiones del chasis (Al. x An. x Pr.) 1.683 mm x 51 mm x 51 mm". It gives 1683 long, 51 wide and 51 deep.
      The sheet's page 1 gives the length as "66 pulgadas (1.683 mm)", and 66 in is 1676.4 mm (gaps: length-66-in). The drawing uses the
      chassis line. The sheet says "Montaje en rack vertical". The drawing treats it as 0U, so the rack unit count is the length
      divided by 44.45, rounded up. Page 2 also prints "Forma (D) 37mm", which no text explains (gaps: form-d).
  front:
    confidence: photo-measured
    note: >-
      photo-measured - the outlet face. The source lies the strip on its side with the cord end on the right. The drawing stands it up
      with the cord end at the bottom (gaps: orientation). Distances are along the strip from the far end. Across the strip every
      outlet, bezel and plate is centred, which the figure shows to about 2 mm. The bezel behind each outlet group is drawn as a plate.
      Each small window after an outlet run is drawn as a plate with a light rim and a pale bar (gaps: label-windows).
  module:
    confidence: photo-measured
    note: >-
      photo-measured - at the cord end a dark module plate about 161 mm long carries two breakers, each a labelled window beside a round
      actuator. Eight small screws sit on the plate, in four columns of two that flank the two windows. Two dots sit just before the
      plate and one at each end of the strip, all drawn as small screws. The columns read 16, 58, 103 and 143 mm from the plate start,
      in two rows 19.5 mm apart across the strip. The plate's dark start-edge band reads 3.9 px, 7.7 mm, and is drawn 7.5 mm wide,
      good to 2 mm. The scale is 1.99 mm per pixel and each other read is good to about 3 mm. A small maker
      plate stands between the module and the gland. The data sheet's "(2) Disyuntores magnéticos unipolares de 16 A" gives the breaker
      count and rating.
  outlets:
    confidence: datasheet
    note: >-
      datasheet - page 1 lists "IEC C13": 20 on the front face, 10 per breaker, in banks of 2, 10 A per bank. It lists "IEC C19": 4 on
      the front face, 2 per breaker, individual, 16 A. The figure shows five pairs of C13 and two C19 in each circuit, which agrees.
      Each outlet is std/c13-outlet@1 or std/c19-outlet@1 at the part's own size. The sheets give no numbering, so the outlets are
      numbered from the far end (gaps: numbering).
  circuits:
    confidence: estimated
    note: >-
      estimated - the sheet gives ten C13 and two C19 per breaker and does not say which. The first circuit is taken as the five pairs
      and two C19 nearer the far end, the second as the rest.
  orientation:
    confidence: estimated
    note: >-
      estimated - the picture is too small to show which end of each C13 is chamfered. It does not show which way a C19 earth slot
      faces. Every outlet is drawn at the part's own orientation.
  colours:
    confidence: datasheet
    note: >-
      The body is drawn black, about #1b1c1e (an estimate): the sheet says "Negro", black electrostatic paint. The figure reads the
      plain body at #535351, the module plate at #363636 and the gland centre at #222528. The picture reads lighter than "Negro", and
      the difference is taken as the lighting and not the finish. The bezels are drawn a little lighter than the body and the module
      and maker plates a little darker, as the picture shows them.
  capability:
    confidence: datasheet
    note: >-
      datasheet - the sheet prints only "Básica, Estándar" for the type. The brochure "Vertiv™ Geist™ Product Overview" (SL-70412), page 4, marks
      no current meter and no network interface for Basic. Its text gives a digital display to Metered units. The sheet's "Switch"
      row reads "Combinación de disyuntor/conmutador", read here as the breakers and not outlet switching.
  input:
    confidence: datasheet
    note: >-
      datasheet - "Tensión 230V", "Corriente 32 A", 7.3 kW, 50/60 Hz, one input. The cord is 3 m of 4 mm2 H07RN-F. The plug is "IEC60309
      2P + E, 32 A, 250 V", splashproof IP44. The cord is fixed: the sheet lists a cord with its plug, and the figure shows a gland at
      the end of the strip.
  mounting:
    confidence: datasheet
    note: >-
      datasheet - the sheet lists the vertical mounting bracket kit 7938 and tool-free metal mounting parts at 1556 mm and 1645 mm
      centre to centre. Neither the sheet nor the picture shows the mounting buttons, so none is drawn (gaps: other-faces).
  lifecycle:
    confidence: datasheet
    note: >-
      no held document announces an end of life. Nothing is fetched for this model.
attrs:
  power:
    input-ac: 230 V single-phase, 32 A, 50/60 Hz, a fixed 3 m cord with an IEC 60309 2P+E plug
    input-plug: other
    input-cord: fixed
    input-phase: single
    input-voltage-v: 230
    input-current-a: 32
    capacity-kw: 7.3
    capacity-scope: the load the PDU can hand on, from the data sheet; it is not what the PDU draws itself
    frequency: 50/60 Hz
    breakers: two single-pole 16 A magnetic breakers, one per circuit
  environmental: {operating-temp: 10 to 45 C (50 to 113 F)}
  physical: {length-mm: 1683, construction: 'high-strength steel with a black electrostatic paint finish'}
  management: {metering-scope: none, outlet-switching: false}
  compliance: {certifications: 'RoHS, CE, EN 55032, EN 55024, IEC 60950-1'}
  lifecycle: {eol: none-announced}
chassis:
  width: 51
  height: 1683
  depth: 51
  ru: 38
  mount: rack-side
  color: '#1b1c1e'
  airflow: passive
gaps:
- what: length-66-in
  scope: [front]
  reason: sources-disagree
  note: >-
    the sheet's page 1 prints 66 in (1.683 mm) and 66 in is 1676.4 mm. Its chassis line prints 1683 mm. The drawing follows the
    chassis line.
  wanted: a dimensioned outline drawing.
- what: form-d
  scope: [front]
  reason: vendor-silent
  note: >-
    page 2 of the sheet prints "Forma (D) 37mm" beside a chassis depth of 51 mm. No held text says what the form figure measures. The
    drawing keeps the depth of 51 mm.
  wanted: the maker's outline drawing of the unit.
- what: other-faces
  scope: [rear, top, bottom, left, right]
  reason: needs-photo
  note: >-
    the sheet shows the outlet face only. No held image shows the back, the two ends or the two sides. The sheet lists outlets on the
    front face only, so the back is not drawn as a copy of it. The other five faces are drawn bare at the chassis size.
  wanted: straight-on photographs of the back, both ends and the sides, or the installer guide for this model.
- what: orientation
  scope: [front]
  reason: vendor-silent
  note: >-
    the sheet lies the strip on its side and says only "Vertical". The drawing stands it with the cord end at the bottom, which is an
    assumption.
  wanted: a photograph of the unit mounted.
- what: outlet-orientation
  scope: [front]
  reason: needs-drawing
  note: >-
    the picture is too small to show which end of each C13 is chamfered. It does not show which way a C19 earth slot faces. Every
    outlet takes the part's own orientation.
  wanted: a larger photograph of the outlet face.
- what: numbering
  scope: [front]
  reason: vendor-silent
  note: >-
    no held document numbers the outlets. They are numbered from the far end, one count across the C13 and the C19.
  wanted: a photograph that shows the printed numbers, or the installer guide.
- what: circuit-assignment
  scope: [front]
  reason: vendor-silent
  note: >-
    the sheet gives ten C13 and two C19 per breaker and does not say which outlets each breaker feeds. The split is estimated by
    position.
  wanted: the installer guide, or a photograph of the circuit marks.
- what: label-windows
  scope: [front]
  reason: vendor-silent
  note: >-
    the figure shows a small light-rimmed window after the last outlet of each circuit, with a pale bar inside. No held text says what
    it is. It is drawn as a plate with a light rim and a pale bar, both estimated. The figure is too small to read an edge closer than
    about 2 mm. The rim takes the breaker window's colour and width. Anything printed in the window is not drawn.
  wanted: the installer guide for this model.
- what: module-detail
  scope: [front]
  reason: needs-photo
  note: >-
    the module plate shows a faint pale mark beside each actuator and the window labels, all too small to read. The marks are not
    drawn. The dark band along the plate's start edge is drawn as a darker strip. Its width is read from the figure and its shade is estimated.
  wanted: a larger photograph of the cord end.
- what: marks-and-text
  scope: [front]
  reason: needs-photo
  note: >-
    the maker's mark and the printed labels are left to a later touch. The plate that carries the mark is drawn.
  wanted: a larger photograph of the cord end.
- what: colour
  scope: [front]
  reason: sources-disagree
  note: >-
    the sheet says black and the body is drawn black, an estimate. The picture reads the body as a mid grey, which is taken as the
    lighting.
  wanted: a photograph under neutral light, or the swatch of the finish.
groups:
  outlets: {term: Outlet, role: traffic, index-origin: 1, mixed: 'the 24 outlets on the front, 20 IEC C13 and 4 IEC C19. They are numbered from the far end. The sheet gives no numbering.'}
  breakers: {term: Breaker, role: service, index-origin: 1, description: 'the two 16 A single-pole magnetic breakers, one per circuit'}
  power-input: {term: Input, role: service, index-origin: 1}
