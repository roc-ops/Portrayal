format: 1
kind: device
name: acs804meac-400
version: 0.1.0
maturity: modelled
manufacturer: Vertiv
model: ACS804MEAC-400
portfolio: {line: Console servers, family: Avocent ACS800}
description: >-
  Vertiv Avocent ACS800 compact serial console, the 4-port unit with an analog modem. It has four RJ45 serial
  ports and an RJ45 console port. It also has two 10/100/1000 RJ45 LAN ports and a 12 VDC power jack for the
  external AC/DC adapter. The front carries the MODEM, DIGITAL IN and SENSOR RJ45 jacks, a four-pin DIGITAL OUT connector, four
  USB ports and the STATUS and POWER lamps. It has no ears or rack units; the maker offers wall, DIN rail and 1U
  shelf kits for it.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Vertiv Avocent ACS800 Serial Console data sheet AV-12340 (R09/22): the ordering table, hardware
      specifications, power usage and dimensions, and its pictures of the front and of the eight-port rear.
      Vertiv Avocent ACS800/8000 Advanced Console System Installer/User Guide (PDF built 2025-03-05): Figure
      1.4 and Table 1.4 (the callouts), Table 1.5 (the serial lamp states), "Digital Out sensors" (the two relay
      switches) and Table A.2. Avocent ACS800 Advanced Console System Mounting Installation Guide 590-1509-501A,
      pages 1 to 3: the DIN rail, wall and 1U shelf kits. The maker's product photographs of the front and of
      the two-port rear. No dimensioned drawing, 3D model or stencil is held.
  method:
    confidence: estimated
    note: >-
      NO DRAWING IS HELD, SO EVERY POSITION ON BOTH FACES IS MEASURED OFF THE MAKER'S PHOTOGRAPHS AND IS
      ESTIMATED. The front is the 800 x 600 front photograph: the face is 690 pixels across for the 212.7 mm
      body, 3.244 pixels per millimetre, and a jack's 52 pixel width reads 16.0 mm against the 15.8 mm of an RJ45
      housing. The photograph looks slightly down on the unit, so every y is taken from the bottom edge of the
      face with the same scale. The rear is the data sheet's picture of the eight-port unit, rendered at 400 dpi
      (7.457 pixels per millimetre across the body), and the two-port rear photograph (3.40 pixels per millimetre)
      is the second reading: the first jack pair sits at 77.4 mm in the photograph and 77.6 mm in the picture, and
      the two jacks of the pair 14.4 mm apart in the photograph and 14.5 mm in the picture. A position is good to
      about 0.5 mm across and 1 mm down. Counts and colours are read directly.
  chassis:
    confidence: datasheet
    note: >-
      8.374 x 7.156 x 1.161 in (W x D x H), data sheet AV-12340 page 2, converted to 212.7 x 181.76 x 29.49 mm.
      The installer guide, Table A.2, prints 1.3 x 8.38 x 7.16 in (H x W x D): the width and depth agree to
      0.01 in and the height does not (gap `height`). The data sheet's figure is used because it is printed to a
      thousandth of an inch.
  colour:
    confidence: photo-measured
    note: >-
      medians of the front photograph: the face #494949 with an orange trim line along its bottom edge #ec8e30;
      of the rear photograph: the rear plate #edeef0 under a dark lid #515151. The lid is seen from above in
      both photographs and is not a face.
  front-layout:
    confidence: estimated
    note: >-
      From the front photograph. The mark and the product name Avocent ACS800 sit at the left, the STATUS and
      POWER lamps follow, then four jacks in a row: MODEM, DIGITAL IN, the DIGITAL OUT connector and SENSOR, then
      two blocks of two stacked USB ports each, with the USB symbol under each block. The MODEM, DIGITAL IN and
      SENSOR jacks are RJ45 housings in white bezels, 20.6 mm apart centre to centre (MODEM to DIGITAL IN) and
      41.3 mm (DIGITAL IN to SENSOR, the DIGITAL OUT connector between). The photograph does not number the USB
      ports; the upper port of the first block is taken as 1, the lower as 2, then the second block.
  rear-layout:
    confidence: estimated
    note: >-
      From the data sheet's eight-port rear picture and the two-port rear photograph. The 12VDC jack is at the
      left, then CONSOLE, then LAN 1 and LAN 2 with a green lamp at the upper left and a yellow at the upper
      right of each, then the serial jacks in gangs of two (a framed pair each) with a green lamp at the lower
      left and a yellow at the lower right of every jack. The eight-port picture shows gangs of 2, 2 and 4; the
      photograph shows the first pair. THE REAR OF THE FOUR-PORT UNIT IS NOT PHOTOGRAPHED: its four serial jacks
      are drawn as the first two gangs of the eight-port picture, at the positions that picture gives them, and
      the numbers 1 to 4 under them as printed on both pictures.
  serial-ports:
    confidence: datasheet
    note: >-
      Data sheet hardware specifications: 2, 4 or 8 serial ports on RJ45, selectable between RS-232, RS-422 and
      RS-485, one serial console port on RJ45. Installer guide Table 1.4 callout 5: all of the serial ports are
      multi-protocol. The ordering table lists the 4-port unit only.
  serial-role:
    confidence: datasheet
    note: >-
      Installer guide Table 1.4, callout 5: connect "the appropriate serial and power devices" to the serial ports.
      Callout 7 is the console port. The serial ports are console server ports as on the ACS8000.
  lamps:
    confidence: datasheet
    note: >-
      Installer guide Table 1.4, callout 1: the STATUS lamp is green when the console system is fully booted up
      and initialized and the Power lamp is green when power is being supplied. Table 1.5 gives each serial jack a
      green and a yellow lamp with the meanings written under each state.
  digital-out:
    confidence: datasheet
    note: >-
      Installer guide, "Digital Out sensors": "the four pins of the green connector form two switches", Switch 1
      the two pins on the left and Switch 2 the two on the right, relays rated 12 A and 300 V. The guide's Table
      A.2 says "four output signals" and its text two digital outputs; both fit two switches of two pins. The
      front is the only face that carries it.
  power:
    confidence: datasheet
    note: >-
      Data sheet power usage: nominal 120 VAC typical 0.13 A and 6.2 W, maximum 0.47 A and 28 W; nominal 240 VAC
      typical 0.10 A and 7 W, maximum 0.29 A and 28 W. 28 W is the maximum at both and is filed as
      `power-max-w`. The supply is an external AC/DC adapter, 100 to 240 VAC in and 12 VDC out; the rear carries
      the 12VDC jack the adapter plugs into. The installer guide, Table A.2, gives an internal supply and 17 W
      maximum: gap `power`.
  ears:
    confidence: drawing
    note: >-
      Mounting Installation Guide 590-1509-501A: an optional kit of two brackets with DIN clips for 35 mm rail
      (page 1), an optional kit of two brackets for a wall (page 2) and an optional kit of two brackets and a 1U
      shelf (page 3). No kit is part of the unit, none is dimensioned and no kit part number is held, so the unit
      is a desktop box with no ears and no rack units.
  sku:
    confidence: datasheet
    note: >-
      The data sheet ordering table lists one model, ACS804MEAC-400, "ACS800 4-port unit w/analog modem,
      external AC/DC, PDU cable". The data sheet says the family has 2, 4 or 8 serial ports and no held document
      gives the part number of the 2-port or the 8-port unit.
attrs:
  physical:
    weight-note: not stated, the two documents that give a weight disagree (gap `weight`)
  power:
    power-max-w: 28
    power-input: external AC/DC power adapter, 100 to 240 VAC, 50/60 Hz in, 12 VDC out (data sheet)
    power-usage: typical 6.2 W (0.13 A) at 120 VAC and 7 W (0.10 A) at 240 VAC; maximum 28 W at both (data sheet)
  platform:
    cpu: Dual-core ARM Cortex-A9 MPCore with CoreSight
    ram: 1 GB DDR3L
    storage: 16 GB eMMC flash
  environmental:
    operating-temp-c: 0 to 70
    storage-temp-c: -20 to 90
    operating-humidity: 20% to 80% non-condensing RH
    storage-humidity: 5% to 95% relative humidity
  features:
    serial-pinout: automatic Cyclades and Cisco pin-out detection (data sheet)
    modem: built-in V.92 analog modem (installer guide)
    sensor-ports: environmental sensor port (RJ45, 1-wire) and a digital in port (installer guide)
    digital-out: two relay switches on one four-pin connector, 12 A and 300 V (installer guide)
  compliance:
    certification: >-
      Emissions and immunity: FCC Class A, CE Class A, UKCA, ICES-003, VCCI, RCM, Customs Union, KCC. Safety: UL,
      cUL, EN-60950, CB, Customs Union (data sheet).
