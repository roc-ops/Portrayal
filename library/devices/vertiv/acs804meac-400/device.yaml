gaps:
- what: dimensioned-drawing
  scope: [front, rear]
  reason: needs-drawing
  note: >-
    No dimensioned drawing, 3D model or stencil of the faces is held. Both faces are measured off the maker's
    photographs and every position is estimated (provenance `method`).
  wanted: A dimensioned front and rear view of the ACS800.
- what: four-port-rear
  scope: [rear]
  reason: vendor-silent
  note: >-
    No photograph or picture of the four-port unit's rear is held. The rear is the two-port photograph and the
    data sheet's eight-port picture, and the four jacks are the first two gangs of the eight-port picture.
  wanted: A photograph of the ACS804MEAC-400 rear.
- what: height
  scope: [front, rear, left, right]
  reason: sources-disagree
  note: >-
    The data sheet gives 1.161 in and the installer guide, Table A.2, 1.3 in, a difference of 3.5 mm. Width and
    depth agree. The data sheet's figure is used.
  wanted: The maker's height of the unit with and without its feet.
- what: weight
  scope: [front]
  reason: sources-disagree
  note: >-
    The data sheet gives 2.4 lb and the installer guide, Table A.2, 3.8 lb (1.72365 kg), which is 1.72 kg only if
    the pound figure is rounded. No weight is stated.
  wanted: The maker's weight for the ACS804MEAC-400.
- what: power
  scope: [rear]
  reason: sources-disagree
  note: >-
    The data sheet gives an external AC/DC adapter and a maximum of 28 W at 120 VAC and 240 VAC. The installer
    guide, Table A.2, gives an internal 100 to 240 VAC supply and 17 W maximum. The rear carries a 12VDC jack and
    the mounting guide tells the installer to place "the power supply" behind the unit, so the data sheet is
    used. The adapter is not drawn: no held document gives its size or its draw.
  wanted: The maker's power figures for the ACS804MEAC-400 and the adapter's part number.
- what: usb-numbering
  scope: [front]
  reason: vendor-silent
  note: >-
    The four front USB ports are not numbered on the unit. The upper port of the first block is drawn as 1.
  wanted: The maker's numbering of the USB ports.
- what: mounting-kits
  scope: [front, rear, left, right]
  reason: needs-drawing
  note: >-
    The mounting guide shows optional DIN rail, wall and 1U shelf kits that bolt to the bottom edge of the unit.
    No figure dimensions a bracket or a hole and no kit part number is held, so no kit is listed.
  wanted: The kit part numbers and a dimensioned drawing of each kit.
- what: top-bottom-sides
  scope: [top, bottom, left, right]
  reason: needs-drawing
  note: >-
    Only the front and rear are photographed straight on. The top is seen at a slant in both photographs as a
    plain lid with a small mark at the rear corner and no vents; no photograph shows the bottom or a side.
  wanted: Photographs or a drawing of the top, bottom and sides.
