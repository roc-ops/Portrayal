format: 1
kind: device
name: vra1000
version: 0.1.0
maturity: modelled
manufacturer: Vertiv
model: VRA1000
description: >-
  1U horizontal cable organizer with metal D rings, Vertiv VRA1000: a flat black plate the full
  width of the rack with four metal D rings that stand out of it and three oval openings between them. The
  rings hold bundles running along the plate. Sized, drawn and spaced from the maker's selection guide
  alone, which gives no dimension, so every figure of the drawing is an estimate.
profile: passive
provenance:
  method:
    confidence: estimated
    note: >-
      ESTIMATED FROM A SELECTION GUIDE. Vertiv's VR Rack selection guide, publication SL-11367 (Vertiv) (PDF page 7 for the part's picture and
      description, page 16 for its fit table) names the part "1U horizontal cable organizer with metal D rings (Qty. 1)", "Color: Black", and
      "19 in rack mounted". It prints no dimension, no weight and no drawing. The only picture is a
      raster of 198 x 117 px, a render seen at an angle, so the plate, the rings and the openings are read
      off it against the 19 in width and are estimates; where the picture does not show a feature
      (the plate's edges, the ring's fixing) none is drawn.
  chassis:
    confidence: estimated
    note: >-
      estimated - 482.6 x 44.45 x 76.5. Width is the 19 in of the guide's text (EIA-310), height the
      EIA-310 unit pitch for "1U", depth the ring reach scaled off the render (75.0) and a 1.5 mm
      plate. The plate is the whole width of the rack, its two ends the ears, so the face is drawn whole
      (L43 stands down above 480 mm).
  ears:
    confidence: estimated
    note: >-
      estimated - `positions` states where the ears bolt, for the Rack Builder: the ears are the flat ends
      of the plate, so the ear plane is the plate's back face and the rings stand 76.5 mm in front of it.
      This states a placement; no dimension changed.
  full-depth:
    confidence: estimated
    note: >-
      `full-depth: false` - the rings stand in front of the plate and nothing stands behind it, so the rear
      face of its rack unit stays free for another part.
  thickness:
    confidence: estimated
    note: >-
      estimated - no page states a gauge. 1.5 mm is taken for the plate and 5.0 mm for the ring rod.
  front:
    confidence: estimated
    note: >-
      estimated - the plate seen from the ring side: four rings end-on, 134.0 mm apart about the middle,
      and three oval openings midway between them, read off the guide's picture. All three openings show in the picture, partly behind the rings; they are drawn equal in length, where the picture's differ through perspective.
  rear:
    confidence: estimated
    note: >-
      estimated - the back of the plate: the four ear slots and the three openings. The picture does not
      show the back; it is the front's holes seen from behind, with no feature added.
  top:
    confidence: estimated
    note: >-
      estimated - an elevation, rear at the top of the drawing: the plate's edge and the four rings from
      above, each 10 mm across and standing 75 out of the plate's front face. The bottom is the same
      from underneath. The picture shows no edge fold, so none is drawn.
  left:
    confidence: estimated
    note: >-
      estimated - the side view: the plate's edge and a ring's profile in front of it, a frame 36.45 high
      with a foot, two rods and a closed end. The right is the same turned round.
  guides:
    confidence: estimated
    note: >-
      estimated - the four rings are the guides: each a component with a `ring` guide (see its contract),
      cables passing along the plate through each in turn.
  passes:
    confidence: estimated
    note: >-
      estimated - the three oval openings: a cable crosses through each from one side of the plate to the
      other. Their places and sizes are scaled off the picture. The guide states no limit on the cable that
      fits.
  capacity:
    confidence: estimated
    note: >-
      no page states a cable capacity: the guide is silent, so none is stated and a gap says so.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the colour (black) and the use ("cable routing panels with D rings", "in the front or
      rear of your rack") are the guide's text. The guide says only that the D rings are "metal" (page 7) and names no
      material for the plate, so `material` is not stated.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black". The picture is a render, so the shades are this library's render of a black
      plate, the rings a little lighter than the plate and the screw heads the grey the picture shows.
