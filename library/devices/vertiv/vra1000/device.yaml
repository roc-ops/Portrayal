gaps:
  - what: dimensions
    scope: [front, rear, top, bottom, left, right]
    reason: needs-drawing
    note: >-
      the selection guide states no dimension of the part: the plate, the rings, the openings and the ear
      holes are scaled off one picture of of 198 x 117 px.
    wanted: a dimensioned drawing or a data sheet of the VRA1000
  - what: weight
    reason: vendor-silent
    note: the selection guide states no weight.
    wanted: the part's data sheet
  - what: cable-capacity
    reason: vendor-silent
    note: >-
      the selection guide states no cable capacity, no fill and no cable count.
    wanted: a cable capacity table, or a stated fill, for the D-ring organizer
  - what: ring-extent
    scope: [front, left, right]
    reason: needs-drawing
    note: >-
      the picture shows each hook hanging below the plate's lower edge, by about a third of the plate's
      height scaled off the picture; the face of a part is bounded by its rack units, so the ring is drawn
      inside the plate's height and the part below it is not drawn.
    wanted: a dimensioned side view of the ring
  - what: ring-opening
    scope: [front, top, bottom, left, right]
    reason: needs-drawing
    note: >-
      the picture shows each ring as a rod bent to a hook with an open end; the format has no slit, and no
      page says how wide the opening is, so the loop is drawn closed.
    wanted: a close view or a section of a ring
