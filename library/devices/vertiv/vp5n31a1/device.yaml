format: 1
kind: device
name: vp5n31a1
version: 0.1.1
maturity: modelled
manufacturer: Vertiv
model: VP5N31A1
description: >-
  Vertiv PowerIT switched rack PDU with unit-level monitoring, 1U horizontal.
  It has a fixed input cord with an L6-30P plug and twelve combination C13/C19 outlets on the rear.
  The outlets sit in two groups of six, and each group has a circuit breaker on the front.
  The front also has twelve outlet lamps.
  An IMD-5M monitoring module has two Ethernet ports, a sensor port, a serial port, a USB port and a touchscreen.
profile: power
provenance:
  method:
    confidence: photo-measured
    note: >-
      NO DRAWING EXISTS, SO EVERY POSITION IS READ OFF THE TWO STRAIGHT-ON PHOTOGRAPHS. Searched: the SKU page,
      the rack PDU brochure SL-20881, the product line comparison SL-70599, the installer/user guide SL-71211
      Rev E (whose mounting figures 3.1 to 3.14 carry no dimension) and the quick installation guide SL-70646;
      none dimensions a face. vertiv-geist-switched-vp5n31a1_front.jpg and _rear.jpg are 1000 px square. The body
      reads 752 px across on the front and 764 on the rear for the SKU page's 17 in (431.8 mm), 1.74 and 1.77 px
      per mm. The face reads 71 to 73 px high for 1.72 in, 1.65 to 1.67 px per mm: the photographs look slightly
      down on the box, so vertical positions are good to about 1.5 mm and horizontal ones to about 0.7 mm. Nothing
      of known size is in frame to prove the scale a second way beyond the IMD-5M's RJ45 jacks, which read 16.6
      wide against the part's 15.8.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - the SKU page's table: "Height 1.72 in", "Width 17 in", "Depth 12 in" (43.7, 431.8 and 304.8 mm).
      No weight is stated in a maker document. The 17 in is the body between the ear folds, because both photographs show
      a body with no flange; the 19 in rack face is the ears, which are not drawn. The rack unit count is not
      stated for the SKU; the brochure p7 says the line is "1U and 2U Horizontal" and 1.72 in is a 1U height.
      Colour photo-measured: the face's median is about #3f3f3d on the front and #313131 on the rear.
  ears:
    confidence: datasheet
    note: >-
      NOT DRAWN, AND NO POSITION IS STATED. SL-71211 Rev E section 3 has fourteen bracket figures (3.1 to 3.14)
      and says a horizontal PDU takes brackets (7 in-lb), but none names a position as the unit ships or
      dimensions one (gaps: ear-positions).
  front:
    confidence: photo-measured
    note: >-
      photo-measured - front photograph, mm from the face's left and top. Two breakers whose frames are 32.1 wide
      and start 31.6 and 104.1 from the left, number tabs above them. Twelve outlet lamps in two rows, 14.5 and 29.7
      down, on a pitch of 8.6 from 254.3, numbered 1 to 6 above the upper row and 7 to 12 below the lower, with an
      orange bar 5.4 high at 19.4 down from 218 to 307 and a white disc, the maker's mark, centred at 235.9, on a label plate
      from 217.6 to 307.2 whose grey (#333331) is a shade darker than the face's #41413f. The
      IMD-5M plate from 308.8 across to 416.2. Four rivets round each breaker at the corners of a 41.9 by 19.8
      rectangle.
  rear:
    confidence: photo-measured
    note: >-
      photo-measured - rear photograph, mm from the face's left as seen from behind and from its top. The cord
      gland centred 23.0 across. Twelve combination outlets, 20.0 wide and 27.0 high, in two groups of six, the first
      outlet's left edge at 66.3 and the seventh's at 255.1, each group on a pitch of 27.0 (the six steps read 27.0
      on both groups, and one empty pitch stands between the groups). A grey tray round each group, 60.5 to 227.2 and
      252.7 to 416.6 across, with an orange or green tab above and below the outlets. 1 and 6 printed at the ends of
      the first group and 7 and 12 at the ends of the second.
  outlets:
    confidence: datasheet
    note: >-
      datasheet - the SKU page table "Combination C13/C19 (12)", the brochure p4 "(12) C13/C19 Combo". The page's
      meta description says "(36)", which is the brochure's figure for a vertical SKU and not this one; the rear
      photograph shows twelve. Each is vertiv/combo-outlet@1 (Table 2.4 and 3.2.2 of SL-71211 Rev E), numbered as printed.
  numbering:
    confidence: photo-measured
    note: >-
      photo-measured - the rear prints 1 and 6 at the corners of the first group and 7 and 12 at the corners of
      the second; the front prints 1 to 12 over and under its lamps. Outlets 2 to 5 and 8 to 11 carry no number on the rear
      and are numbered by the front's sequence. THE LAMPS ARE `for: chassis`, NOT FOR THEIR OUTLETS: the lamps are on the front and
      the outlets on the rear, and L14 takes a `for` only in the same view, so a state set on an outlet does not reach its lamp.
  breakers:
    confidence: photo-measured
    note: >-
      photo-measured and estimated - the front shows two breakers, numbered 2 (green tab) at the left and 1 (orange
      tab) at the right. The rear shows the outlets in two groups whose tabs are orange for 1 to 6 and green for 7
      to 12. THAT EACH GROUP RUNS THROUGH THE BREAKER OF ITS COLOUR IS A READING OF THE TWO PHOTOGRAPHS: no sentence
      held says it. The rating of the breakers is not stated in any held document.
  colours:
    confidence: photo-measured
    note: >-
      photo-measured - the rear tabs read #fb5311 (orange) and #177734 (green); the front's orange bar #fb6b0c. The
      outlet nose reads #777674 and the well #040404; the tray's top bezel #7f7976. The front card's plate and the
      breaker frames are dark grey, #232222 to #2b2b2a. Those two are estimates from a lit photograph.
  capability:
    confidence: datasheet
    note: >-
      datasheet - the brochure p4 calls it "Switched, Unit-Level Monitoring", and the comparison sheet SL-70599 marks the
      LCD for Monitored and Switched. So `metering-scope: input` (unit level) and `outlet-switching: true`, the
      class `switched-metered-input` (docs/pdu-model-design.md section 2.2). The IMD-5M's text says "phase, line, and
      circuit current values" on the touchscreen (SL-71211 Rev E p35); no document says branch metering is per
      breaker for this SKU, so the scope stays at the unit.
  input:
    confidence: datasheet
    note: >-
      datasheet - the SKU page prints "(30A, 200-240V)", a "power cord with a L6-30P plug" and "delivers 4.9 kW of power"
      in its description, and 50/60Hz in its table; the brochure p4 gives the input L6-30P. The cord is fixed because it
      leaves through a gland in the rear photograph, and `input-plug` is the slug the cord exports. The page does not
      say whether 30 A is the unit's or the plug's rating, so it is written as the unit's input current as printed. The
      brochure p7 calls the line "single phase electrical".
  module:
    confidence: datasheet
    note: >-
      datasheet - the module is vertiv/imd-5m@1 in a bay: SL-71211 Rev E 5.1.3 says all Monitored and Switched rPDUs ship
      with it. The SKU page's own image (vp51301_front.jpg) shows a different, LED-display card with three
      buttons; Rev C of the guide says previous versions shipped other modules. Which one a given unit carries is
      not stated (gaps: module-variant).
  dcim:
    confidence: datasheet
    note: >-
      the input is one power port from vertiv/rpdu-cord-l6-30p@1 (type `other`, label NEMA L6-30P, as no type is held
      for the plug, so `input-plug: other`; L167) and each outlet a power outlet from vertiv/combo-outlet@1 (type `other`, label Vertiv combination
      C13/C19). NO feed_leg IS WRITTEN: a single-phase PDU is on whatever leg its plug is on
      (docs/pdu-model-design.md section 5.2). The module's ports export on its own module type.
  lifecycle:
    confidence: datasheet
    note: >-
      no held document announces an end of life. Not searched on the web: nothing is fetched for this model.
attrs:
  power:
    input-ac: 200-240 V, 50/60 Hz, a fixed cord with an L6-30P plug
    input-plug: other
    input-cord: fixed
    input-phase: single
    input-voltage-v: 240
    input-current-a: 30
    capacity-kw: 4.9
    capacity-scope: the load the PDU can hand on, from the SKU page; it is not what the PDU draws itself
    frequency: 50/60 Hz
  environmental: {operating-temp: 60 C}
  management:
    metering-scope: input
    outlet-switching: true
    network-module: IMD-5M, dual Ethernet, RJ-12 sensor port, RS-232 serial on an RJ-45, USB, touchscreen
  physical: {construction: 'black powder-coat finish'}
  lifecycle: {eol: none-announced}
chassis:
  width: 431.8
  height: 43.7
  depth: 304.8
  ru: 1
  color: '#383836'
  airflow: passive
gaps:
- what: ear-positions
  scope: [front, rear]
  reason: needs-drawing
  note: >-
    SL-71211 Rev E section 3 and its figures 3.1 to 3.14 show brackets and none is dimensioned or names the position
    the unit ships in. The ears are not drawn and no position is stated.
  wanted: a dimensioned outline drawing, or the mounting section of the SKU's data sheet.
- what: weight
  scope: [front]
  reason: vendor-silent
  note: >-
    no held maker document states a weight for any PDU. A community listing says 6.35 kg, which is not the maker's.
  wanted: the SKU's data sheet.
- what: module-variant
  scope: [front]
  reason: sources-disagree
  note: >-
    SL-71211 Rev E and the comparison sheet say Switched units carry the IMD-5M, drawn here; the SKU page's own image
    shows a four-digit LED display with three buttons.
  wanted: which module the SKU ships with.
- what: outlet-lamp-colour
  scope: [outlet-leds]
  reason: vendor-silent
  note: >-
    no held document says what colour an outlet lamp shows or what it means; the photographs show them unlit and white.
    The `on` state is declared with no colour.
  wanted: a photograph of a powered unit.
- what: breaker-rating
  scope: [breakers]
  reason: vendor-silent
  note: >-
    the rating, poles and trip curve of the two breakers are in no held document.
  wanted: the SKU's data sheet or nameplate.
- what: tray-and-outlet-depth
  scope: [rear]
  reason: needs-drawing
  note: >-
    the outlet trays and the outlets' depth are drawn flat. No view shows the trays in section or from the side.
  wanted: a side photograph or a dimensioned drawing.
- what: unnamed-socket
  scope: [module]
  reason: vendor-silent
  note: >-
    Figure 5.2 shows a socket with a network symbol, a socket under the USB port (callout 5, "Redundant power input") and a
    vertical slot. No held text names the first or the slot or the connector of the second, so they are drawn as shapes.
  wanted: the IMD-5M's data sheet.
- what: display-class
  scope: [module]
  reason: vendor-silent
  note: >-
    the touchscreen states 128 by 128 and no character count; it is drawn as a screen without the display vocabulary,
    which needs one.
  wanted: the IMD-5M's data sheet.
- what: top-bottom-sides
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: >-
    no held photograph shows the top, the bottom or a side straight on; the front photograph shows the lid at a steep
    angle (a plain black lid). The four faces are drawn bare at the table's size.
  wanted: straight-on photographs of the four faces.
groups:
  outlets: {term: Outlet, role: traffic, index-origin: 1, attrs: {outlet: vertiv-combo}, description: 'the PDU''s 12 combination C13/C19 outlets, 1 to 6 and 7 to 12, numbered as printed; each switchable'}
  outlet-leds:
    term: LED
    role: indicator
    index-origin: 1
