  breakers: {term: Breaker, role: service, index-origin: 1, description: 'circuit breakers 1 and 2, each for one group of six outlets'}
  module: {term: Slot, role: management, index-origin: 1}
  power-input: {term: Input, role: service, index-origin: 1}
