gaps:
- what: chassis-width
  scope: [front, rear]
  reason: sources-disagree
  note: >-
    the data sheet prints 17 in (431.8 mm) and the image reads 447 mm between the ear folds at the scale its 19 in and 1U give.
    The drawing follows the image.
  wanted: a dimensioned outline drawing.
- what: ear-dimensions
  scope: [front, rear]
  reason: needs-drawing
  note: >-
    the chassis names one ear position, flush, as the images show it; the face views do not draw the ears. Their width and slot size
    are read off the images and stated in no document.
  wanted: a dimensioned outline drawing, or the mounting section of the installer guide for this model.
- what: round-lens
  scope: [front]
  reason: vendor-silent
  note: >-
    the front image shows a small round lens beside the POWER ON lamp. The sheet lists one lamp and names no other; what the lens is is
    not stated. It is drawn as a plain disc.
  wanted: the installer guide for this model.
- what: blank-plate
  scope: [front]
  reason: vendor-silent
  note: >-
    the grey rectangle on the front is drawn as the image shows it, blank. No document says what it is.
  wanted: the installer guide for this model.
- what: outlet-bezel
  scope: [rear]
  reason: needs-drawing
  note: >-
    the image shows each outlet in a rounded oval bezel; only the outlet face is drawn, at the library's borrowed size.
  wanted: a dimensioned drawing of the outlet.
- what: bushing-tab
  scope: [rear]
  reason: vendor-silent
  note: >-
    a small tab ring sits at the upper right of the cord bushing; its use is not stated.
  wanted: the installer guide for this model.
- what: colour
  scope: [front, rear, top, bottom, left, right]
  reason: sources-disagree
  note: >-
    the data sheet says "Black" and the body and ears are drawn black (about #1b1c1e, the near-black the library gives other black
    powder-coat parts; an estimate). The sheet's lit image reads the body at #54554f on the front and #555651 on the rear and the ears
    at #4b4a46, which is the lighting and not the finish. The plates, lens and bushing keep their image readings.
  wanted: a photograph of the unit under neutral light, or the swatch of the finish.
- what: top-bottom-sides
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: >-
    no held image shows the top, the bottom or an end of this model. The four faces are drawn bare at the sheet's depth.
  wanted: straight-on photographs of the four faces.
