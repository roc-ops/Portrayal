format: 1
kind: device
name: vp9562
version: 0.1.0
maturity: modelled
manufacturer: Vertiv
model: VP9562
description: >-
  Vertiv Geist basic rack PDU, 1U horizontal, 100 to 120 V, 15 A, 1.4 kW. It has a fixed 10 ft input cord with a NEMA 5-15P plug.
  Ten NEMA 5-15R outlets sit in a row on the rear, behind one 15 A thermal breaker.
  The front has a power lamp, a blank label plate and the breaker button.
profile: power
provenance:
  method:
    confidence: photo-measured
    note: >-
      NO DRAWING EXISTS, SO EVERY POSITION IS READ OFF THE TWO STRAIGHT-ON IMAGES ON PAGE 1 OF THE DATA SHEET SL-26159. Searched: the data
      sheet, the Geist rack PDU installer/user guide (whose figures 2.1 to 2.14 are generic bracket and cord-lock pictures, and whose figures 3.1
      to 3.3 show monitoring modules, none of this unit), the VP7553 and VP7557 data sheets (text only) and the Geist brochure. The front
      image is 815 px wide and the rear 815 px; each was extracted from the PDF at its own resolution. The scale is the 19 in ear-to-ear width,
      791 px on the rear (1.639 px per mm) and 800 px on the front (1.658), and it is confirmed three ways on the rear: the 1U height reads
      73 px, 44.5 mm; the two ear holes read 52 px apart, 31.7 mm (31.75 is the EIA hole pitch within a unit); and the figure is a flat view.
      Horizontal positions are good to about 1 mm and vertical ones to about 1.5 mm. No 3D model and no stencil is held.
  chassis:
    confidence: photo-measured
    note: >-
      photo-measured - the body between the ear folds reads 733 px on the rear, 447 mm, and the face 73 px high, 44.5 mm, taken as 1U (44.45).
      THE DATA SHEET PRINTS 1.72 in x 17 in x 3.75 in (43.7, 431.8 and 95.3 mm) and the image reads 447 mm across: the two disagree by 15 mm
      (gaps: chassis-width). The photograph is the source here because every position is measured on it, and the sheet's inch figures read low
      against its own 1U and 19 in. The depth is the sheet's 3.75 in. The colour is the sheet's "Black" (see the colour gap).
  ears:
    confidence: photo-measured
    note: >-
      photo-measured - the images show an ear at each end, about 17 mm wide, flush with the rear face, each with two slots 13 mm by 7.5 mm
      on the 31.7 mm pitch. The sheet says "Flush Mount Yes". No document dimensions the ear (gaps: ear-dimensions).
  front:
    confidence: photo-measured
    note: >-
      photo-measured - front image, mm from the body's left fold and its top. A dark navy plate with the maker's mark from 292.1 to 331.4
      across and 7.0 to 24.1 down. A small round lens centred 340.3 across and 15.9 down, 6.7 across. A dark square lamp plate from 350.0 to
      367.1 across and 7.6 to 24.1 down, with the green POWER ON lamp in it, centred 358.5, 15.9 (the sheet: "1 - Power ON Green LED"). A grey
      blank plate from 373.6 to 389.3 across and 7.6 to 37.8 down. The breaker button, 13.9 across, centred 406.0 across and 21.6 down.
  rear:
    confidence: photo-measured
    note: >-
      photo-measured - rear image, mm from the body's left fold as seen from behind and from its top. Ten outlets in one row, centred 20.4
      down, the first at 26.4 across and then every 39.68 (the nine steps read 585 px, 65.0 px each, 39.7 mm; the last is at 383.5). Each is a
      rounded oval bezel 28.9 mm across and 35.1 mm high with its earth hole to the right, so the outlet is turned a quarter. A screw between
      each pair, 4.5 mm across, centred 20.1 down and half a pitch from the outlets either side. The cord bushing, 27.5 by 26.4, centred
      429.7 across and 21.8 down.
  outlets:
    confidence: datasheet
    note: >-
      datasheet - SL-26159 page 2: "Receptacle/Socket Type #1 NEMA 5-15R", "Quantity on Rear 10", "Quantity per Breaker 10", "Style Duplex",
      "Maximum Output per Receptacle/Socket 15A", "Voltage per Receptacle/Socket 120V". Each is std/nema-5-15r@1, whose face is borrowed from
      the 5-20R; the oval bezel round it is not drawn. The sheet's style "Duplex" is not explained and the rear image shows ten single
      receptacle faces, which is the count the sheet gives. They carry no number on the image, so they are numbered 1 to 10 from the left of
      the rear image.
  breakers:
    confidence: datasheet
    note: >-
      datasheet - "Over Current Protection 15A Thermal Breaker", "Quantity per Breaker 10": one breaker for all ten outlets, the round button
      with 15 on the front image.
  colours:
    confidence: datasheet
    note: >-
      The body and the ears are drawn black (about #1b1c1e, an estimate): the sheet says "Black" and offers other chassis colours
      (black, red, orange, yellow, green, blue, white swatches) on request. The sheet's lit image reads the body at #54554f on the front
      and #555651 on the rear and the ears at #4b4a46, which is the lighting and not the finish. The bushing #85847f with a #0a0a09 bore,
      the maker's plate #121727, the blank plate #868580 and the lamp plate #4a4948 are photo-measured medians of that image.
  capability:
    confidence: datasheet
    note: >-
      datasheet - "Category Basic", "Switch No", one green power lamp, no network port: no metering and no outlet switching.
  input:
    confidence: datasheet
    note: >-
      datasheet - "Quantity Of Inputs 1", "Voltage 100-120V", "Current 15A", "VA per Input (Load Capacity) 1.4kW (120V)", "Plug Type NEMA
      5-15P", "Power Cable Length 10ft", "Power Cable Wire Gauge 14/3", frequency 50/60 Hz. The cord is fixed: the rear image shows it
      leaving through a bushing. The 1.4 kW is the sheet's figure and is not the 1.8 kW of 120 V at 15 A.
  lifecycle:
    confidence: datasheet
    note: >-
      no held document announces an end of life. Not searched on the web: nothing is fetched for this model.
