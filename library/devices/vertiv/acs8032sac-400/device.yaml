format: 1
kind: device
name: acs8032sac-400
version: 0.1.0
maturity: modelled
manufacturer: Vertiv
model: ACS8032SAC-400
portfolio: {line: Console servers, family: Avocent ACS8000}
description: >-
  Vertiv Avocent ACS8000 advanced console server, the 32-port single-AC unit, 1U. It has 32 RJ45 serial
  ports, an RJ45 console port, two 10/100/1000 RJ45 LAN ports and two SFP cages. The maker's front
  carries one AC inlet with its power switch. It also has a digital-in jack, a sensor jack, six USB ports and an
  SD card slot. On the rear it carries the serial ports, the console port, two more USB ports, the LAN ports and three lamps.
  The first two serial ports take RS-232, RS-422 or RS-485. The AC inlet is on the face the rack
  mounting guide fits the brackets to, so it is the front here.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Avocent ACS8000 Advanced Console Server data sheet AV-12339 (08/22): ordering table (the -400 part
      numbers), hardware specifications, power usage and dimensions. The EMEA edition of the data sheet
      (the -404 part numbers) and the APAC edition AV-12339-APAC (07/24) carry the same specifications and
      the same dimensions. Avocent ACS8000 Advanced Console System Quick Installation Guide 590-1483-501E,
      page 1 figure: the numbered callouts and the note that some models have no SD, modem, USB or sensor
      ports on the front. Avocent ACS8000 Advanced Console System Rack Mounting Guide 590-1510-501C, page 1
      and 2 figures: the 1U and 0U brackets. Vertiv Avocent ACS800/8000 Installer/User Guide (PDF built
      2025-03-05), Tables 1.1 to 1.5: the callouts, the multi-protocol ports, the status lamps and the serial
      lamp states. The maker's product photographs of the single-AC front and of the 8, 16, 32
      and 48-port rear faces. No dimensioned drawing, 3D model or stencil is held.
  method:
    confidence: estimated
    note: >-
      NO DRAWING IS HELD, SO EVERY POSITION ON BOTH FACES IS MEASURED OFF THE MAKER'S PHOTOGRAPHS AND IS
      ESTIMATED. The rear is the 16-port photograph (3600 x 2327 pixels), taken near straight on: the face is
      3280 pixels across for the 438.15 mm body, 7.486 pixels per millimetre. That scale is a feature of
      stated size and is checked by a second quantity: the serial jack pitch reads 105.3 pixels in that photograph
      and 25.0 pixels at 1.767 pixels per millimetre in the 48-port photograph, 14.07 and 14.15 mm. A rear
      position is good to about 0.5 mm across and 1 mm down. The front is the single-AC photograph (800 x 600
      pixels, 1.767 pixels per millimetre across the same width): its positions are good to about 1 mm. Down the
      face both photographs look slightly down on the unit, so every y is taken from the bottom edge of the
      face with the same scale, which leaves a black lip 4.5 mm deep along the top of both faces. Counts and
      colours are read directly. The 32-port and 48-port rear photographs are 800 x 600 and are used for the
      run lengths and the gutters only; every y and the left cluster are the 16-port photograph's.
  chassis:
    confidence: datasheet
    note: >-
      17.25 W x 9.5 D x 1.75 H in (43.82 x 24.13 x 4.45 cm), one figure for the line on every edition of the
      data sheet (the data sheet's own order is W x D x H). Converted to 438.15 x 241.3 x 44.45 mm. 438.15 is
      the body without brackets: the rack mounting guide fits them as separate parts (1U page, step 1). The
      data sheets give 6.4 to 7.2 lb for the line and no weight per model, so none is stated.
  colour:
    confidence: photo-measured
    note: >-
      medians of the photographs: the front face #313131 with an orange trim line along its bottom edge
      #f2ab49, the rear face plate #d4d4d4 inside a black lip #202020.
  front-layout:
    confidence: estimated
    note: >-
      From the single-AC front photograph. The inlet module sits at the left with the power switch above the
      inlet; the inlet is a C14 turned a quarter turn, as the photograph shows its three contacts. The
      printed Vertiv mark and wordmark start 67.5 mm in; the product name Avocent ACS8000 ends 6.2 mm from
      the right edge. DIGITAL IN and SENSOR are RJ45 jacks in white bezels, 24.3 mm apart. The six USB ports
      are three stacked pairs in silver frames 19.7 mm apart, under a bracket that carries the USB symbol.
      The SD card slot is a strip 25.2 mm long under the printed SD CARD. The small symbols printed beside the
      two caution triangles are too small to read in an 800 x 600 photograph and are not drawn.
  rear-layout:
    confidence: estimated
    note: >-
      From the 16-port rear photograph. At the left: LAN 1 over LAN 2 as two RJ45 jacks in one white plate,
      each with a green lamp at the left and a yellow lamp at the right; then two SFP cages one above the
      other in a grey frame; then the console jack over two stacked USB ports in a white plate. The
      serial jacks follow in two rows, a ganged shell per run of columns: 4 columns in the 8-port model, then
      4, 4, 8 and 8 as ports are added, 14.07 mm between columns and 6.24 mm between runs. Each jack
      carries a green lamp and a yellow lamp. The three lamps STATUS, P1 and P2 are at the right edge.
  port-numbering:
    confidence: estimated
    note: >-
      Printed numbers 1 to 32 on tabs under the jacks, a pair under each column: the odd number on a white
      tab at the left and the even number on a black tab at the right. Which jack of a column takes which number is
      not shown by any held document; the upper jack is taken as the odd port and the lower as the even.
      That assignment is an estimate. Ports 1 and 2 sit under the printed MULTI PROTOCOL bracket, the first
      column, and the Quick Installation Guide says the first two ports are multi-protocol.
  serial-ports:
    confidence: datasheet
    note: >-
      Data sheet hardware specifications: up to 48 RS-232 serial ports on RJ45, the first two selectable
      between RS-232, RS-422 and RS-485, one RS-232 console port on RJ45. The data sheets give an automatic
      Cyclades and Cisco pin-out conversion as a benefit.
  lamps:
    confidence: datasheet
    note: >-
      Installer/User Guide Table 1.2: the STATUS lamp is green when the unit is fully booted, P1 green when
      power supply 1 is on, P2 green when power supply 2 is on. Table 1.5 gives each serial jack a green and a yellow
      lamp, with the meanings written under each lamp. This unit has one supply and the photographs of the
      rear carry both P1 and P2: the rear photographs do not name their model and P2 is drawn as printed.
  power:
    confidence: datasheet
    note: >-
      Data sheet power usage: nominal 120 VAC typical 0.13 A and 6.2 W, maximum 0.47 A and 28 W; nominal 240
      VAC typical 0.10 A and 7 W, maximum 0.29 A and 28 W. 28 W is the maximum at both voltages and is
      filed as `power-max-w`; the two typical figures differ by voltage and are in `power-usage`. The inlet
      is printed 1X - 100 - 240V, 1A, 50/60 Hz.
  ears:
    confidence: drawing
    note: >-
      Rack Mounting Guide 590-1510-501C, page 1, the 1U figure: the two brackets are fixed to the sides at the
      inlet face, standing at the front plane, so the shipped position is flush. The guide numbers no part for
      the brackets and no figure dimensions them. Page 2 shows a 0U mount with brackets in one of three
      slots; it is not modelled (gaps). The ears are not drawn.
  sku:
    confidence: datasheet
    note: >-
      The data sheet ordering table lists the part as "32-port unit single AC power supply". The
      other ACS8000 part numbers (dual AC, DC, modem, cellular) are not modelled by this device, and
      the rear photographs do not name their model.
attrs:
  physical:
    weight-note: 6.4 to 7.2 lb for the line (data sheet); no weight is given for this model
  power:
    power-max-w: 28
    power-input: 100 to 240 VAC, 50/60 Hz, 1 A, one C14 inlet (inlet legend and data sheet)
    power-usage: typical 6.2 W (0.13 A) at 120 VAC and 7 W (0.10 A) at 240 VAC; maximum 28 W at both (data sheet)
  platform:
    cpu: Dual-core ARM Cortex-A9 MPCore with CoreSight
    ram: 1 GB DDR3L
    storage: 16 GB eMMC flash
  environmental:
    operating-temp-c: -10 to 60
    storage-temp-c: -20 to 70
    operating-humidity: 20% to 80% non-condensing RH
    storage-humidity: 5% to 95% non-condensing RH
  features:
    serial-pinout: automatic Cyclades and Cisco pin-out conversion (data sheet)
    optics-sfp: 1 Gb SFP fibre modules (data sheet benefits, "Integrated support for 1Gb SFP fiber modules")
    sensor-ports: environmental sensor port (RJ45, 1-wire) and four digital-in ports on the one DIGITAL IN jack (data sheet)
  compliance:
    certification: >-
      Emissions and immunity: FCC Class A, CE Class A, ICES-003, VCCI, RCM, KCC, BSMI, UKCA. Safety: UL, cUL,
      EN/IEC 62368-1, BSMI, BIS, NOM, UKCA. The cellular approvals are for cellular models (data sheet).
