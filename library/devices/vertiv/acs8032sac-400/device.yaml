gaps:
- what: dimensioned-drawing
  scope: [front, rear]
  reason: needs-drawing
  note: >-
    No dimensioned drawing, 3D model or stencil of the faces is held. Both faces are measured off the
    maker's photographs and every position is estimated (provenance `method`).
  wanted: A dimensioned front and rear view of the ACS8000.
- what: jack-numbering
  scope: [rear]
  reason: vendor-silent
  note: >-
    The numbers are printed on tabs under each column and no held document says which of the two jacks above
    a tab takes which number. The upper jack is drawn as the odd port.
  wanted: The maker's port numbering for the two rows.
- what: caution-symbols
  scope: [front]
  reason: needs-drawing
  note: >-
    Two small symbols are printed beside the caution triangles on the front. The 800 x 600 photograph does not
    resolve them, so they are not drawn.
  wanted: A larger front photograph or a drawing of the legend.
- what: zero-u-mount
  scope: [front]
  reason: needs-drawing
  note: >-
    The rack mounting guide shows a 0U mount (page 2) with the brackets on any of three slots to suit the rack
    depth. No figure dimensions the brackets or the slots, so no ear position is written for it.
  wanted: A dimensioned drawing of the 0U brackets.
- what: top-bottom-sides
  scope: [top, bottom, left, right]
  reason: needs-drawing
  note: >-
    Only the front and rear are photographed straight on. The top is seen at a slant in the photographs and shows a
    plain lid with small screw heads; no photograph shows the bottom or a side.
  wanted: Photographs or a drawing of the top, bottom and sides.
- what: weight
  scope: [front]
  reason: vendor-silent
  note: >-
    The data sheets give 6.4 to 7.2 lb for the line and no weight per model.
  wanted: The maker's weight for this model.
