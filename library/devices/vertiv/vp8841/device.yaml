format: 1
kind: device
name: vp8841
version: 0.1.0
maturity: modelled
manufacturer: Vertiv
model: VP8841
description: >-
  Vertiv Geist unit-level monitored rack PDU, vertical, 208 V, 30 A, 4.9 kW. It has a fixed 10 ft input cord with a NEMA L6-30P
  plug. Thirty-six IEC C13 and six IEC C19 outlets sit on the front, in two circuits of eighteen C13 and three C19. Each circuit has
  one 20 A double-pole magnetic breaker. A monitoring module with two Ethernet ports and a four-digit display sits between the
  circuits.
profile: power
provenance:
  method:
    confidence: photo-measured
    note: >-
      NO DRAWING EXISTS, SO EVERY POSITION ALONG THE STRIP IS READ OFF THE STRIP ON PAGE 1 OF THE DATA SHEET, 815 by 85 px. The body
      reads 807 px for 1778 mm (2.203 mm per px). It reads 22 px across for 50.8 mm (2.31), so the scale agrees two ways. Each position
      is good to about 2 mm along the strip and about 3 mm across it. No 3D model and no stencil is held for any Vertiv rack PDU.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - the page 3 line "Chassis Dimensions (LxWxD) 70in x 2in x 2in": 1778 long, 50.8 wide and 50.8 deep. The figures are
      whole inches and the strip reads 48.5 mm across, so the cross-section is good to a few millimetres. Page 1 gives "70in / 1778mm,
      Vertical". The unit is 0U, so the rack unit count is the length divided by 44.45.
  front:
    confidence: photo-measured
    note: >-
      photo-measured - the outlet face. The source lies the strip on its side with the cord end on the right. The drawing stands it up
      with the cord end at the bottom (gaps: orientation). Distances are along the strip from the far end. Across the strip every
      feature is centred, which the strip shows to about 3 mm. The lighter tray round each bank of six C13 and the lighter plate round
      each C19 are drawn as plates.
  module:
    confidence: photo-measured
    note: >-
      photo-measured - between the circuits a dark block 48 px (106 mm) long holds two Ethernet jacks. Two smaller jacks and a USB port
      sit above them. It also holds a display and three round keys. It is the vertiv/geist-imd@1 module, a reading of the strip against
      the photograph on page 7 of the Geist rack PDU brochure (gaps: module-identity).
  outlets:
    confidence: datasheet
    note: >-
      datasheet - page 2 lists "IEC C13": 36 on the face, 18 per breaker, in banks of 6, 208 V. It lists "IEC C19": 6 on the face, 3 per
      breaker, individual, 208 V. The strip shows six banks of six C13 and six C19, one before each bank, which agrees. Each outlet is
      std/c13-outlet@1 or std/c19-outlet@1 at the part's own size. The sheet gives no numbering, so the outlets are numbered from the
      far end (gaps: numbering).
  circuits:
    confidence: estimated
    note: >-
      estimated - the sheet gives eighteen C13 and three C19 per breaker and does not say which. The first circuit is taken as the three
      banks before the module and the second as the three after it. A breaker stands beside each three.
  orientation:
    confidence: estimated
    note: >-
      estimated - the strip is too small to show which end of each C13 is chamfered. It does not show which way a C19 earth slot faces.
      Every outlet is drawn at the part's own orientation.
  colours:
    confidence: datasheet
    note: >-
      The body is drawn black, about #1b1c1e (an estimate): the sheet says "Black" and lists seven chassis colours on request. The strip
      reads the plain body at #5c5c57 (576 px) and the module plate at #2f2f2b (151 px). It reads the cord ring at #51514f (360 px) and
      an outlet well at #161712 (200 px). The two actuators read #ead963 (16 px) and #e7d962 (15 px), and the display window #a35856 (44
      px). The lit reads are the lighting and not the finish. The trays and plates are drawn a little lighter than the body, as the
      strip shows them. The module plate reads darker than the body, so the same lighting reading is applied to it. It is drawn at
      the body's colour and no lighter.
  capability:
    confidence: datasheet
    note: >-
      datasheet - page 2 lists "Monitoring Level 1" as phase monitoring and "Monitoring Level 2" as circuit and breaker monitoring, so
      `metering-scope: branch`. "Switch Breaker/Switch Combination" describes the breakers. The sheet prints "Monitored" on page 1 and
      lists no outlet switching, which is read here as none.
  input:
    confidence: datasheet
    note: >-
      datasheet - "Voltage 200-240V", "Current 30A", "4.9kW (208V)", 50/60 Hz, one input. The cord is 10 ft (3 m) of 10/3 wire. The plug
      is "NEMA L6-30P Twistlock" and the power entry is "Bottom Front". The cord is fixed: the strip shows it leaving through a ring at
      the bottom end.
  mounting:
    confidence: datasheet
    note: >-
      datasheet - the sheet lists the 7938 vertical mounting bracket kit. It lists tool-free hardware at 61.25 in and 64.75 in centre to
      centre (1556 and 1645 mm). No kit part is modelled, because no held document gives the shape of the bracket. Neither the sheet
      nor the strip shows the mounting buttons of that hardware, so none is drawn (gaps: other-faces).
  lifecycle:
    confidence: datasheet
    note: >-
      no held document announces an end of life. Nothing is fetched for this model.
attrs:
  power:
    input-ac: 200-240 V single-phase, 30 A, 50/60 Hz, a fixed 10 ft cord with a NEMA L6-30P plug
    input-plug: other
    input-cord: fixed
    input-phase: single
    input-voltage-v: 208
    input-current-a: 30
    capacity-kw: 4.9
    capacity-scope: the load the PDU can hand on, from the data sheet; it is not what the PDU draws itself
    frequency: 50/60 Hz
    breakers: two 20 A double-pole magnetic breakers, one per circuit
  environmental: {operating-temp: up to 60 C (140 F)}
  physical: {length-mm: 1778, shipping-weight-kg: 7.26, construction: 'heavy steel with a black powder-coat finish'}
  management: {metering-scope: branch, outlet-switching: false, network-module: 'dual 10/100/1000 Mbps Ethernet, one remote sensor jack, RS-232 on an RJ-45, USB, four-digit display'}
  compliance: {certifications: 'FCC Part 15 Class A, RoHS, UL and c-UL Listed 62368-1'}
  lifecycle: {eol: none-announced}
chassis:
  width: 50.8
  height: 1778
  depth: 50.8
  ru: 40
  mount: rack-side
  color: '#1b1c1e'
  airflow: passive
gaps:
- what: other-faces
  scope: [rear, top, bottom, left, right]
  reason: needs-photo
  note: >-
    the sheet shows the outlet face only. No held image shows the back, the two ends or the two sides. The sheet lists outlets on the
    front face only, so the back is not drawn as a copy of it.
  wanted: straight-on photographs of the back, both ends and the sides, or an outline drawing.
- what: orientation
  scope: [front]
  reason: vendor-silent
  note: >-
    the sheet lies the strip on its side and says only "Vertical". The drawing stands it with the cord end at the bottom, where the
    sheet puts the power entry.
  wanted: a photograph of the unit mounted.
- what: outlet-orientation
  scope: [front]
  reason: needs-drawing
  note: >-
    the strip is too small to show which end of each C13 is chamfered. It does not show which way a C19 earth slot faces. Every outlet
    takes the part's own orientation.
  wanted: a larger photograph of the outlet face.
- what: numbering
  scope: [front]
  reason: vendor-silent
  note: >-
    no held document numbers the outlets. They are numbered from the far end, one count across the C13 and the C19.
  wanted: a photograph that shows the printed numbers, or the installer guide for this model.
- what: circuit-assignment
  scope: [front]
  reason: vendor-silent
  note: >-
    the sheet gives eighteen C13 and three C19 per breaker and does not say which outlets each breaker feeds. The split is estimated
    by position.
  wanted: the installer guide for this model, or a photograph of the circuit marks.
- what: module-identity
  scope: [front]
  reason: sources-disagree
  note: >-
    the sheet names no module. The strip shows two Ethernet jacks, two small jacks, a USB port, a display and three keys, which is the
    module in the brochure photograph. The guide's figures of the IMD-02X and IMD-02E show no USB port, and the guide gives 10/100 Mb
    Ethernet where the sheet gives 10/100/1000 Mbps. The guide lists a proprietary RJ-45 port for future expansion on the IMD-02E. It
    is read here as the sheet's RS-232 port, and that is a reading. The drawing follows the sheet and the brochure photograph, and the
    part is named for what it is and not for a model.
  wanted: the maker's page for this module, or a larger photograph of it.
- what: module-detail
  scope: [front]
  reason: needs-photo
  note: >-
    the strip shows the module 48 px long. The brochure photograph, of another unit, gives the jack and key positions, read to about 1
    mm. The module's label and the symbols beside the jacks are only partly legible. A black square is drawn at each end of the
    module, by measurement against the strip at 12x and the photograph. A seam between the jack panel and the display panel is drawn
    as a thin line at about 59 mm. The serial jack is drawn as a full RJ-45, as the guide's Figure 3.3 names the second jack for the
    IMD-02E. The strip and the photograph show two identical small jacks. Both are drawn light where the strip shows them dark. The USB tongue comes from a fixed library part that draws it
    blue, where the strip shows it pale. The two Ethernet jacks are separate tiles of a fixed library part, where the photograph
    shows one frame.
  wanted: a larger photograph of the module on this unit.
- what: sensor-count
  scope: [front]
  reason: sources-disagree
  note: >-
    the sheet gives one remote sensor jack that supports up to 16 sensors. The guide, Table 3.5 row 6 on PDF page 26, says GU
    Enhanced Monitored PDUs support one sensor at a time. The sources differ. The module draws one sensor jack, and the device's
    data holds no sensor count.
  wanted: the installer guide for this model, or the maker's statement of the count.
- what: section
  scope: [front, top, bottom]
  reason: sources-disagree
  note: >-
    the sheet gives the section as a whole 2 in by 2 in, which is 50.8 mm. The strip reads about 48.5 mm across. The device takes the
    sheet's figure.
  wanted: an outline drawing with the section in millimetres.
- what: marks-and-text
  scope: [front]
  reason: needs-photo
  note: >-
    the maker's mark and the printed labels, including the breaker labels, are left to a later touch. The windows that carry them are
    drawn. The strip also shows small dots near the two ends and a dot beside the module at about x 409 of the strip. It shows
    specks along the top edge and faint marks too. Each is 1 to 2 px, which is too small to place.
  wanted: a larger photograph of the front.
- what: colour
  scope: [front]
  reason: sources-disagree
  note: >-
    the sheet says black and the body is drawn black, an estimate. The strip reads the body as a mid grey, which is the lighting. The
    strip reads the display window red. It is drawn unlit, as every display is by default.
  wanted: a photograph under neutral light, or the swatch of the finish.
groups:
  outlets: {term: Outlet, role: traffic, index-origin: 1, mixed: 'the 42 outlets on the front, 36 IEC C13 and 6 IEC C19. They are numbered from the far end. The sheet gives no numbering.'}
  breakers: {term: Breaker, role: service, index-origin: 1, description: 'the two 20 A double-pole magnetic breakers, one per circuit'}
  module: {term: Slot, role: management, index-origin: 1}
  power-input: {term: Input, role: service, index-origin: 1}
