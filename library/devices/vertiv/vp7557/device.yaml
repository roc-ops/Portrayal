format: 1
kind: device
name: vp7557
version: 0.1.0
maturity: modelled
manufacturer: Vertiv
model: VP7557
description: >-
  Vertiv Geist basic rack PDU, vertical, 230/400 V three-phase, 16 A, 11.0 kW. It has a fixed 3 m input cord with an IEC 60309
  3P+N+E plug. Thirty-six IEC C13 outlets in six banks of six and six IEC C19 outlets sit on the front. Each phase feeds twelve C13
  and two C19. The unit has no breaker and no meter.
profile: power
provenance:
  method:
    confidence: photo-measured
    note: >-
      NO DRAWING EXISTS, SO EVERY POSITION ALONG THE STRIP IS READ OFF THE 800 BY 600 PX PHOTOGRAPH OF THE VP7557
      (800X600-VP7557-249228.JPG). The strip's 1683 mm reads 736 px (2.29 mm per px). Its 51 mm width reads 22 px (2.32), so the scale
      agrees two ways. Each position is good to 2 to 3 mm and each size across the strip to about 3 mm. No 3D model and no stencil of
      any Vertiv rack PDU is held.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - the page 2 line "Dimensiones del chasis (Al. x An. x Pr.) 1.683 mm x 51 mm x 51 mm": 1683 long, 51 wide and 51 deep.
      The sheet's page 1 gives the length as "66 pulgadas (1.683 mm)", and 66 in is 1676.4 mm (gaps: length-66-in). The drawing uses the
      chassis line. The sheet says "Montaje en rack vertical". The drawing treats it as 0U, so the rack unit count is the length
      divided by 44.45, rounded up.
  front:
    confidence: photo-measured
    note: >-
      photo-measured - the outlet face. The source lies the strip on its side with the cord end on the right. The drawing stands it up
      with the cord end at the bottom (gaps: orientation). Distances are along the strip from the far end. Across the strip every
      outlet, bezel and plate is centred, which the photograph shows to about 2 mm. The bezel behind each outlet group is drawn as a
      plate. Each small window after an outlet run is drawn as a plate with a light rim and a pale bar (gaps: label-windows).
  outlets:
    confidence: datasheet
    note: >-
      datasheet - page 1 lists "IEC C13": 36 on the front face, 12 per phase, in banks of 6, 10 A per bank. It lists "IEC C19": 6 on the
      front face, 2 per phase, individual, 16 A. The photograph shows six banks of six and six C19, which agrees. Each outlet is
      std/c13-outlet@1 or std/c19-outlet@1 at the part's own size. The sheets give no numbering, so the outlets are numbered from the
      far end (gaps: numbering).
  circuits:
    confidence: estimated
    note: >-
      estimated - the sheet gives twelve C13 and two C19 per phase and does not say which. Phase 1 is taken as the two C19 and two banks
      nearest the far end, then phases 2 and 3 in order.
  orientation:
    confidence: estimated
    note: >-
      estimated - the picture is too small to show which end of each C13 is chamfered. It does not show which way a C19 earth slot
      faces. Every outlet is drawn at the part's own orientation.
  colours:
    confidence: datasheet
    note: >-
      The body is drawn black, about #1b1c1e (an estimate): the sheet says "Negro", black electrostatic paint. The photograph reads the
      plain body at #5c5c5a (352 px), the maker plate at #464646 (96 px) and the gland centre at #25262a (64 px). The picture reads
      lighter than "Negro", and the difference is taken as the lighting and not the finish. The bezels are drawn a little lighter than
      the body and the maker plate a little darker, as the picture shows them.
  capability:
    confidence: datasheet
    note: >-
      datasheet - the sheet prints only "Básica" for the type. The brochure "Vertiv™ Geist™ Product Overview" (SL-70412), page 4, marks
      no current meter and no network interface for Basic. Its text gives a digital display to Metered units. The sheet lists no
      overcurrent protection and no switch.
  input:
    confidence: datasheet
    note: >-
      datasheet - "230/400 V WYE", "Corriente 16 A", 11.0 kW, 50/60 Hz, one input. The cord is 3 m of 2.5 mm2 H07RN-F. The plug is
      "IEC60309 3P + N + E, 16 A, 230/400 V", splashproof IP44. The cord is fixed: the sheet lists a cord with its plug, and the photograph shows a gland at the end of the strip.
  mounting:
    confidence: datasheet
    note: >-
      datasheet - the sheet lists the vertical mounting bracket kit 7938 and tool-free metal mounting parts at 1556 mm and 1645 mm
      centre to centre. Neither the sheet nor the picture shows the mounting buttons, so none is drawn (gaps: other-faces).
  lifecycle:
    confidence: datasheet
    note: >-
      no held document announces an end of life. Nothing is fetched for this model.
attrs:
  power:
    input-ac: 230/400 V three-phase wye, 16 A, 50/60 Hz, a fixed 3 m cord with an IEC 60309 3P+N+E plug
    input-plug: other
    input-cord: fixed
    input-phase: three
    input-wiring: wye
    input-voltage-v: 400
    input-current-a: 16
    capacity-kw: 11.0
    capacity-scope: the load the PDU can hand on, from the data sheet; it is not what the PDU draws itself
    frequency: 50/60 Hz
    breakers: none
  environmental: {operating-temp: 10 to 45 C (50 to 113 F)}
  physical: {length-mm: 1683, construction: 'high-strength steel with a black electrostatic paint finish'}
  management: {metering-scope: none, outlet-switching: false}
  compliance: {certifications: 'RoHS, CE, EN 55032, EN 55024, IEC 60950-1'}
  lifecycle: {eol: none-announced}
chassis:
  width: 51
  height: 1683
  depth: 51
  ru: 38
  mount: rack-side
  color: '#1b1c1e'
  airflow: passive
gaps:
- what: length-66-in
  scope: [front]
  reason: sources-disagree
  note: >-
    the sheet's page 1 prints 66 in (1.683 mm) and 66 in is 1676.4 mm. Its chassis line prints 1683 mm. The drawing follows the
    chassis line.
  wanted: a dimensioned outline drawing.
- what: other-faces
  scope: [rear, top, bottom, left, right]
  reason: needs-photo
  note: >-
    the sheet shows the outlet face only. No held image shows the back, the two ends or the two sides. The sheet lists outlets on the
    front face only, so the back is not drawn as a copy of it. The other five faces are drawn bare at the chassis size.
  wanted: straight-on photographs of the back, both ends and the sides, or the installer guide for this model.
- what: orientation
  scope: [front]
  reason: vendor-silent
  note: >-
    the sheet lies the strip on its side and says only "Vertical". The drawing stands it with the cord end at the bottom, which is an
    assumption.
  wanted: a photograph of the unit mounted.
- what: outlet-orientation
  scope: [front]
  reason: needs-drawing
  note: >-
    the picture is too small to show which end of each C13 is chamfered. It does not show which way a C19 earth slot faces. Every
    outlet takes the part's own orientation.
  wanted: a larger photograph of the outlet face.
- what: numbering
  scope: [front]
  reason: vendor-silent
  note: >-
    no held document numbers the outlets. They are numbered from the far end, one count across the C13 and the C19.
  wanted: a photograph that shows the printed numbers, or the installer guide.
- what: circuit-assignment
  scope: [front]
  reason: vendor-silent
  note: >-
    the sheet gives twelve C13 and two C19 per phase and does not say which outlets each phase feeds. The split is estimated by
    position.
  wanted: the installer guide, or a photograph of the circuit marks.
- what: label-windows
  scope: [front]
  reason: vendor-silent
  note: >-
    the photograph shows a small light-rimmed window at three places along the strip, with a pale bar inside each. No held text says
    what each is. Each is drawn as a plate with a light rim and a pale bar, both estimated. The photograph is too small to read an
    edge closer than about 2 mm. The rim takes the breaker window's colour and width. Anything printed in a window is not drawn.
  wanted: the installer guide for this model.
- what: marks-and-text
  scope: [front]
  reason: needs-photo
  note: >-
    the maker's mark and the printed labels are left to a later touch. The plate that carries the mark is drawn.
  wanted: a larger photograph of the cord end.
- what: colour
  scope: [front]
  reason: sources-disagree
  note: >-
    the sheet says black and the body is drawn black, an estimate. The picture reads the body as a mid grey, which is taken as the
    lighting.
  wanted: a photograph under neutral light, or the swatch of the finish.
groups:
  outlets: {term: Outlet, role: traffic, index-origin: 1, mixed: 'the 42 outlets on the front, 36 IEC C13 and 6 IEC C19. They are numbered from the far end. The sheet gives no numbering.'}
  power-input: {term: Input, role: service, index-origin: 1}
