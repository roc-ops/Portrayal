gaps:
  - what: environment
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet), and relative humidity 5 to 90
      percent against 5 to 95 percent. The guide's, the older document by three months, are in attrs.
    wanted: the maker's statement of which is current.
  - what: dc-input-voltage
    scope: [rear]
    reason: sources-disagree
    note: >-
      The PWR-1011-DC input is "-40 to -60 VDC, 30 A" in guide Table 3 and "-48 to -60V DC" in the data sheet's power
      supply table. The guide's is in the component, the data sheet's in its provenance.
    wanted: the maker's statement of which is current.
  - what: cage-types
    scope: [front]
    reason: vendor-silent
    note: >-
      The data sheet gives 28 QSFP100, 6 QSFP200 and 2 QSFP-DD cages and names no port numbers for any type. Ports 1
      to 34 are drawn as ganged QSFP cages and ports 35 and 36 as QSFP-DD; which six of ports 1 to 34 are QSFP200 is
      not stated, and the group speed is the QSFP100 rate.
    wanted: the guide's or the data sheet's port-to-speed map.
  - what: rack-ears
    scope: [front]
    reason: needs-drawing
    note: >-
      The guide's Figures 3-1 to 3-4 are isometric drawings of another switch and carry no measure, and the kit guides
      for KIT-7001 and the other spares are not held, so no ear position or rail kit is written.
    wanted: a dimensioned drawing of the mounting bracket position, and the kit guides.
  - what: port-lamps
    scope: [front]
    reason: needs-photo
    note: >-
      Figure C-5 callout 10 points at a "Port Status LED" the raster does not resolve; guide table 10 describes port
      LEDs near the ports. No port lamp is modelled.
    wanted: a photograph of the lit face, or a larger figure.
  - what: front-legends
    scope: [front]
    reason: needs-photo
    note: >-
      The speed strips' legends, the symbols left of the management ports, the symbols under the status lamps and the
      model line are unreadable or barely readable in the 570 px figure. The lamp symbols are drawn as read; the
      strips' legends and the port symbols are not drawn.
    wanted: a photograph of the face.
  - what: cage-orientation
    scope: [front]
    reason: needs-photo
    note: >-
      Which side the latches of the stacked cages face is not visible in the figure. The library's belly-to-belly
      convention is used (upper cage upright, lower turned 180).
    wanted: a photograph of the stacked cages.
  - what: psu-dc-face
    scope: [rear]
    reason: needs-drawing
    note: >-
      The PWR-1011-DC supplies are drawn as the AC supply's housing with a plain two-pole terminal block. The guide shows
      a DC supply only in isometric figures; the real terminal arrangement is not drawn.
    wanted: a flat drawing or photograph of the PWR-1011-DC.
  - what: module-power
    scope: [rear]
    reason: vendor-silent
    note: >-
      The guide's power tables and the data sheet give whole-switch figures only; the fan modules' missing power figure
      (lint L27) stands. The supplies state their output.
    wanted: FAN-7011M and FAN-7011H power draw.
  - what: grounding
    scope: [bottom]
    reason: needs-drawing
    note: >-
      The 1RU grounding point is on the bottom of the chassis for KIT-GND-EXT-1RU (guide section 4.2, Table 5, Figure
      4-2). No flat figure measures it, so it is not placed.
    wanted: a flat drawing of the bottom with the grounding bracket holes.
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      The QSFP cages numbered 1 to 34 as printed, drawn as 100G ports; the odd numbers are the upper cages. Six of
      them are QSFP200 cages, which the documents do not identify
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
    description: >-
      The two 400G QSFP-DD ports, numbered 35 and 36 as printed; 35 is the upper cage
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system, fan and two power supply lamps in a row at the right of the front
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      how the switch is reached out of band - the 10/100/1000 management port, the USB port and the RS-232
      console port, stacked in one block at the right of the front panel
  psu-bays:
    term: Bay
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Data sheet: "Hot-swap Power Supplies 2 (1+1 redundant)". Guide section 4.4: at least one supply must connect to a power source
    description: the two hot-swap power supplies, 1+1 redundant
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Data sheet: "Hot-swappable Fans 2 (1+1 redundant)"
    description: the two hot-swap fan modules
