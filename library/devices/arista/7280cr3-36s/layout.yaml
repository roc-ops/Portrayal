configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis with two AC supplies and two fan modules fitted, front-to-rear air, before any part number: the shape
      every build below starts from.
  f:
    kind: orderable
    description: >-
      The 7280CR3-36S with two AC supplies and front-to-rear air: PWR-1011-AC-RED supplies and FAN-7011M-F fan modules,
      all with red handles. Ordered as DCS-7280CR3-36S-F.
    part-numbers:
      DCS-7280CR3-36S-F: {}
  r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280CR3-36S with two AC supplies and rear-to-front air: PWR-1011-AC-BLUE supplies and FAN-7011H-R fan modules,
      all with blue handles (the data sheet's note 4: 35 C maximum ambient, EOS 4.29.1). Ordered as DCS-7280CR3-36S-R.
    bays:
      psu-1: arista/7280cr3-pwr-1000-ac-rev@1
      psu-2: arista/7280cr3-pwr-1000-ac-rev@1
      fan-1: arista/7280cr3-fan-rev@1
      fan-2: arista/7280cr3-fan-rev@1
    part-numbers:
      DCS-7280CR3-36S-R: {}
  k-f:
    kind: orderable
    description: >-
      The 7280CR3K-36S, the same hardware with the large-routes licence, with front-to-rear air. Ordered as
      DCS-7280CR3K-36S-F. The data sheet lists no rear-to-front K-36S.
    part-numbers:
      DCS-7280CR3K-36S-F: {}
  k-a-f:
    kind: orderable
    description: >-
      The 7280CR3K-36A, the K build with an eight-core CPU and a 120 GB SSD, with front-to-rear air. Ordered as
      DCS-7280CR3K-36A-F.
    export-description: >-
      Arista 7280CR3K-36A - a fixed 1RU data-centre switch router with 36 QSFP ports, the K build with an eight-core CPU
      and a 120 GB SSD, running EOS
    attrs:
      power:
        power-typical-w: 262
        power-max-w: 437
      platform:
        cpu: Eight-Core x86
        storage: 120 GB SSD (no flash storage)
      features:
        eos-license: license group G3; minimum EOS 4.27.2
    part-numbers:
      DCS-7280CR3K-36A-F: {}
  k-a-r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280CR3K-36A with rear-to-front air. Ordered as DCS-7280CR3K-36A-R.
    export-description: >-
      Arista 7280CR3K-36A - a fixed 1RU data-centre switch router with 36 QSFP ports, the K build with an eight-core CPU
      and a 120 GB SSD, running EOS
    attrs:
      power:
        power-typical-w: 262
        power-max-w: 437
      platform:
        cpu: Eight-Core x86
        storage: 120 GB SSD (no flash storage)
      features:
        eos-license: license group G3; minimum EOS 4.27.2; rear-to-front air needs EOS 4.29.1
    bays:
      psu-1: arista/7280cr3-pwr-1000-ac-rev@1
      psu-2: arista/7280cr3-pwr-1000-ac-rev@1
      fan-1: arista/7280cr3-fan-rev@1
      fan-2: arista/7280cr3-fan-rev@1
    part-numbers:
      DCS-7280CR3K-36A-R: {}
  dc-f:
    kind: example
    power: dc
    description: >-
      Two DC supplies and front-to-rear air: PWR-1011-DC-RED supplies and FAN-7011M-F fan modules. The data sheet lists no
      DC part number for the switch; the supplies are spares, and a DC build is ordered through the "#" configurable SKUs.
    bays:
      psu-1: arista/7280cr3-pwr-1000-dc@1
      psu-2: arista/7280cr3-pwr-1000-dc@1
  dc-r:
    kind: example
    power: dc
    airflow: back-to-front
    description: >-
      Two DC supplies and rear-to-front air: PWR-1011-DC-BLUE supplies and FAN-7011H-R fan modules. No DC part number is
      listed for the switch.
    bays:
      psu-1: arista/7280cr3-pwr-1000-dc-rev@1
      psu-2: arista/7280cr3-pwr-1000-dc-rev@1
      fan-1: arista/7280cr3-fan-rev@1
      fan-2: arista/7280cr3-fan-rev@1
