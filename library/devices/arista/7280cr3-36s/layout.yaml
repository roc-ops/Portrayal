format: 1
kind: device
name: 7280cr3-36s
version: 0.1.1
maturity: modelled
manufacturer: Arista
model: 7280CR3-36S
aliases:
  - {name: DCS-7280CR3-36S, kind: marketing}
portfolio: {line: 7000 Series, family: 7280CR3}
description: >-
  Arista 7280CR3-36S - a fixed 1RU data-centre switch router with 36 QSFP ports (28 x QSFP100, 6 x QSFP200 and
  2 x QSFP-DD, the data sheet says), running EOS. The front carries the cages in two stacked rows of eighteen
  columns, the odd number on top, in two-column blocks. Four system lamps (system, fan, PS1, PS2) sit in a row
  at the right above the stacked RJ-45 Ethernet management port, the USB port and the RJ-45 console port. The
  rear carries two hot-swap power supplies at the ends and two hot-swap fan modules. The same panel is ordered
  with front-to-rear air (-F) or rear-to-front air (-R). It is sold as the 7280CR3-36S, as the 7280CR3K-36S with
  more memory and routes, and as the 7280CR3K-36A with an eight-core CPU and an SSD.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7280R3 Series Quick Start Guide, Arista Networks, document DOC-07041-01, 63 pages, PDF created
      2025-05-16 (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280R3.pdf): Table 1
      (dimensions and weights), Table 2 (operating and storage), Table 3 (power input), Table 4 (power
      draw and supported supplies), section 2.1 (airflow orientation, handle colour), Table 5
      (grounding), section 4.5 (serial and management cables), Appendix A (status indicators, Tables 9
      to 13), Appendix C (Figure C-5, the front panel of the DCS-7280CR3-36S, 7280CR3K-36S and
      7280CR3K-36A), Appendix D (Figure D-1, the rear panel with two fan modules), Appendix E (field
      replacement). 7280R3 Series Data Center Switch Router Data Sheet, Arista Networks, 03-0045-59, dated
      August 11th, 2025 (https://www.arista.com/assets/data/pdf/Datasheets/7280R3-Data-Sheet.pdf): the model
      comparison of the 7280CR3-36S, CR3K-36S and CR3K-36A, the power supply specifications and the ordering
      information. The 2022 7280 1RU Gen 3 guide (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280_1RU_Gen3.pdf)
      lists the 7280CR3-36S in its tables and has no figure for it, so Figure C-5 has no second reading. Held
      and checked first: intake COVERAGE.md and SOURCES.md, which list no photograph, Visio stencil, 3D model
      or CAD file for this model (Arista publishes none; the stencil zip could not be fetched). The data
      sheet's picture of the face is a thumbnail. No drawing, photograph or logo is copied into the library,
      only transcribed facts and new drawings.
  gate-1-front:
    confidence: estimated
    note: >-
      Figure C-5 passes. The raster is 570 x 138 pixels; the body measures 552 px wide and 55 px tall (aspect
      10.0), against the data sheet's 440.0 / 43.7 = 10.07, so the figure is near-orthographic and carries
      geometry at 1.2545 px/mm (the 440 mm body is the scale anchor, its left edge read at 1 px). One pixel
      is 0.8 mm, so every position is good to about 0.8 mm, and every one is `estimated` because it is read
      off a picture and no dimension states it. The cage columns were read from the white port-number tabs
      in a three-times enlargement and the right end in a twelve-times one.
  gate-1-rear:
    confidence: estimated
    note: >-
      Figure D-1 is a 553 x 141 px raster whose chassis is 551 px between its edges and 54 px tall (aspect
      10.2 against 10.07), 1.252 px/mm over the 440 mm body; positions are good to about 0.8 mm. The guide
      draws the rear generically (D-1 to D-4) and does not say which model uses which. The 7280CR3-36S is
      mapped to D-1 by its two fan modules (data sheet: "Hot-swappable Fans 2 (1+1 redundant)"), its 1RU
      height and its two power supplies. THE MAPPING IS ESTIMATED. Its management ports are on the front
      (Figure C-5 callouts 6 to 8), so the rear's management block of D-1 is left out: the plate is blank
      where D-1 draws the block.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 1: 48.3 x 4.4 x 47.2 cm (19 x 1.75 x 18.6 in), 10.5 kg (23.0 lbs), the same for the
      7280CR3-36S, 7280CR3K-36S and 7280CR3K-36A. Data sheet: 43.99 x 4.37 x 47.17 cm (17.3 x 1.72 x 18.57 in),
      23 lbs (10.47 kg). The width: 48.3 cm is over the mounting ears, so the body between them, which is what
      is modelled, is the data sheet's 43.99 cm (440.0 here), a 21.5 mm ear each side. The height is the data
      sheet's 43.7 (the guide rounds it to 4.4 cm). The depth is the data sheet's 471.7 (the guide's 47.2 cm is
      the same figure rounded). 1RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's Chapter 3 mounts the switch with the accessory-kit brackets and shows them in
      isometric drawings of a different switch ("Illustrations in this chapter depict the mounting of a
      DCS-7050QX-32S switch") that carry no measure. The data sheet lists the spares KIT-7001,
      KIT-2POST-1U-NT, KIT-4POST-NT, KIT-7001-4POST-L and KIT-GND-EXT-1RU. No figure measures a bracket
      position, and the kit guides are not held, so no ear position is written and no rail kit is listed in
      chassis.kits. Recorded in the gap rack-ears.
  front-ports:
    confidence: estimated
    note: >-
      Figure C-5 at 1.2545 px/mm. Thirty-six cages in two stacked rows of eighteen columns (ports 1 to 36).
      Ports 1 to 32 are sixteen columns in eight two-column blocks: the tab centres read 20.5 and 39.6 mm for
      the first block, 65.1 for the second, and 352.3 for the last column of the sixteen, a column pitch of
      19.0 (the registry's ganged-QSFP pitch) inside a block and 6.5 mm more between blocks. Ports 33 and 34
      and ports 35 and 36 are two further columns, centred 378.3 and 398.0 mm. The rows read from the
      tabs at 18.1 and 31.4 mm down, a row pitch of 13.3. THE CAGE TYPES ARE PARTLY ESTIMATED: the data sheet
      says "28 x QSFP100, 6 x QSFP200, 2 x QSFP-DD" and no document says which ports are which. Ports 1 to 34
      are drawn as the library's ganged QSFP cage (identical opening for QSFP100 and QSFP200), and ports 35
      and 36, the two drawn at the right end with an orange legend strip above them, as QSFP-DD cages. The
      belly-to-belly orientation is the library's convention (upper cage upright, lower turned 180); the
      figure is too small to show the latch side. Recorded in the gap cage-types.
  port-numbering:
    confidence: estimated
    note: >-
      Figure C-5 (callout 1, "Port numbers") prints 1 over 2, 3 over 4, and so on down each column, 1 to 36
      from the left, the odd number on the upper cage. The figure prints each number twice: on a white tab
      over the cage opening, and small in the lavender strip above the upper cage (odd) and below the lower
      cage (even). A seated cage hides the tab, so the model prints the strip numerals: the odd numbers above
      the upper cages and the even numbers below the lower ones. EOS interface names are not printed on the
      metal and are not modelled.
  port-lamps:
    confidence: estimated
    note: >-
      NOT MODELLED. Figure C-5 callout 10, "Port Status LED", points at a mark at the lower right of port 8's
      cage that the 570 px raster does not resolve into a lamp, and no lamp shows beside any other port.
      Guide Appendix A.1.2, Table 10 gives the states (off link down, green link up, yellow software
      disabled, flashing yellow failed diagnostics). Recorded in the gap port-lamps.
  speed-strips:
    confidence: estimated
    note: >-
      Guide Figure C-5 callout 9, "Port Speed Groups": lavender strips above and below each two-column block
      of ports 1 to 24 and light-blue and lavender strips over ports 25 to 34 and an orange strip at ports
      35 and 36, with tiny legends. The strips of ports 1 to 32 are drawn lavender, with the printed numerals
      above; the colour differences and the legends are not drawn.
  status-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.1, Table 9 and Figure C-5 callouts 2 to 5: a system status lamp (blinking green on
      power-up, green normal, blue locator, amber for two or more failed fans), a fan status lamp (green,
      amber for one module removed or failed, red for two or more) and a status lamp for each of the two power
      supplies (green operating, off removed or faulty). Four lamps in a horizontal row at 418.6, 423.3, 427.9
      and 432.6 mm and 1.5 mm down, above the management block, with a symbol under each read in a
      twelve-times enlargement: a circled mark, a fan, and two wave marks for the supplies.
  management-ports:
    confidence: estimated
    note: >-
      Figure C-5 callouts 6 to 8: the Ethernet management port (top), the USB port (middle) and the console
      port (serial, bottom), stacked at the right end of the front in a dark dotted frame 417.0 to 434.3 mm
      across and 5.7 to 38.5 mm down. Placed as the library places the 7280CR3-32D4's rear stack. The small
      symbols left of each port (arrows, a USB trident, a console symbol) are not legible at this size and
      are not drawn.
  front-legend:
    confidence: estimated
    note: >-
      The model legend reads "7280CR3-36S" under the maker's wordmark at the top left (read at 570 px; the print
      is small). THE WORDMARK IS NOT DRAWN: a logo-zone region is reserved over it and the plain model text is
      set. The text is as the guide's caption names the model.
  vents:
    confidence: estimated
    note: >-
      The figure shows a perforated grid along the top (0.6 to 9.5 mm down, 27 to 405 mm across) and a ribbed
      strip along the bottom lip. Two brass-coloured screw heads sit on the lip at 141.9 and 275.2 mm. Each
      is drawn in its measured extent; the individual squares are not drawn one by one.
  rear:
    confidence: estimated
    note: >-
      Figure D-1 at 1.252 px/mm, the rear seen from behind with x = 0 at the left of the drawing. PS1 is the left
      and PS2 the right (callouts 1 and 6). Each power supply module is 73.5 mm wide (the data sheet's
      "73.5MM") at 4.4 and 361.5 mm across and 1.85 mm down. Two fan modules 78.6 mm wide at 105.7 and 276.6 mm
      across and 2.55 mm down. Between the fans is a grey plate printed with ASSY NUMBER, SERIAL NUMBER and MAC
      ADDRESS fields and, under them, PS1 and PS2 legends beside airflow arrows (the arrows are not drawn).
  rear-fan:
    confidence: datasheet
    note: >-
      Data sheet: "Hot-swappable Fans 2 (1+1 redundant)"; the front-to-rear fan is "FAN-7011M-F" and the
      rear-to-front fan "FAN-7011H-R" (a different grade: "Fan Tray: Forward Airflow: FAN-7011M-F, Reverse
      Airflow: FAN-7011H-R"). Data sheet note 4: rear-to-front airflow "is subject to 35C max ambient
      temperature and transceiver power restrictions, requires EOS 4.29.1 and High Speed fans (FAN-7011H-R)".
      Guide section 2.1: a red handle is an air-exit module and a blue handle an air-inlet one. The two fan
      modules are bays that accept the FAN-7011M-F or the FAN-7011H-R.
  fru-bays:
    confidence: datasheet
    note: >-
      Guide Appendix E (E.2 power supplies, E.3 fan modules) gives removal and installation procedures, and the
      data sheet calls the supplies "1+1 hot-swappable" and the fans "hot-swap". SO THE TWO POWER SUPPLIES AND THE
      TWO FAN MODULES ARE BAYS. Nothing on this chassis is a built-in unit. The management ports are part of the
      chassis and are placements on the front.
  power:
    confidence: datasheet
    note: >-
      Guide Table 4: typical / maximum 254 W / 423 W for the 7280CR3-36S and 7280CR3K-36S, and 262 W / 437 W for
      the 7280CR3K-36A, each with PWR-1011-AC or PWR-1011-DC. The data sheet states the same figures with typical
      "measured at 25C ambient with 50% load on all ports". The device carries 254 W / 423 W, the figure of the
      7280CR3-36S and the 7280CR3K-36S, and the two 7280CR3K-36A configurations state 262 W / 437 W in their own attrs.
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, altitude 0 to 3,000 m, humidity 5 to 90 percent
      non-condensing. Data sheet: operating 0 to 40 C, storage -40 to 70 C, humidity 5 to 95 percent, altitude 0
      to 3,000 m. Storage temperature and humidity differ: gap `environment`, the guide's used.
  configurations:
    confidence: datasheet
    note: >-
      Data sheet ordering information: DCS-7280CR3-36S-F and -R, DCS-7280CR3K-36S-F (no -R is listed for the K-36S)
      and DCS-7280CR3K-36A-F and -R ("front to rear air, 2 x AC" and "rear to front air, 2 x AC"). The "#" SKUs
      ("configurable fans and psu") are orders of parts, not part numbers a DCIM can hold, and are not listed. The
      data sheet lists no DC build of the switch: the PWR-1011-DC-RED and -BLUE supplies are spares, so the DC
      configurations are examples with no part number. The K and K-A builds share the base model's size, weight,
      figure and supplies and differ in memory, CPU, SSD and routes (and, for the 36A, power draw); each is a
      configuration with its own part numbers, and the two 36A configurations state their own power, CPU, SSD and
      minimum EOS in attrs (data sheet, model comparison of the 7280CR3-36S, CR3K-36S and CR3K-36A). There is no empty-bay (-S)
      configuration: the "S" of the model name is not a suffix of this kind and the guide draws no blank for a
      power supply or fan module.
  interface-names:
    confidence: datasheet
    note: >-
      Not printed and not modelled. EOS names ports Ethernet1 to Ethernet36 and Management1; this is the vendor's
      convention and no held document prints it.
  colour:
    confidence: estimated
    note: >-
      The front plate is the 7280CR3-32D4's #aaabad, read there as the median of bare-plate pixels in the guide's
      figure of the same family.
  lifecycle:
    confidence: estimated
    note: >-
      Searched 2026-10-23 (web searches of Arista's end-of-sale notices). Notice 23790, "End of Sale of the Arista DCS-7280CR3K-36S
      Series" (https://www.arista.com/en/support/advisories-notices/end-of-sale/23790-end-of-sale-of-the-arista-dcs-7280cr3k-36s-series),
      announced April 10, 2026, covers the SKUs -F and # of the 7280CR3K-36S, with the last date to order October 10, 2026, end of life
      October 10, 2031, and the 7280CR3K-36A as the suggested replacement. It names neither the 7280CR3-36S nor the 7280CR3K-36A, and no
      notice for those was found, so the device records the announcement and this note says which build it covers: the k-f build only.
  other-faces:
    confidence: datasheet
    note: >-
      No source draws the top, bottom or sides flat. The guide's installation figures are isometric. Each carries
      an `empty` sentence. The 1RU grounding point is on the bottom of the chassis (guide section 4.2, Table 5,
      KIT-GND-EXT-1RU); no figure measures it.
attrs:
  physical:
    weight: 10.5 kg (23.0 lbs) for the 7280CR3-36S, 7280CR3K-36S and 7280CR3K-36A (guide Table 1, data sheet 10.47 kg)
    size-over-ears: 48.3 x 4.4 x 47.2 cm (19 x 1.75 x 18.6 in) with the mounting ears (guide Table 1)
  performance:
    throughput: 2.4 (4.8) Tbps
    packets-per-second: 1 Bpps
    latency: from 3.8 microseconds
    packet-buffer: 4 GB
    ports-max-speed: two ports of 400 Gbps; 40 of 100 Gbps; 80 of 50 Gbps; 36 of 40 Gbps; 120 of 25 or 10 Gbps; 24 of 1 Gbps
    interfaces-max: 120
  power:
    power-typical-w: 254
    power-max-w: 423
    power-envelope: as-tested
    power-measure: typical at 25 C ambient with 50 percent load on all ports (data sheet)
    psu-redundancy: 1+1
    input-ac: 100 - 240 VAC (PWR-1011-AC), IEC 60320 C14
    input-dc: -48 to -60 VDC (PWR-1011-DC)
    efficiency: 93 percent (Platinum) AC, 94 percent DC (data sheet)
  thermal:
    airflow: front-to-rear or rear-to-front, set by the fan modules and supplies fitted
    fan-redundancy: 2 hot-swap fan modules, 1+1
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F); rear-to-front air is subject to 35 C maximum ambient (data sheet note 4)
    storage-temp: -25 to 70 C (guide Table 2); the data sheet says -40 to 70 C
    humidity: 5 to 90 percent non-condensing (guide Table 2); the data sheet says 5 to 95 percent
    altitude: 0 to 3,000 m (10,000 ft) operating
  platform:
    cpu: Quad-Core x86 (7280CR3-36S and 7280CR3K-36S); Eight-Core x86 (7280CR3K-36A)
    memory: 64 GB
    storage: 8 GB flash (not on the 7280CR3K-36A); SSD 120 GB on the 7280CR3K-36A only
  features:
    optics-qsfp28: 100G, 50G, 40G, 25G and 10G with breakout, and 1G, in the QSFP cages (data sheet)
    optics-qsfp-dd: 400G and 200G, in the two QSFP-DD cages (data sheet)
    eos-license: license group G3; minimum EOS 4.26.1 (7280CR3-36S, CR3K-36S), 4.27.2 (7280CR3K-36A); rear-to-front air needs EOS 4.29.1
  management:
    console: RJ-45 RS-232 serial on the front, 9600 baud 8N1, no flow control
    oob: one 10/100/1000 management port on the front
    usb: one USB port on the front, for software or configuration updates
  compliance:
    emc: FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386
    safety: EN 62368-1, IEC 62368-1, CSA/UL 62368-1
    certifications: BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI, TEC, ANATEL, ICASA (data sheet)
    rohs: RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)
  lifecycle:
    eol: announced
    eol-announcement: https://www.arista.com/en/support/advisories-notices/end-of-sale/23790-end-of-sale-of-the-arista-dcs-7280cr3k-36s-series
    end-of-sale: '2026-10-10'
    end-of-life: '2031-10-10'
