  depth: 475.0
  ru: 1
  color: '#aaabad'
  airflow: front-to-back
  power: ac
gaps:
  - what: power-figures
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      Guide Table 4 prints "190 W / 179 W" (typical / maximum) for this model, which reads typical above maximum; the data sheet prints "120W / 223W". The data sheet's are
      modelled, as its maximum is above its typical.
    wanted: the maker's statement of the typical and maximum draw.
  - what: depth
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      Guide Table 1 gives a depth of 47.5 cm (18.7 in) and the data sheet 46.83 cm (18.43 in). The guide's is modelled.
    wanted: the maker's statement of which is current.
  - what: weight
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      Guide Table 1 gives 9.8 kg (21.5 lbs) and the data sheet 9.52 kg (21 lbs). The guide's is in attrs.
    wanted: the maker's statement of which is current.
  - what: environment
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet). The guide's is in attrs.
    wanted: the maker's statement of which is current.
  - what: rack-ears
    scope: [front]
    reason: needs-drawing
    note: >-
      The guide's Figures 3-1 to 3-13 are isometric drawings with no measure and the kit guides for KIT-7101, KIT-7101-D and the other spares are not held, so no ear position or
      rail kit is written.
    wanted: a dimensioned drawing of the mounting bracket position, and the kit guides.
  - what: front-legends
    scope: [front]
    reason: needs-photo
    note: >-
      The strips' legends, the small print of the face, the system and fan lamp glyphs and the PS1 and PS2 legends are unreadable in the 830 px figure. The glyphs and the two PS
      legends are drawn as read; the rest is not drawn.
    wanted: a photograph of the face.
  - what: qsfpdd-lamps
    scope: [front]
    reason: needs-photo
    note: >-
      Figure C-6 resolves no lamp for the four QSFP-DD cages beyond unresolved dark marks beside the 51 and 52 cages. One lamp each is placed at the side of the cage.
    wanted: a photograph of the QSFP-DD columns.
  - what: cage-orientation
    scope: [front]
    reason: needs-photo
    note: >-
      Which side the latches of the stacked cages face is not visible in the figure. The library's belly-to-belly convention is used (upper cage upright, lower turned 180).
    wanted: a photograph of the stacked cages.
  - what: rear-mgmt-block
    scope: [rear]
    reason: needs-photo
    note: >-
      The management block's console symbol is drawn as read; the order of the three ports (management over USB over console) follows the data sheet's rear photograph and figure D-1.
    wanted: a photograph of the rear management block.
  - what: psu-faces
    scope: [rear]
    reason: needs-drawing
    note: >-
      The guide draws no PWR-511 and the data sheet shows none: the 500 W supplies are drawn as the 1000 W supply's housing (the data sheet gives the same 73.5 mm width), and the
      PWR-511-DC as that housing with a plain two-pole terminal block.
    wanted: a flat drawing or photograph of the PWR-511-AC and PWR-511-DC.
  - what: module-power
    scope: [rear]
    reason: vendor-silent
    note: >-
      The guide's power tables and the data sheet give whole-switch figures only; the fan modules' missing power figure (lint L27) stands.
    wanted: FAN-7011M power draw.
  - what: grounding
    scope: [bottom]
    reason: needs-drawing
    note: >-
      Guide Table 5 lists the 1RU models that take KIT-GND-EXT-1RU and does not list the 7050X4-48Y-4DF. No flat figure measures a grounding point, so none is placed.
    wanted: a flat drawing of the bottom with the grounding bracket holes.
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
    description: >-
      The 48 25G SFP25 ports, numbered 1 to 48 as printed; the odd numbers are the upper cages
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
    description: >-
      The four 400G QSFP-DD ports, numbered 49 to 52 as printed; 49 and 51 are the upper cages
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: a status lamp for each port, along the bottom edge for the SFP25 cages and beside the cage for the QSFP-DD cages
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system, fan and two power supply lamps at the top right of the front
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      how the switch is reached out of band - the 10/100/1000 management port, the USB port and the RS-232
      console port, stacked in one block at the left of the rear panel
  psu-bays:
    term: Bay
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Data sheet: "Hot-swap Power 2 (1+1 redundant)". Guide section 4.4: at least one supply must connect to a power source
    description: the two hot-swap power supplies, 1+1 redundant
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: n+1
      redundancy-note: >-
        Data sheet: "Hot-swappable Fans 3 (N+1 redundant)"
    description: the three hot-swap fan modules
