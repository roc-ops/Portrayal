kind: device
name: 7280dr3a-36
version: 0.1.2
maturity: modelled
manufacturer: Arista
model: 7280DR3A-36
aliases:
- {name: DCS-7280DR3A-36, kind: marketing}
portfolio: {line: 7000 Series, family: 7280DR3A}
description: >-
  Arista 7280DR3A-36 - a fixed 2RU data-centre router switch with 36 400G QSFP-DD ports in two
  stacked rows of eighteen columns (the odd number on the upper cage), numbered 1 to 36 in an orange
  strip between the rows, and two OSFP line-system ports (OSFP-LS, 37 and 38) for 400G-ZR optics
  at the upper right. Beside the line-system ports are four status lamps (system, fan, power supply
  1, power supply 2), an RJ-45 console, a USB port and an RJ-45 management port; at the far right
  stand a Time-of-Day connector (USB-C) and two clock connectors (1PPS and 10 MHz). The rear carries
  four hot-swap fan modules and two hot-swap 2400 W power supplies, AC or DC, one above the other
  at the right, with a grounding pad between fans 1 and 2. The same front panel is sold as the
  DR3A-36, the DR3AM-36 (TunnelSec) and the DR3AK-36 (large routes and TunnelSec), and the
  DR3AK-36S (the K with secure boot enabled); they differ in software licence, encryption and
  secure boot, not in the metal.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7280R3A Series Quick Start Guide, Arista Networks, DOC-07042-01, 59 pages, PDF created
      2025-05-16 (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280R3A.pdf): Table 1
      (dimensions and weights), Table 2 (operating and storage environment), Table 3 (power input),
      Table 4 (power draw and supported supplies), Table 6 (grounding of the 2RU switches),
      section 2.1 (airflow orientation), sections 4.4 and 4.5 (power and serial cables), Appendix A
      (status indicators, figures A-1 and A-2, tables 9 to 13), Appendix B (parts list), Appendix C
      (front panel, figure C-2: DCS-7280DR3A-36, DCS-7280DR3AK-36 and DCS-7280DR3AM-36), Appendix D
      (rear panels, figures D-1 to D-4) and Appendix E (power supplies and fan modules, "all fans and
      power supplies are hot swappable"). 7280R3A Series Data Sheet, Arista Networks, 04-0040-26,
      27 pages, dated April 15th, 2025 (https://www.arista.com/assets/data/pdf/Datasheets/7280R3A-Datasheet.pdf):
      the 7280DR3A-36 model comparison table, power supply specifications, ordering information and
      the platform overview. No 3D model, no CAD drawing, no studio photograph and no Visio stencil
      is held (intake SOURCES.md and COVERAGE.md read first); the data sheet's only picture of the
      face is a 400 px thumbnail, so figure C-2 is the instrument.
  gate-1:
    confidence: estimated
    note: >-
      Figure C-2 is a 872 x 344 px raster (PDF image, 129 ppi). The chassis in it spans 823 px
      (x 2 to 825) and 161 px (y 105 to 266, with a ribbed lower lip) - aspect 5.12, against 5.005
      for the data sheet's 43.99 x 8.79 cm body (4.4 percent out) and 5.49 for a 48.3 cm face over
      the ears, so the figure shows the body with no ears. 4.4 percent is at the edge of what the
      method allows. THE X AXIS IS TAKEN (1.873 px/mm on the 440 mm body) AND THE Y AXIS IS THE SAME
      SCALE, not its own: the row pitch measured 26.5 px is 14.15 mm on the x scale against
      14.2 to 14.3 for stacked QSFP-DD cages elsewhere in the library, while the y scale
      (1.832 px/mm) would make it 14.5. The figure is cut about 2 mm short at the bottom. Every
      front position below is therefore a reading good to about one pixel, 0.55 mm, and is estimated.
      The rear figure D-3 is a 565 x 197 px raster whose chassis is 525 px (x 2 to 527) by 105.5 px
      (y 47 to 152.5): aspect 4.98 against 5.005, 0.6 percent out, so it passes, at 1.193 px/mm. One
      pixel is 0.84 mm there.
  port-wall:
    confidence: estimated
    note: >-
      THIRTY-SIX QSFP-DD CAGES IN EIGHTEEN COLUMNS OF TWO. The white number boxes of figure C-2 were
      found as connected components (12 px, 6.4 mm, squares) and their centres fitted: column
      centres 39.0, 82.0, 125.0, 169.0, 212.0, 254.0, 298.0, 340.5, 384.0, 427.0, 471.0, 514.0,
      557.0, 600.0, 643.0, 686.0, 730.0 and 773.0 px, a pitch of 43.18 px (734 px over 17
      intervals) = 23.05 mm, the first at 19.75 mm ((39 - 2) / 1.873). The rows centre at 191.5 and
      218.0 px, 46.2 and 60.3 mm below the top, a row pitch of 14.15 mm; 14.2 is used. The cages
      are std/qsfp-dd@1 (registry 19.0 x 10.0 mm); the figure draws them 20.6 wide with their
      bezel, which is the strip width below.
  numbering:
    confidence: estimated
    note: >-
      THE NUMBERS ARE PRINTED TWICE ON THE FIGURE and the model follows the second. A white box
      with a large numeral sits over each cage in figure C-2, and the orange strip between the
      two rows prints a small `N-up-arrow` at its left end and `down-arrow-N+1` at its right, per
      column: 1 over 2, 3 over 4, ... 35 over 36. A seated cage hides anything painted under it, so
      the model prints the strip legends (which show in every render) and not the boxes. The strip
      legends were read on a eight-times enlargement of columns 1 to 4 (1 up, 2 down; 3, 4; 5, 6;
      7, 8) and the callout 12 "Port numbers" of the guide covers both. Numbering starts at 1. The
      lower cage of each column is the even number, so the stack is column-major: port n is in
      column ceil(n/2), the upper row when n is odd. Interface names (Ethernet1 ... Ethernet36 and
      their breakouts) are EOS names and are not printed on the metal; they are not modelled.
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the upper
      cage upright (rotate 0) over the lower turned 180, so both cage lips face the band between the
      two cages and both bails face outward. Decided by the rule, not an observation, so a photograph
      of the stack overturns it: the 18 QSFP-DD pairs (port-1/port-2 to port-35/port-36).
  port-lamps:
    confidence: estimated
    note: >-
      ONE LAMP PER PORT, in the orange strip: the upper cage's lamp near the strip's top, about 4.3
      mm left of the column centre, and the lower cage's near its bottom, 4.3 mm right of it (figure
      C-2, eight-times enlargement of columns 1 to 4; two green dots a pixel or two across per
      column). The guide's Appendix A.1.2 says port LEDs are "located in the vicinity of their
      corresponding ports" and table 10 gives the states: off link down, green link up, yellow
      software-disabled, flashing yellow failed diagnostics. The guide's figure A-3 is of another
      switch (the DCS-7050QX-32S) and shows four lamps a port; this face shows one.
  line-system-ports:
    confidence: estimated
    note: >-
      TWO OSFP CAGES at the upper right, "Line system port (OSFP)" 1 and 2 in the figure's callout
      table and "2 x OSFP-LS ports for dense 400G-ZR deployment" in the data sheet. A green strip
      under them prints "37" with an up triangle at its left end, LINE (read as LINE; the print is
      three pixels high) in the middle and "38" with an up triangle at its right: the two cages are
      numbered 37 and 38 as the fine print of the figure reads. Cage centres 307.7 and 337.9 mm from
      the left and 14.2 mm down, measured on the cage bezels (555 to 602 and 612 to 658 px, 118 to
      145 px), a pitch of 30.2 mm. std/osfp@1 (23.1 x 13.5 mm) is seated; the figure draws the
      bezels 25 mm wide.
  status-block:
    confidence: estimated
    note: >-
      FOUR LAMPS beside the line-system ports, 4.8 mm apart at y 20.0 mm: system status, fan status,
      power supply 1 status and power supply 2 status (figure C-2 callouts 3 to 6; guide Appendix
      A.1.1, figures A-1 and A-2: "labeled either as in Figure A-1 or as in Figure A-2"). The two
      right-hand lamps are printed PS1 and PS2 and the two left-hand lamps carry a symbol (a circle
      with a mark, a fan) instead of a word. The symbols are not drawn: their strokes are two pixels
      wide and resolve to a blob (see gaps). States are table 9's: the system lamp blinking green
      (powering up), green, blue (beacon) or amber; the fan lamp green, amber or red; the supply
      lamps green or off.
  management-ports:
    confidence: estimated
    note: >-
      A row of three at the right of the upper edge: console (callout 7, RJ-45 serial) at 381.7 mm,
      USB (callout 8, vertical, Type A) at 397.7 mm, Ethernet management (callout 9, RJ-45 with the
      two lamps drawn in its top corners) at 413.0 mm, all about 14.7 mm below the top. The guide's
      section 4.5 lists the cables: RJ-45 to DB-9 serial adapter and an RJ-45 Ethernet cable; the
      data sheet gives "RS-232 Serial Ports 1 (RJ-45)", "USB Ports 1" and "100/1000 Mgmt Ports 1"
      (as printed). The management jack is taken as 10/100/1000 (guide section 4.5: "Connect to
      10/100/1000 management network") and so `1g`, where the data sheet's line reads "100/1000".
  timing:
    confidence: estimated
    note: >-
      ToD AND TWO CLOCK CONNECTORS in the narrow strip at the right edge (callouts 10 and 11). The
      ToD connector is a vertical slot with a screw at each end; the data sheet's accessory
      "CAB-SYNCE-RJ  Spare Time of Day adapter cable (USB-C to 2 x RJ-45)" says its mate is USB-C, so
      std/usb-c@1 is turned a quarter at 429.3, 45.3 mm. Under it are two gold coax jacks, labelled
      PPS (upper) and 10MHz (lower) in the figure, at 59.3 and 67.1 mm. The data sheet's timing line
      reads "PTP and SyncE with OCXO and PPS/10M/ToD inputs". The coax type is not stated: std/smb@1
      is seated because the jacks measure about 5.3 mm across their flange, which is nearer the SMB
      (4.83) than the SMA (6.35) in the registry, and the choice is estimated (see gaps).
  vents:
    confidence: estimated
    note: >-
      Two square-hole fields, each four rows deep, above and below the port wall (figure C-2: holes
      about 2.2 mm square on a 3.65 mm pitch, 6.85 px). Upper field y 25.1 to 38.4, lower y 67.8 to
      81.2, both from x 5.9 to 423.3. The library's pattern for square openings is its grille tile,
      whose opening is 85 percent of the pitch where the hardware's is 60, so the holes read larger
      than the figure's, and four whole tiles need 14.6 mm where the figure's four holes span 13.3:
      the fields are drawn 14.6 tall (y 24.4 and 67.2) and 416.1 wide (114 tiles). A ribbed lip runs
      under the lower field (y 83.0 to 85.9).
  nameplate:
    confidence: estimated
    note: >-
      A grey plate at the upper left, 32.1 x 11.3 mm, carries the maker's wordmark over the model
      line. The wordmark is not drawn; its box is the `logo-zone` region. The model line is plain
      text and is drawn: figure C-2 prints "7280DR3AM-36" because it is a picture of the DR3AM-36,
      the encryption variant of this chassis, and the guide's one figure serves the DR3A-36, the
      DR3AK-36 and the DR3AM-36. The line here reads 7280DR3A-36, the plate of the device this
      file is named for; the K and M variants print their own (see gaps).
  rear-layout:
    confidence: estimated
    note: >-
      FIGURE D-3, the rear with a grounding point, 2RU: four fan modules left of the middle and two
      power supplies stacked at the right. The guide draws four generic rear panels (D-1 to D-4) and
      does not say which model uses which. D-1 and D-2 are 1RU. Of the 2RU pair, D-3 has an "Earth
      grounding pad" (callout 7) and D-4 has a plain separation between fans 1 and 2 with no ground.
      Table 6 of the guide says the DR3A-54 grounds with the KIT-GND-EXT-2RU side kit and the
      DR3A-36 "Attach directly - right angle lug recommended", the grounding location being "on the
      back for those supporting direct attach", so the DR3A-36 is mapped to D-3. THE MAPPING IS
      ESTIMATED: it follows from fan count (four), height (2RU), supply count (two) and table 6, not
      from a caption. The data sheet's rear thumbnail of the 7280R3A 2RU views shows the same
      four-fan, two-supply layout with a ground pad.
      MEASURED at 1.193 px/mm on the red fan frames: four modules 79.6 wide on 98.0, 85.5 and
      85.5 mm steps (the first step spans the ground strip), x 5.9, 103.9, 189.4 and 274.9;
      supplies at x 361 (73.5 wide), top at 2.0 and 45.0 mm.
  ground-pad:
    confidence: estimated
    note: >-
      A grey strip 15.0 mm wide between fans 1 and 2 (x 87.2 to 102.2) holds two black holes 19.2
      mm apart (y 13.0 and 32.2), a ground symbol between them and, below, three printed symbols
      (a warning triangle, a box, a person-and-bar) too small to read. The holes are the "Earth
      grounding pad" of figure D-3. The guide's section 4.1 says the grounding lugs are M4 x 0.7
      and are not supplied, so two common/ground-screw-m4@1 stand for the tapped holes; the library's
      two-hole lug pair is 5/8 inch (15.9 mm) and these measure 19.2, so the pair part is not used.
  field-replaceable-units:
    confidence: datasheet
    note: >-
      EVERY FAN MODULE AND POWER SUPPLY IS A BAY. The guide's appendix E: "All fans and power supplies
      are hot swappable" and "all slots must be filled or covered with a blank for operation". The
      data sheet's comparison table: "Hot-swap Power Supplies 2 (1+1 redundant)", "Hot-swappable
      Fans 4 (N+1 redundant)", "Fan Tray FAN-7012H" and "Power Supplies PWR-2411 (AC or DC)". Nothing
      in the held documents draws a blank for either bay, so none is modelled. The supply and fan
      the DR3A-36 takes are front-to-rear (red) only: the data sheet lists "Airflow Direction: Front
      to Rear" and only the RED spares (PWR-2411-AC-RED, PWR-2411-DC-RED, FAN-7012H-RED). The guide's
      section 2.1 says a red handle is an air-exit module and a blue one an air-inlet module, so
      this switch is wholly red and has no airflow configuration.
  configurations:
    confidence: datasheet
    note: >-
      FOUR ORDERABLE CONFIGURATIONS OF ONE FACE. The data sheet's ordering information for the
      7280DR3A-36 lists DCS-7280DR3A-36-F ("front to rear air, 2 x AC"), DCS-7280DR3AM-36-F
      ("TunnelSec"), DCS-7280DR3AK-36-F ("large routes and TunnelSec") and DCS-7280DR3AK-36S-F ("large
      routes and TunnelSec, secure boot enabled"), and the same four ending "#" ("configurable fans
      and psu"). The F orders are the only part numbers with a fixed build, so they are the orderable
      configurations. The "#" orders take their supplies and fans to order, which is how a DC build
      is bought (PWR-2411-DC-RED is a listed spare and table 4 lists PWR-2411-DC); there is no DC
      part number, so the DC build is a `kind: example` configuration, shown but not exported. Table
      4 of the guide gives one figure (643 W typical, 1283 W maximum) for the DR3A-36, DR3AM-36 and
      DR3AK-36, so no configuration states a power of its own. The guide's Table 1 gives all three
      one size and weight; the data sheet's model comparison table differs only in the Encryption
      row (none, all ports, all ports).
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, 0 to 3,000 m, 5 to 90 percent
      non-condensing. The data sheet's environmental table gives the same operating and altitude
      figures and humidity, and a storage range of -40 to 70 C. The guide (the newer, 2025-05-16
      against 2025-04-15) is used for storage; the data sheet's is in `other` as written.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-sale notice for the 7280DR3A-36 (2026-10-22, a web search for
      "Arista 7280DR3A-36 end of sale announcement"): none found for this family. The notices that
      exist are for other 7280 models (the DCS-7280CR3K-36S, advisory 23790, and the older
      7280QR-C36 and QR-C72), so the field reads none-announced.
  weight:
    confidence: datasheet
    note: >-
      24.1 kg (53.1 lbs) in the guide's Table 1; the data sheet's comparison table prints "53.1 lbs
      (24.09 kg)". The same figure to rounding; 24.1 is used.
