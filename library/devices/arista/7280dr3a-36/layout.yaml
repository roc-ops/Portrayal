gaps:
- what: front-faces-of-the-variants
  scope: [front]
  reason: vendor-silent
  wanted: >-
    A FIGURE OF THE DR3A-36 AND THE DR3AK-36 FRONT. Figure C-2 is captioned for all three
    models but prints the plate "7280DR3AM-36", so it is a picture of the DR3AM-36. The model
    plate of the other two is not shown, and this file prints "7280DR3A-36" on every configuration.
    A photograph of each plate closes it.
- what: number-boxes
  scope: [front]
  reason: needs-drawing
  wanted: >-
    THE WHITE NUMBER TABS OVER THE CAGES. Figure C-2 draws a white square with a large numeral over
    the centre of each cage. A seated cage hides what is painted under it and the library has no
    layer above a cage for printed matter, so the numbers are modelled as the strip legends only.
    A drawing that says whether the tab is a sticker on the cage or part of it closes it.
- what: strip-legend-400g
  scope: [front]
  reason: needs-drawing
  wanted: >-
    A LEGEND IN THE MIDDLE OF THE FIRST STRIP. Column 1's strip reads something like "400G" between
    its arrows in the eight-times enlargement and no other column's does. At 1.87 px/mm the glyphs
    are three pixels high and resolve to a smear; the numerals and arrows beside it resolve, so
    the strip is readable and this text is the unresolved thing. It is not drawn.
- what: status-lamp-symbols
  scope: [front]
  reason: needs-drawing
  wanted: >-
    THE SYMBOLS OVER THE SYSTEM AND FAN LAMPS, and the small legends over the console and
    management jacks. They are printed in blue at about two pixels' height and are not legible
    in the figure; PS1 and PS2 are. Guide figures A-1 and A-2 say the lamps are labelled in one of
    two ways and the held figure does not say which this chassis uses.
- what: tod-lamp-and-symbol
  scope: [front]
  reason: vendor-silent
  wanted: >-
    A LAMP AND A BLUE SYMBOL ABOVE THE ToD CONNECTOR (about 428.9 and 434.8 mm, 34.3 mm down).
    Figure C-2 draws them and no callout or table names them. They are not modelled.
- what: clock-connector-type
  scope: [front]
  reason: vendor-silent
  wanted: >-
    WHETHER THE PPS AND 10MHZ JACKS ARE SMB OR SMA. The guide calls them "E-Sync clock connectors"
    and the data sheet "PPS/10M/ToD inputs"; neither names the connector. They are seated as
    std/smb@1 from their drawn size and their direction (input or output) is not stated either.
- what: usb-generation
  scope: [front]
  reason: vendor-silent
  wanted: >-
    THE USB GENERATION. The guide says "USB port" and the data sheet "USB Ports 1"; neither gives
    a generation, and figure C-2 draws a gold tongue, which is neither USB-IF colour. The port is
    seated with the `usb2` (white) skin as the one that claims least; a data sheet line giving the
    generation closes it.
- what: round-hole-at-left
  scope: [front]
  reason: vendor-silent
  wanted: >-
    A BLACK ROUND HOLE at the left end, 4.8 mm from the edge and 53.4 mm down, in line with the
    strips. Figure C-2 draws it and nothing names it (an ESD socket is a candidate on other
    switches). It is drawn as a hole in decor and carries no part.
- what: rear-legends
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    THE PRINTING AT THE REAR. The ground strip prints three symbols and the rear carries the
    airflow marks, but the guide's rear panel figure is 1.19 px/mm and its labels are unreadable.
    The supplies and fans print no numbers that resolve. A rear photograph closes it.
- what: dc-terminals
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    THE PWR-2411-DC FACE. The guide shows the PWR-1900-DC and PWR-500-DC (figure 4-5) and no
    PWR-2411-DC. Table 7 note 2 says its terminals are "twin #10 studs spaced for dual-hole lug
    with 5/8 inch hole spacing"; the supply here is the AC housing with a plain two-pole block, and
    the protective earth terminal "on the opposite side" is not drawn. The data sheet reads
    "AWG #6 Max" for the DC input connector and table 7 reads 2 to 4 AWG; the larger conductor
    (the guide's) is the one a lug takes.
- what: rack-ears-and-kits
  scope: [front]
  reason: needs-drawing
  wanted: >-
    THE KITS, AND THE EAR POSITION THAT IS NOT FLUSH. `chassis.ears` states the one position the
    guide names for a 2RU switch: section 3.5 says the bracket sits "either flush with the front
    and rear panels, or not flush with the panels", and section 3.4 gives no two-post mounting for
    the 2RU switches, so the position is `4-post` only. It has no `at` (the guide's mounting
    figures are isometric drawings of other switches, the 7050 and the 7050SX-128), no `default`
    (no figure shows the ears as shipped) and the "not flush" case is left out because the guide
    does not say which way it sits. The data sheet's ordering information lists KIT-7202 (spare
    tool-free accessory kit v2 for 2RU, 4-post mount, 2x C19-C20) and KIT-7004-2UL (extended
    tool-free 4-post kit for 2-4RU) for the DR3A-36. Guide appendix B.1 gives KIT-7202 "rack
    depths of twenty two to thirty two inches" (558.8 to 812.8 mm) and its parts (ASY-06132 rack
    ear, ASY-03765 front rail, ASY-03767 rear sliding rail, two of each), but no document
    dimensions any of those parts, and none gives KIT-7004-2UL a range or a parts list. A kit
    contract needs its parts as components with a size, so neither kit is modelled and
    `chassis.kits` is left out.
- what: fan-and-supply-power
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    THE POWER DRAW OF FAN-7012H. Neither the guide nor the data sheet gives it. The supplies' own
    output (2400 W) is stated and is written.
- what: model-plates-of-the-variants
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The K and M variants print their own model line on the plate. This file prints one line.
groups:
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the thirty-six 400G QSFP-DD ports in EIGHTEEN COLUMNS OF TWO on a 23.05 mm pitch, numbered
      1 to 36 down each column from 1 at the top left, with `N up-arrow` and `down-arrow N+1`
      printed in the orange strip between the two cages of each column.
    attrs: {media: qsfp-dd, speed: 400g}
  osfp-ls-400g:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the two OSFP line-system ports, printed 37 and 38 (their ids are port-37 and port-38) and
      counted 1 and 2 here as the guide's callout table does ("Line system port (OSFP)" 1 and 2),
      beside the status lamps. The data sheet
      calls them OSFP-LS and says they are for dense 400G-ZR deployment.
    attrs: {media: osfp, speed: 400g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the machine's management interfaces: an RJ-45 serial console, a USB port for software and
      configuration updates, and a 10/100/1000 RJ-45 Ethernet management port, in a row at the
      upper right (guide section 4.5: "For most models, the front panel contains the console,
      management, and USB ports").
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the precision-timing connectors at the right edge: a Time-of-Day connector (USB-C, the mate
      of CAB-SYNCE-RJ) and two coax clock connectors, 1PPS and 10MHz, which the guide calls
      "E-Sync clock connectors". The data sheet's "PPS/10M/ToD inputs".
  grounding: {term: Point, role: service, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        datasheet: "Hot-swap Power Supplies 2 (1+1 redundant)"; guide section 4.4: "The switch operates
        with two installed power supplies. At least one power supply must connect to a power source."
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 'n+1'
      redundancy-note: >-
        datasheet: "Hot-swappable Fans 4 (N+1 redundant)"
