    size-over-ears: '48.3 x 8.8 x 61.2 cm (19 x 3.50 x 24.1 inches) per Table 1 of the guide, which includes the rack ears; the data sheet gives 43.99 x 8.79 x 61.18 cm "inc. handles"'
  performance:
