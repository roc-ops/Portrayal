configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis as it ships: two AC supplies and four fans in, all thirty-six QSFP-DD and both OSFP
      cages empty. The orderable builds below are this chassis with a licence and encryption variant.
  ac:
    kind: orderable
    description: >-
      The base switch with two AC supplies and four fans, front-to-rear air: DCS-7280DR3A-36-F ("2 x
      AC"). Spares: PWR-2411-AC-RED, FAN-7012H-RED.
    part-numbers:
      DCS-7280DR3A-36-F: {}
    bays:
      psu-1: arista/7280dr3a-pwr-2400-ac@1
      psu-2: arista/7280dr3a-pwr-2400-ac@1
  ac-m:
    kind: orderable
    description: >-
      The DR3AM-36 with TunnelSec: DCS-7280DR3AM-36-F, the same face, supplies and fans as the
      base switch. Table 4 gives it the base switch's power draw.
    part-numbers:
      DCS-7280DR3AM-36-F: {}
    bays:
      psu-1: arista/7280dr3a-pwr-2400-ac@1
      psu-2: arista/7280dr3a-pwr-2400-ac@1
  ac-k:
    kind: orderable
    description: >-
      The DR3AK-36 with large routes and TunnelSec: DCS-7280DR3AK-36-F, the same face, supplies and
      fans as the base switch. Table 4 gives it the base switch's power draw.
    part-numbers:
      DCS-7280DR3AK-36-F: {}
    bays:
      psu-1: arista/7280dr3a-pwr-2400-ac@1
      psu-2: arista/7280dr3a-pwr-2400-ac@1
  ac-k-s:
    kind: orderable
    description: >-
      The DR3AK-36 with secure boot enabled: DCS-7280DR3AK-36S-F ("large routes and TunnelSec, front
      to rear air, 2 x AC, secure boot enabled"), the same face, supplies and fans as the K.
    part-numbers:
      DCS-7280DR3AK-36S-F: {}
    bays:
      psu-1: arista/7280dr3a-pwr-2400-ac@1
      psu-2: arista/7280dr3a-pwr-2400-ac@1
  dc:
    kind: example
    description: >-
      Two DC supplies in place of the AC ones, front-to-rear air: what a "DCS-7280DR3A-36#" order
      (configurable fans and psu) with PWR-2411-DC-RED gives. The data sheet lists no DC part number
      of its own, so this is a worked build and not an orderable one.
