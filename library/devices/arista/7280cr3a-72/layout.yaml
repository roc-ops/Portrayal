gaps:
- what: front-from-photograph
  scope: [front]
  reason: needs-photo
  note: >-
    The guide has no front figure for this model and the data sheet's photograph is 408 px wide (0.93 px/mm), so every front
    position is read to about a millimetre. Legends, lamp glyphs, the speed-strip print and the port numbers are not legible in it.
  wanted: a flat figure or a studio photograph of the face.
- what: port-numbers
  scope: [front]
  reason: needs-photo
  note: >-
    The port numbers printed on the metal are not legible in the photograph and no held document lists them, so no numeral is
    printed and the port ids follow the library's other Arista boxes (provenance.port-numbering).
  wanted: a photograph or figure of the numbered face.
- what: model-plates
  scope: [front]
  reason: vendor-silent
  note: >-
    The photograph is a picture of the K build and prints "7280CR3AK-72". The plain and M plates are not shown, so every
    configuration prints "7280CR3A-72".
  wanted: a photograph of each plate.
- what: lamp-and-port-glyphs
  scope: [front]
  reason: needs-photo
  note: >-
    The glyphs beside the four system lamps, the legends of the Time-of-Day slot and the two clock jacks, and the symbols at the
    management jacks are not legible and are not drawn.
  wanted: a flat figure or a photograph of the right-hand end of the face.
- what: clock-connector-type
  scope: [front]
  reason: vendor-silent
  note: >-
    Neither the guide nor the data sheet names the clock connectors; they are seated as std/smb@1 from their drawn size and their
    direction (input or output) is not stated.
  wanted: the connector type.
- what: tod-connector-type
  scope: [front]
  reason: vendor-silent
  note: >-
    The Time-of-Day connector is seated as std/usb-c@1 because the data sheet's CAB-SYNCE-RJ names a USB-C mate.
  wanted: the connector type.
- what: usb-generation
  scope: [front]
  reason: vendor-silent
  note: >-
    Neither document gives the USB generation; the port is seated with the `usb2` skin as the one that claims least.
  wanted: the USB generation.
- what: environment
  scope: [front, rear]
  reason: sources-disagree
  note: >-
    Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet). The guide's, the newer document, is in attrs.
  wanted: the maker's statement of which is current.
- what: psu-part-numbers
  scope: [rear]
  reason: sources-disagree
  note: >-
    The guide's Table 4 and section 4.4.1 name PWR-1511-AC as this model's supply; the data sheet's model comparison names
    PWR-1513-AC or PWR-1512-AC and its ordering information lists PWR-1512-AC-RED and -BLUE and PWR-1513-AC-RED and -BLUE. The data
    sheet's is used, because it is the one with orderable part numbers; both name PWR-1511-DC.
  wanted: the maker's statement of which AC supply ships.
- what: rack-ears
  scope: [front]
  reason: needs-drawing
  note: >-
    The guide's chapter 3 figures are isometric drawings of other switches and carry no measure, and the kit guides for KIT-7201 and
    KIT-7004-2UL are not held, so no ear position or rail kit is written.
  wanted: a dimensioned drawing of the mounting bracket position, and the kit guides.
- what: psu-dc-face
  scope: [rear]
  reason: needs-drawing
  note: >-
    The PWR-1511-DC supplies are the library's existing drawing of that module, an AC housing with a plain terminal block; the guide
    shows a DC supply only in isometric figures.
  wanted: a flat drawing or photograph of the PWR-1511-DC.
- what: module-power
  scope: [rear]
  reason: vendor-silent
  note: >-
    The guide's power tables and the data sheet give whole-switch figures only; the fan modules' missing power figure (lint L27)
    stands. The supplies state their output.
  wanted: FAN-7012H power draw.
groups:
  qsfp28-100g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      The 72 100G QSFP ports in nine blocks of two columns and four rows, numbered 1 to 72 by the ids, the upper band of rows first
      and the odd number the upper cage of each column
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: one status lamp beside each port
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system, fan and two power supply lamps at the right of the management row
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      how the switch is reached out of band - the 10/100/1000 management port, the USB port and the RS-232 console port, in one
      row at the top right of the front panel
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the precision-timing connectors at the top right of the front: a Time-of-Day connector (USB-C, the mate of CAB-SYNCE-RJ) and
      two coax clock connectors, the data sheet's "PPS/10M/ToD inputs"
  grounding: {term: Point, role: service, index-origin: 1}
  psu-bays:
    term: Bay
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Data sheet: "Hot-swap Power Supplies 2 (1+1 redundant)". Guide section 4.4: at least one supply must connect to a power source
    description: the two hot-swap power supplies, 1+1 redundant
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: n+1
      redundancy-note: >-
        Data sheet: "Hot-swappable Fans 4 (N+1 redundant)"
    description: the four hot-swap fan modules
