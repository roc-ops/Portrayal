configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis with two AC supplies and four fan modules fitted, front-to-rear air, before any part number: the shape every build
      below starts from.
  f:
    kind: orderable
    description: >-
      The 7280CR3A-72 with two AC supplies and front-to-rear air: PWR-1512-AC-RED supplies and FAN-7012H-RED fan modules, all with red
      handles. Ordered as DCS-7280CR3A-72-F.
    part-numbers:
      DCS-7280CR3A-72-F: {}
  r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280CR3A-72 with two AC supplies and rear-to-front air: PWR-1512-AC-BLUE supplies and FAN-7012H-BLUE fan modules, all with blue
      handles. Ordered as DCS-7280CR3A-72-R.
    bays:
      psu-1: arista/7050x4-pwr-1500-ac-rev@1
      psu-2: arista/7050x4-pwr-1500-ac-rev@1
      fan-1: arista/7050x4-fan-7012h-rev@1
      fan-2: arista/7050x4-fan-7012h-rev@1
      fan-3: arista/7050x4-fan-7012h-rev@1
      fan-4: arista/7050x4-fan-7012h-rev@1
    part-numbers:
      DCS-7280CR3A-72-R: {}
  m-f:
    kind: orderable
    description: >-
      The 7280CR3AM-72 with TunnelSec encryption, the same face, supplies and fans as the base switch, front-to-rear air. Ordered as
      DCS-7280CR3AM-72-F.
    export-description: >-
      Arista 7280CR3AM-72 - a fixed 2RU data-centre router switch with 72 x 100G QSFP ports, TunnelSec
      encryption on all ports, running EOS
    attrs:
      features:
        encryption: all ports (MACsec, IPsec and VXLANsec, as TunnelSec)
    part-numbers:
      DCS-7280CR3AM-72-F: {}
  m-r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280CR3AM-72 with rear-to-front air. Ordered as DCS-7280CR3AM-72-R.
    export-description: >-
      Arista 7280CR3AM-72 - a fixed 2RU data-centre router switch with 72 x 100G QSFP ports, TunnelSec
      encryption on all ports, running EOS
    attrs:
      features:
        encryption: all ports (MACsec, IPsec and VXLANsec, as TunnelSec)
    bays:
      psu-1: arista/7050x4-pwr-1500-ac-rev@1
      psu-2: arista/7050x4-pwr-1500-ac-rev@1
      fan-1: arista/7050x4-fan-7012h-rev@1
      fan-2: arista/7050x4-fan-7012h-rev@1
      fan-3: arista/7050x4-fan-7012h-rev@1
      fan-4: arista/7050x4-fan-7012h-rev@1
    part-numbers:
      DCS-7280CR3AM-72-R: {}
  k-f:
    kind: orderable
    description: >-
      The 7280CR3AK-72 with large routes and TunnelSec, the same face, supplies and fans as the base switch, front-to-rear air. Ordered as
      DCS-7280CR3AK-72-F.
    export-description: >-
      Arista 7280CR3AK-72 - a fixed 2RU data-centre router switch with 72 x 100G QSFP ports, large routes and
      TunnelSec encryption, running EOS
    attrs:
      features:
        encryption: all ports (MACsec, IPsec and VXLANsec, as TunnelSec)
    part-numbers:
      DCS-7280CR3AK-72-F: {}
  k-r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280CR3AK-72 with rear-to-front air. Ordered as DCS-7280CR3AK-72-R.
    export-description: >-
      Arista 7280CR3AK-72 - a fixed 2RU data-centre router switch with 72 x 100G QSFP ports, large routes and
      TunnelSec encryption, running EOS
    attrs:
      features:
        encryption: all ports (MACsec, IPsec and VXLANsec, as TunnelSec)
    bays:
      psu-1: arista/7050x4-pwr-1500-ac-rev@1
      psu-2: arista/7050x4-pwr-1500-ac-rev@1
      fan-1: arista/7050x4-fan-7012h-rev@1
      fan-2: arista/7050x4-fan-7012h-rev@1
      fan-3: arista/7050x4-fan-7012h-rev@1
      fan-4: arista/7050x4-fan-7012h-rev@1
    part-numbers:
      DCS-7280CR3AK-72-R: {}
  ac1513-f:
    kind: example
    description: >-
      Two PWR-1513-AC-RED supplies and front-to-rear air, with FAN-7012H-RED fan modules: the other AC supply the data sheet lists for
      this switch. The data sheet does not say which supply an -F order carries, so this is a worked build and not an orderable one.
    bays:
      psu-1: arista/7280cr3a-pwr-1513-ac@1
      psu-2: arista/7280cr3a-pwr-1513-ac@1
  ac1513-r:
    kind: example
    airflow: back-to-front
    description: >-
      Two PWR-1513-AC-BLUE supplies and rear-to-front air, with FAN-7012H-BLUE fan modules. Not an orderable build; see ac1513-f.
    bays:
      psu-1: arista/7280cr3a-pwr-1513-ac-rev@1
      psu-2: arista/7280cr3a-pwr-1513-ac-rev@1
      fan-1: arista/7050x4-fan-7012h-rev@1
      fan-2: arista/7050x4-fan-7012h-rev@1
      fan-3: arista/7050x4-fan-7012h-rev@1
      fan-4: arista/7050x4-fan-7012h-rev@1
  dc-f:
    kind: example
    power: dc
    description: >-
      Two DC supplies and front-to-rear air: PWR-1511-DC-RED supplies and FAN-7012H-RED fan modules. The data sheet lists no DC part number
      for the switch; the supplies are spares, and a DC build is ordered through the "#" configurable SKUs.
    bays:
      psu-1: arista/7280r3-pwr-1500-dc@1
      psu-2: arista/7280r3-pwr-1500-dc@1
  dc-r:
    kind: example
    power: dc
    airflow: back-to-front
    description: >-
      Two DC supplies and rear-to-front air: PWR-1511-DC-BLUE supplies and FAN-7012H-BLUE fan modules. No DC part number is listed for the
      switch.
    bays:
      psu-1: arista/7050x4-pwr-1500-dc-rev@1
      psu-2: arista/7050x4-pwr-1500-dc-rev@1
      fan-1: arista/7050x4-fan-7012h-rev@1
      fan-2: arista/7050x4-fan-7012h-rev@1
      fan-3: arista/7050x4-fan-7012h-rev@1
      fan-4: arista/7050x4-fan-7012h-rev@1
