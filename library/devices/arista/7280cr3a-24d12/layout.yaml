format: 1
kind: device
name: 7280cr3a-24d12
version: 0.1.1
maturity: modelled
manufacturer: Arista
model: 7280CR3A-24D12
aliases:
- {name: DCS-7280CR3A-24D12, kind: marketing}
portfolio: {line: 7000 Series, family: 7280R3A}
description: >-
  Arista 7280CR3A-24D12 - a fixed 1RU data-centre router switch with 24 x 100G QSFP ports and 12 x 400G
  QSFP-DD ports, running EOS. The front carries three blocks of six columns of two stacked cages: the 100G
  ports in a block at each end and the 400G ports in the block between them, each cage with status lamps.
  At the right are four system lamps (system, fan, PS1, PS2) above a block holding the RJ-45 Ethernet
  management port, the USB port and the RJ-45 serial console, and, at the left of that block, a
  Time-of-Day connector and two clock connectors. The rear carries two hot-swap 1500 W power supplies at
  the ends and three hot-swap fan modules. The same panel is ordered with front-to-rear air (-F) or
  rear-to-front air (-R), as the 7280CR3A, the 7280CR3AM with TunnelSec encryption, the 7280CR3AK with large
  routes and TunnelSec, and the 7280CR3AK-24D12-S with secure boot.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7280R3A Series Quick Start Guide, Arista Networks, DOC-07042-01, 59 pages, PDF created 2025-05-16
      (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280R3A.pdf): Table 1 (dimensions and weights),
      Table 2 (operating and storage environment), Table 3 (power input), Table 4 (power draw and supported
      supplies), section 2.1 (airflow orientation, handle colour), Table 5 (1RU grounding), section 4.5
      (serial and management cables), Appendix A (status indicators, tables 9 to 13), Appendix D (rear panels,
      figures D-1 to D-4) and Appendix E (field replacement of power supplies and fan modules). The guide has
      NO FRONT FIGURE for this model: Appendix C draws only the DR3A-54 and DR3A-36. 7280R3A Series Data
      Center Switch Router Data Sheet, Arista Networks, 04-0040-26, dated April 15th, 2025
      (https://www.arista.com/assets/data/pdf/Datasheets/7280R3A-Datasheet.pdf): the model comparison of the
      7280CR3A-24D12, 7280CR3AM-24D12 and 7280CR3AK-24D12, the power supply specifications, the ordering
      information and the platform overview, whose one photograph of this face is the only front source.
      Held and checked first: intake COVERAGE.md, SOURCES.md (no 3D model, CAD drawing, studio photograph or
      Visio stencil is held; the stencil zip could not be fetched). No drawing or photograph is copied into
      the library, only transcribed facts and new drawings.
  gate-1-front:
    confidence: estimated
    note: >-
      THE FRONT IS DRAWN FROM THE DATA SHEET'S PHOTOGRAPH (page 6, "Arista 7280CR3A-24D12"), an embedded
      463 x 282 px raster whose chassis fills 415 px across (x 24 to 438) and 43 px down (y 130 to 172). It is
      a near-straight-on render. Gate 1: 415 px across 440.0 mm gives 0.943 px/mm; 43 px down 43.7 mm gives
      0.984 px/mm. They differ by four percent, which is one pixel of the height (the photograph's lower edge
      carries a lip or shadow row), so the face is near-orthographic and fractions along x are good to a
      pixel, along y to about a pixel and a half. 0.943 px/mm is used on both axes, so one pixel is 1.06 mm
      and EVERY FRONT POSITION BELOW IS ESTIMATED to about 1 mm. The scale anchor is the 440.0 mm body (the
      data sheet's 43.99 cm over the handles, left edge read at x 24 and right at x 438). The measure is a
      dark-run scan of the cage openings along x at the upper row and along y down two columns, read with
      a six-times enlargement beside it for the counts.
  gate-1-rear:
    confidence: estimated
    note: >-
      The guide draws the rear generically (D-1 to D-4) and does not say which model uses which. This
      model has three fan modules and is 1RU, so it is mapped to figure D-2 ("Rear Panel with Three Fan
      Modules (1RU)"), at the positions the 7280CR3-32D4 file read off the same figure (PS1 at 4.0 mm,
      PS2 at 362.3 mm, fans 78.6 mm wide at 107.7, 191.0 and 274.3 mm, 1.85 and 2.55 mm down). THE MAPPING IS
      ESTIMATED: it follows from fan count (data sheet: "Hot-swappable Fans 3"), height and supply count, not
      from a caption. Figure D-2 also draws a management-port block beside the first supply; it is not drawn
      here because this model carries its management ports on the FRONT (the data sheet's photograph) and the
      data sheet's three-fan rear view shows no jacks.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 1: 48.3 x 4.4 x 59.2 cm (19 x 1.75 x 23.3 in), 14.8 kg (32.6 lbs), the same for the
      7280CR3A-24D12, 7280CR3AM-24D12 and 7280CR3AK-24D12. Data sheet: 43.99 x 4.37 x 59.2 cm "inc. handles"
      (17.3 x 1.72 x 23.31 in), 32.6 lbs (14.79 kg). The 48.3 cm is over the mounting ears, so the body
      between them, which is what is modelled, is the data sheet's 43.99 cm (440.0 here); the height is the
      data sheet's 43.7 (the guide's 4.4 rounds it) and the depth its 592.0. 1RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's chapter 3 mounts the 1RU switch with the accessory-kit brackets in isometric
      drawings of another switch that carry no measure, and the kit guides are not held. The data sheet lists
      KIT-7101-D, KIT-7101-RK, KIT-7101-LD-RK and KIT-ADJ-RLR. No ear position is written and no rail kit is
      listed in chassis.kits. Recorded in the gap rack-ears.
  front-ports:
    confidence: estimated
    note: >-
      THIRTY-SIX CAGES IN THREE BLOCKS OF SIX COLUMNS OF TWO, counted in a six-times enlargement of the
      photograph and confirmed by the data sheet ("24 x QSFP100, 12 x QSFP-DD"). The left block is six
      stacked QSFP cages whose openings start at 12.7 mm from the left and step 19.1 mm (18 px; the registry's
      ganged pitch is 19.0 and is used); the middle block is six QSFP-DD cages starting at 134.7 mm on a
      25.45 mm step (24 px); the right block is six QSFP cages ending at 404.0 mm, started at 290.0 mm. The
      rows are the upper cage 14.0 to 23.6 mm down and the lower cage 27.8 to 37.4 mm down (centres 18.8
      and 32.6 mm, a 13.8 mm pitch, read from the dark openings at rows 144 to 151 and 157 to 164 px), the
      same grid in all three blocks. The 7280CR3-32D4 reads 15.3 mm for its 1RU stack off its guide
      figure; this photograph reads 13.8, one and a half millimetres short, and is used because it is this
      model's own picture. The registry cage sizes (std/qsfp-ganged 18.5 x 9.58, std/qsfp-dd 19.0 x 10.0)
      are seated centred on the measured openings, which read 17 to 18 px wide and 8 px tall (the photograph
      shows the dark interior and not the bezel). The belly-to-belly turn (upper cage upright, lower turned
      180) is the library's convention; the photograph cannot show the latch side.
  port-numbering:
    confidence: estimated
    note: >-
      THE PHOTOGRAPH'S PORT NUMBERS ARE NOT LEGIBLE (the speed strips carry about 4 px of print) AND NO
      DOCUMENT HELD LISTS THEM, so no numeral is printed. The ids follow the 7280CR3-32D4's precedent, whose
      400G cages in the middle carry the numbers after the 100G ones: the 24 QSFP cages are port-1 to
      port-24 (left block 1 to 12, right block 13 to 24) and the 12 QSFP-DD cages in the middle are port-25
      to port-36, the odd number the upper cage of each column. ESTIMATED; a photograph of the face or a
      figure closes it. EOS names ports Ethernet1 and up and Management1; they are not printed on the metal
      and are not modelled.
  port-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.2 and Table 10: port LEDs sit near their ports (off link down, green link up,
      yellow software disabled, flashing yellow failed diagnostics). The photograph shows two green dots
      above each upper QSFP cage, at its left and right corners, and two below each lower one (a pair at
      each boundary between columns), so each QSFP port carries two lamps; each QSFP-DD cage carries one,
      beside it (the left of an upper cage, the right of a lower one). The second QSFP lamp's meaning is not
      stated; both take Table 10's states. Positions are read to a pixel.
  speed-strips:
    confidence: estimated
    note: >-
      The photograph draws a lavender strip between the two rows under each 100G column and a smaller
      orange one under each 400G column, with print too small to read. They are drawn in those colours as
      6.4 mm strips centred on each column, 2.0 mm tall between the rows; the print is not drawn.
  status-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.1, Table 9: system status, fan status and a status lamp for each supply, four in a
      row at the top right of the photograph at 417.8, 422.4, 427.0 and 431.5 mm and 2.4 mm down. The glyphs
      printed under them are not legible, so no legend is drawn (the DR3A-54's figure prints PS1 and PS2;
      this photograph does not resolve them).
  management-ports:
    confidence: estimated
    note: >-
      A block at the right, 416.0 to 435.4 mm across and 5.3 to 41.1 mm down, holds three stacked jacks: the
      Ethernet management port at the top (with its two lamps), the USB port and the serial console at the
      bottom, the order of the DR3A-54's figure C-1 callouts 3 to 5. The jacks are seated at the library's
      sizes (RJ-45 15.8 x 13.2, USB 12.0 x 4.5) spread over the block; the photograph's openings read 10.6 and
      8.4 mm tall, the dark inside of the jack. Guide section 4.5: "For most models, the front panel contains
      the console, management, and USB ports"; the data sheet: "100/1000 Mgmt Ports 1", "USB Ports 1",
      "RS-232 Serial Ports 1 (RJ-45)". The management port is taken as 10/100/1000 (guide 4.5) and so 1g.
  timing:
    confidence: estimated
    note: >-
      A vertical Time-of-Day slot with a screw at each end at 409.9 mm across, 17.6 mm down, and two gold
      coax jacks below it at 409.2 mm and 30.4 and 39.2 mm down (about 4.8 mm across), a green lamp above
      the slot. The data sheet's "PTP and SyncE with OCXO and PPS/10M/ToD inputs" and its accessory
      "CAB-SYNCE-RJ  Spare Time of Day adapter cable (USB-C to 2 x RJ-45)" name the functions and a USB-C
      mate, so the slot is seated as std/usb-c@1 turned a quarter, as the 7280DR3A-54 does, and the jacks as
      std/smb@1 (4.83 mm, which the photograph's size matches; an SMA is 6.35). The coax type is not stated.
  front-legend:
    confidence: estimated
    note: >-
      A grey plate at the left, 0.4 to 11.4 mm across, carries the maker's wordmark in its lower half (turned
      to read upward) and the model line in its upper half. THE WORDMARK IS NOT DRAWN: a logo-zone region is
      reserved. The model line is plain text and is set as "7280CR3A-24D12"; the photograph prints
      "7280CR3AK-24D12" because it is a picture of the K build, and the M and K plates are not shown, so the
      same line is set on every configuration (gap model-plates).
  vents:
    confidence: estimated
    note: >-
      The photograph fills the spaces not taken by a cage with a dotted vent grid: a band along the top
      (y 1.0 to 12.4 mm), a band along the bottom (38.4 to 42.7 mm), and a column in each gap between the
      blocks. Each is drawn as one field in its measured extent, not hole by hole.
  rear:
    confidence: estimated
    note: >-
      Figure D-2 at the 7280CR3-32D4's reading: three fan modules 78.6 mm wide and 38.6 mm tall and two
      supplies 73.5 mm wide (the data sheet's "73.5MM") and 40.0 mm tall. The data sheet's three-fan rear
      view (page 6, the second picture) shows the same: a supply at each end, three red modules between.
  rear-fan:
    confidence: datasheet
    note: >-
      Data sheet: "Hot-swappable Fans 3 (N+1 redundant)", "Fan Tray FAN-7011H", spares FAN-7011H-F
      (front-to-rear) and FAN-7011H-R (rear-to-front). Guide section 2.1: a red handle is an air-exit module
      and a blue one an air-inlet module. The three fan modules are bays that accept arista/7280cr3-fan
      (FAN-7011H-F) or arista/7280cr3-fan-rev (FAN-7011H-R), both reused by part number from the 7280CR3-32D4.
  fru-bays:
    confidence: datasheet
    note: >-
      Guide Appendix E: "All fans and power supplies are hot swappable" and "all slots must be filled or
      covered with a blank for operation". SO THE TWO POWER SUPPLIES AND THE THREE FAN MODULES ARE BAYS.
      Nothing on this chassis is a built-in unit; the management ports are part of the chassis and are
      placements on the front. The held documents draw no blank for either bay, so none is modelled.
  power:
    confidence: datasheet
    note: >-
      Guide Table 4 reads "TBD" for the power draw of all three builds. The data sheet gives 346 W typical and
      845 W maximum (typical "measured at 25C ambient with 50% load on all ports, excludes transceivers"),
      used here. Supported supplies: Table 4 and section 4.4 name PWR-1511-AC and PWR-1511-DC; the data sheet's
      table and ordering information name the same, with the PWR-1511-AC-RED and -BLUE spares.
  configurations:
    confidence: datasheet
    note: >-
      Data sheet ordering information: DCS-7280CR3A-24D12-F and -R, DCS-7280CR3AM-24D12-F and -R,
      DCS-7280CR3AK-24D12-F and -R, DCS-7280CR3AK-24D12-S-F and -S-R ("secure boot enabled"), each "2 x AC", F
      for front to rear and R for rear to front air. The "#" orders ("configurable fans and psu") are orders of
      parts and are not listed. The A, M, K and K-S builds share the face, size, weight and supplies and differ in
      encryption, routes and secure boot, which each M, K and K-S configuration states in its own attrs and description (the
      data sheet's "Encryption" row, its overview of the 7280R3AK and its "secure boot enabled" ordering lines;
      its power, memory, CPU, SSD, minimum EOS and licence group are one value for the three builds, so the
      device's stand). The data sheet lists no DC part number for the switch (the PWR-1511-DC-RED and
      -BLUE supplies are spares), so the DC builds are examples. The suffix -S in this family is secure boot,
      not an empty-bay build, and the guide draws no blank for a bay, so no configuration shows an open bay.
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, altitude 0 to 3,000 m, humidity 5 to 90 percent
      non-condensing. Data sheet: operating 0 to 40 C, storage -40 to 70 C, humidity 5 to 90 percent, altitude
      0 to 3,000 m. Only the storage temperature differs; the guide's, the newer document, is in attrs.
  colour:
    confidence: estimated
    note: >-
      The front plate is #aaabad, the 7280CR3-32D4's reading of the same family's plate (the photograph's plate
      reads a similar light grey).
  lifecycle:
    confidence: estimated
    note: >-
      Searched 2026-10-24 for an end-of-sale notice for the 7280CR3A-24D12, 7280CR3AM-24D12 and
      7280CR3AK-24D12: none found for this family (the notices found are for older 7280 models), so the field
      reads none-announced.
  other-faces:
    confidence: datasheet
    note: >-
      No source draws the top, bottom or sides flat. The guide's installation figures are isometric. Each carries
      an `empty` sentence. The 1RU grounding point is on the bottom of the chassis for the KIT-GND-EXT-1RU kit
      (guide section 4.2, Table 5); no figure measures it.
attrs:
  physical:
    weight: 14.8 kg (32.6 lbs) for the 7280CR3A-24D12, 7280CR3AM-24D12 and 7280CR3AK-24D12 (guide Table 1); 32.6 lbs (14.79 kg) in the data sheet
    size-over-ears: 48.3 x 4.4 x 59.2 cm (19 x 1.75 x 23.3 in) with the mounting ears (guide Table 1)
  performance:
    throughput: 7.2 (14.4) Tbps
    packets-per-second: 2.7 Bpps
    latency: from 3.8 us
    packet-buffer: 8 GB
    max-400g-ports: 12
    max-100g-ports: 72
    max-50g-ports: 116
    max-40g-ports: 36
    max-25-10g-ports: 116
    max-total-interfaces: 116
  power:
    power-draw-typical-w: 346
    power-draw-max-w: 845
    power-draw-note: 'Data sheet: "346 W / 845 W", typical measured at 25 C ambient with 50 percent load on all ports, excluding transceivers. Guide Table 4 reads TBD.'
    psu-redundancy: 1+1
    input-ac: 200 - 240 VAC, 9.6 A (PWR-1511-AC), IEC 60320 C14
    input-dc: -48 to -60 VDC (PWR-1511-DC)
  thermal:
    airflow: front-to-rear or rear-to-front, set by the fan modules and supplies fitted
    fan-redundancy: 3 hot-swap fan modules, N+1
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -25 to 70 C (-13 to 158 F)
    storage-temp-datasheet: -40 to 70 C (-40 to 158 F), per the data sheet
    altitude: 0 to 3,000 m (0 to 10,000 ft)
    humidity: 5 to 90 percent, non-condensing
  platform:
    cpu: Eight-core x86
    system-memory: 64 GB
    ssd-storage: 480 GB
    software: EOS; minimum release 4.31.1 per the data sheet
    feature-license: EOS Feature Licenses Group 4
  features:
    optics-qsfp28: each of the 24 QSFP cages runs 100G, or 40G (QSFP+), 50G and 25/10G modes by breakout (data sheet)
    optics-qsfp-dd: each of the 12 QSFP-DD cages runs 400G, or 100G, 50G, 40G and 25/10G modes by breakout (data sheet)
    precision-timing: PTP and SyncE with OCXO and PPS/10M/ToD inputs
    encryption: none on the 7280CR3A-24D12; all ports (MACsec, IPsec and VXLANsec) on the 7280CR3AM-24D12 and 7280CR3AK-24D12
  management:
    console: RJ-45 serial (RS-232), 9600 baud, 8 data bits, no parity, 1 stop bit, no flow control
    oob: 10/100/1000 Ethernet management port
  compliance:
    safety: EN 62368-1:2020+A11:2020, IEC 62368-1:2018, CSA/UL 62368-1:2019, AS/NZS 62368.1:2022
    emissions: FCC Class A, ICES-003 Issue 7, EN 55032:2015, VCCI-CISPR 32:2016, AS/NZS CISPR 32:2015
    regulatory-model-number: AN1779 (DCS-7280CR3A-24D12, DCS-7280CR3AM-24D12, DCS-7280CR3AK-24D12), guide Table 14
  lifecycle: {eol: none-announced}
