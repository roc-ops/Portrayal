gaps:
- what: front-from-photograph
  scope: [front]
  reason: needs-photo
  note: >-
    The guide has no front figure for this model and the data sheet's photograph is 463 px wide (0.94 px/mm), so
    every front position is read to about a millimetre. Legends, lamp glyphs, the speed-strip print and the port
    numbers are not legible in it.
  wanted: a flat figure or a studio photograph of the face.
- what: port-numbers
  scope: [front]
  reason: needs-photo
  note: >-
    The port numbers printed on the metal are not legible in the photograph and no held document lists them, so no
    numeral is printed and the port ids follow the 7280CR3-32D4's precedent (provenance.port-numbering).
  wanted: a photograph or figure of the numbered face.
- what: second-port-lamp
  scope: [front]
  reason: needs-photo
  note: >-
    The photograph shows two lamps a QSFP port, and Table 10 describes one port LED; the second lamp's meaning is not
    stated. Both are given Table 10's states.
  wanted: the guide's account of the two port lamps.
- what: model-plates
  scope: [front]
  reason: vendor-silent
  note: >-
    The photograph is a picture of the K build and prints "7280CR3AK-24D12". The plain, M and K-S plates are not
    shown, so every configuration prints "7280CR3A-24D12".
  wanted: a photograph of each plate.
- what: lamp-and-port-glyphs
  scope: [front]
  reason: needs-photo
  note: >-
    The glyphs under the four system lamps, the legends of the Time-of-Day slot and the two clock jacks, and the
    symbols at the management jacks are not legible and are not drawn.
  wanted: a flat figure or a photograph of the right-hand end of the face.
- what: clock-connector-type
  scope: [front]
  reason: vendor-silent
  note: >-
    Neither the guide nor the data sheet names the clock connectors; they are seated as std/smb@1 from their drawn size
    and their direction (input or output) is not stated.
  wanted: the connector type.
- what: tod-connector-type
  scope: [front]
  reason: vendor-silent
  note: >-
    The Time-of-Day connector is seated as std/usb-c@1 because the data sheet's CAB-SYNCE-RJ names a USB-C mate.
  wanted: the connector type.
- what: usb-generation
  scope: [front]
  reason: vendor-silent
  note: >-
    Neither document gives the USB generation; the port is seated with the `usb2` skin as the one that claims least.
  wanted: the USB generation.
- what: environment
  scope: [front, rear]
  reason: sources-disagree
  note: >-
    Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet). The guide's, the newer document, is in attrs.
  wanted: the maker's statement of which is current.
- what: rack-ears
  scope: [front]
  reason: needs-drawing
  note: >-
    The guide's chapter 3 figures are isometric drawings of another switch and carry no measure, and the kit guides for KIT-7101-D
    and the other spares are not held, so no ear position or rail kit is written.
  wanted: a dimensioned drawing of the mounting bracket position, and the kit guides.
- what: psu-dc-face
  scope: [rear]
  reason: needs-drawing
  note: >-
    The PWR-1511-DC supplies are the library's existing drawing of that module, an AC housing with a plain terminal block; the guide
    shows a DC supply only in isometric figures.
  wanted: a flat drawing or photograph of the PWR-1511-DC.
- what: module-power
  scope: [rear]
  reason: vendor-silent
  note: >-
    The guide's power tables and the data sheet give whole-switch figures only; the fan modules' missing power figure (lint L27)
    stands. The supplies state their output.
  wanted: FAN-7011H power draw.
- what: grounding
  scope: [bottom]
  reason: needs-drawing
  note: >-
    The 1RU grounding point is on the bottom of the chassis for KIT-GND-EXT-1RU (guide section 4.2, Table 5). No flat figure
    measures it, so it is not placed.
  wanted: a flat drawing of the bottom with the grounding bracket holes.
groups:
  qsfp28-100g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      The 24 100G QSFP ports in a block of twelve at each end, six columns of two stacked cages, numbered 1 to 12 (left)
      and 13 to 24 (right) by the ids, the odd number the upper cage of each column
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
    description: >-
      The 12 400G QSFP-DD ports in the block between them, six columns of two stacked cages, numbered 25 to 36 by the ids,
      the odd number the upper cage of each column
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: two status lamps for each QSFP port at its upper or lower corners and one beside each QSFP-DD cage
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system, fan and two power supply lamps at the top right of the front
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      how the switch is reached out of band - the 10/100/1000 management port, the USB port and the RS-232 console port,
      stacked in one block at the right of the front panel
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the precision-timing connectors at the right of the front: a Time-of-Day connector (USB-C, the mate of CAB-SYNCE-RJ) and
      two coax clock connectors, the data sheet's "PPS/10M/ToD inputs"
  psu-bays:
    term: Bay
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Data sheet: "Hot-swap Power Supplies 2 (1+1 redundant)". Guide section 4.4: at least one supply must connect to a power source
    description: the two hot-swap power supplies, 1+1 redundant
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: n+1
      redundancy-note: >-
        Data sheet: "Hot-swappable Fans 3 (N+1 redundant)"
    description: the three hot-swap fan modules
