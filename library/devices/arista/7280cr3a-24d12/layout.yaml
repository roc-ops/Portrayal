configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis with two AC supplies and three fan modules fitted, front-to-rear air, before any part number: the shape every build
      below starts from.
  f:
    kind: orderable
    description: >-
      The 7280CR3A-24D12 with two AC supplies and front-to-rear air: PWR-1511-AC-RED supplies and FAN-7011H-F fan modules, all with red
      handles. Ordered as DCS-7280CR3A-24D12-F.
    part-numbers:
      DCS-7280CR3A-24D12-F: {}
  r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280CR3A-24D12 with two AC supplies and rear-to-front air: PWR-1511-AC-BLUE supplies and FAN-7011H-R fan modules, all with blue
      handles. Ordered as DCS-7280CR3A-24D12-R.
    bays:
      psu-1: arista/7280cr3a-pwr-1511-ac-rev@1
      psu-2: arista/7280cr3a-pwr-1511-ac-rev@1
      fan-1: arista/7280cr3-fan-rev@1
      fan-2: arista/7280cr3-fan-rev@1
      fan-3: arista/7280cr3-fan-rev@1
    part-numbers:
      DCS-7280CR3A-24D12-R: {}
  m-f:
    kind: orderable
    description: >-
      The 7280CR3AM-24D12 with TunnelSec encryption, the same face, supplies and fans as the base switch, front-to-rear air. Ordered as
      DCS-7280CR3AM-24D12-F.
    export-description: >-
      Arista 7280CR3AM-24D12 - a fixed 1RU data-centre router switch with 24 x 100G QSFP ports and 12 x 400G
      QSFP-DD ports, TunnelSec encryption on all ports, running EOS
    attrs:
      features:
        encryption: all ports (MACsec, IPsec and VXLANsec, as TunnelSec)
    part-numbers:
      DCS-7280CR3AM-24D12-F: {}
  m-r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280CR3AM-24D12 with rear-to-front air. Ordered as DCS-7280CR3AM-24D12-R.
    export-description: >-
      Arista 7280CR3AM-24D12 - a fixed 1RU data-centre router switch with 24 x 100G QSFP ports and 12 x 400G
      QSFP-DD ports, TunnelSec encryption on all ports, running EOS
    attrs:
      features:
        encryption: all ports (MACsec, IPsec and VXLANsec, as TunnelSec)
    bays:
      psu-1: arista/7280cr3a-pwr-1511-ac-rev@1
      psu-2: arista/7280cr3a-pwr-1511-ac-rev@1
      fan-1: arista/7280cr3-fan-rev@1
      fan-2: arista/7280cr3-fan-rev@1
      fan-3: arista/7280cr3-fan-rev@1
    part-numbers:
      DCS-7280CR3AM-24D12-R: {}
  k-f:
    kind: orderable
    description: >-
      The 7280CR3AK-24D12 with large routes and TunnelSec, the same face, supplies and fans as the base switch, front-to-rear air. Ordered
      as DCS-7280CR3AK-24D12-F.
    export-description: >-
      Arista 7280CR3AK-24D12 - a fixed 1RU data-centre router switch with 24 x 100G QSFP ports and 12 x 400G
      QSFP-DD ports, large routes and TunnelSec encryption, running EOS
    attrs:
      features:
        encryption: all ports (MACsec, IPsec and VXLANsec, as TunnelSec)
    part-numbers:
      DCS-7280CR3AK-24D12-F: {}
  k-r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280CR3AK-24D12 with rear-to-front air. Ordered as DCS-7280CR3AK-24D12-R.
    export-description: >-
      Arista 7280CR3AK-24D12 - a fixed 1RU data-centre router switch with 24 x 100G QSFP ports and 12 x 400G
      QSFP-DD ports, large routes and TunnelSec encryption, running EOS
    attrs:
      features:
        encryption: all ports (MACsec, IPsec and VXLANsec, as TunnelSec)
    bays:
      psu-1: arista/7280cr3a-pwr-1511-ac-rev@1
      psu-2: arista/7280cr3a-pwr-1511-ac-rev@1
      fan-1: arista/7280cr3-fan-rev@1
      fan-2: arista/7280cr3-fan-rev@1
      fan-3: arista/7280cr3-fan-rev@1
    part-numbers:
      DCS-7280CR3AK-24D12-R: {}
  ks-f:
    kind: orderable
    description: >-
      The 7280CR3AK-24D12 with secure boot enabled, front-to-rear air. Ordered as DCS-7280CR3AK-24D12-S-F.
    export-description: >-
      Arista 7280CR3AK-24D12-S - a fixed 1RU data-centre router switch with 24 x 100G QSFP ports and 12 x 400G
      QSFP-DD ports, large routes, TunnelSec encryption and secure boot, running EOS
    attrs:
      features:
        encryption: all ports (MACsec, IPsec and VXLANsec, as TunnelSec)
    part-numbers:
      DCS-7280CR3AK-24D12-S-F: {}
  ks-r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280CR3AK-24D12 with secure boot enabled and rear-to-front air. Ordered as DCS-7280CR3AK-24D12-S-R.
    export-description: >-
      Arista 7280CR3AK-24D12-S - a fixed 1RU data-centre router switch with 24 x 100G QSFP ports and 12 x 400G
      QSFP-DD ports, large routes, TunnelSec encryption and secure boot, running EOS
    attrs:
      features:
        encryption: all ports (MACsec, IPsec and VXLANsec, as TunnelSec)
    bays:
      psu-1: arista/7280cr3a-pwr-1511-ac-rev@1
      psu-2: arista/7280cr3a-pwr-1511-ac-rev@1
      fan-1: arista/7280cr3-fan-rev@1
      fan-2: arista/7280cr3-fan-rev@1
      fan-3: arista/7280cr3-fan-rev@1
    part-numbers:
      DCS-7280CR3AK-24D12-S-R: {}
  dc-f:
    kind: example
    power: dc
    description: >-
      Two DC supplies and front-to-rear air: PWR-1511-DC-RED supplies and FAN-7011H-F fan modules. The data sheet lists no DC part number
      for the switch; the supplies are spares, and a DC build is ordered through the "#" configurable SKUs.
    bays:
      psu-1: arista/7280r3-pwr-1500-dc@1
      psu-2: arista/7280r3-pwr-1500-dc@1
  dc-r:
    kind: example
    power: dc
    airflow: back-to-front
    description: >-
      Two DC supplies and rear-to-front air: PWR-1511-DC-BLUE supplies and FAN-7011H-R fan modules. No DC part number is listed for the
      switch.
    bays:
      psu-1: arista/7050x4-pwr-1500-dc-rev@1
      psu-2: arista/7050x4-pwr-1500-dc-rev@1
      fan-1: arista/7280cr3-fan-rev@1
      fan-2: arista/7280cr3-fan-rev@1
      fan-3: arista/7280cr3-fan-rev@1
