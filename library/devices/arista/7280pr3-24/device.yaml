configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis with two AC supplies and three fan modules fitted, front-to-rear air, before any part
      number: the shape every build below starts from.
  f:
    kind: orderable
    description: >-
      The 7280PR3-24 with two AC supplies and front-to-rear air: PWR-1511-AC-RED supplies and FAN-7011H-F
      fan modules, all with red handles. Ordered as DCS-7280PR3-24-F.
    part-numbers:
      DCS-7280PR3-24-F: {}
  k-f:
    kind: orderable
    description: >-
      The 7280PR3K-24, the same hardware with 64 GB of memory and the large-routes licence, with front-to-rear
      air. Ordered as DCS-7280PR3K-24-F.
    export-description: >-
      Arista 7280PR3K-24 - the large-routes build of the 7280PR3-24 with 64 GB of memory, a fixed 1RU
      data-centre switch router with 24 x 400G OSFP ports, running EOS
    attrs:
      platform: {memory: 64 GB, storage: 8 GB flash; 120 GB SSD}
    part-numbers:
      DCS-7280PR3K-24-F: {}
  dc-f:
    kind: example
    power: dc
    description: >-
      Two DC supplies and front-to-rear air: PWR-1511-DC-RED supplies and FAN-7011H-F fan modules. The
      data sheet lists no DC part number for the switch; the supplies are spares, and a DC build is ordered
      through the "#" configurable SKUs.
    bays: {psu-1: arista/7280r3-pwr-1500-dc@1, psu-2: arista/7280r3-pwr-1500-dc@1}
