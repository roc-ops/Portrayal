gaps:
- what: size-conflict
  scope:
  - front
  - rear
  reason: sources-disagree
  note: >-
    The 7280CR3K-32P4A draws 535 W typical and 851 W maximum in the guide's Table 4 and 543 W / 865 W
    in the data sheet's comparison table (the figures the guide gives the 32D4A). The guide's Table 4
    is used for the device.
  wanted: the maker's statement of which is current.
- what: environment
  scope:
  - front
  - rear
  reason: sources-disagree
  note: >-
    Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet), and relative humidity
    5 to 90 percent against 5 to 95 percent. The guide's, the older document by three months, are in attrs.
  wanted: the maker's statement of which is current.
- what: dc-input-voltage
  scope:
  - rear
  reason: sources-disagree
  note: >-
    The PWR-1011-DC input is "-40 to -60 VDC, 30 A" in guide Table 3 and "-48 to -60V DC" in the data
    sheet's power supply table. The guide's is in the component, the data sheet's in its provenance.
  wanted: the maker's statement of which is current.
- what: rack-ears
  scope:
  - front
  reason: needs-drawing
  note: >-
    The guide's Figures 3-1 to 3-4 are isometric drawings of another switch and carry no measure, and
    the kit guides for KIT-7001, KIT-7101-D and the other spares are not held, so no ear position or rail
    kit is written.
  wanted: a dimensioned drawing of the mounting bracket position, and the kit guides.
- what: port-lamp-count
  scope:
  - front
  reason: needs-photo
  note: >-
    Figure C-3 draws four dots a QSFP port, but Table 10 describes one port LED and does not say what
    each of the four shows. All four are given Table 10's states.
  wanted: the guide's account of the port lamps, or a photograph of the lit face.
- what: front-legends
  scope:
  - front
  reason: needs-photo
  note: >-
    The port-speed band's legends, the small print over each cage, the system and fan lamp glyphs and
    the PS1 and PS2 legends are unreadable in the 574 px figure. The glyphs and the two PS legends are
    drawn as read; the band and cage legends are not drawn.
  wanted: a photograph of the face.
- what: cage-orientation
  scope:
  - front
  reason: needs-photo
  note: >-
    Which side the latches of the stacked cages face is not visible in the figure. The library's convention
    is used for each cage type (QSFP upper cage upright, lower turned 180; OSFP both rows the same way
    up).
  wanted: a photograph of the stacked cages.
- what: rear-mgmt-block
  scope:
  - rear
  reason: needs-photo
  note: >-
    The management block's arrow marks and its console symbol are drawn as the 7280CR3-32D4 draws them;
    the order of the three ports follows the datasheet's rear view and the library's other Arista stacks,
    and the figure's 1.24 px/mm resolves it only as three stacked ports.
  wanted: a photograph of the rear management block.
- what: psu-dc-face
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The PWR-1011-DC supplies are drawn as the AC supply's housing with a plain two-pole terminal block.
    The guide shows a DC supply only in isometric figures; the real terminal arrangement is not drawn.
  wanted: a flat drawing or photograph of the PWR-1011-DC.
- what: module-power
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The guide's power tables and the data sheet give whole-switch figures only; the fan modules' missing
    power figure (lint L27) stands. The supplies state their output.
  wanted: FAN-7011H power draw.
- what: grounding
  scope:
  - bottom
  reason: needs-drawing
  note: >-
    The 1RU grounding point is on the bottom of the chassis for KIT-GND-EXT-1RU (guide section 4.2, Table
    5, Figure 4-2). No flat figure measures it, so it is not placed.
  wanted: a flat drawing of the bottom with the grounding bracket holes.
