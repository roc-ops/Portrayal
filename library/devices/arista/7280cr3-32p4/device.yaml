configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis with two AC supplies and three fan modules fitted, front-to-rear air, before any part
      number: the shape every build below starts from.
  f:
    kind: orderable
    description: >-
      The 7280CR3-32P4 with two AC supplies and front-to-rear air: PWR-1011-AC-RED supplies and FAN-7011H-F
      fan modules, all with red handles. Ordered as DCS-7280CR3-32P4-F.
    part-numbers:
      DCS-7280CR3-32P4-F: {}
  r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280CR3-32P4 with two AC supplies and rear-to-front air: PWR-1011-AC-BLUE supplies and FAN-7011H-R
      fan modules, all with blue handles. Ordered as DCS-7280CR3-32P4-R.
    bays: {psu-1: arista/7280cr3-pwr-1000-ac-rev@1, psu-2: arista/7280cr3-pwr-1000-ac-rev@1, fan-1: arista/7280cr3-fan-rev@1,
      fan-2: arista/7280cr3-fan-rev@1, fan-3: arista/7280cr3-fan-rev@1}
    part-numbers:
      DCS-7280CR3-32P4-R: {}
  k-f:
    kind: orderable
    description: >-
      The 7280CR3K-32P4, the same hardware with 64 GB of memory and the large-routes licence, with front-to-rear
      air. Ordered as DCS-7280CR3K-32P4-F.
    export-description: >-
      Arista 7280CR3K-32P4 - the large-routes build of the 7280CR3-32P4, a fixed 1RU data-centre switch
      router with 32 x 100G QSFP and 4 x 400G OSFP ports and 64 GB of memory, running EOS
    attrs:
      platform: {cpu: Quad-Core x86, memory: 64 GB, storage: 8 GB flash; 120 GB SSD}
      features: {eos-license: license group G3; minimum EOS 4.22.1}
    part-numbers:
      DCS-7280CR3K-32P4-F: {}
  k-r:
    kind: orderable
    airflow: back-to-front
    description: The 7280CR3K-32P4 with rear-to-front air. Ordered as DCS-7280CR3K-32P4-R.
    bays: {psu-1: arista/7280cr3-pwr-1000-ac-rev@1, psu-2: arista/7280cr3-pwr-1000-ac-rev@1, fan-1: arista/7280cr3-fan-rev@1,
      fan-2: arista/7280cr3-fan-rev@1, fan-3: arista/7280cr3-fan-rev@1}
    export-description: >-
      Arista 7280CR3K-32P4 - the large-routes build of the 7280CR3-32P4, a fixed 1RU data-centre switch
      router with 32 x 100G QSFP and 4 x 400G OSFP ports and 64 GB of memory, running EOS
    attrs:
      platform: {cpu: Quad-Core x86, memory: 64 GB, storage: 8 GB flash; 120 GB SSD}
      features: {eos-license: license group G3; minimum EOS 4.22.1}
    part-numbers:
      DCS-7280CR3K-32P4-R: {}
  k-a-f:
    kind: orderable
    description: >-
      The 7280CR3K-32P4A, the K build with an eight-core CPU, with front-to-rear air. The guide's Table
      4 gives it 535 W typical and 851 W maximum, the same as the other builds (the data sheet says 543
      W / 865 W). Ordered as DCS-7280CR3K-32P4A-F.
    export-description: >-
      Arista 7280CR3K-32P4A - the large-routes, eight-core build of the 7280CR3-32P4 with 64 GB of memory,
      a fixed 1RU data-centre switch router with 32 x 100G QSFP and 4 x 400G OSFP ports, running EOS
    attrs:
      platform: {cpu: Eight-Core x86, memory: 64 GB, storage: 120 GB SSD (no flash storage)}
      features: {eos-license: license group G3; minimum EOS 4.27.2}
    part-numbers:
      DCS-7280CR3K-32P4A-F: {}
  k-a-r:
    kind: orderable
