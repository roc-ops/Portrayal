format: 1
kind: device
name: 7280cr3-32p4
version: 0.1.1
maturity: modelled
manufacturer: Arista
model: 7280CR3-32P4
aliases:
- {name: DCS-7280CR3-32P4, kind: marketing}
portfolio: {line: 7000 Series, family: 7280CR3}
description: >-
  Arista 7280CR3-32P4 - a fixed 1RU data-centre switch router with 32 x 100G QSFP ports and 4 x 400G OSFP
  ports, running EOS. The front carries the 100G cages in two stacked rows, the odd number on top, in
  two blocks of eight columns, with a status lamp group of four above each upper cage and below each lower
  one. The four 400G OSFP cages are two stacked columns between the blocks. Four system lamps (system,
  fan, PS1, PS2) are at the right. The rear carries two hot-swap power supplies at the ends and three
  hot-swap fan modules, with the RJ-45 management port, the USB port and the RJ-45 console port between
  the left supply and the first fan. The same panel is ordered with front-to-rear air (-F) or rear-to-front
  air (-R). It is sold as the 7280CR3-32P4, as the 7280CR3K-32P4 with more memory and routes, and as the
  7280CR3K-32P4A with an eight-core CPU.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7280R3 Series Quick Start Guide, Arista Networks, document DOC-07041-01, 63 pages, PDF created 2025-05-16
      (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280R3.pdf): Table 1 (dimensions and weights),
      Table 2 (operating and storage), Table 3 (power input), Table 4 (power draw and supported supplies),
      section 2.1 (airflow orientation, handle colour), Table 5 (grounding), section 4.5 (serial and management
      cables), Appendix A (status indicators, Tables 9 to 13), Appendix C (Figure C-3, the front panel
      of the DCS-7280CR3-32P4, 7280CR3K-32P4 and 7280CR3K-32P4A), Appendix D (Figure D-2, the rear panel
      with three fan modules), Appendix E (field replacement). 7280 Data Center Switches Quick Start Guide,
      Arista Networks, 58 pages, PDF created 2022-06-03 (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280_1RU_Gen3.pdf):
      Figure 49 (DCS-7280CR3-32P4 and 7280CR3K-32P4), the cross-check of Figure C-3. 7280R3 Series Data
      Center Switch Router Data Sheet, Arista Networks, 03-0045-59, dated August 11th, 2025 (https://www.arista.com/assets/data/pdf/Datasheets/7280R3-Data-Sheet.pdf):
      the model comparison of the 7280CR3-32P4, CR3K-32P4 and CR3K-32P4A, the power supply specifications
      and the ordering information. Held and checked first: intake COVERAGE.md and SOURCES.md, which list
      no photograph, Visio stencil, 3D model or CAD file for this model (Arista publishes none; the stencil
      zip could not be fetched). The data sheet's picture of the face is a thumbnail. No drawing, photograph
      or logo is copied into the library, only transcribed facts and new drawings.
  gate-1-front:
    confidence: estimated
    note: >-
      Figure C-3 passes. The raster is 574 x 116 pixels; the body measures 561 px wide and 56 px tall
      (aspect 10.0), against the data sheet's 440.0 / 43.7 = 10.07, so the figure is near-orthographic
      and carries geometry at 1.273 px/mm (the 440 mm body is the scale anchor, its left edge read at
      8.7 px as for the sibling 7280CR3-32D4 face). One pixel is 0.8 mm, so every position is good to
      about 0.8 mm, and every one is `estimated` because it is read off a picture and no dimension states
      it. The old guide's Figure 49 is the same 574 x 116 raster, compared pixel for pixel (no pixel differs),
      so it is a repeat of the source and not a second reading. The status lamps are read from the green
      pixels of the lamps (550 px), which put them about 5 mm left of where the sibling 7280CR3-32D4 file
      puts its lamps.
  gate-1-rear:
    confidence: estimated
    note: >-
      Figure D-2 is a 552 x 126 px raster whose chassis is 544 px between its edges and 52 px tall (aspect
      10.5; the 3 percent excess is the cut-off bottom edge), 1.239 px/mm over the 440 mm body; positions
      are good to about 0.8 mm. The guide draws the rear generically (D-1 to D-4) and does not say which
      model uses which. The 7280CR3-32P4 is mapped to D-2 by its three fan modules (data sheet: "Hot-swappable
      Fans 3 (N+1 redundant)"), its 1RU height, its two power supplies and its management ports at the
      rear (Figure C-3 has none at the front). THE MAPPING IS ESTIMATED. The positions are the 7280CR3-32D4's,
      which is mapped to the same figure.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 1: 48.3 x 4.4 x 55.8 cm (19 x 1.75 x 22.0 in), 12.3 kg (27.0 lbs), the same for the
      7280CR3-32P4, 7280CR3K-32P4 and 7280CR3K-32P4A. Data sheet: 43.99 x 4.37 x 55.83 cm (17.3 x 1.72
      x 22.0 in), 27 lbs (12.27 kg). The width: 48.3 cm is over the mounting ears, so the body between
      them, which is what is modelled, is the data sheet's 43.99 cm (440.0 here), a 21.5 mm ear each side.
      The height is the data sheet's 43.7 (the guide rounds it to 4.4 cm). The depth is the data sheet's
      558.3 (the guide's 55.8 cm is the same figure rounded). 1RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's Chapter 3 mounts the switch with the accessory-kit brackets and shows
      them in isometric drawings of a different switch ("Illustrations in this chapter depict the mounting
      of a DCS-7050QX-32S switch") that carry no measure. The data sheet lists the spares KIT-7001, KIT-2POST-1U-NT,
      KIT-4POST-NT, KIT-7001-4POST-L, KIT-7101-D, KIT-7101-RK, KIT-7101-LD-RK, KIT-ADJ-RLR and KIT-GND-EXT-1RU.
      No figure measures a bracket position, and the kit guides are not held, so no ear position is written
      and no rail kit is listed in chassis.kits. Recorded in the gap rack-ears.
  front-ports:
    confidence: estimated
    note: >-
      Figure C-3 at 1.273 px/mm, read in a ten-times enlargement. Thirty-two QSFP100 cages in two stacked
      rows (ports 1 to 32), in eight-column blocks of two groups of four columns: the column centres read
      18.8, 37.8, 56.8 and 75.8 mm, then 107.9 to 164.9 for ports 9 to 16, then 261.3 to 318.3 for ports
      17 to 24 and 350.8 to 407.8 for ports 25 to 32. The column pitch inside a group is 19.0 (the registry's
      ganged-QSFP pitch) and the gap between groups is 13.3 mm wider than a column. The row centres read
      from the white number tabs at 14.7 and 30.4 mm down, a row pitch of 15.7. Four OSFP cages (33 over
      34 at 200.5 mm, 35 over 36 at 227.0 mm) sit between the blocks in yellow boxes 4.3 to 20.8 and 24.4
      to 40.5 mm down, so their centres are 12.55 and 32.45 mm down. std/osfp@1 (23.1 x 13.5) is seated.
      The belly-to-belly orientation of the QSFP cages is the library's convention (upper cage upright,
      lower turned 180); the OSFP cages sit the same way up, which is the library's convention for stacked
      OSFP cages (lint L108). The figure is too small to show the latch side.
  port-numbering:
    confidence: estimated
    note: >-
      Figure C-3 (callout 5, "Port numbers") prints 1 over 2, 3 over 4, and so on down each column and
      across, 1 to 32 in the two blocks, then 33 over 34 and 35 over 36 in the OSFP columns, which sit
      between ports 16 and 17 in space but are numbered after 32. The odd number is the upper cage. The
      figure prints each number on a white tab over the cage opening; a seated cage hides what is painted
      under it, so the numerals are set in the band between the two rows, the odd number left of its column
      centre and the even one right of it. EOS interface names are not printed on the metal and are not
      modelled.
  port-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.2, Table 10: "Port LEDs near their corresponding ports provide a link and operational
      status": off the link is down, green link up, yellow software disabled, flashing yellow failed diagnostics.
      Figure C-3 draws a row of four dark dots above each upper QSFP column and four below each lower
      one (the guide's Figure A-3 captions four dots "Port 4 LEDs"). FOUR LAMPS A QSFP PORT are modelled,
      a to d, 4.0 mm apart and centred on the column (the dots read 3.9 mm apart at 7.5 mm down above
      the upper cage and 37.3 mm down below the lower one). Table 10 gives one set of states, so all four
      carry it; what each of the four means is the gap port-lamp-count. The OSFP cages carry no lamp the
      figure shows (white light-pipe bars only).
  speed-strips:
    confidence: estimated
    note: >-
      Guide Figure C-3 callout 6, "Port-speed group": a thin grey band between the two rows carries small
      legends at each pair of columns (read as "A8" and "M*" style marks) and the OSFP columns sit on
      a grey plate with two screws at each end. The legends are unreadable at 85 ppi and are not drawn;
      the plate and the four screws are drawn.
  status-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.1, Table 9 and Figure C-3 callouts 1 to 4: a system status lamp (blinking green
      on power-up, green normal, blue locator, amber for two or more failed fans), a fan status lamp (green,
      amber for one module removed or failed, red for two or more) and a status lamp for each of the two
      power supplies (green operating, off removed or faulty). Four lamps in a column at 425.6 mm, 3.2
      mm apart from 5.2 mm down. The printed glyphs beside them are a system symbol, a fan symbol and
      two small legends read as PS1 and PS2.
  front-legend:
    confidence: estimated
    note: >-
      The vertical legend up the left plate reads the maker's wordmark above the model "7280CR3-32P4"
      (read at 574 px; the print is small). THE WORDMARK IS NOT DRAWN: a logo-zone region is reserved
      over it and the plain model text is set. The figure's small print is not legible, so the text is
      as the guide's caption names the model.
  vents:
    confidence: estimated
    note: >-
      The figure shows a perforated strip along the top (0.4 to 5.5 mm down), grids of dark squares in
      the gaps between the port groups (86.9 to 96.9, 177.4 to 186.9, 240.5 to 250.0 and 329.5 to 339.5
      mm across, 7.5 to 39.5 down), a grid left of port 1, and a ribbed strip of vertical slits along
      the bottom lip (39.3 to 43.2 mm down). Each is drawn as a vent field in its measured extent; the
      individual squares are not drawn one by one.
  rear:
    confidence: estimated
    note: >-
      Figure D-2 at 1.239 px/mm, the rear seen from behind with x = 0 at the left of the drawing. PS1
      is the left and PS2 the right (callouts 1 and 10). Each power supply module is 73.5 mm wide (the
      data sheet's "73.5MM") at 4.0 and 362.3 mm across and 1.85 mm down. The management block is a grey
      plate 83.0 to 101.0 mm across with the Ethernet management port, the USB port and the RJ-45 console
      port stacked in it, in the order the library draws other Arista management stacks. Three fan modules
      78.6 mm wide at 107.7, 191.0 and 274.3 mm across (an 83.3 mm pitch) and 2.55 mm down.
  rear-fan:
    confidence: datasheet
    note: >-
      Data sheet: "Hot-swappable Fans 3 (N+1 redundant)", "Fan Tray FAN-7011H", FAN-7011H-F (front-to-rear)
      and FAN-7011H-R (rear-to-front) as spares. Guide section 2.1: a red handle is an air-exit module
      and a blue handle an air-inlet one, and every module must have the same direction. The three fan
      modules are bays that accept FAN-7011H-F or -R; the -R configurations seat the blue modules.
  fru-bays:
    confidence: datasheet
    note: >-
      Guide Appendix E (E.2 power supplies, E.3 fan modules) gives removal and installation procedures,
      and the data sheet calls the supplies "1+1 hot-swappable" and the fans "hot-swap". SO THE TWO POWER
      SUPPLIES AND THE THREE FAN MODULES ARE BAYS. Nothing on this chassis is a built-in unit. The management
      block, the USB port and the console port are part of the chassis and are placements.
  power:
    confidence: datasheet
    note: >-
      Guide Table 4: typical / maximum 535 W / 851 W for the 7280CR3-32P4, the 7280CR3K-32P4 and the 7280CR3K-32P4A
      (unlike the 32D4A, the 32P4A draws the same), each with PWR-1011-AC or PWR-1011-DC. The data sheet's
      comparison table gives the K-32P4A 543 W / 865 W (gap `size-conflict`); the guide's Table 4 is used,
      and the data sheet's typical is "measured at 25C ambient with 50% load on all ports".
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, altitude 0 to 3,000 m, humidity 5 to 90
      percent non-condensing. Data sheet: operating 0 to 40 C, storage -40 to 70 C, humidity 5 to 95 percent,
      altitude 0 to 3,000 m. Storage temperature and humidity differ: gap `environment`, the guide's used.
  configurations:
    confidence: datasheet
    note: >-
      Data sheet ordering information: DCS-7280CR3-32P4-F and -R, DCS-7280CR3K-32P4-F and -R, and DCS-7280CR3K-32P4A-F
      and -R ("front to rear air, 2 x AC" and "rear to front air, 2 x AC"). The "#" SKUs ("configurable
      fans and psu") and the "-M#" memory-expansion order are orders of parts, not part numbers a DCIM
      can hold, and are not listed. The data sheet lists no DC build of the switch: the PWR-1011-DC-RED
      and -BLUE supplies are spares, so the DC configurations are examples with no part number. The K
      and K-A builds share the base model's size, weight, figure and supplies and differ in memory, CPU
      and routes; each is a configuration with its own part numbers, and its `attrs` state its own memory,
      CPU, storage and minimum EOS. There is no empty-bay (-S) configuration: no -S suffix exists in this
      family and the guide draws no blank for a power supply or fan module.
  interface-names:
    confidence: datasheet
    note: >-
      Not printed and not modelled. EOS names ports Ethernet1 to Ethernet36 and Management1; this is the
      vendor's convention and no held document prints it.
  colour:
    confidence: estimated
    note: >-
      The front plate is the 7280CR3-32D4's #aaabad, read there as the median of bare-plate pixels in
      the guide's figure of the same family.
  lifecycle:
    confidence: estimated
    note: >-
      Searched 2026-10-23 (web searches of Arista's end-of-sale notices) for a notice for the 7280CR3-32P4,
      7280CR3K-32P4 and 7280CR3K-32P4A: none found. The notices the searches returned were for older 7280
      models (which name the 32P4 as a replacement) and for the 7280SR3K-48YC8 (notice 23789) and 7280CR3K-36S
      (notice 23790) series, not for this one.
  other-faces:
    confidence: datasheet
    note: >-
      No source draws the top, bottom or sides flat. The guide's installation figures are isometric. Each
      carries an `empty` sentence. The 1RU grounding point is on the bottom of the chassis (guide section
      4.2, Table 5, KIT-GND-EXT-1RU, Figure 4-1 shows the 7280CR3-32P4); no figure measures it.
attrs:
  physical:
    weight: >-
      12.3 kg (27.0 lbs) for the 7280CR3-32P4, 7280CR3K-32P4 and 7280CR3K-32P4A (guide Table 1, data sheet)
    size-over-ears: 48.3 x 4.4 x 55.8 cm (19 x 1.75 x 22.0 in) with the mounting ears (guide Table 1)
  performance:
    throughput: 4.8 (9.6) Tbps
    packets-per-second: 2 Bpps
    latency: from 3.8 microseconds
    packet-buffer: 8 GB
    ports-max-speed: >-
      four ports of 400 Gbps; 48 of 100 Gbps; 96 of 50 Gbps; 36 of 40 Gbps; 96 of 25 or 10 Gbps
    interfaces-max: 96
  power:
    power-typical-w: 535
    power-max-w: 851
    power-envelope: as-tested
    power-measure: typical at 25 C ambient with 50 percent load on all ports (data sheet)
    psu-redundancy: 1+1
    input-ac: 100 - 240 VAC (PWR-1011-AC), IEC 60320 C14
    input-dc: -48 to -60 VDC (PWR-1011-DC)
    efficiency: 93 percent (Platinum) AC, 94 percent DC (data sheet)
  thermal:
    airflow: front-to-rear or rear-to-front, set by the fan modules and supplies fitted
    fan-redundancy: 3 hot-swap fan modules, N+1
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -25 to 70 C (guide Table 2); the data sheet says -40 to 70 C
    humidity: 5 to 90 percent non-condensing (guide Table 2); the data sheet says 5 to 95 percent
    altitude: 0 to 3,000 m (10,000 ft) operating
  platform:
    cpu: Quad-Core x86 (7280CR3-32P4 and 7280CR3K-32P4); Eight-Core x86 (7280CR3K-32P4A)
    memory: 8 GB, 64 GB optional (7280CR3-32P4); 64 GB (7280CR3K-32P4 and -32P4A)
    storage: 8 GB flash (not on the 7280CR3K-32P4A), 120 GB SSD (data sheet)
  features:
    optics-qsfp28: 100G, 50G, 40G, 25G and 10G with breakout, in the 32 QSFP cages (data sheet)
    optics-osfp: 400G and 100G, in the four OSFP cages (data sheet)
    eos-license: >-
      license group G3; minimum EOS 4.22.1 (7280CR3-32P4, 7280CR3K-32P4), 4.27.2 (7280CR3K-32P4A)
  management:
    console: RJ-45 RS-232 serial on the rear, 9600 baud 8N1, no flow control
    oob: one 10/100/1000 management port on the rear
    usb: one USB port on the rear, for software or configuration updates
  compliance:
    emc: >-
      FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386
    safety: EN 62368-1, IEC 62368-1, CSA/UL 62368-1
    certifications: BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI, TEC, ANATEL, ICASA (data sheet)
    rohs: RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)
  lifecycle: {eol: none-announced}
