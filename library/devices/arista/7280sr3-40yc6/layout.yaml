format: 1
kind: device
name: 7280sr3-40yc6
version: 0.1.1
maturity: modelled
manufacturer: Arista
model: 7280SR3-40YC6
aliases:
  - {name: DCS-7280SR3-40YC6, kind: marketing}
portfolio: {line: 7000 Series, family: 7280SR3}
description: >-
  Arista 7280SR3-40YC6 - a fixed 1RU data-centre switch router with 40 x 1/10/25G SFP ports and 6 x 100G QSFP
  ports, running EOS. The front carries the SFP cages in two stacked rows of twenty columns in two-column blocks,
  the odd number on top, with a status lamp at each end of every block row, and the six QSFP cages in two stacked
  rows of three columns at the right. Four system lamps (system, fan, PS1, PS2) are in a column at the far right. The
  rear carries two hot-swap 500 W power supplies at the ends and two hot-swap fan modules, with the RJ-45 management
  port, the USB port and the RJ-45 console port between the left supply and the first fan. The same panel is ordered with
  front-to-rear air (-F) or rear-to-front air (-R). It is sold as the 7280SR3-40YC6 and, with SyncE and more memory, as
  the 7280SR3E-40YC6-M.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7280R3 Series Quick Start Guide, Arista Networks, document DOC-07041-01, 63 pages, PDF created
      2025-05-16 (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280R3.pdf): Table 1
      (dimensions and weights), Table 2 (operating and storage), Table 3 (power input), Table 4 (power
      draw and supported supplies), section 2.1 (airflow orientation, handle colour), Table 5
      (grounding), section 4.5 (serial and management cables), Appendix A (status indicators, Tables 9
      to 13), Appendix C (Figure C-7, the front panel of the DCS-7280SR3-40YC6 and 7280SR3E-40YC6-M),
      Appendix D (Figure D-1, the rear panel with two fan modules), Appendix E (field replacement). 7280R3
      Series Data Center Switch Router Data Sheet, Arista Networks, 03-0045-59, dated August 11th, 2025
      (https://www.arista.com/assets/data/pdf/Datasheets/7280R3-Data-Sheet.pdf): the model comparison of
      the 7280SR3-40YC6 and 7280SR3E-40YC6-M, the power supply specifications and the ordering
      information. The 2022 7280 1RU Gen 3 guide
      (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280_1RU_Gen3.pdf) does not list this model, so
      Figure C-7 has no second reading. Held and checked first: intake COVERAGE.md and SOURCES.md, which list
      no photograph, Visio stencil, 3D model or CAD file for this model (Arista publishes none; the stencil zip
      could not be fetched). The data sheet's picture of the face is a thumbnail. No drawing, photograph or
      logo is copied into the library, only transcribed facts and new drawings.
  gate-1-front:
    confidence: estimated
    note: >-
      Figure C-7 passes. The raster is 847 x 235 pixels (125 ppi, the sharpest front figure of the guide); the
      body measures about 828 px wide and 82 px tall (aspect 10.1), against the data sheet's 440.0 / 43.7 =
      10.07, so the figure is near-orthographic and carries geometry at 1.882 px/mm (the 440 mm body is the scale
      anchor, its left edge read at 2 px and its top at 87 px). One pixel is 0.53 mm, so every position is good
      to about 0.6 mm, and every one is `estimated` because it is read off a picture and no dimension states it.
      The cages were read from the white port-number tabs in a six-times enlargement.
  gate-1-rear:
    confidence: estimated
    note: >-
      Figure D-1 is a 553 x 141 px raster whose chassis is 551 px between its edges and 54 px tall (aspect 10.2
      against 10.07), 1.252 px/mm over the 440 mm body; positions are good to about 0.8 mm. The guide draws the
      rear generically (D-1 to D-4) and does not say which model uses which. The 7280SR3-40YC6 is mapped to D-1
      by its two fan modules (data sheet: "Hot-swappable Fans 2 (N+1 redundant)"), its 1RU height, its two power
      supplies and its management ports at the rear (Figure C-7 has none at the front). THE MAPPING IS ESTIMATED.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 1: 48.3 x 4.4 x 46.9 cm (19 x 1.75 x 18.5 in), 10.7 kg (23.6 lbs) for the 7280SR3-40YC6 and 9.6
      kg (21.0 lbs) for the 7280SR3E-40YC6-M. Data sheet: 43.99 x 4.37 x 46.9 cm (17.3 x 1.72 x 18.46 in), 21.1 lbs
      (9.57 kg) for both. The width: 48.3 cm is over the mounting ears, so the body between them, which is what is
      modelled, is the data sheet's 43.99 cm (440.0 here), a 21.5 mm ear each side. The height is the data sheet's
      43.7. The depth is the data sheet's 469.0 (the guide's 46.9 cm). The weight conflicts (the guide's 10.7 kg for
      the plain model is the outlier against its own 9.6 kg for the same-hardware E-M and the data sheet's 9.57 kg;
      gap `size-conflict`); the data sheet's is in attrs. 1RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's Chapter 3 mounts the switch with the accessory-kit brackets and shows them in
      isometric drawings of a different switch ("Illustrations in this chapter depict the mounting of a
      DCS-7050QX-32S switch") that carry no measure. The data sheet lists the spares KIT-7101, KIT-2POST-1U-NT,
      KIT-7101-RK, KIT-7101-LD-RK and KIT-GND-EXT-1RU. No figure measures a bracket position, and the kit guides
      are not held, so no ear position is written and no rail kit is listed in chassis.kits. Recorded in the gap
      rack-ears.
  front-ports:
    confidence: estimated
    note: >-
      Figure C-7 at 1.882 px/mm. Forty SFP cages in two stacked rows (ports 1 to 40), twenty columns in ten
      two-column blocks: the tab centres of ports 1, 3, 5, 7 read 18.3, 32.6, 52.8 and 67.0 mm, ports 35, 37 and 39
      read 309.2, 329.4 and 343.9, a column pitch of 14.25 (the registry's ganged-SFP pitch, whose cages abut) inside
      a block and 6.0 mm more between blocks. Six QSFP100 cages in two stacked rows of three columns (41 to 46),
      centred 366.9, 392.7 and 417.7 mm, a pitch of 25.4 (the cages are drawn in a wider bezel than the
      registry's 18.5 mm opening). The rows read from the tabs at 18.0 and 32.2 mm down, a row pitch of 14.2. The
      belly-to-belly orientation is the library's convention (upper cage upright, lower turned 180); the figure is
      too small to show the latch side.
  port-numbering:
    confidence: estimated
    note: >-
      Figure C-7 (callout 7, "Port numbers") prints 1 over 2, 3 over 4, and so on, 1 to 40 across the SFP columns and
      41 over 42 to 45 over 46 across the QSFP columns. The odd number is the upper cage. The figure prints each
      number twice: on a white tab over the cage opening, and small with an up or down triangle in a row above the
      cages. A seated cage hides the tab, so the model prints the numerals in the band between the two rows, the odd
      number left of its column centre and the even one right of it. EOS interface names are not printed on the metal
      and are not modelled.
  port-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.2, Table 10: off link down, green link up, yellow software disabled, flashing yellow failed
      diagnostics. Figure C-7 draws a green diamond at the outer edge of each SFP block row, left of the left cage and
      right of the right one, 21.5 mm down in the upper row and 28.2 mm down in the lower: one lamp a SFP port is
      modelled, the left lamp for the left column and the right lamp for the right. The QSFP cages carry a column of
      three or four green dots at the cage's left edge that are not modelled (gap `qsfp-lamps`).
  speed-strips:
    confidence: estimated
    note: >-
      Guide Figure C-7: a cyan strip under each two-column SFP block row, a lavender strip under each QSFP row, a
      cyan "25G" tag at the lower left and a lavender "100G" tag at the lower right. The strips and the two tags are
      drawn in those colours and spelled as read. A small dark hole sits at the left of the first block (4.7 mm
      across, 21.5 mm down), and two brass-coloured screw heads sit on the bottom lip at 146.2 and 284.8 mm.
  status-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.1, Table 9 and Figure C-7 callouts 3 to 6: a system status lamp (blinking green on power-up,
      green normal, blue locator, amber for two or more failed fans), a fan status lamp (green, amber for one module
      removed or failed, red for two or more) and a status lamp for each of the two power supplies (green operating,
      off removed or faulty). Four lamps in a column at 432.9 mm, 7.6, 10.9, 14.5 and 17.8 mm down, with a symbol or
      legend right of each: a circled mark, a fan, and PS1 and PS2.
  front-legend:
    confidence: estimated
    note: >-
      The model legend reads "7280SR3-40YC6" under the maker's wordmark at the top left (read at 847 px; the print is
      small). THE WORDMARK IS NOT DRAWN: a logo-zone region is reserved over it and the plain model text is set. The
      text is as the guide's caption names the model.
  vents:
    confidence: estimated
    note: >-
      The figure shows a perforated grid along the top (0.8 to 9.6 mm down, 27.5 to 427.5 mm across) and a row of
      slits along the bottom lip (40.9 to 43.0 mm down). Each is drawn in its measured extent; the individual
      squares are not drawn one by one.
  rear:
    confidence: estimated
    note: >-
      Figure D-1 at 1.252 px/mm, the rear seen from behind with x = 0 at the left of the drawing. PS1 is the left and
      PS2 the right (callouts 1 and 6). Each power supply module is 73.5 mm wide (the data sheet's "73.5MM") at 4.4 and
      361.5 mm across and 1.85 mm down. The management block is a grey plate 82.5 to 100.5 mm across with the Ethernet
      management port, the USB port and the RJ-45 console port stacked in it, in the order the library draws other
      Arista management stacks. Two fan modules 78.6 mm wide at 105.7 and 276.6 mm across and 2.55 mm down. Between the
      fans is a grey plate printed with ASSY NUMBER, SERIAL NUMBER and MAC ADDRESS fields and, under them, PS1 and PS2
      legends beside airflow arrows (the arrows are not drawn).
  rear-fan:
    confidence: datasheet
    note: >-
      Data sheet: "Hot-swappable Fans 2 (N+1 redundant)", "Fan Tray FAN-7011M" and the spares FAN-7011M-F (front-to-rear)
      and FAN-7011M-R (rear-to-front). Guide section 2.1: a red handle is an air-exit module and a blue handle an
      air-inlet one, and every module must have the same direction. The two fan modules are bays that accept FAN-7011M-F
      or -R; the -R configurations seat the blue modules.
  fru-bays:
    confidence: datasheet
    note: >-
      Guide Appendix E (E.2 power supplies, E.3 fan modules) gives removal and installation procedures, and the data sheet
      calls the supplies "1+1 hot-swappable" and the fans "hot-swap". SO THE TWO POWER SUPPLIES AND THE TWO FAN MODULES ARE
      BAYS. Nothing on this chassis is a built-in unit. The management block, the USB port and the console port are part of
      the chassis and are placements.
  power:
    confidence: datasheet
    note: >-
      Guide Table 4: typical / maximum 130 W / 214 W for the 7280SR3-40YC6 and the 7280SR3E-40YC6-M, each with PWR-511-AC
      or PWR-511-DC. The data sheet states the same figures with typical "measured at 25C ambient with 50% load on all
      ports".
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, altitude 0 to 3,000 m, humidity 5 to 90 percent
      non-condensing. Data sheet: operating 0 to 40 C, storage -40 to 70 C, humidity 5 to 95 percent, altitude 0 to 3,000
      m. Storage temperature and humidity differ: gap `environment`, the guide's used.
  configurations:
    confidence: datasheet
    note: >-
      Data sheet ordering information: DCS-7280SR3-40YC6-F and -R, and DCS-7280SR3E-40YC6-M-F and -R ("SyncE, expn. mem,
      front to rear air, 2 x AC" and "rear to front air, 2 x AC"). The guide's Figure C-7 is captioned for both models, so
      the E-M build has the same face and is a configuration with its own part numbers. The "#" SKUs ("configurable fans
      and psu") are orders of parts, not part numbers a DCIM can hold, and are not listed. The data sheet lists no DC build
      of the switch: the PWR-511-DC-RED and -BLUE supplies are spares, so the DC configurations are examples with no part
      number. There is no empty-bay (-S) configuration: no -S suffix exists in this family and the guide draws no blank for
      a power supply or fan module. The 7280TR3-40C6, which shares this guide table and the data sheet ordering page, has no
      front figure in the guide and is not modelled.
  interface-names:
    confidence: datasheet
    note: >-
      Not printed and not modelled. EOS names ports Ethernet1 to Ethernet46 and Management1; this is the vendor's convention
      and no held document prints it.
  colour:
    confidence: estimated
    note: >-
      The front plate is the 7280CR3-32D4's #aaabad, read there as the median of bare-plate pixels in the guide's figure of
      the same family.
  lifecycle:
    confidence: estimated
    note: >-
      Searched 2026-10-23 (web searches of Arista's end-of-sale notices) for a notice for the 7280SR3-40YC6 and 7280SR3E-40YC6-M: none
      found. The notices the searches returned were for older 7280 models and for the 7280SR3K-48YC8 (notice 23789) and 7280CR3K-36S
      (notice 23790) series, not for this one.
  other-faces:
    confidence: datasheet
    note: >-
      No source draws the top, bottom or sides flat. The guide's installation figures are isometric. Each carries an `empty`
      sentence. The 1RU grounding point is on the bottom of the chassis (guide section 4.2, Table 5, KIT-GND-EXT-1RU); no
      figure measures it.
attrs:
  physical:
    weight: 9.57 kg (21.1 lbs) for the 7280SR3-40YC6 and the 7280SR3E-40YC6-M (data sheet; the guide says 10.7 kg for the first and 9.6 kg for the second)
    size-over-ears: 48.3 x 4.4 x 46.9 cm (19 x 1.75 x 18.5 in) with the mounting ears (guide Table 1)
  performance:
    throughput: 800 (1600) Gbps
    packets-per-second: 600 Mpps
    latency: from 3.8 microseconds
    packet-buffer: 2 GB
    ports-max-speed: six ports of 100 Gbps; 12 of 50 Gbps; 6 of 40 Gbps; 52 of 25 or 10 Gbps; 36 of 1 Gbps
    interfaces-max: 52
  power:
    power-typical-w: 130
    power-max-w: 214
    power-envelope: as-tested
    power-measure: typical at 25 C ambient with 50 percent load on all ports (data sheet)
    psu-redundancy: 1+1
    input-ac: 100 - 240 VAC (PWR-511-AC), IEC 60320 C14
    input-dc: -48 to -60 VDC (PWR-511-DC)
    efficiency: 93 percent (Platinum) AC, 92 percent DC (data sheet)
  thermal:
    airflow: front-to-rear or rear-to-front, set by the fan modules and supplies fitted
    fan-redundancy: 2 hot-swap fan modules, N+1
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -25 to 70 C (guide Table 2); the data sheet says -40 to 70 C
    humidity: 5 to 90 percent non-condensing (guide Table 2); the data sheet says 5 to 95 percent
    altitude: 0 to 3,000 m (10,000 ft) operating
  platform:
    cpu: Quad-Core x86
    memory: 8 GB (7280SR3-40YC6); 32 GB (7280SR3E-40YC6-M)
    storage: 8 GB flash; no SSD
  features:
    optics-sfp28: 1G, 10G and 25G, in the 40 SFP cages (data sheet)
    optics-qsfp28: 100G, 50G, 40G, 25G and 10G with breakout, in the six QSFP cages (data sheet)
    synce: inband Synchronous Ethernet on the 7280SR3E-40YC6-M (data sheet)
    eos-license: license group G2; minimum EOS 4.27.1 (7280SR3-40YC6), 4.28.1 (7280SR3E-40YC6-M)
  management:
    console: RJ-45 RS-232 serial on the rear, 9600 baud 8N1, no flow control
    oob: one 10/100/1000 management port on the rear
    usb: one USB port on the rear, for software or configuration updates
  compliance:
    emc: FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386
    safety: EN 62368-1, IEC 62368-1, CSA/UL 62368-1
    certifications: BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI, TEC, ANATEL, ICASA (data sheet)
    rohs: RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)
  lifecycle: {eol: none-announced}
