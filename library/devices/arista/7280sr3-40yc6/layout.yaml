configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis with two AC supplies and two fan modules fitted, front-to-rear air, before any part number: the shape
      every build below starts from.
  f:
    kind: orderable
    description: >-
      The 7280SR3-40YC6 with two AC supplies and front-to-rear air: PWR-511-AC-RED supplies and FAN-7011M-F fan modules,
      all with red handles. Ordered as DCS-7280SR3-40YC6-F.
    part-numbers:
      DCS-7280SR3-40YC6-F: {}
  r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280SR3-40YC6 with two AC supplies and rear-to-front air: PWR-511-AC-BLUE supplies and FAN-7011M-R fan modules,
      all with blue handles. Ordered as DCS-7280SR3-40YC6-R.
    bays:
      psu-1: arista/7280r3-pwr-500-ac-rev@1
      psu-2: arista/7280r3-pwr-500-ac-rev@1
      fan-1: arista/7280r3-fan-m-rev@1
      fan-2: arista/7280r3-fan-m-rev@1
    part-numbers:
      DCS-7280SR3-40YC6-R: {}
  m-f:
    kind: orderable
    description: >-
      The 7280SR3E-40YC6-M, the same face with 32 GB of memory and inband SyncE, with front-to-rear air. Ordered as
      DCS-7280SR3E-40YC6-M-F. The guide gives it 9.6 kg and the same power draw as the base switch.
    export-description: >-
      Arista 7280SR3E-40YC6-M - the SyncE, expanded-memory build of the 7280SR3-40YC6 with 32 GB of memory, a
      fixed 1RU data-centre switch router with 40 x 1/10/25G SFP and 6 x 100G QSFP ports, running EOS
    attrs:
      platform:
        memory: 32 GB
      features:
        eos-license: license group G2; minimum EOS 4.28.1
    part-numbers:
      DCS-7280SR3E-40YC6-M-F: {}
  m-r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280SR3E-40YC6-M with rear-to-front air. Ordered as DCS-7280SR3E-40YC6-M-R.
    bays:
      psu-1: arista/7280r3-pwr-500-ac-rev@1
      psu-2: arista/7280r3-pwr-500-ac-rev@1
      fan-1: arista/7280r3-fan-m-rev@1
      fan-2: arista/7280r3-fan-m-rev@1
    export-description: >-
      Arista 7280SR3E-40YC6-M - the SyncE, expanded-memory build of the 7280SR3-40YC6 with 32 GB of memory, a
      fixed 1RU data-centre switch router with 40 x 1/10/25G SFP and 6 x 100G QSFP ports, running EOS
    attrs:
      platform:
        memory: 32 GB
      features:
        eos-license: license group G2; minimum EOS 4.28.1
    part-numbers:
      DCS-7280SR3E-40YC6-M-R: {}
  dc-f:
    kind: example
    power: dc
    description: >-
      Two DC supplies and front-to-rear air: PWR-511-DC-RED supplies and FAN-7011M-F fan modules. The data sheet lists no DC
      part number for the switch; the supplies are spares, and a DC build is ordered through the "#" configurable SKUs.
    bays:
      psu-1: arista/7280r3-pwr-500-dc@1
      psu-2: arista/7280r3-pwr-500-dc@1
  dc-r:
    kind: example
    power: dc
    airflow: back-to-front
    description: >-
      Two DC supplies and rear-to-front air: PWR-511-DC-BLUE supplies and FAN-7011M-R fan modules. No DC part number is listed
      for the switch.
    bays:
      psu-1: arista/7280r3-pwr-500-dc-rev@1
      psu-2: arista/7280r3-pwr-500-dc-rev@1
      fan-1: arista/7280r3-fan-m-rev@1
      fan-2: arista/7280r3-fan-m-rev@1
