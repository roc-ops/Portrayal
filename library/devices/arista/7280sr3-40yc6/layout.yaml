gaps:
  - what: size-conflict
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      Weight of the 7280SR3-40YC6: 10.7 kg (guide Table 1) against 9.57 kg (data sheet, which gives the plain and E-M
      models the same cell). The guide gives the 7280SR3E-40YC6-M 9.6 kg and the 7280TR3-40C6 9.6 kg for the same
      hardware class, so the 10.7 is taken as the outlier; the data sheet's is used.
    wanted: the maker's statement of which is current.
  - what: environment
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet), and relative humidity 5 to 90 percent
      against 5 to 95 percent. The guide's, the older document by three months, are in attrs.
    wanted: the maker's statement of which is current.
  - what: rack-ears
    scope: [front]
    reason: needs-drawing
    note: >-
      The guide's Figures 3-1 to 3-4 are isometric drawings of another switch and carry no measure, and the kit guides for
      KIT-7101 and the other spares are not held, so no ear position or rail kit is written.
    wanted: a dimensioned drawing of the mounting bracket position, and the kit guides.
  - what: qsfp-lamps
    scope: [front]
    reason: needs-photo
    note: >-
      Figure C-7 draws a column of three or four green dots at the left edge of each QSFP cage. Their count and meaning are
      not resolved at 125 ppi, so no QSFP lamp is modelled; the SFP lamps are.
    wanted: a photograph of the lit face.
  - what: front-legends
    scope: [front]
    reason: needs-photo
    note: >-
      The small numbers with triangles above the cages, the small print on the strips, the system and fan lamp glyphs and the
      model line are barely readable in the 847 px figure. The lamp glyphs and the PS1 and PS2 legends are drawn as read; the
      strip and cage legends are not drawn, and the numbers are printed in the band between the rows.
    wanted: a photograph of the face.
  - what: cage-orientation
    scope: [front]
    reason: needs-photo
    note: >-
      Which side the latches of the stacked cages face is not visible in the figure. The library's belly-to-belly convention is
      used (upper cage upright, lower turned 180).
    wanted: a photograph of the stacked cages.
  - what: rear-mgmt-block
    scope: [rear]
    reason: needs-photo
    note: >-
      The management block's arrow marks and its console symbol are drawn as the 7280CR3-32D4 draws them; the order of the three
      ports follows the datasheet's rear view and the library's other Arista stacks, and the figure's 1.25 px/mm resolves it only
      as three stacked ports.
    wanted: a photograph of the rear management block.
  - what: psu-dc-face
    scope: [rear]
    reason: needs-drawing
    note: >-
      The PWR-511-DC supplies are drawn as the AC supply's housing with a plain two-pole terminal block. The guide shows a DC
      supply only in isometric figures; the real terminal arrangement is not drawn.
    wanted: a flat drawing or photograph of the PWR-511-DC.
  - what: module-power
    scope: [rear]
    reason: vendor-silent
    note: >-
      The guide's power tables and the data sheet give whole-switch figures only; the fan modules' missing power figure (lint L27)
      stands. The supplies state their output.
    wanted: FAN-7011M power draw.
  - what: grounding
    scope: [bottom]
    reason: needs-drawing
    note: >-
      The 1RU grounding point is on the bottom of the chassis for KIT-GND-EXT-1RU (guide section 4.2, Table 5, Figure 4-2). No flat
      figure measures it, so it is not placed.
    wanted: a flat drawing of the bottom with the grounding bracket holes.
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
    description: >-
      The 40 SFP ports (1, 10 and 25G), numbered 1 to 40 as printed; the odd numbers are the upper cages
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      The six 100G QSFP ports, numbered 41 to 46 as printed; the odd numbers are the upper cages
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: a status lamp for each SFP port, at the outer edge of its block
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system, fan and two power supply lamps at the far right of the front
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      how the switch is reached out of band - the 10/100/1000 management port, the USB port and the RS-232
      console port, stacked in one block at the left of the rear panel
  psu-bays:
    term: Bay
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Data sheet: "Hot-swap Power Supplies 2 (1+1 redundant)". Guide section 4.4: at least one supply must connect to a power source
    description: the two hot-swap power supplies, 1+1 redundant
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: n+1
      redundancy-note: >-
        Data sheet: "Hot-swappable Fans 2 (N+1 redundant)"
    description: the two hot-swap fan modules
