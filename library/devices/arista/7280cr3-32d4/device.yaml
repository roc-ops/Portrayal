gaps:
- what: environment
  scope:
  - front
  - rear
  reason: sources-disagree
  note: >-
    Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet), and relative humidity
    5 to 90 percent against 5 to 95 percent. The guide's, the newer document by three months, are in attrs.
  wanted: the maker's statement of which is current.
- what: dc-input-voltage
  scope:
  - rear
  reason: sources-disagree
  note: >-
    The PWR-1011-DC input is "-40 to -60 VDC, 30 A" in guide Table 3 and "-48 to -60V DC" in the data
    sheet's power supply table. The guide's is in the component, the data sheet's in its provenance.
  wanted: the maker's statement of which is current.
- what: rack-ears
  scope:
  - front
  reason: needs-drawing
  note: >-
    The guide's Figures 3-1 to 3-4 are isometric drawings of another switch and carry no measure, and
    the kit guides for KIT-7001, KIT-7101-D and the other spares are not held, so no ear position or rail
    kit is written.
  wanted: a dimensioned drawing of the mounting bracket position, and the kit guides.
- what: port-lamp-count
  scope:
  - front
  reason: needs-photo
  note: >-
    Figure C-4 draws a pair of dots a port, but Table 10 describes one port LED and does not say what
    the second lamp of the pair shows. Both are given Table 10's states.
  wanted: the guide's account of the two port lamps, or a photograph of the lit face.
- what: front-legends
  scope:
  - front
  reason: needs-photo
  note: >-
    The port-speed strips' legends, the small print over each cage, the system and fan lamp glyphs and
    the PS1 and PS2 legends are unreadable in the 575 px figure. The glyphs and the two PS legends are
    drawn as read; the strip and cage legends are not drawn.
  wanted: a photograph of the face.
- what: cage-orientation
  scope:
  - front
  reason: needs-photo
  note: >-
    Which side the latches of the stacked cages face is not visible in the figure. The library's belly-to-belly
    convention is used (upper cage upright, lower turned 180).
  wanted: a photograph of the stacked cages.
- what: rear-mgmt-block
  scope:
  - rear
  reason: needs-photo
  note: >-
    The management block's two arrow marks and its console symbol (a small outlined box with three ticks,
    as the figure draws it; the figure does not resolve it further) are drawn as read; the order of the
    three ports (management over USB over console) follows the datasheet's rear view and the library's
    other Arista stacks, and the figure's 1.24 px/mm resolves it only as three stacked ports. The lamps
    on the management jack are the library's single Ethernet jack's.
  wanted: a photograph of the rear management block.
- what: psu-dc-face
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The PWR-1011-DC supplies are drawn as the AC supply's housing with a plain two-pole terminal block.
    The guide shows a DC supply only in the isometric Figures 4-5 and 4-7, with a red terminal cover and
    the protective-earth terminal on the far side; the real terminal arrangement is not drawn.
  wanted: a flat drawing or photograph of the PWR-1011-DC.
- what: module-power
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The guide's power tables and the data sheet give whole-switch figures only; the fan modules' missing
    power figure (lint L27) stands. The supplies state their output.
  wanted: FAN-7011H power draw.
- what: grounding
  scope:
  - bottom
  reason: needs-drawing
  note: >-
    The 1RU grounding point is on the bottom of the chassis for KIT-GND-EXT-1RU (guide section 4.2, Table
    5, Figure 4-2). No flat figure measures it, so it is not placed.
  wanted: a flat drawing of the bottom with the grounding bracket holes.
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: The 32 100G QSFP ports, numbered 1 to 32 as printed; the odd numbers are the upper cages
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
    description: The four 400G QSFP-DD ports, numbered 33 to 36 as printed; 33 and 35 are the upper cages
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: a pair of status lamps for each port, above an upper cage and below a lower one
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system, fan and two power supply lamps at the right of the front
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      how the switch is reached out of band - the 10/100/1000 management port, the USB port and the RS-232
      console port, stacked in one block at the left of the rear panel
  psu-bays:
    term: Bay
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        Data sheet: "Hot-swap Power Supplies 2 (1+1 redundant)". Guide section 4.4: at least one supply
        must connect to a power source
    description: the two hot-swap power supplies, 1+1 redundant
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs: {redundancy: n+1, redundancy-note: 'Data sheet: "Hot-swappable Fans 3 (N+1 redundant)"'}
    description: the three hot-swap fan modules
