configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis with two AC supplies and three fan modules fitted, front-to-rear air, before any part
      number: the shape every build below starts from.
  f:
    kind: orderable
    description: >-
      The 7280CR3-32D4 with two AC supplies and front-to-rear air: PWR-1011-AC-RED supplies and FAN-7011H-F
      fan modules, all with red handles. Ordered as DCS-7280CR3-32D4-F.
    part-numbers:
      DCS-7280CR3-32D4-F: {}
  r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280CR3-32D4 with two AC supplies and rear-to-front air: PWR-1011-AC-BLUE supplies and FAN-7011H-R
      fan modules, all with blue handles. Ordered as DCS-7280CR3-32D4-R.
    bays: {psu-1: arista/7280cr3-pwr-1000-ac-rev@1, psu-2: arista/7280cr3-pwr-1000-ac-rev@1, fan-1: arista/7280cr3-fan-rev@1,
      fan-2: arista/7280cr3-fan-rev@1, fan-3: arista/7280cr3-fan-rev@1}
    part-numbers:
      DCS-7280CR3-32D4-R: {}
  k-f:
    kind: orderable
    description: >-
      The 7280CR3K-32D4, the same hardware with 64 GB of memory and the large-routes licence, with front-to-rear
      air. Ordered as DCS-7280CR3K-32D4-F.
    attrs:
      platform: {memory: 64 GB}
    part-numbers:
      DCS-7280CR3K-32D4-F: {}
  k-r:
    kind: orderable
    airflow: back-to-front
    description: The 7280CR3K-32D4 with rear-to-front air. Ordered as DCS-7280CR3K-32D4-R.
    bays: {psu-1: arista/7280cr3-pwr-1000-ac-rev@1, psu-2: arista/7280cr3-pwr-1000-ac-rev@1, fan-1: arista/7280cr3-fan-rev@1,
      fan-2: arista/7280cr3-fan-rev@1, fan-3: arista/7280cr3-fan-rev@1}
    attrs:
      platform: {memory: 64 GB}
    part-numbers:
      DCS-7280CR3K-32D4-R: {}
  k-a-f:
    kind: orderable
    description: >-
      The 7280CR3K-32D4A, the K build with an eight-core CPU, with front-to-rear air. Ordered as DCS-7280CR3K-32D4A-F.
    export-description: >-
      Arista 7280CR3K-32D4A - a fixed 1RU data-centre switch router with 32 x 100G QSFP ports and 4 x
      400G QSFP-DD ports, an eight-core CPU and 64 GB of memory, running EOS
    attrs:
      power: {power-typical-w: 543, power-max-w: 865}
      platform: {cpu: Eight-Core x86, memory: 64 GB}
      features: {eos-license: license group G3; minimum EOS 4.27.2}
    part-numbers:
      DCS-7280CR3K-32D4A-F: {}
  k-a-r:
    kind: orderable
    airflow: back-to-front
    description: The 7280CR3K-32D4A with rear-to-front air. Ordered as DCS-7280CR3K-32D4A-R.
    export-description: >-
      Arista 7280CR3K-32D4A - a fixed 1RU data-centre switch router with 32 x 100G QSFP ports and 4 x
      400G QSFP-DD ports, an eight-core CPU and 64 GB of memory, running EOS
    bays: {psu-1: arista/7280cr3-pwr-1000-ac-rev@1, psu-2: arista/7280cr3-pwr-1000-ac-rev@1, fan-1: arista/7280cr3-fan-rev@1,
      fan-2: arista/7280cr3-fan-rev@1, fan-3: arista/7280cr3-fan-rev@1}
    attrs:
      power: {power-typical-w: 543, power-max-w: 865}
      platform: {cpu: Eight-Core x86, memory: 64 GB}
      features: {eos-license: license group G3; minimum EOS 4.27.2}
    part-numbers:
      DCS-7280CR3K-32D4A-R: {}
  dc-f:
    kind: example
    power: dc
    description: >-
      Two DC supplies and front-to-rear air: PWR-1011-DC-RED supplies and FAN-7011H-F fan modules. The
      data sheet lists no DC part number for the switch; the supplies are spares, and a DC build is ordered
      through the "#" configurable SKUs.
    bays: {psu-1: arista/7280cr3-pwr-1000-dc@1, psu-2: arista/7280cr3-pwr-1000-dc@1}
  dc-r:
    kind: example
    power: dc
    airflow: back-to-front
    description: >-
      Two DC supplies and rear-to-front air: PWR-1011-DC-BLUE supplies and FAN-7011H-R fan modules. No
      DC part number is listed for the switch.
    bays: {psu-1: arista/7280cr3-pwr-1000-dc-rev@1, psu-2: arista/7280cr3-pwr-1000-dc-rev@1, fan-1: arista/7280cr3-fan-rev@1,
      fan-2: arista/7280cr3-fan-rev@1, fan-3: arista/7280cr3-fan-rev@1}
