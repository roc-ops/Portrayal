format: 1
kind: device
name: 7280cr3-32d4
version: 0.1.1
maturity: modelled
manufacturer: Arista
model: 7280CR3-32D4
portfolio: {line: 7000 Series, family: 7280CR3}
description: >-
  Arista 7280CR3-32D4 - a fixed 1RU data-centre switch router with 32 x 100G QSFP ports and 4 x 400G QSFP-DD
  ports, running EOS. The front carries the 100G cages in two stacked rows, the odd number on top, in
  two blocks of eight columns. The four 400G cages are two stacked columns between the blocks. Each port
  has a status lamp. Four system lamps (system, fan, PS1, PS2) are at the right. The rear carries two
  hot-swap power supplies at the ends and three hot-swap fan modules. It also carries the RJ-45 management
  port, the USB port and the RJ-45 console port. The same panel is ordered with front-to-rear air (-F)
  or rear-to-front air (-R). It is sold as the 7280CR3, as the 7280CR3K with more memory and routes, and
  as the 7280CR3K-32D4A with an eight-core CPU.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7280R3 Series Quick Start Guide, Arista Networks, document DOC-07041-01, 63 pages, PDF created 2025-05-16
      (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280R3.pdf): Table 1 (dimensions and weights),
      Table 2 (operating and storage), Table 3 (power input), Table 4 (power draw and supported supplies),
      section 2.1 (airflow orientation, handle colour), section 4.1 and Table 5 (grounding), section 4.5
      and Figure 4-9 (serial and management ports), Appendix A (status indicators, Tables 9 to 13), Appendix
      B (parts list), Appendix C (Figure C-4, the front panel of the DCS-7280CR3-32D4, 7280CR3K-32D4 and
      7280CR3K-32D4A), Appendix D (Figure D-2, the rear panel with three fan modules), Appendix E (field
      replacement of power supplies and fan modules). 7280 Data Center Switches Quick Start Guide, Arista
      Networks, 58 pages, PDF created 2022-06-03 (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280_1RU_Gen3.pdf):
      Figure 48 (DCS-7280CR3-32D4 and 7280CR3K-32D4), which is the same 574 x 116 pixel raster as Figure
      C-4 (compared pixel for pixel: identical), so it is a repeat of the source and not a second reading.
      7280R3 Series Data Center Switch Router Data Sheet, Arista Networks, 03-0045-59, dated August 11th,
      2025 (https://www.arista.com/assets/data/pdf/Datasheets/7280R3-Data-Sheet.pdf): the model comparison
      table of the 7280CR3-32D4, 7280CR3K-32D4 and 7280CR3K-32D4A, the power supply specifications, and
      the ordering information. Held and checked first: intake COVERAGE.md and SOURCES.md, which list
      no photograph, Visio stencil, 3D model or CAD file for this model (Arista publishes none; the stencil
      zip could not be fetched). The data sheet's picture of the face is a 396 x 39 pixel strip and the
      guide's Figure C-4 a 575 x 116 pixel raster; both are low resolution. No drawing, photograph or
      logo is copied into the library, only transcribed facts and new drawings.
  gate-1-front:
    confidence: estimated
    note: >-
      Figure C-4 passes at 1.0 percent. The raster is 575 x 116 pixels. The body between its edges measures
      560 px wide and 55.6 px tall (aspect 10.07), against the data sheet's 440.0 / 43.7 = 10.07, so the
      figure is near-orthographic and carries geometry at 1.273 px/mm (the 440 mm body is the scale anchor).
      One pixel is 0.79 mm, so every front position is good to about 0.8 mm, and every one is `estimated`
      because it is read off a picture and no dimension states it. The cage columns were read from the
      white port-number tabs in a three-times enlargement.
  gate-1-rear:
    confidence: estimated
    note: >-
      Figure D-2 passes at 1.6 percent: the raster is 552 px wide, the chassis 545 px between its edges
      (1.239 px/mm over the 440 mm body) and 55 px tall (44.4 mm against 43.7). Positions are measures
      off the figure, good to about 0.8 mm. The guide draws the rear generically (D-1 to D-4) and does
      not say which model uses which. The 7280CR3-32D4 is mapped to D-2 by its three fan modules (data
      sheet: "Hot-swappable Fans 3 (N+1 redundant)"), its 1RU height, its two power supplies, and its
      management ports at the rear (Figure C-4 has none at the front). THE MAPPING IS ESTIMATED.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 1: 48.3 x 4.4 x 55.8 cm (19 x 1.75 x 22.0 in), 12.3 kg (27.0 lbs), the same for the
      7280CR3-32D4, 7280CR3K-32D4 and 7280CR3K-32D4A. Data sheet: 43.99 x 4.37 x 55.83 cm (17.3 x 1.72
      x 22.0 in), 27 lbs (12.27 kg). The width: 48.3 cm is over the mounting ears, so the body between
      them, which is what is modelled, is the data sheet's 43.99 cm (440.0 here), a 21.5 mm ear each side.
      The height is the data sheet's 43.7 (the guide rounds it to 4.4 cm). The depth is the data sheet's
      558.3 (the guide's 55.8 cm is the same figure rounded). 1RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's Chapter 3 mounts the switch with the accessory-kit brackets and shows
      them in Figures 3-1 to 3-4, isometric drawings of a different switch ("Illustrations in this chapter
      depict the mounting of a DCS-7050QX-32S switch") that carry no measure. The data sheet lists the
      spares KIT-7001, KIT-2POST-1U-NT, KIT-4POST-NT, KIT-7001-4POST-L, KIT-7101-D, KIT-7101-RK and KIT-7101-LD-RK.
      The guide says a four-post mount is recommended and a two-post mount is centre-mount only. No figure
      measures a bracket position, and the kit guides are not held, so no ear position is written and
      no rail kit is listed in chassis.kits. Recorded in the gap rack-ears.
  front-ports:
    confidence: estimated
    note: >-
      Figure C-4 at 1.273 px/mm anchored on the 440 mm body, read in a three-times enlargement. Thirty-two
      QSFP100 cages in two stacked rows (ports 1 to 32), in eight-column blocks of two groups of four
      columns: ports 1 to 16 and 17 to 32. The white number tabs read, for the top row, 1, 3, 5, 7 at
      24.0, 43.2, 62.4 and 81.7 mm, 9, 11, 13, 15 at 113.6 to 170.9, then 17 to 23 at 267.1 to 324.0 and
      25 to 31 at 356.1 to 413.1. The column pitch inside a group is 19.1 (the registry's 19.0 ganged-QSFP
      pitch) and the gap between the groups is 13.6 (ports 7 to 9) and 13.0 (ports 23 to 25) mm wider
      than a column. Two stacked 400G QSFP-DD cages (33 over 34 at 201.1 mm, 35 over 36 at 236.7 mm) sit
      between the blocks, which put the 400G columns 30.2 and 30.4 mm from their neighbours. The yellow
      boxes of the figure enclose both rows at 12.2 to 37.3 mm down, so the openings are read at 12.4
      (upper) and 27.7 to 37.3 (lower) mm: a row pitch of 15.3 mm, the figure's tab centres reading 15.7.
      The belly-to-belly orientation is the library's convention (upper cage upright, lower turned 180);
      the figure is too small to show the latch side.
  port-numbering:
    confidence: estimated
    note: >-
      Figure C-4 (callout 5, "Port numbers") prints 1 over 2, 3 over 4, and so on down each column and
      across, 1 to 32 in the two blocks, then 33 over 34 and 35 over 36 in the 400G columns, which sit
      between ports 15 and 17 in space but are numbered after 32. The odd number is the upper cage. The
      figure prints each number on a white tab over the cage opening; a seated cage hides what is painted
      under it, so the numerals are set above each upper cage and below each lower one, in the band the
      lamps share. EOS interface names are not printed on the metal and are not modelled.
  port-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.2, Table 10: "Port LEDs near their corresponding ports provide a link and operational
      status": off the link is down, green link up, yellow software disabled, flashing yellow failed diagnostics.
      Figure C-4 draws a pair of small dark dots above each upper cage column and below each lower one
      (the guide's Figure A-3 captions them "Port 4 LEDs"). TWO LAMPS A PORT are modelled, a and b, centred
      on the column and 2.0 mm apart (the figure's dots sit nearer, about 1.5 mm, but two 2.0 mm holes
      cannot overlap), and the 400G cages carry the same pair. Table 10 gives one set of states, so both
      lamps carry it; what each of the two means is the gap port-lamp-count.
  speed-strips:
    confidence: estimated
    note: >-
      Guide Figure C-4 callout 6, "Port-speed group", draws a lavender strip between the two rows under
      each four-column group of 100G cages and an orange strip under the two 400G columns. The strips
      are drawn in those colours at 23.8 to 26.0 mm down. Their printed legends are unreadable and are
      not drawn.
  status-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.1, Table 9 and Figure C-4 callouts 1 to 4: a system status lamp (blinking green
      on power-up, green normal, blue locator, amber for two or more failed fans), a fan status lamp (green,
      amber for one module removed or failed, red for two or more) and a status lamp for each of the two
      power supplies (green operating, off removed or faulty). Four lamps in a column at 431.1 mm, 11.2,
      14.5, 17.8 and 21.1 mm down, in a rounded plate 429.0 to 437.2 mm across and 9.0 to 24.3 down. The
      printed glyphs are a system symbol, a fan symbol and two small legends read as PS1 and PS2.
  front-legend:
    confidence: estimated
    note: >-
      The vertical model legend reads "7280CR3-32D4" up the left plate (centre 26.1 mm down, baseline
      4.6 mm across) with the maker's wordmark above the first column from 2.6 to 16.7 mm across and 9.4
      to 11.8 down. THE WORDMARK IS NOT DRAWN: a logo-zone region is reserved over it and the plain model
      text is set. The figure prints "7280CR3-32D4" on the plate in blue; its small print is not legible,
      so the text is as the guide's caption names the model.
  vents:
    confidence: estimated
    note: >-
      The figure shows a perforated strip along the top (1.0 to 5.1 mm down, across nearly the whole width),
      grids of dark square vents in the gaps between the port groups (92.8 to 102.4, 182.4 to 189.8, 213.8
      to 224.2, 248.4 to 255.6 and 335.4 to 344.8 mm across, 9.6 to 39.6 down), two small grids left of
      port 1, a column and a three-by-three grid right of port 31, and a row of squares along the bottom
      lip. Each is drawn as a vent field in its measured extent; the individual squares are not drawn
      one by one.
  rear:
    confidence: estimated
    note: >-
      Figure D-2 at 1.239 px/mm, the rear seen from behind with x = 0 at the left of the drawing. PS1
      is the left and PS2 the right (callouts 1 and 10). Each power supply module is 73.5 mm wide (the
      data sheet's "73.5MM") at 4.0 and 362.3 mm across and 1.85 mm down. The management block is a grey
      plate 83.0 to 101.0 mm across with the Ethernet management port, the USB port and the RJ-45 console
      port stacked in it in the order the library draws other Arista management stacks. Three fan modules
      78.6 mm wide at 107.7, 191.0 and 274.3 mm across (an 83.3 mm pitch) and 2.55 mm down. The figure
      also draws, between the fans, three release sliders and three lamps, which are in the fan component.
  rear-fan:
    confidence: datasheet
    note: >-
      Data sheet: "Hot-swappable Fans 3 (N+1 redundant)", "Fan Tray FAN-7011H", FAN-7011H-F (front-to-rear)
      and FAN-7011H-R (rear-to-front) as spares. Guide section 2.1: a red handle is an air-exit module
      and a blue handle an air-inlet one, and every module must have the same direction. The three fan
      modules are bays that accept FAN-7011H-F or -R; the -R configurations seat the blue modules.
  fru-bays:
    confidence: datasheet
    note: >-
      Guide Appendix E (E.2 power supplies, E.3 fan modules) gives removal and installation procedures,
      and the data sheet calls the supplies "1+1 hot-swappable" and the fans "hot-swap". SO THE TWO POWER
      SUPPLIES AND THE THREE FAN MODULES ARE BAYS. Nothing on this chassis is a built-in unit. The management
      block, the USB port and the console port are part of the chassis and are placements.
  power:
    confidence: datasheet
    note: >-
      Guide Table 4: typical / maximum 535 W / 851 W for the 7280CR3-32D4 and 7280CR3K-32D4, and 543 W
      / 865 W for the 7280CR3K-32D4A, each with PWR-1011-AC or PWR-1011-DC. The data sheet states the
      same figures with typical "measured at 25C ambient with 50% load on all ports". The device carries
      535 W / 851 W; the configurations k-a-f and k-a-r state the -A figure in their `attrs`, with its
      CPU and minimum EOS, and the K builds state their memory.
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, altitude 0 to 3,000 m, humidity 5 to 90
      percent non-condensing. Data sheet: operating 0 to 40 C, storage -40 to 70 C, humidity 5 to 95 percent,
      altitude 0 to 3,000 m. Storage temperature and humidity differ: gap `environment`, the guide's used.
  configurations:
    confidence: datasheet
    note: >-
      Data sheet ordering information: DCS-7280CR3-32D4-F and -R, DCS-7280CR3K-32D4-F and -R, and DCS-7280CR3K-32D4A-F
      and -R ("front to rear air, 2 x AC" and "rear to front air, 2 x AC"). The "#" SKUs ("configurable
      fans and psu") and DCS-7280CR3-32D4-M# are orders of parts, not part numbers a DCIM can hold, and
      are not listed. The data sheet lists no DC build of the switch: the PWR-1011-DC-RED and -BLUE supplies
      are spares, so the DC configurations are examples with no part number. The K and K-A builds share
      the base model's size, weight, figure and supplies and differ in memory, CPU, routes and (for the
      -A) power draw, which a configuration cannot state; each is a configuration with its own part numbers.
      There is no empty-bay (-S) configuration: no -S suffix exists in this family and the guide draws
      no blank for a power supply or fan module.
  interface-names:
    confidence: datasheet
    note: >-
      Not printed and not modelled. EOS names ports Ethernet1 to Ethernet36 and Management1; this is the
      vendor's convention and no held document prints it.
  colour:
    confidence: estimated
    note: 'The front plate is the median of bare-plate pixels in the guide''s figure C-4, #aaabad.'
  lifecycle:
    confidence: estimated
    note: >-
      Searched 2026-10-22 for an end-of-sale notice for the 7280CR3-32D4, 7280CR3K-32D4 and 7280CR3K-32D4A
      on Arista's advisories and notices pages. The searches found notices for the 7280CR2A and 7280CR2K
      series and for select 7280CR models (advisories 15849, 15850 and 16536) and none for these models.
  other-faces:
    confidence: datasheet
    note: >-
      No source draws the top, bottom or sides flat. The guide's installation figures are isometric. Each
      carries an `empty` sentence. The 1RU grounding point is on the bottom of the chassis (guide section
      4.2, Table 5, KIT-GND-EXT-1RU); no figure measures it.
attrs:
  physical:
    weight: >-
      12.3 kg (27.0 lbs) for the 7280CR3-32D4, 7280CR3K-32D4 and 7280CR3K-32D4A (guide Table 1, data sheet)
    size-over-ears: 48.3 x 4.4 x 55.8 cm (19 x 1.75 x 22.0 in) with the mounting ears (guide Table 1)
  performance:
    throughput: 4.8 (9.6) Tbps
    packets-per-second: 2 Bpps
    latency: from 3.8 microseconds
    packet-buffer: 8 GB
    ports-max-speed: >-
      four ports of 400 Gbps; 48 of 100 Gbps; 96 of 50 Gbps; 36 of 40 Gbps; 96 of 25 or 10 Gbps
    interfaces-max: 96
  power:
    power-typical-w: 535
    power-max-w: 851
    power-envelope: as-tested
    power-measure: typical at 25 C ambient with 50 percent load on all ports (data sheet)
    psu-redundancy: 1+1
    input-ac: 100 - 240 VAC (PWR-1011-AC), IEC 60320 C14
    input-dc: -48 to -60 VDC (PWR-1011-DC)
    efficiency: 93 percent (Platinum) AC, 94 percent DC (data sheet)
  thermal:
    airflow: front-to-rear or rear-to-front, set by the fan modules and supplies fitted
    fan-redundancy: 3 hot-swap fan modules, N+1
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -25 to 70 C (guide Table 2); the data sheet says -40 to 70 C
    humidity: 5 to 90 percent non-condensing (guide Table 2); the data sheet says 5 to 95 percent
    altitude: 0 to 3,000 m (10,000 ft) operating
  platform:
    cpu: Quad-Core x86 (7280CR3-32D4 and 7280CR3K-32D4); Eight-Core x86 (7280CR3K-32D4A)
    memory: 8 GB, 64 GB optional (7280CR3-32D4); 64 GB (7280CR3K-32D4 and -32D4A)
    storage: 8 GB flash, 120 GB SSD (data sheet)
  features:
    optics-qsfp28: 100G, 50G, 40G, 25G and 10G with breakout, in the 32 QSFP cages (data sheet)
    optics-qsfp-dd: 400G and 100G, in the four QSFP-DD cages (data sheet)
    eos-license: >-
      license group G3; minimum EOS 4.22.1 (7280CR3-32D4, 7280CR3K-32D4), 4.27.2 (7280CR3K-32D4A)
  management:
    console: RJ-45 RS-232 serial on the rear, 9600 baud 8N1, no flow control
    oob: one 10/100/1000 management port on the rear
    usb: one USB port on the rear, for software or configuration updates
  compliance:
    emc: >-
      FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386
    safety: EN 62368-1, IEC 62368-1, CSA/UL 62368-1
    certifications: BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI, TEC, ANATEL, ICASA (data sheet)
    rohs: RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)
  lifecycle: {eol: none-announced}
