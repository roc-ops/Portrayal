gaps:
- what: depth
  scope:
  - top
  - left
  - right
  reason: sources-disagree
  note: >-
    Guide Table 1 gives 25.8 cm deep; the data sheet gives 27.6 cm (10.8 in) "incl. fans". They are different
    measures, the second including the fan module's protrusion, and the guide's figure was modelled.
  wanted: >-
    a mechanical drawing that dimensions the body and the fan module's projection separately.
- what: power-draw
  scope:
  - front
  - rear
  reason: sources-disagree
  note: >-
    Same measure (typical / maximum draw), same models, different values. Guide Table 3 (PDOC-00061-08):
    75 W / 100 W for all four builds. Data sheet (03-0052-14): 7010TX-48 61 W / 80 W, 7010TX-48C 83 W
    / 95 W, 7010TX-48-DC 56 W / 75 W, 7010TX-48C-DC TBD. The device carries the guide's, the newer document,
    and the -48C configurations state no power of their own, so they carry it too.
  wanted: the maker's statement of which is current, per part number.
- what: environment
  scope:
  - front
  - rear
  reason: sources-disagree
  note: >-
    Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet), and relative humidity
    5 to 90 percent against 5 to 95 percent. The guide's, the newer document, are in attrs.
  wanted: the maker's statement of which is current.
- what: rack-ears
  scope:
  - front
  reason: needs-drawing
  note: >-
    The guide's Figures 3-1 to 3-3 are isometric and carry no measure, and the kit guide for KIT-7010,
    KIT-7010-4POST and KIT-7010-2POST-23 is not held, so no ear position or rail kit is written.
  wanted: a dimensioned drawing of the mounting bracket position, and the kit guide.
- what: fan-module-depth
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The module's width and height are measured off the data sheet's rear photographs, and nothing states
    its depth or the length of its projection beyond the chassis, so the fan component states none and
    has no 3D body.
  wanted: the FAN-7010X dimensions.
- what: fan-power
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The guide's power tables and the data sheet give whole-switch figures only; the fan component's missing
    power figure (lint L27) stands.
  wanted: FAN-7010X power draw.
- what: front-legend-dc
  scope:
  - front
  reason: needs-drawing
  note: >-
    The 7010TX-48-DC and 7010TX-48C-DC print "7010TX-48-DC" on the front; the one modelled front prints
    "7010TX-48". The difference is the legend alone.
  wanted: >-
    a second front view for the DC builds; not drawn, to keep one front per face of this device.
- what: rear-legends
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The photographs' printed text in Chinese, the French lines of the warning box, the two-line "INPUTS
    (2)" legend in three scripts, the fine print of the bar-code stickers and the hand-and-fan pictogram
    are drawn only as far as the English words and the pictograms' outlines; the stickers are blank placeholders
    and no serial, MAC or part number is transcribed.
  wanted: a drawing of the rear artwork.
- what: mgmt-lamps
  scope:
  - front
  reason: needs-photo
  note: >-
    The management jack is drawn with common/rj45-eth@1, the library's only single Ethernet jack, which
    carries two corner lamps; the datasheet photograph shows none on the hardware, and no lamp-less single
    Ethernet jack exists in the library.
  wanted: >-
    a lamp-less single Ethernet jack part, or a photograph that shows lamps the datasheet crop hides.
- what: rear-psu-details
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The two internal power supplies state no model, wattage or dimension in any document held, so no power
    output is stated for them.
  wanted: the supply specification.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: >-
      The 48 built-in 10/100/1000BASE-T ports. rel-pos carries the number printed on the faceplate; the
      upper jack of a column takes the odd number
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
    description: >-
      The four 1/10/25 Gigabit Ethernet SFP ports, numbered 49 to 52 as printed; the odd numbers are the
      upper cages
  sfp28-leds: {term: LED, role: indicator, index-origin: 1, description: one status lamp under each SFP
      cage}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      how the switch is reached out of band - the 10/100/1000 management port, the RS-232 console port
      and the USB port, stacked at the right of the front panel
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system, fan tray and power supply status lamps right of the SFP block
  psu-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the status lamp of each internal power supply, under it on the rear
  ac-inlets:
    term: Inlet
    role: service
    index-origin: 1
    description: the two IEC C14 inlets of the internal AC supplies PS1 and PS2
  dc-inputs:
    term: Inlet
    role: service
    index-origin: 1
    description: the two -48 V DC terminal blocks of the internal DC supplies PS1 and PS2
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: n+0
      redundancy-note: >-
        Guide Appendix E: the switch shuts down if the fan module is disconnected for more than a minute;
        the one module carries two fans inline, and the guide gives no spare fan. The data sheet calls
        them "Redundant & hot-swappable fans" (feature list, p.1) and a "Redundant and reversible dual
        inline fan module" (High Availability, p.1-2); that redundancy is the two inline fans inside the
        one module, and the module itself is a single point, so no spare module is claimed
  grounding: {term: Point, role: furniture, index-origin: 1, description: 'the rear grounding pair, two
      tapped holes for a two-hole lug'}
  furniture: {term: Item, role: furniture, index-origin: 1}
