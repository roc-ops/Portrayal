configurations:
  ac-f:
    kind: orderable
    default: true
    description: >-
      The AC build, front-to-back air: two internal AC supplies on C14 inlets and the FAN-7010X turned
      so that the red AIR EXIT label shows at the rear. Ordered as DCS-7010TX-48-F; the 7010TX-48C of
      the same build is ac-c-f.
    part-numbers:
      DCS-7010TX-48-F: {}
  ac-r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The AC build, back-to-front air: the fan module turned 180 degrees so that the blue AIR INLET label
      shows at the rear. Ordered as DCS-7010TX-48-R; the 7010TX-48C of the same build is ac-c-r.
    bay-attrs:
      fan: {airflow: back-to-front}
    part-numbers:
      DCS-7010TX-48-R: {}
  dc-f:
    kind: orderable
