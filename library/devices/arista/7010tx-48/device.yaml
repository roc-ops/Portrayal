format: 1
kind: device
name: 7010tx-48
version: 0.3.0
maturity: modelled
manufacturer: Arista
model: 7010TX-48
portfolio: {line: 7000 Series, family: 7010TX}
description: >-
  Arista 7010TX-48 - a fixed 1RU data-centre access switch with 48 10/100/1000BASE-T RJ-45 ports and four
  1/10/25 Gigabit Ethernet SFP ports, running EOS. The front carries the 48 jacks in two stacked rows
  (the odd number on top) in four blocks of six columns, the four SFP cages in a two-by-two block, and
  at the right an RJ-45 management port over a USB port over an RJ-45 serial console, with three status
  lamps (system, fan tray, power supplies). The rear carries two internal power supplies (PS1 and PS2,
  built in and not field-replaceable), the one hot-swappable reversible fan module, a hex vent field and
  a two-hole grounding pair. The same panel is ordered with AC supplies (C14 inlets) or DC supplies (a
  two-pole terminal block each, a different rear), front-to-back (-F) or back-to-front (-R) air, and as
  the 7010TX-48C part numbers, which differ from the 7010TX-48 in memory and minimum EOS release only.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7010 Series 1RU Quick Start Guide, Arista Networks, document PDOC-00061-08, 41 pages, PDF created
      2025-10-06 (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7010_1RU.pdf): Table 1 (dimensions
      and weights), Table 2 (operating and storage), Table 3 (power draw and supply ratings), Chapter
      2.1 (airflow orientation), Figures 4-1 and 4-2 (grounding), Table 4 (DC wiring), Figure 4-4 (front
      ports), Appendix A (status indicators, Tables 6 to 8), Appendix B (parts list), Appendix C (Figure
      C-2, the front panel of the 7010TX-48, -48C, -48-DC and -48C-DC), Appendix D (Figures D-2 and D-4,
      the AC and DC rear panels), Appendix E (the fan module, "Only the fan module is field replaceable").
      7010X Series Data Sheet, Arista Networks, 03-0052-14, 10 pages, dated Aug 20th 2025 (https://www.arista.com/assets/data/pdf/Datasheets/7010TX-Datasheet.pdf):
      the technical specifications and ordering tables and its straight-on photographs of the front (7010TX-48
      and 7010TX-48-DC) and of the rear (rear-to-front AC, front-to-rear AC and DC), which are what every
      position below was read from. The guide's own panel figures are small low-resolution rasters (about
      1.4 px per mm), used for counts, numbering and callouts only. Arista publishes no 3D or CAD model,
      and the Visio stencil set could not be fetched, so no drawing or model is held. No drawing, photograph
      or logo is copied into the library, only transcribed facts and new drawings. 7010T-48 (Figure C-1,
      a different front with SFP+ cages and two supply lamps) and the 7010TX-48C-DC-RV3 and -RV3A rack
      builds are in the same guide and are left for a later slice, as the guide describes.
  gate-1-front:
    confidence: estimated
    note: >-
      THE FRONT PHOTOGRAPH PASSES. The datasheet's 7010TX-48 front is 5257 x 524 px for the 439 mm body:
      aspect 10.03 against the stated 439.0 / 43.5 = 10.09, within 0.6 percent, so it is near-orthographic
      and carries geometry at 11.97 px per mm (the width is the scale anchor). The 7010TX-48-DC photograph
      (5248 x 523) gives the same positions. Every front position below is a measure off it, good to about
      0.3 mm; it is `estimated` because it is read off a picture and no dimension states it. The guide's
      Figure C-2 is the callout drawing only.
  gate-1-rear:
    confidence: estimated
    note: >-
      THE REAR PHOTOGRAPHS PASS. The datasheet's rear photographs are 5227 x 521 px (AC rear-to-front),
      5251 x 525 (DC) and 5204 x 536 (AC front-to-rear), each the 439 mm body across: aspect 10.03, 10.0
      and 9.71 against 10.09. The first two pass; the third reads 3.8 percent tall because it is cropped
      higher, so only its x positions (the fan module and the red label) are used from it, and its fan
      figures were checked against the first. Positions are measures off the pictures at 11.9 px per mm
      anchored on the body width, good to about 0.4 mm.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 1: 48.3 x 4.4 x 25.8 cm (19 x 1.75 x 10.0 in), 3.9 kg (8.6 lb), the same for the 7010TX-48,
      -48C, -48-DC and -48C-DC. The datasheet gives 17.3 x 1.71 x 10.8 in (43.9 x 4.35 x 27.6 cm) "incl.
      fans". The width: 48.3 cm is over the mounting ears, so the body between them, which is what is
      modelled, is the datasheet's 43.9 cm (439.0), a 22.0 mm ear each side. The height is the datasheet's
      43.5 mm (the guide rounds it to 4.4 cm, which is also the 1RU 44.45 less clearance). The depth is
      the guide's 258.0: Table 1 gives 25.8 cm as the chassis depth, while the datasheet's 27.6 cm is
      stated "incl. fans" (Technical Specifications, Size row), so it is a different measure. The two
      are recorded in the `sources-disagree` gap `depth`, and the chassis depth is the one modelled. 1RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's Chapter 3.1 ships two mounting brackets and six M4x5 flat-head screws
      for a two-post or four-post rack and shows them in Figures 3-1 to 3-3, which are isometric drawings
      that carry no measure; the datasheet lists the spares KIT-7010 (accessory kit), KIT-7010-4POST and
      KIT-7010-2POST-23. No figure measures the bracket position, so no ear position is written and no
      rail kit is listed in chassis.kits (the kit guide is not held). Recorded in the gap rack-ears.
  front-ports:
    confidence: estimated
    note: >-
      Figure C-2 and the datasheet photograph, 11.97 px per mm anchored on the 439 mm body. 48 jacks in
      two stacked rows, four shells of six columns. The white column dividers in the photograph read,
      from the left, 13.7, 28.0, 42.0, 55.9, 69.9, 83.9 and 98.2 mm in the first shell and the same plus
      91.2, 182.3 and 273.5 in the next three, so the column pitch is 13.97 (the registry's 0.550 in ganged-jack
      pitch) and the shells are 91.17 mm apart, a 7.35 mm gutter between six-column groups. The first
      jack opening reads 14.7 to 27.6 mm from the left edge, so the first cutout is at 14.6 (centre 20.95).
      The upper row opening reads 12.2 to 22.1 and the lower 25.8 to 36.2 down, so the rows are centred
      17.1 and 31.0 mm down, a 13.9 row pitch, and each 11.0 cell is placed to those centres. The shells
      (white plates) read 12.0 to 99.3 across and 10.6 to 37.2 down; the top row is the same part turned
      180 so that its latch is up and its two lamps are above, as the photograph shows lamps above the
      upper jacks and below the lower ones.
  port-numbering:
    confidence: estimated
    note: >-
      The photograph prints the numbers above the top row in pairs, one pair a column: "1" with an up
      triangle and "2" with a down triangle, and so on to "47 up" and "48 down", then "49 up", "50 down",
      "51 up" and "52 down" over the SFP block. The triangle points at the jack it numbers, so the odd
      port is the upper jack and the even port the lower, and the numbering runs down each column then
      across. The guide's Figure C-2 numbers them the same way. Each digit group ends 1.0 mm before its
      triangle, read off the 12x crop: the up triangle sits 4.05 left of the column centre and the down
      one 5.25 right of it, all on one baseline 9.6 mm down. The SFP legends are read the same way: triangles
      at 381.6, 388.3, 395.4 and 402.0. The EOS interface names are not printed on the metal and are not
      modelled.
  port-lamps:
    confidence: datasheet
    note: >-
      Guide Appendix A.1.2, Table 7 and its note: "For RJ-45 ports, the LED on the left indicates link
      status, and the LED on the right indicates traffic on the port." Off is link down, green link up,
      yellow software disabled, flashing yellow failed diagnostics. The photograph shows the pair at the
      two keyway-side corners of each jack, green on the left and amber on the right. The lamps are the
      jack housing's corner windows (common/rj45-ganged-eth) and carry that component's default vocabulary.
      The guide says the SFP ports' lamp behaviour is the same as the RJ-45 ports'.
  sfp-cages:
    confidence: estimated
    note: >-
      Figure C-2 and the photograph. Four cages in a two-by-two block, ports 49 and 51 above 50 and 52.
      The shield around them reads 376.4 to 407.0 across and 9.8 to 37.1 down; the openings abut on the
      registry's 14.25 pitch (SFF-8433) from 377.4, and the rows are 15.0 apart (the registry's measured
      stacked-cage pitch) from 10.8, which closes on the shield's lower edge. A pale blue strip printed
      "25G" runs under them, 377.4 to 405.9 across and 36.4 to 38.1 down. Four lamps sit under the strip
      at 382.3, 387.2, 396.3 and 400.9 mm, 39.4 mm down, one per cage, read in the order of the numbers
      above them. The guide calls them "SFP25 ports" (Figure C-2) and "SFP+" in the data sheet's specification
      table; the cage is one footprint (SFF-8433 applies to SFP28 too) and the rate is 1, 10 or 25 Gbps.
  mgmt-stack:
    confidence: estimated
    note: >-
      Figure C-2 callouts 4, 8 and 9, Figure 4-4: the Ethernet management port (10/100/1000), the USB
      port and the RJ-45 console serial port (RS-232, 9600 baud, 8 data bits, no parity, one stop bit,
      no flow control; pinout Table 5), in one dark metal housing 410.1 to 427.2 across and 6.6 to 38.7
      down. The management jack's opening reads 8.2 to 18.0 down with its latch up (so it is turned 180),
      the USB-A 20.0 to 25.6, and the console 27.5 to 38.3 with its latch down. The photograph shows no
      lamp on the management or console jack. The console is std/rj45@2; the management jack is common/rj45-eth@1,
      the library's single Ethernet jack, whose two corner lamps the photograph does not show (a gap,
      mgmt-lamps); both are centred on 418.65. The management symbol above the stack, the USB trident
      right of it and the "10101" console legend below are printed.
  status-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.1, Table 6 and Figure C-2 callouts 5 to 7: a system status lamp (flashing green
      on power-up, green when all supplies and fans are normal, blue when the locator is active, red for
      a missing or failed supply or fan), a fan tray lamp (green normal, red inserted-but-failed or absent)
      and a power supply lamp (off not inserted or unpowered, green normal, red failed). Three lamps in
      a column at 430.1 mm, 7.7, 11.1 and 14.6 down, with the system glyph, a fan glyph and "PS" beside
      them at 436.2. The guide gives one power supply lamp on the front of this model (Figure C-2 callout
      7); the two supplies also have a lamp each on the rear.
  vents:
    confidence: estimated
    note: >-
      The photograph shows two rows of 18 rectangular slots above the first jack shell (12.05 to 98.2
      across, 1.1 to 3.5 and 5.0 to 7.3 down) and one row of 18 below it (39.5 to 41.9 down), and seven
      in each of two rows above, and two slots below, the SFP block (375.3 to 407.9). The slots are 3.4
      wide on a 4.866 mm pitch (read as 4.86 from slots 1 and 2 in the 22x crop and checked at slot 18);
      each is a plain dark rectangle declared as a vent. No vent is drawn above or below the other three
      shells, as the photograph has none. On the rear the hex perforation is the library's generic vent
      pattern in a measured extent.
  front-legend:
    confidence: estimated
    note: >-
      The vertical model legend reads "7010TX-48" up the left edge (centre 13.7 mm down, baseline 5.3
      mm across, cap height 2.5) with the maker's wordmark below it from 23.8 to 40.2. THE WORDMARK IS
      NOT DRAWN: a logo-zone region is reserved over it and the plain model text is set. The datasheet's
      DC front prints "7010TX-48-DC" in the same place; one front is modelled for both builds and the
      difference is the gap front-legend-dc.
  rear:
    confidence: estimated
    note: >-
      Figures D-2 (AC) and D-4 (DC) callouts, with the datasheet photographs at 11.9 px per mm, rear seen
      from behind with x = 0 at the left of the drawing. PS1 is the left and PS2 the right. AC: each inlet
      is an IEC C14 in a hex-shaped flange 50.8 x 23.8 with a screw at each end, centred 29.8 and 409.2
      and 24.8 down (flanges 4.4 to 55.2 and 383.8 to 434.6); a status lamp sits under each supply at
      29.6 and 408.6, 41.0 down, with the legends PS1 and PS2 beside them. DC: each supply is a two-pole
      terminal block under a clear cover and guards (8.4 to 50.8 and 388.4 to 430.8 across, 11.2 to 38.6
      down) with a tapped grounding hole and the earth symbol above it. The fan slot is 175.0 to 265.0
      across and 2.3 to 42.3 down. The hex vent field is 270 to 380 across and 2.6 to 29.6 down, with
      a lower step 270 to 350 across and 29.6 to 39.8 down, because the grounding pair sits on bare plate
      at its lower right. The grounding pair is two tapped holes 358.1 and 374.3 at 34.3 down, the guide's
      lug size being M4 x 0.7, on the 5/8 in pitch the library's pair component fixes (the photograph
      reads 16.2, 0.3 over 15.875, inside the half-millimetre of the read). The warning box, airflow pictogram
      and three bar-code stickers are measured the same way.
  rear-fan:
    confidence: datasheet
    note: >-
      The fan slot is a seat for a 73 mm module longer than the module: a blue "AIR INLET" label band
      at its left end (175.0 to 185.0) and a red "AIR EXIT" band at its right (254.1 to 264.1) are printed
      on the chassis, and the module covers one. Back-to-front (-R): the module is at the right of the
      slot with the blue band showing. Front-to-back (-F): it is at the left of the slot with the red
      band showing (datasheet photographs; guide Chapter 2.1 and Figure A-3). Both bands, the module and
      its handle are in the component, whose `airflow` field a configuration sets. The guide names callouts
      for "airflow direction indicator label (active)" and "(inactive)" and says the labels, not the handle,
      carry the colour; no handle finish is stated, so none is set.
  fru-bays:
    confidence: datasheet
    note: >-
      Guide Appendix E: "Only the fan module is field replaceable." Chapter 4: "The switches operate with
      two internal power supplies. At least one of the supplies must connect to a power source." The data
      sheet calls them "integrated AC power" and "integrated DC power supplies". So THE POWER SUPPLIES
      ARE PART OF THE CHASSIS AND ARE NOT BAYS: the two inlets (or terminal blocks) and the two lamps
      are placements, and the fan module is the one bay. No wattage, part number or dimension is published
      for the supplies.
  power:
    confidence: datasheet
    note: >-
      Guide Table 3: typical / maximum power draw 75 W / 100 W for the 7010TX-48, -48C, -48-DC and -48C-DC;
      AC supply rating 100 - 240 VAC, 2.2 A, 50/60 Hz; DC -40 to -72 VDC, 2.5 A. Data sheet: 61 W / 80
      W (7010TX-48), 83 W / 95 W (-48C), 56 W / 75 W (-48-DC), TBD (-48C-DC), typical measured at 25 C
      ambient with 50 percent load; typical input current 0.96 to 0.48 A AC and 2.5 A maximum at -48 V
      DC; efficiency 93 percent (Platinum) AC and 92 percent DC. The two documents state the same measures
      for the same models and differ, so this is a `sources-disagree` gap (power-draw); the device attrs
      carry the guide's figure, the newer document, and the data sheet's are in the gap.
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, altitude 0 to 3,000 m, humidity 5 to 90
      percent non-condensing. Data sheet: operating 0 to 40 C, storage -40 to 70 C, humidity 5 to 95 percent,
      altitude 0 to 3,000 m ("certain airflow configurations or ... higher power ... optics may reduce
      the maximum operating temperature"). Storage temperature and humidity differ: gap `environment`,
      the guide's used.
  configurations:
    confidence: datasheet
    note: >-
      Data sheet Ordering Information: DCS-7010TX-48-F and -R (2 x AC, front-to-rear and rear-to-front
      air), DCS-7010TX-48C-F and -R, DCS-7010TX-48-DC-F and -R (2 x DC PSU), DCS-7010TX-48C-DC-F and -R.
      The guide names the four power builds without the air suffix. The -48C builds are the same front
      panel, rear and fan; they differ in system memory (8 GB against 4 GB) and minimum EOS release (4.31.1
      and 4.33.2 against 4.26.0), which the data sheet's Technical Specifications table prints (the guide
      prints neither), and in the data sheet's power figures, which stay in the gap `power-draw`. Each
      is therefore a configuration of its own (ac-c-f, ac-c-r, dc-c-f and dc-c-r, beside ac-f, ac-r, dc-f
      and dc-r), stating its own memory, release and DCIM description, and not a device of its own. The
      7010T-48 and -48-DC (Figure C-1) have a different front panel and the DCS-7010TX-48C-DC-RV3 and
      -RV3A builds a different chassis for ORv3 and MGX racks (their fan supports only the -F orientation);
      both are left for a later slice.
  interface-names:
    confidence: datasheet
    note: >-
      Not printed and not modelled. EOS names the front ports Ethernet1 to Ethernet52 and the management
      port Management1; this is the vendor's convention and no held document prints it, so the names stay
      out of the file as a block and go here.
  colour:
    confidence: estimated
    note: >-
      The front is the median of 400 pixels of bare plate in the datasheet photograph, #9b9ea6; the rear
      plate is the median of the same on the rear photograph, #acb4b6.
  lifecycle:
    confidence: estimated
    note: >-
      Searched 2026-10-22. Arista's end-of-sale notice "End of Sale of the Arista 7010TX-48 Switches"
      (22420, announced 2025-09-19) gives the last day to order as 2026-03-20 and the end-of-life date
      as 2031-03-20; the 7010TX-48-DC has its own notice (22421, https://www.arista.com/en/support/advisories-notices/end-of-sale/22421-end-of-sale-of-the-arista-7010tx-48-dc-switches).
      The search result stated that other 7010X models are not affected; the page itself was read through
      the search summary and not fetched, so the dates are as that summary gave them and the -48C part
      numbers' status is not confirmed.
  other-faces:
    confidence: datasheet
    note: >-
      No source draws the top, bottom or sides flat. The guide's installation figures are isometric (Figures
      3-1 to 3-4) and the rubber-pad figure shows the underside with four indentations but no measure.
      Each carries an `empty` sentence.
attrs:
  physical:
    weight: 3.9 kg (8.6 lb) for the 7010TX-48, -48C, -48-DC and -48C-DC (guide Table 1, data sheet)
    size-over-ears: 48.3 x 4.4 x 25.8 cm (19 x 1.75 x 10.0 in) with the mounting ears (guide Table 1)
    depth-with-fans: 27.6 cm (10.8 in) "incl. fans" (data sheet); the modelled 258.0 mm is the guide's
  performance:
    throughput: 296 Gbps, non-blocking
    packets-per-second: 220 Mpps
    latency: from 2.8 microseconds (25G SFP to RJ-45)
    packet-buffer: 4 MB fully shared packet buffer
    mac-addresses-max: 64000
    ports-max-speed: 52 ports of 1 Gbps; four ports of 10 Gbps; four ports of 25 Gbps
  power:
    power-typical-w: 75
    power-max-w: 100
    power-envelope: unstated
    psu-redundancy: 1+1; two internal supplies, at least one of which must be connected
    input-ac: 100 - 240 VAC, 2.2 A, 50/60 Hz (guide Table 3), IEC 60320 C14
    input-dc: -40 to -72 VDC, 2.5 A, AWG 14 to 18 ring lug (guide Tables 3 and 4)
    efficiency: 93 percent (Platinum) AC, 92 percent DC (data sheet)
  thermal:
    airflow: reversible, front-to-back or back-to-front; set by turning the fan module 180 degrees
    noise: 46.5 dBA typical at 27 C, 56.5 dBA maximum (data sheet)
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -25 to 70 C (guide Table 2); the data sheet says -40 to 70 C
    humidity: 5 to 90 percent non-condensing (guide Table 2); the data sheet says 5 to 95 percent
    altitude: 0 to 3,000 m (10,000 ft) operating
  platform: {cpu: Dual-Core x86, memory: 4 GB (data sheet), storage: 8 GB flash}
  features:
    optics-sfp28: >-
      1000BASE-SX/LX, 10GBASE-CR, -AOC, -SR, -LR, -ER, -ZR and 25GBASE-CR, -AOC, -SR, -LR (data sheet)
    eos-license: license group G2; minimum EOS 4.26.0 (7010TX-48, -48-DC)
  management:
    console: RJ-45 RS-232 serial on the front, 9600 baud 8N1, no flow control
    oob: one 10/100/1000 management port on the front
    usb: one USB port on the front, for software or configuration updates
  compliance:
    emc: >-
      FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386
    safety: EN 62368-1:2014 + A11:2017, IEC 62368-1:2014
    certifications: BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI (data sheet)
    rohs: RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)
  lifecycle:
    eol: announced
    eol-announcement: >-
      https://www.arista.com/en/support/advisories-notices/end-of-sale/22420-end-of-sale-of-the-arista-7010tx-48-switches
    end-of-sale: '2026-03-20'
    end-of-life: '2031-03-20'
