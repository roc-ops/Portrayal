format: 1
kind: device
name: 7050tx3-48c8
version: 0.1.0
maturity: modelled
manufacturer: Arista
model: 7050TX3-48C8
aliases:
  - {name: DCS-7050TX3-48C8, kind: marketing}
portfolio: {line: 7000 Series, family: 7050X3}
description: >-
  Arista 7050TX3-48C8 - a fixed 1RU data-centre switch with 48 x 1/2.5/5/10GBASE-T RJ-45 ports and 8 x 100G QSFP ports,
  running EOS. The front carries the RJ-45 jacks in two stacked rows of twelve columns on each side, in four blocks of six
  columns, the odd number on top, with the eight QSFP cages in two stacked rows of four columns between the two halves. Four
  system lamps (system, fan, PS1, PS2) are at the top right. The rear carries two hot-swap 500 W power supplies at the ends
  and two hot-swap fan modules, with the RJ-45 management port, the USB port and the RJ-45 console port between the left
  supply and the first fan. The same panel is ordered with front-to-rear air (-F) or rear-to-front air (-R).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7050 Series 1RU (Gen 3) Quick Start Guide, Arista Networks, document DOC-00141-08, 57 pages, copyright 2025, PDF
      created 2025-08-19 (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7050_1RU_Gen3.pdf): Table 1
      (dimensions and weights), Table 2 (operating and storage), Table 3 (power input), Table 4 (power draw and supported
      supplies), section 2.1 (airflow orientation, handle colour), section 4.1 and Table 5 (grounding), Appendix C (Figure
      C-17, the front panel of the DCS-7050TX3-48C8), Appendix D (Figure D-3, the rear panel with management ports in the
      rear and two dual-fan modules), Appendix E (field replacement). 7050X3 Series 10/25/40/50/100G Data Center Switches
      Data Sheet, Arista Networks, 03-0040-46 (https://www.arista.com/assets/data/pdf/Datasheets/7050X3-Datasheet.pdf):
      the model comparison, the power supply specifications and the ordering information. Held and checked first: intake
      COVERAGE.md and SOURCES.md, which list no photograph, 3D model or CAD file for this model (Arista publishes none; a
      `find` of the intake folder for 3D files found none) and a Visio stencil master that was not used. No drawing,
      photograph or logo is copied into the library, only transcribed facts and new drawings.
  gate-1-front:
    confidence: estimated
    note: >-
      Figure C-17 passes. The raster is 576 x 137 pixels; the body between its plate edges measures about 563 px wide and
      57 px tall (aspect 9.9) against the data sheet's 440 / 43.7 = 10.07, so the figure is near-orthographic and carries
      geometry at about 1.277 px/mm (the 440 mm body is the scale anchor). One pixel is 0.8 mm, so every position is good to
      about 1 mm, and every one is `estimated` because it is read off a picture and no dimension states it. The RJ-45
      jacks were read from the white port-number tabs of an enlargement at three times, the QSFP cages from theirs.
  gate-1-rear:
    confidence: estimated
    note: >-
      Figure D-3 as for arista/7050sx3-48yc8: the guide draws the rear generically (D-1 to D-4) and does not say which model
      uses which. The 7050TX3-48C8 is mapped to D-3 by its two fan modules (data sheet: "Hot-swappable Fans 2 (1+1
      redundant)"), its 1RU height, its two power supplies and its management ports at the rear (Figure C-17 has none at
      the front). The data sheet (PDF page 3) captions one rear photograph for the 7050TX3-48C8 among others, two fan modules with a
      plate between, which agrees; the guide does not name the figure, so THE MAPPING IS ESTIMATED.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 1: 48.3 x 4.4 x 46.7 cm (19 x 1.75 x 18.4 inches), 9.4 kg (20.6 lbs). Data sheet: 44 x 4.4 x 46.8 cm, 20.6
      lbs (9.36 kg). The width: 48.3 cm is over the mounting ears, so the body between them, which is what is modelled, is
      the data sheet's 44 cm (440.0 here). The height is 43.7, as the library's other 7050 devices. The depth is the guide's
      46.7 cm (467.0); the data sheet's 46.8 cm is 1 mm more, the gap `depth`. The weights agree (9.4 kg and 9.36 kg).
      1RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's Chapter 3 mounts the switch with the accessory-kit brackets and shows them in isometric
      drawings that carry no measure, and the kit guides are not held. Recorded in the gap rack-ears.
  front-ports:
    confidence: estimated
    note: >-
      Figure C-17 at about 1.277 px/mm. Forty-eight RJ-45 jacks in two stacked rows (ports 1 to 48), twelve columns on each
      side of the QSFP block, in blocks of six columns on the registry's 13.97 mm ganged-jack pitch (the figure reads 13.9);
      the tab centres of ports 1, 13, 25 and 37 read 12.3, 101.6, 270.4 and 358.7 mm, so the four blocks start at 5.95,
      95.2, 264.0 and 352.4 mm, a block step of about 89 mm (a 5.1 mm gap between blocks of 83.8 mm). The jacks are the
      library's stacked RJ-45 of arista/7280tr3-40c6 (rows 14.5 mm apart from 9.1 mm down), whose figure draws the same two
      rows; this figure's tabs sit outside the jacks and the rows are not resolved to better than 3 mm. Eight QSFP100 cages in two
      stacked rows of four columns (49 to 56), centred 190.9 to 247.9 mm on the registry's 19.0 mm pitch (the figure reads 191,
      209, 230 and 245), between 9.96 and 24.16 mm down, as arista/7280tr3-40c6. The upper jack is the registry's mirror of the
      lower (turned 180), as that device; the QSFP rows are belly to belly, upper upright and lower turned 180, the
      library's convention, which the figure cannot confirm.
  port-numbering:
    confidence: estimated
    note: >-
      Figure C-17 (callout 5, "Port numbers") prints 1 over 2, 3 over 4, and so on, 1 to 48 across the jack columns, and 49 over
      50 to 55 over 56 across the QSFP columns, which sit between ports 24 and 25 in space and are numbered after 48. The odd number is
      the upper cage. The figure prints each number on a white tab outside its jack; a seated jack hides what is painted under
      it, so the numerals are set in the 3.5 mm band between the two rows, the odd number left of its column centre and the even
      one right of it. EOS interface names are not printed on the metal and are not modelled.
  port-speeds:
    confidence: datasheet
    note: >-
      Data sheet: "48x 1/2.5/5/10G-T" RJ-45 ports and "8x QSFP100". All forty-eight jacks are modelled at the highest native
      rate, 10G.
  port-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.2 gives the port lamp states of the family, but Figure C-17 at 1.28 px/mm shows a line of small blue
      numbers under the jack rows and no per-port lamp that can be placed or counted. No port lamp is modelled (gap
      `port-lamps`).
  status-lamps:
    confidence: estimated
    note: >-
      Figure C-17 callouts 1 to 4: a system status lamp, a fan status lamp and a status lamp for each of the two power
      supplies, in a row at the top right with a symbol or legend above each; the guide's Appendix A.1.1 states the colours.
      Four lamps at 421.3, 426.0, 430.7 and 435.4 mm across and 4.4 mm down. The order (system, fan, PS1, PS2) is the callout
      order of the figure.
  speed-strips:
    confidence: estimated
    note: >-
      Figure C-17 draws a lavender band along the bottom of the QSFP block, 181.5 to 257.5 mm across, and a perforated grey
      panel between the two QSFP rows. The band is drawn in its colour and extent and its legends are not legible; the perforated
      panel is not drawn, because the numerals are set there.
  front-legend:
    confidence: estimated
    note: >-
      The figure prints the maker's wordmark and the model line at the top left. THE WORDMARK IS NOT DRAWN: a logo-zone
      region is reserved over it and the plain model text is set.
  vents:
    confidence: estimated
    note: >-
      The figure shows a perforated band along the top (0.3 to 8 mm down, from 28 mm across to the lamps) with a round knob at
      its left, and a row of slits along the bottom lip (about 41 mm down). Each is drawn in its measured extent, not hole by
      hole.
  colour:
    confidence: estimated
    note: >-
      The front plate is the median of the grey pixels (neither black nor white, low saturation) of the guide's figure C-17,
      #828384. The figure is a raster and its lighting is not known, so the shade is estimated.
  rear:
    confidence: estimated
    note: >-
      Figure D-3 as for arista/7050sx3-48yc8: PS1 left and PS2 right at 4.4 and 361.5 mm across, 73.5 mm wide; the management
      block a grey plate 82.5 to 100.5 mm across; two fan modules 78.6 mm wide at 105.7 and 276.6 mm; a grey plate between them
      printed with ASSY NUMBER, SERIAL NUMBER and MAC ADDRESS fields and PS1 and PS2 legends.
  rear-fan:
    confidence: datasheet
    note: >-
      Data sheet: "Hot-swappable Fans 2 (1+1 redundant)", "Fan Tray FAN-7011M-F/R" and the spares FAN-7011M-F and FAN-7011M-R.
      The two fan modules are bays that accept FAN-7011M-F or -R; the -R configurations seat the blue modules. The components are
      the ones the 7280SR3-48YC8 seats, reused because the maker's part number is the same.
  fru-bays:
    confidence: datasheet
    note: >-
      Guide Appendix E (E.2 power supplies, E.3 fan modules) and the data sheet ("1+1 hot-swappable"): THE TWO POWER SUPPLIES
      AND THE TWO FAN MODULES ARE BAYS. Nothing on this chassis is a built-in unit.
  power:
    confidence: datasheet
    note: >-
      Guide Table 4: typical / maximum 212 W / 346 W with PWR-511-AC or PWR-511-DC. The data sheet prints the same, 212W / 346W
      ("measured at 25C ambient with 50% load on all ports, excludes transceivers"): the documents agree and there is no
      conflict.
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, altitude 0 to 3,000 m, humidity 5 to 90 percent non-condensing.
      Data sheet: storage -40 to 70 C. The storage temperature differs: gap `environment`, the guide's used.
  configurations:
    confidence: datasheet
    note: >-
      Data sheet ordering information: DCS-7050TX3-48C8-F and -R ("48x10GBaseT & 8x100GbE QSFP100 switch, front-to-rear air,
      2xAC" and "rear-to-front air, 2xAC"). The "#" SKU is an order of parts, not a part number a DCIM can hold, and is not
      listed. The data sheet lists no DC build of the switch: the DC configurations are examples with no part number.
  interface-names:
    confidence: datasheet
    note: >-
      Not printed and not modelled. EOS names ports Ethernet1 to Ethernet56 and Management1; this is the vendor's convention and
      no held document prints it.
  lifecycle:
    confidence: estimated
    note: >-
      Searched the held documents (the guide and the data sheet) for an end-of-sale or end-of-life notice for the 7050TX3-48C8:
      none. No web search was made, so this is a statement about those documents only.
  other-faces:
    confidence: datasheet
    note: >-
      No source draws the top, bottom or sides flat. The guide's installation figures are isometric. Each carries an `empty`
      sentence. The guide's Table 5 gives this model KIT-GND-EXT-1RU on the bottom of the chassis; no figure measures it.
