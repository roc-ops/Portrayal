    size-over-ears: 48.3 x 4.4 x 46.7 cm (19 x 1.75 x 18.4 in) with the mounting ears (guide Table 1)
  performance:
    throughput: 1.28 (2.56) Tbps
    packets-per-second: 1 Bpps
    latency: 3 microseconds (measured on the 10GBASE-T ports)
    packet-buffer: 32 MB (dynamic buffer allocation)
    ports-max-speed: eight ports of 100 Gbps; 16 of 50 Gbps; 8 of 40 Gbps; 16 of 25 Gbps; 64 of 10 Gbps; 48 of 1 Gbps
    interfaces-max: 64
  power:
    power-typical-w: 212
    power-max-w: 346
    power-envelope: as-tested
    power-measure: guide Table 4 typical and maximum, which the data sheet repeats; typical measured at 25 C ambient with 50 percent load on all ports, excluding transceivers (data sheet)
    psu-redundancy: 1+1
    input-ac: 100 - 127 / 200 - 240 VAC, 7.1 / 3.4 A (PWR-511-AC), IEC 60320 C14
    input-dc: -48 to -60 VDC, 13 A (PWR-511-DC)
