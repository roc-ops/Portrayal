configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis with two AC supplies and two fan modules fitted, front-to-rear air, before any part
      number: the shape every build below starts from.
  f:
    kind: orderable
    description: >-
      The 7050TX3-48C8 with two AC supplies and front-to-rear air: PWR-511-AC-RED supplies and FAN-7011M-F
      fan modules, all with red handles. Ordered as DCS-7050TX3-48C8-F.
    part-numbers:
      DCS-7050TX3-48C8-F: {}
  r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7050TX3-48C8 with two AC supplies and rear-to-front air: PWR-511-AC-BLUE supplies and FAN-7011M-R
      fan modules, all with blue handles. Ordered as DCS-7050TX3-48C8-R.
    bays: {psu-1: arista/7280r3-pwr-500-ac-rev@1, psu-2: arista/7280r3-pwr-500-ac-rev@1, fan-1: arista/7280r3-fan-m-rev@1,
      fan-2: arista/7280r3-fan-m-rev@1}
    part-numbers:
      DCS-7050TX3-48C8-R: {}
  dc-f:
    kind: example
    power: dc
    description: >-
      Two DC supplies and front-to-rear air: PWR-511-DC-RED supplies and FAN-7011M-F fan modules. The
      data sheet lists no DC part number for the switch; the supplies are spares, and a DC build is ordered
      through the "#" configurable SKU.
    bays: {psu-1: arista/7280r3-pwr-500-dc@1, psu-2: arista/7280r3-pwr-500-dc@1}
  dc-r:
    kind: example
    power: dc
    airflow: back-to-front
    description: >-
      Two DC supplies and rear-to-front air: PWR-511-DC-BLUE supplies and FAN-7011M-R fan modules. No
      DC part number is listed for the switch.
    bays: {psu-1: arista/7280r3-pwr-500-dc-rev@1, psu-2: arista/7280r3-pwr-500-dc-rev@1, fan-1: arista/7280r3-fan-m-rev@1,
      fan-2: arista/7280r3-fan-m-rev@1}
