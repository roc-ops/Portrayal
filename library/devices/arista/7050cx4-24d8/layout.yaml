gaps:
  - what: fan-count
    scope: [rear]
    reason: sources-disagree
    note: >-
      The data sheet's model comparison gives "Hot-swappable Fans 4 (N+1 redundant)" for the 7050SDX4-48D8, 7050SPX4-48D8, 7050CX4-24D8 and 7050CX4M-48D8 in one cell, while
      the guide draws one 1RU rear (Figure D-1) with three fan modules and one 2RU rear (Figure D-2) with four, and the data sheet's own 1RU rear photograph shows three. The
      2RU model has four; this 1RU model is drawn with three, as the guide's figure.
    wanted: the maker's statement of the 1RU 7050CX4-24D8's fan count.
  - what: environment
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet). The guide's is in attrs.
    wanted: the maker's statement of which is current.
  - what: rack-ears
    scope: [front]
    reason: needs-drawing
    note: >-
      The guide's Figures 3-1 to 3-13 are isometric drawings with no measure and the kit guides for KIT-7101, KIT-7101-D and the other spares are not held, so no ear
      position or rail kit is written.
    wanted: a dimensioned drawing of the mounting bracket position, and the kit guides.
  - what: front-legends
    scope: [front]
    reason: needs-photo
    note: >-
      The strips' legends, the small print of the face, the system and fan lamp glyphs and the PS1 and PS2 legends are unreadable in the 830 px figure. The glyphs and the
      two PS legends are drawn as read; the rest is not drawn.
    wanted: a photograph of the face.
  - what: cage-orientation
    scope: [front]
    reason: needs-photo
    note: >-
      Which side the latches of the stacked cages face is not visible in the figure. The library's belly-to-belly convention is used (upper cage upright, lower turned 180).
    wanted: a photograph of the stacked cages.
  - what: rear-mgmt-block
    scope: [rear]
    reason: needs-photo
    note: >-
      The management block's console symbol is drawn as read; the order of the three ports (management over USB over console) follows the data sheet's rear photograph and
      figure D-1.
    wanted: a photograph of the rear management block.
  - what: psu-dc-face
    scope: [rear]
    reason: needs-drawing
    note: >-
      The PWR-1011-DC supplies are drawn as the AC supply's housing with a plain two-pole terminal block; the real terminal arrangement is not drawn.
    wanted: a flat drawing or photograph of the PWR-1011-DC.
  - what: module-power
    scope: [rear]
    reason: vendor-silent
    note: >-
      The guide's power tables and the data sheet give whole-switch figures only; the fan modules' missing power figure (lint L27) stands.
    wanted: FAN-7011H power draw.
  - what: grounding
    scope: [bottom]
    reason: needs-drawing
    note: >-
      The 1RU grounding point is on the bottom of the chassis for KIT-GND-EXT-1RU (guide section 4.2, Table 5). No flat figure measures it, so it is not placed.
    wanted: a flat drawing of the bottom with the grounding bracket holes.
groups:
  qsfp56-200g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp56, speed: 200g}
    description: >-
      The 24 200G QSFP56 ports, numbered 1 to 24 as printed; the odd numbers are the upper cages
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
    description: >-
      The eight 400G QSFP-DD ports, numbered 25 to 32 as printed; the odd numbers are the upper cages
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      The two SFP+ ports, numbered 33 and 34 as printed; 33 is the upper cage
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: a status lamp for each port, at the side of its cage
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system, fan and two power supply lamps at the top right of the front
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      how the switch is reached out of band - the 10/100/1000 management port, the USB port and the RS-232
      console port, stacked in one block at the left of the rear panel
  psu-bays:
    term: Bay
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Data sheet: "Hot-swap Power 2 (1+1 redundant)". Guide section 4.4: at least one supply must connect to a power source
    description: the two hot-swap power supplies, 1+1 redundant
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: n+1
      redundancy-note: >-
        Data sheet: "Hot-swappable Fans 4 (N+1 redundant)"; the guide's 1RU rear figure draws three
    description: the three hot-swap fan modules the guide's figure draws
