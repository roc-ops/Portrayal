format: 1
kind: device
name: 7050cx4-24d8
version: 0.1.0
maturity: modelled
manufacturer: Arista
model: 7050CX4-24D8
portfolio: {line: 7000 Series, family: 7050X4}
description: >-
  Arista 7050CX4-24D8 - a fixed 1RU data-centre switch with 24 x 200G QSFP56 ports, 8 x 400G QSFP-DD ports and 2 x SFP+
  ports, running EOS. The front carries the QSFP56 cages in two stacked rows, the odd number on top, in twelve columns, with
  the four QSFP-DD columns after them and the two SFP+ cages stacked at the right. A blue strip between the rows runs under
  the 200G cages and an orange one under the 400G cages. Four system lamps (system, fan, PS1, PS2) are at the top right.
  The rear carries two hot-swap power supplies at the ends, three hot-swap fan modules, and the RJ-45 management port, the
  USB port and the RJ-45 console port. The same panel is ordered with front-to-rear air (-F) or rear-to-front air (-R).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7050X4 Series Quick Start Guide, Arista Networks, document DOC-06569-02, 51 pages, copyright 2025, PDF created
      2025-04-28 (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7050X4.pdf): Table 1 (dimensions and weights),
      Table 2 (operating and storage), Table 3 (power input), Table 4 (power draw and supported supplies), section 4.5 and
      Figure 4-8 (serial and management ports), Appendix A (status indicators, Tables 9 to 13), Appendix C (Figure C-5, the
      front panel of the DCS-7050CX4-24D8), Appendix D (Figure D-1, the rear panel with three fan modules), Appendix E (field
      replacement). 7050X4 Series 100/200/400G Data Center Switches Data Sheet, Arista Networks, 03-0057-27, dated Aug 27th,
      2025 (https://www.arista.com/assets/data/pdf/Datasheets/7050X4-Datasheet.pdf): the model comparison, the power supply
      specifications, the environmental characteristics and the ordering information. Held and checked first: intake
      COVERAGE.md and SOURCES.md, which list no photograph, Visio stencil, 3D model or CAD file for this model (Arista
      publishes none; the stencil zip could not be fetched). No drawing, photograph or logo is copied into the library, only
      transcribed facts and new drawings.
  gate-1-front:
    confidence: estimated
    note: >-
      Figure C-5 passes at 0.5 percent. The raster is 830 x 208 pixels. The body between its plate edges measures 828 px wide and
      83 px tall (aspect 10.0), against the data sheet's 439.9 / 43.7 = 10.07, so the figure is near-orthographic and carries
      geometry at 1.882 px/mm (the 440 mm body is the scale anchor). One pixel is 0.53 mm, so every front position is good to
      about 0.5 mm, and every one is `estimated` because it is read off a picture and no dimension states it. The cage columns
      were read from the white port-number tabs by their centres.
  gate-1-rear:
    confidence: estimated
    note: >-
      Figure D-1 as for arista/7050dx4-32s, the only 1RU rear the guide draws: three fan modules. THE DATA SHEET SAYS "Hot-swappable
      Fans 4 (N+1 redundant)" for this model (one cell spans the four models that share it) and the guide's figure draws three; the
      guide's figure is followed. The mapping to D-1 and the three-fan count are ESTIMATED, and the disagreement is the gap `fan-count`.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 1: 48.3 x 4.4 x 47.5 cm (19 x 1.75 x 18.7 inches), 10.4 kg (23.0 lbs). Data sheet: 43.99 x 4.37 x 47.46 cm
      (17.3 x 1.72 x 18.68 in), 23 lbs (10.4 kg). The width: 48.3 cm is over the mounting ears, so the body between them, which is what
      is modelled, is the data sheet's 43.99 cm (440.0 here). The height is the data sheet's 43.7 (the guide rounds it to 4.4 cm). The
      depth is the guide's 47.5 cm (475.0); the data sheet's 47.46 cm is the same figure to a tenth of a millimetre less. 1RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED, as arista/7050dx4-32s: the guide's rack-mounting figures are isometric and carry no measure, and the kit guides are
      not held. Recorded in the gap rack-ears.
  front-ports:
    confidence: estimated
    note: >-
      Figure C-5 at 1.882 px/mm anchored on the 440 mm body, tab centres from a pixel scan. Twenty-four QSFP56 cages (ports 1 to 24) in
      two stacked rows and twelve columns: the tab centres of the top row run from 40.5 px at a pitch of 47.1 px, 25.03 mm, so the cage
      centre of column 1 is 21.3 mm from the left of the body. Eight QSFP-DD cages (25 to 32) in four columns after them, the first
      centred 324.2 mm from the left, on a 24.98 mm pitch. The cages are 20.0 x 10.15 mm (std/qsfp56) and 19.0 x 10.0 mm (std/qsfp-dd). The
      top row centres 14.9 mm and the bottom row 28.2 mm below the top, a row pitch of 13.3 mm. Two SFP+ cages (33 over 34) sit at the
      right, centred 421.4 mm from the left. The belly-to-belly orientation is the library's convention (upper cage upright, lower turned
      180); the figure is too small to show the latch side.
  port-numbering:
    confidence: estimated
    note: >-
      Figure C-5 (callout 1, "Port numbers") prints 1 over 2, 3 over 4, and so on across, 1 to 32, then 33 over 34 at the right. The odd
      number is the upper cage. The figure prints each number on a white tab over its cage and, smaller, in blue beside the cage's lamp (left
      of an upper cage, right of a lower one). The numerals are set in the blue position. EOS interface names are not printed on the metal
      and are not modelled.
  port-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.2, Table 10: off the link is down, green link up, yellow software disabled, flashing yellow failed diagnostics. Figure
      C-5 draws one small dark lamp for each port: at the left edge of an upper cage and the right edge of a lower one; the 33 lamp is at the left
      of its cage and the 34 lamp at the right of its cage. One lamp a port is modelled.
  speed-strips:
    confidence: estimated
    note: >-
      Figure C-5 draws a blue strip between the rows under each QSFP56 cage (the first reads 200G), an orange one under each QSFP-DD cage (the
      first reads 400G) and a navy one between the SFP+ cages (10G). They are drawn at 20.8 to 23.3 mm down, 19.2 mm wide and centred on their column.
      The printed legends are not drawn.
  status-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.1, Table 9 and Figure C-5 callouts 2 to 5: a system status lamp, a fan status lamp and a status lamp for each of the two power
      supplies, as arista/7050dx4-32s. Four lamps in a row at the top right, 412.4, 419.4, 426.5 and 433.2 mm across and 1.6 mm down, each with its symbol or
      legend below it; the order is the order of the guide's Figure A-1.
  front-legend:
    confidence: estimated
    note: >-
      The vertical model legend reads "7050CX4-24D8" up the left plate. The maker's wordmark, turned to run up the plate at the bottom left from 0.8 to 5.3 mm
      across and 29.0 to 40.5 mm down, IS NOT DRAWN: a logo-zone region is reserved over it and the plain model text is set.
  vents:
    confidence: estimated
    note: >-
      The figure shows rows of round vent holes above the cages (3.7 to 8.0 mm down) and below them (33.5 to 39.9 mm down), and a denser, larger grid over the last
      six columns. Each is drawn as a vent field in its measured extent; the individual holes and a round hole at the left edge are not drawn.
  rear:
    confidence: estimated
    note: >-
      Figure D-1 as for arista/7050dx4-32s: PS1 left and PS2 right, supplies 73.5 mm wide at 4.0 and 362.3 mm across, the management block 83.0 to 101.0 mm
      across, three fan modules 78.6 mm wide at 107.7, 191.0 and 274.3 mm.
  rear-fan:
    confidence: datasheet
    note: >-
      Data sheet "Fan Tray" row: "FAN-7011H-F" and "FAN-7011H-R" for the 7050CX4-24D8, the second with note 5: "Reverse airflow configuration requires derating to
      35C ambient". The three fan modules are bays that accept those two; the -R configurations seat the blue ones.
  fru-bays:
    confidence: datasheet
    note: >-
      Guide Appendix E and the data sheet ("1+1 hot-swappable"): THE TWO POWER SUPPLIES AND THE THREE FAN MODULES ARE BAYS. Nothing on this chassis is a built-in
      unit. The guide draws no blank for an empty bay, so none is modelled.
  power:
    confidence: datasheet
    note: >-
      Guide Table 4: typical / maximum 226 W / 465 W with PWR-1011-AC or PWR-1011-DC; the data sheet states the same, typical "measured at 25C ambient with 50% load
      on all ports, excludes transceivers".
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, altitude 0 to 3,000 m, humidity 5 to 90 percent non-condensing. Data sheet: storage -40 to 70 C. The
      storage temperature differs: gap `environment`, the guide's used. The data sheet's note 1 says certain airflow configurations or higher-power optics may reduce the
      maximum operating temperature.
  configurations:
    confidence: datasheet
    note: >-
      Data sheet ordering information: DCS-7050CX4-24D8-F and -R ("front-to-rear air, 2xAC" and "rear-to-front air, 2xAC"). The "#" SKU is an order of parts. The data sheet
      lists no DC SKU: the DC configurations are examples with no part number.
  interface-names:
    confidence: datasheet
    note: >-
      Not printed and not modelled.
  colour:
    confidence: estimated
    note: >-
      The front plate is the median of bare-plate pixels in the guide's figure C-5.
  lifecycle:
    confidence: estimated
    note: >-
      Searched 2026-10-22 for an end-of-sale notice for the 7050CX4-24D8 on Arista's advisories and notices pages. No notice was found.
  other-faces:
    confidence: datasheet
    note: >-
      No source draws the top, bottom or sides flat. Each carries an `empty` sentence. The 1RU grounding point is on the bottom of the chassis (guide section 4.2, Table
      5, KIT-GND-EXT-1RU); no figure measures it.
attrs:
  physical:
    weight: 10.4 kg (23.0 lbs) (guide Table 1, data sheet)
    size-over-ears: 48.3 x 4.4 x 47.5 cm (19 x 1.75 x 18.7 in) with the mounting ears (guide Table 1)
  performance:
    throughput: 8.0 (16) Tbps
    packets-per-second: 2.7 Bpps
    latency: from 900 ns
    packet-buffer: 82 MB (fully shared)
    ports-max-speed: 8 ports of 400 Gbps; 40 of 200 Gbps; 72 of 100 Gbps; 72 of 50 Gbps; 40 of 40 Gbps; 72 of 25 Gbps; 72 + 2 of 10 Gbps
    interfaces-max: 72 + 2
  power:
    power-typical-w: 226
    power-max-w: 465
    power-envelope: as-tested
    power-measure: typical at 25 C ambient with 50 percent load on all ports, excluding transceivers (data sheet)
    psu-redundancy: 1+1
    input-ac: 100 - 120 / 200 - 240 VAC, 12 / 6 A (PWR-1011-AC), IEC 60320 C14
    input-dc: -48 to -60 VDC (PWR-1011-DC)
    efficiency: 93 percent (Platinum) AC, 94 percent DC (data sheet)
  thermal:
    airflow: front-to-rear or rear-to-front, set by the fan modules and supplies fitted
    fan-redundancy: N+1 hot-swap fan modules
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -25 to 70 C (guide Table 2); the data sheet says -40 to 70 C
    humidity: 5 to 90 percent non-condensing
    altitude: 0 to 3,000 m (10,000 ft) operating
  platform:
    cpu: Quad-Core x86
    memory: 16 GB
    storage: 16 GB flash
  features:
    optics-qsfp56: 200G and 100G with breakout, in the 24 QSFP56 cages (data sheet)
    optics-qsfp-dd: 400G, 200G, 100G and 40G with breakout, in the eight QSFP-DD cages (data sheet)
    optics-sfp-plus: 10G, in the two SFP+ cages (data sheet)
    eos-license: license group LIC-FIX-3; minimum EOS 4.30.2
  management:
    console: RJ-45 RS-232 serial on the rear, 9600 baud 8N1, no flow control
    oob: one 10/100/1000 management port on the rear
    usb: one USB port on the rear, for software or configuration updates
  compliance:
    emc: FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386
    safety: EN 62368-1, IEC 62368-1, CSA/UL 62368-1
    certifications: BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI, TEC, ANATEL, ICASA, NOM Equivalency (data sheet)
    rohs: RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)
  lifecycle: {eol: none-announced}
