configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis with two AC supplies and three fan modules fitted, front-to-rear air, before any part number: the shape every build below
      starts from.
  f:
    kind: orderable
    description: >-
      The 7050CX4-24D8 with two AC supplies and front-to-rear air: PWR-1011-AC-RED supplies and FAN-7011H-F fan modules, all with red handles.
      Ordered as DCS-7050CX4-24D8-F.
    part-numbers:
      DCS-7050CX4-24D8-F: {}
  r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7050CX4-24D8 with two AC supplies and rear-to-front air: PWR-1011-AC-BLUE supplies and FAN-7011H-R fan modules, all with blue handles. The
      data sheet's note 5 says this build requires derating to 35 C ambient. Ordered as DCS-7050CX4-24D8-R.
    bays:
      psu-1: arista/7280cr3-pwr-1000-ac-rev@1
      psu-2: arista/7280cr3-pwr-1000-ac-rev@1
      fan-1: arista/7280cr3-fan-rev@1
      fan-2: arista/7280cr3-fan-rev@1
      fan-3: arista/7280cr3-fan-rev@1
    part-numbers:
      DCS-7050CX4-24D8-R: {}
  dc-f:
    kind: example
    power: dc
    description: >-
      Two DC supplies and front-to-rear air: PWR-1011-DC-RED supplies and FAN-7011H-F fan modules. The data sheet lists no DC part number for the
      switch; the supplies are spares, and a DC build is ordered through the "#" configurable SKU.
    bays:
      psu-1: arista/7280cr3-pwr-1000-dc@1
      psu-2: arista/7280cr3-pwr-1000-dc@1
  dc-r:
    kind: example
    power: dc
    airflow: back-to-front
    description: >-
      Two DC supplies and rear-to-front air: PWR-1011-DC-BLUE supplies and FAN-7011H-R fan modules. No DC part number is listed for the switch.
    bays:
      psu-1: arista/7280cr3-pwr-1000-dc-rev@1
      psu-2: arista/7280cr3-pwr-1000-dc-rev@1
      fan-1: arista/7280cr3-fan-rev@1
      fan-2: arista/7280cr3-fan-rev@1
      fan-3: arista/7280cr3-fan-rev@1
