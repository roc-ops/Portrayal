description: >-
  Arista 7280CR3A-48D6 - a fixed 2RU data-centre router switch with 48 x 100G QSFP ports, 6 x 400G QSFP-DD
  ports and one OSFP line-system port, running EOS. The front carries the 100G cages in six blocks of two
  columns and four rows (three blocks at each end, two stacked pairs of rows each), with the six 400G cages
  in two rows of three between them. Each port has a status lamp. At the right are a Time-of-Day connector
  and two clock connectors above a block holding the RJ-45 Ethernet management port, the USB port and the
  RJ-45 serial console, four system lamps (system, fan, PS1, PS2) beside it, and the OSFP line-system port
  below it. The rear carries two hot-swap 1500 W power supplies one above the other at the right, four
  hot-swap fan modules, and a grounding strip between the first and second fan. The same panel is ordered
  with front-to-rear air (-F) or rear-to-front air (-R), as the 7280CR3A, the 7280CR3AM with TunnelSec
  encryption and the 7280CR3AK with large routes and TunnelSec.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7280R3A Series Quick Start Guide, Arista Networks, DOC-07042-01, 59 pages, PDF created 2025-05-16
      (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280R3A.pdf): Table 1 (dimensions and weights),
      Table 2 (operating and storage environment), Table 3 (power input), Table 4 (power draw and supported
      supplies), Table 6 (grounding of the 2RU switches), section 2.1 (airflow orientation, handle colour),
      section 4.5 (serial and management cables), Appendix A (status indicators, tables 9 to 13), Appendix D
      (rear panels, figures D-1 to D-4) and Appendix E (field replacement). The guide has NO FRONT FIGURE for
      this model: Appendix C draws only the DR3A-54 and DR3A-36. 7280R3A Series Data Center Switch Router
      Data Sheet, Arista Networks, 04-0040-26, dated April 15th, 2025
      (https://www.arista.com/assets/data/pdf/Datasheets/7280R3A-Datasheet.pdf): the model comparison of the
      7280CR3A-48D6, 7280CR3AM-48D6 and 7280CR3AK-48D6, the power supply specifications, the ordering
      information and the platform overview, whose one photograph of this face is the only front source.
      Held and checked first: intake COVERAGE.md, SOURCES.md (no 3D model, CAD drawing, studio photograph or
      Visio stencil is held; the stencil zip could not be fetched). No drawing or photograph is copied into
      the library, only transcribed facts and new drawings.
  gate-1-front:
    confidence: estimated
    note: >-
      THE FRONT IS DRAWN FROM THE DATA SHEET'S PHOTOGRAPH (page 6, "Arista 7280CR3A-48D6"), an embedded
      408 x 248 px raster whose chassis fills 406 px across (x 1 to 406) and 82 px down (y 83 to 164). It is a
      near-straight-on render. Gate 1: 406 px across 440.0 mm gives 0.923 px/mm; 82 px down 87.9 mm gives
      0.933 px/mm, one percent apart, so the face is near-orthographic and carries geometry. 0.928 px/mm is
      used on both axes, so one pixel is 1.08 mm and EVERY FRONT POSITION BELOW IS ESTIMATED to about 1 mm.
      The scale anchor is the 440.0 mm body (the data sheet's 43.99 cm over the handles) and its 87.9 mm height.
      The measure is a dark-run scan of the cage openings along x at the top rows and down the first column,
      read with a six-times enlargement beside it for the counts.
  gate-1-rear:
    confidence: estimated
    note: >-
      The guide draws the rear generically (D-1 to D-4) and does not say which model uses which. This model has
      four fan modules, two supplies and is 2RU. Of the 2RU pair, D-3 has an earth grounding pad and D-4 none;
      the guide's Table 6 lists the 7280CR3A-48D6 as "Attach directly - right angle lug recommended" (the
      grounding location "is on the back for those supporting direct attach"), so it is mapped to figure D-3, as
      the 7280DR3A-36 and the 7280CR3-96 are, at the positions those files read off the same figure. THE MAPPING
      IS ESTIMATED: it follows from fan count, height, supply count and Table 6, not from a caption.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 1: 48.3 x 8.8 x 68.4 cm (19 x 3.50 x 27.3 in), 22.0 kg (48.6 lbs), the same for the
      7280CR3A-48D6, 7280CR3AM-48D6 and 7280CR3AK-48D6. Data sheet: 43.99 x 8.79 x 68.38 cm "inc. handles"
      (17.3 x 3.46 x 27.31 in), 48.6 lbs (22.04 kg). The 48.3 cm is over the mounting ears, so the body between
      them, which is what is modelled, is the data sheet's 43.99 cm (440.0 here); the height is the data sheet's
      87.9 (the guide's 8.8 rounds it) and the depth its 683.8. 2RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's chapter 3 mounts the 2RU switch with the accessory-kit brackets in isometric
      drawings of other switches that carry no measure, and the kit guides are not held. The data sheet lists
      KIT-7201 and KIT-7004-2UL. No ear position is written and no rail kit is listed in chassis.kits.
  front-ports:
    confidence: estimated
    note: >-
      FORTY-EIGHT STACKED QSFP CAGES IN SIX BLOCKS, SIX QSFP-DD CAGES AND ONE OSFP CAGE, counted in a
      six-times enlargement of the photograph and confirmed by the data sheet ("48 x QSFP100, 6 x QSFP-DD",
      "OSFP-LS Ports 1"). A QSFP block is two columns of four rows (two stacked pairs of rows, a grey belly
      strip in each pair). The blocks' openings start at 19.4, 70.0 and 120.7 mm from the left and at 260.8,
      311.4 and 362.1 mm (a 50.65 mm block pitch, 35 px wide each, a pair of 19.0 mm columns with a
      12.65 mm gutter). The four rows' dark openings read 26.9 to 35.6, 42.0 to 50.6, 57.1 to 64.7 and 72.2 to
      80.8 mm (a uniform 15.1 mm pitch), so the registry's 18.5 x 9.58 cage is seated with its top 0.5 mm above each
      opening. The QSFP-DD block is three columns of two cages at 170.3, 200.4 and 230.6 mm (a 30.15 mm step,
      17 px wide) and rows centred 46.7 and 60.4 mm. The OSFP cage stands upright at the lower right,
      407.6 to 422.8 mm across and 60.3 to 84.7 mm down, which is a std/osfp@1 (23.1 x 13.5) turned a quarter.
      The belly-to-belly turn of each pair (upper cage upright, lower turned 180) is the library's convention;
      the photograph cannot show the latch side.
  port-numbering:
    confidence: estimated
    note: >-
      THE PHOTOGRAPH'S PORT NUMBERS ARE NOT LEGIBLE AND NO DOCUMENT HELD LISTS THEM, so no numeral is printed.
      The ids follow the library's other Arista boxes: the 48 QSFP cages are port-1 to port-48, the upper band of
      two rows first (left blocks 1 to 12, right blocks 13 to 24) and the lower band after (25 to 36 left,
      37 to 48 right), the odd number the upper cage of each column as the 7280CR3-96's guide figure prints it;
      the six QSFP-DD cages are port-49 to port-54, as the 7050CX4M-48D8 numbers its middle cages after the 100G
      ones; the OSFP cage is port-55. ESTIMATED; a photograph or figure of the numbered face closes it. EOS names
      ports Ethernet1 and up and Management1; they are not printed on the metal and are not modelled.
  port-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.2 and Table 10: port LEDs sit near their ports (off link down, green link up, yellow
      software disabled, flashing yellow failed diagnostics). The photograph shows a green dot at the side of
      every QSFP row, left of the left column and right of the right one of each block, so each QSFP port
      carries one lamp beside it; each QSFP-DD cage carries one (the left of an upper cage, the right of a
      lower one), and the OSFP has one on its green strip. Positions are read to a pixel.
  speed-strips:
    confidence: estimated
    note: >-
      The photograph draws lavender strips above each QSFP block's two pairs of rows (the first at 24.2 mm down, the
      second at 53.9 mm), orange strips between the QSFP-DD rows and a green strip at the right of the OSFP cage,
      with print too small to read. They are drawn in those colours at the block width; the print is not drawn.
  status-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.1, Table 9: system status, fan status and a status lamp for each supply, four in a
      column at the right of the management block at 427.4 mm across and 23.1, 26.4, 29.8 and 33.2 mm down. The
      glyphs beside them are not legible, so no legend is drawn.
  management-ports:
    confidence: estimated
    note: >-
      A block at the right, 407.6 to 424.4 mm across and 21.9 to 54.2 mm down, holds three stacked jacks: the
      Ethernet management port at the top (with its two lamps), the USB port and the serial console, the order of
      the DR3A-54's figure C-1 callouts 3 to 5. The jacks are seated at the library's sizes (RJ-45 15.8 x 13.2,
      USB 12.0 x 4.5) spread over the block; the photograph's openings read 10 and 8 mm tall, the dark inside of
      the jack. Guide section 4.5: "For most models, the front panel contains the console, management, and USB
      ports"; the data sheet: "100/1000 Mgmt Ports 1", "USB Ports 1", "RS-232 Serial Ports 1 (RJ-45)". The
      management port is taken as 10/100/1000 (guide 4.5) and so 1g.
  timing:
    confidence: estimated
    note: >-
      Above the management block, at 6.7 mm down: two gold coax jacks at 391.5 and 401.6 mm across (about 4.8 mm)
      and a horizontal Time-of-Day slot with a screw at each end from 407.6 to 424.0 mm. The data sheet's "PTP and
      SyncE with OCXO and PPS/10M/ToD inputs" and its accessory "CAB-SYNCE-RJ  Spare Time of Day adapter cable
      (USB-C to 2 x RJ-45)" name the functions and a USB-C mate, so the slot is seated as std/usb-c@1 and the jacks as
      std/smb@1 (4.83 mm, which the photograph's size matches; an SMA is 6.35). The coax type is not stated. A green
      lamp beside the slot is not named by any document and is not drawn.
  front-legend:
    confidence: estimated
    note: >-
      A light plate at the upper left, 0.3 to 34.0 mm across and 1.3 to 12.2 mm down, carries the maker's wordmark
      and the model line. THE WORDMARK IS NOT DRAWN: a logo-zone region is reserved. The model line is plain text and
      is set as "7280CR3A-48D6"; the photograph prints "7280CR3AK-48D6" because it is a picture of the K build, and
      the plain and M plates are not shown, so the same line is set on every configuration (gap model-plates).
  vents:
    confidence: estimated
    note: >-
      The photograph fills the spaces not taken by a cage with a dotted vent grid: a deep band along the top (1.0 to
      25.5 mm), a band along the bottom, a column in each gutter between the QSFP blocks, fields above and below the
      QSFP-DD block and a column at the left edge. Each is drawn as one field in its measured extent, not hole by
      hole. A round hole at the left edge (6.1 mm across, 48.0 mm down) is drawn as a dark hole and carries no part;
      nothing names it.
  rear:
    confidence: estimated
    note: >-
      Figure D-3 at the 7280DR3A-36 and 7280CR3-96 files' reading: four fan modules 79.6 mm wide and 81.5 mm tall at
      5.9, 103.9, 189.4 and 274.9 mm across, a grounding strip 15.0 mm wide at 87.2 mm between the first and second fan
      with two ground screws and an earth symbol, and two supplies one above the other at 361.0 mm across (2.0 and
      45.0 mm down, 73.5 mm wide, the data sheet's "73.5MM"). The guide's figure D-3 callout 7 names the "Earth
      grounding pad".
  rear-fan:
    confidence: datasheet
    note: >-
      Data sheet: "Hot-swappable Fans 4 (N+1 redundant)", "Fan Tray FAN-7012H", spares FAN-7012H-RED (front-to-rear)
      and FAN-7012H-BLUE (rear-to-front). Guide section 2.1: a red handle is an air-exit module and a blue one an
      air-inlet module. The four fan modules are bays that accept arista/7280dr3a-fan (FAN-7012H-RED) or
      arista/7050x4-fan-7012h-rev (FAN-7012H-BLUE), both reused by part number.
  fru-bays:
    confidence: datasheet
    note: >-
      Guide Appendix E: "All fans and power supplies are hot swappable" and "all slots must be filled or covered with a
      blank for operation". SO THE TWO POWER SUPPLIES AND THE FOUR FAN MODULES ARE BAYS. Nothing on this chassis is a
      built-in unit; the management ports are part of the chassis and are placements on the front. The held documents
      draw no blank for either bay, so none is modelled.
  power:
    confidence: datasheet
    note: >-
      Guide Table 4 reads "TBD" for the power draw of all three builds. The data sheet gives 388 W typical and 979 W
      maximum (typical "measured at 25C ambient with 50% load on all ports, excludes transceivers"), used here.
      Supplies: Table 4 and section 4.4 name PWR-1511-AC and PWR-1511-DC; the data sheet's model comparison names
      "PWR-1512-AC or PWR-1511-DC" and its ordering information PWR-1512-AC-RED and -BLUE and PWR-1511-DC-RED and
      -BLUE. The data sheet's PWR-1512-AC is used (the library's reading for the same 1500 W housing) and the
      disagreement is recorded in the gap psu-part-numbers.
  configurations:
    confidence: datasheet
    note: >-
      Data sheet ordering information: DCS-7280CR3A-48D6-F and -R, DCS-7280CR3AM-48D6-F and -R and
      DCS-7280CR3AK-48D6-F and -R, each "2 x AC", F for front to rear and R for rear to front air. The "#" orders
      ("configurable fans and psu") are orders of parts and are not listed. The A, M and K builds share the face, size,
      weight and supplies and differ in encryption and routes, which each M and K configuration states in its own
      attrs (the data sheet's "Encryption" row and its overview of the 7280R3AK; its power, memory, CPU, SSD,
      minimum EOS and licence group are one value for the three builds, so the device's stand). The data sheet
      lists no DC part number for the switch (the PWR-1511-DC-RED and -BLUE
      supplies are spares), so the DC builds are examples. No secure-boot (-S) build is listed for this family and the
      guide draws no blank for a bay, so no configuration shows an open bay.
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, altitude 0 to 3,000 m, humidity 5 to 90 percent
      non-condensing. Data sheet: operating 0 to 40 C, storage -40 to 70 C, humidity 5 to 90 percent, altitude 0 to
      3,000 m. Only the storage temperature differs; the guide's, the newer document, is in attrs.
  colour:
    confidence: estimated
    note: >-
      The front plate is #aaabad, the 7280CR3-32D4's reading of the same family's plate (the photograph's plate reads a
      similar light grey).
  lifecycle:
    confidence: estimated
    note: >-
      Searched 2026-10-24 for an end-of-sale notice for the 7280CR3A-48D6, 7280CR3AM-48D6 and 7280CR3AK-48D6: none found
      for this family (the notices found are for older 7280 models), so the field reads none-announced.
  other-faces:
    confidence: datasheet
    note: >-
      No source draws the top, bottom or sides flat. The guide's installation figures are isometric. Each carries an
      `empty` sentence. Table 6 puts the 2RU grounding on the back for this model.
attrs:
  physical:
    weight: 22.0 kg (48.6 lbs) for the 7280CR3A-48D6, 7280CR3AM-48D6 and 7280CR3AK-48D6 (guide Table 1); 48.6 lbs (22.04 kg) in the data sheet
    size-over-ears: 48.3 x 8.8 x 68.4 cm (19 x 3.50 x 27.3 in) with the mounting ears (guide Table 1)
  performance:
    throughput: 7.2 (14.4) Tbps
    packets-per-second: 2.7 Bpps
    latency: from 3.8 us
    packet-buffer: 8 GB
    max-400g-ports: 6
    max-100g-ports: 68
    max-50g-ports: 114
    max-40g-ports: 54
    max-25-10g-ports: 114
    max-total-interfaces: 116
  power:
    power-draw-typical-w: 388
    power-draw-max-w: 979
    power-draw-note: 'Data sheet: "388 W / 979 W", typical measured at 25 C ambient with 50 percent load on all ports, excluding transceivers. Guide Table 4 reads TBD.'
    psu-redundancy: 1+1
    input-ac: 200 - 240 VAC, 9.6 A (PWR-1512-AC), IEC 60320 C14
    input-dc: -48 to -60 VDC (PWR-1511-DC)
  thermal:
    airflow: front-to-rear or rear-to-front, set by the fan modules and supplies fitted
    fan-redundancy: 4 hot-swap fan modules, N+1
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -25 to 70 C (-13 to 158 F)
    storage-temp-datasheet: -40 to 70 C (-40 to 158 F), per the data sheet
    altitude: 0 to 3,000 m (0 to 10,000 ft)
    humidity: 5 to 90 percent, non-condensing
  platform:
    cpu: Eight-core x86
    system-memory: 64 GB
    ssd-storage: 120 GB
    software: EOS; minimum release 4.31.1 per the data sheet
    feature-license: EOS Feature Licenses Group 4
  features:
    optics-qsfp28: each of the 48 QSFP cages runs 100G, or 40G (QSFP+), 50G and 25/10G modes by breakout (data sheet)
    optics-qsfp-dd: each of the 6 QSFP-DD cages runs 400G, or 100G, 50G, 40G and 25/10G modes by breakout (data sheet)
    optics-osfp: the OSFP-LS port is "for dense 400G-ZR deployment"; the data sheet says the R3A platforms are "optimized to support high power 400ZR OSFP and QSFP-DD optical modules"
    precision-timing: PTP and SyncE with OCXO and PPS/10M/ToD inputs
    encryption: none on the 7280CR3A-48D6; all ports (MACsec, IPsec and VXLANsec) on the 7280CR3AM-48D6 and 7280CR3AK-48D6
  management:
    console: RJ-45 serial (RS-232), 9600 baud, 8 data bits, no parity, 1 stop bit, no flow control
    oob: 10/100/1000 Ethernet management port
  compliance:
    safety: EN 62368-1:2020+A11:2020, IEC 62368-1:2018, CSA/UL 62368-1:2019, AS/NZS 62368.1:2022
    emissions: FCC Class A, ICES-003 Issue 7, EN 55032:2015, VCCI-CISPR 32:2016, AS/NZS CISPR 32:2015
    regulatory-model-number: AN1782 (DCS-7280CR3A-48D6, DCS-7280CR3AM-48D6, DCS-7280CR3AK-48D6), guide Table 14
  lifecycle: {eol: none-announced}
