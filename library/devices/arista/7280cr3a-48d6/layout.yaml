configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis with two AC supplies and four fan modules fitted, front-to-rear air, before any part number: the shape every build
      below starts from.
  f:
    kind: orderable
    description: >-
      The 7280CR3A-48D6 with two AC supplies and front-to-rear air: PWR-1512-AC-RED supplies and FAN-7012H-RED fan modules, all with red
      handles. Ordered as DCS-7280CR3A-48D6-F.
    part-numbers:
      DCS-7280CR3A-48D6-F: {}
  r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280CR3A-48D6 with two AC supplies and rear-to-front air: PWR-1512-AC-BLUE supplies and FAN-7012H-BLUE fan modules, all with blue
      handles. Ordered as DCS-7280CR3A-48D6-R.
    bays:
      psu-1: arista/7050x4-pwr-1500-ac-rev@1
      psu-2: arista/7050x4-pwr-1500-ac-rev@1
      fan-1: arista/7050x4-fan-7012h-rev@1
      fan-2: arista/7050x4-fan-7012h-rev@1
      fan-3: arista/7050x4-fan-7012h-rev@1
      fan-4: arista/7050x4-fan-7012h-rev@1
    part-numbers:
      DCS-7280CR3A-48D6-R: {}
  m-f:
    kind: orderable
    description: >-
      The 7280CR3AM-48D6 with TunnelSec encryption, the same face, supplies and fans as the base switch, front-to-rear air. Ordered as
      DCS-7280CR3AM-48D6-F.
    export-description: >-
      Arista 7280CR3AM-48D6 - a fixed 2RU data-centre router switch with 48 x 100G QSFP ports, 6 x 400G QSFP-DD
      ports and one OSFP line-system port, TunnelSec encryption on all ports, running EOS
    attrs:
      features:
        encryption: all ports (MACsec, IPsec and VXLANsec, as TunnelSec)
    part-numbers:
      DCS-7280CR3AM-48D6-F: {}
  m-r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280CR3AM-48D6 with rear-to-front air. Ordered as DCS-7280CR3AM-48D6-R.
    export-description: >-
      Arista 7280CR3AM-48D6 - a fixed 2RU data-centre router switch with 48 x 100G QSFP ports, 6 x 400G QSFP-DD
      ports and one OSFP line-system port, TunnelSec encryption on all ports, running EOS
    attrs:
      features:
        encryption: all ports (MACsec, IPsec and VXLANsec, as TunnelSec)
    bays:
      psu-1: arista/7050x4-pwr-1500-ac-rev@1
      psu-2: arista/7050x4-pwr-1500-ac-rev@1
      fan-1: arista/7050x4-fan-7012h-rev@1
      fan-2: arista/7050x4-fan-7012h-rev@1
      fan-3: arista/7050x4-fan-7012h-rev@1
      fan-4: arista/7050x4-fan-7012h-rev@1
    part-numbers:
      DCS-7280CR3AM-48D6-R: {}
  k-f:
    kind: orderable
    description: >-
      The 7280CR3AK-48D6 with large routes and TunnelSec, the same face, supplies and fans as the base switch, front-to-rear air. Ordered
      as DCS-7280CR3AK-48D6-F.
    export-description: >-
      Arista 7280CR3AK-48D6 - a fixed 2RU data-centre router switch with 48 x 100G QSFP ports, 6 x 400G QSFP-DD
      ports and one OSFP line-system port, large routes and TunnelSec encryption, running EOS
    attrs:
      features:
        encryption: all ports (MACsec, IPsec and VXLANsec, as TunnelSec)
    part-numbers:
      DCS-7280CR3AK-48D6-F: {}
  k-r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280CR3AK-48D6 with rear-to-front air. Ordered as DCS-7280CR3AK-48D6-R.
    export-description: >-
      Arista 7280CR3AK-48D6 - a fixed 2RU data-centre router switch with 48 x 100G QSFP ports, 6 x 400G QSFP-DD
      ports and one OSFP line-system port, large routes and TunnelSec encryption, running EOS
    attrs:
      features:
        encryption: all ports (MACsec, IPsec and VXLANsec, as TunnelSec)
    bays:
      psu-1: arista/7050x4-pwr-1500-ac-rev@1
      psu-2: arista/7050x4-pwr-1500-ac-rev@1
      fan-1: arista/7050x4-fan-7012h-rev@1
