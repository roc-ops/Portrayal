gaps:
- what: front-from-photograph
  scope: [front]
  reason: needs-photo
  note: >-
    The guide has no front figure for this model and the data sheet's photograph is 408 px wide (0.93 px/mm), so every
    front position is read to about a millimetre. Legends, lamp glyphs, the speed-strip print and the port numbers are
    not legible in it.
  wanted: a flat figure or a studio photograph of the face.
- what: port-numbers
  scope: [front]
  reason: needs-photo
  note: >-
    The port numbers printed on the metal are not legible in the photograph and no held document lists them, so no numeral
    is printed and the port ids follow the library's other Arista boxes (provenance.port-numbering).
  wanted: a photograph or figure of the numbered face.
- what: model-plates
  scope: [front]
  reason: vendor-silent
  note: >-
    The photograph is a picture of the K build and prints "7280CR3AK-48D6". The plain and M plates are not shown, so every
    configuration prints "7280CR3A-48D6".
  wanted: a photograph of each plate.
- what: lamp-and-port-glyphs
  scope: [front]
  reason: needs-photo
  note: >-
    The glyphs beside the four system lamps, the legends of the Time-of-Day slot, the two clock jacks and the OSFP cage, and
    the symbols at the management jacks are not legible and are not drawn.
  wanted: a flat figure or a photograph of the right-hand end of the face.
- what: clock-connector-type
  scope: [front]
  reason: vendor-silent
  note: >-
    Neither the guide nor the data sheet names the clock connectors; they are seated as std/smb@1 from their drawn size and
    their direction (input or output) is not stated.
  wanted: the connector type.
- what: tod-connector-type
  scope: [front]
  reason: vendor-silent
  note: >-
    The Time-of-Day connector is seated as std/usb-c@1 because the data sheet's CAB-SYNCE-RJ names a USB-C mate.
  wanted: the connector type.
- what: usb-generation
  scope: [front]
  reason: vendor-silent
  note: >-
    Neither document gives the USB generation; the port is seated with the `usb2` skin as the one that claims least.
  wanted: the USB generation.
- what: osfp-turn
  scope: [front]
  reason: needs-photo
  note: >-
    The OSFP cage stands on its end and is turned 90; which way its latch faces is not resolved at 0.93 px/mm.
  wanted: a photograph that shows the cage lip.
- what: environment
  scope: [front, rear]
  reason: sources-disagree
  note: >-
    Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet). The guide's, the newer document, is in attrs.
  wanted: the maker's statement of which is current.
- what: psu-part-numbers
  scope: [rear]
  reason: sources-disagree
  note: >-
    The guide's Table 4 and section 4.4.1 name PWR-1511-AC as this model's supply; the data sheet's model comparison and
    ordering information name PWR-1512-AC (the -RED and -BLUE spares are PWR-1512-AC-RED and -BLUE). The data sheet's is used,
    because it is the one with orderable part numbers; both name PWR-1511-DC.
  wanted: the maker's statement of which AC supply ships.
- what: rack-ears
  scope: [front]
  reason: needs-drawing
  note: >-
    The guide's chapter 3 figures are isometric drawings of other switches and carry no measure, and the kit guides for KIT-7201
    and KIT-7004-2UL are not held, so no ear position or rail kit is written.
  wanted: a dimensioned drawing of the mounting bracket position, and the kit guides.
- what: psu-dc-face
  scope: [rear]
  reason: needs-drawing
  note: >-
    The PWR-1511-DC supplies are the library's existing drawing of that module, an AC housing with a plain terminal block; the
    guide shows a DC supply only in isometric figures.
  wanted: a flat drawing or photograph of the PWR-1511-DC.
- what: module-power
  scope: [rear]
  reason: vendor-silent
  note: >-
    The guide's power tables and the data sheet give whole-switch figures only; the fan modules' missing power figure (lint L27)
    stands. The supplies state their output.
  wanted: FAN-7012H power draw.
