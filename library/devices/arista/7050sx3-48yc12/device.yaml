name: 7050sx3-48yc12
version: 0.1.0
maturity: modelled
manufacturer: Arista
model: 7050SX3-48YC12
aliases:
- {name: DCS-7050SX3-48YC12, kind: marketing}
portfolio: {line: 7000 Series, family: 7050X3}
description: >-
  Arista 7050SX3-48YC12 - a fixed 1RU data-centre switch with 48 x 1/10/25G SFP ports and 12 x 100G QSFP
  ports, running EOS. The front carries the SFP cages in four groups of two columns at each end, each
  group two stacked rows of cages (the odd number on top) with a third row of two cages under it, and
  the twelve QSFP cages in two stacked rows of six columns in the middle. Four system lamps (system, fan,
  PS1, PS2) are at the far right. The rear carries two hot-swap 500 W power supplies at the ends and four
  hot-swap fan modules, with the RJ-45 management port, the USB port and the RJ-45 console port between
  the left supply and the first fan. The data sheet orders the panel with front-to-rear air (-F).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7050 Series 1RU (Gen 3) Quick Start Guide, Arista Networks, document DOC-00141-08, 57 pages, copyright
      2025, PDF created 2025-08-19 (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7050_1RU_Gen3.pdf):
      Table 1 (dimensions and weights), Table 2 (operating and storage), Table 3 (power input), Table
      4 (power draw and supported supplies), section 2.1 (airflow orientation, handle colour), section
      4.1 and Table 5 (grounding), section C.1 (port-speed groups), Appendix C (Figure C-14, the front
      panel of the DCS-7050SX3-48YC12), Appendix D (Figure D-2, the rear panel with management ports in
      the rear), Appendix E (field replacement). 7050X3 Series 10/25/40/50/100G Data Center Switches Data
      Sheet, Arista Networks, 03-0040-46 (https://www.arista.com/assets/data/pdf/Datasheets/7050X3-Datasheet.pdf):
      the model comparison, the power supply specifications and the ordering information. Held and checked
      first: intake COVERAGE.md and SOURCES.md, which list no photograph, 3D model or CAD file for this
      model (Arista publishes none; a `find` of the intake folder for 3D files found none) and a Visio
      stencil master that was not used. No drawing, photograph or logo is copied into the library, only
      transcribed facts and new drawings.
  gate-1-front:
    confidence: estimated
    note: >-
      Figure C-14 passes. The raster is 576 x 141 pixels; the body between its plate edges measures 571
      px wide and 55 px tall (aspect 10.4) against the data sheet's 440 / 43.7 = 10.07, so the figure
      is near-orthographic along its width and carries geometry at 1.298 px/mm (the 440 mm body is the
      scale anchor); it reads about 3 percent tall, so the rows are the less sure axis. One pixel is 0.77
      mm, so every position is good to about 1 mm along the face and 1.5 mm down it, and every one is
      `estimated` because it is read off a picture and no dimension states it. The cages were read from
      the white port-number tabs in a three-times enlargement.
  gate-1-rear:
    confidence: estimated
    note: >-
      Figure D-2 is a 552 x 115 px raster whose chassis is 549 px between its edges (1.248 px/mm over
      the 440 mm body); positions are good to about 1 mm. The guide draws the rear generically (D-1 to
      D-4) and does not say which model uses which. The 7050SX3-48YC12 is mapped to D-2 by its four fan
      modules (data sheet: "Hot-swappable Fans 4 (N+1 redundant)"), its 1RU height, its two supplies and
      its management ports at the rear (Figure C-14 draws none at the front). The data sheet (PDF page
      3) captions a rear photograph for the 7050SX3-48YC12, a supply, the management block, four fan modules
      and a supply, which agrees; the guide does not name the figure, so THE MAPPING IS ESTIMATED.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 1: 48.3 x 4.4 x 44.4 cm (19 x 1.75 x 17.5 inches), 9.2 kg (20.3 lbs). Data sheet: 44
      x 4.4 x 44.6 cm, 20.3 lbs (9.22 kg). The width: 48.3 cm is over the mounting ears, so the body between
      them, which is what is modelled, is the data sheet's 44 cm (440.0 here). The height is 43.7, as
      the library's other 7050 devices. The depth is the guide's 44.4 cm (444.0), which agrees with the
      guide's 17.5 inches; the data sheet's 44.6 cm is 2 mm more: the gap `depth`. The weights agree (9.2
      kg and 9.22 kg). 1RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's Chapter 3 mounts the switch with the accessory-kit brackets and shows
      them in isometric drawings that carry no measure, and the kit guides are not held. Recorded in the
      gap rack-ears.
  front-ports:
    confidence: estimated
    note: >-
      Figure C-14 at 1.298 px/mm. Forty-eight SFP cages in three rows. Rows one and two (the odd number
      on top, ports 1 to 32) are four groups of two columns at each end of the face: the yellow group
      outlines start 6.9, 40.3, 73.7 and 107.1 mm across at the left and 291.8, 325.2, 358.6 and 392.0
      mm at the right, a 33.4 mm step, and the first cage of each group is 9.0 mm inside the outline's
      edge, so the cages stand on the registry's 14.25 mm ganged-SFP pitch with a 4.9 mm gap between groups.
      The third row (ports 33 to 48) puts two cages under each group in the same columns. The rows read
      centred 11.8, 24.1 and 37.0 mm down, so the cages are 6.6, 18.9 and 31.8 mm from the top. Twelve
      QSFP100 cages in two stacked rows of six columns (49 to 60) in three groups of two, the first columns
      reading 156.4, 201.2 and 252.0 mm across (the groups are not evenly spaced in the figure: a grey
      vent column stands between the first and second), on the registry's 19.0 mm pitch inside a group;
      the rows read centred 12.4 and 25.5 mm down. The belly-to-belly orientation is the library's convention
      (upper cage upright, lower turned 180; the third row upright); the figure is too small to show the
      latch side.
  port-numbering:
    confidence: estimated
    note: >-
      Figure C-14 (callout 5, "Port numbers") prints 1 over 2, 3 over 4 across the first four groups and
      17 over 18 across the last four, with 33 and 34 under the first group and so on to 40, and 41 to
      48 under the last four; the QSFP cages are 49 over 50 to 59 over 60. The odd number is the upper
      cage. The figure prints each number on a white tab over its cage; a seated cage hides what is painted
      under it, so the numerals are set in the band between the rows (the odd number left of its column
      centre and the even one right of it; the third row's in the band above it). EOS interface names
      are not printed on the metal and are not modelled.
  port-speed-groups:
    confidence: datasheet
    note: >-
      Guide section C.1 and Figure C-14 (callout 6, "Port-speed group"): the SFP cages are grouped, and
      the data sheet says "the high density SFP ports can be configured in groups of 4 to run either at
      25G or a mix of 10G/1G speeds". The figure outlines each group of four (two columns of two rows)
      in yellow; the outlines are not drawn and the speed of each port is modelled at the highest native
      rate, 25G.
  port-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.2 gives the port lamp states of the family. Figure C-14 draws small lamps at
      the corner of each cage that cannot be placed or counted at 1.3 px/mm. No port lamp is modelled
      (gap `port-lamps`).
  status-lamps:
    confidence: estimated
    note: >-
      Figure C-14 callouts 1 to 4: a system status lamp, a fan status lamp and a status lamp for each
      of the two power supplies, four lamps in a column at the far right, 427.5 mm across and 4.0, 7.2,
      10.4 and 13.6 mm down; the order (system, fan, PS1, PS2) is the callout order of the figure.
  speed-strips:
    confidence: estimated
    note: >-
      Figure C-14 draws a cyan band between the second and third rows under each end block and a lavender
      band under the QSFP block, with tiny legends. The bands are drawn in those colours at 29.5 and 31.0
      mm down; the legends are unreadable and are not drawn.
  front-legend:
    confidence: estimated
    note: >-
      The figure prints the maker's wordmark and the model line up the left plate. THE WORDMARK IS NOT
      DRAWN: a logo-zone region is reserved over it and the plain model text is set.
  vents:
    confidence: estimated
    note: >-
      The figure shows a perforated grey field under and around the QSFP block (about 34 to 43 mm down,
      142 to 295 mm across) and a perforated column on each side of it. Only the lower field is drawn,
      in its measured extent, not hole by hole.
  colour:
    confidence: estimated
    note: >-
      The front plate is the median of the grey pixels (neither black nor white, low saturation) of the
      guide's figure C-14, #737373. The figure is a raster and its lighting is not known, so the shade
      is estimated.
  rear:
    confidence: estimated
    note: >-
      Figure D-2 at 1.248 px/mm, the rear seen from behind with x = 0 at the left of the drawing. PS1
      is the left and PS2 the right. Each supply reads about 88 mm wide in the figure (taken as arista/7050x3-pwr-500-ac's
      86.5 mm) at 4.0 and 346.0 mm across and 1.85 mm down, an inlet at the left and a fan guard with
      a red diagonal handle at the right. The management block is a grey plate 94.5 to 116.0 mm across
      with the Ethernet management port, the USB port and the RJ-45 console port stacked in it. Four fan
      modules with the grilles starting 117.3, 175.3, 229.1 and 286.5 mm across, taken as a 56.4 mm pitch
      from 117.3 mm (each a grille, a red handle and a label tab), at 2.55 mm down.
  rear-fan:
    confidence: datasheet
    note: >-
      Data sheet: "Hot-swappable Fans 4 (N+1 redundant)", "Fan Tray FAN-7000H-F" and the spare FAN-7000H-F
      (front-to-rear). The four fan modules are bays that accept FAN-7000H-F, the same component as arista/7050cx3-32s
      seats (one maker part number, one component).
  fru-bays:
    confidence: datasheet
    note: >-
      Guide Appendix E (E.2 power supplies, E.3 fan modules) and the data sheet ("1+1 hot-swappable power
      supplies and four N+1 hot-swap fans"): THE TWO POWER SUPPLIES AND THE FOUR FAN MODULES ARE BAYS.
      Nothing on this chassis is a built-in unit. The management block, the USB port and the console port
      are part of the chassis and are placements.
  power:
    confidence: datasheet
    note: >-
      Guide Table 4: typical / maximum 170 W / 325 W with PWR-500AC or PWR-500-DC. The data sheet prints
      the same, 170W / 325W ("measured at 25C ambient with 50% load on all ports, excludes transceivers"):
      the documents agree and there is no conflict.
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, altitude 0 to 3,000 m, humidity 5 to 90
      percent non-condensing. Data sheet: storage -40 to 70 C. The storage temperature differs: gap `environment`,
      the guide's used.
  configurations:
    confidence: datasheet
    note: >-
      Data sheet ordering information: DCS-7050SX3-48YC12-F ("front-to-rear air, 2xAC") and the "#" SKU
      ("configurable fans and psu"); there is no -R SKU. The "#" SKU is an order of parts, not a part
      number a DCIM can hold. The data sheet lists no DC build of the switch: the PWR-500-DC-F supply
      is a spare, so the DC configuration is an example with no part number.
  interface-names:
    confidence: datasheet
    note: >-
      Not printed and not modelled. EOS names ports Ethernet1 to Ethernet60 and Management1; this is the
      vendor's convention and no held document prints it.
  lifecycle:
    confidence: estimated
    note: >-
      Searched the held documents (the guide and the data sheet) for an end-of-sale or end-of-life notice
      for the 7050SX3-48YC12: none. No web search was made, so this is a statement about those documents
      only.
  other-faces:
    confidence: datasheet
    note: >-
      No source draws the top, bottom or sides flat. The guide's installation figures are isometric. Each
      carries an `empty` sentence. The guide's Table 5 says "Attach ground directly to back" for this
      model (Figures 4-1 and 4-2, the earth grounding pad on the rear); no figure measures it.
attrs:
  physical:
    weight: 9.2 kg (20.3 lbs) (guide Table 1); the data sheet says 20.3 lbs (9.22 kg)
    size-over-ears: 48.3 x 4.4 x 44.4 cm (19 x 1.75 x 17.5 in) with the mounting ears (guide Table 1)
  performance:
    throughput: 2.4 (4.8) Tbps
    packets-per-second: 2 Bpps
    latency: from 800 ns
    packet-buffer: 32 MB (dynamic buffer allocation)
    ports-max-speed: >-
      12 ports of 100 Gbps; 24 of 50 Gbps; 12 of 40 Gbps; 96 of 25 Gbps; 96 of 10 Gbps; 48 of 1 Gbps
    interfaces-max: 96
  power:
    power-typical-w: 170
    power-max-w: 325
    power-envelope: as-tested
    power-measure: >-
      guide Table 4 typical and maximum, which the data sheet repeats; typical measured at 25 C ambient
      with 50 percent load on all ports, excluding transceivers (data sheet)
    psu-redundancy: 1+1
    input-ac: 100 - 240 VAC, 6.5 to 3.0 A (PWR-500AC), IEC 60320 C14
    input-dc: -48 to -60 VDC, 15 A (PWR-500-DC)
    efficiency: 93 percent (Platinum) AC, 90 percent DC (data sheet)
  thermal: {airflow: 'front-to-rear, with the fan modules and supplies fitted', fan-redundancy: '4 hot-swap
      fan modules, N+1'}
  environmental: {operating-temp: 0 to 40 C (32 to 104 F), storage-temp: -25 to 70 C (guide Table 2);
      the data sheet says -40 to 70 C, humidity: 5 to 90 percent non-condensing, altitude: '0 to 3,000
      m (10,000 ft) operating'}
  platform: {cpu: Quad-Core x86, memory: 8 GB, storage: 8 GB flash}
  features:
    optics-sfp28: 25G, 10G and 1G, in groups of four, in the 48 SFP cages (data sheet, "SFP25")
    optics-qsfp28: 100G, 50G, 40G, 25G and 10G with breakout, in the twelve QSFP cages (data sheet)
    eos-license: license group LIC-FIX-2; minimum EOS 4.20.5
  management: {console: RJ-45 RS-232 serial on the rear, oob: one 10/100/1000 management port on the rear,
    usb: one USB port on the rear}
  compliance:
    emc: >-
      FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386
    safety: EN 62368-1, IEC 62368-1, CSA/UL 62368-1
    certifications: BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI, TEC, ANATEL, ICASA, NOM Equivalency (data sheet)
    rohs: RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)
  lifecycle: {eol: none-announced}
