gaps:
  - what: depth
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      Guide Table 1 gives a depth of 44.4 cm (17.5 in) and the data sheet 44.6 cm. The guide's is modelled; the difference is 2 mm.
    wanted: the maker's statement of which is current.
  - what: environment
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet). The guide's is in attrs.
    wanted: the maker's statement of which is current.
  - what: rear-mapping
    scope: [rear]
    reason: vendor-silent
    note: >-
      The guide draws four generic rear panels (Figures D-1 to D-4) and does not say which model uses which. The 7050SX3-48YC12 is mapped to D-2 by its four fans (data
      sheet), its two supplies and its rear management ports. The data sheet's "Rear View" photograph (PDF page 3) shows the same shape but is
      a thumbnail.
    wanted: the maker's statement of the rear panel of the 7050SX3-48YC12.
  - what: rack-ears
    scope: [front]
    reason: needs-drawing
    note: >-
      The guide's Figures 3-1 to 3-14 are isometric drawings with no measure and the kit guides for KIT-7001, KIT-7101 and the other spares are not held, so no ear position
      or rail kit is written.
    wanted: a dimensioned drawing of the mounting bracket position, and the kit guides.
  - what: port-lamps
    scope: [front]
    reason: needs-photo
    note: >-
      Figure C-14 is too small to resolve any per-port lamp, so none is modelled and the port lamp states of guide Appendix A.1.2 are not attached to a port.
    wanted: a photograph of the lit face.
  - what: front-legends
    scope: [front]
    reason: needs-photo
    note: >-
      The speed bands' legends, the small print over the cages, the yellow port-speed group outlines, the lamp glyphs and the model line are unreadable or barely readable in
      the 576 px figure. The model text is set; the rest is not drawn.
    wanted: a photograph of the face.
  - what: cage-orientation
    scope: [front]
    reason: needs-photo
    note: >-
      Which side the latches of the stacked cages face, and whether the third row is upright, is not visible in the figure. The library's belly-to-belly convention is used for the
      first two rows and the third row is upright.
    wanted: a photograph of the cages.
  - what: rear-mgmt-block
    scope: [rear]
    reason: needs-photo
    note: >-
      The management block's console symbol is drawn as the 7280SR3-48YC8 draws it; the figure resolves the block only as three stacked ports.
    wanted: a photograph of the rear management block.
  - what: airflow-reverse
    scope: [rear]
    reason: needs-drawing
    note: >-
      The data sheet spares list PWR-500AC-R, PWR-500-DC-R and FAN-7000H-R; the data sheet's ordering information lists only a -F build of this model. The guide draws red
      handles only, so the blue reverse parts are not modelled.
    wanted: a picture of the reverse-airflow supply and fan module.
  - what: psu-faces
    scope: [rear]
    reason: needs-drawing
    note: >-
      The guide's Figure D-2 draws one generic supply (the AC one, an inlet and a fan guard with a red handle). The PWR-500-DC is the AC housing with a plain two-pole terminal
      block; the guide shows a DC supply only in isometric figures.
    wanted: a flat drawing or photograph of the PWR-500AC and PWR-500-DC.
  - what: module-power
    scope: [rear]
    reason: vendor-silent
    note: >-
      The guide's power tables and the data sheet give whole-switch figures only; the fan modules' missing power figure (lint L27) stands. The supplies state their output.
    wanted: FAN-7000H power draw.
  - what: grounding
    scope: [rear]
    reason: needs-drawing
    note: >-
      Guide Table 5 says "Attach ground directly to back" and Figures 4-1 and 4-2 show an earth grounding pad on the rear, and callout 9 of Figure D-2 names it; the pad is not
      drawn flat anywhere, so none is placed.
    wanted: a flat drawing of the rear with the grounding pad.
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
    description: >-
      The 48 SFP ports (1, 10 and 25G, in groups of four), numbered 1 to 48 as printed; the odd numbers of 1 to 32 are the upper cages and 33 to 48 the third row
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      The twelve 100G QSFP ports, numbered 49 to 60 as printed; the odd numbers are the upper cages
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system, fan and two power supply lamps at the far right of the front
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      how the switch is reached out of band - the 10/100/1000 management port, the USB port and the RS-232
      console port, stacked in one block at the left of the rear panel
  psu-bays:
    term: Bay
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Data sheet: "Hot-swap Power 2 (1+1 redundant)". Guide section 4.3: at least one supply must connect to a power source
    description: the two hot-swap power supplies, 1+1 redundant
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: n+1
      redundancy-note: >-
        Data sheet: "Hot-swappable Fans 4 (N+1 redundant)"
    description: the four hot-swap fan modules
