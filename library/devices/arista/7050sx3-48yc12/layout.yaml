configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis with two AC supplies and four fan modules fitted, front-to-rear air, before any part number: the shape every build
      below starts from.
  f:
    kind: orderable
    description: >-
      The 7050SX3-48YC12 with two AC supplies and front-to-rear air: PWR-500AC-F supplies and FAN-7000H-F fan modules, all with red handles.
      Ordered as DCS-7050SX3-48YC12-F.
    part-numbers:
      DCS-7050SX3-48YC12-F: {}
  dc-f:
    kind: example
    power: dc
    description: >-
      Two DC supplies and front-to-rear air: PWR-500-DC-F supplies and FAN-7000H-F fan modules. The data sheet lists no DC part number for the
      7050SX3-48YC12; the supply is a spare, and a DC build is ordered through the "#" configurable SKU.
    bays:
      psu-1: arista/7050x3-pwr-500-dc@1
      psu-2: arista/7050x3-pwr-500-dc@1
