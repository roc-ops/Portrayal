gaps:
  - what: port-lamps
    scope: [front]
    reason: needs-photo
    note: >-
      Table 10 describes a port LED and Figure C-7's callout 9 points at the lower lip, but the 848 px figure resolves no lamp beside the 48 QSFP28 cages. None is drawn.
    wanted: a photograph of the lit face.
  - what: environment
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet). The guide's is in attrs.
    wanted: the maker's statement of which is current.
  - what: psu-part-name
    scope: [rear]
    reason: sources-disagree
    note: >-
      The guide's Table 3 and Table 4 name PWR-1512-AC; its section 4.4.1 and Table 12 name PWR-1511-AC. The data sheet lists PWR-1512-AC-RED/BLUE and PWR-1511-DC-RED/BLUE only. PWR-1512-AC
      is written.
    wanted: the maker's statement of which is current.
  - what: rack-ears
    scope: [front]
    reason: needs-drawing
    note: >-
      The guide's Figures 3-9 to 3-17 are isometric drawings with no measure and the kit guides for KIT-7201, KIT-7202 and the other spares are not held, so no ear position or rail kit is
      written.
    wanted: a dimensioned drawing of the mounting bracket position, and the kit guides.
  - what: front-legends
    scope: [front]
    reason: needs-photo
    note: >-
      The strips' legends, the small print of the face, the system and fan lamp glyphs and the PS1 and PS2 legends are unreadable in the 848 px figure. The glyphs and the two PS legends are drawn
      as read; the rest is not drawn.
    wanted: a photograph of the face.
  - what: cage-orientation
    scope: [front]
    reason: needs-photo
    note: >-
      Which side the latches of the stacked cages face is not visible in the figure. The library's belly-to-belly convention is used (upper cage upright, lower turned 180).
    wanted: a photograph of the stacked cages.
  - what: front-mgmt-block
    scope: [front]
    reason: needs-photo
    note: >-
      The management block's three jacks are drawn at the registry's sizes, which fill the framed block; the figure draws them smaller, and the lamps on the management jack are the library's single
      Ethernet jack's.
    wanted: a photograph of the management block.
  - what: psu-dc-face
    scope: [rear]
    reason: needs-drawing
    note: >-
      The PWR-1511-DC supplies are drawn as the AC supply's housing with a plain two-pole terminal block; the real terminal arrangement is not drawn.
    wanted: a flat drawing or photograph of the PWR-1511-DC.
  - what: module-power
    scope: [rear]
    reason: vendor-silent
    note: >-
      The guide's power tables and the data sheet give whole-switch figures only; the fan modules' missing power figure (lint L27) stands.
    wanted: FAN-7012H power draw.
  - what: rear-earth-pad
    scope: [rear]
    reason: needs-photo
    note: >-
      Figure D-2 draws the earth grounding pad as a grey strip with two black holes, an earth symbol between them, and printed symbols below (a warning triangle and others) that the 565 px figure does not
      resolve. The two holes and the earth symbol are drawn; the rest is not.
    wanted: a photograph of the rear grounding pad.
groups:
  qsfp28-100g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      The 48 100G QSFP28 ports, numbered 1 to 48 as printed; the odd numbers are the upper cage of each pair of rows
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
    description: >-
      The eight 400G QSFP-DD ports, numbered 49 to 56 as printed; the odd numbers are the upper cages
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      The two SFP+ ports, numbered 57 and 58 as printed; 57 is the upper cage
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: a status lamp for each QSFP-DD and SFP+ port, beside its cage
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system, fan and two power supply lamps right of the management block
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      how the switch is reached out of band - the 10/100/1000 management port, the USB port and the RS-232
      console port, stacked in one block at the top right of the front panel
  grounding:
    term: Point
    role: furniture
    index-origin: 1
    description: the earth grounding pad on the rear
  psu-bays:
    term: Bay
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Data sheet: "Hot-swap Power 2 (1+1 redundant)". Guide section 4.4: at least one supply must connect to a power source
    description: the two hot-swap power supplies, 1+1 redundant, stacked at the right of the rear
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: n+1
      redundancy-note: >-
        Data sheet: "Hot-swappable Fans 4 (N+1 redundant)"
    description: the four hot-swap fan modules
