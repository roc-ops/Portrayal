format: 1
kind: device
name: 7050cx4m-48d8
version: 1.0.0
maturity: modelled
manufacturer: Arista
model: 7050CX4M-48D8
portfolio: {line: 7000 Series, family: 7050X4}
description: >-
  Arista 7050CX4M-48D8 - a fixed 2RU data-centre switch with 48 x 100G QSFP28 ports, 8 x 400G QSFP-DD ports and 2 x SFP+ ports,
  with MACsec, running EOS. The front carries the QSFP28 cages in four rows of twelve columns, in two halves of two rows with a
  grille between them, three blocks of two columns (six columns) on each side. The eight QSFP-DD cages are four stacked columns between the left
  and right QSFP28 blocks. The two SFP+ cages are stacked at the right, under the management block, which holds the RJ-45
  management port, the USB port and the RJ-45 console port, with the four system lamps (system, fan, PS1, PS2) beside it. The rear
  carries two hot-swap power supplies stacked at the right, four hot-swap fan modules, and an earth grounding pad. The same panel is
  ordered with front-to-rear air (-F) or rear-to-front air (-R).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7050X4 Series Quick Start Guide, Arista Networks, document DOC-06569-02, 51 pages, copyright 2025, PDF created 2025-04-28
      (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7050X4.pdf): Table 1 (dimensions and weights), Table 2 (operating and
      storage), Table 3 (power input), Table 4 (power draw and supported supplies), section 4.3 and Table 6 (the 2RU grounding), section 4.5
      and Figure 4-8 (serial and management ports), Appendix A (status indicators, Tables 9 to 13), Appendix C (Figure C-7, the front panel
      of the DCS-7050CX4M-48D8, with callouts 2 to 4 for its management, USB and console ports), Appendix D (Figure D-2, the rear panel with
      a ground attach point (2RU)), Appendix E (field replacement). 7050X4 Series 100/200/400G Data Center Switches Data Sheet, Arista
      Networks, 03-0057-27, dated Aug 27th, 2025 (https://www.arista.com/assets/data/pdf/Datasheets/7050X4-Datasheet.pdf): the model comparison,
      the power supply specifications, the environmental characteristics and the ordering information, and a "7050X4 2RU Rear View"
      photograph. Held and checked first: intake COVERAGE.md and SOURCES.md, which list no photograph, Visio stencil, 3D model or CAD file
      for this model (Arista publishes none; the stencil zip could not be fetched). No drawing, photograph or logo is copied into the
      library, only transcribed facts and new drawings.
  gate-1-front:
    confidence: estimated
    note: >-
      Figure C-7 passes at 0.5 percent. The raster is 848 x 317 pixels. The body between its plate edges measures 828 px wide and 166 px tall
      (aspect 4.99), against the data sheet's 439.9 / 87.9 = 5.00, so the figure is near-orthographic and carries geometry at 1.882 px/mm (the
      440 mm body is the scale anchor). One pixel is 0.53 mm, so every front position is good to about 0.5 mm, and every one is `estimated`
      because it is read off a picture and no dimension states it. The cage columns were read from the white port-number tabs by their centres.
  gate-1-rear:
    confidence: estimated
    note: >-
      Figure D-2 passes within 2 mm: the raster is 565 px wide, the chassis 525 px between its edges (1.193 px/mm over the 440 mm body) and 104 px
      tall (87.2 mm against 87.9). The positions below are the same as arista/7280dr3a-36's, whose guide draws the same four-fan 2RU rear at the
      same 1.193 px/mm, and agree with this figure to within two millimetres. The guide draws the rear generically (D-1 and D-2) and does not say
      which model uses which. The 7050CX4M-48D8 is mapped to D-2 by its four fan modules (data sheet: "Hot-swappable Fans 4 (N+1 redundant)"),
      its 2RU height and its two stacked power supplies, and the figure's "Earth grounding pad" matches guide Table 6 (attach directly at the rear).
      THE MAPPING IS ESTIMATED.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 1: 48.3 x 8.8 x 66.8 cm (19 x 3.50 x 26.3 inches), 16.0 kg (35.1 lbs). Data sheet: 43.99 x 8.79 x 66.8 cm (17.3 x 3.46 x 26.30 in),
      35.1 lbs (16.0 kg). The width: 48.3 cm is over the mounting ears, so the body between them, which is what is modelled, is the data sheet's
      43.99 cm (440.0 here). The height is the data sheet's 87.9 (the guide rounds it to 8.8 cm). The depth is the guide's 66.8 cm (668.0), the data
      sheet's figure too. 2RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's Chapter 3 mounts the 2RU switch with the KIT-7201 or KIT-7202 brackets in Figures 3-9 to 3-17, isometric drawings that
      carry no measure; the guide's Appendix B lists the kits KIT-7201 and KIT-7202 and the ground kit KIT-GND-EXT-2RU, and the data sheet the spare KIT-7201. No figure measures a bracket position
      and the kit guides are not held, so no ear position is written and no rail kit is listed in chassis.kits. Recorded in the gap rack-ears.
  front-ports:
    confidence: estimated
    note: >-
      Figure C-7 at 1.882 px/mm anchored on the 440 mm body, tab centres from a pixel scan. Forty-eight QSFP28 cages (ports 1 to 48) in four rows and
      twelve columns: two rows above the QSFP-DD zone's middle and two below, each pair of rows with a grille between, in blocks of two columns on a
      19.0 mm pitch (the registry's ganged QSFP pitch) with 9.7 mm more between blocks, three blocks of two columns (six columns) across each half row. The first column is centred
      21.3 mm from the left and the seventh 277.9 mm; the block spacing is 47.7 mm. The rows centre 31.6, 47.6, 61.2 and 76.8 mm below the top. Ports 1
      to 24 are the upper pair of rows, odd numbers on top, 25 to 48 the lower; the left six columns hold ports 1 to 12 and 25 to 36 and the right six 13
      to 24 and 37 to 48. Eight QSFP-DD cages (49 to 56) in four stacked columns, the first centred 165.0 mm from the left on a 27.9 mm pitch, rows 47.6 and
      61.2 mm below the top; they are 19.0 x 10.0 mm (std/qsfp-dd). Two SFP+ cages (57 over 58) at the right, centred 418.9 mm from the left, 61.4 and
      76.3 mm down. The belly-to-belly orientation is the library's convention (upper cage upright, lower turned 180); the figure is too small to show
      the latch side.
  port-numbering:
    confidence: estimated
    note: >-
      Figure C-7 (callout 1, "Port numbers") prints 1 over 2, 3 over 4, and so on across the upper pair of rows, 1 to 24, then 25 over 26 and so on across
      the lower, 25 to 48, then 49 over 50 to 55 over 56 in the QSFP-DD columns and 57 over 58 for the SFP+ cages. The odd number is the upper cage of each
      pair. The figure prints each number on a white tab over its cage and, smaller, in the coloured strip above each pair of rows, an up arrow after an odd number
      and a down arrow after an even one. The QSFP28 numerals are set in the strip; the QSFP-DD and SFP+ numerals in blue beside the cage. EOS interface names are
      not printed on the metal and are not modelled.
  port-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.2, Table 10: off the link is down, green link up, yellow software disabled, flashing yellow failed diagnostics. Figure C-7's callout 9
      "Port status LED" points at the ribbed strip along the lower lip and at the strip legends, and resolves no lamp beside the 48 QSFP28 cages. NO QSFP28 PORT LAMP IS
      DRAWN (the gap `port-lamps`). The QSFP-DD cages show a small dark mark at the lower left of an upper cage and the upper right of a lower one, drawn as one lamp
      each, and the SFP+ cages two green triangles between them (up for 57, down for 58), drawn as one lamp each.
  speed-strips:
    confidence: estimated
    note: >-
      Figure C-7 draws a lavender strip above each pair of QSFP28 columns in each half (24.0 and 53.0 mm down), an orange one under each QSFP-DD column (53.2 mm down) and
      a navy one above the SFP+ cages (52.3 mm down). The printed legends are not drawn.
  management-block:
    confidence: estimated
    note: >-
      Figure C-7 callouts 2, 3 and 4: the Ethernet management port, the USB port and the console port (serial) are stacked in a framed block at the top right of the front, 410.2
      to 427.4 mm across and 18.0 to 50.2 mm down: the management jack on top, the USB port in the middle and the console jack at the bottom. The figure draws the jacks about 13.6 mm
      wide and 9.5 mm tall; the registry's jack is 15.8 x 13.2 and is seated, which fills the frame. The symbols beside them (a double arrow over the management jack, a USB symbol, a
      console symbol) are drawn as read.
  status-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.1, Table 9 and Figure C-7 callouts 5 to 8: a system status lamp, a fan status lamp and a status lamp for each of the two power supplies. Four lamps in a
      column right of the management block, 430.2 mm across and 19.0, 22.3, 25.8 and 29.3 mm down, each with its symbol or legend to its right; the order is the order of the guide's
      Figure A-1.
  front-legend:
    confidence: estimated
    note: >-
      The figure prints the maker's wordmark at the top left from 6.4 to 28.7 mm across and 3.0 to 6.6 mm down, and the model "7050CX4M-48D8" in small type under it. THE WORDMARK IS
      NOT DRAWN: a logo-zone region is reserved over it and the plain model text is set.
  vents:
    confidence: estimated
    note: >-
      The figure shows a large grid of square vents across the top (6.3 to 23.4 mm down), a column of them at the left, larger grids above and below the QSFP-DD cages, and a ribbed
      strip along the lower lip. Each is drawn as a vent field in its measured extent; the individual squares and a round hole at the left edge are not drawn.
  rear:
    confidence: estimated
    note: >-
      Figure D-2, the rear seen from behind with x = 0 at the left of the drawing, as arista/7280dr3a-36: the four fan modules 79.6 mm wide at 5.9, 103.9, 189.4 and 274.9 mm across and 3.2 mm
      down, a grey strip 15.0 mm wide at 87.2 mm carrying the earth grounding pad (callout 7), and the two power supply modules 73.5 mm wide at 361.0 mm across, 2.0 and 45.0 mm down.
      PS1 is the upper (callout 5) and PS2 the lower (callout 6).
  rear-fan:
    confidence: datasheet
    note: >-
      Data sheet: "Hot-swappable Fans 4 (N+1 redundant)", "Fan Tray FAN-7012H-RED / FAN-7012H-BLUE" for the 7050CX4M-48D8, spares FAN-7012H-RED and FAN-7012H-BLUE. The guide's appendix D
      says "Handle or bezel color indicates airflow direction". The four fan modules are bays that accept those two; the -R configurations seat the blue ones.
  fru-bays:
    confidence: datasheet
    note: >-
      Guide Appendix E and the data sheet ("1+1 hot-swappable"): THE TWO POWER SUPPLIES AND THE FOUR FAN MODULES ARE BAYS. Nothing on this chassis is a built-in unit. The guide draws no
      blank for an empty bay, so none is modelled. The earth grounding pad is part of the chassis and is a placement.
  power:
    confidence: datasheet
    note: >-
      Guide Table 4: typical / maximum 390 W / 740 W with PWR-1512-AC or PWR-1511-DC; the data sheet states the same, typical "measured at 25C ambient with 50% load on all ports, excludes
      transceivers".
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, altitude 0 to 3,000 m, humidity 5 to 90 percent non-condensing. Data sheet: storage -40 to 70 C. The storage temperature
      differs: gap `environment`, the guide's used.
  configurations:
    confidence: datasheet
    note: >-
      Data sheet ordering information: DCS-7050CX4M-48D8-F and -R ("MACsec, front-to-rear air, 2xAC" and "MACsec, rear-to-front air, 2xAC"). The "#" SKU is an order of parts. The data sheet
      lists no DC SKU: the DC configurations are examples with no part number. The 7050CX4M-48D8 has no non-MACsec sibling in the guide, so it is a device of its own with MACsec as a
      property of every build.
  interface-names:
    confidence: datasheet
    note: >-
      Not printed and not modelled. The guide's configuration example names "interface management 1".
  colour:
    confidence: estimated
    note: >-
      The front plate is the median of bare-plate pixels in the guide's figure C-7.
  lifecycle:
    confidence: estimated
    note: >-
      Searched 2026-10-22 for an end-of-sale notice for the 7050CX4M-48D8 on Arista's advisories and notices pages. No notice was found.
  other-faces:
    confidence: datasheet
    note: >-
      No source draws the top, bottom or sides flat. Each carries an `empty` sentence. Guide Table 6 says the 2RU 7050CX4M-48D8 attaches its ground directly, a right-angle lug recommended; the
      earth grounding pad is on the rear (Figure D-2, callout 7).
attrs:
  physical:
    weight: 16.0 kg (35.1 lbs) (guide Table 1, data sheet)
    size-over-ears: 48.3 x 8.8 x 66.8 cm (19 x 3.50 x 26.3 in) with the mounting ears (guide Table 1)
  performance:
    throughput: 8.0 (16) Tbps
    packets-per-second: 2.7 Bpps
    latency: from 900 ns
    packet-buffer: 82 MB (fully shared)
    ports-max-speed: 8 ports of 400 Gbps; 16 of 200 Gbps; 72 of 100 Gbps; 72 of 50 Gbps; 64 of 40 Gbps; 72 of 25 Gbps; 72 + 2 of 10 Gbps
    interfaces-max: 72 + 2
    macsec-ports: 56
  power:
    power-typical-w: 390
    power-max-w: 740
    power-envelope: as-tested
    power-measure: typical at 25 C ambient with 50 percent load on all ports, excluding transceivers (data sheet)
    psu-redundancy: 1+1
    input-ac: 200 - 240 VAC, 9.6 A (PWR-1512-AC), IEC 60320 C14
    input-dc: -48 to -60 VDC (PWR-1511-DC)
    efficiency: 93 percent (Platinum) AC, 92 percent DC (data sheet)
  thermal:
    airflow: front-to-rear or rear-to-front, set by the fan modules and supplies fitted
    fan-redundancy: 4 hot-swap fan modules, N+1
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -25 to 70 C (guide Table 2); the data sheet says -40 to 70 C
    humidity: 5 to 90 percent non-condensing
    altitude: 0 to 3,000 m (10,000 ft) operating
  platform:
    cpu: Quad-Core x86
    memory: 16 GB
    storage: 16 GB flash
  features:
    optics-qsfp28: 100G, 50G, 25G and 10G with breakout, in the 48 QSFP28 cages (data sheet, "QSFP-100")
    optics-qsfp-dd: 400G, 200G, 100G and 40G with breakout, in the eight QSFP-DD cages (data sheet)
    optics-sfp-plus: 10G, in the two SFP+ cages (data sheet)
    eos-license: license group LIC-FIX-3-MACSEC; minimum EOS 4.31.1
  management:
    console: RJ-45 RS-232 serial on the front, 9600 baud 8N1, no flow control
    oob: one 10/100/1000 management port on the front
    usb: one USB port on the front, for software or configuration updates
  compliance:
    emc: FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386
    safety: EN 62368-1, IEC 62368-1, CSA/UL 62368-1
    certifications: BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI, TEC, ANATEL, ICASA, NOM Equivalency (data sheet)
    rohs: RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)
  lifecycle: {eol: none-announced}
