format: 1
kind: device
name: 7050dx4-32s
version: 1.0.1
maturity: modelled
manufacturer: Arista
model: 7050DX4-32S
portfolio: {line: 7000 Series, family: 7050X4}
description: >-
  Arista 7050DX4-32S - a fixed 1RU data-centre switch with 32 x 400G QSFP-DD ports and 2 x SFP+ ports,
  running EOS. The front carries the 400G cages in two stacked rows, the odd number on top, in sixteen
  columns, with the two SFP+ cages stacked at the right and a status lamp for each port beside its cage.
  Four system lamps (system, fan, PS1, PS2) are at the far right. The rear carries two hot-swap power
  supplies at the ends, three hot-swap fan modules, and the RJ-45 management port, the USB port and the
  RJ-45 console port. The same panel is ordered with front-to-rear air (-F) or rear-to-front air (-R), and
  as the 7050DX4M-32S with MACsec on 16 of its ports.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7050X4 Series Quick Start Guide, Arista Networks, document DOC-06569-02, 51 pages, copyright 2025,
      PDF created 2025-04-28 (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7050X4.pdf): Table 1
      (dimensions and weights), Table 2 (operating and storage), Table 3 (power input), Table 4 (power draw
      and supported supplies), section 4.1 and Table 5 (grounding), section 4.5 and Figure 4-8 (serial and
      management ports), Appendix A (status indicators, Tables 9 to 13), Appendix B (parts list), Appendix C
      (Figure C-1, the front panel of the DCS-7050DX4-32S and DCS-7050DX4M-32S), Appendix D (Figure D-1, the
      rear panel with three fan modules), Appendix E (field replacement of power supplies and fan modules).
      7050X4 Series 100/200/400G Data Center Switches Data Sheet, Arista Networks, 03-0057-27, dated
      Aug 27th, 2025 (https://www.arista.com/assets/data/pdf/Datasheets/7050X4-Datasheet.pdf): the model
      comparison, the power supply specifications, the environmental characteristics and the ordering
      information. Held and checked first: intake COVERAGE.md and SOURCES.md, which list no photograph,
      Visio stencil, 3D model or CAD file for this model (Arista publishes none; the stencil zip could not be
      fetched). The data sheet's rear photographs are a few hundred pixels wide. No drawing, photograph or
      logo is copied into the library, only transcribed facts and new drawings.
  gate-1-front:
    confidence: estimated
    note: >-
      Figure C-1 passes at 0.5 percent. The raster (extracted from the PDF) is 845 x 205 pixels. The body
      between its plate edges measures 828 px wide and 82 px tall (aspect 10.1), against the data sheet's
      439.9 / 43.7 = 10.07, so the figure is near-orthographic and carries geometry at 1.882 px/mm (the 440
      mm body is the scale anchor). One pixel is 0.53 mm, so every front position is good to about 0.5 mm,
      and every one is `estimated` because it is read off a picture and no dimension states it. The cage
      columns were read from the white port-number tabs by their centres.
  gate-1-rear:
    confidence: estimated
    note: >-
      Figure D-1 passes within 2 mm: the raster is 552 px wide, the chassis 542 px between its edges (1.232
      px/mm over the 440 mm body). The positions below are the same as arista/7280cr3-32d4's, whose guide
      draws the same three-fan 1RU rear at 1.239 px/mm, and agree with this figure to within two millimetres.
      The guide draws the rear generically (D-1 and D-2) and does not say which model uses which. The
      7050DX4-32S is mapped to D-1 by its three fan modules (data sheet: "Hot-swappable Fans 3 (N+1
      redundant)"), its 1RU height and its two power supplies. THE MAPPING IS ESTIMATED.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 1: 48.3 x 4.4 x 50.1 cm (19 x 1.75 x 19.9 in), 11.1 kg (24.4 lbs), the same for the 7050DX4-32S
      and the 7050DX4M-32S. Data sheet: 43.9 x 4.45 x 50.56 cm (17.3 x 1.75 x 19.9 in), 24.4 lbs (11.1 kg). The width:
      48.3 cm is over the mounting ears, so the body between them, which is what is modelled, is the data sheet's
      43.9 cm (the other models' 43.99), 440.0 here. The height is the data sheet's 43.7 for the other 1RU models
      (the guide prints 4.4 cm and 1.75 in, the data sheet 4.45 cm, so both print 44.5 mm for this model; the
      figure's own aspect, 828 x 82 px, is 10.1 and matches 439.9 / 43.7 = 10.07, where 44.5 would give 9.89, so the
      figure was preferred over the printed 44.5 mm). The depth: the guide's
      Table 1 prints 50.1 cm AND 19.9 inches, which are 501.0 and 505.5 mm, so the guide disagrees with itself; the
      data sheet prints 50.56 cm (19.9 in). Two of the three figures agree, so the depth is 505.6 (the data sheet's
      50.56 cm, which is the guide's inches); the guide's 50.1 cm is the outlier: the gap `depth`. 1RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's Chapter 3 mounts the switch with the accessory-kit brackets in Figures 3-1 to 3-13,
      isometric drawings that carry no measure, and Appendix B lists the kits KIT-7101, KIT-7101-D, KIT-7102,
      KIT-7102-D, KIT-7201 and KIT-7202 and the ground extender KIT-GND-EXT-1RU. The data sheet lists the
      spares KIT-7101, KIT-7103, KIT-7201, KIT-2POST-1U-NT, KIT-7101-RK and KIT-GND-EXT-1U. No figure measures a
      bracket position and the kit guides are not held, so no ear position is written and no rail kit is
      listed in chassis.kits. Recorded in the gap rack-ears.
  front-ports:
    confidence: estimated
    note: >-
      Figure C-1 at 1.882 px/mm anchored on the 440 mm body, tab centres from a pixel scan. Thirty-two QSFP-DD
      cages (ports 1 to 32) in two stacked rows and sixteen columns: the tab centres of the top row run from
      39.5 px at a pitch of 47.15 px, 25.06 mm, so the cage centre of column 1 is 20.7 mm from the left of the
      body and column 16 is 396.6 mm. The cages are 19.0 mm wide and 10.0 mm tall (std/qsfp-dd) and the figure
      draws them about 20.6 mm wide, a 4.5 mm gap between them. The top row centres 18.3 mm and the bottom row
      31.5 mm below the top, a row pitch of 13.2 mm. Two SFP+ cages (33 over 34) sit at the right on the same
      rows, centred 421.4 mm from the left. The cages are the registry's; the figure's pitch is wider than the
      registry's 19.0 ganged pitch, so the block takes the measured 25.06. The belly-to-belly orientation is the
      library's convention (upper cage upright, lower turned 180); the figure is too small to show the latch
      side.
  port-numbering:
    confidence: estimated
    note: >-
      Figure C-1 (callout 1, "Port numbers") prints 1 over 2, 3 over 4, and so on across, 1 to 32, then 33 over 34
      at the right. The odd number is the upper cage. The figure prints each number on a white tab over its cage
      and, smaller, in blue beside the cage's lamp (left of an upper cage, right of a lower one). The white tab
      is under the cage when one is seated, so the numerals are set in the blue position, beside the lamps. EOS
      interface names are not printed on the metal and are not modelled.
  port-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.2, Table 10: "Port LEDs near their corresponding ports provide a link and operational
      status": off the link is down, green link up, yellow software disabled, flashing yellow failed diagnostics.
      Figure C-1 draws one small round lamp for each port: at the lower left of an upper cage, and at the upper
      right of a lower cage; the SFP+ lamps sit at the left of the 33 and 34 cages. One lamp a port is modelled.
  status-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.1, Table 9 and Figure C-1 callouts 2 to 5: a system status lamp (blinking green on power-up,
      green normal, blue locator, amber for two or more failed fans), a fan status lamp (green, amber for one
      module removed or failed, red for two or more) and a status lamp for each of the two power supplies (green
      operating, off removed or faulty). Four lamps in a column at the far right, 433.1 mm across and 8.1, 11.4,
      14.6 and 17.9 mm down. The order top to bottom (system, fan, PS1, PS2) is the order of the guide's Figure A-1
      and the printed glyphs beside them (a power symbol, a fan symbol, and the legends read as PS1 and PS2); the
      callout lines of Figure C-1 cross each other and do not settle it.
  front-legend:
    confidence: estimated
    note: >-
      The vertical model legend reads "7050DX4-32S" up the left plate. The maker's wordmark above the first column
      from 1.2 to 16.3 mm across and 1.6 to 4.8 mm down IS NOT DRAWN: a logo-zone region is reserved over it and
      the plain model text is set. The figure's small print is not legible beyond the model name, which is as the
      guide's caption names the model.
  vents:
    confidence: estimated
    note: >-
      The figure shows a perforated band above the cages (4.3 to 10.1 mm down, from 11 mm across to nearly the
      right-hand lamps) and a narrow one under them, and two round knobs on the lower lip. Each band is drawn as a
      vent field in its measured extent; the individual squares are not drawn one by one, and the knobs are not
      drawn.
  rear:
    confidence: estimated
    note: >-
      Figure D-1, the rear seen from behind with x = 0 at the left of the drawing. PS1 is the left and PS2 the right
      (callouts 1 and 10). Each power supply module is 73.5 mm wide (the data sheet's "73.5MM") at 4.0 and 362.3 mm
      across and 1.85 mm down. The management block is a grey plate 83.0 to 101.0 mm across with the Ethernet
      management port, the USB port and the RJ-45 console port stacked in it (callout 3, "Management ports"), as
      arista/7280cr3-32d4 draws it. Three fan modules 78.6 mm wide at 107.7, 191.0 and 274.3 mm across (an 83.3 mm
      pitch). The figure also draws, between the fans, release sliders and lamps, which are in the fan component.
  rear-fan:
    confidence: datasheet
    note: >-
      Data sheet: "Hot-swappable Fans 3 (N+1 redundant)", "Fan Tray FAN-7011H -F/R" for the 7050DX4-32S and 7050PX4-32S
      and "FAN-7011H -F" for the DX4M, FAN-7011H-F and -R as spares. The guide's appendix D says "Handle or bezel color
      indicates airflow direction". The three fan modules are bays that accept FAN-7011H-F or -R; the -R configurations
      seat the blue modules.
  fru-bays:
    confidence: datasheet
    note: >-
      Guide Appendix E (E.2 power supplies, E.3 fan modules) gives removal and installation procedures, "All fans and
      power supplies are hot-swappable", and the data sheet calls the supplies "1+1 hot-swappable". SO THE TWO POWER SUPPLIES
      AND THE THREE FAN MODULES ARE BAYS. Nothing on this chassis is a built-in unit. The guide's section E.1 says all slots
      must be filled or covered with a blank; the guide draws no blank, so none is modelled. The management block, the USB
      port and the console port are part of the chassis and are placements.
  power:
    confidence: datasheet
    note: >-
      Guide Table 4: typical / maximum 353 W / 880 W for the 7050DX4-32S (PWR-1512-AC or PWR-1511-DC) and 423 W / 1208 W for
      the 7050DX4M-32S, the same figures as the data sheet's "Typical/Max Power" row, with typical "measured at 25C ambient with
      50% load on all ports, excludes transceivers". The device carries 353 W / 880 W; the configuration m-f states the DX4M's
      own 423 W / 1208 W in its `attrs`, with the MACsec ports, the licence group and the minimum EOS the data sheet's model
      comparison prints for it.
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, altitude 0 to 3,000 m, humidity 5 to 90 percent non-condensing.
      Data sheet: operating 0 to 40 C, storage -40 to 70 C, humidity 5 to 90 percent, altitude 0 to 3,000 m. The storage
      temperature differs: gap `environment`, the guide's used.
  configurations:
    confidence: datasheet
    note: >-
      Data sheet ordering information: DCS-7050DX4-32S-F and -R ("front-to-rear air, 2xAC" and "rear-to-front air, 2xAC") and
      DCS-7050DX4M-32S-F (MACsec, front-to-rear air, 2xAC). The "#" SKUs ("configurable fans and psu") are orders of parts, not
      part numbers a DCIM can hold, and are not listed. The data sheet lists no DC SKU: the PWR-1511-DC supplies are spares, so
      the DC configurations are examples with no part number. The DX4M shares this model's front figure (Figure C-1 is captioned
      "DCS-7050DX4-32S and DCS-7050DX4M-32S"), size, weight and fans, so it is a configuration of this device and not a device
      of its own. The data sheet says the DX4M has no reversible airflow, so it has no -R part number.
  interface-names:
    confidence: datasheet
    note: >-
      Not printed and not modelled. The guide's configuration example names "interface management 1"; no held document prints
      the front ports' names.
  colour:
    confidence: estimated
    note: >-
      The front plate is the median of bare-plate pixels in the guide's figure C-1.
  lifecycle:
    confidence: estimated
    note: >-
      Searched 2026-10-22 for an end-of-sale notice for the 7050DX4-32S, 7050PX4-32S and 7050DX4M-32S on Arista's advisories
      and notices pages. No notice was found for these models.
  other-faces:
    confidence: datasheet
    note: >-
      No source draws the top, bottom or sides flat. The guide's installation figures are isometric. Each carries an `empty`
      sentence. The 1RU grounding point is on the bottom of the chassis (guide section 4.2, Table 5, KIT-GND-EXT-1RU); no figure
      measures it.
attrs:
  physical:
    weight: 11.1 kg (24.4 lbs) for the 7050DX4-32S and 7050DX4M-32S (guide Table 1, data sheet)
    size-over-ears: 48.3 x 4.4 x 50.1 cm (19 x 1.75 x 19.9 in) with the mounting ears (guide Table 1)
  performance:
    throughput: 12.8 (25.6) Tbps
    packets-per-second: 5.3 Bpps
    latency: from 900 ns
    packet-buffer: 132 MB (dynamic buffer allocation)
    ports-max-speed: 32 ports of 400 Gbps; 64 of 200 Gbps; 128 of 100 Gbps; 144 of 50 Gbps; 64 of 40 Gbps; 128 of 25 Gbps; 128 + 2 of 10 Gbps
    interfaces-max: 144
  power:
    power-typical-w: 353
    power-max-w: 880
    power-envelope: as-tested
    power-measure: typical at 25 C ambient with 50 percent load on all ports, excluding transceivers (data sheet)
    psu-redundancy: 1+1
    input-ac: 200 - 240 VAC, 9.6 A (PWR-1512-AC), IEC 60320 C14
    input-dc: -48 to -60 VDC (PWR-1511-DC)
    efficiency: 93 percent (Platinum) AC, 92 percent DC (data sheet)
  thermal:
    airflow: front-to-rear or rear-to-front, set by the fan modules and supplies fitted
    fan-redundancy: 3 hot-swap fan modules, N+1
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -25 to 70 C (guide Table 2); the data sheet says -40 to 70 C
    humidity: 5 to 90 percent non-condensing
    altitude: 0 to 3,000 m (10,000 ft) operating
  platform:
    cpu: Quad-Core x86
    memory: 16 GB
    storage: 16 GB flash
  features:
    optics-qsfp-dd: 400G, 200G, 100G, 50G, 40G, 25G and 10G with breakout, in the 32 QSFP-DD cages (data sheet)
    optics-sfp-plus: 10G, in the two SFP+ cages (data sheet)
    eos-license: license group LIC-FIX-3; minimum EOS 4.28.1 (7050DX4-32S), 4.30.1 (7050DX4M-32S)
  management:
    console: RJ-45 RS-232 serial on the rear, 9600 baud 8N1, no flow control
    oob: one 10/100/1000 management port on the rear
    usb: one USB port on the rear, for software or configuration updates
  compliance:
    emc: FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386
    safety: EN 62368-1, IEC 62368-1, CSA/UL 62368-1
    certifications: BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI, TEC, ANATEL, ICASA, NOM Equivalency (data sheet)
    rohs: RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)
  lifecycle: {eol: none-announced}
