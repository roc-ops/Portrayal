configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis with two AC supplies and three fan modules fitted, front-to-rear air, before any part number: the shape every build below
      starts from.
  f:
    kind: orderable
    description: >-
      The 7050DX4-32S with two AC supplies and front-to-rear air: PWR-1512-AC-RED supplies and FAN-7011H-F fan modules, all with red handles.
      Ordered as DCS-7050DX4-32S-F.
    part-numbers:
      DCS-7050DX4-32S-F: {}
  r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7050DX4-32S with two AC supplies and rear-to-front air: PWR-1512-AC-BLUE supplies and FAN-7011H-R fan modules, all with blue handles.
      Ordered as DCS-7050DX4-32S-R.
    bays:
      psu-1: arista/7050x4-pwr-1500-ac-rev@1
      psu-2: arista/7050x4-pwr-1500-ac-rev@1
      fan-1: arista/7280cr3-fan-rev@1
      fan-2: arista/7280cr3-fan-rev@1
      fan-3: arista/7280cr3-fan-rev@1
    part-numbers:
      DCS-7050DX4-32S-R: {}
  m-f:
    kind: orderable
    description: >-
      The 7050DX4M-32S, the same chassis and front figure with MACsec on ports 1 to 8 and 25 to 32, with front-to-rear air and two AC supplies.
      The data sheet lists no rear-to-front build of it. Ordered as DCS-7050DX4M-32S-F.
    export-description: >-
      Arista 7050DX4M-32S - a fixed 1RU data-centre switch with 32 x 400G QSFP-DD ports and 2 x SFP+ ports, with MACsec on 16 of its
      ports, running EOS
    attrs:
      performance:
        macsec-ports: 16 (ports 1 to 8 and 25 to 32)
      power:
        power-typical-w: 423
        power-max-w: 1208
      features:
        eos-license: license group LIC-FIX-3-MACSEC; minimum EOS 4.30.1
    part-numbers:
      DCS-7050DX4M-32S-F: {}
  dc-f:
    kind: example
    power: dc
    description: >-
      Two DC supplies and front-to-rear air: PWR-1511-DC-RED supplies and FAN-7011H-F fan modules. The data sheet lists no DC part number for the
      switch; the supplies are spares, and a DC build is ordered through the "#" configurable SKUs.
    bays:
      psu-1: arista/7280r3-pwr-1500-dc@1
      psu-2: arista/7280r3-pwr-1500-dc@1
  dc-r:
    kind: example
    power: dc
    airflow: back-to-front
    description: >-
      Two DC supplies and rear-to-front air: PWR-1511-DC-BLUE supplies and FAN-7011H-R fan modules. No DC part number is listed for the switch.
    bays:
      psu-1: arista/7050x4-pwr-1500-dc-rev@1
      psu-2: arista/7050x4-pwr-1500-dc-rev@1
      fan-1: arista/7280cr3-fan-rev@1
      fan-2: arista/7280cr3-fan-rev@1
      fan-3: arista/7280cr3-fan-rev@1
