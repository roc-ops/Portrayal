gaps:
  - what: depth
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      Guide Table 1 gives a depth of "50.1 x ... cm (19 x 1.75 x 19.9 inches)" for the 7050DX4-32S and the 7050DX4M-32S, and 19.9 in
      is 505.5 mm, not 501 mm; the data sheet gives 19.9 in (50.56 cm). The data sheet's 505.6 mm, which agrees with the guide's inches,
      is modelled; the guide's 501 mm is not.
    wanted: the maker's statement of which is current.
  - what: environment
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet). The guide's is in attrs.
    wanted: the maker's statement of which is current.
  - what: psu-model-dx4m
    scope: [rear]
    reason: sources-disagree
    note: >-
      The guide's Table 4 gives the 7050DX4M-32S the PWR-1512-AC and PWR-1511-DC; the data sheet's model comparison gives it
      "PWR-2421-HV". The guide's supplies are seated; PWR-2421-HV (2400 W, SAF-D, 200-277 VAC or 240-380 VDC) is not modelled.
    wanted: the maker's statement of which supply ships.
  - what: psu-part-name
    scope: [rear]
    reason: sources-disagree
    note: >-
      The guide's Table 3 and Table 4 name PWR-1512-AC; its section 4.4.1 and Table 12 name PWR-1511-AC. The data sheet lists
      PWR-1512-AC-RED/BLUE and PWR-1511-DC-RED/BLUE only. PWR-1512-AC is written.
    wanted: the maker's statement of which is current.
  - what: macsec-ports
    scope: [front]
    reason: needs-photo
    note: >-
      The guide's Appendix C note says a key icon identifies the MACsec ports; the data sheet says they are ports 1 to 8 and 25
      to 32 of the DX4M. The key icon is not resolved in the 845 px figure, so it is not drawn.
    wanted: a photograph of the DX4M's face.
  - what: rack-ears
    scope: [front]
    reason: needs-drawing
    note: >-
      The guide's Figures 3-1 to 3-13 are isometric drawings with no measure and the kit guides for KIT-7101, KIT-7101-D and the other
      spares are not held, so no ear position or rail kit is written.
    wanted: a dimensioned drawing of the mounting bracket position, and the kit guides.
  - what: front-legends
    scope: [front]
    reason: needs-photo
    note: >-
      The small print of the face, the system and fan lamp glyphs and the PS1 and PS2 legends are unreadable in the 845 px figure.
      The glyphs and the two PS legends are drawn as read; the rest is not drawn.
    wanted: a photograph of the face.
  - what: cage-orientation
    scope: [front]
    reason: needs-photo
    note: >-
      Which side the latches of the stacked cages face is not visible in the figure. The library's belly-to-belly convention is used
      (upper cage upright, lower turned 180).
    wanted: a photograph of the stacked cages.
  - what: rear-mgmt-block
    scope: [rear]
    reason: needs-photo
    note: >-
      The management block's arrow marks and its console symbol are drawn as read; the order of the three ports (management over USB over
      console) follows the data sheet's rear photograph and figure D-1, and the figure's 1.23 px/mm resolves it only as three stacked
      ports. The lamps on the management jack are the library's single Ethernet jack's.
    wanted: a photograph of the rear management block.
  - what: psu-dc-face
    scope: [rear]
    reason: needs-drawing
    note: >-
      The PWR-1511-DC supplies are drawn as the AC supply's housing with a plain two-pole terminal block. The guide shows a DC supply only in
      the isometric Figures 4-5 and 4-7; the real terminal arrangement is not drawn.
    wanted: a flat drawing or photograph of the PWR-1511-DC.
  - what: module-power
    scope: [rear]
    reason: vendor-silent
    note: >-
      The guide's power tables and the data sheet give whole-switch figures only; the fan modules' missing power figure (lint L27) stands. The
      supplies state their output.
    wanted: FAN-7011H power draw.
  - what: grounding
    scope: [bottom]
    reason: needs-drawing
    note: >-
      The 1RU grounding point is on the bottom of the chassis for KIT-GND-EXT-1RU (guide section 4.2, Table 5, Figure 4-2). No flat figure
      measures it, so it is not placed.
    wanted: a flat drawing of the bottom with the grounding bracket holes.
groups:
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
    description: >-
      The 32 400G QSFP-DD ports, numbered 1 to 32 as printed; the odd numbers are the upper cages
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
    description: >-
      The two SFP+ ports, numbered 33 and 34 as printed; 33 is the upper cage
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: a status lamp for each port, beside its cage
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system, fan and two power supply lamps at the right of the front
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      how the switch is reached out of band - the 10/100/1000 management port, the USB port and the RS-232
      console port, stacked in one block at the left of the rear panel
  psu-bays:
    term: Bay
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Data sheet: "Hot-swap Power 2 (1+1 redundant)". Guide section 4.4: at least one supply must connect to a power source
    description: the two hot-swap power supplies, 1+1 redundant
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: n+1
      redundancy-note: >-
        Data sheet: "Hot-swappable Fans 3 (N+1 redundant)"
    description: the three hot-swap fan modules
