gaps:
- what: front-faces-of-the-variants
  scope: [front]
  reason: vendor-silent
  wanted: >-
    A FIGURE OF THE DR3A-54 AND THE DR3AM-54 FRONT. Figure C-1 is captioned for all three models
    but prints the plate "7280DR3AK-54", so it is a picture of the DR3AK-54. The model plate of the
    other two is not shown. The `ac-k` face prints the figure's "7280DR3AK-54"; the base switch's
    plate reads "7280DR3A-54", and on `ac-m` that line is a stand-in for the M plate. A photograph
    of each plate closes the base and M ones.
- what: cage-turn
  scope: [front]
  reason: needs-drawing
  wanted: >-
    WHICH WAY EACH UPRIGHT CAGE FACES. The cages stand on end and are turned 90; whether the bail
    is at the right or the left, and whether the three in a column are built alike, is not resolved
    in a 127 ppi figure. A photograph or a drawing of the faceplate that shows a cage lip closes it.
- what: number-boxes
  scope: [front]
  reason: needs-drawing
  wanted: >-
    THE WHITE NUMBER TABS OVER THE CAGES. Figure C-1 draws a white square with a large numeral over
    the centre of each cage. A seated cage hides what is painted under it and the library has no
    layer above a cage for printed matter, so the numbers are modelled as the strip legends only.
    A drawing that says whether the tab is a sticker on the cage or part of it closes it.
- what: status-lamp-symbols
  scope: [front]
  reason: needs-drawing
  wanted: >-
    THE SYMBOLS OVER THE SYSTEM AND FAN LAMPS, and the small symbols at the left of the console, USB
    and management jacks. They are printed in blue at about two pixels' height and are not legible
    in the figure; PS1 and PS2 are. Guide figures A-1 and A-2 say the lamps are labelled in one of
    two ways and the held figure does not say which this chassis uses.
- what: tod-symbol
  scope: [front]
  reason: vendor-silent
  wanted: >-
    A BLUE SYMBOL (a circle with a mark in it) ABOVE THE ToD CONNECTOR, at about 12.0 mm from the left
    and 7.5 mm down. Figure C-1 draws it and no callout or table names it. It is not modelled.
- what: clock-connector-type
  scope: [front]
  reason: vendor-silent
  wanted: >-
    WHETHER THE PPS AND 10MHZ JACKS ARE SMB OR SMA. The guide calls them "E-Sync clock connectors"
    and the data sheet "PPS/10M/ToD inputs"; neither names the connector. They are seated as
    std/smb@1 from their drawn size and their direction (input or output) is not stated either.
- what: tod-connector-type
  scope: [front]
  reason: vendor-silent
  wanted: >-
    WHAT THE ToD CONNECTOR IS. Figure C-1 draws a vertical slot with a jack screw at each end, which
    reads as a locking D-shaped connector; the data sheet's accessory "CAB-SYNCE-RJ" names a USB-C
    mate. It is seated as std/usb-c@1 with its screws drawn as decor, as the 7280DR3A-36 does.
- what: usb-generation
  scope: [front]
  reason: vendor-silent
  wanted: >-
    THE USB GENERATION. The guide says "USB port" and the data sheet "USB Ports 1"; neither gives a
    generation, and figure C-1 draws a black tongue. The port is seated with the `usb2` (white) skin
    as the one that claims least; a data sheet line giving the generation closes it.
- what: round-hole-at-left
  scope: [front]
  reason: vendor-silent
  wanted: >-
    A BLACK ROUND HOLE at the left edge, 1.9 mm from it and 43.8 mm down, under the clock jacks.
    Figure C-1 draws it and nothing names it (an ESD socket is a candidate on other switches). It is
    drawn as a hole in decor and carries no part.
- what: vent-edge-bands
  scope: [front]
  reason: needs-drawing
  wanted: >-
    THE THIN BANDS OF HONEYCOMB above and below the strips. They are 2.6 mm tall, under one cell of
    the library's tile, and are not drawn; the fields between the columns are.
- what: rear-legends
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    THE PRINTING AT THE REAR. The guide's rear panel figure is 1.19 px/mm and its labels are
    unreadable. The supplies and fans print no numbers that resolve. A rear photograph closes it.
- what: dc-terminals
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    THE PWR-3001-DC FACE. The guide shows the PWR-1900-DC and PWR-500-DC (figure 4-5) and no
    PWR-3001-DC. Table 7 note 2 says its terminals are "twin #10 studs spaced for dual-hole lug with
    5/8 inch hole spacing"; the supply here is the AC housing with a plain two-pole block, and the
    protective earth terminal "on the opposite side" is not drawn. The data sheet reads "AWG #3
    Max" for the DC input connector and table 7 reads 1 to 2 AWG; the larger conductor (the
    guide's) is the one a lug takes.
- what: side-grounding-kit
  scope: [left, right]
  reason: needs-drawing
  wanted: >-
    THE SIDE GROUNDING POINT. Table 6 and section 4.2 of the guide put the DR3A-54's grounding point
    on the side of the chassis, taking the KIT-GND-EXT-2RU extender (the data sheet: "DR3A-54
    Only"), and figure 4-3 draws the kit on another switch from an angle. No document gives the
    point's position or the kit's size, so neither side face carries it and the kit is not
    modelled.
- what: rack-ears-and-kits
  scope: [front]
  reason: needs-drawing
  wanted: >-
    THE KITS, AND THE EAR POSITION THAT IS NOT FLUSH. `chassis.ears` states the one position the
    guide names for a 2RU switch: section 3.5 says the bracket sits "either flush with the front
    and rear panels, or not flush with the panels", and section 3.4 gives no two-post mounting for
    the 2RU switches, so the position is `4-post` only. It has no `at` (the guide's mounting
    figures are isometric drawings of other switches, the 7050 and the 7050SX-128), no `default`
    (no figure shows the ears as shipped) and the "not flush" case is left out because the guide
    does not say which way it sits. The data sheet's ordering information lists KIT-7203 (spare
    tool-free accessory kit v2 for 2RU, 4-post mount, 2x SAF-D-C20) and KIT-7004-2UL (extended
    tool-free 4-post kit for 2-4RU) for the DR3A-54. No document dimensions the parts of either, and
    none gives KIT-7004-2UL a range or a parts list. A kit contract needs its parts as components
    with a size, so neither kit is modelled and `chassis.kits` is left out.
- what: fan-and-supply-power
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    THE POWER DRAW OF FAN-7012H. Neither the guide nor the data sheet gives it. The supplies' own
    output (3000 W) is stated and is written.
- what: model-plates-of-the-variants
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The M variant prints its own model line on the plate. The K plate is drawn from figure C-1;
    the M plate has no figure, so `ac-m` prints the base line.
groups:
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the fifty-four 400G QSFP-DD ports STANDING UPRIGHT IN EIGHTEEN COLUMNS OF THREE on a 22.16 mm
      pitch, numbered 1 to 54 down each column from 1 at the top left, with the numbers printed in
      the orange strips above and below each column.
    attrs: {media: qsfp-dd, speed: 400g}
  osfp-ls-400g:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the two OSFP line-system ports, printed 55 and 56 (their ids are port-55 and port-56) and
      counted 1 and 2 here as the guide's callout table does ("Line system port (OSFP)"), stacked
      at the lower right. The data sheet calls them OSFP-LS and says they are for dense 400G-ZR
      deployment.
    attrs: {media: osfp, speed: 400g}
  model-plate:
    term: Label
    role: furniture
    index-origin: 1
    description: the model line at the lower left of the front, one placement per printed line, the K build's in place of the others'
  port-leds: {term: LED, role: indicator, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the machine's management interfaces: a 10/100/1000 RJ-45 Ethernet management port, a USB port
      for software and configuration updates, and an RJ-45 serial console, one over another at the
      upper right (guide section 4.5: "For most models, the front panel contains the console,
      management, and USB ports").
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the precision-timing connectors at the left edge: a Time-of-Day connector (USB-C, the mate of
      CAB-SYNCE-RJ) and two coax clock connectors, 1PPS and 10MHz, which the guide calls "E-Sync
      clock connectors". The data sheet's "PPS/10M/ToD inputs".
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        datasheet: "Hot-swap Power Supplies 2 (1+1 redundant)"; guide section 4.4: "The switch operates
        with two installed power supplies. At least one power supply must connect to a power source."
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 'n+1'
      redundancy-note: >-
        datasheet: "Hot-swappable Fans 4 (N+1 redundant)"
