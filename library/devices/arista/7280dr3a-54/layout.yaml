configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis as it ships: two AC supplies and four fans in, all fifty-four QSFP-DD and both OSFP
      cages empty. The orderable builds below are this chassis with a licence and encryption variant.
  ac:
    kind: orderable
    description: >-
      The base switch with two AC supplies and four fans, front-to-rear air: DCS-7280DR3A-54-F ("2 x
      AC"). Spares: PWR-3001-AC-RED, FAN-7012H-RED.
    part-numbers:
      DCS-7280DR3A-54-F: {}
    bays:
      psu-1: arista/7280dr3a-pwr-3000-ac@1
      psu-2: arista/7280dr3a-pwr-3000-ac@1
  ac-m:
    kind: orderable
    description: >-
      The DR3AM-54 with TunnelSec: DCS-7280DR3AM-54-F, the same face, supplies and fans as the base
      switch. Table 4 gives it the base switch's power draw.
    export-description: >-
      Arista 7280DR3AM-54 - the TunnelSec build of the 7280DR3A-54, a fixed 2RU data-centre router switch with 54 400G QSFP-DD ports
    part-numbers:
      DCS-7280DR3AM-54-F: {}
    bays:
      psu-1: arista/7280dr3a-pwr-3000-ac@1
      psu-2: arista/7280dr3a-pwr-3000-ac@1
  ac-k:
    kind: orderable
    description: >-
      The DR3AK-54 with large routes and TunnelSec: DCS-7280DR3AK-54-F, the same face, supplies and
      fans as the base switch. Table 4 gives it the base switch's power draw. Its face prints
      "7280DR3AK-54" on the model plate, as figure C-1 does.
    export-description: >-
      Arista 7280DR3AK-54 - the large-routes and TunnelSec build of the 7280DR3A-54, a fixed 2RU data-centre router switch with 54 400G QSFP-DD ports
    part-numbers:
      DCS-7280DR3AK-54-F: {}
    bays:
      psu-1: arista/7280dr3a-pwr-3000-ac@1
      psu-2: arista/7280dr3a-pwr-3000-ac@1
  dc:
    kind: example
    description: >-
      Two DC supplies in place of the AC ones, front-to-rear air: what a "DCS-7280DR3A-54#" order
      (configurable fans and psu) with PWR-3001-DC-RED gives. The data sheet lists no DC part number
      of its own, so this is a worked build and not an orderable one.
    power: dc
    bays:
      psu-1: arista/7280dr3a-pwr-3000-dc@1
      psu-2: arista/7280dr3a-pwr-3000-dc@1
