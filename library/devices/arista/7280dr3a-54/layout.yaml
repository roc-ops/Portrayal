    optics-qsfp-dd: >-
      datasheet: each QSFP-DD port runs 400G, or 200G, 100G, 50G, 40G (QSFP+) and 25/10G modes by
      breakout. Maximum values are uni-dimensional and may need breakout cables or transceivers.
    optics-osfp: >-
      datasheet: the two OSFP-LS (line-system) ports are "for dense 400G-ZR deployment", and "Arista's
      R3A platforms are optimized to support high power 400ZR OSFP and QSFP-DD optical modules".
    osfp-ls: '2 x OSFP-LS ports for dense 400G-ZR deployment'
    precision-timing: 'PTP and SyncE with OCXO and PPS/10M/ToD inputs'
