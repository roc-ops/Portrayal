portfolio: {line: 7000 Series, family: 7280DR3A}
description: >-
  Arista 7280DR3A-54 - a fixed 2RU data-centre router switch with 54 400G QSFP-DD ports. The ports
  stand upright in eighteen columns of three, numbered 1 to 54 down each column from the top left.
  Two OSFP line-system ports (OSFP-LS, 55 and 56) for 400G-ZR optics are stacked at the lower
  right. Above them at the right, one over another, are an RJ-45 Ethernet management port, a USB
  port and an RJ-45 console. Four status lamps stand beside them: system, fan, power supply 1 and
  power supply 2. At the left edge are a Time-of-Day connector and two clock connectors (1PPS and
  10 MHz). The rear carries four hot-swap fan modules and two hot-swap 3000 W power supplies, AC or
  DC, one above the other at the right. The same front panel is sold as the DR3A-54, the DR3AM-54
  (TunnelSec) and the DR3AK-54 (large routes and TunnelSec). They differ in software licence and
  encryption, not in the metal.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7280R3A Series Quick Start Guide, Arista Networks, DOC-07042-01, 59 pages, PDF created
      2025-05-16 (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280R3A.pdf): Table 1
      (dimensions and weights), Table 2 (operating and storage environment), Table 3 (power input),
      Table 4 (power draw and supported supplies), Table 6 (grounding of the 2RU switches), section
      2.1 (airflow orientation), sections 4.4 and 4.5 (power and serial cables), Appendix A (status
      indicators, figures A-1 and A-2, tables 9 to 13), Appendix C (front panel, figure C-1:
      DCS-7280DR3A-54, DCS-7280DR3AK-54 and DCS-7280DR3AM-54), Appendix D (rear panels, figures D-1
      to D-4) and Appendix E (power supplies and fan modules, "all fans and power supplies are hot
      swappable"). 7280R3A Series Data Sheet, Arista Networks, 04-0040-26, 27 pages, dated April
      15th, 2025 (https://www.arista.com/assets/data/pdf/Datasheets/7280R3A-Datasheet.pdf): the
      7280DR3A-54 model comparison table, power supply specifications, ordering information and the
      platform overview. Held intake files read first: SOURCES.md, COVERAGE.md and the stencil
      folder. No 3D model, no CAD drawing, no studio photograph and no Visio stencil is held (the
      stencil zip could not be fetched), and the data sheet's only picture of the face is a small
      thumbnail, so figure C-1 is the instrument.
  gate-1:
    confidence: estimated
    note: >-
      Figure C-1 is a 856 x 349 px raster (PDF image, 127 ppi). The chassis in it spans 825 px
      (x 2 to 827) and 164.5 px (y 105 to 269.5): aspect 5.01, against 5.005 for the data sheet's
      43.99 x 8.79 cm body (0.2 percent out), so the figure shows the body with no ears and
      PASSES Gate 1. Scale 1.874 px/mm on x and 1.871 on y; 1.874 is used for both, so one pixel is
      0.53 mm. Every front position below is a reading good to about one pixel and is estimated.
      The rear figure D-4 is a 571 x 153 px raster whose chassis is 527 px (x 0 to 527) by 105 px
      (y 47 to 152): the same chassis frame as figure D-3 of the 7280DR3A-36, at 1.193 px/mm, with
      the red fan frames at the same pixels (x 9, 126, 228 and 330, 96 px wide, y 52 to 150).
  port-wall:
    confidence: estimated
    note: >-
      FIFTY-FOUR QSFP-DD CAGES IN EIGHTEEN COLUMNS OF THREE, EACH STANDING UPRIGHT. The orange
      strips of figure C-1 were found as connected components: the top strips start at x 37, 79,
      120, 162, 203, 245, 286, 328, 370, 411, 453, 494, 536, 577, 618, 660, 701 and 743 px, a pitch
      of 41.53 px = 22.16 mm, each 20.5 px (10.9 mm) wide, centred 24.2 mm from the left for column
      one. The cages in a column are 19.5 mm tall bezels (121.5 to 158, 168.5 to 205, 215.5 to 252.5
      px) on a 47 px = 25.1 mm pitch, centred 18.6, 43.7 and 68.8 mm below the top; a cage is 19 mm
      long and 10 mm wide in the registry (std/qsfp-dd@1, 19.0 x 10.0), so each is turned a quarter
      and stands 10 wide and 19 tall. The figure draws the bezel about 10.9 wide, which is the
      strip's width. An orange strip lies above each column (y 114 to 120.5 px, 4.8 to 8.2 mm) and
      another below it (y 254 to 260.5 px, 79.5 to 83.0 mm); a grey band holds the lamps between
      the cages.
  numbering:
    confidence: estimated
    note: >-
      THE NUMBERS ARE PRINTED TWICE ON THE FIGURE and the model follows the strips. A white box
      with a large numeral sits over each cage in figure C-1, and the orange strips print the same
      numbers small: the top strip of a column prints `N-up-arrow` at its left and `down-arrow N+1`
      at its right (1 and 2, 4 and 5, 7 and 8, 10 and 11, ... 52 and 53), and the bottom strip
      prints `N+2-up-arrow` (3, 6, 9, 12, ... 54). The numeral boxes were read on a five-times
      enlargement of columns one to five, and the strip text on a ten-times one of column one. A
      seated cage hides anything painted under it, so the model prints the strip legends (which
      show in every render) and not the boxes. The numbers run down each column: port n is in
      column ceil(n/3), and its row is (n - 1) mod 3, the top when n is 1 mod 3. Callout 11 of the
      figure, "Port numbers", covers both prints. Numbering starts at 1. Interface names (Ethernet1
      to Ethernet54 and their breakouts) are EOS names and are not printed on the metal; they are
      not modelled.
  stack-orientation:
    confidence: estimated
    note: >-
      Every cage is turned 90 (its bail to the right). The library's convention
      (docs/pluggables-3d-design.md, S3) pairs a column of cages turned 270 and 90 whose bellies face
      each other ACROSS the stack, and "never two cages down a column"; here the cages are stacked
      down a column, three high, and the columns are 22.16 mm apart, so no two cages face each other
      and no pair exists to be turned. The turn is therefore the library's default for an upright
      cage turned to stand on its end and not an observation: the figure draws the bezels at 1.874
      px/mm and the cage lip and the bail are not resolved, so a photograph of the faceplate
      overturns it. See the gap for the turn.
  port-lamps:
    confidence: estimated
    note: >-
      ONE LAMP PER PORT, three to a column, in the grey bands between the cages: the band between
      the first and second cage holds two triangles, an up-pointing one 1.9 mm left of the column
      centre (the first port's) and a down-pointing one 1.9 mm right of it (the second port's), and
      the band between the second and third holds one down-pointing triangle at the right (the
      third port's); y 31.4 and 56.4 mm from the top (figure C-1, five-times enlargement of columns
      one to five). The guide's Appendix A.1.2 says port LEDs are "located in the vicinity of their
      corresponding ports" and table 10 gives the states: off link down, green link up, yellow
      software-disabled, flashing yellow failed diagnostics. The lamps are triangles (the arrows
      point to the cage they serve) and are drawn with common/led-arrow-sm.
  line-system-ports:
    confidence: estimated
    note: >-
      TWO OSFP CAGES stacked at the lower right, "Line system port (OSFP)" (callout 10 of the
      figure) and "2 x OSFP-LS ports for dense 400G-ZR deployment" in the data sheet, standing
      upright like the QSFP-DD cages and printed 55 (upper) and 56 (lower) beside a green strip.
      The pair measures 28 px (14.9 mm) wide and 86.6 px (46.2 mm) tall at x 787 to 815 px and y 174
      to 261 px, which is two std/osfp@1 (23.1 x 13.5 mm) turned a quarter, touching: centres 426.4
      mm from the left and 48.4 and 71.7 mm down. A green strip 2.3 mm wide at their right (x 433.8,
      y 36.9 to 83.1 mm) prints "55", LINE (turned) and "56"; a small lamp sits on it opposite each
      cage. The two cages are stacked down a column and are not a belly-to-belly pair (see
      stack-orientation).
  status-block:
    confidence: estimated
    note: >-
      FOUR LAMPS at the right of the management block, one over another 5.9 mm apart at x 434.4 mm:
      system status, fan status, power supply 1 status and power supply 2 status (figure C-1
      callouts 6 to 9; guide Appendix A.1.1, figures A-1 and A-2: "labeled either as in Figure A-1
      or as in Figure A-2"). The two lower lamps are printed PS1 and PS2 at their right; the two
      upper lamps carry a symbol (a circle with a mark, a fan) instead of a word. The symbols are
      not drawn: their strokes are two pixels wide and resolve to a blob (see gaps). States are
      table 9's: the system lamp blinking green (powering up), green, blue (beacon) or amber; the
      fan lamp green, amber or red; the supply lamps green or off.
  management-ports:
    confidence: estimated
    note: >-
      A STACK OF THREE at the upper right, one over another, in a black well 17.4 x 33.0 mm at x
      416.7 mm: the Ethernet management port (callout 3, RJ-45 with its two lamps drawn in the top
      corners) at the top, the USB port (callout 4, Type A, horizontal) in the middle and the serial
      console (callout 5, RJ-45) at the bottom, the console below the USB port. The callout arrows
      point at the upper jack's top-left lamp, at the USB slot and at the lower jack. The guide's
      section 4.5 lists the cables: RJ-45 to DB-9 serial adapter and an RJ-45 Ethernet cable; the
      data sheet gives "RS-232 Serial Ports 1 (RJ-45)", "USB Ports 1" and "100/1000 Mgmt Ports 1"
      (as printed). The management jack is taken as 10/100/1000 (guide section 4.5: "Connect to
      10/100/1000 management network") and so `1g`, where the data sheet's line reads "100/1000".
      Jack centres 425.2 mm from the left and 10.4, 19.6 and 28.8 mm down; the library's jack is
      15.8 mm wide where the figure's measures about 13.3.
  timing:
    confidence: estimated
    note: >-
      ToD AND TWO CLOCK CONNECTORS in the strip at the left edge (callouts 1 and 2). The ToD
      connector is a vertical slot 8.3 mm tall with a screw at each end (x 8.3 mm, y 14.4 to 22.7 mm,
      screws at 11.5 and 25.1 mm); the data sheet's accessory "CAB-SYNCE-RJ  Spare Time of Day adapter
      cable (USB-C to 2 x RJ-45)" says its mate is USB-C, so std/usb-c@1 is turned a quarter, as the
      7280DR3A-36 does. Under it are two gold coax jacks at x 8.3 mm and y 32.2 and 40.2 mm (4.8 mm
      across), printed PPS (upper) and 10MHz (lower) and turned to read upward. The data sheet's
      timing line reads "PTP and SyncE with OCXO and PPS/10M/ToD inputs". The coax type is not stated:
      std/smb@1 is seated because the jacks measure 4.8 mm across, which is the SMB's 4.83 in the
      registry and not the SMA's 6.35 (see gaps).
  vents:
    confidence: estimated
    note: >-
      The figure fills every space not taken by a cage, a strip or a jack with a hexagonal
      honeycomb: a 11.3 mm field between each pair of columns (seventeen of them, x from 29.6 mm,
      y 1.8 to 86.0 mm), a black column at the left of column one, a black block under the left
      plate and a 10 mm field at the right of column eighteen. The library's honeycomb tile is
      scaled to the figure's cell (about 4.4 mm across flats at the face, read at five times). The
      thin bands of cells above and below the strips (2.6 mm tall, under one cell) are not drawn.
  nameplate:
    confidence: estimated
    note: >-
      A light plate at the upper left, 15.0 x 43.9 mm, carries the maker's wordmark, turned to read
      upward, beside the ToD connector and the clock jacks, and a narrow plate at the lower left
      (5.4 x 24.4 mm) carries the model line turned to read upward. The wordmark is not drawn; its
      box is the `logo-zone` region. The model line is plain text and is drawn by the label
      component `arista/7280dr3a-model-plate`: figure C-1 prints "7280DR3AK-54" because it is a
      picture of the DR3AK-54, the encryption variant of this chassis, and the guide's one figure
      serves the DR3A-54, the DR3AK-54 and the DR3AM-54. The `ac-k` configuration places the `k`
      skin, which prints that line. The other configurations place the default skin, which reads
      7280DR3A-54, the plate of the device this file is named for. The M plate is not shown in the
      guide, so on `ac-m` the default line is a stand-in (see gaps).
  rear-layout:
    confidence: estimated
    note: >-
      FIGURE D-4, the rear with a plain separation between fans 1 and 2 and no ground, 2RU: four
      fan modules left of the middle and two power supplies stacked at the right. The guide draws
      four generic rear panels (D-1 to D-4) and does not say which model uses which. D-1 and D-2 are
      1RU. Of the 2RU pair, D-3 has an "Earth grounding pad" (callout 7) and D-4 has a plain
      separation between fans 1 and 2 with no ground. Table 6 of the guide says the DR3A-54 grounds
      with the KIT-GND-EXT-2RU kit on the SIDE of the chassis ("the grounding point is on the side of
      the chassis for the switches that support the KIT-GND-EXT-2RU grounding kit") where the
      DR3A-36 attaches directly at the rear, so the DR3A-54 is mapped to D-4. THE MAPPING IS
      ESTIMATED: it follows from fan count (four), height (2RU), supply count (two) and table 6, not
      from a caption. The data sheet's ordering information lists "KIT-GND-EXT-2RU ... (DR3A-54 Only)".
      MEASURED at 1.193 px/mm on the red fan frames (the same pixels as figure D-3): four modules
      79.6 wide on 98.0, 85.5 and 85.5 mm steps (the first step spans the separation), x 5.9,
      103.9, 189.4 and 274.9; supplies at x 361 (73.5 wide), top at 2.0 and 45.0 mm.
  separation:
    confidence: estimated
    note: >-
      A plain grey strip 15.0 mm wide between fans 1 and 2 (x 87.2 to 102.2), as figure D-4 draws
      it: no holes, no symbol. Where the 7280DR3A-36 has a grounding pad, this chassis has none on the
      rear: its grounding point is the side kit of table 6.
  field-replaceable-units:
    confidence: datasheet
    note: >-
      EVERY FAN MODULE AND POWER SUPPLY IS A BAY. The guide's appendix E: "All fans and power supplies
      are hot swappable" and "all slots must be filled or covered with a blank for operation". The
      data sheet's comparison table: "Hot-swap Power Supplies 2 (1+1 redundant)", "Hot-swappable Fans
      4 (N+1 redundant)", "Fan Tray FAN-7012H" and "Power Supplies PWR-3001 (AC or DC)". Nothing in the
      held documents draws a blank for either bay, so none is modelled. The supply and fan the
      DR3A-54 takes are front-to-rear (red) only: the data sheet lists "Airflow Direction: Front to
      Rear" and only the RED spares (PWR-3001-AC-RED, PWR-3001-DC-RED, FAN-7012H-RED). The guide's
      section 2.1 says a red handle is an air-exit module and a blue one an air-inlet module, so this
      switch is wholly red and has no airflow configuration.
  configurations:
    confidence: datasheet
    note: >-
      THREE ORDERABLE CONFIGURATIONS OF ONE FACE. The data sheet's ordering information for the
      7280DR3A-54 lists DCS-7280DR3A-54-F ("front to rear air, 2 x AC"), DCS-7280DR3AM-54-F
      ("TunnelSec") and DCS-7280DR3AK-54-F ("large routes and TunnelSec"), and the same three ending
      "#" ("configurable fans and psu"). The F orders are the only part numbers with a fixed build,
      so they are the orderable configurations. The "#" orders take their supplies and fans to
      order, which is how a DC build is bought (PWR-3001-DC-RED is a listed spare and table 4 lists
      PWR-3001-DC); there is no DC part number, so the DC build is a `kind: example` configuration,
      shown but not exported. The data sheet lists no secure-boot (S) variant of the 54, as it does
      for the DR3AK-36. Table 4 of the guide gives one figure (933 W typical, 1715 W maximum) for the
      DR3A-54, DR3AM-54 and DR3AK-54, so no configuration states a power of its own. The guide's
      Table 1 gives all three one size and weight; the data sheet's model comparison table differs
      only in the Encryption row (none, all ports, all ports).
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, 0 to 3,000 m, 5 to 90 percent
      non-condensing. The data sheet's environmental table gives the same operating and altitude
      figures and humidity, and a storage range of -40 to 70 C. The guide (the newer, 2025-05-16
      against 2025-04-15) is used for storage; the data sheet's is in `other` as written.
  lifecycle:
    confidence: estimated
    note: >-
      Searched for an end-of-sale notice for the 7280DR3A-54 (2026-10-22, a web search for "Arista
      7280DR3A-54 end of sale announcement"): none found for this family. The notices that exist
      are for other 7280 models (the DCS-7280CR3K-36S, advisory 23790, and the older 7280QR-C36 and
      QR-C72), so the field reads none-announced.
  weight:
    confidence: datasheet
    note: >-
      27.9 kg (61.6 lbs) in the guide's Table 1; the data sheet's comparison table prints "61.6 lbs
      (27.94 kg)". The same figure to rounding; 27.9 is used.
  size-conflict:
    confidence: datasheet
    note: >-
      The guide's Table 1 gives 48.3 x 8.8 x 76.4 cm and the data sheet "43.99 x 8.79 x 76.39 cm
      inc. handles". The first includes the rack ears (19 inch), the second is the body: the body is
      modelled (width 440.0, height 87.9, depth 763.9), as the library does for every rack device, and
      the figure's aspect (Gate 1) agrees with the body.
