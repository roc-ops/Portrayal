manufacturer: Arista
model: 7280SR3-48YC8
aliases:
  - {name: DCS-7280SR3-48YC8, kind: marketing}
portfolio: {line: 7000 Series, family: 7280SR3}
description: >-
  Arista 7280SR3-48YC8 - a fixed 1RU data-centre switch router with 48 x 1/10/25G SFP ports and 8 x 100G QSFP
  ports, running EOS. The front carries the SFP cages in two stacked rows of twelve columns on each side, the odd
  number on top, with the eight QSFP cages in two stacked rows of four columns between the two halves. Each SFP
  port has a status lamp under the lower row and each QSFP port four lamps above or below its cage. Four system
  lamps (system, fan, PS1, PS2) are at the top right. The rear carries two hot-swap 500 W power supplies at the ends
  and two hot-swap fan modules, with the RJ-45 management port, the USB port and the RJ-45 console port between the
  left supply and the first fan. The same panel is ordered with front-to-rear air (-F) or rear-to-front air (-R). It
  is sold as the 7280SR3-48YC8, as the 7280SR3K-48YC8 with more memory and routes, and as the 7280SR3K-48YC8A with an
  eight-core CPU.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7280R3 Series Quick Start Guide, Arista Networks, document DOC-07041-01, 63 pages, PDF created
      2025-05-16 (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280R3.pdf): Table 1
      (dimensions and weights), Table 2 (operating and storage), Table 3 (power input), Table 4 (power
      draw and supported supplies), section 2.1 (airflow orientation, handle colour), Table 5
      (grounding), section 4.5 (serial and management cables), Appendix A (status indicators, Tables 9
      to 13), Appendix C (Figure C-6, the front panel of the DCS-7280SR3-48YC8, 7280SR3K-48YC8 and
      7280SR3K-48YC8A), Appendix D (Figure D-1, the rear panel with two fan modules), Appendix E (field
      replacement). 7280 Data Center Switches Quick Start Guide, Arista Networks, 58 pages, PDF created
      2022-06-03 (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280_1RU_Gen3.pdf): Figure 52
      (DCS-7280SR3-48YC8 and 7280SR3K-48YC8), the cross-check of Figure C-6. 7280R3 Series Data Center
      Switch Router Data Sheet, Arista Networks, 03-0045-59, dated August 11th, 2025
      (https://www.arista.com/assets/data/pdf/Datasheets/7280R3-Data-Sheet.pdf): the model comparison of
      the 7280SR3-48YC8, SR3K-48YC8 and SR3K-48YC8A, the power supply specifications and the ordering
      information. Held and checked first: intake COVERAGE.md and SOURCES.md, which list no photograph,
      Visio stencil, 3D model or CAD file for this model (Arista publishes none; the stencil zip could
      not be fetched). The data sheet's picture of the face is a thumbnail. No drawing, photograph or
      logo is copied into the library, only transcribed facts and new drawings.
  gate-1-front:
    confidence: estimated
    note: >-
      Figure C-6 passes. The raster is 552 x 137 pixels; the body measures 552 px wide and 55 px tall (aspect
      10.0), against the data sheet's 440.0 / 43.5 = 10.1, so the figure is near-orthographic and carries
      geometry at 1.2545 px/mm (the 440 mm body is the scale anchor, its left edge read at 1 px). One pixel is
      0.8 mm, so every position is good to about 0.8 mm, and every one is `estimated` because it is read off a
      picture and no dimension states it. The old guide's Figure 52 is the same 552 x 137
      raster, compared pixel for pixel (no pixel differs), so it is a repeat of the source and not a second reading. The cages were read from
      the white port-number tabs in an eight-times enlargement.
  gate-1-rear:
    confidence: estimated
    note: >-
      Figure D-1 is a 553 x 141 px raster whose chassis is 551 px between its edges and 54 px tall (aspect
      10.2 against 10.1), 1.252 px/mm over the 440 mm body; positions are good to about 0.8 mm. The guide
      draws the rear generically (D-1 to D-4) and does not say which model uses which. The 7280SR3-48YC8 is
      mapped to D-1 by its two fan modules (data sheet: "Hot-swappable Fans 2 (1+1 redundant)"), its 1RU height,
      its two power supplies and its management ports at the rear (Figure C-6 has none at the front). THE
      MAPPING IS ESTIMATED.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 1: 48.3 x 4.4 x 46.7 cm (19 x 1.75 x 18.4 in), 9.2 kg (20.2 lbs), the same for the
      7280SR3-48YC8, 7280SR3K-48YC8 and 7280SR3K-48YC8A. Data sheet: 43.99 x 4.35 x 46.7 cm (17.3 x 1.72 x 18.38
      in), 20.2 lbs (9.18 kg). The width: 48.3 cm is over the mounting ears, so the body between them, which is
      what is modelled, is the data sheet's 43.99 cm (440.0 here), a 21.5 mm ear each side. THE HEIGHT IS THE DATA
      SHEET'S 43.5 (4.35 cm), not the 43.7 of the other 1RU 7280R3 models; the guide rounds every model to 4.4 cm.
      The depth is the data sheet's 467.0 (the guide's 46.7 cm). 1RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's Chapter 3 mounts the switch with the accessory-kit brackets and shows them in
      isometric drawings of a different switch ("Illustrations in this chapter depict the mounting of a
      DCS-7050QX-32S switch") that carry no measure. The data sheet lists the spares KIT-7001,
      KIT-2POST-1U-NT, KIT-4POST-NT, KIT-7001-4POST-L, KIT-7101, KIT-7101-RK, KIT-7101-LD-RK, KIT-ADJ-RLR and
      KIT-GND-EXT-1RU. No figure measures a bracket position, and the kit guides are not held, so no ear
      position is written and no rail kit is listed in chassis.kits. Recorded in the gap rack-ears.
  front-ports:
    confidence: estimated
    note: >-
      Figure C-6 at 1.2545 px/mm. Forty-eight SFP cages in two stacked rows (ports 1 to 48), twelve columns on
      each side of the QSFP block, in groups of six columns: the tab centres of ports 1, 3, ... 11 read 11.4,
      25.9, ... on a 14.25 mm pitch (the registry's ganged-SFP pitch, whose cages abut) with a 2.5 mm
      gap between the groups of six; ports 25 to 47 start 260.0 mm from the left. Eight QSFP100 cages in two
      stacked rows of four columns (49 to 56), centred 190.7, 209.6, 228.6 and 247.4 mm, a 19.0 mm pitch. The
      rows read from the tabs at 18.1 and 31.9 mm down, a row pitch of 13.8. The belly-to-belly orientation is
      the library's convention (upper cage upright, lower turned 180); the figure is too small to show the latch
      side.
  port-numbering:
    confidence: estimated
    note: >-
      Figure C-6 (callout 1, "Port numbers") prints 1 over 2, 3 over 4, and so on, 1 to 48 across the SFP columns
      and 49 over 50 to 55 over 56 across the QSFP columns, which sit between ports 24 and 25 in space and are
      numbered after 48. The odd number is the upper cage. The figure prints each number on a white tab over the
      cage opening; a seated cage hides what is painted under it, so the numerals are set in the band between the
      two rows, the odd number left of its column centre and the even one right of it. EOS interface names are not
      printed on the metal and are not modelled.
  port-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.2, Table 10 and Figure C-6 callout 6, "Port status LED (port 25)": each SFP column has two
      green lamps in the strip under the lower row, 5.8 mm apart and centred on the column; they are modelled as one
      lamp for each port of the column, the odd port's on the left. Each QSFP column has a group of four lamps above
      the upper cage and four below the lower one, 4.0 mm apart: four lamps a QSFP port are modelled. Table 10 gives
      one set of states, so every lamp carries it; what each of four means is the gap port-lamp-count, and which of
      the two SFP lamps names which port is the gap sfp-lamp-pairing.
  speed-strips:
    confidence: estimated
    note: >-
      Guide Figure C-6: a cyan band between the two rows under each group of six SFP columns and a lavender band
      under the QSFP block, with tiny legends. The bands are drawn in those colours at 23.9 to 25.9 mm down; the
      legends are unreadable and are not drawn. Two brass-coloured screw heads sit at the ends of the QSFP lamp strip.
  status-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.1, Table 9 and Figure C-6 callouts 2 to 5: a system status lamp (blinking green on power-up,
      green normal, blue locator, amber for two or more failed fans), a fan status lamp (green, amber for one module
      removed or failed, red for two or more) and a status lamp for each of the two power supplies (green operating,
      off removed or faulty). Four lamps in a row at 420.1, 423.8, 427.9 and 432.1 mm and 6.2 mm down, with a symbol
      or legend above each: a circled mark, a fan, and two legends read as PS1 and PS2.
  front-legend:
    confidence: estimated
    note: >-
      The model legend reads "7280SR3-48YC8" under the maker's wordmark at the top left (read at 552 px; the print is
      small). THE WORDMARK IS NOT DRAWN: a logo-zone region is reserved over it and the plain model text is set. The
      text is as the guide's caption names the model.
  vents:
    confidence: estimated
    note: >-
      The figure shows a perforated grid along the top (1.2 to 11.6 mm down) in four fields, with solid strips at 87 to
      93 mm and over the QSFP block, and a row of tiny holes along the bottom lip (about 42 mm down). Each field is
      drawn in its measured extent; the individual squares are not drawn one by one.
  rear:
    confidence: estimated
    note: >-
      Figure D-1 at 1.252 px/mm, the rear seen from behind with x = 0 at the left of the drawing. PS1 is the left and
      PS2 the right (callouts 1 and 6). Each power supply module is 73.5 mm wide (the data sheet's "73.5MM") at 4.4 and
      361.5 mm across and 1.85 mm down. The management block is a grey plate 82.5 to 100.5 mm across with the Ethernet
      management port, the USB port and the RJ-45 console port stacked in it, in the order the library draws other
      Arista management stacks. Two fan modules 78.6 mm wide at 105.7 and 276.6 mm across and 2.55 mm down. Between
      the fans is a grey plate printed with ASSY NUMBER, SERIAL NUMBER and MAC ADDRESS fields and, under them, PS1 and
      PS2 legends beside airflow arrows (the arrows are not drawn).
  rear-fan:
    confidence: datasheet
    note: >-
      Data sheet: "Hot-swappable Fans 2 (N+1 redundant)", "Fan Tray FAN-7011M" and the spares FAN-7011M-F (front-to-rear)
      and FAN-7011M-R (rear-to-front). Guide section 2.1: a red handle is an air-exit module and a blue handle an
      air-inlet one, and every module must have the same direction. The two fan modules are bays that accept
      FAN-7011M-F or -R; the -R configurations seat the blue modules.
  fru-bays:
    confidence: datasheet
    note: >-
      Guide Appendix E (E.2 power supplies, E.3 fan modules) gives removal and installation procedures, and the data sheet
      calls the supplies "1+1 hot-swappable" and the fans "hot-swap". SO THE TWO POWER SUPPLIES AND THE TWO FAN MODULES ARE
      BAYS. Nothing on this chassis is a built-in unit. The management block, the USB port and the console port are part of
      the chassis and are placements.
  power:
    confidence: datasheet
    note: >-
      Guide Table 4: typical / maximum 155 W / 325 W for the 7280SR3-48YC8 and 7280SR3K-48YC8, and 162 W / 338 W for the
      7280SR3K-48YC8A, each with PWR-511-AC or PWR-511-DC. The data sheet gives 154 W / 324 W for the first two and 162 W
      / 338 W for the A (gap `size-conflict`); the guide's figures are used and the typical is "measured at 25C ambient
      with 50% load on all ports". The device carries 155 W / 325 W, the figure of the 7280SR3-48YC8 and the 7280SR3K-48YC8,
      and the two 7280SR3K-48YC8A configurations state 162 W / 338 W in their own attrs.
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, altitude 0 to 3,000 m, humidity 5 to 90 percent
      non-condensing. Data sheet: operating 0 to 40 C, storage -40 to 70 C, humidity 5 to 95 percent, altitude 0 to 3,000
      m. Storage temperature and humidity differ: gap `environment`, the guide's used.
  configurations:
    confidence: datasheet
    note: >-
      Data sheet ordering information: DCS-7280SR3-48YC8-F and -R, DCS-7280SR3K-48YC8-F and -R, and
      DCS-7280SR3K-48YC8A-F and -R ("front to rear air, 2 x AC" and "rear to front air, 2 x AC"). The "#" SKUs ("configurable
      fans and psu") are orders of parts, not part numbers a DCIM can hold, and are not listed. The data sheet lists no DC
      build of the switch: the PWR-511-DC-RED and -BLUE supplies are spares, so the DC configurations are examples with no
      part number. The K and K-A builds share the base model's size, weight, figure and supplies and differ in memory, CPU,
      SSD and routes (and, for the A, power draw); each is a configuration with its own part number, each states its own
      memory in attrs, and the two A configurations state their own power, CPU, SSD and minimum EOS too (data sheet, model
      comparison of the 7280SR3-48YC8, SR3K-48YC8 and SR3K-48YC8A). There is no empty-bay (-S) configuration: no -S suffix
      exists in this family and the guide draws no
      blank for a power supply or fan module.
  interface-names:
    confidence: datasheet
    note: >-
      Not printed and not modelled. EOS names ports Ethernet1 to Ethernet56 and Management1; this is the vendor's convention
      and no held document prints it.
  colour:
    confidence: estimated
    note: >-
      The front plate is the 7280CR3-32D4's #aaabad, read there as the median of bare-plate pixels in the guide's figure of
      the same family.
  lifecycle:
    confidence: estimated
    note: >-
      Searched 2026-10-23 (web searches of Arista's end-of-sale notices). Notice 23789, "End of Sale of the Arista DCS-7280SR3K-48YC8
      Series" (https://www.arista.com/en/support/advisories-notices/end-of-sale/23789-end-of-sale-of-the-arista-dcs-7280sr3k-48yc8-series),
      announced April 10, 2026, covers the SKUs -F, -R, # and -F-DC of the 7280SR3K-48YC8, with the last date to order October 10, 2026,
      end of life October 10, 2031, and the 7280SR3K-48YC8A as the suggested replacement. It names neither the 7280SR3-48YC8 nor the
      7280SR3K-48YC8A, and no notice for those was found, so the device records the announcement and this note says which build it
      covers: the K builds (k-f and k-r) only.
  other-faces:
    confidence: datasheet
    note: >-
      No source draws the top, bottom or sides flat. The guide's installation figures are isometric. Each carries an `empty`
      sentence. The 1RU grounding point is on the bottom of the chassis (guide section 4.2, Table 5, KIT-GND-EXT-1RU); no
      figure measures it.
attrs:
  physical:
    weight: 9.2 kg (20.2 lbs) for the 7280SR3-48YC8, 7280SR3K-48YC8 and 7280SR3K-48YC8A (guide Table 1, data sheet 9.18 kg)
    size-over-ears: 48.3 x 4.4 x 46.7 cm (19 x 1.75 x 18.4 in) with the mounting ears (guide Table 1)
  performance:
    throughput: 2.0 (4.0) Tbps
    packets-per-second: 1 Bpps
    latency: from 3.8 microseconds
    packet-buffer: 4 GB
    ports-max-speed: eight ports of 100 Gbps; 16 of 50 Gbps; 8 of 40 Gbps; 80 of 25 or 10 Gbps; 48 of 1 Gbps
    interfaces-max: 80
  power:
    power-typical-w: 155
    power-max-w: 325
    power-envelope: as-tested
    power-measure: guide Table 4 typical and maximum; the data sheet says typical is measured at 25 C ambient with 50 percent load on all ports
    psu-redundancy: 1+1
    input-ac: 100 - 240 VAC (PWR-511-AC), IEC 60320 C14
    input-dc: -48 to -60 VDC (PWR-511-DC)
    efficiency: 93 percent (Platinum) AC, 92 percent DC (data sheet)
  thermal:
    airflow: front-to-rear or rear-to-front, set by the fan modules and supplies fitted
    fan-redundancy: 2 hot-swap fan modules, N+1
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -25 to 70 C (guide Table 2); the data sheet says -40 to 70 C
    humidity: 5 to 90 percent non-condensing (guide Table 2); the data sheet says 5 to 95 percent
    altitude: 0 to 3,000 m (10,000 ft) operating
  platform:
    cpu: Quad-Core x86 (7280SR3-48YC8 and 7280SR3K-48YC8); Eight-Core x86 (7280SR3K-48YC8A)
    memory: 8 GB (7280SR3-48YC8); 64 GB (7280SR3K-48YC8 and -48YC8A)
    storage: 8 GB flash (not on the 7280SR3K-48YC8A); 120 GB SSD on the K builds, none on the 7280SR3-48YC8
  features:
    optics-sfp28: 1G, 10G and 25G, in the 48 SFP cages (data sheet)
    optics-qsfp28: 100G, 50G, 40G, 25G and 10G with breakout, in the eight QSFP cages (data sheet)
    eos-license: license group G2; minimum EOS 4.26.0 (7280SR3-48YC8), 4.25.1 (7280SR3K-48YC8), 4.27.2 (7280SR3K-48YC8A)
  management:
    console: RJ-45 RS-232 serial on the rear, 9600 baud 8N1, no flow control
    oob: one 10/100/1000 management port on the rear
    usb: one USB port on the rear, for software or configuration updates
  compliance:
    emc: FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386
    safety: EN 62368-1, IEC 62368-1, CSA/UL 62368-1
    certifications: BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI, TEC, ANATEL, ICASA (data sheet)
    rohs: RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)
  lifecycle:
    eol: announced
    eol-announcement: https://www.arista.com/en/support/advisories-notices/end-of-sale/23789-end-of-sale-of-the-arista-dcs-7280sr3k-48yc8-series
    end-of-sale: '2026-10-10'
    end-of-life: '2031-10-10'
