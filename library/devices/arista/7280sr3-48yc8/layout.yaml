gaps:
  - what: size-conflict
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      Typical / maximum power 155 W / 325 W (guide Table 4) against 154 W / 324 W (data sheet) for the 7280SR3-48YC8 and
      7280SR3K-48YC8. The two documents agree for the 7280SR3K-48YC8A. The guide's figures are used.
    wanted: the maker's statement of which is current.
  - what: environment
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet), and relative humidity 5 to 90 percent
      against 5 to 95 percent. The guide's, the older document by three months, are in attrs.
    wanted: the maker's statement of which is current.
  - what: rack-ears
    scope: [front]
    reason: needs-drawing
    note: >-
      The guide's Figures 3-1 to 3-4 are isometric drawings of another switch and carry no measure, and the kit guides for
      KIT-7001, KIT-7101 and the other spares are not held, so no ear position or rail kit is written.
    wanted: a dimensioned drawing of the mounting bracket position, and the kit guides.
  - what: port-lamp-count
    scope: [front]
    reason: needs-photo
    note: >-
      Figure C-6 draws four dots a QSFP port, but Table 10 describes one port LED and does not say what each of the four shows.
      All four are given Table 10's states.
    wanted: the guide's account of the port lamps, or a photograph of the lit face.
  - what: sfp-lamp-pairing
    scope: [front]
    reason: needs-photo
    note: >-
      Figure C-6 draws two lamps under each SFP column. Which belongs to the upper port and which to the lower is not stated;
      the odd port is given the left lamp.
    wanted: a photograph of the lit face.
  - what: front-legends
    scope: [front]
    reason: needs-photo
    note: >-
      The speed bands' legends, the small print over the cages, the system and fan lamp glyphs and the PS1 and PS2 legends are
      unreadable or barely readable in the 552 px figure. The glyphs and the two PS legends are drawn as read; the band and
      cage legends are not drawn.
    wanted: a photograph of the face.
  - what: cage-orientation
    scope: [front]
    reason: needs-photo
    note: >-
      Which side the latches of the stacked cages face is not visible in the figure. The library's belly-to-belly convention is
      used (upper cage upright, lower turned 180).
    wanted: a photograph of the stacked cages.
  - what: rear-mgmt-block
    scope: [rear]
    reason: needs-photo
    note: >-
      The management block's arrow marks and its console symbol are drawn as the 7280CR3-32D4 draws them; the order of the three
      ports follows the datasheet's rear view and the library's other Arista stacks, and the figure's 1.25 px/mm resolves it only
      as three stacked ports.
    wanted: a photograph of the rear management block.
  - what: psu-dc-face
    scope: [rear]
    reason: needs-drawing
    note: >-
      The PWR-511-DC supplies are drawn as the AC supply's housing with a plain two-pole terminal block. The guide shows a DC
      supply only in isometric figures; the real terminal arrangement is not drawn.
    wanted: a flat drawing or photograph of the PWR-511-DC.
  - what: module-power
    scope: [rear]
    reason: vendor-silent
    note: >-
      The guide's power tables and the data sheet give whole-switch figures only; the fan modules' missing power figure (lint L27)
      stands. The supplies state their output.
    wanted: FAN-7011M power draw.
  - what: grounding
    scope: [bottom]
    reason: needs-drawing
    note: >-
      The 1RU grounding point is on the bottom of the chassis for KIT-GND-EXT-1RU (guide section 4.2, Table 5, Figure 4-2). No flat
      figure measures it, so it is not placed.
    wanted: a flat drawing of the bottom with the grounding bracket holes.
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
    description: >-
      The 48 SFP ports (1, 10 and 25G), numbered 1 to 48 as printed; the odd numbers are the upper cages
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      The eight 100G QSFP ports, numbered 49 to 56 as printed; the odd numbers are the upper cages
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      a status lamp for each SFP port under the lower row, and four for each QSFP port above an upper cage and below a lower one
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system, fan and two power supply lamps at the top right of the front
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      how the switch is reached out of band - the 10/100/1000 management port, the USB port and the RS-232
      console port, stacked in one block at the left of the rear panel
