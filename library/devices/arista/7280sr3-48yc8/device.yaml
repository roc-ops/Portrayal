configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis with two AC supplies and two fan modules fitted, front-to-rear air, before any part
      number: the shape every build below starts from.
  f:
    kind: orderable
    description: >-
      The 7280SR3-48YC8 with two AC supplies and front-to-rear air: PWR-511-AC-RED supplies and FAN-7011M-F
      fan modules, all with red handles. Ordered as DCS-7280SR3-48YC8-F.
    attrs:
      platform: {memory: 8 GB}
    part-numbers:
      DCS-7280SR3-48YC8-F: {}
  r:
    kind: orderable
    airflow: back-to-front
    description: >-
      The 7280SR3-48YC8 with two AC supplies and rear-to-front air: PWR-511-AC-BLUE supplies and FAN-7011M-R
      fan modules, all with blue handles. Ordered as DCS-7280SR3-48YC8-R.
    attrs:
      platform: {memory: 8 GB}
    bays: {psu-1: arista/7280r3-pwr-500-ac-rev@1, psu-2: arista/7280r3-pwr-500-ac-rev@1, fan-1: arista/7280r3-fan-m-rev@1,
      fan-2: arista/7280r3-fan-m-rev@1}
    part-numbers:
      DCS-7280SR3-48YC8-R: {}
  k-f:
    kind: orderable
    description: >-
      The 7280SR3K-48YC8, the same hardware with 64 GB of memory, an SSD and the large-routes licence,
      with front-to-rear air. Ordered as DCS-7280SR3K-48YC8-F.
    attrs:
      platform: {memory: 64 GB}
    part-numbers:
      DCS-7280SR3K-48YC8-F: {}
  k-r:
    kind: orderable
    airflow: back-to-front
    description: The 7280SR3K-48YC8 with rear-to-front air. Ordered as DCS-7280SR3K-48YC8-R.
    attrs:
      platform: {memory: 64 GB}
    bays: {psu-1: arista/7280r3-pwr-500-ac-rev@1, psu-2: arista/7280r3-pwr-500-ac-rev@1, fan-1: arista/7280r3-fan-m-rev@1,
      fan-2: arista/7280r3-fan-m-rev@1}
    part-numbers:
      DCS-7280SR3K-48YC8-R: {}
  k-a-f:
    kind: orderable
    description: >-
      The 7280SR3K-48YC8A, the K build with an eight-core CPU, with front-to-rear air. Ordered as DCS-7280SR3K-48YC8A-F.
    export-description: >-
      Arista 7280SR3K-48YC8A - a fixed 1RU data-centre switch router with 48 x 1/10/25G SFP ports and
      8 x 100G QSFP ports, the K build with an eight-core CPU, running EOS
    attrs:
      power: {power-typical-w: 162, power-max-w: 338}
      platform: {cpu: Eight-Core x86, memory: 64 GB, storage: 120 GB SSD (no flash storage)}
      features: {eos-license: license group G2; minimum EOS 4.27.2}
    part-numbers:
      DCS-7280SR3K-48YC8A-F: {}
  k-a-r:
    kind: orderable
    airflow: back-to-front
    description: The 7280SR3K-48YC8A with rear-to-front air. Ordered as DCS-7280SR3K-48YC8A-R.
    export-description: >-
      Arista 7280SR3K-48YC8A - a fixed 1RU data-centre switch router with 48 x 1/10/25G SFP ports and
      8 x 100G QSFP ports, the K build with an eight-core CPU, running EOS
    attrs:
      power: {power-typical-w: 162, power-max-w: 338}
      platform: {cpu: Eight-Core x86, memory: 64 GB, storage: 120 GB SSD (no flash storage)}
      features: {eos-license: license group G2; minimum EOS 4.27.2}
    bays: {psu-1: arista/7280r3-pwr-500-ac-rev@1, psu-2: arista/7280r3-pwr-500-ac-rev@1, fan-1: arista/7280r3-fan-m-rev@1,
      fan-2: arista/7280r3-fan-m-rev@1}
    part-numbers:
      DCS-7280SR3K-48YC8A-R: {}
  dc-f:
    kind: example
    power: dc
    description: >-
      Two DC supplies and front-to-rear air: PWR-511-DC-RED supplies and FAN-7011M-F fan modules. The
      data sheet lists no DC part number for the switch; the supplies are spares, and a DC build is ordered
      through the "#" configurable SKUs.
    bays: {psu-1: arista/7280r3-pwr-500-dc@1, psu-2: arista/7280r3-pwr-500-dc@1}
  dc-r:
    kind: example
    power: dc
    airflow: back-to-front
    description: >-
      Two DC supplies and rear-to-front air: PWR-511-DC-BLUE supplies and FAN-7011M-R fan modules. No
      DC part number is listed for the switch.
    bays: {psu-1: arista/7280r3-pwr-500-dc-rev@1, psu-2: arista/7280r3-pwr-500-dc-rev@1, fan-1: arista/7280r3-fan-m-rev@1,
      fan-2: arista/7280r3-fan-m-rev@1}
