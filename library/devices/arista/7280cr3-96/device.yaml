description: >-
  Arista 7280CR3-96 - a fixed 2RU data-centre switch router with 96 x 100G QSFP ports, running EOS. The
  front carries the cages in three rows: a top row of sixteen single cages numbered 81 to 96, and below
  it two rows of stacked cages, each ten blocks of two columns, numbered 1 to 40 and 41 to 80, the odd
  number on top in each block. Four system lamps (system, fan, PS1, PS2), the RJ-45 console port, the
  USB port and the RJ-45 Ethernet management port are at the top right. The rear carries two hot-swap
  2400 W power supplies one above the other at the right, four hot-swap fan modules, and a grounding strip
  between the first and second fan. Air flows front to rear. It is sold as the 7280CR3-96 and, with more
  memory and routes, as the 7280CR3K-96.
