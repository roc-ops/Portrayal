  reason: >-
    A RECORDED READING (provenance.front-ports). The guide's Figure C-8 does not draw the three rows as
    one stack. The top row (81 to 96) is a row of single cages with its own yellow outline, and the two
    block rows are each outlined as one two-high block of cages (1 over 2, 41 over 42) with a gap of 14.1
    mm, not the 15.8 mm of a block's own rows, between the lower cage of the upper block row and the upper
    cage of the lower one. So the pair a rule sees across the top row and the first block row, and across
    the two block rows, is two neighbouring stacks and not one belly-to-belly stack. Each block's own
    rows are turned 0 over 180 and are not excepted. A photograph of the face overturns it.
provenance:
  sources:
    confidence: datasheet
    note: >-
      7280R3 Series Quick Start Guide, Arista Networks, document DOC-07041-01, 63 pages, PDF created 2025-05-16
      (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280R3.pdf): Table 1 (dimensions and weights),
      Table 2 (operating and storage), Table 3 (power input), Table 4 (power draw and supported supplies),
      section 2.1 (airflow orientation, handle colour), Table 6 (grounding of the 2RU switches), section
      4.5 (serial and management cables), Appendix A (status indicators, Tables 9 to 13), Appendix C (Figure
      C-8, the front panel of the DCS-7280CR3-96 and 7280CR3K-96), Appendix D (Figure D-3, the rear panel
      with ground attach point, 2RU), Appendix E (field replacement). 7280R3 Series Data Center Switch
      Router Data Sheet, Arista Networks, 03-0045-59, dated August 11th, 2025 (https://www.arista.com/assets/data/pdf/Datasheets/7280R3-Data-Sheet.pdf):
      the model comparison of the 7280CR3-96 and 7280CR3K-96, the power supply specifications and the
      ordering information. The 2022 7280 1RU Gen 3 guide (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280_1RU_Gen3.pdf)
      does not list this model, so Figure C-8 has no second reading. Held and checked first: intake COVERAGE.md
      and SOURCES.md, which list no photograph, Visio stencil, 3D model or CAD file for this model (Arista
      publishes none; the stencil zip could not be fetched). The data sheet's picture of the face is a
      thumbnail. No drawing, photograph or logo is copied into the library, only transcribed facts and
      new drawings.
  gate-1-front:
    confidence: estimated
    note: >-
      Figure C-8 passes. The raster is 552 x 190 pixels; the chassis measures 552 px wide and 110 px tall
      (aspect 5.0), against the data sheet's 440.0 / 87.9 = 5.0, so the figure is orthographic and carries
      geometry at 1.2545 px/mm (the 440 mm body is the scale anchor, its left edge read at 1 px and its
      top at 37 px). One pixel is 0.8 mm, so every position is good to about 0.8 mm, and every one is
      `estimated` because it is read off a picture and no dimension states it. The cages were read from
      the white port-number tabs in an eight-times enlargement.
  gate-1-rear:
    confidence: estimated
    note: >-
      Figure D-3 is a 565 x 197 px raster whose chassis is 528 px between its edges and 106 px tall (aspect
      4.98 against 5.0), 1.2 px/mm over the 440 mm body; it passes. The guide draws the rear generically
      (D-1 to D-4) and does not say which model uses which. The 7280CR3-96 is mapped to D-3 by its four
      fan modules (data sheet: "Hot-swappable Fans 4 (N+1 redundant)"), its 2RU height, its two power
      supplies and the guide's Table 6, which says the 2RU switches' grounding "location is on the back
      for those supporting direct attach" and lists the CR3-96 as "Attach directly". The positions are
      those the 7280DR3A-36 file measured off the same figure. THE MAPPING IS ESTIMATED.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 1: 48.3 x 8.8 x 76.1 cm (19 x 3.50 x 30.0 in), 23.6 kg (52.0 lbs), the same for the
      7280CR3-96 and the 7280CR3K-96. Data sheet: 43.99 x 8.79 x 76.1 cm (17.3 x 3.46 x 29.96 in), 52
      lbs (23.6 kg). The width: 48.3 cm is over the mounting ears, so the body between them, which is
      what is modelled, is the data sheet's 43.99 cm (440.0 here), a 21.5 mm ear each side. The height
      is the data sheet's 87.9. The depth is the data sheet's 761.0. 2RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's chapter 3 mounts the 2RU switch with the accessory-kit brackets in isometric
      drawings that carry no measure. The data sheet lists the spares KIT-2POST, KIT-7202 and KIT-7004-2UL.
      No figure measures a bracket position, and the kit guides are not held, so no ear position is written
      and no rail kit is listed in chassis.kits. Recorded in the gap rack-ears.
  front-ports:
    confidence: estimated
    note: >-
      Figure C-8 at 1.2545 px/mm, read in an eight-times enlargement. Ninety-six QSFP100 cages in three
      rows. The top row is sixteen single cages (81 to 96) in blocks of two columns, the first centred
      22.6 mm from the left, with 4.5 mm gaps between the pairs of columns (the tab centres of 81 and
      82 read 22.6 and 41.0, of 83 at 63.9, of 96 at 331.0). Below it are two rows of ten blocks, each
      block two columns of two stacked cages (1 and 2 over 3 and 4): the tabs read 22.6 and 41.0 mm for
      the first block, 63.9 and 82.6 for the second, and 415.6 for port 39, so the column pitch is 19.0
      (the registry's ganged-QSFP pitch) inside a block and 3.45 mm more between blocks, the same in all
      three rows. The rows read from the tabs at 10.1, 30.8, 46.6, 60.7 and 76.5 mm down for the top row
      and the four cage rows: the upper block's rows are 15.8 mm apart, the lower block's likewise, and
      the two blocks 14.1 mm apart. The belly-to-belly orientation of each stack is the library's convention
      (upper cage upright, lower turned 180); the figure is too small to show the latch side.
  port-numbering:
    confidence: estimated
    note: >-
      Figure C-8 (callout 9, "Port numbers") prints 1 over 2 and 3 over 4 in each block and so on, 1 to
      40 across the first block row and 41 to 80 across the second, and 81 to 96 left to right along the
      top row. The odd number is the upper cage. The figure prints each number on a white tab over the
      cage opening; a seated cage hides the tab, so the model prints the numerals in the band between
      the rows (the odd number left of its column centre and the even one right of it) and under the top
      row. EOS interface names are not printed on the metal and are not modelled.
  port-lamps:
    confidence: estimated
    note: >-
      NOT MODELLED. Guide Appendix A.1.2, Table 10 says port LEDs sit near their ports (off link down,
      green link up, yellow software disabled, flashing yellow failed diagnostics), but Figure C-8 draws
      no lamp a reader can count beside any cage. Recorded in the gap port-lamps.
  speed-strips:
    confidence: estimated
    note: >-
      Guide Figure C-8 callout 1, "Port speed groups": purple and blue strips above the top row and between
      the two block rows, with tiny legends. The strips are drawn in those colours; the legends are unreadable
      and are not drawn.
  status-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.1, Table 9 and Figure C-8 callouts 2 to 5: a system status lamp (blinking green
      on power-up, green normal, blue locator, amber for two or more failed fans), a fan status lamp (green,
      amber for one module removed or failed, red for two or more) and a status lamp for each of the two
      power supplies (green operating, off removed or faulty). Four lamps in a row at 356.6, 361.4, 366.3
      and 371.3 mm and 18.6 mm down, on a small grey plate (353.9 to 374.5 mm across), with a symbol or
      legend above each: a circled mark, a fan, and two legends read as PS1 and PS2.
  management-ports:
    confidence: estimated
    note: >-
      Figure C-8 callouts 6 to 8: the console port (serial, left), the USB port (middle) and the Ethernet
      management port (right), in a row at the top right on a grey strip printed with their symbols, 5.8
      to 19.4 mm down. Placed as the library places the 7280DR3A-36's row, with the USB port upright.
      The symbols are a console box, a USB trident and a double arrow.
  front-legend:
    confidence: estimated
    note: >-
      The model legend reads "7280CR3-96" at the bottom left (read at 552 px; the print is small), under
      the maker's wordmark at the top left. THE WORDMARK IS NOT DRAWN: a logo-zone region is reserved
      over it and the plain model text is set. The text is as the guide's caption names the model.
  vents:
    confidence: estimated
    note: >-
      The figure shows a grid of dark squares along the left edge, along the right edge and between the
      lamp plate and the top row, and a ribbed strip along the bottom lip. A dark hole sits at the lower
      left (5.2 mm across, 43.8 mm down). Each is drawn in its measured extent; the individual squares
      are not drawn one by one.
  rear:
    confidence: estimated
    note: >-
      Figure D-3 at 1.2 px/mm, as the 7280DR3A-36 file reads it: four fan modules 79.6 mm wide and 81.5
      mm tall at 5.9, 103.9, 189.4 and 274.9 mm across, a grounding strip 15.0 mm wide at 87.2 mm between
      the first and second fan with two ground screws and an earth symbol, and the two power supplies
      one above the other at 361.0 mm across (2.0 and 45.0 mm down, 73.5 mm wide, the data sheet's "73.5MM").
      The guide's figure D-3 callout 7 names the "Earth grounding pad".
  rear-fan:
    confidence: datasheet
    note: >-
      Data sheet: "Hot-swappable Fans 4 (N+1 redundant)", "Fan Tray FAN-7012H" and the spare FAN-7012H-RED
      (front-to-rear airflow); no reverse-airflow 2RU fan is listed and the airflow is "Front to rear".
      Guide section 2.1: a red handle is an air-exit module. The four fan modules are bays that accept
      the FAN-7012H-RED.
  fru-bays:
    confidence: datasheet
    note: >-
      Guide Appendix E (E.2 power supplies, E.3 fan modules) gives removal and installation procedures,
      and the data sheet calls the supplies "1+1 hot-swappable" and the fans "hot-swap". SO THE TWO POWER
      SUPPLIES AND THE FOUR FAN MODULES ARE BAYS. Nothing on this chassis is a built-in unit. The management
      ports are part of the chassis and are placements on the front.
  power:
    confidence: datasheet
    note: >-
      Guide Table 4: typical / maximum 1003 W / 1803 W for the 7280CR3-96 and the 7280CR3K-96, each with
      PWR-2411-AC or PWR-2411-DC. The data sheet states the same figures with typical "measured at 25C
      ambient with 50% load on all ports".
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, altitude 0 to 3,000 m, humidity 5 to 90
      percent non-condensing. Data sheet: operating 0 to 40 C, storage -40 to 70 C, humidity 5 to 95 percent,
      altitude 0 to 3,000 m. Storage temperature and humidity differ: gap `environment`, the guide's used.
  configurations:
    confidence: datasheet
    note: >-
      Data sheet ordering information: DCS-7280CR3-96-F and DCS-7280CR3K-96-F ("front to rear air, 2 x
      AC"). The "#" SKUs ("configurable fans and psu") are orders of parts, not part numbers a DCIM can
      hold, and are not listed. The data sheet lists no DC build of the switch: the PWR-2411-DC-RED supply
      is a spare, so the DC configuration is an example with no part number. The K build shares the base
      model's size, weight, figure and supplies and differs in the large-routes licence, which its export
      description states; it is a configuration with its own part number. There is no empty-bay (-S) configuration:
      no -S suffix exists in this family and the guide draws no blank for a power supply or fan module.
      No rear-to-front build is listed.
  interface-names:
    confidence: datasheet
    note: >-
      Not printed and not modelled. EOS names ports Ethernet1 to Ethernet96 and Management1; this is the
      vendor's convention and no held document prints it.
  colour:
    confidence: estimated
    note: >-
      The front plate is the 7280CR3-32D4's #aaabad, read there as the median of bare-plate pixels in
      the guide's figure of the same family.
  lifecycle:
    confidence: estimated
    note: >-
      Searched 2026-10-23 (web searches of Arista's end-of-sale notices) for a notice for the 7280CR3-96
      and 7280CR3K-96: none found. The notices the searches returned were for older 7280 models and for
      the 7280SR3K-48YC8 (notice 23789) and 7280CR3K-36S (notice 23790) series, not for this one.
  other-faces:
    confidence: datasheet
    note: >-
      No source draws the top, bottom or sides flat. The guide's installation figures are isometric. Each
      carries an `empty` sentence. Table 6 puts the 2RU grounding on the back (attach directly, right-angle
      lug recommended); the guide's figure 4-3 shows a side-attach adapter this model does not take.
attrs:
  physical:
    weight: 23.6 kg (52.0 lbs) for the 7280CR3-96 and the 7280CR3K-96 (guide Table 1, data sheet)
    size-over-ears: 48.3 x 8.8 x 76.1 cm (19 x 3.50 x 30.0 in) with the mounting ears (guide Table 1)
  performance:
    throughput: 9.6 (19.2) Tbps
    packets-per-second: 4 Bpps
    latency: from 3.8 microseconds
    packet-buffer: 16 GB
    ports-max-speed: 96 ports of 100 Gbps; 192 of 50 Gbps; 96 of 40 Gbps; 192 of 25 or 10 Gbps
    interfaces-max: 192
  power:
    power-typical-w: 1003
    power-max-w: 1803
    power-envelope: as-tested
    power-measure: typical at 25 C ambient with 50 percent load on all ports (data sheet)
    psu-redundancy: 1+1
    input-ac: 200 - 240 VAC (PWR-2411-AC), IEC 60320 C20
    input-dc: -48 to -60 VDC (PWR-2411-DC)
    efficiency: 93 percent (Platinum) AC, 94 percent DC (data sheet)
  thermal: {airflow: 'front-to-rear, set by the fan modules and supplies fitted', fan-redundancy: '4 hot-swap
      fan modules, N+1'}
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -25 to 70 C (guide Table 2); the data sheet says -40 to 70 C
    humidity: 5 to 90 percent non-condensing (guide Table 2); the data sheet says 5 to 95 percent
    altitude: 0 to 3,000 m (10,000 ft) operating
  platform: {cpu: Quad-Core x86, memory: 64 GB, storage: 8 GB flash; 120 GB SSD}
  features:
    optics-qsfp28: 100G, 50G, 40G, 25G and 10G with breakout, in the 96 QSFP cages (data sheet)
    eos-license: license group G4; minimum EOS 4.24.0
  management:
    console: RJ-45 RS-232 serial on the front, 9600 baud 8N1, no flow control
    oob: one 10/100/1000 management port on the front
    usb: one USB port on the front, for software or configuration updates
  compliance:
    emc: >-
      FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386
    safety: EN 62368-1, IEC 62368-1, CSA/UL 62368-1
    certifications: BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI, TEC, ANATEL, ICASA (data sheet)
    rohs: RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)
  lifecycle: {eol: none-announced}
