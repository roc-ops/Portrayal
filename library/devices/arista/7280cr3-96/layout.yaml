configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis with two AC supplies and four fan modules fitted, front-to-rear air, before any part number: the shape every build below
      starts from.
  f:
    kind: orderable
    description: >-
      The 7280CR3-96 with two AC supplies and front-to-rear air: PWR-2411-AC-RED supplies and FAN-7012H-RED fan modules, all with red
      handles. Ordered as DCS-7280CR3-96-F.
    part-numbers:
      DCS-7280CR3-96-F: {}
  k-f:
    kind: orderable
    description: >-
      The 7280CR3K-96, the same hardware with the large-routes licence, with front-to-rear air. Ordered as DCS-7280CR3K-96-F.
    export-description: >-
      Arista 7280CR3K-96 - the large-routes build of the 7280CR3-96, a fixed 2RU data-centre switch router with 96
      x 100G QSFP ports, running EOS
    part-numbers:
      DCS-7280CR3K-96-F: {}
  dc-f:
    kind: example
    power: dc
    description: >-
      Two DC supplies and front-to-rear air: PWR-2411-DC-RED supplies and FAN-7012H-RED fan modules. The data sheet lists no DC part number for
      the switch; the supplies are spares, and a DC build is ordered through the "#" configurable SKUs.
    bays:
      psu-1: arista/7280dr3a-pwr-2400-dc@1
      psu-2: arista/7280dr3a-pwr-2400-dc@1
