gaps:
  - what: environment
    scope: [front, rear]
    reason: sources-disagree
    note: >-
      Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet), and relative humidity 5 to 90 percent against 5 to
      95 percent. The guide's, the older document by three months, are in attrs.
    wanted: the maker's statement of which is current.
  - what: rack-ears
    scope: [front]
    reason: needs-drawing
    note: >-
      The guide's chapter 3 figures are isometric drawings and carry no measure, and the kit guides for KIT-7202, KIT-2POST and KIT-7004-2UL
      are not held, so no ear position or rail kit is written.
    wanted: a dimensioned drawing of the mounting bracket position, and the kit guides.
  - what: port-lamps
    scope: [front]
    reason: needs-photo
    note: >-
      Guide table 10 describes port LEDs near the ports and Figure C-8 draws no lamp whose count or place can be read. No port lamp is modelled.
    wanted: a photograph of the lit face, or a larger figure.
  - what: front-legends
    scope: [front]
    reason: needs-photo
    note: >-
      The speed strips' legends, the small print over the cages, the system and fan lamp glyphs and the PS1 and PS2 legends are unreadable or
      barely readable in the 552 px figure. The glyphs and the two PS legends are drawn as read; the strip and cage legends are not drawn.
    wanted: a photograph of the face.
  - what: cage-orientation
    scope: [front]
    reason: needs-photo
    note: >-
      Which side the latches of the stacked cages face is not visible in the figure. The library's belly-to-belly convention is used (upper cage
      upright, lower turned 180).
    wanted: a photograph of the stacked cages.
  - what: psu-dc-face
    scope: [rear]
    reason: needs-drawing
    note: >-
      The PWR-2411-DC supplies are the library's existing drawing of that module, an AC housing with a plain terminal block; the guide shows a DC
      supply only in isometric figures.
    wanted: a flat drawing or photograph of the PWR-2411-DC.
  - what: module-power
    scope: [rear]
    reason: vendor-silent
    note: >-
      The guide's power tables and the data sheet give whole-switch figures only; the fan modules' missing power figure (lint L27) stands. The
      supplies state their output.
    wanted: FAN-7012H power draw.
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      The 96 100G QSFP ports, numbered 1 to 96 as printed: 1 to 40 and 41 to 80 in two rows of stacked blocks (the odd numbers are the upper
      cages) and 81 to 96 along the top row
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system, fan and two power supply lamps at the top right of the front
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      how the switch is reached out of band - the RS-232 console port, the USB port and the 10/100/1000 management port, in a row at the top
      right of the front panel
  grounding: {term: Point, role: service, index-origin: 1}
  psu-bays:
    term: Bay
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        Data sheet: "Hot-swap Power Supplies 2 (1+1 redundant)". Guide section 4.4: at least one supply must connect to a power source
    description: the two hot-swap power supplies, 1+1 redundant
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: n+1
      redundancy-note: >-
        Data sheet: "Hot-swappable Fans 4 (N+1 redundant)"
    description: the four hot-swap fan modules
