    size-over-ears: 48.3 x 4.4 x 46.8 cm (19 x 1.75 x 18.43 in) with the mounting ears (guide Table 1); 50.5 cm (19.9 in) deep with the supplies and fans
  performance:
    throughput: 2 (4) Tbps
    packets-per-second: 1 Bpps
    latency: from 800 ns
    packet-buffer: 32 MB (dynamic buffer allocation)
    ports-max-speed: eight ports of 100 Gbps; 16 of 50 Gbps; 8 of 40 Gbps; 64 of 25 Gbps; 64 of 10 Gbps; 48 of 1 Gbps
    interfaces-max: 64
  power:
    power-typical-w: 165
    power-max-w: 345
    power-envelope: as-tested
    power-measure: guide Table 4 typical and maximum, conditions not stated; the data sheet prints 124 W / 301 W, typical measured at 25 C ambient with 50 percent load on all ports, excluding transceivers
    psu-redundancy: 1+1
    input-ac: 100 - 127 / 200 - 240 VAC, 7.1 / 3.4 A (PWR-511-AC), IEC 60320 C14
    input-dc: -48 to -60 VDC, 13 A (PWR-511-DC)
    efficiency: 93 percent (Platinum) AC, 92 percent DC (data sheet)
  thermal:
    airflow: front-to-rear or rear-to-front, set by the fan modules and supplies fitted
    fan-redundancy: 2 hot-swap fan modules, 1+1
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -25 to 70 C (guide Table 2); the data sheet says -40 to 70 C
    humidity: 5 to 90 percent non-condensing
    altitude: 0 to 3,000 m (10,000 ft) operating
  platform: {cpu: Quad-Core x86, memory: 8 GB, storage: 8 GB flash}
  features:
    optics-sfp28: 25G, 10G and 1G, in the 48 SFP cages (data sheet, "SFP25")
    optics-qsfp28: 100G and 40G, in the eight QSFP100 cages (data sheet)
    eos-license: license group LIC-FIX-2; minimum EOS 4.21.6
  management:
    console: RJ-45 RS-232 serial on the rear
    oob: one 10/100/1000 management port on the rear
    usb: one USB port on the rear
  compliance:
    emc: FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386
    safety: EN 62368-1, IEC 62368-1, CSA/UL 62368-1
    certifications: BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI, TEC, ANATEL, ICASA, NOM Equivalency (data sheet)
    rohs: RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)
