gaps:
- what: power
  scope:
  - front
  - rear
  reason: sources-disagree
  note: >-
    Guide Table 4 prints 165 W typical and 345 W maximum for the 7050SX3-48YC8; the data sheet prints
    124W / 301W for the same measure (typical at 25 C, 50 percent load, excluding transceivers; the guide
    gives no conditions). The guide's are modelled, as the newer of the two documents for what it prints.
  wanted: the maker's statement of which is current.
- what: environment
  scope:
  - front
  - rear
  reason: sources-disagree
  note: >-
    Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet). The guide's is in
    attrs.
  wanted: the maker's statement of which is current.
- what: rear-mapping
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The guide draws four generic rear panels (Figures D-1 to D-4) and does not say which model uses which.
    The 7050SX3-48YC8 is mapped to D-3 by its fan count (two, data sheet), its two supplies and its rear
    management ports. The data sheet's "Rear View" photograph (PDF page 3) for the 7050SX3-48YC8 and its
    siblings shows the same shape but is a thumbnail.
  wanted: the maker's statement of the rear panel of the 7050SX3-48YC8.
- what: rack-ears
  scope:
  - front
  reason: needs-drawing
  note: >-
    The guide's Figures 3-1 to 3-14 are isometric drawings with no measure and the kit guides for KIT-7001,
    KIT-7101 and the other spares are not held, so no ear position or rail kit is written.
  wanted: a dimensioned drawing of the mounting bracket position, and the kit guides.
- what: port-lamp-count
  scope:
  - front
  reason: needs-photo
  note: >-
    Figure C-15 draws four dots a QSFP port, but the guide's Appendix A describes one port LED and does
    not say what each of the four shows. All four are given the same states.
  wanted: the guide's account of the port lamps, or a photograph of the lit face.
- what: sfp-lamp-pairing
  scope:
  - front
  reason: needs-photo
  note: >-
    Figure C-15 draws two lamps under each SFP column. Which belongs to the upper port and which to the
    lower is not stated; the odd port is given the left lamp.
  wanted: a photograph of the lit face.
- what: front-legends
  scope:
  - front
  reason: needs-photo
  note: >-
    The speed bands' legends, the small print over the cages, the system and fan lamp glyphs and the PS1
    and PS2 legends are unreadable or barely readable in the 576 px figure. The glyphs and the two PS
    legends are drawn as read; the band and cage legends are not drawn.
  wanted: a photograph of the face.
- what: cage-orientation
  scope:
  - front
  reason: needs-photo
  note: >-
    Which side the latches of the stacked cages face is not visible in the figure. The library's belly-to-belly
    convention is used (upper cage upright, lower turned 180).
  wanted: a photograph of the stacked cages.
- what: rear-mgmt-block
  scope:
  - rear
  reason: needs-photo
  note: >-
    The management block's console symbol is drawn as the 7280SR3-48YC8 draws it; the figure's 1.26 px/mm
    resolves the block only as three stacked ports.
  wanted: a photograph of the rear management block.
- what: psu-faces
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The guide's Figure D-3 draws one generic supply; the PWR-511-AC and PWR-511-DC components are the
    library's, drawn from the 7280 guide's figure. The PWR-511-DC is the AC housing with a plain two-pole
    terminal block; the guide shows a DC supply only in isometric figures.
  wanted: a flat drawing or photograph of the PWR-511-AC and PWR-511-DC.
- what: module-power
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The guide's power tables and the data sheet give whole-switch figures only; the fan modules' missing
    power figure (lint L27) stands. The supplies state their output.
  wanted: FAN-7011M power draw.
- what: grounding
  scope:
  - bottom
  reason: needs-drawing
  note: >-
    Guide Table 5 gives the 7050SX3-48YC8 KIT-GND-EXT-1RU, attached on the bottom of the chassis (Figures
    4-3 and 4-4). No flat figure measures a grounding point, so none is placed.
  wanted: a flat drawing of the bottom with the grounding adapter holes.
groups:
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp28, speed: 25g}
    description: >-
      The 48 SFP ports (1, 10 and 25G), numbered 1 to 48 as printed; the odd numbers are the upper cages
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: >-
      The eight 100G QSFP ports, numbered 49 to 56 as printed; the odd numbers are the upper cages
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      a status lamp for each SFP port under the lower row, and four for each QSFP port above an upper
      cage and below a lower one
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system, fan and two power supply lamps at the top right of the front
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      how the switch is reached out of band - the 10/100/1000 management port, the USB port and the RS-232
      console port, stacked in one block at the left of the rear panel
  psu-bays:
    term: Bay
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        Data sheet: "Hot-swap Power 2 (1+1 redundant)". Guide section 4.3: at least one supply must connect
        to a power source
    description: the two hot-swap power supplies, 1+1 redundant
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs: {redundancy: 1+1, redundancy-note: 'Data sheet: "Hot-swappable Fans 2 (1+1 redundant)"'}
    description: the two hot-swap fan modules
