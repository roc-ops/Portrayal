format: 1
kind: device
name: 7050sx3-48yc8
version: 0.1.0
maturity: modelled
manufacturer: Arista
model: 7050SX3-48YC8
aliases:
- {name: DCS-7050SX3-48YC8, kind: marketing}
portfolio: {line: 7000 Series, family: 7050X3}
description: >-
  Arista 7050SX3-48YC8 - a fixed 1RU data-centre switch with 48 x 1/10/25G SFP ports and 8 x 100G QSFP
  ports, running EOS. The front carries the SFP cages in two stacked rows of twelve columns on each side,
  the odd number on top, with the eight QSFP cages in two stacked rows of four columns between the two
  halves. Each SFP port has a status lamp under the lower row and each QSFP port four lamps above or below
  its cage. Four system lamps (system, fan, PS1, PS2) are at the top right. The rear carries two hot-swap
  500 W power supplies at the ends and two hot-swap fan modules, with the RJ-45 management port, the USB
  port and the RJ-45 console port between the left supply and the first fan. The same panel is ordered
  with front-to-rear air (-F) or rear-to-front air (-R).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7050 Series 1RU (Gen 3) Quick Start Guide, Arista Networks, document DOC-00141-08, 57 pages, copyright
      2025, PDF created 2025-08-19 (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7050_1RU_Gen3.pdf):
      Table 1 (dimensions and weights), Table 2 (operating and storage), Table 3 (power input), Table
      4 (power draw and supported supplies), section 2.1 (airflow orientation, handle colour), section
      4.1 and Table 5 (grounding), Appendix C (Figure C-15, the front panel of the DCS-7050SX3-48YC8),
      Appendix D (Figure D-3, the rear panel with management ports in the rear and two dual-fan modules),
      Appendix E (field replacement). 7050X3 Series 10/25/40/50/100G Data Center Switches Data Sheet,
      Arista Networks, 03-0040-46 (https://www.arista.com/assets/data/pdf/Datasheets/7050X3-Datasheet.pdf):
      the model comparison, the power supply specifications and the ordering information. Held and checked
      first: intake COVERAGE.md and SOURCES.md, which list no photograph, 3D model or CAD file for this
      model (Arista publishes none; a `find` of the intake folder for 3D files found none) and a Visio
      stencil master that was not used. No drawing, photograph or logo is copied into the library, only
      transcribed facts and new drawings.
  gate-1-front:
    confidence: estimated
    note: >-
      Figure C-15 passes. The raster is 576 x 159 pixels; the body between its plate edges measures about
      560 px wide and 57 px tall (aspect 9.9) against the data sheet's 440 / 43.7 = 10.07, so the figure
      is near-orthographic and carries geometry at about 1.27 px/mm (the 440 mm body is the scale anchor;
      the dark stubs at the two ends are the ears and are not counted). One pixel is 0.8 mm, so every
      position is good to about 1 mm, and every one is `estimated` because it is read off a picture and
      no dimension states it. The figure is the same drawing as Figure C-6 of the 7280R3 Series guide
      for the 7280SR3-48YC8 (the same two rows of twenty-four SFP cages, the same eight QSFP cages between
      them): the positions of arista/7280sr3-48yc8 were read off C-15 at ports 1 and 49 (tab centres 10.8
      and 190.6 mm against that device's 11.4 and 190.7) and agree to 0.6 mm, so they are used.
  gate-1-rear:
    confidence: estimated
    note: >-
      Figure D-3 is a 553 x 120 px raster whose chassis is 553 px between its edges (1.257 px/mm over
      the 440 mm body); positions are good to about 0.8 mm. The guide draws the rear generically (D-1
      to D-4) and does not say which model uses which. The 7050SX3-48YC8 is mapped to D-3 by its two fan
      modules (data sheet: "Hot-swappable Fans 2 (1+1 redundant)"), its 1RU height, its two power supplies
      and its management ports at the rear (Figure C-15 has none at the front). The data sheet (PDF page
      3) captions one rear photograph for the 7050SX3-48YC8 and its siblings, two fan modules with a plate
      between, which agrees; the guide does not name the figure, so THE MAPPING IS ESTIMATED. The two
      red fan modules read 79 mm wide at 105.8 and 275 mm across, as arista/7280sr3-48yc8 draws them.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 1: 48.3 x 4.4 x 46.8 cm (19 x 1.75 x 18.43 inches), 9.5 kg (21.0 lbs); its footnote
      gives the depth as 50.5 cm (19.9 inches) with the power supplies and fans. Data sheet: 44 x 4.4
      x 46.8 cm, 21 lbs (9.45 kg). The width: 48.3 cm is over the mounting ears, so the body between them,
      which is what is modelled, is the data sheet's 44 cm (440.0 here). The height is 43.7, as the library's
      other 7050 devices (the 4.4 cm of both documents is the 1RU rounding). The depth is the 46.8 cm
      both documents give (468.0), the body without the supplies' and fans' handles. The two weights are
      one weight to a rounding of 9.45 kg to one place. 1RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's Chapter 3 mounts the switch with the accessory-kit brackets and shows
      them in isometric drawings that carry no measure. The data sheet lists the spares KIT-7001, KIT-7101,
      KIT-2POST-1U-NT, KIT-4POST-NT and KIT-GND-EXT-1U. No figure measures a bracket position, and the
      kit guides are not held, so no ear position is written and no rail kit is listed in chassis.kits.
      Recorded in the gap rack-ears.
  front-ports:
    confidence: estimated
    note: >-
      Figure C-15 at about 1.27 px/mm. Forty-eight SFP cages in two stacked rows (ports 1 to 48), twelve
      columns on each side of the QSFP block, in groups of six columns on a 14.25 mm pitch (the registry's
      ganged-SFP pitch, whose cages abut; the figure reads 13.9) with a 2.5 mm gap between the groups
      of six; ports 25 to 47 start 260.0 mm from the left. Eight QSFP100 cages in two stacked rows of
      four columns (49 to 56), centred 190.7, 209.6, 228.6 and 247.4 mm, a 19.0 mm pitch. The rows read
      at 18.1 and 31.9 mm down, a row pitch of 13.8. The belly-to-belly orientation is the library's convention
      (upper cage upright, lower turned 180); the figure is too small to show the latch side.
  port-numbering:
    confidence: estimated
    note: >-
      Figure C-15 (callout 5, "Port numbers") prints 1 over 2, 3 over 4, and so on, 1 to 48 across the
      SFP columns and 49 over 50 to 55 over 56 across the QSFP columns, which sit between ports 24 and
      25 in space and are numbered after 48. The odd number is the upper cage. The figure prints each
      number on a white tab over the cage opening; a seated cage hides what is painted under it, so the
      numerals are set in the band between the two rows, the odd number left of its column centre and
      the even one right of it. EOS interface names are not printed on the metal and are not modelled.
  port-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.2: each SFP column has two small green lamps in the strip under the lower row
      and each QSFP column a group of four above the upper cage and four below the lower one (Figure C-15).
      They are modelled as one lamp for each port of an SFP column, the odd port's on the left, and four
      lamps a QSFP port, as arista/7280sr3-48yc8 models the same drawing. Which lamp names which port,
      and what each of four QSFP lamps means, are the gaps sfp-lamp-pairing and port-lamp-count.
  speed-strips:
    confidence: estimated
    note: >-
      Figure C-15 draws a cyan band between the two rows under each group of six SFP columns and a lavender
      band under the QSFP block, with tiny legends. The bands are drawn in those colours at 23.9 to 25.9
      mm down; the legends are unreadable and are not drawn. Two brass-coloured screw heads sit at the
      ends of the QSFP lamp strip.
  status-lamps:
    confidence: estimated
    note: >-
      Figure C-15 callouts 1 to 4: a system status lamp, a fan status lamp and a status lamp for each
      of the two power supplies, in a row at the top right with a symbol or legend above each; the guide's
      Appendix A.1.1 states the colours. Four lamps at 419.1, 422.8, 426.9 and 431.1 mm across and 5.2
      mm down, as arista/7280sr3-48yc8. The order (system, fan, PS1, PS2) is the callout order of the
      figure.
  front-legend:
    confidence: estimated
    note: >-
      The figure prints the maker's wordmark and the model line at the top left. THE WORDMARK IS NOT DRAWN:
      a logo-zone region is reserved over it and the plain model text is set.
  vents:
    confidence: estimated
    note: >-
      The figure shows a perforated grid along the top in four fields, with solid strips between them
      and over the QSFP block, and a row of tiny holes along the bottom lip. Each field is drawn in its
      measured extent, as arista/7280sr3-48yc8; the individual squares are not drawn one by one.
  colour:
    confidence: estimated
    note: >-
      The front plate is the median of the grey pixels (neither black nor white, low saturation) of the
      guide's figure C-15, #717274. The figure is a raster and its lighting is not known, so the shade
      is estimated.
  rear:
    confidence: estimated
    note: >-
      Figure D-3 at 1.257 px/mm, the rear seen from behind with x = 0 at the left of the drawing. PS1
      is the left and PS2 the right (callouts 1 and 6). Each power supply module is 73.5 mm wide (the
      data sheet's "73.5mm" for the PWR-511) at 4.4 and 361.5 mm across and 1.85 mm down; the figure draws
      the fan guard at the left of each supply and the C14 inlet at its right. The management block is
      a grey plate 82.5 to 100.5 mm across with the Ethernet management port, the USB port and the RJ-45
      console port stacked in it. Two fan modules 78.6 mm wide at 105.7 and 276.6 mm across and 2.55 mm
      down, red frames with a honeycomb grille, a grey release rail and a status lamp at the bottom. Between
      the fans is a grey plate printed with ASSY NUMBER, SERIAL NUMBER and MAC ADDRESS fields and, under
      them, PS1 and PS2 legends beside airflow arrows (the arrows are not drawn). The positions are as
      arista/7280sr3-48yc8, whose figure is the same drawing.
  rear-fan:
    confidence: datasheet
    note: >-
      Data sheet: "Hot-swappable Fans 2 (1+1 redundant)", "Fan Tray FAN-7011M-F/R" and the spares FAN-7011M-F
      (front-to-rear) and FAN-7011M-R (rear-to-front). Guide section 2.1: a red handle is an air-exit
      module and a blue handle an air-inlet one, and every module must have the same direction. The two
      fan modules are bays that accept FAN-7011M-F or -R; the -R configurations seat the blue modules.
      The components are the ones the 7280SR3-48YC8 seats: the maker's part number is the same, so the
      component is reused.
  fru-bays:
    confidence: datasheet
    note: >-
      Guide Appendix E (E.2 power supplies, E.3 fan modules) gives removal and installation procedures,
      and the data sheet calls the supplies "1+1 hot-swappable". SO THE TWO POWER SUPPLIES AND THE TWO
      FAN MODULES ARE BAYS. Nothing on this chassis is a built-in unit. The management block, the USB
      port and the console port are part of the chassis and are placements.
  power:
    confidence: datasheet
    note: >-
      Guide Table 4: typical / maximum 165 W / 345 W for the 7050SX3-48YC8 with PWR-511-AC or PWR-511-DC.
      The data sheet prints 124W / 301W, typical "measured at 25C ambient with 50% load on all ports,
      excludes transceivers". The guide's are modelled and the data sheet's are in the gap `power`; the
      two are the same measure, so this is a conflict. The guide does not state the conditions of its
      figures.
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, altitude 0 to 3,000 m, humidity 5 to 90
      percent non-condensing. Data sheet: operating 0 to 40 C, storage -40 to 70 C, humidity 5 to 90 percent,
      altitude 0 to 3,000 m. The storage temperature differs: gap `environment`, the guide's used.
  configurations:
    confidence: datasheet
    note: >-
      Data sheet ordering information: DCS-7050SX3-48YC8-F and -R ("front-to-rear air, 2xAC" and "rear-to-front
      air, 2xAC"). The "#" SKU ("configurable fans and psu") is an order of parts, not a part number a
      DCIM can hold, and is not listed. The data sheet lists no DC build of the switch: the PWR-511-DC-RED
      and -BLUE supplies are spares, so the DC configurations are examples with no part number. The guide's
      Table 4 lists PWR-511-AC and PWR-511-DC as the supported supplies.
  interface-names:
    confidence: datasheet
    note: >-
      Not printed and not modelled. EOS names ports Ethernet1 to Ethernet56 and Management1; this is the
      vendor's convention and no held document prints it.
  lifecycle:
    confidence: estimated
    note: >-
      Searched the held documents (the guide and the data sheet) for an end-of-sale or end-of-life notice
      for the 7050SX3-48YC8: none. No web search was made, so this is a statement about those documents
      only.
  other-faces:
    confidence: datasheet
    note: >-
      No source draws the top, bottom or sides flat. The guide's installation figures are isometric. Each
      carries an `empty` sentence. The guide's Table 5 gives this model KIT-GND-EXT-1RU on the bottom
      of the chassis (sections 4.1 and 4.2, Figures 4-3 and 4-4, a grounding adapter assembly); no figure
      measures it.
attrs:
  physical:
    weight: 9.5 kg (21.0 lbs) (guide Table 1); the data sheet says 21 lbs (9.45 kg)
    size-over-ears: >-
      48.3 x 4.4 x 46.8 cm (19 x 1.75 x 18.43 in) with the mounting ears (guide Table 1); 50.5 cm (19.9
      in) deep with the supplies and fans
  performance:
    throughput: 2 (4) Tbps
    packets-per-second: 1 Bpps
    latency: from 800 ns
    packet-buffer: 32 MB (dynamic buffer allocation)
    ports-max-speed: >-
      eight ports of 100 Gbps; 16 of 50 Gbps; 8 of 40 Gbps; 64 of 25 Gbps; 64 of 10 Gbps; 48 of 1 Gbps
    interfaces-max: 64
  power:
    power-typical-w: 165
    power-max-w: 345
    power-envelope: as-tested
    power-measure: >-
      guide Table 4 typical and maximum, conditions not stated; the data sheet prints 124 W / 301 W, typical
      measured at 25 C ambient with 50 percent load on all ports, excluding transceivers
    psu-redundancy: 1+1
    input-ac: 100 - 127 / 200 - 240 VAC, 7.1 / 3.4 A (PWR-511-AC), IEC 60320 C14
    input-dc: -48 to -60 VDC, 13 A (PWR-511-DC)
    efficiency: 93 percent (Platinum) AC, 92 percent DC (data sheet)
  thermal:
    airflow: front-to-rear or rear-to-front, set by the fan modules and supplies fitted
    fan-redundancy: 2 hot-swap fan modules, 1+1
  environmental: {operating-temp: 0 to 40 C (32 to 104 F), storage-temp: -25 to 70 C (guide Table 2);
      the data sheet says -40 to 70 C, humidity: 5 to 90 percent non-condensing, altitude: '0 to 3,000
      m (10,000 ft) operating'}
  platform: {cpu: Quad-Core x86, memory: 8 GB, storage: 8 GB flash}
  features: {optics-sfp28: '25G, 10G and 1G, in the 48 SFP cages (data sheet, "SFP25")', optics-qsfp28: '100G
      and 40G, in the eight QSFP100 cages (data sheet)', eos-license: license group LIC-FIX-2; minimum
      EOS 4.21.6}
  management: {console: RJ-45 RS-232 serial on the rear, oob: one 10/100/1000 management port on the rear,
    usb: one USB port on the rear}
  compliance:
    emc: >-
      FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386
    safety: EN 62368-1, IEC 62368-1, CSA/UL 62368-1
    certifications: BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI, TEC, ANATEL, ICASA, NOM Equivalency (data sheet)
    rohs: RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)
  lifecycle: {eol: none-announced}
