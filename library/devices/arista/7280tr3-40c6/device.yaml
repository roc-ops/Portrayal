format: 1
kind: device
name: 7280tr3-40c6
version: 0.1.0
maturity: modelled
manufacturer: Arista
model: 7280TR3-40C6
aliases:
- {name: DCS-7280TR3-40C6, kind: marketing}
portfolio: {line: 7000 Series, family: 7280TR3}
description: >-
  Arista 7280TR3-40C6 - a fixed 1RU data-centre switch router with 40 x 1/10GBASE-T RJ-45 ports and 6
  x 100G QSFP ports, running EOS. The front carries the RJ-45 jacks in two stacked rows of twenty columns
  in five blocks of four, the odd number on top. Then come the six QSFP cages in two stacked rows of three
  columns. At the right are the stacked RJ-45 management port, USB port and RJ-45 console port, with four
  system lamps (system, fan, PS1, PS2). The rear carries two hot-swap 500 W power supplies at the ends
  and two hot-swap fan modules. The same panel is ordered with front-to-rear air (-F) or rear-to-front
  air (-R).
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      7280R3 Series Quick Start Guide, Arista Networks, document DOC-07041-01, 63 pages, PDF created 2025-05-16
      (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280R3.pdf): Table 1 (dimensions and weights),
      Table 2 (operating and storage), Table 3 (power input), Table 4 (power draw and supported supplies),
      section 2.1 (airflow orientation, handle colour), Table 5 (grounding), Appendix A (status indicators,
      Tables 9 to 13), Appendix D (Figure D-1, the rear panel with two fan modules), Appendix E (field
      replacement). 7280R3 Series Data Center Switch Router Data Sheet, Arista Networks, 03-0045-59, dated
      August 11th, 2025 (https://www.arista.com/assets/data/pdf/Datasheets/7280R3-Data-Sheet.pdf): the
      model comparison of the 7280TR3-40C6, the power supply specifications, the ordering information
      and, on page 5, the photograph of the face that is the only front source. The guide lists the DCS-7280TR3-40C6
      in its scope, Table 1 and Table 4 but has NO FRONT FIGURE for it: Appendix C draws C-1 to C-8 for
      the other models and none is captioned for this one. The 2022 7280 1RU Gen 3 guide (https://www.arista.com/assets/data/pdf/qsg/qsg-books/QS_7280_1RU_Gen3.pdf)
      does not list this model. Held and checked first: intake COVERAGE.md and SOURCES.md, which list
      no photograph other than the data sheet's, no Visio stencil, 3D model or CAD file for this model
      (Arista publishes none; the stencil zip could not be fetched). No drawing, photograph or logo is
      copied into the library, only transcribed facts and new drawings.
  gate-1-front:
    confidence: estimated
    note: >-
      THE FRONT IS PHOTO-MEASURED. The data sheet's photograph of the 7280TR3-40C6 (page 5, first row
      of the model table) is a near-straight-on image stored at 396 x 39 px. The chassis fills it: 394
      px between the edges of the face (x = 1 to 395) against the 440.0 mm body gives 0.895 px/mm across,
      and 39 px against the 43.7 mm height gives 0.892 px/mm down, so the two axes agree to 0.4 percent
      and the face is taken as orthographic. One pixel is 1.12 mm, so every position is good to about
      1 mm and none is better, and every one is `estimated` because it is read off a photograph and no
      dimension states it. How: the scale anchor is the 440.0 mm body (the data sheet's 43.99 cm) and
      the 43.7 mm height; positions were read from dark-run scans of the photograph along rows 15 and
      23 (the jack openings) and down columns through a jack, a QSFP cage and the management stack, the
      counts from a five-times enlargement. The RJ-45 pitch inside a block reads 12.5 px = 13.9 mm, which
      is the registry's 13.97 for a ganged jack, on a quantity the scale never saw.
  gate-1-rear:
    confidence: estimated
    note: >-
      Figure D-1 is a 553 x 141 px raster whose chassis is 551 px between its edges and 54 px tall (aspect
      10.2 against 10.07), 1.252 px/mm over the 440 mm body; positions are good to about 0.8 mm. The guide
      draws the rear generically (D-1 to D-4) and does not say which model uses which. The 7280TR3-40C6
      is mapped to D-1 by its two fan modules (data sheet: "Hot-swappable Fans 2 (N+1 redundant)"), its
      1RU height and its two power supplies. D-1 draws a management block between the left supply and
      the first fan; the photograph of this model carries the management ports at the front, so that block
      is NOT drawn here and the space is plain metal (gap `rear-mgmt-position`). THE MAPPING IS ESTIMATED.
  chassis:
    confidence: datasheet
    note: >-
      Guide Table 1: 48.3 x 4.4 x 46.9 cm (19 x 1.75 x 18.5 in), 9.6 kg (21.1 lbs). Data sheet: 43.99
      x 4.37 x 46.9 cm (17.3 x 1.72 x 18.46 in), 21.1 lbs (9.57 kg). The width: 48.3 cm is over the mounting
      ears, so the body between them, which is what is modelled, is the data sheet's 43.99 cm (440.0 here),
      a 21.5 mm ear each side. The height is the data sheet's 43.7. The depth is the data sheet's 469.0
      (the guide's 46.9 cm). The weights agree (9.6 kg rounds 9.57 kg); no size conflict. 1RU.
  ears:
    confidence: datasheet
    note: >-
      NOT MODELLED. The guide's Chapter 3 mounts the switch with the accessory-kit brackets and shows
      them in isometric drawings of a different switch that carry no measure. The data sheet lists the
      spares KIT-7101, KIT-2POST-1U-NT, KIT-7101-RK, KIT-7101-LD-RK and KIT-GND-EXT-1RU. No figure measures
      a bracket position, and the kit guides are not held, so no ear position is written and no rail kit
      is listed in chassis.kits. Recorded in the gap rack-ears.
  front-ports:
    confidence: estimated
    note: >-
      Data sheet photograph at 0.895 px/mm. Forty RJ-45 jacks in two stacked rows, twenty columns in five
      blocks of four (ports 1 to 40): the first jack of each block reads 19, 77, 135.5, 194 and 252 px
      across, which is 20.1, 84.9, 150.2, 215.6 and 280.4 mm, a block step of 64.9 mm; inside a block
      the jacks step 13.97 mm (the registry's ganged-jack pitch, which the photograph reads at 13.9).
      Six QSFP100 cages in two stacked rows of three columns (41 to 46), centred 313, 336 and 359.5 px
      across = 348.5, 374.2 and 400.3 mm, a pitch of 25.9 (the cages sit in a wider bezel than the registry's
      18.5 mm opening). The jack rows read centred 14.6 and 29.1 mm down, a row pitch of 14.5, and the
      QSFP rows 14.75 and 28.95 mm down, 14.2. The upper jack is the registry's mirror of the lower (turned
      180), as the Catalyst 4948E draws its stacked jacks; the QSFP rows are belly to belly, upper upright
      and lower turned 180, the library's convention, which the photograph is too small to confirm.
  port-numbering:
    confidence: estimated
    note: >-
      The photograph's numerals are not legible and no held document lists them, so no numeral is printed.
      Ids follow the 7280SR3-40YC6's precedent of the same guide (Figure C-7 prints 1 over 2 up to 46):
      the jacks are 1 to 40 and the QSFP cages 41 to 46, the odd number the upper cage. The numbering
      is estimated. EOS interface names are not printed on the metal and are not modelled.
  port-speeds:
    confidence: datasheet
    note: >-
      Data sheet model comparison: "10G Only RJ45 Ports 4" and "1G/10G RJ45 Ports 36". No document says
      which four jacks are 10G only, so all forty are modelled at the highest native rate, 10G, and the
      split is in attrs and in gap `rj45-speeds`.
  port-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.2 gives the port lamp states of the family, but the photograph at 0.9 px/mm shows
      no per-port lamp that can be placed or counted (row 35 of the photograph carries a line of tiny
      marks under the jacks and the cages, unresolved). No port lamp is modelled (gap `port-lamps`).
  status-lamps:
    confidence: estimated
    note: >-
      Guide Appendix A.1.1, Table 9: a system status lamp, a fan status lamp and a status lamp for each
      of the two power supplies. The photograph shows four small marks in a column at the top right, x
      about 390 px = 434.5 mm and 3 to 11 mm down; four lamps are placed at 4.0, 6.6, 9.2 and 11.8 mm
      in the guide's order of its other models (system, fan, PS1, PS2). Their order and glyphs are not
      legible in the photograph and no legend is drawn (gap `front-legends`).
  management-block:
    confidence: estimated
    note: >-
      The photograph shows a stack of RJ-45, USB and RJ-45 at the right, 372 to 386 px = 414 to 430 mm
      across and 5 to 36 mm down. It is read as the Ethernet management port (top), the USB port and the
      RJ-45 console port, the order of Figure C-5 of the same guide (the 7280CR3-36S, whose management
      block is also at the front); the photograph cannot say which RJ-45 is which. Plate and cutouts are
      the 7280CR3-36S's, moved to the measured x.
  speed-tag:
    confidence: estimated
    note: >-
      A small cyan tag sits above the management block, 372 to 381 px = 414 to 424 mm across and 2.2 to
      4.5 mm down. It is drawn in its colour and extent; what it reads is not legible.
  front-legend:
    confidence: estimated
    note: >-
      The photograph shows model print in small type under the maker's wordmark at the top left. THE WORDMARK
      IS NOT DRAWN: a logo-zone region is reserved over it and the plain model text is set, as the data
      sheet names the model.
  vents:
    confidence: estimated
    note: >-
      The photograph shows a perforated row along the top (rows 3 to 6, x 26 to 365 px = 28 to 407 mm)
      and a row of slits along the bottom lip (rows 34 to 37, x 12 to 290 px). Each is drawn in its measured
      extent, not hole by hole.
  colour:
    confidence: estimated
    note: >-
      The front plate is a dark slate: the median of bare-plate pixels at the right of the photograph
      reads RGB (107, 109, 118), taken as #6e7178. The photograph's lighting is not known, so the shade
      is estimated; the other 7280R3 models in the library are #aaabad.
  rear:
    confidence: estimated
    note: >-
      Figure D-1 at 1.252 px/mm, the rear seen from behind with x = 0 at the left of the drawing. PS1
      is the left and PS2 the right (callouts 1 and 6). Each power supply module is 73.5 mm wide (the
      data sheet's "73.5MM") at 4.4 and 361.5 mm across and 1.85 mm down. Two fan modules 78.6 mm wide
      at 105.7 and 276.6 mm across and 2.55 mm down, the positions the 7280SR3-40YC6 reads from the same
      figure. Between the fans is a grey plate printed with ASSY NUMBER, SERIAL NUMBER and MAC ADDRESS
      fields and, under them, PS1 and PS2 legends beside airflow arrows (the arrows are not drawn).
  rear-fan:
    confidence: datasheet
    note: >-
      Data sheet: "Hot-swappable Fans 2 (N+1 redundant)", "Fan Tray FAN-7011M" and the spares FAN-7011M-F
      (front-to-rear) and FAN-7011M-R (rear-to-front). Guide section 2.1: a red handle is an air-exit
      module and a blue handle an air-inlet one, and every module must have the same direction. The two
      fan modules are bays that accept FAN-7011M-F or -R; the -R configurations seat the blue modules.
      The components are the ones the 7280SR3-40YC6 seats.
  fru-bays:
    confidence: datasheet
    note: >-
      Guide Appendix E (E.2 power supplies, E.3 fan modules) gives removal and installation procedures,
      and the data sheet calls the supplies "1+1 hot-swappable" and the fans "hot-swap". SO THE TWO POWER
      SUPPLIES AND THE TWO FAN MODULES ARE BAYS. Nothing on this chassis is a built-in unit. The management
      block, the USB port and the console port are part of the chassis and are placements.
  power:
    confidence: datasheet
    note: >-
      Guide Table 4: typical / maximum 186 W / 242 W for the 7280TR3-40C6 with PWR-511-AC or PWR-511-DC.
      The data sheet states the same figures with typical "measured at 25C ambient with 50% load on all
      ports".
  environment:
    confidence: datasheet
    note: >-
      Guide Table 2: operating 0 to 40 C, storage -25 to 70 C, altitude 0 to 3,000 m, humidity 5 to 90
      percent non-condensing. Data sheet: operating 0 to 40 C, storage -40 to 70 C, humidity 5 to 95 percent,
      altitude 0 to 3,000 m. Storage temperature and humidity differ: gap `environment`, the guide's used.
  configurations:
    confidence: datasheet
    note: >-
      Data sheet ordering information: DCS-7280TR3-40C6-F and -R ("40x10GbE RJ45 and 6x100G QSFP switch
      router, front to rear air, 2 x AC" and "rear to front air, 2 x AC"). The data sheet lists no K,
      M or A form of the TR3-40C6. The "#" SKU ("configurable fans and psu") is an order of parts, not
      a part number a DCIM can hold, and is not listed. The data sheet lists no DC build of the switch:
      the PWR-511-DC-RED and -BLUE supplies are spares, so the DC configurations are examples with no
      part number. There is no empty-bay (-S) configuration: no -S suffix exists in this family and the
      guide draws no blank for a power supply or fan module. The DCS-7280SR3E-40YC6-M, the other model
      of this slice, shares the 7280SR3-40YC6's face and is already a configuration of arista/7280sr3-40yc6.
  interface-names:
    confidence: datasheet
    note: >-
      Not printed and not modelled. EOS names ports Ethernet1 to Ethernet46 and Management1; this is the
      vendor's convention and no held document prints it.
  lifecycle:
    confidence: estimated
    note: >-
      Searched 2026-10-24 in the held documents (guide, data sheet) for an end-of-sale or end-of-life
      notice for the 7280TR3-40C6: none. The sources the 7280SR3-40YC6 records (web searches of Arista's
      end-of-sale notices, 2026-10-23) returned notices for older 7280 models and for the 7280SR3K-48YC8
      and 7280CR3K-36S series, not for this one.
  other-faces:
    confidence: datasheet
    note: >-
      No source draws the top, bottom or sides flat. The guide's installation figures are isometric. Each
      carries an `empty` sentence. The 1RU grounding point is on the bottom of the chassis (guide section
      4.2, Table 5, KIT-GND-EXT-1RU); no figure measures it.
attrs:
  physical:
    weight: 9.57 kg (21.1 lbs) (data sheet; the guide says 9.6 kg)
    size-over-ears: 48.3 x 4.4 x 46.9 cm (19 x 1.75 x 18.5 in) with the mounting ears (guide Table 1)
  performance:
    throughput: 800 (1600) Gbps
    packets-per-second: 600 Mpps
    latency: from 3.8 microseconds
    packet-buffer: 2 GB
    ports-max-speed: >-
      six ports of 100 Gbps; 12 of 50 Gbps; 6 of 40 Gbps; 12 breakouts of 10 or 25 Gbps. 4 RJ-45 ports
      of 10 Gbps only; 36 RJ-45 ports of 1 or 10 Gbps
    interfaces-max: 52
  power:
    power-typical-w: 186
    power-max-w: 242
    power-envelope: as-tested
    power-measure: typical at 25 C ambient with 50 percent load on all ports (data sheet)
    psu-redundancy: 1+1
    input-ac: 100 - 240 VAC (PWR-511-AC), IEC 60320 C14
    input-dc: -48 to -60 VDC (PWR-511-DC)
    efficiency: 93 percent (Platinum) AC, 92 percent DC (data sheet)
  thermal:
    airflow: front-to-rear or rear-to-front, set by the fan modules and supplies fitted
    fan-redundancy: 2 hot-swap fan modules, N+1
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -25 to 70 C (guide Table 2); the data sheet says -40 to 70 C
    humidity: 5 to 90 percent non-condensing (guide Table 2); the data sheet says 5 to 95 percent
    altitude: 0 to 3,000 m (10,000 ft) operating
  platform: {cpu: Quad-Core x86, memory: 8 GB, storage: 8 GB flash; no SSD}
  features:
    optics-qsfp28: 100G, 50G, 40G, 25G and 10G with breakout, in the six QSFP cages (data sheet)
    rj45: 40 x 10GBASE-T RJ-45, 36 of them 1G or 10G and 4 of them 10G only (data sheet)
    eos-license: license group G2; minimum EOS 4.30.0
  management:
    console: RJ-45 RS-232 serial on the front, 9600 baud 8N1, no flow control
    oob: one 10/100/1000 management port on the front
    usb: one USB port on the front, for software or configuration updates
  compliance:
    emc: >-
      FCC Class A, ICES-003, EN 55032, EN IEC 61000-3-2:2019, EN 61000-3-3, EN 55035, EN 300 386
    safety: EN 62368-1, IEC 62368-1, CSA/UL 62368-1
    certifications: BSMI, CE, KCC, NRTL, RCM, UKCA, VCCI, TEC, ANATEL, ICASA (data sheet)
    rohs: RoHS 2011/65/EU and 2015/863/EU (data sheet, Directives)
  lifecycle: {eol: none-announced}
chassis: {width: 440.0, height: 43.7, depth: 469.0, ru: 1, color: '#6e7178', airflow: front-to-back, power: ac}
gaps:
- what: front-photo-only
  scope:
  - front
  reason: needs-drawing
  note: >-
    The guide draws no front panel for the 7280TR3-40C6 and the data sheet's photograph is 396 x 39 px
    (0.9 px/mm), so every front position is estimated to about 1 mm.
  wanted: a flat front figure or a studio photograph of the 7280TR3-40C6.
- what: environment
  scope:
  - front
  - rear
  reason: sources-disagree
  note: >-
    Storage temperature -25 to 70 C (guide Table 2) against -40 to 70 C (data sheet), and relative humidity
    5 to 90 percent against 5 to 95 percent. The guide's, the older document by three months, are in attrs.
  wanted: the maker's statement of which is current.
- what: rj45-speeds
  scope:
  - front
  reason: vendor-silent
  note: >-
    The data sheet gives 4 jacks of 10G only and 36 of 1G or 10G and says nowhere which four. All forty
    are modelled at 10G.
  wanted: the guide's table of port groups for the TR3-40C6.
- what: port-lamps
  scope:
  - front
  reason: needs-photo
  note: >-
    The photograph is too small to resolve any per-port lamp, so none is modelled and the port lamp states
    of guide Appendix A.1.2 are not attached to a port.
  wanted: a photograph of the lit face.
- what: front-legends
  scope:
  - front
  reason: needs-photo
  note: >-
    The port numbers, the symbols beside the four system lamps, the port-group legends and the model line
    are not legible in the photograph. Only the model text is set; no numeral, glyph or group legend is
    drawn.
  wanted: a photograph of the face.
- what: mgmt-roles
  scope:
  - front
  reason: needs-photo
  note: >-
    Which of the two RJ-45 jacks is the management port and which the console is read from the 7280CR3-36S
    figure of the same guide; the photograph shows two jacks and a USB port.
  wanted: a photograph or figure with the management block legible.
- what: cage-orientation
  scope:
  - front
  reason: needs-photo
  note: >-
    Which side the latches of the stacked cages and the key of the stacked jacks face is not visible at
    this size. The library's belly-to-belly convention is used (upper upright for the QSFP cage; the upper
    jack turned 180, as the Catalyst 4948E).
  wanted: a photograph of the stacked ports.
- what: rear-mgmt-position
  scope:
  - rear
  reason: needs-drawing
  note: >-
    Figure D-1 draws a management block between the left supply and the first fan. The TR3-40C6's photograph
    has the management ports at the front, so the rear is drawn without the block; whether the rear carries
    a blank cover there is not stated by any held document.
  wanted: a rear photograph or figure of the 7280TR3-40C6.
- what: rack-ears
  scope:
  - front
  reason: needs-drawing
  note: >-
    The guide's Figures 3-1 to 3-4 are isometric drawings of another switch and carry no measure, and
    the kit guides for KIT-7101 and the other spares are not held, so no ear position or rail kit is written.
  wanted: a dimensioned drawing of the mounting bracket position, and the kit guides.
- what: psu-dc-face
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The PWR-511-DC supplies are drawn as the AC supply's housing with a plain two-pole terminal block.
    The guide shows a DC supply only in isometric figures; the real terminal arrangement is not drawn.
  wanted: a flat drawing or photograph of the PWR-511-DC.
- what: module-power
  scope:
  - rear
  reason: vendor-silent
  note: >-
    The guide's power tables and the data sheet give whole-switch figures only; the fan modules' missing
    power figure (lint L27) stands. The supplies state their output.
  wanted: FAN-7011M power draw.
- what: grounding
  scope:
  - bottom
  reason: needs-drawing
  note: >-
    The 1RU grounding point is on the bottom of the chassis for KIT-GND-EXT-1RU (guide section 4.2, Table
    5, Figure 4-2). No flat figure measures it, so it is not placed.
  wanted: a flat drawing of the bottom with the grounding bracket holes.
groups:
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 10g}
    description: >-
      The 40 RJ-45 ports (1 or 10G, four of them 10G only), numbered 1 to 40; the odd numbers are the
      upper jacks
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp28, speed: 100g}
    description: The six 100G QSFP ports, numbered 41 to 46; the odd numbers are the upper cages
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the system, fan and two power supply lamps at the far right of the front
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      how the switch is reached out of band - the 10/100/1000 management port, the USB port and the RS-232
      console port, stacked in one block at the right of the front panel
  psu-bays:
    term: Bay
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        Data sheet: "Hot-swap Power Supplies 2 (1+1 redundant)". Guide section 4.4: at least one supply
        must connect to a power source
    description: the two hot-swap power supplies, 1+1 redundant
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs: {redundancy: n+1, redundancy-note: 'Data sheet: "Hot-swappable Fans 2 (N+1 redundant)"'}
    description: the two hot-swap fan modules
