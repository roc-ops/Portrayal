format: 1
kind: device
name: hm14c
version: 0.1.1
maturity: modelled
manufacturer: Hubbell
model: HM14C
aliases:
  - {name: '662620553368', kind: vendor}
description: >-
  1 RU M-Series horizontal cable manager, catalogue HM14C, UPC 662620553368. A steel centre
  plate as wide as the rack has four windows a cable crosses through. Five wire rings stand
  out of it on each side, 4 in (102 mm) at the front and the same behind. A hinged,
  removable cover closes the front. The maker says the rings align with the adaptors of a
  patch panel.
profile: passive
provenance:
  method:
    confidence: datasheet
    note: >-
      FIGURES FROM THE MAKER'S OWN SPEC SHEET. Hubbell publishes one PDF per catalogue number,
      PREMISE_HM14C_spec.pdf on hubbellcdn.com (sha256 below): a features list, an ordering
      table, specifications, characteristics, accessories and a dimensions table, A 1 RU,
      1.75 in (44), B 19 in (483), C 4 in (102), beside one isometric figure that marks A,
      B, C and D. The sheet's "Customer Use Drawing" link points at
      ecatalog.hubbell-premise.com, which does not resolve (checked 2026-10-18). Hubbell's
      CDN does serve a CAD drawing of this family, a .dwg in AutoCAD 2018 format
      (hubbellcdn.com/customerusedrawing/HWS14421C-HM1xx_1U_HOR_CBL_ORG.dwg, 382,784
      bytes, linked from the HM144C sheet); nothing on the build host opens a DWG, so it
      was not read. No dimensioned drawing was read: the sheet's figure is a line drawing
      without a scale, and everything read off it is `estimated`, with how.
  ears:
    confidence: estimated
    note: >-
      estimated - `positions` states where the part bolts, for the Rack Builder. The plate is
      the part's own ears, so the rail plane is the back of the plate: the front rings stand
      C, 101.6, out of its front, and the plate is 1.5 thick (estimated), so `at` is 103.1.
      The five rings behind it reach into the rack by D (see `rear-extension`). The sheet's
      accessories list a replacement cover and hook-and-loop ties and no rail kit, so `kits`
      is not stated.
  full-depth:
    confidence: estimated
    note: >-
      `full-depth: false` - the rings reach 101.6 in front of the rail and 101.6 behind it,
      not the depth of the rack, so the rack unit's rear face is not claimed.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 482.6 x 44.45 x 204.7. Width is B, 19 in; height is A, 1.75 in, which the
      figure marks along the plate's end, so it is the plate; ru is the sheet's 1 RU. Depth
      is the overall: the sheet's C, 4 in (101.6 mm) in front of the plate, the plate's
      thickness, and the rear extension D behind it. The sheet's own "Depth 4 in" is C alone.
  rear-extension:
    confidence: estimated
    note: >-
      estimated - 101.6, as C. The figure marks a fourth dimension D for the rings behind the
      plate, and no table gives it. Read on the HM14C, HM24C and HM34C figures against C
      the same way, D is 0.98, 0.90 and 1.10 of it, so the two are taken as equal; Hubbell's
      own page for the HM144C, the 1-unit part that states a 4 in rear extension, agrees.
      No sheet says the HM14C has the same rear extension as the HM144C.
  thickness:
    confidence: estimated
    note: >-
      estimated - 1.5 mm. No Hubbell sheet states the plate's gauge for the M-Series.
  front:
    confidence: estimated
    note: >-
      estimated - the front: the plate with its four windows, five wire rings and the cover.
      The figure has no scale, so the ring pitch and the window sizes are read against B (see
      the plate's `windows`): five rings 112 mm apart, symmetric about the middle, a ring in
      the web between each pair of windows and one at each end, as the figure draws them. The
      cover is drawn fitted; the `cover-off` configuration leaves it off and shows the
      rings.
  rear:
    confidence: estimated
    note: >-
      estimated - the figure draws a second set of five rings on the far side of the plate, its
      dimension D; they are the front's, seen from behind, with the same windows.
  top:
    confidence: estimated
    note: >-
      estimated - an elevation: the plate's edge and the ten rings' top wires, five behind it
      and five in front. The cover's edge is not drawn: the configuration with it off draws
      the same plan.
  left:
    confidence: estimated
    note: >-
      estimated - an elevation, rear on the left: each ring's wires and post, either side of
      the plate's edge. The right is the same, turned round.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - material, wire diameter and finish are the sheet's specification table; the
      cover, the pass-through holes and the corresponding vertical manager are its
      characteristics table; the UPC is its ordering table.
  cable-capacity:
    confidence: datasheet
    note: >-
      datasheet - the sheet states no cable capacity, so none is stated here and none is
      estimated.
attrs:
  physical:
    material: Steel
    wire-diameter-mm: 5.715
    finish: Black Powder Coated
  features:
    cover: Included, hinged and removable
    pass-through-holes: Standard
    vertical-manager: VM Series
    replacement-cover: HM1C
chassis:
  width: 482.6
  height: 44.45
  depth: 204.7
  ru: 1
  full-depth: false
  ears:
    positions:
      - {name: proud, at: 103.1, default: true}
  shell: sheet
  thickness: 1.5
  color: '#1b1d20'
gaps:
  - what: rear-extension
    scope: [rear, left, right, top, bottom]
    reason: needs-drawing
    note: >-
      the sheet's figure marks a dimension D for the rings behind the plate and its table
      gives A, B and C only. Taken as equal to C, read off the figure against it.
    wanted: the dimensioned customer drawing, or the maker's figure for D
  - what: ring-bend
    scope: [front, rear, left, right, top, bottom]
    reason: needs-drawing
    note: >-
      the sheet's figure shows each wire ring bent round where it leaves the plate and at its
      free end, with a hook on the post of alternate rings, and dimensions none of it. The
      side views draw the loop with a 11.43 mm corner radius (two wire diameters), a stand-in;
      the 3D loop keeps square corners and no hook is drawn. The rings are drawn in a mid
      steel tone so they read against the black plate; the sheet states none.
    wanted: the dimensioned customer drawing, or the maker's figure for the ring's bend and hook
  - what: cover-face
    scope: [front]
    reason: needs-drawing
    note: >-
      the sheet's figure shows a folded edge along the cover, the HM24C photograph a lip along
      the top and a name plate at the middle. The face draws a 6 mm fold along the top and foot
      and the plate's 58 by 12 mm box blank; the fold's width is a stand-in.
    wanted: the dimensioned customer drawing
  - what: cover-hinge
    scope: [front]
    reason: vendor-silent
    note: >-
      the sheet calls the cover "hinged & removable" and its figure draws it swung open; the
      format has no hinge, so the cover is one panel drawn fitted, and the
      `cover-off` configuration is the cover taken off.
    wanted: a format for a hinge; nothing the maker could add
  - what: cable-capacity
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      the sheet states no count of cables, nor a basis for one; it says only that the
      rings align with the patch panel's adaptors.
    wanted: a maker's figure with its basis
  - what: weight
    scope: [front]
    reason: vendor-silent
    note: the sheet states no weight.
    wanted: the part's weight
