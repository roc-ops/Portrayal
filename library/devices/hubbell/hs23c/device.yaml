gaps:
  - what: finger-geometry
    scope: [front, top, left, right]
    reason: needs-drawing
    note: >-
      the sheet's figure draws five top fingers, a flange with five tabs and windows in the
      plate, and its table gives A, B and C only. The finger width, the tab size and the
      window sizes are read off the figure against B and A. The top view's tip radius (6 mm)
      and folded rim (the sheet's 1.9 mm) are stand-ins for the rounded tip and folded edge
      the figure shows, and the fold's depth is not drawn. The finger, tab and flange are
      drawn in mid steel tones so they read against the black plate; the sheet states none.
    wanted: the dimensioned customer drawing
  - what: cover-face
    scope: [front]
    reason: needs-drawing
    note: >-
      the sheet's figure shows a rolled top edge on the cover, two slot marks near the ends and
      the name plate at the middle. The face draws a 6 mm roll, a 14 by 4 mm slot 12 mm in from
      each end and the plate's 45 by 25 mm box blank; the roll's width and the slot's size and
      place are stand-ins.
    wanted: the dimensioned customer drawing
  - what: cable-capacity
    scope: [front]
    reason: vendor-silent
    note: >-
      the sheet states no count of cables, nor a basis for one; it says only that the
      fingers align with the patch panel's adaptors.
    wanted: a maker's figure with its basis
  - what: weight
    scope: [front]
    reason: vendor-silent
    note: the sheet states no weight.
    wanted: the part's weight
