model: HS23C
aliases:
  - {name: '662620249834', kind: vendor}
description: >-
  2 RU S-Series horizontal cable manager, catalogue HS23C, UPC 662620249834. A 14 gauge steel
  plate as wide as the rack has four windows a cable crosses through. A flange folds forward
  along its foot and five fingers run along its top, 3 in (76 mm) out to a lift-off cover.
  The cover closes the front. The maker says the fingers align with the adaptors of a patch
  panel.
profile: passive
provenance:
  method:
    confidence: datasheet
    note: >-
      FIGURES FROM THE MAKER'S OWN SPEC SHEET. Hubbell publishes one PDF per catalogue number,
      PREMISE_HS23C_spec.pdf on hubbellcdn.com (sha256 below): a features list, an ordering
      table, specifications, characteristics, accessories and a dimensions table, A 2 RU,
      3.5 in (89), B 19 in (483), C 3 in (76), beside one isometric figure that marks A, B
      and C. The sheet lists no "Customer Use Drawing" (only "Customer Drawings" and
      "eCatalog", whose host, ecatalog.hubbell-premise.com, does not resolve, checked
      2026-10-18), so no dimensioned drawing was read: the figure is a line drawing without
      a scale, and everything read off it is `estimated`, with how.
  ears:
    confidence: datasheet
    note: >-
      datasheet - `positions` states where the part bolts, for the Rack Builder. The plate is
      the part's own ears and stands at the back of the part, so the rail plane is the back of
      the plate and the whole depth, C, 76.2, stands in front of it: `at` is 76.2. The sheet's
      accessories list a replacement cover and hook-and-loop ties and no rail kit, so `kits`
      is not stated.
  full-depth:
    confidence: datasheet
    note: >-
      `full-depth: false` - nothing of the part stands behind the rail; it reaches 76.2 in
      front of it, so the rack unit's rear face is free.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 482.6 x 88.9 x 76.2. Width is B, 19 in; height is A, 3.5 in, which the
      figure marks along the plate's end; ru is the sheet's 2 RU; depth is C, 3 in, the sheet's
      own "Depth 3 in", the whole projection from the back of the plate to the front of the
      cover.
  thickness:
    confidence: datasheet
    note: >-
      datasheet - "Gauge 14", 0.0747 in, 1.9 mm by the standard sheet gauge.
  front:
    confidence: estimated
    note: >-
      estimated - the front: the plate with its four windows, the flange along its foot, the
      five fingers along its top, the five tabs and the cover. The figure has no scale, so the
      finger pitch and the window sizes are read against B (see the plate's `windows`): five
      fingers 104 mm apart, symmetric about the middle, one over the web between each pair of
      windows and one at each end. The cover is drawn fitted; the `cover-off` configuration
      leaves it off and shows the fingers and tabs.
  rear:
    confidence: estimated
    note: >-
      estimated - the back of the plate: the four windows and the plate round them. The
      figure draws a hole in each ear, not drawn here (see the plate's `mounting-holes`).
  top:
    confidence: estimated
    note: >-
      estimated - an elevation, rear at y=0: the plate's edge and the five fingers lying
      forward from it. The cover's edge is not drawn: the configuration with it off draws the
      same plan.
  left:
    confidence: estimated
    note: >-
      estimated - an elevation, rear on the left: the plate's edge, a finger along the top,
      the flange along the foot and a tab standing up at the front of it. The right is the
      same, turned round.
  guides:
    confidence: estimated
    note: >-
      estimated - the `duct` guide is the channel between the finger row and the flange,
      the width of the part, its run along the rack: 85.1 mm high, from under the fingers to
      over the flange. `finger-pitch` is the 104 mm between fingers read on the figure and
      `finger-gap` the 80 mm between two, the pitch less the finger's 24.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - material, gauge and finish are the sheet's specification table; the cover,
      the pass-through holes and the corresponding vertical manager are its characteristics
      table; the UPC is its ordering table.
  cable-capacity:
    confidence: datasheet
    note: >-
      datasheet - the sheet states no cable capacity, so none is stated here and none is
      estimated.
