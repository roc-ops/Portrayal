manufacturer: Hubbell
model: HM144C
aliases:
  - {name: '662620665313', kind: vendor}
description: >-
  1 RU M-Series horizontal cable manager with a 4 in front extension and a 4 in rear
  extension, catalogue HM144C, UPC 662620665313. A centre plate as wide as the rack has four
  windows a cable crosses through. Five wire rings stand out of it on each side, 4 in
  (102 mm) at the front and 4 in behind. A hinged cover closes the front. Its own page gives
  no dimensions. The metal is the HM14C's, the 1 RU part with the same figure.
profile: passive
provenance:
  method:
    confidence: borrowed
    note: >-
      borrowed - HM14C (library device hubbell/hm14c). Hubbell's spec sheet for the HM144C,
      PREM-HM144C-SPEC-EN.pdf (hubbellcdn.com, REV 8/2026; sha256 below), is a catalogue page
      with a title, a list of five features and a table of four rows: "M-Series", "1-Unit",
      "4 in Front Extension", "4 in Rear Extension", "With Cover", Type "Horizontal Cable
      Management", Cover Type "Hinge", Industry Standard "EIA", UPC 662620665313. It has
      no dimensions table, no figure with dimensions and no material. The older sheet
      layout, PREMISE_HM144C_spec.pdf, does not exist (HTTP 404, checked 2026-10-18). Its
      "Customer Drawing [English]" link is a CAD file, hubbellcdn.com/customerusedrawing/
      HWS14421C-HM1xx_1U_HOR_CBL_ORG.dwg (AutoCAD 2018 format, 382,784 bytes), which
      nothing on the build host opens, so it was not read. So the 1 RU
      height and the 19 in width are the HM14C's (same unit count, same figure) and the
      wire and finish are the HM14C sheet's; what this page states is the 4 in rear
      extension and the hinged cover.
  rear-extension:
    confidence: datasheet
    note: >-
      datasheet - 4 in, 101.6 mm: the HM144C sheet's "4 in Rear Extension", beside its
      "4 in Front Extension". This is the one part of the line whose rear rings are stated.
      The HM14C, HM24C and HM34C figures mark a rear dimension D that no table gives; for those
      three it is estimated from this part's 4 in.
  ears:
    confidence: estimated
    note: >-
      estimated - `positions` states where the part bolts, for the Rack Builder. The plate is
      the part's own ears, so the rail plane is the back of the plate: the front rings stand
      101.6 out of its front, and the plate is 1.5 thick (estimated), so `at` is 103.1. The
      page lists no accessories and no rail kit, so `kits` is not stated.
  full-depth:
    confidence: estimated
    note: >-
      `full-depth: false` - the rings reach 101.6 in front of the rail and 101.6 behind it,
      not the depth of the rack, so the rack unit's rear face is not claimed.
  chassis:
    confidence: borrowed
    note: >-
      borrowed - 482.6 x 44.45 x 204.7, the HM14C's width and height (see `method`); depth is
      the 4 in front extension and the 4 in rear extension the HM144C sheet states, with the
      plate's 1.5 mm (estimated) between them.
  thickness:
    confidence: estimated
    note: >-
      estimated - 1.5 mm. No Hubbell sheet states the plate's gauge for the M-Series.
  front:
    confidence: estimated
    note: >-
      estimated - the HM14C's front: the plate with its four windows, five wire rings and the
      cover, read off the HM14C figure against its B. The HM144C's own page shows a photograph
      only (four windows, rings, a front cover), which agrees in count. The cover is drawn
      fitted; the `cover-off` configuration leaves it off and shows the rings.
  rear:
    confidence: estimated
    note: >-
      estimated - five rings behind the plate, the front's seen from behind, as the HM14C
      figure draws them; the rear extension that stands them out is stated, 4 in.
  top:
    confidence: estimated
    note: >-
      estimated - an elevation: the plate's edge and the ten rings' top wires, five behind it
      and five in front. The cover's edge is not drawn.
  left:
    confidence: estimated
    note: >-
      estimated - an elevation, rear on the left: each ring's wires and post, either side of
      the plate's edge. The right is the same, turned round.
  attrs:
    confidence: borrowed
    note: >-
      borrowed - material, wire diameter and finish from the HM14C sheet; "Black" and the
      hinged cover are on the HM144C page, whose title says "Black" and whose table says
      "Cover Type Hinge"; the UPC is its table's.
  cable-capacity:
    confidence: datasheet
    note: >-
      datasheet - the page states no cable capacity, so none is stated here and none is
      estimated.
