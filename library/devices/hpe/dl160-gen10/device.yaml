  serial: {term: Port, role: management, index-origin: 1}
  controls: {term: Button, role: management, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  tags: {term: Tag, role: furniture, index-origin: 1}
  memory: {term: DIMM, role: service, index-origin: 1, description: 'the sixteen DDR4 slots, eight per processor, numbered here 1 to 16 left to right as seen from above with the rear at the top: 1 to 8 are processor 2 slots 1 to 8 and 9 to 16 are processor 1 slots 1 to 8, which is how the QuickSpecs memory population figure numbers them'}
  fans: {term: Fan, role: service, index-origin: 1, description: 'the seven single-rotor fan bays, numbered from the power supply side as the User Guide numbers them', attrs: {redundancy: 'n+1', redundancy-note: 'User Guide, Fan mode behavior and Fan population guidelines: the redundant fan kit adds one fan, and in redundant fan mode one fan rotor failure switches the system to non-redundant mode and it continues to operate; a second failure or a missing fan causes an orderly shutdown'}}
  processors: {term: CPU, role: service, index-origin: 1, description: 'the two processor heatsinks - processor 1 on the right as the front faces you'}
  interior: {term: Part, role: furniture, index-origin: 1, description: 'the system board and the primary riser cage'}
  covers: {term: Cover, role: furniture, index-origin: 1, description: 'the access panel'}
