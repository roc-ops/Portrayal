gaps:
  - what: power-max
    scope: [front, rear]
    reason: vendor-silent
    note: >-
      no system power figure in the QuickSpecs (four editions), User Guide or
      Maintenance and Service Guide; each gives per-supply ratings and defers to HPE
      Power Advisor, a web tool, for configured draw. ENERGY STAR's certified server
      list has no DL160 Gen10 entry and the SPECpower result a search attributes to it
      is a DL360 Gen10. The server profile's power requirement is unmet for that
      reason.
    wanted: >-
      a configured power figure from HPE (Power Advisor output or a DL160 Gen10 power
      specification)
  - what: media-bay-options
    scope: [front]
    reason: needs-photo
    note: >-
      the 8 SFF media bay accepts the optical drive cage (873961-B21 enablement kit,
      9.5 mm drives 726536-B21 / 726537-B21) or the two-bay SFF drive cage
      (866458-B21), and the 4 LFF optical bay the 9.5 mm drive; only the blanks are
      drawn. The User Guide elevations GUID-696364B2 and GUID-7FDCEC9A show both
      options at 1.36 px/mm; the only photograph of either is a reseller's 10 SFF unit
      from above, and of the optical kit only its bare bracket and cables.
    wanted: >-
      straight-on images of the optical drive bezel and the two-bay SFF cage in a
      DL160 Gen10
  - what: psu-800w-others
    scope: [rear]
    reason: needs-photo
    note: >-
      three Flex Slot supplies the QuickSpecs lists are not drawn: 865438-B21 (800 W
      Titanium), 865428-B21 (800 W Universal, HVAC/HVDC) and 865434-B21 (800 W -48
      VDC). The Flex Slot QuickSpecs gives the DC supplies a different length (18.29
      cm) and no image of any of the three faces is held.
    wanted: >-
      a photograph of each supply's face
  - what: non-hot-plug-supply
    scope: [rear]
    reason: vendor-silent
    note: >-
      the server also exists with a non-hot-plug supply in place of the two Flex Slot
      bays: the User Guide's enablement procedure begins "Remove the non-hot-plug
      power supply" before fitting the redundant power supply cage, the system board
      has a non-hot-plug power supply connector, the Parts Support Guide heads a
      section with it, and HPE's own rear product image (straight on) shows one wide
      plate with a fan marked 92% and a single inlet where the bays are. No document
      held names its part number or rating or says which models shipped with it -
      every model in QuickSpecs versions 6 to 32 is listed with a hot-plug supply - so
      that rear is not drawn.
    wanted: >-
      the non-hot-plug supply's part number and rating, and which models carried it
  - what: expansion-options-unseen
    scope: [rear]
    reason: needs-photo
    note: >-
      no image held shows a card in any of the three PCIe slots; which way up each
      bracket lies follows from where the riser connectors are, which HPE's PartSurfer
      photograph shows for the primary riser and only the User Guide's board figure
      for the secondary (see the riser parts). The FlexibleLOM riser (hpe/riser-flom-
      dl160@1) and the twelve FlexibleLOM adapters HPE lists for this server are drawn
      - six from the QuickSpecs and six more that only the Product Information
      Reference lists - each from a seller's photograph of its own faceplate (the 536FLR-T's photograph was read and its drawing is the 331FLR's, which it matches to a millimetre), and the
      cage's opening for them from two isometric User Guide figures: no image held
      shows that cage's rear straight on, with or without an adapter, so where an
      adapter sits on the rear is estimated. Not drawn: the primary riser BLANK
      (878532-001) a server ordered with no riser carries, which PartSurfer
      photographs straight on. The three Media Module adapters are drawn from
      PartSurfer's photographs, each centred in the opening because no image shows one
      fitted.
    wanted: >-
      a straight-on rear image of a server with the FlexibleLOM riser and an adapter
      fitted, and of a server with a card in each slot and a Media Module adapter
      fitted
  - what: interior-estimated
    scope: [top]
    reason: needs-drawing
    note: >-
      the top view is drawn from the QuickSpecs Internal View, a photograph that fails
      the panel gate at 3.6%, so every interior position is a fraction and is
      estimated; and it is the only top-down image held. Not drawn because no image
      shows them from above: the redundant power supply cage and its power
      distribution board (the photograph has the non-hot-plug supply), the secondary
      riser cage for slot 3 (not fitted in the photograph), the drive cage and
      backplane under the lid, the energy pack, and the 4 LFF chassis' interior.
    wanted: >-
      a dimensioned plan of the DL160 Gen10 interior, or HPE's service model
  - what: front-bezel
    scope: [front]
    reason: needs-photo
    note: >-
      the front bezel option is not drawn: the QuickSpecs lists the HPE 1U Gen10 Bezel
      Kit 867998-B21, which needs the quick-release ear kit, and the User Guide has
      'Installing the front bezel option'. The only image held of it is a reseller's
      angled photograph.
    wanted: >-
      a straight-on image of the 1U Gen10 bezel on a DL160 Gen10
  - what: interior-population
    scope: [top]
    reason: needs-photo
    note: >-
      the interior is drawn fully populated, as the QuickSpecs photographs it. A one-
      processor server carries fan blanks in bays 1 to 4 (User Guide, Fan population
      guidelines) and a cover on processor socket 2; neither part is drawn, so every
      configuration shows two heatsinks and seven fans.
    wanted: >-
      images of the fan blank and of the empty processor 2 socket
