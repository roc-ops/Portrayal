configurations:
  base:
    kind: base
    default: true
    part-numbers:
      878972-B21: {part: 878972-B21}
    description: >-
      The 4 LFF chassis, 878972-B21, with every drive bay and the optical bay
      blanked, both riser cages with their slots blanked, the media module and
      serial port blanked, one 500 W Flex Slot supply in PS 1 and the blank in
      PS 2. THIS IS THE BUILD THE PHOTOGRAPHS SHOW, NOT WHAT THE PART NUMBER
      SHIPS WITH: the QuickSpecs gives the configure-to-order chassis no riser
      as standard (a primary riser blank, which is not drawn) and makes the
      supply a choice; one 500 W supply is what the pre-configured models
      carry, and the secondary riser is an option that needs processor 2.
  lff4:
    kind: example
    description: >-
      The 4 LFF CTO server, 878972-B21, as photographed: LFF low-profile drives in
      bays 1 and 2, blanks in 3 and 4, the optical blank, one 500 W Flex Slot
      supply in PS 1 and the blank in PS 2, all three PCIe slots blanked.
    bays:
      drive-1: hpe/lff-lp-carrier@1
      drive-2: hpe/lff-lp-carrier@1
  lff4-options:
    kind: example
    description: >-
      The 4 LFF server with its rear options fitted, to show what the openings
      take: a full-height card in slot 1 and low-profile cards in slots 2 and 3
      (three of the library's ConnectX cards, chosen because their ports show
      whether a window is in the right place - not an HPE-qualified build),
      the 1GbE Media Module adapter (NIC ports 3 and 4), the serial port,
      and a second 500 W supply in PS 2 (which needs the redundant power supply
      enablement kit; HPE does not support mixing two different supplies).
    bays:
      riser-primary/slot-1: nvidia/mcx515a-fh@1
      riser-primary/slot-2: nvidia/mcx516a-lp@1
      riser-secondary/slot-3: nvidia/mcx4121a-lp@1
      media-module: hpe/media-module-866464-b21@1
      serial: hpe/serial-port-879778@1
      psu-2: hpe/psu-865408-b21@1
  lff4-flom:
    kind: example
    description: >-
      The 4 LFF server with the FlexibleLOM riser in place of the standard
      primary riser: the 10/25Gb 640FLR-SFP28 adapter where slot 1 was and a
      low-profile card in slot 2 (one of the library's ConnectX cards, to show
      the window - not an HPE-qualified build).
    bays:
      riser-primary: hpe/riser-flom-dl160@1
      riser-primary/flom: hpe/flom-817749-b21@1
      riser-primary/slot-2: nvidia/mcx4121a-lp@1
  sff8:
    kind: orderable
    part-numbers:
      878973-B21: {part: 878973-B21}
    views: {front: front-sff8}
    description: >-
      The 8 SFF chassis, 878973-B21, with the media bay blank and every bay
      blanked; one 500 W Flex Slot supply in PS 1 and both riser cages, as the
      base configuration and with the same caveat - the configure-to-order
      chassis ships with no riser and a chosen supply.
