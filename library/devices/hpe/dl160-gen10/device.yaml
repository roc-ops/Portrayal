format: 1
kind: device
name: dl160-gen10
version: 1.1.2
maturity: modelled
manufacturer: HPE
model: ProLiant DL160 Gen10
description: >-
  HPE's 1U two-socket Intel Xeon Scalable rack server of the Gen10 generation,
  in its two front builds - four 3.5 inch LFF bays (878972-B21) or eight 2.5
  inch SFF bays with a media bay (878973-B21) - over one rear: three PCIe 3.0
  slots on two risers, two Flex Slot power supply bays, two embedded 1GbE
  ports, the iLO 5 port, VGA, two USB 3.0 ports, and blanks for the media
  module and the optional serial port. Retired by HPE; the QuickSpecs carries
  HPE's RETIRED notice.
profile: server
provenance:
  sources:
    confidence: datasheet
    note: >-
      Read for this model: QuickSpecs a00021860enw (retired edition, Aug 2025), HPE's
      datasheet for the model, for dimensions, weights, chassis builds, options and
      environmentals; User Guide a00066666en_us ed. 7, the server's hardware guide,
      for component identification, LEDs, drive and slot numbering and specifications,
      both as its PDF export and as the HTML zip whose native figures
      (GUID-*-high.png, 675 px) are the line drawings cited below; Maintenance and
      Service Guide a00066664en_us, the service manual; two straight-on photographs
      from newserverlife's hands-on review - the 4 LFF front
      (newserverlife.com/upload/iblock/562/7_opt.jpeg, 1280 x 131) and the rear
      (.../386/8_opt.jpeg, 1280 x 145). No vendor 3D model exists for this server on
      any page searched, and NetBox's devicetype-library has no DL160 Gen10.
  chassis:
    confidence: datasheet
    note: >-
      QuickSpecs page 32 and the User Guide's mechanical specifications agree: 4.29 x
      43.46 x 61.49 cm (the User Guide prints the depth 61.50), 1U. 434.6 is the body
      between the ear folds, which is how both front and rear photographs measure
      (below), so the 43.46 cm is the body, not the rack face. Neither document says
      what the depth runs between - whether it takes in the ears or the PSU handles.
  ears:
    confidence: photo-measured
    note: >-
      THE EARS ARE NOT DRAWN. On the front photograph the ears run 8..71 and
      1206..1270 px with the body between the fold gaps at 72.5 and 1204.5 px: 1263 px
      ear to ear is 484.9 mm at the body's scale, 25 mm an ear. The left ear carries
      only a thumbscrew; the right ear the HPE element, a thumbscrew and a "ProLiant
      DL160 Gen10" model label. The control cluster sits on the body, not the ears,
      which is what decides it (the Dell R660 draws its ears because its control
      panels are on them). The HPE element is a logo and would not be drawn anyway.
  gate-1-front:
    confidence: photo-measured
    note: >-
      The 4 LFF front photograph passes the panel gate. The body between the ear folds
      is 1132 px for the 434.6 mm width, 2.6047 px/mm across, and 112.2 px top to
      bottom for the 42.9 mm height, 2.615 px/mm down - 0.4% apart, so the face is
      near-orthographic. Every front 4 LFF position is read off it at those scales.
      The bay pitch is a check: the four bays divide the body at 73, 354, 637 and 920
      px, an even 282.3 px against the 282.75 that 434.6 / 4 gives.
  gate-1-rear:
    confidence: photo-measured
    note: >-
      The rear photograph passes the panel gate, less comfortably: the body is 1261 px
      across for 434.6 (2.90 px/mm) and 123 px down for 42.9 (2.87), 1.2% apart. Every
      rear position is read off it at those scales, to about a millimetre. The
      photograph is cropped tight at both sides; the body's edges are at 9 and 1270
      px.
  gate-1-sff:
    confidence: photo-measured
    note: >-
      The 8 SFF front is measured off HPE's straight-on product image of that face, as
      hosted by Express Computer Systems (expresscomputersystems.com/cdn/shop/files/dl
      160-gen10-drive-8sff_1835d8c9-1c70-466f-aed1-349e0d74a3b8.jpg, 1080 x 1080),
      found in a third web search after the first two had found none. It passes the
      panel gate: the body between the ear folds is 946 px for 434.6 mm (2.177 px/mm)
      and 93 px for 42.9 (2.168), 0.4% apart, and ear to ear it is 484.9 mm, the 4 LFF
      photograph's figure. THIS VIEW WAS FIRST DRAWN FROM THE USER GUIDE'S LINE
      ELEVATIONS (native figures GUID-7FDCEC9A, GUID-55DF0433), which fail the gate at
      6% vertical stretch; against the image they had the column pitch right (81.4
      against 81.75) and three things wrong - the carrier 3.7 mm too wide, the media
      bay blank one drive row tall where it runs to the top of the face, and the
      SmartCarrier's handle on the wrong side of its ring.
  front-lff:
    confidence: photo-measured
    note: >-
      Four LFF bays, 108.65 apart, each seating a 104.8 x 27.5 carrier at 1.73 into
      its bay and 13.8 down. Above them the top strip, 0..12.7: the optical drive
      blank across bays 1 and 2 (a separate plate - its seam is at 455 px), chassis
      vents from 149.0 to 277.5 in two rows of 5.0 slots on a 6.37 pitch, the
      information pull tab at 289.7..326.9, two more vent columns at 327.6, the iLO
      service port in a printed dashed box centred at (349.6, 7.9), the USB 3.0 port
      at (369.6, 7.4), two vent columns at 381.6, then the UID button (401.0, 6.6),
      NIC status lamp (409.4, 6.8), Health lamp (417.1, 6.8) and Power button (425.6,
      6.6), each with its legend above it. A bright lip runs along the bottom,
      41.2..42.9.
  front-sff:
    confidence: photo-measured
    note: >-
      Eight SFF bays as the User Guide numbers them - columns of two, 1 over 2, 3 over
      4, 5 over 6 - with the media bay over columns 4 and 5 and bays 7 and 8 beneath
      it. Columns start at 5.3 on an 81.75 pitch (the rails at 73, 248, 427, 606 and
      786 px); rows at 6.8 and 24.5; each carrier 76.2 x 15.0. The media bay blank
      runs 245.5..408.6 from 0.7 down to 22.8. The top strip, 0..5.8, carries a row of
      slots and, over column 3, the slim information pull tab at 188.1..221.6. The
      control column, 409..434.6, stacks the Power button at (416.4, 9.0), the Health
      lamp (416.4, 17.3), the NIC lamp (416.4, 25.4) and the UID button (416.4, 33.4),
      each under its printed mark, beside the USB 3.0 port (426.0, 12.0) and the iLO
      service port (426.3, 30.9) in its printed dashed box, both USB Type-A turned
      upright. The order top to bottom agrees with the User Guide close-up (native
      figure GUID-812F8899, callouts 4, 3, 2, 1).
  drive-numbering:
    confidence: datasheet
    note: >-
      User Guide "Drive bay numbering": 4 LFF numbered 1..4 left to right; 8 SFF 1..6
      in columns of two, top to bottom, then 7 and 8 under the media bay. The 4 LFF
      front prints each number with a down-pointing triangle on the strip above its
      bay - at 11.0, 143.8, 281.6 and 388.0, which is where the photograph puts them,
      not over each bay's centre. The 8 SFF image prints no bay numerals on the strip
      or the carriers at 2.18 px/mm - and the same image resolves the 1.5 mm legends
      of the control column, so that is a reading and not a limit of the picture - so
      none are printed here.
  controls:
    confidence: datasheet
    note: >-
      User Guide "Front panel LEDs and buttons": UID button/LED (solid blue activated;
      flashing blue remote management, firmware upgrade or iLO reboot), NIC status LED
      (solid green linked; flashing green active; off none), Health LED (solid green
      normal; flashing green iLO rebooting; flashing amber degraded; flashing red
      critical), Power On/Standby button and system power LED (solid green on;
      flashing green power-on sequence; solid amber standby; off no power). The same
      four on both fronts. Rear: NIC link and status on each RJ45, UID, and each
      supply's lamp ("Rear panel LEDs").
  rear:
    confidence: photo-measured
    note: >-
      From the rear photograph, left to right along the top: the primary riser cage
      (0..203.0) with slot 1's full-height window (15.9..125.2) and slot 2's low-
      profile window (127.9..188.2), then the secondary riser cage (203.0..285.5) with
      slot 3's window (214.8..275.1, its vents level with slot 2's). Along the bottom:
      two screw holes, the media module opening (13.6..58.6), the stacked USB 3.0
      ports in a dark bezel (59.0..79.0), the iLO RJ45 with its legend turned on its
      side, VGA in a blue field (103.8..136.9), NIC 1 and 2 in a pale bezel
      (138.6..173.8), a vent block, the UID lamp (195.9, 35.5), a small round hole,
      and under slot 3 the IOIOI legend and the serial port blank. The two supply bays
      fill the right end, PS 2 at 286.9 and PS 1 at 362.4, with the PS 1 / PS 2 legend
      printed upright on the strip between them, PS over the digit over an arrow.
  rear-numbering:
    confidence: datasheet
    note: >-
      User Guide "Rear panel components": 1 PCIe slot 1 or FlexibleLOM adapter
      (optional), 2 PCIe slot 2, 3 PCIe slot 3 (secondary riser for processor 2,
      optional), 4 Flexible Slot power supply 2 (hot-plug, optional), 5 Flexible Slot
      power supply 1 (hot-plug), 6 Serial port (optional), 7 NIC ports 1-2 (1Gb), 8
      VGA port, 9 iLO Management Port, 10 USB 3.0 ports, 11 Media Module adapter
      (optional NIC ports 3-4). The photograph's printed legends agree: PS 1 points
      right and PS 2 left, and the media module window is printed 3 and 4.
  slots:
    confidence: datasheet
    note: >-
      User Guide "PCIe expansion slot definitions": slot 1 PCIe 3.0 x16, full-height
      half-length or low-profile, or a FlexibleLOM (x8); slot 2 PCIe 3.0 x8 low-
      profile; slot 3 PCIe 3.0 x16 low-profile, on the secondary riser with processor
      2. THE SLOTS ARE BAYS OF THE RISERS, each a standard bracket behind a window in
      its cage (hpe/riser-primary-dl160@1, hpe/riser-secondary-dl160@1), so the
      library's generic cards and its card families seat in them. They were first
      drawn as chassis bays the size of the windows the photograph shows - 109.3 x
      23.3 and 60.3 x 18.2 - and nothing but HPE's blanks fitted; the same was true of
      the media module and serial openings, which are now the openings' own sizes and
      accept the Media Module adapter and the serial port. The photographed unit has
      blanks in all five.
  psus:
    confidence: datasheet
    note: >-
      QuickSpecs: the pre-configured models carry "1x 500W Hot Plug; RPS ready"; on
      the configure-to-order chassis (878972-B21, 878973-B21) the supply is a choice
      of one or two, and the DL160/180 Gen10 Redundant Power Supply Enablement Kit
      866442-B21 is "required with selection of power supply". Whether that means any
      Flex Slot supply or only a second one the QuickSpecs does not say; the User
      Guide fits the kit by first removing the non-hot-plug supply, which reads as
      any. Supplies offered: 865408-B21 500 W Platinum, 865414-B21 800 W Platinum,
      865438-B21 800 W Titanium, 865428-B21 800 W Universal (HVAC/HVDC), 865434-B21
      800 W -48 VDC. The 500 W and the 800 W Platinum are drawn (hpe/psu-865408-b21@1,
      hpe/psu-865414-b21@1); the other three are a gap. The bays are the supply's 68.0
      x 40.4, from HPE's QuickSpecs HPE Flexible Slot Power Supplies (c04346217),
      which the rear photograph had measured at 68.2 x 40.6. The default seats the 500
      W in PS 1 and the blank in PS 2, as photographed. A NON-HOT-PLUG SUPPLY ALSO
      EXISTS and is not drawn - see the gap.
  weight:
    confidence: datasheet
    note: >-
      QuickSpecs page 32 by configuration: SFF minimum 10.97 kg (1 drive, 1 DIMM, 3
      fans, 1 processor, 1 supply), SFF maximum 13.92, LFF minimum 11.65, LFF maximum
      15.74. The User Guide's mechanical table rounds to 10.00 minimum and 16.00
      maximum "approximate values"; the QuickSpecs figures are the configured ones and
      are carried.
  power:
    confidence: datasheet
    note: >-
      NO SYSTEM POWER FIGURE IS STATED in the QuickSpecs (current edition and versions
      6, 10 and 14), the User Guide or the Maintenance and Service Guide: each gives
      per-supply ratings and the 500 W supply's maximum input (557 W at 100 VAC) and
      points at HPE's Power Advisor for configured draw. Searched outside them too:
      ENERGY STAR's certified enterprise servers list (data.energystar.gov dataset
      qifb-fcj2) returns 70 ProLiant entries, DL360 and DL380 Gen10 among them, and no
      DL160 Gen10; the one SPECpower result a search attributes to this server
      (power_ssj2008-20190312-00916) is a DL360 Gen10; and the "55 W idle, 380 W
      maximum" that search summaries repeat traces to a hobbyist calculator, not to
      HPE. A supply's input rating is not the server's draw, so no power-max is
      written and the gap stays open.
  environmental:
    confidence: datasheet
    note: >-
      QuickSpecs pages 32-33 and the User Guide's environmental table: operating 10 to
      35 C at sea level, derated 1 C per 305 m to 3050 m; extended 5..10 and 35..40 C,
      and 40..45 C, for approved configurations only (document a00026969en_us); non-
      operating -30 to 60 C; operating humidity 8 to 90% non-condensing, 28 C maximum
      wet bulb; altitude 3050 m operating, 9144 m non-operating; acoustics LWAd 4.5 B
      idle and 5.1 B operating for both builds.
  lifecycle:
    confidence: datasheet
    note: >-
      HPE's own QuickSpecs a00021860enw opens with "RETIRED: This document has been
      officially retired, and the base products listed herein are now considered
      obsolete and are no longer available for sale", and buy.hpe.com no longer lists
      the product. That retired QuickSpecs is the vendor document cited. Third-party
      EOL trackers (Park Place, eosl.date, Techbuyer) give 31 October 2024 as the last
      order date for Gen10 and October 2029 for end of support; no HPE notice stating
      those dates was found, so they are not written as dates.
  faces:
    confidence: datasheet
    note: >-
      Bottom, left and right are sized from the QuickSpecs dimensions and declared
      empty: no document held shows the base or the sides straight on.
  interior:
    confidence: estimated
    note: >-
      THE TOP VIEW IS DRAWN FROM ONE PHOTOGRAPH THAT FAILS THE PANEL GATE. The
      QuickSpecs' Internal View (a00021860enw page 3; the version 6 edition embeds it
      at 1171 x 728) photographs the 8 SFF server from above with its lid off. Turned
      so the rear is at the top - the plan's orientation, x as the front view has it -
      the chassis is 576.5 px across for 434.6 mm (1.3265 px/mm) and 845 px down for
      614.9 (1.374), 3.6% apart: a camera above a box, with perspective. Every
      position is therefore a fraction on its own axis and is estimated; what the
      photograph gives well is arrangement and count. Two checks on it: a DIMM socket
      with its latches measures 197 px, 143 mm at the down scale, for a 133.35 mm
      module; and the primary riser cage starts at 308 mm where the rear photograph, a
      different image, puts slot 1's window at 309.4.
  interior-layout:
    confidence: estimated
    note: >-
      From the photograph and HPE's two figures. The User Guide's System board
      components figure (native figure GUID-944C6994, rear at the top) puts processor
      2 on the left and processor 1 on the right, eight DIMM slots to each - four
      either side of its socket - and fan connectors 1 to 7 along the front edge from
      the left; its Fan locations figure (GUID-4CD08C59) numbers the fan bays 1 to 7
      from the supply's side. On the photograph: sixteen DIMM slots on a 9.45 pitch in
      banks of four, eight and four starting at 85.2, 213.9 and 379.4 (centres;
      latches found by a pixel profile along both ends of the sockets), 236.4 from the
      rear; the two heatsinks between the banks; seven fans, 404 from the rear, DRAWN
      ON ONE PITCH WITH ONE BREAK: fans 1 to 4 and fans 5 to 7 on 47.8, and 52.8
      between fans 4 and 5, where the photograph shows a bracket in the fan row. That
      is a fit, and this is what it was fitted to: the fans' labels sit at 105.5,
      151.9, 198.3, 247.3, 300.0, 347.2 and 397.3 on the photograph (steps 46.4, 46.4,
      49.0, 52.7, 47.2, 50.1), and the Fan locations figure, an independent drawing,
      steps its seven boxes 45.6, 45.6, 47.8, 53.4, 45.6 and 51.1. Both are widest
      between 4 and 5; the other steps differ by 2 to 5 mm in images where a pixel is
      0.75 and 1.1 mm and a label sits within two pixels of its fan's middle. The
      fitted centres - 104.0, 151.8, 199.6, 247.4, 300.2, 348.0, 395.8 - are within
      1.5 mm of every measured one, which is inside what either image can resolve, so
      the scatter is recorded here and not drawn; the primary riser cage at the rear
      right. The supplies are placed from the rear view's bays, not from the
      photograph, which shows the non-hot-plug supply.
  dimm-numbering:
    confidence: datasheet
    note: >-
      QuickSpecs page 31, 'Memory Population guidelines': a figure captioned 'HPE
      DL160/DL180 Gen 10 Servers Front Server (2+1+1 slots per channel)' draws the P2
      CPU on the left and the P1 CPU on the right, each with slots numbered 1 2 3 4
      one side of its socket and 5 6 7 8 the other, left to right, and the table under
      it gives the population order. The plan's dimm-1..8 are therefore processor 2
      slots 1..8 and dimm-9..16 processor 1 slots 1..8; the User Guide's System board
      components figure agrees on which processor is which. A FIRST VERSION RECORDED
      THIS AS A GAP, 'stated in no document held': the figure is a picture, the text
      conversion dropped it, and a search of the converted text found only the table.
  interior-population:
    confidence: datasheet
    note: >-
      DRAWN AS THE QUICKSPECS PHOTOGRAPHS IT: two processors, sixteen DIMMs, seven
      fans ("2 CPUs - 6 standard fans (1 redundant fan shown)", "Fully populated 16
      DIMMs shown"). The User Guide's Fan population guidelines give the other builds
      - one processor non-redundant: fans in bays 5, 6 and 7 and blanks in 1 to 4; one
      processor redundant: bay 3 as well; two processors non-redundant: bays 2 to 7.
      The fan blank and the empty processor socket are not drawn, so the
      configurations here do not vary the interior; see the gap.
attrs:
  physical:
    ru: 1
    weight-min-kg: 10.97
    weight-max-kg: 15.74
  power:
    power-input: 100-240 VAC per Flex Slot supply (the 865434-B21 supply -48 VDC, the 865428-B21 HVAC/HVDC)
    psu-redundancy: 1+1 with the redundant power supply enablement kit 866442-B21
  thermal:
    fans: three single-rotor hot-plug fans with one processor, six with two; one more with the redundant fan kit 866438-B21
