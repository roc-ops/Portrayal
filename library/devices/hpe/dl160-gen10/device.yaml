  psus: {term: PSU, role: service, index-origin: 1, attrs: {redundancy: '1+1', redundancy-note: 'QuickSpecs: the pre-configured models carry one 500 W Flex Slot supply and are RPS ready; the Redundant Power Supply Enablement Kit 866442-B21 is required with a Flex Slot supply on a configure-to-order chassis, and the User Guide calls the second supply the redundant one - the same capacity twice, not twice the capacity'}}
  nics: {term: Port, role: traffic, index-origin: 1, attrs: {media: rj45, speed: 1g}}
  mgmt: {term: Port, role: management, index-origin: 1, attrs: {media: rj45, speed: 1g, role: mgmt}}
