    storage-controller: HPE Smart Array S100i embedded (SATA only); Smart Array modular and PCIe controllers optional
    network: embedded 2-port 1GbE
    bmc: HPE iLO 5
  lifecycle:
    eol: announced
    eol-announcement: https://support.hpe.com/hpesc/public/docDisplay?docId=a00021860enw
