format: 1
kind: device
name: srcableduct1u
version: 0.1.1
maturity: modelled
manufacturer: Eaton
model: SRCABLEDUCT1U
description: >-
  Eaton Tripp Lite series SmartRack 1U horizontal cable manager, a finger duct with cover.
  It is a black cold rolled steel channel on a back plate that bolts to the rack rails and
  stands 67.7 mm out of them. A wall along its top and one along its bottom each carry 24
  slots. A cable is laid through a slot into the channel, and a cover across the front closes
  it. The cover ships fitted and lifts off.
profile: passive
provenance:
  sources:
    confidence: drawing
    note: >-
      THE MAKER'S OWN DOCUMENTS. The SRCABLEDUCT1U spec sheet (assets.tripplite.com, 2 pages, ©
      2026 Eaton) and the SRCABLEDUCT1U submittal drawing (assets.tripplite.com, 2 pages, ©
      2016 Tripp Lite, 16-08-508). The Eaton SKU page was tried once (the .html and the
      skuPage .pdf export both fail at the connection with an HTTP/2 stream error, and a
      regional copy timed out), so no owner's manual or other download was read. No document
      names terms of use for the drawing; figures were read and nothing was copied.
  size-conflict:
    confidence: drawing
    note: >-
      TWO SIZES ARE PUBLISHED AND THE MAKER'S OWN WINS. Resellers list 1.77 x 3.9 x 19.13 in;
      the spec sheet states unit dimensions 1.720 x 19.000 x 2.660 in (hwd, 4.37 x 48.26 x
      6.77 cm) and the submittal drawing states 1.72 x 2.67 x 19.00 in (43.7 x 67.7 x 482.6
      mm). The drawing dimensions each of them on a view: 43.69 high over the ears, 482.60
      long, 67.71 out. The reseller's figures match no view and are not used. The drawing's
      title row labels its three figures H x W x D while giving them in the order height,
      depth, width; the views settle which is which. The spec sheet's 2.660 in is the
      drawing's 2.67 in (67.71 mm) to the printing.
  mount:
    confidence: drawing
    note: >-
      drawing - `rack-face`: the part bolts to the rail face at one rack unit through the slots
      in its ears and stands out of it (front view, ears 465 mm [18.31 in] between hole
      centres; top view, 62.71 mm [2.47 in] from the front of the cover to the plane of the
      ears). The back plate stands 5.0 mm behind that plane, inside the rack's opening. `depth`
      is the maker's overall 67.71, which counts those 5.0 mm, so the part stands 62.71 in front
      of the rail face and the library's depth is 5.0 more than that.
  ears:
    confidence: drawing
    note: >-
      drawing - a rack-face part is its ears and what hangs off them, so the face is the 482.60
      mm over the ears and the ears are the 25.4 at each end of the back plate (the duct
      between them is dimensioned 431.80 mm [17.00 in]). Each has two slots: 8.8 mm in from the
      end (465 mm between hole centres) and 32 mm [1.26 in] apart across the 43.69. The slot
      size, 12 x 6 mm, is read off the picture at 2.41 px/mm (estimated).
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE SUBMITTAL DRAWING, page 2. It draws a front, top, back and side view
      with millimetres in brackets. The front view is 2.41 px/mm across the 482.60 (1163 px)
      and the top view 2.416 across the 431.80 (1043 px), 0.2 per cent apart: both are
      orthographic. Page 1's isometric is a picture of the shape and carries no dimension.
  chassis:
    confidence: drawing
    note: >-
      drawing - 482.6 x 43.69 x 67.71 (19.00 x 1.72 x 2.67 in): the front view dimensions the
      first two and the top view the third. The body is narrower than the plate, 39.8 mm across
      its walls (estimated: read off the side view at 2.59 px/mm, where it is 103 px against
      113 across the ears), and the cover's lips stand outside the walls, 1.1 mm each, 42.0 mm
      over them, which agrees with the front view's 42.3.
  thickness:
    confidence: estimated
    note: >-
      estimated - no document states the gauge. The side view dimensions 37.57 mm [1.48 in]
      clear between the walls and the body is 39.8 over them, so each wall is (39.8 - 37.57) /
      2 = 1.1 mm, taken for the cover and the plate as well.
  weight:
    confidence: datasheet
    note: datasheet - 0.59 kg (1.3 lb), the spec sheet's Unit Weight.
  front:
    confidence: drawing
    note: >-
      drawing - the cover, fitted: the front view draws the face of the duct, 431.80 long, with
      the ears at each end. The two walls and the channel between them are the side view's:
      37.57 mm clear between the walls over the 58.79 mm [2.31 in] from the underside of the
      cover to the inside of the back. The `duct` guide is that channel, over the full length.
  guides:
    confidence: estimated
    note: >-
      estimated - THE FINGERS ARE ON BOTH WALLS, AND THE PITCH IS COUNTED, NOT DIMENSIONED. The
      top view draws one wall and dimensions only a bar, 10 mm [.39 in], and the slot length,
      49.78 mm [1.96 in]. Counted on it: 24 slots, centres 1000 px apart over 23 pitches at
      2.416 px/mm, so the pitch is 18.0 and the slot 8.0 (a 10 mm bar, an 8.0 mm slot; the
      first and last bars run to the ends and are 4.9). The page-1 isometric shows slots in
      the top wall and in the wall under the open end, which is why the bottom is drawn as the
      top again; the side view draws two equal walls. The slots are punched, closed at both
      ends, so a finger is held at both ends: no tip is free. A cable is laid along the
      channel and passes between the walls through a slot.
  top:
    confidence: drawing
    note: >-
      drawing - the top view, rear at y=0: the back 5.0 mm behind the plane of the ears, the
      wall, and the cover's lip over the front 9.8 mm (23 px at 2.344 px/mm; the front 62.71
      to the plane is dimensioned). The 24 slots run from 9.8 mm behind the front edge, under
      the cover's edge, for the dimensioned 49.78, ending 3.1 mm before the plane. The bottom
      is the same as the top.
  left:
    confidence: drawing
    note: >-
      drawing - the side view: the back plate, the two walls with the channel between them,
      and the cover's plate and lips over the front, drawn the cover over the walls. The duct
      is open at both ends and a cable runs out of it there: nothing is built across the ends.
      The right is the same, turned round.
  rear:
    confidence: drawing
    note: >-
      drawing - the back view: the plate 482.6 long with its ears, five bosses 100 mm apart (400
      over the five, dimensioned) centred on the duct, and four larger round dimples between
      them at 50 mm either side of the centre and of the middle boss (the 300 mm dimension,
      slot to slot of the outer two), each with a slot. Their diameters (11.6 for a boss, 6.0
      for its inner ring, 26 for a dimple, with a slot 11 x 3.3) are read at 2.41 px/mm and
      are estimated. THE PURPOSE OF THESE IS NOT STATED by any document and no pass-through is
      declared: a slot in a dimple reads as a tie slot, which the maker does not say. The
      small holes round each boss are not drawn.
  cover:
    confidence: datasheet
    note: >-
      datasheet - the cover ships fitted (the spec sheet's title, Highlights and Package
      Includes: "finger duct with cover"). The submittal drawing's top and side views draw it
      fitted; no document says how it is held or taken off. It is drawn fitted in `base` and
      absent in `cover-off`, as a lid (`lid: true`). The format has no clip, so none is
      drawn.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - no cable capacity, fill or bend radius is stated in either document. None is
      recorded and none is estimated; a gap says so.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - material (cold rolled steel, the drawing's specification table), colour
      (black), the mounting hardware (included) and compliance (RoHS; EIA/ECA-310-E) are the
      spec sheet's.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black" and "cold rolled steel with black finish" are the spec
      sheet's. The drawing is line work and the photograph on it is the maker's, so the whole
      is this library's render of black steel. Its greys are lifted from near-black so the
      part reads on the explorer's dark stage as well as on a white one: a lit edge on the
      cover and the wall bars, a darker slot.
