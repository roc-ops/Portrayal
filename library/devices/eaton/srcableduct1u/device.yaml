    scope: [front]
    reason: vendor-silent
    note: >-
      neither the spec sheet nor the submittal drawing states how many cables the duct holds, a
      fill or a bend radius.
    wanted: a cable capacity and its basis from the owner's manual or the SKU page
  - what: cover-fitting
    scope: [front]
    reason: vendor-silent
    note: >-
      no document says how the cover is held on or removed, so it is drawn as one plate that
      lifts off; the format has no clip.
    wanted: the owner's manual page that shows the cover fitted
  - what: rear-features
    scope: [rear]
    reason: vendor-silent
    note: >-
      the back view draws five bosses, four slotted dimples and small holes beside each boss;
      no document says what they are for. The dimples and bosses are drawn at estimated sizes,
      the small holes are not drawn, and no pass-through is declared.
    wanted: the owner's manual or a dimensioned back view
