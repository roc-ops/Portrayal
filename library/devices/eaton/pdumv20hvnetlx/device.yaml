format: 1
kind: device
name: pdumv20hvnetlx
version: 0.1.0
maturity: modelled
manufacturer: Eaton
model: PDUMV20HVNETLX
description: >-
  Eaton Tripp Lite series switched PDU, 0U: a 1776 mm black metal strip that
  hangs on two toolless mounting buttons beside a rack and hands a single-phase
  208/230 V feed (a C20 inlet on the face, with a detachable 10 ft cord ending
  in a NEMA L6-20P, 16 A, 3.68 kW) on to 24 individually switched outlets - 20
  IEC C13 and 4 IEC C19 - in two separately breakered load banks of twelve, each
  with a lamp. Between the banks, a two-digit load meter and the built-in LX
  Platform network interface (a 10/100 Ethernet port, an RJ45 console port, a
  USB-A port for environmental sensors, a reset button and a status lamp).
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR'S VECTOR DRAWING. The Tripp Lite submittal drawing
      for the PDUMV20HVNETLX (17-08-067, 2018, page 2) draws a front, a side and
      a rear view and details A to E, with dimensions in mm and inches. Its views
      are paths, so every position was read off the PDF's geometry with PyMuPDF
      at 2400 dpi: 0.32252 pt per mm, the 1776.44 overall between the centres of
      the two end lines (85.34 and 658.28 pt). The checks on that scale are the
      drawing's own: the bank dimensions 502.44, 215.56 and 502.44, measured
      between the screw rows their extension lines run through, land at 502.7,
      215.9 and 502.4; the two buttons at 134.0 and 1690.6 against 134.01 and
      1556 apart; and the C20 inlet's pins 12.98 and 8.19 apart against the 13
      and 8 of the standard, which checks the across axis too. The drawing's
      line weight is about 1.3 mm at this scale, so outlines are read at their
      stroke centres. The 3000 px Eaton masters (PDUMV20HVNETLX_DT01, a straight
      front of the whole strip, and the DT02 meter, DT03 interface, DT04 rear,
      DT05 C13 and DT06 C19 close-ups) are the second reading, for colour, the
      lamps and the printing. DT01 is soft (it carries the strip in 2519 px), so
      it is used for what is printed where and not for dimensions.
  mount:
    confidence: drawing
    note: >-
      `rack-side`, the library's way to say a part stands vertically beside an
      upright, with the two toolless buttons on its back (the drawing's rear view
      and DETAIL A; the owner's manual 933666 rev B, step 1-1: insert the buttons
      into the rack's button-mount slots and slide the PDU down). `ru: 40` is the
      height it runs, 1776.44 / 44.45 = 39.96; no source sells it by rack units.
      The removable mounting brackets the drawing shows fitted at the back (DETAIL
      D, for racks without button slots, manual step 1-2), the removable cord
      retention bracket on the front (DETAIL C, 35.56 slot pitch, manual step
      1-3) and the PDUMVROTATEBRKT 90 degree rotation brackets (for outlets
      facing the rack's rear) are accessories in the box and are not drawn; the
      drawing's front view draws a button on a rotation bracket beside the strip,
      which is that accessory. Which side, and front or rear, is a lab
      placement's to say.
  chassis:
    confidence: drawing
    note: >-
      drawing - 17-08-067: 1776.44 [69.94] long and 56 [2.20] wide (front view),
      the body 44 [1.73] deep (side view), 82.10 [3.23] over the cord retention
      bracket on the front and 60.75 [2.39] over the C20 inlet and its cord
      bracket at the bottom. The spec sheet and page 1 of the drawing give 70 x
      2.19 x 2.65 in (1778 x 56 x 67); the 1778 is the 70 in rounded, and the 67
      matches no dimension on page 2. The likeliest sum is the 60.75 (the inlet's
      front to the body's back, side view) plus about 7 of mounting button
      standing off the back (DETAIL B; its 17.67 is the head's diameter, not
      its stand-off), about 67.8 against the 67.3 of 2.65 in; it is recorded as
      a conflict in gaps, and the body stays the dimensioned 44.
      Weight 3.86 kg (8.5 lb), spec sheet; the drawing's page 1 says 3.9 kg.
      Colour: the face reads #2f2f2f in DT01, the side about #4d4c47 under the
      studio light; drawn #2e2f31.
  front:
    confidence: drawing
    note: >-
      drawing - the front view of 17-08-067, read in mm from the top end and from
      the face's left edge. Top to bottom: bank 1, from the screw row at 9.5 to the
      one at 512.2 (the 502.44 dimension); the meter zone (215.56) to the screw
      row at 728; bank 2 (502.44) to 1230.6; and 545.95 of plain face to the bottom
      end, with the C20 inlet at its foot. Each bank starts with two C19s, each in its
      own bezel 34.4 by 42.5 (portrait, earth to the left, centred 34.15 across at 39.63 and 83.72 into
      the bank) with a lamp to the left of each at 11.6, and then ten C13s
      (chamfered end down) each in its own bezel 35.2 by 28.4, centred 34.62
      across, the first at 170.44 and then every 35.616, each with its lamp above
      it at 41.83 across. Bank 2 is bank 1 moved down 718.4 (C19 at 758.00 and
      802.04, first C13 box top at 873.80). The meter is eaton/tripplite-load-meter@1
      at 533.6; the LX interface below it: a reset hole at (22.15, 578.65), the
      status lamp at (32.53, 578.65), and in a row centred at 593.76 the USB-A
      (portrait, at 7.92), the CONFIG RJ45 (22.20) and the LAN RJ45 (42.11). The
      C20 inlet is portrait with its earth pin to the left, centred (28.2,
      1743.7), in a flange 27.9 by 36.3, with a screw above and below it for the
      removable cord bracket (see input). Hex and round fasteners as drawn, all
      drawn round.
  outlet-pitch:
    confidence: drawing
    note: >-
      drawing - NOT DIMENSIONED, MEASURED FROM THE PATHS. The ten C13 box tops of
      bank 1 stand at 155.34, 190.87, 226.59 ... 475.88, a pitch of 35.616, and
      bank 2's the same; the removable cord retention bracket's slots are
      dimensioned 35.56 [1.40] apart on the side view, one per C13, which agrees
      within 0.06. The two C19s stand 44.09 apart.
  banks:
    confidence: datasheet
    note: >-
      datasheet and drawing - the spec sheet: "20 C13 and 4 C19 outlets split
      into 2 separately breakered load banks"; the drawing dimensions the two
      outlet runs 502.44 each and the meter zone between them 215.56; the owner's
      manual (Features, Digital Load Meter) names them Bank 1 and Bank 2. Bank 1
      is outlets 1 to 12 at the top, bank 2 outlets 13 to 24, each two C19s then
      ten C13s, as DT01 numbers them. Which bank is which is read off the
      numbering, not stated: no held source says that bank 1 is the top one.
  breakers:
    confidence: datasheet
    note: >-
      datasheet - two breakers, one per bank (spec sheet, above; the owner's
      manual's Features: "Models with multiple outlet banks have a circuit breaker
      for each bank"). THEIR POSITIONS ARE NOT DRAWN, so they are not placed and
      the outlets state no `through` (gaps: breaker-positions). Searched: the
      submittal drawing's three views and five details, the owner's manual's 50
      figures as converted (its one breaker figure is a generic rocker with four
      screws in the Features section, for "select models"), the spec sheet and the
      SKU page, and the nine Eaton photographs. Page 1 of the drawing names the
      face's features A to O in callouts and none of them is a breaker. The four
      features on each side are vent grilles, not breakers (sides): page 1's
      isometric draws them slotted, with two screws each where the manual's
      breaker rocker has four.
  sides:
    confidence: drawing
    note: >-
      drawing - the side view of 17-08-067 (third angle, the standing PDU's
      right; x = 0 is the front) draws four rounded features filled black,
      11.9 to 34.2 behind the face and centred on the depth, at 12.8 to 53.8,
      546.5 to 613.1, 1245.2 to 1311.9 and 1546.2 to 1612.6 down the side, each
      with a screw at each end. THEY ARE LOUVRED VENT GRILLES: page 1's isometric
      (around page coordinates 190-230, 415-445 and 375-420, 280-320) draws each
      as two fields of fine slots running along the length, a divider across the
      middle and a Phillips screw at each end, and DT08 shows two of them on the
      up-facing side about 188 and 489 from the bottom end, which are the fourth
      and third. Each is drawn as a frame (a backing rect, since a vent field
      paints only its slots) and two `slots` fields declared `vent: 1.0`, about
      1.6 apart (the slot pitch is not dimensioned; page 1 resolves the fields,
      not a count). The side also carries seven small screws 5.4 behind the face at 14.3, 202.9, 514.8, 826.6,
      1138.5, 1450.3 and 1762.2, a pitch of about 312; a screw at each end 13.4
      behind the face. The drawing's depth axis reads 42.6 for the dimensioned
      44, so depths are scaled to the 44. The left side is drawn as the right
      mirrored front to back, which DT01 supports for the grilles at 547, 1245
      and 1546 (it sees the left side edge-on); the grilles' colour, #6f7173, is
      DT01's reading on the left side.
  rear:
    confidence: drawing
    note: >-
      drawing - the rear view of 17-08-067 and DETAIL A: two toolless mounting
      buttons on the width's centre line, 134.01 [5.28] from the top end and 1556
      [61.26] apart (86.43 [3.40] from the bottom end). The removable mounting
      brackets the view draws fitted are not drawn (mount); their screws are
      drawn as the threaded holes they leave, at 284.5 and 310.4 (the 285.18
      dimension) and at 1542.4 and 1567.8 (208.60 from the bottom). A small hole
      at 1750.6, 14.9 right of the centre line as the rear view draws it.
  lamps:
    confidence: datasheet
    note: >-
      datasheet, drawing and photo - the owner's manual (933666 rev B, Features):
      "On switched models, each outlet LED illuminates when the associated outlet
      is ready to distribute live AC power"; the spec sheet: "24 power
      availability LEDs confirm power off/on status for each built-in outlet".
      The drawing draws each as a circle, left of each C19 and above each C13;
      DT01 shows them unlit, a grey window beside each printed numeral. Each is
      eaton/tripplite-led@1, placed with `for:` naming its outlet so a state set
      on the outlet reaches its lamp (docs/pdu-model-design.md section 3.2); the
      `outlet-leds` group declares `on` lit and `off` unlit, as the manual says,
      and NO COLOUR, because no held source states one (gaps: outlet-lamp-colour).
      With no state set a lamp draws unlit.
  labels:
    confidence: photo-measured
    note: >-
      photo - DT01 prints each outlet's number, 1 to 24 from the top, reading
      bottom to top (rotate 270): beside and left of the lamp for a C19 (about 4.5
      from the left edge), and left of the lamp above a C13 (about 34.4 across).
      Positions are DT01's at about 1.39 px per mm against the drawing's slot
      positions in the same outlets; the numeral's height, about 3.6, is
      estimated from the blurred glyphs. The drawing prints no legends.
  interface:
    confidence: photo-measured
    note: >-
      photo and datasheet - DT03 shows the LX interface turned a quarter turn
      anticlockwise from the standing PDU; turned back, the USB-A port has its
      trident below it, CONFIG is printed below the console jack and the network
      symbol below the LAN jack, RESET above the reset hole, and LINK and STATUS
      beside the LAN jack's left and right lamps. The owner's manual (Features,
      Network Interface) names A the Ethernet port with lamps A1 (green, link and
      activity, flashing) and A2 (yellow, on steady at 100 Mbps), B the RJ45
      configuration port (an RJ45 to DB9 cable, part 73-1243, 115.2 kbps), C the
      USB-A port for EnviroSense2 modules, D the reset button and E the status
      LED (green steady in normal operation, green and orange alternating while
      firmware updates or defaults restore). DT03 shows A1 green on the left and
      A2 yellow on the right, as the manual's figure labels them. The spec sheet's
      "Network Link/Activity LED (Yellow), Network Speed LED (Green)" swaps the
      colours against both and is not followed. The LAN jack is
      common/rj45-eth@1 turned 180 (keyway up, as DT03 shows it), so its led-b is
      A1 and its led-a A2.
  meter:
    confidence: drawing
    note: >-
      drawing and photo - eaton/tripplite-load-meter@1, its outline 48.2 by 30.3
      at (3.9, 533.6), read off the front view; the spec sheet: a digital ammeter
      that "reports load level on each bank and total PDU output" and turns 180
      degrees for reading either way up.
  relief:
    confidence: drawing
    note: >-
      drawing - the outlets are wells, 18 (C13) and 20 (C19) deep from their own
      contracts, inside the 44 mm body; the bezels around them are drawn flat,
      because a raised box over the outlets would bury their wells. The C20 inlet
      and its cord bracket stand forward of the face in the side view (the 60.75
      over them against the 44 body, so about 16.75), which is not built (gaps:
      inlet-standoff).
  dcim:
    confidence: datasheet
    note: >-
      the input is one C20 inlet power port (`iec-60320-c20`) and each outlet a
      power outlet fed by it, `iec-60320-c13` or `iec-60320-c19` (both types in
      NetBox and Nautobot, dcim/choices.py). THE OUTLETS ARE NAMED AS THE UNIT
      PRINTS THEM, 1 to 24 (the owner's decision, 2026-10-08): the `interfaces:`
      rule maps each `outlet-<n>` to its printed numeral. No outlet runs
      `through` a breaker, because the breakers are not placed (breakers), so the
      outlet descriptions name none; the breaker name as printed waits on the
      breakers' positions. NO feed_leg IS WRITTEN: a single-phase PDU is on
      whatever leg its plug is on (docs/pdu-model-design.md section 5.2). The LAN
      jack exports as the management interface and CONFIG as an RJ45 console
      port; the USB-A port is a sensor port and, like other USB data ports, no
      device-type field holds it.
  input:
    confidence: datasheet
    note: >-
      datasheet and drawing - a C20 inlet on the face (drawing, C20 INLET; spec
      sheet "C20 inlet accepts included L6-20P input cable"), so `input-plug` is
      the slug the inlet exports, `iec-60320-c20`, and `input-cord: detachable`.
      The cord in the box is a 10 ft (3.05 m) NEMA L6-20P to C19 cord (spec
      sheet, Package Includes); it is not part of the PDU and is not drawn. The bracket
      that secures the cord in the inlet (the drawing's DETAIL C; the manual's
      step 2-1, "use the included bracket C") ships loose, and DT01 shows the
      inlet without it, only the two screws it fastens to; it is a
      cable-management accessory and is not drawn (docs/modelling-a-device.md,
      stage 4, item 7). The clip outline the drawing's front view draws at the
      inlet is that bracket.
      208/230 V single phase (rated 200-240 V on the drawing's page 1), 16 A
      continuous (agency de-rated); the L6-20P is a 20 A plug. `input-voltage-v`
      is 230, the voltage the 3.68 kW is stated at; at 208 V the spec sheet
      gives 3.33 kW.
  capability:
    confidence: datasheet
    note: >-
      datasheet - the spec sheet sells it as a switched PDU with individually
      controllable outlets, and its digital ammeter "reports load level on each
      bank and total PDU output"; the LX interface reports the same remotely. So
      the finest level metered is the bank, `metering-scope: branch`, and
      `outlet-switching: true`, the published class `switched-metered-branch`
      (docs/pdu-model-design.md section 2.2; the owner's decision, 2026-10-09).
      Every outlet declares `[on, off]` on its own placement, not on the group,
      so the outlets stay slots a cord end can be seated in.
  lifecycle:
    confidence: datasheet
    note: >-
      searched 2026-10-09 (web, "PDUMV20HVNETLX discontinued OR end of life OR
      replacement"): the hits are for the 8-outlet PDUMV20HVNET2LX, discontinued
      11/17/2023, not this SKU. tripplite.eaton.com/support/PDUMV20HVNETLX
      redirects to the live Eaton SKU page, and the spec sheet staged 2026-10-08
      is copyright 2026. Nothing announces an end of life.
attrs:
  physical:
    length-mm: 1776.44
    weight-kg: 3.86
    construction: metal
  power:
    input-ac: 208/230 V single-phase (200-240 V), 16 A continuous (agency de-rated), 50/60 Hz
    input-plug: iec-60320-c20
    input-cord: detachable
    input-phase: single
    input-voltage-v: 230
    input-current-a: 16
    plug-rating-a: 20
    capacity-kw: 3.68
    capacity-scope: >-
      the load the PDU can hand on, 3.68 kW at 230 V and 3.33 kW at 208 V, 16 A
      in all (spec sheet); it is not what the PDU draws itself, which no document
      held states
    output-voltage: 208/230 V
    output-rating: 16 A total; 16 A per C19; 12 A (10 A CE) per C13
    breakers: two, one per load bank; rating and position not stated
    frequency: 50/60 Hz
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -30 to 60 C (-22 to 140 F)
    humidity: 5 to 95 % non-condensing
    altitude: 0 to 3000 m (0 to 10000 ft)
  management:
    metering-scope: branch
    outlet-switching: true
    metering: load current in amps, total and per bank, on the digital ammeter and over the network
    network-interface: built-in LX Platform interface (pre-installed WEBCARDLX, PowerAlert Device Manager PADM20), 10/100 Mbps
    protocols: HTTP, HTTPS, SMTP, SNMPv1, SNMPv2, SNMPv3, telnet, SSH, FTP, DHCP, NTP
  compliance:
    certifications: EN 55022; EN 55024; CAN/CSA-C22.2 No. 60950-1 (Canada); IEC 60950-1; NOM (Mexico); UL 60950-1
    product-compliance: RoHS; FCC Part 15 Class A (USA); Trade Agreements Act (TAA)
  lifecycle:
    eol: none-announced
chassis: {width: 56, height: 1776.44, depth: 44, ru: 40, mount: rack-side, color: '#2e2f31', airflow: passive, weight-kg: 3.86}
gaps:
- what: breaker-positions
  scope: [front, left, right]
  reason: needs-drawing
  note: >-
    the spec sheet gives two separately breakered load banks and the owner's
    manual a breaker per bank, but no held source shows where the breakers are
    (searched: the submittal drawing's views and details, the owner's manual's
    figures, the spec sheet, the SKU page and the nine photographs). So no
    breaker is placed, no outlet states `through`, and the DCIM breaker name as
    printed cannot be written. Page 1's callouts A to O name no breaker, and the
    four features on each side are vent grilles (provenance.sides), not
    breakers.
  wanted: a photograph of the PDU's sides, or Tripp Lite's word on where the two bank breakers are and how they are marked.
- what: outlet-lamp-colour
  scope: [front]
  reason: vendor-silent
  note: >-
    the owner's manual says each outlet LED illuminates when its outlet is live
    and names no colour; the spec sheet says the same; every photograph shows the
    lamps unlit. The `on` state is declared with no colour, so the kit paints its
    default lit colour.
  wanted: a photograph of a powered PDUMV20HVNETLX, or the LX Platform guide's lamp table.
- what: depth-67
  scope: [left, right, top, bottom]
  reason: sources-disagree
  note: >-
    the spec sheet and the drawing's page 1 give the depth as 2.65 in (67 mm);
    the drawing's page 2 dimensions the body 44 [1.73], 60.75 [2.39] over the C20
    inlet and its cord bracket and 82.10 [3.23] over the cord retention bracket.
    The likeliest reading of the 67 is the 60.75 plus about 7 of mounting button
    off the back (DETAIL B), about 67.8; no source says so. The body is modelled
    44, the dimensioned figure.
  wanted: the figure the 67 measures, from Tripp Lite.
- what: inlet-standoff
  scope: [front]
  reason: needs-drawing
  note: >-
    the side view draws the C20 inlet and its cord bracket about 16.75 forward of
    the face (60.75 over them against the 44 body); no view dimensions the
    inlet's own housing, so the inlet is built as a well in the face and its
    housing and clip are drawn flat.
  wanted: a dimensioned section through the inlet, or a measured unit.
- what: button-shaft
  scope: [rear]
  reason: needs-drawing
  note: >-
    the buttons are said to mate `pdu-button` by mechanism (manual step 1-1);
    the drawing dimensions the head (17.67) but not the shaft that sits in the
    slot's narrow end, so the fit against a 14 mm keyhole in 3 mm sheet is not
    checked by dimension.
  wanted: the button's shaft diameter and length.
- what: front-boss
  scope: [front]
  reason: vendor-silent
  note: >-
    the drawing draws a round boss about 10 across at (8.95, 1768.1), bottom left
    of the face below the inlet, and DT01 shows a light disc there; nothing held
    names it (a ground point is likely, but the manual says nothing of one). It is
    drawn as decor.
  wanted: the part's name from Tripp Lite, or a close-up.
groups:
  outlets: {term: Outlet, role: traffic, index-origin: 1, mixed: 'the PDU''s 24 outlets, numbered 1 to 24 from the top as printed - in each bank two C19s then ten C13s; each switchable, each bank a region'}
  outlet-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: 'one lamp per outlet, lit while the outlet is ready to distribute live AC power (owner''s manual 933666 rev B); its colour is not stated'
    states: ['on', 'off']
  meter: {term: Display, role: indicator, index-origin: 1}
  mgmt: {term: Port, role: management, index-origin: 1, mixed: 'the LX Platform interface: the 10/100 Ethernet port, the RJ45 configuration (console) port and the USB-A port for EnviroSense2 sensors'}
  status-leds: {term: LED, role: indicator, index-origin: 1}
  buttons: {term: Button, role: service, index-origin: 1}
  marks: {term: Mark, role: furniture, index-origin: 1}
  power-input: {term: Input, role: service, index-origin: 1}
  mounting: {term: Button, role: furniture, index-origin: 1}
