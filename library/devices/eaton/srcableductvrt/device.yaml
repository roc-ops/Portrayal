gaps:
  - what: cable-capacity
    scope: [front]
    reason: vendor-silent
    note: >-
      neither the specification sheet nor the submittal drawing states how many cables the duct holds,
      a fill or a bend radius.
    wanted: a cable capacity and its basis from the owner's manual or a later datasheet
  - what: dimensions
    scope: [front]
    reason: sources-disagree
    note: >-
      the specification sheet gives product height 2.04 in and width 4.06 in; the drawing's table gives
      1.9 x 2.83 x 34.13 in in inches and 51.82 x 103.12 x 867 mm in millimetres, which are not the same
      figures; its dimensioned views give 48.47 x 71.95 over the button x 862.6 mm. The views are drawn.
      The length is 862.6 on the three views and 867 on the table and the sheet, 4.4 mm longer.
    wanted: the owner's manual, or a dimensioned drawing of the assembled two-piece duct
  - what: two-piece
    scope: [front, left, right]
    reason: vendor-silent
    note: >-
      the drawing says the duct is a two piece design, split into two 3-foot sections, and draws the
      assembled length; no view shows the joint or how far apart the two back plates stand. It is drawn
      as one length with no seam.
    wanted: a dimensioned drawing of one section
  - what: slot-length
    scope: [left, right]
    reason: sources-disagree
    note: >-
      the side view dimensions a slot 44.99 mm [1.77 in] long, and the slot as drawn measures about 42.8
      mm at the scale the 62.71 mm overall gives (115 px of 170 at 300 dpi). The dimension is drawn.
    wanted: a dimensioned detail of one slot
  - what: rear-features
    scope: [rear, top, bottom]
    reason: vendor-silent
    note: >-
      the rear view draws the plate narrower at its top end, and the end view draws the button's
      stepped profile and the hooks at the cover's edge; none is drawn (the button is a plain block
      on the end and side faces). The five holes are drawn at an estimated size and no
      document says what they are for, so no pass-through is declared.
    wanted: a dimensioned detail of the plate's end and of the button
  - what: button-fit
    scope: [rear]
    reason: vendor-silent
    note: >-
      the drawing says "toolless mounting buttons" and draws three concentric circles as the PDU
      button's drawing does; no document gives the shaft or the slot it hangs in, so the mating
      `pdu-button` is by mechanism and not checked by dimension.
    wanted: the owner's manual page that shows the hanging
  - what: cover-fitting
    scope: [front]
    reason: vendor-silent
    note: >-
      no document says how the cover is held on or removed, so it is drawn as one plate that lifts off;
      the format has no clip.
    wanted: the owner's manual page that shows the cover fitted
