format: 1
kind: device
name: srcableductvrt
version: 0.1.0
maturity: modelled
manufacturer: Eaton
model: SRCABLEDUCTVRT
description: >-
  Eaton Tripp Lite series SmartRack 6 ft vertical cable manager, a double finger duct with cover. It is
  a black cold rolled steel channel 40 mm wide on a back plate 48.47 mm wide, 862.6 mm long,
  that hangs on two toolless mounting buttons beside the equipment and stands 71.95 mm deep over
  them. A wall down its left and one down its right each carry 48 slots; a cable is laid through a slot
  into the channel, and a cover down the front closes it. The cover ships fitted and lifts off. It takes
  no rack unit.
profile: passive
provenance:
  sources:
    confidence: drawing
    note: >-
      THE MAKER'S OWN DOCUMENTS, both read from the Eaton SKU page of SRCABLEDUCTVRT. The specification
      sheet (skuPage.SRCABLEDUCTVRT.pdf, one page, (c) 2026 Eaton) and the submittal drawing (13-03-167,
      two pages, (c) 2013 Tripp Lite). No document names terms of use for the drawing; figures were read
      and nothing was copied. The SmartRack Accessories Visio stencil linked on the page was not read.
  size-conflict:
    confidence: drawing
    note: >-
      THE DRAWING'S VIEWS WIN OVER ITS OWN TABLE AND THE SHEET. The specification sheet gives product height 2.04 in,
      width 4.06 in and depth 34.13 in; page 1 of the drawing gives unit dimensions "1.9 x 2.83 x 34.13 in
      (51.82 x 103.12 x 867 mm)", whose inch and millimetre figures disagree (2.83 in is 71.9 mm, and 103.12
      mm is 4.06 in). The dimensioned views of page 2 agree with the inch figures and not with the
      millimetre ones: the plate 48.47 mm [1.91 in] wide, 71.95 mm [2.83 in] over the button, 862.6 mm [33.96 in]
      long. The sheet's 2.04 x 4.06 in is the drawing's millimetre row and matches no view; it is not
      used. The length is 862.6 on all three views and 867 mm (34.13 in) on the table and the sheet: the
      views are taken and the 4.4 mm is a gap.
  mount:
    confidence: drawing
    note: >-
      drawing - `rack-side`: the part hangs on two toolless mounting buttons on its back, 622 mm
      [24.49 in] apart on the rear view, the first 123.5 mm [4.86 in] from the top end and the second
      117.10 mm [4.61 in] from the foot. Page 1 shows it hanging inside an enclosure's frame beside the
      equipment and says it is compatible with most standard 19 in enclosures and open frame racks. It
      occupies no rack unit; `ru: 20` is the 862.6 it runs, 862.6 / 44.45 = 19.4 rounded up, as the
      library's other zero-U parts state it (estimated: no source sells it by rack units).
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE SUBMITTAL DRAWING, page 2: a rear, side, front and end view with millimetres in brackets.
      The rear view is 0.985 px/mm at 110 dpi along the 862.6 and the side view the same, so both are
      orthographic. The slot pitch is counted, not dimensioned beyond the 18 mm: 48 slots, read as 96
      slot edges down the side view at 250 dpi.
  chassis:
    confidence: drawing
    note: >-
      drawing - 48.47 x 862.6 x 71.95 (1.91 x 33.96 x 2.83 in): the rear and end views dimension the width, the rear and
      side views the length and the end view the depth over the button. The channel is 40 wide and 62.71
      deep over the plate (end view), the button standing 9.24 behind it.
  thickness:
    confidence: estimated
    note: >-
      estimated - no document states the gauge. 1.1 mm is taken, as for the 1U ducts, from the end
      view, which draws a wall of about that gauge.
  weight:
    confidence: datasheet
    note: >-
      datasheet - 1.8 kg (4 lb), the specification sheet's product weight and the drawing's unit weight.
  front:
    confidence: drawing
    note: >-
      drawing - the cover, fitted: the front view draws the plate 48.47 wide with the cover's outline inside it,
      about 4.5 short of each end (estimated, read at 0.985 px/mm). The two walls and the channel
      between them are the end and side views'. The `duct` guide is the 37.8 mm clear between the walls over the
      full length.
  guides:
    confidence: estimated
    note: >-
      estimated - THE FINGERS ARE ON BOTH WALLS, AND THE COUNT IS READ, NOT STATED. The side view dimensions the pitch 18 mm
      and a slot 44.99 mm long; 48 slots are counted on it. The drawing's title row calls them "double
      finger ducts" (item A). The slots are punched, closed at both ends, so no tip is free. A cable is
      laid along the channel and passes between the walls through a slot.
  left:
    confidence: drawing
    note: >-
      drawing - the side view: the plate and the two buttons behind it, the wall with its 48 slots, and the cover's
      lip over the end of the slots. The right is the same wall seen from the other side, turned round.
  top:
    confidence: drawing
    note: >-
      drawing - the end view, rear at y=0: the button, the plate, the two walls and the cover's plate and lips. The
      duct is open at its end and a cable runs out of it there. The bottom is the same.
  rear:
    confidence: drawing
    note: >-
      drawing - the rear view: the plate with two buttons on its centre line, 123.5 from the top and 117.10
      from the foot, and five holes down the same line 200 mm apart. Each button is three concentric
      circles 25.7, 17.5 and 10 mm across (read at 5.4 px/mm), which are the PDU button's 26.0, 18.6 and
      9.3, so eaton/tripplite-mounting-button@1 is used. The holes' diameter and the first hole's place are
      estimated. The plate's two edges are turned up toward the front, 10.4 mm (28 px on the end view at
      2.686 px/mm, estimated), and are drawn as an edge strip on each side; the plate is narrower at its top
      end, which is not drawn.
  cover:
    confidence: datasheet
    note: >-
      datasheet - the cover ships fitted (the specification sheet's title and package contents, "finger duct
      with cover"). It is drawn fitted in `base` and absent in `cover-off`, as a lid; no clip is drawn.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - no cable capacity, fill or bend radius is stated in either document. None is recorded and none is estimated; a gap says so.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - cold rolled steel (the drawing's specification table), black, RoHS and EIA-310-E (the sheet's compliances).
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Black" is the sheet's. The drawing is line work and the photograph on it is the maker's, so
      the whole is this library's render of black steel, its greys lifted from near-black so the part reads
      on both stages.
