format: 1
kind: device
name: pdu3mv6l2130a
version: 0.1.0
maturity: modelled
manufacturer: Eaton
model: PDU3MV6L2130A
description: >-
  Eaton Tripp Lite series three-phase local metered PDU, 0U. A 1776 mm metal strip that hangs on two toolless
  mounting buttons beside a rack. It takes a 208 V three-phase feed through a fixed 6 ft cord that ends
  in a NEMA L21-30P (24 A, 8.6 kW). It feeds 45 outlets, 36 IEC C13 and 9 IEC C19, in three sections of
  fifteen, each through its own 20 A two-pole breaker. Between the second and third sections is a meter
  with three rows, one for each phase pair. It has no switch and no network port.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S SUBMITTAL DRAWING. The Tripp Lite PDU3MV6L2130A submittal drawing (15-02-211,
      2015, page 2) draws the front, the side and the rear, with details A to E. Its views are vector.
      Every position was read from the path geometry of page 2 at 3.0867 mm per point. The scale comes
      from the strip's 1776.44 between its end lines and its 56 across, which agree to 0.1 per cent. A
      reading is good to about 0.3 mm. The rear view is drawn about 0.6 per cent smaller than the front.
      Its figures use the drawing's own dimensions where it gives them. The outlet pitch is not dimensioned.
      It is measured, and reads 34.5 between the C19 boxes and 35.5 between the rows of C13 boxes. No
      photograph of any face is held. Page 1's isometric names the callouts and is the second reading
      for which feature is which.
  mount:
    confidence: drawing
    note: >-
      `rack-side` is the library's way to say a part stands beside an upright. The two toolless buttons
      are on its back (the drawing's rear view and detail A). `ru: 40` is the height it runs, 1776.44
      / 44.45 = 39.96 rounded up. No source sells it by rack units. The box holds removable mounting brackets
      (page 2 detail D, page 1 callout E). It also holds removable 90 degree rotation brackets (page 2
      between the side and rear views, page 1 callout F). They stand outside the body and are not drawn
      (gaps: side-projections). Which side, and front or rear, is a lab placement's to say.
  chassis:
    confidence: drawing
    note: >-
      drawing - page 2: 1776.44 [69.94] along the strip (front view), 56 [2.20] across and 42.78 [1.68]
      deep (side view). The breaker end is 67.40 [2.65] deep and 365.44 [14.39] long. Page 1 and the product
      page give 70 x 2.65 x 2.2 in. Those are the length, the depth over the breaker end and the width.
      The body stays the dimensioned 56 by 42.78. Weight 13.49 lb (6.12 kg), the product page. Material
      metal, the product page ("Durable Metal Case" on page 1).
  front:
    confidence: drawing
    note: >-
      drawing - page 2 front view, y from the top end and across from the face's left edge, 56 across
      and centred 28. Each of the three sections is 334.75 between its two rows of three screws. Each
      section has three C19 boxes 42.9 across and 29.9 along, centred 45.7, 80.2 and 114.7 from the section's
      first screw row at 19.8. Then come six rows of two C13 boxes, each 25.4 across and 35.0 along, the
      first row from 133.2 and then every 35.5. Section 2 is section 1 moved down 438.3 and section 3
      is section 1 moved down 968.1. The meter plate lies between sections 2 and 3, 825.9 to 955.9, with
      the meter's window 24 by 74 at 873.5. The breaker end is the lower 364.2 of the strip. It has three
      breakers 19.0 by 31.5 at 1428.4, 1496.2 and 1563.8. Twelve small holes stand on either side of them,
      a pair of screws above and two pairs of holes below. The ground screw is a ring about 12.7 across
      at the foot, right of centre, with a plain hole 5.5 across at the left. The drawing prints no legends
      but the meter's: no outlet numeral, no section mark and no breaker name appears on page 2. The Tripp
      Lite wordmark is held as a `logo-zone` region. The maintainer has left marks, colours and the rest
      to a later touch.
  outlets:
    confidence: drawing
    note: >-
      drawing - "IEC C19" and "IEC C13" on page 2 and "45 208V outlets (36 C13, 9 C19)" on the product
      page. The library holds std/c13-outlet@1 and std/c19-outlet@1. The C13s are drawn two to a row,
      each turned a quarter turn. Each is 22 across and 30.4 along, inside the 25.4 by 35.0 box the drawing
      gives. The C19s are drawn one to a row, 35.6 across and 27.7 along. The orientation of each slot
      pattern is read from page 2 and is checked in the pictures. THE UNIT'S OWN NUMBERS ARE NOT KNOWN.
      No document held prints an outlet number. The outlets are named outlet-1 to outlet-45 from the top,
      which is this model's numbering and not the unit's (gaps: outlet-numbers). The mouldings are one
      uniform dark grey: the product page colour-codes the outlets by phase pair, and those colours are
      not drawn. The maintainer has left marks, colours and the rest to a later touch.
  sections:
    confidence: estimated
    note: >-
      estimated - the product page says "Three 20A double-pole circuit breakers (1 per output phase)"
      and "L1-L2 feeds black outlets; L2-L3 feeds dark-gray outlets; L3-L1 feeds light-gray outlets",
      and page 1 says "12 C13 and 3 C19 per phase". No held document says which section is on which phase
      pair or which breaker protects which section. They are read in order from the top. Section 1 is
      on breaker 1 and L1-L2, section 2 on breaker 2 and L2-L3, and section 3 on breaker 3 and L3-L1 (gaps:
      section-order). The outlet colours that code the pairs are not drawn (gaps: colours).
  meters:
    confidence: drawing
    note: >-
      drawing - one meter of three rows, "Digital Load Meter" on page 1. Each row reads "88.8" with its
      pair printed beside it. L3-L1 is at the top, then L2-L3 and L1-L2, and "LOAD (AMPS)" runs along
      the side. The rows' grey backgrounds are the drawing's own fills, 67.84, 44.31 and 25.88 per cent
      grey. The product page says "Set of 3 digital current meters report output current per phase". Page
      1 says the input current is displayed (disagreements, gaps: meter-reads). Both statements are kept
      and the rows are labelled with the pair. Each row is three characters of eaton/tripplite-phase-meter@1.
  breakers:
    confidence: drawing
    note: >-
      drawing - each breaker is a rectangular paddle in a small plate (page 1 callout C: "20A 2-Pole Hydraulic
      Magnetic Circuit Breakers"). The part is eaton/tripplite-breaker-20a-2p@1. The rating is the product
      page's 20 A double-pole, one for each output phase pair. The paddle tips stand outside the body
      (gaps: side-projections).
  rear:
    confidence: drawing
    note: >-
      drawing - the rear view and detail A. Two toolless mounting buttons stand on the centre line. They
      are 134.01 [5.28] from the top end, 86.43 [3.40] from the bottom end and 1556 [61.26] apart. The
      three figures sum to 1776.44, the strip's length. The rear view also draws two plates for the removable
      mounting brackets, each with four holes in a column and about 47 along. It draws two small round
      marks lower on the right. A keyhole plate holds the top button, and the lower button has none. It
      is 56.8 wide and 59.0 along, from 88.5 below the top end, and it overhangs the left edge by 3.9.
      It is drawn from the edge, with its keyhole slot above the button. Four seam ticks stand on the
      edges at 1398.5 and 1453.4 from the top end, each about 13.8 long. The right tick of the lower pair
      is 1.0 past the edge in the drawing and is drawn on the edge. All are estimated off the vector sheet
      at 3.105 mm per point, good to about 0.5 mm. The plate's side tab and the brackets stand outside
      the body and are not drawn (gaps: side-projections).
  sides:
    confidence: drawing
    note: >-
      drawing - the side view draws the body 42.78 deep with the breaker end 67.40 deep. Every other part
      it draws stands outside that depth. They are a row of ticks along the front edge, the paddle tips,
      the button profiles and the removable brackets (gaps: side-projections). Nothing is built into the
      metal, so both sides are plain faces. The standing PDU's right side is the one the drawing shows.
      The left side is built as the documented side, as no document shows this one.
  input:
    confidence: datasheet
    note: >-
      datasheet and drawing - "Input Connector L21-30P", "Input Cord Length 6 ft." (page 1), "NEMA L21-30P"
      (product page), and detail E, the twist-lock plug face. The cord is attached and leaves the end
      of the strip through a hex strain relief, so the part stands on the bottom face. Its `input-plug`
      is the slug the cord part exports, `nema-l21-30p`. The input is 208 V three-phase, 24 A continuous
      (agency de-rated), from the product page. The drawing's page 1 gives "208V 3-Phase Input / 208V
      Single-Phase Output". The Tripp Lite manual for 3-phase basic PDUs gives 200 to 240 V, a range that
      holds the nominal. THE WIRING IS NOT STATED by any held document. `input-wiring: wye` is an estimate.
      The plug is NEMA's three-phase wye configuration. The sibling G4 unit with the same plug states
      wye on its drawing (gaps: input-wiring).
  capability:
    confidence: datasheet
    note: >-
      datasheet - the product page: "Local metered PDU", a set of three meters that read the current of
      each output phase pair, and no outlet switching. The finest level metered is the phase pair, which
      is a branch, so `metering-scope: branch` and `outlet-switching: false`.
  dcim:
    confidence: datasheet
    note: >-
      the input is one power port, NEMA L21-30P. Each outlet is a power outlet fed by it, `iec-60320-c13`
      or `iec-60320-c19`. Each goes through its section's breaker, which states the `lines` it is across.
      No `feed_leg` is written: every outlet is line to line (docs/pdu-model-design.md section 5.2).
attrs:
  physical: {length-mm: 1776.44, weight-kg: 6.12, construction: metal}
  power:
    input-ac: 208 V three-phase, 24 A continuous (agency de-rated), 50/60 Hz
    input-plug: nema-l21-30p
    input-cord: fixed
    input-phase: three
    input-wiring: wye
    input-voltage-v: 208
    input-current-a: 24
    plug-rating-a: 30
    capacity-kw: 8.6
    capacity-scope: >-
      the load the PDU can hand on (the product page, "8.6kW (208V) total capacity"). It is not what the
      PDU draws itself, which no document held states
    output-voltage: 208 V
    output-rating: 13.9 A per output phase; 12 A per C13
    breakers: three 20 A two-pole, one for each output phase pair
    frequency: 50/60 Hz
  environmental: {operating-temp: 0 to 40 C (32 to 104 F), storage-temp: -30 to 50 C (-22 to 122 F), humidity: 5
      to 95 % non-condensing, altitude: 0 to 3000 m (0 to 10000 ft)}
  management:
    metering-scope: branch
    outlet-switching: false
    metering: load current in amps for each output phase pair, on the three meters
  compliance: {certifications: UL 62368-1; NOM; RETIE, product-compliance: RoHS; FCC Class A; TAA}
chassis: {width: 56, height: 1776.44, depth: 42.78, ru: 40, mount: rack-side, color: '#2e2f31', airflow: passive,
  weight-kg: 6.12}
gaps:
- what: outlet-numbers
  scope:
  - front
  reason: vendor-silent
  note: >-
    no held document prints an outlet number, and page 2's views carry no legend. Searched: both pages
    of the drawing, the product page and the Tripp Lite manual for the three-phase basic and metered units.
    The outlets are named outlet-1 to outlet-45 from the top by this model.
  wanted: a photograph of the face, or the numbering the unit prints.
- what: input-wiring
  scope:
  - front
  - bottom
  reason: vendor-silent
  note: >-
    no held document says whether the three-phase input is wired wye or delta. Searched: both pages of
    the drawing, the product page and the manual's tables. `wye` is written because the lint requires
    the key and the L21-30P plug is NEMA's wye configuration. It is an estimate, and a change to delta
    is a major.
  wanted: the manual's wiring figure for this model, or the maker's word.
- what: section-order
  scope:
  - front
  reason: vendor-silent
  note: >-
    no held document says which section is on which phase pair, nor which breaker protects which section.
    They are read in order from the top: breaker 1 on L1-L2, breaker 2 on L2-L3 and breaker 3 on L3-L1,
    an estimate.
  wanted: a photograph of the face, or the manual's wiring figure for this model.
- what: pitch-undimensioned
  scope:
  - front
  reason: needs-drawing
  note: >-
    the outlet pitches, 34.5 (C19) and 35.5 (C13 rows), are measured off the drawing and no dimension
    states them. Page 2 dimensions each section 334.75 between its screw rows and the strip's 1776.44.
  wanted: a dimension of the outlet pitch.
- what: colours
  scope:
  - front
  - rear
  - left
  - right
  reason: vendor-silent
  note: >-
    the product page states the outlet colour code by phase pair ("black", "dark-gray", "light-gray").
    No held document says which section carries which colour. The strip and the outlet mouldings are drawn
    one dark grey, `#262729` for the mouldings. The meter digit colour is not stated either. The maintainer
    has left marks, colours and the rest to a later touch.
  wanted: the maker's statement of which section carries which colour.
- what: breaker-end-depth
  scope:
  - left
  - right
  - bottom
  reason: sources-disagree
  note: >-
    the product page and page 1 give the depth as 2.65 in (67.4 mm) and the width 2.2 in. Page 2 dimensions
    the body 42.78 [1.68] deep and 67.40 [2.65] over the breaker end, 365.44 [14.39] long. The body is
    modelled 42.78 deep, the dimensioned figure, and the breaker end's extra 24.6 is not built. A `chassis.section`
    for the stepped end was tried and lint refused it: L206, a housing with a stepped end is not racked,
    and this device is `rack-side`.
  wanted: a section through the breaker end.
- what: stand-in-parts
  scope:
  - front
  reason: needs-drawing
  note: >-
    the strain relief is a hex 38.1 across read off the drawing and 38.1 in the other direction, an estimate.
    The breaker paddle has no legend because the drawing is line art. No document gives a part number
    or a dimension for either.
  wanted: a dimensioned detail of the breaker end and the strain relief.
- what: meter-reads
  scope:
  - front
  reason: sources-disagree
  note: >-
    the product page says the three meters report output current per phase. Page 1 of the drawing says
    the input current of each phase is displayed. The rows are labelled with the pair, L1-L2, L2-L3 and
    L3-L1, in the drawing.
  wanted: the manual's meter section for this model.
- what: wordmark
  scope:
  - front
  reason: needs-photo
  note: >-
    page 2's front view draws the Tripp Lite wordmark on the meter plate, above the rows, and page 1's
    callout A enlarges the plate. Its size and place are read from the front view. It is marked as a logo-zone
    and not drawn. The maintainer has left marks, colours and the rest to a later touch.
  wanted: a photograph of the plate.
- what: side-projections
  scope:
  - left
  - right
  - rear
  reason: needs-drawing
  note: >-
    page 2's side view draws parts that stand outside the body. A row of ticks along the front edge is
    2.5 to 3.0 mm out. Three paddle tips are 6.7 mm past the breaker end. Two button profiles are about
    10 mm out from the back. The removable brackets, the 90 degree bracket and the keyhole plate's side
    tab are outside the back. The schema says a view `size` is "view dimensions in mm when not the chassis
    front elevation". It says `overhang` is "Only on a `rack` device (L125)". Lint L150 says a part along
    a side view's depth "has no figure to cover it and is always reported". Decor outside the face is
    clipped.
  wanted: >-
    a kit shape for a part beyond the body depth of a rack-side device, or the maintainer's word.
