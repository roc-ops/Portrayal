gaps:
- what: outlet-numbers
  scope:
  - front
  reason: vendor-silent
  note: >-
    no held document prints an outlet number, and page 2's views carry no legend. Searched: both pages of the
    drawing, the product page and the Tripp Lite manual for the three-phase basic and metered units. The
    outlets are named outlet-1 to outlet-45 from the top by this model.
  wanted: a photograph of the face, or the numbering the unit prints.
- what: input-wiring
  scope:
  - front
  - bottom
  reason: vendor-silent
  note: >-
    no held document says whether the three-phase input is wired wye or delta. Searched: both pages of the
    drawing, the product page and the manual's tables. `wye` is written because the lint requires the key
    and the L21-30P plug is NEMA's wye configuration. It is an estimate, and a change to delta is a major.
  wanted: the manual's wiring figure for this model, or the maker's word.
- what: section-order
  scope:
  - front
  reason: vendor-silent
  note: >-
    no held document says which section is on which phase pair, nor which breaker protects which section. They
    are read in order from the top: breaker 1 on L1-L2, breaker 2 on L2-L3 and breaker 3 on L3-L1, an estimate.
  wanted: a photograph of the face, or the manual's wiring figure for this model.
- what: pitch-undimensioned
  scope:
  - front
  reason: needs-drawing
  note: >-
    the outlet pitches, 34.5 (C19) and 35.5 (C13 rows), are measured off the drawing and no dimension states
    them. Page 2 dimensions each section 334.75 between its screw rows and the strip's 1776.44.
  wanted: a dimension of the outlet pitch.
- what: colours
  scope:
  - front
  - rear
  - left
  - right
  reason: vendor-silent
  note: >-
    the product page states the outlet colour code by phase pair ("black", "dark-gray", "light-gray"). No
    held document says which section carries which colour. The strip and the outlet mouldings are drawn one
    dark grey, `#262729` for the mouldings. The meter digit colour is not stated either. The maintainer has
    left marks, colours and the rest to a later touch.
  wanted: the maker's statement of which section carries which colour.
- what: breaker-end-depth
  scope:
  - left
  - right
  - bottom
  reason: sources-disagree
  note: >-
    the product page and page 1 give the depth as 2.65 in (67.4 mm) and the width 2.2 in. Page 2 dimensions
    the body 42.78 [1.68] deep and 67.40 [2.65] over the breaker end, 365.44 [14.39] long. The body is modelled
    42.78 deep, the dimensioned figure, and the breaker end's extra 24.6 is not built. A `chassis.section` for
    the stepped end was tried and lint refused it: L206, a housing with a stepped end is not racked, and this
    device is `rack-side`.
  wanted: a section through the breaker end.
- what: stand-in-parts
  scope:
  - front
  reason: needs-drawing
  note: >-
    the strain relief is a hex 38.1 across read off the drawing and 38.1 in the other direction, an estimate.
    The breaker paddle has no legend because the drawing is line art. No document gives a part number or a
    dimension for either.
  wanted: a dimensioned detail of the breaker end and the strain relief.
- what: meter-reads
  scope:
  - front
  reason: sources-disagree
  note: >-
    the product page says the three meters report output current per phase. Page 1 of the drawing says the
    input current of each phase is displayed. The rows are labelled with the pair, L1-L2, L2-L3 and L3-L1, in
    the drawing.
  wanted: the manual's meter section for this model.
- what: wordmark
  scope:
  - front
  reason: needs-photo
  note: >-
    page 2's front view draws the Tripp Lite wordmark on the meter plate, above the rows, and page 1's
    callout A enlarges the plate. Its size and place are read from the front view. It is marked as a
    logo-zone and not drawn. The maintainer has left marks, colours and the rest to a later touch.
  wanted: a photograph of the plate.
- what: side-projections
  scope:
  - left
  - right
  - rear
  - front
  reason: needs-drawing
  note: >-
    page 2's side view draws parts that stand outside the body. The outlet mouldings are seen edge-on, 29.9 and 35.0
    long. They stand on a front plate 1.3 mm past the front wall, and reach 3.8 and 4.3 mm past it. The meter plate's
    edge, 130.06 long, stands 1.4 mm past the wall. Two face lines 1410.7 and 1397.6 long run along the front plate.
    A lip 12.15 long at 1399 to 1412 stands 1.3 to 2.5 mm out. Three paddle tips are 6.8 mm past the breaker end. Two
    button profiles are about 10 mm out from the back. The two removable brackets stand 17.3 mm past the back,
    a 15.6 plate and a 1.7 tab, each 42.1 long. They lie outside the face's rectangle, so they are named
    and not drawn. An earlier figure of 2 to 3.3 mm matches the bracket's inner screw circle, not the bracket.
    The 90 degree bracket and the keyhole plate's side tab are outside the back too. A button stub shows past the right edge of the front view.
    The plate fitted at the top, with its screw cluster, is drawn inside the body on both sides. The schema says a
    view `size` is "view dimensions in mm when not the chassis front elevation". It says `overhang` is "Only on a
    `rack` device (L125)". Lint L150 says a part along a side view's depth "has no figure to cover it and is
    always reported". Decor outside the face is clipped. The outlet run's `moulding` block takes no depth key
    (expand.py, RUN_MOULDING_KEYS).
  wanted: a kit shape for a part beyond the body depth of a rack-side device, or the maintainer's word.
- what: c19-outline
  scope:
  - front
  reason: sources-disagree
  note: >-
    page 2's front view outlines each C19 in a rounded outline 42.9 across and 33.9 along, measured over its corner
    arcs. Its side view shows the C19 moulding edge-on as a line 29.9 long. The moulding is drawn 42.9 by 29.9. The
    two views differ by 4.0 mm along the strip. The outlines of neighbouring C19s stand 0.6 mm apart on the sheet.
  wanted: the maintainer's word on which size the C19 moulding follows.
- what: shared-part-rings
  scope:
  - front
  - rear
  reason: sources-disagree
  note: >-
    the ground screw and the two toolless buttons are shared parts that other devices place. The ground part
    draws a washer and a screw with a cross. The button part draws a base 24.7, a head 17.67, a washer 8.0 and
    a screw 3.2 across. This sheet shows the ground screw as rings 12.7, 5.5, 4.4 and 3.2. It shows the lower
    button as 25.4, 17.7, 9.2, 8.7 and 7.9, and the upper as 17.7, 9.2, 8.7 and 7.9. This change leaves the
    shared parts as they are.
  wanted: the maintainer's word on whether the shared parts' rings follow this sheet.
- what: meter-row-boxes
  scope:
  - front
  reason: needs-drawing
  note: >-
    the drawing's row boxes in the meter window are 22.11 across and 24.55, 23.03 and 24.55 along, side by side.
    The part draws three equal rows 22.0 by 22.67 with a 2.0 gap. The drawing's digit box in each row is 16.06
    across and 20.03 along, and the part's digits run across the row. The segment art is not dimensioned.
  wanted: a dimensioned view of the meter window with its digits.
