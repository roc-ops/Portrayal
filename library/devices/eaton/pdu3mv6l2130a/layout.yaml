format: 1
kind: device
name: pdu3mv6l2130a
version: 0.1.0
maturity: modelled
manufacturer: Eaton
model: PDU3MV6L2130A
description: >-
  Eaton Tripp Lite series three-phase local metered PDU, 0U. A 1776 mm metal strip that hangs on two
  toolless mounting buttons beside a rack. It takes a 208 V three-phase feed through a fixed 6 ft cord that
  ends in a NEMA L21-30P (24 A, 8.6 kW). It feeds 45 outlets, 36 IEC C13 and 9 IEC C19, in three sections of
  fifteen, each through its own 20 A two-pole breaker. Between the second and third sections is a meter
  with three rows, one for each phase pair. It has no switch and no network port.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S SUBMITTAL DRAWING. The Tripp Lite PDU3MV6L2130A submittal drawing
      (15-02-211, 2015, page 2) draws the front, the side and the rear, with details A to E. Its views are
      vector. Every position was read from the path geometry of page 2, each view at its own scale. A scale
      comes from the view's own end lines, which stand 1776.44 apart. The front is 3.08892 mm per point, the
      side 3.10322 and the rear 3.10697. The front scale agrees with the strip's 56 across to 0.1 per cent.
      The side view is drawn about 0.5 per cent smaller than the front, and the rear about 0.6 per cent.
      The front and rear positions were read at 3.0867 and 3.105, from the outer faces of the end-line pairs.
      That is 0.07 per cent from the scales above, up to 1.2 mm at the far end. A reading is good to about
      0.3 mm near the top end. Its figures use the drawing's own dimensions where it gives them. The outlet pitch is not dimensioned.
      It is measured, and reads 34.5 between the C19 boxes and 35.5 between the rows of C13 boxes. No
      photograph of any face is held. Page 1's isometric names the callouts and is the second reading for
      which feature is which.
  mount:
    confidence: drawing
    note: >-
      `rack-side` is the library's way to say a part stands beside an upright. The two toolless buttons
      are on its back (the drawing's rear view and detail A). `ru: 40` is the height it runs, 1776.44 /
      44.45 = 39.96 rounded up. No source sells it by rack units. The box holds removable mounting brackets
      (page 2 detail D, page 1 callout E). It also holds removable 90 degree rotation brackets (page 2
      between the side and rear views, page 1 callout F). They ship loose and stand outside the body,
      so they are not drawn. The one plate the side view shows fitted is drawn (gaps: side-projections).
      Which side, and front or rear, is a lab placement's to say.
  chassis:
    confidence: drawing
    note: >-
      drawing - page 2: 1776.44 [69.94] along the strip (front view), 56 [2.20] across and 42.78 [1.68] deep
      (side view). The breaker end is 67.40 [2.65] deep and 365.44 [14.39] long. Page 1 and the
      product page give 70 x 2.65 x 2.2 in. Those are the length, the depth over the breaker end and the
      width. The body stays the dimensioned 56 by 42.78. Weight 13.49 lb (6.12 kg), the product page.
      Material metal, the product page ("Durable Metal Case" on page 1).
  front:
    confidence: drawing
    note: >-
      drawing - page 2 front view, y from the top end and across from the face's left edge, 56 across and
      centred 28. Each of the three sections is 334.75 between its two rows of three screws. Each section
      has three C19 boxes 42.9 across and 29.9 along (gaps: c19-outline). They are centred 45.7, 80.2 and 114.7 from the section's first
      screw row at 19.8. Then come six rows of two C13 boxes, each 25.4 across and 35.0 along, the first row
      from 133.2 and then every 35.5. Section 2 is section 1 moved down 438.3 and section 3 is section 1
      moved down 968.1. The meter plate lies between sections 2 and 3, 825.9 to 955.9, with the meter's
      window 24 by 74 at 873.5. The breaker end is the lower 364.2 of the strip. It has three breakers 19.0
      by 31.5 at 1428.4, 1496.2 and 1563.8. Twelve small holes stand on either side of them, a pair of
      screws above and two pairs of holes below. The ground screw is a ring about 12.7 across at the foot, right of centre, with a plain hole 5.5 across
      at the left. Holes 13 to 16 each sit in a hexagon 5.5 across its corners and 4.8 across its flats. It is a silkscreen path with a hole, as the kit has no hexagon decor shape. Each screw and hole carries the inner rings the vector sheet shows, and the six middle screws are 5.5 across.
      Three seam lines cross the face above the breaker plate, at 1397.8, 1410.5 and 1410.9. The ground screw is the shared ground part,
      whose rings are not the sheet's (gaps: shared-part-rings). The drawing prints no legends but the meter's: no outlet numeral, no section mark and no
      breaker name appears on page 2. The Tripp Lite wordmark is held as a `logo-zone` region. The maintainer
      has left marks, colours and the rest to a later touch.
  outlets:
    confidence: drawing
    note: >-
      drawing - "IEC C19" and "IEC C13" on page 2 and "45 208V outlets (36 C13, 9 C19)" on the product page.
      The library holds std/c13-outlet@1 and std/c19-outlet@1. The C13s are drawn two to a row, each turned
      a quarter turn. Each is 22 across and 30.4 along, inside the 25.4 by 35.0 box the drawing gives. The
      C19s are drawn one to a row, 35.6 across and 27.7 along. The orientation of each slot pattern is read
      from page 2 and is checked in the pictures. THE UNIT'S OWN NUMBERS ARE NOT KNOWN. No document held
      prints an outlet number. The outlets are named outlet-1 to outlet-45 from the top, which is this
      model's numbering and not the unit's (gaps: outlet-numbers). The mouldings are one uniform dark grey:
      the product page colour-codes the outlets by phase pair, and those colours are not drawn. The
      maintainer has left marks, colours and the rest to a later touch.
  sections:
    confidence: estimated
    note: >-
      estimated - the product page says "Three 20A double-pole circuit breakers (1 per output phase)" and
      "L1-L2 feeds black outlets; L2-L3 feeds dark-gray outlets; L3-L1 feeds light-gray outlets", and page 1
      says "12 C13 and 3 C19 per phase". No held document says which section is on which phase pair or which
      breaker protects which section. They are read in order from the top. Section 1 is on breaker 1 and
      L1-L2, section 2 on breaker 2 and L2-L3, and section 3 on breaker 3 and L3-L1 (gaps: section-order).
      The outlet colours that code the pairs are not drawn (gaps: colours).
  meters:
    confidence: drawing
    note: >-
      drawing - one meter of three rows, "Digital Load Meter" on page 1. Each row reads "88.8" with its pair
      printed beside it. L3-L1 is at the top, then L2-L3 and L1-L2, and "LOAD (AMPS)" runs along the side. The
      rows' grey backgrounds are the drawing's own fills, 67.84, 44.31 and 25.88 per cent grey. The product
      page says "Set of 3 digital current meters report output current per phase". Page 1 says the input
      current is displayed (disagreements, gaps: meter-reads). Both statements are kept and the rows are labelled with
      the pair. Each row is three characters of eaton/tripplite-phase-meter@1. The part's rows are equal, while the
      drawing's row boxes are 24.6, 23.0 and 24.6 along (gaps: meter-row-boxes).
  breakers:
    confidence: drawing
    note: >-
      drawing - each breaker is a rectangular paddle in a small plate (page 1 callout C: "20A 2-Pole Hydraulic
      Magnetic Circuit Breakers"). The part is eaton/tripplite-breaker-20a-2p@1. The rating is the product
      page's 20 A double-pole, one for each output phase pair. The paddle tips stand outside the body
      (gaps: side-projections).
  rear:
    confidence: drawing
    note: >-
      drawing - the rear view and detail A. Two toolless mounting buttons stand on the centre line. They are
      134.01 [5.28] from the top end, 86.43 [3.40] from the bottom end and 1556 [61.26] apart. The three
      figures sum to 1776.44, the strip's length. The rear view also draws two plates for the removable
      mounting brackets. Each is 53.5 across and 47.0 along, with four holes in a column and a tab 1.7 wide and
      42.2 along at the left edge. Four holes and the two round marks carry inner rings. It draws two small round marks lower on the right.
      The two buttons are the shared button part, whose rings are not the sheet's (gaps: shared-part-rings). A keyhole plate holds the top button, and the lower button has none. It is 56.8 wide
      and 59.0 along, from 88.5 below the top end, and it overhangs the left edge by 3.9. It is drawn from
      the edge, with its keyhole slot above the button. Four seam ticks stand on the edges at 1398.5 and
      1453.4 from the top end, each about 13.8 long. The right tick of the lower pair is 1.0 past the edge in
      the drawing and is drawn on the edge. All are estimated off the vector sheet at the rear view's own scale,
      3.10697 mm per point, good to about 0.5 mm. Each hole stands 2.27 mm below the top edge of its plate.
      The two marks are measured from the lower plate. The plate's side tab and the brackets stand outside the
      body and are not drawn (gaps: side-projections).
  sides:
    confidence: drawing
    note: >-
      drawing - the side view draws the body 42.78 deep with the breaker end 67.40 deep. Each side shows the
      body, eight round marks and one plate. Two marks are at the top end and six stand in a column near the
      front wall, 312.2 apart. Each mark is four concentric circles, 6.2, 3.4, 3.1 and 2.55 across. The top mark
      has the first three, and marks 3 and 6 carry a slot 2.55 long. The side view's own end lines are 572.45
      points apart. That is 1776.44, so its marks are read at 3.103 per point from the top end line. The front
      wall is the line at 200.46 points. Their centres stand 3.94 from it, the top one's 12.69, and the last mark's
      centre stands 12.7 from the body end. The plate is 42.08 by 59.02 and level with the rear keyhole plate. It starts 4.96 behind
      the back and ends 37.12 in. Its screw cluster is five circles, 25.4 to 7.9 across, 23.55 from the back and
      118.10 from the top, with a cross 4.8 long. Five things stand outside that depth and are not drawn. The
      first is the front plate's edge lines, with the meter plate and a lip. The rest are the outlet mouldings
      seen edge-on, the paddle tips, the button profiles and the removable brackets (gaps: side-projections). The front is at the right of the drawing, which is the left view in the kit's
      convention. The right side is built as a mirror of that documented side, as no document shows it.
  input:
    confidence: datasheet
    note: >-
      datasheet and drawing - "Input Connector L21-30P", "Input Cord Length 6 ft." (page 1), "NEMA L21-30P"
      (product page), and detail E, the twist-lock plug face. The cord is attached and leaves the end of the
      strip through a hex strain relief, so the part stands on the bottom face. Its `input-plug` is the slug
      the cord part exports, `nema-l21-30p`. The input is 208 V three-phase, 24 A continuous (agency
      de-rated), from the product page. The drawing's page 1 gives "208V 3-Phase Input / 208V Single-Phase
      Output". The Tripp Lite manual for 3-phase basic PDUs gives 200 to 240 V, a range that holds the
      nominal. THE WIRING IS NOT STATED by any held document. `input-wiring: wye` is an estimate. The plug is
      NEMA's three-phase wye configuration. The sibling G4 unit with the same plug states wye on its drawing
      (gaps: input-wiring).
  capability:
    confidence: datasheet
    note: >-
      datasheet - the product page: "Local metered PDU", a set of three meters that read the current of each
      output phase pair, and no outlet switching. The finest level metered is the phase pair, which is a
      branch, so `metering-scope: branch` and `outlet-switching: false`.
  dcim:
    confidence: datasheet
    note: >-
      the input is one power port, NEMA L21-30P. Each outlet is a power outlet fed by it, `iec-60320-c13` or
      `iec-60320-c19`. Each goes through its section's breaker, which states the `lines` it is across. No
      `feed_leg` is written: every outlet is line to line (docs/pdu-model-design.md section 5.2).
