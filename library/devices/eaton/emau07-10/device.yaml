format: 1
kind: device
name: emau07-10
version: 0.1.0
maturity: modelled
manufacturer: Eaton
model: EMAU07-10
description: >-
  Eaton ePDU G3 managed rack PDU, 2U horizontal, 200 to 240 V. A 19 in black metal box, 213.2 mm deep.
  It takes a single-phase feed through a fixed 10 ft cord ending in a NEMA L6-30P, 24 A.
  It hands the feed on to 16 IEC C13 outlets in two colour-coded sections of eight.
  A is yellow on the upper row and B blue on the lower, each on its own 20 A two-pole breaker.
  Every outlet is switched and metered. The left of the front carries the cord gland and the network module.
  The module has two stacked RJ-45 ports, a network RJ-45, a USB-A port, a reset button, a display and four buttons.
  Beside it are the two breakers and a lamp tile for each section.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S TECHNICAL DRAWING, MEASURED, NOT DIMENSIONED. The Eaton ePDU Managed EMAU07-10 technical
      drawing (EMAU07-10 G3 MANAGED, 9 Mar 2016, revision 00, configuration EMA6MT15JDC23AC, one D-size sheet)
      dimensions only the overall. It prints 482.7 [19.00] wide over the ears, 87.1 [3.43] high and 213.2 [8.39] deep.
      Every other figure was read off a 600 dpi render against the 482.7, 5.66 px per mm, good to about 0.5 mm.
      The sheet has four views: a rear plate, a plan, the front and a perspective. It has no side view.
      No photograph of this model is held, so every colour other than the two section colours is unchecked.
  chassis:
    confidence: drawing
    note: >-
      drawing - 87.1 high, 213.2 deep, 482.7 over the ears. The body reads 444.5 between the ears, so each ear is
      19.1. The datasheet page gives other figures for the same box (19 in, 5 in and 3.4 in on its length, height and
      width lines). The drawing governs (gaps: size-disagreement). "BLACK CHASSIS"; the hex is a stand-in.
      The datasheet page gives 13.3 lb (6.03 kg) and the drawing no weight.
  ears:
    confidence: drawing
    note: >-
      drawing - an L flange at each end of the front with two slots each (rear view). The library's generic ear
      stands for them (`chassis.ears`). The slots' pitch is not dimensioned (gaps: ear-slots).
  front:
    confidence: drawing
    note: >-
      drawing - mm from the body's left and top, front view. Cord plate 9.5 to 36.7 across and 4.7 to 43.8 down.
      Earth screw centred (10.8, 59.7), 13.1 across over its washer, its symbol from 70.3 down.
      Network module plate 18.9 to 164.3 across and 45.8 to 83.6 down, the same module as the EMIT04-10's.
      The ports, buttons and display sit where that sheet puts them, shifted by (-3.0, +44.1), and each checks against this sheet within 1 mm.
      Breaker A's plate stands at 44.8 across and 23.1 down, breaker B's at 105.1, each 59.2 by 19.4 with two screws above it.
      Lamp tiles are 17.0 wide at 174.2 across, A from 6.9 to 41.9 down and B from 45.4 to 80.3.
      Each tile has eight lamps in two columns at 180.7 and 185.8.
      The 16 C13 outlets are centred 24.0 apart in two groups of four, the upper row 25.3 down and the lower 67.0.
      A1 to A4 are at 226.8 to 298.8, A5 to A8 at 334.6 to 406.6, and B1 to B8 the same.
      The drawing's section strips run 2 mm wide along the outer edge of each group of four.
      Each has a tab 5 mm wide labelled with the outlet's name and an arrow.
  grips:
    confidence: estimated
    note: >-
      drawing, read by eye - above each outlet the sheet draws a grip plate 20.6 by 4.7.
      It has a black block 3.1 by 3.8 at its left, and a small triangle, a cross and a ring beside it.
      They are drawn here as a plate, a block, a cross, a triangle and a ring, each placed from the sheet at the plate's offsets.
      No figure dimensions them.
      No document names them beyond the datasheet page's outlet grip line on the drawing's output cell ("(16) IEC 60320 C13 GRIP").
      Every size is estimated.
  rear:
    confidence: drawing
    note: >-
      drawing - the rear plate, the first view of the sheet, is a plain plate.
      It has a lip 4.2 high along its foot from 19.4 to 435.0 across. There are four marks about 1 mm across at 7.1 and 438.4 across, 14.5 and 68.2 down. Nothing else is drawn.
  top:
    confidence: drawing
    note: >-
      drawing - the plan, with the rear at the top as the library draws a top.
      Six screws 6.4 across at (112.4, 7.8), (332.5, 7.8), (7.8, 101.8), (436.9, 101.8), (105.0, 194.0) and (337.5, 194.0).
      A band 12.7 deep runs along the front edge.
  sides:
    confidence: estimated
    note: >-
      the left, right and bottom faces are built as the documented side, as no document shows this one.
      The sheet's perspective shows a plain left end with the ear flange at the front, and that is the documented side.
      The right end and the underside are drawn as plain as it is, from the same source.
  outlets:
    confidence: drawing
    note: >-
      drawing - "OUTPUT (16) IEC 60320 C13 GRIP", OUTPUT RATING "200-240V~; 10A PER C13; 16A MAX PER SECTION; 24A MAX TOTAL".
      A1 to A8 are the upper row and B1 to B8 the lower.
      Each is printed on a tab at the end of its group of four. That puts A1 and A4, A5 and A8, B1 and B4, B5 and B8 on tabs.
      The C13s between take their numbers from the run (gaps: outlet-numbers).
      Each is drawn with its earth slot to the left, as the sheet draws it.
  breakers:
    confidence: drawing
    note: >-
      drawing - "CIRCUIT BREAKERS (2) 20A 2-POLE LISTED". The one-line diagram puts each of A and B across L1 and L2
      with a meter in each line. Each is eaton/g3-breaker-20a-2p@1 with its tile in the section's colour.
  lamps:
    confidence: drawing
    note: >-
      drawing - each tile prints eight numbered circles. No held document says what they show or what colour they are.
      Each is drawn off as a lamp of the tile, declaring `on` and `off` and no colour.
      It is bound to the chassis and not to an outlet (gaps: lamp-function). The sheet's circles are 3.0 across and the part is 2.0.
  cord:
    confidence: drawing
    note: >-
      drawing - INPUT "NEMA L6-30 PLUG", "10FT 10AWG / 3C POWERCORD"; INPUT RATING "200-240V~", "2W+PE", "24A", "50/60HZ".
      The plan draws the cord leaving the front edge at the left end.
      It leaves through the round gland of the plate at the left of the front (eaton/g3-cord-l6-30p-front@1). The cord is fixed. `input-plug` is the slug the cord exports,
      `nema-l6-30p`.
  module:
    confidence: drawing
    note: >-
      drawing - the network module of the EMIT04-10.
      It has two stacked RJ-45 ports, read from shape as the serial and daisy-chain ports, the order assumed as there.
      It also has the network RJ-45 over a USB-A port, the reset hole labelled R, the display and four buttons.
      It is not modelled as a bay (gaps: meter-module-bay).
  capability:
    confidence: drawing
    note: >-
      drawing and datasheet - "CURRENT, POWER, AND ENERGY METERING FOR INPUT, BRANCH AND OUTLET; OUTLET SWITCHING";
      datasheet "OUTLET CONTROL Yes": `metering-scope: outlet`, `outlet-switching: true`.
  dcim:
    confidence: drawing
    note: >-
      the input is one `nema-l6-30p` power port (eaton/g3-cord-l6-30p-front@1). Each C13 outlet is an `iec-60320-c13`
      power outlet fed by it, named as printed, A1 to A8 and B1 to B8.
