gaps:
- what: size-disagreement
  scope: [front, top]
  reason: vendor-silent
  note: >-
    the datasheet page prints 19 in on its length or depth line, 5 in on its height line and 3.4 in on its width line.
    The drawing prints 19.00 in wide, 3.43 in high and 8.39 in deep.
    The 19 and the 3.4 agree with the drawing under other names and the 5 matches no figure on it. The drawing governs.
  wanted: the maker's specification sheet for the EMAU07-10, which the datasheet page lists and is not held.
- what: colours
  scope: [front, rear, top]
  reason: needs-photo
  note: >-
    no photograph of this model is held. The sheet says "BLACK CHASSIS".
    The two section colours are sampled on the sheet's own fills (yellow 14988 px, blue 14529 px) and are not checked against a photograph.
    The chassis hex, the unlit display and the breaker handles are stand-ins.
  wanted: a photograph of the EMAU07-10.
- what: ear-slots
  scope: [front, rear]
  reason: needs-drawing
  note: >-
    the rear plate shows two slots in each ear and no figure dimensions them, so the generic ear stands for them.
  wanted: a dimensioned drawing of the ear.
- what: cord-gland
  scope: [front]
  reason: vendor-silent
  note: >-
    the plan draws the cord leaving the front at the left end.
    The round gland read at that place is taken to be its gland. No figure names it. Its saw-toothed edge is drawn as the sheet draws it.
  wanted: a photograph of the front's left end.
- what: lamp-function
  scope: [front]
  reason: vendor-silent
  note: >-
    each tile prints eight numbered circles and no held document says what they are.
    They may be outlet status lamps, since the outlets are switched and the numbers run one to eight, but nothing says so.
    So no lamp is bound to an outlet. No colour is stated.
  wanted: the maker's specification sheet or a photograph of a powered unit.
- what: meter-module-bay
  scope: [front]
  reason: needs-drawing
  note: >-
    the module is replaceable (the datasheet page lists a replace-and-configure document).
    No held document draws it apart from its faceplate, so no bay stands for it. The ports, display and buttons are placed on the face.
  wanted: a drawing or photograph of the module and its slot.
- what: module-port-order
  scope: [front]
  reason: vendor-silent
  note: >-
    the quick start (P-164000314_2, July 2014, page 2) names five items.
    They are a serial or EMP port, an Ethernet port, a USB port, a reset button and a daisy chain port.
    Its drawing is too small to tell which of the sheet's stacked pair of RJ-45 sockets is which.
    The upper is drawn as the serial port and the lower as the daisy chain. The order is an assumption.
  wanted: a photograph of the module with its labels.
- what: outlet-numbers
  scope: [front]
  reason: vendor-silent
  note: >-
    the sheet prints the names of the first and last outlet of each group of four only.
    The outlets between take their names from the run.
  wanted: a photograph of the front.
- what: legends
  scope: [front]
  reason: needs-drawing
  note: >-
    the sheet prints small symbols beside the network, USB and serial ports and a row of five marks above the network port.
    They are drawn as estimated silkscreen strokes and text, read by eye.
    The wordmark is plain text in place of the maker's outline letters.
  wanted: a photograph of the module.
- what: ground-point
  scope: [front]
  reason: vendor-silent
  note: >-
    the sheet draws a cross-head screw on a washer, 13.1 across, with the earth symbol below it, and names no part or
    thread. It is placed as common/ground-screw-washer@1 (11.0). The thread and the washer's size are not stated.
  wanted: a dimensioned detail of the earth point.
