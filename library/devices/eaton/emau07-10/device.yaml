  physical:
    weight-kg: 6.03
  power:
    input-ac: 200-240 V single-phase (2W+PE), 24 A, 50/60 Hz
    input-plug: nema-l6-30p
    input-cord: fixed
    input-phase: single
    input-current-a: 24
    plug-rating-a: 30
    capacity-kw: 5.76
    output-voltage: 200-240 V
    output-rating: 10 A per C13; 16 A per section; 24 A total
    breakers: two 20 A two-pole breakers, one per section
    frequency: 50/60 Hz
  environmental:
    operating-temp: 0 to 60 C (32 to 140 F)
  management:
    metering-scope: outlet
    outlet-switching: true
    metering: current, power and energy for the input, each section and each outlet
    network-interface: network module, RJ-45 network port, two RJ-45 serial and daisy-chain ports, USB-A
