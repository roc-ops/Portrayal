gaps:
  - what: dimensions
    scope: [front, top, left, rear]
    reason: sources-disagree
    note: >-
      the spec sheet prints 4.130 x 2.170 x 19.480 in as height, width, depth; 19.48 is the width,
      and which of the other two is the depth is not stated. 2.170 is taken as the height and 4.130 as
      the depth because the part is 1U. No drawing or manual settled it.
    wanted: the submittal drawing or the owner's manual, with the unit dimensioned
  - what: drawing
    scope: [front, top, left, rear]
    reason: needs-drawing
    note: >-
      no dimensioned drawing was found: the submittal drawing's address returns an error page.
      The walls, the slots, the cover's reach, the ears and the two rear windows are estimated.
    wanted: the submittal drawing of the part
  - what: bend-radius
    scope: [front]
    reason: vendor-silent
    note: >-
      the spec sheet says the manager "routes and organizes network cabling through your 19 in. rack
      while maintaining proper bend radius" and states no radius.
    wanted: a bend radius from the owner's manual or the SKU page
  - what: cable-capacity
    scope: [front]
    reason: vendor-silent
    note: >-
      the spec sheet states no cable capacity or fill.
    wanted: a cable capacity and its basis from the owner's manual or the SKU page
  - what: rear-centre-block
    scope: [rear]
    reason: needs-drawing
    note: >-
      the maker's picture of the rear shows a block with two small dark squares between the two
      windows; no document says what it is, and it is not drawn.
    wanted: a close picture or a drawing of the rear
