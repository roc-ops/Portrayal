format: 1
kind: device
name: srcableduct1ufc
version: 0.1.2
maturity: modelled
manufacturer: Eaton
model: SRCABLEDUCT1UFC
description: >-
  Eaton Tripp Lite series SmartRack 1U horizontal fiber cable manager, a finger duct with a
  snap-on cover, in high-visibility yellow steel for fiber, copper and coax cable. Its channel
  is on a back plate that bolts to the rack rails, on either the front or the rear, and
  stands 104.9 mm out of them. A wall along its top and one along its bottom each carry 24
  slots a cable is laid through. Two windows in the back plate pass cable to the other side.
  The cover ships fitted and snaps off.
profile: passive
provenance:
  sources:
    confidence: datasheet
    note: >-
      THE MAKER'S OWN DOCUMENT AND NOTHING ELSE. The SRCABLEDUCT1UFC spec sheet
      (assets.tripplite.com, 2 pages, © 2026 Eaton): five pictures, a description, features,
      applications and a specification table. The submittal drawing at the address the
      SRCABLEDUCT1U's follows returns an XML error page, not a PDF; the Eaton SKU page was
      tried once (the .html and the skuPage .pdf export both fail at the connection with an
      HTTP/2 stream error, and a regional copy timed out). So no dimension is drawn and every
      figure but the unit size is estimated. Nothing is copied from the pictures. The copy of the
      sheet read for the ears, the windows and the rear block is the 2026 print, hashed in
      `datasheet`; it differs in bytes from the copy this device was first drawn from, which
      was recorded under the hash 1b812813... and is not held.
  size-conflict:
    confidence: estimated
    note: >-
      THE SPEC SHEET'S AXES ARE OUT OF ORDER, AND NO OTHER MAKER DOCUMENT SETTLES WHICH IS THE
      DEPTH. "Unit Dimensions (hwd / in.) 4.130 x 2.170 x 19.480" (10.490 x 5.511 x 49.50 cm):
      the inch and centimetre figures agree, but 19.48 in is plainly the width, so the order
      is not h, w, d. The part is 1U and a 1U part is not 4.13 in (104.9 mm) tall, so the 2.170
      in (55.12 mm) is taken as the height and the 4.130 in as the depth. The inference is the
      model's and not a maker's statement; the pictures show the duct deeper than it is tall. The
      owner is asked to accept it. Both figures are over their 1U values (44.45 mm), and the
      19.48 in width is 12.2 mm wider than the 19.00 in rack face (see `ears`).
  mount:
    confidence: datasheet
    note: >-
      datasheet - `rack-face`: the spec sheet says the manager mounts "on either the front or
      the rear of your rack cabinet or open frame rack", with all hardware included for an
      EIA-standard 19 in rack. It bolts to the rail face at one rack unit and stands out of
      it. No document shows how far the back plate stands behind the ear plane, so `depth` is
      the overall 104.9 and the whole of it is taken as projecting. It is one part for both
      faces: the format places a rack-face part on either face, and the placement says which.
  ears:
    confidence: estimated
    note: >-
      estimated - a rack-face part is its ears and what hangs off them. The spec sheet's width
      is 19.480 in, 494.79 mm, more than the 482.6 of 19.00 in: the ears seem to stand out past
      the rack face (the pictures show tabs at the end), and no document says by how much. The
      face is drawn the whole 494.79 and the ears are the 31.5 mm at each end, which leaves the
      431.8 of the maker's SRCABLEDUCT1U between them. THE MAIN PHOTOGRAPH SHOWS THREE SLOTS IN
      THE LEFT EAR, counted twice by eye at 6 times and by a column profile. The slot centres read
      8.0, 28.1 and 48.2 mm from the plate's top edge, so they are drawn 20 mm apart and centred
      on the 55.12 mm plate. The scale is the plate's 55.12 mm over its 52 px. A slot is 8 mm
      high (the white run, 7.4 mm, and its edge pixels). Its 12 mm length is the SRCABLEDUCT1U
      drawing's, because the ear is turned away in the photograph and its width cannot be read. The
      slots stand 14.9 mm in from the end, 465 mm between centres, as an EIA-310 ear's holes do.
      The right ear is the same by symmetry: the photograph shows it edge-on with one hole.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 494.79 x 55.12 x 104.9 (19.480 x 2.170 x 4.130 in), the spec sheet's figures
      in the order `size-conflict` settles. THE HEIGHT IS MORE THAN ONE RACK UNIT (44.45 mm)
      and the part is stated as 1U ("Horizontal Cable Manager - Finger Duct with Cover, Yellow,
      1U"). The part states `ru: 1`.
  thickness:
    confidence: estimated
    note: >-
      estimated - no document states the gauge; 1.1 mm is the SRCABLEDUCT1U's, a drawing of the
      same maker's 1U steel duct.
  weight:
    confidence: datasheet
    note: datasheet - 0.68 kg (1.500 lb), the spec sheet's Unit Weight.
  front:
    confidence: estimated
    note: >-
      estimated - the cover, fitted: a front plate across the channel (the picture of the duct
      from the front shows a solid front face; the cover lifted clear is a flat strip). The two
      walls and the channel between them are drawn as the SRCABLEDUCT1U's drawing gives its own,
      1.1 mm walls standing 1.1 mm in from the top and bottom, which leaves 50.72 mm clear. The
      `duct` guide is that channel over the 431.8 mm between the ears.
  guides:
    confidence: estimated
    note: >-
      estimated - FINGERS ON BOTH WALLS, 24 SLOTS A WALL, COUNTED ON THE MAKER'S PHOTOGRAPHS. The
      spec sheet's features say "Fingers on either side"; its pictures show a row of slots
      along the top wall, and the picture of the duct with the cover lifted shows slots in both
      walls. 24 slots across 431.8 mm is the 18.0 pitch of the SRCABLEDUCT1U's drawing, an
      8.0 mm slot between 10.0 mm bars (by eye). The slots are closed at both ends, as that drawing
      draws them. The "proper bend radius" the sheet claims is the shape of the fingers and
      states no radius (gap `bend-radius`). A cable is laid along the channel and passes between
      the walls through a slot.
  passes:
    confidence: estimated
    note: >-
      estimated - TWO WINDOWS IN THE BACK PLATE, from the maker's picture of the rear: two long
      openings either side of a centre block, each showing the fingers behind it. The spec sheet
      says "pass-through holes in the rear allow convenient access to cabling for routing and
      separation of bundles". The rear picture is 100 x 100 px, a perspective view. Its edges were
      read by eye at 8 times along the plate's middle line, then corrected with one projective map
      that puts the middle of the dark block at the middle of the part. The windows come out
      126 x 22 mm, 82 mm in from each end: 126.2 and 125.8 mm long, 83.9 and 80.1 mm in, before rounding. The 22 mm
      height is kept from the first reading and was not measured again. The figures are good to
      about 6 mm, so they are a stand-in. The first drawing, by eye on the perspective view, put
      the left window 62.3 mm in; the corrected reading is 82 mm. Open: nothing is said to close them. A cable crosses from the front of
      the duct to the rear through one, with the cover off.
  top:
    confidence: estimated
    note: >-
      estimated - the plan, rear at y=0: the back 5.0 mm, the wall, and the cover's lip over the
      front 12.0 mm; the 24 slots run from 8.0 mm in front of the back to under the lip. The
      bottom is the same as the top.
  left:
    confidence: estimated
    note: >-
      estimated - the side: the back plate, the two walls with the channel between them, and the
      cover's plate and lips over the front. The duct is open at both ends and a cable runs out
      of it there: nothing is built across the ends. The main photograph looks into the open left
      end and shows a small grey pin inside it, 0.58 of the way from the back plate to the cover
      and 0.31 of the way down the channel. It is drawn as a 2.5 mm disc there, an estimate: it is
      3 px across, too small to sample or to name. The right end is not seen, so the pin is not
      drawn there. The right is otherwise the same, turned round.
  rear:
    confidence: estimated
    note: >-
      estimated - the back plate with its ears and their three slots each, the two windows of
      `passes`, and the block between them that the rear picture shows as two dark squares. Each
      square is 25 x 30 mm, 11 mm apart, centred on the plate. Their width and gap come from the
      same corrected readings (25.3 and 24.1 mm wide, 11.2 mm apart) and their height is 1.38 times the window's, read at 8 times.
      What the squares are, a hole or a fitting, no document says, so they are drawn as marks.
  cover:
    confidence: datasheet
    note: >-
      datasheet - the cover ships fitted and snaps off (the spec sheet's highlights "Convenient
      snap-on cover allows quick unconstrained access to cabling", its description "The snap-on
      cover lets you rapidly add or remove cables"). It is drawn fitted in `base` and absent in
      `cover-off`, as a lid (`lid: true`). A snap-on cover is a removable part, not a hinge, and
      no clip is drawn: the format has none and no document draws one. Two of the sheet's
      pictures show the cover lying beside the duct. That is not drawn: a face is the device's own
      envelope and the kit has no shape for a loose part standing apart from it, so the cover is
      drawn fitted in `base` and absent in `cover-off`.
  capacity:
    confidence: datasheet
    note: >-
      datasheet - the spec sheet states no cable capacity, fill or bend radius. None is
      recorded and none is estimated; gaps say so.
  attrs:
    confidence: datasheet
    note: >-
      datasheet - colour (yellow), material (high-visibility yellow steel), the mounting hardware
      (included), the cables it is for (fibre, copper and coax) and compliance (RoHS) are the
      spec sheet's.
  color:
    confidence: estimated
    note: >-
      estimated - "Color: Yellow" and "high-visibility yellow steel" are the spec sheet's; no
      sampled value exists, so #f2c200 is this library's render of it. It is carried as a field
      (`finish`) that the `base` configuration sets on every part, so a colour is one word and not
      a second drawing, and the outline is a fixed shade of the fill so the yellow reads on a
      white stage as well as the dark one.
