format: 1
kind: device
name: ema325-10
version: 0.1.0
maturity: modelled
manufacturer: Eaton
model: EMA325-10
description: >-
  Eaton ePDU G3 managed rack PDU, 0U, three-phase. A 1689 mm black aluminium strip that hangs on two mounting
  buttons beside a rack. It takes a 120/208 V three-phase feed through a fixed 10 ft cord that ends in
  a NEMA L21-20P (16 A, 5.76 kW). It feeds 18 IEC C13 and 6 IEC C19 outlets in three sections of eight.
  The sections are A (yellow), B (blue) and C (red), each on its own 20 A two-pole breaker. Between sections
  A and B is the network module. It has a serial RJ-45, a network RJ-45, a daisy chain RJ-45, a USB-A
  port, a display and four buttons. The PDU meters the input, each branch and each outlet, and it switches
  the outlets.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S TECHNICAL DRAWING. Eaton, "EMA325-10 G3 MANAGED" (DWG EMA6PB15JGD88B1,
      rev 001, 4 Aug 2014) is one A3 vector sheet. It dimensions the overall size and the two mounting
      buttons. Every other figure was read off a 600 dpi render against the strip's own 1689 and 52. That
      is 4.377 px per mm, good to about 0.5 mm. The sheet draws the strip lying with the cord end at the
      left. This model turns it a quarter turn so the cord end is at the foot, as the library's other
      zero-U strips stand. The sheet shows the front, one long side, the rear, the cord end and a perspective.
      No photograph is held: the product page's one picture is a person holding the strip. Every colour
      is therefore checked against the drawing's own fills only.
  mount:
    confidence: drawing
    note: >-
      `rack-side`, the library's way to say a part stands beside an upright, with two mounting buttons
      on its back. The drawing's rear view dimensions them 1555.8 [61.25] apart. The first is 51.0 [2]
      from the cord end and both are centred across the strip. The strip's depth is 65, so `ru` is 0.
      The cord retention bracket above the end view is outside the body and is not drawn.
  chassis:
    confidence: drawing
    note: >-
      drawing - 66.50 in (1689 mm) long, 2.05 in (52 mm) wide and 2.56 in (65 mm) deep. It draws an end
      view of a 52 by 65 box. The product page prints 66.5 in under length and depth. It prints 2.56 in
      under height and 2.05 in under width, so its labels differ from the drawing's (gaps: size-labels).
      The drawing governs. Weight 19.8 lb (8.98 kg) from the product page. Material aluminium and colour
      black are from the drawing ("ALUMINUM CHASSIS, BLACK"). The hex is a stand-in.
  front:
    confidence: drawing
    note: >-
      drawing - the front view is read from the cord end along the strip. It is turned to y from the top,
      with y = 1689 minus the distance from the cord end. The cord plate runs to 108.5. It carries the
      wordmark, a small screw and an earth screw on a washer. The breaker plate runs from 108.5 to 315.4
      with three breakers 64.0 apart. Section A's outlets stand from 498.0 to 806.7 and the module plate
      from 810.3 to 993.1. Sections B and C are section A moved 523.8 and 863.5 along the strip.
  sections:
    confidence: drawing
    note: >-
      drawing - each section is four C13 on a 23.99 pitch, a gap, two C13, a gap and two C19 on a 39.0
      pitch. They are numbered 1 to 8 under the lamps. The C13 earth slot is on the side away from the
      cord and the C19 earth slot the same. Each group has a coloured outline and a coloured strip runs
      under the groups, carrying the section letter. Section colours were sampled on the sheet's own fills
      at 300 dpi: yellow (248,232,64), blue (0,0,248) and red (248,0,0).
  pitch:
    confidence: estimated
    note: >-
      estimated - the sheet dimensions no outlet pitch. The 23.99 and 39.0 are measured on the render
      and good to about 0.3. The three sections repeat to the pixel, so one measurement serves all three.
  outlets:
    confidence: drawing
    note: >-
      drawing - OUTPUT "(18) IEC 60320 C13 GRIP", "(6) IEC 60320 C19 GRIP". Output rating "200-240V~",
      "10A PER C13; 16A PER C19", "16A MAX PER SECTION". The drawn outlet faces are narrower than the
      C19 part, which is placed on the drawn centre. The sheet prints the numbers 1 to 8 in each section
      and the section letter apart. The outlets are named A1 to A8, B1 to B8 and C1 to C8.
  grips:
    confidence: estimated
    note: >-
      estimated - the sheet draws a grip under each outlet: a black block, a cross, a triangle and a small
      ring. The outlines were read from 400 dpi crops by eye, and no figure dimensions them.
  lamps:
    confidence: estimated
    note: >-
      estimated - 24 lamps, one under each C13 and beside each pair of pictograms for outlets 7 and 8,
      with the outlet's number beside it. The sheet draws each lamp as a plain white circle 5 across.
      The lamp part is 2.0 across inside a 5.0 lens, drawn dark, so every lamp is off. No held document
      says what a lamp shows (gaps: lamp-meaning).
  breakers:
    confidence: drawing
    note: >-
      drawing - CIRCUIT BREAKERS "(3) 20A 2-POLE LISTED". The one-line diagram puts section A across L1
      and L2, section B across L2 and L3 and section C across L3 and L1. Each has a round handle, a letter
      tile and a left screw, with two screws above the plate. The tiles take the sampled section colours.
  module:
    confidence: drawing
    note: >-
      drawing and datasheet - the network module plate between A and B has two ear screws and a stacked
      pair of RJ-45 at the left. It has a third RJ-45, a USB-A port, a reset hole, a display and four
      buttons. Port roles follow the marks the sheet prints beside them. They also follow a legend on
      page 2 of the Eaton ePDU G3 installation and connectivity quick start (P-164000314_2). It names
      serial or EMP, Ethernet, USB, reset and daisy chain. That guide is the generic G3 module, and its
      sample display reads EMA305-10, a different model. The stacked pair is serial above and network
      below. That differs from the EMIT04-10's reading and follows this sheet's own marks. The sheet draws
      the two arrow buttons as triangles pointing toward and away from the cord. Turned to the library's
      form with the cord at the foot, they point down and up.
  rear:
    confidence: drawing
    note: >-
      drawing - the rear view shows two mounting buttons on the centre line and a vertical line 127.2
      from the cord end. It shows two small holes, at 106.7 and 1662.6. The button is drawn 14.8 across
      as three rings. The library holds two button parts, 24.7 and 25.4 across. The Tripp Lite one is
      used because its three rings are closest in proportion (gaps: button-size).
  sides:
    confidence: drawing
    note: >-
      drawing - the long side view shows the 65 deep face with the front at the top. It draws a line 14.7
      from the front, the EATON ePDU wordmark, nine fixings and a vertical line 127.2 from the cord end.
      The sheet places the view below the front view. In third-angle projection that is the view from
      below, so it is the right face once the strip is turned. The left face is built as the documented
      side, as no document shows this one, mirrored in depth.
  ends:
    confidence: drawing
    note: >-
      drawing - the end view at the cord end draws a round gland 37.1 across with a serrated disc. It
      is centred across and 24.3 from the front. The gland is the new cord part. The far end is built
      as the documented side, as no document shows this one. It has no cord, so its face is plain.
  input:
    confidence: datasheet
    note: >-
      datasheet and drawing - INPUT "NEMA L21-20P", "10FT 12AWG / 5C POWERCORD" and INPUT RATING "120-208V~
      WYE, 3W+N+PE", 16 A, 50/60 Hz. The product page adds 5.76 kW. The cord is fixed. No power port type
      of the two export targets is held for an L21-20P. So `input-plug` is `other` and the export names
      the connector.
  capability:
    confidence: datasheet
    note: >-
      drawing and datasheet - FUNCTIONALITY "CURRENT, POWER, AND ENERGY METERING FOR INPUT, BRANCH AND
      OUTLET; OUTLET SWITCHING" and OUTLET CONTROL "Yes" on the product page. Serial interface RS-232
      (product page).
  dcim:
    confidence: datasheet
    note: >-
      the input is one power port, other (NEMA L21-20P). Each outlet is a power outlet fed by it, `iec-60320-c13`
      or `iec-60320-c19`, through its section's breaker. Each is named as numbered in its section.
attrs:
  physical: {length-mm: 1689, weight-kg: 8.98, construction: aluminium}
  power:
    input-ac: 120/208 V three-phase WYE (3W+N+PE), 16 A, 50/60 Hz
    input-plug: other
    input-cord: fixed
    input-phase: three
    input-wiring: wye
    input-voltage-v: 208
    input-current-a: 16
    plug-rating-a: 20
    capacity-kw: 5.76
    capacity-scope: >-
      the load the PDU can hand on (product page, "5.76kW max"); it is not what the PDU draws itself,
      which no document held states
    output-voltage: 200-240 V
    output-rating: 10 A per C13; 16 A per C19; 16 A per section; 16 A per phase
    breakers: three 20 A two-pole breakers, one per section
    frequency: 50/60 Hz
  environmental: {operating-temp: 0 to 60 C (32 to 140 F)}
  management:
    metering-scope: outlet
    outlet-switching: true
    metering: current, power and energy for the input, each branch and each outlet
    network-interface: >-
      network module with an RJ-45 network port, an RJ-45 serial port, an RJ-45 daisy chain port and USB-A
  compliance: {certifications: UL listed (cULus)}
chassis: {width: 52, height: 1689, depth: 65, ru: 0, mount: rack-side, color: '#1f2022', airflow: passive,
  weight-kg: 8.98}
gaps:
- what: size-labels
  scope:
  - left
  - right
  - top
  - bottom
  reason: sources-disagree
  note: >-
    the product page prints 66.5 in under length and depth, 2.56 in under height and 2.05 in under width.
    The drawing prints 66.50 in long, 2.05 in wide and 2.56 in deep. The body takes the drawing's figures.
  wanted: the maker's own statement of which dimension each label names.
- what: outlet-pitch
  scope:
  - front
  reason: needs-drawing
  note: >-
    the sheet dimensions no pitch inside a section. The 23.99 between C13 and the 39.0 between C19 are
    measured on a 600 dpi render, and no dimension states them.
  wanted: a dimension of the outlet pitch.
- what: colours
  scope:
  - front
  - rear
  - left
  - right
  - top
  - bottom
  reason: needs-photo
  note: >-
    no photograph of this model is held, so no colour is checked against one. The strip is drawn black
    as the sheet says, with the stand-in hex #1f2022. The section tints are the sheet's own fills.
  wanted: a photograph of the strip.
- what: lamp-meaning
  scope:
  - front
  reason: vendor-silent
  note: >-
    the 24 lamps under the outlets are drawn and numbered on the sheet. Neither the sheet, the product
    page nor the quick start says what a lamp shows or in what colour, so none has states.
  wanted: the G3 operation manual page on the outlet lamps.
- what: lamp-size
  scope:
  - front
  reason: needs-drawing
  note: >-
    the sheet draws each lamp as a white circle 5 across and the lamp part is 2.0 across. The part sits
    in a 5.0 dark lens.
  wanted: a dimensioned detail of the lamp.
- what: button-size
  scope:
  - rear
  reason: needs-drawing
  note: >-
    the sheet draws the mounting button 14.8 across as three rings, and head size and type are not stated.
    The library's Tripp Lite button part is 24.7 across, so it is drawn larger than the sheet shows.
  wanted: a dimensioned detail of the button.
- what: module-quick-start
  scope:
  - front
  reason: vendor-silent
  note: >-
    the Double-wide G3 quick start named on the product page is not held. The generic G3 quick start that
    is held shows a display reading EMA305-10. The module's ports are read from the sheet's marks and
    that legend.
  wanted: the Double-wide G3 installation and connectivity quick start.
- what: stand-in-fixings
  scope:
  - front
  - right
  - left
  - rear
  reason: needs-drawing
  note: >-
    the screws, holes and lines on the side and rear are read off the sheet by eye and no figure dimensions
    them. The wordmarks are drawn as text.
  wanted: a dimensioned detail of the side.
- what: cord-beyond-gland
  scope:
  - bottom
  reason: needs-drawing
  note: >-
    the cord's loop, its break line and the plug lie outside the strip's footprint on the sheet and are
    not drawn. Nor is the retention bracket above the end view. The kit draws nothing beyond a face.
  wanted: nothing more, as the far end of a cord is not a part.
