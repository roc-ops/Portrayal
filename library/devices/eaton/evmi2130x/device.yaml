  section-labels: {term: Label, role: furniture, index-origin: 1}
  breakers: {term: Breaker, role: service, index-origin: 1, description: 'A, B and C, each 20 A two-pole and each feeding the two sections of its letter'}
  network: {term: Slot, role: management, index-origin: 1}
  grounding: {term: Ground, role: furniture, index-origin: 1}
  power-input: {term: Input, role: service, index-origin: 1}
  mounting: {term: Button, role: furniture, index-origin: 1}
