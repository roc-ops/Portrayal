format: 1
kind: device
name: evmi2130x
version: 0.2.1
maturity: modelled
manufacturer: Eaton
model: EVMI2130X
description: >-
  Eaton Rack PDU G4, metered input, 0U: a 1730 mm black aluminium strip that hangs
  on two mounting buttons in a rack's vertical channel and hands a three-phase 120/208 V
  wye feed (a fixed 10 ft cord with a NEMA L21-30P plug, 24 A, 8.6 kW) on to 42
  outlets - 24 IEC C13 and 18 Eaton C39 - in six colour-coded sections of seven. Three
  20 A two-pole breakers, A, B and C, each line to line, each feed two sections. A
  hot-swappable network module with two gigabit Ethernet ports, a pixel LCD and four
  keys sits between the two halves.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR'S VECTOR DRAWING. Eaton drawing 9001-22301
      (EVMI2130X G4 METERED INPUT, first issue 18-Aug-2023, D size, SCALE 0.400) draws
      the PDU lying down, cord end at the left, in a front view, a side view below it
      and a rear view below that, with an end view of the cord end and a one-line
      diagram. Its views are paths, not a raster, so every position here was read off
      the PDF's geometry with PyMuPDF at 1.133858 pt per mm (0.4 x 72 / 25.4). The
      check on that scale is the drawing's own dimensions: 1730 overall lands at
      1961.58 pt (1730.0), the 1555.8 between buttons at 1764.06 pt (1555.8), the
      72.00 and both 55.80 to within 0.02. The library draws the PDU STANDING, cord end
      down, as the EVMI2130X_C5 photograph stands it, so a drawing x along the length
      becomes 1730 minus that, and a drawing y across becomes x. The 3000 px masters
      staged with the drawing (EVMI2130X_C5, _BK5, _SD5, _DT5 and the outlet, breaker,
      button and plug close-ups) are the second reading, for colour, the lamps and
      the printing.
  mount:
    confidence: drawing
    note: >-
      `rack-side`, which is the library's one way to say a part stands vertically
      beside the rack's opening, on a post, takes no rack unit and exports u_height 0
      and is_full_depth false (docs/vertical-cable-managers-design.md). The G4
      installation and setup guide P-164001156 rev 3 says every 0U G4 is "mounted
      vertically inside rack structures" (2.2): its two factory buttons go into the
      keyhole slots on the rack post (2.11.2), one or two PDUs a side (2.9, Fig. 7),
      in an enclosure's zero-U channel or on a Tripp Lite two- or four-post rack
      (2.11). `ru: 39` is the height it runs, the SKU title's 39U; 1730 is 38.9 units.
      Which side, and front or rear, is a lab placement's to say. The design note that
      made `rack-side` scoped the in-cabinet zero-U channel out (section 6); this
      device uses the device-level meaning, which fits, and not that channel.
  chassis:
    confidence: drawing
    note: >-
      drawing - 9001-22301 MECHANICAL: 68.11 in (1730 mm) length, 2.05 in (52 mm)
      width, 2.09 in (53 mm) depth, aluminium chassis, black. The 53 is the body from
      the face to the back (523.86 to 583.95 pt on the side view); the outlet
      mouldings stand 3.96 off the face, the breaker plates 7.5, the network module
      about 9 and its keys 11.0, and the buttons 9.4 off the back, none of it in the
      53. The SKU page's PRODUCT HEIGHT 53 mm and WIDTH 52 mm say the same with the
      axes renamed; the brochure's 68.1 x 2.1 x 2.1 in agrees. Weight 8.3 kg is the SKU
      page's.
  front:
    confidence: drawing
    note: >-
      drawing - the front view of 9001-22301, read in drawing mm (x from the cord end,
      y from the edge drawn at the top). Six outlet mouldings 181.29 long by 36.1 (y
      6.0 to 42.1) start at x 195.1, 457.3, 719.6, 1130.7, 1333.7 and 1536.6; each
      carries seven outlets at a 25.4 pitch (a C13 recess starting 3.24, 54.04, 104.84
      and 155.64 into the moulding, a C39 26.54, 77.34 and 128.14) and a printed strip
      at y 45.5 to 49.5. The breaker plates (60 by 48) start at 131.0, 393.2 and 655.5,
      the network module's faceplate spans 918.85 to 1106.75 and y 1.45 to 50.6. At
      the cord end, an M6 ground screw (12.5 across at 52.05, 38.05), a screw 6.0 across
      at 14.0, 26.0 and a round boss 8.2 across at 92.0, 36.0; a second 6.0 screw at
      1723.0, 26.0. End caps 2 thick at both ends.
  outlet-pitch:
    confidence: drawing
    note: >-
      drawing - NOT DIMENSIONED, MEASURED FROM THE PATHS. The C13 noses of section A
      stand at x 201.7, 252.5, 303.3 and 354.1 (50.8 apart, two outlets) and the C39
      recesses at 221.64, 272.44 and 323.24, so the outlet pitch is 25.40, one inch,
      and the same 50.8 holds in every section. The span checks against something
      dimensioned: the two buttons are 1555.8 apart on the same sheet at the same
      scale.
  sections:
    confidence: drawing
    note: >-
      drawing and photo - 9001-22301 labels the six SECTION A (YELLOW), B (BLUE), C
      (ORANGE), then the network module, then A, B, C again; the outlet close-ups
      number them A1-A7, B8-B14, C15-C21, A22-A28, B29-B35 and C36-C42, as the drawing
      prints them. The one-line diagram puts breaker A across L1 and L2, B across L2
      and L3 and C across L3 and L1, each feeding a SECTION box; there are three
      breakers (CIRCUIT BREAKERS: (3) 20A 2-POLE LISTED) at the head of the first A,
      B and C, and the second A, B and C have none, so each breaker feeds the two
      sections of its letter. That reading is the drawing's colour and letter
      labels; no sentence held says it in words.
  colours:
    confidence: photo-measured
    note: >-
      photo-measured - the section colours are the modal saturated pixels of the
      EVMI2130X-OUTLET-BANK_C5, _C6 and _C7 masters, a FIELD on the strip and breaker
      parts that each placement sets (library/components/README.md, #177). The body is
      the modal dark grey of the same masters, about #303030; the outlet mouldings are
      a shade darker in every photograph.
  rear:
    confidence: drawing
    note: >-
      drawing - the rear view of 9001-22301: the two mounting buttons on the width's
      centre line (the 1.02 [26.00] dimension), 72.00 from the cord end and 1555.8
      apart, and a 5.4 threaded hole 55.80 beyond each, at 127.8 and 1683.6, where
      the buttons can be moved. Both holes lie towards the far end of their
      buttons, so the second is outboard, not inboard. The view is
      symmetric about its centre line, so the rear is the view unmirrored.
  sides:
    confidence: drawing
    note: >-
      drawing - the side view of 9001-22301, the long side at the strip's edge (third
      angle, below the front view), which is the standing PDU's right; x = 0 is the
      front. Hex threaded inserts 6.6 across at 72.0, 127.8, 1627.8 and 1683.6, 20.0
      behind the face (the 1.30 [33.00] dimension, from the back), are the side-mount
      positions for the buttons; a Torx screw 6.0 across 20.0 behind the face at 31.9
      and 1697.9, and an end-cap screw 5.7 across 32.5 behind the face, 7.0 from each
      end. A seam runs the length 13.2 to 14.8 behind the face.
  left:
    confidence: estimated
    note: >-
      estimated - no view draws the other long side. It is drawn as the right side
      mirrored front to back, which EVMI2130X_SD5 (that side, front to the right)
      supports in the band it resolves: small fasteners about a third of the depth
      back at the cord end and the far end. The photograph cannot resolve the hex
      inserts, so they are carried over from the drawn side.
  ends:
    confidence: drawing
    note: >-
      drawing - the end view of 9001-22301 is the cord end: a grommet 36.9 across,
      centred on the width and 28.5 from the back, and the cord 18.2 across 31.1 from
      the back, beside the button standing off the back. Top and bottom views have y = 0
      at the rear. No view draws the far end; it is drawn as its end cap alone.
  lamps-and-module:
    confidence: drawing
    note: >-
      drawing and datasheet - the network module is eaton/g4-enmc@1, in a bay, because
      the GNM firmware user guide 2.2 calls it hot-swappable; its jacks, lamps, LCD and
      keys are read off the same front view and the guide's section 7.1. Its two
      Ethernet ports are eth0 and eth1, the names the module's LCD shows in
      EVMI2130X_DT5. The PDU face carries no lamp of its own.
  relief:
    confidence: drawing
    note: >-
      drawing - the side view of 9001-22301 puts the outlet mouldings 3.96 proud of the
      face (0.5 at their lip). They are drawn flat: a raised decor box would bury the
      outlets placed on it in 3D. The outlets are wells, 18 and 20 deep, from their
      own contracts, and the breaker plates are built 7.5 proud from theirs. The
      network module is 40 deep (estimated), inside the 53 mm body.
  dcim:
    confidence: datasheet
    note: >-
      the input is one NEMA L21-30P power port and each outlet a power outlet fed by
      it, `iec-60320-c13` or `eaton-c39` (both types in NetBox and Nautobot,
      dcim/choices.py). EACH OUTLET RUNS `through` ITS SECTION'S BREAKER, a fixed
      part (docs/pdu-model-design.md section 5.3), and each breaker states the
      `lines` it is across - A on L1-L2, B on L2-L3, C on L3-L1, from the one-line
      diagram - so the export writes "Through breaker A, lines L1-L2" on each
      outlet. NO feed_leg IS WRITTEN: every outlet is line to line, and a DCIM
      outlet's feed_leg names one leg (section 5.2). The input power port carries
      the rating as its description. THE OUTLETS ARE NAMED AS THE
      UNIT PRINTS THEM, A1 to C42 (the maintainer's decision, 2026-10-08): an id
      cannot spell A1, so the `interfaces:` rules map each `outlet-<letter><n>` to
      its printed label, and the export names the power outlet by it. The labels
      are read off the EVMI2130X outlet close-ups and the drawing.
  input:
    confidence: drawing
    note: >-
      drawing and datasheet - a NEMA L21-30P plug on a fixed 10 ft cord, 10 AWG and
      five conductors, as the model first recorded it in `input-plug` prose; since
      #934 `input-plug` is the slug the cord part exports (`nema-l21-30p`) and
      `input-cord: fixed` says it is not detachable. 9001-22301 gives the input as
      120/208 V three-phase wye, 3W+N+PE (rated 100-127/173-240 V), so
      `input-phase: three`, `input-wiring: wye` and `input-voltage-v: 208`, line to
      line; 24 A is the drawing's derated input and 30 A the plug the SKU title
      names.
  capability:
    confidence: datasheet
    note: >-
      datasheet - the G4 installation and setup guide P-164001156 rev 3, section 1.1
      and Table 1, sells this as metered input (MI): input and branch metering, no
      outlet metering, no outlet switching. So `metering-scope: branch` and
      `outlet-switching: false`, the published class `metered-branch`
      (docs/pdu-model-design.md section 2.2); the vendor's name stays in the
      description.
  lifecycle:
    confidence: datasheet
    note: >-
      searched 2026-10-08 (web, "Eaton EVMI2130X end of life OR discontinued") and
      found nothing; the product is from 2023 (the drawing's first issue). The G4 grid
      lists an EOL notification document under a /secure/ path, which was not fetched
      and may not concern this SKU.
attrs:
  physical:
    length-mm: 1730
    weight-kg: 8.3
    construction: aluminium chassis, black
  power:
    input-ac: 120/208 V three-phase wye, 3W+N+PE (drawing 100-127/173-240 V), 24 A, 50/60 Hz
    input-plug: nema-l21-30p
    input-cord: fixed
    input-phase: three
    input-wiring: wye
    input-voltage-v: 208
    input-current-a: 24
    plug-rating-a: 30
    capacity-kw: 8.6
    capacity-scope: >-
      the load the PDU can hand on (24 A at 208 V three phase), from the SKU title and
      the brochure table; it is not what the PDU draws itself, which no document held
      states
    output-voltage: 173-240 V, line to line
    output-rating: 10 A per C13, 16 A per C39, 16 A per section, 24 A per phase
    breakers: three 20 A two-pole, UL listed
    frequency: 50/60 Hz
  environmental:
    operating-temp: 0 to 60 C (32 to 140 F)
  management:
    metering-scope: branch
    outlet-switching: false
    metering: current, power and energy for the input; current for each branch
    network-module: G4 eNMC, dual gigabit Ethernet with network cascading
  compliance:
    emc: FCC part 15 class A, CAN ICES-003 class A
    safety: UL 62368-1; cTUVus on the drawing
    cybersecurity: UL 2900-1
    regulatory-model: EMIF-PDXJ-E27K
  lifecycle:
    eol: none-announced
chassis: {width: 52, height: 1730, depth: 53, ru: 39, mount: rack-side, color: '#2e3033', airflow: passive, weight-kg: 8.3}
gaps:
- what: outlet-depth
  scope: [front]
  reason: needs-drawing
  note: >-
    the outlet wells are built 18 (C13) and 20 (C39) deep from the plug side: the
    mating nose lengths in the registry (Volex V1625 and VAC19), cross-checked
    against the C14 and C20 shroud depths. No outlet drawing held dimensions the
    wells themselves. The mouldings' 3.96 standoff, which the drawing's side view
    does give, is not built: a raised box over the outlets would bury their wells.
  wanted: a section through an Eaton G4 outlet moulding, or a measured unit.
- what: boss-at-cord-end
  scope: [front]
  reason: vendor-silent
  note: >-
    9001-22301 draws a round boss 8.2 across at the cord end, between the ground
    screw and breaker A, and EVMI2130X_C5 shows it; nothing held names it. It is
    drawn as decor.
  wanted: the part's name from Eaton, or the unit.
- what: ground-symbol
  scope: [front]
  reason: needs-photo
  note: >-
    the installation guide 2.11.4 says the ground symbol is marked in the chassis
    beside the M6 bonding screw; neither the drawing nor EVMI2130X_C5 resolves it, so
    it is not drawn.
  wanted: a close-up of the cord end of the face.
