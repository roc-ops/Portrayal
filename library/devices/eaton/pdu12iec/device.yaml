  outlets-rear: {term: Outlet, role: traffic, index-origin: 1, mixed: 'the ten rear outlets of the one load bank, Rear 1 to 10 from the inlet end as seen from behind - two C19 then eight C13; the unit prints no numbers'}
  breakers: {term: Breaker, role: service, index-origin: 1, description: 'two 16 A push-to-reset breakers, one above the other; what each protects is not stated'}
