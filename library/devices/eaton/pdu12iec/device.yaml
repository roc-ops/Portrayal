format: 1
kind: device
name: pdu12iec
version: 0.2.1
maturity: modelled
manufacturer: Eaton
model: PDU12IEC
description: >-
  Eaton Tripp Lite series basic PDU, 1U horizontal: a black metal box about 434
  mm wide and 108 mm deep. It hands a single-phase 100 to 240 V feed, 16 A, on
  to 14 unswitched outlets in one load bank. On the front, four IEC C13
  outlets. On the rear are an IEC C20 inlet for a cord the user supplies, a
  grounding stud and two 16 A push-to-reset breakers. Also on the rear, two IEC
  C19 outlets and eight IEC C13 outlets. No switch, no meter, no network
  interface. The housing is reversible and its two mounting ears are separate
  brackets, which also turn for 0U, wall and under-counter mounting.
profile: power
provenance:
  method:
    confidence: photo-measured
    note: >-
      NO DRAWING EXISTS, SO EVERY POSITION IS READ OFF EATON PHOTOGRAPHS.
      Searched: the Tripp Lite spec sheet, the Eaton SKU export and the owner
      manual (933401 rev D) dimension nothing on the faces; the manual figures
      are perspective line art; no submittal drawing, dimensional drawing or
      CAD file is linked from the SKU page, and the addresses the sibling PDUs
      use for theirs return 404. PDU12IEC_BK (the rear) is a 3000 px master
      taken straight on, the body alone in frame, 2519 px wide and 254 high.
      THE SCALE IS SET BY A FEATURE OF STATED SIZE AND PROVED BY A SECOND. The
      spec sheet states the rear C13 outlets 28.75 mm apart, centre to centre;
      the eight wells repeat at 166.79 px (their edges, their centres and each
      of their three contact slots fitted separately give 166.7 to 167.0, the
      residuals under 1.2 px and no curvature across the row), which is 5.801
      px per mm. The second quantity is the stated 55 mm between the two C19
      outlets: wells, slots and flange screws read 316.8 to 319.0 px, mean
      317.75, which is 54.77 mm at that scale, 0.4 percent under the stated
      figure. Three registry dimensions agree as well: the C19 line and
      neutral slots read 13.06 apart against 13.0, its earth slot 8.00 off
      their line against 8.0, and the C13 line and neutral slots 13.88 against
      14.0. So a position on the rear is good to about 0.5 mm. PDU12IEC_C (the
      front) is NOT orthographic and is treated separately under `front`.
  chassis:
    confidence: photo-measured
    note: >-
      photo-measured for the width, datasheet for the height and the weight,
      estimated for the depth. WIDTH: the body is 2519 px in PDU12IEC_BK, 434.2
      mm at the scale under `method`. No printed figure is the body: the spec
      sheet gives 19.000 in beside 44,5 cm, the owner manual 17 1/4 in beside
      445 mm, and the photograph of the front shows the ears standing outside
      the body, so 19 in is read as over the ears (gaps: body-width). HEIGHT:
      spec sheet 1.750 in, 1U; the photograph reads 43.8. DEPTH: 108, the spec
      sheet figure (4.250 in, 10,8 cm) and the millimetre figure of the owner
      manual, which prints 3 3/4 in beside it; 108 is printed three times and
      95 implied once, and no top or side view exists to measure (gaps:
      depth). NOT FULL DEPTH: at 108 deep, in a rack the spec sheet asks to be
      at least 7.8 in (198 mm) deep, it leaves the opposite face of its rack
      unit free, so `full-depth: false`. Weight 3.20 lb, 1.45 kg (spec sheet).
      Material of construction: metal (spec sheet).
  colour:
    confidence: photo-measured
    note: >-
      counted, because no source states a colour. PDU12IEC_BK: of the 639572
      pixels of the body 94.1 percent are darker than 70 of 255 and 0.024
      percent (154 pixels, the lock washer on the stud and glints on the
      breakers) carry any hue. The bare face reads #2b3136 at the median (28800
      pixels above the parts), the C13 mouldings #2c3237 and the C19 flanges
      #2d3339: body, outlets and inlet are one black. The three-quarter
      photograph, less brightly lit, reads #1f2023 on the same face. The
      breaker nuts read #938c8c and #9e9798 (nickel) and the stud nut #a6adb6
      (zinc). The ears in PDU12IEC_C read #3e464e and #2c343e against a face of
      #464f57 and #3a434b beside them: the same black.
  ears:
    confidence: datasheet
    note: >-
      NOT DRAWN: THE EARS ARE SEPARATE BRACKETS, so the face is the body and the
      generic ear stands for them (`chassis.ears`). The owner manual (0U
      Rackmount Installation, step 1) unscrews them from the sides of the unit
      and names their screws, #6-32 flat head, 1/4 in; PDU12IEC_C shows one
      at each end of the front face, each with three openings (an oval, a
      keyhole and an oval), spanning the height of the face. The 1U
      Rackmount Installation figure shows them flush with the face that
      carries the four outlets, held by four user-supplied rack screws: one
      position, flush, the default. No source dimensions an ear. THE HOUSING
      IS REVERSIBLE (spec sheet: "Reversible all-metal housing faces front or
      rear in rack"): the ears stay where they are and the unit turns, which
      is a rack placement turned round and not a second position or a second
      device. For 0U, wall and under-counter mounting the same ears are turned
      a quarter and screwed back on (owner manual, 0U figure); that form is
      not modelled, and the PDUSIDEBRKT toolless 0U bracket the spec sheet
      sells separately is not either (gaps: zero-u).
  front:
    confidence: estimated
    note: >-
      ESTIMATED ALONG THE FACE, because the only photograph of the front,
      PDU12IEC_C, is taken from above and from the left: the face is 247 px
      high at its left end and 215 at its right, and the four C13 wells repeat
      at 158.2, 154.8 and 152.5 px. Read with a one-dimensional projective map
      fixed by the two ends of the face (the 434.2 of `chassis`) and that
      taper, the four centres come out evenly spaced (29.2, 29.1, 29.2) with
      the middle of the block at 49.4 to 50.1 percent of the face over the
      range of tapers the edges allow, so THE BLOCK IS DRAWN CENTRED, 174.0 to
      260.25 on the stated 28.75 pitch. Read with no correction the block
      would sit at 53 percent. WHAT THAT LEAVES: the corrected pitch is 29.2,
      1.6 percent over the stated 28.75, and the ear span comes out 471 where
      a rack face is 482.6, so this photograph does not close on itself and
      the block may be 3 mm either way (gaps: front-block). The Visio stencil
      preview draws the block centred too. Each outlet has its chamfered end
      to the left with the earth slot left of centre (the mirror of the rear),
      so the part is turned 270. Down the face the wells sit at 49.6 percent,
      the centre line. The mark at the left end is the Eaton logotype over
      TRIPP LITE and SERIES in plain capitals; its extent, 11.7 to 40.4 across
      and 11.8 to 32.8 down, is read through the same map.
  rear:
    confidence: photo-measured
    note: >-
      photo-measured - PDU12IEC_BK, mm from the rear face's left as seen from
      behind, and from its top. Along one centre line, 22.3 down (the parts
      read 22.2 to 22.4): the C20 inlet, its recess centred 25.5 across in a
      raised flange 0.3 to 50.3 with a screw at 4.45 and 45.65; the two C19
      outlets, centred 119.15 and 173.9 as read and drawn 119.0 and 174.0, the
      stated 55 apart about the same midpoint, each in a flange 53.6 by 34.0
      with a screw 22.5 either side; and the eight C13 outlets, centred 216.0
      and every 28.75 to 417.25 (read 215.98 to 417.31), each a snap-in
      moulding 28.4 by 35.2 abutting the next. The grounding stud is at (56.8,
      22.8), a pale round mark 5.8 across below it at (60.0, 32.6), and the
      two breakers one above the other at 81.2 across, 12.5 and 31.15 down,
      18.65 apart. ORIENTATION, each read off the photograph: the inlet has
      its earth pin at the bottom and the C19 outlets their earth slot at the
      bottom, so both parts are turned 180; the C13 outlets lie on their
      sides, chamfered end to the right with the earth slot right of centre,
      so the part is turned 90. The face prints no legend and no outlet
      number.
  inlet:
    confidence: datasheet
    note: >-
      datasheet and photo - spec sheet: "Input Connection Type IEC-320 C20";
      "C20 inlet accepts user supplied input cable with C19 output
      connection"; cord length 0. The recess reads 29.5 by 21.5 in
      PDU12IEC_BK against the 29.0 by 21.0 of std/c20-inlet@1. The flange
      round it is the inlet moulding, drawn as decor with its two screws.
      A CABLE CLAMP IS NOT DRAWN: the owner manual (Connecting the PDU) screws
      a clamp bracket to the chassis round the inlet and tightens a third
      screw on the cord, but the bracket is in no photograph and its figure is
      perspective line art (gaps: cable-clamp).
  outlets:
    confidence: datasheet
    note: >-
      datasheet and photo - spec sheet: "14 total outlets-8 rear C13, 2 rear
      C19 and 4 front C13-in one load bank"; "(12) C13; (2) C19"; counted the
      same in both photographs. std/c13-outlet@1 and std/c19-outlet@1. The
      wells read 22.4 by 29.8 (C13) and 35.3 by 27.1 (C19) against the parts'
      22.0 by 30.4 and 35.6 by 27.7. None is switched and none has a lamp.
  numbering:
    confidence: borrowed
    note: >-
      THE UNIT PRINTS NO OUTLET NUMBERS and no vendor document numbers them,
      so the names are borrowed from the NetBox community device type
      (netbox-community/devicetype-library, device-types/Eaton/
      Tripp-Lite-PDU12IEC.yaml at ffe03790): Front 1 to 4 (C13), Rear 1 and 2
      (C19), Rear 3 to 10 (C13). That file gives the order of the kinds on
      the rear, the C19 pair before the C13 row, which is their order from
      the inlet end; it gives no direction, so EACH GROUP COUNTS LEFT TO RIGHT
      AS SEEN FROM ITS OWN FACE: Front 1 is the left of the four seen from
      the front, Rear 1 the C19 next to the breakers, Rear 3 the C13 next to
      the C19 pair and Rear 10 the last, at the end away from the inlet.
  breakers:
    confidence: datasheet
    note: >-
      datasheet and photo - owner manual, Specifications: "Circuit Breaker(s)
      (Resettable): 2 x 16 amps", and Features: "When a circuit breaker trips,
      its plunger will pop up"; spec sheet: "Dual 16A circuit breakers" in the
      text and "16A circuit breaker" in the table. PDU12IEC_BK shows two round
      plungers in nickel hex nuts, common/breaker-push-reset@1. WHAT EACH ONE
      PROTECTS IS NOT STATED: the spec sheet calls the 14 outlets one load
      bank, so the two are not one per bank, and nothing held says whether
      they stand in the two conductors of the feed or split the outlets. So
      no outlet states `through` and no breaker states `lines` (gaps:
      breaker-wiring).
  ground:
    confidence: photo-measured
    note: >-
      photo-measured and datasheet - spec sheet: "Rear-panel grounding lug";
      owner manual, Features: "Use this screw (located by the power strip's
      receptacles) to connect your power strip to ground". PDU12IEC_BK shows a
      threaded stud with a zinc hex nut on a toothed lock washer and a flat
      washer. common/ground-stud@1 is the library's part of that kind; ITS
      NUT IS SMALLER THAN THE ONE PHOTOGRAPHED. The part draws a nut 8.1
      across the corners and 7.0 across the flats; the photographed nut reads
      about 9.4 across the corners (9.0 to 9.9 over its three pairs, the nut
      being seen a little from one side) and about 8.3 across the flats. So
      the drawn nut is about 1.3 short either way, a compromise of size and
      not of place. The pale round mark below
      it, 5.8 across and #afbac4, carries a faint figure the 3000 px master
      does not resolve; it is drawn as a plain disc and not as an earth symbol
      (gaps: round-mark).
  logo:
    confidence: estimated
    note: >-
      the front prints the Eaton logotype, which is not drawn: the area it
      covers is the `logo-zone` region. TRIPP LITE and SERIES below it are
      plain capitals and are drawn as text, in white as counted (6348 pixels
      of the mark brighter than 170, median #fefefe). Their place is read
      through the map under `front` and shares its uncertainty.
  dcim:
    confidence: datasheet
    note: >-
      the input is the inlet, one `iec-60320-c20` power port, and each outlet
      an `iec-60320-c13` or `iec-60320-c19` power outlet fed by it. All three
      slugs were read in both targets: netbox-community/netbox
      netbox/dcim/choices.py at 21d9223c (PowerPortTypeChoices TYPE_IEC_C20,
      PowerOutletTypeChoices TYPE_IEC_C13 and TYPE_IEC_C19) and
      nautobot/nautobot nautobot/dcim/choices.py at 061ccd5a (the same
      three). The outlets are named by the `interfaces:` rules (see
      `numbering`). NO feed_leg IS WRITTEN: a single-phase PDU is on whatever
      leg its cord is on (docs/pdu-model-design.md section 5.2). No outlet
      description names a breaker (see `breakers`).
  input:
    confidence: datasheet
    note: >-
      datasheet - spec sheet INPUT: single-phase; input voltage 120; 125; 127;
      200; 208; 220; 230; 240; recommended service single-phase 16/20A
      120-240V; maximum input 16 A ("Agency derated to 16A continuous (North
      America only)"); OUTPUT 3.84kW (240V) down to 1.92kW (120V), 16A total,
      16A max per C19 outlet, 12A (10A CE) max per C13 outlet; 50/60 Hz. The
      owner manual gives the range as 100V to 240V and the output as 15 amps
      for 100V to 120V or 16 amps for 208 to 240V; the low end, 100 or 120, is
      the two documents differing, and so is the current at the low end, 15
      or 16 (gaps: input-range). `input-voltage-v` is the top of the range,
      the one the stated 3.84 kW belongs to, and at that end both documents
      give 16 A, which is `input-current-a`. NO `plug-rating-a` IS STATED: the
      unit has an inlet and no plug, it ships no cord, and no document held
      rates a plug or a cord connector. The 20 of the spec sheet's "16/20A"
      is the service it recommends, a branch circuit of which 16 A is the
      continuous share, and not a rating of anything on the unit. So the
      exported input says 16 A and names no plug.
  capability:
    confidence: datasheet
    note: >-
      datasheet - spec sheet: "PDU Type: Basic"; "Switches: No power switch";
      "Switchless design prevents accidental shutdown". No meter, no display
      and no network interface is listed or photographed. So `metering-scope:
      none` and `outlet-switching: false`, the class `basic`
      (docs/pdu-model-design.md section 2.2), and no outlet declares a state.
  lifecycle:
    confidence: datasheet
    note: >-
      searched 2026-10-12 (web, "Tripp Lite PDU12IEC discontinued OR end of
      life OR replacement"): distributors list the part as active and no
      notice names it. The Eaton SKU page was live the same day. Nothing
      announces an end of life.
attrs:
  physical:
    weight-kg: 1.45
    construction: metal
  power:
    input-ac: 100/120 to 240 V single-phase, 16 A maximum (agency de-rated to 16 A continuous in North America), 50/60 Hz
    input-plug: iec-60320-c20
    input-cord: detachable
    input-phase: single
    input-voltage-v: 240
    input-current-a: 16
    capacity-kw: 3.84
    capacity-scope: >-
      the load the PDU can hand on, 3.84 kW at 240 V down to 1.92 kW at 120 V,
      16 A in all (spec sheet). It is not what the PDU draws itself, which no
      document held states
    output-voltage: 120-240 V
    output-rating: 16 A total; 16 A max per C19; 12 A (10 A CE) max per C13
    breakers: two 16 A, push to reset
    frequency: 50/60 Hz
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -30 to 50 C (-22 to 122 F)
    humidity: 5 to 95 % non-condensing
    altitude: 0 to 3000 m (0 to 10000 ft)
  management:
    metering-scope: none
    outlet-switching: false
  compliance:
    certifications: RETIE (Colombia); CAN/CSA-C22.2 No. 60950-1 (Canada); NOM (Mexico); UL 60950-1
    product-compliance: RoHS; CE (Europe)
  lifecycle:
    eol: none-announced
chassis:
  width: 434.2
  height: 44.45
  depth: 108
  ru: 1
  full-depth: false
  color: '#2b3136'
  airflow: passive
  weight-kg: 1.45
  ears:
    color: '#2b3136'
    positions:
      - {name: flush, label: 'mounting ears flush with the four-outlet face (owner manual, 1U Rackmount Installation)', default: true}
gaps:
- what: body-width
  scope: [front, rear]
  reason: sources-disagree
  note: >-
    three printed widths and none is the body. Spec sheet, Unit Dimensions:
    19.000 in, and 44,5 cm in the row below (19 in is 482.6 mm). Owner manual,
    Specifications: 17 1/4 in beside 445 mm (17.25 in is 438.2 mm). The
    straight-on rear photograph, scaled on the stated outlet pitch, measures
    the body at 434.2, and the same photograph scaled on the stated C19
    spacing at 436.0. 434.2 is drawn. 19 in is read as over the ears; 17 1/4
    in may be the body with the ear brackets screwed to its sides, which no
    source says.
  wanted: a dimensional drawing of the PDU12IEC, or a rule across the body of a unit.
- what: depth
  scope: [top, bottom, left, right]
  reason: sources-disagree
  note: >-
    spec sheet, Unit Dimensions: 4.250 in, and 10,8 cm. Owner manual,
    Specifications: 3 3/4 in beside 108 mm (3.75 in is 95 mm). 108 is used:
    it is printed in millimetres by both documents and in inches by one. No
    top or side view exists to measure.
  wanted: a dimensional drawing, or a rule along the side of a unit.
- what: front-block
  scope: [front]
  reason: needs-photo
  note: >-
    the only photograph of the front is taken from above and to one side. A
    projective reading puts the four outlets in the middle of the face, where
    they are drawn, but gives their pitch as 29.2 against the stated 28.75 and
    the ear span as 471 against a rack face of 482.6, so it does not close and
    the block may be 3 mm either way. The mark at the left end is placed by
    the same reading.
  wanted: a straight-on photograph of the front, or a dimensional drawing.
- what: breaker-wiring
  scope: [breakers]
  reason: vendor-silent
  note: >-
    the owner manual lists two 16 A resettable breakers and the spec sheet one
    load bank of 14 outlets; neither says what each breaker protects. Searched:
    the spec sheet, the Eaton SKU export, the owner manual text and its three
    figures, and both 230 V brochures. No outlet states the breaker it runs
    through.
  wanted: a wiring diagram of the PDU12IEC, or the word of the maker on what each breaker protects.
- what: cable-clamp
  scope: [rear]
  reason: needs-photo
  note: >-
    the owner manual (Connecting the PDU) fits a cable clamp bracket round the
    inlet with two chassis screws and a third that tightens on the cord. It is
    in no photograph, and the one figure of it is perspective line art with no
    dimension. It is not drawn, and neither are its screw holes.
  wanted: a photograph of the rear with the clamp fitted, with a scale.
- what: round-mark
  scope: [rear]
  reason: needs-photo
  note: >-
    a pale round mark 5.8 mm across sits below the grounding stud. The 3000 px
    photograph shows a faint figure on it and does not resolve it; the white
    lettering of the front mark, at the same scale in its own photograph,
    resolves cleanly, so the limit is the mark's contrast and not the camera.
    It is drawn as a plain disc.
  wanted: a close photograph of the grounding stud and the mark below it.
- what: zero-u
  scope: [left, right]
  reason: needs-drawing
  note: >-
    the PDU also mounts vertically beside the rails, on a wall and under a
    counter with its ears turned a quarter, and takes the PDUSIDEBRKT toolless
    side bracket, sold separately. Only the 1U rack form is modelled. A 0U use
    needs the ear's own dimensions and where its screws sit on the body sides,
    which no source gives, and a part for the PDUSIDEBRKT, of which no source
    is held.
  wanted: a drawing of the mounting ear and of the PDUSIDEBRKT, and a straight-on photograph of a side.
- what: input-range
  scope: [input]
  reason: sources-disagree
  note: >-
    the owner manual gives the nominal voltage as 100V to 240V; the spec sheet
    lists input voltages from 120 to 240 and titles the unit 120-240V. Both
    are carried in `input-ac`. THE CURRENT AT THE LOW END DIFFERS TOO: the
    owner manual gives the output as 15 amps for 100V to 120V and 16 amps for
    208 to 240V; the spec sheet gives 16A total at every voltage, with 1.92kW
    at 120V, which is 16 A. `input-current-a` is 16, the figure both give at
    240 V.
  wanted: the rating label of a unit.
- what: top-bottom-sides
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: >-
    no source shows the top, the bottom or a side straight on. The front and
    three-quarter photographs see a plain lid at a steep angle and one ear
    side on; the owner manual figures are perspective line art. The four faces
    are sized from the chassis and drawn bare.
  wanted: straight-on photographs of the top, the bottom and one side, with a scale.
