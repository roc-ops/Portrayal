format: 1
kind: device
name: b097-048
version: 0.1.0
maturity: modelled
manufacturer: Eaton
model: B097-048
portfolio: {line: Console servers, family: Tripp Lite series, series: B097}
description: >-
  Eaton Tripp Lite series B097-048, a 48-port serial console server, 1U, for a desktop or a 19 inch rack.
  The rear carries 48 RJ45 serial ports in two rows of 24 and three groups of eight columns, two RJ45
  Ethernet ports (NET1 and NET2) and two IEC AC inlets, each with a rocker switch, for its two built-in
  supplies. The front carries an RJ45 console port, two USB-A ports, an erase pinhole and four status
  lamps. The rack-mount kit fits to the sides of the body.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Five documents. Eaton, B097-048 product specifications (4 pages): the counts, the connector types,
      the power inlet and the sizes as the page labels them. Tripp Lite, quick start guide for the B097-016
      and B097-048, 93-386F rev B (4 pages): NET1 and NET2, the two built-in supplies and the rack-mount kit.
      Tripp Lite, owner's manual for the B093, B097 and B098 console servers, rev C (285 pages): the model
      table (p. 8), the two IEC inlets (p. 8), the serial pinout (p. 10) and the hardware specification
      (p. 273). Two photographs on the maker's product page: the rear straight on and the front at an angle,
      1000 pixels across. No dimensioned drawing, 3D model or stencil is held.
  size:
    confidence: datasheet
    note: >-
      THE SPECIFICATIONS PAGE AND THE MANUAL DISAGREE ON THE LONG SIDE AND THE PAGE'S LABELS ARE NOT USED.
      The page (p. 1) prints 17.32 in under length or depth, 1.75 in under height and 6.9 in under width. The
      manual's hardware specification (p. 273) prints "17 x 6.9 x 1.75 in. (44 x 17 x 4.5 cm)" for the
      B097-016 and the B097-048 together and does not label the axes. The rear photograph shows a body about
      9.4 times wider than it is tall, which fits 17.32 wide by 1.75 high and cannot fit 6.9 wide, so the
      page's labels are read as swapped: the width is 17.32 in (440 mm, which is also the manual's 44 cm),
      the depth 6.9 in (175.3 mm) and the height 1.75 in (44.45 mm, one rack unit). The manual's 17 in is
      431.8 mm and its 17 cm is 170 mm; those are read as roundings. The B097-016 page prints the same three
      figures under other labels (1.75 in under length or depth, 17.32 in under height), which is a second
      reason not to trust the labels. Both readings are in gaps `size-sources`.
  weight:
    confidence: datasheet
    note: >-
      The manual (p. 273) gives 9 lb (4 kg) for the B097-016 and B097-048 and the specifications page gives
      7.6 lb. No weight is stated on the chassis; both are written in `attrs.physical.weight-note`.
  scale:
    confidence: estimated
    note: >-
      EVERY POSITION IS READ OFF TWO 1000 PIXEL PHOTOGRAPHS. The rear is straight on but not orthographic: the body is
      812 px across for 440 mm (1.85 px per mm), yet the jack pitch reads 24.7 px (13.4 mm) in the left group, 26.0 px
      (14.1 mm) in the middle one and 26.9 px (14.5 mm) in the right one, and the two Ethernet jacks read wider than
      the serial ones, so the picture is stretched towards its right end (gap `photo-skew`). The registry's pitch of
      13.97 mm is used for every group and the three groups are spaced to span the photograph. A rear position is good
      to about 3 mm. The front is a three-quarter view from the left and above: positions across are the fractions of
      the black front plate's width, from the plate's left edge to its right edge, and positions down are the
      fractions of the plate's height. A front position is good to about 4 mm.
  front-layout:
    confidence: estimated
    note: >-
      The front photograph, read at 5x. A black plate fills the face between the ears from about 76 to 411 mm across
      and 3 to 36 mm down. On it, from the left: four green lamps 8.7 mm apart at about 189 mm, printed PWR, H/B, SER
      and NET above them; two stacked USB-A ports in a bright frame at about 262 mm with USB printed over them; an
      RJ45 jack in a bright frame at about 286 mm with CONSOLE printed over it; a pinhole about 12 mm to the right of the
      jack's centre with ERASE printed above it; and at the right the maker's mark, TRIPP LITE SERIES and "Model:
      B097-048", about 381 to 402 mm. The maker's mark is typeset as its word and is not the graphic. The lamps, the USB
      pair and the console jack stand where the B097-016's front photograph puts them.
  rear-layout:
    confidence: estimated
    note: >-
      The rear photograph, read at 4x. At the left, two dark supply plates each with a rocker switch above an IEC inlet
      turned a quarter turn (its earth contact to the right); the inlets and plates are placed as the same chassis's
      B097-016 rear photograph places them, which this photograph matches to the pixel. Then the 48 RJ45 serial jacks
      in two rows of 24 from about 50 mm, 13.97 mm between columns and 14.2 mm between rows, in three groups of eight
      columns. Printed numbers stand over the top row (1, 3, 5 to 47) and under the bottom row (2, 4, 6 to 48). At the
      right, two RJ45 jacks side by side, printed NET1 and NET2 beneath, about 401 to 434 mm.
  jack-gaps:
    confidence: estimated
    note: >-
      The three groups of eight columns are set apart by 4.6 mm more than the pitch (a gap of 5.9 mm between the last
      jack of one group and the first of the next). Read off the rear photograph: the dark cavity of the last jack of a
      group and the first of the next stand 15 px and 13 px apart where two cavities in one group stand 5 to 6 px apart,
      about 5 mm more at 1.77 px per mm; and the first and last jacks, 50 and 393 mm, span the photograph with the
      registry's pitch. The two gaps are drawn equal. No document dimensions them.
  inlet:
    confidence: datasheet
    note: >-
      The specifications page (p. 3) prints "POWER INPUT RECEPTACLE IEC-320-C14" and its package contents list
      "(2) C13 to NEMA 5-15P power cords". The manual (p. 8) says only "Two IEC AC power inlets are located at the rear
      of the unit". The rear photograph shows two three-pin inlets with the earth contact at the right, which agrees.
  serial-ports:
    confidence: datasheet
    note: >-
      Owner's manual p. 8, the model table: 48 serial ports for the B097-048. Specifications page: serial connector "RJ45
      (FEMALE)". Owner's manual p. 10 and p. 274: Tripp Lite console servers use the Cisco RJ45 pin-out, straight
      through, and "The B093 and B097 models have Cisco Straight serial pinouts". The B098 pinout choice on p. 10 does
      not apply to this model. The rear photograph prints each jack's number: the odd numbers over the top row and the
      even numbers under the bottom row, so the upper jack of a column is the odd port.
  console:
    confidence: datasheet
    note: >-
      Owner's manual p. 8, the model table: one console port for the B097-048. Specifications page (p. 3): "SIDEA
      CONNECTOR1 RJ45 (FEMALE)" followed by two "USB A (FEMALE)", which is the front's set of three connectors. The
      front photograph shows an RJ45 port printed CONSOLE.
  usb:
    confidence: datasheet
    note: >-
      Specifications page: USB ports (2), type A female. Owner's manual p. 8, model table: 2 USB for the B097-048.
      Owner's manual p. 7 says "four USB 2.0 console ports" of the line (gap `usb-count`). The USB version is not stated
      for this model; the manual (p. 10) says the ports on models other than the B098 "are mostly USB 2.0", so the white
      USB 2.0 tongue is drawn.
  network:
    confidence: datasheet
    note: >-
      Quick start guide p. 2: NET1 and NET2. Owner's manual p. 8: two 10/100/1000 Ethernet ports. The specifications
      page: "Dual GbE NIC", network speed 1 Gbps. Owner's manual p. 9 describes a combined copper and SFP port pair for
      the B098 only; the B097 has no SFP.
  power:
    confidence: datasheet
    note: >-
      Quick start guide p. 2: "built-in dual universal AC power supplies (with automatic failover)". Owner's manual p. 8:
      100 to 240 V, 50 or 60 Hz, "less than 30W" in all (p. 8 and p. 273). The specifications page gives 25 W and 85.3
      BTU per hour. The package holds two C13 to NEMA 5-15P cords of 6 ft, which are loose in the box and are not
      drawn on the inlets.
  switches:
    confidence: estimated
    note: >-
      The rear photograph shows a small rocker switch above each inlet, a circle at its left end and a bar at its right.
      No held document names or dimensions the switches; their size is the part's own estimate and which end is on is
      not stated, so they are drawn at rest.
  ears:
    confidence: estimated
    note: >-
      Quick start guide p. 2: "Attach the included rack-mount kit to the sides of the console server". No document
      dimensions the kit or its holes. The front photograph shows an ear on each end at the front plane with one hole
      and a column of slots on the side behind it, so the shipped position is flush. The body is the metal between
      the ears and the ears are not drawn (a viewer asks for a generic pair).
  colour:
    confidence: photo-measured
    note: >-
      Median of a plain patch of the rear face above the two Ethernet jacks in the rear photograph, #424244; the front
      plate's median in the front photograph is #191919. The specifications page says COLOR Black; the supply plates
      have no plain patch wide enough to sample and are drawn a little darker than the face by eye. The B097-016's
      photographs read a lighter rear and a darker plate under other light.
attrs:
  physical:
    weight-note: >-
      9 lb (4 kg) in the owner's manual, p. 273; 7.6 lb on the product specifications page; no weight is stated for
      this model
  power:
    power-input: 100 to 240 VAC, 50/60 Hz, two built-in supplies with automatic failover, two C14 inlets (specifications page)
    power-consumption: 25 W (specifications page); less than 30 W (owner's manual)
  platform:
    storage: 4 GB flash (owner's manual p. 8; the specifications page title reads 4 Gb)
  environmental:
    operating-temp-c: 5 to 50
    storage-temp-c: -30 to 60
    operating-humidity: 5% to 90% non-condensing RH
  features:
    serial-pinout: >-
      Cisco straight RJ45 (owner's manual pp. 10 and 274): 1 CTS, 2 DSR, 3 RXD, 4 GND, 5 GND, 6 TXD, 7 DTR, 8 RTS
chassis:
  width: 440
  height: 44.45
  depth: 175.3
  ru: 1
  color: '#424244'
  power: ac
  ears:
    positions:
    - {name: flush, label: 'rack-mount kit on the sides, flush with the front (quick start guide p. 2)', default: true}
gaps:
- what: size-sources
  scope: [front, rear, top]
  reason: sources-disagree
  note: >-
    The specifications page p. 1 prints 17.32 in under length or depth, 1.75 in under height and 6.9 in under width;
    the owner's manual p. 273 prints 17 x 6.9 x 1.75 in (44 x 17 x 4.5 cm) with the axes unlabelled. The long side is
    17.32 in (439.9 mm) on the page and 17 in (431.8 mm) or 44 cm (440 mm) in the manual. 440 is drawn as the width,
    the page's labels being read as swapped (the photograph is nine times wider than high). The depth is 6.9 in (175.3
    mm) in both inch readings and 17 cm in the manual's centimetres; 175.3 is drawn.
  wanted: A dimensioned drawing, or the maker's word on the width and depth of the body.
- what: weight-sources
  scope: [front]
  reason: sources-disagree
  note: >-
    9 lb (4 kg) in the owner's manual p. 273 and 7.6 lb on the specifications page. Neither is stated on the chassis.
  wanted: The maker's weight for the B097-048.
- what: storage-temperature-sources
  scope: [front]
  reason: sources-disagree
  note: >-
    -22 to 140 F (-30 to 60 C) on the specifications page p. 2 and -20 to 140 F (-30 to 60 C) in the owner's manual
    p. 273. The Celsius figures agree and are the ones written.
  wanted: The maker's storage temperature.
- what: usb-count
  scope: [front]
  reason: sources-disagree
  note: >-
    The owner's manual p. 7 says "four USB 2.0 console ports" of the line; its model table p. 8 and the specifications
    page give two for the B097-048, and the photograph shows two. Two are drawn.
  wanted: The maker's USB count for the B097-048.
- what: patch-cable-sources
  scope: [front]
  reason: sources-disagree
  note: >-
    The package holds two patch cables: "Cat5e" on the specifications page p. 2 and "Cat5 UTP" in the quick start guide
    p. 2. They are loose in the box and are not drawn.
  wanted: The maker's cable category.
- what: photo-skew
  scope: [rear]
  reason: needs-drawing
  note: >-
    The rear photograph is not orthographic: the same 13.97 mm pitch reads 13.4, 14.1 and 14.5 mm across its three
    groups of jacks and the two Ethernet jacks read wider than the serial ones. Rear positions are good to about 3 mm
    and the gap between the groups of jacks is read from it (`jack-gaps`).
  wanted: A dimensioned rear drawing, or the maker's pitch of the jacks and the gap between the groups.
- what: lamps
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    The specifications page lists 8 LEDs for power, heartbeat (firmware running), serial connectivity and network
    ports. The front photograph shows four green lamps printed PWR, H/B, SER and NET. The other four are not seen; the
    rear photograph shows no lamp on any jack.
  wanted: The maker's LED table.
- what: ear-positions
  scope: [front, rear]
  reason: needs-drawing
  note: >-
    The rack-mount kit goes on the sides of the body. No document gives its holes, its offset from the front or whether
    it can fit at the rear or mid-body. Only the flush position the photograph shows is stated.
  wanted: The rack-mount kit's drawing or installation figure.
- what: sides-top-bottom
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: >-
    No document shows the lid, the base or a side straight on. The front photograph sees the lid and the left side at
    a slant and only as plain metal with a column of slots behind the ear.
  wanted: Photographs of the top, bottom and sides.
