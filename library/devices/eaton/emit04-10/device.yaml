format: 1
kind: device
name: emit04-10
version: 0.1.0
maturity: modelled
manufacturer: Eaton
model: EMIT04-10
description: >-
  Eaton ePDU G3 metered input rack PDU, 1U horizontal, 200 to 240 V. A 19 in black
  metal box, 203.2 mm deep, that takes a single-phase 200 to 240 V feed (a fixed
  10 ft cord ending in a NEMA L6-30P, 24 A) and hands it on to 8 IEC C13 and 4 IEC
  C19 outlets in two colour-coded sections of six, each on its own 20 A two-pole
  breaker, A (yellow) and B (blue). The controls end carries the hot-swappable meter
  module (two RJ-45 ports (serial and daisy-chain), a network RJ-45, a USB-A port, a pixel display
  and four buttons), the two breakers and outlets A1 and A2; the other end carries
  the cord gland and the remaining ten outlets. The meter reads the input and each
  section.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S SPECIFICATION DRAWING, MEASURED, NOT DIMENSIONED.
      Eaton EMIT04-10 ("ePDU G3 SPECIFICATION DRAWING FOR EMIT04-10", part
      EMI3MTB5JDQ13A1, revision 002, 21 Jan 2016, one D-size sheet) is a vector
      sheet that dimensions only the overall: 482.6 [19.00] wide, 42.9 [1.69] high
      and 203.2 [8.00] deep. Every other figure was read off a 300 dpi render
      against the 482.6, 9.45 px per mm, good to about 0.5 mm. The sheet says "DO
      NOT SCALE DRAWING". It has the same four views as the EMIT03-10's sheet, and
      THE CORD FACE IS TURNED HALF A TURN ON THE SHEET (its labels are upside down)
      and is drawn here as it stands, seen from behind. No photograph of this model
      is held. The brochure (Rack PDU G3+, BR155022EN, 2019, EMEA) has two small
      photographs of 1U horizontal G3+ units on its page 3 (their model numbers are not
      printed) and larger ones of vertical units on page 2; they show the meter module,
      the buttons, the display and the section colours, and are the colour reference
      here, not photographs of this model.
  chassis:
    confidence: drawing
    note: >-
      drawing - 42.9 high, 203.2 deep, 482.6 over the ears; the body reads 444.4
      between the ears' inner edges, so it is 444.5 and each ear 19.05. "BLACK
      CHASSIS"; the hex #1f2022 is a stand-in. No weight is stated by any held
      document (gaps: weight).
  ears:
    confidence: drawing
    note: >-
      drawing - as the EMIT03-10: an L flange with a slot at each end of the
      controls face. The library's generic ear stands for them (`chassis.ears`).
  front:
    confidence: drawing
    note: >-
      drawing - mm from the body's left and top, as seen from the front. The meter
      module is the same as the EMIT03-10's (plate 21.9 to 166.7 across; serial
      and daisy-chain ports at 33.6; network port at (57.2, 13.4); USB-A (57.2, 25.1); buttons at
      96.8 and 153.8; display at (110.2, 4.2)). Breaker A's plate stands at 188.5
      across and 21.2 down and breaker B's at 250.7, each 59.2 by 19.4 with two
      mounting screws 9.0 above it. Outlets A1 and A2 are C13s centred 364.6 and
      389.1 across and 19.5 down, in a yellow-edged block 348.7 to 401.8 across;
      their labels A1 and A2 at 344.9 and 405.3. The module's labels and the
      left-hand earth point are as the EMIT03-10's.
  rear:
    confidence: drawing
    note: >-
      drawing - the cord face, seen from behind, so x runs the other way from the
      front: mm from the left as seen from behind. The cord gland (32.8 across flats,
      37.9 across corners) centred 36.6 across. Then A3 and A4 (C13, yellow block,
      63.6 to 115.3) centred 77.0 and 102.2; B1 to B4 (C13, blue block, 121.7 to
      222.2) centred 134.7, 159.4, 184.4 and 208.9; then four C19, A5 and A6 (yellow)
      and B5 and B6 (blue), each in its own edged plate 47.9 wide, centred 252.6,
      304.1, 354.0 and 404.9. The C13s are centred 17.4 down and the C19s 23.9 down.
      Screws 6.2 from each end. THE DRAWN OUTLET FACES ARE NARROWER THAN THE PARTS: the
      C19 well reads 32.5 across where std/c19-outlet@1 is 35.6, and the part is placed
      on the drawn centre.
  outlets:
    confidence: drawing
    note: >-
      drawing - "OUTPUT (8) IEC 60320 C13 GRIP, (4) IEC 60320 C19 GRIP", OUTPUT RATING
      "200-240V~; 15A PER C13; 16A PER C19; 16A MAX PER SECTION; 24A MAX TOTAL". A1 to
      A4 are the C13s of section A, A5 and A6 its C19s; B1 to B4 the C13s of section
      B, B5 and B6 its C19s. Only the C19s' labels and the ends of each C13 run are
      printed (B4 and B1, A4 and A3); the other C13s take their numbers from the
      run, which the sheet's order of printing implies and does not state (gaps:
      outlet-numbers). C13s are drawn with the earth slot to the right on the
      controls face and, turned half a turn on the sheet, to the left as drawn there,
      which is to the right as they stand seen from behind; the C19s have their earth
      slot up on the sheet and so down as they stand.
  breakers:
    confidence: drawing
    note: >-
      drawing - "CIRCUIT BREAKERS (2) 20A 2-POLE UL LISTED"; the one-line diagram puts
      each of A and B across L1 and L2.
  module:
    confidence: drawing
    note: >-
      drawing and datasheet - the same meter module as the EMIT03-10's (see its
      provenance; the product overview PA155003EN calls it hot-swappable); not modelled
      as a bay (gaps: meter-module-bay).
  input:
    confidence: drawing
    note: >-
      drawing - INPUT "NEMA L6-30 PLUG", "10FT 10AWG / 3C POWERCORD"; INPUT RATING
      "200-240V~", "2W+PE", "24A", "50/60HZ". The cord is fixed. `input-plug` is the
      slug the cord exports, `nema-l6-30p`.
  capability:
    confidence: drawing
    note: >-
      drawing - "CURRENT, POWER AND ENERGY METERING FOR INPUT & BRANCH": `metering-scope:
      branch`, `outlet-switching: false`.
  dcim:
    confidence: drawing
    note: >-
      the input is one `nema-l6-30p` power port (eaton/g3-cord-l6-30p@1); each C13 outlet
      is an `iec-60320-c13` power outlet and each C19 an `iec-60320-c19` power outlet fed
      by it, named as printed.
attrs:
  power:
    input-ac: 200-240 V single-phase (2W+PE), 24 A, 50/60 Hz
    input-plug: nema-l6-30p
    input-cord: fixed
    input-phase: single
    input-current-a: 24
    plug-rating-a: 30
    output-voltage: 200-240 V
    output-rating: 15 A per C13; 16 A per C19; 16 A per section; 24 A total
    breakers: two 20 A two-pole breakers, one per section
    frequency: 50/60 Hz
  environmental:
    operating-temp: 0 to 60 C (32 to 140 F)
  management:
    metering-scope: branch
    outlet-switching: false
    metering: current, power and energy for the input and each branch
    network-interface: hot-swappable meter module, RJ-45 network port, RJ-45 serial and daisy-chain ports, USB-A
  compliance:
    certifications: UL listed (cULus)
chassis:
  width: 444.5
  height: 42.9
  depth: 203.2
  ru: 1
  color: '#1f2022'
  airflow: passive
  ears:
    color: '#1f2022'
    positions:
      - {name: flush, label: 'ears flush with the controls face, as the specification drawing draws them', default: true}
gaps:
- what: weight
  scope: [front]
  reason: vendor-silent
  note: >-
    no held document states the weight of the EMIT04-10: the drawing gives none and the overview and brochure give
    none per model.
  wanted: the maker's specification sheet for the EMIT04-10 with its unit weight.
- what: colours
  scope: [front, rear, top]
  reason: needs-photo
  note: >-
    no photograph of this model is held. The sheet says "BLACK CHASSIS" and its section outlines are yellow and blue;
    the brochure's page 3 photographs of 1U G3+ units (a later generation than the 2015 sheet) show a black chassis
    and module, yellow (A) and blue (B) lettered tiles, light blue buttons with white symbols and a lit blue-violet
    screen. The buttons' light blue and the tiles' two hues are taken from them and are borrowed, not measured on this
    model. The chassis hex, the unlit display's dark blue and the breaker handles' pale colour are stand-ins.
  wanted: a photograph of the EMIT04-10.
- what: ground-point
  scope: [front]
  reason: vendor-silent
  note: >-
    the sheet draws a round 12.9 point at the left end of the controls face with the earth symbol under it, and
    names no part. It is placed as a ground screw on a washer (common/ground-screw-washer@1, 11.0); the size and the
    kind of fixing are not stated.
  wanted: a dimensioned detail or a photograph of the controls end.
- what: meter-module-bay
  scope: [front]
  reason: needs-drawing
  note: >-
    the meter is hot-swappable but no held document draws it apart from the faceplate, so no bay and no module
    component stand for it; the ports, display and buttons are placed on the face.
  wanted: a drawing or photograph of the module and its slot.
- what: outlet-grips
  scope: [rear, front]
  reason: needs-drawing
  note: >-
    the sheet draws a plate above each C13 and beside each C19 with a lever, crosses, a triangle and a ring, the
    outlet's grip (the overview lists "Integrated IEC outlet grips prevent accidental disconnects"), and no figure
    dimensions them. They are not drawn.
  wanted: a dimensioned detail of the grip or a photograph.
- what: outlet-numbers
  scope: [rear]
  reason: vendor-silent
  note: >-
    the sheet prints the numbers of the four C19s and the end numbers of each C13 run only; the C13s between
    take their numbers from the run (B4 to B1 left to right on the sheet, A4 then A3).
  wanted: a photograph of the cord face.
- what: top-features
  scope: [top]
  reason: needs-drawing
  note: >-
    the plan shows two bands along the rear and front edges and six screws, and no figure gives their relief. Only
    the screws are drawn.
  wanted: a section through the lid.
- what: module-port-order
  scope: [front]
  reason: vendor-silent
  note: >-
    the quick start (P-164000314_2, July 2014, page 2) names a serial or EMP port, an Ethernet port, a USB port, a
    reset button and a daisy chain port for the module, and its drawing is too small to tell which of the sheet's
    stacked pair of RJ-45 sockets is the serial port and which the daisy chain. The upper is drawn as the serial
    port and the lower, under the chain symbol, as the daisy chain; the order is an assumption. The quick start
    allows four units on a chain where the product overview (PA155003EN, 2018) says eight.
  wanted: a photograph of the module with its labels, or the module's operations manual.
- what: module-legends
  scope: [front]
  reason: needs-drawing
  note: >-
    the sheet prints the chain, network and USB symbols, the small legend above the network port and the Eaton
    wordmark on the module, as outlines a millimetre or two high; none is drawn (the wordmark is the `logo-zone`
    region). The ground point drawn here is a screw on a washer where the sheet draws an empty circle.
  wanted: a photograph of the module.
