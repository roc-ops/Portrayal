  breakers: {term: Breaker, role: service, index-origin: 1, description: 'two 20 A two-pole breakers, A and B, one per section'}
  serial: {term: Port, role: management, index-origin: 1, description: 'the serial / environmental probe (EMP) RJ-45 port of the meter module'}
  chain: {term: Port, role: management, index-origin: 1, description: 'the daisy-chain RJ-45 port of the meter module'}
  reset: {term: Button, role: management, index-origin: 1}
  network: {term: Port, role: management, index-origin: 1}
  usb: {term: Port, role: management, index-origin: 1}
  display: {term: Display, role: indicator, index-origin: 1}
  buttons: {term: Button, role: management, index-origin: 1}
  grounding: {term: Ground, role: furniture, index-origin: 1}
  power-input: {term: Input, role: service, index-origin: 1}
