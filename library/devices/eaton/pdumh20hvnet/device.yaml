format: 1
kind: device
name: pdumh20hvnet
version: 0.1.0
maturity: modelled
manufacturer: Eaton
model: PDUMH20HVNET
description: >-
  Eaton Tripp Lite series switched PDU, 1U horizontal, a 440 mm black metal box.
  It hands a single-phase 208/230 V feed on to eight individually switched IEC
  C13 outlets, each with a lamp, all on the front. The input is a C20 inlet at
  the right end of the front. It takes the detachable 8 ft cord in the box, which
  comes with a C19-to-L6-20P adapter. Beside it are a pre-installed WEBCARDLX
  network card and a two-digit meter of the total load in amps. The card has
  10/100 Ethernet, a micro-USB console, USB-A for sensors, a reset button and a
  status lamp. The rear has a ground screw and a DE-9 port reserved for the
  factory.
profile: power
provenance:
  method:
    confidence: photo-measured
    note: >-
      NO DRAWING EXISTS. The rear is read off a straight-on photograph. The front is read off
      a three-quarter photograph, so its positions are estimates. Searched: the spec sheet and
      the owner's manual (933681 rev D) dimension nothing on the faces. REAR - PDUMH20HVNET_BK
      spans the body in 838 px, so 1.904 px per mm at 440.2 mm. Its face is 82 px high, 43.1 mm,
      against the spec sheet's 43.7 mm. FRONT - PDUMH20HVNET_C looks at the face from the left
      at an angle. A one-dimensional projective map along the face was fitted to the eight outlet
      lamps and the two ends of the body (0 and 440.2 mm). The lamp pitch was left free. The
      lamps sit 35.65 apart and the fit's rms is 0.25 px, about 0.15 mm. Every other front
      feature is read in pixels and put through the same map. The error is about 1 mm along the
      face. It grows to about 2 mm at the right end, where the scale is smallest. Heights are
      read as a fraction of the local face height, good to about 1 mm.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - spec sheet LENGTH/DEPTH 17.33 in, HEIGHT 1.72 in, WIDTH 14.77 in, weight 9 lb,
      1U, minimum rack depth 17.1 in, material metal. The spec sheet does not say which of 17.33
      and 14.77 is the width. The rear photograph's face is 838 by 82 px, a ratio of 10.2.
      17.33 over 1.72 is 10.07 and 14.77 over 1.72 is 8.6. So 17.33 in (440.2 mm) is the
      width and 14.77 in (375.2 mm) the depth. The height is 43.7 mm. Colour photo-measured, the rear
      face's median is #292a2a over 22400 px.
  ears:
    confidence: photo-measured
    note: >-
      NOT DRAWN: THE EARS ARE SEPARATE BRACKETS, so the face is the 440.2 mm body and the generic ear
      stands for them (`chassis.ears`). PDUMH20HVNET_C and _DT02 show an ear at each end of the front,
      a flat plate in the plane of the face. Each has a column of four slotted holes, two large ovals
      at the ends and two small ones between. The owner's manual (Installation, 1-1) has the longer
      brackets screwed to the sides. Its Features page draws the shorter bracket with the same column
      of four slots. The library reads a face wider than the body as a rack face only when a part is
      seated in an ear. None is, so the ears and their slots are not drawn (gaps: ear-holes). Two
      positions are named and none is dimensioned: flush (the photograph) and recessed (the manual's
      1-1 text).
  front:
    confidence: estimated
    note: >-
      estimated by the fitted map in `method`, mm from the front view's left, which is the body's left
      end. Eight C13 outlets are numbered 8 to 1 left to right as printed. They are centred every
      35.65 from 22.25 (outlet 8). The well's chamfered end is up, as the photograph and the owner's
      manual figure draw it. Each sits in a square moulding about 35 by 27 and has a round lamp 35.3
      down with its numeral 5.2 to the right. A small square hole at 11.3 across and 38 down, and a
      pinhole at 340.0 across and 38 down under the card. The WEBCARDLX plate from 287.3 to 373.1
      across and 4.6 to 33.7 down. The meter bezel from 373.1 to 398.4 across and 18.5 to 37.1 down
      with LOAD (AMPS) centred under it. The fit puts the card at 290.1 and the meter at 370.3. The
      bay's envelope takes in the card's upper right tab, which stands over the meter's column. To
      clear lint L13 the card is moved 2.8 left and the meter 2.85 right. That is a little over the
      fit's error of 1 to 2 mm. The C20 inlet in a moulding 398.4 to 434.6 across, its opening 32.4 by
      24.4 centred at (416.5, 20.0).
  rear:
    confidence: photo-measured
    note: >-
      photo-measured - BK, mm from the rear face's left, which is the PDU's right end seen from
      behind, and from its top. The ground screw on a toothed washer about 10.5 across, centred
      (13.8, 17.7), with an earth symbol printed right of it. The DE-9 with its two jackscrew
      standoffs centred (138.5, 27.6), its wide row up, and "Config. Port" centred under it at
      136.9, baseline 40.0. The Eaton wordmark from 193.0 to 240.2 across and 15.8 to 28.9
      down. Three short flanges stand on the bottom edge, 30 across, centred 95, 235 and 375.
      No outlet and no lamp is on the rear.
  outlets:
    confidence: datasheet
    note: >-
      datasheet - spec sheet "8 individually switched output receptacles", C13, "12A (10A CE)
      max per C13 outlet", 16 A total. Each is std/c13-outlet@1. The owner's manual (Features)
      draws a C13 with the earth pin at the top and a small round screw below it. Numbered as
      printed, 8 on the left to 1 on the right.
  lamps:
    confidence: datasheet
    note: >-
      datasheet and photo - spec sheet "8 LEDs display power on-off status for each output
      receptacle". Owner's manual (2-3) "The LED near each output receptacle illuminates when the
      receptacle is ready to distribute live AC power". Each is common/led-dot@1, placed with
      `for:` naming its outlet. The `outlet-leds` group declares `on` lit and `off` unlit and no
      colour, because no held source states one (gaps: outlet-lamp-colour). Every photograph
      shows them unlit, a dim brown that reads #333332 over 196 px at outlet 8.
  meter:
    confidence: photo-measured
    note: >-
      photo and datasheet - eaton/tripplite-ammeter@1. Spec sheet "Digital display reports total
      PDU output current in amps". The photograph shows it lit green, "20", which reads #198952
      over 418 px. It is the part's own colour.
  config-port:
    confidence: known-wrong
    note: >-
      KNOWN WRONG IN ONE RESPECT: THE PORT IS A FEMALE DE-9 AND IS DRAWN MALE. The owner's manual
      (Features) draws nine sockets, five over four, and BK shows the same. The library's only DE-9
      (common/db9-receptacle@1 over std/db9@1) draws the male half (gaps: female-de9). The place
      and size are measured. The rear prints "Config. Port" and the manual calls it the Factory
      Port, "reserved for configuration by factory authorized personnel only". It is not exported
      as a console.
  ground:
    confidence: photo-measured
    note: >-
      photo-measured and datasheet - BK shows a Phillips screw on a toothed washer with an earth
      symbol beside it. common/ground-screw-washer@1 is the library's part of that kind. The
      symbol is printed without a circle, so it is silkscreen and not common/ground-symbol@1.
  logo:
    confidence: estimated
    note: >-
      the rear prints Eaton's stylised wordmark, 47.2 mm wide and 13.1 mm high in BK. It is drawn
      as plain white silkscreen text, a stand-in for the logo's shape. The text is sized to the
      wordmark's width, so its letters are about 10 mm high. The front prints no wordmark.
  card:
    confidence: datasheet
    note: >-
      datasheet - the WEBCARDLX is eaton/webcardlx@1 in a bay, as on the PDUMH20NET. Spec sheet
      "Pre-installed LX platform interface". The owner's manual (Features) draws the same card
      with STATUS, CONFIG and RESET legends, and the photograph shows the plate the part draws.
      The bay is the plate's envelope, 85.8 by 29.1. The hole behind it is not seen (gaps:
      card-opening).
  inlet:
    confidence: photo-measured
    note: >-
      photo-measured and datasheet - spec sheet "C20 inlet", "IEC-320 C20 input". The owner's
      manual (Features) says "The IEC 60320 C20 inlet connects to the detachable AC Input Power
      Cord". It draws the earth pin up and two blades below, the way std/c20-inlet@1 does. The
      photograph shows it empty. The 8 ft cord, its C19 and C20 ends and the L6-20P adapter are
      loose parts and are not drawn.
  dcim:
    confidence: datasheet
    note: >-
      the input is the inlet, one `iec-60320-c20` power port, and each outlet an `iec-60320-c13`
      power outlet fed by it. The outlets are named as the unit prints them, 1 to 8. No source
      names a breaker, so no outlet runs `through` one. No feed_leg is written. The card's ports
      export on its module type. The factory DE-9 is not a console and exports nothing.
  input:
    confidence: datasheet
    note: >-
      datasheet - spec sheet single-phase, 208/230 V, 16 A, "Agency de-rated to 16A continuous".
      It gives 3.68 kW at 230 V and 3.33 kW at 208 V, recommended service single-phase 16/20 A. The cord is
      detachable (owner's manual, Features), so `input-cord` is detachable and `input-plug` is the
      inlet's `iec-60320-c20`. The cord in the box ends in C19 and C20 connectors and a C19 to
      L6-20P adapter.
  capability:
    confidence: datasheet
    note: >-
      datasheet - spec sheet "PDU Type: Switched", "8 individually switched output receptacles",
      "Digital display reports total PDU output current in amps". Only the total is metered, so
      `metering-scope` is input and `outlet-switching` is true. Every outlet declares on and off
      on its own placement.
  lifecycle:
    confidence: datasheet
    note: >-
      the spec sheet printed 2026 and the owner's manual of 2023 name no end of life. The product
      page is live. Nothing announces one.
attrs:
  physical:
    weight-kg: 4.08
    construction: metal
  power:
    input-ac: 208/230 V single-phase, 16 A continuous (agency de-rated), 50/60 Hz
    input-plug: iec-60320-c20
    input-cord: detachable
    input-phase: single
    input-voltage-v: 230
    input-current-a: 16
    capacity-kw: 3.68
    capacity-scope: >-
      the load the PDU can hand on, 3.68 kW at 230 V and 3.33 kW at 208 V, 16 A in all (spec sheet).
      It is not what the PDU draws itself, which no document held states
    output-voltage: 208/230 V
    output-rating: 16 A total; 12 A (10 A CE) max per C13
    frequency: 50/60 Hz
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -30 to 50 C (-22 to 122 F)
    humidity: 5 to 95 % non-condensing
    altitude: 0 to 3000 m (0 to 10000 ft)
  management:
    metering-scope: input
    outlet-switching: true
    metering: total output load in amps on the front display
    network-interface: pre-installed WEBCARDLX (PowerAlert Device Manager), 10/100 Mbps
  compliance:
    certifications: UL 60950-1; IEC 60950-1; NOM
    product-compliance: RoHS; CE; FCC Part 15 Class A (USA); Trade Agreements Act (TAA)
  lifecycle:
    eol: none-announced
chassis:
  width: 440.2
  height: 43.7
  depth: 375.2
  ru: 1
  color: '#292a2a'
  airflow: passive
  weight-kg: 4.08
  ears:
    color: '#292a2a'
    positions:
      - {name: flush, label: 'mounting brackets flush with the front, as the photographs show', default: true}
      - {name: recessed, label: 'longer mounting brackets extending beyond the front panel (owner''s manual 1-1)'}
gaps:
- what: female-de9
  scope: [config-port]
  reason: vendor-silent
  note: >-
    THE SOURCE IS CLEAR AND THE LIBRARY IS SHORT. The owner's manual and BK show the Config. Port
    as a female DE-9, nine sockets in a grey insert. The library has only the male half
    (std/db9@1, composed by common/db9-receptacle@1), so it is drawn male. Its place and size are
    right and its gender is not.
  wanted: a female DE-9 receptacle part, to replace the male one here.
- what: ear-holes
  scope: [front]
  reason: needs-drawing
  note: >-
    each ear carries a column of four slotted holes in PDUMH20HVNET_C and _DT02: two large ovals at the ends and two small ones between.
    The ears are separate brackets, so the face is the 440.2 mm body and the generic ear stands for them.
    The library reads a face wider than the body as a rack face only when a part is seated in an ear.
    None is, so the slots are not drawn.
  wanted: the maintainer's word on drawing the ears at 482.6 mm, and a dimensioned drawing of the ear.
- what: outlet-lamp-colour
  scope: [outlet-leds]
  reason: vendor-silent
  note: >-
    the owner's manual says each outlet LED illuminates when its outlet is live and names no
    colour. The spec sheet names none. Every photograph shows the lamps unlit. The `on` state is
    declared with no colour, so the kit paints its default lit colour.
  wanted: a photograph of a powered PDUMH20HVNET, or the maker's word on the lamp colour.
- what: card-opening
  scope: [card]
  reason: needs-photo
  note: >-
    no photograph or drawing shows the PDU with the WEBCARDLX out, so the slot's hole is not
    measured. The bay states the plate's main body, 67.3 by 29.1, as its opening. That is the
    largest hole the plate covers, an upper bound.
  wanted: a photograph of the PDU with the card removed, or the slot's dimensions from the maker.
- what: card-depth
  scope: [card]
  reason: vendor-silent
  note: >-
    no held source dimensions the WEBCARDLX behind its faceplate or the slot it sits in, so the
    card states no depth.
  wanted: the WEBCARDLX's dimensions from the maker.
- what: bracket-holes
  scope: [left, right]
  reason: needs-drawing
  note: >-
    the sides carry the tapped holes the mounting brackets screw to, three #6-32 screws a bracket
    (owner's manual 1-1 to 1-5). PDUMH20HVNET_C and _DT02 see a side only at a steep angle. No
    straight view or drawing of a side exists, so the sides are drawn bare.
  wanted: a straight-on photograph of a side with a scale, or a dimensioned drawing.
- what: lid-screws
  scope: [top]
  reason: needs-photo
  note: >-
    the lid shows about six small dark dots near its edges in PDUMH20HVNET_C and _DT02. They are
    a pixel or two across at a steep angle, too small to place. A small grey label sits near the
    front right edge and is also too small to place or read. Nothing else is on the lid.
  wanted: a straight-on photograph of the top with a scale.
- what: bottom-not-shown
  scope: [bottom]
  reason: needs-photo
  note: >-
    no held picture shows the bottom. It is built as the documented side, the top, as no
    document shows this one.
  wanted: a straight-on photograph of the bottom with a scale.
groups:
  outlets: {term: Outlet, role: traffic, index-origin: 1, attrs: {outlet: iec-60320-c13}, description: 'the PDU''s eight IEC C13 outlets, numbered 8 to 1 left to right as printed; each switchable'}
  outlet-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: 'one lamp per outlet, lit while the outlet is live (owner''s manual 933681 rev D, 2-3); its colour is not stated'
    states: ['on', 'off']
  meter: {term: Display, role: indicator, index-origin: 1}
  network: {term: Slot, role: management, index-origin: 1}
  config: {term: Port, role: management, index-origin: 1}
  grounding: {term: Ground, role: furniture, index-origin: 1}
  power-input: {term: Input, role: service, index-origin: 1}
