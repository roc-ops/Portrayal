format: 1
kind: device
name: b097-016
version: 0.2.0
maturity: modelled
manufacturer: Eaton
model: B097-016
portfolio: {line: Console servers, family: Tripp Lite series, series: B097}
description: >-
  Eaton Tripp Lite series B097-016, a 16-port serial console server, 1U, for a desktop or a 19 inch rack.
  The rear carries 16 RJ45 serial ports in two rows of eight and two RJ45 Ethernet ports (NET1 and NET2).
  It also carries two IEC AC inlets for the two built-in supplies, each with a rocker switch. The front
  carries an RJ45 console port, two USB-A ports, an erase pinhole and four status lamps. The rack-mount
  kit fits to the sides of the body.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Five documents. Eaton, B097-016 product specifications page (3 pages), which shows only two small
      photographs of the faces. Tripp Lite, quick start guide for the B097-016 and B097-048, 93-386F rev
      B (4 pages): the package contents, the rack-mount kit, NET1 and NET2, the two power supplies. Tripp
      Lite, owner's manual for the B093, B097 and B098 console servers, rev C (285 pages): the model table
      (p. 8), the serial pinout (p. 10), the hardware specification (p. 273). Two photographs on the maker's
      product page: the rear straight on and the front at an angle, 1000 pixels across. No dimensioned
      drawing, 3D model or stencil is held.
  size:
    confidence: datasheet
    note: >-
      The manual's hardware specification (Appendix B, p. 273) prints "17 x 6.9 x 1.75 in. (44 x 17 x
      4.5 cm)" for the B097-016 and does not label the axes. The product specifications page prints 17.32
      in, 6.9 in and 1.75 in under labels that read length or depth, height and width. THE TWO DO NOT
      AGREE ON THE LONG SIDE and the manual's inches and centimetres do not agree with each other either:
      17 in is 431.8 mm and 44 cm is 440 mm. The long side is drawn 440 mm: the manual's own centimetres,
      which the specifications page's 17.32 in (439.9 mm) confirms. The 17 in is read as a rounding of
      that. The 6.9 in is the depth (the B098 line is 10 in deep in the same row of the table and the
      body is a 1U box), 175.3 mm; the manual's 17 cm and the specifications page's 6.9 in are not the
      same figure and the inches are used. The height is 1.75 in, 44.45 mm, in both. Both readings are
      in gaps `size-sources`.
  weight:
    confidence: datasheet
    note: >-
      The manual (p. 273) gives 9 lb (4 kg) for the B097-016 and B097-048 and the specifications page
      gives 7.6 lb. No weight is stated on the chassis; both are written in `attrs.physical.weight-note`.
  scale:
    confidence: estimated
    note: >-
      EVERY POSITION IS READ OFF PHOTOGRAPHS. The faces were first read off the two 500 pixel photographs
      on the specifications page and are checked here against the two 1000 pixel photographs on the maker's
      product page. The rear is nearly straight on: the body is about 817 px across for 440 mm, 1.86 px
      per mm, and the jack pitch reads about 25.3 px (13.6 mm) between the numerals 1 and 15 where the
      registry's ganged pitch is 13.97, which is the cross-check (2.7 % low; gap `photo-skew`). The registry's
      pitch is kept. A rear position is good to about 3 mm. The front is a three-quarter view from the
      left and above: positions across are the fractions of the black front plate's width, from the plate's
      left edge to its right edge, and positions down are the fractions of the face's height. A front
      position is good to about 4 mm.
  front-layout:
    confidence: estimated
    note: >-
      The 1000 pixel front photograph, read at 6x. A black plate fills the face between the ears from
      about 76 to 411 mm across and 3 to 36 mm down. On it, from the left: four green lamps 8.7 mm apart
      at about 189 mm, printed PWR, H/B, SER and NET above them; two stacked USB-A ports in a bright frame
      at about 260 mm, with USB printed over them; an RJ45 jack in a bright frame at about 278 mm with
      CONSOLE printed over it; ERASE printed to the right of the jack, with a faint pinhole under its
      left end; and at the right the maker's mark, TRIPP LITE SERIES and "Model: B097-016", about 381
      to 402 mm. The maker's mark is typeset as its word and is not the graphic. The pinhole is faint
      in this photograph and its place is the one the B097-048's photograph gives, where the same panel
      is sharper.
  rear-layout:
    confidence: estimated
    note: >-
      The 1000 pixel rear photograph, read at 6x. At the left, two dark supply plates each 23 mm wide
      with a rocker switch above an IEC inlet turned a quarter turn (its earth contact to the right).
      Then the 16 RJ45 serial jacks in two rows of eight, 13.97 mm between columns, 14.2 mm between rows,
      from about 50 to 161 mm. Printed numbers stand over the top row (1, 3, 5 to 15) and under the bottom
      row (2, 4, 6 to 16). At the right, two RJ45 jacks side by side, printed NET1 and NET2 beneath, about
      401 to 434 mm. The inlets and plates are placed as the larger B097-048's rear photograph places
      them, which this photograph matches.
  inlet:
    confidence: estimated
    note: >-
      No B097-016 document names the inlet type. The specifications page for this model lists no power
      input receptacle and the owner's manual (p. 8) says only "Two IEC AC power inlets are located at
      the rear of the unit". The B097-048's specifications page (p. 3) prints "IEC-320-C14" for the same
      chassis, whose quick start guide is shared with this model, but that is another model's page and
      is not cited for this one. The rear photograph shows two three-pin male inlets with the earth contact
      at the right, which is the C14 shape, so C14 is declared from the photograph (gap `inlet-type`).
      The package list is the specifications page's "(2) C13 to NEMA 5-15P power cords".
  switches:
    confidence: estimated
    note: >-
      The rear photograph shows a small rocker switch above each inlet, a circle at its left end and a
      bar at its right. No held document names or dimensions the switches; they are drawn with `eaton/b097-power-rocker`
      at that part's estimated size, and which end is on is not stated, so they are drawn at rest.
  jack-numbers:
    confidence: estimated
    note: >-
      Read off the 1000 pixel rear photograph at 6x: 1, 3, 5, 7, 9, 11, 13 and 15 over the columns of
      the top row and 2, 4, 6, 8, 10, 12, 14 and 16 under the bottom row. Each numeral is placed over
      the middle of its jack's column; the photograph puts the last numeral about 3 mm left of that, which
      is the same skew the pitch shows (gap `photo-skew`).
  serial-ports:
    confidence: datasheet
    note: >-
      Owner's manual p. 8, the model table: 16 serial ports for the B097-016. Specifications page: serial
      connector "RJ45 (FEMALE)". Owner's manual p. 10 and p. 274: Tripp Lite console servers use the Cisco
      RJ45 pin-out, straight through, and "The B093 and B097 models have Cisco Straight serial pinouts".
      The B098 pinout choice on p. 10 does not apply to this model. The quick start guide (p. 2) labels
      the ports 1 to 16 on the box. The 1000 pixel rear photograph prints each jack's number: the odd
      numbers over the top row and the even numbers under the bottom row, so the upper jack of a column
      is the odd port.
  console:
    confidence: estimated
    note: >-
      Owner's manual p. 8, the model table: one console port for the B097-016. Owner's manual p. 10: "Select
      console server models also have a DB9 LOCAL (Console/Modem) port" and does not say which. The front
      photograph shows an RJ45-shaped port printed CONSOLE, so it is drawn and exported as an RJ45 console
      port (gap `console-port-type`).
  usb:
    confidence: datasheet
    note: >-
      Specifications page: USB ports (2), type A female. Owner's manual p. 8, model table: 2 USB for the
      B097-016. Owner's manual p. 7 says "four USB 2.0 console ports" of the line (gap `usb-count`). The
      USB version is not stated for this model; the manual (p. 10) says the ports on models other than
      the B098 "are mostly USB 2.0", so the white USB 2.0 tongue is drawn.
  network:
    confidence: datasheet
    note: >-
      Quick start guide p. 2: NET1 and NET2. Owner's manual p. 8: two 10/100/1000 Ethernet ports. The
      specifications page: "Dual GbE NIC", network speed 1 Gbps. Owner's manual p. 9 describes a combined
      copper and SFP port pair for the B098 only; the B097 has no SFP.
  power:
    confidence: datasheet
    note: >-
      Quick start guide p. 2: "built-in dual universal AC power supplies (with automatic failover)". Owner's
      manual p. 8: two IEC AC inlets at the rear of the unit, 100 to 240 V, 50 or 60 Hz, "less than 30W"
      in all (p. 8 and p. 273). The specifications page gives 25 W. The package holds two C13 to NEMA
      5-15P cords of 6 ft, which are loose in the box and are not drawn on the inlets.
  ears:
    confidence: estimated
    note: >-
      Quick start guide p. 2: "Attach the included rack-mount kit to the sides of the console server".
      No document dimensions the kit or its holes. The front photograph shows an ear on each end at the
      front plane, so the shipped position is flush. The ears are not drawn.
  colour:
    confidence: photo-measured
    note: >-
      Median of the plain rear face in the rear photograph, #4c4c4c; the front plate's median is #0a0a0a
      and the supply plates' #3a3a3a. The specifications page says COLOR Black; the thumbnails are dark
      grey.
attrs:
  physical:
    weight-note: >-
      9 lb (4 kg) in the owner's manual, p. 273; 7.6 lb on the product specifications page; no weight
      is stated for this model
  power:
    power-input: >-
      100 to 240 VAC, 50/60 Hz, two built-in supplies with automatic failover, two IEC inlets, drawn as
      C14 from the rear photograph
    power-consumption: 25 W (specifications page); less than 30 W (owner's manual)
  platform:
    storage: 4 GB flash (owner's manual p. 8; the specifications page title reads 4 Gb)
  environmental: {operating-temp-c: 5 to 50, storage-temp-c: -30 to 60, operating-humidity: 5% to 90%
      non-condensing RH}
  features:
    serial-pinout: >-
      Cisco straight RJ45 (owner's manual pp. 10 and 274): 1 CTS, 2 DSR, 3 RXD, 4 GND, 5 GND, 6 TXD, 7
      DTR, 8 RTS
chassis:
  width: 440
  height: 44.45
  depth: 175.3
  ru: 1
  color: '#4c4c4c'
  power: ac
  ears:
    positions:
    - name: flush
      label: rack-mount kit on the sides, flush with the front (quick start guide p. 2)
      default: true
gaps:
- what: size-sources
  scope:
  - front
  - rear
  - top
  reason: sources-disagree
  note: >-
    The owner's manual p. 273 prints 17 x 6.9 x 1.75 in (44 x 17 x 4.5 cm) with the axes unlabelled; the
    specifications page prints 17.32 in, 6.9 in and 1.75 in under differently worded labels. The long
    side is 17 in (431.8 mm) or 44 cm (440 mm) in the manual and 17.32 in (439.9 mm) on the page. 440
    is drawn. The depth is 6.9 in (175.3 mm) in both inch readings and 17 cm in the manual's centimetres.
  wanted: A dimensioned drawing, or the maker's word on the width and depth of the body.
- what: weight-sources
  scope:
  - front
  reason: sources-disagree
  note: >-
    9 lb (4 kg) in the owner's manual and 7.6 lb on the specifications page. Neither is stated on the
    chassis.
  wanted: The maker's weight for the B097-016.
- what: console-port-type
  scope:
  - front
  reason: vendor-silent
  note: >-
    The manual says select models have a DB9 local port and its model table gives the B097-016 one console
    port without a type. The front photograph shows an RJ45-shaped port printed CONSOLE, and that is drawn.
  wanted: The maker's statement of the B097-016's console connector.
- what: usb-count
  scope:
  - front
  reason: sources-disagree
  note: >-
    The owner's manual p. 7 says "four USB 2.0 console ports"; its model table p. 8 and the specifications
    page give two for the B097-016, and the photograph shows two. Two are drawn.
  wanted: The maker's USB count for the B097-016.
- what: thumbnails-only
  scope:
  - front
  - rear
  reason: needs-photo
  note: >-
    Both faces are read off 1000 pixel photographs of the whole box, the front at a slant. Every position
    is estimated. No held document names or dimensions the rocker switches above the rear inlets or the
    erase pinhole beside the front console jack, which are drawn from the photographs alone.
  wanted: A straight-on front and rear photograph or a dimensioned drawing.
- what: photo-skew
  scope:
  - rear
  reason: needs-drawing
  note: >-
    The rear photograph is not orthographic: the 13.97 mm pitch of the serial jacks reads about 13.6 mm
    between its first and last column, and the larger B097-048's photograph of the same chassis reads
    13.4, 14.1 and 14.5 mm across its three groups. Rear positions are good to about 3 mm and the registry's
    pitch is drawn.
  wanted: A dimensioned rear drawing, or the maker's pitch of the jacks.
- what: inlet-type
  scope:
  - rear
  reason: vendor-silent
  note: >-
    No B097-016 document names the inlet type: the owner's manual p. 8 says only "IEC" and the specifications
    page for this model gives no power input receptacle. The larger B097-048's specifications page prints
    "IEC-320-C14" for the same chassis. C14 is drawn and exported from the rear photograph, which shows
    a three-pin male inlet with its earth contact at the right.
  wanted: The maker's statement of the B097-016's power input receptacle.
- what: lamps
  scope:
  - front
  - rear
  reason: vendor-silent
  note: >-
    The specifications page lists 8 LEDs for power, heartbeat (firmware running), serial connectivity
    and network ports. The front photograph shows four green lamps printed PWR, H/B, SER and NET. The
    other four are not seen; they may be on the two Ethernet jacks, which the photograph does not resolve.
  wanted: The maker's LED table.
- what: ear-positions
  scope:
  - front
  - rear
  reason: needs-drawing
  note: >-
    The rack-mount kit goes on the sides of the body. No document gives its holes, its offset from the
    front or whether it can fit at the rear or mid-body. Only the flush position the photograph shows
    is stated.
  wanted: The rack-mount kit's drawing or installation figure.
- {what: sides-top-bottom, scope: [top, bottom, left, right], reason: needs-photo, note: 'No document
    shows the lid, the base or a side straight on.', wanted: 'Photographs of the top, bottom and sides.'}
groups:
  inlets: {term: Inlet, role: service, index-origin: 1, description: the two IEC C14 inlets of the two
      built-in supplies}
  switches: {term: Switch, role: service, index-origin: 1, description: the rocker power switch above
      each inlet}
  net:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: the two 10/100/1000 RJ45 Ethernet ports, printed NET1 and NET2
  console: {term: Port, role: management, index-origin: 1, description: the RJ45 console port on the front}
  usb-front:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-a, usb: '2.0'}
    description: the two USB-A ports on the front
  controls: {term: Button, role: furniture, index-origin: 1, description: the erase pinhole on the front}
  serial:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45-serial, role: console-server}
    description: >-
      the 16 RJ45 serial ports in two rows of eight; rel-pos is the port number printed beside it, the
      upper jack of a column taking the odd number. Cisco straight pin-out
  status-leds: {term: LED, role: indicator, index-origin: 1, description: the four status lamps on the
      front}
