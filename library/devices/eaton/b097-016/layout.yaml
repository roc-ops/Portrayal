format: 1
kind: device
name: b097-016
version: 0.1.0
maturity: modelled
manufacturer: Eaton
model: B097-016
portfolio: {line: Console servers, family: Tripp Lite series, series: B097}
description: >-
  Eaton Tripp Lite series B097-016, a 16-port serial console server, 1U, for a desktop or a 19 inch
  rack. The rear carries 16 RJ45 serial ports in two rows of eight, two RJ45 Ethernet ports (NET1 and
  NET2) and two IEC AC inlets for its two built-in supplies. The front carries an RJ45 console port, two
  USB-A ports and four status lamps. The rack-mount kit fits to the sides of the body.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Three documents. Eaton, B097-016 product specifications page (3 pages), which shows only two small
      photographs of the faces. Tripp Lite, quick start guide for the B097-016 and B097-048, 93-386F rev B
      (4 pages): the package contents, the rack-mount kit, NET1 and NET2, the two power supplies. Tripp Lite,
      owner's manual for the B093, B097 and B098 console servers, rev C (285 pages): the model table (p. 8),
      the serial pinout (p. 10), the hardware specification (p. 273). No dimensioned drawing, close photograph,
      3D model or stencil is held.
  size:
    confidence: datasheet
    note: >-
      The manual's hardware specification (Appendix B, p. 273) prints "17 x 6.9 x 1.75 in. (44 x 17 x 4.5 cm)"
      for the B097-016 and does not label the axes. The product specifications page prints 17.32 in, 6.9 in
      and 1.75 in under labels that read length or depth, height and width. THE TWO DO NOT AGREE ON THE LONG
      SIDE and the manual's inches and centimetres do not agree with each other either: 17 in is 431.8 mm and
      44 cm is 440 mm. The long side is drawn 440 mm: the manual's own centimetres, which the
      specifications page's 17.32 in (439.9 mm) confirms. The 17 in is read as a rounding of that. The
      6.9 in is the depth (the B098 line is 10 in deep in the same row of the table and the body is a 1U
      box), 175.3 mm; the manual's 17 cm and the specifications page's 6.9 in are not the same figure and the
      inches are used. The height is 1.75 in, 44.45 mm, in both. Both readings are in gaps `size-sources`.
  weight:
    confidence: datasheet
    note: >-
      The manual (p. 273) gives 9 lb (4 kg) for the B097-016 and B097-048 and the specifications page gives
      7.6 lb. No weight is stated on the chassis; both are written in `attrs.physical.weight-note`.
  scale:
    confidence: estimated
    note: >-
      EVERY POSITION IS READ OFF TWO 500 PIXEL PHOTOGRAPHS on the specifications page. The rear is nearly
      straight on: the body is 409 px across for 440 mm, 0.93 px per mm, and the jack pitch in it reads 12.7 px
      (13.6 mm) where the registry's ganged pitch is 13.97, which is the cross-check (2.7 % low). A rear
      position is good to about 2 mm. The front is a three-quarter view from the left and above: positions
      across are the fractions of the black front plate's width, from the plate's left edge to its right
      edge, and positions down are the fractions of the face's height. A front position is good to about 4 mm.
  front-layout:
    confidence: estimated
    note: >-
      Specifications page, the front photograph, read at 8x. A black plate fills the face between the ears
      from about 76 to 411 mm across and 3 to 36 mm down. On it, from the left: four green lamps 8.7 mm apart
      at about 189 mm; two stacked USB-A ports in a bright frame at about 260 mm, with USB printed over them;
      an RJ45 jack in a bright frame at about 278 mm with CONSOLE printed over it; a small printed legend and
      mark just right of the jack that the photograph does not resolve; and at the right the maker's mark,
      TRIPP LITE SERIES and a model line, about 381 to 402 mm. The legends over the lamps are four short
      words that are not legible at this size and are not drawn.
  rear-layout:
    confidence: estimated
    note: >-
      Specifications page, the rear photograph, read at 8x. At the left, two dark supply plates each 23 mm
      wide with an IEC inlet turned a quarter turn (its earth contact to the right) and a small printed
      mark above it. Then the 16 RJ45 serial jacks in two rows of eight, 13.97 mm between columns, 14.2 mm
      between rows, from about 50 to 161 mm. At the right, two RJ45 jacks side by side, printed NET1 and NET2
      beneath, about 401 to 434 mm. The numbers over and under the serial jacks are not legible and are not
      drawn.
  serial-ports:
    confidence: datasheet
    note: >-
      Owner's manual p. 8, the model table: 16 serial ports for the B097-016. Specifications page: serial
      connector "RJ45 (FEMALE)". Owner's manual p. 10 and p. 274: Tripp Lite console servers use the Cisco
      RJ45 pin-out, straight through, and "The B093 and B097 models have Cisco Straight serial pinouts".
      The B098 pinout choice on p. 10 does not apply to this model. The quick start guide (p. 2) labels the
      ports 1 to 16 on the box; which jack takes which number is not legible (gap `jack-numbering`), and the
      upper jack of a column is taken as the odd port as the library's other console servers do.
  console:
    confidence: estimated
    note: >-
      Owner's manual p. 8, the model table: one console port for the B097-016. Owner's manual p. 10: "Select
      console server models also have a DB9 LOCAL (Console/Modem) port" and does not say which. The front
      photograph shows an RJ45-shaped port printed CONSOLE, so it is drawn and exported as an RJ45 console
      port (gap `console-port-type`).
  usb:
    confidence: datasheet
    note: >-
      Specifications page: USB ports (2), type A female. Owner's manual p. 8, model table: 2 USB for the
      B097-016. Owner's manual p. 7 says "four USB 2.0 console ports" of the line (gap `usb-count`). The USB
      version is not stated for this model; the manual (p. 10) says the ports on models other than the B098
      "are mostly USB 2.0", so the white USB 2.0 tongue is drawn.
  network:
    confidence: datasheet
    note: >-
      Quick start guide p. 2: NET1 and NET2. Owner's manual p. 8: two 10/100/1000 Ethernet ports. The
      specifications page: "Dual GbE NIC", network speed 1 Gbps. Owner's manual p. 9 describes a combined
      copper and SFP port pair for the B098 only; the B097 has no SFP.
  power:
    confidence: datasheet
    note: >-
      Quick start guide p. 2: "built-in dual universal AC power supplies (with automatic failover)".
      Owner's manual p. 8: two IEC AC inlets at the rear of the unit, 100 to 240 V, 50 or 60 Hz, "less than
      30W" in all (p. 8 and p. 273). The specifications page gives 25 W. The package holds two C13 to NEMA
      5-15P cords of 6 ft, which are loose in the box and are not drawn on the inlets.
  ears:
    confidence: estimated
    note: >-
      Quick start guide p. 2: "Attach the included rack-mount kit to the sides of the console server". No
      document dimensions the kit or its holes. The front photograph shows an ear on each end at the
      front plane, so the shipped position is flush. The ears are not drawn.
  colour:
    confidence: photo-measured
    note: >-
      Median of the plain rear face in the rear photograph, #4c4c4c; the front plate's median is #0a0a0a and
      the supply plates' #3a3a3a. The specifications page says COLOR Black; the thumbnails are dark grey.
attrs:
  physical:
    weight-note: >-
      9 lb (4 kg) in the owner's manual, p. 273; 7.6 lb on the product specifications page; no weight is
      stated for this model
  power:
    power-input: 100 to 240 VAC, 50/60 Hz, two built-in supplies with automatic failover, two C14 inlets (owner's manual)
    power-consumption: 25 W (specifications page); less than 30 W (owner's manual)
  platform:
    storage: 4 GB flash (owner's manual p. 8; the specifications page title reads 4 Gb)
  environmental:
    operating-temp-c: 5 to 50
    storage-temp-c: -30 to 60
    operating-humidity: 5% to 90% non-condensing RH
  features:
    serial-pinout: >-
      Cisco straight RJ45 (owner's manual pp. 10 and 274): 1 CTS, 2 DSR, 3 RXD, 4 GND, 5 GND, 6 TXD, 7 DTR, 8 RTS
chassis:
  width: 440
  height: 44.45
  depth: 175.3
  ru: 1
  color: '#4c4c4c'
  power: ac
  ears:
    positions:
    - {name: flush, label: 'rack-mount kit on the sides, flush with the front (quick start guide p. 2)', default: true}
gaps:
- what: size-sources
  scope: [front, rear, top]
  reason: sources-disagree
  note: >-
    The owner's manual p. 273 prints 17 x 6.9 x 1.75 in (44 x 17 x 4.5 cm) with the axes unlabelled; the
    specifications page prints 17.32 in, 6.9 in and 1.75 in under differently worded labels. The long side
    is 17 in (431.8 mm) or 44 cm (440 mm) in the manual and 17.32 in (439.9 mm) on the page. 440 is drawn.
    The depth is 6.9 in (175.3 mm) in both inch readings and 17 cm in the manual's centimetres.
  wanted: A dimensioned drawing, or the maker's word on the width and depth of the body.
- what: weight-sources
  scope: [front]
  reason: sources-disagree
  note: >-
    9 lb (4 kg) in the owner's manual and 7.6 lb on the specifications page. Neither is stated on the chassis.
  wanted: The maker's weight for the B097-016.
- what: console-port-type
  scope: [front]
  reason: vendor-silent
  note: >-
    The manual says select models have a DB9 local port and its model table gives the B097-016 one console
    port without a type. The front photograph shows an RJ45-shaped port printed CONSOLE, and that is drawn.
  wanted: The maker's statement of the B097-016's console connector.
- what: usb-count
  scope: [front]
  reason: sources-disagree
  note: >-
    The owner's manual p. 7 says "four USB 2.0 console ports"; its model table p. 8 and the specifications
    page give two for the B097-016, and the photograph shows two. Two are drawn.
  wanted: The maker's USB count for the B097-016.
- what: thumbnails-only
  scope: [front, rear]
  reason: needs-photo
  note: >-
    Both faces are read off 500 pixel photographs of the whole box, the front at a slant. Every position is
    estimated; the printed legends over the lamps, the USB ports and the serial jacks are not legible, and
    the marks above the rear inlets and beside the front console jack are not named by any held document.
  wanted: A straight-on front and rear photograph or a dimensioned drawing.
- what: jack-numbering
  scope: [rear]
  reason: vendor-silent
  note: >-
    The quick start guide says the ports are labelled 1 to 16. The photograph shows a numeral over each
    column and under it that cannot be read, so which of the two jacks of a column takes which number is not
    known. The upper jack is drawn as the odd port.
  wanted: The maker's numbering of the two rows.
- what: lamps
  scope: [front, rear]
  reason: vendor-silent
  note: >-
    The specifications page lists 8 LEDs for power, heartbeat (firmware running), serial connectivity and network
    ports. The front photograph shows four green lamps. The other four are not seen; they may be on the two
    Ethernet jacks, which the photograph does not resolve. The order of the four front lamps against that list
    is not stated.
  wanted: The maker's LED table.
- what: ear-positions
  scope: [front, rear]
  reason: needs-drawing
  note: >-
    The rack-mount kit goes on the sides of the body. No document gives its holes, its offset from the front
    or whether it can fit at the rear or mid-body. Only the flush position the photograph shows is stated.
  wanted: The rack-mount kit's drawing or installation figure.
- what: sides-top-bottom
  scope: [top, bottom, left, right]
  reason: needs-photo
  note: >-
    No document shows the lid, the base or a side straight on.
  wanted: Photographs of the top, bottom and sides.
groups:
