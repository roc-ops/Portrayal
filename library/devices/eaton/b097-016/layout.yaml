    attrs: {media: rj45, speed: 1g}
    description: the two 10/100/1000 RJ45 Ethernet ports, printed NET1 and NET2
  console:
    term: Port
    role: management
    index-origin: 1
    description: the RJ45 console port on the front
  usb-front:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: usb-a, usb: '2.0'}
    description: the two USB-A ports on the front
  serial:
    term: Port
    role: management
    index-origin: 1
    attrs: {media: rj45-serial, role: console-server}
    description: >-
      the 16 RJ45 serial ports in two rows of eight; rel-pos is the port number, the upper jack of a column taking
      the odd number (an estimate). Cisco straight pin-out
  status-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: the four status lamps on the front
