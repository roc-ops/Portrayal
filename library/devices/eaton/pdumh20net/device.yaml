format: 1
kind: device
name: pdumh20net
version: 0.1.0
maturity: modelled
manufacturer: Eaton
model: PDUMH20NET
description: >-
  Eaton Tripp Lite series switched PDU, 1U horizontal: a 444 mm black metal box
  that hands a single-phase 120 V feed (a fixed 12 ft cord ending in a NEMA
  L5-20P, 16 A continuous, 1.92 kW) on to 16 individually switched NEMA
  5-15/20R outlets, eight on the front and eight on the rear, each with a lamp.
  On the front, a pre-installed WEBCARDLX network card (10/100 Ethernet, a
  micro-USB console, USB-A for sensors, a reset button and a status lamp) and a
  two-digit meter of the total load in amps; on the rear, the cord, a ground
  screw and a DE-9 port reserved for the factory. Bolt-on mounting brackets,
  reversible for front- or rear-facing installation.
profile: power
provenance:
  method:
    confidence: photo-measured
    note: >-
      NO DRAWING EXISTS, SO EVERY POSITION IS READ OFF THE TWO STRAIGHT-ON EATON
      PHOTOGRAPHS. Searched: the spec sheet, the Eaton SKU export, the owner's
      manual (933687 rev A) and the WEBCARDLX manual dimension nothing on the
      faces, and no submittal drawing is published (the address the PDUMV20HVNETLX's
      follows returns 404). PDUMH20NET_DT01 (front) and PDUMH20NET_BK (rear) are
      3000 px masters, each spanning the PDU's 444 mm (the spec sheet's 17.5 in,
      44.4 cm) in 2520 px: 5.676 px per mm across. Each face is 251 px high against
      the spec sheet's 44.4 mm, 5.65 px per mm, so the two axes agree within half a
      percent and the images are measured as orthographic (the rear is turned 0.18
      degrees, 8 px over its length, and was read against its local top edge). THE
      SCALE IS PROVED BY TWO FEATURES OF KNOWN SIZE, independent of the body: the
      rear DE-9's jackscrew standoffs sit 25.1 apart against the 24.99 of the
      D-subminiature shell (TE C-747905), and the outlets' square faces read 27.0
      to 27.6 across (mean 27.3, six read) against the 27.0 of the NEMA 5-20R face
      std/nema-5-20r@1 carries, so the scale holds within about one percent. Edges
      are soft at this scale; positions are good to about 0.3 mm.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - spec sheet Unit Dimensions (hwd) 1.750 x 17.500 x 15.500 in,
      4.44 x 44.4 x 39.4 cm; 1U (Rack Height); unit weight 12.50 lb, 5.67 kg;
      minimum rack depth 20.5 in. Material of construction: metal. Colour
      photo-measured: the face's median is #1d1d1b in DT01 (1653 px below outlet
      6) and #1b1a18 in BK (9605 px right of the cord).
  ears:
    confidence: datasheet
    note: >-
      NOT DRAWN: THE EARS ARE SEPARATE BRACKETS, so the face is the 444 body and
      the generic ear stands for them (`chassis.ears`). DT01, BK and _C show a body
      with no flange at either end; DT02 shows the kit beside it - two long
      brackets with a flange at one end and two short square ones - and the owner's
      manual (Installation, 1-1) has the two longer brackets screwed to the sides
      with three #6-32 screws each for 1U rack mounting, "in a recessed position
      by attaching the mounting brackets so they extend beyond the front panel".
      The short ones are for 0U, wall and under-counter mounting (1-2 to 1-4).
      The spec sheet: "Mounting ears are reversible for front or rear facing
      rackmount installation". So three positions are named and none is
      dimensioned: flush (the manual's 1-1 figure, the default), recessed (1-1's
      text) and rear (the spec sheet). The brackets are black: DT02's short
      brackets read #1b1a16 (8400 px), the lit long bracket #33312b (24000 px).
  front:
    confidence: photo-measured
    note: >-
      photo-measured - DT01, mm from the face's left and top. Eight 5-20R
      outlets, numbered 8 to 1 left to right as printed, their square faces 27
      across (the part's) with their tops at 5.6 and their centres at 17.6 and
      then every 36.05: the outlet faces' edges give 36.1, their numerals 36.06
      and their lamps 36.02. Each is turned 90 degrees, so its U earth hole is on
      the right with its round side toward the slots, the plain line slot at the
      top left and the T neutral slot below it, as DT01 shows. Under each, its
      numeral (bold white, about 3.1 high, baseline 36.7) and below that a round
      lamp at 39.6, about 1.8 across, so common/led-dot@1. A hole about 3 across
      at (7.6, 39.3), below outlet 8. The WEBCARDLX's faceplate from 289.6 to
      375.4 across and 4.4 to 33.5 down (its own provenance has the detail), and
      the load meter's bezel from 387.8 to 413.1 across and 10.65 to 29.2 down,
      with LOAD (AMPS) centred under it (read at 399.8) on a baseline at 32.4, about 1.9
      high.
  rear:
    confidence: photo-measured
    note: >-
      photo-measured - BK, mm from the rear face's left (the PDU's right end seen
      from behind) and top. At the left: the ground screw on its star washer,
      12 across, centred (10.0, 11.2), with an earth symbol printed right of it
      (17.2 to 21.2 across, 7.6 to 12.0 down); the DE-9 with its two jackscrew
      standoffs centred (15.8, 28.2) and (40.9, 28.2), its wide row up, and
      "Config. Port" centred under it at 28.7, baseline 39.0; the Eaton wordmark
      from 51.3 to 98.5 across and 16.4 to 28.2 down; and the cord's bushing
      from 107.3 to 127.1 across. Then eight outlets numbered 16 to 9 left to
      right, faces 27 across centred at 174.6 and every 36.0 (their edges give
      36.03, their lamps 35.88), turned 90 as on the front, their tops at 4.4;
      numerals on a baseline at 36.4; lamps at 39.3. Holes about 3 across at
      (121.1, 38.6) and (436.1, 39.4). THE REAR OUTLETS SIT ABOUT 1.2 HIGHER than
      the front ones: the faces' top edges read 4.6 against 5.5, the line slots'
      lit edges 10.4 against 11.8 and the T slots' 28.1 against 29.7, each read at
      three outlets on each face, while the numerals and lamps of the two faces
      agree within 0.3. It is drawn as measured. The outlets stand back to back:
      outlet 9's centre is 17.4 from the PDU's left end seen from the front, and
      outlet 8's 17.6.
  outlets:
    confidence: datasheet
    note: >-
      datasheet and photo - the spec sheet: "16 switched NEMA 5-15/20R outlets (8
      front / 8 rear)", 16 A total and 16 A max per outlet; the owner's manual
      (Features) draws the 5-15/20R face with its T slot. Each is std/nema-5-20r@1,
      the 27 mm face the photographs measure. Numbered as printed: 1 to 8 on the
      front, 9 to 16 on the rear, each face numbered from its right as seen.
  lamps:
    confidence: datasheet
    note: >-
      datasheet and photo - the spec sheet: "16 LEDs display power on-off status
      for each output receptacle"; the owner's manual (2-3): "The LED B near each
      output receptacle illuminates when the receptacle is ready to distribute
      live AC power". Each is common/led-dot@1 under its outlet's numeral, placed
      with `for:` naming the outlet so a state set on the outlet reaches its lamp
      (docs/pdu-model-design.md section 3.2). The `outlet-leds` group declares
      `on` lit and `off` unlit, and NO COLOUR, because no held source states one
      (gaps: outlet-lamp-colour); every photograph shows them unlit.
  meter:
    confidence: photo-measured
    note: >-
      photo and datasheet - eaton/tripplite-ammeter@1, its bezel at (387.8,
      10.65); the spec sheet: "Digital display continuously reports total output
      load level in amps". It is not the 0U strip's meter: no button, no decimal
      points, and nothing says it turns over.
  config-port:
    confidence: known-wrong
    note: >-
      KNOWN WRONG IN ONE RESPECT: THE PORT IS A FEMALE DE-9 AND IS DRAWN MALE.
      BK at 4x shows nine dark socket holes in a grey insert, five over four, with
      a hex jackscrew standoff each side; the library's only DE-9
      (common/db9-receptacle@1 over std/db9@1) draws the male half, pins
      standing in a recessed insert (gaps: female-de9). Its position and size
      are measured. The rear prints "Config. Port"; the owner's manual (Features)
      calls it the Factory Port, "reserved for configuration by factory
      authorized personnel only. Do not connect anything to the port." So it is
      not exported as a console.
  ground:
    confidence: photo-measured
    note: >-
      photo-measured and datasheet - the spec sheet's Grounding: "Grounding lug".
      BK shows a Phillips screw on a toothed washer, the washer about 12 across;
      common/ground-screw-washer@1 (11.0, a pan head on its washer) is the
      library's part of that kind and size. The earth symbol beside it is printed
      without a circle, so it is drawn as silkscreen and not as
      common/ground-symbol@1.
  logo:
    confidence: photo-measured
    note: >-
      the rear prints Eaton's stylised wordmark; it is not drawn, and the area it
      covers is the `logo-zone` region. The front prints no wordmark.
  card:
    confidence: datasheet
    note: >-
      datasheet - the WEBCARDLX is eaton/webcardlx@1 in a bay, as the G4 eNMC is
      (docs/pdu-model-design.md section 7): the spec sheet calls it
      "Pre-installed", and the WEBCARDLX manual installs the same card in a UPS or
      a PDU. The bay is the card plate's envelope, tabs included (289.6, 4.4,
      85.8 by 29.1). THE HOLE BEHIND THE PLATE IS NOT SEEN in any photograph:
      its `opening` is stated as the plate's main body, 67.3 by 29.1, the largest
      hole the plate can cover, so the tabs' corners stay metal. It is an upper
      bound and not a measurement (gaps: card-opening).
  holes:
    confidence: photo-measured
    note: >-
      the three holes, about 3 across, near the bottom edge (one on the front,
      two on the rear) are drawn as holes; nothing held names them. The manual
      fixes the cord retention shelf to "the front panel of the PDU" with two
      #6-32 screws (1-5), which they may take, but no figure shows where.
  dcim:
    confidence: datasheet
    note: >-
      the input is the cord, one `nema-l5-20p` power port (eaton/tripplite-cord-l5-20p@1),
      and each outlet a `nema-5-20r` power outlet fed by it (both types in NetBox
      and Nautobot, dcim/choices.py at the commits dcim_export.py cites). THE
      OUTLETS ARE NAMED AS THE UNIT PRINTS THEM, 1 to 16: the `interfaces:` rule
      maps each `outlet-<n>` to its numeral. No source names a breaker for this
      model (the spec sheet and the manual mention none), so no outlet runs
      `through` one. NO feed_leg IS WRITTEN: a single-phase PDU is on whatever
      leg its plug is on (docs/pdu-model-design.md section 5.2). The card's
      Ethernet port exports as its management interface and its micro-USB as a
      console port; the USB-A sensor port and the factory DE-9 have no
      device-type field.
  input:
    confidence: datasheet
    note: >-
      datasheet - spec sheet INPUT: single-phase, 120 V, recommended service
      single-phase 20 A 120 V, maximum input 16 A ("Agency de-rated to 16A
      continuous"), plug NEMA 5-20P; NEMA L5-20P, cord 12 ft (3.66 m); OUTPUT
      1.92 kW (120 V) / 16 A total, 50/60 Hz. The cord is fixed (manual,
      Features: "permanently attached"), so `input-plug` is the slug the cord
      exports, `nema-l5-20p`, and the 5-20P is the adapter in the box. It leaves
      the rear face through a bushing 107.3 to 127.1 across, the left of centre
      seen from behind (COVERAGE: "the rear left").
  capability:
    confidence: datasheet
    note: >-
      datasheet - the spec sheet sells it as a switched PDU ("PDU Type:
      Switched"; "16 individually switched output receptacles"), and what it
      meters is the input: "Network interface provides PDU control and data
      regarding input voltage and total output load level in amps"; "Digital
      display continuously reports total output load level in amps". No bank or
      outlet is metered. So `metering-scope: input` and `outlet-switching: true`,
      the class `switched-metered-input` (docs/pdu-model-design.md section 2.2,
      which names this PDU). Every outlet declares `[on, off]` on its own
      placement, not on the group, so the outlets stay slots a cord end can be
      seated in.
  lifecycle:
    confidence: datasheet
    note: >-
      searched 2026-10-09 (web, "PDUMH20NET discontinued OR end of life OR
      replacement Tripp Lite"): the hits are for other SKUs (PDUMH20HVTAA,
      discontinued 9/21/2015) and nothing names this one. The spec sheet staged
      2026-10-08 is copyright 2026 and the Eaton SKU page is live. Nothing
      announces an end of life.
attrs:
  physical:
    weight-kg: 5.67
    construction: metal
  power:
    input-ac: 120 V single-phase, 16 A continuous (agency de-rated; for a 20 A circuit), 50/60 Hz
    input-plug: nema-l5-20p
    input-cord: fixed
    input-phase: single
    input-voltage-v: 120
    input-current-a: 16
    plug-rating-a: 20
    capacity-kw: 1.92
    capacity-scope: >-
      the load the PDU can hand on, 1.92 kW at 120 V, 16 A in all (spec sheet);
      it is not what the PDU draws itself, which no document held states
    output-voltage: 120 V
    output-rating: 16 A total; 16 A max per outlet
    frequency: 50/60 Hz
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    storage-temp: -30 to 50 C (-22 to 122 F)
    humidity: 5 to 95 % non-condensing
    altitude: 0 to 3000 m (0 to 10000 ft)
  management:
    metering-scope: input
    outlet-switching: true
    metering: total output load in amps on the front display; input voltage, frequency and load over the network
    network-interface: pre-installed WEBCARDLX (PowerAlert Device Manager PADM20), 10/100 Mbps
    protocols: HTTP, HTTPS, PowerAlert Network Management System, SMTP, SNMPv1, SNMPv2, SNMPv3, Telnet, SSH, FTP, DHCP, NTP
  compliance:
    certifications: CSA (Canada); NOM (Mexico); UL 60950-1
    product-compliance: RoHS; FCC Part 15 Class A (USA); Trade Agreements Act (TAA)
  lifecycle:
    eol: none-announced
chassis:
  width: 444
  height: 44.4
  depth: 394
  ru: 1
  color: '#1d1d1b'
  airflow: passive
  weight-kg: 5.67
  ears:
    color: '#1d1d1b'
    positions:
      - {name: flush, label: 'longer mounting brackets, flush (owner''s manual 1-1)', default: true}
      - {name: recessed, label: 'longer mounting brackets extending beyond the front panel (owner''s manual 1-1)'}
      - {name: rear, label: 'ears reversed for rear-facing installation (spec sheet)'}
gaps:
- what: female-de9
  scope: [config-port]
  reason: vendor-silent
  note: >-
    the rear's Config. Port is a female DE-9 (BK at 4x: nine socket holes in a grey
    insert), and the library has only the male half (std/db9@1, composed by
    common/db9-receptacle@1), so it is drawn male. Its place, size and standoffs
    are right; its gender is not.
  wanted: a female DE-9 receptacle part (sockets in a flush insert, as std/vga@1 draws its own), to replace the male one here.
- what: outlet-lamp-colour
  scope: [outlet-leds]
  reason: vendor-silent
  note: >-
    the owner's manual says each outlet LED illuminates when its outlet is live
    and names no colour; the spec sheet says "power on-off status" and names none;
    every photograph shows the lamps unlit. The `on` state is declared with no
    colour, so the kit paints its default lit colour.
  wanted: a photograph of a powered PDUMH20NET, or Tripp Lite's word on the lamp colour.
- what: bracket-holes
  scope: [left, right]
  reason: needs-drawing
  note: >-
    the sides carry the tapped holes the mounting brackets screw to (three #6-32
    screws a bracket, at more than one depth: owner's manual 1-1 and Features),
    and _C and DT02 show some of them, but only at a steep angle; no straight
    view or drawing of a side exists, so the sides are drawn bare.
  wanted: a straight-on photograph of a side with a scale, or a dimensioned drawing.
- what: card-opening
  scope: [card]
  reason: needs-photo
  note: >-
    no photograph or drawing shows the PDU with the WEBCARDLX out, so the slot's
    hole is not measured. The bay states the plate's main body, 67.3 by 29.1,
    as its opening: the largest hole the plate covers, an upper bound.
  wanted: a photograph of the PDU with the card removed, or the slot's dimensions from Tripp Lite.
- what: card-depth
  scope: [card]
  reason: vendor-silent
  note: >-
    no held source dimensions the WEBCARDLX behind its faceplate or the slot it
    sits in (the WEBCARDLX manual gives none), so the card states no depth.
  wanted: the WEBCARDLX's dimensions from Tripp Lite.
groups:
  outlets: {term: Outlet, role: traffic, index-origin: 1, attrs: {outlet: nema-5-20r}, description: 'the PDU''s 16 NEMA 5-15/20R outlets, 1 to 8 on the front and 9 to 16 on the rear, numbered as printed; each switchable'}
  outlet-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: 'one lamp per outlet, lit while the outlet is ready to distribute live AC power (owner''s manual 933687 rev A, 2-3); its colour is not stated'
