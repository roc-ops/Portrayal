format: 1
kind: device
name: evma8365x
version: 0.1.0
maturity: modelled
manufacturer: Eaton
model: EVMA8365X
description: >-
  Eaton Rack PDU G4, managed, 0U: an 1829 mm black aluminium strip that hangs on two
  mounting buttons in a rack's vertical channel and hands a three-phase 208 V delta
  feed (a fixed 10 ft cord with a CS8365C plug, 40 A, 14.4 kW) on to 42 outlets - 24
  IEC C13 and 18 Eaton C39 - in six colour-coded sections of seven, A to F. Every
  section has its own 20 A two-pole breaker, line to line, and every outlet is metered
  and switched, with a lamp at its end that shows green when it is on and red when it
  is off. A hot-swappable network module with two gigabit Ethernet ports, a pixel LCD
  and four keys sits between sections C and D.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE VENDOR'S VECTOR DRAWING. Eaton drawing 9001-22312 (EVMA8365X G4
      MANAGED, first issue 18-Aug-2023, D size, SCALE 0.400) draws the PDU lying down,
      cord end at the left, in a front view, a side view below it and a rear view below
      that, with an end view of the cord end, the plug, an isometric and a one-line
      diagram. Its views are paths, not a raster, so every position here was read off
      the PDF's geometry with PyMuPDF at 1.133858 pt per mm (0.4 x 72 / 25.4), the way
      the EVMI2130X was read off 9001-22301. The check on that scale is the drawing's
      own dimensions: 1829 overall lands at 2073.83 pt (1829.0), the 65.00 depth of the
      end cap at 73.70 pt (65.0), the buttons at 124.0 and 1679.8 (1555.8 apart) and
      the holes 55.80 beyond each, all within 0.05. The library draws the PDU STANDING,
      cord end down, as the pilot does, so a drawing x along the length becomes 1829
      minus that, and a drawing y across becomes x. The one-line diagram is the one
      raster on the sheet (a 504 x 488 JPEG at 96 ppi), read at zoom.
  photos:
    confidence: borrowed
    note: >-
      borrowed - THE GALLERY IS SHARED, NOT THIS SKU'S OWN. The EVMA8365X page lists four
      CHASSIS_424 masters (FRONT, BACK, SIDE, HRZ) and two EVMI8365X shots (the
      metered-input sibling on the same chassis: the brochure gives both 72 x 2.1 x
      2.6 in, the CS8365, 42-outlet, 1829 mm build). CHASSIS_424_HRZ, a straight-on
      full length at 3000 px, shows six breakers A to F, which is this drawing and not
      the EVMI2130X's three, and is used as the second reading for the section
      colours, the labels and the outlet lamps. EVMA8365X_DT01 is byte-identical to
      EVMI2130X_DT06, an in-rack lifestyle shot, and is evidence of neither.
  mount:
    confidence: drawing
    note: >-
      `rack-side`, as the EVMI2130X: the part stands vertically beside the rack's
      opening, takes no rack unit and exports u_height 0 and is_full_depth false
      (docs/vertical-cable-managers-design.md). The G4 installation and setup guide
      P-164001156 rev 3 hangs every 0U G4 on its two factory buttons in keyhole slots
      (2.11.2), one or two a side (2.9, Fig. 7). `ru: 41` is the SKU title's 41U; 1829
      is 41.1 units. No ears: a 0U PDU has none.
  chassis:
    confidence: drawing
    note: >-
      drawing - 9001-22312 MECHANICAL: 72.01 in (1829 mm) length, 2.05 in (52 mm)
      width, 2.56 in (65 mm) depth, aluminium chassis, black. The 65 is the end cap
      from the face to the back (582.69 to 656.39 pt on the side view); the outlet
      mouldings stand 3.96 off the face, their lamps 5.0, the breaker plates 7.54, the
      network module about 11 and the buttons 9.36 off the back, none of it in the 65.
      The SKU page's PRODUCT HEIGHT 72 in, WIDTH 2.56 in and LENGTH/DEPTH 2.05 in say
      the same with the axes renamed (COVERAGE: the page's axis labels are wrong).
      Weight 28.2 lb (12.8 kg) is the SKU page's.
  front:
    confidence: drawing
    note: >-
      drawing - the front view of 9001-22312, read in drawing mm (x from the cord end,
      y from the edge drawn at the top). Six outlet mouldings 181.3 long by 36.0 (y
      6.04 to 42.06) start at x 195.09, 444.19, 693.29, 1137.39, 1386.49 and 1635.59,
      a 249.10 period on each side of the module; each carries seven outlets at the
      pilot's offsets (a C13 recess 3.24, 54.04, 104.84 and 155.64 into the moulding,
      a C39 26.54, 77.34 and 128.14) and a printed strip at y 45.5 to 49.5 from 0.51
      in. Each section has its breaker plate (60.0 by 48.0, y 2.0 to 50.0) 3.89 before
      its moulding, at 131.2, 380.3, 629.4, 1073.5, 1322.6 and 1571.7. The network
      module's faceplate spans 879.45 to 1067.35 and y 1.45 to 50.55, the pilot's
      187.9 by 49.1, with its jacks, USB-C, LCD and keys at the pilot's offsets within
      it (the jack pair centred 36.74 in against the pilot's 36.70). At the cord end,
      an M6 ground screw (12.5 across at 52.0, 38.0), a screw 6.0 across at 14.0, 26.0
      and a round boss 8.2 across at 92.0, 36.0; a second 6.0 screw at 1822.0, 26.0.
      End caps 2 thick at both ends.
  outlet-pitch:
    confidence: drawing
    note: >-
      drawing - NOT DIMENSIONED, MEASURED FROM THE PATHS, as on the pilot: the 42
      lamps stand at the 25.4 outlet pitch's alternation (27.8 then 23.0 apart, C13 to
      C39 and back), and A1's C13 recess starts at 198.33, 3.24 into its moulding, as
      9001-22301's does.
  lamps:
    confidence: drawing
    note: >-
      drawing, datasheet and photo - 9001-22312 draws a bump 4.0 by 2.94 on the
      moulding's outer edge at the far end of every outlet, 42 in all, centred 2.2 to
      2.3 before the outlet recess ends (x 218.13 for A1 to 1811.04 for F42). The G4
      guide 1.3 gives Metered Outlet, Switched and Managed models an LED per outlet,
      and the G4 brochure BR155056EN says green indicates power on and red power off
      to the outlet. Each is eaton/g4-outlet-led@1 placed with `for:` naming its outlet,
      so a state set on the outlet reaches its lamp (docs/pdu-model-design.md section
      3.2); the `outlet-leds` group states the two colours once. CHASSIS_424_HRZ shows
      them unlit, clear domes over the dark moulding. With no state set a lamp draws
      unlit, whatever its declared `off`.
  sections:
    confidence: drawing
    note: >-
      drawing and photo - 9001-22312 labels SECTION A (YELLOW), B (BLUE), C (ORANGE),
      then the network module, then D (YELLOW), E (BLUE), F (ORANGE); CIRCUIT
      BREAKERS: (6) 20A 2-POLE LISTED, one plate at the head of each section with its
      letter on a tile in the section's colour. The outlets are printed A1-A7,
      B8-B14, C15-C21, D22-D28, E29-E35 and F36-F42: CHASSIS_424_HRZ reads all six
      strips so. THE DRAWING MISPRINTS SECTION F as F36, F37, F38, E39, E40, E41, E42;
      the photograph of the chassis reads F39 to F42, and every other strip on the
      sheet runs one letter, so the photograph is taken (gaps: section-f-labels).
  one-line:
    confidence: drawing
    note: >-
      drawing - READ AT ZOOM. 9001-22312's one-line diagram (a raster, re-rendered at
      300 dpi) draws L1, L2 and L3 each through a metering element to a vertical bus,
      the L1 bus leftmost, then L2, then L3, each bus starting at the dot where its
      line arrives and running down past the crossings it hops. Each breaker is a
      two-pole switch with an upper and a lower pole. A: the upper pole on L1's
      line, the lower from the L2 bus's top corner. B: upper on L2 (dot on the L2
      bus), lower from the L3 bus's top corner. C: upper on L3 (dot on the L3 bus),
      lower from a dot on the L1 bus. D: upper from a dot on the L1 bus, lower from a
      dot on the L2 bus. E: upper from the L2 bus's bottom corner, lower from a dot
      on the L3 bus. F: upper from the L3 bus's bottom corner, lower from the L1
      bus's bottom corner. So A and D are across L1-L2, B and E across L2-L3, and C
      and F across L3-L1 - the pilot's A, B and C, repeated for D, E and F, and the
      section colours say the same (yellow L1-L2, blue L2-L3, orange L3-L1). PE runs
      to a ground symbol and joins no bus. Each section's output passes a second
      metering element (branch metering).
  colours:
    confidence: photo-measured
    note: >-
      photo-measured - the section colours are the pilot's, the modal saturated
      pixels of the EVMI2130X outlet bank masters, a FIELD on the strip and breaker
      parts that each placement sets; CHASSIS_424_HRZ shows the same yellow, blue and
      orange on D, E and F as on A, B and C. The body is the pilot's #2e3033.
  rear:
    confidence: drawing
    note: >-
      drawing - the rear view of 9001-22312: the two mounting buttons on the width's
      centre line (the 1.02 [26.00] dimension), 124.00 from the cord end and 1555.8
      apart (at 1679.8), and a 5.4 threaded hole 55.80 beyond each, at 179.8 and
      1735.6, where the buttons can be moved. The view is symmetric about its centre
      line, so the rear is the view unmirrored.
  sides:
    confidence: drawing
    note: >-
      drawing - the side view of 9001-22312, the long side at the strip's edge (third
      angle, below the front view), which is the standing PDU's right; x = 0 is the
      face. Hex threaded inserts (6.35 across flats, drawn as a 6.6 disc as on the
      pilot) at 124.0, 179.8, 1679.8 and 1735.6, 20.0 behind the face (the 1.77
      [45.00] dimension, from the back), the side-mount positions for the buttons;
      six Torx screws 6.0 across, 20.0 behind the face, at 32, 385, 728, 1091, 1449
      and 1797; end-cap screws 6.0 across, 38.5 behind the face, 7.0 from each end;
      two screws 6.8 across 7.0 behind the face at 885.45 and 1049.9, at the ends of
      the module slot. A seam runs the length 13.2 to 14.8 behind the face.
  left:
    confidence: estimated
    note: >-
      estimated - no view draws the other long side. It is drawn as the right side
      mirrored front to back, as the pilot's is; CHASSIS_424_SIDE does not resolve
      the fasteners.
  ends:
    confidence: drawing
    note: >-
      drawing - the end view of 9001-22312 is the cord end: a grommet 36.9 across,
      centred on the width and 24.5 behind the face (40.5 from the back), with a
      toothed strain-relief clamp in a 30.1 bore. Top and bottom views have y = 0 at
      the rear. No view draws the far end; it is drawn as its end cap alone.
  module:
    confidence: drawing
    note: >-
      drawing - the network module is eaton/g4-enmc@1, in a bay, as on the pilot. Read
      against this drawing as the design note asked: 9001-22312 COMMUNICATION lists
      G4 eNMC, DUAL GIGABIT ETHERNET WITH NETWORK CASCADING, POWER REDUNDANCY PORT,
      EMP PORT, 2xUSB-C, MENU PIXEL LCD, which is the part's list, and the faceplate
      draws PDU+1 and SENSOR, the 0 and 1 network jacks, USB/0 and USB/1, the LCD and
      four keys (<, >, ESC, enter) at the same offsets in a faceplate of the same
      187.9 by 49.1.
  relief:
    confidence: drawing
    note: >-
      drawing - the side view puts the outlet mouldings 3.96 proud of the face and
      their lamps 5.0. The mouldings are drawn flat, as on the pilot (a raised box
      would bury the outlets placed on it in 3D); the lamps are domed 1.0, their
      height over the moulding. The outlets are wells, 18 and 20 deep, from their
      own contracts; the breaker plates are built 7.5 proud from theirs. The network
      module is 40 deep (estimated), inside the 65 mm body.
  dcim:
    confidence: datasheet
    note: >-
      the input is one `cs8365c` power port (eaton/g4-cord-cs8365c@1) and each outlet
      a power outlet fed by it, `iec-60320-c13` or `eaton-c39`. EACH OUTLET RUNS
      `through` ITS SECTION'S BREAKER, a fixed part, and each breaker states the
      `lines` it is across, so the export writes "Through breaker A, lines L1-L2" on
      each outlet, naming the breaker by its printed letter. NO feed_leg IS WRITTEN:
      a delta input has no neutral, so every outlet is line to line
      (docs/pdu-model-design.md section 5.2). THE OUTLETS ARE NAMED AS THE UNIT
      PRINTS THEM, A1 to F42, through the `interfaces:` rules, as the pilot's are.
  input:
    confidence: drawing
    note: >-
      drawing and datasheet - a CS8365C plug on a fixed 10 ft cord, 6 AWG and four
      conductors (9001-22312 INPUT). INPUT RATING 200-240V~ DELTA, 3W+PE, 40A,
      50/60HZ, so `input-phase: three`, `input-wiring: delta` and `input-voltage-v:
      208`, the SKU title's and the SKU page's INPUT VOLTAGE 208V, line to line. The
      SKU title's 50A is the plug's rating (CS8365C, 50 A 250 V); the drawing's 40A,
      the SKU page's AMPERAGE RATING 40A, is the derated input. 14.4 kW is the SKU
      title's and is 40 A x 208 V x root 3 (14.41).
  capability:
    confidence: datasheet
    note: >-
      drawing and datasheet - 9001-22312 FUNCTIONALITY: CURRENT, POWER, AND ENERGY
      METERING FOR INPUT AND OUTLET; CURRENT METERING FOR BRANCH; OUTLET SWITCHING.
      That is the G4 guide's Managed (MA) row of Table 1, so `metering-scope: outlet`
      and `outlet-switching: true`, the published class `managed`
      (docs/pdu-model-design.md section 2.2), and every outlet declares `[on, off]`.
      The SKU page's OUTLET CONTROL: No contradicts the drawing and the product name
      (gaps: outlet-control).
  lifecycle:
    confidence: datasheet
    note: >-
      no end-of-life notice is held for this SKU; the drawing's first issue is
      18-Aug-2023 and the SKU page (generated 2026) lists it as current. The G4 grid
      lists an EOL notification under a /secure/ path, which was not fetched.
attrs:
  physical:
    length-mm: 1829
    weight-kg: 12.8
    construction: aluminium chassis, black
  power:
    input-ac: 200-240 V three-phase delta, 3W+PE, 40 A, 50/60 Hz
    input-plug: cs8365c
    input-cord: fixed
    input-phase: three
    input-wiring: delta
    input-voltage-v: 208
    input-current-a: 40
    plug-rating-a: 50
    capacity-kw: 14.4
    capacity-scope: >-
      the load the PDU can hand on (40 A at 208 V three phase), from the SKU title; it
      is not what the PDU draws itself, which no document held states
    output-voltage: 200-240 V, line to line
    output-rating: 10 A per C13, 16 A per C39, 16 A per section, 40 A per phase
    breakers: six 20 A two-pole, listed
    frequency: 50/60 Hz
  environmental:
    operating-temp: 0 to 60 C (32 to 140 F)
  management:
    metering-scope: outlet
    outlet-switching: true
    metering: current, power and energy for the input and each outlet; current for each branch
    network-module: G4 eNMC, dual gigabit Ethernet with network cascading
  compliance:
    emc: FCC part 15 class A, CAN ICES-003 class A
    safety: UL 62368-1; cTUVus on the drawing
    cybersecurity: UL 2900-1, IEC 62443-4-2
    regulatory-model: EMAF-PHXJ-G28K
  lifecycle:
    eol: none-announced
chassis: {width: 52, height: 1829, depth: 65, ru: 41, mount: rack-side, color: '#2e3033', airflow: passive, weight-kg: 12.8}
gaps:
- what: outlet-depth
  scope: [front]
  reason: needs-drawing
  note: >-
    the outlet wells are built 18 (C13) and 20 (C39) deep from their contracts, the
    mating nose lengths in the registry. No outlet drawing held dimensions the wells
    themselves. The mouldings' 3.96 standoff, which the side view gives, is not built:
    a raised box over the outlets would bury their wells.
  wanted: a section through an Eaton G4 outlet moulding, or a measured unit.
- what: boss-at-cord-end
  scope: [front]
  reason: vendor-silent
  note: >-
    9001-22312 draws a round boss 8.2 across at the cord end, between the ground screw
    and breaker A, as 9001-22301 does; nothing held names it. It is drawn as decor.
  wanted: the part's name from Eaton, or the unit.
- what: ground-symbol
  scope: [front]
  reason: needs-photo
  note: >-
    the installation guide 2.11.4 says the ground symbol is marked beside the M6
    bonding screw; neither the drawing nor CHASSIS_424_HRZ resolves it, so it is not
    drawn.
  wanted: a close-up of the cord end of the face.
- what: section-f-labels
  scope: [labels-6]
  reason: sources-disagree
  note: >-
    9001-22312 prints section F's strip F36, F37, F38, E39, E40, E41, E42; the
    CHASSIS_424_HRZ photograph of the chassis reads F36 to F42. The photograph is
    taken, because the breaker and the tile are F, every other section runs one
    letter, and the drawing's E39 to E42 would duplicate no E outlet the unit has.
    The outlets are exported F39 to F42.
  wanted: a photograph of this SKU's section F, or a corrected drawing.
- what: outlet-control
  scope: [outlets]
  reason: sources-disagree
  note: >-
    the EVMA8365X SKU page says OUTLET CONTROL: No; its drawing 9001-22312 says
    OUTLET SWITCHING, its title and product type say managed, and the G4 guide's
    Managed topology switches each outlet. The drawing and the guide are taken.
  wanted: a corrected SKU page.
- what: cord-diameter
  scope: [input]
  reason: vendor-silent
  note: >-
    the end view draws the strain-relief clamp's 30.1 bore and not the cord, so the
    cord is drawn filling the bore; nothing held gives the 6 AWG four-conductor
    cord's diameter.
  wanted: the cord's jacket type and diameter from Eaton.
groups:
