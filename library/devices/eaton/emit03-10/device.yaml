format: 1
kind: device
name: emit03-10
version: 0.1.0
maturity: modelled
manufacturer: Eaton
model: EMIT03-10
description: >-
  Eaton ePDU G3 metered input rack PDU, 1U horizontal, 120 V. A 19 in black metal
  box, 203.2 mm deep, that takes a single-phase 120 V feed (a fixed 10 ft cord
  ending in a NEMA L5-30P, 24 A) and hands it on to 12 NEMA 5-20R outlets in two
  colour-coded sections of six, each on its own 20 A one-pole breaker, A (yellow)
  and B (blue). The controls end carries the hot-swappable meter module (two
  RJ-45 ports (serial and daisy-chain), a network RJ-45, a USB-A port, a pixel display and four
  buttons), the two breakers and outlets A1 and A2; the other end carries the cord
  gland and the remaining ten outlets. The meter reads the input and each section.
profile: power
provenance:
  method:
    confidence: drawing
    note: >-
      FIGURES FROM THE MAKER'S SPECIFICATION DRAWING, MEASURED, NOT DIMENSIONED.
      Eaton EMIT03-10 ("ePDU G3 SPECIFICATION DRAWING FOR EMIT03-10", part
      EMI3MGB5EMB13A1, revision 002, 21 Jan 2016, one D-size sheet) is a vector
      sheet that dimensions only the overall: 482.6 [19.00] wide, 42.9 [1.69]
      high and 203.2 [8.00] deep. Every other figure was read off a 300 dpi
      render against the 482.6, 9.45 px per mm (the 42.9 and the 203.2 read 42.8
      and 203.3 at that scale), good to about 0.5 mm. The sheet says "DO NOT
      SCALE DRAWING" and prints its own scale as 0.500 though it is drawn at about
      0.8; the overall is the only scale used. The sheet gives four views: the
      face with the controls (below the plan), the plan (the top), the face with
      the cord (above the plan, turned half a turn, its labels upside down) and a
      pictorial at a third of the scale. THE REAR VIEW IS TURNED HALF A TURN ON
      THE SHEET and is drawn here as it stands, seen from behind. No photograph of
      this model is held. The brochure (Rack PDU G3+, BR155022EN, 2019, EMEA) has two
      small photographs of 1U horizontal G3+ units on its page 3 (their model
      numbers are not printed) and larger ones of vertical units on page 2; they show
      the meter module, the buttons, the display and the section colours, and are the
      colour reference here, not photographs of this model.
  chassis:
    confidence: drawing
    note: >-
      drawing - 42.9 high, 203.2 deep, 482.6 over the ears; the body reads 444.4
      to 444.6 between the ears' inner edges, so it is 444.5 and each ear 19.05
      (three quarters of an inch). "BLACK CHASSIS" (the sheet's MECHANICAL cell);
      the hex #1f2022 is a stand-in, as the other Eaton strips'. The brochure
      (BR155022EN, page 3) shows black metal. The Eaton Rack PDU G3 product
      overview (PA155003EN) lists "Low-weight aluminum chassis". No weight is
      stated by any held document (gaps: weight).
  ears:
    confidence: drawing
    note: >-
      drawing - the sheet draws a rack ear at each end of the controls face, an
      L flange 19.05 wide with a slot, and the plan shows the flange at the
      controls end only. The library's generic ear stands for them (`chassis.ears`).
      The overview says "Flexible mounting options allows you to choose your
      preferred mounting method between 0U or 1U/2U" and the brochure "Horizontal
      units (1U/2U) come with rack ear support"; the position is flush, as drawn.
  front:
    confidence: drawing
    note: >-
      drawing - mm from the body's left and top, as seen from the front. The meter
      module's plate from 21.9 to 166.7 across and 1.7 to 39.5 down; two RJ-45
      ports (serial above, daisy-chain below) centred 33.6 across and 10.9 and 27.4 down;
      the network RJ-45 centred (57.2, 13.4) and the USB-A under it (57.2, 25.1);
      the reset button ("R" and a ring) at (70.9, 24.9); four buttons 12.0 by
      11.8, up and down at 96.8 across (8.8 and 32.6 down) and ESC and enter at
      153.8; the pixel display 30.4 by 33.6 at (110.2, 4.2); the Eaton wordmark
      from 77.1 to 96.3 across and 16.7 to 23.6 down (not drawn). Beyond the
      module: breaker A's plate at 179.1 across and 10.4 down, breaker B's at
      241.3, each 59.2 by 19.5; outlets A1 and A2 centred 373.3 and 411.9 across
      and 21.4 down, with their labels 19 to the left of each; a yellow section
      ring and screw between them. At the left, a 12.9 round point centred
      (10.2, 16.7) with the earth symbol under it (gaps: ground-point), and
      screws 6.2 from the left end at 7.2 and 36.6 down. The panel is symmetrical
      on the right, screws at 437.1.
  rear:
    confidence: drawing
    note: >-
      drawing - the cord face, seen from behind, so x runs the other way from the
      front: mm from the left as seen from behind. The cord gland, a hex nut 32.8
      across flats and 37.9 across corners, centred 31.5 across; then A3 to A6 and
      B1 to B6, each 27 square, centred 72.8, 111.6, 148.4, 187.5, 224.3, 263.4,
      300.2, 339.3, 376.1 and 415.1 across, all at 21.4 down. A section's two
      outlets sit about 39.1 apart with a ring and a screw between them (yellow for
      A, blue for B, at 92.0, 168.1, 243.9, 319.8 and 395.5), and neighbouring
      sections 36.8 apart. The labels A3 to B6 are printed beside each outlet.
      Screws stand 6.2 from each end at 7.2 and 36.2 down. THE DRAWN OUTLET
      OUTLINES ARE ABOUT 32 ACROSS, wider than the 27 face std/nema-5-20r@1 takes
      from the receptacle it follows; the part is placed on the drawn centre and
      its edge differs from the drawn one by about 2.5 on each side.
  outlets:
    confidence: drawing
    note: >-
      drawing - "OUTPUT (12) NEMA 5-20R", OUTPUT RATING "100-127V~; 16A MAX PER
      OUTLET; 16A MAX PER SECTION; 24A MAX TOTAL". Numbered as printed, A1 and A2
      on the controls face, A3 to A6 and B1 to B6 on the cord face. Each is drawn
      with its T neutral slot up, its earth hole to the left and its line slot
      down, as the sheet draws it (viewed from the face). The sheet's one-line
      diagram feeds section A and section B each through its own breaker (a
      metering point before it), so outlets A1 to A6 are `through: breaker-a` and B1
      to B6 `through: breaker-b`.
  breakers:
    confidence: drawing
    note: >-
      drawing - "CIRCUIT BREAKERS (2) 20A 1-POLE UL LISTED": one breaker per
      section, each in the live line only (the one-line diagram: L through the
      meter and breaker to the section, N straight through).
  module:
    confidence: drawing
    note: >-
      drawing and datasheet - the meter module is drawn as one plate with its
      ports, display and buttons. The Eaton Rack PDU G3 product overview
      (PA155003EN) says "Hot-swappable meter eliminates power disruption to your IT
      equipment when removing the meter" and the brochure shows the module out of
      the strip. IT IS NOT MODELLED AS A BAY: no held document dimensions the module
      apart from its faceplate or gives its depth (gaps: meter-module-bay), so its
      parts stand on the face. THE MODULE'S PORTS ARE NAMED BY THE G3 QUICK START
      (P-164000314_2, July 2014, page 2 table), not by this sheet: a serial or
      environmental probe (EMP) RJ-45 port (1), an Ethernet 10/100 Base-T port (4), a
      reset button (7) "insert a probe and press the button for 3 seconds", a USB port
      "used for firmware upgrade" (8) and a daisy chain port (9). The sheet draws
      three RJ-45 sockets and a USB-A socket: the one with the network symbol beside
      it is the Ethernet port, the stacked pair at the left is the serial and the
      daisy-chain port, and WHICH OF THE PAIR IS WHICH IS NOT STATED by any held
      figure (the quick start's module drawing is too small to read). The upper one is
      taken as the serial port, the lower one, under the chain symbol, as the daisy
      chain (gaps: module-port-order). The "R" and ring beside the USB port is the
      reset button.
  input:
    confidence: drawing
    note: >-
      drawing - INPUT "NEMA L5-30 PLUG", "10FT 10AWG / 3C POWERCORD"; INPUT RATING
      "100-127V~", "W+N+PE", "24A", "50/60HZ". The cord is fixed. The exporter
      writes a L5-30P cord as `other` with a label, as it does the cord of the
      PDUMV30, so `input-plug` is `other`.
  capability:
    confidence: drawing
    note: >-
      drawing - FUNCTIONALITY "CURRENT, POWER AND ENERGY METERING FOR INPUT &
      BRANCH"; the overview lists "Phase and section metering" and no outlet-level
      or switching feature for the Metered Input tier. So `metering-scope: branch`
      (the section is the finest level) and `outlet-switching: false`.
  dcim:
    confidence: drawing
    note: >-
      the input is one power port (eaton/g3-cord-l5-30p@1) and each outlet a
      `nema-5-20r` power outlet fed by it, named as printed, A1 to A6 and B1 to B6.
      No `feed_leg` is written: a single-phase PDU is on whatever leg its plug is on.
attrs:
  power:
    input-ac: 100-127 V single-phase (W+N+PE), 24 A, 50/60 Hz
    input-plug: other
    input-cord: fixed
    input-phase: single
    input-current-a: 24
    plug-rating-a: 30
    output-voltage: 100-127 V
    output-rating: 16 A per outlet; 16 A per section; 24 A total
    breakers: two 20 A one-pole breakers, one per section
    frequency: 50/60 Hz
  environmental:
    operating-temp: 0 to 60 C (32 to 140 F)
  management:
    metering-scope: branch
    outlet-switching: false
    metering: current, power and energy for the input and each branch
    network-interface: hot-swappable meter module, RJ-45 network port, RJ-45 serial and daisy-chain ports, USB-A
  compliance:
    certifications: UL listed (cULus)
chassis:
  width: 444.5
  height: 42.9
  depth: 203.2
  ru: 1
  color: '#1f2022'
  airflow: passive
  ears:
    color: '#1f2022'
    positions:
      - {name: flush, label: 'ears flush with the controls face, as the specification drawing draws them', default: true}
gaps:
- what: weight
  scope: [front]
  reason: vendor-silent
  note: >-
    no held document states the weight of the EMIT03-10: the drawing gives none and the overview and brochure give
    none per model.
  wanted: the maker's specification sheet for the EMIT03-10 with its unit weight.
- what: colours
  scope: [front, rear, top]
  reason: needs-photo
  note: >-
    no photograph of this model is held. The sheet says "BLACK CHASSIS" and its section outlines are yellow and blue;
    the brochure's page 3 photographs of 1U G3+ units (a later generation than the 2015 sheet) show a black chassis
    and module, yellow (A) and blue (B) lettered tiles, light blue buttons with white symbols and a lit blue-violet
    screen. The buttons' light blue and the tiles' two hues are taken from them and are borrowed, not measured on this
    model. The chassis hex, the unlit display's dark blue and the breaker handles are stand-ins.
  wanted: a photograph of the EMIT03-10.
- what: ground-point
  scope: [front]
  reason: vendor-silent
  note: >-
    the sheet draws a round 12.9 point at the left end of the controls face with the earth symbol under it, and
    names no part. It is placed as a ground screw on a washer (common/ground-screw-washer@1, 11.0), the library's part
    of that kind; the size and the kind of fixing are not stated.
  wanted: a dimensioned detail or a photograph of the controls end.
- what: meter-module-bay
  scope: [front]
  reason: needs-drawing
  note: >-
    the meter is hot-swappable but no held document draws it apart from the faceplate, so no bay and no module
    component stand for it; the ports, display and buttons are placed on the face.
  wanted: a drawing or photograph of the module and its slot.
- what: outlet-grips
  scope: [rear, front]
  reason: needs-drawing
  note: >-
    the sheet draws a plate with a lever, two crosses, a triangle and a ring above each IEC outlet of the EMIT04-10;
    the EMIT03-10's NEMA outlets draw none. Nothing is drawn here.
  wanted: n/a for this model.
- what: top-features
  scope: [top]
  reason: needs-drawing
  note: >-
    the plan shows two bands 16.7 and 17.2 deep along the rear and front edges and six screws, and no figure gives
    their relief. Only the screws are drawn.
  wanted: a section through the lid.
- what: module-port-order
  scope: [front]
  reason: vendor-silent
  note: >-
    the quick start (P-164000314_2, July 2014, page 2) names a serial or EMP port, an Ethernet port, a USB port, a
    reset button and a daisy chain port for the module, and its drawing is too small to tell which of the sheet's
    stacked pair of RJ-45 sockets is the serial port and which the daisy chain. The upper is drawn as the serial
    port and the lower, under the chain symbol, as the daisy chain; the order is an assumption. The quick start
    allows four units on a chain where the product overview (PA155003EN, 2018) says eight.
  wanted: a photograph of the module with its labels, or the module's operations manual.
- what: module-legends
  scope: [front]
  reason: needs-drawing
  note: >-
    the sheet prints the chain, network and USB symbols, the small legend above the network port and the Eaton
    wordmark on the module, as outlines a millimetre or two high; none is drawn (the wordmark is the `logo-zone`
    region). The ground point drawn here is a screw on a washer where the sheet draws an empty circle.
  wanted: a photograph of the module.
