        id-format: outlet-{n}
        number-from: 1
        fed-by: input
        numerals: {font-size: 3.4, anchor: middle, fill: '#e8e8e6'}
        segments:
        - ref: std/nema-5-20r@1
          count: 24
          through: breaker
          at: [5.5, 1108.5]
          pitch: [0.0, -45.0]
          rotate: 90
          numerals: {offset: [13.5, 31.8]}
      placements:
      - {block: outlets}
      - {id: ground-stud, ref: common/ground-stud@1, at: [14.65, 1482.95], group: grounding, rel-pos: 1, for: chassis}
      - {id: input, ref: eaton/g3-cord-l5-20p@1, at: [8.65, 1447.65], rotate: 90, group: power-input, rel-pos: 1}
      - {id: breaker, ref: common/breaker-push-reset@1, at: [10.45, 1414.75], group: breakers, rel-pos: 1,
        description: the 20 A push-to-reset circuit breaker (UL1077) that protects all 24 outlets}
      - id: power-led
        ref: eaton/tripplite-led@1
        at: [16.4, 1388.7]
        group: lamps
        rel-pos: 1
        for: chassis
        description: the POWER lamp
    regions:
    - id: logo-zone
      at: [9.0, 1240.0]
      size: {w: 20.0, h: 45.0}
      label: EATON logo, from 215.3 to about 260 from the cord end; not drawn
  rear:
    size: {w: 38.0, h: 1524.0}
    panel:
      decor:
      - {id: screw-1, at: [2.7, 1514.2], size: [5.6, 5.6], rx: 2.8, fill: '#2a2b2d', kind: screw-head}
      - {id: screw-2, at: [27.9, 1514.2], size: [5.6, 5.6], rx: 2.8, fill: '#2a2b2d', kind: screw-head}
      - {id: screw-3, at: [2.7, 4.2], size: [5.6, 5.6], rx: 2.8, fill: '#2a2b2d', kind: screw-head}
      - {id: screw-4, at: [27.9, 4.2], size: [5.6, 5.6], rx: 2.8, fill: '#2a2b2d', kind: screw-head}
  top:
    size: {w: 38, h: 38}
    empty: >-
      no source draws the end: the drawing's end detail shows the cord's section and no face of the far
      end, and the SKU has no picture of it.
  bottom:
    size: {w: 38, h: 38}
    empty: >-
      no source draws the cord end as a face: the drawing's detail beside the plug shows a 38.0 by 38.0
      section with the cord leaving it, which is not a view of the end.
  right:
    size: {w: 38, h: 1524}
    empty: >-
      the drawing draws the side with its logos and the outlet mouldings standing proud, and no figure
      dimensions them (gaps: side-features); the ePDU and EATON logos are not drawn.
  left:
    size: {w: 38, h: 1524}
    empty: >-
      the drawing draws this side as the other one mirrored, with its logos and the mouldings standing
      proud, and no figure dimensions them (gaps: side-features); the logos are not drawn.
interfaces:
- {physical: 'outlet-{n}', name: '{n}', range: 1-24}
configurations:
  base:
    kind: base
    default: true
    description: >-
      The PDU as it ships, with its fixed 15 ft cord. The 250 mm adapter from the L5-20P plug to a 5-20R
