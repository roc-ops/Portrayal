format: 1
kind: device
name: iolan-scg34-r
version: 1.0.0
maturity: modelled
manufacturer: Perle
model: IOLAN SCG34 R
aliases:
- {name: IOLAN SCG34 R Console Server, kind: marketing}
portfolio: {line: IOLAN, family: Console Server, series: IOLAN SCG R/U}
description: >-
  Perle IOLAN SCG34 R console server, 1U, with 32 RJ45 RS-232 serial ports in 2 of its three G16 module
  bays. It has dual AC power and two network pairs of RJ45 and SFP. The front carries the display, the
  keypad, the power button, the ready lamp and the card slot. It also has the RJ45 and micro-USB admin
  ports, two USB 3.0 ports and the reset hole. The rear carries the network pairs at the left, the module
  bays and the two inlets, each with a rocker switch. Modelled as the dual-AC build with no cellular parts,
  as the R/U product page lists none.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Perle, IOLAN SCG Hardware Installation Guide, Expandable Models (5500427-10, Sept 2021): page 7
      (the unit, 1U), page 9 (labelled front and rear photographs of an SCG50 RRU-LAWM, RRR-LAWM and UUU-LAWM),
      page 10 (modules, the bays), pages 11 to 13 (network ports, inlets, power button), page 27 (specifications)
      and page 35 (Appendix D, the mechanical drawing). Perle, the IOLAN SCG R/U product page (the IOLAN
      SCG34 R row: description, part numbers, Specifications tab). No data sheet, CAD model or stencil
      is held.
  size:
    confidence: drawing
    note: >-
      Guide page 35 (and the fixed-model guide, 5500438-10, page 20): the drawing's labels read 436MM,
      44MM and 262MM, so the body is 436 wide, 44 high and 262 deep. The product page prints "26.4 x 43.4
      x 4.4 (cm)", which differs by 2 mm in depth and width; the drawing is taken because it labels its
      axes. Height 44 against the 1U rack unit of 44.45 is the drawing's rounding. The drawing's front
      view is orthographic: 1935 px for the 436 mm body and 194 px for the face, 4.44 px/mm across and
      4.44 down.
  front-layout:
    confidence: drawing
    note: >-
      Every front position is read off the front view of the drawing on guide page 35 at 400 dpi (4.44
      px/mm). The origin is the body's left edge, then each position is moved right by the ears. Each
      is checked against the labelled photograph on page 9. The drawing prints no dimension for any feature,
      so each is good to about 0.5 mm. The drawing also draws a SIM slot, three antenna connectors and
      a modem jack. The guide says the SIM slot and the modem apply to certain models and the R/U product
      page lists no cellular or modem feature, so none is drawn here.
  rear-layout:
    confidence: photo-measured
    note: >-
      Every rear position is read off the labelled rear photograph of an SCG50 RRR-LAWM on guide page
      9, 1278 px for the 436 mm body (2.93 px/mm across, 2.9 down). The photograph is slightly angled,
      so each position is estimated to within about 2 mm. The jack pitch reads 14.3 mm and the gap between
      modules 2.0 mm beyond one pitch; the registry's ganged-jack pitch of 13.97 does not fit the photograph's
      24 columns. The two inlets, the rockers, the network cluster and the bays are placed the same way.
  serial-ports:
    confidence: datasheet
    note: >-
      Product page row: "32 x RS232 RJ45" is the model's own count ("16 x RS232 RJ45 interfaces" for the
      SCG18 R, per module). Guide page 27: "shielded RJ45 ports". Page 9 prints each column's two numbers
      as "1^ 2v" above it, odd above even. The ports are RS-232 with software selectable Cisco pinouts
      (the page).
  network:
    confidence: datasheet
    note: >-
      Guide page 11: "two Ethernet combo pairs (RJ45 and SFP) identified as Ethernet 1 and 2"; only one
      port of each pair is active at a time. The photograph shows an SFP cage above an RJ45 on each pair,
      numbered 1 and 2.
  power:
    confidence: datasheet
    note: >-
      Guide page 12: two inlets on the back, each with its own rocker switch. Guide page 27: "100-240
      VAC, 50-60 Hz, 1.5 Amps max". The page: "IEC320-C13 to NEMA 5-15P line cord" and four other countries,
      so the inlet is a C14 (inferred from the cord end; the inlet's own type is not named). The R/U page
      prints 15.5 W typical and 47-63 Hz; the guide's 50-60 Hz is the one recorded.
  sides:
    confidence: drawing
    note: >-
      Estimated from the lower view of the drawing on guide page 35 at 600 dpi, 6.71 pixels to the millimetre
      (the 262 mm label). Each edge is good to about 0.3 mm. Both sides carry the ear bracket, six round
      holes and six slotted ovals. They also carry two rows of 32 vent slots, two more round holes and
      two ringed holes. The drawing does not say which side it shows. Its front is at the left, which
      is the right side on this library's views. So the right side is drawn as the drawing shows it, and
      the left is its mirror about the depth. The photograph of the unit on guide page 10 shows the same
      two vent rows in the middle of the side. It also shows a few small holes, in perspective. The photograph
      shows no bracket fitted, and the drawing draws one on each side in the ear's colour. The guide does
      not say how the brackets are supplied. The line colour and the hole colour are stand-ins on the
      body's near black.
  top-and-bottom:
    confidence: drawing
    note: >-
      Estimated from the plan view of the same drawing. A line runs the full width 10.8 mm behind the
      front. The plan is not labelled top or bottom, so both faces carry it. The plan shows the bracket
      leg edge-on as a line about 2 mm outside each body edge, from 2.2 to 96.9 behind the front. The
      view is the 436 body, so the leg is drawn as a thin line on each edge, 94.7 long. The plan also
      shows the ear flange at each end of the front, about 2 mm deep and standing outside the body. Both
      faces stay the 436 mm body, and the flanges are not drawn on them. The drawing shows no vent or
      hole on the plan.
  ears:
    confidence: drawing
    note: >-
      Estimated from the front view of the same drawing at 6.70 pixels to the millimetre. A flange stands
      22.1 past each end of the 436 body and is 43 high, with two slotted holes. The front is therefore
      480.2 wide and the chassis stays 436. The drawn front positions are the body's, shifted 22.1 to
      the right.
  colour:
    confidence: photo-measured
    note: >-
      The median of bare plate in the page 9 photographs is #1d1e20 on the front and #1d1e21 on the rear,
      a near black. Lettering on the rear is white; the front is lettered in a gold that is not drawn.
attrs:
  physical:
    weight-note: >-
      R/U product page: 3.42 kg for the SCG34 dual AC chassis; the page weighs by chassis size and power
      type, not by model
  power: {input: ac, power-input-ac: '100-240 VAC, 50-60 Hz, 1.5 A max (guide page 27)'}
  features:
    optics-sfp: >-
      SERDES 100/1000Base-X SFP modules, provided by the user (guide page 11) and supplied by Perle, Cisco
      or other makers of MSA-compliant SFPs (guide page 27: "2 SFP slots supporting SERDES 100/1000Base-X
      SFP modules")
  environmental: {operating-temp-c: 0 to 55}
chassis:
  width: 436
  height: 44
  depth: 262
  ru: 1
  color: '#1e1f21'
  power: ac
  ears:
    positions:
    - {name: flush, label: front, default: true}
gaps:
- what: g16-modules
  scope:
  - rear
  reason: needs-drawing
  wanted: a dimensioned drawing of a G16 module and a larger straight-on photograph of the rear.
  note: >-
    The 2 fitted modules are drawn as the chassis's own jacks: no document dimensions a G16 module or
    its face plate, so no module is modelled and no bay is declared where one is fitted (a bay may not
    overlap a placement). The three bays take the 16-port RS-232 RJ45, USB or multi-protocol RJ45 G16
    module in consecutive order from Bay 1 (guide pages 9 and 10); that rule is words only and no tool
    checks it.
- what: front-trim
  scope:
  - front
  reason: needs-photo
  wanted: a larger photograph of the front's left end.
  note: >-
    The page 9 photograph shows an orange trim line and diagonal gold stripes at the left of the front;
    the drawing shows the stripes as hatching. They are not drawn.
- what: rack-ears
  scope:
  - front
  - rear
  reason: vendor-silent
  wanted: the rack kit's part number and the rear brackets' size.
  note: >-
    The front ears and the side brackets are drawn from the outline drawing. The guides say only "Rack
    mount kit", and the page "front and rear mounting hardware included". No document names the kit or
    shows rear ears.
- what: inlet-projection
  scope:
  - rear
  - top
  - bottom
  reason: needs-drawing
  wanted: a rear view whose size is not the 262 mm depth, or a dimensioned drawing of the inlets.
  note: >-
    The plan view shows the two inlets standing 2.7 mm past the rear wall. The view's size is the 262
    mm envelope. The renderer paints the chassis colour over the whole view (`render.py` lines 3119 to
    3140), so a deeper plan would draw a deeper body. The schema's gap reasons (`device.schema.json` lines
    2680 to 2685) have no word for a kit limit, so `needs-drawing` stands. The projection is not drawn.
    The inlets stay on the rear face.
- what: ear-flange-plan
  scope:
  - top
  - bottom
  reason: needs-drawing
  wanted: a plan view that may be wider than the body without drawing the body that wide.
  note: >-
    The plan view shows each ear flange edge-on, about 2 mm deep, standing 22.1 beyond each end of the
    body. Unless the body is a sheet shell, the renderer paints the chassis colour over the whole of a
    view (`render.py` lines 3119 to 3140). A plan 480.2 wide would therefore draw a body that wide. The
    schema's gap reasons (`device.schema.json` lines 2680 to 2685) have no word for a kit limit, so `needs-drawing`
    stands. Both plans stay the 436 mm body and the flanges are drawn on the front only.
- what: lamps-and-labels
  scope:
  - front
  - rear
  reason: needs-photo
  wanted: a photograph of each face at a size where the lamps and labels read.
  note: >-
    The network jacks' lamps, the module lamps and every label under the front connectors are not resolved
    at the size held. The system-ready lamp is drawn dark.
- what: empty-bay-plate
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    A straight-on photograph of the rear with the third bay's face plate on, and what the plate prints.
    The bay is declared and shows nothing; the plate that closes it is not drawn.
  note: >-
    The installation guide page 10 shows the face plate removed from a bay that holds no module and says
    the bays are filled in order from Bay 1, so Bay 3 is the empty one. The 200 px product photograph
    shows a dark area there. No document dimensions the plate or shows its face.
