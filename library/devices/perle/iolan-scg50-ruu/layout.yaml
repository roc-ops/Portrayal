    - {name: flush, label: front, default: true}
gaps:
- what: g16-modules
  scope: [rear]
  reason: needs-drawing
  wanted: a dimensioned drawing of a G16 module and a larger straight-on photograph of the rear.
  note: >-
    The 3 fitted modules are drawn as the chassis's own ports. No document dimensions a G16 module or its face plate.
    So no module is modelled and no bay is declared where one is fitted, as a bay may not overlap a placement.
    The three bays take the 16-port RS-232 RJ45, USB or multi-protocol RJ45 G16 module in consecutive
    order from Bay 1 (guide pages 9 and 10). That rule is words only and no tool checks it.
- what: bay-order
  scope: [rear]
  reason: needs-photo
  wanted: a larger photograph of this model's rear.
  note: >-
    The 200 px product photograph of this model is 200 px wide. It gives colour and count only, so the bay order is
    estimated from it. RJ45 sits in bay 1 and USB in bays 2 and 3.
- what: front-trim
  scope: [front]
  reason: needs-photo
  wanted: a larger photograph of the front's left end.
  note: >-
    The page 9 photograph shows an orange trim line and diagonal gold stripes at the left of the front. The drawing
    shows the stripes as hatching. They are not drawn.
- what: rack-ears
  scope: [front, rear]
  reason: vendor-silent
  wanted: the rack kit's part number and the rear brackets' size.
  note: >-
    The front ears and the side brackets are drawn from the outline drawing. The guides say only "Rack mount
    kit", and the page "front and rear mounting hardware included". No document names the kit or shows rear ears.
- what: inlet-projection
  scope: [rear, top, bottom]
  reason: needs-drawing
  wanted: a rear view whose size is not the 262 mm depth, or a dimensioned drawing of the inlets.
  note: >-
    The plan view shows the two inlets standing 2.7 mm past the rear wall. The view's size is the 262 mm envelope.
    The renderer paints the chassis colour over the whole view (`render.py` lines 3119 to 3140), so a deeper
    plan would draw a deeper body. The schema's gap reasons (`device.schema.json` lines 2680 to 2685) have no
    word for a kit limit, so `needs-drawing` stands. The projection is not drawn. The inlets stay on the rear face.
- what: ear-flange-plan
  scope: [top, bottom]
  reason: needs-drawing
  wanted: a plan view that may be wider than the body without drawing the body that wide.
  note: >-
    The plan view shows each ear flange edge-on, about 2 mm deep, standing 22.1 beyond each end of the body. Unless
    the body is a sheet shell, the renderer paints the chassis colour over the whole of a view (`render.py` lines
    3119 to 3140). A plan 480.2 wide would therefore draw a body that wide. The schema's gap reasons
    (`device.schema.json` lines 2680 to 2685) have no word for a kit limit, so `needs-drawing` stands. Both plans
    stay the 436 mm body and the flanges are drawn on the front only.
- what: lamps-and-labels
  scope: [front, rear]
  reason: needs-photo
  wanted: a photograph of each face at a size where the lamps and labels read.
  note: >-
    The network jacks' lamps, the module lamps and every label under the front connectors are not resolved at the
    size held. The system-ready lamp is drawn dark.
- what: module-labels
  scope: [rear]
  reason: needs-photo
  wanted: a straight-on rear photograph at a size where the printed text of modules 2 and 3 reads.
  note: >-
    The page 9 photographs print a pair label above each column of every module and "DO NOT HOT SWAP" under the
    RJ45 modules. This device draws the eight pair labels of module 1 only. The pair labels of modules 2 and 3 and
    the "DO NOT HOT SWAP" and "RS232" labels are printed text and are not drawn.
- what: module-plate-colour
  scope: [rear]
  reason: needs-photo
  wanted: a calibrated photograph of the USB module's face plate.
  note: >-
    The UUU-LAWM photograph shows the USB module's plate a little lighter than the chassis rear. Its median is
    #32363e over 4320 px and the chassis rear reads #1d1e1e to #151516. The rear colour is kept and the plate
    colour is not drawn.
- what: module-white-mark
  scope: [rear]
  reason: vendor-silent
  wanted: the maker's name for the white round mark at the right end of module 3's lower edge.
  note: >-
    The UUU-LAWM photograph shows a white round mark at the right end of the lower edge of module 3. No held page
    says what it is. A drawing would invent it, so it is not drawn.
