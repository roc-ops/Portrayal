portfolio: {line: IOLAN, family: Console Server, series: IOLAN SCG R/U}
description: >-
  Perle IOLAN SCG50 RUU console server, 1U, with 16 RJ45 RS-232 ports and 32 USB 3.0 ports in
  all three of its bays. It has dual AC power and two network pairs of RJ45 and SFP. The front carries the display,
  the keypad, the power button, the ready lamp and the card slot. It also has the RJ45 and micro-USB admin ports,
  two USB 3.0 ports and the reset hole. The rear carries the network pairs at the left, the module bays and the two inlets, each with
  a rocker switch. Modelled as the dual-AC build with no cellular parts, as the R/U product page lists none.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Perle, IOLAN SCG Hardware Installation Guide, Expandable Models, 5500427-10, Sept 2021. Page 7 shows the unit, 1U.
      Page 9 has labelled front and rear photographs of an SCG50 RRU-LAWM, RRR-LAWM and UUU-LAWM.
      Page 10 covers the modules and the bays. Pages 11 to 13 cover network ports, inlets and power button.
      Page 27 gives the specifications. Page 35 is Appendix D, the mechanical drawing.
      Perle, the IOLAN SCG R/U product page (the IOLAN SCG50 RUU row: description, part
      numbers, Specifications tab). No data sheet, CAD model or stencil is held.
  size:
    confidence: drawing
    note: >-
      Guide page 35 and the fixed-model guide, 5500438-10, page 20, carry the drawing. Its labels read 436MM, 44MM and
      262MM, so the body is 436 wide, 44 high and 262 deep. The product page prints "26.4 x 43.4 x 4.4 (cm)".
      That differs by 2 mm in depth and width, and the drawing is taken because it labels its axes. Height 44 against the
      1U rack unit of 44.45 is the drawing's rounding. The drawing's front view is orthographic: 1935 px for the
      436 mm body and 194 px for the face, 4.44 px/mm across and 4.44 down.
  front-layout:
    confidence: drawing
    note: >-
      Every front position is read off the front view of the drawing on guide page 35 at 400 dpi (4.44 px/mm).
      The origin is the body's left edge, then each position is moved right by the ears. Each is checked against
      the labelled photograph on page 9. The drawing prints no
      dimension for any feature, so each is good to about 0.5 mm. The drawing also draws a SIM slot, three antenna
      connectors and a modem jack. The guide says the SIM slot and the modem apply to certain models.
      The R/U product page lists no cellular or modem feature, so none is drawn here.
  rear-layout:
    confidence: photo-measured
    note: >-
      The RJ45 module, the network cluster, the inlets, the rockers and the bays are read off the labelled rear
      photograph on guide page 9. It shows an SCG50 RRR-LAWM, 1278 px for the 436 mm body (2.93 px/mm across, 2.9 down).
      The photograph is slightly angled, so each is estimated to within about 2 mm. The jack pitch reads 14.3 mm and
      the gap between modules 2.0 mm beyond one pitch. The module bays are one module apart, 116.4 mm. The USB modules
      are read off the page 9 rear photograph of an SCG50 UUU-LAWM, a 4838 px image scaled to 2000 px wide. There 528 px
      between the starts of two neighbouring modules equal the 116.4 mm module pitch, 4.536 px/mm. Each USB figure is
      good to about 1.5 mm. The bay order is read from the 200 px product photograph of this model, which gives colour
      and count only. It shows an RJ45 module in bay 1 and USB modules in bays 2 and 3, which is also the order of the
      model name.
  serial-ports:
    confidence: datasheet
    note: >-
      Product page row: "16 x RS232 RJ45 interfaces with software configurable Cisco pinouts". Guide page 27:
      "shielded RJ45 ports". Page 9 prints each column's two numbers as "1^ 2v" above it, odd above even. The ports
      are RS-232 with software selectable Cisco pinouts (the page).
  usb-ports:
    confidence: estimated
    note: >-
      Product page row: "34 x USB 3.0 (Type-A) Console Management Ports". That count includes the two front ports,
      so the rear holds 32, 16 to a module. The photograph shows one module as two bands of 4 columns of 2 ports,
      counted twice by eye and once by a blue-pixel blob count. The column pitch is 28.0 mm and the two ports of a
      pair are 8.4 mm apart. The lower band sits half a column to the right and 20.1 mm lower. The first port is
      2.6 mm from its bay's left edge and 7.0 mm below the top edge of the rear. A USB 3.0 Type-A port is the blue
      default skin. The USB ports are counted from 1 in their own group. The maker's labels would number the first
      USB module's ports from 17 across the unit, and those labels are not drawn.
  thumbscrews:
    confidence: estimated
    note: >-
      Each fitted module carries two silver thumbscrews on its lower edge in the page 9 photographs. Each is drawn
      6 mm across. The across-size is 28 px at 4.536 px/mm. The centres are read from the UUU-LAWM photograph across
      and, down the face, as 0.90 of its height in both the UUU-LAWM and RRR-LAWM photographs. Each is good to about
      1.5 mm. The slot in a head is not drawn.
  seams:
    confidence: estimated
    note: >-
      The photographs show a thin line where one module ends and the next begins. A line is drawn in the 1.4 mm gap
      between each two bays, at the middle of the gap.
  power:
    confidence: datasheet
    note: >-
      Guide page 12: two inlets on the back, each with its own rocker switch. Guide page 27: "100-240 VAC, 50-60 Hz,
      1.5 Amps max". The page names an "IEC320-C13 to NEMA 5-15P line cord" and four other countries.
      So the inlet is a C14, inferred from the cord end, as the inlet's own type is not named. The R/U page prints 15.5 W typical and
      47-63 Hz; the guide's 50-60 Hz is the one recorded.
  network:
    confidence: datasheet
    note: >-
      Guide page 11: "two Ethernet combo pairs (RJ45 and SFP) identified as Ethernet 1 and 2"; only one port of each
      pair is active at a time. The photograph shows an SFP cage above an RJ45 on each pair, numbered 1 and 2.
  sides:
    confidence: drawing
    note: >-
      Estimated from the lower view of the drawing on guide page 35 at 600 dpi, 6.71 pixels to the
      millimetre (the 262 mm label). Each edge is good to about 0.3 mm. Both sides carry the ear bracket, six
      round holes and six slotted ovals. They also carry two rows of 32 vent slots, two more round holes and
      two ringed holes. The drawing does not say which side it shows. Its front is at the left, which is the
      right side on this library's views. So the right side is drawn as the drawing shows it, and the left is
      its mirror about the depth. The photograph of the unit on guide page 10 shows the same two vent rows in
      the middle of the side. It also shows a few small holes, in perspective. The photograph shows no bracket
      fitted, and the drawing draws one on each side in the ear's colour. The guide does not say how the
      brackets are supplied. The line colour and the hole colour are stand-ins on the body's near black.
  top-and-bottom:
    confidence: drawing
    note: >-
      Estimated from the plan view of the same drawing. A line runs the full width 10.8 mm behind the front. The
      plan is not labelled top or bottom, so both faces carry it. The plan shows the bracket leg edge-on as a line
      about 2 mm outside each body edge, from 2.2 to 96.9 behind the front. The view is the 436 body, so the leg
      is drawn as a thin line on each edge, 94.7 long. The plan also shows the ear
      flange at each end of the front, about 2 mm deep and standing outside the body. Both faces stay the 436 mm
      body, and the flanges are not drawn on them. The drawing shows no vent or hole on the plan.
  ears:
    confidence: drawing
    note: >-
      Estimated from the front view of the same drawing at 6.70 pixels to the millimetre. A flange stands 22.1
      past each end of the 436 body and is 43 high, with two slotted holes. The front is therefore 480.2 wide
      and the chassis stays 436. The drawn front positions are the body's, shifted 22.1 to the right.
  colour:
    confidence: photo-measured
    note: >-
      The median of bare plate in the page 9 photographs is #1d1e20 on the front and #1d1e21 on the rear, a near
      black. Lettering on the rear is white; the front is lettered in a gold that is not drawn.
attrs:
  physical:
    weight-note: 'R/U product page: 3.59 kg for the SCG50 dual AC chassis; the page weighs by chassis size and power type, not by model'
  power:
    input: ac
    power-input-ac: '100-240 VAC, 50-60 Hz, 1.5 A max (guide page 27)'
  features:
    optics-sfp: 'SERDES 100/1000Base-X SFP modules, provided by the user (guide page 11) and supplied by Perle, Cisco or other makers of MSA-compliant SFPs (guide page 27: "2 SFP slots supporting SERDES 100/1000Base-X SFP modules")'
  environmental:
    operating-temp-c: '0 to 55'
