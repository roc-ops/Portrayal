gaps:
- what: g16-modules
  scope: [rear]
  reason: needs-drawing
  wanted: a dimensioned drawing of a G16 module and a larger straight-on photograph of the rear.
  note: >-
    The 1 fitted module is drawn as the chassis's own jacks: no document dimensions a G16 module or
    its face plate, so no module is modelled and no bay is declared where one is fitted (a bay may not overlap a
    placement). The three bays take the 16-port RS-232 RJ45, USB or multi-protocol RJ45 G16 module in consecutive
    order from Bay 1 (guide pages 9 and 10); that rule is words only and no tool checks it.
- what: side-vents
  scope: [left, right]
  reason: needs-drawing
  wanted: the side view of guide page 35 read for its vent slots and holes, which the drawing does not dimension.
  note: >-
    The lower view of the drawing shows a field of vent slots and a pattern of screw holes, undimensioned, and the
    guide does not say which side it is. The two sides draw the envelope only.
- what: front-trim
  scope: [front]
  reason: needs-photo
  wanted: a larger photograph of the front's left end.
  note: >-
    The page 9 photograph shows an orange trim line and diagonal gold stripes at the left of the front; the drawing
    shows the stripes as hatching. They are not drawn.
- what: rack-ears
  scope: [front, rear]
  reason: vendor-silent
  wanted: the rack kit's part number, the ear positions and the rear brackets' size.
  note: >-
    The drawing shows two ears with two slots each at the front. The guides say only "Rack mount kit" and the page
    "front and rear mounting hardware included"; no document names the kit or places an ear along the depth.
- what: lamps-and-labels
  scope: [front, rear]
  reason: needs-photo
  wanted: a photograph of each face at a size where the lamps and labels read.
  note: >-
    The network jacks' lamps, the module lamps and every label under the front connectors are not resolved at the
    size held. The system-ready lamp is drawn dark.
- what: empty-bay-plate
  scope: [rear]
  reason: needs-photo
  wanted: >-
    A straight-on photograph of the rear with the second and third bays' face plates on, and what the plates
    print. The bays are declared and show nothing; the plates that close them are not drawn.
  note: >-
    The installation guide page 10 shows the face plate removed from a bay that holds no module and
    says the bays are filled in order from Bay 1, so Bays 2 and 3 are the empty ones. The 200 px product
    photograph shows a dark area there. No document dimensions the plates or shows their faces.
