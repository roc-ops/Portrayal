portfolio: {line: IOLAN, family: Console Server, series: IOLAN SCG R/U}
description: >-
  Perle IOLAN SCG18 R console server, 1U, with 16 RJ45 RS-232 serial ports in the first of its
  three G16 module bays. It has dual AC power and two network pairs of RJ45 and SFP. The front carries the display,
  the keypad, the power button, the ready lamp and the card slot. It also has the RJ45 and micro-USB admin ports,
  two USB 3.0 ports and the reset hole. The rear carries the network pairs at the left, the module bays and the two inlets, each with
  a rocker switch. Modelled as the dual-AC build with no cellular parts, as the R/U product page lists none.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Perle, IOLAN SCG Hardware Installation Guide, Expandable Models (5500427-10, Sept 2021): page 7 (the unit, 1U),
      page 9 (labelled front and rear photographs of an SCG50 RRU-LAWM, RRR-LAWM and UUU-LAWM), page 10 (modules, the
      bays), pages 11 to 13 (network ports, inlets, power button), page 27 (specifications) and page 35 (Appendix D,
      the mechanical drawing). Perle, the IOLAN SCG R/U product page (the IOLAN SCG18 R row: description, part
      numbers, Specifications tab). No data sheet, CAD model or stencil is held.
  size:
    confidence: drawing
    note: >-
      Guide page 35 (and the fixed-model guide, 5500438-10, page 20): the drawing's labels read 436MM, 44MM and
      262MM, so the body is 436 wide, 44 high and 262 deep. The product page prints "26.4 x 43.4 x 4.4 (cm)", which
      differs by 2 mm in depth and width; the drawing is taken because it labels its axes. Height 44 against the
      1U rack unit of 44.45 is the drawing's rounding. The drawing's front view is orthographic: 1935 px for the
      436 mm body and 194 px for the face, 4.44 px/mm across and 4.44 down.
  front-layout:
    confidence: drawing
    note: >-
      Every front position is read off the front view of the drawing on guide page 35 at 400 dpi (4.44 px/mm, the
      body's left edge as origin), and checked against the labelled photograph on page 9. The drawing prints no
      dimension for any feature, so each is good to about 0.5 mm. The drawing also draws a SIM slot, three antenna
      connectors and a modem jack. The guide says the SIM slot and the modem apply to certain models and the
      R/U product page lists no cellular or modem feature, so none is drawn here.
  rear-layout:
    confidence: photo-measured
    note: >-
      Every rear position is read off the labelled rear photograph of an SCG50 RRR-LAWM on guide page 9, 1278 px for
      the 436 mm body (2.93 px/mm across, 2.9 down). The photograph is slightly angled, so each position is
      estimated to within about 2 mm. The jack pitch reads 14.3 mm and the gap between modules 2.0 mm
      beyond one pitch; the registry's ganged-jack pitch of 13.97 does not fit the photograph's 24 columns.
      The two inlets, the rockers, the network cluster and the bays are placed the same way. The module bays
      are one module apart, 8 jack pitches and the 2.0 mm gap, which is 116.4 mm; the third bay is placed where the
      photograph shows it and the second is one module to its left, an estimate.
  serial-ports:
    confidence: datasheet
    note: >-
      Product page row: "16 x RS232 RJ45 interfaces" is the model's own count, the one fitted module's. Guide page 27:
      "shielded RJ45 ports". Page 9 prints each column's two numbers as "1^ 2v" above it, odd above even. The ports
      are RS-232 with software selectable Cisco pinouts (the page).
  network:
    confidence: datasheet
    note: >-
      Guide page 11: "two Ethernet combo pairs (RJ45 and SFP) identified as Ethernet 1 and 2"; only one port of each
      pair is active at a time. The photograph shows an SFP cage above an RJ45 on each pair, numbered 1 and 2.
  power:
    confidence: datasheet
    note: >-
      Guide page 12: two inlets on the back, each with its own rocker switch. Guide page 27: "100-240 VAC, 50-60 Hz,
      1.5 Amps max". The page: "IEC320-C13 to NEMA 5-15P line cord" and four other countries, so the inlet is a
      C14 (inferred from the cord end; the inlet's own type is not named). The R/U page prints 15.5 W typical and
      47-63 Hz; the guide's 50-60 Hz is the one recorded.
  colour:
    confidence: photo-measured
    note: >-
      The median of bare plate in the page 9 photographs is #1d1e20 on the front and #1d1e21 on the rear, a near
      black. Lettering on the rear is white; the front is lettered in a gold that is not drawn.
attrs:
  physical:
    weight-note: 'R/U product page: 3.25 kg for the SCG18 dual AC chassis; the page weighs by chassis size and power type, not by model'
  power:
    input: ac
    power-input-ac: '100-240 VAC, 50-60 Hz, 1.5 A max (guide page 27)'
  features:
    optics-sfp: 'SERDES 100/1000Base-X SFP modules, provided by the user (guide page 11) and supplied by Perle, Cisco or other makers of MSA-compliant SFPs (guide page 27: "2 SFP slots supporting SERDES 100/1000Base-X SFP modules")'
  environmental:
    operating-temp-c: '0 to 55'
