gaps:
- what: weight
  scope: []
  reason: sources-disagree
  note: The specification sheet 190174 p.4 prints "Weight" as 13.2 lb for the SP pair, with no word that says what it covers. The user manual
    I-00826 p.236 and p.238 print "Product Weight" as 6.84 lb (3.1 kg), one figure for every model. They print "Shipping Weight" as 9.92 and 10.58
    lb. Both manual tables are headed with the non-SP models only. The manual's product weight is used for all four.
  wanted: the maker's word on the weight.
- what: face-positions
  scope:
  - front
  - rear
  reason: needs-drawing
  note: Every position is read off line drawings at a reduced scale and is good to about 2 mm. No dimensioned drawing of the faces is held.
  wanted: a dimensioned drawing, or the 3D CAD zip once its terms allow.
- what: expansion-port
  scope:
  - rear
  reason: vendor-silent
  note: user manual I-00826 p.19 describes FEATURE (reserved) and the others but gives no row for EXPANSION.
  wanted: the maker's word on the expansion port.
- what: display-part
  scope:
  - front
  reason: needs-drawing
  note: The OLED display is drawn with the library's two-digit seven-segment part as a stand-in. That is not what the strip shows.
  wanted: an OLED display part of the strip's size.
- what: breaker-shape
  scope:
  - rear
  reason: needs-drawing
  note: The specification sheet 190174 p.2 rear elevation shows a rectangular push-to-reset breaker about 14 by 16 mm. The library's push-to-reset
    part is round, and no rectangular part of that size exists.
  wanted: a rectangular push-to-reset breaker part.
- what: cord-length
  scope:
  - rear
  reason: sources-disagree
  note: The specification sheet 190174 p.2 gives 9 ft [2.75 m] for every model. The user manual I-00826 p.237 gives 10 ft (3 m) for the SP models.
  wanted: the maker's word on the SP cord.
- what: certifications
  scope: []
  reason: sources-disagree
  note: The specification sheet 190174 p.4 prints UL 60950-1 and CSA C22.2 No.60950-1, FCC Part 15, Class B. The user manual I-00826 p.237 prints
    UL 62368, UL 1283, UL 1449, FCC Class B, ICES 7 for the SP models. The sheet's list is used.
  wanted: the maker's word on the SP certifications.
- what: ear-holes-and-tabs
  scope:
  - front
  - rear
  reason: needs-drawing
  note: 'The specification sheet 190174 p.2 shows two obround holes in each ear of its front and of its rear elevation, four in each. It shows
    two edge tabs in each elevation. All stand outside the face. The schema line for `chassis.overhang` says: "A `rack` device is drawn between
    its ear folds, and nothing could stand outside them."'
  wanted: a way to state the holes of a documented ear, and a tab that stands past the box.
- what: printed-marks
  scope:
  - front
  - rear
  reason: needs-drawing
  note: 'The sheet p.2 front elevation prints a logo, a power symbol on the button and blue rating text above the outlet. The user manual I-00826
    p.15 rear photograph prints a ground symbol, an inlet legend and legends of the outlet block and breaker. The maintainer has left marks,
    colours and the rest to a later touch.'
  wanted: the maintainer's word on whether to draw printed marks.
