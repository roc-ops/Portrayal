name: rlnk-p920r-sp
version: 0.1.0
maturity: modelled
manufacturer: Middle Atlantic
model: RLNK-P920R-SP
description: Middle Atlantic Premium+ PDU with RackLink RLNK-P920R-SP, a 1U horizontal rack PDU in black steel. It is 441 mm wide between the
  ear folds, 44 mm high and 250 mm deep. A detachable cord takes IEC C20 input at 20 A. The rear holds eight NEMA 5-20R outlets in one row, each
  switchable, with a status lamp under each. The rear also holds the network, USB, console and sensor ports. The front holds a power button, a
  touch strip with an OLED display and a ninth outlet that is not switched. Surge protection is series.
profile: power
provenance:
  method:
    confidence: estimated
    note: 'Searched: specification sheet 190174, 5 pages, all looked at at 150 dpi. Also searched: user manual I-00826, pages 15 to 20 and 234
      to 238, and quick start I-00827, all 8 printed pages. The size is printed. Every position inside it is read off the p.2 elevations at the
      scale of the printed 441 mm body. Each is good to about 2 mm. The maker''s 3D CAD zip is not opened.'
  chassis:
    confidence: datasheet
    note: 'datasheet - specification sheet 190174 p.2 prints 17.38 in [441] between the ear folds and 19.00 in [483] with the ears. It prints
      1.74 in [44] high and 9.83 in [250] deep. Page 1 says phosphate pre-treated steel with a black powder coat. The colour #2c2e30 is the library''s
      black. The p.1 photographs read nearer #2d3f42.'
  ears:
    confidence: estimated
    note: 'estimated - the rack ears are the two mounting brackets of quick start I-00827 p.4, four screws each. The sheet''s top view shows the
      flange at the front plane, so one flush position is stated. Each ear has two obround holes in the front and the rear elevation (specification
      sheet 190174 p.2), four in each view. They stand outside the 441 mm face and are not drawn (gaps: ear-holes-and-tabs). The schema line for
      `chassis.ears` is: "WHERE THE EARS ARE AND WHERE THEY CAN PUT THE FACEPLATE, for a rack device." It has no key for an ear''s holes. The generic
      ear stands in.'
  front:
    confidence: estimated
    note: 'estimated - specification sheet 190174 p.2 front elevation, counted twice at 800 and 1600 dpi. A blue-edged recess 375 by 40 mm holds
      7 rows of staggered slots, 4.7 mm apart and about 15.9 mm along. The slot tile is the library''s, so each slot is shorter than the sheet''s.
      The illuminated power button is at the left. The touch strip holds the logo, numerals 1 to 8, two arrows and the OLED display. The ninth
      outlet stands in a dark surround at the right. The user manual I-00826 p.15 and p.17 show the same face. The blue marks read #34a0ee (4293
      pixels of the sheet''s front elevation).'
  rear:
    confidence: estimated
    note: 'estimated - specification sheet 190174 p.2 rear elevation and user manual I-00826 pp.15, 19 and 20. From the left stand the inlet,
      the breaker, the ground stud and eight outlets on a 27.9 mm pitch. Each outlet has a lamp under it and a numeral 1 to 8. Then come the reset
      hole, two Ethernet jacks, two USB-A, one USB-B and four more RJ45 jacks. Four round marks sit at the corners of that port block, and one
      dark window below the reset hole. The manual p.19 says the yellow LED of ETH2 has no function, and the window is drawn dark. The two crossed
      screws either side of the inlet sit where the cord retainer''s holes are (quick start I-00827 p.5, figure D). The sheet''s screws read about 7 mm
      and the library''s head is 3.6 mm. The sheet''s lamps are rectangles about 4.0 by 2.2 mm, so they use the library''s rectangular lamp. The lit green lamp reads #1fde2e (365 pixels of the
      user manual I-00826 p.20 photograph). No held picture shows a lit red lamp.'
  port-legends:
    confidence: estimated
    note: estimated - the port legends are read off the user manual I-00826 p.19 photograph. It is 720 by 241 pixels, about 4.5 px per mm. Its
      capitals are about 11 pixels tall, so each legend is placed to about 2 mm.
  top:
    confidence: estimated
    note: estimated - the sheet's top view shows four round screw heads and one square hole at the front left. The scale is the printed 441 mm.
      A round head reads 6.5 mm and the square hole 8 mm. The depth axis is measured from the front plane, where the ear flange stands.
  end:
    confidence: estimated
    note: 'estimated - the sheet''s end view shows seven round holes: two near the rear, one at the middle and four on the front bracket. The
      scale is the printed 250 mm. The rear is at the top of that view and the device''s bottom is at its left. A round head reads 6.5 mm. The
      cord retainer''s wire loop stands behind the body there.'
  other-sides:
    confidence: estimated
    note: estimated - the bottom and the second end are built as the documented side, as no document shows this one. The documents are the sheet's
      top view and end view. The bottom repeats the top view's holes. The second end mirrors the end view's holes.
  left-out:
    confidence: estimated
    note: 'not drawn: the cord retainer clip stands below the 44 mm body (specification sheet 190174 p.2, rear and end views). The schema line
      for `chassis.overhang` says: "A `rack` device is drawn between its ear folds, and nothing could stand outside them". The clip is left out and
      only its two screws are drawn. Not drawn: the edge tabs, which stand outside the 44 mm body. The front elevation shows one above and one
      below. The rear elevation shows one above at the port block and one below under outlets 2 and 3. Not drawn: the ear holes, two in each ear
      of the front elevation and of the rear elevation, which stand outside the face. Not drawn: the printed marks. The maintainer has left marks,
      colours and the rest to a later touch. The sheet''s front elevation prints the logo on the touch strip. It is 153 by 52 px at 1600 dpi and 76 by 27 px at 800 dpi.
      The power symbol on the button is 69 by 64 px at 1600 dpi. The blue rating text above the front outlet is 153 by 24 px at
      800 dpi. The user manual I-00826 p.15 rear photograph is 911 by 83 px. It prints the ground symbol beside the stud, about 11 by 14 px. It
      prints the inlet legend with capitals about 5 px tall. It prints the legends of the outlet block and breaker with capitals about 3 px tall.
      The sheet''s rear elevation prints none of those three.'
  outlets:
    confidence: datasheet
    note: datasheet - user manual I-00826 p.234 and p.236 give 9 outlets in total, 8 controlled, type NEMA 5-20R. Each is std/nema-5-20r@1. The
      outlet rating is 16 A and the breaker 20 A (specification sheet 190174 p.2 table).
  input:
    confidence: datasheet
    note: 'datasheet - specification sheet 190174 p.2 table gives IEC C20, 20 A, 120 V, 60 Hz and a 9 ft [2.75 m] cord. The cord comes detachable
      with a retainer (quick start I-00827 p.4). The user manual I-00826 p.237 gives the SP models'' cord as 10 ft, SignalSAFE IEC to NEMA 5-20P
      (gaps: cord-length). The input current states the 16 A rated load, which the user manual I-00826 p.236 and the sheet p.4 both print as the
      continuous rating. The 20 A on the sheet''s p.2 table is the inlet and breaker rating, named as the maximum.'
  capability:
    confidence: datasheet
    note: datasheet - specification sheet 190174 p.1 gives 8 individually controllable outlets, a web server, data logging and metering. So `outlet-switching`
      is true. Per-outlet metering is not stated.
