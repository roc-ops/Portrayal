format: 1
kind: device
name: lbp-1a
version: 0.1.1
maturity: modelled
manufacturer: Middle Atlantic
model: LBP-1A
description: >-
  19 in L-shaped lacing bar, Middle Atlantic LBP-1A, no offset. A black powder-coated steel bar the full
  19 in wide, for tying cables to. It mounts to the rack rail at its two mounting points. The sheet gives
  Depth 0.5 in and Height 0.5 in and does not say which is the projection from the rail face. It is sold
  as a pack of 10; this device is one bar. The row of slots on each leg and the ear at each end are drawn
  from the maker's photograph. Their positions and sizes are estimates.
profile: passive
provenance:
  method:
    confidence: datasheet
    note: >-
      FIGURES FROM A SPECIFICATION TABLE AND ONE SMALL PHOTOGRAPH. The maker's generated cut sheet for
      LBP-1A (page 1) and its SKU page state the depth, height and width, the offset and its angle. They
      also state the style, the two mounting points and the pack of 10. The cut sheet is one embedded
      picture of the whole page, 1588 by 2094 px. The bar's photograph is a strip about 433 by 92 px in it. NO MAKER
      DOCUMENT HELD HERE HOLDS A DIMENSIONED DRAWING. The slots and ears are read from the photograph and
      every figure for them is estimated (`slots` and `ears` entries). Only the overall size is the maker's.
      The series page's weight and the environmental profile's mass belong to another reference product
      (see the `weight` gap).
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 19 in (482.6 mm) wide, 0.5 in (12.7 mm) high and 0.5 in (12.7 mm) deep. These are the
      cut sheet's Width, Height and Depth rows (page 1). The height is far under the 44.45 of the rack
      unit it takes. The cut sheet does not say which 0.5 in figure is the bar's face. The other is the
      projection from the rail face; see the `cross-section` gap. The maker's 12.7 by 12.7 is kept as
      stated. A raised plate stands out of its face, so the drawn L is 1.5 mm larger in each direction
      than the stated box.
  mount:
    confidence: estimated
    note: >-
      estimated - the cut sheet says "Mounting Points 2" and "Component Type Horizontal". The SKU page says
      to choose an offset bar by the distance from the rear of the equipment to the rack rail. The
      photograph shows a flat ear with one small hole at each end. So the bar is taken to be fixed to the
      rail at its ends. It is a `rack-face` part, as the library's other lacing bar and managers are. At what
      height inside the unit it sits, and which rack unit it spans, are not stated.
  shell:
    confidence: estimated
    note: >-
      estimated - `sheet`: the series page says steel construction and the photograph shows a thin L-section
      strip. The section is not dimensioned, so the end faces draw it at the stand-in thickness below.
      The web is the face toward the front, tall and vertical. The leg is horizontal at the top and
      runs back from the web's top edge. The maker's sheet gives 0.5 in for each and does not say which
      is which. The photograph decides it: a tall dark face toward the viewer, with the narrow leg behind
      and above it.
  thickness:
    confidence: estimated
    note: >-
      estimated - 1.5, the stand-in the library's other sheet cable managers use; no Middle Atlantic
      document states a gauge. It is the source of the gauge. Every `out` on a base plate and every rect
      size that adds the gauge restates it, and all must equal it. Nothing checks this in the kit. A test
      for this device asserts it. Nothing checks which leg is the web, the sealed corner, the ear level,
      or that each ear frame matches its painted hole.
  slots:
    confidence: estimated
    note: >-
      estimated - ten slots on the web and ten on the top leg. Both rows were counted twice on the
      photograph, by eye on 4x crops and by brightness runs. A perspective fit to the ten centres gave
      a pitch of about 41 mm and a length of 30 mm. The first centre is 57 mm from the end and the row is
      drawn centred. The scale along the bar is the ear tips spanning 482.6 mm. Good to about 3 mm.
      The slots do not show in 3D: a painted vent shows neither dark nor open on a sheet device. They are
      drawn in the 2D faces only. Opening them would mean splitting each plate into raised rects round them.
  ears:
    confidence: estimated
    note: >-
      estimated - an ear 20 mm long beyond the web at each end, a tab of the top leg 8 mm wide. Its obround
      hole is 10 by 3 mm, from 3 to 13 mm from the end. The ears read about 21 and 19 mm in the photograph and
      are drawn alike. Same perspective fit and scale along the bar as the slots. Good to about 6 mm. The ears
      continue the top leg, so the top and bottom show them; the front and rear show them edge-on, with no hole.
      In 3D each ear continues the leg beyond the web. It is a frame of four raised rects round the hole,
      with the leg's `out`, level with the leg's top face. The painted ear and hole stay in the 2D drawing.
  front:
    confidence: estimated
    note: >-
      estimated - the bar's web as 442.6 by 12.7 between the ears, with its ten slots. The slots are 3 mm
      high, 6 mm below the web's top edge. Across the bar the scale is the web's printed 12.7 mm over its
      height on the 4x crop of the photograph. That height is 50 px at x 300 (y 342 to 392) and 44.5 px at
      x 1600: 0.254 to 0.285 mm/px. The slots are painted vents; the 2D face paints a hole dark, as
      the library does everywhere. The web is a raised plate standing out 1.5 mm. It starts one gauge above
      the top edge and is one gauge taller. Without that the slabs touch only along an edge and leave a groove.
  rear:
    confidence: estimated
    note: >-
      estimated - the back of the same web. The slots pass through and the layout is symmetric along the
      bar, so it shows what the front shows. No document shows the bar from behind.
  top:
    confidence: estimated
    note: >-
      estimated - the top leg 12.7 deep between the ears, with ten slots at the web's positions, and the
      two ears with their holes. The rear edge is at the top of the drawing, as the viewer draws a top
      face. The bottom is the same plate seen from below. Across the bar the scale is the web's printed
      12.7 mm over its apparent height (0.249 mm/px at the ears, fitted from the front). The ear is 30 px
      (8 mm) and its hole 12 px (3 mm) on the 4x crop at x 90. The leg slot is a stand-in: 6 mm wide,
      6 mm from the rear edge, half the leg's 16 px depth (y 326 to 342). The leg is a raised plate
      standing out 1.5 mm. The rear, bottom and end faces carry neither `sink` nor `out`, so they build
      nothing in 3D.
  left:
    confidence: estimated
    note: >-
      estimated - the end as an L of two 1.5 mm strips, the web at the front and the leg along the top.
      The thickness is a stand-in and the sheet does not say which 0.5 in is the projection. The right is
      the same. In 3D the end shows only as the end faces of the two slabs, with no closed end cap. The
      end-on view reads as an L only if you know to look for one. It draws less than a photograph would.
  guides:
    confidence: datasheet
    note: >-
      datasheet - none. The SKU page says the bar provides "fixed tie points" and gives no count or place.
      The slots are drawn as decor, and the format has no tie point on a bar (`tie-points` gap).
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material and finish are the series page's "steel construction with black powder coat
      finish". Rectangular bars of aluminium are another style. The colour is its Color row, Black.
  color:
    confidence: estimated
    note: >-
      estimated - "Black". The photograph's 4317 dark pixels average RGB 45, 55, 58, a near-black. Dark
      pixels are those whose three channels sum under 330, counted in the bar's box. The shade drawn is
      this library's render of black, the same as its other black lacing bar and managers.
