format: 1
kind: device
name: lbp-1a
version: 0.1.0
maturity: modelled
manufacturer: Middle Atlantic
model: LBP-1A
description: >-
  19 in L-shaped lacing bar, Middle Atlantic LBP-1A, no offset. A black powder-coated steel bar the full
  19 in wide, for tying cables to. It mounts to the rack rail at its two mounting points. The sheet gives
  Depth 0.5 in and Height 0.5 in and does not say which is the projection from the rail face. It is sold
  as a pack of 10; this device is one bar. The row of slots on each leg and the ear at each end are drawn
  from the maker's photograph, and their positions and sizes are estimates.
profile: passive
provenance:
  method:
    confidence: datasheet
    note: >-
      FIGURES FROM A SPECIFICATION TABLE AND ONE SMALL PHOTOGRAPH. The maker's generated cut sheet for
      LBP-1A (page 1) and its SKU page state the depth, height and width, the offset, the offset angle, the
      style, the two mounting points and the pack of 10. The cut sheet is one embedded picture of the whole
      page, 1588 by 2094 px, and the bar's photograph is a strip about 433 by 92 px inside it. NO MAKER
      DOCUMENT HELD HERE HOLDS A DIMENSIONED DRAWING. The slots and ears are read from the photograph and
      every figure for them is estimated (`slots` and `ears` entries). Only the overall size is the maker's.
      The series page's weight and the environmental profile's mass belong to another reference product
      (see the `weight` gap).
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 19 in (482.6 mm) wide, 0.5 in (12.7 mm) high and 0.5 in (12.7 mm) deep, the cut sheet's
      Width, Height and Depth rows (page 1). The height is far under the 44.45 of the rack unit it takes.
      The cut sheet does not say which of the 0.5 in figures is the bar's face and which its projection
      from the rail face; see the `cross-section` gap.
  mount:
    confidence: estimated
    note: >-
      estimated - the cut sheet says "Mounting Points 2" and "Component Type Horizontal", and the SKU page
      says to choose an offset bar by the distance from the rear of the equipment to the rack rail. The
      photograph shows a flat ear with one small hole at each end. So the bar is taken to be fixed to the
      rail at its ends and to stand out from it: a `rack-face` part, as the library's other lacing bar and
      managers are. At what height inside the unit it sits, and which rack unit it spans, are not stated.
  shell:
    confidence: estimated
    note: >-
      estimated - `sheet`: the series page says steel construction and the photograph shows a thin L-section
      strip. The section is not dimensioned, so the end faces draw it at the stand-in thickness below.
  thickness:
    confidence: estimated
    note: >-
      estimated - 1.5, the stand-in the library's other sheet cable managers use; no Middle Atlantic
      document states a gauge.
  slots:
    confidence: estimated
    note: >-
      estimated - ten slots on the web and ten on the top leg. Both rows were counted twice on the
      photograph, by eye on 4x crops and by brightness runs along each row. Pitch 40.5 and length 30 mm.
      The web slots are 3.8 mm high and start 6 mm below the web's top edge. The leg slots are 4.5 mm
      wide and start 3 mm from its front edge. A perspective fit to the ten centres gave a pitch of about
      40.7 mm and a length of 0.735 of the pitch, scaled by the ear tips spanning 482.6 mm. Good to about 3 mm.
  ears:
    confidence: estimated
    note: >-
      estimated - an ear 20.5 mm long beyond the web at each end, a narrow tab of the top leg about 8 mm
      wide, flush with the leg's front edge. Its obround hole is 10.5 by 4 mm, from 3 to 13.5 mm from
      the end. The ears read 21.5 and 19 mm in the photograph and are drawn alike at their mean. Same
      perspective fit and scale as the slots. Good to about 6 mm.
  front:
    confidence: estimated
    note: >-
      estimated - the bar's web as 441.6 by 12.7 between the ears, with its ten slots. The ears show
      edge-on at the top as 1.5 mm strips, because they continue the top leg. The slots are drawn dark, as
      the library draws a hole; the photograph shows the white backdrop through them.
  rear:
    confidence: estimated
    note: >-
      estimated - the back of the same web. The slots pass through and the layout is symmetric along the
      bar, so it shows what the front shows. No document shows the bar from behind.
  top:
    confidence: estimated
    note: >-
      estimated - the top leg 12.7 deep between the ears, with ten slots at the web's positions, and the
      two ears with their holes. The rear edge is at the top of the drawing, as the viewer draws a top
      face. The bottom is the same plate seen from below.
  left:
    confidence: estimated
    note: >-
      estimated - the end as an L of two 1.5 mm strips, the web at the front and the leg along the top.
      The thickness is a stand-in and the sheet does not say which 0.5 in is the projection. The right is
      the same.
  guides:
    confidence: datasheet
    note: >-
      datasheet - none. The SKU page says the bar provides "fixed tie points" and gives no count or place.
      The slots are drawn as decor, and the format has no tie point on a bar (`tie-points` gap).
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material and finish are the series page's "steel construction with black powder coat
      finish" (rectangular bars of aluminium are another style); the colour is its Color row, Black.
  color:
    confidence: estimated
    note: >-
      estimated - "Black". The photograph's 4317 dark pixels average RGB 45, 55, 58, a near-black. The
      shade drawn is this library's render of black, the same as its other black lacing bar and managers.
