format: 1
kind: device
name: lbp-1a
version: 0.1.0
maturity: modelled
manufacturer: Middle Atlantic
model: LBP-1A
description: >-
  19 in L-shaped lacing bar, Middle Atlantic LBP-1A, no offset. A black powder-coated steel bar the full
  19 in wide, for tying cables to. It mounts to the rack rail at its two mounting points and stands
  0.5 in out. It is sold as a pack of 10; this device is one bar. It is drawn as the maker's overall size
  and nothing inside it, and no tie point is placed: no document gives one.
profile: passive
provenance:
  method:
    confidence: datasheet
    note: >-
      FIGURES FROM A SPECIFICATION TABLE AND ONE SMALL PHOTOGRAPH. The maker's generated cut sheet for
      LBP-1A (two pages, page 1) and its SKU page state the depth, height and width, the offset, the offset
      angle, the style, the two mounting points and the pack of 10. The cut sheet is a screenshot of the
      SKU page with one 250 px photograph of the bar. NO MAKER DOCUMENT HELD HERE HOLDS A DIMENSIONED
      DRAWING, so nothing inside the overall size is drawn: no slot, no end hole, no cut-out. Nothing was
      copied from the photograph. The series page's weight and the environmental profile's mass belong to
      another reference product (see the `weight` gap).
  chassis:
    confidence: datasheet
    note: >-
      datasheet - 19 in (482.6 mm) wide, 0.5 in (12.7 mm) high and 0.5 in (12.7 mm) deep, the cut sheet's
      Width, Height and Depth rows (page 1). The height is far under the 44.45 of the rack unit it takes.
      The cut sheet does not say which of the 0.5 in figures is the bar's face and which its projection
      from the rail face; see the `cross-section` gap.
  mount:
    confidence: estimated
    note: >-
      estimated - the cut sheet says "Mounting Points 2" and "Component Type Horizontal", and the SKU page
      says to choose an offset bar by the distance from the rear of the equipment to the rack rail. The
      photograph shows a flat ear with one small hole at each end. So the bar bolts to the rail face and
      stands out from it: a `rack-face` part, as the library's other lacing bar and managers are. At what
      height inside the unit it sits, and which rack unit it spans, are not stated.
  shell:
    confidence: estimated
    note: >-
      estimated - `sheet`: the series page says steel construction and the photograph shows a thin L-section
      strip. The section of the bar is not dimensioned, so each face below is a plain outline of the overall
      size.
  thickness:
    confidence: estimated
    note: >-
      estimated - 1.5, the stand-in the library's other sheet cable managers use; no Middle Atlantic
      document states a gauge.
  front:
    confidence: datasheet
    note: >-
      datasheet - the bar's face as a plain 482.6 by 12.7 strip, the overall width and height. The photograph
      shows a row of long slots along the bar and a hole in each end ear; their size, number and place are
      not stated and they are not drawn (`tie-points` and `end-holes` gaps).
  rear:
    confidence: datasheet
    note: >-
      datasheet - the back of the same strip, plain. No Middle Atlantic document shows the bar from behind.
  top:
    confidence: datasheet
    note: >-
      datasheet - the overall 482.6 by 12.7 depth as one outline. This is the envelope, not a measured
      section (`cross-section` gap). The bottom is the same.
  left:
    confidence: datasheet
    note: >-
      datasheet - the end of the bar as the 12.7 by 12.7 overall size, an outline and not a measured
      section. The right is the same.
  guides:
    confidence: datasheet
    note: >-
      datasheet - none. The SKU page says the bar provides "fixed tie points" and gives no count or place.
      The format has no tie point on a bar, and none is placed (`tie-points` gap).
  attrs:
    confidence: datasheet
    note: >-
      datasheet - the material and finish are the series page's "steel construction with black powder coat
      finish" (rectangular bars of aluminium are another style); the colour is its Color row, Black.
  color:
    confidence: estimated
    note: >-
      estimated - "Black". The photograph shows a black bar, so the shade is this library's render of
      black, the same as its other black lacing bar and managers.
