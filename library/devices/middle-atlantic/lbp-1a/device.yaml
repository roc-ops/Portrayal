gaps:
  - what: tie-points
    scope: [front, top, bottom]
    reason: vendor-silent
    note: >-
      the cut sheet and the SKU page say the bar provides fixed tie points and give no slot, count or
      place along it. The slots drawn are estimates read from a small photograph. A dimensioned drawing
      would settle them. No cable is told which slot to use.
    wanted: a Middle Atlantic dimensioned drawing that marks the slots a cable is tied to
  - what: end-holes
    scope: [top, bottom]
    reason: vendor-silent
    note: >-
      the cut sheet gives "Mounting Points 2" and neither the size nor the place of the holes. The ear
      holes drawn are estimates read from a small photograph. A dimensioned drawing would settle them, with
      the hole pattern against the rack unit.
    wanted: a dimensioned drawing of the bar
  - what: cross-section
    scope: [top, bottom, left, right]
    reason: vendor-silent
    note: >-
      the cut sheet gives 0.5 in for the height and 0.5 in for the depth of an L-shaped bar and does not
      say which is the face and which the leg, nor the sheet gauge. The L drawn at each end uses a
      stand-in thickness and the photograph's reading of which side is which. The kit builds no solid L.
    wanted: a dimensioned drawing, or an end-on photograph, of the bar
  - what: height-in-unit
    scope: [front]
    reason: vendor-silent
    note: >-
      the bar is 12.7 high and takes one 44.45 rack unit in this model, which is an estimate; no document
      says where in the unit it sits or whether the ears span more than one.
    wanted: a drawing of the bar fitted to a rail
  - what: weight
    scope: [front]
    reason: vendor-silent
    note: >-
      no document gives the weight of one LBP-1A or of its pack of 10. The series page lists 2.5 lb for the
      whole series, and the environmental profile gives 2510 g with packaging for a different reference
      product, so neither is this bar's.
    wanted: a Middle Atlantic specification that gives the weight of LBP-1A
  - what: mounting-hardware
    scope: [front]
    reason: vendor-silent
    note: >-
      the documents held here say nothing of screws or other fixings for the two mounting points.
    wanted: the part's installation sheet or parts list
