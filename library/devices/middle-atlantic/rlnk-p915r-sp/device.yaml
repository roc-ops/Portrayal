gaps:
- what: weight
  scope: []
  reason: sources-disagree
  note: The specification sheet 190174 p.4 prints "Weight" as 13.2 lb for the SP pair, with no word that says what it covers. The user manual
    I-00826 p.236 and p.238 print "Product Weight" as 6.84 lb (3.1 kg), one figure for every model. They print "Shipping Weight" as 9.92 and 10.58
    lb. Both manual tables are headed with the non-SP models only. The manual's product weight is used for all four.
  wanted: the maker's word on the weight.
- what: face-positions
  scope:
  - front
  - rear
  reason: needs-drawing
  note: Every position is read off line drawings at a reduced scale and is good to about 2 mm. No dimensioned drawing of the faces is held.
  wanted: a dimensioned drawing, or the 3D CAD zip once its terms allow.
- what: expansion-port
  scope:
  - rear
  reason: vendor-silent
  note: user manual I-00826 p.19 describes FEATURE (reserved) and the others but gives no row for EXPANSION.
  wanted: the maker's word on the expansion port.
- what: display-part
  scope:
  - front
  reason: needs-drawing
  note: The OLED display is drawn with the library's two-digit seven-segment part as a stand-in. That is not what the strip shows.
  wanted: an OLED display part of the strip's size.
- what: breaker-shape
  scope:
  - rear
  reason: needs-drawing
  note: The specification sheet 190174 p.2 rear elevation shows a rectangular push-to-reset breaker about 14 by 16 mm. The library's push-to-reset
    part is round, and no rectangular part of that size exists.
  wanted: a rectangular push-to-reset breaker part.
- what: cord-length
  scope:
  - rear
  reason: sources-disagree
  note: The specification sheet 190174 p.2 gives 9 ft [2.75 m] for every model. The user manual I-00826 p.237 gives 10 ft (3 m) for the SP models.
  wanted: the maker's word on the SP cord.
- what: input-current
  scope: []
  reason: sources-disagree
  note: 'The specification sheet 190174 p.4 prints "Full Load Input Current at V AC" as 15 A, and "Output Contentious Current" as 12 A. The user
    manual I-00826 p.236 prints "Maximum Peak Load" as 15 A and "Rated Load" as 12 A. The schema defines `input-current-a` as the derated rated
    current, so 12 A is stored. The sheet''s p.2 table prints 15 A for the inlet and the breaker.'
  wanted: the maker's word on what the sheet's full load input current means.
- what: certifications
  scope: []
  reason: sources-disagree
  note: The specification sheet 190174 p.4 prints UL 60950-1 and CSA C22.2 No.60950-1, FCC Part 15, Class B. The user manual I-00826 p.237 prints
    UL 62368, UL 1283, UL 1449, FCC Class B, ICES 7 for the SP models. The sheet's list is used.
  wanted: the maker's word on the SP certifications.
- what: ear-holes-and-tabs
  scope:
  - front
  - rear
  reason: needs-drawing
  note: 'The specification sheet 190174 p.2 shows two obround holes in each ear of its front and of its rear elevation. Each hole is 9.5 by 6.35
    mm, four in each elevation. It shows two edge tabs in each elevation. The four mounting-ear holes on each of the front and rear are not drawn.
    The holes stand outside the 441 mm face, and decor there is never seen (L44). A part placed there is refused (L150). The schema line for
    `chassis.overhang` says: "Such a device draws its front at the rack-face width with the ears drawn". Two trials drew the front and rear 483 mm
    wide, the width the sheet prints over the ears. Each moved every part 21 mm to the right. Drawn as plain holes beyond the face, the holes
    drop the capability level from 4 to 2, because the face and body widths then disagree: "chassis width disagrees: front.w=483, rear.w=483,
    top.w=441, bottom.w=441, chassis.width=441". Lint passed, with L43 warnings that want a part seated within 25 mm of an end. Drawn as
    cutouts in the ears at the sheet''s 483 mm width, the level stays 4. But the library lint adds many warnings for ports, lamps and buttons
    without cutouts: 27 new L39 warnings for each device, and over the four devices 108 of L39 and 8 of L53. The maintainer has left the ear
    holes undrawn, so the faces stay at the 441 mm body width. The tabs stand past the 44 mm height, which `overhang` does not cover.'
  wanted: 'Question for the maintainer: may a tab that stands past the 44 mm height be drawn?'
- what: printed-marks
  scope:
  - front
  - rear
  reason: needs-drawing
  note: 'The sheet p.2 front elevation prints a power symbol on the button and blue rating text above the outlet. The place of the logo is the region logo-zone. The user manual I-00826
    p.15 rear photograph prints a ground symbol, an inlet legend and legends of the outlet block and breaker. The maintainer has left marks,
    colours and the rest to a later touch.'
  wanted: the maintainer's word on whether to draw printed marks.
