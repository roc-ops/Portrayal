name: rlnk-p915r-sp
version: 0.1.0
maturity: modelled
manufacturer: Middle Atlantic
model: RLNK-P915R-SP
description: Middle Atlantic Premium+ PDU with RackLink RLNK-P915R-SP, a 1U horizontal rack PDU in black steel. It is 441 mm wide between the
  ear folds, 44 mm high and 250 mm deep. A detachable cord takes IEC C14 input at 15 A. The rear holds eight NEMA 5-15R outlets in one row, each
  switchable, with a status lamp under each. The rear also holds the network, USB, console and sensor ports. The front holds a power button, a
  touch strip with an OLED display and a ninth outlet that is not switched. Surge protection is series.
profile: power
provenance:
  method:
    confidence: estimated
    note: 'Searched: specification sheet 190174, 5 pages, all looked at at 150 dpi. Also searched: user manual I-00826, pages 15 to 20 and 234
      to 238, and quick start I-00827, all 8 printed pages. The size is printed. Every position inside it is read off the p.2 elevations at the
      scale of the printed 441 mm body. Each is good to about 2 mm. The maker''s 3D CAD zip is not opened.'
  chassis:
    confidence: datasheet
    note: 'datasheet - specification sheet 190174 p.2 prints 17.38 in [441] between the ear folds and 19.00 in [483] with the ears. It prints
      1.74 in [44] high and 9.83 in [250] deep. Page 1 says phosphate pre-treated steel with a black powder coat. The colour #2c2e30 is the library''s
      black. The p.1 photographs read nearer #2d3f42.'
  ears:
    confidence: estimated
    note: 'estimated - the rack ears are the two mounting brackets of quick start I-00827 p.4, four screws each. The sheet''s top view shows the
      flange at the front plane, so one flush position is stated. Each ear has two obround holes of 9.5 by 6.35 mm in the front and the rear elevation
      (specification sheet 190174 p.2). That is four in each view. The sheet prints 19.00 in [483] over the ears and 17.38 in [441] between the
      folds, so each ear reaches 21 mm. The holes are not drawn (gaps: ear-holes-and-tabs). The generic ear stands in.'
  front:
    confidence: estimated
    note: 'estimated - specification sheet 190174 p.2 front elevation, counted twice at 800 and 1600 dpi. A blue-edged recess 375 by 40 mm holds
      7 rows of staggered slots, 4.7 mm apart and about 15.9 mm along. The slot tile is the library''s, so each slot is shorter than the sheet''s.
      The illuminated power button is at the left. The touch strip holds the logo, numerals 1 to 8, two arrows and the OLED display. The ninth
      outlet stands in a dark surround at the right. The user manual I-00826 p.15 and p.17 show the same face. The blue marks read #34a0ee (4293
      pixels of the sheet''s front elevation).'
  rear:
    confidence: estimated
    note: 'estimated - specification sheet 190174 p.2 rear elevation and user manual I-00826 pp.15, 19 and 20. From the left stand the inlet,
      the breaker, the ground stud and eight outlets on a 27.9 mm pitch. Each outlet has a lamp under it and a numeral 1 to 8. Then come the reset
      hole, two Ethernet jacks, two USB-A, one USB-B and four more RJ45 jacks. Four round marks sit at the corners of that port block, and one
      dark window below the reset hole. The manual p.19 says the yellow LED of ETH2 has no function, and the window is drawn dark. The two crossed
      screws either side of the inlet sit where the cord retainer''s holes are (quick start I-00827 p.5, figure D). The sheet''s screws read about 7 mm
      and the library''s head is 3.6 mm. The sheet''s lamps are rectangles 3.5 by 2.5 mm, so they use the library''s rectangular lamp. The lit green lamp reads #1fde2e (365 pixels of the
      user manual I-00826 p.20 photograph). No held picture shows a lit red lamp.'
  port-legends:
    confidence: estimated
    note: estimated - the port legends are read off the user manual I-00826 p.19 photograph. It is 720 by 241 pixels, about 4.5 px per mm. Its
      capitals are about 11 pixels tall, so each legend is placed to about 2 mm.
  top:
    confidence: estimated
    note: estimated - the sheet's top view shows four round screw heads and one square at the front left. That square is the upper edge tab seen from
      above. The scale is the printed 441 mm. A round head reads 6.5 mm and the square 8 mm. The depth axis runs from the rear, so y 0 is the rear
      edge of the printed 250 mm. The view also shows the eight outlet tops, three outlines of the breaker and inlet, and the front flange. They are
      drawn as outlines, placed from the four screw heads.
  end:
    confidence: estimated
    note: 'estimated - the sheet shows two end views. Each has seven round holes, two near the rear, one at the middle and four on the front
      bracket plate. The upper one is turned a quarter turn, with the rear at its top and the device''s bottom at its left. It is read as the left
      side, as a third-angle sheet places it beside the top view. The lower one, beside the rear elevation, is read as the right side. The scale is
      the printed 250 mm. A left view runs its depth from the rear and a right view from the front. A round head reads 6.5 mm. The left view also
      shows the inlet housing and the rear plate. The right view shows the bracket plate, the rear plate and four thin pieces. They are drawn as outlines.'
  other-sides:
    confidence: estimated
    note: estimated - the bottom is built from the sheet's top view, as no document shows this side. A bottom view mirrors left and right, so its
      outlines are turned across. The four screw heads repeat the top view's, as their pattern is symmetric to within 1 mm. The square stands at
      the lower edge tab of the front elevation, about 314 mm from the left.
  left-out:
    confidence: estimated
    note: 'not drawn: the cord retainer clip stands below the 44 mm body (specification sheet 190174 p.2, front, rear and end views). Only its two
      screws are drawn. The wire loop in the top and end views stands up to 13.6 mm behind the view''s rear edge, beyond the printed 250 mm depth.
      The schema line for `chassis.overhang` says: "`left` and `right` are as seen from the front." It has no key above or below
      the face. Not drawn: the edge tabs, which stand outside the 44 mm body. The front elevation shows one above about 54 mm from the left and one
      below about 314 mm from the left. The rear elevation shows one above at the port block and one below under outlet 2. Not drawn: the ear
      holes, two in each ear of both elevations, which stand outside the 441 mm face (gaps: ear-holes-and-tabs).
      Not drawn: the fine pieces at the rear edge of the top and end views, 0.2 to 3.5 mm, under 1.3 pt on the sheet.
      Not drawn: the printed marks. The maintainer has left marks,
      colours and the rest to a later touch. The sheet''s front elevation prints the logo on the touch strip. It is 153 by 52 px at 1600 dpi and 76 by 27 px at 800 dpi. Its place is the region logo-zone, which reserves the box and draws no mark.
      The power symbol on the button is 69 by 64 px at 1600 dpi. The blue rating text above the front outlet is 153 by 24 px at
      800 dpi. The user manual I-00826 p.15 rear photograph is 911 by 83 px. It prints the ground symbol beside the stud, about 11 by 14 px. It
      prints the inlet legend with capitals about 5 px tall. It prints the legends of the outlet block and breaker with capitals about 3 px tall.
      The sheet''s rear elevation prints none of those three.'
  outlets:
    confidence: datasheet
    note: datasheet - user manual I-00826 p.234 and p.236 give 9 outlets in total, 8 controlled, type NEMA 5-15R. Each is std/nema-5-15r@1. The
      outlet rating is 12 A and the breaker 15 A (specification sheet 190174 p.2 table).
  input:
    confidence: datasheet
    note: 'datasheet - specification sheet 190174 p.2 table gives IEC C14, 15 A, 120 V, 60 Hz and a 9 ft [2.75 m] cord. The cord comes detachable
      with a retainer (quick start I-00827 p.4). The user manual I-00826 p.237 gives the SP models'' cord as 10 ft, SignalSAFE IEC to NEMA 5-15P
      (gaps: cord-length). The input current states the 12 A rated load, as the schema defines it: derated. The sheet''s p.4 "Full Load Input Current"
      prints 15 A (gaps: input-current).'
  capability:
    confidence: datasheet
    note: datasheet - specification sheet 190174 p.1 gives 8 individually controllable outlets, a web server, data logging and metering. So `outlet-switching`
      is true. Per-outlet metering is not stated.
