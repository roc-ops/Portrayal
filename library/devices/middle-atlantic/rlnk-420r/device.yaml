      default: true
      label: ears at the front plane (specification sheet 96-01237 p.4)
gaps:
- what: weight
  scope: []
  reason: vendor-silent
  note: The specification sheet 96-01237 pp.2 to 4, rendered and read, print no weight. The user manual I-00768 text layer has none either.
  wanted: the maker's product weight.
- what: face-positions
  scope:
  - front
  - rear
  reason: needs-drawing
  note: Every position is read off line drawings at a reduced scale and is good to about 2 mm. The specification sheet 96-01237 p.4 is the only dimensioned
    drawing held.
  wanted: a dimensioned drawing, or the 3D CAD zip once its terms allow.
- what: ground-stud-position
  scope:
  - rear
  reason: sources-disagree
  note: The sheet p.4 rear elevation and the p.1 photograph of the RLNK-415R rear put the ground stud left of the inlet. The user manual I-00768 p.47 figure
    and the p.1 photograph of the RLNK-420R rear put it at the right, beside the Ethernet jack. The sheet is followed.
  wanted: the maker's word on where the ground stud stands.
- what: outlet-type-name
  scope:
  - front
  - rear
  reason: vendor-silent
  note: No held page prints a NEMA name for the outlets. The user manual I-00768 p.46 and p.47 figures label them 15A Outlet and 20A Outlet and draw a T
    slot on the 20 A face.
  wanted: the maker's printed outlet configuration.
- what: breaker-rating
  scope:
  - front
  reason: vendor-silent
  note: The specification sheet 96-01237 and the user manual I-00768 name an integrated power switch and circuit breaker and give no breaker rating. The
    rocker switch part is used for it.
  wanted: the breaker's rating.
- what: ear-holes
  scope:
  - front
  - rear
  reason: needs-drawing
  note: The specification sheet 96-01237 p.4 shows two obround holes in each ear of its front and of its rear elevation. They stand outside the 222.5 mm
    face and are not drawn, as on the Premium+ pair.
  wanted: the maintainer's word on drawing the ears at 264.2 mm.
- what: cord-clip-past-depth
  scope:
  - top
  - left
  - right
  reason: needs-drawing
  note: The specification sheet 96-01237 p.4 top and end views show the retainer's wire loop up to 20 mm behind the printed 245.7 mm depth. The user manual
    I-00768 p.46 front figure draws the loop below the front face. The kit has no key for a part past the box.
  wanted: the maintainer's word on a part that stands past the box.
- what: lamp-colours
  scope:
  - front
  reason: vendor-silent
  note: The user manual I-00768 p.46 item B and p.47 item C name the lit colours in words only. Quick start I-00785 p.2 (printed page 7) does the same.
    The hex values are the library's, as on the full-width pair. The quick start's blinking green and red state is not drawn as a state.
  wanted: a photograph of a lit unit.
- what: front-outlet-role
  scope:
  - front
  reason: sources-disagree
  note: The sheet p.4 front elevation calls the front outlet a convenience outlet. The user manual I-00768 p.46 item A calls it a controlled outlet, the
    plate prints CONTROLLED, and the sheet p.3 counts 4 of 4 controlled. The manual and the sheet's count are followed.
  wanted: the maker's word on whether the front outlet is switched by RackLink.
- what: outlet-numbering
  scope:
  - rear
  reason: sources-disagree
  note: The sheet p.4 rear elevation prints 1, 2 and 3 under the rear outlets. The user manual I-00768 p.47 figure prints 2, 3 and 4, with 1 on the front
    outlet. The manual is followed, as the front has four lamps.
  wanted: the maker's word on the numbering.
- what: half-rack-mounting
  scope: []
  reason: vendor-silent
  note: Quick start I-00785 printed page 3 lists a vertical bracket and screws for the half-rack models. No held page says how the unit sits in a rack or
    beside a second unit.
  wanted: the maker's half-rack mounting instruction.
