format: 1
kind: device
name: rlnk-420r
version: 0.1.0
maturity: modelled
manufacturer: Middle Atlantic
model: RLNK-420R
description: Middle Atlantic Select Series PDU with RackLink RLNK-420R, a 1U half-width rack PDU in black steel. It is 222.5 mm wide between the ear folds,
  44.1 mm high and 245.7 mm deep. A detachable cord takes IEC C20 input at 20 A. The rear holds three controlled outlets in one row, an Ethernet jack and
  a reset button. The front holds a controlled outlet, an alert lamp, four outlet lamps and a power switch with circuit breaker. Surge protection is MOV.
profile: power
provenance:
  method:
    confidence: estimated
    note: 'Searched: specification sheet 96-01237 pp.1 to 5, p.4 at 300, 600 and 800 dpi. Also searched: user manual I-00768 pp.46 and 47 and quick start
      I-00785. The size is printed. Every position inside it is read off the p.4 elevations at the scale of the printed 222.5 mm body. The maker''s 3D CAD
      zip is not opened.'
  chassis:
    confidence: datasheet
    note: 'datasheet - specification sheet 96-01237 p.4 prints 8.76 in [222.5] for the body and 10.40 in [264.2] over the ears. It prints 1.73 in [44.1]
      high and 9.67 in [245.7] deep. P.2 says phosphate pre-treated steel with a black powder coat. The colour #2c2e30 is the library''s black.'
  ears:
    confidence: estimated
    note: 'estimated - the generic ear stands in. The sheet p.4 shows each ear with two obround holes in both elevations. The ear reaches 20.85 mm beyond
      the 222.5 mm body. The holes are not drawn (gaps: ear-holes).'
  front:
    confidence: estimated
    note: estimated - sheet p.4 front elevation at 800 dpi, scale 5.67 px/mm. From the left stand the controlled outlet in its plate, a label panel and
      the power switch in a guard. The panel carries the ALERT lamp and four numbered lamps. The p.1 photograph of the RLNK-415R shows the plate and the
      outlet face light grey, and the library's outlet part is dark.
  rear:
    confidence: estimated
    note: estimated - sheet p.4 rear elevation at 800 dpi, scale 5.67 px/mm, and user manual I-00768 p.47. From the left stand the inlet with a cord retainer,
      three outlets on a 35.4 mm pitch, the reset button and the Ethernet jack. The retainer's two screws sit where the sheet draws two circles beside the
      inlet.
  top:
    confidence: estimated
    note: estimated - sheet p.4 top view at 600 dpi, scale 4.297 px/mm, depth from the rear. It shows one round screw head and three outlet tops behind
      the rear band. It shows a clip foot and a thumbscrew at the right, and five lamp edges at the front. The p.1 photograph shows two labels on the lid.
  end:
    confidence: estimated
    note: estimated - the sheet shows two end views. The one left of the top view runs from the rear and is read as the left side. The one beside the rear
      elevation is read as the right side, turned across. Each shows a bracket plate with screws, a top rail, a switch toe and a thumbscrew.
  other-sides:
    confidence: estimated
    note: estimated - built as the top view turned across, as no document shows the bottom. A bottom view mirrors left and right. The lid labels are not
      repeated.
  legends:
    confidence: estimated
    note: estimated - the printed legends are read off the sheet p.4 elevations and the p.1 photographs at 400 dpi. The rear legend over the inlet reads
      120V 16A 60Hz on the photograph of the RLNK-420R. The front legend reads CONTROLLED. The wording over the third outlet is not legible, so two ink
      bars stand for its two lines.
  top-labels:
    confidence: estimated
    note: estimated - the p.1 photographs of the RLNK-420R show a plain lid. The two labels follow the RLNK-415R photograph, as no document shows this lid
      with labels.
  left-out:
    confidence: estimated
    note: 'not drawn: the ear holes, two in each ear of both elevations (gaps: ear-holes). Not drawn: the cord retainer''s wire loop behind the printed
      depth (gaps: cord-clip-past-depth). Not drawn: the amber and green lamps of the Ethernet jack, which the jack part carries.'
  outlets:
    confidence: datasheet
    note: 'datasheet - sheet p.3 gives 4 total outlets, 4 controlled. The type is read from the user manual I-00768 p.46 and p.47 figures (gaps: outlet-type-name).
      Each is nema-5-20r@1.'
  input:
    confidence: datasheet
    note: 'datasheet - sheet p.3 gives a 9 ft IEC cord at 20 A. The user manual I-00768 p.47 names the IEC C20 power input with a cord retainer. The input
      current states the 16 A rated load, as the schema defines it: derated. The sheet prints 20 A as the maximum peak load.'
  capability:
    confidence: datasheet
    note: datasheet - sheet p.3 gives 4 total outlets, all 4 controlled. So `outlet-switching` is true.
