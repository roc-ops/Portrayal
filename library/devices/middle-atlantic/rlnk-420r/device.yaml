  physical:
    construction: metal
  power:
    input-ac: 120 V, 16 A rated (20 A maximum), 60 Hz
    input-cord: detachable
    input-voltage-v: 120
    input-current-a: 16
    output-voltage: 120 V
    frequency: 60 Hz
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    humidity: 0 to 95 %, non-condensing
  management:
    metering-scope: none
    outlet-switching: true
    network-interface: one Ethernet 10/100, integrated web server
    outlet-count: 4
  compliance:
    certifications: cETLus UL 62368-1, CSA C22.2 No. 62368-1, FCC Part 15 Class B
chassis:
  width: 222.5
  height: 44.1
  depth: 245.7
  ru: 1
  color: '#2c2e30'
  airflow: passive
