format: 1
kind: device
name: rlnk-915r
version: 0.1.0
maturity: modelled
manufacturer: Middle Atlantic
model: RLNK-915R
description: Middle Atlantic Select Series PDU with RackLink RLNK-915R, a 1U horizontal rack PDU in black steel. It is 441 mm wide between the ear folds,
  44.1 mm high and 245.7 mm deep. A detachable cord takes IEC C14 input at 15 A. The rear holds eight controlled outlets in one row, an Ethernet jack and
  a reset button. The front holds a convenience outlet that is not controlled, an alert lamp, eight outlet lamps and a power switch with circuit breaker.
  Surge protection is MOV.
profile: power
provenance:
  method:
    confidence: estimated
    note: 'Searched: specification sheet 96-01237 pp.1 to 5, all looked at at 100 dpi, p.5 also at 400 and 800 dpi. Also searched: user manual I-00768 pp.46
      to 49 and quick start I-00785, brochure 230451 p.10. The size is printed. Every position inside it is read off the p.5 elevations at the scale of
      the printed 483 mm over the ears. The maker''s 3D CAD zip is not opened.'
  chassis:
    confidence: datasheet
    note: 'datasheet - specification sheet 96-01237 p.5 prints 17.36 in [441] for the body and 19.00 in [482.6] over the ears. It prints 1.74 in [44.1]
      high and 9.67 in [245.7] deep. P.2 says phosphate pre-treated steel with a black powder coat. The colour #2c2e30 is the library''s black. The brochure
      photograph reads #081619 over 81 pixels.'
  ears:
    confidence: estimated
    note: 'estimated - the generic ear stands in. The specification sheet 96-01237 p.5 shows each ear with two obround holes in both elevations. The ear
      reaches 20.8 mm beyond the 441 mm body. The holes are not drawn (gaps: ear-holes).'
  front:
    confidence: estimated
    note: 'estimated - specification sheet 96-01237 p.5 front elevation at 800 dpi, scale 4.01 px/mm. From the left stand the convenience outlet, a label
      panel with the ALERT lamp and eight numbered lamps, and the power switch in a guard. The panel reads #d1d6dc over 81 pixels of the brochure photograph
      and the switch rocker #630e1a over 81 pixels. The photograph shows the outlet face light grey and the library''s outlet part is dark. The sheet and
      the manual draw a bar across the switch with a screw at each end, drawn here as a plain bar. The RLNK-920R photograph prints 16 A above its front
      outlet.'
  rear:
    confidence: estimated
    note: estimated - specification sheet 96-01237 p.5 rear elevation at 800 dpi, scale 3.835 px/mm, and user manual I-00768 p.49. From the left stand the
      inlet with a cord retainer, eight outlets on a 40.7 mm pitch, the reset button and the Ethernet jack. The retainer's two screws sit where the sheet
      draws two circles beside the inlet. The sheet's circles read about 7 mm and the library's head is 3.6 mm.
  top:
    confidence: estimated
    note: estimated - the sheet's top view at 400 dpi, scale 2.168 px/mm, depth from the rear. It shows two round screw heads and eight outlet tops behind
      the rear band. It shows a clip foot and a thumbscrew at the right, and nine lamp edges at the front. All are outlines or marks.
  end:
    confidence: estimated
    note: estimated - the sheet shows two end views. The one beside the rear elevation runs from the front and is read as the right side. The one left of
      the top view is the same drawing from the rear and is read as the left side. Each shows a bracket plate with two holes and one screw, a top rail,
      a switch toe and a thumbscrew. The depth positions of the two views agree to 1 mm when one is turned.
  other-sides:
    confidence: estimated
    note: estimated - built as the top view turned across, as no document shows the bottom. A bottom view mirrors left and right. The two screw heads repeat
      the top view's, as their pattern is symmetric to within 1 mm.
  legends:
    confidence: estimated
    note: estimated - the printed legends are read off the specification sheet 96-01237 p.1 photographs at 400 and 600 dpi. The scale is about 3 px per
      mm, so each is placed to about 2 mm. The RLNK-915R rear photograph reads the inlet legend 120V 12A 60Hz, the model name and the maker's name. The
      RLNK-920R photographs on the same page read 120V~16A 60Hz at the inlet and the front outlet, and its model name. They are set in the same places.
  top-labels:
    confidence: estimated
    note: 'estimated - the p.1 oblique photograph of the RLNK-915R shows three top labels: two dark-printed at the left and one bright at the right. Their
      place is read from the photograph''s perspective and is good to about 25 mm. Their sizes are estimated at about 90 by 30 mm each. The wording is not
      legible, and the bottom is not shown. The RLNK-920R photographs show a plain lid, so its labels follow the RLNK-915R.'
  left-out:
    confidence: estimated
    note: 'not drawn: the ear holes, two in each ear of both elevations (gaps: ear-holes). Not drawn: the cord retainer''s wire loop behind the printed
      depth and below the front face in the manual''s figure (gaps: cord-clip-past-depth). Not drawn: the second ground ring the user manual I-00768 p.49
      figure draws at the right (gaps: ground-stud-position). Not drawn: the amber and green lamps of the Ethernet jack, which the jack part carries.'
  outlets:
    confidence: datasheet
    note: 'datasheet - specification sheet 96-01237 p.3 gives 9 total outlets, 8 controlled. The type is read from the user manual I-00768 p.48 and p.49
      figures (gaps: outlet-type-name). Each is nema-5-15r@1.'
  input:
    confidence: datasheet
    note: 'datasheet - specification sheet 96-01237 p.3 gives a 9 ft IEC cord at 15 A. The user manual I-00768 p.49 names the IEC C14 power input with a
      cord retainer. The input current states the 12 A rated load, as the schema defines it: derated. The sheet prints 15 A as the maximum peak load.'
  capability:
    confidence: datasheet
    note: datasheet - specification sheet 96-01237 p.2 gives individual IP control of eight outlets, sequencing and an integrated web server. So `outlet-switching`
      is true.
