    input-voltage-v: 120
    input-current-a: 12
    output-voltage: 120 V
    frequency: 60 Hz
  environmental:
    operating-temp: 0 to 40 C (32 to 104 F)
    humidity: 0 to 95 %, non-condensing
  management:
    metering-scope: none
    outlet-switching: true
    network-interface: one Ethernet 10/100, integrated web server
    outlet-count: 9
  compliance:
    certifications: cETLus UL 62368-1, CSA C22.2 No. 62368-1, FCC Part 15 Class B
chassis:
  width: 441
  height: 44.1
  depth: 245.7
  ru: 1
  color: '#2c2e30'
  airflow: passive
  ears:
    color: '#2c2e30'
    positions:
    - name: flush
      at: 0
      default: true
      label: ears at the front plane (specification sheet 96-01237 p.5)
gaps:
- what: weight
  scope: []
  reason: vendor-silent
  note: The specification sheet 96-01237 pp.3 to 5, rendered and read, print no weight. The user manual I-00768 text layer has none either.
  wanted: the maker's product weight.
- what: face-positions
  scope:
  - front
  - rear
  reason: needs-drawing
  note: Every position is read off line drawings at a reduced scale and is good to about 2 mm. specification sheet 96-01237 p.5 is the only dimensioned
    drawing held.
  wanted: a dimensioned drawing, or the 3D CAD zip once its terms allow.
- what: ground-stud-position
  scope:
  - rear
  reason: sources-disagree
  note: The specification sheet 96-01237 p.5 rear elevation and the p.1 photograph of the RLNK-915R rear put the ground stud left of the inlet. The user
    manual I-00768 p.49 rear figure draws a ground ring at the right end, beside the Ethernet jack. The sheet and its photograph are followed.
  wanted: the maker's word on where the ground stud stands.
- what: front-outlet-control
  scope:
  - front
  reason: sources-disagree
  note: The specification sheet 96-01237 p.3 prints 9 total outlets, 8 controlled. The user manual I-00768 p.48 item A calls the front outlet a controlled
    outlet, and item F counts eight controlled at the rear. The front outlet is drawn as not controlled.
  wanted: the maker's word on whether the front outlet is switched by RackLink.
- what: outlet-type-name
  scope:
  - front
  - rear
  reason: vendor-silent
  note: No held page prints a NEMA name for the outlets. The user manual I-00768 p.48 and p.49 figures label them 15A Outlet and 20A Outlet and draw a T
    slot on the 20 A face.
  wanted: the maker's printed outlet configuration.
- what: breaker-rating
  scope:
  - front
  reason: vendor-silent
  note: The specification sheet 96-01237 and the user manual I-00768 name an integrated power switch and circuit breaker and give no breaker rating. The
    rocker switch part is used for it.
  wanted: the breaker's rating.
- what: ear-holes
  scope:
  - front
  - rear
  reason: needs-drawing
  note: The specification sheet 96-01237 p.5 shows two obround holes in each ear of its front and of its rear elevation. They stand outside the 441 mm face
    and are not drawn, as on the Premium+ pair.
  wanted: the maintainer's word on drawing the ears at 483 mm.
- what: cord-clip-past-depth
  scope:
  - front
  - top
  - left
  - right
  reason: needs-drawing
  note: The specification sheet 96-01237 p.5 top and end views show the retainer's wire loop up to 19 mm behind the printed 245.7 mm depth. The user manual
    I-00768 p.48 front figure draws the loop below the front face. The kit has no key for a part past the box.
  wanted: the maintainer's word on a part that stands past the box.
- what: lamp-colours
  scope:
  - front
  reason: vendor-silent
  note: The user manual I-00768 p.48 and quick start I-00785 p.2 (printed page 7) name the lit colours in words only. The hex values are the library's,
    as on the Premium+ pair. The quick start's blinking green and red state is not drawn as a state.
  wanted: a photograph of a lit unit.
