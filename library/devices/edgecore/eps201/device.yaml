  top:
    size: {w: 438.0, h: 474.0}
    empty: >-
      Not drawn square-on by either staged document. The quick start guide's Overview and FRU figures
      are three-quarter renders and do show the lid - a plain sheet with two long pressed seams - but
      a three-quarter view gives no dimension to place them at, and this device's whole geometry problem
      is that its family's figures are not orthographic.
  bottom:
    size: {w: 438.0, h: 474.0}
    empty: >-
      Not drawn by any staged source. The guide's package contents list a rack mounting kit of two front-post
      and two rear-post brackets and a screw kit, and no rubber feet, so what is underneath is unrecorded
      rather than known to be bare.
  left:
    size: {w: 474.0, h: 44.0}
    empty: >-
      Not drawn by any staged source. The machine is front-to-back, so the intake is the front face's
      own perforation band and the exhaust is the three rear trays; the side walls carry nothing either
      document shows.
  right:
    size: {w: 474.0, h: 44.0}
    empty: Not drawn by any staged source. The other side wall, for the same reason.
configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis as it ships: two 150 W supplies and three fan trays in, every cage empty. THE AIRFLOW
      IS THE CONFIGURATION on this machine, so the two orderable builds below carry it: eight ordering
      codes, four front-to-back and four back-to-front, with a different supply part number and a different
      fan part number in each - YM-1151D A03R against A02R, FAN-1U-1x1M-F against -B - and nothing else
      differing on the drawing but the colour of five handles.
  ac-f2b:
    kind: orderable
    description: >-
      Dual 150 W AC supplies, front-to-back airflow - red handles. The -F ordering codes, and the build
      this device's own quick start guide draws in its fan-replacement figure.
    part-numbers:
      AS4630-54TE-O-AC-F-US: {part: F0PZZ4654410A, power-cord: US}
      AS4630-54TE-O-AC-F-EU: {part: F0PZZ4654208A, power-cord: EU}
      AS4630-54TE-O-AC-F-UK: {part: F0PZZ4654308A, power-cord: UK}
      AS4630-54TE-O-AC-F-JP: {part: F0PZZ4654508A, power-cord: JP}
  ac-b2f:
    kind: orderable
    airflow: back-to-front
    region-context: {exhaust: Intake}
    description: >-
      Dual 150 W AC supplies, back-to-front airflow - blue handles, and THIS IS THE BUILD THE DATASHEET'S
      REAR ELEVATION DRAWS. Counted on that figure: 4,860 blue pixels at a median of (107, 151, 214) and
      not one red. The -B ordering codes take YM-1151D A02R and FAN-1U-1x1M-B.
    component-attrs:
      eps201-psu-150w: {latch-finish: '#6b97d6'}
      eps200-fan-tray: {handle-finish: '#6b97d6'}
    part-numbers:
      AS4630-54TE-O-AC-B-US: {part: F0PZZ4654411A, power-cord: US}
      AS4630-54TE-O-AC-B-EU: {part: F0PZZ4654209A, power-cord: EU}
      AS4630-54TE-O-AC-B-UK: {part: F0PZZ4654309A, power-cord: UK}
      AS4630-54TE-O-AC-B-JP: {part: F0PZZ4654509A, power-cord: JP}
