format: 1
kind: device
name: eps201
version: 1.0.1
maturity: modelled
manufacturer: Edgecore
model: AS4630-54TE
portfolio: {line: Enterprise, family: Access Switch, series: EPS201}
description: >-
  54-port Gigabit access switch, 1RU, sold as the EPS201 and stamped AS4630-54TE. 48 x
  10/100/1000BASE-T RJ-45 in twenty-four columns of two, ganged six and six and six and
  six, then four 10G/25G SFP28 uplinks and two 100G QSFP28 stacking ports numbered 49-52
  and 53-54 into the same sequence. NO PoE - and the panel carries a PoE lamp anyway,
  which its own guide legends "PoE LED: Off". A stacked management/console RJ-45 pair, a
  Type-A USB storage port, STK M/S and Reset buttons and eight status lamps. TWO
  HOT-SWAPPABLE 150 W AC SUPPLIES AND THREE HOT-SWAPPABLE FAN TRAYS on the rear, in either
  airflow. It shares its 438 x 474 x 44 shell and its whole front face with
  edgecore/eps203.
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the rule, not an observation,
      so a photograph of the stack overturns it: the 2 SFP pairs (port-49/port-50 and
      port-51/port-52), the 1 QSFP pair (port-53/port-54).
  gate-1:
    confidence: borrowed
    note: >-
      THIS DEVICE'S OWN FRONT ELEVATION IS NOT ORTHOGRAPHIC AND ITS FACE IS DRAWN FROM ITS
      SHELL-MATE'S. That is the single most important thing to know about this file, so it
      is first.
      Fitting the twenty-four RJ-45 column positions of the EPS201's datasheet elevation
      with `first + pitch*i + gutter*(i//6)`, over 114 candidate rows and four thresholds,
      the best linear fit has an rms of **0.674 mm** and a quadratic term implies the local
      pitch shrinks **5.0%** from the left end of the row to the right. A switch's ports
      are not on a varying pitch: the figure is photographed at an angle. The trap is that
      the linear fit still returns a number - 13.65 mm - and that number is wrong.
      `edgecore/eps203` IS THE SAME SHELL AND ITS FIGURE IS STRAIGHT. Same 438 x 474 x 44
      chassis, same rack kit ("RKIT-100G-SLIDE ... For EPS200 series/AS4630-54TE/54PE/54NPE"),
      same twenty-four columns in four gangs of six, same four SFP28 and two QSFP28 in the
      same order, same left cluster, same eight lamps, same two buttons. Its own elevation
      fits at **rms 0.121 mm** with no quadratic term worth having, and the pitch it gives -
      14.0706 - agrees with the EPS112's 14.0198 and the EPS121's 14.0158 to five hundredths
      of a millimetre. EVERY FRONT-FACE FIGURE IN THIS FILE IS THAT MEASUREMENT, carried.
      AND THERE IS EVIDENCE THE TWO WALLS REALLY ARE THE SAME, which is what makes the
      carry defensible rather than merely convenient. If the EPS201's columns are assumed
      to sit at the EPS203's millimetre positions, a single three-parameter perspective
      transform - a 1D homography, px = (p*mm + q)/(1 + r*mm) - explains the EPS201's own
      image to **0.171 mm rms**, against 0.708 mm for the straight-line model it replaces.
      A wrong assumed geometry would not collapse to a projective map that cleanly. The
      residuals are not pure noise - four sign changes in twenty-three where chance would
      give about eleven - which is what a 1D approximation of a 2D projection looks like,
      and it is recorded rather than smoothed over.
      THE ASPECT IS NO HELP HERE and is written down so nobody re-derives it: the EPS201's
      front elevation reads 998.41 x 102.28 px, a ratio of 9.762 against 438/44 = 9.955, or
      -1.94%. That looked like a pass. Checking whether a figure is ORTHOGRAPHIC is a
      different question from checking its aspect, and on this family it is the one that
      matters.
  sources:
    confidence: datasheet
    note: >-
      Each of the three EPS20x models has its own guide and its own datasheet. This model's
      are eps201-qsg.pdf (md5 26659ac0b98187bc1a4ed46f1cff818c, nine pages, FrameMaker
      16.0.4, barcode E022024-MR-R04) and eps201-datasheet.pdf (md5
      6f8a18bf51211e6c4539dc798bd17238).
      THE GUIDE HAS NO SQUARE-ON ELEVATION EITHER - its Overview and package-contents
      figures are three-quarter renders with the lid showing - but it does carry three
      square-on ENLARGEMENTS: a System Buttons/LEDs crop, and two Port/FRU LEDs crops of
      the left and right ends. Those are what the lamp vocabulary and the panel legends
      below are read from.
  the-front-face-is-the-eps203s:
    confidence: borrowed
    note: >-
      WHAT IS CARRIED, ITEM BY ITEM, so a reader can see the extent of it: the RJ-45 block's
      pitch 14.0706, gutter 4.1518, first centre 34.5102 and row pitch 13.92; the bezel
      plate at y 11.802-36.719; the SFP28 columns at 388.83 and 403.25 and the QSFP28 column
      at 422.48 with their rows; the left cluster's USB, management and console positions;
      the two buttons at 136.61 and 145.97; the eight lamps on 7.90 pitch; the vent band and
      its 3.717 mm hexagon pitch; the numeral and indicator bands at y 7.43-8.74 and
      38.75-40.34. All of it measured on `edgecore/eps203`'s datasheet elevation at 2.2877
      px/mm and on its guide's enlargements at 7.5 to 10.0 px/mm.
      WHAT IS THIS DEVICE'S OWN: the model text `AS4630-54TE`, the single copper rate, the
      rear, and every non-geometric fact below.
  the-poe-lamp-on-a-switch-with-no-poe:
    confidence: measured
    note: >-
      THE PANEL CARRIES EIGHT LAMPS AND THE EIGHTH IS PoE, on a machine that has none. The
      guide's System Buttons/LEDs enlargement shows System / PSU1 / STK1 / FAN over PRI /
      PSU2 / STK2 / PoE, and its legend ends with the line **"PoE LED: Off"** - the vendor
      naming a lamp and then saying it never lights. The datasheet's LEDs section lists six
      and omits both System and PoE.
      THIS SETTLES A QUESTION THE EPS121 HAD TO LEAVE OPEN. That device's `the-sixth-status-lamp`
      gap asks whether a non-PoE switch really carries a PoE lamp, because its only
      enlargement was of its PoE sibling. Here the enlargement is of the non-PoE model
      itself and the answer is yes, with the legend to prove it: Edgecore prints one lamp
      plate across a family and lets the unused lamp sit dark.
  ports:
    confidence: datasheet
    note: >-
      "48 x 10/100/1000BASE-T RJ-45 ports", "4 x 10G/25G SFP28 uplink ports" and "2 x 100G
      QSFP28 stacking ports (requires NOS to support hardware stacking feature), also can be
      used as data transmission ports". ONE COPPER RATE, which is the difference from the
      EPS203 sharing this face: that machine splits its forty-eight into thirty-six at 2.5G
      and twelve at 10G and marks the split on the panel. Here all forty-eight are one group.
      Management: "1 x RJ-45 serial console, 1 x RJ-45 100/1000BASE-T management port, 1 x
      Type-A USB storage port", which is the cluster at the left of the face.
  power:
    confidence: datasheet
    note: >-
      THE SUPPLY IS 150 W AND THE DATASHEET SAYS 1200 ONCE. Three places say 150: the
      Interfaces callouts "11. PSU 2: 150 W" and "12. PSU 1: 150 W", the ordering table's
      "YM-1151D A03R ... 150W AC Power Supply FRU", and "Maximum Power Consumption: 150
      Watts" for the whole machine. One place says 1200: the Power section's "2pcs 1+1
      redundant, load-sharing, hot-swappable 1200 W AC (80 PLUS Silver compliant)".
      150 IS CARRIED, because a supply cannot be rated eight times the machine's own
      maximum draw, because YM-1151D is a 150 W part, and because that 1200 W sentence is
      word-for-word the one in the EPS202's and EPS203's datasheets - where it is correct.
      Filed as the `the-psu-wattage` gap.
      Input "at 47~63Hz: Low-line: 3 A for 90V AC ~136V AC, High-line: 1.5 A for 180V AC
      ~264V AC", which at 150 W is the consistent set.
  airflow:
    confidence: measured
    note: >-
      THIS MODEL SHIPS BOTH AIRFLOWS AND THE TWO DOCUMENTS DRAW DIFFERENT ONES. The
      ordering table has eight codes, four -F and four -B, and two of each FRU -
      "YM-1151D A03R ... front-to-back" against "YM-1151D A02R ... back-to-front", and
      "FAN-1U-1x1M-F" against "FAN-1U-1x1M-B".
      COUNTED: the datasheet's rear elevation carries **4,860 blue pixels** at a median of
      (107, 151, 214) and **zero red**; the guide's fan-replacement figure draws the same
      handles red. The EPS203's rear is the exact mirror - 2,748 red, no blue - and that
      model's datasheet says "Front-to-back airflow only". So red is front-to-back and blue
      is back-to-front on this family, established from prose on one model and read as
      colour on the other.
      SO THE AIRFLOW IS A CONFIGURATION, which is what the library already does for the
      AIS800 pair: `ac-f2b` and `ac-b2f`, each with its own ordering codes and its own
      `component-attrs` for the handle colour, and the back-to-front one carrying
      `airflow: back-to-front` and `region-context: {exhaust: Intake}`. The parts default to
      the red front-to-back build because that is the -F code; the blue the datasheet draws
      is the b2f configuration, not the part's identity.
  the-rear:
    confidence: measured
    note: >-
      MEASURED ON THIS MODEL'S OWN REAR ELEVATION at 2.2808 px/mm - 999 px across 438 mm -
      which carries the same kind of mild gradient as the front, about 2% across the fan
      wall. Every rear figure here is good to about a millimetre and a half.
      THREE FAN TRAY BAYS at x 47.4, 95.1 and 143.6, each 39.5 wide: this figure gives all
      six tray edges cleanly as dips in the column-mean profile - 47.4-86.4, 95.1-134.2,
      143.6-182.6 - where the EPS203's gives only the three left edges. THE TWO MACHINES
      AGREE ON THE PITCH to five hundredths of a millimetre, 48.1 against 48.15, which is
      what one shared shell and one shared fan part should do.
      TWO SUPPLY BAYS at x 291.1 and 374.4, 51.3 wide on a pitch of 83.3 - and THESE DO NOT
      MATCH THE EPS203'S, which are 72.0 wide at 270.0 and 354.0. That is the 150 W supply
      against the 1200 W one, and it is why the shell being shared does not make the rear
      shared. The blue latches at 291.12-297.26 and 375.74-382.32 put the same pitch on the
      sharpest feature the modules have.
      A BLANK PLATE fills the middle, and THE GROUNDING POINT is a plate at the far left -
      the datasheet's callout 9.
  finish:
    confidence: measured
    note: >-
      The front panel and the rear both read as the same dark grey the EPS203 carries; the
      only saturated colour on either face of this machine is the blue on five handles,
      counted above. The port bezels are the pale cream this vendor uses across the access
      line.
attrs:
  environmental:
    operating-temp: '0 to 45 C (32 to 113 F)'
    storage-temp: '-40 to 70 C (-40 to 158 F)'
    humidity: 'Operating: 5% to 95% non-condensing'
  physical:
    weight-note: '6.98 kg (15.39 lb), with two installed PSUs'
  power:
    power-consumption: '150 W maximum'
    system-input-rating-per-psu: 'Low-line 3 A for 90-136 VAC; high-line 1.5 A for 180-264 VAC, 47-63 Hz'
  features:
    optics-sfp: >-
      Four 10G/25G SFP28 uplinks, ports 49-52. The datasheet's transceiver list gives
      10GBASE-RJ-45, 10G DAC/AOC, 25GBASE-SR/LR, 25G DAC/AOC, 40GBASE-SR4/LR4, 40G DAC/AOC,
      100GBASE-SR4/CWDM4/LR4 and 100G DAC/AOC for the chassis as a whole; no per-cage
      breakout table is published, so none is stated here.
    optics-qsfp28: >-
      Two 100G QSFP28 ports, 53-54, sold as stacking ports - "requires NOS to support
      hardware stacking feature, also can be used as data transmission ports". The datasheet
      adds a cabling note of its own: "When a DAC cable is used in a topology, a link issue
      may be encountered if the CR4 Auto-Negotiation/Link Training does not turn on."
    poe: >-
      NONE. The switch has no PoE and the datasheet lists none; the panel's eighth status
      lamp is legended PoE and the guide says it is off. Recorded because the face looks
      like a PoE machine's and its two shell-mates are.
  lifecycle: {eol: none-announced}
chassis: {width: 438.0, height: 44.0, depth: 474.0, ru: 1, weight-kg: 6.98, color: '#3c3f43',
  airflow: front-to-back}
gaps:
- what: the-eps201-front-elevation
  scope: [front]
  reason: needs-drawing
  wanted: >-
    A SQUARE-ON ELEVATION OF THIS MACHINE. Its own datasheet figure is a perspective
    render: the twenty-four RJ-45 columns fit a straight-line model at rms 0.674 mm with a
    quadratic term implying the local pitch shrinks 5.0% across the row, and its guide
    carries no square-on figure at all. EVERY FRONT-FACE FIGURE IN THIS FILE IS CARRIED
    FROM `edgecore/eps203`, which is the same shell and whose own elevation fits at 0.121
    mm. The carry is supported - a three-parameter perspective transform reconciles this
    device's image with that geometry to 0.171 mm - but supported is not the same as
    measured, and one orthographic drawing of this face would turn the whole file from
    borrowed to measured.
- what: the-psu-wattage
  scope: [psus]
  reason: sources-disagree
  wanted: >-
    ONE FIGURE FOR THE SUPPLY. The datasheet's Interfaces callouts say "PSU 2: 150 W" and
    "PSU 1: 150 W", its ordering table says "YM-1151D A03R ... 150W AC Power Supply FRU",
    and its Physical section says the whole machine draws 150 W maximum. Its Power section
    says "2pcs 1+1 redundant, load-sharing, hot-swappable 1200 W AC (80 PLUS Silver
    compliant)". 150 is carried because three statements beat one, because a supply cannot
    be rated eight times the machine's own maximum draw, and because the 1200 W sentence is
    word-for-word the one in the EPS202's and EPS203's datasheets - where it is right. A
    corrected datasheet, or a photograph of a YM-1151D's rating label, closes it.
groups:
  rj45-1g:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the forty-eight 10/100/1000BASE-T RJ-45 ports, twenty-four columns of two ganged six
      and six and six and six, numbered 1-48 down each column. ONE RATE AND NO PoE, which
      is the whole difference from edgecore/eps203 on the same face - that machine splits
      the same forty-eight into thirty-six at 2.5G and twelve at 10G and gives all of them
      90 W.
    attrs: {media: rj45, speed: 1g}
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the four 10G/25G SFP28 uplinks, two stacked pairs, numbered 49-52 into the same
      sequence as the copper ports.
    attrs: {media: sfp, speed: 25g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the two 100G QSFP28 ports, one stacked pair, numbered 53-54. Sold as stacking ports
      and qualified by the datasheet itself - "requires NOS to support hardware stacking
      feature" - so the role here is traffic and the stacking claim sits in attrs where a
      reader can see whose claim it is.
    attrs: {media: qsfp28, speed: 100g}
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      the fifty-four port indicators, one per port, in a row below the port wall with each
      port's number printed to its left.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster at the left - a stacked RJ-45 pair carrying the management
      port over the console port, and a Type-A USB storage port above them.
  buttons: {term: Button, role: service, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  grounding: {term: Point, role: service, index-origin: 1}
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        "2pcs 1+1 redundant, load-sharing, hot-swappable", two bays, either of which runs
        the switch - and on this model that is the whole story, because there is no PoE
        budget to lose with the second supply. Its two shell-mates publish a budget that
        more than halves when a supply goes; this one draws 150 W maximum and its
        redundancy is plain.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '2+1'
      redundancy-note: >-
        "Hot-swappable 2 + 1 redundant fan trays", in the key features and in Interfaces
        callout 10, over THREE BAYS - figure and bay count agree. The guide carries a Fan
        Tray Replacement procedure: "Loosen the fan tray screw. Remove fan tray from the
        chassis. Install replacement fan with matching airflow direction." That last clause
        is the airflow question again: the tray is a FRU and the wrong one will run the air
        backwards.
