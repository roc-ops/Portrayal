format: 1
kind: device
name: as7726-32x
version: 0.29.0
manufacturer: Edgecore
model: AS7726-32X
portfolio:
  line: Data Center
  family: Ethernet Switch
  series: DCS204
description: 32x QSFP28 1U spine/ToR switch, Broadcom Trident 3 (BCM56870)
profile: networking
provenance:
  cpu: datasheet says only 'Intel Xeon 4-Core'; model and clock (D-1518 @ 2.20GHz) from the live
    roc-spine1 entity dump (dumps/arcos-openconfig-components.json)
  attrs: datasheet (Hardware/Performance/Power/Supported-Transceivers sections; power figures are
    min idle / typical 32x SR4 at 30 percent load, 25 C ambient)
  chassis: datasheet (Dimensions WxDxH 43.84 x 51.5 x 4.35 cm; Weight 10.87 kg)
  port-positions: photo-inferred; true 18.5mm pitch (measured ~18.8mm from photo), 6mm block gaps,
    human-reviewed round 5
  port-numbering: estimated (verify against faceplate silkscreen)
  port-number-positions: 'drawing - CONFIRMED, not estimated. Measured off the datasheet
    front figure (working/datasheet/img-005.png sibling, img-007.png) at 2.18 px/mm: the odd
    number sits in the lamp band above the top row at 12.4mm and the even one below the
    bottom row at 39.3mm, against the 12.35 and 39.4 already modelled. The digit is printed
    in the bare metal BETWEEN the left and right lamp pairs. It was invisible because
    common/qsfp28-cage painted its whole box including that band; fixed in that skin at
    v3.2.0, not by moving a correct label'
  led-cluster: human-reviewed vs device photo
  rear-layout: human-reviewed round 3-5
  rear-psu-marks: 'drawing - the right-hand strip carries, top to bottom, an airflow arrow,
    PS1, an earth symbol and the grounding screw, all on the lug centreline (datasheet rear
    figure, working/datasheet/img-005.png). They were one text mark holding a newline, which
    SVG renders as ONE line, so "< PS1" ran 16mm sideways into the mounting ear. Split into
    two marks, centred on the lug at 433.7 (and 4.7 for PS2), with the chevron replaced by
    a filled path triangle. It was tried as an arrow GLYPH first and came out as
    tofu: the renderer''s font has no U+2190 and no U+25C0, so an arrow on this
    panel has to be drawn, the way the AGR420 pair legends draw theirs'
  top-bottom-sides: top from angled photo (grooves + front vent strip); bottom = two labels photo-inferred
    from a dark in-rack shot (big sticker edge visible ~155mm from front, second label front-left
    estimated) - reshoot on a bench for calibration; sides extrapolated from angled photo
attrs:
  performance:
    switching-capacity: 3.2 Tbps (6.4 Tbps full duplex)
    forwarding-rate: 2003.4 Mpps
    packet-buffer: 32 MB
    jumbo-frames: 9416 bytes
    mac-table: 32 K min / 288 K max (NOS-dependent)
    logical-ports-max: '128'
    port-modes-qsfp28: 1x 100G, 2x 50G, 4x 25G, 1x 40G, 4x 10G (breakout via DAC)
    optics-qsfp28: 100GBASE-SR4/CWDM4/LR4/ER4/ZR4/PSM4-2/DR1/FR1/LR1, 100G-DAC/AOC, 40GBASE-SR4/LR4, 40G-DAC/AOC
  power:
    power-min-w: '149.8'
    power-typical-w: '296.73'
    psus: 2x 650 W redundant, load-sharing, hot-swappable
  thermal:
    fans: 5+1 redundant, hot-swappable
  platform:
    asic: Broadcom BCM56870 Trident 3
    cpu: Intel Xeon D-1518, 4-core @ 2.2 GHz
    memory: 16 GB DDR4 (2x 8 GB SO-DIMM)
    storage: 64 GB M.2 SSD (MLC)
    boot-flash: 2x 16 MB
    software: ONIE installer
  features:
    tpm: TPM 1.2
  management:
    mgmt-ports: 1x RJ-45 console, 1x RJ-45 1000BASE-T, 2x SFP+ 10G, 1x USB-A storage
chassis:
  width: 438.4
  height: 43.5
  depth: 515.0
  ru: 1
  weight-kg: 10.87
groups:
  qsfp28:
    index-origin: 1
    term: Port
    role: traffic
    attrs:
      media: qsfp28
      speed: 100g
  mgmt:
    index-origin: 1
    term: Port
    role: management
    mixed: the management cluster at the right-hand end of the faceplate - the
      out-of-band RJ45, the RS-232 console, two SFP+ management uplinks and a
      USB-A service port. Four media, one job; the unit draws them as one block
      and so do we. Three of them carried no group at all and each drew its own
      one-row heading beside QSFP28, as though a console socket ranked with 32
      line ports. Six other devices in the library already name this cluster
      `mgmt` - asr-9001, as5912-54x, as7326-56x, as7946-30xb, as7946-74xksb and
      both DCP-R units - and every one folds its management SFPs in rather than
      leaving them in a media group. `media` and `speed` move to the two
      placements, where devices_index.py indexes them for search exactly as it
      does group attrs, so nothing is lost by not having a group to hang them on
  psus:
    index-origin: 1
    term: PSU
    role: service
  fans:
    index-origin: 1
    term: Fan
    role: service
  leds:
    index-origin: 1
    term: LED
    role: indicator
