format: 1
kind: overlay
nos: arcos
nos-versions: '>=S8.5'
device: edgecore/as7726-32x
identity:
  vendor: arrcus
  model: ArcOS on {model}
  source: >-
    a live device: `arcos-show-version.txt` in this device's dumps reads 'Software: Arrcus
    ArcOS' over 'Firmware MU: EdgeCore MU 1.2.3', with 'Platform: 7726-32X-O-AC-F' - ArcOS's
    own name for the metal, which does not contain the Edgecore model. NO ARRCUS BUNDLE PART
    NUMBER IS KNOWN, so `part-number` is omitted rather than invented; the model below is
    this library's name for the pairing and says both halves on purpose, because a model
    naming only the NOS could not be told from ArcOS on different metal.
terms:
  bay: Slot
interfaces:
  - {physical: 'port-{n}', name: 'swp{n}', range: '1-32',
     breakout: {modes: [4x25g, 4x10g, 2x50g, 1x40g], child-name: 'swp{n}s{i}'}}
  - {physical: mgmt-eth, name: ma1}
  # The 2x SFP+ mgmt uplinks are not exposed as ArcOS interfaces (documented
  # front-panel-only; see RocContLab nautobot-physical-fabric notes).
entity-map:
  - {source: openconfig, match: chassis, to: chassis}
  - {source: openconfig, match: lc0, to: chassis, note: 'fixed-config linecard == the chassis board'}
  # Source: live `show components | display json` from roc-spine1 (ArcOS S8.5.1A).
  # ArcOS names are zero-based for psu/fan/led, one-based for sfp; physical IDs
  # follow the silkscreen (one-based). Tree shape (all flat under lc0) is joined,
  # never drawn. Unmapped nodes (process*, eeprom0, system0) are intentionally absent.
  - {source: openconfig, match: 'sfp{n}', range: '1-32', to: 'port-{n}'}
  - {source: openconfig, match: sfp33, to: mgmt-sfp-1, note: 'assumed cage order; verify with inserted optic'}
  - {source: openconfig, match: sfp34, to: mgmt-sfp-2, note: 'assumed cage order; verify with inserted optic'}
  - {source: openconfig, match: 'psu{n}', range: '0-1', to: 'psu-{n+1}', note: "names psu0/psu1; own labels say PSU-1/PSU-2"}
  - {source: openconfig, match: 'fan{n}', range: '1-6', to: 'fan-{n}', note: "desc 'Chassis Fan - n'"}
  - {source: openconfig, match: fan0, to: psu-2, note: "desc 'PSU 2 - Fan 1' — rolls up to PSU-2"}
  - {source: openconfig, match: led0, to: led-diag}
  - {source: openconfig, match: led1, to: led-loc}
  - {source: openconfig, match: led2, to: led-fan}
  - {source: openconfig, match: led3, to: led-psu1}
  - {source: openconfig, match: led4, to: led-psu2, note: "vendor desc bug: led3 and led4 both say 'LED 4'"}
  - {source: openconfig, match: 'thermal{n}', range: '0-5', to: 'region:internal', note: 'CPU core + LM75 board sensors; no faceplate component'}
  - {source: openconfig, match: thermal6, to: psu-2, note: 'PSU-2 thermal sensor'}
