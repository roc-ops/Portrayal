    size: {w: 509.0, h: 44.0}
    empty: Not drawn by any staged source. The other side wall, solid for the same reason.
configurations:
  ac-f2b:
    kind: orderable
    description: >-
      Dual AC PSUs, front-to-back airflow - red handles and red release latches, which is the build both
      staged photographs and the rear elevation show. THE ONLY CONFIGURATION DECLARED: this datasheet
      says "Supports front-to-back airflow direction", singular, and names no DC supply and no back-to-front
      variant. See the dc-supply-and-b2f gap.
    default: true
