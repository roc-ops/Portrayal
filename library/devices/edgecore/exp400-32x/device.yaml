  left:
    size: {w: 509.0, h: 44.0}
    empty: >-
      Not drawn by any staged source, and on this chassis that is a statement: the EXP400 breathes end
      to end, so the side walls carry no perforation. The intake is the front face's own two slot fields
      and the exhaust is the six rear trays.
