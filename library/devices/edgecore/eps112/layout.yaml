configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis as it ships: two supplies in, every cage empty. The guide's package
      contents say the unit "includes 2 PSUs", and its Connect Power step says "Install one
      or two AC PSUs in the device, if they are not already installed in the factory".
