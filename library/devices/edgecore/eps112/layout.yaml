format: 1
kind: device
name: eps112
version: 1.0.2
maturity: modelled
manufacturer: Edgecore
model: AS4625-30P
portfolio: {line: Enterprise, family: Access Switch, series: EPS112}
description: >-
  24 x 1G RJ-45 PoE plus 6 x 1G/10G SFP+ 1RU access switch, sold as the EPS112 and stamped
  AS4625-30P. ALL TWENTY-FOUR COPPER PORTS ARE PoE and they are two classes, not one: ports
  1-16 carry 802.3at/af up to 30 W and ports 17-24 carry 802.3bt Type 4 up to 90 W, with
  the 90 W eight marked out on the panel by an ORANGE BAND above and below them. The
  RJ-45s sit in twelve columns of two, ganged six and six; the SFP+ uplinks are three
  stacked pairs numbered 25-30 into the same sequence. A stacked management/console RJ-45
  pair, a full-size Type A USB 3.0 storage port, a Reset button and six status lamps finish
  the face. TWO HOT-SWAPPABLE 600 W AC SUPPLIES AND THREE FIXED FANS on the rear - the fans
  are not FRUs. It is the third member of the 440 x 350.3 x 44 shell that edgecore/eps121
  and edgecore/eps122 share, and the only one with its own quick start guide.
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the rule, not an observation,
      so a photograph of the stack overturns it: the 3 SFP pairs (port-25/port-26 to
      port-29/port-30).
  sources:
    confidence: datasheet
    note: >-
      THIS MODEL HAS ITS OWN GUIDE, which is what separates it from its two siblings. The
      EPS121 and EPS122 share one quick start guide, staged twice and byte-identical (md5
      c81e696fe001edaa86961a6660f8da00, 1343641 bytes); the EPS112's is a different
      document - md5 569bbd26f865b2bae24a733d4046d669, 4874667 bytes, titled "AS4625-30P
      Quick Start Guide", six pages, FrameMaker 17.0.7 - and it draws only this machine.
      Its figures are renders of the real thing rather than line art, and its Status LEDs
      enlargement is captioned with THIS model's name, which is what the EPS121's sixth
      status lamp had to be left open for.
      The datasheet (Adobe Illustrator 29.7, "2025-087-EPS112-AS4625-30P DS R03") adds the
      Interfaces page with twelve numbered callouts, the ordering table and the power
      figures. Four product photographs are staged, one of them a square-on rear.
      THE GUIDE STILL DISCLAIMS ITS DRAWINGS - "Note: The drawings in this document are for
      illustration only and may not match your particular model" - but on this model the
      drawings and the photographs agree everywhere they overlap.
  gate-1:
    confidence: measured
    note: >-
      MEASURED AT NATIVE RESOLUTION, NOT ON THE PAGE RENDER, and that is the finding that
      made this device's Gate 1 decisive. Rendering the pages at 600 dpi gave a datasheet
      elevation at an apparent 9.08 px/mm and a guide elevation at 5.04; `pdfimages -list`
      says the datasheet's elevations are embedded at 1000 px across a 440 mm face - 2.27
      px/mm, upsampled fourfold by the renderer - while the guide's are embedded at 2460
      and 2474 px. THE BEST INSTRUMENT ON THIS DEVICE IS THE GUIDE'S OVERVIEW FRONT
      ELEVATION at its own 5.455 px/mm, and the page render of the datasheet is a
      magnified copy of something coarser.
      At native resolution the panel bboxes are: guide Overview front 2400 x 240, ratio
      10.000; guide package-contents front 2401 x 240, ratio 10.004; guide Overview rear
      1233 x 124, ratio 9.944; rear product photograph 954 x 95, ratio 10.042. Against
      440 x 44 those are 0.00%, +0.04%, -0.56% and +0.42%. Against 440 x 44.45 they are
      +1.02%, +1.06%, +0.45% and +1.44%.
      SO THIS DEVICE IS DRAWN TO 44.00 mm, the figure both its documents publish, and its
      two shell-mates are not. edgecore/eps121 and edgecore/eps122 record six instruments
      that fail at 44.0 and pass at 44.45 on the OTHER guide's line art. Same shell, two
      draughting heights, and this one's evidence is the stronger: two of its four
      instruments are exact to four decimal places where the siblings' spread is a full
      percent. Every y measurement in this file uses the 44.00 scale. Filed as
      `shell-height-disagreement`.
  the-port-wall:
    confidence: measured
    note: >-
      TWENTY-FOUR RJ-45 IN TWELVE COLUMNS OF TWO, ganged six and six. Fitted by least
      squares over all twelve columns on the mean of both rows' openings, with a per-gang
      offset: **pitch 14.0198, gutter 7.0439, first centre 177.2888, rms 0.040 mm,
      max residual 0.092**. That pitch is the EPS121's 14.0158 to four hundredths of a
      millimetre, measured on a different document at a different scale, so the two
      machines carry the same jack.
      THE ROW PITCH IS 13.94 AND IT WAS NOT MEASURED FROM THE APERTURE CENTRES. The rows
      mirror - the upper row's keyway points up and the lower row's down, unmistakable at
      11.9 px/mm on the guide's own enlargement - so the two rows' dark cores are not
      symmetric about their cells and their separation is not the pitch. What IS sharp is
      the cream bezel plate: sampled sub-pixel at seven columns between ports it reads
      y 11.285 to 36.300, height 25.015, with a spread of 0.02 mm. Two 11.0 mm cells fill
      it with 3.015 between them, so the pitch is 14.015 - within four hundredths of the
      COLUMN pitch, which is a square grid and a satisfying cross-check rather than a
      coincidence. The enlargement agrees independently: the upper opening's top edge and
      the lower opening's bottom edge are 295 px apart at 11.95 px/mm, or 24.69 mm against
      the 24.94 this model predicts.
      THEN SIX SFP+ AS THREE STACKED PAIRS at x 358.783, 376.933 and 395.083 - a pitch of
      18.150 - with cage apertures 13.93 wide and rows at 16.500 and 32.267, a row pitch of
      15.767. Those rows are further apart than the RJ-45 rows because the SFP block has a
      cream divider between its cages where the RJ-45 block has none; both were measured.
      NUMBERING IS ONE SEQUENCE: RJ-45 1-24, SFP+ 25-30, legended `N (up)(down) N+1` above
      each column and `N (lamp)` below each port.
  the-two-poe-classes-are-two-groups:
    confidence: datasheet
    note: >-
      THE PANEL ITSELF SPLITS THE COPPER ROW IN TWO and this model follows it. The
      datasheet's Interfaces callouts read "2. 16 x 10/100/1000BASE-T RJ-45 ports with 30 W
      per port" and "3. 8 x 10/100/1000BASE-T RJ-45 ports with 90 W per port"; the guide's
      Overview callouts say the same; the prose says ports 1-16 are 802.3at/af up to 30 W
      and ports 17-24 are 802.3bt Type 4 up to 90 W.
      AND THE FACE PRINTS IT. An orange band runs above and below ports 17-24 only -
      measured x 288.567 to 347.417, the top band y 5.133-9.350 and the bottom y
      37.033-42.350, colour counted over 14,807 pixels at a median of (230, 89, 25). The
      numerals inside it are black where every other numeral on the face is white. The
      band starts in the gap between columns 8 and 9, which is where port 17 begins.
      So the twenty-four ports are TWO GROUPS, and the boundary is not a gang boundary -
      the second gang holds ports 13-24 and the band takes the last four of its six
      columns.
      THE PER-PORT CURRENT IS PRINTED ON THE PANEL TOO, at the top right: "PoE Output:
      57V (dc) Max., 0.55A Max/Port1~16, 1.65A Max/Port17~24". Read at 11.9 px/mm on the
      guide's enlargement; at 5.4 px/mm on the elevation it is four lines of blur.
  the-port-indicators:
    confidence: measured
    note: >-
      THIRTY LAMPS, ONE PER PORT, IN A ROW BELOW THE PORT WALL - which is what the
      EPS121's `the-row-under-the-ports` gap was left open for on the other guide. The
      datasheet's callout 6 names them "Port indicators"; the guide's enlargement resolves
      them as rounded windows with their port number printed immediately to their left.
      Measured at 11.95 px/mm they are 3.22 x 1.60; on the elevation all thirty read
      y 39.05-40.70 and their centres sit at plus and minus 3.67 of each RJ-45 column
      centre and plus and minus 3.54 of each SFP column centre - two per column, the odd
      port's to the left and the even port's to the right.
      THE PART DRAWN IS `common/led-rect-sm@1`, which is 2.80 x 1.60. The height is exact
      and the width is 0.42 mm short of the measurement. That is carried rather than
      forked: the library part is explicitly "the rounded bar a dense port row carries one
      of beside each cage", its own size came from thirty-six readings on a different
      vendor's master, and a 0.42 mm fork for one device is a worse trade than a recorded
      difference. IT IS ALSO THE FIRST READING OF THAT LAMP ON ANYTHING BUT THE ASR 9903
      master it came from, so it is written down here rather than acted on: one reading
      does not overturn thirty-six, and a second device measuring 3.2 would.
      The guide's legend gives the vocabulary: "RJ-45 Port LEDs: Green (link), Amber (link
      with PoE)" and "SFP+ Port LEDs: Green (10G), Amber (1G)".
      AND THE TRAFFIC JACKS THEMSELVES ARE BARE, which is why they are `std/rj45-ganged@2`
      and not `common/rj45-ganged-eth@1`. At 11.9 px/mm the MANAGEMENT jack shows two
      light LED windows in the top corners of its housing, exactly where that part draws
      led-a and led-b; the traffic jacks at the same magnification show none - a plain T
      opening with the shell around it and nothing in the corners. That is the whole point
      of the row below: on this machine the port lamp is not in the jack. The console jack
      is bare too, and carries no lamp of its own anywhere.
      THE FIRST DRAFT OF THIS FILE GOT IT WRONG and used the lamped part for all twenty-four,
      which would have drawn forty-eight lamps the metal does not have on top of the thirty
      it does. `spec/tests/test_rj45_family.py` caught it by asking why a separate LED
      placement named a jack that already lights itself.
      THIS IS THE LIBRARY'S OWN SANCTIONED SHAPE, not an exception to it.
      `docs/rj45-family-design.md` gives a mechanical rule - Ethernet takes the lamped part -
      and L76's census carries the matching exemption in as many words: a bare jack is not
      "on a part with no lamps" when the view draws a `class: led` placement `for:` it
      BESIDE the jack rather than inside it, the shape `edgecore/as5912-54x` already uses
      for its management jack. Twenty-four of them here, and the census stays silent because
      every one of them has its lamp declared.
  the-management-cluster:
    confidence: measured
    note: >-
      AT THE RIGHT, AND IT IS NOT THE SIBLINGS' CLUSTER. A single stacked RJ-45 pair in one
      cream bezel carries the management port over the console port - the panel legends them
      "(up) Mgmt" and "(down) Console" - where the EPS121 has two separate jacks. Its bezel
      reads x 405.533-422.400 and y 11.648-36.406, aperture centre x 413.233.
      AND THE USB IS FULL SIZE AND VERTICAL. The datasheet calls it a "Type A USB 3.0
      storage port" where the EPS121's guide lists a Micro-USB; its metal shell reads
      6.64 wide by 14.20 tall, centred at (430.38, 29.94), with the blue 3.0 tongue inside
      running the tall way. A horizontal USB-A would read 13 wide and 5 tall, so the
      orientation is not in doubt. Drawn as `std/usb-a@1` with `rotate: 90` about the
      placement centre, the way edgecore/cor580 draws its own vertical one.
      The Reset button is a round recess 2.6 across at (100.28, 5.49) - which is exactly
      what `common/reset-button@1` draws inside its 4.0 cell.
  the-status-lamps:
    confidence: measured
    note: >-
      SIX LAMPS IN TWO ROWS OF THREE, and unlike the EPS121 this model's own guide shows
      them: the Status LEDs enlargement is captioned AS4625-30P and reads, left to right,
      System / PSU1 / FAN on the top row and LOC / PSU2 / PoE on the bottom, with the label
      to the right of each lamp and the Reset button to their left. The datasheet's LEDs
      section lists the same six: "System LEDs: System, PSU1, PSU2, FAN, PoE, LOC".
      Measured on that enlargement at 12.03 px/mm - calibrated on the port-wall bezel edge
      and port 1's aperture centre, both of which this file already knows exactly - the
      lamps are 2.94 x 1.54 with centres at x 108.53, 116.47 and 124.41 on rows y 3.78 and
      7.23. `common/led-rect-sm@1` is 2.80 x 1.60 against that.
      THE PoE LAMP IS NOT A PROBLEM HERE, and it was on the sibling. This machine has PoE
      on every copper port, so a PoE lamp is exactly what it should carry; the EPS121's
      gap exists because that model has none and was shown the 54P's plate.
      The legend, transcribed from the guide: System green = OK, amber = fault detected;
      PSU1/2 green = OK, amber = fault; FAN green = OK, amber = fault; LOC blinking amber =
      switch locator; PoE green = OK, amber = near PoE budget.
  the-vent-strip:
    confidence: measured
    note: >-
      A SINGLE ROW OF HEXAGONAL PERFORATIONS runs along the top of the port wall, from
      x 166.3 to 424.0 and from the top edge down to about y 5.0, with a second row clipped
      by the panel's top edge above it. Measured on the guide's enlargement at 11.9 px/mm
      the holes are 2.70 across on a pitch of 3.611 - twenty-two of them counted in one
      span - and they are flat-topped hexagons with points left and right, which is the
      orientation the renderer's own `vent` tile already uses. `pattern-pitch` scales that
      tile to the measured 3.61; the tile's hole is 58% of its pitch where these are 75%,
      so the lattice is right and the holes are drawn a little small. THE TILE'S ROW SPACING
      IS ALSO ITS OWN: 0.288 of its pitch against the hardware's 0.886, so the drawn band
      carries about two and a half rows of small hexagons where the metal carries one row of
      large ones and a clipped second. Scaling the tile to fix that stretches the hexagons
      into ellipses, so the scale is set from the pitch ACROSS - the structural figure, and
      the one that was measured - and the field reads darker than the metal. Sampled on
      matched regions the reference's vent band medians 54 and this render's 25.
  power:
    confidence: datasheet
    note: >-
      THE SUPPLY'S OWN WATTAGE IS PUBLISHED, which is unusual in this corpus. The
      datasheet's Interfaces callouts read "11. PSU 1: 600W" and "12. PSU 2: 600W", and the
      Power section reads "PSUs: 2 pcs 1+1 redundant, load-sharing, hot-swappable 600 W AC
      (80Plus Platinum compliant)". The ordering table names the part: UP6001R-1079G, a
      UMEC 600 W AC supply with an IEC 60320 C14 inlet, "for EPS112/AS4625-30P".
      THE MACHINE'S FIGURES: maximum power consumption "Low-line: 1150 Watts, High-line:
      1200 Watts"; input "Low-line: 8.5 A for 90 VAC~136 VAC, High-line: 4.5A for 180
      VAC~264 VAC"; the guide's own table gives a per-PSU system input rating of
      "100-240 VAC, 50/60 Hz, 8.5 A max." PoE budget "450 W for 1 PSU/1000 W for 2 PSU",
      with the datasheet's own caveat that "AC PSUs are redundant in terms of system and
      networking, but not fully redundant in terms of PoE functions and the power budget".
      That caveat is why the psus group's redundancy note says what it says.
  the-rear:
    confidence: measured
    note: >-
      MEASURED ON THE GUIDE'S REAR ELEVATION at its native 2.80 px/mm, which is the best
      rear instrument this device has and is coarse: one pixel is 0.36 mm. The square-on
      rear product photograph (2.17 px/mm) was used to check every figure and agrees
      within its own resolution.
      THREE ROUND FAN OPENINGS, 25.1 across, at x centres 70.22, 117.91 and 165.78 - a
      pitch of 47.87 - on y 23.22. THE EPS121 RECORDS 47.8 for the same three fans on the
      other guide, so the fan positions are shared across the shell even though the guards
      are drawn as rectangles there and circles here.
      TWO SUPPLY BAYS, and the two modules' silver faces measure IDENTICALLY: x
      270.45-343.68 and 354.76-427.99, both 73.23 wide, both y 2.55-42.79, both 40.24 tall,
      on a pitch of 84.31. The photograph puts the handles 83.9 apart and the latches 84.8,
      which brackets it.
      THE GROUNDING POINT is two studs and an IEC earth symbol at the far left, x 3.95 to
      about 22, vertically centred - the datasheet's callout 9 and the guide's callout 7.
      SILKSCREEN: FAN1, FAN2 and FAN3 under and right of their own fans at x 84.0-90.0,
      132.2-138.6 and 180.4-186.9 on y 39.5; PSU1 and PSU2 on the black web to the RIGHT of
      each bay, at x 346.6-352.0 and 432.2-438.0, vertically centred. The PSU labels are
      legible only on the photograph; the elevation blurs them.
  finish:
    confidence: measured
    note: >-
      COUNTED, NOT GLANCED AT. The front panel's plain left end medians (60, 60, 60) over
      14,933 pixels and its mid section (63, 63, 63) over 22,331; the rear's plain middle
      medians (70, 70, 70) over 13,104. Both faces are neutral - no blue cast - and the ten
      levels between them are the two figures' exposure rather than two paints, so the
      chassis carries their mean.
      THE ONLY SATURATED COLOUR ON EITHER FACE: the orange PoE band, 14,807 pixels at a
      median of (230, 89, 25), and the supplies' red handles and latches on the rear, 5,977
      pixels at a median of (177, 93, 92). On the FRONT a red test finds 227 pixels and all
      227 are the two red letters of the Edge-core wordmark; nothing else on the front face
      is red. The port bezels median (250, 249, 245) over 23,139 pixels.
  why-this-is-its-own-device:
    confidence: datasheet
    note: >-
      IT DOES NOT NEED THE ARGUMENT ITS SIBLINGS NEEDED, because it does not share their
      guide. The EPS121/EPS122 pair had to be separated on device attrs a configuration
      cannot carry; this model arrives with its own six-page document, its own datasheet,
      its own port count, its own supply and its own face. What it shares with them is the
      shell - 440 x 350.3 x 44, the same rack kit "RKIT-L-4625 ... for EPS100/AS4625
      series" - and the fan pitch.
attrs:
  environmental:
    operating-temp: '0 to 45 C (32 to 113 F) at sea level'
    storage-temp: '-40 to 70 C (-40 to 158 F)'
    humidity: 'Operating: 5% to 95% non-condensing'
  physical:
    weight-note: '6.42 kg (14.15 lb), includes two PSUs'
  power:
    power-consumption: 'Low-line 1150 W max; high-line 1200 W max'
    system-input-rating-per-psu: '100-240 VAC, 50/60 Hz, 8.5 A max'
    poe-budget: '450 W with one PSU, 1000 W with two PSUs'
  features:
    optics-sfp: >-
      Six 1G/10G SFP+ uplinks, ports 25-30. The guide's Install step lists what goes in
      them - "10GBASE-SR, LR, CR, T" and "1000BASE-SX, LX, T" - and the datasheet adds
      "1G BIDI up to 40 KM", "10G BIDI up to 10KM" and "10G tunable laser DWDM up to
      80 KM". No breakout table is published, so none is stated here.
    poe: >-
      Ports 1-16 support IEEE 802.3at and 802.3af up to 30 W per port; ports 17-24 support
      IEEE 802.3bt Type 4 up to 90 W per port. The panel prints the per-port current:
      0.55 A max on ports 1-16 and 1.65 A max on ports 17-24, at 57 V dc max. 90 W needs
      Cat 6A cabling, which the datasheet says in its own key-features list.
  lifecycle: {eol: none-announced}
chassis: {width: 440.0, height: 44.0, depth: 350.35, ru: 1, weight-kg: 6.42, color: '#414141',
  airflow: front-to-back}
gaps:
- what: shell-height-disagreement
  scope: [front, rear]
  reason: sources-disagree
  wanted: >-
    WHICH HEIGHT THE 440 x 350.3 x 44 SHELL IS ACTUALLY BUILT TO. Four instruments on this
    model's own documents - two of them exact to four decimal places - put its drawings at
    440 x 44.00. Six instruments on the EPS121/EPS122's shared guide put THEIR drawings at
    440 x 44.45 and fail at 44.0. Both families publish "44" in their specification tables
    and both are sold as the same 1RU chassis with the same rack kit. One of the two
    document sets is drawn a percent tall, and nothing in either settles which. A
    dimensioned mechanical drawing, or a ruler on one real machine, closes it for all
    three devices at once.
- what: fan-guard-shape
  scope: [rear]
  reason: sources-disagree
  wanted: >-
    WHETHER THE THREE FIXED FANS ARE ROUND OR RECTANGULAR. This model's guide and its rear
    photograph both draw round openings 25.1 across; the EPS121/EPS122 guide draws 25.5 x
    15.9 rectangles at the same pitch on the same shell - 47.87 here against 47.8 there,
    and 25.1 across against 25.5. The width and the pitch agree to within half a millimetre
    and the SHAPE does not, which is what a single fan drawn two ways looks like. Whichever
    is wrong, one of the two parts is drawing a guard nobody makes. A rear photograph of an
    AS4625-54T or a mechanical drawing of the fan wall closes it.
- what: psu-latch-overhang
  scope: [rear]
  reason: needs-photo
  wanted: >-
    HOW FAR THE SUPPLY'S RELEASE TAB STANDS PROUD OF ITS OWN FACE. The two modules' silver
    faces are identical to a hundredth of a millimetre - 73.23 wide, 40.24 tall, both of
    them - but their red tabs run to 2.5 mm past module 1's right edge and 7.5 mm past
    module 2's. One part cannot do both, and at 2.80 px/mm the difference is seven pixels,
    which is more than the noise. The tab is drawn inside the face here. A square-on
    photograph of a supply out of the chassis closes it.
groups:
  rj45-poe-30w:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the sixteen 1G RJ-45 ports that carry IEEE 802.3at and 802.3af PoE up to 30 W -
      ports 1 to 16, the first eight columns of the port wall. They are a separate group
      from ports 17-24 because the panel itself separates them, with an orange band and a
      different per-port current.
    attrs: {media: rj45, speed: 1g, poe: '802.3at/af, 30 W per port, 0.55 A max at 57 V dc'}
  rj45-poe-90w:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the eight 1G RJ-45 ports that carry IEEE 802.3bt Type 4 PoE up to 90 W - ports 17 to
      24, the last four columns of the port wall, inside the orange band. The datasheet's
      own key features note that 90 W needs Cat 6A cabling.
    attrs: {media: rj45, speed: 1g, poe: '802.3bt Type 4, 90 W per port, 1.65 A max at 57 V dc'}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the six 1G/10G SFP+ uplinks, three stacked pairs at the right of the port wall,
      numbered 25-30 into the same sequence as the RJ-45 ports. `index-origin` is 1
      because the schema allows 0 or 1 and nothing else; the 25 the panel prints is carried
      by each port's own `rel-pos`.
    attrs: {media: sfp, speed: 10g}
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      the thirty port indicators, one per port, in a single row below the port wall with
      each port's number printed to its left. The datasheet's callout 6 calls them "Port
      indicators".
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster - a stacked RJ-45 pair carrying the 100/1000BASE-T management
      port over the RJ-45 console port, a Type A USB 3.0 storage port and the Reset button.
      The guide legends the management jack's own lamps "Left (link), Right (activity)".
  leds: {term: LED, role: indicator, index-origin: 1}
  grounding: {term: Point, role: service, index-origin: 1}
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        "2 pcs 1+1 redundant, load-sharing, hot-swappable 600 W AC" - two bays, either of
        which runs the machine. THE REDUNDANCY IS NOT FULL AND THE VENDOR SAYS SO: the
        datasheet's own note reads "AC PSUs are redundant in terms of system and
        networking, but not fully redundant in terms of PoE functions and the power
        budget", and the budget figures show it - 450 W with one supply against 1000 W with
        two. Losing a supply keeps the switch up and halves what it can power.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '2+1'
      redundancy-note: >-
        "Fixed 2+1 redundant fans", from the datasheet's key features and the guide's
        Overview callout 6. **THEY ARE NOT FRUs AND THERE ARE NO BAYS** - the guide's FRU
        Replacement section covers the supplies only, and there is no latch, handle or seam
        to draw. So the three fans are PLACED rather than bayed, and the 2+1 counts rotors
        that nobody swaps. A census that asks whether this figure fills its bays will find
        none, and that is correct.
