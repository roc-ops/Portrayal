format: 1
kind: device
name: dcs510
version: 0.1.0
maturity: modelled
manufacturer: Edgecore
model: DCS510
portfolio: {line: Data Center, family: Ethernet Switch, series: DCS510}
description: >-
  Edgecore DCS510, vendor alias AS9716-32D - a 1RU 400G data-centre spine switch on Broadcom Tomahawk
  3 (BCM56980) with 12.8 Tbps of switching. Thirty-two QSFP-DD ports fill the front in eight two-wide
  ganged shells, each port 1x400 GbE or 1x100 GbE, or 4x100 GbE / 4x25 GbE on a breakout cable, with a
  four-lamp lane column beside every cage. The left end carries the timing cluster - 10 MHz and 1PPS SMA
  jacks in an OUT/IN pair and an RJ45 ToD port - beside the Loc/Diag/Fan/PS1/PS2 status column and a reset
  button; the right end carries the management cluster: an RJ45 1000BASE-T OOB port, a USB-A storage port,
  an RJ45 serial console and two 10G SFP+ management uplinks. Two hot-swappable load-sharing 1300 W AC
  supplies and six 5+1 redundant fan trays live at the rear with a grounding screw at each bottom corner,
  and the whole set is orderable front-to-back or back-to-front. Ships with ONIE
profile: networking
provenance:
  sources: >-
    Edgecore DCS510 (AS9716-32D) data sheet (working/intake/edgecore/converted/dcs510-datasheet) for the
    platform, port inventory, performance, physical figures, LED colours, compliance and the ordering
    table; the DCS510 quick start guide (same intake, -qsg) for the hardware specification table, the
    AC PSU input rating, the FRU inventory and procedures, the airflow-reversal convention and the Port
    LED page. GEOMETRY comes off three figures and nothing else - dcs510-datasheet fig-0007 (the datasheet's
    paired front and rear elevations with thirteen callouts), dcs510-qsg fig-0004 (the QSG front elevation)
    and dcs510-qsg fig-0066 (the QSG rear elevation) - with dcs510-qsg fig-0005 (the system-LED close-up)
    and fig-0030 (the management-cluster close-up) used for detail at higher resolution. The three product
    renders under working/intake/edgecore/photos are 489 px wide, which is about 1.1 px/mm, and are used
    for colour and counts only.
  facts-tool: >-
    spec/tools/portrayal/facts.py returned the dimension triple three times over (dcs510-qsg doc.md lines
    234, 506 and 777, English and both Chinese translations of the same table), the weight four times,
    the 1RU line and the two port lines. It returned `power: []` and `ordering: []` FOR THIS MODEL AND
    THE VENDOR IS NOT SILENT ABOUT EITHER: the QSG's Switch Chassis table states 'Power Consumption 1300
    Watts maximum' at doc.md:250 and its AC PSU table the input rating at 254-260, and the datasheet carries
    a seven-row Ordering Information table of chassis SKUs and part numbers at the end of doc.md. Both
    were read out of the documents by hand and are transcribed below. What the vendor IS silent about
    is a PSU or fan FRU part number - see the gaps register
  gate-1: >-
    THE DATASHEET FIGURE IS A PHOTOGRAPH AND ITS VERTICAL SCALE CANNOT BE USED. fig-0007 front: body x
    9-1449, y 124-270 px = 1441 x 147 for a stated 438.4 x 43.1, aspect 9.80 against a true 10.17, 3.6%
    out. Its ACROSS scale is nevertheless exact and independently confirmed - the sixteen cage columns
    fall on a 62.5 px step, which is 19.01mm at 1441 px / 438.4mm, against the registry's 19.0 - so every
    x below is measured on it at 3.287 px/mm. Its DOWN scale is not usable: the cages are 37mm-deep recesses
    seen slightly from above, so the top row's opening measures 25.5 px and the bottom row's 22.5 px for
    the same part, and the panel outline includes a sliver of the top surface. Every y below is therefore
    measured on fig-0004, the QSG front elevation, which is orthographic - body x 4-803, y 29.5-108.5
    px = 799 x 79, aspect 10.11 against 10.17, 0.6% out, 1.8225 px/mm across and 1.833 down - and cross-checked
    on fig-0005 at 10.0 px/mm (scale set by that image's own 190 px cage pitch). The two agree on the
    top cage row to a tenth of a millimetre: 11.1-12.2 from fig-0004, 11.85 from fig-0005. fig-0066 (rear)
    passes at aspect 9.99, 1.8% out, 1.822 px/mm.
  chassis: >-
    datasheet and QSG agree exactly, three documents deep - '438.4 x 536 x 43.1 mm (17.26 x 21.1 x 1.7
    in.)' in the QSG Switch Chassis table and its two Chinese translations, and '43.84 x 53.6 x 4.31 cm'
    in the datasheet's Physical and Environmental section, the same triple in centimetres. 438.4 IS THE
    BODY AND NOT A RACK FACE - it is 44mm narrower than the 482.6mm 19-inch opening, the QSG ships the
    unit with separate front-post and rear-post brackets rather than integral flanges, and the mounting
    figures show those brackets bolting to the chassis SIDE. So no ear fold is subtracted and none is
    drawn; the two rack-ear placements are marked `optional: ears` and stand outside the modelled body.
    Colour is the median of a plain metal patch in fig-0007 between the port rows, #4e5054, corroborated
    by the front render at #4f4e4a
  port-block: >-
    drawing - eight two-column ganged shells. The cage column pitch is a REGISTRY LOOKUP and not a measurement:
    standards.yaml gives qsfp-dd w 19.0 with no pitch key, which means instances abut and w IS the pitch,
    and the figure agrees at 19.01. Block origin and gang pitch are measured on fig-0007 across: the eight
    shell left walls least-squares fit 135 px + n x 144.71 px, which is 38.3mm and 44.02mm, so the gutter
    between shells is 44.02 - 2 x 19.0 = 6.02mm, taken as 6.0. The last shell's right wall lands at 1272
    px = 384.3mm, and 38.3 + 16 x 19 + 7 x 6 = 384.3 exactly. Rows: top cage at y 12.0 (fig-0004 11.1-12.2,
    fig-0005 11.85) on a 14.5mm row pitch (fig-0004 14.14-14.55, fig-0030 13.80) - and the pair is confirmed
    a second way, by the two management SFP+ cages at the right end, which fig-0004 measures at 12.1-22.1
    and 26.6-36.6, exactly 16.0 x 10.0 and exactly level with the two port rows
  port-numbering: >-
    drawing - the faceplate prints one legend per COLUMN in the band between the rows, 'n (up) (down)
    n+1', so the top port of column k is 2k+1 and the port below it 2k+2: column-major, odd on top, even
    below. Read directly off fig-0030 at the right-hand end, where '31 (up) (down) 32' is legible, and
    off fig-0007 at the left-hand end, where '1 (up) (down) 2' and '3 (up) (down) 4' are. THE TRIANGLE
    PAIR IS DRAWN AS A PATH, not set as glyphs - a sibling in this library recorded that the renderer's
    font has no arrow glyph and produced tofu
  port-leds: >-
    photo-measured - four lamps per port in a VERTICAL column, 3.0mm pitch, ~1.7mm across, placed in the
    metal outboard of the port's own shell: the left column's port lit on the left of the shell, the right
    column's on the right, so the gutter between two shells carries two lamp columns 2.1mm apart. That
    bracketing is what fig-0007 resolves at 267 and 274 px in a gutter whose walls are at 259 and 278
    px, and the offset is modelled at a uniform 1.7mm outboard of each shell edge, which reproduces the
    measured 2.13mm separation. The lone leftmost column, which has more room, reads 2.08mm rather than
    1.7mm out; the uniform rule is used and the 0.4mm difference recorded here rather than special-casing
    one shell. Lamp COUNT is four in fig-0005 and fig-0030 and matches the vendor's own maximum, '100G
    Breakout: 1-4 LEDs Green'
  cage-aperture: >-
    registry, with a noted disagreement. std/qsfp-dd@1 declares 19.0 x 10.0 and the cutouts are derived
    from it rather than measured, which is what keeps a hole and its occupant one number. The three figures
    read the drawn opening HEIGHT at 10.24 (fig-0004), 9.2 (fig-0005) and 9.0 (fig-0030) - bracketing
    the registry's 10.0 and averaging 9.5, which is qsfp-ganged's measured 9.58 rather than qsfp-dd's
    registry 10.0. The registry value is kept because it is the library's, one device is not the place
    to move a standard, and the difference is half a millimetre; it is written down here so the next person
    has the three readings
  left-cluster: >-
    drawing + photo. Four SMA jacks in a 2x2 grid, OUT above IN, 10 MHz left and 1PPS right: centres measured
    across on fig-0007 at 15.97 and 24.79 (gold-pixel centroids) and on fig-0004 at 13.7 and 23.6, down
    on fig-0005 at 10.0 and 18.1 and on fig-0004 at 10.3 and 19.2. The four readings average 14.8 / 24.3
    across and 9.9 / 19.2 down, a pitch of 9.5 across and 9.3 down; MODELLED AT 9.5 BOTH WAYS, which is
    the footprint of common/sma-jack@1, so the four jacks abut rather than overlap. The deviation is 0.2mm
    and the figures resolve 0.3mm. The ToD RJ45's bezel measures 15.8mm wide on fig-0007 (54-106 px) and
    14.9mm tall on fig-0004, which is common/rj45-shielded@2's 15.8 x 12.5 to a third of a millimetre.
    Status lamps: five, x centre 33.0 (fig-0005) / 33.3 (fig-0004), first at y 5.3 on a 3.0mm pitch (fig-0005
    2.9, fig-0004 3.1), labelled Loc, Diag, Fan, PS1, PS2 downwards - the QSG's System LEDs/Buttons page
    gives that order and their colours. Reset button below them at y 20.1 (fig-0005)
  right-cluster: >-
    drawing - measured on fig-0004 at 1.8225 px/mm across and 1.833 down, with fig-0007 confirming every
    x to 1.5mm. RJ45 OOB at the top (y 1.2-12.1, centre x 398.9 on fig-0004 and 396.7 on fig-0007), USB-A
    below it (14.8-21.5), RJ45 console below that (27.0-40.3), and two SFP+ cages to their right at 409.3
    (12.1-22.1 and 26.6-36.6). THE JACK COMPONENTS ARE COLLECTIVELY 39.1mm TALL AND THE MEASURED SPAN
    IS 39.1mm, so they are seated abutting; the components carry bezel margins the elevation does not
    draw, which is why each individually measures 1-2mm smaller than its part. Which RJ45 is which comes
    from the printed legend between them, 'Mgmt (up) (down) Console', and from the datasheet's callout
    list, where 4 is the RJ-45 management port and 8 the console port. The green pull-out tab at the bottom
    right is measured at 414.2-434.3 and 40.6-43.3
  rear: >-
    drawing - fig-0066 at 1.822 px/mm, panel left edge at 6 px. Six fan trays on a 49.1mm pitch, the leftmost
    at 73.5 and the rightmost at 319.0, numbered 6 to 1 left to right, with each numeral printed in the
    seam just left of its own tray (measured at 170.7, 219.0, 267.3 and 316.1 against bay edges at 171.7,
    220.8, 269.9 and 319.0). PS2 spans 14.3-68.1 and PS1 371.0-424.8, 53.8mm wide, which is common/psu-ac-650@3's
    54.0 envelope and so edgecore/psu-ac-1300@1's. THE PSU RELEASE LATCH PROJECTS LEFT OF ITS BAY over
    bare chassis in the upper half only, which is how a grounding screw at x 7-9, y 34-36 sits under the
    latch without being under the module - the bay is modelled as the rectangle it is and the lug outside
    it. Both grounding screws are the datasheet's callout 13, printed twice, one at each bottom corner
  numbering-rule-carried: >-
    checked to the end of the face. The 'n (up) (down) n+1' legend is printed under all sixteen columns
    - not derived from the first shell and extended - and the four-lamp column is present on both sides
    of all eight shells including the outermost, which is what fig-0007 shows at 128 px (left of column
    1) and fig-0030 shows to the right of column 16. The rear fan numeral is printed for all six trays
  side-top-bottom: >-
    SIZE ONLY, and deliberately. No document I hold carries a side, top or underside elevation. The QSG's
    mounting figures (fig-0021, fig-0022) show the chassis in three-quarter view with the bracket bolting
    to its side, and a product label on the lid, but a three-quarter render is not an elevation and nothing
    in it can be measured to a millimetre. The four faces are sized from the datasheet triple so a rack
    elevation and the 3D box are right, and carry no invented rails, vents or screws. This holds the device
    at capability level 2; the alternative was drawing furniture nobody published
  lamp-cutouts: >-
    NOT PUNCHED, AND L39 STANDS FOR ALL THIRTY-TWO PORT LAMP COLUMNS. Two reasons, and both are about
    not drawing something I cannot see. First, I cannot resolve from any figure I hold whether a lane
    column is four discrete windows in the metal or one moulded lens strip: fig-0005 at 10 px/mm shows
    four separate dots on dark metal, which is consistent with either, and there is no control feature
    at that scale to settle it. Second, the rule cannot be satisfied either way for a multi-lamp part
    - a cutout named after the placement is required to sit CENTRED on the whole 1.7 x 10.7 strip, so
    four 1.4mm holes fail it as surely as no holes do, and the only geometry that passes is a full-height
    slot, which is the one reading I am least sure of. The five round status lamps, the reset button and
    the two SFP+ management lamps ARE single openings and are punched. The panel's other twelve openings
    and all thirty-two cages are punched
  optics: >-
    datasheet - the Supported Transceivers and Cables list, transcribed verbatim into attrs.features
attrs:
  performance:
    switching-capacity: 12.8 Tbps (25.6 Tbps full duplex)
    forwarding-rate: 7.93 Bpps
    packet-buffer: 64 MB integrated
    jumbo-frames: 9 Kbytes
    mac-table: 8 K (NOS-dependent)
    vlan-ids: 4 K (NOS-dependent)
    l3-host-table: IPv4 UC 16 K, IPv4 MC 8 K, IPv6 UC 8 K, IPv6 MC 4 K (NOS-dependent)
  power:
    power-max-w: 1300
    power-envelope: unstated
    psus: 2 redundant, load-sharing, hot-swappable AC
    psu-input: 100-240 VAC 50-60 Hz (100-120 VAC 12 A max, 200-240 VAC 7.5 A max, 190-310 VDC 8-5 A)
  thermal: {fans: '5+1 redundant, hot-swappable', airflow: 'front-to-back or back-to-front, by SKU'}
  environmental: {temperature-operating: 0 C to 45 C, temperature-storage: -40 C to 70 C, humidity-operating: 5%
      to 95% non-condensing}
  platform: {asic: Broadcom BCM56980 Tomahawk 3, cpu: 'Intel Xeon D-1518, 4-core', memory: 16 GB DDR4
      (2x 8 GB SO-DIMM), boot-flash: 2x 16 MB SPI, storage: 50 GB MLC M.2 SSD, software: ONIE installer}
  features:
    optics-qsfp-dd: >-
      400GBASE-SR8/DR4/FR4 and 400G-DAC/AOC natively; on a breakout cable 100GBASE-SR4/CWDM4/LR4 with
      100G-DAC/AOC, and 40GBASE-SR4/LR4 with 40G-DAC
    port-modes-qsfp-dd: 1x 400G, 1x 100G, 4x 100G or 4x 25G via breakout
    port-led-colours: >-
      400G blue; 200G breakout white plus 1-2 green; 100G breakout 1-4 green; 50G breakout cyan
  management:
    mgmt-ports: 1x RJ-45 1000BASE-T, 1x RJ-45 console, 2x SFP+ 10G, 1x USB-A storage
    timing-ports: 10 MHz IN/OUT and 1PPS IN/OUT SMA, RJ-45 ToD
  compliance:
    emc: >-
      EN 55032 / CISPR 32 / AS-NZS CISPR 32 Class A, EN 55024 / CISPR 24, CISPR 35, EN 61000-3-2, EN 61000-3-3,
      FCC Title 47 Part 15 Subpart B Class A, VCCI Class A, BSMI Class A, ICES-003 Class A
    immunity: EN 55024/55035, IEC 61000-4-2/3/4/5/6/8/11
    safety: >-
      UL 62368-1 and CSA 22.2 No 62368-1, CB (IEC/EN 60950-1 and IEC/EN 62368-1), BSMI CNS 15598-1, EN60950/UL60950,
      CE Mark, CCC
    nebs: GR-63-CORE (Pre-test)
    rohs: RoHS 2.0 compliant; WEEE Directive 2002/96/EC
  lifecycle: {eol: none-announced}
