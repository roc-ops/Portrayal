format: 1
kind: device
name: dcs510
version: 1.0.7
maturity: modelled
manufacturer: Edgecore
model: DCS510
portfolio: {line: Data Center, family: Ethernet Switch, series: DCS510}
description: >-
  32x 400G QSFP-DD 1RU data-centre spine switch (vendor alias AS9716-32D), Broadcom Tomahawk 3 BCM56980,
  ONIE-preloaded. All ports on the front; two 1300 W AC PSUs and six 5+1 fan trays from the rear, in front-to-back
  and back-to-front airflow SKUs.
profile: networking
provenance:
  sources: >-
    Two documents, both docling-converted. dcs510-datasheet (the DCS510 / AS9716-32D
    data sheet) carries the spec table, the ordering matrix and fig-0007, a stacked front-and-rear elevation
    with thirteen callouts. dcs510-qsg (the AS9716-32D quick start guide) carries fig-0004 (front elevation),
    fig-0009 (rear elevation), fig-0005 (system-LED zoom), fig-0011 (port-LED zoom) and fig-0012 (management-cluster
    zoom), plus the hardware-specification and LED tables. Three vendor stock photographs (photos/dcs510-1..3)
    confirm colour and construction only. Both documents letter the artwork AS9716-32D, which is this
    device's own vendor alias, so the figure/product check the prepared brief asks for passes: the pictures
    are of the product the text describes.
  figure-choice: >-
    Gate 1, from the prepared brief's ranked candidates. dcs510-qsg/fig-0004 panel 0, box [4,30,803,108],
    is orthographic to 0.7 percent (1.8225 px/mm on x, 1.8097 on y) and is the source of every VERTICAL
    number here, through the prepared band report. dcs510-datasheet/fig-0007 panel 0, box [8,124,1450,270],
    is NOT orthographic - 2.9 percent, its box 6 px too tall because the render's lower shadow is inside
    it - but its x scale (3.2892 px/mm) agrees to 0.3 percent with panel 1 of the same figure (3.2801),
    which IS orthographic, so its x is corroborated twice and it is the source of every HORIZONTAL number
    here. Where a y had to come off that figure it was mapped through the orthographic panel's scale about
    the panel centre - the check is that the top port row lands at 17.24 mm that way against 17.13 mm
    from fig-0004's band-4, and the bottom row at 31.71 against 31.50.
  chassis: >-
    datasheet - 'Dimensions (WxDxH): 43.84 x 53.6 x 4.31 cm' (dcs510-datasheet/doc.md:103), corroborated
    by the quick-start's hardware specification '438.4 x 536 x 43.1 mm (17.26 x 21.1 x 1.7 in.)' (dcs510-qsg/doc.md:234).
    438.4 is already the BODY between the ear folds - it is not 482/19 in - so nothing is subtracted here;
    the rack ears are drawn as optional placements outside it, at the library's 14 mm.
  chassis-colour: >-
    photo - the chassis is black. The quick-start's line art (fig-0004, fig-0009) renders a light-grey
    shell, and it is the odd one out: the datasheet elevation, all three vendor stock photographs and
    the FRU photographs (fig-0006, fig-0007, fig-0013) show a black chassis with a silver PSU face. Where
    the guide art and the real device disagree the device wins.
  port-positions: >-
    measured - 16 columns of two. Column centres read off the dark port runs in dcs510-datasheet/fig-0007
    panel 0 at 3.2892 px/mm: 47.73, 68.25, 91.81, 112.03, 135.90, 155.81, 179.83, (195.03 clipped), 223.77,
    243.07, 267.85, 287.00, 311.47, 331.39, 355.25, 375.17 mm. The seven GROUP pitches (first column of
    each 2-wide shell to the next) are 44.08, 44.09, 43.93, 43.94, 44.08, 43.62, 43.78 - mean 43.93, spread
    0.17 - and the eight within-shell steps average 19.85. The within-shell pitch modelled is the REGISTRY's
    19.0 (spec/schemas/standards.yaml qsfp-dd states no pitch key, so w IS the pitch and instances abut),
    not the 19.85 measured, per the rule that a ganged pitch is a lookup; the gutter was then solved so
    the LAST column lands where it was measured - 8x19.0 + 7x(19.0+gutter) = 327.44 gives gutter 6.06
    - which keeps the far end of the face exact and absorbs the 0.85 mm/shell difference inside each shell,
    where it is invisible. Row centres 17.13 and 31.50 mm are fig-0004 band-4 and band-6 of the prepared
    band report (panel box [4,30,803,108], 1.8097 px/mm); row-pitch 14.37.
  port-numbering: >-
    drawing - the faceplate prints `n (up)(down) n+1` on ONE baseline between the rows, so odd ports are
    the TOP row and even the bottom, numbered along: '1 (up)(down) 2' under column 1 and '31 (up)(down)
    32' under column 16, read directly in dcs510-qsg/fig-0011 (which resolves 19/20, 21/22, 23/24, 25/26)
    and dcs510-qsg/fig-0012 (31/32). Numeral offsets +/-2.6 mm from the column centre, from fig-0011 at
    5.13 px/mm derived from its own 2-cage shell.
  port-numeral-baseline: >-
    measured - fig-0004 band-5, the light band at 24.31 mm between the two dark port rows, is the printing
    band; the glyphs themselves read 23.8-25.4 mm in the same figure's right-hand block, which puts the
    baseline at 25.2 and the arrow pair's centre at 24.5.
  port-leds: >-
    measured - four lamps per port on a 3.0 mm vertical pitch, in a column beside the cage rather than
    above it. The columns BRACKET each 2-wide shell: the odd column's lamps sit outside it to the left,
    the even column's outside to the right, which is why the offsets are a per-column list. Read at x
    266-277 / y 164,174,184,194 px in dcs510-datasheet/fig-0007 (port 3-4 shell) and independently at
    x 709-712 / y 51,56.5,62,67 px in dcs510-qsg/fig-0004 (port 31-32 shell); the two agree to 0.15 mm
    on the pitch. The columns are pushed AWAY from the numeral baseline - the top row's column centres
    1.05 mm above its port centre, the bottom row's 1.0 mm below - and that asymmetry is measured, not
    assumed. Confirmed by eye in dcs510-qsg/fig-0011, which draws eight lamps per shell boundary in two
    sub-columns.
  timing-block: >-
    measured - four SMA jacks in a 2x2. Column centres 16.4 and 25.7 mm from the gold-nut mask in dcs510-datasheet/fig-0007
    (x clusters 49-76 and 78-107 px); row centres 10.50 and 18.79 mm from dcs510-qsg/fig-0004 (gold rows
    44-54 and 59-69). The measured pitches are 9.3 x 8.3 mm and the drawn nut envelope of common/sma-jack@1
    is 9.5 across flats, which cannot fit them: the block is drawn on the part's own 9.5 pitch about the
    measured block centre (21.05, 14.64), so each jack sits 0.6 mm from where it was read. That is the
    honest version of a nut envelope taken from a different vendor's drawing meeting a jack this figure
    measures at 8.6 mm; a caliper on the real part settles it.
  system-leds: >-
    drawing - Loc, Diag, Fan, PS1, PS2 top to bottom with the Reset pinhole below, read in dcs510-qsg/fig-0005
    (the system-LED zoom, which labels every one) and positioned off dcs510-datasheet/fig-0007 at x 116-121
    px (33.60 mm) on a 3.23 mm pitch: 7.70, 10.93, 14.16, 17.39, 20.63, Reset at 23.86. The LED semantics
    are the quick-start's own list, 'PS1/PS2: Green (OK), Amber (fault) / Diag: Green (OK), Amber (no
    OS or fault) / Fan: Green (OK), Amber (fault) / Loc: Flashing Amber (switch locator)' (dcs510-qsg/doc.md:36-52).
  management-cluster: >-
    measured off dcs510-qsg/fig-0004 at 14x with the figure's own scales, and corroborated in dcs510-qsg/fig-0012
    which labels it. The 1000BASE-T mgmt RJ-45 and the USB-A share ONE silver shell - a combined jack,
    which is why the RJ-45 reads 10.5 mm tall against the console jack's 14.4 mm below it - at x 391.1-407.1,
    the RJ-45 opening ending at 14.0 and the blue USB tongue at 15.4-21.1. Console RJ-45 388.9-406.7 x
    26.2-40.6. The two SFP+ cages 409.4-424.9, at 11.4-22.7 and 26.6-36.1. The legend row 'Mgmt (up)(down)
    Console' and '10G Mgmt' sits at 24.6, on the same baseline as the port numerals.
  sfp-mgmt-leds: >-
    measured - one lamp per SFP+ port, printed as a row `(lamp) (up)(down) (lamp)` ABOVE the top cage
    at y 9.3 mm, lamps at 413.5 and 420.2 mm (dcs510-qsg/fig-0004 at 14x). The up/down pair is the same
    convention the port numerals use, so the left lamp belongs to the upper cage. Semantics from dcs510-qsg/doc.md:100-102,
    'SFP+ 10G Mgmt LEDs: Green (10G) Amber (1G)'.
  rear-layout: >-
    measured - PSU, six fans, PSU. The bright module/chassis boundaries in dcs510-datasheet/fig-0007 panel
    1 (3.2801 px/mm) fall at 65.4 and 371.5 mm, and the fan grilles repeat on a 48.8 mm pitch from 76.2
    (left edges 76.2, 125.0, 173.8 read at 3x). The face is drawn as an exact mirror about 219.2: PSU
    bays 9.0-66.0 and 372.4-429.4, grounding points 1.0-8.0 and 430.4-437.4, six fan bays of the library's
    48.6 mm generic on the measured 48.8 pitch, centred in the span between the supplies. Fans are numbered
    6 to 1 LEFT TO RIGHT, printed between the trays - the same order as the sibling AS7726-32X - read
    in dcs510-datasheet/fig-0007 and dcs510-qsg/fig-0009. PS2 is the left supply and PS1 the right, printed
    on the chassis strip beside each with a left-pointing airflow arrow above.
  rear-ground-points: >-
    drawing - callout 13 of dcs510-datasheet/fig-0007 names a grounding point at each bottom corner of
    the rear face, and dcs510-qsg's FRU list item 7 says '2 x grounding screws' (doc.md:74). The left
    one reads at 7.9 mm centre, under the PSU's release latch; it is drawn at 4.5 so that it does not
    overlap the PSU bay, and the PSU bay starts 2.9 mm right of where the latch reads. Both deviations
    are the same trade and neither exceeds 3 mm.
  port-led-cutouts: >-
    NOT punched, deliberately. common/qsfp-lane-leds-column@1 declares FOUR openings, so expand.py refuses
    to derive one hole for it - deriving from the body would punch a 1.8 x 11.4 slot and claim the metal
    has a slot where it has four windows, which no image held here resolves at 3.3 px/mm. L39 stands on
    all 32 lamps and standing is the correct outcome until somebody reads the metal on a real unit.
  port-led-offset: >-
    each lamp column is CENTRED on its port - dy = (10.0 - 11.4) / 2 = -0.70 on both rows - and that is
    a decision taken AGAINST the measurement, recorded here so the next reader can overturn it with a
    caliper rather than re-deriving it. What the figures show is a lamp block spaced WIDER row to row
    than the cages: in dcs510-qsg/fig-0004 the four lamps of the top row read 11.60, 14.65, 17.68, 20.72
    mm and the bottom row 27.63, 30.66, 33.71, 36.75, so the two columns sit 16.03 mm apart belly to belly
    against the port rows' 14.1-14.4, and the same spread appears in dcs510-datasheet/fig-0007 (top row
    11.54, 14.47, 17.55, 20.63). It is symmetric - the lamp block and the port block share a centre to
    0.2 mm - so it is a spread and not a shift. Drawn on that reading, every lamp column sat 1.0 mm off
    its own port and L61 said so 32 times, which is the same defect a reviewer found by eye on an earlier
    model of this device at 1.35 mm. The reading is not strong enough to defend against that. The port
    ROW PITCH itself reads 13.81 mm from the openings' top edges, 14.37 from their bottom edges and 14.08
    from their centres, because this render lights the top lip of every cage and the bottom row is mirrored
    - so roughly 0.3 mm of the 0.8-1.0 mm offset is the CAGES being measured badly rather than the lamps
    being placed oddly, and the rest rests on peak-finding at 1.8 px/mm. What would settle it is a straight-on
    photograph of one shell at better than 3.3 px/mm.
  fan-numerals: >-
    measured - each numeral sits on the chassis divider to the RIGHT of the tray it names, 6 to 1 left
    to right. The tray body reads 46.7 mm wide on a 48.8 mm pitch in dcs510-datasheet/fig-0007 panel 1,
    so the dividers are ~2.1 mm; the bays are drawn at 46.6 on that pitch and common/fan-module@1 (behaviour:
    fills) takes the bay's width rather than its own 48.6, which is what leaves the metal the numerals
    are printed on. It was drawn twice before that: at common/fan-module@1's own 48.6 the numerals were
    painted under their own trays and L21 said so on all six, and with the bay narrowed under the 48.6
    generic L33 said the module was 2 mm wider than its opening. Both warnings were the drawing telling
    the truth about a part that is the sibling AS7726-32X's tray rather than this one's, so the tray got
    its own contract - common/fan-module-46@1, the same 44.6 mm square on a 2 mm mounting tab instead
    of a 4 mm one, which keeps the rotor round rather than scaling it to fit.
  cutouts: >-
    every hole RESTATES the aperture its occupant already declares, rather than being measured a second
    time: position is the placement's own `at` plus the component's aperture offset, size is the registry
    entry the component `conforms:` to (or the component's own size where it conforms to nothing). The
    32 port holes come out of expand.py that way. Three were hand-written around the visible opening with
    clearance instead - mgmt-eth at 14.4 x 10.4 where common/rj45-eth@1 is 15.8 x 13.2, and the two
    SFP+ cages at 15.0 x 9.2 where common/sfp-plus-cage@2 forwards to std/sfp's 14.5 x 10.0 at an offset
    of [0.75, 0] - and spec/tests/test_cutout_derivation.py failed on all three. They are now derived.
    The measured openings that produced those three numbers are still recorded in `management-cluster`
    above, and where they disagree with the part it is the PART that the drawing follows, because one
    fact recorded twice is a fact the drawing gets to be wrong about.
  panel-decor: >-
    measured - the vent fields. Left column 2.2-5.5 x 6.6-39.2 and right column 432-437.5 full height
    (dcs510-qsg/fig-0004 dark-cell map); the two horizontal bands across the port field are fig-0004's
    band-1 and band-2 above (dark centres 2.76 and 7.74) and the field below band-7 (light centre 37.57).
    The silver shell behind the combined mgmt RJ-45/USB jack is decor rather than a part because it is
    the jack's own shielding shell, not a separate orderable thing; the four small dark rectangles under
    the lower SFP+ cage (410.5-422.7 x 37.9-39.5) are drawn as decor for the same reason - they are punched
    trim, and nothing in either document names them.
  info-tab: >-
    photo - the green pull-out tab at the bottom right of the front face (414.5-431.4 x 40.6-42.5) is
    present in fig-0004, fig-0012 and all three stock photographs. Neither document names it; it is drawn
    as the library's common/pull-tab because that is what it is, and its function is not claimed.
  power: >-
    datasheet - '1300 Watts maximum' for the chassis (dcs510-qsg/doc.md:250, under 'Power Consumption'
    in the Switch Chassis block, so it is DRAW and not supply). The vendor does not qualify it further
    and states no typical, and states no ambient, so it is recorded as power-max-w with the envelope unstated.
    The PSU rating, 1300 W each, is a different number on the other side of the meter and lives on common/psu-ac-1300@1.
  cable-management: >-
    the AC cord retainer bail visible on the PSU in dcs510-qsg/fig-0006 is not drawn - it is an accessory
    rather than a panel fact.
  lifecycle: >-
    searched and found nothing. One web search, 'Edgecore DCS510 AS9716-32D end of life end of sale announcement'
    (2026-08-28), returned Edgecore's 2020 Q4 and 2022 July EOL notices - neither of which names this
    model - alongside a live product page and a datasheet revision R11 dated July 2026. So `eol: none-announced`
    here means the vendor has announced nothing, not that nobody looked.
  views: >-
    six views. Front and rear are modelled from the elevations above. Top, bottom, left and right are
    sized from the datasheet triple and carry only what a photograph of a closed 1RU lid can support:
    the top's lid seam and rear vent strip and the sides' rail lines are ESTIMATED from the stock three-quarter
    photograph (photos/dcs510-1) and are marked as such. No document in the intake dimensions anything
    on those four faces.
attrs:
  performance:
    switching-capacity: 12.8 Tbps (25.6 Tbps full duplex)
    forwarding-rate: 7.93 Bpps
    packet-buffer: 64 MB integrated
    jumbo-frames: up to 9 Kbytes
    mac-table: 8 K (NOS-dependent)
    vlan-ids: 4 K (NOS-dependent)
    l3-host-table: IPv4 UC 16 K / IPv4 MC 8 K / IPv6 UC 8 K / IPv6 MC 4 K (NOS-dependent)
    port-modes-qsfpdd: 1x 400G, 1x 100G, or breakout 4x 100G / 4x 25G
  power: {power-max-w: 1300, power-envelope: unstated, power-input-ac: '100-240 VAC, 50-60 Hz', power-input-ac-current: 12
      A max at 100-120 VAC; 7.5 A max at 200-240 VAC, power-input-dc: '190-310 VDC, 8-5 A'}
  thermal:
    airflow: front-to-back and back-to-front SKUs (matched PSU and fan modules)
  environmental: {temperature-operating: 0 C to 45 C (32 F to 113 F), temperature-storage: -40 C to 70
      C (-40 F to 158 F), humidity-operating: 5% to 95% non-condensing}
  platform: {asic: Broadcom BCM56980 Tomahawk 3, cpu: 'Intel Xeon D-1518, 4-core', memory: 16 GB DDR4
      (2x 8 GB SO-DIMM), boot-flash: 2x 16 MB SPI, storage: 50 GB M.2 SSD (MLC), software: 'ONIE installer,
      open-source and commercial NOS options'}
  features:
    vendor-alias: AS9716-32D
    optics-qsfp-dd: >-
      400GBASE-SR8/DR4/FR4, 400G-DAC/AOC, 100GBASE-SR4/CWDM4/LR4, 100G-DAC/AOC, 40GBASE-SR4/LR4, 40G-DAC
  management:
    mgmt-ports: >-
      1x RJ-45 console, 1x RJ-45 1000BASE-T, 2x SFP+ 10G, 1x USB-A storage, 10 MHz / 1PPS / ToD timing
  compliance:
    emc: >-
      EN 55032 Class A, EN 61000-3-2, EN 61000-3-3, FCC Class A, VCCI Class A, BSMI Class A, ICES-003
      Class A, AS/NZS CISPR32 Class A, CISPR 32/24/35
    immunity: EN 55024/55035, IEC 61000-4-2/3/4/5/6/8/11
    safety: >-
      UL (CSA 22.2 No 62368-1 & UL62368-1), CB (IEC/EN60950-1 & IEC/EN 62368-1), BSMI CNS15598-1, EN60950/UL60950,
      CE Mark, CCC
    nebs: GR63-CORE (Pre-test)
    rohs: RoHS-2.0 compliant; WEEE Directive 2002/96/EC
  lifecycle: {eol: none-announced}
chassis: {width: 438.4, height: 43.1, depth: 536.0, ru: 1, weight-kg: 11.06, color: '#2b2f33'}
gaps:
- what: reset-area-legend
  scope:
  - front
  reason: needs-photo
  wanted: >-
    A small mark sits between the Reset button and the ToD jack in dcs510-datasheet/fig-0007 and is unresolved
    at 3.3 px/mm. It could be the ToD port's own legend or an ESD-point symbol. Nothing is printed there
    rather than guess: the QSG's system-LED zoom (fig-0005) crops it away and the stock photographs are
    too small. A straight-on bench photograph of the left-hand end of the faceplate settles it.
- what: tod-port-legend
  scope:
  - front
  reason: needs-photo
  wanted: >-
    Every other port on this face carries printing and the ToD jack appears to as well, but no held image
    resolves it. Same photograph as above.
- what: fan-tray-power-draw
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    Neither document gives a per-fan or per-tray figure; the only wattage either states is the chassis's
    own 1300 W maximum. Edgecore publishes no technical-specifications appendix for this model. L29 stands
    on common/fan-module@1 and the chassis module total is a floor.
- what: rear-product-label-position
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    The quick-start's FRU list names 'Product label' as callout 4 (dcs510-qsg/doc.md:71) and dcs510-qsg/fig-0008
    reproduces the barcode itself, but neither rear elevation resolves where on the face it is applied.
    Not drawn rather than placed by guess.
- what: minor-face-geometry
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    Sized from the datasheet triple and given only what the stock three-quarter photograph supports -
    a lid seam, a rear vent strip and the side rail lines, all estimated. No mechanical drawing in the
    intake dimensions a single feature on these four faces.
groups:
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
  qsfpdd-leds: {term: LED, role: indicator, index-origin: 1}
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the frequency and phase reference block at the left-hand end of the faceplate - 10 MHz IN/OUT and
      1PPS IN/OUT on SMA, and Time-of-Day on a shielded RJ-45. Three media, one job: they synchronise
      this switch to an external clock and they are the only ports on the box that carry no data.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster at the right-hand end of the faceplate - the out-of-band 1000BASE-T RJ-45,
      the RS-232 console, two SFP+ 10G management uplinks and a USB-A service port. Four media, one job;
      the vendor draws them as one block under one legend and so do we.
  leds: {term: LED, role: indicator, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: '2 pcs 1+1 redundant, load-sharing, hot-swappable 1200 W AC'
  fans: {term: Fan, role: service, index-origin: 1}
  grounding: {term: Point, role: furniture, index-origin: 1}
  furniture:
    term: Item
    role: furniture
    index-origin: 1
    description: the rack ears and the pull-out information tab - things you neither connect to nor read.
