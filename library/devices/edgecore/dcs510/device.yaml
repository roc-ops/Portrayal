configurations:
  ac-f2b:
    kind: base
    default: true
    airflow: front-to-back
    description: >-
      Dual 1300 W AC PSUs and six fan trays with front-to-back airflow, shipped with red release latches
      and red fan handles. This is a fixed 1RU switch, so the base configuration is the box as it is bought
      - supplies and fans populated, cages empty.
    part-numbers:
      9716-32D-O-AC-F-US: {part: FP5ZZ8632400A, power-cord: N. America}
      9716-32D-O-AC-F-EU: {part: FP5ZZ8632200A, power-cord: EU}
      9716-32D-O-A C-F-UK: {part: FP5ZZ8632300A, power-cord: UK}
      9716-32D-O-AC-F-JP: {part: FP5ZZ8632500A, power-cord: JP}
  ac-b2f:
    kind: orderable
    airflow: back-to-front
    description: >-
      Dual 1300 W AC PSUs and six fan trays with back-to-front airflow. The quick-start guide distinguishes
      the two SKUs by latch and handle colour - 'Remove front-to-back (F2B) airflow fan trays (red handles)
      and PSUs (red release latches). Install back-to-front (B2F) airflow fan trays (blue handles) and
      PSUs (blue release latches)' (dcs510-qsg/doc.md:116-120) - so this configuration is the same geometry
      in the blue skins.
    skins: {psu-ac-1300: blue, fan-module-46: blue}
    part-numbers:
      9716-32D-O-AC-B-US: {part: FP5ZZ8632401A, power-cord: N. America}
      9716-32D-O-AC-B-EU: {part: FP5ZZ8632201A, power-cord: EU}
      9716-32D-O-A C-B-UK: {part: FP5ZZ8632301A, power-cord: UK}
      9716-32D-O-AC-B-JP: {part: FP5ZZ8632501A, power-cord: JP}
