gaps:
- what: psu-and-fan-part-numbers
  scope:
  - psus
  - fans
  - edgecore/psu-ac-1300@1
  reason: vendor-silent
  note: >-
    NEITHER DOCUMENT NAMES A PSU OR FAN FRU. The datasheet's Ordering Information table sells the chassis
    by airflow and region only - seven rows, 9716-32D-O-AC-{F,B}-{US, EU,UK,JP} against part numbers FP5ZZ86324xxA
    and friends - and lists no supply or fan tray as a separate orderable. The QSG's FRU Replacement page
    counts them ('5. 2 x AC PSUs, 6. 6 x fan trays') and tells you to match airflow direction, but names
    no SKU. The sibling AS7726-32X datasheet DOES list its 650 W supply as a FRU with a part number, so
    this is a gap in this model's documents rather than a vendor policy. The configurations below therefore
    carry chassis part numbers and no component-attrs
  wanted: >-
    the DCS510 FRU or accessory price list, or a datasheet revision whose ordering table lists the 1300
    W supply and the fan tray
- what: port-lamp-semantics
  scope:
  - port-leds
  - edgecore/qsfpdd-lane-leds@1
  reason: vendor-silent
  note: >-
    The QSG's Port LEDs page gives the four lamps their COLOURS per breakout mode - 400G one blue, 200G
    one white plus one or two green, 100G one to four green, 50G one cyan - and never says what lit means.
    Link? Activity? Lane up? No table in either document declares the vocabulary, so the lamps keep the
    library's off/on default and the colour mapping is transcribed into attrs.features as prose rather
    than invented as states. The same silence covers whether lamp 1 is lane 1
  wanted: a DCS510 NOS LED reference, or a QSG revision with a per-state port LED table
- what: side-top-bottom-elevations
  scope:
  - left
  - right
  - top
  - bottom
  reason: needs-drawing
  note: >-
    The four non-port faces are sized from the datasheet triple and carry nothing drawn, because nothing
    published shows them square-on. What is visibly there and NOT modelled: the QSG mounting figures show
    bracket screw holes down each side and a product label on the lid, both in three-quarter view at unknown
    scale. Drawing them would be placing furniture at guessed coordinates on four faces at once
  wanted: >-
    a mechanical drawing, or bench photographs of the lid, underside and both sides square-on with a scale
    in frame
- what: chassis-power-figure-scope
  scope:
  - power
  reason: vendor-silent
  note: >-
    'Power Consumption 1300 Watts maximum' is the QSG's Switch Chassis row, and 1300 W is also the nameplate
    output of ONE of the two supplies ('redundant 1300 W PSUs'). The document does not say what was installed,
    at what ambient, or whether the figure is a measured draw or the supply rating restated. It is transcribed
    as power-max-w because that is what the vendor prints under a consumption heading, and this entry
    is the record that the coincidence with the PSU rating was noticed and not resolved. It is not reconciled
    against the module total and must not be
  wanted: a DCS510 power-consumption table qualifying the figure by configuration and ambient
groups:
  qsfpdd-400g:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the timing cluster at the left-hand end of the faceplate - 10 MHz and 1PPS reference IN and OUT
      on SMA coax jacks, and a Time-of-Day RJ45. Two media, one job: the QSG groups them under one heading,
      'Connect Timing Ports', and the datasheet's callouts 1 and 6 name them together
  status-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster at the right-hand end of the faceplate - the out-of-band 1000BASE-T RJ45,
      the RS-232 console, a USB-A service port, two 10G SFP+ management uplinks, and the reset button
      beside the status lamps. Four media and a button, one job; the QSG draws them as one block under
      'Make Management Connections' and so do we. `media` and `speed` sit on the placements, where the
      indexer reads them exactly as it reads group attrs
  psus: {term: PSU, role: service, index-origin: 1}
  fans: {term: Fan, role: service, index-origin: 1}
  grounding: {term: Point, role: furniture, index-origin: 1}
  furniture: {term: Item, role: furniture, index-origin: 1}
