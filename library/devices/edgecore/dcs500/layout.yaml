format: 1
kind: device
name: dcs500
version: 2.0.1
maturity: modelled
manufacturer: Edgecore
model: DCS500
aliases:
- name: AS7816-64X
  kind: vendor
  note: >-
    Drawn as the OZ series, whose ports, fans and supplies number from zero; the O series
    numbers from one.
portfolio: {line: Data Center, family: Data Center Switch, series: DCS500}
description: >-
  64 x 100G QSFP28 2RU top-of-rack or spine switch (vendor alias AS7816-64X, OZ series),
  Broadcom BCM56970 Tomahawk 2 with an Intel Xeon D-1518, ONIE-preloaded. Every port is on
  the front, in sixteen 2x2 ganged cages; two 850 W AC supplies sit in the rear's lower
  corners either side of four 3+1 fan trays, in either airflow direction. Port, fan and
  PSU numbering start at zero on this series.
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the rule, not an observation,
      so a photograph of the stack overturns it: the 32 QSFP pairs (port-0/port-1 to
      port-62/port-63). 32 of these were drawn with the upper cage turned before the std cage art
      moved its lip to the bottom of the opening; turning them keeps the lips in the middle band
      where they were drawn and seats every optic bail-outward.
  sources:
    confidence: datasheet
    note: >-
      Two documents, both docling-converted. dcs500-datasheet (the DCS500 / AS7816-64X data
      sheet) carries the spec list, the nine-callout Interfaces table, the ordering table and
      on page 2 a colour front and rear elevation, 1004 px wide each. dcs500-qsg (the
      AS7816-64X quick start guide, six pages) carries small line-art front and rear
      elevations (600 and 591 px), an enlargement of the front's left end at 8.68 px/mm, a
      DC terminal-block figure and the hardware specification table. Both letter the
      artwork AS7816-64X, this device's vendor alias. The guide carries the vendor's
      standard 'drawings ... are for illustration only' disclaimer, which turns out to
      matter here - see the numbering note.
  figure-choice:
    confidence: measured
    note: >-
      Gate 1, and the datasheet's two elevations are not equally trustworthy.
      THE REAR IS SQUARE: panel 999 x 199 px, aspect +0.42% against 438.4/87.7, 2.279 px/mm
      on x and 2.269 on y. THE FRONT IS NOT AND IS CROPPED FLUSH: its ink fills the whole
      1004 x 198 image, +1.44% on aspect. So the front's box was not trusted as the body
      until something else said so.
      A SCALE-FREE RATIO SAYS SO. The first-to-last cage-block span, divided by panel width,
      reads 0.7271 on the datasheet front and 0.7281 on the guide's front - whose own box is
      square to 0.15% - so the datasheet image IS the full width and x scales at 2.290 px/mm.
      Its HEIGHT is the part that is short: the guide puts the two cage strips 0.340 and
      0.677 of the way down the panel, the datasheet 0.359 and 0.692, the pattern of about
      1.5 mm cropped off the datasheet's top edge. So every vertical position is the
      datasheet's pixel distance at its x scale, anchored so the midline between the two
      cage strips falls where the guide puts it, at 44.6 mm.
      ORTHOGRAPHIC: the sixteen column centres fit x = first + pitch*i + gutter*(i//2) to
      0.57 px rms, and a quadratic term buys 0.27 px - under 0.9% across the whole row.
  chassis:
    confidence: datasheet
    note: >-
      DATASHEET 'Dimensions (WxDxH): 43.84 x 58.0 x 8.77 cm (17.26 x 22.83 x 3.45 in)' and the
      guide's 'Size (WxDxH) 438.4 x 580 x 87.7 mm' - two documents, one triple. 438.4 is the
      body; the ears are placed outside it.
  weight:
    confidence: datasheet
    note: >-
      '14.11 kg (31.1 lb)' in the datasheet, and the guide qualifies the same figure 'with
      two installed PSUs', so it is the populated machine.
  port-pitch:
    confidence: registry
    note: >-
      The registry's ganged-QSFP 19.00 is carried. With the pitch free the fit reads 19.08,
      rms 0.30 mm, worst column 0.69; pinned to 19.00 the rms is unchanged and the worst
      column's residual is 0.73 - pinning costs 0.04 mm.
      The gutter between cages is measured, 7.52, and the row pitch inside a cage 14.62 -
      14.19 across the band between the upper and lower cages.
  numbering:
    confidence: datasheet
    note: >-
      THE DATASHEET SELLS TWO SERIES THAT DIFFER IN WHAT IS PRINTED. Its ordering table's
      AS7816-64X-OZ base model says 'port, fan and PSU numbering start at zero'; the
      AS7816-64X-O base model says 'start at one', and Interfaces callouts 7 and 9 give both
      PSU namings side by side. Issue #330 asks for the zero-based declaration, and the OZ
      is the base model listed first, so this is the OZ: ports 0-63, PSU 0 and 1, fans 0-3.
      THE DRAWINGS DO NOT AGREE WITH EACH OTHER. The datasheet's elevations are the O
      series - ports 1..64, 'PSU 1' and 'PSU 2', fans 4..1. The guide's front enlargement is
      the OZ - '1 (up) (down) 32', '33', '35', 'PSU 0', 'PSU 1' - which is the silkscreen
      modelled here. But the guide's own REAR prints fans 4..1, one-based, on the same page
      set whose front is zero-based. The words beat the drawings: fans are 0..3, printed
      right to left, and the disagreement is a gap.
      THE ORDER IS COLUMN-MAJOR WITHIN EACH HALF. The upper cages' top row carries the even
      ports 0..30 and their bottom row the odd 1..31; the lower cages carry 32..62 over
      33..63. The between-cage band prints each column as 'n (up) (down) m' - the upper
      cage's lower port and the lower cage's upper one - and the outer rows are numbered
      above and below.
  port-leds:
    confidence: photo-measured
    note: >-
      FOUR ROUND LAMPS PER PORT ON THE OUTER ROWS, measured at 8.68 px/mm on the guide's
      enlargement - see edgecore/dcs500-lane-leds@1. They sit on the faceplate above the
      top row (centres at 13.4 mm) and below the bottom row (76.7 mm), centred on their
      columns, which the datasheet's elevation confirms at its own resolution.
      THE TWO INNER ROWS' LAMPS ARE NOT LOCATED and are not drawn - see the gap. The band
      between the cages carries only the 'n (up) (down) m' legend at every magnification
      either document offers.
  cage-frames:
    confidence: photo-measured
    note: >-
      Each 2x2 ganged cage is drawn inside a bright metal frame, measured at 5x on the
      datasheet's front for the first block - x 29.3-69.0, y 17.3-42.6 for the upper cage
      and 47.0-72.3 for the lower - and repeated on the block lattice. The white strip across
      each frame's middle is the cage's belly between its two ports.
  arrows-and-lamp-cutouts:
    confidence: photo-measured
    note: >-
      TWO LINT RULES STAND ON PURPOSE. L61 x 16: each between-cage arrow pair sits 0.93 mm
      left of its column, which is where the guide's 8.68 px/mm enlargement puts it - the
      up-arrow 3.0 mm left of centre and the down-arrow 1.15 mm right, hugging a one-digit
      numeral on the left and a two-digit one on the right. Centring it would be tidier and
      wrong. L39 x 32: the outer-row lamp part declares four openings, and the toolchain
      deliberately does not guess whether they are four holes or one slot - the same
      standing warning the COR580 (24) and COR550 (40) carry. The side-face rails are
      ESTIMATED: neither document draws a side, and two recessed rails are this shell
      family's usual sheet-metal return.
  front-ends:
    confidence: photo-measured
    note: >-
      LEFT END, at 5x on the datasheet and checked against the guide's enlargement: the
      Reset pinhole at (23.1, 42.6) under its legend, and five system lamps in a column at
      x 23.1 - Loc, Diag, Fan, PSU 0, PSU 1 - at y 51.8, 54.7, 57.6, 60.8 and 63.9, their
      legends right-aligned 1.7 mm to the left. A honeycomb vent field runs down the edge
      below them.
      RIGHT END: the Mgmt RJ-45 stacked over the Console RJ-45 in one bezel at x 391.7
      (17.0 x 24.9), legended Mgmt above and Console below; the USB-A standing on end at
      (414.4, 27.8), 6.1 x 14.0 with its trident beneath; another honeycomb edge vent; and
      the pull-out product tab at the bottom right, drawn orange in the guide.
      THE PORT FIELD SITS ON A LIGHTER PLATE: sampled #35373c against the outer panel's
      #2d2d31, its edges at x 9.4 and 386.9 and y 11.2 and 73.2 on the datasheet's profiles.
      The upper lamp row is on it; the lower lamp row, the lower numerals and both
      perforation rows are on the outer panel. The management cluster is off it.
      THE MGMT JACK IS LAMPED AND THE CONSOLE IS NOT. The datasheet states 'Management Port
      LED: Green (10M/100M/1G), Flashing: Activity' and nothing for the console, which is
      also L76's Ethernet-lamped, console-bare convention.
  perforation:
    confidence: photo-measured
    note: >-
      A row of round holes runs along the top and the bottom of the port field (y 8.8 and
      82.5, x 28.7-388.8), and a denser perforated patch sits at the very top of the middle
      of the panel on the guide's front, x 119.6-296.6 - which the datasheet's front cannot
      show, its top 1.5 mm being cropped. Holes 2.2 mm on a 3.06 mm pitch on the rows, measured at 5x; the patch's
      pitch does not resolve at 1.36 px/mm and is drawn as fine perforation.
  rear:
    confidence: photo-measured
    note: >-
      MEASURED on the datasheet's rear at 2.279 px/mm. The supplies sit in the LOWER
      corners, housings x 18.9-69.8 and 367.7-418.6, y 45.8-85.1. The four fan trays fill
      the middle on a 68.32 mm pitch fitted on the webs between them - see
      edgecore/dcs500-fan@1 - from x 88.58, y 22.9-85.5. Above each supply a grounding
      plate carries two screws under a ground symbol, and the upper band carries each
      tray's numeral. The chassis prints each supply's name above its outer top corner.
