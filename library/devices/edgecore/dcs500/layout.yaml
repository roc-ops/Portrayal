  lifecycle: {eol: none-announced}
chassis: {width: 438.4, height: 87.7, depth: 580.0, ru: 2, weight-kg: 14.11, color: '#2d2d31',
  airflow: front-to-back}
gaps:
  - what: o-series-numbering
    scope: [front, rear]
    reason: sources-disagree
    wanted: >-
      THE ONE-BASED AS7816-64X-O SERIES IS NOT MODELLED, and the documents disagree about
      which numbering they draw. The ordering table sells two base models whose only
      stated difference is that the O prints ports, fans and supplies from one and the OZ
      from zero; it also offers the 48 V DC supply only in the O series. The datasheet's
      elevations are the O, the guide's front enlargement is the OZ, and the guide's rear
      prints fans 4..1 beside a front that says PSU 0. This device is the OZ and prints fans
      3..0 on the datasheet's word. A second device, or a silkscreen that can vary by
      configuration, would carry the O; a photograph of a real OZ rear settles its fan
      legend.
  - what: inner-row-port-leds
    scope: [front]
    reason: needs-photo
    wanted: >-
      WHERE THE LAMPS OF THE TWO INNER PORT ROWS ARE. The vendor states four lamps per port
      and the outer rows show them, four round lamps above the top row and below the
      bottom. The inner rows - the upper cages' bottom row and the lower cages' top row -
      show none in either document: the band between the cages carries only the numeral
      and arrow legend, and each cage's white belly strip carries six round features per
      column, which is neither four nor eight and matches the cage's own light-pipe and
      vent pattern. 32 ports' lamps are therefore not drawn. A close photograph of one
      column of a real unit would settle it.
  - what: fan-handle-colour-by-airflow
    scope: [rear]
    reason: vendor-silent
    wanted: >-
      WHETHER THE BACK-TO-FRONT BUILD'S FAN HANDLES ARE A DIFFERENT COLOUR. Both airflows
      are orderable (-F and -B) and every rear either document draws has red handles.
      Other Edgecore lines colour the reverse build blue, but a sibling family's convention
      is not evidence for this one, so both configurations draw red.
  - what: fan-and-psu-ordering-codes
    scope: [rear]
    reason: vendor-silent
    wanted: >-
      FRU CODES FOR THE FAN TRAY AND THE 850 W SUPPLY. The ordering table lists chassis
      SKUs only; the guide's replacement text names no part. Both FRUs are named for the
      chassis because no code exists to use instead.
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
  port-leds: {term: LED, role: indicator, index-origin: 0}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the right-hand end of the faceplate - the 1000BASE-T management RJ-45 stacked over the
      RS-232 console RJ-45 in one bezel, and a USB-A storage port beside them.
  leds: {term: LED, role: indicator, index-origin: 1}
  buttons: {term: Button, role: service, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: redundant, load-sharing, hot-swappable
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '3+1'
      redundancy-note: 3+1 redundant, hot-swappable fan modules
  grounding: {term: Point, role: furniture, index-origin: 0}
  furniture:
    term: Item
    role: furniture
    index-origin: 1
    description: the rack ears and the pull-out product tab.
