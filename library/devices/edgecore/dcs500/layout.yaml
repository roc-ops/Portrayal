configurations:
  base:
    kind: base
    default: true
    description: >-
      The chassis as it ships: two 850 W AC supplies and four fan trays in, every cage
      empty. THE AIRFLOW IS WHAT THE ORDERING CODES VARY, so the two orderable builds below
      carry it - ten OZ codes, five front-to-back and five back-to-front across five power
      cord regions - and nothing else in the table differs.
  ac-f2b:
    kind: orderable
    description: >-
      Dual 850 W AC supplies, front-to-back airflow - the -F ordering codes.
    part-numbers:
      7816-64X-OZ-AC-F-US: {part: FP3AT7664403A, power-cord: US}
      7816-64X-OZ-AC-F-EU: {part: FP3AT7664200A, power-cord: EU}
      7816-64X-OZ-AC-F-UK: {part: FP3AT7664300A, power-cord: UK}
      7816-64X-OZ-AC-F-JP: {part: FP3AT7664500A, power-cord: JP}
      7816-64X-OZ-AC-F-UN: {part: FP3AT7664004A, power-cord: UN}
  ac-b2f:
    kind: orderable
    airflow: back-to-front
    region-context: {intake: Exhaust, exhaust: Intake}
    description: >-
      Dual 850 W AC supplies, back-to-front airflow - the -B ordering codes. BOTH faces'
      airflow regions swap: the front becomes the exhaust and the rear the intake. No handle
      colour is overridden: every rear either document draws is red, and neither shows a
      -B unit; see the fan-handle-colour-by-airflow gap.
    part-numbers:
      7816-64X-OZ-AC-B-US: {part: FP3AT7664402A, power-cord: US}
      7816-64X-OZ-AC-B-EU: {part: FP3AT7664201A, power-cord: EU}
      7816-64X-OZ-AC-B-UK: {part: FP3AT7664301A, power-cord: UK}
      7816-64X-OZ-AC-B-JP: {part: FP3AT7664501A, power-cord: JP}
      7816-64X-OZ-AC-B-UN: {part: FP3AT7664005A, power-cord: UN}
