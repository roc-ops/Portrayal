configurations:
  base:
    kind: base
    description: >-
      The chassis as it ships: two supplies and four fan trays in, all sixty-six cages
      empty. There is only one ordering code, so this is also the only build.
    default: true
  ac-f2b:
    kind: orderable
    description: >-
      The only ordering code the datasheet publishes - dual AC PSUs, front-to-back airflow,
      shipped with a cord that is an HVAC/IEC C20 at the wall and a Saf-D-Grid at the
      supply.
    part-numbers:
      AS9736-64D-O-AC-F: {part: FP5ZZ8664004A, power-cord: 'HVAC to IEC 60320 C20 (1 m)'}
