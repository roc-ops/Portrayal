  airflow: front-to-back}
gaps:
- what: fan-tray-identity
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    A FAN FRU NUMBER FOR THIS MODEL. `edgecore/dcs520-fan@1` was written as its own part
    and it very probably is not one: the three other devices on this shell all seat a tray
    whose FRU number `FAN-2U-1x1SN-F` is printed in all three of their datasheets, and this
    machine's trays sit on a mean pitch of 85.58 against their uniform 85.71 - thirteen
    hundredths of a millimetre - with the same honeycomb, the same angled red bar with two
    pairs of slots and a central button, and the same corner lamp.
    THE MEASUREMENTS ARGUE FOR ONE PART MEASURED TWICE, NOT FOR TWO PARTS. The three gaps
    here run 85.54, 85.64 and 85.55, a spread of a tenth of a millimetre, where the other
    three chassis repeat 85.71 with no spread at all; and this face is 80.1 x 83.5
    `measured` against the shared tray's 81.6 x 81.2 `photo-measured`, a disagreement of
    1.5 x 2.3 mm. Irregular spacing and a face that misses by more than the pitch does are
    what pixel-measuring a drawing produces beside a dimensioned source. Two rulers, not
    two trays.
    NEITHER DCS520 DOCUMENT PRINTS A FAN PART NUMBER, so the argument that settled the
    other three is unavailable, and the drawings cannot settle it either: scaled to a
    common size and normalised, 46% of pixels differ by more than a standard deviation, but
    that is this guide drawing the tray bright with the rotor showing through the mesh
    against the AIS800 guides drawing it dark. A test that cannot tell a different part
    from different lighting decides nothing.
    One FRU list closes this. If it names `FAN-2U-1x1SN-F`, delete this component and seat
    the shared one.
- what: the-reset-button
  scope: [front]
  reason: needs-drawing
  wanted: >-
    WHERE THE RESET BUTTON IS. The datasheet's System and Port LEDs section ends with the
    bare line "Reset button", and neither document draws one that can be found: the guide's
    Overview callouts run 1-9 and none of them is a button, its System/Port LEDs
    enlargements cover the left end, the port field and the right cluster without showing
    one, and at 8.87 px/mm the datasheet photograph resolves the pinholes it does have -
    the grounding screws, the PSU status lamps - without any obvious candidate on the port
    side. So the device is modelled without it rather than with one guessed onto a plausible
    patch of metal. An enlargement of either end of the front panel closes this.
- what: port-lamp-strip-position
  scope: [front]
  reason: needs-drawing
  wanted: >-
    THE EXACT OFFSET OF THE LANE-LAMP STRIP FROM ITS CAGE. Four lamps per port is stated
    outright by the guide, the strip is visible on the posts in its enlargements, and its
    HEIGHT measures well - about 10.85 mm over four windows on a 3.5 mm pitch, which is why
    `common/qsfp-lane-leds-column@1` fits it. Its x is the soft number: the enlargement
    puts the strip about 10.7 mm right of the column centre while the post it stands in
    spans 9.05 to 14.8, and the panel's two scales - 11.94 px/mm read across the columns
    against 10.53 read down the rows - do not agree well enough to choose inside that
    range. 11.0 is used and the render was checked against the reference at matched scale.
    A dimensioned faceplate drawing, or one enlargement with a known length in it, closes it.
groups:
  qsfp56dd:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the sixty-four 400G QSFP56-DD ports, in TWO BANKS OF SIXTEEN STACKED COLUMNS on a
      single 23.868 mm pitch with no ganging - ports 1-32 the upper bank and 33-64 the
      lower, numbered down each column from 1 at the top left, with the legend
      `N (up)(down) N+1` printed BETWEEN the two cages of its column.
      SIXTEEN OF THEM ARE 24 W PORTS - 1-4, 29-36 and 61-64, the first two and last two
      columns of each bank - and the datasheet names them individually. The other
      forty-eight are 13 W. The extra watts buy DAC reach: 2.5 m against 1 m.
    attrs: {media: qsfp-dd, speed: 400g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the machine's management interfaces. TWO 10G SFP+ CAGES at the left of the face,
      which both documents call management ports and which the panel numbers 65 and 66 -
      into the same sequence as the sixty-four traffic ports, labelled above and below
      their block rather than between its rows. Then, stacked vertically at the right of
      the face, an RJ-45 console port, a 10/100/1000M RJ-45 management port whose own lamps
      the guide legends "Left: link, Right: activity", and a USB storage port.
      THE SFP+ PAIR IS WRITTEN LONGHAND rather than generated, because a block would set
      each port's position in its group from its printed number and these two are 65 and 66
      in a group of five.
      WHAT RUNS IN THEM: 10G SFP+, with the guide's lamp legend giving them 10G and 1G
      states - "Left: Green (10G link), Amber (1G link); Right: Green (10G activity), Amber
      (1G activity)". No optics table is published for this pair and none is invented; it is
      recorded here rather than as an `optics-` attribute because these cages are in the
      management group, which is what both documents call them.
  leds: {term: LED, role: indicator, index-origin: 1}
  grounding: {term: Point, role: service, index-origin: 1}
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        datasheet: "PSUs: 2 redundant, load-sharing, hot-swappable 2400 W AC/HVDC power
        supplies", each 2400 W against a stated maximum draw of 2100 W. AT 200-240 VAC OR
        240 VDC THAT IS A GENUINE 1+1 and the guide says one supply will do: "install one or
        two AC PSUs". AT 100-127 VAC IT IS NOT - "two AC PSUs must be installed" - so the
        claim here is the high-line one.
        THE TWO ARE MOUNTED THE OPPOSITE WAY UP from each other, which is the guide's own
        instruction rather than a drawing artefact: "PSU 1 AC socket faces down, and PSU 2
        AC socket faces up."
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '3+1'
      redundancy-note: >-
        datasheet, three times over - key features, physical section and interfaces table:
        "3 + 1 redundant, hot-swappable fan modules". FOUR BAYS AND THE FIGURE COUNTS BAYS,
        which is not true of the two AIS800 models on this same shell, where a "7+1" counts
        eight rotors inside four trays. Same chassis, same tray size, two different things
        counted.
