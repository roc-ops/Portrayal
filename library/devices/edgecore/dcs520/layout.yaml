kind: device
name: dcs520
version: 1.0.4
maturity: modelled
manufacturer: Edgecore
model: AS9736-64D
portfolio: {line: Cloud Data Center, family: Data Center Switch, series: DCS520}
description: >-
  64 x 400G QSFP56-DD 2RU spine switch on a Broadcom Tomahawk 4 with an Intel Xeon D-1548,
  sold as the DCS520 and stamped AS9736-64D. ALL PORTS ARE ON THE FRONT in TWO BANKS OF
  SIXTEEN STACKED COLUMNS, numbered from 1, with the legend `N (up)(down) N+1` printed
  BETWEEN the two cages of each column. Two 10G SFP+ management cages at the left are
  ports 65 and 66; five system lamps stand in a column above them; an RJ-45 console, an
  RJ-45 management jack and a USB Type-A stack at the right. SIXTEEN OF THE SIXTY-FOUR ARE
  24 W PORTS and the datasheet names them one by one. It is the fourth device on the
  440 x 649.2 x 87 shell and THE ONLY ONE OF THE FOUR WHOSE REAR PUTS A SUPPLY AT EACH END
  with the four fan trays between them - the AIS800-64D, the AIS800-64O and the AGR560 all
  stack two supplies at the left. One shell, two rear architectures.
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the rule, not an observation,
      so a photograph of the stack overturns it: the 32 QSFP-DD pairs (port-1/port-2 to
      port-63/port-64), the 1 SFP pair (port-65/port-66).
  sources:
    confidence: datasheet
    note: >-
      A THREE-PAGE QUICK START GUIDE AND A FOUR-PAGE DATASHEET, and between them they cover
      this device well. The guide carries the Overview elevations of both faces, a
      System/Port LEDs page whose three enlargement panels are the instrument for the lamps
      and the numbering, the FRU replacement steps and the specification table. The
      datasheet carries photographs of both faces, the interfaces table, the power ratings,
      the per-port power list and the single ordering code.
      THE STAGED PHOTOGRAPHS ARE USELESS AND WERE NOT USED: four files at 489 x 357 px over
      a 440 mm face is 1.1 px/mm. Everything below is measured on 600 dpi PAGE RENDERS.
  gate-1:
    confidence: measured
    note: >-
      FOUR CANDIDATE INSTRUMENTS WERE MEASURED BEFORE ONE WAS CHOSEN, and three pass.
      The guide's FRONT elevation reads 2217 x 441 px - 5.0386 px/mm across 440 and 5.0690
      down 87, -0.598% apart. Its REAR reads 2222 x 442: 5.0500 and 5.0805, -0.600%. The
      datasheet's FRONT photograph reads 3901 x 776: 8.8659 and 8.9195, -0.601%, which is
      1.76x the guide and is the primary instrument for the port wall.
      THREE INSTRUMENTS AGREEING ON ASPECT TO 0.003% is one CAD source seen three ways, and
      it is worth saying that the agreed figure is -0.6% rather than zero: the drawings are
      consistently a little wide for 440 x 87, and that bias is in all of them.
      THE DATASHEET'S REAR PHOTOGRAPH FAILS at -1.33% and was NOT discarded but recalibrated:
      its bbox includes the rack-ear tabs that stand proud of the body top and bottom, so
      rear measurements taken on it are scaled on the chassis width alone and every number
      is a feature measurement. The guide's rear elevation is the rear's primary instrument.
  the-port-wall:
    confidence: measured
    note: >-
      SIXTY-FOUR QSFP56-DD IN TWO BANKS OF SIXTEEN STACKED COLUMNS - ports 1-32 in the
      upper bank and 33-64 in the lower - which is the AIS800-64D's architecture on the
      same shell.
      THE COLUMN PITCH WAS FITTED THREE TIMES, on three separate rows of the datasheet
      photograph, by least squares over all sixteen columns: 23.8605 (row 2), 23.8648
      (row 3) and 23.8779 (row 4), with first centres of 39.25, 39.27 and 39.18. Three
      independent fits inside 0.017 mm of each other is one pitch: 23.868 from 39.23.
      THERE IS NO GANGING and the residuals say so. They are all under 0.6 mm and they BOW
      smoothly - positive at both ends of the face, negative in the middle - which is the
      photograph's own lens distortion. A ganged block shows residuals that ALTERNATE, and
      these do not.
      THE ROWS WERE MEASURED ON THE CAGE BEZELS, not on the openings. The bezel is a
      continuous bright line; the opening is dark, textured and merges with its neighbours
      at 5 px/mm. On the guide's elevation the eight bezel lines read 11.64-20.81,
      25.74-35.02, 52.18-61.45 and 66.38-75.76, giving row centres 16.23, 30.38, 56.82 and
      71.07 and cages 9.17 to 9.38 tall.
      ONE ROW PITCH IS USED FOR BOTH BANKS. Fitted separately they give 14.15 (upper) and
      14.25 (lower) - a tenth of a millimetre apart, which is half a pixel on this
      elevation - and the hardware is plainly one cage assembly used twice, exactly as the
      AIS800-64D's 17.61 and 17.41 were merged. 14.20 is the mean.
      THE DRAWN OPENING IS 18.0 TO 18.3 WIDE against std/qsfp-dd@1's registry 19.0, the
      same bias every device in this family records: the registry owns the aperture and the
      device owns the pitch.
  the-numbering-starts-at-one-and-the-legend-sits-between-the-rows:
    confidence: measured
    note: >-
      `N (up)(down) N+1` IS PRINTED BETWEEN THE TWO CAGES OF ITS COLUMN, in white on the
      bare panel. There are NO COLOURED BANDS anywhere on this face - which is a real
      difference from the AGR560 on the same shell, whose whole numbering scheme is
      coloured bands, and from the AIS800 pair, which print their legends above and below
      their banks rather than inside them.
      NUMBERING STARTS AT 1, not 0. Read on the guide's enlargements, which resolve
      `1 (up)(down) 2`, `3 (up)(down) 4`, `33 (up)(down) 34`, `35 (up)(down) 36`,
      `61 (up)(down) 62` and `63 (up)(down) 64` - both ends of both banks.
      SO EACH BANK IS ONE BLOCK OF THIRTY-TWO. Column-major, i = col*2 + row, gives
      n = 1 + i exactly: column k carries 2k+1 and 2k+2. That is the opposite of the
      AGR560, whose stride of four forced twelve separate blocks.
      THE SFP+ PAIR IS NUMBERED INTO THE SAME SEQUENCE as ports 65 and 66, labelled above
      and below their block rather than between them.
  four-lamps-a-port-and-the-count-lit-is-the-breakout:
    confidence: datasheet
    note: >-
      THE GUIDE PRINTS THE WHOLE VOCABULARY and it is unusual enough to transcribe in full,
      QSFP56-DD LEDs: 400G (1x8 lanes 50G PAM4) = 1 lamp blue; 200G (2x4 lanes 50G PAM4) =
      2 cyan; 100G (4x2 lanes 50G PAM4) = 4 green; 100G (1x4 lanes 25G NRZ) = 1 green; 40G
      (1x4 lanes 10G NRZ) = 1 dark green; 50G (2x2 lanes 25G NRZ) = 2 red; 25G (4x1 lane
      25G NRZ) = 4 orange; 10G (4x1 lane 10G NRZ) = 4 yellow.
      SO THE NUMBER OF LAMPS LIT IS THE BREAKOUT AND THE COLOUR IS THE RATE - four lamps
      per port, one per lane group, not one lamp per port. The guide's enlargement shows
      exactly that: a vertical strip of four diamond windows on the post beside each cage,
      measured about 10.85 mm tall on a 3.5 mm pitch.
      `common/qsfp-lane-leds-column@1` IS THAT PART - 1.8 x 11.4, four lane elements
      stacked vertically - and it is already seated by the sibling dcs510. 64 ports x 4 is
      256 port lamps on this face.
      THE OTHER TWO LEGENDS, same page: "SFP+ 10G LEDs: Left: Green (10G link), Amber (1G
      link); Right: Green (10G activity), Amber (1G activity)" and "RJ-45 MGMT LEDs: Left:
      Green (1G link), Amber (10/100M link); Right: Green (1G activity), Amber (10/100M
      activity)".
  the-system-lamps-are-five-and-an-early-misreading-is-worth-recording:
    confidence: datasheet
    note: >-
      LOC, STAT, FAN, PSU1, PSU2 - five, in a VERTICAL column at the top left with the
      label to the left of each lamp, on a 3.0 mm pitch.
      THE STATES ARE GIVEN: LOC flashing blue/amber = switch locator; STAT green = OK,
      blinking green = system booting, amber = fault; FAN green = OK, amber = fault,
      blinking amber = too few fans installed; PSU1/PSU2 green = OK, amber = fault.
      AN EARLY READING OF THE DATASHEET PHOTOGRAPH AS "DIAG, FAN, LOC, PSU1, PSU2" WAS
      WRONG and is recorded because the mistake is instructive. That silkscreen is about
      four pixels tall in the photograph; enlarged nine times it resolves into five blurred
      four-character words and nothing more. The QSG's enlargement prints the names
      legibly, the QSG's own legend text lists the same five, and the datasheet's PROSE
      says "System LEDs: PSU1, PSU2, FAN, STAT, and LOC". Three sources agree and the
      fourth was never readable - there is no disagreement here, only a misreading of blur.
  the-twenty-four-watt-ports-are-named-one-by-one:
    confidence: datasheet
    note: >-
      Ports 1-4, 29-36 and 61-64 = 24 W per transceiver; every other port = 13 W per
      transceiver - the datasheet's power section,
      and the interfaces table splits the face the same way: "16 x 400G QSFP56-DD ports
      (24W) Support 400G QSFP56-DD DAC up to 2.5m" against "48 x 400G QSFP56-DD ports
      (13W) ... up to 1m".
      THAT IS THE FIRST TWO AND LAST TWO COLUMNS OF EACH BANK, which is exactly what the
      datasheet photograph's three yellow highlight boxes mark - two columns, twelve
      columns, two columns. A stated fact and a drawn one agreeing, so the per-port
      attribute below is not an inference.
  the-rear-is-the-familys-shell-and-nobody-elses-architecture:
    confidence: measured
    note: >-
      ONE SUPPLY AT EACH END, FOUR FAN TRAYS BETWEEN THEM. The three other devices on this
      shell stack both supplies at the left. Measured on the guide's rear elevation, in two
      horizontal bands chosen clear of the handles so that the seams are found twice: seam
      pairs at 45.45/51.39, 131.49/136.93, 217.13/222.57, 302.77/308.12 and 388.42/394.26.
      Fan bays 80.1 wide on a pitch of 85.65 - 85.64, 85.64, 85.65 on the three intervals.
      THE SUPPLIES ARE TALL AND NARROW: 39.7 x 53.3, measured on the datasheet photograph
      on the module's own rails, not the family's 73.5 x 40 CRPS brick.
      THE TWO SUPPLIES ARE MIRRORED AND THE GUIDE STATES IT: "Install the replacement PSU
      in a matching orientation. (PSU 1 AC socket faces down, and PSU 2 AC socket faces
      up.)" The elevation agrees independently - PSU 1's internal features cluster at
      y 34.4-65.9 and PSU 2's at 20.5-37.8, and they map onto each other by reflection
      about the chassis mid-height to within 0.6 mm. So one component is seated twice and
      the second is turned through 180 degrees.
      THE GROUNDING PLATE STAYS AT THE BOTTOM ON BOTH SIDES and is therefore chassis, not
      supply: the guide's callout 7 is "2 x grounding screws (maximum torque 10 kgf-cm
      (8.7 lb-in))" and there is one under each supply.
  power:
    confidence: datasheet
    note: >-
      TWO 2400 W SUPPLIES against a stated draw of "287.75 W (min.), 2100 W (max.)".
      Input ratings: "100-127 VAC, 50/60 Hz, 12 A maximum; 200-240 VAC, 50/60 Hz, 15 A
      maximum; HVDC: 240 VDC, 15 A maximum".
      THE 1+1 CLAIM IS A HIGH-LINE CLAIM and the guide says so: at 200-240 VAC or 240 VDC
      one or two AC PSUs may be fitted, but at 100-127 VAC both AC PSUs are required. At low line the pair is not redundant.
      THE INLET IS A SAF-D-GRID AND THE C20 IS THE WALL END OF THE CORD. The datasheet says
      "AC PSU Inlet: Anderson Saf D Grid"; the guide's package contents list an "HVAC/IEC
      C20 1m power cord" and the ordering table an "HVAC to IEC 60320 C20 (1m)". Reading
      the C20 as the inlet would put the wrong connector on the supply's face.
