    humidity: 'Operating: 5% to 95% non-condensing'
    altitude: 'Operating: 0-1828 m (0-6000 ft)'
  physical:
    weight-note: 21.5 kg (47.4 lb) with 2 PSUs and 4 fans installed - both documents agree
  platform:
    cpu: Intel Xeon D-1548, 8-core
    switch-silicon: Broadcom Tomahawk 4
    software: ONIE preloaded; compatible with Open Network Linux and Enterprise SONiC by Edgecore
  performance: {jumbo-frames: up to 9416 bytes, packet-buffer: integrated 113.66 MB, mac-addresses: '8K
      exact match, 128K without exact match (subject to NOS)'}
  power: {power-draw-max-w: 2100, power-draw-min-w: 287.75, power-budget-per-port-w: '24 on ports 1-4,
      29-36 and 61-64; 13 on all other ports'}
  features:
    optics-qsfp-dd: >-
      datasheet: each QSFP56-DD port takes 1 x 400G QSFP56-DD, 1 x 100G QSFP28 or 1 x 40G QSFP+, or breaks
      out to 2 x 200G (2 x 4 lanes 50G PAM4), 4 x 100G (4 x 2 lanes 50G PAM4), 2 x 50G (2 x 2 lanes 25G
      NRZ), 4 x 25G NRZ or 4 x 10G NRZ. The guide's lamp legend lists the same set and adds the 1 x 8
      lanes 50G PAM4 mode for 400G.
    dac-reach: >-
      datasheet interfaces table: the sixteen 24 W ports "Support 400G QSFP56-DD DAC up to 2.5m" and the
      other forty-eight "up to 1m". The extra watts buy reach.
  compliance:
    emissions: >-
      EN 55032 Class A, EN 61000-3-2, EN 61000-3-3, VCCI-CISPR 32 Class A, AS/NZS CISPR 32 Class A, ICES-003
      Issue 7 Class A, FCC Class A
    immunity: EN 55035, IEC 61000-4-2/3/4/5/6/8/11
    safety: UL (CSA 22.2 No 62368-1 & UL 62368-1), CB (IEC/EN 60950-1 & IEC/EN 62368-1)
    nebs: GR63-CORE (Pre-test)
