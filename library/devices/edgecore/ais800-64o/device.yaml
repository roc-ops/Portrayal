configurations:
  ac-f2b:
    kind: orderable
    description: >-
      Dual 3000 W AC PSUs, front-to-back airflow - red tray bars and red PSU latches, which is the build
      the rear elevation and this model's own rear photographs show. Rated 0-40 C at 1800 m.
    default: true
    part-numbers:
      AIS800-64O-AF-UN: {part: FP6EC9664003Z, power-cord: IEC 60320 C19-C20}
      AIS800-64O-AF: {part: FP6EC9664001Z, power-cord: none}
  ac-b2f:
    kind: orderable
    description: >-
      Dual 3000 W AC PSUs, back-to-front airflow - blue bars and latches. Derated to 0-35 C, "subject
      to used optics".
    airflow: back-to-front
    region-context: {exhaust: Intake}
    component-attrs:
      fan-2u-1x1sn: {handle-finish: '#3d7bd6'}
      ais800-64-psu-ac: {latch-finish: '#3d7bd6'}
    part-numbers:
      AIS800-64O-AB-UN: {part: FP6EC9664006Z, power-cord: IEC 60320 C19-C20}
      AIS800-64O-AB: {part: FP6EC9664007Z, power-cord: none}
  dc-f2b:
    kind: orderable
    description: >-
      Dual 3000 W DC PSUs, front-to-back airflow. The DC supply lands -48 to -60 VDC on a six-stud terminal
      block and no power cord ships.
    bays: {psu-1: edgecore/ais800-64-psu-dc@1, psu-2: edgecore/ais800-64-psu-dc@1}
    part-numbers:
      AIS800-64O-DF: {part: FP6EC9664010Z}
  dc-b2f:
    kind: orderable
    description: >-
      Dual 3000 W DC PSUs, back-to-front airflow - blue tray bars. The DC supply's own release latch is
      green in both builds and is not recoloured; the airflow colour rule is established for the AC latch
      and the tray bars only, which is the 64D's finding.
    airflow: back-to-front
    region-context: {exhaust: Intake}
    bays: {psu-1: edgecore/ais800-64-psu-dc@1, psu-2: edgecore/ais800-64-psu-dc@1}
    component-attrs:
      fan-2u-1x1sn: {handle-finish: '#3d7bd6'}
    part-numbers:
      AIS800-64O-DB: {part: FP6EC9664012Z}
references:
- title: Edgecore AIS800-64O 800 Gigabit AI & Data Center Ethernet Switch Quick Start Guide
- title: Edgecore AIS800 Data Center Switch AIS800-64O/AIS800-64D Data Sheet
