format: 1
kind: device
name: ais800-64o
version: 3.0.0
maturity: modelled
manufacturer: Edgecore
model: AIS800-64O
portfolio: {line: AI and Data Center, family: AI/ML Switch, series: AIS800}
description: >-
  64 x 800G OSFP800 AI and data centre 2RU switch on a Broadcom Tomahawk 5 with an Intel Xeon D-1713NTE
  and an OpenBMC service processor, sold as the AIS800-64O. All ports are on the FRONT in TWO BANKS of
  sixteen stacked columns, and the columns are GANGED IN FOURS - four shells of four columns per bank,
  with a 4.13 mm gutter between them. Two 25G SFP28 in-band management cages, an RJ-45 management jack,
  a USB 3.0 Type-A storage port, an RJ-45 console, a ToD jack, 1PPS and 10 MHz timing jacks, six system
  lamps and a reset button share the right of the wall; two 3000 W supplies and FOUR fan trays are on
  the rear. Its twin edgecore/ais800-64d is the same chassis with a QSFP-DD800 wall - and the two walls
  are laid out differently, which is the whole reason this one was fitted from scratch: the 64D spreads
  sixteen columns on a single 24.019 mm pitch and puts one lamp on the post beside each cage, and this
  one gangs its columns and puts two lamps in the legend row above them.
profile: networking
provenance:
  stack-orientation:
    confidence: drawing
    note: >-
      The belly-to-belly cage pairs on this face follow the library's stack convention (docs/pluggables-3d-design.md,
      S1-S4): a row pair is the upper cage upright (rotate 0) over the lower turned 180, so both cage
      lips face the band between the two cages and both bails face outward, where a thumb reaches them.
      All 1 pairs carry port lamps pointing up over down, which is belly-to-belly. A photograph of the
      stack that shows otherwise overturns it. OSFP stacks are left as drawn (S7).
  sources:
    confidence: datasheet
    note: >-
      A QUICK START GUIDE AND A DATASHEET, AND THE DATASHEET IS SHARED WITH THE TWIN. Both are staged:
      ais800-64o-qsg (8 pages, bilingual, 59 kept figures) and ais800-64o-datasheet (5 pages, 11 kept
      figures), and the datasheet is titled "AIS800-64O/AIS800-64D" and carries both models' ordering
      tables. The guide carries the Overview elevations, its own System LEDs/Buttons enlargement, the
      FRU replacement figures and a Connect Power page; the datasheet carries the photographs, the ordering
      tables and the power ratings. THE WEIGHT DISAGREES, AND BY MORE THAN THE TWIN'S DID: the guide says
      20.5 kg (45.19 lb) "with 2 PSUs and 4 fans installed" and the datasheet 21.5 kg (47.4 lb) "with
      2 PSUs and 4 fan modules installed" - a full kilogram, where the 64D's two documents differed by
      0.3. Both are recorded; 20.5 is used because the guide is the document that also carries the measured
      elevations, which is the rule the 64D set. The dimensions agree exactly: the guide reads "440 x
      649.2 x 87 mm" and the datasheet "44 x 64.92 x 8.7 cm". FIVE PHOTOGRAPHS ARE STAGED at 960 x 700
      - front, front-angled, rear and rear-angled. Over a 440 mm face that is 2.18 px/mm, too coarse to
      measure, but they confirm the block structure, the two lamps per column, the model name printed
      on the panel and the red PSU latches and tray bars of the front-to-back build.
  gate-1:
    confidence: measured
    note: >-
      PASSES, ON BOTH FACES, AND EACH FACE WAS MEASURED ON ITS OWN SCALE. The front elevation's panel
      rectangle is 2230.26 x 444.96 px at 600 dpi by subpixel edge fit (56 top / 58 bottom / 24 left /
      22 right samples): 2230.26/440 is 5.0688 px/mm and 444.96/87 is 5.1145, and the aspect 5.0123 against
      the real 5.0575 is 0.90% out. The rear reads 2226.33 x 440.84 - 5.0598 and 5.0671, 0.14% apart.
      THE DRAWINGS ARE UPSCALES AND THAT WAS CHECKED: the panel edges ramp over about eight pixels, so
      an edge carries about +/-4 px of placement, which is where the front's 0.9% comes from. THE GUIDE'S
      OWN ENLARGEMENT IS THE SECOND INSTRUMENT, not a photograph. The System LEDs/Buttons figure draws
      the last four columns and the whole management cluster at 15.0367 px/mm in y - three times the elevation
      - and its x scale was calibrated against the elevation's sixteen-column pitch fit, giving 14.9234
      px/mm with residuals of 0.006, 0.011 and 0.006 mm on three aperture centres. Every number below
      that both instruments can see agrees between them: the row pitch to 0.000 mm, the aperture-row centres
      to 0.08, the lamp offset to 0.001 and the arrow offsets to 0.04.
  the-optical-wall:
    confidence: measured
    note: >-
      FOUR GANGS OF FOUR COLUMNS PER BANK, AND THE TWIN'S WALL IS NOT LIKE THIS. Aperture runs scanned
      along each of the four rows and fitted to x = first + floor(i/4)*B + (i mod 4)*p give, on three
      rows that resolve all sixteen columns cleanly: first 20.533 / 20.533 / 20.499, B 97.0718 on all
      three, p 23.2279 / 23.2279 / 23.2427, with an rms of 0.028-0.035 mm and a worst residual of 0.060.
      THE SAME BLOCK PITCH TO FOUR DECIMAL PLACES ON THREE INDEPENDENT ROWS is what settles that the structure
      is real and not a reading artefact. 20.5165 / 97.0718 / 23.2353 are used; the gutter is B - 4p =
      4.1306. A SINGLE PERIODIC FIT WOULD AVERAGE THE GUTTER AWAY - the AIS800-32O records the same trap,
      and the EXP100's autocorrelation lesson is the same thing one generation earlier. THE 32O'S NUMBERS
      ARE NOT THESE AND WERE NOT BORROWED. That model fits 96.7913 / 23.4243 on a 438.4 mm shell; this
      is 97.0718 / 23.2353 on a 440 mm shell. The structure is shared with the 32-port OSFP model and
      the numbers are this device's own. ROWS. The mean vertical profile through all sixteen column centres
      puts the four aperture rows at 12.341-25.398, 27.234-40.306, 48.273-61.320 and 63.171-76.211. The
      row pitch within a bank is 14.900 (upper) and 14.894 (lower) - 0.006 mm apart, which is one pitch,
      14.897 - and the enlargement returns 14.897 from its own two rows. The bank pitch is 35.927. THE
      DRAWN OPENING IS 22.40 x 13.05 against std/osfp@1's registry 23.1 x 13.5, the same consistent bias
      the 32O (22.4) and the 64D's QSFP-DD (18.3 against 19.0) both record. THE REGISTRY APERTURE IS CENTRED
      ON THE DRAWN ONE rather than hung from its top edge, which is the 64D's review finding applied before
      the fact rather than after: centring splits the 0.45 mm surplus 0.225 either way and the two banks
      come out identical. EACH GANG IS ONE SHELL. The panel draws a bright rounded frame around each four-column
      block, 93.51 x 29.33 at x 8.53 + n*97.064, with thin bright walls between the columns inside it
      and dark panel in the gutters - a vertical profile down the gutter between gangs 1 and 2 finds no
      bright run at all, which is what says the shell stops there. THE INTER-ROW BAND IS DRAWN ON A BACKING
      RECT, for the reason vent-field-needs-backing-rect exists: panel pattern decor paints only its holes,
      and this band is BRIGHT. It is a single row of round perforations 1.84 mm tall between the two apertures
      of each gang - EIGHT bands, one per gang per bank, because the band belongs to the cage assembly.
      GASKET FINGERS ALONG THE TOP AND BOTTOM OF EVERY SHELL, not lamps - the AIS800-64D's finding, and
      the same trap. Autocorrelating the three shell edges that resolve gives 2.762 mm on all three, and
      they run the full width of each shell. THE INTER-BANK STRIP IS PLAIN METAL. Between the upper bank's
      shell bottom at 40.98 and the lower bank's shell top at 47.63 there is 6.65 mm of panel whose grey
      reads 87-97 against the 94 of the metal beside it and which contains no hole at all. The 64D's face
      and this one both leave it blank, and it would have been easy to fill with a vent field nobody measured.
  the-port-lamps-are-two-per-column-in-the-legend-row:
    confidence: measured
    note: >-
      AND THIS IS THE BIGGEST DEPARTURE FROM THE TWIN. edgecore/ais800-64d puts one round window on the
      post 2.40 mm to the LEFT of each cage, level with its own aperture row. THIS FACE HAS NO POST LAMP.
      Each column's legend reads `N (up) (o) (o) (down) N+1` and the two lenses sit on the legend baseline
      between the arrows - above the column in the upper bank, below it in the lower. MEASURED TWICE AT
      THREE TIMES THE RESOLUTION AND THE TWO AGREE TO A THOUSANDTH. On the elevation the offset from the
      column centre is +/-1.998 mm (sd 0.030, n=62); on the enlargement it is +/-1.998 (upper) and +/-1.999
      (lower), with separations of 3.995 and 3.999. The lamp baseline is 9.907 in the upper bank and 78.742
      in the lower, each with a standard deviation of 0.004 mm or better across the enlargement's four
      columns. THE LENS IS ROUND AND ABOUT 0.98 MM. The enlargement gives 0.980 x 0.973 in the upper bank
      and 0.980 x 0.998 in the lower - round to within a fortieth of a millimetre, which is the check
      the skill asks for. common/led-dot@1 is 2.0 square and is seated on the measured CENTRES rather
      than the measured size, as the 64D's and the 32D's indicators are and for the same reason: the indicator
      vocabulary is what a reader compares across devices. OWNERSHIP WAS CHECKED THE WAY THE 64D'S WAS.
      Sweeping the whole 440 mm width on each legend baseline for lenses of that size finds 16 columns
      x 2 in the lower bank with ZERO strays, and the same in the upper with a single out-of-column hit
      at x 430.1 - which is a system lamp in the management cluster, not a port lamp. Sixty-four lenses,
      one per port, and nothing hanging off either end of either bank. LEFT LENS TO THE UPPER PORT, RIGHT
      TO THE LOWER, which is what the arrows say: the left lens sits beside `(up)` and the right beside
      `(down)`, and odd ports are the upper row. WHAT THE FOUR COLOURS MEAN IS THE PORT'S. The guide gives
      one legend - "OSFP800 LEDs: Yellow (800G), Blue (400G), White (200G), Green (100G)" - and there
      is exactly one window per port, so the lamp shows the port's negotiated rate. AND THIS SETTLES A
      GAP ON A DEVICE ALREADY IN THE LIBRARY, or narrows it: the AIS800-32O records `port-lamp-windows`
      as needs-drawing because "whatever this model does it does somewhere else, and the drawing does
      not show where". Its legend row is the same `N (up) (down) N+1` and its elevation leaves the space
      between the arrows blank while resolving the numerals and arrows either side of it. See the gap
      of the same name below; this device does not change that one.
  the-legends:
    confidence: measured
    note: >-
      THE NUMERALS ARE ANCHORED ON THEIR INNER EDGE, NOT THEIR CENTRE, and that is measured rather than
      assumed. The upper bank numbers 1 to 32, so it carries both one-digit and two-digit numerals on
      one baseline. Across fifteen columns the left numeral's RIGHT edge sits at -7.047 from the column
      centre for one digit and -7.015 for two, and the right numeral's LEFT edge at +6.842 and +6.815
      - a difference of 0.03 mm - while the CENTRES move from -7.600 to -8.357 and from +7.631 to +8.146,
      a difference of 0.76. The numerals hug the arrows and grow outward. Anchoring them all in the middle
      would put every one-digit numeral 0.76 mm inboard of where the panel prints it, which is a third
      of the cap height. `anchor-by-row` was added to expand.py for this, the way `dx-by-row` was added
      for the offsets; the enlargement confirms the inner edges at -7.090 and +6.714. CAP HEIGHT 2.2 on
      the elevation and 2.28 on the enlargement, so font-size 2.8. THE ARROWS ARE SILKSCREEN AND THE LENSES
      ARE NOT. The 64 `(up)`/`(down)` glyphs are solid white, the same white and crispness as the numerals
      they sit between, where every lamp on this face reads as a bright lens. This is the AIS800-32D's
      finding applied before the fact; see roc-ops/Portrayal#396, open on the EXP100 and EXP800 for the
      same marks. Arrow centres sit at -4.717 and +4.833 from the column centre on the elevation and -4.678
      and +4.854 on the enlargement. THE SFP28 PAIR'S TWO ARE LAMPS, as on the twin: the guide's callout
      3 points at the white band between the two cages and names it "SFP28 LEDs: Green (link/activity)".
  the-management-cluster-is-the-twins:
    confidence: measured
    note: >-
      THE CLUSTER IS THE SAME HARDWARE AND ITS GEOMETRY IS CARRIED FROM edgecore/ais800-64d, WHICH MEASURED
      IT ON AN ENLARGEMENT - and this device's own elevation and its own enlargement were both checked
      against that before carrying it, rather than the carry being assumed from the twin's name. THE CHECKS.
      Independent detection of the bright verticals on this elevation puts the SFP28 pair's bezel at 398.485-412.855
      against the 64D's recorded 398.45-413.20. This guide's own enlargement, at 14.9234 px/mm, puts the
      USB-A opening at 418.10-430.40 against the 64D's 418.09-430.58 - 0.18 mm - and this elevation independently
      puts it at 418.09-430.32. The SFP28 row pitch reads 15.64 here against 15.30 there, which is the
      one number that differs by more than half a millimetre and is also the one this elevation resolves
      worst. WHAT IS ACTUALLY DRAWN, confirmed on this device's own enlargement: two 25G SFP28 cages in
      one bezel whose middle band carries the pair's two lamps and is legended `1 (up) 25G (down) 2`;
      an RJ-45 MGMT jack tab-up with its own pair of corner lamps and a blue-tongued USB 3.0 Type-A beneath
      it legended `SS`; a CONSOLE RJ-45 tab-up and a ToD RJ-45 tab-down stacked below; two SMA timing
      jacks legended 1PPS and 10MHz; six system lamps legended LOC DIAG ALRM FAN PSU1 PSU2 and a reset
      button legended RST; and the Edge-core badge with `AIS800-64O` printed beside it. THE VENT FIELDS
      AROUND THE CLUSTER ARE CARRIED TOO and are the weakest thing on this face. The three large fields
      are this device's own - top, left and bottom, measured below - but the four small fields that thread
      between the cluster's jacks are the 64D's, because neither this elevation at 5.07 px/mm nor the
      hole-finder run over the enlargement separated them from the jack apertures around them. They are
      decor on a region proven identical, and they are recorded here as carried rather than measured.
  the-rear-is-the-same-drawing:
    confidence: measured
    note: >-
      NOT "the same as the twin's" - LITERALLY THE SAME IMAGE FILE. Both guides' page-1 Overview figures
      were rendered at 600 dpi, both rear panels located by the same subpixel edge fit, and both land
      on IDENTICAL bounding boxes: x 2559.33-4785.67, y 2080.31-2521.15, to the hundredth of a pixel.
      Resampled to a common grid the two rears differ by a MAXIMUM OF ZERO GREY LEVELS over 2000 x 396
      pixels. The front, by contrast, differs in 41.63% of its pixels and the two front panels are not
      even the same size (2230.26 x 444.96 here against 2222.82 x 441.66 there), which is what says the
      front artwork is independently drawn for each model and the rear is one file used twice. SO THE
      REAR IS CARRIED OVER, per roc-ops/Portrayal#310, and the 64D is the reference. AND BECAUSE SHARED
      ARTWORK IS NOT EVIDENCE ABOUT THIS MODEL, the carry was checked against this device's OWN rear photographs,
      which are not shared: they show two stacked Lite-On 3000 W supplies with IEC C20 inlets and red
      release latches, four fan trays with red handle bars, the `(up) PSU1 (down) PSU2` legend, the earth
      symbol and two grounding screws on the left strip, and the numerals between the trays. That is the
      front-to-back build and it is what the rear elevation draws.
  the-vent-fields:
    confidence: measured
    note: >-
      HONEYCOMB, AND THE PITCH IS THIS DEVICE'S OWN. Hole centres found in the top field across three
      rows give an x pitch of 3.614, 3.603 and 3.606 mm - agreeing to 0.011 - with a half-pitch stagger
      of 1.659 between adjacent rows and a hole about 1.92 mm across. The row pitch is 2.08. (The twin
      records 3.59 x 2.07, measured separately on its own drawing; the two stencils are evidently the
      same and the numbers were not copied.) THE FIELDS. Top 0.15-6.55 and bottom 80.10-86.65 run nearly
      the full width; the left field is a column 8.5 mm wide running between them. There is NO field between
      the two banks, which is measured and not assumed - see the optical-wall note. THE GREY IS SAMPLED,
      NOT GUESSED: the panel metal reads RGB (94, 95, 99) on the elevation, which is the chassis colour
      below.
attrs:
  environmental:
    operating-temp: 0 to 40 C (front-to-back); 0 to 35 C (back-to-front), subject to used optics
    storage-temp: -40 to 70 C
    humidity: 'Operating: 5% to 95% non-condensing'
    altitude: 'Operating: 1800 m'
  physical:
    weight-note: >-
      20.5 kg (45.19 lb) with 2 PSUs and 4 fans installed (quick start guide); the datasheet says 21.5
      kg (47.4 lb)
  platform: {cpu: 'Intel Xeon D-1713NTE Ice Lake D, 4-core 2.2 GHz, COM Type 7', switch-silicon: Broadcom
      BCM78900 Tomahawk 5, bmc: 'AST2600 running OpenBMC, secured by an AST1060 root of trust', memory: 32
      GB DDR4 SO-DIMM with ECC, storage: 240 GB M.2 2280 NVMe SSD, boot-flash: 64 MB SPI flash x 2, tpm: TPM
      2.0 SPI, software: ONIE preloaded; no NOS image ships on the device}
  performance: {switching-capacity: 51.2 Tbps (102.4 Tbps full duplex), jumbo-frames: up to 9416 bytes}
  power: {power-draw-max-w: 2775, power-budget-per-port-w: 30}
  features:
    timing: 1PPS, 10 MHz and ToD ports, SyncE and IEEE 1588v2 PTP
    optics-osfp: >-
      datasheet: each OSFP800 port takes 1 x 800G on 8 lanes of 100G PAM4, or breaks out to 2 x 400G,
      4 x 200G or 8 x 100G; on 50G PAM4 it takes 1 x 400G or breaks out to 2 x 200G, 4 x 100G or 8 x 50G;
      and it takes 1 x 100G on 4 lanes of 25G NRZ.
  compliance:
    emissions: >-
      EN 55032 Class A, AS/NZS CISPR32, EN 61000-3-2, EN 61000-3-3, FCC Class A, ICES-003, VCCI-CISPR32
    immunity: EN 55035, IEC 61000-4-2/3/4/5/6/8/11
    safety: UL (CSA 22.2 No 62368-1 & UL 62368-1), CB (IEC/EN 62368-1)
    nebs: GR63-CORE (Pre-test)
  lifecycle: {eol: none-announced}
