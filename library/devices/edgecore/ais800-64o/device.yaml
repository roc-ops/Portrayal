gaps:
- what: port-lamp-windows-on-the-32o
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    Where edgecore/ais800-32o's port lamps are. That device records the same gap and this one does not
    close it, but it narrows it: THIS model's legend row is the same `N (up) (down) N+1` and it carries
    two lenses between the arrows, at the column centre +/-1.998 on a baseline of its own. The 32O's elevation,
    rendered at 600 dpi, leaves exactly that space blank while resolving the numerals and arrows either
    side of it at the same scale - so the silence there is a reading rather than a resolution limit, and
    the 32O either carries its lamps somewhere this model does not or its drawing omits them. Its own
    LED enlargement, or a photograph of its face at 5 px/mm or better, settles it. Filed against that
    device rather than fixed here.
- what: module-lamp-legend
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    What the lamp on each fan tray means. Every one of the four trays carries a round lens at its top
    left and neither staged document mentions it. The guide's System LEDs/Buttons page lists the six chassis
    lamps and the RJ-45's pair and stops; the datasheet names port, management-port and system LEDs and
    no module lamp. Carried from edgecore/ais800-64d, whose rear is the same drawing.
- what: port-lamp-speed-colours
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    Whether the port lamp's four colours are the only states it has. The guide gives "OSFP800 LEDs: Yellow
    (800G), Blue (400G), White (200G), Green (100G)" and the datasheet's own summary says "Port LEDs:
    Link Status, Activity, Rate" - three FUNCTIONS for one window and four colours for the rate alone.
    The four rate colours are declared because they are named; whether the window also blinks for activity,
    and what it shows for link without traffic, is not published.
- what: dc-connector-identity
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    What the DC supply's six-bore input connector actually is. Neither document names it, unlike this
    line's AC inlet, which both name outright as "IEC 60320 C20". edgecore/ais800-64-psu-dc@1 is drawn
    to the guide's own figure at 7.18 px/mm and says so. Carried from edgecore/ais800-64d, which shares
    the supply.
- what: cluster-vent-fields
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    The four small perforated fields that thread between the management cluster's jacks. They are carried
    from edgecore/ais800-64d, whose cluster this elevation and this guide's own enlargement both confirm
    to within 0.18-0.35 mm on the features that do resolve. Neither instrument separates these fields
    from the jack apertures around them: at 5.07 px/mm the elevation cannot, and the hole-finder run over
    the enlargement returned three blobs where it should have returned scores. A cluster drawing, or the
    enlargement at a higher render resolution, would let them be measured here instead of inherited. The
    three large fields - top, left, bottom - ARE this device's own.
- what: the-four-undrawn-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, the underside and the two side walls. Between them the two staged documents
    draw two elevations, a LED enlargement, five photographs, the FRU figures and a power-connection page,
    and not one of them shows a third face. Each carries an `empty:` sentence saying where I looked, per
    docs/deliberately-empty-faces.md.
groups:
  osfp800:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the sixty-four 800G OSFP800 ports, in TWO BANKS of sixteen stacked columns, and the columns GANGED
      IN FOURS - a 23.2353 mm in-block pitch, a 97.0718 mm block pitch and a 4.13 mm gutter between shells.
      Ports 1-32 are the upper bank, numbered down each column from 1 at the top left, and 33-64 the lower
      - odd ports the upper row of their bank and even the lower, as the panel's own `N (up) (down) N+1`
      legends say. The upper bank's legends are printed above it and the lower bank's below.
    attrs: {media: osfp, speed: 800g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster at the right of the port wall - two 25G SFP28 in-band management cages,
      a 1000BASE-T RJ-45 management jack, a USB 3.0 Type-A storage port, an RJ-45 serial console and the
      reset button. The datasheet lists the SFP28 pair under the management ports alongside the RJ-45s,
      which is why they are in this group and not the traffic one.
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the three timing jacks the datasheet lists as "Timing Ports: 1PPS, 10 MHz, TOD" - two SMA coaxial
      inputs and an RJ-45 time-of-day port.
  leds: {term: LED, role: indicator, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        datasheet: "PSUs: 2 redundant, load-sharing, hot-swappable 3000 W AC/DC". Two 3000 W supplies
        against a stated 2775 W ceiling is a genuine 1+1.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 7+1
      redundancy-note: >-
        datasheet, twice: "4 hot-swappable fan modules (2 fans per module), 8 fans total with 7+1 redundancy".
        THE BAY COUNT AND THE FAN COUNT ARE DIFFERENT NUMBERS AND THIS DEVICE HAS TO SAY WHICH IT MEANS:
        four bays are modelled, because four trays are what the rear draws and what a hand removes; the
        7+1 counts the EIGHT rotors inside them, two per tray.
