configurations:
  base:
    kind: base
    default: true
    power: ac
    description: >-
      Two AMX-3200-SLED400 sleds, two 1200 W AC supplies and five fan trays - the machine the
      guide's front and rear elevations draw.
  ac-f2b:
    kind: orderable
    power: ac
    description: >-
      AMX3200-O-AC-F and its regional cord variants: dual 1200 W AC supplies, front-to-back,
      'Sled configuration OTN Supported: 2 x 400G CFP + 8 x 100G QSFP28'.
    part-numbers:
      AMX3200-O-AC-F: {power-cord: none}
      AMX3200-O-AC-F-US: {power-cord: US}
      AMX3200-O-AC-F-UN: {power-cord: UN}
      AMX3200-O-AC-F-EU: {power-cord: EU}
      AMX3200-O-AC-F-JP: {power-cord: JP}
      AMX3200-O-AC-F-CN: {power-cord: CN}
      AMX3200-O-AC-F-TW: {power-cord: TW}
  dc-f2b:
    kind: orderable
    power: dc
    description: >-
      AMX3200-O-48V-F: dual 1200 W -48 VDC supplies with blue latches and terminal blocks,
      front-to-back - the build the DC rear photograph shows.
    bays: {psu-1: 'edgecore/amx-3200-48v-psu@1', psu-2: 'edgecore/amx-3200-48v-psu@1'}
    part-numbers:
      AMX3200-O-48V-F: {power-cord: DC power cord}
