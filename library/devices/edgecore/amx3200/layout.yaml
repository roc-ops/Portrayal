format: 1
kind: device
name: amx3200
version: 1.0.5
maturity: modelled
manufacturer: Edgecore
model: AMX3200
portfolio: {line: Service Provider, family: Coherent Transponder and Muxponder, series: AMX3200}
description: >-
  1RU coherent transponder and muxponder with two front interface sleds, each carrying two
  400G CFP2-DCO line ports and eight 100G QSFP28 client ports (3.2 Tbps full duplex),
  Intel Atom C3508, ONIE-preloaded. A management panel at the left end; two 1200 W AC or
  -48 VDC supplies at the ends of the rear with five 4+1 fan trays between them,
  front-to-back only.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Two documents and six product photographs. amx3200-datasheet (the AMX3200 coherent
      transponder and muxponder data sheet) carries the spec list, a 2000 px product
      photograph of the front taken from slightly above, and an ordering table that - unusually
      for this vendor - names the FRUs: AMX-3200-SLED400, AMX-3200-FAN, AMX-3200-AC-PSU and
      AMX-3200-48V-PSU, with the supply's 73.5 mm width and the fans' 40.5 mm size. amx3200-qsg
      (the 400G Transponder and Muxponder AMX3200 quick start guide, four pages) carries
      line-art front and rear elevations, the Overview callouts and the FRU procedures. The
      staged photographs include a straight-on front and straight-on rears of the AC and the DC
      build, 960 px wide.
  figure-choice:
    confidence: measured
    note: >-
      Gate 1. THE GUIDE'S FRONT SETS THE FRONT: panel 1114 x 111 px, aspect -0.42% against
      438.4/43.5, 2.541 px/mm on x and 2.552 on y. Two standard apertures confirm the scale
      independently - the QSFP28 openings measure 18.50 against the registry's 18.50 and the
      CFP2 openings 41.7-42.1 x 12.54 against the MSA's 41.5 x 12.4. The guide's REAR is
      -1.48% on aspect, so every rear number is checked against the two straight-on rear
      photographs, and they agree on the fan pitch to 0.05 mm. The datasheet's front
      photograph is taken from above and is used for what it alone shows - the printed port
      numbering and the lamp windows - not for geometry.
  chassis:
    confidence: datasheet
    note: >-
      DATASHEET 'Dimensions (WxDxH): 438.4 mm x 430 mm x 43.5 mm' and the guide's '438.4 x 430
      x 43.5 mm (17.26 x 16.93 x 1.71 in.)'. Two documents, one triple; 438.4 is the body.
  weight:
    confidence: datasheet
    note: >-
      '10.28 kg (22.66 lb), with 2 PSUs and 5 fans installed' in the datasheet; the guide says
      the same figure 'with 2 sleds, 2 PSUs, and 5 fans installed', so it is the populated
      machine.
  bays:
    confidence: measured
    note: >-
      THIS IS A BAY DEVICE. The two sleds are field-replaceable modules - the guide has a Sled
      Removal and Installation procedure and ships a blank cover for an unused slot - so each
      front slot is a bay that accepts edgecore/amx-3200-sled400@1 or
      edgecore/amx-3200-sled-blank@1, and the ports live on the sled, addressed
      sled-1/module/port-3 and so on. The slots read x 59.03-242.81 and 247.53-431.7 on the
      guide's front, 183.8 wide on a 188.5 pitch; the chassis prints SLED1 and SLED2 on the
      narrow strips to the right of each.
      THE PORTS' OPTICS AND MODES ARE ON THE SLED'S CONTRACT, not in this device's attrs:
      every traffic port lives on an AMX-3200-SLED400, and a device-level optics key names
      no port group of the device's own.
  numbering:
    confidence: photo-measured
    note: >-
      THE PHOTOGRAPH AND THE GUIDE NUMBER THE SLED DIFFERENTLY. The datasheet's photograph
      prints CFP2-1, CFP2-2 and then 3 up 4 down ... 9 up 10 down: each sled numbered 1-10 with
      its line ports first. The guide's line art prints the client ports 1-8. This device
      follows the photograph, which is of the hardware; see the gap. Supplies (PSU2 left, PSU1
      right) and fans (5 to 1 from the left) are numbered from one, as the rear prints them.
  management-panel:
    confidence: measured
    note: >-
      MEASURED on the guide's front at 5x and matched to the straight-on photograph: the
      RS-232 console RJ-45 at the top left over the 1G SFP out-of-band port ('CONSOLE up down
      SFP'); the 1000BASE-T MGMT RJ-45 over a USB-A ('MGMT up down USB'); the Edge-core
      wordmark above them; the 4 mm banana receptacle, the guide's callout 2, at the top
      right - which is the ESD wrist-strap jack, common/esd-jack@1, whose own provenance
      identifies the equipment-side ESD point as exactly a 4 mm banana; two gold coaxial 1PPS jacks labelled SLED1-1PPS and SLED2-1PPS, one per sled; and
      four rectangular system lamps across the foot - PSU, DIAG, FAN, LOC - over the model
      name. Honeycomb vents run down the left edge and along the bottom.
      THE MGMT JACK IS LAMPED AND THE CONSOLE IS NOT: 'MGMT LEDs: Left: Green (link/act),
      Right: Green (1G speed)', and nothing for the console - L76's convention too.
  rear:
    confidence: photo-measured
    note: >-
      Measured on the guide's rear and on both rear photographs. PSU2 at x 14.3 and PSU1 at
      350.6, each 73.5 x 40.0; five fan trays from x 97.0 on a 50.45 pitch; each module's label
      printed vertically in the web to its RIGHT with an arrow pointing back at it - 'PSU2',
      '5' ... '1', 'PSU1'. The protective earth is a single stud under an earth symbol on the
      strip at the far left; the guide asks for a #8 AWG wire to it.
attrs:
  performance:
    capacity: 3.2 Tbps full duplex (1.6 Tbps per sled)
    jumbo-frames: up to 9216 bytes
  power:
    power-max-w: 850
    power-envelope: unstated
    input-ac: 100-240 VAC, 50-60 Hz (10.0 A max per PS at 100-127 V, 8.0 A at 200-240 V)
    input-dc: -40 to -72 VDC, 40 A max per PS
    power-redundancy: 1+1 redundant, load-sharing, hot-swappable 1200 W supplies
  thermal:
    airflow: front-to-back
  environmental:
    temperature-operating: 0 C to 45 C (32 F to 113 F)
    temperature-storage: -40 C to 70 C (-40 F to 158 F)
    humidity-operating: 5% to 95% non-condensing
  platform:
    cpu: Intel Atom C3508
    memory: DDR4 SO-DIMM 8 GB (up to 16 GB)
    boot-flash: 2x 16 MB SPI
    storage: 128 GB M.2 MLC SSD
    tpm: TPM 2.0
    software: ONIE installer pre-loaded; open-source and commercial NOS options
  features:
    timing: IEEE 1588v2 PTP up to Class C; 1PPS output per sled
    sleds: 2x AMX-3200-SLED400 (2x 400G CFP2-DCO + 8x 100G QSFP28 each); a blank cover for an unused slot
  management:
    mgmt-ports: >-
      1x RJ-45 RS-232 console, 1x RJ-45 100/1000BASE-T management, 1x 1G SFP management,
      1x USB 2.0, 2x 1PPS coaxial (one per sled), 1x 4 mm banana receptacle
  compliance:
    emc: EN 55032 Class A, EN 300 386 Class A, EN 61000-3-2, EN 61000-3-3, VCCI Class A, AS/NZS Class A, ICES-003 Class A, FCC Class A, BSMI Class A
    immunity: EN 55024/55035, EN 300 386, IEC 61000-4-2/3/4/5/6/8/11
  lifecycle: {eol: none-announced}

chassis: {width: 438.4, height: 43.5, depth: 430.0, ru: 1, weight-kg: 10.28, color: '#2b2e33',
  airflow: front-to-back}
gaps:
  - what: sled-port-numbering
    scope: [front]
    reason: sources-disagree
    wanted: >-
      THE PRINTED NUMBERS OF THE SLED'S PORTS. The datasheet's photograph numbers each sled
      1-10 - CFP2-1, CFP2-2, then 3 up 4 down ... 9 up 10 down - and the guide's line art
      numbers the QSFP28 ports 1-8 on their own. The photograph is modelled. Which one the
      shipping silkscreen carries, and which one a NOS uses, would be settled by a photograph
      of a current unit or the NOS port map.
  - what: qsfp-lamp-assignment
    scope: [front]
    reason: vendor-silent
    wanted: >-
      WHICH OF A CLIENT COLUMN'S FOUR LAMP WINDOWS BELONGS TO WHICH PORT. Each column's belly
      strip carries an up-arrow, four windows and a down-arrow; the vendor says 'QSFP28 LEDs:
      Green (link/activity)' and nothing about which window is whose. The windows are drawn and
      named by column, not assigned.
  - what: sled-blank-face
    scope: [front]
    reason: needs-photo
    wanted: >-
      THE FACE OF THE BLANK COVER. The guide ships one and requires it over an unused slot but
      neither document draws it; edgecore/amx-3200-sled-blank@1 is a plain plate.
  - what: sled-lever-revision
    scope: [front]
    reason: sources-disagree
    wanted: >-
      WHICH LEVER THE SLED CARRIES. The guide draws and describes a blue release latch on the
      lever; the datasheet's photograph shows a silver lever with a thumbscrew. The blue
      latch, the one the vendor's procedure names in words, is drawn.
groups:
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management panel at the left end - the RS-232 console RJ-45, the 1G SFP and the
      1000BASE-T RJ-45 out-of-band ports, a USB-A, the two per-sled 1PPS coaxial jacks and the
      4 mm banana receptacle.
  leds: {term: LED, role: indicator, index-origin: 1}
  sleds:
    term: Slot
    role: service
    index-origin: 1
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: 1+1 redundant, load-sharing, hot-swappable
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '4+1'
      redundancy-note: 4+1 redundant, one 40.5 mm fan per tray
  grounding: {term: Point, role: furniture, index-origin: 1}
  furniture:
    term: Item
    role: furniture
    index-origin: 1
    description: the rack ears and the Edge-core wordmark.
