configurations:
  ac-f2b:
    kind: orderable
    power: ac
    description: >-
      Dual 2400 W AC PSUs, front-to-back airflow - red bails on the supplies and the trays,
      which is the build the rear elevation and all five staged photographs show. Rated 0-40 C
      at 6000 ft.
    default: true
    part-numbers:
      AIS800-32D-AF-US: {part: FP6EC9632009Z, power-cord: US}
      AIS800-32D-AF-EU: {part: FP6EC9632201Z, power-cord: EU}
      AIS800-32D-AF-UK: {part: FP6EC9632301Z, power-cord: UK}
      AIS800-32D-AF-JP: {part: FP6EC9632501Z, power-cord: JP}
      AIS800-32D-AF-UN: {part: FP6EC9632011Z, power-cord: UN}
  ac-b2f:
    kind: orderable
    power: ac
    description: >-
      Dual 2400 W AC PSUs, back-to-front airflow - blue bails. The guide never writes the colour
      rule in words; its Airflow Reversal figures draw it. Derated to 0-35 C, "subject to used
      optics".
    airflow: back-to-front
    region-context: {exhaust: Intake}
    component-attrs:
      ais800-fan: {handle-finish: '#3d7bd6'}
      ais800-psu-ac: {handle-finish: '#3d7bd6', latch-finish: '#8fb4e8'}
    part-numbers:
      AIS800-32D-AB-US: {part: FP6EC9632401Z, power-cord: US}
      AIS800-32D-AB-EU: {part: FP6EC9632202Z, power-cord: EU}
      AIS800-32D-AB-UK: {part: FP6EC9632302Z, power-cord: UK}
      AIS800-32D-AB-JP: {part: FP6EC9632502Z, power-cord: JP}
      AIS800-32D-AB-UN: {part: FP6EC9632012Z, power-cord: UN}
  dc-f2b:
    kind: orderable
    power: dc
    description: >-
      Dual 2400 W DC PSUs, front-to-back airflow - red bails. The DC supply lands -40 to -72 VDC
      on a two-pole screw block with a separate ground stud; no power cord ships.
    bays: {psu-1: 'edgecore/ais800-psu-dc@2', psu-2: 'edgecore/ais800-psu-dc@2'}
    part-numbers:
      AIS800-32D-DF: {part: FP6EC9632008Z}
  dc-b2f:
    kind: orderable
    power: dc
    description: 'Dual 2400 W DC PSUs, back-to-front airflow - blue bails'
    airflow: back-to-front
    region-context: {exhaust: Intake}
    bays: {psu-1: 'edgecore/ais800-psu-dc@2', psu-2: 'edgecore/ais800-psu-dc@2'}
    component-attrs:
      ais800-fan: {handle-finish: '#3d7bd6'}
      ais800-psu-dc: {handle-finish: '#3d7bd6', latch-finish: '#8fb4e8'}
    part-numbers:
      AIS800-32D-DB: {part: FP6EC9632001Z}
