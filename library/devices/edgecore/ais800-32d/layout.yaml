  airflow: front-to-back}
gaps:
- what: fan-bay-numerals
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    Which end of the rear the fan trays number from. The chassis silkscreens a mark on the rail
    beside each bay, and at the source's real resolution it cannot be read: the rear elevation
    is embedded in the PDF at 1.83 px/mm, where a 2 mm numeral is 3.7 pixels. Upscaling the page
    render to 600 dpi makes the marks LOOK legible - a "7" appeared convincingly on the rail at
    the right-hand end - but the same detector run on the embedded image at native resolution
    shows there is nothing there to read, so it was discarded.
    IT MATTERS BECAUSE THE FAMILY IS NOT CONSISTENT. edgecore/exp100-32x and edgecore/dcs240
    both number their trays RIGHT to LEFT. The bays here carry rel-pos 1 to 7 LEFT to right
    because a view has to order them somehow, and NO numeral is silkscreened, because drawing
    one would assert what was not read. A photograph of the rear at 5 px/mm or better, or any
    figure that labels a tray, settles it in one look.
- what: module-lamp-legend
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    What the lamp on each fan tray means. Every one of the seven trays carries a round lens at
    its top left - a bright dome in a dark rim, about 3.4 mm across - and neither staged
    document mentions it. THE DC SUPPLY CARRIES ONE TOO, at the right of its lattice, 12 mm
    below its stowed bail where no part of the bail is; it was removed for a round on the AC
    sibling's reasoning and the reviewer caught it. THE AC SUPPLY CARRIES NONE: its matching
    ring sits exactly at the deployed bail's root and is the bail's end seen in perspective.
    The trays' lens sits where no bail is. The quick start guide's System
    LEDs/Buttons page lists the six chassis lamps and the RJ-45's pair and stops; the datasheet
    names port, management-port and system LEDs and no module lamp.
    The lamps are drawn because they are there, with the library's default off/on states. No
    green/amber legend is invented for them.
- what: port-lamp-semantics
  scope: [front]
  reason: vendor-silent
  wanted: >-
    What distinguishes the four lamps of one port. The panel draws four round windows per port
    and the guide gives the PORT one legend - "QSFP-DD800 LEDs: Yellow (800G), Blue (400G),
    White (200G), Green (100G)" - which is a colour per SPEED, not a meaning per window.
    common/qsfp-lane-leds-column@1 hit the identical conflict on the DCS510, where the guide goes
    one step further ("100G Breakout: 1-4 LEDs Green") and implies one lamp per breakout lane;
    nothing here says that. The four lamps carry the library's off/on default rather than a
    per-lamp vocabulary nobody published. A port-LED table, or one photograph of a lit port,
    settles it.
- what: the-four-undrawn-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, the underside and the two side walls. Between them the two staged
    documents draw two elevations, a LED enlargement, two FRU figures, the airflow figures and
    a power-connection page, and not one of them shows a third face. Each carries an `empty:`
    sentence saying where I looked, per docs/deliberately-empty-faces.md.
groups:
  qsfp-dd800:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the thirty-two 800G QSFP-DD800 ports, in sixteen stacked columns on a uniform 24.241 mm
      pitch, numbering down each column from 1 at the top left to 32 at the bottom right - odd
      ports the upper row, even the lower, as the panel's own `N (up) (down) N+1` legends say.
    attrs: {media: qsfp-dd, speed: 800g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster at the right of the port row - two 25G SFP28 in-band management
      cages, a 1000BASE-T RJ-45 management jack, an RJ-45 serial console, a USB-C storage port
      and the reset button. The datasheet lists the SFP28 pair under "Management Ports on Port
      Side" alongside the two RJ-45s, which is why they are in this group and not the traffic
      one.
  leds: {term: LED, role: indicator, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        datasheet: "PSUs: 2 redundant, load-sharing, hot-swappable 2400 W AC/DC". Two 2400 W
        supplies against a stated 1600 W full-load draw is a genuine 1+1, and the guide says so
        from the other side: a single supply may power a fully loaded system provided it is on
        200-240 VAC.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '6+1'
      redundancy-note: >-
        datasheet, twice: "7 Hot-swappable fan modules with 6+1 redundant fans" in the feature
        list and again in the interface callouts, against seven bays measured on the rear
        elevation. The digit form and the bay count agree. SEVEN BAYS IS ONE MORE THAN ANY
        OTHER 1RU REAR IN THIS LIBRARY.
