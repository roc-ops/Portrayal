format: 1
kind: device
name: ais800-32d
version: 2.0.0
maturity: modelled
manufacturer: Edgecore
model: AIS800-32D
portfolio: {line: AI and Data Center, family: AI/ML Switch, series: AIS800}
description: >-
  32 x 800G QSFP-DD800 AI and data centre 1RU switch on a Broadcom Tomahawk 5 with an Intel
  Xeon D-1713NTE and an OpenBMC service processor, sold as the AIS800-32D. All ports are on the
  FRONT with two 25G SFP28 in-band management cages, an RJ-45 management jack, an RJ-45 console,
  a USB-C storage port, six system lamps and a reset button; two 2400 W supplies and SEVEN fan
  trays are on the rear. Its twin edgecore/ais800-32o is the same chassis, the same rear and the
  same management cluster with an OSFP800 wall in place of this one's QSFP-DD800 wall - and the
  two walls are laid out differently, which is the whole reason they are two models.
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the rule, not an observation,
      so a photograph of the stack overturns it: the 16 QSFP-DD pairs (port-1/port-2 to
      port-31/port-32).
  sources:
    confidence: datasheet
    note: >-
      A QUICK START GUIDE AND A DATASHEET, AND THEY DISAGREE ABOUT THE HEIGHT. Both are staged:
      ais800-32d-qsg (7 pages, bilingual) and ais800-32d-datasheet. The guide carries the
      Overview elevations, a System LEDs/Buttons enlargement, the FRU replacement figures, the
      Airflow Reversal figures and a Connect Power page that draws the DC supply's face; the
      datasheet carries the ordering tables, the part numbers and the power ratings.
      FIVE PHOTOGRAPHS ARE STAGED AND NONE OF THEM HELPS. All five are 960 x 700, which is
      2.19 px/mm on a 438.4 mm face - less than half the elevation's resolution. They settle
      colour and nothing else.
  gate-1:
    confidence: measured
    note: >-
      PASSES, AND THE HEIGHT DISAGREEMENT IS SETTLED BY THE DRAWING RATHER THAN BY PICKING A
      DOCUMENT.
      THE TWO SOURCES GIVE DIFFERENT HEIGHTS AND BOTH ARE INTERNALLY CONSISTENT. The quick
      start guide's Hardware Specifications table reads "438.4 x 589 x 44 mm (17.26 x 23.19 x
      1.73 in.)" and the datasheet reads "43.84 x 58.9 x 4.3 cm (17.26 x 23.19 x 1.69 in.)".
      44 mm is 1.732 in and 43.0 mm is 1.693 in, so neither is a conversion slip - the width
      and depth agree to the hundredth of an inch and only the height differs.
      THE REAR ELEVATION IS ISOTROPIC AT 44 AND NOT AT 43. Rendered from the PDF page at 600 dpi
      it reads 2221 x 223 px. Against 438.4 mm that is 5.0662 px/mm; against 44.0 mm the height
      gives 5.0682 - 0.04% apart. Against 43.0 it gives 5.1860, 2.4% out. A drawing that is
      square on one number and 2.4% out on the other has answered the question. 44.0 is used.
      THE FRONT ELEVATION IS NOT ISOTROPIC and is measured on its own x scale only. It reads
      2215.5 px wide - 5.0536 px/mm - and about 226.5 px of ink tall, which at that scale is
      44.8 mm. The extra 0.8 mm is the drop shadow under the chassis, which the lower row bands
      show widening the ink to 2274 px where the top bands hold 2215. The face is taken as the
      top edge plus 44.0 and the shadow discarded. THE INK BOUNDING BOX IS NOT THE FACE, again.
      THE TWO ELEVATIONS ARE DRAWN AT DIFFERENT SCALES on the same page - 5.0536 and 5.0662,
      0.25% apart - so each face is measured on its own and neither carries the other's numbers.
  the-drawings-are-upscales-and-that-was-checked:
    confidence: measured
    note: >-
      THE 600 DPI RENDER IS AN INTERPOLATION OF A 1.83 px/mm RASTER, and this was found late
      rather than assumed early. The elevations are embedded in the PDF at 836 x 118 and
      832 x 108 px, so rendering the page at 600 dpi upscales them 2.8x.
      THE EDGE MEASUREMENTS SURVIVE. Re-running the seam detector on the EMBEDDED rear image at
      its native 1.8294 px/mm puts the inner fan rails at 150.3/153.6, 195.1/198.4, 238.9/243.3
      and 284.8/288.1 against the upscale's 149.82/153.18, 194.82/198.18, 239.83/243.19 and
      284.64/288.19 - every one within 0.5 mm, half a native pixel - and the native pitch of
      44.83 against the upscale's 45.005. Averaging a vertical edge over 200 rows genuinely
      buys sub-pixel localisation; the closing arithmetic on the rear is the second check.
      WHAT DOES NOT SURVIVE IS LETTERING, and two things were dropped because of it. See the
      fan-bay-numerals gap. A legend that is 3.7 native pixels tall is not read, it is guessed.
  the-optical-wall:
    confidence: measured
    note: >-
      SIXTEEN STACKED COLUMNS ON A UNIFORM PITCH, AND THAT IS A DIFFERENCE FROM THE TWIN.
      2D template matching of one cage column across the front face finds all sixteen at 7.92,
      32.25, 56.40, 80.73, 104.88, 129.02, 153.36, 177.50, 201.84, 226.18, 250.32, 274.46,
      298.80, 323.14, 347.28 and 371.62, fitting a pitch of 24.2410 with an rms of 0.069 mm and
      a worst residual of 0.114. There is NO ganging and no gutter: the residuals alternate
      +-0.1 mm, which is the drawing's half-pixel and not a block structure.
      edgecore/ais800-32o's wall on the same page of its own guide fits a block model instead -
      four blocks of four on a 23.424 in-block pitch with a 3.09 mm gutter - so the two were
      fitted independently and the difference is real. Template matching found it; a single
      periodic fit would have averaged it away, which is the EXP100's autocorrelation lesson
      applied before the fact rather than after.
      EACH COLUMN IS ONE STACKED ASSEMBLY. The panel draws a single bezel per column holding the
      upper aperture, a bright honeycomb band and the lower aperture, with the pair numbered
      `N (up) (down) N+1` on one baseline beneath it. Odd ports are the upper row and even the
      lower - the guide's own enlargement prints `31 (up) (down) 32` at the right-hand end and
      the panel prints `1 (up) (down) 2` at the left.
      ROWS. A row profile through one column puts the upper aperture at y 6.73 to 15.43 and the
      lower at 24.73 to 33.44 - a row pitch of 18.00 to the millimetre, and two drawn openings
      of 8.70 and 8.71. std/qsfp-dd@1's registry aperture is 10.0 tall, so the drawn openings
      are 1.3 mm SHORT of it and the registry figure is used anyway, as the EXP100 records for
      the same reason: the registry owns the aperture and the device owns the pitch.
      Drawn widths are 18.3 against the registry's 19.0, the same consistent bias.
      THE INTER-ROW BAND IS DRAWN ON A BACKING RECT AND THAT IS DELIBERATE. Panel pattern decor
      paints only its holes, so a slot field on a dark panel is invisible; this band is BRIGHT on
      the hardware - a perforated silver strip between the two cage rows, whose lower edge reads
      solid at y 22.79-24.18 in the elevation - so each column gets its own light rect beneath
      the pattern - SIXTEEN bands, not one strip, because the band belongs to the cage assembly
      and stops at the dark post between columns. The left, top and bottom vent fields get none, because those really are dark slots punched in
      the grey panel and the pattern alone is what they look like.
  the-management-cluster-is-shared-with-the-twin:
    confidence: measured
    note: >-
      AND THAT WAS MEASURED ON BOTH, NOT ASSUMED. The same scan run on this device's front and
      on edgecore/ais800-32o's puts the two SFP28 apertures at 394.77-408.22 and 409.21-422.47
      here against 394.75-408.12 and 409.30-422.67 there - 0.2 mm apart on a feature 13 mm wide,
      read off two separate drawings. The cluster is one CPU/BMC faceplate and both models carry
      it unchanged.
      WHAT IS IN IT. Two 25G SFP28 cages in one bezel legended `1 (up) 25G (up) 2`; a USB-C
      receptacle standing PORTRAIT to their right, legended SS with the USB trident; an RJ-45
      management jack legended MGMT and an RJ-45 console legended CONSOLE beneath them, bezels
      393.98-409.41 and 413.57-429.00 by y 20.78-33.64 against std/rj45@2's 15.8 x 13.2; and a
      recessed dark strip along the bottom carrying a round reset button legended RST and six
      lamps.
      THE USB IS A USB-C AND THE DATASHEET CALLS IT SOMETHING ELSE. Both documents' port lists
      say "1 x USB 3.0 storage port" with no connector type; the panel draws a tall rounded slot
      3.8 x 8.8 mm with the SuperSpeed trident beside it, which is a Type-C on its side. USB 3.0
      is the protocol and Type-C is the connector, so both are recorded and neither contradicts
      the other. std/usb-c@1 is placed `rotate: 90`.
      THE SFP28 LEGEND ALSO PRINTS A TRIANGLE BESIDE EACH NUMERAL - the panel reads
      `1 (up) 25G (up) 2` - and only the numerals and the 25G are drawn. On the 800G wall the
      matching triangle IS a lamp and is placed as one; here there is no window to anchor it to,
      so printing the glyph would assert a mark whose nature was not established. See the
      sfp28-and-port-lamp-positions gap.
  the-triangles-are-printed-and-the-lamps-are-round:
    confidence: measured
    note: >-
      AND THE FIRST MODEL OF THIS DEVICE HAD IT BACKWARDS. The panel prints
      `N (up) (down) N+1` beneath every column, and the triangles were first placed as
      common/led-arrow@1 lamps, which is what edgecore/exp100-32x and edgecore/exp800-16o do
      with the same-looking marks.
      THE DRAWING SAYS THEY ARE INK. The triangles are solid white, the same white and the same
      crispness as the numerals beside them. Every lamp on this face reads differently - a
      bright dome inside a dark rim - which is exactly how the six system lamps, the two SFP28
      lamps and the round port lamps all render. A light pipe and a silkscreen glyph do not look
      alike at 5 px/mm, and these look like the numerals.
      SO THE ARROWS ARE SILKSCREEN and there are thirty-two of them, one per port, saying which
      row its number belongs to. No other device in this library prints this glyph yet.
      THE NUMERALS WERE ALSO TOO SMALL. They measure about 2.3 mm of cap height against the
      1.3 mm font first used; 2.8 is what puts them at the drawn size.
  the-panel-is-mid-grey-and-that-is-why-the-vents-can-be-seen:
    confidence: photo-measured
    note: >-
      THE CHASSIS COLOUR WAS CARRIED FROM ITS SIBLINGS AND IS WRONG. edgecore/exp100-32x,
      edgecore/exp800-16o and the rest of this line all carry '#3f4348', which nothing measured.
      Sampling the panel between features on the front elevation gives #626366, #737579 and
      #5d5d5e, and the vendor's own photograph ais800-32d-2-AIS800-32D-F.png gives row medians
      of #676767, #696363 and #776f6d. Two independent sources, one answer: a MID grey.
      IT MATTERS BECAUSE PANEL PATTERN DECOR PAINTS ONLY ITS HOLES. On a near-black panel a
      field of dark slots is invisible, which is exactly how the first render came out - four
      vent fields declared and none of them legible. On the measured grey they read as they do
      on the drawing. The fix is the colour, not a backing rect, because these really are dark
      holes punched in a grey panel.
      THE FIELDS THEMSELVES ARE MEASURED: a vertical slot column at x 1.98-3.17 by y 6.33-38.98;
      two horizontal bands across the port wall at y 0.40-1.58 and 3.56-5.54; and a three-row
      field along the bottom from y 39.37 to 43.93, whose cells start at x 10.77 on a 3.17 pitch.
      THERE IS NO VENT FIELD AT THE RIGHT-HAND END. The columns from x 431 to 435 read a flat
      67-69 with no structure at all; the right margin is plain metal behind the lamp strip.
  the-port-lamps-are-four-round-windows-in-the-post:
    confidence: measured
    note: >-
      FOUR PER PORT, EIGHT PER COLUMN, IN THE DARK POST TO THE LEFT OF EACH CAGE - and they were
      missed entirely on the first pass because the triangles had been taken for the lamps.
      THEIR ROWS ARE WELL MEASURED. In one post the dot centres read y 7.32, 10.39, 13.36 and
      16.42 for the upper port and 23.25, 26.32, 29.48 and 32.45 for the lower - a 3.04 mm pitch
      on lamps about 1.4 mm across. common/qsfp-lane-leds-column@1 is 1.8 x 11.4 with its four
      lamps on a 3.0 mm pitch, photo-measured on the DCS510 of this same vendor, and it drops
      onto those rows within 0.15 mm. It is seated rather than a new part cut.
      THEIR COLUMN IS LESS WELL MEASURED, at about 2.0 mm left of each aperture's left edge. A
      constrained fit at the known 24.241 port pitch scatters over roughly a millimetre because
      a 1.4 mm lamp is seven pixels here and the cage bezel's own bright edge sits beside it.
      The offset is used as measured and the scatter is the reason this is not tighter.
      WHAT THE FOUR MEAN IS NOT PUBLISHED. The guide gives ONE legend for the port - "QSFP-DD800
      LEDs: Yellow (800G), Blue (400G), White (200G), Green (100G)" - and draws four windows.
      common/qsfp-lane-leds-column@1 hit the same conflict on the DCS510 and reduced its states
      to the off/on default rather than invent a per-lamp vocabulary; that is inherited here.
      See the port-lamp-semantics gap.
      THE FOUR WINDOWS ARE PUNCHED AS FOUR ROUND 1.4 mm CUTOUTS PER PORT, `led-port-N-lane-K`,
      each derived from the seated column's own lane element rather than measured again, so
      they land on the rows above within 0.2 mm. expand.py punches only a lamp with one
      opening, so these are written out by hand; one 1.8 x 11.4 slot would claim metal the
      elevation does not show. Until #395 L39 accepted a lamp only when one hole covered more
      than half of it, so these four did not count and the device waived the warning.
  the-sfp28-cages-have-a-lamp-each:
    confidence: measured
    note: >-
      ONE ROUND WINDOW ABOVE EACH CAGE, and they were missed on the first pass too. The
      elevation puts bright blobs at x 399.92-401.30 and 414.16-415.75 by y 2.90-4.28 - centres
      400.61 and 414.96, 14.35 mm apart against the cages' own 14.5 mm pitch - and the System
      LEDs enlargement resolves them as white domes in dark rims, the same as every other lamp
      on this face. The guide names them: "SFP28 LEDs: Green (link/activity)".
  the-system-lamps:
    confidence: measured
    note: >-
      SIX RECTANGULAR LAMPS AND A ROUND BUTTON, ALL LEGENDED, WHICH IS BETTER EVIDENCE THAN THIS
      LINE USUALLY GIVES. The quick start guide's System LEDs/Buttons page enlarges the strip
      and names every one: "LOC: Flashing Green (switch locator). DIAG: Green (OK), Red (fault).
      ALRM: Red (fault). FAN: Green (OK), Red (fault). PSU1/PSU2: Green (OK), Red (fault)" and
      "RST: Reset button".
      THE POSITIONS ARE READ OFF THE ELEVATION AND THE SHAPE OFF THE ENLARGEMENT. A bright-run
      scan across the strip at y 39.0-40.2 finds seven runs: the button at 391.40-392.00 and the
      six lamps at 401.50-403.08, 407.04-408.62, 412.58-413.96, 418.32-419.50, 423.66-424.85 and
      429.00-430.39. Their centres fit a 5.482 mm pitch. The enlargement resolves them as
      rounded rectangles about 2.4 times as wide as tall, each directly BELOW its legend - not
      the round dots this line's other 1RU switches use, and not a mixture of the two.
      THE LIBRARY'S NEAREST PART IS BIGGER THAN THE DRAWING. common/led-rect-sm@1 is 2.8 x 1.6
      where the drawing reads 1.83 x 0.75, and common/reset-button@1 is 4.0 across where the
      button reads 2.5. Both are seated at the measured CENTRES rather than the measured sizes,
      because the library's indicator vocabulary is what a reader compares across devices. The
      2.74 mm gap that remains between adjacent lamps is why the oversize is harmless here.
  the-rear-closes-arithmetically:
    confidence: measured
    note: >-
      SEVEN INDEPENDENTLY MEASURED SPANS SUMMING TO THE STATED WIDTH, which is the strongest
      check this rear has. 4.74 of chassis frame, 53.69 of PSU1, 4.73 of rail, 311.68 of fan
      block, 4.36 of rail, 53.70 of PSU2 and 5.50 of frame sum to 438.40.
      THE FAN PITCH TOOK FOUR INSTRUMENTS AND ONLY ONE OF THEM WAS RIGHT. Bay seams gave 45.05,
      the bails' edges 47.08, autocorrelation 45.05 and 48.80. The bails disagree because the
      FRU figure shows they are U-loops posed at a different angle in every bay - segmenting the
      salmon in the seven bays gives seven different vertical spans for seven identical parts.
      2D TEMPLATE MATCHING OF THE HONEYCOMB SETTLED IT: six of the seven trays match at 60.60,
      105.60, 150.81, 195.81, 285.82 and 331.02 (the seventh is under PSU2's bail), fitting
      45.025 with an rms of 0.10. The tray frames read on two separate row bands then give
      41.65 wide with a 3.36 mm rail, and 41.65 + 3.36 = 45.01. A POSED HANDLE IS NOT A
      MEASUREMENT; the part that repeats is.
      THE SUPPLIES ARE 53.7 AND BOTH WERE READ. PSU1 4.74-58.43 and PSU2 379.20-432.90 give
      53.69 and 53.70. The first read of PSU1 gave 51.2 by taking an internal seam at 56.06 for
      its right frame; the symmetry and the closing sum identify which edge is which.
      THE MODULE HEIGHT IS MEASURED HERE, NOT BORROWED. Horizontal seams at y 1.38 and 42.04
      bound both module types, giving 40.66 for the supplies and 40.6 for the trays. 40.6 is
      used for both. The rest of this library's Edgecore 1RU rears carry 40.0 as an estimate.
  power:
    confidence: datasheet
    note: >-
      2400 W PER SUPPLY, STATED IN BOTH DOCUMENTS, WHICH IS UNUSUAL FOR THIS LINE. The
      datasheet's feature list reads "Hot-swappable, load-sharing, redundant 2400 W AC/DC PSUs"
      and its ordering table names PSU-AC-2400W-F/-B and PSU-DC-2400W-F/-B as FRUs. The
      EXP800 and EXP100 supplies in this library carry no output rating at all because their
      vendor pages publish none.
      DRAW IS STATED TWICE AND BOTH FIGURES ARE RECORDED: "Full loading 1600 W (100% traffic,
      32 x 24 W optics)" and "1254 W (100% traffic, 32 x 12 W optics)". The higher is the max.
      INPUT, from the quick start guide's specifications table: "200-240 VAC, 50/60Hz, 15 A max.
      per PS" and "-48 - -60 VDC, 53 A max. per PS". There is no low-line AC rating anywhere,
      and the guide adds that a single supply powering a fully loaded system must be on
      200-240 VAC.
      THE PER-PORT BUDGET IS 30 W and is the datasheet's, qualified by it: "for all 32 ports all
      with per-port maximum 30 W capability ... subject to total power distribution boundary and
      thermal considerations".
  airflow:
    confidence: datasheet
    note: >-
      BOTH DIRECTIONS, AS SEPARATE SKUs, AND THE COLOUR RULE IS SHOWN RATHER THAN STATED. The
      ordering table lists ten AC part numbers per model - five cord regions x two airflows -
      plus a DC pair, and the FRU table pairs PSU-AC-2400W-F and FAN-1U-1x1P-F with front-to-back
      and the -B parts with back-to-front.
      THE GUIDE'S AIRFLOW REVERSAL FIGURES DRAW RED BAILS ON THE F2B BUILD AND BLUE ON THE B2F
      BUILD, on both the trays and the supplies. Unlike the DCS240's guide this one never writes
      the rule in words, so the colours here come from its figures and from the family
      convention. See roc-ops/Portrayal#277.
      THE TWO BUILDS ARE DERATED DIFFERENTLY: the datasheet gives front-to-back 0-40 C at
      6000 ft and back-to-front 0-35 C, "subject to used optics".
