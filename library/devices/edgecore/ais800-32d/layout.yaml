  physical:
    weight-note: '14.69 kg (32.39 lb), with 2 PSUs and 7 fans installed'
  platform:
    cpu: 'Intel Xeon D-1713NTE, 4-core 2.2 GHz'
    switch-silicon: 'Broadcom BCM78902 Tomahawk 5'
    bmc: 'AST2620 running OpenBMC, secured by an AST1060 root of trust'
    memory: '32 GB DDR4 SO-DIMM with ECC'
    storage: '240 GB M.2 2280 NVMe SSD'
    flash: '64 MB SPI x 2'
    tpm: 'TPM 2.0 SPI'
