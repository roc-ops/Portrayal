  features:
    optics-qsfp-dd: >-
      datasheet: each port takes 1 x 800 GbE at 106 Gb/s PAM4, or breaks out to 2 x 400G,
      4 x 200G or 8 x 100G. At 50 Gb/s PAM4 it takes 1 x 400G or breaks out to 2 x 200G,
      4 x 100G or 8 x 50G; at 25 Gb/s NRZ it takes 1 x 100G. Maximum 160 logical ports.
  lifecycle: {eol: none-announced}
