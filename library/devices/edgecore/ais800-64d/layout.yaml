configurations:
  ac-f2b:
    kind: orderable
    power: ac
    description: >-
      Dual 3000 W AC PSUs, front-to-back airflow - red tray bars and red PSU latches, which
      is the build the rear elevation and the datasheet's first rear photograph show. Rated
      0-40 C at 1800 m.
    default: true
    part-numbers:
      AIS800-64D-AF-UN: {part: FP6EC9664004Z, power-cord: 'IEC 60320 C19-C20'}
      AIS800-64D-AF: {part: FP6EC9664002Z, power-cord: none}
  ac-b2f:
    kind: orderable
    power: ac
    description: >-
      Dual 3000 W AC PSUs, back-to-front airflow - blue bars and latches, which the
      datasheet's second rear photograph shows. Derated to 0-35 C, "subject to used optics".
    airflow: back-to-front
    region-context: {exhaust: Intake}
    component-attrs:
      fan-2u-1x1sn: {handle-finish: '#3d7bd6'}
      ais800-64-psu-ac: {latch-finish: '#3d7bd6'}
    part-numbers:
      AIS800-64D-AB-UN: {part: FP6EC9664005Z, power-cord: 'IEC 60320 C19-C20'}
      AIS800-64D-AB: {part: FP6EC9664008Z, power-cord: none}
  dc-f2b:
    kind: orderable
    power: dc
    description: >-
      Dual 3000 W DC PSUs, front-to-back airflow. The DC supply lands -48 to -60 VDC on a
      six-stud terminal block - feed and return doubled, plus a signal pair - and the guide
      calls for #4 AWG / 21.2 mm2 copper. No power cord ships.
    bays: {psu-1: 'edgecore/ais800-64-psu-dc@1', psu-2: 'edgecore/ais800-64-psu-dc@1'}
    part-numbers:
      AIS800-64D-DF: {part: FP6EC9664014Z}
  dc-b2f:
    kind: orderable
    power: dc
    description: >-
      Dual 3000 W DC PSUs, back-to-front airflow - blue tray bars. The DC supply's own release
      latch is green in both builds and is not recoloured; see the airflow note.
    airflow: back-to-front
    region-context: {exhaust: Intake}
    bays: {psu-1: 'edgecore/ais800-64-psu-dc@1', psu-2: 'edgecore/ais800-64-psu-dc@1'}
    component-attrs:
      fan-2u-1x1sn: {handle-finish: '#3d7bd6'}
    part-numbers:
      AIS800-64D-DB: {part: FP6EC9664016Z}
references:
- {title: 'Edgecore AIS800-64D 800 Gigabit AI & Data Center Ethernet Switch Quick Start Guide'}
- {title: 'Edgecore AIS800 Data Center Switch AIS800-64O/AIS800-64D Data Sheet'}
