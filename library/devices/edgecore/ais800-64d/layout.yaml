gaps:
- what: ground-pair-pitch
  scope: [ground-screws]
  reason: vendor-silent
  wanted: >-
    The spacing of the two grounding screw holes on the rear panel. Neither staged document
    dimensions them: the quick start guide names the screws (two M6) and the lug (Panduit
    LCDXN2-14AF-E or an equivalent), and the datasheet's rear photograph puts the holes about
    16.2 apart, which is a reading off a product shot. The pair is drawn at the 5/8 in. of the
    named lug's hole-spacing code; a drawing that dimensions the holes, or the lug's own
    datasheet, would confirm it.
- what: module-lamp-legend
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    What the lamp on each fan tray means. Every one of the four trays carries a round lens at
    its top left - a bright dot about 2 mm across on the datasheet's rear photograph - and
    neither staged document mentions it. The quick start guide's System LEDs/Buttons page
    lists the six chassis lamps and the RJ-45's pair and stops; the datasheet names port,
    management-port and system LEDs and no module lamp. THE SUPPLIES CARRY NONE: the only
    round features on the AC supply's face are the two Phillips screw heads at its corners,
    which is the AIS800-32D's finding for the same vendor's supplies. The trays' lamps are
    drawn because they are there, with the library's default off/on states.
- what: port-lamp-speed-colours
  scope: [front]
  reason: vendor-silent
  wanted: >-
    Whether the port lamp's four colours are the only states it has. The guide gives
    "QSFP-DD800 LEDs: Yellow (800G), Blue (400G), White (200G), Green (100G)" and the
    datasheet's own summary says "Port LEDs: Link Status, Activity, Rate" - three FUNCTIONS
    for one window and four colours for the rate alone. The four rate colours are declared
    because they are named; whether the window also blinks for activity, and what it shows
    for link without traffic, is not published. A port-LED table, or one photograph of a lit
    port at a known speed, settles it.
- what: dc-connector-identity
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    What the DC supply's six-bore input connector actually is. The guide's Connect Power page
    draws the face and legends the poles - "1. -48 - -60 VDC, 2. DC return, 3. Signal +,
    4. Signal -", with 1 on both left bores, 2 on both right, 3 on the upper centre and 4 on
    the lower - and the datasheet gives the rating and the wire gauge. NEITHER NAMES THE
    CONNECTOR. That is the difference from this line's AC inlets, which both documents name
    outright (this model's "IEC 60320 C20", the AIS800-32D's "Anderson Saf D Grid"), and it
    matters because a named part gets the manufacturer's own drawing and an unnamed one gets
    a figure measured at 7.18 px/mm. edgecore/ais800-64-psu-dc@1 is drawn to that figure and
    says so. A vendor drawing, an FRU page, or a photograph of the mating cable's connector
    settles whether this is a catalogue part whose real dimensions should replace the
    measured ones.
- what: the-four-undrawn-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, the underside and the two side walls. Between them the two staged
    documents draw two elevations, a LED enlargement, four product photographs, the FRU
    figures and a power-connection page, and not one of them shows a third face. Each carries
    an `empty:` sentence saying where I looked, per docs/deliberately-empty-faces.md.
groups:
  qsfp-dd800:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the sixty-four 800G QSFP-DD800 ports, in TWO BANKS of sixteen stacked columns on a
      uniform 24.019 mm pitch. Ports 1-32 are the upper bank, numbered down each column from
      1 at the top left, and 33-64 the lower - odd ports the upper row of their bank and even
      the lower, as the panel's own `N (up) (down) N+1` legends say. The upper bank's legends
      are printed above it and the lower bank's below.
    attrs: {media: qsfp-dd, speed: 800g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster at the right of the port wall - two 25G SFP28 in-band
      management cages, a 1000BASE-T RJ-45 management jack, a USB 3.0 Type-A storage port,
      an RJ-45 serial console and the reset button. The datasheet lists the SFP28 pair under
      "Management Ports on Port Side" alongside the RJ-45s, which is why they are in this
      group and not the traffic one.
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the three timing jacks the datasheet lists as "Timing Ports: 1PPS, 10 MHz, TOD" - two
      SMA coaxial inputs and an RJ-45 time-of-day port. The AIS800-32D has none of these.
  leds: {term: LED, role: indicator, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        datasheet: "PSUs: 2 redundant, load-sharing, hot-swappable 3000 W AC/DC". Two 3000 W
        supplies against a stated 2775 W ceiling is a genuine 1+1, and the guide says so from
        the other side: a single supply may power a fully loaded system provided it is on
        200-240 VAC.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '7+1'
      redundancy-note: >-
        datasheet, twice: "4 hot-swappable fan modules (2 fans per module), 8 fans total with
        7+1 redundancy", in the feature list and again in the physical section. THE BAY COUNT
        AND THE FAN COUNT ARE DIFFERENT NUMBERS AND THIS DEVICE HAS TO SAY WHICH IT MEANS:
        four bays are modelled, because four trays are what the rear draws and what a hand
        removes; the 7+1 counts the EIGHT rotors inside them, two per tray. The AIS800-32D's
        "6+1" counts seven trays of one fan each, so the two models' figures are not
        comparable without this sentence.
