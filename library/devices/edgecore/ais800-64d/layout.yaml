kind: device
name: ais800-64d
version: 4.0.0
maturity: modelled
manufacturer: Edgecore
model: AIS800-64D
portfolio: {line: AI and Data Center, family: AI/ML Switch, series: AIS800}
description: >-
  64 x 800G QSFP-DD800 AI and data centre 2RU switch on a Broadcom Tomahawk 5 with an Intel
  Xeon D-1713NTE and an OpenBMC service processor, sold as the AIS800-64D. All ports are on
  the FRONT in TWO BANKS of sixteen stacked columns, with two 25G SFP28 in-band management
  cages, an RJ-45 management jack, a USB 3.0 Type-A storage port, an RJ-45 console, a ToD
  jack, 1PPS and 10 MHz timing jacks, six system lamps and a reset button; two 3000 W
  supplies and FOUR fan trays are on the rear. Its twin edgecore/ais800-64o is the same
  chassis with an OSFP800 wall. This is NOT a taller AIS800-32D: the 32-port models are a
  438.4 x 589 x 44 shell with seven 1RU trays and 2400 W Saf-D-Grid supplies, and this is a
  440 x 649.2 x 87 shell with four 2RU trays and 3000 W C20 supplies. Nothing crosses over.
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the port lamps, which point up
      over down: the 1 SFP pair (mgmt-inband-1/mgmt-inband-2). Decided by the rule, not an
      observation, so a photograph of the stack overturns it: the 32 QSFP-DD pairs (port-1/port-2
      to port-63/port-64).
  sources:
    confidence: datasheet
    note: >-
      A QUICK START GUIDE AND A DATASHEET, AND FOR ONCE THEY AGREE ABOUT THE CHASSIS. Both
      are staged: ais800-64d-qsg (8 pages, bilingual, 69 figures) and ais800-64d-datasheet
      (5 pages, 4 figures). The guide carries the Overview elevations, a System LEDs/Buttons
      enlargement, the FRU replacement figures and a Connect Power page that draws the DC
      supply's face; the datasheet carries photographs of BOTH airflow builds, the ordering
      tables and the power ratings. The guide's specification table reads "440 x 649.2 x
      87 mm (17.32 x 25.56 x 3.43 in.)" and the datasheet "44 x 64.92 x 8.7 cm (17.32 x
      25.56 x 3.43 in.)" - the same numbers in different units, which the AIS800-32D's two
      documents notably did not manage.
      THE WEIGHT IS THE ONE DISAGREEMENT: the guide says 21.2 kg "with 2 PSUs and 4 fans
      installed" and the datasheet 21.5 kg "with 2 PSUs and 4 fan modules installed". Both
      are recorded; 21.2 is used because the guide is the document that also carries the
      measured elevations.
      FIVE PHOTOGRAPHS ARE STAGED and unlike the 32-port models' they are worth something:
      at 960 x 700 over a 440 mm face they are 2.18 px/mm, but the DATASHEET's own page-2
      photographs render at 8.99 px/mm and were measured beside the drawing throughout.
  gate-1:
    confidence: measured
    note: >-
      PASSES. The front elevation reads 2224 x 442 px at 600 dpi; 2224/440 is 5.0545 px/mm
      and 442/87 is 5.0805 - 0.5% apart. The rear reads 2228 x 442: 5.0636 and 5.0805, 0.3%
      apart. Each face is measured on its own x scale, and the two are 0.2% apart from each
      other, so neither carries the other's numbers.
      THE DRAWINGS ARE UPSCALES AND THAT WAS CHECKED, as the 32-port models' were. The
      datasheet's page-2 photographs are embedded at 3.67 px/mm and were scanned at their
      own scale as an independent instrument; every rear edge below agrees between the two
      within 0.5 mm, which is what stops a 600 dpi render of a 1.8 px/mm raster from being
      believed on its own.
  the-optical-wall:
    confidence: measured
    note: >-
      SIXTY-FOUR PORTS IN TWO BANKS OF SIXTEEN STACKED COLUMNS, and the bank structure is the
      whole difference from the 32-port model. Each column is one bezel holding an upper
      aperture, a bright honeycomb band and a lower aperture; the upper bank's columns are
      legended `N (up) (down) N+1` ABOVE them and the lower bank's BELOW, so ports 1-32 are
      the upper bank and 33-64 the lower. The guide's enlargement prints `25 (up) (down) 26`
      over the upper bank's thirteenth column and `57 (up) (down) 58` under the lower bank's,
      which is the arithmetic confirmed at both ends.
      THE ASSEMBLY IS BUILT AROUND THE APERTURE'S CENTRE, NOT ITS TOP EDGE, and the first
      model of this device was not. std/qsfp-dd@1's registry opening is 10.0 tall where this
      panel draws 8.51; hanging the block from the drawn aperture's top edge put all 1.49 mm
      of the surplus at the BOTTOM of every assembly, and at review that showed as a border
      under the lower bank's screens that the upper bank's did not have, and as a gasket row
      that could only be drawn at one end. Centring the registry aperture on the drawn one
      splits the surplus, 0.745 mm each way, and every part of the assembly is then placed
      from the block's own y: 0.55 mm of shell either side of the 19.0 aperture, a gasket row
      at each end, and the screen filling exactly the space between the two apertures. The
      two banks come out identical, which is what the hardware is.
      ONE ROW PITCH IS USED FOR BOTH BANKS. Fitted separately they give 17.61 (upper) and
      17.41 (lower) - 0.2 mm apart, which is one pixel on a 5.05 px/mm elevation - and the
      hardware is plainly one cage assembly used twice. 17.51 is the mean and puts every row
      within 0.1 mm of where it was measured.
      THE PITCH IS 24.019 AND BOTH BANKS WERE FITTED SEPARATELY. Aperture edges scanned along
      four separate row bands give left-edge fits of 24.0209 (upper) and 24.0171 (lower) with
      an rms of 0.06 mm, and centre fits of 24.0194 and 24.0175 with an rms of 0.035. Four
      independent fits inside 0.004 mm of each other is one pitch, and 24.019 is used for
      both. There is no ganging: the residuals alternate by a tenth of a millimetre, which is
      the drawing's half-pixel and not a block structure.
      ROWS. Aperture spans down one column read 14.64-23.15, 32.25-40.76, 48.27-56.58 and
      65.68-74.39 - row pitches of 17.61 within the upper bank and 17.41 within the lower,
      33.63 between the banks. The drawn openings are 18.28 x 8.51 against std/qsfp-dd@1's
      registry 19.0 x 10.0, the same consistent bias the EXP100 and the AIS800-32D both
      record: the registry owns the aperture and the device owns the pitch.
      THE INTER-ROW BAND IS DRAWN ON A BACKING RECT, for the reason
      vent-field-needs-backing-rect exists - panel pattern decor paints only its holes, and
      this band is BRIGHT: a white honeycomb web between the two apertures of each column,
      reading 24.33-31.85 in the upper bank and 57.18-64.50 in the lower. Thirty-two bands,
      one per column per bank, because the band belongs to the cage assembly and stops at the
      dark post between columns.
  the-port-lamps-are-one-round-window-each:
    confidence: measured
    note: >-
      ONE LAMP PER PORT, ON THE POST TO THE LEFT OF ITS CAGE, and the first model of this
      device had a strip of eight along the bezel instead - a whole component was written for
      that and thrown away when the enlargement was read properly.
      THE ENLARGEMENT SETTLES IT. The guide's System LEDs/Buttons page draws the last four
      columns at 15.0 px/mm, three times the elevation's resolution. On every post it shows
      FOUR round dots about 1.0 mm across, at y 18.42, 37.20, 51.83 and 70.68 - one level
      with each of the four aperture rows. Scanned across the whole enlargement they appear
      at x 322.51, 346.50 and 370.49 against column left edges of 324.91, 348.93 and 372.95:
      2.40 mm to the LEFT of each column, on the post it shares with the column before it.
      There is no dot 21.6 mm to the right of the last column, which is what decides that
      they belong to the cage on their right rather than the one on their left.
      THE LAMP PAIR IS SPREAD WIDER THAN THE PORT PAIR, and that is measured rather than
      tidied. Within a bank the lamps sit 18.78 and 18.85 mm apart where the apertures sit
      17.51 apart, so each lamp is about half a millimetre outboard of its own port's centre -
      symmetric about the assembly, consistently on both banks, read at 15 px/mm. L61 says so
      sixty-four times and the baseline records it: the hardware is what it is, and moving the
      lamps onto the port centres would be drawing the rule rather than the panel.
      WHAT THE FOUR COLOURS MEAN IS THE PORT'S, NOT THE LAMP'S. The guide gives one legend
      for the port - "QSFP-DD800 LEDs: Yellow (800G), Blue (400G), White (200G), Green
      (100G)" - and there is exactly one window, so for once the colours and the windows
      agree: the lamp shows the port's negotiated rate. The four speed states are declared
      on the block's lamps and nothing is invented. This is the opposite of the AIS800-32D's
      case, where four windows shared one legend and the device had to waive L39 to say so.
  the-triangles-are-printed-and-the-sfp-pair-s-are-not:
    confidence: measured
    note: >-
      THE WALL'S ARROWS ARE SILKSCREEN. The sixty-four `(up)`/`(down)` glyphs beside the port
      numerals are solid white, the same white and the same crispness as the numerals they
      sit between, and every lamp on this face reads differently - a domed lens in a dark rim.
      This is the AIS800-32D's finding applied before the fact rather than after; see
      roc-ops/Portrayal#396, which is open on the EXP100 and EXP800 for the same marks.
      THE SFP28 PAIR'S TWO ARE LAMPS. The management cluster's SFP28 bezel carries a white
      band between its two cages with a `(up)` and a `(down)` moulded into it, and the guide's
      own callout 3 points at that band and names it: "SFP28 LEDs: Green (link/activity)".
      A glyph a vendor labels as a LED is a lamp, and common/led-arrow-sm@1 is the part.
      THE NUMERALS ARE 2.3 MM OF CAP HEIGHT, measured on the enlargement at 15 px/mm
      (rows 10.61-12.88), which is font-size 2.9 - not the 1.3 a first pass would guess.
  the-management-cluster:
    confidence: measured
    note: >-
      EVERY ITEM MEASURED ON THE ENLARGEMENT AT 15 px/mm, which is the best-resolved figure
      either AIS800 model has.
      TWO 25G SFP28 CAGES IN ONE BEZEL at x 398.45-413.20, apertures y 16.08-26.04 and
      31.38-41.34 - 14.75 x 9.96 against std/sfp@1's 14.5 x 10.0, on a 15.30 row pitch. The
      bezel's middle band carries the pair's two lamps.
      AN RJ-45 MANAGEMENT JACK at 416.46-432.27 - 15.81 wide against std/rj45@2's 15.8, which
      is as close as a drawing gets - with its own pair of lamps at the top corners, which is
      what common/rj45-eth@1 draws.
      A USB 3.0 TYPE-A BENEATH IT, opening 418.09-430.58 by 35.08-39.56: 12.49 x 4.48 against
      std/usb-a@1's 12.0 x 4.5. THE TONGUE IS BLUE in both the enlargement and the datasheet
      photograph, so the `default` skin is right and `usb2` would be a false claim. The
      documents call it "USB3.0 storage port" and draw a Type-A; the AIS800-32D's is a
      Type-C. Two models of one series, two different connectors, both read off their own
      drawings.
      A CONSOLE AND A ToD JACK STACKED at 416.25-432.53, the pair spanning y 54.14-79.41,
      which is two std/rj45@2 at 13.2 with nothing to spare.
      TWO SMA TIMING JACKS at 406.78-413.30, y 54.34-59.76 and 62.90-68.18 - 6.5 across
      against std/sma@1's 6.35 - legended 1PPS above and 10MHz below.
      SIX SYSTEM LAMPS AND A RESET BUTTON. The lamps are rounded rectangles about 1.3 x 1.0
      in a recessed strip, each directly below its legend, on a 6.1 mm pitch from 400.3 to
      430.8; the guide names every one. common/led-rect-sm@1 at 2.8 x 1.6 and
      common/reset-button@1 at 4.0 are both larger than the drawing, and are seated at the
      measured CENTRES rather than the measured sizes, as the AIS800-32D's are and for the
      same reason: the indicator vocabulary is what a reader compares across devices.
  the-rows-of-marks-above-each-cage-are-gasket-tabs-and-not-lamps:
    confidence: measured
    note: >-
      FIVE EVENLY SPACED MARKS ALONG THE TOP EDGE OF EVERY CAGE ASSEMBLY, AND THE SAME ALONG
      THE BOTTOM, and they were asked about in review because at a glance they read as a row
      of small lamps.
      THEY ARE NOT LAMPS, ON FOUR COUNTS. The guide's System LEDs/Buttons page names every
      lamp on this face and there are exactly four kinds - "QSFP-DD800 LEDs", "RJ-45 MGMT
      LEDs", "SFP28 LEDs" and the six "System LEDs" - and the datasheet's own summary agrees
      ("Port LEDs: Link Status, Activity, Rate"). Five marks above and five below every port
      would be ten more per port and 640 on the face, legended nowhere. They appear on BOTH
      edges of each assembly, which no indicator does. They are grey metal with a chevron
      moulded into each, where every lamp on this face is a domed lens in a dark rim. And the
      enlargement resolves them at 15 px/mm as tabs standing on the cage's own flange, on a
      3.66 mm pitch across the 18.28 mm cage.
      THEY ARE THE CAGE'S EMI GASKET FINGERS - the sprung tabs that ground a transceiver's
      shell to the cage as it slides in - which is why they ring the opening rather than sit
      beside it. BOTH ROWS ARE DRAWN, one at each end of every assembly, as a slot field on
      the cage shell. The first model drew only the top row, because the registry aperture
      hung from the drawn aperture's top edge left no room under the lower opening and L44
      correctly called a bottom band buried; centring the aperture (above) gives both ends
      the same 0.8 mm and the rows come out symmetric.
      THE PORT LAMP IS THE SINGLE ROUND ONE ON THE POST, one per port, and it is a different
      thing in a different place. See the-port-lamps-are-one-round-window-each.
  the-ac-inlet-is-named-c20-and-the-photograph-agrees:
    confidence: datasheet
    note: >-
      THE DOCUMENTS NAME IT THREE TIMES: the datasheet's power section reads "AC PSU Inlet:
      IEC 60320 C20", its ordering table ships an "IEC 60320 C19-C20 power cord" with the -UN
      builds, and the guide's package contents list "AC Power cord, type IEC C19". That is as
      explicit as this vendor gets, and it is why std/c20-inlet@1 is the part.
      THE PHOTOGRAPH'S PIN GEOMETRY AGREES. Measured on the datasheet's rear photograph at
      8.99 px/mm, the three blades sit at (74.08, 15.52), (65.68, 22.03) and (73.64, 28.98):
      a pair 13.46 mm apart with the third blade 8.4 mm off their line, which is the C19/C20
      triangle, and each blade is about 1 x 3 mm, which is a C19/C20 blade. The part is turned
      so that pair stands vertical at the right and the odd blade sits at the left, which is
      `rotate: 270` and is what the render draws.
      THE BLADES AGREE TOO. On the photograph each blade is narrow and TALL - its long axis
      parallel to the line joining the pair - and std/c20-inlet@1 has drawn them that way
      since 1.3.1, which lays all three blades along the long side of the coupler as IEC 60320
      C19/C20 has them (the SCHURTER C20 front view it cites draws the same). Turned 270, they
      stand tall. Until 1.3.1 the part drew them across that line; see roc-ops/Portrayal#398.
  the-rj45s-are-not-all-the-same-way-up:
    confidence: measured
    note: >-
      AND THE FIRST MODEL OF THIS DEVICE HAD ALL THREE THE SAME WAY UP. The guide's LED
      enlargement resolves each jack's keyway at 15 px/mm: MGMT has its latch slot at the TOP,
      CONSOLE has its latch slot at the TOP, and ToD - directly below CONSOLE in the same
      bezel - has it at the BOTTOM. The stacked pair is a mirrored module, which is the
      ordinary way a two-high RJ-45 assembly is built, and MGMT matches the upper of the two.
      std/rj45@2 draws tab-down, so MGMT and CONSOLE are placed `rotate: 180` and ToD is
      placed as drawn.
  the-panel-is-honeycombed-and-that-is-a-change-from-the-32-port-shell:
    confidence: measured
    note: >-
      THE PERFORATION IS HEXAGONAL, not the slot field the AIS800-32D carries. Autocorrelation
      of the dark mask across the top margin gives an x period of 3.59 mm and down the bottom
      margin a row period of 3.07, which is a regular honeycomb of 3.59 mm pitch. The
      library's `vent` motif is a hex field on an 8.86 x 5.11 tile, scaled here by
      pattern-pitch to put its hexes on the measured 3.59; the motif's own row spacing is
      denser than the hardware's and that is the motif's, not a reading.
      THE FIELDS: a top band y 0.60-8.60 and a bottom band 78.50-86.50 across the port wall,
      a left column x 0.60-5.60 between them, a right column x 433.60-439.50 outside the
      cluster, and two fields inside the cluster itself - above the SFP28 bezel and below the
      reset button - which the enlargement resolves hexagon by hexagon.
      THE COLOUR IS SAMPLED FROM BOTH SOURCES AND THEY DISAGREE BY THEIR LIGHTING. Panel
      medians between features read #5d5e62, #545559 and #616266 on the drawing and #4e4e4e,
      #464545 and #454546 on the datasheet's photograph. The drawing's reading is used
      because the drawing is the calibrated instrument for every other number on this face;
      the photograph is a lit product shot and reads about 15 counts darker throughout. It is
      darker than the AIS800-32D's measured #6a6b6e either way.
  the-rear-closes-arithmetically:
    confidence: measured
    note: >-
      AND IT WAS MEASURED TWICE, on the drawing at 5.06 px/mm and on the datasheet's rear
      photograph at 8.99, which is the check the 32-port models could not run.
      THE SUPPLIES ARE 73.5 x 40 AND THEY STACK. Vertical-edge scans put the housing's left
      edge at 15.0-15.3 on both sources and its right at 88.1-88.5; horizontal seams bound
      PSU1 at 4.54/43.84 on the drawing and 4.13/43.40 on the photograph, and PSU2 at
      46.01/84.52 and 46.60/85.90. That is the CRPS 73.5 x 40 footprint, and the reads land
      on it within the drawing's half-pixel.
      THE TRAY PITCH IS 85.71 FROM THREE RAILS. The rails between trays read 176.16/180.50,
      262.06/266.01 and 347.58/351.92 on the drawing and 176.0/180.24 and 261.43/265.67 on
      the photograph - a 4.2 mm rail on an 85.71 pitch (85.43 by the photograph), leaving
      81.6 for the tray face. The block runs from 94.50 to 433.23 and the chassis frame
      picks up at 433.09.
      THE TRAYS ARE 81.2 TALL, from seams at 4.94 and 86.10 on the drawing and 4.13 and 85.88
      on the photograph.
      THE BAYS ARE NUMBERED AND THIS TIME THE NUMERALS ARE LEGIBLE, which is what the
      AIS800-32D's fan-bay-numerals gap asked for and could not have. The photograph resolves
      a snowflake, a numeral and a right-pointing triangle silkscreened on each rail: 1, 2, 3
      and 4 from LEFT to right, the opposite of edgecore/exp100-32x and edgecore/dcs240,
      which both number right to left. They are drawn.
  the-grounding-point:
    confidence: measured
    note: >-
      A BRIGHT PLATE WITH TWO HOLES at the far left of the rear, x 1.34-14.47 by y 30.27-66.21
      on the photograph, the holes at (7.2, 39.8) and (7.4, 56.0) about 4.2 across. The guide
      says what they are: the rear-panel grounding point, where a grounding wire is fixed with
      two M6 screws and washers through a grounding lug (Panduit LCDXN2-14AF-E or an
      equivalent), and the QSG's Overview callout 5 reads "2 x grounding screws". An earth
      symbol is silkscreened above the plate at (7.4, 26.1) and the supply legend
      "(up) PSU1 / (down) PSU2" above that.
  power:
    confidence: datasheet
    note: >-
      3000 W PER SUPPLY, stated three times: the datasheet's feature list ("Hot-swappable,
      load-sharing, redundant 3000 W AC/DC PSUs"), its power section ("PSUs: 2 redundant,
      load-sharing, hot-swappable 3000 W AC/DC") and the housing's own "3000W" label in the
      rear photograph.
      INPUT. AC: "200-240 VAC at 50-60Hz (16 A/3000 W max.)" with the inlet named outright -
      "AC PSU Inlet: IEC 60320 C20" - and a C19-C20 cord in the -UN builds. DC: "-48 V ~
      -60 V (80 A/3000 W max.)". There is no low-line AC rating anywhere, and the guide adds
      that a single supply powering a fully loaded system must be on 200-240 VAC.
      DRAW IS STATED ONCE AND IT IS A CEILING, NOT A TYPICAL: "Less than 2775 W (100% traffic
      at 40 C ambient temperature with 100% fan speed and 64 x 18 W optics)". No typical
      figure is published, so none is recorded - unlike the AIS800-32D, which publishes both.
      THE PER-PORT BUDGET IS 30 W, qualified by the datasheet itself: every one of the 64
      ports, on both the OSFP and the QSFP-DD800 version, can take up to 30 W, but how many
      are actually populated at that figure is bounded by the total power distribution and
      by thermal limits.
  airflow:
    confidence: datasheet
    note: >-
      BOTH DIRECTIONS, AS SEPARATE SKUs, AND THIS TIME THE COLOUR RULE IS PHOTOGRAPHED RATHER
      THAN DRAWN. The datasheet's page 2 carries a rear photograph of each build side by side
      under the headings "Airflow: Front-to-back" and "Airflow: Back-to-front": red tray bars
      and red PSU latches on the first, blue on the second. The ordering table pairs
      PSU-AC-3000W-F and FAN-2U-1x1SN-F with front-to-back and the -B parts with back-to-front
      and names no colour. See roc-ops/Portrayal#277.
      THE RULE COVERS THE AC LATCH AND THE TRAY BARS AND NOTHING ELSE. Sampled on those two
      photographs the AC latch reads #dd3d12 front-to-back and #6186db back-to-front, and the
      tray bars #fe3c42 and #469dfb. THE DC SUPPLY'S LATCH IS GREEN AND STAYS GREEN: the only
      images of that face are the guide's Connect Power figure and its Chinese copy, both of
      which draw it #9cdb7d on a page with no red pixel on it, and no photograph of a DC build
      exists in the staged corpus. The dc-b2f configuration therefore recolours the tray bars
      and leaves the supply alone. An earlier model painted that latch red and blue by
      analogy with the AC unit, which was the airflow rule reaching one part further than its
      evidence.
      THE TWO BUILDS ARE DERATED DIFFERENTLY: front-to-back 0-40 C and back-to-front 0-35 C,
      "subject to used optics", both at 1800 m.
  ground-pair:
    confidence: estimated
    note: >-
      ONE TWO-HOLE LANDING, NOT TWO SCREWS (#828, #830). The quick start guide fixes one grounding
      lug with two M6 screws, so the point is common/ground-stud-pair-5-8-m6@1, two M6 pan heads,
      placed at rotate 90 (one above the other, as the photograph's two holes are) and centred on
      the holes' midpoint, (7.3, 47.9). THE 5/8 IN. PITCH IS INFERRED, NOT STATED: no document held
      dimensions the holes, and the photograph's 16.2 is a reading off a product shot. The lug the
      guide names, Panduit LCDXN2-14AF-E, carries Panduit's 'A' hole-spacing code, 5/8 in., so the
      screws are drawn at that lug's 15.875, the pitch of the stud-pair-5-8 interface. Formerly two
      common/ground-lug@1 placements, ground-screw-1 and ground-screw-2, 16.2 apart and drawn 2.8
      below the photographed holes, each with an earth mark of its own. The one earth symbol the
      photograph shows, silkscreened above the plate at (7.4, 26.1), is common/ground-symbol@1 there,
      centred over the pair.
  ground-stud-size:
    confidence: datasheet
    note: >-
      the quick start guide fixes the grounding wire to the grounding point on the rear panel with two
      M6 screws and washers through one grounding lug (Panduit LCDXN2-14AF-E or an equivalent): the
      `stud-size` of ground-screws, the pair.
