format: 1
kind: device
name: csr310
version: 1.0.0
maturity: modelled
manufacturer: Edgecore
model: AS7315-27X
portfolio: {line: Service Provider, family: Cell Site Router, series: CSR310}
description: >-
  20x 10G SFP+, 4x 25G SFP28 and 3x 100G QSFP28 cell site router, sold as the CSR310, Broadcom BCM88470
  Qumran-AX with an Intel Atom C3508 and a Stratum 3E OCXO. An integrated GNSS receiver behind an SMA
  antenna input, six RJ-45s carrying stacking, timing and management, and two of the QSFP28s usable for
  stacking a second unit. Everything is on the front, including both hot-swappable supplies and the fan
  tray; side-to-side airflow.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      Two documents, both staged and both docling-converted, MEASURED OFF THE PDF PAGES RATHER THAN THE
      CONVERTED FIGURES, and USED FOR DIFFERENT THINGS. csr310-datasheet carries the specification list,
      the ordering matrix, the field-replacement part numbers and the fourteen-callout front elevation
      on page 2 that every coordinate here is read from. csr310-qsg carries no figure worth measuring
      and is the source of nearly every NAME: its step 5, 6 and 7 illustrations are large, flat and legible
      where the elevation is 8.15 px/mm and is not.
  figure-choice:
    confidence: measured
    note: >-
      Gate 1, and this is the best figure in the Edgecore corpus so far. Page 2 rendered at 600 dpi; panel
      found by row/column darkness at (615,2136)-(4199,2494), 3585 x 359 px, aspect 9.9861 against 10.0
      for 440/44 - 0.14 PERCENT OUT. The CSR200's was 1.86 and the CSR180's 1.47. At that agreement the
      art is an orthographic elevation rather than a camera render, and x carries geometry directly at
      8.1477 px/mm. IT IS ALSO THE LOWEST RESOLUTION: 8.15 px/mm against the CSR200's 9.63, because it
      is drawn smaller on the page. Truer and coarser at once, which is why the division of labour below
      exists - the datasheet says WHERE and the quick start says WHAT. The quick start's own elevations
      were rejected: page 3, 6 and 9 carry the same drawing at 5.05 px/mm and 6 to 9 percent of aspect
      error.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - "Dimensions (WxDxH): 440 x 300 x 44 mm (17.32 x 11.81 x 1.73 in)" and "Weight 5.35 kg
      (11.79 lb), with two installed PSUs". The quick start's hardware specification restates both to
      the digit, so the two agree and there is nothing to record as a disagreement. 440 is the body width:
      the datasheet's own "Can be mounted in standard 19', 21', 23', and ETSI 600 mm racks" makes the
      brackets an accessory outside it, and the quick start ships them as "Rack Mounting Kit - 2 brackets
      and 8 screws" with two hole patterns, for 300 mm and 280 mm deep racks.
  port-numbering:
    confidence: photo-measured
    note: >-
      THREE INDEPENDENT NUMBER SPACES, WHICH IS WHY THE IDS ARE NOT `port-N` THROUGHOUT. The quick start's
      step 5 figure is flat, large and unambiguous: the single 100G cage is labelled `M0 100GBASE-R` and
      its port is numbered `0`; the four-port SFP28 group is bracketed `M1 1/10/25GBASE-R` and numbered
      `0 1 2 3`; and the twenty-port SFP+ group RESTARTS AT 0, running `0 1` through `18 19`. All three
      were read again off the datasheet elevation's own numerals and agree. So `m0-0`, `m1-0..m1-3` and
      `port-0..port-19` are three ranges that would collide if they shared a prefix, and the block `id-format`
      is what keeps them apart.
  optical-blocks:
    confidence: measured
    note: >-
      Every optical block is anchored on a MEASURED CENTRE and sized from the registry, and here the two
      agree far better than on the CSR180. The SFP+ group's outer edges read 179.03 and 321.17 - 142.14
      across ten columns, or 14.214 each, against the registry's 14.25, a fifth of a percent. The SFP28
      group reads 147.79 to 176.87, 14.54 a column over two columns. The RJ-45 block's internal walls
      read 347.0, 360.99 and 375.22, a 14.11 pitch against a registry 13.97. Origins are the block centres:
      178.85, 148.08 and 347.00. Rows: the bezel between the two cage rows centres on 18.14 down a column,
      so the pair is placed to straddle it at the registry's 15.0 row pitch, putting the top row at 5.44.
  the-rj45-six:
    confidence: datasheet
    note: >-
      SIX RJ-45s IN ONE 2x3 BLOCK, AND THE QUICK START NAMES EVERY ONE. Its step 7 figure reads, top row
      left to right, STACK-SYNC / BITS / Console, and bottom row STACK-CTRL / PPS-ToD / Mgmt. Below them
      sit six lamps in three groups: a bracketed LINK and ACT under STACK-CTRL, an up-arrow BITS and a
      down-arrow PPS under the middle column, and a bracketed LINK and ACT under Mgmt. THE ARROWS ARE
      THE POINT. The middle column's two lamps serve BOTH of its jacks - the up-arrow one reports the
      BITS port above, the down-arrow one the PPS/ToD port below - which is the same convention the AGR110
      uses on its uplinks and the thing that had to be left as a gap on the CSR180 because its art would
      not resolve it.
  gnss:
    confidence: measured
    note: >-
      AN SMA, MEASURED RATHER THAN ASSUMED, which the issue asked for explicitly. The connector reads
      10.0 mm across on the elevation - common/sma-jack@1 is 9.5 across flats and common/smb-jack@1 is
      7.0 - and the quick start's step 4a and step 7 figures both show a gold hex-nut bulkhead, which
      is an SMA and is not an SMB. Centred on 135.90, directly above the M0 cage on the same centreline.
  psus-and-fans:
    confidence: datasheet
    note: >-
      REAL FIELD-REPLACEABLE UNITS WITH PART NUMBERS, unlike every other CSR in this library. The datasheet's
      own FRU table names CRXT-T0T12BS (DC PSU), SPAACTN-03BG (AC PSU) and FAN-1U-1x1J-S (fan tray), and
      the quick start adds that only CRXT-T0T12B will fit the DC bay. Two supply bays at 4.54 and 67.06
      - a 62.52 pitch confirmed by the warning triangles printed on the modules, 62.6 apart - each 54.08
      wide, with 8.4 mm of chassis between them. The fan tray runs 394.3 to the panel edge. THE ELEVATION
      SHOWS THE DC VARIANT. The AC module's face comes from the quick start's step 4a, which is legible
      for what is on it - a C14 inlet marked N, earth and L, the same handle and the same latch - and
      useless for where, so edgecore/csr310-psu-ac@1 borrows its envelope from the DC unit and says so.
  airflow:
    confidence: datasheet
    note: >-
      datasheet - EVERY published ordering code is side-to-side: four AC SKUs and one DC SKU, all ending
      -S, and "Supports side-to-side airflow SKU" in the key features. The fan tray's own face carries
      an AIRFLOW arrow pointing right, which is where the hardware says it. No front-to-back part number
      is listed and none is assumed.
attrs:
  performance: {switching-capacity: 300 Gbps, processing-rate: 300 Mpps}
  power: {power-max-w: 193, power-envelope: as-tested, power-input-ac: '100V-240V, 5 A', power-input-dc: '36V-72V,
      10 A'}
  thermal:
    airflow: side-to-side (every published ordering code)
    cooling: hot-swappable redundant fan modules in one field-replaceable tray
  environmental: {temperature-operating: -40 C to 65 C (-40 F to 149 F), temperature-storage: -40 C to
      70 C (-40 F to 158 F), humidity-operating: 5% to 95%, altitude: -60 m to 3000 m}
  platform:
    asic: Broadcom BCM88470 Qumran-AX
    cpu: Intel Atom C3508, 4-core
    memory: 16 GB DDR4-2400
    storage: 32 GB M.2 SSD
    oscillator: Stratum 3E compliant OCXO
    software: ONIE installer pre-loaded; Open Network Linux (ONL) compatible
  features:
    marketing-name: CSR310
    standards: OCP Accepted; TIP DCSG compliant
    timing: IEEE1588v2 and SyncE in hardware; PRTC ITU-T G.8272; integrated GNSS receiver
    timing-ports: BITS (RJ-45), PPS/ToD (RJ-45), GNSS antenna (SMA)
    stacking: two units; 2 of 3 QSFP28 for data, 1 RJ-45 for sync, 1 RJ-45 for control
    optics-qsfp28: >-
      1x 40/100 GbE, 4x 10/25 GbE or 2x 50 GbE per port; DAC to 2 m and AOC to 30 m when stacking
    optics-sfp-plus: 10 GbE or 1 GbE per port
    optics-sfp28: 25 GbE, 10 GbE or 1 GbE per port
  management:
    mgmt-ports: 1x RJ-45 1000BASE-T management, 1x RJ-45 serial console, 1x USB storage
  compliance:
    emissions: >-
      EN 300 386 V1.6.1, FCC 47 CFR Part 15 Subpart B Class A, EN 301 489-1 V2.1.1, EN 301 489-19 V2.1.0,
      EN 303 413 V1.1.1, ITU-T K.80
    safety: EN/IEC 62368-1
    radio: Radio Equipment Directive 2014/53/EU
    rohs: RoHS, WEEE, REACH
  lifecycle: {eol: none-announced}
chassis: {width: 440.0, height: 44.0, depth: 300.0, ru: 1, weight-kg: 5.35, color: '#2b2f33', airflow: side}
gaps:
- what: rear-elevation
  scope:
  - rear
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A figure of any face but the front. Neither document draws one, and on THIS device that is a smaller
    hole than usual: the datasheet's own "All ports and PSUs are accessible at the front" means the rear
    carries no user-facing hardware but the grounding point. The quick start's step 3 pictures that point
    twice, once on the rear panel and once on the side, as a two-hole lug with the earth symbol beside
    it - enough to know it exists on both, not enough to place either, so neither is placed. The SIDE
    panels carry the intake and exhaust on a side-to-side box and are drawn nowhere.
- what: stack-id-indicator
  scope:
  - front
  reason: needs-photo
  wanted: >-
    What the component at 239.8-260.8 is. It is 21.0 x 3.8 in the silkscreen band between the SFP+ numerals
    and the AS7315-27X model text, and it reads as eight cells with the outer two red and the inner six
    pale. Neither document mentions it: the fourteen callouts do not point at it, the specification lists
    no display and no switches, and the quick start's step 5 figure - which is otherwise the most legible
    thing in the corpus - is cropped just short of it. A stack-identity display would fit the device,
    which stacks two units and has a STACK-SYNC and a STACK-CTRL port; so would a DIP bank. It is drawn
    as a plain bezel with no claim about which, and `common/seven-segment-dual@1` was NOT used, because
    reaching for a part whose name asserts what the thing is would be the guess this gap exists to avoid.
- what: stacking-qsfp-labels
  scope:
  - front
  reason: needs-photo
  wanted: >-
    The module letters on the two-high QSFP28 block at 322.5-342.5. The quick start names M0 (the single
    100G cage) and M1 (the SFP28 group) outright, and the datasheet elevation carries a `M? 100GBASE-R`
    label over this block that does not resolve at 8.15 px/mm - it could be M2 or M3, and the block holds
    two ports whose own numbering is unread. They are modelled as `stack-0` and `stack-1` from the datasheet's
    callout 11, "2 x 100G QSFP28 stacking ports", which is a function rather than a name.
- what: stacking-block-lamps
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    What the six lamps in the stacking block's bezel do. Their positions are measured - 325.1, 327.5,
    330.4, 334.3, 337.5, 339.7 - and two of the six are visibly larger than the other four, which usually
    means a port lamp beside a set of lane lamps. Nothing in either document says. Four lane lamps and
    two port lamps is the shape the AGR110 uses, but that is a pattern, not a reading, so the six are
    placed and left unassigned.
- what: fan-count
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    How many fans are in the tray. The datasheet says "Hot swappable redundant fan modules" - plural,
    inside one tray - and the FRU table sells exactly one "Fan Tray Spare Part", FAN-1U-1x1J-S. The elevation
    shows a closed tray with no grille and no seams. So the tray is one module with no nested bays and
    the redundancy is stated in attrs without a count, rather than a number being invented to fill the
    field.
- what: psu-output-rating
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    A wattage for either supply. The datasheet's "Power Capacity: 300 W (maximum)" and the quick start's
    "193 Watts maximum" are both the CHASSIS's - one a capacity, one a consumption - and neither is an
    output rating for a module. Input ranges are published for both variants and are carried on the parts;
    the output is not, so L27 stands on both and the hole stays visible.
- what: led-vocabularies
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    An LED table. Neither document has one. Six system lamps are named on the faceplate - LOC, DIAG, PSU1,
    PSU2, FAN, ALRM - and the quick start states one colour for four of them: "After power on, the PSU1/PSU2,
    DIAG, ALRM, and FAN LEDs should all be on green." That is more than the CSR200 gives and still not
    a vocabulary, so every lamp carries `off` and one green `on`.
groups:
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
  stacking:
    term: Port
    role: traffic
    index-origin: 0
    mixed: >-
      the stacking cluster - two of the three 100G QSFP28 cages carry the data path between a pair of
      CSR310s, and the STACK-CTRL RJ-45 carries the "1 x 1 GbE from CPU (control signal)" the datasheet
      lists beside them. Two media, one job. The datasheet counts the QSFP28s in its port total and names
      them separately in callout 11; both are true, and this group is how a consumer finds the ones that
      are spoken for. STACK-SYNC IS NOT IN HERE. The datasheet lists it separately as "1 x RJ-45 for sync
      signals", and a sync signal is not Ethernet: leaving it in a `traffic` group typed it as a gigabit
      interface AND as a timing port, and it was exported twice under one name. It sits in `timing` with
      the BITS and PPS/ToD jacks, which is what it carries.
  port-leds: {term: LED, role: indicator, index-origin: 0}
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the synchronisation cluster - a BITS RJ-45, a PPS/ToD RJ-45, the STACK-SYNC RJ-45 and the SMA antenna
      input of the integrated GNSS receiver. Two media, one job: disciplining this box's clock from the
      network, from a stacked peer, or from the sky.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster - the 1000BASE-T RJ-45, the RS-232 console, the USB-A storage port and the
      Reset button.
  leds: {term: LED, role: indicator, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs: {redundancy: 1+1, redundancy-note: 'two load-sharing hot-swappable supplies, AC or -48 VDC'}
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy-note: >-
        hot-swappable redundant fan modules in one field-replaceable tray. NO `redundancy` FORM IS STATED
        because the vendor states none - "Hot swappable redundant fan modules" is the whole sentence,
        and n+1 or n+n would be a count this library would then carry as if it had been read. See the
        `fan-count` gap.
  furniture: {term: Item, role: furniture, index-origin: 1}
