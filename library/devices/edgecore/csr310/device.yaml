      Not drawn by any staged source. The datasheet's own "All ports and PSUs are accessible at the front"
      says this face carries no user hardware but the grounding point, which the quick start's step 3
      pictures without placing.
  top:
    size: {w: 440.0, h: 300.0}
    empty: >-
      Not drawn by any staged source, so nothing on the lid is claimed - not a vent field, not a label,
      not a screw pattern.
  bottom:
    size: {w: 440.0, h: 300.0}
    empty: >-
      Not drawn by any staged source. The quick start fits brackets at two depths, 300 mm and 280 mm,
      so there are two sets of side holes; the underside is not pictured.
  left:
    size: {w: 300.0, h: 44.0}
    empty: >-
      Not drawn by any staged source, and this is an airflow face on a side-to-side box. The quick start's
      step 3 puts a grounding lug on "the device's rear panel or side panel" and pictures a side one,
      without saying which side or where.
  right:
    size: {w: 300.0, h: 44.0}
    empty: >-
      Not drawn by any staged source. The other airflow face - the fan tray is at this end of the front
      panel and its arrow points this way.
configurations:
  ac:
    kind: base
    default: true
    description: >-
      Two hot-swappable AC supplies and the fan tray, side-to-side. Four of the five published ordering
      codes are this configuration, differing only in the power cord.
    part-numbers:
      7315-27X-O-AC-S-US: {part: F0PZZ5627400A, power-cord: US}
      7315-27X-O-AC-S-UK: {part: F0PZZ5627300A, power-cord: UK}
      7315-27X-O-AC-S-EU: {part: F0PZZ5627200A, power-cord: EU}
      7315-27X-O-AC-S-JP: {part: F0PZZ5627500A, power-cord: JP}
    bays: {psu-1: edgecore/csr310-psu-ac@1, psu-2: edgecore/csr310-psu-ac@1, fan-tray: edgecore/csr310-fan-tray@1}
  dc:
    kind: orderable
    description: >-
      Two hot-swappable -48 VDC supplies, otherwise the base box. This is the variant the datasheet's
      front elevation draws, and the quick start ships four ring lugs with it.
    part-numbers:
      7315-27X-O-48X-S: {part: F0PZZ5627004A}
    bays: {psu-1: edgecore/csr310-psu-dc@1, psu-2: edgecore/csr310-psu-dc@1, fan-tray: edgecore/csr310-fan-tray@1}
