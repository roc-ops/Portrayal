format: 1
kind: device
name: ecs4530-54csfp-i
version: 3.0.3
maturity: modelled
manufacturer: Edgecore
model: ECS4530-54CSFP-DC-I
portfolio: {line: Campus, family: Aggregation Switch, series: ECS4530}
description: >-
  1RU half-depth L2+/L3-lite Gigabit fibre access switch, the DC and industrial-temperature
  member of the ECS4530 pair: the same 24 CSFP cages in 12 two-high stacks (48 BiDi fibre
  ports), four RJ-45 combo ports, 4 x 10G SFP+ and 2 x 20G QSFP+ uplinks, console and
  out-of-band RJ-45 as the ECS4530-54CSFP - fed instead from a -48 to -60 V pluggable
  terminal block on the front, rated 0-60 C, with its three fixed rear fans in different
  places.
profile: networking
provenance:
  stack-orientation:
    confidence: drawing
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the port lamps, which point up
      over down: the 14 SFP pairs (csfp-2-4/csfp-1-3 to port-52/port-51), the 1 QSFP pair
      (port-54/port-53). 15 of these were drawn with the upper cage turned before the std cage art
      moved its lip to the bottom of the opening; turning them keeps the lips in the middle band
      where they were drawn and seats every optic bail-outward.
  sources:
    confidence: datasheet
    note: >-
      ONE DOCUMENT FOR TWO MACHINES. The ECS4530 Series data sheet is a two-column
      comparison of the ECS4530-54CSFP and this ECS4530-54CSFP-DC-I - the staged
      ecs4530-54csfp-i-datasheet is byte-identical - so every attr here is read from the
      DC-I column, not the row. There is no quick start guide. Page 3 carries both variants'
      fronts and both rears at 1000 px; four product photographs of this variant are staged
      at 489 px (1.1 px/mm), used only to say which rear is whose: its rear photograph puts
      the third fan at about 74% of the width, which is the rear whose guards sit at 119.7,
      235.6 and 324.5 mm and not the base's (351.1).
      The front's name bar reads ECS4530-54CSFP-DC-I; this library names the device for the
      issue's ecs4530-54csfp-i.
  figure-choice:
    confidence: measured
    note: >-
      Gate 1. This variant's own front elevation (page 3, 1000 x 102) is cropped flush and
      -1.96% on aspect, the same as the base's; its rear (1000 x 101) is -0.99%, the better of
      the two rears. The scale is the base's, 2.273 px/mm across a 440 mm face, which three
      standard features confirmed there - the QSFP+ opening at 18.48 against 18.50, the RJ-45
      cavity at 12.3 against 11.91 and the SFP stacks' 14.96 row pitch against the registry's
      15.0 - and which this figure's own port columns agree with (see shared-shell).
  shared-shell:
    confidence: measured
    note: >-
      THE PORT FIELD IS CARRIED FROM THE ECS4530-54CSFP AND CHECKED, NOT ASSUMED. The two
      fronts are different artwork - registered at their best shift they still differ by 35
      grey levels on average - so this is not a copy of one drawing. But the DC-I front's own
      openings land on the base's lattice: first CSFP column 106.7 against 105.8, last 295.9
      against 295.6, the same 17.2 mm pitch, the SFP+ at 369.8 against 369.6 and the QSFP+ at
      390.2 against 389.6 - within a pixel and a half everywhere. The datasheet gives both one
      dimension column. So the port field, lamps and legends are the base's measured ones,
      which were read off the better of the two front elevations; everything this note does
      not name was measured on this variant's own figure.
      ITS VERTICAL IS NOT RE-MEASURED HERE. The DC-I front's cages read lighter than the base's
      and the threshold catches only their interiors, so its row positions are not an
      independent reading; the base's are carried.
  chassis:
    confidence: datasheet
    note: >-
      DATASHEET, 'Dimension (W x D x H) cm 44 x 22 x 4.4' in both columns, 'Rack Space 19"' and
      'Weight 3 kg'. The only size source, stated once per variant and identical.
  numbering:
    confidence: photo-measured
    note: >-
      READ OFF THE ELEVATION, and each CSFP cage carries TWO numbers. Under the bottom cage of
      the first stack the legend reads '1' and '3'; above its top cage '2' and '4': a CSFP
      module presents two bidirectional fibre ports, so 24 cages give the datasheet's 48
      ports - the datasheet explains that a CSFP transceiver carries two BIDI fibre ports, so
      each cage reaches two CPE/IAD devices and the physical port total is 48. Stack k
      carries 4k+1 and 4k+3 in its bottom cage and 4k+2 and 4k+4 in its top.
      EACH CAGE DECLARES THE TWO INTERFACES IT PRESENTS - csfp-1-3 carries
      `interfaces: [port-1, port-3]` (roc-ops/Portrayal#443) - so the DCIM export lists
      port-1..port-48 and the cages themselves are not interfaces. The switch's silicon has
      both ports whether or not a module is seated, which is why they belong to the cage and
      not to the optic. With the SFP+ as port-49..52 and the QSFP+ as port-53/54, the export
      is port-1..port-54 - the 54 in the model number.
      THE COMBO JACKS ARE copper-45..copper-48. They were port-45..48 first, which is exactly
      the ids the twelfth stack's CSFP interfaces need; both connectors are real and a DCIM
      must cable each, so the copper jacks take their own names and each carries
      `combo-with` its fibre interface. L105 holds interface ids apart from placement ids.
      Ports 45-48 are COMBO: the twelfth stack's cages and the four RJ-45s beside it are
      bracketed together on the faceplate, and the datasheet lists '4 RJ-45/2 CSFP' combo
      ports, 'Either RJ-45 or CSFP port can be chosen at a time'.
  copper-speed-spelling:
    confidence: measured
    note: >-
      The copper ports say speed 1g, the library's spelling for a copper traffic port and the
      one the DCIM exporter types. The ECS4530-54CSFP first spelled them 1000base-t and lost
      all four combo jacks from its exports for it; this variant starts from the corrected
      spelling.
  cage-frames:
    confidence: photo-measured
    note: >-
      Every stack sits in a bright cage frame, measured at 4x on the first: x 98.4-113.3,
      y 10.6-36.5, 14.9 wide about the 14.25 openings; repeated on the stack lattice and drawn
      19.7 wide about the QSFP+ stack.
  csfp-is-an-sfp-cage:
    confidence: registry
    note: >-
      THE CAGES ARE SFP CAGES; CSFP IS WHAT GOES IN THEM. The Compact SFP is a module form
      that fits the standard SFP cage, which is the whole of its point - so the cages are
      std/sfp-ganged@1 (two-high stacks, the registry's 15.0 row pitch, measured here at 14.96)
      with media sfp and a csfp attr, the same decision the AMX3200 made for CFP2-DCO.
  port-lamps:
    confidence: photo-measured
    note: >-
      EACH STACK'S BELLY STRIP CARRIES FOUR TRIANGLE LAMPS, down-up-down-up, which is one per
      logical port and says whose it is: a down-arrow points at the bottom cage and an up-arrow
      at the top, and each sits on the same side as that port's printed number - 1 left and
      3 right below, 2 left and 4 right above. So the lamps are assigned, not guessed, by the
      two things the faceplate itself says about them. The SFP+ stacks carry one arrow per
      port the same way, and the QSFP+ stack a down-arrow, four small windows and an up-arrow;
      the four windows are drawn and not given to a port.
  rj45s:
    confidence: photo-measured
    note: >-
      THE TOP COMBO JACKS SHOW LIT LAMPS AND THE BOTTOM ONES SHOW NONE, on this variant's front
      as on the base's. The base's elevation draws two
      green windows in the upper corners of the jacks for 46 and 48, at 307.5, 318.5, 326.9
      and 338.3 mm, and nothing at all in the corners of 45, 47, the console or MGMT. The top
      jacks are the lamped part; the rest are drawn bare because that is what the metal shows,
      which leaves three Ethernet jacks on a bare part and L76 standing - see the gap.
  left-end:
    confidence: photo-measured
    note: >-
      THE DC INPUT IS ON THE FRONT, where the base has its C14: a green two-pole pluggable
      terminal block at x 5.7-37.8, y 12.3-29.9 - common/dc-terminal-plug-2@1, new with this
      device - with '-  -48V~-60V = 6A Max  +' printed under it, negative at the left. The
      ground stud beside it lands where the base's does, centre (48.6, 21.1) against
      (48.4, 20.7), and is drawn at the base's position. The wordmark, the name bar reading
      ECS4530-54CSFP-DC-I and the '(dot) SFP LED indicator' legend are as on the base.
  rear:
    confidence: photo-measured
    note: >-
      THREE FIXED FANS, BUT NOT WHERE THE BASE HAS THEM. This variant's rear elevation is the
      better-proportioned of the two (-0.99% on aspect against the base's +5.26%), and its
      three honeycomb guards centre at 119.7, 235.6 and 324.5 mm - the third 26.6 mm inboard
      of the base's - and run y 4.4-38.3, 40 mm wide. Different placement of the same fans
      on the same shell; each device carries its own.
attrs:
  performance:
    switching-capacity: 256 Gbps
    forwarding-rate: 190.48 Mpps
    mac-table: 16K
    jumbo-frames: 10 KB
    port-modes-qsfp: 20G uplink - the datasheet says '20G QSFP+ Uplink' and nothing about the optics or modes behind it
    port-modes-sfp-plus: 1G / 10G; 10GBASE-SR/LR/ZR/ER, 1000BASE-SX/LX/LHX/ZX, 10G DAC/AOC
  power:
    power-max-w: 75.4
    power-envelope: unstated
    input-dc: -48 to -60 VDC, 6 A max
  environmental:
    temperature-operating: 0 C to 60 C
    temperature-storage: -40 C to 70 C
    humidity-operating: 10% to 90% non-condensing
    humidity-storage: 10% to 90% non-condensing
  platform:
    flash: 2 GB
    dram: 2 GB
  features:
    optics-sfp: 1G CSFP (two bidirectional fibre ports per module); 1000BASE-SX/LX/LHX/ZX; DDM
    port-summary: 24 CSFP cages (48 x 1G BiDi fibre), 4 x RJ-45 combo, 4 x 10G SFP+, 2 x 20G QSFP+
  management:
    mgmt-ports: 1x RJ-45 console, 1x RJ-45 GE out-of-band management
  compliance:
    emc: FCC Class A, CE
    safety: CB, UL
    rohs: RoHS; WEEE
  lifecycle: {eol: none-announced}
chassis: {width: 440.0, height: 44.0, depth: 220.0, ru: 1, weight-kg: 3.0, color: '#26292c', power: dc}
gaps:
  - what: bottom-rj45-lamps
    scope: [front]
    reason: needs-photo
    wanted: >-
      WHETHER THE BOTTOM RJ-45s HAVE LAMPS. The combo jacks 45 and 47 and the MGMT jack are
      Ethernet, which this library draws lamped, but the elevation shows lit windows only on the
      top jacks and nothing in the corners of the bottom ones at 2.27 px/mm. They are drawn
      bare, as seen, and L76 stands. A close photograph of one stack settles it.
  - what: airflow-direction
    scope: [rear]
    reason: vendor-silent
    wanted: >-
      WHICH WAY THE FANS BLOW. The datasheet's Cooling line is empty for both variants and the
      rear shows fixed fans with no arrows. Unstated rather than guessed.
  - what: ordering-codes
    scope: [front]
    reason: vendor-silent
    wanted: >-
      THE DATASHEET CARRIES NO ORDERING TABLE, so there are no part numbers to attach to an
      orderable configuration; the device offers its base configuration only.
