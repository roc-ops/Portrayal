    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
  rj45-combo:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
  qsfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp, speed: 20g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the RS-232 console RJ-45 stacked over the GE out-of-band management RJ-45 at the right-hand end.
  leds: {term: LED, role: indicator, index-origin: 1}
  power: {term: Inlet, role: service, index-origin: 1}
  grounding: {term: Point, role: furniture, index-origin: 1}
  furniture:
    term: Item
    role: furniture
    index-origin: 1
    description: the rack ears.
