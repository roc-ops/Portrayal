    empty: >-
      Not drawn by any staged source. The quick start's mounting figures show the lid from
      above in three-quarter view and nothing is claimed on it - no vent field, no label, no
      screw pattern. docs/deliberately-empty-faces.md calls this the normal case for a lid.
  bottom:
    size: {w: 442.5, h: 473.3}
    empty: >-
      Not drawn by any staged source. A face that sits on rails, is never serviced and carries
      no connectors gets no figure. The mounting section pictures the underside only as far as
      the bracket screw holes, which belong to the brackets and not to this panel.
  left:
    size: {w: 473.3, h: 43.95}
    empty: >-
      Not drawn by any staged source, and on this chassis that is a statement rather than a
      shrug: the DCS201 breathes FRONT TO BACK, so the side walls carry no perforation to draw.
      The intake is the front face's own vent strips and the exhaust is the rear, which is why
      reversing the airflow here swaps handles and latches rather than panels.
  right:
    size: {w: 473.3, h: 43.95}
    empty: >-
      Not drawn by any staged source. The other side wall, solid for the same reason.
configurations:
  ac-f2b:
    kind: orderable
    power: ac
    description: 'Dual 400 W AC PSUs, front-to-back airflow - red handles and red release latches'
    default: true
  ac-b2f:
    kind: orderable
    power: ac
    description: >-
      Dual 400 W AC PSUs, back-to-front airflow. The quick start's Airflow Reversal section
      states the colour, and this configuration draws it: "Install back-to-front (B2F) airflow
      fan trays (blue handles) and PSUs (blue release latches)."
    airflow: back-to-front
    region-context: {exhaust: Intake}
