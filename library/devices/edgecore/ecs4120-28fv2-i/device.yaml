format: 1
kind: device
name: ecs4120-28fv2-i
version: 2.0.2
maturity: modelled
manufacturer: Edgecore
model: ECS4120-28Fv2-I
portfolio: {line: Campus, family: Access Switch, series: ECS4120}
description: >-
  1RU half-depth hardened L2 Gigabit fibre access switch, rated -10 to 65 C: 24 x 1G SFP in twelve two-high
  stacks, four RJ-45 combo ports sharing the last four, 4 x 10G SFP+, and an RS-232 console beside an
  out-of-band RJ-45. BOTH its power inputs are on the front - an IEC C14 inlet and a -48 to -60 V pluggable
  DC terminal - and the rear carries only two fixed fans.
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the upper cage
      upright (rotate 0) over the lower turned 180, so both cage lips face the band between the two cages
      and both bails face outward. Decided by the rule, not an observation, so a photograph of the stack
      overturns it: the 12 SFP pairs (port-1/port-2 to port-23/port-24). 12 of these were drawn with the
      upper cage turned before the std cage art moved its lip to the bottom of the opening; turning them
      keeps the lips in the middle band where they were drawn and seats every optic bail-outward.
  sources:
    confidence: datasheet
    note: >-
      ONE DOCUMENT, AND NO DATASHEET WAS EVER PUBLISHED - the product page carries the quick start guide,
      safety notes and firmware only. ecs4120-28fv2-i-qsg is the ECS4120 Series guide, nine pages, trilingual
      (English, simplified and traditional Chinese) and covering four models (28T, 52T, 28Fv2, 28Fv2-I).
      Its 72 embedded images reduce to 19 unique ones of useful size once the three languages' repeats
      are removed by content hash, so no figure is counted as more than one piece of evidence. Three 489
      px product photographs of this model are staged. ISSUE #343 SAID THE CHASSIS IS 'NOT STATED IN ANY
      STAGED DOCUMENT', AND IT IS STATED. The guide's Hardware Specifications table gives '28Fv2/28Fv2-I:
      44.0 x 22.0 x 4.4 cm (17.32 x 8.66 x 1.73 in)', '2.82 kg (6.22 lb)', the -I's own operating range,
      its AC and DC input ratings and its 60 W maximum - enough for the whole attrs block below.
  figure-choice:
    confidence: measured
    note: >-
      Gate 1. THE GUIDE DRAWS THIS VARIANT BY NAME: embedded image q-004, 1811 x 220, whose name bar reads
      ECS4120-28Fv2-I (its sibling q-002 reads ECS4120-28Fv2). The face is drawn front-on under a lid
      shown in perspective; it spans x 0-1806 and y 47-217 below the lid seam. 1807 px across 440 mm is
      4.107 px/mm. THE BOX IS NOT SQUARE, SO THE FEATURES DECIDE. 171 px of face height would be 41.6
      mm at that scale against the stated 44. Two standard features were read on both axes: the MGMT and
      Console bezels measure 15.83 mm across against the RJ-45 housing's 15.8, and the two ports of an
      SFP stack sit 64 px apart - 15.55 mm isotropically, 3.7% over the registry's 15.0 belly-to-belly
      pitch, where the box's own vertical scale would make it 16.5, 10% over. So the drawing is read isotropically
      at 4.107 px/mm and anchored on its bottom edge (y 217 = 44.0 mm); the top 2.7 mm under the lid seam
      is the chamfer the lid is drawn over. Vertical positions are the least certain numbers here, to
      about 1.5 mm. THE CAGES KEEP THE REGISTRY'S GEOMETRY and the lamps are placed to clear it. A two-high
      stack of std/sfp-ganged openings, 10.4 tall on the registry's 15.0 row pitch, spans 25.4 mm where
      the drawn frame spans 24.4 - the drawing is squashed vertically, as the box said. So the stacks
      run y 13.0-38.4 and the lamps sit 0.2 mm clear under them at 39.6, about 0.35 mm lower than drawn,
      rather than overlapping the cage they serve. ORTHOGRAPHIC: the twelve stacks' lamp pairs fit a straight
      line to 0.21 px on a 71.48 px (17.405 mm) pitch.
  chassis:
    confidence: datasheet
    note: >-
      The guide's Hardware Specifications, '28Fv2/28Fv2-I: 44.0 x 22.0 x 4.4 cm' and '2.82 kg (6.22 lb)'.
      One document, stated once, shared with the non-I 28Fv2.
  ports-and-numbering:
    confidence: photo-measured
    note: >-
      READ OFF THE FACEPLATE. Twelve two-high SFP stacks, each legended 'n (up) n+1 (down)' beneath its
      two lamps: the top cage is the odd port and the bottom the even, 1-24. Two two-high RJ-45 stacks
      legended 21/22 and 23/24, and four single SFP+ cages under a '10G' bracket legended 25-28. The guide's
      transceiver list is 1000BASE optics (ET4202-*) and 10GBASE optics (ET5402-*), which is the 1G/10G
      split. THE COMBO PAIRING IS THE FACEPLATE'S, NOT THE GUIDE'S. The same numbers 21-24 are printed
      under the eleventh and twelfth SFP stacks AND under the two RJ-45 stacks, which is how this vendor
      marks combo ports. Neither the converted text nor the PDF's own text layer contains 'combo', 'shared'
      or 'either' - two searches - so this rests on the legend alone and is recorded as such; the copper
      jacks are named copper-21..24 and their group says what they share.
  lamps:
    confidence: photo-measured
    note: >-
      One white oval lamp per port under every SFP and RJ-45 stack, a pair 5.97 mm apart, each over its
      own legend - so each is assigned to the port its legend names. The SFP+ ports' lamps are not under
      them: they sit in a 3 x 2 block to the left of MGMT with DIAG and PWR, legended '25 27 DIAG' above
      and '26 28 PWR' below. The guide's 'On/Blinking Green - Port has a valid link' is the only lamp
      semantics given, and its 'PWR and DIAG' are the -I's system lamps.
  left-end:
    confidence: photo-measured
    note: >-
      BOTH INPUTS ARE ON THE FRONT, as the drawing and all three photographs show, though the guide's
      generic text says 'the AC input socket on the back of the switch' - that sentence covers the 28T
      and 52T it shares the page with. An IEC C14 inlet in a recess at x 4.1-36.0; a ground stud with
      its symbol at x 47; and a green two-pole pluggable DC terminal at [64.8, 17.5], 32.6 x 18.0 - which
      is common/dc-terminal-plug-2@1 from the ECS4530-54CSFP-DC-I to within 0.5 mm (32.1 x 17.6), so the
      part is reused rather than drawn again. Its poles are printed '+' left and '-' right with '(DC)-48~-60V;3.0A'
      between - the opposite order to the ECS4530-DC-I's, which is a faceplate fact and not the part's.
  vents:
    confidence: photo-measured
    note: >-
      A row of 54 vertical slots across the top of the port field, x 103.7-370.6, 2.43 mm wide on a 4.99
      mm pitch, running from the lid seam down to about 8.8 mm.
  rear:
    confidence: photo-measured
    note: >-
      THE WEAKEST NUMBERS HERE. No figure draws this model's rear; the only evidence is the 489 px rear
      product photograph at about 1.08 px/mm. It shows two fixed fans behind honeycomb guards centred
      at 109.8 and 236.1 mm, each about 51.7 x 26.9, from y 5.4 - to a millimetre and a half at best.
      No handles or seams: fixed fans, drawn as the panel's perforation. The guide contains no 'fan' at
      all, in its converted text or its PDF text layer.
attrs:
  power: {power-max-w: 60, power-envelope: unstated, input-ac: '100-240 VAC, 50/60 Hz, 1.2 A', input-dc: '-48
      to -60 VDC, 3.0 A'}
  environmental: {temperature-operating: -10 C to 65 C (14 F to 149 F), temperature-storage: -40 C to
      70 C (-40 F to 158 F), humidity-operating: 5% to 95% non-condensing}
  features:
    optics-sfp: 1000BASE-SX/LX/EX/ZX and 1000BASE-T (ET4202-SX/LX/EX/ZX/RJ45)
    optics-sfp-plus: 10GBASE-SR/LR/ER/ZR and 10GBASE-T (ET5402-SR/LR/ER/ZR/RJ45)
  management:
    mgmt-ports: 1x RJ-45 console (115200 8N1), 1x RJ-45 out-of-band management
  compliance:
    emc: >-
      EN 55032 Class A, EN IEC 61000-3-2 Class A, EN 61000-3-3, FCC Class A, VCCI Class A, CE Mark
    immunity: EN 55035, IEC 61000-4-2/3/4/5/6/8/11
    safety: >-
      UL/CUL (UL 62368-1, CAN/CSA C22.2 No. 62368-1), CB (IEC 62368-1/EN 62368-1), BSMI (CNS15998-1)
    tec: TEC Certified ID 379400891
  lifecycle: {eol: none-announced}
chassis: {width: 440.0, height: 44.0, depth: 220.0, ru: 1, weight-kg: 2.82, color: '#5c6166', power: [ac, dc]}
gaps:
- what: ac-rating-silkscreen
  scope:
  - front
  reason: sources-disagree
  wanted: >-
    THE AC RATING PRINTED UNDER THE INLET. The -I's own figure prints '100-240V~;50/60Hz;1.0A' and the
    guide's specification gives '28Fv2-I: 100-240 VAC, 50/60 Hz 1.2 A' (1.0 A is the non-I 28Fv2's). The
    silkscreen is modelled as the figure prints it and the attr as the specification states it; a photograph
    of a real unit's legend settles which is printed.
- what: mgmt-port-lamps
  scope:
  - front
  reason: needs-photo
  wanted: >-
    WHETHER THE MGMT JACK HAS LAMPS. It is Ethernet, which this library draws lamped, but the figure draws
    it plain at 4.1 px/mm - where corner windows would be visible - and gives it no separate lamp. Drawn
    bare as seen; L76 stands.
- what: rear-geometry
  scope:
  - rear
  reason: needs-drawing
  wanted: >-
    A MEASURABLE REAR. The fan guards are read off a 489 px product photograph; nothing dimensions them
    and no figure draws this rear.
- what: airflow-direction
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    WHICH WAY THE FANS BLOW. Searched in the converted text and the PDF's own text layer: neither says
    anything about fans or airflow. Unstated rather than guessed.
- what: ordering-codes
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    No datasheet and no ordering table exists for this model, so there are no part numbers to attach to
    an orderable configuration; the device offers its base configuration only.
groups:
  sfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
  rj45-combo:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
    description: >-
      combo ports - copper-21..24 share their port numbers with the SFP cages port-21..24 printed beside
      them, one or the other in use at a time.
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: the out-of-band management RJ-45 beside the RS-232 console RJ-45 at the right-hand end.
  leds: {term: LED, role: indicator, index-origin: 1}
  power: {term: Inlet, role: service, index-origin: 1}
  grounding: {term: Point, role: furniture, index-origin: 1}
  furniture: {term: Item, role: furniture, index-origin: 1, description: the rack brackets.}
