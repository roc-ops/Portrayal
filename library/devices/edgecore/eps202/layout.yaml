format: 1
kind: device
name: eps202
version: 1.0.1
maturity: modelled
manufacturer: Edgecore
model: AS4630-54PE
portfolio: {line: Enterprise, family: Access Switch, series: EPS202}
description: >-
  54-port Gigabit PoE access switch, 1RU, sold as the EPS202 and stamped AS4630-54PE.
  48 x 10/100/1000BASE-T RJ-45 in twenty-four columns of two, ganged six and six and six
  and six, ALL of them delivering up to 90 W under IEEE 802.3at and 802.3bt - one rate and
  one PoE class, which is what separates it from both its shell-mates. Four 10G/25G SFP28
  uplinks and two 100G QSFP28 stacking ports numbered 49-52 and 53-54 into the same
  sequence. TWO HOT-SWAPPABLE 1200 W AC SUPPLIES AND THREE HOT-SWAPPABLE FAN TRAYS on the
  rear, front-to-back only.
  IT IS 32 mm SHALLOWER THAN ITS TWO SIBLINGS - 438 x 442 x 43.7 against 438 x 474 x 44 -
  and its FACE is theirs.
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The belly-to-belly cage pairs on this face follow the library's stack convention
      (docs/pluggables-3d-design.md, S1-S4): a row pair is the upper cage upright (rotate 0) over
      the lower turned 180, so both cage lips face the band between the two cages and both bails
      face outward, where a thumb reaches them. Where this provenance records a reading of a stack
      the orientation is that reading; otherwise it is the rule, not an observation. A photograph
      of the stack that shows otherwise overturns it.
  gate-1:
    confidence: borrowed
    note: >-
      THE FACE IS `edgecore/eps203`'s, AND THE EVIDENCE FOR THAT IS BETTER THAN THE
      EVIDENCE THIS DEVICE'S OWN ELEVATION COULD GIVE.
      Its own datasheet figures are the worst of the family. All four read between -3.7%
      and -6.2% on aspect against 438 x 43.7, and fitting the twenty-four RJ-45 column
      positions of its front elevation gives a straight-line rms of 0.695 mm with a
      quadratic term implying the local pitch GROWS 3.8% across the row - the opposite
      direction from the EPS201's -5.0%, and the same kind of fault.
      THE SHELL IS NOT SHARED AND THE FACE IS, which is the distinction that took the work.
      The chassis is 32 mm shallower and 0.3 mm lower than the EPS201's and EPS203's, so
      nothing could be assumed. But the three quick start guides turn out to share
      artwork, and the sharing is exact: this guide's button-and-lamp enlargement is
      BYTE-IDENTICAL to the EPS203's (md5 45c69467154e...), as are its PSU-replacement
      figure and the fan-tray figure all three carry. Its left-end port enlargement is NOT
      byte-identical - the port indicators are drawn white here and pale blue there - but
      registered against the EPS203's it needs ZERO pixels of shift, and the port aperture
      centres in the two come out at the same pixels to a tenth: 263.5, 422.0, 508.0 and
      614.0 in both. Two renders of one face.
      A SCALE-FREE CHECK AGREES. The ratio of column pitch to jack aperture, which needs no
      calibration at all, reads 1.1778 on this guide's enlargement, 1.1778 on the EPS203's
      and 1.1776 on the EPS201's, against the 1.1814 the EPS203's measured geometry gives.
      AND THE HOMOGRAPHY TEST, WHICH PASSES FOR THE EPS201, FAILS HERE - which is worth
      recording because it is the test that would otherwise have been called decisive.
      Assuming this device's columns sit at the EPS203's positions, the best 1D perspective
      transform explains its datasheet elevation to only 0.484 mm rms, against 0.171 for
      the EPS201 and 0.069 for the EPS203 on itself; freeing the gutter ratio gets to 0.455
      and wants a different one. THAT IS THIS FIGURE'S DISTORTION, NOT A DIFFERENT WALL -
      the two enlargements settle it - but a reader who only had the elevations would have
      concluded otherwise, and so would I have.
      EVERY FRONT-FACE FIGURE IN THIS FILE IS THE EPS203's, measured on its datasheet
      elevation at 2.2877 px/mm (24-column fit, rms 0.121 mm) and on its guide's
      enlargements at 7.5 to 10.0 px/mm.
  the-height-nobody-can-resolve:
    confidence: datasheet
    note: >-
      THE PUBLISHED HEIGHT IS 43.7 AND THE SIBLINGS' IS 44.0, and the difference is 0.3 mm
      on figures whose finest pixel is 0.44. Both are roundings of inch values - this
      datasheet prints "43.8 x 44.2 x 4.37 cm (17.24 x 17.40 x 1.72 in)" and the siblings'
      print 1.73 in - and neither is 1RU's 44.45.
      `chassis.height` CARRIES 43.7 because that is what this device publishes, and every y
      figure on the face is the EPS203's, placed from the TOP edge. Nothing in any staged
      figure says whether the missing 0.3 mm comes off the top or the bottom, and at these
      resolutions nothing could.
  the-shallower-shell:
    confidence: datasheet
    note: >-
      438 x 442 x 43.7 against the EPS201's and EPS203's 438 x 474 x 44. THIRTY-TWO
      MILLIMETRES IS NOT A ROUNDING, and the issue that scoped this work says so in as many
      words. What it does not change is the face: the rear is the EPS203's too - same three
      fan-tray bays on the same pitch, same two 1200 W supplies on the same 84 mm pitch -
      and the depth goes somewhere neither elevation shows.
      THE RACK KIT NAMES ALL THREE ANYWAY: "RKIT-100G-SLIDE ... For EPS200
      series/AS4630-54TE/54PE/54NPE". A slide kit that fits a 442 mm and a 474 mm chassis
      is a statement about the rails, not about the boxes.
  ports:
    confidence: datasheet
    note: >-
      Ports per the datasheet: 48 x 10/100/1000BASE-T, 4 x 10G/25G SFP28 uplinks and 2 x 100G
      QSFP28 stacking ports (whether stacking works depends on the NOS), with IEEE 802.3at
      and IEEE 802.3bt PoE on all 48 of the 10/100/1000BASE-T ports.
      ONE RATE AND ONE PoE CLASS, which is this model's own shape. The EPS201 on the same
      face has the same 48 x 1G and NO PoE; the EPS203 has the same 48 sockets split 36 at
      2.5G and 12 at 10G with 90 W on all of them. Three machines, one port wall, three
      different answers to what comes out of it.
  power:
    confidence: datasheet
    note: >-
      "2pcs 1+1 redundant, load-sharing, hot-swappable 1200W AC (80 PLUS Platinum
      compliant)" - the same YPEB1200AM-1A03P10 the EPS203 takes, and its ordering table
      names both chassis: "(for EPS202/AS4630-54PE, EPS203/AS4630-54NPE)".
      Maximum power consumption "Low-line: 1710 Watts High-line: 1710 Watts" - the same
      figure at both lines, which is unusual enough to be worth quoting rather than
      paraphrasing - and a PoE budget with a 30 W guard band of "750 W for 1 PSU/1500 W for
      2 PSU", again the same at both lines.
  airflow:
    confidence: measured
    note: >-
      "Front-to-back airflow only", and the drawing agrees where the EPS201's does not.
      Counted on this model's own rear elevation: 2,547 pixels pass a red test at a median
      of (238, 43, 40), and the blue test finds 1,074 which are the supplies' inlet
      shadows rather than any handle. The EPS203 is the same - red, front-to-back only.
      The EPS201 is the one that ships both and draws blue.
  the-psu-hub-label-that-corrects-the-eps203:
    confidence: measured
    note: >-
      THE SUPPLY'S FAN HUB IS PRINTED WITH THE SUPPLY'S WATTAGE, and this device is what
      proves it. Its rear elevation prints **"2kV 1200W"** on each hub, legible at 12x, and
      its supply is the 1200 W YPEB1200AM-1A03P10.
      THAT CORRECTS WHAT `edgecore/eps203` SAYS ABOUT THE SAME PART. The EPS203 takes the
      same supply - its ordering table names both chassis - and its rear elevation prints
      "2kV 920W" on the same hub. Faced with one drawing against three published statements
      of 1200 W, that file carried 1200 and explained the 920 as a figure belonging to the
      FAN rather than to the supply. The explanation was wrong: the label tracks the
      supply, and this second render of the same part shows it doing so. The conclusion was
      right for the wrong reason, which is worth saying out loud.
      SO WHAT THE EPS203'S "920W" IS is an inconsistency between two documents rendering
      one part, and the EPS203's provenance now says that instead. A photograph of a real
      YPEB1200AM's hub would say which render is stale.
  the-rear:
    confidence: measured
    note: >-
      MEASURED ON THIS MODEL'S OWN REAR ELEVATION at 2.2763 px/mm, and it agrees with the
      EPS203's within the slack both figures carry.
      THREE FAN TRAY BAYS at x 47.0, 96.0 and 144.5 - a pitch of 48.75 against the EPS203's
      48.15 and the EPS201's 48.1 - with the red handles reading 47.4-86.1, 96.6-134.9 and
      145.9-183.2, widths 38.7, 38.2 and 37.3. The 2% spread in those widths is the
      figure's gradient, the same one the other two rears carry.
      TWO SUPPLY BAYS carrying the 1200 W module: its silver face reads 280.7-301.4 and
      364.6-382.2 in the parts the mask catches, 83.9 apart, which is the EPS203's 84.0
      pitch. The bays are drawn at the EPS203's measured 270.0 and 354.0 because that
      figure resolves their edges and this one does not.
attrs:
  environmental:
    operating-temp: '0 to 45 C (32 to 113 F)'
    storage-temp: '-40 to 70 C (-40 to 158 F)'
    humidity: 'Operating: 5% to 95% non-condensing'
  physical:
    weight-note: '7.67 kg (16.91 lb), with two installed PSUs'
  power:
    power-consumption: '1710 W maximum at both low and high line'
    poe-budget: 'With a 30 W guard band - 750 W with one PSU, 1500 W with two, at both low and high line'
  features:
    optics-sfp: >-
      Four 10G/25G SFP28 uplinks, ports 49-52. No per-cage breakout table is published, so
      none is stated here.
    optics-qsfp28: >-
      Two 100G QSFP28 ports, 53-54, sold as stacking ports and qualified by the datasheet
      itself - "stacking capability subject to NOS implementations".
    poe: >-
      All forty-eight RJ-45 ports support IEEE 802.3at and IEEE 802.3bt, up to 90 W per
      port depending on the budget. Cat 6 cabling, per the datasheet's prose. ONE CLASS
      ACROSS ALL FORTY-EIGHT, unlike the EPS203 which splits the same sockets by rate.
  lifecycle: {eol: none-announced}
chassis: {width: 438.0, height: 43.7, depth: 442.0, ru: 1, weight-kg: 7.67, color: '#3c3f43',
  airflow: front-to-back}
gaps:
- what: the-eps202-front-elevation
  scope: [front]
  reason: needs-drawing
  wanted: >-
    A SQUARE-ON ELEVATION OF THIS MACHINE. All four of its datasheet figures read between
    -3.7% and -6.2% on aspect, and fitting its front elevation's twenty-four RJ-45 columns
    gives a straight-line rms of 0.695 mm with a quadratic implying the local pitch grows
    3.8% across the row. Its guide has no square-on elevation at all. EVERY FRONT-FACE
    FIGURE IN THIS FILE IS CARRIED FROM `edgecore/eps203`, on the evidence that the two
    guides' port enlargements place the apertures at the same pixels. One orthographic
    drawing of this face would turn the whole file from borrowed to measured.
- what: where-the-missing-0-3-mm-goes
  scope: [front, rear]
  reason: needs-drawing
  wanted: >-
    WHETHER THIS CHASSIS IS SHORTER AT THE TOP OR THE BOTTOM. It publishes 43.7 mm where
    its two shell-mates publish 44.0, and every face figure here is placed from the top
    edge because that is where the EPS203's measurements are anchored. Three tenths of a
    millimetre is two thirds of one pixel on the best EPS20x figure, so no staged drawing
    can say. A dimensioned mechanical drawing closes it, and closes the same question for
    the other two at the same time.
- what: the-depth-that-is-32-mm-shorter
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    WHAT THE 32 mm COMES OFF. This chassis is 442 mm deep against its shell-mates' 474, and
    its front face and its rear face are both theirs - same port wall, same fan bays, same
    supply bays on the same pitch. So the difference is entirely in the sides, the lid and
    the floor, and not one staged figure draws any of them. Four undrawn faces is the
    normal state for this corpus; here it is the specific thing that would explain what
    makes this model different.
groups:
  rj45-1g:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the forty-eight 10/100/1000BASE-T RJ-45 ports, twenty-four columns of two ganged six
      and six and six and six, numbered 1-48 down each column. ALL FORTY-EIGHT CARRY PoE at
      one class - IEEE 802.3at and 802.3bt up to 90 W - which is this model's own shape:
      edgecore/eps201 has the same forty-eight with none, and edgecore/eps203 splits the
      same sockets by rate.
    attrs: {media: rj45, speed: 1g, poe: 'IEEE 802.3at and 802.3bt, up to 90 W per port'}
  sfp28:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the four 10G/25G SFP28 uplinks, two stacked pairs, numbered 49-52 into the same
      sequence as the copper ports.
    attrs: {media: sfp, speed: 25g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the two 100G QSFP28 ports, one stacked pair, numbered 53-54. Sold as stacking ports
      and qualified by the datasheet - "stacking capability subject to NOS implementations".
    attrs: {media: qsfp28, speed: 100g}
  port-leds:
    term: LED
    role: indicator
    index-origin: 1
    description: >-
      the fifty-four port indicators, one per port, in a row below the port wall with each
      port's number printed to its left. THIS GUIDE DRAWS THEM WHITE where the EPS203's
      draws them pale blue, on artwork that is otherwise the same face at the same pixels.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster at the left - a stacked RJ-45 pair carrying the management
      port over the console port, and a Type-A USB storage port above them.
  buttons: {term: Button, role: service, index-origin: 1}
  leds: {term: LED, role: indicator, index-origin: 1}
  grounding: {term: Point, role: service, index-origin: 1}
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        "2pcs 1+1 redundant, load-sharing, hot-swappable 1200W AC", two bays, either of
        which runs the switch. THE PoE BUDGET IS NOT 1+1 AND THE DATASHEET SAYS SO: "750 W
        for 1 PSU/1500 W for 2 PSU" with a 30 W guard band, the same at both line voltages.
        Losing a supply keeps the switch up and halves what it can deliver to attached
        devices.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '2+1'
      redundancy-note: >-
        "Hot-swappable 2 + 1 redundant fan trays", over THREE BAYS - figure and bay count
        agree. The tray is FAN-1U-1x1M, the same part all three EPS20x chassis take, and
        this model's ordering table lists only the front-to-back variant because this model
        ships only that way.
