configurations:
  dc:
    kind: base
    default: true
    description: >-
      The only published configuration. Two fixed load-sharing -48 VDC supplies and built-in
      redundant fans, side-to-side airflow, filter slot blanked. Nothing in this box is
      field-replaceable except the air filter, so there are no bays but that one.
    part-numbers:
      AS5915-18X-O-48V-S: {part: F0PEC5627001Z}
    bays: {filter-slot: edgecore/filter-slot-5915@1}
