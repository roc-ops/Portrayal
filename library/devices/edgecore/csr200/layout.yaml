format: 1
kind: device
name: csr200
version: 1.0.0
maturity: modelled
manufacturer: Edgecore
model: AS5915-18X
portfolio: {line: Service Provider, family: Cell Site Router, series: CSR200}
description: >-
  6x 10G SFP+, 8x 1G SFP and 4x 1G RJ-45 compact cell site gateway, sold as the CSR200,
  Broadcom BCM88272 Qumran-UX with an Intel Atom C3308 and a Stratum 3E OCXO. Temperature
  hardened to -40 to 70 C in a 240 mm-deep 1RU shell, side-to-side airflow with an optional
  air filter, and built-in fixed DC supplies and fans rather than removable ones. Ports
  number from 1; all timing, management and power connections are on the front.
profile: networking
lint:
  waive:
    L61: >-
      Eleven marks on this face are printed BESIDE the part they name rather than centred on
      it, and all eleven positions are measured off the elevation at 9.6341 px/mm.
      THE COAX LEGENDS ARE EIGHT OF THEM. Each timing pair prints `IN  OUT` on one baseline
      with `1PPS` or `10MHz` under it, and the whole legend sits BETWEEN and BELOW the two
      jacks: the jacks' centres read 37.97 and the legend's baselines 37.20 and 39.50. The
      rule measures each word against the single jack it names and sees a 0.77 mm vertical
      miss, but the word is not trying to centre on that jack - it is one half of a legend
      centred on the PAIR, which is why `1PPS` is further out than `IN` is. Moving them onto
      the jack centres would put the legend across the jacks, which is neither what the metal
      says nor what the rule wants.
      THE RJ-45 NUMERAL GROUP IS THE OTHER. `17 (up)(down) 18` is printed centred on its
      METAL CELL - the arrow pair lands at 317.41 against a cell centred at 317.41 - while
      the rule compares it with the CUTOUT, whose centre is 1.27 mm left because the 8P8C
      opening is not centred in a rj45-ganged cell. The numerals on the neighbouring column
      are placed by the same generated rule and pass. Centring on the bore would move a
      measured mark to quieten a rule.
provenance:
  sources:
    confidence: datasheet
    note: >-
      Two documents, both staged and both docling-converted, but MEASURED OFF THE PDF PAGE
      RATHER THAN THE CONVERTED FIGURES. csr200-datasheet (the CSR200 / AS5915-18X data sheet)
      carries the specification list, the ordering matrix, the accessory part numbers and the
      twelve-callout front elevation on page 2 that every horizontal number here is read from.
      csr200-qsg is the AS5915-18X quick start guide and supplies the hardware-specification
      table, the DC ratings, the grounding and timing procedures, and the one sentence that
      settles what the four coax jacks are: "Use coax cables to connect the 1-pulse-per-second
      (1PPS) in/out SMB ports to other synchronized devices."
  figure-choice:
    confidence: measured
    note: >-
      Gate 1, AND THE PREPARED BRIEF WAS NO HELP AT ALL. The extractor classified the datasheet's
      page-2 elevation - fig-0012, the only elevation either document contains - as a BANNER and
      dropped it, which is the exact failure docs/modelling-a-device.md warns about. It was
      recovered by rendering page 2 at 600 dpi with pdftocairo and finding the panel by
      row/column darkness: (361,1987)-(4599,2402), 4239 x 416 px.
      THE FIGURE IS A RENDER, NOT A DRAWING. Its aspect is 10.1899 against 10.0 for 440/44,
      1.86 percent out - inside the four percent at which docs/modelling-a-device.md still
      allows fractions - and the art says the same thing the arithmetic does: the top cage row
      shows more of its interior than the bottom row. So x carries geometry directly at
      9.6341 px/mm anchored on the stated 440 mm, and every y is a proportion of the panel's
      own 416 px height mapped onto 44 mm, or a registry figure anchored on one such proportion.
      THERE IS ONLY ONE ELEVATION. Neither document draws the rear, the sides or the top of
      this chassis, and the quick start says only that the grounding point is "on the device's
      rear panel or side panel" without picturing either. The rear is therefore a bare panel
      and the omission is recorded in gaps as needs-drawing, rather than furnished by analogy
      with a sibling that was never measured against it.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - "Dimensions (WxDxH): 440 x 240 x 44 mm (17.32 x 9.45 x 1.73 in)"
      (csr200-datasheet/doc.md). The quick start's hardware specification says
      "440 x 240 x 43.7 mm", and THE DISAGREEMENT IS 0.3 MM ON ONE AXIS - the two documents
      agree on width and depth to the digit and on weight at 3.8 kg. That is a rounding of the
      same metal, not two products, so it is not recorded as sources-disagree; 44.0 is taken
      because it is the figure the measured figure is scaled against and because a 1RU opening
      is 44.45. 440 is the body width: the datasheet's own "Installations to standard 19",
      21" and 23" rack" makes the brackets an accessory outside it, so nothing is subtracted
      here and the rack ears are optional placements at the library's 14 mm.
  panel-layout:
    confidence: photo-measured
    note: >-
      Every x below is a reading of the 600 dpi page at 9.6341 px/mm, and the two port blocks
      check each other. The SFP block's four columns were located by their bezel lamps, whose
      offsets inside a shell read 2.42/5.27/9.01/11.81 on all four columns to within 0.06 mm;
      that fixes the column pitch at 14.25, which is the registry's sfp-ganged pitch to the
      hundredth, and the block origin at 232.87. The SFP+ shells were located the same way and
      come out on a 27.56 pitch - one 14.25 cage plus a 13.31 gutter of vent field - with the
      three shells agreeing to 0.11 mm across twelve lamps.
      THE NUMERALS CONFIRM THE ORIGINS INDEPENDENTLY. Each column prints `n (up)(down) n+1` on
      one baseline, and the arrow pair's centre lands on the cell centre: 156.20 against a cell
      centred at 156.21, and 240.00 against 240.00. The RJ-45 block was anchored the same way,
      giving a 13.93 pitch against the registry's 13.97.
  rows:
    confidence: photo-measured
    note: >-
      The two cage rows and the bezel between them read 5.36-15.76 and 20.10-30.78 down a
      shell, so the pair spans 25.4 about a centre at 17.93. Row pitch is the registry's 15.0
      for the optical blocks rather than the 14.74 that subtraction gives, because
      docs/modelling-a-device.md makes ganged pitch a lookup; the top row is then placed at
      5.23 so the PAIR stays centred on its measurement. The RJ-45 blocks span 5.08-30.78, which
      no registry row-pitch covers, so 14.70 there is measured and said to be.
  leds:
    confidence: photo-measured
    note: >-
      The six system lamps read on a 6.986 pitch from 193.89 to 228.82, and their legends -
      LOC, DIAG, PSU1, PSU2, FAN, ALARM - are legible in the elevation. WHAT THEY MEAN IS NOT
      DOCUMENTED. Neither document carries an LED table; the quick start states exactly one
      colour, "After power on, the PSU1/PSU2 LEDs should be on green", and that is the only
      lamp vocabulary either document supports. So every lamp here carries `off` and a single
      green `on`, and the real vocabularies are recorded as a gap rather than invented from
      what a similar switch does.
      THE PORT LAMPS ARE FOUR PER COLUMN, NOT TWO. Each shell's bezel carries `(down) (up)
      (down) (up)` - two lamps for the upper port and two for the lower - measured on all seven
      columns of both blocks. Which of each pair is link and which is activity is not stated
      anywhere, so they are numbered 1 and 2 and the question is in gaps.
  power:
    confidence: datasheet
    note: >-
      THE SUPPLIES ARE NOT MODULES. The datasheet's callout 7 is "PSU 1/PSU 2 (fixed)" and the
      key features say "Load sharing, redundant 48VDC PSUs" and "Built-in redundant fan
      modules"; the only orderable SKU is "Fixed Dual DC PSUs". What is on the face is two
      three-pole barrier terminal blocks, not two bays, so nothing here is hot-swappable and
      there are no PSU or fan bays to accept anything. Ratings are the quick start's: 48 VDC,
      180 W per supply, 36-72 V 6 A input, and 119 W maximum consumption at 25 C for the box.
      The datasheet's "Power Capacity: 180 W (Maximum)" is the supply's, not the chassis's.
  airflow:
    confidence: datasheet
    note: >-
      datasheet - "Supports side-to-side airflow SKU (with Air Filter option)", and the single
      published ordering code AS5915-18X-O-48V-S ends in -S for side-to-side. That is why the
      face carries a filter slot at one end and a perforated field across the middle rather
      than intake vents at the top and bottom: air crosses the box. No front-to-back SKU is
      published and none is assumed.
