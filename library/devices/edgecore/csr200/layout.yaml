gaps:
- what: rear-elevation
  scope: [rear, top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A figure or square-on photograph of any face but the front. Both staged documents draw the
    front only - the datasheet's page-2 elevation is the sole elevation in either - so the rear
    panel here is bare metal. The quick start places a grounding point "on the device's rear
    panel or side panel" and ships a grounding kit of a lug, two screws and two washers, but
    pictures neither panel, so the lug is not placed: its face is known to exist and its
    position is not known at all. Airflow is side-to-side, so the left and right panels carry
    the intake and exhaust and are the faces that matter most here.
- what: led-vocabularies
  scope: [front]
  reason: vendor-silent
  wanted: >-
    An LED table. Neither document has one. Six system lamps are legible on the faceplate -
    LOC, DIAG, PSU1, PSU2, FAN, ALARM - and the only colour either document states is in the
    quick start's step 5: "After power on, the PSU1/PSU2 LEDs should be on green". So every
    lamp on this device carries `off` and one green `on`, which is what is known, and the real
    vocabularies - what amber on DIAG means, what ALARM signals, whether LOC is a locator
    beacon - are unwritten rather than guessed. The same silence covers BITS, PPS, LINK and ACT.
- what: port-lamp-roles
  scope: [front]
  reason: vendor-silent
  wanted: >-
    Which of each port's two bezel lamps is link and which is activity. Every optical column
    carries four lamps - two pointing up to its top port, two pointing down to its bottom port -
    measured consistently across all seven columns of both blocks. Nothing in either document
    names them, so they are `led-port-N-1` and `led-port-N-2` in the order they are printed,
    left to right.
- what: air-filter-module
  scope: [front]
  reason: needs-photo
  wanted: >-
    A picture of the air filter. Edgecore sells two accessories against the filter bay -
    F0OEC5627002Z, "Assembled module with filter installed", and F0OEC5627001Z, "Air filter
    frame for field replacement" - and NEITHER IS PICTURED. Only the slot cover that ships in
    the bay is drawn, so the bay accepts that cover alone. The filter's own face is a second
    module waiting on a source.
- what: dc-terminal-block-part
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The maker and part number of the three-pole barrier terminal block. common/dc-terminal-27@1
    was created for this device and measured off this device's own elevation - 28.0 x 15.2 on an
    8.5 pole pitch, read twice because the face carries two of them - but no document names the
    bought-in part, and its depth is estimated outright because a front elevation fixes nothing
    behind the face.
- what: coax-jack-size
  scope: [front]
  reason: needs-drawing
  wanted: >-
    A dimension for the four timing jacks. The quick start calls them SMB - "the 1-pulse-per-
    second (1PPS) in/out SMB ports" - which is what picks common/smb-jack@1 and its 7.0 mm nut.
    The elevation supports the CENTRES, which read on a 14.17 pitch, and not the envelope: what
    is bright in the art is the gold collar at about 3.4 mm, and the nut's flats are dark metal
    against a dark panel. So the pitch is measured and the part's own size is borrowed.
groups:
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
  sfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 100/1000base-t}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the synchronisation cluster - two RJ-45 jacks carrying BITS and ToD/1PPS and four SMB
      coax jacks carrying 1PPS and 10 MHz in and out. Two media, one job: disciplining this
      box's clock from the network and passing it on. The datasheet lists them as four separate
      callouts; they are one function.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster - the 1000BASE-T RJ-45 and the RS-232 console share one bezel at
      the right-hand end, and the USB-A storage port sits apart from them under the first SFP+
      shell. The Reset button is counted here for the same reason: three media, one job.
  leds: {term: LED, role: indicator, index-origin: 1}
  power:
    term: Input
    role: service
    index-origin: 1
    attrs: {redundancy: '1+1', redundancy-note: 'two load-sharing -48 VDC supplies, FIXED - not field-replaceable'}
  filter: {term: Filter, role: service, index-origin: 1}
  furniture: {term: Item, role: furniture, index-origin: 1}
