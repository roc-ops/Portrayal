configurations:
  ac-f2b:
    kind: orderable
    power: ac
    description: Dual AC PSUs, front-to-back airflow - red handles and red release latches
    default: true
  ac-b2f:
    kind: orderable
    power: ac
    description: >-
      Dual AC PSUs, back-to-front airflow. The guide states the colour: "Install back-to-front (B2F) airflow
      fan trays (blue handles) and PSUs (blue release latches)."
    airflow: back-to-front
    region-context: {exhaust: Intake}
    component-attrs:
      dcs240-fan: {handle-finish: '#3d7bd6', airflow-legend: B2F}
      dcs240-psu-ac: {latch-finish: '#3d7bd6', latch-edge: '#234b8c'}
  dc-f2b:
    kind: orderable
    power: dc
    description: Dual -48 VDC PSUs, front-to-back airflow - red handles and red release latches
    bays: {psu-1: edgecore/dcs240-psu-dc@1, psu-2: edgecore/dcs240-psu-dc@1}
  dc-b2f:
    kind: orderable
    power: dc
    description: Dual -48 VDC PSUs, back-to-front airflow - blue handles and blue release latches
    airflow: back-to-front
    region-context: {exhaust: Intake}
    bays: {psu-1: edgecore/dcs240-psu-dc@1, psu-2: edgecore/dcs240-psu-dc@1}
    component-attrs:
      dcs240-fan: {handle-finish: '#3d7bd6', airflow-legend: B2F}
      dcs240-psu-dc: {latch-finish: '#3d7bd6', latch-edge: '#234b8c'}
