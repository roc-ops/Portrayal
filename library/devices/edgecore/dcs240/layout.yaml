format: 1
kind: device
name: dcs240
version: 1.1.9
maturity: modelled
manufacturer: Edgecore
model: AS9726-32DB
aliases:
- {name: DCS240, kind: marketing}
- name: AS9726-32DBS
  kind: variant
  note: >-
    The datasheet and quick start this drawing was measured from are both titled AS9726-32DBS,
    while the model is recorded as the AS9726-32DB. Neither document states how the two differ,
    so this is listed to find the closest drawing, not as the same box.
portfolio: {line: Cloud Data Center, family: Leaf Switch, series: DCS240}
description: >-
  32x 400G QSFP56-DD and 2x 10G SFP+ data-centre leaf switch, sold as the DCS240, with an
  ASPEED BMC on the -DB variant. Every port, the management jack, both consoles, the USB and
  a 1PPS timing input are on the FRONT; two supplies and SIX fan trays are on the rear. The
  QSFP ports number 1-32 down each column; THE TWO SFP+ HAVE THEIR OWN NUMBER SPACE and are
  printed 1 and 2.
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the rule, not an observation,
      so a photograph of the stack overturns it: the 1 SFP pair (tengig-1/tengig-2), the 16 QSFP
      pairs (port-1/port-2 to port-31/port-32).
  sources:
    confidence: datasheet
    note: >-
      Two documents, both staged and both docling-converted, MEASURED OFF THE PDF PAGE rather
      than the converted figures - dcs240-datasheet and dcs240-qsg (the AS9726-32DBS quick
      start guide, whose page 1 is English and pages 4 and 7 the same art in Chinese).
      THE PHOTOGRAPHS WERE OPENED FIRST THIS TIME. working/intake/edgecore/photos/ holds
      dcs240-2-DCS240_02.png and dcs240-3-DCS240_03.png, square-on shots of both faces, and
      dcs240-1 at an angle. They are 489 x 357, about 1.11 px/mm, and orthographic: the front
      one reads an aspect of 9.980 against the stated 10.078, 1.0% out.
      HERE THE GUIDE IS THE BETTER SOURCE AND THE PHOTOGRAPH IS THE CHECK, which is the
      reverse of the DCS202. This guide's Overview elevation is effectively orthographic - see
      gate-1 - and gives 5.0844 px/mm against the photograph's 1.11, so the measurements are
      taken from the guide and confirmed against the photograph.
  gate-1:
    confidence: measured
    note: >-
      PASSES, AND UNUSUALLY WELL FOR THIS CORPUS. The front face on page 1 reads x156-2384 and
      y2135-2353: 2229 px by 219, an aspect of 10.178 against the stated 438.4 / 43.5 =
      10.078, which is 1.0% out.
      AND THE WIDTH DOES NOT TAPER. Sampled at four heights across the face it reads 2229 px
      every time, where the DCS201's tapered 20 px and the DCS202's thumbnail was worse. The
      two scales come out 5.0844 px/mm in x and 5.0345 in y, agreeing to 1%, so BOTH AXES
      CARRY GEOMETRY here and neither has to be constructed.
      CONFIRMED FRONT AGAINST REAR: the rear face on the same page also measures 2229 px.
  the-optical-wall:
    confidence: measured
    note: >-
      SIXTEEN COLUMNS FROM THREE CONSTANTS. The cage frames resolve as exactly 16 bright runs
      at two independent bands (page y2240-2250 and y2270-2280). Column 1 centres at 48.88 mm;
      the within-block step averages 18.87 against std/qsfp-ganged@1's registry pitch of 19.0,
      a lookup rather than a measurement; and the columns are in EIGHT BLOCKS OF TWO on a 44.0
      block pitch, which is gang 2 with a 6.0 gutter.
      The check: 48.88 + 15 x 19.0 + 7 x 6.0 = 375.88 against 375.56 measured, 0.32 mm over the
      whole wall.
      ROWS ARE MEASURED TOO, because this figure's vertical axis works. The upper cage opening
      runs 12.51 to 22.45 mm and the lower 26.82 to 36.55 - heights of 9.94 and 9.73 against
      the registry's 9.58 - so the parts are centred on those openings at 12.69 and 26.90, a
      14.21 row pitch.
  the-two-sfp-plus:
    confidence: measured
    note: >-
      NOT IN THE ISSUE'S SUMMARY, AND THEY HAVE THEIR OWN NUMBERS. Callout 4 reads "2 x 10G
      SFP+ ports" and the panel prints `1 (up) 10G SFP+ (down) 2` beside them, so they are
      numbered 1 and 2 rather than 33 and 34 - a second port number space on one face, as the
      CSR310 has. Their cages measure 389.23 to 402.80 mm, a 13.57 width against
      std/sfp-ganged@1's 14.25, and they sit on the same two rows as the optics.
  the-management-cluster:
    confidence: measured
    note: >-
      MEASURED IN X FROM THE BEZEL WALLS, which are bright and unambiguous: both white bezels
      span 15.7 to 31.7 mm, centred at 23.7. The upper one holds the 1G Mgmt RJ-45 over a
      USB-A - the panel prints "1G Mgmt" vertically with an up arrow for the jack and a USB
      symbol under a down arrow - and the lower one holds the RJ-45 console, whose frame reads
      27.01 to 40.12, a 13.31 height against std/rj45@2's 13.20.
      Callout 2 names the set: "Management Ports: 1 x 1000BASE-T RJ-45, micro-USB/RJ-45
      console, USB". THE CONSOLE IS A PAIR, not a choice of connector on one port: the panel
      labels a micro-USB Console at the left and an RJ45 Console beside it, and both are drawn.
  the-system-lamps:
    confidence: measured
    note: >-
      A 3x2 GRID, AND THE SIXTH WINDOW HAS NO NAME. The System LEDs/Buttons enlargement shows
      six windows in three rows of two - round in the left column, rectangular in the right -
      labelled Loc and Diag on the top row, PS1 and PS2 on the middle, and Fan on the bottom
      left. The bottom right window carries no legend in any figure or table.
      The guide's own list has exactly five: "Loc: Flashing Amber (switch locator)", Diag,
      PS1/PS2 and Fan. Six windows are drawn because six are in the metal; the sixth is given
      an id and a region rather than left anonymous, which is what the CSR310 learned.
  lamps:
    confidence: datasheet
    note: >-
      quick start, Port LEDs, verbatim. "QSFP-DD LEDs: 400G: 1 LED Blue; 200G Breakout: 1 LED
      White, 1-2 LEDs Green; 100G Breakout: 1-4 LEDs Green; 50G Breakout: 1 LED Cyan".
      "SFP+ 10G LEDs: Left: Green (link); Right: Green (10G), Amber (1G)". "RJ-45 Mgmt LEDs:
      Left: Green (link); Right: Green (activity)".
      ONE LAMP PER QSFP PORT IS DRAWN AND THE METAL HAS FOUR, which is a simplification
      rather than a limit of the source - and worth saying plainly, because on the DCS201 the
      same choice was forced. HERE THE ART DOES RESOLVE THEM: the Port LEDs enlargement shows
      a vertical column of four round windows beside each cage, which is exactly the "1-4
      LEDs" the table describes. Drawing them would be 128 placements and 128 cutouts on a
      face that already carries 34 ports, and edgecore/as5912-54x and edgecore/dcs201 both
      draw one per cage with the vocabularies riding on it as states. This follows them for
      consistency, and the four-window gap below records what was left out and where.
      The management jack's pair ARE drawn, because they are integrated in its bezel and
      common/rj45-eth@1 carries them.
  the-pull-out-tab-and-the-end-vents:
    confidence: measured
    note: >-
      TWO THINGS THIS MODEL'S FIRST PASS MISSED, both found while reviewing edgecore/dcs511 and
      both measured here on THIS device's own page-1 Overview elevation at 5.0821 px/mm.
      THE GREEN TAB IS A PART. Colour-segmenting the elevation finds it at x 414.00-429.74,
      y 40.14-42.70 - 1052 green pixels, unambiguous. It is common/pull-tab@1, the library's
      "captive pull-out information tab", which edgecore/dcs510 and edgecore/dcs511 both seat
      at 414.5 and 413.87 on the same shell. It was not drawn at all before. The part is 4.5
      tall against 2.75 of drawn green, so it is seated with its foot at the panel edge rather
      than its head at the measured top; the DCS510's independently chosen 38.4 lands 0.3 mm
      from the 38.50 that gives.
      THE END VENTS ARE SLOTS, NOT HONEYCOMB. Both carried `pattern: vent`, which paints
      hexagons. The elevation shows two columns of RECTANGULAR slots at the left edge on about
      a 1.8 by 3.3 mm pitch - the same slot field the top and bottom bands already use on this
      face. The extents are not changed: 1.20-4.80 and 433.00-437.20 are this device's own
      measurements from the pass that got the pattern wrong, and nothing here re-measures them.
      WHAT IS NOT CHANGED, AND WAS CHECKED. The DCS511 review also moved that device's lamps to
      six round windows and cut its timing legend to "PPS". NEITHER APPLIES HERE: this
      elevation plainly draws PS1 and Fan as circles in the left column and PS2 and the unnamed
      sixth as squares in the right, and it plainly prints "1PPS IN". Two devices on one shell
      that differ in their silkscreen, which is why each is read on its own art.
      ONE RENAME FALLS OUT OF THE TAB. The white rectangle at [409.00, 5.00] was called
      `product-label`, and callout 6 on this elevation gives that name to the TAB. It carries
      the Edge-corE wordmark and is the brand badge, so it is renamed `brand-badge` and the
      model stops using one name for two things. It is still drawn here, unlike on
      edgecore/dcs511 where it was dropped: this library cannot set a logo into a decor, so it
      is a blank grey box either way, and whether that is worth drawing is a judgement this
      change does not make for a device it is only passing through.
  logo:
    confidence: photo-measured
    note: >-
      THE BRAND BADGE IS A LOGO, SO ITS PLACE IS RESERVED AND NOTHING IS DRAWN THERE. What the
      quick start draws above the model number is the vendor logotype: a row of nine outlined
      tiles, the first and last red. Measured on the Overview elevation as embedded in the
      quick start (2000 x 356 px), calibrated on the chassis outline at 4.318 px/mm across and
      4.276 down, the row runs x 406.9 to 432.1 and y 6.1 to 10.5. The green tab is the check:
      the same calibration puts it at x 414.1 to 429.6, against the 414.00 to 429.74 this file
      already holds. The grey `brand-badge` box at [409, 5], 22 x 9, stood in for the logotype
      and the model number together and read as a blank plate; it is removed, and the region
      `logo-zone` holds the measured box of the logotype alone. The model number under it is
      still not drawn.
  the-rear:
    confidence: measured
    note: >-
      MEASURED BY TWO DIFFERENT SIGNALS THAT AGREE. The six red pull bars segment in colour and
      centre at 97.16, 145.74, 194.22, 242.70, 291.28 and 339.67 mm; the honeycomb's own
      texture, a different signal in a different band, gives 95.88, 144.36, 192.84, 241.42,
      289.81 and 338.39. Both give a bay pitch of 48.50 to a tenth of a millimetre.
      The supplies were read with an edge scan rather than a threshold - a threshold on a
      bright module against dark chassis clips the duller edge - and their frames read
      12.00-66.28 and 371.73-426.21, giving 54.28 and 54.48 against a 54.4 part.
      IT CLOSES ON ITSELF: left margin 12.0 against right margin 12.2, and the fan block
      between the supplies with gaps of 5.4 and 9.1. Four independent quantities agreeing is
      why these are used rather than estimated.
  the-rear-modules-are-new-parts:
    confidence: datasheet
    note: >-
      SIX FANS AT 48.5, NOT FIVE AT 58.8, AND SUPPLIES FOUR TIMES THE RATING. The rear callouts
      read "2 x AC or DC PSUs" and "6 x fan trays" where the DCS201's shell takes five, and the
      measured pitch settles it. The supplies are rated "100-127 VAC, 12 A max. (1000 W max.)"
      and "220-240 VAC, 8 A max. (1500 W max.)" AC, and "-48 VDC, 1600 Watts" DC, against the
      DCS201's 400 W and the family generics' 650 W. Nothing in the library could be seated
      here without exporting a wattage this vendor does not claim.
  airflow-colour-convention:
    confidence: datasheet
    note: >-
      Stated in this device's own guide, in the family's words: "Remove front-to-back (F2B)
      airflow fan trays (red handles) and PSUs (red release latches)" and "Install
      back-to-front (B2F) airflow fan trays (blue handles) and PSUs (blue release latches)".
      Both b2f configurations below therefore override every handle, latch and legend, which
      is the defect roc-ops/Portrayal#277 is open about.
  power:
    confidence: datasheet
    note: >-
      quick start, without transceivers: minimum 396 W at 100 VAC / 386 W at 240 VAC, maximum
      714 W at 100 VAC / 653 W at 240 VAC. EXCLUDING TRANSCEIVERS, and the guide
      says so - thirty-two 400G modules are a large addition that this figure does not carry.
attrs:
  environmental:
    operating-temp: '0 to 45 C'
    storage-temp: '-40 to 70 C'
  physical:
    weight-note: '11.85 kg (26.12 lb), with 2 PSUs and 6 fans installed'
  features:
    optics-qsfp-dd: >-
      datasheet: each port takes 1 x 400 GbE or breaks out to 2 x 200G / 4 x 100G, and also
      accepts 100 GbE QSFP28 and 40 GbE QSFP+. THE UPPER SIXTEEN PORTS SUPPORT UP TO 24 W PER
      TRANSCEIVER AND THE LOWER SIXTEEN DO NOT, which is a per-row fact this model has no
      vocabulary for and is recorded as a gap.
    optics-sfp-plus: >-
      quick start, Port LEDs: 10G and 1G modes are both indicated, so the pair takes 10GbE and
      1GbE optics.
  lifecycle: {eol: none-announced}
chassis: {width: 438.4, height: 43.5, depth: 590.0, ru: 1, weight-kg: 11.85, color: '#2b2f33',
  airflow: front-to-back}
gaps:
- what: the-four-undrawn-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, the underside and the two side walls. Nothing in this corpus draws
    any of them flat - the mounting figures show the lid and one side in three-quarter view
    while brackets go on, which shows nothing is printed there and gives nothing to model.
    Each carries an `empty:` sentence saying where I looked, per
    docs/deliberately-empty-faces.md: empty by verification, not by omission.
- what: qsfp-breakout-lamp-windows
  scope: [front]
  reason: needs-drawing
  wanted: >-
    The four breakout windows per QSFP-DD port, drawn. The Port LEDs enlargement resolves them
    - a vertical column of four round windows beside each cage - and the table names what they
    mean: "400G: 1 LED Blue; 200G Breakout: 1 LED White, 1-2 LEDs Green; 100G Breakout: 1-4
    LEDs Green; 50G Breakout: 1 LED Cyan". One lamp per port is drawn instead, carrying all
    four vocabularies as states, which is what edgecore/as5912-54x and edgecore/dcs201 do on
    the same cluster. Drawing the real four would be 128 placements and 128 cutouts, and the
    enlargement fixes them relative to a cage rather than to the panel, so their absolute
    positions would still have to be constructed. This records that the simplification is a
    choice here and not a limit of the source.
- what: the-24-watt-split
  scope: [front]
  reason: nos-dependent
  wanted: >-
    A way to say that HALF THIS WALL FEEDS MORE POWER THAN THE OTHER HALF. The datasheet
    states the upper sixteen ports support up to 24 W per transceiver and the lower sixteen do
    not - a real, per-row electrical fact that decides which optics can go where. The model
    has no vocabulary for a per-row power budget on a port group: `attrs` on the group would
    claim it for all thirty-two, and splitting the block in two to carry two attrs would
    misdraw a wall whose sixteen columns are one continuous pitch. It is carried in the
    device's optics prose instead, where a reader will find it and a tool will not.
- what: the-unlabelled-sixth-lamp
  scope: [front]
  reason: vendor-silent
  wanted: >-
    What the sixth system LED window is. The System LEDs enlargement shows six windows in a
    3x2 grid and the guide's own list names five - Loc, Diag, PS1, PS2, Fan. The bottom-right
    window carries no legend in any figure or table in either document. It is drawn, given an
    id and named in a region as an unidentified indicator rather than omitted, because a mark
    on the metal that the model leaves out is worse than one it labels as unknown.
- what: end-vent-extents
  scope: [front]
  reason: needs-photo
  wanted: >-
    A reading of how far the two end vent fields actually reach. Their PATTERN was corrected
    here - they were drawn as honeycomb and the elevation plainly shows rectangular slots - but
    their extents, 1.20 to 4.80 and 433.00 to 437.20, are still the ones set by the pass that
    got the pattern wrong, and nothing in this change re-measures them.
    THAT IS NOT A SAFE ASSUMPTION, because the sibling moved. edgecore/dcs511 carried these
    same two decors and its own photograph put the left field at 1.0 to 3.6, 1.2 mm narrower,
    which is what had its Loc, PS1 and Fan legends printing over the vent.
    IT WAS ATTEMPTED AND IT FAILED. A darkness threshold on this elevation returns the seams
    between slots rather than the field, and scoring columns by vertical periodicity - which
    should find a slot field and ignore a seam - returns four columns at 5.31-6.10 mm on the
    left, which is not where the field visibly is. At 5.08 px/mm a 1.8 mm slot column is nine
    pixels and the anti-aliasing defeats both instruments. This device's photographs are
    1.105 px/mm and are worse. A square-on shot at the DCS511's 2.19 px/mm or better would
    settle it in one pass.
- what: dc-supply-face
  scope: [rear]
  reason: needs-photo
  wanted: >-
    An elevation of the DC supply. The rear elevation and both rear photographs draw the AC
    pair; the datasheet rates a -48 VDC variant at 1600 W and the package contents list a "DC
    power cable (included with DC PSUs only)", so it certainly exists. edgecore/dcs240-psu-dc@1
    therefore borrows the AC module's measured face and marks its terminal estimated.
groups:
  qsfp-dd:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: qsfp-dd, speed: 400g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster - a 1000BASE-T RJ-45 management jack, a USB Type-A, and TWO
      consoles rather than one: a micro-USB and an RJ-45, both labelled as consoles on the
      metal. A 1PPS timing input sits beside them, which is a different job on the same strip.
  timing:
    term: Port
    role: management
    index-origin: 1
    description: >-
      the 1PPS timing input - a single SMB coaxial jack beside the consoles, labelled "1PPS IN"
      on the metal. It states no group media because coax is not a pluggable cage and L40's
      optics question does not apply to it; the medium is on the placement, where the exporter
      reads it.
  leds: {term: LED, role: indicator, index-origin: 1}
  furniture:
    term: Part
    role: furniture
    index-origin: 1
    description: >-
      the USB symbol beside the storage port and the captive pull-out information tab at the
      foot of the panel - things you neither connect to nor read off the face.
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        datasheet: redundant AC or DC PSUs. Each is rated 1500 W at high line against a chassis
        drawing at most 714 W without transceivers, so one supply carries the box and the
        second is redundant rather than additive.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '5+1'
      redundancy-note: >-
        datasheet: "5+1 redundant hot-swappable fan modules", and the rear callout counts six -
        "6 x fan trays" - so the digit form and the bay count agree without argument.
