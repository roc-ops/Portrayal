  top:
    size: {w: 440.0, h: 649.2}
    empty: >-
      Not drawn by either staged document. Four pages each, and between them they carry two
      elevations, a rear photograph, the FRU replacement figures, a Connect Power page and
      an air-filter procedure - none of which shows the lid.
  bottom:
    size: {w: 440.0, h: 649.2}
    empty: >-
      Not drawn by any staged source. A face that sits on the slide rails, is never serviced
      and carries no connector gets no figure.
  left:
    size: {w: 649.2, h: 87.0}
    empty: >-
      Not drawn by any staged source, and on this chassis that is a statement rather than an
      omission: every ordering code is front-to-back, so the machine breathes end to end.
      The intake is the front face's own perforation - which is why that face carries as
      much honeycomb as it does - and the exhaust is the four rear trays. The side walls
      have no perforation to draw.
  right:
    size: {w: 649.2, h: 87.0}
    empty: >-
      Not drawn by any staged source. The other side wall, solid for the same reason.
configurations:
  base:
    kind: base
    power: ac
    description: >-
      The chassis as it ships and as most people want to see it first: two supplies and four
      fan trays in, every traffic cage empty. The AC supply is seated because four of the
      five ordering codes are the AC machine.
    default: true
  ac-f2b:
    kind: orderable
    power: ac
    description: >-
      Dual 2000 W AC PSUs, front-to-back airflow, and FOUR OF THE FIVE ORDERING CODES ARE
      THIS BUILD - the bare code and its EU, UK and US variants, which differ only in the
      power cord in the box and in nothing this library draws. It is the build the
      datasheet's rear photograph shows.
    part-numbers:
      AS9947-36XKB-O-AC-F: {part: FNPEC9636001Z, power-cord: none}
      AS9947-36XKB-O-AC-F-EU: {part: FNPEC9636201Z, power-cord: 'IEC 60083 Type E/F (CEE 7/7)'}
      AS9947-36XKB-O-AC-F-UK: {part: FNPEC9636301Z, power-cord: 'IEC 60083 Type G (BS 1363)'}
      AS9947-36XKB-O-AC-F-US: {part: FNPEC9636401Z, power-cord: 'NEMA 6-20P (UL)'}
  dc-f2b:
    kind: orderable
    power: dc
    description: >-
      Dual 2000 W -48 VDC PSUs, front-to-back airflow. This is the build the quick start
      guide's rear elevation draws, and the only one it draws. The included cable is the
      ordering table's "6AWG PSU to 2 x Ring Terminal, 2.5m", which is what settles the
      supply's two studs.
    bays: {psu-0: 'edgecore/agr560-psu-dc@1', psu-1: 'edgecore/agr560-psu-dc@1'}
    part-numbers:
      AS9947-36XKB-O-48V-F: {part: FNPEC9636002Z, power-cord: '6AWG PSU to 2 x Ring Terminal, 2.5 m'}
references:
- {title: 'Edgecore AGR560 / AS9947-36XKB Quick Start Guide'}
- {title: 'Edgecore AGR560 / AS9947-36XKB Datasheet'}
