gaps:
- what: ground-pair-pitch
  scope: [ground-1, ground-2]
  reason: vendor-silent
  note: >-
    The grounding plate carries two screws for one lug, but no held document dimensions
    them: the rear photograph reads the two holes 16.0 to 16.3 apart, and the guide kit is one grounding lug and 2 screws, unsized. A two-hole lug lands on a
    pair host built at a lug pattern and a screw size, so both screws stay the nominal
    common/ground-lug@1 at the reading until a source gives the size and the spacing.
  wanted: the grounding screw size and hole spacing, or the part number of the kit lug
- what: dc-connector-identity
  scope: [rear]
  reason: needs-drawing
  wanted: >-
    WHAT THE DC TERMINAL ACTUALLY IS. The datasheet names it and stops - "DC Inlet:
    Amphenol Terminal" - with no series, no part number and no drawing, and the guide adds
    only the wire gauge. So edgecore/agr560-psu-dc@1's block is drawn to the guide's rear
    elevation at 5.08 px/mm and nothing else: a 18.7 x 31.6 frame with two 10.7 wells on a
    13.7 mm stud pitch. THE COUNT IS SAFE - the ordering table's cable is "6AWG PSU to 2 x
    Ring Terminal", so two studs is stated, not deduced - but the well diameter and the
    stud size are a round half of a measurement taken to about a quarter of a millimetre.
    An Amphenol catalogue drawing would replace them outright. The same gap is open on
    edgecore/ais800-64-psu-dc@1 for the same vendor's six-stud block.
- what: supply-latch-colour
  scope: [rear]
  reason: needs-photo
  wanted: >-
    A PHOTOGRAPH THAT SHOWS A SUPPLY LATCH ON THIS MACHINE AT ALL, in either build. Both
    supplies are drawn with a neutral #3d3d3f tab, and that is a measurement rather than a
    default: counted over the whole supply column of the datasheet's rear photograph at
    9.56 px/mm, the AC build carries 133 red pixels - a 1.2 mm streak that is the red wire
    behind the fan guard - against the fan trays' 106,257 on the same face, and the module's
    right margin reads a flat dark grey. The guide's rear elevation, which is the only
    document that draws the DC build, cannot help: it renders both supplies with ZERO
    saturated pixels while colouring the trays' handles on the same drawing.
    SO THE HONEST READING IS THAT THE TAB IS NOT A COLOURED PART, and the AIS800 family's
    airflow-colour convention is not evidence here - that family ships in two airflows and
    photographs both, and this machine ships front-to-back only. Both components were first
    written with that family's red and green and both were corrected. What would close this
    is one clear photograph of either supply's right edge out of the chassis.
- what: front-vent-field-geometry
  scope: [front]
  reason: needs-drawing
  wanted: >-
    THE PERFORATION PATTERNS, PITCHES AND EXTENTS, which are the softest numbers on this
    face. The panel carries two styles - honeycomb along the top and bottom of the port
    wall and at the right-hand corners, and short slots above and below each QSFP-DD block -
    and both were found by clustering a local-variance map of a textured photograph rather
    than measured. The field RECTANGLES are good to about a millimetre; the pitches are
    estimates chosen to look right at 5 px/mm and are not read off anything.
    They are drawn because a panel with blank metal where perforation is would be wrong in
    a more misleading way than one whose hole pitch is approximate, but nothing here should
    be treated as measured. A mechanical drawing, or a photograph at 15 px/mm, closes it.
groups:
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    description: >-
      the four 10G SFP+ ports, a single ganged quad of two columns by two rows at the left
      of the face, numbered 0-3 down each column. THEY ARE HALF OF A COMBO PAIR: the guide
      says these ports share a group with 100G QSFP28 ports 0 and 1, and that either the
      SFP+ ports or those QSFP28 ports can be used but not both types at once, and the panel prints one continuous pink band across this quad and QSFP28
      column 0 to say the same thing.
    attrs: {media: sfp-plus, speed: 10g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    description: >-
      the twenty-four 100G QSFP28 ports, in three ganged blocks of two columns by four
      rows, the four rows falling into an upper and a lower bank with their own numbering
      bands above and below. Column k carries 4k and 4k+1 in the upper bank and 4k+2 and
      4k+3 in the lower - a stride of four down each column - which is why this family is
      twelve two-port blocks in the layout rather than two twelve-port ones.
      PORTS 0 AND 1 ARE THE COMBO PAIR shared with the SFP+ quad.
    attrs: {media: qsfp28, speed: 100g}
  qsfp-dd:
    term: Port
    role: traffic
    index-origin: 0
    description: >-
      the twelve 400G QSFP-DD ports, in three blocks of two columns by two rows. UNLIKE THE
      OTHER TWO FAMILIES THESE ARE NOT A BELLY-TO-BELLY STACK: each row is its own
      single-high ganged cage with its own bezel, and the panel's "QSFP-DD 400G" rule runs
      through the gap between them. Column k carries 2k and 2k+1. The datasheet's ordering
      text calls the cage QSFP56-DD; the panel says QSFP-DD 400G and the panel is followed.
    attrs: {media: qsfp-dd, speed: 400g}
  port-leds: {term: LED, role: indicator, index-origin: 0}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster at the right of the face - a 1000BASE-T RJ-45 management jack
      whose own lamps the guide legends "Left (activity), Right (speed)", an RJ-45 serial
      console, a USB 3.0 Type-A storage port mounted VERTICALLY, and the reset pinhole.
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the three timing jacks - an RJ-45 time-of-day port and two coaxial bulkheads legended
      1PPS and 10MHz. The datasheet lists the machine's timing support as "SyncE,
      IEEE1588v2 PTP" and these are the ports that serve it.
  leds: {term: LED, role: indicator, index-origin: 1}
  grounding: {term: Lug, role: service, index-origin: 1}
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        datasheet: "PSUs: 2 redundant, load-sharing, hot-swappable AC or 48VDC", each 2000 W
        against a typical draw of 421.5 W plus at most 438 W of optics. AT 200-240 VAC THAT
        IS A GENUINE 1+1 with room to spare; at 100-127 VAC it is not, and both documents
        say so - the supplies then "function in low-line mode and may not support full power
        redundancy under certain conditions", which halves each unit to 1000 W. The claim
        here is the high-line one.
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs:
      redundancy: '3+1'
      redundancy-note: >-
        datasheet: "Fans: Hot-swappable 3+1 redundant fans". FOR ONCE THE FIGURE AND THE BAY
        COUNT ARE THE SAME NUMBER - four bays, four trays, 3+1 - which is not true of the
        AIS800 pair on this same shell, where a 7+1 counts eight rotors inside four trays.
        The tray is the same part in all three machines; what differs is how each datasheet
        chooses to count it.
