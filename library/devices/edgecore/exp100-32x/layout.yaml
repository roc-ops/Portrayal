format: 1
kind: device
name: exp100-32x
version: 1.0.1
maturity: modelled
manufacturer: Edgecore
model: EXP100-32X
portfolio: {line: Cloud Data Center, family: Programmable Switch, series: EXP100}
description: >-
  32 x 100G QSFP28 programmable 1RU switch on Xsight Labs X2 with an Intel Xeon D-1713NTE,
  sold as the EXP100-32X. All ports are on the FRONT with the console, the 1PPS jack, the
  management jack and the USB; two AC supplies and six fan trays are on the rear. It shares
  its 442 x 509 x 44 shell and its whole rear with edgecore/exp800-16o and seats that device's
  fan and supply; its FRONT is its own, because thirty-two ports start the wall 53 mm further
  left and squeeze the console cluster that sits before it.
profile: networking
provenance:
  stack-orientation:
    confidence: drawing
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the
      upper cage upright (rotate 0) over the lower turned 180, so both cage lips face the band
      between the two cages and both bails face outward. Decided by the port lamps, which point up
      over down: the 16 QSFP pairs (port-1/port-2 to port-31/port-32).
  sources:
    confidence: datasheet
    note: >-
      ONE DOCUMENT AND FIVE PHOTOGRAPHS, AND THAT IS ALL THERE IS. exp100-32x-datasheet is the
      only staged document; there is no quick start guide, no installation guide and no LED
      table. THIS WAS CHECKED RATHER THAN ASSUMED: the vendor's own product page at
      www.edge-core.com/product/exp100-32x/ lists exactly one download, "EXP100-32X Datasheet
      R01", where the sibling EXP800-16O's page lists a datasheet, a quick start guide and a
      safety sheet.
      THE STAGED PHOTOGRAPHS ARE THE VENDOR'S OWN, BYTE FOR BYTE. All four images the product
      page serves - EXP100-32X-FF, -B, -F and -A under wp-content/uploads/2026/05/ - were
      fetched and their SHA-256 digests compared against the staged copies. All four match
      exactly, at the same 960 x 700. There is no higher-resolution photograph to be had, which
      is what makes the system-lamp gap below a limit rather than an omission.
      The page also states a maximum draw of 863 W, which the datasheet does not.
  gate-1:
    confidence: measured
    note: >-
      PASSES, ON A ROUND SCALE AND A CORRECTED BOUNDING BOX.
      THE DATASHEET'S ELEVATIONS ARE DRAWN AT 10 PX/MM. Rendered from the PDF page at 600 dpi,
      the front face reads 4422 px wide and the rear 4412; against the stated 442 mm those are
      10.0045 and 9.9819 px/mm. Two drawings landing within 0.2% of a round 10.0 is the same
      evidence that settled edgecore/exp800-16o's width, and it settles this one: 442 is the
      number the art was drawn to.
      THE PHOTOGRAPH'S INK BOX IS NOT ITS FACE, and this is the second device in a row where
      that mattered. Its ink spans 104 rows, which at 960 px / 442 mm is 47.9 mm - taller than
      a 1RU. Rows 296-301 are a flat band of uniform grey, 102.3 to 102.4, whose colour
      saturation climbs from 2.9 to 5.8 while the panel below varies from 62 to 138: the
      chassis LID, the shot being very slightly from above. The rear photograph has the same
      band at the same rows. Excluding it the face is about 95 px = 43.7 mm against the stated
      43.94.
      NO TAPER: the ink spans 960 px at every height on both faces.
      THE ELEVATIONS ARE STRETCHED VERTICALLY, as the EXP800's front was. The front reads 486
      px tall where 43.94 mm at 10.0045 would be 439.6, so its y scale is 486 / 43.94 = 11.0605
      and every front y below is read on that second scale.
  the-optical-wall:
    confidence: measured
    note: >-
      EIGHT BLOCKS OF FOUR, AND TWO SOURCES AGREE ON EVERY BLOCK TO 0.4 MM. The bright
      perforated band that separates the two cage rows runs the length of each block and
      segments cleanly in both the datasheet elevation at 10.0045 px/mm and the photograph at
      2.1719 - a factor of 4.6 apart in resolution.
        elevation  44.68  88.96 135.84 180.12 223.90 267.68 314.16 357.94
        photograph 45.12  89.32 136.28 180.48 223.76 267.50 314.00 358.20
      Least squares on each gives a block pitch of 44.739 and 44.666; the block width reads
      38.72 and 38.68. With std/qsfp-ganged@1's registry pitch of 19.0 that is GANG 2 WITH A
      6.70 GUTTER, and the first aperture opens at 45.30.
      AUTOCORRELATION DISAGREED AND WAS WRONG, which is worth recording. The dominant period
      over the cage band reads 43.78 mm on the elevation and 43.74 on the photograph - both
      about a millimetre under the edge fits. The wall's inter-block gaps are not uniform (the
      steps read 44.2, 46.9, 44.2, 43.5, 43.7, 46.5, 44.2 on the photograph and the same
      pattern on the elevation), and a periodic fit to an irregular comb lands below the mean
      spacing. THE EDGES ARE MEASURED IN TWO PLACES AND THE PERIOD IS INFERRED FROM ONE; the
      edges win.
      ROWS are the weaker axis. The elevation puts the upper opening at 3.80 to 13.83 mm and
      the lower at 22.33 to 32.64, a row pitch of 18.54; the photograph gives about 4.4 to 12.6
      and 22.6 to 30.7, a pitch of 18.2. The two row tops agree within 0.6 mm and the pitches
      within 0.35, so 4.10 and 18.40 are used. The drawn opening heights, 10.04 and 8.15
      against std/qsfp-ganged@1's 9.58, bracket the registry figure rather than agreeing with
      it, which is why the part's own height is drawn and not theirs.
  the-front-does-not-carry-over:
    confidence: measured
    note: >-
      AND THE ISSUE'S OWN ADVICE SAID IT WOULD. roc-ops/Portrayal#321 recommends building
      edgecore/exp800-16o first and carrying it over as "the only route that gets these two a
      measured panel". THAT IS RIGHT FOR THE REAR AND WRONG FOR THE FRONT.
      Thirty-two ports need 353 mm of wall where sixteen need 251, so this device's wall opens
      at 45.30 mm where the EXP800's opens at 98.16 - and everything to its left is compressed
      into a third of the room. The console bezel measures x 9.75 to 24.24 here against the
      EXP800's 57.97 to 74.77. Not one feature of the left cluster is in the same place.
      THE 1PPS JACK IS THE CHECK ON THE TWO SOURCES. Its gold nut segments at x 29.69-36.18,
      y 22.87-28.12 on the elevation and x 30.39-36.37, y 23.02-28.09 on the photograph - 0.7
      mm apart on a feature 6 mm across, read at 10.0 and 2.17 px/mm. That agreement is what
      licenses the rest of the left-hand measurements.
  the-timing-jack-is-drawn-smaller-than-it-is-named:
    confidence: datasheet
    note: >-
      THE SAME CONFLICT AS THE EXP800'S, AND THE SAME RESOLUTION. The datasheet's interface
      table reads "2. 1PPS SMA connector". The elevation draws the jack 6.49 x 5.25 mm and the
      photograph 5.98 x 5.07; common/sma-jack@1 is 9.5 mm across flats and edgecore/dcs510
      measures its own SMA nuts at 8.6. A 6 mm gold feature is not an SMA nut.
      common/smb-jack@1 is seated at 7.0 with a 4.83 aperture because it is the part that fits
      what is drawn, and the `timing` group's description carries the vendor's word so a reader
      is not told the vendor said SMB. A caliper on the real jack settles it.
  the-system-lamps:
    confidence: drawing
    note: >-
      FIVE LAMPS IN A 3+2 GRID, AND THIS IS THE WEAKEST THING IN THE MODEL. The datasheet's LED
      line names them - "System LEDs: Diagnostic, Locator, PSU, and Fan Status" - and the marks
      on the elevation fall in exactly the pattern the EXP800's enlargement resolves: three in
      the left column, two in the right.
      THE ONLY ELEVATION HAS CALLOUT ARROWS DRAWN THROUGH THE CLUSTER. Two of the nine leader
      arrows land on and beside it, and at this size a 2 mm lamp and a four-character legend
      are both about 3.4 mm wide, so which marks are windows and which are words cannot be told
      apart from the drawing alone.
      WHAT IS USED, AND WHY. The marks read x 27.74-31.24 and 36.23-39.48, rows y 13.79-15.14,
      16.73-18.09 and 20.12-21.48. They are taken as the LAMPS, giving column centres 8.4 mm
      apart - against the EXP800's measured 8.2 mm on the same cluster in the same family. That
      agreement is the reason for the choice and not a proof of it; the legends are then placed
      outside the columns, where there is room for them and where the EXP800 prints its own.
      confidence is `drawing` rather than `measured` deliberately. See the gap.
  the-management-stack:
    confidence: measured
    note: >-
      ONE HOUSING, TWO CONNECTORS, as on edgecore/exp800-16o and edgecore/dcs511. The bright
      bezel at the right of the port row reads x 410.8 to 427.5 and y 10.4 to 32.1 - a
      1000BASE-T RJ-45 over a USB 3.0 in one moulding. The datasheet lists them separately,
      "1 x RJ-45 1G BASE-T management" and a "USB3.0 storage port" in its callout table, and
      the panel prints MGMT and USB above the stack.
      There is no stacked RJ45/USB part in this library, so the housing is drawn as a decor
      under both.
      THE CONSOLE IS SEPARATE AND AT THE FAR LEFT, bezel x 9.75-24.24 by y 17.63-32.33 against
      std/rj45@2's 15.8 by 13.2, with CONSOLE printed beneath it. One console, as on the
      EXP800 and unlike the DCS240 and DCS511 which carry two.
  the-rear-is-the-exp800s:
    confidence: measured
    note: >-
      PROVEN AGAINST THIS DEVICE'S OWN ELEVATION, NOT ASSUMED. The rear drawing on datasheet
      page 2 renders at 9.9819 px/mm and carries the same furniture: PS1 at the LEFT, six fan
      trays numbered 6 to 1, PS2 at the right, red pull bars, red release latches at each
      supply's left edge.
      THE NUMBERS AGREE WHERE THEY MATTER. Colour-segmenting the six pull bars puts their
      centres on a 49.263 mm pitch with residuals of 0.34 mm or less, against the EXP800's
      48.921 - 0.34 apart. The full-height seams either side of the fan block put PS1's right
      edge at 67.82 and PS2's left at 426.47, against the EXP800's 66.6 and 425.9 - within
      1.2 mm on a 442 mm face.
      So edgecore/exp800-fan@1 and edgecore/exp800-psu-ac@1 are seated here rather than new
      parts being cut. The bay wall uses THIS device's own measurements - bar centre 97.24 and
      pitch 49.263 - not the EXP800's, because they are the better reading of this rear.
  power:
    confidence: datasheet
    note: >-
      863 W MAXIMUM, FROM THE VENDOR'S PRODUCT PAGE, and the datasheet states no consumption
      figure at all - the same situation as the EXP800 and the same number. The datasheet gives
      only "AC Input Voltage: 90 to 240 VAC at 50-60 Hz".
      NO PER-SUPPLY OUTPUT RATING IS PUBLISHED, so edgecore/exp800-psu-ac@1's own contract
      carries no `power-output-w` and none is asserted here either.
  airflow:
    confidence: datasheet
    note: >-
      FRONT-TO-BACK ONLY, AND THAT IS A DIFFERENCE FROM THE SIBLING. This datasheet's feature
      list reads "Supports front-to-back airflow direction" - one direction, singular - where
      the EXP800's product page offers "front-to-back or back-to-front airflow options" and
      that model carries both configurations. No B2F part number, legend or blue-handled
      variant is named anywhere for this device, so only the F2B configuration is declared.
attrs:
  environmental:
    operating-temp: '0 to 40 C'
    storage-temp: '-40 to 70 C'
    humidity: 'Operating: 0% to 95% non-condensing'
    altitude: '0 - 10,000 feet'
  physical:
    weight-note: '10.005 kg (20.05 lb), per the datasheet'
  platform:
    cpu: 'Intel Xeon D-1713NTE, 4-core 2.2 GHz'
    switch-silicon: 'Xsight Labs X2'
    memory: '32 GB DDR4 SO-DIMM with ECC'
    storage: '1 TB M.2 2280 NVMe SSD'
  performance:
    switching-capacity: '3.2 Tbps (full duplex)'
    packet-buffer: '64 MB integrated'
  features:
    optics-qsfp28: >-
      datasheet: each 100G QSFP28 port takes 1 x 100 GbE or breaks out to 2 x 50G, 4 x 25G or
      4 x 10G. The datasheet's transceiver list names the modules and cables it is qualified
      with; more are referred to the vendor's site.
  lifecycle: {eol: none-announced}
chassis: {width: 442.0, height: 44.0, depth: 509.0, ru: 1, weight-kg: 10.005, color: '#3f4348',
  airflow: front-to-back}
gaps:
- what: the-four-undrawn-faces
  scope: [top, bottom, left, right]
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, the underside and the two side walls. The single staged document
    draws two elevations and nothing else. Each face carries an `empty:` sentence saying where
    I looked, per docs/deliberately-empty-faces.md.
- what: system-lamp-positions
  scope: [front]
  reason: needs-photo
  wanted: >-
    A view of the five system lamps that is not crossed by a callout arrow. This is the one
    part of the model whose confidence is `drawing` rather than `measured`, and the reason is
    a hard limit rather than a shortcut:
    THE ONLY ELEVATION IS ANNOTATED OVER THE CLUSTER. Two of the datasheet's nine leader arrows
    land on and beside the lamp grid, and at 10 px/mm a 2 mm window and a four-character legend
    are both about 3.4 mm wide, so which marks are lamps and which are words cannot be
    distinguished.
    AND THERE IS NO BETTER PHOTOGRAPH TO BE HAD. The vendor's product page serves four images;
    all four were fetched and their SHA-256 digests match the staged copies exactly, at
    960 x 700, which is 2.1719 px/mm. That page also lists exactly ONE download for this model,
    the datasheet - no quick start guide exists, where the sibling EXP800-16O has one with a
    System LEDs enlargement that resolves the identical cluster at 600 dpi.
    The marks are taken as the lamps because the resulting 8.4 mm column spacing matches the
    EXP800's measured 8.2 mm. A quick start guide, or any photograph at 5 px/mm or better,
    settles it in one look.
- what: the-port-legend-word
  scope: [front]
  reason: needs-photo
  wanted: >-
    The word the panel prints between each pair of port numbers. Every column carries a legend
    of the form `N (up) WORD (down) N+1` - the numerals are clear on both sources and the
    numbering runs 1 to 32 - but the word between them is about five characters and 1.2 mm
    tall, which is 12 px on the elevation and 2.6 px on the photograph. It reads plausibly as
    "Group", which would be consistent with a device whose every port breaks out four ways, but
    plausibly is not good enough to silkscreen onto a drawing.
    Only the numerals are drawn. The word is left off rather than guessed.
- what: the-timing-jack-type
  scope: [front]
  reason: sources-disagree
  wanted: >-
    Whether the 1PPS jack is an SMA or an SMB. The datasheet names it "1PPS SMA connector"; the
    elevation draws it 6.49 x 5.25 mm and the photograph 5.98 x 5.07, where common/sma-jack@1
    is 9.5 across flats. common/smb-jack@1 is seated because it fits what is drawn. The same
    conflict stands on edgecore/exp800-16o, whose datasheet uses the same words.
- what: dc-supply-and-b2f
  scope: [rear]
  reason: vendor-silent
  wanted: >-
    Whether a DC supply or a back-to-front build exists. The datasheet says only "Hot-swappable,
    load-sharing, redundant AC power" and "Supports front-to-back airflow direction", and no
    ordering table is staged. Its sibling edgecore/exp800-16o is offered in both airflows on the
    vendor's page; nothing says this one is. Only the AC F2B configuration is declared.
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the thirty-two QSFP28 ports, in eight blocks of four - two columns of two - numbering
      down each column from 1 at the top left to 32 at the bottom right.
    attrs: {media: qsfp28, speed: 100g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster - an RJ-45 serial console at the far left of the panel, and a
      1000BASE-T RJ-45 management jack over a USB 3.0 storage port in one moulding at the
      right.
  timing:
    term: Port
    role: management
    index-origin: 1
    description: >-
      the 1PPS timing input - a single coaxial jack beside the system lamps. THE DATASHEET
      CALLS IT AN SMA; the drawings put it at about 6 mm, which is SMB scale, and
      common/smb-jack@1 is seated on that basis. It states no group media because coax is not a
      pluggable cage and L40's optics question does not apply to it.
  leds: {term: LED, role: indicator, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: '1+1'
      redundancy-note: >-
        datasheet: "PSUs: 2 redundant, load-sharing, hot-swappable AC PSUs". The vendor's
        product page gives the chassis an 863 W maximum draw; no per-supply output rating is
        published, so whether one supply carries the box alone is the vendor's claim rather
        than something derivable here.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: '5+1'
      redundancy-note: >-
        datasheet, twice: "5+1 redundant, hot-swappable fan modules" in the feature list and
        "Hot-swappable 5 + 1 redundant fans" in the interface callouts, against six bays drawn
        on the rear elevation. The digit form and the bay count agree.
