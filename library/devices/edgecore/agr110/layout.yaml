  performance:
    switching-capacity: 800 Gbps
    processing-rate: 700 Mpps
  power: {power-max-w: 450, power-envelope: unstated, power-input-ac: '100-240 VAC, 50-60 Hz, 6 A maximum',
    power-input-dc: '-36 to -72 VDC, 28-14 A'}
  thermal: {airflow: front-to-back (every published ordering code), cooling: 5+1 redundant hot-swappable fan modules}
  environmental: {temperature-operating: 0 C to 40 C (32 F to 104 F), temperature-storage: -40 C to 70
