chassis: {width: 438.4, height: 44.0, depth: 501.9, ru: 1, weight-kg: 9.7, color: '#2b2f33',
  airflow: front-to-back}
gaps:
- what: chassis-dimensions
  scope: [front, rear, top, bottom, left, right]
  reason: sources-disagree
  wanted: >-
    agr110-datasheet/doc.md:109 states 438.4 x 501.9 x 44 mm and agr110-qsg's hardware
    specification states 435 x 515 x 43.84 mm. All three axes differ and the depth differs by
    13 mm, which is not rounding. The datasheet is modelled, for the reasons in provenance -
    the sibling's datasheet states the same triple independently, 438.4 is the body width this
    vendor's 1RU line uses, and the figure's own aspect prefers it - but the quick-start is not
    wrong for being outvoted, and the same conflict stands unresolved on agr130, which shares
    that quick-start. A tape measure on a real unit settles it in one minute.
- what: qsfp-port-numbering
  scope: [front]
  reason: vendor-silent
  wanted: >-
    The six QSFP28 ports are numbered 48 to 53 here on the strength of the vendor's zero-based
    scheme, not on a reading. No figure held resolves their numerals: the quick-start's section 6
    zoom crops that end of the faceplate away and the datasheet render prints the band under its
    own callout highlighting. Which column is the lower number, and whether the separate bottom
    row continues the sequence or precedes it, need a straight-on photograph of the right-hand
    end of the front panel.
- what: qsfp-lamp-count
  scope: [front]
  reason: needs-photo
  wanted: >-
    The bezel between the upper QSFP block's two rows carries FOUR marks per column where the
    SFP+ bezel carries two. That is either two lamps per port or a four-lane column serving one
    of them, and 9.1 px/mm cannot separate those. One lamp per port is drawn; the other two marks
    per column are not. A photograph of one QSFP shell at better than 9 px/mm settles it.
- what: system-led-legend-placement
  scope: [front]
  reason: needs-photo
  wanted: >-
    The quick-start's section 6 zoom draws PS0, PS1, Diag, Fan and Loc as text INSIDE a light
    rectangle, which reads as a legend printed on the lens rather than beside it - unlike Reset,
    two centimetres away on the same band, which is plain white text on the chassis. It is drawn
    here as a lamp with its legend over it. Whether the real part prints on the lens or beside it
    is a bench photograph.
- what: management-port-lamps
  scope: [front]
  reason: needs-photo
  wanted: >-
    The management jack's link and activity lamps are BELOW THE CONSOLE PORT, not in the jack -
    a reader with better photographs than this corpus holds sees them there, which is why the
    jack is modelled on the bare std/rj45-ganged@2 rather than the lamped Ethernet cell. They are
    now placed, straddling the `Mgmt` label at 409.30 and 420.20 mm, from a reader looking at the
    hardware. The datasheet render does not resolve them on its own - the band carries marks at
    407.88, 409.63 and 410.73 mm and a brighter one at 30.1 to 31.0, and at 9.1 px/mm nothing
    separates a lamp from a legend among them - so the positions bracket the label rather than
    landing on a measured mark. What remains open is only the exact offset either side.
- what: uplink-lane-lamp-numerals
  scope: [front]
  reason: needs-drawing
  wanted: >-
    Each of the twenty-four lane lamps carries its lane number, 0 to 3, printed on the lens -
    legible in a close photograph of the hardware. It is not drawn, and the obstacle is the model
    rather than the evidence: the renderer paints a placement over its own silkscreen, so ink at a
    lamp's centre is invisible and L21 says so, and there is nowhere else for it to go - the port
    numerals sit 0.8 mm above the lamp row and the label bar directly below it. The same is true
    of the five system-LED legends at the other end of the face. What would fix both is a way for
    a lamp to carry a legend on its own lens, which is a component or renderer question and not
    this device's to answer.
- what: rear-grounding-points
  scope: [rear]
  reason: needs-photo
  wanted: >-
    The two grounding points do not look alike. Callout 7 points to a single round opening at the
    lower left, about 7.9 mm; the right-hand end carries a light plate with two holes one above
    the other, 424.7 to 436.7 mm, which matches the quick-start's "One grounding lug, 2 M5 screws"
    kit. Both are drawn with common/ground-lug@1. Whether the left-hand one is a second lug pad,
    a single bonding screw, or something else is a photograph of the rear left corner.
groups:
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
  port-leds: {term: LED, role: indicator, index-origin: 0}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster - the out-of-band 100/1000BASE-T RJ-45 and the RS-232 console share
      one ganged bezel at the right-hand end of the faceplate, and the USB-A storage port sits
      apart from them in the silkscreen band. Three media, one job: reaching and disciplining the
      box rather than carrying its traffic. The Reset button is counted here for the same reason.
  leds: {term: LED, role: indicator, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs: {redundancy: '1+1', redundancy-note: '2 redundant, load-sharing, hot-swappable AC or -48 VDC'}
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs: {redundancy: '5+1', redundancy-note: hot-swappable 5+1 redundant fan modules}
  grounding: {term: Point, role: furniture, index-origin: 1}
  furniture: {term: Item, role: furniture, index-origin: 1}
