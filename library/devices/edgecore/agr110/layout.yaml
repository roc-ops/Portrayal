format: 1
kind: device
name: agr110
version: 7.1.0
maturity: modelled
manufacturer: Edgecore
model: AS5916-54XL
portfolio: {line: Service Provider, family: Aggregation Router, series: AGR110}
description: >-
  48x 10G SFP+ plus 6x 100G QSFP28 1RU aggregation router, sold as the AGR110, Broadcom
  BCM88370 Qumran-MX with a BCM15K TCAM, Intel Xeon D-1518, ONIE-preloaded. All ports on the front,
  numbered from 0 with even ports on the top row; two 650 W AC or -48 VDC PSUs and six 5+1 fan
  trays from the rear, front-to-back airflow in every ordering code published.
profile: networking
lint:
  waive:
    L76: >-
      The management jack is an Ethernet jack on a part with no lamps, and that is the point: its
      link and activity lamps are not in the jack. They sit BELOW THE CONSOLE PORT, two rows down
      from the housing they serve, reported by a reader looking at the hardware. Putting it on
      common/rj45-ganged-eth@1 would draw two lamps in the cell's outer corners where the metal
      has none, which is the defect this rule exists to prevent, one level up.
      docs/rj45-family-design.md lists five ways the library expresses jack lamps and names
      "deliberately left undrawn (the S6301 pair's stated position)" as one of them; this is that
      case, and the position is stated in `management-port-lamps`. ufispace/s6301-56stp models the
      same arrangement - bare std/rj45-ganged@2 plus separate lamps - and escapes this rule only
      by omitting `media` from the placement, which hides the media rather than declaring it.
      Declaring rj45 and waiving the rule is the more honest of the two. Delete this waiver when a
      photograph resolves the lamps and they can be placed.
    L61: >-
      led-qsfp-50-51-2 sits 1.62 mm left of the centre of the two ports it serves, and so it
      should: it is one of FOUR lamps in a cluster, and only a two-lamp set could have a member
      on the centreline. All four positions are read off the figure. Lane 2 is simply the one
      that lands inside the rule's window; the other three are further off and do not trip it.
      Centring it would move a lamp off its measurement to quieten a rule, which is the trade
      this repository does not make.
provenance:
  sources:
    confidence: datasheet
    note: >-
      Two documents, both staged and both docling-converted, but MEASURED OFF THE PDF PAGES
      RATHER THAN THE CONVERTED FIGURES. agr110-datasheet (the AGR110 / AS5916-54XL data sheet)
      carries the specification list, the ordering matrix and fig-0009, a stacked front-and-rear
      colour elevation with eight callouts and their description table; that figure is the source
      of every horizontal number here. agr110-qsg is the AS5916-54XKS|AS5916-54XL quick start
      guide - a TWO-MODEL document - and supplies the hardware-specification table, the power
      ratings and, in its section 6 "Verify Switch Operation" zoom, the only legible reading of
      the port numerals and the system-LED legends. Three vendor stock photographs
      (photos/agr110-1..3) are 489 x 357 px and confirm nothing but colour.
  figure-choice:
    confidence: measured
    note: >-
      Gate 1, and the prepared brief's ranked candidates were NOT used. prepare.py ranks the
      docling-extracted figures, whose best here is agr110-datasheet/fig-0009 at 3.29 px/mm.
      The same figure taken off a 600 dpi render of its own page (pdftocairo -png -r 600 -f 2)
      measures at 9.12 px/mm, nearly three times the resolution, and that is what every number
      below was read at. Panel boxes found by row/column darkness: FRONT (382,1728)-(4389,2120),
      4008 x 393 px; REAR (386,2824)-(4385,3216), 4000 x 393 px. The two agree on width to 0.2
      percent, which is what anchors the x scale at 9.124 px/mm on 438.4 mm.
      THE FIGURE IS A RENDER, NOT A DRAWING, and its aspect says so: 10.18 against 9.96 for
      438.4/44, 2.1 percent out. The tell is not the arithmetic but the art - the TOP cage row
      shows more of its interior than the bottom row does, which happens when the camera sits
      slightly above the face. 2.1 percent is inside the four percent at which
      docs/modelling-a-device.md still allows fractions, so: x carries geometry directly, and
      every y here is either a proportion of the panel's own 393 px height mapped onto 44 mm or
      a registry figure anchored on one such proportion. No absolute vertical measurement was
      taken from this image.
      THE QUICK START GUIDE'S ART WAS REJECTED. Its page-1 front elevation measures 1199 x 148
      px - aspect 8.10 against 9.96, NINETEEN percent out, vertically stretched - and
      docs/modelling-a-device.md says that at ten percent you cannot take absolute scale at all.
      It puts the inter-row LED bezel at 17.24 mm where the datasheet render puts it at 15.17.
      The guide also disclaims itself in its own words, on page 1: "The switch drawings in this
      document are for illustration only and may not match your particular switch model." So the
      QSG is used here for TEXT ONLY - the specification table, the power ratings, and the
      section 6 zoom, which is a photograph of the real faceplate rather than line art.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - "Dimensions (WxDxH): 438.4 x 501.9 x 44 mm (17.26 x 19.76 x 1.73 in)"
      (agr110-datasheet/doc.md:109). THE TWO DOCUMENTS DISAGREE and the disagreement is recorded
      in gaps as sources-disagree: the shared quick-start's hardware specification says
      "435 x 515 x 43.84 mm" (agr110-qsg/doc.md, Switch Chassis / Size), which differs on all
      three axes, 13 mm of it in depth. The datasheet is taken for three reasons. The SIBLING's
      datasheet states the same triple independently - agr130-datasheet/doc.md:103 is
      "438.4 x 501.9 x 44 mm" to the digit - so two documents state it and one states the other.
      438.4 is the body width the rest of this vendor's 1RU line uses and is already the metal
      between the ear folds, the same figure dcs510 and cor580 carry, so nothing is subtracted
      here and the rack ears are optional placements outside it at the library's 14 mm. And the
      figure prefers it: the rear panel's measured aspect of 10.18 sits nearer 9.96 (438.4/44)
      than 9.92 (435/43.84). The weights do not disagree - 9.7 kg against 9.72 - so this is not
      two different products.
  chassis-colour:
    confidence: photo-measured
    note: >-
      photo - the chassis is black with a dark grey faceplate. Both panels of
      agr110-datasheet/fig-0009 and all three stock photographs agree. The quick-start's line
      art draws a light-grey shell and is the odd one out, as it is on dcs510; where the guide
      art and the device disagree the device wins.
  port-block-layout:
    confidence: measured
    note: >-
      measured - THREE ganged blocks of eight columns by two rows, 48 ports. The blocks were
      found from the top bezel lip (the continuous bright band at y 1.5-2.8 mm, which runs the
      length of a ganged bezel and stops in the gap between blocks): 13.78..127.32, 130.49..243.70
      and 246.44..362.16 mm, widths 113.54, 113.21 and 115.72. Eight ports at the registry pitch
      is 114.0 and SFF-8433's own 1xN bezel cutout is N x 14.25 + 1.2 = 115.2, so the three
      measured widths bracket the standard's own figure and the block count is not in doubt.
      Block pitch reads 116.71 and 115.95, mean 116.33, against SFF-8433's C04 block-to-block
      minimum extrapolated to 1x8 of 116.5.
  port-pitch:
    confidence: registry
    note: >-
      registry, not measured, per the rule that a ganged pitch is a lookup. spec/schemas/standards.yaml
      `sfp-ganged` states 14.25 as SFF-8433's B04 Basic - a dimension with no tolerance - with the
      14.25 x 10.40 per-port opening and a measured 15.0 belly-to-belly row pitch. What this
      figure measures is 14.0 to 14.5 column to column, and across the eight columns of the
      first block the fitted pitch is 14.110 against the standard's 14.25. That one percent is
      the FIGURE's scale error, not the cage's: a render whose aspect is already 2.1 percent out
      is not evidence against an SFF Basic dimension. The blocks are therefore laid out on 14.25
      and anchored so the region as a whole lands where it was measured - first column centre
      21.52 against a measured 21.33, last column centre 354.44 against a measured 354.34 - which
      leaves a residue of up to 1.2 mm in the middle of each block. That residue is the price of
      taking the standard over the render and it is recorded rather than hidden. Gutter 2.59 is
      what makes the two ends land: 23 steps of 14.25 plus two gutters over the measured span.
  port-rows:
    confidence: registry
    note: >-
      registry, anchored on one measured proportion. The white bezel band that runs between the
      two cage rows centres at 15.17 mm of the panel's height (bright band 13.44-16.91, read as a
      fraction of the 393 px panel). With `sfp-ganged`'s measured 15.0 row pitch that puts the
      top row's centre at 7.67 and the bottom row's at 22.67, openings 10.40 tall. The check is
      the block's outer extent: the modelled openings span 2.47 to 27.87 mm and the figure's
      outer bezel lips run 1.23 to 28.2, so the bezel stands about 1.2 mm proud of the opening at
      the top and 0.3 at the bottom - an asymmetry which is the camera, not the metal, and which
      is why no row was measured directly.
  port-numbering:
    confidence: drawing
    note: >-
      drawing, and this one is read rather than inferred. agr110-qsg's section 6 zoom prints,
      under the first four columns, "0(up-triangle) (down-triangle)1  2(up) (down)3  4(up)
      (down)5  6(up) (down)7". So NUMBERING STARTS AT ZERO, EVEN PORTS ARE THE TOP ROW and odd
      the bottom, numbered along the face in column pairs, and the solid triangle beside each
      numeral names its row. 48 ports are 0..47. The numeral glyphs measure at 17.61-19.69 and
      22.42-24.50 mm under the first column (centre 21.52), so they sit about 3 mm either side
      of their column centre with the triangle pair between them, on one baseline at 29.6 mm.
      Note what this settles for the whole line: it is the same `n (up)(down) n+1` idiom dcs510
      prints, but ZERO-BASED, and the datasheet's sibling DCS500 says in words that "port, fan
      and PSU numbering start at zero".
  port-leds:
    confidence: measured
    note: >-
      measured - ONE lamp per port, an outline triangle, both lamps of a column sharing the white
      bezel between the two rows: the upper port's points up and sits left of the column centre,
      the lower port's points down and sits right of it. Read in agr110-qsg's section 6 zoom,
      which resolves the pair inside each bezel cell, and confirmed in agr110-datasheet/fig-0009
      where each cell carries two marks about 3.9 mm apart. The lamps are drawn with
      common/led-arrow@1's up and down skins at +/- 1.95 mm from the column centre.
      THIS NEEDED A TOOL CHANGE. expand.py could offset a block's lamps by their position within
      a gang (`dx-by-col`) but not by their ROW, which is the only thing that distinguishes these
      two - one y, two x. `dx-by-row` was added to the lamp block for it, mirroring the knob the
      numerals already had for exactly the same reason on faces that print `n (up)(down) n+1`.
  system-leds:
    confidence: drawing
    note: >-
      drawing - FIVE lamps, left to right PS0, PS1, Diag, Fan and Loc, each drawn as a light
      rectangle with its legend printed on it, read in agr110-qsg's section 6 zoom which labels
      every one. Positions from agr110-datasheet/fig-0009: bright marks centred at 18.87, 24.77,
      30.68, 36.70 and 42.82 mm on a 5.99 mm mean pitch, in the band at 31.0-33.5 mm below the
      port numerals. The quick-start's own semantics, in words: "When operating normally, the
      PSU0/PSU1, Diag, and Fan LEDs should all be on green" (agr110-qsg/doc.md, section 6).
      WHAT IS NOT SETTLED is whether the legend is printed ON the lens or beside it. The guide
      art draws the text inside the rectangle; that is drawn here as a lamp with its text over
      it, and the question is recorded as a gap, because a bench photograph settles it and
      nothing held here does.
  reset-button:
    confidence: measured
    note: >-
      measured - a pinhole in a hexagonal recess with "Reset" printed to its right, centred
      (49.43, 35.04): the dark columns read 48.39 to 50.47 and the rows darker than plain chassis
      run 33.25 to 36.83. It is BELOW the system-LED row, not on it - a first pass put it on the
      same band at centre 32.25, nearly three millimetres high, which a reader saw before this
      measurement did. Position read off agr110-datasheet/fig-0009 and corroborated in
      the quick-start's section 6 zoom, where the hex outline and the legend are both legible.
  usb:
    confidence: measured
    note: >-
      measured - one USB-A storage port in the silkscreen band at 319.0 to 331.6 mm, 12.6 mm of
      opening against std/usb-a@1's 12.0, with the USB trident printed to its left at 310.9-317.7.
      Callout 5 of the datasheet figure names it "USB storage port" and the specification list
      says "1 x USB (storage)". Its vertical position is the least certain number on this face:
      the band it sits in is where the datasheet's callout highlighting crosses the artwork, and
      32.2 mm is a proportion off a render rather than a reading off a drawing.
  management-cluster:
    confidence: measured
    note: >-
      measured - the RJ-45 management port above the RJ-45 console port, in ONE white bezel
      running 406.79 to 424.18 mm, centre 415.49. The row centres read 9.1 and 21.2 mm, a pitch
      of 12.1 - which is `rj45-ganged`'s own measured row pitch of 12.1 to the millimetre, and
      that is what identifies the pair as a GANGED 2x1 block rather than two single jacks: a
      single jack's housing is 15.8 x 13.2 and two of those cannot sit 12.1 apart. The rows are
      mirrored, not translated - the upper jack's keyway points up and the lower jack's down,
      visible in the datasheet figure at 9.1 px/mm - which is the ganged form's normal
      construction and the reason the top row carries rotate 180.
      THE LEGEND IS READ AT LAST, off a close photograph of the hardware: `(up) Mgmt` on one line
      and `(down) Console` beneath it, in the band under the jacks - the same up/down idiom this
      faceplate uses for every stacked pair. Three drafts could not read it. The first invented
      `Mgmt (up)(down) Console` from dcs510's one-line idiom and was removed for saying what
      nobody had seen; the second measured three lines of ink at 401-420 mm and recorded that it
      could not resolve them; this one has the words. They are drawn, at the measured line spans -
      404.0-418.1 for the first and 404.0-419.9 for the second.
      THE MANAGEMENT JACK'S LAMPS ARE NOT IN THE JACK. They STRADDLE THE `Mgmt` LABEL, one either
      side, below the console port - off the connector entirely, two rows down from the jack they
      serve. So the management jack takes the BARE std/rj45-ganged@2 rather
      than common/rj45-ganged-eth@1, whose whole difference is two lamps in the cell's outer
      corners; drawing those would put lit hardware on a housing that has none.
      This is the S6301 arrangement exactly - ufispace/s6301-56stp's own provenance describes
      "the OOB management jack (two lamps above it)" and models it as a bare std/rj45-ganged@2
      with two separate common/led-dot placements carrying `for: mgmt`. The difference here is
      that the S6301's HIG resolves its lamp positions at 3.13 px/mm and this datasheet render
      does not: the band under the console jack carries small marks at 407.88, 409.63 and 410.73
      mm between y 27.4 and 28.6, and nothing at 9.1 px/mm separates a lamp from a legend among
      them. So the lamps are recorded as a gap rather than placed, which is the fourth of the
      five treatments docs/rj45-family-design.md lists - deliberately undrawn, position stated.
  qsfp-block:
    confidence: measured
    note: >-
      measured, and it is NOT one block. The six QSFP28 ports are a 2x2 stacked ganged block with
      a lamp bezel between its rows, and a SEPARATE 1x2 row below it, which the datasheet's
      callout-2 highlight encloses together as "6 x QSFP28 ports". Column centres read 373.81 and
      392.62 mm in both the upper and the lower openings - a pitch of 18.81 against the registry's
      19.0 for `qsfp-ganged`, which is the same one percent the SFP+ columns show and is treated
      the same way. Row centres read 7.5, 23.7 and 36.8: the upper pair are 16.2 apart with their
      bezel measured at 15.62 between them, and the third row sits 13.1 below the second with no
      bezel between, which is what makes it a separate block rather than a third row of the same
      one. The bottom vent band stops at 363.5 mm and does not run under this block, which is
      consistent with a third row of cages reaching to 41.6.
  qsfp-numbering:
    confidence: estimated
    note: >-
      NOT READ - ASSUMED. The QSFP28 ports are numbered 48 to 53 here, continuing the SFP+ block,
      because that is what the vendor's zero-based scheme implies and because no figure held here
      resolves their numerals: the quick-start's section 6 zoom crops the right-hand end of the
      faceplate away, and at 9.1 px/mm the datasheet render prints their band under the callout
      highlighting. It is recorded as a gap. Which of the two columns is the lower number, and
      whether the separate bottom row continues the sequence or precedes it, are the same
      question and have the same answer: a photograph.
  uplink-numbering:
    confidence: drawing
    note: >-
      drawing - THE SIX QSFP28 UPLINKS CARRY THEIR OWN 0-BASED SEQUENCE, 0 to 5, and the evidence
      is the yellow bars. Each bar is printed with a single numeral and a reader of better
      photographs than this corpus holds reports them as 0, 1, 2, 3, 4 and 5 left to right. Six
      labels, six uplinks. That is why these ports are `uplink-0` to `uplink-5` here and not a
      continuation of the SFP+ block's 0-47: two families, each numbered from zero, which is what
      the vendor's own ordering line calls them - "48-Port 10G with 6 x 100G QSFP28 Uplinks".
      THE CAGE ORDER IS READ FROM THE HARDWARE, not inferred. A reader with the switch in front of
      them reports it: "top to bottom on the left is 0,1,2, right side is 3,4,5". So it is
      COLUMN-MAJOR down each column, and the separate bottom row is not a third block numbered
      last - it holds uplink 2 on the left and uplink 5 on the right, each the last of its own
      column. A first pass numbered the 2x2 block 0-3 and the bottom pair 4-5, which is the
      obvious reading of the geometry and is wrong; the column is the run, not the block.
      What that leaves open is only whether yellow bar n names uplink n. Six bars and six uplinks
      both numbered 0 to 5 makes it the natural reading, and it is not separately confirmed.
  uplink-leds:
    confidence: measured
    note: >-
      measured, and this is what makes the guide's sentence come out right at last. "Each QSFP28
      port has four LEDs that indicate valid links" (agr110-qsg/doc.md:174) needs twenty-four
      lamps, and twenty-four is exactly what is there - FOUR IN A ROW ABOVE EACH YELLOW LABEL BAR,
      three hundred millimetres from the cages they belong to.
      Two earlier drafts failed on this because both looked for the lamps at the ports. The first
      drew one per port in the block's bezel; the second found four marks per column in each of
      the block's two dividers, could not make sixteen divide by six, and recorded the
      contradiction as a gap. Neither considered that a port's lamps might not be beside it. A
      reader of the render, working from better photographs, saw that each bar has four lamps over
      it and that the bars number the uplinks - which resolves the lamp count, the bar content and
      the uplink numbering in one reading.
      THE LAMPS ARE RECTANGULAR, not round, and they sit lower than a first pass drew them. Both
      corrected from a reader looking at the hardware, and both then checked: running the four
      known lamp x-positions as a comb down the panel in quarter-millimetre bands, the contrast
      peaks at y 31.05-31.55 and is gone by 31.8, so the row centres at 31.3 and the lens is about
      a millimetre tall. They are common/led-rect@1. The yellow bars were 0.4 mm high too - the
      saturated-yellow rows read 32.80 to 35.83, not 32.40 - which is what left them looking
      crowded under the port numerals.
      EACH BAR PRINTS ITS UPLINK NUMBER, 0 to 5, centred. Drawn, and pointed at the four lane lamps
      above it rather than at the uplink itself: L14 is an error, not a warning, and it is right
      that a numeral 220 mm from its cage is not beside what it names. The lamps ARE beside it and
      they carry `for: uplink-n`, so the chain from uplink to lamps to label holds and every mark
      sits next to the thing it annotates.
      THE FOUR ARE CENTRED ON THEIR BAR, and getting that wrong is a lesson about the fit rather
      than the face. The first comb searched pitch AND phase freely over each bar and settled on a
      5.83 mm pitch with the group sliding right, so the fourth lamp hung off the bar's right
      edge - a reader saw it immediately. Re-fitting with the group CONSTRAINED to the bar's
      centre and only the pitch free gives 4.74 to 4.96 across the six, mean 4.88, and the modelled
      4.90 puts the outer lamps 7.35 mm either side of centre with 0.3 mm of metal between
      neighbours. A free parameter the geometry did not need is a free parameter that absorbs the
      error somewhere you are not looking.
      The same trap caught uplink 2's and 5's lamps on the seventh bar: an unconstrained two-lamp
      fit put one at 360.10, which is the QSFP bracket's bright left edge rather than a lamp.
      Confined to the bar's clear span - it runs to 363.58 but the bracket starts at 359.40 - they
      read 348.17 and 354.07, a 5.90 mm gap.
      Positions by a four-lamp comb fit per bar: pitch 5.70 to 5.97 mm, mean 5.83, first lamp
      about 3.4 mm inside the bar's left edge; row centred 31.4 mm, between the port numerals
      above and the bar below. States from the guide: 1 green 100G, 1 blue 40G, 1-4 amber 25G
      breakout, 1-4 purple 10G breakout - the count lit IS the lane count, which is why a bar's
      worth of lamps is per uplink and not per SFP+ port.
      THE BLOCK'S OWN BEZEL IS NOT FOUR LAMPS EITHER. Its four marks per column read, outside in,
      as an up arrow, the upper port's lamp, the lower port's lamp and a down arrow - the same
      `(up)(down)` row idiom the SFP+ numerals use, and the outer two are silkscreen rather than
      lit. So the bezel carries one status lamp per uplink and the lane lamps live over the bars.
      THE BRACKET CARRIES THE UPLINK LABELS AND A PHOTOGRAPH READS THEM: `2 (right-arrow)` at its
      left end, `0 (up)(down) 1` over the left column, `3 (up)(down) 4` over the right, and
      `(left-arrow) 5` at its right end. The two arrow-headed labels point INTO the bottom row's
      cages, which is how the face says that uplink 2 is the bottom-left cage and uplink 5 the
      bottom-right - the same thing the column-major reading says, printed on the metal. They are
      drawn.
      EACH LANE LAMP CARRIES ITS LANE NUMBER, 0 to 3, printed on the lens. Legible in a close
      photograph and not drawn here, for the reason the system-LED legends are not drawn on their
      lenses either: the renderer paints a placement over its own silkscreen, so ink at the lamp's
      centre is ink nobody sees, and L21 says so. There is no room above (the port numerals sit
      0.8 mm clear) or below (the label bar). Recorded rather than moved somewhere the device does
      not print it.
      WHICH LAMP BELONGS TO WHICH PORT IS ALSO READ: "LED for 0,1,3,4 are on the space between
      those ports with a single arrow up and single arrow down. The LED for port 2 and 5 on the
      small group of 2." So the upper bezel's two lamps per column serve that column's FIRST TWO
      uplinks - 0 and 1 on the left, 3 and 4 on the right - and the bottom pair's lamps are on the
      bottom pair's own group, not in a divider above them.
      UPLINK 2'S AND 5'S STATUS LAMPS ARE ABOVE THE SEVENTH YELLOW BAR - the wide one at 345.32
      that sits right of the USB and belongs to no uplink of its own. A reader placed them there
      and the figure agrees: two marks, 0.77 mm wide, at 351.93 and 354.12 mm in the same lamp row
      as every other. That is what the seventh bar is FOR, which nothing in either document says
      and which three drafts recorded as an unexplained extra strip. All six uplinks now have a
      status lamp: 0 and 1 in the left column's bezel, 3 and 4 in the right column's, 2 and 5 over
      the seventh bar.
      The `2 (right-arrow)` and `(left-arrow) 5` labels are on the bracket's LOWER section, on its
      legs either side of the bottom pair, not on the horizontal bar with the other four.
  yellow-label-strips:
    confidence: measured
    note: >-
      measured, and NOT MODELLED IN THE FIRST DRAFT, which called them datasheet callout
      highlighting and left them off the panel. They are device art. The proof is that they
      appear in agr110-qsg's page-1 elevation, which carries no callouts at all: yellow blocks
      at 138.1, 167.7, 197.8, 227.4, 257.1 and 286.8 mm, 21.2 wide on a 29.7 pitch, plus a
      wider one at 346.5-408.0. The datasheet resolves each block into a PAIR of strips and
      agrees on every position to about a millimetre.
      What misled the first pass was that there are TWO yellows in that figure. The label
      strips are saturated - about (235,235,40) - and sit in a band 3.0 mm tall; the datasheet's
      callout fill is pale and translucent and runs straight through the QSFP openings, which
      is what a device feature cannot do. Filtering on saturation separates them cleanly, and
      the pale band is still not drawn.
      THE QSFP BAR IS A BRACKET, NOT A BAR. It wraps the bottom pair of QSFP28 ports on three
      sides: a horizontal band 48.6 mm wide at y 28.89-31.80, with a leg down each end - 5.2 mm
      wide at 359.40 and 4.7 at 403.30, both running 4.0 mm below the band. Read row by row in
      agr110-datasheet/fig-0009 and confirmed in agr110-qsg's callout-free page-1 art, which shows
      the same legs. A first pass drew it as a plain rectangle and missed the wrap; a reader of
      the render caught that too.
      Note what is NOT drawn from the same region: a 0.8 mm-wide closed yellow rectangle runs
      around the whole QSFP block from y 26 to 41.9 in the datasheet figure and appears nowhere in
      the quick-start's art. Uniform hairline width, closed on all four sides, present in only the
      document that has callouts - that is callout 2's box, and it is highlighting.
      WHAT THE BARS ARE: the QSFP28 uplink port labels, one per uplink, numbered 0 to 5, each
      with that uplink's four lane lamps in a row directly above it. See `uplink-numbering` and
      `uplink-leds`. This was open for three drafts - first dismissed as datasheet highlighting,
      then modelled as unexplained yellow rectangles with their meaning gapped - and what settled
      it was a reader with better photographs noticing the four lamps above each bar. The pattern
      the earlier drafts kept circling and could not close, six labels for six of something, was
      six uplinks all along.
      SIX BARS, NOT TWELVE STRIPS. A first pass read each one as a PAIR of ~10 mm strips with a
      1.2 mm gap, because the colour run breaks in the middle - and what breaks it is the small
      dark glyph printed at the bar's centre, not metal. Seen at 1.5x beside the reference the
      bars are plainly continuous. That is the same trap as measuring a drawing rather than a
      feature: the detector found an absence of yellow and the absence was ink.
      So: six bars about 21.0 mm wide at 134.87, 164.73, 194.59, 224.45, 254.31 and 284.61 mm,
      band y 32.40-35.40, on a 29.87 mm pitch, each sitting under exactly two port columns; a
      seventh, 18.3 mm wide, at 345.32 in the same band, which carries no glyph; and an eighth at
      363.80, 40.2 mm wide, in a HIGHER band at 28.80-31.80, which is the bar running between the
      QSFP block's second and third rows. WHAT THE GLYPHS SAY IS NOT READ - see gaps.
  usb:
    confidence: measured
    note: >-
      measured - one USB-A storage port at 319.0 to 331.6 mm, 12.6 mm of opening against
      std/usb-a@1's 12.0, in the band at 32.9 to 37.4. Callout 5 names it "USB storage port"
      and the specification list says "1 x USB (storage)".
      THE MARK IS PRINTED UPSIDE DOWN RELATIVE TO THE LIBRARY'S DEFAULT, and it took a
      measurement to say so rather than an opinion, because this repository's rule is never to
      reason about a flip in prose. Split the symbol at its own shaft and measure how far each
      arm's terminal reaches to the right: on this device the LOWER arm reaches 316.33 mm and the
      upper 315.45, so the lower is 0.88 mm further right. common/usb-symbol@1's default skin has
      it the other way round - its square-tipped upper arm ends at 5.05 of 6.4 against the
      round-tipped lower arm's 4.47, 0.58 mm further right. Opposite, therefore mirrored about
      the shaft. The same measurement re-run against this device's own render agrees with the
      figure to 0.2 mm.
      It is drawn with `rotate: 180` AND `mirror: true`, which compose to a vertical flip - the
      turn takes (x,y) to (-x,-y) and the horizontal mirror takes x back, leaving (x,-y). The
      obvious alternative was a second skin on the shared component, and it was written and then
      reverted: adding a skin bumps common/usb-symbol@1 to 1.1.0, and the lockfile then demands a
      patch bump on the TEN other devices that compose it, none of which this change touches or
      improves. A per-device flip of a symmetric mark belongs on the placement.
      THE TRIDENT IS A COMPONENT, NOT A MARK. A first draft printed it with the silkscreen
      `mark: usb` primitive, which is an arrow-like glyph and reads as neither a trident nor
      anything else; every other device in this library that prints one places
      common/usb-symbol@1 (cor580, as5912-54x, s6301-56stp, r740xd), and this was the only
      user of that mark in the tree. It is now that component, at 311.10 - the figure puts the
      printed trident at 310.9 to 317.7, immediately left of the opening.
      THE OPENING IS IN THE VENT BAND, NOT ABOVE IT, and two drafts put it too high. The port was
      first placed at y 32.20 and then at 33.15, both times from reading a crop by eye. Measured
      properly - the USB column differenced against plain chassis at x 62-120, which carries
      neither a yellow bar nor a system lamp - the shell reads BRIGHTER than the panel from 36.39
      to 40.42 and matches it again below 41.76. So the opening is at 36.40, about 3.5 mm lower
      than drawn, and its own silkscreen trident is NOT in line with it: that mark reads 31.91 to
      34.48, centred 33.2, sitting in the band above. A reader of the render saw the offset before
      the measurement did.
      AND THE HONEYCOMB RUNS UNDER IT. The same differencing shows the vent field resuming below
      41.76 in the USB's own columns, so the field is not broken by the port - it is NOTCHED. It
      is three decor rectangles: the band either side at 13.8-318.5 and 332.5-363.5, and a third
      under the opening at 318.5-332.5 from 41.3 down. An earlier draft drew a clean break all the
      way to the panel edge, which is a straight-sided hole the metal does not have.
  vents:
    confidence: measured
    note: >-
      measured, and drawn as hexagonal honeycomb because that is what the figure shows at 9.1
      px/mm - a staggered hex lattice, legible in the quick-start's section 6 zoom as whole
      hexagons. Three fields: a tall column at the left-hand end from 1.6 to 13.0 mm running
      3.5 to 40.5; a single band along the bottom from 13.8 to 363.5 mm at 36.6 to 42.2, which
      stops where the QSFP block starts; and a column at the right-hand end from 425.5 to 437.0.
      The right-hand column runs nearly the full panel height where the left one does not,
      because the left one gives way to the port block's first bezel.
  rear-layout:
    confidence: measured
    note: >-
      measured - PSU, six fan trays, PSU, with a grounding point outboard of each supply. THE FANS
      WERE MEASURED FROM THEIR HANDLES, by colour: the six red pull bars isolate cleanly against a
      black chassis and read at 96.56, 145.00, 193.66, 242.27, 290.88 and 340.20 mm, a pitch of
      48.44 / 48.66 / 48.61 / 48.61 / 49.32 - mean 48.73, spread 0.88 over five gaps, which is an
      evenly spaced row and not a staggered one. Handle width 37.0, handle centreline 30.51 mm
      down the face. Fitted centres are 96.36 + 48.73n. common/fan-module-46@1 is 46.6 x 40.0 and
      fits that pitch with a 2.1 mm divider between trays, which is where the numerals are
      printed. Fan trays are numbered 0 to 5 LEFT TO RIGHT with each numeral on the divider to the
      RIGHT of the tray it names - so the first numeral lands at 119.6 mm, between trays 0 and 1,
      which is what the figure shows and the same convention dcs510 uses. Each tray prints F2B on
      its own faceplate at its lower right; that is module art rather than chassis silkscreen and
      common/fan-module-46@1's skin already draws it, which the render confirms.
      THE BAY POSITIONS WERE NOT TAKEN FROM THE HANDLE CENTRES. A first pass put the bays at
      handle-centre minus half the tray, which assumes the component draws its handle exactly
      centred, and the render came out 1.1 mm right of the reference all along the row. The fix
      was to measure THE SAME FEATURE IN BOTH IMAGES: isolate the red pull bars by colour in the
      datasheet figure and in a rasterisation of this device's own rear view at the same px/mm,
      and difference them. That gave bay lefts of 71.99 + 48.68n, and re-rendered the six bars now
      land within 0.33 mm of the reference's across the whole row. The same method fixed both
      supplies, using the bright handle bar on the PSU face rather than the latch, because the real
      latch is 1.7 mm wider than the component's and a wider feature's edge is not a datum.
  rear-power:
    confidence: measured
    note: >-
      measured - two bays, PS0 at the left and PS1 at the right, each 54.0 x 40.0 on a measured
      opening of about 55 mm. The right-hand supply's face reads 368.5 to 423.5 mm; the left-hand
      one is its mirror about the panel centre and reads 14 to 69. THE PART IS REUSED, not rebuilt:
      common/psu-ac-650@3 is declared in its own provenance to be "a `common/` generic standing
      for the 650 W CRPS supply across three Edgecore chassis", and this is a fourth of the same
      generation. Three things corroborate it. The measured face is 54 to 55 mm wide against the
      generic's 54.0. The face arrangement matches - release latch at the left, bail handle, EMI
      grille, then the inlet - which is what the figure shows at 9.1 px/mm. And the input rating
      is the same number the generic cites for its other chassis: this quick-start says
      "100-240 VAC, 50-60 Hz, 6 A maximum" (agr110-qsg/doc.md) where the DCS204 datasheet says
      "100-240 VAC at 50-60 Hz (6A/650 W max.)". NOTE WHAT WAS NOT REUSED: the edgecore/agr-*
      components - agr-psu-ac, agr-psu-dc, agr-fan - are the AS7946 generation's parts and are
      2RU geometry, 60.1 x 37.6 and 69.4 x 69.4. They share this device's product-line prefix and
      nothing else, and a name is not a fit.
  rear-grounding:
    confidence: drawing
    note: >-
      drawing - callout 7 of agr110-datasheet/fig-0009 names a grounding screw and points to a
      round opening at the lower left of the rear face, at about 7.9 mm. A second point sits at
      the right-hand end, outboard of PS1 at 424.7 to 436.7 mm: a light plate carrying TWO holes
      one above the other, which is what the quick-start's own packing list implies -
      "Grounding kit - One grounding lug, 2 M5 screws and 2 washers (for AC model)" is a two-hole
      lug. The two are drawn alike with common/ground-lug@1 and they do not look alike in the
      figure; that difference is recorded as a gap rather than resolved by choosing.
  power:
    confidence: datasheet
    note: >-
      datasheet and quick-start together. The BOX figure is "Power Consumption - 450 Watts
      maximum" (agr110-qsg/doc.md), unqualified as to scope, so it is recorded as power-max-w
      with power-envelope unstated. Input ratings are the quick-start's: AC "100-240 VAC, 50-60
      Hz, 6 A maximum", DC "-36 - -72 VDC, 28-14 A"; the datasheet gives the ranges without the
      currents. NO PER-MODULE POWER IS PUBLISHED. Searched both documents for the field name
      rather than the part number - "Power", "Consumption", "Watt", "PSU" - and neither states an
      output rating for a supply or a draw for a fan tray, which is the same silence the AS7946
      parts found across the same vendor's corpus. common/psu-ac-650@3 carries its own 650 W
      output from the chassis that do state it; the fan trays carry nothing and L27 stands on
      them, which is the record that the figure is missing rather than guessed.
  airflow:
    confidence: datasheet
    note: >-
      datasheet - EVERY ordering code published for this model ends in -F: 5916-54XL-O-AC-F and
      its regional variants, 5916-54XL-O-48V-F, and the -OT- extended-temperature pairs. So only
      front-to-back SKUs are listed, and the trays in the figure print F2B. The quick-start
      describes both directions in general terms - "All installed modules must have a front-to-back
      (F2B) airflow direction, or all modules must have a back-to-front (B2F) airflow direction" -
      but that is the family's caution, not an ordering code, and no B2F part number appears.
      Configurations here are therefore ac and dc, both front-to-back, and the absence of a B2F
      SKU is stated rather than assumed away.
