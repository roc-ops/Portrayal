configurations:
  ac:
    kind: base
    default: true
    description: >-
      Two 650 W AC supplies and six fan trays, front-to-back. This is a fixed 1RU router, so the base
      configuration is the box as it is bought - supplies and fans populated, cages empty.
    part-numbers:
      5916-54XL-O-AC-F-US: {part: FP1ZZ5654430A, power-cord: N. America}
      5916-54XL-O-AC-F-EU: {part: FP1ZZ5654230A, power-cord: EU}
      5916-54XL-O-AC-F-UK: {part: FP1ZZ5654330A, power-cord: UK}
      5916-54XL-O-AC-F-JP: {part: FP1ZZ5654534A, power-cord: JP}
      5916-54XL-O-AC-F-UN: {part: FP1ZZ56540BJA, power-cord: C13-C14}
      5916-54XL-O-AC-F: {part: FP1ZZ56540BGA, power-cord: none listed}
      5916-54XL-OT-AC-F-US: {part: FP1ZZ5654431A, power-cord: N. America}
      5916-54XL-OT-AC-F-EU: {part: FP1ZZ5654231A, power-cord: EU}
      5916-54XL-OT-AC-F-UK: {part: FP1ZZ5654331A, power-cord: UK}
      5916-54XL-OT-AC-F-JP: {part: FP1ZZ5654535A, power-cord: JP}
      5916-54XL-OT-AC-F-UN: {part: FP1ZZ56540BMA, power-cord: C13-C14}
    bays: {psu-0: common/psu-ac-650@3, psu-1: common/psu-ac-650@3}
  dc:
    kind: orderable
    description: >-
      Two -48 VDC supplies, otherwise the base box. The quick-start's DC procedure calls for #10 AWG wire
      and the grounding kit's ring lugs, and the datasheet's input range is -36 to -72 VDC.
    part-numbers:
      5916-54XL-O-48V-F: {part: FP1ZZ56540BEA}
    bays: {psu-0: common/psu-dc-650@2, psu-1: common/psu-dc-650@2}
