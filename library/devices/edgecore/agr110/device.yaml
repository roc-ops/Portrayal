chassis: {width: 438.4, height: 44.0, depth: 501.9, ru: 1, weight-kg: 9.7, color: '#2b2f33', airflow: front-to-back}
gaps:
- what: chassis-dimensions
  scope:
  - front
  - rear
  - top
  - bottom
  - left
  - right
  reason: sources-disagree
  wanted: >-
    agr110-datasheet/doc.md:109 states 438.4 x 501.9 x 44 mm and agr110-qsg's hardware specification states
    435 x 515 x 43.84 mm. All three axes differ and the depth differs by 13 mm, which is not rounding.
    The datasheet is modelled, for the reasons in provenance - the sibling's datasheet states the same
    triple independently, 438.4 is the body width this vendor's 1RU line uses, and the figure's own aspect
    prefers it - but the quick-start is not wrong for being outvoted, and the same conflict stands unresolved
    on agr130, which shares that quick-start. A tape measure on a real unit settles it in one minute.
- what: qsfp-port-numbering
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    The six QSFP28 ports are numbered 48 to 53 here on the strength of the vendor's zero-based scheme,
    not on a reading. No figure held resolves their numerals: the quick-start's section 6 zoom crops that
    end of the faceplate away and the datasheet render prints the band under its own callout highlighting.
    Which column is the lower number, and whether the separate bottom row continues the sequence or precedes
    it, need a straight-on photograph of the right-hand end of the front panel.
- what: qsfp-lamp-count
  scope:
  - front
  reason: needs-photo
  wanted: >-
    The bezel between the upper QSFP block's two rows carries FOUR marks per column where the SFP+ bezel
    carries two. That is either two lamps per port or a four-lane column serving one of them, and 9.1
    px/mm cannot separate those. One lamp per port is drawn; the other two marks per column are not. A
    photograph of one QSFP shell at better than 9 px/mm settles it.
- what: system-led-legend-placement
  scope:
  - front
  reason: needs-photo
  wanted: >-
    The quick-start's section 6 zoom draws PS0, PS1, Diag, Fan and Loc as text INSIDE a light rectangle,
    which reads as a legend printed on the lens rather than beside it - unlike Reset, two centimetres
    away on the same band, which is plain white text on the chassis. It is drawn here as a lamp with its
    legend over it. Whether the real part prints on the lens or beside it is a bench photograph.
- what: management-port-legend
  scope:
  - front
  reason: needs-photo
  wanted: >-
    THERE IS PRINTING UNDER THE MANAGEMENT JACKS AND IT CANNOT BE READ. Three lines of it sit between
    the ganged RJ-45 bezel and the bottom edge, roughly 401 to 420 mm across and 28 to 34 down - a short
    mark above, two short words side by side, and a longer word beneath - measured as bright runs at 401.32-408.87,
    410.73-411.93, 412.48-413.68 and 417.29-420.24 mm. At 9.1 px/mm none of it resolves, and the quick-start's
    section 6 zoom, which is the only image that resolves printing on this face, crops this end of the
    faceplate away. A first draft printed "Mgmt (up)(down) Console" here, carried over from dcs510's faceplate
    idiom rather than read off this one. That was removed: this is not a negative reading - the ink is
    plainly there and its extent is measured - it is an unreadable one, and inventing the words would
    have put text on the model that nobody has seen on the device. THE TEXT WAS SEARCHED BEFORE GIVING
    UP ON THE PIXELS, and it did not answer. Both documents were read for LED and port legends: the guide
    yields the system-LED names, the SFP+ lamp colours and the sentence that each QSFP28 port has four
    lamps, and the datasheet yields the callout list - and none of them names anything printed under the
    management jacks. Rendering the page at 1600 dpi does not help either, because the figure is a raster
    at its own limited resolution and upscaling it recovers nothing. A straight-on photograph of the right-hand
    40 mm of the front panel settles it.
- what: yellow-label-strip-content
  scope:
  - front
  reason: needs-photo
  wanted: >-
    FOURTEEN YELLOW LABEL STRIPS ARE DRAWN AND NOBODY KNOWS WHAT THEY SAY. Their positions are measured
    and corroborated between the datasheet elevation and the quick-start's page-1 art, and each carries
    small dark printing that neither document resolves - the datasheet figure is a raster at its own limited
    resolution, so rendering its page at 1600 dpi recovers nothing beyond the 600 dpi read. What is known
    about the pattern: six evenly spaced bars from 134.9 to 305.6 mm, each about 21 mm wide with ONE small
    glyph at its centre, each sitting under exactly two port columns, on a 29.87 mm pitch - so the six
    cover all eight columns of the second SFP+ block and the first four of the third. The run then stops
    where the USB port interrupts the band, and resumes as a single wider strip at 345.3. A fourteenth
    sits higher, between the QSFP block's second and third rows. The first block of ports carries none,
    because the system LEDs and the Reset pinhole occupy that band. A reader of the rendered viewer reports
    they look like they read 0, 1, 2, 3, 4 and 5, which would make six labels for six things - and this
    device has exactly six QSFP28 ports. That is a hypothesis and it is written down as one; six bars
    under the SFP+ cages would be an odd place to number the QSFP ports, and nothing held confirms or
    refutes it. THE DOCUMENTS WERE SEARCHED AND THEY DO NOT SAY. Not "not in the one I looked in": the
    whole staged Edgecore corpus, 72 converted documents, was searched for `yellow`, `port group`, `group`,
    `label`, `marking`, `breakout` and `colour-coded`. This model's datasheet returns nothing for any
    of them, its quick start guide returns only the lamp colours, and NO HARDWARE INSTALLATION GUIDE EXISTS
    FOR IT - none is staged for any Edgecore model, and the intake's own handoff note puts the full install
    guides behind support.edge-core.com. ONE LEAD, FROM A DIFFERENT MODEL. The DCS203 (AS7326-56X) quick
    start guide is the only document in the corpus that uses the phrase: "All SFP28 ports (1-48) in the
    same port group must be set to the same speed (25G or 10G)", followed by twelve groups of four (dcs203-qsg/doc.md:161-177).
    So this vendor does mark four-port speed groups on a 48-port 1RU faceplate, and each bar here does
    span exactly two columns, which is four ports. But the counts do not line up - twelve groups there,
    six bars here - and the bars cover only the second SFP+ block and half the third, leaving the first
    block and the last four columns unmarked. It is a lead and it is recorded as one, not as the answer.
    What settles it: a straight-on photograph of the faceplate between 130 and 310 mm, or the AS5916-54XL
    installation guide from support.edge-core.com.
- what: qsfp-lamp-assignment
  scope:
  - front
  reason: sources-disagree
  wanted: >-
    THE GUIDE SAYS FOUR LAMPS PER QSFP28 PORT AND THE ARTWORK SHOWS SIXTEEN MARKS FOR SIX PORTS. "Each
    QSFP28 port has four LEDs" (agr110-qsg/doc.md:174) needs twenty-four. The figure shows four marks
    per column in the white bezel between rows 1 and 2, and about four more per column on the yellow bracket
    between rows 2 and 3 - sixteen, which divides by six at no consistent per-port count. Drawn: the white
    bezel's eight, as two clusters of four, each belonging to both ports of its column, because which
    lamp serves which of the two the divider sits between is not resolved. Not drawn: the bracket's marks,
    measured at 371.29, 373.69, 376.32 and 378.07 mm for the left column and 391.19, 394.69 and 397.81
    for the right - three resolved there, the fourth lost in the bracket's own edge. They are 0.8 to 1.6
    mm wide and as little as 1.1 mm apart, which is narrower and closer than the library's smallest lamp
    at 2.0 mm, so drawing them punched overlapping openings. A reader of the render reports these as the
    lamps for the bottom pair of ports, which is plausible and is not what the drawing proves. Three questions,
    one photograph: how many lamps each QSFP28 port really has, which divider serves which port, and whether
    the bracket's marks are lamps at all rather than printing on the label. A straight-on shot of the
    right-hand 50 mm of the faceplate answers all three.
- what: rear-grounding-points
  scope:
  - rear
  reason: needs-photo
  wanted: >-
    The two grounding points do not look alike. Callout 7 points to a single round opening at the lower
    left, about 7.9 mm; the right-hand end carries a light plate with two holes one above the other, 424.7
    to 436.7 mm, which matches the quick-start's "One grounding lug, 2 M5 screws" kit. Both are drawn
    with common/ground-lug@1. Whether the left-hand one is a second lug pad, a single bonding screw, or
    something else is a photograph of the rear left corner.
groups:
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp-plus, speed: 10g}
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
  port-leds: {term: LED, role: indicator, index-origin: 0}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster - the out-of-band 100/1000BASE-T RJ-45 and the RS-232 console share one ganged
      bezel at the right-hand end of the faceplate, and the USB-A storage port sits apart from them in
      the silkscreen band. Three media, one job: reaching and disciplining the box rather than carrying
      its traffic. The Reset button is counted here for the same reason.
  leds: {term: LED, role: indicator, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 0
    attrs: {redundancy: 1+1, redundancy-note: '2 redundant, load-sharing, hot-swappable AC or -48 VDC'}
  fans:
    term: Fan
    role: service
    index-origin: 0
    attrs: {redundancy: 5+1, redundancy-note: hot-swappable 5+1 redundant fan modules}
  grounding: {term: Point, role: furniture, index-origin: 1}
  furniture: {term: Item, role: furniture, index-origin: 1}
