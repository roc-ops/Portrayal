configurations:
  ac:
    kind: base
    default: true
    description: >-
      Two 650 W AC supplies and six fan trays, front-to-back. This is a fixed 1RU router, so the base
      configuration is the box as it is bought - supplies and fans populated, cages empty.
    part-numbers:
      5916-54XL-O-AC-F-US: {power-cord: N. America}
      5916-54XL-O-AC-F-EU: {power-cord: EU}
      5916-54XL-O-AC-F-UK: {power-cord: UK}
      5916-54XL-O-AC-F-JP: {power-cord: JP}
      5916-54XL-O-AC-F-UN: {power-cord: unterminated}
      5916-54XL-O-AC-F: {power-cord: none listed}
    bays: {psu-0: common/psu-ac-650@3, psu-1: common/psu-ac-650@3}
  dc:
    kind: orderable
    description: >-
      Two -48 VDC supplies, otherwise the base box. The quick-start's DC procedure calls for #10 AWG wire
      and the grounding kit's ring lugs, and the datasheet's input range is -36 to -72 VDC.
    part-numbers:
      5916-54XL-O-48V-F: {}
    bays: {psu-0: common/psu-dc-650@2, psu-1: common/psu-dc-650@2}
