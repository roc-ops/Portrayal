  rear:
    size: {w: 440.0, h: 44.0}
    empty: >-
      Not drawn by any staged source. Neither document pictures this face. The quick start's grounding
      step does show the lug - a two-hole lug with the earth symbol beside it - but places it on the SIDE
      panel near the rear, and a three-quarter view of a corner fixes no coordinate, so nothing is placed
      here.
  top:
    size: {w: 440.0, h: 240.0}
    empty: >-
      Not drawn by any staged source. On a passively cooled box the lid is a cooling surface and the datasheet
      asks for 1 m/s of external airflow "at any point on the product surface", so what is on it matters
      - and no figure shows it.
  bottom:
    size: {w: 440.0, h: 240.0}
    empty: >-
      Not drawn by any staged source, so the mounting pattern and feet are unknown rather than assumed
      from a 1RU convention.
  left:
    size: {w: 240.0, h: 44.0}
    empty: >-
      Not drawn by any staged source, and this is where the grounding lug is - the quick start's step
      3 puts it on a side panel near the rear without saying which side or where. An airflow face on a
      box with no fans.
  right:
    size: {w: 240.0, h: 44.0}
    empty: >-
      Not drawn by any staged source. The other airflow face, and the other candidate for the grounding
      lug the quick start ships but does not locate.
configurations:
  dc:
    kind: base
    default: true
    description: >-
      The only published configuration. Two fixed load-sharing -48 VDC supplies, no fans at all, filter
      slot blanked. The datasheet's ordering section lists the base model and no variants, so there is
      one row and it carries no part number.
    part-numbers:
      AS5915-16X: {}
    bays: {filter-slot: edgecore/filter-slot-5915-16x@1}
