format: 1
kind: device
name: csr180
version: 1.0.4
maturity: modelled
manufacturer: Edgecore
model: AS5915-16X
portfolio: {line: Service Provider, family: Cell Site Router, series: CSR180}
description: >-
  4x 10G SFP+, 8x 1G SFP and 4x 1G RJ-45 fanless cell site gateway, sold as the CSR180, Broadcom BCM88273
  Qumran-UX with an Intel Atom C3308 and a Stratum 3E OCXO. The CSR200's shell with no fans in it: passively
  cooled behind a honeycombed faceplate, needing at least 1 m/s of external airflow, with no FAN lamp
  and no BITS port. Ports number from 1; all timing, management and power connections are on the front,
  and the two DC supplies are fixed.
profile: networking
lint:
  waive:
    L61: >-
      Ten marks are printed BESIDE the part they name rather than centred on it, and all ten are measured
      positions on this face. SIX ARE THE COAX LEGENDS, as on edgecore/csr200 and for the same reason:
      each timing pair prints `IN  OUT` on one baseline with `1PPS` or `10MHz` under it, and the legend
      is centred on the PAIR while the rule measures each word against the single jack it names. Moving
      them onto the jack centres would put the legend across the jacks. TWO ARE `Input-`, 0.7 and 1.0
      mm right of their block's centre, and that is where the metal puts them: common/dc-terminal-24@1's
      three poles sit about 0.9 mm right of the body centre - an asymmetry measured on all four blocks
      across both devices and recorded on the part - so a label centred on its POLE is necessarily off-centre
      against the BODY. The rule compares it with the body. TWO ARE RJ-45 NUMERAL GROUPS, centred on their
      metal cell while the rule compares them with the 8P8C bore, which is not centred in a rj45-ganged
      cell.
provenance:
  stack-orientation:
    confidence: drawing
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the upper cage
      upright (rotate 0) over the lower turned 180, so both cage lips face the band between the two cages
      and both bails face outward. Decided by the port lamps, which point up over down: the 6 SFP pairs
      (port-1/port-2 to port-11/port-12).
  sources:
    confidence: datasheet
    note: >-
      Two documents, both staged and both docling-converted, MEASURED OFF THE PDF PAGE RATHER THAN THE
      CONVERTED FIGURES. csr180-datasheet (the CSR180 / AS5915-16X data sheet) carries the specification
      list, the ordering line, the eleven-callout front elevation on page 2, and the passive-cooling paragraph.
      csr180-qsg is the AS5915-16X quick start guide; it has NO front elevation at all - its only hardware
      art is the grounding step, which is where the side-panel lug comes from.
  figure-choice:
    confidence: measured
    note: >-
      Gate 1. Page 2 rendered at 600 dpi; panel found by row/column darkness at (364,1199)-(4600,1628),
      4237 x 430 px, aspect 9.8535 against 10.0 for 440/44 - 1.47 percent out, which is BETTER than the
      CSR200's 1.86 and is not the point. See the `figure-fidelity` gap: the aspect passes and the art
      still will not carry a dimension, which is a case docs/modelling-a-device.md's four-percent rule
      does not cover. Positions it does carry, and positions are what is taken. THE QUICK START HAS NO
      ELEVATION. Its only hardware drawing is step 3's grounding illustration, a three-quarter view of
      the rear corner. That is the source for the lug being on the side panel and for nothing else.
  chassis:
    confidence: datasheet
    note: >-
      datasheet - "Dimensions (WxDxH): 440 x 240 x 44 mm (17.32 x 9.45 x 1.73 in)" and "Weight: 3.8 kg
      (8.38 lb), with two installed PSUs", both identical to the CSR200's. The quick start does not restate
      them. 440 is the body width: "Installations to standard 19", 21" and 23" rack" makes the brackets
      an accessory outside it.
  cooling:
    confidence: datasheet
    note: >-
      THIS BOX HAS NO FANS AND THAT IS WHY THE FACEPLATE LOOKS LIKE THIS. The datasheet calls the AS5915-16X
      a fanless, passively cooled platform and asks that it be deployed in external airflow, front-to-back
      or back-to-front, of at least 1 m/s measured at any point on the product surface. So `airflow: passive`
      rather than a direction - the datasheet names both directions as acceptable and neither as the product's
      - and the front plate is honeycombed edge to edge where the CSR200's is solid with perforated columns.
      It is also why there is no FAN lamp: five system lamps are printed, LOC DIAG PSU1 PSU2 ALARM, with
      the CSR200's FAN position simply empty.
  panel-layout:
    confidence: photo-measured
    note: >-
      EVERY NUMBER BELOW IS A POSITION, AND EVERY STANDARD SIZE IS A REGISTRY LOOKUP. That division is
      forced by the figure - see `figure-fidelity` in gaps - and it is the division docs/modelling-a-device.md
      already draws for ganged pitch, applied to the rest of the face for the same reason. Read at 9.6295
      px/mm from crops at 19-44 px/mm with a millimetre rule burned in, because thresholds do not work
      on honeycomb: the two SFP+ shells centre on 180.85 and 209.50, the SFP block on 261.30, the RJ-45
      block on 312.10, the two management stacks on 356.80 and 378.35, the four coax jacks on 239.11/253.96/268.71/283.51,
      the five system lamps on 191.30/198.50/206.00/213.10/227.20, and the USB on 152.50.
  optical-lamps:
    confidence: photo-measured
    note: >-
      Four lamps per optical column, as on the CSR200: `(down) (up) (down) (up)` in the bezel between
      the rows, two for the upper port and two for the lower. The SFP+ offsets inside a shell - 1.78/5.14/9.00/12.41
      - are measured here, on both shells, agreeing to 0.11 mm. THE SFP BLOCK'S ARE BORROWED from edgecore/csr200,
      whose figure resolves them on four columns to 0.06 mm where this one does not resolve them at all;
      the bezel is the same part and the two devices' SFP+ offsets agree to 0.25, which is what makes
      the borrow checkable rather than convenient.
attrs:
  performance: {switching-capacity: 32 Gbps, processing-rate: 125 Mpps}
  power: {power-envelope: unstated, power-input-dc: '36 V - 72 V, 6 A'}
  thermal: {airflow: passive (no internal fans; 1 m/s external airflow required), cooling: passive - no
      fans of any kind}
  environmental: {temperature-operating: -40 C to 65 C (-40 F to 149 F), temperature-storage: -40 C to
      70 C (-40 F to 158 F), humidity-operating: 5% to 95%, altitude: 5000 m at 40 C, temperature-operating-transceiver: -40
      C to 65 C}
  platform:
    asic: Broadcom BCM88273 Qumran-UX
    cpu: Intel Atom C3308, 2-core
    memory: DDR4 8 GB
    storage: 32 GB M.2 SSD
    oscillator: Stratum 3E compliant OCXO
    software: ONIE installer pre-loaded; Open Network Linux (ONL) compatible
  features: {marketing-name: CSR180, timing: IEEE 1588v2 and SyncE in hardware, timing-ports: 'ToD/1PPS
      (RJ-45), 1PPS I/O (SMB), 10MHz I/O (SMB)', optics-sfp-plus: '10GBASE-SR/LR/ER/ZR, 10G DAC/AOC',
    optics-sfp: 1000BASE-SX/LX/EX/ZX}
  management:
    mgmt-ports: 1x RJ-45 1000BASE-T management, 1x RJ-45 serial console, 1x USB 2.0 storage
  compliance:
    emissions: >-
      EN 300 386 V1.6.1, FCC 47 CFR Part 15 Subpart B Class A, CE, ICES-003 Issue 7 Class B, VCCI-CISPR32
      Class B, UKCA
    safety: CSA/IEC/EN 60950-1, CSA/IEC/EN 62368-1, BSMI
    rohs: RoHS, WEEE, REACH
  lifecycle: {eol: none-announced}
chassis: {width: 440.0, height: 44.0, depth: 240.0, ru: 1, weight-kg: 3.8, color: '#2b2f33', airflow: passive}
gaps:
- what: figure-fidelity
  scope:
  - front
  reason: sources-disagree
  wanted: >-
    A figure or drawing of this faceplate that can carry a dimension. THE ONE THAT EXISTS CANNOT, AND
    THE PROOF IS A STANDARD IT CONTRADICTS. Its SFP cage pitch reads 14.7-14.75 measured two ways - across
    the four cage bores and across the shell walls between them - against the SFF-8432 figure of 14.25
    that the registry carries and that the CSR200's figure reproduces at 14.22. Its RJ-45 cell pitch reads
    14.4 against a registry 13.97, the same three percent high. And its DC terminal blocks read about
    eleven percent SMALL against the sibling's. Nothing reconciles those with one scale. THE OBVIOUS EXPLANATION
    WAS TESTED AND FAILED. A perspective render would taper: panel height sampled along x is flat on both
    faces, 425-419 px across the CSR200 and 425-430 across this one, and the CSR180's absolute feature
    POSITIONS line up with the CSR200's to a millimetre or two over the whole 440. What is wrong is local
    scale, not geometry - the art is honeycomb dark-on-dark at low contrast and repeated careful reads
    of one feature wobble by 0.5 to 1 mm where the CSR200's repeat to 0.05. WHAT WAS DONE ABOUT IT: every
    standard part takes its size from the registry - SFP 14.25, RJ-45 13.97, USB-A, SMB - and the figure
    supplies POSITIONS and COUNTS only. That is the division docs/modelling-a-device.md already draws
    for ganged pitch, applied to the whole face. The two non-standard parts, common/dc-terminal-24@1 and
    edgecore/filter-slot-5915-16x@1, are sized from edge POSITIONS for the same reason, and each says
    so.
- what: management-stack-assignment
  scope:
  - front
  reason: needs-photo
  wanted: >-
    Which of the four stacked RJ-45 positions is which. The face carries two 1x2 stacks - four jacks -
    and the datasheet names only THREE non-traffic RJ-45s: the console (callout 4), the ToD/1PPS (callout
    10) and the management port (callout 11). There is no BITS port on this model, which is the CSR200's
    callout 4 and the reason that device has twelve callouts and this one eleven. The silkscreen under
    the left stack is a single lamp and legend where the CSR200 has two, and it is not legible at 9.63
    px/mm. So the fourth position is either blank or something unlisted, and the three that are named
    are placed here in the CSR200's order - console top right, management bottom right, ToD/1PPS bottom
    left - which is an INFERENCE FROM THE SIBLING, not a reading.
- what: rear-elevation
  scope:
  - rear
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A figure of any face but the front. Neither document draws one. The quick start's step 3 does picture
    the grounding point - a two-hole lug on the SIDE panel near the rear, with the earth symbol beside
    it - which is more than the CSR200's quick start gives, but a three-quarter view of a corner fixes
    no coordinate, so the lug is not placed. The side panels matter more here than on any other device
    in this family: this box is cooled by air someone else moves across it.
- what: led-vocabularies
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    An LED table. Neither document has one, and unlike the CSR200's quick start this one does not even
    state that the PSU lamps come up green. Five system lamps are legible - LOC, DIAG, PSU1, PSU2, ALARM
    - and every lamp here carries `off` and one green `on`, borrowed from edgecore/csr200 where a quick-start
    sentence supports it. Borrowed, and said to be.
- what: port-lamp-roles
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    Which of each optical port's two bezel lamps is link and which is activity - the same silence as on
    the CSR200, from the same vendor, about the same bezel.
- what: filter-accessory
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    Whether an air filter is sold for this model at all. The CSR200's datasheet lists two filter accessories
    with part numbers; this one's ordering section lists the base model and nothing else, yet the faceplate
    carries a filter slot and callout 5 calls it "Filter Slot (Optional)". So the bay is real, the cover
    is drawn, and what goes in it is unnamed by the vendor.
groups:
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp-plus, speed: 10g}
  sfp:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: sfp, speed: 1g}
  rj45:
    term: Port
    role: traffic
    index-origin: 1
    attrs: {media: rj45, speed: 1g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the synchronisation cluster - one RJ-45 carrying ToD/1PPS and four SMB coax jacks carrying 1PPS
      and 10 MHz in and out. Two media, one job: disciplining this box's clock and passing it on. There
      is no BITS jack on this model.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster - the 1000BASE-T RJ-45 and the RS-232 console, plus the USB-A storage port
      under the first SFP+ shell and the Reset button. Three media, one job.
  leds: {term: LED, role: indicator, index-origin: 1}
  power:
    term: Input
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: two load-sharing -48 VDC supplies, FIXED - not field-replaceable
  filter: {term: Filter, role: service, index-origin: 1}
  furniture: {term: Item, role: furniture, index-origin: 1}
