configurations:
  ac-f2b:
    kind: base
    default: true
    airflow: front-to-back
    description: >-
      Dual 1300 W AC PSUs (FRU FSH082-610G) and six fan trays (FRU
      AS9926-24D/24DB-FAN), front-to-back airflow. This is a fixed 1RU switch, so
      the base configuration is the box as it is bought - supplies and fans
      populated, cages empty. The AS9926-24DB rows are the same hardware with an
      ASPEED AST2600 BMC on the CPU module, which changes nothing on either face.
    part-numbers:
      AS9926-24D-O-AC-F: {part: FP5EC9524000Z, power-cord: none}
      AS9926-24D-O-AC-F-US: {part: FP5EC9524400Z, power-cord: N. America}
      AS9926-24D-O-AC-F-EU: {part: FP5EC9524200Z, power-cord: EU}
      AS9926-24D-O-AC-F-UK: {part: FP5EC9524300Z, power-cord: UK}
      AS9926-24D-O-AC-F-CN: {part: FP5EC9524700Z, power-cord: CN}
      AS9926-24D-O-AC-F-TW: {part: FP5EC9524T00Z, power-cord: TW}
      AS9926-24D-O-AC-F-JP: {part: FP5EC9524500Z, power-cord: JP}
      AS9926-24DB-O-AC-F: {part: FP5EC9524002Z, power-cord: none}
      AS9926-24DB-O-AC-F-US: {part: FP5EC9524401Z, power-cord: N. America}
      AS9926-24DB-O-AC-F-EU: {part: FP5EC9524201Z, power-cord: EU}
      AS9926-24DB-O-AC-F-UK: {part: FP5EC9524301Z, power-cord: UK}
      AS9926-24DB-O-AC-F-CN: {part: FP5EC9524701Z, power-cord: CN}
      AS9926-24DB-O-AC-F-TW: {part: FP5EC9524T01Z, power-cord: TW}
      AS9926-24DB-O-AC-F-JP: {part: FP5EC9524501Z, power-cord: JP}
  dc48-f2b:
    kind: orderable
    airflow: front-to-back
    description: >-
      Dual -48 VDC PSUs (FRU FSJ033-610G, rated 48 VDC 1300 W, input -40 V to
      -75 V at 40 A maximum) and the same six fan trays, front-to-back airflow.
      The DC SKUs ship four ring lugs that the AC SKUs do not (cor580-qsg
      package contents, item 4). The bay geometry is identical; the supply is
      drawn as the AC part because the library holds no 1300 W DC module yet,
      which is registered as a gap.
    part-numbers:
      AS9926-24D-O-48V-F: {part: FP5EC9524001Z, power-cord: none}
      AS9926-24DB-O-48V-F: {part: FP5EC9524003Z, power-cord: none}
gaps:
  - what: dip-switch-bank
    scope: [front]
    reason: sources-disagree
    wanted: >-
      A ten-cell switch strip with red end caps sits at x 30.4-49.4, y 32.6-36.0
      on the front face, below RST. Callout 8 of cor580-datasheet/fig-0007 points
      its leader at this strip while the same page's list names item 8 'Reset
      button', and cor580-qsg/fig-0008 unambiguously gives that name to the round
      button above. It is drawn as decor and given no function. Its printed
      two-word label does not resolve at 3.2 px/mm. A straight-on bench
      photograph of the left-hand end of the faceplate settles both the label and
      whether the cells are switches, jumpers or lamps.
  - what: dc-psu-module
    scope: [rear]
    reason: needs-hardware
    wanted: >-
      The dc48-f2b configuration orders FSJ033-610G, a 1300 W -48 VDC supply with
      a terminal block rather than a C14 inlet. The library has common/psu-dc-650
      but no 1300 W DC module, and neither COR580 document photographs the DC
      PSU's face - both rear elevations show the AC unit. The DC configuration
      therefore draws the AC part, which is wrong at the connector. A photograph
      or drawing of FSJ033-610G's face is what it needs.
