format: 1
kind: device
name: ais800-32o
version: 1.0.4
maturity: modelled
manufacturer: Edgecore
model: AIS800-32O
portfolio: {line: AI and Data Center, family: AI/ML Switch, series: AIS800}
description: >-
  32 x 800G OSFP800 AI and data centre 1RU switch on a Broadcom Tomahawk 5 with an Intel Xeon D-1713NTE
  and an OpenBMC service processor, sold as the AIS800-32O. All ports are on the FRONT with two 25G SFP28
  in-band management cages, an RJ-45 management jack, an RJ-45 console, a USB-C storage port, six system
  lamps and a reset button; two 2400 W supplies and SEVEN fan trays are on the rear. Its twin edgecore/ais800-32d
  is the same chassis, the same rear and the same management cluster with a QSFP-DD800 wall in place of
  this one's OSFP800 wall - and the two walls are laid out differently, which is the whole reason they
  are two models.
profile: networking
provenance:
  sources:
    confidence: datasheet
    note: >-
      A QUICK START GUIDE AND A DATASHEET, AND THEY DISAGREE ABOUT THE HEIGHT. Both are staged: ais800-32o-qsg
      (7 pages, bilingual) and ais800-32o-datasheet. The guide carries the Overview elevations, a System
      LEDs/Buttons enlargement, the FRU replacement figures, the Airflow Reversal figures and a Connect
      Power page that draws the DC supply's face; the datasheet carries the ordering tables, the part
      numbers and the power ratings. FIVE PHOTOGRAPHS ARE STAGED AND NONE OF THEM HELPS. All five are
      960 x 700, which is 2.19 px/mm on a 438.4 mm face - less than half the elevation's resolution. They
      settle colour and nothing else. THE DATASHEET IS THE SAME DOCUMENT AS THE TWIN'S. It is titled "AIS800-32O/AIS800-32D"
      and covers both models in one ordering table; the QUICK START GUIDES are separate and each carries
      its own elevations, which is what makes the two walls independently measurable.
  gate-1:
    confidence: measured
    note: >-
      PASSES, AND THE HEIGHT DISAGREEMENT IS SETTLED BY THE DRAWING RATHER THAN BY PICKING A DOCUMENT.
      THE TWO SOURCES GIVE DIFFERENT HEIGHTS AND BOTH ARE INTERNALLY CONSISTENT. The quick start guide's
      Hardware Specifications table reads "438.4 x 589 x 44 mm (17.26 x 23.19 x 1.73 in.)" and the datasheet
      reads "43.84 x 58.9 x 4.3 cm (17.26 x 23.19 x 1.69 in.)". 44 mm is 1.732 in and 43.0 mm is 1.693
      in, so neither is a conversion slip - the width and depth agree to the hundredth of an inch and
      only the height differs. THE REAR ELEVATION IS ISOTROPIC AT 44 AND NOT AT 43. Rendered from the
      PDF page at 600 dpi it reads 2221 x 223 px. Against 438.4 mm that is 5.0662 px/mm; against 44.0
      mm the height gives 5.0682 - 0.04% apart. Against 43.0 it gives 5.1860, 2.4% out. A drawing that
      is square on one number and 2.4% out on the other has answered the question. 44.0 is used. THE FRONT
      ELEVATION IS DRAWN AT ITS OWN SCALE AGAIN, and a third one. It reads 2230 px wide - 5.0867 px/mm
      - against this guide's rear at 5.0662 and the AIS800-32D guide's front at 5.0536. Three drawings
      of one 438.4 mm face at three scales 0.7% apart, each measured on its own. Taking one axis or one
      face from another drawing is the error that made a Cisco power module 3.66 mm too wide, and it is
      avoided here by never mixing them. The ink below the face is the drop shadow and is discarded, as
      on the twin.
  the-drawings-are-upscales-and-that-was-checked:
    confidence: measured
    note: >-
      THE 600 DPI RENDER IS AN INTERPOLATION OF A 1.83 px/mm RASTER, and this was found late rather than
      assumed early. The elevations are embedded in the PDF at 836 x 118 and 832 x 108 px, so rendering
      the page at 600 dpi upscales them 2.8x. THE EDGE MEASUREMENTS SURVIVE. Re-running the seam detector
      on the EMBEDDED rear image at its native 1.8294 px/mm puts the inner fan rails at 150.3/153.6, 195.1/198.4,
      238.9/243.3 and 284.8/288.1 against the upscale's 149.82/153.18, 194.82/198.18, 239.83/243.19 and
      284.64/288.19 - every one within 0.5 mm, half a native pixel - and the native pitch of 44.83 against
      the upscale's 45.005. Averaging a vertical edge over 200 rows genuinely buys sub-pixel localisation;
      the closing arithmetic on the rear is the second check. WHAT DOES NOT SURVIVE IS LETTERING, and
      two things were dropped because of it. See the fan-bay-numerals gap. A legend that is 3.7 native
      pixels tall is not read, it is guessed.
  the-optical-wall:
    confidence: measured
    note: >-
      FOUR BLOCKS OF FOUR STACKED COLUMNS, AND THE TWIN'S WALL IS NOT LIKE THIS. 2D template matching
      of one cage column across the front face finds all sixteen at 7.27, 30.67, 54.06, 77.46, 104.00,
      127.39, 150.79, 174.38, 200.72, 224.31, 247.70, 271.10, 297.64, 321.03, 344.43 and 367.82. A SINGLE
      PERIODIC FIT TO THOSE IS WRONG - it gives 24.152 with an rms of 0.841 and a worst residual of 1.405
      - because the steps are not uniform: they run 23.40, 23.39, 23.40, 26.54, 23.39, 23.40, 23.59, 26.34
      and so on. Four short steps, one long, repeating. FITTING THE BLOCK MODEL INSTEAD CLOSES IT. Least
      squares on x = first + floor(i/4) * B + (i mod 4) * p gives first 7.225, block pitch 96.7913, in-block
      pitch 23.4243 - a gutter of 3.094 - with an rms of 0.051 mm and a worst residual of 0.091. Sixteen
      columns, four gangs of four. THE TWIN IS UNIFORM AND WAS FITTED SEPARATELY. edgecore/ais800-32d's
      wall takes a single 24.2410 pitch at an rms of 0.069 with no gutter at all. The two guides were
      measured independently and the difference is real, not a reading artefact: an OSFP cage is 23.1
      mm wide against a QSFP-DD's 19.0, so this wall needs its room in blocks where that one can spread
      evenly. Template matching found the structure; the periodic fit would have averaged it away, which
      is the EXP100's autocorrelation lesson applied before the fact. EACH COLUMN IS ONE STACKED ASSEMBLY.
      The panel draws a single bezel per column holding the upper aperture, a thin bright perforated strip
      and the lower aperture, with the pair numbered `N (up) (down) N+1` on one baseline beneath it. Odd
      ports are the upper row and even the lower - the guide's own enlargement prints `31 (up) (down)
      32` at the right-hand end and the panel prints `1 (up) (down) 2` at the left. ROWS, AND THEY ARE
      TIGHTER THAN THE TWIN'S. A row profile through one column puts the upper aperture at y 4.33 to 16.91
      and the lower at 18.87 to 31.85 - a row pitch of 14.54 against the AIS800-32D's 18.00, and drawn
      openings of 12.58 and 12.98 against its 8.70. std/osfp@1's registry aperture is 13.5 tall, so seating
      it on a 14.54 pitch leaves the two rows 1.04 mm apart. That is what a stacked OSFP 2x1 cage is;
      the registry owns the aperture and the device owns the pitch, as the EXP100 records. Drawn widths
      are 22.4 against the registry's 23.1, the same consistent bias the twin shows at 18.3 against 19.0.
      THE INTER-ROW BAND IS DRAWN ON A BACKING RECT AND THAT IS DELIBERATE, as on the twin. Panel pattern
      decor paints only its holes, so a slot field on a dark panel is invisible; this band is BRIGHT on
      the hardware - here a single row of round perforations less than a millimetre tall, which is all
      the room an OSFP row pitch of 14.54 leaves for it - so each column gets its own light rect beneath
      the pattern - SIXTEEN bands, not one strip, because the band belongs to the cage assembly and stops
      between columns. The left and bottom fields get none, because those really are dark slots punched
      in the grey panel. THE WALL STARTS 2.4 MM HIGHER AND THAT COSTS THE PANEL A VENT BAND. The twin
      prints a row of slots at y 3.30 to 5.90, above its cages; here the cages begin at 4.33 and occupy
      that strip, so this face carries no top vent field. Its bottom field is correspondingly taller,
      starting at 37.20 where the twin's starts at 39.20.
  the-management-cluster-is-shared-with-the-twin:
    confidence: measured
    note: >-
      AND THAT WAS MEASURED ON BOTH, NOT ASSUMED. The same scan run on this device's front and on edgecore/ais800-32d's
      puts the two SFP28 apertures at 394.75-408.12 and 409.30-422.67 here against 394.77-408.22 and 409.21-422.47
      there - 0.2 mm apart on a feature 13 mm wide, read off two separate drawings. The cluster is one
      CPU/BMC faceplate and both models carry it unchanged. WHAT IS IN IT. Two 25G SFP28 cages in one
      bezel legended `1 (up) 25G (up) 2`; a USB-C receptacle standing PORTRAIT to their right, legended
      SS with the USB trident; an RJ-45 management jack legended MGMT and an RJ-45 console legended CONSOLE
      beneath them, bezels 393.98-409.41 and 413.57-429.00 by y 20.78-33.64 against std/rj45@2's 15.8
      x 13.2; and a recessed dark strip along the bottom carrying a round reset button legended RST and
      six lamps. THE USB IS A USB-C AND THE DATASHEET CALLS IT SOMETHING ELSE. Both documents' port lists
      say "1 x USB 3.0 storage port" with no connector type; the panel draws a tall rounded slot 3.8 x
      8.8 mm with the SuperSpeed trident beside it, which is a Type-C on its side. USB 3.0 is the protocol
      and Type-C is the connector, so both are recorded and neither contradicts the other. std/usb-c@1
      is placed `rotate: 90`. THE SFP28 LEGEND ALSO PRINTS A TRIANGLE BESIDE EACH NUMERAL - the panel
      reads `1 (up) 25G (up) 2` - and only the numerals and the 25G are drawn. On the 800G wall the matching
      triangle IS a lamp and is placed as one; here there is no window to anchor it to, so printing the
      glyph would assert a mark whose nature was not established. See the sfp28-and-port-lamp-positions
      gap.
  the-triangles-are-printed-and-the-lamps-are-round:
    confidence: measured
    note: >-
      AND THE FIRST MODEL OF THIS DEVICE HAD IT BACKWARDS. The panel prints `N (up) (down) N+1` beneath
      every column, and the triangles were first placed as common/led-arrow@1 lamps, which is what edgecore/exp100-32x
      and edgecore/exp800-16o do with the same-looking marks. THE DRAWING SAYS THEY ARE INK. The triangles
      are solid white, the same white and the same crispness as the numerals beside them. Every lamp on
      this face reads differently - a bright dome inside a dark rim - which is exactly how the six system
      lamps, the two SFP28 lamps and the round port lamps all render. A light pipe and a silkscreen glyph
      do not look alike at 5 px/mm, and these look like the numerals. SO THE ARROWS ARE SILKSCREEN and
      there are thirty-two of them, one per port, saying which row its number belongs to. No other device
      in this library prints this glyph yet. THE NUMERALS WERE ALSO TOO SMALL. They measure about 2.3
      mm of cap height against the 1.3 mm font first used; 2.8 is what puts them at the drawn size.
  the-panel-is-mid-grey-and-that-is-why-the-vents-can-be-seen:
    confidence: photo-measured
    note: >-
      THE CHASSIS COLOUR WAS CARRIED FROM ITS SIBLINGS AND IS WRONG. edgecore/exp100-32x, edgecore/exp800-16o
      and the rest of this line all carry '#3f4348', which nothing measured. Sampling the panel between
      features on the front elevation gives #626366, #737579 and #5d5d5e, and the vendor's own photograph
      ais800-32o-2-AIS800-32O-F.png and its 32D twin gives row medians of #676767, #696363 and #776f6d.
      Two independent sources, one answer: a MID grey. IT MATTERS BECAUSE PANEL PATTERN DECOR PAINTS ONLY
      ITS HOLES. On a near-black panel a field of dark slots is invisible, which is exactly how the first
      render came out - four vent fields declared and none of them legible. On the measured grey they
      read as they do on the drawing. The fix is the colour, not a backing rect, because these really
      are dark holes punched in a grey panel. THE FIELDS THEMSELVES ARE MEASURED: a vertical slot column
      at x 1.98-3.17 by y 6.33-38.98; two horizontal bands across the port wall at y 0.40-1.58 and 3.56-5.54;
      and a three-row field along the bottom from y 39.37 to 43.93, whose cells start at x 10.77 on a
      3.17 pitch. THERE IS NO VENT FIELD AT THE RIGHT-HAND END. The columns from x 431 to 435 read a flat
      67-69 with no structure at all; the right margin is plain metal behind the lamp strip.
  this-face-has-no-port-lamp-columns-and-the-twin-does:
    confidence: measured
    note: >-
      AND THE GEOMETRY EXPLAINS IT. edgecore/ais800-32d carries four round lamps per port in the dark
      post to the left of each cage; there is no such post here. An OSFP aperture is 23.1 mm on a 23.424
      mm in-block pitch, which leaves THREE TENTHS of a millimetre between neighbouring cages, where the
      twin's 19.0 mm QSFP-DD aperture on a 24.241 pitch leaves 5.2 mm. Scanning the posts for the twin's
      4+4 dot pattern finds nothing, because there is nowhere for it to be. THE GUIDE STILL NAMES THE
      LAMPS - "OSFP800 LEDs: Yellow (800G), Blue (400G), White (200G), Green (100G)" - so they exist and
      this drawing does not resolve them. They are not drawn rather than guessed at. See the port-lamp-windows
      gap.
  the-sfp28-cages-have-a-lamp-each:
    confidence: measured
    note: >-
      ONE ROUND WINDOW ABOVE EACH CAGE. The elevation puts bright blobs at x 399.92-401.30 and 414.16-415.75
      by y 2.90-4.28 - centres 400.61 and 414.96, 14.35 mm apart against the cages' own 14.5 mm pitch
      - and the System LEDs enlargement resolves them as white domes in dark rims. The guide names them:
      "SFP28 LEDs: Green (link/activity)". Measured on the twin's elevation and confirmed present on this
      one, as the rest of the cluster was.
  the-system-lamps:
    confidence: measured
    note: >-
      SIX RECTANGULAR LAMPS AND A ROUND BUTTON, ALL LEGENDED, WHICH IS BETTER EVIDENCE THAN THIS LINE
      USUALLY GIVES. The quick start guide's System LEDs/Buttons page enlarges the strip and names every
      one: "LOC: Flashing Green (switch locator) DIAG: Green (OK), Red (fault) ALRM: Red (fault). FAN:
      Green (OK), Red (fault). PSU1/PSU2: Green (OK), Red (fault)" and "RST: Reset button". THE POSITIONS
      ARE READ OFF THE ELEVATION AND THE SHAPE OFF THE ENLARGEMENT. A bright-run scan across the strip
      at y 39.0-40.2 finds seven runs: the button at 391.40-392.00 and the six lamps at 401.50-403.08,
      407.04-408.62, 412.58-413.96, 418.32-419.50, 423.66-424.85 and 429.00-430.39. Their centres fit
      a 5.482 mm pitch. The enlargement resolves them as rounded rectangles about 2.4 times as wide as
      tall, each directly BELOW its legend - not the round dots this line's other 1RU switches use, and
      not a mixture of the two. THE LIBRARY'S NEAREST PART IS BIGGER THAN THE DRAWING. common/led-rect-sm@1
      is 2.8 x 1.6 where the drawing reads 1.83 x 0.75, and common/reset-button@1 is 4.0 across where
      the button reads 2.5. Both are seated at the measured CENTRES rather than the measured sizes, because
      the library's indicator vocabulary is what a reader compares across devices. The 2.74 mm gap that
      remains between adjacent lamps is why the oversize is harmless here.
  the-rear-closes-arithmetically:
    confidence: measured
    note: >-
      SEVEN INDEPENDENTLY MEASURED SPANS SUMMING TO THE STATED WIDTH, which is the strongest check this
      rear has. 4.74 of chassis frame, 53.69 of PSU1, 4.73 of rail, 311.68 of fan block, 4.36 of rail,
      53.70 of PSU2 and 5.50 of frame sum to 438.40. THE FAN PITCH TOOK FOUR INSTRUMENTS AND ONLY ONE
      OF THEM WAS RIGHT. Bay seams gave 45.05, the bails' edges 47.08, autocorrelation 45.05 and 48.80.
      The bails disagree because the FRU figure shows they are U-loops posed at a different angle in every
      bay - segmenting the salmon in the seven bays gives seven different vertical spans for seven identical
      parts. 2D TEMPLATE MATCHING OF THE HONEYCOMB SETTLED IT: six of the seven trays match at 60.60,
      105.60, 150.81, 195.81, 285.82 and 331.02 (the seventh is under PSU2's bail), fitting 45.025 with
      an rms of 0.10. The tray frames read on two separate row bands then give 41.65 wide with a 3.36
      mm rail, and 41.65 + 3.36 = 45.01. A POSED HANDLE IS NOT A MEASUREMENT; the part that repeats is.
      THE SUPPLIES ARE 53.7 AND BOTH WERE READ. PSU1 4.74-58.43 and PSU2 379.20-432.90 give 53.69 and
      53.70. The first read of PSU1 gave 51.2 by taking an internal seam at 56.06 for its right frame;
      the symmetry and the closing sum identify which edge is which. THE MODULE HEIGHT IS MEASURED HERE,
      NOT BORROWED. Horizontal seams at y 1.38 and 42.04 bound both module types, giving 40.66 for the
      supplies and 40.6 for the trays. 40.6 is used for both. The rest of this library's Edgecore 1RU
      rears carry 40.0 as an estimate.
  power:
    confidence: datasheet
    note: >-
      2400 W PER SUPPLY, STATED IN BOTH DOCUMENTS, WHICH IS UNUSUAL FOR THIS LINE. The datasheet's feature
      list reads "Hot-swappable, load-sharing, redundant 2400 W AC/DC PSUs" and its ordering table names
      PSU-AC-2400W-F/-B and PSU-DC-2400W-F/-B as FRUs. The EXP800 and EXP100 supplies in this library
      carry no output rating at all because their vendor pages publish none. DRAW IS STATED TWICE AND
      BOTH FIGURES ARE RECORDED: "Full loading 1600 W (100% traffic, 32 x 24 W optics)" and "1254 W (100%
      traffic, 32 x 12 W optics)". The higher is the max. THE DATASHEET GIVES ONE PAIR OF FIGURES FOR
      BOTH MODELS and does not separate the OSFP build from the QSFP-DD one, so the same numbers stand
      here and on edgecore/ais800-32d. INPUT, from the quick start guide's specifications table: "200-240
      VAC, 50/60Hz, 15 A max. per PS" and "-48 - -60 VDC, 53 A max. per PS". There is no low-line AC rating
      anywhere, and the guide adds that a single supply powering a fully loaded system must be on 200-240
      VAC. THE PER-PORT BUDGET IS 30 W and is the datasheet's, qualified by it: "for all 32 ports all
      with per-port maximum 30 W capability ... subject to total power distribution boundary and thermal
      considerations".
  airflow:
    confidence: datasheet
    note: >-
      BOTH DIRECTIONS, AS SEPARATE SKUs, AND THE COLOUR RULE IS SHOWN RATHER THAN STATED. The ordering
      table lists ten AC part numbers per model - five cord regions x two airflows - plus a DC pair, and
      the FRU table pairs PSU-AC-2400W-F and FAN-1U-1x1P-F with front-to-back and the -B parts with back-to-front.
      THE GUIDE'S AIRFLOW REVERSAL FIGURES DRAW RED BAILS ON THE F2B BUILD AND BLUE ON THE B2F BUILD,
      on both the trays and the supplies. Unlike the DCS240's guide this one never writes the rule in
      words, so the colours here come from its figures and from the family convention. See roc-ops/Portrayal#277.
      THE TWO BUILDS ARE DERATED DIFFERENTLY: the datasheet gives front-to-back 0-40 C at 6000 ft and
      back-to-front 0-35 C, "subject to used optics".
attrs:
  environmental:
    operating-temp: 0 to 40 C (front-to-back, at 6000 ft); 0 to 35 C (back-to-front)
    storage-temp: -40 to 70 C
    humidity: 'Operating: 5% to 95% non-condensing'
  physical: {weight-note: '14.53 kg (32.03 lb), with 2 PSUs and 7 fans installed'}
  platform: {cpu: 'Intel Xeon D-1713NTE, 4-core 2.2 GHz', switch-silicon: Broadcom BCM78902 Tomahawk 5,
    bmc: 'AST2620 running OpenBMC, secured by an AST1060 root of trust', memory: 32 GB DDR4 SO-DIMM with
      ECC, storage: 240 GB M.2 2280 NVMe SSD, flash: 64 MB SPI x 2, tpm: TPM 2.0 SPI, software: ONIE preloaded;
      no NOS image ships on the device}
  performance: {switching-capacity: 25.6 Tbps (51.2 Tbps full duplex), logical-ports: up to 160, jumbo-frames: up
      to 9416 bytes}
  power: {power-draw-max-w: 1600, power-draw-typical-w: 1254, power-budget-per-port-w: 30}
  features:
    optics-osfp: >-
      datasheet: each port takes 1 x 800 GbE at 106 Gb/s PAM4, or breaks out to 2 x 400G, 4 x 200G or
      8 x 100G. At 50 Gb/s PAM4 it takes 1 x 400G or breaks out to 2 x 200G, 4 x 100G or 8 x 50G; at 25
      Gb/s NRZ it takes 1 x 100G. Maximum 160 logical ports.
  lifecycle: {eol: none-announced}
chassis: {width: 438.4, height: 44.0, depth: 589.0, ru: 1, weight-kg: 14.53, color: '#6a6b6e', airflow: front-to-back}
gaps:
- what: fan-bay-numerals
  scope:
  - rear
  reason: needs-drawing
  wanted: >-
    Which end of the rear the fan trays number from. The chassis silkscreens a mark on the rail beside
    each bay, and at the source's real resolution it cannot be read: the rear elevation is embedded in
    the PDF at 1.83 px/mm, where a 2 mm numeral is 3.7 pixels. Upscaling the page render to 600 dpi makes
    the marks LOOK legible - a "7" appeared convincingly on the rail at the right-hand end - but the same
    detector run on the embedded image at native resolution shows there is nothing there to read, so it
    was discarded. IT MATTERS BECAUSE THE FAMILY IS NOT CONSISTENT. edgecore/exp100-32x and edgecore/dcs240
    both number their trays RIGHT to LEFT. The bays here carry rel-pos 1 to 7 LEFT to right because a
    view has to order them somehow, and NO numeral is silkscreened, because drawing one would assert what
    was not read. A photograph of the rear at 5 px/mm or better, or any figure that labels a tray, settles
    it in one look.
- what: module-lamp-legend
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    What the lamp on each fan tray means. Every one of the seven trays carries a round lens at its top
    left - a bright dome in a dark rim, about 3.4 mm across - and neither staged document mentions it.
    THE DC SUPPLY CARRIES ONE TOO, at the right of its lattice, 12 mm below its stowed bail where no part
    of the bail is; it was removed for a round on the AC sibling's reasoning and the reviewer caught it.
    THE AC SUPPLY CARRIES NONE: its matching ring sits exactly at the deployed bail's root and is the
    bail's end seen in perspective. The trays' lens sits where no bail is. The quick start guide's System
    LEDs/Buttons page lists the six chassis lamps and the RJ-45's pair and stops; the datasheet names
    port, management-port and system LEDs and no module lamp. The lamps are drawn because they are there,
    with the library's default off/on states. No green/amber legend is invented for them.
- what: port-lamp-windows
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    Where this face's port lamps are. The guide names them - "OSFP800 LEDs: Yellow (800G), Blue (400G),
    White (200G), Green (100G)" - so every port has at least one, and this elevation resolves none. The
    twin edgecore/ais800-32d puts four round windows in the 5.2 mm post beside each cage; an OSFP wall
    has only 0.3 mm between neighbouring cages, so whatever this model does it does somewhere else, and
    the drawing does not show where. No lamp is placed rather than one being guessed at. A photograph
    at 5 px/mm or better, or a port-LED figure, settles it.
- what: the-four-undrawn-faces
  scope:
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A drawing of the lid, the underside and the two side walls. Between them the two staged documents
    draw two elevations, a LED enlargement, two FRU figures, the airflow figures and a power-connection
    page, and not one of them shows a third face. Each carries an `empty:` sentence saying where I looked,
    per docs/deliberately-empty-faces.md.
groups:
  osfp800:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the thirty-two 800G OSFP800 ports, in four blocks of four stacked columns - a 23.424 mm in-block
      pitch with a 3.09 mm gutter between blocks - numbering down each column from 1 at the top left to
      32 at the bottom right, odd ports the upper row and even the lower, as the panel's own `N (up) (down)
      N+1` legends say.
    attrs: {media: osfp, speed: 800g}
  port-leds: {term: LED, role: indicator, index-origin: 1}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster at the right of the port row - two 25G SFP28 in-band management cages, a
      1000BASE-T RJ-45 management jack, an RJ-45 serial console, a USB-C storage port and the reset button.
      The datasheet lists the SFP28 pair under "Management Ports on Port Side" alongside the two RJ-45s,
      which is why they are in this group and not the traffic one.
  leds: {term: LED, role: indicator, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        datasheet: "PSUs: 2 redundant, load-sharing, hot-swappable 2400 W AC/DC". Two 2400 W supplies
        against a stated 1600 W full-load draw is a genuine 1+1, and the guide says so from the other
        side: a single supply may power a fully loaded system provided it is on 200-240 VAC.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 6+1
      redundancy-note: >-
        datasheet, twice: "7 Hot-swappable fan modules with 6+1 redundant fans" in the feature list and
        again in the interface callouts, against seven bays measured on the rear elevation. The digit
        form and the bay count agree. SEVEN BAYS IS ONE MORE THAN ANY OTHER 1RU REAR IN THIS LIBRARY.
views:
  front:
    size: {w: 438.4, h: 44.0}
