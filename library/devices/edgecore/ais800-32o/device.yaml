configurations:
  ac-f2b:
    kind: orderable
    description: >-
      Dual 2400 W AC PSUs, front-to-back airflow - red bails on the supplies and the trays, which is the
      build the rear elevation and all five staged photographs show. Rated 0-40 C at 6000 ft.
    default: true
    part-numbers:
      AIS800-32O-AF-US: {part: FP6EC9632010Z, power-cord: US}
      AIS800-32O-AF-EU: {part: FP6EC9632204Z, power-cord: EU}
      AIS800-32O-AF-UK: {part: FP6EC9632304Z, power-cord: UK}
      AIS800-32O-AF-JP: {part: FP6EC9632504Z, power-cord: JP}
      AIS800-32O-AF-UN: {part: FP6EC9632014Z, power-cord: UN}
  ac-b2f:
    kind: orderable
    description: >-
      Dual 2400 W AC PSUs, back-to-front airflow - blue bails. The guide never writes the colour rule
      in words; its Airflow Reversal figures draw it. Derated to 0-35 C, "subject to used optics".
    airflow: back-to-front
    region-context: {exhaust: Intake}
    component-attrs:
      ais800-fan: {handle-finish: '#3d7bd6'}
      ais800-psu-ac: {handle-finish: '#3d7bd6', latch-finish: '#8fb4e8'}
    part-numbers:
      AIS800-32O-AB-US: {part: FP6EC9632402Z, power-cord: US}
      AIS800-32O-AB-EU: {part: FP6EC9632203Z, power-cord: EU}
      AIS800-32O-AB-UK: {part: FP6EC9632303Z, power-cord: UK}
      AIS800-32O-AB-JP: {part: FP6EC9632503Z, power-cord: JP}
      AIS800-32O-AB-UN: {part: FP6EC9632013Z, power-cord: UN}
  dc-f2b:
    kind: orderable
    description: >-
      Dual 2400 W DC PSUs, front-to-back airflow - red bails. The DC supply lands -40 to -72 VDC on a
      two-pole screw block with a separate ground stud; no power cord ships.
    bays: {psu-1: edgecore/ais800-psu-dc@1, psu-2: edgecore/ais800-psu-dc@1}
    part-numbers:
      AIS800-32O-DF: {part: FP6EC9632004Z}
  dc-b2f:
    kind: orderable
    description: Dual 2400 W DC PSUs, back-to-front airflow - blue bails
    airflow: back-to-front
    region-context: {exhaust: Intake}
    bays: {psu-1: edgecore/ais800-psu-dc@1, psu-2: edgecore/ais800-psu-dc@1}
    component-attrs:
      ais800-fan: {handle-finish: '#3d7bd6'}
      ais800-psu-dc: {handle-finish: '#3d7bd6', latch-finish: '#8fb4e8'}
    part-numbers:
      AIS800-32O-DB: {part: FP6EC9632005Z}
