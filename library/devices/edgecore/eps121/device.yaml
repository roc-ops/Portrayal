format: 1
kind: device
name: eps121
version: 2.0.1
maturity: modelled
manufacturer: Edgecore
model: AS4625-54T
aliases:
- {name: EPS121, kind: marketing}
portfolio: {line: Enterprise, family: Access Switch, series: EPS121}
description: >-
  48 x 1G RJ-45 plus 6 x 1G/10G SFP+ 1RU access switch, no PoE, sold as the EPS121 and stamped AS4625-54T.
  All ports on the front in TWO ROWS OF TWENTY-FOUR COLUMNS ganged in three blocks of eight, numbered
  1-48, with the SFP+ uplinks numbered 49-54 into the same sequence. An RJ-45 management jack over an
  RJ-45 console, a Micro-USB storage port, a Reset button and six status lamps. TWO HOT-SWAPPABLE SUPPLIES
  AND THREE FIXED FANS on the rear - the fans are not FRUs. Its sibling edgecore/eps122 is the same chassis
  with PoE, and they share one quick start guide; they are separate devices because the differences are
  device attrs, which a configuration cannot carry.
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the upper cage
      upright (rotate 0) over the lower turned 180, so both cage lips face the band between the two cages
      and both bails face outward. Decided by the rule, not an observation, so a photograph of the stack
      overturns it: the 3 SFP pairs (port-49/port-50 to port-53/port-54).
  sources:
    confidence: datasheet
    note: >-
      ONE QUICK START GUIDE COVERS BOTH MODELS and it is staged twice, byte-identical - md5 c81e696fe001edaa86961a6660f8da00,
      1343641 bytes. Its title page reads "Ethernet Switch AS4625-54T | AS4625-54P" and its package contents
      "AS4625-54T/AS4625-54P (includes 2 PSUs)". Each model additionally has its own four-page datasheet
      with its own photographs of both faces. THE GUIDE DISCLAIMS ITS OWN DRAWINGS - "Note: The drawings
      in this document are for illustration only and may not match your particular model" - and on this
      family that is not boilerplate to ignore: see the status-lamp note below.
  gate-1:
    confidence: measured
    note: >-
      SIX INSTRUMENTS, AND ALL SIX SAY THE HEIGHT IS 44.45 mm RATHER THAN THE SPECIFICATION TABLE'S 44.
      The guide's four elevations read 2215x224, 2213x224, 2213x224 and 2219x224 px; the two datasheet
      front photographs 3991x404 and 3998x408. Against 440 x 44 they come out -1.116%, -1.205%, -1.205%,
      -0.938%, -1.213% and -2.010%. Against 440 x 44.45 - true 1RU - they come out -0.105%, -0.195%, -0.195%,
      +0.076%, -0.203% and -1.008%. Six failures become six passes and the spread collapses by an order
      of magnitude, so the table's "44" is a rounding and the drawings are to 44.45. EVERY y MEASUREMENT
      IN THIS FILE USES THE 44.45 SCALE. On a 44 mm face the difference is half a millimetre at the bottom
      edge, which is the size of the features being measured. `chassis.height` still records the vendor's
      published 44: this is a drawing-scale fact, not a dimension change. WHICH INSTRUMENT FOR WHICH JOB,
      and this one is the opposite of the DCS520's. The guide's LINE ART is the geometry instrument even
      at 5.03 px/mm, and the datasheet PHOTOGRAPHS at 9.07 px/mm are for detail and colour - because the
      ganged-pitch fit below comes out with an rms of 0.082 mm on the line art and 0.74 mm on the photograph.
      White RJ-45 bezels are soft at 9 px/mm; a drawn edge is not.
  the-port-wall:
    confidence: measured
    note: >-
      FORTY-EIGHT RJ-45 IN TWO ROWS OF TWENTY-FOUR COLUMNS, ganged in THREE BLOCKS OF EIGHT. Fitted by
      least squares over all twenty-four columns with a per-block offset, on the mean of both rows' openings:
      **pitch 14.0158, gutter 6.4058, first centre 15.425, rms 0.082 mm, max residual 0.17**. Rows read
      y 14.96-22.78 and 27.29-34.66 on the photograph, centres 18.87 and 30.97, so a row pitch of 12.10.
      THEN SIX SFP+ AS THREE STACKED PAIRS at x 370.20, 387.98 and 405.75 - a pitch of 17.78 - with rows
      at 16.67 and 32.25. The SFP rows are further apart than the RJ-45 rows because that block has a
      divider band between its cages where the RJ-45 block has none; both were measured, neither was assumed
      from the other. NUMBERING IS ONE SEQUENCE ACROSS BOTH FAMILIES: RJ-45 1-48, SFP+ 49-54, legended
      `N (up)(down) N+1` above each column.
  the-management-cluster:
    confidence: measured
    note: >-
      AT THE RIGHT, STACKED: an RJ-45 management jack over an RJ-45 console jack - the panel legends them
      "(up) Mgmt" and "Console" - with a MICRO-USB storage port below under a "USB" label. Both jacks
      read rows 18.75 and 30.86, which is the RJ-45 block's own row pitch to 0.12 mm, so they sit in the
      same stack the traffic ports do. THE MICRO-USB IS WORTH NAMING because the third member of this
      shell family does not have one: the EPS112's guide lists a full-size "USB storage port" where this
      one lists a "Micro-USB storage port". The clusters are not interchangeable between the three.
  the-status-lamps-and-what-the-shared-guide-cannot-settle:
    confidence: measured
    note: >-
      SIX LAMPS IN TWO ROWS OF THREE, on a black plate beside the Edge-core logo and the model text, with
      a Reset button between them. Measured on the guide's Status LEDs enlargement, calibrated on the
      port columns it draws (`1 (up)(down) 2` through `11 (up)(down) 12`, whose centres this file already
      knows exactly) at 22.62 px/mm - four and a half times the elevation: lamp columns at x 53.2, 61.0
      and 68.9, rows at y 4.50 and 7.90, which the elevation's own label baselines independently confirm
      at 4.46 and 7.98. THE LEGEND, transcribed from the guide: System green = OK, amber = fault detected;
      PSU1/2 green = OK, amber = fault; FAN green = OK, amber = fault; LOC blinking amber = switch locator;
      PoE green = OK, amber = near PoE budget. AND THE SIXTH LAMP IS A PROBLEM ON THIS MODEL, recorded
      here and carried as a gap. The AS4625-54T HAS NO PoE, and the guide's only status-lamp enlargement
      is of the AS4625-54P - it is captioned with that model's own name. What this model has is the shared
      elevation, which draws the same six-lamp plate for both, on a document that says its drawings "may
      not match your particular model". Six are drawn here because six is what this model's own elevation
      shows; whether the sixth is really legended PoE on a switch that cannot do PoE is not something
      either document settles.
  power:
    confidence: datasheet
    note: >-
      THE NON-POE MACHINE, and the contrast is the whole reason this is its own device: "AS4625-54T: 150
      W max." power consumption at 25 C against its sibling's 2400 W, and a per-PSU system input rating
      of "100-120 VAC, 50/60 Hz, 4 A max. / 200-240 VAC, 50/60 Hz, 2 A max." against 12 A and 8.5 A. Sixteen
      times the draw and three times the current is not a configuration of one machine. NO PER-SUPPLY
      WATTAGE IS STATED for either model and none is invented.
  why-this-is-its-own-device:
    confidence: datasheet
    note: >-
      ONE GUIDE COVERS THE 54T AND THE 54P, SO THE QUESTION HAD TO BE ASKED. `docs/what-a-configuration-cannot-say.md`
      answers it in one sentence - a configuration can say what OCCUPIES a bay, but not what is TRUE of
      a part - and records that a config-scoped DEVICE attr is still open, filed as `config-scoped-device-attrs`
      on cisco/asr-9001. These two differ in exactly that forbidden way: weight 5.8 kg against 6.6, power
      consumption 150 W against 2400, per-PSU input 4 A against 12 A. The supplies really are different
      parts - 50.4 mm wide against 62.3, and the PoE one carries a fan - which a configuration could have
      expressed through `bays`; the weight and the consumption are device attrs, which it could not. And
      the 54P's RJ-45 row is TWO port groups where the 54T's is one, which changes the shape of the face
      rather than what fills it. See roc-ops/Portrayal#335 for the full working.
attrs:
  environmental: {operating-temp: 0 to 45 C (32 to 113 F), storage-temp: -40 to 70 C (-40 to 158 F), humidity: 'Operating:
      5% to 95% non-condensing'}
  physical:
    weight-note: 'AS4625-54T: 5.8 kg, includes two PSUs (the guide gives both models in one line)'
  power: {power-consumption: 'AS4625-54T: 150 W max at 25 C', system-input-rating-per-psu: 100-120 VAC
      4 A max; 200-240 VAC 2 A max}
  features:
    optics-sfp: >-
      Six 1G/10G SFP+ uplinks, ports 49-54, which both documents call uplinks. The guide's lamp legend
      gives them two rates - "SFP+ Port LEDs: Green (10G), Amber (1G)" - and no breakout table is published,
      so none is stated here.
  lifecycle: {eol: none-announced}
chassis: {width: 440.0, height: 44.45, depth: 350.35, ru: 1, weight-kg: 5.8, color: '#43464a', airflow: front-to-back}
gaps:
- what: the-row-under-the-ports
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    WHAT IS PRINTED UNDER EVERY PORT COLUMN. Both instruments show a row of small light marks about 1.5
    mm across below the RJ-45 block, one per column, and NEITHER RESOLVES THEM - the guide's line art
    at 5.03 px/mm and the datasheet photograph at 9.07 px/mm both reduce them to blur at nine times magnification.
    They are either a second port numbering or a second lamp row, and the face is modelled without them
    rather than with a guess. One enlargement of the lower edge closes this.
- what: fixed-fan-depth
  scope:
  - rear
  reason: vendor-silent
  wanted: >-
    HOW DEEP THE THREE FAN GUARDS ARE. `edgecore/eps-fan-fixed@1` carries a 10 mm vent depth and it is
    an estimate: the fans are fixed, no FRU figure exists for them, and neither document dimensions the
    rear. The guards' FACE geometry is measured - 25.5 x 15.9 on a 47.8 pitch, agreeing between the two
    models' elevations to 0.2 mm - so only the depth is open.
- what: the-sixth-status-lamp
  scope:
  - front
  reason: needs-drawing
  wanted: >-
    WHETHER THIS MODEL REALLY CARRIES A PoE LAMP. The AS4625-54T has no PoE. The guide's only status-lamp
    enlargement is captioned AS4625-54P, so the legends System / PSU1 / FAN / LOC / PSU2 / PoE are read
    off the OTHER model; what this one has is the shared elevation, which draws the same six-lamp plate
    for both - on a document that prints "the drawings in this document are for illustration only and
    may not match your particular model". Six lamps are drawn here because six is what this model's own
    elevation shows, and the sixth is legended PoE because that is what the plate says. A photograph or
    panel drawing of an AS4625-54T's left end closes this, and it is the kind of thing that is easy to
    get wrong in the confident direction.
groups:
  rj45-1g:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the forty-eight 1G RJ-45 ports, two rows of twenty-four columns ganged in three blocks of eight,
      numbered 1-48 down each column. NO PoE on this model - that is the whole difference from edgecore/eps122,
      and it is worth 150 W against 2400.
    attrs: {media: rj45, speed: 1g}
  sfp-plus:
    term: Port
    role: traffic
    index-origin: 1
    description: >-
      the six 1G/10G SFP+ uplinks, three stacked pairs at the right of the port wall, numbered 49-54 into
      the same sequence as the RJ-45 ports. `index-origin` is 1 because the schema allows 0 or 1 and nothing
      else; the 49 the panel prints is carried by each port's own `rel-pos`, which is where the panel's
      numbering belongs.
    attrs: {media: sfp, speed: 10g}
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the out-of-band cluster - an RJ-45 management jack over an RJ-45 console jack, a Micro-USB storage
      port and the Reset button. The guide legends the management jack's own lamps "Left (link), Right
      (activity)".
  leds: {term: LED, role: indicator, index-origin: 1}
  grounding: {term: Point, role: service, index-origin: 1}
  furniture: {term: Part, role: furniture, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs:
      redundancy: 1+1
      redundancy-note: >-
        "Redundant hot-swappable AC PSUs", two bays, and the guide's Connect Power step says "Install
        one or two AC PSUs in the device, if they are not already installed in the factory" - so one will
        run the machine and the second is the redundancy.
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy: 2+1
      redundancy-note: >-
        "2+1 fixed redundant fans", from the Overview callouts of both models. **THEY ARE NOT FRUs AND
        THERE ARE NO BAYS** - the guide's FRU Replacement section covers the supplies only, and there
        is no latch, handle or seam to draw. So the three fans are PLACED rather than bayed, and the 2+1
        counts rotors that nobody swaps. A census that asks whether this figure fills its bays will find
        none, and that is correct.
