gaps:
- what: chassis-dimensions
  scope:
  - front
  - rear
  - top
  - bottom
  - left
  - right
  reason: sources-disagree
  wanted: >-
    A third statement. csr430-datasheet says "440 x 300 x 44 mm" and 5.44 kg; csr430-qsg's hardware specification
    says "438.4 x 300 x 43.7 mm" and 5.42 kg. Both are single-model documents for the AS7515-24X, so this
    is not a shared quick start describing a sibling. The datasheet is taken because the figure's measured
    aspect of 9.9091 sits nearer 10.0 than 10.0320, and because the CSR310 - which the programme records
    as sharing this shell - states 440 x 300 x 44 in BOTH its documents. That is three statements against
    one, and it is still a disagreement rather than a resolution.
- what: fan-tray-part-number
  scope:
  - front
  reason: vendor-silent
  wanted: >-
    A part number for this device's fan tray. The CSR430's datasheet carries no field-replacement table;
    its quick start describes replacing the tray without naming it. edgecore/csr310-fan-tray@1 is fitted
    here on the strength of the DRAWING ALONE - handle, AIRFLOW arrow and thumbscrew within about two
    millimetres on both elevations, which is the noise floor at 8-9 px/mm. The supplies are shared on
    much better evidence, a part number stated in this device's own quick start. This one is an identification,
    not a proof, and a part number would settle it either way.
- what: rear-elevation
  scope:
  - rear
  - top
  - bottom
  - left
  - right
  reason: needs-drawing
  wanted: >-
    A figure of any face but the front, which on this device is a smaller hole than usual and is worth
    saying why. The datasheet's key features include "All ports, PSUs and fan modules are front access"
    and "Maintenance activity to replace PSUs and FANs can be done from the front panel without remove
    the product from rack" - so the rear carries no user hardware at all. The quick start's callout 11
    is a "Grounding screw"; it is not located, so it is not placed. The SIDE panels carry the intake and
    exhaust on a side-to-side box and no figure shows either. Per docs/deliberately-empty-faces.md these
    faces are DECLARED empty with the reason rather than left silent, which is the difference between
    empty-by-verification and empty-by-omission.
- what: qsfp-bezel-content
  scope:
  - front
  reason: needs-photo
  wanted: >-
    What the white perforated strip between each QSFP28 cage pair is. On the SFP28 columns the equivalent
    strip carries one arrow lamp per port and three vent holes, and the quick start's LED table names
    the arrow lamps' colours. Between the QSFP cages the strip is a dense grid of rectangular openings
    with no arrows - it reads as a vent, and the QSFP ports' own lamps are the rectangles in the silkscreen
    band below, which is where the numerals put them. It is drawn as a vent on that reading; a photograph
    would confirm there is no lamp in it.
groups:
  qsfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: qsfp28, speed: 100g}
  sfp28:
    term: Port
    role: traffic
    index-origin: 0
    attrs: {media: sfp28, speed: 25g}
  port-leds: {term: LED, role: indicator, index-origin: 0}
  timing:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the synchronisation cluster - a ToD/1PPS RJ-45, an SMB 1PPS jack, an SMB 10 MHz jack and the SMA
      antenna input of the integrated GNSS receiver. Three media, one job: disciplining this box's clock
      from the network or from the sky, and passing it on.
  mgmt:
    term: Port
    role: management
    index-origin: 1
    mixed: >-
      the management cluster - the 1000BASE-T RJ-45 and the RS-232 console share one bezel, and the USB-A
      storage port and the Reset button sit with the timing jacks. Three media, one job.
  leds: {term: LED, role: indicator, index-origin: 1}
  psus:
    term: PSU
    role: service
    index-origin: 1
    attrs: {redundancy: 1+1, redundancy-note: 'two load-sharing hot-swappable supplies, AC or DC'}
  fans:
    term: Fan
    role: service
    index-origin: 1
    attrs:
      redundancy-note: >-
        "4+1 redundant fans, hot-swappable fan tray" and "4+1 high-efficiency modular fans", both verbatim
        from the datasheet - FIVE FANS INSIDE ONE REPLACEABLE TRAY. NO `redundancy` FORM IS SET, and the
        reason is structural rather than evidential. A digit form in this library describes BAYS - spec/tests/test_fan_redundancy.py
        checks that the parts of `N+M` sum to the number of bays in the group - and this group has one
        bay, the tray, with the five fans inside it. Writing `4+1` against one bay would state a true
        fact at the wrong level and make a rule that is right in general fire on a device it is wrong
        about; writing `n+1` would be vaguer than the document. THE STRUCTURALLY CORRECT ANSWER IS NESTED
        BAYS - five fan positions inside the tray module - and the figure does not support it: the tray
        is drawn closed, with a handle, an arrow and a thumbscrew and no grille, so five positions would
        be invented. Nest them the day a figure of the tray's interior turns up.
  furniture: {term: Item, role: furniture, index-origin: 1}
