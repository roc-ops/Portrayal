kind: device
name: csr430
version: 1.0.6
maturity: modelled
manufacturer: Edgecore
model: AS7515-24X
aliases:
- {name: CSR430, kind: marketing}
portfolio: {line: Service Provider, family: Cell Site Router, series: CSR430}
description: >-
  20x 25G SFP28 and 4x 100G QSFP28 cell site router, sold as the CSR430, Broadcom BCM88284 Qumran-2U with
  an Intel Atom C3508 and 2 GB of GDDR6 deep buffer. An SMA GNSS antenna input, SMB 1PPS and 10 MHz jacks,
  a ToD RJ-45, and a rotated USB-A. Everything is on the front - ports, both hot-swappable supplies and
  the fan tray - with side-to-side airflow. Ports number 0-23 in one range, the four QSFP28s first.
profile: networking
provenance:
  stack-orientation:
    confidence: estimated
    note: >-
      The library's stack convention (docs/pluggables-3d-design.md, S1-S4): a row pair is the upper cage
      upright (rotate 0) over the lower turned 180, so both cage lips face the band between the two cages
      and both bails face outward. Decided by the port lamps, which point up over down: the 10 SFP pairs
      (port-4/port-5 to port-22/port-23). Decided by the rule, not an observation, so a photograph of
      the stack overturns it: the 2 QSFP pairs (port-0/port-1 and port-2/port-3).
  sources:
    confidence: datasheet
    note: >-
      Two documents, both staged and both docling-converted, MEASURED OFF THE PDF PAGE RATHER THAN THE
      CONVERTED FIGURES. csr430-datasheet carries the specification list, the eleven-callout interface
      table, and TWO front elevations on page 2 - one with AC supplies fitted and one with DC - which
      is more than any other device in this family gives and is why both configurations are drawn from
      measurement rather than one from the other. csr430-qsg carries no figure worth measuring and supplies
      the names: the callout list, the FRU procedures, the DC supply's part number, and - uniquely in
      this family so far - A REAL LED TABLE.
  figure-choice:
    confidence: measured
    note: >-
      Gate 1, and there are two candidates because the page draws the device twice. The DC elevation wins:
      panel (518,2885)-(4441,3280), 3924 x 396 px, aspect 9.9091 against 10.0 for 440/44 - 0.91 percent
      out. The AC elevation above it detects at 3926 x 372, aspect 10.55, because its supplies are pale
      and the row-darkness scan clips the band short; its WIDTH is 3926 against the DC figure's 3924,
      agreeing to 0.05 percent. SO THE TWO FIGURES SHARE ONE X SCALE, 8.9182 px/mm, and an x measured
      on one is an x on the other. That is what lets the AC supply's face be read from the upper figure
      and placed with the lower figure's coordinates, rather than one being assumed from the other.
  chassis:
    confidence: datasheet
    note: >-
      THE TWO DOCUMENTS DISAGREE, and it is recorded in gaps as sources-disagree rather than averaged.
      The datasheet says "440 x 300 x 44 mm" and 5.44 kg; the quick start's hardware specification says
      "438.4 x 300 x 43.7 mm" and 5.42 kg. The datasheet is taken, for two reasons that are both checkable.
      THE FIGURE PREFERS IT: the panel's measured aspect of 9.9091 sits nearer 10.0 (440/44) than 10.0320
      (438.4/43.7), 0.91 percent against 1.23. AND THE SIBLING THAT SHARES THIS SHELL STATES IT TWICE:
      the CSR310's datasheet and quick start both give 440 x 300 x 44, so three documents say 440 x 44
      and one says otherwise. The depth is not in dispute.
  port-numbering:
    confidence: measured
    note: >-
      ONE RANGE, 0 TO 23, WITH THE QSFP28s FIRST - simpler than the CSR310's three spaces and read the
      same way, off the numerals under the cages. The four 100G cages are numbered 0, 1, 2, 3 and the
      twenty 25G columns run 4/5 through 22/23, each column printing `n (up)(down) n+1` on one baseline.
  optical-blocks:
    confidence: measured
    note: >-
      THE SFP28 BANK IS IN TWO GROUPS, NOT ONE, and a column of vent holes separates them. Ports 4-11
      sit in four columns from 181.08 and ports 12-23 in six from 245.90, with 7.8 mm of perforated metal
      between - so it is modelled as two blocks sharing one group rather than as a ten-column comb with
      an invented uniform gutter. Both are anchored on measured centres and sized from the registry, and
      the two agree: the bezel arrows put column 1 at 188.2 and the numerals put the last column at 324.5
      against 324.3 predicted. The QSFP28 shells centre on 139.10 and 164.65, a 25.55 pitch on an 18.5
      cage, so 7.05 of gutter.
  lamps:
    confidence: datasheet
    note: >-
      THE QUICK START HAS A REAL LED TABLE, WHICH NO OTHER DEVICE IN THIS FAMILY HAS GIVEN. System: "LOC
      - Blinking Blue (device locator) DIAG - Green (OK), Orange (fault detected) PSU1/2 - Green (OK),
      Amber (fault) FAN - Green (OK), Orange (fault)". Ports: "QSFP28 Port LEDs: Green - 100G, Cyan -
      50G, Magenta - 40G, Blue - 25G, Yellow - 10G" and "SFP28 Port LEDs: Blue - 25G, Green - 10G, Cyan
      - 1G". And the management jack: "Left (link), Right (activity)". So every lamp here carries a stated
      vocabulary and there is no led-vocabularies gap. IT ALSO SETTLES WHAT THE BEZEL MARKS ARE. Each
      SFP28 column prints `(up) o o o (down)` between its rows: ONE lamp per port - the arrow, pointing
      at the row it serves, as on the AGR110 and CSR200 - with three round vent holes between them, not
      five lamps. One lamp per port is what a single speed vocabulary describes.
  psus-and-fans:
    confidence: datasheet
    note: >-
      ALL THREE FIELD-REPLACEABLE UNITS ARE THE CSR310's, AND THE DC SUPPLY IS PROVEN SO BY PART NUMBER:
      this device's own quick start says "Install one or two DC PSUs (part number CRXT-T0T12B only)",
      which is the sentence the CSR310's quick start carries. The faces were then read off both elevations
      against one rule and agree inside the precision of art at 8-9 px/mm - warning triangles at 23.0/22.9
      and 40.3/40.8, terminal block 29.6/30.0 wide with poles at 16.7/25.9/36.5 and 16.7/25.9/35.6. THE
      FAN TRAY IS WEAKER AND IS CARRIED AS A GAP. No part number exists for it here: the CSR430's datasheet
      has no field-replacement table where the CSR310's names FAN-1U-1x1J-S. The identification is by
      drawing alone - handle, AIRFLOW arrow and thumbscrew all within about two millimetres - which is
      the noise floor rather than a match. Bays: the supplies at 4.64 and 67.74, a 63.1 pitch taken from
      the warning triangles printed on the modules rather than from their edges, because a triangle is
      a mark and an edge is a shadow. The tray runs 394.9 to the panel edge.
  airflow:
    confidence: datasheet
    note: >-
      datasheet - "Side to side airflow" in the key features, and the fan tray's own face carries an AIRFLOW
      arrow pointing right, which is where the hardware says it. The quick start adds the rule that makes
      it matter: "Install replacement tray with matching airflow direction."
attrs:
  performance: {switching-capacity: 360 Gbps, processing-rate: 300 Mpps}
  power: {power-max-w: 167, power-envelope: as-tested, input-ac: '100V-240V, 6.0-2.4 A per PS',
    input-dc: '-44 to -60 V, 15.5-9.6 A per PS'}
  thermal: {airflow: side-to-side, cooling: 4+1 redundant hot-swappable fan tray}
  environmental: {temperature-operating: -40 C to 65 C (-40 F to 149 F), temperature-storage: -40 C to
      70 C (-40 F to 158 F), humidity-operating: 5% to 95% non-condensing}
  platform:
    asic: Broadcom BCM88284 Qumran-2U
    cpu: Intel Atom C3508, 4-core 1.6 GHz
    memory: DDR4 SO-DIMM, 2 x 8 GB with ECC
    buffer: 2 GB GDDR6 deep packet buffer
    storage: 128 GB mSATA SSD
    software: ONIE installer pre-loaded; Open Network Linux (ONL) compatible
  features:
    standards: 5G eCPRI, TSN and SRv6 enabled; O-RAN fronthaul
    timing: IEEE1588v2 and SyncE at Class C accuracy; integrated GNSS
    timing-ports: ToD/1PPS (RJ-45), 1PPS I/O (SMB), 10MHz I/O (SMB), GNSS antenna (SMA)
    optics-qsfp28: 40 GbE or 100 GbE per port; 100GBASE-SR4/LR4/ER4/ZR4/PSM4-2
    optics-sfp28: >-
      1 GbE, 10 GbE or 25 GbE per port; 25GBASE-SR/LR, 10GBASE-SR/LR/ER/ZR, 1000BASE-SX/LX/EX/ZX
    port-leds-qsfp28: green 100G, cyan 50G, magenta 40G, blue 25G, yellow 10G
    port-leds-sfp28: blue 25G, green 10G, cyan 1G
  management:
    mgmt-ports: 1x RJ-45 1000BASE-T management, 1x RJ-45 serial console, 1x USB Type-A storage
  compliance:
    emissions: >-
      CE Mark, EN 55032 Class A, EN 55035 Class A, EN 61000-3-2, EN 61000-3-3, FCC Title 47 Part 15 Subpart
      B Class A, VCCI Class A, CNS 15936 (BSMI)
    immunity: EN 55024
    safety: >-
      UL (CAN/CSA 22.2 No 62368-1 & UL62368-1), CB (IEC/EN60950-1 & IEC/EN62368-1), BSMI CNS15598-1
    rohs: RoHS 2.0, WEEE Directive 2002/96/EC
  lifecycle: {eol: none-announced}
