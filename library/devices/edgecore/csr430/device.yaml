    empty: >-
      DECLARED EMPTY, not merely undrawn - the distinction docs/deliberately-empty-faces.md draws. The
      datasheet's key features say "All ports, PSUs and fan modules are front access" and "Maintenance
      activity to replace PSUs and FANs can be done from the front panel without remove the product from
      rack", so nothing a technician touches is on this face. The quick start's callout 11 names a grounding
      screw without locating it, and neither document draws the face. So: no figure, and a stated reason
      there is nothing to draw but the grounding point.
  top:
    size: {w: 440.0, h: 300.0}
    empty: >-
      Not drawn by any staged source, and nothing on the lid is claimed - not a vent field, not a label,
      not a screw pattern.
  bottom:
    size: {w: 440.0, h: 300.0}
    empty: >-
      Not drawn by any staged source. A face that sits on rails, is never serviced and carries no connectors
      gets no figure, which docs/deliberately-empty-faces.md records as the normal case rather than an
      omission.
  left:
    size: {w: 300.0, h: 44.0}
    empty: >-
      Not drawn by any staged source, and this is an airflow face: the box is side-to-side and the fan
      tray's own arrow points across it. What crosses this panel is the whole cooling story and no figure
      shows it.
  right:
    size: {w: 300.0, h: 44.0}
    empty: >-
      Not drawn by any staged source. The other airflow face - the fan tray is at this end of the front
      panel and its AIRFLOW arrow points this way.
configurations:
  ac:
    kind: base
    default: true
    power: ac
    description: >-
      Two hot-swappable AC supplies and the fan tray. This is the variant the datasheet's upper front
      elevation draws. No ordering matrix is published for this model in either staged document, so the
      configurations carry no part numbers.
    bays: {psu-1: edgecore/csr310-psu-ac@1, psu-2: edgecore/csr310-psu-ac@1, fan-tray: edgecore/csr310-fan-tray@1}
  dc:
    kind: orderable
    power: dc
    description: >-
      Two hot-swappable DC supplies, otherwise the base box. This is the variant the datasheet's lower
      front elevation draws - the figure every coordinate here is measured from - and the quick start
      ships four ring lugs with it.
    bays: {psu-1: edgecore/csr310-psu-dc@1, psu-2: edgecore/csr310-psu-dc@1, fan-tray: edgecore/csr310-fan-tray@1}
