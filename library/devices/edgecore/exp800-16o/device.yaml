configurations:
  ac-f2b:
    kind: orderable
    description: >-
      Dual AC PSUs, front-to-back airflow - red handles and red release latches, which is the build both
      staged photographs show and whose fan bars are stamped F2B.
    default: true
  ac-b2f:
    kind: orderable
    description: >-
      Dual AC PSUs, back-to-front airflow. The vendor's product page offers "front-to-back or back-to-front
      airflow options"; THIS DEVICE'S OWN GUIDE DOES NOT STATE THE COLOUR RULE, so the blue handles and
      latches are this line's convention applied here rather than a quotation. See roc-ops/Portrayal#277.
    airflow: back-to-front
    region-context: {exhaust: Intake}
    component-attrs:
      exp800-fan: {handle-finish: '#3d7bd6', airflow-legend: B2F}
      exp800-psu-ac: {latch-finish: '#3d7bd6', latch-edge: '#234b8c'}
references:
- title: Edgecore EXP800-16O 16 x 800G OSFP Programmable Switch Data Sheet
- title: Edgecore EXP800-16O 800G Ethernet Switch Quick Start Guide E052026-CS-R02
- title: >-
